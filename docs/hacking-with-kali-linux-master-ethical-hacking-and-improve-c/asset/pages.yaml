    you can work with when it is time to focus on an infiltration test.


    The first phase is known as the agreement phase. During this phase, there is some
    kind of mutual agreement between the parties. This agreement will cover all of
    the high-level details and methods we need to follow and the number of exploitation
    levels you will go through. The attacker is not going to be able to bring down
    the production server, even if the testing has been done at non-peak hours.


    There are a number of things that you and the client need to discuss when it is
    time to perform this penetration test. You will most likely need to sign a non-disclosure
    agreement to tell that you will only share the details of the test with the company
    you are working with, and no one else, and this is often going to tell us what
    else has to happen. There may be some rules about what you can access, what techniques
    you can use, and even when you can perform the testing so it does not interfere
    with some of the work the business needs to focus on.


    If this is your own computer system, then this is not going to be a big deal.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'You will not need to go through all of this process in order to see results.
    But you will find that if you are working with another company or client, there
    are often safety concerns you need to work in order to see the results you want
    and to make sure everyone is on the same page the whole time.


    Once you are both on the same page and have discussed the rules you will follow,
    it is time to work on the planning and the reconnaissance. In this phase, you
    will go through and gather up as much information about your target as you can
    find. This is the client in this situation, but you need to make sure you can
    get as much information as possible and to see what information is out there and
    available to the public.


    This is the first step a hacker will undertake when they are trying to gain access
    to your client, so you need to take this step as well. You want to take a look
    at the domain details, network topology, mail servers, and IP addresses and any
    other information found online for your client. Hopefully, they have been doing
    a good job with some of their work already, and you will not have to worry about
    this. But most of the time, your client is surprised at the amount of information
    that is already out there and available to a hacker to use against them.


    An expert hacker is already going to spend quite a bit of their time on this phase.
    This helps them to make a map of the network and will ensure that they will find
    more potential places for the vulnerabilities. As an ethical hacker, you want
    to be able to take a look through this as well and see what you can learn about
    the system as well.


    Now we are ready to move on to the third section or phase of this. This is the'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'phase where the attacker can interact with the target, and they will try to
    identify some of the vulnerabilities there. An attacker will send off some probes
    to the target and then can record the response to the target to the different
    inputs.


    This is a helpful phase because it will tell the hacker how much security is on
    the system or not. If the hacker can send in a lot of information and a lot of
    input without issues, then this may be a sign there is a lot of availability for
    them to get into the system. If it is a bit harder to do this, you will find that
    a lot of the ports during this phase are blocked off.


    This phase will include a few steps, including scanning the network with a lot
    of scanning tools, identification of some of the share drives that are open, open
    portals of FTP, services that are running, and so much more. When we are working
    with the web application, the scanning part could be either static or dynamic.
    In a static form of scanning, the application code is scanned by an expert application
    vulnerability analyst.


    The aim of working through this part is to identify some of the vulnerable functions,
    the libraries that are there, and some of the logic that is being implemented
    in the process. When you are working with a dynamic type of analysis, the tester
    will pass through a lot of different inputs to the application, and then will
    work to record some of the responses. The various vulnerabilities like injection,
    cross-site scripting, and the execution of the remote code can all be things we
    will identify in this phase.


    At this point, the hacker has spent a lot of time taking a look at this system
    and trying to figure out what information is found inside of it. They should'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'have a good idea of where they can exploit and what areas they want to try
    and attack first. And that is why the next phase is gaining access to the system.


    Once the vulnerabilities have been found by the hacker, the next thing that they
    need to work with is a way to exploit the vulnerabilities with an aim to gain
    some access to the target. The target can be a lot of different things, including
    the server, a secured zone, firewall, or a system depending on where the hacker
    could find the vulnerability in the first place.


    While we are in this phase, be aware that not all of the vulnerabilities you find
    will lead you over to this phase at all. You need to not only find these vulnerabilities,
    but you also need to find the ones that are exploitable enough that you can use
    them in order to gain the access you want from the target.


    Next on the list is maintaining access. If you were successful at finding a good
    vulnerability that allowed you to get on the system, then it is time to make sure
    you can maintain the access you have gained. And you need to be able to do this
    in a manner that you will not be found. This is a challenge in some cases because
    you want to be able to stay on the system and see the results you want, without
    someone else noticing you are there. once you are found, then the system will
    make sure you are kicked off, and you will not be able to go any farther.


    That is why this step is all about ensuring the access we were able to gain is
    maintained. This is important to make sure we can keep our access to the system,
    even if that system is reset, modified, or rebooted. This kind of persistence
    is used by hackers who want to live in the system and gain some'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'knowledge about what is on it, what information is inside, and more, over a
    period of time. Then, when they are certain the environment is suitable and ready
    to use, the hacker will go through and exploit what they have found in there.


    This is the part where the hacker will get some of the information that they want
    and cause some of the chaos that they want. This is also going to be the part
    where a lot of businesses need to be careful about what is going on around them
    because when the hacker can get to this part, they will end up with some issues
    as well. It is best if the hacker can be stopped before this point, and that is
    part of why we will work with the infiltration testing.


    This is the phase where most of the actual damage of a hacker is done. The attacker
    will try and get ahold of the data, compromise the system or the network in some
    manner, launch their attack, and more. This is the phase we will control in infiltration
    testing to ensure the mayhem you cause is kept to a minimum. But it is still a
    good idea to gather an idea of what the hacker would be able to do if they were
    able to get on the system.


    This is the phase that is modified a bit. A dummy flag is placed in the zone that
    is critical to know about later. The aim of the exploitation phase is to go and
    get the flag. Revealing the contents of this flag is often going to be enough
    in order to ensure the network could be exploited if nothing is done about this
    process.


    Once the infiltration test is all done, the final aim or goal that will happen
    here is for the hacker or the penetration test to collect the evidence of the
    exploited vulnerabilities, and then report this back to those in charge for the'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'client. Often this allows them to figure out how to review and what actions
    to take. Now, it is the management''s decision here to figure out how to address
    the risk. Whether they want to accept the risk, transfer it, ignore it, or do
    something to keep the information safer, they can take the right actions at this
    time.


    # ## The Methods of Penetration Testing


    There are a few different types of penetration testing you can work with. These
    can be categorized on the basis of the position of the infiltration tester, and
    the knowledge that the tester has about the target. There are a few other types
    of parameters that can fall into the categorization of the infiltration that is
    happening:


    # ### Black Box, Gray Box, and White Box


    This is the first type of penetration method we can work with. When the tester
    is given all of the knowledge about the target, this is known as an infiltration
    test that is a white box. The attacker will know everything they need in order
    to get things taken care of, including code samples, controls that are in place,
    the IP address, and more.


    There can also be times when the attacker is not going to have any knowledge of
    their target. They are going in with no information and seeing where they will
    see where they can get with some work. This is known as the infiltration test
    that is a black box. Please note that the tester can still have all of the information
    that is available publicly to others about the target.


    And then, when the tester can have some partial information about the target,'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'then they are working with a penetration type known as a gray box. In this
    case, the attacker has a bit more information about the target than what the public
    could find, like IP addresses and URLs, but they are not going to have complete
    knowledge or access to the system at all.


    # An External and Internal Penetration Test


    If the penetration test is one conducted from outside of the network, then we
    are working with a type of penetration testing that is external. But if the hacker
    is someone who is inside the network, such as an employee or someone the company
    hires to be on the network, then this is a good example of an infiltration method
    that is internal.


    When the attacker or the hacker is an internal person who is getting onto the
    network, the knowledge about the system and the target is very high, which is
    why these are more effective than other methods. Those who conduct the attack
    from outside of the network can be successful in some cases, but they will find
    it more difficult because they do not have the same information as others.


    # Third-Party or In-House


    When the test is done by the security team that is in-house, it will basically
    be a type of penetration testing that is internal. Companies who will hire an
    organization that is the third party to do these tests for it, then this is known
    as infiltration testing that is third-party.


    # A Double-Blind and Blind Penetration Test'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'When we are working with a blind penetration test, we will see that the hacker,
    or another person who is working with infiltration testing, will not receive any
    information about the company or the client besides their name. The tester will
    have to do all of the work here, just like a real hacker would try to do. This
    one will take up more time, but the results we will see are more closely related
    to some of the practical attacks we see.


    Then we can work with a type of penetration test known as a double-blind test.
    This is similar to a blind test, but the security professionals will have no idea
    when the testing will start. Only senior management will have this kind of information.
    This is done because it will test the controls, the awareness, and the processes
    of the security team, and see if things will happen when people act the same way
    that they do on a day to day basis, rather than how they behave when they know
    an attack is about to happen.


    # How Important are Penetration Tests?


    While we are here, we can take some time to see how important a penetration test
    can be to your business. For a company, the most important thing they can do for
    their business is continuity. The second thing they need to work on is supporting
    services that will ensure the business can run as smoothly as possible.


    Thus, to make sure the senior management of the company is involved and can pay
    the right amount of attention, the infiltration testing can highlight the risks
    that any business can face due to some of the findings that are done in this process.
    Let’s discuss a few of the things that a penetration test will allow your business
    to do.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'First, it will ensure that any of the weaknesses that show up in the architecture
    of your coding language are fixed and identified before a hacker can find and
    then exploit them. When this happens by a hacker rather than you finding them
    and preventing them, it will cause a lot of loss to your business, and can even
    make it, so you are unavailable to provide services to your customers.


    Organizations in our modern world will need to comply with a lot of different
    compliance procedures and standards. A penetration test is one of the best ways
    to ensure the gaps in the security of the company are fixed so this company can
    meet with the compliance the way they are supposed to. One example of this is
    with PCI-DSS. This is a company that will deal with the information for credit
    cards and helps other companies who take this kind of information. And one of
    the ways these companies because PCI-DSS certified is to make sure they do their
    penetration testing on a regular basis.


    Infiltration tests are a big eye-opener or a check on the internal security team
    of an organization. How much time does it take for the team to identify attacks
    and take responsive steps? Does the team realize one of these breaches happened,
    and how long did it take them to notice what was happening? If yes, what did the
    team do, and when they did it, was that sufficient to get things done and keep
    the information safe and secure?


    In addition, this will help us figure out what the real effect is on the company
    if one of these attacks does occur. We can use this kind of testing to see what
    damage can be done and then calculate the potential loss to the company from this
    kind of attack and nothing is done. Of course, these is some'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'theoretical kinds of numbers, and it is hard to know for sure, but we can often
    take a look at what would happen if they broke into the credit card system, for
    example, and how much that would cost the business.


    It is important to do this kind of infiltration testing because it will allow
    us to see where the vulnerabilities of the system are, and how we can fix them
    in order to keep our customers’ information as safe as possible. You do not want
    to leave it all to chance because once a hacker can get onto the system, it could
    not only cost you a lot of money, but it could cost your customers a lot of money
    and time, can run your reputation, and if you are found to be in violation of
    the compliance rules, it could get a lot worse.


    Many companies will hire out some of this work because they want to make sure
    that someone on the outside to see if they can get onto the system and cause some
    of the issues. The tester can go through and figure out where the issues are,
    and then will make some of the necessary reports and suggested changes the company
    can choose to follow.


    Often this is something that is a big eye-opener to a lot of companies. They may
    have not realized there were so many problems with their system. And sometimes,
    these issues show up, even when you go through and deal with a security team that
    is supposed to protect your system. But even with the recommendations from the
    penetration tester, it is still up to the business to determine what they want
    to do with the information, what steps they want to take, and how they will deal
    with the vulnerabilities and make it all better.


    It is not the job of the penetration tester to fix the issues in the computer
    system unless this is your own personal computer that you are trying to work'
  merge: -1
  img_proc: true
- pgno: 53
  md: with. This is the work of the top management of the company you are working
    with to determine how they want to handle some of these issues, and what steps
    they will take to make it a bit better. However, the infiltration tester can provide
    the top management with the suggestions and recommendations they can follow.
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # CHAPTER 6: HACKERS: HOW TO FIGHT THEM


    Another topic we need to spend some time learning about in this process is the
    different types of hackers that we will encounter throughout our time in cybersecurity.
    You will find that there are actually quite a few different types of hackers,
    but we will spend some time looking at the three main types of hackers that we
    can work with.


    In this chapter, we will focus on black hat hackers, grey hat hackers, and white
    hat hackers. While all of these individuals will employ some of the same ideas
    and techniques in order to get the work done with hacking and getting onto a system,
    they are all going to have different motivations behind the work they are doing.
    With this in mind, let’s take a look at some of the different things we need to
    know about hackers and how each of these main types is similar and different.


    # ## Black Hat Hacker


    The first type of hacker we will take a look at is a black hat hacker. This is
    the type of hacker we will hear about when we hear anything about hacking. This
    is the type of hacker we will hear about from television, movies, shows, and even
    from the local media. This is what has given all of the hacking that we ever hear
    about a bad reputation overall, but it is important to take a look at all of the
    different types of hackers so we can understand how this world works.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'To start, a black hat hacker is someone who works to find the vulnerabilities
    of a computer security system and then will exploit these vulnerabilities for
    personal financial gain or for some other malicious reasons. This will differ
    a bit from the white hat hackers that we will take a look at later. The black
    hat hackers will try and use the system for their own personal gain while the
    white hat hacker is someone who works to find and patch up the security flaws
    that a black hat hacker may try to use for their own gains


    It is possible, if you are not using the proper security measures, that a black
    hat hacker will inflict a lot of damage on your system, whether it is an individual
    system or a large company, but stealing some of the personal information that
    is there, compromising some of the security that is found with major systems,
    or even shutting down and altering up some of the functions that happen with networks
    and websites.


    There are a lot of different options the black hat hacker will work on in order
    to gather the information they want. They could use keystroke-monitoring programs
    to get your username and passwords, and even launching an attack in order to disable
    some of the access that we have to websites that we are using. Malicious hackers,
    in some cases, will work with methods that don''t need a computer to get the data
    they want, such as calling into a system and assuming another identity to get
    the password of that user.


    # # Grey Hat Hacker


    Now it is time for us to move on to what the grey hat hacker is all about. This
    hacker is kind of the middle ground. They are not really hired by the company
    they are trying to get into and gain access to, but they don''t'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'necessarily have malicious intent for doing this kind of hacking either. This
    is kind of a grey area between the two, and that is why we are working with the
    grey hat hacker in this section.


    A grey hat hacker is a professional who may violate some of the ethical principles
    and standards of the computer security world, but they do that without some of
    the malicious intents we will see with the black hat hackers we talked about above.
    These hackers are often going to engage in some practices that are technically
    not legal, and are not going to seem like they are above board, but they are often
    doing it to operate for the common good in the process.


    We can think about these grey hat hackers as more of the middle ground. They are
    not really allowed to be on the system, so what they are doing is illegal. But
    they are doing this in order to figure out the vulnerabilities and keep the users
    and safer and informed, rather than stealing the information and using it how
    they want, before alerting other black hat hackers about these vulnerabilities
    too.


    Many times, when we are talking about hacking, people will see this and IT security
    as a world that is more black and white. This kind of hacking through will have
    an important role when we are looking at the environment of security. One of the
    biggest examples of this kind of hacker that we will see is when someone will
    exploit a vulnerability of a network in order to spread out some awareness to
    customers and others that there is this kind of vulnerability.


    In this case, experts will say that the difference between the grey hat hacker'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'and a white hat hacker is that the grey hat hacker will exploit the vulnerability
    in a more public manner. This can still allow other hackers to take advantage
    of what is going on and cause issues. But on the other hand, when we are working
    with a white hat hacker, we may see that they are doing this in a privately and
    then will alert this to the company without these results going public.


    # White Hat Hacker


    And last, but not least, we need to take a look at what the white hat hacker is
    all about. This is an individual who is often ignored, or at least not thought
    about when compared to the other types of hackers. But they are still able to
    do a lot of the same kinds of processes and hacks that the other two categories
    can do as well. These individuals will focus more on helping others and making
    sure businesses and others stay safe, rather than working to steal information
    and cause trouble.


    A white-hat hacker then is a specialist in computer security who can break into
    a system or a network that is protected, and then test and assess the security
    that is on that kind of network. These hackers can use some of their own skills
    in order to improve security for a company by exposing vulnerabilities before
    some of the malicious hackers, or some of the black hat hackers we talked about
    above, can find those vulnerabilities and use them for themselves.


    Although the methods the white hat hacker will use is similar to what we see with
    the black hat hackers, the first group actually has permission to use some of
    their tactics against the organization that has gone through and hired them in
    the first place. These individuals may work on a freelance kind of'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'basis, or, in the case with some of the larger corporations who are under attack
    all of the time, they may employ a team of these specialists at all times.


    These kinds of hackers are seen as the ones who will use their skills in a way
    that can benefit society and others around them. They are sometimes even reformed
    black hat hackers, although, for the most part, they are individuals who have
    gone to school and are more versed in some of the techniques and methods that
    a hacker will use. It is possible for any company to hire these individuals to
    help them get their network secure and ready to stay as safe as possible.


    There are a lot of ways a white hat hacker can help a business they are employed
    for. Depending on the issue going on, these individuals or specialists can help
    out with tests, while also implementing some of the best practices that will help
    companies and organizations be less vulnerable to malicious attempts of hacking
    them and their information in the future.


    # Other Types of Hackers


    In addition to some of the hackers that we have listed above, there are a few
    other types, and we will spend a few moments talking about these and what they
    can do, and how they are different from some of the other three we already looked
    at.


    The first option is a Script Kiddies. This is more of a derogatory term that is
    used by amateur hackers who are not going to care as much about learning the right
    coding skills to get the work done. These hackers are the ones who will download
    tools or use codes that were already available and written by someone else to
    do the hacking. The primary purpose of doing this is to'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'impress their friends or even to gain a bit of attention along the way.


    However, these individuals will have no want or interest in learning about how
    hacking works. By using these codes that someone else has taken the time to write
    and work on, these hackers can launch an attack, without taking the time to look
    at the quality of the attack they are doing. The most common cyber-attacks by
    these individuals will include options like DDoS and DoS.


    We will also see that there can be a green hat hacker. These are the amateur hackers
    of the online world. They can be similar to the script kiddies from before, but
    they have a key difference in that they are willing to learn how to become a full-blown
    hacker, they just don’t have the skills yet. This is what you may be when you
    start out with this guidebook, ready to learn how to get started by not quite
    sure how to do it all yet. You may find that these individuals is very involved
    in their hacking communities and asking a ton of questions along the way.


    The way that you can identify these individuals from the script kiddies is by
    their spark and interest in learning more about the world of coding. Once you
    answer one question for them, they will listen and then ask a lot of other questions
    with an intense desire to learn and figure out what will work for the next.


    Blue hat hackers. These is another form of novice hacker that will have the main
    agenda that is to take revenge on those who have made them angry. They want to
    hack because they see it as a way to have revenge on them. They have no desire
    for learning and may use simple cyberattacks like flooding your IP with a lot
    of packets, which will result in DoS attacks.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Red hat hackers are the next on the list. These individuals will have a similar
    agenda to what we see with a white hat hacker, which is a simple way to say they
    will try to halt the acts of the black hat hackers. However, the way that they
    operate these individuals are ruthless when it is time to fight off the black
    hat hackers.


    Instead of just reporting one of the malicious attacks that they see, these individuals
    believe it is better that they take down that black hat hacker completely. They
    are more than happy to use revenge against these black hat hackers with a series
    of aggressive cyberattacks and malware on that hacker. In some cases, this can
    get so bad the black hat hacker will need to go through and replace their whole
    system because they can’t fix what has happened.


    Hacktivist is the next type of hacker that we need to take a look at if you have
    ever spent some time and seen a social activist propagandizing a social, religious,
    or political agenda, then you may at some point meet a hacktivist as well. This
    is basically the online version of what you will see with an activist, even though
    there are some key differences that show up.


    A hacktivist is a hacker or even a group of hackers who remain anonymous, who
    think that they can bring about some kind of social change based on their actions.
    And often, they will hack into organizations or the government to gain attention.
    Sometimes this is just done in order to share how displeased they are over the
    other line of thought that may oppose their own as well.


    And finally, we will take a look at the idea of a malicious insider or a'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'whistleblower. This will often be some kind of employee who has a grudge against
    the company or a strategic employee who was compromised or hired by the rivals
    in order to garner some big trade secrets of their opponents in order to help
    them stay on top of their game.


    Often this kind of hacker will take privilege from their easy access to information,
    and the kind of role that they have inside of that company, to hack through the
    system and cause the problems that they want. This makes it easier for them to
    garner that information because they are already seen as being on the inside of
    the company, and it is possible that they already have a lot of the needed access
    rights that are needed to get into this kind of system.


    Because there are so many different types of hackers, you can work with on a regular
    basis. You will find that it is always best to err on the side of caution and
    watch out for some of the potential hackers who may try to get on your system.
    Whether you are worried about your own individual system or you are in charge
    of a large system that needs some care and attention, make sure to be on the lookout
    for those who want to do you harm along the way.


    For the most part, even though the goals and the objectives of each kind of hacker
    is slightly different, they will rely on a lot of the same techniques and more
    to get the work done. This is important in order to ensure we can see some good
    results in the process and that we can actually use the same techniques as the
    bad guys in order to keep our systems safe and secure.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ## CHAPTER 7: MORE CYBER ATTACKS:

    KNOWING THEM TO DEFEAT THEM


    We also need to take some time to look at the different types of attacks the hacker
    can use against us. There are many different ways a hacker can get ahold of our
    information and get into the system we are using, and if we are not careful with
    what we are doing, we will end up with a system that is compromised and with a
    lot of information that is stolen and used against us.


    Because there are just so many ways that a hacker can go against us and get on
    our systems, it can be a difficult task for us to keep the hackers out and to
    know where they will come from next. The more we can learn about these attacks
    and work to prevent them from our knowledge, the better off we is. With this in
    mind, you will find that there are many attacks, and some of the most common ones
    will include:


    # ### Man in the Middle


    The first type of attack that we will spend some time exploring is known as a
    man in the middle attack. This is where a malicious hacker will work and take
    the right steps in order to insert themselves between two parties, without being
    seen, in a communication. The goal is to do this without being detected, and for
    the hacker to impersonate both sides that are going on in this exchange. The hacker
    can intercept, send, and receive the data meant for either user. Sometimes depending
    on the information that is being sent, the information handed to the hacker cold
    be passwords and account numbers.


    A typical kind of communication flow will happen between the server and'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'the client. To access your bank account, for example, you would need to get
