    # Spoofing


    And the final type of malware we will take a look at is known as spoofing. In
    general, we will find that spoofing is the fraudulent practice in which communication
    is sent from an unknown source, and it is disguised as a source that is known
    to our receiver. Spoofing is seen when there are mechanisms of communication that
