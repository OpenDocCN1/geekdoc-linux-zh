- pgno: 17
  md: '# ## CHAPTER 2: REQUIREMENTS TO UNDERSTAND THE LANGUAGE OF KALI LINUX


    Now that we have a better idea of how we are supposed to work with the Kali system
    and how it is such an important part of the process of working on our own hacks
    and more, it is time for us to dive into some of the specifics about actually
    coding with this language compared to some of the others. We have already seen
    some of the reasons why this is the preferred method to work with when it is time
    to check your system and keep it safe from hackers, and now it is time for us
    to learn some of the basics that will help us to make this happen.


    One thing to keep in mind with this, though, is when we talk about hacking in
    this guidebook, we are talking about ethical hacking. Our goal is not to jump
    onto other computers and start causing issues and stealing information. Instead,
    our goal is to learn how to use these features in order to understand our own
    networks and to keep the unethical hackers out of our way.


    Of course, you will quickly find that both of these will have the same ideas and
    techniques that you will work with. This is because we want to use the same processes
    and techniques as an unethical hacker, but on our own system, or a system we are
    asked to protect, in order to learn how an unethical hacker will get onto our
    systems. This will take some work on our part, and it may seem like we are doing
    things that we should not, but overall, this is the best way to find the potential
    vulnerabilities of our system and to'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'ensure that we can keep our system as safe and sound as possible.


    With this in mind, it is now time for us to take a look, not only at the basics

    of the Kali Linux system, but also some of the different codes we can use in

    the command line. These command-line codes is important because they are

    what will tell the system how you want it to behave and what work you want

    it to do. So, let''s get started:


    # Basic Commands for Kali Linux


    There are a lot of commands available for this kind of system. They are there

    to help us to handle or to run any kind of documents, create documents

    maintain our directories, and write other scripts we need in the Linux

    platform. There are many of these commands, and we will spend some time

    looking at the most basic and how we can make them work.


    The first basic command we will look at here is the command to bring out the

    date. This is a common and simple command, but it helps us to see a bit more

    about how this language works and how we can get all of the parts to work

    together in the way we want. This one will work because we will use it to

    display a normal date with time on the screen of the Linux system. It is also

    possible to get some of the custom dates to show up, which is handled when

    we use the specific command below:


    ```

    ```bash

    # date-set = ''17 Jan 2019 12:16''

    ```

    ```


    When we go through and work on this code, we will get the result of January

    17 at 12:16 EDT 2019.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Another type of command we can work with to get more familiar with working
    in Kali Linux is a command to display a calendar for us to use. This is the command
    of “cal,” which will help when we want to display one of the proper calendars
    on our terminal screen. Our hope is we can do this in order to get it in a manner
    so others can see the local date on that calendar.


    There are also a number of different packages available in the case of the Kali
    Linux command, where people can come in and manage the calendar that they create
    in a different way. Maybe you want to have it go vertically or some other critical
    features with this additional command. This command package that is added in can
    call up the ncal package. Make sure to download this on your system in order to
    get it to work.


    The Who and Whoami commands are next. These is really useful, and even popular
    commands you can use on this platform. The Whoami is a key command that will provide
    us with an exact effective username right away so you can see who is the one involved
    when a specific command has been executed. It can also tell you what is the command
    that gives you all of the logged user detail information, so you know where they
    were when they did it, and more.


    Another command that can be useful in this is PWD. This is a command that stands
    for Print Working Directory. This is a command that is used for displaying the
    specific directory where the command executor belongs to right now. Sometimes
    when we are talking about a user on this platform, it is hard to understand which
    directory that person is in right at that time. This is when we would use the
    PWD command to find them. And if your directory is not secure, a hacker would
    be able to use this to help them get ahold of'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'someone when they want.


    Ls is another common command that beginners need to know. Every user, after they
    have gone through and applied their logic, will go and use this as one of the
    very first commands they execute. The command Ls is actually going to provide
    us with a full list of all the documents available in the directory you are in.


    Of course, there is other extended commands of Ls we can use when it is time to
    manage the display of those files in the right manner. This is used depending
    on what information and what part of the list, such as which files you are hoping
    to gather from there.


    Cd is another command. This is the command you will use any time you are ready
    to change up which directory you are in on this platform. This can be useful as
    you move from one directory to another while doing some of the hacking and the
    coding you want to accomplish with this kind of coding.


    Mkdir: This is another one of the key commands beginners need to know when working
    on the Kali Linux platform. This is a useful one when it is time to create a brand
    new directory to work with this platform. It can also be used with the Cat command,
    which is the one that you can use when it is time to display the entire content
    of just one file. You may bring up the Cat command in order to create or concatenate
    single or multiple files on the platform.


    Cp is the next command to work with, and it is the one that we will use when we
    want to be able to copy the image of an existing file or a directory, and'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'then paste the same thing anywhere else in the platform for Kali Linux, but
    we want the option to use a new file name when we are saving it.


    And finally, out of the basic commands that you can use in this coding platform,
    and to help you to complete some of the hacks that you are doing, is Mv. This
    is a command we can use in order to move the directory or the files we want to
    a new location. When we use this one, we can keep the same content and name for
    the directory or the files we are using.


    # ### Intermediate Commands on Kali Linux


    Once you have had some time to work with some of the basic commands that come
    with the Kali Linux platform, it is time for us to move on to some more commands
    that will help us with some of the hacking and more that we wish to do. There
    is a few other commands with this platform that are popular, and that a lot of
    developers of this platform will use, but they are not going to be as basic as
    we want for a beginner.


    These commands are still going to be really important to learn, even though they
    do require a lot more work for you to execute and use them. Some of the different
    types of commands we can use that fit into this kind of category, and will require
    a bit more intermediate work from Linux is found below:


    +   1. Rm: This is the command we will rely on when it is time to delete or remove
    the files, or more than one file at a time. If we use this command in a recursive
    manner, then it is used to help remove the whole of the directory.

    +   2. Uname: This is a command that is useful when you want to display the current
    system information in a proper manner. It is the one a'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'programmer will want to use when it is time to display all of the information
    in the Linux environment so the system is easy to understand and will go through
    the configuration it should.


    +   3. Uptime: This is the command that will provide us with more information
    about how long the system is up and running.

    +   4. Users: This is a command that will provide us with more information on
    the user. This could include the login of that user and even information on who
    is logged into the Linux system at the time.

    +   5. Less: This command is used to help display the file without having to open
    it or use the vi or cat commands. This is a very powerful command you can use,
    and it extends out the capabilities of the "more" command in this environment.


    # ## Advanced Commands


    As you work with the Kali Linux system, you will find that some of the work you
    want to complete with this and for hacking is more advanced. This will mean that
    we need to spend more time and effort figuring out how to make it all work, and
    how we can use the different parts. Even if you are a beginner with the Kali Linux
    system and how it is meant to work, it is still important for us to take some
    time to learn the more complicated parts, and figure out how we can bring it all
    together.


    Some of the more critical tasks needed to make the commands work in Kali Linux
    is in this section. These tasks will need commands that are more complex in order
    to get the work done. They are often going to be the ones the management of the
    company will use in order to sort, identify, or modify a file, some writing in
    the shell scripting, the job scheduling, and more. Some of the more advanced commands
    you can use inside of this kind of coding'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'language will include some of the following:


    +   1. More: This is a command that is used in order to display some of the proper
    output in one page at a time. This makes it useful for us to read through a long
    document or file without having to scroll through to get it all done.


    +   2. Sort: This is used when it is time to sort out the content you want into
    one define file that is specific. This is also going to be useful when it is time
    to display some of the critical contents that are in a big file in a sorted order,
    as well. If the user includes a commanding with it, then it will provide us the
    reverse order of the content.


    +   3. Vi: This is one of the key editors you can use with the Linux or a Unix
    platform at any time you want. There are two modes that come with this one, normal
    and insert depending on your needs.


    +   4. Free: This is the command that will provide us with some more detailed
    information about the free amount of Ram or memory available on that system, so
    you know what you can do with that space when it is needed.


    +   5. History: This is the command you will use to see what kind of history is
    being held and executed on the command on this kind of platform when you need
    it.


    # Tips to Work on These Commands


