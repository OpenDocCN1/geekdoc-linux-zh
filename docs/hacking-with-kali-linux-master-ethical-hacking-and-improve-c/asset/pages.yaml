- pgno: 10
  md: '# CHAPTER 1: BRIEF HISTORY OF KALI LINUX


    If you have ever tried to go through and test your system for vulnerabilities
    or crack Wi-Fi passwords on your network, then it is likely you have been familiar
    with Kali  Linux. It is a security-focused version of Linux that will offer us
    a lot of tools that will help us with hacking our own networks so we can seek
    out a weakness, and secure the network from other hackers who may try to get onto
    your system.


    In the beginning, this system was made out of necessity for lead Kali developer
    Mati Aharoni. While doing some professional security work, this developer found
    out he needed to come up with a lot of security tools without having to go through
    and install a lot of software and other things onto the systems of his clients.
    And so, he took to Linux to see what he would be able to do in order to deal with
    this issue all in one.


    The idea of this kind of distribution will contain a bunch of security tools born
    out of necessity. Aharoni was facing a dilemma when it came to security engagement
    with their customers. He was not allowed to bring on any kind of hardware to the
    engagement, and often you would only be able to use the onsite computers as long
    as you would not get on the hard disks or modify them in any way.


    This is a pretty standard procedure. These companies want to get the most security
    out of their computers and want to make sure there isn’t a way for a hacker to
    get on. But they do not want a lot of things changed or modified on'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'their system at all. You have to be careful and still make sure you find all
    the vulnerabilities.


    After Aharoni spent some time thinking about the problem, he could figure out
    that these conditions for work may seem impossible, but he could meet them simply
    by going through and adding in a few tools. And all of these can be added to the
    existing bootable Live Linux CD. This made it easier for everyone to use the system
    the way they want without issues.


    Once this was created, it was possible to bring in the CD, or in our case the
    bootable USB drive, to the engagement area, boot all of this on the computer you
    want to work with, no matter where it would, and then work right on the RAM, which
    is not going to cause any issues to the hard drive or anything else. When it is
    done, you could either reuse the drive if you want, or you could destroy the bootable
    drive and then just download it again if you need to use it in another situation.


    Over time, this will change, and there are new downloads and updates that have
    come with Linux. Kali Linux overall was born out of an understanding that it was
    time to take the previous eight years of experience in building up a Linux Security
    Distribution and then apply them to a new and clean canvas. The original form
    of Linux was a great way to deal with hacking and deal with all of the different
    parts that come with it. But then Kali Linux helped to polish all of this and
    could spend some time to really work with this and see some great results.


    What this means is that with the original hacking with Linux, we need to go through
    and tear down everything done up to that point and start out with'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'something fresh. This process was a bit terrifying for the developers who worked
    on this as well as liberating because it meant they had to let go of some of the
    distributions overall, and this was hard. But on the other hand, it did allow
    them a chance to go through and rebuild, and even expand, our current systems
    in order to create something better.


    Once the Kali Linux developers were able to make some of these hard decisions,
    they figured out that the next step they had to work with was to involve some
    people in this system who actually knew what they were doing. This was when they
    brought in a new developer from Debian who could help them to build up a new development
    infrastructure from the ground up. This assistance was helpful to the project
    and ensured Kali Linux would be as successful as possible.


    One of the goals that came with Kali is that it would provide images of the operating
    system we can use for a lot of exotic hardware, mainly ones that were based on
    ARM. This will include everything you need to use, including Android TV devices,
    tablets, Raspberry Pi, and more. And each piece of hardware we will work with
    has a unique property.


    For example, the MK808 comes with a dual-core CPU with a whopping 1GB of RAM,
    while still having the form factor of a medium-sized USB dongle. Imagine it! This
    is a great and powerful hacking computer, battery-powered, in your pocket. Think
    about how great this is for your whole hacking and security system.


    So, we need to then decide which type of this hardware to target. That depends
    on several things. Availability is the main obstacle. We will try to'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'identify interesting hardware that is used in an interesting manner when it
    is time to handle a security assessment, and if such is found, it is possible
    to build up Kali to work with this. However, right now, there is a wide array
    of hardware supported by Kali, and this list will keep on growing every month.


    One of the biggest concerns with the Kali Linux was the move from BackTrack to
    Kali, which ended up causing us to rebrand. After so many years of being a major
    force in the security community, BackTrack was something that was known by all.
    If we suddenly changed this around, it would be a bit hectic and confusing for
    some of the users, and they were uncertain about how to handle this and get people
    on board with it.


    The good news is that a lot of different programs rebrand all of the time. This
    is hard to do, and sometimes it can be done in a poor manner. But they have to
    do this sometimes. Rebranding is tough in some cases, but the developers who worked
    on changing their brand over to Kali decided it was worth the time.


    There are a lot of different options and benefits of working with the Kali Linux
    system, and it is worth your time to learn how to work with this for some of your
    own needs. The first benefit of working with Kali Linux is it is free. Even though
    you will not have to pay anything to use this system, it will come with an advanced
    suite of all the tools you need to keep your system safe and sound. Just as the
    Linux operating system is open-source, Kali is available for you to use for your
    whole life, free of charge. This is one of the first things that draw a lot of
    developers over to using this for some of their security needs.'
  merge: -1
  img_proc: true
- pgno: 14
