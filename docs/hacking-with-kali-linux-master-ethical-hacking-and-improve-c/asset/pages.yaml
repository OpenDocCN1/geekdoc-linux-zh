    # **Dictionary Attack**


    The next kind of attack we will take a look at is known as a dictionary attack.
    This is a method or a technique used to breach the security of a computer, or
    a password-protected server or machine. A dictionary attack will try to defeat
    some of the authentication mechanisms because it will go through the process of
    entering each word in a dictionary as the password. It may also try to use this
    in order to determine the decryption key of the message or document that the target
    computer has been able to encrypt before sending it.


    The reason that these are so successful is that businesses and individuals will
    choose ordinary words for their passwords, rather than making it something hard
    to guess. These ordinary words can often be found in any dictionary you want,
    and the hacker will exploit this for their own needs.


    If you have not gone through and picked out a good and secure password for any
    of the systems or websites you like to visit, then you will run into some trouble
    because the hacker will try and gather that information with one of these attacks.
    They may take some time since all of the words in the dictionary have to be used,
    but it is very effective for a hacker.


    The most common method of a user being authenticated through their system is with
    a password. This method will continue for a bit more because it is seen as the
    most practical and most convenient way to authenticate the user who wants to be
    on the system. Even though it is easy to use, this is often going to be one of
    the weakest forms of authentication because the users are not good at picking
    out strong passwords.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Spammers and hackers are more than happy to take advantage of this kind of
    weakness by working with the dictionary attack that we are talking about now.
    These individuals will try to get onto your system simply by trying out all of
    the different passwords that they can think about until they find the one that
    lets them on.


    The good news here is that there are a few countermeasures you can take against
    this kind of attack. These will include:


    +   1. Delayed response: Having a slightly delayed response from your server is
    helpful because it will prevent the hacker from checking out more than just a
    few passwords in a shorter period of time.

    +   2. Account locking: This is where the account is locked out after a few attempts
    of the password that are not successful. This will make it impossible for the
    spammer or the hacker to check more than a few passwords at a time.


    These attacks is the most effective when the user is not careful with the kinds
    of passwords that they are choosing. If you go with a really strong password or
    you go with a system that needs more than one passwords, then this will make it
    harder for this kind of attack to work the way that the hacker wants.


    # DOS and DDOS


    Denial of Service, or DOS, the attack is used in order to deny some of the legitimate
    users any access to a website or a resource. They may have trouble getting onto
    a network, an email, or a website, or they will make use of it really slow. This
    attack type is done by a hacker who can hit the target'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'resource, such as the webserver, with way too many requests all coming in at
    the same time. Because of this rush of traffic all at once, the server is not
    going to be able to keep up and will fail. This can either have the server slowing
    down, or the servers will crash down all at once.


    Cutting off some business from being online can cost the business a loss of customers
    and money. The computer networks and internet that we have all come to rely on
    so much will power many companies in our modern world. Some of the organizations,
    such as sites of e-commerce and payment gateways, will rely only on the Internet
    to do business. If they are not able to get online in order to do their work,
    they will lose a lot of customers and money in the process.


    There are five common techniques you will find when we are talking about the DOS
    attack. First on the list is the Ping of Death. This ping command is usually going
    to be done in order to test out whether the resource of that network is available
    or not. It will work because it can send out a small packet of data to the network.
    The ping of death is then going to take advantage of this and sends the packets
    above the maximum limit that the IP or the TCP allows.


    The TCP/IP fragmentation will break up the packets into smaller chunks that we
    are then able to send over to the server. Since the sent packages is larger than
    what our server can handle, it will reboot, freeze, or crash.


    Another attack to worry about is the Smurf. This is a type of attack that will
    use a very large amount of ICMP or Internet Control Message Protocol, ping traffic
    to the target address. The reply IP address is spoofed to look like that'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'of the intended victim. All of the replies are then going to be sent over to
    the victim rather than the IP used for pings. Since a single of these addresses
    can support at most 255 hosts, a Smurf attack will amplify just one of these pings
    by 255 times. The effect is the network will slow down so much that it is almost
    impossible for us to use it.


    Then there is the bugger overflow. A buffer is a temporal storage location found
    in the RAM of our computer that is used to hold onto some of the data that we
    need, allowing the CPU time to manipulate it before we write it back into a disc.
    Buffers will come with a size limit. This attack can load up the buffer with more
    data than it can hold. This will cause the buffer to end up overflowing and will
    basically corrupt any of the data it is holding onto.


    The Teardrop is the next type of data attack that can happen. This attack will
    work with very large packets of data. The TCP/IP will break them into fragments
    that are then assembled on the host that is receiving the information. The attacker
    is then able to manipulate the packets are they are being sent so they can overlap
    one another. What this will do is cause the target system to crash because it
    is busy trying to get those packets back in order.


    And finally, there is the SYN attack. This is short for Synchronize. We will find
    that this kind of attack will take advantage of a kind of three-way handshake
    used to help establish communication between different systems with TCP. This
    one will work because it will flood the victim with SYN messages that are incomplete.
    This will cause the target machine to take resources from the memory it never
    uses and then will end up causing it to deny legitimate users to the system instead.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# ## Ransomware


    There are also several types of malware we need to worry about when it is time
    to protect our data from a hacker. And the first type of malware we will watch
    out for here is ransomware. This is a type of malicious software that can encrypt
    some of the files on your computer, or it can be used in order to completely lock
    you out of that system. It is spread by hackers who will try to lock you out from
    your files, who will then demand some ransom or money from you. They often claim
    that if you pay them the fee, they will give you the key to decrypt the information
    so you can get your files back.


    Often the hackers will not let go of the system all the way through. You may or
    may not be able to get onto your files again, but even if you do, the hacker will
    usually leave something behind on your system, so they can gain access and do
    what they want at a later time. There are also a few different options that we
    will see when it is time to learn more about ransomware, and this will include:


    +   1. Crypto malware: These is some of the most common types of malware that
    we see, and it is surprising how much damage they can cause. Besides being able
    to get more than $50,000 from its victims, one of these types of malware options
    known as WannaCry actually could put thousands of lives at risk when it could
    hit hospitals throughout the world and made it impossible to access the files
    of patients in the process.


    +   2. Lockers: These will infect your whole operating system so you are locked
    out of your computer, and you will not be able to access any of the files or apps
    you want.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '3. Scareware: This is a fake type of software that will come on your computer
    and claim there is some issue on the PC. These will often demand some money to
    fix the issue. Some variants will lock the computer, and others can flood your
    screen with a lot of pop-ups and alerts.


    4. Doxware: This one is often called leaks as well, and it is one that will threaten
    to publish some of your stolen information online if you are not able to pay up.
    Everyone has some sensitive kinds of files on their computers, so it is easy to
    see why this can cause some panic and issues for a lot of people.


    5. RaaS: This one is known as Ransomware as a Service, and it is some malware
    that is hosted anonymously by a hacker who can handle everything in exchange for
    a cut of the ransom that shows up.


    # **Viruses**


    A computer virus is designed so it can spread from one host to another, and it
    is even capable of going through and replicating itself. Similar to a way that
    a flu virus is not able to reproduce without a host cell, this kind of virus on
    the computer is not able to reproduce or do any of the spreading without programming,
    such as a file or a document.


    In a more technical idea, a computer virus is just going to be a type of malicious
    program or code that is written in order to alter the way that our computers can
    operate, and it is designed in a manner that it spreads from one computer to another.
    A virus can operate because it will insert, or even attach, itself to a program
    or document that is legitimate, and then can execute its code when the time happens.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Once a virus has had a chance to attack a document, file, or program, the virus
    will sit there and be dormant until there are some circumstances that cause the
    system to execute its code. For the virus to actually infect your computer, you
