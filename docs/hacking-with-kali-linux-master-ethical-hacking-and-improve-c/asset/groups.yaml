    安装 Kali Linux 选项有多种方法，但我们将使用其中一种最常见的选项，即与另一个操作系统双启动。这允许你继续使用装有常规操作系统的计算机，但可以随时启动
    Kali Linux，而不会占用你系统上过多的内存和空间。


    对于编程和黑客领域的初学者来说，这个系统的安装过程似乎会有点复杂。但这就是为什么我们将花时间研究如何完成 Kali Linux 的双启动，你需要开始的不同事项，以及将帮助你完成这些操作的步骤。我们将看看如何实现这种双启动，以便它可以根据你的偏好与
    Mac OS 或 Windows 操作系统一起工作。


