    # CHAPTER 1: BRIEF HISTORY OF KALI LINUX


    If you have ever tried to go through and test your system for vulnerabilities
    or crack Wi-Fi passwords on your network, then it is likely you have been familiar
    with Kali  Linux. It is a security-focused version of Linux that will offer us
    a lot of tools that will help us with hacking our own networks so we can seek
    out a weakness, and secure the network from other hackers who may try to get onto
    your system.


    In the beginning, this system was made out of necessity for lead Kali developer
    Mati Aharoni. While doing some professional security work, this developer found
    out he needed to come up with a lot of security tools without having to go through
    and install a lot of software and other things onto the systems of his clients.
    And so, he took to Linux to see what he would be able to do in order to deal with
    this issue all in one.


    The idea of this kind of distribution will contain a bunch of security tools born
    out of necessity. Aharoni was facing a dilemma when it came to security engagement
    with their customers. He was not allowed to bring on any kind of hardware to the
    engagement, and often you would only be able to use the onsite computers as long
    as you would not get on the hard disks or modify them in any way.


    This is a pretty standard procedure. These companies want to get the most security
    out of their computers and want to make sure there isn’t a way for a hacker to
    get on. But they do not want a lot of things changed or modified on'
