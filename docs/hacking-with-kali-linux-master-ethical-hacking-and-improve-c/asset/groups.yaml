    \ DDoS 和 DoS 等选项。\n\n- **绿帽黑客（Green Hat Hacker）**\n  我们还将看到可能存在绿帽黑客。这些是网络世界的业余黑客。他们可能类似于之前的脚本小子，但有一个关键区别，即他们愿意学习如何成为一名完全的黑客，只是他们目前还没有这些技能。当你刚开始使用这本指南书时，你可能是这样。你准备好开始学习如何入手，但还不完全知道如何操作一切。你可能会发现，这些人非常活跃于他们的黑客社区，并在过程中提出大量问题。\n\
