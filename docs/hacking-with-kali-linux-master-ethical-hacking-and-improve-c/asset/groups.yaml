    - 2. 最小 4 GB 的 U 盘

    - 3. 系统中至少有一个双核处理器，AMD 或 Intel 都可以很好地配合此用途，且 RAM 最小为 1 GB。

    - 4. Windows 10 或已安装在你的计算机上的其他版本的 Windows。

    - 5. 最新版本的 Kali Linux

    - 6. Rufus

    - 7. 以及完成这一切所需的耐心。


    一旦我们确定拥有所有这些用品，现在是时候学习如何在 Windows 10 程序的帮助下启动我们的 Kali Linux 双启动了。我们需要做的第一步是确保我们下载了该操作系统的最新
    ISO 文件。获取它的最佳地点是 www.kali.org，因为你知道这是官方网站，你不需要担心附带病毒或其他东西。


    你可以选择你想处理哪个版本的下载，然后继续创建一个包含此镜像的可启动 USB 驱动器。为此，我们需要引入扩展，特别是我们将使用 Rufus 扩展。这是一个非常有用的实用工具，因为它允许我们创建一个可启动的
    USB 闪存驱动器。你可以从 www.rufus.ie 下载此扩展，然后安装到你的系统中。


    当你在计算机上拥有以上这两项内容时，现在是时候开始享受创建你自己可启动 USB 驱动器的乐趣了。首先，取出你想使用的 USB 驱动器，然后将其连接到你的计算机。正如上面所说，确保它至少有
    4 GB 的内存来处理，并且有足够的空间来容纳 Kali Linux 操作系统和 Rufus 扩展。


    当你有时间插入你想使用的 USB 驱动器后，我们将运行 Rufus，并使用我们在这里遵循的步骤来帮助我们创建我们自己的可启动 USB 驱动器：


    - 1. 首先，你会看到一个关于你正在运行的 Rufus 程序的屏幕图像。

    - 2. 检查选中的 USB 驱动器是否是你要使用的那个。然后点击 CD 的小驱动器图标。

    - 3. 找到我们之前下载的 Kali Linux 的 ISO 文件，然后点击“开始”。在继续之前，给这个过程几分钟时间完成。

    - 4. 过程完成后，你可以点击关闭按钮来关闭 Rufus 窗口。这将为你提供 Kali Linux 的可启动 USB 驱动器。

    - a. 除了使用它来帮助在 Windows 中进行 Kali Linux 的双启动外，还可以使用此 USB 驱动器对 Kali 进行实时启动。这意味着我们可以运行
    Kali，而无需将其安装在我们的系统上。请记住，当你以这种方式工作时，它会稍微限制一些功能和特性。


    从这一点开始，我们然后能够为我们自己的操作系统安装创建独立的分区。为了帮助我们完成这部分，我们将打开所需的磁盘管理设置。在这里另一个行之有效的方法是打开 Windows
    中的命令行并输入“diskmgmt.msc”。创建一个大小在 15 到 20 GB 左右的分区可以帮助确保它适合你想要的系统。


    在这一点，我们将发现初始过程已经完成。我们已经下载了 Kali Linux 所需的 ISO，创建了一个可启动的 USB 驱动器并将此 ISO 放在上面，我们甚至创建了一个不同的分区用于安装
