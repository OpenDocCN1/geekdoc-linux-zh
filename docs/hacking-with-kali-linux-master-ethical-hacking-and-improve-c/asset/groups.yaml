    \ Mati Aharoni 的必要性而创建的。在进行专业安全工作时，这位开发者发现他需要想出许多安全工具，而不必在客户的系统上安装大量软件和其他内容。于是，他转向\
    \ Linux，看看他能够一站式做什么来应对这个问题。\n\n这种发行版的理念包含了一堆出于必要性而诞生的安全工具。Aharoni 在与客户进行安全接触时面临着一个困境。他不允许在接触中携带任何硬件，而且通常你只能使用现场电脑，前提是你不能进入硬盘或以任何方式修改它们。\n\
