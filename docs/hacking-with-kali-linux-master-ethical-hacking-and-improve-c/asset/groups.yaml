    # INTRODUCTION


    Congratulations on purchasing *Hacking with Kali Linux*, and thank you for doing
    so.


    The following chapters will discuss everything you need to know about hacking
    with the Kali Linux operating system. There are a lot of issues out there when
    we think about all of the damage hackers can do. Whether you are an individual
    trying to protect their financial information against a hacker, or you are a big
    business responsible for keeping the information of your customers safe, hackers
    can pose a big risk to your business and how successful you can be. Taking the
    time to learn how to avoid these attacks, and keep your business and information
    safe can be a critical part of ensuring your own personal and private information
    stays safe as well.


    That is what we will spend some time talking about in this guidebook. We will
    look at some of the major hacks an attacker may try to use on your computer or
    your network, and then learn how you can protect yourself as well. It doesn’t
    matter how big or small your system is; a hacker is interested in getting as much
    information as possible. But with the help of the Kali Linux operating system,
    and some of the tools and techniques we will discuss in this guidebook, you will
    find it is easier than ever to protect your network, whether it is big or small.


    In this guidebook, we will start out with some of the information that you need
    to know about Kali Linux. We will take a look at the history of this operating
    system, the requirements needed in order to handle this kind of'
  - '[PAGE 8]


    language, and how to install and download this system before we even try to use
    it for our own needs. This helps us to get a better understanding of how this
    whole process is supposed to work and how we can benefit from using this operating
    system over one of the others.


    From there, it is time to get into some information about hacking and how we can
    keep ourselves safe overall. We will take a look at the importance of cybersecurity,
    how to recognize a hacker and some of the different types that are out there (not
    all hackers are the same), and common cyber-attacks that everyone, no matter how
    big or small their network is, needs to be aware of. These can include options
    like a man in the middle, dictionary attacks, and more.


    Internet traffic is so important to many individuals and businesses, and being
    able to watch out for what is coming in and out of your network is so important.
    That is why we will devote some of our studies today on protecting our Internet
    traffic. We will look at how to deal with a network scan, what a VPN is all about,
    and more. We will end this guidebook with a look at some of the steps you can
    take to keep your network safe and to ensure no hacker can get on and steal your
    information at all.


    In our increasingly connected world, there are a lot of times when we have to
    be worried about all of the threats out there and how they will affect our personal
    and private information. Being prepared and knowing what is out there, and figuring
    out the right steps to protect ourselves from all of the threats can make a world
    of difference overall. When you are ready to learn a bit more about hacking with
    Kali Linux and how you can keep yourself safe and secure online and, on your network,
    make sure to check out this'
