    我们将开始使用我们的 Windows 操作系统来执行此操作。Windows 7、8 或 8.1 最适合这些用途。它也可以与较新的版本配合使用，但在这些版本上下载和安装
    Kali Linux 有点困难，因此我们将从处理起来稍容易一点的东西开始。在我们准备好开始自己的双启动之前，我们首先需要确保我们已设置好一些合适的材料并准备就绪。其中一些包括以下内容：


