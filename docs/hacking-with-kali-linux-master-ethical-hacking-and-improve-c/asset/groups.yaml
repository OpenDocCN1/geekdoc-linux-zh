  mdcn: "\n## 灰帽黑客\n\n首先，黑帽黑客是指那些致力于发现计算机安全系统漏洞，并利用这些漏洞谋取个人经济利益或出于其他恶意目的的人。这与我们稍后将介绍的白帽黑客略有不同。黑帽黑客试图将系统用于谋取其个人利益，而白帽黑客则是致力于发现并修补黑帽黑客可能利用来谋取自身利益的安全缺陷的人。\n\
