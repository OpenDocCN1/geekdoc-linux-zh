    # ## CHAPTER 7: MORE CYBER ATTACKS:

    KNOWING THEM TO DEFEAT THEM


    We also need to take some time to look at the different types of attacks the hacker
    can use against us. There are many different ways a hacker can get ahold of our
    information and get into the system we are using, and if we are not careful with
    what we are doing, we will end up with a system that is compromised and with a
    lot of information that is stolen and used against us.


    Because there are just so many ways that a hacker can go against us and get on
    our systems, it can be a difficult task for us to keep the hackers out and to
    know where they will come from next. The more we can learn about these attacks
    and work to prevent them from our knowledge, the better off we is. With this in
    mind, you will find that there are many attacks, and some of the most common ones
    will include:


    # ### Man in the Middle


    The first type of attack that we will spend some time exploring is known as a
    man in the middle attack. This is where a malicious hacker will work and take
    the right steps in order to insert themselves between two parties, without being
    seen, in a communication. The goal is to do this without being detected, and for
    the hacker to impersonate both sides that are going on in this exchange. The hacker
    can intercept, send, and receive the data meant for either user. Sometimes depending
    on the information that is being sent, the information handed to the hacker cold
    be passwords and account numbers.


    A typical kind of communication flow will happen between the server and'
  - '[PAGE 63]


    the client. To access your bank account, for example, you would need to get on
    the bank website. Your computer, which is the client here, will send in the necessary
    login information over to the bank’s servers. If the servers find the information
    is correct, then the bank will send back a verification that you were able to
    sign in properly, and you will then be able to access the account.


    This all works well until the hacker can get onto the account and cause some issues.
    The malicious hacker will work to get onto the network and establish a relay for
    communication between the real server and the client. This allows the hacker a
    chance to modify all of the communication between the server and the client.


    Instead of the information heading from the client over to the server as it should,
    the information will get to the relay point, which is the hacker. The hacker is
    then able to either alter the information sent to the server, alter the information
    that is sent to the client, or even just read the information and get the passwords
    and usernames.


    For example, maybe the client communicates that they want to send out some money
    to another bank account. They go through and say that the other bank account should
    be 222333444. But then the hacker will use a man in the middle attack and will
    intercept that communication. They may choose to change up the account number.


    In this case, the bank is then going to get notified about the transfer requests,
    and they will get the account number the hacker sends over. They will not be aware
    any foul play has happened, and is happy to send out the money to the account
    they assume that you specify. And it is too late before either party'
  - '[PAGE 64]


    realizes that the theft happened.


    # **Dictionary Attack**


    The next kind of attack we will take a look at is known as a dictionary attack.
    This is a method or a technique used to breach the security of a computer, or
    a password-protected server or machine. A dictionary attack will try to defeat
    some of the authentication mechanisms because it will go through the process of
    entering each word in a dictionary as the password. It may also try to use this
    in order to determine the decryption key of the message or document that the target
    computer has been able to encrypt before sending it.


    The reason that these are so successful is that businesses and individuals will
    choose ordinary words for their passwords, rather than making it something hard
    to guess. These ordinary words can often be found in any dictionary you want,
    and the hacker will exploit this for their own needs.


    If you have not gone through and picked out a good and secure password for any
    of the systems or websites you like to visit, then you will run into some trouble
    because the hacker will try and gather that information with one of these attacks.
    They may take some time since all of the words in the dictionary have to be used,
    but it is very effective for a hacker.


    The most common method of a user being authenticated through their system is with
    a password. This method will continue for a bit more because it is seen as the
    most practical and most convenient way to authenticate the user who wants to be
    on the system. Even though it is easy to use, this is often going to be one of
    the weakest forms of authentication because the users are not good at picking
    out strong passwords.'
