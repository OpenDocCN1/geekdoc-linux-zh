  - '[PAGE 70]


    Once a virus has had a chance to attack a document, file, or program, the virus
    will sit there and be dormant until there are some circumstances that cause the
    system to execute its code. For the virus to actually infect your computer, you
    need to first run the program that is infected so the virus can see its code executed.


    This means it is possible for that virus to remain dormant and doing nothing on
    your computer for a long time without any symptoms or signs on your computer.
    But, once the virus can infect your computer, any of the other systems on that
    network are infected as well. These viruses can do many things such as take over
    your machine, spam others in your email list, corrupt files, log keystrokes, and
    steal data and passwords based on how the hacker wrote that program.


    In a world that is connected all of the time, you can contract a computer virus
    in a variety of manners, some of which are more obvious than others. Viruses are
    spread through so many different areas such as social media, Internet file downloads,
    text messages, email, and more. It is even possible for this to happen through
    your smartphones and mobile devices. This is why it is often a smart idea for
    us to be careful about our attachments or content we share online because it is
    possible the virus is hidden inside it as well.


