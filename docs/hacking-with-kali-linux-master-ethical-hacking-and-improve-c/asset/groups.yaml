    ## 第 4 章：如何安装 KALI LINUX


    带着之前的一些信息，准备就绪，现在是时候花点时间看看我们如何下载 Kali Linux 操作系统，以便我们可以开始使用我们想要的黑客活动和其他选项。关于这一点，需要注意的事情是，我们绝不希望从官方来源以外的任何地方下载
