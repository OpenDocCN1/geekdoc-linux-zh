    渗透测试将涉及多个不同的步骤，以检查系统并确保其按我们想要的方式工作。例如，这种测试将涉及利用网络、服务器、计算机、防火墙等，以找出其中的漏洞，然后突出显示使用此系统会出现的一些实际风险。


    在进行这种渗透测试时，我们可以采取很多步骤，我们必须确保以实际发现漏洞并确定下一步正确措施的方式设置好系统，以便在您的网络上保持安全。让我们更仔细地看看渗透测试包含的各个不同部分，以及您可以如何在使用
    Kali Linux 系统在适当的时间执行这种测试程序。


