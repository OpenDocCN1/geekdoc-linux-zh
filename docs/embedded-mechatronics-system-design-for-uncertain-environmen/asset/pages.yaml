- pgno: 15
  md: '# Outlines


    This book provides how to create an embedded system from initial concepts to modeling
    and simulation, programming to the actual implementation. Rapid prototyping of
    an embedded control system design is constrained by the system configurations,
    specifications, and the operating system. There are many mechatronic systems of
    interest in the current literature and industry applications. The application
    on a vehicle such as an underwater robotic vehicle (URV) and land robots reflects
    the multidisciplinary nature that unifies mathematical aspects from the various
    and separate engineering disciplines. Applications on magnetic levitation for
    conveyor system, temperature monitoring, face recognition and vision-based inspection
    using camera and vibration sensor working in uncertain environment are also shown.
    Most of the systems operate in an extreme environment with challenges such as
    hydrostatic pressures, model uncertainties, strong forces, harmful interaction
    with electronics, and high attenuation of electromagnetic signals. The human-machine
    interaction and real-world applications of the systems have complicated the embedded
    system design process.


    In order to realize a more efficient and sustainable embedded system design for
    control design, the low-cost microcontrollers were often used to construct a motion
    embedded control system. In these systems, work is needed to deal with the interface
    codes, drivers, and communications among the hardware. Although it is more cost-effective
    and time-efficient especially for Linux®-based operating system, it often requires
    much expertise on computer engineering and low-level programming over control
    system design. As a result, the time spent on computer programming increases with
    significant time allocated for control algorithm design decreases. Here, in this
    book, the xPC-Target for Maths for prototyping, simulation, testing, and deploying
    real-time systems using standard PC hardware is proposed for ease of programming.
    However, the conventional-based design using Linux-based operating system and
    the use of PIC-Microchip™, ARDUINO®, and Raspberry Pi™ are also documented for
    completeness. In summary system design and architecture, software programming,
    system implementation, and testing. The software adopted throughout the chapters
    are Ubuntu/Fedora, Python™ Qt™ MATLAB®/Simulink®, and other open-source software
    development kits from PIC-Microchip, ARDUINO®, and Raspberry Pi.'
  merge: -1
  img_proc: true
