- pgno: 140
  md: '124 Embedded mechatronics system design for uncertain environments


    miss out on essential concepts in controller design and real-time system operation.
    Recently, the Mathworks, Inc. has developed an environment to design, simulate,
    analyze, and automatically generate real-time embedded code. For example, The
    Mathworks'' MATLAB® has featured Real-TimeWorkshop for some years. This software
    takes a global control block in Simulink® and compiles it for execution under
    various environments such as protected DOS™ A new software package, called xPC
    Target, is available as a toolbox for Simulink® versions 6.0 and greater allows
    users to move from simulation to hardware on The Mathews'' real-time operating
    system.


    Additionally, the xPC-Target package includes numerous libraries of supported
    hardware and allows models that include blocks to interface with specific hardware
    devices. The XPC-Target software fully supports the PC104 hardware, meaning that
    analog to digital inputs—A/D inputs, digital I/O timers, as model blocks, parallel
    ports, and watchdog timers—are included in the Simulink® environment as model
    blocks—eliminating the need for students to write drivers for these functions.
    Additional hardware includes DC motors with optical encoders, infrared sensors,
    and compass can be supported. They can be connected to the digital I/O, analog
    inputs, and RS232 on the PC104. The DC motors can be interfaced to the analog
    output of the PC104 via an H-bridge amplifier.


    The graphical Simulink® models are downloaded to the Target hardware running the
    xPC-Target operating system. XPC-Target''s development blocks for Simulink® and
    its real-time operating system allow rapid development of controllers from the
    previous controller design and simulation, to the final implementation. The xPC-Target
    compiled the block diagrams into an executable program that is downloaded from
    the Internet to the embedded computer. This code is capable of executing subsystems
    at multiple sampling rates, has integrated ordinary differential equation solvers
    and manages processor usage, memory allocation, and system input and output. Furthermore,
    data collected when running an experiment is in MATLAB format for convenient post-processing
    and offline analysis. Once a model is compiled and downloaded to the Target, model
    parameters such as proportional, integral, and derivative gains of the controllers
    or even commanded inputs can be changed.


    # 4.3 Hardware interfacing


    In this section, the hardware and its interfacing options are introduced. There
    are many types of PC104 that can be used for embedded control applications. In
    common, they consist of various inputs and outputs communications as digital,
    analog, RS232, USB, Ethernet, and VGA. It eliminates the need for students to
    write drivers and design tedious terminal blocks for these functions to communicate
    with the hardware. In this case, the Athena II will be used. Besides, the PWM
    motor driver from ADVANCED MOTION CONTROLS, the infrared sensor from SHARP, and
    magnetic compass from HONEYWELL are shown.'
