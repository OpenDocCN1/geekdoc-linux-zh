    The PiC™ microcontroller, ARDUINO®, and Raspberry Pi™ microcontroller are the
    common types of microcontrollers used in the embedded system. For example, Raspberry
    Pi is widely used as a low-cost small single-board computer (SBC) within the embedded
    system. Also, SBCs that have several form-factors like PC/104 or PC/104-Plus are
    commonly used. They are Athena III PC104, Athena III PC/104, Helios PC/104, Helix
    PC/104, Rhodes PC/104 SBC, Aries PC/104-Plus, Atlas PCI/104-Express, and Venus
    3.5 Inch Core i7 from Diamond Systems Corporation. The users can further optimize
    the power consumption and performance based on the applications and engineering
    cost factor. The subsequent paragraph will show the example of embedded systems
    used in different applications. They are briefly described in this section to
    give readers the types of embedded systems design and challenges faced in these
    applications.


    # 1.2 Example of embedded system using Athena III PC104


