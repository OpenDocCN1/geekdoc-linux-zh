    # 5.3 Remote temperature-sensing system design for patients


    The contents used in this section can be found in the following reference [3].
    During the severe acute respiratory syndrome (SARS) outbreak in 2003, hospitals
    treatment centers in many countries. Patient''s core body temperature is vital
    parameter for monitoring the progress of the patient''s health, it is often measured
    manually at a frequency ranging from once few hours to once a day. However, such
    manual measurement of the temperature of patients requires the efforts of many
    staff members. Also, when patients suffer from conditions that result in abrupt
    changes of the core body temperature, e.g., by infection at a surgical site after
    surgery, the staff on duty will not know until the next temperature measurement.
    Such delay may lead to patients being unnoticed while their health conditions
    worsen, which is dangerous a difference of 1.5 °C can result in adverse outcomes
    [4]. Furthermore, there is always a need to have a monitoring system to improve
    the quality of health care [5], such as temperature monitoring of elderly and
    concerned patients using a remote temperature-monitoring system.


    Body temperature can be used to monitor the pain level of a patient following
    an operation [6] or shoulder endhesis [7]. In some cases, the tissue was monitored
    by microwave ablation [8] for the treatment of liver metastases. Instead of using
    a temperature sensor, pulse-echo ultrasound [9] was used to visualize changes
    in the patient''s body. In addition, a noncontact temperature-measuring device,
    such as a thermal imaging camera [10], was successfully used to detect human body
    temperature during the SARS outbreak. However, it can be expensive to equip each
    patient with a thermal imaging camera. In addition, there are free temperature-monitoring
    systems (e.g., CADI, Primex, and TempTrak) on the market that can monitor and
    store a patient''s temperature for medical research by body sensor networks [11].
    Most of these systems include a stand-alone electronic module with a display screen
    that allows the temperature data to be transmitted over a secure wireless network.


    However, the cost to purchase and maintain these systems can be quite high. It
    may be difficult to reconfigure these systems to suit the current database system
    used in the hospital. The current systems using short message-based telemedicine
    [12] systems with hardware were developed to monitor the mobility of patients.
    However, proper hardware and software to manage the messages and the patient''s
    temperature for display on mobile phones are not widely available.'
