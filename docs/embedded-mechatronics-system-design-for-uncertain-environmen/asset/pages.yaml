- pgno: 362
  md: '# 346 Embedded mechatronics system design for uncertain environments


    neglect the importance of such maintenance that causes high fuel consumption and
    longer voyages and in most cases when the fouling activity is overwhelmed, operational
    costs will rise.


    Fouling rank developed by the researchers in [5] enabled a quantification method
    for visual estimate of benthic cover. This method is developed by capturing five
    random images from the surface to the keel of the yacht and visually judges the
    percentage of fouling. Table 7.1 shows the fouling rank developed by the researchers.


    An experiment was conducted on a Japanese destroyer to determine the consequences
    of fouling based on various durations of the dock and varying the ship speed.
    The result shows that more fouling tonnage is accumulated when the destroyer is
    traveling at a lower speed. Fouling on the ship''s hull had been of great concern,
    and numerous precautions have been formulated to prevent the occurrence. One of
    such methods in the prevention of fouling is by using anti-fouling (AF) systems
    used environment-friendly foul coatings that successfully reduced fuel consumption
    on a 33-knot aluminum catamaran by 12%. However, the use of AF systems is governed
    by regulations, and such applications on the hull are limited.


    Monitoring the condition of the hull cannot be performed until a vessel is scheduled
    for dry-docking. Using image-processing methods [7] one can observe the growth
    rate of barnacles throughout the year by counting the number of pixels belonging
    to barnacles on a captured image. The result showed that during warmer temperatures
    of the sea the growth of barnacles increased. An intelligent surveillance system
    was designed [8] using computer vision (CV) by obtaining the hue-saturation value
    to identify the types of fouling located on the ship''s hull. The method experimenteded
    on 40 fouling images extracted from the Internet gave an accuracy of 79.97%. The
    most commonly found macrofou organisms are the barnacles. They are mostly hermaphroditic
    invertebrates capable of multiplying themselves rapidly and usually occur in overcrowding
    situations encrusted on the surface marine structures. The adhesion strength of
    barnacles is so strong that expensive hull surface treatments are needed for removal.


    This section focuses on the method to identify the fouling organisms and the severity
    of the fouling condition on the ship hull using machine learning. It allows the
    ship to identify the location and the fouling automatically without the need of
    hiring drivers.


    # Table 7.1 Fouling rank


    | Rank | Description | Visual estimate of fouling cover |

    |---|---|--|\| 0 | No visible fouling | 0% |

    | 1 | Slime fouling | 0%–1% |

    | 2 | Light fouling | 1%–5% |

    | 3 | Considerable fouling | 6%–15% |

    | 4 | Extensive fouling | 16%–40% |

    | 5 | Very heavy fouling | 41%–100% |'
