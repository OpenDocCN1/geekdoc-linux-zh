  md: '# 3.9 Remotely operated underwater vehicle sea trial


    The experimental test of remotely operated underwater vehicle (see Figure 3.44)
    was conducted near Singapore Yacht Club. The joystick was used to move the vehicle
    from a launch position. The following two tests, heave and yaw tests were performed.
    Command signal and controller parameters were initialized using the graphical-interface
    designed by Python-Qt open-source codes. All data were sampled at 100 Hz. Due
    to time constraint, FGA-SMC and PID controller were programmed into the target
    PC104 in ROV. During the experimental tests, the control parameters of FGA-SMC
    were further tuned to give a better response in time. It is attributed to the
    external factors such as significant wave height (approximately 1 m) and sea current
    (around 2 knots) from Meteorological Wave Service Singapore (http://www.weather.gov.sg/home/)
    that affects the results and performance.


    The actual ROV trying to regulate its depth of 0.6 m as shown in Figure 3.44 (right).
    In the experiment, the original PID controller was unable to attenuate the disturbances.
    PID controller parameters were returned to $K_p=31, K_i=27, K_d=34$. It was then
    used to compare with FGA-SMC. The gains used were tuned with $K_{xp}=26, K_{st}=11,
    K_{sd}=20$ and other parameters remain.


    As seen in Figure 3.45 (top), PID controller is unable to attenuate the disturbances
    due to the external wave and current on the ROV. PID controller tends to follow
    the wave perturbation. However, the FGA-SMC exhibits less oscillation with a small
    steady-state have error of approximately 0.7%, and the chattering response is
    much alleviated. FGA-SMC produces much smaller fluctuation in the yaw angle (except
    during the transient stage) as compared to PID controller during heave test. Similar
    behavior was seen in the roll and pitch angle where less overshoot was observed
    in FGA-SMC than PID controller in Figure 3.45 (top). The results showed that FGA-SMC
    could robustly position the ROV at the desired depth despite the uncertainties
    and the external disturbances.


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_133_0.png)


    Figure 3.44 ROV at launch position (left), yaw (middle) and heave (right) tests
    at position (2) using FGA-SMC [2]'
