    chosen were sufficient to drive the robot from the horizontal to the vertical
    surface. The electronic components work with the motors without overheating of
    electronic components. The robot could achieve the required speed and torque to
    transit from the horizontal to the vertical surface. The uniqueness of the intelligent
    climbing robot making the use of biomimetic material to enable the robot to climb
    surfaces without using an external power source. As a result, the robot can adhere
    to the vertical surface for long hours. The design using the biomimetic material
    is non hazardous without affecting the walls surfaces. The main disadvantage of
    using the biomimetic material is poor adhesiveness after numerous trials. It needs
