    # 4.7 Infrared sensor model


    Signal of the infrared sensor was connected to the analog input (VOUT2) of PC104.
    The single-ended input and the voltage range from 0 to 5 V were used. For obstacle
    avoidance and to navigate through the vehicle and the obstacle. The specific infrared
    sensor type that was purchased was SHARP GP2D120- short range (https://media.digikey.com/pdf/%20Sheets/SHARP%20PDFs/GP2D120.pdf).
    These detectors offer a small package, a voltage of 5 V DC to operate, minimal
    current (50 mA), low cost, and output as an analog input. The operational range
    is 30–40 cm.


    To use the infrared sensor in xPC-Term, the following configurations in Figure
    4.54 showed the Analog Input block can be used. Since only one infrared sensor
    was used, connect only one of the channels. The Base address is set as 0x280 according
    to Athena board specification. The sample method is 0.001 s for this case.


    One advantage of infrared sensors is that they are immune to ambient light interference.
    However, the accuracy is affected by the target area''s color and texture. Infrared
    sensors estimate distance in analog form. For example, the distance between the
    obstacles can be measured using a measuring tape and the corresponding voltage
    was recorded. Measured voltage versus the distance plotted'
