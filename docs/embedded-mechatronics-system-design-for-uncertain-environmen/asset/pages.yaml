    However, it can be observed that there is a high degree of cross-coupling. A few
    sensors for velocity and position measurements such as XSENS MTI 10-series, PDCR1830
    Depth Sensor, and NavQuest Micro DVL (600 kHz) were used in the remotely operated
    underwater vehicle.


    The derivation of remotely operated underwater vehicle dynamic equation is based
    on the following assumptions to simplify the remotely operated vehicle model.


    +   - Operating at speed (less than 1 m/s);

    - rigid body and fully submerged in water (no wave and current disturbance);

    - neutrally buoyant by design;

    - tether (or umbilical cord) dynamics attached to remotely operated underwater
    vehicle is not considered.


    The notations (see Table 3.2) used for the remotely operated underwater vehicle
    motions follow the Society of Naval Architects and Marine Engineers (SNAME).'
