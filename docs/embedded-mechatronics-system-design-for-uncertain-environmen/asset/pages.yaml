  md: "# 428 Embedded mechatronics system design for uncertain environments\n\n![](img/21e96ea63cf1b8de0bc286a38acbcfc4_444_0.png)\n\
    \nFigure 7.70 Gender detection training results\n\na well-established technique\
    \ for dimension reduction. The first step is to apply PCA to reduce the dimensionality\
    \ and use the Eigenmatrix to find Eigenfaces. For each image in this dataset,\
    \ the Eigenfaces Matrix was computed to classify the image. The results are seen\
    \ in Figure 7.70.\n\n```\nimport numpy import array, dot, mean, std, empty , argsort\
    \ ,size ,shape ,transpose\nfrom numpy.linalg import eigen, solve\nfrom numpy.random\
    \ import randn\nfrom matplotlib.pyplot import subplots, show\nimport Image\nimport\
    \ numpy as np\nimport os\ndef pca(data,k,m):\n    \"\"\n    Principal component\
    \ analysis using eigenvalues\n    note: this mean-centers and autoscales the data\
    \ (in-place)\n    \"\"\"\n    mean_mat =data-m\n    C = np.dot(mean_mat.transpose(),mean_mat)\n\
    #Eigen values and V is eigenvectors\nE, V = eigen(C)\n#key will have indices of\
    \ array\nkey = argsort(E)[:-1][k]\n\n    E, V = E[key], V[:, key]\n    #Eigen\
    \ matrix ka transpose bhj rha rha hu i.e. *48\n    V=V.T\n    #print \"Dim of\
    \ eigen matrix\",V.shape,data.shape\n```"
