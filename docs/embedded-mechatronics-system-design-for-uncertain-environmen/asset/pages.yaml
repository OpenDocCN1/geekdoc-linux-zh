  md: '# Wall-climbing robot system design


    A climbing robot that utilizes dry adhesives as a climbing mechanism is quite
    useful due to the biomimetic adhesive for different applications such as surveillance,
    nuclear reactor cleaning, and maintenance. In this section, a tank-climbing robot
    is developed to climb most of the wall surfaces. Biomimetic adhesives with nano
    size hairs are made into tank tasks for climbing. A climbing robot is a type of
    robot that can transit from the ground to any wall surface. There are a lot of
    different types of climbing robot in the market. Some utilize the magnetic mechanism
    to climb metal walls while others use an air-suction mechanism to climb. Scientists
    and engineers have always been intrigued by how the lizards climb the walls of
    any surface. For example, the climbing robots will be useful during disasters
    as it can scour high-rise buildings to give a birds'' eye view and the location
    of casualties without endangering the fighters-life''.


    Vacuum suction is one of the climbing mechanisms used commonly in modern robot
    design [19]. It utilizes the vacuum power to achieve strong adhesion force. The
    disadvantage of using vacuum suction is the need of powerful motor to achieve
    a substantial vacuum power. It can be quite noisy when the motor is running. Electrostatic
    adhesion creates an electrically controllable adhesion technology [20] that induces
    electrostatic charges on a wall using a power supply connected to the compliant
    pads on the moving robot. It can be electronically off and on by remotely electrostatic
    charges. The disadvantage of the electrostatic adhesion is the needs for an external
    power source to provide the electrostatic circuit. Although the power to induce
    charges is small, it still requires an external power source.


    In this section, the climbing mechanism uses a gecko rubber pad or biomimetic
    adhesion. It has very little rubber hairs like mushroom caps of the size of a
    human hair. These bumps allow the robot to climb the surfaces of the walls using
    "Van Waals forces. The van der Waals forces are the theory of attractions between
    molecules, atoms, and surfaces, as well as many other intermolecular forces [21].
    The gecko pad used for the climbing can be seen in Figure 5.26.


    The electromagnetic adhesive is also used in various climbing robot designs [20].
    They have a dominant adhesive force depending on the specifications of the electromagnetic
    circuit. It can be switched off and on with a flick of a switch while moving on
    different surfaces. Permanent magnets can also be utilized in the climbing mechanism.
    They do not rely on any external power source for the magnet adhesive. They give
    strong adhesive force depending on the size of the magnet. Special magnets called
    rare-earth magnets are the most durable permanent magnets made from alloys of
    rare earth elements. They are stronger than other types of magnets such as ferrite
    or alnico magnets. There are mainly two types of rare-earth magnets: neodymium
    and samarium-cobalt magnets. Rare-earth magnets are extremely brittle and prone
    to corrosion. Therefore, they are usually coated to protect them. A neodymium
    magnet was chosen as they easily available in the consumer markets. A small neodymium
    magnet with a measurement of 2.54 cm × 2.54 cm × 0.635 cm has a pull force of
    approximately 12.52 kg.'
