    Raspberry Pi and Camera Module act as the backbone of the system for processing.
    Pi is installed in the Raspian (a Linux-based GUI). The OpenCV is used as the
    key module for CV and Python Library modules. The system uses SSH that is an encrypted
    protocol that allows remote login to Host from different clients on the same Network
    over WIFI as in Figure 7.66.

    The Pi acts as the host that enables the network to interact with the Raspian.
    The Wi-Fi modem acts as the server for the system that provides the Internet access
    to the host and clients. It acts as a bridge for the information exchange. The
    client will be accessed from SSH as the information from the Raspberry Pi can
    be accessed from their platforms of comfort such as Android, IOS, OSX, Windows,
    and Linux (see Figure 7.67).

    The CV-based algorithms are scripted in the Python as in the following flowchart
    in Figure 7.68.'
