  md: '# 72 Embedded mechatronics system design for uncertain environments


    The Coriolis and the centripetal matrix are used to describe the angular motion
    of the vehicle as.


    ```

    $\mathbf{CR}_B(\mathbf{v}) = \begin{bmatrix} O_{3\times3} & C_{12}(\mathbf{v})
    \ -C_{12}^T(\mathbf{v}) & C_{22}(\mathbf{v}) \end{bmatrix} \quad (3.3)$

    ```


    and


    ```

    $\mathbf{C}_{12}(\mathbf{v}) = \begin{bmatrix} m(y_G + z_{GR}) & -m(x_G - w) &
    -m(x_{GR} + v) \ -m(y_} + v) & m(z_R + x_{GP}) & -m(y_{GR} - u) \ -m(z_G - v)
    & -m(z_{GR} + u) & m(x_{GP} + y_G) \end{bmatrix} \quad (3.4)$

    ```


    ```

    $\mathbf{C}_{22}(\mathbf{v}) = \begin{bmatrix} 0 & -I_{yzq} - I_{xzP} & I_{zr}
    + I_{yP} - I_{yq} \ I_{zq} - I_{xzP} & -I_{zr} - I_{yq} + I_{zp} \ -I_{zr} - I_{yp}
    + I_{zq} & I_{zr} + I_{xq} - I_{zp} \ \end{bmatrix} \quad (3.5)$

    ```


    As shown in (3.1), $\tau_{RB}$ includes different hydrodynamic forces and moments.
    The first consist of drag, added mass, and restoring forces are named as $\tau_H$
    and the propulsion forces generated by the thrusters are named as $\tau$.


