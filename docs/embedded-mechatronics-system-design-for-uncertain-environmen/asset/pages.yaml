- pgno: 180
  md: "# Speed vs. Voltage\n\n![](img/21e96ea63cf1b8de0bc286a38acbcfc4_180_0.png)\n\
    \nThe speed vs. voltage curve is plotted as shown (Figure 4.64). The curve is\
    \ generated when a DC motor rotating with an angular velocity $\theta(t)$, a back-emf\
    \ voltage $e_b(t)$. The back-emf is governed by $e_b(t) = K_e\theta(t)$, where\
    \ $K_e = 1.142.$\n\n# 4.9 Identification of a servo DC motor\n\nThe motor torque,\
    \ $T$, is related to the armature current, $i$, by a constant factor $K_i$.\n\n\
    ```\n$T = K_i i$\n```\n\nThe back-emf, $e$, is related to the rotational velocity,\
    \ as shown in the following equations:\n\n```\n$e = K_e\theta$\n```\n\nwhere $K_e$\
    \ is the back-emf constant. We can write the equations based on Newton's law combined\
    \ with Kirchhoff's law\n\n```\n$J\\dot{\theta} + K_e\\dot{\theta} = K_i i$\n```\n\
    \n```\n$L\\frac{di}{dt} + Ri = V - K_e\\dot{\theta}$\n```\n\nwhere $J$ is the\
    \ moment of inertia, $L$ is the inductance, $R$ is the resistance, and $V$ is\
    \ the voltage input to the motor. Using Laplace Transforms, the above modeling\
    \ equations can be expressed in terms of s\n\n```\n$s(Js + K_e)\theta(s) = K_i\
    \ I(s)$\n```\n\n```\n$(Ls + R)I(s) = V(s) - K_e s\theta(s)$\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: "# xPC-Target embedded system design 165\n\nBy eliminating $I(s)$, we can get\
    \ the following open-loop transfer function, where the rotational angle is the\
    \ output, and the voltage is the input.\n\n```\n$$\\frac{\theta(s)}{V(s)} = \\\
    frac{1}{s} \\left[ \\frac{K_t}{(Js+K_e)(Ls+R) + K_tK_e} \\right] \\quad (4.6)$\n\
    ```\n\nalternatively, rotational speed as the output:\n\n```\n$$\\frac{\\dot{\t\
    heta}(s)}{V(s)} = \\frac{K_t}{(Js+K_e)(Ls+R) + K_tK_e} \\quad (4.7)$\n```\n\n\
    In the state-space equations can be expressed by choosing the rotational speed\
    \ and electric current as the state variables and the voltage as an input. The\
    \ output is chosen to be the rotational angle.\n\n```\n$$\\begin{bmatrix} \\ddot{\t\
    heta} \\ \\dot{\theta} \\end{bmatrix} = \\begin{bmatrix} -K_t/J & K_t/J \\ -K_e/L\
    \ & R/L \\end{bmatrix} \\begin{bmatrix} \\dot{\theta} \\ I \\end{bmatrix} + \\\
    begin{bmatrix} 0 \\ 1/L \\end{bmatrix} V \\quad (4.8)$\n```\n\nMoreover, the rotational\
    \ velocity to be computed using:\n\n```\n$$\\dot{\theta} = \\begin{bmatrix} 1\
    \ & 0 \\end{bmatrix} \\rightarrow \\theta = \\int_0^t \\begin{bmatrix} 1 & 0 \\\
    end{bmatrix} dt \\quad (4.9)$\n```\n\nSince L is usually small (or electrical\
    \ time constant is shorter than compared to the system response), it can be neglected,\
    \ and the open-loop transfer function for the speed control becomes:\n\n```\n\
    $$\\frac{\theta(s)}{V(s)} = \\frac{K_m}{\\tau_{ms}s+1} \\quad (4.10)$\n```\n\n\
    where $K_m = \\frac{K_m}{K_c+K_R}$, $\\tau_m = \\frac{JB}{K_c+K_R}$. The open-loop\
    \ transfer function was compared with actual speed of the motor. As shown in Figure\
    \ 4.65, the transfer function was modeled in Simulink For example, an input of\
    \ 0.274 rps was used.\n\nAs shown in Figure 4.65, there is a time delay in the\
    \ response. To model the motor dynamics accurately, the first-order dead-time\
    \ model is used.\n\n```\n$$\\frac{\\dot{\theta}(s)}{V(s)} = \\frac{K_m}{\\tau_{ms}s+1}\
    \ e^{-\\theta s} \\quad (4.11)$\n```\n\nwhere the time delay, $\\theta=1s$ (as\
    \ seen in the response time) and the remaining parameters can be tabulated as\
    \ follows.\n\nThe estimated and calculated process parameters for the motor (after\
    \ speed reduction, 189:1) are as follows (see Figures 4.66 to 4.70). With small\
    \ $J$, as the resistance $R$ is decreased, the motor time constant approaches\
    \ zero, and the motor acts as an ideal integrator."
  merge: -1
