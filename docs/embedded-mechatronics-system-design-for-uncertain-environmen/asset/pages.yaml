- pgno: 285
  md: 'The attractive force and the input current for the electromagnet are determined
    as shown. First, the air gap reluctance with the presence of lateral flux lines
    is given by:


    ```

    $$\mathcal{R}_{airgap} = \frac{z}{\mu_0 l_m (p + \frac{2z}{\pi})}$ (5.22)

    ```


    where permeability of free space is $\mu_0 = 4\pi \times 10^{-7}, l_m$ is the
    length of the magnet, $z$ is the air gap distance, and $p$ is the width of the
    pole.


    The reluctances for the track, magnet, and leakage flux are computed as:


    ```

    $$\mathcal{R}_{track} = \frac{(t + 4p)}{\mu_0 \mu_T \times l_m \times p}$ (5.23)

    ```


    ```

    $$\mathcal{R}_{magnet} = \frac{(2h + w + 2p)}{\mu_0 \mu_M \times l_m \times p}$
    (5.24)

    ```


    ```

    $$\mathcal{R}_{leakage} = \frac{2w}{\mu_0 l_m h}$ (5.25)

    ```


    where $\mu_T$ and $\mu_M$ are the relative permeabilities of the track and electromagnet,
    respectively.


    The magnetic levitation force produced by the EMS system could be computed as:


    ```

    $F_m = \frac{\phi_2^2}{\mu_0 A_g} \frac{MMF_{total}^2}{\mu_0 A_g R_{total}^2}
    = \frac{(2H_l + NI)^2}{\mu_0 A_g R_{total}^2} \times \frac{1}{4z^2}$ (5.26)

    ```


    where $N$ is the number of turns, $H_l$ is the magnetic field intensity of magnet,
    $A_g$ is the effective cross-sectional area of the airgap (considering the fringing
    effect), $z$ is the air distance, $I$ is the current input to the coils, $MMF_{total}$
    is the total magnetomotive force from the permanent magnets and coils, and $R_{total}$
    is the total reluctance of the airgap, which is computed by:


    ```

    $R_{total} = \frac{(\mathcal{R}_{track} + 2\mathcal{R}_{airgap}) +(\mathcal{R}_{leakage}
    + \mathcal{R}_{magnet}) + \mathcal{R}_{magnet}\mathcal{R}_{leakage}}{\mathcal{R}_{leakage}
    + 2\mathcal{R}_{airgap} + \mathcal{R}_{track}}$ (5.27)

    ```


    With two magnets used for the levitation, the levitation force in (5.26) could
    be simplified to:


    ```

    $F_1 = G_1 I_1^2$ (5.28a)

    ```


    ```

    $F_2 = G_2 I_2^2$ (5.28b)

    ```


    where $F_m, G_1$, and $I_1$ are the levitating force, levitating force gain, and
    air gap length of a left side electromagnet, respectively; $F_2, G_2$, and $I_2$
    are the levitating force, levitating force gain, and air gap length of a right-side
    electromagnet, respectively.'
