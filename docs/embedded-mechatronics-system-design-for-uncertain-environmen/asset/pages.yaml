    Although systems arising in the applications and embedded systems are entirely
    different, they have at least one common area as several interacting subsystems,
    components, and people. Interactions among the parts of a complex system may give
    rise to unpredictable behaviors that can have desirable or undesirable impacts.
    The design step should provide valuable tools and technologies to understand,
    predict, and evaluate the behavior of complex systems for developing and evaluating
    methods to steer the system toward more desirable states to enable a more efficient,
