- pgno: 287
  md: '![](img/21e96ea63cf1b8de0bc286a38acbcfc4_287_0.png)


    Figure 5.57 Estimated thrust force vs. input current


    permeability in different operating points. As the permeability is not easy to
    be obtained precisely, the variation in electromagnet gain ($G_1, G_2$) due to
    permeability changed with different operating points and temperature variation
    within the coil that result in modeling errors is considered in the lumped uncertainty.
    Therefore, the model includes these variations and the controller developed should
    be robust to tolerate these uncertainties and unmodeled dynamics.


    Considering the parameter variations and external disturbance, the actual dynamic
    model can be represented realistically as:


    ```

    $$(m + \Delta m)\ddot{z}(t)\n= (G_f + \Delta G_2)I_2^2 + (G_f + \Delta G_1)I_1^2
    + F_d$$

    ```


    where $\Delta m, \Delta G_2$, and $\Delta G_1$ denote the uncertainties introduced
    by system parameters and unmodeled dynamics.


    By defining a lumped uncertainty vector:


    ```

    $$L_u =-\Delta m\ddot{z}(t) + \Delta G_1I_1^2 + \Delta G_2I_2^2 + F_d$$

    ```


    Equation (5.34) can be rewritten as:


    ```

    $$$\ddot{z}(t) = \frac{G_f}{m}u + L_u$$

    ```


    where $u = I_2^2 - I_1^2$; the band of the lumped uncertainty is assumed to be
    given by $|L_u| < \rho$ and $\rho$ is a given positive constant.'
