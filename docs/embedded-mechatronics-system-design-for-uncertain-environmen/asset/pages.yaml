    Figure 6.55 Tasks of the pole-climbing robot


    As shown in Figures 6.56 and 6.57, the motor rotates to drive the primary and
    secondary gears to achieve a closing position and allow the robot to grip onto
    the pole. The applied force will increase to an acceptable level by rotating the
    motor and gears. To ensure the grip is firm, a layer of rubber pad is attached
    to the inner surface of the gripper. The friction between the pole and rubber
    pad will prevent the robot from slipping while climbing.


    The whole mechanism consists of three links where they rotate the two joints as
    shown in Figure 6.58. A motor is placed at each joint to control the rotation
    and climbing motion. It can provide the appropriate speed to make the motion steady.
    Choosing a correct motor torque is essential as the joint carries the necessary
    payload. The entire system consists of a pair of gripping arms and a rotational
    module. Each joint is driven by a motor that would rotate about each joint and
    cause the robot to make a 180° turn to grip the next point. As shown in Figures
    6.59 and 6.60, the rotation at the center of the straight bar allows the two curve
    bars to lock the grippers for a good grip. The final design of the slot inspired
    pole-climbing robot can be seen in Figure 6.61.'
