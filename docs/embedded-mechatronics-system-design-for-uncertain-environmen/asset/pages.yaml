  md: '# Embedded mechatronics system design for uncertain environments


    Hence, a medical device to continuously measure the body temperature of patients
    using a wireless temperature sensor [13,14] is required. With a wireless temperature
    sensor system, nurses will no longer have to manually measure the temperature
    of patients, which will free their time for other tasks and also reduce the risk
    associated with coming into contact with patients with contagious diseases, such
    as SARS. The readings will be transmitted to the central nurse station, where
    they can be monitored by the staff on duty. In addition, the current and history
    of the body temperature measurements can be stored in an online database, which
    allows the medical staff to access the database when they are not in the hospital.


    The objective is to develop and implement a temperature-monitoring system for
    patients using a wireless remote connection to the nurse''s station for frequent
    real-time monitoring. To the best of our knowledge, a MiWi temperature-monitoring
    system using a patient and coordinator set provides internet access to the temperature
    database has not been reported in a single publication. The temperature-monitoring
    system was designed based on a proposed patient and coordinator set approach.
    The proposed temperature-monitoring system will increase layer efficiency and
    improve the quality of health care through continuous monitoring of the temperature
    of patients.


    # 5.3.1 System design and architecture


    The core body temperature of a human is one of the vital statistics used to determine
    individual health. Normal body temperature (normothermia) is approximately 37
    °C, with variations depending on factors such as age and geological factor [15].
    When the body fails to regulate itself by dissipating heat, it increases the core
    body temperature above the normal condition. This condition is called hypermia.
    There are four locations [16] that can be used to measure human core body temperature,
    rectal (anus), oral (mouth), tympanic (ear), and axillary (armpit), with the rectal
    measurement to be the most accurate in measuring the core body temperature. Each
    of these locations has its advantages and disadvantages. Rectal measurement of
    body temperature is the preferred method to perform a core body temperature measurement.
    The aim is to track a patient''s core body temperature continuously and wirelessly,
    the axillary measurement seems to be a viable option. Importantly, the measurement
    system should measure within the clinically relevant temperature deviation [17,18]
    of 0.3-0.5 °C and detect changes in the human body temperature (at a resolution
    of 0.1 °C).


    To accomplish the axillary temperature measurement, the wireless remote temperature-monitoring
    system design (see Figure 5.21) includes a MiWi wireless transceiver (MRF24J40MA),
    a PIC microprocessor (PIC18LF4620)/MCU, a temperature-sensing circuit, a patient
    set (on the patients), and a coordinator set (at the nurse''s station) for the
    data coordination between the patients and the central nurse station. The temperature
    sensor will produce an output voltage with a magnitude equal to the body temperature.
    The analog-to-digital converter (ADC) has 13 analog channels and a 10-bit resolution
    in the microprocessor to convert the output'
