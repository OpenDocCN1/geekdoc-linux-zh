  md: '# ARDUINO® embedded system design 303


    The pinout of the device is G (Gate), D (Drain), and S (Source) for this particular
    model. MOSFETs were driven from Pins 2, 3, and 4. Two of the MOSFETs were connected
    to Pin 2 concurrently. The wires were plugged into these three pines connected
    to the individual gate of the MOSFETs. The PWM will deliver a HIGH signal to the
    transistor''s gate. When the MOSFET receives a gate voltage above the threshold
    voltage, the motor will switch on. When the switch is turned off, the motor will
    stop. The ARDUINO® contains no onboard voltage regulator. In the circuit, the
    positive terminal of the 12 V batteries is connected through a voltage regulator.
    The negative terminal of the battery was then connected to the ground of the ARDUINO®.
    The heat sink was used to prevent any overheating by the voltage regulator.


    # 6.1.2 Programming and system implementation


    The ARDUINO® IDE is a program that allows users to write program codes for the
    ARDUINO® board in a simple programming language. The code that is written in ARDUINO®
    programming language is translated into C++ programming language via AVRGCC compiler.
    ARDUINO® IDE allows users to write sketches to interact with the fets on the board.
    ARDUINO® allows the Linux® processor to communicate. The Yun provides a library
    called “Bridge” that allows the Linux® processor and the microcontroller to communicate
    with each other. It provides the possibility to enable ARDUINO® sketches to run
    shell scripts and collect data from the AR9331 processor. The Yun also works with
    Wi-Fi, enabling wireless connection between the board and the laptop.


