    Figure 7.74 Test setup photos of the completed prototype


    the face using Haar cascade classifier, convert them into gray-scaled, crop them
    to align the eye level, and save the images in the dataset folder as shown in
    Figure 7.75.


    The main program is saved in apps/videofacefec.py. To run the program, run the
    python file videofacefec.py by python videofacefec.py -t database location. Once
    the Start button is pressed in the GUI window in Figure 7.76, the system will
    start the live video from the camera and begin to detect the faces.


    The software was tested with a database of multiple facial images of different
    people in a wide variety of lighting situations. The face detection using Haar
    Cascade has a good accuracy up to a distance of 5 m under good lighting and up
    to 3 m in a low-light situation. Once the distance exceeds the limit, the accuracy
    decreases. performance depends on lighting and the number of images in the database.
    The accuracy of the results increases with more images. The initial test was done
    using 25 images in the database with poor recognition rate. To overcome the situation,
    the system with 200 facial images taken in different lighting was used. The classifier
    was trained with 750 images of different gender with color images (RGB) and grayscale
    (B/W) images. The color images were sized to 140×140 and the B/W to 64×48. The
    computational requirements for gender detection are high. The Raspberry Pi showed
    severe lag when tested with the face recognition and gender recognition. The GPU
    performance of 900 MHz and 1 GB RAM was not enough for the program. The image
    resolutions for the video were reduced. The system was tested under different
    lighting conditions and different background scenarios. Each test was repeated
    for ten times, and the results for each feature were tabulated as shown in Figure
    7.77.


    The performance of the system increases with the number of images in the database.
    However, the size of the database will affect the hardware performance'
