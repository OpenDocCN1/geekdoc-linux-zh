- pgno: 33
  md: '# Chapter 2

    Linux®-based embedded system design


    # 2.1 Linux® operating system


    This section provides a brief overview of Linux® operating system. A useful introductory
    notes on Linux® can be found in http://www.tdp.org/LDP/intro-linux/intro-linux.pdf.
    Linux® is an operating system (OS) distributed under various companies such as
    RedHat and Mandriva provide packaged open-source license for free. (Version 2.1).
    It has libraries, compilers, debugging, and development tools. Various Linux®
    distributions with user-friendly interfaces developed by the community (see Figure
    2.1). A user can begin the required applications without the need to type any
    character at the terminal.


    The Linux® system is based on open-source GNU tools that provide a standard approach
    to the system. Most distributions come with a complete set of development tools
    offer precompiled packages for the programmers to install. A few popular GNU software
    is as follows.


    +   - GCC: The GNU C Compiler

    - Bash: The GNU shell

    - Gnome: The GNU desktop environment

    - GDB: The GNU Debugger


    The Linux® kernel is not part of the GNU project but it consists large part of
    development and utilities tools are not Linux®-specific. Such a system can be
    called a GNU/Linux® system. The kernel is important in the system. It controls
    the communication between the peripherals and the underlying hardware. The kernel
    also ensures that processes are begun and stopped at exact time. The kernel is
    a huge topic that contains large amounts of information to discuss in detail.
    Note that most of the things in Linux® system are considered as a file except
    for the process files.


    +   - Special files: the mechanism used for input and output.

    - Directories: files that are list of other files.

    - Links: a system to make a file or directory in multiple parts of the system’s
    file tree.

    - Sockets: a special file type, similar to Transmission Control Protocol (TCP)/IP
    sockets, providing interprocess networking protected by the file system’s access
    control.'
  merge: -1
  img_proc: true
