    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_148_0.png)


    2A8 motor driver, it is essential to offset the gain such at 0 V, the motor is
    not rotating. The loop gain is set to around 3 to 4.5 clockwise (CW) turns to
    ensure the loop gain is not too high. In this, a positive voltage rotates the
    shaft counterclockwise (CCW) while negative voltage rotates the shaft in CW direction.
    It is a nonlinear effect caused hysteresis (forward is not equal to reserve) and
    a dead band around 1 V. As observed, as voltage increases, the speed becomes inaccurate.


    The PINs (see Table 4.2) on the P1 connector are as follows:


    +   - Single-ended command signals (+REF, Pin 4). The single-ended command signal
    is dictated by the capabilities of the controller, for this case is the PC104-Athena
    II. Analog ±10 V command signals are used for the velocity or speed control mode.
    The 0 V gives no rotation to the motor shaft, +10 V gives CCW rotation while the
    -10 V gives CW rotation.

    - Ground (SIGNAL GND, Pin 2). Almost all signals between the drive and the controller
    are referenced to signal ground. Without this reference, the drive and the controller
    would not be able to transmit signals to each other. To ensure that the signals
    between the drive and the controller are referred to the same potential, the signal
    grounds on the controller and the drive must be connected. To avoid loops, do
    not add a connection if there is already continuity between the two grounds.

    - Inhibit line (INHIBIT IN, Pin 11). The inhibit line is used to turn off power
    to the motor while the drive is still on. Sometimes this is necessary if power
    to the motor needs to be removed quickly or if the user needs to manually move
    the load in a freewheeling condition. If your controller has an inhibit function,
    then we highly recommend that you use it. Note that the input is configured to
    disable the drive when pulled low (active low).

    - 5 V (+5 V, 3 mA OUT, Pin 1). The +5 V supply can be used for an encoder that
    requires a +5 V supply to the hall sensor. The ground for the encoder can be connected
    to the PC104-Analog Ground.'
  merge: -1
