  md: '# Raspberry Pi-embedded system design 417


    Around ten Eigenvectors are apparently not sufficient for a proper image reconstruction;
    50 Eigenvectors can be sufficient to encode critical facial features. You will
    get an accurate reconstruction with approximately three hundred Eigenvectors for
    the AT&T Facedatabase as seen in one of the following databases (see all databases
    in http://www.face-rec.org/databases/). There is the rule of how many Eigenvectors
    one should choose for successful face recognition. However, it depends on the
    input data used.


    The LDA was proposed by the great statistician Sir R. A. Fisher who successfully
    it for flowers using multiple measurements in taxonomic problems. The PCA finds
    a linear combination of features that maximize the total variance in data. It
    is a powerful way to represent data, however it does not consider classes, and
    discriminative information lost if components are removed. The components identified
    by a PCA do not necessarily contain discriminative information. As a result, the
    projected samples are smeared and classification becomes difficult. When the combination
    of features that separate them into different classes, LDA maximizes the ratio
    of between-classes to withinclasses scatter. The idea is simple: same classes
    should cluster tightly, while different classes are grouped as far away as possible.
    The Fisherfaces in Python language can be written as:


    ```

    def pca(X, y, num_components=0): y = np.array(y)

    [n,d] = X.shape

    c = np.unique(y)

    if num_components <= 0 or num_component >len(c)-1): num_components = (len(c)-1)

    meanTotal = X.mean(axis=0)

    Sw = np.zeros((d, d), dtype=np.float32) Sb = np.zeros((d, d), dtype=np.float32)
    for i in c:

    Xi = X[np.where(y==i)][0]

    meanClass = Xi.mean(axis=0)

    Sw = Sw + np.dot((meanClass-meanTotal).T, (meanClass - meanTotal))

    eigenvalues, eigenvectors = np.linalg.eig(np.dot(np.linalg.inv(Sw),Sb))

    idx = -np.argsort(eigenvalues.real)

    eigenvalues, eigenvectors = eigenvalues[idx], eigenvectors[:,idx]

    eigenvalues = np.array(eigenvalues[0:num_components].real, dtype=np.float32, copy=True)

    eigenvectors = np.array(eigenvectors[:,0:num_components].real, dtype=np.float32,

    copy=True)

    return eigenvectors, [eigenvectors

    ```


    Using the code above, functions to perform a PCA and LDA are now defined. We can
