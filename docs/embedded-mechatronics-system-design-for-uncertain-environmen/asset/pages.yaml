    Figure 2.15 Producer–consumer model with FIFO PIPE [1]


    As observed in Figure 2.14, the three threads refer to DVL sensor, depth sensor,
    and MTI 10 altitude sensor, respectively. These three threads have software structure,
    namely, to read data using serial ports. Figure 2.15 shows the first-in-first-out
    (FIFO) pipe model. A pipe is a mechanism for interprocess communication; data
    written to the pipe by one process can be read by another process. The data is
    handled in the FIFO order. A pipe needs to be open at both ends to be open simultaneously.
    If one read from a pipe that does not have any writing process, it will return
    end-of-file. Writing to a pipe or FIFO that does not have a reading process is
    considered an error condition; it generates a SIGPIPE signal. The pipes do not
    allow file positioning. Both the reading and writing operations have to be done
    sequentially; reading from the beginning of the file and writing to the end.


    The details in the serial port sensor (using a pipe) are as follows:


    +   - Open serial port


    +   - Setting parameters of serial port—parity, baud rate, stop bit, and data
    bit,


