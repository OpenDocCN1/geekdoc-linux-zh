    \ and height of the box were computed. The following codes will compute the distance\
    \ to an object using the triangular similarity.\n\n```\ndistance_to_camera(knownWidth,\
    \ focalLength,Width):\n# compute and return the distance from the marker to the\
    \ camera\nreturn (knownWidth * focalLength) / Width\n```\n\nThis function takes\
    \ a known width of the marker, a computed focalLength, and perceived width of\
    \ an object in an image (measured in pixels), and applies the triangular similarity\
    \ to compute the actual distance to the object.\n\n```\nKNOWN_DISTANCE = 12.0\n\
