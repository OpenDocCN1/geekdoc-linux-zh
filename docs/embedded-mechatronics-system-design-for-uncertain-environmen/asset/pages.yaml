  md: '# 106 Embedded mechatronics system design for uncertain environments


    control signal can be achieved. To decide on the correct evolutionary direction
    and stability in the system dynamic, the fuzzy-based evolution is used. The fuzzy
    logic is also used to compensate for the chattering phenomenon inherent in the
    SMC with discontinuous switching across.


    The ultimate target of GA can be regarded as s(t)=0 and s(t)=0 (i.e., the desired
    position is achieved). A fitness function for tuning the coefficients in crossover
    and mutation for fuzzy inference is defined as


    ```

    F_s(s) = e^{-(s^2+\sigma^2)} \in [0, 1] (3.58)

    ```


    where s is a sliding surface in (3.30) and $\sigma$ is the rate of decay. The
    basic genetic operation is shown below.


    +   1. Elites selection in GA: The control voltage is treated as the chromosome
    in GA. The reproduction is utilized to decode the chromosomes into the mating
    pool for subsequent genetic operations. Equation (3.58) is used to decode the
    chromosomes that will be selected from the mating pool for further genetic operations.
    SMC''s chains ($K_{sp}, K_{st}, K_{kd}$) for (3.57) are randomly selected from
    the positive operational region that ranges from $K_{min}=0$ to $K_{max}=50$.
    The sliding surface $s$ and its derivative are used to compute the fitness value
    in (3.58). If the new control input is greater than all previous values, it will
    be the new elite. The highest fitness value is regarded as the elite. By utilizing
    the elite as a parent, the generated offspring is the new control signal in the
    next interval. If the fitness value of the new control signal is greater than
    the previous one, it will become the next elite. It adopts the survival of the
    fittest.

    2. Fuzzy-based crossover and mutation in GA: Crossover operation is the primary
    method to create perturbations in GA. It can generate offspring by varying the
    signature of the parent. The direction-based crossover operation is used in this
    section. The concept is that the greater or further away from the sliding surface
    and its derivative, the variation (or the control input) between the offspring
    and the parent. Conversely, the control input will be less or remain constant
    if the system dynamic is within the sliding surface. Hence, the sliding surface
    $s$ and its derivative are integrated into the crossover operation. The generated
    offspring from the parent can be expressed as:


    ```

    u_{GA,new} = u_{GA,old} + |\eta_s|s + |\eta_{ci}| (3.59)

    ```


    where $u_{GA,old}$ is the selected chromosome of $K_{sp}, K_{st}, K_{kd}$ from
    the previous generation and $u_{GA,new}$ is the newly created offspring using
    $\eta_s$ and $\eta_{ci}$ for $s(t)$ and $s(t)$, respectively. The tuning coefficients
    $\eta_s$ and $\eta_{ci}$ are vital for crossover operation. For example, the tuning
    coefficients are chosen to be too large (small); the tuning step from generation
    to generation will be large (small) to enable the system dynamic to diverge quickly
    (become unstable). In this section, the fuzzy crossover inference mechanism is
    used to select the right tuning coefficients.


    The mutation in GA is then used to prevent the issue of the local minimal. A new
    chromosome can be included in the population. Compared to the current'
