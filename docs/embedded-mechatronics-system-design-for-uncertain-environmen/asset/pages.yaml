    used to provide a reliable and fast data transmission. Bluetooth is a wireless
    communication standard for communicating with Bluetooth devices, Bluetooth module
    can be found in most modern devices (mobile phones, smartphones, GPS devices).
    However, it does not provide comparable transfer speed than the wired cable. Additionally,
    the drawback is the short-range transmission. Bluetooth operates at a frequency
    lower than 2.4 MHz. A final decision was made on Wi-Fi technology. It can be accessed
    from the built-in Wi-Fi support from the microprocessor and command signals can
    be transmitted from the phone to the ROV. The only disadvantage is the limited
    range underwater as water absorbs most of the radiofrequency waves.


    The ROV can be made neutrally buoyant or positively buoyant. A neutrally buoyant
    ROV allows it to maintain at depth depth with less power consumption. If the ROV
    is positively buoyant, it needs thrusters to submerge the vehicle. More power
    is required to maintain the vehicle at a particular operating depth. A positively
    buoyant ROV is easier to recover. The proposed ROV has no tethering cable as Wi-Fi
    communication was used. A propulsion system designed for the ROV has at least
