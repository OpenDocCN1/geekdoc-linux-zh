    The PINs used on the P2 connector are as follows:


    +   - MOTOR (Pin 1). Connect to the M+ (red cable) of the DC motor;

    - MOTOR (Pin 2). Connect to the M- (black cable) of the DC motor;

    - POWER GROUND (Pin 3). Connect to the negative end of the power supply;

    - HIGH VOLTAGE (Pin 5). Connect to the positive end of the power supply.


    Velocity mode controls the motor which the motor velocity is proportional to the
    input command, ±10 V. Switches used for the velocity mode are as follows:


    +   - SW1 On;

    - SW2 Off;

    - SW3 Off;

    - SW4 Off.


    Potentiometers setting for the voltage mode are as follows:


    +   - Pot 1. Current limit—no change;

    - Pot 2. Loop gain—no change;

    - Pot 3. Reference gain—4 turns CW.*;

    - Pot 4. Offset for no torque (i.e., motor''s shaft not rotating) when the input
    voltage at +REF = 0.


    To maintain consistency in the number of turns, the initial starting point is
    defined as:


    +   - Turn the pot CCW until the pot begins to click on every turn;

    - Continue to slowly turn the pot CW until the next click is heard, stop;

    - Now turn the pot in the CW direction as per the number of turns indicated.


    # 4.4 Hardware-in-the-loop testing using xPC-Target


    The XPC-Target is tightly integrated into the MATLAB®Simulink environment and
    allows Simulink® models to be compiled into executable code and run on a proprietary
    real-time operating system. It is a solution for rapid prototyping, hardware-in-the-loop
    testing of control systems, and deploying real-time systems using standard PC
    hardware such as Athena II. Using standard PC hardware and off-the-shelf I/O boards,
    xPC-Target turns a standard PC into a real-time prototyping target. “Real-time”
    means that code is executed at very regular intervals, very useful for control.


    Often, PC104 is also known as Target PC. It separates from a Host PC (where XPC-Target
    software is installed) for running real-time applications. The xPC-Target software
    environment includes the real-time kernel, real-time applications, and I/O drivers.
    As seen in Figure 4.14, the hardware environment consists of a Host PC, Target
    PC (or I/O boards in the Target PC), and a serial or Ethernet connection between
    the Host and Target PC. The real-time kernel and PC hardware enable xPC-Target
    to provide a cost-effective, high-performance, real-time target.'
  merge: -1
  img_proc: true
