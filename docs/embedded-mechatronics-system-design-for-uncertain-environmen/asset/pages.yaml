    # 4.4.1 Create xPC-Target real-time kernel using desktop PC as target PC


    The following is the steps required if the Desktop PC is used as the Target PC.
    The first step is to format the Target PC. Before formatting the hard drive, ensure
    that the data are backed up. The setup for the Target PC using the DAQ PCI card
    is shown in Figure 4.16.


    In computer system’s BIOS, select booting using the CD-ROM Drive. This may be
    done by restarting the computer and pressing the “F2,” “F8,” or “delete” key.
    Go to the BIOS menu and from there; go to the “advance BIOS” feature and set the
    CD-ROM boot as the first boot and the hard drive as the second boot. Set the configuration
    by pressing the “F10” key and pressing “Y” to exit. The Target PC has to be DOS
    partitioned for at least 5 to 10 GB. To format the hard disk in the Target PC,
    use the following options.


    +   1. Before starting the system, make sure to insert the Windows 98/2000/XP
    Operating System’s installer CD/DVD-ROM drive. Instructions on how to boot from
    the CD are usually included on the Windows installation program.

    2. The hard drive may also be formatted through the Computer Management Program.
    To do this, click the “start” key, enter “settings,” and click on the “control
    panel” icon shown on the Screen. The “Computer Program Management,” click on “Disk
    Management” and choose the hard drive that needs reformatting. Right-click on
    the chosen hard drive and select “Format”.

    3. The last way to format a hard drive is through a floppy diskette. Make sure
    to get a booting floppy diskette. This diskette must be capable of booting in
    DOS mode. The PC will be in the DOS mode after the booting process is completed.
    Type the syntax “format c:” (note that the letter in the command may change depending
    on the letter of the hard drive is located).


