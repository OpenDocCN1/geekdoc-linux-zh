    The prototype MCU system and LSM for conveyance purposes were designed and implemented
    for possible applications in the biochemical and semiconductor manufacturing plants.
    The LSM for propulsion was built using the noncontact digital commutation via
    the electronics, sensors, and the PIC18F4520 MCU. The hybrid electromagnetic levitation
    system uses two permanent magnets and two electromagnets for vertical levitation
    to reduce the power consumption. The sliding-mode feedback controller was then
    designed to control the air gaps while moving. As to other controllers, the proposed
    conveyance system using sliding-mode control can perform conveyance function under
    the disturbance and 30% of parameters uncertainties. Further research will focus
    on increasing the performance of the controller when the fault occurred in the
    H-Inf EMS system and applied it to a larger scale of the actual manufacturing
    environment. The actual videos tested on various environments can be seen below.


