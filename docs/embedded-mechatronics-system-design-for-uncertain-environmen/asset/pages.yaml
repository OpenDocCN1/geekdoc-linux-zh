    # 4.14.2 Underwater robotic vehicle dynamic model


    Considering the coordinate systems shown in Figure 4.81, the body-fixed frame
    coincides with the principal axes of the vehicle and is free to translate and
    rotate with respect to the earth-fixed frame. The origin of the body-fixed frame
    is the center of mass of the underwater robotic vehicle. The positive x-axis is
    oriented in the forward direction of the vehicle along the longitudinal centerline,
    and the positive z-axis is oriented downwards.


    The dynamic model of a nonlinear underwater robotic vehicle [7] is used for control
    systems design. In general, there are two methods to derive the dynamic model:
    the Lagrange equations using the variation method and the Newtonian''s equation
    using Newton''s Second Law of Motion. The latter method gives an equation using
    angular velocities about the body-fixed axes, the generalized variables used in
    the Lagrange equation, the angular velocities cannot be integrated to obtain angular
    displacements about these axes and are therefore unsatisfactory to adequately
    describe the orientation of a rigid body in three-dimensional (3D) space.


    However, the body-fixed angular velocities can be solved and transformed to give
    the orientation of the vehicle in 3D space using the Euler angles. The Euler''s
    transformation (or commonly known as kinematics equations) provides the relationship
    between the dynamics derived from the earth-fixed and the body-fixed coordinates.
    There are practical advantages to derive the dynamics in the body-fixed coordinate
    for the following reasons. First, most sensors and actuators mounted on the underwater
    robotic vehicle measure the body parameters such as the underwater vehicle''s
    velocities and propelling forces. The dynamic equation is inherently parameterized
    and hence less complicated since this parameterized form is not Euler''s angles
    dependent.'
