  md: "# 104 Embedded mechatronics system design for uncertain environments\n\n# 3.8.1\
    \ Sliding-mode control\n\nThe mathematical proof for the stability and convergences\
    \ of the SMC for the evolutionary fuzzy-based scheme is shown. In SMC, a sliding\
    \ surface in terms of error is defined. Any state that reaches the sliding surface\
    \ implies convergence to the desired earth-fixed coordinate defined as $\\mathbf{\\\
    eta}_d = [x_d \\ y_d \\ z_d \\ \theta_d \\ \\psi_d]^T$.\n\nLet the earth-fixed\
    \ coordinate error denoted by $\\mathbf{\\eta} = \\mathbf{\\eta} - \\mathbf{\\\
    eta}_d$ with the sliding surfaces are expressed as:\n\n```\n$$\\mathbf{s} = \\\
    dot{\\mathbf{\\eta}} + \\lambda\\mathbf{\\eta}$ \\quad (3.51)$\n```\n\nwhere $\\\
    mathbf{\\eta} = [x \\ y \\ z \\ \\phi \\ \\psi]^T$ is the actual earth-fixed coordinate\
    \ and $\\lambda > 0$ is the bandwidth. A common Lyapunov function is written as:\n\
    \n```\n$V(t) = \\frac{1}{2}\\mathbf{s}^T\\mathbf{M}_o\\mathbf{s}$ \\quad (3.52)$\n\
    ```\n\nThe derivative yields:\n\n```\n$$\\dot{\\mathbf{V}} = \\dot{\\mathbf{s}}^T\\\
    mathbf{M}_o\\mathbf{s}$ \\quad (3.53)$\n```\n\nWith $\\mathbf{M}_o\\mathbf{s}\
    \ = \\mathbf{M}_o(\\dot{\\mathbf{\\eta}}+\\lambda\\mathbf{\\eta})$, $\\mathbf{\\\
    eta}_d=0$ and $\\dot{\\mathbf{\\eta}}_d=0$ and $\\mathbf{\\eta}=\\mathbf{J}(\\\
    mathbf{\\eta})\\dot{\\mathbf{v}}$, $\\dot{\\mathbf{\\eta}}=\\mathbf{J}(\\mathbf{\\\
    eta})dot{\\mathbf{v}}$ can be written as:\n\n```\n$$\\dot{\\mathbf{V}}(t) = \\\
    mathbf{s}^T\\mathbf{M}_o\\mathbf{JM}_o^{-1}[\\tau - \\mathbf{C}_o(\\mathbf{v})\
    \ - \\mathbf{D}_o(\\mathbf{v}) - \\Delta(\\mathbf{\\eta}, \\mathbf{v}, \\mathbf{v}_c)]$\\\
    n\\nquad +\\mathbf{s}^T\\mathbf{M}_o(\\mathbf{J}\\mathbf{v} +\\lambda\\mathbf{\\\
    eta})$ \\quad (3.54)$\n```\n\n> **Remark 1:** The conditions $\\mathbf{\\eta}_d=0$\
    \ and $\\dot{\\mathbf{\\eta}}_d=0$ imply that ROV is regulating its velocity around\
    \ zero with zero acceleration for most of the time. In this case, the ROV is designed\
    \ to move slowly when it approaches its desired position.\n\nFrom the properties\
    \ in (3.46) to (3.50), there exist constants, $\\zeta_1, \\zeta_2$, and $\\zeta_3$\
    \ such that $\\Delta(\\mathbf{v}, \\mathbf{v}_e, \\mathbf{v}_c)$ in (3.54) is\
    \ bounded\n\n```\n$$\\Delta(\\mathbf{v}, \\mathbf{v}_e, \\mathbf{v}_c) \\le \\\
    mu_1||\\dot{\\mathbf{v}}|| + \\zeta_1||\\mathbf{v}|| + \\zeta_2||\\mathbf{v}||^2\
    \ + \\zeta_3 = \\delta(\\mathbf{v})$ \\quad (3.55)$\n```\n\nThe right-hand side\
    \ of the inequality (3.55) is a function (referred to $\\delta(\\mathbf{v}, t)$).\
    \ It can be computed using the feedback law and the bounds established for the\
    \ model uncertainties. The proposed control input $\\tau=\\mathbf{Tu}$, where\
    \ the control input can be written as:\n\n```\n$$\\mathbf{u} = -\\mathbf{T}^T[\\\
    mathbf{M}_o^{-1}[K_{sp}\\text{sgn}(\\mathbf{s}) + K_{si}\\mathbf{s} + K_{sd}\\\
    mathbf{s} + \\mathbf{J}\\mathbf{v} + \\lambda\\mathbf{\\eta}]$ \\quad (3.56)$\n\
    ```\n\nwhere $K_{sp}, K_{si}, K_{sd}$ are the adjustable SMC's gains and $\\mathbf{T}^+=(\\\
    mathbf{T}^T)^{-1}\\mathbf{T}^T$ is the Moore-Penrose pseudoinverse. Substituting\
    \ the control law back into $\\mathbf{V}$ yields:\n\n```\n$$\\dot{\\mathbf{V}}(t)\
    \ \\le \\mathbf{s}^T\\mathbf{M}_o[-K_{sp}\\text{sgn}(\\mathbf{s}) - K_{si}\\mathbf{s}\
    \ - K_{sd}\\mathbf{v}] \\le 0$ \\quad (3.57)$\n```"
