- pgno: 299
  md: 'Define a Lyapunov function candidate as: $V_L = S^2/2$. The derivative of $V_L$
    with respect to time is expressed as follows:


    ```

    $$\dot{V}_L = S\dot{S}$$\n= s(\dot{z}_d - \frac{G_f}{m} - L_u + \lambda\dot{z})$$\n=
    -k_1S^2 - k_2S\text{sgn}(s) - SL_u$\n= -k_1S^2 - |s|(|k_2| - |L_u|)\n\leq -k_1S^2$
    (5.42)

    ```


    where $k_2 > |L_u|$ and $k_1 \leq 0$ are positive constants to achieve the desired
    levitation gap and ensure $\dot{V}_L \leq 0$ implies $V_L(t) \leq V_L(0)$, and
    therefore $S$ is bounded. This, in turn, implies that $\dot{V}_L$ is bounded.
    Hence $V_L$ must be uniformly continuous. Application of Barbalat''s lemma shows
    that $S \rightarrow 0$ and $e_2 \rightarrow 0$ as $t \rightarrow \infty$.


    As the sign function $\text{sgn}(\cdot)$ gives a chattering signal, can be eliminated
    by smoothing out the boundary discontinuity into a boundary layer by replacing
    the function with $\text{sat}(\cdot)$. This substitution adds a low-pass filter
    structure to the dynamics of the sliding surface inside the boundary layer as
    seen below.


    ```

    $u_{\text{smc}} = \frac{m}{G_f}(k_1S + k_2\text{sat}(s) + \lambda\dot{z})$$ (5.43)

    ```


    where


    ```

    $$\text{sat}(s/\Phi) = \begin{cases} \text{sgn}(s), & \text{if } |S|/\Phi > 1
    \ S/\Phi, & \text{if otherwise} \end{cases}$$ (5.44)

    ```


    moreover, $\Phi$ is the boundary layer thickness design for the sliding-mode controller.
    Figure 5.63 shows the final control system design for the sliding-mode controller.
    The controller calculates the amount of current to be applied to the EMS system
    using


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_299_0.png)


    Figure 5.63 Block diagram of sliding-mode controller for hybrid EMS system'
