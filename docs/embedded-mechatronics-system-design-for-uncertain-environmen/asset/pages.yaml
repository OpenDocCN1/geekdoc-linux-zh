    for submerged vehicles are extremely scarce in literature [21,23]. Hence, a comparison
    of the computed derivatives with available results could be difficult. As such,
    even for same geometry, the coefficient values obtained from different sources
    show large scatter [24], it can only be said that the estimated coefficient values
    are at best accurate within some bound. The main objective of the present work
    is to show that the CFD results are within the acceptable range and more importantly
    to show CFD results essentially predict the forces or moments as nonlinear variation
    of the velocity using the same model. ANSYS-CFX is used as FLUENT (commonly used
    in the literature) was not available, but the model adopted for the analysis is.
    In this case, the Kempf model in [21,22] with L/D=6 is used. As shown in Table
    4.1, the results seem to be higher than the one stated in the literature. This
    may be due to the boundary, meshing, and outflow settings in the software that
    are not mentioned. However, the results exhibit around 5% error as compared to
    the results from the literature.


    Hence, ANSYS-CFX is able to predict similar results and therefore the results
    are at best accurate within reasonable bound. Besides, the nonlinear damping coefficients
    were obtained; it is also possible to obtain linear damping coefficients with
    appropriate initial conditions. However, since the nonlinear damping is more difficult
    to obtain and important to the underwater robotic vehicle, it is commonly designed
    to pitch in order to reach a greater depth (although the test has less pitching).


    In summary, all of these findings offer a reference point for which coefficients
    need to be investigated when considering the proposed underwater robotic vehicle
    that has a different shape compared to the streamlined semi-empirical or empirical
    model at different conditions. The values of the parameters obtained for the underwater
    robotic vehicle are shown in Table 4.5.


