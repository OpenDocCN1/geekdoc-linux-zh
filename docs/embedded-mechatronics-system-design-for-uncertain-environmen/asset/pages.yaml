  md: '# 262 Embedded mechatronics system design for uncertain environments


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_278_0.png)


    Figure 5.48 3D view of magnetic conveyance system


    (0.20 kg), a conveyor bogie (3 kg), and a conveyor cart (0.30 kg). In the magnetic
    conveyance system, it has a hybrid electromagnetic levitation system, consisting
    of a linear synchronous motor (LSM) assisted by contactless sensing for a propulsion
    drive that keeps track of the position of the conveyor cart. To ensure that the
    system levitates appropriately, an array of permanent magnets is placed on the
    top and bottom of the base assembly.


    This arrangement of the repulsive magnet array helps to avoid misalignment in
    the lateral direction and maintain the initial levitation gap and propulsion.
    On the other hand, a hybrid EMS system using repulsive approach is used to provide
    additional magnetic levitation without consuming additional electrical energy.
    During the propulsion, a MCU and IR sensors are used to maintain the reference
    gap between the magnetic coil and the guideway. Figure 5.49 shows the front view
    of the final design and its components within the conveyor system.


    The magnetic levitation is accomplished by the hybrid electromagnetic levitation
    system. The hybrid electromagnetic levitation system uses two permanent magnets
    and electromagnets (see Figure 5.50). The former compensates the levitation force,
    while the latter produces magnetic forces to control the air gap to the desired
    point. The material used for the electromagnetic core was laminated silicon steel
    of 0.005 m thick with layers of Neodymium magnets on top.


    As shown in Figure 5.50, the two IR sensors measure the air gap on both sides
    of the conveyor cart. The sensor signal goes into the PIC18F4520 MCU to act the
    two electromagnets on the left and right sides of the cart. The control algorithm
    is implemented in MPLAB environment where the MCU interfaces the MCU to the user''s
    computer (installed with the MPLAB software) via a PICkit2 programmer/debugger.
    The other side of the compiler is connected to the MCU through'
