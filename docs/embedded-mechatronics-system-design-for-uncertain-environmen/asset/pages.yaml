    \            try:\n                im = Image.Open(os.path.join(subject_path,\
    \ filename)) im = im.convert(\"L\")\n                # resize to size (if given)\n\
    \                if sz is not None:\n                    im = im.resize(sz, Image.ANTIALIAS)\
    \ X.append(np.array(im, dtype=np.uint8))\n                y.append(c)\n      \
    \      except IOError(error):\n                print(\"IO error: {}\".format(error))\n\
    \            except:\n                print(\"Unexpected error: {}\".format(sys.exc_info()[0]))\n\
    \            c = c+1 [X,y]\n```\n\nThe problem with the image representation is\
    \ given a high dimensionality. Two-dimensional p x gray images span a pq-dimensional\
    \ vector space, so an image with 100 x 100 pixels lies in a 10000-dimensional\
    \ image space. It contains too much information that may not be useful. As result,\
    \ the components of information are taken into account. Hence, a PCA can be proposed.\
    \ The idea is that a high-dimensional dataset is often described by correlated\
    \ variables. There exist few meaningful dimensions for the most dominant information.\
    \ The PCA method finds the directions with the most significant variance in the\
    \ data called principal components. Eigenfaces method can be used. The following\
    \ code defines to reshape the multidimensional data.\n\n```\ndef asRowMatrix(X):\
    \ if len(X) == 0:\n    return np.array([])\nmat = np.empty(0,X[0].size,dtype=X[0].dtype)\
    \ for row in X:\n    mat = np.vstack((mat,np.array(row).reshape(1,-1))) return\
    \ mat\ndef asColMatrix(X): if len(X) == 0:\n    return np.array([])\nmat = np.empty(X[0].size,\
    \ 0,dtype=X[0].dtype) for col in X:\nmat = np.hstack((mat,np.array(col).reshape(-1,1)))\
    \ return mat\n```\n\nThe following set of code will implement the PCA. It also\
    \ implements the inner-product PCA formulation that if there are more dimensions\
    \ than samples."
