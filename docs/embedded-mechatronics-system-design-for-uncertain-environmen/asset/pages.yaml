    # 7.3 Face recognition system


    A visual-based surveillance system can be developed using Raspberry Pi. The intelligent
    system can enhance the modern world of security and surveillance. Local binary
    patterns (LBP) and Haar cascade classifiers are the two most popular face detection
    techniques. LBP represents the image as a local representation of matrices with
    gray-level co-occurrence. The main benefit of implementing LBP is the ability
    to capture fine details on an image [21]. Haar classifier (see Section 7.1) is
    a machine-learning approach where the functions of cascades are trained using
    positive and negative images. The positive images refer to the image of objects
    and the negative images refer to the images without the object [22].


    Face recognition in CV is capable of identifying a person by comparing the facial
    features detected against the face database. Two of the most effective detection
    methods are Eigenfaces and Fisherfaces. Eigenfaces use principal component analysis
    (PCA) to represent a gray two-dimensional image with a set of correlated variables
    represented in the form of the covariance matrix. Eigenvalues and Eigenvectors
    are calculated and projected over the training samples in a PCA subspace to recognize
    the facial images. Fisherfaces use linear discriminant analysis (LDA) that determines
    the combination of features by maximizing the ratio of within-classes to between-classes.
    The clustering of identical classes and different classes separately are performed
    in low dimensions [23]. Fisherfaces methods are best in interpolating and extrapolating
    the lighting situations and better handling the facial expressions.


