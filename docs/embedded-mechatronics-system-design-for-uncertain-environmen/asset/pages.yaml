    As observed in the open-loop response, the EMS control system requires some feedback
    control for the conveyance system. Instead of using the PID controller, it is
    recognized that H-Infinity controller is an effective method for attenuating disturbances
    and that the sliding-mode control scheme is able to compensate for the unknown
    disturbances. The purpose of this section are to examine the proposed sliding-mode
    controller as compared to other controllers (such as PID and H-Infinity controller)
    for magnetic levitation systems. To achieve this, a magnetic levitation system
    experiment is constructed as shown in Figure 5.62. The controllers were designed,
