    # 5.5 Magnetic conveyor system design


    The details of the magnetic conveyor system used in this section can be found
    in the following reference [22]. High-speed trains are one application of a transport
    system that uses the magnetic levitation technology. The TransRapid in Germany
    [23], for example, uses a combination of a synchronous linear drive and an electromagnetic
    levitation system. They began development about 50 years ago'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'of what is referred to as an electromagnetic system. The electromagnetic system
    can be divided into the electrodynamics suspension system, electromagnet suspension
    system (EMS), and most recent hybrid forms using a permanent magnet. Besides TransRapid
    in Germany, the applications of these magnetic suspension systems were also developed
    over high-speed train systems such as HST [24] and MLX [23,25] in Japan, UTM [26]
    in Korea, and MagLev in China [27].


    As shown in the above, magnetic levitation systems have practical importance in
    the railway industry. Another critical application of the EMS is in transport
    system [28–32] such as semiconductor assembly line, biochemical manufacturing,
    industry production, food processing, and baggage conveyance, of which further
    studies have not done much development, despite the general interest in these
    systems. The recent studies have been made in the magnetic levitation technology
    to substitute traditional conveyor or assembly line technology. High operational
    availability combined with low operating costs are the main demands of modern
    conveyor systems. Conventional conveyor systems are often based on the pulley,
    and chain connects have suffered from friction and high maintenance. As the demand
    for expensive maintenance increases exponentially with the conveyor system, its
    upper limit is often restricted.


    In recent years, magnetic levitation techniques have been used for eliminating
    friction due to mechanical contact, decreasing maintainable cost and achieving
    proper positioning at higher speed. A conveyor system using the magnetic levitation
    principles is to tap into these tangible benefits of a magnetic levitation principle.
    To improve the levitation gaps, a hybrid approach using EMS with repulsive levitation
    is used jointly with contactless sensing and an array of magnets in the LSM.


    There are some disadvantages in these EMS systems. The magnetic levitation force
    is inherently unstable [31–34] and highly nonlinear, which requires a closed-loop
    controller to stabilize the system. For the past decades, the magnetic levitation
    systems used many linear and nonlinear control strategies based on model-based
    and model-free method [33]. A sliding-mode controller [34] is implemented for
    the conveyance system to provide a systematic approach to the problem of maintaining
    stability and performance in the face of modeling imprecision. To the best of
    our knowledge, the details of implementing the sliding-mode control system involving
    the MCU for the electromagnetic actuated conveyance system have not been seen
    in the literatature. The potential application for the proposed prototype could
    be used for material transportation in biochemical and semiconductor plants as
    need to be completely free from dust and slight noise.


