    $$\Delta(\\mathbf{v}, \mathbf{v}_c, \mathbf{\dot{v}}_c) = \Delta\mathbf{M} + \Delta\mathbf{C}(\mathbf{v})
    + \Delta\mathbf{D}(\mathbf{v}) + \mathbf{H}(\mathbf{v}, \mathbf{v}_c, \mathbf{\dot{v}}_c)$
    $\quad (3.44)$

    ```


    and


    ```

    $$\Delta\mathbf{M} = \mathbf{M} - \mathbf{M}_o; \Delta\mathbf{C} = \mathbf{C}(\mathbf{v})
    - \mathbf{C}_0(\mathbf{v}); \Delta\mathbf{D} = \mathbf{D}(\mathbf{v}) - \mathbf{D}_0(\mathbf{v})$
    $\quad (3.45)$

    ```


    Note that the parameters used in (3.42) can be obtained from nominal model except
    for $\Delta(\mathbf{v}, \mathbf{v}_c, \mathbf{\dot{v}}_c)$ that defines the lumpsed
    uncertainty due to the model uncertainties and underwater current is bounded by
    the following properties:


    ```

    $$\exists m_1, m_2 > 0: m_1||\mathbf{v}||^2 \le \mathbf{v}^T\mathbf{M}_o\mathbf{v}
    \le m_2||\mathbf{v}||^2, \forall \mathbf{v} \in \mathbb{R}^6$ $\quad (3.46)$

    ```


    ```

    $$\mu_1 > 0 : 0 < \mathbf{v}^T\Delta\mathbf{M}\mathbf{v} \le \mu_1||\mathbf{v}||^2$
    $\quad (3.47)$

    ```


    ```

    $$\mu_2 > 0 : ||\Delta\mathbf{C}(\mathbf{v})|| \le \mu_2||\mathbf{v}||^2$ $\quad
    (3.48)$

    ```


    ```

    $$\delta_i > 0, i = 1, \dots, 3 : ||\mathbf{D}(\mathbf{v})|| \le \sum_{i=1}^3
    d_i||\mathbf{v}|| + \sum_{i=1}^3 d_i||\mathbf{v}_c||$ $\quad (3.49)$

    ```


    ```

    $$\beta_i > 0, i = 1, \dots . 3 : ||\mathbf{H}|| \le \beta_i||\mathbf{v}|||\mathbf{v}_c||
    + \beta_i||\mathbf{v}_c||^2 + \beta_i||\mathbf{\dot{v}}_c||^2$ $\quad (3.50)$

    ```


    The disturbances are bounded signals, $\mathbf{u}_c \in L_{(0,\infty)}, \mathbf{\dot{u}}_c
    \in L_{(0,\infty)}$ for $\mathbf{v}_c$ and $\mathbf{\dot v}_c$, respectively.
    The estimated bounds for the model uncertainties are obtained from ROV physical
    characteristics and experimental tests that indicate more than 20% error or uncertainties
    in the nominal model in Section 3.3. Once the upper bound for $\mathbf{u}_c$ and
    $\mathbf{\dot{u}}_c$ is fixed, the effect of the disturbance becomes a bounded
