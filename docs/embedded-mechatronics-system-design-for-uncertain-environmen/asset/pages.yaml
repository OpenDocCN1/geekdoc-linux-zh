  md: '# Chapter 7


    # Raspberry Pi-embedded system design


    # 7.1 Fouling detection system


    The details in this section can be found in [1]. The colonization of fouling organisms
    on marine structures has been perceptual phenomenon in the marine industry. Commonly
    found fouling organisms include barnacles and algae that tenaciously grip onto
    marine structures such as the ship''s hull, columns of offshore structures, and
    marine debris. Fouling activity can take place especially when a vessel is stationary.
    These organisms form a layer of increased surface roughness that would lead to
    a turbulent flow layer along the surface of the hull, creating a viscous effect,
    and thereby influencing the tremendous effort by a naval architect to design an
    ideal hull form. By reducing frictional resistance generated by the hull flow-through
    seamer, a ship owner can save on additional fuel consumption since frictional
    resistance constitutes up to 90% of the total drag force. Acquiring the same speed
    with additional fuel or using the same amount of fuel input results in lower ship''s
    speed and undesirable situations that a ship with a fouled condition will experience.
    Slow-speed vessels with a deep draft where greater part of the hull surface gets
    in contact with seawater attract the habitation of fouling organisms as fast-moving
    vessels create a hydrodynamic force that affects the capability to attach themselves
    onto the hull surface [2].


    Transportation of cargo shipping, being the cheaper alternative, accounts for
    approximately 80% of the global trade [3]. Such demand for sea trade relates to
    shipping owners planning on shipping methods to achieve higher profitability.
    Thus, monitoring of fouling conditions is essential to prevent delays. Researcher
    in [4] conducted a study to analyze fuel efficiency of 44 general cargo ships
    using Automatic Identification System. Half the fleet was loaded with 7,700 deadweight
    tonnage while the other half was loaded with 12,700 deadweight tonnage. The result
    shows that the optimum speed range is present when the ship is propelling at 7.8
    to 9.7 knots.


    During a voyage, a vessel can be subjected to adverse weather condition that is
    not part of predetermined factors. On the other hand, proper loading of cargo
    and fouled hull condition can be monitored to improve the fuel efficiency before
    a vessel departs. It is important to emphasize on proper drydocking schedule to
    prevent the accumulation of fouling over time. Some ship owners may'
