- pgno: 215
  md: "# xPC-Target embedded system design 199\n\n# 4.14.5 Controller design\n\nTo\
    \ reduce the oscillation response of the top control surface as seen in the open-loop\
    \ test, a closed-loop control system is required. The surge position is controlled\
    \ by the propeller speed (using the PID controller) while the heading angle is\
    \ controlled by the top surface angle (denoted by $\\psi$). There have been various\
    \ efforts to develop the controller for the underwater robotic vehicle, which\
    \ include both the (conventional) linear and the (modern) intelligent control\
    \ schemes. The complexities of control requirements, it is clear that the linear\
    \ controller is unable to control the vehicle satisfactorily [25]. Intelligent\
    \ control methods which include NN, sliding mode (SLC), and FLC are more robust\
    \ and able to adapt to the vehicle's hydrodynamic uncertainties. In addition,\
    \ they exhibit excellent immunity to disturbances. The SMC [6] is chosen. By using\
    \ xPC-Target blocksets, the complex SMC scheme can be easily implemented on the\
    \ underwater robotic platform. For notational simplicity, define a scalar measure\
    \ of tracking\n\n```\n$s = \\dot{q} + \\lambda\\tilde{q}$\n```\n\nwhere $\tilde{q}\
    \ = q - q_d$ is the tracking angle, i.e., the error of the top control surface\
    \ angle. $\\lambda > 0$ is the control bandwidth. For $s=0$, this description\
    \ describes a sliding surface with exponential dynamics\n\n```\n$\tilde{q}(t)\
    \ = \\exp[-\\lambda(t - t_0)]\\tilde{q}(t_0)$\n```\n\nensures that the tracking\
    \ error $\tilde{q}(t)$ converges to zero in infinite time when $s=0$ (sliding\
    \ mode). The error trajectory tracks the time-varying sliding surface in finite\
    \ time for any initial condition $\tilde{q}(t_0)$, and then slides along the surface\
    \ toward $\tilde{q}(t)$ exponentially. Hence, the control objective is reduced\
    \ to finding a control law which satisfies $\nlim_{t\\to\\infty} s(t) = 0$.\n\n\
    In the design of the sliding control law, it is convenient to define a virtual\
    \ reference $\\dot{q}_r$ satisfying\n\n```\n$\\dot{q}_r = \\dot{q} - \\lambda\\\
    tilde{q} \\Rightarrow s = \\dot{q} - \\dot{q}_r$\n```\n\nHence, the following\
    \ expression for $\tau_m s$ is obtained.\n\n```\n$\\tau_m s = \\tau_m(\\dot{q}\
    \ - \\dot{q}_r)\\n= (K_m V - \\tau_m\\dot{q}_r)\\n= -|\\tilde{q}|s + (K_m V -\
    \ \\tau_m\\dot{q}_r - |\\tilde{q}|\\dot{q}_r)$\n```\n\nConsider the scalar Lyapunov\
    \ function candidate\n\n```\n$V_L(s,t) = \\frac{1}{2}\\tau_m s^2, \\tau_m > 0$\n\
    ```\n\nDifferentiating $V_L$ with respect to time (as $\\dot{\tau}_m = 0$) yields\n\
    \n```\n$\\dot{V}_L = \\tau_m s\\dot{s} = -|\\tilde{q}|s^2 + s(K_m V\\tau_y - \\\
    tau_m\\dot{q}_r - |\\tilde{q}|\\dot{q}_r)$\n```"
  merge: -1
  img_proc: true
