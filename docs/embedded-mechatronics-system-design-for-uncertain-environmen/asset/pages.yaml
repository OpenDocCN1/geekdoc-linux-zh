  md: '# 182 Embedded mechatronics system design for uncertain environments


    Hence, the rigid body underwater robotic vehicle equation is commonly expressed
    in the body-fixed frame since the control forces and measurement devices are quickly
    and intuitively related to this body frame of reference. Using the Newtonian approach,
    the motion of a rigid body with respect to the body-fixed reference frame at the
    origin can be obtained. A detailed discussion about the robotic vehicle modeling
    was presented in [7] and the hydrodynamic forces and moments modeling could be
    found in [8,9]. The assumptions made in deriving the underwater robotic vehicle''s
    dynamic equation are (a) the vehicle is rigid and fully submerged in water; (b)
    the vehicle is slow moving for operation in underwater; and (c) the earth-fixed
    frame of reference is inertial.


    In (4.1), the external force and moment vector include the hydrodynamic forces
    and moments due to damping, inertial of surrounding fluid, and the restoring force
    and moment. These forces and moments tend to oppose the motion of the underwater
    robotic vehicle. The equations of motion can be described by a set of differential
    equations in the body-fixed frame by the application of Newton''s second law in
    the earth-fixed frame [7]. The similar experiment to model the vehicle dynamics
    can be seen in (3.8) in Chapter 3.


    The transformation using the Euler angles provides an important transformation
    between the dynamics expressed in the body-fixed frame (3.8) to the earth-fixed
    frame. As the accelerations of a point on the surface of the Earth can be neglected,
    for slow-moving marine vehicles, the earth-fixed frame can be considered to be
    an inertial frame. The kinematics equations [7] can be written as:


    ```

    $$\eta = J(\eta)\nu$ (4.33)

    ```


    where the Euler transformation matrix, $J(\eta)$ is derived by successive rotation
    of the Euler''s angles around Z, Y, and $X$ axes to give:


    ```

    $J(\eta_2) = \begin{bmatrix} J_1(\eta_2) & 0 \ 0 & J_2(\eta_2) \end{bmatrix}$
    (4.34)

    ```


    where


    ```

    $J_1(\eta_2) = \begin{bmatrix} c(\psi)c(\theta) & -s(\psi)c(\theta) & s(\psi)
    \ s(\psi)s(\theta)c(\phi)-c(\psi)s(\phi) & -c(\psi)s(\theta)c(\phi)+s(\psi)s(\phi)
    & -c(\psi)s(\phi) \ c(\psi)s(\theta)c(\phi)+s(\psi)s(\phi) & -s(\psi)s(\theta)c(\phi)+c(\psi)s(\phi)
    & -s(\psi)s(\phi) \ -s(\theta) & c(\theta) & c(\theta) \end{bmatrix}$ (4.35)

    ```


    ```

    $J_2(\eta_2) = \begin{bmatrix} s(\phi)t(\theta) & c(\phi)t(\theta) \ 0 & s(\phi)
    & -s(\phi) \ 0 & c(\phi) & c(\phi) \end{bmatrix}$ (4.36)

    ```


    and $s = \sin(\cdot), c = \cos(\cdot),$ and $t = \tan(\cdot)$.'
