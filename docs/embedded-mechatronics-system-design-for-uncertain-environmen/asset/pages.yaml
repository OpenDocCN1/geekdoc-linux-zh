    Alternatively, one can use a desktop PC with an I/O boards like PCI DAI card (e.g.,
    NI-PCI 6023E, 6221) inserted into the empty PCI slot as a Target PC in Figure
    4.15. Instead of using an extra desktop PC as the Target device, one can use the
    real-time Window Target. The PCI card can be slotted into the Host PC and ensures
    that the overall control systems more compact to use.


    In general, the steps in using the xPC-Target from preparing the xPC-Target blocks
    and lastly to the downloading and running in the real-time mode are follows:


    +   **xPC-Target real-time kernel** requires formatting of the hard disk in the
    xPC-Target to the DOS format and ensures that it is bootable by the DOS operating
    system. It also involves the configurations of the Basic Input/Output System (BIOS)
    settings. As shown in Figure 4.23, the it requires the card to be configured as
    a bootable disk. We use in place of a hard disk. We format the control so that
    it will automatically boot into xPC real-time kernel when the HIL systems is powered.


    +   **Create xPC-Target Simulink® blocks** for the HIL systems. In configurations,
    a Host PC is installed with MATLAB®. The models will be created through Simulink®
    blocks sets. It can add I/O blocks to the model, and then use the Host PC with
    Real-Time Workshop and a/C++ compiler to create executable code in the Target
    PC. As seen in the later part, programs are created using simple drag-and-drop
    procedures and require minimal “coding” except few standard setup procedures that
    is required to perform.


    +   **Download and run in real time**. The executable code is downloaded from
    the Host PC to the Target PC running the xPC-Target real-time kernel. After downloading
    the executable code, Target application can be run and tested in real time. It
    can then be triggered to run in standalone or externally using the Simulink® External
    mode on the Host PC.'
