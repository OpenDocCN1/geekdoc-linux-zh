    The contents in this section were obtained from the reference [9]. The launch
    and recovery process consists of deploying the vehicle into the water. The mission
    begins once the remotely operated underwater reaches the mission depth and steers
    away from the aft of the launch vessel. After the mission of recovering the smaller
    vehicle, the remotely operated underwater vehicle ascends to the surface that
    is within the range of the hand-operated rope winch. The vehicle is recovered
    using the winch, and concludes the mission.


