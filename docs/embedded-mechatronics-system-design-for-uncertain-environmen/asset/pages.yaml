    Distance calculation from camera to an object is a well-studied problem in CVs.
    There are a few simple and straightforward methods that use triangle similarity
    method that give very sophisticated methods. In this section, the triangle similarity
    method was used. The triangular similarity method used an algebraic approach to
    find the distance between the camera and the object. For example, the Object with
    a width W placed at D distance from the camera, a picture is taken, and the apparent
    width is measured in pixels. With these values, the focal length F of the camera
    can be calculated.'
