    When the waiting process wakes up, the waking counter is now 1, and it knows that
    it may enter the critical region. It decrements the waking counter, returning
    it to a value of zero, and continues. All access to the waking field of the semaphore
    is protected by a buzz lock using the semaphore''s lock.


