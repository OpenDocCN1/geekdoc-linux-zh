- pgno: 27
  md: '# Introduction 11


    system design and architecture, software programming, system implementation, and
    testing. These steps are used in the subsequent chapters for the readers to follow
    systematically.


    +   1. **Understanding requirements and specifications for applications:** It
    involves examine essential operational characteristics, network communication,
    system configurations, external working environment, and problems facing;


    +   2. **Formulate control objectives:** It involves defining the control parameters;


    +   3. **System design and architecture:** It involves select hardware availability,
    costs, knowledge requirements, functional characteristics, identify additional
    component features, types of energy storage system, constraints or limitations,
    and control methodology;


    +   4. **Software programming:** It includes selecting physical software by considering
    the software functionality, availability, knowledge of software principle, functional
    characteristics, constraints or limitations, and numerical modeling of embedded
    system using computer-aided software;


    +   5. **System implementation:** It includes implementing the open-loop (at the
    first instance to test the subsystems) or closed-loop system (the next step to
    validate the functionality of the closed-loop system) via hardware-software-in-the-loop
    simulations (potentially in the laboratory or controlled environment);


    +   6. **Testing:** In an external or actual environment, it includes examining
    the design functionality to meet objectives, validating design in a different
    environment to test robust performance, and finetuning design for improvement
    before finalizing the embedded system design.


    As seen in the proposed steps, the applications have to be defined. The problems
    and challenges of the systems need to be identified. It includes visiting the
    prototype available in the markets or Internet and searching for useful publications
    to gain insight into the problems related to the applications. In addition, it
    requires more information from the end-user (or even vendors who supplied the
    components) to understand the specifications of the components required.


    After formulating the control objectives, the control variables have to be decided.
    The control parameters need to be measurable or at least estimated from the given
    controllable and observable system. If the hardware and software are selected.
    The number of control variables are usually more than the one that leads to a
    multivariable system with many states. Subsequently, the selection of hardware
    is essential as it determines whether the additional numerical model of the individual
    system is needed. For example, some devices that generate ON/OFF function do not
    need dynamic modeling. The sensor needs to be calibrated, and the communication
    ports such as RS232, USB, and others need to be decided. Hence, the types of hardware
    used are essential. Undoubtedly the cost is another factor that decides the selection
    of hardware. The types of energy storage system will to be chosen. For example,
    lithium iron phosphate battery or LiFePO4 batteries have become popular due to
    their high specific power, high specific energy density, long cycle life, low'
