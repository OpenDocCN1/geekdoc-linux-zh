- pgno: 298
  md: '# 282 Embedded mechatronics system design for uncertain environments


    downloaded into the PIC18F4520 via the PICkit debugger. The air gap signal was
    subsequently measured by the sensors using analog-to-digital converter and its
    signal were later captured using the laboratory oscilloscope for comparisons with
    the simulated results.


    As shown in the experiment using the PID controller (controller''s parameters
    as $k_p=8, k_i=2, k_d=3$), the controller is trying to maintain at the reference
    air gap for a period of time before it slides to its steady-state condition in
    Figure 19. It is observed that during forward propulsion, the conveyor tends to
    oscillate before attracted to the electromagnet. To circumvent this problem, the
    electromagnets need demagnetize when the air gap becomes small. This helps to
    prevent the track from getting attracted to the electromagnets.


    To accomplish this, a robust control method such as the sliding-mode controller
    is used to compensate for the errors and uncertainties in the model. The following
    shows how the sliding-mode controller was implemented. To achieve the control,
    the tracking error and its derivative are defined as: $e_z = z_c - z$ and $\dot{e}_z
    = \dot{z}_c - \dot{z}$, respectively. The sliding surface is designed as follows:


    ```

    $S = \dot{e}_z + \lambda e_z \quad (5.36)$

    ```


    where $\lambda$ is a positive constant. By taking the derivative of the sliding
    surface with respect to time and use $\dot{z}=G_f u/m + L_u$,


    ```

    $\dot{S} = \dot{z}_d - \frac{G_f}{m}u - L_u + \dot{\lambda}\dot{e}_z \quad (5.37)$

    ```


    The sliding-mode control law is designed as:


    ```

    $u_{smc} = \frac{m}{G_f}(k_1S + k_2 \text{sgn}(s) + \lambda\dot{e}_z + \dot{z}_d)
    \quad (5.38)$

    ```


    where $m$ and $G_f$ are both positive system parameters; $k_1$ and $k_2$ are positive
    control parameters.


    The ideal control command $I^*$ is calculated as:


    ```

    $I^* = \sqrt{u_{smc}} \geq 0 \quad (5.39a)$

    ```


    ```

    $I^* = -\sqrt{-u_{smc}}, \text{ if } u_{smc} < 0 \quad (5.39b)$

    ```


    By taking the overall control system into consideration, the control voltage produced
    by current modules is designed as:


    ```

    $V = I^*L_{coils} + I^*R_{coils} \quad (5.40)$

    ```


    Finally, the actual control duty is obtained as:


    ```

    $d_{smc} = V/V_{dc} \quad (5.41)$

    ```'
