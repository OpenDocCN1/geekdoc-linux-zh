    sliding surface (near to zero air gap error).


    Figure 5.64 shows the oscilloscope images obtained from one of the electromagnetic
    coils using the sliding-mode controller. The image in Figure 5.65 shows the controller
    trying to maintain the air gap for a period. However, there is still some chattering
    as seen in the actual responses. However, the responses of the simulated and actual
    results exhibit the same value after 0.4 s.


    # 5.5.3 Testing


    Table 5.8 shows the comparisons of various controllers on the hybrid EMS system.
    A predefined uncertainty level of 30% for $\Delta m$ and $\Delta G$ were used
    for the comparison. The simulated results for each controller are plotted as shown
    in Figure 5.66. The sliding-mode controller gives the smallest error as observed
    from the maximum or infinity norm measured of the air gap as compared with its
    peers such as the H-Infinity controller. However, both the sliding-mode controller
    and H-Infinity controller can maintain a distance from the guideway, which prevents
    the electromagnets to be attracted to the guide way in the case of the PID controller.
    With the parametric uncertainty presence in the EMS’s model, the sliding-mode
    controller seems to perform better than the PID and H-Infinity controller in terms
    of the steady-state error.'
