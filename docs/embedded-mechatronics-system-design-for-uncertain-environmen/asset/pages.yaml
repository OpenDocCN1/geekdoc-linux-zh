    Creating a Haar cascade for Image or Video Object Classification requires the
    following steps.


    +   1. Collection of “Negative” or “Background” images.

    These images contain the object of interest. The higher the number of images,
    the higher the accuracy. Around 500 images of acorn barnacles, mostly'
