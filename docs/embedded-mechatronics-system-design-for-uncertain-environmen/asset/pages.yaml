  md: '# xPC-Target embedded system design 183


    Some methods have been proposed to determine the hydrodynamic coefficients. They
    can be broadly classified into test-based and predictive methods. Test-based methods
    involve experimental determination of the hydrodynamic parameters directly by
    wind-tunnel or towing-model tests, as well as the testing of full-sized vehicles
    [10–12]. An overriding disadvantage of the methods is the need of an accurate
    physical model of the vehicle or the vehicle itself, as well laboratory or in-field
    testing facilities. These are often not available for reasons of cost or because
    the vehicle has not yet been constructed. Predictive methods offer an alternative
    to test-based methods when the vehicle is still in the design stages or when cost
    prohibits a full-scale testing program.


    The most basic of the predictive methods are purely analytical methods, but these
    are prone to yielding unrealistic results for complex bluff bodies. A detailed
    discussion and evaluation of three of the existing methods [13] was proposed.
    Empirical and semi-empirical methods are the most widely used of the predictive
    methods and have been shown to yield reasonable results [14,15]. Hence, the predictive
    methods are likely to yield realistic results on a streamlined vehicle since their
