    7.1.2 Programming and system implementation

    Figure 7.25 describes the flowchart of the Python program. The first step in this
    program requires the selection of live video or perspective live video. The perspective
    live video will convert three-dimensional frames to two-dimensional frames to
    generate a perspective view. The program considers the keel with a curvature that
    leads to a false detection by the program. The captured image will allow Haar
    algorithm to classify the types of barnacles. The outcomes of the program will
    allow the user to observe the density of the image covered by barnacles and the
    percentage of barnacles in a given area.


