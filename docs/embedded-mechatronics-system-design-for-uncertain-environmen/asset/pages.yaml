    method. There are few ways to implement the digital speed control. The pulse-width
    modulation method, PWM is used to control the speed of the motor. In a nutshell,
    PWM is a way of digitally encoding analog signal levels. Through the use of high-resolution
    counters, the duty cycle of a square wave is modulated to encode a specific analog
    signal level. The PWM signal is still digital, at any given instant of time, the
    full DC supply is either entirely on or off. The voltage or current supply is
    supplied to the analog load using a repeating series of on and off pulses. The
    on-time is the time during which the DC is supplied to the load, and the off-time
    is the periods during which supply is switched off. Given sufficient bandwidth,
    any analog value can be encoded with PWM. Figure 4.10 shows three'
