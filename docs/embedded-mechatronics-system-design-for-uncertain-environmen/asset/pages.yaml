    the motor about the joints will create movement to enable the gripper to grip
    onto the pole. Moreover, the reverse rotation will allow the gripper to release
    itself from the grip.


    +   2. Rotation and traveling mechanism: The rotational module aims to allow the
    robot to travel on the pole or suspended pole. The module consists of two motors,
    each drive one set of the gripping arm. The two arms will turn to rotate. The
    respective gripper will release its grip when it rotates. The rotation about the
    joint should allow a 180° turn for both the arms.


    +   The entire system consists of two sets of gripping and climbing system with
    the mirrored mechanism. They are positioned back to back with each other for ascending
    and descending down the pole. Two linear actuators will be used and positioned
    between the two sets of gripping system. When the actuators retracted, it will
    cause the arms to retract and grip the pole. Once the robot is gripped onto the
    pole, the DC motor mounted on each arm will drive the gears. The rotation of the
    wheels will rotate clockwise on one side and counterclockwise on the other.'
