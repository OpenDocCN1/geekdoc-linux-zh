  md: '# Chapter 3

    Modeling and simulation of embedded underwater vehicle system


    3.1 Introduction

    Numerical modeling and simulation techniques are essential in many engineering
    applications. This technique has been evolving and has played an essential role
    in industry and institutions for the past few decades. The applications of numerical
    modeling and simulation techniques on marine vehicles robotic vehicle have been
    gradually increased in the past few decades. Many of them were used for subsea
    exploration and installation. The remotely operated vehicles (ROVs) are the major
    workhorses to carry out several tasks in deeper and riskier areas where the use
    of human divers is impractical. However, there are numbers of challenges in operating
    the vehicles precisely, as unpredictable disturbance like current and wave during
    its operation. The manipulation and maneuverability become the most essential
    tasks in designing the vehicle. A marine vessel control system has three independent
    blocks denoted as guidance, navigation, and control (GNC) system. A dynamic model
    is always needed in designing a good GNC system for an underwater vehicle.


    3.2 Overview of remotely operated underwater vehicle

    The remotely operated underwater vehicle (see Table 3.1) maneuver in six degrees
    of freedoms (DOFs). Each thruster can generate a maximum thrust of 100 N. The
    220 V AC power is supplied from vessel through an umbilical cable or tether to
    the vehicle.

    Modeling of vehicle or plant is often the initial step before performing the numerical
    simulation. In this section, the hydrodynamic damping and added parameters of
    the remotely operated underwater vehicle are obtained by computational fluid dynamics
    (CFD) method [1]. The design of the vehicle is discussed followed by modeling
    and simulation. The remotely operated underwater vehicle (see Figure 3.1) weights
    135 kg in air. It has an overall dimension of 1,455 mm (length) × 950 mm (width)
    × 1,710 mm (height).'
