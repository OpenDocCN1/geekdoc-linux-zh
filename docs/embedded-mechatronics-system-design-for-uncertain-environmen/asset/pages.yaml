  md: '# xPC-Target embedded system design 127


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_143_0.png)


    Figure 4.6 J13 Jumper block setting


    Jumper block J13 (as shown in Figure 4.6) is used to configure the A/D and D/A
    circuits. Athena II can accept both single-ended and differential inputs. A single-ended
    input uses two wires: input and ground. The measured input voltage is the difference
    between these two wires. A differential input uses three wires: input (+), input
    (−), and ground. The measured input voltage is the difference between the (+)
    and (-) inputs. Differential inputs are frequently used when the ground of the
    input device and the measurement device (Athena II) are at different voltages,
    or when a low-level signal is measured that has its ground input also has higher
    noise immunity than a single-ended input because noise affects both (+) and (-)
    wires equally to cancel out in the measurement. The disadvantage of differential
    inputs is that only half as many pins are available to produce a single differential
    input. Athena II can be configured for each 16 single-ended inputs or eight differential
    inputs, as shown below. The default setting is single-ended mode.


    +   * A/D—Analog input configuration settings: The analog inputs are configured
    for unipolar (positive voltages only) or bipolar (both positive and negative voltages).
    For bipolar inputs, omit the jumper. The default configuration is bipolar mode
    (jumper out).

    * D/A—Analog output configuration settings: The four analog outputs can also be
    configured for unipolar (positive voltages only) or bipolar (both positive and
    negative outputs). In unipolar mode, the outputs range between 0 and +10 V. For
    the bipolar mode, the outputs should be configured for a mid-scale reset because
    0 V is halfway between −10 V and +10 V, for the ±10 V range.


