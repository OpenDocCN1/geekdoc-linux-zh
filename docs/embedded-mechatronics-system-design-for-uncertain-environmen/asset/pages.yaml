    # 6.3 A sloth bear-inspired pole-climbing robot


    Instead of working on an underwater robot, a land-based robot can be designed.
    Cable inspection is subjected to high-risk and dangerous environment. With the
    intensive electric and magnetic fields involved, the climbing robot is used to
    accomplish the task. The robot will climb up the pole using the gripping and driving
    systems. There were several designs of the pole climbing robot developed in the
    past years. The locomotion mechanism revolves around the gripping, climbing, and
    traveling systems. There are few examples like the Robo-Sloth, Four-Legged Multipurpose
    Rope Climbing Climbing, and Hand-bot. The initial proposed design went through
    many amendments due to some constraints. However, the objective of the robot is
    to move along the hanging structure as pole. The overall complexity of construction
    should be minimal to reduce the cost of robot. Instead of using wheels and gripping
    arms, the design is simplified using a pair of gripping arms. The newly proposed
    climbing mechanism includes a pair of gripping arms with rubber pads to provide
    a firmer grip. The traveling mechanism rotates over the arms for climbing.


    The development of the robot was a bio-mimicry and it mimics the movement of the
    limbs of a sloth bear. The design adopts the structure of the bear’s limbs as
    the gripper and as a hinge where it straightens and moves forward. The design
    of the robot consists of four legs and four grippers, controlled by a single motor.
    The movement of the robot relies on the synchronization of both the legs and motors.
    The grippers are used to hold the pole soily that the robot can move freely. The
    robot uses its arms to grab the object and maintain the body stability while climbing.
    The motor driving the arms enables the orientation of the body to grip on the
    pole while climbing.


    # 6.3.1 System design and architecture


    The mechanical model of the entire body of the robot consists of three mechanisms
    (Figures 6.47 and 6.48), performing the actions to move steadily along the pole.
    The links will rotate about each joint to achieve the climbing motion. We would
    need to control the rotation about the joint. Thus, a power source needs to be
    placed between the joints. A motor could be placed between the links to provide
    the appropriate speed to move the robot steadily. Moreover, choosing the appropriate
    power transmission mechanism is crucial as high torque will be acting at these
    points, especially when the robot carrying a certain payload.'
