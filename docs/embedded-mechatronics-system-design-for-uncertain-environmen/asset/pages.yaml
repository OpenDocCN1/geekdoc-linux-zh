  md: '# Embedded mechatronics system design for uncertain environments


    A submerged body experiences lift-and-drag effect while moving through the fluid.
    This drag component includes frictional and pressure drag. The frictional drag
    to the boundary layers depends on the surface area in contact with the fluid.
    The damping is a linear function of velocity, a quadratic function of velocity,
    a sum of both linear and quadratic terms (as used in this section) and higher-order
    terms. The steady drag force experienced by the vehicle in its reference state
    is well known to depend on the degree of velocity and a coefficient that depends
    on Reynolds number (for a body sufficiently submerged in a fluid). The variation
    of the force on the body by small perturbations to that motion has been repeatedly
    found to be better modeled by a linear function of velocity. The linear coefficients
    are therefore adequate to represent the strength and moments due to inviscid part
    of the flow for a low-speed remotely operated underwater vehicle.


    The remotely operated underwater vehicle hydrodynamic damping matrix D be further
    simplified. The off-diagonal elements [4] in the hydrodynamic damping matrix D(v)
    are small compared to those elements on the underwater vehicle. Therefore, D(v)
    becomes a diagonal matrix: $[X_x, Y_y, Z_z, K_x, M_y, N_z]$. A turbulence model
    with the unsteady 3-dimensional flow was built for Reynolds number flow count
    greater than $1.0 \times 10^6$. The shear-stress-transport (SST) model in CFD
    software STAR CCM+. The k-omega SST model is one of the two common models for
    predicting the flow separation under adverse pressure gradient. It provides a
    highly accurate prediction of the flow separation under adverse viscosity. To
    take advantage of the SST model, the boundary layer should be resolved with at
    least 10 mesh nodes. This is done by setting the $y+$ value on the surface of
    the vehicle to be around 1.


    The movement in the fluid domain is expected to be turbulent and isothermal. The
    temperature is fixed at $20 \{\circ}C$, and the fluid is modeled as an incompressible
    fluid. It is impractical to set the fluid to be infinitely large to analyze dynamic
    damping force on the remotely operated underwater vehicle. As a result, a dimension
    of approximately 15 times greater than the dimension of the vehicle (see Figure
    3.1) to ensure the accuracy [5] of the actual flow domain is used. Properties
    of the flow domain are required to define the domain has high fidelity. The turbulence
    properties are difficult to define without turbulent kinetic energy and dissipation
    at the inlet flow. The turbulent intensity was used to describe the turbulent
    properties in the simulation. The turbulent intensity is set to be 0.1% for the
    external flow over the vehicle. The static pressure is used at the outlet boundary.
    It is required to use the log-law method to predict the velocity profile in the
    turbulent wall-bounded flows. The side, top, and bottom of the fluid domain are
    modeled using free-slip wall boundary conditions. The boundary condition of the
    vehicle surface is defined to be nonslip due to fluid viscosity, and the surface
    speed of the vehicle is near zero.


