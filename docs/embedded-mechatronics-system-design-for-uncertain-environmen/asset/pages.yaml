    # 6.2.1 System design and architecture


    The objective is to design and build a functionally remotely controlled marine-tracked
    vehicle based on the interaction between the embedded system and the smartphone.
    With the use of a marine-tracked vehicle, the condition of the hull, compartments,
    and confined spaces can also be recorded and surveyed. The platform used in the
    embedded system is ARDUINO® Uno (see Figure 6.33) and Android application for
    smartphone side. Both platforms are easily found on the market and are inexpensive.


    The method to achieve control of an ROV using existing smartphone applications
    is to establish a connection between the embedded system and smartphone device
    by Bluetooth protocol and to control the vehicle by direct drive mode (DDM). DDM
    is a mode of controlling the vehicle by sending directional commands through the
    touchscreen buttons on the smartphone as shown in Figure 6.34. For example, if
    the user wants the vehicle to reverse, the user reverses the button on the smartphone''s
    screen. The vehicle receives the commands, analyzes it, and then applies the corresponding
    movement. It gives the user the ability to change the vehicle''s direction and
    to steer away from obstacles. The smartphone application will be an Android application
    built by MIT Inventor. The application will establish the connection to the Marine
    Track Vehicle by Bluetooth Protocol. ARDUINO® board which is a digital radio communication
    protocol that can go and ad hoc. Compared to the Wi-Fi protocol which operates
    at the same frequency, it is more suitable for a longer-term wireless infrastructure,
    as each node is assigned a fixed IP address. Most of the smartphone devices today
    are integrated with Bluetooth modules, and is linked together via Wireless Personal
    Area Network. The main reason for using Bluetooth communication is the low power
    usage as compared to Wi-Fi. A real-time camera viewer on the smartphone can be
    used for surveillance.


    As shown in Figure 6.35, the MIT App Inventor allows users to develop Android
    applications for Android phones by using the web servers. The app'
