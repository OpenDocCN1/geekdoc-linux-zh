- pgno: 17
  md: '# Chapter 1


    # Introduction


    # 1.1 Introduction to embedded system


    In today’s competitive markets, engineers face an ongoing challenge to produce
    complex engineering systems with a high level of performance, reliability, and
    value at a low price. This demand is brought about by the advances in microprocessor
    technologies (small and cheap) that make what was state of the art yesterday fade
    in comparison with what might be possible tomorrow. Hence, a mechatronics engineer
    is the one who views a system as a whole and offers optimum embedded solution
    problems. To perform correctly, contemporary systems and products rely on harmonious
    interactions between mechanical systems, sensors, actuators, and computers to
    realize with embedded control systems as shown in Figure 1.1.


    Therefore, a mechatronics engineer should transcend barriers that exist in the
    past between various engineering disciplines and acquire the necessary skills
    and expertise to enable him/her to


    +   - Select and integrate mechanical components and drives to the microprocessor.

    - Select sensors and implement appropriate interfacing circuits.

    - Develop a model of the processes involved.

    - Design, simulate, and implement appropriate control systems.

    - Use software and hardware to build the mechatronics systems.


    Besides, the plant dynamics is not known and is highly nonlinear with uncertainties
    due to varying loads and environment. Hence, it is essential to understand the
    use of embedded control system to overcome the system or plant working in an uncertain
    environment.


    There exist a few definitions of what is an embedded system. In this book, an
    embedded system is a compact computer system to accomplish a few specific tasks.
    It is usually embedded into a completed system that has physical mechanical and
    electrical parts. The embedded system is tasked to work on pre-programmed jobs.
    However, with artificial intelligence, it can be intelligent to handle different
    scenarios. Typically, the embedded systems are produced in a small form factor
    with inputs and outputs (for digital inputs/outputs, analog inputs/outputs, high-definition
    multimedia interface (HDMI) port, universal serial bus (USB) port, and other port
    configurations) for broad applications. The human operator has direct'
  merge: -1
  img_proc: true
