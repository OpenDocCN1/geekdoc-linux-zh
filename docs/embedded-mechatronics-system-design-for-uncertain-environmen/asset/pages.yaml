  md: '# Raspberry Pi-embedded system design 347


    # 7.1.1 System design and architecture


    The design of the system architecture has been through many iterations with the
    aim to design a system that is portable, yet cheap and user-friendly, cardinally
    eliminating the potential risk taken by divers to observe fouling. The proposed
    system consists of a portable mounting device designed to be mounted on the bulkhead
    of the offshore support vessel with variable extension rods from the gunwale to
    the waterline to observe fouling conditions. Observation method used in this system
    is the Raspberry Pi microcontroller (https://www.raspberry.org/) and its camera
    module. The end of the rods a Raspberry Pi camera enclosed in a watertight enclosure
    that will use CV to identify the location of fouling. The system will serve the
    following functions:


    +   1. Only one man is needed to manage and operate the system.

    2. Capture an image based on the location of interest.

    3. Highlight the area of fouling, calculating fouling percentage, and show fouling
    rank.

    4. The GUI allows the user to observe fouling and records the data.


    The use of Raspberry Pi in this system serves as a low-cost method of tackling
    the detection and identification of fouling organisms. Python and OpenCV are modules
    installed in this Linux®-based microcontroller. See the following websites for
    some information.


    +   * http://www.pyimagesearch.com/2015/10/26/how-to-install-opencv-3-on-raspberrybian-jessie/

    * http://docs.opencv.org/2.4/doc/user_guide/ug_trincascade.html


    The fouling needed by a shipowner can be known through a wireless SSH connection
    by connecting wireless-enabled device such as a laptop in the same network as
    the Raspberry Pi. The software and hardware used are provided in Tables 7.2 and
    7.3, respectively.


    The prototype was designed to accommodate placement anywhere along the bulkhead
    of a vessel. As different parts of the hull are designed to have a different curvature,
    length variations of the prototype components are necessary. Figure 7.1


