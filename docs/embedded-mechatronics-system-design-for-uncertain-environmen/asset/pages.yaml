    # 3.3 Dynamics modeling of remotely operated underwater vehicle


    The details of the dynamics modeling of remotely operated underwater vehicle used
    in this section were documented in the following references [1,7]. The Newtonian
    mechanics are the most common approach to the rigid body remotely operated underwater
    vehicle on its body-fixed reference frame [4]. It can be written as follows:


    $M_{RBV}v + CR_{RBV}(v) = \tau_{RBV}$ \ (3.1)


    where $M_{RBV} \in \mathbb{R}^{6\times6}$ is the mass matrix, $CR_{RBV}(v) \in
    \mathbb{R}^{6\times6}$ is the Coriolis and centripetal matrix, $\tau_{RBV} \in
    \mathbb{R}^6$ is a vector of external forces and moments, and $\mathbf{v} = [u\
    v\ p\ q]^T \in \mathbb{R}^6$ is the linear and angular velocity vector.\nAccording
    to Fossen [4], the mass inertia matrix in (1) can be written as:


    | 0 | 0 | 0 | $m_G$ | $-m_G$ |

    | 0 | m | 0 | $-m_G$ | $mX_G$ |

    | 0 | 0 | $mY_G$ | $-mX_G$ | 0 |

    | $M_{RB}$ = $-mZ_G$ | $mY_G$ | $I_x$ | $-I_{xy}$ | $-I_{xz}$ |

    | $mZ_G$ | 0 | $-m_G$ | $I_{xy}$ | $I_{yz}$ | $-I_{yz}$ |

    | $-m_G$ | $mX_G$ | 0 | $-I_{xz}$ | $-I_{Iz}$ | $I_z$ | (3.2)


    where the component $m$ in this represents the mass of the vehicle (where $I_x,
    I_y, I_z, I_{xy}, I_{yz}$ represent the moments of inertia of remotely operated
    underwater vehicle). The coordinates of the center of gravity of remotely operated
    underwater vehicle are $x_G, y_G,$$ and $z_G$.'
