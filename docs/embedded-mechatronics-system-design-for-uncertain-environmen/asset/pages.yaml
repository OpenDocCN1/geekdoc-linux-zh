  md: '# Introduction 9


    the wave, underwater current, temperature, pressure, and other unforeseen parameters.
    Moreover, the interdisciplinary of the system involved in computing, communication
    network, mechanical, electrical and electronics design to achieve commonly shared
    goals require coordination. The problems faced in the embedded mechatronics system
    design operating under the uncertain environment are summarized as follows.


    +   * Numerical modeling for sufficient control purpose.

    * Interdisciplinary nature requires systematic design approach.


    First, the numerical modeling of such vehicle is quite challenging due to its
    nonstreamlined body and inaccuracy that may result from the numerical modeling
    using the computer-aided software. Numerical modeling and control techniques are
    essential in many engineering applications. This technique has been evolved and
    played an essential role in industry and institutions for the past few decades.
    However, in the control systems prototyping stage, it is constrained by model
    complexity, embedded system configurations, and interface testing. There is no
    standard method to design embedded systems by different operating systems used,
    interfacing requirements, sensor and actuators specifications. The need to propose
    a systematic approach for Linux®-based and Windows-based embedded systems is essential.
    For a start, we need to examine the types of system available to develop the thematic
    approach.


    Second, there is lack of information and detail on how the embedded system can
    be used and configured systematically. For example, the Linux® has a graphical
    interface in common to the Windows-based embedded system. Linux® is different
    from other operating systems as it is open-source software However, it is sometimes
    quite difficult to use and configure the devices if users do not have much knowledge.
    In the applications like constructing a system that needs much time and effort
    in testing, the writing of C/C++ programming language can be difficult when the
    embedded system uses the Linux®-based operating system.


    To implement the more accessible, new software and hardware are necessary for
    the real-time operating environment. This covers a real-time control system using
    xPC Target™ (https://www.mathworks.com/tagteam/37937_xpc_target_selecting_hardware_guide.pdf)
    for underwater robotic control system. By utilizing the software package MATLAB®,
    Simulink®, Real-Time Workshop™, xPC Target and a C/C++ compiler, the 1/0 interfaces
    are embedded between the Simulink blocks and the embedded system in the manner
    of hardware-in-the-loop simulation. This provides a convenient way to implement
    a real-time underwater robotic control system that does not require any low-level
    language programming.


    The PIC-Microchip (https://www.microchip.com/about-us/company-information/about)
    is a provider of microcontroller that is headquartered in Arizona, USA. A development
    programmer/compiler is used to control the hardware via'
