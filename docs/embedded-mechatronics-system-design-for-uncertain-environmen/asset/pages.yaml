    A way to overcome this issue was to use Arduino® as a mediator between the vibration
    sensor and Raspberry Pi. The experiment was conducted with ARDUINO as a transmitter
    to Raspberry Pi and a receiver of vibration signals from the vibration sensor.
    Significant improvement was observed. Through experiment, it was realized that
    Raspberry Pi has a better capability than ARDUINO UNO. The Raspberry Pi will have
    a delay in accessing data from the vibration sensor. The Arduino does not have
    an OS. It will not run any other tasks reading data from the vibration sensor.
    Therefore, it is more capable of providing data in a shorter time than Raspberry
    Pi. Thus, it was decided to use Arduino UNO as a vibration transmitter.


    Accelerometer framework: It was realized that the SPI interface is much simpler
    and faster than IDC. Master and slave are linked by three wires, usually MISO
    (Master in, Slave out), MOSI (Master out, Slave in), and M-CLK. It was decided
    to connect Accelerometer to Arduino using an SPI interface circuit. Accelerometer
    senses vibration to Arduino as a movement for x-, y-, and z directions in m/s²
    or selected from the program.


    Arduino framework: Arduino was programmed using Visual Studio. It was programmed
    to handle the process of receiving vibration data and transmit reading to the
    Raspberry Pi using two threads in a single program. Thread 1 which can be treated
    as Accelerometer Handler, de-serializing the reading from Accelerometer at a baud
    rate of 115,200, the reading in x, y, and z is stored into the respective array
    of window size 32. Thread 2 that can be used as Communication Handler. Primarily
    communicates with Raspberry Pi and checks if data are required to be sent. Once
    Arduino will average the data collected in array x, y, and z avg(x), avg(y), and
    avg(z). These data are serialized before sending them to Raspberry Pi.


    Raspberry Pi and camera framework: Python programming language was used to write
    programs in Raspberry Pi. It is programmed to handle the process of receiving
    vibration reading from Arduino than send to the server and read image frames from
    Pi Camera then to send to the server. The server will have two different threads
    to handle these receive-send processes. The Raspberry Pi boots up Thread 1, which
    can be termed as Arduino Handler will de-serializing the reading from Arduino-To-Receive
    signal to Arduino x, y, and z store them into the respective array of chunk size
    16; this is then serialized and sent to the server. Thread 2 which is termed as
    camera handler captures images every 600 ms and sends it to the server.


