    # 7.2 Multi-hop microprocessor-based prototype system for remote vibration and
    image monitoring


    The details in this section can be found in the following paper [9]. The increasing
    need for more energy sources in recent years has driven research for safe and
    reliable methods for the extraction of oil from below sea water. The dispersed
    nature of such oil field locations has to the construction of offshore platforms
    on topographies ranging from shallow to deep water. While offshore platforms fixed
    in either location are subject to dynamic forces due to waves, currents, wind,
    and earthquakes, offshore platforms fixed in the deep sea are susceptible to vibrations
    from the breakage of ice formations accumulated around the support legs at extremely
    rigid environments. Uncontrolled vibrations caused by the factors above may result
    in equipment malfunction, damage to the structure, discomfort to the workers on
    the platform structure, and even stimulate structural failures due to fracture
    growth over a prolonged period.


    Conventionally, offshore structures have been built without considerations towards
    the effects of ice-induced vibrations, which culminated in their collapse [10].
    Hence, highly expensive structures that were overly designed. Although there was
    a notable decrease in vibration, human discomfort and equipment malfunction were
    still an issue. A recent study about the effects of induced vibrations has yielded
    various techniques to mitigate vibrations caused by the ice breaking the structures.
    One example is the implementation of conical legs in place of standard vertical
    legs [11,12], which transforms the breaking force of the ice from crushing to
    bending as the ice is lifted off the base. The resultant force exerted on the
    legs, was also much lower than the original force, was still notable and relatively
    periodic. Also, it was showed that at high speeds, the breaking ice-force could
    be at the same frequency as the natural frequency of the structure, causing an
    extreme amplification of the vibration [11,12]. This effect, coupled with the
    resultant force of current techniques may result in severe damages to the structures
    and equipment.


    Despite the limited availability of groundwork on the existing vibration and ice-formation
    monitoring systems, prominent research has been done on the related subcomponents
    of the system categorized are, namely, vibration measurement, structural integrity
    verification, CV, and communication infrastructure. A feasible'
