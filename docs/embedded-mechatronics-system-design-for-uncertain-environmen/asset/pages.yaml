    Figure 6.39 Initial testing of marine-tracked vehicle


    The ARDUINO® software IDE is a program that allows users to write sketches for
    the ARDUINO® board in a simple programming language. The code that is written
    in ARDUINO® programming language is translated into C++ programming language to
    the AVR-GCC compiler (an essential piece of open-source software that makes the
    final translation readable by the microcontroller). As shown in Figure 6.39, the
    Pololu Zumo chassis is a robot platform with tracked wheels. The kit comes with
    two silicone tracks, two idle sprockets, and acrylic mounting plate. The integration
    of tracked wheels allows it to maneuver freely. The main body has compartments
    for four AA batteries and two sockets for motors. The motor used in driving marine-tracked
    vehicle is micro-metal gear motor that has a free-run speed of 625 rpm, stall
    current of 1,600 mA at 6 V, and a top speed of 100 cm/s at 50 g. Marine-tracked
    vehicle needs to conduct surveillance of the hull in the dry dock and confined
    spaces in water. The entire electrical system was enclosed in a watertight box
    and sealed with silicone to make it waterproof. Due to the buoyancy of the watertight
    box, weights were added to marine-tracked vehicle to counter the buoyancy. The
    circuit consists of the Bluetooth module, ARDUINO® Motor Shield, 2 DC motors,
    and a 9 V battery. In the Fritzzing software, ARDUINO® Uno board is shown as the
    ARDUINO® Motor Shield is mounted on it. The 9 V battery is required to power the
    ARDUINO® Uno board, the Bluetooth module, and the motors. The two motors connected
    to series terminals of the Motor Shield as shown in Figure 6.40. The RX pin of
    the Bluetooth module was connected to the TX pin of ARDUINO®, and the TX pin of
    the Bluetooth module was connected to the RX pin of ARDUINO® as shown in Figure
    6.41. The GND pin of the Bluetooth module was hooked to the ARDUINO®''s ground
    pin, and the VCC pin was connected to the ARDUINO®''s 5 V pin in Figure 6.41.
    Finally, the RTS and CTS pin of the Bluetooth module were connected to complete
    the circuit.'
