    developed in parallel without interference with other threads. FIFO has a maximum
    size suited to the following conditions:


    +   - The consumer must wait for the producer to execute if the queue is empty.

    - The producer must wait for the consumer to consume if the queue is full.


    Here, we use semaphore method to guarantee these two conditions. The semaphore
    solution to the producer–consumer problem tracks the state of the queue with two
    semaphores. First, one is "avail" while another is "full." The detailed operations
    of the two are similar to the P/V operations mentioned above. To resolve the mutual
    exclusion issue of multithread, the binary semaphore named "mutex" was used.


    Figure 2.16 shows the flow of the SensorProcess. The program uses a time-sharing
    algorithm in Linux®. It will execute each thread, avoiding preemption among the
    threads. With this scheduling algorithm, there is no significant delay in communicating
    with the sensors. It can guarantee the acquisition of each channel with minimal
    data loss.


    # 2.4.3 Sensor fusion thread design


    The Kalman filter is used in multisensor systems when it is necessary to fuse
    dynamic low-level redundant data in real time. The filter uses the statistical
    characteristics of a measurement model to recursively determine estimates for
    the fused data that are optimal in a statistical system. If the sensor can be
    described with a linear model and both the system and sensor error can be modeled
    as white Gaussian noise, the Kalman filter will provide uniquely optimal estimates
    for the fused data.


    An extended Kalman filter (EKF), in a mathematically optimal manner, utilizes
    a wide variety of navigation sensors for aiding the inertial navigation system
    (INS). The Kalman filter is based on an error-state model which provides a much
    higher total navigation performance than would be obtained from the independent
    navigation sensors. The DVL-aided INS is capable of handling submerged autonomous
    operation for some time. In Figure 2.17, the core DVL-aided INS system consists
    of the IMU and the navigation equations, the EKF, and the following aiding sensors:
    DVL, compass (optimal), and depth/pressure sensor. Depending on position accuracy
    requirements, the navigation system must get some position measurement updates.
    For submerged position updates, the system needs underwater transponders for position
    updates as shown in Figure 2.17.


    Note that the remotely operated underwater vehicle model is highly nonlinear,
    we need to design a linearized model of the vehicle at different operating conditions
    is required before the estimation. The linear equations of motion are obtained
    by linearization of the nonlinear equations about a time-varying trajectory or
    an equilibrium point using Taylor series. The details will not be covered in this
    chapter. However, the following EKF code based on the linearized matrices at the
    equilibrium condition is shown in Figure 2.18.'
