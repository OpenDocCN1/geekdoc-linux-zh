    For protecting the data stored in share memory, producer and consumer cannot write
    or read from the same location in the shared memory at the same time. Here, the
    synchronization and mutual exclusion between the sensor process and control process
    are important. We use a semaphore to ensure data safety. Semaphores are used to
    protect critical regions of data or data structures. Remember that each process
    provides access to a critical piece of data. It would be very dangerous to allow
    one process to alter a critical data structure that is being used by another process.
    One way to achieve this would be to use “locking system” around the critical piece
    of data that is being accessed, but is a simplistic approach that would degrade
    the system. A Linux semaphore structure contains the following information:


    Count: This field tracks of the count of processes wishing to use this resource.
    A positive value means the resource is available. A negative or zero value means
    that processes are waiting for it. An initial value of 1 means that one and only
    one process at a time can use this resource. When processes want this resource
    they decrement the count, and when they have finished with this they increment
    the count.


    Waking: This is the count of processes waiting for this resource which is also
    the number of process waiting to be awakened when this resource becomes free.


    Wait queue: When processes are waiting for this resource, they are put in the
    wait queue.


    Lock: A buffer lock equipped with two operations, denoted as V (input signal)
    and P (output signal). The value of the semaphore is either 0 or 1. Suppose the
    initial count for a semaphore is 1, the first process to come along will see that
    the count is positive and decrement it by 1, making it 0. The process now “owns”
    the critical piece of code or resource that is being protected by the semaphore.
    When the process leaves the critical region, it increments the semaphore’s count.
    The most optimal case is where there are no other processes contending for ownership
    of the critical region. If another process wishes to enter the critical region
