    From the results tabulated in Table 5.3, the gecko pad could withstand the weight
    of the climbing robot. It was estimated to around 1 kg onto various surfaces.
    The robot designed to be autonomous, few sensors were implemented for navigation.
    One of the sensors chosen was the magnetic proximity sensor that utilized electromagnetic
    field to detect objects. The reason for considering proximity sensors is the long
    reliability and functional life without any mechanical parts. However, the shortest
    sensing distance is 15 mm. The sound wave is transmitted through the transmitter
    of the sensor and reflected back from the object. The disadvantage of the ultrasonic
    sensor is the field of vision. The ultrasonic sensor has a field of vision of
    60°. If two ultrasonic sensors are placed near each other, the field of vision
    will overlap affecting the sensor''s range. Hall Effect sensor uses the induced
    current from the magnetic field to produce an output voltage proportional to the
    strength of the magnetic field. The Hall Effect sensor can detect objects that
    are passing through its magnetic field. IR sensor transmits IR light and the reflected
    light from the object is then received by the opto-resistive transistor (receiver).
    Although it works well in the proximity detection, the amount of ambient lighting
    will affect the resistive accuracy. The accuracy will be affected by the amount
    of ambient lighting. The Hall Effect sensor is accurate in terms of resolution.
    The magnetic sensors have good reliability of accuracy as the sensing distance
    is too short. Although the IR sensor has the highest accuracy, the price is too
    expensive. The IR sensor Sharp 2Y0A41SK was then used. A difference of sensors
    is tabulated in Table 5.4.


    The main body of the robot used the universal plate set from Tamiya. The holes
    on the plate are useful as it can mount various components on the robot''s body
    quickly. It is also lightweight and durable to hold the weight of the components.
