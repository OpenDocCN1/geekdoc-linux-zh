    Hence, an alternative method was proposed to remove the drift and bias error of
    acceleration. The accelerometer bias has a significant impact on the overall performance
    of an IMU as the output could lead to errors in the calculated position. Here,
    a dead-reckoning method was used to determine whether the remotely operated underwater
    vehicle moves or remains stationary. The detailed procedures are stated in Figure
    2.28. First, an acceleration signal will be collected. Second, the mean value
    of the signal average (acc) will be computed. If the average (acc) is between
    -0.03 and 0.03 without points larger than 0.15, then the signal is considered
    as bias. Otherwise, will be identified as motion (i.e., the vehicle is moving).
    When the remotely operated underwater vehicle is moving, the Butterworth-high
    pass-filter is used to remove the drift and bias.


