    of 0.5 m × 0.5 m × 0.3 m and weight 3.5 kg (excluding the electronics circuits).
    The prototype is designed to carry a load of 2 kg and a maximum speed of 0.6 m/s
    with an acceleration of 1.2 m/s². The three main parts are a base assembly'
