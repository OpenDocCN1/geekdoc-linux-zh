    | Vacuum suction | Required power | Motor required to generate the vacuum suction
    power | Loud noises are generated |

    | Biomimetic adhesive | Not required | Not required | None encountered |

    | Electromagnetic adhesion | Required power | Excellent magnetic materials are
    required to induce magnetic forces from electro-city | Can only climb metal walls
    |

    | Permanent magnetic adhesion | Not required | Strong agents are needed for strong
    adhesive force | Can only climb metal walls |


    The vacuum suction, electrostatic adhesion, and electromagnetic adhesion need
    an external power source to climb the wall. An external power source would increase
    the payload. However, the biomimetic adhesion does not need an external power
    source that reduces the overall payload. The electro-adhesion has a disadvantage
    as it needs to carry heavier objects that require a large contact surface area
    to increase its adhesive force. For the biomimetic, the only disadvantage is to
    create tiny hairs that are smaller than the nano scale. Hence, both the biomimetic
    and permanent magnetic adhesion are chosen. The biomimetic adhesion can climb
    most surfaces including rough or smooth surfaces. The permanent magnet can give
    extra adhesion for climbing the metallic wall. A comparison of the different type
    of adhesion methods is tabulated in Table 5.2.'
