- pgno: 359
  md: '# ARDUINO® embedded design 343


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_359_0.png)


    Figure 6.65 Flow of servo control logic


    To accomplish the task of climbing, the design of the system includes the control
    of four motors as shown in Figure 6.65. To coordinate the functionality of these
    components, an electronic circuit was created. The execution codes were written
    in C programming language with a series of task-achieving behaviors. With the
    use of microcontroller and robot programming, the control logic can be easily
    modified. The control logic starts by sending a signal to the robot to start.
    The next move involves positioning of the robot onto the pole. Once the robot
    is on the pole, the timer will count to carry out the next movement to release
    the lower gripper and rotate the body unit it 180°. Another signal will close
    the gripper until it reaches the top position. The whole process repeats until
    it reaches the end of the path as shown in Figure 6.65.


    # 6.3.3 Testing


    The robot was tested on the real pole to validate the algorithm and gripping force.
    The arms produced sufficient force to rotate the body of the robot while climbing
    the pole. The initial design of the grippers did not provide a firm grip. Hence,
    it was unable to withstand the robot weight and motion. However, the design of
    the grippers was modified. There is a need to use more sensors to allow smooth
    operation of the robot in an uncertain environment. The completed prototype (see
    Figure 6.66) and testing of the robot can be seen in the following video link.


    +   - Sloth bear-inspired pole-climbing robot: http://youtube.com/4tXArzbPfw'
  merge: -1
  img_proc: true
