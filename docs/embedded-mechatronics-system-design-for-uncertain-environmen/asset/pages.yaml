    # 2.4.1 Main process design


    Figure 2.11 shows the overall data flow in a control system design. There exist
    a main and other processes which use the producer-consumer relationship to achieve
    process communication as shown in Figure 2.12.

    The main process only runs once when it boots up. It is responsible for parameter
    initialization as well as creating and booting two child processes (i.e., SensorProcess
    and ControlProcess), which continues until the program gets terminated. The primary
    purpose of the producer-consumer relationship is to process the input data before
    sending it to the next process.


    +   * Producer (SensorProcess): Sensors data collection and sensor data fusion;

    * Consumer (ControlProcess): Control algorithm, actuator driver program, and network
    communication between the host computer and target system.


    SensorProcess generates the processed data and video stream into memory while
    the control process receives and uses them from the shared memory.'
