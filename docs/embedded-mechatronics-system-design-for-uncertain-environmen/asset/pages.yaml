  md: '# Embedded mechatronics system design for uncertain environments


    self-discharge rate, and high discharge voltage for a variety of applications.
    However, the balance between the specifications, cost, and availability in a given
    project time frame should be considered.


    Another consideration is the software. It can be grouped into software for operating
    system within the microcontroller or SBCs and numerical simulation. The operating
    system should be easy to use or learn from given resources or manual. For software
    for modeling the dynamic model of the systems is usually performed in MATLAB®
    and Simulink®. The numerical condition of the model is crucial as it determines
    the accuracy of the simulated results. In fact, most of the time, the simulated
    and experimental results do not match. However, it provides an insight into the
    behavior of the dynamic systems or a model that can be used for sufficient control
    purpose. Other computer-aided design software such as SolidWorks™, AutoCAD™, and
    Pro/ENGINEER™ are used to obtain the physical model representation and parameters
    such as much, moment of inertia, and required tolerances for fabrication and numerical
    model.


    The controller is designed to control the system in a way that makes the control
    objectives. For example, a camera is used to capture and recognize the captured
    images. If there is a need to position the camera in a specific location, it is
    evident that the camera is required to position the camera. After the embedded
    system is selected and designed, the selected hardware and software will require
    testing. The hardware with software-in-the-loop testing will provide a mean to
    simulate the system in real time. The primary objectives are to test the functionalities
    of the hardware, software interfacing, and codes that are downloaded to the target
    or embedded system. The system design needs to ensure it can perform satisfactorily,
    i.e., it can control the parameters to the desired values. The next step is to
    validate the system in the designated environment or perturbed with external disturbances
    (i.e., enclosure design, onboard power supply, user input devices, and graphical
    interface). Fine tuning of the control system in the embedded system will be performed
    if there exist issues such as an error in control parameters and inconsistent
    results at different occasions. Sometimes, it requires modifications in both hardware
    and software. The final step is to package the prototype into a presentable product
    for demonstration and possible commercialization. It requires some efforts in
    improving the product aesthetics and rearranging the layout of the electronics
    and mechanical parts.


