    9. 7 × LED;

    10. 4-Way DIP switch;

    11. 2 × Ball bearing;

    12. 2 × Tyre.


    It has the following controller features:


    +   1. Input voltage—12 V;

    2. Interface with PC—1 USB;

    3. 12C Base—2;

    4. Processor—PIC18F4620;

    5. Data memory—64K;

    6. CPU speed—400 MHz;

    7. PWM signal ports—2 channels;

    8. Digital I/O Ports—16 used by 2-IR Sensors, 7LED, 4-WAY DIP Switch,

    1 Buzzer;

    9. Analog input ports—Ultrasonic sensor;

    10. Programming language—C.


    Before computer programming of the control algorithm, working principles or the
    program flowchart (see Figure 5.3) of the robot was developed to illustrate the
    flow of the computer programming. The operations of the robot are as follows.
    The movement of the robot begins upon power-up of the robot. The motors control
    the forward movement. The driving motors start to rotate, the robot moves forward.
    While moving forward, the robot continuously tracks the input signal of sensors
    that are positioned in front (ultrasonic sensor) and bottom of robot (infrared
    sensor). In a typical operation scenario, the ultrasonic sensor (or IR sensor)
    is activated when an obstacle (or table''s edge) is met. The MCU inputs the appropriate
    signal to the H-bridge circuit that reverses the direction of the driving motor
    in counterclockwise direction. It drives the robot in reverse to avoid the obstacle.
    On the other hand, IR sensors are activated when the edges of the table are detected.
    The MCU inputs the appropriate signal to the H-bridge circuit that reverses the
    direction of the driving motor, and steers the robot to the edges of the table.
    It helps to prevent the robot from falling off the table.


    Next, to facilitate the testing analysis, and improvements, the completed program
    in C was implemented by downloading the program into the embedded processor as
    shown in Figure 5.4. The C program was used in the intelligent vacuum robot. The
    program has several functions (as FAN MOTOR, LED) to simplify the programming
    and enable a more systematic application of the functions to control the robot.
    The PicKit 2 (see Figure 5.4(a) and Figure 5.4(b)) Development Programmer/Debugger
    (PG164120) is also a low-cost development tool with an easy-to-use interface for
