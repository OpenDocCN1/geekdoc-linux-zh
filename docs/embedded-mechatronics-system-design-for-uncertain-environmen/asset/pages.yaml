  md: "# 4.12 Linear quadratic regulator\n\nThe concept of linear quadratic regulator\
    \ (LQR), or commonly known as state-feedback design, uses a set of weighting matrices\
    \ to penalize the states and control inputs of the system. This requirement is\
    \ set in the cost function to be minimized as shown below. The weighting matrices\
    \ Q and R are applied to the states and inputs respectively, are tuned iteratively\
    \ until the desired performance is achieved. Inevitably, this becomes an ad-hoc\
    \ process.\n\nLQR problem aims to minimize the sum of the energy of the states\
    \ and control inputs in the form of the cost function:\n\n```\n$J = \\int_{0}^{T}\
    \ [x^T(t)Qx(t) + u^T(t)Ru(t)]dt\n```\n\nwith respect to the input vector $u(t)$.\
    \ For the optimization, Q must be a symmetric positive semi-definite matrix ($Q^T\
    \ = Q \\geq 0$) and R must be a symmetric positive definite matrix ($R^T = R >\
    \ 0$). Using instance, the Pontryagin's minimum principle, the solution is of\
    \ the form of a time-varying control law:\n\n```\n$u(t) = -F(t)x(t)\n```\n\nwhere\n\
    \n```\n$F(t) = R^{-1}B^TP(t)$\n```\n\nand $P(t)$ is a solution of the Riccati\
    \ Differential Equation (RDE)\n\n```\n$A^TP(t) + P(t)A + Q - P(t)BR^{-1}B^TP(t)\
    \ = -\frac{d}{dt}P(t)$\n```\n\nTo implement the LQR controller in (4.26), all\
    \ states $x(t)$ are required to be measurable. If the time horizon is indefinite\
    \ ($T \\rightarrow \\infty$) and an optimal solution exists, then $P(t)$ tends\
    \ to a constant matrix $P$. The control law is:\n\n```\n$u(t) = -Fx(t)$\n```\n\
    \nwhere\n\n```\n$F = R^{-1}B^TP$\n```\n\nThe matrix $P$ is a solution of the Algebraic\
    \ Riccati Equation (ARE)\n\n```\n$A^TP + PA + Q - PBR^{-1}B^TP = 0$\n```\n\nNote\
    \ the time dependent parameter becomes independent and the right-hand side of\
    \ (4.31) becomes zero. For the positive-definite matrix $P$, the corresponding\
    \ closed-loop system with LQR controller in (4.29) is asymptotically stable."
