    bulwark plate must be collinear to the position of the suction cups.


    The assembly involves lowering of the camera and aluminum rods by part. Dis-assembly
    procedures involve hoisting of the camera assembly and removal of the parts. Both
    procedures will be assisted by the Maxpull GM-I-SI 100 kg capacity manual hand
    winch with a 12 m length of 5 mm diameter wire. Figures 7.6 and 7.7 show the entire
    assembly process. The process repeats for the next four lengths of rods. When
    the last rod with a connector to the gunwale is aligned with the gunwale, the
    operator will lower the entire length of the rod to the point that connected to
    the gunwale clamp with an M8 screw and nut. The angle of the rods should be at
    least 15° away from the hull. The final step is to lower further until the rods
    meet the pole bracket of the suction cup to hold the entire assembly firmly.


