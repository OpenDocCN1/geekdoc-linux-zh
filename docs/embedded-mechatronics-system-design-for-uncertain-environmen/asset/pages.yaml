  md: '# Modeling and simulation of embedded underwater vehicle system


    random mutation operation, there is no assurance that the offspring perform better
    than their parents that may affect the system dynamics in ROI. Hence, the direction-based
    mutation operation is used. The idea is that the mutation will be adjusted according
    to the gap between the sliding surface (s = 0) and the system dynamics. If the
    control force is unable to achieve close to the sliding surface, the mutation
    will force the ROV''s dynamic to maintain near the sliding surface. The after
    mutation operation can be expressed as:


    ```

    $\u{u}_{GA,new} + |\eta_m|$

    ```


    $\eta_m$ is the adjustment of mutation operation from the fuzzy inference mechanism
    and $\u{u}$ is the offspring after mutation operation.

    nThe occurrence of mutation operation in GA is performed using the mutation probability
    that may affect the system stability. Hence, a specified fitness value (set by
    the user) named FIT is utilized to check whether the mutation has occurred or
    not. If the fitness value is less than FIT, the mutation occurs. On the other
    hand, if the FIT is more than the specified value, the mutation will not happen.
    Also, the robustness of the GA is ensured by introducing the incremental uncertainties
    on the ROV model and external disturbance during the GA operation. In summary,
    the proposed fuzzy-based genetic algorithm on SMC (FGA_SMC) can be written in
    the following processes:


    +   Step 1: Establish fitness function in (3.58).

    Step 2: Choose from the initial position ($K_{sp}, K_{sd}$) for (3.56).

    Step 3: Increment the uncertainty (up to 20% of the nominal ROV model and 1 m/s
    of underwater current disturbance).

    Step 4: Evaluate fitness value in (3.58) and select the elite $\u{u}_{GA,add}$.nStep
    5: Start fuzzy crossover operation to produce $\u{u}_{GA,new}$ in (3.59).

    Step 6: If the fitness value is less than FIT, proceed to the next process or
    go to Step 8.

    Step 7: Start mutation operation to produce $\u{u}$ in (3.56).

    Step 8: Compute control signal $\u{u}$ in (3.56). It will be treated as the next
    generation as it is the most appropriate chromosome for the current situation.


    The fuzzy inference mechanism is used in the evolutionary procedure. It also decides
    how to tune the coefficients ($\eta_{c1},\eta_{c2},\eta_{m}$) and the adjustment
    of mutation operation. The input variables are B (Big), MI (Middle), and S (Small).
    The output variables are H (High), ME (Medium), and L (Low). For fuzzy-cross,
    X represents and Y represents the coefficients ($\eta_{c1},\eta_{c2}$) as seen
    in Figure 3.35. For fuzzy mutation, X represents the sliding surface and Y represents
    the coefficients $\eta_{m}$. According to the process stated in fuzzy-based genetic
    algorithm (FGA), the evolutionary procedure comprising IF-THEN rules is as follows:


    +   1. Rule 1: IF X is B; THEN Y is L;

    2. Rule 2: IF X is MI, THEN Y is ME;

    3. Rule 3: IF X is S, THEN Y is H.'
