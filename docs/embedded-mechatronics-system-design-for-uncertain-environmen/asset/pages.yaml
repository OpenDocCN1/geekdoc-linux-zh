    # 1.7 Systematic design approach for prototyping embedded systems


    As mentioned earlier, the problems of systems such as uncertainties and poor measurement
    caused by the external disturbances and numerical modeling errors could exist.
    There should exist a unifying approach to handle the prototyping under such scenarios.
    The proposed steps can be summarized into mainly'
