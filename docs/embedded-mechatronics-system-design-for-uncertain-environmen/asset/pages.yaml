    operating software in Figure. There are six thrusters to move the vehicle in designated
    directions.

    In Figure 1.3, the host PC with a graphical user interface was developed by opensource
    platform using Python-based integrated development environment (IDE) to communicate
    with the remotely operated underwater vehicle via an Ethernet connection. The
    remaining components are housed in an aluminum enclosure. The vehicle has an umbilical
