  md: '# 206 Embedded mechatronics system design for uncertain environments


    control surface increases. Therefore, to decrease the resistance, the top control
    surface angles were set to 10°, to achieve the desired underwater robotic vehicle''s
    heading direction with least resistance. In summary, the angular position of the
    top control surface was successfully controlled with least oscillation and the
    simulated results in both the positions and the heading angle match the actual
    experiment results in the pool. As observed in the pool test, despite the model
    uncertainties such as the hydrodynamic parameters and some spouting water, the
    underwater robotic vehicle was able to perform and behave close to the simulated.


    A real-time control systems platform for underwater robotic vehicle control was
    implemented using the software package (MATLAB®, Simulink®, xPC-Target, Real-Time
    Workshop, and Microsoft Visual C++) with commercially available hardware. The
    steady-state thruster''s model was developed to establish the relationship between
    the voltages, speeds, and thrust output. The horizontal plane dynamic including
    the nonlinear damping of the underwater robotic vehicle was determined through
    the water-tank test using xPC-Target simulation and hardware verified with ANSYS
    CFX numerically. As shown in the tests, the relationship between the hydrodynamic
    loads and the translational and rotational velocity of the vehicle are inherently
    nonlinear, and the key nonlinear damping coefficients have been obtained.


    Using CFD method, it is possible to obtain the nonlinear (or linear) damping coefficients,
    and thus the results of the simulation are not restricted to a small range of
    motions. All of these models offer a reference point for determining which coefficients
    need to be investigated when considering an underwater vehicle that has a different
    shape as to the streamlined semi-empirical model. This is very important to reduce
    costs when hydrodynamic parameters are determined from minimal pool testing. After
    the dynamic modeling, the SMC was designed and selected to control the top control
    surface angle during the heading maneuvering. The pool test results from the sensors
    match the simulated results obtained from the simulated horizontal dynamic equations.
    In addition, the angular position of the top control surface exhibits the least
    oscillation with the SMC, Here, the proposed XPC-Target from the rapid prototyping
    to final testing in the pool was performed successfully.


    In the hardware and control architecture of the underwater robotic vehicle, the
    human-machine interface and communication can be used. Since control systems platform
    in the host PC running Windows, the graphical human-machine interface can easily
    be developed using the MATLAB tool used to set up the Ethernet communication,
    execution of the XPC-Target, changing of various model parameters while running
    and, plotting of the parameters in real-time. The sea trial can be conducted and
    an altimeter for depth measurement can be implemented. With the global positioning
    system, it provides a real-time position of the vehicle.


    As seen in the simplicity of the underwater robotic vehicle design, the proposed
    XPC-Target can also be used in the computer-aided engineering education. Since
    the underwater robotic vehicle is accessible through a TCP/IP network, it could
    act as a network-share laboratory equipment for both off-campus and'
