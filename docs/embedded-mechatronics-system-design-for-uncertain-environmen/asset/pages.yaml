  md: '(5.28), the actual magnetizing currents $I_1$ and $I_2$ are produced by electromagnet
    driving circuits; therefore, the dynamic relation between the actual voltage and
    the magnetizing current to be considered in control design. The input current
    for the EMS system can be determined. The relationship between electromagnet core
    flux $\phi_{\max}$, magnetizing current (that is $I_1$ or $I_2$) and terminal
    voltage ($V$) is given by:


    ```

    $V = N\frac{d\phi_{magnet}}{dt} + IR_{coils} \quad (5.29)$

    ```


    where $R_{coils}$ is the coil resistance and $\phi_{magnet} = \mu_0Ag/2$ is the
    electromagnetic flux. Rearranging it, the actual magnetizing current can be obtained
    as:


    ```

    $\frac{dI}{dt} = -\frac{R_{coils}}{L_{coils}}I+\frac{V}{L_{coils}} \quad (5.30)$

    ```


    where $L_{coils} = \mu_0N^2Ag/2$ is the inductance of an electromagnet. The control
    voltage in (5.29) is regulated according to


    ```

    $V = V_{dc} \times d \quad (5.31)$

    ```


    where $d$ represents the control duty cycle of the driving circuit and $V_{dc}$
    is the voltage to supply the driving circuit. The output voltage $V$ can be controlled
    in a designed range $V \in [0, V_{dc}]$ by tuning the duty cycle command by a
    PWM controller.


    According to the Newtonian law, the actual dynamic of the conveyor cart could
    be written as:


    ```

    $m\ddot{z}(t) = F_{m2} + F_{m1} + F_d = G_1I_1^2 + G_2I_2^2 + F_d \quad (5.32)$

    ```


    where $m$ (=3 kg) is the mass of the conveyor cart, $\ddot{z}$ is the acceleration
    of the conveyor cart, The actual force was measured using a vernier force sensor,
    $F_{m1}(t)$ and $F_{m2}(t)$ are the attractive force from the electromagnets,
    and $F_d(t)$ is the disturbance force. It is assumed that the force reading from
    the force sensor equals the frictional force. The average force obtained from
    the experiment was used to determine the coefficient of friction between the conveyor
    cart''s and base (=0.30 kg) during the levitation and propulsion. The coefficient
    of friction ($\mu=0.12$) was computed using the force ($F_d=0.38$ N) and divided
    it by the mass of the conveyor cart.


    With the friction force, the thrust produced by the EMS system could be computed
    using equation (5.32). As shown in Figure 5.57, at different current input to
    the two electromagnets (on the left and right side), the resulting forces were
    measured. It gives a good estimate of the thrust force produced with input current
    of 5 A to the two electromagnets are approximately 11.5 N.


    Also, a nonlinear characteristic of the magnetic levitation force is influenced
    not only by the air gap distance and input current, but also by the variation
    of the'
