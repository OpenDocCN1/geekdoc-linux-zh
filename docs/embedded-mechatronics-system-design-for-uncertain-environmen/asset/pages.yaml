    To compare the SMC with other control scheme, the few are compared. Besides PID
    controller to control the top control surface angular position in water, a LQR
    was used. In method, it uses a set of weighting matrices to penalize the states
    and inputs of the system. This requirement is set in the cost function to be minimized.
    The weighting matrices associated with the cost function were applied to the states
    and inputs, respectively. They were tuned iteratively until the desired performance
    was achieved. The controller gain, $F$, for the LQR was calculated and implemented
    as a feedback gain ($F=0.05$). This gain was positioned along the feedback loop
    for the speed. As shown in Figure 4.96, the oscillatory motion has decreased.
    The steady-state error using the SMC seems to be smaller as compared to the PID
    and LQR control. With the results obtained in the hardware-in-the-loop testing,
    the proposed SMC will be used in subsequent pool test.


