- pgno: 11
  md: '# Foreword


    Rapid prototyping of an embedded control system design is mainly constrained by
    the system configurations, specifications, and the operating system. Book publications
    that communicate how to create such an embedded system from initial concepts (mechanical
    and electrical), modeling and simulation (mathematical relationships), and graphical-user
    interface (software) to actual implementation (mechatronics testing) are not available.
    Hence, this makes the control system design difficult to realize when dealing
    with physical mechatronic systems during design stage.


    There are many mechatronic systems of interest in the current literature and industrial
    applications. The application on a marine vehicle such as an underwater robotic
    vehicle (URV) reflects the multidisciplinary nature that unifies mathematical
    aspects from the various and separate engineering disciplines. URVs are used for
    a wide range of applications, such as ranging from food to oil, monitoring our
    environment, harvesting resources from exploring the extreme depths of our ocean,
    supporting national defense operations, transporting goods, and supporting recreational
    activities. Most of the systems operate in an extreme environment with challenges
    such as great hydrostatic pressures, strong forces, harmful interaction with electronics,
    and high attenuation of electromagnetic signals. The human-machine interaction
    and real-world applications of the systems have complicated the embedded system
    design process. There is also a strong demand for sensor platforms for monitoring
    and development in method to enable the development of smarter and more efficient
    systems in prototyping stage as well as actual implementation. In addition, other
    robotic vehicles for vacuum cleaning and climbing robot for inspection facing
    similar problems are demonstrated in this book. Applications of magnetic levitation
    for conveyor system, face recognition and vision-based inspection using camera
    and vibration sensor working in uncertain environments.


    In order to realize a more efficient and sustainable embedded system design for
    control system, the low-micro controllers were often used to construct a motion
    system for a typical robotic system. Although the position control was easily
    realized, more advanced control applications are above the ability of the cards,
    such as the implementation of different control algorithms for speed and position
    control in underwater, information flow, and real-time requirement. The above-mentioned
    system consists of ADCs, DACs, SBCs, or DSPs which are interfaced to workstations
    or host PCs. Most often, the real-time operating systems are needed, such as QNX,
    Unix, or RT-Linux®. In these systems, work is needed to deal with the interface
    codes, drivers, and communications among the hardware. Although it is more cost-effective
    and computation time-efficient especially for'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Embedded mechatronics system design for uncertain environments


    Linux-based operating system, it often requires expertise on computer engineering
    and low-level programming over control design. As a result, the time spent on
    computer programming increases with significant time allocated for control algorithm
    design decreases.


    Hence, in this book, the XPC-Target by MathWorks for prototyping, testing, and
    deploying real-time systems using standard PC hardware is proposed. The XPC Target
    can be used in the wide range of applications from automotive system design, process
    control, vibration control, control engineering into the robotic systems. However,
    the conventional-based design using Linux-based operating systems and the use
    of PIC-Microchip™, ARDUINO®, and Raspberry Pi™ are also documented.


    This book has been prepared for the needs of those who seek an application on
    developing embedded system easy for control purpose. The choice of material is
    guided by the basic objective of making an engineer or student capable of dealing
    with embedded system design. This book can be used as a textbook, reference exercise
    for a first course in Linux-based embedded system, xPC-Target, PIC-Microchip,
    ARDUINO®, and Raspberry Pi. For more information about MATLAB® and xPC-Target,
    I encourage you to use the help, manual, and online resources in the provided
    packages.


    The contents of the book are organized into seven main chapters with program codes.
    The main chapters include sections on Linux-based system design, model-based simulation,
    and xPC-Target system design. In these chapters, it contains applications on various
    real-life systems such as the underwater vehicle, vacuum cleaning, climbing robot
    for inspection, magnetic levitation for conveyor system, temperature monitoring,
    face recognition and vision-based inspection using camera, and vibration sensor.
    The design process. The software adopted throughout the chapters are Ubuntu/Fedora™,
    Python™, Qt™, MATLAB®, Simulink®, and other open-source software developments
    from PIC-Microchip, ARDUINO®, and Raspberry Pi.


    +   Chapter 1 gives an introduction to embedded system design.


    +   Chapter 2 discusses the embedded system design software and configurations
    using Linux-based operating system and system architecture design. It provides
    the implementation and testing of Linux-based system on an underwater vehicle.


    +   Chapter 3 provides the modeling and simulation of embedded system on the underwater
    vehicle.


    +   Chapter 4 illustrates embedded system prototyping and testing using xPC-Target.


    +   Chapter 5 presents the use of microcontroller as PIC-Microchip in real applications.


    +   Chapter 6 shows the use of microcontroller as ARDUINO® in real applications.


    +   Chapter 7 demonstrates the use of microcontroller such as Raspberry Pi in
    real applications.'
