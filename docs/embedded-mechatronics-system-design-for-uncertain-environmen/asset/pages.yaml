    # 7.1.1.11 OpenCV


    OpenCV is a CV and machine learning library. It includes 2,500 different algorithms
    that are capable of performing tasks, namely, face recognition, image stitching,
    and many more. Installation of OpenCV requires a total of few hours.


    Step 1: Install development tools


    ```

    $ sudo apt-get install build-essential cmake

    ```


    Step 2: Install image I/O packages that allow us to load image file formats as
    JPEG and PNG


    ```

    $ sudo apt-get install libjpeg-dev libtiff5-dev libjasper-dev libpng12-dev

    ```


    Step 3: Install Video I/O packages


    ```

    $ sudo apt-get install libavcodec-dev libformat-dev libswscale-dev libv4l-dev

    $ sudo apt-get install libvideore-dev libx264-dev

    ```


    Step 4: Install the GTK development library to display images for GUI interfaces


    ```

    $ sudo apt-get install libgtk2.0-dev

    ```


    Step 5: Install added dependencies


    ```

    $ sudo apt-get install libatlas-base-dev gfortran

    ```


    Step 6: Install the Python 2.7 and Python 3 header files to compile OpenCV and
    Python bindings


    ```

    $ sudo apt-get install python2.7-dev python3-dev

    ```


