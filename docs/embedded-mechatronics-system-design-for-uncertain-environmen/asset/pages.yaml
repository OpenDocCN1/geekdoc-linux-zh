- pgno: 387
  md: '# Raspberry Pi-embedded system design 371


    command prepares a training dataset of positive images by superimposing on negative
    images while manipulating the properties (rotation and intensity) of the positive
    images to generate these positive images. The following commands can be used:


    ```

    opencv_createsamples -img test.jpg -bg bg.txt -info info.lst -pngout info - -maxangle
    0.5 -maxangle 0.5 -num 4000

    ```


    Around 500 barnacles were taken along the coastline of Singapore using a high-quality
    DSLR camera, and 40 best were manually selected for the classifier as shown in
    Figure 7.22.


    These images are needed to be converted to bmp format in “opencv_samples).” An
    open-source software (bulk image converter) is used to convert all samples to
    bmp format in Figure 7.28 resulting in the following Figure 7.29. The software
    can be downloaded from: http://sourceforge.net/projects/bulkimageconverter/


    Cropping of the region (ROI) was performed using a utility called “Haar training
    utility” by a third-party software to ease the cropping process. The utility can
    be downloaded at: http://www.tecture.com/2011/06/opencv-haartraining.html. Using
    OpenCV cvcvtColor function (see Figure 7.30), these images were converted to grayscale.
    The “cvColour” script was placed in the folder where the 40 barnacles and other
    colored images were removed. Figure 7.31 shows the pictures of barnacles converted
    to grayscale.


    The “objectmarker.exe” is provided in the utility and the images are cropped.
    Figure 7.32 shows image of objectmarker.exe.


    +   Step 1: Draw a rectangular box on 1 image, Hit <Space> when every region is
    selected and hit <Enter> after completed. Hitting <Enter> will get to the next
    image and the process will repeat for the 40 barnacles. Around 5 – 10 samples
    were taken from each image.


    +   Step 2: Multiple ROI(s) can be selected from 1 image, Hit <Enter> after completed.


    +   Step 3: When the process is completed. “info.txt” will be created in: Haar-training
    Stuff/STEPS/step 02/>shown in Figure 7.33.


    More “positive” images can be produced by overlaying positive images over negative
    images. Since 25 cropped images of barnacles were used, the process is repeated
    25 times to generate 10,000 “positive” images. Examples of “positive” images are
    shown in Figure 7.34.


    A positive vector file is now needed to stitch of these “positive” images together
    using the following commands:


    ```

    opencv_createsamples -info info.lst -num 4000 -vec positives.vec

    ```


    # 7.1.2.2 Merging the vector files and training the cascade


    The last part of creating the Haar cascade is to train the cascade. In general,
    higher the number of training stages, the more accurate the results. Training
    more stages requires a longer time to compensate for better accuracy. Around 20
    vector files were computed into one vector file.'
  merge: -1
  img_proc: true
