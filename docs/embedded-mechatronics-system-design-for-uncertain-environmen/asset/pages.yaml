  md: '# # Chapter 6


    # # ARDUINO® embedded system design


    # ## 6.1 Remotely operated vehicle system design


    ROV''s development has gained increasing significance in the 1980s when a significant
    amount of offshore evolution has gone beyond the capabilities of human beings.
    ROVs have been used in deep ocean exploration and construction. However, the ROV
    has been dominated by expensive components. In addition, they involved skilled
    technicians and specially designed craft to launch and recover the functional
    ROV. The high cost has led to research works on designing a low-cost and functional
    ROV. This section will show a low-cost ROV design for shallow water applications
    that provides a visual display via smartphone. Despite operating with Wi-Fi that
    incurs a large decrease in the functional range of the ROV, it is cheaper to implement
    acoustic systems. With built-in Wi-Fi module in most smartphones, it enables command
    to be sent easily to the mobile device for remote control and inspection purpose.


    # ### 6.1.1 System design and architecture


    Figure 6.1 shows a completed ROV prototype. The ROV has an integrated structure
    that measures 44 cm long, 20 cm wide and 20 kg. It consists of necessary components
    including the primary hull, two horizontal propellers, and two vertices and electronics
    inside the main hull. It has a webcam housed in the waterproof camera housing
    for navigation and inspection purpose.


    The final design was performed using CAD drawings as shown in Figure 6.2. The
    designs were drawn using Design Spark Mechanical. The CAD software allows users
    to modify design effortlessly and hence accelerates the process of prototyping.
    The ROV was designed differently as to those designs available in the market.
    The typical ROVs have the frame of a cubic-like structure made of rods and elbows.
    The ROV was designed to resemble a catamaran submarine. The ROV hull comprises
    of a Tupperware box and a horizontal frame section made of polyvinyl chloride
    (PVC) pipes with camera. The ROV is watertight so that no water leaks into the
    components to affect the ROV''s buoyancy or damage the electronics. It operates
    as the cheapest way of flotation. The ROV is made slightly positively buoyant
    for easy recovery as no tethering is involved in recovering the ROV. The buoyancy
    was counteracted by the weight of the thrusters, electronics, and some ballast
    weights.'
