    The signals handled by microprocessors need conditioned for processing. The signals
    from sensors may be nonlinear, noise-filled, or weak in magnitude. Such signals
    should be modified and magnified to satisfy the specification rating of the microprocessors.
    This signal-conditioning functions are most commonly done using operational amplifiers
    of various types. The microprocessors should be protected from excessive voltage
    and reverse the polarity of the signal using proper protection circuits. The signal
    conditioning is accomplished by the interface systems inserted between the sensors/actuators
    and the microprocessors. Most of the interfacing circuit uses the operating amplifier
    to condition the signals.


    An H-bridge (the schematic in Figures 4.8 and 4.9) is an electronic circuit which
    enables a voltage to be applied across a load in either direction. These circuits
    are often used in applications to allow DC motors to run forward and backward.
    H-bridges are available as integrated circuits-SN754410 or L298 or can be built
    from discrete components using IRF3205 Power MOSFET, 1N5818 Schottky Diode, and
    LM7805 linear 5 V voltage regulator and resistors.


    The H-bridge arrangement is generally used to reverse the polarity of the motor,
    but can also be used to "brake" the motor, where the motor comes to a sudden stop,
    the motor’s terminals are shorted, or to let the motor "free" to a stop, as the
    motor is effectively disconnected from the circuit. Table 4.1 summarizes the operation.'
