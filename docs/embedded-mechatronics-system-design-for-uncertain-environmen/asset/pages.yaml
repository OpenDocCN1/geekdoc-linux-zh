  md: '# Chapter 4


    # xPC-Target embedded system design


    #  4.1 Introduction


    The most efficient way to develop an embedded system is to connect the control
    systems to the plant. Very often, trial-and-error method is used to verify the
    functionality of the plant. However, it is time-consuming and leads to modifications
    or costly replacement of the hardware. To circumvent the problem, an emulator
    that consists of an embedded system (system under test) that provides a control
    signal to plant is needed. The sensor reading is read by the system (feedback)
    and output actuator controls to the plant. Many iterations of the control system
    will perform using the graphical programming software till the specifications
    are met. The method mentioned above is known as a hardware-in-the-loop simulation
    (HILS). HILS is a technique that is used in the development and test of complex
    real-time embedded systems using graphical programming software. The apparent
    benefit to the graphical tool is the elimination of writing code as C/C++, as
    seen in Chapter 2. It is not to say that the students do not “program”—in fact,
    they do the embedded computer to follow their control algorithm. However, the
    details of real-time embedded systems are left up to the code generation tool.
    It allows the student to create software that can be executed in a real-time environment
    without the student to learn the intricacies of writing specific multiple, real-embedded
    code. With that, the HILS provides an efficient platform by adding the complexity
    of the plant under control to test the platform. As shown in Figure 4.1, it includes
    the following steps.


    +   - hardware interfacing;

    - rapid prototyping simulation;

    - final implementation in the HILS.


    A typical microprocessor-based mechatronics application is shown in Figure 4.1.
    It consists of the subsystems


    +   - Target system such as an underwater robotic vehicle constitutes the device
    being controlled. The device itself may involve some individual or unrelated mechanisms
    with their subsystems.

    - Host PC is our desktop computer that is installed with the simulation software
    tools such as MATLAB®/Simulink® and xPC-Target block sets. Besides, Window Operating
    System such as Windows 98/XP/Vista/7 to be installed'
