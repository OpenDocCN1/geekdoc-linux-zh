    “effective” range is proportional to the number of nodes present along the leg,
    the transmission speed between the nodes is not constant due to the varying level
    of unwanted noise affecting the signal-to-noise ratio (SNR). SNR was minimized
    by choosing a locally optimal separation distance between following pairs of nodes,
    instead of resorting to a fixed separation distance. Furthermore, this scheme
    gives rise to an inverted pyramid workload on the nodes, i.e., the workload on
    a given node is directly proportional to the number of nodes under it. Thus, the
    maximum achievable bandwidth between them bottleneck for the number of nodes pipelined
    below them. This behavior is illustrated in Figure 7.49 where Node 1 to Node 0
