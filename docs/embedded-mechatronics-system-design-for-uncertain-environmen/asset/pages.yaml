  md: '# Raspberry Pi-embedded system design 377


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_393_0.png)


    Figure 7.30 Convert to grayscale script


    After merging the vectors into one, ten stages were used for training the final
    cascade scale using the following command:


    ```

    opencv_traincascade -data data -ve positives.vec -bg bg.txt -numPos 3600 -numNeg
    -numStages 10

    ```


    # 7.1.2.3 Artificial neural networks identification


    The results using Haar cascade from each type of fouling can be combined with
    ANNs to identify fouling accurately. Further developments aim to develop a complete
    categorization of the types of fouling. The ANNs make comparisons of the input
    with the output and generate its output when the target is matched. A vast image
    database is necessary as images of high-quality fouling species are difficult
    to find. Figure 7.35 shows combining Haar cascade with neural networks.


    As object recognition requires significant positive and negative images to achieve
    a higher accuracy, a web interface is created for the user to contribute different
    fouling images. By using PHP 5.0, the web interface is hosted on the Apache Web
    Server supported by MySQL to store the fouling images. The database server stores
    and organizes content in a web browser by an enduser. Hosted on a web server,
    the hypertext pre-processor (PHP) is an interpreter embedded within a webpage.
    It is used to interpret the PHP file when a user request access to a page. Figure
    7.36 shows the relationship in setting up'
