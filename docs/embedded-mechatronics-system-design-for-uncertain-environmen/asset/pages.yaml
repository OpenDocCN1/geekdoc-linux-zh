  md: '# 196 Embedded mechatronics system design for uncertain environments


    With the hydrodynamic parameters obtained in a horizontal plane, the dynamics
    (denoted by subscript "h") can be written in the compact format:


    ```

    $M_h\nu_h + C_h(\nu_h)\nu_h + D_h|\nu_h| = \tau$ (4.62)

    ```


    where $\eta_h = [x\ y\psi]^T$, $\nu_h = [u\ v\ r]^T$, $\tau = f_T\bar{u} = [\tau_x\
    0\ \tau_\psi]^T$, and $\varphi$ is the angular position of the top control surface.


    $M_h = \begin{bmatrix} m-X_u & 0 & 0 \ 0 & m-Y_v & 0 \ 0 & 0 & L_r-N_r \end{bmatrix};
    C_h(\nu_h) = \begin{bmatrix} 0 & (V_y-m)r & 0 \ 0 & 0 & (m-X_u)u \ 0 & -(V_y-X_x)u
    & 0 \end{bmatrix}$


    ```

    $D_h = \begin{bmatrix} X_u & 0 & 0 \ 0 & Y_v & 0 \ 0 & 0 & N_r \end{bmatrix};
    T = \begin{bmatrix} 0 & \sin\varphi & 0 \ 0 & 0 & 0.3.\sin\varphi \end{bmatrix};
    f_T = 4.03$ (4.63)

    ```


    The kinematics can be expressed as:


    ```

    $$\dot{\eta}_h = J_h(\eta_h)\nu_h$ (4.64)

    ```


    where


    ```

    $J_h(\eta_h) = \begin{bmatrix} \cos\psi & -\sin\psi & 0 \ \sin\psi & \cos\psi
    & 0 \ 0 & 0 & 1 \end{bmatrix}$ (4.65)

    ```


    Equation (4.62) can be rewritten in state-space form:


    ```

    $$\dot{\mathbf{x}}_h = f_h(\mathbf{x}_h,t) + g_h(\mathbf{u},t)\tau$ (4.66)

    ```


    where $\mathbf{x}_h = [\eta_h\ \nu_h]^T$


    ```

    $f_h(\mathbf{x}_h,t) = \begin{bmatrix} J_h(\eta_h)\nu_h \ -M_h^{-1}[C_h(\nu_h)\nu_h
    + D_h|\nu_h|\nu_h] \end{bmatrix}; g_h(\mathbf{u},t) = \begin{bmatrix} 0_{3\times1}
    \ [g_{h1}\ g_{h2}\ g_{h3}]T_hF_T\bar{u} \end{bmatrix}$

    ```


    ```

    $g_{h1} = \begin{bmatrix} 1 & 0 \ -m-X_u \end{bmatrix}^T; g_{h2} = \begin{bmatrix}
    1 & 0 \ 0 & -Y_v \end{bmatrix}^T; g_{h3} = \begin{bmatrix} 0 & 0 \ I_r-N_r \end{bmatrix}^T$

    ```


    The constant thrust were used to verify the values of hydrodynamic coefficients
    acquired by the CFD method. The respective thrust 1.2 N (0.3 m/s), 2 N (0.5 m/s),
    and 3.8 N (0.9 m/s) are used in these simulations. As shown in Figure 4.93, xPC-Target
    was used to simulate the horizontal dynamics of the underwater robotic vehicle.
    The dynamics of the underwater robotic vehicle for the respective x, y, and yaw
    directions can be seen in the subsystem block diagrams. It generates the simulated
    responses to compare with the experiment'
