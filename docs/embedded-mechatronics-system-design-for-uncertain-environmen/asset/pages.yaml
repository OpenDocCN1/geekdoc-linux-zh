    \ rectangles. The typical features used for recognition are to detect and recognize\
    \ objects for real-time facial detection. It is a machine-learning-based approach\
    \ where a cascade function is trained from many positive and negative images.\
    \ It is used to detect objects in other images. The presence of a Haar-like feature\
    \ is determined by adjacent rectangular regions at a particular location within\
    \ the window. The pixel intensities in these regions are summed, and the differences\
    \ between these regions are calculated. If the difference exceeds a threshold,\
    \ then to compute the existence of several hundred Haar-like features at different\
    \ scales and locations in a single image, an integral image technique has been\
    \ used. Each pixel is assigned as the sum of all pixels above it and to its left.\
    \ An extension to their approach has also been proposed that analyzes a set of\
    \ rotated Haar-like features. This set enriches the simple features and can also\
