- pgno: 384
  md: '# 368 Embedded mechatronics system design for uncertain environments


    ![](img/21e96ea63cf1b8de0bc286a38acbcfc4_384_0.png)


    Figure 7.25 Program flowchart


    Chthamalus (see http://www.wildingsapore.com/wildfacts/crustacea/other-crustacea/ciripiedia/euphia.html),
    were taken along the coastline of Singapore using a high-quality digital single-lens
    reflex (DSLR) camera and 40 best images were manually selected for the training
    of the classifier.


    +   2. Collection of “Positive” images. These come in different sizes and preferably
    bigger than a window size. The greater the number of images, the higher the tendency
    of accuracy. Haar cascade uses machine-learning algorithms for classification
    of objects based on the huge bulk of input images. It learns from the input patterns
    and tries to make generalizations based on other images. Around 4000 negative
    images were used from the Internet. Negative images are larger than positive images
    to allow superimposing accurately. Superimposing these creates a greater number
    of positive images by overlaying each cropped image of barnacles on top of “Positives”
    images together.


    +   3. Creating vector files. These files contain information on the positive
    samples used for training. A vector file is generated using OpenCV command line
    for training. The process of superimposing is repeated for each cropped barnacle.


    +   4. Merging vector files. A total of 25 vector files were generated. Merging
    these vector files will generate a final vector file for cascade training.


    +   5. Train the cascade. The cascade.xml is trained and used to compare input
    images from the Raspberry Pi camera module. The process of the training is illustrated
    in Figure 7.26.'
