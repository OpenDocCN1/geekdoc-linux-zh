- - '#'
  - 创建 Bash 脚本 - 第 2 部分
- - '###'
  - 步骤 5 当你运行此脚本时，可以使用自定义变量：`./hello.sh David Hayward`。自然地用自己的名字更改变量；除非你也叫 David Hayward。目前我们只是打印内容，让我们使用如下这样的双变量：
- - '###'
  - 步骤 8 让我们进一步扩展内容。创建一个名为 `greetings.sh` 的新脚本。将以下内容输入脚本，保存它并使用 `chmod` 命令使其具有可执行权限。你可以看到脚本中了一些新的添加。
- - '###'
  - 步骤 6 创建一个名为 `addition.sh` 的新脚本；使用与 `hello.sh` 相同的格式，但更改变量名。在这里我们将使用 `firstname`
    和 `secondnumber`，并使用 `echo` 命令通过整数表达式执行简单的算术运算；`echo the sum is $(($firstname+$secondnumber))`。保存脚本并使其可可执行（`chmod
    +x addition.sh`）。
- - '###'
  - 步骤 9 我们在这里向 `echo` 命令添加了 `-n`，这会让问题提示光标停留在新行的同一行。`read` 命令将用户的输入存储为变量 `firstname`，以便稍后在最后的
    `echo` 行中返回。`clear` 命令清除屏幕。
- - '###'
  - 步骤 7 当你运行 `addition.sh` 时，我们可以输入两个数字：`./addition.sh 1 2`。结果将是 3，终端显示“The sum is
    3”。尝试几个不同的数字看看会发生什么。看看你是否也能修改脚本并将其重命名为 `multiplication`（乘法）和 `subtraction`（减法）。
- - '###'
  - 步骤 10 作为最后的添加，让我们在脚本中包含日期变量。将脚本最后一行改为：`echo Hello $firstname $surname, how are
    you today? You are on this date $(date +XA)`。输出应该显示从任何系统调用的当前星期几。
