    >>> print(''You''ve just lost a life!'')

    ''You''ve just lost a life!''

    ```


    # STEP 8


    Inline comments are comments that follow a section of code. We are examples from
    above, instead of inserting the code on a separate line, we use


    ```

    a=10 # Set the start value of A to 10

    print(''The value of A is'', a) # Print the current value of a

    a=9 # Player lost a life!

    print(''You''ve just lost a life!'')

