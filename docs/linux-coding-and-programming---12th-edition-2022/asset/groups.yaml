    +   * **STEP 2** There are differences between a UEFI BIOS, so covering all would
    be impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you need to turn off UEFI and choose Legacy Boot. Most modern
    distros with UEFI can be a bit tricky to install out of.


    +   * **STEP 4** Alternatively use the Boot Option Menu. With this you can press
    F2 (or something similar) to display a list of boot media options; from there
    you can choose the appropriate boot media. Here you can now Save and Exit the
    BIOS by navigating to the Save & Exit option and choosing ''Save and Changes''


