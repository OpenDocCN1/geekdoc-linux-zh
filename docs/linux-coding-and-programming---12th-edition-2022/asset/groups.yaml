    # Linux Tips and Tricks


    ## MEMORY HOGS


    If you delete a file, there''s a change of consuming the most memory on Linux,
    simply enter:


    ```

    ps aux --sort -rn4

    ```


    This sorts the output by system memory.


    ## BBS


    Back in the days of dial-up connections, the online world was made up of Bulletin
    Board Systems. These remote servers hanged-outs for users to chat, swap code,
    play games and. Using Telnet, we can still connect to some active BBSs.


    ```

    telnet localbestarrabs.dynds.org

    ```


    There are countless BBS available, check out https://www.telnetbbs.com/bbs/list/detail/,
    for more.


    ![](img/383b23573296234863a9f25dc7161abc_64_0.png)


    ![](img/383b23573296234863a9f25dc7161abc_64_1.png)


    ## SHREDDER


    When you want to make sure that the software cannot retrieve it. However, to securely
    and permanently delete a file, use:


    ```

    shred -zvu filename.txt

    ```


    REPLACE with the name of the file to delete.


    ## DIRECTORY TREE


    If you want to create an entire directory (folder) tree with three you can use:


    ```

    mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    This creates a New-Dir with four sub folders.


    ![](img/383b23573296234863a9f25dc7161abc_64_2.png)


    ![](img/383b23573296234863a9f25dc7161abc_64_3.png)


    ## ASCII


    ASCII can be quite striking when applied to some images. However, it''s difficult
    to create great ASCII art from the images you have using:


    ```

    img2txt install NAMEOFIMAGE.png

    ```


    REPLACE NAMEOFIMAGE with the actual name of the file on your system. img2txt install
    installed:


    ```

    sudo apt-get install caca-utils.

    ```


    ## FORGOTTEN COMMANDS


    It''s not easy trying to remember all Linux commands. Thankfully, we can use apropos
    to help us simply here, along with a description of the:


    ```

    apropos "copy files"

    apropos "rename files"

    ```


    ![](img/383b23573296234863a9f25dc7161abc_64_4.png)


    ![](img/383b23573296234863a9f25dc7161abc_64_5.png)


    ## Linux and the Big Bang


    ![](img/383b23573296234863a9f25dc7161abc_65_0.png)


    Linux is colliding particles, so we can understand how the universe works.


    ## Did You Know...


    ![](img/383b23573296234863a9f25dc7161abc_66_0.png)


    DID YOU KNOW...


    that Linux is at the heart of the science behind the Large Hadron Collider? Using
    a combination of Red Hat and CentOS (an ultra-stable distro built from the Red
    Hat base), scientists and engineers have developed different versions of their
    own Linux distro to help with all aspects. Most notable is SLC, also known as
    CERN. According to reports, there are over 600 and over 15,000 running.


    ## GET SCRIPTING


    A Bash script is simply a series of commands that will run to complete a certain
    task. They can be simple or remarkably complex, depends on the situation.


    ## Creating Bash Scripts – Part 1


    Eventually, as you are working within Linux Mint, you will want to start creating
    your own automated tasks. These are essentially Shell scripts, work in the same
    way as DOS Batch file, or any other programming language.


    - **STEP 1** You''re working within the Terminal and with a text editor. There
    are alternatives to the text editor, we will look at a moment for the sake of
    each. Before you begin, run through:

    ```bash

    mkdir scripts

    cd scripts/

    ```

    - **STEP 2** There are several ways we can use to create a Bash script: Vi, Nano,
    GNU and so on. In the end it comes down to personal preference. The use of editors
    is preferred making it easier to read the script below.

    - **STEP 3** To begin, and before you start to write any scripts, you need to
    create a folder where you can put all scripts into. This will be our working folder
    and here you can create subfolders.

    - **STEP 4** Windows users will be aware in order for batch file to work, it needs
    to have a BAT extension. Linux is an extension-less operating system but the convention
    is to create sh script.


    ![](img/383b23573296234863a9f25dc7161abc_67_0.png)

    ```bash

    mkdir scripts

    cd scripts/

    ```


    ![](img/383b23573296234863a9f25dc7161abc_67_1.png)

    ```bash

    ls

    touch script2.sh

    ```

    - **STEP 5** Let''s start with a simple script to output something to the Terminal.
    We created a file called `helloworld.sh`. In the editor, this will launch and
    enter the following: `#!/bin/bash`, then on a new line: `echo Hello World!`

    - **STEP 6** The `#!/bin/bash` line tells the system what you''re going to be,
    in this case. The Bash # denotes a comment line, one that is ignored by the system,
    the exclamation mark (!) means that the command is bypassed and will force the
    script to execute the line as a command. This is also known as a Hash-Bang.

    - **STEP 7** When you enter ls again, you can see that the helloworld.sh has now
    turned from blue to green, meaning that it''s now an executable file. In the script,
    in other words it does the things you''ve typed into it: `./helloworld.sh`.


    ```bash

    ged helloworld.sh

    ls

    chmod +x helloworld.sh

    ls

    ./helloworld.sh

    ```

    - **STEP 8** You can save the file, clicking File -> Save, and exit back to the
    Terminal. Entering ls, will reveal the script in the Terminal.

    - **STEP 9** Although it''s not terribly exciting, the ''Hello World'' should
    be displayed in the Terminal. The echo command is responsible for outputting the
    words after it in the Terminal, or however you can make the command output to
    other stores.


    ```bash

    #!/bin/bash

    echo Hello World! This is my first script in Linux Mint

    ```

    ```bash

    #!/bin/bash

    echo Hello World! Today is $(date)

    ```

    - **STEP 10** Think of echo as the Print command. It displays text, such as the
    current date. Try example: echo Hello World! Today is $(date).


    ```bash

    #!/bin/bash

    echo Hello World! Today is %s

    ```


    ## Creating Bash Scripts – Part 2


    Previously we looked at creating your first script, Hello World, and adding a
    system variable. Now you can expand these and see what you can do when you start
    to play around creating your own variables.


    ## VARIABLES


    Just in every other programming language a Bash script can store and call variables
    from the system, either generic or user.


    - **STEP 1** Let''s start by creating a new script called helloworld.sh; xed helloworld.sh.
    In it: ##!/bin/bash, then, echo Hello World!. Save the file and exited it. In
    the Terminal make the script executable: chmod +x helloworld.sh.

    - **STEP 2** You can rename variables. Modify the hello.sh script with the following:
    firstname=$1 surname=$2 Hello $firstname $surname. Putting each statement on a
    new line.

    - **STEP 3** The output will now be Hello David. This is because Bash automatically
    assigns variables for the user, which are then held and passed to the script.
    `$1` now holds David. You can change the variable by entering something else:
    `./helloworld.sh Mint`.

    - **STEP 4** You can rename variables. Modify the hello.sh script with the following:
    firstname=$1 surname=$2 Hello $firstname $surname.


    ![](img/383b23573296234863a9f25dc7161abc_69_0.png)

    ```bash

    #!/bin/bash

    echo Hello World! Today is %s

    ```

