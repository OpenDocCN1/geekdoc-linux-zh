  - "[PAGE 123]\n\n# Structure of a C++ Program\n\nC++ has a very defined structure\
    \ and way of doing things. Miss something out, even as small as a semicolon, and\
    \ your entire program will fail to be compiled and executed. Many professional\
    \ programmer has fallen foul of sloppy structure.\n\n# #INCLUDE <C++ STRUCTURE>\n\
    \nLearning the basics of programming, you begin to understand the structure of\
    \ a program. The commands may be different from one language to the next but you\
    \ can start to see how the code works.\n\n![](img/383b23573296234863a9f25dc7161abc_123_0.png)\n\
    \nC++ was invented by Danish student Bjarne Stroustrup in 1979, as a part of his\
    \ PhD thesis initially called C++ with Classes, which added features to the already\
    \ popular C programming language, while making it a more user-friendly environment\
    \ through a new structure.\n\nBjarne Stroustrup, inventor of C++.\n\nINT MAIN()\
    \ int main() initiates the declaration of a function, which is a group of code\
    \ statements under the name \"main\". All C++ code begins at the main function,\
    \ regardless of where it lies within the code.\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nint main()\n```\n\n#INCLUDE The structure of a C++ program is precise.\
    \ Every C++ code begins with a directive: #include. The directive instructs the\
    \ preprocessor to include a section of the standard C++ code. For example: #include\
    \ <iostream> includes the header to support input/output operations.\n\nBRACES\
    \ The open brace (curly brackets) is something that you may not have come before,\
    \ especially if you're to Python. The open brace indicates the beginning of the\
    \ main function and contains all the code that belongs to that function.\n\n```\n\
    helloworld.cpp \n1 #include <iostream>\n2 int main()\n3 {\n4\n5\n6\n7\n8}\n```"
  - "[PAGE 124]\n\n# Structure of a C++ Program\n\nCOMMENTS Lines that begin with\
    \ a double slash\ncomments. This means they won't be\nexecuted and are ignored\
    \ by the compiler. Comments\ndesigned to help you, or another programmer looking\
    \ at\ncode, explain what's going on. There are two types of comment:\n/* multiple\
    \ line comments and // single line.\n\n<< The two chevrons used here are insertion\
    \ operators.\nThis means that whatever the chevrons is\ninserted into the std::\
    \ statement. In this case they're the\n'Hello, world!' which to be displayed on\
    \ the screen when\ncompile and execute the code.\n\n```\nhelloworld.cpp x\n1 #include\
    \ <iostream>\n2\n3 int main()\n4 {\n5   //My first C++ program\n6 \n7 \n8 <<\n\
    9 }\n```\n\n```\n1 #include <iostream>\n2 using namespace std;\n3\n4 int main()\n\
    5 {\n6   //My first C++ program\n7 cout <<\n8 \n9 }\n```\n\nSTD While stands for\
    \ something quite different, in C++ it\nStandard. It is part of the Standard Name\
    \ in\nC++, covers a number of different statements and commands.\nYou can leave\
    \ the std:: out of the code but it must\ndeclared at the start using namespace\
    \ std, not both. for\nexample:\n\nOUTPUTS Leading on, the \"Hello, world! part\
    \ is what you\\want to appear on the screen when you like, as long as it's the\n\
    quot marks. Sometimes brackets are needed, depending on\nthe compiler. The <<\
    \ part adds a new line to be inserted.\n\n#include <iostream>\nusing namespace\
    \ std;\n\n```\nhelloworld.cpp x\n1 #include <iostream>\n2\n3 int main()\n4 {\n\
    5   //My first C++ program\n6 std::cout << \"Hello, world!\\\"\n7 \n8 }\n```\n\
    \n```\n//My first C++ program\ncout << \"Hello, world!\\\"\n```\n\nCOUT In this\
    \ example we use cout, which is a part of\nthe Standard Name, hence why it's there,\
    \ as\ny're asking to use it from that particular statement.\ncout means Character\
    \ Output, which displays, or presents something to\ntcreen. If you have std, you\
    \ have to declare it at the start of\nthe code, mentioned previously.\n\n; AND)\
    \ Finally you can see that line within a function\nblock (except comments) ends\
    \ with a semicolon.\ns the end of the statement; all statements in C++ must have\n\
    one at the end or the compiler fails to build the code. The very last\nline has\
    \ the closing bracket to indicate the end of the main function.\n\n```\nhelloworld.cpp\
    \ x\n1 #include <iostream>\n2 using namespace std;\n3\n4 int main()\n5 {\n6  \
    \ //My first C++ program\n7 cout << \"Hello, world!\\\"\\8 \n9 }\n```\n\nwww.bdmpublications.com\
