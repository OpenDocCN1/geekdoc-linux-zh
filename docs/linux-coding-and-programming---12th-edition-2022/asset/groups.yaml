    Hello World!`

    - **步骤 6** `#!/bin/bash` 行告诉系统你将变成什么，在这种情况下。Bash 中的 # 表示注释行，系统会忽略该行，感叹号 (!) 表示跳过命令检查并将强制脚本将该行作为命令执行。这也被称为
    Hash-Bang（井号）。

    - **步骤 7** 当你再次输入 `ls` 时，你可以发现 `helloworld.sh` 现在从蓝色变成了绿色，这意味着它现在是一个可执行文件。换句话说，在脚本中，它执行了你输入的内容：`./helloworld.sh`。


    ```bash

    ged helloworld.sh

