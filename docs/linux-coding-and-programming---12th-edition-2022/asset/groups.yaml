    # # Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with creating your own variables.


    # VARIABLES


    Just in every other programming language a Bash script can store and call variables
    from the system, either generic or user created.


    +   **STEP 1** Let''s start by creating a new script called hello.sh; xed hello.sh.
    In it: #!/bin/bash, then, echo $1. Save the file and exited. In the Terminal make
    the script executable: chmod +x hello.sh


    +   **STEP 3** The output will now be Hello David. This is because Bash automatically
    assigns variables for the user, which are then held and passed to the script.
    `$1` now holds David. You can change the variable by entering something else:
    `./hello.sh Mint`.


    ![](img/383b23573296234863a9f25dc7161abc_69_0.png)


    +   **STEP 2** As the script is now executable, run it with ./hello.sh. Now, as
    probably expected a simple ''Hello'' is displayed in the Terminal. However, if
    you then execute the command with a variable, it gets interesting. For example,
    try ./hello.sh David.


    +   **STEP 4** You can rename variables. Modify the hello.sh script with the following:
    firstname=$1 surname=$2 Hello $firstname $surname. Putting each statement on a
    new line. Save the script and exit it.


    ![](img/383b23573296234863a9f25dc7161abc_69_1.png)'
