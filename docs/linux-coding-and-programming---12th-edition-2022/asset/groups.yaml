- md: "\n## C++ on Linux\n\n## Your First C++ Program\n\nThe Raspberry Pi makes for\
    \ a great coding base on which to learn C++. You won't need any complicated, third-party\
    \ IDEs or to install any extra components. Everything you need to get started\
    \ is already built into the Pi.\n\n### HELLO, WORLD!\n\nIt's traditional in programming\
    \ for the first code to be entered to output the words 'Hello, World!' to the\
    \ screen. Interestingly, this dates back to 1968 using a language called BCPL.\n\
    \n- **STEP 1** You can use the Geany Programmer Editor to write, compile and execute\
    \ your C++ code on the Raspberry Pi. You can find Geany as the first entry in\
    \ the Programming section of the main Raspberry Pi menu. Click the Geany icon\
    \ to open and start coding.\n\n- **STEP 2** The Geany editor is quite powerful\
    \ while still being easy to use. Every code you enter shows in the main window\
    \ and is numbered to help you keep track of your code. For now, in line 1:\n\n\
    ```cpp\n#include <iostream>\n```\n\n```cpp\nint main()\n```\n\n- **STEP 3** It\
    \ doesn't look like much at the moment but you can get into what the C++ header\
    \ commands mean in meaning-colour depending on the language. To activate this,\
    \ save the code by clicking on File > Save. Now name your code helloworld.cpp\
    \ and click the Save button.\n\n![](img/383b23573296234863a9f25dc7161abc_121_0.png)\n\
    \n- **STEP 4** The colour coding helps a lot when coding. Now press Enter and\
    \ start a new command on line 3. Note: there's no space between the brackets.\n\
    \n![](img/383b23573296234863a9f25dc7161abc_121_1.png)\n![](img/383b23573296234863a9f25dc7161abc_121_2.png)\n\
    ![](img/383b23573296234863a9f25dc7161abc_121_3.png)\n\n- **STEP 5** On the next\
    \ line, below int main(), enter a curly bracket:\n\n- **STEP 8** Now you need\
    \ to close off the code, inserting the opposite, curly bracket. On line 7:\n\n\
    ```cpp\n{\n```\nThis can be done by pressing Shift and Ctrl to the right of P\
    \ on English UK keyboard layout. Note that you need not to backspace to the start\
    \ of the line, removing the indent, by just entering the curly bracket Geany joins\
    \ it to the right part; then ending the code block.\n\n![](img/383b23573296234863a9f25dc7161abc_122_0.png)\n\
    \n- **STEP 6** Notice that Geany has automatically created a slight indent. This\
    \ is due to the structure of C++ and where the meet of the code is entered. Now:\n\
    \n```cpp\n// My First C++ program\n```\n\n- **STEP 7** Note again the colour coding\
    \ change. Press Return at the end of the previous step's and then enter:\n\n```cpp\n\
    std::cout << \"Hello, world!\";\n```\n\n- **STEP 9** Essentially, these are your\
    \ first steps into the world of coding in C++. We will look at the structure of\
    \ the code in more detail on the next couple of pages; for now, click the Save\
    \ button to save a file cabinet with a green downward pointing arrow.\n\n![](img/383b23573296234863a9f25dc7161abc_122_1.png)\n\
    ![](img/383b23573296234863a9f25dc7161abc_122_2.png)\n\n- **STEP 10** If you haven't\
    \ done so already, it's always advisable to create a blank file where you can\
    \ save your code for Python and C++ or simply a single folder coded, whichever\
    \ you prefer. It's not a necessity, just good housekeeping.\n\n![](img/383b23573296234863a9f25dc7161abc_122_3.png)\n\
    ![](img/383b23573296234863a9f25dc7161abc_122_4.png)\n\n## Structure of a C++ Program\n\
    \nC++ has a very defined structure and way of doing things. Miss out, even as\
    \ small as a semicolon, and your entire program will fail to be compiled and executed.\
    \ Many professional programmer has fallen foul of sloppy structure. Learning the\
    \ basics of programming, you begin to understand the structure of a program. The\
    \ commands may be different from one language to the next but you can start to\
    \ see how the code works. C++ was invented by Danish student Bjarne Stroustrup\
    \ in 1979, as a part of his thesis initially called C++, which added features\
    \ to the already popular C language while making it a more user-friendly environment.\
    \ Bjarne Stroustrup, inventor of C++. int main() initiates the declaration of\
    \ a function, which is a group of code statements under the name \"main\". All\
    \ C++ code begins at the main function, regardless of where it lies. Every C++\
    \ code begins with directive: #include. The directive instructs the preprocessor\
    \ to include a section of the standard C++ code. For example: The open brace (curly\
    \ brackets) is something you may not have come before, especially if you go to\
    \ Python. The open brace indicates the beginning of the main function and contains\
    \ all the code that belongs to that function.\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n}\n```\n\n#INCLUDE\n\nCOMMENTS that begin with a double slash are\
    \ comments. This means they won't be executed and are ignored by the compiler.\
    \ Comments designed to help you, or another programmer looking at code, explain\
    \ what is going on. There are two types of comment: multiple line comments and\
    \ single line. The two chevrons used here are insertion operators. This means\
    \ that whatever the chevrons is inserted into the std statement. In this case\
    \ they are 'Hello, world!' to be displayed on the screen when you compile and\
    \ execute the code.\n\n```cpp\n#include <iostream>\nint main()\n{\n    // My first\
    \ C++ program\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main()\n{\n    // My first C++ program\n    cout << \n}\n```\n\nSTD stands for\
    \ Standard. It is part of the Standard Name in C++, covers a number of different\
    \ statements and commands. You can leave the std out of the code but it must be\
    \ declared at the start using namespace std, not both. For example: OUTPUTS Leading\
    \ on, the \"Hello, world!\" part is what you want to appear on the screen when\
    \ you like, as long as it's in quotes. Sometimes brackets are needed, depending\
    \ on the compiler. The << part adds a new line to be inserted.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{\n    // My first C++ program\n\
    \    std::cout << \"Hello, world!\";\n}\n```\n\n```cpp\n// My first C++ program\n\
    cout << \"Hello, world!\";\n```\n\nCOUT In this example we use cout, which is\
    \ a part of the Standard Name, hence why it's there, as you're asking to use it\
    \ from that particular statement. cout means Character Output, which displays,\
    \ or presents something to the screen. If you have std, you have to declare it\
    \ at the start of the code, mentioned previously. ; AND) Finally you can see that\
    \ line within a function block (except comments) ends with a semicolon. This is\
    \ the end of the statement; all statements in C++ must have one at the end or\
    \ the compiler fails to build the code. The very last line has the closing bracket\
    \ to indicate the end of the main function.\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main()\n{\n    // My first C++ program\n    cout << \"Hello,\
    \ world!\";\n}\n```\n\n## Compile and Execute\n\nYou've created your first C++\
    \ program and you now understand the basics behind the structure of one. Let's\
    \ get things moving and compile and execute, or run if you prefer, the program\
    \ and see how it looks.\n\n## GREETINGS FROM C++\n\nCompiling and executing code\
    \ from within Geany is remarkably simple and just a matter of clicking a couple\
    \ of icons and seeing the result. Here's how it's done.\n\n- **STEP 1** Open Geany,\
    \ if you haven't already, load up the previously saved World you created. Ensure\
    \ that there are no visible errors, such as a missing semicolon at the end of\
    \ the code editor:\n\n- **STEP 3** When you click the Icon, the pane at the bottom\
    \ of the Geany interface displays results. If all is well, you will see a successful\
    \ compilation, if not then an error along with the line error was found.\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n![](img/383b23573296234863a9f25dc7161abc_125_0.png)\n\
    \n- **STEP 2** If your code is ready, look to the menu bar the top of the Geany\
    \ window. Notice that along the line of icons there's a red icon. This is Build,\
    \ which clicks when runs through code, checking if the C++ standards to see if\
    \ there are any errors before it starts running.\n\n- **STEP 4** With the successfully\
    \ build, it's now time to execute it. Next to the Build window there's a paper\
    \ airplane icon, this is the Run. If you can't run code that has been previously\
    \ built or has an error in place. Click the Run icon.\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n    // My first C++ program\n    std::cout << \"Hello, world!\\\
    n\";\n}\n```\n\n![](img/383b23573296234863a9f25dc7161abc_125_1.png)\n"
  mdcn: "\n\n## Linux 上的 C++\n\n## 你的第一个 C++ 程序\n\n树莓派是学习 C++ 的绝佳编程基础平台。你不需要任何复杂的第三方\
    \ IDE，也不需要安装任何额外的组件。开始所需的所有内容已经内置在树莓派中了。\n\n### 你好，世界！\n\n在编程中，第一段代码的传统做法是在屏幕上输出“Hello,\
    \ World!”字样。有趣的是，这可以追溯到 1968 年使用的一种名为 BCPL 的语言。\n\n- **步骤 1：** 你可以使用 Geany 编程编辑器在树莓派上编写、编译和执行你的\
    \ C++ 代码。你可以在树莓派主菜单的“编程”部分找到第一项中的 Geany。点击 Geany 图标打开并开始编码。\n\n- **步骤 2：** Geany\
    \ 编辑器功能强大且依然易于使用。你输入的每行代码都会显示在主窗口中，并带有编号帮助你跟踪代码。现在，在第 1 行：\n\n```cpp\n#include\
    \ <iostream>\n```\n\n```cpp\nint main()\n```\n\n- **步骤 3：** 现在看起来没什么特别，但你可以开始根据语言的颜色理解\
    \ C++ 头文件命令的含义。要激活此功能，点击“文件 > 保存”保存代码。现在将你的代码命名为 `helloworld.cpp` 并点击保存按钮。\n\n\
    ![](img/383b23573296234863a9f25dc7161abc_121_0.png)\n\n- **步骤 4：** 颜色编码在编码时非常有帮助。现在按回车键，在第\
    \ 3 行开始一个新命令。注意：括号之间没有空格。\n\n![](img/383b23573296234863a9f25dc7161abc_121_1.png)\n\
    ![](img/383b23573296234863a9f25dc7161abc_121_2.png)\n![](img/383b23573296234863a9f25dc7161abc_121_3.png)\n\
    \n- **步骤 5：** 在下一行，即 `int main()` 下方，输入一个大括号：\n\n- **步骤 8：** 现在你需要通过插入相反的大括号来结束代码。在第\
    \ 7 行：\n\n```cpp\n{\n```\n这可以通过在英语（英国）键盘布局上按下 `Shift` 和 `Ctrl` 加右侧的 `P` 来完成。注意，你不需要退格键回到行首来删除缩进，只需输入大括号，Geany\
    \ 就会将其与右侧部分连接；然后结束代码块。\n\n![](img/383b23573296234863a9f25dc7161abc_122_0.png)\n\
    \n- **步骤 6：** 注意到 Geany 自动创建了轻微的缩进。这是由于 C++ 的结构以及代码主体所在的位置。现在：\n\n```cpp\n// My\
    \ First C++ program\n```\n\n- **步骤 7：** 再次注意颜色编码的变化。在在上一步的末尾按回车键，然后输入：\n\n```cpp\n\
    std::cout << \"Hello, world!\";\n```\n\n- **步骤 9：** 本质上，这些是你进入 C++ 编码世界的第一步。我们将在接下来的几页中更详细查看代码结构；现在，点击带有绿色向下箭头的保存按钮来保存文件。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_122_1.png)\n![](img/383b23573296234863a9f25dc7161abc_122_2.png)\n\
    \n- **步骤 10：** 如果你还没有这样做，始终建议创建一个空白文件，用于保存你的 Python 和 C++ 代码，或者简单地建立一个代码文件夹，随你的喜好。这不是必须的，只是一个良好的习惯。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_122_3.png)\n![](img/383b23573296234863a9f25dc7161abc_122_4.png)\n\
    \n## C++ 程序结构\n\nC++ 有非常明确的结构和处理方式。漏掉任何部分，即使是一个小分号，你的整个程序将无法编译和执行。许多专业程序员都曾疏于这种粗糙的结构。通过学习编程基础，你开始理解程序的结构。命令在不同语言之间可能不同，但你可以开始看到代码是如何工作的。C++\
    \ 是由丹麦学生 Bjarne Stroustrup（比雅·斯特鲁strup）于 1979 年发明的，最初作为他名为 C++ 的论文的一部分，它在已经流行的\
    \ C 语言基础上增加了功能，同时使其环境更加用户友好。C++ 的发明者 Bjarne Stroustrup。`int main()` 初始化了一个函数的声明，它是名为\
    \ \"main\" 的的一组代码语句。所有的 C++ 代码都从 `main` 函数开始，无论它位于何处。每个 C++ 代码都以指令 `#include`\
    \ 开头。该指令指示预处理器包含标准 C++ 代码的一个部分。例如：大括号（花括号）可能是你以前没过的东西，特别是如果你用的是 Python 的话。大括号表示主函数的开始，并包含该函数的所有代码。\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n}\n```\n\n#INCLUDE\n\n以双斜杠开头的注释是注释。这意味着它们不会被执行，并会被编译器忽略。旨在帮助你或查看代码的另一个程序员的注释解释了正在发生什么。注释有两种类型：多行注释和单行注释。这里使用的两个尖括号（`<<`）是插入运算符。这意味着无论尖括号是什么，都会被插入到\
    \ `std` 语句中。在这种情况下，它们是 \"Hello, world!\"，在你编译和执行代码时显示在屏幕上。\n\n```cpp\n#include\
    \ <iostream>\nint main()\n{\n    // My first C++ program\n}\n```\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{\n    // My first C++ program\n\
    \    cout << \n}\n```\n\nSTD 代表 Standard（标准）。它是 C++ 中标准命名的一部分，涵盖了许多不同的语句和命令。你可以在代码中省去\
    \ `std`，但必须在开头使用 `namespace std` 对其进行声明，两者不可兼得。例如：输出。前面的 \"Hello, world!\" 部分是你希望在屏幕上显示的内容，只要它在引号中即可。取决于编译器，有时需要括号。`<<`\
    \ 部分添加了要插入的新行。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    // My first C++ program\n    std::cout << \"Hello, world!\";\n}\n```\n\n\
    ```cpp\n// My first C++ program\ncout << \"Hello, world!\";\n```\n\nCOUT 在此例中，我们使用了\
    \ `cout`，它是标准命名的一部分，这就是为什么它会在那里，因为你要求从那个特定的语句中使用它。`cout` 表示 Character Output（字符输出），它在屏幕上显示或呈现某些内容。如果你有\
    \ `std`，你必须如前提到的在代码开头声明它。；和) 最后你可以看到函数块内的该行（除了注释）以分号结束。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main()\n{\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\";\n}\n```\n\n## 编译与执行\n\n你已经创建了第一个 C++ 程序，现在理解了其背后的结构。让我们让它运行起来，编译并执行（或者你更喜欢叫运行）程序并查看效果。\n\
    \n## 来自 C++ 的问候\n\n在 Geany 中编译和执行代码非常简单，只需点击几个图标并查看结果。这是操作方法：\n\n- **步骤 1：** 如果你还没有，打开\
    \ Geany加载之前保存的世界。确保没有可见错误，例如代码编辑器末尾缺少分号：\n\n```cpp\n#include <iostream>\nint main()\n\
    {\n    // My first C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n```\n\
    \n![](img/383b23573296234863a9f25dc7161abc_125_0.png)\n\n- **步骤 2：** 如果代码就绪，查看\
    \ Geany 窗口顶部的菜单栏。注意图标线上有一个红色图标。这是 Build（编译），它会运行代码，检查 C++ 标准以查看在运行之前是否有任何错误。\n\
    \n- **步骤 3：** 成功构建后，现在是执行它的时候。在 Build 窗口旁边有一个纸的飞机图标，这是 Run（运行）。你可以运行之前构建过的或位置有错误的代码。点击\
    \ Run 图标。\n\n```cpp\n#include <iostream>\nint main()\n{\n    // My first C++ program\n\
    \    std::cout << \"Hello, world!\\n\";\n}\n```\n\n![](img/383b23573296234863a9f25dc7161abc_125_1.png)\n\
