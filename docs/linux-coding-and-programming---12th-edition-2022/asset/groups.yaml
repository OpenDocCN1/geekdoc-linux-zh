    the name of the variable inside the brackets. In this case it would be `type(name)`.
    Add a new string variable: `title="Descended from Vikings"`.


    ```

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> type(name)

    class ''str''

    >>> type(title)

    class ''str''

    ```


    +   STEP 4


    You can also combine variables within another variable. For example, to combine
    both name and title into a new variable we use:


    ```

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> full_name = name + ": " + title

    >>> print(full_name)

    David Howard: Descended from Vikings

    ```


    Then output the content of the new variable as:


    ```

    print (character)

    ```


    Numbers are stored as different variables:


    ```

    age=44

