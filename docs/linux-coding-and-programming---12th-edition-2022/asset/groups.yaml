    # 在线实现匿名


    数字时代为通信带来了许多巨大的进步；然而，它也带来了一个间谍和窥视的新时代。我们大多数人对政府、秘密组织和地下黑客侵犯我们隐私的频繁新闻并不陌生，但你该如何对抗这一点呢？


    # 使用 MINT 实现匿名性


    虽然在网上实现完全匿名几乎是不可能的，但你可以采取一些措施来确保我们的隐私达到最佳状态。


    - 步骤 1：从基础开始，浏览时使用 HTTPS 而不是标准的 HTTP。这意味着通过 HTTPS 传输任何内容都是安全的（因此结尾的 S 代表 Secure）并且经过加密的。

    - 步骤 2：在浏览时，考虑使用浏览器提供的“无痕”或“隐私”模式。这将禁用你的网页历史和缓存，允许你浏览时无需担心细节被存储供他人日后审查。然而，它并阻止任何数据或搜索跟踪。

    - 步骤 3：虽然使用 Google 似乎是现代互联网搜索的必然选择，但该公司公司会跟踪个人进行的所有搜索。相反，请考虑替代搜索引擎，例如 DuckDuckGo，这是一个不存储个人数据或跟踪你的用户的搜索引擎。

    - 步骤 4：如果你在互联网上浏览，考虑安装一些可以增强隐私保护的浏览器插件。例如，对于 Firefox，使用 Ghostery、NoScript 和 Adblock
    Plus 来拦截跟踪器和其他数据挖掘技术。


    ![](img/383b23573296234863a9f25dc7161abc_41_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_1.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_2.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_3.png)


    # VPN 和 TOR


    之前的步骤可以帮助你的在线隐私，但要真正变得匿名，你需要虚拟专用网络（VPN）和 Tor。


    - 步骤 1：VPN 是一个网络服务器或服务器集群，它与你的计算机建立连接。最终结果是你的计算机在互联网上的身份隐藏在 VPN 远程服务器之后；因此你可以在英国使用属于冰岛的
    IP 地址（计算机在线身份）。

    - 步骤 2：大多数优秀的 VPN 都会收取月费或年费，但这些支出是值得的。我们使用 CyberGhost (www.cyberghost.com)，它为
    Windows、Mac、Mint（以及任何其他 Linux 发行版）、Android 和 iOS 设备提供 VPN 连接。关于每个操作系统的详情可以在 www.cyberghost.com/hz/en-us/articles/213190329-Read-first-
    找到。

    - 步骤 4：下载完成后，将其拖入 Terminal（终端）并进入 Downloads 文件夹，`cd Downloads/`。按回车检查是否存在 `tar.xz`
    文件，然后输入：`tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz`（X 是变量，所以如果你的版本不同，按 Tab
    键自动补全 tor-browser文件名）。当文件解压后，使用 `cd tor-browser-en-US` 进入。

    - 步骤 5：快速点击即可显示 Browser 文件夹和“start-tor-browser”文件。要启动设置，输入：`~/start-tor-browser.desktop`。此命令启动设置，并为你提供两个选项：Connect（连接）或
    Configure（配置）。如果不担心，选择 Connect 选项即可。准备好后点击。

    - 步骤 6：连接建立后，将启动 Tor Browser。这是一个 Firefox 的定制版本，在这里你可以安全地浏览互联网而无需担心被查看或跟踪。结合使用
