- md: "\n# Apollo 11\n\nDID YOU KNOW...\nJuly 20th 1969 is remembered as a turning\
    \ point in human history, when mankind first stepped on the moon. The software\
    \ that helped the crew make that pivotal voyage didn't exist at the time and had\
    \ to be developed from scratch. Using a new method of storing programs called\
    \ Rope Memory, the engineers at MIT Instrumentation Laboratory populated the memory\
    \ with a special version of assembly.\n\nIncredibly, that code is freely available\
    \ to view on GitHub. Uploaded by a researcher in 2003, you can view the code by\
    \ visiting www.github.com/chrisgararry/Apollo-11/. Look out for code snippets,\
    \ such as Burn, Baby_Burn, in particular with the comment \"Goodbye. Come again\
    \ soon.\"\n\nHave a look through, and see what else you can find.\n\n| NAME |\
    \ TYPE | |\n|---|---|---|\n| BARBALL | | |\n| JANE | | |\n| TOM | | |\n| TIFF\
    \ | | |\n| TURSTON | | |\n| RACE | | |\n| FLASBORG | | |\n| PACE | | |\n| CUP\
    \ | | |\n| BITTER | | |\n| EDITOR | | |\n| EXIDER | | |\n| TURSTON | | |\n| PUBLISH\
    \ | | |\n| GISH | | |\n| TCF | | |\n| GOTMAN | | |\n| HANVILLE | | |\n| BORIS\
    \ | | |\n| PUBLISH | | |\n| PAGE | | |\n| CLASS | | |\n| DANCE | | |\n| SERVICE\
    \ | | |\n| PRIDERS | | |\n| PRIDERS | | |\n| DEFINITION | | |\n| EDISON | | |\n\
    \n| | |\n|---|---|\n| SUBSCRIBE TO CHIPS CONTROLS | |\n| ADD NEW DEFECTS TO THE\
    \ BACKLOG | |\n| ADD NEW DEFECTS TO THE BACKLOG | |\n| EXITS ARE NOT IN POWER\
    \ AUTO | |\n| US ARE ON THE DESERT STREET | |\n| YES, CHECK FOR AUTO TILE HERE\
    \ | |\n| REPLAY LINES PLEASE TERRORY | |\n| ON POWER BITS | |\n| TEST TONITE |\
    \ |\n\n| | |\n|---|---|\n| 30 | |\n| 10 | |\n| 50 | |\n\n| | |\n|---|---|\n| ************************\
    \ | |\n| * SERVICE FOR THE BACKLOG * | |\n| ************************ | |\n\n|\
    \ | |\n|---|---|\n| SERVICE | PASSABLE |\n\n| | |\n|---|---|\n| PRIDERS | PASSABLE\
    \ |\n| PRIDERS | PASSABLE |\n\n| | |\n|---|---|\n| DEFINITION | PASSABLE |\n|\
    \ EDISON | DISCREET |\n\n> Programmers aren't without a sense of humour: See what\
    \ else is in there.\n\n![](img/383b23573296234863a9f25dc7161abc_35_0.png)\n\n\
    # One giant leap for mankind, and coding.\n\n![](img/383b23573296234863a9f25dc7161abc_36_0.png)\n\
    \nCredit: Apollo 11/NASA\n\n# Getting to Know Linux\n\n## Creating Users\n\nWhen\
    \ you install Linux Mint it is configured for you with a single user. While sharing\
    \ a user account with the entire family is fine, there may come a time when you\
    \ need to create separate users with their own unique Home Folders.\n\n## NEW\
    \ USERS\n\nHaving different users means each user has access to his or her areas\
    \ on the system. Documents, pictures, videos and so on are separate, with multiple\
    \ users on other operating systems.\n\n- STEP 1 Click on the Linux Mint Menu and\
    \ type 'users' to begin searching for the relevant console. Choose Users and Groups\
    \ and enter your password. The Users and Groups console is quite basic looking,\
    \ and thankfully easy to use. At first, you can just see your own home from when\
    \ you installed Linux Mint.\n\n- STEP 3 Enter the user's Full Name, followed by\
    \ the Username they need when logging into Linux Mint. Make sure the username\
    \ is all in lower case, a-z and 0-9 characters underscores or hyphens if you wish.\
    \ Click the Add button when you're ready to continue.\n\n![](img/383b23573296234863a9f25dc7161abc_37_0.png)\n\
    \n- STEP 2 To add a new user, click the Add button at the bottom of the console.\
    \ There are two types of user you can create, Standard and Administrator. Unless\
    \ the user needs to install new apps or access parts of the file system beyond\
    \ their Home Folder, then use the Standard account type.\n\n- STEP 4 The new user\
    \ appears in the list of current Linux Mint users, in alphabetical order. At present,\
    \ there is no password set so click the user in the list of current users, click\
    \ the No Password Set option for the user's username.\n\n![](img/383b23573296234863a9f25dc7161abc_37_1.png)\n\
    \n![](img/383b23573296234863a9f25dc7161abc_37_2.png)\n\nwww.bdmpublications.com\n\
    \n# STEP 5\n\nYou can enter a password for the new user or click the curved arrow\
    \ at the end of the New Password box to generate a password for you, as well as\
    \ displaying it. Naturally, it's a good idea to come with a strong password possible.\
    \ When you are done, click the Change button.\n\n![](img/383b23573296234863a9f25dc7161abc_38_0.png)\n\
    \n# STEP 7\n\nOnce logged in the new user is required to set up their own desktop,\
    \ and so on. Depending on what Account Type you set up for, Standard or Administrator,\
    \ they won't be able to install new apps. This screenshot is from a Standard account.\n\
    \n![](img/383b23573296234863a9f25dc7161abc_38_1.png)\n\n# STEP 6\n\nYou can close\
    \ the Users and Groups window now, as the new user has been created. If you click\
    \ the Mint Menu, followed by Logout, you are presented with the Login Manager.\
    \ The new user is present in the list of currently available users. Click on them\
    \ to log in.\n\n![](img/383b23573296234863a9f25dc7161abc_38_2.png)\n\n# STEP 8\n\
    \nYou can create as many new accounts as you need and you be able to switch between\
    \ them when required. It's best to have one account that's capable of installing\
    \ new software, that way you can keep track of what your system.\n\n![](img/383b23573296234863a9f25dc7161abc_38_3.png)\n\
    \n# COMMAND LINE ACCOUNTS\n\nJust as you expect, you can create a new user within\
    \ the command line. Open up a Terminal session under the administrator account.\n\
    \nThe process for adding new user from the command line is relatively simple.\
    \ To begin with, use `sudo adduser <username>` as the new user's login name. You\
    \ are asked to create a password for the user, along with their name and other\
    \ details. Click to confirm the details and create the user account.\n\n```\n\
    sudo adduser jim\nAdding user jim...\nAdding new user jim (1002) with group 'jim'\n\
    Creating home directory: /home/jim\nCopying skeleton from /etc/skel\nEnter password\
    \ again:\nFull Name []: Jim\nRoom Number: \nWork Phone: \nOther: \npassword updated\
    \ successfully\n```\n\n# STEP 2\n\nYou can check the details and account type\
    \ for the new user from within Users and Groups. If you want to delete a user\
    \ from Mint, you can enter `sudo deluser <username>` in the Terminal or delete\
    \ in Groups.\n\n![](img/383b23573296234863a9f25dc7161abc_38_4.png)\n\nwww.bdmpublications.com\n\
    \n# Customising the Desktop\n\nCustomising the operating system desktop is one\
    \ way to make it your own: a personalised workspace that is there to help you\
    \ work, inspire or feature the company logo. Whatever your reasons for having\
    \ your own desktop, here's how it's done.\n\n## YOUR DESKTOP\n\nLinux is probably\
    \ one of the customised operating systems. With just a few tweaks, one or two\
    \ extras installed and some imagination, you can create something incredible.\n\
    \n**STEP 1** The first aspect of desktop customisation is to change the wallpaper.\
    \ Right-click the desktop and choose Change Background. This opens the Backgrounds\
    \ app in Linux Mint; remember, others may present their background, wallpaper\
    \ selection tools differently.\n\n**STEP 3** You just need to click the available\
    \ images, from any of the locations provided to have them as the desktop wallpaper.\
    \ Incidentally, if you have images stored in another location on your system or\
    \ network, you can add them by clicking on the Plus symbol at the bottom of the\
    \ Backgrounds console, using the file manager to locate them.\n\n![](img/383b23573296234863a9f25dc7161abc_39_0.png)\n\
    \n**STEP 2** More recent versions of Linux Mint display available backgrounds\
    \ depending on the version the user is running. You normally get three categories\
    \ followed by a fourth, Pictures, which are different from the others. The Pictures\
    \ option is different because it reads the content from the Pictures folder in\
    \ your Home directory.\n\n**STEP 4** By clicking the Settings tab you can, instead\
    \ play images as a slideshow or change the aspect of the wallpapers to a variety\
    \ of choices.\n\n![](img/383b23573296234863a9f25dc7161abc_39_1.png)\n\n![](img/383b23573296234863a9f25dc7161abc_39_2.png)\n\
    \n![](img/383b23573296234863a9f25dc7161abc_39_3.png)\n\n# Customising the Desktop\n\
    \n**STEP 5** If none of the available wallpapers take your fancy, open a browser\
    \ and search for the type of background image you prefer. When you've found the\
    \ image you want as the desktop wallpaper, right-click it and choose Set As Desktop\
    \ Background from the list of options. When the Set Desktop Background console\
    \ open, click the Set Desktop Background button.\n\n**STEP 8** Themes allows you\
    \ to change the certain aspects of the Mint desktop look: Window Borders, Icons,\
    \ Controls, Mouse Pointer and Desktop. In the Settings tab you can extend the\
    \ options with a few on/off sliders.\n\n![](img/383b23573296234863a9f25dc7161abc_40_0.png)\n\
    \n**STEP 6** Click the Menu button and search for 'desktop' and click the Settings\
    \ result. The Desktop console allows you to pick the layout, desktop icons and\
    \ options for multi-monitor support. You can experiment with the options for the\
    \ best setup, according to your personal tastes.\n\n**STEP 9** If you click the\
    \ Add/Remove button in the centre of the three options, you can choose the default\
    \ view from a number of preinstalled themes. Click the theme you want, then click\
    \ the (downward-pointing arrow) button to enable it.\n\n![](img/383b23573296234863a9f25dc7161abc_40_1.png)\n\
    \n**STEP 7** In addition to changing the desktop wallpaper, and how the icons\
    \ are displayed, you can also alter the overall theme for Linux Mint. In the Mint\
    \ Menu, search for 'Themes' and click the Themes app as it appears in the search\
    \ results.\n\n**STEP 10** Click Back on Themes, then and you can locate the newly\
    \ installed theme and apply to the desktop. Any installed theme can also be uninstalled\
    \ with the Add/ Remove button. It's worth spending some time personalising the\
    \ desktop you want and there are some incredible themes available.\n\n![](img/383b23573296234863a9f25dc7161abc_40_2.png)\n\
    \n![](img/383b23573296234863a9f25dc7161abc_40_3.png)\n"
  mdcn: "\n\n# 阿波罗 11 号\n\n你知道吗...\n1969年7月20日被记录为人类历史上的转折点，人类首次踏上月球。当时帮助机组完成这次关键航程的软件并不存在，必须从零开始。麻省理工学院实验室的工程师使用一种名为“绳带内存”（Rope\
    \ Memory）的新程序存储方法，在内存中填充了特殊版本的汇编代码。\n\n令人置信的是，这些代码可以在 GitHub 上免费查看。由一位研究人员于2003年上传，你可以访问\
    \ www.github.com/chrisgararry/Apollo-11/ 查看代码。特别注意某些代码段，例如 Burn, Baby_Burn，其带有注释“Goodbye.\
    \ Come again soon. ”。\n\n浏览一下，看看你还能发现什么。\n\n| 姓名 | 类型 | | \n|---|---|---|\n| BARBALL\
    \ | | |\n| JANE | | |\n| TOM | | |\n| TIFF | | |\n| TURSTON | | |\n| RACE | |\
    \ |\n| FLASBORG | | |\n| PACE | | |\n| CUP | | |\n| BITTER | | |\n| EDITOR | |\
    \ |\n| EXIDER | | |\n| TURSTON | | |\n| PUBLISH | | |\n| GISH | | |\n| TCF | |\
    \ |\n| GOTMAN | | |\n| HANVILLE | | |\n| BORIS | | |\n| PUBLISH | | |\n| PAGE\
    \ | | |\n| CLASS | | |\n| DANCE | | |\n| SERVICE | | |\n| PRIDERS | | |\n| PRIDERS\
    \ | | |\n| DEFINITION | | |\n| EDISON | | |\n\n| | |\n|---|---|\n| 订阅 CHIPS 控制\
    \ | | |\n| 向待办事项添加新缺陷 | | |\n| 向待办事项添加新缺陷 | | |\n| 退出不在自动电源控制中 | | |\n| 我们在沙漠街上\
    \ | | |\n| 是的，在这里检查自动瓦片 | | |\n| 请重放线路区域 | | |\n| 电源位开启 | | |\n| 今晚测试 | | |\n\n\
    | | |\n|---|---|\n| 30 | | |\n| 10 | | |\n| 50 | | |\n\n| | |\n|---|---|\n| ************************\
    \ | | |\n| * 待办事项服务 * | | |\n| ************************ | | |\n\n| | |\n|---|---|\n\
    | 服务 | 可用 | |\n\n| | |\n|---|---|\n| PRIDERS | 可用 | |\n| PRIDERS | 可用 | |\n\n\
    | | |\n|---|---|\n| 定义 | 可用 | |\n| EDISON | 离散 | |\n\n> 程序员并不是没有幽默感：看看里面还有什么。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_35_0.png)\n\n# 人类的一大步，代码的一大步。\n\n![](img/383b23573296234863a9f25dc7161abc_36_0.png)\n\
    \n感谢：阿波罗 11 号/NASA\n\n# 了解 Linux\n\n## 创建用户\n\n当你安装 Linux Mint 时，它会为你配置一个单一用户。虽然与全家人共享一个用户账户没有问题，但将来你可能需要创建具有其独立唯一主目录（Home\
    \ Folders）的独立用户。\n\n## 新用户\n\n拥有不同的用户意味着每个用户都可以访问其在系统中的区域。与其他操作系统中一样，文档、图片、视频等是分开的。\n\
    \n- 第 1 步：点击 Linux Mint 菜单并输入“users”开始搜索相关的控制台。选择“用户和组”（Users and Groups）并输入密码。用户和组控制台看起来非常简单，而且容易使用。起初，你只能看到安装\
    \ Linux Mint 时的自己的主页。\n\n- 第 3 步：输入用户的全名，然后是他们登录 Linux Mint 时所需的用户名。确保用户名全为小写字母\
    \ a-z 和 0-9 字符，根据需要可以使用下划线或连字符。准备好继续时，点击“添加”（Add）按钮。\n\n![](img/383b23573296234863a9f25dc7161abc_37_0.png)\n\
    \n- 第 2 步：要添加新用户，点击控制台底部的“添加”按钮。你可以创建两种类型的用户：标准用户（Standard）和管理员（Administrator）。除非用户需要安装新应用或访问其主目录之外的文件系统部分，否则请使用标准账户类型。\n\
    \n- 第 4 步：新用户将出现在当前 Linux Mint 用户列表中，按字母顺序排列。目前尚未设置密码，因此点击当前用户列表中的用户，点击该用户用户名对应的“未设置密码”（No\
    \ Password Set）选项。\n\n![](img/383b23573296234863a9f25dc7161abc_37_1.png)\n\n![](img/383b23573296234863a9f25dc7161abc_37_2.png)\n\
    \nwww.bdmpublications.com\n\n# 第 5 步\n\n你可以为新用户输入密码，或者点击新密码框末尾的弯箭头为你生成并显示密码。当然，设置一个强密码是个好主意。完成后，点击“更改”（Change）按钮。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_38_0.png)\n\n# 第 7 步\n\n登录后，新用户需要设置自己的桌面等。根据你设置的账户类型（标准或管理员），他们将无法安装新应用。这张截图来自标准账户。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_38_1.png)\n\n# 第 6 步\n\n你可以关闭“用户和组”窗口了，因为新用户已经创建。如果你点击\
    \ Mint 菜单并点击“注销”（Logout），将看到登录管理器。新用户出现在可用用户列表中。点击他们登录。\n\n![](img/383b23573296234863a9f25dc7161abc_38_2.png)\n\
    \n# 第 8 步\n\n你可以创建需要数量的新账户，并在需要时它们之间切换。最好有一个能够安装新软件的账户，这样你可以跟踪你的系统。\n\n![](img/383b23573296234863a9f25dc7161abc_38_3.png)\n\
    \n# 命令行账户\n\n正如你所期望，你可以在命令行中创建新用户。在管理员账户下打开终端会。从命令行添加新用户的过程相对简单。首先，使用 `sudo adduser\
    \ <username>` 作为新用户的登录名。系统提示为用户创建密码以及姓名和其他详情。点击确认详情并创建用户。\n\n```\nsudo adduser\
    \ jim\nAdding user jim...\nAdding new user jim (1002) with group 'jim'\nCreating\
    \ home directory: /home/jim\nCopying skeleton from /etc/skel\nEnter password again:\n\
    Full Name []: Jim\nRoom Number: \nWork Phone: \npassword updated successfully```\n\
    \n# 第 2 步\n\n你可以在“用户和组”中检查新用户的详情和账户类型。如果你想从 Mint 中删除用户，可以在终端中输入 `sudo deluser\
    \ <username>` 或在组中删除。\n\n![](img/383b23573296234863a9f25dc7161abc_38_4.png)\n\n\
    www.bdmpublications.com\n\n# 自定义桌面\n\n自定义操作系统桌面是让它属于你的一种方式：一个帮助你工作、激发灵感或展示标志的个性化工作空间。无论你拥有自己桌面的原因，方法如下。\n\
    \n## 你的桌面\n\nLinux 可能是最可自定义的操作系统之一。只需少量调整、安装一两个额外程序并发挥想象力，就能创建出惊的东西。\n\n**第 1\
    \ 步**：桌面自定义的第一方面是更改壁纸。右键点击桌面并选择“更改背景”。这将打开 Linux Mint 中的背景应用；记住，其他系统可能以不同的方式展示背景壁纸选择工具。\n\
    \n**第 3 步**：你只需点击提供的任何位置的可用图片作为桌面壁纸。另外，如果你在系统的或其他位置存储了图片，可以通过点击背景控制台底部的“+”符号并使用文件管理器找到它们。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_39_0.png)\n\n**第 2 步**：较新版本的 Linux\
    \ Mint 根据用户运行的版本显示可用背景。你通常得到三个类别，然后是第四个“图片”，它与其他不同。“图片”选项的不同之处是因为它读取你主目录中“图片”文件夹的内容。\n\
    \n**第 4 步**：通过点击“设置”标签页，你可以将图片作为幻灯片播放，或者将壁纸外观更改多种选择。\n\n![](img/383b23573296234863a9f25dc7161abc_39_1.png)\n\
    \n![](img/383b23573296234863a9f25dc7161abc_39_2.png)\n\n![](img/383b23573296234863a9f25dc7161abc_39_3.png)\n\
    \n# 自定义桌面\n\n**第 5 步**：如果没有可用壁纸中你喜欢的，打开浏览器并搜索你喜欢的背景图片类型。当你找到了想要作为桌面壁纸的图片时，右键点击它并从选项列表中选择“设置为桌面背景”。当“设置桌面背景”控制台打开时，点击“设置桌面背景”按钮。\n\
    \n**第 8 步**：“主题”允许你更改 Mint 桌面的某些外观：窗口框、图标、控件、鼠标指针和桌面。在“设置”标签页中，你可以通过几个开关滑动条扩展选项。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_40_0.png)\n\n**第 6 步**：点击菜单按钮并搜索“桌面”，点击设置结果。桌面控制台允许你选择布局、桌面图标以及多显示器支持。你可以根据个人喜味尝试获得最佳设置。\n\
    \n**第 9 步**：除了更改桌面壁纸和图标显示方式，你还可以更改 Linux Mint 的整体主题。在 Mint 菜单中搜索“主题”并点击搜索结果中的主题应用。\n\
    \n**第 10 步**：返回“主题”，然后你就可以找到新安装的主题并应用到桌面。任何已安装的主题都可以通过“添加/删除”按钮卸载。花些时间个性化你想要的桌面是值得的，而且有很多非常棒的主题可用。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_40_1.png)\n\n"
