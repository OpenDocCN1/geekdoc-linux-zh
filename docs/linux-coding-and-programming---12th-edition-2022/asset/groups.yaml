    setup with multiple monitors, you can also choose which monitor displays icons.


    ![](img/383b23573296234863a9f25dc7161abc_32_0.png)

    - **STEP 9** Click on the Menu and type system settings and opening the result
    icon. This takes you to you''re able to control and edit the Way Mint Cinnamon
    looks and as well add new users, manage the firewall and enable accessibility
    options.


    ![](img/383b23573296234863a9f25dc7161abc_32_1.png)

