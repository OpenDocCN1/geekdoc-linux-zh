    # 保存并执行代码


    在 IDLE 中工作时，短代码片段完全没，但它并不是为了长程序列表设计的。在本节中你将介绍 IDLE 编辑器，你将在那里工作。


    ## 编辑代码


    你最终会遇到需要在 Shell 中输入单行的情况。相反，IDLE 编辑器允许你保存并执行你的 Python 代码。


    - **步骤 1** 首先，打开 Python IDLE Shell，当它运行时，点击文件 -> 新文件。这将打开一个名为无标题的窗口。这就是 IDLE 编辑器，你可以在其中输入代码。

    - **步骤 2** IDLE 编辑器在本质上是一个具有 Python 功能的简单文本编辑器，与 Sublime 类似；在 Shell 中输入代码，你可以参考之前的教程：

    - **步骤 3** 你可以看到相同的代码同时出现在 IDLE 编辑器和 Shell 中，这让你理解代码正在发生什么。然而，为了执行代码，你需要保存它。按下
    F5 弹出保存...框。

    - **步骤 4** 点击保存框中的确定按钮，选择一个你保存所有 Python 代码的目的地。目的地是一个名为 Python 的专用文件夹，或者你也可以放在任何喜欢的地方。为了以后方便你，记得保持整洁。

    ```python

    print("Hello everyone!")

    ```

    ![](img/383b23573296234863a9f25dc716abc_95_1.png)

    ![](img/383b23573296234863a9f25dc716abc_95_2.png)


    - **步骤 5** 为你的代码输入一个名称，例如 ''print hello''，然后点击保存按钮。Python 代码已保存并将在 IDLE Shell
    中详细显示。在这种情况下，文字为 ''Hello everyone!''

    - **步骤 8** 让我们扩展代码并输入几个之前的教程示例：

    ```python

    a=2

    b=2

    name="Dovid"

    surname="Hayward"

    print(name, surname)

    print (a+b)

    ```


    如果你按下 F5，你就可以再次保存文件了，因为它被 Python 修改了。


    ![](img/383b23573296234863a9f25dc716abc_96_0.png)


    - **步骤 6** 这是你大部分 Python 代码的执行方式。将其输入编辑器，按 F5，保存代码并查看 Shell 中的输出。有时会有不同，取决于你是否请求了进程窗口，但除非另有说明，基本上这就是我们使用的进程。

    - **步骤 9** 如果你点击确定，文件将被新的代码条目覆盖并在 Shell 中执行。对于这几行代码这不是问题，但如果你想编辑一个较大的文件，覆盖可能会变成问题。使用编辑器的“文件
    > 另存为”创建一个副本。


    ![](img/383b23573296234863a9f25dc716abc_96_1.png)

    ![](img/383b23573296234863a9f25dc716abc_96_2.png)


    - **步骤 7** 如果你打开保存的 Python 代码的文件位置，你可以看到 .py 扩展名。这是默认的 Python 文件名。你创建的任何代码都是 whatever.py，从互联网资源下载的任何代码都是
    .py。只需确保代码是为 Python 编写的。

    - **步骤 10** 创建一个新文件。关闭编辑器并从 Shell 打开新实例（文件 > 新文件）。输入以下内容并保存：


    ```python

    a="Python"

    b="15"

    c="hello!"

    ```


    你今天使用了这段代码。![](img/383b23573296234863a9f25dc716abc_96_3.png)


    # 从终端执行代码


    尽管我们在整本书中使用的 GUI 版本的 IDLE，但看一眼 Python 的命令行处理也是值得的。我们已经知道有命令行版本的 Python，但它也被用于执行。命令行代码


    使用之前教程创建的代码，名为 hello.py 的一个，在 Shell 中输入。命令行方式是 Python 2，或者你使用 Python 3。首先，进入到你操作系统的终端。


    - **步骤 3** 你现在位于命令行。对于 Python 3，你需要输入 `python3` 并回车。

    ```bash

    pi@raspberry.py ~

    ```

    - **步骤 2** 就像之前，Raspberry Pi？使用 Windows 将需要点击开始按钮，然后 CMD，可以使用它访问命令行。

    - **步骤 4** 从这里，你通过点击文件 > 终端来执行代码。

    ```python

    print(a)

    ```

    你可以看到它工作完全相同。

    ```bash

    pi@raspberry.py ~

    $ python3 raspberry.py - Result. Oct 2014, 13:31

    ```

    3.4. >>> [4.0] print(''copyright'', ''credits'' or ''license'') for more information.

    >>> print(''hello'')

