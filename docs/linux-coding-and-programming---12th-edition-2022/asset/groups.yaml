    # Equipment You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, even a computer that''s several years old will happily run this
    distro. However, it''s worth checking you have everything in place before proceeding.


    # MINTY INGREDIENTS


    Before we start working our way through this book, here''s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see what works best for you.


    # SYSTEM REQUIREMENTS


    + The minimum system requirements for Linux Mint are as follows:


    * **CPU** – 700MHz

    * **RAM/Memory** – 512MB

    * **Hard drive space** – 9GB (20GB recommended)

    * **Display** – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    # USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a little later on but if you''re already familiar with the process, thinking of
    USB and just gathering the hardware you need, then you''re going to need a minimum
    4GB USB flash drive to store the Linux Mint ISO.


    ![](img/383b23573296234863a9f25dc7161abc_11_0.png)


    # DVD INSTALLATION


    DVD installation of Linux Mint simply requires a Blank DVD+ disc. Of course, you
    also need an optical drive (a DVD Writer drive) before you''re able to transfer
    or burn the ISO image to the disc.


    ![](img/383b23573296234863a9f25dc7161abc_11_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_11_2.png)


    # VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distros. Linux Mint works exceedingly well when used in a virtual environment
    but more on later. There are many virtual environment apps available; however,
    VirtualBox, from Oracle, is one of the easiest to install. You can find the latest
    version at www.virtualbox.org.


    ![](img/383b23573296234863a9f25dc7161abc_12_0.png)


    # INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ![](img/383b23573296234863a9f25dc7161abc_12_1.png)


    # MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac owners use a virtual environment, such as VirtualBox or Parallels;
    and why not macOS is already a splendid operating system. If you''re wanting to
    breathe new life into an older Mac, make sure it''s an Intel CPU model and not
    the Power PC models. Beware though, it''s as pain free as installing on to a PC.


    ![](img/383b23573296234863a9f25dc7161abc_12_2.png)


    # Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user choice of versions of the distro: Cinnamon, MATE and
    Xfce. While that may sound a little confusing for the newcomer, each of the versions
    contains the same core Linux structure and kernel, the kernel is the core of the
    operating system, that handles all the instructions between the software.


    Each version is a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, the file manager
    to browse the operating system''s structure or how it launches. Again though,
    the core productivity, video and graphic suites are the same, and function in
    the same way.


    Why bother then with different desktop environment? Simply put, it''s down to
    personal taste. Some users prefer MATE, which is a fork of the classic GNOME 2
    environment and is a little more centric and performs well on older computers.
    Others prefer Cinnamon, which is a modern environment that works on hardware.
    Xfce is a lightweight desktop environment that works on older hardware due to
    extremely low use of available resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux Mint has opted to bring
    the user a wealth of choice.


    ![](img/383b23573296234863a9f25dc7161abc_13_0.png)


    # A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    ### FEATURE 1

    It performs excellently on more modern systems but is a lot more stable than it
    used to be, and not quite the resource hog it was. Therefore, don''t miss out
    on Cinnamon if you''re using an older computer to install and test Linux Mint.


    ### FEATURE 2

    Cinnamon features Hot Corners, where each corner of the desktop can be clicked
    to perform a certain task, such as displaying workspaces, Show Windows or Run
    Command. Hot Corners work well to switch between different views and help make
    the desktop more efficient.


    ![](img/383b23573296234863a9f25dc7161abc_14_0.png)


    # BEST MATE


    MATE is simple to use and intuitive. In comparison to Cinnamon it looks a little
    antiquated but that''s only on the surface. There''s plenty to like with MATE.


    ### FEATURE 1

    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components that Cinnamon generally does but just
    as capable of delivering a great looking desktop as well as advanced customizations.


    ![](img/383b23573296234863a9f25dc7161abc_14_1.png)


    ### FEATURE 2

    Due to its highly configurable nature, MATE can be customised to a fine degree.
    There''s plenty of options available to the user who demands a little more from
    their desktop environment, including Compiz Settings, where you''re able to configure
    all manner of desktop effects, even a 3D cube.


    # STEROL FREE DESKTOP


    Xfce started life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and is now simply Xfce, with the nickname ''Cholesterol
    Free Environment''.


    ### FEATURE 1

    Xfce really is a quick desktop and brings out the best in Linux as a fast enough
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a new OS.
    Not bad.


    ### FEATURE 2

    Just because it''s quick and lightweight doesn''t mean Linux Mint Xfce isn''t
    a complete desktop operating system. Just like the other environments offered,
    you can get the latest Firefox, VLC, Gimp, chat apps and even a torrent client.


    ![](img/383b23573296234863a9f25dc7161abc_14_2.png)


    # Which Distro?


    Up to now we''ve looked at Linux Mint, but there are other Linux distributions
    out to try. In truth there are thousands of Linux distros to download and install,
    so which one should you decide to use?


    # DISTRO HOPPING


    Distro hopping is a term used by the community for people who never stick to a
    single distro. Instead, they hop from one to the other and back again, testing
    each; using them, moving from one to another to a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to get grips with
    what''s out there and discover the elements of one distro that may or not be to
    your tastes. The problem of course is which one do you use?


    ![](img/383b23573296234863a9f25dc7161abc_15_0.png)


    For example, Linux Mint is an ideal starting place. It''s an easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    installed out-of-the-box and gently eases you into.


    Ubuntu offers the same experience but it does this in a slightly different way.
    There''s generally less pressed with Ubuntu unless you install yourself. Another
    point is the sheer volume of content help pages decorated with Ubuntu users: if
    you get stuck, you''re not too far from a solution to the problem.


    Moving on, as you begin to grow comfortable with Linux, you might test the likes
    of OpenSE, Fedora. These are all excellent distros and offer the user a different
    perspective on how the systems run. Some are more demanding in terms of Linux,
    but each one has its value.


    While distro hopping is good, it''s not exactly a stable way to enjoy and get
    the most from it. It''s not saying you should stick to one distro and miss a lot
    of great content out there. Tails, for example, is a distro designed for online
    anonymity. Kali is designed for security professionals and contains many different
    kinds of ethical hacking tools.


