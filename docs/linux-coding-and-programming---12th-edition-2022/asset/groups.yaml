    # 树莓派 x Linux = 完美组合


    树莓派（Raspberry Pi）是一项卓越的硬件，为了发挥它的潜力，它需要一个卓越的操作系统。坦率地说，Linux 是树莓派默认且推荐的操作系统，它们共同构成了一个更强大的获胜组合。


    当树莓派处于开发阶段时，其设计者需要确保他们创建的硬件不仅仅是一个廉价、微小的电脑。


    树莓派在功能上需要是灵活的，它需要有空间成长为更具雄心的项目概念和想法，并且需要以尽可能易于使用的方式来实现。目标是创建一个通用的学习平台，让任何年龄的学生都能与之交互，同时学习编程、电子和计算等新概念。自然，一旦硬件准备就绪，操作系统的唯一选择就是
    Linux。


    Linux 的多功能性是传奇性的。这个极其内核操作系统如此具有塑性，可以引导计算的几乎任何领域，从超级计算到机器人，从太空工业到陆地工程；教育与科学、制造业和互联网。想一个行业，你很可能在任何地方发现
    Linux 安装在在后台支撑着这一切。


    ![](img/383b23573296234863a9f25dc7161abc_77_0.png)


    Raspian 是树莓派推荐的操作系统——这是一个基于 Debian 的定制发行版，它装载了一系列实用的工具，满足编码、电子和通用桌面计算任务的需求。除了应用程序之外，还预加载了模块以帮助你充分利用其功能，包括你决定学习和使用的编程语言，以及能够让你供电并使用树莓派独特硬件项目的硬件模块。例如，有
    Python 模块可以与树莓派的 40 路 GPIO 交互，允许你为任何硬件扩展板（HAT）设备创建内容。


    这种组合使得树莓派成为学习不仅是编码，而且是 Linux 的绝佳操作基础。Raspian 基于 Debian，能够运行本书中列出的任何终端（Terminal）命令，因为
    Linux、Mint 和 Ubuntu 也是基于 Debian 的。而且由于设置成本很低，你既可以拥有常规的 Windows 或 macOS 电脑，又拥有一台“无头”的树莓派（一个通电但不需要连接键盘或显示器的设备，你可以连接到它），通过它连接并学习如何使用
    Linux 以及如何编写代码。


    ![](img/383b23573296234863a9f25dc7161abc_77_1.png)


    # 树莓派 x Linux = 完美组合


    ## 选哪款 Pi？


    目前有多种树莓派型号可用，每种都与其他略有不同。最新发布的 Pi 是树莓派 3 B+，虽然这个型号比其他一些示例稍贵，但它是最强大且功能最丰富的 Pi。


    总的来说，最好的方法可能是使用树莓派 3 B+ 开始尝试树莓派，然后随着你技能的提高和对特定项目的关注，转向其他模型之一，例如需要使用占用空间更小且具有 WiFi
    连接功能的 Pi Zero 型号之一。


    ![](img/383b23573296234863a9f25dc7161abc_78_0.png)


    ## 超越 RASPIAN


    ## PI、Linux 与编程


    树莓派 ARM 处理器的灵活性意味着它能够运行如 Debian 等其他操作系统。继续使用 Linux 的同时，你可以安装 Ubuntu Mate、Pidora（基于
    Fedora 的发行版）、Lakka、PiPlay（一个复古仿真发行版）和 Arch Linux。还有一些部分基于 Linux 内核的系统，如 RetroPie、Amiga
    OS 克隆版。


    如前所述，树莓派是一个极佳的代码库，以 Linux 为骨干，你可以开始学习用多种不同的编程语言编写代码。Python 在这里非常适合，因为树莓派运行 Linux，你可以轻松扩展脚本来涵盖树莓派的大部分功能。从创建备份脚本开始，你可以创建访问树莓派
    GPIO 引脚的脚本，以便控制 LED 甚至制作硬件项目。一旦你完成了对某个版本 Linux 的实验实验，就像在桌面系统上操作一样，你就可以在树莓派上切换到另一个版本并看看效果如何。C++
    是最值得学习的强力语言之一，它被用于游戏，甚至是操作系统。


    ![](img/383b23573296234863a9f25dc7161abc_78_1.png)


    ## 命令参考


    当你开始全职使用 Linux 时，你会很快发现 Ubuntu、Mint 等图形化界面对于许多任务很棒，但并非适用于所有任务。理解如何使用命令行不仅能加强你对
    Linux 的理解，还能提高你的知识水平。我们的命令行快速旨在帮助你更快地掌握 Linux。


    ### 前 10 个命令


    这些可能不是所有人最常用的，但对于许多 Linux 和命令行用户来说，它们确实频繁出现：


    - cd: `cd` 是你最常用于切换目录的命令之一。使用它在层次结构中移动。你也可以使用 `cd`。

    - mv: `mv` 命令将文件移动到不同位置或重命名。如果你必须指定一个新名称来重命名，`mv file ~/Desktop` 会移动文件但不重命名它。

    - ls: `ls` 显示当前目录下的文件。通过某些选项，它可以让你查看大小、文件权限。例如 `ls -l` 显示你主目录下的文件。

    - chmod: `chmod` 更改列出文件的权限。权限基于简单的模型。如果只给出一个所有者（数字 ID），它将更改每个文件的所有者，而不更改组。

    - cp: `cp` 命令用于复制文件和目录。例如，`cp file` 会为输入的文件创建一个副本，原始文件将以原名继续存在。

    - pwd: `pwd` 命令打印工作目录的全路径（`pwd` 代表“print directory”）。终端在标题栏中也会显示此。

    - rm: `rm` 命令删除文件和目录。删除过程是将文件从文件系统中取消链接，并将空间标记为未来可用。换句话说，删除文件会增加磁盘上的可用空间。

    - clear: 如果你在终端环境中，`clear` 会清空屏幕，然后在 terminfo 数据库中确定如何清空屏幕。它等同于在 bash shell 中输入
    `Control-L`。

    - mkdir: “make directory”（创建目录）的缩写，`mkdir` 用于在文件系统中创建目录（如果指定的目录不存在）。例如，`mkdir`
    会创建一个工作目录。在调用 `mkdir` 时，可以指定多个目录。


    ## 有用的帮助/信息命令


    当你尝试学习更多关于 Linux 中正在运行的系统或程序时，以下命令非常有用。你可能不需要每天都用它们，但当你需要时，它们将是无价的。


    - free 显示系统中空闲和使用的物理内存及交换内存总量。例如，`free -m` 以兆字节（Megabytes）为单位提供信息。

    - sed 打开一个流编辑器。流编辑器用于对输入流（文件或来自管道的输入）执行转换。

    - df 显示所有分区的文件系统磁盘使用情况。`df -h` 命令最有用（`-h` 表示“human-readable”，即人类可读）。

    - adduser 向系统添加新用户。同样，`addgroup` 命令向系统添加新用户组。

    - top 提供运行系统的实时视图。它可以显示系统信息以及进程列表。

    - userdel 从系统删除一个用户。要删除该用户的文件和主目录，你需要添加 `-remove-home` 选项。

    - uname 命令配合 `-a` 选项打印所有系统信息，包括机器名称、内核版本和其他一些细节。

    - delgroup 命令从系统中删除一个用户组。你不能删除作为任何用户主要组的组。

    - ps 命令允许你查看机器上运行的所有进程。每个操作系统的 `ps` 版本略有不同，但功能相同。

    - man 命令调出 `man` 命令的手手册条目，这是使用它时一个绝佳的起点。

    - grep 命令允许你在多个文件中搜索特定模式并打印匹配的行。示例为：`grep blahh file`

    - man intro 命令 特别有用。它向你介绍“用户命令”（User Commands），这是一份关于 Linux 命令的编写良好且简短的介绍。


    ![](img/383b23573296234863a9f25dc7161abc_80_0.png)


    '
