    \n《霍比特》是一个具有计算机软件里程碑意义的超级程序。你将在文字和图形中面对危险、刺激和冒险。结识《霍比特》中的所有角色并用普通的英语与他们交流吧！《霍比特》程序将带你进入一个令人兴奋且充满挑战的幻想世界中的未来！\n\
    \n# MELBOURNE HOUSE\n\n> 《霍比特》，1982年高级编码领域的的奇迹。\n\n# 常见编码错误\n\n当你开始做某事时，不可避免地会犯错，这完全取决于经验，而这些错误本身就是伟大的老师。然而，即使是专家偶尔也会失误。关键在于，要尽可能地从中学习。\n\
    \n# X=MISTAKE, PRINT Y\n\n程序员需要注意许多许多陷阱，多到无法在此一一列举。当你开始进入更高级的领域时，能够强调错误并修复它，就能成为一名更好的程序员。每个人都会犯错，即使是拥有三十多年经验的程序员。从这些基础的常见错误中学习有助于建立更好的编码基础。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_143_0.png)\n\n# 小块处理\n\n如果能像《矩阵》电影中的尼奥那样工作就太好了。只需询问，你的操作员将其加载到你的内存中，你立刻知道该主题的一切。遗憾的是我们做不到。主要的陷阱是试图过快地学习太多东西。所以要分小块编写代码并慢慢来。\n\
    \n# 简单变量\n\n为变量命名有意义的名字是消除常见编码错误的关键。使用字母表可以，但当代码显示 `x` 变量出现问题时会怎样？给 `lives`、`money`、`player1`\
    \ 和 `0` 命名并不困难。\n\n```\nvar points = 1023;\nvar lives = 5;\nvar totalTime = 45;\n\
    write(\\Points: \"points\");\nwrite(\\Lives: \"lives\");\nwrite(\\Total Time:\
    \ \"totaltime\");\nvar totalScore = 0;\nwrite(\\Your Total Score is: \"totalScore\"\
    )\n```\n\n# //注释\n\n使用注释，当你下次查看代码时，它能节省很多麻烦。在代码中插入注释可以帮助你快速处理导致问题的混乱代码；当你需要审查旧代码时也有用。\n\
    \n```\norig = 2;\ntarget = 2;\n\n#endif\nif (n == 0) {\nreturn;\n}\n// Loop unrolling.\
    \ 这里的\n// (n - (-3)) 是 4 的最大倍数\n// 在 while 循环中，orig 将移动过\n// increment (4个元素的)\
    \ break.\n// end 标记了我们退出的边界\nchar const end = orig + 2 * n & (-3);\n// 检查是否对齐\
    \ 64 位进行写入\nif ($bit(orig) == 64) {\n\n!((amd6 & 4)) / defined (x86_64\n```\n\n\
    # 提前计划\n\n虽然某天醒来决定写一个经典的文字冒险游戏很棒，但这并不总是切实的。良好的代码片段不需要太多思考和规划就能写，但更长、更深入的代码需要良好的工作计划来坚持并帮助修复你的\
    \ Bug。\n\n![](img/383b23573296234863a9f25dc7161abc_143_1.png)\n\n* www.bindinguminations\n\
    \n# 用户错误\n\n用户输入往往是代码中一个瘫痪性的错误。例如，当用户应该输入年龄数字时他们输入了字母。用户经常会输入此类内容导致缓冲区溢出，从而崩溃。观察那些用户输入并清晰说明需要什么。\n\
    \n```\n输入一个整数\n你输入了错误\n你输入了错误\nsdf22123123\n2232n223\n你输入了错误\n数字是：12\n返回 (0x0)\
    \ 执行时间：2.49 s\n按任意键继续。\n```\n\n# 备份\n\n始终对你所做的所有更改进行备份。如果发生了错误，有良好的备份可以进行纠正。从这里开始比从头开始容易得多。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_144_0.png)\n\n# 重复发明轮子\n\n你可以花费几天时间来理解某些代码以获得良好的结果，这很令人沮丧且浪费时间。在互联网上解决相同的问题同样是有回报的。不要重复发明轮子，看看别人是否已经做过。\n\
    \n```\nclass=\"children\">\n  <div class=\"row\">\n    <div class=\"col-md-6\"\
    >\n      <label>范围</label>\n      <input type=\"range\" class=\"form-range\" id=\"\
    my-slider\" min=\"0\" max=\"100\" value=\"50\">\n    </div>\n    <div class=\"\
    col-md-6\">\n      <label>值</label>\n      <input type=\"text\" class=\"form-control\"\
    \ id=\"slider-value\" value=\"50\">\n    </div>\n  </div>\n</div>\n```\n\n# 安全数据\n\
    \n如果你正在编写处理或其他敏感数据的代码，请确保数据不是明文。在将敏感数据输入程序之前，学习创建一个加密敏感数据的函数，任何人都可以查看它。\n\n![](img/383b23573296234863a9f25dc7161abc_144_1.png)\n\
    \n# 帮助！\n\n寻求帮助对于我们大多数过去挣扎过的人来说并不是。默默忍受是一种常见的错误。只要你方法正确，在任何论坛上保持礼貌，提问并不愚蠢。\n\n\
