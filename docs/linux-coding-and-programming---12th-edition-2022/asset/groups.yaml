    'str'\n>>> class = \"str\"\n```\n\n# User Input\n\nWe've seen some basic interaction\
    \ with the code from a few examples earlier, so now would be a good time to focus\
    \ solely on how you get information from the user and present it.\n\n## USER FRIENDLY\n\
    \nThe type of input you want from the user will depend greatly on the type of\
    \ program you're coding. For example, a game may ask for a character's name, whereas\
    \ a database can ask for personal details.\n\n- STEP 1 If it's not already, open\
    \ the Python 3 Shell, and start a New File in the Editor. Let's begin with something\
    \ simple:\n\n```\nprint(\"Hello\")\nfirstname=input(\"What is your first name?\"\
