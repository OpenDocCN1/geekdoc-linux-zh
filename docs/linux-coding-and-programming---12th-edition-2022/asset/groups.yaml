    # Pi x Linux = The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential
    it needs a remarkable operating system. Frankly, Linux is the default and recommended
    OS of choice for the Pi, and together they make a much more winning team.


    When the Raspberry Pi was in its developmental stages, its designers needed to
    ensure that they were creating a piece of hardware that could offer more than
    simply a cheap, small, computer.


    The Pi needed to be flexible with what it could do, it needed to have room to
    grow into more ambitious project concepts and ideas, and it needed to do so in
    an easy-to-use fashion as possible. The goal was to create a universal learning
    platform that students of any age could interact with, while learning new concepts
    such as programming, electronics, and computing. Naturally, once the hardware
    was ready, the only real choice of operating system was Linux.


    The versatility of Linux is legendary. This incredible core OS is so malleable
    that it can be steered toward near any aspect of computing, from supercomputing
    to robotics, the space industry to terrestrial engineering; education and science,
    manufacturing and the Internet. Think of an industry, and you will likely find
    a Linux installation anywhere in the background keeping it all together.


    ![](img/383b23573296234863a9f25dc7161abc_77_0.png)


    Raspian is the recommended operating system for the Raspberry Pi—a customised
    Debian-based distribution that comes packed with a collection of useful tools
    that cater for coding, electronics, and general desktop computing duties. Alongside
    the apps are pre-loaded modules to help you get the most from it, including of
    programming languages you decide to learn and use, as well as hardware modules
    that will enable you to power and use the hardware items unique to the Pi. For
    example, there are Python modules that interact with the Raspberry Pi''s 40 GPIO,
    allowing you to create content for any of the Hardware Attached on Top (HAT) devices.


    This combination is what makes the Raspberry Pi an excellent base of operations
    to learn not only coding, but also Linux in. Raspian, being Debian-based, will
    be able to run any of the Terminal commands listed in this book, as Linux, Mint,
    and Ubuntu are also Debian-based. And since it goes, costs very little setup,
    you''ll be able to have both regular, Windows or macOS computers, and have a Raspberry
    Pi a headless (a powered device that doesn''t need a keyboard, or monitor attached,
    as you can connect to it) computer from which you can connect and learn how to
    use Linux and how to code.


    ![](img/383b23573296234863a9f25dc7161abc_77_1.png)


    # Pi x Linux = The Perfect Combination


    ## WHICH PI?


    There are several Raspberry Pi models available, with each offering slightly different
    from the others. The most recent Pi released is the Raspberry Pi 3 B+, and while
    this model is slightly more expensive than some of the other examples, it is the
    most powerful and feature-rich Pi.


    Overall, it''s probably best to start experimenting with the Pi using the Raspberry
    Pi 3 B+, then moving to one of the other models as you develop your skills and
    focus on a particular project, such as the need to use one of the Pi Zero models,
    with a smaller footprint and WiFi connectivity.


    ![](img/383b23573296234863a9f25dc7161abc_78_0.png)


    ## BEYOND RASPIAN


    ## PI, LINUX AND CODING


    The flexibility of the Raspberry Pi''s ARM processor means that it''s capable
    of running other operating systems like Debian. Still keeping with Linux, you
    can install Ubuntu Mate, Pidora (a Fedora-based distribution), Lakka, PiPlay (a
    retro emulation distribution) and Arch Linux. There are also systems based loosely
    on the Linux kernel, such as RetroPie, Amiga OS clone.


    As previously mentioned, the Raspberry Pi is an excellent code base, and with
    Linux as the backbone you''re able to start learning how to code in a multitude
    of different programming languages. Python is perfectly suited here, since Raspberry
    Pi is Linux, and you can easily expand your scripts to encompass much of the Raspberry
    Pi functionality. From creating backup scripts, you can create scripts that access
    the GPIO pins on the Pi, and in order to be able to control LEDs, and even make
    hardware projects. Once you''ve finished experimenting with one version of Linux,
    just as you would with desktop, you can hop to another on the Raspberry Pi and
    see how that works. C++ is one of the most powerful languages to learn. It''s
    used for games, and even operating systems.


    ![](img/383b23573296234863a9f25dc7161abc_78_1.png)


    ## Command Line Reference


    When you start using Linux full time, you will quickly realise that graphical
    interfaces of Ubuntu, Mint, etc., are great for many tasks but not for all. Understanding
    how to use the command line not only builds your understanding of Linux but also
    improves your knowledge. Our command line quick guide is designed to help you
    master Linux quicker.


    ### TOP 10 COMMANDS


    These may not be the most commonly used by everyone but will certainly feature
    frequently for many users of Linux and the command line:


    - cd: The cd is one of the commands you will use most to change your working directory.
    Use it to move around within the hierarchy. You can also use cd.

    - mv: The mv command moves a file to a different location or renames it. If you
    must specify a new name to rename it, mv file ~/Desktop moves the file but does
    not rename it.

    - ls: The ls shows the files in your current directory. With certain options,
    it lets you see sizes, file permissions. For example ls -l shows the files in
    your home directory.

    - chmod: The chmod changes the permissions on the files listed. Permissions are
    based on a simple model. If only one owner (numeric ID) is given, it changes the
    owner of each file, and the group is not changed.

    - cp: The cp command is used to make copies of files and directories. For example,
    cp file makes a copy of the file entered and the first will still exist with its
    original name.

    - pwd: The pwd command prints the full pathname of the working directory (pwd
    stands for “print directory”). Terminal also displays this in the title bar.

    - rm: The rm command deletes) files and directories. The removal process unlinks
    a file from a filesystem and marks space as usable by future times. In other words,
    removing files increases the amount of available space on your disk.

    - clear: The clear clears your screen if you are in the environment of the terminal
    and then in the terminfo database figure out how to clear the screen. It is equivalent
    to typing Control-L using the bash shell.

    - mkdir: Short for “make directory”, mkdir is used to create directories in a
    file system, if the specified directory does not exist. For example, mkdir creates
    a work directory. More than one directory may be specified when calling mkdir.


    ## USEFUL HELP/INFO COMMANDS


    The following commands are useful when you are trying to learn more about the
    system or program you are working with in Linux. You might not need them every
    day, but when you do, they will be invaluable.


    - free displays the total amount of free and used physical and swap memory in
    the system. For example, free -m gives information in Megabytes.

    - sed opens a stream editor. A stream editor is used to perform transformations
    on an input stream: a file or input from a pipeline.

    - df displays filesystem disk usage for all partitions. The command df -h is the
    most useful (the -h means human-readable).

    - adduser adds a new user to the system. Similarly, the addgroup command adds
    a new group to the system.

    - top provides a real-time view of a running system. It can display system information,
    as well as a list of processes.

    - useruser removes a user from the system. To remove the user''s files and home
    directory, you need to add the -remove-home option.

    - uname command with the -a option prints all system information, including machine
    name, kernel version, and a few other details.

    - delgroup command removes a group from the system. You cannot remove a group
    that is the primary of any users.

    - ps command allows you to view all processes running on the machine. Every operating
    system''s version of ps is slightly different but all do the same thing.

    - man command brings up the manual entry for a man command, which is a great place
    to start when using it.

    - grep command allows you to search inside a number of files for a particular
    pattern and then print matching lines. An example would be: grep blahh file

    - man intro command is especially useful. It introduces you to the User Commands,
    which is a well written, fairly brief introduction to the Linux command.


