    # Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let’s see
    what the Cinnamon desktop has to offer.


    ## A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There’s
    lots to know about it, which is why it’s a popular DE.


    - **STEP 1** Begin exploring the Cinnamon by double-clicking the Computer icon.
    This brings Nemo, the file manager used in Cinnamon. The Computer icon opens the
    root level file system, with access and views to the optical drive (if you have
    one installed), hard drive and core Linux file system.

    - **STEP 2** The Linux file system can appear confusing to a former Windows user,
    until you’re a bit more knowledgeable about how it all works, we’d recommend concentrating
    on the Home icon on the desktop. In here is everything relating to your user account:
    where you store Pictures, Videos, Music, Documents, Downloaded items etc.

    - **STEP 3** Nemo has many different features, views and ways that you can view
    and manage files and folders. For example, if you have any images in the Pictures
    folder, you can select the zoom level for the images using the slider located
    in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/383b23573296234863a9f25dc7161abc_31_0.png)

    - **STEP 4** Just like any good manager, if you right-click any of the files or
    folders within you get a wealth of options. In the case of Cinnamon, the default
    allows you to view a file depending on what type of file it is and copy, cut,
    delete, compress, rename, send via email and view it its properties.


    ![](img/383b23573296234863a9f25dc7161abc_31_1.png)


    - **STEP 5** At the bottom of the desktop there''s the Panel, We''ve already looked
    at one of the Panel, the Menu. If you right-click anywhere on the Panel, other
    than on an App, you see a menu allowing to edit, and add it to the Panel in a
    different way.

    - **STEP 6** For example, if you click the option Modify Panel, Add a new one
    and clear it of Applets that are currently present. Remove the Panel, add an Applet,
    by the way, an app that''s designed to work and fit into the Cinnamon Panel.

    - **STEP 7** If right-click on Cinnamon you see a set of options that allows you
    to further add, edit or view the desktop content differently. It''s very similar
    to that of Windows, which is why Mint is a good choice for ex-Windows users. (If
    right-click on Cinnamon you see a set of options that allows you to further add,
