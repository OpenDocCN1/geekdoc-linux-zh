    # 编码与编程


    Linux 无处不在。它作为 Web 服务器背后的主操作系统驱动着互联网，它驱动着航天器，它是世界上最快超级计算机的操作系统，并被用于智能电视和移动设备。为什么呢？因为它极其稳定、运行极快，而且完全免费。


    然而，Linux 不仅仅是一个免费使用的操作系统。。它独特的配置允许用户将操作系统定制并个性化为他们喜任何形式。Linux 用户可以在一天之内改变操作系统的外观和感受，安装成千上万免费提供的应用程序和程序，并夺回对电脑的控制权。


    Linux 关乎自由。不受其他限制性操作系统的“围墙花园”模式限制，自由地在电脑上选择你想要的内容，随心所欲地修改和使用它。这是一个由志同道合的用户组成的全球社区，他们致力于从这个不可越的操作系统中获得最佳开发。


    通过这本书，你可以成为 Linux 用户开放社区的一部分。书中的教程将帮助你掌握 Linux，向你展示它的原理，你可以用它做什么，以及你如何通过编写代码来将你的
