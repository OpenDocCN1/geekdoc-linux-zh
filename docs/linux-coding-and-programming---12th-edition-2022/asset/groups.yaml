    lag in performance.


    ![](img/383b23573296234863a9f25dc7161abc_34_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_34_2.png)


    STEP 7 At this point you will probably need to restart Linux Mint, so do not after
    a reboot click the Terminal button. The Terminal is found in the left-hand column;
    open the Files. Now open the Terminal, enter: sudo apt-get install libdva-pkg
    press Enter and type in your password. This enables decrypted video playback.


    STEP 10 Security is always a concern in this modern age. Linux Mint is a secure
    system, it is advisable to always try and improve it. Click the Menu button and
    search for Firewall; click the Firewall Configuration.icon and enter your password.
    In the Firewall window, click the Status slid to On.


    ```

    File Edit View Search Terminal Help

    daviddavid-mint ~ sudo apt get install libdva-pkg

    (sudo) password for david:

    ```


