  mdcn: "\n\n# 你将需要的设备\n\n在 PC 上成功安装 Linux Mint 的系统要求出奇地低，即使是几年前的电脑也能轻松地运行这个发行版。然而，在继续之前，检查你是否已经准备好一切是值得的。\n\
    \n# MINTY 配材料\n\n在我们开始阅读这本书之前，这里是你安装和运行 Linux Mint 所需的配置。你有多种选择，请花些时间看看哪种最适合你。\n\
    \n# 系统要求\n\n+ Linux Mint 的最低系统要求如下：\n\n* **CPU** – 700MHz\n* **RAM/内存** – 512MB\n\
    * **硬盘空间** – 9GB（推荐 20GB）\n* **显示** – 1024 x 768 分辨率\n\n显然，你的系统越好，体验就会越好，速度也越快。\n\
    \n# USB 安装\n\n你可以通过 USB 或 DVD 在你的电脑上安装 Linux Mint。我们稍后会详细介绍每种方法，如果你已经熟悉流程，只需考虑\
    \ USB 并收集所需的硬件，那么你至少一个 4GB 的 USB 闪存盘来存储 Linux Mint ISO 镜像。\n\n![](img/383b23573296234863a9f25dc7161abc_11_0.png)\n\
    \n# DVD 安装\n\n使用 DVD 安装 Linux Mint 只需一张空白的 DVD+ 光盘。当然，在将 ISO 镜像传输或刻录到磁盘之前，你还需要一个光驱（DVD\
    \ 刻录机）。\n\n![](img/383b23573296234863a9f25dc7161abc_11_1.png)\n\n![](img/383b23573296234863a9f25dc7161abc_11_2.png)\n\
    \n# 虚拟机\n\n安装到虚拟环境中是测试和使用 Linux 发行版的喜爱方法。Linux Mint 在虚拟环境中运行效果非常好，但稍后会详细介绍。有很多虚拟环境应用可用；其中，Oracle\
    \ 的 VirtualBox 是最容易安装的。你可以在 www.virtualbox.org 找到最新版本。\n\n![](img/383b23573296234863a9f25dc7161abc_12_0.png)\n\
    \n# 网络连接\n\n不而喻之，网络连接对于确保 Linux Mint 保持最新更新和补丁以及安装更多软件至关重要。虽然使用 Linux Mint 不需要网络连接，但你将错过该发行版所提供的大量免费软件。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_12_1.png)\n\n# MAC 硬件\n\n虽然 Linux Mint\
    \ 可以安装在 Mac 上，但有一种观点建议 Mac 所有者使用虚拟环境，例如 VirtualBox 或 Parallels；而且况何呢，macOS 已经是一个很出色的操作系统了。如果你想为旧\
    \ Mac 注入新生命，请确保它是 Intel CPU 型而不是 Power PC 型号。不过要注意，这并不像在 PC 上安装那样轻松。\n\n![](img/383b23573296234863a9f25dc7161abc_12_2.png)\n\
    \n# 桌面环境\n\nLinux Mint 有几个不同的版本，或称为“口味”：Cinnamon、MATE 和 Xfce；这些版本也有 32 位和 64 位之分。但这一切意味着什么，你安装时应该选择哪个版本呢？\n\
    \n# 哪哪种 MINT？\n\n桌面环境（Desktop Environment）是你用于与 Linux 系统交互的图形界面。正如 Windows 10\
    \ 的图形桌面也被称为 Fluent Design 一样，Linux Mint 为用户提供了多种版本：Cinnamon、MATE 和 Xfce。虽然这对于初学者来说可能有些困惑，但每个版本包含相同的\
    \ Linux 结构和内核，内核是系统的核心，处理所有指令。每个版本都是不同的桌面环境，即你用于与操作系统交互的图形用户界面 (GUI)。每个桌面环境使用不同的应用程序来访问系统，文件管理器来浏览系统结构或启动方式。再次，核心生产力、视频和图形套件是相同的，功能也相同。为什么要尝试不同的桌面环境？简单来说，取决于个人喜好。有些用户偏爱\
    \ MATE，它是经典 GNOME 2 环境的分支，更加传统，并在旧电脑上运行良好。另一些用户偏喜欢 Cinnamon，它是一个运行良好的现代环境。Xfce\
    \ 是一个由于资源占用极低而在旧硬件上运行的轻量级桌面环境。简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。在 Windows 只提供一种桌面环境工作的情况下，Linux\
    \ Mint 则为用户带来了丰富的选择。\n\n![](img/383b23573296234863a9f25dc7161abc_13_0.png)\n\n\
    # Cinnamon\n\nCinnamon 在外观和感受之外许多优点，尽管这些也是重要的因素。在这里，我们列出几个功能来帮助你判断它是否适合你。\n\n\
    ### 特性 1\n它在现代系统上表现出色，但比以前稳定得多，不再那么消耗资源。因此，如果你在使用旧电脑安装和测试 Linux Mint，不要错过 Cinnamon。\n\
    \n### 特性 2\nCinnamon 具有热角（Hot Corners），桌面的每个角都可以点击执行特定任务，如显示工作区或运行命令。热角在不同视图之间切换效果很好，有助于桌面更高效。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_14_0.png)\n\n# 最佳 MATE\n\nMATE 简单易用且直观。与\
    \ Cinnamon 相比，它看起来有些过时，但这只是表面。MATE 有许多受欢迎的地方。\n\n### 特性 1\nMATE 是旧电脑的极佳桌面环境。它比\
    \ Cinnamon 兼容更多的硬件组件，但同样能够提供精美的桌面以及高级定制。\n\n![](img/383b23573296234863a9f25dc7161abc_14_1.png)\n\
    \n### 特性 2\n由于其高度可配置性，MATE 可以进行很大程度的定制。对于对桌面环境有更高要求的的用户，有很多可用选项，包括 Compiz 设置，你可以在配置各种桌面效果，甚至是\
    \ 3D 立体。\n\n# 无胆固醇桌面\n\nXfce 起于 1996 年的通用桌面环境 (CDE)。从那时以后它改变了几次，现在简单称为 Xfce，绰号为“胆固醇环境”。\n\
    \n### 特性 1\nXfce 确实是一个快速的桌面，并发挥了 Linux 作为足够快速系统的最佳性能。事实上，从页面顶部开始将其安装到新电脑，我们只到了这一点；写了几百字，我们就在使用新的操作系统了。不坏。\n\
    \n### 特性 2\n仅仅因为它快速且轻量，并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。就像提供的其他环境一样，你可以获得最新的\
    \ Firefox、VLC、Gimp、聊天应用甚至下载客户端。\n\n![](img/383b23573296234863a9f25dc7161abc_14_2.png)\n\
    \n# 哪种发行版？\n\n到为止我们查看了 Linux Mint，但还有其他的 Linux 发行版可以尝试。事实上有数千个 Linux 发行版可以下载安装，所以你应该决定使用哪一个？\n\
    \n# 发行版跳转 (Distro Hopping)\n\n发行版跳转是社区用来形容那些从固定单一发行版的人的术语。相反，他们在它们之间跳跃，测试每一个；使用它们，从一个移动到新发布的发行版。\n\
    \n发行版跳转没有问题，它是熟悉现有内容的好方法，并发现某个发行版中可能或不符合你口味的元素。问题当然是，你使用哪一个？\n\n![](img/383b23573296234863a9f25dc7161abc_15_0.png)\n\
    \n例如，Linux Mint 是一个理想的起点。它是一个易于安装和使用的发行版，开箱即用包含了你日常所需的所有软件，并温和地引导你。\n\nUbuntu\
    \ 提供了相同的体验，但它的方式略有不同。除非你自己安装，否则 Ubuntu 的压力通常较小。另一点是装饰有 Ubuntu 用户的帮助页面内容海量：如果你遇到困难，你离解决方案并不远。\n\
    \n继续，当你开始熟悉 Linux 时，你可能会测试 Fedora。这些都是出色的发行版，但在 Linux 方面要求不同。虽然发行版跳转是好的，可以让你从中获得最大价值，但说你应该固定在一个发行版并错过很多丰富内容。例如，Tails\
    \ 是为了匿名而设计的发行版。Kali 包含了许多黑客工具。\n\n| PID | USER | %MEM | VSZ | RSS | S | TIME |\
