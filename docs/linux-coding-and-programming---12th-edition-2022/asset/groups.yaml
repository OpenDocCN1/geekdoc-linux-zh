    # Linux: the operating system with Command Line Environment


    The Linux command line, Terminal, is an incredibly powerful environment. From
    it you can bring the OS to its knees, or update it to something spectacular. You
    can hack into remote computers, look at ASCII art, install new apps and programs
    from the server, and code scripts. In this section you will explore the intricacies
    of the Terminal, and how it works with Linux. You will learn how to manipulate
    the Linux system from the Terminal, and you will discover some odd but fun things
    you can do in the Terminal.


