    USB media is faster than DVD and often more convenient, as modern PCs don''t have
    optical drives.


    ![](img/383b23573296234863a9f25dc7161abc_20_0)


    ### STEP 1

    Open the Rufus website. Scroll down to find the latest version and click on the
    download link.


    ![](img/383b23573296234863a9f25dc7161abc_20_1)


    ### STEP 2

    Run the downloaded Rufus and check for updates. With Rufus started it should already
    identify your flash drive; if not, remove and restart.


    ![](img/383b23573296234863a9f25dc7161abc_20_2)


    ### STEP 3

    At the first launch Rufus can look a little confusing but dont worry, it''s quite
    simple. To begin with, click the SELECT button ''Disk or Image (Please select)''
    pull-down menu. This will launch a Windows explorer where you can locate and select
    the ISO.


    ![](img/383b23573296234863a9f25dc7161abc_20_3)


    ### STEP 4

    The next steps ask which mode you want to use for this image, but the recommended
    ISO Image is more popular.


