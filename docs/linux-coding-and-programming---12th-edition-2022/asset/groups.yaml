    # Getting Started with Linux


    ## Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine
    (VM) takes resources from your computer: memory, hard drive space, processor and
    so on. It can mimic a standard PC and install any operating system to it without
    affecting one installed on your computer. It''s a great way to test and use Linux
    while still having Windows 10 as your main OS. Make sure you have enough.


