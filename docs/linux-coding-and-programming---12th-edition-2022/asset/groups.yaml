    virtual environments to get with. Enter www.virtualbox.org and click on ''Download''.
    This takes you to the main download page. Locate the correct host for your system
    (Windows, macOS, Linux operating system) and click the link to begin the download.

    - **STEP 2** Next, while you visit the VirtualBox download page, locate the VirtualBox
    Extension Pack link. Extension packs support USB devices as well as numerous extras
    that help make the VM environment.

    - **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure the computer you''re using is able to host a VM. To do this,
    reboot the computer and enter the BIOS. When the computer starts up, press Del,
    F2 or whichever is key to Enter Setup.

    - **STEP 4** Each BIOS is laid out differently and it''s very difficult to assess
    where to look. However, as a rule of thumb, you''re looking for Virtualisation
    technology, or simply Virtualisation, found within the Advanced section. When
    you enable it, save the settings and reboot your computer.

    - **STEP 5** With the computer back up and running, locate the downloaded VirtualBox
