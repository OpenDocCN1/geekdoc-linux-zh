    ## Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    ### DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC to transfer the ISO to a DVD. If you''re using a
    version of Windows 7 onward the process is extremely easy.


    - **STEP 1**: First locate the ISO image of Linux you''ve already downloaded.
    You can usually find it in Downloads Folder in Windows 7, 8 and 10 computers,
    unless you specify a different location when saving it.

    - **STEP 3**: Right-click the Linux ISO and from the menu select Burn Disc Image.
    Depending on the speed of the PC, it may take a few seconds before anything happens.
    Don''t worry much, unless it takes more than a minute, in which case it might
    be worth restarting your PC and trying again. With luck, the Windows Disc Image
    Runner will launch.


    ![](img/383b23573296234863a9f25dc7161abc_19_0.png)


    - **STEP 2**: Next insert a recordable DVD disc into your computer''s optical
    drive. After a few seconds, while the disc is read, Windows displays a pop-up
    message asking what to do with the newly inserted disc. Ignore this, as we''re
    going to use the built-in image burning function.

    - **STEP 4**: With the Windows Disc Image Runner dialogue box open, check the
    ''Verify'' box, then the burning process will take a few seconds. When it completes,
    Rufus-eject the disc.


    ![](img/383b23573296234863a9f25dc7161abc_19_1.png)


