    >>> type(age)\n'int'\n>>> name = \"Descended from Vikings\"\n>>> age = 44 old\n\
    >>> type(age)\n'int'\n>>> print(name + \"age\")\nTraceback (most recent call last):\n\
    \  File \"stdin>\", line 1, in <module>\nTypeError: Can't convert 'int' to 'str'\
    \ implicitly\n```\n\n# STEP 8\n\nThis presents a bit of a problem when you want\
    \ to work with a number that's been inputted by the user, or age + 10 won't work\
    \ because being a string and integer. Instance, you need to:\n\n```\nint(age)\
    \ + 10\n```\n\nThis will Typecast the age to an integer that can be worked.\n\n\
    ![](img/383b23573296234863a9f25dc7161abc_106_0.png)\n\n| Edit | Shell | Debug\
    \ | Options | Windows | Help |\n|---|---|---|---|---|---|\n\n```\nPython 3.4.2\
    \ (default, Oct 19 2014, 13:01:11)\n>>> GCC (4.3.0) on linux\n>>> type \"credits\"\
    \ or \"license\" for more information.\n>>> age = \"44\"\n>>> type(age)\n'str'\n\
    >>> age + 10\nTraceback (most recent call last):\n  File \"stdin>\", line 1, in\
