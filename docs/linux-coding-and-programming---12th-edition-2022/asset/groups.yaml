    ```\n\n# STEP 6\n\n```\nprint (character + \" is \" + str(age) + \" years old\"\
    )\n```\n\nThis is a process called Typecasting. The Python code is:\n\nNotice\
    \ that in the last example, you don't need the spaces between the words in quotes\
