    ## Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    ## CREATING THE VM


    There are plenty of options to choose from creating a VM. For now, let''s set
    up a VM adequate to run Mint Cinnamon and perform well.


    **STEP 1** With VirtualBox open, click on the New icon in the top right of your
    app. This opens the New Wizard.


    **STEP 3** The next section defines the amount of system memory, or RAM, the VM
    has allocated. This amount is taken from the available memory installed on your
    computer, so don''t give the VM too much. For example, we have 8GB of memory installed
    and we give 2GB to the VM. When you''re ready, Next to continue:


    ![](img/383b23573296234863a9f25dc7161abc_25_0.png)


    **STEP 2** In the next box to Name, type Linux Mint and the Ubuntu (64-bit) as
    Version; if not then use the drop-down boxes to select the correct settings (remember
    Mint is based on Ubuntu). Click Next when you''re ready to proceed.


    **STEP 4** This section is where you start to create the virtual hard that the
    VM uses to install on. The default option, ''Create a virtual hard disk'', is
    the one we''re using. Click Create to move on:


    ![](img/383b23573296234863a9f25dc7161abc_25_1.png)


    **STEP 5** The pop-up window appears after clicking Create is asking you what
    virtual hard disk you want to create. We''re going to use the default VDI (VirtualBox
    Disk Image) in this case, as the others are used to move VMs from one VM to another.
    Make sure VDI is selected and click Next.


    **STEP 8** After Creating the initial setup of the VM is complete; you should
    now be looking at the newly created VM within the VirtualBox Application. Before
    you begin, click the Settings button and within the General section click the
    Advanced drop-down, then select ‘Bidirectional’ for shared Clipboard and Drag
    ’n Drop.


    ![](img/383b23573296234863a9f25dc7161abc_26_0.png)


    **STEP 6** The question of whether to use Fixed or sized virtual hard disks may
    come as confusing to the novice: A Dynamically Allocated virtual hard disk is
    a more flexible management option and won''t take up much space within your hard
    disk. Ensure Dynamically Allocated is selected and click Next.


    **STEP 9** Follow by clicking on the System section, then the Processor. Allocate
    as many cores as you can afford to your host system; we''ve opted for 2 CPUs.
    Now on the Display section, select the Video Memory and click ‘Enable 3D Acceleration’.
    OK to commit to the next step.


    ![](img/383b23573296234863a9f25dc7161abc_26_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_26_2.png)


    **STEP 7** The virtual hard disk is a single folder, up to the size you want to
    specify in this section. The location on your computer should have enough free
    space available. For example, we used a bigger storage option on our D: drive,
    named it Linux Mint and allocated 25.50GB to the virtual hard disk.


    ![](img/383b23573296234863a9f25dc7161abc_26_3.png)


    **STEP 10** Click on the Start button and use the explorer (a folder with green
    arrow) in the ‘Start-up’ window to locate the downloaded ISO of Mint, click start
    to boot the Linux Mint Live Environment. Now can install Linux as per standard
    installation requirements.


    ![](img/383b23573296234863a9f25dc7161abc_26_4.png)


    ![](img/383b23573296234863a9f25dc7161abc_26_5.png)


    ## Getting to Know Linux


    > "Anyone can build a fast processor. The trick is to build a fast system." —
    Seymour Cray (Electrical Engineer, and founder of Supercomputers)


    ![](img/383b23573296234863a9f25dc7161abc_27_0.png)


    ![](img/383b23573296234863a9f25dc7161abc_28_0.png)


    We''ve used Linux Mint as a guideline, as it''s an easy to use distro for Windows
    users. It''s also one of the most developed and well documented distros as well
    as having fantastic options. In this section, we introduce the Linux Mint Menu
    and Desktop, how it works and what you can do to. Want to create another user
    or discover how to become online? Then read on.


    | Page | Topic |

    |---|---|

    | 30 | Introduction to the Cinnamon Menu |

    | 32 | Navigating the Cinnamon Desktop |

    | 34 | 10 Things to do After Installing Mint |

    | 36 | Did You Know... |

    | 38 | Creating Users |

    | 40 | Customising the Desktop |

    | 42 | Becoming Online |


    ## Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a good look around. First
    though if you''re using VirtualBox you''ll have a notification regarding Software
    Rendering; here''s how to fix it.


    ## CINNAM VIRTUALBOX FIX


    You''re already looked some functions, using insert, remove, but there are also
    functions that can be applied.


    **STEP 1** Before we begin, we''re assuming you''re having this within VirtualBox.
    To fix this, click on Devices in the top right of the desktop. In the VirtualBox
    window, followed by Insert Guest Additions CD.


    **STEP 3** After a moment or two you''re automatically dropped into a command
    line, called the Terminal. This details the installation of the new VirtualBox
    drivers, removing any old drivers it has detected, and installing the latest version.
    It won''t take long when it''s done you will be asked to restart the terminal.


    ![](img/383b23573296234863a9f25dc7161abc_29_0.png)


    ```

    File Edit Search Terminal help

    verify software integrity.

    Uncompressing VirtualBox-1.2 Guest Additions for Linux...

    Installing VirtualBox Additions...

    Copying additional modules...

    vboxguest.sh: Starting the VirtualBox Guest Additions.

    Press return to close this window.

    ```


    ![](img/383b23573296234863a9f25dc7161abc_29_1.png)


    **STEP 2** The Guest Additions CD contains drivers for VirtualBox, including the
    virtual hardware. When it''s loaded in, you''ll get a ''software needs running''
    box with two options, Cancel and Run. Click the Run button and enter your Linux
    password.


    **STEP 4** The VirtualBox Additions CD is on the desktop, so right-click it and
    then scroll down to the menu. You can now restart Linux by clicking the Mint,
    the bottom icon in the left, the Restart button. This reboots the Mint and the
    problem is fixed.


    ![](img/383b23573296234863a9f25dc7161abc_29_2.png)


    ![](img/383b23573296234863a9f25dc7161abc_29_3.png)


    ## Introduction to the Cinnamon Menu


    Now the Software Rendering Issue for VirtualBox is out of the way, let''s take
    a look at the Mint Menu and how it all works. Remember, this is just Mint Cinnamon,
    other distros look and behave differently.


    **STEP 1** First, you have already noticed the Welcome Screen that pops up when
    you login to Linux Mint. Take a moment to browse through the options, read the
    First Steps option and so on. When you do, click the X in the top corner of the
    window to close it.


    ![](img/383b23573296234863a9f25dc7161abc_30_0.png)


    **STEP 4** Open the Menu again but this time hover the mouse pointer over Graphics,
    then click on GNU Image Manipulation Program. GIMP is a powerful manipulation
    app that''s probably as effective as Adobe Photoshop but requires a little more
    work to get the results you want. It''s certainly worth the time to master, though.


    **STEP 2** You''ve already used the Mint to reboot the system and when you first
    used the Live Environment, click the Menu and hover over the Office entry in the
    middle column. This changes the icons represented in the right-hand column, detailing
    what apps are installed under that section.


    ![](img/383b23573296234863a9f25dc7161abc_30_1.png)


    **STEP 5** If you''re looking for a particular function or app, such as setting
    up a printer, click on the Search box at the top of the Menu. Start typing the
    app or function you want, such as, and the Mint Menu displays the relevant options
