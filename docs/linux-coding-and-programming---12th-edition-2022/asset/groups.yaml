    - **步骤 8** 你可以保存文件，点击文件 -> 保存，回到终端。

    - **步骤 9** 输入 `ls` 后，你可以看到 `helloworld.sh` 现在已经从蓝色变成了绿色。

    - **步骤 10** 将 `echo` 视为打印命令。它显示文本，例如当前日期。尝试示例：`echo Hello World! $(date)`。


