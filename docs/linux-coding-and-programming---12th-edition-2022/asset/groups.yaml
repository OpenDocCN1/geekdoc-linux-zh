- md: "\n# Creating Bash Scripts - Part 4\n\nOne of the most well used examples of\
    \ Bash scripting is the creation of a backup routine, that automates the task\
    \ as adding some customisations along the way.\n\nA basic backup script would\
    \ look something along the lines of: `/bin/bash, then tar cvzf~/backups/my-backup.tgz\
    \ ~/Documents/.`. This will create a compressed file of the ~/Documents folder,\
    \ with everything in it, and put it in a folder named /backups with my name-backup.tgz.\n\
    \n### STEP 4 Once the /backups folder is created, we can now create a new subfolder\
    \ within it at the beginning. Add `mkdir -p $DEST/$day $Month $Year*`. It's here\
    \ that you put the backup file relevant to date/month/year.\n\n```bash\n#!/bin/bash\n\
    # time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\n# Folders\n\
    dest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n  echo \"Backup\
    \ folder does not exist! I am now creating it...\"\n  mkdir -p $dest\nfi\n\ntar\
    \ -cvzf $dest/$day$month$year.tgz $source\necho \"Backup done!\"\n-s\n```\n\n\
    ### STEP 2 While perfectly fine, we can make the script better with some variables.\
    \ Enter the text in the screenshot into a new bash script. Note that we've misspell\
    \ 'sauce' as 'as', this is because lately an error in basic command 'source' will\
    \ cause something different on our part.\n\n### STEP 5 With everything in, you\
    \ can now enter the actual backup routine, on the tar command from Step 5. Combined\
    \ with the variables, you have to use `cvzf $dest/$day$month$year/Documents.Backup.tgz`.\
    \ In the screenshot, we added a handy \"Backing up...\" message.\n\n```bash\n\
    #!/bin/bash\n# time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\
    \n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n \
    \ echo \"Backup folder does not exist! I am now creating it...\"\n  mkdir -p $dest\n\
    fi\n\ntar -cvzf $dest/$day$month$year.tgz $source\necho \"Backup done! Please\
    \ wait...\"\n-s\n```\n\n### STEP 3 The previous script allows you to create a\
    \ Time Stamp, so you know when the backup was made. You created a 'dest' variable,\
    \ which is where the backup file will be created (~/backups). You can add a line\
    \ of code to check if ~/backups folder exists, if then creates it.\n\n```bash\n\
    #!/bin/bash\n# time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\
    \n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n \
    \ echo \"Backup folder does not exist! I am now creating it...\"\n  mkdir -p $dest\n\
    fi\n\ntar -cvzf $dest/$day$month$year.tgz $source\necho \"Backup done! Please\
    \ wait...\"\n-s\n```\n\n# Creating Bash Scripts – Part 5\n\nThe backup script\
    \ we looked at previously can be amended to incorporate choices, user-interaction\
    \ with regards to where the backup file will be copied to so on. Automating tasks\
    \ is one of the main benefits of Bash scripting, a simple script can help you\
    \ out in many ways.\n\n## EASY AUTOMATION AND HANDY SCRIPTS\n\nEntering line after\
    \ line of commands to retrieve system information, a file or rename a batch of\
    \ files? A script is better answer.\n\n- **STEP 1** Let's try by creating a script\
    \ to display the Mint system information; always a thing to have. Create a new\
    \ script called sysinfo.sh and enter the into Zed, or the text editor of your\
    \ choice.\n\n```bash\n# sysinfo x\n# information:\nhostname:\necho $(hostname)\
    \ | grep HOSTNAME\n\n# file disk space usage\necho $(df -h) | grep DISK SPACE\n\
    \n# free and used memory\necho $(free -m)\n\n# update and performance load\necho\
    \ $(uptime) | grep \"load\"\n\n# users currently logged in\necho $(who) | grep\
    \ USERS\n\n# Top five processes used by the system\nps aux | sort --%mem | head\
    \ -n 5\n```\n\n- **STEP 3** Each of the sections runs a different Terminal command,\
    \ outputting the results amended. You can include a lot more, such as the current\
    \ aliases used in the system, the current time and date to on. Plus, you could\
    \ also pipe all information into a handy HTML file, ready to be viewed in a browser.\n\
    \n```bash\ndavid@david-mint ~/scripts $ > sysinfo.html\ndavid@david-mint ~/scripts\
    \ $\n```\n\n![](img/383b23573296234863a9f25dc7161abc_75_0.png)\n\n- **STEP 4**\
    \ Although there are some Terminal commands to help you look for a particular\
    \ file or folder, it's often more to create a script for it. Plus, you can use\
    \ that for non-technical users. Create a new script called look4.sh, enter it\
    \ from the screen below.\n\nWe've included a couple of extra commands in this\
    \ script. The first is –the extension for echo, this'll enable echo interpretation\
    \ of additional instances of a new line, as well as special characters. The proceeding\
    \ \\31;33m enables.\n\n```bash\ndavid@david-mint ~/scripts $\nStatic:\nClass:\n\
    Machine:\nArchitecture:\nOperating System:\n```\n![](img/383b23573296234863a9f25dc7161abc_75_0.png)\n"
  mdcn: "\n\n# 创建 Bash 脚本 - 第 4 部分\n\nBash 脚本最常用的示例之一是创建备份例程，它可以实现任务自动化，并在过程中添加一些自定义功能。\n\
    \n一个基础的备份脚本看起来类似于：`/bin/bash, 然后执行 tar cvzf~/backups/my-backup.tgz ~/Documents/.`。这将为\
