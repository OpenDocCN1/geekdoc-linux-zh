    # 在 PC 上安装 Linux


    大多数 Linux 发行版都带有实机环境（Live Environment）。这意味着你可以直接从创建的 DVD 或 USB 盘启动一个真实的、功能完全的发行版。让我们来看看它是如何工作的，以及你如何从那里安装
    Linux。


    ## UEFI BIOS


    统一可扩展固件接口（UEFI）用于在 PC 启动过程中识别并保护。它取代了传统的 BIOS，但在安装 Linux 时可能会引起问题。


    - **第 1 步** 将你的 USB 或闪存盘插入 PC，如果尚未关闭，请关闭 Windows。在本例中我们使用的是 USB 介质，但过程在视觉上是相同的。启动
    PC 并按照提示按键进入 BIOS 或 SETUP，按键可能是 F2、Del 或 F12。

    - **第 2 步** 不同的 UEFI BIOS 之间存在差异，因此涵盖所有情况是不可能的。你需要寻找说明启动顺序（Boot Sequence）或启动模式（Boot
    Mode）的部分。在这里你需要关闭 UEFI 并选择 Legacy 启动（Legacy Boot）。大多数带有 UEFI 的现代发行版直接安装时可能会有点棘。

    - **第 3 步** 将 UEFI 切换到 legacy 模式后，有方法进入实机环境。首先是通过你已经进入的 BIOS。找到启动顺序，并将第一个启动设备从原始设置（通常是
    Internal HDD 或类似设备）更改为：针对 USB 介质的 USB Storage Device，或针对介质选项的 DVD Drive。

    - **第 4 步** 也可以使用启动选项菜单（Boot Option Menu）。通过此菜单你可以按 F2（或类似的按键）显示启动介质选项列表；从那里你可以选择合适的启动介质。现在你可以导航到
    Save & Exit 选项并选择 ''Save and Changes'' 来保存更改并退出 BIOS。


    ![](img/383b23573296234863a9f25dc7161abc_21_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_21_1.png)


    # 安装 LINUX


    一旦实机环境启动，你就可以将发行版安装到你的电脑中了。环顾四周，当你准备好后，寻找桌面上的 Install（安装）选项。


    - **第 1 步** 只要你已连接网络（如果没有，请先连接）并处于实机环境中，双击桌面上的 Install Mint 图标开始安装过程。其他发行版显示它们的名称，但过程是相同的。准备好后点击
    Continue（继续）。

    - **第 2 步** 虽然大多数发行版的安装过程非常相似，但某些发行版在安装期间提供不同的问题。这些问题并不困难，不涉及复杂的技术，但诸如“安装”第三方软件可能会让人困惑。在这种情况下，你可以点击
    Continue，但如果你不确定，请准备好连接了网络的设备以询问任何问题。

    - **第 3 步** 安装新操作系统时，建议擦除旧操作系统并用新系统替换。当你到达安装过程的这一阶段时，确保选择了 ''Erase disk and install''（清除磁盘并安装）选项。注意：这将完全清除你电脑上的
    Windows 10，请确保你已备份了所有的个人文件和数据。

    - **第 4 步** 在安装过程开始之前，系统会询问你是否选择确保硬盘擦除是正确的。这是你退出的最后机会。如果你确定不介意擦除所有内容并开始 Linux
    Mint，点击 Continue。如果你需要备份文件，请重启 Linux 磁盘/USB 并重新开始。

    - **第 5 步** 最后，你会被要求设置用户名和密码。输入你的名字开始，以及 Computer Name（计算机名称），这是它在网络上的标识名称。接下来选择
    Username（用户名），然后是 Password（密码）。你可以勾选 Login Automatically（自动登录）选项，但暂时留留 Enter Home
    Folder（进入主文件夹）选项。

    - **第 6 步** 安装过程可能很快，可能只是根据你之前的答案进行安装。你最终将进入 Testing Live Environment（测试实机环境）或重启到新安装的操作系统。如果你已准备好使用
    Linux，点击 Restart（重启）。


    ![](img/383b23573296234863a9f25dc7161abc_22_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_22_1.png)

    ![](img/383b23573296234863a9f25dc7161abc_22_2.png)

    ![](img/383b23573296234863a9f25dc7161abc_22_3.png)

    ![](img/383b23573296234863a9f25dc7161abc_22_4.png)


    # 开始使用 Linux


    ## 安装虚拟机环境


    虚拟机是一个模拟的计算机系统。使用虚拟机（VM）会消耗你电脑的资源：内存、硬盘空间、处理器等。它可以模拟标准 PC 并在上面安装任何操作系统，而不会影响电脑上已安装的系统。这是在保留
    Windows 10 作为主操作系统的同时测试和使用 Linux 的极佳方法。确保你有足够的资源。


    - **第 1 步** 我们在本例中使用 VirtualBox。访问 virtualbox.org 并下载。

    - **第 2 步** 安装 VirtualBox。此外，还需要下载扩展包（Extension Pack）。访问 VirtualBox 官网下载对应的扩展包。

    - **第 3 步** 安装 VirtualBox，完成后重启电脑进入 BIOS。

    - **第 4 步** 在 BIOS 设置中启用虚拟化技术（Virtualization Technology）。

    - **第 5 步** 启动 VirtualBox。

    - **第 6 步** 创建新虚拟机，设置名称、类型和版本。

    - **第 7 步** 分配硬件资源（内存、处理器），并创建或选择一个现有的虚拟硬盘。

    - **第 8 步** 设置网络连接类型，确保虚拟机可以访问网络。

    - **第 9 步** 启动虚拟机并安装 Linux 系统。

    - **第 10 步** 虚拟机运行后，双击下载好的扩展包，点击 Next 并完成安装。


    ![](img/383b23573296234863a9f25dc7161abc_23_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_23_1.png)

