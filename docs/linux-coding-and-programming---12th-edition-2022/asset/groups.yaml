    # Update Mint via the Terminal


    Up to now you''ve been using the shield to launch Mint Update Manager in order
    to update the system and upgrade the currently installed apps, tools and other
    elements. **However, you can also accomplish a complete system update and upgrade
    from the Terminal.**


    ## USING APT-GET


    To update and upgrade the Terminal you use the APT (Advanced Packaging Tool) -
    it is a powerful command and combines different elements upon its use.


    - **STEP 1** Start by opening a Terminal or if you already have one open clear
    the clear command. This starts off with a clean slate to work on.

    - **STEP 2** Enter `apt-get` into the Terminal. This brings up a list of the most
    used apt-get commands, what it does. It''s worth having a look at, if it doesn''t
    make much of sense at this time.

    - **STEP 3** Apt-get is used to update and upgrade the software in Mint, as well
    as Ubuntu and Debian-based distros. Using the Update element retrieves new packages
    and lists the list of source files. Upgrade downloads and performs an upgrade
    to the latest versions of files. To start the Upgrade process, enter: `sudo apt-get
    update`, followed by your password.


    ![](img/383b23573296234863a9f25dc7161abc_47_0.png)


    - **STEP 4** Notice the addition of the sudo command. The sudo command needs Super
    User Do: Do it means the administrative user (super User) uses APT (Advanced Packaging
    Tool) to get Updates. Now you run: `sudo apt-get update`.


    ![](img/383b23573296234863a9f25dc7161abc_47_1.png)


    ```

    File Edit View Search Terminal Help

    $ apt 1.2 (ubuntu)

    $ apt-get (optional) command

    - install new packages [pkg]

    - install (apt-get install [pkg])

    - update update lists of packages and information from authorized sources with
    GPG keys

    - list lists of packages

    - upgrade perform an upgrade

    - upgrade install new and installed versions of packages

    - remove and purge config files

    - remove obsolete installed packages

    - dist-upgrade pull default selections

    - autoremove unused packages

    - clean remove old archive files

    - search for packages

    - download the binary package into the directory

    ```


    ```

    File Edit View Search Terminal Help

    $ apt-get update

    Building dependency tree

    Reading lists... Done

    Get1: http://security.ubuntu.com/ubuntu [182 KB]

    Get2: http://archive.ubuntu.com/ubuntu focal main [11.8 MB]

    Get3: http://archive.ubuntu.com/ubuntu focal universe [10.5 MB]

    Get4: http://security.ubuntu.com/ubuntu focal-security [11.5 KB]

    Get5: http://archive.ubuntu.com/ubuntu focal-updates [112.5 KB]

    Get6: http://archive.ubuntu.com/ubuntu focal-updates-security [11.5 KB]

    Get7: http://archive.ubuntu.com/ubuntu focal-backports [160 KB]

    Reading lists... Done

    ```


    # Update Mint the manually


    STEP 5 Depending on the state of your updates, if you have anything to install,
    if you want to apply the results of the sudo apt-get upgrade command, you can
    proceed and to continue. What is happening here is that apt-get has some update
    software to apply to Mint, and you''re asking it to recognize.


    STEP 7 Essentially, that''s your system is now up to date according to the available
    list of packages from the apt-get command. You can run it one more time, just
    if everything went wrong. Okay, type sudo apt-get update, press Enter, then type:
    sudo apt-get upgrade and press Enter.


    STEP 6 There''s likely a long list of things which differ from your version but
    don''t worry. The files for the upgrade have been downloaded, unpacked, processed,
    installed and set up correctly. There is a lot going on when you perform an upgrade,
    even with the smallest package.


    STEP 8 Interestingly, Mint, among others, offers you the chance to change many
    things easily. In this example, we use sudo apt-get update && sudo apt-get upgrade.
    The double ampersand (**&&**) tells the second command to wait until the preceding
    command has finished executing. It''s recommended to do so with every update and
    upgrade cycle.


    ![](img/383b23573296234863a9f25dc7161abc_48_0.png)


    # TERMINAL VS UPDATE MANAGER?


    Why use the Terminal to update and upgrade the Update Manager, regardless of the
    distro you''re using? Some users get comfortable using the Terminal to update
    their Linux systems and accompanying apps, in the belief that it''s better. However,
    that is not necessarily the case.


    Using the Terminal, apt-get doesn''t always handle changing dependencies between
    versions of packages, so if a package has its different dependencies from one
    version to another, the upgrade is held back.


    With changed dependencies for updating. However, this is how Linux can often get
    confusing, sometimes it doesn''t.


    It all down to the developer of the package being updated and the way it is in
    the holder''s repository, and whether that is sufficient for your needs. If you
    update and upgrade using both the Terminal and the Update regularly, then you
    will be up to date as possible, and get the essential and necessary stable versions.
    So, if you''re looking for cutting edge updates, then it''s best to opt for rolling
    distro. The Update Manager, or Software Manager, often opens these windows and
    marks those packages.


    # Using the Terminal


    ## Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using Software Manager, or you can use the Terminal. Often
    the Terminal provides better control over the software being installed and sometimes,
    you have no choice in the matter.


    Installing an app with the Terminal may require some keyboard work but get a better
    sense of what''s installed and where.


    ![](img/383b23573296234863a9f25dc7161abc_49_0.png)


    Installing apps from the Terminal is relatively simple. First, though you need
    to make sure the system is up to date. To this open the Terminal and enter: `sudo
    apt-get update && sudo apt-get upgrade`. Enter your password and accept any necessary
    updates.


    STEP 1 Just as you want to install more apps though, it is extraordinarily simple.
    First you need an app to install, let''s use `sudo apt-get install`.


    ![](img/383b23573296234863a9f25dc7161abc_49_1.png)


    STEP 2 Sometimes, when installing software, you need to add the app''s Repository.
    The repository, or repo, is the remote server where the software is installed,
    you can see along with all its dependencies (the vital libraries and stuff you
    need). To start, use this: `sudo add-apt-repository ppa:variety-team`. Press Enter
    when asked to add the PPA (Personal Package Archive).


    ## Install Apps via the Terminal - Part 1


    STEP 3 This adds the repo for Variety, and changes the Ubuntu-based app that Mint
    wallpapers automatically. When the repo is added, run `sudo apt-get update`, to
    update the new information and add contents of the repo package.


    STEP 4 Now to install Variety, enter: `sudo apt-install variety`. Press y to confirm
    and accept the installation. Once installed, you can type `variety` into the terminal
    to run the app.


    ```

    sudo add-apt-repository ppa:variety-team

    sudo apt-get update

    sudo apt-install variety

    ```


    # REMOVING APPS


    To uninstall or remove the Variety app, enter `sudo apt-get remove variety`. You''re
    informed of how much space you''re freeing up on the drive as a result of removing
    the app.


    STEP 1 To uninstall or remove the Variety app, enter `sudo apt-get remove`. Enter
    y to continue with the uninstallation; notice that you''re informed of how much
    space you''re freeing up on the drive as a result of the app.


