    . I hope you're well today.\")\n```\n\n- STEP 5 You don't always have to include\
    \ quoted text within the input command. For example, you can ask the user their\
    \ name, and have the input in the line below:\n\n```\nprint(\"Hello. What's your\
    \ name?\")\nname=input()\n```\n\n![](img/383b23573296234863a9f25dc7161abc_108_0.png)\n\
    \n- STEP 8 What you've created here is a condition, which will soon cover. In\
    \ short, we use the input from the user and measuring it against a condition.\
    \ So, if the user enters David as their name, the guard will allow them to pass\
    \ unhindered. Else, if they enter a name other than David, the guard challenges\
    \ them to a fight.\n\n![](img/383b23573296234863a9f25dc7161abc_108_1.png)\n\n\
