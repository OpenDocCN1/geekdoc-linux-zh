    # Terminal 基础


    大多数操作系统使用两种界面：GUI（即 Windows、macOS 和 Linux Mint 启动后的桌面）和命令行。虽然现代操作系统避开了命令行，但 Mint
    使用 Terminal 赋予用户对系统更大的控制权。


    # 执行命令


    命令行或 Terminal 是一个极其强大的界面。你在桌面上可以做的一切都可以在 Terminal 内完成。让我们先看看它是如何工作的。


    - 步骤 1：可以通过点击面板（位于 Firefox 和文件图标之间）上的 Terminal 图标访问 Terminal，或者打开菜单从左侧的快速启动栏选择它。

    - 步骤 2：Terminal 让你访问 Linux Mint Shell（称为 Bash），它让你访问底层操作系统。Mint 中的一切（包括桌面和 GUI）都是从命令行运行的模块。

    - 步骤 3：你目前在 Terminal 中看到的是登录名，后面是你第一次安装 Mint 时命名的计算机名称。行以当前文件夹名称结尾；起初只是一个波号 `~`，意味着你的主目录。

    - 步骤 4：行末尾闪烁的光标是输入基于文本的命令的地方。你可以尝试一个简单的命令：打印工作目录 (`pwd`)，它会在屏幕上输出你当前所在的文件夹。输入
    `pwd` 并按回车。


    ![](img/383b23573296234863a9f25dc7161abc_45_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_45_1.png)


    - 步骤 5：你输入的所有命令工作方式相同：输入命令，包含任何参数来扩展命令用途，并按回车执行输入的命令行。输入 `uname` 并按回车。这将显示关于 Mint
    的信息。

    - 步骤 6：查看和搜索选项让你调整 Terminal 窗口的大小，并在 Terminal 内搜索任何特定关键词。

    - 在进入命令之前，让我们花时间看看 Terminal 提供的菜单。文件菜单允许打开新 Terminal、创建一个配置文件（可以在其中更改 Terminal
    的大小、颜色和行为）、新建标签以及关闭所有当前会话。

    - 步骤 9：Terminal 的配置和大小调整允许更改字符编码。有趣的是，你还可以将其设置为只读模式，阻止你在 Terminal 中输入任何命令；这在你需要显示
    Terminal 命令很有很有。

    - 步骤 10：最后，帮助选项显示 Terminal 的帮助内容和版本号，更准确地说是 GNOME；我们以后将其称为 Terminal。这些内容值得快速读一遍，以熟悉
    Terminal 是如何工作的。


