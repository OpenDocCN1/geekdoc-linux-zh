    # MORE LOOPING


    You can loop over data using the FOR, WHILE AND UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    # STEP 1


    Create a new script called count.sh. Enter the text in the screenshot below, save
    it and make it executable. The script creates the variable count which at the
    beginning of the script equals zero. Then the WHILE loop count less than (the
    LT part) 10 will print the current value of count in the echo command.


    # STEP 4


    The UNTIL loop works the same way as the WHILE loop does, more often than not,
    in reverse. So our counting to a hundred, using UNTIL, will be: [ count -gt 100
    ]; do. The difference is, until count greater than the (gt part) one hundred,
    keeping on looping.


    ![](img/383b23573296234863a9f25dc7161abc_72_0.png)


    Executing the count.sh script will result in the numbers 0 to 99 going down the
    Terminal; when it reaches 100 the script will end. Modifying the script with the
    FOR statement, it works much the way we want. To use it in our script, enter the
    text from the screenshot to count.sh.


    # STEP 2


    You''re not limited to numbers to one hundred. You can loop, within whatever set
    of commands you execute them as many times as you want the loop to run for. Renaming
    a files, creating fifty folders etc. this script will create folders named Folder
    1 through 100 using the FOR loop.


    ![](img/383b23573296234863a9f25dc7161abc_72_1.png)


    # STEP 3


    The addition we have here is: for in {0..100}; do. Means FOR the variable ''count''
    IN the numbers from zero to one hundred, then start the loop. The rest of the
    script is the same. Run this script, and the sample should output in the Terminal.


    # STEP 6


    Using the FOR count sequence once more, we by manipulating the (0..100) part.
    This section of code actually means (START..INCREMENT); if there''s no increment
    then it''s just a single digit to the END. For example, we change the loop to
    count up to 100 with two''s: for in {0..100..2}; do .


    ![](img/383b23573296234863a9f25dc7161abc_72_2.png)'
