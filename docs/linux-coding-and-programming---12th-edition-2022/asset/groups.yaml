    # # The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    # ## GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    read the instructions carefully.


    # ## LINUX MINT


    By far the most popular Linux distro (distribution) is Linux Mint. Mint began
    life in 2006, as an alternative to the most popular, Ubuntu. Although based on
    Ubuntu''s Long Term Support, Linux Mint took a different direction and offered
    the user a better overall experience.


    Linux Mint has three main desktops available with each new version of the core
    OS itself. This may seem confusing at first but its quite simple. Currently, Linux
    Mint uses the Cinnamon Environment as its flagship model, and offers two more
    modern options.


    Cinnamon is a graphically rich environment, MATE uses less fancy graphics, and
    is more stable on a wider variety of desktop systems, and XFCE is an extremely
    streamlined environment that''s built for speed and ultimate stability.


    Throughout this time we''ll be using the Cinnamon version; however, you can try
    any of the other desktop environments as wish. In fact, it''s recommended that
    you spend some time trying different environments, and even different distributions,
    to see which suits you and your computer best.


    www.linuxmint.com


    ![](img/383b23573296234863a9f25dc7161abc_9_0.png)


    # ## UBUNTU


    ![](img/383b23573296234863a9f25dc7161abc_9_1.png)


    The most popular distro available is Ubuntu, which is an ancient African word
    meaning ''humanity to''. Ubuntu''s popularity has fluctuated over its fourteenth
    year. At one time, it was the most used Linux-based system in the world with some
    choices the agile had with regards to its presentation, and even some unfavourable,
    controversial involving privacy, saw it crumble from the number one spot on.


    That said, Ubuntu is made amends and is growing its way back up the Ubuntu leader
    board. The latest versions of the OS use the GNOME 3 desktop environment, an impressive
    improvement, although it can be a bit confusing for Windows users and is a little
    heavy on resources, especially when planning to install it on an older computer.


    for all its faults, is a good Linux distro to start experimenting with. It''s
    a clean interface, easy to use and offers the user a complete Linux experience.


    ubuntu.com'
