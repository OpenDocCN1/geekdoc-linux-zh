    \n- **步骤 1** 让我们尝试创建一个显示 Mint 系统信息的脚本；这总是很有用的东西。创建一个名为 sysinfo.sh 的新脚本，并将其输入 Zed\
    \ 或你选择的任何文本编辑器。\n\n```bash\n# sysinfo x\n# information:\nhostname:\necho $(hostname)\
