    \ as name. This is the Python Editor and within it you can enter the code to create\
    \ your programs.\n- **STEP 2** The IDLE Editor is, for all intents and purposes,\
    \ a simple text editor with Python features, coding and so on; in the same vein\
    \ as Sublime. You enter the code as you would within the Shell, taking an Example\
    \ from the previous tutorial, enter:\n- **STEP 3** You can see that the same colour\
    \ coding is in place in the IDLE Editor as it is in the Shell, enabling you to\
    \ understand what's going on with your code. However, to execute the code you\
    \ need to save it. Press F5 and you get a Save... Check box open.\n\n![](img/383b23573296234863a9f25dc7161abc_95_0.png)\n\
    - **STEP 4** Click on the OK button in the Save box and select a destination where\
    \ you'll save all your Python code. The destination is a dedicated folder called\
    \ Python or you can just dump it wherever you like. Remember to keep a tidy though,\
    \ to help you out in the future.\n\n```python\nprint(\"Hello everyone!\")\n```\n\
    \n![](img/383b23573296234863a9f25dc7161abc_95_1.png)\n\n![](img/383b23573296234863a9f25dc7161abc_95_2.png)\n\
    \n# Saving and Executing Your Code\n\nSTEP 5 Enter a name for your code, 'print\
    \ hello' for example, and click on the Save button. The Python code is saved and\
    \ it will be detailed in the IDLE Shell. In this case, the words 'Hello everyone!'\n\
    \nSTEP 8 Let's extend the code and enter a few examples from the previous tutorial:\n\
    \n```python\na=2\nb=2\nname=\"Dovid\"\nsurname=\"Hayward\"\nprint(name, surname)\n\
    print (a+b)\n```\n\nIf you press F5 you'll be able to save the file, again, as\
    \ it's modified by Python.\n\n![](img/383b23573296234863a9f25dc7161abc_96_0.png)\n\
    \nSTEP 6 This is the way majority of your Python code will be conducted. Enter\
    \ it into the Editor, F5, save the code and look at the output in the Shell. Sometimes\
    \ things will differ, depending on whether you've requested a process window,\
    \ but essentially that's the process we will use with this unless, otherwise stated.\n\
    \nSTEP 9 If you click the OK button, the file will be overwritten with the new\
    \ code entries, and executed with the output in the Shell. It's not a problem\
    \ with just these few lines, but if you want to edit a larger file, overwriting\
    \ can become an issue. Use File > Save As From the Editor to create a copy.\n\n\
    ![](img/383b23573296234863a9f25dc7161abc_96_1.png)\n\n![](img/383b23573296234863a9f25dc7161abc_96_2.png)\n\
    \nSTEP 7 If you open the file location of the saved Python code, you can see it\
    \ in a .py extension. This is the default Python filename. Any code you create\
    \ will be whatever.py and any code downloaded from the Internet resources will\
    \ be .py. Just ensure that the code is written for Python.\n\nSTEP 10 Create a\
