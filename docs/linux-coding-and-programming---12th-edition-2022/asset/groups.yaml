    \ Howard\n```\n\n![](img/383b23573296234863a9f25dc7161abc_105_0.png)\n\nYou've\
    \ seen previously that variables can be concatenated with the plus symbol between\
    \ the variable names. In our example we can use: `print(name + \": \" + title)`.\
    \ The middle part between the quotations allows us to add a colon and a space,\
    \ as variables are connected without spaces, so we need to add them manually.\n\
    \n```\n>>> name=\"David Howard\"\n>>> title=\"Descended from Vikings\"\n>>> print(name\
    \ + \": \" + title)\nDavid Howard: Descended from Vikings\n```\n\n- STEP 3\n\n\
    You can change the type of variable in use by issuing the `type()` command, placing\
    \ the name of the variable inside the brackets. In this case it would be `type(name)`.\
    \ Add a new string variable: `title=\"Descended from Vikings\"`.\n\n```\n>>> name=\"\
    David Howard\"\n>>> title=\"Descended from Vikings\"\n>>> type(name)\nclass 'str'\n\
    >>> type(title)\nclass 'str'\n```\n\n- STEP 4\n\nYou can also combine variables\
    \ within another variable. For example, to combine both name and title into a\
    \ new variable we use:\n\n```\n>>> name=\"David Howard\"\n>>> title=\"Descended\
    \ from Vikings\"\n>>> full_name = name + \": \" + title\n>>> print(full_name)\n\
    David Howard: Descended from Vikings\n```\n\nThen output the content of the new\
    \ variable as:\n\n```\nprint (character)\n```\n\nNumbers are stored as different\
    \ variables:\n\n```\nage=44\nType(age)\n```\n\nWhich, as we know, are integers.\n\
    \n# STEP 5\n\nHowever, you can't combine strings and integer values in the same\
    \ command, as you would get a similar of values. You need to either one into the\
    \ other or vice versa. When you try to combine both, you get an error message:\n\
    \n```\nprint (name + \"age\")\n```\n\n```\nPython 3.4.2 (default, Oct 19 2014,\
    \ 13:01:11)\n>>> GCC (4.3.0) on linux\n>>> type \"credits\" or \"license\" for\
