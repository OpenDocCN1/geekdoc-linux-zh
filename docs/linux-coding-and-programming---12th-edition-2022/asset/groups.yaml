    # C++ on Linux


    # # Your First C++ Program


    The Raspberry Pi makes for a great coding base on which to learn C++. You won''t
    need any complicated, third-party IDEs or to install any extra components. Everything
    you need to get started is already built into the Pi.


    # HELLO, WORLD!

    it''s traditional in programming for the first code to be entered to output the
    words ''Hello, World!'' to the screen. Interestingly, this dates back to 1968
    using a language called BCPL.


    +   **STEP 1** You can use the Geany Programmer Editor to write, compile and execute
    your C++ code on the Raspberry Pi. You can find Geany as the first entry in the
    Programming section of the main Raspberry Pi menu. Click the Geany icon to open
    and start coding.


    +   **STEP 3** It doesn''t look like much at the moment but you can get into what
    the C++ header commands mean in meaning it-colour depending on the language. To
    activate this, save the code by clicking on File > Save. Now name your code helloworld.cpp
    and click the Save button.


    ![](img/383b23573296234863a9f25dc7161abc_121_0.png)


    +   **STEP 2** The Geany editor is quite powerful while still being easy to use.
    Every code you enter shows in the main window and is numbered to help you keep
    track of your code. For now, in line 1:


    ```

    #include <iostream>

    ```


    ```

    int main()

    ```


    +   **STEP 4** The colour coding helps a lot when coding. Now press Enter and
    start a new command on line 3. Note: there''s no space between the brackets.


