    ![](img/383b23573296234863a9f25dc7161abc_32_3.png)

    - **STEP 10** In short, Mint Cinnamon can be configured to look quite extraordinary.
    There are examples of how good it can get and what can be achieved. You can go
    as complex or simple as you want, adding different component and animations or
    just keeping it plain and easy to read.


