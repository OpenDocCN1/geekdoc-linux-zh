    # Linux：带有命令行环境的操作系统


    Linux 命令行 Terminal 是一个极其强大的环境。通过它，你可以让操作系统瘫痪，也可以让它变得精彩。你可以入侵远程计算机、查看 ASCII 艺术、从服务器安装应用程序以及编写脚本。在本节中，你将探索
    Terminal 的细节以及它如何与 Linux 工作。你将学习如何通过 Terminal 操作 Linux 系统，并发现一些在 Terminal 中有趣的事情。


