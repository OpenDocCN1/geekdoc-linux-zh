    # Installing Linux on a PC


    Most Linux distros come as a Live Environment. This means you can boot into an
    actual, fully-working distro straight from the DVD or USB that you created. Let''s
    see how that works and how you can go installing Linux from there.


    ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    - **STEP 1** Insert your USB or flash drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''re using the USB media but the
    process is visually identical. Start the PC and prompt the keys to enter the BIOS
    or SETUP, which could be: F2, Del or F12.

    - **STEP 2** There are differences between a UEFI BIOSs, so covering all would
    be impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you need to turn off UEFI and choose Legacy Boot. Most modern
    distros with UEFI can be a bit tricky to install out of.

    - **STEP 3** With UEFI turned to legacy mode, there are ways of booting into the
    Live Environment. First is via the BIOS you''re already in. Locate the Boot Sequence
    and change the first boot device from its original setting, usually Internal HDD
    or similar, to: USB Storage Device for the USB media, or DVD Drive for the media
    option.

    - **STEP 4** Alternatively use the Boot Option Menu. With this you can press F2
    (or something similar) to display a list of boot media options; from there you
    can choose the appropriate boot media. Here you can now Save and Exit the BIOS
    by navigating to the Save & Exit option and choosing ''Save and Changes''


    ![](img/383b23573296234863a9f25dc7161abc_21_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_21_1.png)


    # INSTALLING LINUX


    Once the Live Environment has booted, you are free to install the distro to your
    computer. Have a look around and when you''re ready, look for the Install option
    on the desktop.


    - **STEP 1** Providing you are connected to the internet (if not, then do so)
    and you''re in the Live Environment, start the installation process by double-clicking
    on the Install Mint icon on the desktop. Other distros display their name of,
    course, but the process is the same. Click Continue when you''re ready.

    - **STEP 2** While the installation process is very similar across most distros,
    some offer different questions during the installation. The questions aren''t
    too difficult, nothing very technical, but such as ''Installing'' third-party
    software, can be confusing. In this case you can click Continue but if you''re
    unsure, have an Internet-connected device available to ask any questions.

    - **STEP 3** When installing a new operating system it is recommended that you
    wipe the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install'' option is selected. NOTE: This
    completely wipes Windows 10 from your computer, make sure you backed up all your
    personal files and data.

    - **STEP 4** Before the installation process begins, you''re asked if the chose
    to make sure the erasure of the hard drive is correct. This is your last chance
    to back out. If you''re certain you don''t mind wiping everything and starting
    with Linux Mint, click Continue. If you need to backup your files the Linux disc/USB,
    reboot, and start again.

    - **STEP 5** Eventually you are asked to set up your username and password. Enter
    your name to begin, with the Computer Name, which is the name it is identified
    on the network. Next choose a Username, followed by a Password. You can tick the
