    david@david-mint ~/scripts $\n```\n\n![](img/383b23573296234863a9f25dc7161abc_75_0.png)\n\
    \n- **步骤 4** 尽管有一些终端命令可以帮助你查找特定的文件或文件夹，但通常为它们创建一个脚本会更好。此外，你可以将其用于非技术用户。创建一个名为\
