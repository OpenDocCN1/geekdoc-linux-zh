- md: "\n## C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash\
    \ // or a single forward slash and an asterisk '*'. You've already seen brief\
    \ examples but this is how it works.\n\nUsing the Hello World as an example, you\
    \ can easily comment on different sections of the code using the double forward\
    \ slash:\n\n```cpp\n// My first C++ program cout << \"Hello, world!\\n\";\n```\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n    cout << \"Greetings from\
    \ C++!\\n\";\n}\n```\n\nBe careful when commenting, especially with block comments\
    \ /* to it's very easy to forget to add the closing asterisk and forward slash\
    \ and thus negate any code that falls inside the comment block:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\\n\";\n    /* This comment can\n    several lines\n\
    \    without the need to add more slashes */\n    cout << \"Greetings from C++!\\\
    n\";\n}\n```\n\nHowever, you can also add comments to the end of a line, to describe\
    \ what you are going on:\n\n`cout << \"Hello, world!\\n\"; // This outputs the\
    \ words 'Hello, world'. The \\n denotes a new line.`\n\nNote, you don't have a\
    \ semicolon at the end of a comment. This is because it's in the code that gets\
    \ ignored by the compiler:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    // My first C++ program\n    cout << \"Hello, world!\\n\"; //\
    \ This outputs the words 'Hello, world'. The \\n denotes a new line.\n}\n```\n\
