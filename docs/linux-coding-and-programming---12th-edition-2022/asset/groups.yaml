    \ that's used to use ultra-high-definition graphics and open world, multi-player\
    \ games. However, forty-years ago it was blindingly brilliant.\n\nNaturally these\
    \ coders helped the foundations for every piece of digital technology we use today.\
    \ Some went on to push the available market for software companies, whereas others\
    \ limited its bounds and the billion pound continuously amass us.\n\nRegardless\
    \ of whether you use an Android device, iOS device, PC, Mac, Linux, Smart TV,\
    \ games console, MP3 player, GPS device built-in to a car, set-top box or other\
    \ connected and 'smart' appliances, all these is all programming.\n\nAll those\
    \ aforementioned digital devices need instructions to tell them what to do, and\
    \ allow them to be interacted with. These instructions forming the core of the\
    \ device and that can be built using a variety of programming languages.\n\nThe\
    \ languages in use today differ upon the situation, platform, of the device and\
    \ how the device will interact with environment or users.\n\n![](img/383b23573296234863a9f25dc7161abc_87_0.png)\n\
    \nOperating systems, Windows, MacOS and such are usually a combination of C++,\
    \ C#, assembly and some form of visual-based language. Generally we use C++ with\
    \ memory pages we use a plethora of available languages such as HTML, Java, Python\
    \ and so on.\n\nPython was created over twenty six years ago and has evolved to\
    \ become an ideal language for learning how to program a computer. It's perfect\
    \ for the hobbyist, student, teacher and those who need to create their own interaction\
    \ between themselves or a piece of external hardware and.\n\nMore general-purpose\
    \ programming is used to create programs, apps, software or whatever they want\
    \ it to do. They're widely used across all platforms and virtually every convenient\
    \ application. Some operate faster than others and are easier to learn than others.\
    \ Python is one of the general-\n\nPython is free to download, and is available\
    \ for Linux, Windows, macOS, MS-DOS, OS, IBM-series machines and RIS. It has been\
    \ voted one of the top five programming languages in the world and is continually\
    \ evolving ahead of hardware and internet demand.\n\nPython is known as a High-Level\
    \ language, in that it 'talks to the hardware and operating system with a variety\
    \ of arrays, objects, attributes, subroutines, loops and countless more interactions.\
    \ It's not as streamlined as a Low-Level language, which can deal directly with\
    \ memory addresses, stacks and registers, its benefit is that it's universally\
    \ accessible and to learn.\n\nSo to answer the question: why Python? Simply put,\
    \ it's free to learn, exceptionally powerful, universally accepted, and a superb\
    \ and educational tool.\n\n```java\n// import Invoke\nimport java.lang.reflect.*;\n\
    class Invoke {\n    public static void main(String[] args) throws {\n        try\
    \ {\n            Class c = Class.forName(args[0]); // class\n            Method\
    \ m = c.getMethod(args[1], String.class);\n            Object obj = m.invoke(null,\
    \ args);\n            System.out.println(\"Invoked method: \" + obj);\n      \
    \  } catch (ClassNotFoundException e) {\n            System.out.println(\"Error:\
    \ \" + e.getMessage());\n        } catch (NoSuchMethodException e) {\n       \
    \     System.out.println(\"Error: \" + e.getMessage());\n        } catch (IllegalAccessException\
    \ e) {\n            System.out.println(\"We don't have permission to invoke that\
    \ method\\n\");\n        } catch (InvocationTargetException e) {\n           \
    \ System.out.println(\"Exception occurred while invoking that method\\n\");\n\
    \        }\n    }\n}\n```\n\n```basic\n40 LET py=15\n50 FOR y=10 TO -1\n60 LET\
    \ px=5\n70 LET BY=1+(RND*28))\n80 FOR j=1 TO 20\n90 LET px=px+BY\n100 PRINT \"\
    ,py\",\"U\"\n110 PRINT \",px\",\"X\"\n120 PRINT \",py\",\"Y\"\n130 IF py=15 THEN\
    \ py=1\n140 FOR n=1 TO 10: NEXT n\n150 IF py=2 THEN py=7\n160 LET bx=bx+2\n170\
    \ LET by=by-1\n180 FOR n=1 TO 5: LET s=s+1\n190 PRINT \"10,score:\",s\n200 FOR\
    \ v=1 TO 10: NEXT v\n```\n\nBASIC was once the starter language that early 8-bit\
    \ computer users used. Java is a popular language that is used in web pages, set-top\
    \ boxes, TVs and.\n\n```python\nimport random\nprint(\"I'm thinking of a number\
    \ between 1 and 10\")\nnumber = random.randint(1, 10)\nguess = 0\nwhile guess\
    \ != number:\n    guess = int(input(\"Enter your guess: \"))\n    if guess < number:\n\
    \        print(\"Too low!\")\n    elif guess > number:\n        print(\"Too high!\"\
    )\n    else:\n        print(\"Correct!\")\n    guess += 1\nprint(f\"It took you\
    \ {guess}.\")\n```\n\nPython is a modern take on BASIC, it's so easy and makes\
    \ for an ideal beginner's language.\n\n## How to Set Up Python in Linux\n\nWhile\
    \ the Raspberry Pi's operating system contains the latest stable version of Python,\
    \ other linux don't come with Python 3 preinstalled. If you're not down the Pi\
    \ route, here's to check and install Python for Linux.\n\nLinux is a versatile\
    \ operating system that's often difficult to nail down one way of doing something.\
    \ Different distributions go installing in different ways, so we're sticking with\
    \ Linux Mint for this particular tutorial.\n\n- **STEP 1** First need ascertain\
    \ which version of Python is currently installed in your Linux system. To begin,\
    \ drop into a Terminal session from your distro or press Ctrl+Alt+T.\n- **STEP\
    \ 2** Next enter `python --version` in the Terminal to show version 2.x of Python\
    \ in your system. By default, most Linux dist come with both Python 2 and 3, so\
    \ there's plenty of code available for Python 2. Now enter: `python3 --version`.\n\
    - **STEP 3** In our case we have both Python 2 and 3 installed; as soon as 3.x\
    \ is installed, the tutorials will work. It's always worth checking to see if\
    \ the distro has been updated with the latest versions, so enter `sudo apt-get\
    \ update && sudo apt-get upgrade` to update the system.\n- **STEP 4** Once the\
    \ update and upgrade completes, `python3 --version` to see if 3.x is installed\
    \ or updated; as long as you have Python 3.x, you're running the most recent version.\
    \ After the numbers after 3. include patches and updates. If they're unnecessary\
    \ then.\n"
  mdcn: "\n\n# Linux 版 Python\n\n## 为什么选择 Python？\n\n现代计算机有许多编程语言，对于 8 位和 16 位计算机仍然可以使用许多语言。其中一些语言是为科学工作设计的，另一些则是为移动平台等设计的。在这么多语言中，你为什么选择\
    \ Python 呢？\n\n## Python 的力量\n\n从最早家用计算机出现以来，爱好者、用户和专业人士一直忙碌到深夜，在过热的电路热量旁彻夜不眠，只为创造出类似魔法的事物。\n\
    \n这些编程先驱者开辟了新的疆域，通过微小的细节让字母 “A” 能够在屏幕上滚动。对于习惯了超高定义画质和开放世界、多人游戏的一代人来说，这听起来可能并不十分令人兴奋。然而，四十年前年前它是光彩夺目的。\n\
    \n自然地，这些编码员为我们今天使用的每项数字技术奠定了基础。有些人继续推动了软件公司的可用市场增长，而另一些人则限制了它的边界，让我们数十亿镑的财富不断积聚。\n\
    \n无论你使用的是 Android 设备、iOS 设备、PC、Mac、Linux、智能电视、游戏机、MP3 播放器、汽车内置 GPS 设备、机顶盒或其他连接的“智能”家电器，这一切都是编程的。\n\
    \n所有上述数字设备都需要指令来告诉它们要做什么，并允许与其进行交互。这些指令构成了设备的核心，可以使用多种编程语言来构建。\n\n今天使用的语言取决于设备的情况、平台，以及设备如何与环境或用户进行交互。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_87_0.png)\n\n操作系统如 Windows、MacOS 等通常是\
    \ C++、C#、汇编和某些形式的基于视觉的语言的结合。通常我们使用 C++ 处理内存页，而我们使用大量的可用语言，如 HTML、Java、Python 等。\n\
    \nPython 创建于二十六多年前，它已经演变成一种学习如何编写计算机程序的理想语言。它对于爱好者、学生、老师以及那些需要在自己或与外部硬件之间创建自己的交互的人来说都是都是完美的。\n\
    \n更通用的编程被用于创建程序、应用程序、软件或他们想要它做的任何事情。它们被广泛应用于所有平台和几乎每个方便的应用程序。某些运行得比其他更快，并且比其他更容易学习。Python\
    \ 是一种通用的——\n\nPython 免费下载，并适用于 Linux、Windows、macOS、MS-DOS、OS、IBM 系列机器和 RIS。它被选为世界前五大编程语言之一，并不断领先于硬件和互联网的需求进行演进。\n\
    \nPython 被称为高级语言，因为它“通过各种数组、对象、属性、子程序、循环和无数次交互与硬件和操作系统‘对话’”。它不像低级语言那样精简（低级语言可以直接处理内存地址、栈和寄存器），但它的优势是随处可访问且易于学习。\n\
    \n所以回答这个问题：为什么选择 Python？简单来说，它是免费的、极其强大的、全球认可的，并且卓越且具有教育意义的工具。\n\n```java\n//\
    \ import Invoke\nimport java.lang.reflect.*;\nclass Invoke {\n    public static\
    \ void main(String[] args) throws {\n        try {\n            Class c = Class.forName(args[0]);\
    \ // class\n            Method m = c.getMethod(args[1], String.class);\n     \
    \       Object obj = m.invoke(null, args);\n            System.out.println(\"\
    Invoked method: \" + obj);\n        } catch (ClassNotFoundException e) {\n   \
    \         System.out.println(\"Error: \" + e.getMessage());\n        } catch (NoSuchMethodException\
    \ e) {\n            System.out.println(\"Error: \" + e.getMessage());\n      \
    \  } catch (IllegalAccessException e) {\n            System.out.println(\"We don't\
    \ have permission to invoke that method\\n\");\n        } catch (InvocationTargetException\
    \ e) {\n            System.out.println(\"Exception occurred while invoking that\
    \ method\\n\");\n        }\n    }\n}\n```\n\n```basic\n40 LET py=15\n50 FOR y=10\
    \ TO -1\n60 LET px=5\n70 LET BY=1+(RND*28))\n80 FOR j=1 TO 20\n90 LET px=px+BY\n\
    100 PRINT \",py\",\"U\"\n110 PRINT \",px\",\"X\"\n120 PRINT \",py\",\"Y\"\n130\
