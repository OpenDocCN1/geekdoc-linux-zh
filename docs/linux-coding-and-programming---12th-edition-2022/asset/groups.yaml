    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous online, you can take
    measures to ensure our privacy is at best.


    - STEP 1: Starting with the basics, use HTTPS instead of the standard HTTP when
    browsing. This means anything that''s transmitted over HTTPS is secure (hence
    the S part at the end) and encrypted.

    - STEP 2: When you''re browsing, consider using the Incognito or Private browsing
    modes available in a browser. This disables your web history and cache, which
    allows you to browse without the details being stored for later scrutiny by someone
    else. However, it doesn''t stop any data or search tracking.

    - STEP 3: Although using Google may seem the obvious choice for a modern internet
    search, the company does track all searches made by an individual. Instead, consider
    an alternative search engine, such as DuckDuckGo, a search engine that doesn''t
    store personal data or track you.

    - STEP 4: If you''re browsing on the Internet consider installing some of the
    browser-plugins that enhance your privacy. For example, for Firefox, use Ghostery,
    NoScript and Adblock Plus to block trackers, and other data mining techniques.


    ![](img/383b23573296234863a9f25dc7161abc_41_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_1.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_2.png)

    ![](img/383b23573296234863a9f25dc7161abc_41_3.png)


    # VPNS AND TOR


    The previous steps can aid your online privacy but to really become anonymous
    you need a Virtual Private Network and Tor.


    - STEP 1: A VPN is a network server, or cluster of servers, that establishes a
    connection with your computer. The end result is that your computer''s identity
    on the Internet is hidden behind the VPN remote server; so you could use it in
    the UK with an IP address (the computer online identity) belonging to Iceland.

    - STEP 2: Most good VPN charge a monthly or annual fee but it''s worth the expense.
    We use CyberGhost, www.cyberghost.com, which provides VPN connections for Windows,
    Mac, Mint (as any other Linux distribution), Android and iOS devices. For details
    of each OS can be found at www.cyberghost.com/hz/en-us/articles/213190329-Read-first-

    - STEP 4: When the download has finished, drop it into the Terminal and enter
    the Downloads folder, cd Downloads/. Enter is to check if the tar.xz file is present,
    then enter: tar -xf tor-browser-linux64-8.0.4_en-US.tar.xz (X is updated, so if
    your version is different press Tab to autocomplete the tor-browser-filename).
    When the files are unpacked, use cd tor-browser-en-US to enter.

    - STEP 5: A quick click reveals the contents of a folder Browser and a file ''start-tor-browser''.
    To start the setup, type: ~/start-tor-browser.desktop. This command launches the
    setup, and you are offered two options: Connect or Configure. If not concerned,
    the Connect option will suffice. Click when you''re ready.

    - STEP 6: After the connection is established, the Tor Browser is launched. This
    is a customised version of Firefox and from here you can securely browse the Internet
    without fear of being viewed or tracked. Mixing both VPN and Tor for an extremely
    secure and private connection to the online world.


