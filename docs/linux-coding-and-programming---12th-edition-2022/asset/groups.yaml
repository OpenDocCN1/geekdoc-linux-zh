    # Creating Users


    When you install Linux Mint it is configured for you with a single user. While
    sharing a user account with the entire family is fine, there may come a time when
    you need to create separate users with their own unique Home Folders.


    # NEW USERS


    Having different users means each user has access to his or her areas on the system.
    Documents, pictures, videos and so on are separate, with multiple users on other
    operating systems.


    +   STEP 1 Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. Choose Users and Groups and enter your password. The
    Users and Groups console is quite basic looking, and thankfully easy to use. At
    first, you can just see your own home from when you installed Linux Mint.


    +   STEP 3 Enter the user''s Full Name, followed by the Username they need when
    logging into Linux Mint. Make sure the username is all in lower case, a-z and
    0-9 characters underscores or hyphens if you wish. Click the Add button when you''re
    ready to continue.


