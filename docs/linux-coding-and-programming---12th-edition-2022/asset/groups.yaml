- md: "\n# Python on Linux\n\n## Why Python?\n\nThere are many programming languages\
    \ available for the modern computer, and still available for 8 and 16-bit computers.\
    \ Some of these languages are designed for scientific work, others for mobile\
    \ platforms and such. Why do you choose Python out of all the rest?\n\n## PYTHON\
    \ POWER\n\nEver since the earliest home computers were available, enthusiasts,\
    \ users and professionals have toiled away the wee hours, sleeping over an overheating\
    \ heat of circuitry to create something akin to magic.\n\nThese pioneers of programming\
    \ carved into a new frontier, totalling small details that enabled the letter\
