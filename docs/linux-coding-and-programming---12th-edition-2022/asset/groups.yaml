    # Say Hello to Linux


    > "How did you know so much about computers?"

    "I didn''t, it was the first one."

    – Admiral Grace Hopper (pioneer programmer) when interviewed by David Letterman'
  - '[PAGE 6]


    Why Linux? What is it? Where do I get it? Why are there so many different versions
    of it? Most beginners ask these, and many more, questions when starting out. It''s
    true that Linux is an incredibly versatile and powerful operating system but where
    do you start? Thankfully, you can find the answers in this section.


    There is so much you can do with Linux but you need to know where to start; we''re
    here to help you out. In this section you can learn what Linux is, what a distro
    is and what a desktop environment is. You can also begin to explore how Linux
    works and how it can work for you.


    | 8 | Why Linux? |

    | 10 | The Best Linux Distributions |

    | 12 | Equipment You Will Need |

    | 14 | Desktop Environments |

    | 16 | Which Distro? |


    ![](img/383b23573296234863a9f25dc7161abc_6_0.png)'
- md: " own## Why Linux?\n\nFor many of its users, Linux means freedom. freedom to\
    \ change and use the OS as you please and freedom from other operating systems,\
    \ from any form of licensing or payment. There's a lot more to Linux than you\
    \ may think though.\n\n## FREE AND OPEN\n\nLinux is a fantastic fit for those\
    \ who want something different. The efficiency of the system, the availability\
    \ of applications and stability are just a few good reasons.\n\nThe first thing\
    \ you need to know is that there is no such operating system called Linux. Linux\
    \ is in fact the operating system kernel, the core component of an OS. When talking\
    \ about Linux what you are referring to is one of the many distributions, distros,\
    \ that use the Linux kernel. But you've heard of at least one of them: Ubuntu,\
    \ Fedora, Arch, Debian, Manjaro, the list goes on. Each of these distros offers\
    \ something different for the user. While each has the Linux kernel at its core,\
    \ they provide the user with a different looking desktop environment, and different\
    \ ways in which to use the system and get apps installed and a slightly different\
    \ look and feel throughout the entire system. However, at the centre lies Linux,\
    \ which is why we call it Linux.\n\nLinux works differently to Windows or macOS.\
    \ It's free for a start; free to install on as many computers as you like, free\
    \ for an unlimited amount of time and free to use is one of the biggest draws\
    \ for the developer. Since Linux can be customized and considerably more, a user,\
    \ be a developer, a gamer or someone who wants to use an older computer, can quickly\
    \ download a distro and get to work in a matter of minutes.\n\nAlongside the free\
    \ to use aspect comes a level of freedom to customise and mould the system to\
    \ your own. Each of the available distros available on the Internet have a certain\
    \ 'spin', in that order increased security, a fancy desktop, gaming space, something\
    \ different toward students. extensibility makes Linux a more desirable platform\
    \ to use, as you can easily modify the system to any development base including\
    \ many different kinds of IDEs for the likes of Python, web development, C++,\
    \ Java and so on; or create for online anonymity, perhaps as a Minecraft server,\
    \ media centre and other more.\n\nLinux is a great operating system to start coding.\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    // My first C++ Program\n \
    \   std::string message = \"hello world!\";\n    std::cout << message << std::endl;\n\
    \    return 0;\n}\n```\n\n![](img/383b23573296234863a9f25dc7161abc_7_0.png)\n\n\
    ## Why Linux?\n\n![](img/383b23573296234863a9f25dc7161abc_8_0.png)\n\nThere are\
    \ dozens of free packages available for programmers under Linux.\n\nAnother remarkable\
    \ thing for those looking to learn to, is that Linux comes with most of the popular\
    \ environments built in. Both Python and C++ are preinstalled in a high percentage\
    \ of Linux distros available, which means you can start to program as soon as\
    \ you install the system and build for the first time.\n\nGenerally speaking,\
    \ Linux doesn't take up many resources as Windows or macOS; with systems resources\
    \ we mean, hard memory, drive space and CPU load. The Linux code is small, which\
    \ helps those with limited resources. A more efficient system of code means more\
    \ available resources for the coding and testing environment and the programs\
    \ you create. Linux on older hardware that would normally struggle or even refuse\
    \ to run the latest versions of Windows or macOS; so rather throw away an old\
    \ computer, it can be reused with a Linux distro.\n\nEach distro offers something\
    \ unique to the user but have Linux at the core.\n\nIt's not about C++, Python\
    \ or any of the other more popular programming languages using. Using the specific\
    \ program line and also called the Terminal, you are able to learn Shell scripts,\
    \ which are programs designed to run from the command line and used to manipulate\
    \ data under some form of input and output for certain operation.\n\nFinally,\
    \ although there are many more advantages we can list, there are thousands of\
    \ free programs and packages available cover nearly every aspect of computing.\
    \ Known as packages, there is (at the time of writing) over 5876 specific programming\
    \ applications catering from Ubuntu to Mint and an incredible 62,000+ packages\
    \ from WWW downloads.\n\nLinux is a great resource and environment for programming.\
    \ it's perfectly suited for developers and is continually evolving. If you're\
    \ about getting into coding, or you want to, try giving Linux a try and see how\
    \ it works for you.\n\nA Linux programming environment is as simple or as complex\
    \ as you want it to be.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n#include <time.h>\n\nint main() {\n    int i;\n    char name[100];\n\
    \    printf(\"Enter your name: \");\n    scanf(\"%99s\", name);\n    printf(\"\
    Hello, %s!\\n\", name);\n    for (i = 0; i < 5; i++) {\n        printf(\"Iteration\
    \ %d\\n\", i);\n    }\n    return 0;\n}\n```\n\n## The Best Linux Distributions\n\
    \nThere are lots of versions of Linux available, known as Distributions. Each\
    \ has a different ethos and approach. Here are five great distributions to try:\n\
    \n## GOING LINUX\n\nThe installation process for most distributions is similar.\
    \ You download an image from the website and burn it to an optical disk or create\
    \ a USB drive.\n\n## LINUX MINT\n\nBy far the most popular distribution is Linux\
    \ Mint, which began in 2006. Based on Ubuntu, it offers three main desktop environments:\
    \ Cinnamon, MATE, and XFCE. Each distro offers something unique to the user but\
    \ have Linux at the core.\n\n## UBUNTU\n\nUbuntu is a very popular distribution.\
    \ It is based on Debian and offers a wide variety of software. It is designed\
    \ for both beginners and advanced users.\n\n## ARCH\n\nArch is a distribution\
    \ for those who want to build their own system. It is known for using the command\
    \ line, which allows you to learn a lot about how Linux works. Arch is a rolling\
    \ release distribution, which means you always have the latest software.\n\n![](img/383b23573296234863a9f25dc7161abc_8_1.png)\n"
