    # Basics of the Terminal


    Most operating systems use two kinds of interface: the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into, and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    - STEP 1: The Terminal can be accessed by either clicking on the Terminal icon
    on the Panel, located between the Firefox and Files icons or by opening the Menu
    and selecting it from the left-hand quick launch strip.

    - STEP 2: The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    the desktop and GUI, is modules running from the command line.

    - STEP 3: What you currently see in the Terminal is your login followed by the
    name of the computer you named when you first installed Mint. The line ends with
    the current folder name; at first this is just a tilde ~, which means your Home
    folder.

    - STEP 4: The flashing cursor at the very end of the line where your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (pwd), which outputs the current folder you''re to in the screen.
    Type pwd and press Enter.


    ![](img/383b23573296234863a9f25dc7161abc_45_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_45_1.png)


    - STEP 5: All the commands you enter work in the same manner: you enter the command,
    include any parameters to extend the use of the command and press Enter to execute
    the command line you''ve entered. Type into: `uname` and press Enter. This displays
    system information regarding Mint.

    - STEP 6: View and Search options let you alter the sizing of the Terminal window
    and of course search within the Terminal for any particular keywords.

    - Before we get into editing commands, let''s take a moment to see what menus
    the Terminal has to offer. File menu allows you to open a new Terminal, create
    a new profile, where you can alter the size, colours and behaviour of the Terminal,
    add a new tab, and close all current active sessions.

    - STEP 9: The Terminal entry enters the profile editing and sizing and allows
    you to alter the character encoding. Interestingly, you can also set it to Read
    Only mode, which stops you from entering any commands into the Terminal; this
    is good for when you need to display the Terminal commands.

    - STEP 10: Finally, the Help option displays the help contents and version number
    of the Terminal, or to more precise, GNOME;we will refer to it as Terminal in
    Future, The Contents are worth having a quick read through, to familiarise yourself
    with how the Terminal works.


