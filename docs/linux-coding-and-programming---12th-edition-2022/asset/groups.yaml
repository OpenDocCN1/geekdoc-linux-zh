    \ you, and what is your surname?\"\nread surname\nclear\necho $firstname $surname,\
    \ how are you today?\n```\n\n# 创建 Bash 脚本 – 第 3 部分\n\n在之前的页面中，我们查看了一些基本的 Bash\
    \ 脚本编写，涉及向屏幕输出文本、获取用户输入、存储输入并将其输出到屏幕；以及使用 `Date` 命令包含变量。现在让我们结合目前所取得的成果并引入循环（Loops）。\n\
    \n在大多数编程结构中，总会有一个你需要循环遍历输入的命令以创建更好的功能，并最终实现更好的程序的时候。\n\n- **步骤 1** 现在让我们来看 `If`、`Then`\
    \ 和 `Else` 语句，执行正确时，它们会比较一组指令并简单地判断 IF 是某物， THEN 执行不同的操作。创建一个新脚本 `greeting2.sh`，并将下方截图中的文本输入其中。\n\
    \n- **步骤 3** 下一行 `ELSE` 是当变量不等于 'David' 时会发生的情况。在这种情况下，它现在只是向屏幕输出“Hello...”。最后一条语句将结束循环的。如果你有一个\
    \ `if...then` 命令但没有 `fi` 命令，你就会得到错误。\n\n![](img/383b23573296234863a9f25dc7161abc_71_0.png)\n\
    \n```bash\n#!/bin/bash\necho \"Hello, what is your name ?\"\nread firstname\n\
    echo \"Thank you, and what is your surname ?\"\nread surname\nif [ $firstname\
    \ == \"David\" ]; then\n```\n\n- **步骤 2** `Greeting2.sh` 是 `greeting` 的副本，但略有不同。我们在\
    \ `if` 语句处添加了一个循环。这意味着，如果输入的变量等于 David，下一行 `THEN` 就是对发生情况的反应，在这种情况下，它将向屏幕输出“Awesome\
    \ name”，随后是变量（即 David）。\n\n![](img/383b23573296234863a9f25dc7161abc_71_1.png)\n\
    \n```bash\n#!/bin/bash\necho \"Hello, what is your name ?\"\nread firstname\n\
    echo \"Thank you, and what is your surname ?\"\nread surname\nif [ $firstname\
    \ == \"David\" ] && [$surname == \"Hayward\" ]; then\necho \"Hello $surname\"\n\
    else echo $firstname, how are you today\n```\n\n# 更多循环\n\n你可以使用 `FOR`、`WHILE`\
    \ 和 `UNTIL` 语句来循环数据。这些对于命名、复制或运行需要计数器的脚本非常有用。\n\n### 步骤 1 创建名为 `count.sh` 的新脚本。将下方的文本输入其中，保存并使其可执行。脚本开头创建变量\
    \ `count` 等于零。然后使用 `echo` 命令打印 `count` 的当前值。\n\n### 步骤 4 `UNTIL` 循环的工作方式与 `WHILE`\
    \ 循环相同，但反向的。所以我们计数到一百，使用 `UNTIL` 将是：当 `$count` 大于 1 时，保持循环。\n\n![](img/383b23573296234863a9f25dc7161abc_72_0.png)\n\
    \n执行 `count.sh` 脚本将产生从 0 到 99 的数字；当达到 100 时脚本将结束。使用 `FOR` 语句修改脚本，它以我们想要的方式工作。在我们的脚本中使用，输入\
    \ `count.sh`。\n\n![](img/383b23573296234863a9f25dc7161abc_72_1.png)\n\n### 步骤\
    \ 3 我们这里的 `addition` 是：`for {0..100}; do`。变量 `count` 从零到一百，然后开始循环。运行此脚本，并在终端查看输出。\n\
    \n### 步骤 6 再次使用 `FOR` 序列，通过操作 `(0..100)` 部分。代码部分实际上意味着 `START..INCREMENT`；如果没有，它就是\
    \ `END`。例如，我们将循环增加到一百二。\n\n![](img/383b23573296234863a9f25dc7161abc_72_2.png)\n\
    \n# 创建 Bash 脚本 - 第 4 部分\n\n你遇到了与脚本的交互，询问用户的姓名等。你还查看了脚本中的循环，或者简单的其他内容。让我们结合并扩展更多。\n\
    \n## 选择与循环\n\n让我们引入另一个命令 `CHOICE`，以及一些嵌套的 `IF` 和 `ELSE` 语句。创建一个名为 `mychoice.sh`\
    \ 的新脚本。\n\n### 步骤 1 `mychoice` 脚本开始变得非常复杂。现在我们有四个选择，其中三个是，如果用户选择了正确的选项将显示 Awesome。如果不是，菜单将重复直到。\n\
    \n```bash\n#!/bin/bash\necho \"Please choose an option (1, 2, or 3): \"\nread\
    \ choice\nif [ $choice -eq 1 ]; then\n  echo \"Mint\"\nelif [ $choice -eq 2 ];\
    \ then\n  echo \"Echo\"\nelif [ $choice -eq 3 ]; then\n  echo \"Awesome\"\nelse\n\
    \  echo \"Please choose an option (1, 2 or 3)\"\nfi\n```\n\n步骤 3 你可以增加选择的数量，但你需要确保选择的数量与\
    \ `IF` 语句的数量匹配。屏幕可能会变得非常忙。这个长脚本是显示菜单的另一种方式，这次使用了漂亮的配色。\n\n```bash\n#!/bin/bash\n\
    echo \"Please choose an option (1, 2, 3, or 4): \"\nread choice\nif [ $choice\
    \ -eq 1 ]; then\n  echo \"Mint\"\nelif [ $choice -eq 2 ]; then\n  echo \"Echo\"\
    \nelif [ $choice -eq 3 ]; then\n  echo \"Awesome\"\nelif [ $choice -eq 4 ]; then\n\
    \  echo \"Bash\"\nelse\n  echo \"Please choose an option (1, 2, 3 or 4)\"\nfi\n\
    ```\n\n- 步骤 2 如果你遵循脚本，就能根据我们已经涵盖的内容掌握发生了什么。`WHILE` 和 `ELSE` 配合 `CHOICE` 循环语句将运行选项，如果你选择了错误的选项，它会回到起点。\n\
    \n```bash\n#!/bin/bash\necho \"Please choose an option (1, 2, 3, or 4): \"\nread\
    \ choice\nwhile [ $choice -lt 1 ] || [ $choice -gt 4 ]; do\n  echo \"Please choose\
    \ an option (1, 2, 3 or 4)\"\n    read choice\ndone\nif [ $choice -eq 1 ]; then\n\
    \  echo \"Mint\"\nelif [ $choice -eq 2 ]; then\n  echo \"Echo\"\nelif [ $choice\
    \ -eq 3 ]; then\n  echo \"Awesome\"\nelif [ $choice -eq 4 ]; then\n  echo \"Bash\"\
    \nfi\n```\n\n步骤 4 你可以使用此脚本中菜单中的箭头和按键，`choice` 是一个反馈信息的外部命令。尝试各种命令和选择，看看你能写出什么。它比我们看过的好一点，但它对可以实现什么提供了很好的想法。\n\
    \n![](img/383b23573296234863a9f25dc7161abc_73_0.png)\n\n"
