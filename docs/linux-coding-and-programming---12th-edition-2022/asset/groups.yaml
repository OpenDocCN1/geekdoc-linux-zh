    # Getting to Know Linux


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or addisation.


    - **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, Found at the bottom right of the desktop
    next to time. This launches the Update Manager.

    - **STEP 2** Linux Mint offers the user level policy to updates. Don''t Break
    My Computer, Stability and Always Update. The recommended option is Stability,
    which only updates safe patches that won''t impact critical elements of the core
    OS. Read through the descriptions but choose the middle, recommended options.

    - **STEP 3** Click the OK button and you can see a couple of updates ready for
    installation. Before update click on the blue button to switch to Local Mirror.
    This opens the Software Sources option. In the Main and Base-down menus select
    a server closest to your current location.

    - **STEP 4** Click the Update and close the Software Sources windows. In the Update
    Manager, click on Update icon and enter your password. The updates automatically
    apply themselves and relaunch Update Manager, with time more updates. Again, click
    Install Updates any messages and wait for them to finish.


    ![](img/383b23573296234863a9f25dc7161abc_33_0.png)

    ![](img/383b23573296234863a9f25dc7161abc_33_1.png)

    ![](img/383b23573296234863a9f25dc7161abc_33_2.png)

    ![](img/383b23573296234863a9f25dc7161abc_33_3.png)


    # 10 Things to do After Installing Mint


    - **STEP 5** The updates are graded by level, being a low level, level 5 being
    a dangerous one. Stick to level 3 updates, or advice; Click Reply for any messages
    regarding overwriting a configuration File. With regards to the Software Rendering
    and lack of drivers for non-VirtualBox users click the Menu and type "driver"
    into the search box.

    - **STEP 6** (Wait, the text says STEP 8) When asked to accept the changes, enter
    y and when asked to configure libdva, make sure OK is highlighted and press Enter,
    then y for any further questions. Next up, still in the Terminal: cat /proc/sys/vm/swappiness,
    the result should be 60. If your computer has less than 4GB of RAM/memory, then
    enter: gksudo xed /etc/sysctl.conf.


    ![](img/383b23573296234863a9f25dc7161abc_34_0.png)

    - **STEP 6** Click the Driver Manager that appears as a result of the search and
    enter your password. Mint takes a moments to analyze what is available and presents
    you with a selection of drivers for detected hardware. With those graphical problems,
    such as Software Rendering, opt to use the latest, recommended Graphics,

    - **STEP 7** At this point you will probably need to restart Linux Mint, so not
    after a reboot click the Terminal button. The Terminal is found in the left-hand
    column; open the Files. Now open the Terminal, enter: sudo apt-get install libdva-pkg
    press Enter and type in your password. This enables decrypted video playback.

    - **STEP 9** This tweak speeds up systems with less than 4GB RAM/memory. Scroll
    down to the bottom of the file you just opened and add the following lines:


    # Decrease swap usage to a reasonable level

    vm.swappiness=10


    Click File > Save, then Quit. Reboot Linux Mint and you should notice a slight
    lag in performance.

    - **STEP 10** Security is always a concern in this modern age. Linux Mint is a
    secure system, it is advisable to always try and improve it. Click the Menu button
    and search for Firewall; click the Firewall Configuration.icon and enter your
    password. In the Firewall window, click the Status slid to On.


    ```

    File Edit View Search Terminal Help

    daviddavid-mint ~ sudo apt get install libdva-pkg

    (sudo) password for david:

    ```


