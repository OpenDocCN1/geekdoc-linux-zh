    # 创建和删除目录


    与在终端中创建文件一样，你也可以创建和删除目录（如果你愿意也可以称为文件夹）。目录构成了文件系统的结构；如果没有逻辑目录，文件系统将陷入彻底的混乱。


    ## 管理文件夹


    如何在终端中创建和删除文件夹是 Mint（实际上是整个 Linux）的一项需要掌握的重要技能。以下是你可以尝试的基础知识。


    步骤 1：打开终端后，执行 `cd ~` 以确保你在自己的主目录（Home directory）。现在输入 `ls` 查看你当前位于主目录中的文件夹。你会发现文件夹在
    Mint 中以青色（浅蓝色）标记。让我们从创建一个目录开始。输入：`mkdir testdir`。


    步骤 3：如果你再次输入命令 `mkdir testdir`，你将收到一条消息：`mkdir: cannot create directory ''testdir'':
    file exists`。不言而喻，在当前目录下只能有一个唯一命名的目录。但是，由于 Linux 是大小敏感的，你可以拥有 `Testdir`、`testDIR`
    等。


    ![](img/383b23573296234863a9f25dc7161abc_57_0.png)


    步骤 2：如果你现在再次输入 `ls`，你会发现新目录 `testdir` 已经与主区域的其他文件夹一起被创建。显然 `mkdir` 命令是创建目录的，你已经猜出它代表
    Make Directory（创建目录）。


    步骤 4：你可以在已经创建的目录内创建子目录。例如，通过 `cd testdir/` 进入目录以列出文件夹结构。自然那里什么都没有，因为你刚刚创建了该目录。现在通过
    `cd ..` 返回主目录并输入 `mkdir reports`。返回测试目录，`cd testdir/` 并 `ls`。


    ![](img/383b23573296234863a9f25dc7161abc_57_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_57_2.png)


    # 步骤 5


    创建目录的命令是逻辑性的，因此你会创建目录。但是，如果你想在一个命令中创建目录和任何子目录，请确保你在 `cd -` 位置并使用 `mkdir -p`。


    步骤 8：现在我们已经创建了一些目录，让我们来看看删除它们。如果文件夹为空，使用 `rmdir`。如果它包含文件，你必须使用递归标记 `rm -r`。


