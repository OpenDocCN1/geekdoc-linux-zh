    ### 步骤 4 一旦创建了 /backups 文件夹，我们现在可以在其开头处创建一个新的子文件夹。添加 `mkdir -p $DEST/$day $Month\
    \ $Year*`。在这里放置与日期/月/年相关的备份文件。\n\n```bash\n#!/bin/bash\n# time stamp\nday=$(date\
    \ +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\n# Folders\ndest=~/backups\nsource=~/Documents\n\
    \nif [ ! -d $dest ]; then\n  echo \"备份文件夹不存在！我现在正在创建它...\"\n  mkdir -p $dest\n\
