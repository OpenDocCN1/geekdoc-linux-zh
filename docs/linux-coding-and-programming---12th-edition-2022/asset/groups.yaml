    ## 在虚拟环境中安装 Linux


    现在 Oracle VirtualBox 已经运行起来，接下来的任务是创建一个虚拟机（VM）环境，并在其中安装 Linux。此过程不会影响你当前安装的操作系统，这正是为什么虚拟机是一个极佳的选择。


    ## 创建虚拟机


    创建虚拟机有很多选项可以选择。现在，让我们设置一个足以运行 Mint Cinnamon 且运行良好的虚拟机。


    **步骤 1** 打开 VirtualBox 后，点击应用程序右上角的“新建”图标。这将打开新建向导。


    **步骤 3** 下一部分定义分配给虚拟机的系统内存（或 RAM）。此数量是从计算机安装的可用内存中抽取的，因此不要给虚拟机分配太多。例如，我们安装了 8GB
    内存，分配了 2GB 给虚拟机。准备好后，点击“下一步”继续：


    ![](img/383b23573296234863a9f25dc7161abc_25_0.png)


    **步骤 2** 在下一个“名称”输入框中，输入 Linux Mint，并在“版本”中输入 Ubuntu (64位)；如果不是，请使用下拉框选择正确的设置（记住
    Mint 是基于 Ubuntu 的）。准备好后，点击“下一步”。


    **步骤 4** 这一部分是你开始创建虚拟机用于安装的虚拟硬盘的地方。默认选项“创建虚拟硬盘”正是我们正在使用的。点击“创建”继续后续：


    ![](img/383b23573296234863a9f25dc7161abc_25_1.png)


    **步骤 5** 点击“创建”后会出现弹出窗口，询问你想要创建什么类型的虚拟硬盘。在这种情况下，我们将使用默认的 VDI（VirtualBox 磁盘镜像），因为其他格式用于将虚拟机从一个地方移动到另一个。确保选中了
    VDI 并点击“下一步”。


    **步骤 8** 在完成虚拟机的初始设置后；你现在应该可以在 VirtualBox 应用程序中看到新创建的虚拟机。在开始之前，点击“设置”按钮，在“常规”部分点击“高级”下拉菜单，然后将“共享剪板”和“拖放”选择为“双向”。


    ![](img/383b23573296234863a9f25dc7161abc_26_0.png)


    **步骤 6** 使用固定大小还是动态大小虚拟硬盘的问题对于初学者来说可能令人困惑：动态分配的虚拟硬盘是一个更灵活的管理选项，不会占用你硬盘中过多的空间。确保选中了“动态分配”并点击“下一步”。


    **步骤 9** 接下来点击“系统”部分，然后是“处理器”。为你的主机系统分配在承受范围内尽可能的核心；我们选择了 2 个 CPU。现在在“显示”部分，选择视频显存并点击“启用
    3D 加速”。点击“确定”进入下一步。


    ![](img/383b23573296234863a9f25dc7161abc_26_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_26_2.png)


    **步骤 7** 虚拟硬盘是一个文件夹，大小取决于你在此处指定的。你计算机上的位置应该有足够的可用空间。例如，我们在 D: 盘上使用了较大的存储选项，命名为
    Linux Mint，并为虚拟硬盘分配了 25.50GB。


    ![](img/383b23573296234863a9f25dc7161abc_26_3.png)


    **步骤 10** 点击“启动”按钮，并使用“启动”窗口中的资源管理器（带有绿色箭头的文件夹）找到下载的 Mint ISO 文件，点击启动进入 Linux
    Mint 运行环境。现在可以按照标准安装要求安装 Linux。


    ![](img/383b23573296234863a9f25dc7161abc_26_4.png)


    ![](img/383b23573296234863a9f25dc7161abc_26_5.png)


    ## 了解 Linux


    > “任何人都可以构建快速的处理器。技巧在于构建一个快速的系统。” —— 西摩尔·克雷（电气工程师，超级计算机创始人）


    ![](img/383b23573296234863a9f25dc7161abc_27_0.png)


    ![](img/383b23573296234863a9f25dc7161abc_28_0.png)


    我们使用 Linux Mint 作为指南，因为它对 Windows 用户来说是一个易发行版。它也是最先进、文档最全的发行版之一，并且有很多选择。在这一部分中，我们将介绍
    Linux Mint 菜单和桌面、它的工作原理以及你可以做什么。想创建另一个用户或发现如何上网吗？请继续往下看。


    | 页面 | 主题 |

    |---|---|

    | 30 | Cinnamon 菜单简介 |

    | 32 | 导航 Cinnamon 桌面 |

    | 34 | 安装 Mint 后做的 10 件事 |

    | 36 | 你知道吗... |

    | 38 | 创建用户 |

    | 40 | 自定义桌面 |

    | 42 | 上网 |


    ## Cinnamon 菜单介绍


    现在你已经安装了 Linux，是时候仔细观察一下了。不过，如果你正在使用 VirtualBox，你会收到一个关于“软件渲染”的通知；这里是修复方法。


    ## CINNAM VIRTUALBOX 修复


    你已经查看了一些功能，使用了插入、删除，但也有一些可以应用的功能。


    **步骤 1** 在我们开始之前，假设你是在 VirtualBox 中遇到这个问题。要修复它，点击桌面右上角的“设备”。在 VirtualBox 窗口中，选择“插入增强功能
    CD”。


    **步骤 3** 一分钟或两分钟后，你会自动进入一个命令行，称为“终端”。它会详细说明新 VirtualBox 驱动程序的安装情况，删除它已检测到的任何旧驱动程序，并安装新驱动程序。完成后，将提示你重启。


    ![](img/383b23573296234863a9f25dc7161abc_29_0.png)


    ```

    File Edit

    Uncompressing VirtualBox...

    Copying modules...

    vboxguest-additions to...

    ```


    ![](img/383b23573296234863a9f25dc7161abc_29_1.png)


    **步骤 2** 增强功能 CD 已经加载。**步骤 4** 修复问题后，将鼠标悬停在右侧的任何应用并右键点击，弹出一个选项列表：添加到面板、添加到桌面、添加到收藏和卸载。大多数选项的用法都一而易见。


    ![](img/383b23573296234863a9f25dc7161abc_29_2.png)


    ![](img/383b23573296234863a9f25dc7161abc_29_3.png)


    ## Cinnamon 菜单介绍


    现在你安装了 Linux，VirtualBox 的软件渲染问题已经解决了，它与其他发行版的表现可能有所不同。


    **步骤 1** 首先，当你登录 Linux Mint 时，会看到一个欢迎界面。花点时间浏览一下选项。完成后，点击右上角的 X 关闭它。


    ![](img/383b23573296234863a9f25dc7161abc_30_0.png)


    **步骤 2** 你已经在使用 Mint 了，点击中间的“办公”项。这将更改右侧列显示的图标，详细说明该部分下安装了哪些应用。


    ![](img/383b23573296234863a9f25dc7161abc_30_1.png)


    **步骤 5** 如果你想寻找特定的功能或应用（例如设置打印机），点击菜单顶部的搜索框。输入你想要的应用或功能，Mint 菜单就会显示相关选项。这适用于大多数
    Linux 发行版。


    ![](img/383b23573296234863a9f25dc7161abc_30_2.png)


    **步骤 3** 从菜单启动任何应用都只需找到并点击它。例如，在“办公”部分，点击“Office Writer”。Writer 是 Linux Mint 预装的文字处理器。它可以打开并保存为
    Microsoft Word 格式，功能几乎相同。


    ![](img/383b23573296234863a9f25dc7161abc_30_3.png)


    **步骤 6** 将鼠标悬停在右侧列出的任何应用上并右键点击，即可获得选项：添加到面板、添加到桌面、添加到收藏和卸载。大多数选项的用途都显而易见，“添加到收藏”会将应用放在左侧的快速访问列。


    ![](img/383b23573296234863a9f25dc7161abc_30_4.png)


    ![](img/383b23573296234863a9f25dc7161abc_30_5.png)


