    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not for all tasks.
    Understanding how to use the command line not only builds your understanding of
    Linux but also improves your knowledge of coding and programming in general. Our
    command line quick reference guide is designed to help you master Linux quicker.


    # TOP 10 COMMANDS


    These may not be the most commonly used by everyone but will certainly feature
    frequently for many users of Linux and the command line.


    +   - cd: The cd is one of the commands you will use the most at the command line
    in Linux. It allows you to change your working directory. Use it to move around
    within the hierarchy of your file system. You can also use chdir.


    +   - mv: The mv command moves a file to a different location or renames a file.
    example mv file sub renames the original file to sub, mv sub ~/Desktop moves the
    file ''sub'' to your desktop directory but does not rename it. If you must specify
    a new name to rename it.


    +   - ls: The ls shows the files in your current directory. With certain options,
    it lets you see sizes, file when created and file permissions. For example ls
    -l shows the files that are in your home directory.


    +   - chmod: The chmod changes the user and/ group ownership of each file. If
    only one owner (a name or numeric ID) is given, that changes the owner of each
    file, and the files'' group is not changed.


    +   - cp: The cp command is used to make copies of files and directories. For
    example, cp file sub makes an copy of the file you entered and names the copy
    but the first file will still exist with its original name.


    +   - chmod changes the permissions on the files listed. Permissions are based
    on a simple model. You can set permissions for user, group and world and you can
    set whether each can read, write and execute the file.


    +   - The pwd command prints the full pathname of the current working directory
    (pwd stands for “printing directory”). Note that the Gnome terminal also displays
    this in the title bar of windows.


    +   - The rm command (deleted) files and directories. The removal process unlinks
    a file in a filesystem from that storage device and marks space as usable by future
    times. In other words, removing files increases the amount of available space
    on your disk.


    +   - The clear clears your screen if you are in the environment of the terminal
    and then in the terminfo database to figure out, how to clear the screen. It is
    equivalent to typing Control-L when using the bash shell.


    +   - Short for “make directory”, mkdir is used to create directories in a file
    system, if the specified directory does not exist. For example, mkdir creates
    a work directory. More than one directory may be specified when calling mkdir.'
