    \    cout << \"Greetings from C++!\\n\";\n}\n```\n\n注释时要小心，尤其是使用块注释 `/* ... */`，很容易忘记添加结束的星号和斜杠，从而导致注释块内的任何代码失效：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    // 我的第一个\
