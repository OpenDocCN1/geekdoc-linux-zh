  md: '# Pi x Linux =

    The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential

    it needs a remarkable operating system. Frankly, Linux is the default and

    recommended OS of choice for the Pi, and together they make a much more winning
    team.


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of

    hardware that could offer more than simply a cheap, small, computer.


    The Pi needed to be flexible with what it could do, it needed to have

    room to grow into more ambitious project concepts and ideas, and

    it needed to do so in easy to use fashion as possible. The goal was

    to create a universal learning platform, that students of any age

    could interact with, while learning new concepts as

    programming, electronics, and computing. Naturally, once

    the hardware was ready, the only real choice of

    operating system was Linux.


    The versatility of Linux is legendary. This incredible

    core OS is so malleable that it can be steered

    toward near any aspect of computing, from

    supercomputing to robotics, the space industry to

    to terrestrial engineering; education and

    science, manufacturing and the Internet.

    Think of an industry, and you will likely

    find a Linux installation anywhere in the

    background keeping it all together.


    ![](img/383b23573296234863a9f25dc7161abc_77_0.png)


    Raspian is the recommended operating system for the Raspberry Pi

    a customised Debian-based distribution that comes packed with

    a collection of useful tools that cater for coding, electronics, and

    general desktop computing duties. Alongside the apps are pre-

    loaded modules to help you get the most from it, including of programming

    languages you decide to learn and use, as well as software

    hardware modules that will enable you to power and use the

    hardware items unique to the Pi. For example, there are

    Python modules that interact with the Raspberry Pi''s 40 GPIO,

    allowing you to create content for any of the Hardware Attached on

    Top devices.


    This combination is what makes the Raspberry Pi an excellent base

    of operations to learn not only coding, but also Linux in.

    Raspian, being Debian-based, will be able to run any of the

    Terminal commands listed in this book, as Linux, Mint and

    Buntu are also Debian-based. And since it goes

    , costs very little setup, you''ll be able to have both

    regular, Windows or macOS computers, and have a Raspberry Pi

    a headless (a powered device that doesn''t need a keyboard, or mouse

    itor attached, as you can connect to it) computer from which

    you can connect and learn how to use Linux and how to code.


