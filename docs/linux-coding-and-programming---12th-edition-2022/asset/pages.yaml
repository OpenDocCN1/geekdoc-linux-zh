  md: "# # USER ERROR\n\nUser input is often a paralysing mistake in code. For example,\
    \ when the user is supposed to enter a number for their age and they enter it\
    \ letters. Often a user can enter into such input that overflows internal buffer,\
    \ thus causing the crash. Watch those user inputs and clearly state what is needed\
    \ from them.\n\n```\nEnter an integer\nnumber\nYou have entered wrong input\n\
    You have entered wrong input\nyet\nYou have entered wrong input\nsdf221231213\n\
    12322n223n223y2323\nYou entered wrong input\nthe number is: 12\nProcess returned\
    \ (0x0) execution time : 2.495 s\nPress any key to continue.\n```\n\n# # BACKUPS\n\
    \nAlways make a backup of your work, with a secondary backup for all changes you've\
    \ made. Mistakes can be rectified if there's a good backup in place to revert\
    \ to if something goes wrong. It's much easier to start you here rather than starting\
    \ from the beginning.\n\n![](img/383b23573296234863a9f25dc7161abc_144_0.png)\n\
