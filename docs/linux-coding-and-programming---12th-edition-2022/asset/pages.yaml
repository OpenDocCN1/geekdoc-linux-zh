  md: '# Getting to Know Linux


    # # 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    +   STEP 1 The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, Found at the bottom right of the desktop
    next to time and date. This launches the Update Manager.


    +   STEP 3 Click the OK button and you can see a couple of updates ready for installation.
    Before you update click on the blue bar OK button to switch to a Local Mirror.
    This opens the Software Sources option. In the Main and Base drop-down menus select
    a server closest to your current location.


    ![](img/383b23573296234863a9f25dc7161abc_33_0.png)


    +   STEP 2 Linux Mint offers the user three level policy approach to updates.
    Don''t Break My Computer, Optimability Stability and Security Always Update. The
    recommended option is the Optimability and Stability, which only updates safe,
    essential patches that won''t impact critical elements of the core OS. Read through
    the descriptions but choose the middle, and recommended options.


    +   STEP 4 Click the Update cache and close the Software Sources windows. In the
    Update Manager, click on the Update icon and enter your password. The updates
    automatically apply themselves and relaunch Update Manager, with time a more updates.
    Again, click Install Updates, any messages and wait for them to finish.


    ![](img/383b23573296234863a9f25dc7161abc_33_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_33_2.png)


