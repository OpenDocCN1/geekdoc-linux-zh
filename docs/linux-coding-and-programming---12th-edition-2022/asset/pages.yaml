  md: '# # Installing Linux on a PC


    Most Linux distros come as a Live Environment. This means you can boot into an
    actual, fully-working distro straight from the DVD or USB that you created. Let''s
    see how that works and how you can go installing Linux from there.


    # ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    +   * **STEP 1** Insert your USB or flash drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''re using the USB media but the
    process is visually identical. Start the PC and prompt the keys to enter the BIOS
    or SETUP, which could be: F2, Del or F12.


    +   * **STEP 3** With UEFI turned to legacy mode, there are ways of booting into
    the Live Environment. First is via the BIOS you''re already in. Locate the Boot
    Sequence and change the first boot device from its original setting, usually Internal
    HDD or similar, to: USB Storage Device for the USB media, or DVD Drive for the
    media option.


    ![](img/383b23573296234863a9f25dc7161abc_21_0.png)


    +   * **STEP 2** There are differences between a UEFI BIOS, so covering all would
    be impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you need to turn off UEFI and choose Legacy Boot. Most modern
    distros with UEFI can be a bit tricky to install out of.


    +   * **STEP 4** Alternatively use the Boot Option Menu. With this you can press
    F2 (or something similar) to display a list of boot media options; from there
    you can choose the appropriate boot media. Here you can now Save and Exit the
    BIOS by navigating to the Save & Exit option and choosing ''Save and Changes''


    ![](img/383b23573296234863a9f25dc7161abc_21_1.png)'
