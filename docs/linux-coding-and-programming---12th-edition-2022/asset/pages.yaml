    being played out, all in ASCII. To view this spectacle, enter: telnet towel.blinklights.nl.


    +   The rev command is certainly interesting, and at first what seems a kinda
    useless addition to the OS. It can be used to create some seemingly unbreakable
    passwords. Enter rev, now type some text, when you press Enter everything will
    be in reversed. Press Ctrl+C


