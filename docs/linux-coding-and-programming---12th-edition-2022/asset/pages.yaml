  md: "# Data Types\n\nVariables, as you've seen, store information that the programmer\
    \ can later call up, and manipulate if required. Variables are reserved memory\
    \ locations that store values the programmer assigns, depending on the data type\
    \ used.\n\n# THE VALUE OF DATA\n\nThere are many different data types available\
    \ for the programmer in C++, such as an integer, floating, Boolean, character\
    \ and so on. It's widely accepted that there are seven basic data types, often\
    \ called Primitive Built-In Types; however, you can create your own data types\
    \ should need ever within your code.\n\nby adding a cout.precision() function\
    \ and adding a value inside the brackets then you're still limited by the accuracy\
    \ of double data type. For example, try this:\n\n| Type | Command |\n|---|-|\n\
    | Integer | int |\n| Floating Point | float |\n| Character | char |\n| Boolean\
    \ | bool |\n| Double Point | double |\n| Wide Character | wchar_t |\n| Void |\
    \ void |\n\n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979238463;\n\
    \nint main() {\n    cout << PI;\n    return 0;\n}\n```\n\nThese basic types can\
    \ also be extended using the modifiers. Long, Short and Signed. This means the\
    \ modifiers can expand the minimum and maximum range values for each data type.\
    \ For example, an int type has a default value range of -2147483648 to 2147483647,\
    \ a fair value, you could use.\n\nNow, if you were to use one of the modifiers,\
    \ the alters:\n\n+   unsigned int = 0 to 4294967295\nSigned int = -2147483647\n\
    Short int = -32768 to 32767\nunsigned Short int = 0 to 65535\nSigned Short = -32768\
    \ to 32767\nLong int = -2147483648 to 2147483647\nSigned Long = -2147483648 to\
    \ 2147483647\nunsigned Long = 0 to 4294967295\n\nNaturally you can use any of\
    \ the basic type with the modifier, there's plenty of range provided with each\
    \ data type. However, it's considered C++ programming practise to use the modifiers\
    \ when possible.\n\nThere are issues with these modifiers. Double represents a\
    \ double-floating value, which you can use for incredibly accurate numbers but\
    \ these numbers are only accurate up to the fifteenth decimal place. There's also\
    \ the problem when displaying numbers in it using the cout function, in that case\
    \ can output only the first few decimal places. You can combat\n\n```\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979238463;\n\nint\
    \ main() {\n    cout.precision(22);\n    cout << PI;\n    return 0;\n}\n```\n\n\
    Build and run the code as you see the output is 3.14159, representing cout's limits\
    \ in this example.\n\nYou can also use the aforementioned cout.precision function,\
    \ for greater accuracy. Take all value up to 22 decimal places, with the following\
    \ code:"
