  md: "# # Conditions and Loops\n\nConditions and loops are what make a program interesting;\
    \ they can be simple or rather complex. How you use them depends greatly on what\
    \ the program is trying to achieve; they could be the number of lives left in\
    \ a game or just displaying a countdown.\n\n# TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with makes learning to program a more enjoyable experience.\
    \ Let's start then by checking if something is true, then doing something else\
    \ it's not.\n\n+   **STEP 1** Let's create a new Python program that will ask\
    \ the user to input a word, then de start with File > New, and begin with the\
    \ input variable:\n\n```\nword=input(\"Please enter a four-letter word: \")\n\
    ```\n\n![](img/383b23573296234863a9f25dc7161abc_111_0.png)\n\n+   **STEP 3** Now\
    \ you can use an if statement to check if the word, length variable is equal to\
    \ four and print a friendly condition if it follows the rule:\n\n```\nword_input=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length==4:\n\
    \    print(\"word, is a four-letter word. Well done.\")\n```\n\nThe double equals\
    \ sign (==) means if something is equal to\n\n![](img/383b23573296234863a9f25dc7161abc_111_1.png)\n\
    \n+   **STEP 2** Now we can create a new variable, then use len function and pass\
    \ the word through it to get the total number of letters the user has entered:\n\
    \n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n\n![](img/383b23573296234863a9f25dc7161abc_111_2.png)\n\n+   **STEP 4** The\
    \ colon at end of if tells Python that this is true everyone after the colon is\
    \ indented, move cursor back to the beginning of the Editor:\n\n```\nword_input=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length==4:\n\
    \    print(\"word, is a four-letter word. Well done.\")\nelse:\n    print(\"word,\
    \ is not a four-letter word.\")\n```\n\n![](img/383b23573296234863a9f25dc7161abc_111_3.png)"
