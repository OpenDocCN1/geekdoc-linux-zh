  md: "# Variables\n\nSTEP 5 You assign a value to a variable as soon as you declare\
    \ it. The code you've typed in could look like this\n\n```\nint a = 10;\nint b\
    \ = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/383b23573296234863a9f25dc7161abc_132_0.png)\n\
    \nSTEP 8 The previous steps create the variableStartLives, which is a global variable.\
    \ In a game, for example a player's lives go up or down depending on how well\
    \ or bad they're doing. When the player restarts the game, the StartLives returns\
    \ to its default 3. Here we assigned 3 lives, subtracting one when leaving lives\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n  StartLives =\
    \ 3;\n  cout << StartLives;\n  return 0;\n}\n```\n\n![](img/383b23573296234863a9f25dc7161abc_132_1.png)\n\
    \nSTEP 6 Specific to C++, you can also use the following to assign values to a\
    \ variable as soon as you declare:\n\n```\nint a (10);\nint b (5);\n```\n\nThen,\
    \ from the C++ 2011 standard, using curly brackets:\n\n```\nint result = {a+b};\n\
    ```\n\nSTEP 9 The modern C++ compiler is far more intelligent than most programmers\
    \ give credit for. The new data types you can declare, for you can use its feature:\n\
    \n```\n#include <iostream>\nusing namespace std;\nauto pi = 3.14159;\nint main()\
    \ {\n  double area = 1.5;\n  area = pi * radius;\n  cout << area;\n}\n```\n\n\
    ![](img/383b23573296234863a9f25dc7161abc_132_2.png)\n\nSTEP 7 You can create global\
