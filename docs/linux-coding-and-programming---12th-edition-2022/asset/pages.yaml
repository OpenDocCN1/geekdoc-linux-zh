    write(\Your Total Score is: "totalScore")

    ```


    # //COMMENTS


    Use comments, your code saves so many problems when you come next to look over
    it. Inserting comments of code helps you quickly get through messy code that are
    causing problems; also useful if you need to review an older piece of code.


