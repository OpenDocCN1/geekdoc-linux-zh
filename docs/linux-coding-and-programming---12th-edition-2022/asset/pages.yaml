  md: '# The Best Linux Distributions


    # ARCH


    Arch is one of longest running Linux distributions and forms the basis of many
    other versions of Linux. Why install Mint or Ubuntu when you can? Arch? Many users
    do exactly that it is not ideal for beginners. Ubuntu and Mint both offer an installation
    path and come with software packages to get started.


    ![](img/383b23573296234863a9f25dc7161abc_10_0.png)


    Arch is a distro for when you''re more experienced with Linux. You start with
    nothing but the command line and there you have to partition your hard drive,
    set the installation files, create a user, set the OS locale and finally install
    a desktop environment with all the you want.


    Arch on the other hand, is a more ''bare bones'' affair. Arch is committed to
    provide free software and its repositories contain over 50,000 apps to install,
    including multiple different Desktop environments, and as you would use with any
    distro.


    The advantage though, for all this hard work, is a distro that you have created.
    Your Arch distro doesn''t come with all the necessary files and apps that others
    have preinstalled-it''s custom made for you, by you.


    ```

    www.archlinux.org

    ```


    # RASPBERRY PI DESKTOP


    # OPENSEUSE


    No doubt you'' fear of the Raspberry PI. It''s hard not to have, as this remarkable,
    tiny computer has the technology to win world for the last six years since it
    was introduced.


    ![](img/383b23573296234863a9f25dc7161abc_10_1.png)


    There are several aspects to the Raspberry PI thatat make it such a sought after
    piece of the computing world. For it''s cheap, costing around £25 for what is
    essentially a fully working computer. it''s small, measuring not much bigger than
    a credit card. You build electronics with it: a fully programmable interface,
    and it comes with Raspberry, and its custom-made, Debian-based operating system
    that includes an office suite alongside many different languages and educational
    resources.


    Most Linux distributions fall into two camps. There are ones with the latest features
    like Ubuntu and Mint and those with new features but solid reliability, Debian.


    Raspian is exclusive to the hardware, since the Raspberry PI uses an ARM processor
    to power it. However, the Raspberry Foundation has since released a PC version
    of Raspberry: Raspberry OS.


    Meanwhile, openSUSE attempts to cover both bases. OpenSUSE is the rock solid system,
    developed by a community along with SUSE employees, who develop an enterprise-level
    operating system; SUSE: powers the London Stock Exchange among others. It is designed
    for mission critical environments where ''there''s no scope for instability. If
    you find all that sensible, openSUSE Tumbleweed rolling release with all the latest
    features, and the occasional crash.


    Just like version, Raspberry PI Desktop comes with all the coding, education and
    other apps you will ever need. It''s quick, stable and works superbly. If you''re
    interested in stretching your Linux, then this is certainly one of the top distros
    to consider.


    openSUSE is a highly respected Linux distribution and many of its core contributors
    work on the Linux Kernel, LibreOffice, Gnome and other key areas. In fact, openSUSE
    is what you''ll find pros among.


    ```

    www.raspberrypi.org/downloads/raspberry-pi-desktop

    ```


    ![](img/383b23573296234863a9f25dc7161abc_10_2.png)


    www.openSUSE.org'
