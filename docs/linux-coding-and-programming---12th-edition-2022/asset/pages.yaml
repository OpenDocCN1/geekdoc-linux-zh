  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're ready to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to prompt a user response.\n\n+   * STEP 1 Any that\
    \ you want the user to input the program needs to be stored somewhere in the system\
    \ memory, so it can be retrieved and used. Therefore, any input must be declared\
    \ as a variable, so it's ready to be used by the user. Start by creating a C++\
    \ file with headers.\n\n+   * STEP 3 The cin command works in the opposite way\
    \ from the cout command. With the first cout line 'what is your age to the screen,\
    \ as indicated with the chevrons. Cin opposes facing chevrons, indicating an input.\
    \ The input is put into the integer age and called up in the second cout count.\
    \ Build and run code.\n\n```\n#include <iostream>\nusing namespace std;\n\nint\
    \ main() {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n\
    \    cout << \"You are \" << age << \" years old.\\n\";\n    return 0;\n}\n\n\
    ```\n\n| File Edit Tabs Help |\n| what is your age: 45 You are 25 years old. |\n\
    \n> > (program exited with code: 0)\n return to continue\n\n+   * STEP 2 The data\
