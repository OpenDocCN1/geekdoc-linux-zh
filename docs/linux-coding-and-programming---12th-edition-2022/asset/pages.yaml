  md: '# # How to Set Up Python in Linux


    # ### STEP 5


    However, if you want the latest, cutting edge

    version, you need to build Python from source. Start

    by entering these commands into the Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libsqlite3-dev

    libcursesw5-dev libsqlite6-dev tk-dev

    libdbm-dev libdbm-db2-dev

    ```


    # ### STEP 8


    Within the Python folder, enter:

    ./configure

    sudo make altinstall


    This could take a while depending on the speed of your computer.

    Once finished, use python3.7 --version to check if the

    latest version is installed. You now have Python 3.7 alongside

    older Python 3.x and Python 2.


    ![](img/383b23573296234863a9f25dc7161abc_90_0.png)


    # ### STEP 6


    Open your Linux web browser and go to

    The Python download page: www.python.org/

    downloads. Follow the link you have downloaded from the

    Python Source. This opens a new download page;

    choose a location and download the source.


    ![](img/383b23573296234863a9f25dc7161abc_90_1.png)


    # ### STEP 9


    For the GUI, you will need to enter the

    command to the Terminal:

    sudo apt-get install idle3


    The IDE can be started with the latest idle 3. Note

    IDLE runs a different version from the one you installed from.


    # ### STEP 7


    In the Terminal, go to the folder containing the

    downed Python source code; run: tar -xzf Python-

    3.Y.Y.tar.gz replacing the Y with the version you

    ''ve downloaded. Now enter the unzipped folder with

    Python-3.Y.Y/


    # ### STEP 10


    You also need PIP (Installs Packages) which is a

    tool to help install more modules and extras.

    sudo apt-get install python3-pip


    When PIP is installed, check for the latest update:

    pip install --upgrade pip

    When complete, the Python and Python 3.x will be available

    for programming in your method.


    ![](img/383b23573296234863a9f25dc7161abc_90_2.png)'
