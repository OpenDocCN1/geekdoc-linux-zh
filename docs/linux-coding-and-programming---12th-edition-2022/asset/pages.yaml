  md: '# Getting Started with Linux


    # # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    it can mimic a standard PC and install any other operating system to it without
    affecting the one installed on your computer. It''s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    GOING VIRTUAL

    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each commencing.


    +   **STEP 1** We''re using VirtualBox in this instance, as it''s one of the easiest
    virtual environments to get grips with. Enter www.virtualbox.org and click on
    ''Download VirtualBox''. This takes you to the main download page. Locate the
    correct host for your system (Windows, macOS, Mac, Host being installed operating
    system) and click the link to begin the download.


    +   **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host a VM. To
    do this, reboot the computer and enter the BIOS. When the computer starts up,
    press the Del, F2 or whichever is key to Enter Setup.


    ![](img/383b23573296234863a9f25dc7161abc_23_0.png)


    +   **STEP 2** Next, while you visit the VirtualBox download page, locate the
    VirtualBox Extension Pack link. The Extension packs support USB devices as well
    as numerous extras that help make the VM environment, much another experience
    of a ''real'' computer.


    +   **STEP 4** Each BIOS is laid out differently and it''s very difficult to assess
    where to look in each personal example. However, as a rule of thumb, you''re looking
    for Virtualisation technology, or simply Virtualisation, found within the Advanced
    section of the BIOS. When you enable it, save the settings and reboot your computer.


    ![](img/383b23573296234863a9f25dc7161abc_23_1.png)


