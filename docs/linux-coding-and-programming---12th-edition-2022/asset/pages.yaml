  md: "# Strings\n\nStrings are objects that represent and hold sequences of characters.\
    \ For example, you could have a universal greeting in your code 'Welcome' and\
    \ assign that as a string to be called wherever you like in the program.\n\n#\
    \ STRING THEORY\n\nThere are different ways in which you can create a string of\
    \ characters, historically are all carried over from the original C language and\
    \ supported by C++.\n\n+   STEP 1 To create a string, use the char function. Open\
    \ a new C++ file and begin with the usual header:\n\n+   STEP 3 Build and run\
    \ the code 'Welcome' appears on the screen. While this is perfectly fine, it's\
    \ not a string. A string is a class, which defines objects that can be represented\
    \ as a stream of characters and doesn't need to be terminated like an array. The\
    \ code can therefore be represented as:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main ()\n}\n```\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main () {\n  char greet[] = \"Welcome\"\n  cout << greet << \"\\n\";\n}\n\
    ```\n\n```\nstrings.cpp\n#include <iostream>\nusing namespace std;\nint main ()\n\
    }\n```\n\n+   STEP 2 It's easy to confuse a string with an array. Here's an array,\
    \ which can be terminated with a null character:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main ()\n```\n\n```\nchar greet[8] = {'W', 'e', 'l',\
    \ 'c', 'o', 'm', 'e', '\\0'};\ncout << greet << \"\\n\";\n```\n\n```\nstrings.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n  char greet[] = \"Welcome\"\
    \n  cout << greet << \"\\n\";\n}\n```\n\n+   STEP 4 In C++ there's also a string\
    \ function, which works in the same way. Using the greeting code,\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main ()\n```\n\n```\nstring greet = \"\
    Welcome\"\ncout << greet << \"\\n\";\n```\n\n```\nstrings.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n  string greet = \"Welcome\"\n  cout << greet\
    \ << \"\\n\";\n}\n```"
