    a powerful command and combines different elements upon its use.


    +   - **STEP 1** Start by opening a Terminal or if you already have one open clear
    the clear command. This starts off with a clean slate to work on.


    +   - **STEP 3** Apt-get is used to update and upgrade the software in Mint, as
    well as Ubuntu and Debian-based distros. Using the Update element retrieves new
    packages and lists the list of source files. Upgrade downloads and performs an
    upgrade to the latest versions of files. To start the Upgrade process, enter:
    `sudo apt-get update`, followed by your password.


