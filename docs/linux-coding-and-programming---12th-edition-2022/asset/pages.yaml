    david@david-mint ~ -testdir

    ls


    ```


    ![](img/383b23573296234863a9f25dc7161abc_58_0.png)


    # STEP 6


    The -p option is what enables mkdir to create the sub-directory as well as the
    parent directory. In Linux, commands follow the same structure as: Command, Option,
    and Argument. In the previous step example, Command (mkdir), option (-p), and
    argument (Temp/finances).


    # STEP 9


    A quick warning: removing a directory in the Terminal doesn''t place it in the
    Mint Rubbish Bin, via Nemo file manager. The same goes for any files, if you remove
    a directory from the Terminal then it''s gone for good.


    ```

    File Edit View Search Help

    david@david-mint $ mkdir -p Temp/finances

    ```


    ![](img/383b23573296234863a9f25dc7161abc_58_1.png)


    # STEP 7


    If you want to drill into the options available for the mkdir command, you can
    enter mkdir --help to the Terminal. This will provide a quick help detailing the
    options and how the command works.


    ```

    File Edit View Search Help

    david@david-mint ~ mkdir --help

    david@david-mint ~ if they do not already exist.

    create DIRECTORY(name, [mode])

    mode set file mode (in mode); unset

    -verbose print message for each created directory

    -verbose print created directory

    --context [-X] , or if -X is not specified by the SELinux

    --help display help information and exit

    --version display version information


    ```


    # STEP 10


    Rmdir will only remove empty directories, to remove directories containing subdirectories,
    or files, if you need to use the command rm with -R option. rm -R Temp. For example,
    in the TestFinancedirectory, use rm -R all of its contents. A reveal is that if
    the folder is empty you can remove it without careful when.


