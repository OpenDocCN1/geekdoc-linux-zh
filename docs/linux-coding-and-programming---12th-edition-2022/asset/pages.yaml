  md: '# # Working with Variables


    We''ve seen some examples of variables in our Python code but it''s always worth
    going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # ## VAR VARIABLES


    You''ll be working with the Python 3 IDLE Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up your
    old code.


    +   STEP 1


    ```

    >>> name="David Howard"

    >>> print(name)

    David Howard

    ```


    ![](img/383b23573296234863a9f25dc7161abc_105_0.png)


    You''ve seen previously that variables can be concatenated with with the plus
    symbol between the variable names. In our example we can use: `print(name + ":
    " + title)`. The middle part between the quotations allows us to add a colon and
    a space, as variables are connected without spaces, so we need to add them manually.


    ```

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> print(name + ": " + title)

    David Howard: Descended from Vikings

    ```


    +   STEP 3


    You can change the type of variable in use by issuing the `type ()` command, placing
    the name of the variable inside the brackets. In this case it would be `type(name)`.
    Add a new string variable: `title="Descended from Vikings"`.


    ```

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> type(name)

    class ''str''

    >>> type(title)

    class ''str''

    ```


    +   STEP 4


    You can also combine variables within another variable. For example, to combine
    both name and title into a new variable we use:


    ```

    >>> name="David Howard"

    >>> title="Descended from Vikings"

    >>> full_name = name + ": " + title

    >>> print(full_name)

    David Howard: Descended from Vikings

    ```


    Then output the content of the new variable as:


    ```

    print (character)

    ```


    Numbers are stored as different variables:


    ```

    age=44

    Type (age)

    ```


    Which, as we know, are integers.'
