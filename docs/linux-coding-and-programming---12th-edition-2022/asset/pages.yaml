  md: "# Creating Bash Scripts - Part 4\n\nOne of the most well used examples of Bash\
    \ scripting is the creation of a backup routine, that automates the task as adding\
    \ some customisations along the way.\n\nA basic backup script would look something\
    \ along the lines of: /bin/bash, then tar cvzf~/backups/my-backup.tgz ~/Documents/.\
    \ This will create a compressed file of the ~/Documents folder, with everything\
    \ in it, and put it in a folder named /backups with my name-backup.tgz.\n\nSTEP\
    \ 4 Once the /backups folder is created, we can now create a new subfolder within\
    \ it at the beginning. Add mkdir -p $DEST /$day $Month $Year*. It's here that\
    \ you put the backup file relevant to date/month/year.\n\n```\n```bash\n#!/bin/bash\n\
    # time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\n# Folders\n\
    dest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n  echo \"Backup\
    \ folder does not exist! I am now creating it...\"\n  mkdir -p $dest\nfi\n\ntar\
    \ -cvzf $dest/$day$month$year.tgz $source\necho \"Backup done!\"\n-s\n```\n```\n\
    \nSTEP 2 While perfectly fine, we can make the script better with some variables.\
    \ Enter the text in the screenshot into a new bash script. Note that we've misspell\
    \ 'sauce' as 'as', this is because lately an error in basic command 'source' will\
    \ cause something different on our part.\n\nSTEP 5 With everything in, you can\
    \ now enter the actual backup routine, on the tar command from Step 5. Combined\
    \ with the variables, you have to use cvzf $dest/$day$month$year/Documents.Backup.tgz\
    \ In the screenshot, we added a handy \"Backing up...\" message.\n\n```\n```bash\n\
    #!/bin/bash\n# time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\
    \n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n \
    \ echo \"Backup folder does not exist! I am now creating it...\"\n  mkdir -p $dest\n\
    fi\n\ntar -cvzf $dest/$day$month$year.tgz $source\necho \"Backup done! Please\
    \ wait...\"\n-s\n```\n```\n\nSTEP 3 The previous script allows you to create a\
    \ Time Stamp, so you know when the backup was made. You created a 'dest' variable,\
    \ which is where the backup file will be created (~/backups). You can add a line\
    \ of code to check if ~/backups folder exists, if then creates it.\n\n```\n```bash\n\
    #!/bin/bash\n# time stamp\nday=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n\
    \n# Folders\ndest=~/backups\nsource=~/Documents\n\nif [ ! -d $dest ]; then\n \
