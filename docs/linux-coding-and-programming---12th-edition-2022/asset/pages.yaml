  md: '# Using the Terminal


    # Fun Things to do in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    # TERMINAL FUN


    You''ll be working exclusively in the Terminal for these next two sections, so
    start warming your fingers. After all, all work and no play... as the saying goes.


    +   The first command we''re going to use is sl, it''s not installed by default
    so enter: sudo apt-get install sl. The command can be run with sl and when executed
    will display a Steam Locomotive travelling across the screen (''sl''). Entering
    LS, note the upper case, also works.


    +   If you''ve ever fancied having the computer read a random fortune out to you,
    then you''re in luck. Most distractors require you to install the fortune app,
    Linux Mint differs by having it already pre-loaded. All you need to do is enter
    the command Fortune in the Terminal, and enjoy.


