    # ## EASY AUTOMATION AND HANDY SCRIPTS


    Entering line after line of commands to retrieve system information, a file or
    rename a batch of files? A script is better answer.


    +   **STEP 1** Let''s try by creating a script to display the Mint system information;
    always a thing to have. Create a new script called sysinfo.sh and enter the into
    Zed, or the text editor of your choice.


    ```

    # sysinfo x

    # information:

    hostname:

    echo $(hostname) | grep HOSTNAME


    # file disk space usage

    echo $(df -h) | grep DISK SPACE


    # free and used memory

    echo $(free -m)


    # update and performance load

    echo $(uptime) | grep "load"


    # users currently logged in

    echo $(who) | grep USERS


    # Top five processes used by the system

    ps aux | sort --%mem | head -n 5

    ```


    +   **STEP 3** Each of the sections runs a different Terminal command, outputting
    the results amended. You can include a lot more, such as the current aliases used
    in the system, the current time and date to on. Plus, you could also pipe all
    information into a handy HTML file, ready to be viewed in a browser.


    ```

    david@david-mint ~/scripts $ > sysinfo.html

