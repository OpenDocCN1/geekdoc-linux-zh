  md: "# Structure of a C++ Program\n\nCOMMENTS Lines that begin with a double slash\n\
    comments. This means they won't be\nexecuted and are ignored by the compiler.\
    \ Comments\ndesigned to help you, or another programmer looking at\ncode, explain\
    \ what's going on. There are two types of comment:\n/* multiple line comments\
    \ and // single line.\n\n<< The two chevrons used here are insertion operators.\n\
    This means that whatever the chevrons is\ninserted into the std:: statement. In\
    \ this case they're the\n'Hello, world!' which to be displayed on the screen when\n\
    compile and execute the code.\n\n```\nhelloworld.cpp x\n1 #include <iostream>\n\
    2\n3 int main()\n4 {\n5   //My first C++ program\n6 \n7 \n8 <<\n9 }\n```\n\n```\n\
    1 #include <iostream>\n2 using namespace std;\n3\n4 int main()\n5 {\n6   //My\
    \ first C++ program\n7 cout <<\n8 \n9 }\n```\n\nSTD While stands for something\
    \ quite different, in C++ it\nStandard. It is part of the Standard Name in\nC++,\
    \ covers a number of different statements and commands.\nYou can leave the std::\
    \ out of the code but it must\ndeclared at the start using namespace std, not\
    \ both. for\nexample:\n\nOUTPUTS Leading on, the \"Hello, world! part is what\
    \ you\\want to appear on the screen when you like, as long as it's the\nquot marks.\
    \ Sometimes brackets are needed, depending on\nthe compiler. The << part adds\
    \ a new line to be inserted.\n\n#include <iostream>\nusing namespace std;\n\n\
    ```\nhelloworld.cpp x\n1 #include <iostream>\n2\n3 int main()\n4 {\n5   //My first\
    \ C++ program\n6 std::cout << \"Hello, world!\\\"\n7 \n8 }\n```\n\n```\n//My first\
    \ C++ program\ncout << \"Hello, world!\\\"\n```\n\nCOUT In this example we use\
    \ cout, which is a part of\nthe Standard Name, hence why it's there, as\ny're\
    \ asking to use it from that particular statement.\ncout means Character Output,\
    \ which displays, or presents something to\ntcreen. If you have std, you have\
    \ to declare it at the start of\nthe code, mentioned previously.\n\n; AND) Finally\
    \ you can see that line within a function\nblock (except comments) ends with a\
    \ semicolon.\ns the end of the statement; all statements in C++ must have\none\
    \ at the end or the compiler fails to build the code. The very last\nline has\
    \ the closing bracket to indicate the end of the main function.\n\n```\nhelloworld.cpp\
    \ x\n1 #include <iostream>\n2 using namespace std;\n3\n4 int main()\n5 {\n6  \
    \ //My first C++ program\n7 cout << \"Hello, world!\\\"\\8 \n9 }\n```\n\nwww.bdmpublications.com\
