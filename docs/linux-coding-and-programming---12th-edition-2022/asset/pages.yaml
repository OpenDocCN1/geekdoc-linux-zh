    will be labelled **README** or **INSTALL**. It is wise to read these files as
    they provide valuable information regarding the installation.


    # STEP 9


    With a success `/configure`, the system will create a Makefile. This needs to
    be ''made'' by entering into the Terminal. This may take a while, depending on
    the size of the app.


