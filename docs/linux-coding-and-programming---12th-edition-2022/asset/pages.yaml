  md: '# # INSTALLING LINUX


    Once the Live Environment has booted, you are free option to install the distro
    to your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    +   **STEP 1** Providing you are connected to the internet (if not, then do so)
    and you''re in the Live Environment, start the installation process by double-clicking
    on the Install Mint icon on the desktop. Other distros display their name of,
    course, but the process is the same. Click Continue when you''re ready.


    +   **STEP 4** Before the installation process begins, you''re asked if the chose
    to make sure the erasure of the hard drive is correct. This is your last chance
    to back out. If you''re certain you don''t mind wiping everything and starting
    with Linux Mint, click Continue. If you need to backup your files the Linux disc/USB,
    reboot, and start again.


    ![](img/383b23573296234863a9f25dc7161abc_22_0.png)


    +   **STEP 2** While the installation process is very similar across most distros,
    some offer different questions during the installation. The questions aren''t
    too difficult, nothing very technical, but such as ''Installing'' third-party
    software, can be confusing. In this case you can click Continue but if you''re
    unsure, have an Internet-connected device available to ask any questions.


    +   **STEP 5** Eventually you are asked to set up your username and password.
    Enter your name to begin, with the Computer Name, which is the name it is identified
    on the network. Next choose a Username, followed by a Password. You can tick the
    Login Automatically option but leave the Enter Home Folder option for now.


    ![](img/383b23573296234863a9f25dc7161abc_22_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_22_2.png)


    +   **STEP 3** When installing a new operating system it is recommended that you
    wipe the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install'' option is selected. NOTE: This
    completely wipes Windows 10 from your computer, make sure you have backed up all
    of your personal files and data.


    +   **STEP 6** The installation process can be quick, and there may simply installing
