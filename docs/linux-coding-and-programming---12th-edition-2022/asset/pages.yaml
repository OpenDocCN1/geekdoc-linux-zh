  md: '# Pi x Linux = The Perfect Combination


    # WHICH PI?


    There are several Raspberry Pi models available, with each offering slightly different
    from the others. The most recent Pi released is the Raspberry Pi 3 B+, and while
    this model is slightly more expensive than some of the other examples, it is the
    most powerful and feature-rich Pi


    Overall, It''s probably best to start experimenting with the Pi using the Raspberry
    Pi 3 B+, then moving to one of the other models as you develop your skills and
    focus on a particular project, as the need to use one of the Pi Zero models, with
    a smaller footprint and WiFi connectivity.


    ![](img/383b23573296234863a9f25dc7161abc_78_0.png)


    # BEYOND RASPIAN


    # PI, LINUX AND CODING


    The flexibility of the Raspberry Pi''s ARM processor means that''s capable of
    running other operating systems like Debian. Still keeping with Linux, you can
    install Ubuntu Mate, Pidora (a Fedora-based distribution), Lakka, PiPlay (a retro
    emulation distribution) and Arch Linux. There are also systems based loosely on
    the Linux kernel, such as Retro, Amiga OS clone.


    As previously mentioned, the Raspberry Pi is an excellent code base, and with
    Linux as the backbone you''re able to start learning how to code in a multitude
    of different programming languages. Python is perfectly suited here, since Raspberry
    is Linux, and you can easily expand your scripts to encompass much of the Pi Pi
    functionality. From creating backup scripts, you can create scripts that access
    the GPIO pins on the Pi, and in order to be able to control LEDs, and even make
    hardware projects.


    There''s Windows 10 on ARM, Raspberry Pi OS, RISC Pi OS, and many. Once you''ve
    finished experimenting with one version of Linux, just as you would with a desktop
    version of Linux, you can hop to another on the Raspberry Pi and see how that
    works, and what it will work for you.


    C++ is one of the most powerful programming languages to learn. It''s used for
    games, apps, and even operating systems. Raspberry Pi comes with a great C++ editor
    that is easy to use and can help you develop amazing content. Whichever way you
    decide to take your coding and Linux adventure, the Raspberry Pi is an excellent
    platform for which to begin on.


