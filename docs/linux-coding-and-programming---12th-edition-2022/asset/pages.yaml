    STEP 6 Before we get into editing commands, let''s take a moment to see what menus
    the Terminal has to offer. File menu allows you to open a new Terminal, create
    a new profile, where you can alter the size, colours and behaviour of the Terminal,
    add a new tab, and close all current active sessions.


    STEP 9 The Terminal entry enters the profile editing and sizing and allows you
    to alter the character encoding. Interestingly, you can also set it to Read Only
    mode, which stops you from entering any commands into the Terminal; this is good
    for when you need to display the Terminal commands.


