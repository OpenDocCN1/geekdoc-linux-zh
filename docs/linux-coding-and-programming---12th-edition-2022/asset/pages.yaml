  md: '# Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user choice of versions of the distro: Cinnamon, MATE and
    Xfce. While that may sound a little confusing for the newcomer, each of the versions
    contains the same core Linux structure and kernel, the kernel is the core of the
    operating system, that handles all the instructions between the software.


    Each version is a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, as the file manager
    to browse the operating system''s file structure or how it launches other apps.
    Again though, the core available productivity, video and graphic suites are the
    same, and function in the same way.


    Why bother then with a different desktop environment? Simply put, it''s down to
    personal taste. Some users prefer MATE, MATE is a fork of the classic GNOME 2
    environment and is a little more centric and performs well on older computers.
    Others prefer Cinnamon, which is a modern environment that works on on hardware
    and features some cutting edge desktop code. Xfce, is a lightweight desktop environment
    that works on older hardware due to extremely low use of the available system
    resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux Mint has thereafter opted
    to bring the user a wealth of choice.


    ![](img/383b23573296234863a9f25dc7161abc_13_0.png)'
