  md: '# C++ on Linux


    # # Using Comments


    While comments may seem like a minor to the many lines of code combine to make
    a game, application or even an operating system, in fact that they''re probably
    one of the most important factors.


    # ## THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions detailing what
    the code is doing at that particular point. They don''t sound especially important
    but without comments is one of the frustrating realities you''re a professional
    or just starting out.


    In short, all code should be commented in a manner as to effectively describe
    the purpose of a line, section or individual elements. You should get in the habit
    of commenting as much as possible so that someone who doesn''t know about programming
    you can pick up your code and understand what it''s going to do by reading it.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In an organization, many programmers work
    in teams alongside engineers, other developers and analysts. If you are part of
    a team that''s writing a piece of software for the company, your comments save
    a lot of time when something goes wrong and another team member has to pick up
    follow the trail.


    The comments are always concise and link the code logically, detailing how the
    program hits a line or section. You don''t need to comment on every line. Something
    along the lines of: if xequals zero then do to something; that''s going to be
    obvious to the reader. However, if x is unusual, you''ve run out of lines, which
    drastically changes the program for the user, so it certainly needs to be commented
    on.


    Even if the code is yours, you should write comments if you are going to share
    it with others. This can return you to code and understand what it was or where
    you went wrong, or without it broken.


    Comments are good practice and you understand how to add a comment when needed,
    if it''s your second nature.


    > Place yourself in the shoes of someone who is joined to find out what''s wrong
    with a program. The program has hundreds of lines of code, spread across different
    modules. You can soon appreciate the need for a little help from the original
    programmers in the form of a good comment.


