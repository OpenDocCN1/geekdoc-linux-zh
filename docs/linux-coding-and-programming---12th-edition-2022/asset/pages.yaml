    +   - **STEP 2** Enter, `apt-get` into the Terminal. This brings up a list of
    the most used apt-get commands, what it does. It''s worth having a look at, if
    it doesn''t make much of sense at this time.


    +   - **STEP 4** Notice the addition of the sudo command. The sudo command needs
    Super User Do: Do it means the administrative user (super User) uses APT (Advanced
