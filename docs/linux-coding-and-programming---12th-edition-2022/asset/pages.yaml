  md: '# # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories in the filing system would be in utter chaos.


    # ## MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here are the basics for you to try
    out.


    STEP 1 With the Terminal open cd ~ to make sure you''re in your own Home directory.
    Now enter ls to view the current folders you have housed in the Home directory.
    You''ll notice that folders are labelled in Mint cyan (light blue). Let''s start
    by creating a directory. Enter: `mkdir testdir`.


    STEP 3 If you were to enter the command again, `mkdir testdir`, you''ll receive
    a message stating: `mkdir: cannot create directory ''testdir'': file exists`.
    Without saying that, you''re only able to have one unique named directory within
    the current directory. However, as Linux is case-sensitive, you can have `Testdir`,
    `testDIR`, and so on.


    ![](img/383b23573296234863a9f25dc7161abc_57_0.png)


    STEP 2 If you now enter ls again, you''ll see that the new directory, testdir,
    has been created alongside the other directories in the Home area. Obviously the
    command `mkdir` is what creates the directory, and you''ve already guessed it
    stands for Make Directory.


    STEP 4 You can create directories within directories you''ve already created.
    For example, enter the directory with `cd testdir/` to list the folder structure.
    Naturally there is nothing there, as you''ve just created the directory. Now go
    back to Home with `cd ..` and enter `mkdir reports`. Go back to the tester, `cd
    testdir/`, and `ls`.


    ![](img/383b23573296234863a9f25dc7161abc_57_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_57_2.png)'
