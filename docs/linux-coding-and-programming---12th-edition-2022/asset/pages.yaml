    Ever since the earliest home computers were available, enthusiasts, users and
    professionals have toiled away the wee hours, sleeping over an overheating heat
    of circuitry to create something akin to magic.


    These pioneers of programming carved into a new frontier, totalling small details
    that enabled the letter ''A'' to scroll across the screen. It might not sound
    terribly exciting to a generation that''s used to use ultra-high-definition graphics
    and open world, multi-player games. However, forty-years ago it was blindingly
    brilliant.


    Naturally these coders helped the foundations for every piece of digital technology
    we use today. Some went on to push the available market for software companies,
    whereas others limited its bounds and the billion pound으며 continuously amass us.


