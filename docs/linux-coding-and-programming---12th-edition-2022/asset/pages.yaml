  md: '# # Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is there to help you work, inspire or feature the company logo.
    Whatever your reasons for having your own desktop, here''s how it''s done.


    # YOUR DESKTOP


    Linux is probably one of the customised operating systems there is. With just
    a few tweaks, one or two extras installed and some imagination, you can create
    something incredible.


    **STEP 1** The first aspect of desktop customisation is to change the wallpaper.
    Right-click the desktop and choose Change Background. This opens the Backgrounds
    app in Linux Mint; remember, others may present their background, wallpaper selection
    tools differently.


    **STEP 3** You just need to click the available images, from any of the locations
    provided to have them as the desktop wallpaper. Incidentally, if you have images
    stored in another location on your system or network, you can add them by clicking
    on the Plus symbol at the bottom of the Backgrounds console, using the file manager
    to locate them.


    ![](img/383b23573296234863a9f25dc7161abc_39_0.png)


    **STEP 2** More recent versions of Linux Mint display available backgrounds depending
    on the version the user is running. You normally get three categories followed
    by a fourth, Pictures, which are different from the others. The Pictures option
    is different because it reads the content from the Pictures folder in your Home
    directory.


    **STEP 4** By clicking the Settings tab you can, instead play images as a slideshow
    or change the aspect of the wallpapers to a variety of choices.


    ![](img/383b23573296234863a9f25dc7161abc_39_1.png)


    ![](img/383b23573296234863a9f25dc7161abc_39_2.png)


    ![](img/383b23573296234863a9f25dc7161abc_39_3.png)'
