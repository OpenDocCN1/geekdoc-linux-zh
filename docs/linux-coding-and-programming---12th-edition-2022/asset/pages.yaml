  md: '# STEP 5


    The command to create directories is logical, therefore you''ll create the directory.
    However, if you want to create a directory and any subdirectories in a single
    command make sure you''re at `cd -` and use mkdir -p Temp/Finances. Now, cd Temp/
    and ls list the new directory.


    # STEP 8


    Now that we''ve created some directories, let''s see about removing them. By entering
    the directory and listing its contents: `cd testdir`, then ls. The created reports
    sub-directory is present. Now any way to remove it is enter: `rmdir reports`,
    then ls to confirm it''s not there.


    ```

    File Edit View Search Help

    david@david-mint ~ -Temp

    david@david-mint $ mkdir -p Temp/finances

    cd Temp

    david@david-mint $ mkdir -p finances

