  md: '# Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into the command line. While modern operating
    systems shy away from the command line, Mint uses the Terminal to give the user
    greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    STEP 1 The Terminal can be accessed by either clicking on the Terminal icon on
    the Panel, located between the Firefox and Files icons or by opening the Menu
    and selecting it from the left-hand quick launch strip.


    STEP 3 What you currently see in the Terminal is your login followed by the name
    of the computer; as you named when you first installed Mint. The line ends with
    the current folder name; at first this is just a tilde ~, which means your Home
    folder.


    ![](img/383b23573296234863a9f25dc7161abc_45_0.png)


    STEP 2 The Terminal gives you access to the Linux Mint Shell, called Bash, which
    gives you access to the underlying operating system. Everything in Mint, the desktop
    and GUI, is a module running from the command line.


    STEP 4 The flashing cursor at the very end of the line where your text-based commands
    are entered. You can begin to experiment with a simple command, Print Working
    Directory (pwd), which outputs the current folder you''re to in the screen. Type
    pwd and press Enter.


    ![](img/383b23573296234863a9f25dc7161abc_45_1.png)'
  merge: -1
