  md: '# Which Distro?


    ![](img/383b23573296234863a9f25dc7161abc_16_0.png)


    ![](img/383b23573296234863a9f25dc7161abc_16_1.png)


    tools preinstalled, that a user can run for penetration testing against their
    network. There was once even a Hannah Montana Linux distribution but the less
    we talk about the better. The point being is, there''s a distro out there for
    you.


    Oddly enough, higher-end technical users find themselves back at square one, using
    a distro like Linux Mint. The main reason is usually because it''s the easy option,
    and it''s a stable environment. Just because you know the system inside and out,
    doesn''t mean you always want to be fixing issues. Most of us would prefer the
    lazy life, especially where technology is concerned, the logical choice would
    be to choose a distro that is simple, yet still powerful enough to do everything
    you want it to, hence


    Needless say, once you''ve mastered Linux to a relatively high degree, probably
    a power user, then you will want to expand your skills and begin to build your
    own Linux distro based on Arch, Debian or one of the other available distros.
    Doing so involves a lot of command line knowledge, as well as knowledge of how
    the Linux system works and interacts with the hardware in the computer. You will
    need to partition disks, configure drivers, and manually install the apps and
    programs you want. Doing so takes time and again a lot of skills if you''re not
    going to learn.


    However, in the end, it''s purely down to, your own personal choice. You may find
    that after going through the tutorials in this title you don''t like Linux Mint
    or the Cinnamon desktop. Fine, maybe you prefer Ubuntu, Debian or openSUSE; that''s
    the beauty of Linux. The freedom to change what you want, to distro hop from one
    to another without being penalised by cost or lack of access.


    Eventually you can consider yourself a technical Linux user but never consider
    yourself an expert, after all we''re always learning something new. You can build
    your own distro from scratch, help other Linux users with problems, maybe even
    contribute to the improvement of a distro during its testing phase or where?


    The answer to the question, which distro is any one you like! it can be as complex
