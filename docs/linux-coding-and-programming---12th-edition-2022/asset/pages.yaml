  md: '# # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # ## FROM THE SOURCE


    The commands you''ll need to be familiar with here are Configure, Make and Install.
    You''ll find a lot of apps using from source, so it''s quite a skill worth investing
    time in.


    +   STEP 1 Source code files for Linux usually come in the form .TAR.GZ or .TAR.BZ
    Both are compressed files holding all the code needed to ''make'' the app. Start
    off this tutorial by creating a new folder in Home: mkdir vim.


    +   STEP 3 The wget command retrieves content from the internet, which is the
    BZ2 File for Vim. According to Mint''s file system colour, the code file should
    be displayed in red.


    ![](img/383b23573296234863a9f25dc7161abc_51_0.png)


    +   STEP 2 Vim, by the way, is an advanced text editor which we''ll use as an
    example to install. Enter then from the new Vim folder, enter the following command
    into the Terminal: wget ftpp://ftp.vim.org/pub/vim/unix/vim-7.tar.bz2


    +   STEP 4 We need to uncompress the contents of the file, now so: enter tar -xf
    vim-7.tar.bz2 in the Terminal. You can type in tar -xf v and press the Tab to
    auto-fill the remaining name.


    ![](img/383b23573296234863a9f25dc7161abc_51_1.png)'
