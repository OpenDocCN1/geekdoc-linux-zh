  md: "# Data Types\n\n```\nDataTypes.cpp\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.14159265358979238463;\nint main() {\n    cout.precision(22);\n \
    \   cout << PI;\n}\n```\n\nThis is mainly due to the conversion from binary in\
    \ the compiler and that the IEEE 754 double precision standard carries 64-bits\
    \ of data, where 52-bits are dedicated to the significant (the significant digits\
    \ in a floating-point number) and roughly 3.5-bits are taken holding the values\
    \ 0 to 9. If you divide 53 by 3, you will arrive at 17.666, which is just of 15\
    \ digits.\n\nTo be honest, if you're creating code that needs to be accurate to\
    \ more than fifteen decimals, you wouldn't be using C++, you would use some specific\
    \ scientific language with C++ as the connective tissue between the languages.\n\
