  md: '# USEFUL HELP/INFO COMMANDS


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with in Linux. You might not need them every
    day, but when you do, they will be invaluable.


    ![](img/383b23573296234863a9f25dc7161abc_80_0.png)


    +   free command displays the total amount of free and used physical and swap
    memory in the system. For example, free -m gives information in Megabytes.


    +   sed command opens a stream editor. A stream editor is used to perform transformations
    on an input stream: a file or input from a pipeline.


    +   df displays filesystem disk usage for all partitions. The command df -h is
    the most useful (the -h means human-readable).


    +   adduser adds a new user to the system. Similarly, the addgroup command adds
    a new group to the system.


    +   the top program provides a real-time view of a running system. It can display
    system information, as well as a list of processes.


    +   theuser command removes a user from the system. To remove the user''s files
    and home directory, you need to add the -remove-home option.


    +   the uname command with the -a option prints all system information, including
    machine name, kernel version, and a few other details.


    +   the delgroup command removes a group from the system. You cannot remove a
    group that is the primary of any users.


    +   the ps command allows you to view all processes running on the machine. Every
    operating system''s version of ps is slightly different but all do the same thing.


    +   the man command brings up the manual entry for a man command, which is a great
    place to start when using it.


    +   the grep command allows you to search inside a number of files for a particular
    pattern and then print matching lines. An example would be: grep blahh file


    +   the man intro command is especially useful. It introduces the to User Commands,
    which is a well written, fairly brief introduction to the Linux command.'
