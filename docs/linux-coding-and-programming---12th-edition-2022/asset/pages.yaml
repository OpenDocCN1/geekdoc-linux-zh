  md: '# Common Coding Mistakes


    When you start something you''re inevitably going to make mistakes, this is purely
    down to experience and those mistakes are great teachers in themselves. However,
    even experts make the occasional mishap. Thing is, to learn from them as best
    as you can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to emphas a mistake and fix it when you start to move
    into more advanced territory, and become a better coder. Everyone makes mistakes,
    even coders over thirty years'' experience. Learning from these basic common mistakes
    help build a better coding foundation.


    ![](img/383b23573296234863a9f25dc7161abc_143_0.png)


    # SMALL CHUNKS


    It would be wonderful to work like Neo from The Matrix movies. Simply ask, your
    operator loads it into your memory and you instantly know everything about the
    subject. Sadly we can''t do that. The major pitfall is trying to learn too much,
    too quickly. So coding in small pieces and take your time.


    # EASY VARIABLES


    Meaningful naming for variables is a must to eliminate common coding mistakes.
    Having letters of the alphabet is fine but what happens when the code states a
    problem with x variable. It''s not too difficult to name lives, money, player1
    and 0.


