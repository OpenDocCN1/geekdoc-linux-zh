    If you `ls` again, you''ll notice that a new folder has been created: **vim**:
    in light text representing a folder in Mint. It''s always better to create root
    folders for the main app, as you upgrade apps through this method the individual
    versions will each have their owner.


    # STEP 8


    You may need to keep installing new dependencies, depending on the app. After
    each new dependency is installed, run `--configure` and if it doesn''t report
    back with an error you can continue to the next stage of the installation. You
    may need to search for online error messages.


