    \ complex and relatively simple.\n\n# C++ = MC2\n\nThe basic mathematical symbols\
    \ apply in C++ as they do in most other programming languages. However, by using\
    \ the C++ Library, you can also calculate square roots, powers, trig and more.\n\
    \n+   STEP 1 C++'s mathematical patterns as taught in school, in multiplication\
    \ and division take precedence over addition and subtraction. For that, you can\
    \ create a new file and enter:\n\n+   STEP 3 Multiplication and division can be\
    \ applied as:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    float numbers = 100;\n    numbers = numbers + 10; // This adds 10 to\
