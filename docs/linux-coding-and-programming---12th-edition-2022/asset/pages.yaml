  md: '# Creating a Linux Installer on Windows


    # # USB BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most modern PCs don''t
    have an optical drive installed. The process of transferring the image is easy
    but you will need a third-party app and a USB drive of 4GB or more.


    ![](img/383b23573296234863a9f25dc7161abc_20_0.png)


    ### STEP 1

    Open up a browser and go to rufus.ie#. Scroll down the page and to a Downloading
    heading to find the latest version of Rufus. Click the link to start download.


    ![](img/383b23573296234863a9f25dc7161abc_20_1.png)


    ### STEP 4

    When you''re ready, click on the Start button at the bottom of Rufus. This may
    open another dialogue box asking you to download and use a new version of SysLinux.
    SysLinux is a collection of boot loaders, used to make a modern PC to access and
    boot from a USB drive. It is necessary, if so clicked on ''Yes'':


    ![](img/383b23573296234863a9f25dc7161abc_20_2.png)


    This image uses SysLinux 6.03/2015225 which also includes the features for SysLinux
    6.03/2014-06.


    As new versions of SysLinux can look quite different one another, and you might
    vary which version for Rufus to include. Any additional files which must be downloaded
    from the internet (''Syslinux'' or ''sdlinux.iso'') should be selected. Select
    ''No'' to continue


    ![](img/383b23573296234863a9f25dc7161abc_20_3.png)


    Note: The files will be downloaded in the current application directory and will
    be reused automatically.


    ![](img/383b23573296234863a9f25dc7161abc_20_4.png)


    ### STEP 2

    dThe downloaded Rufus executable and yes to the Windows question and check for
    updates. With Rufus started it should already identify your USB flash drive; if
    not, remove and restart.


    ![](img/383b23573296234863a9f25dc7161abc_20_5.png)


    ### STEP 5

    The next steps ask image you want the Linux ISO to be written to USB drive for
    different situations, but the recommended ISO Image is more popular. The more
    size is presented and click OK to continue, followed by OK to confirm the action.


    ![](img/383b23573296234863a9f25dc7161abc_20_6.png)


    > The image has an ''ISOHybrid''. This means it can be written in ISO Image (copy/img)
    mode or DD (disk image) mode. Rufus recommends using the ISO mode, so that you
    will have access to the drive after after writing.


    If you encounter issues during boot, you can try writing this image again in DD
    mode.


    +   Please select the mode you want to use for this image:

    - Write in ISO image (Recommended)

    - Write in DD mode


    ![](img/383b23573296234863a9f25dc7161abc_20_7.png)


    ### STEP 3

    At the first launch Rufus can look a little confusing but dont worry, it''s quite
    simple. To begin with, click the SELECT button ''Disk or Image (Please select)''
    pull-down menu. This will launch a Windows explorer where you can locate and select
    the ISO.


    ![](img/383b23573296234863a9f25dc7161abc_20_8.png)


    ### STEP 6

    The ISO is now transferred to your flash drive. The process shouldn''t take too
    long, depending on the speed of the USB drive you have found. Rufus auto-opens
    the USB drive in Windows explorer during the process; you don''t worry can close
    it if you want. When the process is complete, click on the button.'
