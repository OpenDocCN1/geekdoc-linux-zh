  md: "# STEP 5\n\nPress F5 and save the code to execute it. A four-letter word in\
    \ the Shell to begin with, you should have the returned message that it's word\
    \ is four letters. Now press F5 again and rerun the program this time a five-letter\
    \ word. The Shell will display that it is not a four-letter word.\n\n# STEP 6\n\
    \nNow expand the code to include another conditions. Eventually, it could become\
    \ quite complex. We've added a condition for three-letter words:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nif word_length(word)==4:\n print(word, \"\
    is a four-letter word. Well done.\")\nelif word_length==3:\n print(word, \"is\
    \ a three-letter word. Try again.\")\nelse:\n print(word,\"is not a four-letter\
    \ word.\")\n```\n\n![](img/383b23573296234863a9f25dc7161abc_112_0.png)\n\n# LOOPS\n\
    \nA loop looks quite similar to a condition but they are somewhat different in\
    \ their operation. A loop will run through the same block of code number of times,\
    \ usually with the support of a condition.\n\n# STEP 1\n\nLet's start with a simple\
    \ While loop. If this will check if something is TRUE, then the indented code:\n\
    \n```\nx = 0\nwhile x < 10:\n print(x)\n x = x + 1\n```\n\n# STEP 3\n\nThe For\
    \ loop is another example. It is used to loop over a range of data, usually a\
    \ listed as variables inside square brackets. For example:\n\n```\nwords=(\"Cat\"\
    , \"Dog\", \"Unicorn\")\nfor word in words:\n print(word)\n```\n\n![](img/383b23573296234863a9f25dc7161abc_112_1.png)\n\
    \n# STEP 2\n\nThe difference between if and while is when while gets to the end\
    \ of the indented code, it goes back and checks the condition is still true. If\
    \ x is less than ten. With each loop it prints the current value of x, then adds\
    \ one to that value. When x does exactly equal 10, it stops.\n\n# STEP 4\n\nThe\
    \ For loop can also be used in the countdown using the function:\n\n```\nfor x\
    \ in range(1, 10):\n print(x)\n```\n\nThe x+1 isn't needed here because the function\
    \ creates a list with the first and last numbers.\n\n![](img/383b23573296234863a9f25dc7161abc_112_2.png)"
