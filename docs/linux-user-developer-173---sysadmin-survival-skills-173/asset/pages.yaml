  md: '# My Pi project


    ![](img/aa3e09dddad2d95f60849c767284454b_68_0.png)


    # How to turn a

    Raspberry Pi into

    a walkie talkie


    The talkkies boast an intuitive push-to-talk interface for kids and

    big kids alike. Creator Daniel Chote talks us through this personal project


    Where did the original idea for talkkies stem from?

    I had an idea years ago to use a Raspberry Pi as a walkie talkie, but it didn''t
    work well. I wanted to do something for kids. Kids nowadays have smartphones and
    tablets, but no single-purpose electronic devices that one might need.


    I had recently purchased a Prusa MK3 Min 3D to be exact, and started with Fusion
    360, so it would be great to actually have all the tools and hardware to work
    through completion.


    Could you tell us the general build of talkkies? Did you encounter any significant
    problems during the process?


    It was about keeping it simple and kid-proof. The cheapest way to connect two
    Raspberry Pis to speakers was to then come up with a very simple GPIO interface
    for status and power. I found an open-source project that I used, which I modified
    heavily, to fit my specific needs.


    Initially, I wanted ''something'', but then quickly realised that I needed something
    better. So some designs from Eights-style walkie talkies were adapted. I also
    cleaned up the Raspberry Pi and speaker PCB without it being too overcrowded.


    With respect of the project, there wasn''t really much to go on. I think the biggest
    problem is that this version is a bit large for small hands. I plan to build a
    much smaller version using a Zero Pi.


    You used a 3D printer for parts, is it essential to have access to a 3D printer
    for project? Not at all. You could assemble this in anything. I 3D printed case
    and it also makes a little more kid-proof.


    How was the Raspberry Pi 3 Wi-Fi in your experience, how did you work with it?

    The Raspberry Pi 3 was chosen because of its overall performance and cost. I had
    a lot of trouble getting the Raspberry Pi 3 to work without WiFi, so I had to
    use a USB dong for the network. One of my friends helped me get the Raspberry
    Pi 3 Wi-Fi working without any issues, so it most most point-specific became.
    I called him on the Pi 3.


    # Eights-style design cues


    Raspberry Pi 3. It worked right out of the gate, but Gumble found the foundation
    for talkkies.


    Mumble is really nice because it is secure (certificates) and supports encryption.
    ACLs you can restrict which any user can interact with different groups of talkkies
    that can use the same server, or have their own channel to interact in.


    How do you plan to continue talkpie? Is there anything else you feel it could
    be improved? To continue and the next few months I plan to release a version for
    the Zero Pi, an even smaller version that is just a Pi with battery, exposed USB
    and a display that I would like to include in the project to develop Wi-Fi signal
    and generic channel management information, for that will end.


    HubPi, and it seems to work well; it occasionally drop off the network, but for
    most parts.


    Mumble won''t be a problem for many of readers who have gone what kind of role
    does it play in talkkies?


    I was initially thinking that I would use,, but everything became me writing a
    final command-line for it. Previously there was the just being too slow on the
    Raspberry Pi. I called across Gumble (https://github.com/yay/gumble) and tested
    it out.


    Daniel Chote is a fellow, currently living in London, USA. He helped me with code,
    and has his boasted 3D printer!


    # Like it?


    Daniel has a few other related projects that I like me. Each project, he built
    a full walkthrough, so if to reproduce the project you''ll be in safe hands with
    his instructions clearly.


    Further reading

    If you''ve gone down the rabbit and try to build your own talkkies, it''s worth
    talkie-talkie. Daniel used the project in his 3D modeling, he used the fantastic
    de-facto.com, and https://github.com/yay/gumble communication features.


    Your website is full of amazing projects, have you got anything specific lined
    up for the future? I will be thinking about to start Raspberry Pi de-veloping
    of Formula Pi and, as my kids get older, they''ll really get a kick out of.


    www.linuxuser.com'
