  md: '# # Tutorial


    # ## Choosing a good password


    Even if your home folder is encrypted it can be accessed by another computer trying
    your passwords until it hits the website https://wowentropy.net/ to see how long
    it would take to crack your password. If the result is less than a century, consider
    using a stronger password. Doceware website https://www.doceware.com/ provides
    a good and easy way to remember passwords through randomly selecting dictionary
    words.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_0.png)


    obtain the Pi''s MicroSD card. Log onto the ''pi'' user and use the shred command
    to securely delete any files you want e.g


    > > shred -u backup-statement.pdf


    You can use


    ```

    sudo rm -r -f <directoryname>

    ```


    to erase folders but do not do this with any of the files in your home folder
    e.g Desktop.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_1.png)


    created in home, e.g/home/bob. No other users on the Pi will be able to access
    the files inside your home folder.


    # ## 10 Give your user admin privileges


    Log out of your new user and add back to ''pi''. Open Terminal and run


    ```

    sudo visudo

    ```


    Scroll down to the line root ALL:(ALL:ALL) and add a new line after this add:


    ```

    bob (ALL:ALL) ALL

    ```


    ''bob'' is your username. Press Ctrl-X, then Return to save and exit. Restart
    the Pi to effect your changes.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_2.png)


    # ## 13 Disable swap space


    There is a portion of the Pi''s SD card located in /var/swap that is used in a
    similar way when the Pi is low on resources. For many Pi models this swap is rarely
    used and can present a security risk as your data may be written constantly. Log
    out of your new user account, Terminal and run


    ```

    sudo swapoff -a

    ```


    ![](img/aa3e09dddad2d95f60849c767284454b_71_3.png)


    # ## 14 Fix permissions


    Depending on the method you used to back up and transfer data from your device,
    there may be permission issues with files and folders you''re not enabled. You
    can then make a padlock of the owner of all files with your command:


    ```

    sudo chown -R bob:bob /home/bob

    ```


    ![](img/aa3e09dddad2d95f60849c767284454b_71_4.png)


    # ## 11 Remove backup home folder


    When encrypting your home directory, the eEncrypt software places a backup in
    the home folder if anything goes wrong. As this was a new account, the folder
    is empty, but to keep things simple open Terminal and run the command:


    +   /home


    to find out each name, e.gbob.yyzc, then run the command:


    ```

    sudo rm -r -f <directoryname>

    ```


    to remove it.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_5.png)


    # ## 15 Check if your files are safe


    This step is optional: Reboot the Pi and log into the ''pi'' user. Open Terminal
    and if you have not previously done so, enter the command:


    ```

    sudo password root

    ```


    to set a password for the root user. Enter the command to switch into root, run:


    +   /home/bob


    (''bob'' is your new username) and then use ls to show the contents of the directory.
    There''s now only a shortcut and a ''README file saying your data is protected.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_6.png)


    # ## 12 Delete backup in Pi home folder


    If you have data already in the existing ''pi'' folder, it is still unencrypted
    and can be accessed by anyone who


