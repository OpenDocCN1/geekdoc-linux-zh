  md: '# OpenSource


    08 News & Opinion | 12 Interview | 96 FileSo


    ![](img/aa3e09dddad2d95f60849c767284454b_7_0.png)


    # HARDWARE


    # Can Intel rival the Raspberry Pi?


    With unrivalled power, the new wave of SBCs with Apollo Lake chipsets revolutionise
    maker projects?


    ![](img/aa3e09dddad2d95f60849c767284454b_7_1.png)


    Intel''s Apollo Lake chips made their debut towards the beginning of 2016, but
    until now, have largely been seen nor heard of. With promising performance for
    mobile and 2-in-1 devices, it is said to be succeeded by the acclaimed Blackwell
    family with improvements to their IPC and GPE. The gadget is vital to the first
    Single Board Computers with Apollo Lake already implemented.


    Emerging manufacturers like Aeleon have made what is considered to be the first
    range of 3-5 SBCs using Intel Atom processor range. By taking advantage of different
    chipsets in the Apollo Lake family. These of three boards


    It comes with 8GB of RAM, a SATA 3.0 port and Dual Gbe Wake-on-LAN


    include the Atom chip, which will also be able to find one Celeron or Pentium
    offering, depending on tastes and requirements.


    Due to the availability of the Atom variant of the Aeleon range, the board itself
    looks stark different from the rest of the lineup. It''s equipped with 8GB of
    RAM, a SATA 3.0 port and Wake-on-LAN as well. If size is important, a miniature
    version of the APL will also be available. The Aeleon''s GENE-APPL also has built-in
    WiFi and a USM slot for wireless connectivity.

    . Alone, Aeleon''s GENE-APPL is currently the high-end option in mind. Expect
    that with any SBC, connection options are limited. The front of the board has
    a single HDMI port that can be doubled up as an LVDS interface also available
    to the reader. Depending on your power requirements, the APL can also be bought
    with either a fixed 12V supply, or in a 19V adapter.


    While Aue''s high-end ECM-APL shows a list of similarities to the APL5, there
    are also some noticeable differences. While both use the same ports, the APL offers
    a mini-PCI slot to its users. In the addition to the M.2 B-key expansion interface,
    it''s also double as offering DisplayPort. There''s no HDMI connection to SATA.
    Its central connection is HDMI, according to official sources, and it has five
    USB 3.0 ports, but only one of these is a 2.0 interface, something to bear in
    mind.


    Above Each board includes an embedded multi-core processor


    The official word on pricing has been announced for either of these high-end boards,
    or their counterparts for sale. At the time of writing, only Apollo announced
    full compatibility with the Linux kernel, and for Android. However, due to Aeleon''s
    new Blackwell-based boards all containing support for Linux, it''s widely expected
    that the trend will continue here.


