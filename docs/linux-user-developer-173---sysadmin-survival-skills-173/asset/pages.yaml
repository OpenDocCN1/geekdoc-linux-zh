    # CELPHY''s stuck stuck


    Hello LU$D,

    I have a little printer, a Canon SELPHY CP910 that I use to print my digital photos.
    It works fine if the computer is running in Windows mode. It''s even finer with
    WiFi from the camera, or from my daughter''s phone if accessed wirelessly from
    the lounge (in the dining room). But when I try to send anything to it by either
    app, gobbledygrough tells me that it''s not plugged in, it''s not connected to
    the computer, it doesn''t exist... it''s so frustrating, as I have been experimenting
    with GIMP to edit photos (I refuse to pay for a subscription to Adobe!)


    and I would like to print them off. I''m using Ubuntu 16.04 and at first I thought
    that this might be the problem, but I have tried both Linux MinX and Trisquel
    from my live boot DVDs and it didn''t work under either of these. What''s the
    matter with it?


    Countless have been documented over the years about peripherals that don''t work
    with Linux. Now that the open source movement is finally gaining traction has
    slowly begun to reduce in volume and frequency, still some brands and products
    that don''t work with Linux, and Canon is a name that is often mentioned. Entire
    bulletin boards to the walls of angry, but photo printers


    suffering a variant of the same problem. Some users have even gone as far as writing
    their own scripts to add it, with varying degrees of complexity (take a look at
    http://ubuntu.com/questions/314833/diagnosing-the-problem-when-canon-printer-fails-to-connect-the-community).
    The problem is a lack of compatibility on the part of Canon or a lack of effort.
    You''re not going to get it working under Linux without some effort (if you do
    at all). There are some less elegant workarounds to consider like using GIMP you
    could use your GIMP images to transfer or another family member in a lossless
    format like .png or print them via a device that will connect to your Canon printer.


    94 Marie*'
