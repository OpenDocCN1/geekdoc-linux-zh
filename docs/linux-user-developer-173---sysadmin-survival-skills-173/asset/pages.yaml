    Rosegarden''s layered workflow is relatively simple task, instruments can be made-imported
    into the project, which automatically updates the overall audio levels and removes
    sense of feedback. Individual track control is a bit hit or miss, however.


    While it''s feature-packed, those looking to create music will find basic support
    for both MIDI and synth to name a few. Both of these omissions are noticeable
    and are easy to implement into your current projects. We also liked the automatic
    32-bit audio recording, a great option when to export your tracks.


    # Plugins and expansions


    # Plugins and expansions


    Using the DSS architecture as the base of its audio plugins Rosegarden can support
    hundreds of additional instruments and tools. It does, however, suffer from certain
    problems with specified instruments. Loading can be slow, and one or two we tested
    at lack compatibility with Rosegarden''s native instrument suite.


    There''s conditional support for MMO/SSE utilization for plugins, so you''ll be
    to import a small number of instruments and additional tools as well. Support
    for hardware is also listed, but we failed to get the majority of the hardware
    we tested working correctly in BEAST from the start.


    # Overall


    # Overall


    The minimal approach works well in principle, and Rosegarden doesn''t skip on
    its feature set, there are some noticeable omissions littered throughout that
    might hinder the experience.


    This is for those who need the basics, but nothing more. To really compete with
    the best in this field, BEAST needs to offer a lot more to grow and grow its user
    base.'
