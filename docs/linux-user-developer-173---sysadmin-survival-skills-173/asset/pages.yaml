    # Learn how to get to grips with the Erlang programming language in our new series


    This tutorial will be the first in a series of tutorials about the Erlang programming
    language. Erlang is a functional programming language with many unique and interesting
    characteristics, designed in order to serve the switching of telephone equipment.
    Although it may look like any general-purpose programming language, it is most
    appropriate for developing highly available server processes. In other words,
    it''s better to develop the server side of an application using Erlang than the
    client side.


    An Erlang program should be implemented as a large number of small processes that
    do simple tasks and communicate with each other using code that has no side effects.
    This is achieved by exchanging messages without sharing any data, therefore allowing
    Erlang to use multiple CPU cores without fault. An Erlang program might run four
    times faster than a four-core CPU without changing a single line of code!


    This tutorial will provide a quick overview of what Erlang does while giving you
    small complete examples. The rest of the tutorials will offer more detailed information
    about significant Erlang topics.


