  md: '# TOP FIVE


    # Arch-based distributions


    ![](img/aa3e09dddad2d95f60849c767284454b_8_0.png)


    # 1 Antergos


    Although it started life solely offering the Cinnamon desktop, Antergos has carved
    a name for itself by being one of the first distros that now offers support for
    GNOME; Razer-qt and XFCE. Without doubt features it provides its graphical installation
    program.


    # 2 Chakra


    While Chakra is not as well-known as others listed here, it is listed in many
    of these places. Automatic hardware detection is a big plus here, allowing easy
    installation for most third-party hardware on any device.


    ![](img/aa3e09dddad2d95f60849c767284454b_8_1.png)


    # 3 Manjaro


    Manjaro is one of the few arch-based distributions to offer rolling updates, but
    this method helped its users receive timely and stability. Its popularity has
    led it to be one of the most popular distros today.


    # 4 Apicity


    What Apicity has made such a splash out is that it enables users to integrate
    web apps into their top-desktop environment by the fantastic IEE browser and installation
    program.


    # 5 ArchBang


    Although it may have slowed down on Arch, its light weight and usability are suitable
    for portable desktops when loading it today. It''s one of the few that rests on
    the Openbox window manager.


    ![](img/aa3e09dddad2d95f60849c767284454b_8_2.png)


    # ANDROID


    # Welcome to a small powerful media centre


    # Remix debuts Nougat-powered console and PC hybrid


    The Android x86-based Remix OS was a showcase of technical prowess, flourishing
    the powers of Android on personal computers. Due to its success, the team behind
    Remix has gone further by combining the elements of the OS with desktop elements.


    Named Remix OS, the devices include all the capacity of a mini set top box, with
    the key elements of a low-ending PC. As it runs, it is a highly modified version
    of the Remix OS, but still features everything you love about Android. A wonderful
    interface, and although doesn''t allow much in customisation, it is easy to install
    Google Play Store.


    Connected to TV, the IO+ offers you to the full Android experience with a recognisable
    mobile interface that can be controlled with a mouse and keyboard.


    It boasts a fairly powerful Rockchip RK3399 with a quad processor, 4GB of RAM
    and a Mali T864 GPU. In terms of storage and connectivity, its storage is plenty
    for


    app downloads and media files thanks to 32GB of internal, with 4 USB ports and
    single HDMI output for movie binding. Even impressive is the potential of 4K output,
    which far exceeds other set-top boxes in use.


    While dual-band Wi-Fi and Bluetooth allow for seamless connection to networks
    and smartphones, an Ethernet port is also available for low latency streaming.
    Both DRM level 1 and 3 playback also make it an appearance well for local media
    apps.


    Regarding the future of Remix, the Indie has also raised its $250,000 Kickstarter
    goal, with busy units starting at $319 and a staggering 422 backers. Remix will
    continue to support the IO-x-dev for the next few years with general availability
    commencing in 2017. Its compatibility with new smartphones is unknown yet, but
    it''s likely see further implementation for other OSs in the near future.'
