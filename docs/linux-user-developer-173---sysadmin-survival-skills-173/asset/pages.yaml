    # OPTIMISATION STRATEGY


    Define the problem

    The most important phase of the optimisation process is defining the problem you
    want to solve. In other words, make sure what part of your Linux systems is failing
    slowly before trying to make it fast, hard disk, or you may try to solve the wrong
    problem. If only two Apache server processes are in order to serve 1000 users,
    using a fast server will not help as much as starting more Apache processes! Linux
    systems and networks are complex, there are many factors—design well-defined and
    easy-to-understand standards will definitely help you during optimisation.


    Identify bottlenecks

    When you are about to solve the problem you identified, you should attempt to
    identify the reasons why you have a performance problem. The bottleneck could
    be anything which might run along includes a sluggish database that answers queries,
    a hard disk, too many users or not enough processes. It is your job to identify
    the root of the problem, which can be anything. So buying hardware with more RAM
    and faster CPU is not enough to solve the solutions to your problems. In fact,
    this might be last.


    Fix issues

    The most useful thing during the fixing process is a test machine, because running
    tests and experimenting on a production server is highly discouraged! If you have
    multiple servers, do not apply the solution to all of them at once. Whenever possible
    implement it during peak hours, because this leaves you with less time for testing.


    # Optimise systems and networks


    Optimisation is an art because there isn''t one single recipe that you can follow
    to optimise your Linux systems and networks. Most of the time you test in order
    to identify bottlenecks, then resolve and perform more tests in your Linux system
    or network performance.


    Additionally, upgrading your database server to the newest version might not help
    the application that uses it. As a result, you should perform performance upgrades
    before applying them on the production server.


    Network optimisation is one of the most challenging tasks. There are several tools
    for capturing and analysing data: Wireshark, treshark and tcpdump. You can think
    of tcpdump as a light version of Wireshark with a very graphical interface, whereas
    treshark is the text version of Wireshark. Figure 7 shows Wireshark in action
    while capturing its traffic.


    Before you use these tools, you should know how TCP/IP network works with all
    the TCP/IP protocols. With a good knowledge of TCP/IP networks, there is no point
    in using any of these tools. You should read some documentation about network
    protocols and TCP/IP protocol standards in the form of RFCs, which are delivered
    in plain text format. When explaining a protocol, an RFC does not tell you the
    implementation of the protocol. The details of the implementation are found in
    the code.


    An RFC can be very long and so. If you want to learn a TCP associated topic, you
    should start by reading and understanding the respective RFCs. You can find all
    RFCs in many places online.


    Another kind of tool is that you can test your web servers in order to find out
    about their performance and the number of concurrent connections they can serve.
    Learn how to use the Benchmark, which comes with Apache, to test the performance
    of an Apache server - as you can imagine, this avoids stress testing during weekends
    or over-busy hours, as it is not okay to crash your web server when it is supposed
    to serve its users!


