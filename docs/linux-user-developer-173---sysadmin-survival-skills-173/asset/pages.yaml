    to the exact size needed to house the Pi 3 and the US Robotics speakerphone PCB
    specifically. The necessary parts were also cut out for easy access


    # Green means go


    The LEDs are slid into the top-mounted LED holders, which are great indication
    of when you''re in contact with someone talkiepi. Each LED is held in place by
    a small amount of silicone sealant around its base


    # Mounting the PCB


    The speakerphone is mounted towards the rear of the talkiepi enclosure to make
    it easier to connect the required pins. With the PCB mounted properly, both the
    GPIO leads and USB cable are anchored and secured in place


    # Configuring the GPIO


    The GPIO interface-based in talkiepi is surprisingly simple. It consists of a
    push button, with two LEDs for status indication and a single LED that''s illuminated
    when it''s transmitting and connecting to connect


    Each status LED is soldered in place to respective LED. It''s important to attach
    the necessary LED holder boots and heat-sink before attempting to solder


