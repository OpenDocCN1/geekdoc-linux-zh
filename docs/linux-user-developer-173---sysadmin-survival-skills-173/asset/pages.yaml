    ```


    # Assess the problem you are facing


    Troubleshooting is like debugging software: the first thing is to make sure that
    there is actually a problem somewhere. The next thing is finding out if the problem
    affects a single


    computer, a network, the entire or the whole internet.


    If you are not sure about the number of machines involved, do not try to solve
    the problem, but try to isolate the issue. The last way of solving the problem
