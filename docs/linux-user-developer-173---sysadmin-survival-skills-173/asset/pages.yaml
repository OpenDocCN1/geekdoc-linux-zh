    that arises, the root of the problem could be a hacker who has gained access to
    one of your servers. In others, when you are troubleshooting you should assume
    that everything is working normally.


    to go wrong. Generally, there are two big categories of problems: system-related
    and network-related. The first category has to do things that can go wrong locally,
    such as not having enough disk space or the problem of dealing with memory leaks.
    The second category is problems that are network-related, such as using a broken
    DNS server, having a faulty table or a defective router. Network-related problems
    can be pretty messy, difficult to isolate, especially when they combine the failure
    of hardware with incorrectly configured software.


