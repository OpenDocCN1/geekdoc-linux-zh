    ### Puppy Linux


    除非你有资金支持它，否则你所运行的硬件在处理发行版大小上是有限制的。有许多高能耗的发行版功能完备，但大多数需要高端桌面电脑。对于老旧机器，选择一个对 CPU
    友好的发行版至关重要，但你需要一个在核心功能和易用性上不妥协。


    ![](img/aa3e09dddad2d95f60849c767284454b_57_0.png)


    ### Peppermint OS


    通过利用 Mozilla 的 Python 技术，Peppermint OS 旨在与云端和基于 Web 的应用程序协作。对云依赖有助于将需求降至最低，并有助于提高加载和使用速度。


    ![](img/aa3e09dddad2d95f60849c767284454b_57_1.png)


    ### Bodhi Linux


    Bodhi Linux 看起来确实很有范儿，其特定的 ISO 镜像完美适配老旧机器和 Chromebook，即使只安装了五个应用程序和一系列模块化工具。


    ![](img/aa3e09dddad2d95f60849c767284454b_57_2.png)


    ### Lubuntu


    Lubuntu 成为最佳选择之一的原因是它的 LXDE 桌面环境，它能够在低配置机器上运行，并以快速的安装包而闻名，这同样缩短了安装时间。


    ![](img/aa3e09dddad2d95f60849c767284454b_57_3.png)


    > 你很难找到 Puppy 无法轻松检测的硬件。


    由于 Puppy 体积较小，安装仅需几分钟即可直接加载到 RAM 中，Puppy 的启动时间也更短。而大多数 Linux 发行版必须同时通过 CD 和 USB
    加载，Puppy 的 RAM 加载系统意味着应用程序运行速度很快；缺点是默认应用程序的选择很少，但也是为了低资源机器考虑。缺乏资源的需求也让 Puppy 兼容多种硬件；然而，你很难找到
    Puppy 无法识别的硬件。可以确定，你可能需要在网上连接自定义的驱动程序。无论你是想在 CD 还是 USB 上运行 Puppy，你都能获得这个低资源、高性能的发行版。如果你有一台无法重新启动运行的旧电脑，加载
    Puppy 看看你是否能解决问题。所有必要的下载和更新详情可以在 www.pupplinux.com 找到。


    ![](img/aa3e09dddad2d95f60849c767284454b_57_4.png)


