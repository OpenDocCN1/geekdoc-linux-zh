    ## 5 COMMON PROBLEMS AND HOW TO SOLVE


    ### Check non-functional DNS servers


    It is quite rare, but there are times that DNS servers fail for some reason. In
    order to find whether a DNS server is working or not, you can use the following:


    ```

    ns [host]

    ```

    The first command shows the DNS server, whereas the second command shows the message
    of unsuccessful query. If you get an answer, you can also use dig and nslookup
    to perform more queries:


    ```

    ns [host]

    connection timed out; no response could be reached

    ```


    ### Assess the problem


    Troubleshooting is like debugging: the first thing is to make sure that there
    is actually a problem. The next thing is finding out if the problem affects a
    single computer, a network, or the whole. If you are not sure about the number
    of machines involved, do not try to solve the problem, but try to isolate it.
    The last way of solving the problem is by isolating components, do not forget
    to document the entire process. Figure 9 shows the format of DHCP message with
    the header of Wireshark. Find out more at http://dhcp.com/rfc2131.


    ### Check network link


    This is a scenario that happens often in real life: you need to get logs from
    remote router. Unfortunately, there was finding something wrong in the log of
    Linux machine. As result the following tcpdump command verify whether there is
    any such traffic:


    ```

    tcpdump ''udp port:5174''

    ```

    If you see anything, then you know that there is something wrong with the configuration
    of Linux machine. Otherwise, there might be something wrong with the configuration
    of Cisco router.


    ### Know the theory


    The truth is that you cannot solve DHCP without knowing the four messages of DHCP,
    which are DISCOVER, OFFER, REQUEST, and ACK, and the role of each one in the client.


