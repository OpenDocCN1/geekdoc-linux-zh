    ## Bodhi Linux 4.0


    As far as Ubuntu-based distributions go, Bodhi Linux has maintained its reputation
    for being one of the most improved in the past 24 months. Its most recent release
    was in alpha for three months, which proved to be a wise decision with the final
    product improving Bodhi in a number of areas. Files are a little smaller compared
    to Ubuntu updates, which is handy if you don''t have access to a strong internet
    connection. One potential worry is the upgrade from Ubuntu 3.2 to 4.0, and that
    users will still need to reinstall the operating system. It''s an inconvenience
    than anything, but we expect to see it rectified in an upcoming update.


    Installation has been a relatively easy affair with Bodhi, and despite some initial
    download issues, the entire process is relatively problem-free. At the heart of
    Bodhi 4.0 is its Enlightenment-based Moksha 0.1 desktop environment, which after
    its makeover, is a pleasure to use from start to finish. Various menus have been
    streamlined and in the simplest of terms, it''s easy to use and doesn''t overwhelm
    the user. It is also light enough to work on low-power machines, so it''ll blast
    through tasks you throw it at. If you want to explore, Moksha offers a wide range
    of menus, but just a small number of things that can be tweaked, and here, the
    choice is generally good. While these additions are still early, they say they
    will improve the user experience, and offer an attractive position for those moving
    across to Bodhi for the first time, considering their first move to Linux.


    Also implemented in Bodhi for the first time will be the latest Enlightenment
    Foundation Libraries (1.8.1), which once again tweaks the UI behind the window
    manager used here. During this release we noticed some issues we had before, but
    any issues have been put to rest in this stable release. Others that we raised
    in both the alpha and beta phases of Bodhi 4.0 are still to be worked on, particularly
    in window management.


    One of the most pleasing aspects of the Bodhi 4.0 release is that there''s no
    longer need for users to experience the same bugs they did in 3.2, although the
    users of 3.2 will still receive various updates until 2019, and with updates expected
    to appear again for now. There''s a list of items that have been implemented in
    Bodhi, and both alpha and beta phases have improved.


    ## Pros

    - Lots of noticeable improvements to the Moksha desktop environment, with a new
    array of customization tools that maximise the user experience.


    ## Cons

    - Lacking in certain choices and few small bugs to address, the direct upgrade
    will be an option to anyone.


    ## Summary

    You can''t fault Bodhi for what it has achieved, although there''s a few bugs
    around. It''s also nice to have no bloat and the choice of desktop elements is
    a great starting point.

