    SLS 的官方端口现已适用于 Raspberry Pi 3


    出色的 SUSE Linux Server OS 现在已获得 Raspberry Pi 3 的官方端口。该操作系统适用于 Model B 和 C 型，并将与树莓派的集成功能协同工作。


