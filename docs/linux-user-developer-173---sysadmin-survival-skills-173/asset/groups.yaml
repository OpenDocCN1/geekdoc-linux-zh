    在 Indiegogo 上成功完成了众筹，筹集了 3.4 万美元，来自 20 多个支持者。


    > 你能向我们介绍一下工具的技术规格吗？它有多强大？


    evive 由 Arduino MEGA 驱动，具备蓝牙和 Xbee 连接功能，即可用于物联网。它内置了 2600mAh 锂电池，可 evive 运行 4.5
    小时，也可以通过电源适配器或电源盒外部供电。即用的硬件接口由电机驱动器、舵机输出、电位器、开关、LED 和蜂鸣器，使其在 LabVIEW、MATLAB、Scratch、Eclipse、ROS、Python、Arduino
    IDE 和 Processing 等多个平台上工作变得简单。电容触摸界面允许一次连接 12 个项目，非常适合实验。


    > 工具包的核心是 Arduino MEGA。它在其中扮演了什么角色？


    Arduino MEGA 是强大的。这是因为 Arduino 拥有一个惊人的开源社区用于构建项目、材料和易于使用的 IDE，而且它是目前市场上最流行的原型板。


