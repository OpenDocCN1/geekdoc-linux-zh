    ## Manage file systems


    The single most important file related to file systems is /etc/fstab, which holds
    mount points, their types and other permissions about them - it is the job of
    the system to read this file in order to contain the correct information. This
    file is used by the mount command to automatically mount desired file systems
    and separating data from system files.


    In Linux system, you should start learning about the partitions of hard disks
    for two reasons: the first is that this will tell you about backup strategy and
    the second is that this will allow you to create multiple partitions when you
    want due to a hardware failure. Put simply, if a Linux machine is a MySQL database
    you will need a Linux machine with at least two partitions if you want to create
    a copy of the first machine.


    Two main kinds of partitions exist: data and swap partitions. The reason for creating
    multiple partitions is to separate data and partitions from system files and swap
    space.


    You can list all mounted disks, which are called block devices (Figure 1):


    Generally, when you want to document the characteristics and the role of a Linux
    system, you should start learning about the partitions of its hard disks:


    ```bash

    # lsblk

    NAME MIN RIM SIZE RO TYPE MOUNTPOINT

    sda 0 23G 0  disk /

    ```


    ![](img/aa3e09dddad2d95f60849c767284454b_19_0.png)


    The output of various commands (fdisk -l and part) will reveal about the partitions
    of a block device as well as the contents of an /etc/fstab file.


    ## FILE TYPES


    ### Figure 2


    The previous output shows a Linux system with a pretty simple configuration: just
    two partitions, where the first one (/dev/sda) is mounted as the second one (/dev/sdb)
    is the swap space. The block device has a device name of /dev/sda, you can print
    its partitions using one of the next two commands:


    ```bash

    # fdisk -l /dev/sda

    Disk /dev/sdb: 24608 cylinders, 64 heads, 32 sectors/track

    # fdisk -l /dev/sda

    Disk /dev/sda: 23.5 GiB, 2527217288 bytes, 4929264 sectors

    ```


    Units: 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum-optimal): 512 bytes / 512 bytes


    You can find the size of your swap space as follows:

    The previous command does not inform us about swap usage, it also tells us the
    size of the Linux system. You can also find information about your swap space
    using the swap command:


    | | free | total | used | shared |

    |---| :--- | :--- | :--- | :--- |

    | Mem: | 4864764 | 137084 | 147236 | |

    | buff/cache available | 1836 | 2496444 | 3548654 | 0 |

    | Swap: | | 4192052 | |


    ```bash

    # swap -summary

    Filename Size Used Priority

    /dev/sda5 4192052 0

    ```


    If you can get this by executing the next command, which uses the /proc: device:


    ```bash

    # dd if=/dev/zero of=swapfile bs=4096 count=4096

    # 4096+ records in

    ```


    The generated temporary file is named asswapfile and is small in real situations,
    its size will be larger than 1GB. The owner of the temporary file must be root
    for security reasons. The mkswap command makes an index of nodes, and how they
    allow the creation of a directory with multiple files and directories:


    ```bash

    4096+ records out

    16777216 bytes (17 MB, 16 MiB) copied

    0.009514 s, 1.7 GB/s

    # ls -l /swapfile

    -rw-r--r-- 1 [username] 167772

    # sudo chown root:root /swapfile

    # ls -l /swapfile

    -rw------- root root 16777216 Oct 10 12:20

    # sudo mkswap /swapfile

    # mkswap: Setting up swap partition, size: 1 GiB

    /dev/swapfile (UUID=55d8c469-f6f92-442a-88fc-92d4a55599d0)

    # sudo swapon /swapfile

    ```


    a file or a partition suitable for our swap space and the swap command enables
    the use of the file as swap space.

    The next command verifies that the created file is swap correctly:


    ```bash

    # swap -summary

    Filename Size Used Priority

    /dev/sda5 4192052 0

    ```


    ```bash

    # sudo swapoff swapfile

    ```


    If you need to swap files all the time, you''d better create an additional swap
    partition, using a file for swapping is considered not good practice.


    ![](img/aa3e09dddad2d95f60849c767284454b_20_0.png)


