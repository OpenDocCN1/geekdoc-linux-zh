    Once you''ve taken the time to get used to Ardour, it comes into a world of its
    own. The recording, editing and mixing of audio follows. Every part of it has
    its own variety of tools. Recording can be done by plugging in your external microphone,
    while still its full capability to import or MIDI from your desktop.


    When it comes to editing, all the standard workflow would excel here. Layer


