    # 教程


    # 加密你的树莓派家主目录


    使用军级加密技术让你的 Pi 数据安全无忧


    ![](img/aa3e09dddad2d95f60849c767284454b_69_0.png)


    Nate Drake

    Nate (@natewriter) 是一位专注于网络安全和复古计算的科技记者。他目前编写《Facebook》，这是一本在最大的社交网络上生存的指南。


    - 你需要的准备

    本教程兼容运行 Raspbian Jessie 的所有型号的 Pi。


    随着绚丽的 Pi 桌面的出现，伴随着精美的图标和窗口，一些读者可能正在将 Pi 作为他们的家用电脑。


    考虑到 Pi 会在不需要密码的情况下自动登录默认账户，这并不特别安全。即使设置了密码，任何人都可以挂载 SD 卡来查看你的文档、图片、视频和其他数据。


    ![](img/aa3e09dddad2d95f60849c767284454b_69_1.png)


    - 启用登录界面

    如果你还没有这样做，请在 Pi 上打开终端或通过 SSH 连接并运行以下命令：


    ```bash

    sudo nano /etc/systemd/login.conf

    ```


    以打开登录选项。滚动到 `login-user` 一行，在开头加一个哈号（#）将其注释掉。按 Ctrl+X，然后按 Y 保存并退出。你的密码现在已变为了 "raspberry"。


    - 备份你的数据

    如果你还没有这样做，请登录你的 Pi 并将 Desktop、Documents、Pictures 等内容传输到 USB 闪盘等外部介质。这将使得将数据传输到加密后的家目录变得简单得多。如果你想备份如浏览器书签等应用程序设置，可以使用
    Ctrl+H 隐藏文件夹。


    - 重启 Pi 并登录

    重启树莓派并通过屏幕登录。应该已经选择好用户名，密码应为 "raspberry"。此后，我们建议你直接在 Pi 的桌面上操作，因为你需要切换用户，这在 SSH
    上很困难。如果你没有为 Pi 连接显示器，请尝试以 ''pi'' 用户身份通过 VNC 连接。


    ![](img/aa3e09dddad2d95f60849c767284454b_70_0.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_1.png)


    其中 ''bob'' 是你的新用户。你将可以输入两次登录密码（这可以与你创建的密码相同）。完成后，请务必阅读“重要注意事项”部分。在此阶段不要重启。


    ![](img/aa3e09dddad2d95f60849c767284454b_70_2.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_3.png)


    ## 04 安装 ecryptfs 及相关文件


    在 Pi 上打开终端并运行命令：


    - sudo apt-get install ecryptfs-utils l lscrypt


    ## 05 创建新用户


    如果你认真想使用 Pi，那么无论如何你可能都想要一个以你命名的账户。使用命令：


    - sudo adduser (username)


    ## 06 创建新用户的家目录


    Ecryptfs 软件配合一个实用的工具来加密你现有的家目录。只需运行命令：


    - ecryptfs-migrate-home -u bob


    查看口令并记录下来。将密码存储在安全的地方。


    ## 07 登录新的加密用户账户


    使用 Menu>Shutdown>Log out 退出 Pi 用户，然后登录。以 ''bob'' 身份登录。在向此新账户输入任何数据之前，打开终端并简单输入命令
    `count`。这将显示大量信息；你应该能看到关于 ecryptfs 的引用，这表明加密已成功。


    你需要确认是否要安装软件。这将允许你加密家目录并在每次登录时访问它。


    ![](img/aa3e09dddad2d95f60849c767284454b_70_4.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_5.png)


    ## 08 备份你的口令


    如果你因为系统问题无法登录而将数据移动到新电脑，默认情况下你的文件是不可访问的。幸运的是有一个 Ecryptfs 工具可以恢复你的挂载口令，你可以从另一个设备访问你的文件。打开终端并运行命令


    例如 `adduser bob` 来创建你的账户。输入两次密码，然后按 Return 接受其他选项（如位置）的默认值。


    - ecryptfs-unwrap-passphrase


    ## 09 迁移你的数据


    使用 Menu>Shutdown>Reboot 重启 Pi 并以新用户重新登录。这将连接你的外部驱动器并开始将文档和数据拷回正确的位置。你会看到一个新的家目录位于
    /home/bob。


    ## 10 赋予用户管理员权限


    退出新用户并登录 ''pi''。打开终端并运行：


    ```bash

    sudo visudo

    ```


    滚动到 `root (ALL)` 行之后添加以下内容：

    ```bash

    bob (ALL) ALL

    ```

    ''bob'' 是你的用户名。按 Ctrl+X，然后按 Return 保存并退出。重启 Pi 使更改生效。![](img/aa3e09dddad2d95f60849c767284454b_71_2)


    ## 11 删除家目录备份


    在加密家目录时，如果出现问题，加密软件会在家目录下创建一个备份。由于这是一个新账户，它是空的，但打开终端并运行：


    ```bash

    sudo rm -f <directoryname>

    ```


    将其删除。![](img/aa3e09dddad2d95f60849c767284454b_71_5)


    ## 12 删除 Pi 家目录中的备份


    如果在现有文件夹中已有数据，它仍未加密，任何人都可以访问。


    ## 13 禁用交换空间


    SD 卡上有一个位于 /var/swap 的区域在 Pi 资源不足时被类似使用。对于许多 Pi 型号，该交换空间很少使用，且由于数据可能会不断写入而存在安全风险。退出用户账户，在终端运行


    ```bash

    sudo swapoff -a

    ```


    ## 14 修复权限


    取决于你从设备备份并传输数据的方法，文件和文件夹可能会出现权限问题。你可以通过以下命令将所有文件的所有者改为 bob


    ```bash

    sudo chown -R bob:bob /home/bob

    ```


    ## 15 检查你的文件是否安全


    此步骤是可选的：重启 Pi 并登录 ''pi'' 用户。打开终端，如果还没有设置，输入命令：


    ```bash

    sudo password root

    ```


    为 root 用户设置密码。输入命令切换到 root，运行：


    - /home/bob


    （''bob'' 是你的新用户名）然后使用 ls 显示目录内容。现在这里只有一个快捷方式和一个名为 ''README'' 文件，说明你的数据已受保护。


    ## 选择良好的密码


    即使你的家目录已加密，其他计算机也可以尝试破解你的密码来访问。如果结果小于百年，请考虑使用更强的密码。diceware.com 提供了一种通过随机选择单词来记忆密码的简单有效的方法。获取
    Pi 的 MicroSD 卡。登录 ''pi'' 用户并使用 shred 命令安全地删除你想要的文件


    ```bash

    shred -u <directoryname>

    ```


    但不要对家目录中的任何文件执行此操作，例如 Desktop。


