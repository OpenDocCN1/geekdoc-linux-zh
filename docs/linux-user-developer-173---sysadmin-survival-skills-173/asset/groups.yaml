    ## Troubleshoot problems


    Troubleshooting gives you the opportunity to extract everything that you have
    learned and combine it with the other knowledge you have in order to solve a problem
    that arises, the root of the problem could be a hacker who has gained access to
    one of your servers. In others, when you are troubleshooting you should assume
    that everything is working normally to go wrong. Generally, there are two big
    categories of problems: system-related and network-related. The first category
    has to do things that can go wrong locally, such as not having enough disk space
    or the problem of dealing with memory leaks. The second category is problems that
    are network-related, such as using a broken DNS server, having a faulty table
    or a defective router. Network-related problems can be pretty messy, difficult
    to isolate, especially when they combine the failure of hardware with incorrectly
    configured software.


    When you have a Linux machine with a network problem, the first thing you should
    try is to connect to a network. This helps you to realise three fundamental things:
    whether the problem affects your device or the network, or whether the problem
    is with the machine itself. When you set the DNS configuration of your machines,
    in order to use DNS servers from different geographic providers to have additional
    redundancy. The file that holds the information that the DNS server is is always
    defined in your IP address.


    The most difficult task of a system administrator is to act quickly, accurately
    and efficiently. When things go bad you should figure over the problem before
    your users or your boss and try to solve it as quickly as possible! Troubleshooting
    is also very exciting in terms of finding out a problem and taking care of it
    in the right way.


    As you cannot look at everything all the time, you should use some monitoring
    tools to get useful notifications about:


    > The root of the problem can be anything from a damaged network cable to a hacker
    who gained access to one of your servers


    A useful utility that can be used for troubleshooting is called netcat. Among
    other things, netcat can print the routing table of your machine (see netstat
    -rn or netcat -rn). An anonymous routing setup is useful for many rooting problems,
    especially on machines with more than one network interface. The network utility,
    also known as ncat, reads and writes data network connections over TCP or UDP
    using clients and servers. The following example shows how to use netcat to create
    a server that listens on port 12344 for incoming connections:


