    # 黄金组合


    测试电路通常是一项棘手的工作，但 evive 的可编程特性使得这一过程变得简单得多。它不需要昂贵的设备和示波器，而是依赖于 evive 的核心功能集。evive
    集成了一块 24 位 ADC 芯片，这为其提供了高精度的传感电路、调试和通用实验室测试功能。默认情况下，evive 可以帮助您在少于 1ms 内以完美的精度测量出
    24 位分辨率的采样率。相比之下，Arduino 板载的 AVR ADC 进行 10 位分辨率的测量需要 112us。


    为了准确地测试电路，evive 使用双通道进行同步测量，一个用于跟踪电压，另一个用于跟踪电流。通过使用隔离电源，用户能够分别跟踪每条线路，而无需担心短路。当此
    ADC 与 evive 自带的微型示波器配合使用时，示波器配备了多层跟踪选项。一旦完成测试，所有数据都可以导出到 PC 以便查看结果。测试电路从未如此简单。


    evive 在许多方面进行创新，其目标是将他人可能需要的各种因素整合到一个单一产品中。


    ## 如何将 evive 工具包作为学生的教学工具？


    世界正向新的学习方式转变，而 evive 为学生提供了构建项目所需的所有工具，帮助他们就地完成项目，帮助他们培养基本技能。学生可以通过参考我们丰富的在线文档、Hacker
    hub 项目以及许多独立项目（如硬件接口、如何制造和驱动机器人）来学习，evive 确保他们在实中学中学习。随着编程技能变得至关重要以及交互式图形化编程的兴起，它让学生能够看到自己的代码与物理世界的交互。微型示波器有助于实验结果的可视化，为手工制作增添了新的维度。我们将发布一个扩展学习包，它将成为使用
    evive 进行全面建议课程的基础。


    > 世界正向新的学习方式转变，evive 为学生提供了构建项目所需的所有工具，就地完成项目


    工具包的开源特性值得投入。人们访问其硬件和软件非常容易。


    我们目前正在编写完善文档，将在第一批产品出货前完成。文档将引导读者逐步访问我们的固件、对其进行操作并针对他们的项目进行修改，并解释每个文件实现的功能。硬件文件可以在
    GitHub 上获取，完整的电路图也将在 evive 到达用户之前发布。它们绝对会易于访问和修改——毕竟，这是开源运动的一部分。我们的使命是


    # 移动机器人


    ![](img/aa3e09dddad2d95f60849c767284454b_14_0.png)


    ## 你们的学习模块是如何与工具包交互的？为什么机械臂特别吸引人？


    我们目前有四个学习模块。初学者套件包含了各种传感器、电阻和电容器，帮助初学者探索并花费几周时间对它们进行摆腾。机械臂是一个 DIY 套件，将由 3D 打印零件、传感器和电机组成，并带有如何玩它们的详细文档。移动机器人通过蓝牙通信，机械臂可以插入
    evive 上的电位器和开关。机器人可以组装成遥控机器人、跟随者或用于避障机器人。机械臂可以组装成带有探头的机械手，或者带有特制支架可以放置铅笔的绘图手臂。我们还在为机械臂设计其他几种配置（末端执行器），它们将在我们的网站上发布，并由任何用户进行
    3D 打印。家居自动化套件利用了 evive 精确的数据采集、记录和绘图功能，结合多个传感器和继电器模块，通过 evive 让您的家庭充满活力。您可以在屏幕上监控这些器的每一个，将其存储在
    SD 卡中并直接发送到 PC。


    ## 你们对工具包的未来有什么计划？路线图中是否有任何后续开发？


    目前，我们正致力于围绕 evive 构建一个支持生态系统，包含大量的项目、教程等。一旦它进入社区手中，我们希望能够快速扩展，并接收你们对 evive 的反馈。


    我们还在考虑构建一个运行在电流（而非 5v 逻辑）下的 evive，因为会有更多支持 3.3v 的传感器和设备不断问世，这有助于改善我们的日常生活。我们还在考虑推出针对不同人群的特定版本，针对极客和专业人士。通用功能核心将出现在每个版本中，每个版本都将针对特定人群拥有特定功能，由于低价格的限制，我们在当前版本中无法引入这些功能。


