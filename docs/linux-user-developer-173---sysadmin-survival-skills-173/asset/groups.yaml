    # Tutorial


    # Encrypt your Raspberry Pi home folder


    Easily keep your data safe with military-grade encryption on your Pi


    ![](img/aa3e09dddad2d95f60849c767284454b_69_0.png)


    Nate Drake

    Nate (@natewriter) is a technology journalist specialising in cybersecurity and
    retro computing. He currently pens down Facebook, a manual for surviving a life
    on the biggest social network.


    - What you''ll need

    This tutorial is compatible with all models of Pi running Raspbian Jessie


    With the advent of the dazzling Pi desktop, with its glossy icons and windows,
    some readers may be considering a Pi as their home computer.


    This is not especially secure given that the Pi automatically logs in the default
    without requiring a password. If the password is required, anyone can mount the
    SD card to view your documents, pictures, videos and other data.


    ![](img/aa3e09dddad2d95f60849c767284454b_69_1.png)


    - Enable login screen

    If you have not already done so, open Terminal on your Pi or connect via SSH and
    run the following command:


    ```bash

    sudo nano /etc/systemd/login.conf

    ```


    to open login options. Scroll down to the login-user line and put a hash (#) at
    the start to comment it out. Press Ctrl+X, then Y to save and exit. Your password
    is now "raspberry".


    - Back up your data

    If you have not already done so, log onto your Pi and transfer the contents of
    your Desktop, Documents, Pictures etc to an external medium like a USB stick.
    This will make transferring your data to your encrypted home folder much easier.
    Use Ctrl+H to hide folders if you want to back up your application settings as
    your browser bookmarks.


    - Reboot Pi and login

    Reboot the Raspberry Pi and log in via screen. The username should be selected
    and the password should be "raspberry". Moving forward we recommend that you work
    on the Pi''s desktop directly as you will need to switch users, which is difficult
    over SSH. If you do not have a monitor for your Pi, try connecting via VNC as
    the ''pi'' user.


    ![](img/aa3e09dddad2d95f60849c767284454b_70_0.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_1.png)


    where ''bob'' is your new user. You''ll be able to enter a login passphrase twice
    (this can be the same as the password you created). Make sure to read the Important
    Notes section once this is done. Do not reboot at this stage.


    ![](img/aa3e09dddad2d95f60849c767284454b_70_2.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_3.png)


    ## 04 Install ecryptfs and related files


    Open Terminal on the Pi and run the command:


    - sudo apt-get install ecryptfs-utils l lscrypt


    ## 05 Create new user


    If you are serious about wanting to use the Pi, most probably will want an account
    in your name in any case. Use the command:


    - sudo adduser (username)


    ## 06 Create new user''s home directory


    The Ecryptfs software works with a handy-utility to encrypt your existing home
    folders. Simply run the command:


    - ecryptfs-migrate-home -u bob


    to view the passphrase and write it down. Store the passphrase as a safe place.


    ## 07 Log into new encrypted user account


    Use Menu>Shutdown>Log out of the Pi user, and log in. Bob as ''bob''. Before entering
    any data into this new account, Open Terminal and simply type the command count.
    This will show a flurry of information; you should see a reference to ecryptfs,
    which shows the encryption has been successful.


    You will need to confirm that you want to do install the software. This will allow
    you to encrypt the home directory and access it each time you log in.


    ![](img/aa3e09dddad2d95f60849c767284454b_70_4.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_70_5.png)


    ## 08 Back up your passphrase


    If you''re unable to log in because of a system problem to move your data to a
    new computer, by default your files inaccessible. Unfortunately there is an Ecryptfs
    utility to recover your mount passphrase, which can access your files from another
    device. Open Terminal and run the command


    e.g. adduser bob to create your account. Type your password twice, then press
    Return to accept default values for the other options such as location.


    - ecryptfs-unwrap-passphrase


    ## 09 Migrate your data


    Use Menu>Shutdown>Reboot to your Pi and log back as the new user. This should
    connect your external drive and begin copying your documents and data back to
    the right places. You will see a new home folder has /home/bob.


    ## 10 Give your user admin privileges


    Log out of your new user and add back to ''pi''. Open Terminal and run:


    ```bash

    sudo visudo

    ```


    Scroll down to the line root (ALL:ALL) and add a new line after this:

    ```bash

    bob (ALL:ALL) ALL

    ```

    ''bob'' is your username. Press Ctrl+X, then Return to save and exit. Restart
    the Pi to effect your changes.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_2)


    ## 11 Remove backup home folder


    When encrypting your home directory, the erypt software places a backup in the
    home folder if anything goes wrong. As this was a new account, the folder is empty,
    but to keep things simple open Terminal and run the command:


    - find out each name in /home/, then run the command:


    ```bash

    sudo rm -r -f <directoryname>

    ```


    to remove it.


    ![](img/aa3e09dddad2d95f60849c767284454b_71_5)


