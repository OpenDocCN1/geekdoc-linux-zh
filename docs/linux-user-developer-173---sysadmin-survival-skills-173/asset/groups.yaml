    ## 管理文件系统


    与文件系统相关最重要的单个文件是 `/etc/fstab`，它包含了挂载点、其类型以及关于它们的其他权限——系统负责读取此文件以包含正确的信息。`mount`
    命令使用此文件来自动挂载所需的文件系统，并将数据与系统文件分离。


    在 Linux 系统中，你应该开始学习硬盘分区，原因有两个：第一，这能让你了解备份策略；其次，当发生硬件故障时，这允许你创建创建多个分区。简单来说，如果一台
    Linux 机器是一个 MySQL 数据库，那么如果你想创建第一台机器的副本，你将需要一台至少有两个分区的 Linux 机器。


    分区主要有两种类型：数据分区和交换分区。创建多个分区的原因是将数据和分区与系统文件以及交换空间分开。


    你可以列出所有挂载的磁盘，这些被称为块设备（图 1）：


    通常，当你想要记录 Linux 系统的特征和角色时，你应该开始学习其硬盘分区：


    ```bash

    # lsblk

    NAME MIN RIM SIZE RO TYPE MOUNTPOINT

    sda 0 23G 0  disk /

    ```


    ![](img/aa3e09dddad2d95f60849c767284454b_19_0.png)


    各种命令（`fdisk -l` 和 `part`）的输出将显示块设备的分区情况以及 `/etc/fstab`文件的内容。


    ## 文件类型


    ### 图 2


    之前的输出显示了一个配置非常简单的 Linux 系统：只有两个分区，其中第一个（`/dev/sda`）被挂载，第二个（`/dev/sdb`）是交换空间。块设备的设备名称为
    `/dev/sda`，你可以使用以下两个命令之一打印它的分区：


    ```bash

    # fdisk -l /dev/sda

    Disk /dev/sdb: 24608 cylinders, 64 heads, 32 sectors/track

    # fdisk -l /dev/sda

    Disk /dev/sda: 23.5 GiB, 2527217288 bytes, 4929264 sectors

    ```


    单位：1 * 512 = 512 bytes

    扇区大小（逻辑/物理）：512 bytes / 512 bytes

    I/O 大小（最小最优）：512 bytes / 512 bytes


    你可以通过以下方法找到交换空间的大小：

    之前的命令没有告诉我们交换的使用情况，它也告诉了 Linux 系统的大小。你也可以使用 `swap` 命令找到关于你的交换空间的信息：


    | | free | total | used | shared |

    |---| :--- | :--- | :--- | :--- |

    | Mem: | 4864764 | 137084 | 147236 | |

    | buff/cache available | 1836 | 2496444 | 3548654 | 0 |

    | Swap: | | 4192052 | |


    ```bash

    # swap -summary

    Filename Size Used Priority

    /dev/sda5 4192052 0

    ```


    如果你通过执行下一个命令（使用 `/proc` 设备）可以获取此信息：


    ```bash

    # dd if=/dev/zero of=swapfile bs=4096 count=4096

    # 4096+ records in

    ```


    生成的临时文件名为 `asswapfile`，在实际情况下它很小，它的大小将大于 1GB。出于安全考虑，临时文件的所有者必须是 `root`。`mkswap`
    命令创建一个节点索引，以及它们如何允许创建一个包含多个文件和目录的目录：


    ```bash

    4096+ records out

    16777216 bytes (17 MB, 16 MiB) copied

    0.009514 s, 1.7 GB/s

    # ls -l /swapfile

    -rw-r--r-- 1 [username] 167772

    # sudo chown root:root /swapfile

    # ls -l /swapfile

    -rw------- root root 16777216 Oct 10 12:20

    # sudo mkswap /swapfile

    # mkswap: Setting up swap partition, size: 1 GiB

    /dev/swapfile (UUID=55d8c469-f6f92-442a-88fc-92d4a55599d0)

    # sudo swapon /swapfile

    ```


    一个适用于我们交换空间的文件或分区，`swap` 命令允许启用该文件作为交换空间。

    下一个命令验证了创建的文件是否正确设置了交换：


    ```bash

    # swap -summary

    Filename Size Used Priority

    /dev/sda5 4192052 0

    ```


    ```bash

    # sudo swapoff swapfile

    ```


    如果你需要一直使用交换文件，最好创建一个额外的交换分区，使用文件进行交换被认为不是良好的做法。


    ![](img/aa3e09dddad2d95f60849c767284454b_20_0.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_20_1.png)


    ## 管理用户


    图 3 显示了你如何使用 Debian 系统上的脚本在 Linux 机器上创建新用户。你可以通过搜索 `/etc/passwd` 来测试用户名是否已经存在。


    '
