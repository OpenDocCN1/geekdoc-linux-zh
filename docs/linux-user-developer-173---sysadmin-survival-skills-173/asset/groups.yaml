    ## Pros

    - A clean Linux experience free from bloat and ready to run out of the box, displayed
    on a clear and crisp screen.


    ## Cons

    - The keyboard is awkward to use thanks to badly spaced keys, and the touchpad
    layout is somewhat of a disappointment


    ## Summary

    While the keyboard is undoubtedly the laptop''s worst feature, there are plenty
    of good things about Aurora. The display is sharp, there are plenty of ports for
    future upgrades or peripherals. It''s also nice to have no bloat operating the
    system, and the choice of desktop elements is a great starting point.


