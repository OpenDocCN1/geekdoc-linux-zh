    # Rosegarden


    Rosegarden''s minimal approach to audio editing is limited to split user opinions.


    # BEAST


    Lacking some key features, does BEAST cut it out among the competition?


    Thanks to its simplistic nature, it takes little time to learn the absolute basics
    of what Rosegarden offers.


    A useful zoom feature in the workflow is great for taking a closer look at the
    audio levels of your tracks.


    # Design and interface


    Rosegarden''s minimal core for an audio editing suite does help make navigation
    easier than most of the competition. There''s a clever menu system implemented
    into the interface, allowing for a relatively simple user experience. A lack of
    customisation in the interface is the one major caveat, however.


    BEAST is a fun version of Rosegarden''s minimal approach to audio editing. It''s
    the easiest version of everything featured here, but as you''d expect, it has
    been heavily stripped back to cater to this. There''s a limit of customisation
    here, which is an annoyance, but the lack of detail in the interface means it''s
    not.


    # Tool selection


    Some tools are based on their MIDI sequencer, so there are some positive additions
    when it comes to music creation. A large part of MIDI supports it with compatibility
    with a good amount of hardware, which claims to be very plug-and-play, quick to
    get up and running without corrections.


    If you''re using BEAST to edit current tracks, then you''ll find pretty much everything
    you need. Tool for merging and merging instruments, while the flexible workflow
    allows you to explore the audio levels of tracks. Editing tools cater for the
    absolute basics, but nothing.


    # Music creation


    Due to the issues of its minimal interface we touched on, getting your head around
    Rosegarden''s layered workflow is a relatively simple task, instruments can be
    imported into the project, which automatically updates the overall audio levels
    and removes sense of feedback. Individual track control is a bit hit or miss,
    however.


    While it''s feature-packed, those looking to create music will find basic support
    for both MIDI and synth to name a few. Both of these omissions are noticeable
    and are easy to implement into your current projects. We also liked the automatic
    32-bit audio recording, a great option when to export your tracks.


    # Plugins and expansions


    Using the DSS architecture as the base of its audio plugins Rosegarden can support
    hundreds of additional instruments and tools. It does, however, suffer from certain
    problems with specified instruments. Loading can be slow, and one or two we tested
    at lack compatibility with Rosegarden''s native instrument suite.


    There''s conditional support for MMO/SSE utilization for plugins, so you''ll be
    to import a small number of instruments and additional tools as well. Support
    for hardware is also listed, but we failed to get the majority of the hardware
    we tested working correctly in BEAST from the start.


    # Overall


    The minimal approach works well in principle, and Rosegarden doesn''t skip on
    its feature set, there are some noticeable omissions littered throughout that
    might hinder the experience.


    This is for those who need the basics, but nothing more. To really compete with
    the best in this field, BEAST needs to offer a lot more to grow and grow its user
    base.


    # Review


    ## Audio editors


    ### In brief: compare and contrast our verdicts


    | Design and interface | LMMS | Ardour | Rosegarden | BEAST |

    |---|---|---|---|---|

    | Overly complicated to get around, but that''s only complicated to individual
    user needs. | Menus aren''t outlined very well, but aspects of the interface can
    easily be modified. | A useful and simple menu system leads the way within this
    clean and minimal UI. | The easiest interface to navigate out of all of them,
    but options are minimal and restricted. |

    | So vast in selection that we argue there''s too much of | We''re struggling
    to make use of an Ardour tool that isn''t included here - Ardour has its limits.
    | Plug and play hardware support is listed, but unfortunately only works sporadically.
    | Both layer management and hardware controls are the clear highlights in this
    program. |

    | Multiple layer editing causes slowdown, which is the only issue here. | Workflows
    are easily manageable and instruments are quite easy to use. | Tools are pretty
    basic, but layer control is here and miss. | There is only minimal support for
    synth, and it''s everywhere else. |

    | Plugins are vast and surprisingly easy to implement. | Additional plugins allow
    you to control their audio how they want. | Not as vast, but there are neverless
    of compatible plugins here. | While using Ardour plugins support is very problematic
    in practice. |

    | All are present, but this is a pretty complete audio editor | It can seem a
    little complicated at first, but this is the audio editor you need | The best
    of the editors that have given a minimal approach | A bit too basic throughout
    and lacking in options compared to the others |


    # AND THE WINNER IS…


    # Ardour


    There are some amazing audio editing suites out there, but many of them are limited
    to who can afford to pay a premium for them. For Linux, the options are a little
    accessible, but we''ve managed to encounter some real gems in the field. While
    we lacked a large part of what LMMS had to offer, Ardour gives here for feeling
    a more complete product.


    We tackle the bad things first. For one, it''s a highly complete set of kit and
    the learning curve is steep for this time into audio editing. Its menu system
    is hard to navigate around, however, its enough documentation that can help you
    learn the basics in a few hours.


    Once you''ve taken the time to get used to Ardour, it comes into a world of its
    own. Recording and mixing of audio follows. Every part of it has its own variety
    of tools. Recording can be done by plugging in your external microphone, while
    still its full capability to import from your desktop.


    When it comes to editing, the standard workflow would excel here. A range of instruments
    can be imported into Ardour to expand its native selection (which are many), management
    also plays a key role, and helps users manage every aspect of their project.


    Ardour is a program that requires a lot of focus and work to master the basics,
    but once you''ve crossed that hurdle, you''ll have one of the best audio editing
    suites today – without costing a penny.


