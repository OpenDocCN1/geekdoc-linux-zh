    Linux and open source magazine. We are ready for boot-up camp, and as we explore
    your favourite skills you''ll need in the wild. In this issue we learn the essential
    tools and techniques you need to manage file systems, users, permissions, troubleshooting
    to become a sysadmin right now. If you want to take complete control of your home
    network or get everything under control, jump through the essential training you''ll
    need to get fighting-fit. Also in this issue take a peek in our crystal ball to
    reveal the best distros and FOSS we found in 2017. What kind of linux you use?
    If you''re unsure which distro is ready to live off, check our guide on page 6.
    You''ll find a list of distros on which you can get the best of that via the Directory
    online, and you can access all of the FOSS we''ve covered up in this issue your
    website or theirs. You''ll also find how to boot-sweep your config, programming
    in Erlang, using tmux, to combat the threat of SQL injection and much more. Enjoy
