    With a choice of components and desktop environments, this is Ubuntu-powered Ultrabook
    a must-have device for Linux road warriors?


    For Linux users, buying a laptop can be a process fraught with peril: unsupported
    components. While Dell offers Linux pre-installed on selected models, Newcast-based
    Nimbus offers freedom to choose the board on all devices - including its flagship,
    The Aurora.


    Built to order from original design manufacturer (ODM) Topstar, the Aurora is
    a sleek aluminium device measuring 20.35mm at its thickest with a 15.6" Full HD
    (1920x1080) display panel that is bright and clear, and a keyboard, built by design.


    Sadly, this is the keyboard''s only beast. Its island-style keys are too far apart
    to be comfortable during prolonged typing, and offer a soft feel during use. The
    touchpad is serviceable, though limited to three settings: brightness, half, and
    fully off.


    Internally, buyers are given a variety of hardware choices through Nimbusoft''s
    simple configuration options. We tested the model equipped with an Intel Core
    i7-6200u dual core processor, a much more powerful Core i7 with HyperThreading
    for four simultaneous threads, 8GB of DDR4 memory, a Kingston V500 SATA SSD, and
    Intel Intel AC-9260 M.2 wireless and Bluetooth 4.0 connectivity.


    Options available at purchase include higher capacity storage, higher capacity
    RAM, an external HDMI card, and even the option to add a 1TB SSD-drive to the
    chassis''s second M.slot.


    Nimbusoft offers options for customization, through which the company has opted
    to offer Ubuntu 16.04 LTS as its exclusive Linux distribution, buyers can pick
    from a variety of environments: the default is Ubuntu Unity, GNOME, KGE, and MATE
    are available at no extra cost.


