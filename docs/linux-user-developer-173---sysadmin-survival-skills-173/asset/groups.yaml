    # Erlang using repository


    ### 1. Adding repository entry manually


    To add Erlang Solutions repository (including our public key for apt-secure) to
    your system, call the following commands:


    ```

    wget http://packages.erlang-solutions.com/erlang-solutions_1.0_all.deb

    sudo dpkg -i erlang-solutions_1.0_all.deb

    ```


    ### Alternatively: adding the repository entry manually


    Add one of the following lines to your /etc/apt/sources.list or to a custom distribution
    file, then add the Erlang Solutions public key for apt-secure using the following
    commands:


    ```

    sudo echo "deb http://packages.erlang-solutions.com/debian/ stable main" | sudo
    tee /etc/apt/sources.list.d/erlang-solutions.list

    sudo apt-key add erlang-solutions.asc

    ```


    ### 2. Installing Erlang


    Refresh the package cache and install the erlang package:


    ```

    sudo apt-get update

    sudo apt-get install erlang

    sudo apt-get update-otp

    sudo apt-get install ei-erlang

    ```


    Please refer to the FAQ for the difference between these versions.


    ### FAQ - Frequently Asked Questions


    #### 1. What is the erlang package?


    erlang/OTP is a complex system composed of many smaller applications (modules).
    Installing the erlang package automatically installs the entire OTP suite. Since
    many of the advanced users want to choose only specific selection of modules,
    Erlang/OTP is divided into smaller packages (all with the prefix-fixed erlang-)
    that can be installed independently.


    #### 2. What is eisel-erlang, how is it different from erlang?


    eisel-erlang package is a large file containing the compilation installer. It
    installs the Erlang/OTP platform and all of its applications. The erlang package
    is a frontend to a number of small modules used for compilation and eisel-erlang.


    - Note that the erlang-base has several advantages:

    1. it has fewer dependencies than erlang.

    2. other packages have dependencies on erlang-base.

    3. If you want to get it without the unused parts, erlang-base needs only 13MB
    of space.


    #### 3. My operating system using latest Erlang repository. Why should we choose
    yours?


    Our repository contains the latest stable Erlang/OTP distribution. Our packages
    are complete, for example: when we provided R16802, Ubuntu 12.04 LTS Precise Pang
    provided R14800.


    #### 4. How to prevent packages from the Erlang Solutions repository replaced
    by other repositories?


    It is very important that this would happen in the case that we provide the latest
    Erlang Solutions and the distributions are unique to change the provided Erlang/OTP
    version. The auto-update tools in Debian/Ubuntu will download the newest.


    If you are concerned, use erlang-solutions_1.0_all.deb package (without "installation
    repository") - it automatically sets our repository to a higher priority than
    others. See how to do that below:


    ![](img/aa3e09dddad2d95f60849c767284454b_50_0.png)


    ### File I/O

    This section will develop a function that accepts one argument, which is the name
    of a file; in order to create and write three iterations of the Fibonacci sequence.
    As you can already guess it, we will use the fibo() function from the practical.erli
    module, which also shows you how to get the output of other functions. The Erlang
    code of the writeFibo() function can be seen in Figure 7.


    > This is just a question to introduce File I/O in Erlang as there is no point
    in explaining all the code of writeFibro(b) to fortalk but this tutorial will
    talk more about input and outputs in Erlang.


    This tutorial is an introduction to the capabilities of Erlang. If you want to
    make your life easier, start Erlang as soon as possible to get used to Erlang
    because of the magazine issue, we are going to learn more about specific aspects
    of Erlang.


    You can get precompiled packages for installing the latest Erlang version by visiting:
    https://www.erlang-solutions.com/


    # Tutorial tmux


    ## Boost your terminal with tmux


    Do you ever feel that a terminal is too small for you? tmux helps you out.


    Traditionally, a shell instance is spawned when a user logs in. If your session
    gets lost - for example, when an SSH connection disconnects - the shell and all
    programs contained within disappear.


    tmux stands for terminal multiplexer - takes a different approach. It is helpful
    for a long-running process, which acts as a host for one or more shell instances
    and programs contained inside.


    ```

    $ tmux attach

    ```


    This is interesting for a variety of reasons: first of all a breakdown of the
    SSH connection (hello, unreliable internet connection) is no longer disaster as
    tasks running in tmux keep running. Your job continues without interruption.


    You are right back where you started out.


    The second advantage of tmux is that it allows you to arrange multiple windows
    next to one another. With this way, graphical multi-screen user interfaces are
    much easier to manage. This is especially helpful when dealing with processes,
    where power consumption drops significantly when the GPU is busy.


    ![](img/aa3e09dddad2d95f60849c767284454b_51_0.png)


    The green bar at the bottom of the window is just one window. Startup. Using Ctrl+B
    allows to create windows which, by default, occupies the entire screen. You can
    push this button as many times as want, each opening a new shell ready to act
    as host. Switching between windows is easy by pressing Ctrl+B+(number). In addition
    to that, you can jump directly to specific window by pressing Ctrl+B-. You should
    learn how to use these shortcuts soon.


    Finally, tmux allows you to multiplex your terminal session. Should you ever feel
    like heading out, simply grab your notebook and SSH to your workstation to keep
    working as if were at home.


    ## Go multi-window


    ### Attach and detach


    Getting started with tmux is really easy. Just open command-line or SSH connection,
    then enter the following command:


    ```

    $ tmux

    ```


    tmux sessions are famous for their multi-fullscreen displays: this means that
    the display can be divided into multiple areas, each of which is full of information.
    In tmux, this process can be accomplished with panes. In principle, a pane is
    an inside console where lives one of the windows we discussed. Splitting an existing
    pane can create new panes: the look of your window will change as shown the bottom
    of the screens that tmux is active. Running commands in the tmux instance can
    be done just as normal terminal - feel free to act on any command of your choice.
    Next, Ctrl+B followed by Ctrl+A creates identifier, which tells tmux the keyboard


    > @user@tmux: $ tmux

    > @user@tmux: $ bash


    ![](img/aa3e09dddad2d95f60849c767284454b_51_1.png)


    Figure 1 Pressing then key deletes session. Right green bar indicates that tmux
    is now active. Has found himself in unfortunate situation connection with remote
    systems where connections are not able to keep programs running when you disconnect.


    ## Resources

    tmux.github.io


    ![](img/aa3e09dddad2d95f60849c767284454b_52_0.png)


    Ctrl+B * will open a horizontal pane, Ctrl+B % splits the active pane vertically.
    This can be used to, for example, create the layout on the screen. Switching between
    active panes is accomplished by pressing Ctrl+B O. The current active pane can
    be promoted into full windows by pressing Ctrl+B!. This is especially helpful
    when you have just decided to take up space in the foreground of your tmux session.
    hitting the space bar accomplishes this. Each invocation of this command switches
    between one of the five default layouts. Another very trick involves pushing Ctrl+B
    Q. Finally, be aware that case, tmux will display a set of numbers. The currently
    active pane will have its number in red; passive panes are shown in blue.


    The first terminal multiplexer available for UNIX. Many developers - especially
    seasoned ones - grew up with the screen, which offered advanced features and control
    not found in tmux. Tmux is said to be more widely used among developers.


    ![](img/aa3e09dddad2d95f60849c767284454b_52_1.png)


    ## Multiply your sessions


    Tmux is limited to handling one session at the time. If you detach from one session
    and enter another session, and then detach from this as well, the program will
    hold two sessions that can be verified with tmux ls.


    ```

    $ tmux ls

    0: 1 windows (created Oct 27 22:48:30)

    1: 1 windows (created Oct 27 23:32:36)

    ```


    ![](img/aa3e09dddad2d95f60849c767284454b_52_2.png)


    ## Switch between panes


    Finding the active pane is best accomplished by looking for the cursor: the one
    with the currently taking input. Switching between panes can be best accomplished
    by pushing Ctrl+B and navigating with the arrow keys to move terminal around just
    if you are in a 2D grid like Pac-Man. An interesting aspect of tmux involves the
    ability to resize panes. This can be accomplished by pushing Ctrl+B, and holding
    the key. In this case, the currently active pane is made to expand or shrink in
    the direction of the arrow. You can also arrange panes according to a set of stands
    defined in the tmux configuration. Passing Ctrl+B and when


    ### Attach to the active sessions via the command tmux attach -t "name"

    In order to handle sessions, they can also be provided with a friendly name. This
    is accomplished by pushing Ctrl+B $. In the next step, the tmux status line will
    become familiar by pressing the Return key. When done, the session can be addressed
    via its name.


    ![](img/aa3e09dddad2d95f60849c767284454b_52_3.png)


    ![](img/aa3e09dddad2d95f60849c767284454b_52_4.png)


    ## Select text to copy the tmux clipboard


    > Graphical multi-screen user interfaces can be achieved even when you are connected
