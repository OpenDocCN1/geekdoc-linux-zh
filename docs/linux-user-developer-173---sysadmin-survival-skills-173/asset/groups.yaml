    \ of visualisation is that it gives you a quick look of your data and the opportunity\
    \ to discover abnormal situations. Visualisation can also be used in other areas.\n\
    \n![](img/aa3e09dddad2d95f60849c767284454b_24_0.png)\n\n## TOP SECURITY TOOLS\
    \ AND TIPS\n\n### nmap\nOf the first tools you should install and learn is nmap,\
    \ which is a port scanner. Figure 6 shows how nmap can perform a port scan using\
    \ an IDS router as the target. The address of this router shows what a potential\
    \ hacker would see. By not the IDS router, your internal IP address gives you\
    \ a different output.\n\n### lsof\nlsof lists open files - it can list everything\
    \ on a Linux machine. The main advantage of lsof is that it gives you detailed\
    \ information about the processes and the open ports of your Linux machine. However,\
    \ you will need to have root access on the Linux machine to execute lsof. Utilities\
    \ like lsof are suitable for execution as cron jobs, its output can be searched\
    \ using grep in order to extract the information you need.\n\n### Lynis\nLynis\
    \ is a relatively new open source auditing tool that can do many things, including\
    \ vulnerability detection and security scanning, auditing compliance, and performance\
    \ assessment. The best way to learn a tool like Lynis is by installing and using\
    \ it. You can find more online.\n\n### Hack your own computers\nAlthough there\
    \ are many tools that can protect you from being hacked, it is equally good to\
    \ use good hacking techniques and try to hack your own in order to test the security\
    \ of your network by hacking techniques and denial of service attacks instead\
    \ of waiting for someone else to do it! An effective way is to be able to see\
    \ what gets in the log files as well as the behaviour of your system under an\
    \ attack.\n\n### Security is not just about tools!\nIt's important to learn a\
    \ big truth: security is not about the tools, but also how you use them! In other\
    \ words, if you use weak passwords or do not secure your ports no tools can save\
    \ you from being hacked! A good tool is only good if you use it right. To keep\
    \ your system secure, SSH connections that use the root user is a good decision\
    \ – this can be done by editing the configuration file of SSH keys, as such and\
    \ so you can help execute commands with root privileges.\n\nimg/aa3e09dddad2d95f60849c767284454b_24_1.png)\n\
    \nwww.linuxuser.com\n\n## Feature Sysadmin\n\n## OPTIMISATION STRATEGY\n\n###\
    \ Define the problem\nThe most important phase of the optimisation process is\
    \ defining the problem you want to solve. In other words, make sure what part\
    \ of your Linux systems is failing slowly before trying to make it fast, hard\
    \ disk, or you may try to solve the wrong problem. If only two Apache server processes\
    \ are in order to serve 1000 users, using a fast server will not help as much\
    \ as starting more Apache processes! Linux systems and networks are complex, there\
    \ are many factors—design well-defined and easy-to-understand standards will definitely\
    \ help you during optimisation.\n\n### Identify bottlenecks\nWhen you are about\
    \ to solve the problem you identified, you should attempt to identify the reasons\
    \ why you have a performance problem. The bottleneck could be anything which might\
    \ run along includes a sluggish database that answers queries, a hard disk, too\
    \ many users or not enough processes. With a good knowledge of TCP/IP networks,\
    \ buying RAM and faster CPU is not enough.\n\n### Fix issues\nThe most useful\
    \ thing during the fixing is a test machine. Whenever you have multiple servers,\
    \ do not apply the solution to all of them at once. Implement it during peak hours.\n\
    \n## Optimise systems and networks\nOptimisation is an art because there isn't\
    \ one recipe that you can follow to optimise your Linux systems and networks.\
    \ Most of the time you test in order to identify bottlenecks, then resolve issues.\
    \ Additionally, upgrading your database server to the newest version might not\
    \ help the application that uses it.\n\nAlthough tools such as ab can give you\
    \ pretty good idea of how quickly a website\n\n-   An ab command-line tool to\
    \ test the performance of an Apache web server\n"
