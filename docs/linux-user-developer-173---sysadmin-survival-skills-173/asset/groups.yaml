- md: "\n## Feature Sysadmin\n\n## Lock down security please\n\nAs most of you already\
    \ know, security is important! Techniques that you see on the list are just a\
    \ good starting point. What the list does not mention is the log files that can\
    \ be easily searched using tools as grep and awk in order to extract the information\
    \ you want. The following commands will be used on the Apache logs of a Drupal\
    \ site and a WordPress site, respectively:\n\n```\n$ grep \"/wp-admin/add HTTP/1.1\"\
    \ \"/GET/register HTTP/1.1\" \"/GET/user/register HTTP/1.1\" \"/GET/user/register\
    \ HTTP/1.1\" -f f.awk\n```\n\n```\n$ grep \"POST /wp-login.php HTTP/1.1\" \"/GET\
    \ /wp-login.php HTTP/1.1\" \"/GET-\\.php\" -f f.awk\n```\n\n```\ncat HTTP/1.0\
    \ access.log | awk -f f.awk\n```\n\nBoth commands display attacks per hour. For\
    \ the WordPress site, you want to monitor the \"POST /wp-login.php HTTP/1.1\"\
    , \"GET /wp-login.php HTTP/1.1\", \"GET-\\.php\" requests that indicate brute\
    \ force attacks. For the Drupal site, you want to monitor the \"GET=/node/add\
    \ HTTP/1.1\", \"GET=/user/register HTTP/1.1\" requests that indicate direct attacks.\n\
    \nThe dow.awk file is an AWK script that calculates the day of the week a date\
    \ in the format that can be found in an Apache log file - you can use the AWK\
    \ code of dow.awk.\n\nFigure 5\n\nPlease keep in mind that attacks happen all\
    \ the time - you cannot stop attacks from happening. It is important to block\
    \ addresses correctly; sometimes you might need to create a new firewall rule,\
    \ but other times you might need to control the network or learn about the happening\
    \ attacks.\n\nAs an example, the following firewall rules block all traffic to\
    \ 8.8.8.8:\n\n```\n# iptables -A INPUT -d 8.8.8.8 -j DROP\n```\n\nBe aware that\
    \ 8.8.8.8, which is one of Google's DNS servers, is used as an example here:\n\
    \nThe following C program, as seen in random.c, uses numbers in order to generate\
    \ different-guess passwords:\n\n> cannot stop attacks from happening. What is\
    \ important to detect abnormal behaviours and act accordingly.\n\n![](img/aa3e09dddad2d95f60849c767284454b_23_0.png)\n\
    \n```c\n#include <sys/types.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n#include <time.h>\n#include <unistd.h>\n\nint dayweek(int month,\
    \ int year, int day) {\n  int dow = 0;\n  if (month == 1) month += 12;\n  if (month\
    \ < 3) year -= 1;\n  return (year + year/100 + year/400 + dow) % 7 - 1;\n}\n\n\
    int main() {\n  time_t now;\n  time(&now);\n  struct tm *t = localtime(&now);\n\
    \  printf(\"The day of the week is %d\\n\", dayweek(t->tm_mon+1, t->tm_year+1900,\
