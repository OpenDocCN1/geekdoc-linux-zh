    \n以上，如果有人可以的话，佳能，嗯……不行\n\n## SELPHY 卡住了卡住了\n\n你好 LU+，\n我有一台小型的打印机，佳能 SELPHY CP910，我用它打印数字照片。如果电脑运行在\
