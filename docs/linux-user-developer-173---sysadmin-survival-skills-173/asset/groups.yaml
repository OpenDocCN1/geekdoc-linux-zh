    # Repo-man


    cross over a lot? Linux Voice was recently invited into Linux Magazine... join
    the family!


    Why do I need an internet connection to obtain software from our distribution?
    Unlike others, who have no choice but the poisoned chalice of the internet. Between
    cyber crime, surveillance, and malware, the modern web is not always to be trusted,
    and I would rather live with mice, malware and no connection. I don''t want my
    PC accessing it. I would like my professional computer to stay exactly that—.


    Short answer: no we''re not part of the Future family, but truth is, Linux Format
    and LinuxUser & Developer are produced twenty-five miles apart. The magazines
    also have different focuses. Linux Format is more about the desktop experience.
    We do that too, but we also have a big focus on developers, systems and people
    who love Linux.


    > Phil S Shane


    There is a distro in every piece of software that you use, anywhere you could
    hide or want, it would want to run just the size of a CD or DVD, not even the
    size of a larger memory card or USB stick. It would be nice, let alone a machine.
    This is why Linux has always made use of secure repositories, accessed via the
    Terminal or a package manager, to allow users to install the FOSS they want from
    a reliable and safe location. Most repos are digitally signed so that your operating
    system can identify that the location is one and that is free from malware. It''s
    not possible for any bad actor to infect FOSS, except by spoofing a website.


    # Back to the Future


    Of those who have any choice of repos to use such as Tails (https://tails.net/),
    which offers various downloads, run internet traffic through the Tor network or
    VPN. The drive is not what it used to be, but has become much more useful than
    ever before. With distros like Tails you can be assured it''s secure. Anything
    change now that it has been taken over by Linux Publishing? So for both it remains
    completely as usual but working to produce the best Linux features and reviews
    that we can ensure that all of our readers get the best Linux magazines possible.


