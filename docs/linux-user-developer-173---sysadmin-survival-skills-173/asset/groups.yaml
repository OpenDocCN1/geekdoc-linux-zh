    SDRAM 长期以来一直是现代计算系统中系统内存的主流技术。随着时间的推移，这种变化可能会缓慢，特别是当新的相变存储器、“忆阻器”和非易失性内存变得更加主流时，但目前
    SDRAM 仍然是王者，尽管它有缺陷。它最大的优势是它是纯净的，单元能够完美地运行 0 和 1。存储在 RAM 中的数据是生命中的瓶颈。


    ## ## rowhammer 防御


    在过去的几周里，关于代码调度漏洞有许多讨论，每种漏洞都有自己的博客、推特线程和白皮书。


    我们去年讨论过的 COW（写时复制）漏洞，在已描述的漏洞列表中仍然是面临的最巨大挑战之一。


