    ## 排除故障


    故障排除为你提供了机会，提取你所学的一切并将其与其他知识相结合，以解决出现的问题，问题的根源可能是访问了你一台服务器的黑客。在其他情况下，当你进行故障排除时，你应该假设一切都在正常工作直到出现故障。通常，问题分为大类：系统相关和网络相关。第一类涉及本地可能发生故障的事情，例如磁盘空间不足或处理内存泄漏问题。第二类是网络相关问题，例如使用损坏的
    DNS 服务器、存在错误的表或缺陷的路由器。网络相关问题可能非常复杂、难以隔离，特别是当硬件故障与软件配置不当结合时。


    当你拥有一台有网络问题的 Linux 机器时，你应该尝试的第一件事是连接网络。这有助于你意识到三个基本点：问题是影响了你的设备还是网络，或者问题是否在机器本身。当你设置机器的
