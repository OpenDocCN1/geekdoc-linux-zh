    ## Live boot


    Insert the disc into your computer and reboot. You will need to make sure your
    computer is set to boot from disc.


    ## Distros


    Distros can be live booted that you can run a non-operating system instantly without
    permanent changes to your computer.


    ## FOSS


    Free and open-source software needs to be installed via the distros or by using
    the disc.


    ## Explore


    Alternatively you can insert and run the disc to explore the interface and content.


    ## OpenSource


    08 News & Opinion | Interview | 9 File


    ## HARDWARE


    ## Can Intel rival the Raspberry Pi?


    With unrivalled power, the new wave of SBCs with Apollo Lake chipsets revolutionise
    projects. Intel''s Apollo Lake chips made their debut towards the beginning of
    2016, but until now, have largely been seen nor heard. With promising performance
    for mobile and 2-in-1 devices, it is said to be succeeded by the acclaimed Blackwell
    family with improvements to IPC. The gadget is vital to the first Single Board
    Computers with Apollo Lake already implemented. Emerging manufacturers like Intel
    have made what is considered to be the first range of SBCs using Atom processor.
    By taking advantage of different chipsets in the Apollo Lake family, these three
    boards come with 8GB of RAM, a SATA 3.0 port and Wake-on-LAN. Due to the availability
    of the Atom variant, the board itself looks different from the rest of the lineup.
    If size is important, a miniature version of the Atom will also be available.
    The Atom+ also has built-in WiFi and a USB slot for wireless connectivity. Alone,
    the Atom+ is currently the high-end option in mind. Expect that with any SBC,
    connection options are limited. The front of the board has a single HDMI port
    that can be doubled up as LVDS interface. Its central connection is HDMI, according
    to official sources, and it has five USB 3.0 ports, but only one of these is a
    2.0 interface, something to bear in mind. Above each board includes an embedded
    multi-core processor. The official word on pricing has been announced for either
    of these high-end boards, or their counterparts for sale. At the time of writing,
    only Apollo announced full compatibility with the Linux kernel, and for Android.
    However, due to the new Blackwell-based boards all containing support for Linux,
    it''s widely expected that the trend will continue here.


    ## TOP FIVE: Arch-based distributions


    ![](img/aa3e09dddad2d95f60849c767284454b_8_0.png)


    ### 1 Antergos


    Although it started life solely offering the Cinnamon desktop, Antergos has carved
    a name for itself by being one of the first distros that now offers support for
    GNOME, Qt and XFCE. Without doubt it provides its graphical installation program.


    ### 2 Chakra


    While Chakra is not as well-known as others listed here, it is listed in many
    of these places. Automatic hardware detection is a big plus here, allowing easy
    installation for most third-party hardware on any device.


    ![](img/aa3e09dddad2d95f60849c767284454b_8_1.png)


    ### 3 Manjaro


    Manjaro is one of the few arch-based distributions to offer rolling updates, but
    this method helped its users receive timely and stability. Its popularity has
    led it to be one of the most popular distros today.


    ### 4 ArchLinux


    What ArchLinux has made such a splash out is that it enables users to integrate
    web apps into their top-desktop environment by the fantastic IE browser and installation
    program.


    ### 5 ArchBang


    Although it may have slowed down on Arch, its lightweight and usability are suitable
    for portable desktops when loading it today. It''s one of the few that rests on
    the Openbox window manager.


    ![](img/aa3e09dddad2d95f60849c767284454b_8_2.png)


    ## ANDROID


    ## Welcome to a small powerful media centre


    ## Remix debuts Nougat-powered console and PC hybrid


    The Android x86-based Remix OS was a showcase of technical prowess, flourishing
    the powers of Android on personal computers. Due to its success, the team behind
    Remix has gone further by combining the elements of the OS with desktop elements.


    Named Remix OS, the devices include all the capacity of a mini set top box, with
    the key elements of a low-ending PC. As it runs, it is a highly modified version
    of the Remix OS, but still features everything you love about Android. A wonderful
    interface, and although doesn''t allow much in customisation, it is easy to install
    Google Play Store.

