    ## SOFTWARE


    ### Can FOSS take on Photoshop?

    Krita 3.1 beta throws the gauntlet to Adobe


    Despite entering its second beta phase only a few weeks ago, the open-source digital
    painting software Krita is now among one of the final stages before its major
    update. For users, the changes will be instantly noticeable. Many annoying issues
    have not been patched, with the constant crashes that users were facing now removed.
    Bugs are also plentiful, improved tool support and better integration, again begun
    however.


    This beta release also brings new tools to work. The Mirror mode has been enhanced
    to work with different. Lots of animation tools are in the update as well greatly
    missed cursor from the Transform also has been restored. Other changes include
    a new paintbrush introduced, while merging two layers will now merge skins also.
    One bad thing to come from the release of the beta is that the Lazy Brush plugin
    may be moved prior to the first release. We will properly restore feature in the
    final release because the current implementation.


    It''s expected that this third beta phase will be supported for a while, so interested
    parties can find all download links at www.kritrita.org.


    Speed improvements have also been made to increase usability, with start-up benefit
    to save time and effort. Here Kate has also been drafted in the new messaging
    protocol, which the GCE 2 printing system is slow to use.


    *Winter Smith*


    ## DESKTOP


    ### Trinity Desktop apps GCE and GDB support

    Depending on your distribution of choice, some of you will have heard of the Trinity
    Desktop Environment, and some will not. Known for its design and simplicity, it
    can be found on the links of SparkyLinux, PCLinOS and CentOS.


    "R14.0 is the fourth maintenance release of the R14 series, and is built on and
    improves the R14.0.3 release. Maintenance releases are intended to bring bug fixes
    to users. This release is the first and foremost bug fix and security update,
    largely in the wake of the Dirty COW exploit, there are also many new features
    in addition. There is also support for useful compilers, which can now make use
    of we''re still looking for and experimenting with new algorithms. With the current
    beta you will get a preview of how the user interface will work, but we need feedback
    and are working on fix," states the official release announcement.


    Support for the Trinity Desktop Environment has grown and these changes also improve
    adoption rates even faster. You can all head to www.trinitydesktop.org for all
    download links and installation requirements.


    ## Budge is the latest official Ubuntu flavour

    The Ubuntu community continues to grow with latest development.


    One of the primary reasons others chose Ubuntu is the sheer number of unique ''flavours''
    it has available. While Budge''s user base is larger than ever before, the team
    of developers has now released the latest official Ubuntu release. This release
    is set to be working on Ubuntu 17.04, and as of now, it''s unknown how it will
    be supported and developed in years to come.


    Budge is a desktop environment developed by the makers of Solus and incorporates
    many more of GNOME features. It includes its own user interface. In Ubuntu Budge,
    users will have access to the complete suite of Budge features, which include
    the modern desktop system that has huge potential.


    Due to the Solar team currently working on the release, it expects that the release
    of Budge will be delayed until the first quarter of 2017. Having official status
    will also mean that the team will get to finish the Ubuntu website, and a larger
    role in the continued development of Ubuntu community going forward.


