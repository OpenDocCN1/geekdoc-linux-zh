    # Rosegarden


    Rosegarden 极简主义的音频编辑方法引起了用户的两极分化。


    # BEAST


    在缺乏一些关键功能的情况下，BEAST 能在竞争中脱颖而出吗？


    得益于其简单的本质，学习 Rosegarden 提供的基础知识并不需要太多时间。


    工作流中一个实用的缩放功能非常便于近距离观察音轨的音频电平。


    # 设计与界面


    作为一款音频编辑套件，Rosegarden 的极简核心设计确实让导航比大多数竞争对手更加易用。界面中实现了一个巧妙的菜单系统，提供了相对简单的用户体验。然而，界面缺乏自定义功能是其主要的缺点。


    BEAST 是 Rosegarden 极简音频编辑方法的一个趣味版本。它是这里介绍的所有功能中最简单的一个，但正如你预期的的那样，为了这一点，它经过了大量的精简。这里的自定义程度非常有限，这令人烦恼，但界面细节的缺失意味着它也并不那么糟糕。


    # 工具选择


    某些工具基于其 MIDI 序列器，因此在音乐创作方面有一些积极的补充。大部分 MIDI 支持它，并兼容相当数量的硬件，这些硬件号称非常即插即用，可以快速启动而无需修正。


    如果你使用 BEAST 编辑当前音轨，你将找到几乎你需要的一切。有合并音轨和乐器的工具，而灵活的工作流允许你探索音轨的音频电平。编辑工具满足了最基础的需求，但仅此再无了。


    # 音乐创作


    由于我们提到的极简界面问题，理解 Rosegarden 的分层工作流是一项相对简单的任务；乐器可以导入项目中，这会自动更新整体音频电平并消除反馈感。然而，单个音轨的控制却参差不齐。


    虽然它功能丰富，但想要创作音乐的人会发现对 MIDI 和合成器仅有基础支持（仅此一二）。这两个缺失都是显而易见的，并且很容易整合到你当前的项目中。我们还喜欢自动
    32 位音频录制，这是导出音轨时的一个极佳选项。


    # 插件与扩展


    Rosegarden 以 DSS 架构作为音频插件的基础，可以支持数百种额外的乐器和工具。然而，它在特定乐器上会遇到某些问题。加载速度较慢，我们测试的其中一两个乐器与
    Rosegarden 的原生乐器套件缺乏兼容性。


    插件对 MMO/SSE 利用具有条件支持，因此你也可以导入少量的乐器和额外工具。硬件支持也被列在内，但我们未能让测试的大多数硬件在 BEAST 中从一开始就正常工作。


    # 总结


    极简的方法在原理上是行的，而且 Rosegarden 并没有忽略它的功能集，但处处存在着一些明显的缺失，可能会阻碍体验。


    这是为那些只需要基础功能而不再需要的人准备的。要真正与该领域的顶级产品竞争，BEAST 需要提供更多内容来成长并扩大用户群。


    # 评测


    ## 音频编辑器


    ### 简要回顾：对比我们的我们的定论


    | 设计与界面 | LMMS | Ardour | Rosegarden | BEAST |

    |---|---|---|---|---|

    | 导航过于复杂，但这种复杂仅针对个人用户需求而言。 | 菜单轮廓不够清晰，但界面的某些部分可以轻松修改。 | 有用且简单的菜单系统在这个整洁极简的 UI
    中处于领先地位。 | 所有界面中最容易导航的界面，但选项极少且受限。 |

    | 选择如此丰富，以至于我们认为内容太多了。 | 我们正努力使用一个此处未包含的 Ardour 工具——Ardour 有其局限性。 | 列出了即插即用的硬件支持，但遗憾的是仅工作不稳定。
    | 图层管理和硬件控制是该程序的明显亮点。 | 对合成器仅有极少支持，而在其他地方如此。 |

    | 多层编辑会导致减慢，这是这里唯一的问题。 | 工作流很容易管理，乐器非常容易使用。 | 工具非常基础，但图层控制在这里表现不一。 | 对合成器仅有极少支持，而且无处不在。
    |

    | 插件非常庞大且实现起来异常地简单。 | 额外的插件允许你以想要的方式控制音频。 | 虽然没有那么丰富，但这里仍然有很多兼容插件。 | 虽然使用 Ardour
    插件时在实践中存在非常严重的问题。 |

    | 功能应备全，这是一个相当完整的音频编辑器 | 起初看起来可能有点复杂，但这正是你需要的音频编辑器 | 在所有采用极简方法的编辑器中是最好的 | 整个过程中都太基础了，与其他产品相比缺乏选项
    |


    # 获胜者是……


    # Ardour


    市场上有一些惊叹的音频编辑套件，但其中许多仅限于负担得起溢价的人群。对于 Linux 来说，选择稍微容易获得，但我们成功在该领域发现了一些真正的瑰宝。虽然我们缺乏
    LMMS 提供的大部分功能，但 Ardour 在这里给人一种更完整产品的感觉。


    我们先处理糟糕的一面。首先，它是一套非常完整的设备，对于目前接触音频编辑的时间来说，学习曲线非常陡峭。然而，它的菜单系统很难导航，但有足够的文档可以帮助你在几小时内学会基础知识。


    一旦你花时间习惯 Ardour，它就会进入一个属于自己的世界。接着是音频的录制和混音。它的每一个部分都有各种工具。录制可以通过插入外部麦克风完成，同时仍然具有从桌面导入的完整能力。


    在涉及编辑时，标准工作流在这里表现出色。可以将多种乐器导入 Ardour 中以扩展其原生选择（这已经很多了），管理也起着关键作用，帮助用户管理项目的每个方面。


    Ardour 是一个需要投入大量精工作才能掌握基础的程序，但一旦你越过了那个门槛，你就拥有了当今最好的音频编辑套件之一——而且不需要一分钱。


    Oliver Hill


    - Linux 开发者

    - Linux & 开发者

    - 分类广告

    - Linux & 开发者

    - 生日

    - 扫描你的奖励

    - 二十年托管

