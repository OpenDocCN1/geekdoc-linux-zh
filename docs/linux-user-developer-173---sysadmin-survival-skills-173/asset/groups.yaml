    \        10 -> iowrite(\"10\");\n        20 -> iowrite(\"20\");\n        _ ->\
    \ iowrite(\"Unknown!\")\n    end.\n```\n\n这展示了 Erlang 中 `case` 语句的使用，它允许你根据条件匹配变量。\n\
    \n```erlang\nreadlines(FileName) ->\n    (Ok, Device) = openfile(FileName, read)\n\
