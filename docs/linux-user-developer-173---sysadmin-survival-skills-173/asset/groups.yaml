    \n- 8=12\n** error: no match of right hand side 123\n\n2 展示了另一个与 Erlang shell\
    \ 的交互，让你更熟悉它——你应该尝试匿名重载。\n\n# 变量与数字\n\nErlang 变量以大写字母或原子（atom）开头。如果你尝试一个不同的变量，将得到这种错误信息：\n\
    \nErlang 的设计从诞生初就遵循六个原则。第一是**隔离**。Erlang 进程拥有自己的栈并进行独立的垃圾回收。进程之间不共享内存，不会损害彼此。第三是**并发**。Erlang\
    \ 进程是并发的，这是一个非常好的特性，计算机具有多核心处理器来检测故障。你可以在两个进程之间建立链接。当进程由于原因失败时，你可以对其进行升级并重启。这样，当出现问题时，你可以无需运行即可修改或升级代码！第五是**容错**：当进程失败时，Erlang\
    \ 运行时会告诉你进程已失败。最后是**持久化**：如果你使用 Mnesia、Riak 或其他支持的数据库存储数据，数据就不会丢失。\n"
