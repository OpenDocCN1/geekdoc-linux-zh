    If you have data already in the existing ''pi'' folder, it is still unencrypted
    and can be accessed by anyone who


    ## 13 Disable swap space


    There is a portion of the Pi''s SD card located in /var/swap that is used in a
    similar way when the Pi is low on resources. For many Pi models this swap is rarely
    used and can present a security risk as your data may be written constantly. Log
    out of your user account, Terminal and run


