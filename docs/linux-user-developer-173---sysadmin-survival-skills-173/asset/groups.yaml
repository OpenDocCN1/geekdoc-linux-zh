    \ -> 1;\nfib(N) -> fib(N-1) + fib(N-2).\n\nfor(_, _) ->\n    [];\n\nfor(N,Term)\
    \ when N > 0 ->\n    write(\"~w:n\", [N,Term]),\n    for(N-1,Term).\n\nstart()\
    \ ->\n    for(5,1).\n```\n\n这展示了 Erlang 的能力，包括显示系统的 IO 命令。\n\n![](img/aa3e09dddad2d95f60849c767284454b_47_0.png)\n\
    \n第一条命令使用 `erlang` 编译 Erlang 代码，Erlang 编译器是一个生成器，它产生用于解释 BEAM 代码的虚拟机的 BEAMS 文件。第二条命令创建一个交互式\
    \ shell，它是 Erlang 运行时的二进制文件，由 `erl` 自动启动，以执行 `helloworld` 函数，并打印出所需的消息。\n\n退出\
    \ Erlang shell 的原因可以在命令的最后部分（`-s stop`）找到，它在退出目标模块函数后触发文本。或者，你可以通过在不带参数的情况下输入\
    \ `erl` 进入 Erlang shell 并执行函数：\n\n```bash\n1 erl()\n(ok)\n2 erl:helloworld().\n\
    Hello, world!\n(ok)\n3 -s stop\n(ok)\n```\n\n第一条命令编译包的代码，第二条命令执行函数。如你所见，每个命令都应该以句号（`.`）结束。\n\
    \n函数式编程是一种编程范式，计算被视为数学函数的求值，并避免改变状态和副作用，以编写代码。\n\n```\nerlc helloworld()\nerl\
    \ -noshell -s practical start -s init stop\n5: 5\n4: 4\n3: 3\n2: 2\n1: 1\n```\n\
    \n现在是时候尝试一个更实用的例子了。函数中的 Erlang 代码定义了一个函数，允许你计算属于斐波那契数列的自然数。序列 1 显示了 practical\
    \ 的 Erlang 代码，你也可以看到如何迭代循环（这在 Erlang 中是没有预定义的）。\n\n你将看到如何使用 `helloworld` 函数在屏幕上打印输出。`helloworld`\
