    ## INTERVIEW AKSHAT AGARWAL


    ### How evive could revolutionise maker projects worldwide

    The evive toolkit is a one-stop solution for students and maker communities who
    want to create robots and build for the Internet of Things.


    #### Akshat Agarwal

    He is a co-founder of Aglo Technologies, the company behind the development of
    the evive toolkit. He''s also a first year undergraduate student at the Indian
    Institute of Technology in Kanpur.


    > For readers who may not have heard of the evive toolkit, could you give us an
    overview of what it is and what it does?


    evive is an Arduino-based open-source platform for learning and prototyping electronics
    circuits, creating robots and hacking better IoT solutions. It has been designed
    as a one-stop solution for the student, hobbyist, and maker communities. The idea
    behind evive was to prototyping intuitively and frequently. We have done just
    with our menu-based visual interface, which removes the need to reprogram the
    Arduino frequently and removes repetitiveness. evive offers high accuracy sensing
    capabilities for IoT applications and debugging, all in a portable battery-powered
    unit.


    evive has successfully completed a crowdfunding campaign on Indiegogo, raising
    $34k from 300+ backers in over 20 countries. It is currently in production, and
    first shipment will be out.


    > Could you give us an insight into the technical specifications of the toolkit?
    How powerful is it?


    Powered by an Arduino MEGA, evive is iot-ready with Bluetooth and Xbee connectivity.
    It has 2600mAh Li-ion battery inside, which can power evive up to 4.5 hours, and
    can also be powered externally from a wall adapter or power pack. The plug-and-play
    hardware interface consisting of motor drivers, servo outputs, potentiometers,
    switches, LEDs and buzzer makes working easy across multiple platforms like LabVIEW,
    MATLAB, Scratch, Eclips, ROS, Python, Arduino IDE, and Processing. The capacitive
    touch interface allows connecting to 12 items at a time, perfect for experiments.


    > The hub of the toolkit is the Arduino MEGA. What sort of role does it play in
    this?


    The Arduino MEGA is powerful. It is because Arduino has an amazing open source
    community for building projects, materials and an easy-to-use IDE, and it is currently
    the most popular prototyping board on the market: every project connects to various-purpose
    toolkit on top of Arduino, adding it with things like a TFT screen, data acquisition
    and logging module.


    ### STEM learning with evive

    There''s a major shift towards STEM learning as of late, allowing students the
    freedom to get hands-on when out of the classroom. One of the primary functions
    of evive is that the perfect classroom environment includes a flexible system
    that can be adapted to work with various hardware tools and modified to be experimented
    with. For students, it provides the necessary tools to learn the basics without
    overlapping complex processes. Things like building robots, electronics and making
    a stereo is possible here. With the learning process, the evive team is creating
    a huge base of video tutorials and documentation, which can be used as a source
    of ideas for students to help improve their learning. If you''re a student looking
    for a way in the world of development for your first time, head across evive.cc
    for more information.

