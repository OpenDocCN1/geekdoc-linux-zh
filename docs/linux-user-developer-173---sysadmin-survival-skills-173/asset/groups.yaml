    # The winning combination


    Testing circuits is usually a tricky affair, but the programmable nature of evive
    makes the process considerably simpler. There''s no need for expensive equipment
    and oscilloscopes, and instead rely on evive''s core feature set. Integrated into
    evive is a 24-bit ADC chip, which gives it precision sensing circuitry, debugging
    and general lab testing. By default, evive can help you measure 24-bit resolution
    rates in less than 1ms with perfect accuracy. For comparison, Arduino''s onboard
    AVR ADC takes 112us for 10bit resolution.


    To test circuits accurately, evive uses dual channels for simultaneous measurements,
    one being for tracking voltage and the other for tracking current. By using an
    isolated powered supply, users are able to track each individually, without fear
    of shorts. When this ADC is used in conjunction with evive''s on-hand mini-oscilloscope,
    equipped with multiple layers of tracking options. Once you''ve done the testing,
    all of the data can be exported to a PC for easier expectation. Testing circuits
