    # On your free DVD this issue


    Find out what on your free disc


    **Welcome to the Linux User & Developer DVD.** This issue, we''re looking ahead
    to the next year in Linux, so we''ve selected the best distros and FOSS for 2017.
    Give some of them a whirl – you''ll find Puppy Linux, Maui and Arch Linux to live
    boot from disc, while our other picks join the Distro Directory. Remember, you
    can get all of the FOSS in our feature straight through your choice of distro,
    or from their respective websites.


    ## Featured software:


    ![](img/aa3e09dddad2d95f60849c767284454b_5_0.png)


    Puppy Linux is a special build of Linux meant to make computing easy and fast,
    allowing you to recover data from destroyed PCs or by making a live USB drive.
    For the best lightweight distro, it''s so small and light on resources that it
    can be perfect for giving old hardware a new lease of life!


    ## Puppy Linux


    ![](img/aa3e09dddad2d95f60849c767284454b_5_1.png)


    Arch is a simple, lightweight and flexible distribution that tries to keep it
    simple. it''s also exceptionally powerful, especially once you''ve got the time
    to configure it to exactly your requirements. For reason, it''s your pick for
    the best distro for developers.


    ## Arch Linux


    ![](img/aa3e09dddad2d95f60849c767284454b_5_2.png)


    ## Load DVD


    To access software and tools files, insert the disc into your computer and double-click
    it.


    ## Live boot


    To live-boot into the distros supplied on this disc, insert the disc into your
    drive and reboot your computer.


    ## Please note:


    - You will need to ensure your computer is set up to boot from your computer''s
    BIOS screen to Change Options

    - Some computers require you to press a key to enable booting from media; check
    your manufacturer''s website to find out if this is the case

    - Live-booting distros are run from the disc; they will not be installed on your
    computer unless you choose to do


    ## For results:


    This distro has been chosen for its method of rendering recent updates to the
    HTML and CSS standards. To get the best results we recommend you use:


    - Internet Explorer 8 or higher

    - Safari 4 or higher

    - Chrome 5 or higher


    ## Problems with the disc?


    Send us an email at linuxuser@imagine-publishing.co. Please tell us if you are
    having problems using the programs or resources provided, then include relevant
    software names.


    ![](img/aa3e09dddad2d95f60849c767284454b_5_3.png)


    The second version of Maui comes with new features, ways and repositories, on
    Ubuntu 16.04 and KDE Plasma. It looks great, but even more importantly it works
    seamlessly and is packed with media and gaming potentials. That''s why we''ve
    chosen it as our best distro for entertainment!


    ## Maui Linux


