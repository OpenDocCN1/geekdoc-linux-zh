    ### FOSS 能竞争过 Photoshop 吗？

    Krita 3.1 Beta 版向 Adobe 发起了挑战


    尽管在几周前才刚进入第二个 Beta 阶段，但开源数字绘画软件 Krita 现在已处于其重大更新前的最后阶段之一。对于用户来说，这些变化将是立而易见的。许多困人的问题尚未修复，而用户面临的频繁崩溃问题现已消除。Bug
    仍然很多，但改进的工具支持和更好的集成已再次开始。


    此 Beta 版本发布还带来了新的工作工具。镜像模式（Mirror mode）已增强，可以处理不同的操作。更新中还包含了许多动画工具，同时变换工具（Transform）中备受怀念的光标缺失也得到了恢复。其他变化还引入了新的画笔，而合并两个图层时现在也会合并皮肤（skins）。该
    Beta 版本发布中的一个缺点是，懒人笔刷（Lazy Brush）插件可能会在正式发布之前移动。由于目前的实现方式，我们将在正式发布中适当恢复该功能。


    预计第三个 Beta 阶段将支持一段时间，感兴趣的读者可以在 www.kritrita.org 找到所有下载链接。


    为了提高可用性，还进行了速度改进，启动时的优化可以节省时间和精力。在这里，Kate 还被引入了新的消息协议中，该 GCE 2 打印系统使用缓慢。


    *Winter Smith*


    ## 桌面


    ### Trinity 桌面应用支持 GCE 和 GDB

    根据你选择的发行版，你们中的一些可能听说过 Trinity 桌面环境，而有些人可能没有。它以设计和简洁著称，可以在 SparkyLinux、PCLinOS
    和 CentOS 的链接中找到。


    “R14.0 是 R14 系列的第四个维护版本，基于 R14.0.3 版本构建并进行了改进。维护版本旨在为用户提供错误修复。此版本是首要的错误修复和安全更新，很大程度上受到
    Dirty COW 漏洞的影响，此外还包含许多新功能。它还支持实用的编译器，这些编译器现在可以利用我们仍在寻找和实验的新算法。通过当前的 Beta 版本，你将预先看到用户界面的工作方式，但我们需要反馈并正在进行修复，”官方发布公告写道。


    对 Trinity 桌面环境的支持不断增长，这些变化也进一步地提高了采用率。你可以全部前往 www.trinitydesktop.org 获取所有下载链接和安装要求。


    ### Budge 是最新的官方 Ubuntu 衍生

    Ubuntu 社区随着最新的开发持续增长。


    其他人选择 Ubuntu 的主要原因之一是它提供了海量的独特“变体”（flavours）。虽然 Budge 的用户群比以往任何时候都要多，但开发团队现在已经发布了最新的官方
    Ubuntu 版本。该版本设定在 Ubuntu 17.04 上运行，截至目前，尚不清楚未来几年它将如何被支持和开发。


    Budge 是由 Solus 制作者开发的桌面环境，整合了更多 GNOME 特性。它拥有自己的用户界面。在 Ubuntu Budge 中，用户将可以使用完整的
    Budge 功能套件，其中包含一个具有巨大潜力的现代桌面系统。


    由于 Solar 团队目前正在开发该版本，预计 Budge 的发布将延迟到 2017 年第一季度。获得官方身份也意味着该团队将能够完成 Ubuntu 网站，并在未来
    Ubuntu 社区的持续发展中发挥更重要的作用。


