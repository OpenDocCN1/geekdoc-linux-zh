    # 评测 Nimbusoft Aurora


    ## 硬件


    - CPU: Intel ''Skylake'' Core i5-6200U (2.3GHz Turbo 2.8GHz)

    - GPU: Intel HD Graphics 520 (10GHz 动态)

    - 存储: 128GB NVMe SSD

    - 内存: 8GB DDR4

    - 网络: Wi-Fi-802.1ac 波段，蓝牙 4.0

    - 连接: 1x USB 3.0, 2x USB 2.0, HDMI, 模拟音频, SD 卡阅读器

    - 尺寸: 15.6"

    - 摄像头: 带麦克风的 HD

    - 电池: 六芯锂离子电池，48.8Wh

    - 操作系统: Ubuntu 16.04 LTS

    - 质修: 一年整及部件

    - 重量: 1.9kg（不含线缆）

    - 价格: £649.96（含增值税）


    凭借组件和桌面环境的选择，这款由 Ubuntu 驱动的 Ultrabook 是 Linux 移动战士的必备设备。


    对于 Linux 用户来说，购买笔记本电脑可能是一个充满危险的过程：不支持的组件。虽然 Dell 在选机型上预装了 Linux，但基于 Nimbusoft
    的产品提供了对所有设备选择主板的自由——包括其旗舰产品 Aurora。


    Aurora 由原始设计制造商 (ODM) Topstar 定制，是一款光滑的铝制设备，最厚处为 20.35mm，配备 15.6 英寸全高清 (1920x1080)
    显示面板，明亮清晰，并配有设计的键盘。


    遗憾的是，这是键盘唯一的“猛兽”之处。它的岛式按键间距太远，长时间打字不舒服，且使用时手感柔软。触控板尚可，但仅限于三种设置：亮度、半亮度和完全关闭。


    在内部，买者通过 Nimbusoft 简单的配置选项获得了多种硬件选择。我们测试了配备 Intel Core i7-6200u 双核处理器、具有超线程技术的四线程更强大的
    Core i7、8GB DDR4 内存、金士顿 V500 SATA SSD 以及 Intel AC-9260 M.2 无线和蓝牙 4.0 连接的型号。


    购买时的可用选项包括更大容量的存储、更大容量的内存、外部 HDMI 卡甚至可以在机身的第二个 M 槽中添加 1TB SSD 硬盘。


