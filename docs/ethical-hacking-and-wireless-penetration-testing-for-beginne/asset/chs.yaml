- '# 初学者指南：道德黑客与无线渗透测试：使用 Kali Linux 攻击无线网络




  ![](img/image_rsrcY7.jpg)










  ## 引言

  无线渗透测试已成为专业渗透测试人员的一项关键技能。本书将为您提供信息和关键行业洞察，帮助您对无线网络进行压力测试，从而帮助您更好地配置、管理和操作空中网络。不需要预先具备无线知识，但如果您对计算机或网络设备（如网络交换机、路由器或常用协议）具有一些工作经验，将会有利。本书将为您提供信息和关键行业洞察，帮助您设计、配置、管理和操作无线网络。


  首先，我们将从无线局域网（LAN）的基础开始，学习工作原理、使用的频率以及部署无线局域网时的预期性能。接下来，您将学习如何安装基础无线局域网系统，如自主式或轻量级接入点、无线局域网控制器，并能够将此技术部署到现有的线基础设施中。您还将学习无线局域网客户端配置文件，例如连接到无线局域网所需的笔记本电脑或平板设置。无线局域网的安全至关重要，因此您还将学习各种
  `802.11` 认证和加密选项来保护无线局域网。


  接下来，您将学习如何解决常见的无线局域网问题，例如寻找干扰源或追踪基础连接问题。我们将从电磁频谱、射频（RF）基础和不同天线类型开始讨论。接下来，您将学习 `2.4
  GHz` 与 `5 GHz`频段之间的区别、接入点（Access Points）的法律要求以及存在的无线网络分类。然后，我们将涵盖调制基础、射频编码以及如何影响射频信号。之后，我们将涵盖路径损耗、信干扰比（SIR）和链路预算（Link
  Budget）计算。


  继续，您将学习无线组织，例如 `IEEE 802.1` 组和 `802.11` 标准。接下来，我们将涵盖 `MIMO` 技术、波束成形（Beamforming）、信道聚合（Channel
  Bonding）以及存在的无线局域网类型。然后我们将开始查看 WLAN 客户端适配器、无线局域网控制器和 PoE 接入点。接下来，您将学习 `SSID` 基础、信标（Beacons）、主动与被动扫描、认证与关联请求（Authentication
  & Association Requests）以及帧类型（Frame Types）。


  接下来，我们将深入无线安全策略基础，以及如何创建或完善无线策略。最后，我们将概述 `802.11 a/b/g/n/ac` 与 `ax` 或 `Wi-Fi 6`
  技术之间的差异，并学习即将部署且将非常流行的 `5G` 网络。接下来，我们将讨论无线网络安全威胁和应对措施。首先，我们将讨论首要无线安全威胁。例如，当你在咖啡馆或机场时，会面临什么种威胁。我们不仅将讨论威胁，还将讨论您可以用以应对这些威胁的各种机制。许多人没有认为在连接到未知无线网络时，这些地方可能是危险的环境，但我们将从技术角度讨论如何防御常见攻击。


  您可能遇到的首要威胁之一是，其他人可以获取您用于访问公司账户的密码，或者您用于进行网上银行交易的密码。然后我们将讨论无线窃听。这也很重要，因为您的流量是在空中传输的，所以任何人都可以监听、捕获该流量，或者更糟糕，在传输过程中对其进行修改。最后，黑客可以建立一个自建网络（ad
  hoc network），希望您连接它，从而攻击您的机器并窃取机密信息。


