    ## 适用于 Linux 的文件加密解决方案框架


    你可能在想，自己是否真的在读《NT Insider》。这真的是一篇关于 Linux 的文章吗？嗯，既是也不是。多年来，我们一直在开发和撰写关于我们的按访问透明文件加密解决方案框架（FESF）。该解决方案框架提供了构建你自定义的快速、可靠的文件加密产品所需的一切，无需进行内核模式开发。我们提供所有内核模式代码，包括一个隔离微过滤器（Isolation
    Minifilter），以及使用 Windows CNG 系统执行实际加密的全部支持代码。此外，我们还提供一个完整的用户模式参考实现（用 C++ 编写），你可以用它来启动你的项目。


    你根据自己设定的参数来定义策略，决定哪些文件在访问时被加密或解密：访问的应用程序、被访问文件的路径或名称、执行访问的用户或组，或者你能想得到的几乎任何其他因素。


    我们的客户曾使用 FESF 在不到六个月内推出自己完整成品级的商业产品。我们认为这相当了不起。


    ## 并非所有人都使用 Windows！


    是的……这也让我们感到惊讶。好吧，这并没有让 OSR 的每个人都感到惊讶，但确实让我们中的许多人感到惊讶。嗯，也许不是很多人，但……至少让 Peter 感到惊讶。不管怎样，这个星球上确实不是所有人都使用
    Windows。确实有人在自己的服务器和工作站上运行 Linux。而且毫不奇怪，这些人也需要按访问透明文件加密。


    虽然 Linux 上已经有一些优质的透明文件加密解决方案，但目前没有一个能达到 FESF 所提供的灵活性。例如，它们不允许你指定只加密某个目录中的 `*.odt`
    文件，或者只希望这些 `*.odt` 文件在使用 LibreOffice Writer 打开时（而不是比如说用 catdoc 访问时）被透明加密/解密。


