    # File System Minifilters... (Cont.)


    (CONTINUED FROM PAGE 8)


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_8_0.png)


    (rest of storage stack)


    Figure 1 -- Filter Manager with Three File System Minifilters


    these filters, MiniFilter A being above MiniFilter B, and MiniFilter B being above
    MiniFilter C is not random. Rather, this is determined by the Altitude assigned
    to each of the Minifilters. Altitudes are unique per Minifilter and are specified
    during Minifilter installation.


    Altitude is an important attribute for file system filters, because filtering
    at the right altitude can be critical to proper operation. For example, consider
    two Minifilters that might be installed over an arbitrary file system: An on-access
    transparent data encryption Minifilter and an antivirus Minifilter. In order for
    the antivirus Minifilter to do its work, it needs to operate on the decrypted
    contents of files. Therefore, the antivirus Minifilter would need to be higher
    in altitude (that is, above) the data encryption Minifilter.


    # Minifilter Callbacks


    When a Minifilter registers with Filter Manager, in addition to other things,
    it may elect to receive PreOperation and/or PostOperation callbacks for specific
    I/O operations. PreOperation callbacks are invoked before each I/O operation of
    the specified type is passed on to the file system being filtered (or, in fact,
    the next lowest altitude Minifilter). PostOperation Minifilter callbacks are invoked
    after the file system (and any lower Minifilters) have processed the particular
    type of I/O operation.


    Filter Manager''s support for callbacks is very well thought out. For example,
    when a given Minifilter receives a PreOperation callback, that filter can:


    +   - Complete the operation entirely. This results in lower altitude Minifilters
    (if any), and even the file system that''s being filtered, not seeing this I/O
    operation.

    +   - Complete the operation, pass it along to lower altitude Minifilters (if
    any) and the underlying file system, and elect to have a callback when the operation
    is complete (PostOperation callback).

    +   - Complete the operation, pass it along to lower altitude Minifilters (if
    any) and the underlying file system, but elect NOT to have a callback when the
    operation is complete (this is the PostOperation callback).

    +   - Return with the operation in progress. In this case, the Minifilter will
    inform the Filter Manager later as to the status of the operation, including whether
    any underlying entities and need to be called or if a PostOperation callback is
    required.


