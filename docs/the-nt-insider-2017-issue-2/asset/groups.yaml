  mdcn: "\n\n## 清理、关闭与取消...（续）\n\nEvtIoCanceledOnQueue 用于允许驱动程序停止因该请求而可能正在进行中的任何硬件操作，然后让驱动程序以\
    \ STATUS_CANCELLED 和零信息字段完成该请求。\n\n如果未提供 EvtIoCanceledOnQueue 事件处理回调，WDF 会简单地从队列中移除该请求，并以\
    \ STATUS_CANCELLED 和零信息字段完成它。正如我们前面所述，这样做非常有帮助的原因之一是，它可以自动处理掉那些已排队但尚未呈现给你的驱动程序的请求。\n\
    \n如果你的驱动程序持有一个或多个正在进行但不在队列中的请求，那么你的驱动程序需要为这些请求中的每一个都指定一个 EvtRequestCancel 事件处理回调。你的驱动程序通过调用\
    \ WdfRequestMarkCancelable 来实现这一点，并指定一个请求句柄以及指向由你的驱动程序实现的 EvtRequestCancel 事件处理回调的指针。EvtRequestCancel\
    \ 回调的原型如下：\n\n```\nVOID EvtRequestCancel(\n    _In_ WDFREQUEST Request)\n```\n\
    \n同样，你的驱动程序在此回调中的目标是停止与该请求相关的任何正在进行中的设备操作，并以 STATUS_CANCELLED 和零信息字段完成该请求。\n\n\
    ## 关于取消的补充：现实世界\n\n尽管我已尽力让你清楚了解在驱动程序中处理取消的总体目标和流程，但我希望你也明白，处理取消有时可能很困难。而且，有时会非常、非常困难。例如，要停止一个正在处理\
    \ I/O 操作的设备通常并不容易。更糟糕的是，当一个设备同时处理多个（数百或数千个）I/O 操作时，要让它停止处理某一个特定的 I/O 操作往往并不容易。\n\
    \n因此，如前所述，在某些情况下，对于正在进行的 I/O 请求，最好根本不要实现任何取消处理。请注意，只有当你确信所有正在进行的 I/O 请求都会及时完成时，这才是一个合理的策略。是的，当你收到取消操作的通知时，会有一个线程和/或进程正在等待退出。但如果完成一次\
