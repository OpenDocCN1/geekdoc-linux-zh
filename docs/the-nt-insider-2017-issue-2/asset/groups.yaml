    ## 清理（Cleanup）、关闭（Close）和取消（Cancel）...（续）


    （接第 24 页）


    假设你的驱动程序没有为顶层队列提供 EvtIoCanceledOnQueue 事件处理回调（这是一个安全的假设），WDF 将把在句柄上发出的任何待处理请求从队列中移除并终止。因此，绝大多数进行中的请求将由
    WDF 自动终止。


    如果你的驱动程序在应用程序调用 CloseHandle 时有一个正在进行的请求（而且只能有一个……该示例使用的是顺序分发），除非在收到 Cleanup 时该请求仍在队列中，否则该请求将继续在你的驱动程序中运行。要么你的驱动程序将其作为常规处理的一部分完成，要么请求会在发出线程退出时被取消。无论哪种方式，都没有问题。并且，当文件对象上的最后一个
    I/O 操作完成时，如果你指定了 EvtFileClose 事件处理回调，它将被调用。


    因此，这就是我们第一个示例中发生的情况。


    在我们的第二个示例中，应用程序发出了相同的 100 次读取请求，但并没有关闭句柄，而是退出或被终止了。


    在这种情况下，Windows 首先为指定线程执行 I/O 收尾处理。Windows 将对每个进行中的请求发出取消操作。因此，如前所述，假设你没有为顶层队列指定
    EvtIoCanceledOnQueue 事件处理回调，WDF 将把每个已取消的请求从队列中移除并终止。


    如果你的驱动程序持有一个进行中的请求，且该请求不能保证快速完成，你应当通过调用 WdfRequestMarkCancelable 来指定每个请求的 EvtRequestCancel
    事件处理回调。在该回调中，你的驱动程序将以 STATUS_CANCELLED 完成该请求。


    当然，如果你的驱动程序持有一个进行中的请求，且该请求绝对保证能快速完成，那么你的驱动程序无需再做任何事情。


    ## 已经了解 WDF？


    编写 WDF 驱动程序 II：高级实现技术


    我们的学员对本次研讨会的评价：


    > 课程专注于实际问题和应用，这很棒。我学到了适用于我们公司驱动程序的知识，这些知识仅靠 WDK 文档是无法拼凑出来的。


    > 这是了解高级 Windows 驱动程序开发的一个非常充实且宝贵的方式。对于任何设计解决方案的人来说，这都是必修课！


    下一次授课：


    新罕布什尔州阿默斯特（OSR）1月15日至18日


    因此，在取消处理结束时或此后不久，应用程序到你的驱动程序之间将不再有进行中的 I/O 请求。


    当所有挂起的请求都已完成时，Windows 将发出 Cleanup（如果已指定，WDF 将调用你的驱动程序的 EvtFileCleanup 事件处理回调），然后发出
    Close（如果已指定，WDF 将调用你的驱动程序的 EvtFileClose 事件处理回调）。除非你的驱动程序需要清理某些特定于进程的状态，否则它不会指定
    Cleanup 回调。除非你的驱动程序需要清理特定于句柄的状态，否则它不会提供 Close 回调。


    ## 现在你知道了


    现在你明白了 Windows 中 Cleanup、Close 和 Cancel 的含义。你知道了 WDF 如何帮助你处理这些操作。而且，至少从一般意义上，你知道了你的驱动程序需要做些什么来处理每一个操作。


    希望你再也不会被这三个听起来相似的操作搞混了！


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_25_0.png)


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_25_1.png)


    ## 面向 Linux 的 FESF...（续）


    （接第 3 页）


    ### 与 Windows 兼容是额外优势


    面向 Linux 的 FESF 本身就很有用，可以作为纯 Linux 产品的基础。然而，它还具有与 Windows 兼容的优势。


    由于面向 Linux 的 FESF 使用的磁盘结构与面向 Windows 的 FESF 使用的磁盘结构兼容，因此加密文件在系统之间完全兼容。现在，你可以使用
    Microsoft Word 创建加密文档，并在访问时根据你定义的任何策略对其进行透明解密。使用 LibreOffice Writer 进行修改，保存文档（当然，是透明加密的），然后发送回你的
    Windows 同事。然后，他们可以用 Word 打开它，Word 会自动且透明地解密（假设你的策略允许这样做）。


    ### 早期采用者计划现已开放


    我们已经开始了面向 Linux 的 FESF 的工作。你可以加入我们的早期采用者计划，影响产品首个版本的方向，提前获得预发布版本的访问权，并在开发过程中通过提供重要反馈来帮助我们。有关面向
    Linux 的 FESF 的更多信息，请参见我们的网页。有关面向 Linux 的 FESF 早期采用者计划的更多信息，请联系 sales@osr.com。


    ## Windows 或 Linux 文件加密？让我们来帮忙！


    OSR 的文件加密解决方案框架（FESF）


    我们知道，实现逐文件加密解决方案具有挑战性——而我们已经从事这项工作超过 20 年！


    当然，让开发人员及其经理相信他们所面临的困难也是一项挑战。如果你是 Windows 新手，你可能会查看 WDK 示例并认为“这看起来很容易！”如果你面向 Linux，你可能会想：“嘿，我总可以从一个开源包开始。”


    然后你可能会花上几个月——好几个月——才能让某些东西正常工作。我们几乎每天都会遇到这种情况。开发人员离让他们的解决方案正常工作只差“一个 bug”。但“一个
    bug”变成了“又一个 bug”，这种情况会持续……好几个月。


    请不要让这种情况发生在你身上。OSR 可以帮助你节省大量时间和金钱，并帮助你打造成功的 Windows 文件加密解决方案。OSR 的最新工具包——文件加密解决方案框架（FESF）——建立在经过时间考验的基础设施之上，但将所有文件加密解决方案的核心开发转移到用户模式。你不需要成为
    Windows 文件系统或内核编程的专家，你更好的做法是花时间定义解决方案的“策略”（要加密什么、何时加密、使用什么算法和密钥管理），而不是纠结于过滤文件系统时那些微妙而痛苦的细节。


    想免费试用 FESF 的全功能评估版吗？只需联系 OSR 销售团队，他们就会帮你开始。


    联系方式：sales@osr.com


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_26_0.png)


