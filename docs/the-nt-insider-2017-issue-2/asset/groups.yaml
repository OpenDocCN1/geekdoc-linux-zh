    # Universal Drivers... (Cont.)


    are supported. Regardless of what you think about this, Microsoft says they’re
    going to sell these systems. And, if I had to guess, there’ll be other systems
    in the future that will have the same restrictions.


    Suppose you currently have a Device Manager property sheet, or Control Panel Applet,
    that’s used to manage your device. That’s not going to work very well on a system
    that doesn’t support the Win32 API, right? So, the final part of the Universal
    Driver picture is Hardware Support Apps that are written as UWP apps. Of course,
    that’s not nearly as simple as it might seem at first blush. UWP has some pretty
    significant limitations: No IOCTLs, no WMI, no RPC. About the only cool technology
    that you can use in a UWP app is ETW.


    In place of device-specific IOCTLs, UWP offers something called Custom Capabilities.
    These are specific functions your driver authorizes to specific applications.
    And, in this way, everything is supposed to be kept safe.


    I’m not convinced. I’m not a fan of the whole UWP programming model in general
    (I’m a device guy… I don’t like being told what I can and cannot do). But I admit
    it: I really haven’t spent much time investigating the whole issue of Custom Capabilities
    for UWP apps. Maybe it’s not as bad as I think. I’ll look into it, and write an
    article that describes what I find in a future issue of The NT Insider. In the
    meantime, you can read (and weep) more about Custom Capabilities for Hardware
    Support Apps in MSDN.


    Note that there’s an interesting side-effect of making a support app a UWP app.
    That app can now be pulled-down during the install (and also during future updates)
    from the Windows Store. You can also, optionally, pre-populate the app onto a
    specific install image using DISM. But in either case, the app will no longer
    be part of what we think of today as the traditional installer package. This does
    sound to me like it might make servicing easier.


    ## Gimmie a D! Gimmie a C! Gimmie a H! Gimmie a U! What’s That Spell?


    It spells “DCHU.” No, you can’t pronounce it. It stands for:


    - Declarative – You use a Declarative INF file

    - Componentized – You separate your INF into a Base INF and zero or more Extension
    INFs

    - Hardware Support Apps – Written at a UWP app, of course

    - Universal – Your driver (and INF) is restricted to the Universal feature set


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_14_0.png)


    Together, Microsoft describes these as the Universal Driver Pillars. See the lovely
    artwork I stole from somebody’s WinHEC deck in Figure 3.


    For your driver to be truly able to run on “any Windows platform” you need to
    embrace all four of the DCHU design principles.


    ## Universal DDIs – Only Part of the Story


    Now, hopefully, you see that writing a driver that’s restricted to the Universal
    DDIs is straight forward, but it’s also only part of the story. If you truly want
    your driver to be installable on any Windows system (now and in the future) you’re
    going to have to become DCHU compliant. Of course, how important any of this is
    to you will depend greatly on the type of drivers you write and the types of hardware
    you support.


    Be aware that there are rumblings that DCHU compliance will become required for
    certain classes of drivers in the not too distant future. While that remains to
    be seen, at least the direction that Microsoft wants us to move is clear.


    # File System Minifilters... (Cont.)


    Within its PreOperation and/or PostOperation callbacks, a Minifilter can perform
    almost any operation, including examining or modifying the data involved in the
    operation. Thus, the trick becomes understanding the specific meaning of those
    operations.


    ## Win32 API vs Native Windows API


    The Filter Manager framework for writing Minifilters is so powerful and well thought-out,
    that it’s very easy for new Minifilter developers to be tricked into thinking
    that file system filtering is easy. The thing is: It can be easy, but it can also
    be get surprisingly confusing very quickly.


    The inherent problem is that regardless of how powerful or pleasant the Filter
    Manager model is, the world of Windows file systems is inherently a complicated
    one. Some of this complexity comes from the fact that the Win32 API can sometimes
    be very different from the native Windows API that the I/O subsystem actually
    uses. A simple example that we often encounter here at OSR is the Win32 API CopyFile.
    Developers are often surprised that there’s no native analog to this function.
    Rather, internally, CopyFile opens the source file, opens the target file, and
    if both of those operations are successful, issues a series of reads from the
    source file and writes to the target file until the file is copied. The source
    file and the target file are then closed.


    A slightly more interesting example is the Win32 function DeleteFile. If you’re
    not a file system dev, you’re probably thinking “How complicated can delete be?
    You just… delete the file, right?” Well, not in Windows, no. The native Windows
    API doesn’t actually have a specific delete file operation. Rather, the intention
    to delete a file is indicated by issuing a Set Information operation (ZwSetInformationFile)
    to set the file’s Disposition (FILE_DISPOSITION_INFORMATION). This allows the
    caller to specify whether he wants the file to be deleted when its closed. However,
    it’s important to note that the file is not actually deleted until the last handle
    to the file has been closed. This means that an application can open a file and
    call the Win32 DeleteFile API, but this doesn’t actually delete the file. It just
    set the file’s Disposition of the file to be deleted on close. Even when the app
    subsequently closes the file, this still doesn’t necessarily mean that the file
    will actually be deleted. Consider what could happen if another application has
    the file open when our example app opens it. That application can also set the
    file’s Disposition at any time. If after our example app has set the file’s Disposition
    to be delete on close, the other app sets the file’s Disposition so that it’s
    no longer marked for delete on close, the file will not be deleted. And yes… it
    happens.


    ## Virtual Memory System Integration


    Another source of complexity for file system Minifilters stems from the close
    working relationship between file systems, the Windows Cache Manager, and the
    Windows Memory Manager. We all know that when we call ReadFile, data from the
    specified data buffer is read from the file indicated by the file handle. Most
    of us probably also know, at least in a general way, that there’s typically some
    caching involved. That is, every call we make to ReadFile doesn’t always necessarily
    result in that data being read directly from the media.


    Interestingly, except when a file is explicitly opened with no caching, file systems
    typically do very little to process an application’s call to ReadFile, beyond
    calling the Cache Manager to deal with it. At the file system’s request, the Cache
    Manager copies the data from the cache area associated with that file’s open instance
    into the application’s data buffer. This is illustrated in Figure 2.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_15_0.png)


    In Figure 2, the file system has called the Windows Cache Manager to process an
    application’s ReadFile request. The file system identifies the open instance of
    the file being accessed using the file handle provided by the application in its
    ReadFile call. The file handle "hFile1" is a handle to the indicated File Object
    which the Cache Manager uses to locate the sections of cached data that are part
    of the file system’s cache.


    Figure 2 -- File System Uses Cache Manager to Process a Read Operation

