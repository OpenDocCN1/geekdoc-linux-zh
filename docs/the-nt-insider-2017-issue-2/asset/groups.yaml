  - '[PAGE 9]


    # A Hard Challenge Solved


    # OSR''s Isolation Minifilter Solution Framework


    Every week, we encounter a problem like this: An unsuspecting dev looks at the
    File System Minifilter model, sees that it''s pretty cool, and decides to undertake
    what looks like a straightforward project. The project? A Minifilter that does
    one of the following:


    +   - Virtualizes the location of a file (allowing the file to be pulled down,
    bit by bit, from back-end cloud storage or from slow near-line storage).

    +   - Implements per-file on-access transparent encryption and decryption

    +   - Implements "hot backup" of files, and allows seamless access to both new
    and old versions

    +   - Implements file compression

    +   - Provides data deduplication processing (store the file data once, have it
    be available via multiple files)


    The dev gets coding underway, but after a few weeks runs into unexpected issues.
    Why? Because he or she has left the realm of conventional Standard Minifilters
    and accidentally entered the world of Windows file system Isolation Minifilters.
    We describe the technical differences between Standard Minifilter and Isolation
    Minifilters in another article in this issue of The NT Insider.


    # Should This Minifilter Be an Isolation Minifilter?


    Unless you have experience in Windows file systems or file system filters, it''s
    sometimes hard to know in advance that your design is going to (or should) enter
    into Isolation Minifilter territory. Heck, here at OSR we''ve started Minifilter
    projects, only to discover after several weeks of work that "we probably should
    have used an Isolation Minifilter for this." It happens.


    The best way to determine if you''re likely to need an Isolation Minifilter, before
    you start your code, is to ask yourself, "Do I need to maintain a view of the
    data that is different in content, shape, or location from that which is stored
    by the underlying file system." If the answer to this question is yes, you should
    at least consider implementing an Isolation Minifilter.


    # Isolation Minifilter: Hard


    Determining whether you need to write a Standard Minifilter or an Isolation Minifilter
    is important, because undertaking the development of an Isolation Minifilter is
    far more difficult than a Standard Minifilter. Because of their close coupling
    with the Windows VM subsystems (Memory Manager and Cache Manager) developing an
    Isolation Minifilter is at least as complicated as developing a Windows file system.
    In fact, in discussing just this topic, one of the OSR devs recently wrote:


    > I maintain that an Isolation Minifilter is actually much harder than a filesystem
    to write because in many cases the lower edge [of the Minifilter] is a filesystem
    (which is complicated and involves locking), whereas for a filesystem it is a
    series of blocks (idempotent, no locking, etc.,...)


    (CONTINUED ON PAGE 11)


    # OSR Custom Software Development


    # I Dunno...These Other Guys are Cheaper...Why Don''t We Use Them?


    Why? We''ll tell you why. Because you can''t afford to hire an inexperienced consultant
    or contract programming house, that''s why. The money you think you''ll save in
    hiring inexpensive help-by-the-hour will disappear once you realize this trial
    and error method of development has turned your time and materials project into
    a lengthy "mopping up" exercise...long after your "inexpensive" programming team
    is gone.


    You deserve (and should demand) definitive expertise. You shouldn''t pay for inexperienced
    devs to attempt to develop your solution. What you need are fixed-price solutions
    with guaranteed results. Contact the OSR Sales team at sales@osr.com to discuss
    your next project.'
