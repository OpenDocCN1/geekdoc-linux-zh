    \n还有另一个细节你需要知道：除非你是在 EvtRequestCancel 事件处理回调中这样做，否则你绝不可对已标记为可取消（Cancelable）的请求调用\
    \ WdfRequestComplete（或其任何变体）。这意味着，如果你将一个取消例程与一个请求关联，并且你在常规处理过程中完成该请求（也就是说，你并非在取消处理过程中完成它），则必须先调用\
    \ WdfRequestUnmarkCancelable。\n\n遗憾的是，取消处理仍然是 I/O 操作中最复杂的部分之一。虽然 WDF 通过取消位于队列中且尚未呈现给你的驱动程序的请求提供了一些帮助，但对于那些已经呈现给你的驱动程序、并在取消时正在进行的请求，它却帮不上什么忙。\n\
    \n## 回到那些示例\n\n为了总结我们所讨论的内容，让我们再次回到本文开头使用的示例。在我们的第一个示例中，应用程序向你的驱动程序发送了 100 个异步读取请求，然后调用\
    \ CloseHandle，而此时其中一些请求仍在进行中。你的驱动程序使用单个具有顺序调度（Sequential Dispatching）的队列来处理这些请求。\n\
    \n现在，你知道会发生什么。\n\n一旦应用程序调用 CloseHandle，Windows 会立即发出一个清理（Cleanup）操作。如果你的驱动程序需要处理与执行\
    \ CloseHandle 操作相关的任何进程特定状态，它就会提供一个 EvtFileCleanup 事件处理回调。在此回调中，它会销毁该进程特定的状态。无论你的驱动程序是否提供\
    \ EvtFileCleanup 事件处理回调，WDF 都会取消你的驱动程序队列中所有挂起的请求。\n\n"
