    there can’t be any installer MSI to run and there can’t be a co-installer that
    needs to be executed. You need what’s referred to as a Universal INF file that’s
    restricted to “Declarative Driver Installation.”


    Declarative Install refers to the ability to install drivers in an entirely offline
    environment, with no GUI interaction. It allows only a limited number of specific,
    definitive, and unambiguous operations to install the driver. Microsoft claims
    that not only does this make it possible to install drivers offline, but also
    increases the predictability and supportability of driver installations. If that’s
    true, that’d be great, because, in my experience, driver installs either just
    work or they’re a complete pain in the ass. They never seem to be anything in
    between. Refer to the MSDN docs on Universal INF files for more information.


    All is not puppies and rainbows, however. While I’m all for making driver installation
    more predictable, and allowing drivers to be installed offline, there are one
    or two things about Universal INF files that I find difficult to accept. The most
    significant of these is that the ClassInstall32 section is not allowed in Universal
    INFs. This means that an IHV/OEM cannot install their driver into a unique class
    that fits their environment. Not being able to use a custom install class also
    restricts you from defining a default protection on the Device Objects in your
    devnode. To me, this is not a good thing. I don’t want my image scanner or cochlear
    implant or missile launcher to be lumped into some other random device class.
    I want my unique devices to show up in their own unique classes. I’m hoping Microsoft
    re-thinks this restriction, because to me it’s just not acceptable.


    Oh, you might be thinking, “If I can’t use a co-installer when I install my driver,
    how will I be able to tailor the installation to a particular device/platform/environment/system?”
    Well, there’s an answer for that too. It’s called Componentized Installation.


    # Componentized, Too


    Componentized Installation allows you to divide your driver INF file into multiple
    pieces. You create a Base INF, that supports the basic functioning of your driver.
    Then you create one or more Extension INFs that can tailor or configure your driver
    for a particular system make, model, or version.


    The key to this is that there’s a single INF for all systems that will always
    get the basic functionality of the device working. The Extension INF(s) can then
    do any specialized configuration that your driver might require for a particular
    system or platform. Say, you have special branding that needs to be applied for
    a given OEM. Or, you want to enable certain value-added functions on particular
    models of devices that you support. You can accomplish all this from your Extension
    INF. You write an Extension INF for each unique system type or flavor that you
    want to support. During the install process, Windows invokes the right INF to
    do your tailoring. What’s nice about this is that the Base INF and the Extension
    INF can be updated (and distributed via WU) separately. So you, dear driver writer,
    can get your Base INF working, and your OEM customer(s) can at some later point
    work through the process of getting their Extension INF set up the way they want.


    Componentized Installation and Extension INFs are explained in more detail in
    the MSDN docs for Extension INFs.


