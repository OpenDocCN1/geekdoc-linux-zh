    # File System Minifilters... (Cont.)


    (CONTINUED FROM PAGE 17)


    usually a mistake to attempt to filter I/O operations that your filter doesn’t
    specifically care about. The HLK tests for file system Minifilters will be very
    helpful to you in assessing your success in preserving the behavior of the file
    systems you filter. Be sure you run them!


    Thus, if you need to write a Standard Minifilter – that is, one that monitors
    file system operations – the challenges you face will be reasonable.


    # Exponentially Harder: Isolation Minifilters


    A much less common type of file system Minifilter is the Isolation Minifilter.
    Isolation filters separate (or “isolate”) the view of a file’s data from the actual
    underlying data stored by the file system. Writing this type of Minifilter is
    usually as complex as writing a standard Windows file system, because it involves
    direct and close interaction between your Minifilter, the Windows Cache Manager,
    and the Windows Memory Manager. In fact, some experienced devs consider Isolation
    Minifilter even more difficult than file system development, because when you’re
    writing an Isolation Minifilter you effectively have to “fit” the implementation
    of a Windows file system into the API provided by Filter Manager. Thus, in addition
    to the challenges faced by the developers of Standard Minifilters, developers
    of Isolation Minifilters deal with numerous significantly more complex issues.


    To illustrate what we mean by “separating the view of a file’s data form the actual
    underlying data”, let’s consider an Isolation Minifilter that implements on-access
    transparent encryption/decryption. An application opens, and calls ReadFile for,
    a file that is stored on disk in encrypted form. The encryption/decryption Minifilter’s
    job in this case is to transparently decrypt the data that is presented to the
    application. The general scheme for supporting this type of activity is shown
    in Figure 3.


    Figure 3 shows two File Objects, each associated with the same file. The upper
    File Object (in green) is the open instance associated with the application. This
    File Object represents the application’s view of file. Note that the cache section
    referenced by the File Object contains decrypted data. The data was placed into
    cache by the Isolation Filter, working in cooperation with the Cache Manager.


    The lower File Object (in blue) is created by the Isolation Minifilter, and represents
    the Minifilter’s (and the underlying file system’s) view of the file. Note that
    the data in the cache section for this File Object is encrypted. The Isolation
    Minifilter uses the lower File Object to interact with the underlying file system.


    Thus, when the user application calls ReadFile, the Isolation Minifilter will
    receive that request (as part of its read PreOperation processing, discussed previously)
    and interact with the Cache Manager to fill the cache with data. In processing
    the subsequent paging read operation (sent by the Memory Manager in fulfillment
    of the Cache Manager’s attempt to fetch data for the cache) the Isolation Minifilter
    issues a ReadFile operation referencing the lower (blue) File Object. The underlying
    file system, working with the Cache Manager, fulfills this request and puts data
    into the indicated cache section.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_17_0.png)


    Things get even more complex when you consider that most transparent data encryption
    systems utilize some sort of metadata header (to hold keys or access information).
    This header is often stored within the file itself. Thus, the file offset used
    for read operations by the application can be different from the file offset that
    the Isolation Minifilter needs to use when accessing the file as stored on disk.


    But there’s usually even more complexity than we’ve discussed so far. Let’s say
    the encryption/decryption Minifilter determines


    (CONTINUED ON PAGE 19)


    Figure 3 – Isolation Minifilter'
