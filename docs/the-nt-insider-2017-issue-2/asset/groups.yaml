    ### 关于文件对象


    Windows 中的文件对象 – 命名为 FILE_OBJECT 的 WDM 数据结构以及 WDF 对象 WDF FILEOBJECT – 代表文件或设备的单个、特定、打开的实例。例如，当应用程序成功调用
