    我们刚刚描述的两个问题，即在 I/O 进行中关闭句柄以及应用程序在 I/O 进行中尝试退出，是 Cleanup、Close 和 Cancel 设计来管理的两个主要问题。让我们先从每个操作的定义开始。在下一节中，我们将扩展这些定义并描述有关驱动程序如何处理这些操作的更多具体细节。


