    ## Cleanup、Close 和 Cancel...


    我们最后的定义是 Cancel。当一个线程在存在未完成的 I/O 时退出，或应用程序显式调用 Win32 函数 CancelIo 或 CancelIoEx
    时，未完成的 I/O 请求将被取消。这会导致 WDF 为每个将被取消的请求调用驱动程序的其中一个与 Cancel 相关的事件处理回调，前提是已指定了该回调。


    与 Cleanup 和 Close 不同，后者的操作是基于特定的文件对象进行的，Cancel 操作在 Windows 中是基于单个、特定的请求进行管理的。WDF
    的一大优点是它旨在自动协助你的驱动程序进行 Cancel 处理。它主要通过以下方式实现：当 Windows 取消某个请求时，WDF 会在你的驱动程序的所有
    WDF 队列中搜索该请求。如果它在 WDF 队列上找到了正在被取消的请求，WDF 将从队列中移除该请求，并且默认情况下使用 STATUS_CANCELED
    完成该请求，信息字段为零。这甚至适用于那些在队列上等待首次呈现给你的驱动程序的请求，也就是说你的驱动程序尚未看到的请求。


    考虑一下这如何帮助我们在第二个示例中的驱动程序处理，即应用程序在存在多个进行中的请求时退出。在这种情况下，随着应用程序退出，Windows 将为每个在应用程序尝试退出时仍在进行中的
    I/O 请求发出 Cancel 操作。当 WDF 收到此 Cancel 操作时，它会在你的驱动程序的 WDF 队列中搜索正在被取消的请求，如果找到该请求，它将从队列中移除并完成它（使用
    STATUS_CANCELED）。如果被取消的请求正在你的驱动程序的队列上等待，并且尚未呈现给你的驱动程序进行处理，则该请求将被从队列中移除并完成，而你的驱动程序甚至无需处理它。再一次，WDF
    通过其“合理默认值”的原则使驱动程序编写变得更容易。


    当然，你可能不希望在 Cancel 处理期间，WDF 自动从队列中移除你在队列上持有的请求并完成它们。例如，当你的驱动程序在等待设备完成其工作时，使用手动分派将请求保留在队列上时，可能会出现这种情况。在这种情况下，你的驱动程序可以通过为该队列注册一个
    EvtIoCanceledOnQueue 事件处理回调来选择自行处理该特定队列的 Cancel 处理。如果你的驱动程序为某个队列提供了 EvtIoCanceledOnQueue
    事件处理回调，每当该队列上的请求被取消时，WDF 将从队列中移除该请求并调用你的驱动程序的 EvtIoCanceledOnQueue 事件处理回调，并传入正在被取消的请求的句柄。


    ## OSR 的企业内部培训


    省钱、免去差旅烦恼；获得定制化专家指导


    我们可以：


    - 为你的团队准备并举办一次一次性、私人、现场研讨会，以解决特定领域的不足或为即将到来的项目做准备。

    - 为新入职的一批人或现有团队设计并提供一系列培训，并制定量身定制的路线图。

    - 与你的内部培训组织/人力资源部门合作，为你的部门或全公司范围内的工程部门提供每月或每季度的研讨会。


    如果你的驱动程序持有进行中的请求，但这些请求不在队列上，它可以为特定请求注册一个 EvtRequestCancel 事件处理回调。例如，如果你的驱动程序在设备上启动了一个请求，并且你正在等待设备完成其处理，你的驱动程序可能只是在设备上下文中的某个位置保存对该挂起请求的句柄。事实上，这非常常见。如果你想在该请求挂起、等待设备时能够处理
    Cancel 事件，你可以为该请求可选地注册一个 EvtRequestCancel 事件处理回调。


    总结：每当应用程序在 I/O 进行中开始其退出处理，或应用程序调用 CancelIo 或 CancelIoEx 时，你的驱动程序可能会在 EvtRequestCancel
    或 EvtIoCanceledOnQueue 事件处理回调中被调用。


    Cleanup、Close 和 Cancel 处理的简要总结以表格形式显示在图 2 中（下一页）。


    鉴于上述定义，让我们来研究一下你的驱动程序如何能最好地利用 Cleanup、Close 和 Cancel 事件。


