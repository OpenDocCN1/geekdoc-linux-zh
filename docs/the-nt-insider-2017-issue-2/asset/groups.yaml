    Hong Kong. **But it’s no place for Microsoft to exclusively present content that’s
    important to driver developers.** If WinHEC is “where technical experts from around
    the world, and Microsoft, come together to make Windows great” then WinHEC needs
    to travel. If the idea is to “help educate [and] facilitate the exchange of ideas
