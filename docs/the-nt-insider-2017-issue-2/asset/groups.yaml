    # Cleanup, Close and Cancel... (Cont.)


    (CONTINUED FROM PAGE 21)


    | Event | Resulting Operation | Callback Constraints |

    |---|---|---|

    | Last handle to a File Object closed | CLEANUP: EvtFileCleanup invoked; WDF issues
    a Cancel operation for any Request that is currently on any WDF Queue. | IRQL
    PASSIVE_LEVEL, in the context of the thread that called CloseHandle |

    | Last reference to a File Object removed | CLOSE: EvtFileClose invoked | IRQL
    PASSIVE_LEVEL, in an arbitrary process/thread context |

    | Application begins exit process, Application calls CancelIo or CancelIoEx |
    CANCEL: Request-dependent cancel function (either EvtRequestCancel or EvtIoCanceledOnQueue)
    | IRQL <= DISPATCH_LEVEL, in an arbitrary process/thread context |


    Figure 2– Summary of Cleanup, Close, and Cancel


    # When Should You Handle Cleanup?


    When WDF gets a Cleanup notification for a particular File Object, it calls your
    driver’s EvtFileCleanup Event Processing Callback if one has been specified. EvtFileCleanup
    has the following prototype:


    ```

    VOID EvtFileCleanup(

    _In_ WDFFILEOBJECT FileObject)

    ```


    Should your WDF driver implement Cleanup? If so, what should you do as part of
    Cleanup processing?


    The answer is simple for most drivers: In almost all cases you do not need to
    handle Cleanup – You therefore should not provide an EvtFileCleanup Event Processing
    Callback in your driver.


    Cleanup operations in Windows are designed for basic two purposes:


    +   1) As a quick notification to the driver that the calling application does
    not intend to issue any further I/O requests on the associated handle (remember,
    Cleanup happens on a per File Object basis);

    +   2) To provide the driver a "last chance" to perform any operations that need
    to be done in the context of the requesting application (as the application is
    indicating its intention to stop interacting with the driver via this specific
    open instance).


    As part of item 1, above, Cleanup can be used as a wholesale method of discarding
    a bunch of Requests that probably no longer matter to the application that issued
    them. WDF facilitates this by performing a Cancel operation on any Requests that
    were issued on the File Handle being closed and that are on a WDF Queue when the
    Cleanup is processed. The primary result of this is that any Requests from the
    Cleaned-up File Object that were on a Queue awaiting presentation to your driver
    will never reach your driver. WDF will remove them from the Queue and Cancel them,
    without your driver having to do anything.


    Item number 2, above, is slightly more interesting. Because EvtFileCleanup is
    called in the context of the process/thread that called CloseHandle, this Callback
    gives your driver the opportunity to tear down any context that it was maintaining
    on a per-process basis. For example, if your driver mapped some memory into the
    application’s virtual address space, the EvtFileCleanup Event Processing Callback
    is the perfect place to undo that mapping. This type of operation isn’t common.
    But it is one of the key uses of Cleanup in WDF. And, yes, before the expert readers
    raise an uproar, let me add that there’s more to mapping and unmapping memory
    into an application’s virtual address space than simply unmapping in EvtFileCleanup.
    I’m not attempting to address that here.


    It’s important to note that there’s also a nasty little detail inherent in Cleanup
    handling: Since handles are per-process entities, one thread in a process can
    be sending I/O requests on a handle (repeatedly calling ReadFile, for example),
    while another thread simultaneously calls CloseHandle on that same handle. If
    you think about this, you’ll realize that this means that it’s possible for


    (CONTINUED ON PAGE 23)'
  - '[PAGE 22]


    # Cleanup, Close and Cancel... (Cont.)


    _(CONTINUED FROM PAGE 22)_


    your driver to receive one or more new Requests on a given handle, even after
    your driver has been called at its `EvtFileCleanup` Event Processing Callback
    for that handle. This makes for a nasty race condition, and contributes to making
    the wrong place to definitively purge Requests from your driver to avoid, for
    example, an application hanging on exit.


    Thus, in general, WDF drivers do not need to – and in fact should not – directly
    handle Cleanup. As I always say “If you don’t write any code, you don’t have any
    bugs.” So, when you don’t need to implement a function, that’s usually a good
    thing.


    # When Should You Implement Close Handling?


    When WDF gets a Close notification for a particular File Object, it calls your
    driver’s `EvtFileClose` Event Processing Callback if one has been specified. `EvtFileClose`
    has the following prototype:


    ```

    VOID EvtFileClose(

    _In_ WDFFILEOBJECT FileObject)

    ```


    Should your WDF driver implement Close? If so, what should you do as part of Close
    processing?


    As with Cleanup, for most drivers the answer is simple: For most drivers, there’s
    no need to handle Close, and you should therefore not provide an `EvtFileClose`
    Event Processing Callback in your driver.


    Close is your last notification that a File Object is going away. When `EvtFileClose`
    is called, there are no more Requests pending on the File Object. As soon as you
    return from your `EvtFileClose` routine (if you provide one) the associated File
    Object will be destroyed.


    So, what’s the purpose of Close? The primary purpose of Close is to allow your
    driver a “last chance” to tear down any handle-related context it might have been
    maintaining. For example, suppose that during Open processing (called at `CreateFile`
    time) your driver allocates some data structures that it uses for tracking various
    state and information.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_22_0.png)


    your driver allocates some data structures that it uses for tracking various state
    and information. Or maybe your driver tracks the number of open instances of its
    devices. In both these cases, `EvtFileClose` provides you the perfect opportunity
    to reverse those operations. To return the handle-related context, for example.
    Or to decrement the count of open instances.


    So, in general, WDF drivers do not need to – and in fact should not – directly
    handle Close. The only time you need to do so is when you have per-handle context
    that you need to tear-down. In that case, `EvtFileClose` is the right place to
    handle this tear-down.


    # How Should You Deal with Cancel?


    Remember that, unlike Cleanup and Close, Cancel notification is implemented on
    a per-Request basis. As we said earlier, when a thread exits with I/O in progress,
    or an application explicitly requests one or more I/O operations to be terminated
    before they are completed, Windows issues a Cancel for specific Requests, one
    at a time.


    The purpose of Cancel is to tell a driver that it should stop processing a given
    I/O operation as soon as it is convenient for the driver to do so, because the
    results of that I/O operation are no longer relevant. As we described earlier,
    the most common use of Cancel is as part of thread and process exit. When a thread
    exits, Windows will Cancel any uncompleted I/O requests from that thread. This
    is referred to as I/O rundown processing. I/O'
