  mdcn: '

    # 文件系统微过滤器...（续）


    无论如何，让我们先达成共识：隔离微过滤器很难从头编写。根据我们自己开发隔离微过滤器的经验，我们估计，从头开始，一位非常有经验的 Windows 文件系统开发者至少需要
    3 个月才能让一个隔离微过滤器原型跑起来。对于经验较少的开发者，也就是“仅”有编写 Windows 内核模式驱动程序经验的开发者，我们认为至少需要 6-9
    个月才能获得可工作的原型。而且，无论哪种情况，这也仅仅是能拿出一个可演示的东西。要做出一个能在现实世界中真正工作的解决方案，仍然需要好几个月的工作。


    ## 隔离微过滤器解决方案框架：轻松得多


    幸运的是，有一种解决方案能让你快速启动隔离微过滤器的开发过程，并在几周内获得可工作的原型，而不是耗时数月。这个解决方案就是 OSR 的隔离微过滤器解决方案框架（IMSF）。


    在我们开发针对按访问透明文件加密的综合解决方案框架（FESF，如果你感兴趣，可以在这里阅读）时，我们显然必须实现一个隔离微过滤器。我们并没有将这个隔离微过滤器与
    FESF 紧密耦合，而是将其架构并实现为一组可分离的模块。我们将这些模块连同文档和示例代码作为 IMSF 的一部分提供。


    我们的 IMSF 套件包含一个完整且可完全自定义的隔离微过滤器。这个隔离微过滤器与目前在全球主要产品中发布的 FESF 核心代码完全相同。这段代码每天都在真实环境中被使用和测试。它行之有效，非常可靠。


    除了隔离微过滤器本身，IMSF 还包含全面的接口文档和一个工作示例，演示了如何以 IMSF 为基础构建真实产品。而且，是的：你会获得完整的源代码。所有一切。


    需要说明的是：你仍然需要了解 Windows 内核模式编程和文件系统概念，才能充分利用我们的 IMSF 套件。但艰巨的工作已经由 IMSF 为你完成了。你不需要成为缓存管理器方面的专家。你也不必去琢磨“我该怎么做？”IMSF
    提供了一个坚实、积极开发、随着 Windows 每个新版本/更新而不断维护的基础，并且已被证明可在真实、已发布的产品中有效运行。


    ## 咨询专家


    如果你正在从事某个项目，并且想讨论隔离微过滤器方法是否是正确的选择，请联系我们。让我们的工程团队与你的工程团队通过 Skype 讨论你的可选方案，这是不收费的。如果我们认为你不需要隔离微过滤器，或者
    IMSF 不适合你，我们会直言相告。另一方面，也许我们的某个解决方案框架能为你节省时间和麻烦。无论哪种方式，如果仅用一个小时的电话交谈就能让你走上正确的方向，我们认为这段时间花得很值。


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_10_0.png)


    关注我们！


    ## 一个 Windows，处处通用；一个驱动程序，处处通用


    ### 通用驱动程序详解


    如果你从 Windows 8 发布以来一直在关注驱动程序领域，你可能已经注意到 **通用驱动程序** 这个术语。你或许不清楚它的含义、为什么你应该关注，以及随着
    Windows 平台及其支持的系统不断演进，通用驱动程序的概念是如何发展的。


    ## 通往 OneCore 之路


    早在 Windows 8 之前，微软就开始了在操作系统级别和支持 API 级别对 Windows 进行组件化的任务。这是一段漫长而艰难的旅程。我就不赘述细节了，但一个真正的组件化
    Windows 版本最终作为 Win10 1607（RS1，周年更新）的一部分出现了。这个组件化操作系统被称为 OneCore，而组件化的应用程序支持被称为
    OneCoreUAP（通用应用程序平台）。


    驱动程序编写者之所以对此感兴趣，是因为现在首次有了一个核心 Windows 组件，可以运行在各种平台上：台式机、服务器、平板电脑、物联网设备、Surface
    Hub、Xbox 甚至手机。如果你还能，呃，*找到*一台 Windows Phone 的话。但那是另一回事了。


    得益于 Windows 强大的架构基础，开发者可以编写一个驱动程序，从而可能支持大量不同的硬件。无需重写，无需条件编译代码。只需重新设定目标平台、重新构建，就大功告成了。


    听起来不错吧？让我们来谈谈如何实现这一点。


    ## 通用驱动程序 DDI


    通用驱动程序可以是 KMDF、WDM 或 UMDF 2 驱动程序。使用这些模型之一编写通用驱动程序的主要约束是，你必须将驱动程序调用的函数限制为 OneCore（对于内核模式驱动程序）或
    OneCoreUAP（对于用户模式驱动程序）所包含的函数。这些设备驱动程序接口（DDI）和 API 在 MSDN 文档中被标识为受“通用”目标平台支持。有关示例，请参阅
    *图 1*。


    ## 要求


    |  |  |

    |---|---|

    | **目标平台** | 通用 |

    | **版本** | 自 Windows 2000 起可用。 |

    | **头文件** | Wdm.h（包括 Wdm.h、Ntddk.h 或 Ntifs.h） |

    | **库** | NtosKrnl.lib |

    | **DLL** | NtosKrnl.exe |

    | **IRQL** | PASSIVE_LEVEL |


    对于内核模式驱动程序，很容易做到只调用通用 DDI。事实上，你很难找到一个*不是*通用的 DDI。当你真的找到这样一个 DDI 时，它很可能无论如何也不是你想要（或应该）调用的函数。例如，你最后一次调用
    **KeGetCurrentProcessorNumber** 是什么时候，嗯？嗯，自从 Windows 7 引入处理器组以来，它就一直不能正常工作。不管怎样，它是一个非通用的
    DDI。有趣的是，即使是很多很久以前被归入 NTDKK.H 的 DDI，也属于通用 DDI 集合。例如，**MmIsAddressValid** 就是这样一个
    DDI：它所做的并非大多数人认为的那样，而且在石器时代就被移入了 NTDKK.H。但它是一个通用 DDI。耶。我想是这样。


    MSDN 文档将一些令人意外的 DDI 系列列为*不*通用，例如 Remove Lock 系列的 DDI（**IoAcquireRemoveLock**、**IoReleaseRemoveLockAndWait**
    及其同类）。不过，好消息是 MSDN 在这些问题上似乎有误。WDK 中有一个文件，以 XML 形式（方便你查看）列出了所有通用 API 和 DDI。该文件位于：


    ```

    C:\Program Files (x86)\Windows Kits\10\build\universalDDIs\<arch>\UniversalDDIs.xml

    ```


    就 Remove Lock DDI 而言，这些函数出现在上述 XML 文件中，尽管它们在 MSDN 中被列为非通用。以 XML 文件为准。这些函数确实是通用
    DDI 集合的一部分。


