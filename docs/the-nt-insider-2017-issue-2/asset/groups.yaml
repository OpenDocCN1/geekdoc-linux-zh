  - "[PAGE 24]\n\n# Cleanup, Close and Cancel... (Cont.)\n\n(CONTINUED FROM PAGE 24)\n\
    \nEvtIoCanceledOnQueue is to allow your driver to stop whatever hardware operation\
    \ that may be in progress as a result of the Request, and then have your driver\
    \ complete the Request with STATUS_CANCELLED and an information field of zero.\n\
    \nIf a EvtIoCanceledOnQueue Event Processing Callback has not been supplied, WDF\
    \ simply removes the request from the Queue and completes it with STATUS_CANCELLED\
    \ and an information field of zero. As we also described earlier, one of the reasons\
    \ this is so helpful is that it automatically dispenses with Requests that are\
    \ Queued but not yet presented to your driver.\n\nIf your driver holds one or\
    \ more Requests in progress, but not on a Queue, then your driver will need to\
    \ specify a EvtRequestCancel Event Processing Callback for each of these Requests.\
    \ Your driver does this by calling WdfRequestMarkCancelable, specifying a Request\
    \ handle and pointer to an EvtRequestCancel Event Processing Callback implemented\
    \ by your driver. The EvtRequestCancel Callback has the following prototype:\n\
    \n```\nVOID EvtRequestCancel(\n    _In_ WDFREQUEST Request)\n```\n\nAgain, the\
    \ goal for your driver in this Callback is to stop any device operations associated\
    \ with the Request that happen to be in progress, and complete the Request with\
    \ STATUS_CANCELLED and an information field of zero.\n\n# Comments on Cancel:\
    \ The Real World\n\nWhile I've tried to make the general goals and processes for\
    \ handling Cancel in your driver clear, I hope it's also evident that handling\
    \ Cancel can sometimes be difficult. And, sometimes, it can be very, very, difficult.\
    \ For instance, it's often not exactly easy to stop a device that's in the midst\
    \ of processing an I/O operation. Or, worse, it's often not easy to stop a device\
    \ from processing one single, specific, I/O operation when it's in the midst of\
    \ processing several (hundred or thousand) I/O operations simultaneously.\n\n\
    Thus, as alluded to earlier, in some cases it's probably best to not implement\
    \ any Cancel handling at all for in-progress I/O requests. Be aware that this\
    \ is only a reasonable strategy when you're certain that all your in-progress\
    \ I/O requests will complete in a timely manner. Yes, when you're notified of\
    \ a Cancel operation there's a thread and/or process that's waiting to exit. But\
    \ if it takes another 10ms or 20ms to complete a DMA transfer, and then complete\
    \ the pending Request normally, that amount of time delay isn't going to matter\
    \ to the thread or process. And that's a whole lot easier than trying to cancel\
    \ the in-progress operation. Trust me. I have the scars to prove this.\n\nThere's\
    \ also another detail you need to know: Unless you're doing so from within your\
    \ EvtRequestCancel Event Processing Callback, you must never call WdfRequestComplete\
    \ (or any variant therefore) with a Request that's been marked as Cancelable.\
    \ This means that if you associate a Cancel routine with a Request, and you complete\
    \ that Request as part of your regular processing (that is, you don't complete\
    \ it as part of Cancel processing) you must first call WdfRequestUnmarkCancelable.\n\
    \nUnfortunately, Cancel handling remains one of the most complex parts of I/O\
    \ operations. While WDF provides you with some help by canceling Request that\
    \ reside on a Queue and have yet to be presented to your driver, it doesn't do\
    \ much to help you with Requests that have been presented to your driver and are\
    \ in progress when they're canceled.\n\n# Back to Those Examples\n\nTo summarize\
    \ what we've discussed, let's return again to the examples we used at the start\
    \ of this article. In our first example, an application sends 100 asynchronous\
    \ Read Requests to your driver, and then calls CloseHandle, while some of those\
    \ Request are still in progress. Your driver uses a single Queue with Sequential\
    \ Dispatching to service these Requests.\n\nNow, you know what happens.\n\nAs\
    \ soon as the application calls CloseHandle, Windows will immediately issue a\
    \ Cleanup. If your driver needed to handle any state specific to the process that\
    \ was doing the CloseHandle operation, it would provide an EvtFileCleanup Event\
    \ Processing Callback. From within this Callback, it would tear down the process\
    \ specific state. Whether or not your driver provided an EvtFileCleanup Event\
    \ Processing Callback, WDF will Cancel any Requests that are pending on your driver's\
    \ Queue.\n\n(CONTINUED ON PAGE 26)"
