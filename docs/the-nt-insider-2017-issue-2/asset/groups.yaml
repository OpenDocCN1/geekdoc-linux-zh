    at: http://store.osr.com.


    The board design is based on the well-known Cypress Semiconductor USB FX2 chipset
    and is ideal for learning how to write Windows drivers in general (and USB specifically
    of course!). Even better, grab the sample WDF driver for this board, available
    in the Windows Driver Kit.


