    # 文件系统微过滤器……（续）


    （接第18页）


    在按应用程序的基础上，当某个应用程序执行读取时，可以决定向其提供解密数据还是加密数据。例如，当 Microsoft Word 访问加密文档时，隔离微过滤器可能会自动解密该文档的数据。然而，当同一个加密文档被备份应用程序访问时，隔离微过滤器则可以提供文件的原始加密内容。更有趣的是，设计良好的隔离微过滤器可以同时向读取同一文件的不同应用程序提供两种视图：文件内容的解密视图和文件内容的加密视图。那么，如果其中一个应用程序向文件写入数据，而另一个应用程序以不同的视图打开该文件，会发生什么？我们只能说，事情很快会变得“有趣”起来。


    ## 隔离微过滤器：不仅仅是加密


    我们应当补充说明，隔离微过滤器模型并不仅用于透明的数据加密和解密系统。隔离微过滤器模型适用于以下任何情况：


    -   应用程序对数据的视图与文件系统上存储的基础文件之间存在差异。

    -   应用程序对数据的视图与文件数据的基础位置之间存在差异。

    -   不同的应用程序实例需要对文件系统上存储的同一基础数据拥有独特视图。


    例如，考虑一个用于更改跟踪和版本控制的隔离微过滤器。一个 Word 实例可能正在积极编辑某个文件的最新版本，而另一个 Word 实例（可能由不同用户运行）则可能正在积极编辑该文件的旧版本。


    又例如，一个存储在云中的文件，会根据文件的访问方式被一点一点地拉取下来。该文件在应用程序看来可能完全驻留在本地文件系统中。然而，隔离过滤器可能会根据需求从远程存储中访问和回填数据。


    ## 这给我们留下了什么？


    Windows 微过滤器模型灵活而极其强大。只要有足够的时间和经验，大多数开发人员都将能够编写标准微过滤器。这些过滤器监视和/或跟踪文件操作，并可能授权访问底层文件系统中存储的文件。开发标准微过滤器所固有的主要挑战是理解原生
    Windows 文件系统语义，并将底层文件系统提供的所有功能透明地传递给应用程序。这两个挑战都是可以解决的，并且无需具备大量 Windows 文件系统专业知识即可完成。


    与标准微过滤器相比，隔离微过滤器则不同。这些微过滤器将应用程序收到的文件视图与该文件的实际底层数据分离开来。开发隔离微过滤器更像是开发一个完整的 Windows
    文件系统，而不是开发标准微过滤器，因为它需要与 Windows 缓存管理器和内存管理器密切交互。因此，开发隔离微过滤器很可能不是大多数不打算成为 Windows
    文件系统专家的开发人员能够成功完成的任务。


    ## 设计与代码审查


    你编写了代码——是否遗漏了什么？


    无论你是 Windows 驱动程序开发新手，还是之前写过几十个驱动程序，总是很难确保自己没有遗漏任何东西。Windows 会变化，WDF 会变化，安全问题也会出现。最佳实践是一个移动的目标。


    让 OSR 来帮助你吧！我们的工程团队 100% 专注于 Windows 内部机制和驱动程序开发。让我们成为你项目中的专家、第二双眼睛……确保项目完成得正确！


    # 清理、关闭和取消……（续）


    （接第7页）


    除了调用 EvtFileCleanup 之外，WDF 在 Cleanup 处理中还要更进一步。在调用驱动程序的 EvtFileCleanup 事件处理回调（如果有）之后，WDF
    会扫描驱动程序的 WDF 队列，查找最初通过作为 Cleanup 目标的文件对象提交的请求。对于找到的每个此类请求，WDF 都会发出一个取消操作。我们稍后将讨论
    Cancel 的细节，但暂时可以说，为这些请求发出取消操作几乎肯定会导致它们从队列中移除，并由 WDF 以错误状态完成。


    然而，需要注意的是，作为处理 Cleanup 的一部分，WDF 不会对未存储在 WDF 队列上的挂起请求执行取消处理。因此，如果你有一个正在进行的请求，并且通过将
    WDFREQUEST 句柄存储在设备上下文中来跟踪该请求，那么该请求不会由 WDF 在 Cleanup 处理中自动取消，因此它将保持正在进行的状态。


    还有一些其他有趣的特殊情况，在这些情况下，Windows 会在清理操作之后立即对通过关联文件对象发送的请求执行取消操作。有关这些情况的讨论，请参阅侧边栏“当清理变成取消”（下文）。


    总结：当应用程序调用 CloseHandle 时，你的驱动程序将在其 EvtFileCleanup（而不是通常认为的 EvtFileClose）事件处理回调中被调用。然后，WDF
    将对任何驻留在 WDF 队列上的请求发出取消操作。


    当对文件对象的最后一个引用消失时（即文件对象的引用计数递减到零），Windows 会发出一个 Close 请求，WDF 会调用关联驱动程序的 EvtFileClose
    事件处理回调。文件对象引用计数为零意味着（就本文而言）没有正在进行的或挂起的针对该文件对象的 I/O 操作。


    如果在调用 CloseHandle 时没有未完成的 I/O 请求，那么 EvtFileClose 将在 EvtFileCleanup 之后立即被调用。你的驱动程序的
    EvtFileClose 事件处理回调将在 IRQL PASSIVE_LEVEL 上、在任意进程和线程上下文中被调用。因此，当你驱动程序的 EvtFileClose
    被调用时，你不知道哪个线程是“当前线程”，也不知道哪个进程是“当前进程”。


    总结：当文件对象引用计数变为零，表明没有针对该文件对象挂起的进一步 I/O 请求时，你的驱动程序将在其 EvtFileClose 事件处理回调中被调用。


    （接第21页）


    ## 当清理变成取消


    通过阅读本文，你已经知道当 WDF 接收到针对某个文件对象的 Cleanup 操作时，它会针对通过该文件对象发出的、位于 WDF 队列上的任何请求发出取消操作。还有另外两种情况下，Windows
    I/O 子系统会通过发出取消操作来扩展 Cleanup 处理。这些情况是：发出的 I/O 操作与 I/O 完成端口相关联，以及发出的 I/O 操作来自线程池中的线程。


    完成端口和线程池是两种优化的机制，旨在高效处理应用程序的异步回调。我们特别感兴趣的情况是处理 I/O 完成回调。


    当文件对象的最后一个句柄被关闭时，Windows 总是发出一个 Cleanup 操作。与完成端口和线程池关联的 CloseHandle 操作处理的特殊之处在于：在
    Cleanup 操作完成之后，I/O 子系统会针对文件对象中仍然在进行中的任何 I/O 操作发出取消操作。这会导致（或者，如果相关驱动程序正确履行职责，“应该会”）任何通过该文件对象发起的未完成
    I/O 操作被快速终止。因此，完成端口或线程池会及时收到任何挂起 I/O 终止的通知。


