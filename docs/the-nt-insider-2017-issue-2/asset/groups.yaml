    +   - Design and deliver a series of offerings with a roadmap catered to a new
    group of recent hires or within an existing group.

    +   - Work with your internal training organization/HR department to offer monthly
    or quarterly seminars to your division or engineering departments company-wide.


    If your driver holds Requests in-progress, but not on a Queue, it can register
    an EvtRequestCancel Event Processing Callback for a specific Request. For example,
    if your driver starts a Request on your device and you’re waiting for the device
    to complete its processing, your driver might simply save the handle to the pending
    Request in a location in your Device Context. This is, in fact, very common. If
    you want to be able to handle Cancel events for that Request while it is pending,
    waiting for your device, you can optionally register an EvtRequestCancel Event
    Processing Callback for that Request.


    To Summarize: Whenever an application begins its exit processing with I/O in progress,
    or an application calls CancelIo or CancelIoEx, your driver may be called at its
    EvtRequestCancel or EvtCanceledOnQueue Event Processing Callback.


    A handy summary of Cleanup, Close, and Cancel processing is shown in table form
    in Figure 2 (next page).


    Given the above definitions, let’s examine how your driver can use the Cleanup,
    Close and Cancel events to its best advantage.


