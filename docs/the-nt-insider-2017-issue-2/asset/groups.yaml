    ## Handling Cleanup, Close and Cancel in your WDF Driver


    我写的大多数 WDF 主题都是在我参与 NTDEV 列表的一系列交流中产生的，或者是我在审查或更新驱动代码时看到的趋势所启发的。这次，我受到了这两方面的启发。


    最近，NTDEV 上有一个关于使用 Cleanup 和 Cancel 事件处理回调的讨论线程，相当有趣。最近，我也有机会更新两个非常不同的设备驱动程序。一个是在
    NT V4 时期编写的 WDM 驱动程序。另一个是由一位新 Windows 驱动开发人员在 KMDF 发布后不久编写的 KMDF 驱动程序。虽然这两个驱动程序是为非常不同类型的设备编写的，但它们有一个共同点：开发人员都误解了如何终止正在进行的请求，并使用了（或更确切地说，误用了）Cleanup
    事件来代替 Cancel。


    这就是我被激励去详细写关于 WDF 驱动程序中 Cleanup、Close 和 Cancel 处理的原因。另一个私人动机是，虽然我们在 Writing WDF
    Drivers 研讨会上涵盖了这个主题，但我们几乎从未有时间在我想深入讨论的程度上谈论它。所以，我认为写一篇文章对许多目的都有用。


    ### Some Preliminaries


    首先要明白的是，至少在驱动世界（与文件系统相反），你需要将 Cleanup、Close 和 Cancel 的处理放在一起考虑。这是因为它们经常被混淆，并且这些函数的处理经常相互作用。


    另外，在我们开始讨论时，请记住，我们在这里关于 Cleanup、Close 和 Cancel 的说法完全特定于 WDF。正如 WDF 的大多数事情一样，试图在脑海中“映射”WDM
    到 WDF（或反之）并期望能弄明白事情是绝对不明智的。那样会导致疯狂。WDF 框架是其自身 I/O 处理生态系统。当然，它与 WDM 交互，但 WDF 驱动程序的工作规则完全且仅由
    WDF 制定。仅仅因为某件事在 WDM 中以某种方式工作，并不意味着对 WDF 也是如此。


