    # 文件系统微过滤器...（续）


    有趣的是，缓存中存储的数据是由 Windows 内存管理器通过缺页处理从磁盘读入内存的。那次分页读取操作同样会经过文件系统。


    文件系统微过滤器当然可以参与处理读写操作，无论这些操作源自应用程序还是源自内存管理器。


    ## 保持简单：标准微过滤器


    最常见的文件系统微过滤器类型会监视，甚至可能跟踪或记录在文件系统层执行的各种操作。有些微过滤器（例如防病毒扫描器）甚至可能批准或否决某些操作。然而，这些过滤器并不参与改变其所过滤文件的数据视图或数据大小。我们将此类过滤器称为“标准微过滤器”，因为它们代表了现有文件系统微过滤器中的绝大多数。


    标准微过滤器的开发者面临的主要挑战是：


    - A. 正确理解并处理原生 Windows I/O 子系统的语义。

    - B. 正确保持所有原生文件系统操作的行为，即使是那些他们不一定理解或不关心的操作。


    当然，这还只是编写任何 Windows 内核模式驱动程序所固有基本挑战之外的额外负担。


    克服第一个挑战（即正确理解并处理原生 Windows I/O 子系统语义）只需要时间和经验。微软提供了大量示例，可以用作起点。而且关于编写基本文件系统微过滤器的文档出奇地好——只要你花时间阅读并理解它。此外，还有一些不错的在线资源，比如我们的
    NTFSd 列表，可以帮你解答一路上遇到的问题。另外，我还应该提到，从 2018 年 1 月开始，我们将开设一期关于如何编写标准微过滤器的研讨会。


    上面 B 项的复杂程度在很大程度上取决于你编写的微过滤器类型。你的操作越简单，过滤范围越有限，事情就越容易。例如，试图过滤你的过滤器并不是特别关心的 I/O
    操作通常是一个错误。针对文件系统微过滤器的 HLK 测试将非常有助于你评估在保留所过滤文件系统行为方面的成功程度。请务必运行这些测试！


    因此，如果你需要编写一个标准微过滤器——也就是说，一个监视文件系统操作的过滤器——你所面临的挑战将是合理的。


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_16_0.png)


    ## 文件系统微过滤器...（续）


    试图过滤你的过滤器并不是特别关心的 I/O 操作通常是一个错误。针对文件系统微过滤器的 HLK 测试将非常有助于你评估在保留所过滤文件系统行为方面的成功程度。请务必运行这些测试！


    因此，如果你需要编写一个标准微过滤器——也就是说，一个监视文件系统操作的过滤器——你所面临的挑战将是合理的。


    ## 难度成倍增加：隔离微过滤器


    另一种不太常见的文件系统微过滤器类型是隔离微过滤器。隔离过滤器将文件数据的视图与文件系统实际存储的底层数据分离开（或“隔离”）。编写这种类型的微过滤器通常和编写一个标准的
    Windows 文件系统一样复杂，因为它涉及你的微过滤器、Windows 缓存管理器和 Windows 内存管理器之间直接而密切的交互。事实上，一些经验丰富的开发者认为隔离微过滤器甚至比文件系统开发更难，因为当你编写隔离微过滤器时，实际上你必须在筛选器管理器提供的
    API 内“容纳”一个 Windows 文件系统的实现。因此，除了标准微过滤器开发者面临的挑战之外，隔离微过滤器的开发者还要处理大量更为复杂的问题。


    为了说明我们所说的“将文件数据的视图与实际底层数据分离开”的含义，让我们考虑一个实现按访问透明加密/解密的隔离微过滤器。应用程序打开一个以加密形式存储在磁盘上的文件，并对其调用
    ReadFile。在这种情况下，加密/解密微过滤器的工作是透明地解密呈现给应用程序的数据。支持此类活动的一般方案如图 3 所示。


    图 3 显示了两个文件对象，每个文件对象都与同一个文件相关联。上面的文件对象（绿色）是与应用程序关联的打开实例。这个文件对象代表应用程序对文件的视图。请注意，该文件对象引用的缓存节包含解密数据。这些数据是由隔离过滤器与缓存管理器协同放入缓存中的。


    下面的文件对象（蓝色）由隔离微过滤器创建，代表该微过滤器（以及底层文件系统）对文件的视图。请注意，此文件对象的缓存节中的数据是加密的。隔离微过滤器使用下面的文件对象与底层文件系统进行交互。


    因此，当用户应用程序调用 ReadFile 时，隔离微过滤器将收到该请求（作为其先前讨论过的读前置操作处理的一部分），并与缓存管理器交互以将缓存填充数据。在处理随后产生的分页读取操作（由内存管理器发送，以满足缓存管理器尝试为缓存获取数据的需求）时，隔离微过滤器会发出一个引用下方（蓝色）文件对象的
    ReadFile 操作。底层文件系统与缓存管理器协作，满足此请求并将数据放入指定的缓存节中。


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_17_0.png)


    当你考虑到大多数透明数据加密系统会使用某种元数据头（用于保存密钥或访问信息）时，事情会变得更加复杂。这个头通常存储在文件本身中。因此，应用程序用于读取操作的文件偏移量可能与隔离微过滤器在访问磁盘上存储文件时需要使用文件偏移量不同。


    但通常还有比我们目前讨论的更多的复杂性。假设加密/解密微过滤器确定


