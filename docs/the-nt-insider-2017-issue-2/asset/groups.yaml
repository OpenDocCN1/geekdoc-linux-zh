    # 清理、关闭和取消……（续）


    | 事件 | 结果操作 | 回调约束 |

    |---|---|---|

    | 文件对象的最后一个句柄关闭 | CLEANUP：调用 EvtFileCleanup；WDF 对当前位于任何 WDF 队列上的任何请求发出取消操作。 |
    IRQL PASSIVE_LEVEL，在调用 CloseHandle 的线程上下文中 |

    | 文件对象的最后一个引用被移除 | CLOSE：调用 EvtFileClose | IRQL PASSIVE_LEVEL，在任意进程/线程上下文中 |

    | 应用程序开始退出进程，应用程序调用 CancelIo 或 CancelIoEx | CANCEL：依赖请求的取消函数（EvtRequestCancel
    或 EvtIoCanceledOnQueue） | IRQL <= DISPATCH_LEVEL，在任意进程/线程上下文中 |


    图 2 – 清理、关闭和取消小结


    ## 何时应该处理清理？


    当 WDF 收到特定文件对象的清理通知时，如果指定了 EvtFileCleanup 事件处理回调，它会调用该回调。EvtFileCleanup 的原型如下：


    ```

    VOID EvtFileCleanup(

    _In_ WDFFILEOBJECT FileObject)

    ```


    您的 WDF 驱动程序是否应该实现清理？如果应该，那么在清理处理过程中您应该做些什么？


    对于大多数驱动程序来说，答案很简单：在几乎所有情况下，您都不需要处理清理操作——因此，您不应该在驱动程序中提供 EvtFileCleanup 事件处理回调。


    Windows 中的清理操作主要设计用于两个基本目的：


    - 1) 向驱动程序快速发出通知，告知调用应用程序不打算在关联句柄上发出任何进一步的 I/O 请求（请记住，清理是按文件对象发生的）；

    - 2) 为驱动程序提供“最后一次机会”来执行任何需要在请求应用程序上下文中完成的操作（因为应用程序表明其打算通过这个特定打开实例停止与驱动程序交互）。


    作为上述第 1 点的一部分，清理操作可以用作一种批量丢弃大量请求的方法，这些请求对于发出它们的应用程序而言可能已不再重要。WDF 通过在清理处理时，对在正在关闭的文件句柄上发出且位于
    WDF 队列中的任何请求执行取消操作，来简化这一过程。这样做的主要结果是：来自已清理文件对象、位于队列中等待呈现给您的驱动程序的任何请求，将永远不会到达您的驱动程序。WDF
    会将这些请求从队列中移除并取消它们，而您的驱动程序无需做任何事情。


    上述第 2 点稍微更有意思。因为 EvtFileCleanup 是在调用 CloseHandle 的进程/线程上下文中调用的，所以此回调为您的驱动程序提供了机会，让其拆除按进程维护的任何上下文。例如，如果您的驱动程序将某些内存映射到应用程序的虚拟地址空间中，那么
    EvtFileCleanup 事件处理回调是撤销该映射的理想位置。这类操作并不常见，但它是 WDF 中清理操作的关键用途之一。而且，是的，在专家读者们提出强烈异议之前，我要补充一点：将内存映射到应用程序的虚拟地址空间以及取消映射，所涉及的内容远不止在
    EvtFileCleanup 中简单地取消映射。我在此不打算深入讨论这一点。


    值得注意的是，清理处理中还固有另一个讨厌的细节：由于句柄是进程级别的实体，进程中的一个线程可以正在某个句柄上发送 I/O 请求（例如，反复调用 ReadFile），而另一个线程同时对该句柄调用
    CloseHandle。如果您仔细想想，就会意识到这意味着：即使在您的驱动程序已针对该句柄被调用了 `EvtFileCleanup` 事件处理回调之后，您的驱动程序仍有可能在该句柄上收到一个或多个新的请求。这会形成一种讨厌的竞态条件，也使得这个位置成为不适合彻底清除驱动程序中请求的地方，以避免例如应用程序在退出时挂起。


    因此，一般而言，WDF 驱动程序不需要——实际上也不应该——直接处理清理操作。正如我常说的：“如果你不写任何代码，你就不会有任何 bug。”所以，当你不需要实现某个函数时，这通常是一件好事。


    ## 何时应该实现关闭处理？


    当 WDF 收到特定文件对象的关闭通知时，如果指定了 `EvtFileClose` 事件处理回调，它会调用该回调。`EvtFileClose` 的原型如下：


    ```

    VOID EvtFileClose(

    _In_ WDFFILEOBJECT FileObject)

    ```


    您的 WDF 驱动程序是否应该实现关闭？如果应该，那么在关闭处理过程中您应该做些什么？


    与清理操作类似，对于大多数驱动程序来说，答案很简单：大多数驱动程序无需处理关闭操作，因此您不应该在驱动程序中提供 `EvtFileClose` 事件处理回调。


    关闭操作是您收到文件对象将要消失的最后一次通知。当调用 `EvtFileClose` 时，文件对象上不再有待处理的请求。一旦您从 `EvtFileClose`
    例程返回（如果您提供了该例程），关联的文件对象将被销毁。


    那么，关闭操作的目的是什么？关闭操作的主要目的是让您的驱动程序有“最后一次机会”来拆除它可能一直在维护的任何与句柄相关的上下文。例如，假设在打开处理期间（在
    `CreateFile` 时调用），您的驱动程序分配了一些数据结构，用于跟踪各种状态和信息。


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_22_0.png)


    您的驱动程序分配了一些数据结构，用于跟踪各种状态和信息。或者，您的驱动程序跟踪其设备的打开实例数量。在这两种情况下，`EvtFileClose` 都为您提供了撤销这些操作的绝佳机会。例如，释放与句柄相关的上下文，或者递减打开实例的计数。


    因此，一般而言，WDF 驱动程序不需要——实际上也不应该——直接处理关闭操作。只有当您有需要拆除的按句柄上下文时，才需要这样做。在这种情况下，`EvtFileClose`
    是处理这种拆除的正确位置。


    ## 您应该如何处理取消？


    请记住，与清理和关闭不同，取消通知是按请求实现的。如前所述，当线程在 I/O 进行中退出，或应用程序明确请求一个或多个 I/O 操作在完成之前终止时，Windows
    会为特定请求发出取消，一次一个。


    取消的目的是告诉驱动程序，在方便的时候，它应该尽快停止处理给定的 I/O 操作，因为该 I/O 操作的结果已不再相关。如前所述，取消最常见的用途是作为线程和进程退出的一部分。当线程退出时，Windows
    将取消该线程中任何未完成的 I/O 请求。这被称为 I/O 收尾处理。I/O


