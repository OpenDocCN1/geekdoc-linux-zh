    ## 文件系统微过滤器


    ### 标准微过滤器和隔离微过滤器简介


    过滤驱动程序概念是 Windows I/O 子系统最强大的架构特性之一。过滤器只需附加到设备之上即可为现有设备的功能增加价值。当然，过滤设备不需要对底层设备的驱动程序进行任何更改。


    在典型的 Windows 系统中，过滤驱动程序安装在多个层级。例如，在卷级别存在标准 Windows 提供的过滤驱动程序，它们提供卷快照功能（用于支持备份），以及可选的完整卷加密（用于支持
    Windows BitLocker）。还可能存在制造商特定的过滤驱动程序，例如为鼠标或键盘添加对特定型号独特按钮支持的过滤器。


    在 Windows 系统中插入过滤器的最常见、最强大的位置之一是在文件系统之上。文件系统过滤器在 I/O 操作到达文件系统之前拦截 I/O 操作（来自应用程序和系统本身）。这使它们能够在文件系统看到之前监控、跟踪、管理、操作，甚至接受或拒绝
    I/O 操作。人们最熟悉的文件系统过滤器类型可能是防病毒过滤器。这类过滤器通常会拦截文件打开请求并暂停它们，同时过滤器（或更可能是在用户模式下运行的关联服务）扫描正在打开的文件是否存在病毒。如果发现病毒，则可以取消打开请求。如果未发现病毒，则可以允许打开请求正常完成。


    文件系统过滤器常用于从前面刚描述的防病毒和恶意软件扫描，到软件许可证跟踪和管理，到对文件的审计和更改跟踪，到按需透明数据加密和解密。文件系统过滤器也可以用于其他不太明显的目的。例如，由于它们可以看到哪些文件被创建和写入，文件系统过滤器通常在备份产品和分层存储子系统中发挥关键作用。而且由于文件系统过滤器能够成为应用程序所见文件系统“命名空间”的第一解释者，它们还可以执行强大的文件重定向操作，例如使远程文件（如存储在云中的文件）看起来像是本地文件。


    自 Windows XP SP2 中引入以来，文件系统微过滤器模型已成为实现文件系统过滤器的首选机制。这是有充分理由的，因为微过滤器模型为文件系统过滤驱动程序开发提供了优秀的组织和支持框架。凭借相当不错的文档和
    GitHub 上大量示例，许多开发者认为编写文件系统微过滤器在其能力范围内。而且他们是对的……前提是他们在某些边界内。


    本文描述了 Windows 文件系统微过滤器的基本架构概念。然后描述了两种不同的微过滤器类型：**标准微过滤器**，和**隔离微过滤器**。最后，本文描述了开发文件系统隔离微过滤器项目为何比开发标准微过滤器项目复杂得多。


    ### 标准微过滤器 vs. 隔离微过滤器


    > 在本文中，我们澄清了在 Windows 文件系统社区中使用的几个常见术语。


    **标准微过滤器**


    标准微过滤器是一种 Windows 文件系统微过滤器驱动程序，用于监控或跟踪文件系统数据。大多数防病毒扫描程序都是标准微过滤器。


    **隔离微过滤器**


    隔离微过滤器是一种 Windows 文件系统微过滤器驱动程序，用于将文件数据的视图与该文件实际的底层数据分离。隔离微过滤器的典型示例是按需透明加密/解密过滤器。隔离微过滤器使用“同一栈”概念，并通过为每个视图提供唯一的缓存区段来提供其不同的视图。


    ### 过滤管理器和高度


    文件系统微过滤器模型的基础是过滤管理器，它是标准 Windows 组件。过滤管理器实现为传统文件系统过滤器，并过滤所有文件系统实例。由于在任何给定文件系统实例上可能存在多个过滤器（Windows
