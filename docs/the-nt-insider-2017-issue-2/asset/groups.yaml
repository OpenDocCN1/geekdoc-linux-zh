    ## Peter 的宏论


    ## 我们需要一场驱动程序开发者大会！


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_3_0.png)


    早在 2015 年，我就发博客并长篇大论地表示，我欢迎微软与 Windows 驱动程序开发社区之间似乎正在出现的更开放、更良好的沟通局面。当然，在从 Windows
    7 到 Windows 8 的那个时代，情况已经不可能更糟了。哦，我可以大讲特讲一些故事。例如，我记得一家大型 IHV（总销售额约 150 亿美元）恰好是我们的客户，他们被告知微软对他们不感兴趣，如果他们想知道
    Windows 发生了什么，可以问他们出售硬件的 OEM。


    哎哟！从那时起，情况只会好转，对吧？


    嗯，情况确实从那时起好转了。而且是彻底好转。谢天谢地，那些日子早已一去不复返。尽管如此，即使在 2015 年新的开放政策刚开始时，我也一直在呼吁微软与我们第三方驱动程序开发者之间进行更多、更好的双向沟通。而我在
    2015 年 12 月那篇 **驱动宏论** 中提出的呼吁更好沟通的所有观点，今天依然适用。


    从 Windows 8 开始，再到 Windows 10，Windows 生态系统中发生了大量变化。I/O 和电源管理子系统都发生了一些关键的架构变化。我们见证了
    Windows RT 的推出、Windows Mobile 的推出、Windows Phone 的出现、Windows IoT Core（在 x86 和 ARM
    上）的推出、对树莓派的支持、对骁龙 835 的支持、OneCore 的推出、在 ARM 上对 x86 模拟的支持，以及 Windows 10 S 的推出。这些只是过去几年里发生的众多最有趣事件中的一部分。


    哦，我差点忘了提：在同一时期，作为 Visual Studio 一部分的 C/C++ 编译器被大规模重写。还引入了名为通用驱动程序的东西（如果你还没理解，这可是个大事件）。并且推荐了对
    INF 文件的修改。谁又能忽视驱动程序签名所发生的变化呢？


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_3_1.png)


    让我特别注意的是，*我这里提到的所有变化，以及其他许多变化，都显著影响着驱动程序开发者。*


    更值得注意的是，驱动开发者几乎没有机会去跟上这些变化。这绝不像过去那些糟糕的日子。关于这些主题的大部分信息都在“外面”某个地方。很多已经记载在 MSDN 或博客上。其中几个主题有
    Channel 9 视频。见鬼，我们也在《NT Insider》上写过关于其中不少主题的文章。


    但总体而言，驱动开发者不得不自己摸索，以弄清楚 Windows 驱动开发者有什么新变化。他们必须自己去发现、搜索、识别并试图消化每个主题的信息。他们在这里读一篇文章，在那里看一段视频。而在拼凑全局图景方面，他们得到的帮助甚少。


    续接第 5 页

