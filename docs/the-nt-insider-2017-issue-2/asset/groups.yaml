    # Cleanup, Close and Cancel... (Cont.)


    (CONTINUED FROM PAGE 7)


    In addition to calling EvtFileCleanup, WDF goes one step further in its Cleanup
    processing. After calling the driver’s EvtFileCleanup Event Processing Callback
    (if any), WDF scans your driver’s WDF Queues for Requests originally submitted
    via the File Object that’s the target of the Cleanup. For each such Request found,
    WDF issues a Cancel operation. We’ll discuss the details of Cancel later, but
    for now let’s just say that issuing a Cancel operation for these Requests almost
    certainly results in their being removed from the Queue and completed by WDF with
    an error status.


    It is important to note, however, that as part of handling Cleanup, WDF does not
    perform Cancel processing for pending Requests that are not stored on a WDF Queue.
    Thus, if you have an in-progress Request, and you’re keeping track of that Request
    by storing its WDFREQUEST handle in your Device Context, that Request will not
    automatically be Canceled by WDF as part of Cleanup processing and therefore will
    remain in progress.


    There are some other interesting special cases where Windows instantly follows
    a Cleanup operation with a Cancel for Requests sent via the associated File Object.
    For a discussion of these cases, see the sidebar When Cleanup Becomes Cancel (below).


    To summarize: When an application calls CloseHandle, your driver will be called
    at its EvtFileCleanup (NOT EvtFileClose, as is commonly thought) Event Processing
    Callback. WDF will then issue a Cancel for any Requests that are resident on a
    WDF Queue.


    When the last reference to a File Object goes away (that is, the File Object’s
    reference count is decremented to zero) Windows issues a Close request and WDF
    calls the associated driver’s EvtFileClose Event Processing Callback. The reference
    count on the File Object being zero means (for the purposes of this article) that
    there are no I/O operations in progress or pending for the File Object.


    If there are no I/O requests outstanding when CloseHandle is called, EvtFileClose
    will be called immediately after EvtFileCleanup. Your driver’s EvtFileClose Event
    Processing Callback will be called at IRQL PASSIVE_LEVEL, and in an arbitrary
    process and thread context. Thus, when you driver’s EvtFileClose is called you
    do not know which thread is “current thread” or which process is “current process”.


    To summarize: When the File Object reference count goes to zero, signaling that
    there are no further I/O requests pending for the File Object, your driver will
    be called at its EvtFileClose Event Processing Callback.


    (CONTINUED ON PAGE 21)


    # When Cleanup Becomes Cancel


    From reading the article, you already know that when WDF receives a Cleanup operation
    for a given File Object, it issues a Cancel operation for any Requests issued
    via the File Object that are on WDF Queues. There are two other times when the
    Windows I/O subsystem extends Cleanup processing by issuing a Cancel. These are
    when the I/O operations that are issued are associated with an I/O Completion
    Port, and when the I/O operations that are issued come from a thread in a Thread
    Pool.


    Completion Ports and Thread Pools are two optimized mechanisms designed to efficiently
    handle asynchronous callbacks to an application. The case we’re particularly interested
    in is handling of I/O completion callbacks.


    When the last handle to a File Object is closed, Windows always issues a Cleanup
    operation. What makes the processing of CloseHandle operations associated with
    Completion Ports and Thread Pools special is that after the Cleanup operation
    has completed, the I/O Subsystem issues a Cancel operation for any I/O operations
    that remain in progress from the File Object. This results (or, rather, “should
    result” if the relevant drivers are properly doing their jobs) in any outstanding
    I/O operations that were initiated via the File Object being quickly terminated.
    Thus, the Completion Port or Thread Pool is promptly notified of the termination
    of any pending I/Os.'
