  md: '# # Get Social with OSR


    # ## Real-Time Updates


    Just in case you’re not already following us on Twitter, Facebook, LinkedIn, or
    via our own “osrhits” distribution list, below are a few of the more recent contributions
    that are getting attention in the Windows driver development community:


    **Tracking an NTSTATUS to its Source**

    I found myself in a situation this week where I really wanted to call the API
    SeTokenIsAdmin. I vaguely remembered some issues around this API, and Googling
    quickly brought up a couple of threads from NTDEV and NTFSU hinting at a security
    issue that was fixed in 2015...

    [http://www.osr.com/blog/2017/07/14/tracking-ntstatus-source/](http://www.osr.com/blog/2017/07/14/tracking-ntstatus-source/)


    **Attestation Signing — It’s NOT a Mystery**

    Over the past few weeks, we’ve been contacted by several folks — clients and non-clients
    alike — with a variation on the above story, in various levels of panic. What
    they have in common is that they’re all absolutely mystified by the process that’s
    required to get their drivers to install under certain circumstances on newer
    versions of Windows.

    [http://www.osr.com/blog/2017/07/06/attestation-signing-mystery/](http://www.osr.com/blog/2017/07/06/attestation-signing-mystery/)


    **WinDbg, Debugger Objects, and JavaScript! Oh, My!**

    In case you’ve missed it, there are tons of changes going on under the covers
    in WinDbg. There is a fundamental paradigm shift going on in terms of how WinDbg
    grants access and presents data to the user and it can lead to some pretty cool
    results.

    [http://www.osr.com/blog/2017/05/18/windbg-debugger-objects-javascript-oh/](http://www.osr.com/blog/2017/05/18/windbg-debugger-objects-javascript-oh/)


    **1394 Boot Debugging is Dead**

    TL;DR: Don’t waste your time like we did — 1394 boot debugging no longer works
    on the latest builds on Windows 10.

    [http://www.osr.com/blog/2017/04/07/1394-boot-debugging-dead/](http://www.osr.com/blog/2017/04/07/1394-boot-debugging-dead/)


    **Is Running the HLK Tests REALLY a Best Practice?**

    It turns out that how useful the HLK Tests are depends almost entirely on the
    type of driver your writing.

    [http://www.osr.com/blog/2017/03/22/running-hlk-tests-really-best-practice/](http://www.osr.com/blog/2017/03/22/running-hlk-tests-really-best-practice/)


    **Visual Studio 2017 Released — Driver Devs: Stay Where You Are**

