  md: '# Peter Pontificates... (Cont.)


    [CONTINUED FROM PAGE 4]


    How has Microsoft gotten information to driver devs at other times in Windows
    history? In years past, Microsoft has held periodic conferences to educate driver
    and hardware developers. At various points in history these conferences have been
    WinHEC, a Driver Developer Conference, Microsoft Build, or some other event.


    For the past few years, Microsoft has held WinHEC in Greater China. In March of
    2015 there was a WinHEC conference in Shenzhen, in 2016 there were WinHEC Summer
    Workshops in both Shenzhen and Taipei in June/July and a full WinHEC conference
    in December. The most recent WinHEC event was in Taipei in June of this year.


    Look: I get that the Microsoft has ignored developers all throughout Asia forever.
    I agree that a lot of ODMs are located in Greater China. I understand, and agree,
    that by the time 2015 rolled around it was long past time for Microsoft to hold
    an event like WinHEC in Greater China.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_4_0.png)


    But for three years in a row? Seriously? Shenzhen is on the other side of the
    planet to everyone BUT the Greater China development community. I’ve been to Shenzhen.
    It’s a pretty cool place. The food is amazing. And it’s just a short ride from
    Hong Kong. **But it’s no place for Microsoft to exclusively present content that’s
    important to driver developers.** If WinHEC is “where technical experts from around
    the world, and Microsoft, come together to make Windows great” then WinHEC needs
    to travel. If the idea is to “help educate [and] facilitate the exchange of ideas
    and give people a venue to share best practices” then WinHEC can’t JUST be held
    in Greater China.


    I think it''s time -- well, long past time, actually -- for Microsoft to have
    a conference for driver developers. I don''t care if it''s WinHEC (where there''s
    traditionally been a ton of info shared that''s been directed to OEM platform
    planning type people) or it''s like the previous Driver Developer Conference.
    But it needs to focus specifically on getting information to driver devs. I don''t
    want a few presentations thrown into some other event. We don''t need that.


    In discussing this idea recently with folks out in Redmond, they were certainly
    open to the idea. They seemed to "get" that we''re feeling underinformed.


    What do you think? Should Microsoft hold a conference for driver developers? Should
    it be part of WinHEC or separate? And, if such a conference is organized, where
    would you like to see it be held?


    **Vote in our 6-questions online poll:** https://www.osr.com/microsoft-hold-conference-driver-developers/

    You’ll be able to see the live results after you vote, and we''ll summarize all
    the results in the next issue of the NT Insider. Let’s hear your voice!


    *Peter Pontificates is a regular column by OSR Consulting Partner, Peter Viscarola.
    Peter doesn’t care if you agree or disagree with him, but there’s always the chance
    that your comments or rebuttal could find its way into a future issue. Send your
    own comments, rants or distractions of fact to: PeterPont@osr.com.*


