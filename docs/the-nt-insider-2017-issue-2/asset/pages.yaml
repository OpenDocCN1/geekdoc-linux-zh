  md: '# # File System Minifilters


    # ## An Introduction to Standard and Isolation Minifilters


    The filter driver concept is one of the most powerful architectural features of
    the Windows I/O subsystem. A filter can add value to the functionality of an existing
    device by simply attaching itself over that device. And, of course, filtering
    a device requires no change to the driver for the underlying device.


    Filter drivers are installed at many levels in a typical Windows system. For example,
    there are standard Windows-supplied filter drivers at the volume level that provide
    volume snapshot functionality (to support backups), as well as optional full volume
    encryption (in support of Windows BitLocker). There may also be manufacturer-specific
    filter drivers, such as a filter for a mouse or keyboard that adds support for
    buttons that are unique to a given model.


    One of the most common, and also the most powerful, places to insert a filter
    in a Windows system is over a file system. File system filters intercept I/O operations
    (from both applications and the system itself) before those I/O operations reach
    the file system. This allows them to monitor, track, manage, manipulate, and even
    accept or reject I/O operations before the file system gets to see them. The type
    of file system filter that most people are familiar with is probably the antivirus
    filter. This type of filter typically intercepts file open requests and suspends
    them while the filter (or, more likely, an associated service running in user
    mode) scans the file being opened for viruses. If any viruses are found, the open
    request can be cancelled. If no viruses are found, the open request can be allowed
    to complete normally.


    File system filters are commonly used for everything from antivirus and malware
    scanning as just described, to software license tracking and management, to auditing
    and changed tracking on files, to on-access transparent data encryption and decryption.
    File system filters can also be used for other, less obvious, purposes. For example,
    because they see which files are created and written, file system filters are
    often play key roles in backup products and hierarchical storage subsystems. And
    because file system filters are able to be the first interpreters of the file
    system “name space” that applications see, they can also perform powerful file
    redirection operations, such as making a remote file (such as one stored somewhere
    in the cloud) appear to be local.


    Since its introduction in Windows XP SP2, the File System Minifilter model has
    become the preferred mechanism for implementing file system filters. This is for
    good reason, because the Minifilter model provides an excellent organization and
    support framework for file system filter driver development. With reasonably good
    documentation and a significant set of examples on GitHub, many devs feel that
    writing a file system Minifilter is well within their ability. And they’re right...
    provided they stay within certain boundaries.


    This article describes the basic architectural concepts of Windows file system
    Minifilters. It then describes two distinct types of Minifilters: **Standard Minifilters**,
    and **Isolation Minifilters**. Finally, it describes why a project to develop
    a file system Isolation Minifilter is significantly more complex than a project
    to develop a Standard Minifilter.


    # ### Standard Minifilters vs. Isolation Minifilters


    > > In this article, we clarify a couple of common terms that are in use in the
    Windows file system community.


    **Standard Minifilter**


    A Standard Minifilter is a Windows file system Minifilter driver that monitors
    or tracks file system data. Most all antivirus scanners are Standard Minifilters.


    **Isolation Minifilter**


    An Isolation Minifilter is a Windows file system Minifilter driver that separates
    the view(s) of a file’s data from the actual underlying data of that same file.
    A typical example of an Isolation Minifilter is an on-access transparent encryption/decryption
    filter. Isolation Minifilters use the “same stack” concept, and provide their
    different views by providing unique cache sections for each view.


    # ### Filter Manager and Altitudes


    The basis for the file system Minifilter model is Filter Manager, which is a standard
    Windows component. Filter Manager is implemented as a legacy file system filter,
    and filters all file system instances. Because there can be multiple filters located
    over any given file system instance (the default installation of Windows 10 includes
    no less than nine standard file system Minifilters!), Filter Manager provides
    a system of “altitudes” that allows a developer to decide where in the filter
    hierarchy their Minifilter should be installed. See *Figure 1 (next page).*


    In *Figure 1*, you can see Windows Filter Manager (labelled FLTMGR) filtering
    the instance of the NTFS file system that’s mounted as the C drive. In the figure,
    Filter Manager has three file system Minifilters loaded: Minifilter A, Minifilter
