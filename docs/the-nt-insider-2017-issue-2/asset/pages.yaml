- pgno: 18
  md: '# File System Minifilters... (Cont.)


    (CONTINUED FROM PAGE 18)


    on a per-application basis whether decrypted data or encrypted data should be
    provided to the application when it does a read. For example, the Isolation Minifilter
    might automatically decrypt data from an encrypted document when accessed by Microsoft
    Word. However, when that same encrypted document is accessed from a backup application,
    the Isolation Minifilter could provide the raw, encrypted, contents of the file.
    What’s even more interesting is a well-designed Isolation Minifilter could allow
    both views, the decrypted view of the file’s contents and the encrypted view of
    the file’s contents, to different applications reading the file simultaneously.
    And what happens if one of those applications writes data to the file, while the
    other has a different view of the file open? Let’s just say that things get “interesting,”
    fast.


    # Isolation Minifilters: Not Just Encryption


    We should hasten to add that the Isolation Minifilter model is not only used for
    transparent data encryption and decryption systems. The Isolation Minifilter model
    is used any time:


    +   - There’s a difference between an application’s view of the data and the underlying
    file stored on the file system.

    +   - There’s a difference between the applications view of the data and the underlying
    location of the file data.

    +   - Different application instances need to having unique views of the same
    underlying data stored on the file system.


    For example, consider a change tracking and versioning Isolation Minifilter. One
    copy of Word might be actively editing the latest version of a file, while a different
    instance of Word (perhaps being run by a different user) might be actively editing
    an older version of the file.


    Or consider a file that’s stored in the cloud and only pulled down bit by bit,
    based on how the file is accessed. The file might appear to applications to be
    entirely resident on the local file system. However, an Isolation Filter could
    be accessing and back-filling data from remote storage as required.


    # Where Does That Leave Us?


    The Windows MiniFilter model is flexible, and extremely powerful. With enough
    time and experience, most developers will be able to write Standard Minifilters.
    These filters monitor and/or track file operations, and potentially authorize
    access to files stored in the underlying file systems. The primary challenges
    inherent in developing Standard Minifilters are understanding native Windows file
    system semantics, and transparently passing-through to applications all the functionality
    the underlying file system offers. Both of these challenges are tractable, and
    can be accomplished without a vast amount of Windows file system expertise.


    In contrast to Standard Minifilters, there are Isolation Minifilters. These Minifilters
    separate the view an application receives of a file, from the actual underlying
    data of that same file. Developing an Isolation Minifilter is more like developing
    a full Windows file system than developing a Standard Minifilter, because it requires
    close interaction with the Windows Cache Manager and Memory Manager. As such,
    the development of an Isolation Minifilter is not likely to be a task that can
    be successfully undertaken by most developers who do not also seek to become Windows
    file system experts.


    # Design & Code Reviews


    You’ve Written Code—Did You Miss Anything?


    Whether you’re a new Windows driver dev or you’ve written dozens of drivers before,
    it’s always hard to be sure you haven’t missed something. Windows changes, WDF
    changes, security issues emerge. Best practices are a moving target.


    Let OSR help! Our engineering team is 100% dedicated to Windows internals and
    driver development. Let us be the expert, second pair of eyes on your project…
    ensure it’s done right!'
