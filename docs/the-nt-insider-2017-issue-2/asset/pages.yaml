  img_proc: true
- pgno: 20
  md: '# Cleanup, Close and Cancel... (Cont.)


    (CONTINUED FROM PAGE 20)


    Our final definition is for Cancel. When a thread exits with pending I/O, or an
    application explicitly calls the Win32 function CancelIo or CancelIoEx, the pending
    I/O requests are Canceled. This results in WDF calling one of the driver’s Cancel-related
    Event Processing Callbacks, if one has been specified, for each Request to be
    canceled.


    Unlike Cleanup and Close, in which the operation takes place based on a specific
    File Object, Cancel operations are managed in Windows on an individual, specific,
    Request basis. A great feature of WDF is that it is designed to automatically
    assist your driver with Cancel processing. The chief way this does this is that
    when Windows Cancels a given Request, WDF will search all your driver’s WDF Queues
    for that Request. If it finds the Request that’s being Canceled on a WDF Queue,
    WDF will remove the Request from the Queue and, by default, complete the Request
    with STATUS_CANCELED and an information field of zero. This even applies to Requests
    that are on a Queue waiting to be presented for the first time to your driver
    (that is, Requests that your driver has not seen yet).


    Consider how this helps driver processing in our second example, in which an application
    exits with multiple Requests in progress. In this case, as the application exits,
    Windows will issue a Cancel operation for each I/O request that is still in progress
    when the application attempts to exit. When WDF receives this Cancel operation,
    it will search your driver’s WDF Queues for the Request being Canceled, and if
    it finds the Request, it will remove it from the Queue and complete it (with STATUS_CANCELED).
    If the Canceled Request was waiting on your driver’s Queue, and had not yet been
    presented to your driver for processing, the Request is removed from the Queue
    and completed without your driver ever having to deal with it. Once again, WDF
    makes driver writing easier, through its principle of “reasonable defaults.”


    Of course, you might not want Requests that you’re holding on a Queue to be automatically
    removed from the Queue and completed by WDF during Cancel processing. For example,
    this might be the case when your driver holds Requests on a Queue with Manual
    Dispatching while it’s waiting for a device to finish its work. In this case,
    your driver can elect to handle Cancel processing itself for that particular Queue
    by registering an EvtCanceledOnQueue Event Processing Callback for the Queue.
    If your driver has provided an EvtCanceledOnQueue Event Processing Callback for
    a Queue, whenever a Request on that Queue is Canceled, WDF will remove the Request
    from the Queue and call your driver’s EvtCanceledOnQueue Event Processing Callback
    with the handle to the Request being Canceled.


