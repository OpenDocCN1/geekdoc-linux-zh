    CANCEL: Request-dependent cancel function (either EvtRequestCancel or EvtIoCanceledOnQueue)
    | IRQL <= DISPATCH_LEVEL, in an arbitrary process/thread context |


    Figure 2– Summary of Cleanup, Close, and Cancel


    # When Should You Handle Cleanup?


    When WDF gets a Cleanup notification for a particular File Object, it calls your
    driver’s EvtFileCleanup Event Processing Callback if one has been specified. EvtFileCleanup
    has the following prototype:


    ```

    VOID EvtFileCleanup(

    _In_ WDFFILEOBJECT FileObject)

    ```


    Should your WDF driver implement Cleanup? If so, what should you do as part of
    Cleanup processing?


    The answer is simple for most drivers: In almost all cases you do not need to
    handle Cleanup – You therefore should not provide an EvtFileCleanup Event Processing
    Callback in your driver.


    Cleanup operations in Windows are designed for basic two purposes:


    +   1) As a quick notification to the driver that the calling application does
    not intend to issue any further I/O requests on the associated handle (remember,
    Cleanup happens on a per File Object basis);

    +   2) To provide the driver a "last chance" to perform any operations that need
    to be done in the context of the requesting application (as the application is
    indicating its intention to stop interacting with the driver via this specific
    open instance).


    As part of item 1, above, Cleanup can be used as a wholesale method of discarding
    a bunch of Requests that probably no longer matter to the application that issued
    them. WDF facilitates this by performing a Cancel operation on any Requests that
    were issued on the File Handle being closed and that are on a WDF Queue when the
    Cleanup is processed. The primary result of this is that any Requests from the
    Cleaned-up File Object that were on a Queue awaiting presentation to your driver
    will never reach your driver. WDF will remove them from the Queue and Cancel them,
    without your driver having to do anything.


    Item number 2, above, is slightly more interesting. Because EvtFileCleanup is
    called in the context of the process/thread that called CloseHandle, this Callback
    gives your driver the opportunity to tear down any context that it was maintaining
    on a per-process basis. For example, if your driver mapped some memory into the
    application’s virtual address space, the EvtFileCleanup Event Processing Callback
    is the perfect place to undo that mapping. This type of operation isn’t common.
    But it is one of the key uses of Cleanup in WDF. And, yes, before the expert readers
    raise an uproar, let me add that there’s more to mapping and unmapping memory
    into an application’s virtual address space than simply unmapping in EvtFileCleanup.
    I’m not attempting to address that here.


    It’s important to note that there’s also a nasty little detail inherent in Cleanup
    handling: Since handles are per-process entities, one thread in a process can
    be sending I/O requests on a handle (repeatedly calling ReadFile, for example),
    while another thread simultaneously calls CloseHandle on that same handle. If
    you think about this, you’ll realize that this means that it’s possible for


    (CONTINUED ON PAGE 23)'
