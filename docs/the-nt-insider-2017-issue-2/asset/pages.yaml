- pgno: 25
  md: '# Cleanup, Close and Cancel... (Cont.)


    (CONTINUED FROM PAGE 25)


    Assuming your driver does not provide a EvtIoCanceledOnQueue Event Processing
    Callback for your top-edge Queue (a safe assumption), WDF will remove from the
    Queue and terminate any pending Requests that were issued on the handle. Thus,
    the vast majority of Requests that were in progress will be terminated automatically
    by WDF.


    If you driver has a Request (and, it can only be one... the example uses Sequential
    Dispatching) in progress when the application calls CloseHandle, unless that Request
    is on a Queue when the Cleanup is received, that Request will remain in progress
    in your driver. Either your driver will complete it as part of its ordinary processing,
    or the Request will be canceled when the issuing thread exits. Either way, there''s
    no problem. And, whenever the last I/O operation is completed on the File Object,
    your driver''s EvtFileClose Event Processing Callback will be called, if you specified
    one.


    So, that''s what happens in our first example.


    In our second example, the application issued the same 100 reads, but instead
    of closing the handle it exited or was terminated.


    In this case, Windows first undertakes I/O rundown processing for the indicated
    thread. Windows will issue a Cancel operation for each of the in-progress Requests.
    Thus, as described previously, assuming you have not specified an EvtIoCanceledOnQueue
    Event Processing Callback for your top-edge, WDF will remove from the Queue and
    terminate each Canceled Request.


    If your driver is holding a Request in progress, and the Request is not guaranteed
    to complete quickly, you will have specified a per-request EvtRequestCancel Event
    Processing Callback by calling WdfRequestMarkCancelable. Within that callback,
    your driver will complete the Request with STATUS_CANCELLED.


    Of course, if your driver is holding a Request in progress, and the Request is
    absolutely guaranteed to complete quickly, your driver need do nothing more.


    # Already Know WDF?

    Writing WDF Drivers II: Advanced Implementation Techniques


    What our students say about this seminar:


    > It was great how the class focused on real problems and applications. I learned
    things that are applicable to my company''s drivers that I never would have been
    able to piece together with just WDK documentation.


    > A very dense and invaluable way for getting introduced to advanced Windows driver
    development. A must take class for anyone designing solutions!


    Next presentation:


    Amherst, NH (OSR) 15-18 January


    Thus, at the end of Cancel handling or very shortly thereafter, there will be
    no more I/O Requests in progress from the application to your driver.


    When all the pending Requests have been completed, Windows will issue a Cleanup
    (and WDF will call your driver''s EvtFileCleanup Event Processing Callback if
    one has been specified) and then a Close (and WDF will call your driver''s EvtFileClose
    Event Processing Callback if one has been specified). Unless your driver needs
    to tear-down some per-process specific state, it won''t have specified a Cleanup
    Callback. And unless your driver needs to tear-down per-handle specific state,
    it won''t have provided a Close Callback.


    # Now You Know


    Now you know the meaning of Cleanup, Close, and Cancel in Windows. You know how
    WDF helps you handle these operations. And you know, at least in general terms,
    what your driver needs to do to handle each of them.


    Hopefully you''ll never again be confused by these three similar sounding operations!


