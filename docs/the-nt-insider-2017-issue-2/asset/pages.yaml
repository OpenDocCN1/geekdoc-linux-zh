  md: '# FESF for Linux... (Cont.)


    [CONTINUED FROM PAGE 3]


    # Compatibility with Windows as a Bonus


    FESF for Linux is useful on its own, as the basis for a purely Linux product.
    However, it also has the advantage of being compatible with Windows.


    Because the On Disk Structure used by FESF for Linux is compatible with the one
    used by FESF for Windows, encrypted files are fully compatible between systems.
    Now you can create an encrypted document using Microsoft Word, and have it transparently
    decrypted on access, based on any policy you define. Make changes using LibreOffice
    Writer, save the document (transparently encrypted, of course), and send it back
    to your Windows colleagues. They can then open it with Word, where it will be
    automatically and transparently decrypted (assuming your policy allows this).


