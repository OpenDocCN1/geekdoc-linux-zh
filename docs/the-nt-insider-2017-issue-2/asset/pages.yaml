- pgno: 12
  md: '# Universal Drivers...(Cont.)


    (CONTINUED FROM PAGE 12)


    For UMDF 2 drivers, the difficulty of sticking to the Universal set of functions
    depends on how much Win32 you mix into your user-mode driver. If you stick to
    the WDF DDIs and a few supporting functions, you’ll have no problems at all. But
    the more “application-type code” you have in your driver, the more likely it is
    that you’re going to have to choose alternate APIs or re-write your code to work
    in a different way.


    Luckily, you don’t have to guess, or rely on MSDN, or even look through a long
    XML file, to check to see that you’re only calling Universal DDIs. There’s a utility,
    ApiValidator, that’s part of the WDK that you can elect to run as part of your
    build process. This utility checks to ensure that everything in your Solution
    is appropriately Universal (See Figure 2).


    To prove that creating a kernel-mode driver that sticks to the Universal set of
    DDIs is really as easy as I claim it is, I put my own code to the test. I rebuilt
    a reasonably complex KMDF device driver that I’ve been working on (two-way simultaneous
    DMA, several PIO type operations via more than a dozen IOCTLS, about 30 source
    files, and more than 10K NCSLs) that targets Win7 and later as a Universal Driver
    for Win10. There were no calls to any DDIs outside of the Universal DDI set.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_12_0.png)


    But Wait... There’s More: Declarative Install


    Building a driver that conforms to the Universal DDI set is good. It gets you
    most of the way towards true universal compatibility. But it’s not all you need
    to do.


    Let’s say you’ve written a pretty nice SPB driver and you’ve successfully targeted
    the Universal DDI set. Now, let’s say, you want to install it on a little single-board
    computer. Maybe it’s a Snapdragon 617 system, maybe it’s a board with an Apollo
    Lake processor. But, in any case, the system is running Windows IoT Core.


    You might have a great driver, but users have to be able to install it. Windows
    IoT core doesn’t have a standard Windows Explorer interface. In fact, it can run
    entirely headless. That means (CONTINUED ON PAGE 14)


    Figure 2 -- Select “Universal” for the Target Platform... Use APIValidator to
    Check Your Calls


    # We Know What We Know

    And...We Know What we Don’t Know


    We are not experts in everything. We’re not even experts in everything to do with
    Windows. But we think there are a few things that we do pretty damn well. We understand
    how the Windows OS works. We understand devices, drivers, and file systems on
    Windows. We’re pretty proud of what we know about the Windows storage subsystem.


    What makes OSR unique is that we can explain these things to your team, provide
    you new insight, and if you’re undertaking a Windows system software project,
    help you understand the full range of your options. AND we also write kick-ass
    kernel-mode Windows code. Really. We do.


    Why not fire-off an email and find out how OSR can help. If we can’t help you,
    we’ll tell you that, too.

    Contact: sales@osr.com'
