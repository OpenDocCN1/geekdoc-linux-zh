  md: '# Cleanup, Close and Cancel... (Cont.)


    (CONTINUED FROM PAGE 21)


    | Event | Resulting Operation | Callback Constraints |

    |---|---|---|

    | Last handle to a File Object closed | CLEANUP: EvtFileCleanup invoked; WDF issues
    a Cancel operation for any Request that is currently on any WDF Queue. | IRQL
