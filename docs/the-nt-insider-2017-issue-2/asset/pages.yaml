- pgno: 6
  md: '# Cleanup, Close and Cancel... (Cont.)


    progress, and if it were to free the physical memory the process was using including
    the application’s data buffers, the driver would have to finish the totality of
    writing on random memory and corrupting the system. That would be a very bad thing.
    As a result, *Windows will not allow the process to exit completely until its
    I/O operations are completed.* This prevents a driver from unintentionally corrupting
    memory by processing an ordinary Read Request. As a result, the behavior you see
    from the application is that the application won’t exit, and may even appear to
    hang, until the pending Requests are completed.


    So, when an application exits or is terminated, the question once again becomes:
    *What happens to the in-progress I/O Requests? How does your driver handle this
    situation?*


    # Cleanup, Close, and Cancel Defined


    The two problems we just described, closing a handle with I/O in progress and
    an application attempting to exit with I/O in progress, are two of the primary
    issues that Cleanup, Close, and Cancel are designed to manage. Let’s start with
    some basic definitions of each of these operations. In the next section, we’ll
    expand on these definitions and describe more about the specifics of how your
    driver can handle the operations.


    Event Processing Callbacks for Cleanup, Close and Cancel are all technically optional
    in WDF. That means, your driver will need to specifically opt-in to handle them.
    Cleanup and Close are File Object specific, so Event Processing Callbacks for
    these operations are related to WDF File Object handling. If, as you read this
    section, you feel like you need a quick refresher about Windows File Objects,
    see the sidebar **About File Objects** (below).


    Let’s start by discussing Cleanup. When the last handle to a File Object is closed,
    Windows issues a Cleanup request and WDF calls the associated driver’s *EvtFileCleanup*
    Event Processing Callback function. Because there’s almost always only one handle
    associated with a given File Object, as soon as an application calls *CloseHandle*
    (and synchronously from within that function call), WDF will call the driver’s
    *EvtFileCleanup* Event Processing Callback. *EvtFileCleanup* is always called
    in the context of the thread/process calling *CloseHandle*, and at IRQL PASSIVE_LEVEL.
    For a description of the unusual case when an apps call to CloseHandle may NOT
    result in an immediate Cleanup operation, see the sidebar entitled **About File
    Objects**.


    # About File Objects


    A File Object in Windows – the WDM data structure named FILE_OBJECT and the WDF
    Object WDFไฟLEOBJECT – represents a single, specific, open instance of a file
    or device. For example, when an application successfully calls CreateFile, a File
    Object is created that represents that open instance. If the call to CreateFile
    is successful, it returns a handle to this File Object, that the application uses
    to perform subsequent I/O operations on the file or device. The returned handle
    is a process-specific reference to a particular File Object.


    The File Object is the general I/O Subsystem object that is used to keep track
    of and manage I/O operations on a given handle. For example, when you issue sequential
    read operations to a file on disk without specifying a specific file offset, the
    file system uses the File Object to keep track of the next offset in the file
    to read. Each File Object is almost always associated with only a single handle.
    There are, however, some relatively rare cases (such as when the Win32 function
    *DuplicateHandle* has been used) when there can be more than one handle associated
    with a single File Object.


    You can read more about WDF File Objects, their properties, and the Event Processing
    Callbacks associated with them, in The NT Insider article *WDF File Object Callbacks
    and Properties Demystified*.


    Each time the application issues an I/O request using the File Object’s handle,
    the reference count on the File Object is incremented. Each time a driver or file
    system completes an I/O operation on a given File Object, the File Object’s reference
    count is decremented.'
