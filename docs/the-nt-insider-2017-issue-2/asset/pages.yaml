- pgno: 11
  md: '# # One Windows Everywhere, One Driver Everywhere

    ## The Scoop on Universal Drivers


    If you''ve been paying attention to the driver space at all since the release
    of Windows 8, you''ve probably noticed the term **Universal Driver**. What you
    may not know is what it means, why you should care, or how the Universal Driver
    concept is evolving, as the Windows platform and systems it supports evolve.


    # The Road to OneCore


    Back in the days before Windows 8, Microsoft began the task of componentizing
    Windows both at the OS level and the level of support APIs. It was a long and
    difficult journey. I''ll spare you the details, but an actual, componentized,
    version of Windows finally made its appearance as part of Win10 1607 (RS1, the
    Anniversary Update). The componentized OS is referred to as OneCore, and the componentized
    application support is referred to as OneCoreUAP (Universal Application Platform).


    What makes this interesting to driver writers is that, for the first time, there
    is now a single core Windows component that runs on all manner of platforms: Desktops,
    Servers, tablets, IoT appliances, Surface Hub, Xbox, and even phones. If you could,
    ah, *find* a Windows Phone. But that''s a different story.


    Because of Windows’ strong architectural underpinnings, devs can write a single
    driver that will potentially support a vast array of different hardware. No re-writes,
    no conditional code. Just retarget, rebuild, and you''re good to go.


    Sound good? Let''s talk about how you can get there.


    # Universal Driver DDIs


    Universal Drivers can be either KMDF, WDM, or UMDF 2 drivers. The primary constraint
    to writing a Universal Driver using one of these models is that you must restrict
    the functions your driver calls to those that are part of OneCore (for kernel-mode
    drivers) or OneCoreUAP (for user-mode drivers). These Device Driver Interfaces
    (DDIs) and APIs are identified in the MSDN docs as being supported by the "Universal"
    target platform. See *Figure 1* for an example.


    # Requirements


    | | |

    |---|---|

    | **Target platform** | Universal |

    | **Version** | Available starting with Windows 2000. |

    | **Header** | Wdm.h (include Wdm.h, Ntddk.h, or Ntifs.h) |

    | **Library** | NtosKrnl.lib |

    | **DLL** | NtosKrnl.exe |

    | **IRQL** | PASSIVE_LEVEL |


    For kernel-mode drivers, sticking to the universal DDIs is easy. In fact, it''s
    pretty hard to find a DDI that''s *not* Universal. When you do find one, it’s
    probably not a function you want to call (or should call) anyways. For example,
    when’s the last time you called **KeGetCurrentProcessorNumber**, eh? Well, it
    hasn’t worked correctly since the introduction of Windows 7 (with the introduction
    of processor groups). Anyhow, it’s a DDI that is not Universal. Interestingly
    enough, even lots of the DDIs that were long-ago relegated to NTDKK.H are part
    of the Universal DDI set. For example, **MmIsAddressValid** is one of those DDIs
    that doesn’t do what most people think it does, and was moved into NTDKK.H back
    in the stone age. But, it’s a Universal DDI. Yay. I think.


    The MSDN docs list a few surprising DDI families as *not* being Universal, such
    as the Remove Lock set of DDIs (**IoAcquireRemoveLock**, **IoReleaseRemoveLockAndWait**,
    and their friends). However, the good news is that MSDN appears to be wrong about
    these. There’s a file that’s part of the WDK that lists (in XML, for your convenience)
    all the Universal APIs and DDIs. That file is:


    ```

    `C:\Program Files (x86)\Windows Kits\10\build\universalDDIs\<arch>\UniversalDDIs.xml`

    ```


    In the case of the Remove Lock DDIs, the functions appear in the above XML file
    even though they’re listed in MSDN as not being Universal. The XML file wins.
    These functions are indeed part of the Universal DDI set.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_11_0.png)'
