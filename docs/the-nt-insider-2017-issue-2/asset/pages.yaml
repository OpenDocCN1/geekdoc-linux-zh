    \ of zero. As we also described earlier, one of the reasons this is so helpful\
    \ is that it automatically dispenses with Requests that are Queued but not yet\
    \ presented to your driver.\n\nIf your driver holds one or more Requests in progress,\
    \ but not on a Queue, then your driver will need to specify a EvtRequestCancel\
    \ Event Processing Callback for each of these Requests. Your driver does this\
    \ by calling WdfRequestMarkCancelable, specifying a Request handle and pointer\
