  md: '# Handling Cleanup, Close and Cancel in your WDF Driver


    Most of the WDF topics I write about suggest themselves to me as a result of a
    set of exchanges on our NTDEV list, or as a result of trends I see in driver code
    that I review or update. This time, I was inspired by both of these.


    There was a recent, and reasonably interesting, thread on NTDEV about the use
    of Cleanup and Cancel Event Processing Callbacks. Also recently, I had the opportunity
    to update two very different device drivers. One was a WDM driver that was written
    in the NT V4 timeframe. The other was a KMDF driver written by a new Windows driver
    developer shortly after the release of KMDF. While these two drivers were for
    very different types of devices, they had one thing in common: The developers
    of both misunderstood how to terminate in-progress Requests and used (or, rather,
    misused) Cleanup events in place of Cancel.


    That’s how I came to be motivated to write at length about Cleanup, Close, and
    Cancel handling in WDF drivers. An additional, private, motivation is that while
    we cover this topic in our Writing WDF Drivers seminar, we almost never have the
    time to talk about it in the level of depth that I’d prefer. So, I figured an
    article would be useful for many purposes.


    # Some Preliminaries


    The first thing to understand is that, at least in the driver world (as opposed
    to the file systems), you need to consider processing for Cleanup, Close, and
    Cancel together. This is because they’re often confused and processing for these
    functions often interact.


    Also, as we begin our discussion, please keep in mind that what we say here about
    Cleanup, Close, and Cancel is entirely specific to WDF. As in most things WDF,
    it is never a good idea to attempt to "map" from WDM to WDF (or vice-versa) in
    your head and expect to be able to figure things out. That way madness lies. The
    WDF Framework is its own I/O processing ecosystem. Sure, it interacts with WDM,
    but the rules for how WDF drivers work are established solely and entirely by
    WDF. Just because something works a certain way in WDM is no reason to believe
    the same is true for WDF.


    # The Problem


    Let’s start with a couple of simple examples of the problems that Cleanup, Close,
    and Cancel are designed to solve. I want to emphasize that these are just two
    random examples in which these operations can be useful. There are lots of other
    important uses for Cleanup, Close, and Cancel events that these two examples don’t
    address.


    Assume your driver has a single Queue that uses Sequential Dispatching. A user-mode
    application successfully calls the Win32 function CreateFile specifying FILE_FLAG_OVERLAPPED
    to allow it to do asynchronous I/O. The app then successfully calls ReadFile 100
    times from within a loop, specifying an OVERLAPPED structure each time. The result
    is that when the application’s loop is complete, there are 100 Read Requests pending
    in your driver.


    Now let’s say that application calls CloseHandle on the handle it used to send
    those 100 reads to your device. At least some of those 100 reads are still in
    progress. What happens to the in-progress I/O Requests? How does your driver handle
    this situation?


    As a second example, consider what happens when instead of closing the handle
    to your device when those 100 reads are in progress, the application exits or
    is terminated. As Windows begins termination processing for the app, your driver
    potentially has a pointer to one or more data buffers into which to return data
    into the application’s address space. You can see this in Figure 1.


    ![](img/feabf7ef0b3bb3419a0ef4d863642d48_5_0.png)


    In Figure 1, you can see a driver with a single WDFQUEUE that has two Read Requests
    queued (I didn’t want to put all 100 I/O Requests in the diagram). Each Read Request
    has (stored internally) a pointer to the data buffer into which the Read (output)
    data is to be returned.


    If Windows were to allow the Process to terminate completely with I/O requests
