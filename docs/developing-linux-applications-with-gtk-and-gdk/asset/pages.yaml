  md: '# Emitting Signals


    Signals can be emitted in GTK+ by using the gtk_signal_emit function or the gtk_signal_emit_by_name
    function. Usually, gtk_signal_emit is used within the widget because it has access
    to the signal table and knows the signal ID. The gtk_signal_emit_by_name uses
    the name instead of the signal ID and is primarily used outside the widget. The
    code for the GtkButton has a gtk_button_clicked function that can be called to
    emit the "clicked" signal. All it does is call the gtk_signal_emit function.


    void gtk_button_clicked (GtkButton *button)


    ```

    {

    gtk_signal_emit (GTK_OBJECT (button), button_signals[CLICKED]);

    }

    ```


    When a signal is emitted, it''s propagated to all the signal handlers. The propagation
    can be stopped by using the gtk_signal_emit_stop_by_name function in one of the
    signal handlers. Stopping a signal can be handy when you want to filter signals
    being propagated by a widget. For instance, you might want to filter certain keys
    being typed into the widget. You could create a "key_press_event" callback that
    calls the gtk_signal_emit_stop_by_name function to prevent the other signal handlers
    from getting the "key_press_event" signal when certain keys are pressed.


    # The init Function


    The init initializes a button instance for use. This step involves the initialization
    of data in the button''s data structure and sometimes creating other widgets.
    The GtkButton init function is quite simple because all it does is perform some
    initialization:


    static void gtk_button_init (GtkButton *button)


    ```

    {

    GTK_WIDGET_SET_FLAGS (button, GTK_CAN_FOCUS);


    button->child = NULL;

    button->in_button = FALSE;

    button->button_down = FALSE;

    }

    ```


    Other widgets may be a bit more complicated to initialize. The GtkFileSelection
    is quite a bit complicated when the widget is created, it has to create all the
    children widgets that are within the dialog box. The list box widgets and the
    button widgets are created within the file selection dialog box, making it (dialog
    box) much more complicated. If you''re creating a simple widget, then your initialization
    function will look more like the GtkButton''s widget.'
