    # Scrollbars


    Scrollbars are useful in a text widget. They are good instances when a user enters
    more text than the widget can display on the screen, surprisingly, seems to happen
    often. Although the text fits in the widget, a user may want to use the mouse
    to scroll through the data but find that it is difficult without scrollbars. The
    text widget is certainly more useful with scrollbars that allow the user to scroll
    through the text with the mouse.


    The scrollbars can be created and attached to the text control easily. The following
    code creates a text widget within a table and adds scrollbars to the edit control.
    A 2x2 packing table is created so that the text can be placed in it with the vertical
    scrollbar next to it on the right side and the horizontal scrollbar right beneath
    the text widget. In terms of the packing table, the text widget is in the upper-left
    corner (0–1,0–1) of the packing table. The vertical scrollbar goes in the upper-right
    corner (1–2,0–1) of the packing table, and the horizontal scrollbar goes at the
    bottom-left corner (0–1,1–2) of the packing table.


    ```

    /* ... Create the widget ... */

    table = gtk_table_new (2, 2, FALSE);

    ```


    ```

    /* ... Make it visible ... */

    gtk_widget_show (table);

    ```'
