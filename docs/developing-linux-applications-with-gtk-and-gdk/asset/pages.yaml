    # Inserting and Deleting Text


    Inserting and deleting text can be slow when a large amount of text is being inserted
    or deleted. The widget wants to repaint itself after every insertion or deletion
    of text and that is not always a good idea, especially when several strings are
    being inserted and deleted together. Sometimes the best approach is to suspend
    the painting of the widget until the insertion or deletion of text occurs. You
    can suspend automatic updating by calling the gtk_text_freeze function and restart
    updating by calling the gtk_text_thaw function. The gtk_text_freeze function is
    called before the updates to the widget are made. When the updates are complete,
    you use the gtk_text_thaw function to "unfreeze" the widget, which causes it to
    repaint if it changed while frozen. The code looks like this:


    ```

    /* Freeze the widget ... */

    gtk_text_freeze (GTK_TEXT (text));

    ```


    ```

    /* Put the updates here ... */

    ```


    ```

    /* Un-freeze the widget ... */

    gtk_text_thaw (GTK_TEXT (text));

    ```


    Failure to use the gtk_text_freeze and gtk_text_thaw functions when inserting
    and deleting a lot of text will cause the widget to repaint itself after every
    insertion or deletion. Instead of insert[text][insert[text][insert[text],paint],
    the widget would end up doing insert[text][paint][paint]. The two additional paints
    are unnecessary, because the widget is going to have additions operation that
    will call the widget to repaint further. It''s better to tell the widget not to
    update itself until all the insertion and deletion operations have been completed.
    This situation might happen if you used the editor to implement a search and replace.
    It would be better to freeze the screen while the updates were occurring and display
    the finished product, rather than to slow down the search and replace by having
    the widget repaint itself with the new text every time the text is fixed within
    the widget.'
