  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_270_0.png)


    # 11 Styles, Colors, Fonts, Cursors, and Referencing


    STYLES INFLUENCE HOW A WIDGET IS DRAWN using both colors and fonts. Each style
    consists of several colors and a single font. Styles are part of GTK+, but colors
    and fonts are part of the Graphics Drawing Kit (GDK). Although colors are part
    of the SDK, GTK+ has a color selection dialog box that can be used in applications
    to allow users to select colors. Likewise, the fonts have a GTK+ font selection
    dialog box for those applications that need it. These dialog box widgets are similar
    to the file selection dialog box and provide a common user interface for developers
    who want to enable users to select colors and fonts. The GDK also provides the
    capability to change the mouse cursor to a built-in cursor or a custom cursor.
    References help GTK+ keep track of widgets that are in use. GTK+ frees widgets
    that it thinks are no longer in use, and you want to prevent this action at certain
    times.


    # Styles (Colors and Fonts)


    Every widget in GTK+ has a style that determines how it is to be drawn on the
    screen. The basic style consists of a color scheme and a font. Applications in
    GTK+ typically share the same style, which is why all the widgets use the same
    color scheme and use the same font. A widget can have its own unique style, but
    it''s not necessarily a good idea to give every widget a unique style. Using many
    styles on a page to display widgets can distract from the application, especially
    if the widgets have different colors. It''s best to limit the styles to a few
    (or one) and spend the time working on the application''s functionality.'
