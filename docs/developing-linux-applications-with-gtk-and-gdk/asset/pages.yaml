  md: "# Chapter 5 Menus, Toolbars, and Tooltips\n\nEach data line defines a color\
    \ in the image.The header specifies how many characters (usually one) define a\
    \ single color.\n\nEach color data line has the character being defined, the character\
    \ c, and a hex value representing the color or None for no color (transparent).\
    \ The color value is in RGB format. In the preceding example, spaces represent\
    \ no color, the character B represents black (#0000000), Y represents yellow (#FFFFFFFF),\
    \ and y represents dark yellow (#99999999). The hex values representing the colors\
    \ here are 8-byte color values. A 4-byte color could be used instead. The darker\
    \ yellow would be represented by #999999 instead of #9999999900.\n\nThe image\
    \ immediately follows the color data. Using the defined color data, the image\
    \ can be seen as the \"open\" icon, which looks like a slightly open, yellow folder.\
    \ The spaces usually mean that no color is to be used, which makes it easy to\
    \ see the outline of the image in the code.\n\nDefining the image is just the\
    \ beginning. To use the image, you need to convert it into a widget so that you\
    \ can then treat the image like any other widget. You can create a function to\
    \ take the data and create a pixmap widget. To create a pixmap widget, you need\
    \ a GdkPixmap to pass to the gtk_pixmap_new function. Unfortunately, you can call\
    \ the GDK function gdk_pixmap_create_from_xpm, which takes the xpm data structure\
    \ and provides the mask as GdkPixmap.\n\n```\n/*\n * Convert an xpm string into\
    \ a pixmap widget\n * Uses (win_main) which is a global.\n */\nGtkWidget *CreateWidgetFromXpm(GtkWindow\
    \ *window, gchar **xpm_data) \n{\n    GdkBitmap *mask;\n    GdkPixmap *pixmap_data;\n\
    \    GtkWidget *pixmap_widget;\n\n/* --- Convert the string to a gdk_pixmap_create_from_xpm_d\
    \ --- */\npixmap_data = gdk_pixmap_create_from_xpm_d (\n    win_main->window,\n\
    \    &mask,\n    NULL,\n    (gchar **)xpm_data);\n\n/* --- Convert the pixmap\
    \ to a pixmap widget --- */\npixmap_widget = gtk_pixmap_new(pixmap_data, mask);\n\
    \n/* --- Make the widget visible --- */\ntk_widget_show(pixmap_widget);\n```"
