    # Summary


    You can now use more complicated widgets to make more interesting applications.
    The GtkTree widget displays information best described as being in a tree. The
    branches can be viewed, or they can be collapsed for viewing only the information
    that you want to see. The GtkNotebook widget is good for displaying multiple pages
    of user-driven or application-driven information. By hiding the tabs on the GtkNotebook,
    the widget becomes application driven. The GtkList widget is great for displaying
    multiple columns of information, usually from a database. Text and graphics can
    be mixed in the widget to make ordinary information more pleasant to view.'
