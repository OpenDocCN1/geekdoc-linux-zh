  md: "# Adding Signal Handlers\n\nTwo basic signals under GTK+ are delete_event and\
    \ the destroy signal. The delete_event signal is sent when a window is going to\
    \ be destroyed. The destroy signal is sent when the window is being destroyed.\
    \ The top-level window should have a callback for the delete_event because it\
    \ indicates that the user wants to shut down the application. Adding a callback\
    \ for the delete_event signal involves two steps.\n\nThe first step is to write\
    \ the callback, which this example calls destroyapp. The destroyapp function displays\
    \ a message to the screen and exits out of the event loop by calling gtk_main_quit.\
    \ The gtk_main_quit function must be called to break out of the application. If\
    \ the top-level window closes without exiting out of the event loop, the program\
    \ is still running processes, which is why the previous program had to be killed.\
    \ The delete_event callback should return a Boolean value that a TRUE keeps the\
    \ window open. Returning a FALSE value means that the window can be closed. If\
    \ the window can be closed, then the destroy signal is emitted to tell the application\
    \ that the window is being destroyed.\n\nThe second step is to register the event\
    \ handler with GTK+, using the gtk_signal_connect function. The gtk_signal_connect\
    \ function has four parameters. The parameters tell which widget the callback\
    \ is for, which signal is being handled by the callback, the function to be used\
    \ as the callback when the signal is sent, and any additional parameters to be\
    \ passed in when the signal is handled.\n\n```\n/* --- destroyapp when the window\
    \ gets 'delete_event' signal --- */\ngtk_signal_connect (GTK_OBJECT (window),\
    \ \"delete_event\",\ngtk_SIGNAL_FUNC (destroyapp), NULL);\n```\n\nNotice that\
    \ the window is being cast using GTK_OBJECT during the call to gtk_signal_connect.\
    \ The gtk_signal_connect expects a GtkObject to be passed in, and because GtkWindow\
    \ was derived from the GtkObject in the widget hierarchy, GtkWindow can be typecast\
    \ to GtkObject.\n\nThis code can be interpreted as follows: If the delete_event\
    \ occurs on the window door, then the function destroyapp with the fourth parameter\
    \ (NULL).\nHere is the whole program with the event handler added:\n\n```\n#include\
    \ <gtk/gtk.h>\n\nint destroyapp (GtkWidget *widget, gpointer data)\n{\n    g_print\
    \ (\"Quitting...\\n\");\n    gtk_main_quit();\n\n    /* ... Ok to be closed. TRUE\
    \ would prevent window ... **/\n    /* ... from closing ... */\n    return (FALSE);\n\
    }\n```"
