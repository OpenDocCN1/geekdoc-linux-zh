  md: '# Tooltips


    One nice feature that you can provide to users is the tooltip. Tooltips are those
    little pop-up text windows that appear when the mouse moves over and disappear
    when the mouse moves off the widget. They give users additional information about
    the widget; that is, a tooltip explains what a widget does. (Tooltips are especially
    useful if an incompetent artist is drawing your toolbar pictures.) Tooltips are
    mostly used with toolbars but can also be used with other widgets.You can create
    a tooltip with the gtk_tooltips_new function.


    ```

    /* Create tooltips ... */

    tooltips = gtk_tooltips_new ();

    ```


    After you create the tooltips, you can use the gtk_tooltips_set_tip function to
    add them to a menu item.


    ```

    /* Add the tip to a menu item ... */

    gtk_tooltips_set_tip (tooltips, menuitem);

    "An apple a day keeps the doctor away", NULL);

    ```


    You can make tooltips quite colorful by using the gtk_tooltips_set_colors function.
    By passing in a background and a foreground GdkColor, the colors on the tooltips
    can be modified.


    ```

    /* Change the color ... */

    gtk_tooltips_set_colors (tooltips, background, foreground);

    ```


    You can also set the delay on the tooltips using the gtk_tooltips_set_delay function.
    The tooltips can be disabled by using the gtk_tooltips_disable function and reenabled
    using the gtk_tooltips_enable_function.


    # Accelerator Keys


    Many people do not use the mouse to select menus, and they stick with keyboard
    shortcuts for many commands. Good developers keep these people in mind by creating
    keyboard shortcuts for the commonly used commands. Before accelerators are used,
    they need to be created and associated with a window.The gtk_AccelGroup_new_function
    creates the gtk_window_add_accelerator_table function associates the accelerator
    table with the window.


    ```

    /* Create the accelerator table ... */

    accel_group = gtk_accel_group_new ();

    ```


    ```

    /* Add the accelerator table to the application window ... */

    gtk_accel_group_attach (accel_group, Gtk_OBJECT (win_name));

    ```


