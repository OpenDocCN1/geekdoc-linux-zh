  md: '# Building GTK+ Application


    Although the preceding example may be a GTK+ program, it is not an application
    because it has no useful function and does not exist when you try to close it.
    You need to add some callbacks before you can call it an application.


    # GTK+ Data Types


    Before you start adding events to make the small application more robust, you
    need a little information about GTK+ widget types. Widgets in GTK+ are usually
    derived from other widgets. The button widget (GtkButton) is derived from the
    container widget (GtkContainer), which is derived from the generic widget (GtkWidget).
    All widget-connection functions return a pointer to a Gtkwidget, which is a generic
    pointer and may need to be converted for specific widget functions. The reason
    for deriving one widget from another is simple: if a widget performs most of the
    functionality of another, why spend the time and effort to write a new widget?
    A much easier solution is to derive the new widget from an existing widget and
    add the necessary functionality.


    Deriving widgets from each other can call out for several reasons. In writing
    C++ GTK+, C was chosen for GTK+ for several reasons. C++ is the primary language
    for developers on Linux. C is also more portable than C++ and it has been standardized
    longer. C++ is only becoming standardized, and not all C++ compilers work on the
    same set of code. When GTK+ was started, C++ standardization was still a pipe
    dream. but it still has some problems working across multiple compilers on multiple
    platforms (There are a couple of projects to wrap GTK+ in a C++ library—visit
    the GTK+ Web for more details).


    The GTK button-creation function returns a GtkWidget pointer, not a GtkButton
    function. This condition enables generic functions (like gtk_widget_show) to operate
    on all the widgets. The Gtkwidget returned from the GTK+ button-creation function
    can be typecast to a GtkButton (using the GTK_BUTTON macro) for button-specific
    functions because it is a button. The GtkWidget can also be typecast to a GtkContainer
    (using the GTK_CONTAINER macro) for container functions because the button is
    a container.


    Although the widget-creation function can be passed into one of the button-specific
    functions, the compiler complains if you pass it as a widget. Proper GTK+ programming
    requires that the be typecast to the proper type before calling a widget function.
    Every widget has a conversion macro to typecast a GtkWidget to any other GTK+
    widget type. A GtkWidget can be typecast to a GtkButton using the GTK_BUTTON macro,
    but only if the GtkWidget was created using the button-creation function or a
    widget derived from the button. The compiler will not complain, but the GTK+ library
    will complain when the program is run. The GTK+ functions check the type of widget
    being passed in, so passing in a button to a container function works because
    a button is a container, but passing in a container to a button function fails
    because containers are not buttons. These error messages are dumped to the console
    and are very helpful in creating an error-free application.'
