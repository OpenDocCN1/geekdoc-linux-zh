  md: '# Introduction to GTK+


    GTK+ STANDS FOR THE GIMP TOOLKIT, and GIMP stands for Graphical Image Manipulation
    tool. The GIMP Toolkit is a library used for developing applications with a graphical
    user interface (GUI). The library is currently used extensively to develop Linux
    GUI applications. The GIMP was developed with the GTK+ library and provides an
    example of a professionally developed GUI application. The GIMP is a free, open-source
    application available from www.gimp.org. The GTK+ library can also be used to
    develop applications on other platforms that support the GTK+ library. The GTK
    library is an object-oriented library written in C that supports applications
    written in several languages. The list of supported languages includes Ada95,
    C++, Eiffel, Objective C, Pascal, Perl, Python, and many more. The current list
    of language bindings is available at the GTK+ Web site, www.gtk.org.


    # What Are the Book’s Assumptions About the Reader?


    This book assumes the reader is familiar with the C programming language and knows
    a little about Linux. The reader should be comfortable with pointers and memory
    allocation. The reader should also be familiar with developing GUI applications
    and with event-based messaging. In short, this book is good for Linux developers
    who want to develop GUI applications.


    This book is also good for moving from other operating systems (like MS Windows)
    who want to develop GUI applications under Linux.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# What’s in this Book?


    This book covers the GTK+ library, including GLIB anding using C. This is not
    to say that everything in GTK+ is covered in this book. GTK+ is too large for
    a single book to cover the subject completely. This book is an attempt to get
    developers recognize GTK+ is a GUI toolkit for developing applications under Linux
    and other operating systems.


    The GTK+ library is free, or rather, it is open-source software, so the entire
    source code for the library is available for download. The only restriction on
    it is that all libraries created from the GTK+ library must remain under the open-source
    license.


    The license that GTK+ falls under is important. Because as long as developers
    are using it with source code available, any developer can fix bugs in the version
    of the library he or she is using, and submit the bug fixes to the maintainers
    of GTK+ for incorporation into the main branch. This approach turns many developers
    who use GTK+ into developers, and further enhances its stability and performance.


    # Where Can I Get GTK+?


    GTK+ can be downloaded from the GTK+ Web site at www.gtk.org. The version numbers
    are similar to Linux in the even numbers, 1.0 and 1.2, are the stable versions
    and the odd numbers, .99 and 1.1, are the development versions. Sometimes an additional
    number (1.0.5) indicates that bug fixes have been added to a version.


    # How Do I Build GTK+?


    To build GTK+, you need first to download GLIB and GTK+ from the GTK+ Web site.
    You need to build GLIB first because GTK+ uses GLIB for many of its internals.
    After building GLIB and installing it, you can build GTK+.


    # I’m a Novice—How Do I Build from Source?


    The GLIB and GTK+ packages can be built in a few simple steps. The files you download
    will be named something like GTK+-1.2.0.tar.gz—this is a tarred and gzipped file
    because the extension is .tar.gz. The file must first be gzipped using gunzip
    at the command line, like this:


    ```

    gunzip GTK+-1.2.0.tar

    ```


    The gzipped file is now a much larger tar file named something like GTK+-1.2.0.tar.
    This tar file can now be expanded into its directory structure by using the following
    command:


    ```

    tar xvf GTK+-1.2.0.tar

    ```'
  merge: -1
