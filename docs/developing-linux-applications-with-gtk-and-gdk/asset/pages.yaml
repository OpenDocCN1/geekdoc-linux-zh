- img_proc: true
  md: "# The Simple Clock Application\n\nThe first step required to make the clock\
    \ animation flicker is to listen for the expose_event and the configure_event.\
    \ The configure_event is sent when the draw-ing area is created or has its size\
    \ modified. This situation provides an opportunity to create a background buffer\
    \ that is the same size as the drawing area. If the window is resized, the configure_event\
    \ callback re-creates the buffer with the appropriate size.\n\n# configure_event\n\
    \nThe configure_event callbackcreates the background buffer so it can be used\
    \ to draw the clock without disturbing the image displayed on the screen. The\
    \ background buffer is going to be a pixmap, and you can create the pixmap with\
    \ gdk_pixmap_new function and get a pixmap with the same size as the drawing area\
    \ widget. If the size of the drawing area widget changes, the pixmap has to be\
    \ reallocated. The configure_event callback is called when the window is resized,\
    \ giving the opportunity to create a new background pixmap with a new size. Because\
    \ the pixmap is no longer needed, you can use the gdk_pixmap_unref function to\
    \ tell GTK that you are no longer referencing the pixmap and it can be freed if\
    \ no one is referencing it. The configure_event function ends by looking up like\
    \ this:\n\n```\nstatic gint configure_event(GtkWidget *widget, GdkEventConfigure\
    \ *event)\n\n  /* ... Free background if we created it ... */\n  if (pixmap) {\n\
    \    gdk_pixmap_unref(pixmap);\n  }\n\n  /* Create a new pixmap with new size\
    \ */\n  pixmap = gdk_pixmap_new(widget->window,\n                          widget->allocation.width,\n\
    \                          widget->allocation.height,\n                      \
    \    -1);\n\n  return TRUE;\n```\n\n# expose_event\n\nThe expose_event is actually\
    \ quite simple. Because you are drawing the clock onto the background pixmap,\
    \ the expose_event's only function is to copy the background image into the window\
    \ using the gdk_draw_pixmap. Using the expose_event also eliminates the second\
    \ problem with moving the clock: not repainting immediately after another window\
    \ is moved off the clock. Now, if a window is moved off the clock, the callback\
    \ hears the expose_event and copies the last known clock image (pixmap) into the\
    \ window. The expose_event is sent with the event parameter whose area field indicates\
    \ the area of the window that was exposed and needs to be redrawn."
  merge: -1
  pgno: 234
- img_proc: true
  md: "This is usually for cases where you have overlapping windows and you move one\
    \ off another window. The quickest solution is to redraw only the area that was\
    \ hidden beneath another window. For this clock, we would have to force the whole\
    \ clock to be redrawn. The entire expose_event function ends as follows:\n\n```\n\
    int expose_event(GtkWidget *widget, GdkExpose *event)\n{\n    /* --- Copy pixmap\
