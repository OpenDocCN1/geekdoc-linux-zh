  md: '# Building a GTK+ Application


    To build a GTK+ application, each part of the application file that uses GTK+
    function calls or definitions has to include the gtk/gtk.h file, which is the
    main include for GTK+. In addition, you must link with a number of libraries.
    Fortunately, the people developing GTK+ made task easy for you, using the gtk-config
    program. You can compile a simple GTK+ program with the following command line:


    ```

    gcc -Wall -g example.c -o example `gtk-config --cflags `gtk-config --libs`

    ```


    The quotes around `gtk-config --cflags` and the `gtk-config --libs` are usually
    single quotes. In this example, example is the program you are compiling, and
    the `gtk-config --cflags` actually runs the gtk-config program, which outputs
    the compiler flags and puts them into the command line. The linker flags are output
    with `gtk-config --libs` and are also inserted into the command line. The GTK-config
    program is included with GTK+ and must be in your path. Typing `gtk-config --cflags
    -libs` at a Linux prompt shows the exact parameters passed to the GNU compiler
    (gcc).


    # Initializing GTK+


    Writing a GTK+ program requires the GTK+ library to be initialized with a call
    to gtk_init function. The arguments to the application (argc, argv) are passed
    into the gtk_init function and parsed to look for one of the many GTK+ options
    that are primarily used for debugging. If any of the GTK+ parameters are found
    in the argument list, they are removed. They will never be seen by the application
    after the gtk_init function returns.


    ```

    /* Initialize GTK ... */

    gtk_init(&argc, &argv);

    ```


    After GTK+ is initialized, the rest of the GTK+ library functions can be called.


    # Creating Windows


    A widget in GTK+ is a GUI component. Windows, check boxes, buttons, and edit fields
    are all defined as pointers to a GtkWidget structure. The GtkWidget is a generic
    data type used by all widgets and windows in GTK+

    After the GTK+ library is initialized, most applications actually create a top-level
    window. Top-level windows have no parent window, because they are not contained
    within any windows. In GTK+ widgets have what is called a parent/child relationship
    in which the parent widget is the container and the child widget is the widget
    within the container. Top-level windows do not have parent windows, but they may
    be a parent for widgets.


    Creating a widget in GTK+ is a two-step process in which the widget is created
    and made visible. You can apply this technique to create a top-level window.'
