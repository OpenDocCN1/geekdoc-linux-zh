    \nThe CreatedDrawingArea function is called by the frontend.c code that creates\
    \ the application.This single block of code encapsulates everything required to\
    \ create the molecule drawing area without needing to worry about the application.You\
    \ can insert this function into any program without making changes.The drawing\
    \ area listens for the expose_event so that the window can be painted, and it\
    \ listens for the configure_event so that much of the configuration of the background\
    \ pixmap will be configured and ready to be painted on. You need to listen to\
