  md: "Chapter 7 Writing Calculator Application\n\n# CreateButton\n\nThe CreateButton\
    \ function creates a button in the packing table with a label. This function also\
    \ sets up an event handler for the button_clicked event. Notice that every button\
    \ uses the same button_clicked callback function. Rather than trying to extract\
    \ the label from the button to determine which button got it, it is easier to\
    \ configure the callback to receive the button's label as a parameter. When the\
    \ button_clicked callback is set up with the gtk_signal_connect function, the\
    \ button is passed in as the gpointer data value. When an event occurs on the\
    \ button, the callback function receives the information as the data parameter.\n\
    \n```\n/*\n* CreateButton\n* Create a button, assign event handlers, and attach\
    \ the button to the\n* table in the proper place.\n*/\nGtkWidget *CreateButton(GtkWidget\
    \ *table, char *szLabel, int row, int\ncolumn)\n{\n    GtkWidget *button;\n\n\
    \    /* Create the button ... */\n    button = gtk_button_new_with_label(szLabel);\n\
    \n    /* We care if the button is clicked ... */\n    gtk_signal_connect(GTK_OBJECT(button),\
    \ \"clicked\",\n        GTK_SIGNAL_FUNC(button_clicked), szLabel);\n\n    /* ...\
    \ Put the button in the table in the right place. ... */\n    gtk_table_attach(GTK_TABLE(table),\
    \ button,\n        column, column+1,\n        row, row + 1,\n        GTK_FILL\
    \ | GTK_EXPAND,\n        GTK_FILL | GTK_EXPAND,\n        5, 5);\n\n    /* ...\
    \ Make the button visible ... */\n    gtk_widget_show(button);\n\n    /* ... return\
    \ the button. ... */\n    return (button);\n}\nThe event handlers to process the\
    \ mouse and key press events must figure out which\nbutton was pressed and then\
    \ update the display in the calculator based on that button.\n```"
