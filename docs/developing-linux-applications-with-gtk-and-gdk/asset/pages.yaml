  md: '# Adding and Removing Pages


    The GtkNotebook is not useful without some pages on it. Pages can be added with
    the gtk_notebook_append_page function that adds pages to the end of the page list.
    The gtk_notebook_prepend_page function adds pages to the beginning of the page
    list, and the gtk_notebook_insert_page can insert a page anywhere in the page
    list. The widgets passed to these functions need to be created before trying to
    create the page. This step usually involves creating a label for the tab and some
    type of container for the child so that other widgets can be placed within it.
    To remove the pages, you can use gtk_notebook_remove_page.


