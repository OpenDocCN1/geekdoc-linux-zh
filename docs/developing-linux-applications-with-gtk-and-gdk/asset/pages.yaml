    subtree = gtk_tree_new ();

    ```


    ```

    /* --- Make the leaf parent to the subtree --- */

    gtk_tree_item_set_subtree(GTK_TREE_ITEM (leaf), subtree);

    ```


    ```

    /* --- Create a new leaf --- */

    new_leaf = gtk_tree_item_new_with_label (''leaf'');

    ```


    ```

    /* --- Add new leaf to the subtree --- */

    gtk_tree_append(GTK_TREE (subtree), new_leaf);

    ```


    ```

    /* --- Make new leaf visible --- */

    gtk_widget_show (new_leaf);

    ```


    The gtk_tree_append function is only one of the functions available to add items
    to a GtkTree. You can also use the gtk_tree_prepend function, which inserts at
    the beginning of a tree, or the gtk_tree_insert function to insert an item at
    any position within the tree.


    ```

    /* --- Add an item at the beginning of a tree --- */

    gtk_tree_prepend(GTK_TREE (tree) leaf);

    ```


    ```

    /* --- Add an item at beginning using insert --- */

    gtk_tree_insert(GTK_TREE (tree), leaf, 0);

    ```


    ```

    /* --- Add to end of tree using insert --- */

    gtk_tree_insert(GTK_TREE (tree), leaf, -1);

    ```


    ```

    /* --- Insert after the second element --- */

    gtk_tree_insert(GTK_TREE (tree), leaf, 2);

    ```


    To remove items from the tree, you can use the gtk_tree_remove_item function.
    When the item is removed from the tree, all the leaf nodes of tree are also removed.


    ```

    /* Remove the leaf from the tree --- */

    gtk_tree_remove_item (tree, leaf);

    ```


    To clear a tree of nodes, you can use the gtk_tree_clear_items function. The start
    and end leaf positions are passed in as indicators of which items are to be deleted.
    To remove all children:


    ```

    /* Remove all children from tree --- */

    gtk_tree_clear_items (tree, 0, -1);

    ```


    # Tree Signals


    The GtkTree widget has custom signals of its own. The "SELECTION_CHANGED", "SELECT_CHILD",
    and "UNSELECT_CHILD" signals are sent to the GtkTree widget to indicate the state
    of selected items. The tree items get the "COLLAPSE_TREE" and "EXPAND_TREE" signals.'
