  md: '# Add data into GtkClist


    Information can be appended in the GtkClist with the gtk_clist_append function.
    it takes the GtkClist and an array of strings as the parameters. The array should
    be the number of columns that are in the GtkClist.


    ```

    /* Adding a row of static data ... */

    char *szData = {"0123", "Eric", "123 Main St."};

    ```


    ```

    /* Adding a row of data to the clist ... */

    gtk_clist_append (GtkCLIST (clist), szData);

    ```


    In addition to appending to the GtkClist, the data can also be inserted at any
    position in the GtkClist by using the gtk_clist_insert function and passing in
    the index of where to insert the row.


    ```

    /* Inserting a row of static data ... */

    char *szData = {"0123", "Eric", "123 Main St."};

    ```


    ```

    /* Inserting the data after row 10 ... */

    gtk_clist_insert (GtkCLIST (clist), 10, szData);

    ```


    After the text has been added to the GtkClist, it can be modified with the gtk_clist_get_text
    function which takes a pointer to a string (char ** **) and populates it with
    the data in a particular row and column. If the pointer is NULL, the GtkCLIST
    widget is not populated. The function returns a nonzero value if it succeeds in
    populating the pointer. The text is not a copy and should not be directly modified.


    char *data;


    ```

    /* Change the data in an existing row/column ... */

    gtk_clist_set_text (GtkCLIST (clist), 3, 1, "Joe");

    ```


    ```

    /* Get the text ... */

    gtk_clist_get_text (GtkCLIST (clist), 3, 1, &data);

    ```


    # Removing Rows


    The rows can be removed from the GtkClist by using the gtk_clist_remove function
    and passing in the index of the row to remove. However, when removing all the
    items in the GtkClist, a faster method is to call gtk_clist_clear, which removes
    all the items from the GtkClist.


    ```

    /* Remove first row ... */

    gtk_clist_remove (GtkCLIST (clist), 0);

    ```


    ```

    /* Remove all the items from the list ... */

    gtk_clist_clear (CLIST (clist));

    ```'
