    # # The GtkClist Widget


    The GtkClist widget enables any number of rows and columns of data within it,
    and the columns can be set to any desired size. The GtkClist is frequently used
    to use database information where each row within the GtkClist widget is a row
    in a database, and each column within the GtkClist widget is a field in the database.


    The GtkClist is created with a fixed number of columns that cannot be changed
    once it has been set. The GtkClist widget must be destroyed and re-created if
    the number of columns in the widget changes. The GtkClist widget can be created
    with the gtk_clist_new function by passing in the number of columns needed for
    the widget, or it can be created using the gtk_clist_new_with_titles function
    that also takes an array of titles as parameter. You can use the gtk_clist_set_column_title
    function to set or modify the titles.


    ```

    /* Create a title with 3 columns */

    clist = gtk_clist_new (3);

    ```


    ```

    /* Give each column a title */

    gtk_clist_set_column_title (GTK_CLIST, 0, "Id");

    gtk_clist_set_column_title (GTK_CLIST, 1, "Name");

    gtk_clist_set_column_title (GTK_CLIST, 2, "Address");

    ```


    The shorter version of the preceding code follows.


    ```

    /* Define the titles */

    char *szTitles[] = { "Id", "Name", "Address" };

    ```


    ```

    /* Create the list with all titles in one shot */

    Clist = gtk_clist_new_with_titles (3, szTitles);

    ```'
