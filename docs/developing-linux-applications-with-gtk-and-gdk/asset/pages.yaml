  md: '# Eric Harlow holds a Bachelors of Science Degree in Computer Science from
    the University of Delaware. He started writing programs with the Vic-20 and has
    worked with various computers including the Amiga, Atari ST and the PC. His operating
    system experience includes UNIX, Windows, OS/2, and of course, Linux.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_514_0.png)


    He has developed everything from computer games to business applications and web
    sites.


    Eric is currently a consultant with RDA Consultants in Baltimore, Maryland. He
    develops client/server applications and web-based applications. When not earning
    a liking, he''s busy hacking Linux and Java. He advocates Linux solutions using
    his Linux based ISP as an example of the capabilities of the operating system.


    > Here''s what reviewers are telling us about Developing Linux Applications:


    “GTK and GTK+ will take Linux application development to the next level. Use of
    this API will speed up your development efforts considerably. Nonetheless, you
    need a good guide along the way. In this book, you will find that the author travels
    the road like a pro and shows you the shortcuts in order to help you avoid the
    dark alleys with aplomb. I highly recommend this title.”


    Christoph Bon, Coordinator of Research and Development, Objective Alliance'
