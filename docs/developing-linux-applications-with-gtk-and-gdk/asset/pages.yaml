    # References


    Everything in GTK+ involves allocating items. Styles are created or duplicated
    from existing ones. Widgets are created, and fonts are loaded and assigned to
    styles.

    Repeating this process over a long period would surely suck up all your computer''s
    memory—that is, unless you have an easy way to keep track of it. GTK+ keeps track
    of its memory usage by using references to the objects.


    A reference to an object what prevents it from being destroyed. Every time someone
    takes an object (say, a font) and associates it with another GTK+ object using
    the GTK+ routines, the object has its reference count updated upward. Every time
    the referencing object is destroyed, GTK+ takes all the objects it is referencing
    and decrements the reference count of those objects. If the reference count is
    zero, GTK+ assumes that the object is no longer needed and the object is freed.


    Most of this work is transparent and usually not a problem for small applications.
    Larger applications start to have memory leaks if you are not careful. When widgets
    are created, they start with a reference count of zero. When they are assigned
    to a container in some fashion, the reference count is incremented to indicate
    that the container is referencing the widget. If the container is destroyed, the
    container decrements the reference count of all the widgets it references—everything
    in the container. If the count is zero for any of the widgets, they are destroyed.
    This action makes sense because the widget should no longer be used at this point.
    Someone can prevent the widget from being destroyed by incrementing its reference
    count. By doing so, when the container is destroyed, the widget is still around.
    Of course, it''s useful unless you actually store the widget pointer somewhere
    to use it.


    Items that are not widgets treated slightly differently. When created, they automatically
    start with a reference count of one. These items usually represent styles, pixmaps,
    or some other reusable data that you want to allocate once and reuse throughout
    the life of the program. You don''t want the application to suddenly destroy a
    style you just created because the last widget was using it was destroyed.

    However, single-use items are frequently dereferenced after a creation like this:'
