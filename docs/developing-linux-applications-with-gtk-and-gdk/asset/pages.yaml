  md: "# The Calculator Program 135\n\nFor the mouse click events, the button that\
    \ the mouse event occurred on gets the event. For the key_press events, the button\
    \ that gets the event is probably not the button that the user wanted to press.\
    \ For instance, if the focus is on the \"3\" button and the user types a \"5\"\
    , the \"3\" button is going to get the signal that the \"5\" key was pressed.\
    \ Ideally, the key handling should be like the \"button_clicked\" signal where\
    \ the button that pressed gets the signal. (Press the \"5\" button should get\
    \ the signal that the \"5\" key was pressed.) In addition, if the user is using\
    \ the keyboard, the focus should change to the button that the user has typed.\
    \ In the previous example, the focus should change to the \"5\" button because\
    \ the \"5\" key was pressed. This action provides additional visual feedback to\
    \ the user and is more of an aesthetic issue than a programming issue.\n\nRather\
    \ than put a key_press event callback on the button, can put it on the application\
    \ window where the signal will end up it's not handled by the button with the\
    \ focus. The application window's key_press event callback will send a \"button_clicked\"\
    \ signal to the button by the key that was pressed.\n\nThe mouse click event and\
    \ the key_press event do the same type of processing. The key_press event handler\
    \ can take advantage of this condition by calling the same functions that get\
    \ called when the \"button_clicked\" signal is processed.\nThe key_press callback\
    \ is quite small because it only needs to figure out which button should be clicked\
    \ based on the key that was pressed. The callback looks up the key in the table\
    \ and tries to match the key to the string in the button label. This process compares\
    \ only a single character, so this doesn't work for more complicated functions\
    \ such as /x, which are hard to express in terms of a single keystroke. It does\
    \ work on the commonly used characters in the calculator, such as the digits and\
    \ the simple operations (+,-*/). After the button is found, the focus is shifted\
    \ to the button to provide visual feedback and gtk_button_clicked is called to\
    \ signal a clicked signal on the button.\n\n+   * key_press\n* Handle the button\
    \ \"key_press\" event.\n* Function looks for the keystroke in the calculator\n\
    * data structure and (if a match is found) presses the\n* button that matches\
    \ the keystroke for the user. It\n* keeps our code small because we only have\
    \ to handle the\n* button_clicked events. \n\n```\nvoid key_press (GtkWidget *widget,\n\
    \tgdkEventKey *event,\n\tgpointer data)\n\n{\n\tint nIndex;\n\n/* Search through\
    \ the buttons */\n    for (nIndex = 0; nIndex < nButtons; nIndex++) {\n```"
