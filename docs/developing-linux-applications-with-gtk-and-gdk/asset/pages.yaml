  md: '# minesweeper.c


    The game itself is an N × M grid of toggle buttons represented by the data structure
    typMinesweeperButton. Each button has a row (nrow) and column (ncol) in the grid
    and a flag that indicates whether it has a bomb underneath (hasBomb). In addition,
    a widget variable stores the toggle when it''s created, and a counter displays
    the number of bombs next to this square (the count is used only if the square
    does not have a bomb). A button reflects one of several states the button is.
    The button starts in the BUTTON_UNKNOWN state, but the user can change the state
    to BUTTON_FLAGGED by clicking on the right mouse button. This action also puts
    a flag on the button to indicate the state to the user. The BUTTON_DOWN state
    indicates that the button has been pressed. If the button had a bomb underneath,
    this state would cause the game to end. The final state (BUTTON_QUESTION) is for
    the user to mark a button as questionable. A question mark appears on the button
    to mark it at this time, although having a bomb underneath. This button state
    is not implemented here, although it is easy to add.


    Some recursion simplifies the coding. For instance, if the user clicks on a button
    without a bomb and the nearby bomb count is zero, it recursively opens the nearby
    squares as if the user clicked on them. If one of those squares has a zero bomb
    count, all the nearby squares of that square get opened.


    When the buttons are created, each one is given the same callback function for
    the button click. The callback data parameter is configured with the typMinesweeperButton
    array. Although the callback data is the data associated with the button that
    was clicked, the data contains the row and column of the button that can be used
    to figure out which buttons in the table are neighbors.


