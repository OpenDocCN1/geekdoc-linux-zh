  md: 'The Simple Clock Application 215


    # Drawable Area Events


    The two events that are important to a drawing area are the configure_event and
    the expose_event. The configure_event is sent to indicate that the drawing area
    has either been created or has been resized. The expose_event is sent when the
    drawing area needs to repaint itself. The expose_event is sent when the widget
    is drawn, when another window is moved off of it (exposing it), or by an application-generated
    repaint message.


