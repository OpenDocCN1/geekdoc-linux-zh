    # Dialog Boxes


    Dialog boxes are created using the gtk_dialog_new_function, which creates the
    basic dialog box with no buttons or text. The created dialog box has two packing
    boxes (hbox, action_area) where other widgets can be added. The box is used to
    place labels or other information, and the buttons are placed in the action_area.
    The plain-vanilla dialog box is not useful until you add a text widget or a button
    or is useless unless it conveys information to the user. The easiest way to make
    the dialog box useful is to display text with an "Ok" button. We can create the
    label and add it to the dialog box''s vbox packing using


