  md: '# Creating a Tree


    After you create the compare function, you can use it to initialize the tree by
    passing it into the g_tree_new_new.


    ```

    tree = g_tree_new (CompareNames);

    ```


    # Inserting Elements


    After the tree is created, you can add data into the tree. The compare function
    keeps the tree sorted. You add data into the tree with the g_tree_insert function,
    which expects the data to be passed in using a key/value combination. For example,
    you can add "Fred" to the tree and associate the value "Loud" with him this way:


    ```

    g_tree_insert (tree, "Fred", "Loud");

    ```


    # Looking Up Elements


    The g_tree_lookup function looks up the value in the tree. The key is passed in,
    and the value for the key is returned if it can be found in the tree. To look
    up the value of "Fred" that you just entered, call g_tree_lookup this way:


    ```

    sValue = g_tree_lookup (tree, "Fred");

    ```


    This statement returns "Loud" because it was the value you entered with the key
    "Fred".


    # Traversing the Tree


    Just as the hash and linked list types have a foreach function to traverse all
    the items, the tree has a function to traverse the tree, but in this case the
    function is a bit more complicated. The g_tree_traverse function has an additional
    parameter that determines how the tree is traversed. The tree can be traversed
    in order (G_IN_ORDER), preorder (G_PRE_ORDER), or postorder (G_POST_ORDER). Figures
    2.4, 2.5, and 2.6 illustrate the different ways to traverse a tree.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_36_0.png)


    Figure 2.4 Traversing a tree—in order.'
