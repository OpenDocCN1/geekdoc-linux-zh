  md: "# Progress Bar 123\n\nTo illustrate the progress bar, the following example\
    \ creates a window and a button in a window. When the button is pressed, the dialog\
    \ box with the progress bar is created using the StartProgress and updated every\
    \ 100ms using a timer.\n\n# Using a Timer\n\nThe timer is created using gtk_timeout_add.\
    \ The function takes an interval frequency, a function, and a data parameter.\
    \ The function passed into the gtk_timeout_add is going to be called using the\
    \ frequency passed in. The data parameter is going to be passed into the function.\
    \ For instance, the following function call:\n\n```\nptimer = gtk_timeout_add(100,\
    \ UpdateProgressTimer, data);\n```\n\ncalls the UpdateProgressTimer function every\
    \ 100ms, passing the data as the parameter. The return value is the timer ID and\
    \ is needed to end the timer. The gtk_timeout_remove function is used to end the\
    \ function from being called. The value passed is in the value returned from the\
    \ gtk_timeout_add function.\n\n```\ngtk_timeout_remove (ptimer);\n```\n\n# Testing\
    \ the Progress Bar\n\nThe entire program used to test the progress bar is as follows:\n\
    \n```\n/*\n * Application code begins here.\n */\n#include <gtk/gtk.h>\n\nint\
    \ ptimer;\nint nValue;\n\n/*\n * UpdateProgressTimer\n *\n * This is the timer\
    \ callback function. It updates the\n * progress bar and closes it when it reaches\
    \ the end.\n */\nUpdateProgressTimer (gpointer data)\n{\n    /* -- Increment value\
    \ ... */\n    nValue += 1;\n\n    /* -- Update the progress bar -- */\n    UpdateProgress(nValue,\
    \ 100);\n}\n```"
