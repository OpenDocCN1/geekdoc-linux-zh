  md: '# Text Widget 107


    Text widgets that are editors of some kind have to support the cut, and paste
    options. The text widget automatically supports the cut (Ctrl+X), copy (Ctrl+C),
    and paste (Ctrl+V) within the widget. However, many people tend to enjoy using
    the mouse to handle functions as copy, cut, and paste. You can implement these
    functions in the widget by calling the functions that handle the cut, copy, and
    paste functionality.


    The gtk_editable_copy_clipboard function copies the selected text from the widget
    and moves it to the clipboard. The text remains in the clipboard until needed
    or overwritten.


    ```

    /* ... Copy selected text and move to the clipboard ... */

    gtk_editable_copy_clipboard (GTK_EDITABLE (text), GDK_CURRENT_TIME);

    ```


    The gtk_editable_cut_clipboard function removes the selected text from the widget
    and moves it into the clipboard.


    ```

    /* Remove the selected text from the widget and put in the

    clipboard * */

    gtk_editable_cut_clipboard (GTK_EDITABLE (text), GDK_CURRENT_TIME);

    ```


    The gtk_editable_paste_clipboard function pastes the text from the clipboard and
    inserts it into the cursor position within the widget.


    ```

