  md: '# Chapter 10 Graphics Drawing Kit


    Each G routine takes at least two parameters—a drawable (GdkDrawable) area and
    a GdkGC. The GdkDrawable represents the area that is going to be drawn on, and
    the GdkGC contains color and font information as well as other drawing information.


    # Drawing Pixels


    The GDK provides routines to draw within a window and widgets (such as the drawing
    area). The simplest routine that is used is the gdk_draw_point for drawing a single
    pixel in the drawable area.


    ```

    /* Draw a point at 0, 10 ... */

    gdk_draw_point(drawable, gc, 10, 10);

    ```


    In this example and the others, drawable represents the area being drawn into
    and gc usually represents the color information. Later in this chapter, you learn
    how to get and set these parameters.


    # Drawing Lines


    The gdk_draw_line function can be used to draw a line between two points.


    ```

    /* Draw a diagonal line ... from (0,0)-(10,10) */

    gdk_draw_line(drawable, gc, 0, 0, 10, 10);

    ```


    # Drawing Rectangles


    The gdk_draw_rectangle function draws a box within the drawable region. The box
    can be filled, in a technique that is frequently used to erase a region of the
    screen that needs repainting. The first two numbers in the coordinates represent
    the upper-left side of the box, and the last two numbers in the coordinates represent
    the width and height of the box. The third parameter indicates whether the rectangle
    should be filled in. A value of TRUE indicates that the rectangle should be filled
    in.


    ```

    /* Draw a box on the screen (0,0),(20,20) */

    gdk_draw_rectangle(drawable, gc, FALSE, 0, 0, 20, 20);

    ```


    ```

    /* Fill in a box on the screen (10,10)-(30,30) */

    gdk_draw_rectangle(drawable, gc, TRUE, 10, 10, 20, 20);

    ```


    # Drawing Polygons


    Drawing odd shapes (like the shape of your head or an octagon) requires drawing
    many lines. Rather than using gdk_draw_line multiple times, it''s usually easier
    to use the gdk_draw_polygon function and pass in an array of points to connect.
    The first and last points in the array will be connected if they are not the same
    point. The polygon can be filled by setting the filled parameter to TRUE.


    Here''s one way to draw a triangle:'
