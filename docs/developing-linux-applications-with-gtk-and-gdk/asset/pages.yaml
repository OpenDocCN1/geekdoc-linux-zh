    # Notebook Widget


    Notebook Widget (GtkNotebook) makes it possible to display information in several
    pages where each page can be brought to the front by clicking on a tab that represents
    the page. Each tab has a description on it to allow the user to identify the page.
    The tabs can be on the top, bottom, left, or right of the page.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_430_0.png)


    Figure 14.2 Notebook widget.


    A GtkNotebook is created with the gtk_notebook_new function. Tabs are placed in
    one the GtkNotebook by using the gtk_notebook_set_tab_pos function and passing
    in one of the position values (GTK_POS_TOP, GTK_POS_BOTTOM, GTK_POS_LEFT, GTK_POS_RIGHT).


    ```

    /* --- Create the notebook --- */

    notebook = gtk_notebook_new();

    ```


    ```

    /* --- Put the tabs along the top of the notebook --- */

    gtk_notebook_set_tab_pos (GTK_NOTEBOOK (notebook), GTK_POS_TOP);

    ```'
