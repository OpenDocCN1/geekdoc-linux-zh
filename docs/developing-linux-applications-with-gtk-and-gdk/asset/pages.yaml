  md: "# Dialog Boxes\n\nThe CloseDialog button that is mapped to the \"OK\" button\
    \ calls the gtk_grab_remove function to release the modal mode that the dialog\
    \ box is in and then closes the dialog window. The dialog box's GtkWidget pointer\
    \ is passed in the data field because the callback doesn't know which dialog box\
    \ came from, just that it came from the widget. The gtk_signal_connect function\
    \ set up the passing of the dialog window into the callback, and here it is used\
    \ to close the dialog window.\n\n```\n/*\n* CloseDialog\n* Close the dialog window.\
    \ The dialog handle is passed\n* in the data.\n*/\nvoid CloseDialog(GtkWidget\
    \ *widget, gpointer data)\n{\n    /* -- Close it - -- */\n    gtk_widget_destroy(GTK_WIDGET\
    \ (data));\n}\n```\n\n```\n\n{\n```\n\nWhen the dialog window was created, the\
    \ gtk_grab_add function was called to make the dialog window modal. On closing\
    \ the dialog window, the gtk_grab_remove should be called to release the dialog\
    \ window grab. The \"destroy\" signal is the perfect place to do so because it\
    \ signals that the window is closing.\n\n```\n/*\n* ClosingDialog\n*\n* Calls\
    \ when window is about to close. Returns FALSE\n* to let it close. Releases the\
    \ grab which made the dialog\n* window modal.\n/\n```\n\n```\nvoid ClosingDialog(GtkWidget\
    \ *widget, gpointer data)\n{\n    gtk_grab_remove(GTK_WIDGET (widget));\n}\n```\n\
    \nSlightly more complicated examples are the \"Yes/No\" or \"Ok/Cancel\" types\
    \ of dialog boxes. They present the user with a message and provide a choice.\
    \ They are along the lines of \"Are you sure you want to do this?\" where the\
    \ dialog box case different things to happen. You can create these types of dialog\
    \ boxes by extending the previous example to give each button in the dialog box\
    \ its own event handler that can be passed into the function.\n\nNotice that both\
    \ the \"Yes\" button and the \"No\" button in the following example have the GTK_CAN_DEFAULT\
    \ flag set on. Consequently, one can be the default action for the dialog box.\
