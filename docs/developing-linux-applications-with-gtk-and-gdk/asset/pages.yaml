    The toolbar is the button that is being added to. The text is for textual buttons.
    This toolbar was defined as a graphical button, so this field is ignored. The
    tooltip_text defines the tooltip text displayed when the user moves over the button
    with the mouse. The tooltip_private_text can be ignored for now. The widget is
    usually a pixmap widget to put an image on the button. The callback is the function
    called when the button is pressed, and the userdata is the additional parameter
    to be passed into the callback function.


    You can use the CreateWidgetFrompm function created earlier to create a widget
    from the xpm data that you can create a button with an icon in it. Passing the
    pixmap adds to the toolbar.


    ```

    /* Create the "new" button on the toolbar ... */

    gtk_toolbar_append_item (GTK_TOOLBAR(toolbar),

    NULL,"New Window",

    CreateWidgetXpm (vbox_main, (gchar **) xpm_new),

    GtkSignalFunc) ButtonEvent,

    NULL);

    ```


    The toolbar displays the passed-in pixmap as the button''s icon. When the button
    in the toolbar is pressed, the Button function is notified so that you can put
    code in the function to perform processing. The standard approach here is to call
    the function as the menu "New Window" for the same event. The nice thing about
    the gtk_toolbar_append_item calls is that it also does the setup of the event
    handler and the tooltip ("New Window") without any additional calls. When you
    were creating a menu, you had to do each little step manually, so you created
    a function to do the work. Here, each has only one function, which makes the function
    easier to use.


    # Adding Other Items to the Toolbar


    The gtk_toolbar_append_element is similar to the gtk_toolbar_append_item function
    but more flexible and therefore more complex. Instead of just supporting plain
    toolbar buttons, the gtk_toolbar_append_element has support for buttons (GTK_TOOLBAR_CHILD_BUTTON),
    toggle buttons (GTK_TOOLBAR_CHILD_TOGGLEBUTTON), radio buttons (GTK_TOOLBAR_CHILD_RADIOBUTTON),
    and widgets (GTK_TOOLBAR_CHILD_WIDGET) and for creating gaps (GTK_TOOLBAR_CHILD_SPACE)
    between logical widget groups. The function adds two parameters: a type and a
    widget. The type parameter determines which kind of widget is inserted into the
    toolbar and whether the type is set to GTK_TOOLBAR_CHILD_WIDGET; then the widget
    parameter is used as the widget that is inserted.'
