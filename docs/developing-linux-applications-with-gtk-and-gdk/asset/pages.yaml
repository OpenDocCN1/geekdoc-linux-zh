  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_420_0.png)


    # # 14

    Trees, Clists, and Tabs


    The GTkTree, GtkList, and GtkNotebook are more interesting widgets than the common
    entry widgets. These three widgets show some of the power of developing applications
    using GTK+ widgets. The widgets provide an object-oriented interface and make
    developing applications with widgets easy. The three widgets discussed here are
    the more useful widgets in GTK+, but many others are available.


    # ## Tree Widget


    The tree widget (GtkTree) displays hierarchical information: a set of directories
    or perhaps a family tree showing your parents, their parents, and so on. Trees
    allow the entire hierarchy of items to be viewed, or items can be collapsed into
    their parent items within the tree.


    An example of the GtkTree widget with a list box to display directories and files.
    Only directories are displayed within the tree on the left. The subdirectories
    of each directory within the tree are displayed as leaf nodes that can be collapsed
    into the parent node. The list box displays the files within a directory when
    it is selected in the tree. You''ll create the following program as you learn
    about the tree widget.'
