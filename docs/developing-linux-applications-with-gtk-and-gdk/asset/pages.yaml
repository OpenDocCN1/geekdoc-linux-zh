  md: 'Widgets can be added to container widgets using the gtk_container_add function,
    and they can be removed using the gtk_container_remove function. Most container
    widgets allow only one child widget to be added. Some exceptions exist like the
    GtkList, but it serves the specific purpose of storing multiple items. If more
    than one widget needs to be in a normal container, packing boxes or packing tables
    are needed to hold the widgets.


    To iterate through the list of child widgets stored in a container, you can use
    the gtk_container_children function to return a linked list (GList *) of the child
    widgets. The alternative is to use a foreach function. The gtk_container_foreach
    function performs a function on each of the child widgets and a widget as a parameter.


    The gtk_container_border_width function controls the width of the border around
    the widget within the container. Setting this value to zero will provide the widget
    within the container with no border.


    # Summary


    Basic widgets involve creating and setting widget properties before the widgets
    are shown. Widgets have attribute functions, and most signal events that can be
    trapped by applications. The GtkLabel, buttons, GtkList, entry field, and combo
    box have been covered. These are the most commonly used widgets in applications,
    and understanding them is essential to understanding more complicated widgets.'
