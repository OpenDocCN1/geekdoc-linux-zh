    # Text Widget


    The text widget (see Figure 6.2) is similar to the entry widget (see Chapter 4,
    “Basic Widgets”), but the text widget supports multiple lines of text, making
    it ideally suited for an editor. In fact, later you explore the creation of an
    editor using the text widget. The text widget is considerably more complicated
    than the smaller widgets, as it has many attributes that can be set.


    The text widget supports a series of shortcuts, including the standard cut, copy,
    and paste shortcuts. These shortcuts are also supported by the entry widget because
    they’re derived from editable table. Here are some of the text widget shortcuts:


    Motion shortcuts:


    +   * Ctrl+A—Beginning of line

    * Ctrl+E—End of line

    * Ctrl+N—Next line

    * Ctrl+P—Previous line

    * Ctrl+B—Backward one character

    * Ctrl+F—Forward one character

    * Alt+B—Backward one word

    * Alt+F—Forward one word


    Editing shortcuts:


    +   * Ctrl+H—Delete character (backspace)

    * Ctrl+D—Delete forward character (delete)

    * Ctrl+W—Delete backward word

    * Alt+D—Delete forward word

    * Ctrl+K—Delete to end of line

    * Ctrl+U—Delete under line


    Selection shortcuts:


    +   * Ctrl+X—Cut to clipboard

    * Ctrl+C—Copy to clipboard

    * Ctrl+V—Paste from clipboard


    The text widget is virtually an editor right out of the box. Using the text widget
    to make an editor application does not take much work. You can see how easy the
    process is in Chapter 8, “Developing a Simple Word Processor,” when you use the
    text widget to make a small editor.'
