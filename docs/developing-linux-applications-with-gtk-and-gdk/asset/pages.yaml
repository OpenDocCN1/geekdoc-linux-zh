    \nFigure 2.3 Hash tables.\n\nHowever, this example is a bad hash function; words\
    \ like linux, linus, like, and list would end up with the same hash value because\
    \ the function computes the hash from the first two characters of the string.\
    \ A better hash function would make better use of the data to come up with a more\
    \ unique key. The next hash function uses the entire string to compute the hash.\
    \ This function takes a bit longer to run than the previous hash function.\n\n\
    ```\nguint HashFunction(gpointer key)\n{\n  char *sKey;\n  guint giHashValue =\
    \ 0;\n  int nindex;\n```\n\n```\nsKey = key;\n\n/* Some error handling ... */\n\
    if (key == NULL) return (0);\n```"
