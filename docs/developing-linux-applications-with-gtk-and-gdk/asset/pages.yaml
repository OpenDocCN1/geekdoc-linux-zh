  md: '# 2


    # GLIB


    THE GLIB LIBRARY IS A COLLECTION OF popular functions that are used extensively
    by GTK+. Linked lists, trees, error handling, memory management, and timers are
    just part of the library''s contents. This chapter discusses the most commonly
    used functions in the GLIB library. GTK+ requires the GLIB library and relies
    on it for portability and functionality. The GLIB library can be used without
    GTK+ for developing nongraphical user interface (GUI) applications.


    # Types


    Rather than using the standard types found in the C programming language, GLIB
    uses its own set of types. This approach makes porto to other platforms easier
    and allows the data types to change without requiring an application rewrite.
    Because GTK+ uses the GLIB data types and functions, in theory powering GTK+ requires
    GLIB be ported to the destination platform as well as the GDK library that GTK+
    uses. Porting applications across platforms requires a good deal of patience in
    addition to a portable design, especially for software ported between dissimilar
    platforms (Linux→Windows as opposed to Linux→UNIX).'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 2 GLIB


    GLIB uses many types that are slightly different from the standard C data types.
    What would be a char data type in C is a gchar in GLIB. Although the gchar may
    be defined as a char in the GLIB headers on the Intel platform, to preserve portability
    the two should not be used interchangeably. Many functions have a gchar as a parameter
    instead of a char * This is not significant, but it does require getting to. Some
    of the most common data type modifications are


    | C Types | GLIB Types |

    |--- |--- |

    | char | gchar |

    | short | ghort |

    | long | glong |

    | int | gint |

    | char | boolean |

    | void* | gpointer |


    Using the GLIB data types in the GLIB/GTK+ application ensures that the application
    will work when the implementation of the underlying data type (say boolean) changes.
    For example, the boolean data type could be defined as an int in a later release;
    using the boolean data type, instead of char, ensures that the application will
    simply compile cleanly.


    # Messages


    GLIB has four functions to display information, and each of them can be extended
    on-the-fly for GUI/non-GUI development. These four different functions have four
    levels of message handling from the unrecoverable error displayed by g_error to
    the standard output function g_print. Each message function displays a different
    type of message and can be passed a variable number of parameters, like the printf
    function.


    # g_error


    The g_error function displays a hard error in an application. It displays a message
    and aborts the program. This function should be used only for errors that would
    otherwise cause the program to exit. The g_set_error_handler function can override
    the behavior of the g_error function, but cannot prevent the g_error function
    from aborting.


    # g_warning


    The g_warning function displays a message that a recoverable error has occurred,
    the program can continue running. GTK+ uses this function to display programmer
    errors that were successfully handled. The g_set_warning_handler function can
    override the default behavior of the g_warning message.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# g_message


    The g_message function displays information not associated with an error. The
    g_set_message_handler function can override the behavior of the g_message function.


    # g_print


    The g_print function is mostly used for debugging. You can use the g_print function
    during development and override the behavior of the g_print function in production
    so the function does not display any message. This approach is quick and easy,
    and faster than going through your code to remove the debug. You can use the g_set_print_handler
    function to override the behavior of the g_print function.


    You can override each of the messaging routines by passing in the new handler
    function. The new message handler could pop up a window with the message log message/error
    to a file, or perform some other behavior. The behavior of the message function
    can be quickly modified in development to suit the needs of the developer.


    # Custom Error Handling


    This small example shows custom error handling. Passing in a parameter of normal
    uses the default messaging that comes with GLIB.


    ```

    [brainsharp messages]$ message normal

    Here''s a print

    message: Here''s a message

    ```


    ** WARNING **: Here''s a warning


    ** ERROR **: Here''s an error


    Aborted (core dumped)


    Passing in a parameter of surfer for the same program shows the default message
    functions now display the same a bit differently. Note, however, that the program
    still aborts when an error occurs, even though a custom error handler was installed.


    ```

    [brainsharp messages]$ message surfer

    Dude, Here''s a print

    Dude, ya got a message - Here''s a message

    Bad news Dude. - Here''s a warning

    Major wipe out, dude. - Here''s an error

    Aborted (core dumped)

    [brainsharp messages]$ exit

    ```'
