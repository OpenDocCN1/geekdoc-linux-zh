  md: '# Graphics


    The game has several graphical elements: a radar screen that shows all the units
    in the game, the main screen where most of the action occurs, sprites for each
    game piece, and some special effects. Each unit in the game is a pix loaded from
    .xpm data within the application. The game is double buffered to provide smooth
    animation. For every frame of the game, the entire screen is redrawn. First the
    background is cleared, next the units that are on screen are drawn, and then the
    radar is drawn—showing all the units. When all the drawing has been completed,
    the image is transferred from the background to the drawing area widget.


    The graphics in the main screen are drawn from pixmaps. The graphics in the radar,
    however, are drawn using colorful dots. Each color represents a different unit
    so that, after a while, spotting the various units is easy. Even the misses that
    the aliens fire and the explosions show up in the radar!


    # Artificial Intelligence (AI)


    Every unit in the game has its own priorities. The AI in this game is primitive
    but accomplishes the task of making it a challenge, especially when more units
    are added—and you can actually lose the game. (The collision detection for the
    player is disabled.)


    The game has only two units with AI, and they each try to accomplish specific
    tasks. The landers, which search for people to pick up, are programmed to move
    horizontally until they find someone. When the landers are directly above a human
    on the surface, they drop down and try to bring the person to the top of the screen
    where they (the aliens) can turn into mutants (see Figure 13.4). The mutants hunt
    down the player—they are programmed to move in a somewhat random fashion, but
    always toward the player.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_364_0.png)


    Figure 13.4 The hero shoots a pair of mutants—one is killed, and the other is
    about to die.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 352 Chapter 13 Sprites and Animation


    The AI for the mutant has one of four outcomes to move in the -x- direction—move
    away from the player, stay at the location, move toward the player, or move toward
    the player in a big leap. Fifty percent of the time, the mutant is moving toward
    the player. The mutant can still hop move backward in the chaotic motion, but
    the mutant moves toward the hero. The movement along the -y- direction is similar,
    but occurs only if the hero is in sight. Otherwise, the movement is random. The
    movement is programmed in the AIModule function. Each unit has a chance of firing
    at the player when he is within range. The mutants, of course, have a higher chance
    of firing.


    # Game Internals


    The game needs to keep track of all the specific units as well as their positions
    in the world. The game sprites and the mountains are the most important items
    to keep track of. The sprites are always moving in the game, and although the
    mountains don''t move, they appear to move as the hero flies around. Their position
    (relative to the hero) is changing, and the mountains that we get drawn on the
    screen change as the hero moves horizontally. Because the world "wraps around,"
    the code for computing distances and directions between units is a little complex.
    To make things simple, all units use the same data structure, although they don''t
    use every field.


    # Data Structures


    The two basic structures are the typeSprite data structure and the typeUnit. The
    typeSprite contains the pixmap information including the sprite mask, height,
    and width. The typeUnit data structure contains the information about all the
    units in the game. The player, the aliens, the missiles and the explosions are
    just typeunits. The typeUnit stores the unit type (LANDER, MUTANT, MISSILE, EXPLOSION,
    and so on), the coordinates of the unit, velocity, life and chance of firing on
    the player. The life aspect of the specific units probably needs a little explaining.


    The most of units is forever, or at least the unit object gets blasted, but some
    units have a life expectancy. For instance, missiles from the aliens eventually
    "die," so they''re given a life that decreases as the missile moves away from
    the unit until the life reaches zero and disappears. Explosions are similar in
    that they also have a life expectancy—except that the explosions are really small
    sprites thrown in many directions to simulate an explosion. A linked list keeps
    track of all units except the player/hero. This linked list contains the aliens,
    the missiles, and all


    # Mountains


    The mountains are generated to show motion when the aliens or people are not visible
    on the screen or have been destroyed. Mountains act as a reference point in the
    game to help simulate motion. They are generated by creating random peaks (x,
    y) and then use the peaks to build a list of points that make up the mountains''
    peaks and valleys.'
