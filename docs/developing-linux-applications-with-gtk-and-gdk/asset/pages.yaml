    # Displaying Text


    Text can be drawn in a drawable area with the gdk_draw_string function. The function
    requires the font in addition to the drawable widget and the GdkGC. Otherwise,
    it''s similar to the other functions.


    ```

    /* --- Display ''Hey!'' --- */

    gdk_draw_string (drawable, font, gc, 50, 50, "Hey!");

    ```


    The gdk_draw_text function does the same thing as the gdk_draw_string function
    except that the gdk_draw_text function takes string length as a parameter.


    ```

    /* --- Display ''Hey!'' --- */

    szMessage = "Hey!";

    gdk_draw_string (drawable, font, gc, 50, 50,

    szMessage, strlen(szMessage));

    ```


    # Drawing Pixmaps


    For the times when drawing lines and dots won''t do, the gdk_draw_pixmap allows
    you to copy an entire image onto the drawable area. This method is handy for copying
    images onto the drawable area. See the section "Eliminating Flicker" later in
    the chapter for more information on this handy function.


    ```

    /* --- Copy a 40x40 pixmap to the drawable widget --- */

    gdk_draw_pixmap (drawable, gc, pixmap, 0, 0, 0, 40, 40);

    ```


    # The Drawing Area Widget


    The drawing area is a very simple widget. Most of the widgets we''ve discussed
    are containers or properties associated with them. The drawing area widget has
    few of the properties that other widgets have. The widget has a size property
    that can be set with the gtk_drawing_area_size function, but that''s about it.
    The whole purpose of this widget is to provide an area to use GDK functions to
    draw in the widget. The widget is created with the gtk_drawing_area_new function.


    ```

    /* --- Create the widget --- */

    drawable = gtk_drawing_area_new();

    ```


    ```

    /* --- Size the widget appropriately --- */

    gtk_drawing_area_size (drawable, 200, 200);

    ```'
