  md: '# Developing GUI Applications


    NO SINGLE STANDARD FOR DEVELOPING GRAPHICAL user interface (GUI) applications
    under Linux is freely available—unless you count the X Window library, which is
    a very low-level library unsuitable for developing applications quickly. The Internet
    archives are filled with GUI toolkits designed to make application development
    easier, but none of these toolkits developed much of a following, and the Linux
    community fragmented.Things started to change when TrollTech (www.troll.no) developed
    a very good GUI toolkit Qt, which is great for developing Linux GUI applications.
    However, TrollTech''s licensing restrictions have prevented many developers from
    using its product. The Qt license states that developed applications must be free
    unless the developer purchases the commercial version of the Qt library. To me,
    this requirement is a restriction on the library, which prevents many commercial
    companies from using a good toolkit to develop Linux applications. Nevertheless,
    Qt is free for noncommercial use.


    Linux is released under the GNU General Public License (GPL), which permits anyone
    to take the source code, modify it, and redistribute it. Therefore, many believe
    that any toolkits that are used to develop Linux applications should also be under
    the GPL. This approach reduces both the need to rely on a commercial company to
    fix bugs, and the fear that developers have of giving any single entity too much
    control. This situation led to the development of the GIMP Toolkit (GTK+).'
