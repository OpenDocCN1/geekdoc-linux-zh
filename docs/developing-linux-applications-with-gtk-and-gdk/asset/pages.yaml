    # Creating a Text Widget


    Creating a text widget is done by using the gtk_text_new function and passing
    in a GtkAdjustment value that specifies the horizontal and vertical adjustment
    values. Usually, these can be passed in with NULL, and the default adjustments
    will be used. You can create the text widget with


    ```

    text = gtk_text_new (NULL, NULL);

    ```


    The text widget can be set to read-only by the gtk_text_set_editable function.
    The function sets the field to "read-only" if FALSE is passed in; otherwise, the
    widget is editable. The default setting is to allow editing.


    +   * Allow the text widget to be edited */

    gtk_text_set_editable (GTK_TEXT, (GTK_TEXT), TRUE);


    +   * Set the widget to ''read-only'' mode */

    gtk_text_set_editable (GTK_TEXT (text), FALSE);


    The cursor position can be set using the gtk_text_set_point function. The gtk_text_set_point
    function expects an index that determines where the cursor is positioned. The
    index is a character-based index. For example:


    +   * Set the cursor after the tenth character */

    gtk_text_set_point (GTK_TEXT (text), 10);


    The cursor position can also be queried using the gtk_text_get_point function.
    An index is returned that represents the offset into the text where the cursor
    is positioned.


    +   * Find out where the cursor is */

    nPos = gtk_text_get_point (GTK_TEXT (text));


    The text widget can be queried to find how many characters are in the widget by
    using the gtk_text_get_length_function. You can use the gtk_editable_get_chars
    function to get the text within the text widget. For instance, to get all the
    characters in the text widget, the following code would suffice:'
