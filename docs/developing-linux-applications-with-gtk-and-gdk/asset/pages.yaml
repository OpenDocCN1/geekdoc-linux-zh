    \    double y = atom->y;\n    double z = atom->z;\n\n    atom->tx = (x * lxx +\
    \ y * lxy + z * lxz + lxo);\n    atom->ty = (x * lyx + y * lyy + z * lyz + lyo);\n\
    \    atom->tz = (x * lzx + y * lzy + z * lzz + lzo);\n}\n```\n\n# Remainder of\
    \ the Code\n\nThe remainder of the code was taken from the previous chapters.\
    \ The misc.c code comes from Chapter 5, \"Menus, Toolbars, and Tooltips,\" and\
    \ helps build the menus and toolbar. The files1.c code is from Chapter 6, \"More\
    \ Widgets: Frames, Text, Dialog Boxes, File Selection Dialog Box, Progress Bar.\"\
    \ These modules required few (if any) changes to get them to work here. Changes\
    \ were made to files1.c to make it generic; it can now be used many times (a sign\
    \ of modular code, I do believe).\n\n# Summary\n\nThe molecule viewer is a more\
    \ complicated example of an application created with G. The molecule viewer shows\
    \ how user interaction works in a drawing area widget with the G. The viewer uses\
    \ mouse events to rotate the object. This chapter covered some of the low-level\
    \ events so you can respond to a user who is manipulating the molecule with the\
    \ mouse."
