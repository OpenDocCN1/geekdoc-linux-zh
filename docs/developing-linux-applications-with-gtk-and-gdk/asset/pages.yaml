  md: "# Chapter 12 Molecule Viewer Using GDK\n\nThe atoms should be sequential. The\
    \ 011 is the name of the atom—in this case the 0 is probably for oxygen. The position\
    \ of the atom is stored in the last three numbers on the line. They should be\
    \ the x, y, and z position of the atom in the structure.\n\n| ATOM | 011 | 1 |\
    \ 2.227 | 3.257 | 9.904 |\n\nThe atoms end with a line labeled TER, and the bonds\
    \ will follow. The CONNECT struct and contain an atom number and the atoms that\
    \ it has a bond with. For instance, the first line of the bonds is the following:\n\
    \n| CONECT | 1 | 9 | 12 |\n\nThis line indicates that atom 1 should be connected\
    \ to atoms 9 and 12. Atoms do not need to have bonds, but they usually do.\n\n\
    # Data Structures\n\nThe data structure for the atom (typAtom) stores the atom\
    \ name with two sets of coordinates and a list of atoms that it has bonds. Atom\
    \ structures have two sets of coordinates because the original coordinates are\
    \ stored well as the \"translated\" coordinates. The translated coordinates are\
    \ required because the object is going to be rotated around the axis—as the object\
    \ is rotated, the atoms appear to be in a different position in the three-dimensional\
    \ space. This new position is the translated position and is computed every time\
    \ the molecule is moved. The translated position reflects the position at which\
    \ the atom should be shown. Because every atom can have a bond with one or more\
    \ atoms, the typAtom stores below these bonds in a GList.\n\n```\ntypedef struct\
    \ {\n    char *szName;          /* ... Molecule name--- */ *\n    double x;  \
    \             /* ... Original coordinates--- */ *\n    double y;             \
    \  /* ... *\n    double z;               /* ... *\n    double tx;            \
    \  /* ... Translated coordinates--- */ *\n    double ty;              /* ... *\n\
    \    double tz;              /* ... *\n    GList *bondList;        /* ... Atoms\
    \ has a bond with--- */ *\n} typAtom;\n```\n\nThe bonds describe a relationship\
    \ between two atoms so that a link can be drawn between them. In addition, a flag\
    \ flags used the drawing. The bond should be drawn only once for each pair of\
    \ molecules.\n\n```\ntypedef struct {\n    typAtom *atom1;         /* ... First\
    \ atom in the bond --- */ *\n    typAtom *atom2;         /* ... Second atom in\
    \ the bond --- */ *\n    int bPainted;           /* ... painted --- */ *\n} typBond;\n\
    ```\n\nBoth the atoms and the bonds are stored in a static array. (I could have\
    \ made it more dynamic, but that would mean more work.) The Arrays make the atoms\
    \ easy to deal with when drawing."
