  md: 'The following restriction applies to containers in GTK+:The containers can
    have only one child widget, which is why, if you modify the earlier example to
    add two buttons into the parent window, only the first button is visible. A way
    around this restriction is to use packing widgets.


    # Packing Boxes


    Multiple widgets can be added to containers using packing widgets, which are also
    called packing boxes. Unlike button widgets, packing widgets are not visible on
    the screen; in fact, they are invisible containers that keep track of several
    child widgets at a time. The vertical packing box stacks widgets vertically, and
    the horizontal packing box stacks widgets horizontally. Vertical packing boxes
    are created with the gtk_vbox_new function, and horizontal packing boxes are created
    with the gtk_hbox_new function. After they are created, widgets can be added to
    the packing box using the gtk_box_pack_start function or the gtk_box_pack_end
    function. The gtk_box_pack_start function puts the widgets into the packing box
