  md: '# Menus, Toolbars, and Tooltips


    A GOOD FRONT END ON AN APPLICATION is sometimes as important as what is underneath.
    The user interface is the first thing most users see, and if the interface does
    not provide a quick and intuitive way for users to get at the functionality they
    need, the developer has not written a good application. Just as selling cars is
    as much as marketing as it is about engineering, the front end of an application
    is as important as the internal algorithms. Nonprofits, especially, are quick
    to judge an application based on its appearance and ease of use, not its algorithms.


    Users have become accustomed to well-designed menus to issue commands and to toolbars
    that provide quick access to commonly used functions. In this chapter, you design
    a small front end using the GTK+ functions. The front end includes a functional
    menu and a toolbar.


    # Starting Up


    The application''s top-level window should be created and have its characteristics
    set. Attributes such as window size, title, and border widget are commonly set
    on the top-level window. The application title is one item that should be set.
    The gtk_window_new function creates the top-level window, which can be used to
    set the characteristics of the application.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 5 Menus, Toolbars, and Tooltips


    ```

    win = gtk_window_new (GTK_WINDOW_TOPLEVEL);

    ```


    After the window is created, you can use the widget handle returned by gtk_window_new
    to set the window''s characteristics. The title enables the user to distinguish
    the window from other windows on the screen and should be as short as possible
    to adequately describe the window. The title is set using the gtk_widget_set_title
    function.


    ```

    gtk_widget_set_title (GTK_WINDOW, win), "Application title");

    ```


    If an application is some type of editor, the title should include the name of
    the file to remind the user what is being edited. Remember that several windows
    can be open at any point in time, and the title helps the user identify each window.


    The size of the window is determined by the size of the widgets within the window.
    Sometimes the size determined by the widgets is too small. The minimum size of
    the window can be set in advance with the gtk_widget_set_size function. If the
    created window is smaller than the minimum size, the size of the window is adjusted
    to the minimum. This statement sets the window down to 300 pixels by 200 pixels:


    ```

    gtk_widget_set_resize (win, 300, 200);

    ```


    The border of the window can be set with the gtk_container_border_width function.
    This example sets the border of the container to zero.


    ```

    gtk_container_border_width (GTK_CONTAINER, win), 0);

    ```


    In Chapter 3, "Developing GUI Applications," you learned how to make the window
    visible and how to listen for the "delete_event" signal; this step should be repeated
    for the application window. The "delete_event" signal indicates that the window
    is closed. When the window is ready, you can add GUI components to make the application
    look more professional.


    # Menus, the Hard Way


    Menus in GTK+ are widgets and behave like other widgets. The menu that people
    normally think of has two parts: a menu bar that spans the top of the window and
    several menus hanging off the bar. The menu bar is usually the top-most widget
    within the application window. The layering of the menu bar at the top of the
    window followed by the toolbar suggests that the menu should be inserted into
    a vertical packing box. The application''s vertical packing box needs to be created
    before you can work with the menu bar.


    ```

    /* Create the application vertical packing box ... /

    vbox = gtk_vbox_new (FALSE, 0);

    ```


    ```

    /* Add the packing box to the main window ... */

    gtk_container_add (GTK_CONTAINER (win), vbox);

    ```'
