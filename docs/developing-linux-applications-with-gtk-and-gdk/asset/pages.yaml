    # # 12

    Molecule Viewer

    Using GDK


    USING THREE-DIMENSIONAL GRAPHICS TO DISPLAY information is always an interesting
    topic to discuss. In this chapter, you build a .pdb file viewer to view a molecule
    in a drawing widget and use the Graphics Drawing Kit (GDK) to display the molecule
    (see Figure 12.1). This chapter makes use of some three-dimensional math to display
    the molecule. If you''re not familiar with the math, you can still pick up concepts—just
    ignore the math multiplication. If you''re interested in learning more about three-dimensional
    math, many good books discuss the theory of three-dimensional computer graphics.


    In addition to displaying the molecule, you also add code to allow the user to
    rotate the molecule. Options such as displaying the molecule in color and displaying
    the molecule with the atom text are also added to the application. To make the
    molecule rotate smoothly, this application uses double buffering.'
