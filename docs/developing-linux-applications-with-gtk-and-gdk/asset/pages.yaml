    the application control the page that is currently displayed is desirable. This
    situation is similar to a Microsoft application wizard that walks a user through
    a complicated procedure. A procedure may require the user to go through 10 steps,
    and it''s usually easier to display one step at a time on page. When the user
    has successfully accomplished a step, the application can switch to the next page
    for the next step.


