  md: '# 314 Chapter 12 Molecule Viewer Using GDK


    For this application, you want the GTK_POINTER_MOTION_MASK that informs you that
    the mouse events occur frequently when the user moves the mouse. But there is
    a small problem: If the machine is not fast enough to respond to the mouse events
    or the processing takes too long, the mouse events start to queue up. For example,
    this situation would occur if you had to draw a very large molecule that required
    a lot of processing power to compute and draw. In this case, the processing and
    drawing would continue even after the user stops moving the mouse (to clear out
    the event queue)—not a good thing to show. (To see this problem in action, use
    out the GTK_POINTER_MOTION_HINT_MASK, and on a slow machine, move one of the complicated
    molecules very quickly with colors, bounds, and labels showing. Keep moving the
    molecule for a few seconds and then stop.) A better way is to use the mouse hints.


    Normally, every mouse movement generates an event that can queue up and cause
    the application to appear sluggish as it struggles to clear the queue of mouse-movement
    events. A better way is to use the GMOTION_HINT_MASK, which allows the application
    to respond to mouse events at the application''s pace. The mouse-movement events
    do not queue up as the mouse moves; instead, a single mouse event is queued to
    indicate that the mouse has moved. Because the flag has been set, no information
    is provided in the event about where the mouse has moved. Instead, the application
    needs to query the mouse position using the gdk_window_get_pointer_function.


    The difference between normal mouse-movement events and using hints can be seen
    in a simple example. Suppose you write an application (say, a molecule viewer)
    that draws significantly more-complicated molecules with three-dimensional shading
    on the atoms. It works great on your whiz-bang, 600MHz, dual-processor machine—so
    you decide to make it available to the public on your Web page. A user with 16MHz,
    386SX computer downloads the viewer, hoping to analyze such complicated models.
    Now, suppose you have written the application using the standard mousemovement
    events. Your whiz-bang machine needs 1/100 of a second to draw the model as you
    rotate it. Everything works fine as you draw the model this way and that. On the
    386, the model takes 20 seconds to paint, and while the machine is painfully trying
    to draw the molecule, the user decides to draw the mouse around wondering the
    molecule hasn''t finished painting. After 20 seconds, the molecule finally gets
    painting, but what guess? There are (ahem) hundreds of mouse-movement events in
    the queue. Even if the user does nothing more, each of those events cause the
    machine to repaint, theoretically tying up the machine for minutes while they
    are painting. However, if the application uses mice instead of mouse-movement
    events, when the painting is complete, only a single event would be in the queue
    to indicate that the mouse has moved. A query would indicate where the mouse was
    moved, and it could be processed. Of course, this example is extreme, and anyones
    doing 3D graphics on a 386 is a nut.


    Next, to detect the fact that the user has pressed or released the mouse button,
    you need to set the GTK_BUTTON_PRESS_MASK and GTK_BUTTON_RELEASE_MASK flags.'
