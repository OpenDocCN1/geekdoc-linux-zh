    Linux supports several types of dialog boxes. Some are modal dialog boxes, and
    some are headless. Modal dialog boxes put the focus of the application on the
    dialog box and keeps it there so the user cannot use any other window until dialog
    box disappears. The only events that the application allows to be processed are
    for only the modal dialog box that disappears. In Linux the application may want
    to display modal dialog boxes to make sure that the user has viewed information
    or when the information in the dialog box is critical to moving to the next step
    in a series. Many times the File Selection dialog box is modal because the user
    has specified he or she wants to load a file. It makes no sense to do anything
    until the dialog has been selected and the user presses the "Ok" button or decides
    to cancel the dialog box by pressing the "Cancel" button. Figure 6.3 shows dialog
    boxes in action.


    Modal dialog boxes have no serial dependencies. A color chart might be displayed
    in a dialog box that gives the user a color choice. Other windows and dialog boxes
    can be displayed at the same time without dedicating the focus to the color dialog.


    The Popup function created here a simple dialog box and waits for the user to
    hit the "Ok" button. This is achieved by creating the dialog box, creating the
    label for the message and putting it in the dialog box, and creating the "Ok"
    button and putting it in the dialog box. The button has an event handler on it
    that closes the dialog box when it is pressed. This dialog box is a modal one
    because it calls the gtk_grab_add function. The function makes sure that the dialog
    box gets events.'
