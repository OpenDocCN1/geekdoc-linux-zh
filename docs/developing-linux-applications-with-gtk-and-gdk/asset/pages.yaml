  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_344_0.png)


    # Sprites and Animation


    THE GRAPHICS DRAWING KIT (GDK) CAN do more than just draw lines and boxes.

    With a little help, it can also perform tasks such as animation that can be used
    for games. GDK is not a high-performance library for writing games, so writing
    a game such as Doom or Quake is probably not a good idea. However, games that
    don''t have heavy performance requirements can use GDK.


    # Animation


    Animation in computer games is achieved by rapidly moving images around on the
    screen. The images are spaceships, people, or anything else that can represent
    the player and computer. These movable images are sometimes *sprites*.

    Animation works best when the images on the screen do not flicker. The best way
    to prevent flicker is to use double buffering (recall the example in Chapter 10,
    "Graphics Drawing Kit”). The animated sequences in this chapter use pixmaps because
    the format is familiar and because you can easily draw them with transparent areas
    on a background.

    These animated sequences involve three steps. The first step is to clear the background
    and draw the background scenery. The second step is to draw the images that are
    going to be animated. The third step is to transfer the painted scene to the window
    so it can be displayed.'
