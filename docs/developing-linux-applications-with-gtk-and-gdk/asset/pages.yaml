  md: '# Speeding Up Insertion and Deletion


    Just the text widget can have lots of data added to it, the GtkCList is a prime
    candidate for the display of large sets of data, especially database files. To
    speed up the process of adding and modifying information in the GtkCList widget,
    the GtkCList can be frozen, like the text widget, to prevent the updating of the
    data until the insertions or modifications to the GtkList widget have been completed.
    The gtk_clist_freeze function prevents updates to the widget from occurring until
    the corresponding gtk_clist_thaw function is called.


    ```

    /* --- the widget --- */

    gtk_clist_freeze (CLIST (clist));

    ```


    ```

    /* --- Do some processing --- */

    ```


    ```

    /* --- Unfreeze the list --- */

    gtk_clist_thaw (CLIST (clist));

    ```


    # Title Characteristics


    The title character in GtkCList has a few properties that can be modified for
    the application. For example, you can decide whether you even want to display
    the titles. The gtk_clist_column_titles_hide function hides the title bar; the
    gtk_clist_column_titles_show function shows the title bar. Instead of a title,
    the GtkCList can display a widget. The Gtk_clist_set_widget function allows the
    placement of any widget in the title bar and is a good way to display graphical
    images for the title bar.


    ```

    /* --- Hide the title bars --- */

    gtk_clist_column_titles_hide (GTK_CLIST (clist));

    ```


    ```

    /* --- Make the titles visible --- */

    gtk_clist_column_titles_show (GTK_CLIST (clist));

    ```


    ```

    /* --- Put a previously created pixmap as the title --- */

    gtk_clist_set_column_widget (GTK_CLIST (clist), 1, pixmap_widget);

    ```


    # Column and Row Parameters


    It''s going to be necessary to manually adjust the width of the columns when the
    GtkCList is created. The GtkCList has no idea how wide to make the columns and
    just guesses at column width using the title width. You can use the gtk_clist_set_column_width
    function to set the width of any column in the list. You can also set the row
    height by using the gtk_clist_set_row_height function, but unless you''re changing
    the font that the GtkCList is being displayed in or adding large graphics to the
    GtkCList,setting the row height shouldn''t be necessary. The row height can be
    changed by using the gtk_clist_set_row_height function.'
