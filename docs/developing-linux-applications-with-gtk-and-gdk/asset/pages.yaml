  md: "# Painting in Three Dimensions\n\nBecause the molecule is a three-dimensional\
    \ structure, you should try try to draw the molecule to provide the illusion of\
    \ three dimensions. One way to do so is not to make blatant mistakes when drawing\
    \ the molecule. A blatant mistake would be to draw the molecules without regard\
    \ to their apparent z-depth. This condition can cause the atoms that are further\
    \ away to appear above the atoms that are closer to the viewer. You can fix this\
    \ problem by sorting the atoms by their translated z-depth after they have been\
    \ translated into their new position. By first drawing the atoms that are far\
    \ away, you guarantee that the atoms that are closer to the viewer are on top\
    \ and not overwritten by the distant atoms. The painter's algorithm paints the\
    \ distant atoms first and covers them with the nearest items.\n\n# Source Code\n\
    \nAll the code that deals with the molecule.c file (with the exception of the\
    \ matrix math code) is in the molecule.c file. Reading, painting, and other molecule\
    \ manipulations go in the file. By modularizing this way, the code can be placed\
    \ within another application easily. Because most of the new code is in the molecule.c\
    \ file, we can go through the key modules and discuss the functionality of each\
    \ in turn.\n\n# ReadMolecule\n\nThe main routine to load in the file has to parse\
    \ two parts. The first atoms are read in the names and coordinates of the atoms\
    \ are pulled from the file. Then the bonds have to be read in and added to the\
    \ atom data structure as well as the bond array. The ReadMolecule is called when\
    \ the application starts and defaults to an existing molecule.c. The ReadMolecule\
    \ may be called by the File->Open menu, which allows other .pdb files to be read\
    \ in. When a new file is loaded, some of the data (such as the matrices) need\
    \ to be reset. The ReadMolecule routine also forces a repaint to occur after the\
    \ molecule is read.\n\n```\n/*\n * Read in a .pdb molecule with the given filename.\n\
    \ * Store the information in the data structures\n * defined.\n */\nvoid ReadMolecule(char\
    \ *filename)\n{\n    FILE *fp;\n    char buffer[120];\n    float x, y, z;\n  \
    \  int nIndex1;\n    int nIndex2;\n    char szName[120];\n    char *sTmp;\n```"
