  md: '# 10


    # Graphics Drawing Kit


    THE GRAPHICS DRAWING KIT (GDK) is a low-level drawing layer that sits between
    GTK+ and the operating-system-specific Application Programming Interface (API)—Xlib
    in the case of Linux. Because GTK has no direct interaction with the machine''s
    API, porting GTK+ should be a matter of porting GDK and GLIB. GDK provides the
    capability to do drawing down to a pixel level as fine as low-level window creation
    and manipulation functions. Using widgets is fine for many applications, but if
    you want to write an analog clock application using GTK+, it''s going to be difficult
    without the capability to draw a clock face. Using the drawing area widget with
    GDK allows you to draw whatever you want, instead of using the canned widgets.


    # Drawing Routines


    Using GDK routines to write an application is not much better than using Xlib
    directly. Fortunately, GTK+ provides a widget that you can use to create applications
    without the need to do manual drawing. The drawing area widget can be used like
    other GTK+ widgets and is flexible enough to create applications that are dependent
    on graphics. The advantage of this approach is that you can use GTK+ as well as
    GDK within the same application. GTK+ provides menus, toolbars, and other widgets
    to support the drawing being done within the drawing area widget. The GDK provides
    an API for drawing lines, pixels, boxes, circles, and more.'
