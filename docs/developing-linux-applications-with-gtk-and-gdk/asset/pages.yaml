    # Summary


    Styles consist of fonts and colors that help define what the widgets look like.
    Styles can be modified individually, or they can be made the default style for
    future widget creation. GTK+ also has a built-in set of cursors that can be used
    to modify the cursor within a widget—and you can easily create custom cursors
    to supplement the built-in cursors. Objects in GTK+ use referencing to keep track
    of their use and free the objects when the reference count is zero.'
