    Each widget has its own set of signals for which the developer can create a callback.
    The number of signals that each widget has associated with it depends on the complexity
    of the widget, but in general very few signals need to be handled within an application.
    The button widget is a good example of this. Although the button widget has many
    signals associated with it, the one usually worth putting an event handler on
    is the "clicked" event. It''s not that the other events are never used; it''s
    more that they usually aren''t used. Events can also be inherited, and you can
    see this characteristic when you look at some of the widgets that are inherited
    from the button widget.


    # Push Buttons


    Push buttons (GtkButton) are one of the simplest widgets available because their
    only function is to allow a user to click them. In a dialog, they usually display
    text such as OK or Cancel. The most important event to a push button is the "clicked"
    event, which indicates that the button has been clicked by the mouse. The "clicked"
    event is a combination of the button being pressed and released in a single motion.
    Usually, the button click causes some action to be performed whether it is to
    save a file or get rid of the dialog. See Figure 4.1 for an example of a button.


    Buttons are derived from containers (GtkContainer), so they share many characteristics
    of containers. An important characteristic is the capability to hold another widget.
    The text inside a GButton is really a label placed inside the button. A toolbar
    can be created from a row of buttons with images inside each button to display
    the function to the user. What appeared as first a boring widget, is seen now
    as a very flexible widget—so flexible that other widgets actually derive themselves
    from the GtkButton.


    The button can be created with or without text. The gtk_button_new_with_label
    function creates a button with a string caption. The gtk_button_new function creates
    a button with no child widget. This function can be useful if you want to create
    a button with a picture on it. Because you don ownt need the label, you can use
    the gtk_button_new function to create the button and add the picture to the button.
    The functions return a pointer to a GtkWidget, which can be converted to a GtkButton
    by using the GTK_BUTTON macro.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_64_0.png)


    Figure 4.1 Push button.'
