  md: '# Chapter 4 Basic Widgets


    Labels are lightweight widgets because a window is not created when the widget
    is created. Instead, the label is painted onto the parent widget. This process
    has the advantage of reducing overhead by not keeping track of another window.
    The down-side is that these widgets are limited.


    ```

    GtkWidget *label;

    char *buffer;


    /* Create a new label */

    label = gtk_label_new (_This is a label_);


    /* set the label text to a new value */

    gtk_label_set (label, _This is the new_label_);


    /* Get the label text */

    gtk_label_get (label, &buffer);

    ```


    The gtk_label_get function gets the reference to the text displayed within the
    label. You should not modify this string directly; instead, use the gtk_label_set
    function if you want to modify the text in the label. The reference to the text
    prevents the memory allocated for the text from being destroyed, so you should
    always dereference it if it is no longer being used.


    Because the label is derived from GtkMisc, you can use the gtk_misc_misc_alignment
    to modify the display of the text within the label. The function takes an x alignment
    and a y alignment value to compute where the text should be displayed. For the
    x alignment value, a zero (0) indicates that the text should be left-aligned.
    A 1 indicates that the text should be right-aligned. For the y value, 0 indicates
    that the text should be centered the x, and a .5 indicates that the value should
    be centered the y, and a 1 indicates that the text should be aligned on the bottom
    of the field.


    ```

    /* Right aligned, but vertically centered */

    gtk_misc_set_alignment (GTK_MISC (label), 1.0, .5);

    ```


    # Entry Widget


    The entry widget is a single-line entry field used for entering and displaying
    textual information. The entry widget is derived from the editable widget and
    is a slimmed-down version of the more complicated widget. The entry widget is
    still much more complicated than the button widgets or the label widget. The entry
    widget gets more functions associated with it than the button or label widgets.


    In Figure 4.5, an illustration and entry widget can be seen with a combo box and
    an option menu (described later in the chapter). The combo box looks very similar
    to the entry widget because the combo box uses an entry widget as well as other
    widgets.'
