    # # Developing a Simple Word Processor


    HIS CHAPTER FOCUSES ON USING THE MATERIAL covered earlier to put together a small
    word processor similar to the Notepad on Windows machines. Again, using an existing
    application as a design and trying to duplicate it is easier than writing it from
    scratch. The Windows Notepad enables users to edit simple text files and save
    them together a few but is otherwise quite limited in its capabilities. Still,
    it is a good application for putting together a few widgets to create a small
    and robust application.


    The notepad application (see Figure 8.1) illustrates many concepts of putting
    an application with widgets, including menus, toolbars, various dialog boxes,
    and an area used for editing the information. Again, the notepad is loosely based
    on the application that comes with Microsoft Windows. You can customize it to
    suit your needs, or you can just use it as a quick and small editor.


    The top-level menus consist of the menu titles "File," "Edit," "Search," and "Help."
    The "File" menu has a "New" menu choice to create new documents, an "Open" menu
    choice to load existing files, a "Save" menu choice to save the current document,
    and a "Save As..." menu choice to save the current document using another name,
    and a "Quit" menu choice to exit the save application. The "Edit" menu consists
    of the clipboard commands "Cut," "Copy," and "Paste." The "Search" menu has only
    a "Find" menu choice, and the "Help" menu has only an "About..." menu to display
    the author and version information.'
