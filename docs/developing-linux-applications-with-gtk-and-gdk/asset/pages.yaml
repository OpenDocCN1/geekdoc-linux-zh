- img_proc: true
  md: "The MoleculeRepaint function is then called to redraw the screen with the molecule\
    \ at\nthe new angle using the atom matrix.\n\n```\n/*\n* mouseDrag\n* Calculate\
    \ the new rotation of the molecule based on how\n* the user drags the mouse over\
    \ the molecule.\n\n* x - x position of mouse\n* x - y position of mouse\n*/nint\
    \ mouseDrag(int x, int y)\n{\n    /* Calculate the x difference ... */\n    double\
    \ xtheta = (prevy * y) * (360.0f / nScreenWidth);\n\n    /* Calculate the y difference\
    \ ... */\n    double yheta = (x - prevx) * (360.0f / nScreenHeight);\n\n    /*\
    \ Unit matrix ... */\n    unit(tmat);\n\n    /* Rotate by the -x- the mouse moved\
    \ ... */\n    xrot(tmat, xtheta);\n\n    /* Rotate by the -y- the mouse moved\
    \ ... */\n    yrot(tmat, yheta);\n\n    /* Combine into existing rotation to get\
    \ new rotation ... */\n    mult(amat, tmat);\n\n    /* Redraw with new rotation\
    \ ... */\n    MoleculeRepaint();\n\n    return TRUE;\n}\n```\n\n# frontend.c\n\
