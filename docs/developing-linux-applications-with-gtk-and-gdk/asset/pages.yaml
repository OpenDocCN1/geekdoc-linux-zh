  md: "If the drawing area is configured with hints, then event->is_hint will be true\
    \ and\nmouse position will be queried every time the motion_notify event is called.\n\
    \n```\n/*\n * motion_notify\n * Called when the user moves the mouse on the screen\n\
    \ */\nint motion_notify(GtkWidget *widget, GdkEventMotion *event) {\n    int x,\
    \ y;\n    GdkModifierType state;\n    /* If it's a hint... (combining several\
    \ events) --- */\n    if (event->is_hint) {\n        /* Get new position ... */\\\
    n        gdk_window_get_pointer(event->window, &x, &y, &state);\n    } else {\n\
    \        /* Get new position --- */\\n        x = event->x;\n        y = event->y;\n\
    \        state = event->state;\n    }\n    /* If the mouse button is down ...\
    \ */\\n    if (state & GDK_BUTTON1_MASK & g->pixmap != NULL) {\n        /* Calculate\
    \ the mouse drag effect on the\n           molecule.\n        */*/\n        mouseDrag(x,\
    \ y);\n    }\n    /* Keep track of the position of the mouse ... */\\n    prevx\
    \ = x;\n    prevy = y;\n    return TRUE;\n}\n```\n\n# mouseDrag\n\nThe mouseDrag\
    \ function recomputes the matrix that rotates the molecule. Recall that\nevery\
    \ atom has a position (x, y, z) that was read in the .pdb file and a translated\n\
    position that is used to draw the molecule. The two come together as follows.\
    \ The\nmolecule is rotated by multiplying the original atom position by the atom\
    \ matrix (amat)\nto get the new translated positions. The atom matrix is adjusted\
    \ to reflect the mouse\nmovement. A new matrix is created (mat) and is adjusted\
    \ to reflect the mouse dragging\non the x- and y-axes. This new matrix is then\
    \ multiplied by the atom matrix that\n the atom matrix to reflect the mouse dragging\
    \ changes. The original matrix co-\nordinates are pumped through the atom matrix\
    \ to generate the translated atom positions."
