  md: 'This command creates the directories required to build the library. Go into
    the directory that was created and type

    ./configure


    to run the configuration utility. It builds a makefile that you can use to build
    the library. If it runs without errors, then you can just type

    make


    to build the library. The library needs to be installed, but you need to be root
    or have someone with the proper permissions install the library. The command to
    install the libraries on your system is

    make install


    You may need to run /sbin/ldconfig on your system to get the libraries recognized.
    Of course, GLIB needs to be built and installed before GTK+ is built and installed.


    # What’s Required to Run the Examples?


    The examples were compiled on a 2.0 version of Linux using the 2.7.2 gcc compiler.
    The egcs compiler has not been tested, but it should work on the examples. The
    examples work on GTK+ 1.1.5 and should work on GTK+ 1.2. Many of the examples
    will not work on GTK+ 1.0.x without some modifications to the source code. Assuming
    everything is configured correctly, you should be able to go into one of the sample
    directories and type make to create the programs.


    # Where Can I Get the Sample Programs?


    For those not interested in spending the day typing in the examples, they can
    be downloaded from the following URL:

    http://www.mcp.com/product_support/


    Type in the ISBN of this book (073570214) in the dialog box provided. All the
    code required to build the examples is available. All that''s needed is GTK+ 1.2.


    # Where Can I Get More Help?


    In addition reading the book, you can turn to several places for help. The GTK+
    Web site has a tutorial and a few sample programs for GTK+ in addition to other
    GTK+ applications that can be used to learn about GTK+. Included with the sources
    to GTK+ is a directory of examples that contains sample applications on different
    aspects of GTK+. A testGTK+ application is included with the GTK+ sources and
    can be used to test each widget in GTK+. The testGTK+ application is valuable
    when the documentation for a particular widget cannot be found, because it has
    probably been coded in the testGTK+. Of course, the GTK+ source code is always
    available for the adventurous.'
