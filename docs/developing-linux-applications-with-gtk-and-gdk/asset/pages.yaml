    # The Color Selection Dialog Box


    The color selection dialog box provides a standard way for a user to select a
    color. It is similar to the way the file selection dialog box provides a standard
    interface for users to select files. The color selection dialog box has several
    widgets to help the user pick a color (see Figure 11.2).


    ![](img/0c25d93d8fa983d9a11557943feed9d0_282_0.png)


    Figure 11.2 Color selection widget.


    The color selection dialog box is created with the gtk_color_selection_dialog_new
    function.The OK and Cancel buttons on the dialog box can have callbacks on them
    to handle the button events.


    ```

    /* --- New dialog box --- */

    window = gtk_color_selection_dialog_new("Color Selection Dialog"););

    ```


    ```

    /* --- Want to know when ''ok'' button pressed --- */

    gtk_signal_connect (

    GTK_OBJECT (GTK_COLOR_SELECTION_DIALOG) (window)->ok_button,

    "clicked",

