  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_184_0.png)


    # 9


    # Minesweeper


    MINESWEPER IS a SIMPLE GAME that became popular when Microsoft included it with
    Windows. The idea of the game is to uncover all the squares on the board that
    do not have bombs underneath. Although the first few choices are pretty random,
    the uncovered squares provide clue to assist you in defusing the rest of the squares.
    Each square “knows” how many bombs are in the adjacent squares, uncovering a square
    that has no bomb provides a clue to help you figure out which of that square''s
    neighbors might be harboring a bomb. Of course, to make it interesting, a timer
    tells how long you''re taking, so that once you clear the board, the challenge
    is to clear the board in less time. The Minesweeper playing field is shown in
    Figure 9.1.


    Minesweeper reinforces most of the topics we''ve discussed already. In fact, the
    basics of the minesweeper application look a like the calculator application.
    They both use buttons in a packing table, but minesweeper is a bit more involved
    than the calculator. Minesweeper features a menu with some choices about game
    complexity (beginner, intermediate, and advanced), and a toolbar that displays
    a timer and the number of undiscovered bombs. It also uses xpm images for the
    bombs, the smiley button, the colorful digits, and the flags.'
