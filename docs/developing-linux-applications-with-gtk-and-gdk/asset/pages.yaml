    \ is retrieved.\tkWidget *radio;\nGList *group = NULL;\n\n```\n/* -- Create the\
    \ radio button and add to the group --- */\n/* --- if group is NULL, a new group\
    \ is created --- */\nradio = gtk_radio_button_new_label(group, szLabel);\n```\n\
    \n/* Get the group from the button. The group is a linked list\n* of the buttons\
    \ - and the group changes since elements are\n* added to the head. Always get\
