  md: 'Using a single function makes the code easy to read. In addition, it is easy
    to change the code later because the code that does the menu creation is all in
    one place. This function could be expanded by moving the data into a structure
    and reading the information from the structure, but that''s left as an exercise
    to the reader.


    # Item Factories (The Easy Way)


    Menus can be created easily using the item factory (GtkItemFactory). The item
    factory uses a prefilled structure as the basis for the menu. The structure consists
    of five parts—the menu path, the accelerator, the callback, the extra parameter
    to the callback, and the flags that indicate what the item is. The flags can be
    any of the following:


    +   - <Title>. Creates a title item.


    +   - <Item>. Creates a simple menu item.


    +   - <CheckItem>. Creates a check menu item.


    +   - <ToggleItem>. Creates a toggle menu item.


    +   - <RadioItem>. Creates a radio menu item.


    +   - <Separator>. Creates a separator to separate items in the menu.


    +   - <Branch>. Creates an item to hold submenus.


    +   - <LastBranch>. Creates a right-justified item to hold submenus.


    Using NULL, or ** for the flag just creates a simple menu item.

    For instance, a "New" submenu in the "File" menu might have the following line
    to define one menu item:


    ```/File/New, <control-N>, FileNew, NULL, 0 ```


    /File/New is parsed to identify the path. In this case, the first slash indicates
    the root menu or the menu bar, and "New" is the menu item within the "File" menu.
    The "control-N" indicates that the accelerator key to call this is the Ctrl+N
    sequence. Accelerators can use <shift> sequence <shift-b> to indicate that the
    key is pressed or an <alt+q> sequence to indicate that the alt is pressed. The
    callback is a standard callback function that is called when the user picks the
    menu using the mouse or hits the accelerator sequence. The extra parameter field
    is passed in when the callback is called: Setting it to NULL passes a NULL. The
    callback for the item factory is a bit different from the table, the callback
    action, and the widget—is called with the callback data from the table, in that
    order.


    # Coding the Item Factories


