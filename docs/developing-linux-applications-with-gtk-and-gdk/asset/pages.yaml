    # System Monitor


    We''re going to reuse some of the earlier code to create a little program that
    monitors the machine and displays a graph showing the state of the CPU and the
    ethernet connection (see Figure 10.4). The only problem is how to get information
    about the system.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_241_0.png)


    Figure 10.4 System monitor.


    # Using the /proc File System


    Much of the information available about Linux is available from the /proc file
    system. The "files" in the /proc directory can be opened and parsed like ordinary
    files and provide plenty of information about the machine. For instance, the /proc/loadavg
    file has information about the CPU load. If you''re curious about other files,
    you can type in man proc to get a summary of all the files in the /proc system.


    If you catch the /proc/loadavg file, you end up with something like the following:


    ```

    $brain@sharp:/proc/$$ cat loadavg

    0.00 0.00 0.00 2/47 649

    ```


    The first three numbers are the load average of the processor in the last minute,
    last 5 minutes, and last 15 minutes. If you use the w command at the Linux prompt,
    get something like this:


    ```

    4:15pm up 3:34, 4 users, load average: 0.00, 0.00, 0.00

    ```'
