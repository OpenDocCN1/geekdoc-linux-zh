  md: '# Chapter 6 More Widgets, Frames, Text, Dialog Boxes, File Selection Dialog
    Box, Progress Bar


    After you create the frame, you can use the gtk_frame_set_label function to change
    the label on the frame.


    ```

    gtk_frame_set_label (frame, "Hey, new title");

    ```


    The frame border characteristics can be set using the gtk_frame_set_shadow function.
    It specifies how the frame looks to the viewer. Setting the frame with the GTK_SHADOW_IN
    makes the whole frame appear to be depressed, whereas the GTK_SHADOW_OUT makes
    the frame appear higher than the other widgets. This color effect is is achieved
    by using colors to trick the eyes. The more commonly used GTK_SHADOW_ETCHED_OUT
    and GTK_SHADOW_ETCHED_IN only draw a border around the frame, and GTK_SHADOW_ETCHED_NONE
    draws no border. Figure 6.1 shows the different types of frames.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_115_0.png)


    Figure 6.1 Frames.


    The title can appear in the frame in one of three ways: on the left, the middle,
    or on the right. You can use the gtk_frame_set_label_align function to change
    the alignment. The parameters you used to set the label alignment are also used
    to set the frame''s label alignment. Left alignment is 0, centered is .5, and
    right alignment is 1. You can see the alignment parameters here:


    +   * Set frame label to the left ... */

    gtk_frame_set_label_align (GTK_FRAME), 0, 0);


    +   * Center the frame label ... */

    gtk_frame_set_label_align (GTK_FRAME), .5, 0);


    +   * Put the frame label on the right ... */

    gtk_frame_set_label_align (GTK_FRAME), 1, 0);'
