- img_proc: true
  md: "# 338 Chapter 13 Sprites and Animation\n\n![](img/0c25d93d8fa983d9a11557943feed9d0_351_0.png)\n\
    \n![](img/0c25d93d8fa983d9a11557943feed9d0_351_1.png)\n\nFigure 13.1 Sprites without\
    \ transparency.\n\nFigure 13.2 Sprites with transparency\n\nThe SequenceSprite\
    \ function takes the actor and updates the actor's position on the screen by adding\
    \ the distance (nDist) to its ~x value and draws it on the screen. The drawing\
    \ can here use the mask or not—the UseMask flag indicates whether the sprite should\
    \ be drawn with or without the mask. Drawing without the mask causes the images\
    \ to be drawn with a big rectangle around them (refer to Figure 13.2). Of course,\
    \ if the image was drawn with the clipping mask, the clipping mask should be set\
    \ to NULL after the image is drawn and the mask is no longer needed. Here's the\
    \ full sequence sprite function.\n\n```\nSequenceSprite (GtkWidget *drawing_area,\
    \ typActor *actor, int nDist)\n{\n  GdkGC *gc;\n\n  /* ... Move the actor along\
    \ ... */\n  actor->x += nDist;\n\n  /* ... Too far over, reset position ... */\n\
    \  if (actor->x > drawing_area->allocation.width) {\n    actor->x = 0;\n  }\n\n\
    \  /* ... Use the next image for the actor ... */\n  actor->seq++;\n\n  /* ...\
    \ Use 0 at the end ... */\n  if (actor->seq >= actor->nSequences) {\n    actor->seq\
    \ = 0;\n  }\n\n  /* ... Get foreground color ... */\n  gc = drawing_area->style->fg_gc[GTK_STATE_NORMAL];\n\
    }\n```"
