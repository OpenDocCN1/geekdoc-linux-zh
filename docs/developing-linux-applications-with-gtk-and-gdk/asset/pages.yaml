  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_74_0.png)


    **Figure 4.5** A combo box with label widget, entry widget, and option menu.


    The entry widget (GtkEntry) can be created with the gtk_entry_new function or
    with the gtk_entry_new_with_max_length function. The gtk_entry_new_with_max_length
    sets the maximum number of characters that can be entered into the widget. The
    text in the widget can be retrieved using the gtk_entry_get_text, but this returns
    only a pointer to the string data and shouldn''t be modified through the pointer.
    Instead, the text in the widget can be set in one of three ways:


    +   * Text can be inserted at the beginning of the field by using gtk_entry_prepend_text.

    * Text can be appended to the end of the field by using gtk_entry_append_text.

    * The text can also be set using the gtk_entry_set_text function, which destroys
    any previous value of the field.


    The cursor can also be manipulated in the entry widget. The current position of
    the cursor (and selection) can be queried using the gtk_entry_select_region. The
    cursor can be moved to a position in the field using the gtk_entry_set_position
    function. The gtk_entry_select_region allows a range of text to be selected in
    the field.


    ```

    /* Create an entry field --- */

    entry = gtk_entry_new (default);

    ```


    ```

    /* Set the default value --- */

    gtk_entry_set_text (GTK_ENTRY (entry), "12:00");

    ```


    ```

    /* Append some text --- */

    gtk_entry_append_text (GTK_ENTRY (entry), "am");

    ```'
