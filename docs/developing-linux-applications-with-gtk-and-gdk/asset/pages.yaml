  md: "# Cursors\n\nCursors can be used to provide feedback to the user. You can see\
    \ the cursor change when it moves over an input field (the I-beam cursor) or when\
    \ resizing a window (arrow cursor). This feedback can be important at times. Unfortunately,\
    \ GTK+ comes with a full set of built-in cursors. The entire list can be seen\
    \ in the CDK directory of the GTK+ installation. gdk_cursors has definitions for\
    \ the built-in cursors that you can use. For example, the GTK_ARROW and GTK_CLOCK.\
    \ A built-in cursor is created using the gdk_cursor_new function and passing in\
    \ the identifier of the cursor. This cursor can be assigned to a window, not a\
    \ widget. However, it's easy enough to get the window that the widget is associated\
    \ with, using the window memory.\n\n```\n/* --- Create a new cursor --- */\ncursor\
    \ = gdk_cursor_new (GTK_CROSS);\n```\n\n```\n/* --- Assign cursor to the button\
    \ --- */\ngdk_window_set_cursor(button->window, cursor);\n```\n\nEasy enough,\
    \ except that the number of cursors that are built into GTK+ are limited. Suppose\
    \ you want to create a custom cursor? A custom cursor can be created with xpm\
    \ data like the button icons were created. The trick here is that images must\
    \ use three colors: one for the foreground, one for the background, and one for\
    \ the transparent color. The xpm data must be converted to two GtkBitmaps—one\
    \ for the foreground and one for the background. After the conversion, a GtkCursor\
    \ is easily created. For example, take the following xpm image:\n\n```\nstatic\
    \ char * cursor_hand[] = {\n    \"32 32 3 1\",\n\t\\cNone\",\n\t\t\"#000000\"\
    ,\n\t\t\"+\"\n\t\t#FFFFFF\",\n\n\t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++\
    \ .++++++\n\t\t++++++ .++++++++++ .++++++\n\t\t++++++ .++++++ .++++++\n\t\t++++++\
    \ .++++++ .++++++\n\t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++++++ .++++++\n\
    \t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++ .++++++\n\
    \t\t++++++ .++++++++++ .++++++\n\t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++\
    \ .++++++\n\t\t++++++ .++++++ .++++++\n\t\t++++++ .++++++++++ .++++++\n\t\t++++++\
    \ .++++++ .++++++\n\t\t++++++\"\n};\n```"
