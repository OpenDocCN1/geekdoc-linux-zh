  md: '# Developing Linux Applications


    with GTK+ and GDK


    With the explosive growth of Linux over the past several years, the demand for
    quality applications has never been greater. Developing Linux Applications meets
    this growing need with vigor, illustrating the myriad tools and tactics from GTK+
    and GDK that a Linux developer will need to create GUI applications.


    Written for the developer with extensive C knowledge, this book teaches through
    detailed examples. Eric Harlow incorporates the rudiments of GTK+ with these examples
    to give the reader a detailed, holistic learning experience. He then takes the
    reader to the next level of development by providing instruction on creating unique
    widgets, designing complex graphical environments with GDK, and working with sprites
    and animation.


    Perfect for the experienced Windows or UNIX developer interested in learning about
    GTK+, Developing Linux Applications is the covalent bond that will strengthen
    anyone’s development savvy.


    If you want to create GUI applications for Linux, with Developing Linux Applications
    you’ll:


    Learn about the Gimp Toolkit (GTK+) through hands-on examples


    Give your applications color and life with the GDK


    Experiment with animation and refine sprites with double-buffering and other useful
    techniques


    Create and customize your own widgets to suit your needs


    Understand GLIB and how GTK+ uses it to solve portability problems and provide
    other useful functionality most programs require


    Pick up tricks and shortcuts to streamline your C programming abilities


    Programming / Linux


    $34.99 USA / $49.95 CAN / £31.95 Net UK


    ISBN 0-7357-0021-4


