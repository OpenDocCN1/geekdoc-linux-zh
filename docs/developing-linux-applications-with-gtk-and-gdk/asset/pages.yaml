    # Toolbars


    Toolbars provide users with menu shortcuts to commonly used commands. Toolbars
    usually contain buttons with icons representing the commands but can contain other
    widgets as well. The toolbar widget is created with the gtk_toolbar_new function
    and takes two parameters to determine the style of the toolbar. The first parameter
    determines whether the icons are laid out horizontally (GTK_ORIENTATION_HORIZONTAL)
    or vertically (GTK_ORIENTATION_VERTICAL), the second parameter indicates whether
    the buttons are to display icons (GTK_TOOLBAR_ICONS), text (GTK_TOOLBAR_TEXT),
    or both (GTK_TOOLBAR_BOTH). The toolbar in this example is a horizontal toolbar
    with icons going across the main window. You will add the toolbar to the vertical
    packing box created for the application.


    ```

    /* Create a horizontal toolbar with icons --- */

    toolbar = gtk_toolbar_new (GTK_ORIENTATION_HORIZONTAL, GTK_TOOLBAR_ICONS);

    ```


    ```

    /* Add the toolbar to the application vertical ... */

    /* ... packing box. This is right under the menu ... */

    gtk_box_pack_start (GTK_BOX (vbox), toolbar, FALSE, TRUE, 0);

    ```


    ```

    /* Make the toolbar visible ... --- */

    gtk_widget_show (toolbar);

    ```


    Now you have a toolbar without the buttons. Adding widgets to the toolbar and
    formatting the toolbar requires one of several functions. The three most commonly
    used are gtk_toolbar_append_item, gtk_toolbar_append_element, and gtk_toolbar_append_space.


    # Adding Toolbar Buttons


    The gtk_toolbar_append_item adds a button to the toolbar. The gtk_toolbar_append_item
    has parameters for the button pixmap, tooltips, the callback function, and more.
    The function prototype is


    ```

    GtkWidget *gtk_toolbar_append_item (

    GtkToolbar *toolbar,

    const char *text,

    ```'
