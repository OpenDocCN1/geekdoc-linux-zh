  md: '# # 7\ Writing a Calculator Application


    THIS CHAPTER USES THE KNOWLEDGE YOU already have to create a simple calculator.

    A calculator is a good starter application because it consists of a group of buttons
    and a display area for the results. The buttons are organized neatly in a packing
    table, along with the display area. The application accepts both key press and
    mouse click events to enter information into a calculator that performs simple
    arithmetic operations.


    # ## The Calculator Program


    It''s important to provide feedback to users as they perform operations in an
    application. If the user uses a mouse to click on the calculator buttons, he or
    she should see the buttons as they are clicked—that is, a button should go down
    and come back up to provide visual feedback. In addition, the display area should
    be updated based on the button that was clicked. However, some users prefer to
    use the keyboard instead of the mouse. They, too, should receive some feedback
    as they are typing on the keyboard. This application shifts the focus to the key
    that the user pressed on the keyboard. A user who enters information this way
    should see the key he or she pressed get the focus highlight and also see the
    display area get updated.'
  merge: -1
  pgno: 142
