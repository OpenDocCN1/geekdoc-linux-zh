    So, what problems exist? Well, for one thing, the clock is going to flicker on
    slow machines and will probably flicker even on faster machines. The flicker is
    caused by the repainting routine. The computer screen is refreshed constantly
    (many times a second), and if the hardware refreshes the monitor display right
    after the code clears the drawing area, a blank (or partially redrawn) area is
    displayed briefly on the screen. Or, by the next hardware refresh, the repainting
    should be done, but it''s too late. The human eye will not see the blank clock
    that was drawn, but it will see the clock flicker. Fortunately, the clock only
    has a chance of flickering every second when the clock is redrawn. The more complicated
    the drawing, the more likely the drawing will not be completed between the screen
    refreshes and the more the user will see flickering. Flicker is not a good feature,
    and we''ll have to work to eliminate it.


    The second problem is noticeable if you repeatedly move a window over the clock
    and then move the item away. You should eventually detect a bit of a lag when
    the window is moved and when the screen actually updates the image in the window.
    This delay is not more than a second, and occurs because the application is not
    listening to the expose_event, which tells it when the window is exposed and needs
    to be repainted. A well-behaved GTK application would add a callback to the expose_event
    and repaint the clock immediately, instead of waiting for the next timer to occur.


    # Eliminating Flicker


    The big problem with the clock is the flicker that occurs every second as the
    clock is redrawn. The best way to eliminate flicker is to use a technique called
    double buffering. Double buffering involves a buffer that is used as a canvas
    for all the drawing that takes place. The image on the screen is not modified
    by the drawing. Instead, all the drawing takes place in the buffer. In this example,
    you can create a buffer the same size as the window and draw the clock in the
    buffer instead of in the window. When the clock has been completely drawn in the
    buffer, the buffer is copied into the window. Because the transfer of the buffer
    into the window doesn''t involve clearing the screen, no flickering occurs.'
