  md: '# Chapter 11 Styles, Fonts, Cursors, and Referencing


    Although only one font is defined in a style, the style can have many colors.
    A widget can be in several modes: NORMAL, ACTIVE, PRELIGHT, SELECTED, and INSENSITIVE.
    Each mode has a unique color scheme.


    NORMAL The way the object is normally drawn.


    ACTIVE The object is active—for a button, the ACTIVE state is while the button
    is pressed down.


    PRELIGHT Usually means the mouse is moving over the widget. This color tells the
    user to click on the item.


    SELECTED Item has been selected.


    INSENSITIVE Widget has been insensitive (not selectable). This mode is also called
    "disabled" in Microsoft speak.


    Each mode has a set of colors defined to express the mode that the widget is in.
    You can see this feature by looking at the button widget. The button is normal
    in the NORMAL mode. As the mouse moves over the button widget, the widget goes
    into PRELIGHT mode, which causes the button to be displayed in the PRELIGHT colors.
    If the button is pressed, the button is displayed in the ACTIVE colors for the
    widget. Not all widgets support every mode.


    # Colors


    Colors are defined as GdkColor. The color consists of a red, green, blue (RGB)
    value that determines its contribution to the color.


    ```

    * Red defined as -- lot of red, green, no blue -- */

    GdkColor color = {0, 0xffff, 0x0000};

    ```


    After the Gdk structures have been created, the color should be allocated from
    the system using the gdk_color_alloc function. It tries to allocate the color
    with the colors that the hardware can support. The function expects a colormap
    or color, but if you''re using only a few colors, you can use the system colormap
    by passing the value returned from the gdk_colormap_get_system function. After
    they are allocated, the colors can be used to create new styles with more (ahem)
    interesting colors.


    # Using Styles


    The default style for the application can be retrieved using the gtk_widget_get_default_style
    function. It''s bad to practice with this style directly, but you can make a copy
    of it to manipulate. The gtk_style_copy function makes a copy of a style so it
    can be modified. The structure of GdkStyle contains an array of foreground colors
    (fg), an array of background colors (bg), and an array of text colors (text) that
    define the style''s colors. To modify the button so it displays white text on
    black, you could do the following:'
