    ![](img/0c25d93d8fa983d9a11557943feed9d0_421_0.png)


    Figure 14.1 Tree widget in action.


    # Tree Creation


    You can use the gtk_tree_new function to create the GtkTree widget. The tree that
    is created initially empty and needs to be populated. To create a leaf node, use
    the gtk_tree_item_new_with_label function and pass in the name of the leaf node.
    After the leaf node is created, it needs to be assigned to a parent node. The
    parent can be the GtkTree widget (for a top-level node) or another leaf node.
    Here you create a GtkTree widget and add a top-level node to it.


    ```

    ```c

    /* Create the tree ... */

    tree = gtk_tree_new();

    ```

    ```


    ```

    ```c

    /* Create a leaf node ... */

    leaf = gtk_tree_item_new_with_label("Top level leaf!");

    ```

    ```


    ```

    ```c

    /* Add item to the tree ... */

    gtk_tree_append(GTK_TREE(tree), leaf);

    ``````

    ```


    ```

    ```c

    /* Don''t forget to make tree and leaves visible ... */

    gtk_widget_show(leaf);

    gtk_widget_show(tree);

    ```

    ```


    Now you can add some leaves to the tree, but adding the data that makes up the
    leaves requires several steps. First, you create a new GtkTree, using the gtk_tree_new
    function. Next, you mark the tree as a subtree and assign it a parent tree item,
    using the gtk_tree_item_set_subtree function. Then you can add elements into the
    subtree by using the same functions you used to add elements into the tree.'
