    );\n```\n\nThe return value of the g_slist_append function is the new linked list.\
    \ Inserting or deleting items from the list results in a new list being returned\
    \ in case the head of the list changes. You can add \"Joe\" to the beginning of\
    \ the list with the g_slist_prepend function.\n\n```\nlist = g_slist_prepend(list,\
    \ \"Joe\");\n```\n\nYou can insert items at a particular position in the list\
    \ by using the g_slist_insert function and providing an index of the position\
