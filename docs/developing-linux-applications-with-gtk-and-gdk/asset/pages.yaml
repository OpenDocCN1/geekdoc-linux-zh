  md: '# Chapter 3 Developing GUI Applications


    The GIMP Toolkit (GTK+) is the latest GPL GUI library for Linux; therefore it
    is free for noncommercial and commercial development. GTK+ is also a cross-platform
    toolkit with support on many UNIX machines as well as Microsoft Windows. With
    the support of some of the larger distributions of Linux software and a large
    base of Linux developers, GTK+ has been evolving into a very good toolkit for
    developing GUI applications.


    GTK+ was given its name because of the use of the library to create the GIMP (which
    stands for GUI Image Manipulation Project). The GIMP is an example of an excellent,
    commercial-quality graphical editor using GTK+. GIMP is similar to Photoshop and
    can be seen at http://www.gimp.org Web site.


    GTK was written in C, which is object oriented, and bindings are available to
    use GTK+ from many languages, including C++ (using the wrapper, oddly enough,
    GTK--). Like most modern GUI toolkits, GTK+ is an event-driven toolkit. The screen
    is built with widgets (windows, combo boxes, text boxes, buttons), and callbacks
    are set up on widgets to perform processing based on signals, which are usually
    mouse- keyboard-driven events. When a callback receives notification of a signal,
    the application responds to those signals with some processing. The concept of
    a signal is similar to an event in Java or Windows.


    GTK+ is a widget library that relies on the Drawing Kit (GDK), which is a wrapper
    around Xlib. The GTK+ calls the GIMP Drawing Kit for anything dealing with the
    display of the widgets. The GDK is supposed to be a platform-dependent Application
    Programming Interface (API) that sits on top of the native graphics API (Xlib,
    Win32) and provides a graphics API. Because GDK sits as a layer between Xlib and
    GTK+, GTK+ can be ported to other operating systems by changing the GDK (see Figure
    3.1). Both GTK+ and GDK rely heavily on the GLIB library, which provides functions
    for handling many common data types like lists, trees, and strings, as well as
    memory allocation functions and error-handling routines. Both the GLIB and the
    GDK libraries can be called directly without going through the GTK+


    ![](img/0c25d93d8fa983d9a11557943feed9d0_41_0.png)


    Figure 3.1 GTK+ application layers.'
