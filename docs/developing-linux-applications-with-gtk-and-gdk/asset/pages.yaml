    The gtk_text_forward_delete function deletes characters from the cursor position
    and the gtk_text_backward_delete function deletes characters from the cursor position
    going back.


    ```

    /* Delete the ten characters after the cursor ... */

    bSuccess = gtk_text_forward_delete (GTK_TEXT (text), (guint) 10);

