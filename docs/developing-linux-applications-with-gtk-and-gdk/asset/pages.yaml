  md: '# Memory Management


    The GLIB library provides some memory management functions to replace the standard
    malloc/free. Keeping the naming standards of the GLIB library, the malloc replacement
    is named g_malloc. The parameter is the size of the memory block that is requested,
    which is the same as malloc. The library also provides a g_free function to replace
    the standard free function and a g_realloc to replace the standard realloc.


    ```

    /* Allocate some memory ... */

    ptr = g_malloc(10 * sizeof(char));

    ```


    ```

    /* Expand the memory ... */

    ptr = g_realloc(ptr, 20 * sizeof(char));

    ```


    ```

    /* Free the memory ... */

    g_free(ptr);

    ```


    The GLIB memory functions provide the capability to track down memory memory problems.
    When compiling GTK+/GLIB, you can define MEM_CHECK and/or MEM_PROFILE in GLIB/gmem.c
    to provide a slower and more functionality into the memory management functions.


    Compiling with MEM_PROFILE sets GLIB keep track of memory allocations that are
    made through GLIB, which can be handy when tracking down a memory leak. Calling
    g_mem_profile displays information about your memory footprint similar to


    +   - allocations of 8 bytes

    - allocations of 52 bytes

    - allocations of 1024 bytes

    - 2108 bytes allocated

    - bytes freed

    - 2108 bytes in use


    Using MEM_CHECK in GLIB keeps track of pointers that have already been freed.
    Attempting to free a pointer multiple times results in the following error:


    > ** WARNING ****: freeing previously freed memory.


    This error usually indicates that your pointer management is not as good as you
    thought it.


    # Summary


    The GLIB can handle many commonly used data structures, including linked lists
    and trees, and provide a standard set of functions for messages. These functions
    are used by the GTK+ library and provide a standard set of routines available
    on all platforms. You can use the GLIB routines with or without GTK+.'
