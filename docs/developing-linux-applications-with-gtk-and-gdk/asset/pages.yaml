  md: '# Chapter 11 Styles, Colors, Fonts, Cursors, and Referencing


    Instead of changing the styles of widgets after they have been created, you can
    easily change the styles that widgets are created with. The gtk_widget_push_style
    function sets the current style for all widget creations. Any widget created after
    the gtk_widget_push_style gets the style that was "pushed." When done, the gtk_widget_pop_style
    should be called to remove that style from the stack. Because the styles are implemented
    in a stack, multiple styles could be on the stack at any time, but only the style
    on the top is used. If the top style is popped using the gtk_widget_pop_style,
    the next style in the stack becomes the style that widgets are created with. The
    "style_set" signal gets to the widget after the widget''s style has been changed.


    This example shows how the styles can be used to change color of buttons or to
    modify the style for widget creation. The program shows six buttons—the first
    four are placed within the dialog box in a particular color scheme. (Hint: Christmas
    color scheme is green and red.) The fifth button calls all the buttons to change
    color. The last button has all its styles modified so that it starts out with
    a different color. In fact, moving the mouse over the button shows that the PRELIGHT
    is a yellow—not the default. (Clicking on the Buttons Go Wild replaces the startup
    style with something else.) The missing piece here is the Callback function, which
    is included in another file. It pops up a dialog and displays a message (see Figure
    11.1). You can take a look at the source for it, which is the critical piece.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_273_0.png)


