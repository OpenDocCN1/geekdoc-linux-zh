    # Notebook.c


    After the data is loaded into the trees, these routines create and display the
    data within the GtkClist widgets. The widgets are created on separate pages, and
    the user is allowed to change the tabs to see information on the other pages.
    The data in the GtkList widgets is created by traversing the tree in order. The
    textual information (date, user, hits, and so on) is displayed, and the maximum
    traffic is calculated. After the textual information is displayed a second time
    to display the graphs, the tree for display is traversed because the maximum traffic
    is necessary because the graphs are relative to the largest value and cannot be
    displayed until the maximum value is calculated.


