    # # More Widgets: Frames, Text,

    Dialog Boxes, File Selection

    Dialog Box, Progress Bar


    SIMPLE WIDGETS ARE ONLY THE BEGINNING OF GTK+. GTK+ has many widgets to help developers
    write complete applications. This chapter covers some of these additional widgets,
    including the frame widget, dialog widget, progress bar and the power-full text.


    # Frames


    Frames are containers that usually have a border around them as well as a title
    that is used to group widgets. Frames help to distinguish between different fields
    on a screen. Frames are created with the gtk_frame_new function that creates the
    default frame. The standard creation sequence for a frame is


    ```

    /* ... Create the frame ... */

    frame = gtk_frame_new("Title");


    /* ... Set any attributes ... */


    /* ... Make it visible ... */

    gtk_widget_show(frame);


    /* ... Add it to a container or a box or something ... */

    gtk_container_add(window, frame);

    ```'
