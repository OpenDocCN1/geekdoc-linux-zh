- img_proc: true
  md: 'The preceding line displays the load average as the last three numbers. (Hmmm...
    machine seems a bit idle.)


    Another example of /proc system is the /proc/net/dev file which has information
    about the packets sent and received for every device. On my machine, the results
    look something like this:


    | Receive | Transmit |

    | packets errs drop fifo frame | packets errs drop fifo carrier |

    | lo: | 103 0 0 0 | 103 0 0 0 0 |

    | eth0: | 9600 0 0 0 0 | 6487 0 0 0 1 |


    Of course, the packets sent and received change each time. If I type the command
    a little later, I get the following:


    | Receive | Transmit |

    | packets errs drop fifo frame | packets errs drop fifo carrier |

    | lo: | 104 0 0 0 | 104 0 0 0 |

    | eth0: | 9639 0 0 0 0 | 6513 0 0 0 1 |


    The device I want to monitor is here the eth0: device. the device is the ethernet
    card on my machine, and I want to know how much traffic is going through the card
    at any time. By comparing the total packet traffic to the last time I read the
    file, I can figure out much traffic there was since the last time I read the file.


    # Description


    The application uses a timer to update the screen every few seconds. It reads
    the /proc file system for statistics about the system and displays the information
    in a graph with a different color for each item in the graph. The graph is configurable
    using toolbar buttons.


    Upon experimenting, I found the network usage tended to fluctuate, making it hard
    to gauge actual throughput. It was easier to add a button to display the average
    throughput as well as the actual throughput. The average is computed the last
    N samples and provides a graph with few fluctuations.


    The code for the system monitor is broken down into several modules. Each module
    has specific code to handle its share of the application. The description of the
    files begins with frontend.c.


    # frontend.c


    frontend.c creates the application window, the toolbar (with pixmaps), and the
    small menu. It has routines for other functions that query information about the
    user interface. For instance, the CPUButton15Down function can be called to ask
    whether the toolbar button that displays the CPU state every 15 minutes has been
    pressed. This approach is better than allowing the tool_cpu15 variable to be used
    outside of this file.'
