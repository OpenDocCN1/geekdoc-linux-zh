  md: '# String Functions


    GLIB has its own GString data type that can be used instead of char and get to
    manipulate strings. The best part about GString is that the functions handle the
    memory allocation for you. GStrings are created by using the g_string_new function
    and passing a string.


    ```

    gstr = g_string_new("Hello");

    ```


    The GString is a really structure that contains information about the string (a
    gchar str) and the length (len). The string and length are accessible from the
    structure for viewing, but any manipulation should be done through the wrapper
    classes. Freeing the string requires the g_string_free function that takes the
    created string and frees the memory associated with it. The g_string_free function
    takes a second parameter that determines whether the GString''s string memory
    should be freed. Usually, this should be set to TRUE GString functions allocate
    the memory, and it should be released when the data structure is released. It
    should be set to FALSE if a reference to the GString''s (char *) is used somewhere
    else.


    ```

    g_string_free(gstr, TRUE);

    ```


    You can assign a value to an existing GString by using the g_string_assign function.
    The new string replaces the existing value and handles any new memory allocation.


    ```

    g_string_assign(gstr, "New String Value");

    ```


    The string can be truncated to a particular length using the g_string_truncate
    function. Passing in a zero for the new length effectively sets the string to
    "".


    ```

    g_string_truncate(gstr, 0);

    ```


    The g_string_append function enables you to append a string to the GString. The
    additional memory allocation is done automatically.


    ```

    g_string_append(gstr, "Adding more");

    ```


    You can also add a string to the beginning of the GString using the g_string_prepend
    function. The parameters are the same as parameters for the g_string_append function
    except that for prepend the string is inserted before the existing string.


    ```

    g_string_prepend(gstr, "Adding before");

    ```


    Characters can be appended or prepended to the GStrings by using the g_string_append_c
    or g_string_prepend_c functions.


    ```

    /* --- Append a ''z'' to the end --- */

    g_string_append_c(gstr, ''z'');

    ```


    ```

    /* --- Put an ''a'' on the beginning --- */

    g_string_prepend_c(gstr, ''a'');

    ```'
