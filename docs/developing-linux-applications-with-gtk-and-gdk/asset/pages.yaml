  md: "# Building the Application's User Interface\n\nIn applications, state information\
    \ is shown in several places. In the application you are creating, font information\
    \ is shown on the toolbar and on a checked menu item. If the toolbar **Bold**\
    \ button is selected, the **Bold** menu selection should also reflect the state\
    \ change. However, synchronization between the toggle buttons and the menu toggle\
    \ items is not an automatic process, because the application has no knowledge\
    \ of the relationship between the two items.\n\nTo achieve the necessary synchronization,\
    \ recall that the toolbar font sets the callback to a function called ButtonClicked.\
    \ This function knows which button was pressed and sets the equivalent menu item\
    \ state. Also recall that you stored the font item pointer when you created the\
    \ menu item. It makes it easy to update the menu when the toolbar is clicked.\
    \ You can check the state of the toggled button by using the following code:\n\
    \n```\n/* ... */\nnnState = GTK_TOGGLE_BUTTON (widget)->active;\n```\n\nThe widget\
    \ is converted into a toggle button so that you can check on the state of the\
    \ button. You can create the small ButtonClicked function that does the following:\n\
    \n```\n/*\n* ButtonClicked\n*/\nvoid ButtonClicked(GtkWidget *widget, gpointer\
    \ data)\n{\n    /*\n    * Get the button state ... */\n    int nState = GTK_TOGGLE_BUTTON\
    \ (widget)->active;\n\n    /* ... Synchronize the menu state with the button ...\
    \ */\n    SetMenuItem((char *) data, nState);\n}\n```\n\nThe data variable was\
    \ set up when you created the widget so the value gets passed into this function.\
    \ In this case, the data variable tells you button was pressed. Recall that you\
    \ can use the gtk_check_menu_item_set_state function to check the button's state.\
