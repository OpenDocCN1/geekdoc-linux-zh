    # Creating an Application


    The following application uses both the GtkNotebook widget and the GtkList widget

    to display the log file from an Apache Web server. The log files are broken down
    into

    three notebook pages. The first page displays the traffic by the hour of the day
    (see

    Figure 14.3). This information enables you to determine whether the bandwidth
    is

    adequate for peak periods. The second page shows traffic by day, starting from
    the

    beginning of the log file. This information enables you to look for traffic trends—nh
    ad placed on one of the sites caused traffic to spike for the few days that it
    was running. Did you notice the traffic increase? Probably not.


    The third page shows the traffic generated by the user. This application treats
    the

    home page as a separate user page.


    Each GtkList is going to feature a pixmap to graphically display the traffic,

    whether it is by hour, by day, or by user. This information allows the user to
    quickly

    spot problems—like the new user running an X-rated site for it. It''s a lot

    icker to look at graphics than it is to scan rows of numbers for the information.


