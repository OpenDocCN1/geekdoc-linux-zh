  md: '```

    /* --- Make the packing box visible --- */

    gtk_widget_show ( vbox_main);

    ```


    The menu consists of the menu bar (GtkMenuBar) that sits along the entire portion
    of the window and the menus (GtkMenu) that can be dropped down from the menu or
    other menus. Each individual menu choice is a GtkMenuItem created and inserted
    into a GtkMenu.


    The first step is to create the GtkMenuBar and add it to the vertical packing
    box.

    The gtk_menu_bar_new function creates the GtkMenuBar widget. Here''s the code
    to create the menu bar and put it in the vertical packing box.


    ```

    /* --- Create a menu bar for the application --- */

    menubar = gtk_menu_bar_new ();

    ```


    ```

    /* --- Put the menu bar in the application packing box --- */

    gtk_box_pack_start (Gtk_BOX, vbox), menubar, FALSE, TRUE, 0);

    ```


    ```

    /* --- Make the menu visible --- */

    gtk_widget_show (menubar);

    ```


    This code creates a blank GtkMenuBar. For the menu to be useful, you need to add
    the menu items.


    When you are working with basic widgets, you will create few wrapper functions
    to combine several steps into a single function. You can use the same technique
    with the menus. To create a menu item, the first step is to create a "File" menu
    item (GtkMenuItem) with a label.


    ```

    /* --- Create a menu item for "File" --- */

    menuFile = gtk_menu_item_new_with_label ("File");

    ```


    After the GtkMenuItem is created, you need to add it to the GtkMenuBar you created
    earlier and then make the GtkMenuItem visible.


    ```

    /* --- Add File to the menu bar --- */

    gtk_menu_bar_append (GTK_MENU_BAR, menubar, menuFile);

    ```


    ```

    /* --- Make the widget visible --- */

    gtk_widget_show (menuFile);

    ```


    In most applications, the menu item "File" contains other menu items that are
    visible only when the menu is dropped down. When selected, the "File" menu item
    does not cause the application to perform an action. Instead, the "File" opens
    a submenu, which contains selectable options such as "New," "Open," and "Save.\
    Because "File" really leads to be associated with a new menu that contains these
    other items. You can use the other gtk_menu_item_set_submenu function after creating
    a new GtkMenu that will contain the "New," "Open," and "Save" options.


    ```

    /* --- Create the new menu for "New," "Open," etc --- */

    menu = gtk_menu_new ();

    ```'
