  md: '# Signals and Callbacks


    Signals are necessary in GUI-based programming the program must be able to respond
    to the user. If the mouse moves, a button gets pressed, text is typed, or a window
    closes, a signal can be sent to an application callback function. The signal may
    be one that needs to be handled by the application. A word processor may have
    a button to make the font bold, and if the user presses that button, the code
    that makes the font bold needs to be called. Likewise, if the user closes the
    main window, some processing (saving files, cleanup) may need occur before the
    window is closed.


    Signals occur all the time in the GTK+ application, but most of the time the signals
    are ignored. Take the button widget as an example. The application has button-specific
    signals for when a user releases the mouse button, when a user clicks on the mouse,
    when the mouse moves over the button, and generic generic widgets include one
    signal when the mouse has moved.


    In reality, the only signal word listening for the button widget is the "mouse
    clicked" signal. It is signaled when the user clicks on the button with the mouse.
    Most of the time, the application ignores the button''s other events. It means
    no sense to be notified each time the mouse is moving over the button or when
    the user releases the mouse button. Other widgets are similar to the button in
    that a minority of the signals are useful for the application developer, and a
    majority of the signals are ignored.


    When a signal is to be handled, the callback needs to be registered with GTK+
    and associated with a widget. Widgets can register callbacks, and a callback can
    be registered with multiple widgets. Figure 3.2 illustrates the relationships
    between the application, GTK+, and the callback functions.


    Figure 3.2 shows how signals are handled. Button5 has defined a callback that
    will be called when the signal occurs. Button8 has defined two different callbacks
    to listen to two separate signals. A widget is permitted to respond to as many
    signals as necessary, but it is a good idea to keep them to a minimum. When a
    signal occurs in a widget, the callback function for that signal in the widget
    is executed.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_45_0.png)'
