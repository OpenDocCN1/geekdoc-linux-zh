  md: '# 146 Chapter 8 Developing a Simple Word Processor


    ![](img/0c25d93d8fa983d9a11557943feed9d0_159_0.png)


    Figure 8.1 The Gnotepad


    In addition to the menus, the application has a toolbar so that users can access
    most of these commands quickly. The original notepad did not have a toolbar, but
    adding one here to make the notepad more functional is not difficult.


    # main.c


    This program starts like GTK+ applications—creating a window and giving it a title,
    as well as creating a virtual packing box so that the menu and toolbar can be
    placed within it above the text widget that would display and edit the file. The
    code that creates the menu and toolbar is encapsulated within the CreateMenu function,
    and the actual text widget used for editing goes is the CreateText function.


    The problem here involves creating the toolbar in the application. Creating the
    toolbar icons requires converting the pixmap text data to a GdkPixmap or into
    a pixmap. The conversion of the pixmap text data requires an X Window as one of
    the parameters. Rather than making the window visible (which would create the
    X Window) and then load up the toolbar information and display it, you configure
    it by using the gtk_realize_widget function. The gtk_realize_widget function creates
    an X Window for the widget to be used without making the window visible. Usually
    the realization occurs as part of the gtk_show function, but you want to make
    the X Window created for the application window before the window is made visible.
    You can eliminate the gtk_realize_widget by putting the CreateMenu function in
    after making the application window visible, but that solution is not ideal, because
    the window would be disposed without being finished (that is, without menus/toolbars).'
