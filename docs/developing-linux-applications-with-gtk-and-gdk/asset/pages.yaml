    \ (radio));\nBecause the radio button was derived from the check button, which\
    \ was derived from the toggle button, the radio button can use the toggle button\
    \ events and functions to set attribute information. The same events used by the\
    \ toggle button are also used by the radio button.\n\n# Labels\n\nLabels (GtkLabel)\
    \ are static noneditable fields used to describe other fields on the screen. Labels\
    \ describe a button by placing the label within the button, or they can be placed\
    \ next to other fields, like edit fields, to provide the field with a description.\
    \ Labels are created with the `gtk_label_new` function. Querying the label text\
    \ is made with a call to the `gtk_label_get_text` function and changing the label\
    \ text requires a call to the `gtk_label_set_function`.\nUnlike other widgets,\
    \ labels are not derived from GtkWidget, but are instead derived from GtkMisc.\
    \ Therefore, labels cannot have events associated with them."
