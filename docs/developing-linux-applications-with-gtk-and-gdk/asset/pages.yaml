  md: '# Casting Widgets


    Because the widget created is a generic widget, it has to be converted to the
    correct type for specific widget function calls. Creating a button widget returns
    a GtkWidget pointer, but the button-specific routines require a GtkButton pointer.
    The generic GtkWidget pointer has to be converted to a GtkButton pointer, by using
    the GTK_BUTTON_macro, before a button function is called. By insisting that the
    types in match the types expected by the routines, this requirement helps the
    developer write a better program.


    # Bad Casting


    Only a poorly written program would pass a text widget into a function that expected
    a button widget. By forcing the conversion to be made, any errors in converting
    the widget will be reported. For instance, here is a sample piece of code to create
    a button widget and convert it to a text widget:


    ```

    /* Create a button widget */

    button = gtk_button_new_with_label ("Button");

    ```


    ```

    /* Try and convert the button to a text widget ... */

    text = GTK_TEXT (button);

    ```


    If this section of code is placed in a program, it will compile cleanly because
    the conversion check occurs at runtime. However, running the program results in
    this message:


    > ** WARNING **: invalid cast from "GtkButton" to "GtkText"


    These messages should not exist. If they appear, it is usually the result of a
    developer error.


    # Good Casting


    Widgets are usually derived from other widgets. The button widget is derived from
    the container widget (GtkContainer) which is in turn derived from the generic
    widget (GtkWidget). Because of this relationship, button widgets (GtkButton) can
    typecast to container widgets (GtkContainer) to use container functions. You already
    used the gtk_container_add function to add widgets to containers. You can also
    use this function to take a button widget and add a label to the button. Of course,
    to use the gtk_container_add function, the button must be typecast to a GtkContainer,
    which is possible because the GtkButton is also a GtkContainer. A widget can be
    cast to any type of widget within its superclass hierarchy.


    ```

    /* Create a button without a label ... */

    button = gtk_button_new ();

    ```


    ```

    /* Create a label ... */

    label = gtk_label_new ("Blah");

    ```'
