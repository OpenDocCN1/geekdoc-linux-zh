    \nTo see the difference the mouse hints make, you can remove the GDPR_POINTER_MOTION_HINT_MASK\
    \ from the gtk_widget_set_events call. Of course, you will have to use a very\
    \ complicated molecule, or a slow machine, to see the mouse events up.\n\n# motion_notify\n\
    \nThe motion_notify function detects mouse motion and retrieves the molecule to\
    \ be redrawn. The mouseDrag function is called to rotate the molecule. The prev\
    \ and preys keep track of the position of the mouse. The previous mouse position\
    \ calculates the direction in which the mouse has been dragged. If you dragged,\
    \ you can build a matrix with the information and rotate the molecule. Of course,\
    \ this function handles both hints and normal mouse-movement events."
