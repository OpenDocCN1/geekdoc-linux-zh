  md: "# Chapter 8 Developing a Simple Word Processor\n\nTo get the ShowMessage function\
    \ to work flawlessly, two situations need to be handled through events. The user\
    \ may click the OK button or may just close the dialog box. These actions generate\
    \ different events. Clicking the button generates a *clicked* event, but doesn't\
    \ do anything. Closing the window generates a destroy event that doesn't clean\
