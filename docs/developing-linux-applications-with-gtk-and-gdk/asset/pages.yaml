    5, “Menus, Toolbars, and Tooltips.”


    # Summary


    Writing the minesweeper application should have further solidified your understanding
    of how to put together a small application using toolbars, menus, and other widgets.
    The GTK+ library is flexible in the types of applications that can be created
    using the widgets.'
