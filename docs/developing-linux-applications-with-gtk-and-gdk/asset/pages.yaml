    /* Destroy dialog box when "cancel" --- */

    gtk_signal_connect_object (

    GTK_OBJECT (GTK_COLOR_SELECTION_DIALOG) (window)->cancel_button,

    "clicked",

    GTK_SIGNAL_FUNC(gtk_widget_destroy),

    GTK_OBJECT (window));

    ```'
