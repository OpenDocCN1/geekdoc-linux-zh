    # # File Format


    To display the .pdb files, you must first be able to read them in and understand
    the format that describes them. The .pdb file format is quite complex and is designed
    for displaying complicated molecules. However we are quite content to ignore much
    of the information stored in the .pdb file. The only items of concern are the
    atom names, atom positions, and the connections between the atoms. The relevant
    .pdb files are broken into two parts—the first part describes the atoms, and the
    second part (optional) describes the bonds between the atoms. The official description
    for the atoms is quite complicated:


    Record Format


    | COLUMNS | DATA TYPE | FIELD | DEFINITION |

    | --- | --- | --- | --- |

    | 1 - 6 | Record name | "ATOM " | Atom serial number. |

    | 7 - 11 | Integer | serial | Atom name. |

    | 13 - 16 | Atom | name | Alternate location indicator. |

    | 17 | Character | altloc | Residue name. |

    | 18 - 20 | Residue name | rename | Chain Identifier. |

    | 22 - 23 | Character | chainID | Residue sequence number. |

    | 26 | Integer | resSeq | Code for insertion of residues. |

    | 27 | AChar | iCode | Orthogonal coordinates for X in Angstroms. |

    | 31 - 38 | Real(8.3) | x | Orthogonal coordinates for Y in Angstroms. |

    | 39 - 46 | Real(8.3) | y |'
