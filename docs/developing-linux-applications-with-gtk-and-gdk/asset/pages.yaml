  md: '# Video Games


    GDK can do more than simple animation. You can use the information in the previousous
    section to create the basics for a game modeled after the 1980s video arcade game
    Defender. For those you young to remember, Defender was a game where the hero
    flew around a planet keeping his people from being plucked by the invading aliens.
    The aliens would attempt to pick up the people from the surface of the planet
    and carry them to the top of the screen, at which point the aliens would mutate.
    The mutation would destroy the person carried to the top and create a deadliest
    alien.


    I had to recreate the game mostly from memory (I could not find a local arcade
    that carried an antique in the video game world). I also had to eliminate some
    of the original features (because of space limitations): There is no scoring,
    and some of the aliens from the original game are missing.The purpose here is
    to illustrate the capabilities of the GDK in a short game that can be extended.
    (As always, the extension will be left as an exception.)


    # Games with GTK+/GDK


    For this program, you use some of what you learned about sprites and animation
    to write the framework of a game. The animation in Defender is similar to the
    animation you did earlier that now the player controls one of the sprites and
    the computer controls the behavior of the other sprites and the interaction between
    all the sprites. As you can probably tell, you can use GTK+ and GDK to create
    games that are more elaborate than this simple version of Defender.


    The real video is much more complex, but this example illustrates that GTK+ can
    be used for a video game with fairly low impact on CPU, especially on newer hardware.
    (In other words, on a Pentium 133 the game ran well with low CPU usage. It probably
    wouldn''t play very well on either a 386 or a 486SX-16.)


    # Game Breakdown


    There are several factors to consider when creating a game: Input, graphics, special
    effects, collisions, level enhancements, and scoring are just some of the items
    you might add when writing this type of game. We''re not going to consider all
    these factors. For instance, this version of Defender does not implement scoring
    and does not have game levels. Progressively harder game levels are necessary
    for a real game: Without variety and challenge, the game suffers a quick death
    in the discount bin.


    # Input


    The keyboard is one input device that everyone should have available, so it is
    the device that players use for this game. The game has movement (left, right,
    up, and down) and the capability to fire at the aliens (see Figure 13.3). The
    movement can be done with the arrow keys, and the firing can be done with the
    Spacebar, but it''s never quite that easy.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 350 Chapter 13 Sprites and Animation


    Writing games is different from writing applications. With a game, you have to
    know which keys are pressed at all times. For instance, a player could be holding
    down a direction and tapping the Spacebar at the same time to shoot down an alien.
    This technique won''t work with GTK+ by default, because the last key that was
    pressed is the one sent to the application. If the user holds the key, it will
    repeat. If other keys were already down when a new key is pressed, other keys
    are ignored.


    ![](img/0c25d93d8fa983d9a11557943feed9d0_363_0.png)


    Figure 13.3 Some landers are grabbing humans—one lander has exploded, dropping
    a human.


    # Tracking the Keypresses


    You can get around the keypress problem by using the "key_press_event" signal
    and the "key_release_event" signal. When a key is pressed, the "key_press_event"
    signal is sent, and when a key is released, the "key_release_event" is sent. Well...not
    quite. The "key_release_event" is not sent by default, so just putting a callback
    on it won''t work. To make sure you get the event, the gdk_widget_set_events function
    needs to be called with GDK_KEY_RELEASE_MASK. This step causes the "key_release_event"
    to be sent to the window. GTK+ masks out these "minor" signals, so you have to
    tell GTK+ that you really want them.


    # Repeating Keys


    The repeating keys aren''t necessary here, although the only effect on the application
    of holding down multiple keys is to cause unnecessary processing of the keys and
    weird keystroke combinations. The gdk_key_repeat_disable function turns off the
    repeating keys in the application. After the function is called, any key gets
    only one "key_press_event" when it''s pressed, even if the user holds down the
    key. The problem with the gtk_key_repeat_disable function is that its effects
    are global—not just to the game, but to all applications that are running. To
    prevent the game from affecting other applications the gtk_key_repeat_disable
    function is enabled within the application''s "focus_in_event" that indicates
    the game has the focus. You should focus the leave for another application, the
    "focus_out_event" callback calls to the gdk_key_repeat_restore function, which
    enables the key to repeat when the user leaves the game to work on that spreadsheet
    when the boss walks by.'
