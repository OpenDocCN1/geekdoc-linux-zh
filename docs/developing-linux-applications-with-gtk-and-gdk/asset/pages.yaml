    \ be used on the toggle button if you use the GTK_BUTTON macro to cast the toggle\
    \ button.\n\nThe toggle button has a new signal added to those from the GtkButton.\
    \ The \"toggled\" signal is sent when the state of the button changes. The state\
    \ of the button can be set using the gtk_toggle_button_set_state function and\
    \ passing in the state that the button should be m. The gtk_toggle_button_toggled\
    \ function changes the state of the button. Functions that change the state of\
    \ the button may also signal to be sent to the application. For instance, if the\
    \ gtk_toggle_button_set_state function sets the state of the button to TRUE and\
