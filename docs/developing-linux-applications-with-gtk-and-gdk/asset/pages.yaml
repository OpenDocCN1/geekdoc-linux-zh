  md: "# Data Structures\n\nEach button in the calculator has a set of characteristics\
    \ associated with it. Each button has a widget pointer as well as a label and\
    \ a position expressed in row and column format to determine where to place the\
    \ button in the packing table.\nThe data structure looks like this:\n\n```\n/*\n\
    \ * Data structure to keep track of the calculator buttons.\n */\ntyp struct {\n\
    \n    char        *szLabel;    /* Label display on button ... */\n    int    \
    \     row;         /* Row to place the button ... */\n    int         col;   \
    \      /* Column to place the button ... */\n    GtkWidget   *widget;     /* The\
    \ widget pointer ... */\n\n} typCalculatorButton;\n```\n\nYou can use this structure\
    \ to define the buttons in a table. The table is an array of CalculatorButton\
    \ elements. The benefit of defining the buttons in a table like this is that you\
    \ can easily add or remove buttons from the table without significant code modifications.\
    \ In fact, you can move the buttons around in this table without changing any\
    \ other lines of code. The buttons are defined as follows:\n\n```\n/*\n * This\
    \ is the button list. Each button is documented here so\n * we can access it.\n\
    \ */\ntypCalculatorButton buttonlist[] = {\n    \"C\", 1, 0, NULL},      /* Clear\
    \ ... */\n    \"CE\", 1, 1, NULL},     /* Clear ... */\n    \"/+\", 1, 3, NULL},\
    \     /* Division ... */\n\n    \"7\", 2, 0, NULL},      /* Digit ... */\n   \
    \ \"8\", 2, 1, NULL},     /* Digit ... */\n    \"9\", 2, 2, NULL},     /* Digit\
    \ ... */\n    \"*\", 2, 3, NULL},     /* Multiplication ... **/\n    \"%\", 2,\
    \ 4, NULL},     /* Percent ... */\n\n    \"4\", 3, 0, NULL},      /* Digit ...\
    \ */\n    \"5\", 3, 1, NULL},     /* Digit ... */\n    \"6\", 3, 2, NULL},   \
    \  /* Digit ... */\n    \"-\\-\", 3, 3, NULL},     /* Subtraction ... */\n   \
    \ \"1/x\", 3, 4, NULL},    /* 1/x ... */\n\n    \"1\", 4, 0, NULL},      /* Digit\
    \ ... */\n    \"2\", 4, 1, NULL},     /* Digit ... */\n```"
