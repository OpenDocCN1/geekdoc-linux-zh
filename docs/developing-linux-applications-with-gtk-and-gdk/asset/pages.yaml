    # Singly Linked Lists


    The GLIB library has useful functions for storing data in linked lists. The linked-list
    data type is a GSList, and the functions that modify the linked list either by
    adding or deleting elements return a GSList pointer. The GSList data structure
    has two parts defined as follows:


    ```

    gpointer data;

    GSList *next;

    ```


    The data field in the structure stores the data, which is usually a pointer to
    another structure. The next field is a pointer to the next element in the linked
    list. Figure 2.1 illustrates this arrangement.


    | data |

    | next |

    | data |

    | next |

    | data |

    | next |

    | data |

    | next |


    Figure 2.1 GSList.'
