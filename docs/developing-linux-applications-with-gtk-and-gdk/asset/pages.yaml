  md: "# The Calculator Program\n\n```\n{\"3\"\n```\n\nThe formula calculates the\
    \ number of buttons in the array:\nint nButtons = sizeof(buttonList) / sizeof(typCalculatorButton);\n\
    \nThis automatically calculates the number of buttons in the array at compile\
    \ time so you don't have to adjust the number as you add or delete buttons. This\
    \ method is clearly better than defining the array with a constant and updating\
    \ the each time buttons are added or deleted.\n\nIn addition to the table with\
    \ the button information (buttonList), the application needs other global variables,\
    \ for example, the label used to display results. A label represents the LCD screen\
    \ of the calculator, because controlling what types get into the LCD is easier\
    \ if the user cannot actually type directly into the widget. Any key press is\
    \ trapped by the application window. The application window updates the label\
    \ after filtering characters that don't belong in the field.\n\n# Main Program\n\
    \nNow that the data calculator and the data structures have been explained, you\
    \ can start to write the code. The main function performs the setup required to\
    \ start the calculator. Windows have to be created and positioned, and the signal\
    \ callbacks have to be placed so that the gtk_main function can be called to start\
    \ processing signals. The first step is to initialize GTK+ and create the application\
    \ window.\n\n```\nint main (int argc, char *argv[])\n{\n  GtkWidget *window;\n\
    \  GtkWidget *table;\n```\n\n```\n/* --- GTK initialization --- */\nggtk_init(&argc,\
    \ &argv);\n\n/* --- Create the calculator window --- */\nwindow = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    ```\n\nIdeally, you should give the application a descriptive title as well as\
    \ set the minimum window size because the application is a little too small for\
    \ the user to be able to click on the buttons with a mouse."
