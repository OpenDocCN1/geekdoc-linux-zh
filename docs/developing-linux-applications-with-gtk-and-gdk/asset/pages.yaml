  md: '# Chapter 4 Basic Widgets


    ![](img/0c25d93d8fa983d9a11557943feed9d0_71_0.png)


    Figure 4.3 GtkCheckButton.


    The GtkCheckButton can be created with a label by using the gtk_check_button_new_with_label
    function or without a label by using the gtk_check_button_new_function. Because
    the GtkCheckButton was derived from the GtkToggleButton, the same functions and
    events that apply to the GtkToggleButton also apply to the GtkCheckButton.


    The toggle button code can be converted into a GtkCheckButton example by replacing
    the code that creates the toggle button. The old toggle button code


    ```

    /* Create a new button */

    button = gtk_toggle_button_new_with_label("Top Toggle Button");

    can be replaced with the following GtkCheckButton code:

    /* Create check buttons */

    check = gtk_check_button_new_with_label(szLabel);

    ```


    The previous example is now an example of the GtkCheckButton instead of toggle
    buttons.


    # Radio Buttons


    At glance, radio buttons (GtkRadioButton) look like the GtkCheckButtons. The radio
    buttons'' appearance suggests that they are derived from the GtkCheckButton. The
    GtkRadioButton has a minor change to its behavior to distinguish it from the GtkCheckButton
    (see Figure 4.4). With the GtkRadioButton, only one of the buttons in a group
    can be selected at any time. Clicking one of the buttons unselects the previously
    selected button, and that which clicked becomes selected.


    GtkRadioButton can be created with a label by using


    gtk_radio_button_new_with_label function or without a label by using the gtk_radio_button_new_function.
    Creating the GtkRadioButton is only half of the work, though, because the radio
    button must be associated with a group so that only one of the buttons is selected
    at any time. Each time a radio button is created, the gtk_radio_button_group function
    needs to be called with the radio button and add the button to the group. The
    first time a button is added to a group, NULL should be used as the group. (The
    group is really a singly linked list [GSList] keeping track of the buttons in
    the group.)'
