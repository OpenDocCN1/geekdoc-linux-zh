    \ list of items to pick from and displaying the currently selected item.\n\n#\
    \ Containers\n\nContainers (GtkContainers) are widgets that can be parents to\
    \ other widgets by placing those other widgets within the container widget. You\
    \ cannot create a container widget, because there is no gtk_container_new_function,\
    \ but container widgets are used all the time. The main window in earlier examples,\
    \ buttons, and list boxes are some examples of container widgets. The chief purpose\
    \ of the container widget is to provide common functions that can be used on all\
    \ container widgets without writing a specific set of functions for each widget."
