    be displayed, they must be added to the packing box and the packing box must be
    added to a container and the packing box must be visible, even though the packing
    box does not have any visible components. The visibility affects the widgets added
    to the container. Figure 3.4 shows buttons placed in vertical and horizontal packing
    boxes.


