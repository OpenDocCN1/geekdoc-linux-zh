  md: "# Pixmaps\n\nDisplaying graphical images in buttons and other widgets requires\
    \ pixmaps. Pixmaps are image widgets frequently used as icons on buttons or other\
    \ widgets to provide a graphical illustration of what the button or widget does.\
    \ Toolbars within applications have a whole row of graphical buttons because they\
    \ take up less space than text-based buttons do provide a quick way for a user\
    \ to find the toolbar version of command. One way to create a pixmap is to create\
    \ it from a graphical editor (like the GIMP) and save the file as an xpm file.\
    \ Here's an xpm file created from the GIMP (comments added):\n\n```\nstatic const\
    \ gchar *xpm_open[] = {\n    \"16 16 4 1\",/* 16 16 bitmap, 4 colors, 1 char/color\
    \ */\n    \"c None\",/* color 1 - 'B' = transparent color */\n    \"B c #0000000000000000\"\
    ,/* color 2 - 'B' = black */\n    \"Y c #FFFFFFFF\",/* color 3 - 'Y' = yellow\
    \ */\n    \"y c #9999999999999999\",/* color 4 - 'y' = dark yellow */\n\n    \"\
    \",\n    \"BBBB BB BB\",\n    \"BYYY BB\",\n    \"BYYYYYBBBBBB\",\n    \"YYYYYYYYYYYYYY\"\
    ,\n    \"YYYYYYYYYYYYYY\",\n    \"BYBBBBBBBBBBBB\",\n    \"BYByyyyyyyyyyyB\",\n\
    \    \"BYByyyyyyyyyyyB\",\n    \"BBByyyyyyyyyyyB\",\n    \"BBByyyyyyyyyyyyyyyyyyyB\"\
    ,\n    \"BBByyyyyyyyyyyyyyyyyyyB\",\n    \"BBBBBBBBBBBBBBBB\",/* image data ends\
    \ here */\n\n};\n```\n\nThe xpm file consists of three sections: the header, the\
    \ color table, and the bitmap data. The header is the first string in the array.\
    \ The string looks something like \"16 16 4 1\" where the first two numbers are\
    \ the height and width of the image, the third number is the number of colors\
    \ defined in the string array, and the fourth is the number of characters per\
    \ color. In the example, \"16 16 4 1* indicates that the image has a height of\
    \ 16 pixels and a width of 16 pixels. The third number defines the number of strings\
    \ after the header that make up the color data. This example, therefore, has four\
    \ lines of color data:\n\n+   \"c None\",\n\"B c #0000000000000000\",\n\"Y c #FFFFFFFF\"\
    ,\n\"y c #9999999999999999\","
