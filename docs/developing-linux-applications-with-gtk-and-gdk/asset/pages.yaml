    Creating widgets is easy. Widgets provide applications with an interface much
    simpler than than the widget internals suggest. Widgets can be created by inheriting
    much of their behavior from existing widgets, or they can be created from scratch.
    Creating the widgets from scratch requires more work and coding, but allows more
    flexibility.'
