  md: "```\n/* ... If the keystroke is the first character of a button AND ---\n*/\n\
    /* ... the button label length is one. ... */\nif (event->keyval == buttonList[nIndex].szLabel[0]\
    \ &&\n    buttonList[nIndex].szLabel[1] == (char) 0) {\n    /* ... Set focus to\
    \ that button ... */\n    gtk_widget_grab_focus(buttonList[nIndex].widget);\n\
    \    /* ... Make like the button was clicked to do processing. ... */\n    gtk_button_clicked(GTK_BUTTON\
    \ (buttonList[nIndex].widget));\n    return;\n}\n}\n```\n\nIf a button is pressed\
    \ or a key on the keyboard is pressed, the button_clicked handler will be called.\
    \ The button_clicked function keeps track of the state of the calculator and performs\
    \ any operations or adds digits to the LED display using the gtk_label_set function.\
    \ Store, the button_clicked function could have been written to handle operator\
    \ precede, parentheses, more calculations (sin, cos, tan), and hex binary conversions,\
    \ but doing so is left as an exercise for the reader.\nThe button_clicked has\
    \ two distinct cases. The user presses a digit (0–9) or call for an operation.\
    \ If the user presses a digit, it usually means that the digit need to be added\
    \ to the display. For instance, if the display shows “45” and the user presses\
    \ “2”, then the display should read “452”. The exception is when the previous\
    \ command was a binary operator. If the user typed in a binary operator (+/-),\
    \ the display still shows the first part of the command, but the digit should\
    \ not be added. Instead, the display should be replaced with the new number, as\
    \ it is the first digit of the second number that makes up the binary operation.\n\
    If an operator is entered, the number saved in the buffer is used with the number\
    \ in the display. For instance, if the user types “235+111”, so far, no calculations\
    \ are performed. When the user types “=”, the calculator looks up the previous\
    \ command (“+”), the number saved in the buffer (“235”), and the number in the\
    \ display (“111”). The calculator must then perform the addition of “235” and\
    \ “111”. This same situation would occur if the user typed in the “+” instead\
    \ of the “=” after entering “235+111”. The difference is that the second “+” would\
    \ put the calculator in a mode to add the next number that would be.\n\n+   *\
    \ button_clicked\n* widget - button pressed."
