  md: '# Examining How Widgets Work 457


    # C Implementation Code


    The C file is a bit more complicated than the header. Fortunately, much of the
    code can be copied (with some modifications) from existing widgets. The first
    step is to enumerate the signals that are going to be defined by the widget. (Do
    not include signals that are already defined in the widget that is used as the
    base widget.) The GtkButton widget defines the following signals followed by the
    LAST_SIGNAL indicator:


    ```

    enum {

    PRESSED,

    RELEASED,

    CLICKED,

    ENTER,

    LEAVE,

    LAST_SIGNAL;

    };

    ```


    However, the GtkToggleButton, which uses the GtkButton as its base class, has
    only to define any new signals that are specific to the toggle button. The toggle
    button needs to add a "toggled" signal, so it defines its new signals as


    ```

    enum {

    TOGGLED,

    LAST_SIGNAL;

    };

    ```


    Every widget needs to have a get_type function that provides GTK+ with information
    about the widget. The information is packed into a GtkTypeInfo structure and passed
    to Gtk_type_unique to uniquely identify the new widget. The GtkTypeInfo requires
    the following information:


    +   - Widget''s name

    - Object size (for example, how big is a GtkButton?)

    - Class size (for example, how big is a GtkButtonClass?)

    - Class initialization function

    - Object initialization function

    - Set argument function

    - Get argument function'
