  md: "```\ntypedef struct {\n    int seq;\n    int x;\n    int y;\n    int height;\n\
    \    int width;\n    int nSequences;\n    typSprite *sprites;\n} typActor;\n```\n\
    \n# Loading the Images\n\nThe LoadPixmaps function associates the typActor with\
    \ the typSprite so that the actor can keep track of the sprite that's being displayed\
    \ and where it is on the screen. You call the pixmap with the window, the actor,\
    \ and the array of sprites that is going to be displayed for the actor. Here,\
    \ the walk sprite array is associated with the actor and initialized.\n\nLoadPixmaps\
    \ (window, &mask, walk);\n\nThe code for the LoadPixmaps function converts each\
    \ .xpm data image into pixmap and mask data is stored in the typActor structure,\
    \ and the typActor is initialized with the number of sprites in the sequence and\
    \ the size of the sprites.\n\n```\nvoid LoadPixmaps (GtkWidget *widget,\n    \
    \           typActor *actor,\n               typSprite *sprites)\n{\n    int i\
    \ = 0;\n    /* --- Get every sequence --- * */\n    while (sprites[i].xpm_data)\
    \ {\n        /* --- Convert xpm data to pixmap & mask --- * */\n        sprites[i].pixmap\
    \ = gdk_pixmap_create_from_xpm(\n                            widget->window,\n\
    \                            &sprites[i].mask,\n                            NULL,\n\
    \                            sprites[i].xpm_data);\n\n        i++;\n    }\n  \
    \  /* --- Get sprite height and width --- * */\n```"
