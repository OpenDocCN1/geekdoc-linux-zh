  md: '# Creating Your Own Widgets


    AT SOME POINT IN DEVELOPMENT, THE EXISTING widgets will probably fall short: perhaps
    a game needs a radar screen widget or an application needs to display many graphs.
    While GTK+ has a large set of widgets included, it is impossible to develop a
    set of widgets that meet everyone''s development needs. Fortunately, GTK+ provides
    an interface that enables developers to extend the standard widget set.


    # Understanding Widgets


    One of the best ways to learn how to create new widgets is to read the readily
    available-source code for GTK+. It is a great learning tool when you have questions
    about how something was done. This chapter uses examples from GTK+ to illustrate
    how widgets are created.


    GTK+ was designed in an object-oriented manner. However, because it was implemented
    in C and C is not an object-oriented language, creating widgets that adhere to
    the object-oriented nature of GTK+ requires some knowledge. Fortunately, after
    the widget is created, using it in an object-oriented manner is quite easy—it''s
    just going to be a little difficult to actually understand all the tricks that
    went into making. Widgets are created with two files. One is the actual code that
    creates and defines the widget, and the other is a header file that defines the
    data structures and prototypes for the widget.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# Inheriting Behavior


    Widgets can be based on an existing widget, or they can be created from scratch.
    Basing the widget on an existing widget makes the coding easier if the Gtk already
    implements much of the behavior. The GtkToggleButton uses the GtkButton as its
    base and inherits the GtkButton behaviors because the GtkButton already implements
    much of the toggle button would need to code. The behavior specific to the toggle
    button is added to override the button behavior.


    # Creating from Scratch


    You can also create widgets from scratch, but this approach requires more work.
    Most widgets created from scratch use the GtkWidget as the base widget, which
    provides a minimal base to which the developer can add new functionality. A few
    widgets derive their base functionality from GtkMisc.


    Compared to widgets that use the GtkWidget as a base whenever possible the coding
    of other developers GtkMisc-based widgets are less resource intensive because
    they do not have an associated X Window; instead they use the parent''s X Window
    to perform drawing. However, GtkMisc-based widgets do not have an X Window with
    them, they have some limitations. For instance, the GtkLabel cannot receive mouse
    events. To get labels to receive mouse events, they have to be placed within a
    GtkEventBox. Labels can be derived from GtkMisc because it''s a display-only widget
    and doesn''t usually have to handle any mouse interaction.


    # Examining How Widgets Work


    Widgets should use other widgets as a base whenever possible to leverage the coding
    of other developers and to reduce code bloat. This part of the chapter looks at
    the sections of an existing widget and dissect the code to understand the different
    pieces of a widget. Most of the examples here are from the button widget, but
    they should be similar to any widget.


    # include File


    The widget include defines the data structures necessary for the widget as well
    as prototypes for the widget functions. An important feature of the include is
    that include files cannot be included multiple times; to avoid this problem, the
    widget header files might be used with C++, so they should mark the C routines
    as C routines for the linker. The C routines for the linker. The Gtk_button.h
    starts like this:


    ```

    #ifndef GTK_BUTTON_H_

    #define GTK_BUTTON_H_

    ```'
