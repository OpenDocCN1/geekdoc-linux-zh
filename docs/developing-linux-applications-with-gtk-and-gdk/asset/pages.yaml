    # Progress Bar


    Progress bar (GtkProgressBar) is a nifty little widget that is commonly used to

    display the current status of a time-consuming function. Displaying the progress
    of an

    action is certainly better than allowing the user to wonder how long the opera-

    is going to complete. The developer has total control of the progress bar

    widget because he or has to write the code to update the widget so that it displays

    correctly.


    The GtkProgressBar inherits much of its functionality from the GtkProgress widget-

    The GtkProgressBar and GtkProgressBar have a lot of functionality in use

    them that doesn''t need to be covered. We''re going to create a basic progress
    bar for use

    throughout the book when we''re doing time-consuming operations (see Figure 6.5).


    Creating a progress bar widget is done with the gtk_progress_bar_new or the

    gtk_progress_bar_new_with_adjustment function. After it is created, the progress
    bar

    widget can be updated with the gtk_progress_set_percent_function, and by passing
    in

    a new completion value where zero is not complete and are all totally complete.


    The widget is going to use a data structure to keep track of information about
    the

    progress bar. This information includes the dialog widget, the progress bar widget,
    a

    flag that indicates whether the dialog box can be closed, and information about
    the

    last known percentage shown on the progress bar widget.


    ```

    typedef struct {

    GtkWidget *progressbar;

    GtkWidget *window;

    int bProgressUp;

    int mLastPct;

    } typProgressData;

