    Packing boxes can be put into other packing boxes to create a screen full of widgets
    that are more than just a group of widgets vertically or horizontally. Usually,
    a row of widgets is placed in a horizontal packing box, and the horizontal packing
    box is placed with other horizontal packing boxes into a vertical packing. This
    process creates several rows of horizontal packing boxes that contain widgets
    that can be used to organize a screen.


    # Packing Tables


    Packing tables are like packing boxes in they allow you to put multiple widgets
    into a window, but packing boxes give you two-dimensional control over the placement
    of the widgets. Packing tables are like HTML tables:You can control the placement
    of an item by row and column, and objects can take up multiple rows or columns.
    The function to create a packing table looks something like this:


    ```

    table = gtk_table_new(rows, columns, homogeneous);

    ```


    The first arguments are the number of rows and columns to make the table. The
    number of rows and columns have to be known at table creation. The third argument,
    homogeneous, has the same effect on packing boxes: If the homogeneous flag is
    set to TRUE when the table is created, the table boxes within the table are sized
    to be the size of the largest widget in the table. If the homogeneous flag is
    set to FALSE, the width of each column would be set to the width of the largest
    widget in the column and the height of each row would be set to the height of
    the largest widget in that row.'
