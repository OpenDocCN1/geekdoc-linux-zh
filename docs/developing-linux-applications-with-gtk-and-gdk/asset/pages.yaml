  md: "# Using Sprites\n\nTo do the animation, you first need to define a sprite as\
    \ an .xpm image from which you can get a displayable pixmap and a mask. The mask\
    \ defines the area into which you want to draw. Although the images are rectangular,\
    \ you don't want to draw the entire rectangle on the background. A better approach\
    \ is to mask out the image area so that you don't draw where you don't have image\
    \ data.\n\nA man walking can be generated with three images—feet together, left\
    \ foot forward, and right foot forward. You can use the image with the feet together\
    \ twice as for the transition between the left foot forward and the right foot\
    \ forward and between the right foot forward and the left foot forward. The man\
    \ is carrying a book in one hand to demonstrate the swing of his arm in motion.\
