    # # Hash Tables\n\nGLIB has a set of functions for using hash tables. *Hash tables*\
    \ are a quick way to add and look up information: Items are added using a key,\
    \ which can be used to retrieve the value. Figure 2.3 illustrates how hash table\
    \ values are stored.\nHash tables require a callback function to compute the hashing\
    \ value, and the callback function must compute a fairly unique value.\n\n# #\
    \ Creating a Hash Table\n\nHash tables are created with the g_hash_table_new function\
    \ that returns a pointer to a GHashTable. The function requires a hashing function\
    \ and a comparison function. The hashing function computes the hashing value of\
    \ the key that determines which bucket the key is going to be added to. The comparison\
    \ function compares the keys when looking for an item. If you enter string data\
    \ into a hash table, a simple function to compute the hash mine might take the\
    \ first two characters of the string and add them together to create the hash.\n\
    \n```\n/*\n * Make a hash from the first two characters.\n */\nguint HashFunction\
    \ (gpointer key)\n{\n```"
