  md: '![](img/0c25d93d8fa983d9a11557943feed9d0_62_0.png)


    # 4 Basic Widgets


    BUILDING APPLICATIONS REQUIRES THE USE of many different widgets. The most common
    widgets used are the button widgets, the entry field widget, and the combo box
    widget. These widgets make up a large percentage of the widgets in applications,
    and understanding these basic widgets is important to understanding the more complicated
    widgets. In reality, basic widgets are very similar. Many are just containers
    for other widgets with properties that are particular to the widget; they also
    have common properties and functions that can be used to manipulate the widgets.


    # Common Widget Functions


    All button-creation functions return a pointer to a GtkWidget. The GtkWidget pointer
    can call generic functions that act on the widgets. One example of a generic function
    is the gtk_widget_show function. This function makes a widget visible or, at least,
    sets the visible attributes so that the widget can be seen on the screen if it''s
    within a visible parent. Many other functions also act on all widgets. Some, like
    gtk_widget_show, are used more frequently than others.'
