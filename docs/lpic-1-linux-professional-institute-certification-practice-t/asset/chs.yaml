  - 263. 265\n- 264. 266\n- 265. 267\n\n\n\n\n\n## 谁应该阅读此书\n\n假设你已经有一本与本书配套的教材，以便就考试所需的给定主题获取更深入的信息。然而，你也可以将本书作为一种独立的备习手段。\n\
  \n以下是关于此本书读者的一些基本假设：\n\n*   你使用过 Linux，或者正在通过此本书学习 Linux。\n*   你已使用电脑进行过基础操作。\n\
  *   你将此本书作为参加认证考试的练习手段。\n\n## 如何使用此书\n\n本书最好的用法是作为工具，测试你在考试指定的客观领域中的知识。书中对每个问题都提供了解释，在适用的情况下，还解释了为什么其他选项是错误的。理想情况下，本书应结合配套教材一起使用，以完整解释相关概念。\n\
  \n## 认证考试政策\n\nLinux 专业协会（LPI）概述了与认证及其他类似事项相关的各种政策。此外，其他适用的政策可能来自测试机构或组织。关于某些 LPI\
  \ 政策的更多信息可以在 [www.lpi.org/policies](http://www.lpi.org/policies) 找到。\n\n## 考试目标\n\
  \n以下列表包含 101 和 102 考试的主题及权重。此列表按照它们在书中涵盖顺序排列。你可以在相关章节的开头找到关于每个主题的更多信息，包括关键知识领域、文件、术语和实用。\n\
  \n## 考试 101-500\n\n### 主题 101：系统架构\n\n*   101.1 确定并配置硬件设置（权重 2）。\n*   101.2 启动系统（权重\
  \ 3）。\n*   101.3 更改运行级别/启动目标并关机或重启系统（权重 3）。\n\n## 主题 102：Linux 安装与包管理\n\n*   102.1\
  \ 设计磁盘布局（权重 2）。\n*   102.2 安装引导管理器（权重 2）。\n*   102.3 管理共享库（权重 1）。\n*   102.4 使用\
  \ Debian 包管理（权重 3）。\n*   102.5 使用 RPM 和 YUM 包管理（权重 3）。\n*   102.6 作为虚拟化客户的 Linux（权重\
  \ 1）。\n\n#### 主题 103：GNU 和 UNIX 命令\n\n*   103.1 在命令行下工作（权重 4）。\n*   103.2 使用过滤器处理文本流（权重\
  \ 2）。\n*   103.3 执行基础文件管理（权重 4）。\n*   103.4 使用流、管道和重定向（权重 4）。\n*   103.5 创建、监控和杀死进程（权重\
  \ 4）。\n*   103.6 修改进程执行优先级（权重 2）。\n*   103.7 使用正则表达式搜索文本文件（权重 3）。\n*   103.8 基础文件编辑\
  \ 3\n\n#### 主题 104：设备、Linux 文件系统、文件系统层次结构标准\n\n*   104.1 创建分区和文件系统（权重 2）。\n*   104.2\
  \ 维护文件系统的完整性（权重 2）。\n*   104.3 控制文件系统的挂载和卸载（权重 3）。\n*   104.4 已移除\n*   104.5 管理文件权限和所有权（权重\
  \ 3）。\n*   104.6 创建和更改硬链接与符号链接（权重 2）。\n*   104.7 查找系统文件并将文件放置在正确位置（权重 2）。\n\n###\
  \ 考试 102-500\n\n#### 主题 105：Shell 和 Shell 脚本\n\n*   105.1 自定义和使用 shell 环境（权重 4）。\n\
  *   105.2 自定义或编写简单脚本（权重 4）。\n\n#### 主题 106：用户界面和桌面\n\n*   106.1 安装并配置 X11（权重 2）。\n\
  *   106.2 图形桌面（权重 1）\n*   106.3 辅助功能（权重 1）\n\n#### 主题 107：管理任务\n\n*   107.1 管理用户和组账户及相关系统文件（权重\
  \ 5）。\n*   107.2 通过调度作业自动执行系统管理任务（权重 4）。\n*   107.3 本地化与国际化（权重 3）\n\n#### 主题 108：基本系统服务\n\
  \n*   108.1 维护系统时间（权重 3）。\n*   108.2 系统日志（权重 4）\n*   108.3 邮件传输代理 (MTA) 基础（权重 3）\n\
  *   108.4 管理打印机和打印（权重 2）。\n\n## 主题 109：网络基础\n\n*   109.1 互联网协议基础（权重 4）\n*   109.2\
  \ 持久化网络配置（权重 4）\n*   109.3 基础网络故障排除（权重 4）\n*   109.4 配置客户端 DNS（权重 2）。\n\n## 主题 110：安全\n\
  \n*   110.1 执行安全管理任务（权重 3）。\n*   110.2 设置主机安全（权重 3）。\n*   110.3 使用加密保护数据安全（权重 4）\n\
  \n# 第一部分\n\n## 考试 101-500\n\n# 第 1 章\n\n### 主题 101：系统架构\n\n以下内容涵盖了：\n\n**101.1 确定并配置硬件设置。**\n\
  *   关键知识领域：\n    *   默认运行级别。\n    *   切换运行级别/目标。\n    *   单用户模式。\n    *   关机和重启。\n\
  *   以下文件、术语和工具：\n    *   `/sys/`\n    *   `/proc/`\n    *   `/dev/`\n    *   `modprobe`\n\
  \    *   `lsmod`\n    *   \n    *   `/etc/inittab`\n    *   `shutdown`\n    *  \
  \ `init`\n    *   `/etc/init.d/`\n    *   `telinit`\n    *   `systemd`\n    *  \
  \ `systemctl`\n    *   `/etc/systemd/`\n    *   `/usr/lib/systemd/`\n    *   `wall`\n\
  \n**101.2 启动系统。**\n*   关键知识领域：\n    *   启动序列。\n    *   来自 BIOS/UEFI。\n    *   initramfs。\n\
  \    *   内核环形缓冲区。\n*   以下文件、术语和工具：\n    *   `dmesg`\n    *   `journalctl`\n    *\
  \   `BIOS`\n    *   `UEFI`\n    *   `init`\n    *   `init`\n\n**101.3 更改运行级别/启动目标并关机或重启系统。**\n\
  *   关键知识领域：\n    *   默认运行级别。\n    *   从命令行。\n    *   切换运行级别/目标。\n    *   单用户模式。\n\
  \    *   关机和重启。\n    *   终止进程。\n*   以下文件、术语和工具：\n    *   `systemctl`\n\n1.  种命令用于实时查看内核\
  \ udev 事件？\n    1. `udevls`\n    2. `lsudev -f`\n    3. `udevmon -a`\n    4. `udevadm\
  \ monitor`\n\n2. 哪种命令允许查看中断请求（IRQ）分配？\n    1. `view /proc/irq`\n    2. `cat /proc/interrupts`\n\
  \    3. `cat /dev/irq`\n    4. `less /dev/irq`\n\n3. udev 设备配置是通过操作哪个目录下的文件完成的？\n\
  \    1. `/udev/devices`\n    2. `/devices/`\n    3. `/udev/config`\n    4. `/etc/udev`\n\
  \n4. 这种命令用于自动加载模块及其依赖项？\n    1. `modprobe`\n    2. `lsmod`\n    3. `insmod`\n  \
  \  4. `rmmod`\n\n5. 哪种命令用于获取 USB 设备列表？\n    1. `usb-list`\n    2. `lsusb`\n    3.\
  \ `ls-usb`\n    4. `ls --usb`\n\n\n\n\n\n2. `boot-log`\n3. `krblog`\n4. `dmesg`\n\
  \n8. 在使用 `SysV init` 的 Linux 系统初始化过程中，哪一个运行级别（runlevel）对应单用户模式？\n1. Runlevel 5\n\
  2. Runlevel SU\n3. Runlevel 1\n4. Runlevel 6\n\n9. 在使用 `SysV init` 的系统中，服务的启动和关机脚本存储在哪个目录？\n\
  1. `/etc/init-d`\n2. `/etc/init`\n3. `/etc/sysV`\n4. `/etc/init.d`\n\n10. 哪条命令可以用于重启系统？\n\
  1. `init 6`\n2. `shutdown -h -t now`\n3. `init 1`\n4. `refresh-system`\n\n11. 使用基于\
  \ `SysV init` 的系统时，如果你更改了 `/etc/inittab` 文件并希望在不重启的情况下重新加载这些更改，你会使用哪条命令？\n1. `init-refresh`\n\
  2. `init 6`\n3. `telinit`\n4. `reload-inittab`\n\n12. 哪条命令显示系统当前的运行级别？\n1. `show-level`\n\
  2. `init --level`\n3. `sudo init`\n4. `runlevel`\n\n13. systemd 单元配置文件存储在哪个文件夹中？\n\
  1. `/etc/system.conf.d`\n2. `/lib/system.conf.d`\n3. `/lib/systemd/system`\n4. `/etc/sysconfd`\n\
  \n14. 使用 `systemd` 时哪个命令命令列出可用的服务单元？\n1. `systemd list-units`\n2. `systemctl list-units`\n\
  3. `systemd unit-list`\n4. `systemctl show-units`\n\n15. `lspci` 的哪个选项用于同时显示数字代码和设备名称？\n\
  1. `-numdev`\n2. `-n`\n3. `-nn`\n4. `-devnum`\n\n16. 哪条命令可以用于获取当前加载的内核模块列表？\n1.\
  \ `insmod`\n2. `modlist`\n3. `ls --modules`\n4. `lsmod`\n\n17. `modprobe` 命令的哪个选项可以显示给定模块的依赖关系？\n\
  1. `--show-options`\n2. `--list-deps`\n3. `--show-depends`\n4. `--list-all`\n\n\
  18. 你可以使用哪条命令向当前登录系统的所有用户发送消息？\n1. `cat`\n2. `wall`\n3. `tee`\n4. `ssh`\n\n19. 当\
  \ Linux 内核未检测到硬盘时，以下哪项良好的第一个排排除步骤？\n1. 拔掉磁盘。\n2. 检查系统 BIOS。\n3. 重启 Web 服务器服务。\n\
  4. 运行 `disk-detect` 命令。\n\n20. USB 设备的信息存储在哪个目录中？\n1. `/etc/usbdevices`\n2. `/var/usb`\n\
  3. `/lib/sys/usb`\n4. `/sys/bus/usb/devices`\n\n21. 如果内核环形缓冲区被覆盖，你可以在哪个文件中查找启动消息？\n\
  1. `/var/log/bootmessages`\n2. `/var/log/mail.info`\n3. `/var/adm/log/boot.info`\n\
  4. `/var/log/dmesg`\n\n22. 哪条命令和选项可以确定给定服务是否已加载？\n1. `systemctl --ls`\n2. `telinit`\n\
  3. `systemctl status`\n4. `sysctl -a`\n\n23. 在由 `systemd` 控制的系统中，哪条命令会将系统置于单用户模式？\n\
  1. `systemctl one`\n2. `systemctl isolate rescue.target`\n3. `systemctl single-user`\n\
