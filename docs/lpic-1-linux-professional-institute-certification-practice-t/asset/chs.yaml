  #### 主题 108：基本系统服务\n\n本章涵盖了以下考试目标：\n\n### 108.1 维护系统时间\n\n**关键知识领域：**\n\n* 设置系统日期和时间。\n\
  * 将硬件时钟设置为正确的 UTC 时间。\n* 配置正确的时区。\n* 使用 `ntpd` 和 `chrony` 基本 NTP 配置。\n* 使用 `pool.ntp.org`\
  \ 服务知识。\n* 对 `ntpq` 命令的了解。\n\n以下是所用文件、术语和工具的部分列表：\n\n* `/usr/share/zoneinfo/`\n\
  * `/etc/timezone`\n* `/etc/localtime`\n* `/etc/ntp.conf`\n* `/etc/chrony.conf`\n\
  * `date`\n* `hwclock`\n* `timedatectl`\n* `ntpd`\n* `ntpdate`\n* `chronyc`\n* `pool.ntp.org`\n\
  \n### 108.2 系统日志\n\n**关键知识领域：**\n\n* `rsyslog` 的基本配置。\n* 理解标准设施（facilities）、优先级（priorities）和操作（actions）。\n\
  * 查询 systemd journal。\n* 按日期、服务或优先级等标准过滤 systemd journal 数据。\n* 配置持久化 systemd journal\
  \ 存储和 journal 大。\n* 删除旧的 systemd journal 数据。\n* 从救援系统或文件系统副本检索 systemd journal 数据。\n\
  * 理解 `rsyslog` 与 `systemd-journald` 的交互。\n* `logrotate` 的配置。\n* 对 `syslog` 和 `syslog-ng`\
  \ 的了解。\n\n以下是所用文件、术语和工具的部分列表：\n\n* `/etc/rsyslog.conf`\n* `/var/log/`\n* `logger`\n\
  * `logrotate`\n* `/etc/logrotate.conf`\n* `/etc/logrotate.d/`\n* `journalctl`\n\
  * `systemd-cat`\n* `/etc/systemd/journald.conf`\n* `/var/log/journal/`\n\n### 108.3\
  \ 邮件传输代理 (MTA) 基础\n\n**关键知识领域：**\n\n* 创建邮件别名。\n* 配置邮件转发。\n*  MTA 程序（`Postfix`、`sendmail`、`Exim`）的知识（无需配置）。\n\
