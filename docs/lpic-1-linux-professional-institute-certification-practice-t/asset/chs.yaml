  \ `grep` 命令使其不区分大小写。与 `-v` 选项配合使用时，`grep` 将排除参数从而执行与此处所需相反的操作。内核环缓冲区可能不包含关于 `DHCP`\
  \ 的信息，因此 `dmesg` 是错误的选项。\n\n72. B. 在 `/etc/hosts` 中，主机只有字母数字、减号/连线和点是有效的。\n\n73.\
