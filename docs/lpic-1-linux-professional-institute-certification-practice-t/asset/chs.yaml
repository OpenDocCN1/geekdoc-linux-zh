  \ C\n`lpstat` 命令用于此目的。`lpstat` 命令显示有关打印机、打印作业和相关信息。`-W` 选项指定显示哪些作业、已完成或未完成的作业。选项所示的\
  \ `lpq` 命令用于查看队列，其他选项无效。\n\n### 36. D\n日志轮转配置中的 `postrotate` 选项可用于此目的。在 `postrotate`\
