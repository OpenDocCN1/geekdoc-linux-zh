  \ A。\n\n### 28. D\n`postsuper -d` 命令从队列中删除消息。`ALL` 关键字会导致所有消息从队列中删除。在执行此操作时应小心，因为它是不可逆的。`postqueue`\
  \ 没有 `-remove` 选项，且 `Postfix` 的 `-f` 选项与之无关。所示的 `rm -rf` 命令不够具体，且通常不建议从邮件队列中手动删除文件。\n\
  \n### 29. A\n显示的 URL 将显示本地 `CUPS` 服务器的作业区域，其查询字符串名称为 `which_jobs`，值为 `completed`。显示的其他\
  \ URL 都是无效的。\n\n### 30. C\n正如 `tail -f` 命令会在添加新内容时持续更新显示一样，`-f` 选项也会为 `journalctl`\
