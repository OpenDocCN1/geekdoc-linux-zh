  \ `journalctl` 命令实现此目的。添加 `-u` 选项指定所需的日志条目的单元。\n\n75. A. `/etc/hostname` 文件通常只包含本地计算机的\
  \ `hostname`，而不是 `hostname` 和域名。这在启动时被读取以设置计算机的 `hostname`。`/etc/hosts` 文件包含用于名称解析的各种主机信息。其他文件并不存在。\n\
  \n76. B. `traceroute6` 命令用于追踪 `IPv6` 路由。其他命令不存在。\n\n77. D. `axfr` 类型可以配合 `dig` 使用来请求区域传输。请求区域传输的客户端需要获得授权发起传输。\n\
  \n78. A. 将 `-a` 设置为 `host` 命令的选项会将查询类型设置为 `ANY`。`-c` 选项设置类别，`-d` 开启调试。没有 `-b` 选项。\n\
  \n79. C. 当在用户的家目录中创建 `.digrc` 文件时，该文件可用于设置使用 `dig` 命令的默认值。在 `/etc` 中未找到 `dig` 配置文件。\n\
  \n80. D. `POP3` 服务器在 `DNS` 中没有特定类型。`MX` 类型表示邮件交换器，或 `SMTP` 服务器。\n\n81. A. 使用 `ip\
  \ addr add` 命令通过选项 A 所示的语法向接口添加 `IP` 地址。其他选项的语法不正确。\n\n82. B. `resolvectl` 命令用于协助解决\
