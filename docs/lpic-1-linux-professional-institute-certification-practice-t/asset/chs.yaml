  \ `link` 命令。\n\n### 55. B\n`iwconfig` 命令类似于 `ifconfig`，用于设置和显示无线接口参数。在其他选项中，其余均无效。\n\
  \n### 56. C\n`iwlist` 命令将用于此目的，`scan` 子命令用于查找热点和网络。需要超级权限。`ifconfig` 命令没有 `scan`\
  \ 子命令。同样，`iwlist` 命令没有 `get` 子命令。\n\n### 57. B\n`NTP` 默认监听 UDP 端口 `123`。端口 `20`\
  \ 和 `21` 用于 FTP 服务，端口 `139` 用于 NetBIOS，端口 `5150` 通常未使用。\n\n### 58. B\n`mtu` 可设置接口的最大传输单元（MTU）值。`metric`\
  \ 选项设置接口跃数。其他选项无效。\n\n### 59. A\n`-s` 选项创建 ARP 表项。`-d` 选项删除条目。`-c` 和 `--add` 选项不存在。\n\
  \n### 60. A\n`ss` 命令提供了 `netstat` 的许多功能，但可以显示套接字的内存分配。`free` 命令显示内存使用情况但不分套接字，另外两个命令不存在。\n\
  \n### 61. D\n`-f` 选项是洪泛 ping。这将导致接口发送和接收大量流量，便于在交换机上发现。`-a` 选项是听性 ping，在 ping 时会发出声音。`-c`\
  \ 选项发送指定次数的 ping，没有 `-e` 选项。\n\n### 62. B\n`netcat` 命令提供了一种在双方（服务器和客户端）都打开并通信 TCP\
  \ 连接的方法。`netcat` 命令避免了 `telnet` 捕捉特定于协议的字符的问题。`netstat` 命令不测试连通性，`ping` 在 TCP 级别也不这样做。没有\
  \ `nettest` 命令。\n\n### 63. C\n`-D` 选项列出计算机上的接口。`-d` 选项转储代码，`-i` 选择接口。\n\n### 64.\
  \ A\n`ping6` 命令的功能与 `IPv4` ping 命令相同，但针对的是 IPv6。其他命令在 Linux 上无效。\n\n### 65. B\n\
  可以使用 `ip` 命令用于此目的。当配合 `addr` 对象和 `-6` 选项使用时，将仅显示关于 IPv6 地址的信息。第一个选项简单地 `ip addr`\
  \ 将显示所有地址，包括 IPv4。\n\n\n\n\n\n66. A. 将使用 `ifconfig` 命令实现此目的，并在 `arp` 单词前加上减号来禁用\
  \ `ARP`，如所示。如果没有减号，则将启用 `ARP`。其他命令不适用于此场景。\n\n67. C. `dev` 选项指定用于所指路由的设备。这是许多路由的典型用例，旨在减少内核猜测错误的概率。此问题中显示的其他选项无效。\n\
  \n68. C. `-p` 选项在 `ss` 输出中显示与给定 socket 关联进程 ID（PID）。`-a` 选项表示所有 socket，而 `-l` 是监听\
  \ socket。`-f` 选项用于指定协议族。\n\n69. C. `-I` 选项告诉 `traceroute` 使用 `ICMP` 进行请求。`-T` 选项是\
