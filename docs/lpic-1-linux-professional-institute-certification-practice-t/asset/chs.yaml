  # 第 10 章\n\n## 主题 110: 安全\n\n本章涵盖了以下考试目标：\n\n*   **110.1 执行安全管理任务。**\n    *   关键知识领域：\n\
  \        *   审计系统以找到找到 suid sgid 位的文件。\n        *   设置或更改用户密码和密码过期信息。\n        *\
  \   能够使用 `nmap` 和 `netstat` 发现系统上的开放端口。\n        *   设置用户登录、进程和内存使用的限制。\n      \
  \  *   确定哪些用户已登录系统或当前正在登录。\n        *   基础 `sudo` 配置和使用\n\n    *   以下是所用文件、术语和工具的部分列表：\n\
  \n\n\n\n\n- `find`\n- `passwd`\n- `fuser`\n- `lsof`\n- `nmap`\n- `chage`\n- `netstat`\n\
  - `sudo`\n- `/etc/sudoers`\n- `su`\n- `usermod`\n- `ulimit`\n- `who`, `w`, `last`\n\
  \n## ![images](img/correction.png) 110.2 设置主机安全。\n\n### 关键知识领域：\n- 影子密码及其工作原理的认知\n\
  - 关闭未使用的网络服务。\n- 理解 TCP wrappers 的作用。\n\n以下是使用的文件、术语和工具的部分列表：\n- `/etc/nologin`\n\
  - `/etc/passwd`\n- `/etc/shadow`\n- `/etc/xinetd.d/`\n- `/etc/xinetd.conf`\n- `systemd.socket`\n\
  - `/etc/inittab`\n- `/etc/init.d/`\n- `/etc/hosts.allow`\n- `/etc/hosts.deny`\n\n\
  ## ![images](img/correction.png) 110.3 使用加密保护数据\n\n### 关键知识领域：\n- 执行基础 OpenSSH 2\
  \ 客户端配置和使用。\n- 理解 OpenSSH 2 服务端主机密钥的作用。\n- 执行基础 GnuPG 配置、使用和撤销。\n- 使用 `GPG` 对文件进行加密、解密、签名和验证。\n\
  - 理解 SSH 端口隧道（包括 X11 隧道）。\n\n以下是使用的文件、术语和工具的部分列表：\n- `ssh`\n- `ssh-keygen`\n- `ssh-agent`\n\
  - `ssh-add`\n- `~/.ssh/id_rsa` 和 `id_rsa.pub`\n- `~/.ssh/id_dsa` 和 `id_dsa.pub`\n\
  - `~/.ssh/id_ecdsa` 和 `id_ecdsa.pub`\n- `~/.ssh/id_ed25519` 和 `id_ed25519.pub`\n\
  - `/etc/ssh/ssh_host_rsa_key` 和 `ssh_host_rsa_key.pub`\n- `/etc/ssh/ssh_host_dsa_key`\
  \ 和 `ssh_host_dsa_key.pub`\n- `/etc/ssh/ssh_host_ecdsa_key` 和 `ssh_host_ecdsa_key.pub`\n\
  - `/etc/ssh/ssh_host_ed25519_key` 和 `ssh_host_ed25519_key.pub`\n- `~/.ssh/authorized_keys`\n\
  - `ssh_known_hosts`\n- `gpg`\n- `gpg-agent`\n- `~/.gnupg/`\n\n1. 你需要临时防止用户通过 `ssh`\
  \ 或其他手段登录系统。以下哪项描述了实现此任务的方法？\n   1. `touch /etc/nologin`\n   2. 禁用 `sshd`。\n   3.\
  \ 删除 `/etc/login`。\n   4. 添加一个影子文件。\n\n2. 以下哪个命令在整个文件系统中搜索设置了 setuid 位的文件？\n   1.\
  \ `find ./ -perm suid`\n   2. `find / -perm 4000`\n   3. `find / -type suid`\n \
  \  4. `find / -type f -perm setuid`\n\n3. 以下哪个命令显示当前打开的端口以及使用该端口的进程？\n   1. `netstat\
  \ -a`\n   2. `lsof -i`\n   3. `ps auwx`\n   4. `netlist`\n\n4. 你正尝试使用 `umount` 命令卸载文件系统。然而，当你操作时收到消息指示文件系统正在被使用。以下哪个命令可以确定哪个进程正保持文件系统打开？\n\
  \   1. `fuser`\n   2. `ls`\n   3. `find`\n   4. `ps`\n\n5. 以下哪个命令显示账户信息，如过期日期、最后密码修改日期和其他相关细节？\n\
  \   1. `usermod -l`\n   2. `userinfo -a`\n   3. `chageuser -l`\n   4. `chage -l`\n\
  \n6. 以下哪个命令扫描 IP 地址 `192.168.1.154` 的开放端口？\n   1. `nmap 192.168.1.154`\n   2. `lsof\
