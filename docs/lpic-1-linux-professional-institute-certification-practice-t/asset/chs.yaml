  \n86. B. `hostnamectl` 内的 `set-hostname` 命令设置设备的 `hostname`。显示的其他命令不适用于 `hostnamectl`。\n\
  \n87. A. `IMAPS` 默认使用端口 `993`，由 `IANA` 定义。端口 `995` 是 `POP3S`，端口 `465` 是 `SMTPS`，端口\
  \ `514` 用于 `syslog`。\n\n88. B. `-o` 选项从输出中删除换行符，使输出更适用于 `grep` 命令。`-l` 选项指定 `ip\
  \ addr flush` 命令的循环次数，`-f` 选项指定协议族，没有 `-n` 选项。\n\n## 第 10 章：主题 110：安全\n\n1. A. 如果\
  \ `/etc/nologin` 存在，用户将被阻止登录系统。假设 `ssh` 配置中启用了 root 登录，`root` 用户仍可以登录。\n\n2. B.\
  \ 将使用 `find` 命令实现此目的，权限可以描述为 `4000` 以表示存在 `setuid` 位。`-type` 选项可用于更改返回的对象类型，但与描述的场景无关。\n\
  \n3. B. 可以使用 `lsof` 命令实现此目的，并通过 `-i` 选项显示网络端口及其对应的进程。`netstat` 命令在带有 `-a` 选项运行时将显示网络端口。没有\
  \ `netlist` 命令。\n\n4. A. 可以使用 `fuser` 命令确定哪个进程正在使用给定文件。`ls` 命令显示文件，`find` 可用于查找文件但不是专门查找。\n\
  \n5. D. `chage` 命令用于处理账户老化信息，如过期日期、密码更改之间的天数等。`-l` 命令列出给定账户的信息。\n\n6. A. `nmap`\
  \ 命令用于扫描开放端口。默认情况下，`nmap` 将扫描指定地址或多个地址的开放端口。其他命令不扫描开放端口。\n\n7. B. `ssh-keygen` 命令用于创建密钥对以替代密码用于\
  \ `ssh`。其他选项中，`ssh` 命令确实存在，但 `-k` 选项用于禁用通用安全应用程序接口 (`GSSAPI`) 凭据转发。\n\n8. B. 格式为\
  \ `用户名`（或其他指定符）后跟 `hard` 或 `soft`（取决于限制类型），然后是关键字，以及该关键字的值。\n\n9. A. 存储在家目录 `.ssh`\
  \ 目录下的 `authorized_keys` 文件包含授权使用其相应私钥登录服务器的公钥。\n\n10. C. `-p` 选项显示连接到给定端口的进程 ID，对于显示哪个进程正在监听给定端口非常有用。`-a`\
  \ 选项显示监听和非监听的 socket，而 `-n` 禁用名称查找。\n\n11. D. 使用 `-f` 选项加载备用文件。这样做有助于所描述的场景，即能够从旧日志文件中检查登录情况。\n\
  \n12. D. `w` 命令显示当前登录的用户以及运行时间和平均负载负载等信息。`fuser` 命令用于显示打开的文件，`ls` 的 `-u` 选项控制文件列表的显示。\n\
  \n13. A. `-u` 选项用于此目的是正确的。大写的 `-U` 选项设置列出权限的用户上下文。`-s` 选项设置 shell，`-H` 选项设置家目录。\n\
  \n\n\n\n14. B. `NOPASSWD` 选项导致 `sudo` 在执行特定的 `sudo` 命令时不提示输入密码。这对于密码提示会引起问题的脚本化场景非常有用。\n\
  \n15. C. `ulimit` 命令显示此类限制，而 `-a` 选项显示当前登录用户的所有限制。其他命令无效。\n\n16. C. 阻塞对服务的访问的语法使用\
  \ `ALL` 关键字，后跟策略将适的地址或网络。\n\n17. A. `usermod` 命令的正确格式是 `YYYY-MM-DD`。\n\n18. C. `disable`\
  \ 选项用于所述目的，并可以设置为 `yes` 或 `no`。其他选项在此场景下是的。\n\n19. A. 文件默认名为 `id_rsa`，公钥名为 `id_rsa.pub`。对于\
  \ DSA 密钥，名称为 `id_dsa` 和 `id_dsa.pub`。根据算法的不同，还会使用如 `id_ecdsa`、`id_ecdsa.pub`、`id_ed25519`\
  \ 和 `id_ed25519.pub` 等其他密钥名称。对于客户端密钥，这些默认存储在 `~/.ssh/` 中。\n\n20. C. `-c` 选项执行单个命令但不通过交互式会话。`-s`\
  \ 选项指定要使用的 shell。`su` 命令没有 `-u` 或 `-e` 选项。\n\n21. A. `/etc/security/limits.conf`\
  \ 文件（在某些 Linux 发行版中该文件可能是 `/etc/limits.conf`）允许设置用户登录、进程、内存使用和其他资源的限制。图中显示的其他文件默认不存在。\n\
  \n22. B. 使用 `ssh` 在远程主机上执行单个命令不需要特殊的选项，尽管在包含空格时你可能需要将命令放在引号中。`-s` 选项请求子系统，与此场景无关。`-e`\
  \ 选项指定转义字符。\n\n23. D. `ssh-add` 命令用于列出当前加载的密钥，并配合 `ssh-agent` 一使用。`ssh-agent` 没有\
