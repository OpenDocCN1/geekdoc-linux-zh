  \ 的网络驱动器。\n\n卸载光片后，让我们在文件树的另一个位置重新挂载它。为了做到这一点，我们变为超级用户（使用适用于我们系统的命令），并使用 `umount`\
  \ 命令（注意拼写）卸载光片。\n\n为了在实验中重新挂载，我们需要创建一个非空目录。\n\n```bash\n[root@linuxbox ~]# mkdir\
  \ /mnt/cdrom\n```\n\n最后通过 `-t` 选项指定文件系统类型。\n\n```bash\n[root@linuxbox ~]# mount\
  \ -t iso9660 /dev/sdc /mnt/cdrom\n```\n\n\n\n此列表的内容揭示了一些设备命的模式。表 15-2 概述了其中一些模式。\n\
  \n### 表 15-2：Linux 存储设备名称\n\n| **模式** | **设备** |\n| --- | --- |\n| `/dev/fd**` |\
  \ 软盘驱动器。 |\n| `/dev/hd**` | 旧系统上的 IDE (PATA) 磁盘。典型的主板包含两个 IDE 接口或 `channels`，每个通道都有一根有两个硬盘连接点的电缆。电缆上的第一个硬盘被称为\
  \ `master`（主设备），第二个称为 `slave`（从设备）。设备名称的排序方式使得 `/dev/hda` 指向第一个通道上的主设备，`/dev/hdb`\
  \ 是第一个通道上的从设备；`/dev/hdc` 是第二个通道上的主设备，以此此类推。末尾的数字表示设备上的分区号。例如，`/dev/hda1` 指向系统中第一块硬盘上的第一个分区，而\
  \ `/dev/hda` 指向整个硬盘。 |\n| `/dev/lp**` | 打印机。 |\n| `/dev/sd**` | SCSI 磁盘。在现代 Linux\
  \ 系统中，内核将所有类磁盘设备（包括 PATA/SATA 硬盘、闪存盘以及便携音乐播放器和数字相机等 USB 存储设备）视为 SCSI 磁盘。命名系统的其余部分与之前描述的旧\
  \ `/dev/hd**` 命名方案相似。 |\n| `/dev/sr**` | 光驱（CD/DVD 阅读器和刻录机）。 |\n\n此外，我们经常看到诸如 `/dev/cdrom`、`/dev/dvd`\
  \ 和 `/dev/floppy` 等符号链接，它们指向实际设备文件，以提供便利性。\n\n如果你在一个不自动挂载可拔式设备的系统上工作，可以使用以下技术来确定插入可拔式设备时的名称。首先，启动\
  \ `/var/log/messages` 或 `/var/log/syslog` 文件的实时查看（这可能需要超级用户权限）。\n\n```bash\n[me@linuxbox\
  \ ~]$ sudo tail -f /var/log/messages\n```\n\n文件的最后几行将显示并暂停。接下来，插入可拔式设备。在这个例中，我们将使用一个\
  \ 16MB 的闪存盘。内核几乎立即就会注意到该设备并对其进行探测。\n\n```text\nJul 23 10:07:53 linuxbox kernel:\
  \ usb 3-2: new full speed USB device using uhci_hcd and address 2\nJul 23 10:07:53\
  \ linuxbox kernel: usb 3-2: configuration #1 chosen from 1 choice\nJul 23 10:07:53\
  \ linuxbox kernel: scsi3 : SCSI emulation for USB Mass Storage devices\nJul 23 10:07:58\
  \ linuxbox kernel: scsi scan: INQUIRY result too short (5), using 36\nJul 23 10:07:58\
  \ linuxbox kernel: scsi 3:0:0:0: Direct-Access   Easy   Disk   .00 PQ: 0 ANSI: 2\n\
  Jul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] 31263 512-byte hardware sectors\
  \ (16 MB)\nJul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] Write Protect is off\n\
  Jul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] Assuming drive cache: write through\n\
  Jul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] 31263 512-byte hardware sectors\
  \ (16 MB)\nJul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] Write Protect is off\n\
  Jul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb] Assuming drive cache: write through\n\
  Jul 23 10:07:59 linuxbox kernel:  sdb: sdb1\nJul 23 10:07:59 linuxbox kernel: sd\
  \ 3:0:0:0: [sdb] Attached SCSI removable disk\nJul 23 10:07:59 linuxbox kernel:\
  \ sd 3:0:0:0: Attached scsi generic sg3 type 0\n```\n\n显示再次暂停后，按下 CTRL-C 回到提示符。输出中有趣的部分是反复引用的\
  \ `[sdb]`，这符合我们对 SCSI 磁盘设备名称的预期。通过这一点，这两行变得特别具有启发性：\n\n```text\nJul 23 10:07:59\
  \ linuxbox kernel:  sdb: sdb1\nJul 23 10:07:59 linuxbox kernel: sd 3:0:0:0: [sdb]\
  \ Attached SCSI removable disk\n```\n\n这告诉我们整个设备的设备名称为 `/dev/sdb`，设备上第一个分区的名称为 `/dev/sdb1`。正如我们所看到的，操作\
  \ Linux 充满了有趣的工作！\n\n**提示** 使用 `tail -f /var/log/messages` 是监控系统运行的一种极佳方法。\n\n有了设备名称，我们现在可以挂载了。\n\
  \n```bash\n[me@linuxbox ~]$ sudo tail -f /var/log/messages\n```\n\n操作 Linux 充满了有趣的工作！\n\
  \n**提示** 挂载文件系统。\n\n```bash\n[me@linuxbox ~]$ sudo mkdir /flash\n[me@linuxbox ~]$\
  \ sudo mount /dev/sdb1 /flash\n```\n\n#### 使用 fdisk 操作分区\n\n`fdisk` 是一个可以直接与磁盘（如硬盘和闪盘）交互的工具。在使用它之前，必须先卸载设备。\n\
  \n```bash\n[me@linuxbox ~]$ sudo umount /dev/sdb1\n[me@linuxbox ~]$ sudo fdisk /dev/sdb\n\
  ```\n\n启动后，我们将看到如下提示：\n\n```text\nCommand (m for help):\nEntering a menu.\nCommand\
  \ action\n    a   toggle a boot flag\n    b   edit bsd disklabel\n    c   toggle\
  \ the dos flag\n    d   delete a partition\n    l   list known partition types\n\
  \    m   print this menu\n    n   add a new partition\n    o   create a new partition\
  \ table\n    p   print the partition table\n    q   quit without saving\n    s \
  \  create a new Sun disklabel\n    t   change a partition's system id\n    u   change\
  \ display/entry units\n    v   verify the partition table\n    w   write table to\
  \ disk and exit\n    x   extra functionality (experts only)\nCommand (m for help):\n\
  ```\n\n我们想要做的第一件事是检查现有的分区布局。我们通过输入 `p` 打印分区表来实现。\n\n```text\nCommand (m for help):\
  \ p\nDisk /dev/sdb: 16 MB, 16006656 bytes\n1 heads, 31 sectors/track, 1008 cylinders\n\
  Units = cylinders of 31 * 512 = 15872 bytes\n\n  Device Boot             Start \
  \        End  Blocks   Id   System\n/dev/sdb1                2         1008   15608+\
  \    b W95 FAT32\n```\n\n在这个例中，我们看到一个 16MB 的设备只有一个分区，使用了设备上可用 1008 个柱中的 1006 个。该分区被识别为\
  \ Windows 95 FAT32 分区。某些程序会使用此标识符来限制对磁盘可以进行的操作类型，但在大多数情况下，更改它并不是关重要的。然而，为了演示，我们将更改它以指示\
  \ Linux 分区。为了做到这一点，我们必须先找出哪个 ID 用于标识 Linux 分区。在之前的列表中，我们看到 ID b 被用于指定现有分区。要查看可用分区类型的列表，请参考程序菜单。在那里我们可以看到以下选择：\n\
  \n```text\n    l   list known partition types\n```\n\n\n\n如果在提示符处输入 `l`，将显示一个大量的可能类型列表。其中，我们看到\
  \ `b` 代表我们现有的分区类型，`83` 代表 Linux。\n\n返回菜单，我们看到这个更改分区 ID 的选项：\n\n`t    change a partition's\
  \ system id`\n\n我们在提示符处输入 `t` 并输入新的 ID。\n\n命令（输入 m 帮助）：`t`\n已选分区 1\n十六进制代码（输入 L\
  \ 列出列表）：`83`\n已将分区 1 的系统类型更改为 `83` (Linux)\n\n这已经完成了我们需要进行的所有更改。到目前为止，设备尚未被触动过（所有更改都存储在内存中，而不是物理设备上），因此我们将修改后的分区表写入设备并退出。为此，我们在在提示符处输入\
  \ `w`。\n\n命令（输入 m 帮助）：`w`\n分区表已更改！正在调用 `ioctl()` 重新读取分区表。警告：如果您创建或修改了任何分区，请参阅 `fdisk`\
  \ 手册以获取更多信息。正在同步磁盘。\n`me@linuxbox ~$`\n\n如果我们决定保持设备原样，可以在提示符处输入 `q`，这将退出程序而不写入更改。我们可以安全地忽略那条听起来不吉利的消息。\n\
  \n### 创建新文件系统\n\n在完成分区编辑后（尽管它可能很轻量），现在是时候在驱动器上创建一个新的文件系统了。为了实现这一点，我们将使用 `mkfs`（“make\
  \ file system”的缩写），它可以创建各种格式的文件系统。要在设备上创建 `ext4` 文件系统，我们使用 `-t` 选项来指定类型，随后跟上我们想要格式化的设备名称。\n\
  `me@linuxbox ~]$ sudo mkfs -t ext4 /dev/sdb1`\n\n```\nmke2fs 2.23.2 (Jul-2011)\n\
  Filesystem label=\nOS type: Linux\nBlock size=1024 (log=0)\nFragment size=1024 (log=0)\n\
  3904 inodes, 15608 blocks\n780 blocks (5.00%) reserved for root user\nFirst data\
  \ block=1\nMaximum filesystem blocks=15990784\nblock groups=8192 blocks per group\n\
  8192 fragments per group\n1952 inodes per group\nSuperblock backups stored on blocks=193\n\
  Writing inode tables: done\nCreating journal (1024 blocks): done\nWriting superblocks\
  \ and filesystem accounting information: done\n此文件系统每隔 34 次挂载或在更早发生时自动检查。使用 `tune2fs\
  \ -c` 或 `-i` 进行覆盖。\n`me@linuxbox ~$`\n```\n\n当选择 `ext4` 为文件系统类型时，程序将显示大量信息。要将设备重新格式化为原始\
  \ FAT32 文件系统，请指定 `vfat` 为文件系统类型。\n`me@linuxbox ~]$ sudo mkfs -t vfat /dev/sdb1`\n\
  \n这种分区和格式化的过程可以在系统添加额外存储设备时随时使用。虽然我们处理的是一个微小的闪存盘，但相同的过程适用于内部硬盘和如 USB 硬盘之类的可移动存储设备。\n\
  \n### 测试和修复文件系统\n\n在我们之前对 `/etc/fstab` 文件的讨论中，我们看到每行末尾都有一些神秘的数字。系统每次启动时，都会例行检查文件系统的完整性。这是通过\
  \ `fsck` 程序（“file system check”的缩写）完成的。每个 `fstab` 条目的最后一个数字指定了要检查设备的顺序。在我们之前的示例中，我们看到根文件系统首先被检查，然后是\
  \ `home` 和 `boot` 文件系统。最后一位数字为零的设备不会被例行检查。\n\n除了检查文件系统的完整性外，`fsck` 还可以修复损坏的文件系统，其成功率取决于损坏的程度。在\
  \ Unix 类文件系统中，恢复的文件部分存放在每个文件系统根目录下的 `lost+found` 中。要检查我们的驱动器（应先将其卸载），我们可以执行以下操作：\n\
  `me@linuxbox ~]$ sudo fsck /dev/sdb1`\n\n```\nfsck 1.40.8 (Mar-2016)\ne2fsck 1.40.8\
  \ (Mar-2016)\n/dev/sdb1: clean, 11/3904 files, 1661/15608 blocks\n```\n\n如今，除非发生硬件问题（如磁盘驱动器故障），否则文件系统损坏是非常罕见的。在大多数系统上，启动时检测到的文件系统损坏将导致系统停止并引导你在继续之前运行\
  \ `fsck`。\n\nWHAT THE FSCK?\n\n在 Unix 文化中，`fsck` 这个词经常被用来代替一个与其共享三个字母的流行词。考虑到当你发现自己处于必须被迫运行\
  \ `fsck` 的境地时，你可能会脱口而出上述那个词，这显得尤为恰当。\n\n### 直接在设备之间移动和传输数据\n\n虽然我们通常认为计算机上的数据是组织成文件的，但以“原始”形式考虑数据也是一种可能的行的。例如，如果我们观察一个磁盘驱动器，会看到它由大量的数据“块”组成，操作系统将这些块视为目录和文件。然而，如果我们能仅仅将磁盘驱动器视为一个大型数据集合，就可以执行一些有用的任务，例如克隆设备。\n\
  \n`dd` 程序执行此类任务。它将数据从一个地方复制到另一个地方。它使用一种特殊的语法（出于历史原因），通常是这样使用的：\n\n```\ndd if=input_file\
  \ of=output_file [bs=block_size [count=blocks]]\n```\n\n### 创建 CD-ROM 镜像\n\n写入刻录光盘（无论是\
  \ CD-R 或 CD-RW）包括两个步骤：\n\n1. 构建一个与 CD-ROM 相同的 *ISO 镜像文件*\n2. 将镜像文件写入光盘介质\n\n####\
  \ 创建 CD-ROM 的镜像副本\n\n如果我们想为现有的 CD-ROM 创建 ISO 镜像，可以使用 `dd` 从 CD-ROM 读取所有数据块并将其复制到本地文件。假设我们有一个\
  \ Ubuntu 光盘，并想制作一个以后使用的 ISO 文件。在插入光盘并确定其设备名称（我们假设为 `/dev/cdrom`），我们可以这样制作 ISO 文件：\n\
  \n```\ndd if=/dev/cdrom of=ubuntu.iso\n```\n\n这种技术适用于数据 DVD，但不适用于音频 CD，因为它们不使用文件系统进行存储。对于音频\
  \ CD，请查看 `cdrdao` 命令。\n\n#### 从文件集创建镜像\n\n要创建一个包含目录内容的 ISO 镜像，我们使用 `genisoimage`\
  \ 程序。为了实现这一点，我们首先创建一个包含要包含镜像中的所有文件的目录，然后执行 `genisoimage` 命令来创建镜像文件。例如，如果我们创建了一个名为\
  \ `~/cd-rom-files` 的目录并填充了用于 CD-ROM 的文件，我们可以使用以下命令创建一个名为 `cd-rom.iso` 的镜像文件：\n\n\
  ```\ngenisoimage -o cd-rom.iso -R -J ~/cd-rom-files\n```\n\n\n\n\n\n如果你查看有关创建和刻录如\
  \ CD-ROM 和 DVD 等光介质的在线教程，你会经常遇到名为 `mkisofs` 和 `cdrecord` 的程序。这些程序属于由 Jörg Schilling\
  \ 编写的名为 `cdrtools` 的流行软件包。2006 年夏天，Schilling 先生对 `cdrtools` 包的部分内容进行了许可更改，在 Linux\
  \ 社区许多人看来，这导致了与 `GNU GPL` 的许可不兼容。因此，`cdrtools` 项目启动了一个*分支（fork）*，现在该分支包含了分别对应 `cdrecord`\
  \ 和 `mkisofs` 的替代程序，命名为 `wodim` 和 `genisoimage`。\n\n# 写入 CD-ROM 镜像\n\n在获得镜像文件后，我们可以将其刻录到光介质上。我们在后续章节中讨论的大多数命令都适用于可刻录的\
  \ CD-ROM 和 DVD 介质。\n\n## 直接挂载 ISO 镜像\n\n我们可以使用一种技巧，在 ISO 镜像仍在硬盘上时将其挂载，并将其视为已经位于光介质上。通过向\
  \ `mount` 命令添加 `-o loop` 选项（以及所需的 `-t iso9660` 文件系统类型），我们可以将镜像文件像设备一样挂载到文件系统树中。\n\
  \n```bash\nmkdir /mnt/iso_image\nmount -t iso9660 -o loop image.iso /mnt/iso_image\n\
  ```\n\n在这个示例中，我们创建了一个名为 `/mnt/iso_image` 的挂载点，并将镜像文件 `image.iso` 挂载到该挂载点。镜像挂载后，就可以像对待真实的\
  \ CD-ROM 或 DVD 一样处理它。*记得在不再需要时卸载镜像*。\n\n## 清空可写 CD-ROM\n\n可写 CD-RW 介质在使用之前需要清除或*空白*。为了做到，我们可以使用\
  \ `wodim`，指定 CD 刻录机的名称和要执行的空白类型。`wodim` 程序提供了多种类型。最简单（最快）的是“fast”类型。\n\n```bash\n\
  wodim dev=/dev/cdrw blank=fast\n```\n\n## 写入镜像\n\n要写入镜像，我们再次使用 `wodim`，指定光介质写入设备的名称和镜像文件的名称。\n\
  \n```bash\nwodim dev=/dev/cdrw image.iso\n```\n\n除了设备名称和镜像文件，`wodim` 还支持大量的选项。常用的两个是用于详细输出的\
  \ `-v` 以及 `-dao`，后者以*一次刻录（disc-at-once）*模式写入光盘。如果你正在为商业复制准备光盘，应该使用这种模式。`wodim` 的默认模式是*一次轨道写入（track-at-once）*，这对于录制音乐轨道很有。\n\
  \n### 总结\n\n在本章中，我们查看了基本的存储管理任务。当然，还有很多。Linux 支持大量的存储设备和文件系统方案。它还提供了许多与其他系统互操作的特性。\n\
  \n# 额外积分\n\n验证下载的 ISO 镜像的完整性通常很有用。在大多数情况下，ISO 镜像的分发者还会提供一个*校验和文件*。校验和是通过复杂的数学计算得出的结果，代表目标文件内容的数字。如果文件内容即使变化一个位，生成的校验和也将大不同。最常用的校验和生成方法是\
  \ `md5sum` 程序。当你使用 `md5sum` 时，它会产生一个唯一的十六进制数。\n\n```bash\nmd5sum image.iso\n34e354760f9bb7fbf85c96f6a3f94ece\
  \  image.iso\n```\n\n下载镜像后，你应该对它运行 `md5sum`，并将结果与发布者提供的 `md5sum` 值进行比较。\n\n除了检查下载文件的完整性外，我们还可以使用\
  \ `md5sum` 验证新写入的光介质。为了实现这一点，我们首先计算镜像文件的校验和，然后为介质计算校验和。验证介质的技巧是将计算限制在光介质中包含镜像的部分。我们通过确定镜像包含多少个\
  \ 2,048 字节块（光介质始终以 2,048 字节块的形式写入）并从介质中读取相应数量的块来实现这一点。在某些类型的介质上，这是不需要的。以一次刻录模式写入的\
  \ CD-R 和 CD-RW 光盘可以通过这种方式检查。\n\n```bash\nmd5sum /dev/cdrom\n34e354760f9bb7fbf85c96f6a3f94ece\
  \  /dev/cdrom\n```\n\n许多类型的介质（如 DVD）需要精确计算块的数量。在接下来的示例中，我们检查镜像文件 `dvd-image.iso`\
  \ 和 DVD 阅读器 `/dev/dvd` 中光盘的完整性。你能弄出这是如何工作的吗？\n\n```bash\nmd5sum dvd-image.iso; dd\
  \ if=/dev/dvd bs=2048 count=$(( $(stat -c \"%s\" dvd-image.iso) / 2048 )) | md5sum\n\
  ```\n\n# 16 网络\n\n![image](img/common01.jpg)\n\n涉及到网络，可能没有什么是 Linux 做不到的。Linux 被用于构建各种网络系统和设备，包括防火墙、路由器、域名服务器、网络存储（NAS）等。\n\
  \n## 检查和监控网络\n\n即使不是系统管理员，检查网络的性能和运行通常也有帮助。\n\n### ping\n\n最基本的网络命令是 `ping`。`ping`\
  \ 命令向指定主机发送名为 ICMP ECHO_REQUEST 的特殊网络包。大多数网络设备接收到该包后回复，从而验证网络连接。\n\n**注意**\n\n*可以配置大多数网络设备（包括\
  \ Linux 主机）忽略这些包。这通常是为了安全原因，防止潜在攻击者发现主机。*例如，为了查看是否可以访问 *linuxcommand.org*（我们喜欢的网站之一），我们可以这样使用\
  \ ping：\n\n```bash\nme@linuxbox]$ ping linuxcommand.org\n```\n\n一旦启动，ping 会按照指定的间隔（默认是一秒）继续发送包，直到被中断。\n\
  \n```bash\nme@linuxbox]$ ping linuxcommand.org\nPING linuxcommand.org (66.35.250.210)\
  \ 56(84) bytes of data.\n64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=1\
  \ ttl=43 time=107 ms\n64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=2\
  \ ttl=43 time=108 ms\n64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=3\
  \ ttl=43 time=106 ms\n64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=4\
  \ ttl=43 time=106 ms\n64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=5\
  \ ttl=43 time=105 ms\n```\n\n\n\n\n\n--- linuxcommand.org ping 统计信息 ---\n\n发送 6\
  \ 个数据包，接收 6 个，0% 丢包，时间 6010ms\n\nrtt min/avg/max/mdev = 105.647/107.052/108.118/0.824\
  \ ms\n\n在按下 `CTRL-C` 中断（在本例中是在第六个数据包之后）后，`ping` 会打印性能统计。正常的网络将显示 0% 的丢包率。成功的“ping”将表明网络元素（其网卡、布线、路由和网关）总体处于良好工作状态。\n\
  \n### traceroute\n\n`traceroute` 程序（某些系统使用类似的 `tracepath` 程序代替它）列出了网络流量从本地系统到指定主机所经经的所有“跳数”（hops）。例如，要查看访问\
  \ [slashdot.org](http://slashdot.org) 所经过的路由，我们执行以下操作：\n\n```\n[me@linuxbox ~]$\
  \ traceroute slashdot.org own\n```\n\n输出结果如下：\n\n```\ntraceroute to slashdot.org\
  \ (216.34.181.45), 30 hops max, 40 byte packets\n\n 1  ipcop.localdomain (192.168.1.1)\
  \  1.066 ms  1.366 ms  1.720 ms\n 2  * * *\n 3  ge-4-13-ur01.rockville.md.bad.comcast.net\
  \ (68.87.130.9)  14.622 ms  14.885 ms  15.169 ms\n 4  po-30-ur02.rockville.md.bad.comcast.net\
  \ (68.87.129.154)  17.634 ms  17.626 ms  17.899 ms\n 5  po-60-ur03.rockville.md.bad.comcast.net\
  \ (68.87.129.158)  15.992 ms  15.983 ms  16.256 ms\n 6  po-30-ar01.howardcounty.md.bad.comcast.net\
  \ (68.87.136.5)  22.835 ms  14.233 ms  14.405 ms\n 7  po-10-ar02.whitemarsh.md.bad.comcast.net\
  \ (68.87.129.34)  16.154 ms  13.600 ms  18.867 ms\n 8  te-0-3-0-1-cr01.philadelphia.pa.ibone.comcast.net\
  \ (68.86.90.77)  21.951 ms  21.073 ms 21.557 ms\n 9  pos-0-8-0-0-cr01.newyork.ny.ibone.comcast.net\
  \ (68.86.85.10)  22.917 ms  21.884 ms 22.126 ms\n 10  204.70.144.1 (204.70.144.1)\
  \  43.110 ms  21.248 ms  21.264 ms\n 11  cr1-pos-0-7-3-1.newyork.savvis.net (204.70.195.93)\
  \  21.857 ms cr2-pos-0-0-3-1.newyork.savvis.net (204.70.204.238)  19.556 ms cr1-pos-0-7-3-1.newyork.savvis.net\
  \ (204.70.195.93) 19.634 ms\n 12  cr2-pos-0-7-3-0.chicago.savvis.net (204.70.192.109)\
  \  41.586 ms  42.843 ms cr2-tengig-0-0-2-0.chicago.savvis.net (204.70.196.242) \
  \ 43.115 ms\n 13  hr2-tengigabitethernet-12-1.elkgrovech3.savvis.net (204.70.195.122)\
  \  44.215 ms  41.833 ms  45.658 ms\n 14  csr1-ve241.elkgrovech3.savvis.net (216.64.194.42)\
  \  46.840 ms  43.372 ms  47.041 ms\n 15  64.27.160.194 (64.27.160.194)  56.137 ms\
  \  55.887 ms  52.810 ms\n 16  64.27.160.194\n```\n\n\n\n\n在网络浏览器出现之前，已经有了 `ftp`\
  \ 程序。`ftp` 用于与 `FTP 服务器` 通信，这些机器包含了可以在网络上上传和下载的文件。\n\nFTP（其原始形式）是不安全的，因为它以`cleartext`（明文）发送账户名和密码。这意味着它们没有加密，任何`sniffing`（嗅探）网络的人都能看到。由于这个原因，几乎所有在互联网上进行的\
  \ FTP 操作都是通过`anonymous FTP 服务器`完成的。匿名服务器允许任何人使用登录名“anonymous”和一个无意义的密码登录。\n\n在接下来的示例中，我们展示了一个使用\
  \ `ftp` 程序的典型会话，从匿名 FTP 服务器 `fileserver` 的 `/pub/cd_images/ubuntu-18.04` 下载 Ubuntu\
  \ iso 镜像：\n\n```\n[me@linuxbox ~]$ ftp fileserver\n\nConnected to fileserver.localdomain.\n\
  \n220 (vsFTPd 2.0.1)\n\nName (fileserver:me): anonymous\n\n331 Please specify the\
  \ password.\n\nPassword:\n\n230 Login successful.\n\nRemote system type is UNIX.\n\
  \nUsing binary mode to transfer files.\n\nftp> cd pub/cd_images/ubuntu-18.04\n\n\
  250 Directory successfully changed.\n\nftp> ls\n\n200 PORT command successful. Consider\
  \ using PASV.\n\n150 Here comes the directory listing.\n\n-rw-rw-r--   1 500   \
  \   500      733079552 Apr 25 03:53 ubuntu-18.04-desktop-amd64.iso\n\n226 Directory\
  \ send OK.\n\nftp> lcd Desktop\n\nLocal directory now /home/me/Desktop\n\nftp> get\
  \ ubuntu-18.04-desktop-amd64.iso\n\nlocal: ubuntu-18.04-desktop-amd64.iso remote:\
  \ ubuntu-18.04-desktop-amd64.iso\n\n200 PORT command successful. Consider using\
  \ PASV.\n\n150 Opening BINARY mode data connection for ubuntu-18.04-desktop-amd64.iso\
  \ (733079552 bytes).\n\n226 File send OK.\n\n733079552 bytes received in 68.56 secs\
  \ (10441.5 kB/s)\n\nftp> bye\n```\n\n表 16-1` 对此会话期间输入的命令提供了解释。\n\n**表 16-1：** 交互式\
  \ ftp 命令示例\n\n| **命令** | **含义** |\n| --- | --- |\n| `ftp fileserver` | 调用 `ftp`\
  \ 程序并使其连接到 FTP 服务器 `fileserver`。 |\n| `anonymous` | 登录名。在登录提示后，会出现密码提示。某些服务器接受空密码；另一些则要求以电子邮件地址形式提供密码。在这种情况下，尝试类似\
  \ `user@example.com`。 |\n| `cd pub/cd_images/ubuntu-18.04` | 切换到远程系统上包含所需文件的目录。注意，在大多数匿名\
  \ FTP 服务器上，公共下载的文件位于 `pub` 目录下的某个地方。 |\n| `ls` | 列出远程系统上的目录。 |\n| `lcd Desktop`\
  \ | 将本地系统的目录更改为 `~/Desktop`。在示例中，调用 `ftp` 程序时工作目录为 `~`。此命令将工作目录更改为 `~/Desktop`。\
  \ |\n| `get ubuntu-18.04-desktop-amd64.iso` | 告诉远程系统将文件 `ubuntu-18.04-desktop-amd64.iso`\
  \ 传输到本地系统。由于本地工作目录已更改为 `~/Desktop`，文件将下载到那里。 |\n| `bye` | 退出远程服务器并结束 `ftp` 会话。也可以使用\
  \ `quit` 和 `exit` 命令。 |\n\n在 `ftp>` 提示符处输入 help 将显示支持的命令列表。在授予足够权限的服务器上使用 `ftp`\
  \ 可以执行许多普通的文件管理任务。它虽然笨拙，但确实有效。\n\n### lftp—更好的 ftp\n\n`ftp` 并不是唯一的命令行 FTP 客户端。事实上，有很多。其中更好（也更流行）的是\
  \ Alexander Lukyanov 开发的 `lftp`。它的工作与传统的 `ftp` 程序非常相似，但具有许多便利功能，包括多协议支持（包括 HTTP）、下载失败后的自动重试、后台进程、路径名的\
  \ Tab 补全等。\n\n### wget\n\n另一个流行的文件下载命令行程序是 `wget`。它适用于从 Web 站点和 FTP 站点下载内容。下载单个文件、多个文件，甚至是整个网站。要下载\
  \ `[linuxcommand.org](http://linuxcommand.org)` 的首页，我们可以这样操作：\n\n```\n[me@linuxbox\
  \ ~]$ wget http://linuxcommand.org/index.php\n\n--11:02:51--  http://linuxcommand.org/index.php\n\
  \             => 'index.php'\n\nResolving linuxcommand.org... 66.35.250.210\n\n\
  Connecting to linuxcommand.org|66.35.250.210|:80... connected.\n\nHTTP request sent,\
  \ awaiting response... 200 OK\n```\n\n\n\n\n远程 shell 会话将一直持续，直到用户在远程 shell 提示符处输入\
  \ `exit` 命令，从而关闭远程连接。此时，本地 shell 会话将恢复，并且本地 shell 提示符会重新出现。\n\n你也可以使用不同的用户名连接到远程系统。例如，如果本地用户\
  \ `me` 在远程系统上有一个名为 `bob` 的账户，则用户 `me` 可以按照如下方式登录远程系统上的 `bob` 账户：\n\n```\n[me@linuxbox\
  \ ~]$ ssh bob@remote-sys\n\nbob@remote-sys's password:\n\nLast login: Sat Aug 25\
  \ 13:03:21 2018\n\n[bob@remote-sys ~]$\n```\n\n如前所述 `ssh` 会验证远程主机的真实性。如果远程主机未通过身份验证，将出现以下消息：\n\
  \n```bash\n[me@linuxbox ~]$ ssh remote-sys\n\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\
  @    WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!     @\n@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@\n\
  IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!\nSomeone could be eavesdropping\
  \ on you right now (man-in-the-middle attack)!\nIt is also possible that the RSA\
  \ host key has just been changed.\nThe fingerprint for the RSA key sent by the remote\
  \ host is\n41:ed:7a:df:23:19:bf:3c:a5:17:bc:61:b3:7f:d9:bb.\nPlease contact your\
  \ system administrator.\nAdd correct host key in `/home/me/.ssh/known_hosts` to\
  \ get rid of this message.\nOffending key in `/home/me/.ssh/known_hosts`:1\nRSA\
  \ host key for remote-sys has changed and you have requested strict\nchecking.\n\
  Host key verification failed.\n```\n\n此消息由两种可能的情况引起。首先，攻击者可能试图进行中间人攻击。这种情况很少见，因为每个人都知道\
  \ `ssh` 会警告用户此类情况。更可能的罪祸首是远程系统由于某种方式发生了变化；例如，其操作系统或 `SSH` 服务器被重新安装了。然而，出于安全考虑，不应断断排除第一种可能性。当出现此消息时，请务必向远程系统的管理员确认。\n\
  \n在确定消息是由良性原因引起后，在客户端修复此问题是安全的。这通过使用文本编辑器（可能是 `vim`）从 `~/.ssh/known_hosts` 文件中删除过时的密钥来实现。在之前的示例消息中，我们看到了：\n\
  \n```\nOffending key in /home/me/.ssh/known_hosts:1\n```\n\n这意味着 `known_hosts` 文件的第一行包含了违规的密钥。从文件中删除此行，`ssh`\
  \ 程序就能接受来自远程系统的新的身份验证凭据了。\n\n除了在远程系统上开启 shell 会话外，`ssh` 还允许我们在远程系统上执行单条命令。例如，要在名为\
  \ `remote-sys` 的远程主机上执行 `free` 命令并将结果显示在本地系统上，请使用以下命令：\n\n```bash\n[me@linuxbox\
  \ ~]$ ssh remote-sys free\n\nme@twin4's password:\n\n               total      used\
  \      free      shared    buffers     cached\nMem:      775536    507184    268352\
  \           0      110068     154596\n-/+ buffers/cache:    242520    533016\nSwap:\
  \       1572856          0    1572856\n\n[me@linuxbox ~]$\n```\n\n这种技术可以用于更有趣的方式，例如下面的示例所示，我们在远程系统上执行\
  \ `ls` 并将输出重定向到本地系统的一个文件中：\n\n```bash\n[me@linuxbox ~]$ ssh remote-sys 'ls *' >\
  \ dirlist.txt\n\nme@twin4's password:\n\n[me@linuxbox ~]$\n```\n\n注意前一个命令中使用了单引号。这样做是因为我们不希望在本地机器上执行路径扩展（pathname\
  \ expansion）；相反，我们希望在远程系统上执行。同样，如果我们想将输出重定向到远程机器上的文件，可以将重定向操作符和文件名放在单引号内。\n\n```bash\n\
  [me@linuxbox ~]$ ssh remote-sys 'ls * > dirlist.txt'\n```\n\n### 使用 SSH 进行隧道传输（TUNNELING）\n\
  \n通过 `SSH` 与远程主机建立连接时，发生的情况是在本地和远程系统之间创建一个加密隧道。除了这一基本功能外，该协议允许发送大多数类型的流量。假设我们坐在一个名为\
  \ `linuxbox` 的系统前，想要运行一个图形应用程序。我们可以这样做：\n\n```bash\n[me@linuxbox ~]$ ssh -X remote-sys\n\
  \nme@remote-sys's password:\n\nLast login: Mon 10 13:23:11 2018\n\n[me@remote-sys\
  \ ~]$ xload\n```\n\n### scp 和 sftp\n\nOpenSSH 包还包含两个可以使用加密隧道复制文件的程序。第一个是 `scp`（安全复制），其用法与熟悉的\
  \ `cp` 程序类似。最显著的区别是源或目标路径可以以远程主机名开头。例如，如果我们想从远程系统的家目录复制一个名为 `document.txt` 的文件到本地当前目录，我们可以这样做：\n\
  \n```bash\n[me@linuxbox ~]$ scp remote-sys:document.txt .\n\nme@remote-sys's password:\n\
  \ndocument.txt 100% 5581 5.5KB/s 00:00\n\n[me@linuxbox ~]$\n```\n\n与 `ssh` 一样，如果远程主机账户与本地系统不匹配，可以在主机名的开头应用用户名。\n\
  \n```bash\n[me@linuxbox ~]$ scp bob@remote-sys:document.txt .\n```\n\n第二个 SSH 文件复制程序是\
  \ `sftp`，正如它是 `ftp` 程序的安全替代品。`sftp` 的工作方式与 `ftp` 程序非常相似；但它不是以明文传输一切，而是使用加密隧道。`sftp`\
  \ 相比传统 `ftp` 的重要优势在于不需要在远程主机上运行 `ftp` 服务器。只需要 `SSH` 服务器。这意味着任何可以使用 `SSH` 客户端连接的远程机器都可以作为\
  \ FTP 类服务器使用。这是一个示例会话：\n\n```bash\n[me@linuxbox ~]$ sftp remote-sys\n\nConnecting\
  \ to remote-sys...\n\nme@remote-sys's password:\n\nsftp> ls\n\nubuntu-8.04-desktop-i386.iso\n\
  \nsftp> lcd Desktop\n\nsftp> get ubuntu-8.04-desktop-i386.iso\n\nFetching /home/me/ubuntu-8.04-desktop-i386.iso\
  \ to ubuntu-8.04-desktop-i386.iso\n\n/home/me/ubuntu-8.04-desktop-i386.iso 100%\
  \ 699MB 7.4MB/s 01:35\n\nsftp> bye\n```\n\n**提示**\n\n*许多 Linux 发行版中的图形文件管理器都支持 `SFTP`\
  \ 协议。无论使用 GNOME 还是 KDE，我们可以在位置栏输入以 `sftp://` 开头的 URI，并对运行 `SSH` 服务器的远程系统上的文件进行操作。*\n\
  \n\n\n假设你正坐在一台 Windows 面前，但你需要登录到你的 Linux 服务器并完成实际工作；你该怎么办？当然，为你的 Windows 机器下载一个\
  \ SSH 客户端程序！这类程序有很多。最受欢迎的可能是 Simon Tatham 及其团队编写的 `PuTTY`。`PuTTY` 程序显示一个终端窗口，并允许\
  \ Windows 用户在远程主机上开启 SSH（或 telnet）会话。该程序还提供了 `scp` 和 `sftp` 程序的替代方案。\n\n`PuTTY`\
  \ 可以在 *[www.chiark.greenend.org.uk/~sgtatham/putty/](http://www.chiark.greenend.org.uk/~sgtatham/putty/)*\
  \ 获取。\n\n### 总结\n\n在本章中，我们调查了大多数 Linux 系统上的网络工具领域。由于 Linux 在服务器和网络设备中被广泛使用，通过安装额外的软件，还可以添加更多工具。但即使只有基础工具\
  \ set，也可以执行许多实用的网络相关任务。\n\n# 17 查找文件\n\n![image](img/common01.jpg)\n\n当我们漫游在 Linux\
  \ 系统中时，有一点变得非常清晰：一个典型的 Linux 系统有大量文件！这引发了一个问题：“我们如何找到它们？”我们已经知道 Linux 文件系统根据从过去的一代\
  \ Unix 类系统传递给下一代的约定组织得很好，但文件的庞大数量可能会带来一个令人生畏的问题。\n\n在本章中，我们将介绍两个用于在系统中查找文件的工具。\n\
  \n- `locate`:通过名称查找文件\n- `find`:在目录层次结构中搜索文件\n\n我们还将查看一个经常与文件搜索命令配合使用的命令，用于处理生成的文件列表。\n\
  \n- `xargs`:从标准输入构建并执行命令行\n\n此外，我们还将介绍两个命令来协助我们的探索。\n\n- `touch`:修改文件时间\n- `stat`:显示文件或文件系统状态\n\
  \n## locate—简单地查找文件\n\n`locate` 程序对路径进行快速数据库搜索，然后输出每个匹配给定子字符串的名称。例如，假设我们要找到所有名称以\
  \ `zip` 开头的程序。由于我们正在寻找程序，可以假设包含这些程序的目录名称以 `bin/` 结尾。因此，我们可以尝试这样使用 `locate` 来查找我们的文件：\n\
  \n```\n[me@linuxbox ~]$ locate bin/zip\n```\n\n`locate` 将搜索其路径数据库并输出任何包含 `bin/zip`\
  \ 字符串的项目。\n\n```\n/usr/bin/zip\n/usr/bin/zipcloak\n/usr/bin/zipgrep\n/usr/bin/zipinfo/usr/bin/zipnote\n\
  /usr/bin/zipsplit\n```\n\n如果搜索要求没有那么简单，我们可以将 `locate` 与 `grep` 等其他工具结合，以设计更有有趣的搜索。\n\
  \n```\n[me@linuxbox ~]$ locate zip | grep bin\n```\n\n```\n/bin/bunzip2\n/bin/bzip2\n\
  /bin/bzip2recover\n/bin/gunzip\n/bin/gzip\n/usr/bin/funzip\n/usr/bin/gpg-zip\n/usr/bin/preunzip\n\
  /usr/bin/prezip\n/usr/bin/prezip-bin\n/usr/bin/unzip\n/usr/bin/unzipsfx\n/usr/bin/zip\n\
  /usr/bin/zipcloak\n/usr/bin/zipgrep\n/usr/bin/zipinfo\n/usr/bin/zipnote\n/usr/bin/zipsplit\n\
  ```\n\n`locate` 程序已经存在多年，并且有几种常用的变体。现代 Linux 发行版中常见的常见的两种是 `slocate` 和 `mlocate`，尽管它们通常通过名为\
  \ `locate` 的符号链接访问。不同版本的 `locate` 具有重叠的选项。某些版本包含正则表达式匹配和通配符支持。检查 `locate` 的 man\
  \ 页以确定安装了哪个版本的 `locate`。\n\n### locate 数据库来自哪里？\n\n你可能会注意到，在某些发行版中，`locate` 在系统安装后无法工作，但如果你第二天再次尝试，它就能正常工作。这是为什么？`locate`\
  \ 数据库由另一个名为 `updatedb` 的程序创建。通常，它作为 `cron job` 定期运行，即由 `cron` 守护进程定期执行的任务。大多数配备\
  \ `locate` 的系统每天运行一次 `updatedb`。由于数据库不是持续更新，你会发现在使用 `locate` 时，最近的文件不会出现。为了克服这个问题，可以通过成为超级用户并在提示符处手动运行\
  \ `updatedb` 程序。\n\n## find—费力地查找文件\n\n虽然 `locate` 程序可以仅根据名称找到文件，但 `find` 程序根据各种属性在给定目录（及其子目录）中搜索文件。我们将花费大量时间在\
  \ `find` 上，因为它有很多有趣的功能，我们在以后章节中开始介绍编程概念时将反复看到它们。\n\n在最简单的用法中，`find` 被赋予一个或多个要搜索的目录名称。例如，为了列出我们的主目录，我们可以使用以下命令：\n\
  \n```\n[me@linuxbox ~]$ find ~\n```\n\n在大多数活动用户账户上，这将产生巨大的列表。由于列表被发送到标准输出，我们可以将列表管道到其他程序。让我们使用\
  \ `wc` 来统计文件数量。\n\n```\n[me@linuxbox ~]$ find ~ | wc -l\n47068\n```\n\n哇，我们忙坏了！`find`\
  \ 的妙之处在于它可以用于识别特定标准。\n\n### 测试\n\n假设我们需要一个目录列表。为了做到，我们可以添加以下内容：\n\n```\n[me@linuxbox\
  \ ~]$ find ~ -type d | wc -l\n1695\n```\n\n相反，我们可以通过此测试将搜索限制为普通文件：\n\n```\n[me@linuxbox\
  \ ~]$ find ~ -type f | wc -l\n38737\n```\n\n我们还可以通过添加一些测试按文件大小和文件名进行搜索。让我们寻找匹配 `*.JPG`\
  \ 模式且大于 1MB 的普通文件。\n\n17-2 列出了可以指定单位的字符。\n\n```\n[me@linuxbox ~]$ find ~ -type f\
  \ -name \"*.JPG\" -size +1M | wc -l\n840\n```\n\n在这个示例中，我们添加了 `-name` 测试，后面跟着模式。注意我们如何将其括起来以防止\
  \ shell 进行路径名扩展。接下来，我们添加了 `-size` 测试，后面跟着字符串 `+1M`。前面的加号表示我们正在寻找大于指定数字的文件。前面的负号将改变字符串含义为小于该数字。不使用符号意味着“精确匹配该值”。结尾的字母\
  \ `M` 表示单位是兆字节。\n\n\n\n\n| -empty | 匹配空文件和目录。 |\n| -group name | 匹配属于 `group name`\
  \ 的文件或目录。`name` 可以表示为组名或数字 ID。 |\n| -iname pattern | 类似于 `-name` 测试，但不区分大小写。 |\n\
  | -inum n | 匹配 inode 号为 `n` 的文件。这有助于查找指向特定 inode 的所有硬链接。 |\n| -mmin n | 匹配内容最后修改于\
  \ `n` 分前的文件或目录。 |\n| -mtime n | 匹配内容最后修改于 `n` 小时前的文件或目录。 |\n| -name pattern | 匹配符合指定通配符模式的文件和目录。\
  \ |\n| -newer file | 匹配内容修改比 `file` 更晚的文件或目录。这在编写执行备份的 shell 脚本时非常有用。每当你进行更新（例如日志）后，就可以使用\
  \ find 来确定自上次更新以来哪些文件发生了变化。 |\n| -nouser | 匹配不属于有效用户的文件和目录。这用于查找属于已删除账户的文件，或检测攻击者的活动。\
  \ |\n| -nogroup | 匹配不属于有效组的文件和目录。 |\n| -perm mode | 匹配设置为指定模式的文件或目录。`mode` 可以用八进制或符号符号表示。\
  \ |\n| -samefile name | 类似于 `-inum` 测试。匹配与 `name` 共享相同 inode 号的文件。 |\n| -size n\
  \ | 匹配大小为 `n` 的文件。 |\n| -type c | 匹配类型为 c 的文件。 |\n| -user name | 匹配属于用户名的的文件或目录。用户可以用用户名或数字\
  \ ID 表示。 |\n\n这不是一个完整的列表。`find` 的 man 页面包含了所有细节。\n\n## 运算符 (Operators)\n\n即使 find\
  \ 提供了所有这些测试，我们可能仍然需要更好的方法来描述测试之间的逻辑关系。例如，如果我们需要确定目录中的所有文件和子目录是否具有安全权限怎么办？我们将查找权限不是\
  \ `0600` 的文件以及权限不是 `0700` 的目录。幸运的是，find 提供了一种使用逻辑运算符组合测试的方法，以创建更复杂的逻辑关系。要表示上述测试，我们可以这样做：\n\
  \n```bash\nme@linuxbox ~ find ~ \\( -type f -not -perm 0600 \\) -or \\( -type d\
  \ -not -perm 0700 \\)\n```\n\n哎呀！这看起来确实很奇怪。这些都是什么？实际上，一旦你了解它们，运算符并不复杂。表 17-4 描述了与\
  \ find 一用的逻辑运算符。\n\n### 表 17-4：find 逻辑运算符\n\n| 运算符 | 描述 |\n| --- | --- |\n| -and\
  \ | 如果运算符两边的测试都为真，则匹配。这可以缩写为 `-a`。注意，当不存在运算符时，默认隐含 `-and`。 |\n| -or | 如果运算符一侧的任一测试为真，则匹配。这可以缩写为\
  \ `-o`。 |\n| -not | 如果运算符后的测试为假，则匹配。这可以使用感叹号（`!`）缩写。 |\n| ( ) | 将测试和运算符分组以形成更大的表达式。这用于控制逻辑评估的优先级。默认情况下，find\
  \ 从左到右进行评估。通常需要覆盖默认的评估顺序以获得所需的结果。即使不需要，有时包含分组字符也有助于提高命令的可读性。注意，由于括号对 shell 有特殊含义，因此在命令行上使用它们时必须加引号，以便将它们作为参数传递给\
  \ find。通常使用反斜杠字符进行转义。 |\n\n有了这个运算符列表，让我们来解构我们的 `find` 命令。从最高层看，我们看到测试被排列为两个由 `-or`\
  \ 运算符隔开的分组。\n\n`( expression 1 ) -or ( expression 2)`\n\n这是合理的，因为我们正在寻找具有某组特定权限的文件和具有另一组权限的目录。如果我们正在同时查找文件和目录，为什么我们使用\
  \ `-or` 而不是 `-and` 呢？当 `find` 扫描文件和目录时，每一项都会被评估以检查是否符合指定的测试。我们想知道它是一个权限错误的文件，还是一个权限错误的目录。它不能同时是这者之一。所以，如果我们展开分组的表达式，可以这样来看：\n\
  \n`( file with bad perms ) -or ( directory with bad perms )`\n\n我们的下一个挑战是如何测试“坏权限”。我们该如何做点呢？实际上，我们并不这样做。我们将测试的是“不是良好的权限”，因为我们知道什么是“良好的权限”。在文件情况下，我们将良好定义为\
  \ `0600`，对于目录，我们将其定义为 `0700`。测试文件具有“非良好”权限的表达式如下：\n\n`-type f -and -not -perms 0600`\n\
  \n对于目录则如下：\n\n`-type d -and -not -perms 0700`\n\n如 表 17-4 所示，`-and` 运算符可以安全地删除，因为它是默认隐含的。所以，如果我们把所有这些重新组合，就得到了最终的命令：\n\
  \n```bash\nfind ~ ( -type f -not -perms 0600 ) -or ( -type d -not -perms 0700 )\n\
  ```\n\n\n\n\n我们可以使用 `find` 来删除符合特定标准。例如，要删除扩展名为 `*.bak` 的文件（这通常用于指定备份文件），可以使用此命令：\n\
  \n```\nfind ~ -type f -name '*.bak' -delete\n```\n\n在这个示例中，程序会在用户的家目录（及其子目录）中搜索所有以\
  \ `*.bak` 结尾的文件。一旦找到，它们就会被删除。\n\n### 警告\n\n*不言而喻的是，在使用 `-delete` 动作时应务必极其小心。请务必通过将\
  \ `-delete` 动作替换为 `-print` 来先测试该命令，以确认搜索结果。*\n\n在继续之前，让我们再次观察逻辑操作符是如何影响动作的。考虑以下命令：\n\
  \n```\nfind ~ -type f -name '*.bak' -print\n```\n\n正如我们所看到的，该命令将查找每一个以 `*.bak` 结尾（`-name\
  \ ’*.bak’`）的普通文件（`-type f`），并将每个匹配文件的相对路径输出到标准输出（`-print`）。然而，该命令之所以能够这样执行，取决于每个测试和动作之间的逻辑关系。请记住，默认情况下，每个测试和动作之间存在着隐含的\
  \ `-and` 关系。我们也可以这样表示该命令，使逻辑关系更加直观：\n\n```\nfind ~ -type f -and -name '*.bak' -and\
  \ -print\n```\n\n在完整表达我们的命令后，让我们看看逻辑操作符如何影响它的执行：\n\n| 测试/动作 | 仅在满足以下条件时执行... |\n\
  | --- | --- |\n| -print | `-type f` 和 `-name ’*.bak’` 为真 |\n| -name ’*.bak’ | `-type\
  \ f` 为真 |\n| -type f | 总是执行，因为它是 `-and` 关系中的第一个测试/动作。 |\n\n由于测试和动作之间的逻辑关系决定了它们中哪些会被执行，我们可以看到测试和动作的顺序是非常重要的。例如，如果我们重新排列测试和动作的顺序，让\
  \ `-print` 动作成为第一个，那么命令的行为将大不同。\n\n```\nfind ~ -print -and -type f -and -name '*.bak'\n\
  ```\n\n这个版本的命令将打印每个文件（`-print` 动作始终求值为真），然后测试文件类型和指定的指定扩展名。\n\n### 用户定义动作\n\n除了预定义的动作外，我们还可以调用任意命令。这种传统方法是使用\
  \ `-exec` 动作。该动作的工作原理如下：\n\n```\n-exec command {} ;\n```\n\n在这里，`command` 是命令名称，`{}`\
  \ 是当前路径的符号表示，而分号是必须的分隔符，表示命令的结束。这里有一个使用 `-exec` 实现前面讨论过的 `-delete` 动作的示例：\n\n```\n\
  -exec rm '{}' ';'\n```\n\n同样，由于括号和分号字符对 shell 有特殊含义，因此必须对它们进行引用或转义。\n\n以交互式方式执行用户定义的动作也是可能的。通过使用\
  \ `-ok` 动作代替 `-exec`，在执行每个指定的命令之前，都会提示用户。\n\n```\nfind ~ -type f -name 'foo*' -ok\
  \ ls -l '{}' ';'\n```\n\n```\nls ... /home/me/bin/foo > ? y\n-rwxr-xr-x 1 me   me\
  \ 224 2007-10-29 18:44 /home/me/bin/foo\n\n< ls ... /home/me/foo.txt > ? y\n-rw-r--r--\
  \ 1 me   me    0 2016-09-19 12:53 /home/me/foo.txt\n```\n\n在这个示例中，我们搜索名称以字符串 `foo`\
  \ 开头的文件，并在每次找到一个文件时执行命令 `ls -l`。使用 `-ok` 动作会在执行 `ls` 命令之前提示用户。\n\n### 提高效率\n\n当使用\
  \ `-exec` 动作时，每当找到一个匹配的文件，它都会启动指定命令的新实例。某些情况下，我们可能倾向于合并所有的搜索结果并启动单个命令实例。例如，与其像这样执行命令：\n\
  \n```\nls -l file1\nls -l file2\n```\n\n我们可能更倾向于这样执行它们：\n\n```\nls -l file1 file2\n\
  ```\n\n这会导致命令只执行一次，而不是多次。我们有两种方法可以做到这一点：传统方法是使用外部命令 `xargs`，另一种方法是使用 `find` 本身的新功能。\n\
  \n通过将末尾的分号字符改为加号，我们激活了 `find` 的功能，即将搜索结果合并成参数列表，以便单次执行所需的命令。回到我们的示例，这将在每次找到匹配文件时执行\
  \ `ls`：\n\n```\nfind ~ -type f -name 'foo*' -exec ls -l '{}' ';'\n```\n\n```\n-rwxr-xr-x\
  \ 1 me   me 224 2007-10-29 18:44 /home/me/bin/foo\n-rw-r--r-- 1 me   me    0 2016-09-19\
  \ 12:53 /home/me/foo.txt\n```\n\n通过将命令改为如下：\n\n```\nfind ~ -type f -name 'foo*'\
  \ -exec ls -l '{}' +\n```\n\n```\n-rwxr-xr-x 1 me   me 224 2007-10-29 18:44 /home/me/bin/foo\n\
  -rw-r--r-- 1 me   me    0 2016-09-19 12:53 /home/me/foo.txt\n```\n\n### xargs\n\n\
  `xargs` 命令执行一个有趣的功能。它接受来自标准输入的输入并转换为命令的参数列表。对于我们的示例，我们将这样使用它：\n\n```\nfind ~ -type\
  \ f -name 'foo*' -print | xargs\n```\n\n```\n-rwxr-xr-x 1 me   me 224 2007-10-29\
  \ 18:44 /home/me/bin/foo\n-rw-r--r-- 1 me   me    0 2016-09-19 12:53 /home/me/foo.txt\n\
  ```\n\n**注意**：虽然命令行可以放置的参数数量很大，但并不是无限的。要查看命令行的限制，请配合 `--show-limits` 运行 `xargs`。\n\
  \n### 处理特殊文件名\n\nUnix 类系统允许文件名中包含空格（甚至是换行符！）。这给像 `xargs` 这样构建参数列表程序带来了麻烦。嵌入空格会被视为分隔符。为了解决这个问题，`find`\
  \ 和 `xargs`\n\n允许可选使用空字符作为分隔符。空字符在 ASCII 中定义为数字零对应的字符（相对于空格字符，后者在 ASCII 中定义为数字 32\
  \ 字符）。`find` 命令提供了 `-print0` 动作，产生空分隔输出，而 `xargs` 命令具有 `--null`（或 `-0`）选项，接受空分隔输入。这里有一个示例：\n\
  \n```\nfind ~ -iname '*.jpg’ -print0 | xargs --null ls -l\n```\n\n使用这种技术，我们可以确保所有文件（即使是包含空格的文件）都能被正确处理。\n\
  \n### 回到练习\n\n是时候让 `find`发挥一些（几乎）实际用途了。我们将创建一个练习并尝试我们所学的知识。\n\n首先，让我们创建一个有很多子目录和文件的练习。\n\
  \n```\n[me@linuxbox ~]$ mkdir -p playground/dir-{001..100}\n[me@linuxbox ~]$ touch\
  \ playground/dir-{001..100}/file-{A..Z}\n```\n\n惊叹命令行的力量吧！通过这两行代码，我们创建了一个包含 100\
  \ 个子目录、每个子目录包含 26 个空文件的练习目录。用图形用户界面（GUI）试试看吧！\n\n\n\n\n`touch` 命令通常用于设置或更新文件的访问时间、更改时间和修改时间。然而，如果文件名参数是一个不存在的文件，则会创建一个空文件。\n\
  \n在我们的实验场（playground）中，我们创建了 100 个 `file-A` 实例。让我们来找到它们。\n\n```bash\n[me@linuxbox\
  \ ~]$ find playground -type f -name 'file-A'\n```\n\n注意，与 `ls` 不同，`find`产生的结果不是按排序输出的。它的顺序取决于存储设备的布局。我们可以通过这种方式来确认我们确实有\
  \ 100 个该文件的实例。\n\n```bash\n[me@linuxbox ~]$ find playground -type f -name 'file-A'\
  \ | wc -l\n100\n```\n\n接下来，让我们看看如何根据修改时间来查找文件。这在创建备份或按时间顺序组织文件时非常有帮助。为了实现这一点，我们首先将创建一个参考文件，并以此文件来比较修改时间。\n\
  \n```bash\n[me@linuxbox ~]$ touch playground/timestamp\n```\n\n这会创建一个名为 `timestamp`\
  \ 的空文件，并将其修改时间设置为当前时间。我们可以使用另一个方便手的命令 `stat` 来验证这一点，它是 `ls` 的增强版。`stat` 命令显示了系统对一个文件及其属性的所有了解。\n\
  \n```bash\n[me@linuxbox ~]$ stat playground/timestamp\n  File: `playground/timestamp'\n\
  \  Size: 0          Blocks: 0      IO Block: 4096 regular empty file\nDevice: 803h/2051d\
  \ Inode: 14265061 Links: 1\nAccess: (0644/-rw-r--r--)  Uid: ( 1001/ me)  Gid: (\
  \ 1001/ me)\nAccess: 2018-10-08 15:15:39.000000000 -0400\nModify: 2018-10-08 15:15:39.000000000\
  \ -0400\nChange: 2018-10-08 15:15:39.000000000 -0400\n```\n\n如果我们再次使用 `touch` 然后用\
  \ `stat` 检查文件，我们将发现文件的时间已经更新了。\n\n```bash\n[me@linuxbox ~]$ touch playground/timestamp\n\
  [me@linuxbox ~]$ stat playground/timestamp\n  File: `playground/timestamp'\n  Size:\
  \ 0          Blocks: 0      IO Block: 4096 regular empty file\nDevice: 803h/2051d\
  \ Inode: 14265061 Links: 1\nAccess: (0644/-rw-r--r--)  Uid: ( 1001/ me)  Gid: (\
  \ 1001/ me)\nAccess: 2018-10-08 15:23:33.000000000 -0400\nModify: 2018-10-08 15:23:33.000000000\
  \ -0400\nChange: 2018-10-08 15:23:33.000000000 -0400\n```\n\n接下来，让我们使用 `find` 来更新实验场中的一些文件。\n\
  \n```bash\n[me@linuxbox ~]$ find playground -type f -name 'file-B' -exec touch '{}'\
  \ ';'\n```\n\n这更新了实验场中所有名为 `file-B` 的文件。我们将使用 `find`，通过比较所有文件与参考文件 `timestamp` 来识别已更新的文件。\n\
  \n```bash\n[me@linuxbox ~]$ find playground -type f -newer playground/timestamp\n\
  ```\n\n结果包含了所有 100 个 `file-B` 实例。由于我们在更新 `timestamp` 之后，对实验场中所有名为 `file-B` 的文件执行了\
  \ `touch` 操作，它们现在比 `timestamp` “新”，因此可以使用 `-newer` 测试进行识别。\n\n最后，让我们回到之前执行的错误权限测试，并将其应用于\
  \ `playground`。\n\n```bash\n[me@linuxbox ~]$ find playground \\( -type f -not -perm\
  \ 0600 \\) -or \\( -type d -not -perm 0700 \\)\n```\n\n该命令列出了 `playground` 中所有的\
  \ 100 个目录和 2,600 个文件（以及 `timestamp` 和 `playground` 本身，共 2,602 个），因为没有一个符合我们对“良好权限”的定义。利用对操作符和动作的知识，我们可以向此命令添加动作，以对实验场中的文件和目录应用新的权限。\n\
  \n```bash\n[me@linuxbox ~]$ find playground \\( -type f -not -perm 0600 -exec chmod\
  \ 0600 '{}' ';' \\) -or \\( -type d -not -perm 0700 -exec chmod 0700 '{}' ';' \\\
  )\n```\n\n\n\n\n*   *有损*。另一方面，有损压缩在执行压缩时删除数据，以便进行更深层次的压缩。当有损文件被恢复时，它与原始版本并不匹配；而是一个接近的近似值。有损压缩的示例包括\
  \ `JPEG`（用于图像）和 `MP3`（用于音乐）。\n\n在我们的讨论中，我们将专门无无压缩，因为计算机上的大多数数据都无法忍任何数据丢失。\n\n###\
  \ gzip\n\n`gzip` 程序用于压缩一个或多个文件。执行执行时，它会将原始文件替换为原始文件的压缩版本。相应的 `gunzip` 程序用于将压缩文件恢复为原始的未解压缩形式。以下是一个示例：\n\
  \n```\n[me@linuxbox ~]$ ls -l /etc > foo.txt\n[me@linuxbox ~]$ ls -l foo.*\n-rw-r--r--\
  \ 1 me    me    15738 2018-10-14 07:15 foo.txt\n[me@linuxbox ~]$ gzip foo.txt\n\
  [me@linuxbox ~]$ ls -l foo.*\n-rw-r--r-- 1 me    me    3230 2018-10-14 07:15 foo.txt.gz\n\
  [me@linuxbox ~]$ gunzip foo.txt\n[me@linuxbox ~]$ ls -l foo.*\n-rw-r--r-- 1 me \
  \   me    15738 2018-10-14 07:15 foo.txt\n```\n\n在这个示例中，我们从目录列表中创建了一个名为 `foo.txt`\
  \ 的文本文件。接下来，我们运行 `gzip`，它将原始文件替换为名为 `foo.txt.gz` 的压缩版本。在 `foo.*` 的目录列表中，我们看到原始文件已被压缩版本替换，且压缩版本的大小约为原始文件五分之一。我们还可以看到压缩文件与原始文件具有相同的权限和时间戳。\n\
  \n接下来，我们运行 `gunzip` 程序来解压文件。之后，我们可以看到文件的压缩版本已被原始文件替换，同样保留了权限和时间戳。\n\n`gzip` 有许多选项，如表\
  \ 18-1 所示（#ch18.xhtml_ch18tab01）。\n\n**表 18-1:** gzip 选项\n\n| 选项 | 长选项 | 描述 |\n\
  | --- | --- | --- |\n| -c | --stdout--to-stdout | 将输出写入标准输出并保留原始文件。 |\n| -d | --decompress--uncompress\
  \ | 解压缩。这导致 `gzip` 的行为像 `gunzip`。 |\n| -f | --force | 即使原始文件的压缩版本已存在，也强制压缩。 |\n\
  | -h | --help | 显示用法信息。 |\n| -l | --list | 列出每个压缩文件的压缩统计信息。 |\n| -r | --recursive\
  \ | 如果命令行上的一个或多个参数是目录，则递归压缩其中包含的文件。 |\n| -t | --test | 测试压缩文件的完整性。 |\n| -v | --verbose\
  \ | 在压缩时显示详细信息。 |\n| -number | | 设置压缩程度。`number` 是 1（最快，压缩率最低）到 9（最慢，压缩率最高）之间的整数。值\
  \ 1 和 9 也可以分别表示为 `--fast` 和 `--best`。默认值为 6。 |\n\n让我们回到之前的示例。\n\n```\n[me@linuxbox\
  \ ~]$ gzip foo.txt\n[me@linuxbox ~]$ gzip -tv foo.txt.gz\nfoo.txt.gz:  OK\n[me@linuxbox\
  \ ~]$ gzip -d foo.txt.gz\n```\n\n在这里，我们用一个名为 `foo.txt.gz` 的压缩版本替换了 `foo.txt`。接下来，我们使用\
  \ `-t` 和 `-v` 选项测试了压缩版本的完整性。最后，我们将文件解压回原始形式。\n\n`gzip` 还可以通过标准输入和输出以有趣的方式进行使用。\n\
  \n```\n[me@linuxbox ~]$ ls -l /etc | gzip > foo.txt.gz\n```\n\n此命令创建了目录列表的压缩版本。\n\
  \n`gunzip` 程序用于解压 `gzip` 文件，假设文件名以扩展名 `.gz` 结尾，因此只要指定的名称与现有未压缩文件冲突，就不需要指定。\n\n```\n\
  [me@linuxbox ~]$ gunzip foo.txt\n```\n\n如果我们的目标只是查看压缩文本文件的内容，我们可以这样做：\n\n```\n[me@linuxbox\
  \ ~]$ gunzip -c foo.txt | less\n```\n\n或者，`gzip` 还提供了一个名为 `zcat` 的程序，它等同于带有 `-c`\
  \ 选项的 `gunzip`。它可以像 `cat` 命令一样处理 `gzip`-压缩的文件。\n\n```\n[me@linuxbox ~]$ zcat foo.txt.gz\
  \ | less\n```\n\n**提示**\n\n还有一个 `zless` 程序。它执行的功能与之前的管道相同。\n\n### bzip2\n\n由 Julian\
