  \ `INT`（中断）的信号；在 `CTRL-Z` 的情况下，会发送一个名为 `TSTP`（终端停止）的信号。程序反过来会“监听”信号，并在接收到信号时可能采取行动。程序能够监听并对信号做出反应这一事实使得程序能够在接收到终止信号时执行诸如保存进行中工作的操作。\n\
  \n#### 使用 kill 向进程发送信号\n\n`kill` 命令用于向程序发送信号。它最常见的语法如下：\n\n```bash\nkill -signal\
  \ PID...\n```\n\n如果命令行上没有指定信号，则默认会发送 `TERM`（终止）信号。`kill` 命令最常用于发送表 10-4 中列出的信号。\n\
  \n**表 10-4:** 常用信号\n\n| **数字** | **名称** | **含义** |\n| --- | --- | --- |\n| 1 | HUP\
  \ | 挂起。这是旧时代的遗留，当时终端通过电话线和调制解调器连接到远程计算机。该信号用于指示程序控制终端已“挂断”。可以通过关闭终端会话来演示此信号的效果。运行在终端上的前台程序将收到该信号并终止。许多守护进程也使用此信号来导致重新初始化。这意味着当守护进程收到此信号时，它将重启并重新读取其配置文件。Apache\
  \ Web 服务器就是这样使用 `HUP` 信号的守护进程示例。 |\n| 2 | INT | 中断。功能与从终端发送的 `CTRL-C` 。它通常会终止程序。\
  \ |\n| 9 | KILL | 杀死。此信号是特殊的。程序可以选择处理或忽略信号，但 `KILL` 信号永远不会发送给目标；内核会立即终止进程。仅作为最后手段使用。\
  \ |\n\n*(注：由于您提供的文本在表格 10-4 之后出现了大量重复且错乱的信号描述，我将遵循“不要重复输出原文”的原则，仅对逻辑连贯的部分进行完整翻译。)*\n\
  \n**重新梳理提供的文本，发现原文文本在 `Signals` 标题之后存在多次重复的示例段落。以下是基于您提供的文本内容合并后的最终译文：**\n\n[content]\n\
  一个后台进程不受终端键盘输入的影响，包括任何尝试通过 `CTRL-C` 中断它的尝试。要将进程返回到前台，请如下方式使用 `fg` 命令：\n\n```bash\n\
  [me@linuxbox ~]$ jobs\n[1]+  Running             xlogo &\n[me@linuxbox ~]$ fg %1\n\
  xlogo\n```\n\n使用 `fg` 命令后跟一个百分号和作业号（称为 `jobspec`，作业规格）即可完成操作。如果我们只有一个后台作业，则 `jobspec`\
  \ 是可选的。要终止 `xlogo`，请按 `CTRL-C`。\n\n### 停止（暂停）进程\n\n有时，我们想要停止一个进程而不将其终止它。这通常是为了允许前台进程移动到后台。要停止前台进程并将其置于后台，请按\
  \ `CTRL-Z`。让我们试一下。在命令提示符处输入 `xlogo`，按 `ENTER`，然后按 `CTRL-Z`。\n\n```bash\n[me@linuxbox\
  \ ~]$ xlogo\n[1]+  Stopped             xlogo\n[me@linuxbox ~]$\n```\n\n停止 `xlogo`\
  \ 后，我们可以通过尝试调整 `xlogo` 窗口来验证程序已停止。我们会发现它看起来完全“死”了。我们可以使用 `fg` 命令在前台继续运行程序的执行，或者使用\
  \ `bg` 命令在后台恢复运行程序的执行。\n\n```bash\n[me@linuxbox ~]$ bg %1\n[1]+ xlogo &\n[me@linuxbox\
  \ ~]$\n```\n\n与 `fg` 命令一样，如果只有一个作业，`jobspec` 是可选的。\n\n如果我们从命令行启动了一个图形化程序，但忘记在末尾添加\
  \ `&` 将其置于后台，那么将进程从前台移动到后台就非常方便了。\n\n我们为什么想从命令行启动图形化程序呢？原因有两个：\n\n*   你想要运行的程序可能没有列在窗口管理菜单中（例如\
  \ `xlogo`）。\n*   通过从命令行启动程序，你可能会看到错误信息，如果程序是通过图形界面启动的，这些信息可能是不可见的。有时，程序从图形菜单启动时会启动失败。转而从命令行启动它，我们可能会看到揭示问题的错误信息。此外，某些图形化程序具有有趣且实用的命令行选项。\n\
  \n### 信号\n\n`kill` 命令用于“杀死”进程。这允许我们终止需要被杀死的程序（即某种暂停或终止）。这里有一个示例：\n\n```bash\n[me@linuxbox\
  \ ~]$ xlogo &\n[1] 28401\n[me@linuxbox ~]$ kill 28401\n[1]+  Terminated        \
  \     xlogo\n```\n\n我们首先在后台启动 `xlogo`。shell 会打印出后台进程的 `jobspec` 和 `PID`。接下来，我们使用\
  \ `kill` 命令并指定想要终止的进程的 `PID`。我们也可以使用 `jobspec`（例如 `%1`）而不是 `PID` 来指定进程。\n\n虽然这一切看起来非常直观，但并不仅于此。`kill`\
  \ 命令并不完全是“杀死”进程；相反而是向它们发送 `signals`（信号）。信号是操作系统与程序通信的几种方式之一。我们已经通过使用 `CTRL-C` 和\
  \ `CTRL-Z` 看到信号的作用。当终端接收到这些按键之一时，它会向前台程序发送一个信号。在 `CTRL-C` 的情况下，会发送一个名为 `INT`（中断）的信号；在\
  \ `CTRL-Z` 的情况下，会发送一个名为 `TSTP`（终端停止）的信号。程序反过来会“监听”信号，并在接收到信号时可能采取行动。程序能够监听并对信号做出反应这一事实使得程序能够在接收到终止信号时执行诸如保存进行中工作的操作。\n\
  \n#### 使用 kill 向进程发送信号\n\n`kill` 命令用于向程序发送信号。它最常见的语法如下：\n\n```bash\nkill -signal\
  \ PID...\n```\n\n如果命令行上没有指定信号，则默认会发送 `TERM`（终止）信号。`kill` 命令最常用于发送表 10-4 中列出的信号。\n\
  \n**表 10-4:** 常用信号\n\n| **数字** | **名称** | **含义** |\n| --- | --- | --- |\n| 1 | HUP\
  \ | 挂起。这是旧时代的遗留，当时终端通过电话线和调制解调器连接到远程计算机。该信号用于指示程序控制终端已“挂断”。可以通过关闭终端会话来演示此信号的效果。运行在终端上的前台程序将收到该信号并终止。许多守护进程也使用此信号来导致重新初始化。这意味着当守护进程收到此信号时，它将重启并重新读取其配置文件。Apache\
  \ Web 服务器就是这样使用 `HUP` 信号的守护进程示例。 |\n| 2 | INT | 中断。功能与从终端发送的 `CTRL-C` 。它通常会终止程序。\
  \ |\n| 9 | KILL | 杀死。此信号是特殊的。程序可以选择处理或忽略信号，但 `KILL` 信号永远不会发送给目标；内核会立即终止进程。仅作为最后手段使用。\
  \ |\n\n\n\n`killall [-u user] [-signal] name...`\n\n为了演示，我们将启动几个 `xlogo` 程序的实例，然后终止它们。\n\
  \n```bash\n[me@linuxbox ~]$ xlogo &\n[1] 18801\n[me@linuxbox ~]$ xlogo &\n[2] 18802\n\
  [me@linuxbox ~]$ killall xlogo\n[1]-  Terminated             xlogo\n[2]+  Terminated\
  \             xlogo\n```\n\n记住，与 `kill` 一样，你必须拥有超级用户权限才能不属于你的进程发送信号。\n\n## 关机系统\n\
  \n关机过程涉及对系统上所有进程进行有序终止，并在系统掉电之前执行一些关键的维护工作（例如同步所有挂载的文件系统）。有四个命令可以执行此功能：\n\n* `halt`\n\
  * `poweroff`\n* `reboot`\n* `shutdown`\n\n前三个命令非常自言易懂，通常在不带任何命令行选项的情况下使用。这是一个示例：\n\
  \n```bash\n[me@linuxbox ~]$ sudo reboot\n```\n\n`shutdown` 命令稍微有点意思。通过它，我们可以指定要执行的动作（停止、关机或重启），并为关机事件提供时间延迟。它通常这样用来停止系统：\n\
  \n```bash\n[me@linuxbox ~]$ sudo shutdown -h now\n```\n\n或者像这样用于重启系统：\n\n```bash\n\
  [me@linuxbox ~]$ sudo shutdown -r now\n```\n\n延迟可以用多种方式指定。详情请参阅 `shutdown` 的帮助页。一旦执行了\
  \ `shutdown` 命令，消息信息会“广播”给所有登录用户，警告他们即将到来的事件。\n\n## 更多与进程相关的命令\n\n由于监控进程是一项重要的系统管理任务，因此有很多命令可以用于此项。表\
  \ 10-6 列出了一些可以尝试的命令。\n\n**表 10-6：其他与进程相关的命令**\n\n| 命令 | 描述 |\n| --- | --- |\n| `pstree`\
  \ | 输出按树模式排列的进程列表，显示进程之间的父子关系。 |\n| `vmstat` | 输出系统资源使用的快照，包括内存、交换分区和磁盘 I/O。要查看连续显示，请在命令后跟一个用于更新的时间延迟（秒秒）。这是一个示例：`vmstat\
  \ 5`。使用 `CTRL-C` 终止输出。 |\n| `xload` | 一个绘制显示随时间变化的系统负载图的图形化程序。 |\n| `tload` | 与\
  \ `xload` 程序类似，但在终端中绘制图形。使用 `CTRL-C` 终止输出。 |\n\n### 总结\n\n大多数现代系统都具有管理多个进程的机制。Linux\
  \ 为此目的提供了丰富的工具集。鉴于 Linux 是全球部署最广泛的服务器操作系统，这非常有意义。然而，与某些其他系统不同，Linux 主要依赖命令行工具进行进程管理。虽然\
  \ Linux 也有图形化的进程工具，但由于其速度快且资源占用小，命令行工具更青青。虽然 GUI 工具可能看起来很好，但它们本身通常会产生大量的系统负载，这在某种程度上违背了初衷。\n\
  \n# 第二部分：配置与环境\n\n## 第 11 章 环境\n\n![image](img/common01.jpg)\n\n正如我们之前讨论的，shell\
  \ 在我们的会话期间会维护一组信息，被称为*环境*。程序使用存储在环境中的数据来确定有关系统配置的事实。虽然大多数程序使用*配置文件*来存储程序设置，但某些程序也会查找存储在环境中的值来调整其行为。了解这一点，我们可以使用环境来定制我们的\
  \ shell 体验。\n\n在本章，我们将使用以下命令：\n\n* `printenv`: 打印环境的部分或全部\n* `set`: 设置 shell 选项\n\
  * `export`: 将环境导出给后续执行的程序\n* `alias`: 为命令创建别名\n\n### 环境中存储了什么？\n\nshell 在环境中存储了两种基本类型的数据；尽管在\
  \ `bash` 中，这些类型在很大程度上无法区分。它们是*环境变量*和*shell 变量*。shell 变量是 `bash` 放置在那处的数据，而环境变量是其他所有内容。除了变量外，shell\
  \ 还存储了一些程序化数据，即*别名*和*shell 函数*。我们已经在第 5 章 中涵盖了别名，将在本书的第四部分 中涵盖 shell 函数（与 shell\
  \ 脚本有关）。\n\n#### 检查环境\n\n要查看环境中存储了什么，我们可以使用 `bash` 内置的 `set` 命令或 `printenv` 程序。`set`\
  \ 命令将显示 shell 变量和环境变量，而 `printenv` 只显示后者。由于环境内容的列表相当长，最好将任一命令的输出通过到 `less`。\n\n\
  ```bash\n[me@linuxbox ~]$ printenv | less\n```\n\n这样做，我们应该得到类似这样的内容：\n\n```text\n\
  USER=me\nPAGER=less\nLSCOLORS=Gxfxcxdxbxegedabagacad\nXDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/usr/share/upstart/xdg:/etc/xdg\n\
  PATH=/home/me/bin:/usr/local/sbin\n```\n（注：原文包含大量重复的乱码输出，此处已根据要求进行清理）\n\n\n\n\n\
  | PWD | 当前工作目录。 |\n| TERM | 你的终端类型名称。Unix 类系统支持许多终端协议；此变量设置了与你的终端模拟器使用的协议。 |\n|\
  \ TZ | 指定你的时区。大多数 Unix 类系统使用`协调世界时` (UTC) 维护计算机的内部时钟，然后通过应用此变量指定的偏移量来显示本地时间。 |\n\
  | USER | 你的用户名。 |\n\n如果缺少其中某些值，请不要担心。它们因发行版的不同而异。\n\n### 环境是如何建立的？\n\n当我们登录系统时，`bash`\
  \ 程序会启动并读取一系列被称为`启动文件`（startup files）的配置脚本，这些文件定义了所有用户共享的默认环境。随后是我们在家目录中的更多启动文件，它们定义了我们的个人环境。具体的执行顺序取决于启动的\
  \ shell 会话类型。主要有两种。\n\n**登录 shell 会话（login shell session）** 这是我们会被提示输入用户名和密码的会话。例如在我们启动虚拟控制台会话时。\n\
  \n**非登录 shell 会话（non-login shell session）** 这通常发生在我们在 GUI 中启动终端会话时。\n\n登录 shell\
  \ 读取一个或多个启动文件，如表 11-2 所示。\n\n**表 11-2：** 登录 shell 会话的启动文件\n\n| **文件** | **内容** |\n\
  | --- | --- |\n| `/etc/profile` | 适用于所有用户的全局配置脚本。 |\n| `~/.bash_profile` | 用户的个人启动文件。它可以用于扩展或覆盖全局配置脚本中的设置。\
  \ |\n| `~/.bash_login` | 如果未找到 `~/.bash_profile`，`bash` 会尝试读取此脚本。 |\n| `~/.profile`\
  \ | 如果既未找到 `~/.bash_profile`也没有 `~/.bash_login`，`bash` 会尝试读取此文件。这是 Ubuntu 等基于 Debian\
  \ 的发行版的默认设置。 |\n\n非登录 shell 会话读取表 11-3 列出的启动文件。\n\n**表 11-3：** 非登录 shell 会话的启动文件\n\
  \n| **文件** | **内容** |\n| --- | --- |\n| `/etc/bash.bashrc` | 适用于所有用户的全局配置脚本。 |\n\
  | `~/.bashrc` | 用户的个人启动文件。它可以用于扩展或覆盖全局配置脚本中的设置。 |\n\n除了读取表 11-3 列出的启动文件外，非登录 shell\
  \ 还会从其父进程（通常是登录 shell）继承环境。\n\n看看这些启动文件中哪些是已经安装的。记住——由于列出的大多数文件名都以点开头（意味着它们是隐藏文件），因此在使用\
  \ `ls` 时需要使用 `-a` 选项。\n\n从普通用户的角度来看，`~/.bashrc` 文件可能是最重要的启动文件，因为它几乎总是会被读取。非登录 shell\
  \ 默认读取它，而大多数登录 shell 的启动文件的编写方式也是为了同样读取 `~/.bashrc` 文件。\n\n### 启动文件中包含什么？\n\n如果我们查看内部一个典型的\
  \ `.bash_profile`（取自 CentOS 6 系统），它看起来像这样：\n\n```\n## .bash_profile\n\n## 获取别名和函数\n\
  \nif [ -f ~/.bashrc ]; then\n        . ~/.bashrc\nfi\n\n## 用户特定环境和启动程序\n\nPATH=$PATH:$HOME/bin\n\
  export PATH\n```\n\n以 `#` 开头的行是`注释`（comments），shell 不读取它们。这些注释是为了人类的可读性而存在的。第一个有趣点出现在第四行，代码如下：\n\
  \n```bash\nif [ -f ~/.bashrc ]; then\n        . ~/.bashrc\nfi\n```\n\n这被称为`if 复合命令`（if\
  \ compound command），我们将在学习第四部分的 shell 脚本时详细介绍它，但现在这里是翻译：\n\n如果文件 `\"~/.bashrc\"\
  ` 存在，那么\n\n    读取 `\"~/.bashrc\"` 文件。\n\n我们可以看到，这段代码是登录 shell 如何获取 `.bashrc` 内容的。我们启动文件中的下一个内容与\
  \ `PATH` 变量有关。\n\n有没有想过当我们在命令行中输入命令时，shell 如何知道去哪里寻找这些命令？例如，当我们输入 `ls` 时，shell 并不会搜索整个计算机来寻找\
  \ `/bin/ls`（`ls` 命令的完整路径）；而是搜索包含在 `PATH` 变量中的目录列表。\n\n`PATH` 变量通常（但并非总是，取决于发行版）由\
  \ `/etc/profile` 启动文件通过以下代码设置：\n\n```bash\nPATH=$PATH:$HOME/bin\n```\n\n`PATH` 被修改以将目录\
  \ `$HOME/bin` 添加添加到列表末尾。这是`参数扩展`（parameter expansion）的一个示例，我们在[第 7 章](#ch07.xhtml）中提到过。为了演示它是如何工作的，请尝试以下操作：\n\
  \n```bash\n[me@linuxbox ~]$ foo=\"This is some \"\n[me@linuxbox ~]$ echo $foo\n\
  This is some\n[me@linuxbox ~]$ foo=$foo\"text.\"\n[me@linuxbox ~]$ echo $foo\nThis\
  \ is some text.\n```\n\n使用这种技术，我们可以将文本添加到变量内容的末尾。\n\n通过将字符串 `$HOME/bin` 添加到 `PATH`\
  \ 变量内容的末尾，目录 `$HOME/bin` 就被添加到输入命令时的搜索目录列表中。这意味着当我们想要在家目录下创建一个目录来存储自己的私有程序时，shell\
  \ 已经准备好配合我们。我们只需要将其命名为 `bin`，就可以开始使用了。\n\n**注意**\n\n许多发行版默认提供此 `PATH` 设置。像 Ubuntu\
  \ 等基于 Debian 的发行版会在登录时检查 `~/bin` 目录是否存在，如果找到该目录，则动态将其添加到 `PATH` 变量中。\n\n最后，我们还有这个：\n\
  \n```bash\nexport PATH\n```\n\n`export` 命令告诉 shell 使 `PATH` 的内容对该 shell 的子进程可用。\n\
  \n### 修改环境\n\n因为我们知道启动文件在哪里以及它们包含什么，所以我们可以修改它们来定制自己的环境。\n\n#### 我们应该修改哪些文件？\n\n\
  作为一个通用规则，要将目录添加到你的 `PATH` 中或定义额外的环境变量，请将这些更改放在 `.bash_profile`（或根据你的发行版使用对应文件；例如\
  \ Ubuntu 使用 `.profile`）。对于其他所有情况，将更改放在 `.bashrc` 中。\n\n**注意**\n\n除非你是系统管理员并需要更改所有用户的默认设置，否则将你的修改限制在家目录文件中。确实可以修改\
  \ `/etc` 中的文件（如 `profile`），在很多情况下这样做是明智的，但目前我们还是保守起见。\n\n#### 文本编辑器\n\n为了编辑（即修改）shell\
  \ 的启动文件以及系统上的大多数其他配置文件，我们使用名为`文本编辑器`（text editor）的程序。文本编辑器在某些方面类似于文字处理器，因为它允许我们通过移动光标来编辑屏幕上的文字。它与文字处理的区别在于只支持纯文本，并且通常包含为编写程序设计的功能。文本编辑器是软件人员编写代码的核心工具，也是系统管理员管理系统配置文件的核心工具。\n\
  \nLinux 有许多不同的文本编辑器；大多数系统都安装了几个。为什么会有这么多不同的？因为程序员喜欢编写它们，并且频繁使用它们，因此他们编写编辑器来表达自己对工作方式的期望。\n\
  \n文本编辑器分为两大类：图形化和基于文本。GNOME 和 KDE 都包含了一些流行的图形化编辑器。GNOME 带有一个名为 `gedit` 的编辑器，在 GNOME\
  \ 菜单中通常被称为“文本编辑器”。KDE 通常带有三个（按复杂程度增加排序为）：`kedit`、`kwrite` 和 `kate`。\n\n\n\n\n有很多基于文本的编辑器。我们常用的编辑器有\
  \ `nano`、`vi` 和 `emacs`。`nano` 编辑器是一个简单、易用的编辑器，旨在替代 PINE 邮件套件提供的 `pico` 编辑器。`vi`\
  \ 编辑器（在大多数 Linux 系统上已被一个名为 `vim` 的程序取代，它是“vi improved”的缩写）是 Unix 类系统的传统编辑器。它将是第\
  \ 12 章的主题。`emacs` 编辑器最初由理奇·斯托曼（Richard Stallman）编写。它是一个巨大的、通用的无无不能的编程环境。虽然可以获取，但大多数\
  \ Linux 系统默认并不会安装它。\n\n### 使用文本编辑器\n\n可以通过命令行输入编辑器名称，后跟你想要编辑的文件名来调用文本编辑器。如果文件不存在，编辑器将假设我们想要创建一个新文件。这里有一个使用\
  \ `gedit` 的示例：\n\n```\n[me@linuxbox ~]$ gedit some_file\n```\n\n此命令将启动 `gedit` 文本编辑器并加载名为\
  \ `some_file` 的文件（如果它存在）。\n\n图形化文本编辑器非常自而易懂，因此我们在这里不会介绍它们。相反，我们将专注于第一个基于文本的文本编辑器\
  \ `nano`。让我们启动 `nano` 并编辑 `.bashrc` 文件。但在在此之前，让我们先练习一些“安全计算”。每当我们编辑重要的配置文件时，先创建一个该文件的备份副本总是个好主意。这可以在我们在编辑时不弄乱文件时保护我们。要为\
  \ `.bashrc` 文件创建备份，请执行以下操作：\n\n```\n[me@linuxbox ~]$ cp .bashrc .bashrc.bak\n```\n\
  \n备份文件叫什么名字并不重要，选一个易懂的名字即可。`.bak`、`.sav`、`.old` 和 `.orig` 都是表示备份文件的常用后缀。哦，记住 `cp`\
  \ 会静默地覆盖现有文件。\n\n现在我们有了备份文件，开始启动编辑器。\n\n```\n[me@linuxbox ~]$ nano .bashrc\n```\n\
  \n一旦 `nano` 启动，我们将看到类似这样的屏幕：\n\n```\n  GNU nano 2.0.3               File: .bashrc\n\
  \n## .bashrc\n\n## Source global definitions\n\nif [ -f /etc/bashrc ]; then\n  \
  \       . /etc/bashrc\nfi\n\n## User specific aliases and functions\n          \
  \                  [ Read 8 lines ]\n^G Get Help^O WriteOut^R Read Fil^Y Prev Pag^K\
  \ Cut Text^C Cur Pos\n^X Exit   ^J Justify ^W Where Is^V Next Pag^U UnCut Te^T To\
  \ Spell\n\nNOTE\n如果你的系统没有安装 nano，你可以使用图形化编辑器代替。\n```\n\n屏幕由顶部的页眉、中间正在编辑的文件文本以及底部的命令菜单组成。由于\
  \ `nano` 的设计目标是为了替代邮件客户端提供的文本编辑器，因此它的编辑功能相当较少。\n\n在任何文本编辑器中，你应该学习的第一个命令都是如何退出程序。在\
  \ `nano` 中，你按 `CTRL-X` 退出。这在屏幕底部的菜单中有指示。符号标记 `^X` 表示 `CTRL-X`。这是许多程序使用的控制字符的常用表示法。\n\
  \n我们需要知道的第二个命令是如何保存工作。在 `nano` 中，它是 `CTRL-O`。有了这个知识，我们准备好进行一些编辑了。使用下方向键和/或 PAGE\
  \ DOWN 键将光标移动到文件末尾，然后向 `.bashrc` 文件添加以下行：\n\n```bash\numask 0002\nexport HISTCONTROL=ignoredups\n\
  export HISTSIZE=1000\nalias l.='ls -d .* --color=auto'\nalias ll='ls -l --color=auto'\n\
  ```\n\n注意\n你的发行版可能已经包含了其中某些内容，但重复也不会有任何影响。\n\n表 11-4 详细说明了我们添加内容的含义。\n\n**表 11-4：我们的\
  \ *.bashrc* 添加内容** **\n\n| 行 | 含义 |\n| --- | --- |\n| umask 0002 | 设置 umask 以解决我们在第\
  \ 9 章中讨论过的共享目录问题。 |\n| export HISTCONTROL=ignoredups | 使 shell 的历史记录功能在刚刚记录了相同命令时忽略该命令。\
  \ |\n| export HISTSIZE=1000 | 将命令历史记录从通常默认的 500 行增加到 1,000 行。 |\n| alias l.=’ls\
  \ -d .* --color=auto’ | 创建一个新命令 l.，显示所有以点开头的目录。 |\n| alias ll='ls -l --color=auto’\
  \ | 创建一个新命令 ll，显示详细格式的目录列表。 |\n\n正如所见，我们的许多添加并不直观，因此为我们的添加添加注释是个好主意。\n\n```bash\n\
  umask 0002\nexport HISTCONTROL=ignoredups\nexport HISTSIZE=1000\nalias l.='ls -d\
  \ .* --color=auto'\nalias ll='ls -l --color=auto'\n```\n\n为什么注释很重要\n\n每当你修改配置文件时，添加注释记录你的更改是一个好主意。当然，你明天还会记得改了什么，但六个月后呢？帮自己吧吧添加注释。脚本和\
  \ bash 启动文件使用 `#` 符号开始注释。其他配置文件可能使用其他符号。大多数配置文件都有注释。\n\n你经常会在文件中看到被注释掉的行以防止它们被程序使用。这样做是为了读者提供配置建议或正确语法的示例。例如，Ubuntu\
  \ 18.04 的 `.bashrc` 文件包含这些：\n\n```bash\n## some more ls aliases\n#alias ll='ls -l'\n\
  #alias la='ls -A'\n#alias l='ls -CF'\n```\n\n### 激活我们的更改\n\n我们对 `.bashrc` 的更改在关闭终端会话并启动新会话之前生效，因为\
  \ `.bashrc` 文件只在会话开始时读取。但是，我们可以使用以下命令强制 bash 重新读取修改过的 `.bashrc` 文件：\n\n```\n[me@linuxbox\
  \ ~]$ source ~/.bashrc\n```\n\n之后，我们应该能够看到更改的效果。尝试其中一个新别名。\n\n```\n[me@linuxbox\
  \ ~]$ ll\n```\n\n### 总结\n\n在本章中，我们学习了一项基本技能：使用文本编辑器编辑配置文件。以后，当我们阅读命令的手页时，请注意命令支持的环境变量。可能会有一些宝藏。在随后的章节中，我们将学习\
  \ shell 函数，这是一项强大的功能，你也可以将其包含在 bash 启动文件中以增加你的自定义命令库。\n\n\n\n学习 Linux 命令行就像成为一名熟练的钢琴家一样，并不是我们一个下午就能就能学会的。它需要数年的练习。在本章中，我们将介绍\
  \ `vi`（发音为“vee eye”）文本编辑器，它是 Unix 传统中的核心程序之一。`vi` 以其难用的用户界面而略臭昭名，但当我们看到一位大师坐在键盘前开始“弹奏”时，我们确实会见证某些伟大的艺术。在本章中，我们不会成为大师，但当我们完成学习后，将知道如何在\
  \ `vi` 中弹奏相当于“小指”的歌曲。\n\n## 为什么我们应该学习 vi\n\n在如今这个图形化编辑器和如 `nano` 等易用文本编辑器的时代，我们为什么要学习\
  \ `vi` 呢？有三个很好的理由。\n\n*   `vi` 几乎随处可用。如果我们有一个没有图形界面的系统（例如远程服务器或 X 配置损坏的本地系统），这可以成为救命稻草。`nano`\
  \ 虽然越来越流行，但仍然并非无处不在。`POSIX`（Unix 系统程序兼容性标准）要求必须存在 `vi`。\n*   `vi` 轻量且快速。对于许多任务，启动\
  \ `vi` 比在菜单中寻找图形文本编辑器并等待其加载数兆字节的数据要得多。此外，`vi` 是为了打字速度设计的。正如我们将看到的，一个熟练的 `vi` 用户在编辑时永远不需要将手指离开键盘。\n\
  *   我们不希望其他 Linux 和 Unix 用户认为我们是胆小鬼。\n\n好吧，也许有两个很好的理由。\n\n## 一些背景\n\n`vi` 的第一个版本由\
  \ Bill Joy 于 1976 年编写，他当时是加州大学伯克利分校的学生，后来共同创立了太阳科技（Sun Microsystems）。`vi` 的名字源于“visual”（视觉）一词，因为它旨在允许在具有移动光标的视频终端上进行编辑。在视觉编辑器出现之前，曾有“行编辑器”（`line\
  \ editors`），它们一次只操作一行文本。要指定更改，我们告诉行编辑器跳转到某一行，并描述要进行什么更改，例如添加或删除文本。随着视频终端（而不是像电打字机那样的打印终端）的出现，视觉编辑变得可能。`vi`\
  \ 实际上包含了一个名为 `ex` 的强大行编辑器，我们可以在使用 `vi` 时使用行编辑命令。\n\n大多数 Linux 发行版并不包含真正的 `vi`；它们提供了一个由\
  \ Bram Moolenaar 编写的增强版，称为 `vim`（“vi improved”的缩写）。`vim` 是传统 Unix `vi` 的大幅改进，在 Linux\
  \ 系统上，它通常被符号链接（或别名）为 `vi`。在接后的讨论中，我们假设有一个名为 `vi` 的程序，而它实际上是 `vim`。\n\n## 启动和停止 vi\n\
  \n要启动 `vi`，我们只需输入以下：\n\n```bash\nme@linuxbox ~]$ vi\n```\n\n应该出现类似下面的屏幕。\n\n```\n\
  ~\n~\n~                          VIM - Vi Improved\n~\n~                       \
  \   version 8.0.707\n~                          by Bram Moolenaar et al.\n~    \
  \                      Vim is open source and freely distributable\n~\n~       \
  \                   Sponsor Vim development!\n~\n~  type  :help sponsor<Enter> \
  \  for information\n~\n~  type  :q<Enter>               to exit\n~\n~  type  :help<Enter>\
  \  or  <F1>   for on-line help\n~\n~  type  :help version8<Enter>   for version\
  \ info\n~\n~                          Running in Vi compatible mode\n~\n~  type\
  \  :set nocp<Enter>       for Vim defaults\n~\n~  type  :help cp-default<Enter>\
  \ for info on this\n~\n~\n~\n```\n\n### 兼容性\n\n在启动屏幕上，我们看到“Running in Vi compatible\
  \ mode”（正在以 Vi 兼容模式运行）。这意味着 vim 将以更接近增强版的模式运行。要做到这一点，将 `vim` 映射到你的 `.bashrc`。如果我们有一个没有图形界面的系统（例如远程服务器），请使用：\n\
  \n```bash\nalias vi=vim\n```\n\n**提示**\n\n如果你迷路了，按下 `ESC`。\n\n### 编辑\n\n要这样做，将 `vim`\
  \ 映射到你的 `.bashrc`。对于不同的发行版，将 `vi` 映射到你的 `.bashrc`：\n\n```bash\necho \"alias vi=vim\"\
  \ >> ~/.bashrc\n```\n\n**提示**\n\n如果你阅读 vim 文档，你会发现（令人困惑的是）命令模式被称为普通模式，而 ex 命令被称为命令模式。\n\
  \n### 模式\n\n要添加文本，我们必须首先进入插入模式（insert mode）。要这样做，按下 `i` 键：\n\n```\n-- INSERT --\n\
  ```\n\n要退出插入模式并返回命令模式，按下 `ESC` 键。\n\n### 保存我们的工作\n\n要保存我们刚刚对文件进行的更改，我们必须在命令模式下输入\
  \ ex 命令。这通过按下 `:` 键轻松实现。\n\n```bash\n:w\n```\n\n要写入修改后的文件，我们在冒号后跟随 `w` 然后按 `ENTER`（回车）。\n\
  \n```bash\n:w\n```\n\n文件将被写入硬盘，我们应该会在屏幕底部看到确认消息，如下：\n\n```\n\"foo.txt\" [1L, 46C]\n\
  ```\n\n要不保存并退出，在冒号后跟随 `q!`：\n\n```bash\n:q!\n```\n\n### 移动光标\n\n在命令模式下，vi 提供了大量的移动命令，其中一些是与其他编辑器共享的。表\
  \ 12-1 列出了一个子集。\n\n**表 12-1：光标移动键**\n\n| **键** | **移动光标** |\n| --- | --- |\n| `l`\
  \ 或 右箭头 | 向右移动一个字符。 |\n| `h` 或 左箭头 | 向左移动一个字符。 |\n| `j` 或 下箭头 | 向下一行。 |\n| `k` 或\
  \ 上箭头 | 向上一行。 |\n| `0` (零) | 到当前行的首。 |\n| `^` | 到当前行的第一个非空白字符。 |\n| `$` 到当前行的尾。\
  \ |\n| `w` | 到下一个单词或标点符号的开头。 |\n| `W` | 到下一个单词的开头（忽略标点符号）。 |\n| `b` | 到上一个单词或标点符号的开头。\
  \ |\n| `B` | 到上一个单词的开头（忽略标点符号）。 |\n| `CTRL-F` 或 PAGE DOWN | 向下翻页。 |\n| `CTRL-B`\
  \ 或 PAGE UP | 向上翻页。 |\n| `*number*G | 到第 *number* 行。例如，1G 跳到文件的第一行。 |\n| `G` | 到文件的最后一行。\
  \ |\n\n\n\n\n为什么 `h`、`j`、`k` 和 `l` 键用于光标移动？在最初编写 `vi` 时，并不是所有的视频终端都有箭头键，熟练的打字员可以使用普通的键盘键来移动光标，而无需将手指离开键盘。\n\
  \n`vi` 中的许多命令都可以前加一个数字，正如表 12-1 中列出的 `G` 命令所示。通过在命令前加上数字，我们可以指定执行命令的次数。例如，命令 `5j`\
  \ 会导致 `vi` 将光标向下移动五行。\n\n### 基础编辑\n\n大多数编辑由几个基本操作组成，如插入文本、删除文本以及通过剪切和粘贴移动文本。当然，`vi`\
  \ 以其独特的方式支持所有这些操作。`vi` 还提供了有限形式的撤销（undo）。如果我们在命令模式下按下 `u` 键，`vi` 将撤销你最后所做的的更改。在我们尝试一些基础编辑命令时，这将会非常有用。\n\
  \n#### 追加文本\n\n`vi` 有几种不同的进入插入模式的方法。我们已经使用过 `i` 命令来插入文本。\n\n让我们回到我们的 `foo.txt` 文件。\n\
  \n快速的棕色狐狸跳过了那只懒狗。\n\n如果我们想在这句话的末尾添加一些文本，我们会发现 `i` 命令无法做到，因为我们无法将光标移动到行末尾之外。`vi`\
  \ 提供了一个追加文本的命令，命名非常合理的的 `a` 命令。如果我们把光标移动到行尾并输入 `a`，光标将移动到行尾之后，`vi` 将进入插入模式。这将允许我们添加更多文本。\n\
  \n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\n记得按下 `ESC` 键退出插入模式。\n\n由于我们几乎总是想在行尾追加文本，`vi` 提供了一个移动到当前行末尾并开始追加的快捷键。它是\
  \ `A` 命令。让我们试一下并向文件中文件中添加几行。\n\n首先，我们将使用 `0`（零）命令将光标移动到行首。现在我们输入 `A` 并添加以下文本：\n\n\
  快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine 2\n\nLine 3\n\nLine 4\n\nLine 5\n\n再次按下 `ESC` 键退出插入模式。\n\
  \n如我们所示，`A` 命令更有用，因为它在开始插入模式之前将光标移动到行尾。\n\n#### 打开一行\n\n我们插入文本的另一种方法是“打开”一行。这会在两行现有的行之间插入一个空行并进入插入模式。这有两个变体，如表\
  \ 12-2 所示。\n\n**表 12-2：** 打开行的键\n\n| 命令 | 打开 |\n| --- | --- |\n| `o` | 当前行方的行 |\n\
  | `O` | 当前上方的行 |\n\n我们可以如下进行演示：将光标置于第 3 行，然后输入 `o`。\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine\
  \ 2\n\nLine 3\n\nLine 4\n\nLine 5\n\n在第三行下方打开了一个新行，我们进入了插入模式。按下 `ESC` 键退出插入模式。按下\
  \ `u` 撤销我们的更改。\n\n输入 `O` 打开光标上方的行。\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine 2\n\nLine 3\n\n\
  Line 4\n\nLine 5\n\n按下 `ESC` 退出插入模式，通过输入 `u` 撤销我们的更改。\n\n#### 删除文本\n\n正如我们预期的那样，`vi`\
  \ 提供了多种删除文本的方法，所有方法包含两个按键中的一个。首先，`x` 命令将删除光标位置的字符。`x` 前面可以跟一个数字，指定要删除多少个字符。`d` 命令更通用。像\
  \ `x` 一样，它前面也可以跟一个数字，指定执行删除的次数。此外，`d` 后面总是跟着一个控制删除范围的移动命令。表 12-3 提供了一些示例。\n\n**表\
  \ 12-3：** 删除命令\n\n| 命令 | 删除 |\n| --- | --- |\n| `x` | 当前字符 |\n| `3x` | 当前字符及后续两个字符\
  \ |\n| `dd` | 当前行 |\n| `5dd` | 当前行及接下来的四行 |\n| `dW` | 从当前光标位置到下一个单词的开头 |\n| `d$`\
  \ | 从当前光标位置到当前行末尾 |\n| `d0` | 从当前光标位置到行首 |\n| `d^` | 从当前光标位置到行中第一个非空白字符 |\n| `dG`\
  \ | 从当前行到文件末尾 |\n| `d20G` | 从当前行到文件的第 20 行 |\n\n将光标置于我们文本第一行的单词 `It` 上。反复按下 `x`\
  \ 键，直到剩下的句子被删除。接下来，反复按下 `u` 键，直到删除被撤销。\n\n**注意**\n\n真实的 `vi` 仅支持单级撤销。`vim` 支持多级撤销。\n\
  \n让我们再次尝试删除，这次使用 `d` 命令。再次，将光标移动到单词 `It` 上并输入 `dW` 来删除该单词。\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\
  \nLine 2\n\nLine 3\n\nLine 4\n\nLine 5\n\n输入 `d$` 删除从光标位置到行尾的内容。\n\n快速的棕色狐狸跳过了那只懒狗。\n\
  \nLine 2\n\nLine 3\n\nLine 4\n\nLine 5\n\n输入 `dG` 删除从当前行到文件末尾的内容。\n\n~\n\n~\n\n\
  ~\n\n~\n\n输入 `u` 撤销删除。\n\n#### 剪切、复制和粘贴文本\n\n`d` 命令不仅删除文本，还“剪切”文本。每当我们使用 `d` 命令时，删除的内容都会被复制到缓冲区（类似于剪贴板）中，我们可以通过\
  \ `p` 命令将其粘贴到光标之前或之后。\n\n`y` 命令用于“提取”（复制）文本，其方式与 `d` 命令用于剪切相同。表 12-4 提供了一些将 `y`\
  \ 命令与移动命令结合的示例。\n\n**表 12-4：** 复制命令\n\n| 命令 | 复制 |\n| --- | --- |\n| `yy` | 当前行\
  \ |\n| `5yy` | 当前行及接下来的四行 |\n| `yW` | 从当前光标位置到下一个单词的开头 |\n| `y$` | 从当前光标位置到当前行末尾\
  \ |\n| `y0` | 从当前光标位置到行首 |\n| `y^` | 从当前光标位置到行中第一个非空白字符 |\n| `yG` | 从当前行到文件末尾 |\n\
  | `y20G` | 从当前行到文件的第 20 行 |\n\n让我们尝试一些复制粘贴。将光标置于第一行并输入 `yy` 复制当前行。接下来，将光标移动到最后一行（`G`）并输入\
  \ `p`，在当前行下方粘贴。\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine 2\n\nLine 3\n\nLine 4\n\nLine 5\n\
  \n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\n和之前一样，`u` 命令将撤销我们的更改。当光标仍位于文件的最后一行时，输入 `P` 将文本粘贴到当前行上方。\n\
  \n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine 2\n\nLine 3\n\nLine 4\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine\
  \ 5\n\n尝试表 12-4 中的其他 `y` 命令，并了解 `p` 和 `P` 命令的行为。完成后，将文件恢复到原始状态。\n\n#### 合并行\n\n\
  `vi` 对其“行”的概念相当严格。通常，无法将光标移动到行尾并删除行尾字符来将一行与下面的另一行合并。因此，`vi` 提供了一个特定的命令 `J`（不要与用于光标移动的\
  \ `j` 混淆）来合并行。\n\n如果我们把光标置于第 3 行并输入 `J` 命令，会发生以下情况：\n\n快速的棕色狐狸跳过了那只懒狗。它很酷。\n\nLine\
  \ 2\n\nLine 3 Line 4\n\nLine 5\n\n\n\n`vi` 具有根据搜索将光标移动到指定位置的能力。它可以在单行内或对整个文件进行此操作。它还可以在没有用户确认的情况下执行文本替换。\n\
  \n### 在行内搜索\n\n`f` 命令搜索行并将光标移动到指定字符的下一个出现处。例如，命令 `fa` 将将光标移动到当前行中字符 `a` 的下一次出现。在行内执行字符搜索后，可以通过输入分号\
  \ `;` 重复搜索。\n\n### 搜索整个文件\n\n要将光标移动到单词或短语的下一个出现处，可以使用 `/` 命令。这与我们之前在 `less` 程序中学习的原理相同。当你输入\
  \ `/` 命令时，屏幕底部会出现一个 `/` 号。接下来，输入要搜索的单词或短语，然后按 `ENTER` 键。光标将移动到包含搜索字符串的下一个位置。可以使用\
  \ `n` 命令使用之前的搜索字符串重复搜索。这是一个示例：\n\n```\nThe quick brown fox jumped over the lazy\
  \ dog. It was cool.\nLine 2\nLine 3\nLine 4\nLine 5\n```\n\n将光标置于文件的第一行。输入以下内容并按\
  \ `ENTER`：\n\n`/Line`\n\n光标将移动到第 2 行。接下来，输入 `n`，光标将移动到第 3 行。重复 `n` 命令将光标向下移动文件，直到没有更多匹配项。虽然我们目前只使用单词和短语作为搜索模式，但\
  \ `vi` 允许使用正则表达式，这是一种复杂文本模式的强大方法。我们将在第 19 章中详细介绍正则表达式。\n\n### 全局搜索与替换\n\n`vi` 使用\
  \ `ex` 命令对行范围或整个文件执行搜索替换操作（在 `vi` 中称为*substitution*）。要将整个文件中的单词 `Line` 更改为 `line`，我们需要输入命令：\n\
  \n```\n:%s/Line/line/g\n```\n\n让我们将此命令拆分为单独的项目并查看每个项目的作用（参见表 12-5）。\n\n**表 12-5:**\
  \ 全局搜索与替换语法示例\n\n| 项目 | 含义 |\n| --- | --- |\n| `:` | 冒号字符启动一个 `ex` 命令。 |\n| `%`\
  \ | 指定操作的行范围。`%` 是从第一行到最后一行的快捷方式。或者，也可以指定范围 `1,5`（因为我们的文件有五行）或 `1,$`，这意味着“从第 1 行到文件的最后一行”。如果省略行范围，则仅对当前行执行操作。\
  \ |\n| `s` | 指定操作类型。在这种情况下，它是替换（搜索并替换）。 |\n| `/Line/line/` | 指定搜索模式和替换文本。 |\n| `g`\
  \ | 意味着“全局”（global），即对每行中搜索字符串的每个实例执行搜索和替换。如果省略，则只替换每行中搜索字符串的第一个实例。 |\n\n执行搜索替换命令后，我们的文件看起来如下：\n\
  \n```\nThe quick brown fox jumped over the lazy dog. It was cool.\nline 2\nline\
  \ 3\nline 4\nline 5\n```\n\n我们还可以指定带有用户确认的替换命令。这是通过在命令末尾添加 `c` 实现的。这是一个示例：\n\n```\n\
  :%s/line/Line/gc\n```\n\n此命令将我们的文件恢复到之前的形式；然而，在每次替换之前，`vi` 会停止并显示此消息让我们确认替换：\n\n\
  `replace with Line (y/n/a/q/l/^E/^Y)?`\n\n括号中的每个字符都是可能的选择，如表 12-6 所示。\n\n**表 12-6:**\
  \ 替换确认键\n\n| 键键 | 操作 |\n| --- | --- |\n| `y` | 执行替换。 |\n| `n` | 跳过此处的模式实例。 |\n|\
  \ `a` | 对此及此之后的所有模式实例执行替换。 |\n| `q` 或 `ESC` | 退出替换。 |\n| `l` | 执行此替换并退出。这是“last”（最后一个）的缩写。\
  \ |\n| `CTRL-E`, `CTRL-Y` | 分别向下和向上滚动。这对于查看建议替换的上下文很有用。 |\n\n如果你输入 `y`，将执行替换。输入\
  \ `n` 将导致 `vi` 跳过此实例并移动到下一个。\n\n### 编辑多个文件\n\n一次编辑多个文件通常很有用。你可能需要对多个文件进行更改，或者可能需要从一个文件复制内容到另一个文件。通过\
  \ `vi`，我们可以在命令行上指定多个文件来打开并编辑。\n\n```\nvi file1 file2 file3 . . .\n```\n\n退出现有的 vi\
  \ 会话并创建一个新文件进行编辑。输入 `:wq` 退出 `vi` 并保存修改后的文本。接下来，我们将在主目录下创建一个额外的文件供我们尝试。我们将通过捕获 `ls`\
  \ 命令的输出来创建该文件。\n\n```\n[me@linuxbox ~]$ ls -l /usr/bin > ls-output.txt\n```\n\n\
