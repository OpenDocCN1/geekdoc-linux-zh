  ```\nThe quick brown fox jumped over the lazy dog. It was cool.\nLine 2\nLine 3\n\
  Line 4\nLine 5\n```\n\n将光标置于文件的第一行。输入以下内容并按 `ENTER`：\n\n`/Line`\n\n光标将移动到第 2 行。接下来，输入\
  \ `n`，光标将移动到第 3 行。重复 `n` 命令将光标向下移动文件，直到没有更多匹配项。虽然我们目前只使用单词和短语作为搜索模式，但 `vi` 允许使用正则表达式，这是一种复杂文本模式的强大方法。我们将在第\
  \ 19 章中详细介绍正则表达式。\n\n### 全局搜索与替换\n\n`vi` 使用 `ex` 命令对行范围或整个文件执行搜索替换操作（在 `vi` 中称为*substitution*）。要将整个文件中的单词\
  \ `Line` 更改为 `line`，我们需要输入命令：\n\n```\n:%s/Line/line/g\n```\n\n让我们将此命令拆分为单独的项目并查看每个项目的作用（参见表\
  \ 12-5）。\n\n**表 12-5:** 全局搜索与替换语法示例\n\n| 项目 | 含义 |\n| --- | --- |\n| `:` | 冒号字符启动一个\
  \ `ex` 命令。 |\n| `%` | 指定操作的行范围。`%` 是从第一行到最后一行的快捷方式。或者，也可以指定范围 `1,5`（因为我们的文件有五行）或\
  \ `1,$`，这意味着“从第 1 行到文件的最后一行。”如果省略行范围，则仅对当前行执行操作。 |\n| `s` | 指定操作类型。在这种情况下，它是替换（搜索并替换）。\
  \ |\n| `/Line/line/` | 指定搜索模式和替换文本。 |\n| `g` | 意味着“全局”（global），即对每行中搜索字符串的每个实例执行搜索和替换。如果省略，则只替换每行中搜索字符串的第一个实例。\
