  \ | less\n```\n\n**提示**\n\n还有一个 `zless` 程序。它执行的功能与之前的管道相同。\n\n### 归档\n\n一种常见的文件管理任务经常配合压缩使用是*归档*。归档是将许多文件打包成一个文件的过程。归档通常作为系统备份。也适用于旧数据移动到某些长期存储。\n\
  \n### tar\n\n在 Unix 类软件世界中，`tar` 程序是归档文件的经典工具。它的名字是“磁带归档”（tape archive），揭示了它作为磁带工具的起源。虽然它仍用于该传统任务，但在其他设备上同样高效。我们经常看到以\
  \ `.tar` 或 `.tgz` 结尾的文件，分别表示普通 tar 归档和 gzip 归档。tar 归档可以一组文件、一个或多个目录层次，或者两者的混合。命令语法如下：\n\
  \n```\ntar mode[options] pathname...\n```\n\n在这里，`mode` 是表 18-2 所示的操作模式之一。\n\n**表\
  \ 18-2:** tar 模式\n\n| 模式 | 描述 |\n| --- | --- |\n| c | 从文件和目录列表创建归档。 |\n| x | 提取归档。\
  \ |\n| r | 将指定的路径追加到归档末尾。 |\n| t | 列出归档的内容。 |\n\n`tar` 使用选项的方式略显奇异，因此我们需要一些示例来展示它是如何工作的。首先，让我们重新创建上一个章节中的实验场。\n\
  \n```\n[me@linuxbox ~]$ mkdir -p playground/dir-{001..100}\n[me@linuxbox ~]$ touch\
  \ playground/dir-{001..100}/file-{A..Z}\n```\n\n接下来，让我们为整个实验场创建一个名为 `playground.tar`\
  \ 的归档。\n\n```\n[me@linuxbox ~]$ tar cf playground.tar playground\n```\n\n\n\n\n\
  列出归档的内容，我们可以这样操作：\n\n```bash\n[me@linuxbox ~]$ tar tf playground.tar\n```\n\n为了获得更详细的列表，我们可以添加\
  \ `v`（详细模式）选项。\n\n```bash\n[me@linuxbox ~]$ tar tvf playground.tar\n```\n\n现在，让我们在一个新位置提取\
  \ `playground`。我们将通过创建一个名为 `foo` 的新目录、进入该目录、并提取 tar 归档来实现这一操作。\n\n```bash\n[me@linuxbox\
  \ ~]$ mkdir foo\n[me@linuxbox ~]$ cd foo\n[me@linuxbox foo]$ tar xf ../playground.tar\n\
  [me@linuxbox foo]$ ls\nplayground\n```\n\n如果我们检查 `~/foo/playground` 的内容，会发现归档已成功安装，创建了原始文件的精确复制。然而，有一个注意事项：除非我们以超级用户（superuser）身份操作，否则从归档中提取的文件和目录将所有权归执行恢复操作的用户，而不是原始所有者。\n\
  \n`tar` 的另一个有趣的行为是它处理归档中路径的方式。路径的默认是相对路径，而不是绝对路径。`tar` 通过在创建归档时简单地删除路径中的任何领先斜杠来实现的。为了演示，我们将重新创建归档，这次指定一个绝对路径。\n\
  \n```bash\n[me@linuxbox foo]$ cd\n[me@linuxbox ~]$ tar cf playground2.tar ~/playground\n\
  ```\n\n记住，当我们按下回车键时，`~/playground` 将展开为 `/home/me/playground`，因此我们将为演示演示获得一个绝对路径。接下来，我们将像之前一样提取归档并观察发生了什么。\n\
  \n```bash\n[me@linuxbox ~]$ cd foo\n[me@linuxbox foo]$ tar xf ../playground2.tar\n\
  [me@linuxbox foo]$ ls\nhome   playground\n[me@linuxbox foo]$ ls home\nme\n[me@linuxbox\
  \ foo]$ ls home/me\nplayground\n```\n\n在这里我们可以看到，当我们提取第二个归档时，它相对于我们当前的工作目录 `~/foo`\
  \ 重新创建了目录 `home/me/playground`，而不是相对于根目录（如果是绝对路径的话，就会是那样）。这种工作方式似乎很奇怪，但实际上这样更有用，因为它允许我们将归档提取到任何位置，而不是被迫提取到它们的原始位置。包含详细选项（`v`）并重复该练习将更清楚地展示发生了什么。\n\
  \n让我们考虑一个 `tar` 运行的一个假设但实际的示例。假设我们想将家目录及其内容从一个系统复制到另一个系统，并且有一个大 USB 硬盘可以用于传输。在我们现代的\
  \ Linux 系统上，该硬盘“自动”挂载在 `/media` 目录。让我们也假设在连接磁盘时，它的卷名为 `BigDisk`。为了制作 tar 归档，我们可以执行以下操作：\n\
  \n```bash\n[me@linuxbox ~]$ sudo tar cf /media/BigDisk/home.tar /home\n```\n\n在写入\
  \ tar 文件后，我们卸载硬盘并将其连接到第二台计算机。同样，它被挂载在 `/media/BigDisk`。要提取归档，我们这样做：\n\n```bash\n\
  [me@linuxbox2 ~]$ cd /\n[me@linuxbox2 /]$ sudo tar xf /media/BigDisk/home.tar\n\
  ```\n\n这里看到的重要的是，我们必须先切换目录到 `/*`，这样提取就是相对于根目录的，因为归档内的所有路径都是相对路径。\n\n在提取归档时，可以限制从归档中提取的内容。例如，如果我们想从归档中提取单个文件，可以这样做：\n\
  \n```bash\ntar xf archive.tar pathname\n```\n\n通过在命令末尾添加路径，`tar` 将只恢复指定的文件。可以指定多个路径。注意，该路径必须是存储在归档中的完整、确切的相对路径。在指定路径时，通常不支持通配符；但是，GNU\
  \ 版本的 `tar`（Linux 发行版中最常见的版本）支持通过 `--wildcards` 选项使用它们。这里有一个使用我们之前的 `playground.tar`\
  \ 文件的示例：\n\n```bash\n[me@linuxbox ~]$ cd foo\n[me@linuxbox foo]$ tar xf ../playground2.tar\
  \ --wildcards 'home/me/playground/dir-*/file-A'\n```\n\n此命令将仅提取与指定路径（包括通配符 `dir-*`）匹配的文件。\n\
  \n`tar` 经常与 `find` 结合使用产生归档。在这个示例中，我们将使用 `find` 生成一组要包含在归档中的文件。\n\n```bash\n[me@linuxbox\
  \ ~]$ find playground -name 'file-A' -exec tar rf playground.tar '{}' '+'\n```\n\
  \n在这里，我们使用 `find` 匹配 `playground` 中所有名为 `file-A` 的文件，然后使用 `-exec` 动作以追加模式（`r`）调用\
  \ `tar`，将匹配的文件添加到归档 `playground.tar` 中。\n\n将 `tar` 与 `find` 是创建目录树或整个系统的*增量备份*的好方法。通过使用\
  \ `find` 匹配比时间戳文件新的文件，我们可以创建一个包含比上次归档新的文件的归档，假设时间戳文件在每次创建归档后都已更新。\n\n`tar` 还可以利用标准输入和输出。这里是一个综合示例：\n\
  \n```bash\n[me@linuxbox foo]$ cd\n[me@linuxbox ~]$ find playground -name 'file-A'\
  \ | tar cf - | gzip\n```\n\n在这个示例中，我们使用 `find` 产生文件列表并传递给 `tar`。如果指定文件名 `-`，它意味着标准输入或输出（通过这种方式，`find`\
  \ 产生的文件列表被传递给 `tar`）。`--files-from` 选项（指定为 `-`）导致 `tar` 从文件读取路径名。最后，`tar` 产生的归档通过\
  \ `gzip` 创建了 `playground.tgz`。`.tgz` 扩展是 gzip 压缩 tar 文件的约定。虽然我们使用了外部的 `gzip` 程序来产生归档，但现代\
  \ GNU `tar` 通过 `z` 选项直接支持 gzip 压缩。以我们之前的示例为基础，我们可以这样简化：\n\n```bash\n[me@linuxbox\
  \ ~]$ find playground -name 'file-A' | tar czf playground.tgz -\n```\n\n如果我们想创建一个\
  \ bzip2 压缩归档，可以这样做：\n\n```bash\n[me@linuxbox ~]$ find playground -name 'file-A'\
  \ | tar cjf playground.tbz -\n```\n\n通过只需将压缩选项从 `z` 改为 `j`（并将输出文件扩展改为 `.tbz` 以指示\
  \ bzip2 压缩文件），我们就启用了 bzip2 压缩。\n\n\n\n`zip` 程序既是压缩工具也是归档工具。该程序使用的文件格式对 Windows 用户来说非常熟悉，因为它读取和写入的是\
  \ `*.zip` 文件。在 Linux 中，`gzip` 是主要的压缩程序，`bzip2` 紧随其后。\n\n在最基本的用法下，`zip` 的调用方式如下：\n\
  \n```\nzip options zipfile file...\n```\n\n例如，为了为我们的 playground 创建一个 zip 归档，我们可以这样操作：\n\
  \n```\n[me@linuxbox ~]$ zip -r playground.zip playground\n```\n\n除非我们包含 `-r` 递归选项，否则只会存储\
  \ `playground` 目录（但不包含其任何内容）。虽然会自动添加 `*.zip` 扩展名，但为了清晰起见，我们会加上文件后缀。\n\n在创建 zip 归档期间，`zip`\
  \ 通常会显示一系列如下的消息：\n\n```\n adding: playground/dir-020/file-Z (stored 0%)\n adding:\
  \ playground/dir-020/file-Y (stored 0%)\n adding: playground/dir-020/file-X (stored\
  \ 0%)\n adding: playground/dir-087/ (stored 0%)\n adding: playground/dir-087/file-S\
  \ (stored 0%)\n```\n\n这些消息显示了添加到归档中的每个文件的状态。`zip` 将使用两种存储方法之一将文件添加到归档中：要么在不压缩的情况下“存储”（store）文件，如此处所示；要么“压缩胀”（deflate）文件以执行压缩。存储方法后显示的数字数值表示所实现的压缩量。由于我们的\
  \ playground 仅包含空文件，因此未对其内容进行任何压缩。\n\n使用 `unzip` 程序提取 zip 文件的内容是直接的。\n\n```\n[me@linuxbox\
  \ ~]$ cd foo\n[me@linuxbox foo]$ unzip ../playground.zip\n```\n\n关于 `zip`（与 `tar`\
  \ 相比）需要注意的一点是，如果指定了已存在的归档，它将进行更新而不是替换。这意味着现有的归档会被保留，但会添加新文件，并替换匹配的文件。\n\n我们可以通过向\
  \ `unzip` 指定文件，从 zip 归档中选择性地列出和提取文件。\n\n```\n[me@linuxbox ~]$ unzip -l playground.zip\
  \ playground/dir-087/file-Z\n```\n\nArchive:  ../playground.zip\n   Length     \
  \ Date    Time    Name\n  --------    ----    ----    ----\n         0  10-05-18\
  \ 09:25   playground/dir-087/file-Z\n  --------                       -------\n\
  \                             01 file\n```\n\n```\n[me@linuxbox ~]$ cd foo\n[me@linuxbox\
  \ foo]$ unzip ../playground.zip playground/dir-087/file-Z\n\nArchive:  ../playground.zip\n\
  replace playground/dir-087/file-Z? [y]es, [n]o, [A]ll, [N]one, [r]ename: y\nextracting:\
  \ playground/dir-087/file-Z\n```\n\n使用 `-l` 选项会导致 `unzip` 只列出归档的内容而不提取文件。如果没有指定文件，`unzip`\
  \ 将列出归档中的所有文件。可以添加 `-v` 选项来增加列表的详细程度。注意，当提取与现有文件冲突时，用户会在文件替换之前收到提示。\n\n和 `tar` 一样，`zip`\
  \ 可以利用标准输入和输出，尽管它的实现用途相对较小。可以通过 `-@` 选项将文件名列表传递给 `zip`。\n\n```\n[me@linuxbox foo]$\
  \ cd\n[me@linuxbox ~]$ find playground -name \"file-A\" | zip -@ file-A.zip\n```\n\
  \n在这里，我们使用 `find` 生成一个匹配测试 `-name \"file-A\"` 的文件列表，然后将列表传递给 `zip`，创建一个包含所选文件的 `file-A.zip`\
  \ 归档。\n\n`zip` 也支持将其输出写入标准输出，但其用途非常有限，因为很少有程序可以使用该输出。遗憾的是，`unzip` 程序不接受标准输入。这阻止了\
  \ `zip` 和 `unzip` 像 `tar` 那样结合使用执行网络文件复制。\n\n然而，`zip` 可以接受标准输入，因此它可以用于压缩其他程序的输出。\n\
  \n```\n[me@linuxbox ~]$ ls -l /etc/ | zip ls-etc.zip -\n adding: - (deflated 80%)\n\
  ```\n\n在这个示例中，我们将 `ls` 的输出管道到 `zip`。像 `tar` 一样，`zip` 将最后的连字符解释为“使用标准输入作为输入文件”。\n\
  \n`unzip` 程序允许在指定 `-p`（用于管道）选项将其将其发送到标准输出。\n\n```\n[me@linuxbox ~]$ unzip -p ls-etc.zip\
  \ | less\n```\n\n我们提到了 `zip/unzip` 可以做的一些基础操作。它们都有许多增加灵活性的选项，尽管某些选项是针对其他特定系统的。两者的手册页（man\
  \ pages）写得很好。\n\n### 同步文件和目录\n\n维护备份的一种常用策略是保持一个目录与另一个目录同步。`rsync` 是为此目的的强大工具。它比较源和目的地的文件，仅传输差异。这使其变得非常高效，特别是对于大型目录。\n\
  \n`rsync` 通常像这样使用：\n\n```\nrsync [options] source destination\n```\n\n`-a` 选项（归档模式）非常常见；它是一组保留权限、所有者、时间戳和符号链接的选项。`-v`\
  \ 选项显示正在传输的文件，`-z` 选项（压缩）在传输过程中对数据进行压缩。\n\n让我们尝试对一些文件使用 `rsync`。首先，清理 *foo*。\n\n\
  ```\n[me@linuxbox ~]$ rm -rf foo\n```\n\n接下来，我们将 `playground` 与 `foo` 同步。\n\n```\n\
  [me@linuxbox ~]$ rsync -av playground foo\n```\n\n在命令运行时，我们将看到正在复制的文件列表。在最后，我们将看到一个指示复制量的摘要：\n\
  \n```\nsent 135759 bytes  received 57870 bytes  387258.00 bytes/sec\ntotal size\
  \ 3230  speedup 0.02\n```\n\n如果我们再次运行命令，我们将看到不同的结果。\n\n```\n[me@linuxbox ~]$ rsync\
  \ -av playground foo\n```\n\n注意没有文件列表。这是因为 `rsync` 检测到 `playground` 和 `foo` 之间没有差异，因此它不需要复制任何内容。如果我们在\
  \ `playground` 中修改一个文件并再次运行 `rsync`：\n\n```\n[me@linuxbox ~]$ touch playground/dir-099/file-Z\n\
  [me@linuxbox ~]$ rsync -av playground foo\n```\n\n```\nbuilding file list ...\n\
  playground/dir-099/file-Z\nsent 22685 bytes  received 42 bytes  45454.00 bytes/sec\n\
  total size 3230  speedup 0.14\n```\n\n我们看到 `rsync` 检测到了变化并仅复制了更新的文件。\n\n当我们指定 `rsync`\
  \ 源时，有一个微妙但实用的功能。考虑两个目录。\n\n```\n[me@linuxbox ~]$ ls\nsource  destination\n```\n\
  \n目录 *source* 包含名为 *file1* 的文件，而目录 *destination* 是空的。如果我们这样将 *source* 复制到 *destination*：\n\
  \n```\n[me@linuxbox ~]$ rsync source destination\n```\n\n那么 `rsync` 将目录 *source*\
  \ 复制到 *destination* 中。\n\n```\n[me@linuxbox ~]$ ls destination\nsource\n```\n\n\
  然而，如果我们在源目录名称后面加上斜杠 `/`，`rsync` 将复制源目录的内容，而不是目录本身。\n\n```\n[me@linuxbox ~]$ rsync\
  \ source/ destination\n```\n\n\n\n\n```bash\n[me@linuxbox ~]$ ls destination\nfile1\n\
  ```\n\n当我们只想复制目录下的内容，而不希望在目标目录中创建另一层目录时，这种方法非常方便。我们可以将其结果看作等同于 `source/**`，但这种方法会复制源目录的所有内容，包括隐藏文件。\n\
  \n举个实际的例子，让我们考虑之前用 `tar` 使用过的那个虚拟外部硬盘。如果我们将该硬盘连接到系统，并且它再次被挂载在 `/media/BigDisk`，我们可以通过先在外部硬盘上创建一个名为\
  \ `/backup` 的目录，然后使用 `rsync` 将系统中最重要的内容复制到外部硬盘，从而完成一次实用的系统备份。\n\n```bash\n[me@linuxbox\
  \ ~]$ mkdir /media/BigDisk/backup\n[me@linuxbox ~]$ sudo rsync -av --delete /etc\
  \ /home /usr/local /media/BigDisk/backup\n```\n\n在这个示例中，我们从系统将 `/etc`、`/home` 和\
  \ `/usr/local` 目录复制到了我们那个虚拟的存储设备中。我们包含了 `--delete` 选项，用于删除备份设备上可能存在但源设备上已不存在的文件（这在第一次进行备份时无关，但在随后的复制中将非常有用）。重复连接外部硬盘并运行此\
  \ `rsync` 命令是保持小型系统备份的一种有效（尽管并非理想）的方法。当然，在此处使用别名（alias）也会很有帮助。我们可以创建一个别名并将其添加到 `.bashrc`\
  \ 文件中以提供这一功能。\n\n```bash\nalias backup='sudo rsync -av --delete /etc /home /usr/local\
  \ /media/BigDisk/backup'\n```\n\n现在，我们所做的就是连接外部硬盘并运行备份命令来完成工作了。\n\n### 通过网络使用 rsync\n\
  \n`rsync` 的强大之处之一是它可以用于通过网络复制文件。毕竟，`rsync` 中的 `r` 代表“remote”（远程）。远程复制可以通过两种方式实现。第一种方法是使用另一个安装了\
  \ `rsync` 的系统，以及如 `ssh` 这样的远程 shell 程序。假设我们的局域网上有另一个拥有大量可用硬盘空间的系统，我们想使用远程系统而不是外部硬盘来执行备份操作。假设该系统已经有一个名为\
  \ `/backup` 的目录用于存放文件，我们可以这样做：\n\n```bash\n[me@linuxbox ~]$ sudo rsync -av --delete\
  \ --rsh=ssh /etc /home /usr/local remote-sys:/backup\n```\n\n为了方便网络复制，我们对命令做了两处修改。首先，我们添加了\
  \ `--rsh=ssh` 选项，它指示 `rsync` 使用 `ssh` 程序作为其远程 shell。通过这种方式，我们能够使用 `ssh` 加密隧道安全数据从本地系统传输到远程主机。其次，我们通过在目标路径名前加上远程主机名（在本例中远程主机名为\
  \ `remote-sys`）来指定远程主机。\n\n使用 `rsync` 通过网络同步文件的第二种方法是使用 `rsync server`。`rsync` 可以配置为作为守护进程（daemon）运行，并监听传入的同步请求。这通常用于允许对远程系统进行镜像。例如，红帽软件（Red\
  \ Hat Software）为其 Fedora 发行版维护着一个巨大的开发中软件软件包仓库。这对于软件的实际事实同步来说非常有用。\n\n```bash\n\
  [me@linuxbox ~]$ sudo rsync -av --delete --rsh=ssh /etc /home /usr/local remote-sys:/backup\n\
  ```\n\n（注：提供的文本末尾包含大量重复/乱码文本，已根据指令清理核心内容，以保留有价值信息并移除冗余噪声。）\n\nrsync 可以配置为作为守护进程运行，并监听传入的同步请求。这通常用于允许对远程系统进行镜像。\n\
  \n### 总结\n\n对于我们的讨论，我们将限制在 POSIX 标准描述的正正则表达式范围内，它涵盖了大部分情况。\n\n```bash\n[me@linuxbox\
  \ ~]$ sudo rsync -av --delete --rsh=ssh /etc /home /usr/local remote-sys:/backup\n\
  ```\n\n\n\n\n\n| -n | --line-number | 在每个匹配的行前加上该行在文件中的行号。 |\n| -h | --no-filename\
  \ | 对于多文件搜索，抑制文件名的输出。 |\n\n为了更全面地探索 `grep`，让我们创建一些文本文件进行搜索。\n\n```bash\n[me@linuxbox\
  \ ~]$ ls /bin > dirlist-bin.txt\n[me@linuxbox ~]$ ls /usr/bin > dirlist-usr-bin.txt\n\
  [me@linuxbox ~]$ ls /sbin > dirlist-sbin.txt\n[me@linuxbox ~]$ ls /usr/sbin > dirlist-usr-sbin.txt\n\
  [me@linuxbox ~]$ ls dirlist*.txt\n```\ndirlist-bin.txt   dirlist-sbin.txt      dirlist-usr-sbin.txt\n\
  dirlist-usr-bin.txt\n\n我们可以这样对文件列表进行简单的搜索：\n\n```bash\n[me@linuxbox ~]$ grep bzip\
  \ dirlist*.txt\n```\ndirlist-bin.txt:bzip2\ndirlist-bin.txt:bzip2recover\n\n在这个示例中，`grep`\
  \ 在所有列出的文件中搜索字符串 `bzip`，并找到了两个匹配项，都在 `dirlist-bin.txt` 文件中。如果我们只对包含匹配项的文件列表而不是匹配项本身感兴趣，可以使用\
  \ `-l` 选项。\n\n```bash\n[me@linuxbox ~]$ grep -l bzip dirlist*.txt\n```\ndirlist-bin.txt\n\
  \n相反，如果我们只想看到不包含匹配项的文件列表，可以这样做：\n\n```bash\n[me@linuxbox ~]$ grep -L bzip dirlist-dirlist.txt\n\
  ```\ndirlist-sbin.txt\ndirlist-usr-bin.txt\ndirlist-usr-sbin.txt\n\n### 元字符与字面量\n\
  \n虽然这看起来可能并不显而易见，但我们的 `grep` 搜索一直在使用正则表达式，尽管是非常简单的正则。正则表达式 `bzip` 意味着只有当文件中的行至少包含四个字符，并且在行的某处按顺序发现了字符\
  \ `b`、`z`、`i` 和 `p` 这几个字符且中间没有其他字符时，才会发生匹配。字符串 `bzip` 中的字符都是**字面量字符**，因为它们匹配它们自己。除了字面量外，正则表达式还可能包含**元字符**，用于指定更复杂的匹配。正则表达式元字符包含以下内容：\n\
  \n```\n^ $ . [ ] { } - ? * + ( ) | \\\n```\n\n所有其他字符都被视为字面量，尽管反斜线字符 `\\` 在少数情况下用于创建元序列（metasequences），并允许元字符被转义并被视为字面量处理，而不是解释为元字符。\n\
  \n**注意**\n正如我们所看到的，许多正则表达式元字符也是执行扩展时对 shell 具有意义的字符。当我们通过命令行传递包含元字符的正则表达式时，将它们封装在引号中是至关重要的，以防止\
  \ shell 尝试对其进行扩展。\n\n### 通用字符\n\n我们将查看的第一个元字符是点 `.` 或句点字符，它用于匹配任何字符。如果我们将其包含正则表达式中，它将匹配该位置上的任何字符。这里有一个例子：\n\
  \n```bash\n[me@linuxbox ~]$ grep -h '.zip' dirlist*.txt\n```\nbunzip2\nbzip2\nbzip2recover\n\
  gunzip\ngzip\nfunzip\ngpg-zip\npreunzip\nprezip\nprezip-bin\nunzip\nunzipsfx\n\n\
  我们在文件中搜索了匹配正则表达式 `*.zip` 的任何行。关于结果有几点有趣的现象需要注意。注意没有找到 `zip` 程序。这是因为在正则表达式中包含点元字符将所需匹配的长度增加到了四个字符，而由于\
  \ `zip`  de 名称仅包含三个字符，因此它不匹配。此外，如果我们列表中的任何文件包含扩展名 `.zip`，它们也会被匹配到，因为文件扩展名中的点字符也会被“任意字符”所匹配。\n\
  \n### 锚点\n\n脱字符符号 `^` 和美元符号 `$` 在正则表达式中被视为**锚点**（anchors）。这意味着只有当正则表达式出现在行首（`^`）或行尾（`$`）时，匹配才会发生。\n\
  \n```bash\n[me@linuxbox ~]$ grep -h '^zip' dirlist*.txt\n```\nzip\nzipcloak\nzipgrep\n\
  zipinfo\nzipnote\nzipsplit\n\n```bash\n[me@linuxbox ~]$ grep -h 'zip$' dirlist*.txt\n\
  ```\ngunzip\ngzip\nfunzip\ngpg-zip\npreunzip\nprezip\nunzip\nzip\n\n```bash\n[me@linuxbox\
  \ ~]$ grep -h '^zip$' dirlist*.txt\n```\nzip\n在这里，我们在文件列表中搜索了位于行首、行尾以及既在行首又在行尾（即在行中独占一行）的字符串\
  \ `zip`。请注意，正则表达式 `^$`（一个开头和一个结尾，中间什么什么都没有）将匹配空行。\n\n**填字谜游戏的小助手**\n\n即使我们现在对正则表达式的知识还有限，我们也可以做一些有用的事情。\n\
  \n我的妻子 Myife 喜欢玩字谜游戏，她有时会向我寻求某个特定问题的帮助。比如：“五个字母的单词，第三个字母是 `j`，最后一个字母是 `r` 的？”\n\n\
  ### 括号表达式与字符类\n\n除了匹配给定位置的任意字符外，我们还可以通过使用**括号表达式**匹配指定集合中的单个字符。通过括号表达式，我们可以指定一组字符（包括会被解释为元字符的字符）来进行匹配。在这个示例中，使用双字符集，我们匹配包含\
  \ `bzip` 或 `gzip` 字符串的任何行：\n\n```bash\n[me@linuxbox ~]$ grep -h '[bg]zip' dirlist*.txt\n\
  ```\nbzip2\nbzip2recover\ngzip\n\n集合可以包含任意数量的字符，元字符在放在括号内会失去它们的特殊含义。然而，在两种情况下元字符在括号表达式中使用具有不同的含义。第一个是脱字符\
  \ `^`，用于表示否定；第二个是连字符 `-`，用于表示字符范围。\n\n#### 否定\n\n如果括号表达式中的第一个字符是脱字符 `^`，则剩余字符被视为一组在给定位置不能出现的字符。我们通过如下修改之前的示例来实现这一点：\n\
  \n```bash\n[me@linuxbox ~]$ grep -h '[^bg]zip' dirlist*.txt\n```\nbunzip2\ngunzip\n\
  funzip\ngpg-zip\npreunzip\nprezip\nprezip-bin\nunzip\nunzipsfx\n\n```\n\n激活否定后，我们得到了包含字符串\
  \ `zip` 且前面不是 `b` 或 `g` 的列表。注意 `zip` 文件没有被找到。否定字符集仍然要求给定位置有一个字符，但该字符不能是否定集合的成员。\n\
  \n脱字符只有当它是括号表达式中的第一个字符时才会触发否定；否则，它会失去特殊含义，并成为集合中的普通字符。\n\n#### 传统字符范围\n\n如果我们想构造一个正则表达式来找到我们列表中所有以大写字母开头的文件，我们可以这样做：\n\
  \n```bash\n[me@linuxbox ~]$ grep -h '^[ABCDEFGHIJKLMNOPQRSTUVWXZY]' dirlist*.txt\n\
  ```\n这只是将所有 26 个大写字母放入括号表达式中的问题。但输入所有这些字母的想法让我们深感困扰，所以这里有另一种方法：\n\n```bash\n[me@linuxbox\
  \ ~]$ grep -h '^[A-Z]' dirlist*.txt\n```\nMAKEDEV\nControlPanel\nGET\nHEAD\nPOST\n\
  X\nX11\nXorg\nMAKEFLOPPIES\nNetworkManager\nNetworkManagerDispatcher\n\n\n\n\n通过使用三个字符的范围，我们可以缩写\
  \ 26 个字母。任何字符范围都可以用这种方式表示，包括多个范围，例如这个表达式匹配所有以字母和数字开头的文件：\n\n```\n[me@linuxbox ~]$\
  \ grep -h '^[A-Za-z0-9]' dirlist*.txt\n```\n\n在字符范围中，我们看到连字符 `-` 会被特殊处理，那么我们究竟如何在括号表达式中包含一个连字符呢？方法是将其放在表达式的第一个字符。考虑这两个例子：\n\
  \n```\n[me@linuxbox ~]$ grep -h '[A-Z]' dirlist*.txt\n```\n\n这将匹配每个包含大写字母的文件名。接下来的将匹配每个包含连字符或大写字母\
  \ `A` 或大写字母 `Z` 的文件名：\n\n```\n[me@linuxbox ~]$ grep -h '[-AZ]' dirlist*.txt\n```\n\
  \n### POSIX 字符类\n\n传统的字符范围是处理快速指定字符集的一种易于理解且有效的方法。遗憾的是，它们并不总是有效。虽然我们目前在使用 `grep`\
  \ 时没有遇到任何问题，但在使用其他程序时可能会遇到问题。\n\n在第 4 章中，我们查看了如何使用通配符执行路径扩展。在那个讨论中，我们说字符范围的使用方式与正则表达式中的用法几乎完全相同，但问题出在在这里：\n\
  \n```\n[me@linuxbox ~]$ ls /usr/sbin/[ABCDEFGHIJKLMNOPQRSTUVWXYZ]*\n```\n\n`/usr/sbin/ModemManager`\n\
  \n`/usr/sbin/NetworkManager`\n\n(取决于 Linux 发行版的不同，我们将得到不同的文件列表，可能是一个空列表。此示例来自 Ubuntu。)\
  \ 这条命令产生了预期的结果——仅包含文件名以大写字母开头的文件列表，但使用以下命令，我们得到了一个完全不同的结果（仅显示了结果的部分列表）：\n\n```\n\
  [me@linuxbox ~]$ ls /usr/sbin/[A-Z]*\n```\n\n`/usr/sbin/biosdecode`\n\n`/usr/sbin/chat`\n\
  \n`/usr/sbin/chgpasswd`\n\n`/usr/sbin/chpasswd`\n\n`/usr/sbin/chroot`\n\n`/usr/sbin/cleanup-info`\n\
  \n`/usr/sbin/complain`\n\n`/usr/sbin/console-kit-daemon`\n\n为什么会这样？这是一个长故事，但这里是短版本：\n\
  \n当 Unix 最初开发时，它只认识 ASCII 字符，这一特性反映了这一事实。在 ASCII 中，前 32 个字符（数字 0–31）是控制代码（如制表符、退格键和回车等）。下一个\
  \ 32 个（32–63）包含打印字符，包括大多数标点符号和数字 `0–9`。下一个 32 个（数字 64–95）包含大写字母和更多的标点符号。最后的 31 个（数字\
  \ 96–127）包含小写字母更多的标点符号。根据这种安排，使用 ASCII 的系统使用的*排序顺序*如下：\n\n`ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz`\n\
  \n这与正确的字典顺序不同，字典顺序应该是这样的：\n\n`aAbBcCdDeEfFgGhHiIjJkKlLmMnNoOpPqQrRsStTuUvvwWxXyYzZ`\n\
  \n随着 Unix 的流行范围扩展到美国以外，对支持美国英语中未发现字符的需求日益增长。ASCII 表格被扩展为使用完整的 8 位，增加了字符 128–255，从而适应了更多语言。为了支持这种能力，POSIX\
  \ 标准引入了一个称为*区域设置 (locale)*的概念，可以对其进行调整以选择特定区域所需的字符集。我们可以通过以下命令查看系统的语言设置。\n\n```\n\
  [me@linuxbox ~]$ echo $LANG\n```\n\n`en_US.UTF-8`\n\n有了此设置，符合 POSIX 标准应用程序将将字典排序顺序而不是\
  \ ASCII 顺序。这解释了之前命令的行为。在字典顺序解释时，`[A-Z]` 字符范围包含了除小写 `a` 以外的所有字母，因此我们得到了那些结果。\n\n\
  为了部分解决这个问题，POSIX 标准包含许多字符类，它们提供了有用的字符范围，如表 19-2 所示。\n\n**表 19-2：** POSIX 字符类\n\n\
  | 字符类 | 描述 |\n| --- | --- |\n| `[:alnum:]` | 数字字母字符。在 ASCII 中，等同于：`[A-Za-z0-9]`\
  \ |\n| `[:word:]` | 与`[:alnum:]`相同，增加了下划线 (`_`) 字符。 |\n| `[:alpha:]` | 字母字符。在 ASCII\
  \ 中，等同于：`[A-Za-z]` |\n| `[:blank:]` | 包含空格和制表符。 |\n| `[:cntrl:]` | ASCII 控制代码。包括\
  \ ASCII 字符 0 到 31 和 127。 |\n| `[:digit:]` | 数字 0 到 9。 |\n| `[:graph:]` | 可见字符。在\
  \ ASCII 中，它包含字符 33 到 126。 |\n| `[:lower:]` | 小写字母。 |\n| `[:punct:]` | 标点符号。在 ASCII\
  \ 中，等同于：`[-!\"#$%&’()*+,./:;<=>?@[\\\\\\]_`{&#124;}~]` |\n| `[:print:]` | 打印字符。`[:graph:]`\
  \ 空格字符。 |\n| `[:space:]` | 空白字符，包括空格、制表符、回车、换行符、垂直制表符和分页符。 |\n| `[:upper:]` | 大写字母。\
  \ |\n| `[:xdigit:]` | 十进制数字。在 ASCII 中，等同于：`[0-9A-F]` |\n\n即使有了字符类，仍然没有方便的方法表示部分范围，例如\
  \ `A–M`。\n\n### 回到传统的排序顺序\n\n你可以通过更改 LANG 变量来让系统使用传统的（ASCII）排序顺序。正如我们之前看到的，这个值是在选择安装语言时决定的。要让区域设置使用传统的\
  \ Unix 行为，将将其设置为 `POSIX`。正如我们之前看到的，LANG 变量包含了区域设置使用的语言和字符集。\n\n要查看区域设置，使用 `locale`\
  \ 命令。\n\n```bash\n`LC_CTYPE=\"en_US.UTF-8\"`\n\n`LC_NUMERIC=\"en_US.UTF-8\"`\n\n\
  `LC_TIME=\"en_US.UTF-8\"`\n\n`LC_COLLATE=\"en_US.UTF-8\"`\n\n`LC_MONETARY=\"en_US.UTF-8\"\
  `\n\n`LC_MESSAGES=\"en_US.UTF-8\"`\n\n`LC_PAPER=\"en_US_UTF-8\"`\n\n`LC_NAME=\"\
  en_US.UTF-8\"`\n\n`LC_ADDRESS=\"en_US.UTF-8\"`\n\n`LC_TELEPHONE=\"en_US.UTF-8\"\
  `\n\n`LC_MEASUREMENT=\"en_US.UTF-8\"`\n\n`LC_IDENTIFICATION=\"en_US.UTF-8\"`\n\n\
  `LC_ALL=`\n\n要将区域设置设置为传统的，将 LANG 设置为 `POSIX`。\n\n```bash\n[me@linuxbox ~]$ export\
  \ LANG=POSIX\n```\n\n通过将此行添加到您的 *.bashrc* 文件可以使此更改永久生效\n\n```export LANG=POSIX\n\
  ```\n\n### POSIX 基础正则表达式与扩展正则表达式\n\n正当我们认为这不会变得更加复杂时，我们发现 POSIX 也将正则表达式的实现分为两种：*基础正则表达式*\
  \ (BRE) 和*扩展正则表达式* (ERE)。我们到为止涵盖的功能由任何符合 POSIX 标准并实现 BRE 的应用程序支持。我们的 `grep` 程序就是其中一个程序。\n\
  \nBRE 和 ERE 之间的区别是什么？这是一个元字符的问题。在 BRE 中，识别的元字符有：\n\n^ $ . [ ] *\n\n所有其他字符都被视为字面符。在\
  \ ERE 中，添加了以下元字符（及其关联功能）：\n\n( ) { } ? + |\n\n但是（这是有趣的地方），在 BRE 中，当 (, ), {, } 字符被反斜杠转义时会被视为元字符，而在\
  \ ERE 中，在任何元字符前面加上反斜杠会导致它被视为字面符。\n\n\n\n\n由于我们接下来要讨论的功能是 ERE（扩展正则表达式）的一部分，因此我们需要使用不同的\
  \ `grep`。传统上，这是通过 `egrep` 程序实现的，但 GNU 版本的 `grep` 在使用 `-E` 选项时也支持扩展正则表达式。\n\n## POSIX\n\
  \n在 20 世纪 80 年代，Unix 成为一个非常非常受欢迎的商业操作系统，但到 1988 年，Unix 世界陷入了混乱。许多计算机制造商从其创建者 AT&T\
  \ 处获得了 Unix 源代码的许可，并在系统中提供了各种版本的操作系统。然而，为了实现产品差异化，每家制造商都添加了专有的更改和扩展。这开始限制软件的兼容性。正如所有专有供应商一样，每家公司都试图与客户玩一场赢家的“锁定”游戏。Unix\
  \ 历史上的这段黑暗时期现在被称为“巴尔干化”（Balkanization）。\n\n随后引入的是电气电子工程师学会（IEEE）。20 世纪 80 年代中期，IEEE\
  \ 开始制定一套标准，以定义 Unix（以及类 Unix）系统的运行方式。这些标准正式称为 IEEE 1003，定义了标准类 Unix 系统中应包含的应用程序接口（API）、shell\
  \ 和实用程序。`POSIX` 这个名字代表 `Portable Operating System Interface`（可移植操作系统接口，末尾加上 `X`\
  \ 是为了读起来更响亮），由理查德·斯托曼（是的，就是*那个*理查德·斯托曼）建议并被 IEEE 采纳。\n\n## 分支（Alternation）\n\n我们将讨论的扩展正则表达式第一个特性被称为“分支”（alternation），它是允许从一组表达式中进行匹配的功能。正如括号表达式允许单个字符匹配指定字符集中的任意字符一样，分支允许从一组字符串或其他正则表达式中进行匹配。\n\
  \n为了演示这一点，我们将结合 `echo` 使用 `grep`。首先，让我们尝试一个最基本的字符串匹配。\n\n```bash\n[me@linuxbox ~]$\
  \ echo \"AAA\" | grep AAA\nAAA\n[me@linuxbox ~]$ echo \"BBB\" | grep AAA\n[me@linuxbox\
  \ ~]\n```\n\n这是一个非常直观的例子，我们将 `echo` 的输出管道给 `grep` 并查看结果。当发生匹配时，我们会看到打印出来的结果；当没有匹配时，我们看不到任何结果。\n\
  \n现在我们将添加分支，由竖线元字符 `|` 表示。\n\n```bash\n[me@linuxbox ~]$ echo \"AAA\" | grep -E 'AAA|BBB'\n\
  AAA\n[me@linuxbox ~]$ echo \"BBB\" | grep -E 'AAA|BBB'\nBBB\n[me@linuxbox ~]$ echo\
  \ \"CCC\" | grep -E 'AAA|BBB'\n[me@linuxbox ~]\n```\n\n在这里我们看到了正则表达式 `'AAA|BBB`，它的意思是“匹配字符串\
  \ AAA 或字符串 BBB”。注意，由于这是一个扩展功能，我们为 `grep` 添加了 `-E` 选项（尽管我们也可以直接使用 `egrep` 程序），并且用引号括起正则表达式，以防止\
  \ shell 将竖线元字符解释为管道操作符。分支并不局限于两个选择。\n\n```bash\n[me@linuxbox ~]$ echo \"AAA\" |\
  \ grep -E 'AAA|BBB|CCC'\nAAA\n```\n\n要将分支与其他正则表达式元素结合起来，我们可以使用 `()` 分隔分支。\n\n```bash\n\
  [me@linuxbox ~]$ grep -Eh '^(bz|gz|zip)' dirlist*.txt\n```\n\n该表达式将匹配我们列表中以 `bz`、`gz`\
  \ 或 `zip` 开头的文件。如果我们漏掉括号，这个正则表达式的含义将变为匹配任何以 `bz` 开头或包含 `gz` 或包含 `zip` 的文件名：\n\n\
  ```bash\n[me@linuxbox ~]$ grep -Eh '^bz|gz|zip' dirlist*.txt\n```\n\n## 量词（Quantifiers）\n\
  \n扩展正则表达式支持多种方式来指定元素匹配的次数，详见后续章节。\n\n### ?—匹配元素零次或一次\n\n这个量词实际上意味着“使前面的上一个元素变为可选”。假设我们要检查电话号码的有效性，并且我们认为如果电话号码符合以下两种形式之一，我们就认为它是有效的（其中\
  \ `n` 是数字）：\n\n* `(nnn) nnn-nnnn`\n* `nnn nnn-nnnn`\n\n我们可以构建这样一个正则表达式：\n\n`^\\\
  (?[0-9][0-9][0-9]\\)? [0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]$`\n\n在这个表达式中，我们在括号字符后面紧跟问号，表示它们将要匹配\
  \ 0 次或 1 次。同样，因为括号在 ERE 中通常是元字符，我们在它们前面加上了反斜杠，导致它们被视为字面量。\n\n让我们尝试。\n\n```bash\n\
  [me@linuxbox ~]$ echo \"(555) 123-4567\" | grep -E '^\\(?[0-9][0-9][0-9]\\)? [0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]$'\n\
  (555) 123-4567\n[me@linuxbox ~]$ echo \"555 123-4567\" | grep -E '^\\(?[0-9][0-9][0-9]\\\
  )? [0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]$'\n```\n\n### *—匹配元素零次或多次\n\n与 `?` 一样，`*`\
  \ 用于表示它可以出现任意次数。但是，与 `?` 不同，它允许 0 次出现。\n\n### +—匹配元素一次或多次\n\n`+` 元字符的工作原理与 `*` 非常相似，但它要求前一个元素至少出现一次才能导致匹配。\n\
  \n\n\n\n\n| `{,m}` | 如果前一个元素出现不超过 `m` 次，则匹配它。 |\n\n回到我们之前的电话号码的示例，我们可以使用这种指定重复次数的方法，将原始的正则表达式从如下：\n\
  \n`^\\(?[0-9][0-9][0-9]\\)?  [0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]$`\n\n简化为如下：\n\n\
  `^\\(?[0-9]{3}\\)?  [0-9]{3}-[0-9]{4}$`\n\n让我们试一下。\n\n```bash\n[me@linuxbox ~]$\
  \ echo \"(555) 123-4567\" | grep -E '^\\([0-9]{3}\\)? [0-9]{3}-[0-9]{4}$'\n(555)\
  \ 123-4567\n[me@linuxbox ~]$ echo \"555 123-4567\" | grep -E '^\\([0-9]{3}\\)? [0-9]{3}-[0-9]{4}$'\n\
  [me@linuxbox ~]$ echo \"5555 123-4567\" | grep -E '^\\([0-9]{3}\\)? [0-9]{3}-[0-9]{4}$'\n\
  555 123-4567\n```\n\n如所见，修改后的表达式可以成功验证带括号和不带括号的数字，同时拒绝格式不正确的数字。\n\n### 将正则表达式投入使用\n\
  \n让我们来看一些熟悉的命令，并看看它们如何与正则表达式配合。\n\n#### 使用 grep 验证电话列表\n\n在之前的示例中，我们查看了单个电话号码并检查其格式是否正确。更现实的场景是检查一个数字列表，所以让我们创建一个列表吧。我们将通过向命令行背诵“魔法咒语”来实现。这看起来很像魔法，因为我们还没有涵盖大多数命令，但不用担心，我们将在未来的章节中学习。这里是咒语：\n\
  \n```bash\n[me@linuxbox ~]$ for i in {1..10}; do echo \"(${RANDOM:0:3})-${RANDOM:0:4}\"\
  \ >> phonelist.txt; done\n```\n\n该命令将生成一个名为 `phonelist.txt` 的文件，包含 10 个电话号码。每重复一次命令，就会添加另一个数字。我们也可以更改命令开头的值\
  \ `10` 来生成更多或更少的电话号码。然而，如果我们检查文件内容，会发现我们遇到了问题。\n\n```bash\n[me@linuxbox ~]$ cat\
  \ phonelist.txt\n(232) 298-2265\n(624) 381-1078\n(540) 126-1980\n(874) 163-2885\n\
  (286) 254-2860\n(292) 108-518\n(129) 44-1379\n(458) 273-1642\n(686) 299-8268\n(198)\
  \ 307-2440\n```\n\n其中一些数字格式错误，这恰恰符合我们的需求，因为我们将使用 `grep` 来验证它们。一种实用的验证方法是扫描文件中的无效数字并显示结果列表。\n\
  \n```bash\n[me@linuxbox ~]$ grep -Ev '^\\([0-9]{3}\\) [0-9]{3}-[0-9]{4}$' phonelist.txt\n\
  (292) 108-518\n(129) 44-1379\n```\n\n在这里我们使用 `-v` 选项产生反向匹配，以便只输出列表中不匹配指定表达式的行。表达式本身在两端包含了锚点元字符，以确保数字两端没有额外字符。与我们之前的电话号码示例不同，该表达式还要求数字中必须包含括号。\n\
  \n#### 使用 find 查找异常文件名\n\n`find` 命令支持基于正则表达式的测试。在 `find` 中使用正则表达式与在 `grep` 中相比有一个重要的点需要注意：`grep`\
  \ 会在行*包含*匹配表达式的字符串时打印该行，而 `find` 要求路径必须*完全匹配*正则表达式。在接下来的示例中，我们将使用 `find` 正则表达式来查找包含以下集合中任何字符的路径：\n\
  \n`[-_./0-9a-zA-Z]`\n\n这样的扫描将揭示包含空格或其他潜在非法字符的路径。\n\n```bash\n[me@linuxbox ~]$ find\
  \ . -regex '.*[^-_./0-9a-zA-Z].*'\n```\n\n由于需要对整个路径进行精确匹配，我们在表达式的两端都使用了 `.*` 来匹配任意字符的任意次数。在表达式中间，我们使用了一个包含允许路径字符集的反向括号表达式。\n\
  \n#### 使用 locate 搜索文件\n\n`locate` 程序支持基础（`--regexp` 选项）和扩展（`--regex` 选项）正则表达式。通过它，我们可以执行之前对\
  \ `dirlist` 文件执行许多许多操作。\n\n```bash\n[me@linuxbox ~]$ locate --regex 'bin/(bz|gz|zip)'\n\
  /bin/bzcat\n/bin/bzcmp\n/bin/bzdiff\n/bin/bzegrep\n/bin/bzexe\n/bin/bzfgrep\n/bin/bzgrep\n\
  /bin/bzip2\n/bin/bzip2recover\n/bin/bzless\n/bin/bzmore\n/bin/gzexe\n/bin/gzip\n\
  /usr/bin/zip\n/usr/bin/zipcloak\n/usr/bin/zipgrep\n/usr/bin/zipinfo\n/usr/bin/zipnote\n\
  /usr/bin/zipsplit\n```\n\n使用分选择法，我们搜索包含 `bin/bz`、`bin/gz` 或 `*/bin/` 的路径。\n\n\n\n\
  \n\n`tr` 翻译或删除字符\n\n`sed` 用于过滤和转换文本的流编辑器\n\n`aspell` 交互式拼写检查器\n\n### 文本的应用\n\n到为止，我们已经学习了一些文本编辑器（`nano`\
  \ 和 `vim`），查看了一些配置文件，并见证了数十个命令的输出，而这一切都是文本形式。但文本还能用于什么？事实证明，它可以用于许多地方。\n\n#### 文档\n\
  \n许多人使用纯文本格式编写文档。虽然很容易看出小型文本文件对于记录简单笔记很有用，但用文本格式编写大型文档也是可能的。一种流行的方法是用文本格式编写一个大文档，然后嵌入一种\
  \ `markup language`（标记语言）来描述完成文档的格式。许多科学论文都是使用这种方法编写的，因为 Unix 文本处理系统是首批支持技术领域作者所需的高级排版布局的系统之一。\n\
  \n#### 网页\n\n世界上最流行的电子文档类型可能是网页。网页是文本文档，使用 `Hypertext Markup Language`（`HTML`）或\
  \ `Extensible Markup Language`（`XML`）作为标记语言来描述文档的视觉格式。\n\n#### 电子邮件\n\n电子邮件本质上是一种基于文本的媒介。即使是非文本附件也会转换为文本表示形式进行传输。我们可以通过下载电子邮件并在较简单的编辑器中查看来亲身验这一点。我们将看到消息以\
  \ `header`（头部）开始，它描述了消息的来源以及在传输过程中接收的处理，随后是消息的 `body`（正文）及其内容。\n\n#### 打印机输出\n\n\
  在 Unix 类系统上，发往打印机的输出以纯文本形式发送；如果页面包含图形，则会被转换为名为 `PostScript` 的文本格式 `page description\
  \ language`（页面描述语言），然后发送到生成打印墨点的程序。\n\n#### 程序源代码\n\n在 Unix 类系统中发现的许多命令行程序是为了支持系统管理和软件开发而创建的，文本处理程序也不例外。许多程序的设计是为了解决软件开发问题。文本处理对软件开发者之所以重要，是因为所有软件都始于文本。`Source\
  \ code`（源代码，程序员实际编写的部分）始终是文本格式。\n\n### 重温一些老朋友\n\n在第 6 章中，我们学习了一些除了命令行参数外还能接受标准输入的命令。那时我们只是简短地提到了它们，但现在我们将仔细观察如何使用它们来执行文本处理。\n\
  \n### cat\n\n`cat` 程序有很多有趣的选项。其中许多选项用于帮助更好地视觉化文本内容。一个例子是 `-A` 选项，它用于显示文本中的非打印字符。有时，我们想知道在原本可见的文本中是否嵌入了控制字符。其中最常见的是制表符（区别于空格）和回车符，它们通常在\
  \ MS-DOS 风格的文本文件中作为换行符出现。另一种常见情况是文件包含带有行尾空格的文本行。\n\n让我们使用 `cat` 作为一个原始的文字处理器创建一个测试文件。要做到这一点，我们只需输入\
  \ `cat` 命令（并指定一个重定向输出的文件）并输入我们的文本，然后按回 键以正确结束行，最后按 CTRL-D 告诉 `cat` 我们已到达文件末尾。在这个例中，我们输入了一个前导制表符，并在行尾跟上了一些行尾空格：\n\
  \n```\nme@linuxbox ~]$ cat > foo.txt\n\n    The quick brown fox jumped over the\
  \ lazy dog.\n\nme@linuxbox ~]$\n```\n\n接下来，我们使用带有 `-A` 选项的 `cat` 来显示文本。\n\n```\n\
  me@linuxbox ~]$ cat -A foo.txt\n\n^IThe quick brown fox jumped over the lazy dog.\
  \  $\n\nme@linuxbox ~]$\n```\n\n正如我们在结果中看到的，我们文本中的制表符用 `^I` 表示。这是一个常见的表示法，意味着 `CTRL-I`，事实证明它等同于制表符。我们还看到\
  \ `$` 出现在真正的行尾，表示我们的文本包含行尾空格。\n\n**MS-DOS 文本对比 UNIX 文本**\n\n你可能想使用 `cat` 寻找文本中的非打印字符的原因之一是发现隐藏的回车符。这些隐藏的回车符从哪里来？DOS\
  \ 和 Windows！Unix 和 DOS 在文本文件中定义行结束的方式并不相同。Unix 使用换行符（ASCII 10）结束一行，而 MS-DOS 及其衍生版本则使用回车符（ASCII\
  \ 13）和换行符的序列来终止每行文本。\n\n有几种方法可以将文件从 DOS 格式转换为 Unix 格式。在许多 Linux 系统上，有程序名为 `dos2unix`\
  \ 和 `unix2dos` 的程序，它们可以将文本文件在 DOS 格式之间进行转换。然而，如果你的系统上没有 `dos2unix`，不要担心。将文本从 DOS\
  \ 格式转换为 Unix 格式的过程非常简单；它涉及移除故障的回车符。这可以通过本章稍后讨论的几个程序轻松完成。\n\n`cat` 还有用于修改文本的选项。最突出的两个是\
  \ `-n`（行编号）和 `-s`（抑制多个空行的输出）。我们可以像这样演示：\n\n```\nme@linuxbox ~]$ cat > foo.txt\n\n\
  The quick brown fox\n\njumped over the lazy dog.\n\nme@linuxbox ~]$ cat -ns foo.txt\n\
  \n      1 The quick brown fox\n      2 jumped over the lazy dog.\n\nme@linuxbox\
  \ ~]$\n```\n\n在这个示例中，我们创建了 `foo.txt` 测试文件的新版本，它包含了两行被空行隔的文本。在通过 `cat` 的 `-ns` 选项进行处理后，多余的行被删除了，剩余的行被编号了。虽然在文本上执行这个操作不算什么过程，但确实是一个过程。\n\
  \n### sort\n\n`sort` 程序对标准输入或命令行上指定的一个或多个文件的内容进行排序，并将结果发送到标准输出。使用我们处理 `cat` 时相同的技巧，我们可以如下演示直接从键盘处理标准输入：\n\
  \n```\nme@linuxbox ~]$ sort > foo.txt\n\nc\n\nb\n\na\n\nme@linuxbox ~]$ cat foo.txt\n\
  \na\n\nb\n\nc\n```\n\n在输入命令后，我们输入字母 `c`、`b` 和 `a`，然后按 CTRL-D 表示文件结束。然后我们查看生成的文件，发现这些行现在按排序顺序出现。\n\
  \n由于 `sort` 可以接受命令行上的多个文件作为参数，因此可以将多个文件 `merge`（合并）为一个单一的整体。例如，如果我们有三个文本文件并想将它们合并为一个单独的排序文件，我们可以这样做：\n\
  \n```\nsort file1.txt file2.txt file3.txt > final_sorted_list.txt\n```\n\n`sort`\
  \ 有几个有趣的选项。表 20-1 提供了部分列表。\n\n**表 20-1:** 常用 sort 选项\n\n| **选项** | **长选项** | **描述**\
  \ |\n| --- | --- | --- |\n| -b | --ignore-leading-blanks | 默认情况下，排序针对整行，从行的第一个字符开始。此选项导致\
  \ sort 忽略行首空格，并根据行的第一个非空白字符计算排序。 |\n| -f | --ignore-case | 使排序忽略大小写。 |\n| -n | --numeric-sort\
  \ | 根据字符串的数值评估进行排序。使用此选项允许根据数值值进行排序而不是字母值。 |\n| -r | --reverse | 逆序排序。结果为降序而非升序。\
  \ |\n| -k | --key=field1[,field2] | 根据从字段 1 到字段 2 的键字段进行排序，而不是整行。请见下文讨论。 |\n\n\n\
  \n\n\n| 选项 | 参数 | 描述 |\n|---|---|---|\n| `-m` | `--merge` | 将每个参数视为预排序文件的文件名。将多个文件合并为单个排序后的结果，而不进行任何额外的排序。\
  \ |\n| `-o` | `--output=file` | 将排序后的输出发送到文件而不是标准输出。 |\n| `-t` | `--field-separator=char`\
  \ | 定义字段分隔。默认情况下，字段由空格或制表符分隔。 |\n\n尽管这些选项大部分都一而易见，但有些并非如此。首先，让我们来看 `-n` 选项，它用于数值排序。使用此选项，可以根据数值而不是字母顺序来对值进行排序。我们可以通过对\
  \ `du` 命令的结果进行排序以确定磁盘空间最大的用户来演示这一点。通常，`du` 命令按路径顺序列出摘要结果。\n\n```bash\n[me@linuxbox\
  \ ~]$ du -s /usr/share/* | head\n\n252         /usr/share/aclocal\n96          /usr/share/acpi-support\n\
  8           /usr/share/adduser\n196         /usr/share/alacarte\n344         /usr/share/alsa\n\
  8           /usr/share/alsa-base\n12488        /usr/share/anthy\n8           /usr/share/apmdq\n\
  21440        /usr/share/app-install\n48          /usr/share/application-registry\n\
  ```\n\n在这个示例中，我们将结果通过管道传给 `head` 将结果限制在前 10 行。我们可以通过这种方式生成一个数值排序的列表，显示前 10 个最大的空间消耗者。\n\
  \n```bash\n[me@linuxbox ~]$ du -s /usr/share/* | sort -nr | head\n\n509940     \
  \ /usr/share/locale-langpack\n242660      /usr/share/doc\n197560      /usr/share/fonts\n\
  179144      /usr/share/gnome\n146764      /usr/share/myspell\n144304      /usr/share/gimp\n\
  135880      /usr/share/dict\n76508       /usr/share/icons\n68072       /usr/share/apps\n\
  62844       /usr/share/foomatic\n```\n\n通过使用 `n` 和 `r` 选项，我们产生了一个反向数值排序，最大的值首先出现在结果中。这种排序之所以有效，是因为数值出现在每行的开头。但如果我们想根据行内找到的某个值对列表进行排序呢？例如，这里是\
  \ `ls -l` 的结果：\n\n```bash\n[me@linuxbox ~]$ ls -l /usr/bin | head\n\ntotal 152948\n\
  -rwxr-xr-x 1 root    root      34824 2016-04-04 02:42 [\n-rwxr-xr-x 1 root    root\
  \      101556 2007-11-27 06:08 a2p\n-rwxr-xr-x 1 root    root      13036 2016-02-27\
  \ 08:22 aconnect\n-rwxr-xr-x 1 root    root      10552 2007-08-15 10:34 acpi\n-rwxr-xr-x\
  \ 1 root    root      3800 2016-04-14 03:51 acpi_fakekey\n-rwxr-xr-x 1 root    root\
  \      7536 2016-04-19 00:19 acpi_listen\n-rwxr-xr-x 1 root    root      3576 2016-04-29\
  \ 07:57 addpart\n-rwxr-xr-x 1 root    root      20808 2016-01-03 18:02 addr2line\n\
  -rwxr-xr-x 1 root    root      489704 2016-10-09 17:02 adept_batch\n```\n\n暂时不考虑\
  \ `ls` 可以按大小对其结果进行排序，我们可以使用 `sort` 按文件大小对此列表进行排序。\n\n```bash\n[me@linuxbox ~]$ ls\
  \ -l /usr/bin | sort -nr 5 | head\n-rwxr-xr-x 1 root    root      823416 2016-04-07\
  \ 17:42 inkscape\n-rwxr-xr-x 1 root    root      822692 2016-04-07 17:42 inkview\n\
  -rwxr-xr-x 1 root    root      374608 2016-03-07 23:45 gimp-2.4\n-rwxr-xr-x 1 root\
  \    root      3654020 2016-08-26 16:16 quanta\n-rwxr-xr-x 1 root    root      2928760\
  \ 2016-09-10 14:31 gdbtui\n-rwxr-xr-x 1 root    root      2928756 2016-09-10 14:31\
  \ gdb\n-rwxr-xr-x 1 root    root      2602236 2016-10-10 12:56 net\n-rwxr-xr-x 1\
  \ root    root      2304684 2016-10-10 12:56 rpcclient\n-rwxr-xr-x 1 root    root\
  \      2241832 2016-04-04 05:56 aptitude\n-rwxr-xr-x 1 root    root      2202476\
  \ 2016-10-10 12:56 smbcls\n```\n\n`sort` 的许多用法涉及表格化数据的处理，例如前面 `ls` 命令的结果。如果我们对上一个表格应用数据库术语，我们会说每一行都是一条记录。通过使用\
  \ `n` 和 `r` 选项，我们产生了一个反向数值排序，最大的值首先出现在结果中。这种排序之所以有效，是因为数值出现在每行的开头。但如果我们想根据行内找到的某个值对列表进行排序呢？例如，这里是\
  \ `ls -l` 的结果：\n\n```bash\n[me@linuxbox ~]$ ls -l /usr/bin | head\n\ntotal 152948\n\
  -rwxr-xr-x 1 root    root      34824 2016-04-04 02:42 [\n-rwxr-xr-x 1 root    root\
  \      101556 2007-11-27 06:08 a2p\n-rwxr-xr-x 1 root    root      13036 2016-02-27\
  \ 08:22 aconnect\n-rwxr-xr-x 1 root    root      10552 2007-08-15 10:34 acpi\n-rwxr-xr-x\
  \ 1 root    root      3800 2016-04-14 03:51 acpi_fakekey\n-rwxr-xr-x 1 root    root\
  \      7536 2016-04-19 00:19 acpi_listen\n-rwxr-xr-x 1 root    root      3576 2016-04-29\
  \ 07:57 addpart\n-rwxr-xr-x 1 root    root      20808 2016-01-03 18:02 addr2line\n\
  -rwxr-xr-x 1 root    root      489704 2016-10-09 17:02 adept_batch\n```\n\n暂时不考虑\
  \ `ls` 可以按大小对其结果进行排序，我们可以使用 `sort` 按文件大小对此列表进行排序。\n\n```bash\n[me@linuxbox ~]$ ls\
  \ -l /usr/bin | sort -nr 5 | head\n-rwxr-xr-x 1 root    root      823416 2016-04-07\
  \ 17:42 inkscape\n-rwxr-xr-x 1 root    root      822692 2016-04-07 17:42 inkview\n\
  -rwxr-xr-x 1 root    root      374608 2016-03-07 23:45 gimp-2.4\n-rwxr-xr-x 1 root\
  \    root      3654020 2016-08-26 16:16 quanta\n-rwxr-xr-x 1 root    root      2928760\
  \ 2016-09-10 14:31 gdbtui\n-rwxr-xr-x 1 root    root      2928756 2016-09-10 14:31\
  \ gdb\n-rwxr-xr-x 1 root    root      2602236 2016-10-10 12:56 net\n-rwxr-xr-x 1\
  \ root    root      2304684 2016-10-10 12:56 rpcclient\n-rwxr-xr-x 1 root    root\
  \      2241832 2016-04-04 05:56 aptitude\n-rwxr-xr-x 1 root    root      2202476\
  \ 2016-10-10 12:56 smbcls\n```\n\n`sort` 的许多用法涉及表格化数据的处理，例如前面 `ls` 命令的结果。如果我们对上一个表格应用数据库术语，我们会说每一行都是一条记录。通过使用\
  \ `n` 和 `r` 选项，我们产生了一个反向数值排序，最大的值首先出现在结果中。这种排序之所以有效，是因为数值出现在每行的开头。但如果我们想根据行内找到的某个值对列表进行排序呢？例如，这里是\
  \ `ls -l` 的结果：\n\n（注：此处原文中存在重复内容，已按指令要求去重，仅翻译核心逻辑部分）\n\n\n\n\n虽然为了清晰起见使用了选项的完整形式，但\
  \ `-k 1,1 -k 2n` 的效果完全相同。在第一个 `key` 选项中，我们指定了一个包含在第一个键中的字段范围。由于我们只想限制排序于第一个字段，因此我们指定了\
  \ `1,1`，这意味着“从字段 1 开始到字段 1 结束”。在第二个实例中，我们指定了 `2n`，这意味着字段 2 是排序键，且排序应该按数值进行。在键指定符的末尾可以包含一个选项字母，以指示要执行的排序类型。这些选项字母与\
  \ `sort` 程序的全局选项相同：`b`（忽略领先空格）、`n`（数值排序）、`r`（反向排序）等。\n\n我们列表中的第三个字段包含一个不利于排序的日期。在计算机上，日期通常格式化为\
  \ `YYYY-MM-DD` 顺序，以便按时间顺序排序，但我们的日期是美国格式的 `MM/DD/YYYY`。我们如何按时间顺序对此列表排序呢？\n\n幸运的是，`sort`\
  \ 提供了一种方法。`key` 选项允许指定字段内部的 `offsets`（偏移量），因此我们可以在字段内定义键。\n\n```bash\n[me@linuxbox\
  \ ~]$ sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt\nFedora      10           \
  \ 11/25/2008\nUbuntu      8.10          10/30/2008\nSUSE        11.0          06/19/2008\n\
  Fedora      9             05/13/2008\nUbuntu      8.04          04/24/2008\nFedora\
  \      8             11/08/2007\nUbuntu      7.10          10/18/2007\nSUSE    \
  \    10.3          10/04/2007\nFedora      7             05/31/2007\nUbuntu    \
  \  7.04          04/19/2007\nSUSE        10.2          12/07/2006\nUbuntu      6.10\
  \          10/26/2006\nFedora      6             10/24/2006\nUbuntu      6.06  \
  \        06/01/2006\nSUSE        10.1          05/11/2006\nFedora      5       \
  \      03/20/2006\n```\n\n通过指定 `-k 3.7`，我们指示 `sort` 使用从第三字段内第七个字符开始的排序键，这对应于年份开头。同样，我们指定了\
  \ `-k 3.1` 和 `-k 3.4` 来隔离日期的月份和日期部分。我们还添加了 `n` 和 `r` 选项来实现反向数值排序。包含 `b` 选项是为了抑制日期字段中的领先空格（这些数字随行行而异，从而影响排序结果）。\n\
  \n某些文件不使用制表符和空格作为字段分隔符；例如，这里的 `/etc/passwd` 文件：\n\n```bash\n[me@linuxbox ~]$ head\
  \ /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
  bin:x:2:2:bin:/bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\n\
  games:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\nlp:x:7:7:lp:/var/spool/lpd:/bin/sh\n\
  mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news\n```\n\n字段是用冒号（`:`）分隔的，那么我们如何使用键对此文件排序呢？`sort`\
  \ 提供了 `-t` 选项来定义字段分隔符。要对 `passwd` 文件的第七个字段（账户的 shell）进行排序，我们可以这样做：\n\n```bash\n\
  [me@linuxbox ~]$ sort -t ':' -k 7 /etc/passwd\nme:x:1001:1001:Myself:/home/me:/bin/bash\n\
  root:x:0:0:root:/root:/bin/bash\ndhcp:x:101:102:/nonexistent:/bin/false\ngdm:x:106:14:Gnome\
  \ Display Manager:/var/lib/gdm:/bin/false\nhplip:x:104:7:HPLIP user:/var/run/hplip:/bin/false\n\
  klog:x:103:104:/home/klog:/bin/false\nmessagebus:x:108:19:/var/run/dbus\npolkituser:x:110:122:PolicyKit:/var/run/PolicyKit:/bin/false\n\
  pulse:x:107:16:PulseAudio daemon:/var/run/pulse:/bin/false\n```\n\n通过指定冒号作为字段分隔符，我们可以对第七字段进行排序。\n\
  \n### uniq\n\n与 `sort` 相比，`uniq` 程序非常轻量级。`uniq` 执行一个看似简单的任务：当给它一个排序的文件（或标准输入）时，它删除重复行并将结果发送到标准输出。它通常与\
  \ `sort` 配合使用以清理输出。**提示**：虽然 `uniq` 是传统的 Unix 工具，但 GNU 版本的 `sort` 支持 `-u` 选项来移除输出中的重复项。\n\
  \n```bash\n[me@linuxbox ~]$ cat > foo.txt\na\nb\nc\n```\n记得输入 `CTRL-D` 来结束输入。现在，如果我们对我们的文本运行\
  \ `uniq`，会得到：\n\n```bash\n[me@linuxbox ~]$ uniq foo.txt\na\nb\nc\n```\n\n结果与原始文件不同；重复行被删除了。这是因为\
  \ `uniq` 只删除相邻的重复行。`uniq` 有几个选项：\n\n| 选项 | 完整选项 | 说明 |\n| :--- | :--- | :--- |\n\
  | `-c` | `--count` | 输出重复行出现的次数。 |\n| `-d` | `--repeated` | 只输出重复行，而非唯一行。 |\n| `-f\
  \ n` | `--skip-fields=n` | 忽略每行的前 `n` 个字段。 |\n| `-i` | `--ignore-case` | 比较时忽略大小写。\
  \ |\n| `-s n` | `--skip-chars=n` | 忽略每行的前 `n` 个字符。 |\n| `-u` | `--unique` | 只输出唯一行。\
  \ |\n\n在这里我们使用 `-c` 选项来报告文件中发现的重复次数：\n\n```bash\n[me@linuxbox ~]$ sort foo.txt |\
  \ uniq -c\n      2 a\n      2 b\n      2 c\n```\n\n### 切片与提取\n\n接下来的三个程序将讨论从文件中提取列并以有用的方式重新组合。\n\
  \n### cut——从文件中提取部分\n\n`cut` 程序用于从行中提取部分并输出到标准输出。它可以接受多个文件参数或标准输入。指定要提取的行部分有些麻烦，可以使用下表列出的选项：\n\
  \n| 选项 | 完整选项 |  |\n| :--- | :--- | :--- |\n| `-c list` | `--characters=list` |\
  \ 提取 `list` 定义的行部分。`list` 可以由一个或多个逗号分隔的数值范围组成。 |\n| `-f list` | `--fields=list`\
  \ | 提取由 `list` 定义的一个或多个字段。`list` 可以包含一个或多个字段或逗号分隔的字段范围。 |\n| `-d delim` | `--delimiter=delim`\
  \ | 当指定 `-f` 时，使用 `delim` 作为字段分隔符。默认情况下，字段由单个制表符分隔。 |\n| | `--complement` | 提取整行，但排除由\
  \ `-c` 和或 `-f` 指定的部分。 |\n\n我们可以看到，`cut` 相当不灵活。`cut` 用于提取程序生成的文本，而不是人工输入的文本。我们将查看\
  \ `distros.txt` 文件看看它是否足够“干净”。\n\n```bash\n[me@linuxbox ~]$ cat -A distros.txt\n\
  SUSE¹⁰.2¹²/07/2006\nFedora¹⁰¹¹/25/2008\nSUSE¹¹.0⁰⁶/19/2008\nUbuntu⁸.04⁰⁴/24/2008\n\
  Fedora⁸¹¹/08/2007\nSUSE¹⁰.3¹⁰/04/2007\nUbuntu⁶.10¹⁰/26/2006\nFedora⁷⁰⁵/31/2007\n\
  Ubuntu⁷.10¹⁰/18/2007\nUbuntu⁷.04⁰⁴/19/2007\nSUSE¹⁰.1⁰⁵/11/2006\nFedora⁶¹⁰/24/2006\n\
  Fedora⁹⁰⁵/13/2008\nUbuntu⁶.06⁰⁶/01/2006\nUbuntu⁸.10¹⁰/30/2008\nFedora⁵⁰³/20/2006\n\
  ```\n\n看起来不错。没有嵌入的空格，字段之间只有单个制表符。因为文件使用制表符而不是空格，我们将使用 `-f` 选项来提取字段。\n\n```bash\n\
  [me@linuxbox ~]$ cut -f 3 distros.txt\n12/07/2006\n11/25/2008\n06/19/2008\n04/24/2008\n\
  11/08/2007\n10/04/2007\n10/26/2006\n05/31/2007\n10/18/2007\n04/19/2007\n05/11/2006\n\
  10/24/2006\n05/13/2008\n06/01/2006\n10/30/2008\n03/20/2006\n```\n\n\n\n\n05/31/2007\n\
  10/18/2007\n04/19/2007\n05/11/2006\n10/24/2006\n05/13/2008\n06/01/2006\n10/30/2008\n\
  03/20/2006\n\n由于我们的 `distros` 文件是以制表符分隔的，因此最好使用 `cut` 来提取字段（fields）而不是字符。这是因为当文件以制表符分隔时，每行包含的字符数可能不同，这使得计算行内的字符位置变得困难或无法实现。然而，在之前的示例中，我们现在提取出了一个幸运地包含相同长度数据的字段，因此我们可以通过从每行中提取年份来展示字符提取是如何工作的。\n\
  \n```\n[me@linuxbox ~]$ cut -f 3 distros.txt | cut -c 7-10\n```\n\n2006\n2008\n\
  2008\n2008\n2007\n2007\n2006\n2007\n2007\n2007\n2006\n2006\n2008\n2006\n2008\n2006\n\
  \n通过对我们的列表再次运行 `cut`，我们能够提取第 7 到第 10 位的字符，这对应于我们日期字段中的年份。`7-10` 表示法是一个范围的示例。`cut`\
  \ 的 man 页面包含了关于如何指定范围的完整说明。\n\n在处理字段时，可以指定一个不同的字段分隔符而不是制表符字符。在这里，我们将从 `/etc/passwd`\
  \ 文件中提取第一个字段：\n\n```\n[me@linuxbox ~]$ cut -d ':' -f 1 /etc/passwd | head\n```\n\
  \nroot\ndaemon\nbin\nsys\nsync\ngames\nman\nlp\nmail\nnews\n\n使用 `-d` 选项，我们能够指定冒号字符\
  \ `:` 作为字段分隔符。\n\n## 扩展制表符 (EXPANDING TABS)\n\n我们的 `distros.txt` 文件格式非常适合使用 `cut`\
  \ 提取字段。但如果我们想要一个可以通过 `cut` 按字符而非按字段进行完全操作的文件呢？这将要求我们将文件中的制表符替换为相应数量的空格。幸运的是，GNU\
  \ Coreutils 软件包包含一个为此设计的工具。该程序名为 `expand`，它接受一个或多个文件参数或标准输入，并将修改后的文本输出到标准输出。\n\n\
  如果我们用 `expand` 处理 `distros.txt` 文件，就可以使用 `cut -c` 从文件中提取任意范围的字符。例如，我们可以使用以下命令，通过通过扩展文件并使用\
  \ `cut` 提取从第 23 位到行尾的每个字符，从列表中提取发布年份：\n\n```\n[me@linuxbox ~]$ expand distros.txt\
  \ | cut -c 23-\n```\n\nCoreutils 还提供了 `unexpand` 程序来用空格替换制表符。\n\n## paste—合并文件行\
  \ (Merge Lines of Files)\n\n`paste` 命令的作用与 `cut` 相反。它不是从文件中提取列文本，而是向文件中添加列或多列文本。它通过读取多个文件并将每个文件中找到字段合并到标准输出的单个流来实现。与\
  \ `cut` 类似，`paste` 接受多个文件参数和或标准输入。为了演示 `paste` 如何操作，我们将对 `distros.txt` 文件进行一些操作，生成一个按时间排序的发布列表。\n\
  \n根据之前对 `sort` 的使用，我们将首先生成按日期排序的发行版列表，并将结果存储在名为 `distros-by-date.txt` 的文件中。\n\n\
  ```\n[me@linuxbox ~]$ sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt > distros-by-date.txt\n\
  ```\n\n接下来，我们将使用 `cut` 提取文件的前两个字段（发行版名称和版本），并将结果存储在名为 `distro-versions.txt` 的文件中。\n\
  \n```bash\n[me@linuxbox ~]$ cut -f 1,2 distros-by-date.txt > distro-versions.txt\n\
  [me@linuxbox ~]$ head distros-versions.txt\n```\n\nFedora     10\nUbuntu   8.10\n\
  SUSE       11.0\nFedora     9\nUbuntu   8.04\nFedora     8\nUbuntu   7.10\nSUSE\
  \       10.3\nFedora     7\nUbuntu   7.04\n\n最后的准备工作是提取发布日期并将其存储在名为 `distro-dates.txt`\
  \ 的文件中。\n\n```bash\n[me@linuxbox ~]$ cut -f 3 distros-by-date.txt > distros-dates.txt\n\
  [me@linuxbox ~]$ head distros-dates.txt\n```\n\n11/25/2008\n10/30/2008\n06/19/2008\n\
  05/13/2008\n04/24/2008\n11/08/2007\n10/18/2007\n10/04/2007\n05/31/2007\n04/19/2007\n\
  \n我们现在有了所需的各个部分。要完成整个过程，使用 `paste` 将日期列放在发行版名称之前，从而创建一个按时间排序的列表。这只需通过使用 `paste`\
  \ 并排列其参数即可实现。\n\n```bash\n[me@linuxbox ~]$ paste distros-dates.txt distros-versions.txt\n\
  ```\n\n11/25/2008  Fedora     10\n10/30/2008  Ubuntu   8.10\n06/19/2008  SUSE  \
  \     11.0\n05/13/2008  Fedora     9\n04/24/2008  Ubuntu   8.04\n11/08/2007  Fedora\
  \     8\n10/18/2007  Ubuntu   7.10\n10/04/2007  SUSE       10.3\n05/31/2007  Fedora\
  \     7\n04/19/2007  Ubuntu   7.04\n\n\n\n\n05/31/2007 Fedora 7\n\n04/19/2007 Ubuntu\
  \ 7.04\n\n请注意，默认情况下，`join` 使用空格作为输入字段分隔符，并使用单个空格作为输出字段分隔符。此行为可以通过指定选项进行修改。详情请参阅\
  \ `join` 的 man 页。\n\n### 比较文本\n\n比较文本文件的版本通常很有用。对于系统管理员和软件开发者来说，这一点尤为重要。例如，系统管理员可能需要将现有的配置文件与之前的版本进行比较，以诊断系统问题。同样，程序员经常需要查看程序随时间发生了哪些变化。\n\
  \n#### comm—逐行比较两个已排序的文件\n\n`comm` 程序比较两个文本文件，并显示每个文件特有的行以及它们共同的行。为了演示，我们将使用 `cat`\
  \ 创建两个几乎完全的文本文件。\n\n```\n[me@linuxbox ~]$ cat > file1.txt\na\nb\nc\nd\n\n[me@linuxbox\
  \ ~]$ cat > file2.txt\nb\nc\nd\ne\n```\n\n接下来，我们将使用 `comm` 比较这两个文件。\n\n```\n[me@linuxbox\
  \ ~]$ comm file1.txt file2.txt\na\n             b\n               c\n          \
  \     d\n      e\n```\n\n如我们所见，`comm` 生成三列输出。第一列包含第一个文件参数特有的行，第二列包含第二个文件参数特有的行，第三列包含两个文件共有的行。`comm`\
  \ 支持形式为 `-n` 的选项，其中 `n` 为 1、2 或 3。使用这些选项时，它们指定要抑制哪些列。例如，如果我们只想输出两个文件共有的行，我们就会抑制第一列和第二列的输出。\n\
  \n```\n[me@linuxbox ~]$ comm -12 file1.txt file2.txt ownb\nc\nd\n```\n\n#### diff—逐行比较文件\n\
  \n与 `comm` 程序类似，`diff` 用于检测文件之间的差异。然而，`diff` 是一个复杂得多的工具，支持许多输出格式，并能够一次处理大量文本文件。软件开发者经常使用\
  \ `diff` 来检查程序源代码不同版本之间的变化，因此它具有递归检查源代码目录（通常称为 `source trees`）的能力。`diff` 的一个常见用途是创建\
  \ `diff files` 或补丁，这些补丁用于像 `patch`（我们稍后会讨论）这样的程序将一个文件（或多个文件）的版本转换为另一个版本。\n\n如果我们使用\
  \ `diff` 查看之前的示例文件：\n\n```\n[me@linuxbox ~]$ diff file1.txt file2.txt\n1d0\n< a\n\
  4a4\n> e\n```\n\n我们看到了它的默认输出样式：两个文件之间差异的简要描述。在默认格式中，每组更改之前都有一个形式为 `range operation\
  \ range` 的 `change command`，用于描述将第一个文件转换为第二个文件时所需的更改的位置和类型，如表 20-4 所示。\n\n**表 20-4:**\
  \ diff 更改命令\n\n| 更改 | 描述 |\n| --- | --- |\n| r1ar2 | 将第二个文件中 r2 位置的行追加到第一个文件的 r1\
  \ 位置处。 |\n| r1cr2 | 将第一个文件中 r1 位置的行替换为第二个文件中 r2 位置的行。 |\n| r1dr2 | 删除第一个文件中 r1 位置的行，这些行本应出现在第二个文件的\
  \ r2 范围内。 |\n\n在这种格式中，范围是起始行和结束行的逗号分隔的列表。虽然这种格式是默认格式（主要为了符合 POSIX 标准并与传统 Unix 版本的\
  \ `diff` 向后兼容），但它不像其他可选格式那样被广泛。两种流行的格式是 `context format`（上下文格式）和 `unified format`（统一格式）。\n\
  \n当使用上下文格式（`-c` 选项）查看时，我们将看到：\n\n```\n[me@linuxbox ~]$ diff -c file1.txt file2.txt\n\
  *** file1.txt     2008-12-23 06:40:13.000000000 -0500\n--- file2.txt     2008-12-23\
  \ 06:40:34.000000000 -0500\n***************\n*** 1,4 ****\n- a\n   b\n   c\n   d\n\
