  \ 会停止并显示此消息让我们确认替换：\n\n`replace with Line (y/n/a/q/l/^E/^Y)?`\n\n括号中的每个字符都是可能的选择，如表\
  \ 12-6 所示。\n\n**表 12-6:** 替换确认键\n\n| 键键 | 操作 |\n| --- | --- |\n| `y` | 执行替换。 |\n\
  | `n` | 跳过此处的模式实例。 |\n| `a` | 对此及此之后的所有模式实例执行替换。 |\n| `q` 或 `ESC` | 退出替换。 |\n| `l`\
  \ | 执行此替换并退出。这是“last”（最后一个）的缩写。 |\n| `CTRL-E`, `CTRL-Y` | 分别向下和向上滚动。这对于查看建议替换的上下文很有用。\
  \ |\n\n如果你输入 `y`，将执行替换。输入 `n` 将导致 `vi` 跳过此实例并移动到下一个。\n\n### 编辑多个文件\n\n一次编辑多个文件通常很有用。你可能需要对多个文件进行更改，或者你可能需要从一个文件复制内容到另一个文件。通过\
  \ `vi`，我们可以在命令行上指定多个文件来打开并编辑。\n\n```\nvi file1 file2 file3 . . .\n```\n\n退出现有的 vi\
  \ 会话并创建一个新文件进行编辑。输入 `:wq` 退出 `vi` 并保存修改后的文本。接下来，我们将在主目录下创建一个额外的文件供我们尝试。我们将通过捕获 `ls`\
  \ 命令的输出来创建该文件。\n\n```\n[me@linuxbox ~]$ ls -l /usr/bin > ls-output.txt\n```\n\n\
  让我们用 `vi` 编辑旧文件和新文件。\n\n```\n[me@linuxbox ~]$ vi foo.txt ls-output.txt\n```\n\n\
  `vi` 将启动，我们将看到第一个文件。\n\n```\nThe quick brown fox jumped over the lazy dog. It was\
  \ cool.\nLine 2\nLine 3\nLine 4\nLine 5\n```\n\n### 在文件之间切换\n\n要从一个文件切换到下一个文件，使用\
  \ `:bn`。要返回上一个文件，使用 `:bp`。虽然我们可以在文件之间移动，但如果当前文件有未保存的更改，`vi` 会强制执行策略阻止切换。要强制 `vi`\
  \ 切换并放弃更改，请添加感叹号 `!`。切换缓冲区的另一种方法是使用 `:buffers`，它会显示文件列表。\n\n\n\n\n\n```bash\n-rwxr-xr-x\
  \ 1 root root      25368 2017-10-06 20:16 a52dec\n-rwxr-xr-x 1 root root      11532\
  \ 2017-05-04 17:43 aafire\n-rwxr-xr-x 1 root root       7292 2017-05-04 17:43 aainfo\n\
  ```\n\n将光标移动到第一行，通过输入 `p` 命令粘贴我们从上一个文件中复制的行。\n\n```bash\ntotal 343700\nThe quick\
  \ brown fox jumped over the lazy dog. It was cool.\n-rwxr-xr-x 1 root root     \
  \ 31316 2017-12-05 08:58 [\n-rwxr-xr-x 1 root root       8240 2017-12-09 13:39 411toppm\n\
  -rwxr-xr-x 1 root root     111276 2018-01-31 13:36 a2p\n-rwxr-xr-x 1 root root \
  \     25368 2016-10-06 20:16 a52dec\n-rwxr-xr-x 1 root root      11532 2017-05-04\
  \ 17:43 aafire\n-rwxr-xr-x 1 root root       7292 2017-05-04 17:43 aainfo\n```\n\
  \n### 将整个文件插入到另一个文件中\n\n也可以将一个整个文件插入到我们正在编辑的文件。为了演示这一操作，让我们结束当前的 `vi` 会话并启动一个包含单个文件的新会话。\n\
  \n```bash\n[me@linuxbox ~]$ vi ls-output.txt\n```\n\n我们将再次看到我们的文件列表。\n\n```bash\n\
  total 343700\n-rwxr-xr-x 1 root root      31316 2017-12-05 08:58 [\n-rwxr-xr-x 1\
  \ root root       8240 2017-12-09 13:39 411toppm\n-rwxr-xr-x 1 root root     111276\
  \ 2018-01-31 13:36 a2p\n-rwxr-xr-x 1 root root      25368 2016-10-06 20:16 a52dec\n\
  -rwxr-xr-x 1 root root      11532 2017-05-04 17:43 aafire\n-rwxr-xr-x 1 root root\
  \       7292 2017-05-04 17:43 aainfo\n```\n\n将光标移动到第三行，然后输入以下 ex 命令：\n\n```bash\n\
  :r foo.txt\n```\n\n`:r` 命令（“read”的缩写）将指定的文件插入到光标位置下方。我们的屏幕现在应该像这样：\n\n```text\n\
  total 343700\n-rwxr-xr-x 1 root root      31316 2017-12-05 08:58 [\n-rwxr-xr-x 1\
  \ root root       8240 2017-12-09 13:39 411toppm\nThe quick brown fox jumped over\
  \ the lazy dog. It was cool.\nLine 2\nLine 3\nLine 4\nLine 5\n-rwxr-xr-x 1 root\
  \ root     111276 2018-01-31 13:36 a2p\n-rwxr-xr-x 1 root root      25368 2016-10-06\
  \ 20:16 a52dec\n-rwxr-xr-x 1 root root      11532 2017-05-04 17:43 aafire\n-rwxr-xr-x\
  \ 1 root root       7292 2017-05-04 17:43 aainfo\n```\n\n### 保存我们的工作\n\n像 `vi` 中的其他所有内容一样，有几种不同的方法可以保存我们编辑的文件。我们已经涵盖了\
  \ ex 命令 `:w`，但还有一些我们可能发现有用的命令。\n\n在命令模式下，输入 `ZZ` 会保存当前文件并退出 `vi`。同样，ex 命令 `:wq`\
  \ 将 `:w` 和 `:q` 命令合并为一个命令，将同时保存文件并退出。\n\n`:w` 命令还可以指定一个可选的文件名。这的作用类似于于“另存为”。例如，如果我们正在编辑\
  \ `foo.txt` 并想要保存一个名为 `foo1.txt` 的备用版本，我们将输入以下内容：\n\n```bash\n:w foo1.txt\n```\n\
  \n**注意**\n\n虽然此命令以新名称保存文件，但它不会更改你正在编辑的文件名。当你继续编辑时，你仍然是在编辑 `foo.txt`，而不是 `foo1.txt`。\n\
  \n\n\n\n现在，每当显示提示符（prompt）时，我们应该都能听到哔哔声，尽管某些系统禁用了这一“功能”。这可能会让人心烦，但如果我们执行执行特别耗时的命令时需要通知，它可能很有用。请注意，我们包含了\
  \ `\\[` 和 `\\]` 序列。由于 ASCII 响铃 `\\a` 不会“打印”（也就是说它不会移动光标），我们需要告诉 bash，这样它才能正确确定提示符的长度。\n\
  \n接下来，让我们尝试创建一个包含主机名和时间信息的描述性提示符。\n\n```\n$ PS1=\"\\A \\h \\$ \"\n```\n\n```\n17:33\
  \ linuxbox $\n```\n\n如果我们需要跟踪执行某些任务的时间，那么在提示符中添加时间将非常有用。最后，我们将创建一个与原始提示符相似的新提示符。\n\
  \n```bash\n17:37 linuxbox $ PS1=\"<\\u@\\h \\W>\\$ \"\n```\n\n```\n<me@linuxbox\
  \ ~>$\n```\n\n尝试表 13-1 中列出的其他序列，看看你是否能出一个色的新提示符。\n\n### 添加颜色\n\n大多数终端模拟器程序都会响应某些非打印字符序列，以控制如字符属性（如颜色、粗体文本和可怕的闪烁文本）以及光标位置。我们稍后会介绍光标位置，但首先我们来看颜色。\n\
  \n#### **终端困惑**\n\n在古代，当终端连接到远程计算机时，有许多竞争性的终端品牌，它们的工作方式各不相同。它们有不同的键盘，而且解释控制信息的方式也各异。Unix\
  \ 和类 Unix 系统有两个相当复杂的子系统来处理终端控制的“巴别语言”（被称为 `termcap` 和 `terminfo`）。如果你在终端模拟器设置的最深深处查找，你可能会找到一个关于终端仿真类型的设置。\n\
  \n为了让终端能够使用某种通用语言，美国国家标准学会（ANSI）开发了一套标准的字符序列来控制视频终端。老牌 DOS 用户会记得用于启用这些代码解释的 `ANSI.SYS`\
  \ 文件。\n\n字符颜色是通过向终端模拟器发送嵌入在待显示字符流中的 `ANSI 转义码` 来控制的。该控制代码并不会在显示器上“打印”出来；而是被终端解释为指令。正如我们在表\
  \ 13-1 中所示，`\\[` 和 `\\]` 序列用于封装非打印字符。ANSI 转义码以八进制的 `033`（由 `ESC` 键生成的代码）开头，随后是一个可选的字符属性，然后是指令。例如，将文本颜色设置为普通（属性\
  \ = 0）、黑色文本的代码如下：\n\n```\n\\0330;30m\n```\n\n[表 13-2 列出了可用的文本颜色。注意，颜色被分为两组，通过应用粗体字符属性（1）来区分，这会产生“浅”色的效果。\n\
  \n**表 13-2：** 用于设置文本颜色的转义序列\n\n| **序列** | **文本颜色** | **序列** | **文本颜色** |\n| ---\
  \ | --- | --- | --- |\n| `\\033[0;30m` | 黑色 | `\\033[1;30m` | 深灰色 |\n| `\\033[0;31m`\
  \ | 红色 | `\\033[1;31m` | 浅红色 |\n| `\\033[0;32m` | 绿色 | `\\033[1;32m` | 浅绿色 |\n|\
  \ `\\033[0;33m` | 棕色 | `\\033[1;33m` | 黄色 |\n| `\\033[0;34m` | 蓝色 | `\\033[1;34m`\
  \ | 浅蓝色 |\n| `\\033[0;35m` | 紫色 | `\\033[1;35m` | 浅紫色 |\n| `\\033[0;36m` | 青色 |\
  \ `\\033[1;36m` | 浅青 |\n| `\\033[0;37m` | 灰色 | `\\033[1;37m` | 白色 |\n\n让我们尝试创建一个红色的提示符（在这里显示为灰色）。我们将在开头插入转义码。\n\
  \n```\n<me@linuxbox ~>$ PS1=\"\\[033[0;31m\\]<\\u@\\h \\W>\\$\"\n```\n\n```\n<me@linuxbox\
  \ ~>$\n```\n\n这起作用了，但注意我们在提示符之后输入的所有文本也将以红色显示。为了修复这个问题，我们将在提示符末尾添加另一个转义码，告诉终端模拟器返回之前的颜色。\n\
  \n```\n<me@linuxbox ~>$ PS1=\"\\[033[0;31m\\]<\\u@\\h \\W>\\$\\[033[0m\\]\"\n```\n\
  \n```\n<me@linuxbox ~>$\n```\n\n这样好多了！还可以使用表 13-3 中列出的代码设置文本背景。背景颜色不支持粗体属性。\n\n\
  **表 13-3：** 用于设置背景的转义序列\n\n| **序列** | **背景颜色** |\n| --- | --- |\n| `\\033[0;40m`\
  \ | 黑色 |\n| `\\033[0;41m` | 红色 |\n| `\\033[0;42m` | 绿色 |\n| `\\033[0;43m` | 棕色 |\n\
  | `\\033[0;44m` | 蓝色 |\n| `\\033[0;45m` | 紫色 |\n| `\\033[0;46m` | 青色 |\n| `\\033[0;47m`\
  \ | 灰色 |\n\n我们可以通过对第一个代码进行简单更改来创建一个红色背景的提示符。\n\n```\n<me@linuxbox ~>$ PS1=\"\\[033[0;41m\\\
  ]<\\u@\\h \\W>\\$\\[033[0m\\]\"\n```\n\n```\n<me@linuxbox ~>$\n```\n\n尝试这些颜色代码，看看你能不能出一个出色的新提示符。\n\
  \n**注意**\n除了普通（0）和粗体（1）属性外，还有下划（4）、闪烁（5）和反转（7）属性。某些终端模拟器不尊重这些属性。\n\n### 移动光标\n\n\
  我们稍后会介绍光标位置。表 13-4 列出了用于移动光标的转义序列。\n\n**表 13-4：** 光标移动转义序列\n\n| **转义序列** | **动作**\
  \ |\n| --- | --- |\n| `\\033nA` | 向上 |\n| `\\033[nB` | 向下 |\n| `\\033[nC` | 向右 |\n\
  | `\\033[nD` | 向左 |\n| `\\033[H` | 移动到左上角 |\n| `\\033[n;m` | 移动到第 n 行第 m 列 |\n|\
  \ `\\033[J` | 清除从光标到屏幕的内容 |\n| `\\033[K` | 清除从光标到行尾 |\n| `\\033[R` | 移动光标 |\n| `\\\
  033[G` | 滚动光标 |\n| `\\033[s` | 存储光标位置 |\n| `\\033[u` | 恢复光标位置 |\n\n使用[表 13-4 中的代码，我们可以在屏幕顶部绘制一个带有红色背景并包含时钟的提示符（时钟以黄色文本显示），每次显示提示符时都会这样绘制。某些终端模拟器不尊重这种代码。\n\
  \n\n\n显然，我们不想一直输入那长串怪物般的命令，所以我们需要将提示符存储在某处。我们可以通过将其添加到 `*.bashrc` 文件中使提示符持久化。为此，请向文件中添加以下两行：\n\
  \n```bash\nPS1=\"\\[\\033[s\\033[0;0H\\033[0;41m\\033[K\\033[1;33m\\t\\033[0m\\\
  033[u\\]<\\u@\\h \\W>\\$ \"\n\nexport PS1 \n```\n\n### 总结\n\n信不不信，涉及 shell 函数和脚本的提示符还有很多我们可以做到的操作，而我们在这里还没有涵盖，但这是一个很好的开始。并不是每个人都有足够的兴趣去修改提示符，因为默认提示符通常是可以满意的。但对于我们这些喜欢钻研的人来说，shell\
  \ 提供了许多小时的休闲乐趣。\n\n# 第三部分：常见任务与核心工具\n\n## 14. 软件包管理\n\n![image](img/common01.jpg)\n\
  \n如果我们在 Linux 社区中花费任何时间，就会听到关于许多 Linux 发行版中哪一个最“最佳”的各种意见。通常，这些讨论变得非常愚蠢，集中在桌面背景的美观程度（有些人因为\
  \ Ubuntu 的默认配色方案而不使用它！）以及其他琐碎的事情上。\n\n决定发行版质量最重要的因素是`packaging system`以及该发行版支持社区的活力。随着我们与\
  \ Linux 共处的时间越长，我们会发现它的软件格局极具动态。事物在不断变化。大多数顶级 Linux 发行版每六个月发布一个新版本，并且每天更新许多独立程序。为了跟上这股软件风暴，我们需要良好的`package\
  \ management`工具。\n\n软件包管理是在系统上安装和维护软件的方法。今天，大多数人可以通过从他们的 Linux 发行版安装 `packages`（软件包）来满足所有的软件需求。这与\
  \ Linux 的早期阶段形成了对比，那时人们必须下载并编译 `source code`（源代码）来安装软件。编译源代码并没有任何错；事实上，能够获取 `source\
  \ code` 是 Linux 的巨大魅力所在。它赋予了我们（以及其他人）检查和改进系统的能力。只是拥有预编译的包处理起来更快、更简单。\n\n在本章中，我们将查看一些用于软件包管理的命令行工具。虽然所有主流发行版都提供了强大且复杂的图形化程序来维护系统，但学习命令行程序同样重要。它们可以执行许多用图形对应程序难以（或无法）完成的任务。\n\
  \n### 软件包系统\n\n不同的发行版使用不同的软件包系统，根据一般规则，为一个发行版设计的包与另一个发行版不兼容。大多数发行版属于软件包技术的两个阵营：Debian\
  \ `.deb` 营和 Red Hat `.rpm` 营。有一些重要的例外，如 Gentoo、Slackware 和 Arch，但大多数其他发行版都使用这两个基本系统之一，如表\
  \ 14-1 所示。\n\n**表 14-1：** 主要软件包系统家族\n\n| 软件包系统 | 发行版（部分列表） |\n| --- | --- |\n| Debian\
  \ 风格 (.deb) | Debian, Ubuntu, Linux Mint, Raspbian |\n| Red Hat 风格 (.rpm) | Fedora,\
  \ CentOS, Red Hat Enterprise Linux, OpenSUSE |\n\n### 软件包系统如何工作\n\n专有软件行业中的软件分发方法通常涉及购买安装介质（如“安装盘”）或访问每个供应商的网站下载产品，然后运行“安装向导”以在系统上安装新应用程序。\n\
  \nLinux 并不是那样运行的。几乎所有 Linux 系统的软件可以在互联网上找到。大部分将由发行版供应商以 `package files`（软件包文件）的形式提供，其余部分以源代码形式提供，可以手动安装。我们将在第\
  \ 23 章中讨论如何通过编译 `source code` 来安装软件。\n\n#### 软件包文件\n\n软件包系统中软件的基本单位是 `package file`（软件包文件）。软件包文件是组成软件包包的文件的压缩集合。一个包可能由许多程序和支持这些程序的数据文件组成。除了要安装的文件外，软件包文件还包含有关包的元数据，例如包及其内容的文本描述。此外，许多软件包包含安装前和安装后脚本，用于在包安装之前之后执行配置任务。\n\
  \n软件包文件由名为 `package maintainer`（软件包维护者）的人创建，他们通常（但并不总是）是发行版供应商的员工。软件包维护者从 `upstream\
  \ provider`（上游供应商，程序作者）获取源代码形式的软件，对其编译，并创建包元数据以及任何必要的安装脚本。通常，软件包维护者会对原始源代码进行修改，以改进程序与\
  \ Linux 发行版其他部分的集成。\n\n#### 存储库\n\n虽然某些软件项目选择自己进行打包制作和分发，但今天大多数软件包由发行版供应商和感兴趣的第三方创建。软件包通过中央存储库提供给发行版用户，这些库可能包含数千万个包，每个包都是为该发行版专门构建和维护的。\n\
  \n一个发行版可能会为软件开发生命周期的不同阶段维护多个不同的仓库。例如，通常有一个“testing”（测试）仓库，其中包含刚构建的包，供那些在包发布通用分发之前寻找\
  \ Bug 的勇敢勇士使用。发行版通常还会有一个“development”（开发）仓库，存放旨在包含在发行版下次大版本中的进行中的工作。\n\n发行版还可能有相关的第三方仓库。这些仓库通常用于提供由于专利或\
  \ DRM 反破解问题等法律原因无法包含在发行版中的软件。最广为人知的案例之一是加密 DVD 支持，这在美国是不合法的。第三方仓库在软件专利和反破解法律不适用的国家运行。这些仓库完全独立于它们支持的发行版，要使用它们，必须了解它们并将它们手动包含在软件包系统的配置文件中。\n\
  \n#### 依赖关系\n\n程序很少“孤立”运行；相反，它们依赖其他软件组件的存在来完成工作。例如，输入/输出等常见活动由许多程序共享的例处理。这些例存储在`shared\
  \ libraries`（共享库）中，为多个程序提供服务。如果一个包需要共享库等共享资源，则认为它具有 `dependency`（依赖）。现代软件包管理系统都提供某种\
  \ `dependency resolution`（依赖解析）方法，以确保在安装包时，所有的依赖项也能被安装。\n\n#### 高级和低级软件包工具\n\n软件包管理系统通常由两种工具组成。\n\
  \n*   低级工具：处理安装和删除软件包文件等任务。\n*   高级工具：执行元数据搜索和依赖解析。\n\n\n\n\n在本章中，我们将查看 Debian 风格系统（如\
  \ Ubuntu 等许多其他系统）提供的工具以及 Red Hat 产品使用的工具。虽然所有 Red Hat 风格的发行版都依赖同一个底层程序（`rpm`），但它们使用不同的高层工具。在我们的讨论中，我们将涵盖\
  \ Red Hat Enterprise Linux 和 CentOS 使用的高层程序 `yum`。其他 Red Hat 风格的发行版提供了类似功能的高层工具（参见表\
  \ 14-2）。\n\n**表 14-2：** 软件包系统工具\n\n| **发行版** | **底层工具** | **高层工具** |\n\n| --- |\
  \ --- | --- |\n| Debian 风格 | `dpkg` | `apt-get`, `apt`, `aptitude` |\n| Fedora,\
  \ Red Hat Enterprise Linux, CentOS | `rpm` | `yum`, `dnf` |\n\n## 常见软件包管理任务\n\n\
  使用命令行软件包管理工具可以执行许多操作。我们将介绍最常见的操作。请注意，底层工具也支持创建软件包，该活动超出了本书的范围。\n\n在接后的讨论中，术语 `package_name`\
  \ 指软件包的实际名称，而不是 `package_file`，后者是包含软件包的文件名。\n\n### 在仓库中查找软件包\n\n使用高层工具搜索仓库元数据，可以根据名称或描述找到某个软件包（参见表\
  \ 14-3）。\n\n**表 14-3：** 软件包搜索命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian\
  \ | `apt-get update; apt-cache search search_string` |\n| Red Hat | `yum search\
  \ search_string` |\n\n例如，要在 `yum` 仓库中搜索 emacs 文本编辑器，我们可以使用此命令：\n\n```bash\nyum search\
  \ emacs\n```\n\n### 从仓库安装软件包\n\n高层工具允许从仓库下载软件包并带有完整的依赖关系解析进行安装（参见表 14-4）。\n\n**表\
  \ 14-4：** 软件包安装命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian | `apt-get\
  \ update; apt-get install package_name` |\n| Red Hat | `yum install package_name`\
  \ |\n\n例如，在 Debian 系统上从 apt 仓库安装 emacs 文本编辑器，我们可以使用此命令：\n\n```bash\napt-get update;\
  \ apt-get install emacs\n```\n\n### 从软件包文件安装软件包\n\n如果软件包文件是从仓库以外的下载的，可以使用底层工具直接安装（尽管不进行依赖关系解析）（参见表\
  \ 14-5）。\n\n**表 14-5：** 底层软件包安装命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n|\
  \ Debian | `dpkg -i package_file` |\n| Red Hat | `rpm -i package_file` |\n\n例如，如果\
  \ `emacs-22.1-7-fc7-i386.rpm` 软件包文件是从非仓库网站下载的，它将通过这种方式安装：\n\n```bash\nrpm -i emacs-22.1-7-fc7-i386.rpm\n\
  ```\n\n**注意**\n\n由于此技术使用底层 `rpm` 程序执行安装，因此不会进行依赖关系解析。如果 `rpm` 发现缺少依赖项，`rpm` 将带错误错误退出。\n\
  \n### 移除软件包\n\n可以使用高层工具或底层工具卸载软件包。表 14-6 列表出了高层工具。\n\n**表 14-6：** 软件包移除命令\n\n| **风格**\
  \ | **命令(s)** |\n\n| --- | --- |\n| Debian | `apt-get remove package_name` |\n|\
  \ Red Hat | `yum erase package_name` |\n\n例如，要从 Debian 风格系统上卸载 emacs 软件包，我们可以使用此命令：\n\
  \n```bash\napt-get remove emacs\n```\n\n### 从仓库更新软件包\n\n最常见的软件包管理任务是保持系统更新到软件包的最新版本。高层工具可以一步到位完成这项重要任务（参见表\
  \ 14-7）。\n\n**表 14-7：** 软件包更新命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian\
  \ | `apt-get update; apt-get upgrade` |\n| Red Hat | `yum update` |\n\n例如，要在 Debian\
  \ 风格系统上对已安装软件包应用所有可用更新，我们可以使用此命令：\n\n```bash\napt-get update; apt-get upgrade\n\
  ```\n\n### 从软件包文件升级软件包\n\n如果从非仓库下载了软件包的更新版本，可以安装它并替换之前的版本（参见表 14-8）。\n\n**表 14-8：**\
  \ 底层软件包升级命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian | `dpkg -i package_file`\
  \ |\n| Red Hat | `rpm -U package_file` |\n\n例如，如果在 Red Hat 系统上下载了 `emacs-22.1-7-fc7-i386.rpm`\
  \ 软件包，将通过这种方式进行升级：\n\n```bash\nrpm -U emacs-22.1-7-fc7-i386.rpm\n```\n\n**注意**\n\
  \n`dpkg` 没有像 `rpm` 那样专门用于升级的选项。\n\n## 列出软件包\n\n表 14-9 列出了我们可以列出所有安装软件包的命令。\n\n**表\
  \ 14-9：** 软件包列出命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian | `dpkg -l`\
  \ |\n| Red Hat | `rpm -qa` |\n\n### 判断软件包是否已安装\n\n表 14-10 列出了我们可以检查软件包是否已安装的底层工具。\n\
  \n**表 14-10：** 软件包状态命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian | `dpkg\
  \ -s package_name` |\n| Red Hat | `rpm -q package_name` |\n\n例如，要在 Debian 风格系统上检查\
  \ emacs 软件包是否已安装，我们可以：\n\n```bash\ndpkg -s emacs\n```\n\n### 显示已安装软件包的信息\n\n如果已知安装软件包的名称，我们可以使用表\
  \ 14-11 中的命令显示软件包的描述。\n\n**表 14-11：** 软件包信息命令\n\n| **风格** | **命令(s)** |\n\n| ---\
  \ | --- |\n| Debian | `apt-cache show package_name` |\n| Red Hat | `yum info package_name`\
  \ |\n\n例如，要在 Debian 风格系统上查看 emacs 软件包的描述，我们可以：\n\n```bash\napt-cache show emacs\n\
  ```\n\n### 查找哪个软件包安装了文件\n\n要确定哪个软件包负责安装特定文件，我们可以使用表 14-12 中的命令。\n\n**表 14-12：**\
  \ 软件包文件识别命令\n\n| **风格** | **命令(s)** |\n\n| --- | --- |\n| Debian | `dpkg -S file_name`\
  \ |\n| Red Hat | `rpm -qf file_name` |\n\n例如，要在 Red Hat 系统上查看哪个软件包安装了 `/usr/bin/vim`，我们可以：\n\
  \n```bash\nrpm -qf /usr/bin/vim\n```\n\n### 总结\n\n在接下来的章节中，我们将探索许多涵盖不同应用程序领域的程序。虽然其中许多程序是默认安装的，但如果必要的程序尚未安装在我们的系统上，我们可能需要安装额外的软件包。有了我们对软件包管理的新知识和理解，安装和管理我们需要的程序应该没有问题。\n\
  \n### 软件安装迷言\n\n从其他平台迁移的人有时会陷入一种迷言，认为在 Linux 下安装软件非常困难，并且不同发行版使用的打包方案是一种障碍。嗯，这确实是一种障碍，但仅对于那些想要分发其秘密二进制版本的软件供应商。\n\
  \nLinux 软件生态系统基于开源源代码。如果程序开发者发布了程序的源代码，与发行版相关的人可能会对程序进行打包并将其包含在仓库中。\n\n\n\n这种分发方式让用户享享了软件“一站式购物”的便利，而无需必逐个搜索每个程序的网站。最近，主要的专有平台供应商也已开始构建模仿这种理念的应用商店。\n\
  \n设备驱动的处理方式大相同，不同之处它们不再是发行版存储库中的独立项目，而是成为了 `Linux kernel` 的一部分。通常来说，Linux 中并没有所谓的“驱动器磁盘”（driver\
  \ disk）。内核要么支持某个设备，要么不支持，而且 `Linux kernel` 支持很多设备——事实上，支持的设备比 Windows 多得多。当然，如果你需要的特定设备不受支持，这并无无济于事。当这种情况发生时，你需要查看原因。缺乏驱动支持通常由三个原因之一引起：\n\
  \n- **设备太新了。** 许多硬件厂商并不积极支持 Linux 开发，因此需要 Linux 社区的成员来编写内核驱动代码。这需要时间。\n- **设备太冷门。**\
  \ 并不是所有的发行版都包含所有可能的设备驱动。每个发行版都构建自己的内核，由于内核是可配置的（这使得 Linux 能够在从手表到大型机的任何设备上运行），它们可能会忽略某个特定设备。通过定位并下载驱动程序的源码，你（是的，是你）可以自己编译并安装驱动。这个过程并不困难，但相当复杂。我们将在后面的章节中讨论编译软件。\n\
  - **硬件厂商隐藏了某些东西。** 他们既没有发布 Linux 驱动程序的源码，也没有发布技术文档让别人为他们创建驱动。这意味着硬件厂商正试图对设备的编程接口保密。由于我们不希望计算机里有秘密设备，你最好避免购买此类产品。\n\
  \n# 15 存储介质\n\n![image](img/common01.jpg)\n\n在之前的章节中，我们查看了在文件级操作数据。在本章中，我们将考虑设备级的数据。Linux\
  \ 在处理存储设备方面具有惊的能力，无论是硬盘等物理存储、网络存储，还是如 `RAID`（独立冗余阵列）和 `LVM`（逻辑卷管理器）等虚拟存储设备。\n\n\
  然而，由于这不是一本关于系统管理的书籍，我们不会尝试深入覆盖整个主题。我们将尝试介绍一些用于管理存储设备的概念和关键命令。\n\n为了完成本章的练习，我们将使用一个\
  \ USB 闪盘和一张 CD-RW 光盘（适用于配备 CD-ROM 刻字机的系统）。\n\n我们将查看以下命令：\n\n- `mount`: 挂载文件系统\n\
  - `umount`: 卸载文件系统\n- `fsck`: 检查并修复文件系统\n- `fdisk`: 操控磁盘分区表\n- `mkfs`: 创建文件系统\n\
  - `dd`: 转换并复制文件\n- `genisoimage` (`mkisofs`) 创建 ISO 9660 镜像文件\n- `wodim` (`cdrecord`)\
  \ 将数据写入光刻存储介质\n- `md5sum`: 计算 MD5 校验和\n\n## 挂载和卸载存储设备\n\nLinux 桌面系统的最新进展使得存储设备管理对桌面用户来说变得极其简单。在大多数情况下，我们只需将设备连接到系统，它就能“直接工作”。在过去（比如\
  \ 2004 年），这些工作必须手动完成。对于非桌面系统（即服务器），这很大程度上是一个手动过程，因为服务器通常有极端的存储需求和复杂的配置要求。\n\n管理存储设备的第一步是将设备挂载到文件系统树上。这个过程被称为*挂载*（mounting），允许设备与操作系统进行交互。正如我们在第\
  \ 2 章中所回顾的那样，类 Unix 操作系统（如 Linux）维护一个单一的文件系统树，并在各个点挂载设备。这与 Windows 等操作系统不同，Windows\
  \ 为每个设备维护独立的文件系统树（例如 `C:\\`、`D:\\` 等）。\n\n名为 `/etc/fstab`（“file system table”的缩写）的文件列出了启动时时要挂载的设备（通常是硬盘分区）。这里是一个早期\
  \ Fedora 系统的 `/etc/fstab` 文件示例：\n\n```\nLABEL=/12           /               ext4\
  \    defaults        1\nLABEL=/home         /home           ext4    defaults   \
  \     2\nLABEL=/boot         /boot          ext4    defaults        2\ntmpfs   \
  \            /dev/shm        tmpfs   defaults        0\ndevpts              /dev/pts\
  \       devpts  gid=5,mode=620 0\nsysfs               /sys            sysfs   defaults\
  \        0\nproc                /proc           proc    defaults        0\nLABEL=SWAP-sda3\
  \     swap            swap    defaults        0\n```\n\n这些是硬盘分区。文件的每一行由六个字段组成，如表\
  \ 15-1 所示。\n\n**表 15-1:** /etc/fstab 字段\n\n| 字段 | 内容 | 说明 |\n| --- | --- | --- |\n\
  | 1 | 设备 | Traditional 上，此字段包含与物理设备关联的设备文件的实际名称，例如 `/dev/sda1`（检测到的第一个硬盘的分区）。但对于今天的计算机，许多设备支持热拔（如\
  \ USB 驱动），许多现代 Linux 发行版将设备与文本标签关联。此标签（在格式化存储介质时添加）可以是简单的文本标签，也可以是随机生成的 `UUID`（通用标识符）。操作系统在设备连接到系统时读取此标签。这样，无论分配到哪个设备文件，都能正确识别。\
  \ |\n| 2 | 挂载点 | 设备挂载到文件系统树的目录。 |\n| 3 | 文件系统类型 | Linux 允许挂载许多文件系统类型。大多数原生 Linux\
  \ 文件系统是第四扩展文件系统 (`ext4`)，但也支持许多其他，如 FAT16 (`msdos`)、FAT32 (`vfat`)、NTFS (`ntfs`)、CD-ROM\
  \ (`iso9660`) 等。 |\n| 4 | 选项 | 文件系统可以使用各种选项挂载。例如可以将文件系统挂载为只读，或防止从它们执行任何程序（对于可移动介质是一项安全功能）。\
  \ |\n| 5 | 频率 | 指定以及何时使用 `dump` 命令备份文件系统的数字。 |\n| 6 | 顺序 | 指定使用 `fsck` 命令检查文件系统的顺序的数字。\
  \ |\n\n### 查看挂载的文件系统列表\n\n`mount` 命令用于挂载文件系统。不带参数输入该命令将显示当前挂载的文件系统列表。\n\n```\nme@linuxbox\
  \ ~]$ mount\n/dev/sda2 on / type ext4 (rw)\nproc on /proc type proc (rw)\nsysfs\
  \ on /sys type sysfs (rw)\ndevpts on /dev/pts type devpts (rw,gid=5,mode=620)\n\
  /dev/sda5 on /home type ext4 (rw)\n/dev/sda1 on /boot type ext4 (rw)\ntmpfs on /dev/shm\
  \ type tmpfs (rw)\nnone on /proc/sys/fs/binfmt_misc type binfmt_misc (rw)\nsunrpc\
  \ on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)\nfusectl on /sys/fs/fuse/connections\
  \ type fusectl (rw)\n/dev/sdd1 on /media/disk type vfat (rw,nosuid,nodedev,noatime,uhelper=hal,uid=500,utf8,shortname=lower)\n\
  twin4:/musicbox on /misc/musicbox type nfs4 (rw,addr=192.168.1.4)\n```\n\n\n\n列表的格式如下：`device`\
  \ `mount_point` `type` `filesystem_type` `(options)`。例如，第一行显示设备 `/dev/sda2` 被挂载为根文件系统，类型为\
  \ `ext4`，且可读可写（选项为 `rw`）。该列表底部还有两个有趣的条目。倒数第二项显示一个在读卡器中并挂载在 `/media/disk*` 的 2GB\
  \ SD 内存卡，最后一项是挂载在 `/misc/musicbox*` 的网络驱动器。\n\n对于我们的第一个实验，我们将处理一个光盘驱驱（CD-ROM）。首先，让我们看看插入\
  \ CD-ROM 之前的系统状态。\n\n```bash\n[me@linuxbox ~]$ mount\n\n/dev/mapper/VolGroup00-LogVol00\
  \ on / type ext4 (rw)\nproc on /proc type proc (rw)\nsysfs on /sys type sysfs (rw)\n\
  devpts on /dev/pts type devpts (rw,gid=5,mode=620)\n/dev/sda1 on /boot type ext4\
  \ (rw)\ntmpfs on /dev/shm type tmpfs (rw)\nnone on /proc/sys/fs/binfmt_misc type\
  \ binfmt_misc (rw)\nsunrpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)\n```\n\
  \n此列表来自一个 CentOS 系统，它使用 LVM（逻辑卷管理器）来创建其根文件系统。与许多现代 Linux 发行版一样，该系统会尝试在插入 CD-ROM\
  \ 后自动挂载。插入光片后，我们看到了以下内容：\n\n```bash\n[me@linuxbox ~]$ mount\n\n/dev/mapper/VolGroup00-LogVol00\
  \ on / type ext4 (rw)\nproc on /proc type proc (rw)\nsysfs on /sys type sysfs (rw)\n\
  devpts on /dev/pts type devpts (rw,gid=5,mode=620)\n/dev/hda1 on /boot type ext4\
  \ (rw)\ntmpfs on /dev/shm type tmpfs (rw)\nnone on /proc/sys/fs/binfmt_misc type\
  \ binfmt_misc (rw)\nsunrpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)\n/dev/sdc\
  \ on /media/live-1.0.10-8 type iso9660 (ro,noexec,nosuid,nodev,uid=500)\n```\n\n\
  插入光片后，我们看到了与之前相同的列表，但多了一个条目。在列表末尾，我们看到 CD-ROM（在该系统中设备设备为 `/dev/sdc`）已挂载到 `/media/live-1.0.10-8`，类型为\
  \ `iso9660`（一种光盘驱）。出于实验的考虑，我们感兴趣的是设备的名称。当你亲自进行此实验时，设备名称很可能会不同。\n\n**警告**\n\n在接下来的示例中，至关重要的一点是你关注你系统中使用的实际设备名称，**不要使用本文中的名称！**\
  \ 另外注意，音频 CD（Audio CDs）与 CD-ROM 相同。音频 CD 不包含文件系统，因此无法在通常意义上进行挂载。\n\n现在我们已经有了 CD-ROM\
  \ 驱动器的设备名称，让我们卸载光片并在文件树的另一个位置重新挂载它。为了这一点，我们变为超级用户（使用适用于我们系统的命令），并使用 `umount` 命令（注意拼写）卸载光片。\n\
  \n```bash\n[me@linuxbox ~]$ su -\n\nPassword:\n[root@linuxbox ~]# umount /dev/sdc\n\
  ```\n\n卸载光片后，让我们在文件树的另一个位置重新挂载它。为了做到这一点，我们变为超级用户（使用适用于我们系统的命令），并使用 `umount` 命令（注意拼写）卸载光片。\n\
