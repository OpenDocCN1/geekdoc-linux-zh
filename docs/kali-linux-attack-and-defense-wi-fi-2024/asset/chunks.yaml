    \ packets:\n\nbash\n\nsudo apt install snort\n\n2.  Add deauthentication packet\
    \ detection rules in the Snort configuration file.\n\n3.  Disabling WPS: Access\
    \ the router's administration interface and disable the WPS functionality to prevent\
    \ related attacks.\n\n4.  MAC Filtering: Configure an access control list (ACL)\
    \ on the router to allow only authorized devices.\n\n5.  Firmware Updates: Regularly\
    \ check your router manufacturer's website for firmware updates and apply them\
    \ as needed.\n\nDeauthentication attacks are a common and effective technique\
    \ used to disrupt the connectivity of Wi-Fi networks. Using tools such as airplay-ng,\
    \ MDK3 and Scapy, these attacks can be carried out relatively easily. However,\
    \ there are several mitigation and defense strategies, including the use of WPA3,\
    \ monitoring and detection, packet filtering, network segmentation, and firmware\
    \ updating. Real-world case studies illustrate the effectiveness of these strategies\
    \ in protecting against deauthentication attacks, highlighting the importance\
    \ of a multi-pronged approach to ensuring the security of Wi-Fi networks.\n\n\
    Chapter 5: Wi-Fi Password Cracking\n\n# \n\n* * *\n\n# Wi-Fi Password Attack Methods\n\
    \nThe security of Wi-Fi networks depends heavily on the strength of the passwords\
    \ used to protect access. Cracking these passwords could allow an attacker to\
    \ access the network, intercept data, and even compromise connected devices. There\
    \ are several methods used to crack Wi-Fi passwords, each with its own techniques\
    \ and tools.\n\n# Handshakes Capture\n\nThe first step in many Wi-Fi password\
    \ attacks is to capture the WPA/WPA2 handshake. This process occurs when a device\
    \ connects to a Wi-Fi network, allowing the attacker to capture the packets necessary\
    \ to crack the password.\n\nUse of Airodump-ng:\n\nbash\n\nsudo airodump-ng -c\
    \ [canal] --bssid [BSSID] -w capture wlan0mon\n\n●       This command captures\
    \ the handshake, which is saved to a file .cap.\n\n# Reaver Attack\n\nReaver is\
    \ a tool that exploits Wi-Fi Protected Setup (WPS) vulnerability to recover WPA/WPA2\
    \ password.\n\nUse of Reaver:\n\nbash\n\nsudo reaver -i wlan0mon -b [BSSID] -vv\n\
    \n● This command attempts to guess the WPS PIN, which can be used to recover the\
    \ password.\n\n# Phishing attack\n\nPhishing is a technique in which the attacker\
    \ creates a fake login page to capture the user's password. On Wi-Fi networks,\
    \ this can be done by setting up a fake access point that asks for the original\
    \ network's password.\n\n# Password Cracking Tools\n\nThere are several specialized\
    \ tools for cracking Wi-Fi passwords, each with its specific characteristics and\
    \ uses.\n\n# Aircrack-ng\n\nAircrack-ng is one of the most popular tools for cracking\
    \ WEP and WPA/WPA2 passwords. It uses dictionary attack and brute force techniques\
    \ to try to guess the password.\n\nInstallation:\n\nbash\n\nsudo apt install aircrack-ng\n\
    \nWPA/WPA2 Password Cracking:\n\nbash\n\nsudo aircrack-ng -w wordlist.txt -b [BSSID]\
    \ capture-01.cap\n\nThis command uses a dictionary file (wordlist.txt) to try\
    \ to guess the password based on the captured handshake.\n\n# Hashcat\n\nHashcat\
    \ is a powerful password cracking tool that can use the GPU to significantly increase\
    \ cracking speed. Supports a wide range of hash algorithms, including WPA/WPA2.\n\
    \nInstallation:\n\nbash\n\nsudo apt install hashcat\n\nBasic Use:\n\nConverting\
    \ the handshake .cap for format Hashcat:\n\nbash\n\nhcxpcaptool -z capture.hccapx\
    \ capture-01.cap\n\nCracking the password:\n\nbash\n\nhashcat -m 2500 capture.hccapx\
    \ wordlist.txt\n\n# John the Ripper\n\nJohn the Ripper is another password cracking\
    \ tool that can be used for WPA/WPA2\\. Although most commonly used for password\
    \ hashes, it also supports WPA/WPA2.\n\nInstallation:\n\nbash\n\nsudo apt install\
    \ john\n\nBasic Use:\n\nConverting the handshake .cap for John format:\n\nbash\n\
    \nhcxpcaptool -o capture.john capture-01.cap\n\nCracking the password:\n\nbash\n\
    \njohn --wordlist=wordlist.txt capture.john\n\n# Brute Force and Dictionary Attacks\n\
    \nBrute force and dictionary attacks are two of the most common techniques used\
    \ to crack Wi-Fi passwords.\n\n# Brute Force Attacks\n\nIn brute force attacks,\
    \ the attacker tries every possible combination of characters until he finds the\
    \ correct password. This method is extremely time-consuming and resource-intensive,\
    \ especially for long and complex passwords.\n\nUso com Aircrack-ng:\n\nbash\n\
    \nsudo aircrack-ng -a2 -b [BSSID] -w brute-force-list.txt capture-01.cap\n\n●       Where\
    \ brute-force-list.txt is a file containing all possible combinations of passwords.\n\
    \n# Dictionary Attacks"
