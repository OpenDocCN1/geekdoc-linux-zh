    # Password Cracking Protection


    Protecting your Wi-Fi network from password cracking attacks is essential to maintaining
    security. Here are some best practices for securing your network.


    ## Strong and Complex Passwords

    Use long, complex passwords that include a combination of uppercase and lowercase
    letters, numbers, and special characters. Avoid using common words or personal
    information.


    Strong Password Example:


    ```

    3x@mpl3P@$$w0rd!

    ```


    ## Regularly updating passwords

    Change your passwords periodically to reduce the window of opportunity for an
    attacker.


    ## Using WPA3

    WPA3 offers significant security improvements compared to WPA2, including better
    protection against brute force attacks.


    - `WPA3 Configuration`: Access the router''s administration interface and change
    the security protocol to `WPA3`. If `WPA3` is not available, use `WPA2` with a
    strong password.


    ## Disabling WPS

    Disable Wi-Fi Protected Setup (`WPS`) on your router to prevent attacks that exploit
    this vulnerability.


    - `Disabling WPS`: Access the router''s administration interface and disable the
    `WPS` option.


    ## MAC Filtering

    Implement MAC address filtering to allow only authorized devices onto the network.


    - `MAC Filtering Configuration`: Access the router''s administration interface
    and configure MAC address filtering by adding the MAC addresses of authorized
    devices.


    ## Network Segmentation

    Segmenting the network can limit the impact of an attack by isolating different
    types of traffic and devices.


    - `Use of VLANs`: Configure `VLANs` on the router to isolate traffic from critical
    devices and general-purpose devices.


    ## Monitoring and Detection

    Implement monitoring systems to detect password cracking attempts and other suspicious
    activity.


    - `Use of IDS/IPS`: Tools like `Snort` or `Zeek` can be configured to monitor
    network traffic and alert you to suspicious activity, such as password cracking
    attempts.


    # Practical Examples of Password Cracking


    To illustrate how the tools and techniques discussed can be applied in practice,
    here are some examples of executing password cracking attacks.


    ## Handshake Capture with `Airodump-ng`


    Put the Interface in Monitor Mode:


