    取消认证攻击是一种用于破坏 Wi-Fi 网络上设备连接的常用技术。在本章中，你将探索这些攻击的基础、执行工具和方法，以及缓解和防御策略。书中包含了案例研究，以说明这些攻击在实践中是如何进行的。


    ## 第 5 章：Wi-Fi 密码破解

    破解 Wi-Fi 密码是任何网络安全专业人员的关键技能。本章涵盖了 Wi-Fi 密码攻击方法，包括暴力破解和字典攻击。你将学习如何使用特定的密码破解工具，并针对此类攻击实施有效的保护措施。


    ## 第 6 章：中间人攻击

    中间人 (`MITM`) 攻击允许攻击者拦截并可能更改网络上设备之间的通信。在本章中，你将发现如何在 Wi-Fi 网络上执行 `MITM` 攻击、使用哪些工具，以及如何防止和检测这些攻击。理解这些方法对于确保
    Wi-Fi 网络通信的完整性和机密性至关重要。


    ## 第 7 章：WPS 漏洞利用

