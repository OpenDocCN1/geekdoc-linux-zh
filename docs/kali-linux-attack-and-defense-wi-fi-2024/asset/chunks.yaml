- fmt: '

    Ensuring the security of a Wi-Fi network is essential to protect sensitive data
    and prevent unauthorized access. Below, we discuss best practices for basic Wi-Fi
    network security.


    # Setting Strong Passwords


    One of the simplest and most effective measures is to set strong passwords for
    accessing the Wi-Fi network. Strong passwords must be long, containing a combination
    of upper and lower case letters, numbers and special characters. Avoid using easily
    guessable information, such as names or dates of birth. Furthermore, it is recommended
    to change passwords periodically to increase security.


    # Use of Appropriate Security Protocols


    The use of security protocols such as `WPA2` or `WPA3` is essential. Configure
    your router to use the strongest security protocol available. Avoid using `WEP`
    as it is vulnerable to attacks. Ensure that all devices connected to the network
    support the chosen protocol to ensure compatibility and security.


    # Changing the Default SSID


    The `SSID` (Service Set Identifier) is the name of the Wi-Fi network. Changing
    the default `SSID` provided by the manufacturer can make it difficult for an attacker
    to identify the make and model of the router, which may have known vulnerabilities.
    Use a unique `SSID` and avoid names that reveal personal or company information.
    Additionally, consider hiding the `SSID` to reduce network visibility, although
    this does not provide significant protection against determined attacks.


    # WPS deactivation


    Wi-Fi Protected Setup (`WPS`) is a function that makes it easier to connect devices
    to the Wi-Fi network, but it also has significant vulnerabilities. Disabling `WPS`
    on your router can prevent attacks that exploit these vulnerabilities. Disabling
    `WPS` is a simple measure that can significantly increase network security.


    # Firmware Updates


    Keep your router''s firmware updated to ensure it has the latest security fixes
    and performance improvements. Check the manufacturer''s website regularly for
    updates and apply them as needed. Regular firmware maintenance is essential to
    protect the network against newly discovered threats and vulnerabilities.


    # Network Segmentation


    For greater security, consider network segmentation, creating separate networks
    for different types of devices. For example, a network for `IoT` (Internet of
    Things) devices can be isolated from the main network used by computers and smartphones.
    This limits exposure if an `IoT` device is compromised. Network segmentation can
    be implemented through `VLANs` (Virtual Local Area Networks) in advanced routers
    and switches.


    # Use of Firewalls


    Implementing firewalls can help protect your network from unwanted traffic and
    attacks. Most modern routers come with built-in firewalls that can be configured
    to add an extra layer of security. Configure firewall rules to block unused ports
    and protocols, as well as to allow only necessary traffic.


    # Network Monitoring


    Monitoring network activity can help you quickly detect and respond to suspicious
    activity. Use network monitoring tools to keep track of who is connected, identify
    unusual traffic patterns, and take preventative action when necessary. Tools like
    `Wireshark`, `NetFlow` and `SNMP` (Simple Network Management Protocol) are useful
    for this purpose.


    # Practical Scripts and Settings


    To complement the theory presented, this chapter includes examples of scripts
    and practical configurations that can be used to ensure the security of your Wi-Fi
    network.


    # Example Script for Packet Capture with Wireshark


    `Wireshark` is a powerful packet analysis tool that can be used to monitor network
    traffic. Below is an example of a basic packet capture script:


    ```bash

    #!/bin/bash


    # Script to capture network packets using Wireshark

    INTERFACE="wlan0" # Network interface to monitor


    OUTPUT_FILE="captura.pcap" # Output file


    echo "Starting packet capture on interface $INTERFACE..."


    sudo tshark -i $INTERFACE -w $OUTPUT_FILE


    echo "Capture completed. File saved as $OUTPUT_FILE"

    ```


    It is script use `tshark`, which is the command line version of `Wireshark`. To
    run this script, save it to a file, e.g. `captura.sh`, and make it executable
    with the command `chmod +x captura.sh`. Then run it with `sudo ./captura.sh`.


    # Firewall configuration with iptables


    `iptables` is a packet filtering tool used to configure firewall rules in Linux.
    The following is a basic configuration example to block all inbound traffic except
    `HTTP` (port 80) and `HTTPS` (port 443) traffic:


    ```bash

    #!/bin/bash


    # Script to configure basic firewall using iptables

    echo "Configuring firewall with iptables..."


    # Clear all existing rules

    sudo iptables -F


    # Configure default policies to block all incoming traffic

    sudo iptables -P INPUT DROP

    sudo iptables -P FORWARD DROP

    sudo iptables -P OUTPUT ACCEPT


    # Allow loopback traffic

    sudo iptables -A INPUT -i lo -j ACCEPT


    # Allow incoming traffic for already established connections

    sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    # Allow HTTP (port 80) and HTTPS (port 443) traffic

    sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT


    echo "Firewall configuration complete."

    ```


    Save this script to a file, e.g. `firewall.sh`, and make it executable with `chmod
    +x firewall.sh`. Then run it with `sudo ./firewall.sh` to apply firewall rules.


    This chapter has provided a comprehensive introduction to the fundamentals of
    Wi-Fi networks, covering everything from components and architecture to standards
    and protocols, as well as essential security practices. Understanding these concepts
    is crucial for any cybersecurity professional as they provide the foundation needed
    to protect wireless networks against threats.


    The sample scripts and practical configurations presented provide a practical
    approach to applying the concepts discussed. As you progress through this book,
    you will continue to build on these foundations by exploring more advanced Wi-Fi
    attack and defense techniques with `Kali Linux`.


    Deep understanding and practical application of this knowledge will allow you
    to excel in the field of cybersecurity, effectively protecting Wi-Fi networks
    in an increasingly digital and interconnected environment. Prepare yourself for
    an intense and rewarding journey, where each chapter will broaden your horizons
    and enhance your capabilities.


    # Chapter 2: Configuring the Kali Linux Environment


    ***


    # Kali Linux Installation and Configuration


    To start using `Kali Linux`, you need to install it correctly. `Kali Linux` is
    a Linux distribution specialized in penetration testing and security audits. It
    can be installed on physical machines, virtual machines or even mobile devices.


    # Download ISO Image


    The first step is to download the `Kali Linux` ISO image. Go to the official `Kali
    Linux` website (https://www.kali.org) and navigate to the downloads section. Choose
    the version that best suits your environment. There are options for different
    architectures (`x86`, `x64`, `ARM`) and installation methods (ISO image, `OVA`
    for virtualization, etc.).


    # Creating Installation Media


    After downloading the ISO image, create installation media. If you plan to install
    `Kali Linux` on a physical machine, use bootable USB creation software such as
    `Rufus` (Windows) or `Balena Etcher` (Windows, macOS, Linux). Insert an empty
    pendrive into your computer, open the chosen software and select the downloaded
    ISO image. Follow the instructions to create the bootable USB.


    # Installation on a Physical Machine


    Insert the pendrive into the computer where you want to install `Kali Linux` and
    restart the machine. During boot, access the boot menu (usually by pressing F12,
    `Esc`, or another key depending on the manufacturer) and select the pendrive as
    the boot device. When the `Kali Linux` installer loads, follow the installation
    wizard steps:


    1. Choose the language.

    2. Configure the keyboard layout.

    3. Configure the network (optional).

    4. Create a user and set a password.

