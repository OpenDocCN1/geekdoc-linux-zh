    确保 Wi-Fi 网络的安全性对于保护敏感数据和防止未经授权的访问关重要。下面，我们将讨论基础 Wi-Fi 网络安全的最佳实践。


    # 设置强密码


    最简单且有效的措施之一是为访问 Wi-Fi 网络设置强密码。强密码必须足够长，并包含大小写字母、数字和特殊字符的组合。避免使用易猜的信息，如姓名或出生日期。此外，建议定期更改密码以增加安全性。


    # 使用适当的安全协议


    使用如 `WPA2` 或 `WPA3` 等安全协议至关重要。配置您的路由器使用可用的的最强安全协议。避免使用 `WEP`，因为它容易受到攻击。确保连接到网络的所有设备都支持所选的协议，以确保兼容性和安全性。


    # 修改默认 SSID


    `SSID`（服务集标识符）是 Wi-Fi 网络的名称。更改制造商提供的默认 `SSID` 可以让攻击者难以识别路由器的品牌和型号，这些型号可能存在已知漏洞。使用唯一的
    `SSID` 并避免使用暴露个人或公司信息的名称。此外，可以考虑隐藏 `SSID` 以降低网络可见性，尽管这无法针对坚定的攻击提供显著保护。


    # 禁用 WPS


    Wi-Fi 保护设置 (`WPS`) 是一项让设备连接到 Wi-Fi 网络更方便的功能，但它存在巨大的漏洞。在路由器上禁用 `WPS` 可以防止利用这些漏洞的攻击。禁用
    `WPS` 是一个简单的措施，可以显著提高网络安全性。


    # 固件更新


    保持路由器固件更新，以确保其具有最新的安全修复和性能改进。定期检查制造商网站的更新并根据需要进行安装。定期的固件维护对于保护网络免受新的威胁和漏洞至关重要。


    # 网络分段


    为了更高的安全性，请考虑网络分段，为不同类型的设备创建独立的网络。例如，用于 `IoT`（物联网）设备的网络可以与计算机和智能手机使用的主网络隔离开。如果
    `IoT` 设备被攻破，这将限制暴露。网络分段可以通过高级路由器和交换机中的 `VLANs`（虚拟局域网）来实现。


    # 使用防火墙


    实施防火墙可以帮助保护您的网络免受意外流量和攻击。大多数现代路由器都带有内置防火墙，可以进行配置以增加额外的安全层。配置防火墙规则以阻塞未使用的端口和协议，并仅允许必要的流量。


    # 网络监控


    监控网络活动可以帮助您快速检测并响应可疑活动。使用网络监控工具跟踪连接情况，识别异常的流量模式，并在需要时采取预防措施。诸如 `Wireshark`、`NetFlow`
    和 `SNMP`（简单网络管理协议）等工具为此目的很有用。


    # 实用脚本与设置


    为了补充所介绍的理论，本章包含了示例脚本和实际配置，可用于确保 Wi-Fi 网络的安全性。


    # 使用 Wireshark 进行数据包的示例脚本


    `Wireshark` 是一个强大的包分析工具，用于监控网络流量。以下是一个基础抓包脚本示例：


    ```bash

    #!/bin/bash


    # 使用 Wireshark 捕获网络包的脚本

    INTERFACE="wlan0" # 要监控的网络接口


    OUTPUT_FILE="captura.pcap" # 输出文件


    echo "Starting packet capture on interface $INTERFACE..."


    sudo tshark -i $INTERFACE -w $OUTPUT_FILE


    echo "Capture completed. File saved as $OUTPUT_FILE"

    ```


    该脚本使用了 `tshark`，它是 `Wireshark` 的命令行版本。要运行此脚本，请将其保存为文件（例如 `captura.sh`），并使用命令 `chmod
    +x captura.sh` 赋予可执行权限。然后使用 `sudo ./captura.sh` 运行。


    # 使用 iptables 配置防火墙


    `iptables` 是用于在 Linux 中配置防火墙规则的包过滤工具。这是一个基础配置示例，用于阻塞除 `HTTP`（端口 80）和 `HTTPS`（端口
    443）以外的所有入站流量：


    ```bash

    #!/bin/bash


    # 使用 iptables 配置基础防火墙的脚本

    echo "Configuring firewall with iptables..."


    # 清除所有现有规则

    sudo iptables -F


    # 配置默认策略阻塞所有入站流量

    sudo iptables -P INPUT DROP

    sudo iptables FORWARD DROP

    sudo iptables -P OUTPUT ACCEPT


    # 允许回环流量

    sudo iptables -A INPUT -i lo -j ACCEPT


    # 允许已建立连接的入站流量

    sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    # 允许 HTTP (端口 80) 和 HTTPS (端口 443) 流量

    sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT


    echo "Firewall configuration complete."

    ```


    将此脚本保存为文件（例如 `firewall.sh`），并使用 `chmod +x firewall.sh` 赋予可执行权限。然后运行 `sudo ./firewall.sh`
    应用防火墙规则。


    本章对 Wi-Fi 网络基础进行了全面介绍，涵盖了从组件、架构到标准协议的所有内容，以及基本的安全实践。理解这些概念对于任何网络安全专业人员来说至关重要，因为它们提供了保护无线网络免受威胁的基础。


    提供的示例脚本和实际配置提供了一种应用所讨论概念的实用方法。随着学习深入，你将继续通过 `Kali Linux` 探索更高级的 Wi-Fi 攻击和防御技术，在这些基础的基础上不断进步。


    深入理解并实际应用这些知识将使你在网络安全领域脱而出，在日益数字化和互联的环境中有效保护 Wi-Fi 网络。准备好迎接一段密集且富有回报的旅程，每一章都将开宽你的视野并增强你的能力。


    # 第 2 章：配置 Kali Linux 环境


    ***


    # Kali Linux 安装与配置


    要开始使用 `Kali Linux`，你需要正确安装它。`Kali Linux` 是一个专门用于渗透测试和安全审计的 Linux 发行版。它可以安装在物理机、虚拟机甚至移动设备上。


    # 下载 ISO 镜像


    第一步是下载 `Kali Linux` ISO 镜像。访问 `Kali Linux` 官网 (https://www.kali.org) 并进入下载部分。选择最适合你环境的版本。提供不同的架构（`x86`,
    `x64`, `ARM`）和不同的安装方法（ISO 镜像、用于虚拟化的 `OVA` 等）。


    # 创建安装媒体


    下载 ISO 镜像后，创建安装媒体。如果你计划在物理机上安装 `Kali Linux`，请使用启动 USB 制作软件，如 `Rufus`（Windows）或
    `Balena Etcher`（Windows, macOS, Linux）。将一个空 U 盘插入电脑，打开选定的软件并选择下载的 ISO 镜像。按照指令创建启动
    USB。


    # 在物理机上安装


    将 U 盘插入想要安装 `Kali Linux` 的电脑并重启机器。在启动期间，进入启动菜单（通常按 F12、`Esc` 或取决于制造商的其他键），并选择
    U 盘作为启动设备。当 `Kali Linux` 安装程序加载时，按照安装向导步骤操作：


    1. 选择语言。

    2. 配置键盘布局。

    3. 配置网络（可选）。

    4. 创建用户并设置密码。


