    Analyze the Capture in Wireshark: Open Wireshark and upload the file capture.pcap
    for detailed analysis.


    # Implementing HTTPS on a Web Server


    1.  Obtaining an SSL/TLS Certificate: Use Let''s Encrypt to get a free certificate.


    Instalar Certbot:


    bash


    sudo apt install certbot


    Get Certificate:


    bash


    sudo certbot --apache


    2.  Web Server Configuration: Configure the web server (Apache, Nginx) to use
    the obtained SSL/TLS certificate.


    # VPN Configuration


    1.  Choose a VPN Service: Sign up for a reliable VPN service like NordVPN or ExpressVPN.


    2.  Install the VPN Client: Follow your VPN provider''s instructions to install
