    # Wi-Fi 网络分析是网络安全中的关键组成部分。为了理解网络漏洞和行为，使用允许捕获和分析数据包的专用工具至关重要。在本章中，我们将探索一些分析 Wi-Fi
    网络的最有效工具。


    ## Wireshark


    Wireshark 是最强大且最常用的包分析工具之一。它允许你实时捕获并与网络流量进行交互，提供了一个直观的图形界面来可视化捕获的数据。


    ### 安装


    ```bash

    sudo apt install wireshark

    ```


    ### 基本用法


    以超级用户权限启动 `Wireshark`:


    ```bash

    sudo wireshark

    ```


    1. 选择要捕获的网络接口。

    2. 点击捕获按钮开始监控流量。

    3. 使用可用过滤器分析捕获的数据包，以关注特定数据。


    ## Aircrack-ng


    Aircrack-ng 是一个用于 Wi-Fi 安全审计的工具集。它包含了包捕获、包注入、取消认证攻击等工具。


    ### 安装


    ```bash

    sudo apt install aircrack-ng

    ```


    ### 包含的工具


    - `airodump-ng`: 捕获网络数据包。

    - `airplay-ng`: 包注入和取消认证攻击。

    - `aircrack-ng`: 破解 WEP 和 WPA 密码。

    - `airmon-ng`: 将网络接口设置为监听模式。


    ## kismet


    Kismet 是一种无线网络检测工具，以被动模式工作，允许在不主动传输的情况下检测隐藏网络并捕获数据包。


    ### 安装


    ```bash

    sudo apt install kismet

    ```


    ### 基本用法


    启动 `Kismet`:


    ```bash

    sudo kismet

    ```


    - 配置网络接口并开始网络发现。

    - 查看并分析检测到的网络和捕获的数据包。


    ## Fern WiFi Cracker


    Fern WiFi Cracker 是一个用于 Wi-Fi 安全审计的图形化工具。它支持 WEP、WPA 和 WPS 攻击。


    ### 安装


    ```bash

    sudo apt install fern-wifi-cracker

    ```


    ### 基本用法


    启动 `Fern WiFi Cracker`:


    ```bash

    sudo fern-wifi-cracker

    ```


    - 选择网络接口并开始扫描网络。

    - 使用图形界面对选定的网络执行攻击。


    ## 数据包捕获与解释


    捕获和解释数据包是任何 Wi-Fi 网络安全分析师的基本技能。接下来，我们将查看如何使用上述工具捕获数据包以及如何解释捕获的数据。


    ### 使用 Aircrack-ng 捕获包


    监听模式：为了捕获数据包，首先将网络接口设置为监听模式。


    ```bash

    sudo airmon-ng start wlan0

    ```


    使用 Airodump-ng 捕获：使用 `airodump-ng` 从特定网络捕获数据包。


    ```bash

    sudo airodump wlan0mon

    ```


    要关注特定网络，使用 `channel` 和 `BSSID` 参数：


    ```bash

    sudo airodump-ng -c [canal] --bssid [BSSID] -w capture wlan0mon

    ```


    ### 使用 Wireshark 捕获包


    开始捕获：


    1. 以超级用户权限启动 `Wireshark`。

    2. 选择要捕获的网络接口。

    3. 点击捕获按钮开始监控流量。


    包过滤：使用过滤器关注特定的数据包。例如，仅过滤 HTTP 数据包：


    ```text

    http

    ```


    ### 数据包解释


    一旦捕获了数据包，下一步就是解释数据以识别模式和漏洞。


    - `MAC addresses`：网络上的每个设备都有唯一的 `MAC address`。识别连接设备的 `MAC addresses` 有助于映射网络结构。

    - `Protocols`：不同的协议用于不同类型的通信。分析协议可以揭示有关网络流量类型的信息。

    - `Packet Analysis`：检查单个数据包以理解其内容和结构。这可能包括对包头、传输数据和控制标志的分析。


    ## 模式与漏洞的识别


    识别 Wi-Fi 网络中的模式和漏洞对于评估其安全性至关重要。使用包捕获工具和技术，我们可以分析网络流量以寻找弱和可疑模式。


    ### 流量分析


    流量分析涉及检查捕获的数据包以识别通信模式。这可能包括：


    - 流量负载：监控流量可以帮助识别活动激峰，这可能与攻击或异常行为有关。

    - 流量类型：不同类型的流量可以指示不同类型的活动。例如，`HTTP` 流量可能与网页浏览有关，而 `FTP` 流量可能指示文件传输。

    - 设备行为：分析连接设备的行为可以帮助识别受损或可疑设备。这可能包括监控取消认证和重新连接的频率。


    ### 漏洞识别


    识别网络中的漏洞是提高安全性的关键步骤。这可能包括：


    - 弱密码：分析身份验证数据包可以揭示弱或容易猜的密码。可以使用 `Aircrack-ng` 等工具尝试破解 `WPA`/WPA2` 密码。

    - 不安全的协议：识别对不安全协议（如 `WEP`）的使用可以揭示网络安全的弱点。

    - 安全设置不足：检查 `AP` 的安全设置（例如使用 `WPA/WPA2` 并禁用 `WPS`），有助于识别需要纠正的不当设置。


    ## 分析报告


    在捕获和分析网络数据包后，在详细报告中记录你的至关重要。网络分析报告应该包含所有关于识别出的模式和漏洞的相关信息，以及改进建议。


    ### 报告结构


    Wi-Fi 网络分析报告应遵循清晰简洁的结构：


    - 引言：描述分析范围和测试目标。包括有关测试环境的信息，例如网络配置和涉及的设备。

    - 方法论：详细说明用于捕获和分析数据包的工具和技术。包括分析过程中遵循的特定 `commands` 和流程。

    - 结果：以清晰、组织的方式展示发现。使用表格和图表来可视化捕获的数据。突出显示识别出的模式和漏洞。

    - 建议：提供缓解已识别漏洞的详细建议。这可能包括更新密码、配置更强的安全协议以及实施安全最佳实践。


    ### 报告示例


    以下是 Wi-Fi 网络分析的报告结构示例：


    #### 引言


    本报告详细说明了 "NetworkName" Wi-Fi 网络的安全性分析。该分析旨在识别漏洞并为提高网络安全提供建议。


    #### 方法论


    使用以下工具和技术进行分析：


    - `Wireshark` 用于包捕获和分析。

    - `Aircrack-ng` 用于安全审计和密码破解。

    - `Kismet` 用于网络检测和被动捕获。


    #### 结果


    流量负载

    - 在 24 小时内监控了流量。在下午 6 点到 8 点之间观察到活动高峰，对应于用户使用最频繁的时间段。


    流量类型

    - 分析显示大部分流量是 `HTTP` 和 `HTTPS`，表明正在进行浏览和使用在线服务。发现了零星的 `FTP` 流量，这可能与文件传输有关。


    设备行为

    - 分析了连接设备的行为。观察到 `MAC address` 为 `xx:xx:xx:xx:xx` 的设备显示出取消认证和频繁重新连接的模式，暗示可能攻击尝试。


    识别出的漏洞

    - 弱密码：对身份验证数据包的分析显示网络密码很弱且容易被破解。

    - 不安全的协议：在备用网络上发现了 `WEP` 协议的使用，该协议已知存在漏洞。

    - 安全配置不足：分析显示 `AP` 开启 `WPS`，构成了重大的安全风险。


    #### 建议


