    Wi-Fi 安全方法。


    ## 第 15 章：在 Wi-Fi 测试中使用脚本和自动化

    Wi-Fi 测试自动化可以显著提高你的效率和准确性。在本章中，你将学习开发自定义脚本来自动化 Wi-Fi 安全测试。书中提供了自动化脚本示例，并讨论了网络安全中自动化的优势和挑战。


    ## 第 16 章：Wi-Fi 攻击中的社会工程技术

    社会工程是一种强大的技术，可以与技术攻击结合使用来破坏 Wi-Fi 网络的安全。本章探索了社会工程方法和工具、真实的攻击案例以及针对社会工程的防御措施。理解这些技术对于采取全面的
    Wi-Fi 安全方法至关重要。


    ## 第 17 章：IoT 与 Wi-Fi 安全

    随着物联网 (`IoT`) 的增长，连接 IoT 设备的 Wi-Fi 网络安全变得更加关键。本章涵盖了 IoT 安全挑战、常见漏洞以及 IoT 设备的测试工具。书中还提供了如何保护你
    Wi-Fi 网络上 IoT 设备的技巧。


    ## 第 18 章：Wi-Fi 安全技能培养

