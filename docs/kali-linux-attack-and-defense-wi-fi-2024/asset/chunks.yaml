  trans: "\n\n# 尾随（Tailgating）\n\n尾随是指跟随已授权的人员进入限制区域的行为，而其本人并没有适当的授权。在 Wi-Fi 语境下，这可能涉及物理访问安全区域，以获取有关网络的信息。\n\
    \n- 尾随示例：跟随公司员工进入 IT 部门，并借此机会获取网络或设备信息。\n\n# 社会工程的真实案例\n\n研究社会工程攻击的真实案例有助于你理解这些技术在实践中是如何应用的，并从被利用的安全漏洞中汲取教训。\n\
    \n## 案例 1：科技公司的钓鱼攻击\n\n**背景：** 一家大型科技公司成为钓鱼攻击的目标，攻击者发送了看似来自互联网服务提供商的假邮件。这些邮件要求员工确认其\
    \ Wi-Fi 凭据。\n\n**攻击执行：**\n\n- 邮件包含一个指向虚假登录页的链接，用于捕员工的凭据。\n- 攻击者使用这些凭据访问公司的 Wi-Fi\
    \ 网络。\n\n**后果：**\n\n- 未经授权访问公司内部网络。\n- 窃取机密信息和企业数据。\n\n**教训：**\n\n- 对员工实施钓鱼意识培训。\n\
    - 为 Wi-Fi 网络访问使用双重身份认证 (`2FA`）。\n\n## 案例 2：银行的假装（Pretexting）\n\n**背景：** 一家银行成为假装攻击的目标，攻击者冒充\
    \ IT 支持技术人员致电几名员工，请求 Wi-Fi 网络配置的信息。\n\n**攻击执行：**\n\n- 攻击者收集了网络配置的详细信息，包括 `SSIDs`、密码和\
    \ `IP addresses`。\n- 使用这些信息未经授权访问银行的 Wi-Fi 网络。\n\n**后果：**\n\n- 破坏银行网络的安全性。\n-\
    \ 访问财务数据和客户信息。\n\n**教训：**\n\n- 验证任何请求机密信息人员的身份。\n- 实施严格的信息访问控制策略。\n\n## 案例 3：咖啡馆的诱饵（Baiting）\n\
    \n**背景：** 攻击者在热门咖啡馆设置了一个虚假的 Wi-Fi 热点，并使用了吸引人的 `SSID`，如“Free Wi-Fi”。登录的用户被要求使用邮箱凭据注册。\n\
    \n**攻击执行：**\n\n- 注册的用户提供了邮箱凭据，这些凭据被攻击者捕获。\n- 攻击者使用这些凭据访问邮箱账户并进行恶意活动。\n\n**后果：**\n\
    \n- 用户邮箱账户泄露。\n- 潜在的身份盗用和个人信息访问。\n\n**教训：**\n\n- 避免连接到未知或不安全的 Wi-Fi 网络。\n- 使用公共\
    \ Wi-Fi 时使用 `VPNs` 来保护网络流量。\n\n# 防御社会工程\n\n防范社会工程攻击涉及培训、安全策略和技术工具的结合。以下我们讨论了缓解此类攻击的有效策略。\n\
    \n## 意识培训\n\n教育用户了解社会工程的风险以及如何识别尝试性的攻击对于防御至关重要。\n\n- **培训计划：** 实施定期培训计划，教员工如何识别和应对社会工程尝试。\n\
    - **钓鱼模拟：** 进行钓鱼模拟以测试员工的准备情况并强化培训效果。\n\n## 安全策略\n\n建立严格的安全策略有助于防止机密信息的泄露。\n\n\
    - **身份验证：** 实施程序以验证任何请求敏感信息（如网络密码或 Wi-Fi 设置）人员的身份。\n- **双重身份认证 (`2FA`)：** 为所有\
    \ Wi-Fi 网络访问账户和其他关键系统使用 `2FA`。\n\n## 技术工具\n\n使用技术工具监控并保护网络免受社会工程尝试的侵害是一种有效的防御方法。\n\
    \n- **邮件过滤器：** 实施高级邮件过滤器以检测并拦截钓鱼尝试。\n- **入侵检测系统 (`IDS`)：** 使用 `IDS` 监控网络流量并识别可能表明社会工程攻击的可疑活动。\n\
    \n# 执行与防御的实际示例\n\n### 钓鱼意识培训\n\n1. **培训计划：**\n   - 开发培训模块，教员工如何识别钓鱼邮件和其他社会工程尝试。\n\
    \   - 针对所有员工进行定期且强制性的培训课程。\n2. **钓鱼模拟：**\n   - 向员工发送模拟钓鱼邮件以测试他们的准备情况。\n   - 评估结果并提供反馈以强化培训。\n\
    \n### 身份验证策略的实施\n\n1. **验证程序：**\n   - 建立程序以验证任何请求机密信息人员的身份。\n   - 要求多个验证因素，例如密码和安全问题。\n\
    2. **访问控制策略：**\n   - 定义并实施基于角色的访问控制，限制对机密信息的访问。\n\n### 使用技术工具进行防御\n\n1. **邮件过滤器：**\n\
    \   - 实施使用行为分析和机器学习的高级邮件过滤器来检测并拦截钓鱼尝试。\n2. **入侵检测系统 (`IDS`)：**\n   - 配置 `IDS`\
    \ 监控网络流量并生成可疑活动的警报。\n   - 使用 `Snort` 或 `Zeek` 等工具进行持续流量分析。\n\n社会工程技术对 Wi-Fi 网络安全构成了重大威胁，它们利用人类弱点而非技术缺陷。钓鱼、假装、诱饵和尾随等方法被用于欺骗个人并获取机密信息。防御这些攻击涉及意识培训、严格的安全策略和技术工具的使用。实施这些策略有助于降低社会工程相关的风险，并保护无线通信的完整性和机密性。\n\
    \n# 第 17 章：IoT 与 Wi-Fi 安全\n\n# IoT 安全挑战\n\n物联网 (`IoT`) 将大量设备连接到互联网，允许它们收集并共享数据。这些设备包括从恒温器、摄像头到联网汽车和工业设备。虽然\
    \ `IoT` 提供了许多优势，但也引入了一些安全挑战，特别是当连接到 Wi-Fi 网络时。\n\n# 复杂性与多样性\n\n`IoT` 设备的多样性（每个设备具有不同的处理能力、操作系统和安全需求）使得管理和保护这些网络变得复杂。\n\
    \n- **异构设备：** 从简单的传感器到复杂的控制系统不等。\n- **不同的操作系统：** 它们可以运行私有系统、修改过的 `Linux` 版本或其他系统。\n\
    - **不同的安全需求：** 设备可能不支持高级加密或频繁的安全更新。\n\n# 硬件限制\n\n许多 `IoT` 设备的硬件资源有限，这可能会限制强力安全措施的实施。\n\
    \n- **处理能力：** 低功耗处理器可能不支持强加密。\n- **存储限制：** 存储空间减少可能导致无法安装补丁。\n- **能量限制：** 电池供电设备可能有电源限制，限制了安全密集型过程的运行。\n\
    \n# 缺乏标准化\n\n`IoT` 设备之间通信和安全协议缺乏标准化增加了保护这些网络的复杂性。\n\n- **私有协议：** 许多设备使用私有通信协议。\n\
    - **互操作性：** 确保来自不同制造商的设备安全运行是一项挑战。\n\n# 常见漏洞\n\n"
- fmt: "\nIoT devices are often subject to various vulnerabilities that can be exploited\
    \ by attackers to compromise Wi-Fi network security.\n\n# Default Passwords\n\n\
    Many IoT devices come with factory default passwords that are not changed by users,\
    \ making unauthorized access easier.\n\nExample of Default Passwords:\n\n```text\n\
    admin/admin\nuser/user\n```\n\n# Lack of Encryption\n\nSome IoT devices transmit\
    \ data unencrypted or use weak encryption, exposing them to interception and manipulation.\n\
    \nExample of Unencrypted Traffic:\n\n```text\nGET /data HTTP/1.1\nHost: device.local\n\
    ```\n\n# Infrequent Firmware Updates\n\nMany IoT devices do not receive regular\
    \ firmware updates, leaving known vulnerabilities unpatched.\n\n- Common Problems:\n\
    \  - Outdated Firmware: Devices with outdated firmware are easy targets.\n  -\
    \ Lack of Support: Some manufacturers do not provide ongoing support for security\
    \ updates.\n\n# Exhibition of Doors and Services\n\nIoT devices often have unnecessary\
    \ ports and services open, which can be exploited by attackers.\n\nExample of\
    \ Open Doors:\n\n```text\nPort 23 (Telnet)\nPorta 80 (HTTP)\n```\n\n# IoT Testing\
    \ Tools\n\nTesting the security of IoT devices requires the use of specialized\
    \ tools that can identify and exploit vulnerabilities specific to these devices.\n\
    \n## Nmap\n\nNmap is a tool that can be used to identify connected IoT devices\
    \ and check open ports and services.\n\nInstallation:\n\n```bash\nsudo apt install\
    \ nmap\n```\n\nBasic Use:\n\n```bash\nsudo nmap -sP 192.168.1.0/24\n```\n\nThis\
    \ command identifies all devices connected to the network.\n\nPort Scan:\n\n```bash\n\
    sudo nmap -sV 192.168.1.100\n```\n\nThis command checks open ports and services\
    \ on a specific device.\n\n## Wireshark\n\nWireshark is a tool that can be used\
    \ to capture and analyze network traffic from IoT devices.\n\nInstallation:\n\n\
    ```bash\nsudo apt install wireshark\n```\n\nBasic Use:\n\nStart Wireshark with\
    \ superuser privileges:\n\n```bash\nsudo wireshark\n```\n\nSelect the network\
    \ interface and start packet capture.\n\nUse filters to focus on specific types\
    \ of traffic, for example:\n\n```text\nip.addr == 192.168.1.100\n```\n\n# Shodan\n\
    \nShodan is a search engine for internet-connected devices that can be used to\
    \ identify vulnerable IoT devices.\n\n- Access to Shodan: Access Shodan via browser\
    \ at `shodan.io`.\n- Basic Search:\n  Search for specific devices, like security\
    \ cameras or thermostats:\n\n```text\ncamera country:\"US\"\n```\n\n# IoT Inspector\n\
    \nIoT Inspector is a security analysis tool that can be used to check vulnerabilities\
    \ in IoT devices.\n\n- Installation: Download and install IoT Inspector from the\
    \ official website.\n- Basic Use:\n  - Connect the IoT device to IoT Inspector.\n\
    \  - Launch a scan to identify vulnerabilities and insecure configurations.\n\n\
    # Securing IoT Devices\n\nSecuring IoT devices requires implementing several security\
    \ practices to mitigate risks and secure the Wi-Fi network.\n\n## Changing Default\
    \ Passwords\n\nChanging default passwords to strong, unique passwords is one of\
    \ the most important measures to secure IoT devices.\n\nStrong Password Example:\n\
    \n```text\nComplex@Password123!\n```\n\n# Use of Cryptography\n\nEnsuring that\
    \ all data transmitted by IoT devices is encrypted helps protect against interception\
    \ and manipulation.\n\n- HTTPS Configuration: Ensure IoT devices use `HTTPS` for\
    \ secure communications.\n- Use of VPNs: Implement `VPNs` for IoT devices that\
    \ transmit sensitive data.\n\n# Regular Firmware Updates\n\nKeeping the firmware\
    \ of IoT devices up to date is crucial for patching known vulnerabilities.\n\n\
    - Update Procedure:\n  1. Regularly check the manufacturer's website for firmware\
    \ updates.\n  2. Download and install the latest firmware following the manufacturer's\
    \ instructions.\n  3. Configure devices to automatically check for updates if\
    \ available.\n\n# IoT Device Isolation\n\nIsolating IoT devices on a separate\
    \ network helps protect the main network and other devices.\n\n- VLAN configuration:\
    \ Configure `VLANs` on the router and switches to isolate IoT devices from critical\
    \ devices and the main network.\n- Guest Networks: Use guest networks for IoT\
    \ devices that do not need to communicate with the main network.\n\n# Continuous\
    \ Monitoring\n\nImplementing continuous monitoring systems can help detect suspicious\
    \ activity and quickly respond to security incidents.\n\n- Use of IDS/IPS: Tools\
    \ like `Snort` or `Zeek` can be configured to monitor IoT device traffic and alert\
    \ on suspicious activity.\n\nSnort Configuration:\n\n```bash\nsudo apt install\
    \ snort\n```\n\n- Configure `Snort` to monitor IoT device traffic and generate\
    \ alerts about anomalous activity.\n\n# Practical Examples of Execution and Defense\n\
    \n## Changing Default Passwords\n\n1. Login no IoT Device:\n   - Access the IoT\
    \ device administration interface via browser.\n   - Use default credentials to\
    \ log in.\n2. Change password:\n   - Navigate to security settings.\n   - Change\
    \ the default password to a strong, unique password.\n   - Save the settings and\
    \ log out.\n\n## Encryption Configuration\n\n1. HTTPS Configuration:\n   - Access\
    \ the IoT device administration interface.\n   - Navigate to Network or Security\
    \ settings.\n   - Enable `HTTPS` for secure communications.\n   - Install an `SSL/TLS`\
    \ certificate if necessary.\n2. Using VPN:\n   - Configure a `VPN` server on your\
    \ network.\n   - Configure the IoT device to connect to the `VPN` server.\n  \
    \ - Verify that all IoT device traffic is encrypted by the `VPN`.\n\n## Firmware\
    \ Update\n\n1. Checking for Updates:\n   - Go to the manufacturer's website for\
    \ firmware updates.\n   - Check the support section for firmware updates.\n2.\
    \ Installing:\n   - Download and install the latest firmware following the manufacturer's\
    \ instructions.\n   - Access the IoT device administration interface.\n   - Navigate\
    \ to Firmware Update.\n- Configure devices to automatically check for updates\
    \ if available.\n   - Upload and install the update.\n\n# IoT Device Isolation\n\
    \n1. VLAN configuration:\n   - Configure `VLANs` on the router and switches to\
    \ isolate IoT devices from critical devices and the main network.\n   - Access\
    \ the router or switch.\n   - Create a separate VLAN for IoT devices.\n2. Guest\
    \ Networks:\n   - Use guest networks for IoT devices that do not need to communicate\
    \ with the main network.\n   - Access the router's administration interface.\n\
    \   - Create a separate guest network.\n\n# Continuous Monitoring with Snort\n\
    \n```bash\nsudo apt install snort\n\n- Configure `Snort` to monitor IoT device\
    \ traffic and generate alerts about anomalous activity.\n"
