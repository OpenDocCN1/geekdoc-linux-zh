    devices or systems. This technique can be used for various malicious purposes,
    such as redirecting network traffic, carrying out denial of service (DoS) attacks,
    or carrying out man-in-the-middle (MITM) attacks.


    ●       Common Types of Spoofing:


    ○       IP Spoofing: Sending packets with a spoofed source IP address.


    ○       MAC Spoofing: Spoofing a device''s MAC address.


    ○       DNS Spoofing: Redirect DNS queries to malicious servers.


    # Sniffing and Spoofing Tools


    There are several tools available to perform packet sniffing and spoofing. Below
    we discuss some of the most popular and effective ones.


    # Wireshark


    Wireshark is a powerful packet analysis tool, widely used for network sniffing.
    Allows you to capture and visualize packages in real time, offering an intuitive
    graphical interface for detailed analysis.


    Installation:


    bash


    sudo apt install wireshark


    Basic Use:


    Start Wireshark with superuser privileges:


    bash


    sudo wireshark


    Select the network interface and start packet capture.


    Use filters to focus on specific types of traffic, for example:


    text


    http


    # Tcpdump


    Tcpdump is a command-line tool for capturing packets. It is useful for quick captures
    and basic network traffic analysis.


    Installation:


    bash


    sudo apt install tcpdump


    Basic Use:


    Start packet capture on the specified network interface:


    bash


    sudo tcpdump -i wlan0


    To save the capture to a file for later analysis:


    bash


    sudo tcpdump -i wlan0 -w captura.pcap


    # Ettercap


    Ettercap is a comprehensive tool for MITM attacks, including packet sniffing and
    spoofing. Supports various attack techniques such as ARP spoofing and DNS spoofing.


    Installation:


    bash


    sudo apt install ettercap-graphical


    Basic Use:


    Start Ettercap in graphical mode:


    bash


    sudo ettercap -G


    1.  Select the network interface and start sniffing.


    2.  Configure spoofing attacks, such as ARP spoofing, to redirect network traffic.


    # Scapy


    Scapy is a powerful package manipulation library in Python. It can be used to
    create custom scripts for packet sniffing and spoofing.


    Installation:


    bash


    sudo apt install python3-scapy


    Example of the sniffing script:


    python


    from scapy.all import *


