    5. Partition the disk (it is recommended to use the guided option for beginners).


    6. Install the system and GRUB bootloader.


    # Installation on a Virtual Machine


    If you choose to install Kali Linux on a virtual machine, use virtualization software
    such as VirtualBox or VMware. Create a new virtual machine, select the Kali Linux
    ISO image as the boot disk, and configure the virtual machine with at least 2
    GB of RAM and 20 GB of disk space. Follow the same installation wizard steps described
    previously.


    # First Startup and Basic Settings


    After installation, restart the system and log in with the created credentials.
    The first boot may take a while as the system configures some packages and services.
    After logging in, it is important to update the system and repositories.


    ```bash

    sudo apt update

    sudo apt upgrade -y

    ```


    These `commands` ensure that all packages are updated with the latest security
    and functionality versions.


    # Essential Wi-Fi Testing Tools


    Kali Linux comes with a wide range of pre-installed tools for penetration testing.
    However, some tools are essential for Wi-Fi testing.


    ## Aircrack-ng


    Aircrack-ng is a suite of tools for evaluating the security of Wi-Fi networks.
    It includes tools for capturing packets, injecting packets, performing deauthentication
    attacks, and more.


    ```bash

    sudo apt install aircrack-ng

    ```


    After installation, you can use commands like `airodump-ng` to capture packets
    and `aircrack-ng` to crack WEP/WPA passwords.


    ## Reaver


    Reaver is a tool for attacking WPS-protected Wi-Fi-networks. It uses brute force
    attacks to guess the WPS PIN, which can be used to recover the WPA/WPA2 password.


    ```bash

    sudo apt install reaver

    ```


    To use `Reaver`, start with the command `reaver -i [interface] -b [BSSID] -vv`.


    ## Wireshark


    WiShark is a packet analysis tool that allows you to capture and interact with
    network traffic in real time. It is useful for deep packet inspection and traffic
    analysis.


    ```bash

    sudo apt install wireshark

    ```


    Start Wireshark with `sudo wireshark` and select the network interface to begin
    packet capture.


    ## Fern WiFi Cracker


    Fern WiFi Cracker is a graphical tool for auditing and recovering keys in wireless
    networks. Supports WEP/WPA/WPS attacks.


    ```bash

    sudo apt install fern-wifi-cracker

    ```


    Start with `sudo fern-wifi-cracker` and follow the graphical interface to perform
    security audits.


    # System Update and Maintenance


    Keeping Kali Linux updated is crucial to ensure the security and correct functioning
    of the tools. In addition to regular system updates, it is important to carry
    out periodic maintenance.


    ## System Updates


    Check and apply updates regularly with the following commands:


    ```bash

    sudo apt update

    sudo apt upgrade -y

    sudo apt dist-upgrade -y

    ```


    The command `dist-upgrade` ensures that all dependencies and packages are updated
    correctly, even if new versions require system configuration changes.


    ## Package Cleaning


    Remove unnecessary packages and clear system cache to free up disk space:


    ```bash

    sudo apt autoremove -y

    sudo apt clean

    sudo apt autoclean

    ```


    These commands remove obsolete packages and temporary files that are no longer
    needed.


    ## Backup Regular


    Perform regular backups of important files and settings. Use tools like `rsync`
    or automatic backup solutions to ensure you can restore your system quickly in
    case of failures.


    ```bash

    rsync -av --progress /home/user /media/backup/

    ```


    This command makes a backup of the directory `/home/user` to a backup device mounted
    on `/media/backup/`.


    # Tips for a Safe Testing Environment


    When setting up a test environment for Wi-Fi networks, it is important to ensure
    the environment is secure and isolated to avoid interference and legal issues.
    Below are some tips for setting up a secure testing environment.


    ## Isolated Environment


    Perform security testing in an isolated environment. Use local networks that are
    not connected to the public internet or set up a separate testing area using dedicated
    APs and devices.


    ## Legal Permission


    Make sure you have permission to test Wi-Fi networks. Testing networks without
    authorization is illegal and can result in serious legal consequences. Always
    obtain written permission before beginning any testing.


    ## Use of Test Networks


    Create test Wi-Fi networks specifically for security auditing. Configure access
    points and client devices that can be used to simulate attack and defense scenarios.


    ## Virtualization Tools


    Use virtualization tools to simulate Wi-Fi networks. Software like `GNS3` and
    `EVE-NG` allow you to create complex network environments that can be used for
    security testing without the need for physical hardware.


    ## Monitoring and Logging


    Monitor and record all activity during testing. Use logging tools to capture detailed
    logs of all actions, which can be later analyzed to identify problems and improve
    testing techniques.


    # Practical Configuration Examples


    To complement the tips provided, below are some practical configuration examples
    to ensure a safe and efficient environment.


    ## Configuring a Test Access Point


    Configure a dedicated AP for security testing. The following is an example configuration
    for an AP using `hostapd` no Kali Linux.


    1. Install the `hostapd`:


    ```bash

    sudo apt install hostapd

    ```


    2. Create a configuration file for the `hostapd`:


    ```bash

    sudo nano /etc/hostapd/hostapd.conf

    ```


    Add the following lines:


    ```text

    interface=wlan0

    driver=nl80211

    ssid=TestWiFi

    hw_mode=g

    channel=6

    auth_algs=1

    wpa=2

    wpa_passphrase=TestPass123

    wpa_key_mgmt=WPA-PSK

    rsn_pairwise=CCMP

    ```


    3. Edit the network interface configuration file:


    ```bash

    sudo nano /etc/network/interfaces

    ```


    Add the following lines:


    ```text

    iface wlan0 inet static

    address 192.168.1.1

    netmask 255.255.255.0

    ```


    4. Configure the DHCP server:


    ```bash

    sudo apt install isc-dhcp-server

    sudo nano /etc/dhcp/dhcpd.conf

    ```


    Add the following lines:


    ```text

    subnet 192.168.1.0 netmask 255.255.255.0 {

    range 192.168.1.10 192.168.1.50;

    option routers 192.168.1.1;

    option domain-name-servers 8.8.8.8, 8.8.4.4;

    }

    ```


    5. Start the services:


    ```bash

    sudo service hostapd start

    sudo service isc-dhcp-server start

    ```


    This example creates an AP with SSID "TestWiFi" and password "TestPass123", using
    the driver `nl80211`. The AP will work on channel 6, using WPA2 for security.


    ## Packet Capture Configuration with Aircrack-ng


    To capture packets from a Wi-Fi network using Aircrack-ng, follow these steps:


    1. Put the network interface in monitor mode:


    ```bash

    sudo ip link set wlan0 down

    sudo iw dev wlan0 set type monitor

    sudo ip link set wlan0 up

    ```


    2. Start packet capture with `airodump-ng`:


    ```bash

    sudo airodump-ng wlan0

    ```


    3. Capture packets from a specific network:


    ```bash

    sudo airodump-ng -c [channel] --bssid [BSSID] -w capture wlan0

    ```


    Replace `[channel]` through the network channel and `[BSSID]` by the MAC address
    of the AP.


    ## Customer Deauthentication


    Perform a deauthentication attack to test network security:


    1. Identify the client''s BSSID and MAC address with `airodump-ng`.

    2. Perform the deauthentication attack with `aireplay-ng`:


    ```bash

    sudo aireplay-ng --deauth 0 -a [BSSID] -c [client MAC] wlan0

    ```


    Replace `[BSSID]` by the MAC address of the AP and `[client MAC]` by the client''s
    MAC address.

