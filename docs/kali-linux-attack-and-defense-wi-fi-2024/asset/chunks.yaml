    5. 分区磁盘（建议初学者使用引导选项）。


    6. 安装系统和 GRUB 引导加载程序。


    # 在虚拟机上安装


    如果你选择在虚拟机上安装 Kali Linux，请使用 VirtualBox 或 VMware 等虚拟化软件。创建一个新虚拟机，选择 Kali Linux
    ISO 镜像作为启动磁盘，并为虚拟机配置至少 2 GB 内存和 20 GB 磁盘空间。按照之前描述的相同安装向导步骤操作。


    # 首次启动与基础设置


    安装完成后，重启系统并使用创建的凭据登录。首次启动可能需要一些时间，因为系统正在配置某些软件包和服务。登录后，更新系统和存储库是非常关重要的。


    ```bash

    sudo apt update

    sudo apt upgrade -y

    ```


    这些 `commands` 确保所有软件包都更新到具有最新的安全和功能版本。


    # 核心 Wi-Fi 测试工具


    Kali Linux 自带了大量预装的渗透测试工具。然而，某些工具对于 Wi-Fi 测试是至关重要的。


    ## Aircrack-ng


    Aircrack-ng 是一套用于评估 Wi-Fi 网络安全的工具集。它包含了捕获数据包、注入数据包、执行去认证攻击等多种工具。


    ```bash

    sudo apt install aircrack-ng

    ```


    安装后，你可以使用 `airodump-ng` 等命令捕获数据包，并使用 `aircrack-ng` 破解 WEP/WPA 密码。


    ## Reaver


    Reaver 是一种攻击受 WPS 保护的 Wi-Fi 网络的工具。它使用暴力攻击猜测 WPS PIN，从而恢复 WPA/WPA2 密码。


    ```bash

    sudo apt install reaver

    ```


    要使用 `Reaver`，请从命令 `reaver -i [interface] -b [BSSID] -vv` 开始。


    ## Wireshark


    WiShark 是一个数据包分析工具，允许你实时捕获并与网络流量交互。它对于深度包检测和流量分析有用。


    ```bash

    sudo apt install wireshark

    ```


    使用 `sudo wireshark` 启动 Wireshark 并选择网络接口以开始捕包。


    ## Fern WiFi Cracker


    Fern WiFi Cracker 是一款用于审计和恢复无线网络密钥的图形化工具。支持 WEP/WPA/WPS 攻击。


    ```bash

    sudo apt install fern-wifi-cracker

    ```


    使用 `sudo fern-wifi-cracker` 启动并按照图形界面进行安全审计。


    # 系统更新与维护


    保持 Kali Linux 更新对于确保工具的安全性和正常运行至关重要。除了定期更新系统外，定期进行维护也十分重要的。


    ## 系统更新


    使用以下命令定期检查并应用更新：


    ```bash

    sudo apt update

    sudo apt upgrade -y

    sudo apt dist-upgrade -y

    ```


    命令 `dist-upgrade` 确保所有依赖项和软件包都正确更新，即使新版本需要系统配置更改。


    ## 软件包清理


    删除不必要的软件包并清除系统缓存以释放磁盘空间：


    ```bash

    sudo apt autoremove -y

    sudo apt clean

    sudo apt autoclean

    ```


    这些命令会移除不再需要的过时软件包和临时文件。


    ## 定期备份


    对重要文件和设置进行定期备份。使用 `rsync` 或自动备份解决方案来确保在发生故障时可以快速恢复系统。


    ```bash

    rsync -av --progress /home/user /media/backup/

    ```


    此命令将 `/home/user` 目录备份到挂载在 `/media/backup/` 的备份设备上。


    # 安全测试环境提示


    在建立 Wi-Fi 网络测试环境时，确保环境的安全和隔离至关重要，以避免干扰和法律问题。以下是关于建立安全测试环境的一些提示。


    ## 隔离环境


    在隔离环境中进行安全测试。使用未连接到公共网络的本地网络，或使用专用的 AP 和设备建立独立的测试区域。


    ## 法律许可


    确保你有测试 Wi-Fi 网络的权限。未经授权测试网络是违法的，可能会导致严重的法律后果。在开始任何测试之前，请务必获得书面许可。


    ## 测试网络的使用


    专门为安全审计创建测试 Wi-Fi 网络。配置可以模拟攻击防御场景的访问点客户端设备。


    ## 虚拟化工具


    使用虚拟化工具模拟 Wi-Fi 网络。如 `GNS3` 和 `EVE-NG` 等软件允许你创建复杂的网络环境，而无需物理硬件。


    ## 监控与日志


    监控并记录测试期间的所有活动。使用日志工具捕获所有操作的详细日志，稍后进行分析以识别问题并改进测试技术。


    # 实用配置示例


    为了补充提供的提示，以下是一些实用的配置示例，以确保环境的安全高效。


    ## 配置测试访问点


    为安全测试配置一个专用 AP。以下是一个使用 Kali Linux 下 `hostapd` 配置 AP 的配置示例。


    1. 安装 `hostapd`：


    ```bash

    sudo apt install hostapd

    ```


    2. 为 `hostapd` 创建配置文件：


    ```bash

    sudo nano /etc/hostapd/hostapd.conf

    ```


    添加以下行：


    ```text

    interface=wlan0

    driver=nl80211

    ssid=TestWiFi

    hw_mode=g

    channel=6

    auth_algs=1

    wpa=2

    wpa_passphrase=TestPass123

    wpa_key_mgmt=WPA-PSK

    rsn_pairwise=CCMP

    ```


    3. 编辑网络接口配置文件：


    ```bash

    sudo nano /etc/network/interfaces

    ```


    添加以下行：


    ```text

    iface wlan0 inet static

    address 192.168.1.1

    netmask 255.255.255.0

    ```


    4. 配置 DHCP 服务器：


    ```bash

    sudo apt install isc-dhcp-server

    sudo nano /etc/dhcp/dhcpd.conf

    ```


    添加以下行：


    ```text

    subnet 192.168.1.0 netmask 255.255.255.0 {

    range 192.168.1.10 192.168.1.50;

    option routers 192.168.1.1;

    option domain-name-servers 8.8.8.8, 8.8.4.4;

    }

    ```


    5. 启动服务：


    ```bash

    sudo service hostapd start

    sudo service isc-dhcp-server start

    ```


    此示例创建一个 SSID 为 "TestWiFi" 密码为 "TestPass123" 的 AP，使用驱动 `nl80211`。该 AP 将在通道 6 上工作，使用
    WPA2 进行加密。


    ## 使用 Aircrack-ng 配置包捕获


    要使用 Aircrack-ng 从 Wi-Fi 网络捕获数据包，请遵循以下步骤：


    1. 将网络接口置于监听模式：


    ```bash

    sudo ip link set wlan0 down

    sudo iw dev wlan0 set type monitor

    sudo ip link set wlan0 up

    ```


    2. 使用 `airodump-ng` 启动捕包：


    ```bash

    sudo airodump-ng wlan0

    ```


    3. 从特定网络捕获数据包：


    ```bash

    sudo airodump-ng -c [channel] --bssid [BSSID] -w capture wlan0

    ```


    将 `[channel]` 替换为网络通道，将 `[BSSID]` 替换为 AP 的 MAC 地址。


    ## 去认证


    执行去认证攻击以测试网络安全：


    1. 使用 `airodump-ng` 识别客户端的 BSSID 和 MAC 地址。

    2. 使用 `aireplay-ng` 执行去认证攻击：


    ```bash

    sudo aireplay-ng --deauth 0 -a [BSSID] -c [client MAC] wlan0

    ```


    将 `[BSSID]` 替换为 AP 的 MAC 地址，将 `[client MAC]` 替换为客户端的 MAC 地址。


