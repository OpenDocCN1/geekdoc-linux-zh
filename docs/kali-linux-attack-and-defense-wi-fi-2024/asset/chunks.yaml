    \ used to ensure the security of your Wi-Fi network.\n\n# Example Script for Packet\
    \ Capture with Wireshark\n\nWireshark is a powerful packet analysis tool that\
    \ can be used to monitor network traffic. Below is an example of a basic packet\
    \ capture script:\n\nbash\n\n#!/bin/bash\n\n# Script to capture network packets\
    \ using Wireshark\n\nINTERFACE=\"wlan0\" # Network interface to monitor\n\nOUTPUT_FILE=\"\
    captura.pcap\" # Output file\n\necho \"Starting packet capture on interface $INTERFACE...\"\
    \n\nsudo tshark -i $INTERFACE -w $OUTPUT_FILE\n\necho \"Capture completed. File\
    \ saved as $OUTPUT_FILE\"\n\nIt is script use o tshark, which is the command line\
    \ version of Wireshark. To run this script, save it to a file, e.g. captura.sh,\
    \ and make it executable with the command chmod +x captura.sh. Then run it with\
    \ sudo ./captura.sh.\n\n# Firewall configuration with iptables\n\niptables is\
    \ a packet filtering tool used to configure firewall rules in Linux. The following\
    \ is a basic configuration example to block all inbound traffic except HTTP (port\
    \ 80) and HTTPS (port 443) traffic:\n\nbash\n\n#!/bin/bash\n\n# Script to configure\
    \ basic firewall using iptables\n\necho \"Configuring firewall with iptables...\"\
    \n\n# Clear all existing rules\n\nsudo iptables -F\n\n# Configure default policies\
    \ to block all incoming traffic\n\nsudo iptables -P INPUT DROP\n\nsudo iptables\
    \ -P FORWARD DROP\n\nsudo iptables -P OUTPUT ACCEPT\n\n# Allow loopback traffic\n\
    \nsudo iptables -A INPUT -i lo -j ACCEPT\n\n# Allow incoming traffic for already\
    \ established connections\n\nsudo iptables -A INPUT -m state --state ESTABLISHED,RELATED\
    \ -j ACCEPT\n\n# Allow HTTP (port 80) and HTTPS (port 443) traffic\n\nsudo iptables\
    \ -A INPUT -p tcp --dport 80 -j ACCEPT\n\nsudo iptables -A INPUT -p tcp --dport\
    \ 443 -j ACCEPT\n\necho \"Firewall configuration complete.\"\n\nSave this script\
    \ to a file, e.g. firewall.sh, and make it executable with chmod +x firewall.sh.\
    \ Then run it with sudo ./firewall.sh to apply firewall rules.\n\nThis chapter\
    \ has provided a comprehensive introduction to the fundamentals of Wi-Fi networks,\
    \ covering everything from components and architecture to standards and protocols,\
    \ as well as essential security practices. Understanding these concepts is crucial\
    \ for any cybersecurity professional as they provide the foundation needed to\
    \ protect wireless networks against threats.\n\nThe sample scripts and practical\
    \ configurations presented provide a practical approach to applying the concepts\
    \ discussed. As you progress through this book, you will continue to build on\
    \ these foundations by exploring more advanced Wi-Fi attack and defense techniques\
    \ with Kali Linux.\n\nDeep understanding and practical application of this knowledge\
    \ will allow you to excel in the field of cybersecurity, effectively protecting\
    \ Wi-Fi networks in an increasingly digital and interconnected environment. Prepare\
    \ yourself for an intense and rewarding journey, where each chapter will broaden\
    \ your horizons and enhance your capabilities.\n\nChapter 2: Configuring the Kali\
    \ Linux Environment\n\n# \n\n* * *\n\n# Kali Linux Installation and Configuration\n\
    \nTo start using Kali Linux, you need to install it correctly. Kali Linux is a\
    \ Linux distribution specialized in penetration testing and security audits. It\
    \ can be installed on physical machines, virtual machines or even mobile devices.\n\
    \n# Download ISO Image\n\nThe first step is to download the Kali Linux ISO image.\
    \ Go to the official Kali Linux website (https://www.kali.org) and navigate to\
    \ the downloads section. Choose the version that best suits your environment.\
    \ There are options for different architectures (x86, x64, ARM) and installation\
    \ methods (ISO image, OVA for virtualization, etc.).\n\n# Creating Installation\
    \ Media\n\nAfter downloading the ISO image, create installation media. If you\
    \ plan to install Kali Linux on a physical machine, use bootable USB creation\
    \ software such as Rufus (Windows) or Balena Etcher (Windows, macOS, Linux). Insert\
    \ an empty pendrive into your computer, open the chosen software and select the\
    \ downloaded ISO image. Follow the instructions to create the bootable USB.\n\n\
    # Installation on a Physical Machine\n\nInsert the pendrive into the computer\
    \ where you want to install Kali Linux and restart the machine. During boot, access\
    \ the boot menu (usually by pressing F12, Esc, or another key depending on the\
    \ manufacturer) and select the pendrive as the boot device. When the Kali Linux\
    \ installer loads, follow the installation wizard steps:\n\n1.  Choose the language.\n\
    \n2.  Configure the keyboard layout.\n\n3.  Configure the network (optional).\n\
    \n4.  Create a user and set a password."
