    ## Chapter 1: Wi-Fi Networking Fundamentals


    ***


    # Introduction to Wi-Fi Networks


    Wi-Fi networks have revolutionized the way we connect to the internet and exchange
    information. They use radio waves to transmit data between devices, eliminating
    the need for physical cables. This brought enormous convenience, allowing mobility
    and flexibility that we consider indispensable today. With the increased use of
    mobile devices and the growing demand for connectivity, understanding the basics
    of Wi-Fi networks is crucial for any technology professional.


    ## Components and Architecture


    To understand Wi-Fi networks, it is essential to know their main components and
    how they integrate to form a functional network. Next, we will discuss the main
    components of a Wi-Fi network and the architecture that connects them.


    ### Access Points (APs)


    Access point (`AP`) is a device that allows wireless devices to connect to a network.
    It functions as a central hub that transmits and receives radio signals. In enterprise
    environments, multiple `APs` are often used to cover large areas, with each `AP`
    connected to the main network via Ethernet cable. `AP` plays a vital role in coordinating
    communication between wireless devices and the wired network.


    ### Client Devices


    Client devices are those that connect to the access point. These devices include
    laptops, smartphones, tablets, wireless printers, and any other Wi-Fi enabled
    device. Each client device has a Wi-Fi adapter that allows it to connect to the
    `AP`. The interaction between the `AP` and client devices is what makes the Wi-Fi
    network useful and accessible to end users.


    ### Network Controllers


    Network controllers, mainly used in corporate environments, manage multiple `APs`,
    allowing centralized administration of configurations, security policies and performance
    monitoring. They help optimize coverage and minimize interference, ensuring a
    stable and secure connection. Network controllers are essential for the efficient
    maintenance and management of large-scale Wi-Fi networks.


    ## Network Architecture


    The architecture of a Wi-Fi network can be divided into two main types: infrastructure
    networks and ad hoc networks.


    ### Infrastructure Network


    This is the most common type of Wi-Fi network, where devices communicate through
    a central access point. Most home and business networks use this architecture.
    The `AP` is connected to a router, which in turn is connected to the internet,
    allowing all devices on the network to access the internet. This framework allows
    for centralized management and easier implementation of security policies.


    ### Return To This


    In an ad hoc network, devices connect directly to each other without the need
    for a central `AP`. This type of network is useful in temporary or emergency situations
    where traditional infrastructure is not available. Ad hoc networks offer flexibility
    and speed of deployment, although they may not be as secure or efficient as infrastructure
    networks.


    ## Wi-Fi Standards and Protocols


    Wi-Fi standards are defined by the Institute of Electrical and Electronics Engineers
    (`IEEE`), and they are identified by the designation `802.11` followed by a letter
    (for example, `802.11b`, `802.11g`). Each standard defines the theoretical maximum
    speed, the frequency used and other technical characteristics.


    ### IEEE 802.11a/b/g/n/ac/ax


    Wi-Fi standards have evolved significantly over time, each offering improvements
    in terms of speed, efficiency, and security.


    - `802.11b`: Launched in 1999, it operates on the 2.4 GHz frequency with a theoretical
    maximum speed of 11 Mbps. It was one of the first widely adopted standards, but
    is now considered obsolete due to its speed limitations.

    - `802.11a`: Also launched in 1999, it operates on a frequency of 5 GHz with a
    maximum theoretical speed of 54 Mbps. Although it offers better performance than
    `802.11b`, its adoption has been limited due to its higher cost and shorter signal
    range.

    - `802.11g`: Launched in 2003, it combines the best characteristics of standards
    a and b, operating at 2.4 GHz with a maximum speed of 54 Mbps. It has become a
    popular standard due to its balance between cost, performance and compatibility.

    - `802.11n`: Introduced in 2009, it operates in 2.4 GHz and 5 GHz with a maximum
    speed of up to 600 Mbps, using `MIMO` (Multiple Input, Multiple Output). This
    standard has brought a significant increase in speed and efficiency, being widely
    adopted in both home and corporate environments.

    - `802.11ac`: Launched in 2013, it operates exclusively at 5 GHz with speeds that
    can reach up to 3.5 Gbps, using advanced `MIMO` techniques and wider channels.
    This standard is ideal for applications that require high bandwidth, such as high-definition
    video streaming and online gaming.

    - `802.11ax`: Also known as Wi-Fi 6, it is the most recent standard, released
    in 2019, that operates at 2.4 GHz and 5 GHz, and can reach speeds exceeding 10
    Gbps. It offers better efficiency and capacity in dense environments, as well
    as significant improvements in terms of security and energy consumption.


    ### Wi-Fi Security Protocols


    Security is a crucial concern in Wi-Fi networks due to the open-transmission nature
    of radio waves. Key security protocols include:


    - `WEP` (Wired Equivalent Privacy): The first security protocol for Wi-Fi networks,
    released in 1997. It was quickly surpassed due to its security weaknesses and
    is considered insecure. `WEP`''s main vulnerability is the possibility of brute
    force attacks, which can decipher the encryption key in a few minutes.

    - `WPA` (Wi-Fi Protected Access): Introduced as an intermediate solution to correct
    `WEP` flaws, using the `TKIP` (Temporal Key Integrity Protocol) protocol. Although
    it is more secure than `WEP`, `WPA` still has vulnerabilities, especially in older
    implementations.

    - `WPA2`: Launched in 2004, it is the improved version of `WPA`, using the `AES`
    (Advanced Encryption Standard) protocol for encryption. It is widely used and
    considered safe. `WPA2-PSK` (Pre-Shared Key) is common in home networks, while
    `WPA2-Enterprise`, which uses a `RADIUS` authentication server, is used in corporate
    environments.

    - `WPA3`: The latest version, introduced in 2018, offers significant security
    improvements, including stronger encryption and protections against brute force
    attacks. `WPA3-Personal` uses `SAE` (Simultaneous Authentication of Equals) to
    replace `WPA2-PSK`, providing stronger security even with weak passwords.


    # Basic Security on Wi-Fi Networks

