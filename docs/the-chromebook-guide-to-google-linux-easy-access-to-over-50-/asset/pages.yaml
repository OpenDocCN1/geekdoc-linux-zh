  md: '# Quick Reference Best Practices


    Best Practices can greatly reduce the time and work required to recover from an
    issue.


    While working, it is often helpful to save a file name with a version number.
    For example myfile1.txt, myfile2.txt, myfile3.txt. Save often while working.


    At least, back up project files after working for long periods.


    Backup a system at least once a month.


    Backup a system before making configuration changes or installing new software.


    Before editing a configuration file, copy it to a .bak file. Use versions as needed,
    .bak1, .bak2, .bak3 etc . .


    Use external media for backups. Alternate media so all current backups are not
    on the same media.


    Save critical files outside of Chromebook only backups, so they can be read by
    other systems.


    Consider “Saving Data Outside of a Container” see page 49.'
