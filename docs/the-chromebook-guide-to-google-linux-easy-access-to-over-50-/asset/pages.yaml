  md: '# Viewing Logs


    **dmesg** can display the current log messages. The system journal can be viewed
    with the **journalctl** command. The **--list-boots** option will list boot logs.
    Previous boots will show a negative offset at the beginning of the line, use with
    the **-b** option. In the example that follows zero will be used, negative numbers
    can be used to view previous boots. The **-x** option offers explanations and
    possible messages. Use the Cursor Up / Down keys to scroll and Q to quit. From
    LXTerminal:


    ```

    sudo su

    dmesg

    journalctl --list-boots

    Q

    journalctl -b 0

    Q

    journalctl -b 0 -x

    Q

    journalctl --help

    Q

    exit

    ```


    Check a program''s man page, programs may keep their own log files. It maybe be
    helpful to start a program from the command line. Copy a program''s start command
    from the LXDE menu. **Menu** → right click on the **App** → **Properties** → **Entry
    tab**, copy **Ctrl** + C the **Command** and paste it **Ctrl** + Shift + **V**
    into LXTerminal. Any errors will likely show up in LXTerminal.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Troubleshooting


    Not all programs will work on all computers. There are times when searching the
    internet will provide no help, man files and logs files provide no clues, and
    even starting a program from LXTerminal provides no helpful messages. `strace`
    records system calls, `-o` sends the output to a text file, `-C` shows a summary.
    The file can be viewed with any text editor. `cat` can be a quick way to view
    a file. Piping the output to less, `less`, allows the file to be scrolled using
    the Cursor Up / Down keys, Q to quit.


    From Synaptic install:

    manpages-dev

    strace


    From LXTerminal:

    man syscalls

    Q

    man strace

    Q

    strace -C -o st.txt cmatrix

    Q

    cat st.txt | less

    Q


    Chrome OS has it''s own trace program. In the Chrome OS Chrome Browser, enter
    the URL:

    chrome://tracing'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# INSTALLING i3WM


    Tiling Window Managers are unmatched in their efficiency. They are easy on system
    resources while providing powerful features. They are generally configured by
    editing a small number of configuration files. The i3 Reference Card is about
    half a page long. Tutorial video links can be found on the i3wm.org web site under
    Screens. There is an excellent presentation on Tiling Window Managers by Aline
    Abler for Linux Days on YouTube. This chapter will cover installing and configuring
    i3wm. i3wm screens can be installed and run alongside LXDE.


    Check Chrome OS settings for a screen size that works well with LXDE. 1080x675
    will be used in this chapter. i3wm screens do not dynamically resize like LXDE:
    Chrome OS Settings → Device → Displays


    Shift + Search + Q will close the active window.'
  merge: -1
