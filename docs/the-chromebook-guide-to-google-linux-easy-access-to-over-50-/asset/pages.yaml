  md: '# Settings


    Finding settings using the Settings Search Bar.


    # Screen Time Out


    +   - Search on "power" or just "po"


    # Data Stored Online aka Sync and Google Services


    +   - Search on "sync" or just "sy"


    # Linux Install


    +   - Search on "linux" or just "li"


    # Linux Programs as Apps


    Linux programs can often be run as Chrome OS Apps. Linux apps should show up in
    the Chrome OS App Drawer, Linux apps folder. If not, try running the command,
    "sudo apt update" from Terminal. Then check again. Linux programs were not designed
    to run as Chrome OS Apps. If your program doesn''t run at all, doesn''t work properly,
    or doesn''t look right, try running it in a Full Linux Desktop Environment. Coming
    chapters will cover the LXDE and i3wm Linux Desktops. These two Desktops do not
    conflict with each other and can both be installed and even run at the same time.


    Linux programs can also be started from the Terminal command line. Programs may
    not scale properly when run outside of a Desktop Environment. Sommelier can be
    used to control scaling (Page 105). Scale will vary. From Terminal:


    ```

    sommelier -X --scale=2 --glamor <program>

    ```'
