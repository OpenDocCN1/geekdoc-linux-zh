  md: "# Install Linux on Android\n\nFrom the Play Store install Userland (Does not\
    \ require rooting). Use APT to install software, no sound. Some working programs:\
    \ LibreOffice, Gimp, Inkscape, Python, R, Firefox, Tiddly Wiki, Xpad, Powermanga.\
    \ Keyboards may requires a USB-C to USB or Micro USB to USB adapter. For small\
    \ screen devices, screen casting, screen magnifiers, or magnifying glasses are\
    \ helpful.\n\n# Userland Home Screen:\n\nThe Section menu runs along the bottom\
    \ of the Userland Home Screen. The Apps section is used to install Debian. The\
    \ Sessions section is used to start Debian (long click, select) stop Debian (long\
    \ click, select Stop Session). The Filesystems section is used to: Backup Debian\
    \ (long click, select Export – be sure to long click, select Edit show passwords\
    \ when screen shot, needed for restore. Delete Debian (long click, select Delete).\
    \ Restore click + (Plus Sign) top right.\n\n# Install Debian and LXDE:\n\n+  \
    \ From the Apps section:\n- Select Debian.\n- Grant the permissions requested\
    \ by Userland.\n- Please select a connection type:\n- Select Graphical and click\
    \ Continue.\n- When the install completes:\n- The built in VNC screen will open.\n\
    - A Linux Terminal will open inside that. \n- Install LXDE from the Linux Terminal:\n\
    \n```\nsudo apt update -y\nsudo apt dist-upgrade -y\nsudo apt install task-lxde-desktop\
    \ -y\n```"
