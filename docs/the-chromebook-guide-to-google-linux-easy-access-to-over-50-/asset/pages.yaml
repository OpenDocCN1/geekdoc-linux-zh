  md: '# Fullscreen Keyboard Shortcuts


    Fullscreen mode can make screens easier to read and work with. On a Chromebook
    keyboard, the function keys F1 thru F12 are implemented using:

    Search + (1 thru =). F10 = Search + o (Zero) F11 = Search + - (Dash), F12 = Search
    + - =


    +   - i3wm Fullscreen Toggle: Chromebook Keyboard: Search + F

    - LXDE Fullscreen Toggle: Chromebook Keyboard : Alt + Search + - (Dash)

    - Windows Keyboard: Win + F


    If the LXDE Fullscreen Toggle is not working make sure the improved keyboard shortcuts
    flag is disabled.


    From the Chrome OS Chrome Browser:

    Go to the URL: chrome://flags

    In the Search Box, enter:

    improved keyboard shortcuts

    There should be one flag. Disable the flag and reboot. If this should stop working,
    possible after an update: Enable the flag and reboot, then Disable the flag and
    reboot again.


    # Keyboard Shortcuts aka Hot Keys


    To view or edit Keyboard Shortcuts:

