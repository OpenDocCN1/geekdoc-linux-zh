- img_proc: true
  md: '# Quick Reference Troubleshooting


    Never panic, Chromebooks and Linux are very robust.


    +   1) Restart Linux.


    +   2) Reboot the Chromebook.


    +   3) Check for updates.


    +   4) Fix the Chrome OS Terminal first.


    +   5) If there was a recent config change, undo it.


    +   6) If there was a recent program install, uninstall it.


    +   7) Google error messages and symptoms.


    +   8) Check the system logs for messages.


    +   9) If Linux will not start at all, for example if the Termina virtual machine
    is broken. Remove Linux, Install Linux and restore Linux from the last backup
    (Page 50). See Saving Data Outside of a Container (Page 49).


    +   10) For Port issues, delete all forwarded ports, reboot and re-add needed
    port(s). Settings: Linux port forwarding \sudo lssof -i -P -n | grep LISTEN


    +   11) For file sharing issues, remove all file shares, reboot and re-add needed
    file shares. Settings: Linux shared folders'
  merge: -1
