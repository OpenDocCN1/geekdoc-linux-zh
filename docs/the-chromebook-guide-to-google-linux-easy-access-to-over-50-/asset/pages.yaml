  md: '# Edit a Profile


    Termina does not have an editor, Ctrl + X, Ctrl + E. In order to edit a profile,
    it is necessary to copy the profile to a Variable or File. From a Termina Terminal:


    ```

    env | grep EDITOR

    ls /usr/bin/v*

    lxc profile create test

    lxc profile list

    ```


    To a Variable:


    ```

    HOLDTXT=$(EDITOR=cat lxc profile edit test)

    lxc profile show test

    echo "$HOLDTXT"

    echo "$HOLDTXT" | lxc profile edit test

    ```


    To a File (Use your user <id>):


    ```

    cd /tmp

    EDITOR=cat lxc profile edit test > h.txt

    cat h.txt

    lxc file push /tmp/h.txt penguin/home/<id>/h.txt

    lxc exec penguin su - <id>

    ls

    nano h.txt

    Ctrl + X

    exit

    lxc file pull penguin/home/<id>/h.txt /tmp/h2.txt

    ls

    cat h2.txt | lxc profile edit test

    lxc profile delete test

    lxc stop penguin

    ls

    rm h*

    cd ~

    ```'
  merge: -1
