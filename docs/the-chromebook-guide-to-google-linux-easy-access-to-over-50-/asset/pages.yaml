  md: '# Clone Penguin


    Create a copy of the Penguin container, log into it as root and then your <user-id>,
    and last delete it. A practical use for this is testing software or configuration
    changes on the "copy of Penguin" before making changes to Penguin itself. If a
    lot of programs have been installed, Penguin may be very large and you may wish
    to skip this example. From a Termina Terminal:


    ```

    lxc list

    If penguin is running stop it:

    lxc stop penguin

    lxc list

    lxc copy penguin testbird

    lxc list

    lxc start testbird

    lxc list

    lxc exec testbird -- bash

    whoami

    ls /home

    exit

    lxc exec testbird su - <user-id>

    whoami

    exit

    lxc list

    lxc stop testbird

    lxc list

    lxc delete testbird

    lxc list

    ```'
  merge: -1
