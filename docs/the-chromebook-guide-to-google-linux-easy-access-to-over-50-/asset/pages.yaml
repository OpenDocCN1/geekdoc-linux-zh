  md: '# i3wm Xresources


    The {Dot} .Xresources file is used by apps like XTerm. The command: **xrdb -merge
    ~/.Xresources** must be run in order to load the changes from Xresources. Use
    Mousepad to create the ~/.Xresources in the home directory:


    ```

    xterm*saveLines: 2000

    xterm*loginShell: true

    xterm*selectToClipboard: true

    xterm*faceName: Monospace

    xterm*faceSize: 12

    xterm*Foreground: SlateBlue

    xterm*Background: black

    xterm*pointerColor: red3

    xterm*cursorColor: red3

    ```


    Save the file and exit Mousepad


    There are numerous YouTubes and web pages dedicated to XTerm and how to configure
    it.'
  merge: -1
