  md: '# INTRODUCTION


    “The Chromebook Guide to Google Linux”, TCGTL, is written for Chromebook users
    with Linux enabled Chromebooks. To verify a Chromebook is Linux enabled, enter
    the word “Linux” in the Settings search bar and press enter. If the search returns
    "Linux development environment", the Chromebook is Linux enabled. Schools and
    companies will likely block access to this feature.


    Access to Linux means access to over 50 thousand software packages. This book
    does not use any techniques that require rooting. Short configuration tweaks are
    used to provide access to Full Linux Desktops and Linux software Package Mangers.


    TCGTGL is written with the Linux beginner in mind. More advanced Linux users may
    find this a handy time saver and reference for dealing with the quirky nature
    of Chromebooks.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# WHAT’S A CHROMEBOOK


    Chromebooks once easily categorized as a web appliance for browsing the web have
    become a rather complex animal capable of running Linux, Android, and even Windows
    programs. The performance specs promoted by Google promote solid state design,
    long battery life, a very lean OS, and a keyboard layout while unique provides
    a standard. There are even 2 in 1 tablet / laptop Chromebooks.


    # Popular Computer History


    +   * 1947 AT&T creates the Transistor

    * 1958 TI invents Integrated Circuit

    * 1971 Intel creates the Microprocessor

    * 1974 AT&T announces Unix

    * 1974 MITS releases Altair 8800

    * 1975 Microsoft sells BASIC Interpreter'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# The Chromebook Guide to Google Linux


    +   - 1977 Apple releases Apple II

    - 1981 IBM releases IBM PC

    - 1983 GNU Project - modern open source

    - 1984 Apple releases the Macintosh

    - 1985 ARM - Advanced RISC Machines

    - 1991 Linus Torvalds releases Linux

    - 1993 Internet opens to public

    - 1996 Debian Distro released

    - 2000 Apple releases Darwin

    - 2000 JetBrains – IntelliJ

    - 2005 One Laptop per Child

    - 2007 Apple releases iPhone

    - 2007 Asus releases the EEE PC

    - 2008 Google phones available

    - 2008 LXC - Linux Containers - first released

    - 2011 Google Chromebooks available

    - 2012 Raspberry Pi released ($35)

    - 2013 Dockers - first released

    - 2018 Chromebooks are able to run Linux

    - 2019 Google switches to JetBrains Kotlin

    - 2020 COVID

    - 2021 Chromebook Linux no longer in Beta


    # Chromebooks in 2022


    Chromebooks have been becoming larger, 14” and even 16” models are common with
    larger screens and keyboards. A good base system will have a 4 core Intel or 8
    core ARM processor with at least 4GB of memory, 64GB of storage, a minimum of
    1 USB-C port and a battery life of at least 8 hours. $200 is a fair minium starting
    price. Always look up the model id and check the EOL, End Of Life. With high priced
    models check for over heating concerns and battery life.'
