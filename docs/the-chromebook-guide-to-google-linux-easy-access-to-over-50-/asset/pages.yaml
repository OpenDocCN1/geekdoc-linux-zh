  md: '# Navigating from Crosh to Terminal


    Navigating from Crosh, outside a container, to the inside of a container is a
    short process. Allow one command to finish before entering the next command. Enter
    the URL chrome-untrusted://crosh in the Chrome Browser. Ctrl + Shift + P opens
    preferences. Enter the following commands, <user-id> is your user id:


    ```

    vmc start termina

    lxc start penguin

    lxc exec penguin su - <user-id>

    ./gol.sh

    ```


    LXDE will start, return to the Chrome Browser. If LXDE is covering the Chrome
    Browser, just press Fullscreen. Enter the following commands:


    ```

    exit

    lxc stop penguin

    exit

    vmc stop termina

    ```


    If termina is misspelled while starting termina (vmc start termina), a new virtual
    machine will be started with the new name. To correct this, exit the VM, stop
    it, then destroy it. Any containers inside it will also be deleted:


    ```

    vmc start pug

    exit

    vmc list

    vmc stop pug

    vmc destroy pug

    ```'
  merge: -1
