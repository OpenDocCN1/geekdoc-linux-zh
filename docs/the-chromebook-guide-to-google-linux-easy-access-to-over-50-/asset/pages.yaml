  md: "# i3wm Workspaces\n\nBecause the Chromebook uses Search (o - 9) for function\
    \ keys, the i3wm Workspaces keys need to be redefined. Change all 10 binds for\
    \ # switch to workspace and # move focused container to workspace. Edit the i3wm\
    \ config ~/.config/i3/config file:\n\n```\n# switch to workspace change:\nFrom:\n\
    \  bindsym $mod+1 workspace ...\nTo:\n  bindsym Ctrl+1 workspace ...\n```\n\n\
    ```\n# move focused container to workspace change:\nFrom:\n  bindsym $mod+Shift+1\
    \ move ...\nTo:\n  bindsym mod+1 move ...\n```\n\nWorkspaces aka Virtual Desktops\
    \ are now accessed by pressing Ctrl (o - 9), zero is Workspace 10. The Workspace\
    \ number is shown on the bottom left of the screen. Move a selected Window between\
    \ Workspaces by pressing Alt + (o - 9). Selecting a Window and pressing Alt +\
    \ 5, moves the Window to Workspace 5. Pressing Ctrl +5 jumps to Workspace 5."
