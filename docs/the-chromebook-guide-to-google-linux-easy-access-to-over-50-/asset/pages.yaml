  md: '# Networks


    Modern networks assign an address to a device much like an apartment building
    has an address. Device port numbers are like apartment numbers. An application
    may use one or more ports of a computer''s address. URL prefixes like http, data,
    file, and https are URI schemes which define the purpose of the URL. https://127.0.0.1:631
    is an IPv4 formatted address that tells a browser to look for a web page (https)
    on the local machine (127.0.0.1 means the machine itself) on port 631 which is
    used by CUPS. IPv6 is the new version of IP Internet Protocol. To see your IP
    address as seen from the internet go to a search engine such as google.com or
    start.duckduckgo.com and search on "my ip". The search engine will show your IP
    as seen from the internet. While there search on "my user agent". The user agent
    is your browser and OS information. Firefox allows a User Agent to be set manually,
    it is preferable not to change this.


    Display the User Agent from Firefox: Firefox Menu → More Tools → Web Developer
    Tools Select the Console tab Enter:


    ```

    navigator.userAgent

    ```


    Linux is connected to the Chromebook network through bridge software. The Chromebook
    may be connected to a router or tethered to another device. Different levels of
    a network may use different IP addresses. hostname -I shows the network addresses
    of the host. ip add show will show all network addresses. lsof can be used to
    show all open ports. | pipes the output from lsof to grep is used to filter the
    output.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'The Chromebook Guide to Google Linux


    From LXTerminal:


    ```

    hostname -I

    ip add show

    sudo lsof -i -P -n | grep LISTEN

    ```


    Use dig whois to find out more about a website.

    traceroute shows how many hops and how long it takes to reach a site. "Webhet"
