  md: '# Quick Reference Fixing Terminal


    While starting Terminal, on occasion you may have a re-occurring error, such as;
    "can''t open display :2". To clear the error try the following:


    +   1) First try:

    From the Chrome OS Chrome Browser:

    From the Crosh URL:

    `chrome-untrusted://crosh`

    vmc stop termina


    +   2) If that fails then:

    From the Chrome OS Chrome Browser

    From the URL:

    `chrome-untrusted://crosh`

    vmc start termina

    lxc stop penguin

    exit

    vmc stop termina


    +   3) If that fails, last try :

    From Terminal:

    Select Penguin from the Terminal menu.

    sudo halt

    Restart Terminal and select Penguin, then do:

    `Ctrl + C`

    From the Chrome OS Chrome Browser:

    From the Crosh URL:

    `chrome-untrusted://crosh`

    vmc stop termina


    +   4) Reboot the Chromebook, start at step one.'
