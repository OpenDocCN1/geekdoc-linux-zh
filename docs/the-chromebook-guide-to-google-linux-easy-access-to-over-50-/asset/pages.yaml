  md: '# Quick Reference Finding Programs


    Synaptic is one of the easiest ways to find a program''s name and file locations.
    Synaptic can be started from the Chrome OS Terminal app :


    ```

    pkexec "/usr/sbin/synaptic"

    ```


    Find the installed program. Select it by clicking on it once, then click on Properties
    (Toolbar top right.) Maximize the program''s Properties pop up window. Select
    the Installed Files tab. File names and locations can be found there.


    Most programs can be started from Chrome OS Terminal. This can be helpful when
    a program''s startup setting causes a Desktop to crash. Start the program from
    Terminal and correct the setting. If the program can not be fixed it can be deleted
    using Synaptic.


    Program start-up commands can be found in .desktop files in the ~/.local/share/applications/
    and /usr/share/applications/ directories.


    ```

    cat <name>.desktop | grep Exec

    ```'
