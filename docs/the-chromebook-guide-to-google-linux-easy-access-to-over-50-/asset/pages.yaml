  md: '# Quick Reference Desktops


    Update Debian Linux:


    ```

    sudo apt update -y

    sudo apt dist-upgrade -y

    ```


    Install Nano editor:


    ```

    sudo apt install nano -y

    ```


    Install Xephyr - Nested X Server:


    ```

    sudo apt install xserver-xephyr -y

    ```


    Install LXDE and i3wm Desktops:


    ```

    sudo apt install task-lxde-desktop -y

    sudo apt install i3 -y

    ```


    LXDE Launch Script ~/gol.sh:


    ```

    #!/bin/bash

    Xephyr -br -fullscreen -resizeable :20 & sleep 5

    DISPLAY=:20 startlxde &

    ```


    i3wm Launch Script ~/goi.sh:


    ```

    #!/bin/bash

    Xephyr -br -screen 1080x675 -resizeable :30 & sleep 5

    DISPLAY=:30 i3 &

    ```


    Three recommended Prefix options:


    +   1) No prefix.

    2) env GDK_BACKEND=x11 <program-name>

    3) sommelier -X --scale=.5 --glamor

    --frame-color=#000000 <program-name>'
