  md: '# QUICK REFERENCE


    Chromebook''s streamlined rugged design combined with one button Linux install
    offers historic easy of access to over 50 thousand software packages. Access to
    tried and tested software like LibreOffice, Gimp, Blender, FreeCAD, and Python.


    The focus of this book is access and achieving the best user experience. How to
    start a Full Linux Desktop under Chrome OS. Fixing Software Package Managers that
    provide access to software. And, tweaking program launch commands to provide the
    best experience.


    Want to know more? The Debian Handbook can be installed using Synaptic, install:
    debian-handbook. Open the index.html file with Firefox:


    ```

    /usr/share/doc/debian-handbook/html/en-US/index.html

    ```


    Explore the debian.org and chromium.org web sites.'
