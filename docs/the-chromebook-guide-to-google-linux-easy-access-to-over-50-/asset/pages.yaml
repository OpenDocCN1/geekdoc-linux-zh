  md: 'The free range nature of Linux allows it to evolve as need and often in several
    directions at one time. If you don''t like it, fork it. There are two major trends
    in Linux that touch virtually every system. The move from X.org to Wayland does
    clean up a lot of X.org issues. Wayland also blocks GUI root sessions, which causes
    the creation of convoluted methods of going around the limit. There has been a
    move from initd to Systemd. Systemd is a much more robust system automation. Systemd
    suffers from Urban Sprawl and uses binary files instead of traditional Unix/Linux
    text files.


    X.org to Wayland - Interface, displays, etc.

    initd to Systemd - Start up, shutdown, automation.


    # LOOSE ENDS'
