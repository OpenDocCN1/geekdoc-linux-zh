  md: "# i3wm Menu Fix\n\nThe i3wm menu requires the addition of one line of code\
    \ to i3-dmenu-desktop to keep apps on the desktop. Find the location of the menu\
    \ with which command. In order to access this file location, run pcmanfm with\
    \ sudo. From LXDE open LXTerminal:\n\n```\nwhich i3-dmenu-desktop\nsudo pcmanfm\n\
    ```\n\nNavigate to /usr/bin Open i3-dmenu-desktop with Mousepad. Because this\
    \ is a different user, Mousepad will need to be configured again, this will only\
    \ need to be done once per user. Save the file as i3-dmenu-desktop.bak. Close\
    \ Mousepad. Open /usr/bin/i3-dmenu-desktop again with Mousepad:\n\n```\nFind:\
    \ \"$exec\nFrom:\n  }\n  $cmd = qq|exec nosn \"$exec\"|;\n}\nTo:\n  }\n  $exec\
    \ = \"env GTK_BACKEND=x11 ${$exec}\";\n  $cmd = qq|exec nosn \"$exec\"|;\n}\n\
    ```\n\nSave the file and close Mousepad, Pcmmanfm and LXTerminal."
  merge: -1
