  md: '# Apt


    Apt is a command line software package manager. ^target-get$ provides an exact
    match. "update", updates the software links. "dist-upgrade", upgrades the core
    operating system. history, displays a list of previous commands. Pressing the
    Cursor Up arrow key, recalls the previous command, which can then be edited. Adding
    -y, replies y to the do you wish to install questions. Instead of retyping a command,
    recall and edit previous commands. Use the backspace and cursor keys (bottom right
    of keyboard) to edit previous commands. From Terminal enter the following:


    ```

    sudo apt update -y

    sudo apt dist-upgrade -y

    sudo apt search info

    sudo apt search ^info$

    sudo apt install ^info$ -y

    sudo apt install ^htop$ -y

    sudo apt install ^neofetch$ -y

    sudo apt install ^screenfetch$ -y

    history

    ```


    Linux has several help systems. Most programs also offer help screens. man is
    short for manual. apt shows the manual for apt, use the Cursor Up / Down keys
    to scroll through the document and Q to quit. info is an ebook like help, Q to
    quit, H for help. htop is a system monitor, Q to quit. neofetch and screenfetch
    provide information about a system. env will display information about the Linux
    environment.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'From Terminal enter the following:


    ```

    apt -h

    man apt

    Q

    info

    H

    Q

    htop

    Q

    neofetch

    screenfetch

    env

    ```


    # # SuperUser Access


    Access to some areas of the file system require Superuser permission. The LXDE
    file manager, pcmanfm, can be started with the sudo, SuperUser DO, or run from
    the root id to gain access. Pressing Alt + Backspace while a file or directory
    is selected, will send it to the trash can. A convenient way to edit a file from
    pcmanfm, is to right click on the file and select Mousepad. To set permissions,
    right click on the file and select Properties, then select the Permissions tab.
    Run pcmanfm with SuperUser access. From the LXDE menu select Run and enter:


    ```

    sudo pcmanfm

    ```'
