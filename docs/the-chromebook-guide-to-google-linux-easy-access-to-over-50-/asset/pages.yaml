  md: '# i3wm Configuration


    Deleting the i3 directory would reset the i3wm configuration and would not harm
    i3wm. The generate config questions would have to be answered again. The i3wm
    configuration file is located at:


    ~/.config/i3/config


    The Xresources file needs to be created in the home directory:


    ~/.Xresources


    Restart Linux, from LXDE run the File Manager pcmanfm. Select the Home Folder.
    Hidden folders are not really hidden, they just start with a "." dot / period.
    If the .config folder is not visible, View → check Show Hidden or press Ctrl +
    H. Open the .config folder then open the i3 folder. Right click on the config
    file, select Open With..., then expand Accessories and select Mousepad. Save the
    file as config.bak. Close Mousepad and reopen the config file again with Mousepad.


    Changes made to the config file will overide the settings found in the i3 reference
    card document. In the config file, $mod means the Chromebook Search key or the
    Windows key on a Windows keyboard. mod+1 is the Alt key.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# i3/config


    Make the following changes to ~/.config/i3/config. Use Ctrl + F or Search → Find,
    to find a location:


    ```

    Find: pango:m

    From: font pango:monospace 8

    To: font pango:monospace 12

    ```


    ```

    Find: sen

    From: exec i3-sensible-terminal

    To: exec xterm

    ```


    ```

    Find: dmenu_run

    From: --no-startup-id dmenu_run

    To: --no-startup-id i3-dmenu-desktop

    ```


    ```

    Find: mod+h $mod+h split h

    From: bindsym mod1+Ctrl+h split h

    ```


    ```

    Find: mod+v

    From: bindsym $mod+v split v

    To: bindsym mod1+Ctrl+v split v

    ```


    ```

    Find: Shift+sp

    From: bindsym $mod+Shift+space floating toggle

    To: bindsym mod1+Ctrl+space floating toggle

    ```


    At the bottom of the file add:

    exec xrddb -merge ~/.Xresources && xterm


    Save the file and close Mousepad.'
  merge: -1
