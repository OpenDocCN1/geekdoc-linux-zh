  md: '# Directories


    Directories also called folders provide a hierarchical structure for organizing
    files. **cd**, change directory, command is used to move between directories.
    **cd ..** is used to move up a directory structure. **mkdir** is used to make
    a directory. Use single or double quotes when a directory name contains a space.
    **rm -r** will remove a directory and any files or directories in it. **touch**
    will create an empty file.


    From LXTerminal:


    ```

    mkdir numbers

    ls

    cd numbers

    touch one

    touch "two three"

    ls

    cd ..

    ls

    rm -r numbers

    ls

    ```'
