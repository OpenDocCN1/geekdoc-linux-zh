  md: '# Penguin Backup and Restore


    The Chrome OS built-in Linux backup system can not be used to backup or restore
    guest containers. Doing a restore will not delete any guest containers.


    # Backup Guest Container to Penguin


    Copy (publish) a container (sam in this example) to an image file. Then export
    the image file to a compressed file (.tar.gz). Last the compressed file is pushed
    into the Penguin container. In this example files are copied into the Penguin
    container (Use your <id>). Use Manage extra containers page 151 or “lxc copy penguin
    sam” to create a container named sam.


    ```

    lxc publish sam --alias backup

    lxc image export backup $LXD_CONF/backup

    lxc file push $LXD_CONF/backup.tar.gz npenguin/home/<id>/backup.tar.gz

    ```


    +   Clean up Files:

    lxc image list

    lxc image delete backup

    lxc image list

    cd $LXD_CONF

    ls

    rm backup.tar.gz

    lxc list

    lxc delete sam

    cd ~'
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Restore Guest Container from Penguin\n\nPull a compressed File (.tar.gz)\
    \ from the Penguin container (Use your <id>). Then import the image file from\
    \ the compressed file. Last launch a container from the image file.\n\n```\nlxc\
    \ file pull penguin/home/<id>/backup.tar.gz\nlxc $LXD_CONF/backup.tar.gz\nlxc\
    \ image list\nlxc image import $LXD_CONF/backup.tar.gz\n  --alias sam\nlxc image\
    \ list\nlxc list\nlxc launch sam sam\nlxc list\n```\n\n# Clean up Files:\nlxc\
    \ list\nlxc stop sam\nlxc list\nlxc delete sam\nlxc list\nlxc image list\nlxc\
    \ image delete sam\nlxc image list\ncd $LXD_CONF\nls\nrm backup.tar.gz\nls\ncd\
    \ ~"
