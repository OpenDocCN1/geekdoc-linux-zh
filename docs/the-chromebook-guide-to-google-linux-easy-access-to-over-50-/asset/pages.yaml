    # Google Bridge Software


    Containers require bridge software to properly communicate with the outside world.
    Google''s Chromebook container bridge software is called **cros-container-guest-tools.
    Bazel build** is used to build the bridge software. There is no single procedure
    for installing the cros-container-guest-tools that works across all Distros. Distros
    may have specific instructions on their web site, there are also YouTubes for
    several Distros. Penguin already contains the bridge software and can easily be
    cloned to create special purpose containers.


    # Dockers Containers Kubernetes


    Dockers are used to run applications. Containers are used to run operating systems.
    Kubernetes are used to run large numbers of Dockers and like Beowulfs often use
    computer clusters.'
