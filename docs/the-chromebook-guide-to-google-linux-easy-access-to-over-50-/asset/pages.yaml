  md: '# Tiddly Wiki Setup


    Create a Blank Wiki Project Folder template. These best practices can help prevent
    data lose.


    +   1) Create a Project Folder named Blank Wiki.


    +   2) From the downloads folder copy the empty and tiddlywiki html files into
    the Blank Wiki project folder.


    +   3) Rename tiddlywiki.html to Help.html


    +   4) In the Blank Wiki folder create two folders: Archive and Images.


    +   5) To start a new project copy the Blank Wiki folder and rename the folder
    and edit wiki.


    +   6) Before starting an edit session copy the Blank Wiki folder and rename the
    folder copy the wiki to the Archive folder. Rename it with a date prefix. Year
    Month Day YYYYMMDD is a good format. pets.html on 3/10/2022 would be 20220310pets.html.


    +   7) When editing save often. Saves are sent to the Downloads folder and numbered
    pets(1).html, pets(2).html, pets(3).html, the highest number is the most current.


    +   8) When done, copy the current save from the Downloads folder to the Project
    folder. Then delete the old wiki and rename the new wiki removing the (number).'
