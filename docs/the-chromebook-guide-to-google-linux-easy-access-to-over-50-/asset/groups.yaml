  - '[PAGE 77]


    # SOFTWARE


    A great strength of Linux is it''s infinite diversity. There is a saying in the
    Linux Community, "If you don''t like it, fork it." It is important to note, not
    every app will work on every computer. A visit to distrowatch.com can provide
    an idea of how many Distros there are. This chapter provides a taste of what Linux
    has to offer.


    Debian provides access to over 50,000 software packages. External repositories
    can be added to the list of Debian repositories. Many Linux software providers
    offer the most current versions of their software directly from their web sites.
    (Dot deb) .deb files can be downloaded and directly installed.


    Where a "Prefix" is noted, it is recommended to prefix the LXDE menu launch command
    with that "Prefix". CLI means the program is run through a terminal like LXTerminal,
    or Xterm. For slow or glitchy programs try using Sommelier, explained later in
    this chapter (Page 105).'
