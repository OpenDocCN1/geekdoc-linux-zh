  - '[PAGE 6]


    # INTRODUCTION


    “The Chromebook Guide to Google Linux”, TCGTL, is written for Chromebook users
    with Linux enabled Chromebooks. To verify a Chromebook is Linux enabled, enter
    the word “Linux” in the Settings search bar and press enter. If the search returns
    "Linux development environment", the Chromebook is Linux enabled. Schools and
    companies will likely block access to this feature.


    Access to Linux means access to over 50 thousand software packages. This book
    does not use any techniques that require rooting. Short configuration tweaks are
    used to provide access to Full Linux Desktops and Linux software Package Mangers.


    TCGTGL is written with the Linux beginner in mind. More advanced Linux users may
    find this a handy time saver and reference for dealing with the quirky nature
    of Chromebooks.'
  - '[PAGE 7]


    # WHAT’S A CHROMEBOOK


    Chromebooks once easily categorized as a web appliance for browsing the web have
    become a rather complex animal capable of running Linux, Android, and even Windows
    programs. The performance specs promoted by Google promote solid state design,
    long battery life, a very lean OS, and a keyboard layout while unique provides
    a standard. There are even 2 in 1 tablet / laptop Chromebooks.


    # Popular Computer History


    +   * 1947 AT&T creates the Transistor

    * 1958 TI invents Integrated Circuit

    * 1971 Intel creates the Microprocessor

    * 1974 AT&T announces Unix

    * 1974 MITS releases Altair 8800

    * 1975 Microsoft sells BASIC Interpreter'
  - '[PAGE 8]


    # The Chromebook Guide to Google Linux


    +   - 1977 Apple releases Apple II

    - 1981 IBM releases IBM PC

    - 1983 GNU Project - modern open source

    - 1984 Apple releases the Macintosh

    - 1985 ARM - Advanced RISC Machines

    - 1991 Linus Torvalds releases Linux

    - 1993 Internet opens to public

    - 1996 Debian Distro released

    - 2000 Apple releases Darwin

    - 2000 JetBrains – IntelliJ

    - 2005 One Laptop per Child

    - 2007 Apple releases iPhone

    - 2007 Asus releases the EEE PC

    - 2008 Google phones available

    - 2008 LXC - Linux Containers - first released

    - 2011 Google Chromebooks available

    - 2012 Raspberry Pi released ($35)

    - 2013 Dockers - first released

    - 2018 Chromebooks are able to run Linux

    - 2019 Google switches to JetBrains Kotlin

    - 2020 COVID

    - 2021 Chromebook Linux no longer in Beta


    # Chromebooks in 2022


    Chromebooks have been becoming larger, 14” and even 16” models are common with
    larger screens and keyboards. A good base system will have a 4 core Intel or 8
    core ARM processor with at least 4GB of memory, 64GB of storage, a minimum of
    1 USB-C port and a battery life of at least 8 hours. $200 is a fair minium starting
    price. Always look up the model id and check the EOL, End Of Life. With high priced
    models check for over heating concerns and battery life.'
  - '[PAGE 9]


    # The Chromebook Guide to Google Linux


    Chromebooks originally targeted at schools, tend to have a very long battery life.
    Chrome OS has excellent second monitor and virtual desktop support. Not all apps
    will run on all computers and not all hardware works with all computers. Generally
    the type of CPU will not be an issue. There are however special situations that
    require a specific type of CPU. If purchasing a new Chromebook to run a specific
    software package, be sure to check the requirements.


    # What''s the catch?


    The Chrome OS boot loader is a non-standard boot loader, which means it is not
    always possible to replace Chrome OS. Chromebooks have a set End Of Life, not
    a very green policy. Some USB connected devices will not work. Bluetooth files
    transfers do not work. Google''s revenue model is built on collecting and monetizing
    as much personal information as possible.


    # Software


    In all the world there is no greater software value, than in Linux, often called
    GNU Linux. There are endless Linux Distros, Linux Distribution (Collections of
    Linux Software) with commercial industrial grade software. Software for every
    need; 3D printing, CAD, mathematics, publishing, office software, games, and so
    much more. If there''s a need, there is likely a software package. A visit to
    the distrowatch.com web site can provide an idea of just how many Linux Distros
    there are.'
- md: "\n# Linux on Chromebooks\n\nBy default Linux enabled Chromebooks will load\
    \ Penguin, a custom Linux Container version of Debian Linux. Things like WiFi\
    \ will work through Chrome OS. If Chrome OS is connected to WiFi, then Linux is\
    \ connected to WiFi. Linux has several desktops to choose from, this book will\
    \ cover LXDE and i3wm. Six software package managers will be covered, but focus\
    \ will be given to Synaptic. Starting and stopping Linux under Chrome OS works\
    \ a little different than just running Linux, but it is still a fast and easy\
    \ process. There is a nested structure to running Linux on Chrome OS. Penguin\
    \ runs inside the Termina Virtual Machine, which runs inside Chrome OS.\n\n# Nested\
    \ Structure\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_10_0.png)\n\nNested Structure\
    \ of Linux on Chrome OS\n\n# WORKING WITH CHROMEBOOKS\n\nWorking with Chromebooks\
    \ is very different from working with other computers. Chromebook's interface\
    \ works through special URLss. The Chromebook keyboard while very unique, is very\
    \ functional. The Chromebook Touchpad lacking a simple right click, is simply\
    \ annoying.\n\n# Chromebook Touchpad\n\nTo perform a right click on a Chromebook,\
    \ press the Touchpad with two fingers. Using an External Mouse or Touchpad will\
    \ allow you to right click. To perform the action of a scroll wheel, slide two\
    \ fingers up and down the Touchpad.\n\n# Linux Mouse Pointer\n\nIf the Linux **mouse\
    \ pointer** disappears or fails to show at start up, press the **Fullscreen**\
    \ key, then move the **mouse pointer** down the screen. The **mouse pointer**\
    \ should show, press the **Fullscreen** key again to restore the screen.\n\n#\
    \ Line Under Display\n\nIf there is a line under the current screen. Most likely\
    \ a white line at the bottom of a black display, press the **Show windows** key\
    \ twice, with a pause in between.\n\n# Screen Tearing\n\nSome Chromebooks will\
    \ experience Screen Tearing while running Linux. Pressing the **Fullscreen** key\
    \ twice provides a quick short term fix. Repeat as needed.\n\n# Runaway Backspace\n\
    \nIn the event work starts to vanish from a document while working, as though\
    \ the **Backspace** key were pressed. Press the **Esc** key and try to restore\
    \ the lost work using the program's undo function or try **Ctrl** + Z.\n\n# Chrome\
    \ OS Function Keys\n\nAs of the writing of this book, the full use of all F12\
    \ function keys requires the setting of a flag to work. Open the Chrome OS Browser.\
    \ Go to the URL: chrome://flags. In the Search Box, enter improved keyboard shortcuts\
    \ should be one flag. If this should stop working, possible after update: **Enable**\
    \ the flag and reboot, then **Disable** the flag and reboot again.\n\nChrome OS\
    \ keyboard controls may not be available while in Linux Desktop Environment. Press\
    \ the Show windows key then again. The keys left to right across the top of Chromebook\
    \ keyboard are, Esc, Previous Page, Next Page, Reload Page, Fullscreen, Show windows,\
    \ Dim Display, Brighten Display, Mute, Volume Down, Volume Up, The Search key\
    \ has a magnifying glass on it. Chromebooks work well with external keyboards.\
    \ USB-C port only require a USB-C adapter or USB-C HUB.\n\n# Chrome OS Keyboard\n\
    \nEsc Often used as a quick exit.\n- Esc\n- Previous Page\n- F1\n- Next Page\n\
