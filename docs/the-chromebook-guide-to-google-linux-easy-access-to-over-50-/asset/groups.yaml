    # QUICK REFERENCE


    Chromebook''s streamlined rugged design combined with one button Linux install
    offers historic easy of access to over 50 thousand software packages. Access to
    tried and tested software like LibreOffice, Gimp, Blender, FreeCAD, and Python.


    The focus of this book is access and achieving the best user experience. How to
    start a Full Linux Desktop under Chrome OS. Fixing Software Package Managers that
    provide access to software. And, tweaking program launch commands to provide the
    best experience.


    Want to know more? The Debian Handbook can be installed using Synaptic, install:
    debian-handbook. Open the index.html file with Firefox:


    ```

    /usr/share/doc/debian-handbook/html/en-US/index.html

    ```


    Explore the debian.org and chromium.org web sites.'
  - '[PAGE 166]


    # Quick Reference Troubleshooting


    Never panic, Chromebooks and Linux are very robust.


    +   1) Restart Linux.


    +   2) Reboot the Chromebook.


    +   3) Check for updates.


    +   4) Fix the Chrome OS Terminal first.


    +   5) If there was a recent config change, undo it.


    +   6) If there was a recent program install, uninstall it.


    +   7) Google error messages and symptoms.


    +   8) Check the system logs for messages.


    +   9) If Linux will not start at all, for example if the Termina virtual machine
    is broken. Remove Linux, Install Linux and restore Linux from the last backup
    (Page 50). See Saving Data Outside of a Container (Page 49).


    +   10) For Port issues, delete all forwarded ports, reboot and re-add needed
    port(s). Settings: Linux port forwarding \sudo lssof -i -P -n | grep LISTEN


    +   11) For file sharing issues, remove all file shares, reboot and re-add needed
    file shares. Settings: Linux shared folders'
