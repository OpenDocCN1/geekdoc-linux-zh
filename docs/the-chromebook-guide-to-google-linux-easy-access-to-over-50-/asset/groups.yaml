- md: "\n# The Chromebook Guide to Google Linux\n\n## KDE Plasma Discover – Software\n\
    \n![](img/b7499e434c2bd9c15bf347d1647edb1b_122_0.png)\n\n## KDE Plasma Discover\n\
    \nInstall: plasma-discover\n\n**Description:** For both LXDE and i3wm do a \"\
    sudo apt update\" from the command line and a reboot after installing. If KDE\
    \ Plasma Discover does not populate with software repeat the apt update and reboot\
    \ as needed.\n\n**Prefix:** `env GDK_BACKEND=x11`\n\n- **LXDE:** Menu → System\
    \ Tools → Discover\n- **i3wm:** di - Discover\n\n## ENNOTEBOOKS\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_123_0.png)\n\
    \nTiddly Wiki is an eNotebook that runs on everything. It's great for school notes,\
    \ recipes, photo albums, anything that might be done with a paper notebook. Tiddly\
    \ Wiki is key word searchable and is easy to stylize. Tiddly Wiki is a self-editing\
    \ HTML page that runs in a browser. Tiddly saves are sent to the download folder.\
    \ An empty wiki is about 2M, the Tiddly Wiki web site wiki is about 6M. Tiddly\
    \ Wiki does not require an internet connection to function. Using Firefox go to\
    \ tiddlywiki.com At the top right:\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_124_0.png)\n\
    \nCreate Tiddler, Control Panel, Save Changes\n\nClick on the Plus Sign under\
    \ the Tiddly Wiki title. The Save Changes icon will turn red.\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_124_1.png)\n\
    \nSave Changes icon turns red.\n\nClick on the Save Changes icon to save the Tiddly\
    \ Wiki web site wiki to the Downloads folder.\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_125_0.png)\n\
    \nDownload Empty button\n\nSlide down the page to the **Download Empty** button\
    \ and click it to download an empty Tiddly Wiki to the Downloads folder. Close\
    \ Firefox.\n\nIf not already installed, from Synaptic, install:\n\n- cups\n- printer-driver-cups-pdf\n\
    - pdftk\n- imagemagick\n\n## Firefox Print Dialog Fix\n\nThe System Print Dialog\
    \ does a better job than the Firefox Print Dialog. Open Firefox.\n\nEnter **about:config**\
    \ in the search bar. Click the **Accept the Risk and Continue** button. In the\
    \ **Search preference name bar** enter:\n`print.tab`\nThe **print.tab_modal.enabled**\
    \ switch will display. Click the **Toggle** to right, setting it to **false**.\n\
    \n## Tiddly Wiki Setup\n\nCreate a Blank Wiki Project Folder template. These best\
    \ practices can help prevent data lose.\n\n- 1) Create a Project Folder named\
    \ Blank Wiki.\n- 2) From the downloads folder copy the empty and tiddlywiki html\
    \ files into the Blank Wiki project folder.\n- 3) Rename tiddlywiki.html to Help.html\n\
    - 4) In the Blank Wiki folder create two folders: Archive and Images.\n- 5) To\
    \ start a new project copy the Blank Wiki folder and rename the folder and edit\
    \ wiki.\n- 6) Before starting an edit session copy the Blank Wiki folder and rename\
    \ the folder copy the wiki to the Archive folder. Rename it with a date prefix.\
    \ Year Month Day YYYYMMDD is a good format. pets.html on 3/10/2022 would be 20220310pets.html.\n\
    - 7) When editing save often. Saves are sent to the Downloads folder and numbered\
    \ pets(1).html, pets(2).html, pets(3).html, the highest number is the most current.\n\
    - 8) When done, copy the current save from the Downloads folder to the Project\
    \ folder. Then delete the old wiki and rename the new wiki removing the (number).\n\
    \n## Tiddly Wiki in Action\n\nCopy the Blank Wiki project folder and rename the\
    \ folder to Pets. Rename the empty.html file to Pets.html.\n\nPlace an image in\
    \ the Image folder any image will do.\n\nDouble click on Pets.html, it should\
    \ open in Firefox. If not from pcmanfm, right click on Pets.html, select **Properties**\
    \ and make sure it is set to **Open with** Firefox.\n\nThe **GettingStarted**\
    \ Tiddler will be open. Click the X at the top right of the Tiddler, to close\
    \ it.\n\nClick the + Plus sign under **My TiddlyWiki** to create a new Tiddler.\n\
    \nThe default **New Tiddler** name will be highlighted. Change the name to **Dogs**.\n\
    \nJust under the Tiddler name, enter a **tag name**. Enter **Dogs**, and press\
    \ the **Add** button.\n\nAt the bottom set the **Type** to **TiddlyWiki 5(text/vnd.tiddlywiki).**\n\
    \n# The Chromebook Guide to Google Linux\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_128_0.png)\n\
    \nIn the **Type the text for this tiddler** section, enter the following. There\
    \ is a space before **width** and after **50%**. There is a blank line after `</p>`\
    \ use your image name in place of **dog.png**:\n\n!Dogs\n---\n\n<p>Best Friends\
    \ for Life!</p>\n\n- Playful\n- Great walking companions\n- Always ready to listen\n\
    \n<center> [img width=50% [Images/dog.png]] </center>\n\n## Dogs\n\n## My TiddlyWiki\n\
    \n## Dogs\n\nBest Friends for Life!\n\n- Playful\n- Great walking companions\n\
    - Always ready to listen\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_129_0.png)\n\
    \nRendered Tiddler\n\nClick the **Check Mark** at the top right of the Tiddler.\
    \ The Tiddler will be rendered. Click the red Save changes icon to save the wiki\
    \ to the download folder. Give the download a moment to finish, check the download\
    \ progress before closing the wiki. Remember saves are sent to the Downloads folder.\n\
    \nOpen the **Help.html** file in Firefox. On the right side, click the **Contents**\
    \ tab. Select **Working with TiddlyWiki**, this is a good place to start. Tiddly\
    \ Wiki has been around since 2004 and even has an entry in Wikipedia. Googling\
    \ Tiddly Wiki will produce pages of results. There are numerous YouTubes dedicated\
    \ to Tiddly Wiki.\n\nTo change the color palette, click the **Control Panel**\
    \ gear then select the **Appearance** tab and then the **Palette** tab.\n\n##\
    \ Tiddly Wiki Page Breaks\n\nPage breaks are necessary for controlling page layout\
    \ when printing. Before page breaks can be used, the feature must be added to\
    \ the theme's base Tiddler.\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_130_0.png)\n\
    \nControl Panel → Appearance tab → Theme tab\n\nFind the theme being used. Click\
    \ on the Control Panel, select the Appearance tab. Above the theme being used\
    \ is:\nVanilla theme\n\nThe Theme's base Tiddler must be edited.\n\n## Finding\
    \ a Base Tiddler\n\n| Open | Recent | Tools |\n|---|---|---|\n| All | $:/Acknowledgements\
    \ | |\n| Recent | $:/AdvancedSearch | |\n| Tags | $:/config/AnimationDuration\
    \ | |\n| Missing | $:/config/AutoSave | |\n| Drafts | $:/config/BitmapEditor/Colour\
    \ | |\n| Orphans | $:/config/ImageSizes | |\n| Types | $:/config/LineWidth | |\n\
    | System | $:/config/LineWidths | |\n| Shadows | $:/config/Opacities | |\n| Explorer\
    \ | $:/config/Opacity | |\n| Plugins | $:/config/DefaultSidebar | |\n| | $:/config/DownloadSaver\
    \ | |\n\n**More** top tab → **Shadows** side tab\n\nClick on the **More** top\
    \ tab and then the **Shadows** tab.\n\n```\n$:/temp/search\n$:/themes/tiddlywiki/snowwhite/base\n\
    $:/themes/tiddlywiki/vanilla/base\n$:/themes/tiddlywiki/vanilla/metrics/bodyfontsize\n\
    ```\n\nSlide down to the theme's base Tiddler.\n\n## Tiddly Wiki Using Page Breaks\n\
    \nClick on the theme's base Tiddler and edit it.\n\n```\n$:/themes/tiddlywiki/<theme-name>/base\n\
    ```\n\nAdd the following to the bottom of the file:\n\n```\n.page-break {\n  page-break-after:\
    \ always;\n}\n```\n\nAdd the following to a Tiddler to cause a page break:\n\n\
    ```\n@@.page-break\n<p></p>\n@@\n```\n\n## Firefox Headers and Footers\n\nFirefox\
    \ headers and footers can be set from the Print Dialog or about:config settings.\n\
    \nCtrl + P, Select the Options tab. Select a value from the pull down. If a value\
    \ is already set to Custom, set it to blank, then go back to Custom.\n\nOR\n\n\
    Enter about:config in the search bar. Click the Accept the Risk and Continue button.\
    \ In the Search preference name bar enter: `print.print_head` or `print.print_foot`\n\
    \nThe values can be left blank, static text, or any of the following:&P (And Capital\
    \ P) for Page number. &PT (And Capital PT) for Page with Total. &D (And Capital\
    \ D) for Date and Time. &T (And Capital T) for Page Title. &U (And Capital U)\
    \ for URL.\n\nDefaults are: Top Left: Title Top Right: URL Bottom Left: Page #\
    \ of # Bottom Right: Date/Time\n"
  mdcn: "\n\n# Chromebook Google Linux 指南\n\n## KDE Plasma Discover – 软件\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_122_0.png)\n\
    \n## KDE Plasma Discover\n\n安装：plasma-discover\n\n**描述：** 对于 LXDE 和 i3wm，请在命令行中执行\
    \ \"sudo apt update\" 并在安装后重启。如果 KDE Plasma Discover 没有显示软件，请根据需要重复执行 apt update\
    \ 并重启。\n\n**前缀：** `env GDK_BACKEND=x11`\n\n- **LXDE:** 菜单 → 系统工具 → Discover\n\
    - **i3wm:** di - Discover\n\n## 电子笔记本 (ENNOTEBOOKS)\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_123_0.png)\n\
    \nTiddly Wiki 是一个运行在任何设备上的电子笔记本。它非常适合学校笔记、食谱、相册，以及任何可以用纸质笔记本完成的内容。Tiddly Wiki\
    \ 支持关键词搜索且易于样式化。Tiddly Wiki 是一个在浏览器中运行的自编辑 HTML 页面。Tiddly 保存会发送到下载文件夹。空的 wiki\
    \ 约 2M，Tiddly Wiki 网站 wiki 约 6M。Tiddly Wiki 不需要联网即可运行。使用 Firefox 访问 tiddlywiki.com。右上角：\n\
    \n![](img/b7499e434c2bd9c15bf347d1647edb1b_124_0.png)\n\n创建 Tiddler（词条）、控制面板、保存更改\n\
    \n点击 Tiddly Wiki 标题下的加号。保存更改图标将变为红色。\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_124_1.png)\n\
    \n保存更改图标变为红色。\n\n点击保存更改图标将 Tiddly Wiki 网站 wiki 保存到下载文件夹。\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_125_0.png)\n\
    \n下载空白按钮\n\n向下滚动页面到 **Download Empty**（下载空白）按钮并点击它，将空的 Tiddly Wiki 下载到下载文件夹。关闭\
    \ Firefox。\n\n如果尚未安装，通过 Synaptic 安装：\n\n- cups\n- printer-driver-cups-pdf\n- pdftk\n\
    - imagemagick\n\n## Firefox 打印对话框修复\n\n系统打印对话框比 Firefox 打印对话框更好。打开 Firefox。\n\n\
    在搜索栏输入 **about:config**。点击 **Accept the Risk and Continue**（接受风险并继续）按钮。在 **Search\
    \ preference name bar**（搜索偏好名称栏）中输入：\n`print.tab`\n将显示 **print.tab_modal.enabled**\
    \ 开关。点击切换设置为 **false**。\n\n## Tiddly Wiki 设置\n\n创建一个 Blank Wiki 项目文件夹模板。这些最佳实践有助于防止数据丢失。\n\
    \n- 1) 创建一个名为 Blank Wiki 的项目文件夹。\n- 2) 从下载文件夹将空的 html 和 tiddlywiki.html 文件复制到\
    \ Blank Wiki 项目文件夹中。\n- 3) 将 tiddlywiki.html 重命名为 Help.html\n- 4) 在 Blank Wiki\
    \ 文件夹中创建两个文件夹：Archive 和 Images。\n- 5) 要开始新项目，复制 Blank Wiki 文件夹并重命名文件夹以及编辑 wiki。\n\
    - 6) 在开始编辑会之前，复制 Blank Wiki 文件夹并重命名文件夹，将 wiki 复制到 Archive 文件夹。使用日期前缀重命名。年日月日 YYYYMMDD\
    \ 是一个很好的格式。2022/3/10 的 pets.html 应该是 20220310pets.html。\n- 7) 编辑时经常保存。保存会发送到下载文件夹并命名为\
    \ pets(1).html、pets(2).html、pets(3).html，数字最大的就是最新的。\n- 8) 完成后，从下载文件夹将当前保存复制到项目文件夹。然后删除旧的\
    \ wiki 并重命名新 wiki 以移除 (数字)。\n\n## Tiddly Wiki 战演示\n\n复制 Blank Wiki 项目文件夹并将文件夹重命名为\
    \ Pets。将 empty.html 文件重命名为 Pets.html。\n\n在 Image 文件夹中放入图片，任何图片均可。\n\n双击 Pets.html，它应该会在\
    \ Firefox 中打开。如果不是从 pcmanfm 打开的，右键点击 Pets.html，选择 **Properties**（属性）并确保设置为 **Open\
