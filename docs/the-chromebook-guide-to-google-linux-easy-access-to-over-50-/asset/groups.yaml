    描述：Kazam 是一个屏幕录制工具，可以录制全屏、窗口或区域。文件 → 选项可以设置偏。视频保存在用户目录的 Videos 文件夹中。要退出，左键点击托盘图标并选择退出
    或 结束录制。


    文档：man kazam, kazam --help


