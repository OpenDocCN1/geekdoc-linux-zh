  - "[PAGE 132]\n\n# Tiddly Wiki Using Page Breaks\n\nClick on the theme's base Tiddler\
    \ and edit it.\n\n```\n$:/themes/tiddlywiki/<theme-name>/base\n```\n\nAdd the\
    \ following to the bottom of the file:\n\n```\n.page-break {\n  page-break-after:\
    \ always;\n}\n```\n\nAdd the following to a Tiddler to cause a page break:\n\n\
    ```\n@@.page-break\n<p></p>\n@@\n```"
  - '[PAGE 133]


    # Firefox Headers and Footers


    Firefox headers and footers can be set from the Print Dialog or about:config settings.


    Ctrl + P, Select the Options tab. Select a value from the pull down. If a value
    is already set to Custom, set it to blank, then go back to Custom.


    OR


    Enter about:config in the search bar. Click the Accept the Risk and Continue button.
    In the Search preference name bar enter: `print.print_head` or `print.print_foot`


    The values can be left blank, static text, or any of the following:&P (And Capital
    P) for Page number. &PT (And Capital PT) for Page with Total. &D (And Capital
    D) for Date and Time. &T (And Capital T) for Page Title. &U (And Capital U) for
    URL.


    Defaults are: Top Left: Title Top Right: URL Bottom Left: Page # of # Bottom Right:
    Date/Time'
- md: "\n# pdftk - PDF Toolkit\n\nPDF Toolkit is a toolkit for working with PDFs.\n\
    \nPDF Toolkit help:\n`pdftk --help`\n\nAssemble chapter PDFs to create a PDF called\
    \ book:\n`pdftk ch1.pdf ch2.pdf output book.pdf`\n\nSplit a PDF book into separate\
    \ PDF pages:\n`pdftk book.pdf burst`\n\n# ImageMagick\n\nImageMagick is a powerful\
    \ bitmap processing tool. It can also be used for splitting and merging PDFs.\n\
    \nImageMagick help:\n`convert --help`\n\nAssemble chapter PDFs to create a PDF\
    \ called book:\n`convert -density 300 ch1.pdf ch2.pdf book.pdf`\n\nSplit a PDF\
    \ book into PDF pages:\n`convert book.pdf page%03d.pdf`\n\n# Firefox Notepad\n\
    \nEnter the following line into the Firefox search bar to use Firefox as a notepad.\
    \ Click in the screen and type. To save a note, Ctrl + P and print to PDF. To\
    \ edit a PDF note, open the PDF in Firefox and copy the text back into the notepad.\
    \ The notepad can be bookmarked for convenience. PDF files are saved in the PDF\
    \ folder in the users home directory.\n\n```\ndata:text/html,<html contenteditable=\"\
    true\">\n<Title>Notepad</Title>\n```\n\nFor some older browsers, there is a slight\
    \ change. Still a single line, remove=\"true\".\n\n```\ndata:text/html,<html contenteditable=\"\
    true\">\n<Title>Notepad</Title>\n```\n\n# Firefox File Browser\n\nEnter the following\
    \ line into the Firefox search bar to use Firefox as a file browser. The browser\
    \ can be bookmarked for convenience. Drill down on home, <user-name>.\n\n```\n\
    file://\n```\n\n# Browser Configuration\n\nBrowsers often have advanced features\
    \ which do not have an obvious means of access. To access these settings enter\
    \ the following in the search bar.\n\nFirefox\n\n```\nabout:about\n```\n\nChrome\n\
    \n```\nchrome://about\n```\n\nEdge\n\n```\nedge://about\n```\n\n# Firefox Zoom\
    \ Fix\n\nIf Firefox jumps zoom levels while working.\n\nEnter **about:config**\
    \ in the search bar.\nClick the **Accept the Risk and Continue** button.\nIn the\
    \ **Search preference name** bar enter:\n**mousewheel.with_control.action**\n\
    Change the value from **3 to 0** (zero).\n\n# JUPYTER NOTEBOOK\n\nJupyter Notebooks\
    \ are interactive browser based notebooks which utilize Python and markdown (md)\
    \ text formatting. There are numerous addons and modifications available for Jupyter\
    \ Notebooks. Visit jupyter.org to learn more. There are also numerous YouTubes\
    \ on the subject.\n\nIf not already installed, from Synaptic install:\n- idle-python3.9\
