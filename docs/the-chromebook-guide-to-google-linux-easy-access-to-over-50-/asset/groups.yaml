    # 查找程序快速指南


    Synaptic 是查找程序名称和文件位置最简单的方法之一。可以通过 Chrome OS 终端应用启动 Synaptic：


    ```

    pkexec "/usr/sbin/synaptic"

    ```


    找到已安装的程序。点击一次选择它，然后点击“属性”（位于工具栏右上角）。最大化程序的属性弹出窗口。选择“安装的文件”（Installed Files）选项卡。可以在那里找到文件名和位置。


    大多数程序都可以从 Chrome OS 终端启动。当程序的启动设置导致桌面崩溃时，这种方法非常有帮助。从终端启动程序并修正设置。如果程序无法修复，可以使用
    Synaptic 删除。


    程序启动命令可以在 `~/.local/share/applications/` 和 `/usr/share/applications/` 目录下的 .desktop
    文件中找到。


    ```

    cat <name>.desktop | grep Exec

    ```


    # 最佳实践快速指南


    最佳实践可以大大减少从问题中恢复所需的时间和工作。


    在工作期间，将文件名带有版本号保存通常很有帮助。例如 myfile1.txt, myfile2.txt, myfile3.txt。工作时要频繁保存。


    至少在长时间工作后备份项目文件。


    每月至少备份一次系统。


    在更改配置或安装新软件之前备份系统。


    在编辑配置文件之前，将其复制为 .bak 文件。根据需要使用版本号，如 .bak1, .bak2, .bak3 等。


    使用外部媒体进行备份。交替使用媒体，确保所有当前备份不在同一介质上。


    将关键文件保存在 Chromebook 备份之外，以便其他系统读取。


    考虑“在容器外保存数据”，见第 49 页。


    # 桌面环境快速指南


    更新 Debian Linux：


    ```

    sudo apt update -y

    sudo apt dist-upgrade -y

    ```


    安装 Nano 编辑器：


    ```

    sudo apt install nano -y

    ```


    安装 Xephyr - 嵌套 X 服务器：


    ```

    sudo apt install xserver-xephyr -y

    ```


    安装 LXDE 和 i3wm 桌面：


    ```bash

    sudo apt install task-lxde-desktop -y

    sudo apt install i3 -y

    ```


    LXDE 启动脚本 ~/gol.sh:


    ```bash

    #!/bin/bash

    Xephyr -br -fullscreen -resizeable :20 & sleep 5

    DISPLAY=:20 startlxde &

    ```


    i3wm 启动脚本 ~/goi.sh:


    ```bash

    #!/bin/bash

    Xephyr -br -screen 1080x675 -resizeable :30 & sleep 5

    DISPLAY=:30 i3 &

    ```


    三个推荐的前名前缀选项：


    - 1) 无前缀。

    - 2) env GDK_BACKEND=x11 <program-name>

    - 3) sommelier -X --scale=.5 --glamor --frame-color=#000000 <program-name>


    # LXDE 启动快速指南


    启动：

    运行**Terminal** 应用。

    从终端菜单选择 **Penguin**。

    ./gol.sh

    如有需要按全屏。


    关闭（LXDE 随终端关闭）：

    退出任何正在运行的 Linux 程序。

    右键点击**Terminal** 图标并选择 **Shut down Linux**。


    # 从 Crosh 访问 LXDE 快速指南


    从 Chrome OS Chrome 浏览器：

    访问 URL：

    **chrome-untrusted://crosh**


    ```

    启动:

    vmc start termina

    lxc start penguin

    lxc exec penguin su - <user-id>

    ./gol.sh

    关闭:

    exit

    lxc stop penguin

    exit

    vmc stop termina

    ```


    # Chrome 浏览器快速指南


    Chrome 浏览器 URL：

    chrome://about - Chrome URL 完整列表

    file://home/chronos/user/MyFiles/

    file:///home/chronos/user/Downloads/


    安装 Linux 后：chrome-untrusted://crosh - Chrome OS 壳

    chrome-untrusted://terminal - Linux 终端


    chrome://flags F1 至 F12 使用 Search + (1 至 =) 实现。F10 = Search + o (零) F11 = Search
    + - (破折号)，F12 = Search + = 标记：改进的快捷键。禁用该标记并重启。如果此功能失效（可能在更新后发生）：启用标记并重启，然后禁用标记并重启。


    管理额外容器：标记：Allow multiple Crostini multi. 启用该标记并重启。


    如果 Chromebook 标记设置在更新后损坏，取消设置标记并重启。然后重新设置标记并重启。


    # Firefox 浏览器快速指南


    Firefox 浏览器 URL：

    **about:about** - Firefox URL 完整列表

    file://

    data:text/html,<html contenteditable="true">

    <Title>Notepad</Title>


    **about:config**

    使用系统打印对话框。

    标记：**print.tab_modal.enabled** 设置为 **False**。


    设置页眉页脚。

    标记：**print.print_head** / **print.print_foot**

    空白、静态文本或以下任何内容：

    &P, &PT, &D, &T, &U


    在工作时停止随机缩放级别。

    标记：**mousewheel.with_control_action**

    将值从 **3** 改为 **0**（零）。


    使用 IPP 的打印机通常带有嵌入式 Web 服务器。

    复制 ipp:// 和 :631 之间的所有内容，将其粘贴到浏览器的搜索栏中。从终端执行：

    ippfind


    # CLI 快速指南


    - help

    - man <command>

    - env

    - history

    - whoami

    - touch <file>

    - cp <from> <to>

    - mv <from> <to>

    - rm <file>

    - ls

    - ls -la

    - cd <directory>

    - cd ..

    - mdir <directory>

    - pwd

    - rm -r <directory>

    - which <program>

    - cat <file>

    - cat >> <file>

    - sudo chmod +x go.sh

    - sudo pcmanfm

    - password

    - sudo passwd <id>

    - sudo usermod -aG <g> <u>

    - groups

    - sudo dmesg


    BASH 帮助

    - 手册帮助

    - 环境

    - 历史记录

    - 显示用户

    - 创建文件

    - 复制文件

    - 移动/重命名文件

    - 删除文件

    - 列出文件

    - 所有详情

    - 切换目录

    - 返回上级目录

    - 创建目录

    - 当前目录

    - 删除目录

    - 显示位置

    - 读取文本文件

    - 写入文本文件

    - 追加 Ctrl+D

    - 设置可执行

    - SU 文件管理器

    - 设置密码

    - 设置 <id> 密码

    - 将用户加入组

    - 显示用户组

    - 显示内核日志


    '
