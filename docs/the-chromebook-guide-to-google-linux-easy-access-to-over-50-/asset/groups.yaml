  - '[PAGE 55]


    # Backup Linux


    FAT32 formatted storage devices will not work with files larger than 4GB and should
    be reformatted to exFAT. Shutdown Linux and go to the **Linux development environment**.
    Click on **Backup & restore**. Click the **Backup** button. Select the location
    where the backup will be stored, the name can be changed. Click the **Save** button
    to start the backup. See Best Practices in the Quick Reference section (Page 164).
    This method of backing up Linux will **not** backup Shared Chrome OS directories.
    Shared directories can be copied using the Chrome OS Files App.


    If **Manage extra containers** (Page 151) has been enabled and used to create
    containers, the container to be backed up will need to be selected from a pull-down
    menu.


    # Restore Linux


    Shutdown Linux and go to the **Linux development environment**. Click on **Backup
    & restore**. Click the **Restore** button. A **Confirm Restore** panel will pop
    up, click the **Restore** button to continue. Select the backup file to be used
    and click the **Open** button. The restore will start.


    If **Manage extra containers** (Page 151) has been enabled and used to create
    containers, the container to be restored will need to be selected from a pull-down
    menu.'
  - '[PAGE 56]


    # CLI


    There are two primary styles of interfaces; GUI, Graphic User Interface and CLI,
    Command Line Interface. For some tasks a CLI is the only way a task can be performed.
    CLI is also faster for some tasks.


    # Running Scripts


    Commands that can be entered in a Linux terminal can be entered into a file and
    run as a script, often called a BASH script. help provides help for built-ins
    (commands which are not themselves programs). From LXTerminal:


    ```

    help

    bash -c help

    help -help

    man bash

    Q

    which bash

    ```'
  - '[PAGE 57]


    sudo su

    Tab Tab

    Y

    Hold down Enter or Q to Quit

    exit


    echo prints to a terminal. > sends output to a file. >> appends output to a file.
    $HOME is a variable that holds the user''s home directory. ~ is short for $HOME.
    rm removes, deletes a file. cp copies a file. mv moves or renames a file. Enter
    the following in LXTerminal:


    ```

    echo "neofetch" > test.sh

    echo "neofetch" > test.sh

    echo "screenfetch" >> test.sh

    cat test.sh

    bash test.sh

    ./test.sh              Will fail.

    chmod +x test.sh      Make executable.

    ./test.sh               Will work.

    pwpd

    echo $HOME

    echo ~

    ~/test.sh

    ls

    cp test.sh test2.sh

    ls

    mv test.sh test2.sh

    rm test2.sh

    ls

    ```'
  - '[PAGE 58]


    # Directories


    Directories also called folders provide a hierarchical structure for organizing
    files. **cd**, change directory, command is used to move between directories.
    **cd ..** is used to move up a directory structure. **mkdir** is used to make
    a directory. Use single or double quotes when a directory name contains a space.
    **rm -r** will remove a directory and any files or directories in it. **touch**
    will create an empty file.


    From LXTerminal:


    ```

    mkdir numbers

    ls

    cd numbers

    touch one

    touch "two three"

    ls

    cd ..

    ls

    rm -r numbers

    ls

    ```'
  - '[PAGE 59]


    # Networks


    Modern networks assign an address to a device much like an apartment building
    has an address. Device port numbers are like apartment numbers. An application
    may use one or more ports of a computer''s address. URL prefixes like http, data,
    file, and https are URI schemes which define the purpose of the URL. https://127.0.0.1:631
    is an IPv4 formatted address that tells a browser to look for a web page (https)
    on the local machine (127.0.0.1 means the machine itself) on port 631 which is
    used by CUPS. IPv6 is the new version of IP Internet Protocol. To see your IP
    address as seen from the internet go to a search engine such as google.com or
    start.duckduckgo.com and search on "my ip". The search engine will show your IP
    as seen from the internet. While there search on "my user agent". The user agent
    is your browser and OS information. Firefox allows a User Agent to be set manually,
    it is preferable not to change this.


    Display the User Agent from Firefox: Firefox Menu → More Tools → Web Developer
    Tools Select the Console tab Enter:


    ```

    navigator.userAgent

    ```


    Linux is connected to the Chromebook network through bridge software. The Chromebook
    may be connected to a router or tethered to another device. Different levels of
    a network may use different IP addresses. hostname -I shows the network addresses
    of the host. ip add show will show all network addresses. lsof can be used to
    show all open ports. | pipes the output from lsof to grep is used to filter the
    output.'
