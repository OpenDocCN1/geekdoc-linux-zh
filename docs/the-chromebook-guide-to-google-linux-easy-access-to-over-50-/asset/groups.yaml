    \ Right click the Tray icon or inside a note and select Help.\n\n**Prefix:** env\
    \ GDK_BACKEND=x11\n\n**LXDE:** Menu → Accessories → Xpad\n\n**i3wm:** xp - Xpad\n\
    \n# QUICK REFERENCE\n\nChromebook's streamlined rugged design combined with one\
