    # Quick Reference Fixing Terminal


    While starting Terminal, on occasion you may have a re-occurring error, such as;
    "can''t open display :2". To clear the error try the following:


    +   1) First try:

    From the Chrome OS Chrome Browser:

    From the Crosh URL:

    `chrome-untrusted://crosh`

    vmc stop termina


    +   2) If that fails then:

    From the Chrome OS Chrome Browser

    From the URL:

    `chrome-untrusted://crosh`

    vmc start termina

    lxc stop penguin

    exit

    vmc stop termina


    +   3) If that fails, last try :

    From Terminal:

    Select Penguin from the Terminal menu.

    sudo halt

    Restart Terminal and select Penguin, then do:

    `Ctrl + C`

    From the Chrome OS Chrome Browser:

    From the Crosh URL:

    `chrome-untrusted://crosh`

    vmc stop termina


    +   4) Reboot the Chromebook, start at step one.'
- md: '

    # Quick Reference Finding Programs


    Synaptic is one of the easiest ways to find a program''s name and file locations.
    Synaptic can be started from the Chrome OS Terminal app:


    ```

    pkexec "/usr/sbin/synaptic"

    ```


    Find the installed program. Select it by clicking on it once, then click on Properties
    (Toolbar top right.) Maximize the program''s Properties pop up window. Select
    the Installed Files tab. File names and locations can be found there.


    Most programs can be started from Chrome OS Terminal. This can be helpful when
    a program''s startup setting causes a Desktop to crash. Start the program from
    Terminal and correct the setting. If the program can not be fixed it can be deleted
    using Synaptic.


    Program start-up commands can be found in .desktop files in the ~/.local/share/applications/
    and /usr/share/applications/ directories.


    ```

    cat <name>.desktop | grep Exec

    ```


    # Quick Reference Best Practices


    Best Practices can greatly reduce the time and work required to recover from an
    issue.


    While working, it is often helpful to save a file name with a version number.
    For example myfile1.txt, myfile2.txt, myfile3.txt. Save often while working.


    At least, back up project files after working for long periods.


    Backup a system at least once a month.


    Backup a system before making configuration changes or installing new software.


    Before editing a configuration file, copy it to a .bak file. Use versions as needed,
    .bak1, .bak2, .bak3 etc .


    Use external media for backups. Alternate media so all current backups are not
    on the same media.


    Save critical files outside of Chromebook only backups, so they can be read by
    other systems.


    Consider “Saving Data Outside of a Container” see page 49.


    # Quick Reference Desktops


    Update Debian Linux:


    ```

    sudo apt update -y

    sudo apt dist-upgrade -y

    ```


    Install Nano editor:


    ```

    sudo apt install nano -y

    ```


    Install Xephyr - Nested X Server:


    ```

    sudo apt install xserver-xephyr -y

    ```


    Install LXDE and i3wm Desktops:


    ```

    sudo apt install task-lxde-desktop -y

    sudo apt install i3 -y

    ```


    LXDE Launch Script ~/gol.sh:


    ```bash

    #!/bin/bash

    Xephyr -br -fullscreen -resizeable :20 & sleep 5

    DISPLAY=:20 startlxde &

    ```


    i3wm Launch Script ~/goi.sh:


    ```bash

    #!/bin/bash

    Xephyr -br -screen 1080x675 -resizeable :30 & sleep 5

    DISPLAY=:30 i3 &

    ```


    Three recommended Prefix options:


    - 1) No prefix.

    - 2) env GDK_BACKEND=x11 <program-name>

    - 3) sommelier -X --scale=.5 --glamor --frame-color=#000000 <program-name>


    # Quick Reference LXDE Startup


    Startup:

    Run the **Terminal** App.

    Select **Penguin** from the Terminal menu.

    ./gol.sh

    Press Fullscreen if needed.


    Shutdown (LXDE shuts down with Terminal):

    Exit any running Linux programs.

    Right click on the **Terminal** icon and select **Shut down Linux.**


    # Quick Reference LXDE from Crosh


    From the Chrome OS Chrome browser:

    Go to the URL:

    **chrome-untrusted://crosh**


    ```

    Startup:

    vmc start termina

    lxc start penguin

    lxc exec penguin su - <user-id>

    ./gol.sh

    Shutdown:

    exit

    lxc stop penguin

    exit

    vmc stop termina

    ```


    # Quick Reference Chrome Browser


    Chrome Browser URL''s:

    chrome://about - Full list of Chrome URL''s

    file://home/chronos/user/MyFiles/

    file:///home/chronos/user/Downloads/


    After Linux has been installed: chrome-untrusted://crosh - Chrome OS Shell

    chrome-untrusted://terminal - Linux Terminal


    chrome://flags F1 thru F12 are implemented using Search + (1 thru =). F10 = Search
    + o (Zero) F11 = Search + - (Dash), F12 = Search + = Flag: improved keyboard shortcuts.
    Disable the flag and reboot. If this should stop working, possible after an update:
    Enable the flag and reboot, then Disable the flag and reboot.


    Manage extra containers: Flag : Allow multiple Crostini multi Enable the flag
    and reboot.


    If a Chromebook flag setting breaks after an update, unset the flag and reboot.
    Then set the flag and reboot again.


    # Quick Reference Firefox Browser


    Firefox Browser URL''s:

    **about:about** - Full list of Firefox URL''s

    file://

    data:text/html,<html contenteditable="true">

    <Title>Notepad</Title>


    **about:config**

    Use System Print Dialog.

    Flag: **print.tab_modal.enabled** set to **False**


    Set Headers and Footers.

    Flags: **print.print_head** / **print.print_foot**

    Blank, static text, or any of the following:

    &P, &PT, &D, &T, &U


    Stop random zoom levels while working.

    Flag: **mousewheel.with_control_action**

    Change the value from **3** to **0** (zero).


    Printers using IPP often have an Embedded Web Server.

    Copy everything between ipp:// and :631, paste this into your browser''s search
    bar. From a terminal:

    ippfind


    # Quick Reference CLI


    - help

    - man <command>

    - env

    - history

    - whoami

    - touch <file>

    - cp <from> <to>

    - mv <from> <to>

    - rm <file>

    - ls

    - ls -la

    - cd <directory>

    - cd ..

    - mdir <directory>

    - pwd

    - rm -r <directory>

    - which <program>

    - cat <file>

    - cat >> <file>

    - sudo chmod +x go.sh

    - sudo pcmanfm

    - password

    - sudo passwd <id>

    - sudo usermod -aG <g> <u>

    - groups

    - sudo dmesg


    BASH help

    - Manual help

    - Environment

    - Previous commands

    - Show user

    - Create file

    - Copy file

    - Move / rename file

    - Delete file

    - List files

    - All with details

    - Change Directories

    - Up directory level

    - Make directory

    - Current directory

    - Delete directory

    - Show location

    - Read text file

    - Write text file

    - Append Ctl+D

    - Make executable

    - SU File Manager

    - Set user password

    - Set <id> password

    - Add User to Group

    - Show user groups

    - Display log


    **Using Synaptic** install: debian-refcard. The files will install here: /usr/share/doc/debian-refcard/
    gz files.


    **Open gz files with Xarchiver** (Menu → **Xarchiver**), then open the pdf with
    **qpdfview**.


