    \ user experience. How to start a Full Linux Desktop under Chrome OS. Fixing Software\
    \ Package Managers that provide access to software. And, tweaking program launch\
    \ commands to provide the best experience.\n\nWant to know more? The Debian Handbook\
    \ can be installed using Synaptic, install: debian-handbook. Open the index.html\
    \ file with Firefox:\n\n```\n/usr/share/doc/debian-handbook/html/en/index.html\n\
    ```\n\nExplore the debian.org and chromium.org sites.\n\n# Quick Reference Troubleshooting\n\
    \nNever panic, Chromebooks and Linux are very robust.\n\n- 1) Restart Linux.\n\
    - 2) Reboot the Chromebook.\n- 3) Check for updates.\n- 4) Fix the Chrome OS Terminal.\n\
    - 5) If there was recent config change, undo it.\n- 6) If there was a recent program\
    \ install, uninstall it.\n- 7) Google error messages and symptoms.\n- 8) Check\
    \ the system logs.\n- 9) If Linux will not start at all, for example if the Termina\
    \ virtual machine is broken. Remove Linux, Install Linux and restore Linux from\
    \ the last backup (Page 50). See Saving Data Outside of a Container (Page 49).\n\
    - 10) For Port issues, delete all forwarded ports, reboot and re-add needed port(s).\
    \ Settings: Linux port forwarding \\sudo lssof -i -P -n | grep LISTEN\n\n- 11)\
    \ For file sharing issues, remove all file shares, reboot and re-add needed file\
    \ shares. Settings: Linux shared folders\n\n# Quick Reference Fixing Terminal\n\
    \nWhile starting Terminal, on occasion you may have a re-occurring error, such\
