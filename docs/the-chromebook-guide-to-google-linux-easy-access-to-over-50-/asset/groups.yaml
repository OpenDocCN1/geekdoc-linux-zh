    Tools → Save Remdr options...\nHelp → help menu\n\nFile → Exit → From Commander\
    \ and R\nClick the Exit button.\n\n# Jupyter Notebook Configuration\n\nFrom LXTerminal:\n\
    \n```\ncd ~\nmkdir myynotebook\ncd myynotebook\njupyter notebook --help\njupyter\
