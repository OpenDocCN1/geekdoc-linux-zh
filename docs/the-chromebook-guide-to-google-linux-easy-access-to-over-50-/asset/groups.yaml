    cp test.sh test2.sh

    ls

    mv test.sh test2.sh

    rm test2.sh

    ls

    ```


    # Directories


    Directories also called folders provide a hierarchical structure for organizing
    files. **cd**, change directory, command is used to move between directories.
    **cd ..** is used to move up a directory structure. **mkdir** is used to make
    a directory. Use single or double quotes when a directory name contains a space.
    **rm -r** will remove a directory and any files or directories in it. **touch**
    will create an empty file.


    From LXTerminal:


    ```

    mkdir numbers

    ls

    cd numbers

    touch one

    touch "two three"

    ls

    cd ..

    ls

    rm -r numbers

    ls

    ```


    # Networks


    Modern networks assign an address to a device much like an apartment building
    has an address. Device port numbers are like apartment numbers. An application
    may use one or more ports of a computer''s address. URL prefixes like http, data,
    file, and https are URI schemes which define the purpose of the URL. https://127.0.0.1:631
    is an IPv4 formatted address that tells a browser to look for a web page (https)
    on the local machine (127.0.0.1 means the machine itself) on port 631 which is
    used by CUPS. IPv6 is the new version of IP Internet Protocol. To see your IP
    address as seen from the internet go to a search engine such as google.com or
    start.duckduckgo.com and search on "my ip". The search engine will show your IP
    as seen from the internet. While there search on "my user agent". The user agent
