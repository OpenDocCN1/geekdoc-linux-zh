    - 点击开关开启网络。

    - 关闭**网络设置**窗口。


    ## 更改程序图标


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_47_0.png)


    更改程序的图标。


    要更改程序的图标，右键点击菜单项并选择**属性**（Properties）。在**文件属性**窗口中点击程序图标，将打开**选择图标**（Choose An
    Icon）窗口。选择一个图标并点击确定按钮。


    **/usr/share/icons** 目录包含大量图标。通常需要深入几个目录才能找到图标。


    **/usr/share/images** 中的其他目录也可能包含图标。**images**目录包含几个 Debian 图标。


    # 打印与扫描


    打印机和扫描仪设置是自动的，同时也允许手动设置和配置。可以通过浏览器访问 CUPS 打印机界面。Xsane 可以扫描多页文档，并允许对扫描质量和类型进行详细控制。Chromebook
    和扫描仪/打印机应该处于同一个网络中。从 Synaptic 安装：


    ```

    cups

    printer-driver-cups-pdf

    ```


    使用 `whoami` 验证用户 ID，然后用 `usermod` 将用户 ID 添加到打印机管理组。从 LXTerminal：


    ```

    whoami

    sudo usermod -aG lpadmin <user-id>

    ```


    关闭并重启 Linux 以应用更改。


    # Chromebook Google Linux 指南


    ## 使用 CUPS 打印


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_49_0.png)


    打开 Firefox，然后访问并书签 URL：

    127.0.0.1:631（即 localhost:631）


    可以在此处手动添加打印机。打印机可以暂停和重启。输出可以重定向。可以在此处设置打印机默认。CUPS 在“首页”标签页打开。点击“打印机”（Printers）选项卡。点击打印机名称。从“维护”（Maintenance）下拉菜单中选择“打印测试页”（Print
    Test Page）。要设置默认选项：打印机 → 选择打印机 - 管理下拉拉菜单 → 设置默认选项（Set Default Options）。


    ## 使用 Xsane 扫描


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_50_0.png)


    启动时的 Xsane。


    启动 Xsane：


    LXDE 菜单 → 图形 → Xsane


    Xsane 启动时会打开四个窗口，但只需要两个。从主窗口的“窗口”（Window）菜单中，取消勾选“显示直方图”（Show histogram）和“显示标准选项”（Show
    standard options）。


    悬停在选项上会弹出描述该选项的提示框。可能的选项设置更改包括：扫描模式（Scan Mode）从线条图改为彩色，扫描分辨率（Scan Resolution）从
    75 改为 300。


    按下“获取预览”（Acquire preview）按钮将扫描并显示整个图像或选定的任何部分。按下“扫描”（Scan）按钮会扫描图像，然后图像将在查看器窗口（Viewer
    Window）中打开，可以在其中保存文件。


    多页扫描是一个两个步骤的过程。扫描将保存为单独的文件，并在完成后追加到所需的文件类型。按下 Ctrl + M 或将“目标”（Target）选项更改为“多页”（Multi-page）（右上），多页项目窗口。按下“扫描”按钮添加页面。完成后，在多页项目窗口中点击“保存多页文件”（Save
    multipage file）按钮。将扫描页数（Number of pages）设置为 1（主窗口左上）。


    # 嵌入式 Web 服务器


    使用互联网打印协议（IPP）的打印机通常具有嵌入式 Web 服务器（EWS）。打印机可能没有使用 IPP 或没有 EWS。如果有，这将是一个非常有用的功能。


    从 LXTerminal：

    ippfind


