    Is your Chromebook Linux enabled? Enter the word linux in the Chromebook Settings
    search bar and press enter. If the search returns Linux development environment,
    the Chromebook is Linux enabled, giving you access to Google''s custom Debian
    Linux Container.


    This book is written with the Linux Beginner in mind. The techniques used in this
    book do NOT require rooting. Advanced Linux Users may find this a handy time saver
    and reference for dealing with the quirky nature of Chromebooks.


    Short tweaks are used to take you from install to Full Linux Desktop Environment.
    This includes Linux Software Package Mangers that allow easy access to programs
    like LibreOffice, Gimp, Blender, FreeCAD, and Python.


    Coverage includes the LXDE and i3wm Desktops, six Software Package Mangers including
    Synaptic, Linux Containers, Tiddly Wiki, Jupyter Notebooks, and Linux on Android.


