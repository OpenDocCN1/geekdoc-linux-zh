    \ 将关闭 Userland。\n\n# Userland 文件位置：\n\n内部存储：\nDebian 内部： /internal\n安卓系统：/storage/Android\n\
    \n外部 SD 卡存储：\nDebian 内部： /sdcard\n安卓系统：/storage/sdcard\n\n在安卓上安装 Linux 的方法：\n\n\
    在安卓上安装 Linux 的方法：\n\n```\nsudo apt install -y\n```\n\n在安卓上安装 Linux 的方法：\n\n```\n\
    sudo apt install -y\n```\n\n在安卓上安装 Linux 的方法[img/749](img/749)\n\n# 修复终端\n\n在启动终端时，偶尔会遇到反复出现的错误，例如“无法打开显示器\
    \ :2”。要清除此错误请尝试以下操作：\n\n- 1) 首先尝试：\n从 Chrome 浏览器：\n从 Crosh 网址：\n`chrome-untrusted://crosh`\n\
    vmc stop termina\n\n- 2) 如果失败，则尝试：\n从 Chrome 浏览器\n从 URL：\n`chrome-untrusted://crosh`\n\
    vmc start termina\nlxc stop penguin\nexit\nvmc stop termina\n\n- 3) 如果仍然失败，最后尝试：\n\
    从终端：\n从终端 菜单选择 Penguin。\nsudo halt\n重启终端并选择 Penguin，然后执行：\n`Ctrl + C`\n从 Chrome\
    \ 浏览器：\n从 Crosh 网址：\n`chrome-untrusted://crosh`\nvmc stop termina\n\n- 4) 重启 Chromebook，从第一步开始。"
