  - '[PAGE 20]


    # INSTALLING LINUX


    Installing and removing Linux on a Linux enabled Chromebook is a short simple
    procedure. Fixing Linux Desktops so they run properly does NOT require rooting
    a Chromebook or any heavy hacking.


    # Install Linux


    Chromebooks install Linux in a Container, inside a Virtual Machine, under Chrome
    OS. A Crosh session runs outside the Container. A Terminal session runs inside
    a Container. A Terminal session can manually be started from a Crosh session.
    To Install Linux the Chromebook must be connected to the internet. Navigate to
    the Linux development environment in Settings. Type linux in the Settings Search
    Bar and press Enter. Or, in Settings: Advanced → Developers → Linux development
    environment.'
