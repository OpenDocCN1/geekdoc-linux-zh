    # Update Alternatives


    **Description:** Update Alternatives controls several important Debian settings.
    One of the lesser settings is browser preference. Many programs open their html
    based help files in the default browser. The default setting causes the process
    to fail.


    **Force the Default Browser to be Firefox.**


    ```

    From LXTerminal:

    sudo su

    update-alternatives --get-selections

    cd /usr/bin

    ls *

    cp garcon-url-handler garcon-url-handler.bak

    nano garcon-url-handler

    ```


    **Change the exec line:**


    ```

    From:

    exec /opt/google/cros-container/bin/garcon...

    To:

    exec /usr/bin/firefox-esr --client --url "$@"

    Ctrl + O

    Enter

    Ctrl + X

    Reboot the system.

    ```


    **Documentation:** man update-alternatives, update-alternatives --help


    **CLI:** Run from LXTerminal, XTerm, Terminal.'
