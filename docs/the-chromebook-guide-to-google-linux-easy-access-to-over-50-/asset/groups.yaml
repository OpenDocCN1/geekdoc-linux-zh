  - '[PAGE 118]


    # APT – Software


    **Description:** APT - Advanced Packaging Tool In addition to being able to search
    and download from the Debian repositories, can directly install opt deb software
    package files offered by some web sites:


    ```

    sudo apt install <file-name>.deb

    ```


    **Most used, prefix with sudo:**


    +   - apt update update package list

    - apt dist-upgrade upgrade the OS

    - apt upgrade upgrade everything

    - apt full-upgrade upgrade with delete

    - apt list <name> search by name

    - apt search <desc> search descriptions

    - apt show <name> show package details

    - apt install <name> install package

    - apt remove <name> remove package

    - apt satisfy <name> satisfy dependencies


    **Documentation:** man apt, apt --help


    **CLI:** Run from LXTerminal, XTerm, Terminal.'
