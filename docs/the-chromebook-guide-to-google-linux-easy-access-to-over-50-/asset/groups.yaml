    lxc launch images:archlinux/current arch\nlxc image list\n```\n\nCreate an alias\
    \ for the Arch Linux image. Place the mouse pointer at the front of the Archlinux\
    \ fingerprint id. Hold down the left Touchpad button while dragging the mouse\
    \ over the fingerprint to highlight it. Press Ctrl + Shift + C to copy the fingerprint.\n\
    \n```\nlxc image alias create myarc `Ctrl + Shift + V`\nlxc image list\nlxc image\
    \ info myarc\nlxc image delete myarc\nlxc list\nlxc stop arch\nlxc list\nlxc delete\
    \ arch\nlxc list\n```\n\n# Clone Penguin\n\nCreate a copy of the Penguin container,\
    \ log into it as root and then your <user-id>, and last delete it. A practical\
    \ use for this is testing software or configuration changes on the \"copy of Penguin\"\
    \ before making changes to Penguin itself. If a lot of programs have been installed,\
    \ Penguin may be very large and you may wish to skip this example. From a Termina\
    \ Terminal:\n\n```\nlxc list\nIf penguin is running stop it:\nlxc stop penguin\n\
    lxc list\nlxc copy penguin testbird\nlxc list\nlxc start testbird\nlxc list\n\
    lxc exec testbird -- bash\nwhoami\nls /home\nexit\nlxc exec testbird su - <user-id>\n\
    whoami\nexit\nlxc list\nlxc stop testbird\nlxc list\nlxc delete testbird\nlxc\
    \ list\n```\n\n# Edit a Profile\n\nTermina does not have an editor, Ctrl + X,\
    \ Ctrl + E. In order to edit a profile, it is necessary to copy the profile to\
    \ a Variable or File. From a Termina Terminal:\n\n```\nenv | grep EDITOR\nls /usr/bin/v*\n\
    lxc profile create test\nlxc profile list\n```\n\nTo a Variable:\n\n```\nHOLDTXT=$(EDITOR=cat\
    \ lxc profile edit test)\nlxc profile show test\necho \"$HOLDTXT\"\necho \"$HOLDTXT\"\
    \ | lxc profile edit test\n```\n\nTo a File (Use your user <id>):\n\n```\ncd /tmp\n\
    EDITOR=cat lxc profile edit test > h.txt\ncat h.txt\nlxc file push /tmp/h.txt\
    \ penguin/home/<id>/h.txt\nlxc exec penguin su - <id>\nls\nnano h.txt\nCtrl +\
    \ X\nexit\nlxc file pull penguin/home/<id>/h.txt /tmp/h2.txt\nls\ncat h2.txt |\
    \ lxc profile edit test\nlxc profile delete test\nlxc stop penguin\nls\nrm h*\n\
    cd ~\n```\n\n# Download Ubuntu Apache2\n\nDownload a Ubuntu container and start\
    \ an Apache2 server. The server will be accessible from other Linux containers\
    \ and the Chrome OS Chrome Browser. It will not be accessible from Android Apps\
    \ or any external system. From a Termina Terminal:\n\n```\nlxc image list images:\
    \ ubuntu\nlxc image list images: ubuntu/jammy\nlxc launch images:ubuntu/jammy\
    \ ubj\nlxc exec ubj - ubuntu\nsudo apt update -y\nsudo apt install apache2 -y\n\
    sudo systemctl start apache2\nexit\nlxc list\n```\n\nCopy the Ubuntu IPv4 address.\n\
    Open another Chrome Browser tab.\nPaste the address in the search bar.\nThe Apache2\
    \ Welcome Page is displayed.\n\n```\nlxc stop ubj\nlxc list\nlxc delete ubj\n\
    lxc list\nlxc image list\nlxc image delete <Ubuntu-fingerprint>\nlxc image list\n\
    ```\n\n# Penguin Backup and Restore\n\nThe Chrome OS built-in Linux backup system\
    \ can not be used to backup or restore guest containers. Doing a restore will\
    \ not delete any guest containers.\n\n# Backup Guest Container to Penguin\n\n\
    Copy (publish) a container (sam in this example) to an image file. Then export\
    \ the image file to a compressed file (.tar.gz). Last the compressed file is pushed\
    \ into the Penguin container. In this example files are copied into the Penguin\
    \ container (Use your <id>). Use Manage extra containers page 151 or “lxc copy\
    \ penguin sam” to create a container named sam.\n\n```\nlxc publish sam --alias\
    \ backup\nlxc image export backup $LXD_CONF/backup\nlxc file push $LXD_CONF/backup.tar.gz\
    \ npenguin/home/<id>/backup.tar.gz\n```\n\n- Clean up Files:\n```\nlxc image list\n\
    lxc image delete backup\nlxc image list\ncd $LXD_CONF\nls\nrm backup.tar.gz\n\
    lxc list\nlxc delete sam\ncd ~\n```\n\n# Restore Guest Container from Penguin\n\
    \nPull a compressed File (.tar.gz) from the Penguin container (Use your <id>).\
    \ Then import the image file from the compressed file. Last launch a container\
    \ from the image file.\n\n```\nlxc file pull penguin/home/<id>/backup.tar.gz\n\
    lxc $LXD_CONF/backup.tar.gz\nlxc image list\nlxc image import $LXD_CONF/backup.tar.gz\
    \ --alias sam\nlxc image list\nlxc list\nlxc launch sam sam\nlxc list\n```\n\n\
    # Clean up Files:\n```\nlxc list\nlxc stop sam\nlxc list\nlxc delete sam\nlxc\
    \ list\nlxc image list\nlxc image delete sam\nlxc image list\ncd $LXD_CONF\nls\n\
    rm backup.tar.gz\nls\ncd ~\n```\n\n# Backup a Guest Container to USB Drive\n\n\
    Copy (publish) a container (use in this example) to an image file. Then export\
    \ the image file to a compressed file (.tar.gz) on the USB drive. Plug in the\
    \ USB drive. Open the Chrome OS Files App, right click on the drive and select\
    \ Share with Linux. Manage extra containers page 151 or \"lxc copy penguin sue\"\
    \ to create a container named sue. From a Termina Terminal:\n\n```\ncd /mnt/shared\n\
    It may take a moment for the drive to mount. Use ls to check for the removable\
    \ directory. Then cd to the removable directory, use ls to find <drive-name>.\n\
    ls\ncd removable\nls\nlxc list\nlxc image list\nlxc publish sue --alias backup\n\
    lxc image list\nlxc image export backup /mnt/shared/removable/<drive-name>/backup\n\
    ```\n\nStop sharing the drive with Linux. From the development environment, Manage\
    \ shared folders, click the X for the <drive-name> to stop sharing.\n\n# Clean\
    \ up Files:\n\n```\nlxc image list\nlxc image delete backup\nlxc image list\n\
    lxc list\nlxc delete sue\nlxc image list\n```\n\n# Restore Guest Container from\
    \ USB Drive\n\nImport a compressed file (.tar.gz) from the USB drive to an image\
    \ file. Then launch a container from the image file. Plug in the USB drive. Open\
    \ the Chrome OS Files App, right click on the drive and select Share with Linux.\
    \ From a Termina Terminal:\n\n```\ncd /mnt/shared\nIt may take a moment for the\
    \ drive to mount. Use ls to check for the removable directory. Then cd to the\
    \ removable directory, use ls to find <drive-name>.\nls\ncd removable\nls\nlxc\
    \ import /mnt/shared/removable/<drive-name>/backup.tar.gz --alias sue\nlxc image\
    \ list\nlxc launch sue sue\nlxc list\n```\n\nStop sharing the drive with Linux.\
    \ From the development environment, Manage shared folders, click the X for the\
    \ <drive-name> to stop sharing.\n\n# Clean up Files:\n\n```\nlxc image list\n\
    lxc image delete backup\nlxc image list\nlxc list\nlxc delete sue\nlxc image list\n\
    ```\n\n# Storage Locations\n\n**Containers and Image Files:**\n/mnt/stateful/lxd/storage-pools/default\n\
    \n**Compressed Files .tar.gz:**\necho $LXD_CONF\ncd $LXD_CONF\n\n**USB Drives:**\n\
    /mnt/shared\n\n# Google Bridge Software\n\nContainers require bridge software\
    \ to properly communicate with the outside world. Google's container bridge software\
    \ is called cros-container-guest-tools. Bazel build is used to build the bridge\
    \ software. There is no single procedure for installing cros-container-guest-tools\
    \ that works across all Distros. Distros may have specific instructions on their\
    \ web site, there are also Youtube for several Distros. Penguin already contains\
    \ the bridge software and can easily be cloned to create special purpose containers.\n\
    \n# Dockers Containers Kubernetes\n\nDockers are used to run applications. Containers\
    \ are used to run operating systems. Kubernetes are used to run large numbers\
    \ of Dockers and like Beowulfs often use computer clusters.\n\n# Manage extra\
    \ containers\n\nCurrently in the works, Manage extra containers, can be enabled\
    \ with the Allow multiple Crostini containers flag and accessed from the Linux\
    \ development environment. From the Chrome OS Chrome browser go to the URL:\n\n\
    ```\nchrome://flags\nSearch on : crostini multi\nSet the Flag to: Enabled\n```\n\
    \nContainers are created from downloaded image files (lxc image list). When image\
    \ files are no longer needed they can be deleted (lxc image delete <fingerprint>).\n\
    \nPenguin containers can be created by just entering a Container name. The user's\
    \ email id will be their user id.\n\nNon-Penguin containers can be created by\
    \ entering a Container name and using the Advanced pulldown. For Image Server\
    \ enter:\nhttps://images.linuxcontainers.org\n Image Alias enter a valid Alias,\
    \ example: archlinux/current\n\nFrom Manage extra containers, containers can be\
    \ Stopped, Deletion, Backed up, and Restored. Terminal can be used to start Penguin\
    \ containers installed with Manage extra containers. Non-Penguin containers have\
    \ no bridge software and can be started manually from Crash:\n\n```\nvmc start\
    \ termina\nlxc start <container-name>\nlxc exec <container-name> -- bash\n```\n"
