    exit\nvmc stop termina\n\n- 3) If that fails, last try :\nFrom Terminal:\nSelect\
    \ Penguin from the Terminal menu.\nsudo halt\nRestart Terminal and select Penguin,\
    \ then do:\n`Ctrl + C`\nFrom the Chrome OS Chrome Browser:\nFrom the Crosh URL:\n\
    `chrome-untrusted://crosh`\nvmc stop termina\n\n- 4) Reboot the Chromebook, start\
    \ at step one.\n"
  mdcn: "\nLinux 的自由开放特性使其能够根据需要进行演变，并且往往同时向多个方向发展。如果你不喜欢它，可以对其进行分叉（fork）。Linux 有两个触及几乎每个系统的大趋势。从\
