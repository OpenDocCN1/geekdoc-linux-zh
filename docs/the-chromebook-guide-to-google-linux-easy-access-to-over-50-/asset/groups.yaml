    + C）ipp:// 和 :631 之间的所有内容，在此例中：HPo068EBCE3A2B.local，将其粘贴到浏览器的搜索栏中。


    # 在 Chromebook 上打印


    在 **Chrome OS 设置**中，在**高级**（Advanced）下，选择**打印和扫描**（Print and scan）。在**打印和扫描**面板中选择**打印机**（Printer）。Chrome
    将搜索打印机。当打印机出现时：

    点击**保存**（Save）按钮。


    # 在 Chromebook 上扫描


    在 **Chrome OS 设置**中，在**高级**下选择**打印和扫描**。在**打印和扫描**面板中选择**扫描**（Scan）。Chrome 将搜索扫描仪。当扫描仪出现时，进行任何选择并点击**扫描**按钮进行扫描。


    # 可打印物品


    谷歌搜索**可打印纸质模型**（printable paper models）会产生无尽的结果页面。制作通常需要彩色打印机、剪刀、卡纸板和胶水。PosteRazor（第
    84 页）可放大图像。LibreOffice Draw 和 Gimp（第 76 页）可用于创建和编辑图像。可以使用磁性名片制作海报和其他物体使其具有磁性。*一些打印的材料可以涂上聚氨酯或其他材料使其更耐用。


    # USB 设备


    Chromebook 对 USB 设备有严格的控制。必须在 Chrome OS 设置的 Linux 开发环境面板中启用 Linux 访问。


    适用于 Chrome OS 的 键盘会自动适用于 Linux。在某些情况下可能需要 USB 转 USB-C 适配器或集线器。


    将 USB 设备连接到 Chromebook 并进入 Linux 环境面板。点击“管理 USB 设备”，开启访问。


    USB 存储将在 Linux 中显示：

    /mnt/chromos/removable/


    要停止与 Linux 共享任何存储，进入 Linux 环境。点击“管理共享文件夹”，点击不再共享的目录旁的 X。


    如果文件夹无法与 Linux 共享，请停止共享所有文件夹。然后添加要共享的文件夹。如果共享仍然失败，请停止共享所有文件夹并重启。然后添加要共享的文件夹。


