    ## APT – Software


    **Description:** APT - Advanced Packaging Tool In addition to being able to search
    and download from the Debian repositories, can directly install local deb files:


    ```bash

    sudo apt install <file-name>.deb

    ```


    **Most used, prefix with sudo:**


    - apt update update list

    - apt dist-upgrade upgrade the OS

    - apt upgrade everything

    - apt full-upgrade upgrade with

    - apt list <name> search by name

    - apt search <desc> search

    - apt show <name> show package details

    - apt install <name> install package

    - apt remove <name> remove package

    - apt satisfy <name> satisfy dependencies


    ## Task Select – Software


    **Install:** tasksel (and any desired "tasks")


    **Description:** Task Select is a semi-GUI based software installer that can be
    started from the command line. Search Synaptic for "tasksel", there are many "tasks"
    that can be added to tasksel to provide software selections.


