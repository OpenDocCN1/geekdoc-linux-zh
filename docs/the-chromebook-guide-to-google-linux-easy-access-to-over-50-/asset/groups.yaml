  mdcn: "\n\n# Chromebook 上的 Linux\n\n默认情况下，启用了 Linux 的 Chromebook 将加载 Penguin，这是一个基于\
    \ Debian Linux 的自定义 Linux 容器。WiFi 等功能通过 Chrome OS 实现。如果 Chrome OS 连接到 WiFi，那么\
    \ Linux 也会连接到 WiFi。Linux 有多个桌面环境供选择，本书将涵盖 LXDE 和 i3wm。书中将介绍六种软件包管理器，但重点将放在 Synaptic\
    \ 上。在 Chrome OS 下启动和停止 Linux 与直接运行 Linux 有些不同，但仍然是一个快速且简单的过程。在 Chrome OS 上运行 Linux\
    \ 具有嵌套结构。Penguin 运行在 Termina 虚拟机内部，而虚拟机又运行在 Chrome OS 内部。\n\n# 嵌套结构\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_10_0.png)\n\
    \nChrome OS 上 Linux 的嵌套结构\n\n# 使用 Chromebook\n\n使用 Chromebook 与使用其他电脑非常不同。Chromebook\
    \ 的界面通过特殊的 URL 工作。Chromebook 的键盘虽然非常独特，但功能非常强大。Chromebook 的触控板缺少简单的右键，这非常令人烦恼。\n\
    \n# Chromebook 触控板\n\n要在 Chromebook 上执行右键点击，用两个手指按触控板。使用外部鼠标或触控板可以让你执行右键点击。要执行滚轮操作，用两个手指在触控板上下滑动。\n\
    \n# Linux 鼠标指针\n\n如果 Linux 的**鼠标指针**消失或在启动时无法显示，按**全屏**（Fullscreen）键，然后将**鼠标指针**移向下屏幕。**鼠标指针**应该会显示，再次按**全屏**键恢复屏幕。\n\
    \n# 屏幕下方的线条\n\n如果当前屏幕下方有一线（很可能是黑色显示器底部的一条白线），按两次**显示窗口**（Show windows）键，中间暂停。\n\
    \n# 屏幕撕裂\n\n某些 Chromebook 在运行 Linux 时会出现屏幕撕裂（Screen Tearing）。按两次**全屏**键可以提供一个快速的临时解决方案。根据需要重复操作。\n\
    \n# 失控的退格键\n\n如果在处理文档时，文档内容开始消失，就像一直按了**退格**（Backspace）键一样。按下 **Esc** 键，并尝试使用程序的撤销（undo）功能恢复丢失的内容，或尝试\
    \ **Ctrl** + Z。\n\n# Chrome OS 功能键\n\n在本书编写时，完全使用所有 F1 到 F12 功能键需要设置标志。打开 Chrome\
    \ OS 浏览器。访问 URL：chrome://flags。在搜索框中输入 improved keyboard shortcuts 应该是一个标志。如果该功能停止工作（可能在更新后发生）：**启用**该标志并重启，然后**禁用**该标志并再次重启。\n\
    \n在 Linux 桌面环境中，Chrome OS 的键盘控制可能不可用。按“显示窗口”键再按一次。Chromebook 键盘顶部从左到右的键是：Esc、上一页、下一页、刷新页面、全屏、显示窗口、调暗屏幕、亮度亮度、静音、音减、音量。搜索键上有一个放大镜。Chromebook\
    \ 与外部键盘配合良好。USB-C 端口只需要 USB-C 适配器或 USB-C 集线器。\n\n# Chrome OS 键盘\n\nEsc 经常用于快速退出。\n\
    - Esc\n- 上一页 (Previous Page)\n- F1\n- 下一页 (Next Page)\n- F2\n- 刷新页面 (Reload Page)\n\
    - F3\n- 全屏切换 (Fullscreen Toggle)\n- F4\n- 虚拟桌面与应用屏幕 (Virtual Desktops & App Screens)\n\
    - F5\n- 调暗屏幕 (Dim Display)\n- F6\n- 亮度亮度 (Brighten Display)\n- F7\n- 关闭声音 (Turn\
    \ off sound)\n- 静音 (Mute)\n- F8\n- 音量减 (Volume Down)\n- F9\n- 音量加 (Volume Up)\n\
    - F10\n- 系统锁定 (System Lock)\n- Win + L\n- 显示所有快捷键 (Show all shortcut keys)\n-\
    \ Alt + Ctrl + /\n- 镜像到第二个显示器 (Mirror to Second Display)\n- Ctrl + 全屏 (Fullscreen)\n\
    - 切换主次显示 (Swap Primary & Secondary Display)\n- F4\n- 放大 (Zoom In)\n- Ctrl + Shift\
    \ +\n- 缩小 (Zoom Out)\n- Ctrl + Shift -\n- 任务管理器 (Task Manager)\n- 搜索 + Esc Win\
    \ + Esc\n- 文件应用 (File App)\n- Alt + Shift + M\n- 通知 (Notifications)\n- Alt + Shift\
    \ + N\n\n# Chromebook Google Linux 指南\n\n打开 Crosh - Chrome OS 终端\nAlt + Ctrl +\
    \ T\n功能键 F1 到 F12\nSearch + 1 至 F12\n删除 (Delete)\nAlt + Backspace\n大写锁定 (Caps\
    \ Lock)\nAlt + Search\n向上页 (Page Up)\nAlt + 光标向上 Page Up\n向下页 (Page Down)\nAlt\
    \ + 光标向下 Page Down\n终端向上页 Page Up\nAlt + Shift + 光标向上 Shift Page Up\n终端向下页 Page\
    \ Down\nAlt + Shift + 光标向下 Shift Page Down\n虚拟桌面向左移动 Search + [ Win + [\n虚拟桌面向右移动\
    \ Search + ] Win + ]\n\n# 慢速的键重复率\n\n在打字时，大多数用户期望在按住空格键等键时有相当快速的响应。Chrome OS 的重复率决定了\
    \ Linux 的键重复率，必须在 Chrome OS 设置中设置。\n\nChrome OS 设置 → 设备 (Device) → 键盘 (Keyboard)\n\
    重复率设置位于启用自动重复（Enable auto-repeat）部分。\n\n# Chrome 浏览器 URL\n\nChrome 浏览器是进入 Chrome\
    \ OS 的直接界面。除了检查 chrome://history、登录 google.com 和检查您的隐私设置外，file:/// URL 可以让整个 URL\
    \ 运行。\n\n```\nchrome://about - URL 列表\nchrome://flags - OS 标志设置\nchrome://history\
    \ - 历史记录包含包含 Linux\nchrome://os-settings - 系统设置\nchrome://system - 系统信息\nfile:///home/chronos/user/MyFiles/\n\
    file:///home/chronos/user/Downloads/\n安装 Linux 后：\n  chrome-untrusted://crosh\
    \ - Chrome OS 终端\n  chrome-untrusted://terminal - Linux 终端\n```\n\n# 设置\n\n使用设置搜索栏查找设置。\n\
    \n# 屏幕超时\n\n- 搜索 \"power\" 或直接搜索 \"po\"\n\n# 在线存储数据即同步与 Google 服务\n\n- 搜索 \"sync\"\
    \ 或直接搜索 \"sy\"\n\n# Linux 安装\n\n- 搜索 \"linux\" 或直接搜索 \"li\"\n\n# 作为应用的 Linux 程序\n\
    \nLinux 程序通常可以作为 Chrome OS 应用运行。Linux 应用应该会出现在 Chrome OS 应用抽屉的 Linux 应用文件夹中。如果没有，尝试在终端中运行命令\
    \ `sudo apt update`。然后再次检查。Linux 程序并非设计为作为 Chrome OS 应用运行。如果你的程序完全无法运行、运行不正常或显示异常，请尝试在全\
    \ Linux 桌面环境中运行。接下来的章节将涵盖 LXDE 和 i3wm Linux 桌面。这两个桌面互不冲突，可以同时安装甚至同时运行。\n\nLinux\
    \ 程序也可以从终端命令行启动。当在桌面环境之外运行时，程序可能无法正常缩放。可以使用 sommelier 控制缩放（第 105 页）。缩放因而异。从终端：\n\
    \n```\nsommelier -X --scale=2 --glamor <program>\n```\n\n# 硬件推荐\n\n寻找性价比时，务必检查在线商城、百货商店和你经常去的电脑折扣店。年底假期和开学季是寻找优惠的好时机。\n\
    \n- 单用途适配器，例如：\n- USB-C 转 MicroSD 卡 $2 到 $9\n- VAVA 7合一 USB-C 集线器：\n- VA-UC017\
    \ 大约 $30\n- Nekteck 100W GaN USB-C 充电器：\n- 大 $30\n- 360 度防浪保护插板：\n- 插座可以旋转，有助于解决大型变压器问题。\n\
    - 原版没有壁挂孔，使用 L 型支架和魔术贴。大约 $19 到 $40\n- USB 线批量购买更便宜。\n- 注意伪造的编织线。\n- USB-C 线有\
    \ 24 根线。\n- Logitech K400 键盘：\n- 无线范围长，集成触控板。\n- 从 $12 到 $35\n- 海信 40 英 电视作为第二个显示器。\n\
    - 寻找 $100 到 $150 的优惠。\n- 开启图形或直接（显示器）模式。\n- Creality Ender 3，开源 3D 打印机：\n- 大约\
    \ $200\n\n"
