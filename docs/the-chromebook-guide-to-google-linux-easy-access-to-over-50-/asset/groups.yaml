    # CLI


    There are two primary styles of interfaces; GUI, Graphic User Interface and CLI,
    Command Line Interface. For some tasks a CLI is the only way a task can be performed.
    CLI is also faster for some tasks.


    # Running Scripts


    Commands that can be entered in a Linux terminal can be entered into a file and
    run as a script, often called a BASH script. help provides help for built-ins
    (commands which are not themselves programs). From LXTerminal:


    ```

    help

    bash -c help

    help -help

    man bash

    Q

    which bash

    ```


    sudo su

    Tab Tab

    Y

    Hold down Enter or Q to Quit

    exit


    echo prints to a terminal. > sends output to a file. >> appends output to a file.
    $HOME is a variable that holds the user''s home directory. ~ is short for $HOME.
    rm removes, deletes a file. cp copies a file. mv moves or renames a file. Enter
    the following in LXTerminal:


    ```

    echo "neofetch" > test.sh

    echo "neofetch" > test.sh

    echo "screenfetch" >> test.sh

    cat test.sh

    bash test.sh

    ./test.sh              Will fail.

    chmod +x test.sh      Make executable.

