    # Add Plugin to Panel


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_43_0.png)


    Clicking the **Add** button opens the **Add plugin to panel** panel, which shows
    a full list of Taskbar applet plugins. Select an applet and click the **Add**
    button to add it to the Taskbar.


    # Application Launch Bar


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_44_0.png)


    # Application Launch Bar Editor


    Programs can be added/pinned or removed/unpinned from an Application Launch Bar.
    From the Panel Preferences, Panel Applets tab, select the Application Launch Bar
    on the left and click the Preferences button. The Application Launch Bar panel
    opens. To pin, select an application from the right side then press the Add button.
    To unpin, select an application from the left side then press the Remove button.


    # Add Connman to the Taskbar


    Pin the **Connman Settings** program to the Application Launch Bar.


    - From the **Application Launch Bar** panel:

    - Expand **Preferences** on the right side.

    - Select **Connman Settings**.

    - Click the **Add** button.

    - Click the **Close** button.


    Add the **Network Status Monitor** applet to the Taskbar.


    - From the **Add plugin to panel** panel:

    - Select the **Network Status Monitor**.

    - Click the **Add** button.

    - Click the **Close** button.


    Linux connects to the outside world through bridge software which connects it
    to the Chromebook. The Network Status Monitor icon will flash because Linux is
    talking to the Chromebook. Linux cannot turn off the Chromebook''s network connection,
    but it can turn off its connection to the bridge software network.


    **Note:** Connman connection profiles are located: /var/lib/connnman/<profile-folder>


    # Connman


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_46_0.png)


    Connman, Network Settings


    Connman Network Controls:


    - Start **Connman**.

    - From the **Network Settings** window:

    - Click the switch in the top right corner.

    - The **Network Status Monitor** will stop flashing.

    - Linux is now disconnected from the network.

    - Click the switch to turn the network on.

    - Close the **Network Settings** window.


    ## Changing a Program''s Icon


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_47_0.png)


    Change a program''s icon.


    To change a program''s icon, right click the menu item and select **Properties**.
    In the **File Properties** window click the program''s icon, the **Choose An Icon**
    window opens. Select an icon and click the Ok button.


    The **/usr/share/icons** directory contains a large number of icons. It''s usually
    necessary to drill down a few directories to find an icon.


    Other directories in **/usr/share/images** may also contain icons. The **images**
    directory contains a few Debian icons.


    # PRINT & SCAN


    Printer and scanner setup is automatic, while allowing for manual setup and configuration.
    The CUPS printer interface is accessed thru a browser. Xsane can scan multi-page
    documents, and allows detailed control over quality and type of scan. The Chromebook
    and Scanner / Printer should all be on the same network. From Synaptic, install:


    ```

    cups

    printer-driver-cups-pdf

    ```


    Verify the user-id with whoami and then add the user-id to the printer management
    group with usermod. From LXTerminal:


    ```

    whoami

    sudo usermod -aG lpadmin <user-id>

    ```


    Shutdown and restart Linux to pick up the change.


    # The Chromebook Guide to Google Linux


    ## Printing with CUPS


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_49_0.png)


    Open Firefox then go to and bookmark the URL:

    127.0.0.1:631 aka localhost:631


    Printers can be manually added here. Printers can be suspended and restarted.
    Output can be rerouted. Printer defaults can be set here. CUPS opens on the Home
    page tab. Click the Printer tab. Click on the printer name. From the Maintenance
    pull-down, select Print Test Page. To set the Default Options: Printers → Select
    Printer - Administration pull-down → Set Default Options


    ## Scanning with Xsane


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_50_0.png)


    Xsane at startup.


    Start Xsane:


    LXDE menu → Graphics → Xsane


    Xsane will open four windows when it starts, only two are needed. From the primary
    window''s Window menu, uncheck Show histogram and Show standard options.


    Hovering over an option provides a pop up that describes the option. Some likely
    option settings changes are: Scan Mode from lineart to color and Scan Resolution
    from 75 to 300.


    Pressing the Acquire preview button will scan and display the entire image or
    any part selected for the scan. Press the Scan button scans the image which then
    opens in a Viewer Window where the file can be saved.


    Multi-page scans are a two step process. Scans are saved as individual files and
    then appended to the desired file type when done. Press Ctrl + M or change the
    Target option to Multi-page (top right), the multi-page project windows. Press
    the Scan button to add pages. Press the Save multipage file button in the multi-page
    project window when done. Leave the Number of pages to scan set to 1 (primary
    window top left).


    # Embedded Web Server


    Printers which use Internet Printing Protocol (IPP) often have an Embedded Web
    Server (EWS). A printer may not be using IPP or have an EWS. If it does, it can
    be a useful feature.


    From LXTerminal:

    ippfind


    If the ippfind command returns something like: ipp://HPo068EBCE3A2B.local:631/ipp/print
    copy (Ctrl + Shift + C) everything between ipp:// and :631, for this example:
    HPo068EBCE3A2B.local Paste this into your browser''s search bar.


    # Printing On Chromebooks


    From **Chrome OS Settings**, under **Advanced**, select **Print and scan**. Select
    **Printer** from the **Print and scan** panel. Chrome OS will search for a printer.
    When the printer shows up:

    Press the **Save** button.


    # Scanning On Chromebooks


    From **Chrome OS Settings**, under **Advanced** select **Print and scan**. Select
    **Scan** from the **Print and scan** panel. Chrome OS will search for a scanner.
    When the scanner shows up make any selections and press the **Scan** button to
    scan.


    # Printables


    Googling **printable paper models** will produce endless pages of results. Construction
    usually requires a color printer, scissors, cardstock and glue. PosteRazor (Page
    84) can be used to enlarge images. LibreOffice Draw and Gimp (Page 76) can be
    used to create and edit images. *Business card magnets can be used to tile posters
    and other objects to make them magnetic.* Some printed materials can be painted
    with polyurethane or other like materials to make them more durable.


    # USB DEVICES


    Chromebooks keep tight control over USB devices. Linux access must be enabled
    from the Chrome OS Settings Linux development environment panel.


    USB keyboards that work with Chrome OS will automatically work with Linux. In
    some cases a USB to USB-C adapter or HUB may be required.


    Connect the USB device to the Chromebook and go to the Linux environment panel.
    Click on Manage USB devices, turn on access.


    For Chrome OS to share storage of any kind with Linux additional access is required
    that can only be granted from the Chrome OS Files App. From the Files App, right
    click on the directory to be shared and select Share with Linux. A panel will
    pop up asking to confirm, click Ok.


    USB Storage will show up in Linux here:

    /mnt/chromos/removable/


    To stop sharing storage of any kind with Linux, go to the Linux environment. Click
    on Manage shared folders, click the X for any directories that are no longer to
    be shared.


    If a folder fails to share with Linux, stop sharing all folders with Linux. Then
    add the folder to be shared. If the folder still fails to share, stop sharing
    all folders with Linux and reboot. Then add the folder to be shared.


    If a container fails, the data stored in it will be lost. The Chrome OS Files
    App can be used to copy files into and out of a Linux container, the container
    must be running. Some Linux programs can read and write to Chrome OS directories
    that are shared with Linux. The Linux Backup & restore will not backup shared
    Chrome OS directories.


    To format a USB storage device to exFAT, use the Chrome OS Files App. From the
    Files App right click on the device and select Format device. Enter a name for
    the Drive name, and select exFAT from the format menu. Click the Erase and Format
    button to format the drive.

