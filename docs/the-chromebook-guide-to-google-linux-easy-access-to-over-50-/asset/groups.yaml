    ## Extreme Tux Racer – Games


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_109_0.png)


    Extreme Tux Racer


    Install: extremetuxracer


    Description: 3D downhill skiing game. Cursor key Left / Right to turn, Up to accelerate,
