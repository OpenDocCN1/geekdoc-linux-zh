  - '[PAGE 110]


    # Sommelier - Wayland Compositor


    **Description:** Sommelier is a Wayland compositor, it handles session connections
    to Linux. There is no one size fits all solution for every program. Sommelier
    can be run as a wrapper around a program, allowing custom settings for that program.
    Scale will vary.


    **Documentation:** sommelier --help


    # Three recommended Prefix options:


    +   1) No prefix.

    2) env GDK_BACKEND=x11 <program-name>

    3) sommelier -X --scale=.5 --glamor --frame-color=#000000 <program-name>


    Lower case sommelier, space, dash, capital X, space, dash, dash, lower case scale,
    equal, point 5, space, dash, dash, lower case glamor, space, dash, dash, lower
    case frame, dash, color, equals pound sign, six zeros, program name. When sommelier
    is used as a prefix, the program will run outside the desktop while appearing
    to run on the Desktop. Clicking on the Desktop will cause the program to disappear,
    press Show windows and select the program to restore it.


    Scale will vary with the Chromebook Display settings, screen size, and the program.
    A good starting point for high resolution is a scale .5, a good starting point
    for low resolution is a scale of 1.2. The larger the number, the smaller the screen.
    The larger the number, if .3 is a little too large and .4 is a little too small,
    try .35. Try the Fullscreen key, sometimes it works.'
  - '[PAGE 111]


    Frame Color uses a two digit hex red green blue coding scheme. 000000 is black,
    FFFFFF is white, FF0000 is red, 00FF00 is green, FF00FF is purple. Hex uses 0
    plus A, B, C, D, E, and F. 2A hex = 2x16+10 = 42. FF=255, so there are 255 to
    the third power possible colors, over 16 million possible colors.


    To edit an LXDE menu item, right click on it, select Properties, Desktop Entry
    tab, edit the Command:, this will also fix 13wm. ~/.local/share/applications/<name>.desktop
    are override files and can be manually edited or deleted without hurting anything.


    When a menu item is edited, it is copied from: /usr/share/applications/ To: ~/.local/share/applications/


    Check a program''s documentation for command line options. Also check a program''s
    settings. If a program is glitchy, try lowering it''s resolution and possibly
    turn off features. Most programs will have a fullscreen option in their settings.


    To keep the Chrome OS Taskbar hidden while using Linux, right click on the Chrome
    OS Taskbar and select Autohide shelf. Press Show windows right click on the Taskbar
    and select Always show shelf from the menu to restore.


    The following six programs are all run using themelier prefix. Your scale setting
    will likely be different. The full Launch command will be shown in place of a
    Prefix.'
