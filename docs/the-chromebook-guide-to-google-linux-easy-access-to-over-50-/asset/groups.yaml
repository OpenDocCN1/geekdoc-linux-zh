- md: "\n# INSTALLING LINUX\n\nInstalling and removing Linux on a Linux enabled Chromebook\
    \ is a short simple procedure. Fixing Linux Desktops so they run properly does\
    \ NOT require rooting a Chromebook or any heavy hacking.\n\n## Install Linux\n\
    \nChromebooks install Linux in a Container, inside a Virtual Machine, under Chrome\
    \ OS. A Crosh session runs outside the Container. A Terminal session runs inside\
    \ a Container. A Terminal session can manually be started from a Crosh session.\
    \ To Install Linux the Chromebook must be connected to the internet. Navigate\
    \ to the Linux development environment in Settings. Type linux in the Settings\
    \ Search Bar and press Enter. Or, in Settings: Advanced → Developers → Linux development\
    \ environment.\n\nThe Chromebook Guide to Google Linux\n\n## Turn On Linux\n\n\
    Developers\n\nLinux development environment\nRun Linux tools, editors, and IDEs\
    \ on your Chromebook. Learn more\n\nTurn on\n\n### Click the Turn on button.\n\
    \nFrom the Linux development environment panel, click the Turn on button.\n\n\
    ![](img/b7499e434c2bd9c15bf347d1647edb1b_21_0.png)\n\nClick the Next button.\n\
    \nThe set up Linux development environment panel will open, click the Next button.\n\
    \n## Make Selections\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_22_0.png)\n\n\
    Click the **Install** button to continue.\n\nEnter a **Username** and select the\
    \ **Disk size** to be allocated to Linux. The **Username** can be any name. The\
    \ **Disk size** can be changed at any time.\n\n## Removing Linux\n\nOnce the install\
    \ is complete, Linux can be removed at anytime. From the **Linux development environment\
    \ panel**, **Remove Linux development environment** section, click the **Remove**\
    \ button.\n\n## Completing the Install\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_23_0.png)\n\
    \nInstallation should complete within minutes.\n\nAn Installing Linux panel will\
    \ show the progress of the install.\n\nOnce the installation has completed, the\
    \ Terminal App will open. A command prompt will be displayed: `<user-id>@penguin:$`\n\
    \nIt's handy to have the Terminal App pinned to the Taskbar. Right click on the\
    \ Terminal icon and select Pin. Open the Terminal icon menu again and select Settings\
    \ or `Ctrl + Shift + P`. Here the appearance of the Terminal app can be changed.\n\
    \n# The Chromebook Guide to Google Linux\n\n```\nzen@penguin: $ uname -a\nLinux\
    \ 5.4.157-17185-gbd27b903c738 #1 SMP PREEMPT Sat Jan 1\n19:17:16 PST 2022 aarch64\
    \ GNU/Linux\nzen@penguin: $ hostname\nStatic hostname: penguin\nIcon name: computer-container\n\
    Chassis: container\nMachine ID: a820b1bd557d66f0101d70b46165a979\nBoot ID: 20de4b6cb515d41381c31d10e02f8c2f\n\
    Virtualization: lxc\nOperating System: Debian GNU/Linux 11 (bullseye)\nKernel:\
    \ Linux 5.4.157-17185-gbd27b903c738\nArchitecture: arm64\nzen@penguin: $ cat /etc/os-release\n\
    PRETTY_NAME=\"Debian GNU/Linux 11 (bullseye)\nVERSION_ID=\"11\"\nVERSION=11 (bullseye)\n\
    VERSION_CODENAME=debian\nID=debian\n```\n\nOnce installation completes Terminal\
    \ opens.\n\nEnter the following five commands to learn more about the system:\n\
    \n- uname -a\n- hostnamectl\n- cat /etc/os-release\n- cat /etc/debian_version\n\
    - getconf LONG_BIT\n\nFrom this it can be seen the Google container name is Penguin.\
    \ The actual Distro is Debian 11 Bullseye. The architecture is also important,\
    \ will likely be AMD / Intel or ARM. getconf LONG_BIT will show whether the system\
    \ is running as a 32 or 64 bit system.\n\nNow set the user and root passwords.\
    \ The command for password has a unique spelling, passwd. The password will need\
    \ to be entered twice for each id.\n\n```\nsudo passwd <user-id>\nsudo passwd\
    \ root\n```\n\n# INSTALLING LXDE\n\nLXDE is a rich full featured desktop that's\
    \ good with resources and easy to decorate and configure. It offers a comprehensive\
    \ set of tools, superior program integration and control including advanced printing\
    \ and scanning features.\n\nInstall the LXDE Desktop, the nano editor, and nested\
    \ X server Xephyr. LXDE will provide the desktop environment. Xephyr keeps the\
    \ desktop intact. Nano is an editor used to create a start up script for LXDE.\
    \ The LXDE install will likely take 20 to 50 minutes. From the Terminal App:\n\
    \n```\nsudo apt update -y\nsudo apt dist-upgrade -y\nsudo apt install task-lxde-desktop\
    \ -y\nsudo apt install nano -y\nsudo apt install xserver-xephyr -y\n```\n\n# LXDE\
    \ Launch Script\n\n```bash\n#!/bin/bash\ngol.sh * \nXephyr -br -fullscreen -resizeable\
    \ :20 &\nsleep 5\nDISPLAY=:20 startlxde &\n```\n\nNano: ^ is short for Ctrl key.\n\
    \nUsing Nano to create the file gol.sh. From the Terminal App, start Nano and\
    \ enter the four line script:\n\nnano gol.sh\n\n```bash\n#!/bin/bash\nXephyr -br\
    \ -fullscreen -resizeable :20 &\nsleep 5\nDISPLAY=:20 startlxde &\n```\n\nWhen\
    \ done, Ctrl + O, Enter to save. Ctrl + X exit.\n\n# LXDE Desktop\n\n![](img/b7499e434c2bd9c15bf347d1647edb1b_27_0.png)\n\
    \n# The LXDE Desktop\n\n**chmod** makes the gol.sh script executable. \"./\" tells\
    \ Linux to run the script from the current directory. **ls** lists files. **pwd**\
    \ prints the working directory, /home/<user-id> is the users home directory. **echo**\
    \ $PATH lists the search paths for executables. “No session for pid . . . Error\
    \ message popups can safely be ignored, click the Ok button.\n\n```bash\nchmod\
    \ +x gol.sh\nls -l g*\npwd\necho $PATH\n./gol.sh\n```\n\n# LXDE Startup and Shutdown\n\
    \nStartup:\n- Run the **Terminal** App.\n- Select **Penguin** from the Terminal\
    \ menu.\n- ./gol.sh\n- Press **Fullscreen** if needed.\n\nShutdown (LXDE shuts\
    \ down with Terminal):\n- Exit any running Linux programs.\n- Right click on the\
    \ **Terminal** icon and select **Shut down Linux**.\n\n# Crosh and Terminal\n\n\
    Everything on a Chromebook can be run through the Chrome browser. Crosh runs outside\
    \ a Linux Container. To be clear, Termina is a virtual machine, Terminal is a\
    \ Terminal interface. Three important Chrome URL's to bookmark:\n\n```\nchrome-untrusted://crosh\n\
    chrome-untrusted://terminal\nchrome://about\n```\n\n# Navigating from Crosh to\
    \ Terminal\n\nNavigating from Crosh, outside a container, to the inside of a container\
    \ is a short process. Allow one command to finish before entering the next command.\
    \ Enter the URL chrome-untrusted://crosh in the Chrome Browser. Ctrl + Shift +\
    \ P opens preferences. Enter the following commands, <user-id> is your user id:\n\
    \n```\nvmc start termina\nlxc start penguin\nlxc exec penguin su - <user-id>\n\
    ./gol.sh\n```\n\nLXDE will start, return to the Chrome Browser. If LXDE is covering\
    \ the Chrome Browser, just press Fullscreen. Enter the following commands:\n\n\
    ```bash\nexit\nlxc stop penguin\nexit\nvmc stop termina\n```\n\nIf termina is\
    \ misspelled while starting termina (vmc start termina), a new virtual machine\
    \ will be started with the new name. To correct this, exit the VM, stop it, then\
    \ destroy it. Any containers inside it will be deleted:\n\n```\nvmc destroy pug\n\
    ```\n\n# When Terminal won’t Start\n\nWhile starting Terminal, on occasion you\
    \ may have a re-recurring error, such as \"can't open display :2\". To clear the\
    \ error try the following:\n\n- 1) First try:\n  From the Chrome OS Chrome Browser:\n\
    \  From the Chrome URL:\n  `chrome-untrusted://crosh`\n  `vmc stop termina`\n\n\
    - 2) If that fails then:\n  From the Chrome OS Chrome Browser\n  From the URL:\n\
    \  `chrome-untrusted://crosh`\n  `vmc start termina`\n  `lxc stop penguin`\n \
    \ exit\n  `vmc stop termina`\n\n- 3) If that fails, last try :\n  From Terminal\n\
    \  Select Penguin from the Terminal menu.\n  sudo halt\n  Restart Terminal and\
    \ select Penguin, then do:\n  `Ctrl + C`\n  From the Chrome OS Chrome Browser:\n\
    \  From the Chrome URL:\n  `chrome-untrusted://crosh`\n  `vmc stop termina`\n\n\
    - 4) Reboot the Chromebook, start at step one.\n\n# LXDE Screen Resolution\n\n\
    LXDE will dynamically adapt to any change in the Chrome OS Display settings:\n\
    Chrome OS Settings → Device → Displays\n\n# Screensaver\n\nTo turn off the LXDE\
    \ Screensaver:\nLXDE Menu → Preferences → Screensaver\nFor Mode select Disable\
    \ Screen Saver.\n\n# LXDE Fullscreen Shortcut\n\nWindows Keyboard: Alt + F11\n\
    Chromebook Keyboard: Alt + Search + - Alt + Search + Dash\n\nIf the Fullscreen\
    \ shortcut doesn't work. From the Chrome OS Chrome Browser, go to the URL: chrome://flags\n\
    \nIn the Search Box, enter:\nimproved keyboard shortcuts\nDisable the flag and\
    \ reboot.\n\nIf this should stop working, possible after an update: Enable the\
    \ flag and reboot, then Disable the flag and reboot again.\n"
