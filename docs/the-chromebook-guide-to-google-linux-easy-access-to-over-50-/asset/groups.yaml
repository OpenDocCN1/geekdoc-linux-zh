    [content]


    # 下载 Arch Linux


    LXC 启动命令用于下载容器镜像并启动容器。`alias` 命令允许为镜像提供更符合用户习惯的别名。在 Termina 终端中：


    ```

    lxc list

    lxc image list

    lxc image list images:

    lxc image list images: archlinux/current

    lxc launch images:archlinux/current arch

    lxc image list

    ```


    为 Arch Linux 镜像创建一个别名。将鼠标指针置于 Archlinux 指纹 ID 前方。按住触控板左键，同时将鼠标拖过指纹以进行高亮。按下 Ctrl
    + Shift + C 复制指纹。


    ```

    lxc image alias create myarc `Ctrl + Shift + V`

    lxc image list

    lxc image info myarc

    lxc image delete myarc

    lxc list

    lxc stop arch

    lxc list

    lxc delete arch

    lxc list

    ```


    # 克隆 Penguin


    创建一个 Penguin 容器的副本，以 root 身份登录，然后以你的 <user-id> 登录，最后将其删除。这的实际用途是在修改 Penguin 本身之前，在“Penguin
    副本”上测试软件或配置更改。如果安装了大量程序，Penguin 可能会很大，你可能想跳过此示例。在 Termina 终端中：


    ```

    lxc list

    如果 penguin 正在运行，停止它：

    lxc stop penguin

    lxc list

    lxc copy penguin testbird

    lxc list

    lxc start testbird

    lxc list

    lxc exec testbird -- bash

    whoami

    ls /home

    exit

    lxc exec testbird su - <user-id>

    whoami

    exit

    lxc list

    lxc stop testbird

    lxc list

    lxc delete testbird

    lxc list

    ```


    # 编辑配置文件


    Termina 没有内置编辑器（Ctrl + X, Ctrl + E）。为了编辑配置文件，必须将配置文件复制到变量或文件中。在 Termina 终端中：


    ```

    env | grep EDITOR

    ls /usr/bin/v*

    lxc profile create test

    lxc profile list

    ```


    到变量：


    ```

    HOLDTXT=$(EDITOR=cat lxc profile edit test)

    lxc profile show test

    echo "$HOLDTXT"

    echo "$HOLDTXT" | lxc profile edit test

    ```


    到文件（使用你的用户 <id>）：


    ```

    cd /tmp

    EDITOR=cat lxc profile edit test > h.txt

    cat h.txt

    lxc file push /tmp/h.txt penguin/home/<id>/h.txt

    lxc exec penguin su - <id>

    ls

    nano h.txt

    Ctrl + X

    exit

    lxc file pull penguin/home/<id>/h.txt /tmp/h2.txt

    ls

    cat h2.txt | lxc profile edit test

    lxc profile delete test

    lxc stop penguin

    ls

    rm h*

    cd ~

    ```


    # 下载 Ubuntu Apache2


    下载一个 Ubuntu 容器并启动 Apache2 服务器。该服务器可以通过其他 Linux 容器和 Chrome OS Chrome 浏览器访问。它无法从
    Android 应用或任何外部系统访问。在 Termina 终端中：


    ```

    lxc image list images: ubuntu

    lxc image list images: ubuntu/jammy

    lxc launch images:ubuntu/jammy ubj

    lxc exec ubj - ubuntu

    sudo apt update -y

    sudo apt install apache2 -y

    sudo systemctl start apache2

    exit

    lxc list

    ```


    复制 Ubuntu 的 IPv4 地址。

    打开另一个 Chrome 浏览器标签页。

    在搜索栏中粘贴地址。

    显示 Apache2 欢迎页面。


    ```

    lxc stop ubj

    lxc list

    lxc delete ubj

    lxc list

    lxc image list

    lxc image delete <Ubuntu-fingerprint>

    lxc image list

    ```


    # Penguin 备份与恢复


    Chrome OS 内置的 Linux 备份系统无法用于备份或恢复虚拟机容器。


    # 备份容器到 Penguin


    将容器（示例中的 sam）发布（publish）到镜像文件。然后将镜像导出为压缩文件 (.tar.gz)。最后将压缩文件推送到 Penguin 容器（使用你的用户
    <id>）。在管理额外容器页面或使用“lxc copy penguin sam”创建一个名为 sam 的容器。


    ```

    lxc publish sam --alias backup

    lxc image export $LXD_CONF/backup

    lxc file push $LXD_CONF/backup.tar.gz penguin/home/<id>/backup.tar.gz

    ```


    清理文件：

    ```

    lxc image list

    lxc image delete backup

    lxc image list

    cd $LXD_CONF

    ls

    rm backup.tar.gz

    lxc list

    lxc delete sam

    cd ~

    ```


    # 恢复容器从 Penguin


    从 Penguin 容器拉取压缩文件 (.tar.gz)。然后从镜像文件启动容器。插入 USB 磁盘。打开 Chrome OS 文件应用，右键点击该磁盘并选择“与
    Linux 共享”。在 Termina 终端中：


    ```

    cd /mnt/shared

    磁盘挂载可能需要一些时间。使用 ls 检查 removable 目录。进入 removable 目录，使用 ls 找到 <drive-name>。

    ls

    cd removable

    ls

    lxc import /mnt/shared/removable/<drive-name>/backup.tar.gz --alias sue

    lxc image list

    lxc launch sue sam

    lxc list

    ```


    停止与 Linux 共享。在开发环境中，管理共享文件夹，点击 <drive-name> 处的 X 停止共享。


    清理文件：

    ```

    lxc image list

    lxc image delete backup

    lxc image list

    lxc list

    lxc delete sue

    lxc image list

    ```


    # 备份容器到 USB 磁盘


    ```

    lxc image list

    lxc image delete backup

    lxc image list

    lxc list

    lxc delete sue

    lxc image list

    ```


    # 存储位置


    **容器和镜像文件：**

    /mnt/stateful/lxd/storage-pools/default


    **压缩文件 .tar.gz：**

    echo $LXD_CONF

    cd $LXD_CONF


    **USB 磁盘：**

    /mnt/shared


    # Google 桥接软件


    容器需要桥接软件与外部世界正常通信。Google 的容器桥接软件称为 cros-container-guest-tools。使用 Bazel 构建桥接软件。没有适用于所有发行版的
    cros-container-guest-tools 安装程序。各个发行版可能在自己的网站上提供特定说明，某些发行版也有 YouTube 视频。Penguin
    已经包含了桥接软件，可以轻松地克隆以创建特殊用途容器。


    # Docker 容器 Kubernetes


    Docker 用于运行应用程序。容器用于运行操作系统。Kubernetes 用于运行大量的 Docker，并像 Beowulf 集一样经常使用计算机集群。


    # 管理额外容器


    正在开发中的“管理额外容器”可以通过 Allow multiple Crostini containers 标志启用，并从 Linux 开发环境访问。从 Chrome
    OS Chrome 浏览器转到 URL：


    ```

    chrome://flags

    搜索 on : crostini multi

    将 Flag 设置为: Enabled

    ```


    容器是从下载的镜像文件创建的 (lxc image list)。当镜像文件不再需要时，可以删除 (lxc image delete <fingerprint>)。


    只需输入容器名即可创建 Penguin 容器。用户的电子邮件 ID 将作为其用户 ID。


    非 Penguin 容器可以通过输入容器名并使用高级拉取菜单创建。对于镜像服务器输入：

    https://images.linuxcontainers.org

    镜像别名 (Image Alias) 输入有效的别名，例如：archlinux/current


    在管理额外容器中，可以对容器进行停止、删除、备份和恢复。终端可启动通过管理额外容器安装的 Penguin 容器。非 Penguin 容器没有桥接软件，可以从终端
    手动启动：


    ```

    vmc start termina

    lxc start <container-name>

    lxc exec <container-name> -- bash

    ```


