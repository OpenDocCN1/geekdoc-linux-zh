    **Description:** For both LXDE and i13wm do a "sudo apt update" from the command
    line and a reboot after installing. If Gnome Software does not populate with software
    repeat the apt update and reboot as needed.


    **Prefix:** env GDK_BACKEND=x11


    **LXDE:** Menu → Preferences → Software


    **i3wm:** so - Software

