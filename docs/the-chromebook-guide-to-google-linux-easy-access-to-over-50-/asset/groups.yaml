  - '[PAGE 10]


    # Linux on Chromebooks


    By default Linux enabled Chromebooks will load Penguin, a custom Linux Container
    version of Debian Linux. Things like WiFi will work through Chrome OS. If Chrome
    OS is connected to WiFi, then Linux is connected to WiFi. Linux has several desktops
    to choose from, this book will cover LXDE and i3wm. Six software package managers
    will be covered, but focus will be given to Synaptic. Starting and stopping Linux
    under Chrome OS works a little different than just running Linux, but it is still
    a fast and easy process. There is a nested structure to running Linux on Chrome
    OS. Penguin runs inside the Termina Virtual Machine, which runs inside Chrome
    OS.


    # Nested Structure


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_10_0.png)


    Nested Structure of Linux on Chrome OS'
  - '[PAGE 11]


    # WORKING WITH CHROMEBOOKS


    Working with Chromebooks is very different from working with other computers.
    Chromebook''s interface works through special URL''s. The Chromebook keyboard
    while very unique, is very functional. The Chromebook Touchpad lacking a simple
    right click, is simply annoying.


    # Chromebook Touchpad


    To perform a right click on a Chromebook, press the Touchpad with two fingers.
    Using an External Mouse or Touchpad will allow you to right click. To perform
    the action of a scroll wheel, slide two fingers up and down the Touchpad.'
  - '[PAGE 12]


    # Linux Mouse Pointer


    If the Linux **mouse pointer** disappears or fails to show at start up, press
    the **Fullscreen** key, then move the **mouse pointer** down the screen. The **mouse
    pointer** should show, press the **Fullscreen** key again to restore the screen.


    # Line Under Display


    If there is a line under the current screen. Most likely a white line at the bottom
    of a black display, press the **Show windows** key twice, with a pause in between.


    # Screen Tearing


    Some Chromebooks will experience Screen Tearing while running Linux. Pressing
    the **Fullscreen** key twice provides a quick short term fix. Repeat as needed.


    # Runaway Backspace


    In the event work starts to vanish from a document while working, as though the
    **Backspace** key were pressed. Press the **Esc** key and try to restore the lost
    work using the program''s undo function or try **Ctrl** + Z.'
  - '[PAGE 13]


    # Chrome OS Function Keys


    As of the writing of this book, the full use of all 12 function keys requires
    the setting of a flag to work.


    Open the Chrome OS Chrome Browser.

    Go to the URL:


    +   - chrome://flags

    - In the Search Box, enter:

    - improved keyboard shortcuts


    There should be one flag.

    **Disable** the flag and reboot.


    If this should stop working, possible after an update:

    **Enable** the flag and reboot, then **Disable** the flag and reboot again.


    # Chrome OS Keyboard


    Some Chrome OS keyboard controls may not be available while in a Linux Desktop
    Environment. Press the Show windows key then try again. The keys left to right
    across the top of a Chromebook keyboard are, Esc, Previous Page, Next Page, Reload
    Page, Fullscreen, Show windows, Dim Display, Brighten Display, Mute, Volume Down,
    Volume Up, and Counting. The Esc key as one, the Search key is the fourth key
    down the left side of the keyboard. The Search key key has a picture of a hand
    held magnifying glass on it. Chromebooks work well with external keyboards. USB-C
    port only Chromebooks may require a USB to USB-C adapter or USB-C HUB.'
