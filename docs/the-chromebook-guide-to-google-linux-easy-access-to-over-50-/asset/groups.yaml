    ## 媒体转换


    **FFmpeg - 描述：** FFmpeg 是领先的多媒体框架，能够解码、编码、转码、封装、解封装、流化、过滤和播放人类和机器的几乎任何内容。它支持从最冷门的
    ffmpeg 格式到最前端的格式。


    **安装：** ffmpeg, ffmpeg-doc


    **文档：** man ffmpeg, ffmpeg --help 从 ffmpeg，右键点击：/usr/share/doc/ffmpeg/manual/ffmpeg.html
    并选择 Firefox。有许多网站和 YouTube 频道致力于 FFmpeg。


    **CLI：** 从 LXTerminal, XTerm, Terminal 运行。


    **ImageMagick - 描述：** 一个位图图像合成器和转换器。


    **安装：** imagemagick


    **文档：** imagemagick.org/index.php 有许多网站和 YouTube 频道致力于 ImageMagick，man convert,
    convert --help


    **CLI：** 从 LXTerminal, XTerm, Terminal 运行。


    ## 磁盘分析器


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_97_0.png)


    **安装：** baobab


    **描述：** 磁盘分析器是一个图形菜单驱动的应用程序。由于 Chromebook 的设计，实际数字并不精确，但很有参考价值。


    **文档：** man baobab, baobab --help


    **前缀：** env GTK_BACKEND=x11


    LXDE：菜单 → 系统工具 → 磁盘分析器

    i3wm: disk - 磁盘分析器


    ## Update Alternatives (更新选项)


    **描述：** Update Alternatives 控制几个重要的 Debian 设置。其中一个较小的设置是浏览器偏好。许多程序在默认浏览器中打开基于
    HTML 的帮助文件。默认设置会导致进程失败。


    将默认浏览器强制设置为 Firefox。


    ```

    从 LXTerminal:

    sudo su

    update-alternatives --get-selections

    cd /usr/bin

    ls *

    cp garcon-url-handler garcon-url-handler.bak

    nano garcon-url-handler

    ```


    **修改 exec 行：**


    ```

    从：

    exec /opt/google/cros-container/bin/garcon...

    改为：

    exec /usr/bin/firefox-esr --client --url "$@"

    Ctrl + O

    Enter

    Ctrl + X

    重启系统

    ```


    **文档：** man update-alternatives, update-alternatives --help


    **CLI：** 从 LXTerminal, XTerm, Terminal 运行。


    ## Python – 编程


    **安装：** idle-python3.9 - (3.9 或更高数字) python3-pip, python3-pipdeptree, python3-examples,
    python3-doc (可选：Thonny Python IDE)


    **描述：** 编程的高需求、高薪领域，在 AI 中被广泛使用。


    **配置 IDLE：**

    Options → Configure IDLE → **General** 标签

    点击 **Auto-Squeeze Min. Lines** 复选框。

    改为 **5000**。

    点击 **Apply** 然后点击 Ok 按钮。


    **其他帮助来源**

    点击 **Add** 按钮。

    名称：**Local Copy**

    帮助文件路径：

    /usr/share/devhelp/books/python3.9/index.html

    点击 **Ok** 按钮。

    点击 **Apply** 然后点击 **Ok** 按钮。


    **文档：** python.org, YouTube, books

    Help → Local Copy

    Help → Turtle Demo

    点击 **Example**，选择一个并按 **Start**。


    LXDE：菜单 → 编程 → IDLE

    i3wm: i - IDLE (使用 Python 3.9)


