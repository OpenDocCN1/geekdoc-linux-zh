    Now set the user and root passwords. The command for password has a unique spelling,
    passwd. The password will need to be entered twice for each id.


    ```

    sudo passwd <user-id>

    sudo passwd root

    ```'
  - '[PAGE 25]


    # INSTALLING LXDE


    LXDE is a rich full featured desktop that''s good with resources and easy to decorate
    and configure. It offers a comprehensive set of tools, superior program integration
    and control including advanced printing and scanning features.


    Install the LXDE Desktop, the nano editor, and nested X server Xephyr. LXDE will
    provide the desktop environment. Xephyr keeps the desktop intact. Nano is an editor
    used to create a start up script for LXDE. The LXDE install will likely take 20
    to 50 minutes. From the Terminal App:


    ```

    sudo apt update -y

    sudo apt dist-upgrade -y

    sudo apt install task-lxde-desktop -y

    sudo apt install nano -y

    sudo apt install xserver-xephyr -y

    ```'
  - "[PAGE 26]\n\n# LXDE Launch Script\n\n```\n#!/bin/bash\ngol.sh * \nXephyr -br\
    \ -fullscreen -resizeable :20 &\nsleep 5\nDISPLAY=:20 startlxde &\n```\n\nNano:\
    \ ^ is short for Ctrl key.\n\nUsing Nano to create the file gol.sh. From the Terminal\
    \ App, start Nano and enter the four line script:\n\nnano gol.sh\n\n```\n#!/bin/bash\n\
    Xephyr -br -fullscreen -resizeable :20 &\nsleep 5\nDISPLAY=:20 startlxde &\n```\n\
    \nWhen done, Ctrl + O, Enter to save. Ctrl + X exit."
  - '[PAGE 27]


    # LXDE Desktop


    ![](img/b7499e434c2bd9c15bf347d1647edb1b_27_0.png)


    # The LXDE Desktop


    **chmod** makes the gol.sh script executable. "./" tells Linux to run the script
    from the current directory. **ls** lists files. **pwd** prints the working directory,
    /home/<user-id> is the users home directory. **echo** $PATH lists the search paths
    for executables. “No session for pid . . . Error message popups can safely be
    ignored, click the Ok button.


    ```

    chmod +x gol.sh

    ls -l g*

    pwd

    echo $PATH

    ./gol.sh

    ```'
  - '[PAGE 28]


    # LXDE Startup and Shutdown


    Startup:

    Run the **Terminal** App.

    Select **Penguin** from the Terminal menu.

    ./gol.sh

    Press **Fullscreen** if needed.


    Shutdown (LXDE shuts down with Terminal):

    Exit any running Linux programs.

    Right click on the **Terminal** icon and select **Shut down Linux**.


    # Crosh and Terminal


    Everything on a Chromebook can be run through the Chrome browser. Crosh runs outside
    a Linux Container. To be clear, Termina is a virtual machine, Terminal is a Terminal
    interface. Three important Chrome URL''s to bookmark:


    ```

    chrome-untrusted://crosh

    chrome-untrusted://terminal

    chrome://about

    ```'
  - '[PAGE 29]


    # Navigating from Crosh to Terminal


    Navigating from Crosh, outside a container, to the inside of a container is a
    short process. Allow one command to finish before entering the next command. Enter
    the URL chrome-untrusted://crosh in the Chrome Browser. Ctrl + Shift + P opens
    preferences. Enter the following commands, <user-id> is your user id:


    ```

    vmc start termina

    lxc start penguin

    lxc exec penguin su - <user-id>

    ./gol.sh

    ```


    LXDE will start, return to the Chrome Browser. If LXDE is covering the Chrome
    Browser, just press Fullscreen. Enter the following commands:


    ```

    exit

    lxc stop penguin

    exit

    vmc stop termina

    ```


    If termina is misspelled while starting termina (vmc start termina), a new virtual
    machine will be started with the new name. To correct this, exit the VM, stop
    it, then destroy it. Any containers inside it will also be deleted:


    ```

    vmc start pug

    exit

    vmc list

    vmc stop pug

    vmc destroy pug

    ```'
  - "[PAGE 30]\n\n# When Terminal won’t Start\n\nWhile starting Terminal, on occasion\
    \ you may have a re-occurring error, such as; \"can't open display :2\". To clear\
    \ the error try the following:\n\n+   1) First try:\n   From the Chrome OS Chrome\
    \ Browser:\n   From the Chrome URL:\n   `chrome-untrusted://crosh`\n   `vmc stop\
    \ termina`\n\n+   2) If that fails then:\n   From the Chrome OS Chrome Browser\n\
    \   From the URL:\n   `chrome-untrusted://crosh`\n   `vmc start termina`\n   `lxc\
    \ stop penguin`\n   exit\n   `vmc stop termina`\n\n+   3) If that fails, last\
    \ try :\n   From Terminal\n   Select Penguin from the Terminal menu.\n   sudo\
    \ halt\n   Restart Terminal and select Penguin, then do:\n   `Ctrl + C`n   From\
    \ the Chrome OS Chrome Browser:\n   From the Chrome URL:\n   `chrome-untrusted://crosh`\n\
    \   `vmc stop termina`\n\n+   4) Reboot the Chromebook, start at step one."
