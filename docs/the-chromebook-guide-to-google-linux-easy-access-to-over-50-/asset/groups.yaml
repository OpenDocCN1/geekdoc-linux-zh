    - python3-doc\n- jupyter\n- python3-matplotlib\n- python3-numpy\n- python3-pandas\n\
    \nR is optional, to proceed without R, continue on page 135.\n\n# Install R\n\n\
    From LXTerminal:\n\n```\nsudo su\nupdate-alternatives --get-selections\nupdate-alternatives\
    \ --config x-terminal-emulator\nSelect: 6 for /usr/bin/xterm\nexit\n```\n\nIn\
    \ the users home directory, create the text file:\n.Renviron\nEnter the following\
    \ into the {.Renviron file:\nR_LIBS_USER=\"/usr/local/lib/R/site-library\"\n\n\
    From Synaptic install:\n\n- r-base\n- r-cran-curl\n- r-cran-rgl\n- r-cran-rcmdr\n\
    - r-cran-multcomp\n\nFrom LXTerminal:\nsudo R\nlibrary(Rcmdr)\nClick the Yes button\
