  md: "```\nsleep 10\n^C\n$ fg\nsleep 20\n```\n\n# Killing running jobs\n\n```\n$\
    \ sleep 10 &\n[1] 20024\n\n$ kill %1\n[1]+  Terminated              sleep 10\n\
    ```\n\nThe sleep process runs in the background with process id (pid) 20024 and\
    \ job number 1. In order to reference the process, you can use either the pid\
    \ or the job number. If you use the job number, you must prefix it with %. The\
    \ default kill signal sent by `kill` is SIGTERM, which allows the target process\
    \ to exit gracefully.\n\nSome common kill signals are shown below. To see a full\
    \ list, run `kill -l`.\n\n| Signal name | Signal value | Effect              |\n\
    |-------------|--------------|---------------------|\n| SIGHUP      | 1      \
    \      | Hangup              |\n| SIGINT      | 2            | Interrupt from\
    \ keyboard |\n| SIGKILL     | 9            | Kill signal         |\n| SIGTERM\
    \     | 15           | Termination signal  |\n\n# Start and kill specific processes\n\
    \nProbably the easiest way of killing a running process is by selecting it through\
    \ the process name as in the following example using `pkill` command as\n\n```\n\
    pkill -f test.py\n```\n\n(or) a more fool-proof way using pgrep to search for\
    \ the actual process-id\n\n```\nkill $(pgrep -f 'python test.py')\n```\n\nThe\
    \ same result can be obtained using `grep` over `ps -ef | grep name_of_process`\
    \ then killing the process associated with the resulting pid (process id). Selecting\
    \ a process using its name is convinient in a testing environment but can be really\
    \ dangerous when the script is used in production: it is virtually impossible\
    \ to be sure that the name will match the process you actually want to kill. In\
    \ those cases, the following approach is actually much safe.\n\nStart the script\
    \ that will eventually be killed with the following approach. Let's assume that\
    \ the command you want to execute and eventually kill is `python test.py`.\n\n\
    ```\n#!/bin/bash\n\nif [[ ! -e /tmp/test.py.pid ]]; then    # Check if the file\
    \ already exists\n    python test.py &                    #+and if so do not run\
    \ another process.\n    echo $! > /tmp/test.py.pid\nelse\n    echo -n \"ERROR:\
    \ The process is already running with pid \"\n    cat /tmp/test.py.pid\n    echo\n\
    fi\n```\n\nThis will create a file in the `/tmp` directory containing the pid\
    \ of the `python test.py` process. If the file already exists, we assume that\
    \ the command is already running and the script return an error."
