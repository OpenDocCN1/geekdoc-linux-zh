  md: '# Chapter 15: Bash Parameter Expansion


    The $ character introduces parameter expansion, command substitution, or arithmetic
    expansion. The parameter name or symbol to be expanded may be enclosed in braces,
    which are optional but serve to protect the variable to be expanded from characters
    immediately following it which could be interpreted as part of the name.


    Read more in the [Bash User Manual]().


    # Section 15.1: Modifying the case of alphabetic characters


    Version ≥ 4.0


    To uppercase


    ```

    $ v="hello"

    # Just the first character

    $ printf ''%s\n'' "${v^}"

    Hello

    # All characters

    $ printf ''%s\n'' "${v^^}"

    HELLO

    # Alternative

    $ v="hello world"

    $ declare -u string="$v"

    $ echo "$string"

    HELLO WORLD

    ```


    To lowercase


    ```

    $ v="BYE"

    # Just the first character

    $ printf ''%s\n'' "${v,}"

    bYE

    # All characters

    $ printf ''%s\n'' "${v,,}"

    bye

    # Alternative

    $ v="HELLO WORLD"

    $ declare -l string="$v"

    $ echo "$string"

    hello world

    ```


    Toggle Case


    ```

    $ v="Hello World"

    # All chars

    $ echo "${v~~}"

    hELLO wORLD

    $ echo "${v~}"

    # Just the first char

    hello World

    ```


    # Section 15.2: Length of parameter


    ```

    # Length of a string

    $ var=''12345''

    $ echo "${#var}"

    ```'
