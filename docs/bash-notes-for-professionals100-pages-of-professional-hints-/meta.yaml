  md: "# Chapter 23: Scripting with Parameters\n\n# Section 23.1: Multiple Parameter\
    \ Parsing\n\nTo parse lots of parameters, the preferred way of doing this is using\
    \ a *while* loop, a *case* statement, and *shift*.\n\n**shift** is used to pop\
    \ the first parameter in the series, making what used to be $2, now be $1. This\
    \ is useful for processing arguments one at a time.\n\n```\n#!/bin/bash\n\n# Load\
    \ the user defined parameters\nwhile [[ $# > 0 ]]\ndo\n    case \"$1\" in\n\n\
    \        -a|--valueA)\n                valA=\"$2\"\n                shift\n  \
    \              ;;\n\n        -b|--valueB)\n                valB=\"$2\"\n     \
    \           shift\n                ;;\n\n        --help|*)  \n               \
    \ echo \"Usage:\"\n                echo \"    --valueA \\\"value\\\"\"\n     \
    \           echo \"    --valueB \\\"value\\\"\"\n                echo \"    --help\"\
    \n                exit 1\n                ;;\n    esac\n    shift\ndone\n\necho\
    \ \"A: $valA\"\necho \"B: $valB\"\n```\n\nInputs and Outputs\n\n```\n$ ./multipleParams.sh\
    \ --help\nUsage:\n    --valueA \"value\"\n    --valueB \"value\"\n    --help\n\
    \n$ ./multipleParams.sh\nA:\nB:\n\n$ ./multipleParams.sh --valueB 2\nA:\nB: 2\n\
    \n$ ./multipleParams.sh --valueB 2 --valueA \"hello world\"\nA: hello world\n\
    ```"
  merge: -1
