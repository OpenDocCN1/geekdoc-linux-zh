  md: "For example, the actual `egrep` in new GNU/Linux system is being replaced by\
    \ a wrapper script named `egrep`. This is how it looks:\n\n```\n#!/bin/sh\nexec\
    \ grep -E \"$@\"\n```\n\nSo, when you run `egrep` in such systems, you are actually\
    \ running `grep -E` with all the arguments forwarded.\n\nIn general case, if you\
    \ want to run an example script/command `exmp` with another script `mexmp` then\
    \ the wrapper `mexmp` script will look like:\n\n```\n#!/bin/sh\nexmp \"$@\" #\
    \ Add other options before \"$@\"\n# or\n#full/path/to/exmp \"$@\"\n```\n\n# Section\
    \ 23.4: Accessing Parameters\n\nWhen executing a Bash script, parameters passed\
    \ into the script are named in accordance to their position: $1 is the name of\
    \ the first parameter, $2 is the name of the second parameter, and so on.\n\n\
    A missing parameter simply evaluates to an empty string. Checking for the existence\
    \ of a parameter can be done as follows:\n\n```\nif [ -z \"$1\" ]; then\n    echo\
    \ \"No argument supplied\"\nfi\n```\n\n**Getting all the parameters**\n\n$@ and\
    \ $* are ways of interacting with all the script parameters. Referencing [the\
    \ Bash man page](#), we see that:\n\n+   - $* : Expands to the positional parameters,\
    \ starting from one. When the expansion occurs within double quotes, it expands\
    \ to a single word with the value of each parameter separated by the first character\
    \ of the IFS special variable.\n- $@ : Expands to the positional parameters, starting\
    \ from one. When the expansion occurs within double quotes, each parameter expands\
    \ to a separate word.\n\n**Getting the number of parameters**\n\n$# gets the number\
    \ of parameters passed into a script. A typical use case would be to check if\
    \ the appropriate number of arguments are passed:"
