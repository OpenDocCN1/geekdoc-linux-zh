    \ unpleasant to read, and it gets much worse in a more complex realistic script.\n\
    \n# Section 20.3: Create a file\n\nA classic use of here documents is to create\
    \ a file by typing its content:\n\n```\ncat > fruits.txt << EOF\napple\norange\n\
    lemon\nEOF\n```\n\nThe here-document is the lines between the `<< EOF` and EOF.\n\
    \nThis here document becomes the input of the `cat` command. The `cat` command\
    \ simply outputs its input, and using the output redirection operator `>` we redirect\
    \ to a file `fruits.txt`.\n\nAs a result, the `fruits.txt` file will contain the\
    \ lines:\n\n```\napple\norange\nlemon\n```\n\nThe usual rules of output redirection\
    \ apply: if `fruits.txt` did not exist before, it will be created. If it existed\
