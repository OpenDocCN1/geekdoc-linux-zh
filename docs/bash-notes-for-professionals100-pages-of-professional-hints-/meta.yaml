  md: "```\n    # we need to reverse the contents of $@ so that we can shift\n   \
    \ # the last element into nothingness\n    arr=($(awk <<<\"${arr[@]}\" '{ for\
    \ (i=NF; i>1; --i) printf(\"%s \",$i); print $1; }')\n\n    # set $@ to ${arr[@]}\
    \ so that we can run shift against it.\n    eval set -- \"${arr[@]}\"\n\n    shift\
    \ # remove the last element\n\n    # put the array back to its original order\n\
    \    arr=($(awk <<<\"$@\" '{ for (i=NF; i>1; --i) printf(\"%s \",$i); print $1;\
    \ }')\n\n    # echo the contents for the benefit of users and for bare arrays\n\
    \    echo \"${arr[@]}\"\n\n    if ((isvar)); then\n        # set the contents\
    \ of the original var to the new modified array\n        eval -- \"$var=(${arr[@]})\"\
    \n    fi\n}\n```\n\n# Section 61.2: Using Eval with Getopt\n\nWhile eval may not\
    \ be needed for a pop like function, it is however required whenever you use `getopt`.\n\
    \nConsider the following function that accepts `-h` as an option:\n\n```\nf()\n\
    {\n    local __me__=\"${FUNCNAME[0]}\"\n    local argv=\"$(getopt -o 'h' -n $__me__\
    \ -- \"$@\")\"\n\n    eval set -- \"$argv\"\n\n    while :; do\n        case \"\
    $1\" in\n            -h)\n                echo \"LOLOLOLOL\"\n               \
    \ return 0\n                ;;\n            --)\n                shift\n     \
    \           break\n                ;;\n        esac\n    done\n\n    echo \"$@\"\
    \n}\n```\n\nWithout `eval set -- \"$argv\"` generates\n\n```\n-h --\n```\n\ninstead\
    \ of the desired `(-h --)` and subsequently enters an infinite loop because\n\n\
    ```\n-h --\n```\n\ndoesn't match `--` or `-h`."
