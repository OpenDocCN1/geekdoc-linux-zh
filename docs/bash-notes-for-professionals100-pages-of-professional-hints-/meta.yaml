    # ## Section 1.1: Hello World


    # ### Interactive Shell


    The Bash shell is commonly used **interactively:** It lets you enter and edit
    commands, then executes them when you press the `Return` key. Many Unix-based
    and Unix-like operating systems use Bash as their default shell (notably Linux
    and macOS). The terminal automatically enters an interactive Bash shell process
    on startup.


    Output `Hello World` by typing the following:


    ```

    echo "Hello World"

    #> Hello World  # Output Example

    ```


    # ### Notes


    +   - You can change the shell by just typing the name of the shell in terminal.
    For example: sh, **bash**, etc.

    - **echo** is a Bash builtin command that writes the arguments it receives to
    the standard output. It appends a newline to the output, by default.


    # ### Non-Interactive Shell


    The Bash shell can also be run **non-interactively** from a script, making the
    shell require no human interaction. Interactive behavior and scripted behavior
    should be identical – an important design consideration of Unix V7 Bourne shell
    and transitively Bash. Therefore anything that can be done at the command line
    can be put in a script file for reuse.


    Follow these steps to create a `Hello World` script:


    +   1. Create a new file called `hello-world.sh`'
