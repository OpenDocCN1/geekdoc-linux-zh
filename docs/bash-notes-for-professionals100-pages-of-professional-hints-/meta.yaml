  md: '# # Chapter 3: Navigating directories


    # ## Section 3.1: Absolute vs relative directories


    To change to an absolutely specified directory, use the entire name, starting
    with a slash `/`, thus:


    ```

    cd /home/username/project/abc

    ```


    If you want to change to a directory near your current on, you can specify a relative
    location. For example, if you are already in `/home/username/project`, you can
    enter the subdirectory `abc` thus:


    ```

    cd abc

    ```


    If you want to go to the directory above the current directory, you can use the
    alias `..` For example, if you were in `/home/username/project/abc` and wanted
    to go to `/home/username/project`, then you would do the following:


    ```

    cd ..

    ```


    This may also be called going "up" a directory.


    # ## Section 3.2: Change to the last directory


    For the current shell, this takes you to the previous directory that you were
    in, no matter where it was.


    ```

    cd -

    ```


    Doing it multiple times effectively "toggles" you being in the current directory
    or the previous one.


    # ## Section 3.3: Change to the home directory


    The default directory is the home directory (`$HOME`, typically `/home/username`),
    so `cd` without any directory takes you there


    ```

    cd

    ```


    Or you could be more explicit:


    ```

    cd $HOME

    ```'
