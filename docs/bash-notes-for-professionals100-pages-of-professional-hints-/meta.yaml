  md: "# Chapter 28: Process substitution\n\n# Section 28.1: Compare two files from\
    \ the web\n\nThe following compares two files with `diff` using process substitution\
    \ instead of creating temporary files.\n\n```\ndiff <(curl http://www.example.com/page1)\
    \ <(curl http://www.example.com/page2)\n```\n\n# Section 28.2: Feed a while loop\
    \ with the output of a command\n\nThis feeds a `while` loop with the output of\
    \ a `grep` command:\n\n```\nwhile IFS=: read -r user _\ndo\n    # \"$user\" holds\
    \ the username in /etc/passwd\ndone < <(grep \"hello\" /etc/passwd)\n```\n\n#\
    \ Section 28.3: Concatenating files\n\nIt is well known that you cannot use the\
    \ same file for input and output in the same command. For instance,\n\n```\n$\
    \ cat header.txt body.txt >body.txt\n```\n\ndoesn't do what you want. By the time\
    \ `cat` reads `body.txt`, it has already been truncated by the redirection and\
    \ it is empty. The final result will be that `body.txt` will hold the contents\
    \ of `header.txt` *only*.\n\nOne might think to avoid this with process substitution,\
    \ that is, that the command\n\n```\n$ cat header.txt <(cat body.txt) > body.txt\n\
    ```\n\nwill force the original contents of `body.txt` to be somehow saved in some\
    \ buffer somewhere before the file is truncated by the redirection. It doesn't\
    \ work. The `cat` in parentheses begins reading the file only after all file descriptors\
    \ have been set up, just like the outer one. There is no point in trying to use\
    \ process substitution in this case.\n\nThe only way to prepend a file to another\
    \ file is to create an intermediate one:\n\n```\n$ cat header.txt body.txt >body.txt.new\n\
    $ mv body.txt.new body.txt\n```\n\nwhich is what `sed` or `perl` or similar programs\
    \ do under the carpet when called with an *edit-in-place* option (usually `-i`)."
  merge: -1
  pgno: 109
