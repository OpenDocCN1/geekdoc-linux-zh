    \ declaring your variables inside a script.\n\nIf you want your variable to be\
    \ local to a function, you can use `local` to have that variable a new variable\
    \ that is independent to the global scope and whose value will only be accessible\
    \ inside that function.\n\n# Section 58.1: Global variables\n\n```\nvar=\"hello\"\
    \n\nfunction foo(){\n    echo $var\n}\n\nfoo\n```\n\nWill obviously output \"\
    hello\", but this works the other way around too:\n\n```\nfunction foo() {\n \
    \   var=\"hello\"\n}\n\nfoo\necho $var\n```\n\nWill also output \"hello\"\n\n\
    # Section 58.2: Local variables\n\n```\nfunction foo() {\n    local var\n    var=\"\
    hello\"\n}\n\nfoo\necho $var\n```\n\nWill output nothing, as var is a variable\
    \ local to the function foo, and its value is not visible from outside of it.\n\
    \n# Section 58.3: Mixing the two together\n\n```\nvar=\"hello\"\n\nfunction foo(){\n\
    \    local var=\"sup?\"\n    echo \"inside function, var=$var\"\n}\n\nfoo\necho\
    \ \"outside function, var=$var\"\n```\n\nWill output"
