    \ comparison operator (which syntactically is an argument to [ or [[ or whichever\
    \ test you are using).\n\n# ## Section 36.2: $@\n\n\"$@\" expands to all of the\
    \ command line arguments as separate words. It is different from \"$*\", which\
    \ expands to all of the arguments as a single word.\n\n\"$@\" is especially useful\
    \ for looping through arguments and handling arguments with spaces.\n\nConsider\
    \ we are in a script that we invoked with two arguments, like so:\n\n```\n$ ./script.sh\
    \ \"_1_2_\" \"_3__4_\"\n```\n\nThe variables $* or $@ will expand into $1_$2,\
    \ which in turn expand into 1_2__3__4 so the loop below:\n\n```\nfor var in $*;\
    \ do # same for var in $@; do\n    echo \\\\<\"$var\"\\\\>\ndone\n```\n\nwill\
    \ print for both\n\n```\n<1>\n<2>\n<3>\n<4>\n```\n\nWhile \"$*\" will be expanded\
