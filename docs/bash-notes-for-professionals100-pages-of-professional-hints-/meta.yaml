  md: '```

    `find . -type d -print0 | xargs -r -0 chmod 770`

    ```


    In the above example, the `-print0` and `-0` flags specify that the file names
    will be separated using a null byte, and allows the use of special characters,
    like spaces, in the file names. This is a GNU extension, and may not work in other
    versions of `find` and `xargs`.


    The preferred way to do this is to skip the `xargs` command and let `find` call
    the subprocess itself:


    ```

    `find . -type d -exec chmod 770 {} \;`

    ```


    Here, the `{}` is a placeholder indicating that you want to use the file name
    at that point. `find` will execute `chmod` on each file individually.


    You can alternatively pass all file names to a *single* call of `chmod`, by using


    ```

    `find . -type d -exec chmod 770 {} +`

    ```


    This is also the behaviour of the above `xargs` snippets. (To call on each file
    individually, you can use `xargs -n1`).


    A third option is to let bash loop over the list of filenames `find` outputs:


    ```

    `find . -type d | while read -r d; do chmod 770 "$d"; done`

    ```


    This is syntactically the most clunky, but convenient when you want to run multiple
    commands on each found file. However, this is **unsafe** in the face of file names
    with odd names.


    ```

    `find . -type f | while read -r d; do mv "$d" "${d// /_}"; done`

    ```


    which will replace all spaces in file names with underscores.(This example also
    won''t work if there are spaces in leading *directory* names.)


    The problem with the above is that `while read -r` expects one entry per line,
    but file names can contain newlines (and also, `read -r` will lose any trailing
    whitespace). You can fix this by turning things around:


    ```

    `find . -type d -exec bash -c ''for f; do mv "$f" "${f// /_}"; done'' _ {} +`

    ```


    This way, the `-exec` receives the file names in a form which is completely correct
    and portable; the `bash -c` receives them as a number of arguments, which will
    be found in $@, correctly quoted etc. (The script will need to handle these names
    correctly, of course; every variable which contains a file name needs to be in
    double quotes.)


    The mysterious `_` is necessary because the first argument to `bash -c ''script''`
    is used to populate $0.


    # ## Section 17.3: Finding file by access / modification time


    On an ext filesystem, each file has a stored Access, Modification, and (Status)
    Change time associated with it - to view this information you can use `stat myFile.txt`;
    using flags within `find`, we can search for files that were modified within a
    certain time range.


    To find files that *have* been modified within the last 2 hours:


    ```

    `$ find . -mmin -120`

    ```'
