  md: 'To display the contents of a file in a completely unambiguous byte-by-byte
    form, a hex dump is the standard solution. This is good for very brief snippets
    of a file, such as when you don''t know the precise encoding. The standard hex
    dump utility is `od -cH`, though the representation is slightly cumbersome; common
    replacements include `xxd` and `hexdump`.


    ```

    $ printf ''Héllo wörld'' | xxd

    0000000: 48c3 ab6c 6cc3 b620 77c3 b672 6c64         H..11.. w..rld

    ```


    # Section 5.3: Write to a file


    ```

    cat >file

    ```


    It will let you write the text on terminal which will be saved in a file named
    *file*.


    ```

    cat >>file

    ```


    will do the same, except it will append the text to the end of the file.


    N.B: `Ctrl+D` to end writing text on terminal (Linux)


    A here document can be used to inline the contents of a file into a command line
    or a script:


    ```

    cat <<END >file

    Hello, World.

    END

    ```


    The token after the `<<` redirection symbol is an arbitrary string which needs
    to occur alone on a line (with no leading or trailing whitespace) to indicate
    the end of the here document. You can add quoting to prevent the shell from performing
    command substitution and variable interpolation:


    ```

    cat <<''fnord''

    *Nothing in ''here'' will be $changed*

    *fnord*

    ```


    (Without the quotes, here would be executed as a command, and $changed would be
    substituted with the value of the variable changed -- or nothing, if it was undefined.)


    # Section 5.4: Show non printable characters


    This is useful to see if there are any non-printable characters, or non-ASCII
    characters.'
