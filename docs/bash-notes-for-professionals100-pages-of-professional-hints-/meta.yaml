  md: '# Chapter 48: Chain of commands and operations


    There are some means to chain commands together. Simple ones like just a ; or
    more complex ones like logical chains which run depending on some conditions.
    The third one is piping commands, which effectively hands over the output data
    to the next command in the chain.


    # Section 48.1: Counting a text pattern ocurrence


    Using a pipe makes the output of a command be the input of the next one.


    ```

    ls -l | grep -c ".conf"

    ```


    In this case the output of the ls command is used as the input of the grep command.
    The result will be the number of files that include ".conf" in their name.


    This can be used to construct chains of subsequent commands as long as needed:


    ```

    ls -l | grep ".conf" | grep -c .

    ```


    # Section 48.2: transfer root cmd output to user file


    Often one want to show the result of a command executed by root to other users.
    The **tee** command allows easily to write a file with user perms from a command
    running as root:


    ```

    su -c ifconfig | tee ~/results-of-ifconfig.txt

    ```


    Only **ifconfig** runs as root.


    # Section 48.3: logical chaining of commands with && and ||'
