  md: "# Section 23.2: Argument parsing using a for loop\n\nA simple example which\
    \ provides the options:\n\n| Opt | Alt. Opt | Details |\n|-----|----------|---------|\n\
    | -h | --help | Show help |\n| -v | --version | Show version info |\n| -dr path\
    \ | --doc-root path | An option which takes a secondary parameter (a path) |\n\
    | -i | --install | A boolean option (true/false) |\n| -* | -- | Invalid option\
    \ |\n\n```\n#!/bin/bash\ndr=''\ninstall=false\n\nskip=false\nfor op in \"$@\"\
    ;do\n    if $skip;then skip=false;continue;fi\n    case \"$op\" in\n        -v|--version)\n\
    \            echo \"$ver_info\"\n            shift\n            exit 0\n     \
    \       ;;\n        -h|--help)\n            echo \"$help\"\n            shift\n\
    \            exit 0\n            ;;\n        -dr|--doc-root)\n            shift\n\
    \            if [[ \"$1\" != \"\" ]]; then\n                dr=\"${1///}\"\n \
    \               shift\n                skip=true\n            else\n         \
    \       echo \"E: Arg missing for -dr option\"\n                exit 1\n     \
    \       fi\n            ;;\n        -i|--install)\n            install=true\n\
    \            shift\n            ;;\n        -*)\n            echo \"E: Invalid\
    \ option: $1\"\n            shift\n            exit 1\n            ;;\nesac\n\
    done\n```\n\n# Section 23.3: Wrapper script\n\nWrapper script is a script that\
    \ wraps another script or command to provide extra functionalities or just to\
    \ make something less tedious."
