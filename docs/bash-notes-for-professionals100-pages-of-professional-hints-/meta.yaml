  md: '# Chapter 34: Pattern matching and regular expressions


    # Section 34.1: Get captured groups from a regex match against a string


    ```

    a=''I am a simple string with digits 1234''

    pat=''(.*) ([0-9]+)''

    [[ "$a" =~ $pat ]]

    echo "${BASH_REMATCH[0]}"

    echo "${BASH_REMATCH[1]}"

    echo "${BASH_REMATCH[2]}"

    ```


    Output:


    ```

    I am a simple string with digits 1234

    I am a simple string with digits

    1234

    ```


    # Section 34.2: Behaviour when a glob does not match anything


    **Preparation**


    ```

    $ mkdir globbing

    $ cd globbing

    $ mkdir -p folder/{sub,another}folder/content/deepfolder/

    touch macy stacy tracy "file with space" folder/{sub,another}folder/content/deepfolder/file

    .hiddenfile

    $ shopt -u nullglob

    $ shopt -u failglob

    $ shopt -u dotglob

    $ shopt -u nocaseglob

    $ shopt -u extglob

    $ shopt -u globstar

    ```


    In case the glob does not match anything the result is determined by the options
    `nullglob` and `failglob`. If neither of them are set, Bash will return the glob
    itself if nothing is matched


    ```

    $ echo no*match

    no*match

    ```


    If `nullglob` is activated then nothing (null) is returned:'
