  md: "# Chapter 22: Conditional Expressions\n\n# Section 22.1: File type tests\n\n\
    The `-e` conditional operator tests whether a file exists (including all file\
    \ types: directories, etc.).\n\n```\nif [[ -e $filename ]]; then\n  echo \"$filename\
    \ exists\"\nfi\n```\n\nThere are tests for specific file types as well.\n\n```\n\
    if [[ -f $filename ]]; then\n  echo \"$filename is a regular file\"\nelif [[ -d\
    \ $filename ]]; then\n  echo \"$filename is a directory\"\nelif [[ -p $filename\
    \ ]]; then\n  echo \"$filename is a named pipe\"\nelif [[ -S $filename ]]; then\n\
    \  echo \"$filename is a named socket\"\nelif [[ -b $filename ]]; then\n  echo\
    \ \"$filename is a block device\"\nelif [[ -c $filename ]]; then\n  echo \"$filename\
    \ is a character device\"\nfi\nif [[ -L $filename ]]; then\n  echo \"$filename\
    \ is a symbolic link (to any file type)\"\nfi\n```\n\nFor a symbolic link, apart\
    \ from `-L`, these tests apply to the target, and return false for a broken link.\n\
    \n```\nif [[ -L $filename || -e $filename ]]; then\n  echo \"$filename exists\
    \ (but may be a broken symbolic link)\"\nfi\n\nif [[ -L $filename && ! -e $filename\
    \ ]]; then\n  echo \"$filename is a broken symbolic link\"\nfi\n```\n\n# Section\
    \ 22.2: String comparison and matching\n\nString comparison uses the `==` operator\
    \ between *quoted* strings. The `!=` operator negates the comparison.\n\n```\n\
    if [[ \"$string1\" == \"$string2\" ]]; then\n  echo \"\\$string1 and \\$string2\
    \ are identical\"\nfi\nif [[ \"$string1\" != \"$string2\" ]]; then\n  echo \"\\\
    $string1 and \\$string2 are not identical\"\nfi\n```\n\nIf the right-hand side\
    \ is not quoted then it is a wildcard pattern that `$string1` is matched against.\n\
    \n```\nstring='abc'\npattern1='a*'\npattern2='x*'\nif [[ \"$string\" == $pattern1\
    \ ]]; then\n  # the test is true\n```"
  merge: -1
