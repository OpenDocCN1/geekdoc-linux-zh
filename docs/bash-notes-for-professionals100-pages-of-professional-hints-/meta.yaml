  md: "# Chapter 45: Word splitting\n\n**Parameter**                             \
    \             **Details**\nIFS            Internal field separator\n-x       \
    \      Print commands and their arguments as they are executed (Shell option)\n\
    \n# Section 45.1: What, when and Why?\n\nWhen the shell performs *parameter expansion*,\
    \ *command substitution*, *variable* or *arithmetic expansion*, it scans for word\
    \ boundaries in the result. If any word boundary is found, then the result is\
    \ split into multiple words at that position. The word boundary is defined by\
    \ a shell variable IFS (Internal Field Separator). The default value for IFS are\
    \ space, tab and newline, i.e. word splitting will occur on these three white\
    \ space characters if not prevented explicitly.\n\n```\nset -x\nvar=`I am\na\n\
    multiline string`\nfun() {\n    echo \"-$1-\"\n    echo \"*$2*\"\n    echo \"\
    .$3.\"\n}\nfun $var\n```\n\nIn the above example this is how the fun function\
    \ is being executed:\n\n```\nfun I am a multiline string\n```\n\n> $var is split\
    \ into 5 args, only I, am and a will be printed.\n\n# Section 45.2: Bad effects\
    \ of word splitting\n\n```\n$ a='I am a string with spaces'\n$ [ $a = $a ] ||\
    \ echo \"didn't match\"\nbash: [: too many arguments\ndidn't match\n```\n\n> `[\
    \ $a = $a ]` was interpreted as `[ I am a string with spaces = I am a string with\
    \ spaces ]`. [ is the **test** command for which I am a string with spaces is\
    \ not a single argument, rather it's **6** arguments!!\n\n```\n$ [ $a = something\
    \ ] || echo \"didn't match\"\nbash: [: too many arguments\ndidn't match\n```"
  merge: -1
  pgno: 155
- img_proc: false
  md: "```\nbash: [: too many arguments\n```\n\n> The **grep** command returns a multiline\
    \ string with spaces, so you can just imagine how many arguments are there....:D\n\
    \n*See what, when and why for the basics.*\n\n# Section 45.3: Usefulness of word\
    \ splitting\n\nThere are some cases where word splitting can be useful:\n\n*Filling\
    \ up array:*\n\n```\narr=($(grep -o '[0-9]\\+' file))\n```\n\n> This will fill\
    \ up `arr` with all numeric values found in *file*\n\n*Looping through space separated\
    \ words:*\n\n```\nwords='foo bar baz'\nfor w in $words;do\n    echo \"W: $w\"\n\
    done\n```\n\nOutput:\n\n```\nW: foo\nW: bar\nW: baz\n```\n\n*Passing space separated\
    \ parameters which don't contain white spaces:*\n\n```\npacks='apache2 php php-mbstring\
    \ php-mysql'\nsudo apt-get install $packs\n```\n\nor\n\n```\npacks='\napache2\n\
    php\nphp-mbstring\nphp-mysql\n'\nsudo apt-get install $packs\n```\n\n> This will\
    \ install the packages. If you double quote the `$packs` then it will throw an\
    \ error.\n\n> Unquote`$packs` is sending all the space separated package names\
    \ as arguments to **apt-get**, while quoting it will send the `$packs` string\
    \ as a single argument and then **apt-get** will try to install a package named\
    \ `apache2 php php-mbstring php-mysql` (for the first one) which obviously doesn't\
    \ exist"
  merge: -1
