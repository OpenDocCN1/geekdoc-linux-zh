    done <file\n```\n\nIf file may not include a newline at the end, then:\n\n```\n\
    while IFS= read -r line || [ -n \"$line\" ]; do\n    echo \"$line\"\ndone <file\n\
    ```\n\n# Section 39.2: Looping through the output of a command field by field\n\
