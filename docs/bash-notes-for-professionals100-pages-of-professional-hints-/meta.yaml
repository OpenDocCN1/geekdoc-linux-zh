  md: "# Chapter 47: Using \"trap\" to react to signals and system events\n\n| Parameter\
    \ | Meaning |\n|-----------|---------|\n| -p | List currently installed traps\
    \ |\n| -l | List signal names and corresponding numbers |\n\n# Section 47.1: Introduction:\
    \ clean up temporary files\n\nYou can use the `trap` command to \"trap\" signals;\
    \ this is the shell equivalent of the `signal()` or `sigaction()` call in C and\
    \ most other programming languages to catch signals.\n\nOne of the most common\
    \ uses of `trap` is to clean up temporary files on both an expected and unexpected\
    \ exit.\n\nUnfortunately not enough shell scripts do this :(\n\n```\n#!/bin/sh\n\
    \n# Make a cleanup function\ncleanup() {\n    rm --force -- \"${tmp}\"\n}\n\n\
    # Trap the special \"EXIT\" group, which is always run when the shell exits.\n\
