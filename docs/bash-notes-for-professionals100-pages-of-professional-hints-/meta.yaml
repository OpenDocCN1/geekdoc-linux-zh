  md: "# Chapter 14: Functions\n\n# Section 14.1: Functions with arguments\n\nIn helloJohn.sh:\n\
    \n```\n#!/bin/bash\n\ngreet() {\n  local name=\"$1\"\n  echo \"Hello, $name\"\n\
    }\n\ngreet \"John Doe\"\n\n# running above script\n$ bash helloJohn.sh\nHello,\
    \ John Doe\n```\n\n+   1. If you don't modify the argument in any way, there is\
    \ no need to copy it to a `local` variable - simply `echo \"Hello, $1\"`.\n2.\
    \ You can use `$1`, `$2`, `$3` and so on to access the arguments inside the function.\n\
    \n> **Note:** for arguments more than 9 `$10` won't work (bash will read it as\
    \ `$10`), you need to do `${10}`, `${11}` and so on.\n\n3. `$@` refers to all\
    \ arguments of a function:\n\n```\n#!/bin/bash\nfoo() {\n  echo \"$@\"\n}\n\n\
    foo 1 2 3 # output => 1 2 3\n```\n\n> **Note:** You should practically always\
    \ use double quotes around `\"$@\"`, like here.\n\nOmitting the quotes will cause\
    \ the shell to expand wildcards (even when the user specifically quoted them in\
    \ order to avoid that) and generally introduce unwelcome behavior and potentially\
    \ even security problems.\n\n```\nfoo \"string with spaces;\" '$HOME' \"*\"\n\
    # output => string with spaces; $HOME *\n```\n\n4. for default arguments use `${1:-default_val}`.\
    \ Eg:\n\n```\n#!/bin/bash\nfoo() {\n  local val=${1:-25}\n  echo \"$val\"\n}\n\
    ```"
  merge: -1
