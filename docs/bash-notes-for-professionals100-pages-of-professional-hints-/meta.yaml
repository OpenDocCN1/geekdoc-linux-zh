  md: "```\n>​(command).\n```\n\nHere the command `wc -l >&2` counts the lines read\
    \ from `tee` (which in turn is reading from `bigfile`). (The line count is sent\
    \ to stderr (`>&2`) to avoid mixing with the input to `gzip`.) The stdout of `tee`\
    \ is simultaneously fed into `gzip`.\n\n# ## Section 28.5: With paste command\n\
    \n```\n# Process substitution with paste command is common\n# To compare the contents\
    \ of two directories\npaste <( ls /path/to/directory1 ) <( ls /path/to/directory2\
    \ )\n```\n\n# ## Section 28.6: To avoid usage of a sub-shell\n\nOne major aspect\
    \ of process substitution is that it lets us avoid usage of a sub-shell when piping\
    \ commands from the shell.\n\nThis can be demonstrated with a simple example below.\
    \ I have the following files in my current folder:\n\n```\n$ find . -maxdepth\
    \ 1 -type f -print\nfoo bar zoo foobar foozoo barzoo\n```\n\nIf I pipe to a `while`/`read`\
    \ loop that increments a counter as follows:\n\n```\ncount=0\nfind . -maxdepth\
    \ 1 -type f -print | while IFS= read -r _; do\n    ((count++))\ndone\n```\n\n\
    $count now does *not* contain 6, because it was modified in the sub-shell context.\
    \ Any of the commands shown below are run in a sub-shell context and the scope\
    \ of the variables used within are lost after the sub-shell terminates.\n\n```\n\
    command &\ncommand | command\n( command )\n```\n\nProcess substitution will solve\
    \ the problem by avoiding use the of pipe `|` operator as in\n\n```\ncount=0\n\
    while IFS= read -r _; do\n    ((count++))\ndone < <(find . -maxdepth 1 -type f\
    \ -print)\n```"
