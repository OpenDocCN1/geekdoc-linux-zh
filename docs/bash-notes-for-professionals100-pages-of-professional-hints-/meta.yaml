  md: '# Chapter 7: Aliasing


    Shell aliases are a simple way to create new commands or to wrap existing commands
    with code of your own. They somewhat overlap with shell functions, which are however
    more versatile and should therefore often be preferred.


    # Section 7.1: Bypass an alias


    Sometimes you may want to bypass an alias temporarily, without disabling it. To
    work with a concrete example, consider this alias:


    ```

    alias ls=''ls --color=auto''

    ```


    And let''s say you want to use the `ls` command without disabling the alias. You
    have several options:


    +   - Use the `command` builtin: `command ls`

    - Use the full path of the command: `/bin/ls`

    - Add a `\` anywhere in the command name, for example: `\ls`, or `l\s`

    - Quote the command: `"ls"` or `''ls''`


    # Section 7.2: Create an Alias


    ```

    alias word=''command''

    ```


    Invoking `word` will run `command`. Any arguments supplied to the alias are simply
    appended to the target of the alias:


    ```

    alias myAlias=''some command --with --options''

    myAlias foo bar baz

    ```


    The shell will then execute:


    ```

    some command --with --options foo bar baz

    ```


    To include multiple commands in the same alias, you can string them together with
    `&&`. For example:


    ```

    alias print_things=''echo "foo" && echo "bar" && echo "baz"''

    ```'
