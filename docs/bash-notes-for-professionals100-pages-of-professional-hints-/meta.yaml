  md: "```\nfoo     # output => 25\nfoo 30  # output => 30\n```\n\n+   5. to require\
    \ an argument use `${var:?error message}`\n\n```\nfoo() {\n  local val=${1:?Must\
    \ provide an argument}\n  echo \"$val\"\n}\n```\n\n# Section 14.2: Simple Function\n\
    \nIn `helloWorld.sh`\n\n```\n#!/bin/bash\n\n# Define a function greet\ngreet ()\n\
    {\n    echo \"Hello World!\"\n}\n\n# Call the function greet\ngreet\n```\n\nIn\
    \ running the script, we see our message\n\n```\n$ bash helloWorld.sh\nHello World!\n\
    ```\n\n*Note that* sourcing a file with functions makes them available in your\
    \ current bash session.\n\n```\n$ source helloWorld.sh   # or, more portably,\
    \ \". helloWorld.sh\"\n$ greet\nHello World!\n```\n\nYou can **export** a function\
    \ in some shells, so that it is exposed to child processes.\n\n```\nbash -c 'greet'\
    \   # fails\nexport -f greet   # export function; note -f\nbash -c 'greet'   #\
    \ success\n```\n\n# Section 14.3: Handling flags and optional parameters\n\nThe\
    \ *getopts* builtin can be used inside functions to write functions that accommodate\
    \ flags and optional parameters. This presents no special difficulty but one has\
    \ to handle appropriately the values touched by *getopts*. As an example, we define\
    \ *a failwith* function that writes a message on *stderr* and exits with code\
