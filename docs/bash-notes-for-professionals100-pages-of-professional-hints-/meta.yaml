  md: "# Section 20.5: Run several commands with sudo\n\n```\nsudo -s <<EOF\n  a='var'\n\
    \  echo 'Running serveral commands with sudo'\n  mktemp -d\n  echo \"\\$a\"\n\
    EOF\n```\n\n+   - $a needs to be escaped to prevent it to be expanded by the current\
    \ shell\n\nOr\n\n```\nsudo -s <<'EOF'\n  a='var'\n  echo 'Running serveral commands\
    \ with sudo'\n  mktemp -d\n  echo \"$a\"\nEOF\n```\n\n# Section 20.6: Limit Strings\n\
    \nA heredoc uses the *limitstring* to determine when to stop consuming input.\
    \ The terminating limitstring **must**\n\n+   - Be at the start of a line.\n-\
    \ Be the only text on the line **Note:** If you use `<<-` the limitstring can\
    \ be prefixed with tabs \\t\n\nCorrect:\n\n```\ncat <<limitstring\nline 1\nline\
    \ 2\nlimitstring\n```\n\nThis will output:\n\n```\nline 1\nline 2\n```\n\nIncorrect\
    \ use:\n\n```\ncat <<limitstring\nline 1\nline 2\n limitstring\n```\n\nSince `limitstring`\
    \ on the last line is not exactly at the start of the line, the shell will continue\
    \ to wait for further input, until it sees a line that starts with `limitstring`\
    \ and doesn't contain anything else. Only then it will stop waiting for input,\
    \ and proceed to pass the here-document to the `cat` command.\n\nNote that when\
    \ you prefix the initial limitstring with a hyphen, any tabs at the start of the\
    \ line are removed before parsing, so the data and the limit string can be indented\
    \ with tabs (for ease of reading in shell scripts).\n\n```\ncat <<-limitstring\n\
    \        line 1   has a tab each before the words line and has\n             \
    \   line 2 has two leading tabs\n```"
