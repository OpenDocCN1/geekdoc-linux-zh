  md: "# Chapter 20: Here documents and here strings\n\n# Section 20.1: Execute command\
    \ with here document\n\n```\nssh -p 21 example@example.com <<EOF\n  echo 'printing\
    \ pwd'\n  echo \"\\$(pwd)\"\n  ls -a\n  find '*.txt'\nEOF\n```\n\n$ is escaped\
    \ because we do not want it to be expanded by the current shell i.e `$(pwd)` is\
    \ to be executed on the remote shell.\n\nAnother way:\n\n```\nssh -p 21 example@example.com\
    \ <<'EOF'\n  echo 'printing pwd'\n  echo \"$(pwd)\"\n  ls -a\n  find '*.txt'\n\
    EOF\n```\n\n*Note:* The closing EOF **should** be at the beginning of the line\
    \ (No whitespaces before). If indentation is required, tabs may be used if you\
    \ start your heredoc with `<<-`. See the Indenting here documents and Limit Strings\
    \ examples for more information.\n\n# Section 20.2: Indenting here documents\n\
    \nYou can indent the text inside here documents with tabs, you need to use the\
    \ `<<-` redirection operator instead of `<<`:\n\n```\n$ cat <<- EOF\n\tThis is\
    \ some content indented with tabs '\t'.\n\tYou cannot indent with spaces you __have__\
    \ to use tabs.\n\tBash will remove empty space before these lines.\n\t__Note__:\
    \ Be sure to replace spaces with tabs when copying this example.\nEOF\n```\n\n\
    ```\nThis is some content indented with tabs _\\t_.\nYou cannot indent with spaces\
    \ you __have__ to use tabs.\nBash will remove empty space before these lines.\n\
    __Note__: Be sure to replace spaces with tabs when copying this example.\n```\n\
    \nOne practical use case of this (as mentioned in `man bash`) is in shell scripts,\
    \ for example:\n\n```\nif cond; then\n    cat <<- EOF\n    hello\n    there\n\
    \    EOF\nfi\n```\n\nIt is customary to indent the lines within code blocks as\
    \ in this `if` statement, for better readability. Without the `<<-`"
