  md: "# Chapter 38: Case statement\n\n# Section 38.1: Simple case statement\n\nIn\
    \ its simplest form supported by all versions of bash, case statement executes\
    \ the case that matches the pattern. `;;` operator breaks after the first match,\
    \ if any.\n\n```\n#!/bin/bash\n\nvar=1\ncase $var in\n1)\n    echo \"Antartica\"\
    \n    ;;\n2)\n    echo \"Brazil\"\n    ;;\n3)\n    echo \"Cat\"\n    ;;\nesac\n\
    ```\n\nOutputs:\n\n```\nAntartica\n```\n\n# Section 38.2: Case statement with\
    \ fall through\n\n`Version ≥ 4.0`\n\nSince bash 4.0, a new operator `;&` was introduced\
    \ which provides [fall through](#) mechanism.\n\n#!/bin/bash\n\n```\nvar=1\ncase\
    \ $var in\n1)\n    echo \"Antartica\"\n    ;&\n2)\n    echo \"Brazil\"\n    ;&\n\
    3)\n    echo \"Cat\"\n    ;&\nesac\n```\n\nOutputs:"
  merge: -1
  pgno: 141
- img_proc: false
  md: "Since Bash 4.0, another operator `;;&` was introduced which also provides fall\
    \ through *only if* the patterns in subsequent case statement(s), if any, match.\n\
    \n```\n#!/bin/bash\n\nvar=abc\ncase $var in\na*)\n    echo \"Antartica\"\n   \
    \ ;;&\nxyz)\n    echo \"Brazil\"\n    ;;&\n*b*)\n    echo \"Cat\"\n    ;;&\nesac\n\
    ```\n\nOutputs:\n\n```\nAntartica\nCat\n```\n\nIn the below example, the `abc`\
    \ matches both first and third case but not the second case. So, second case is\
    \ not executed."
