  md: "```\n    echo \"The string $string matches the pattern $pattern\"\nfi\nif [[\
    \ \"$string\" != $pattern2 ]]; then\n  # the test is false\n  echo \"The string\
    \ $string does not match the pattern $pattern\"\nfi\n```\n\nThe < and > operators\
    \ compare the strings in lexicographic order (there are no less-or-equal or greater-or-equal\
    \ operators for strings).\n\nThere are unary tests for the empty string.\n\n```\n\
    if [[ -n \"$string\" ]]; then\n    echo \"$string is non-empty\"\nfi\nif [[ -z\
    \ \"${string/ /}\" ]]; then\n    echo \"$string is empty or contains only spaces\"\
    \nfi\nif [[ -z \"$string\" ]]; then\n    echo \"$string is empty\"\nfi\n```\n\n\
    Above, the -z check may mean $string is unset, or it is set to an empty string.\
    \ To distinguish between empty and unset, use:\n\n```\nif [[ -n \"${string+x}\"\
    \ ]]; then\n    echo \"$string is set, possibly to the empty string\"\nfi\nif\
    \ [[ -n \"${string-x}\" ]]; then\n    echo \"$string is either unset or set to\
    \ a non-empty string\"\nfi\nif [[ -z \"${string+x}\" ]]; then\n    echo \"$string\
    \ is unset\"\nfi\nif [[ -z \"${string-x}\" ]]; then\n    echo \"$string is set\
    \ to an empty string\"\nfi\n```\n\nwhere x is arbitrary. Or in [table form](#):\n\
    \n```\n                +-------+-------+-----------+\n$string is:    | unset |\
    \ empty | non-empty |\n+---------------+-------+-------+-----------+\n| [[ -z\
    \ ${string} ]] | true  | true  | false     |\n| [[ -z ${string+x} ]] | true  |\
    \ false | false     |\n| [[ -z ${string-x} ]] | false | true  | false     |\n\
    | [[ -n ${string} ]] | false | false | true      |\n| [[ -n ${string+x} ]] | false\
    \ | true  | true      |\n| [[ -n ${string-x} ]] | true  | false | true      |\n\
    +---------------+-------+-------+-----------+\n```\n\n[Alternatively](#), the\
    \ state can be checked in a case statement:\n\n```\ncase ${var+x$var} in\n  (x)\
    \ echo empty;;\n  (\"\") echo unset;;\n  (x*[![:blank:]]*) echo non-blank;;\n\
    \  (*) echo blank\n```"
