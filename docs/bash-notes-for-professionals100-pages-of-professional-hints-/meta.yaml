- img_proc: false
  md: "```\ncd my_directory && ls || echo \"No such directory\"\n```\n\n+   - If the\
    \ cd fails, the && ls is skipped and the || echo ... is executed.\n- If the cd\
    \ succeeds, the && ls is executed.\n    - If the ls succeeds, the || echo ...\
    \ is ignored. *(so far so good)*\n    - **BUT... if the ls fails, the** || echo\
    \ **... will also be executed.**\n\n> **It is the ls**, not the cd, **that is\
    \ the previous command.**\n\n# **Why use conditional execution of command lists**\n\
    \nConditional execution is a hair faster than if ... then but its main advantage\
    \ is allowing functions and scripts to exit early, or \"short circuit\".\n\nUnlike\
    \ many languages like C where memory is explicitly allocated for structs and variables\
    \ and such (and thus must be deallocated), **bash** handles this under the covers.\
    \ In most cases, we don't have to clean up anything before leaving the function.\
    \ A **return** statement will deallocate everything local to the function and\
    \ pickup execution at the return address on the stack.\n\nReturning from functions\
    \ or exiting scripts as soon as possible can thus significantly improve performance\
    \ and reduce system load by avoiding the unnecessary execution of code. For example...\n\
    \n```\nmy_function () {\n\n    ### ALWAYS CHECK THE RETURN CODE\n\n    # one argument\
    \ required. \"\" evaluates to false(1)\n    [[ \"$1\" ]]             || return\
    \ 1\n\n    # work with the argument. exit on failure\n    do_something_with \"\
    $1\" || return 1\n    do_something_else      || return 1\n\n    # Success! no\
    \ failures detected, or we wouldn't be here\n    return 0\n}\n```\n\n# ## Section\
    \ 10.2: If statement\n\n```\nif [[ $1 -eq 1 ]]; then\n    echo \"1 was passed\
    \ in the first parameter\"\nelif [[ $1 -gt 2 ]]; then\n    echo \"2 was not passed\
