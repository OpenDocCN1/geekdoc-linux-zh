  md: "# # Chapter 59: CGI Scripts\n\n# ## Section 59.1: Request Method: GET\n\nIt\
    \ is quite easy to call a CGI-Script via GET.\nFirst you will need the encoded\
    \ `url` of the script.\n\nThen you add a question mark `?` followed by variables.\n\
    \n+   - Every variable should have two sections separated by **=**.\n  First section\
    \ should be always a unique name for each variable,\n  while the second part has\
    \ values in it only\n- Variables are separated by **&**\n- Total length of the\
    \ string should not rise above **255** characters\n- Names and values needs to\
    \ be html-encoded (replace: **< /** , **/?** : **@ & = + $** )\n  **Hint:**\n\
    \  When using **html-forms** the request method can be generated by it self.\n\
    \  With **Ajax** you can encode all via **encodeURI** and **encodeURIComponent**\n\
    \n**Example:**\n\n```\nhttp://www.example.com/cgi-bin/script.sh?var1=Hello%20World!&var2=This%20is%20a%20Test.&\n\
    ```\n\nThe server should communicate via **Cross-Origin Resource Sharing** (CORS)\
