  md: '# Section 36.22: $HOSTTYPE


    This variable identifies the hardware, it can be useful in determining which binaries
    to execute:


    ```

    ~$ echo $HOSTTYPE

    x86_64

    ```


    # Section 36.23: $MACHTYPE


    Similar to $HOSTTYPE above, this also includes information about the OS as well
    as hardware


    ```

    ~$ echo $MACHTYPE

    x86_64-redhat-linux-gnu

    ```


    # Section 36.24: $OSTYPE


    Returns information about the type of OS running on the machine, eg.


    ```

    ~$ echo $OSTYPE

    linux-gnu

    ```


    # Section 36.25: $PATH


    The search path for finding binaries for commands. Common examples include `/usr/bin`
    and `/usr/local/bin`.


    When a user or script attempts to run a command, the paths in $PATH are searched
    in order to find a matching file with execute permission.


    The directories in $PATH are separated by a `:` character.


    ```

    ~$ echo "$PATH"

    /usr/kerberos/bin:/usr/local/bin:/bin:/usr/bin

    ```


    So, for example, given the above $PATH, if you type `lss` at the prompt, the shell
    will look for `/usr/kerberos/bin/lss`, then `/usr/local/bin/lss`, then `/bin/lss`,
    then `/usr/bin/lss`, in this order, before concluding that there is no such command.


    # Section 36.26: $PPID


    The Process ID (pid) of the script or shell''s parent, meaning the process than
    invoked the current script or shell.


    ```

    ~$ echo $$

    13016

    ~$ echo $PPID

    13015

    ```


    # Section 36.27: $SECONDS


    The number of seconds a script has been running. This can get quite large if shown
    in the shell:


    ```

    ~$ echo $SECONDS

    98834

    ```'
