  md: '```

    mkdir pipeFolder

    cd pipeFolder

    mkfifo myPipe

    ls -l

    ```


    The output is:


    ```

    prw-r--r-- 1 root root 0 Jul 25 11:20 myPipe

    ```


    Notice the first character in the permissions, it''s listed as a pipe, not a file.


    Now let''s do something cool.


    Open one terminal, and make note of the directory (or create one so that cleanup
    is easy), and make a pipe.


    ```

    mkfifo myPipe

    ```


    Now let''s put something in the pipe.


    ```

    echo "Hello from the other side" > myPipe

    ```


    You''ll notice this hangs, the other side of the pipe is still closed. Let''s
    open up the other side of the pipe and let that stuff through.


    Open another terminal and go to the directory that the pipe is in (or if you know
    it, prepend it to the pipe):


    ```

    cat < myPipe

    ```


    You''ll notice that after `hello from the other side` is output, the program in
    the first terminal finishes, as does that in the second terminal.


    Now run the commands in reverse. Start with `cat < myPipe` and then `echo` something
    into it. It still works, because a program will wait until something is put into
    the pipe before terminating, because it knows it has to get something.


    Named pipes can be useful for moving information between terminals or between
    programs.


    Pipes are small. Once full, the writer blocks until some reader reads the contents,
    so you need to either run the reader and writer in different terminals or run
    one or the other in the background:


    ```

    ls -l /tmp > myPipe &

    cat < myPipe

    ```


    **More examples using named pipes:**


    +   - Example 1 - all commands on the same terminal / same shell


    ```

    $ { ls -l && cat file3; } >mypipe &

    $ cat <mypipe

