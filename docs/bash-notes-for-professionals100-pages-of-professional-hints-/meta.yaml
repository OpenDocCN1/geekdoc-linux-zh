  md: "```\nesac\n```\n\nWhere [:blank:] is locale specific horizontal spacing characters\
    \ (tab, space, etc).\n\n# Section 22.3: Test on exit status of a command\n\nExit\
    \ status 0: success\nExit status other than 0: failure\n\nTo test on the exit\
    \ status of a command:\n\n```\nif command;then\n    echo 'success'\nelse\n   \
    \ echo 'failure'\nfi\n```\n\n# Section 22.4: One liner test\n\nYou can do things\
    \ like this:\n\n```\n[[ $s = 'something' ]] && echo 'matched' || echo \"didn't\
    \ match\"\n[[ $s == 'something' ]] && echo 'matched' || echo \"didn't match\"\n\
    [[ $s != 'something' ]] && echo \"didn't match\" || echo \"matched\"\n[[ $s -eq\
    \ 10 ]] && echo 'equal' || echo \"not equal\"\n(( $s == 10 )) && echo 'equal'\
    \ || echo 'not equal'\n```\n\nOne liner test for exit status:\n\n```\ncommand\
    \ && echo 'exited with 0' || echo 'non 0 exit'\ncmd && cmd1 && echo 'previous\
    \ cmds were successful' || echo 'one of them failed'\ncmd || cmd1 #If cmd fails\
    \ try cmd1\n```\n\n# Section 22.5: File comparison\n\n```\nif [[ $file1 -ef $file2\
    \ ]]; then\n    echo \"$file1 and $file2 are the same file\"\nfi\n```\n\n\"Same\
    \ file\" means that modifying one of the files in place affects the other. Two\
    \ files can be the same even if they have different names, for example if they\
    \ are hard links, or if they are symbolic links with the same target, or if one\
    \ is a symbolic link pointing to the other."
