  md: "```\n    echo \"$file1 and $file2 have identical contents\"\nelse\n    : #\
    \ the differences between the files have been listed\nfi\n```\n\n# ## Section\
    \ 22.6: File access tests\n\n```\nif [[ -r $filename ]]; then\n    echo \"$filename\
    \ is a readable file\"\nfi\nif [[ -w $filename ]]; then\n    echo \"$filename\
    \ is a writable file\"\nfi\nif [[ -x $filename ]]; then\n    echo \"$filename\
    \ is an executable file\"\nfi\n```\n\nThese tests take permissions and ownership\
    \ into account to determine whether the script (or programs launched from the\
    \ script) can access the file.\n\nBeware of [race conditions](#) (TOCTOU): just\
    \ because the test succeeds now doesn't mean that it's still valid on the next\
    \ line. It's usually better to try to access a file, and handle the error, rather\
    \ than test first and then have to handle the error anyway in case the file has\
    \ changed in the meantime.\n\n# ## Section 22.7: Numerical comparisons\n\nNumerical\
    \ comparisons use the `-eq` operators and friends\n\n```\nif [[ $num1 -eq $num2\
    \ ]]; then\n    echo \"$num1 == $num2\"\nfi\nif [[ $num1 -le $num2 ]]; then\n\
    \    echo \"$num1 <= $num2\"\nfi\n```\n\nThere are six numeric operators:\n\n\
    +   - `-eq` equal\n- `-ne` not equal\n- `-le` less or equal\n- `-lt` less than\n\
