    # Section 24.5: Using !$


    You can use the !$ to reduce repetition when using the command line:


    ```

    $ **echo** ping

    **ping**

    $ **echo** !$

    **ping**

    ```


    You can also build upon the repetition


    ```

    $ **echo** !$ pong

    **ping** pong

    $ **echo** !$, a great game

    pong, a great game

    ```


    Notice that in the last example we did not get **ping** pong, a great game because
    the last argument passed to the previous command was pong, we can avoid issue
    like this by adding quotes. Continuing with the example, our last argument was
    game:


    ```

    $ **echo** "it is !$ time"

    it is game **time**

    $ **echo** "hooray, !$!"

    hooray, it is game **time**!

    ```


    # Section 24.6: Repeat the previous command with a substitution


    ```

    $ **mplayer** Lecture_video_part1.mkv

    $ ^1^2^

    **mplayer** Lecture_video_part2.mkv

    ```


    This command will replace 1 with 2 in the previously executed command. It will
    only replace the first occurrence of the string and is equivalent to !!:s/1/2/.


    If you want to replace *all* occurrences, you have to use !!:gs/1/2/ or !!:as/1/2/.'
