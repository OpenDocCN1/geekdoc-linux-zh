  md: '# File Type


    The file type can be one of any of the following characters.


    | Character | File Type |

    |-----------|-----------|

    | -         | Regular file |

    | b         | Block special file |

    | c         | Character special file |

    | C         | High performance ("contiguous data") file |

    | d         | Directory |

    | D         | Door (special IPC file in Solaris 2.5+ only) |

    | l         | Symbolic link |

    | M         | Off-line ("migrated") file (Cray DMF) |

    | n         | Network special file (HP-UX) |

    | p         | FIFO (named pipe) |

    | P         | Port (special system file in Solaris 10+ only) |

    | s         | Socket |

    | ?         | Some other file type |


    # Section 4.2: List the Ten Most Recently Modified Files


    The following will list up to ten of the most recently modified files in the current
    directory, using a long listing format (`-l`) and sorted by time (`-t`).


    ```

    ls -lt | head

    ```


    # Section 4.3: List All Files Including Dotfiles


    A **dotfile** is a file whose names begin with a `.`. These are normally hidden
    by `ls` and not listed unless requested.


    For example the following output of `ls`:


    ```

    $ ls

    bin  pki

    ```


    The `-a` or `--all` option will list all files, including dotfiles.


    ```

    $ ls -a

    .   .ansible       .bash_logout   .bashrc    .lesshst    .puppetlabs    .viminfo

    ..  .bash_history  .bash_profile  bin        pki         .ssh

    ```


    The `-A` or `--almost-all` option will list all files, including dotfiles, but
    does not list implied `.` and `..`. Note that `.` is the current directory and
    `..` is the parent directory.


    ```

    $ ls -A

    .ansible       .bash_logout   .bashrc       .lesshst    .puppetlabs    .viminfo

    .bash_history  .bash_profile  bin           pki         .ssh

    ```


    # Section 4.4: List Files Without Using `ls`


    Use the Bash shell''s [filename expansion](#) and [brace expansion](#) capabilities
    to obtain the filenames:'
