    $ shopt -u nocaseglob

    $ shopt -u extglob

    $ shopt -u globstar

    ```


    The ? simply matches exactly one character


    ```

    $ echo ?acy

    macy

    $ echo ??acy

    stacy tracy

    ```


    # Section 34.8: The [ ] glob


    **Preparation**


    ```

    $ mkdir globbing

    $ cd globbing

    $ mkdir -p folder/{sub,another}folder/content/deepfolder/

    touch macy stacy tracy "file with space" folder/{sub,another}folder/content/deepfolder/file.hiddenfile

    $ shopt -u nullglob

    $ shopt -u failglob

    $ shopt -u dotglob

    $ shopt -u nocaseglob

    $ shopt -u extglob

    $ shopt -u globstar

    ```


    If there is a need to match specific characters then ''[]'' can be used. Any character
    inside ''[]'' will be matched exactly once.


    ```

    $ echo [m]acy

    macy

    $ echo [st][tr]acy

    stacy tracy

    ```


    The [ ] glob, however, is more versatile than just that. It also allows for a
    negative match and even matching ranges of characters and character classes. A
