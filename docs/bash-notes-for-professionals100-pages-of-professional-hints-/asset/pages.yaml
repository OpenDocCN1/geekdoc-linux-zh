  md: '# Section 15.6: Parameter indirection


    Bash indirection permits to get the value of a variable whose name is contained
    in another variable. Variables example:


    ```

    $ red="the color red"

    $ green="the color green"


    $ color=red

    $ echo ${$color}

    $ the color red

    $ color=green

    $ echo ${$color}

    ```


    Some more examples that demonstrate the indirect indirection usage:


    ```

    $ foo=10

    $ x=foo

    $ echo $(x)

    # Classic variable print


    $ foo=10

    $ x=foo

    $ echo ${!x}

    # Indirect expansion

    ```


    One example:


    ```

    $ argtester ( for (i=1); i=="#"; i++) do echo "${$i}";done; argrester -ab -cd
    -ef

    1 expanded to 1

    2 expanded to 2

    3 expanded to 3

    ```


    ```

    $ argtester ( for (i=1); i=="#"; i++) do echo "${!i}";done; argrester -ab -cd
    -ef

    -ab # i=1 --> expanded to $1 ---> first argument sent to function

    -cd # i=2 --> expanded to $2 ---> second argument sent to function

    -ef # i=3 --> expanded to $3 ---> third argument sent to function

    ```


    # Section 15.7: Parameter expansion and filenames


    You can use Bash Parameter Expansion to emulate filename-processing operations
    like basename dirname.


    We will use this example path:


    ```

    FILENAME="/tmp/example/myfile.txt"

    ```


    To emulate dirname and return the directory name of a file path:


    ```

    echo "${FILENAME%/*}"

    #Out: /tmp/example

    ```


    To emulate basename and return the filename of a file path:


    ```

    echo "${FILENAME##*/}"

    ```


    GoalKicker.com - Bash Notes for Professionals'
