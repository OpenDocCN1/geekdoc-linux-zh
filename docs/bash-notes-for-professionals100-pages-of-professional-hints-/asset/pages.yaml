  md: "# Chapter 61: When to use eval\n\nFirst and foremost: know what you're doing!\
    \ Secondly, while you should avoid using eval, if its use makes cleaner code,\
    \ go ahead.\n\n# Section 61.1: Using Eval\n\nFor example, consider the following\
    \ that sets the contents of $@ to the contents of a given variable:\n\n```\na=$(1\
    \ 2 3)\neval set -- \"${$@}\"\n```\n\nThis code is itself accompanied by getopt\
    \ and getopts to set $@ to the output of the aforementioned option parsers, however,\
    \ you can also use it to create a simple pop function that can operate on variables\
    \ silently and directly without having to store the result to the original variable:\n\
    \n```\nisnum()\n{\n  # is argument an integer?\n  local re=\"^[0-9]+\\$\"\n  if\
    \ [[ -n $1 ]]; then\n    if [[ $1 == $re ]] && return 0\n  else\n    return 2\n\
    \  fi\n}\n```\n\n```\nisvar()\n{\n  if isnum \"$1\"; then\n    return 1\n  fi\n\
    \  local arr=\"${$(eval -- echo -n \\\"$1\")\"\n  if [[ -n ${arr[@]}] ]]; then\n\
    \    return 0\n  fi\n}\n```\n\n```\npop()\n{\n  if [[ -z $@ ]]; then\n    return\
    \ 1\n  fi\n  local var=\n  local isvar=0\n  local arr=()\n  if isvar \"$1\"; then\
    \ # let's check to see if this is a variable or just a bare array\n    var=\"\
    $1\"\n    isvar=1\n    arr=\"${$(eval eval echo -n \\\"${$1[@]}\")}\\ if it is\
    \ a var, get its contents\n  else\n    arr=\"($@)\"\n  fi}\n```"
  merge: -1
