  md: 'The asterisk * is probably the most commonly used glob. It simply matches any
    String


    ```

    $ echo *acy

    macy stacy tracy

    ```


    A single * will not match files and folders that reside in subfolders


    ```

    $ echo *

    emptyfolder folder macy stacy tracy

    $ echo folder/*

    folder/anotherfolder folder/subfolder

    ```


    # Section 34.6: The ** glob


    Version ≥ 4.0


    Preparation


    ```

    $ mkdir globbing

    $ cd globbing

    $ mkdir -p folder/{sub,another}folder/content/deepfolder/

    touch macy stacy tracy "file with space" folder/{sub,another}folder/content/deepfolder/file

    $ shop -u nullglob

    $ shop -u failglob

    $ shop -u dotglob

    $ shop -u nocaseglob

    $ shop -u extglob

    $ shop -s globstar

    ```


    Bash able to interpret adjacent asterisks as a single glob. With the globstar
    activated this can be used to match folders that reside deep in the directory
    structure


    ```

    echo **

    emptyfolder folder/anotherfolder/anotherfolder/content

    folder/anotherfolder/content/deepfolder/anotherfolder/content/deepfolder/file

    folder/subfolder/folder/subfolder/content/deepfolder/content/deepfolder

    folder/subfolder/content/deepfolder/file macy stacy tracy

    ```


    The ** can be thought of as path expansion, no matter how deep the path is. This
    example matches any file or folder that starts with deep, regardless of how deep
    it is nested:


    ```

    $ echo /**deep/

    folder/anotherfolder/content/deepfolder folder/subfolder/content/deepfolder

    ```


    # Section 34.7: The ? glob


    Preparation


    ```

    $ mkdir globbing

    $ cd globbing

    $ mkdir -p folder/{sub,another}folder/content/deepfolder/

    touch macy stacy tracy "file with space" folder/{sub,another}folder/content/deepfolder/file

    .hiddenfile

    $ shop -u nullglob

    $ shop -u failglob

    $ shop -u dotglob

    ```


    GoalKicker.com – Bash Notes for Professionals'
