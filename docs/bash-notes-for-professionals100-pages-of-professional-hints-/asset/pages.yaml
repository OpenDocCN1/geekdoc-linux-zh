  md: '# Chapter 2: Script shebang


    # Section 2.1: Env shebang


    To execute a script file with bash executable found in the PATH environment variable
    by using the executable env, the **first line** of a script file must indicate
    the absolute path to the env executable with the argument bash:


    ```

    #!/usr/bin/env bash

    ```


    The env path in the shebang is resolved and used only if a script is directly
    launch like this:


    ```

    script.sh

    ```


    The script must have execution permission.


    The shebang is ignored when a bash interpreter is explicitly indicated to execute
    a script:


    ```

    bash script.sh

    ```


    # Section 2.2: Direct shebang


    To execute a script file with bash interpreter, the **first line** of a script
    file must indicate the absolute path to the bash executable to use:


    ```

    #!/bin/bash

    ```


    The bash path in the shebang is resolved and used only if a script is directly
    launch like this:


    ```

    ./script.sh

    ```


    The script must have execution permission.


    The shebang is ignored when a bash interpreter is explicitly indicated to execute
    a script:


    ```

    bash script.sh

    ```


    # Section 2.3: Other shebangs


    There are two kinds of programs the kernel knows: A binary program is identified
    by it''s ELF (ExtensibleLoadableFormat) header, which is usually produced by a
    compiler. The second one are scripts of any kind.


    If a file starts in the first line with the sequence # then the next string has
    to be a pathname of an interpreter. If the kernel knows this, it calls the interpreter
    name by this pathname and gives all of the following words in this line as arguments
    to the interpreter. If there is no file named "something" or "wrong":


    ```

    #!bin/bash something wrong

    echo "This line never gets printed"

    ```


    bash tries to execute its argument "something wrong" which doesn''t exist. The
    name of the script file is added too. To see this clearly echo shebang:'
