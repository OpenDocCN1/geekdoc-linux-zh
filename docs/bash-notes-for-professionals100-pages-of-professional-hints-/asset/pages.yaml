  md: "# Chapter 45: Word splitting\n\n| Parameter | Details |\n| --- | --- |\n| IFS\
    \ | Internal field separator |\n| -x | Print commands and their arguments as they\
    \ are executed (Shell option) |\n\n# Section 45.1: What, when and Why?\n\nWhen\
    \ the shell performs parameter expansion, command substitution, variable or arithmetic\
    \ expansion, it scans for word boundaries in the result. If any word boundary\
    \ is found, the result is split into multiple words at that position. The word\
    \ boundary is defined by a shell variable IFS (Internal Field Separator). The\
    \ default value for IFS is space, tab and newline, i.e. word splitting will occur\
    \ these three white space characters if not prevented explicitly.\n\n```\nset\
    \ -x\nvar='I am multiline string'\nfun(){\n  echo \"$1\"\n  echo \"$2\"\n  echo\
    \ \"$3\"\n}\nfun $var\n```\n\nIn the above example this is how the function is\
    \ being executed:\n\nfun I am a multiline string\n\n> $var is split into 5 args,\
    \ only I, am and a be printed.\n\n# Section 45.2: Bad effects of word splitting\n\
    \n```\n$ a='I am a string with spaces'\n$ $a = $a ] || echo \"didn't match\"\n\
    bash: [ : too many arguments\ndidn t match\n```\n\n> [ $a = $a ] interpreted as\
    \ [ I am a string with spaces = I am a string with spaces ]. [ is the test command\
    \ for which I am a string with spaces is not a single argument, rather it's 6\
    \ arguments! ]\n\n```\n$ $a = something ] || echo \"didn't match\"\nbash: [ :\
    \ too many arguments\ndidn t match\n```\n\n> [ $a = something ] interpreted as\
    \ [ I am a string with spaces = something ]\n\n```\n$ $(grep . file) = 'something'\
    \ ]\n```"
  merge: -1
  pgno: 155
