  md: "# Chapter 47: Using \"trap\" to react to signals and system events\n\n| Parameter\
    \ | Meaning |\n| -p | List currently installed traps |\n| -l | List signal names\
    \ and corresponding numbers |\n\n# Section 47.1: Introduction: clean up temporary\
    \ files\n\nYou can use the trap command to \"trap\" signals; this is the shell\
    \ equivalent of the signal() or sigaction() call in C and other programming languages\
    \ to catch signals.\n\nOne of the most common uses of trap is to clean up temporary\
    \ files on both an expected and unexpected exit.\n\nUnfortunately not enough shell\
    \ scripts do this ::(\n\n```\n#!/bin/sh\n\n# Make a cleanup function\ncleanup()\
    \ {\n  rm --force \"${tmp}\"\n}\n\n# Trap the special \"EXIT\" group, which is\
    \ always run when the shell exits.\ntrap cleanup EXIT\n\n# Create a temporary\
    \ file\ntmp=$(mktemp -p /tmp tmpfileXXXXXXXX)\n```\n\necho \"Hello, world!\" >>\
    \ \"$(tmp)\"\n\n# No rm -f \"tmp\" needed. The advantage of using EXIT is that\
    \ it still works\n# if there was an error or if you used it.\n\n# Section 47.2:\
    \ Catching SIGINT or Ctrl+C\n\nThe trap is reset for subshells, the sleep will\
    \ still act on the SIGINT sent by ^C (usually by quitting), but the parent process\
    \ (i.e. the shell script) won't.\n\n```\n#!/bin/sh\n\n# Run a command on signal\
    \ 2 (SIGINT, which is what ^C sends)\nsigint() {\n  echo \"Killed subshell!\"\n\
    }\ntrap sig INT\n\n# Use the no-op command for no output\n#trap : INT\n\n# This\
    \ will be killed on the first ^C\necho \"Sleeping...\"\nsleep 500\n\necho \"Sleeping...\"\
    \nsleep 500\n```"
  merge: -1
  pgno: 160
- img_proc: true
  md: "A variant which still allows you to quit the program by pressing ^C twice in\
    \ second:\n\n```\nlast=0\nallow_quit() {\n  [ $(date +%s) -lt $(( $last + 1 ))\
    \ ] && exit\n  echo \"Press C twice in a row to quit\"\n  last=$(date +%s)\n}\n\
    trap allow_quit INT\n```\n\n# Section 47.3: Accumulate a list of trap work to\
    \ run at exit\n\nHave you ever forgotten to add a trap to clean up a temporary\
    \ file or do other work at exit?\n\nHave you ever set one trap which canceled\
    \ another?\n\nThis code makes it easy to add things to be done on one item at\
    \ a time, rather than having one large trap statement somewhere in your code,\
    \ which may be easy to forget.\n\n```\n# on_exit and add_on_exit\n# Usage:\n#\
    \ add_on_exit rm -f /tmp/*\n# add_on_exit echo \"I am exiting\"\n# tempfile=$(mktemp)\n\
    # add_on_exit rm -f \"$tempfile\"\n# Based on http://www.linuxjournal.com/content/bash-trap-statement-cleanup-temporary-files\n\
    function on_exit() {\n  for i in \"${on_items[@]}\";\n  do\n    eval $i\n  done\n\
