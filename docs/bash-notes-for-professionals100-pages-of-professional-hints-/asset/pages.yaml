  md: '# Section 63.2: Parallelize STDIN


    Now, let''s imagine we have 1 large file (e.g. 30 GB) that needs to be converted,
    line by line. Say we have a script, convert.ah, that does this <task>. We can
    pipe contents of this file to stdin for parallel to take in and work with in chunks


    ```

    <stdin | parallel --pipe --block size= -k task > output.txt

    ```


    where <stdin> can originate from anything such as cat <file>.


    As a reproducible example, our task will be nl -n rz. Any file, will be data.bz2,
    and pass it to <stdin>

    bzcat data.bz2 | nl | parallel --pipe --block 10M -k nl -n rz | gzip > ouput.gz


    The above example takes <stdin> from bzcat data.bz2 | nl, where I included nl
    1 just as a proof of concept that the final output .gz will be saved in the order
    it received. Then, parallel divides the <stdin> into chunks of size 10 MB, and
    for each chunk it passes through nl -n rz where it appends numbers rightly justified
    (see nl --help for further details). The options --pipe tells parallel to split
    <stdin> into multiple jobs and -- block specifies the size of the blocks. The
    option -k specifies ordering must be maintained.


    Your final output should look like


    ```

    00001 1 <data>

    00002 2 <data>

    00003 3 <data>

    00004 4 <data>

    00005 5 <data>


    00587 552409 <data>

    00588 552410 <data>

    00589 552411 <data>

    00590 552412 <data>

    00591 552413 <data>

    ```


    My original file had 552,413 lines. The first column represents the parallel jobs,
    and the second column represents the original line numbering that was passed to
    parallel in chunks. You should notice the order in the second column (and rest
    of the file) is maintained.'
