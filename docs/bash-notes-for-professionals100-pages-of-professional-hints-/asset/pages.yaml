  md: "# Chapter 66: Pitfalls\n\n# Section 66.1: Whitespace When Assigning Variables\n\
    \nWhitespace matters when assigning variables.\n\n```\nfoo = 'bar' # incorrect\n\
    foo= 'bar' # incorrect\nfoo='bar' # correct\n```\n\nThe first two will result\
    \ in syntax errors (or worse, executing an incorrect command). The last example\
    \ will correctly set the variable $foo to the text \"bar\".\n\n# Section 66.2:\
    \ Failed commands do not stop execution\n\nIn most scripting languages, if a function\
    \ fails, it may throw an exception and stop execution of the program. Bash commands\
    \ do not have exceptions, but they do have exit codes. A non-zero exit code signals\
    \ failure, however, a non-zero exit code will not stop execution of the program.\n\
    \nThis can lead to dangerous (although Admittedly admitted) situations like so:\n\
    \n```\n#!/bin/bash\ncd ~/non/existent/directory\nrm -rf *\n```\n\nIf-cd to this\
    \ directory fails, Bash will ignore the failure and move onto the next command,\
    \ wiping the directory from where you ran the script.\n\nThe best way to deal\
    \ with this problem is to use of the set command:\n\n```\n#!/bin/bash\nset -e\n\
    cd ~/non/existent/directory\nrm -rf *\n```\n\n -e tells Bash to exit the script\
    \ immediately if any command returns a non-zero status.\n\n# Section 66.3: Missing\
    \ The Last Line in a File\n\nThe C standard says that files should end with a\
    \ new line, so EOF comes at the end of a line, that line may be missed by some\
    \ commands. As an example:\n\n```\n$ echo 'one\\nothree\\c' > file.txt\n```\n\n\
    ```\n$ cat file.txt\none\ntworee\n```\n\n```\n$ while read line ; do echo \"line\
    \ $line\"; done < file.txt\none\ntwo\n```\n\nTo make this works correctly for\
    \ in the above example, add a test so that it will continue the loop if the last\
    \ line is not empty."
