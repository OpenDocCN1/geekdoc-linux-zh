    and failglob are both set, - in no case of match - an error is returned.


    # Section 34.3: Check if a string matches a regular expression


    Version ≃ 3.0


    Check if a string consists in exactly 8 digits:


    # Section 34.4: Regex matching


    Output:


    I am a string with some digits 1024

    1024


    Instead of assigning the regex to a variable ($pat) we could also do:


    ```

    [[ $s ~ ^[0-9]+[0-9]+] ]

    ```


    Explanation


    +   * [[ $s ~ $pat ]] performs the regex matching

    * The captured groups i the match results are available in an array named BASH_REMATCH

    * The 0th index in the BASH_REMATCH array is the total match

    * The *th index in the BASH_REMATCH array is the *th captured group, where i =
    1, 2, 3 ...


