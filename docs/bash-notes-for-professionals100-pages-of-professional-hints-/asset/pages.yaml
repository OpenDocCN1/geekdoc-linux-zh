  md: "# Section 59.2: Request Method: POST /w JSON\n\nUsing Request Method POST in\
    \ combination with SSL makes datatransfer more secure.\n\nIn addition...\n\n+\
    \   - Most of the encoding and decoding is not needed any more\n- The URL will\
    \ be visible to any one and needs to be url encoded.\n- The data will be sent\
    \ separately and therefore should be secured via SSL\n- The size of the data is\
    \ almost unlimited\n- Still needs protection against Cross-Side-Scripting (XSS)\n\
    \nTo keep this showcase we want to receive JSON Data and communication should\
    \ be over Cross-Origin Resource Sharing (CORS).\n\nThe following script will demonstrate\
    \ two different Content-Types.\n\n```\n#!/bin/bash\nexec 2>/dev/null      # We\
    \ don't want any error messages be printed to stdout\ntrap \"response_with_html\
    \ && exit 0\" ERR      # response with an html message when an error occurred\n\
    and close the script\n\nfunction response_with_html(){\n  echo \"Content-type:\
    \ text/html\"\n  echo \"\"\n  echo \"<!DOCTYPE html>\n  echo \"<head>\n  echo\
    \ \"<title>as56</title>\n  echo \"<body>\"\n  echo \"<h1>as56</h1>\"\n  echo \"\
    <p>Attempt to communicate with the server went wrong.</p>\"\n  echo \"<hr>\n \
    \ echo \"$SERVER_SIGNATURE\"\n  echo \"</body></html>\"\n}\n\nfunction response_with_json(){\n\
    \  echo \"Content-type: application/json\"\n  echo \"\"\n  echo \"\\\"message\\\
    \": \\\"Hello World!\\\"\"\n}\n\nif [ $REQUEST_METHOD = \"POST\" ]; then\n  #\
    \ The environment variable $CONTENT_TYPE describes the data received\n  case $CONTENT_TYPE\
    \ in\n    application/json)\n      # The environment variable $CONTENT_LENGTH\
    \ describes the size of the data\n      read -n \"$CONTENT_LENGTH\" QUERY_STRING_POST\n\
    \      # read datatream\n\n      # The following lines will prevent XSS and check\
    \ for valid JSON-Data.\n      # But these Symbols need to be encoded before sending\
    \ this script\n      QUERY_STRING_POST=$(echo $QUERY_STRING_POST | sed 's/\\//g'\
    \ | sed\n      's/\\$/\\\\\\$/g;s/\\*/\\\\*/g;s/\\$\\\\\\$/g') # removes some\
