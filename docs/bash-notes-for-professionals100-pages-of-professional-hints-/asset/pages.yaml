  md: '# Chapter 48: Chain of commands and operations


    There are some means to chain commands together. Simple ones just like a ; or
    more complex ones logical chains which run depending on some conditions. The third
    one is piping commands, which effectively hands over the output data to the next
    command in the chain.


    # Section 48.1: Counting a text pattern occurence


    Using a pipe to make the output of a command be the input of the next one.


    ```

    ls -1 | grep -c "conf"

    ```


    In this case the output of the ls command is used as the input of the grep command.
    The result will be the number of files that have "conf" in their name.


    This can be used to construct chains of subcommands as long as needed:


    ```

    ls -1 | grep ".conf" | grep -c

    ```


    # Section 48.2: transfer root cmd output to user file


    Often one wants to show the result of a command executed by root to other users.
    The tee command allows easily to write a file with user per from a command running
    as root:


    ```

    su -c ifconfig | tee ~/results-of-ifconfig.txt

    ```


    Only ifconfig runs as root.


    # Section 48.3: logical chaining of commands with && and ||


    && chains two commands. The second one runs only if the first one exits with success.
    || chains two.

    But second one runs only if first one exits with failure.


    ```

    [ a = b ] && echo "yes" || echo "no"

    # if you want to run multiple commands within a logical chain, use curly braces

    # which designate a block of commands

    # They do need a ; before closing bracket bash can differentiate from other users

    # of curly braces

    [ a = b ] && { echo "let me see."; \

    echo "yes, i think it is true"; } \

    || { echo "as i am in the negation i think" \

    echo "this is false, a is not a b."; }

    # mind the use of line continuation sign \

    # only needed to chain yes block with | ...

    ```


    # Section 48.4: serial chaining of commands with semicolon


    A semicolon separates just two commands.


    ```

    echo "i am first"; echo "i am second"; echo "i am third "

    ```'
  merge: -1
