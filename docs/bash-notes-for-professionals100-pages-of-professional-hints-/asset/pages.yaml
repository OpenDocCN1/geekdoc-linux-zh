  md: '# # Chapter 63: Parallel


    | Option | Description |

    | --- | --- |

    | -j n | Run jobs in parallel |

    | -k | Keep same order |

    | -X | Multiple arguments with context replace |

    | --colsep regex | Split input on regex for positional replacements |

    | { } (.) (1) (/) (#) Replacement strings |

    | {3} (3) {3} (3/) Positional replacement strings |

    | -S sshlogin | Example: foo@server.com |

    | --trunc .bar | Shorthand for -transfer return (r).-bar |

    | --all | Run the command with argument on all sshlogins |

    | --nonall | Run the command with no arguments on all sshlogins |

    | --pipe | Split stdin (standard input) to multiple jobs |

    | --recend str | Record end separator for --pipe |

    | --restart str | Record start separator for --pipe |


    Jobs in Linux are parallelized by GNU parallel. A job can be a single command
    or a small script that can be run for each of the lines in the input. The typical
    input is a list of files, a list of hosts, a list of users, a list of URLs, or
    list of tables. A job can also be a command that reads from a pipe.


    # ## Section 63.1: Parallelize repetitive tasks on list of files


    Many repetitive jobs can be performed more efficiently if you utilize more of
    your computer''s resources (i.e. CPU''s and RAM). Below is an example of running
    multiple jobs in parallel.


    Suppose you have a `list of files`, say output from 1s. Also, let these files
    be bz2 compressed and the following order of tasks needs to be executed on them.


    +   1. Decompress the bz2 files using bcat to stdout

    2. Grep (e.g. filter) lines with specific keyword(s) using grep <some key word>

    3. Pipe the output to be concatenated into one single gzipped file using gzip


    Running this using a while-loop might look like this


    Using GNU Parallel, we can run 3 jobs at once by simply doing


    parallel -j 3 "bzcat {} | grep puppies" ::: $(cat filelist.txt) | gzip > output.gz


    This command is simple, concise and more efficient when number of files and file
    size is large. The jobs initiated by parallel, -j 3 launches 3 parallel jobs and
    input to the parallel jobs is taken by :::. The output is eventually piped to
    gzip > output.gz'
  merge: -1
