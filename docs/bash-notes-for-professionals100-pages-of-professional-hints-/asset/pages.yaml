    #!/bin/bash\n\nvar=abc\ncase $var in\na)\n  echo \"Antarctica\"\n  ;;&\nxyz)\n\
    \  echo \"Brazil\"\n  ;;&\n*b)\n  echo \"Cat\"\n  ;;&\nesac\n```\n\nOutputs:\n\
    \nAntarctica\nCat\n\nIn the below example, the abc matches first and third case\
