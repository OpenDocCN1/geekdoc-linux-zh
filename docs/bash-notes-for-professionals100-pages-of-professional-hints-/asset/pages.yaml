  md: '# Section 15.4: Substrings and subarrays


    ```

    var=`0123456789abcdef`

    ```


    # Define a zero-based offset


    ```

    $ printf("%s\n" "${var:3}")

    3456789abcdef

    ```


    # Offset and length of substring


    ```

    $ printf("%s\n" "${var:3:4}")

    3456

    ```


    Version >= 4.2


    # Negative length counts from the end of the string


    ```

    $ printf("%s\n" "${var:-5}")

    3456789a

    ```


    # Negative offset counts from the end


    # Needs a space to avoid confusion with ${var:-6}


    ```

    $ printf("%s\n" "${var:-6}")

    abdef

    ```


    # Alternative: parentheses


    ```

    $ printf("%s\n" "${var:(-6)}")

    abdef

    ```


    # Negative offset and negative length


    ```

    $ printf("%s\n" "${var:-65}")

    a

    ```


    The same examples apply if the parameter is a **positional parameter** or the
    **element of a subscripted array.**


    ```

    # Set positional parameter $1

    -- 0123456789abcdef

    ```


    # Define offset


    ```

    $ printf("%s\n" "${1:5}")

    56789abcdef

    ```


    # Assign to array element


    ```

    myarr[0]=0123456789abcdef

    ```


    # Define offset and length


    ```

    $ printf("%s\n" "${myarr[0]:7}")

    789

    ```


    Analogous expansions apply to **positional parameters**, where offsets are one-based.


    ```

    # Set positional parameters $1, $2, ...

    -- 1 2 3 4 5 6 7 8 9 0 a b c d e f

    ```


    # Define an offset (beware $0 is not a positional parameter)

    # is being considered here as well


    ```

    $ printf("%s\n" "${@:10}")

    0

    a

