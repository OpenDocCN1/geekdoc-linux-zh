  md: '# Chapter 53: Jobs at specific times


    # Section 53.1: Execute job once at specific time


    Note: at is not installed by default on most of distributions.


    To execute a job at some other time than now, in this example 5pm, you can use


    ```

    echo somecommand & | at 5pm

    ```


    If you want to catch the output, you can do that in the usual way:


    ```

    echo somecommand > out.txt 2>err.txt & | at 5pm

    ```


    at understands many time formats, or you can also say


    ```

    echo somecommand & | at now + 2 minutes

    echo somecommand & | at 17:00

    echo somecommand & | at 17:00 Jul 7

    echo somecommand & | at 4pm 12.03.17

    ```


    If no order is given, it assumes the next time you occurs. If you give a hour
    that already passed today, it will assume tomorrow, and if you give a month that
    already passed this year, it will assume next year.


    This also works with nohup if you would like.


    ```

    echo nohup somecommand > out.txt 2>err.txt & | at 5pm

    ```


    There are some more commands to control timed jobs:


    +   - at lists all jobs (atqueue)

    - atm removes a job (at remove)

    - batch does basically the same as at, but runs only when system load is lower
    than 08


    All commands apply to jobs of the user logged in. If logged in as root, system
    jobs are handled of course.


    # Section 53.2: Doing jobs at specified times repeatedly with system.timer


    systemd provides a modern implementation of cron. To execute a script periodical
    a service and a timer file is. The service and timer files should be placed in
    /etc/systemd/(system/user). The service file:


    ```

    [Unit]

    Description=my script or programm does the very best and this is the description


    [Service]

    # type is important

    Type=simple

    # program/script to call. Always these absolute paths

    # and redirect STDOUT and STDERR as there is no terminal while being executed

    ExecStart=/absolute/path/to/somecommand >>path/to/output 2>>path/to/STDERR

    #NO installation!!! Is handled by the timer facilities itself.

    [Install]

    ```'
  merge: -1
