  md: '# # Chapter 55: The cut command


    | Parameter | Details |

    | --- | --- |

    | -f, --fields | Field-based selection |

    | -d, --delimiter | Delimiter-based selection |

    | -c, --characters | Character-based selection, delimiter ignored or error |

    | -s, --only-delimited | Suppress lines with no delimiter (printed as is-otherwise)
    |

    | --complement | Inverted selection (each except specified fields/characters)
    |

    | --output | Specify when it is different from the input delimiter |


    The cut command is a fast way to extract parts of line files. It belongs to the
    oldest unix commands. Most popular implementations are the GNU version on Linux
    and the FreeBSD version on MacOS, but each flavor of Unix has its own. See for
    differences. The input lines are read from stdin or from files listed around the
    command line.


    # ## Section 55.1: Only one delimiter


    You cannot have more than one delimiter: if you specify something -d ":", some
    implementations will use only the first as the delimiter (in this case, a comma).
    Other implementations (e.g. GNU cut) will give you an error message.


    ```

    $ cut -d ":" <<< J.Smith,1 Main Road,cell:1234567890;land:4081234567"

    cut: the delimiter must be a single character

    try cut --help for more information.

    ```


    # ## Section 55.2: Repeated delimiters are interpreted as empty fields


    ```

    $ cut -d '' '' -f1,3 <<< "a,b,c,d,e"

    a b

    ```


    is rather obvious, but with space-delimited strings it might be less obvious to
    some


    ```

    $ cut -d '' '' -f1,3 <<< "a b c d e"

    a b

    ```


    cut cannot be used to parse arguments in the shell or other programs do.


    # ## Section 55.3: No quoting


    There is no way to protect the delimiter. Spreadsheets and similar CSV-handling
    software usually recognize a text-quoting character which makes it possible to
    define strings containing a delimiter. With cut you cannot.


    ```

    $ cut -d, -f3 <<< "John, Smith,"1, Main Street"

    "1

    ```


    # ## Section 55.4: Extracting, not manipulating


    You can only extract portions of lines, not reorder or repeat fields.


    ```

    $ cut -d, -f2,1 <<< ''John,Smith,USA'' ## Just like -f1,2

    ```'
