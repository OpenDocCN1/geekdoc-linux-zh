  md: '# Chapter 21: Quoting


    # Section 21.1: Double quotes for variable and command substitution


    Variable substitutions should only be used inside double quotes.


    ```

    calculation=''2 '' + ''3''

    echo $calculation      # prints 2 + 3

    echo $calculation      # prints 2, the list of files in the current directory,
    and

    echo "$($calculation)"  # prints 6

    ```


    Outside of double quotes, $var takes the value of var, splits it whitespace-delimited
    parts, and interprets each part as a glob (wildcard) pattern. Unless you want
    this behavior, always put $var inside double quotes: "\$var"


    The same applies to command quotes: "$(command)" is the output of command, \$(command)
    is the result of split+ on output.


    ```

    echo $var              # good

    echo "$(command)" # good

    another-var          # also works, assignment is implicitly double-quoted

    make -D THING="\$var" # BAD! This is not a bash assignment.

    make -D THING="\$var"  # good

    make -D THING="\$var"  # also good

    ```


    Command substitutions get their own quoting contexts. Writing nested substitutions
    is easy because the parser will keep track of nesting depth instead of greedily
    searching for the first " character. The StackOverflow syntax highlights this
    with with. For example:


    ```

    echo "formatted text: $(printf "a + b = %04d" "\$$(c)")" # formatted text: a +
    b = 0000

    ```


    Variable arguments to a command substitution should be double-quoted the expansions
    as follows:


    ```

    echo "$(command) \$arg1 "\$arg2"

    ```


    # Section 21.2: Difference between double quote and single quote


    | Double quote | Single quote |

    |--- | --- |

    | Allows variable expansion | Prevents variable expansion |

    | Allows history expansion if enabled | Prevents history expansion |

    | Allows command substitution | Prevents command substitution |

    | * and can have special meaning | * and are always literals |

    | Can contain single quote or double quote | Single quote is not allowed inside
    single quote |

    | $, \'', \ can be escaped with \ to prevent their special meaning | All of them
    are literals


    Properties that are common to both:


    +   * Prevents globbing

    * Prevents word splitting


    Examples:


    GoalKicker.com – Bash Notes for Professionals'
