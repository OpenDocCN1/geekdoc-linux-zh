  md: "# Chapter 32: getopts : smart positional-parameter parsing\n\n| Parameter |\
    \ Detail |\n\noptring The option characters to be recognized\nname Then name where\
    \ parsed option is stored\n\n# Section 32.1: pingmap\n\n```\n#!/bin/bash\n# Script\
    \ name : The systems admin in company X is tired of the monotonous\n# Scenario\
    \ : he decided to simplify the job using a script.\n# of pinging and nmap\n# The\
    \ tasks he has to achieve is\n# 1. Ping with a max count of 5 -the given IP address/domain.\
    \ AND/OR\n# 2. Check if a particular port is open with a given IP address/domain.\n\
    # And map it for his rescue.\n# A brief overview of the options\n# n : meant for\
    \ nmap\n# t : meant for ping\n# i : The option to enter the IP address\n# p :\
    \ The option to enter the port\n# v : The option to get the script version\n\n\
    while getopts 'nti:p:v' opt\n#putting : in the beginn suppresses the errors for\
    \ invalid options\ndo\ncase \"$opt\" in\n  'i')ip=\"${OPTARG}\"\n    ;\n  'p')port=\"\
    ${OPTARG}\"\n    ;\n  'n')nmap_yes=1;\n    ;\n  't')ping_yes=1;\n    ;\n  'v')echo\
    \ \"pingmap version 1.0.0\"\n    ;\n  *) echo \"Invalid option $opt\"\n    echo\
    \ \"Usage: $0\"\n    echo \"pingmap [-n|t|i ip|p port] [v]\"\n    ;\nnesac\ndone\n\
    if [ -z \"$nmap_yes\" ] && [ \"$nmap_yes\" -eq \"1\" ];\nthen\n  if [ -z \"$ip\"\
    \ ] && [ -z \"$port\" ];\n  then\n    nmap -p \"$port\" \"$ip\"\n  fi\nfi\nif\
    \ [ -z \"$ping_yes\" ] && [ \"$ping_yes\" -eq \"1\" ];\nthen\n  if [ -z \"$ip\"\
    \ ];\n  then\n    ping -c 5 \"$ip\"\n  fi\nfi\n```\n\nGoalKicker.com – Bash Notes\
    \ for Professionals 111"
