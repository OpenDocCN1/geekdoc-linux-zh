  md: '# Chapter 9: Redirection


    | Parameter | Details |

    | --- | --- |

    | internal file descriptor | An integer. |

    | direction | One of , < or > |

    | external file descriptor or path | |

    | or path & followed by an integer for file descriptor or a path. | |


    # Section 9.1: Redirecting standard output


    > redirect the standard output (aka STDOUT) of the current command to one file
    or another descriptor.


    These examples write the output of the ls command into the file.txt


    ```

    ls >file.txt

    > file.txt ls

    ```


    The target file is created if it doesn''t exist, otherwise this file is truncated.


    The default redirection is the standard output or 1 when no one is specified.
    This command is equivalent to the previous examples with the standard output explicitly
    indicated:


    ```

    ls 1>file.txt

    ```


    Note: the redirection is initialized by the executed shell and not by the executed
    command, therefore it is before the command execution.


    # Section 9.2: Append vs Truncate


    Truncate >


    +   1. Create specified file if it does not exist.

    2. Truncate (remove file''s content)

    3. Write to file


    ```

    $ echo "first line" > /tmp/lines

    $ echo "second line" > /tmp/lines


    $ cat /tmp/lines

    second line

    ```


    Append >>


    +   1. Create specified existing file if it does not exist.

    2. Append file (writing at end of file).


    ```

    # Overwrite existing line

    $ echo "first line" > /tmp/lines


    # Append a second line

    $ echo "second line" >> /tmp/lines


    $ cat /tmp/lines

    first line

    second line

    ```'
