    \nIt is the ls, not the cd, that is the previous command.\n\n# Use conditional\
    \ execution of command lists\n\nConditional expression is a faster than if...\
    \ then its main advantage is allowing functions and scripts to exit early, or\
    \ \"short circuit\".\n\nUnlike many languages like C where memory is explicitly\
    \ allocated for structs and variables and such (and thus must be deallocated),\
    \ bash handles this under covers. In most cases, we do not have to clean up anything\
    \ before leaving the function. A return statement will deallocate everything to\
    \ the function and pickup execution at the return address on the stack.\n\nReturning\
    \ from functions or exiting scripts as soon as possible can significantly improve\
    \ performance and reduce system load by avoiding the unnecessary execution of\
