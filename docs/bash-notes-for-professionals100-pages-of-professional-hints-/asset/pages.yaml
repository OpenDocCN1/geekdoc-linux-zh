    # Section 21.3: Newlines and control characters


    A newline can be included in a single-quoted string or double-quoted string. Note
    that backslash-newline does not result in a newline, the line break is ignored.


    ```

    newline1=''

    ''

    newline2=""

    newline3=''$

    ''

    empty=''\

    echo "Line${newline1}break"

    echo "Line${newline2}break"

    echo "Line${newline3}break"

    echo "No line break${empty} here"

    ```


    Inside double-quoted strings, backslash-letter or backslash-octal can be used
    to insert control characters, like in many programming languages.


    ```

    echo $Tab:\[\t]

    echo $Tab again:\[\009]

    echo $Form feed:\[\f]

    echo $Line\nbreak

    ```


    # Section 21.4: Quoting literal text


    All the examples in this paragraph print the line


    ```

    #!"$&\\''*;=>? @\[\\^]\{}~

    ```


    A backslash quotes the next character, i.e. the next character is interpreted
    literally. One exception is a newline: backslash-newline expands the empty string.


    ```

    echo "\\!\"\\$&\\''*;=>? @\[\\^]\{}~ \\\\\\\\\\\\\\\\\\\\\\\\\\\~

    ```


    All text between strings (forward quotes '', also known as apostrophe) is printed
    literally. Even backslash stands for itself, and it''s impossible to include a
    single quote; instead, you can stop the string, include a literal single quote
    with a backslash, and start the string again. The 4-character sequence ''\\''''
    effectively allows to include a single quote in a string.


    ```

    echo ''#"$&\\''*;=>? @\[\\^]\{}~

    ```'
