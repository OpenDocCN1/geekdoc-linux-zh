  md: '# Section 20.5: Run several commands with sudo


    ```

    sudo -s <<EOF

    a=''var''

    echo ''Running serveral commands with sudo''

    mktemp -d

    echo \$a"

    EOF

    ```


    +   - $ needs to be escaped to prevent it to be expanded by the current shell


    Or


    ```

    sudo -s <<''EOF''

    a=''var''

    echo ''Running serveral commands with sudo''

    mktemp -d

    echo "$"

    EOF

    ```


    # Section 20.6: Limit Strings


    A heredoc uses the limitstring to determine when to stop consuming input. The
    terminating limitstring is must


    +   - Be at the start of a line.

    - Be the only text on the line Note: If you use <<- limitstring can be prefixed
    with tabs \t


    Correct:


    ```

    cat <<limitstring

    line 1

    line 2

    limitstring

    ```


    This will output:


    line 1

    line 2


    Incorrect use:


    ```

    cat <<limitstring

    line 1

    line 2

    limitstring

    ```


    Since limitstring on the last line is not exactly at the start of the line, the
    shell will continue to wait for further input, unless it is a line that starts
    with limitstring and doesn''t contain anything else. Then it will stop waiting
    for input, and proceed to pass the here-document to the cat command.


    Note that if you prefix the limitstring with a hyphen, any tabs at the start of
    the line are removed before parsing, so the data and the limit string can be indented
    with tabs (for example of reading in shell scripts).


    ```

    cat <<limitstring

    line 1 has a tab before the words line and has

    line 2 has two leading tabs

    ```'
