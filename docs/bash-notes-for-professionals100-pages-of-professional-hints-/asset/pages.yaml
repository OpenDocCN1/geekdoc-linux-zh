  md: "# # Chapter 19: Sourcing\n\n# ## Section 19.1: Sourcing a file\n\nSourcing\
    \ a file is different from execution, in all commands are evaluated within the\
    \ context of the current bash session - this means that any variables, function,\
    \ or aliases defined will persist throughout your session.\n\nCreate the file\
    \ you wish to source sourceme.sh\n\n```\n#!/bin/bash\n\nexport A=\"hello_world\"\
    \nalias sayHi=\"echo Hi\"\nsayHello() {\n  echo Hello\n}\n```\n\nFrom your session,\
    \ source the file\n\n```\n$ source sourceme.sh\n```\n\nFrom henceforth, you have\
    \ all the resources of the sourced file available\n\n```\n$ echo $A\nhello_world\n\
    \n$ sayHi\nHi\n\n$ sayHello\nHello\n```\n\nNote that the command . is synonymous\
    \ to source, such that you can simply use\n\n```\n$ . sourceme.sh\n```\n\n# ##\
    \ Section 19.2: Sourcing a virtual environment\n\nWhen developing several applications\
    \ on one machine, it becomes useful to separate out dependencies into virtual\
    \ environments.\n\nWith the use of virtualenv, these environments are sourced\
    \ into your shell so that when you run a command, it comes from that virtual environment.\n\
    \nThis is most commonly installed using pip.\n\n```\npip install https://github.com/pypa/virtualenv/tarball/15.0.2\n\
    ```\n\nCreate a new environment\n\n```\nvirtualenv --python=python3.5 my_env\n\
    ```\n\nActivate the environment"
