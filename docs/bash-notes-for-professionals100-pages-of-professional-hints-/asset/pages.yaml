    # Section 15.8: Default value substitution


    | (parameter:-word) |

    | If parameter is unset or null, the expansion of word is substituted. Otherwise,
    the value of parameter is substituted. |


    ```

    $ unset var

    echo "${var:-XX}"

    XX

    # Parameter is unset -> expansion XX occurs

    $var=

    # Parameter is null -> expansion XX occurs

    echo "${var:-XX}"

    $var=23

    # Parameter is not null -> original expansion occurs

    echo "${var:-XX}"

    23

    ```


    | (parameter:=word) |

    | If parameter is unset or null, the expansion of word is assigned to parameter.
    The value of parameter is then substituted. Positional parameters and special
    parameters may not be assigned to this way. |


    ```

    $ unset var

