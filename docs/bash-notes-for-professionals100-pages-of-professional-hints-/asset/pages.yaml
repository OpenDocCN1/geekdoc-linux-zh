  md: "# we need to reverse the contents of $ @ so that we can shift\n# the last element\
    \ into nothingness\narr=$(awk \"${arr[@]}\" { for i=NF; i>1; --i} printf(\"%s\
    \ \\.i); print $1; }\n\n# set $ @ to ${arr[@]} so that we can run shift against\
    \ it.\neval set --${arr[@]}\"\n\nshift remove the last element\n\n# put the array\
    \ back to its original order\narr=$(awk <<<\"$@\" { for i=NF; i>1; --i} printf(\"\
    %s \\.i); print $1; }\n\n# echo the contents for the benefit of using and bare\
    \ array arrays\necho \"${arr[@]}\"\n\n```\nif ((isvar)); then\n    # set the contents\
    \ of the original var to the new modified array\n    eval --\"var=${arr[@]}\"\n\
    fi\n```\n\n# Section 61.2: Using Eval with Getopt\n\nWhile eval may not be needed\
    \ for a pop like function, it is however required whenever you use getopt:\n\n\
    Consider the following function that accepts -h as an option:\n\n```\nf() {\n\
    \    local __me__$(getopt -o 'h' -n n __me__ -- \"$@\")\n    eval set --\"$argv\"\
    \n    while ; do\n        case \"$1\" in\n            -h)\n                echo\
    \ \"LOLOLOL\"\n                return 0\n                ;\n            -)\n \
    \               shift\n                break\n                ;;\n        esac\n\
    \    done\n    echo \"$@\"\n}\n```\n\nWithout eval set --\\$argv generates\n\n\
    -h -- instead of the desired (-h --) and subsequently enters an infinite loop\n\
    \n-h -- doesn't match -- or -h."
