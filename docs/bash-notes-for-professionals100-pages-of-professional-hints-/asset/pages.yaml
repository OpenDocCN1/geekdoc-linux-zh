  md: '# Chapter 38: Case statement


    # Section 38.1: Simple case statement


    In its simplest form supported by all versions of bash, case statement executes
    the case that matches the pattern.; ; operator breaks after the first match, if
    any.


    ```

    #!/bin/bash


    var=1

    case $var in

    1)

    echo "Antarctica"

    ;

    2)

    echo "Brazil"

    ;

    3)

    echo "Cat"

    ;

    esac

    ```


    Outputs:


    Antarctica


    # Section 38.2: Case statement with fall through


    Version ≥ 4.0


    Since bash 4.0, a new operator ;& was introduced which provides fall through mechanism.


    ```

    #!/bin/bash


    var=1

    case $var in

    1)

    echo "Antarctica"

    &&

    2)

    echo "Brazil"

    &&

    3)

    echo "Cat"

    &&

    esac

    ```


    Outputs:


    Antarctica

    Brazil

    Cat


    # Section 38.3: Fall through only if subsequent pattern(s) match


    Version ≥ 4.0


    GoalKicker.com – Bash Notes for Professionals'
