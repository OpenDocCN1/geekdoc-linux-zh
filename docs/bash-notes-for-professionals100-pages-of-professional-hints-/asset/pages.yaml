  md: "# # Chapter 65: Design Patterns\n\nAccomplish some common design patterns in\
    \ Bash\n\n# ## 65.1: The Publish/Subscribe (Pub/Sub) Pattern\n\nWhen a Bash project\
    \ turns into a library, it can difficult to add new functionality. Function names,\
    \ variables and parameters usually need to be changed in the scripts that utilize\
    \ them. In scenarios like this, it is helpful to decouple the code and use an\
    \ event driven design pattern. In said pattern, an external script can subscribe\
    \ to an event. When that event is triggered (published) the script can execute\
    \ the code that it registered with the event.\n\npubsub.sh:\n\n```\n#!/usr/bin/env\
    \ bash\n\n# Save the path to this script's directory in a global env\n#nDIR=$(cd\
    \ \"${BASH_SOURCE[0]}\" && pwd)\n\n# Array that will contain all registered events\n\
    #\nEVENTS=()\n\nfunction action1() {\n  echo \"Action #1 was performed ${2}\"\n\
    }\n\nfunction action2() {\n  echo \"Action #2 was performed\"\n}\n\n# @desc ::\
    \ Registers an event\n# @param :: string $1 - The name of the event. Basically\
    \ an alias for a function name\n# @param :: string $2 - The name of the function\
    \ to be called\n# @param :: string $3 - Full path to script that includes the\
    \ function being called\nfunction subscribe() {\n  EVENTS+=(\"\\$1:\\$2:\\$3\"\
    )\n}\n\n# @desc :: Publish an event\n# @param :: string $1 - The name of the event\
    \ being published\nfunction publish() {\n  for event in ${EVENTS[@]}; do\n   \
    \ local IFS=':'\n    read -ra event <<< \"\\$event\"\n    if [[ \"${event[0]}\"\
    \ == \"\\$1\" ]]; then\n      ${event[1]} \"\\$2\"\n    fi\n  done\n}\n\n# Register\
    \ our events and the functions that handle them\n```"
  merge: -1
