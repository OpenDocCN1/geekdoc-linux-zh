    \ a function, you can use local to have that new variable that is independent\
    \ of the global scope and whose value will only be accessible inside that function.\n\
    \n# Section 58.1: Global variables\n\n```\nvar=\"hello\"\nfunction foo(){\n  echo\
    \ $var\n}\nfoo\n```\n\nWill obviously output \"hello\", but this works the other\
    \ way around to:\n\n```\nfunction foo() {\n  var=\"hello\"\n}\nfoo\necho $var\n\
