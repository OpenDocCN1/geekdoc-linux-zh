  md: '# # Chapter 33: Debugging


    # ## Section 33.1: Checking the syntax of a script with "-n"


    The -n flag enables you to check the syntax of a script without having to execute
    it:


    ```

    bash -n testscript.sh

    testscript.sh: line 128: unexpected EOF while looking for matching ''"''

    testscript.sh: line 138: syntax error: unexpected end of file

    ```


    # ## Section 33.2: Debugging using bashdb


    Bashdb is similar to gdb, in that you can do things like breakpoints at a line
    or at a function, print content of variables, you can restart script execution
    and more.


    You can normally install it with your package manager, for example on Fedora:


    ```

    sudo dnf install bashdb

    ```


    Or get it from the homepage. Then you can run it with your script as a paramater:


    ```

    bashdb <YOUR SCRIPT>

    ```


    Here are a few commands to get started:


    +   - show local lines, press l again to scroll down

    - step to next line

    - print VAR echo out content of variable

    - restart reruns bashcript, it reloads it prior to execution.

    - eval evaluate some custom command, ex: eval echo hi


    - set breakpoint on some line

    - continue until some breakpoint

    - i b info on break points

    - delete breakpoint at #


    shell a sub-shell in the middle of execution, this is handy for manipulating variables


    For more information, I recommend consulting the manual:

    http://www.rodericksmith.plus.com/outlines/manuals/bashdbOutline.html


    See also homepage:

    http://bashdb.sourceforge.net/


    # ## Section 33.3: Debugging a bash script with "-x"


    Use "-x" to enable debug output of executed lines. It can be run on an entire
    session or script, or programmatically within a script.


    Run a script with debug output enabled:


    ```

    bash -x myscript.sh

    ```'
