    \ sleep 10 &\\n[1] 20024\n\n$ kill %1\n[1]+ Terminated sleep 10\n```\n\nThe sleep\
    \ process runs in the background with process id (pid) 20024 and job number 1.\
    \ In order to reference the process, you can use either the pid or the job number.\
    \ If you use the job number, you must prefix it with %. The default kill signal\
    \ is kill SIGHTERM, which allows the target process to exit gracefully.\n\nCommon\
    \ kill signals are shown below. To see a full list, run kill -1.\n\n| Signal Name\
    \ Value | Effect |\n|---|---|---|\n| SIGHUP | | Hangup |\n| SIGINT | 2 | Interrupt\
    \ from keyboard |\n| SIGKILL | 9 | Kill signal |\n| SIGTERM | 15 | Termination\
    \ signal |\n\n# Start and kill specific processes\n\nProbably the easiest way\
    \ of killing a running process is by selecting it through the process name as\
    \ in the following example using pkill command\n\n```\nkill -f test.py\n```\n\n\
    (or) kill a more-proof way using pgrep to search for the actual process-id\n\n\
    ```\nkill $(pgrep -f 'python test.py')\n```\n\nThe result can be obtained using\
    \ grep over ps -ef | grep name_of_process then killing the process associated\
    \ with the resulting pid (process id). Selecting a process name is convenient\
    \ in a testing environment but can be very dangerous when the script is used in\
    \ production: it is impossible to be sure that the name will match the process\
    \ you actually want to kill. In these cases, the following approach is actually\
    \ safe.\n\nStart the script that will eventually kill with the following approach.\
    \ Let's assume that the command you want to execute and kill is python test.py.\n\
    \n```\n#!/bin/bash\n\nif [[ -e /tmp/test.py.pid ]]; then # Check if the file already\
    \ exists\n    python test.py &\\necho $! > /tmp/test.py.pid #+and if so do not\
    \ run another process.\nelse\necho -n \"ERROR: The process is already running\
    \ with pid \" \ncat /tmp/test.py.pid\necho\n```\n\nThis will create a file in\
    \ the /tmp directory containing the pid of the python test.py process. If the\
    \ file exists, we assume the command is already running and the script return\
    \ an error."
- md: "\nThen, when you want to kill it use the following script:\n\n```bash\n#!/bin/bash\n\
    \nif [[ -e /tmp/test.py.pid ]]; then\n    kill /tmp/test.py.pid\n    rm /tmp/test.py.pid\n\
    else\n    echo \"test.py is not running\"\nfi\n```\n\nthat will kill exactly the\
    \ process associated with your command, to continue without relying on any volatile\
    \ information (like the string used to run the command). Even in this case if\
    \ the file does not exist, the script assume that you want to kill a non-running\
    \ process.\n\nThis example can be easily improved for running the same command\
    \ multiple times (appending to the pid file instead of overwriting it, for) and\
    \ to manage cases where the process dies before being killed.\n\n## Section 8.2:\
    \ Check which process running on specific port\n\nTo check which process running\
    \ on port 8080\n\n```\nlsof -i :8080\n```\n\n## Section 8.3: Disowning background\
    \ job\n\n```\n$ grip extremelylargefile.txt &\n$ bg\n$ disown %1\n```\n\nThis\
