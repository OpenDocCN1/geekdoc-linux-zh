    # Chapter 27: Scoping


    # Section 27.1: Dynamic scoping in action


    Dynamic scoping means that variable lookup occur in the scope where a function
    is *called*, not where it is defined.


    ```

    $ x=3

    $ func1 () { echo "in func1: $x"; }

    $ func2 () { local x=9; func1; }

    $ func2

    in func1: 9

    $ func1

    in func1: 3

    ```


    In a lexically scoped language, func1 would always look in the global scope for
    the value of x, because func1 is defined in the local scope.


    In a dynamically scoped language, func1 looks in the scope where it is called.
    When it is called from within func2, it first looks in the body of func2 for a
    value of x. If it weren''t defined there, it would look in the global scope, where
    func2 was called from.'
  - "[PAGE 109]\n\n# # Chapter 28: Process substitution\n\n# ## Section 28.1: Compare\
    \ two files from the web\n\nThe following compares two files with diff using process\
    \ substitution instead of creating temporary files.\n\n```\ndiff <(curl http://www.example.com/page1)\
    \ <(curl http://www.example.com/page2)\n```\n\n# ## Section 28.2: Feed a loop\
    \ with the output of a command\n\nThis feeds a loop with the output of a grep\
    \ command:\n\n```\nwhile IFS=\"\"; read -r user - \ndo\n  # \"User\" holds the\
    \ username in /etc/passwd\ndone < <(grep \"hello\" /etc/passwd)\n```\n\n# ## Section\
    \ 28.3: Concatenating files\n\nIt is well known that you use the same file for\
    \ input and output in the command. For instance,\n\n```\n$ cat header.txt body.txt\
    \ >body.txt\n```\n\ndoesn't work as you want. The time cat reads body.txt, it\
    \ has already been truncated by the redirection and it is empty. The final result\
    \ will be that.txt will tell the contents of header.txt only.\n\nOne might think\
    \ to avoid this with process substitution, that is, the command\n\n```\n$ cat\
    \ header.txt <(cat body.txt) > body.txt\n```\n\nwill force the contents of body.txt\
    \ to be saved in some buffer somewhere before the file is truncated by the redirection.\
    \ It doesn't work. The cat in parentheses begins reading the file only after the\
    \ descriptors have been set up, there is no point in trying to use process substitution\
    \ in this case.\n\nThe only way to prepend a file to another is to create an intermediate\
    \ one:\n\n```\n$ cat header.txt body.txt >body.new\n$ mv body.txt.new body.txt\n\
    ```\n\nwhich is what sed or perl or similar programs do under the carpet when\
    \ called with an edit-in-place option (usually -i).\n\n# ## Section 28.4: Stream\
    \ a file through multiple programs at once\n\nThis counts the number of lines\
    \ in a big file wc -1 while simultaneously compressing it with gzip. Both run\
    \ concurrently.\n\n```\ntee >(wc -l &2) | gzip > bigfile.gz\n```\n\nNormally tee\
    \ writes its input to one or more files (and stdout). We can write to commands\
    \ instead of files with tee"
  - "[PAGE 110]\n\n(command).\n\nHere the command wc -1>&2 counts the lines from tee\
    \ (which in turn is reading from bigfile). The line count is sent to stderr (&2)\
    \ to avoid mixing the input to gzip.) The stdout of tee is simultaneously fed\
    \ into gzip.\n\n# Section 28.5: With paste command\n\n```\n# Process substitution\
    \ with paste command is common\n# To compare the contents of two directories\n\
    paste <( ls /path/to/directory1 ) ( ls /path/to/directory2 )\n```\n\n# Section\
    \ 28.6: To avoid usage of a sub-shell\n\nOne major aspect of process substitution\
    \ is that it lets us avoid usage of a sub-shell when piping commands the shell.\n\
    \nThis can be demonstrated with a simple example below. I have the following files\
    \ in my current folder:\n\n```\n$ find -maxdepth 1 -type f -print\nfoo bar foobar\
    \ foozoo barzoo\n```\n\nIf I pipe to a while/read that increments a counter as\
    \ follows:\n\n```\ncount=\nfind . -maxdepth 1 -type f -print | while IFS= read\
    \ -r _; do\n  ((count++))\ndone\n```\n\ncount does not contain 6, because it was\
    \ modified in the sub-shell shell context. Any of the commands shown below are\
    \ in a sub-shell context and the scope of the variables used within are lost after\
    \ the sub-shell terminates.\n\n```\ncommand &\n  command | command\n  ( command\
    \ )\n```\n\nProcess substitution will solve the problem by avoiding use of the\
    \ pipe | operator as in\n\n```\ncount=\nwhile IFS= read -r _; do\n  ((count++))\n\
    done <(find . -maxdepth 1 -type f -print)\n```\n\nThis will retain the count variable\
    \ value as no sub-shells are invoked."
