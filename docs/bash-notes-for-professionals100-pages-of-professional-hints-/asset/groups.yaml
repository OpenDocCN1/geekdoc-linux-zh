    Invalid option ?nUsage:\npingmap -n[t|i[p]|v]\n```\n\n# 第 33 章：调试\n\n### 第 33.1\
    \ 节：使用 \"-n\" 检查脚本语法\n\n-n 标志允许你在无需执行脚本的情况下检查脚本的语法：\n\n```bash\nbash -n testscript.sh\n\
    testscript.sh: line 128: unexpected EOF while looking for matching '\"'\ntestscript.sh:\
    \ line 138: syntax error: unexpected end of file\n```\n\n### 第 33.2 节：使用 bashdb\
    \ 调试\n\nbashdb 类似于 gdb，你可以在行或函数处设置断点、打印变量内容、重启脚本执行等操作。\n\n你通常可以通过包管理器安装它，例如在 Fedora\
    \ 上：\n```bash\nsudo dnf install bashdb\n```\n\n或者从主页获取。然后你可以将脚本作为参数运行它：\n\n```bash\n\
    bashdb <SCRIPT>\n```\n\n这里是一些启动命令：\n- l 显示本地行，再次按 l 向下滚动\n- step 移动到下一行\n- print\
    \ 打印变量内容\n- restart 重启脚本\n- eval 执行某些自定义命令，例如：eval echo hi\n- set 在某行设置断点\n- continue\
    \ 直到断点\n- b 显示断点信息\n- delete 删除断点\n- shell 在执行中间进入子 shell，这对于操作变量非常有用\n\n如需更多信息，请参阅手册：http://www.smithplus.com/bashdb.html\
    \ 或查看主页：http://bashdb.sourceforge.net/\n\n### 第 33.3 节：使用 \"-x\" 调试 bash 脚本\n\n\
    使用 \"-x\" 启用执行行的调试输出。它可以在整个会话或脚本中运行，也可以在脚本内部以编程方式运行。\n\n```bash\nbash -x myscript.sh\n\
    ```\n\n或者\n\n```bash\n$ --debug myscript.sh\n```\n\n在 bash 脚本内部开启调试。脚本退出时会自动重置调试。\n\
    \n```bash\n#!/bin/bash\nset -x # 启用调试\n# 一些代码\nset +x # 禁用调试\n```\n\n# 第 34 章：模式匹配与正则表达式\n\
    \n### 第 34.1 节：从正则匹配中获取捕获组\n\n输出：\n\nI am a simple string with digits1234\nI am\
    \ a simple string\n\n### 第 34.2 节：glob 未匹配到任何项的行为\n\n准备：\n\n```bash\nmkdir globbing\n\
    cd globbing\nmkdir -p folder/{sub,another}/folder/content/deepfolder/\ntouch space{sub,another}/folder/content/deepfolder/\n\
    .hidden\n```\n\n在 glob 未匹配的情况下，结果由 nullglob 和 failglob 选项决定。如果两者都没有设置，Bash 将返回\
    \ glob 本身：\n\n```bash\n$ echo no*\nno*match\n```\n\n如果启用了 nullglob，则返回空（null）：\n\
    \n```bash\n$ set nullglob\necho no*\n```\n\n如果启用了 failglob，则返回错误消息：\n\n```bash\n\
    $ set failglob\necho no*\nbash: no match: no*match\n```\n\n注意，failglob 选项优于 nullglob，即如果\
    \ nullglob 和 failglob 都设置了，将返回错误。\n\n### 第 34.3 节：检查字符串是否匹配正则表达式\n\n版本 ≥ 3.0\n\
    \n检查字符串是否正好包含 8 个数字：\n\n输出：\n\nI am a string with some digits102434\n\n除了将正则表达式赋值给变量\
    \ ($pat)，我们也可以这样做：\n\n```bash\n[[ $s ~ ^[0-9]+[0-9]+ ]]\n```\n\n解释：\n\n- [[ $s\
    \ ~ $pat 执行正则匹配\n- 匹配的捕获组位于名为 BASH_REMATCH 的数组中\n- BASH_REMATCH 数组中的第 0 个索引是总匹配\n\
    - BASH_REMATCH 数组中的索引 i 是捕获组，i = 1, 2, 3 ...\n\n### 第 34.5 节：* glob\n\n准备：\n\n\
    ```bash\nmkdir globbing\ncd globbing\nmkdir -p folder/(sub,another)/folder/content/deepfolder/\n\
    touch many story \"file with space\" folder/(sub,another)/folder/content/deepfolder/\n\
    .hidden\n```\n\n星号 * 可能是最常用的 glob。它只需匹配任何字符串：\n\n```\n$ echo *\nmany story folder\n\
    ```\n\n单个 * 不匹配位于子文件夹中的文件和文件夹：\n\n```bash\n$ echo *\nemptyfolder folder folder\n\
    $ echo folder/*\nfolder/anotherfolder/subfolder\n```\n\n等等，第 34.4 节缺失或被合并了。\n\n\
    ### 第 34.6 节：** glob\n\n版本 ≥ 4.0\n\n准备：\n\n```bash\nmkdir globbing\ncd globbing\n\
    mkdir -p folder/{sub,another}folder/content/deepfolder/\ntouch macy tracy \"file\
    \ with space\" folder/{sub,another}folder/content/deepfolder/file\n```\n\nBash\
    \ 能够将相邻的星号解释为单个 glob。在启用 globstar 的情况下，这可以匹配位于目录结构深处的文件夹：\n\n```bash\necho **\n\
    emptyfolder folder/anotherfolder/anotherfolder/content\nfolder/anotherfolder/content/deepfolder/anotherfolder/content/deepfolder/file\n\
    folder/subfolder/folder/subfolder/content/deepfolder/content/deepfolder\nfolder/subfolder/content/deepfolder/file\
    \ macy tracy\n```\n\n** 可以被看作路径扩展，无论路径有多深。此示例匹配任何以 deep 开头的文件或文件夹，无论它嵌套有多深：\n\n\
    ```bash\n$ echo /**deep/\nfolder/anotherfolder/content/deepfolder folder/subfolder/content/deepfolder\n\
    ```\n\n### 第 34.7 节：? glob\n\n准备：\n\n```bash\nmkdir globbing\ncd globbing\nmkdir\
    \ -p folder/{sub,another}folder/content/deepfolder/\ntouch macy tracy \"file with\
    \ space\" folder/{sub,another}folder/content/deepfolder/file\n.hiddenfile\n```\n\
    \nGoalKicker.com – Bash Notes for Professionals 111\n\n"
