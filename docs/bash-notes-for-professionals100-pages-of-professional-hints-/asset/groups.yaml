    \ will misinterpret:\n\n```bash\n# Actual code\necho 'hello' & /dev/null\n\n#\
    \ Desired behavior\necho 'hello' > /dev/null 2>&1\n```\n\nNOTE: 2>&1 is known\
    \ to work in both Bash and Zsh.\n\n## Section 9.4: Using named pipes\n\nSometimes\
    \ you may want to output something by one program and input it into another, but\
    \ can't use a standard pipe.\n\nYou could simply write to a temporary file:\n\n\
    ```\ntouch tempFile.txt\nls > tempFile.txt\ngrep \".log\" < tempFile.txt\n```\n\
    \nThis works for many applications, however nobody will know what tempFile does\
    \ and someone might remove it. \n\nThis is where a named pipe comes into:\n\n\
    ```\nmkfifo myPipe\nls > myPipe\ngrep \".log\" < myPipe\n```\n\nmyPipe is technically\
    \ a file (everything is in Linux), so just created a pipe in:\n\n```\nmkdir pipeFolder\n\
    cd pipeFolder\nmkfifo myPipe\nls -l\n```\n\nThe output is:\n`prw-r--r 1 root root\
    \ Jul 25 11:20 myPipe`\n\nNotice the first character in the permissions, it's\
    \ listed as a pipe, not a file.\n\nNow let's do something cool. Open one terminal,\
    \ and make note of the directory (or create one so that cleanup is easy), and\
    \ make a pipe.\n\n```\nmkfifo myPipe\n```\n\nNow let's put something in the pipe.\n\
    \n```\necho \"Hello from the other side\" > myPipe\n```\n\nYou'll notice this\
    \ hangs, the other side of the pipe is still closed. Let's open up the other side\
    \ of the pipe and let that stuff through. Open another terminal and go to the\
    \ directory that the pipe is in (if you know it, prepend to the pipe):\n\n```\n\
    cat < myPipe\n```\n\nYou'll notice that hello from the other side is output, the\
    \ program in the first terminal finishes, as does that the second terminal.\n\n\
    Now run the commands in reverse. Start with cat < myPipe and then echo something\
    \ into it. It works, because a program will be waiting until you put something\
    \ into the pipe before terminating, because it knows has to get something.\n\n\
    Named pipes can be useful for moving information between terminals or between\
    \ programs.\n\nPipes are small. Once full, the writer blocks until some reader\
    \ reads the contents, so you need to run either in different terminals or run\
    \ the other in the background:\n\n```\nls -l /tmp & myPipe &\ncat < myPipe\n```\n\
    \nMore examples using named pipes:\n\n- Example 1 - all commands on the same terminal\
    \ / same shell\n```\n$ $( ls -l & cat file3;) >mypipe &\n$ cat mypipe\n# Output:\
    \ Prints ls -l data and then prints file3 contents on screen\n```\n\n- Example\
