    \ between empty and unset,\n\n```\nif [[ -n \"${string*}\\}\" ]]; then\n  echo\
    \ \"$string is set, possibly the empty string\"\nfi\nif [[ -n \"${string-x}\"\
    \ ]]; then\n  echo \"$string is either unset or set to a non-empty string\"\n\
    fi\nif [[ -z \"${string+x}\" ]]; then\n  echo \"$string is unset\"\nfi\nif [[\
    \ -z \"${string-x}\" ]]; then\n  echo \"$string is set to an empty string\"\n\
    fi\n```\n\nwhere x is arbitrary. In table form:\n\n| $string is: | unset | empty\
    \ | non-empty |\n|-----------|-------|-------|------------|\n| -z ($string) |\
    \ true | true | false |\n| -z ($string-x) | true | false | false |\n| -z ($string//x)\
    \ | false | false | true |\n| -n ($string) | false | false | true |\n| -n ($string-x)\
    \ | false | true | true |\n| -n ($string-x) | true | false | true |\n\nAlternatively,\
    \ the state can be checked in a case statement:\n\n```\ncase $(var+Svar) in\n\
    \  (x) echo empty;\n  (\"\") echo unset;\n  (*x![:blank:]]) echo non-blank;\n\
    \  (*) echo blank\n```"
