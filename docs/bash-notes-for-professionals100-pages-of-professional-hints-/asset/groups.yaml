    \nelif [[ -p $filename ]]; then\n    echo \"$filename is a named pipe\"\nelif\
    \ [[ -s $filename ]]; then\n    echo \"$filename is a named socket\"\nelif [[\
    \ -b $filename ]]; then\n    echo \"$filename is a block device\"\nelif [[ -c\
    \ $filename ]]; then\n    echo \"$filename is a character device\"\nfi\n```\n\n\
    ```\nif [[ -L $filename ]]; then\n    echo \"$filename is a symbolic link (to\
    \ any file type)\"\nfi\n```\n\nFor a symbolic link, apart from -L, these tests\
    \ apply to the target, and return false for a broken link.\n\n```\nif [[ -L $filename\
    \ && -e $filename ]]; then\n    echo \"$filename exists (may be a broken symbolic\
    \ link)\"\nfi\n```\n\n# Section 22.2: String comparison and matching\n\nString\
    \ comparison uses the == operator over quoted strings. The != operator negates\
    \ comparison.\n\n```\nif [[ \"$string1\" == \"$string2\" ]]; then\n    echo \"\
    $string1 and $string2 are identical\"\nfi\nif [[ \"$string1\" != \"$string2\"\
    \ ]]; then\n    echo \"$string1 and $string2 are not identical\"\nfi\n```\n\n\
    If the right-hand side is not quoted then it is a wildcard that $string1 is matched\
    \ against.\n\n```\nstring='abc'\npattern1='a'\npattern2='x*'\nif [[ \"$string\"\
    \ == $pattern1 ]]; then\n    # the test is true\n```"
