    ```bash\necho \"Hello, ${name}!\"\n```\n\n## 第 1.4 节：字符串中引号的重要性\n\n引号对于 bash 中的字符串扩展至关重要。通过这些引号，你可以控制\
    \ bash 如何解析和展开你的字符串。引号有两种类型：\n\n- **弱引用 (Weak)**：使用双引号\n- **强引用 (Strong)**：使用单引号\n\
    \n如果你想让 bash 展开你的参数，可以使用弱引用：\n\n```bash\n#!/usr/bin/env bash\nworld=\"World\"\n\
    echo \"$World\"\n```\n\n如果你不想让 bash 展开你的参数，可以使用强引用：\n\n```bash\n#!/usr/bin/env\
    \ bash\nworld=\"World\"\necho '$World'\n```\n\n你也可以使用转义字符 `\\` 来防止扩展：\n\n```bash\n\
    #!/usr/bin/env bash\nworld=\"World\"\necho \"\\$world\"\n```\n\n## 第 1.5 节：查看\
    \ Bash 内置命令信息\n\n这将显示指定内置命令的帮助（手册）页面。例如，`help unset` 将显示 变量和函数的取消值及其属性。选项：\n\n\
    - f 将每个 NAME 视为 shell 函数\n- v 将每个 NAME 视为 shell 变量\n- n 将每个 NAME 视为名称引用并取消变量本身\n\
    \n如果不带选项，首先使用 `unset` 取消一个变量，如果失败了，则尝试取消一个函数。某些变量无法取消；另请参阅 `readonly`。退出状态：除非给出无效选项或\
    \ NAME 是只读的，否则返回成功。要查看所有带有简短描述的内置命令列表，请使用 `help -d`。\n\n## 第 1.6 节：“调试”模式下的 Hello\
    \ World\n\n`-x` 参数允许你逐行检查脚本中的每一行。这里有一个很好的例子：\n\n```bash\n$ cat hello.sh\n#!/bin/bash\n\
    echo \"Hello World\"\n$ bash -x hello.sh\n+ echo Hello World\nHello World\n```\n\
    \n上面的内容可以让你跟踪脚本。使用下面的方法可以修复：\n\n```bash\n$ bash -x hello.sh\n+ echo Hello World\n\
    Hello World\n```\n\n## 第 1.7 节：处理命名参数\n\n```bash\n#!/bin/bash\n\ndeploy=false\n\
    uglify=false\n\nwhile (( $# > 1 )); do case $1 in\n  --deploy) deploy=\"$2\";\n\
    \  --uglify) uglify=\"$2\";\n  *) break;\nesac shift 2\ndone\n```\n\n```\n$deploy\
    \ && echo \"will deploy... deploy = $deploy\"\n$uglify && echo \"will uglify...\
    \ uglify = $uglify\"\n```\n\n```bash\n# 如何运行\nchmod +x script.sh\n./script.sh\
    \ --deploy true --uglify false\n```\n\n## 第二章：脚本 shebang\n\n### 2.1：Env shebang\n\
    \n为了通过在 PATH 中查找 bash 可执行文件来执行脚本，脚本的第一行必须指定 env 的绝对路径，并将 bash 作为参数：\n\n```bash\n\
    #!/usr/bin/env bash\n```\n\nshebang 中的 env 路径仅在直接启动脚本时才会解析和使用：\n\n```\nscript.sh\n\
    ```\n\n脚本必须具有执行权限。当显式指定 bash 解释器执行脚本时，会忽略 shebang：\n\n```bash\nbash script.sh\n\
    ```\n\n### 2.2：直接 shebang\n\n为了使用 bash 解释器执行脚本，脚本的第一行必须指定 bash 可执行文件的绝对路径：\n\n\
    ```bash\n#!/bin/bash\n```\n\nshebang 中的 bash 路径仅在直接启动脚本时才会解析和使用：\n\n```\n./script.sh\n\
    ```\n\n脚本必须具有执行权限。当显式指定 bash 解释器执行脚本时，会忽略 shebang：\n\n```\nbash script.sh\n```\n\
    \n### 2.3：其他 shebang\n\n内核知道两种类型的程序：二进制程序通过其 ELF（可扩展加载文件格式）头文件来识别，这通常由编译器产生。第二种是任何类型的脚本。\n\
    \n如果文件的第一行以序列 #开头，那么后面的字符串必须是解释器的路径。如果内核知道这一点，它将通过此路径调用解释器名称，并将该行后续的所有单词作为参数传递给解释器。如果没有名为\
