    their special meaning. These characters need a backslash before them (note if
    backslash is followed by some other character, the backslash remains). Double
    quotes are mostly useful when including a variable or a command substitution.


    ```

    echo "!\#$&\(\);*<=? @[\\|\^''\{\}]~"

    #      AA      AA

    echo "!\#$&\(\);*<=? @[\\|\^''\{\}]~"

    #      AA      AA

    [\ prints \[

    ```


    Interactively, beware that ! triggers history expansion inside double quotes:
    "!oops" looks for an older command containing "\oops" doesn''t do history expansion
    but keeps the backslash. This does not happen in scripts.'
