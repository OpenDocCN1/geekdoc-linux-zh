    To tell bash where the script is you need to be very specific, by pointing it
    to the containing directory, normally with / it is your working directory, . is
    an to the current directory. If you do not specify the directory, bash tries to
    locate the script in one of the directories contained in the $PATH environment
    variable.


    The following code accepts an argument $1, which is the first command line argument,
    and outputs it in a formatted string, following Hello,.


    ```

    Execute/Run via: ./hello.sh

    ```


    ```

    #!/usr/bin/env bash

    printf "Hello, %s\n" "$1"

    > Hello, World

    ```


    It is important to note that $1 is to be quoted in double quote, not single quote.
    "$1" expands to the first command line argument, as desired, while ''$1'' evaluates
    to literal string $1.


