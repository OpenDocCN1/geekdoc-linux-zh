    cmd || $cmd1 && echo 'previous cmds were successful' || echo 'one of them failed'\n\
    cmd || $cmd1 #If fails try cmd\n```\n\n# 22.5: File comparison\n\n```\nif [[ $file1\
    \ -ef $file2 ]]; then\n    echo '$file1 and $file2 are the same file'\nfi\n```\n\
    \n\"Same file that modifying one of the files in place affects the other. Two\
    \ files can be the same even if they have different names, if they are hard links,\
    \ or if they are symbolic links with the same target, or if one is a symbolic\
    \ link pointing to the other.\n\nIf two files have the same content, but they\
    \ are distinct files (so that modifying one does not affect the other), then -\
    \ reports them. If you want to compare two files byte by byte, use the cmp utility.\n\
    \n```\nif cmp -s \"$file1\" \"$file2\"; then\n    echo '$file1 and $file2 have\
    \ identical contents'\nelse\n    echo '$file1 and $file2 differ'\nfi\n```\n\n\
    To produce a human-readable list of differences between text files, use the diff\
