    # # Chapter 8: Jobs and Processes


    # ## Section 8.1: Job handling


    **Creating jobs**


    To create a job, just append a single & after the command:


    ```

    $ sleep 10 &

    [1] 20024

    ```


    You can also make a running process by pressing `Ctrl` + `z`


    ```

    $ sleep 10

    ^

    [1]+ Stopped

    ```


    **Background and foreground a process**


    To bring the Process to the foreground, the command `fg` is used together with
    %


    ```

    $ sleep 10 &

    [1] 20024


    $ fg %1

    sleep 10

    ```


    Now you can interact with the process. To bring it back to the background you
    can use the bg command. Due to the occupied terminal session, you need to stop
    the process first by pressing `Ctrl` + `z`


    ```

    $ sleep 10

    ^

    [1]+ Stopped


    $ bg %1

    [1]+ sleep 10 &

    ```


    Due to the laziness of some Programmers, all these commands work with a single
    % if there is only one process, or for the first process in the list. For Example:


    ```

    $ sleep 10 &

    [1] 20024


    $ fg %

    sleep 10

    ```


    or just


    ```

    $ %

    # laziness knows no boundaries, ''%'' is also working.

    sleep 10

    ```


    Additionally, just typing fg or bg without any argument handles the last job:


    ```

    $ sleep 20 &

    sleep 10 &

    $ fg

    ```'
