    # # Section 25.2: Math using bash capabilities


    Arithmetic computation can be also done without involving any other programs like
    this:


    Multiplication:


    ```

    echo $((5 * 2))

    10

    ```


    Division:


    ```

    echo $((5 / 2))

    2

    ```


    Modulo:


    ```

    echo $((5 % 2))

    1

    ```


    Exponentiation:


    ```

    echo $((5 ** 2))

    25

    ```


    # # Section 25.3: Math using bc


    bc is an arbitrary precision calculator language. It could be used interactively
    or be executed from command line.


    For example, it can print out the result of an expression:


    ```

    echo ''2 + 3'' | bc

    5

    ```


    ```

    echo ''12 / 5'' | bc

    2

    ```


    For floating-point arithmetic, you can import standard library bc -l1:


    ```

    echo ''12 / 5'' | bc -l1

    2.40000000000000000000

    ```


    It can be used for comparing expressions:


    ```

    echo ''8 > 5'' | bc

    1

    ```


    ```

    echo ''10 == 11'' | bc

    0

    ```'
