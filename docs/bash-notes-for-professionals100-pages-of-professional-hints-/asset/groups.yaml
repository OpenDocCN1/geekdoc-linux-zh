    # Section 10.8: For Loop with C-style syntax


    The basic format of C-style for loop is:


    ```

    for (( variable assignment; condition; iteration process ))

    ```


    Notes:


    +   - The assignment of the variable inside C-style for loop can contain spaces
    unlike the usual assignment

    - Variables inside C-style for loop aren''t preceded by $.


    Example:


    ```

    for (( i = 0; i < 10; i++ ))

    echo "The iteration number is $i"

    done

    ```


    Also we process multiple variables inside C-style for loop:


    ```

    for (( i = 0, j = 0; i < 10; i++, j = i * i ))

    echo "The square of $i is equal to $j"

    done

    ```


    # Section 10.9: Until Loop


    Until executes until condition is true


    ```

    i=5

    until [[ i -eq 10 ]]; do #Checks if i=10

    echo "i=$i" #Print the value of i

    i=$((i+1)) #Increment i by 1

    ```


    Output:


    ```

    i=5

    i=6

    i=7

    i=8

    i=9

    ```


    When i reaches 10 the condition in until loop becomes true and the loop ends.


    # Section 10.10: Switch statement with case


    With the case statement you can match values against one variable.


    The argument passed to case is expanded and to match against each pattern.


    If a match is found, the commands up to ;; are executed.'
