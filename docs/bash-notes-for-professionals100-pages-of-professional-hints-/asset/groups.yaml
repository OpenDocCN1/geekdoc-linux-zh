    \nSometimes we need to run commands against a lot of files. This can be done using\
    \ xargs.\n\n```bash\nfind -type d -print | xargs -r chmod\n```\n\nThe above command\
    \ will recursively find all directories (-type d) relative to . (which is your\
    \ current directory), and execute chmod on them. The -r option specifies to xargs\
    \ to not run if find did not find any. If your filenames or directories have a\
    \ space character in them, this command may choke; a solution is to use the following:\n\
    \n```bash\nfind -type d -print0 | xargs -r chmod\n```\n\nIn the example, the -print0\
    \ and -0 flags specify that the files will be separated by a null byte, and allows\
    \ the use of special characters, like spaces, in the filenames. This is a GNU\
    \ extension, and may not work in other versions of find and xargs. The preferred\
    \ way to do this is to skip xargs command and let find call the subprocess:\n\n\
    ```bash\nfind -type d -exec chmod 770 {}\n```\n\nHere, {} is a placeholder indicating\
    \ that you want to use the filename at that point. find will execute chmod on\
    \ each file individually. You can alternatively pass file names to a single call\
    \ of chmod by using:\n\n```bash\nfind -type d -exec chmod 770 {} +\n```\n\nThis\
    \ is also the behaviour of the above xargs snippets. (To call on each file individually,\
    \ you can use xargs -n1). A third option is to find bash loop over the list of\
    \ filenames:\n\n```bash\nfind -type d | while read -r d; do chmod 770 \"$d\";\
    \ done\n```\n\nThis is syntactically correct but clunky when you want to run multiple\
    \ commands on each found file. However, this is unsafe in the filenames with odd\
