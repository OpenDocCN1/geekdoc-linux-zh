  - "[PAGE 193]\n\n# # Chapter 65: Design Patterns\n\nAccomplish some common design\
    \ patterns in Bash\n\n# ## 65.1: The Publish/Subscribe (Pub/Sub) Pattern\n\nWhen\
    \ a Bash project turns into a library, it can difficult to add new functionality.\
    \ Function names, variables and parameters usually need to be changed in the scripts\
    \ that utilize them. In scenarios like this, it is helpful to decouple the code\
    \ and use an event driven design pattern. In said pattern, an external script\
    \ can subscribe to an event. When that event is triggered (published) the script\
    \ can execute the code that it registered with the event.\n\npubsub.sh:\n\n```\n\
    #!/usr/bin/env bash\n\n# Save the path to this script's directory in a global\
    \ env\n#nDIR=$(cd \"${BASH_SOURCE[0]}\" && pwd)\n\n# Array that will contain all\
    \ registered events\n#\nEVENTS=()\n\nfunction action1() {\n  echo \"Action #1\
    \ was performed ${2}\"\n}\n\nfunction action2() {\n  echo \"Action #2 was performed\"\
    \n}\n\n# @desc :: Registers an event\n# @param :: string $1 - The name of the\
    \ event. Basically an alias for a function name\n# @param :: string $2 - The name\
    \ of the function to be called\n# @param :: string $3 - Full path to script that\
    \ includes the function being called\nfunction subscribe() {\n  EVENTS+=(\"\\\
    $1:\\$2:\\$3\")\n}\n\n# @desc :: Publish an event\n# @param :: string $1 - The\
    \ name of the event being published\nfunction publish() {\n  for event in ${EVENTS[@]};\
    \ do\n    local IFS=':'\n    read -ra event <<< \"\\$event\"\n    if [[ \"${event[0]}\"\
    \ == \"\\$1\" ]]; then\n      ${event[1]} \"\\$2\"\n    fi\n  done\n}\n\n# Register\
    \ our events and the functions that handle them\n```"
- md: '

    subscribe "/do/work" "action1" "${DIR}"

    subscribe "/do/more/work" "action2" "${DIR}"

    subscribe "/do/even/more/work" "action1" "${DIR}"


    # Execute our events

    # # publish "/do/work"

    publish "/do/more/work"

    publish "/do/even/more/work" "again"


    # Run:


    ```

    chmod +x pubsub.sh

    ./pubsub.sh

    ```


    ## Chapter 66: Pitfalls


    ### Section 66.1: Whitespace When Assigning Variables


    Whitespace matters when assigning variables.


    ```

    foo = ''bar'' # incorrect

    foo= ''bar'' # incorrect

    foo=''bar'' # correct

    ```


    The first two will result in syntax errors (or worse, executing an incorrect command).
    The last example will correctly set the variable $foo to the text "bar".


    ### Section 66.2: Failed commands do not stop execution


    In most scripting languages, if a function fails, it may throw an exception and
    stop execution of the program. Bash commands do not have exceptions, but they
    do have exit codes. A non-zero exit code signals failure, however, a non-zero
    exit code will not stop execution of the program.


    This can lead to dangerous (although Admittedly admitted) situations like so:


    ```bash

    #!/bin/bash

    cd ~/non/existent/directory

    rm -rf *

    ```


    If-cd to this directory fails, Bash will ignore the failure and move onto the
    next command, wiping the directory from where you ran the script.


    The best way to deal with this problem is to use of the set command:


    ```bash

    #!/bin/bash

    set -e

    cd ~/non/existent/directory

    rm -rf *

    ```


    -e tells Bash to exit the script immediately if any command returns a non-zero
    status.


    ### Section 66.3: Missing The Last Line in a File


    The C standard says that files should end with a new line, so EOF comes at the
    end of a line, that line may be missed by some commands. As an example:


    ```

    $ echo ''one\nothree\c'' > file.txt

    ```


    ```

    $ cat file.txt

    one

    two

    ```


    ```

    $ while read line ; do echo "line $line"; done < file.txt

    one

    two

    ```


    To make this works correctly for in the above example, add a test so that it will
    continue the loop if the last line is not empty.


    ```

    $ while read line || [ -n "$line" ]; do echo "line $line" : done < file.txt

    one

    two

    three

    ```


    ## Appendix A: Keyboard shortcuts


    ### Section A.1: Editing Shortcuts


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + a | move to the beginning of the line |

    | Ctrl + e | move to the end of the line |

    | Ctrl + k | Kill the text from the current cursor position to the end of the
    line |

    | Ctrl + u | Kill the text from the current cursor position to the beginning of
    the line |

    | Ctrl + w | Kill the word behind the cursor position |

    | Alt + b | move backward one word |

    | Alt + f | move forward one word |

    | Ctrl + Alt + e | shell expand the most recently killed text back into the buffer
    at the cursor |

    | Ctrl + y | Yank through killed text. You can only do this if the prior command
    is Ctrl + y or Alt + y |


    Killing text will delete, but so that the user can reinsert it by ying. Similar
    to cut and paste that the text is placed on a ring which allows for storing more
    than one set of text to be yanked back to the command line.


    You can find out more in the emacs manual.


    ### Section A.2: Recall Shortcuts


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + r | search the history backwards |

    | Ctrl + p | previous command in history |

    | Ctrl + n | next command in history |

    | Ctrl + g | quit history searching mode |

    | Alt + . | use the last word of the previous command / repeat to get the last
    word of the previous + 1 command |

    | Alt + n Alt + . | use the nth word of the previous command |

    | !! + Return | execute the last command again (useful when you forgot sudo: sudo
    !!) |


    ### Section A.3: Macros


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + x ( | start a macro |

    | Ctrl + x ) | stop recording macro |

    | Ctrl + x e | execute the last recorded macro |


    ### Section A.4: Custom Key Bindings


    With the bind it is possible to define custom key bindings.


    The next example bind Alt + w to /dev/null 2>&:


    ```

    bind "\ew":"" >/dev/null 2>&\"

    ```


    if you want to execute the line immediately add \c-m (Enter) to it:


    ```

    bind "\ew\" : >/dev/null 2>&&\C-m\"

    ```


    ### Section A.5: Job Control


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + c | Stop the current job |

    | Ctrl + z | Suspend the current job (send a SIGTSTP signal) |


