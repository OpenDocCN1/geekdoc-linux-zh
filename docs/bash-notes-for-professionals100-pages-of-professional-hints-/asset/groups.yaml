    ## 第 66 章： pitfalls


    ### 第 66.1 节：变量赋值时的空格


    赋值变量时，空格非常重要。


    ```

    foo = ''bar'' # 错误

    foo= ''bar'' # 错误

    foo=''bar'' # 正确

    ```


    前两个将导致语法错误（或者糟，执行了错误的命令）。最后一个示例将正确将变量 $foo 设置为文本 "bar"。


    ### 第 66.2 节：命令失败不会停止执行


    在大多数脚本语言中，如果函数执行失败，它可能会抛出异常并停止程序的执行。Bash 命令没有异常，但它们有退出状态码（exit codes）。非零退出状态码表示失败，然而，非零状态码不会停止程序的执行。


    这可能导致危险的（尽管确实如此）情况，如下：


    ```bash

    #!/bin/bash

    cd ~/non/existent/directory

    rm -rf *

    ```


    如果 `cd` 进入此目录失败，Bash 将忽略失败并继续执行下一个命令，从你运行脚本的目录中删除所有内容。


    处理此最佳方法是使用 `set` 命令：


    ```bash

    #!/bin/bash

    set -e

    cd ~/non/existent/directory

    rm -rf *

    ```


    -e 告诉 Bash 如果任何命令返回非零状态，则立即退出脚本。


    ### 第 66.3 节：文件缺少最后一行


    C 标准规定文件应该以换行符结束，因此 EOF（文件结束符）出现在行的末尾，该行可能会被某些命令忽略。例如：


    ```

    $ echo ''one\nothree\c'' > file.txt

    ```


    ```

    $ cat file.txt

    one

    two

    ```


    ```

    $ while read line ; do echo "line $line"; done < file.txt

    one

    two

    ```


    为了使上述示例能够正常工作，添加一个测试，使得如果最后一行不为空则继续循环。


    ```

    $ while read line || [ -n "$line" ]; do echo "line $line" : done < file.txt

    one

    two

    three

    ```


    ## 附录 A：快捷键


    ### 第 A.1 节：编辑快捷键


    | 快捷键 | 说明 |

    | --- | --- |

    | Ctrl + a | 移动到行首 |

    | Ctrl + e | 移动到行尾 |

    | Ctrl + k | 删除从当前光标位置到行尾的文本 |

    | Ctrl + u | 删除从当前光标位置到行首的文本 |

    | Ctrl + w | 删除光标前的单词 |

    | Alt + b | 向后移动单词 |

    | Alt + f | 向前移动单词 |

    | Ctrl + Alt + e | 将最近删除的文本扩展回光标处的缓冲区 |

    | Ctrl + y | 剪切（Yank）已删除的文本。只有在上一个命令是 Ctrl + y 或 Alt + y 时才能执行此操作 |


    删除文本会将其删除，但用户可以通过 yank 重新插入。这类似于剪切和粘贴，文本被放置在一个环（ring）中，允许存储多组文本以便 yank 回命令行。


    你可以在 emacs 手册中找到更多信息。


    ### 第 A.2 节：召回快捷键


    | 快捷键 | 说明 |

    | --- | --- |

    | Ctrl + r | 反向搜索历史 |

    | Ctrl + p | 历史中的上一个命令 |

    | Ctrl + n | 历史中的下一个命令 |

    | Ctrl + g | 退出历史搜索模式 |

    | Alt + . | 使用上一个命令的最后一个单词 / 重复以获取上一个+1 命令的最后一个单词 |

    | Alt + n Alt + . | 使用上一个命令的第 n 个单词 |

    | !! + Return | 再次执行上一个命令（忘记 sudo 时有用：sudo !!） |


    ### 第 A.3 节：宏


    | 快捷键 | 说明 |

    | --- | --- |

    | Ctrl + x ( | 开始记录宏 |

    | Ctrl + x ) | 停止记录宏 |

    | Ctrl + x e | 执行最后记录的宏 |


    ### 第 A.4 节：自定义按键绑定


    通过 `bind` 可以定义自定义按键绑定。


    下一个示例将 Alt + w 绑定到 /dev/null 2>&：


    ```

    bind "\ew":"" >/dev/null 2>&\"

    ```


    如果你想立即执行该行，为其添加 \c-m (回车)：


    ```

    bind "\ew\" : >/dev/null 2>&&\C-m\"

    ```


    ### 第 A.5 节：作业控制


    | 快捷键 | 说明 |

    | --- | --- |

    | Ctrl + c | 停止当前作业 |

