    \n```bash\n# 展开为 bash 历史第 n 行\n!n \n\n# 展开为上一个命令\n!!\n\n# 展开为以 \"text\" 开头的上一个命令\n\
    !text\n\n# 展开为包含 \"text\" 的上一个命令\n!?text\n\n# 展开为 n 行之前的命令\n!-n\n\n# 展开为第一次出现\
    \ \"foo\" 的上一个命令\n!foo\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!^\n\n# 展开为第一次出现 \"foo\"\
    \ 的上一个命令\n!*\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!$\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!:\n\
    \n# 展开为第一次出现 \"foo\" 的上一个命令\n!,\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!.\n\n# 展开为第一次出现\
    \ \"foo\" 的上一个命令\n!/\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!|\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n\
    !?\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!]\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!}\n\n# 展开为第一次出现\
    \ \"foo\" 的上一个命令\n![\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!<\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n\
    !>\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!=\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!~\n\n# 展开为第一次出现\
    \ \"foo\" 的上一个命令\n!^\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n!'\n\n# 展开为第一次出现 \"foo\" 的上一个命令\n\
