    要以完全无歧的逐字节形式显示文件内容，十六进制转储（hex dump）是标准解决方案。这适用于文件的非常短片段，例如当你不知道精确的编码时。标准的十六进制转储工具是
    `od -cH`，但其表示方式略显麻烦；常用的替代方案有 `xxd` 和 `hexdump`。


    ```

    $ printf ''Hällò world'' | xxd

    00000000 48c3 a6cc 6333 6270 6b72 6664  H..llò w..rld

    ```


    ## 第 5.3 节：写入文件


    ```bash

    cat >>file

    ```


    它允许你在终端输入文本并将其保存到名为 file 的文件中。


    ```bash

    cat >>file

    ```


    效果相同，但它会将文本追加到文件的末尾。


    注意：按 Ctrl+D 结束终端上的输入（Linux）。


    可以使用“在此文档”（here document）将文件内容内联到命令行或脚本中：


    ```bash

    cat <<END >file

    Hello, World.

    END

    ```


    `<<` 重定向符号后的标记是一个任意字符串，它需要单独占一行（没有前导或后缀空格）以指示文档结束。你可以添加引号来防止 shell 执行命令替换和变量插值：


    ```bash

    cat <<''fnord''

    Nothing in ''here'' will be $changed

    fnord

    ```


    （如果不加引号，`here` 将作为命令执行，且 `$changed` 将替换为变量 `changed` 的值——如果它已定义）。


    ## 第 5.4 节：显示不可打印字符


    这对于查看是否存在不可打印字符或非 ASCII 字符很有用。


    ```bash

    $ cat -v file.txt

    $ cat -VE file.txt # 用于检测行尾空格。

    ```


    例如：


    ```bash

    $ echo " | cat -VE echo # | 将被实际的文件替换。

    M-b-^M-\] $

    ```


    你可能还想使用 `cat -A`（代表 All 全部），它等同于 `cat -VET`。它将显示 TAB 字符（显示为 `^I`）、不可打印字符和每行的结束：


    ```bash

    $ echo '''' | cat -A

    M-bm-^@M-^]I$

    ```


    ## 第 5.5 节：从标准输入读取


    ```bash

    cat < file.txt

    ```


    输出与 `cat file.txt` 相同，但它是从标准输入读取文件内容而不是直接读取文件。


    ```bash

    printf "first line\nSecond line\n" | cat -n

    ```


    `|` 之前的 `echo` 命令输出两行。`cat` 命令作用于输出添加行号。


    ## 第 5.6 节：输出时显示行号


    使用 `--number` 标志在每行之前打印行号。或者使用 `-n` 效果相同。


    ```bash

    $ cat --number file

    ```


    ```

    1 line 1

    2 line 2

    3

    4 line 4

    5 line 5

    ```


    在计算行数时跳过空行，使用 `--number-nonblank` 或简单的 `-b`。


    ```bash

    $ cat -b file

    ```


    ```

    1 line 1

    2 line 2

    3

    4 line 4

    5 line 5

    ```


    ## 第 5.7 节：合并 gzipped 文件


    由 gzip 压缩的文件可以直接合并成更大的 gzipped 文件。


    ```bash

    cat file1.gz file2.gz file3.gz > combined.gz

    ```


    这是 gzip 的一个属性，但效率低于先合并输入文件再对结果 gzip：


    ```bash

    cat file1 file2 file3 | gzip > combined.gz

    ```


    一个完整的演示：


    ```bash

    echo ''Hello world!'' > hello.txt

    echo ''Howdy world!'' > howdy.txt

    gzip hello.txt

    gzip howdy.txt

    ```


    ```bash

    cat hello.txt.gz howdy.txt.gz > greetings.txt.gz

    gunzip greetings.txt.gz

    cat greetings.txt

    ```


    结果如下：


    Hello world!

    Howdy world!


    注意 `greetings.txt.gz` 是**单个文件**，并被解压为**单个文件** .txt。这与 `tar -czf hello.txt howdy.txt
    > greetings.gz` 形成对比，后者在 tar 包内部保持文件独立状态。


    ## 第 6 章：Grep


    ### 第 6.1 节：如何在文件中搜索模式


    要在文件中查找单词 `foo`：


    ```bash

    grep foo ~/Desktop/bar

    ```


    要在文件中查找不包含 `foo` 的所有行：


    ```bash

    grep -v foo ~/Desktop/bar

    ```


    查找所有以 `foo` 结尾的单词（通配符扩展）：


    ```bash

    grep "*foo" ~/Desktop/bar

    ```


    ## 第 7 章：别名


    Shell 别名是创建新命令或用自己的命令封装现有命令的简单方法。这与 shell 函数有些重叠，但函数更强大，因此通常应优先选择函数。


    ### 第 7.1 节：跳过别名


    有时你可能临时跳过并禁用别名。为了说明，请考虑此别名：


    ```bash

    alias ls=''ls --color=auto''

    ```


    假设你想在不禁用别名的情况下使用 `ls` 命令。你有几种选择：


    - 使用内置命令：`command`

    - 使用命令的完整路径：`/bin/ls`

    - 在命令名的任何位置添加反斜杠，例如：`\ls`

    - 使用引号


    ### 第 7.2 节：创建别名


