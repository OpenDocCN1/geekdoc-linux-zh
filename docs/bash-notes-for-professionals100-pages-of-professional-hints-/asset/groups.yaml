    \ the exit code from the command is a zero, the statement is considered true.\n\
    \n```\nif grep \"foo\" bar.txt; then\n    echo \"foo was found\"\nelse\n    echo\
    \ \"foo was not found\"\n```\n\nMathematical expressions, when placed inside double\
    \ parentheses, also return 0 or 1 in the same way, and also be tested:\n\n```\n\
    if (($ $1 + 5 > 91 )); then\n    echo \"$1 is greater than 86\"\n```\n\nYou may\
