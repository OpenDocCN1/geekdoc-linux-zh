    ## 第 62 章：使用 Bash 进行网络


    Bash 常用于服务器和集群的配置与维护。文中应包含网络操作中使用的典型命令信息、何时为了什么目的使用哪个命令，以及这些命令独特或有趣的应用程序示例/样本。


    ### 第 62.1 节：网络命令


    ```

    ifconfig

    ```


    上述命令将显示机器所有激活的接口，并提供以下信息：


    - 1. 分配给接口的 IP 地址

    2. 接口的 MAC 地址

    3. 广播地址

    4. 发送和接收的字节数


    示例命令：


    ```

    ifconfig -a

    ```


    上述命令还将显示禁用的接口：


    ```

    ifconfig eth0

    ```


    上述命令将仅显示 eth0 接口：


    ```

    ifconfig eth0 192.168.1.100 netmask 255.255.255.250

    ```


    上述命令将把静态 IP 分配给 eth0 接口：


    ```

    ifup eth0

    ```


    上述命令将启用 eth0 接口：


    ```

    ifdown eth0

    ```


    下面的命令将禁用 eth0 接口：


    ```

    ping

    ```


    上述命令（分组数据报协议）用于测试两个节点之间的连通性：


    ```

    ping -c2 8.8.8.8

    ```


    上述命令将与 google 服务器进行 2 秒的 ping 或连通性测试。


    ```

    traceroute

    ```


    上述命令用于故障排除，以查找到达目标所需的跳数数。


    ```

    netstat

    ```


    上述命令（网络统计）提供连接信息及其状态：


    ```

    dig www.google.com

    ```


    上述命令（域名信息组）查询 DNS 相关信息：


    上述命令查询 DNS 并查找对应网站名称的 IP 地址。


    ```

    route

    ```


    上述命令用于检查网络信息。它基本上显示了路由表：


    ```

    route add default gw 192.168.1.1 eth0

    ```


    上述命令将在路由表中添加 eth0 接口的网络默认网关到 192.168.1.1：


    ```

    route del default

    ```


    上述命令将从路由表中删除默认路由。


    ## 第 63 章：并行 (Parallel)


    |  | 说明 |

    | --- | --- |

    | -j n | 并行运行作业 |

    | -k | 保持原有顺序 |

    | -X | 带有上下文替换的多参数 |

    | --colsep regex | 使用正则分割输入以便位置替换 |

    | { } (.) (1) (/) (#) | 替换字符串 |

    | {3} (3) {3} (3/) | 位置替换字符串 |

    | -S sshlogin | 示例：foo@server.com |

    | --trunc .bar | -transfer return (r).-bar 的简写 |

    | --all | 在所有 sshlogin 上运行带参数的命令 |

    | --nonall | 在所有 sshlogin 上运行不带参数的命令 |

    | --pipe | 将 stdin（标准输入）拆分为多个作业 |

    | --recend str | 为 --pipe 记录结束分隔符 |

    | --restart str | 为 --pipe 记录开始分隔符 |


    Linux 中的作业通过 GNU parallel 实现并行化。一个作业可以是一个单独的命令，也可以针对输入的每一行运行的小型脚本。典型输入可以是文件列表、主机列表、用户列表、URL
    列表或表格列表。作业也可以是可以从管道读取的命令。


    ### 第 63.1 节：对文件列表进行重复任务并行化


    如果利用更多的计算机资源（即 CPU 和内存），可以更高效地执行许多重复作业。以下是并行运行多个作业的示例。


    假设你有一个`文件列表`，例如 1s 的输出。假设这些文件是 bz2 压缩的，并且需要按照以下顺序对它们执行任务：


    - 1. 使用 bcat 将 bz2 文件解压到标准输出

    2. 使用 grep <某些关键词> 过滤（例如筛选）包含特定关键词的行

    3. 使用 gzip 将输出合并成单个 gzipped 文件


    使用 while 循环运行此操作可能如下所示：


    使用 GNU Parallel，我们只需执行以下操作即可同时运行 3 个作业：


    ```

    parallel -j 3 "bzcat {} | grep puppies" ::: $(cat filelist.txt) | gzip > output.gz

    ```


    该命令简单、简洁，并且当文件数量和大小较大时更高效。由 parallel 启动的作业 `-j 3` 启动了 3 个并行作业，并行作业的输入通过 `:::`
    获取。输出最终被传递到 `gzip > output.gz`。


    ### 第 63.2 节：STDIN 并行化


    现在，假设我们有一个大文件（例如 30 GB）需要逐行转换。假设我们有一个脚本 `convert.ah` 来执行此项`<任务>`。我们可以将该文件的内容管道到
    stdin，让 parallel 接收并分块处理：


    ```

    <stdin | parallel --pipe --block size= -k task > output.txt

    ```


    其中 `<stdin>` 可以源自任何地方，例如 `cat <file>`。


    作为一个可复现的示例，我们的任务是 `nl -n rz`。任何文件都将作为数据。


    '
