    # 第 1.1 节：Hello World


    ## 交互式 Shell


    bash 通常以**交互式**使用：它允许你输入并编辑命令，然后在你按下 `Return` 键时执行它们。许多基于 Unix 和类 Unix 的操作系统使用
    Bash 作为它们的默认 shell（特别是 Linux 和 macOS）。终端在启动时会自动进入交互式 Bash shell 进程。


    通过输入以下内容输出 Hello：


    ```

    echo "Hello World"

    # Hello World # 输出示例

    ```


    ### 注意


    * 你可以通过直接在终端输入 shell 的名称来切换 shell。例如：sh、bash 等。

    * echo 是 Bash 的内置命令，它将接收到的参数写入标准输出。默认情况下，它会在输出末尾添加换行符。


    ## 非交互式 Shell


    shell 还可以从脚本以**非交互式**运行，使得 shell 不需要人工交互。交互式行为和脚本行为应该是一致的——这是 Unix V7 Bourne shell
    以及继而来的 Bash 的重要设计考量。任何可以在命令行完成的操作都可以放入脚本中以供复用。


    按照以下步骤创建一个 Hello World 脚本：


    - 1. 创建一个名为 hello-world.sh 的新文件

