    The above command will recursively find all directories (-type) relative to .
    (which is your current directory), and execute chmod 770 on them. The -r option
    specifies to xargs to not run chmod if find did not find any.


    If your files names or directories have a space character in them, this command
    may choke; a solution is to use the following'
  - '[PAGE 75]


    ```

    find .type d -print0 | xargs -r chmod 770

    ```


    In the example, the -print0 and -0 flags specify that the files will be separated
    by a null byte, and allows the use of special characters, like spaces, in the
    file names. This is a GNU extension, and may not work in other versions of find
    and xargs.


    The preferred way to do this is to skip the xargs command and let find call the
    subprocess itself:


    ```

    find .type d -exec chmod 770 {} \\

    ```


    Here, the {} is a placeholder indicating that you want to use the file name at
    that point. find will execute chmod on each file individually.


    You can alternatively pass file names to a single call of chmod by using


    ```

    find .type d -exec chmod 770 { +

    ```


    This is also the behaviour of the above xargs snippets. (To call on each file
    individually, you can use xargs -n1).


    A third option is to find bash loop over the list of filenames outputs:


    ```

    find .type d | while read -r d; do chmod 770 "$d"; done

    ```


    This is syntactically correct but clunky, when you want to run multiple commands
    on each found file. However, this is unsafe in the file names with odd characters.


    ```

    find .type f | while read -r d; do mv "$d" "$(d// /)"; done

    ```


    which will replace all spaces in file names with underscores.(This example also
    won''t work if there are spaces in leading names).


    The problem with it is while read -r expects one entry per line, but file names
    can contain newlines (and, read -r will leave any trailing whitespace). You can
    fix this by turning around:


    ```

    find .type d -exec bash -c ''for f; do mv "$f" "$(f// /)"; done'' {} +

    ```


    This way, the -exec receives the file names in a form which is completely correct
    and safe; the bash -c receives them as a number of arguments, which will be found
    in {}, The script will need to make these names correct, of course; every variable
    which contains a file name needs to be in double quotes.


    The mysterious _ is because the first argument bash -c ''script'' is used to populate
    $0.


