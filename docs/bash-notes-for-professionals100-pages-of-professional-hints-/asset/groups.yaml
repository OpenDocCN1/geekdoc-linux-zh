    ```\n\n## Chapter 55: The cut command\n\n| Parameter | Details |\n| --- | ---\
    \ |\n| -f, --fields | Field-based selection |\n| -d, --delimiter | Delimiter-based\
    \ selection |\n| -c, --characters | Character-based selection, delimiter ignored\
