    echo "$_$"

    ```


    Output:


    ```

    ~ $ ./test.sh running test.sh

    ./test.sh

    ```


    Note: This is not a foolproof way to get the script path


    # Section 36.30: $GROUPS


    An array containing the numbers of groups the user is in:


