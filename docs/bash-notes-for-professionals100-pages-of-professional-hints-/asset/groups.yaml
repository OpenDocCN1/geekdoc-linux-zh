    ## Section 34.8: The [ ] glob


    ### Preparation


    ```bash

    $ mkdir globbing

    $ cd globbing

    $ mkdir -p folder/(sub, another)/folder/content/deepfolder/

    touch macy stacy tracy "file with space" folder/(sub, another)/folder/content/deepfolder/.file_hidden

    $ shopt -u nullglob

    $ shopt -u failglob

    $ shopt -u dotglob

    $ shopt -u nocaseglob

    $ shopt -u extglob

    $ shopt -u globstar

    ```


    If there is to match specific characters then ''[]'' can be used. Any character
    inside ''[]'' will be matched exactly once.


    ```bash

    $ echo [macy]

    macy

    $ echo [[st]]acy

    stacy tracy

    ```


    The [] glob, however, is more versatile than that. It also allows for a negative
    match and even matching ranges of characters and classes. A negative match is
    achieved by using ! or ^ as the first character following [.. We can match stacy


    ```bash

    $ echo [[!r]acy

    stacy

    ```


    We are here basing the we want to match only files which do not start with a t
    and the second letter is not an r the file ends in ac.


    Ranges can be matched by separating a pair of characters with a hyphen (-). Any
    character that falls between two enclosing characters - inclusive will be matched.
