    \ |\n| \\@ | 12小时制 am/pm 时间 |\n| \\u | 当前用户 own |\n| \\v | bash 版本（例如5.0） |\n\
    | \\V | bash 补丁级别（例如5.0.0） |\n| \\w | 当前工作目录，带 $HOME 路径 |\n| \\W | 当前工作目录，带 $HOME\
    \ 缩写 |\n| \\! | 命令历史 |\n| \\$ | 有效 UID 为 0，否则为 # |\n| \\nn | 八进制字符 |\n| \\[ |\
    \ 不打印字符的开始序列 |\n| \\] | 不打印字符的结束序列 |\n\n例如，我们可以设置 PS1：\n\n```bash\nPS1=\"\\u@h:\\\
    \\w$\"\n```\n\n它将输出：\n\n> user@machine:~$\n\n30.6：显示上一个命令的状态和时间\n\n有时我们需要一个视觉提示来指示上一个命令的状态。注意\
    \ __stat() 函数应该在每次生成新的 PS1 时调用，否则它将返回 .bashrc 或 .bash_profile 的最后一个命令的状态。\n\n\
    ```bash\n# ANSI-COLOR\nColor_off=\"\\033[0m\"\n# 常规\nRed=\"\\033[01m\"\nGreen=\"\
    \\033[02m\"\n```\n\n```bash\nfunction __stat() {\n  if [ $? -eq 0 ]; then\n  \
    \  echo -en \"$Green $Color_Off\"\n  else\n    echo -en \"$Red $Color_Off\"\n\
    \  fi\n}\n```\n\n```bash\nPS1='$(__stat)'\nPS1+='\\e[0;33m\\u\\h\\e[0m\\e[1;34m\\\
    w\\e[0m \\$'\n\nexport PS1\n```\n\n![](img/9510873292d27579f7269978b556d3d7_116_0.png)\n\
    \n## 第 31 章：括号扩展 (Brace Expansion)\n\n### 第 31.1 节：修改文件名\n\n```bash\nmv filename.{jar,zip}\n\
    ```\n\n展开为 `mv filename.jar filename.zip`。\n\n### 第 31.2 节：按月份和年份创建目录\n\n```bash\n\
    mkdir 20{09..11}-{01..12}\n```\n\n输入 `ls` 命令将显示创建了以下目录：\n\n```\n2009-01 2009-04\
    \ 2009-07 2009-10 2010-01 2010-04 2010-07 2010-10 2011-01 2011-04 2011-07 2011-10\n\
    2009-02 2009-05 2009-08 2009-11 2010-02 2010-05 2010-08 2010-11 2011-02 2011-05\
    \ 2011-08 2011-11\n2009-03 2009-06 2009-09 2009-12 2010-03 2010-06 2010-09 2010-12\
    \ 2011-03 2011-06 2011-09 2011-12\n```\n\n在示例中 0-9 前面加上零可以确保数字补齐单个 0。你也可以用多个零填充数字，例如：\n\
    \n### 第 31.3 节：创建备份\n\n```bash\ncp filename.{,bak}\n```\n\n这创建了 `filename` 和 `filename.bak`。\n\
    \n### 第 31.4 节：使用增量\n\n```bash\ntouch file{1..3}\n```\n\n这创建了 file1, file2 和 file3。\n\
    \n### 第 31.5 节：组合多个括号\n\n```bash\necho {a..c}{1..2}\n```\n\n这创建了 a1, a2, b1, b2,\
