    # Chapter 5: Using cat


    | Option | Details |


    +   - -n Print line numbers

    - -v Show non-printing characters using ^ and M- notation except LFD and TAB

    - -T Show TAB characters as |

    - -E Show linefeed(LF) characters as $$

    - -e Same as -v

    - -b Number nonempty output lines, overrides -n

    - -A equivalent to -vET

    - -s suppress empty output lines, s refers to squeeze


    # Section 5.1: Concatenate files


    This is the primary purpose of cat.


    ```

    cat file1 file2 file3 > file_all

    cat can also be used similarly to concatenate files as part of a pipeline, e.g.

    cat file1 file2 file3 | grep foo

    ```


    # Section 5.2: Printing the Contents of a File


    ```

    cat file.txt

    ```


    will print the contents of a file.

    If the file contains non-ASCII characters, you can display those characters symbolically
    with cat -v. This can be quite useful for situations where control characters
    would otherwise be invisible.


    ```

    cat -v unicode.txt

    ```


    Very often, for interactive use, you are better off using an interactive pager
    less or more, though. (less is far more powerful than more and it is advised to
    use less more often than less.)


    ```

    less file.txt

    ```


    To pass the contents of a file as input to a command. An approach usually seen
    as better (UUOC) is to use redirection.


    ```

    tr A-Z a-z <file.txt # as an alternative to cat file file.txt | tr A-Z a-z

    ```


    In case the content needs to be listed backwards from its end command tac can
    be used:


    ```

    tac file.txt

    ```


    If you want to print the contents with line numbers, then use -n with cat:


    ```

    cat -n file.txt

    ```'
- md: "\nTo display the contents of a file in a completely unambiguous byte-by-byte\
    \ form, a hex dump is the standard solution. This is good for very brief snippets\
    \ of a file, such as when you don't know the precise encoding. The standard hex\
    \ dump utility is od -cH, though the representation is slightly cumbersome; common\
    \ replacements xxd and hexdump.\n\n```\n$ printf 'Hällò world' | xxd\n00000000\
    \ 48c3 a6cc 6333 6270 6b72 6664  H..llò w..rld\n```\n\n## Section 5.3: Write to\
    \ a file\n\n```bash\ncat >>file\n```\n\nIt will let you write the text on terminal\
    \ which will be saved in a file named.\n\n```bash\ncat >>file\n```\n\nwill do\
    \ the same, except it will append the text to the end of the file.\n\nN.B: Ctrl+D\
    \ to ending text on terminal (Linux)\n\nA here document can be used to inline\
    \ the contents of a file into a command line or a script:\n\n```bash\ncat <<END\
    \ >file\nHello, World.\nEND\n```\n\nThe token after the << redirection symbol\
    \ is an arbitrary string which needs to occur alone on a line (with no leading\
    \ or trailing whitespace) to indicate the end of the document. You can add quoting\
    \ to prevent the shell from performing command substitution and variable interpolation:\n\
    \n```bash\ncat <<'fnord'\nNothing in 'here' will be $changed\nfnord\n```\n\n(Without\
    \ the quotes, here would be executed as a command, and $changed would be substituted\
    \ with the value of the variable changed -- or, if it was defined).\n\n## Section\
    \ 5.4: Show non-printable characters\n\nThis is useful to see if there are any\
    \ non-printable characters, or non-ASCII characters.\n\n```bash\n$ cat -v file.txt\n\
    $ cat -VE file.txt # Useful in detecting trailing spaces.\n```\n\ne.g.\n\n```bash\n\
    $ echo \" | cat -VE echo # | will be replaced by actual file.\nM-b-^M-\\] $\n\
    ```\n\nYou may also want to use cat -A (for All) that is equivalent to cat -VET.\
    \ It will display TAB characters (displayed '^I), non printable characters and\
    \ end of each line:\n\n```bash\n$ echo '' | cat -A\nM-bm-^@M-^]I$\n```\n\n## Section\
    \ 5.5: Read from standard input\n\n```bash\ncat < file.txt\n```\n\nOutput is as\
    \ cat file.txt, but it reads the contents of the file from standard input instead\
    \ of directly the file.\n\n```bash\nprintf \"first line\\nSecond line\\n\" | cat\
    \ -n\n```\n\nThe echo command before | outputs two lines. The cat command acts\
    \ on the output to add line numbers.\n\n## Section 5.6: Display line numbers with\
    \ output\n\nUse the --number flag to print line numbers before each line. Alternatively,\
    \ -n does the same thing.\n\n```bash\n$ cat --number file\n```\n\n```\n1 line\
    \ 1\n2 line 2\n3\n4 line 4\n5 line 5\n```\n\nTo skip empty lines when counting\
    \ lines, use the --number-nonblank, or simply -b.\n\n```bash\n$ cat -b file\n\
    ```\n\n```\n1 line 1\n2 line 2\n3\n4 line 4\n5 line 5\n```\n\n## Section 5.7:\
    \ Concatenate gzipped files\n\nFiles compressed by gzip can be directly concatenated\
    \ into larger gzipped files.\n\n```bash\ncat file1.gz file2.gz file3.gz > combined.gz\n\
    ```\n\nThis is a property of gzip that is less efficient than concatenating the\
    \ input files and gzipping the result:\n\n```bash\ncat file1 file2 file3 | gzip\
    \ > combined.gz\n```\n\nA complete demonstration:\n\n```bash\necho 'Hello world!'\
    \ > hello.txt\necho 'Howdy world!' > howdy.txt\ngzip hello.txt\ngzip howdy.txt\n\
    ```\n\n```bash\ncat hello.txt.gz howdy.txt.gz > greetings.txt.gz\ngunzip greetings.txt.gz\n\
    cat greetings.txt\n```\n\nWhich results in\n\nHello world!\nHowdy world!\n\nNotice\
    \ that greetings.txt.gz is a **single file** and is decompressed as the **single\
    \ file**.txt. Contrast this with `tar -czf` hello.txt howdy.txt > greetings.gz,\
    \ which keeps the files separate inside the tarball.\n\n## Chapter 6: Grep\n\n\
    ### Section 6.1: How to search a file for pattern\n\nTo find the word foo in the\
    \ file:\n\n```bash\ngrep foo ~/Desktop/bar\n```\n\nTo find all lines that do not\
    \ contain foo in the file:\n\n```bash\ngrep -v foo ~/Desktop/bar\n```\n\nTo find\
    \ all words containing foo in end (Wildcard Expansion):\n\n```bash\ngrep \"*foo\"\
    \ ~/Desktop/bar\n```\n\n## Chapter 7: Aliasing\n\nShell aliases are a simple way\
    \ to create new commands or wrap existing commands with your own. somewhat overlap\
    \ with shell functions, which however more versatile and should therefore often\
    \ preferred.\n\n### Section 7.1: Bypass an alias\n\nSometimes you may want to\
    \ bypass an alias temporarily, disabling it. To work with a concrete example,\
    \ consider this alias:\n\n```bash\nalias ls='ls --color=auto'\n```\n\nAnd let's\
    \ say you want to use the ls command without disabling it. You have several options:\n\
    \n- Use the builtin: command\n- Use the full path of the command: /bin/ls\n- Add\
    \ anywhere in the command name, for example: \\ls\n- Quote the command: \"ls\"\
    \ or 'ls'\n\n### Section 7.2: Create an alias\n\nInvoking word='command'. Any\
    \ arguments supplied to the alias are simply appended to the target of the alias:\n\
    \n```bash\nalias myAlias='command --options'\n```\n\nThe shell will then execute:\n\
    \n```bash\ncommand --options foo baz\n```\n\nTo include multiple commands in the\
    \ same alias, you can string together with &&. For example:\n\n```bash\nalias\
    \ print_things='echo \"foo\" && echo \"bar\" && echo \"baz\"'\n```\n\n### Section\
    \ 7.3: Remove an alias\n\nTo remove existing aliases, use:\n\n```bash\nunalias\
    \ alias_name\n```\n\nExample:\n\n```bash\n# create an alias\nalias now='date'\n\
    \n# preview the aliases\n$ now\nThu Jul 21 17:25\n\n# remove the alias\n$ unalias\
    \ now\n```\n\n### Section 7.4: The BASH_ALIASES is an internal bash array\n\n\
    Aliases are named shortcuts of commands, one can define and use in interactive\
    \ bash instances. They are held in associative array named BASH_ALIASES. To use\
    \ this var in a script, it must be run within an interactive shell.\n\n```bash\n\
    #!/bin/bash\n# note the -li above! -li makes this behave like login shell\n# -li\
    \ makes it behave like an interactive shell\n# expand_aliases will not work in\
    \ most cases\n```\n\n```bash\necho There are ${BASH_ALIASES[*]} aliases defined.\n\
    \nfor alias in ${BASH_ALIASES[@]}; do\n    printf \"alias:%s:%s\\n\" \"$alias\"\
    \ndone\n```\n\n### Section 7.5: Expand alias\n\nAssuming that bar is an alias\
    \ for someCommand -flag1. Type bar on the command line and then press Ctrl + alt\
    \ + e, you'll get someCommand -flag1 where bar was standing.\n\n### Section 7.6:\
    \ List all Aliases\n\n```bash\nalias -p\n```\n\nwill list all the current aliases.\n\
    \n## Chapter 8: Jobs and Processes\n\n### Section 8.1: Job handling\n\n**Creating\
    \ jobs**\n\nTo create a job, just append a single & after the command:\n\n```bash\n\
    $ sleep 10 &\n[1] 2024\n```\n\nYou can also make a running process by pressing\
    \ Ctrl + z:\n\n```bash\n$ sleep 10\n^\n[1]+ Stopped\n```\n\n**Background and foreground\
    \ a process**\n\nTo bring the Process to the foreground, the command `fg` is used\
    \ together with %\n\n```bash\n$ sleep 10 &\n[1] 2024\n\n$ fg %1\nsleep 10\n```\n\
    \nNow you can interact with the process. To bring it back to the background you\
    \ can use the bg command. Due to the occupied terminal session, you need stop\
    \ the process first by pressing Ctrl + z:\n\n```bash\n$ sleep 10\n^\n[1]+ Stopped\n\
    \n$ bg %1\n[1]+ sleep 10 &\n```\n\nDue to the laziness of some Programmers, all\
    \ these commands work with a single % if there is only one process, or for the\
    \ first process in the list. For Example:\n\n```bash\n$ sleep 10 &\n[1] 2024\n\
    \n$ fg %\nsleep 10\n```\n\nor just\n\n```bash\n$ %\n# laziness knows no boundaries,\
    \ '%' is also working.\nsleep 10\n```\n\nAdditionally, just typing fg or bg without\
    \ any argument handles the last job:\n\n```bash\n$ sleep 20 &\nsleep 10 &\n$ fg\n\
    ```\n\n```\nsleep 10\n*\n$ fg\nsleep 20\n```\n\n**Killing running jobs**\n\n```bash\n\
    $ sleep 10 &\n[1] 2024\n\n$ kill %1\n[1]+ Terminated sleep 10\n```\n\nThe sleep\
    \ process runs in the background with process id (pid) 2024 and job number 1.\
    \ In order to reference the process, you can use either the pid or the job number.\
    \ If you use the job number, you must prefix it with %. The default kill signal\
    \ is SIGTERM, which allows the target process to exit gracefully.\n\nCommon kill\
    \ signals are shown below. To see a full list, run kill -1.\n\n| Signal Name |\
    \ Value | Effect |\n|---|---|---|\n| SIGHUP | | Hangup |\n| SIGINT | 2 | Interrupt\
    \ from keyboard |\n| SIGKILL | 9 | Kill signal |\n| SIGTERM | 15 | Termination\
    \ signal |\n\n# Start and kill specific processes\n\nProbably the easiest way\
    \ of killing a running process is by selecting it through the process name as\
    \ in the following example using pkill command:\n\n```bash\nkill -f test.py\n\
    ```\n\n(or) kill a more-proof way using pgrep to search for the actual process-id\n\
    \n```bash\nkill $(pgrep -f 'python test.py')\n```\n\nThe result can be obtained\
    \ using grep over ps -ef | grep name_of_process then the process associated with\
    \ the resulting pid (process id). Selecting a process name is convenient in a\
    \ testing environment but can be very dangerous when the script is used in production:\
    \ it is impossible to be sure that the name will match the process you actually\
    \ want to. In these cases, the following approach is actually safe.\n\nStart the\
    \ script that will eventually kill with the following approach. Let's assume that\
    \ the command you want to execute and kill is python test.py.\n\n```bash\n#!/bin/bash\n\
    \nif [[ -e /tmp/test.py.pid ]]; then # Check if the file already exists\n    python\
    \ test.py &\\necho $! > /tmp/test.py.pid #and if so do not run another process.\n\
    else\n    echo -n \"ERROR: The process is already running with pid \"\n    cat\
    \ /tmp/test.py.pid\n    echo\nfi\n```\n\nThis will create a file in the /tmp directory\
    \ containing the pid of the python test.py process. If the file exists, we assume\
    \ the command is already running and the script return an error.\n"
