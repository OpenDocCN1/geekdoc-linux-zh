  mdcn: "\n\n# 第 48.5 节：使用 | 链接命令\n\n`|` 将左侧命令的输出管道作为右侧命令的输入。注意，这是在子 shell 中执行的。因此，你无法在管道内设置调用进程的变量。\n\
    \n```\nfind . -type f -iname '*.mp3' | \\\n  while read filename; do\n    mute\
    \ --noise \"$filename\"\n  done\n```\n\n# 第 49 章：Shell 的类型\n\n## 第 49.1 节：启动交互式\
    \ shell\n\n```bash\nbash\n```\n\n## 第 49.2 节：检测 shell 类型\n\n```bash\nsh -q login_shell\
    \ && echo 'login' || echo 'not-login'\n```\n\n## 第 49.3 节：隐藏文件（dot files）\n\n\
    在 Unix 中，以点开头的文件和目录通常包含特定程序或一系列程序的设置。隐藏文件通常对用户隐藏，因此你需要运行 `ls -a` 才能看到它们。\n\n隐藏文件的一个示例是\
    \ `.bash_history`，它包含了最近执行的命令（假设用户正在使用 Bash）。\n\n当你进入 Bash shell 时，会有各种文件被加载（sourced）。下图取自该网站，展示了在启动时选择加载哪些文件的决策过程。\n\
    \n![](img/9510873292d27579f7269978b556d3d7_166_0.png)\n\n# 第 50 章：彩色脚本输出（跨平台）\n\
    \n## 第 50.1 节：color-output.sh\n\n在 bash 脚本的开头部分，可以定义一些变量，作为脚本运行期间格式化终端输出的助手。不同的平台使用不同的字符序列来表示颜色。然而，有一个名为\
    \ `tput` 的工具，它可以在所有 *nix 系统上运行，并通过一致的跨平台 API 返回特定平台的终端颜色字符串。\n\n例如，存储将终端文本变为红色或绿色的字符序列：\n\
    \n```bash\nred=$(tput setaf 1)\ngreen=$(tput setaf 2)\n```\n\n或者，存储将文本重置为默认外观的字符序列：\n\
    \n```bash\nreset=$(tput sgr0)\n```\n\n然后，如果 BASH 脚本需要显示不同颜色的输出，可以通过以下方式实现：\n\n\
    ```bash\necho \"${green}Success!${reset}\"\necho \"${red}Failure.${reset}\"\n\
    ```\n\n# 第 51 章：协进程（co-processes）\n\n## 第 51.1 节：Hello World\n\n```bash\n# 创建协进程\n\
    coproc bash\n\n# 向它发送命令 (echo a)\necho 'echo Hello World' >&${COPROC[1]}\n\n#\
    \ 从它的输出中读取一行\nread <${COPROC[0]}\n\n# 显示该行\necho \"$line\"\n```\n\n输出为 \"Hello\
    \ World\"。\n\n# 第 52 章：变量类型化\n\n## 第 52.1 节：声明弱类型变量\n\n**declare** 是 bash 的一个内置命令。（使用内置命令\
    \ **help** 可显示“帮助文档”）。它用于定义变量和显示函数体。\n\n语法：**declare [options][name=value]...**\n\
    \n```bash\n# options 用于定义\n# 一个整数\ndeclare -i myInteger\ndeclare -i anotherInt=10\n\
    # 带有值的数组\ndeclare -a anArray=( one two three )\n# 一个关联数组\ndeclare -A asocArray=(\
    \ [element1]=\"something\" [second]=anotherthing )\n# 注意它能识别 [] 内的字符串内容\n\n# 存在一些修饰符\n\
    # 大写内容\ndeclare -u big;this will be uppercase\n# 同样适用于小写\ndeclare -l small='THIS\
    \ WILL BE LOWERCASE'\n\n# 只读数组\ndeclare -ra constarray=( eternal true and unchangeable\
    \ )\n\n# 导出整数环境变量\ndeclare -xi importantInt=42\n```\n\n你可以使用 `+` 来移除给定的属性。大多数情况下没用，只是为了完整性。\n\
    \n要显示变量和/或函数也有一些选项：\n\n```bash\n# 打印定义的变量和函数\ndeclare -f\n# 仅限制输出为函数\ndeclare\
    \ -F # 如果调试时还会打印定义的行号和文件名\n```\n\n# 第 53 章：特定时间执行任务\n\n## 第 53.1 节：在特定时间执行一次任务\n\
    \n注意：大多数发行版默认没有安装 `at` 命令。\n\n要在现在的其他时间（本例中为下午 5 点）执行任务，你可以使用：\n\n```bash\necho\
    \ somecommand & | at 5pm\n```\n\n如果你想捕获输出，可以用通常的方法处理：\n\n```bash\necho somecommand\
    \ > out.txt 2>err.txt & | at 5pm\n```\n\n`at` 理解许多时间格式，或者你也可以说：\n\n```bash\necho\
    \ somecommand & | at now + 2 minutes\necho somecommand & | at 17:00\necho somecommand\
    \ & | at 17:00 Jul 7\necho somecommand & | at 4pm 12.03.17\n```\n\n如果没有给出顺序，它假设为下一次发生的时间。如果你给出一个今天已经过去的小时，它将假设是明天；如果你给出一个今年已经过去的月份，它将假设是明年。\n\
    \n这也可以配合 `nohup` 使用：\n\n```bash\necho nohup somecommand > out.txt | at 5pm\n```\n\
    \n（注：后续原文存在大量重复段落，已按要求不重复输出翻译）\n\n"
