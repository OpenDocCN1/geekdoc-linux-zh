- md: "\n## Chapter 30: Customizing PS1\n\n### Section 30.1: Colorize and customize\
    \ terminal prompt\n\nThis is how the author sets their PS1 variable:\n\n```bash\n\
    gitps1=$(git branch 2>/dev/null | grep '*')\ngitps1=$(${gitps1#\\/* })\necho \"\
    $gitps1\"\n#Please use the below function if you are a mac user\ngitPS1ForMac()\
    \ {\n  git branch 2>/dev/null | sed -e '^[^/]*' -e 's/\\(.*)/\\1/'\n}\ntimeNow()\
    \ {\n  echo \"$(date +%m)\"\n}\nif [ \"$color.prompt\" = yes ]; then\n  if [ \"\
    $SEUID\" -eq ${timeNow} ]; then\n    PS1='\\033[31m;1:30m][\\033[00m]\\033[31m][\\\
    033[37m]@\\033[00m]\\033[34m][\\033[36m]$($gitps1)\\033[00m][\\033[31m]:#\\033[00m'\n\
    \  else\n    PS1='\\033[31m;1:30m][\\033[00m]\\033[31m][\\033[37m]@\\033[00m]\\\
    033[34m[\\033[36m]$($gitps1)\\033[00m][\\033[31m]:$\\033[00m'\n  fi\nfi\nPS1='${timeNow}]@h\
    \ \\w($gitPS1):$'\n```\n\nAnd this is how my prompt looks like:\n\n![](img/9510873292d27579f7269978b556d3d7_112_0.png)\n\
    \nColor reference:\n\n```bash\n# Colors\ntxtblk='\\e[30m' # Black - Regular\n\
    txtred='\\e[31m' # Red\ntxtgrn='\\e[32m' # Green\ntxtyell='\\e[33m' # Yellow\n\
    txtblue='\\e[34m' # Blue\ntxtpur='\\e[35m' # Purple\ntxtcyan='\\e[36m' # Cyan\n\
    txtwmt='\\e[37m' # White\nbldblk='\\e[30m' # Black - Bold\nbldred='\\e[31m' #\
    \ Red\nbldgrn='\\e[32m' # Green\nbldyell='\\e[33m' # Yellow\nbldblue='\\e[34m'\
    \ # Blue\nbldpur='\\e[35m' # Purple\nbldcyan='\\e[36m' # Cyan\n```\n\nGoalKicker.com\
    \ - Bash Notes for Professionals\n\n### Section 30.2: Show git branch name in\
    \ terminal prompt\n\nYou can have functions the PS1 variable, just sure to use\
    \ single quote it or use escape for special chars:\n\n```bash\ngitps1() {\n  gitps1=$(git\
    \ branch 2>/dev/null | grep ' ')\n  gitps1=\"$gitps1+ (${gitps1#**/})\"\n  echo\
    \ \"\\$gitps1\"\n}\n```\n\nIt will give you a prompt like this:\n\nuser@Host:~/path\
    \ (master)$\n\nNotes:\n\n- Make the changes in ~/.bashrc or /etc/bashrc or ~/.bash_profile\
    \ or ~/.profile file (depending on the OS) and save it.\n- Run source ~/.bashrc\
    \ (distro specific) after saving the file.\n\n### Section 30.3: Show time in terminal\
    \ prompt\n\ntimeNow()\n\n```bash\ntimeNow() {\n  echo \"$(date +%r)\"\n}\n```\n\
    \nGoalKicker.com - Bash Notes for Professionals\n\nIt will give you prompt like\
    \ this:\n\n```\n[05:34:37 PM user@Host:/path$]\n```\n\nNotes:\n\n- Make the changes\
    \ in ~/.bashrc or /etc/bashrc or ~/.bash_profile or ~/.profile file (depending\
    \ on the OS) and save it.\n- Run source ~/.bashrc (distro specific) after saving\
    \ the file.\n\n### Section 30.4: Show a git branch using PROMPT_COMMAND\n\nIf\
    \ you are inside a folder of a git repository it might be nice to show the current\
    \ branch you are on. In ~/.bashrc or /etc/bashrc add the following (git is required\
    \ for this to work):\n\n```bash\nfunction prompt_command {\n    # Check if we\
    \ are inside a git repository\n    if git status > /dev/null 2>&1; then\n    \
    \    # Only get the name of the branch\n        export GIT_STATUS=$(git status\
    \ | grep 'On branch' | cut -b 10-)\n    else\n        export GIT_STATUS=\"\"\n\
    }\n\n# This function gets called every time PS1 is shown\nPROMPT_COMMAND=prompt_command\n\
    \nPS1='$GIT_STATUS \\u@h:\\w$ '\n```\n\nIf we are in a folder a git repository\
    \ this will output:\n\n> branch user@machine:--$\n\nAnd if we are inside a normal\
    \ folder:\n\n> user@machine:--$\n\n### Section 30.5: Change PS1 prompt\n\nTo change\
    \ PS1, just have to change the value of PS1 variable. The value can be set in\
    \ ~/.bashrc or /etc/bashrc file, depending on the distro. PS1 can be changed to\
    \ any plain text like:\n\n```bash\nPS1=\"hello\"\n```\n\nBesides the plain text,\
    \ a number of backslash-escaped special characters are supported:\n\n| Format\
    \ | Action |\n| :--- | :--- |\n| \\a | ASCII bell character (07) |\n| \\d | date\
    \ in \"Weekday Date\" format (e.g., \"Tue May 26\") |\n| \\e | ASCII escape character\
    \ (033) |\n| \\h | hostname to the first '.' |\n| \\j | number of jobs managed\
    \ by the shell |\n| \\n | newline |\n| \\r | carriage return |\n| \\s | name of\
    \ the shell |\n| \\t | current time in 24-hour HH:MM:SS format |\n| \\T | current\
    \ time in 12-hour HH:MM:SS format |\n| \\@ | current time in 12-hour am/pm format\
    \ |\n| \\u | username of the current user |\n| \\v | version of bash (e.g., 5.0)\
    \ |\n| \\W | release of bash, patch level (e.g., 5.0.0) |\n| \\w | current working\
    \ directory, with $HOME abbreviated |\n| \\W | current working directory, with\
    \ $HOME abbreviated with tilde |\n| \\! | history of this command |\n| \\$ | effective\
    \ UID is 0, otherwise # |\n| \\nn | character corresponding to octal |\n| \\[\
    \ | begin sequence of non-printing characters |\n| \\] | end sequence of non-printing\
    \ characters |\n\nSo example, we can set PS1:\n\n```bash\nPS1=\"\\u@\\h:\\\\w$\"\
    \n```\n\nAnd it will output:\n\n> user@machine:~$\n\n###30.6: Show previous command\
    \ status and time\n\nSometimes we need a visual hint to indicate the status of\
    \ previous command. Note that the __stat__() function should be called every time\
    \ a new PS1 is generated, or else it would stick to return status of last command\
    \ of your .bashrc or .bash_profile.\n\n```bash\n# ANSI-COLOR-\nColor_off=\"\\\
    033[0m\"\n# Regular\nRed=\"\\033[01m\"\nGreen=\"\\033[02m\"\n```\n\n```bash\n\
    function __stat() {\n  if [ $ -eq 0 ]; then\n    echo -en \"$Green $Color_Off\"\
    \n  else\n    echo -en \"$Red $Color_Off\"\n  fi\n}\n```\n\n```bash\nPS1='$(__stat)'\n\
    PS1+='\\e[0;33m\\u\\h\\e[0m\\e[1;34m\\w\\e[0m \\$'\n\nexport PS1\n```\n\n![](img/9510873292d27579f7269978b556d3d7_116_0.png)\n\
    \n## Chapter 31: Brace Expansion\n\n### Section 31.1: Modifying filename extension\n\
    \n```bash\nmv filename.{jar,zip}\n```\n\nThis expands into mv filename.jar filename.zip.\n\
    \n### Section 31.2: Create directories to group files by month and year\n\n```bash\n\
    mkdir 20{09..11}-{01..12}\n```\n\nEntering the ls command will show that the following\
    \ directories were created:\n\n```\n2009-01 2009-04 2009-07 2009-10 2010-01 2010-04\
    \ 2010-07 2010-10 2011-01 2011-04 2011-07 2011-10\n2009-02 2009-05 2009-08 2009-11\
    \ 2010-02 2010-05 2010-08 2010-11 2011-02 2011-05 2011-08 2011-11\n2009-03 2009-06\
    \ 2009-09 2009-12 2010-03 2010-06 2010-09 2010-12 2011-03 2011-06 2011-09 2011-12\n\
    ```\n\nPutting a zero in front of 0-9 in the example ensures the numbers are padded\
    \ with a single 0. You can also pad numbers with multiple zeros, for example:\n\
    \n### Section 31.3: Create backup\n\n```bash\ncp filename.{,bak}\n```\n\nThis\
    \ creates filename and filename.bak.\n\n### Section 31.4: Use increments\n\n```bash\n\
    touch file{1..3}\n```\n\nThis creates file1, file2, and file3.\n\n### Section\
    \ 31.5: Combining multiple braces\n\n```bash\necho {a..c}{1..2}\n```\n\nThis creates\
    \ a1, a2, b1, b2, c1, c2.\n\n### Section 31.6: Make Multiple Directories with\
    \ Sub-Directories\n\n```bash\nmkdir -p toplevel/sublevel_{01..09}/{child1,child2,child3}\n\
    ```\n\nThis will create a folder called toplevel, nine folders inside of toplevel\
    \ named sublevel_01, sublevel_02, etc. Then inside of those sublevels: child1,\
    \ child2, child3 folders, giving you:\n\n```\ntoplevel/sublevel_01/child1\ntoplevel/sublevel_01/child2\n\
    toplevel/sublevel_01/child3\ntoplevel/sublevel_02/child1\n```\n\nand so on. I\
    \ find this very useful for creating multiple folders and sub folders for my specific\
    \ purposes, with one bash command. Substitute variables to help automate/parse\
    \ information given to the script.\n"
