    $/\\\\\\$/g;s/\\*/\\\\*/g;s/\\$\\\\\\$/g') # removes some symbols ( \\ | * $ )\
    \ to prevent XSS\n      with Bash and SQL.)\n```\n\n```bash\nQUERY_STRING_POST=$$(echo\
    \ \"$QUERY_STRING_POST\" | sed -e :a -e 's/<[^>]*>//g;/:N;ba') # \\\nremoves html\
    \ declarations to prevent XSS\nJSON=$(echo \"$QUERY_STRING_POST\" | jq .) # json\
    \ code - This is a pretty way\nto check for valid json code\n  *)\n  response_with_html\n\
    \    exit 0\n  esac\nelse\n  response_with_html\n    exit 0\nfi\n\n# Some Commands\n\
    \nresponse_with_json\n\nexit 0\n\nYou will get (\"message\":\"Hello World!\")\
    \ as an answer when sending JSON-Data via POST to this Script. Everything else\
    \ will receive the html document. Important is also the variable free of XSS,\
    \ but still could have wrong values in it and needs to verify first. Please keep\
    \ that in mind. This code works without JSON. You could get any data this way.\
    \ You just need to change the Content-Type for your needs.\n\nExample:\n\n```bash\n\
    if [ \"$REQUEST_METHOD\" = \"POST\" ]; then\n  case \"$CONTENT_TYPE\" in\n   \
    \ application/x-form-urlencoded)\n      read -n \"$CONTENT_LENGTH\" QUERY_STRING_POST\n\
    \    text/plain)\n      read -n \"$CONTENT_LENGTH\" QUERY_STRING_POST\n    ;\n\
    \  esac\nfi\n```\n\nLast not least, don't forget to third party programs won't\
    \ know if they succeeded\n\n## Chapter 60: Select keyword\n\nSelect keyword can\
    \ be used for getting input in menu format.\n\n## Section 60.1: Select keyword\
    \ can be used for getting argument in menu format\n\nSuppose you want the user\
    \ to pick from a menu, we can create a script similar to\n\n```bash\n#!/usr/bin/env\
    \ bash\nselect os in \"linux\" \"windows\" \"mac\"\ndo\n    echo \"$os\"\n   \
    \ break\ndone\n```\n\nExplanation: Here SELECT keyword is used to loop through\
    \ a list of items that will be presented at command prompt. Notice the break keyword\
    \ for breaking out of the loop once the user makes a choice. Otherwise, the loop\
    \ will be endless! Results: Upon running this script, a menu of these items will\
    \ be displayed and the user will be prompted for selection. Upon selection, the\
    \ value will be displayed, returning back to command prompt.\n\n```bash\n> select_menu.sh\n\
    1) linux\n2) windows\n3) mac\n```\n\n## Chapter 61: When to use eval\n\nFirst\
    \ and foremost: know what you're doing! Secondly, while you should avoid using\
    \ eval if its use makes code cleaner, go ahead.\n\n## Section 61.1: Using Eval\n\
    \n example, consider the following that sets the contents of $@ to a given variable:\n\
    \n```bash\na=$(1 2 3)\neval -- \"$@\"\n```\n\nThis code is itself accompanied\
    \ by getopt and getopts to set $@ to the output of the aforementioned parsers,\
    \ however you can also use it to create a simple pop function that can operate\
    \ on variables silently and directly without having to store the result to the\
    \ original variable:\n\n```bash\nisnum()\n{\n  # is argument an integer?\n  local\
    \ re=\"^[0-9]+$\"\n  if [[ -n $1 ]]; then\n    [[ $1 == $re ]] && return 0\n \
    \ else\n    return 2\n  fi\n}\n```\n\n```bash\nisvar()\n{\n  if isnum \"$1\";\
    \ then\n    return 1\n  fi\n  local arr=$(eval echo -n \"$1\")\n  if [[ -n ${arr[@]}\
    \ ]]; then\n    return 0\n  fi\n}\n```\n\n```bash\npop()\n{\n  if [[ -z $@ ]];\
    \ then\n    return 1\n  fi\n  local var=\n  local isvar=0\n  local arr=()\n  if\
    \ isvar \"$1\"; then # let's check to see this is a variable or just a bare array\n\
    \    var=\"$1\"\n    isvar=1\n    arr=$(eval echo -n \"${1[@]}\") # if it is a\
    \ var, get its contents\n  else\n    arr=($@)\n  fi\n}\n```\n\n# we need to reverse\
    \ the contents of $@ so that we can shift the last element into nothingness\n\
    arr=$(echo \"${arr[@]}\" | awk '{for i=NF; i>1; --i} printf(\"%s\\n\", $i)}')\n\
    \n# set $@ to ${arr[@]} so that we can run shift against it.\neval set --\"${arr[@]}\"\
    \n\nshift remove the last element\n\n# put the array back to its original order\n\
    arr=$(echo \"$@\" | awk '{for i=NF; i>1; --i} printf(\"%s\\n\", $i)}')\n\n# echo\
    \ the contents for the benefit of using bare array arrays\necho \"${arr[@]}\"\n\
    \n```bash\nif ((isvar)); then\n    # set the contents of the original var to the\
    \ new modified array\n    eval --\"var=${arr[@]}\"\nfi\n```\n\n## Section 61.2:\
    \ Using Eval with Getopt\n\nWhile eval may not be needed for a pop like function,\
    \ it is however required whenever you use getopt:\n\nConsider the following function\
    \ that accepts -h as an option:\n\n```bash\nf() {\n    local __me__=$(getopt -o\
    \ 'h' -n __me__ -- \"$@\")\n    eval set --\"$@@\"\n    while true; do\n     \
    \   case \"$1\" in\n            -h)\n                echo \"LOLOLOL\"\n      \
    \          return 0\n                ;;\n            -)\n                shift\n\
    \                break\n                ;;\n        esac\n    done\n    echo \"\
    $@\"\n}\n```\n\nWithout eval set --$argv generates -h -- instead of the desired\
    \ (-h --) and subsequently enters an infinite loop\n\n-h -- doesn't match -- or\
    \ -h.\n"
