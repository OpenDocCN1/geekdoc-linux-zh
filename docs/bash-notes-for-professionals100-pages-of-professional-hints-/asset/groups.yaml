- md: "\nDollar-single-quote starts a string literal '...' like many other programming\
    \ languages, where backslash quotes the next character.\n\n```\necho $ '!\\#$&\\\
    (\\);*<=? @[\\\\|\\^'\\{\\}]~'\n#      AA      AA\n```\n\nDouble quotes \" delimit-literal\
    \ strings where only the characters \\ and ` retain their special meaning. These\
    \ characters need a backslash before them (note if backslash is followed by some\
    \ other character, the backslash remains). Double quotes are mostly useful when\
    \ including a variable or a command substitution.\n\n```\necho \"!\\#$&\\(\\);*<=?\
    \ @[\\\\|\\^'\\{\\}]~\"\n#      AA      AA\necho \"!\\#$&\\(\\);*<=? @[\\\\|\\\
    ^'\\{\\}]~\"\n#      AA      AA\n\\[\\] prints \\[\n```\n\nInteractively, beware\
    \ that ! triggers history expansion inside double quotes: \"!oops\" looks for\
    \ an older command containing \"\\oops\" doesn't do history expansion but keeps\
    \ the backslash. This does not happen in scripts.\n\n## Chapter 22: Conditional\
    \ Expressions\n\n### Section 22.1: File type tests\n\nThe -e conditional operator\
    \ tests whether a file exists (including all file types: directories, etc.).\n\
    \n```\nif [[ -e $filename ]]; then\n    echo \"$filename exists\"\nfi\n```\n\n\
    There are tests for specific file types as well.\n\n```\nif [[ -f $filename ]];\
    \ then\n    echo \"$filename is a regular file\"\nelif [[ -d $filename ]]; then\n\
    \    echo \"$filename is a directory\"\nelif [[ -p $filename ]]; then\n    echo\
    \ \"$filename is a named pipe\"\nelif [[ -s $filename ]]; then\n    echo \"$filename\
    \ is a named socket\"\nelif [[ -b $filename ]]; then\n    echo \"$filename is\
    \ a block device\"\nelif [[ -c $filename ]]; then\n    echo \"$filename is a character\
    \ device\"\nfi\n```\n\n```\nif [[ -L $filename ]]; then\n    echo \"$filename\
    \ is a symbolic link (to any file type)\"\nfi\n```\n\nFor a symbolic link, apart\
    \ from -L, these tests apply to the target, and return false for a broken link.\n\
    \n```\nif [[ -L $filename && -e $filename ]]; then\n    echo \"$filename exists\
    \ (may be a broken symbolic link)\"\nfi\n```\n\n### Section 22.2: String comparison\
    \ and matching\n\nString comparison uses the == operator over quoted strings.\
    \ The != operator negates comparison.\n\n```\nif [[ \"$string1\" == \"$string2\"\
    \ ]]; then\n    echo \"$string1 and $string2 are identical\"\nfi\nif [[ \"$string1\"\
    \ != \"$string2\" ]]; then\n    echo \"$string1 and $string2 are not identical\"\
    \nfi\n```\n\nIf the right-hand side is not quoted then it is a wildcard that $string1\
    \ is matched against.\n\n```\nstring='abc'\npattern1='a'\npattern2='x*'\nif [[\
    \ \"$string\" == $pattern1 ]]; then\n    # the test is true\necho \"The string\
    \ $string matches the pattern $pattern\"\nfi\nif [ \"$string\" != $pattern2 ];\
    \ then\n  # the test is false\necho \"The string $string does not match the pattern\
    \ $pattern\"\nfi\n```\n\nThe < and > operators compares the strings in lexicographic\
    \ order (there are no less-or-equal or greater-or-equal operators for strings).\n\
    \nThere are unary tests for the empty string.\n\n```\nif [[ -n \"$string\" ]];\
    \ then\n  echo \"$string is non-empty\"\nfi\nif [[ -z \"($string//)\" ]]; then\n\
    \  echo \"$string is empty or contains only spaces\"\nfi\nif [[ -z \"$string\"\
    \ ]]; then\n  echo \"$string is empty\"\nfi\n```\n\nAbove, the -z can mean $string\
    \ is unset, or it is set to an empty string. To distinguish between empty and\
    \ unset,\n\n```\nif [[ -n \"${string*}}\" ]]; then\n  echo \"$string is set, possibly\
    \ the empty string\"\nfi\nif [[ -n \"${string-x}\" ]]; then\n  echo \"$string\
    \ is either unset or set to a non-empty string\"\nfi\nif [[ -z \"${string+x}\"\
    \ ]]; then\n  echo \"$string is unset\"\nfi\nif [[ -z \"${string-x}\" ]]; then\n\
    \  echo \"$string is set to an empty string\"\nfi\n```\n\nwhere x is arbitrary.\
    \ In table form:\n\n| $string is: | unset | empty | non-empty |\n|-----------|-------|-------|------------|\n\
    | -z ($string) | true | true | false |\n| -z ($string-x) | true | false | false\
    \ |\n| -z ($string//x) | false | false | true |\n| -n ($string) | false | false\
    \ | true |\n| -n ($string-x) | false | true | true |\n| -n ($string-x) | true\
    \ | false | true |\n\nAlternatively, the state can be checked in a case statement:\n\
    \n```\ncase $(var+Svar) in\n  (x) echo empty;\n  (\"\") echo unset;\n  (*x![:blank:]])\
    \ echo non-blank;\n  (*) echo blank\n```\n\nWhere [:blank:] is locale specific\
    \ horizontal spacing characters (tab, space, etc.).\n\n### 22.3: Test on exit\
    \ status of a command\n\nExit status 0: success\nExit status other than 0: failure\n\
    \nTo test on the exit status of a command:\n\n```\nif command;then\n    echo 'success'\n\
    else\n    echo 'failure'\nfi\n```\n\n### 22.4: One liner test\n\nYou can do this\
    \ like:\n\n```bash\n[[ $s = 'something' && echo 'matched' || echo 'didn't match'\
    \ ]]\n[[ $s = 'something' && echo 'matched' || echo 'didn't match' ]]\n[[ $s !=\
    \ 'something' && echo 'didn't match' || echo 'matched' ]]\n[[ $s -eq 10 ]] &&\
    \ echo 'equal' || echo 'not equal' ]]\n[[ $s != 10 ]] && echo 'equal' || echo\
    \ 'not equal' ]]\n```\n\nOne liner test for exit status:\n\n```bash\ncommand &&\
    \ echo 'exited with 0' || echo 'non-exit'\ncmd || $1 && echo 'previous successful'\
    \ || echo 'one of them failed'\n```\n\n### 22.5: File comparison\n\n```bash\n\
    if [[ $file1 -eq $file2 ]]; then\n    echo '$file1 and $file2 are the same'\n\
    fi\n```\n\nSame file that modifying one of the files affects the other. Two files\
    \ can be the same if they have different names, if they are hard links, or if\
    \ they are symbolic links with the same target, or if one is symbolic link pointing\
    \ to the other. If two files have the same content, but they are distinct, then\
    \ - reports them.\n\nTo produce a human-readable list of differences between text\
    \ files, use diff.\n\n```bash\ndiff -u \"$file1\" \"$file2\"; then\n    echo '$file1\
    \ and $file2 have identical contents'\nelse\n    echo '$file1 and $file2 differ'\n\
    fi\n```\n\n### 22.6: File access tests\n\n```bash\nif [[ -r $filename ]]; then\n\
    \    echo \"$filename is a readable file\"\nfi\nif [[ -w $filename ]]; then\n\
    \    echo \"$filename is a writable file\"\nfi\nif [[ -x $filename ]]; then\n\
    \    echo \"$filename is an executable file\"\nfi\n```\n\nThese tests take permissions\
    \ and ownership into account to determine whether the script (or programs launched\
    \ from the script) can access the file. Beware of race conditions (TOCTOU): just\
    \ because the test succeeds doesn't mean it's still valid on the next line. It's\
    \ better to access a file and handle the error, rather than test first and then\
    \ have to handle the error anyway in case the file has changed in the meantime.\n\
    \n### 22.7: Numerical comparisons\n\nNumerical comparisons use -eq operators.\n\
    \n```bash\nif [[ $num1 -eq $num2 ]]; then\n    echo \"$num1 == $num2\"\nfi\nif\
    \ [[ $num1 -le $num2 ]]; then\n    echo \"$num1 <= $num2\"\nfi\n```\n\nThere are\
    \ six numeric operators:\n\n- -eq equal\n- -ne not equal\n- -le less or equal\n\
    - -lt less than\n- -ge greater or equal\n- -gt greater than\n\nNote that the <\
    \ and > operators compare strings, not numbers.\n\n```bash\nif [[ 9 -lt 10 ]];\
    \ then\n    echo \"9 is before 10 in numeric order\"\nfi\nif [[ 9 > 10 ]]; then\n\
    \    echo \"9 is after 10 in lexicographic order\"\nfi\n```\n\nThe two sides must\
    \ be written in decimal (or oct with a leading zero). Alternatively, use ((...))\
    \ arithmetic expression syntax, which performs integer calculations in a C/Java-like\
    \ syntax.\n\n```bash\nx=2\nif ((2*x == 4)); then\n    echo \"2 times 2 is 4\"\n\
    fi\n((x += 1))\necho \"2 plus 1 is $x\"\n```\n\n## Chapter 23: Scripting with\
    \ Parameters\n\n### Section 23.1: Multiple Parameter Parsing\n\nTo parse lists,\
    \ the preferred way of doing this is using a while loop, a case statement, and\
    \ shift. shift is used to pop the first parameter in the series, making what used\
    \ to be $2, now to be $1. This is useful for processing arguments one at a time.\n\
    \n```bash\n#!/bin/bash\n\n# Load the user defined parameters\nwhile [[ $# > 0\
    \ ]];\ndo\n    case \"$1\" in\n        -a|--valueA)\n            valA=\"$2\"\n\
    \            shift\n            ;;\n        -b|--valueB)\n            valB=\"\
    $2\"\n            shift\n            ;;\n        --help*)\n            echo \"\
    Usage:\"\n            echo \"--valueA <value>\"\n            echo \"--valueB <value>\"\
    \n            echo \"--help\"\n            exit 1\n            ;;\n    esac\n\
    \    shift\ndone\n```\n\n```bash\necho \"A: $valA\"\necho \"B: $valB\"\n```\n\n\
    Inputs and Outputs\n\n```\n$.multipleParams.sh --help\nUsage:\n    --valueA <value>\n\
    \    --valueB <value>\n    --help\n```\n\n```\n$.multipleParams.sh --valueB 2\n\
    A:\nB: 2\n```\n\n```\n$.multipleParams.sh --valueB 2 --valueA \"hello world\"\n\
    A: hello world\n```\n"
