  mdcn: "\n\n# 第 32 章：getopts：智能位置参数解析\n\n| 参数 | 详情 |\n| :--- | :--- |\n| optring\
    \ | 要识别的选项字符 |\n| name | 存储解析后选项的名称 |\n\n### 第 32.1 节：pingmap\n\n```bash\n#!/bin/bash\n\
    # 脚本名称：X 公司的系统管理员厌倦了单调的\n# ping 检测和 nmap 操作\n# 场景：他决定使用脚本来简化工作。\n# 他需要完成的任务是：\n\
    # 1. 以 5 次为最大计数次数 ping 给定的 IP 地址/域名。和/或者\n# 2. 检查给定 IP 地址/域名的特定端口是否开放。\n# 并对其进行映射以便救急。\n\
    # 选项简述：\n# n：用于 nmap\n# t：用于 ping\n# i：输入 IP 地址的选项\n# p：输入端口的选项\n# v：获取脚本版本的选项\n\
    \nwhile getopts 'nti:p:v' opt\n# 在开头加减号 (-)可以抑制无效选项的错误\ndo\ncase \"$opt\" in\n\
    \  'i')ip=\"${OPTARG}\"\n    ;\n  'p')port=\"${OPTARG}\"\n    ;\n  'n')nmap_yes=1;\n\
    \    ;\n  't')ping_yes=1;\n    ;\n  'v')echo \"pingmap version 1.0.0\"\n    ;\n\
    \  *) echo \"Invalid option $opt\"\n    echo \"Usage: $0\"\n    echo \"pingmap\
    \ [-n|t|i ip|p port] [v]\"\n    ;\nesac\ndone\nif [ -z \"$nmap_yes\" ] && [ \"\
    $nmap_yes\" -eq \"1\" ];\nthen\n  if [ -z \"$ip\" ] && [ -z \"$port\" ];\n  then\n\
    \    nmap -p \"$port\" \"$ip\"\n  fi\nfi\nif [ -z \"$ping_yes\" ] && [ \"$ping_yes\"\
    \ -eq \"1\" ];\nthen\n  if [ -z \"$ip\" ];\n  then\n    ping -c 5 \"$ip\"\n  fi\n\
    fi\n\nfi $(( OPTIND - 1 )) # 处理额外的参数\nif [ ! -z \"$@\" ]\nthen\necho Bogus arguments\
