    \n```bash\n$ find -name \"*.txt\"\n```\n\nTo find files/directories matching one\
    \ of many extensions, use -o flag:\n\n```bash\n$ find -name \"*.txt\" -o -name\
    \ \"*.sh\"\n```\n\nTo find all directories which begin with abc and end with one\
