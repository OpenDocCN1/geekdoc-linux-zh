    x86_64-redhat-linux-gnu

    ```


    # Section 36.24: $OSTYPE


    Returns information about the type of OS running on the machine, eg.


    ```

    $ $ echo $OSTYPE

    linux-gnu

    ```


    # Section 36.25: $PATH


    The path search for finding binaries for commands. Common examples include /usr/bin
    and /usr/local/bin.


    When a user or script attempts to run a command, the paths in $PATH are searched
    in order to find a matching file with execute permission.


    The directories in $PATH are separated by a : character.


    ```

    $ echo "$PATH"

    usr/kerberos/bin:/usr/local/bin:/usr/bin

    ```


    So, for example, given the above $PATH, if you type ls at the prompt, the shell
    will look for

    /usr/kerberos/bin/ls, then /usr/local/bin/ls, then /bin/ls, then /usr/bin/ls,
    in this order, concluding that there is no such command.


    # Section 36.26: $PPID


    The Process ID (pid) of the script or shell''s parent, meaning the process than
    invoked the current script or.


    ```

    $ echo $$

    13816

    $ echo $PPID

    13815

    ```


    # Section 36.27: $SECONDS


    The number of seconds a script has been running. This can get quite large if shown
    in the shell:


    ```

    $ echo $SECONDS

    98834

    ```'
  - '[PAGE 137]


    # Section 36.28: $SHELLOPTS


    a readily list of the options bash is supplied on startup to control its behaviour:


