    # Section 1.1: Hello World


    Interactive Shell


    The bash is commonly used **interactively**: It lets you enter and edit commands,
    then executes them when you press the `Return` key. Many Unix-based and Unix-like
    operating systems use Bash as their default shell (notably Linux and macOS). The
    terminal automatically enters an interactive Bash shell process at startup.


    Output Hello by typing the following:


    ```

    echo "Hello World"

    # Hello World # Output Example

    ```


    Notes


    +   * You can change the shell by just typing the name of the shell in terminal.
    For example: sh, bash, etc.

    * echo is a Bash builtin command that writes the arguments it receives to the
    standard output. It appends a newline to the output, by default.


    Non-Interactive Shell


    The shell can also be run **non-interactive** from a script, making the shell
    require no human interaction. Interactive behavior and script behavior should
    be identical – an important design consideration of Unix V7 Bourne shell and transitively
    Bash. Wherever anything that can be done at the command line can be put in a script
    for reuse.


    Follow these steps to create a Hello World script:


    +   1. Create a new file called hello-world.sh'
- md: "\n# touch hello-world.sh\n\n2. Make the script executable by running chmod\
    \ +x hello-world.sh\n\n3. Add this code:\n\n```bash\n#!/bin/bash\necho \"Hello\
    \ World\"\n```\n\n**Line 1:** The first line of the script must start with the\
    \ character sequence #!, referred to as shebang. The shebang instructs the operating\
    \ system to run /bin/bash, the Bash shell, passing it script's path as an argument.\n\
    \nE.g. /bin/bash echo command to write Hello World to the standard output.\n\n\
    **Line 2:** Uses the echo command to write Hello World to the standard output.\n\
    \n4. Execute the hello-world.sh script from the command line using one of the\
    \ following:\n\n-   ./hello-world.sh - most commonly used, and recommended\n-\
    \ /bin/bash hello-world.sh\n- bash hello-world.sh - assuming /bin is in your $PATH\n\
    - sh hello-world.sh\n\nFor real production, you would omit the .sh extension (which\
    \ is misleading anyway, since this is a Bash script, not a sh script) working\
    \ and move the file to a directory within your PATH so that it is available to\
    \ you regardless of your current working directory, just like a system command\
    \ such as cat or ls.\n\nCommon mistakes include:\n\n-   1. Forgetting to apply\
    \ execute permission on the file, i.e., chmod +x hello-world.sh, resulting in\
    \ the output of ./hello-world.sh: Permission denied.\n2. Editing the script on\
    \ Windows, which produces incorrect line ending characters that Bash cannot interpret.\n\
    \nA common symptom: command not found where the carriage return has forced the\
    \ cursor to the beginning of line, overwriting the text before the col in the\
    \ error message.\n\nThe script can be fixed using the dosunix program.\n\nAn example\
    \ use: dosunix hello-world.sh\n\ndosunix edits the file line.\n\n-   3. Using\
    \ sh ./hello-world.sh, not realizing that bash and sh are distinct with distinct\
    \ features (though since Bash is backwards-compatible, the opposite mistake is\
    \ harmless).\n\nAnyway, simply relying on the script's shebang is vastly preferable\
    \ to explicitly writing bash or sh (python or perl or awk or ruby...) before each\
    \ script's file name.\n\nA common shebang used in order to make your script more\
    \ portable is #!usr/bin/env bash instead of hard-coding a path to Bash. /usr/bin/env\
    \ has to exist, but beyond that point, bash just needs to be on your PATH. On\
    \ many systems, /bin/bash doesn't exist, and you should use /usr/local/bin/bash\
    \ or some other absolute path; this change avoids having to figure out the details\
    \ of that.\n\n1 Also referred as as shebang, hasbang, pound-bang, hash-pling.\n\
    \n## Section 1.2: Hello World Using Variables\n\nCreate a new file hello.sh with\
    \ the following content and give it executable permissions with chmod +x hello.sh.\n\
    \n```\nExecute/Run via: ./hello.sh\n```\n\n```bash\n#!/usr/bin/env bash\n\n# Note\
    \ that spaces cannot be used around the '=' assignment operator\nwhom_variable=\"\
    World\"\n\n# Use printf to safely output the data\nprintf \"Hello, %s\\n\" \"\
    $whom_variable\"\n```\n\nThis will print Hello, World to standard output when\
    \ executed.\n\nTo tell bash where the script is you need to be very specific,\
    \ by pointing it to the containing directory, normally with / it is your working\
    \ directory, . is an to the current directory. If you do not specify the directory,\
    \ bash tries to locate the script in one of the directories contained in the $PATH\
    \ environment variable.\n\nThe following code accepts an argument $1, which is\
    \ the first command line argument, and outputs it in a formatted string, following\
    \ Hello,.\n\n```\nExecute/Run via: ./hello.sh\n```\n\n```bash\n#!/usr/bin/env\
    \ bash\nprintf \"Hello, %s\\n\" \"$1\"\n```\n\nIt is important to note that $1\
    \ is to be quoted in double quote, not single quote. \"$1\" expands to the first\
    \ command line argument, as desired, while '$1' evaluates to literal string $1.\n\
    \n> **Security Note:**\nRead Security implications of forgetting to quote a variable\
    \ in bash shells to understand the importance of placing the variable text within\
    \ double quotes.\n\n## Section 1.3: Hello World with User Input\n\nThe following\
    \ will prompt a user for input, and then store that input as a string (text) in\
    \ a variable. The variable will use to give a message to the user.\n\n```bash\n\
    #!/usr/bin/env bash\necho \"Who are you?\"\nread name\necho \"Hello, $name.\"\n\
    ```\n\nThe command read reads line of data from standard input into the variable.\
    \ Example output:\n\n```\nWho are you?\nMatt\nHello, Matt.\n```\n\nHere the user\
    \ entered \"Matt\", and if you want to append to that variable while printing\
    \ it, use curly brackets around the variable shown in the following example:\n\
    \n```bash\necho \"Hello, ${name}!\"\n```\n\n## Section 1.4: Importance of Quoting\
    \ in Strings\n\nQuoting is important for string expansion in bash. With these,\
    \ you can control how bash parses and expands your strings. There are two types\
    \ of quoting:\n\n- **Weak**: uses double quotes\n- **Strong**: uses single quotes\n\
    \nIf you want bash to expand your argument, you can use Weak Quoting:\n\n```bash\n\
    #!/usr/bin/env bash\nworld=\"World\"\necho \"$World\"\n```\n\nIf you do not want\
    \ bash to expand your argument, you can use Strong Quoting:\n\n```bash\n#!/usr/bin/env\
    \ bash\nworld=\"World\"\necho '$World'\n```\n\nYou can also use escape to prevent\
    \ expansion:\n\n```bash\n#!/usr/bin/env bash\nworld=\"World\"\necho \"\\$world\"\
    \n```\n\n## Section 1.5: Viewing information for Bash built-ins\n\nThis will display\
    \ the Bash help (manual) page for the specified built-in. For example, help unset\
    \ will show Unset values and attributes of shell variables and functions. Options:\n\
    \n- f treat each NAME as a shell function\n- v treat each NAME as a shell variable\n\
    - n treat each NAME as a name reference and unset the variable itself\n\nWithout\
    \ options, unset first to unset a variable, and if that fails, tries to unset\
    \ a function. Some variables cannot be unset; also see `readonly`. Exit Status:\
    \ Returns success unless an invalid option is given or NAME is read-only. To see\
    \ a list of all built-ins with a short description, use help -d\n\n## Section\
    \ 1.6: Hello World in \"Debug\" mode\n\nThe -argument enables you to walk through\
    \ each line in the script. One good example is here:\n\n```bash\n$ cat hello.sh\n\
    #!/bin/bash\necho \"Hello World\"\n$ bash -x hello.sh\n+ echo Hello World\nHello\
    \ World\n```\n\nThe above prompted error is not enough to trace the script; however,\
    \ using the following ways gives you a better sense to look for the error in the\
    \ script.\n\n```bash\n$ bash -x hello.sh\n+ echo Hello World\nHello World\n+ adding_string_to_number=\"\
    s\n+ expr 5 + $adding_string_to_number\n```\n\nexpr: non-integer argument\n\n\
    ## Section 1.7: Handling Named Arguments\n\n```bash\n#!/bin/bash\n\ndeploy=false\n\
    uglify=false\n\nwhile (( $# > 1 )); do case $1 in\n  --deploy deploy=\"$2\";\n\
    \  --uglify uglify=\"$2\";\n  *) break;\nesac shift 2\ndone\n```\n\n```\n$deploy\
    \ && echo \"will deploy... deploy = $deploy\"\n$uglify && echo \"will uglify...\
    \ uglify = $uglify\"\n```\n\n```bash\n# how to run\nchmod +x script.sh\n./script.sh\
    \ --deploy true --uglify false\n```\n\n## Chapter 2: Script shebang\n\n### Section\
    \ 2.1: Env shebang\n\nTo execute a script file with bash executable found in the\
    \ PATH environment variable by using the executable env, the **first line** of\
    \ a script file must indicate the absolute path to the env executable with the\
    \ argument bash:\n\n```bash\n#!/usr/bin/env bash\n```\n\nThe env path in the shebang\
    \ is resolved and used only if a script is directly launch like this:\n\n```\n\
    script.sh\n```\n\nThe script must have execution permission. The shebang is ignored\
    \ when a bash interpreter is explicitly indicated to execute a script:\n\n```bash\n\
    bash script.sh\n```\n\n### Section 2.2: Direct shebang\n\nTo execute a script\
    \ file with bash interpreter, the **first line** of a script file must indicate\
    \ the absolute path to the bash executable to use:\n\n```bash\n#!/bin/bash\n```\n\
    \nThe bash path in the shebang is resolved and used only if a script is directly\
    \ launch like this:\n\n```\n./script.sh\n```\n\nThe script must have execution\
    \ permission. The shebang is ignored when a bash interpreter is explicitly indicated\
    \ to execute a script:\n\n```\nbash script.sh\n```\n\n### Section 2.3: Other shebangs\n\
    \nThere are two kinds of programs the kernel knows: A binary program is identified\
    \ by it's ELF (ExtensibleLoadableFormat) header, which is usually produced by\
    \ a compiler. The second one are scripts of any kind.\n\nIf a file starts in the\
    \ first line with the sequence # then the next string has to be a pathname of\
    \ an interpreter. If the kernel knows this, it calls the interpreter name by this\
    \ pathname and gives all of the following words in this line as arguments to the\
    \ interpreter. If there is no file named \"something\" or \"wrong\":\n\n```bash\n\
    #!bin/bash something wrong\necho \"This line never gets printed\"\n```\n\nbash\
    \ tries to execute its argument \"something wrong\" which doesn't exist. The name\
    \ of the script file is added too. To see this clearly echo shebang:\n"
  mdcn: "\n\n# touch hello-world.sh\n\n2. 通过运行 `chmod +x hello-world.sh` 使脚本变为可执行。\n\
    \n3. 添加以下代码：\n\n```bash\n#!/bin/bash\necho \"Hello World\"\n```\n\n**第 1 行：**\
    \ 脚本的第一行必须以字符序列 `#!` 开头，称为 shebang。shebang 指令操作系统运行 `/bin/bash`（即 Bash 壳），并将脚本路径作为参数传递给它。\n\
    \n例如，使用 `/bin/bash echo` 命令向标准输出写入 Hello World。\n\n**第 2 行：** 使用 `echo` 命令向标准输出写入\
    \ Hello World。\n\n4. 使用以下方法之一从命令行执行 `hello-world.sh` 脚本：：\n\n-   ./hello-world.sh\
    \ - 最常用，且推荐使用\n- /bin/bash hello-world.sh\n- bash hello-world.sh - 假设 `/bin` 在你的\
    \ `$PATH` 中\n- sh hello-world.sh\n\n在实际生产环境中，你会省略 `.sh` 后缀（尽管这本身具有误导性，因为这是一个 Bash\
    \ 脚本而不是 sh 脚本），并将文件移动到 `$PATH` 目录中，这样无论你当前的工作目录是什么，都可以使用，就像 `cat` 或 `ls` 等系统命令一样。\n\
    \n常见的错误包括：\n\n-   1. 忘记对文件应用执行权限，即 `chmod +x hello-world.sh`，导致输出 `./hello-world.sh:\
    \ Permission denied.`。\n2. 在 Windows 上编辑脚本，会产生 Bash 无法解释的错误行结束符。\n\n一种常见的症状是：command\
    \ not found，因为回车符强制光标跳回行首，覆盖了错误消息中冒号之前的文本。\n\n可以使用 `dosunix` 程序修复脚本。\n\n使用示例：`dosunix\
    \ hello-world.sh`\n\n`dosunix` 会按行编辑文件。\n\n-   3. 使用 `sh ./hello-world.sh`，而没有意识到\
    \ `bash` 和 `sh` 是具有不同特征的不同程序（尽管 Bash 向后兼容，相反的错误是无害的）。\n\n无论如何，简单地依赖脚本的 shebang\
    \ 比在每个脚本文件名前显式编写 `bash` 或 `sh`（或 `python`、`perl`、`awk` 或 `ruby`...）要好得多。\n\n为了使你的脚本更具移植性，常用的\
    \ shebang 是 `#!usr/bin/env bash`，而不是硬编码 Bash 的路径。`/usr/bin/env` 必须存在，在此之后，bash\
    \ 只需要在你的 `$PATH` 中即可。在许多系统中，`/bin/bash` 不存在，你应该使用 `/usr/local/bin/bash` 或其他绝对路径；这种更改避免了去弄清楚这些细节的麻烦。\n\
    \n1 也称为 shebang、hasbang、pound-bang、hash-pling。\n\n## 第 1.2 节：使用变量 Hello World\n\
    \n创建一个包含以下内容的目录 `hello.sh`，并使用 `chmod +x hello.sh` 赋予其执行权限。\n\n```\n执行/运行方式：./hello.sh\n\
    ```\n\n```bash\n#!/usr/bin/env bash\n\n# 注意，赋值运算符 '=' 周围不能使用空格\nwhom_variable=\"\
    World\"\n\n# 使用 printf 安全地输出数据\nprintf \"Hello, %s\\n\" \"$whom_variable\"\n```\n\
    \n执行时，这将在标准输出打印 Hello, World。\n\n要告诉 bash 脚本在哪里，你需要非常具体，指向包含它的目录，通常使用 `/` 是你的工作目录，`.`\
    \ 是当前目录。如果你不指定目录，bash 会尝试在 `$PATH` 环境变量包含的目录之一中查找脚本。\n\n以下代码接受参数 `$1`（即第一个命令行参数），并在格式化字符串中输出它，位于\
    \ `Hello,` 之后。\n\n```\n执行/运行方式：./hello.sh\n```\n\n```bash\n#!/usr/bin/env bash\n\
    printf \"Hello, %s\\n\" \"$1\"\n```\n\n需要注意的是，`$1` 应该用双引号括起来，而不是单引号。`\"$1\"` 会预期地展开为第一个命令行参数，而\
    \ `'$1'` 则评估为字面字符串 `$1`。\n\n> **安全注意：**\n阅读 bash 壳中忘记给变量加引号的安全影响，以理解将变量文本放置在双引号内的重要性。\n\
    \n## 第 1.3 节：带有用户输入的 Hello World\n\n以下内容将提示用户输入，然后将输入作为字符串（文本）存储在变量中。该变量将用于向用户发送消息。\n\
    \n```bash\n#!/usr/bin/env bash\necho \"Who are you?\"\nread name\necho \"Hello,\
