    Bash 内置的 `extglob` 选项可以扩展通配符的匹配能力


    ```bash

    $ shopt -s extglob

    ```


    以下子模式由有效的扩展通配符组成：


    - `?(pattern-list)` - 匹配给定模式的零次或一次

    - `*+(pattern-list)` - 匹配给定模式的零次或多次

    - `*|pattern-list)` - 匹配给定模式的一次或多次

    - `@(pattern-list)` - 匹配给定模式中的其中一个

    - `!(pattern-list)` - 匹配给定模式之外的任何内容


    `pattern-list` 是一个由 `|` 分隔的通配符列表


    ```bash

    $ echo *([r-t])acy

    stacy tracy

    ```


    ```bash

    $ echo *([r-t]|m)acy

    macy stacy tracy

    ```


    ```bash

    $ echo ?([a-z])acy

    macy

    ```


    `pattern-list` 本身可以是另一个嵌套的扩展通配符。在上面的示例中，我们看到通过 `*([r-t])` 匹配 tracy 和 stacy。这个扩展通配符本身可以使用否定通配符
    `!(pattern-list)` 内部，以匹配 macy


    ```bash

    $ echo !(*([r-t]))acy

    macy

    ```


    它匹配任何不以零或多次字母 `r`、`s` 和 `t` 开头的内容，因此留下了 macy 作为可能的匹配项。


