  - "[PAGE 96]\n\n# Chapter 23: Scripting with Parameters\n\n# Section 23.1: Multiple\
    \ Parameter Parsing\n\nTo parse lists, the preferred way of doing this is using\
    \ a while loop, a case statement, and shift.\nshift is used to pop the first parameter\
    \ in the series, making what used to be $2, now to be $1. This is useful for processing\
    \ arguments one at a time.\n\n```\n#!/bin/bash\n\n# Load the user defined parameters\n\
    while [[ $# > 0 ]];\ndo\n    case \"$1\" in\n        -a|--valueA)\n          \
    \  valA=\"$2\"\n            shift\n            ;\n        -b|--valueB)\n     \
    \       valB=\"$2\"\n            shift\n            ;\n        --help*)\n    \
    \        echo \"Usage:\"\n            echo \"--valueA \\value\"\n            echo\
    \ \"--valueB \\value\"\n            echo \"--help\"\n            exit 1\n    \
    \        ;\n    esac\ndown\n```\n\n```\necho \"A: $valA\"\necho \"B: $valB\"\n\
    ```\n\nInputs and Outputs\n\n```\n$./multipleParams.sh --help\nUsage:\n    --valueA\
    \ \"value\"\n    --valueB \"value\"\n    --help\n```\n\n```\n$./multipleParams.sh\
    \ --valueB 2\nA:\nB: 2\n```\n\n```\n$./multipleParams.sh --valueB 2 --valueA \"\
    hello world\"\nA: hello world\n```"
- md: "\n## Section 23.2: Argument parsing using a for loop\n\nA simple example which\
    \ provides the options:\n\n| Opt | Alt. Opt | Details |\n| - | - | - |\n| -h |\
    \ --help | Show help |\n| -v | --version | Show info |\n| -dr path | --doc-root\
    \ | An option which takes a secondary parameter (a path) |\n| -i | --install |\
    \ A boolean option (true/false) |\n| -* | | Invalid option |\n\n```bash\n#!/bin/bash\n\
    dr=''\ninstall=false\nfor op in \"$@\"; do\n  if $skip; then skip=false;continue;\
    \ fi\n  case $op in\n    --version)\n      echo \"$ver_info\"\n      shift\n \
    \     exit 0\n      ;;\n    -h|--help)\n      echo \"$help\"\n      shift\n  \
    \    exit 0\n      ;;\n    -dr|--doc-root)\n      shift\n      if [ \"$1\" !=\
    \ \"\" ]; then\n        dr=\"${1///\\/}\"\n        shift\n        skip=true\n\
    \      else\n        echo \"E: Arg missing for -dr option\"\n        exit 1\n\
    \      fi\n      ;;\n    -i|--install)\n      install=true\n      shift\n    \
    \  ;;\n    *)\n      echo \"E: Invalid option: $1\"\n      shift\n      exit 1\n\
    \      ;;\n  esac\ndone\n```\n\n## Section 23.3: Wrapper script\n\nWrapper script\
    \ is a script that wraps another script or command to provide extra functionalities\
    \ or just to make something tedious.\n\nFor example, the actual egrep in GNU/Linux\
    \ system is being replaced by a wrapper named egrep. This is how it looks:\n\n\
    ```sh\n#!/bin/sh\nexec grep -E \"$@\"\n```\n\nSo, you run egrep in such systems,\
    \ you are actually running grep -E with all the arguments forwarded.\n\nIn general\
    \ case, if you want to run an script/command exmp with another script mexmp then\
    \ the wrapper mexmp script will look like:\n\n```sh\n#!/bin/sh\nexmp \"$@\" #\
    \ Add other options \"$@\"\n# or\n#full/path/to/exmp \"$@\"\n```\n\n## Section\
    \ 23.4: Accessing Parameters\n\nWhen executing a Bash script, parameters passed\
    \ into the script are named in accordance to their position: $1 is the name of\
    \ the first parameter, $2 is the name of the second parameter, and so on.\n\n\
    A missing parameter simply evaluates to an empty string. Checking for the existence\
    \ of a parameter can be done by as:\n\n```bash\nif [ -z \"$1\" ]; then\necho \"\
    No argument supplied\"\nfi\n```\n\n## Getting all the parameters\n\n$ and $* are\
    \ ways of interacting with all the script parameters. Referencing the Bash man\
    \ page, we see that:\n\n- $* Expands to the positional parameters, starting from\
    \ one. When the expansion occurs within double quotes, it expands to a single\
    \ word with the value of each parameter separated by the first character of the\
    \ IFS special variable.\n- $@ Expands to the positional parameters, starting from\
    \ one. When the expansion occurs within double quotes, each parameter expands\
    \ to a separate word.\n\n## Getting the number of parameters\n\n$# gets the number\
    \ of parameters passed into a script. A typical use case would be to check if\
    \ the appropriate arguments are passed:\n\n```bash\nif [ $# -eq 0 ]; then\necho\
    \ \"No arguments supplied\"\nfi\n```\n\n## Example 1\n\nLoop through all arguments\
    \ and check if they are:\n\n```bash\nfor item in \"$@\"\ndo\n  if [[ -f $item\
    \ ]]; then\n    echo \"$item is a file\"\n  fi\ndone\n```\n\nGoalKicker.com –\
    \ Bash Notes for Professionals\n\n## Example 2\n\nLoop through all arguments and\
    \ check if they are files:\n\n```bash\nfor (( i = 1; i <= $#; i++ ))\ndo\n  item=${@:$i}\n\
    \n  if [[ -f $item ]]; then\n    echo \"$item is a file\"\n  fi\ndone\n```\n\n\
    ## Section 23.5: Split string into an array in Bash\n\nLet's say we have a String\
    \ parameter and we want to split it by comma\n\n```bash\nmy_param=\"foo, bar,bash\"\
    \n```\n\nTo split this string by comma we can use:\n\n```bash\nIFS=',' read -r\
    \ array <<< \"$my_param\"\n```\n\nHere, IFS is a special variable called Internal\
    \ field separator which defines the character or characters used to separate a\
    \ parameter into tokens for some operations.\n\nTo access an individual element:\n\
    \n```bash\necho \"${array[0]}\"\n```\n\nTo iterate over the elements:\n\n```bash\n\
    for element in \"${array[@]}\"\ndo\n  echo \"$element\"\ndone\n```\n\nTo get both\
    \ the index and the value:\n\n```bash\nfor index in \"${!array[@]}\"\ndo\n  echo\
    \ \"$index ${array[index]}\"\ndone\n```\n\n## Chapter 24: Bash history substitutions\n\
    \n### Section 24.1: Quick Reference\n\nInteraction with the history\n\n```bash\n\
    # List all previous commands\nhistory\n\n# Clear the history, useful if you entered\
    \ a password by accident\nhistory -c\n```\n\n**Event designators**\n\n```bash\n\
    # Expands to line n of bash history\n!n \n\n# Expands to last command\n!!\n\n\
    # Expands to last command starting with \"text\"\n!text\n\n# Expands to last command\
    \ containing \"text\"\n!?text\n\n# Expands to command n lines ago\n!-n\n\n# Expands\
    \ to last command with first occurrence of \"foo\"\n!foo\n\n# Expands to last\
    \ command with first occurrence of \"foo\"\n!^\n\n# Expands to last command with\
    \ first occurrence of \"foo\"\n!*\n\n# Expands to last command with first occurrence\
    \ of \"foo\"\n!$\n\n# Expands to last command with first occurrence of \"foo\"\
    \n!:\n\n# Expands to last command with first occurrence of \"foo\"\n!,\n\n# Expands\
    \ to last command with first occurrence of \"foo\"\n!.\n\n# Expands to last command\
    \ with first occurrence of \"foo\"\n!/\n\n# Expands to last command with first\
    \ occurrence of \"foo\"\n!|\n\n# Expands to last command with first occurrence\
    \ of \"foo\"\n!?\n\n# Expands to last command with first occurrence of \"foo\"\
    \n!]\n\n# Expands to last command with first occurrence of \"foo\"\n!}\n\n# Expands\
    \ to last command with first occurrence of \"foo\"\n![\n\n# Expands to last command\
    \ with first occurrence of \"foo\"\n!<\n\n# Expands to last command with first\
    \ occurrence of \"foo\"\n!>\n\n# Expands to last command with first occurrence\
    \ of \"foo\"\n!=\n\n# Expands to last command with first occurrence of \"foo\"\
    \n!~\n\n# Expands to last command with first occurrence of \"foo\"\n!^\n\n# Expands\
    \ to last command with first occurrence of \"foo\"\n!'\n\n# Expands to last command\
    \ with first occurrence of \"foo\"\n!\"\"\n\n# Expands to last command with first\
    \ occurrence of \"foo\"\n!`\n\n# Expands to last command with first occurrence\
    \ of \"foo\"\n!$\n\n# Expands to last command with first occurrence of \"foo\"\
    \n!\n\nFor example, if you recently executed man 5 crontab, you can find it quickly\
    \ by starting to type `cr`. The `cr` is the string I type so far. This is an incremental\
    \ search, so as you continue typing, the search result gets updated to match the\
    \ most recent command. Press the left right arrow keys to edit the command before\
    \ running it, or the enter key to run it.\n\n**Word designators**\n\nThese are\
    \ separated by : they refer to:\n\n```bash\n# Expands to command n lines ago\n\
    !:-n\n\n# Expands to command n lines ago\n!:-s\n\n# Expands to command n lines\
    \ ago\n!:-w\n\n# Expands to command n lines ago\n!:-f\n\n# Expands to command\
    \ n lines ago\n!:-d\n\n# Expands to command n lines ago\n!:-a\n\n# Expands to\
    \ command n lines ago\n!:-g\n\n# Expands to command n lines ago\n!:-h\n\n# Expands\
    \ to command n lines ago\n!:-j\n\n# Expands to command n lines ago\n!:-k\n\n#\
    \ Expands to command n lines ago\n!:-l\n\n# Expands to command n lines ago\n!:-m\n\
    \n# Expands to command n lines ago\n!:-x\n\n# Expands to command n lines ago\n\
    !:-y\n\n# Expands to command n lines ago\n!:-z\n\n# Expands to command n lines\
    \ ago\n!:-```\n\nBy default the search finds the most recent command matching\
    \ the pattern. You may press it repeatedly until you find the desired command.\n\
    \n**Modifiers**\n\nThese modify the event:\n\n```bash\n# Replace the first occurrence\
    \ of the string\n:s/foo/bar\n\n# Replace all occurrences of the string\n:gs/foo/bar\n\
    \n# Replace the last occurrence of the string\n:sc/foo/bar\n\n# Replace the last\
    \ occurrence of the string\n:sc/foo/bar\n\n# Delete the first occurrence of the\
    \ string\n:s/foo//\n\n# Delete all occurrences of the string\n:gs/foo//\n\n# Delete\
    \ the last occurrence of the string\n:sc/foo//\n\n# Delete the last occurrence\
    \ of the string\n:sc/foo//\n\n# Insert before the first occurrence of the string\n\
    :s/^/bar\n\n# Insert before all occurrences of the string\n:gs/^/bar\n\n# Insert\
    \ before the last occurrence of the string\n:sc/^/bar\n\n# Insert before the last\
    \ occurrence of the string\n:sc/^/bar\n\n# Append after the first occurrence of\
    \ the string\n:s/$/bar\n\n# Append after all occurrences of the string\n:gs$//bar\n\
    \n# Append after the last occurrence of the string\n:sc$//bar\n\n# Append after\
    \ the last occurrence of the string\n:sc$//bar\n\n# Replace the first word matching\
    \ the string\n:s/foo*/bar/\n\n# Replace all words matching the string\n:gs/foo*/bar/\n\
    \n# Replace the last word matching the string\n:sc/foo*/bar/\n\n# Replace the\
    \ last word matching the string\n:sc/foo*/bar/\n\n# Delete the first word matching\
    \ the string\n:s/foo//\n\n# Delete all words matching the string\n:gs/foo//\n\n\
    # Delete the last word matching the string\n:sc/foo//\n\n# Delete the last word\
    \ matching the string\n:sc/foo//\n```\n\nNote that in the last example we did\
    \ not get ping, a great game because the last argument passed to the previous\
    \ command was pong, we can avoid issue like this by adding quotes. Continuing\
    \ with the example, our last argument was game:\n\n```bash\n$ echo \"it is $ time\"\
    \nit is game time\n$ echo \"hooray, !!\"\nhooray, it is game time!\n```\n\nIf\
    \ HISTCONTROL contains either ignorespace, you can prevent commands from being\
    \ stored in history by prepending them with a space.\n\n### Section 24.2: Repeat\
    \ the previous command with a substitution\n\nDefault the search finds the most\
    \ recent command matching the pattern. You may press it repeatedly until you find\
    \ the desired command.\n\n### Section 24.4: Swift to newly created directory\n\
    \n```bash\n$ mkdir backup_download_directory && cd !:#1\nmkdir backup_download_directory\
    \ && cd backup_download_directory\n```\n\nThis subtitle the argument of the command\
    \ line. In the example !:#1 is replaced with the first argument, i.e. backup_download_directory.\n\
    \n### Section 24.5: Using !$\n\n```bash\n$ echo ping\nping\n$ echo !$\nping\n\
    ```\n\nYou can also build upon the repetition\n\n```bash\n$ echo !$ pong\nping\
    \ pong\n$ echo,$ a great game\npong, a great game\n```\n\nNotice that in the last\
    \ example we did not get ping, a great game because the last argument passed to\
    \ the previous command was pong, we can avoid issue like this by adding quotes.\n"
  mdcn: "\n\n## 第 23.2 ：使用 for 循环进行参数解析\n\n这是一个提供选项的简单示例：\n\n| 选项 | 备选项 | 详情 |\n|\
    \ - | - | - |\n| -h | --help | 显示帮助 |\n| -v | --version | 显示信息 |\n| -dr path |\
    \ --doc-root | 一个接收二级参数（路径）的选项 |\n| -i | --install | 布尔选项（true/false） |\n| -*\
    \ | | 无效选项 |\n\n```bash\n#!/bin/bash\ndr=''\ninstall=false\nfor op in \"$@\";\
    \ do\n  if $skip; then skip=false;continue; fi\n  case $op in\n    --version)\n\
    \      echo \"$ver_info\"\n      shift\n      exit 0\n      ;;\n    -h|--help)\n\
    \      echo \"$help\"\n      shift\n      exit 0\n      ;;\n    -dr|--doc-root)\n\
    \      shift\n      if [ \"$1\" != \"\" ]; then\n        dr=\"${1///\\/}\"\n \
    \       shift\n        skip=true\n      else\n        echo \"E: Arg missing for\
    \ -dr option\"\n        exit 1\n      fi\n      ;;\n    -i|--install)\n      install=true\n\
    \      shift\n      ;;\n    *)\n      echo \"E: Invalid option: $1\"\n      shift\n\
    \      exit 1\n      ;;\n  esac\ndone\n```\n\n## 第 23.3 ：包装脚本\n\n包装脚本是一个封装另一个脚本或命令的脚本，用于提供额外功能或仅仅是为了让麻烦的操作变得简单。\n\
    \n例如，GNU/Linux 系统中的实际 egrep 被一个名为 egrep 的包装脚本取代。它的样子如下：\n\n```sh\n#!/bin/sh\n\
    exec grep -E \"$@\"\n```\n\n因此，你在这些系统中运行 egrep 时，实际上是在运行转发了所有参数的 grep -E。\n\n\
    通常情况下，如果你想用另一个脚本 mexmp 来运行脚本/命令 exmp，那么包装脚本 mexmp 看起来如下：\n\n```sh\n#!/bin/sh\n\
    exmp \"$@\" # 添加其他选项 \"$@\"\n# 或者\n#full/path/to/exmp \"$@\"\n```\n\n## 第 23.4\
    \ ：访问参数\n\n在执行 Bash 脚本时，传入脚本的参数根据其位置命名：$1 是第一个参数的名称，$2 是第二个参数的名称，依此类推。\n\n缺失的参数将简单地评估为空字符串。可以通过以下方式检查参数是否存在：\n\
    \n```bash\nif [ -z \"$1\" ]; then\necho \"No argument supplied\"\nfi\n```\n\n\
    ## 获取所有参数\n\n$ 和 $* 是与所有脚本参数交互的方法。参考 Bash 手页，我们看到：\n\n- $* 展开为从位置 1 开始的位置参数。当在双引号内进行展开时，它将展开为ers单个单词，每个参数的值由\
    \ IFS 特殊变量的第一个字符分隔。\n- $@ 展开为从位置 1 开始的位置参数。当在双引号内进行展开时，每个参数将展开为一个独立的单词。\n\n##\
    \ 获取参数数量\n\n$# 获取传递给脚本的参数数量。一个典型的用例是检查是否传递了适当参数：\n\n```bash\nif [ $# -eq 0 ];\
    \ then\necho \"No arguments supplied\"\nfi\n```\n\n## 示例 1\n\n遍历所有参数并检查它们是否为：\n\
    \n```bash\nfor item in \"$@\"\ndo\n  if [[ -f $item ]]; then\n    echo \"$item\
    \ is a file\"\n  fi\ndone\n```\n\nGoalKicker.com – 专业人士 Bash Notes\n\n## 示例 2\n\
    \n遍历所有参数并检查它们是否为文件：\n\n```bash\nfor (( i = 1; i <= $#; i++ ))\ndo\n  item=${@:$i}\n\
    \n  if [[ -f $item ]]; then\n    echo \"$item is a file\"\n  fi\ndone\n```\n\n\
    ## 第 23.5 ：在 Bash 中将字符串拆分为数组\n\n假设我们有一个字符串参数，并想通过逗号将其拆分\n\n```bash\nmy_param=\"\
    foo, bar,bash\"\n```\n\n为了通过逗号拆分此字符串，可以使用：\n\n```bash\nIFS=',' read -r array <<<\
    \ \"$my_param\"\n```\n\n在这里，IFS 是一个特殊的变量，称为内部字段分隔符（Internal field separator），它定义了用于将参数拆分为操作标记的字符或字符。\n\
    \n访问单个元素：\n\n```bash\necho \"${array[0]}\"\n```\n\n遍历元素：\n\n```bash\nfor element\
    \ in \"${array[@]}\"\ndo\n  echo \"$element\"\ndone\n```\n\n同时获取索引和值：\n\n```bash\n\
    for index in \"${!array[@]}\"\ndo\n  echo \"$index ${array[index]}\"\ndone\n```\n\
    \n## 第 24 章：Bash 历史记录替换\n\n### 第 24.1 节：快速参考\n\n与历史记录交互\n\n```bash\n# 列出所有之前的命令\n\
