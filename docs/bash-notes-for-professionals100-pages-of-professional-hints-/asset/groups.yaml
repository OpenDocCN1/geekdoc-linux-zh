    # Chapter 33: Debugging\n\n### Section 33.1: Checking the syntax of a script with\
    \ \"-n\"\n\nThe -n flag enables you to check the syntax of a script without having\
    \ to execute it:\n\n```bash\nbash -n testscript.sh\ntestscript.sh: line 128: unexpected\
    \ EOF while looking for matching '\"'\ntestscript.sh: line 138: syntax error:\
    \ unexpected end of file\n```\n\n### Section 33.2: Debugging using bashdb\n\n\
    Bashdb is similar to gdb, in that you can do things like breakpoints at a line\
    \ or at a function, print content of variables, you can restart script execution\
    \ and more.\n\nYou can normally install it with your package manager, for example\
    \ on Fedora:\n\n```bash\nsudo dnf install bashdb\n```\n\nOr get it from the homepage.\
    \ Then you can run it with your script as a parameter:\n\n```bash\nbashdb <YOUR\
    \ SCRIPT>\n```\n\nHere are a few commands to get started:\n\n- l show local lines,\
    \ press l again to scroll down\n- step to next line\n- print VAR echo out content\
    \ of variable\n- restart reruns bashcript, it reloads it prior to execution.\n\
    - eval evaluate some custom command, ex: eval echo hi\n- set breakpoint on some\
    \ line\n- continue until some breakpoint\n- i b info on break points\n- delete\
    \ breakpoint at #\n- shell a sub-shell in the middle of execution, this is handy\
    \ for manipulating variables\n\nFor more information, I recommend consulting the\
    \ manual: http://www.smith.plus/outlines/manual/bashdb.html\nSee also homepage:\
    \ http://bashdb.sourceforge.net/\n\n### Section 33.3: Debugging a bash script\
    \ with \"-x\"\n\nUse \"-x\" to enable debug output of executed lines. It can run\
    \ on an entire session or script, or programmatically within a script.\n\n```bash\n\
    bash -x myscript.sh\n```\n\nOr\n\n```bash\n$ --debug myscript.sh\n```\n\nTurn\
    \ on debugging within a bash script. It may optionally turned back on, though\
    \ debug output automatically reset when script exits.\n\n```bash\n#!/bin/bash\n\
    set -x # Enable debugging\n# some code here\nset +x # Disable debugging.\n```\n\
    \n# Chapter 34: Pattern matching and regular expressions\n\n### Section 34.1:\
    \ Get captured groups from a regex match against a string\n\nOutput:\n\nI am a\
    \ simple string with digits 1234\nI am a simple string\n\n### Section 34.2: Behaviour\
    \ when glob does not match anything\n\nPreparation:\n\n```bash\nmkdir globbing\n\
    cd globbing\nmkdir -p folder/{sub,another}/folder/content/deepfolder/\ntouch stacy\
    \ tracy with space folder/{sub,another}/folder/content/deepfolder/\n.hiddenfile\n\
    ```\n\nIn case the glob does not match the result is determined by options nullglob\
    \ and failglob. If neither are set, Bash will return the glob itself if nothing:\n\
    \n```bash\n$ echo no*match\nno*match\n```\n\nIf nullglob is activated then nothing\
    \ (null) is returned:\n\n```bash\n$ set nullglob\necho no*match\n```\n\nIf failglob\
    \ is activated then an error message is returned:\n\n```bash\n$ set failglob\n\
    echo no*match\nbash: no match: no*match\n```\n\nNotice, the failglob option supersedes\
    \ nullglob, i.e. if nullglob and failglob are both set, an error is returned.\n\
    \n### Section 34.3: Check if a string matches a regular expression\n\nVersion\
    \ ≥ 3.0\n\nCheck if a string consists in exactly 8 digits:\n\nOutput:\n\nI am\
    \ a string with some digits 102434\n\nInstead of assigning the regex to a variable\
    \ ($pat) we could also do:\n\n```bash\n[[ $s ~ ^[0-9]+[0-9]+ ]]\n```\n\nExplanation:\n\
    \n- [[ $s ~ $pat ]] performs the regex matching\n- The captured groups the match\
    \ are available in an array named BASH_REMATCH\n- The 0th index in BASH_REMATCH\
    \ array is the total match\n- The th index in BASH_REMATCH array is the captured\
    \ group, where i = 1, 2, 3 ...\n\n### Section 34.5: The * glob\n\nPreparation:\n\
    \n```bash\nmkdir globbing\ncd globbing\nmkdir -p folder/(sub,another)/folder/content/deepfolder/\n\
    touch many story \"file with space\" folder/(sub,another)/folder/content/deepfolder/\n\
    .hidden\n```\n\nThe asterisk * is probably the most commonly used glob. It simply\
    \ matches any String:\n\n```\n$ echo *\nacy stacy tracy\n```\n\nA single * will\
    \ not match files and folders that reside in subfolders:\n\n```bash\n$ echo *\n\
