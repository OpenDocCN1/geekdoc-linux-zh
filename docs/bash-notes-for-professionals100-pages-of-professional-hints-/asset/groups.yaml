    # Section 36.32: $SHLVL


    When the command is executed a new shell is opened. The $SHLVL environment variable
    holds the

    shell levels the current shell is running on top of.'
  - '[PAGE 138]


    in a new terminal window, executing the following command will produce different
    results based on the Linux distribution in use.


    echo $SHLVL


    Using Fedora 25, the output is "3". This indicates that when opening a new shell,
    an initial bash command executes and performs a task. The initial bash command
    executes a child process (another bash command) which, in turn, executes a final
    bash command to open the new shell. When the new shell opens, it is running as
    a child process of 2 other shell processes, hence the output of "3".


    In the following example (user is running Fedora 25), the output of $SHLVL in
    a new shell will be set to "3". As each bash command is executed, SHLVL increases
    by one.


    ```

    $ echo $SHLVL

    3

    $ bash

    $ $ echo $SHLVL

    4

    $ $ bash

    $ $ echo $SHLVL

    5

    ```


    One can see that the ''bash'' command (or executing a bash script) opens a new
    shell. In comparison, sourcing a script runs the code in the current shell.


    # test1.sh


    ```

    #!/usr/bin/env bashnecho "Hello from test1.sh. My shell level is $SHLVL"

    source "test2.sh"

    ```


    # test2.sh


    ```

    #!/usr/bin/env bash

    echo "Hello from test2.sh. My shell level is $SHLVL"

    ```


    # run.sh


    ```

    #!/usr/bin/env bash

    echo "Hello from run.sh. My shell level is $SHLVL"

    ./test1.sh

    ```


    Execute:


    ```

    chmod +x test1.sh && chmod +x run.sh

    ./run.sh

    ```


    # Output:


    ```

    Hello from run.sh. My shell level is 4

    Hello from test1.sh. My shell level is 5

    Hello from test2.sh. My shell level is 5

    ```'
- md: "\n## Section 36.33: $UID\n\nA read only variable that stores the users' ID\
    \ number:\n\n```\n~> echo $UID\n12345\n```\n\n## Chapter 37: Job Control\n\n###\
    \ Section 37.1: List background processes\n\n```\n$ jobs\n[1] Running      sleep\
    \ 500 & (wd ~)\n[2]- Running      sleep 600 & (wd ~)\n[3]+ Running      ./Fritzing\
    \ &\n```\n\nFirst few shows the job id, + and - sign that follows the job id for\
    \ two jobs denote the default and next default job when the current default job\
    \ ids respectively. The default job is used when the fg or bg commands are used\
    \ without any argument.\n\nSecond field gives the status of the job. Third field\
    \ is the command used to start the process.\n\nThe last field (wd:~) says that\
    \ the sleep commands were started from the working directory ~ (Home).\n\n###\
    \ Section 37.2: Bring a background process to the foreground\n\n```\n$ fg %2\n\
    sleep 600\n```\n\n%2 specifies job no. 2. If fg is used without any argument brings\
    \ the last process put in background to the foreground.\n\n```\n$ fg ?sle\nsleep\
    \ 500\n```\n\n?sle refers to the background process command containing \"sle\"\
    . If multiple background commands contain the string, it will produce an error.\n\
    \n### Section 37.3: Restart stopped background process\n\n```\n$ bg\n[8]+ sleep\
    \ 600 &\n```\n\n### Section 37.4: Run command in background\n\n```\n$ sleep 500\
    \ &\n[1] 7582\n```\n\nPuts the sleep command in background. 7582 is the process\
    \ id of the background process.\n\n### Section 37.5: Stop a foreground process\n\
    \nPress Ctrl + Z to stop a foreground process and put it in background\n\n```\n\
    $ sleep 600\n^Z\n[8]+ Stopped sleep 600\n```\n\n## Chapter 38: Case statement\n\
    \n### Section 38.1: Simple case statement\n\nIn its simplest form supported by\
    \ all versions of bash, case statement executes the case that matches the pattern.;\
    \ ; operator breaks after the first match, if any.\n\n```\n#!/bin/bash\n\nvar=1\n\
    case $var in\n1)\necho \"Antarctica\"\n;\n2)\necho \"Brazil\"\n;\n3)\necho \"\
    Cat\"\n;\nesac\n```\n\nOutputs:\n\nAntarctica\n\n### Section 38.2: Case statement\
    \ with fall through\n\nVersion ≥ 4.0\n\nSince bash 4.0, a new operator ;& was\
    \ introduced which provides fall through mechanism.\n\n```\n#!/bin/bash\n\nvar=1\n\
    case $var in\n1)\necho \"Antarctica\"\n&&\n2)\necho \"Brazil\"\n&&\n3)\necho \"\
    Cat\"\n&&\nesac\n```\n\nOutputs:\n\nAntarctica\nBrazil\nCat\n\n### Section 38.3:\
    \ Fall through only if subsequent pattern(s) match\n\nVersion ≥ 4.0\n\nGoalKicker.com\
    \ – Bash Notes for Professionals\n\nAs Bash 4.0, another operator ;;& was introduced\
    \ which also provides fall through only if the patterns in subsequent case statement(s),\
    \ if any, match.\n\n```\n#!/bin/bash\n\nvar=abc\ncase $var in\na)\n  echo \"Antarctica\"\
    \n  ;;&\nxyz)\n  echo \"Brazil\"\n  ;;&\n*b)\n  echo \"Cat\"\n  ;;&\nesac\n```\n\
    \nOutputs:\n\nAntarctica\nCat\n\nIn the below example, the abc matches first and\
    \ third case but not the second case. So, second case is not executed.\n\n## Chapter\
    \ 39: Read a file (data stream, variable) line-by-line (and/or field-by-field)?\n\
    \n| Parameter | Details |\n| --- | --- |\n| IFS | Internal field separator |\n\
    | file | A file name/path |\n| -r | Prevents backslash interpretation used when\
    \ we read |\n| -t | Removes a trailing newline from each line read by read |\n\
    | -d DELIM | Continue until the first character of DELIM is read (with `read`),\
    \ rather than newline |\n\n### Section 39.1: Looping through a file line by line\n\
    \n```\nwhile IFS= -r line; do\n  echo \"$line\"\ndone <file\n```\n\nIf file may\
    \ not include a newline at the end, then:\n\n```\nwhile IFS= -r line || [ -n \"\
    $line\" ]; do\necho \"$line\"\ndone <file\n```\n\n### Section 39.2: Looping through\
    \ the output of a command field by field\n\nLet's assume that the field separator\
    \ is:\n\n```\nwhile IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"\
    **$field**\"\ndone <(ping google.com)\n```\n\nWith a pipe:\n\n```\nping google.com\
    \ | while IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"**$field**\"\
    \ndone\n```\n\n### Section 39.3: Read lines of a file into an array\n\n```\nreadarray\
    \ -t file\n```\n\nWith a loop:\n\n```\narr=()\nwhile IFS= read -r line; do\n \
    \ arr+=\"$line\"\ndone <file\n```\n\n### Section 39.4: Read lines of a string\
    \ into an array\n\n```\nvar='line 1\nline 2\nline3'\nreadarray -t arr <<< \"$var\"\
    \n```\n\nor with a loop:\n\n```\narr()\nwhile IFS= read line; do\n  arr+=\"$line\"\
    \ndone <<< \"$var\"\n```\n\n### Section 39.5: Looping through a string by line\n\
    \n```\nvar='line 1\nline 2\nline3'\nwhile IFS= read -r line; do\necho \"$line\"\
    \ndone <<< \"$var\"\n```\n\nor\n\n```\nreadarray -t arr <<< \"$var\"\nfor i in\
    \ ${arr[@]}; do\necho \"$i\"\ndone\n```\n\n### Section 39.6: Looping through the\
    \ output of a command by line\n\n```\nwhile IFS= read -r line; do\necho \"$line\"\
    \ndone <(ping google.com)\n```\n\nor with a pipe:\n\n```\nping google.com | while\
    \ IFS= read -r line; do\necho \"$line\"\ndone\n```\n\n### Section 39.7: Read field\
    \ by field\n\nLet's assume that the field separator is : in the file.\n\n```\n\
    while IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"$field\"\ndone\
    \ <file\n```\n\n### Section 39.8: Read a string by field\n\nLet's assume that\
    \ the field separator is :\n\n```\nvar='line 1:line 2:line3'\nwhile IFS= read\
    \ -d : -r field || [ -n \"$field\" ]; do\necho \"$field\"\ndone <<<var\n```\n\n\
    ### Section 39.9: Read fields of a file into an array\n\nLet's assume that the\
    \ field separator is :\n\n```\narr=()\nwhile IFS= read -d : -r field || [ -n \"\
    $field\" ]; do\narr+=\"$field\"\ndone <file\n```\n\n### Section 39.10: Read fields\
    \ of a string into an array\n\nLet's assume that the field separator is :\n\n\
    ```\nvar='1:2:3:4'\narr=()\nwhile IFS= read -d : -r field || [ -n \"$field\" ];\
    \ do\narr+=\"$field\"\ndone <<<var\n```\n\n### Section 39.11: Reads file (/etc/passwd)\
    \ by line and field\n\nIn unix format, user information is stored by line, each\
    \ line consisting of information separated by colon character. In this example\
    \ reading the file by line, the line is also split into fields using colon delimiter\
    \ which is indicated by.\n\n```\n#!/bin/bash\nFILENAME=/etc/passwd\nwhile IFS=:\
    \ -r username userid group; do\n  echo '$username, $userid, $group'\ndone < $FILENAME\n\
    ```\n\n# Sample input\n\n```\nmysql:x:27:27:MySQL Server:/var/lib/mysql:/bin/bash\n\
    pulse:x:497:495:PulseAudio Daemon:/var/run/pulse:/sbin/nlogin\nsshd:x:74:74:Privilege-separated\
    \ SSH:/var/empty/sshd:/sbin/nlogin\ntomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nlogin\n\
    webizer:x:67:67:Webalizer:/var/www/usage:/sbin/nlogin\n```\n\n# Sample Output\n\
    \n```\nmysql, 27, MySQL Server /var/lib/mysql\npulse, 497, PulseAudio Daemon /var/run/pulse\n\
    sshd, 74, Privilege-separated SSH /var/empty/sshd\ntomcat, 91, Apache Tomcat /var/share/tomcat6\n\
    webizer, 67, Webalizer /var/www/usage\n```\n\nTo read by line and have the entire\
    \ line assigned to variable, following is a modified version of the example. Note\
    \ that we have only one variable by name here.\n\n```\n#!/bin/bash\nFILENAME=/etc/passwd\n\
    while IFS= -r line\ndo\n  echo '$line'\ndone < $FILENAME\n```\n\n# Sample Input\n\
    \n```\nmysql:x:27:27:MySQL Server:/var/lib/mysql:/bin/bash\npulse:x:497:495:PulseAudio\
    \ Daemon:/var/run/pulse:/sbin/nlogin\nsshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nlogin\n\
    tomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nlogin\nwebizer:x:67:67:Webalizer:/var/www/usage:/sbin/nlogin\n\
    ```\n\n# Sample Output\n\n```\nmysql:27:27:MySQL Server:/var/lib/mysql:/bin/bash\n\
    pulse:x:497:498:PulseAudio Daemon:/var/run/pulse:/sbin/nologin\nsshd:x:74:74:Privilege-separated\
    \ SSH:/var/sshd:/sbin/nologin\ntomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nologin\n\
    webalizer:x:67:67:Webalizer:/var/www/usage:/sbin/nologin\n```\n\n## Chapter 40:\
    \ File execution sequence\n\n.bash_profile, .bash_login, .bashrc, and .profile\
    \ all do pretty much the same thing: set up and define functions, variables, and\
    \ the sorts.\n\nThe main difference is that .bashrc is called at the opening of\
    \ a non-login but interactive window, and .bash_profile and the others are called\
    \ for a login shell. Many people have their .bash_profile or similar call .bashrc\
    \ anyway.\n\n## Section 40.1: .profile vs .bash_profile (and .bash_login)\n\n\
    .profile is read by most shells on startup, including bash. However, .bash_profile\
    \ is used for configurations specific to bash. For general initialization code,\
    \ put it in .profile. If it's specific to bash, use .bash_profile.\n"
  mdcn: "\n\n## 第 36.33 节:$UID\n\n一个只读变量，存储用户的 ID 数字：\n\n```\n~> echo $UID\n12345\n\
    ```\n\n## 第 37 章：作业控制\n\n### 第 37.1 节列出后台进程\n\n```\n$ jobs\n[1] Running      sleep\
    \ 500 & (wd ~)\n[2]- Running      sleep 600 & (wd ~)\n[3]+ Running      ./Fritzing\
    \ &\n```\n\n前几列显示作业 ID，跟在作业 ID 的 `+` 和 `-` 符号分别表示当前默认作业和下一个默认作业 ID。当使用 `fg` 或\
    \ `bg` 命令而不带任何参数时，将使用默认作业。\n\n第二个字段给出作业状态。第三字段是用于启动进程的命令。\n\n最后一个字段 (wd:~) 表示\
    \ `sleep` 命令是从工作目录 ~（主目录）启动的。\n\n### 第 37.2 节将后台进程带到前台\n\n```\n$ fg %2\nsleep\
    \ 600\n```\n\n%2 指定作业号 2。如果使用 `fg` 而不带任何参数，则将最后一个放入后台的进程带到前台。\n\n```\n$ fg ?sle\n\
    sleep 500\n```\n\n?sle 指向包含 \"sle\" 的后台进程命令。如果多个后台命令包含该字符串，则会产生错误。\n\n### 第 37.3\
    \ 节重启已停止的后台进程\n\n```\n$ bg\n[8]+ sleep 600 &\n```\n\n### 第 37.4 节在后台运行命令\n\n```\n\
    $ sleep 500 &\n[1] 7582\n```\n\n将 `sleep` 命令放入后台。7582 是后台进程的进程 ID (PID)。\n\n###\
    \ 第 37.5 节停止前台进程\n\n按下 Ctrl + Z 停止前台进程并将其放入后台\n\n```\n$ sleep 600\n^Z\n[8]+ Stopped\
    \ sleep 600\n```\n\n## 第 38 章：case 语句\n\n### 第 38.1 节：简单 case 语句\n\n在所有版本 bash\
    \ 都支持的最简单形式中，`case` 语句执行匹配模式的 case 分支；`;` 运算符在第一次匹配后（如果有的话）中断。\n\n```bash\n#!/bin/bash\n\
    \nvar=1\ncase $var in\n1)\necho \"Antarctica\"\n;\n2)\necho \"Brazil\"\n;\n3)\n\
    echo \"Cat\"\n;\nesac\n```\n\n输出：\n\nAntarctica\n\n### 第 38.2 节：具有穿透（fall through）功能的\
    \ case 语句\n\n版本 ≥ 4.0\n\n从 bash 4.0 开始，引入了一个新运算符 `;&`，它提供了穿透机制。\n\n```bash\n#!/bin/bash\n\
    \nvar=1\ncase $var in\n1)\necho \"Antarctica\"\n&&\n2)\necho \"Brazil\"\n&&\n\
    3)\necho \"Cat\"\n&&\nesac\n```\n\n输出：\n\nAntarctica\nBrazil\nCat\n\n### 第 38.3\
    \ 节：仅当后续模式匹配时才穿透\n\n版本 ≥ 4.0\n\nGoalKicker.com – 专业人士 Bash 笔记\n\n从 Bash 4.0 开始，引入了另一个运算符\
    \ `;;&`，它也提供了穿透功能，但仅当后续 case 语句（如果有）中的模式匹配时才穿透。\n\n```bash\n#!/bin/bash\n\nvar=abc\n\
    case $var in\na)\n  echo \"Antarctica\"\n  ;;&\nxyz)\n  echo \"Brazil\"\n  ;;&\n\
    *b)\n  echo \"Cat\"\n  ;;&\nesac\n```\n\n输出：\n\nAntarctica\nCat\n\n在下例示例中，abc\
    \ 匹配第一个和第三个 case，但不匹配第二个 case。因此，不执行第二个 case。\n\n## 第 39 章：逐行（和或逐字段）读取文件（数据流、变量）？\n\
    \n| 参数 | 详情 |\n| --- | --- |\n| IFS | 内部字段分隔符 |\n| file | 文件名/路径 |\n| -r | 防止读取时解释反斜杠\
    \ |\n| -t | 移除 read 读取的每行末尾的换行符 |\n| -d DELIM | 继续直到读取到 DELIM 的第一个字符（使用 `read`\
    \ 时），而不是换行符\n\n### 第 39.1 节：逐行循环文件\n\n```\nwhile IFS= -r line; do\n  echo \"$line\"\
    \ndone <file\n```\n\n如果文件可能不包含末尾换行符，则：\n\n```\nwhile IFS= -r line || [ -n \"$line\"\
    \ ]; do\necho \"$line\"\ndone <file\n```\n\n### 第 39.2 节：逐字段循环命令输出\n\n假设字段分隔符为：\n\
    \n```\nwhile IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"**$field**\"\
    \ndone <(ping google.com)\n```\n\n使用管道时：\n\n```\nping google.com | while IFS=\
    \ read -d : -r field || [ -n \"$field\" ]; do\necho \"**$field**\"\ndone\n```\n\
    \n### 第 39.3 节：将文件行读入数组\n\n```\nreadarray -t file\n```\n\n使用循环：\n\n```\narr=()\n\
    while IFS= read -r line; do\n  arr+=\"$line\"\ndone <file\n```\n\n### 第 39.4 节：将字符串行读入数组\n\
    \n```\nvar='line 1\nline 2\nline3'\nreadarray -t arr <<< \"$var\"\n```\n\n或者使用循环：\n\
    \n```\narr()()\nwhile IFS= read line; do\n  arr+=\"$line\"\ndone <<< \"$var\"\n\
    ```\n\n### 第 39.5 节：逐行循环字符串\n\n```\nvar='line 1\nline 2\nline3'\nwhile IFS= read\
    \ -r line; do\necho \"$line\"\ndone <<< \"$var\"\n```\n\n或者：\n\n```\nreadarray\
    \ -t arr <<< \"$var\"\nfor i in ${arr[@}; do\necho \"$i\"\ndone\n```\n\n### 第\
    \ 39.6 节：逐行循环命令输出\n\n```\nwhile IFS= read -r line; do\necho \"$line\"\ndone <(ping\
    \ google.com)\n```\n\n或者使用管道：\n\n```\nping google.com | while IFS= read -r line;\
    \ do\necho \"$line\"\ndone\n```\n\n### 第 39.7 节：逐字段读取\n\n假设文件中字段分隔符为 `:`\n\n```\n\
    while IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"$field\"\ndone\
    \ <file\n```\n\n### 第 39.8 节：逐字段读取字符串\n\n假设字段分隔符为 `:`\n\n```\nvar='line 1:line\
    \ 2:line3'\nwhile IFS= read -d : -r field || [ -n \"$field\" ]; do\necho \"$field\"\
    \ndone <<<var\n```\n\n### 第 39.9 节：将文件字段读入数组\n\n假设字段分隔符为 `:`\n\n```\narr=()\n\
    while IFS= read -d : -r field || [ -n \"$field\" ]; do\narr+=\"$field\"\ndone\
    \ <file\n```\n\n### 第 39.10 节：将字符串字段读入数组\n\n假设字段分隔符为 `:`\n\n```\nvar='1:2:3:4'\n\
    arr=()\nwhile IFS= read -d : -r field || [ -n \"$field\" ]; do\narr+=\"$field\"\
    \ndone <<<var\n```\n\n### 第 39.11 节：行和字段读取文件 (/etc/passwd)\n\n在 unix 格式中，用户信息按行存储，每行由冒号分隔。在本示例中，逐行读取文件，行还使用冒号分隔为字段。\n\
    \n```bash\n#!/bin/bash\nFILENAME=/etc/passwd\nwhile IFS=: -r userid group; do\n\
    \  echo '$username, $userid, $group'\ndone < $FILENAME\n```\n\n# 示例输入\n\n```\n\
    mysql:x:27:27:MySQL Server:/var/lib/mysql:/bin/bash\npulse:x:497:495:PulseAudio\
    \ Daemon:/var/run/pulse:/sbin/nlogin\nsshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nlogin\n\
    tomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nlogin\nwebizer:x:67:67:Webalizer:/var/www/usage:/sbin/nlogin\n\
    ```\n\n# 示例输出\n\n```\nmysql, 27, MySQL Server /var/lib/mysql\npulse, 497, PulseAudio\
    \ Daemon /var/run/pulse\nsshd, 74, Privilege-separated SSH /var/empty/sshd\ntomcat,\
    \ 91, Apache Tomcat /usr/share/tomcat6\nwebizer, 67, Webalizer /var/www/usage\n\
    ```\n\n要逐行读取并将整行赋值给变量，以下是示例的修改版本。注意这里只有一个命名的变量。\n\n```bash\n#!/bin/bash\nFILENAME=/etc/passwd\n\
    while IFS= -r line\ndo\n  echo '$line'\ndone < $FILENAME\n```\n\n# 示例输入\n\n```\n\
    mysql:x:27:27:MySQL Server:/var/lib/mysql:/bin/bash\npulse:x:497:495:PulseAudio\
    \ Daemon:/var/run/pulse:/sbin/nlogin\nsshd:x:74:74:Privilege-separated SSH:/var/empty/sshd:/sbin/nlogin\n\
    tomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nlogin\nwebizer:x:67:67:Webalizer:/var/www/usage:/sbin/nlogin\n\
    ```\n\n# 示例输出\n\n```\nmysql:27:27:MySQL Server:/var/lib/mysql:/bin/bash\npulse:x:497:498:PulseAudio\
    \ Daemon:/var/run/pulse:/sbin/nologin\nsshd:x:74:74:Privilege-separated SSH:/var/sshd:/sbin/nologin\n\
    tomcat:x:91:91:Apache Tomcat:/usr/share/tomcat6:/sbin/nologin\nwebalizer:x:67:67:Webalizer:/var/www/usage:/sbin/nologin\n\
    ```\n\n## 第 40 章：文件执行顺序\n\n.bash_profile, .bash_login, .bashrc 和 .profile 的作用几乎完全相同：设置和定义函数、变量等。\n\
    \n主要区别在于，.bashrc 在打开非登录但交互式的窗口时被调用，而 .bash_profile 和其他文件在登录 shell 时被调用。尽管如此，许多也会让他们的\
    \ .bash_profile 或类似文件调用 .bashrc。\n\n## 第 40.1 节：.profile vs .bash_profile (以及\
    \ .bash_login)\n\n.profile 在大多数 shell 启动时被读取，包括 bash。然而，.bash_profile 用于特定 bash\
    \ 的配置。对于通用初始化代码，请将其放在 .profile 中。如果是 bash 特有的，请使用 .bash_profile。\n\n"
