    \ match' || echo 'matched' ]]\n[[ $s -eq 10 ]] && echo 'equal' || echo 'not equal'\
    \ ]\n[[ $s != 10 ]] && echo 'equal' || echo 'not equal' ]]\n```\n\nOne liner test\
