    # Section 24.3: Save in the command history by pattern


    Press control r and type a pattern.


    For example, if you recently executed man 5 crontab, you can find it quickly by
    starting to type `crontab`. The prompt will look like this:


    ```

    (reverse-i-search)`: man 5 crontab

    ```


    The `cr` is the string I type so far. This is an incremental search, so as you
    continue typing, the search result gets updated to match the most recent command
    that contains the pattern.


    Press the left right arrow keys to edit the matched command before running it,
    or the enter key to run the command.


    By default the search finds the most recently executed command matching the pattern.
    To go further back the history press control r again. You may press it repeatedly
    until you find the desired command.


