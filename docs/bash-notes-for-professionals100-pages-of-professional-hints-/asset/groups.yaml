    \ (BSD)\n```\n\nThis can be used to check if a given application is running. For\
    \ example, to check if the SSH server (sshd) is running:\n\n```\nps -ef | grep\
    \ sshd\n```\n\n## Chapter 9: Redirection\n\n| Parameter | Details |\n| --- | ---\
    \ |\n| internal file descriptor | An integer. |\n| direction | One of , < or >\
    \ |\n| external file descriptor or path | |\n| or path & followed by an integer\
    \ for file descriptor or a path. | |\n\n## Section 9.1: Redirecting standard output\n\
    \n> redirect the standard output (aka STDOUT) of the current command to one file\
    \ or another descriptor.\n\nThese examples write the output of the ls command\
    \ into the file.txt.\n\n```\nls >file.txt\nls > file.txt\n```\n\nThe target file\
    \ is created if it doesn't exist, otherwise this file is truncated.\n\nThe default\
    \ redirection is the standard output or 1 when no one is specified. This command\
    \ is equivalent to the previous examples with the standard output explicitly indicated:\n\
    \n```\nls 1>file.txt\n```\n\nNote: the redirection is initialized by the executed\
    \ shell and not by the executed command, therefore it is before the command.\n\
    \n## Section 9.2: Append vs Truncate\n\nTruncate >\n1. Create specified file if\
    \ it does not exist.\n2. Truncate (remove file's content)\n3. Write to file\n\
    ```\n$ echo \"first line\" > /tmp/lines\n$ echo \"second line\" > /tmp/lines\n\
    ```\n\nAppend >>\n1. Create specified existing file if it does not exist.\n2.\
    \ Append file (writing at end of file).\n```\n# Overwrite existing line\n$ echo\
    \ \"first line\" > /tmp/lines\n\n# Append second line\n$ echo \"second line\"\
    \ >> /tmp/lines\n$ cat /tmp/lines\n```\n\n## Section 9.3: Redirecting both STDOUT\
    \ and STDERR\n\nFile descriptors like 0 and 1 are pointers. We change file descriptors\
    \ to point with redirection. 0 points to /dev/null, 1 points to /dev/null, 2 points\
    \ to /dev/null.\n\nThis allows a long running process to continue once your shell\
    \ (terminal, ssh, etc) is closed.\n\nVersion 4.0\nThis can be shortened to the\
    \ following:\n\nHowever this may be undesirable in production if shell compatibility\
