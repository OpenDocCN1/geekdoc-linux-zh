    \ located in a specific directory:\n\n```bash\n$ find /opt\n```\n\nTo search for\
    \ files (not directories), use -type f:\n\n```bash\nfind /opt -type f\n```\n\n\
    To search for directories only (not regular files), use -type d:\n\n```bash\n\
