    # # Chapter 44: Managing PATH environment variable


    | Parameter | Details |

    | --- | --- |

    | PATH | Path environment variable |


    # ## Section 44.1: Add a path to the PATH environment variable


    The PATH environment variable is generally defined in ~/.bashrc or ~/.bash_profile
    or /etc/profile or /etc/bashrc (distro specific Bash configuration file)


    ```

    $ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:/usr/local/games:/snap/bin

    /usr/lib/jvm/jdk1.8.0_92/bin:/usr/lib/jvm:/lib/jvm/jdk1.8.0_92/jre/bin

    ```


    Now, if we want to add a path (~ /bin) to the PATH variable:


    ```

    PATH=~/bin:$PATH

    #

    PATH=$PATH:~/bin

    ```


    But this will modify the PATH only in the current shell (and its subshell). Once
    you exit the shell, this modification will be gone.


    To make it permanent, you need to add that code to the ~/.bashrc (or whatever)
    file and reload it.


    If you run the following code (in terminal), it will add ~/bin to the PATH permanently:


    ```

    echo ''PATH=~/bin:$PATH'' >> ~/.bashrc && source ~/.bashrc

    ```


    Explanation:


    +   - PATH=~/bin:$PATH >> ~/.bashrc adds line PATH=~/bin:$PATH at the end of ~/.bashrc
    file (you could do it with a text editor)

    - source ~/.bashrc reloads the ~/.bashrc file


    This is a bit of code (run in terminal) that will check if a path is already included
    and add the path only if not:


    ```

    path=~/bin # path to be included

    bashrc=/.bashrc # file to be written and reloaded

    # run the following code unmodified

    echo $PATH | grep -q "\(:|\)$path\{0,1}\$" | echo "PATH=\$$path" >> "\$bashrc"

    source "\$bashrc"

    ```


    # ## Section 44.2: Remove a path from the PATH environment variable


    To remove a PATH from PATH environment variable, you need to edit ~/.bashrc or
    ~/.bash_profile or /etc/profile or ~/etc/bashrc (distro specific) file and remove
    the assignment for that particular path.


    Instead of finding the exact assignment, you could just do a replacement in the
    $PATH in its final stage.


    The following will safely remove $path from $PATH:'
  - "[PAGE 154]\n\n```\npath=~/bin\nPATH=$(echo $PATH | sed -e \"s/\\\\|:\\\\)$(echo\
    \ \\$path | sed -e 's/[^\\\\|\\/]/g' -e 's/\\\\|\\\\/\\\\/\\\\/\\\\(0,1\\$)\\\
    #1\\2#' -e 's#:+#:#g' -e 's#^\\:$##g'\")\n```\n\nTo make it permanent, you will\
    \ need to add this to the end of your bash configuration file.\n\nYou can do it\
    \ in a functional way:\n\n```\nrpath() {\n  for path in \"$PATH\"; do\n    PATH=$(echo\
    \ $PATH | sed -e \"s/\\\\|:\\\\)$(echo \\$path | sed -e 's/[^\\\\|\\/]/g' -e 's/\\\
    \\|\\\\/\\\\/\\\\/\\\\(0,1\\$)\\#1\\2#' -e 's#:+#:#g' -e 's#^\\:$##g'\")\n  done\n\
    \  echo \\$$PATH\"\n}\n\nPATH=\"$(rpath ~/bin /usr/local/sbin /usr/local/bin)\"\
    \nPATH=\"$(rpath ~/usr/games)\"\n# etc ...\n```\n\nThis will make it easier to\
    \ handle multiple paths.\n\n# Notes:\n\n+   - You will need to add these codes\
    \ in the Bash configuration file (~/.bashrc or whatever).\n- Run source ~/.bashrc\
    \ to reload the Bash configuration (~/.bashrc) file."
  - "[PAGE 155]\n\n# Chapter 45: Word splitting\n\n| Parameter | Details |\n| ---\
    \ | --- |\n| IFS | Internal field separator |\n| -x | Print commands and their\
    \ arguments as they are executed (Shell option) |\n\n# Section 45.1: What, when\
    \ and Why?\n\nWhen the shell performs parameter expansion, command substitution,\
    \ variable or arithmetic expansion, it scans for word boundaries in the result.\
    \ If any word boundary is found, the result is split into multiple words at that\
    \ position. The word boundary is defined by a shell variable IFS (Internal Field\
    \ Separator). The default value for IFS is space, tab and newline, i.e. word splitting\
    \ will occur these three white space characters if not prevented explicitly.\n\
    \n```\nset -x\nvar='I am multiline string'\nfun(){\n  echo \"$1\"\n  echo \"$2\"\
    \n  echo \"$3\"\n}\nfun $var\n```\n\nIn the above example this is how the function\
    \ is being executed:\n\nfun I am a multiline string\n\n> $var is split into 5\
    \ args, only I, am and a be printed.\n\n# Section 45.2: Bad effects of word splitting\n\
    \n```\n$ a='I am a string with spaces'\n$ $a = $a ] || echo \"didn't match\"\n\
    bash: [ : too many arguments\ndidn t match\n```\n\n> [ $a = $a ] interpreted as\
    \ [ I am a string with spaces = I am a string with spaces ]. [ is the test command\
    \ for which I am a string with spaces is not a single argument, rather it's 6\
    \ arguments! ]\n\n```\n$ $a = something ] || echo \"didn't match\"\nbash: [ :\
    \ too many arguments\ndidn t match\n```\n\n> [ $a = something ] interpreted as\
    \ [ I am a string with spaces = something ]\n\n```\n$ $(grep . file) = 'something'\
    \ ]\n```"
- md: "\n```bash\nbash: too many arguments\n```\n\n> The grep command returns a multiline\
    \ string with spaces, so you can just imagine how many arguments are there...D\n\
    \nSee what, when and why for the basics.\n\n## Section 45.3: Usefulness of word\
    \ splitting\n\nThere are some cases where word splitting can be useful:\n\nFilling\
    \ up array:\n\n```bash\narr=$(grep -o '[0-9]\\+' file)\n```\n\n> This will fill\
    \ up arr with all numeric values found in file\n\nLooping through space separated\
    \ words:\n\n```bash\nwords='foo bar baz'\nfor w in $words;do\necho \"W: $w\"\n\
    done\n```\n\nOutput:\n\n```\nW: foo\nW: bar\nW: baz\n```\n\nPassing space separated\
    \ parameters which do not contain white spaces:\n\n```bash\npacks='apache2 php\
    \ php-mbstring php-mysql'\nsudo apt-get install $packs\n```\n\nor\n\n```bash\n\
    packs=\napache2\nphp\nphp-mbstring\nphp-mysql\nsudo apt-get install $packs\n```\n\
    \n> This will install the packages. If you double quote the $packs then it will\
    \ throw an error.\n\nUnquoted $packs is sending all the space separated package\
    \ names as arguments to apt-get, while quoting it will send the $packs as a single\
    \ argument and the apt-get will try to install a package named apache2 php php-mbstring\
    \ php-mysql (for the first one) obviously doesn't exist\n\nSee what, when and\
    \ why for the basics.\n\n## Section 45.4: Splitting by separator changes\n\nWe\
    \ can just do simple replacement of separators from space to new, as following\
    \ example.\n\n```bash\necho $sentence | tr \" \" \"\\n\"\n```\n\nIt'll split the\
    \ value of the variable sentence and show it line by line respectively.\n\n##\
    \ Section 45.5: Splitting with IFS\n\nTo be more clear, let's create a script\
    \ named showarg:\n\n```bash\n#!/usr/bin/env bash\nprintf \"%d args:\" $$\nprintf\
    \ \"<%s>\" $\"\necho\n```\n\nNow let's see the differences:\n\n```\n$ var=This\
    \ is an example\n$ showarg $var\n4 args: <This> <is <an> <example>\n```\n\n> $var\
    \ is split into 4 args. IFS is white space characters and word splitting occurred\
    \ in spaces\n\n```\n$ var=This/is/an/example\n$ showarg $var\n1 args: <This/is/an/example>\n\
    ```\n\n> In above word splitting didn't occur because the IFS characters weren't\
    \ found.\n\nNow let's set IFS=/\n\n```\n$ IFS=/\n$ var=This/is/an/example\n$ showarg\
    \ $var\n4 args: <This> <is <an> <example>\n```\n\n$The var is splitting into 4\
    \ arguments not a single argument.\n\n## Section 45.6: IFS && word splitting\n\
    \nSee what, when and if you don't know the affiliation of IFS to word splitting\n\
    \nlet's set the IFS to space character only:\n\n```bash\nset -x\nvar='I am\na\
    \ multiline string'\nIFS='='\nfun() {\n  echo \"-\\$1-\"\n  echo \"+$2*\"\n  echo\
    \ \".$3\"\n}\nfun $var\n```\n\nThis time word splitting will only work on spaces.\
    \ The fun function will be executed like this:\n\n```\nfun I 'am\na multiline\
    \ string'\n```\n\n> $var is split into 3 args. I, am\\na\\nmultiline and string\
    \ will be printed\n\nLet's set the IFS to newline only:\n\n```bash\nIFS='\\n'\n\
    ...\n```\n\nNow the fun will be executed like:\n\n```\nfun I 'am' a 'multiline\
    \ string'\n```\n\n> $var is split into 3 args. I am, a multiline string will be\
    \ printed\n\nLet's see what happens if we set IFS to nullstring:\n\n```bash\n\
    IFS=\n...\n```\n\nThis time the fun will be executed like this:\n\n```\nfun 'I\
    \ am\na multiline string'\n```\n\n> $var is not split i.e it remained a single\
    \ arg.\n\nYou can prevent word splitting by setting the IFS to nullstring.\n\n\
    A general way of preventing word splitting is to use double quote:\n\n```bash\n\
    fun \"$var\"\n```\n\nwill prevent word splitting in all the cases discussed above\
    \ ie the fun function will be executed with only one argument.\n\n## Chapter 46:\
    \ Avoiding date using printf\n\nIn Bash 4.2\n\n## Section 46.1: Get the current\
    \ date\n\n```bash\n$ printf '%(F)T\\n'\n2016-08-17\n```\n\n## Section 46.2: Set\
    \ variable to current time\n\n```bash\n$ printf -v now '%(T)T'\n$ echo '$now'\n\
    12:42:47\n```\n\n## Chapter 47: Using \"trap\" to react to signals and system\
    \ events\n\n| Parameter | Meaning |\n| :--- | :--- |\n| -p | List currently installed\
    \ traps |\n| -l | List signal names and corresponding numbers |\n\n## Section\
    \ 47.1: Introduction: clean up temporary files\n\nYou can use the trap command\
    \ to \"trap\" signals; this is the shell equivalent of the signal() or sigaction()\
    \ call in C and other programming languages to catch signals.\n\nOne of the most\
    \ common uses of trap is to clean up temporary files on both expected and unexpected\
    \ exit. Unfortunately not enough shell scripts do this:\n\n```bash\n#!/bin/sh\n\
    # Make a cleanup function\ncleanup() {\n  rm -f \"$tmp\"\n}\n\n# Trap the special\
    \ \"EXIT\", which is always run when the shell exits.\ntrap cleanup EXIT\n\n#\
    \ Create a temporary file\ntmp=$(mktemp -p /tmp)\necho \"Hello, world!\" >> \"\
    $tmp\"\n# No rm -f needed. The advantage of using EXIT is that it still works\
    \ if there was an error.\n```\n\n## Section 47.2: Catching SIGINT or Ctrl+C\n\n\
    The trap is reset for subshells, the sleep will still act on SIGINT (usually by\
    \ quitting), but the parent process (i.e. shell script) won't.\n\n```bash\n#!/bin/sh\n\
    # Run a command on signal (SIGINT, which is what Ctrl+C sends)\nsigint() {\n \
    \ echo \"Killed!\"\n}\ntrap sigint INT\n\n# Use no-op command for to be killed\
    \ on the first Ctrl+C\necho \"Sleeping...\"\nsleep 500\n```\n\nA variant still\
    \ allows you to quit by pressing Ctrl+C twice:\n\n```bash\nlast=0\nallow_quit()\
    \ {\n  [ $(date +%s) -lt $((last + 1)) ] && exit\n  echo \"Press C+C in a row\
    \ to quit\"\n  last=$(date +%s)\n}\ntrap allow_quit INT\n```\n\n## Section 47.3:\
    \ Accumulate a list of trap work to run at exit\n\nHave you ever forgotten to\
    \ add trap to clean up a temporary file or do other work at exit? Have you ever\
    \ set trap which canceled another? This code makes it easy to add things one at\
    \ a time rather than having one trap statement somewhere:\n\n```bash\n#!/bin/sh\n\
    # on_exit and add_on_exit\ntmp=$(mktemp)\nrm -f \"$tmp\" \necho \"I am exiting\"\
    \n\nfunction on_exit() {\n  for i in \"${items[@]}\"; do\n    eval $i\n  done\n\
    }\n\nfunction add_on_exit() {\n  n=${#items[@]}\n  items[$n]=\"$1\"\n  trap on_exit\
    \ EXIT\n}\n\nitems items=()\n```\n\n## Section 47.4: Killing Child Processes on\
    \ Exit\n\nTrap expressions don't have to be individual functions or programs,\
    \ they can be complex expressions as well. By combining jobs -p and kill, we can\
    \ kill all spawned child processes of the shell on exit:\n\n```bash\ntrap 'jobs\
    \ -p | xargs kill' EXIT\n```\n\n## Section 47.5: react on change of terminals\
    \ size\n\nThere is a signal WINCH (windowChange), which is fired when one resizes\
    \ a terminal.\n\n```bash\ndeclare -x rows cols\nupdate_size() {\n  rows=$(tput\
