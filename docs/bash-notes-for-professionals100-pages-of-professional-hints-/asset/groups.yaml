    braceexpand:emacs:hash:histexpand:history:interactive-comments:monitor

    ```


    # Section 36.29: $ _


    Outputs the list from the last command executed, useful to get something to pass
    onwards to

    command:


    ```

    ~ $ ls *.sh;echo $_

    testscript1.sh testscript2.sh

    testcript2.sh

    ```


    It gives the script path if used before any other commands:


    test.sh:


    ```

