    n'\n  1>&2\n  exit \"${status}\"\n}\n```\n\n该函数可以如下所示使用：\n\nfailwith %s: File\
    \ not found. \"${filename}\"\nfailwith -x 70 'General internal error.'\n\n以此此类推。\n\
    \n注意对于 `printf`，不应将变量作为第一个参数。如果要打印的消息包含变量值的内容，应该使用 `%s` 标识符来打印它，例如：\n\nfailwith\
    \ '%s' \"${message}\"\n\n## Section 14.4: 打印函数定义\n\n```bash\ngetfunc() {\n  declare\
    \ -f \"$@\"\n}\n\nfunction func() {\n  echo \"I am a sample function\"\n}\n\n\
    funcd=$(getfunc func)\ngetfunc func # or echo \"$funccd\"\n```\n\n输出：\n\n```bash\n\
    func() {\n{\n  echo \"I am a sample function\"\n}\n}\n```\n\n## Section 14.5:\
    \ 接受命名参数的函数\n\n```bash\nfoo() {\n  while [[ $# -gt 0 ]]; do\n    case $1 in\n\
    \      -f|--follow)\n        local FOLLOW=\"following\"\n        ;;\n      -t|--tail)\n\
    \        local TAIL=\"tail=$2\"\n        ;;\n    esac\n    shift\n  done\n\n \
    \ echo \"FOLLOW: $FOLLOW\"\n  echo \"TAIL: $TAIL\"\n}\n```\n\n示例用法：\n\n```bash\n\
    foo -f\nfoo -t 10\nfoo -f --tail 10\nfoo --follow --tail 10\n```\n\n## Section\
    \ 14.6: 函数的返回值\n\nBash 中的 `return` 语句并不像 C 语言函数那样返回一个值，而是以返回状态退出函数。你可以将其视为该函数的退出状态。\n\
    \n如果你想从函数返回一个值，可以像这样将值发送到标准输出（stdout）：\n\n```bash\nfun() {\n  local var=\"Sample\
    \ value to be returned\"\n  echo \"$var\"\n  printf \"%s\\n\" \"$var\"\n}\n```\n\
    \n现在，如果你执行：\n\n```bash\nvar=$(fun)\n```\n\n`fun` 的输出将存储在 `$var` 中。\n\n## Section\
    \ 14.7: 函数的退出码是其最后一个命令的退出码\n\n考虑这个检查主机是否在线的函数：\n\n```bash\nis_alive() {\n  ping\
    \ -c \"$1\" & /dev/null\n}\n```\n\n该函数向第一个函数参数指定的主机发送单个 `ping`。`ping` 的输出和错误输出被重定向到\
    \ `/dev/null`，因此函数永远不会输出任何内容。但 `ping` 命令成功时退出码为0，失败时为非零。这是函数的最后一个（在本例中也是唯一的）命令，`ping`\
    \ 的退出码将复用作为函数本身的退出码。\n\n这一事实在条件语句中非常有用。\n\n例如，如果主机 `graucho` 是在线的，则通过 `ssh:` 连接到它：\n\
    \n```bash\nif is_alive graucho; then\n  ssh graucho\nfi\n```\n\n另一个示例：反复检查直到主机\
    \ `graucho` 在线，然后通过 `ssh:` 连接到它：\n\n```bash\nwhile ! is_alive graucho; do\n  sleep\
    \ 5\ndone\nssh graucho\n```\n\n## Chapter 15: Bash 参数扩展 (Parameter Expansion)\n\
    \n`$` 字符引入了参数扩展、命令替换或算术扩展。参数名称或扩展符号可以括在大括号中，大括号是可选的，但它可以保护变量不被紧随其后的字符意外扩展，因为那些字符可能会被解释为名称的一部分。\n\
    \n请在 [Bash 用户手册]() 中阅读更多内容。\n\n## Section 15.1: 修改字母的大小写\n\n转为大写\n\n```bash\n\
    $ v='hello'\n# 仅转换第一个字符\n$ printf '%s\\n' \"${v^^}\"\nHello\n# 所有字符\n$ printf\
    \ '%s\\n' \"${v^^}\"\nHELLO\n# 另一种方法\n$ v='hello world'\n$ declare -u string=\"\
    $v\"\n$ echo \"$string\"\nHELLO WORLD\n```\n\n转为小写\n\n```bash\n$ v='BYE'\n# 仅转换第一个字符\n\
    $ printf '%s\\n' \"${v,,}\"\nbyE\n# 所有字符\n$ printf '%s\\n' \"${v,,}\"\nbye\n#\
    \ 另一种方法\n$ v='HELLO WORLD'\n$ declare -l string=\"$v\"\n$ echo \"$string\"\nhello\
    \ world\n```\n\n切换大小写 (Toggle Case)\n\n```bash\n$ v='Hello World'\n# 所有字符\n$ echo\
    \ \"${v~}\"\nHELLO WORLD\n$ echo \"${v^}\"\n# 仅转换第一个字符\nhello World\n```\n\n##\
    \ Section 15.2: 参数长度\n\n```bash\n# 字符串长度\n$ var='12345'\n$ echo \"${#var}\"\n\
    ```\n\n注意，它是字符数量的长度，不一定等同于字节数（例如在 UTF-8 中，大多数字符被编码为多个字节），也不等同于字形/字素数（某些字符是字符的组合），更不等同于显示宽度。\n\
    \n```bash\n# 字符数量\n$ var='12345'\n$ echo \"${#var}\"\n```\n\n## Section 15.3:\
    \ 替换 (Pattern Substitution)\n\n```bash\n# 替换\n$ var='hello world'\n# 替换第一个匹配\n\
    $ printf '%s\\n' \"${var/hello/hi}\"\nhi world\n# 替换所有匹配\n$ printf '%s\\n' \"\
    ${var//hello/hi}\"\n```\n\n## Section 15.4: 删除 (Deletion)\n\n```bash\n$ var='hello\
    \ world'\n# 删除结尾的匹配\n$ printf '%s\\n' \"${var%world}\"\nhello\n# 删除结尾的所有匹配\n$\
    \ printf '%s\\n' \"${var%%world}\"\nhello\n```\n\n## Section 15.5: 从字符串开头删除模式\n\
    \n```bash\n$ var='hello world'\n# 删除开头的最短匹配\n$ printf '%s\\n' \"${var#hello}\"\
    \nworld\n# 删除开头的最长匹配\n$ printf '%s\\n' \"${var##hello}\"\nworld\n```\n\n## Section\
    \ 15.6: 间接引用 (Indirection)\n\nBash 间接引用允许获取包含另一个变量名的变量的值。变量示例：\n\n```bash\n$ red=\"\
    the color red\"\n$ green=\"the color green\"\n\n$ color=red\n$ echo ${$color}\n\
    # the color red\n$ color=green\n$ echo ${$color}\n```\n\n## Section 15.7: 参数扩展与文件名\n\
    \n你可以使用 Bash 参数扩展来模拟文件名处理操作，如 `basename` 和 `dirname`。\n\n我们将使用此路径：\n\n```bash\n\
    FILENAME=\"/tmp/example/myfile.txt\"\n```\n\n模拟 `dirname` 并返回目录名：\n\n```bash\n\
    echo \"${FILENAME%/*}\"\n# 输出: /tmp/example\n```\n\n模拟 `basename` 并返回文件名：\n\n\
    ```bash\necho \"${FILENAME##*/}\"\n```\n\n"
