    ### Section 36.1: $$


    $$ expands to all of the line arguments as separate words. It is different from
    "$*", which expands to all of the arguments as a single word.


    "$" is especially useful for looping through arguments and handling arguments
    with spaces.


    Consider we are in a script with two arguments, like so:


    ```bash

    $ ./script.sh "_1_2_" "_3_4"

    ```


    The variables $* or $$ will expand into $1_$2, which in turn expand into 1_2_3_4
    so the loop:


    ```bash

    for var in $*; do same for var in $$; do

    echo "\$var\"

    done

    ```


    will print for both


    ```

    <1>

    <2>

    <3>

    <4>

    ```


    While "$*" will be expanded into "$1_$2" which in turn expand into "_1_2___3_4_"
    and so the loop:


    will only invoke echo once and will print


    ```

    <1_2___3_4_>

    ```


    And finally "$$"; will expand into "$1 "$2", which will expand into "_1_2_" "_3_4_"
    and so the loop


    ```bash

    for var in "$"; do

    echo "\$var\"

    done

    ```


    will print


    ```

    <_1_2_>

    <_3_4>

    ```


    thereby preserving the internal spacing in the arguments and arguments separation.
    Note that Assignment must have no space before and after. a=123 not a = 123. The
    latter (an equal sign surrounded by isolation means run the command with the arguments
    = 123, though this is also seen in the string comparison operator (which syntactically
    is an argument to [ or [ you are using).

