    $ cut -d ' ' -f1,3 <<< \"a b c e\"\na b\n```\n\ncut cannot be used to parse arguments\
    \ in the shell or other programs.\n\n### Section 55.3: No quoting\n\nThere is\
    \ no way to protect the delimiter. Spreadsheets and similar-handling software\
    \ usually recognize text-quoting which makes it possible to define strings containing\
    \ a delimiter. With cut you cannot.\n\n```bash\n$ cut -d, -f3 \"John,1, Main Street\"\
    \n1\n```\n\n### Section 55.4: Extracting, not manipulating\n\nYou can only extract\
    \ portions of lines, not reorder or repeat fields.\n\n```bash\n$ cut -d, -f2,1\
    \ <<< 'John,Smith,USA'\nSmith\n$ cut -d, -f2,2 <<< 'John,Smith,USA'\n```\n\n\n\
    ## Chapter 56: Bash on Windows\n\nThe simpler way to use Bash in Windows is to\
    \ install Git. It's shipped with Git which is a real Bash. You can access it with\
    \ shortcut like grep, find, sed, vi is working.\n\n## Chapter 57: Cut Command\n\
    \n| Option | Description |\n| --- | --- |\n| -b, --bytes=LIST | Print the bytes\
    \ listed in parameter |\n| -c, --characters=LIST | Print characters in positions\
    \ specified in parameter |\n| -f, --fields=LIST | Print fields or columns |\n\
    | -d DELIMIT | Used to separate columns or fields |\n\nIn Bash, the `cut` command\
    \ is useful for dividing a file into smaller parts.\n\n### Section 57.1: Show\
    \ the first column of a file\n\nSuppose you have a file that looks like this.\
    \ This file has 3 columns separated by spaces. To select only the first column,\
    \ do the following.\n\n```bash\ncut -d ' ' -f1 filename\n```\n\nHere the -d flag\
    \ specifies the delimiter, or what separates records. The -f flag specifies the\
    \ field or column number. This will display the following\n\n### Section 57.2:\
    \ Show columns x to y of a file\n\nSometimes, it's useful to display a range of\
    \ columns in a file. Suppose you have this file. To select the 3 columns do\n\n\
    ```bash\ncut -d ' ' -f1-3 filename\n```\n\nThis will display the following\n\n\
    ## Chapter 58: global and local variables\n\nBy default, every variable in bash\
    \ is global to every function, script and even the outside shell if you are declaring\
    \ your variables inside a script.\n\nIf you want your variable to be local to\
    \ a function, you can use local to have that new variable that is independent\
    \ of the global scope and whose value will only be accessible inside that function.\n\
    \n### Section 58.1: Global variables\n\n```bash\nvar=\"hello\"\nfunction foo(){\n\
    \  echo $var\n}\nfoo\n```\n\nWill obviously output \"hello\", but this works the\
    \ other way around to:\n\n```bash\nfunction foo() {\n  var=\"hello\"\n}\nfoo\n\
    echo $var\n```\n\nWill also output \"hello\"\n\n### Section 58.2: Local variables\n\
    \n```bash\nfunction foo() {\n  local var\n  var=\"hello\"\n}\nfoo\necho $var\n\
    ```\n\nWill output nothing, as as var is a local variable to the function foo,\
    \ and its value is not visible from outside of it.\n\n### Section 58.3: Mixing\
    \ the two together\n\n```bash\nvar=\"hello\"\nfunction foo(){\n  local var=\"\
    sup?\"\n  echo \"inside function, var=$var\"\n}\nfoo\necho \"outside function,\
    \ var=$var\"\n```\n\nWill output\n\n```bash\ninside function, var=sup?\noutside\
    \ function, var=hello\n```\n\n## Chapter 59: CGI Scripts\n\n### Section 59.1:\
    \ Request Method: GET\n\nIt is quite easy to call a CGI-Script via GET. First\
    \ you will need the encoded url of the script. Then you add a question mark ?\
    \ followed by variables.\n\n- Every variable should have two sections separated\
    \ by =\n- First section should be always a unique name for each variable, while\
    \ the second part has values in it only\n- Variables are separated by &\n- Total\
    \ length of the string should not be over 255 characters\n- Names and values needs\
    \ to be html-encoded (replace: <, /, &, $)\n- Hint: When using html-forms the\
    \ request method can be generated by it. With Ajax you can encodeURI and encodeURIComponent\n\
    \nExample:\n\n```\nhttp://www.example.com/cgi-bin/script.sh?var1=Hello%20World!&var2=This%20is%20a%20Test.\n\
    ```\n\nThe server should communicate via Cross-Origin Resource Sharing (CORS)\
    \ only, to make request secure. In this case we use CORS to determine the Data-Type\
    \ we want to use.\n\nThere are many Data-Types we can choose from, the most common\
    \ are:\n\n- text/html\n- text/plain\n- application/json\n\nWhen sending a request,\
    \ the server will create any environment variables. For now the most important\
    \ environment variables are $REQUEST_METHOD and $QUERY_STRING.\n\nThe Request\
    \ Method has to be GET nothing else!\nThe Query String includes all the html-encoded\
    \ data.\n\nThe Script\n\n```bash\n#!/bin/bash\n\n# CORS is the way to communicate,\
    \ so lets response to the server first\necho \"Content-type: text/html\" # set\
    \ data-type we want to use\necho \"\" # we don't need rules, the empty line initiates\
    \ this\n\n# CORS are set in stone and any communication from now on will be like\
    \ reading a html-document.\n# Therefore we need to create any stdin in html format!\n\
    \n# create html structure and send it to stdout\necho \"<<!DOCTYPE html>\"\necho\
    \ \"<html><head>\"\n\n# The content will be created depending on the Request Method\n\
    if [ \"$REQUEST_METHOD\" = \"GET\" ]; then\n```\n"
