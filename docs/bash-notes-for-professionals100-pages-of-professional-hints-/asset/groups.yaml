    # # Section 36.19: $BASH_VERSION


    Shows the version of Bash that is running, allows you to decide whether you can
    use any advanced features:


    ```

    -> $ echo $BASH_VERSION

    4.1.2(1)-release

    ```


    # # Section 36.20: $EDITOR


    The default editor that will be invoked by any scripts or programs, usually vi
    or emacs.


    ```

    -> $ echo $EDITOR

    vi

    ```


    # # Section 36.21: $HOSTNAME


    The hostname assigned to the system during startup.


    ```

    -> $ echo $HOSTNAME

    mybox.mydomain.com

    ```'
  - '[PAGE 136]


    # Section 36.22: $HOSTTYPE


