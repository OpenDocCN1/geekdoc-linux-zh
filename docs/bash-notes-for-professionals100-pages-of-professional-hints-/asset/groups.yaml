    $ sort < /tmp/list.txt\na\nb\nc\n```\n\n## 第 9.9 节：重定向 STDERR\n\n2 是 STDERR。\n\
    \n```\n$ echo_to_stderr 2>/dev/null # ecos nothing\n```\n\n定义：\n\necho_to_stderr\
    \ 是一个向 STDERR 写入 \"stderr\" 的命令\n\n```\necho_to_stderr () {\n  echo stderr >&2\n\
    }\n```\n\n```\n$ echo_to_stderr\nstderr\n```\n\n## 第 9.10 节：解释 STDIN、STDOUT 和\
    \ STDERR\n\n命令有一个输入 (STDIN) 和两种输出：标准输出 (STDOUT) 和标准错误 (STDERR)。\n\n例如：\n\nSTDIN\n\
    \n```\nroot@server~# read\nType some text here\n```\n\n标准输入用于向程序提供输入。（在这里，我们使用内置命令\
    \ read 从 STDIN 读取一行。）\n\nSTDOUT\n\n```\nroot@server~# ls file\nfile\n```\n\n标准输出通常用于命令的“正常”输出。例如，ls\
    \ 列出文件，因此文件被发送到 STDOUT。\n\nSTDERR\n\n```\nroot@server~# ls anotherfile\nls: cannot\
    \ access 'anotherfile': No such file or directory\n```\n\n标准错误（顾名顾名思义）用于输出错误消息。因为这条消息不是文件列表，所以它被发送到\
    \ STDERR。\n\nSTDIN、STDOUT 和 STDERR 是三个标准流。它们通过数字而不是名称被 shell 识别为：\n\n- 0 = 标准输入\
    \ (Standard in)\n- 1 = 标准输出 (Standard out)\n- 2 = 标准错误 (Standard error)\n\n默认情况下，STDIN\
    \ 附加到键盘，STDOUT 和 STDERR 都显示在终端上。然而，我们将 STDOUT 或 STDERR 重定向到任何我们需要的地方。例如，假设你只需要标准输出，并抑制所有打印在标准错误上的错误消息。这就是我们使用描述符\
    \ 1 和 2 的时候。\n\n## 将 STDERR 重定向到 /dev/null\n\n参考之前的示例\n\n```\nroot@server~# ls\
    \ anotherfile 2>/dev/null\nroot@server~#\n```\n\n在这种情况下，如果有任何 STDERR，它将被重定向到 /dev/null（一个忽略写入其中任何内容的特殊文件），因此你不会在\
    \ shell 上看到任何错误输出。\n\n## 第 10 章：控制结构\n\n| 传递给 or 或 test 的参数 | 详情 |\n| :--- | :---\
    \ | :--- |\n| 文件操作符 | | |\n| -e `$file` | | 如果文件存在则返回真。 |\n| -d `$file` | | 如果文件存在且是目录则返回真。\
    \ |\n| -f `$file` | | 如果文件存在且是普通文件则返回真。 |\n| -h `$file` | | 如果作为符号链接存在则返回真。 |\n\
    | 字符串比较符 | | |\n| -z `$str` | | 如果字符串长度为零则返回真。 |\n| -n `$str` | | 如果字符串长度不为零则返回真。\
    \ |\n| `$str = $str2` | | 如果 $str 等于 $str2 则为真。 |\n| `$str != $str2` | | 如果字符串不等则为真。\
    \ |\n| 整数比较符 | | |\n| `$int1 -eq $int2` | | 如果整数相等则为真。 |\n| `$int1 -ne $int2`\
    \ | | 如果整数不等则为真。 |\n| `$int1 -gt $int2` | | 如果 int1 大于 int2 则为真。 |\n| `$int1 -ge\
    \ $int2` | | 如果 int1 大于或等于 int2 则为真。 |\n| `$int1 -lt $int2` | | 如果 int1 小于 int2\
    \ 则为真。 |\n| `$int1 -le $int2` | | 如果 int1 小于或等于 int2 则为真。 |\n\n## 第 10.1 节：命令的条件执行\n\
