- md: "\n## Chapter 25: Math\n\n## Section 25.1: Math using dc\n\ndc is one of the\
    \ oldest programs on Unix.\n\nIt uses reverse polish notation, which means that\
    \ you first stack numbers, then operations. For example 1+1 is written as 1 1.\n\
    \nTo print element from the top of the stack command p\n\n```bash\necho '2 3 +\
    \ p' | dc\n5\n```\n\nor\n\n```bash\ndc <<< '2 3 + p'\n5\n```\n\nYou can print\
    \ the top element many times\n\n```bash\ndc <<< '1 1 + p 2 + p'\n2\n4\n```\n\n\
    For negative numbers use _ prefix\n\n```bash\ndc <<< '_ 1 p'\n-1\n```\n\nYou can\
    \ use capital letters from A to F for numbers between 10 and 15 and . as a decimal\
    \ point\n\n```bash\ndc <<< 'A.4 p'\n10.4\n```\n\ndc is using arbitrary precision\
    \ which means that the precision is limited only by the available memory. By default\
    \ the precision is set to 0 decimals\n\nWe can increase the precision using command\
    \ k. 2k will use\n\n```bash\ndc <<< '2k 4 3 / p'\n1.33\n```\n\n```bash\ndc <<<\
    \ '4k 4 3 / p'\n1.3333\n```\n\nYou can also use it over multiple lines\n\n```bash\n\
    dc << EOF\n1 1 +\n3 *\np\nEOF\n```\n\nbc is a preprocessor for dc.\n\n## Section\
    \ 25.2: Math using bash capabilities\n\nArithmetic computation can be also done\
    \ without involving any other programs like this:\n\nMultiplication:\n\n```bash\n\
    echo $((5 * 2))\n10\n```\n\nDivision:\n\n```bash\necho $((5 / 2))\n2\n```\n\n\
    Modulo:\n\n```bash\necho $((5 % 2))\n1\n```\n\nExponentiation:\n\n```bash\necho\
    \ $((5 ** 2))\n25\n```\n\n## Section 25.3: Math using bc\n\nbc is an arbitrary\
    \ precision calculator language. It could be used interactively or be executed\
    \ from command line.\n\nFor example, it can print out the result of an expression:\n\
    \n```bash\necho '2 + 3' | bc\n5\n```\n\n```bash\necho '12 / 5' | bc\n2\n```\n\n\
    For floating-point arithmetic, you can import standard library bc -l:\n\n```bash\n\
    echo '12 / 5' | bc -l1\n2.400000000000000000000\n```\n\nIt can be used for comparing\
    \ expressions:\n\n```bash\necho '8 > 5' | bc\n1\n```\n\n```bash\necho '10 == 11'\
    \ | bc\n0\n```\n\n```bash\necho '10 == 10 && 8 > 3' | bc\n1\n```\n\n## Section\
    \ 25.4: Math using expr\n\nexpr or Evaluate expressions evaluates an expression\
    \ and writes the result on standard output\n\nBasic arithmetics\n\n```bash\nexpr\
    \ 2 + 3\n5\n```\n\nWhen multiplying, you need to escape the * sign\n\n```bash\n\
    expr 2 \\* 3\n6\n```\n\nYou can also use variables\n\n```bash\na=2\nexpr $a +\
    \ 3\n5\n```\n\nKeep in mind that it only supports integers, so expression like\
    \ this\n\n```bash\nexpr 3.0 / 2\n```\n\nwill throw an error expr: not a decimal\
    \ number: '3.0'.\n\nIt supports regular expression to match patterns\n\n```bash\n\
    expr 'Hello World' : 'Hell\\(.*\\)r'\no Wo\n```\n\nOr find the index of the first\
    \ char in the search string\n\n> This will throw error: syntax error on Mac OS\
    \ X, because it uses BSD expr which does not have the index command, while expr\
    \ on Linux is generally GNU expr\n\n```bash\nexpr index hello 1\n3\n```\n\n```bash\n\
    expr index 'hello' 'lo'\n3\n```\n\n## Chapter 26: Bash Arithmetic\n\n| Parameter\
    \ | Details |\n|-----------|---------|\n| EXPRESSION | Expression to evaluate\
    \ |\n\n## 26.1: Simple arithmetic with (( ))\n\n```bash\n#!/bin/bash\necho $((\
    \ 1 + 2 ))\n```\n\nOutput: 3\n\n```bash\n# Using variables\n#!/bin/bash\nvar1=4\n\
    var2=5\noutput=$((var1 + $var2))\nprintf \"%d\\n\" \"$output\"\n```\n\nOutput:\
    \ 20\n\n## Section 26.2: Arithmetic command\n\n+ - let num=1+2\n\n```bash\nlet\
    \ num=1+2\nlet num=\"1+2\"\nlet 'num=1 + 2'\nlet num=1; num+=2\n```\n\nYou need\
    \ quotes for spaces or globbing characters. Those will get error:\n\n```bash\n\
    let num = 1 + 2      #wrong\nlet num = '1 + 2'     #right\nlet a[1] = 1 + 1  \
    \    #wrong\nlet 'a[1] = 1 + 1'    #right\n```\n\n+ - (( ))\n\n```bash\n((a=$a+1))\
    \          #add 1 to a\n((a = a + 1))      #like above\n((a += 1))           #like\
    \ above\n```\n\nWe can use (( )) in if. Some Example:\n\n`if (( a > 1 )); then\
    \ echo \"a is greater than 1\"; fi`\n\nThe output of (( )) can be assigned to\
    \ a variable: \n\nOr used directly in output:\n\n```bash\necho \"The result of\
    \ a + 1 is $((a + 1))\"\n```\n\n## Section 26.3: Simple arithmetic with expr\n\
    \n```bash\n#!/bin/bash\nexpr 1 + 2\n```\n\nOutput: 3\n\n## Chapter 27: Scoping\n\
    \n## Section 27.1: Dynamic scoping in action\n\nDynamic scoping means that variable\
    \ lookup occur in the scope where it is called.\n\n```bash\n$ x=3\nfunc1 () {\
    \ echo \"in func1: $x\"; }\nfunc2 () { local x=9; func1; }\n$ func2\nin func1:\
    \ 3\n```\n\nIn lexically scoped, func1 would always look in the global scope for\
    \ the value of x, because func1 is defined in the local scope. In dynamically\
    \ scoped, func1 looks in the scope where it is called. When called from within\
    \ func2, it first looks in the body of func2 for x. If it weren't defined there,\
    \ it would look in the global scope, where func2 was called.\n\n## Chapter 28:\
    \ Process substitution\n\n## Section 28.1: Compare two files\n\nThe following\
    \ compares two files using process substitution instead of creating temporary\
    \ files.\n\n```bash\ndiff <(curl http://example.com/page1) <(curl http://example.com/page2)\n\
    ```\n\n## Section 28.2: Feed a loop with the output of a command\n\nThis feeds\
    \ a loop with the output of grep command:\n\n```bash\nwhile IFS= read -r user;\
    \ do\n  echo \"$user\"\ndone <(grep \"hello\" /etc/passwd)\n```\n\n## Section\
    \ 28.3: Concatenating files\n\nIt is well known that you use the same file for\
    \ input and output in the command. For instance,\n\n```bash\n$ cat header.txt\
    \ > body.txt\n```\n\ndoesn't work as you want. The cat reads body.txt, it has\
    \ already been truncated by the redirection and is empty. The final result will\
    \ be the contents of header.txt only.\n\nOne might think to avoid this with process\
    \ substitution, that is,\n\n```bash\n$ cat header.txt <(cat body.txt) > body.txt\n\
    ```\n\nwill force the contents of body.txt to be saved in some buffer before the\
    \ file is truncated. The only way to prepend a file to another is to create an\
    \ intermediate one:\n\n```bash\n$ cat header.txt > body.txt.new\n$ mv body.txt.new\
    \ body.txt\n```\n\nwhich is what sed or perl or similar programs do under the\
    \ edit-in-place option (usually -i).\n\n## Section 28.4: Stream a file through\
    \ multiple programs at once\n\nThis counts the number of lines in a file while\
    \ simultaneously compressing it with gzip. Both run concurrently.\n\n```bash\n\
    tee >(wc -l>&2) | gzip > bigfile.gz\n```\n\nNormally tee writes its input to one\
    \ or more files (stdout). We can write to commands instead of files with tee (command).\
    \ Here the command wc counts the lines from tee (which in turn is reading from\
    \ bigfile). The line count is sent to stderr (&2 to avoid mixing the input to\
    \ gzip.) The stdout of tee is simultaneously fed into gzip.\n\n## Section 28.5:\
    \ With paste command\n\n```bash\n# Process substitution with paste command is\
    \ common\n# To compare the contents of two directories\npaste <(ls /path/to/directory1)\
    \ <(ls /path/to/directory2)\n```\n\n## Section 28.6: To avoid usage of a sub-shell\n\
    \nOne major aspect of process substitution is that it lets us avoid usage of a\
    \ sub-shell when piping commands together. This can be demonstrated with a simple\
    \ example below. I have the following files in my current folder:\n\n```bash\n\
    $ find -maxdepth 1 -type f -print\nfoo bar foobar foozoo barzoo\n```\n\nIf I pipe\
    \ to a while/read that increments a counter as follows:\n\n```bash\ncount=0\n\
    find . -maxdepth 1 -type f -print | while IFS= read -r _; do\n  ((count++))\n\
    done\necho $count\n```\n\ncount does not contain 5, because it was modified in\
    \ the sub-shell shell context. Any of the commands shown below are in a sub-shell\
    \ sub-shell context:\n\n```bash\ncommand &\n  command | command\n  ( command )\n\
    ```\n\nProcess substitution will solve the problem by avoiding use of the pipe\
    \ | operator as in\n\n```bash\ncount=0\nwhile IFS= read -r _; do\n  ((count++))\n\
    done <(find . -maxdepth 1 -type f -print)\n```\n\nThis will retain the count variable\
    \ value as no sub-shells are invoked.\n\n## Chapter 29: Programmable completion\n\
    \n## Section 29.1: Simple completion using function\n\n```bash\n_mycompletion()\
    \ {\n  local command_name=\"$1\" # not used in this example\n  local current_word=\"\
    $2\"\n  local previous_word=\"$3\" # not used in this example\n  # COMPREPLY is\
    \ an array that be filled with the possible completions\n  # compgen is used to\
    \ filter matching completions\n  COMPREPLY=$($compgen -W 'hello world' -- \"$current_word\"\
    )\n}\ncomplete -F _mycompletion mycommand\n```\n\nUsage Example:\n\n```\n$ command\
    \ [TAB]\nhello world\n$ command h[TAB]\n$ command hello\n```\n\n## Section 29.2:\
    \ Simple completion for options and filenames\n\n```bash\n# The following shell\
    \ function will be used to generate completions\n# the \"nuance_tune\" command.\n\
    nuance_tune_opts () {\n  local curr_arg=$prev_arg\n  curr_arg=$($COMP_WORDS[COMP_WORD])\n\
    \  prev_arg=$($COMP_WORDS[COMP_WORD-1])\n\n  # The config option takes a file\
    \ arg, so get list of the files in the\n# current dir. A case statement is probably\
    \ unnecessary here, but leaves\n# room to customize the parameters for other flags.\n\
    \  case \"$curr_arg\" in\n    --config)\n      COMPREPLY=$($ /bin/ls -1 ))\n \
    \     return 0\n  esac\n\n  # compgen to provide completions for all known options.\n\
    \  COMPREPLY=$($compgen -W '-analyze-experiment -generate-groups -compute-thrash\
    \ -config-output -help -usage -force-grammar-overrides -begin-end-date -group\
    \ -dataset-multiparases dump_records -no_index -confidencelevel -nsecs -dry-run\
    \ -rec_scripts_only -save_temp -full_trc single_session -verbose -ep -unsupervised-write_manifest\
    \ -remap -noreparse -upload -reference -target -use_only_matching -histogram-stepsize'\
    \ -- \"$curr_arg ))\n}\n\n# The -o parameter tells Bash to process completions\
    \ as filenames, where applicable.\ncomplete -o filenames -F _nuance_tune_opts\
    \ nuance_tune\n```\n"
  mdcn: "\n\n## 第 25 章：数学\n\n## 第 25.1 节：使用 dc 数\n\ndc 是 Unix 上最老的程序之一。\n\n它使用逆波兰表示法（reverse\
    \ polish notation），这意味着你首先将数字入栈，然后进行操作。例如，1+1 被写作 1 1。\n\n使用命令 p 打印栈顶元素\n\n```bash\n\
    echo '2 3 + p' | dc\n5\n```\n\n或者\n\n```bash\ndc <<< '2 3 + p'\n5\n```\n\n你可以多次打印栈顶元素\n\
    \n```bash\ndc <<< '1 1 + p 2 + p'\n2\n4\n```\n\n负数使用 _ 符号前缀\n\n```bash\ndc <<<\
    \ '_ 1 p'\n-1\n```\n\n你可以使用 A 到 F 大写字母表示 10 到 15 之间的数字，并使用 . 作为小数点\n\n```bash\n\
    dc <<< 'A.4 p'\n10.4\n```\n\ndc 使用任意精度，这意味着精度仅限于可用内存。默认情况下，精度设置为 0 位小数。\n\n我们可以使用命令\
    \ k 来增加精度。2k 将使用\n\n```bash\ndc <<< '2k 4 3 / p'\n1.33\n```\n\n```bash\ndc <<<\
    \ '4k 4 3 / p'\n1.3333\n```\n\n你也可以跨多行使用它\n\n```bash\ndc << EOF\n1 1 +\n3 *\n\
    p\nEOF\n```\n\nbc 是 dc 的预处理器。\n\n## 第 25.2 节：使用 bash 能力进行数学\n\n算术计算也可以不涉及任何其他程序完成完成如下：\n\
    \n乘法：\n\n```bash\necho $((5 * 2))\n10\n```\n\n除法：\n\n```bash\necho $((5 / 2))\n\
    2\n```\n\n取模：\n\n```bash\necho $((5 % 2))\n1\n```\n\n幂运算：\n\n```bash\necho $((5\
    \ ** 2))\n25\n```\n\n## 第 25.3 节：使用 bc 进行数学\n\nbc 是一种任意精度计算器语言。它可以以交互方式使用，也可以从命令行执行。\n\
    \n例如，它可以打印表达式的结果：\n\n```bash\necho '2 + 3' | bc\n5\n```\n\n```bash\necho '12 /\
    \ 5' | bc\n2\n```\n\n对于浮点算术，你可以导入标准库 bc -l：\n\n```bash\necho '12 / 5' | bc -l\n\
    2.400000000000000000000\n```\n\n它可以用于比较表达式：\n\n```bash\necho '8 > 5' | bc\n1\n\
    ```\n\n```bash\necho '10 == 11' | bc\n0\n```\n\n```bash\necho '10 == 10 && 8 >\
    \ 3' | bc\n1\n```\n\n## 第 25.4 节：使用 expr 进行数学\n\nexpr 或 Evaluate expressions 用于求表达式的值并将结果写入标准输出。\n\
    \n基础算术\n\n```bash\nexpr 2 + 3\n5\n```\n\n在乘法时，你需要转义 * 号\n\n```bash\nexpr 2 \\\
    * 3\n6\n```\n\n你也可以使用变量\n\n```bash\na=2\nexpr $a + 3\n5\n```\n\n请记住，它只支持整数，所以像这样的表达式\n\
    \n```bash\nexpr 3.0 / 2\n```\n\n将会报错错误 expr: not a decimal number: '3.0'。\n\n\
    它支持正则表达式来匹配模式\n\n```bash\nexpr 'Hello World' : 'Hell\\(.*\\)r'\no Wo\n```\n\n\
    或者查找搜索字符串中第一个字符的索引\n\n> 这在 Mac OS X 上会报错：syntax error，因为它使用的是 BSD 版本的 expr，该版本没有\
    \ index 命令，而 Linux 上的 expr 通常是 GNU expr。\n\n```bash\nexpr index hello 1\n3\n```\n\
    \n```bash\nexpr index 'hello' 'lo'\n3\n```\n\n## 第 26 章：Bash 算术\n\n| 参数 | 详情 |\n\
    |-----------|---------|\n| EXPRESSION | 要求值的表达式 |\n\n## 26.1：使用 (( )) 进行简单算术\n\
    \n```bash\n#!/bin/bash\necho $(( 1 + 2 ))\n```\n\n输出：3\n\n```bash\n# 使用变量\n#!/bin/bash\n\
    var1=4\nvar2=5\noutput=$((var1 + $var2))\nprintf \"%d\\n\" \"$output\"\n```\n\n\
    输出：20\n\n## 26.2：算术命令\n\n+ - let num=1+2\n\n```bash\nlet num=1+2\nlet num=\"1+2\"\
    \nlet 'num=1 + 2'\nlet num=1; num+=2\n```\n\n对于空格或通配符字符需要引号。这些会导致错误：\n\n```bash\n\
    let num = 1 + 2      # 错误\nlet num = '1 + 2'     #正确\nlet a[1] = 1 + 1      #\
    \ 错误\nlet 'a[1] = 1 + 1'    #正确\n```\n\n+ - (( ))\n\n```bash\n((a=$a+1))     \
    \     #给 a 加 1\n((a = a + 1))      #同上\n((a += 1))           #同上\n```\n\n我们可以在\
    \ if 中使用 (( ))。一些示例如：\n\n`if (( a > 1 )); then echo \"a is greater than 1\"; fi`\n\
    \n(( )) 的输出可以赋值给变量： \n\n或者直接在输出中使用：\n\n```bash\necho \"The result of a + 1 is\
    \ $((a + 1))\"\n```\n\n## 26.3：使用 expr 进行简单算术\n\n```bash\n#!/bin/bash\nexpr 1\
    \ + 2\n```\n\n## 第 27 章：作用域\n\n## 27.1：动态作用域\n\n动态作用域意味着变量查找发生在调用它的地方。\n\n```bash\n\
    $ x=3\nfunc1 () { echo \"in func1: $x\"; }\nfunc2 () { local x=9; func1; }\n$\
    \ func2\nin func1: 3\n```\n\n在静态作用域，func1 会在全局作用域查找 x 的值，因为 func1 定义在局部作用域。在动态作用域中，func1\
    \ 在调用它的地方查找。当在 func2 内部调用时，它首先在 func2 的体中查找 x。如果那里没有定义，它会在全局作用域查找。\n\n## 第 28\
    \ 章：进程替换\n\n## 28.1：比较两个文件\n\n使用进程替换而不是创建临时文件来比较两个文件\n\n```bash\ndiff <(curl://example.com/page1)\
    \ <(curl://example.com/page2)\n```\n\n## 28.2：将命令的输出供给循环\n\n将 grep 命令的输出供给循环：\n\
    \n```bash\nwhile IFS= read -r user; do\n  echo \"$user\"\ndone <(grep \"hello\"\
    \ /etc/passwd)\n```\n\n## 28.3：合并文件\n\n众周知，你在命令的输入和输出中使用同一个文件。例如\n\n```bash\n\
    $ cat header.txt > body.txt\n```\n\n并没有按你想要的方式。cat 读取了 body.txt，它已经被重定向清空。最终结果只有\
    \ header.txt 的内容。你可能认为通过进程替换可以避免这种情况，即\n\n```bash\n$ cat header.txt <(cat body.txt)\
    \ > body.txt\n```\n\n这将 body.txt 的内容在文件被截断之前保存到缓冲区中。向另一个文件添加内容的方法是创建一个中间文件：\n\n\
    ```bash\n$ cat header.txt > body.txt.new\n$ mv body.txt.new body.txt\n```\n\n\
    这就是 sed 或 perl 等程序在原地编辑选项下做的。\n\n## 28.4：通过多个程序流文件\n\n在压缩文件的同时使用 gzip 统计行数。两者并发运行。\n\
    \n```bash\ntee >(wc -l>&2) | gzip > bigfile.gz\n```\n\n通常 tee 将其输入写入一个或多个文件（stdout）。我们可以向命令而不是文件写入\
    \ tee（command）。这里命令 wc 统计来自 tee 的行（tee 正在读取 bigfile）。行数发送到 stderr（避免与 gzip 的输入混合）。tee\
    \ 的 stdout 同时供给 gzip。\n\n## 28.5：使用 paste 命令\n\n```bash\n# 使用 paste 命令进程替换很常见\n\
    # 比较两个目录的内容\npaste <(ls /path/to/directory1) <(ls /path/to/directory2)\n```\n\n\
    ## 28.6：避免使用子 shell\n\n进程替换的一个方面是允许我们在管道命令时避免使用子 shell。可以通过下面的示例演示。我的当前文件夹中有以下文件：\n\
    \n```bash\n$ find -maxdepth 1 -type f -print\nfoo bar foobar foozoo barzoo\n```\n\
    \n如果我将其到一个如下增加计数器的 while/read：\n\n```bash\ncount=0\nfind . -maxdepth 1 -type f\
    \ -print | while IFS= read -r _; do\n  ((count++))\ndone\necho $count\n```\n\n\
    count 不包含 5，因为它在子 shell shell 上文中被修改了。下面显示的任何命令都在子 shell 子 shell 上文中：\n\n```bash\n\
    command &\n  command | command\n  ( command )\n```\n\n进程替换通过避免使用管道 | 运算符来解决这个问题，如下\n\
    \n```bash\ncount=0\nwhile IFS= read -r _; do\n  ((count++))\ndone <(find . -maxdepth\
    \ 1 -type f -print)\n```\n\n这将保留 变量的值，因为没有调用子 shell。\n\n## 第 29 章：可编程补全\n\n##\
    \ 第 29.1：使用函数的简单补全\n\n```bash\n_mycompletion() {\n  local command_name=\"$1\"\
    \ # 示例中未使用\n  local current_word=\"$2\"\n  local previous_word=\"$3\" # 示例中未使用\n\
    \  # COMPREPLY 是一个填充了可能补内容的数组\n  # compgen 用于过滤匹配的补全\n  COMPREPLY=$($compgen -W\
    \ 'hello world' -- \"$current_word\")\n}\ncomplete -F _mycompletion mycommand\n\
    ```\n\n用法示例：\n\n```\n$ command [TAB]\nhello world\n$ command h[TAB]\n$ command\
    \ hello\n```\n\n## 第 29.2 节：选项和文件名的简单补全\n\n```bash\n# 下面的 shell 函数将用于生成\n# \"\
    nuance_tune\" 命令的补全\nnuance_tune_opts () {\n  local curr_arg=$prev_arg\n  curr_arg=$($COMP_WORDS[COMP_WORD])\n\
    \  prev_arg=$($COMP_WORDS[COMP_WORD-1])\n\n  # config 接受一个文件参数，因此获取当前目录的文件列表。\n\
    \  # 在这里可能不需要 case 语句，但为其他标志自定义参数留了空间。\n  case \"$curr_arg\" in\n    --config)\n\
    \      COMPREPLY=$($ /bin/ls -1 ))\n      return 0\n  esac\n\n  # compgen 为所有已知选项提供补全。\n\
    COMPREPLY=$($compgen -W '-analyze-experiment -generate-groups -compute-thrash\
    \ -config-output -help -usage -force-grammar-overrides -begin-end-date -group\
    \ -dataset-multiparases dump_records -no_index -confidencelevel -nsecs -dry-run\
    \ -rec_scripts_only -save_temp -full_trc single_session -verbose -ep -unsupervised-write_manifest\
    \ -remap -noreparse -upload -reference -target -use_only_matching -histogram-stepsize'\
    \ -- \"$curr_arg ))\n}\n\n# -o 参数告诉 Bash 将补全处理为文件名（如果适用）。\ncomplete -o filenames\
    \ -F _nuance_tune_opts nuance_tune\n```\n\n"
