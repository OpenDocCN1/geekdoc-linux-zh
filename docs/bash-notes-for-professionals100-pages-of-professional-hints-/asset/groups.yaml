    # Section 10.1: Conditional execution of command lists


    How to use conditional execution of command lists


    Any builtin command, expression, or function, as well as any external command
    or script can be executed conditionally using the `&&(and)` and `||(or)` operators.


    For example, this will print the current directory if the cd command was successful.


    ```

    cd my_directory && pwd

    ```


    Likewise, this will exit if the cd command fails, preventing catastrophe:


    ```

    cd my_directory || exit

    rm -f *

    ```


    When combining multiple statements in this manner, it''s important to remember
    that (unlike C-style languages) `these operators have no precedence and are left-associative.`


    Thus, this will work as expected...


    ```

    cd my_directory && pwd || echo "No such directory"

    ```


    +   - If the cd succeeds, the `&& pwd` executes and the current working directory
    name is printed. Unless pwd fails (rarity) `|| echo ...` will not be executed.

    - If the cd fails, the `&& pwd` will be skipped and the `|| echo ...` will run.


    But this will not (if you''re thinking `if...then...else`)...)'
  - "[PAGE 43]\n\n```\ncd my_directory && ls || echo \"No such directory\"\n```\n\n\
    +   - if the cd fails, the && ls is skipped and || echo ... is executed.\n- if\
    \ the cd succeeds, the && ls is executed.\n  - if the ls succeeds, the || echo\
    \ ... is ignored. (so far as good)\n  - BUT... if the ls fails, the || echo ...\
    \ will also be executed.\n\nIt is the ls, not the cd, that is the previous command.\n\
    \n# Use conditional execution of command lists\n\nConditional expression is a\
    \ faster than if... then its main advantage is allowing functions and scripts\
    \ to exit early, or \"short circuit\".\n\nUnlike many languages like C where memory\
    \ is explicitly allocated for structs and variables and such (and thus must be\
    \ deallocated), bash handles this under covers. In most cases, we do not have\
    \ to clean up anything before leaving the function. A return statement will deallocate\
    \ everything to the function and pickup execution at the return address on the\
    \ stack.\n\nReturning from functions or exiting scripts as soon as possible can\
    \ significantly improve performance and reduce system load by avoiding the unnecessary\
    \ execution of code. For example...\n\n```\nmy_function () {\n```\n\n```\n###\
    \ ALWAYS CHECK THE RETURN CODE\n\n# one argument required. \" evaluates to false(1)\n\
    [[ \"$1\" || return 1 ]]\n\n# work with the argument. exit on failure\ndo_something_with\
    \ \"$1\" || return 1\ndo_something_else || return 1\n\n# Success! no failures\
    \ detected, or we wouldn't be here\nreturn 0\n}\n```\n\n# Section 1.2: If statement\n\
    \n```\nif [[ $1 -eq 1 ]]; then\n  echo \"1 was passed in the first parameter\"\
    \nelif [[ $1 -gt 2 ]]; then\n  echo \"2 was not passed in the first parameter\"\
    \nelse\n  echo \"The first parameter was not 1 and is not more than 2.\"\nfi\n\
    ```\n\nThe semicolons fi is necessary, but the and/or the else clauses can be\
    \ omitted.\nThe semicolon before then are standard syntax for combining two commands\
    \ on a single line; they can be omitted only if then is moved to the next line.\n\
    \nIt's important to understand that the brackets [[ are not part of the syntax,\
    \ but are treated as a command; the exit code from this command is being. Therefore,\
    \ you must always include spaces around the brackets."
