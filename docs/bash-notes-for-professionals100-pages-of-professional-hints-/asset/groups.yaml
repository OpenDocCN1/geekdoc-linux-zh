- md: "\n```bash\nlocal OPTIND OPTARG status\n\nstatus=1\nOPTIND=1\n\nwhile getopts\
    \ 'x:' OPTION; do\n  case $OPTION in\n    x) status=\"${OPTARG}\";\n    *) 1>&2\
    \ printf 'failwith:%s: Unsupported option.\\n' \"${OPTION}\";\n  esac\ndone\n\n\
    shift $((OPTIND - 1))\n{\n  printf 'Failure: '\n  printf \"$@\"\n  printf '\\\
    n'\n  1>&2\n  exit \"${status}\"\n}\n```\n\nThis function can be used as follows:\n\
    \nfailwith %s: File not found. \"${filename}\"\nfailwith -x 70 'General internal\
    \ error.'\n\nand so on.\n\nNote that for printf, variables should not be used\
    \ as first argument. If the message to print consists of the content of a value,\
    \ one should use the %s specifier to print it, like in\n\nfailwith '%s' \"${message}\"\
    \n\n## Section 14.4: Print the function definition\n\n```bash\ngetfunc() {\n \
    \ declare -f \"$@\"\n}\n\nfunction func() {\n  echo \"I am a sample function\"\
    \n}\n\nfuncd=$(getfunc func)\ngetfunc func # or echo \"$funccd\"\n```\n\nOutput:\n\
    \n```bash\nfunc() {\n{\n  echo \"I am a sample function\"\n}\n}\n```\n\n## Section\
    \ 14.5: A function that accepts named parameters\n\n```bash\nfoo() {\n  while\
    \ [[ $# -gt 0 ]]; do\n    case $1 in\n      -f|--follow)\n        local FOLLOW=\"\
    following\"\n        ;;\n      -t|--tail)\n        local TAIL=\"tail=$2\"\n  \
    \      ;;\n    esac\n    shift\n  done\n\n  echo \"FOLLOW: $FOLLOW\"\n  echo \"\
    TAIL: $TAIL\"\n}\n```\n\nExample usage:\n\n```bash\nfoo -f\nfoo -t 10\nfoo -f\
    \ --tail 10\nfoo --follow --tail 10\n```\n\n## Section 14.6: Return value from\
    \ a function\n\nThe return statement in Bash doesn't return a value like C-functions,\
    \ instead it exits the function with a return status. You can think of it as the\
    \ exit status of that function.\n\nIf you want to return a value from the function\
    \ then send the value to stdout like this:\n\n```bash\nfun() {\n  local var=\"\
    Sample value to be returned\"\n  echo \"$var\"\n  printf \"%s\\n\" \"$var\"\n\
    }\n```\n\nNow, if you do:\n\n```bash\nvar=$(fun)\n```\n\nthe output of fun will\
    \ be stored in $var.\n\n## Section 14.7: The exit code of a function is the exit\
    \ code of its last command\n\nConsider this example function to check if a host\
    \ is up:\n\n```bash\nis_alive() {\n  ping -c \"$1\" & /dev/null\n}\n```\n\nThis\
    \ function sends a single ping to the host specified by the first function parameter.\
    \ The output and error output of ping are redirected to /dev/null, so the function\
    \ will never output anything. But the ping command will have exit code 0 on success,\
    \ and non-zero on failure. This is the last (and in this example, the only) command\
    \ of the function, the exit code of ping will be reused for the exit code of the\
    \ function itself.\n\nThis fact is very useful in conditional statements.\n\n\
    For example, if host graucho is up, then connect to it with `ssh:`\n\n```bash\n\
    if is_alive graucho; then\n  ssh graucho\nfi\n```\n\nAnother example: repeatedly\
    \ check until host graucho is up, then connect to it with `ssh:`\n\n```bash\n\
    while ! is_alive graucho; do\n  sleep 5\ndone\nssh graucho\n```\n\n## Chapter\
    \ 15: Bash Parameter Expansion\n\nThe $ character introduces parameter expansion,\
    \ command substitution, or arithmetic expansion. The parameter name or symbol\
    \ of expansion may be enclosed in braces, which are optional but serve to protect\
    \ the variable from expanded from characters immediately following it which could\
    \ be interpreted as part of the name.\n\nRead more in the [Bash User Manual]().\n\
    \n## Section 15.1: Modifying the case of alphabetical characters\n\nTo uppercase\n\
    \n```bash\n$ v='hello'\n# Just the first character\n$ printf '%s\\n' \"${v}\"\n\
    Hello\n# All characters\n$ printf '%s\\n' \"${v^^}\"\nHELLO\n# Alternative\n$\
    \ v='hello world'\n$ declare -u string=\"$v\"\n$ echo \"$string\"\nHELLO WORLD\n\
    ```\n\nTo lowercase\n\n```bash\n$ v='BYE'\n# Just the first character\n$ printf\
    \ '%s\\n' \"${v}\"\nbyE\n# All characters\n$ printf '%s\\n' \"${v,,}\"\nbye\n\
    # Alternative\n$ v='HELLO WORLD'\n$ declare -l string=\"$v\"\n$ echo \"$string\"\
    \nhello world\n```\n\nToggle Case\n\n```bash\n$ v='Hello World'\n# All chars\n\
    $ echo \"${v~}\"\nHELLO WORLD\n$ echo \"${v^}\"\n# Just the first char\nhello\
    \ World\n```\n\n## Section 15.2: Length of parameter\n\n```bash\n# Length of a\
    \ string\n$ var='12345'\n$ echo \"${#var}\"\n```\n\nNote that it's the length\
    \ in number of characters which is not necessarily the same as the number of bytes\
    \ (like in UTF-8 where most characters are encoded in more than one byte), nor\
    \ the number of glyphs/graphemes (some of characters, which are combinations of\
    \ characters), nor is it necessarily the same as display width.\n\n```bash\n#\
    \ Number of elements\n$ myarr=(1 2 3)\n$ echo \"${myarr[@]}\"\n```\n\n# Works\
    \ for positional parameters (and other shells), one would use\n\n```bash\n$ set\
    \ -- 1 2 3\necho \"$#}\"\n```\n\n## Section 15.3: Replace pattern in string\n\n\
    First match:\n\n```bash\n$ a='I am a string'\necho \"${a/a}\"\n# m string\n```\n\
    \nAll matches:\n\n```bash\n$ echo \"${a//a}\"\n# m string\n```\n\nMatch at the\
