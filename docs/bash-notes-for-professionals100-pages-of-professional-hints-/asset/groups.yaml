    \ (216.58.197.78) icmp_seq=2 ttl=57 time=30.9 ms\n64 bytes from maa03s21-in-f14.le100.net\
    \ (216.58.197.78) icmp_seq=3 ttl=57 time=34.7 ms\n64 bytes from maa03s21-in-f14.le100.net\
    \ (216.58.197.78) icmp_seq=4 ttl=57 time=39.6 ms\n64 bytes from maa03s21-in-f14.le100.net\
    \ (216.58.197.78) icmp_seq=5 ttl=57 time=32.7 ms\n\n--- google.com ping statistics\n\
    5 packets transmitted, 5 received, 0% packet loss, time 407ms\ntr min/avg/max/mdev\
    \ = 29.342/23.401/39.631/3.576 ms\n\n$/pingmap -v\npingmap version 1.0.0\n$/pingmap\
    \ -h\nInvalid option ?\nUsage:\npingmap -n[t|i[p]|v]\n$/pingmap -v\npingmap version\
