    # # Bash

    Notes for Professionals


    # Chapter 12: Arrays


    Section 12.1: Array Assignments


    List Assignment


    ```

    myarray=(1 2 3 4 5)

    ```


    If you want to assign values to specific array elements, use the following syntax:


    ```

    myarray[0]=6

    myarray[1]=7

    ```


    Create array with new values


    ```

    myarray+=(6 7 8)

    ```


    Subscript Assignment


    To assign a value to an existing index,


    ```

    myarray[2]="value"

    ```


    Assignment by index


    ```

    myarray[1]="new value"

    ```


    Deletion


    ```

    unset myarray[1]

    ```


    To remove all elements from the array,


    ```

    unset myarray

    ```


    # Chapter 21: Quoting


    Section 21.1: Double quotes for variable and command substitution


    Variable substitution should only occur inside double quotes.


    Double quotes allow the expansion of variables but preserve the literal value
    of most special characters except $, and backticks.


    ```

    name="John Doe"

    echo "$name"

    ```


    Double quotes also allow command substitution.


    ```

    echo "$(date)"

    ```


    Double quotes do not prevent word splitting and globbing.


    ```

    echo "$@"

    #"

    ```


    Section 21.2: Difference between double quote and single quote


    Double quotes


    +   - Allow variable expansion


    +   - Allow command substitution


    +   - Allow word splitting and globbing


    Single quotes


    +   - Prevent all variable expansion


    +   - Prevent command substitution


    +   - Prevent word splitting and globbing


    # Chapter 36: Internal variables


    Section 36.1: Internal variables at a glance


    Internal variables are special variables used by Bash to store various information.


