    \ newlines (and read -r will leave trailing whitespace). You can fix this by turning\
    \ around:\n\n```bash\nfind -type d -exec bash -c 'for f; do mv \"$f\" \"$(f//\
    \ /)\"; done' {} +\n```\n\nThis way, the -exec receives the filenames in a form\
    \ which is completely correct and safe; the bash -c receives them as a number\
    \ of arguments, which will be found in {}; The script will need to make these\
    \ names correct, of course; every variable which contains a filename needs to\
