    \n# 删除匹配字符串的第一个单词\n:s/foo//\n\n# 删除匹配字符串的所有单词\n:gs/foo//\n\n# 删除匹配字符串的最后一个单词\n\
    :sc/foo//\n\n# 删除匹配字符串的最后一个单词\n:sc/foo//\n```\n\n注意，在上一个示例中，我们没有得到 ping，这是一个很棒的游戏，因为传递给上一个命令的最后一个参数是\
    \ pong，我们可以通过添加引号来避免此类问题。继续示例，我们的最后一个参数是 game：\n\n```bash\n$ echo \"it is $ time\"\
    \nit is game time\n$ echo \"hooray, !!\"\nhooray, it is game time!\n```\n\n如果\
    \ HISTCONTROL 包含 ignorespace，你可以通过在命令前加空格来防止命令存储在历史记录中。\n\n### 第 24.2 节：使用替换重复上一个命令\n\
    \n默认搜索匹配模式的最近命令。你可以反复按下它直到找到所需的命令。\n\n### 第 24.4 节：切换到新创建的目录\n\n```bash\n$ mkdir\
    \ backup_download_directory && cd !:#1\nmkdir backup_download_directory && cd\
    \ backup_download_directory\n```\n\n这替换了命令行的参数。在示例中 !:#1 被替换为第一个参数，即 backup_download_directory。\n\
    \n### 第 24.5 节：使用 !$\n\n```bash\n$ echo ping\nping\n$ echo !$\nping\n```\n\n你也可以在此基础上进行重复：\n\
    \n```bash\n$ echo !$ pong\nping pong\n$ echo,$ a great game\npong, a great game\n\
