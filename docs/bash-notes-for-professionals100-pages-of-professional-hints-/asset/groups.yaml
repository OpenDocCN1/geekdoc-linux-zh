    # Chapter 40: File execution sequence


    .bash_profile, .bash_login, .bashrc, and .profile all do pretty much the same
    thing: set up and define functions, variables, and the sorts.


    The main difference is that .bashrc is called at the opening of a non-login but
    interactive window, and .bash_profile and the others are called for a login shell.
    Many people have their .bash_profile or similar call .bashrc anyway.


    # Section 40.1: .profile vs .bash_profile (and .bash_login)


    .profile is read by most shells on startup, including bash. However, .bash_profile
    is used for configurations specific to bash. For general initialization code,
    put it in .profile. If it''s specific to bash, use .bash_profile.


    .profile isn''t actually designed for bash specifically, .bash_profile is though
    instead. (.profile is for Bourne and other similar shells, which bash is based
    off) Bash will fall back to .profile if .bash_profile isn''t found.


    .bash_login is a fallback for .bash_profile, if it isn''t found. Generally best
    to use .bash_profile or .profile instead.'
- md: "\n## Chapter 4: Splitting Files\n\nSometimes it's useful to split a file into\
    \ multiple separate files. If you have large files, it might be a good idea to\
    \ break it into smaller chunks.\n\n### Section 41.1: Split a file\n\nRunning the\
    \ split command without any options will split a file into 1 or more separate\
    \ files containing up to 1000 lines.\n\n```\nsplit file\n```\n\nThis will create\
    \ files named xaa, xab, xac, etc, each containing up to 1000 lines. As you can\
    \ see, all of them are prefixed with the letter x by default. If the initial file\
    \ was less than 1000 lines, only one such file would be created.\n\nTo change\
    \ the prefix, add your desired prefix to the end of the command line\n\n```\n\
    split customprefix\n```\n\nNow files named customprefixaa, customprefixab, customprefixac,\
    \ etc. will be created.\n\nTo specify the number of lines to output per file,\
    \ use the -l option. The following will split a file into a maximum of 5000 lines.\n\
    \n```\nsplit -l 5000 file\n```\n\nOR\n\n```\nsplit --lines=5000 file\n```\n\n\
    Alternatively, you can specify a maximum number of bytes instead of lines. This\
    \ is done by using the -b or --bytes options. For example, to allow a maximum\
    \ of 1MB:\n\n```\nsplit --bytes=1MB file\n```\n\n## Chapter 42: File Transfer\
    \ using scp\n\n### Section 42.1: scp transferring file\n\nTo transfer a file securely\
    \ to another machine - type:\n\n```\nscp file1.txt tom@server2:$HOME\n```\n\n\
    This example presents transferring file1.txt from our host to server2's user tom's\
    \ home directory.\n\n### Section 42.2: scp transferring multiple files\n\nscp\
    \ can also be used to transfer multiple files from one server to another. Below\
    \ is an example of transferring all files from my_folder directory with extension\
    \ .txt to server2. In example all files will be transferred to user home directory.\n\
    \n```\nscp /my_folder/*.txt tom@server2:$HOME\n```\n\n### Section 42.3: Downloading\
    \ file using scp\n\nTo download a file from remote server to the local machine\
    \ - type:\n\n```\nscp tom@server2:$HOME/file.txt /local/machine/path/\n```\n\n\
    This example shows how to download the file named file.txt from user tom's home\
    \ directory to our local machine's current directory.\n\n## Chapter 43: Pipelines\n\
    \n### Section 43.1: Using |\n\n| connects standard output and standard error of\
    \ the first command to the second one while | only connects standard output of\
    \ the first command to the second command. |\n\nIn this example, the page is downloaded\
    \ via curl, with -v option curl writes some info on stderr including the downloaded\
    \ page is written on stdout. Title of page can be between <title> and </title>.\n\
    \n```\ncurl -vs `http://www.google.com/` | awk '/^Host:/{print}/<title>//{match($0,/<title>(.*)<\\\
    title>/,a);print a[1]}'\n```\n\nOutput is:\n\n```\n> Host: www.google.com\nGoogle\n\
    ```\n\nBut with | more information will be printed, i.e. those that are sent to\
    \ stderr because stdout is piped to the next command. In this example all except\
    \ the last line (Google) were sent to stderr by:\n\n```\n* Hostname NOT found\
    \ in dns cache\n* Trying 172.217.20.228...\n* Connected to www.google.com (172.217.20.228)\
    \ port 80 (#0)\n> GET / HTTP/1.1\n> User-Agent: curl/735.0\n> Host: www.google.com\n\
    > Accept: */\n\n* HTTP 1.0 close after body\n< HTTP 200 OK\n< Date: Sun, 24 Jul\
    \ 2016 19:04:59 GMT\n< Cache-Control: private, max-age=0\n< Content-Type: text/html;\
    \ charset=ISO-8859-1\n< P3: CP(This is not a P3 policy!) See\nhttps://www.google.com/support/accounts/151657?hl=en\
    \ for more info.\n> Server:\n< XSS-Protection: 1; mode=block\n< X-Frames: SAMEORIGIN\n\
    < Set-Cookie: ID-v8e2X0Y8ZLPLPEut73lkKNNeVUCcdgB9Ze_C030oIM-\nEoG5QL0MTEAEg16651L1vRYTO00khq4ApFvYfWaoF-\n\
    AEI80088333D3508Aglnc33JnTRBQQelMcUs90qQA;expires=Mon, 23-Jan-2017 19:04:59 GMT;\n\
    path=/; domain=google.com; HttpOnly\n< Accept-Ranges: none\n< Vary: Accept-Encoding\n\
    < X-Cache: MISS from jetbis appliance\n< X-Loop-Control: 5.202.190.187E4F9836653D50812995BA3992F8065\n\
    < Connection: close\n<\n```\n\n```\n{data not shown}\n* Closing 0\nGoogle\n```\n\
    \n### Section 43.2: Show all processes\n\nps -e shows all the processes, its output\
    \ is connected to the input of more via |, less the results.\n\n### Section 43.3:\
    \ Modify output of a command\n\n```\n$ ping -c 1 google.com # unmodified output\n\
    PING google.com (172.217.20.228): 56 bytes of data.\n64 bytes from 172.217.20.228:\
    \ icmp_seq=1 ttl=53 time=47 ms\n$ ping -c 1 google.com | grep -o '[0-9]\\+' #\
    \ modified output\n64 bytes from 172.217.20.228: icmp_seq=1 ttl=53 time=47 ms\n\
    ```\n\nThe pipe (|) connects the stdout of ping to the stdin of grep, which processes\
    \ it immediately. Some commands like sed default to buffering stdin, which means\
    \ it has to receive data before it prints anything, causing delays in further\
    \ processing.\n\n## Chapter 44: Managing PATH variable\n\n| Parameter | Details\
    \ |\n| :--- | :--- |\n| PATH | environment variable |\n\n### Section 44.1: Add\
    \ a path to the PATH environment variable\n\nThe PATH variable is generally defined\
    \ in ~/.bashrc or ~/.bash_profile or /etc/profile or ~/.bashrc (distro specific\
    \ configuration file).\n\n```bash\n$ echo $PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/lib/jvm/jdk1.8.0_292/bin:/lib/jvm/jre/bin\n\
    ```\n\nNow if we want to add a path ~/bin to the PATH variable:\n\n```bash\nPATH=~/bin:$PATH\n\
    ```\n\nBut this will modify the PATH only in the current shell (and subshell).\
    \ Once you exit the shell, this modification will be gone. To make it permanent,\
    \ you need to add that code to the ~/.bashrc (or whatever) file and reload it.\
    \ If you run the following code (in terminal), it will add ~/bin to the PATH permanently:\n\
    \n```bash\necho 'PATH=~/bin:$PATH' >> ~/.bashrc && source ~/.bashrc\n```\n\nExplanation:\n\
    - `PATH=~/bin:$PATH >> ~/.bashrc` adds line `PATH=~/bin:$PATH` at the end of ~/.bashrc\
    \ file (you could do it with a text editor)\n- `source ~/.bashrc` reloads the\
    \ ~/.bashrc file\n\nThis is a bit of code (run in terminal) that will check if\
    \ a path is already included and add the path only if not:\n\n```bash\npath=~/bin\
    \ # path to be included\nbashrc=.bashrc # file to be written and reloaded\n# run\
    \ the following code unmodified\necho $PATH | grep -q \"\\(:|)$path$\" || echo\
    \ \"PATH=$path\" >> \"$bashrc\"\nsource \"$bashrc\"\n```\n\n### Section 44.2:\
    \ Remove a path from the PATH environment variable\n\nTo remove a PATH from PATH\
    \ environment variable, you need to edit ~/.bashrc or ~/.bash_profile or /etc/profile\
    \ or ~/.bashrc (distro specific) file and remove the assignment for that particular\
    \ path. Instead of finding the exact assignment, you could just do a replacement\
    \ in the $PATH in its final stage. The following will safely remove $path from\
    \ $PATH:\n\n```bash\npath=~/bin\nPATH=$(echo $PATH | sed -e \"s|:$path||g\" -e\
    \ \"s|$path||\" -e \"s|^\\:$path||\")\n```\n\nTo make it permanent, you will need\
