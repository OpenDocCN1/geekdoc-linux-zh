    # Section 9.3: Redirecting both STDOUT and STDERR


    File descriptors like 0 and 1 are pointers. We change file descriptors to point
    with redirection. >/dev/null

    1 points to /dev/null.


    First we point 1 (STDOUT) to /dev/null then point 2 (STDERR) to whatever it points
    to.


    ```

    # STDERR is redirect to STDOUT: redirected to /dev/null

    # effectively redirecting both STDERR and STDOUT to /dev/null

    echo hello > /dev/null 2&1

    Version 4.0

    ```


    This can be further shortened to the following:


    ```

    echo ''hello'' & /dev/null

    ```


    However, this may be undesirable in production if shell compatibility is a concern
    as it conflicts with POSIX, introduces parsing ambiguity, and shells without will
    misinterpret:


    ```

    # Actual code

    echo ''hello'' & /dev/null

    echo ''hello'' & /dev/null ''goodbye''


    # Desired behavior

    echo ''hello'' > /dev/null 2&1

    echo ''hello'' > ''goodbye'' > /dev/null 2&1


    # Actual behavior

    echo ''hello'' &

    echo ''hello'' & goodbye > /dev/null

    ```


    NOTE:2&1 is known to work as desired in both Bash and Zsh.


    # Section 9.4: Using named pipes


    Sometimes you may want to output something by one program and input it into another
    program, but can''t use a standard pipe.


    ```

    ls -1 | grep "."

    ```


    You could simply write to a temporary file:


    ```

    touch tempFile.txt

    ls -1 > tempFile.txt

    grep ".log" < tempFile.txt

    ```


    This works for many applications, however, nobody will know what tempFile does
    and someone might remove it it contains the output of ls -1 in that directory.
    This is where a named pipe comes into:


    ```

    mkfifo myPipe

    ls -1 > myPipe

    grep ".log" < myPipe

    ```


    myPipe is technically a file (everything is in Linux), so''s ls -1 in an empty
    directory that we just created a pipe in:'
  - '[PAGE 37]


    ```

    mkdir pipeFolder

    cd pipeFolder

    mkfifo myPipe

    ls -l

    ```


    The output is:

    prw-r--r-- 1 root root 0 Jul 25 11:20 myPipe


    Notice the first character in the permissions, it''s listed as a pipe, not a file.


    Now let''s do something cool.


    Open one terminal, and make note of the directory (or create one so that cleanup
    is easy), and make a pipe.


    ```

    mkfifo myPipe

    ```


    Now let''s put something in the pipe.


    ```

    echo "Hello from the other side" > myPipe

    ```


    You''ll notice this hangs, the other side of the pipe is still closed. Let''s
    open up the other side of the pipe and let that stuff through.


    Open another terminal and go to the directory that the pipe is in (if you know
    it, prepend it to the pipe):


    ```

    cat < myPipe

    ```


    You''ll notice that hello from the other side is output, the program in the first
    terminal finishes, as does that in the second terminal.


    Now run the commands in reverse. Start with cat < myPipe and then echo something
    into it. It works, because a program will be waiting until you put something into
    the pipe before terminating, because knows it has to get something.


    Named pipes can be useful for moving information between terminals or between
    programs.


    Pipes are small. Once full, the writer blocks until some reader reads the contents,
    so you need to run either in different terminals or run the other in the background:


    ```

    ls -l /tmp & myPipe &

    cat < myPipe

    ```


    More examples using named pipes:


    +   - Example 1 - all commands on the same terminal / same shell


    ```

    $ $( ls -l & cat file3; ) >mypipe &

    $ cat mypipe

    # Output: Prints ls -l data and then prints file3 contents on screen

    ```


    +   - Example 2 - all commands on the same terminal / same shell


    ```

    $ ls -l >mypipe &

    $ cat file3 >mypipe &

    ```'
