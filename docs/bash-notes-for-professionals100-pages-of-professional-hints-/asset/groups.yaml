    ## Chapter 62: Networking With Bash


    Bash is often commonly used in the management and maintenance of servers and clusters.
    Information pertaining to typical commands used by network operations, when to
    use which command for which purpose, and examples/samples of unique and/or interesting
    applications of it should be included.


    ### Section 62.1: Networking commands


    ```

    ifconfig

    ```


    The above command will show all active interface of the machine and also give
    the information of:


    - 1. IP address assign to interface

    2. MAC address of the interface

    3. Broadcast address

    4. Transmit and Receive bytes


    Some example:


    ```

    ifconfig -a

    ```


    The above command will also show the disable interface:


    ```

    ifconfig eth0

    ```


    The above command will only show the eth0 interface:


    ```

    ifconfig eth0 192.168.1.100 netmask 255.255.255.250

    ```


    The above command will assign the static IP to eth0 interface:


    ```

    ifup eth0

    ```


    The above command will enable the eth0 interface:


    ```

    ifdown eth0

    ```


    The below command will disable the eth0 interface:


    ```

    ping

    ```


    The above command (Packet Internet Grouper) is to test the connectivity between
    the two nodes:


    ```

    ping -c2 8.8.8.8

    ```


    The above command will ping or test the connectivity with google server for 2
    seconds.


    ```

    traceroute

    ```


    The above command is to use in troubleshooting to find out the number of hops
    taken to reach the destination.


    ```

    netstat

    ```


    The above command (Network statistics) give the connection info and their state:


    ```

    dig www.google.com

    ```


    The above command (domain information grouper) query the DNS related information:


    ```

    nslookup www.google.com

    ```


    The above command query the DNS and find out the IP address of corresponding the
    website name.


    ```

    route

    ```


    The above command is used to check the Network information. It basically show
    you the routing table:


    ```

    route add default gw 192.168.1.1 eth0

    ```


    The above command will add the default route of network of eth0 Interface to 192.168.1.1
    in routing table:


    ```

    route del default

    ```


    The above command will delete the default route from the routing table.


    ## Chapter 63: Parallel


    | Option | Description |

    | --- | --- |

    | -j n | Run jobs in parallel |

    | -k | Keep same order |

    | -X | Multiple arguments with context replace |

    | --colsep regex | Split input on regex for positional replacements |

    | { } (.) (1) (/) (#) | Replacement strings |

    | {3} (3) {3} (3/) | Positional replacement strings |

    | -S sshlogin | Example: foo@server.com |

    | --trunc .bar | Shorthand for -transfer return (r).-bar |

    | --all | Run the command with argument on all sshlogins |

    | --nonall | Run the command with no arguments on all sshlogins |

    | --pipe | Split stdin (standard input) to multiple jobs |

    | --recend str | Record end separator for --pipe |

    | --restart str | Record start separator for --pipe |


    Jobs in Linux are parallelized by GNU parallel. A job can be a single command
    or a small script that can be run for each of the lines in the input. The typical
    input is a list of files, a list of hosts, a list of users, a list of URLs, or
    list of tables. A job can also be a command that reads from a pipe.


    ### Section 63.1: Parallelize repetitive tasks on list of files


    Many repetitive jobs can be performed more efficiently if you utilize more of
    your computer''s resources (i.e. CPU''s and RAM). Below is an example of running
    multiple jobs in parallel.


    Suppose you have a `list of files`, say output from 1s. Also, let these files
    be bz2 compressed and the following order of tasks needs to be executed on them:


    - 1. Decompress the bz2 files using bcat to stdout

    2. Grep (e.g. filter) lines with specific keyword(s) using grep <some key word>

    3. Pipe the output to be concatenated into one single gzipped file using gzip


    Running this using a while-loop might look like this:


    Using GNU Parallel, we can run 3 jobs at once by simply doing:


    ```

    parallel -j 3 "bzcat {} | grep puppies" ::: $(cat filelist.txt) | gzip > output.gz

    ```


    This command is simple, concise and more efficient when number of files and file
    size is large. The jobs initiated by parallel, -j 3 launches 3 parallel jobs and
    input to the parallel jobs is taken by :::. The output is eventually piped to
    gzip > output.gz.


    ### Section 63.2: Parallelize STDIN


    Now, let''s imagine we have 1 large file (e.g. 30 GB) that needs to be converted,
    line by line. Say we have a script, convert.ah, that does this <task>. We can
    pipe contents of this file to stdin for parallel to take in and work with in chunks:


    ```

    <stdin | parallel --pipe --block size= -k task > output.txt

    ```


    where <stdin> can originate from anything such as cat <file>.


    As a reproducible example, our task will be nl -n rz. Any file, will be data.

