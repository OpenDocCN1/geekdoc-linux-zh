    # Run:


    ```

    chmod +x pubsub.sh

    ./pubsub.sh

    ```'
  - "[PAGE 195]\n\n# Chapter 66: Pitfalls\n\n# Section 66.1: Whitespace When Assigning\
    \ Variables\n\nWhitespace matters when assigning variables.\n\n```\nfoo = 'bar'\
    \ # incorrect\nfoo= 'bar' # incorrect\nfoo='bar' # correct\n```\n\nThe first two\
    \ will result in syntax errors (or worse, executing an incorrect command). The\
    \ last example will correctly set the variable $foo to the text \"bar\".\n\n#\
    \ Section 66.2: Failed commands do not stop execution\n\nIn most scripting languages,\
    \ if a function fails, it may throw an exception and stop execution of the program.\
    \ Bash commands do not have exceptions, but they do have exit codes. A non-zero\
    \ exit code signals failure, however, a non-zero exit code will not stop execution\
    \ of the program.\n\nThis can lead to dangerous (although Admittedly admitted)\
    \ situations like so:\n\n```\n#!/bin/bash\ncd ~/non/existent/directory\nrm -rf\
    \ *\n```\n\nIf-cd to this directory fails, Bash will ignore the failure and move\
    \ onto the next command, wiping the directory from where you ran the script.\n\
    \nThe best way to deal with this problem is to use of the set command:\n\n```\n\
    #!/bin/bash\nset -e\ncd ~/non/existent/directory\nrm -rf *\n```\n\n -e tells Bash\
    \ to exit the script immediately if any command returns a non-zero status.\n\n\
    # Section 66.3: Missing The Last Line in a File\n\nThe C standard says that files\
    \ should end with a new line, so EOF comes at the end of a line, that line may\
    \ be missed by some commands. As an example:\n\n```\n$ echo 'one\\nothree\\c'\
    \ > file.txt\n```\n\n```\n$ cat file.txt\none\ntworee\n```\n\n```\n$ while read\
    \ line ; do echo \"line $line\"; done < file.txt\none\ntwo\n```\n\nTo make this\
    \ works correctly for in the above example, add a test so that it will continue\
    \ the loop if the last line is not empty."
  - '[PAGE 196]


    ```

    $ while read line || [ -n "$line" ]; do echo "line $line" : done < file.txt

    one

    two

    three

    ```'
  - '[PAGE 197]


    # Appendix A: Keyboard shortcuts


    # Section A.1: Editing Shortcuts


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + a | move to the beginning of the line |

    | Ctrl + e | move to the end of the line |

    | Ctrl + k | Kill the text from the current cursor position to the end of the
    line |

    | Ctrl + u | Kill the text from the current cursor position to the beginning of
    the line |

    | Ctrl + w | Kill the word behind the cursor position |

    | Alt + b | move backward one word |

    | Alt + f | move forward one word |

    | Ctrl + Alt + e | shell expand the most recently killed text back into the buffer
    at the cursor |

    | Ctrl + y | Yank through killed text. You can only do this if the prior command
    is Ctrl + y or Alt + y |


    Killing text will delete, but so that the user can reinsert it by ying. Similar
    to cut and paste that the text is placed on a ring which allows for storing more
    than one set of text to be yanked back to the command line.


    You can find out more in the emacs manual.


    # Section A.2: Recall Shortcuts


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + r | search the history backwards |

    | Ctrl + p | previous command in history |

    | Ctrl + n | next command in history |

    | Ctrl + g | quit history searching mode |

    | Alt + . | use the last word of the previous command / repeat to get the last
    word of the previous + 1 command |

    | Alt + n Alt + . | use the nth word of the previous command |

    | !! + Return | execute the last command again (useful when you forgot sudo: sudo
    !!)|


    # Section A.3: Macros


    | Shortcut | Description |

    | --- | --- |

    | Ctrl + x ( | start a macro |

    | Ctrl + x ) | stop recording macro |

    | Ctrl + x e | execute the last recorded macro |


    # Section A.4: Custom Key Bindings


    With the bind it is possible to define custom key bindings.


    The next example bind Alt + w to /dev/null 2>&:


    ```

    bind "\ew":"" >/dev/null 2>&\"

    ```'
