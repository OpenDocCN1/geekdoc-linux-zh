    ```


    or


    ```

    packs=

    apache2

    php

    php-mbstring

    php-mysql

    sudo apt-get install $packs

    ```


    > This will install the packages. If you double quote the $packs then it will
    throw an error.


    Unquoted $packs is sending all the space separated package names as arguments
    to apt-get, while quoting it will send the $packs as a single argument and the
    apt-get will try to install a package named apache2 php php-mbstring php-mysql
    (for the first one) obviously doesn''t exist'
