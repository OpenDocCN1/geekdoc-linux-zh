    # # Chapter 57: Cut Command


    | Option | Description |

    | --- | --- |

    | -b LIST, --bytes=LIST | Print the bytes listed in the LIST parameter |

    | -c LIST, --characters=LIST | Print characters in positions specified in LIST
    parameter |

    | -f LIST, --fields=LIST | Print fields or columns |

    | -d DELIMITER | Used to separate columns or fields |


    In Bash, the `cut` command is useful for dividing a file into several smaller
    parts.


    #  Section 57.1: Show the first column of a file


    Suppose you have a file that looks like this


    ![](img/9510873292d27579f7269978b556d3d7_178_0.png)


    This file has 3 columns separated by spaces. To select only the first column,
    do the following.


    ```

    cut -d '' '' -f1 filename

    ```


    Here the -d flag, specifies the delimiter, or what separates the records. The
    -f flag specifies the field or column number. This will display the following
    output


    ![](img/9510873292d27579f7269978b556d3d7_178_1.png)


    #  Section 57.2: Show columns x to y of a file


    Sometimes, it''s useful to display a range of columns in a file. Suppose you have
    this file


    ![](img/9510873292d27579f7269978b556d3d7_178_2.png)


    To select the first 3 columns do


    ```

    cut -d '' '' -f1-3 filename

    ```


    This will display the following output


    ![](img/9510873292d27579f7269978b556d3d7_178_3.png)'
  - "[PAGE 179]\n\n# Chapter 58: global and local variables\n\nBy default, every variable\
    \ in bash is global to every function, script and even the outside shell if you\
    \ are declaring your variables inside a script.\n\nIf you want your variable to\
    \ be local to a function, you can use local to have that new variable that is\
    \ independent of the global scope and whose value will only be accessible inside\
    \ that function.\n\n# Section 58.1: Global variables\n\n```\nvar=\"hello\"\nfunction\
    \ foo(){\n  echo $var\n}\nfoo\n```\n\nWill obviously output \"hello\", but this\
    \ works the other way around to:\n\n```\nfunction foo() {\n  var=\"hello\"\n}\n\
    foo\necho $var\n```\n\nWill also output \"hello\"\n\n# Section 58.2: Local variables\n\
    \n```\nfunction foo() {\n  local var\n  var=\"hello\"\n}\nfoo\necho $var\n```\n\
    \nWill output nothing, as as var is a local variable to the function foo, and\
    \ its value is not visible from outside of it.\n\n# Section 58.3: Mixing the two\
    \ together\n\n```\nvar=\"hello\"\nfunction foo(){\n  local var=\"sup?\"\n  echo\
    \ \"inside function, var=$var\"\n}\nfoo\necho \"outside function, var=$var\"\n\
    ```\n\nWill output"
