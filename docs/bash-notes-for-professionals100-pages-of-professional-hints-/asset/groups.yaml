    # Chapter 59: CGI Scripts


    # Section 59.1: Request Method: GET


    It is quite easy to call a CGI-Script via GET.

    First you will need the encoded url of the script.

    \Then you add a question mark ? followed by variables.


    +   * Every variable should have two sections separated by =

    * First section should be always a unique name for each variable, while the second
    part has values in it only

    * Variables are separated by &

    * Total length of the string should not be over 255 characters

    * Names and values needs to be html-encoded (replace: <, / ?, & = $ )

    * Hint:

    When using html-forms the request method can be generated by it.

    With Ajax you can encode all encodeURI and encodeURIComponent


    Example:


    ```

    http://www.example.com/cgi-bin/script.sh?var1=Hello%20World!&var2=This%20is%20a%20Test.

    ```


    The server should communicate via Cross-Origin Resource Sharing (CORS) only, to
    make request secure. In this case we use CORS to determine the Data-Type we want
    to use.


    There are many Data-Types we can choose from, the most common are...


    +   * text/html

    * text/plain

    * application/json


    When sending a request, the server will create any environment variables. For
    now the most important environment variables are $REQUEST_METHOD and $QUERY_STRING.


    The Request Method has to be GET nothing else!

    The Query String includes all the html-encoded data.


    The Script


    ```

    #!/bin/bash


    # CORS is the way to communicate, so lets response to the server first

    echo "Content-type: text/html" # set the data-type we want to use

    echo "" # we don''t need rules, the empty line initiates this


    # CORS are set in stone and any communication from now on will be like reading
    a html-document.

    # Therefore we need to create any stdin in html format!


    # create html structure and send it to stdout

    echo "<!DOCTYPE html>"

    echo "<html><head>"


    # The content will be created depending on the Request Method

    if [ "$REQUEST_METHOD" = "GET" ]; then

    ```'
