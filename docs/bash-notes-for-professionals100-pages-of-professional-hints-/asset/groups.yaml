    # Chapter 38: Case statement


    # Section 38.1: Simple case statement


    In its simplest form supported by all versions of bash, case statement executes
    the case that matches the pattern.; ; operator breaks after the first match, if
    any.


    ```

    #!/bin/bash


    var=1

    case $var in

    1)

    echo "Antarctica"

    ;

    2)

    echo "Brazil"

    ;

    3)

    echo "Cat"

    ;

    esac

    ```


    Outputs:


    Antarctica


    # Section 38.2: Case statement with fall through


    Version ≥ 4.0


    Since bash 4.0, a new operator ;& was introduced which provides fall through mechanism.


    ```

    #!/bin/bash


    var=1

    case $var in

    1)

    echo "Antarctica"

    &&

    2)

    echo "Brazil"

    &&

    3)

    echo "Cat"

    &&

    esac

    ```


    Outputs:


    Antarctica

    Brazil

    Cat


    # Section 38.3: Fall through only if subsequent pattern(s) match


    Version ≥ 4.0


    GoalKicker.com – Bash Notes for Professionals'
  - "[PAGE 142]\n\nAs Bash 4.0, another operator ;;& was introduced which also provides\
    \ fall through only if the patterns in subsequent case statement(s), if any, match.\n\
    \n```\n#!/bin/bash\n\nvar=abc\ncase $var in\na)\n  echo \"Antarctica\"\n  ;;&\n\
    xyz)\n  echo \"Brazil\"\n  ;;&\n*b)\n  echo \"Cat\"\n  ;;&\nesac\n```\n\nOutputs:\n\
    \nAntarctica\nCat\n\nIn the below example, the abc matches first and third case\
    \ but not the second case. So, second case is not executed."
