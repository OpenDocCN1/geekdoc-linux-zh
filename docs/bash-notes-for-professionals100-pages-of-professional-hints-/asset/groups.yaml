    \ \"foo\" 的上一个命令\n!\n\n例如，如果你最近执行了 crontab，你可以通过输入 `cr` 快速找到它。\n\n**单词标识符 (Word\
    \ designators)**\n\n这些由冒号隔开，指向：\n\n```bash\n# 展开为 n 行之前的命令\n!:-n\n\n# 展开为 n 行之前的命令\n\
    !:-s\n\n# 展开为 n 行之前的命令\n!:-w\n\n# 展开为 n 行之前的命令\n!:-f\n\n# 展开为 n 行之前的命令\n!:-d\n\
    \n# 展开为 n 行之前的命令\n!:-a\n\n# 展开为 n 行之前的命令\n!:-g\n\n# 展开为 n 行之前的命令\n!:-h\n\n# 展开为\
    \ n 行之前的命令\n!:-j\n\n# 展开为 n 行之前的命令\n!:-k\n\n# 展开为 n 行之前的命令\n!:-l\n\n# 展开为 n 行之前的命令\n\
    !:-m\n\n# 展开为 n 行之前的命令\n!:-x\n\n# 展开为 n 行之前的命令\n!:-y\n\n# 展开为 n 行之前的命令\n!:-z\n\
    \n# 展开为 n 行之前的命令\n!:-```\n\n默认情况下，搜索找到匹配模式的最近命令。你可以反复按下它直到找到所需的命令。\n\n**修饰符 (Modifiers)**\n\
    \n这些修改事件：\n\n```bash\n# 替换字符串的第一次出现位置\n:s/foo/bar\n\n# 替换字符串的所有出现位置\n:gs/foo/bar\n\
    \n# 替换字符串的最后一次出现位置\n:sc/foo/bar\n\n# 替换字符串的最后一次出现位置\n:sc/foo/bar\n\n# 删除字符串的第一次出现位置\n\
    :s/foo//\n\n# 删除字符串的所有出现位置\n:gs/foo//\n\n# 删除字符串的最后一次出现位置\n:sc/foo//\n\n# 删除字符串的最后一次出现位置\n\
