- pgno: 67
  md: "themselves continue to arrive at high frequency. If we did everything in the\
    \ IRQ handler, then we'd stall the hardware with unacknowledged IRQs, and we'd\
    \ also stall the arrival of new packets.\n\nIn the latest kernel versions (2.3.48),\
    \ Ingo Molnar and other developers have introduced the concept of *tasklets*,\
    \ which are the SMP-scalable equivalent of bottom-half handlers. Right now one\
    \ type of bottom-half handler assumes SMP exclusivity. Other types may execute\
    \ in parallel just fine, but not the bottom-half handler of the same type (and\
    \ IRQ handlers can run in parallel with bottom-half handlers as well). The code\
    \ for these tasklets entered the Linux kernel as of version 2.3.48.\n\n# Data\
    \ Structure—linux/interrupt.h\n\n```\n/* Tasklets --- multithreaded analogue of\
    \ BHs.\n\nMain feature differing them of generic softirqs: tasklet\nis running\
    \ only on one simultaneously.\n\nMain feature differing them of BHs: different\
    \ tasklets\nmay be run simultaneously on different CPUs.\n\nProperties:\n* If\
    \ tasklet_schedule() is called, then tasklet is guaranteed\nto be executed on\
    \ some cpu at least once after this.\n* If the tasklet is already scheduled, but\
    \ its execution is still not\nstarted, it will be executed only once.\n* If this\
    \ tasklet is already running on another CPU (or schedule is called\nfrom tasklet\
    \ itself), it is rescheduled for later.\n* Tasklet is strictly serialized with\
    \ regard to itself, but not\nwith regard to other tasklets. If client needs some\
    \ intertask synchronization,\nit makes it with spinlocks.\n*/\n\nstruct tasklet_struct\n\
    {\n   struct tasklet_struct *next;\n   unsigned long state;\n   atomic_t count;\n\
    \   void (*func)(unsigned long);\n   unsigned long data;\n};\n```\n\nAnother novelty\
    \ in the latest kernels is SMP IRQ affinity, designed and implemented by Ingo\
    \ Molnar. The output from cat /proc/irq/IRQ#/smp_affinity specifies which target\
    \ CPUs are permitted for a given IRQ source."
