    In 2.4, instead, it is a tunable parameter set as default to:


    ```

    size-of-memory-in-the-system / kernel-stack-size / 2

    ```


    Supposing you have 512MB of RAM, the default high limit of available process will
    be:


    ```

    512×1024×1024 / 8192 / 2 -> 32768

    ```


    Now, 32,768 processes might sound like a lot, but for an enterprise-wide Linux
    server with a database and many connections to it from a LAN or from the Internet,
    it is a very reasonable number. Here again, the system administrator must tune
    this parameter according to his requirements.


    In 2.4, it also possible to increase the maximum number of tasks via a syscall
    system call at runtime. If the administrator wants to increase the number of concurrent
    tasks to 40,000, he will only have to enter (as root):


    ```

