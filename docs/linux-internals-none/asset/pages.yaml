  md: '+   - Are locked in memory

    +   - Are shared.


    There is a separate, explicit mechanism for swapping out these pages. The swap
    algorithm uses *page aging*. Each page has a counter (held in the `mem_map_t`
    data structure) that gives the kernel `swap daemon` some idea whether or not a
    page is worth swapping. Pages age when they are unused, and rejuvenate on access;
    the `swap daemon` only swaps out old pages. The default action, when a page is
    first allocated, is to give it an initial age of 3. Each time it is touched by
    the memory management subsystem, its age is increased by 3 to a maximum of 20.
    Each time the kernel `swap daemon` runs, it ages pages, decrementing their age
    by 1. These default actions can be changed and for this reason they (and other
    swap-related information) are stored in `swap_control`.


    # Figure 5.4

    Alpha AXP page table entry.


    ![](img/a248b1088891f07ca198e09ddb71aec7_143_0.png)


    If the page is old, the `swap daemon` processes it further. *Dirty* pages are
    pages which can be swapped out. Linux uses an architecture-specific bit in the
    PTE to describe pages this way. However, not all dirty pages are necessarily written
    to the swap file. Every virtual memory region of a process may have its own swap
    method and, in this case, that method is used. Otherwise, the `swap daemon` will
    allocate a page in the swap file and write the page out to the swap file device.
    If the swap file is used, the page’s page table entry (PTE) is replaced by one
    which is marked as invalid but contains information about where the page is in
    the swap file. Whatever the swap method used, the original physical page is made
    free by putting it back into the `free_area`. Clean (or rather, not dirty) pages
    can be discarded and put back into the `free_area` for re-use. The PTEs for these
    pages are made invalid. These pages will be re-read from'
