    2.2.13/include/asm-arm/arch-eb2s110/param.h:#define HZ 100

    2.2.13/include/asm-arm/proc-arm226/param.h:#define HZ 100

    2.2.13/include/asm-arm/proc-arm235/param.h:#define HZ 100

    2.2.13/include/asm-arm/arch-nexuspci/param.h:#define HZ 100

    2.2.13/include/asm-arm/proc-rpc/param.h:#define HZ 100

    2.2.13/include/asm-arm/proc-arm0/param.h:#define HZ 100

    2.2.13/include/asm-i386/param.h:#define HZ 100

    2.2.13/include/asm-m68k/param.h:#define HZ 100

    2.2.13/include/asm-mips/param.h:#define HZ 100

    2.2.13/include/asm-ppc/param.h:#define HZ 100

    2.2.13/include/asm-sparc/param.h:#define HZ 100

    2.2.13/include/asm-sparc64/param.h:#define HZ 100

    ```

    ```


    There is a preferred HZ definition for each architecture.


    Although changing HZ to 1,000 will just allow the kernel to use a 1,000 timer,
    you should bear in mind that any program running in user space (if not adapted
    accordingly) will continue to think that the kernel is running with a 100Hz timer.
    In other words, some user space programs such as top could break. This happens
    because some data are still exported from kernel space to user space in jiffy
    units (100 per second).


    This “visibility” problem inside the kernel could be solved by splitting the currently
    unique HZ into an internal HZ and a user space-exported HZ. There are patches
    that do just that. They have not been integrated into the kernel yet, simply because
    the 100Hz timer seems not to hurt too much.


    It’s also interesting to note that the timer IRQ in an IA32-SMP system only manages
    the system time and starts the software interrupts (bottom-half handlers). All
    the scheduling accounting is triggered instead by an SMP-timer interrupt generated
    by the IO-APIC in broadcast to all CPUs (as opposed to the timer IRQ, which is
    a unicast IRQ on the IA32-SMP port). So, if the purpose of the timer frequency
    increase was to make scheduling more fine-grained, in a IA32-SMP system we should
    instead only change the frequency of the SMP timer interrupt by reprogramming
    the IO-APIC. That frequency of the IO-APIC local timer IRQ is set in linux/arch/i386/kernel/smp.c
    within the function setup_APIC_timer().'
