    Some OS researchers say that the scheduler can best do its work when it is given\
    \ hints by the programmer of user-space applications. These hints would ideally\
    \ tell the scheduler which resources the program is likely to consume and how\
    \ heavily. How would one implement hint-based scheduling with the 2.4. kernel?\n\
    \nLet's assume you are a userland program executing a critical code section (say,\
    \ a mutex on a shared memory part) and you want to give a hint to the scheduler\
    \ not to preempt you right now, because it will actually prevent other tasks from\
    \ doing anything because another task has the mutex. How do we address this problem?\n\
    \nActually it's the other task that must go to sleep immediately in the slow fail-path.\
    \ When the other task notices the lock is busy, it should call `sched_yield()`,\
    \ and it must not loop in user space.\n\nGiving a hint to the kernel will be a\
    \ win in most cases, because you should give the hint in the fast path—you should\
    \ enter the kernel before acquiring the mutex. It's worth the risk of messing\
    \ with the fairness of the scheduler.\n\nEntering the kernel is always expensive,\
    \ so it is better to let the fast path be very fast, and to make the lock fine\
    \ grained to reduce contentions. Better to make the slow path even slower than\
    \ to harm the fast path. If the critical section is very large, then a signal-driven\
    \ wake-"
