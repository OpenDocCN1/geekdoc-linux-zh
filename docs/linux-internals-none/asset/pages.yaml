- pgno: 111
  md: "single address space. Apache, for instance, includes a Perl module to enable\
    \ Web developers to execute Perl code without exiting the address space.\n\nWhat's\
    \ the difference between process and thread under Linux? And, more important,\
    \ what is the difference from a scheduler's point of view? In short: nothing.\n\
    \nThe only worthwhile difference between a thread and a process is that the threads\
    \ share completely the same address space. All the threads run in the same address\
    \ space so a context switch is basically just a jump from one location of code\
    \ to another location of code.\n\nThe simple check to avoid the translation look-aside\
    \ buffer (TLB)—the mechanism within the CPU that translates virtual memory addresses\
    \ to real RAM addresses—flush and the memory manager context switch is found in\
    \ linux/arch/i386/kernel/process.c:\n\n```\n```c\n/* Re-load page tables */\n\
    {\n  unsigned long new_cr3 = next->tss.cr3;\n  if (new_cr3 != prev->tss.cr3)\n\
    \    asm volatile(\"mov1 %0,%%%cr3\": :\"x\" (new_cr3));\n}\n```\n```\n\nThe above\
    \ check is in the core of the Linux kernel context switch. It checks if the address\
    \ of the page-directory of the current process and the one of the to-be-scheduled-process\
    \ are the same. If they are, it means they are sharing the same address space\
    \ (or in other words, they are two threads) and the kernel avoids writing to the\
    \ %cr3 register, so that the userspace page tables won't be invalidated. This\
    \ happens because the cr3 register just contains the data to which the kernel\
    \ would write (and writing to it would mean invalidating the TLB). With the above\
    \ two-line check Linux defines a difference between a kernel process switch and\
    \ a kernel thread switch. This is the only noteworthy difference.\n\nBecause there\
    \ is no difference at all between threads and processes, the Linux scheduler is\
    \ written in very clean code. Only a few places related to signal handling make\
    \ differences between threads and processes. This is very much contrary to, say,\
    \ Solaris where the process is greatly disadvantaged compared to the thread and\
    \ lightweight processes. The code below finds a measurement on a Solaris server,\
    \ an Ultra 2 desktop 167-MHz processor, running Solaris 2.6:\n\n```\n```\norion>\
    \ ftime\nCompleted 100 forks\nAvg. Fork Time: 1.137 milliseconds\n```\n```"
