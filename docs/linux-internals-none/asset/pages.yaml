    \ for new versions), to determine the current setup. The config file looks like\
    \ this:\n\n```\nimage = /vmlinuz\n  label = Linux\n  root = /dev/hda1\n...\n```\n\
    \nThe `image` is is set to the currently installed kernel. Most people use /vmlinuz.\
