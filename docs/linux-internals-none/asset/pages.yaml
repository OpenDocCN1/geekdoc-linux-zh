- pgno: 231
  md: 'kHTTPd, an HTTP-daemon, is a Web server for Linux. kHTTPd is different from
    other Web servers in that it runs from within the Linux kernel as a module (device
    driver).


    kHTTPd handles only *static* (file-based) Web pages, and passes all requests for
    nonstatic information to a regular user-space Web server, such as Apache or Zeus.
    Static Web pages, although not a very complex thing to serve, are nevertheless
    very important. This is because virtually all images are static, as are a large
    portion of HTML pages. A “regular” Web server has little added value for static
    pages; it is simply a “copy-file-to-network” operation. The Linux kernel is very
    good at this—for example, the network file system (NFS) daemon also runs in the
    kernel.


    *Accelerating* the simple case of serving static pages within the kernel leaves
    user-space daemons free to do what they are very good at: generating user-specific,
    dynamic content. A user-space Web server such as Apache is typically loaded with
    features and has lots of execution paths, so it can’t be as fast as kHTTPd. There
    are, however, a few Web servers that are as simple as kHTTPd, but implemented
    in user space, which are not expensive consumers of processor cycles even compared
    to kHTTPd.


    kHTTPd is very simple; it doesn’t handle dynamic content. So it proxies all requests
    for those directories that you configure via the *sysctl* called *dynamic* to
    a fully functional user-space Web server such as Apache.


    For this reason, kHTTPd is faster only for static pages. Dynamic pages incur a
    bit more latency under a kHTTPd Web server, because they need to be forwarded
    to another Web server like Apache. It’s a global win, though, because most of
    the transfers of a common Web server are images, which are definitely static.


    kHTTPd is actually a bird not much different from a normal HTTP daemon in principle.
    The main difference is that it bypasses the system call layer. Normally you have
    code like this:


    ```

    ```

    socket(..)

    bind(..)

    listen(..)

    accept(..)

    ```

    ```


    and each call has to enter the kernel, look up kernel structures as function(s)
    of the parameter(s) passed, return information to user space, and so forth.


    kHTTPd directly runs the internals of such system calls, because being a kernel
    daemon itself, it interfaces directly with the internal ker-'
