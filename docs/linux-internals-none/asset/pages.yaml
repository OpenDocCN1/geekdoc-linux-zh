    # # The 2.4 Threaded Kernel


    Linux kernel threading is constantly improving. Let''s look at the different versions
    again:


    2.0.x No kernel threading

    2.2.x Yes

    2.3.x very SMP threaded


    In 2.2.x many places are still single threaded but 2.2.x kernels scale very well
    on two-way SMPs. In 2.2.x, IRQ and timer handling, for example, is completely
    SMP threaded and the IRQ load is distributed across multiple CPUs.


    In 2.4, most worthwhile code sections within the kernel are rewritten for SMP
    threading. In 2.4, all the virtual memory (VM) is SMP threaded, for example. The
    most interesting paths have a much finer granularity and are scaled very well
    in 2.4.


    # # Performance Limitations


    For the sake of the system''s stability, a kernel has to react well in stress
    situations. It must, for instance, reduce priorities and resources to process
    that misbehave. How does the scheduler handle a (stupid) program looping tightly
    and forking at each turn of the loop—therefore forking off thousands of processes
    in a few seconds?


    Obviously, the scheduler can''t limit the creation of processes timewise—say,
    a process every 0.5 seconds or something—because time has a very funny meaning
    from the CPU point of view. Thus, at one point, 0.5 seconds would be enough to
    accommodate the wild forking of a program, while at another point it would endanger
    the stability of the system.


    In the 2.4 kernel, however, after a fork, the runtime priority of the process
    is divided between the parent and the child. This means that the parent or child
    will be penalized compared to the other tasks, and the other tasks will continue
    to run well up to the first recalculation of pri-'
