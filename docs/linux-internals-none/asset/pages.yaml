- pgno: 85
  md: '+   7. The usual boot sequence (e.g. invocation of `/sbin/init`) is performed
    on the root file system.


    Note that moving `initrd` from `/` to `/initrd` does not involve unmounting it
    through the `umount()` call. It is therefore possible to leave processes running
    on `initrd` (or leave file systems mounted, but see below) during that procedure.
    However, if `/initrd` doesn’t exist, `initrd` can only be unmounted if it is not
    used by any other process. If it can’t be unmounted, it remains in memory.


    Also note that filesystems mounted under `initrd` continue to be accessible, but
    their `/proc/mounts` entries are not updated any longer. Also, if `/initrd` doesn’t
    exist, `initrd` can’t be unmounted and it will “vanish,” taking those filesystems
    with it, thereby preventing them from being remounted properly. It is therefore
    strongly suggested to generally unmount all filesystems (except of course the
    root file system, but including `/proc`) before switching from `initrd` to the
    “normal” root filesystem. To deallocate the memory used for the initial RAM disk,
    you have to execute `freeramdisk` (see Resources, below) after unmounting `/initrd`.


    # ## Sequence of Kernel Tables Creation at Boot


    Upon boot, the kernel must create and properly populate all the tables needed
    for the normal functioning of the system. They are almost all allocated statically
    and initialized at compile time in the data section. `task_struct`, `init_mm`,
    and `pg_data_t` array, which is in the data structure, contain all the information
    on the state of the memory in the machine. In previous kernels (2.2.x and prior)
    this information was stored in kernel-global variables. Today, with clustered
    Linux servers, these variables are per node.


    In 2.3.49 `/include/linux/mzone.h`, the only node of an IA32 (Intel x86) non-NUMA
    machine is called `contig_page_data`. The `contig_page_data->node_mem_map` is
    the old `mem_map_t` array of 2.2.x, with all the `struct page *` in it. The `node_mem_map`
    array gets allocated dynamically at boot, as soon as the number of pages in the
    system is known.


