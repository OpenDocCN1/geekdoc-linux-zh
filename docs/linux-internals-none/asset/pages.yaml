    File System Allocation Formats


    | File System | Allocation Format |

    |---|---|

    | Ext2 | Block-based; allocator tries to allocate sequential blocks |

    | reiserfs | Extent-based |

    | JFS | Extent-based |


    # Block-based Allocation (General)


    The block-based allocation strategy is used by a traditional UNIX file system.
    When a file is extended, the policy is to allocate to the file, on the fly, a
    minimal number of blocks (as defined by the file system). Blocks are allocated
    from a free block map.


    Although this policy attempts to conserve storage space, blocks are sometimes
    allocated in random order. This can cause excessive disk seeking, and later reads
    from the file system will result in the disk'
