- pgno: 212
  md: '# CHAPTER 7


    # Signals

    Handling'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Signals are used to notify a process or thread of a particular event. This
    chapter describes how the Linux 2.4 kernel handles these signals. As in all other
    chapters, the data structures referred to in the chapter can be found at the end.


    Processes operate within their own virtual address space and are protected by
    the operating system from interference by other processes. By default a user process
    cannot communicate with another process unless it makes use of secure, kernel-managed
    mechanisms. There are many times when processes need to share common resources
    or synchronize their actions. One possibility is to use threads, which by definition
    can share memory within a process. This option is not always possible (or wise)
    due to the many disadvantages that can be experienced with threads. Methods of
    passing messages or data between processes are therefore required.


    Many computer science researchers compare signals with hardware interrupts, which
    occur when a hardware subsystem such as a disk I/O interface (an SCSI host adapter,
    for example) generates an interrupt to a processor as a result of a completed
    I/O. This event in turn causes the processor to enter an interrupt handler, so
    subsequent processing can be done in the operating system based on the source
    and cause of the interrupt.


    One could therefore aptly describe signals as software interrupts. When a signal
    is sent to a process or thread, a signal handler may be entered (depending on
    the current disposition of the signal), which is similar to the system’s entering
    an interrupt handler as the result of receiving an interrupt.


    The early implementations of signals in UNIX were deemed unreliable. The unreliability
    stemmed from the fact that in the old days the kernel would reset the signal handler
    to its default if a process caught a signal and invoked its own handler, and the
    reset occurred before the handler was invoked. Attempts to address this issue
    in user code by having the signal handler first reinstall itself did not always
    solve the problem, because successive occurrences of the same signal resulted
    in race conditions, where the default action was invoked before the user-defined
    handler was reinstalled. For signals that had a default action of terminating
    the process, this created severe problems. This problem (and some others) were
    addressed in 4.3BSD UNIX and SVR3 in the mid-''80s.


    The implementation of correct and reliable signals has been in place for many
    years now, where an installed signal handler remains persistent and is not reset
    by the kernel. The POSIX standards provided a fair-'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'ly well-defined set of interfaces for using signals in code, and today the
    Linux implementation of signals is fully POSIX compliant. It should be noted that
    reliable signals require the use of the newer `sigtaction(2)` interface, as opposed
    to the traditional `signal(3C)` call.


    The occurrence of a signal may be synchronous or asynchronous to the process or
    thread, depending on the source of the signal and the underlying reason or cause.
    Synchronous signals occur as a direct result of the executing instruction stream,
    where an unrecoverable error (such as an illegal instruction or illegal address
    reference) requires an immediate termination of the process. Such signals are
    directed to the thread whose execution stream caused the error. Because an error
    of this type causes a trap in a kernel trap handler, synchronous signals are sometimes
    referred to as *traps*.


    Asynchronous signals are external to (and in some cases unrelated to) the current
    execution context. One obvious example would be the sending of a signal to a process
    from another process or thread, via a `kill(2)`, `_lwp_kill(2)`, or `sigsend(2)`
    system call, or a `thr_kill(3T)`, `pthread_kill(3T)`, or `sigqueue(3R)` library
    invocation. Asynchronous signals are also aptly referred to as *interrupts*.


    Every signal has a unique signal name, an abbreviation that begins with SIG (`SIGINT`
    for interrupt signal, for example) and a corresponding signal number. Additionally,
    for all possible signals, the OS defines a default disposition, or action to take
    when a signal occurs. There are four possible default dispositions:


    +   - **Exit**—Forces the process to exit.

    +   - **Core**—Forces the process to exit and create a core file.

    +   - **Stop**—Stops the process.

    +   - **Ignore**—Ignores the signal; no action taken.


    A signal’s disposition within a process’s context designates what action the system
    will take on behalf of the process when a signal is delivered. All threads within
    a process share the signal disposition, which is processwide and cannot be unique
    among tasks or threads within the same process.


    Table 7.1 provides a complete list of signals, along with a description and default
    action.'
