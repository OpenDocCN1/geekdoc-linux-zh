  md: "figured into the kernel. This procedure was called *hierarchical initialization*\
    \ and worked fine for simple systems with a limited number of devices.\n\nIn 2.3.x\
    \ the hardware recognition procedure changed considerably. Previously it was necessary\
    \ to change the *init* callback of the higher layer to add something like:\n\n\
    ```\n```\n#ifdef CONFIG_MY_DRIVER\n    init_my_driver();\n#endif\n```\n```\n\n\
