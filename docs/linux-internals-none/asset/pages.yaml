- pgno: 217
  md: '# # Signal Description and Default Action


    The disposition of a signal can be changed from its default, and a process can
    arrange to catch a signal and invoke a signal handling routine of its own, or
    ignore a signal that may not have a default disposition of Ignore, as we said
    before. The only exceptions are `SIGKILL` and `SIGSTOP`, whose default dispositions
    cannot be changed. The interfaces for defining and changing signal disposition
    are the `signal(3C)` and `sigset(3C)` libraries, and the `sigaction(2)` system
    call. Signals can also be blocked, which means the process has temporarily prevented
    delivery of a signal. The generation of a signal that has been blocked results
    in the signal''s remaining pending to the process, until it is explicitly unblocked
    or the disposition is changed to Ignore.


    We saw earlier that a signal may originate from several different places, for
    a variety of different reasons. The first three signals listed in the table above—`SIGHUP`,
    `SIGINT`, and `SIGQUIT`—are generated by a keyboard entry from the controlling
    terminal (`SIGINT` and `SIGHUP`), or they are generated if the control terminal
    becomes disconnected (`SIGHUP`—use of the `nohup(1)` command makes processes “immune”
    from hangups by setting the disposition of `SIGHUP` to Ignore).


    Other terminal I/O-related signals include `SIGSTOP`, `SIGTTIN`, `SIGTTOU`, and
    `SIGTSTP`. For those signals that originate from a keyboard command, the actual
    key sequence that generates the signals, usually `^C` (`Ctrl-C`), is defined within
    the parameters of the terminal session, typically via `stty(1)`, which results
    in a `SIGINT` being sent to a process; it has a default disposition of Exit.


    Signals generated as a direct result of an error encountered during instruction
    execution start with a hardware trap on the system. Different processor architectures
    define various traps that result in an immediate vectored transfer of control
    to a kernel trap-handling function. The Linux kernel builds a trap table and inserts
    trap-handling routines in the appropriate locations based on the architecture
    specification of the Linux-supported processors. In Intel x86 parlance they''re
    called *interrupt descriptor tables* or IDTs.


    The kernel-installed trap handler ultimately generates a signal to the thread
    that caused the trap. The signals that result from hardware traps are `SIGILL`,
    `SIGFPE`, `SIGSEGV`, `SIGTRAP`, `SIGBUS`, and `SIGEMT`.


    In addition to terminal I/O and error trap conditions, signals can originate from
    sources, such as an explicit signal, sent programmatically via `kill(2)` or `thr_kill(1)`,
    or from a shell issuing a `kill(1)` command. Parent processes are notified of
    status change in a child process via `SIGCHLD`.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Applications can create user-defined signals as a somewhat crude form of interprocess
    communication by defining handlers for `SIGUSR1` and/or `SIGUSR2` and then sending
    those signals between processes. The kernel sends `SIGXCPU` if a process exceeds
    its processor time resource limit, or `SIGXFSZ` if a file write exceeds the file
    size resource limit. A `SIGABRT` is sent as a result of an invocation of the `abort(3c)`
    library. If a process is writing to a pipe and the reader has terminated, `SIGPIPE`
    is generated.


    These examples of signals generated as a result of events beyond hard errors and
    terminal I/O do not represent the complete list, but rather provide a well-rounded
    set of examples of the process-induced and external events that can generate signals.


    In terms of actual implementation, a signal is represented as a bit in a data
    structure (several data structures, as we''ll see shortly). More succinctly, the
    posting of a signal by the kernel results in a bit getting set in a structure
    member at either the process or thread level. Because each signal has a unique
    signal number, a structure member of sufficient width is used, to allow every
    signal to be represented by setting the bit that corresponds to the signal number
    of the signal we wish to post (for example, setting the 17th bit to post signal
    17, `SIGUSR1`).


    When you consider that a signal is represented by the setting of a bit in a data
    structure, intuition indicates that a periodic check must be made for set bits
    (pending signals) by the kernel. This is, in fact, precisely how delivery is made.
    A check is made for posted signals at several points during the typical execution
    flow of a process:


    +   1. Returning from a system call.

    +   2. Returning from a trap.

    +   3. Waking up from a sleep.


    In essence, the determination of the existence of a signal is a polling process
    in which the signal fields in the process are examined frequently for the presence
    of a set bit. Once the check is made, and it''s determined that there is a signal
    posted, the appropriate action can be taken based on the signal''s current disposition
    in the context of the process that received it.


    This is why you can''t kill zombie processes. (As any horror-movie fan knows,
    you can''t kill a zombie.) A process must be executing in order to take delivery
    of a signal. A zombie process is, by definition, a process that has terminated.
    It exists only as a process table entry; all of its execution resources (i.e.
    allocated memory, constants, and variables storage) have been freed by the kernel.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Much of the up-front work in `sigtoproc()` deals with job control and the terminal
    I/O signals. In compliance with the POSIX specifications, this behavior is documented
    in the `signal(5)` manual page, which I''ll summarize here: any pending `SIGCONT`
    signals are discarded upon receipt of a `SIGSTOP`, `SIGTSTP`, `SIGTTIN`, or `SIGTTOU`
    signal, regardless of the disposition. The inverse is also true; if any of those
    four signals are pending when a `SIGCONT` is received, they''re discarded (again,
    regardless of the disposition). In both cases, the posted signal is delivered
    following the flow described in the section entitled “Asynchronous Signals,” below.


    # # Synchronous Signals


    *Synchronous*, or trap, signals originate from within the kernel trap handler.
    When an executing instruction stream causes a trap event, the hardware detects
    it and execution is redirected to a kernel trap handler. The trap handler code
    populates a `siginfo` structure with the appropriate information about the trap,
    then invokes the `trap_cleanup()` function. The entry point into the kernel signal
    subsystem is via the `trap-sig()` function, which is executed next. In `trapsig()`,
    if the signal is masked, or the disposition has been set to *Ignore*, `trapsig()`
    unmasks the signal and sets the disposition to *default*. The `siginfo` structure
    is placed on the kthread''s `t_sigqueue` list, and `sigtoproc()` is called to
    post the signal.


    User tasks in Linux, created via explicit calls to either `thr_create(3T)` or
    `pthread_create(3T)`, all have their own signal masks. Linux threads call `clone()`
    with `CLONE_`*`SIGHAND`*; this shares all signal handlers between threads via
    sharing the `current->`*`sig`* pointer. Delivered signals are unique to a thread.


    In some operating systems, like Solaris 7, signals generated as a result of a
    trap (`SIGFPE`, `SIGILL`, etc.) are sent to the thread that caused the trap. Asynchronous
    signals are delivered to the first thread that is found not blocking the signal.
    In Linux it is almost exactly the same. Synchronous signals occurring in the context
    of a given thread are delivered to that thread. Asynchronous in-kernel signals
    (e.g. asynchronous network I/O) are delivered to the thread that generated the
    asynchronous I/O. Explicit user-generated signals get delivered to the right thread
    as well.


    However, if `CLONE_`*`PID`* is used, all places that use the PID to deliver a
    signal will behave in a weird way. The signal gets randomly delivered to'
  merge: -1
  img_proc: true
- pgno: 220
  md: "the first thread in the pidhash. Linux threads don’t use CLONE_PID so there\
    \ is no such problem if you are using the pthreads.h thread API.\n\nWhen a signal\
    \ is sent to a user task, for example when a user-space program accesses an illegal\
    \ page, the following happens:\n\n+   1.  page_fault( entry.S) —Low-level pagefault\
    \ handler.\n+   2.  do_page_fault() (fault.c) —Fetches i386-specific parameters\
    \ of the fault and does basic validation of the memory range involved.\n+   3.\
    \  handle_mm_fault() (memory.c) —Generic MM code (i386-independent), gets called.\
    \ The MM reads the page table entry and uses the VMA to find out whether the memory\
    \ access is legal.\n\nThe following case details an illegal access—a write was\
    \ attempted to a read-only mapping. handle_mm_fault() returns 0 to do_page_fault()\
    \ in this case:\n\n```\n```\n{\n    int fault = handle_mm_fault (tsk, vma, address,\
    \ write);\n    if (fault < 0)\n        goto out_of_memory;\n    if (!fault)\n\
    \        goto do_sigbus;\n}\n... \n```\n\n```\n\n```\n```\ndo_sigbus:\n    up\
    \ ( &mm->mmap_sem );\n\n\n    /*\n     * Send a sigbus, regardless of whether\
    \ we were in kernel\n     * or user mode.\n     */\n    tsk->thread.cr2 = address;\n\
    \    tsk->thread.error_code = error_code;\n    tsk->thread.trap_no = 14;\n   \
    \ force_sig (SIGBUS, tsk);\n```\n\n```\n\nAs you can see, locking of the MM is\
    \ very fine grained (and it better be!), the mm->mmap_sem is per-MM semaphore\
    \ used (which typically varies from process to process).\n\nforce_sig (SIGBUS,\
    \ current) is used to “force” the SIGBUS signal on the faulting task. force_sig()\
    \ delivers the signal even if the process has attempted to ignore SIGBUS.\n\n\
    force_sig fills out the signal event structure and queues it into the process’s\
    \ signal queue (current->sigqueue and current->sigqueue_tail)"
