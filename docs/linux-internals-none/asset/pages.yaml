    # ## Time of Day (TOD) Functions


    There is a syscall called gettimeofday. It provides to user space the current
    system and OS time with microsecond resolution. The kernel keeps account of the
    system time in a variable called xtime, which is a normal variable and is increased
    at each timer IRQ. To get resolution finer than 0.01 sec, we can use two techniques
    on IA32:


    +   - If the CPU is a 486 or a 386, at gettimeofday time we read the down-count
    or latch register from the timer chip and then calculate how much time passed
    since the last timer IRQ. The maximum TOD resolution is bound to the maximum frequency
    of the timer chip.

    +   - On Pentiums and newer chips, we save the time-stamp counter value at each
    timer IRQ. Then, at gettimeofday time, we discover how much time passed since
    the last timer IRQ by comparing the last saved time-stamp counter with the current
    time-stamp counter. We know the frequency of the CPU, so we can translate from
    CPU cycles to an interval of real-world time through straightforward multiplication.
    This gives us the best TOD resolution possible on these recent chips. It’s much
    more precise than microseconds, but the gettimeofday interface doesn’t allow us
    to return information in nanoseconds.


    Let’s see now what happens when the timer IRQ interrupt handling routine is entered
    in the kernel.


    Some operating systems—here we use the example of Solaris—set the free memory
    level that is present in the system. Linux does not do this for several reasons.
    The most important one is that in generating some free memory we may need to swapout,
    yet we can’t wait for I/O completion from an IRQ handler.


    > Although swapout is almost always asynchronous, sometimes we may need to wait
    for completion of swap I/O, to be sure that there is some free memory before we
    try new allocation of memory. A pool of atomic free memory is instead kept free
    by a proper kernel daemon (kswapd).'
