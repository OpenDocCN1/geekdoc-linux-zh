    # ## Signals and Interrupts, a Perfect Couple


    Signals can be sent from system calls, interrupts, and bottom-half handlers alike;
    there is no difference. In other words, the Linux signal queue is interrupt safe,
    as strange and recursive as it sounds. So it’s pretty flexible.


    An interesting signal-delivery case, however, is on SMP: imagine a thread is executing
    on one processor, and it gets an asynchronous event (e.g. synchronous socket I/O
    signal) from an IRQ handler (or another process) on another CPU. In that case
    we send a cross-CPU message to that running process, so there is no latency in
    signal delivery. The speed of cross-CPU delivery is about 5 microseconds on a
    350MHz Pentium II.


