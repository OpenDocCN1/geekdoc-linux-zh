- pgno: 288
  md: 'This logging style introduces a synchronous write to the log disk into each
    inode or virtual file system (VFS) operation that modifies metadata. (For database
    mavens, this is a redo-only, physical after-image, write-ahead logging protocol
    using a no-steal buffer policy.) In terms of performance, this compares well with
    many nonjourmaling file systems that rely upon multiple careful synchronous metadata
    writes for consistency. However, it is a performance disadvantage when compared
    to other journaling file systems, such as Veritas VxFS and Transarc Episode, which
    use different logging styles and lazily write log data to disk. In the server
    environment, where multiple concurrent operations are performed, this performance
    cost is reduced by *group commit*, which combines multiple synchronous write operations
    into a single write operation. The logging style of JFS has been improved over
    time and now provides asynchronous logging, which increases performance of the
    file system.


    Obviously there is much more to say about JFS, but as JFS is enhanced further,
    and new functionality and features will creep in, a complete discussion of JFS
    cannot be given here.


    # ## Logical Volume Manager Abstract


    The goal of the Logical Volume Manager abstract is to implement a very flexible
    virtual disk subsystem to handle disk storage, online allocation and relocation
    of storage, and online extension and reduction of storage.


    The Logical Volume Manager (LVM) adds an additional layer between the physical
    peripherals and the I/O interface in the kernel, which allows us a logical view
    of disks. This also permits the concatenation of several disks (physical volumes
    or PVs) to form a storage pool (Volume Group or VG) with allocation units called
    physical extents (PEs).


    Parts of this VG then can be allocated in the form of Logical Volumes (LVs) in
    units called logical extents (LEs). Each logical extent is mapped to a corresponding
    physical extent of equal size. These physical extents are mapped to offsets and
    blocks on the disk(s).


    The LVs can then be used through device special files similar to /dev/sd[a-z]*
    or /dev/hd[a-z]* named /dev/VolumeGroupName/LogicalVolumeName.


    Going beyond this, you are able to extend or reduce VGs AND LVs at runtime.'
  merge: -1
