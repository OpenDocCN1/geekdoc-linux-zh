    # # An Example of Exceptions as Objects from Java


    In Java, exceptions are objects; in addition to throwing objects whose class is
    declared in `java.lang`, you can throw objects of your own design. To create your
    own class of throwable objects, you need only declare it as a subclass of some
    member of the Throwable family. In general, however, the throwable classes you
    define should extend class Exception—they should be “exceptions.” Usually, the
    class of the exception object itself indicates the type of abnormal condition
    that was encountered. For example, if a thrown exception object has class `illegalArgumentException`,
    that indicates someone passed an illegal argument to a method.


    When you throw an exception, you instantiate and throw an object whose class,
    declared in `java.lang`, descends from Throwable. Throwable has two direct subclasses,
    Exception and Error. Errors (members of the Error family) are usually thrown for
    more serious problems, such as `OutOfMemoryError`, which may not be so easy to
    handle. Errors are usually thrown by the methods of the Java API, or by the Java
    Virtual Machine itself. In general, code you write should throw only exceptions,
    not errors.


    The Java Virtual Machine uses the class of the exception object you throw to decide
    which `catch` clause, if any, should be allowed to handle the exception. The `catch`
    clause can also get information about the abnormal condition by querying the exception
    object directly for information you embedded in it during instantiation before
    throwing it. The Exception class allows you to specify a String detail message
    that can be retrieved by invoking `getMessage()` on the exception object.


    # ## Vectors


    Each interrupt or exception has a number, which is referred to by the IA32 literature
    as its *vector*. The NMI interrupt and the processor-detected exceptions have
    been assigned vectors in the range 0 through 31, inclusive. The vectors for maskable
    interrupts are determined by the hardware. External interrupt controllers put
    the vector on the bus during the interrupt-acknowledge cycle. Any vector in the
    range of 32'
  merge: -1
