  md: "```\n/*\n * Error return values for the *nopage functions\n */\n#define NOPAGE_SIGBUS\
    \ (NULL)\n#define NOPAGE_OOM ((struct page *) (-1))\n```\n\n```\n/*\n * Various\
    \ page->flags bits:\n *\n * PG_reserved is set for a page which must never be\
    \ accessed (which\n may not even be present).\n *\n * PG_DMA has been removed,\
    \ page->zone now tells exactly whether the\n page is suited to do DMAing into.\n\
    \ *\n * Multiple processes may \"see\" the same page. E.g. for untouched\n * mappings\
    \ of /dev/null, all processes see the same page full of\n * zeroes, and text pages\
    \ of executables and shared libraries have\n * only one copy in memory, at most,\
    \ normally.\n *\n * For the non-reserved pages, page->count denotes a reference\
    \ count.\n * page->count == 0 means the page is free.\n * page->count == 1 means\
    \ the page is used for exactly one purpose\n * (e.g. a private data page of one\
    \ process).\n *\n * A page may be used for kmalloc() or anyone else who does a\n\
    \ * _get_free_page(). In this case the page->count is at least 1, and\n * all\
    \ other fields are unused but should be 0 or NULL. The\n * management of this\
    \ page is the responsibility of the one who uses\n * it.\n *\n * The other pages\
    \ (we may call them \"process pages\") are completely\n * managed by the Linux\
    \ memory manager: I/O, buffers, swapping etc.\n * The following discussion applies\
    \ only to them.\n *\n * A page may belong to an inode's memory mapping. In this\
    \ case,\n * page->inode is the pointer to the inode, and page->offset is the\n\
    \ * file offset of the page (not necessarily a multiple of PAGE_SIZE).\n *\n *\
    \ A page may have buffers allocated to it. In this case,\n * page->buffers is\
    \ a circular list of these buffer heads. Else,\n * page->buffers == NULL.\n *\n\
    \ * For pages belonging to inodes, the page->count is the number of\n * attaches,\
    \ plus 1 if buffers are allocated to the page.\n *\n * All pages belonging to\
    \ an inode make up a doubly linked list\n * inode->i_pages, using the fields page->next\
    \ and page->prev. (These\n * fields are also used for freelist management when\
    \ page->count==0.)\n * There is also a hash table mapping (inode,offset) to the\
    \ page\n * in memory if present. The lists for this hash table use the fields\n\
    \ * page->next_hash and page->pprev_hash.\n```"
