- pgno: 238
  md: 'tion across programming languages; for example the read system call will read
    data from a file descriptor. To the programmer, this looks like another C function,
    but in actuality the code for read is contained within the kernel. The IA32 CPU
    recognizes two classes of events needing special processor attention: interrupts
    and exceptions. Both cause a forced context switch to a new procedure or task.


    # # Interrupts


    For a detailed treatise on interrupts, please check Chapter 3, “Kernel Base Functions.”
    Interrupts can occur at unexpected times during the execution of a program, and
    they are used to signal the need for processor attention from hardware. When a
    hardware device issues an interrupt, the interrupt handler is found within the
    kernel. Two sources of interrupts are recognized by the IA32: maskable interrupts,
    the vectors for which are determined by the hardware; and nonmaskable interrupts
    (NMIs).


    # # Exceptions


    Exceptions are either processor detected, or else issued (thrown) from software:
    When a procedure or method encounters an abnormal condition (an *exception condition*)
    that it can’t handle itself, it may throw an exception. Exceptions of either type
    are *caught* by handler routines (*exception handlers*) positioned along the thread’s
    procedure or method invocation stack—the calling procedure or method or, if that
    doesn’t include code to handle the exception condition, then its calling procedure
    or method, and so on up. If one of the threads of your program throws an exception
    that isn’t caught by any procedure (or method), then that thread will expire.


    An exception indicates to a calling procedure that an abnormal (although not necessarily
    rare) condition has occurred; for example, when a method is invoked with an invalid
    argument. When you throw an exception, you are performing a kind of structured
    “go to” from the place in your program where an abnormal condition was detected
    to a place where it can be handled. Exception handlers should be stationed at
    program-module levels in accordance with how general a range of errors each is
    capable of handling, so that as few exception handlers as'
