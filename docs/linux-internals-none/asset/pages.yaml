  md: '# Block Allocation Map


    The block allocation map is used to track the allocated or freed disk blocks for
    an entire aggregate. Because all of the filesets⁴ within an aggregate share the
    same pool of disk blocks, this allocation map is used by all of the filesets within
    an aggregate when allocating or freeing disk blocks.


    The Block Allocation Map is itself a file, which is described by aggregate inode
    2. When the aggregate is initially created, the data blocks for the map to cover
    the aggregate space are allocated. The map may grow or shrink dynamically as the
    aggregate is expanded or shrunk. Each page of the map is 4K in length. The map
    contains three types of pages: the `bmap control page`, the `dmap control pages`,
    and the `dmap pages`.


    Each dmap contains a single bit to represent each aggregate block. The n-th bit
    represents the allocation status of the n-th logical aggregate block. This is
    defined by `struct dmap_t,` in `linux/include/linux/JFS/JFS_dmap.h` file. Each
    dmap page covers 8K of aggregate blocks.


    Because the block allocation map may have many dmap pages, they are managed through
    the dmap control pages. These pages improve the performance of finding large extents
    of free blocks. The size of the aggregate determines how many of these pages and
    how many levels are needed. If not all of the levels are needed, then the block
    map inode will be a sparse file with holes for the first page of each of the unused
    levels.


    JFS employs a commit strategy to ensure that the control data is reliably updated.
    “Reliable update” means that a consistent JFS structure and resource allocation
    state is maintained in the face of system failures. To ensure that the block allocation
    map is in a consistent state, JFS maintains two maps in the dmap structure, the
    *working map* and the *persistent map*. The working map records the current allocation
    state. The persistent map records the committed allocation state, consisting of
    the allocation state as found on disk or described by records within the JFS log
    or committed JFS transactions.


    When an aggregate block is freed, the permanent map is updated first; when an
    aggregate block is allocated, the working map is updated first. A bit of 0 represents
    a free resource and a value of 1 an allocated resource.


    > ⁴ The fileset(s) are mountable entity or entities, analogous to an ext2fs file
