    # # More-Complex System Calls


    Some system calls are more complex than others because of variable length argument
    lists. Examples of a complex system call include open() and ioctl(). However,
    even these complex system call must use the same entry point; they just have more
    parameter setup overhead. Each system-call macro expands to an assembly routine
    which sets up the calling stack frame and calls _system_call() through an interrupt,
    via the instruction int $0x80.


    For example, the setuid system call is coded as:


    ```

    _syscall1(int, setuid, uid_t, uid);

    ```


    which expands to:


    ```

    _setuid:

    subl $4, %esp

    pushl %ebx

    movzl 12(%esp), %eax

    movl %eax, 4(%esp)

    movl $23, %eax

    movl 4(%esp), %ebx

    int $0x80

    movl %eax, %edx

    testl %edx, %edx

    jge L2

    negl %edx

    movl %edx, _errno

    movl $-1, %eax

    popl %ebx

    addl $4, %esp


    ret


    L2:


    movl %edx, %eax

    popl %ebx

    addl $4, %esp

    ret

    ```'
