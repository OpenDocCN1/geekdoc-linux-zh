    Notice how nicely Linux organizes the source code into architecture-

    dependent and independent code. About 95 percent of the kernel source

    is independent code, and thus will be exactly the same on all porting

    sets of Linux. The remaining 5 percent is usually assembler code or

    minor details, such as clock timer frequency.


    # The arch/ Directory


    Architecture-dependent code resides in the `arch/` directory. Under this

    directory, for each existing porting set of Linux, there are three more

    subdirectories: `kernel/`, `lib/`, and `mm/`.


    The `kernel/` subdirectory contains architecture-dependent implemen-

    tations of general kernel features, such as signals handling, clock han-

    dling, and so forth. The `lib/` subdirectory contains local implemen-

    tations of library functions that run faster if compiled from

    architecture-dependent source code. The `mm/` subdirectory contains local

    memory handling implementations.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # The drivers/ Directory


    Perhaps unsurprisingly, all drivers source code resides in the `drivers/` directory.
    Because of the great variety of devices supported by Linux 2.4, there is a lot
    of source code here; actually, more than 50 percent of all the kernel source resides
    within the `drivers/` directory.


    # # The fs/ Directory


    The `fs/` directory is the location for all supported file systems. Those experimenting
    with new file systems, such as IBM''s JFS or Hans Reiser''s reiserfs, will have
    to patch this directory to contain the source code for those file systems.


    # # The include/ Directory


    Before a new kernel is actually compiled, it must be configured. Configuring in
    this context means telling the `make` utility which drivers, features, and modules
    to compile into the kernel. By default, most standard distributions come with
    a uniprocessor kernel. To implement the standard SMP features of the kernel, configuration
    with SMP is required.


    # # The ipc/ Directory


    All the code necessary for handling interprocess communication is in the `ipc/`
    directory. The all-important semaphores-handling C code is here (sem.c). Nevertheless,
    this directory contains only 3,751 lines of code.


    # # The init/ Directory


    Main.c, which contains a lot of very important code, like the code to implement
    fork() and that most-often-executed code, the `cpu_idle()` loop, resides in the
    `init/` directory.


    The code that produces the bogomips reading at boot is here for those who are
    still looking at it for an indication of speed. You will find that it does not
    actually measure processor speed. The BogoMips reading has become somewhat of
    an indicator of a computer''s speed. What it does in fact is measure the time
    it takes the processor to perform an noop (no operation) which does not at all
    indicate the system''s performance.'
  merge: -1
  img_proc: true
