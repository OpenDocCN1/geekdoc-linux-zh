    In the above example, **ftime** is executing 100 forks and measuring the time
    elapsed. As you can see, the average fork took 1.137 milliseconds, while the average
    thread created (**time** code) took .017 milliseconds (17 microseconds). In this
    example, thread creation was about 67 times faster. Also, my test case for threads
    does not include flags in the thread create call to tell the kernel to create
    a new lightweight process (LWP) with the thread and bind the thread to the LWP.
    This would have added additional weight to the call, bringing it closer to the
    fork time.


    Even if LWP creation closes the gap in creation times between processes (forks)
    and threads, user threads still offer advantages in resource utilization and scheduling—as
    we will see shortly.


    Of course the Linux SMP (and even the uniprocessor variant) scheduler is clever
    enough to optimize the scheduling of the threads on the same CPU. This happens
    because by rescheduling a thread, there won''t be any TLB flush and basically
    no context switch at all. Said differently, the virtual memory addressing won''t
    change. A thread switch is very lightweight compared to a process switch and the
    scheduler is aware of that. The only things that Linux does while switching between
    two threads (not in strict order) are:


    +   *   Enter `schedule()`.

    +   *   Restore all the registers of the new thread (stack pointer and FP included).

    +   *   Update the TSS with the data of the new thread.

    +   *   Jump to the old EIP of the new thread.


    The TLB is not touched, and the address space and all the page tables remain the
    same. And the big advantage is that Linux does it all very fast. Other UNIX systems
    are bloated by SMP locks, and so the kernel loses time getting to the task switch
    point. For this reason the Solaris kernel threads are slower than the userspace
    kernel threads. Of course, the kernel-based threads scale the load across multiple
    CPUs, but operating systems like Solaris pay a big fixed cost on systems with
    few CPUs for the benefit of scaling well with lots of CPUs.


