    # SMP Scheduler Heuristics


    The 2.4 kernel scheduler for multi-CPU systems implements a modern, heuristic
    approach. In other words, based on past experience with a task and its behavior,
    the scheduler will try to predict its future resource requirements and devise
    and appropriate scheduling policy. The SMP scheduler heuristic works as a function
    of (in random order):


    +   - The idle CPUs.

    +   - The last CPU where the awakened task ran.

    +   - The MM of the task (for kernel-threads reschedule).

    +   - The goodness (a composite assessment, loosely, of importance or priority,
    explained below) of the tasks running on the busy CPUs.

    +   - The time necessary to invalidate the L2 cache on the running CPU (cacheflush_time).

    +   - The average timeslice (avg_slice) of the awakened task (how much time the
    task is allotted to run before returning to sleep).


    The algorithm collects the above data and chooses the best CPU on which to reschedule
    the awakened task.


    There are two paths involved in the Linux scheduler behavior:


    +   - Schedule()—The running or current task is a SCHED_OTHER task that expired
    its timeslice, so the kernel runs a schedule() while returning from the timer
    IRQ handler for switching to the next running task.

    +   - Reschedule_idle()—A task was awakened (usually from an IRQ) and we try to
    reschedule such awakened tasks on the best CPU by invoking a schedule() on it;
    it’s a kind of controlled schedule().


    Both the above share the goodness() function. The goodness() function can be considered
    the core of the SMP scheduler. It calculates the goodness of a task as a function
    of:'
  merge: -1
  img_proc: true
- pgno: 185
  md: "+   - The task currently running\n+   - The task that wants to run\n+   - The\
    \ current CPU\n\nThe goodness function described below can be found in linux/kernel/sched.c:\n\
    \n```\n```\n/*\n * This is the function that decides how desirable a process is..\n\
    \ * You can weigh different processes against each other depending\n * on what\
    \ CPU they've run on lately etc to try to handle cache\n * and TLB miss penalties.\n\
    \ *\n * Return values:\n *      -1000: never select this\n *      0: out of time,\
    \ recalculate counters (but it might still be\n *          selected)\n *     \
    \ +ve: \"goodness\" value (the larger, the better)\n *      +1000: realtime process,\
    \ select this.\n */\n\nstatic inline int goodness(struct task_struct * p, int\
    \ this_cpu, struct mm_struct *this_mm)\n{\n\tint weight;\n\n\t/*\n\t * Realtime\
    \ process, select the first one on the\n\t * runqueue (taking priorities within\
    \ processes\n\t * into account).\n\t */\n\tif (p->policy != SCHED_OTHER) {\n\t\
    \tweight = 1000 + p->rt_priority;\n\t\tgoto out;\n\t}\n\n\t/*\n\t * Give the process\
    \ a first-approximation goodness value\n\t * according to the number of clock-ticks\
    \ it has left..\n\t *\n\t * Don't do any other calculations if the time slice\
    \ is\n\t * over..\n\t */\n\tweight = p->counter;\n\tif (!weight)\n\t\tgoto out;\n\
    \n#ifdef __SMP__\n\t/* Give a largish advantage to the same processor... */\n\t\
    /* (this is equivalent to penalizing other processors) */\n\tif (p->processor\
    \ == this_cpu)\n\t\tweight += PROC_CHANGE_PENALTY;\n```\n```"
