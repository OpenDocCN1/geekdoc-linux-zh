  md: "Init, the father, creates children by forking them. As such, init is androgynous,\
    \ being able to procreate by itself, without help of a female counterpart. Seriously\
    \ though, user programs are created either from init or from a child process of\
    \ init. The system call to create a child process is called `fork`, although in\
    \ Linux there is a second way to create child processes, `__clone()`. The double\
    \ underscore prefixing the name of the system call is there to show that it should\
    \ usually be called from library functions that wrap it in more user-friendly\
    \ clothing.\n\nForking is a means for a father process to duplicate itself into\
    \ an exact copy, except for the PID. The `fork()` function at one point must add\
    \ the newly created task to the `task_struct`. The kernel function used to add\
    \ and remove tasks is `add_to_runqueue` and `del_from_runqueue`. You can find\
    \ it in linux/kernel/sched.c:\n\n```\nstatic inline void add_to_runqueue(struct\
    \ task_struct * p)\n{\n\tlist_add(&p->run_list, &runqueue_head);\n\tnr_running++;\n\
    }\n```\n\nFrom the point when the new task comes to life it is totally independent.\n\
    \nAs we saw earlier, Linux also introduced another means to create user processes,\
    \ `__clone`. Unlike `fork()`, `__clone` allows the child process to share parts\
    \ of its execution context with its parent process, such as the memory space,\
    \ the table of file descriptors, and the table of signal handlers. The main use\
    \ of `__clone` is to implement *threads*. These are multiple threads of control\
    \ in a program, which run concurrently in a shared memory space. Be careful when\
    \ using `__clone`, because it is a Linux-specific feature and thus not portable\
    \ to other operating systems; `fork()`, is a standard function and exists on many\
