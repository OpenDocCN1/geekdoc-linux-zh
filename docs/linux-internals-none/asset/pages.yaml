    # # Linux Time-Keeping Functions


    The system''s awareness of time and dates is a software abstraction and thus not
    kept anywhere in hardware. For the system to maintain a consistent date across
    reboots, obviously hardware must be used to store and update the time and date.
    This is done at the lowest hardware levels, maintaining hardware registers used
    for interval timing (counting processor clock ticks), along with larger hardware
    register spaces to store detailed date information (i.e., year, month, day, hour,
    minute, second). Some software functions in the OS simply use the interval counter,
    along with a known starting point, and convert the tick count into something that
    has meaning to more mortals and is relevant to computer software.'
