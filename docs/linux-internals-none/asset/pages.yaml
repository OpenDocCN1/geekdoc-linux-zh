- pgno: 76
  md: "To be able to handle housekeeping tasks such as setting the clock, the Linux\
    \ kernel asks the timer to send it an IRQ at regular intervals. The exact place\
    \ where this value is set is in the architecture-specific part of the kernel.\
    \ Because each architecture may have different needs, it makes sense to do it\
    \ this way.\n\nFor i386, everything related to the timer is in linux/arch/i386/kernel/time.c\
    \ but the real clock initialization happens in linux/arch/i386/kernel/irq.c in\
    \ the function init_IRQ():\n\n```\n_initfunc(void init_IRQ(void))\n{\n[...] \n\
    /*\n* Set the clock to 100 Hz, we already have a valid\n* vector now:\n*/\noutb_p(0x34,0x43);\
    \ /* binary, mode 2, LSB/MSB, ch 0 */\noutb_p(LATCH & 0xff, 0x40); /* LSB */\n\
    outb(LATCH >> 8, 0x40); /* MSB */\n\n[...]\n}\n```\n\nwhere LATCH is a macro defined\
    \ in linux/include/linux/timex.h:\n\n```\n/* LATCH is used in the interval timer\
    \ and ftape setup. */\n#define LATCH ((CLOCK_TICK_RATE + HZ/2) / HZ)\n/* For divider\
    \ */\n```\n\nand CLOCK_TICK_RATE is provided by linux/include/asm-i386/timex.h:\n\
    \n```\n#define CLOCK_TICK_RATE 1193180 /* Underlying HZ */\n```\n\nBasically the\
    \ formula is:\n\n```\n[1] CLOCK_TICK_RATE / HZ --> downcount\n```\n\nand then\
    \ the kernel writes the downcount in the timer chip. HZ is the frequency of the\
    \ timer interrupt that we want to achieve.\n\nOn the i386 architecture Linux uses\
    \ a 100Hz timer mainly because the earliest Linux development was done with the\
    \ obsolete standards of the time where a hundredth of a second was a significant\
    \ amount of time for a processor. Now, with processors such as the Alpha chip,\
    \ which are orders of magnitude faster, architectures use a 1024Hz timer in Linux."
