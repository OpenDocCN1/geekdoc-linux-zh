    \ of the kernel. For instance, inflate.c can be found here; this code can decompress\
    \ a kernel at boot and load it into memory. It also knows how to decompress standard\
    \ PKZIP 8-bit compression algorithms.\n\n# The kernel/ Directory\n\nSome of the\
    \ most frequently called kernel functions reside in the kernel/ directory. The\
    \ scheduler, fork(), and timer.c are found here. You will also find printk.c in\
    \ this directory. Throughout the kernel source code, printk() is used instead\
    \ of printf(), because the printf() function is not SMP-capable when called from\
    \ within the kernel. If it were, various tasks running on different CPUs might\
    \ write to the console or to the syslog at the same time and garble the output.\n\
    \n# The mm/ Directory\n\nThe mm/ directory contains the source code to implement\
