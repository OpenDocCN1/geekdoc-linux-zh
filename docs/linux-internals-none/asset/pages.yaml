    # Block Device Handling


    All devices that structure the data they contain into blocks, such as disks, floppies,
    and CDROMs, read or write that data in chunks, or more appropriately, in blocks.
    The kernel buffer cache optimizes reading and writing from and to blocks.


    Because it is necessary for the understanding of concepts covered later, we must
    discuss the basic concepts of disk device access.


    # Components of Disk Access Time: The Path of a Disk I/O Operation


    We will examine SCSI disks here, because IDE disks are really not worth putting
    in a self-respecting Linux server; IDE controllers don’t disconnect from the bus
    while waiting for completion from disk I/O. In a multi-user, multi-tasking environment
    like Linux, this is clearly detrimental to performance—to put it mildly.


    A simple SCSI subsystem consists of four main components: the host computer, the
    SCSI host adapter, the embedded target controller, and the disk mechanism itself.
    When the OS receives an I/O request from the user, it converts the request into
    an SCSI command sequence. The requesting process is blocked, pending the completion
    of the I/O operation, unless the request was issued synchronously (there are certain
    application where this makes sense). The command sequence is then transferred
    across the host’s I/O bus (PCI, ISA, SBUS, Channels, etc.) to the SCSI host adapter.
    The host adapter then accepts responsibility for interacting with the target controllers
    and their devices.


    Next, the host adapter selects the target by asserting its control line on the
    SCSI bus when the bus is available; this period is known as the *selection phase*.
    When the target responds to the selection, the host adapter transfers the command
    to the target; this period is called the *command phase*.


    If the target is able to satisfy the command immediately (maybe from its cache),
    it returns the requested data or status. If the operation is a'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'read, the data are not usually available, so the target disconnects, thus freeing
    the SCSI bus for other operations. If the operation is a write, a *data phase*
    immediately follows the command phase on the bus; the data are transferred to
    the target''s cache, and the target disconnects.


    Writes are *not* acknowledged until the data is actually put on the disk platter.
    This is because the target controller''s cache is subject to power failure. On
    some units an uninterruptible power supply (UPS) is available, and the disk''s
    controller can be told to acknowledge writes as soon as they are in the cache.
    This greatly improves performance.


    # ## Mechanical Disk Operations


    Moving the disk arm radially (seeking) costs between 0.5 and 40 milliseconds,
    depending on how far the arm must actually travel. The other mechanical operation,
    waiting for the platter to rotate until the block files under the head, costs
    4.2 to 8.6 milliseconds. This delay is called *rotational latency*. The actual
    time to transfer data from the platter to the disk RAM or vice versa is called
    the *internal transfer time*, and is dependent upon the rotational speed and the
    density at which these data are recorded onto the platter. Although rotational
    speed is constant for any given disk, recording density is usually variable. For
    typical disk drives, the internal transfer speed varies between 2MB/sec and 7MB/sec.
    The data are transferred from the disk platter to the intelligent disk controller
    embedded in all SCSI disks. For the typical I/O request of 8KB, internal transfer
    consumes 1 to 4 milliseconds. In addition, I/O requests spend 0.5 to 2 milliseconds
    (depending on the speed of the host processor) being processed in the OS. Finally,
    the data must be transferred over the SCSI bus. At the 20MB/sec of a fast/wide
    SCSI bus, the typical I/O takes an additional 0.39 milliseconds. Thus, in the
    average case, an I/O takes about 28 to 30 milliseconds, assuming all paths are
    clear of contention. In a multi-user, multi-tasking environment such as UNIX,
    essentially all I/O behaves randomly; that is, it is spread among the whole disk
    and disk units.


    # ## RAID Comes to the Rescue


    The best performance can be achieved by *striping* (RAID 0 and 1) and *mirroring*.
    If you stripe a database among several disks and additionally mirror it, the logic
    in the RAID controller makes sure to distribute the I/O among as many disks as
    possible, therefore returning the desired data to the user process more quickly.'
