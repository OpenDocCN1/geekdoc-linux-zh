- pgno: 237
  md: 'This chapter will give you an understanding of the dynamics of system calls
    in Linux. Wherever code sections are mentioned, unless otherwise specified, I
    refer to the 2.3.52 (soon to be 2.4) series of kernels.


    To review a few broad terms:


    +   - A *kernel* is the operating system software, running in protected mode and
    having access to the hardware''s privileged registers.

    +   - Some operating systems employ a *microkernel architecture*, wherein device
    drivers and other code are loaded and executed on demand, and are not necessarily
    always present in memory.

    +   - By contrast, a *monolithic architecture* is more common among UNIX implementations.
    It is employed by classic designs such as BSD.


    The Linux kernel is a mostly monolithic kernel: all device drivers are part of
    the kernel proper. Unlike BSD, a Linux kernel''s device drivers can be loadable,
    that is, they can be loaded and unloaded from memory through user commands. The
    kernel is not a separate process running on the system. It is the guts of the
    operating system, which controls the scheduling of processes to achieve multitasking
    and provides a set of routines, constantly in memory, to which every user space
    process has access.


    The kernel also contains the routines that implement the interface between user
    programs and hardware devices, paging in and out of virtual memory, file management,
    and many other aspects of the system. To achieve all this, kernel routines can
    be called from user-space code in a number of ways. One direct method to utilize
    the kernel is for a process to execute a system call. There are 116 system calls;
    documentation for these can be found in the man(2) pages.


    # # System Calls and Event Classes on the IA32


    A system call, then, is a request by a running task to the kernel to provide some
    sort of service on its behalf. In general, the kernel services invoked by system
    calls comprise an abstraction layer between hardware and user-space programs,
    allowing a programmer to implement an operating environment without having to
    tailor his program(s) too specifically to one single brand or precise specific
    combination of system hardware components. System calls also serve this generalization
    func-'
