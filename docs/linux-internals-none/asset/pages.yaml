  md: 'the kernel (we''ll take a closer look at this in a moment). The kernel can
    also use the hardware clock for real-time profiling or other time- and interval-related
    functions. Solaris provides command-line and programming interfaces to timer and
    date functions, including, of course, the basic `date(1)` command, which sets
    or retrieves the kernel''s notion of the date and time.


    # ## System Clock


    All computer systems—from desktop PCs to high-end multiprocessor systems—have
    a clock circuit of some sort.


    All PCs have a *real-time clock* (RTC) built into them. Usually, and RTC is built
    into the chipset of the computer, but some may actually have a Motorola MC146818
    (or clone) on the board. This is the clock that keeps the date and time while
    your computer is turned off. This same clock chip can also be used to generate
    signals, from a slow 2Hz to a relatively fast 8192Hz, in increments of powers
    of two. The clock can also work like an alarm, raising IRQ 8 when it has counted
    down to a previously stored value. The alarm can also be programmed only to check
    any subset of the three programmable values, meaning that it could be set to ring
    on the 30th second of the 30th minute of every hour, for example.


    The driver controlling the real clock is `/dev/rtc` (major 10, minor 135, read-only
    character device) and it reports the current value in the form of an unsigned
    long. The low byte contains the type of interrupt (update-done, alarm-rang, or
    periodic) that was raised; the remaining bytes contain the number of interrupts
    since the last read. Status information is reported through the pseudo-file `/proc/driver/rtc`
    if the `/proc` filesystem is enabled. A user process can monitor these interrupts
    by doing a `read(2)` or a `select(2)` on `/dev/rtc`.


    Under heavy IRQ load, sometimes the interrupts pile up because they get processed
    together by the bottom-half IRQ handler of the kernel. It is up to the user program
    to check the number of interrupts received since the last read. On modern hardware
    these IRQ jams typically start to happen for frequencies above 4096Hz and more.
    Programming and/or enabling interrupt frequencies greater than 64Hz is only allowed
    by root. This was done to prevent a misbehaving user program from generating lots
    of IRQs that impact overall system performance.


    Also, if the kernel time is synchronized with an external time source, the kernel
    will write the time back to the CMOS clock every 11 minutes. In the process of
    doing this, the kernel briefly turns off RTC periodic interrupts, so be aware
    of this if you are doing serious work.'
