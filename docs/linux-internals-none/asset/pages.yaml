    # Implementing Page Coloring


    Page coloring is a performance optimization designed to ensure that accesses to
    contiguous pages in virtual memory make the best use of the processor cache. In
    ancient times (i.e., 10 or more years ago) processor caches tended to map virtual
    memory rather than physical memory. This led to a huge number of problems, including
    having to clear the cache on every context switch in some cases, and problems
    with data aliasing in the cache.


    Modern processor caches map physical memory in a manner designed to solve precisely
    these problems.This means that two side-by-side pages in a process''s address
    space do not necessarily correspond to two side-by-side pages in the cache. In
    fact, if you aren''t careful, side-by-side pages in virtual memory could wind
    up using the same page in the processor cache—leading to cacheable data being
    thrown away prematurely and reducing CPU performance. This is true even with multi-way
    set-associative caches (though the effect is mitigated somewhat).


    A per-task tracker of virtual memory page cache allocations is the best way to
    implement dynamic page coloring; checking page tables looks quite slow to me.
    Perfekt static coloring (when possible) may well be the worst thing to do for
    an unlucky application.


    There were some preliminary implementations using this technique being developed
    as this book was written, but none were yet ready to be included here.


