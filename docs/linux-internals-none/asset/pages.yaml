    \n\t\t: : \"memory\");\n\t} while (0)\n```\n```\n\n# ## Page Allocation and Deallocation\n\
    \nThe page allocator in kernel 2.4 is zone based. The physical memory is split\
    \ into zones. The allocator tries to coalesce free memory in big chunks of physical\
    \ contiguous memory. The chunks are naturally aligned in the physical memory.\
    \ Order is 0 for allocating or freeing a single page. Order is 1 for allocating\
    \ two contiguous physical pages (for example the task struct + kernel stack is\
    \ allocated with order 1, because it’s 8,192 bytes in size). For hashtables, the\
    \ order grows much more—up to allocating 2Mbytes of contiguous physical memory.\n\
    \nThe mechanisms and data structures used for page allocation and deallocation\
    \ are perhaps the most critical in maintaining the efficiency of the virtual memory\
    \ subsystem. All the physical pages in the system are described by the mem_map\
    \ data structure, which is a linked list of mem_map_t . Each mem_map_t describes\
    \ a single physical page in the system. Important fields (so far as memory management\
    \ is concerned) are:\n\n+   * count—This is a count of the number of users of\
    \ this page. The count is greater than one when the page is shared between many\
    \ processes.\n+   * age—This field describes the age of the page and is used to\
