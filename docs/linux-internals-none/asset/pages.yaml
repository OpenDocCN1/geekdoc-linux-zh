    with `mke2fs /dev/test_vg/test_lv` and mount it.


    # ## Overview and Concept of Commands


    I grouped and named LVM commands so that the commands for physical volume handling
    all start with `pv`, those for volume group handling start with `vg`, and those
    for logical volumes start with `lv`. Table 10.2 list the LVM commands.


    **TABLE 10.2**

    **Logical Volume Manager Commands**


    | Command | Description |

    | :--- | :--- |

    | e2fsadm | Administration wrapper for logical volume including file system resizing
    for `lvextend`, `lvreduce`, `e2fsc`, and `resize2fs`. |

    | lvchange | Change attributes of a logical volume. |

    | lvcreate | Create a logical volume. |

    | lvdisplay | Display logical volume config data. |

    | lvextend | Extend a logical volume in size. |

    | lvreduce | Reduce a logical volume in size. |

    | lvremove | Remove a logical volume. |

    | lvrename | Rename an inactive logical volume. |

    | lvscan | Find all existing logical volumes. |

    | lvchange | Emergency program to change attributes of the LVM. |

    | lvmiddiskscan | Scan all disks/partitions and multiple devices and list them.
    |

    | lvmmsadc | Statistic data collector. |

    | lvmsar | Statistic data reporter. |

    | pvchange | Change attributes of physical volumes.'
