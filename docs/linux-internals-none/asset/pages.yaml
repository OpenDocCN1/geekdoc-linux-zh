  md: "Note how the timerlist spinlock is unlocked before executing the (user-provided)\
    \ timer function. This greatly increases SMP scalability, and is the most scalable\
    \ IRQ handling code in any UNIX-style OS.\n\nAs a good kernel-based example for\
    \ the above code, it makes sense to implement measurement mechanisms for expiring\
    \ timers. To measure the rate of timer expires in a system, you must write a simple\
    \ kernel module and use `add_timer()`. In this example we use a 10-second timer:\n\
    \n```\n```\nDECLARE_WAITQUEUE_HEAD(timer_sleep);\nvoid your_handler (unsigned\
    \ long private_data)\n{\n        printk(\"timer expired, data got: %01x.\\n\"\
    , private_data);\n        wake_up(&timer_sleep);\n}\n\nint init_module(void)\n\
    {\n        struct timer_list *timer;\n\n        timer = kmalloc(sizeof(*timer));\n\
    \        memset(timer, 0, sizeof(*timer));\n\n        timer->function = your_handler;\n\
    \        timer->expires = jiffies + 10*HZ;\n        add_timer(timer);\n\n    \
    \    printk(\"waiting for timer ...\\n\");\n        sleep_on(&timer_sleep);\n\
    \        printk(\"timer finished, good.\\n\");\n        del_timer(timer);\n\n\
    \        return -1; // fake error, thus the module wont stay\n}\n\nint cleanup_module\
    \ (void)\n{\n        // doesnt actually get called\n        return 0;\n}\n```\n\
    ```\n\nAnother good example of network IRQ handling, where IRQs happen at very\
    \ high rates, especially for gigabit gear, is where network drivers on packet\
    \ arrival unqueue the packet from the networking hardware's structures, acknowledge\
    \ the IRQ, and return. The bottom-half handler NET_BH processes the packet, calculates\
    \ the checksums (if the hardware did not calculate the checksum directly), queues\
    \ the packet to sockets handlers, and changes the socket status. The total processing\
    \ time of NET_BH is probably a few milliseconds, while the hardware interrupts"
