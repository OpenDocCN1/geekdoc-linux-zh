    \ was chosen. This facilitates the debugging process.\n\nSo if, for example, your\
    \ device can only drive the low 24 bits of address during PCI bus mastering, you\
    \ might do something like:\n\n```\nif (! pci_dma_supported(pdev, 0x00FFFFFF))\n\
