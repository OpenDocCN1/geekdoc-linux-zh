    ILP for linked-list loop, when load latency is 3


    | **CPU cycle** | **Iteration 1** | **Iteration 2** | **Iteration 3** |

    |---|---|---|---|

    | 1 | LOAD r0,r0 | | |

    | 2 | load 1 | | |

    | 3 | load 2 | | |

    | 4 | CMP r0,#0 | LOAD r0,r0 | |

