- pgno: 36
  md: "# ## The GNU gcc Compiler\n\nThe Linux kernel is written for the GNU gcc compiler.\
    \ Trying to compile it with any other C compiler will result in complete failure.\
    \ The source code is full of gcc-specific directives that prevent using anything\
    \ but the gcc compiler. Because of this gcc affinity, the kernel source code might\
    \ look strange to people who are used to developing for other C compilers. One\
    \ such common idiosyncrasy is the use of *inline functions*. An inline function\
    \ is a directive to the gcc compiler to fully expand the called function in each\
    \ recurrence, instead of executing a function call each time to a single referenced\
    \ instance of the called function (which requires expensive stack operations).\n\
    \nSome might object that this precludes achieving truly portable code. This is,\
    \ however, really not the case. Because the gcc compiler exists on all platforms\
    \ (inherently so) to which Linux has been ported, the code is portable across\
    \ those architectures. It is, of course, not portable in the sense of being able\
    \ to compile correctly under other C compilers. On the other hand, a kernel is\
    \ not something that requires portability across architectures and compilers.\
    \ The Linux kernel is optimized for reliability and efficiency, and these two\
    \ goals are certainly much more important than portability.\n\n# ## Coding Conventions\n\
    \nAfter reading this book, you may feel ready to contribute to the Linux kernel.\
    \ You are obviously welcome to do so, as long as you respect certain conventions.\n\
    \n+   - Commentaries are always `/* */` style, even for one-line comments. The\
    \ `//` comment is not acceptable.\n+   - Most often, function-opening brackets\
    \ (`{`) are on a separate line.\n+   - If statements are coded this way:\n\n```\n\
    ```\nif (str[0] >= '0' && str[0] <= '9') {\n    strncpy(name, \"ttyS\");\n   \
    \ strncpy(name + 4, str, sizeof(name) - 5);\n} else\n    strncpy(name, str, sizeof(name)\
    \ - 1);\nname[sizeof(name) - 1] = 0;\n```\n```"
