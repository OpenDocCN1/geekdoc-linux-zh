  md: '# Extent-based Allocation (General)


    Extent-based allocation file systems, such as Veritas'' VxFS and IBM''s JFS, allocate
    disk blocks in *extents*; an extent is a contiguous sequence of multiple blocks
    allocated as a unit. Extents are described by a triple consisting of logical offset/length/physical,
    beginning when the file is first created. The addressing structure is a B+tree²
    populated with extent descriptors (the triples), rooted in the inode, and keyed
    by logical offset within the file. Note that file system metadata is written when
    the file is first created, which differs from block-based allocation. Because
    initial allocation is sequential, subsequent reads, writes, and seeks are forced
    to be sequential; within the first allocated extent of blocks they do not require
    additional metadata writes until the next extent is allocated. This optimizes
    the disk seek pattern. The grouping of block writes into clusters allows the file
    system to issue larger physical disk writes to the storage device, saving the
    overhead of many small SCSI transfers. See Figure 10.1.


    Under block-based allocation, a block address number is required for every logical
    block in an allocated file, resulting in a lot of metadata for each file. In extent-based
    allocation, only the start block number and length are required for each contiguous
    extent of data blocks. Such a file, with only a few very large extents, requires
    only a small amount of metadata.


    Extent-based file systems provide good performance for sequential file access,
    because of the sequential allocation policy and block clustering into larger writes.
    For example, if we want to read sequentially through an extent-based file, we
    only need to read the start block number and its length. Then, we can continue
    to read all of the data blocks in that extent. Very little metadata read overhead
    is incurred in reading sequentially.


    > 2 A B-tree is a special kind of balanced m-ary tree that allows us to test for,
    retrieve, insert, and delete records (leaves), which contain either physical address
    data or indexing pointer data. B+trees have their data pointed to only by leaf
    nodes, use virtual keys, and can have a search key value appear more than once.
    A B+tree, usually, is built up in such a way that its node size is defined by
    the page size. Only when the search path follows an edge is paging required. Also,
    data are only stored in the leaves and not in the nodes. In the nodes are kept
    only reference keys, or "road maps." Therefore, the B+tree, with more branches
    possible and a flatter branch structure, is favored. The B+tree is the best structure
    for an efficient search for keys. But the real problems arise with the three different
    tasks one performs: lookup, insert, delete. In the case of a concurrent deletion
    and lookup, there is a 50 percent chance that it might work out or lead to a deadlock.
    Therefore, parallelism is not a good strategy for optimizing performance in an
    extent-based allocation file system.'
  merge: -1
  img_proc: true
