- pgno: 133
  md: 'Memory is a primary resource in a Linux system; it must be carefully managed.
    Obviously, every programmer would like infinite memory. Unfortunately this is
    not yet possible, and so early computer architects implemented a memory hierarchy,
    with a small amount of very fast, expensive, volatile cache; dozens or hundreds
    of megabytes of medium-speed, medium-price, volatile RAM; and hundreds and then
    thousands of megabytes—and upward—of nonvolatile, cheap disk storage. It is up
    to the operating system to coordinate how these memories are used.


    To do this, the Linux memory manager manages a number of tables that list existing
    pages of virtual memory, their status, their age, and other useful information.
    The memory manager also makes use of the hardware functionality of the CPU to
    translate virtual memory addresses into RAM addresses. The CPU itself has a table,
    called translation look-aside buffer (TLB) to speed up the translation process.


    Because the virtual memory subsystem has huge impact on the performance of user
    programs (the kernel itself is not pageable in Linux as it is, for instance, in
    AIX), special care was given to the C source code comprising the functionality
    of the memory manager.


    This chapter first examines the general aspects of the virtual memory manager
    and its functions, and then addresses the peculiarities of its implementation
    in the 2.4 kernel. Because VM is among the least understood concepts of OS theory,
    we will spend more time explaining the workings of VM than we have for other subsystems
    in other chapters of this book. We will see which tables are maintained by the
    kernel and which algorithms interact with them. Finally we will see, using the
    example of a new page replacement algorithm, how a kernel hacker would change
    things.


    # ## VM Concepts


    Each user process sees a single, private contiguous VM address space and each
    such space can contain several types of memory objects. Objects such as program
    text and program data are effectively a single memory-mapped file (the binary
    file being run), but program code is read-only, while program data is copy-on-write.
    Arbitrary files can be memory-mapped into the address space as well, which is
    how the shared library mechanism works. Such mappings can require modifications
    to remain private to the process creating them.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Furthermore, the memory manager must be able to handle system calls like `fork()`
    or `__clone()`. When a process forks, the result is two processes—each with its
    own private address space, including any modifications made by the original process
    prior to the call to `fork()`. It would be a waste of precious CPU cycles if the
    VM system were to make a complete copy of the data at the time of the `fork()`,
    because quite possibly at least one of the two processes will only need to read
    from the page from then on, thus allowing the original page to continue to be
    used. What was a private page is now made copy-on-write again, because each process
    (parent and child) expects its own personal post-fork modifications to remain
    private to itself and not affect the other. A virtual memory page with the program''s
    binary text is one example: each program binary contains a previously (at compile
    time) initialized data section that is initially mapped directly from the program
    file.


    When a program is loaded into a process''s virtual address space, this area is
    initially memory-mapped and backed by the program binary itself, allowing the
    VM system to free or reuse the page and later load it back in from the binary.
    The moment a process modifies this data, however, the VM system must make a private
    copy of the page for that process. Because the private copy has been modified,
    the VM system may no longer free it, because there is no longer any way to restore
    it later on.


    # Swapping


    Private data pages are initially either copy-on-write or zero-fill pages. When
    a change, and therefore a copy, is made, the original backing object (usually
    a file) can no longer be used to save a copy of the page when the VM system needs
    to reuse it for other purposes. This is where swapping comes in. Swapping is obviously
    only necessary for written pages (dirty pages). Indeed, there''s no reason to
    ever write pure code pages into swap space, because you can just page them from
    the original image. Only writable pages should ever swap out; if an executable
    page''s page frame is reclaimed, then the page should be unmapped and forgotten,
    to be reread from the image when faulted in. You can never get to a state in which
    the disk containing the image could be unmounted while the image is running, because
    it will always be busy.'
