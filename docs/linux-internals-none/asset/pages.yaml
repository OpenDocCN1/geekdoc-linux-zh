    \ The dynamic kernel structures in the early stage (for example, while setting\
    \ up the console or the virtual memory manager) are allocated via a new *bootmem*\
    \ allocator, which can return big chunks of physically contiguous memory. In 2.2.x\
    \ we used to advance a pointer to keep track of the memory allocated by hand in\
    \ the early stage, but with newer machines tables can be allocated in the middle\
    \ of the memory; therefore an allocator (*bootmem*) was needed that was also aware\
    \ of memory holes in the early stage of the boot process. The *bootmem* allocator\
    \ also makes sure to return non-DMA memory when possible. This way, we avoid wasting\
    \ the first 16MB of memory with kernel structures that don't need to be there.\n\
    \nOnce the virtual memory manager is booted and initialized and *get_pages* and\
    \ *get_free_pages* get the appropriate pointers from *bootmem*, all further allocations\
    \ of memory are handled by the VM directly.\n\n# ## Shutdown\n\nAll the hard work\
    \ is done in user space. The *halt -f* only tells the *init* process that the\
    \ machine will halt soon via a *SIGSTP*. Then, shutdown executes *sys_reboot(SYS_HALT)*\
    \ and later will call *exit(2)* on an IA32"
