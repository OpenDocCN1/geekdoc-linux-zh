    \ in a special ELF section, and the higher layer parses each special file (device\
    \ driver) *init* section and recalls all the *init* callback without any need\
    \ to write code outside the `.c` file of the low-level driver. This has simplified\
    \ initialization at boot time.\n\nIt is interesting to note that, with this new\
