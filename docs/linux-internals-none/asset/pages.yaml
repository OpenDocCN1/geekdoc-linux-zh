- pgno: 189
  md: "Then the scheduler may “preempt” any task by sending it a suspend signal. Likewise,\
    \ at its whim, the scheduler may signal a task to resume with a continue signal.\
    \ Thus, when A1 times out, it suspends Ctm3 and signals Ctm1 to resume; and then,\
    \ when A2 times out, it suspends Ctm1, and continues Ctm2, and so on. The diagram\
    \ in Figure 6.1 is an extremely simple rendition of preemptive multitasking, which,\
    \ in a real system, may involve prioritization; synchronization; changing timeouts;\
    \ interrupt handlers, and ready, running, and waiting states.\n\nCritical sections\
    \ protected by fast spinlocks or by hand locks can't be preempted unless we block\
    \ the timer IRQ. All the spinlocks should be IRQ-safe spinlocks, and IRQs should\
    \ be clear before each critical section, then increase in IRQ latency by an order\
    \ of magnitude. And all this is to save one check for current need_resched:\n\n\
    ```\n```C\nif (current->need_resched)\n    schedule();\n```\n```\n\nin a strategic\
    \ place.\n\nAvoiding kernel preemption makes the kernel simpler and more robust.\n\
    \n# ## Implications of the Linux Approach\n\nLinux, due to its GPL nature, allows\
    \ us to do things faster than other operating systems do. For example, some popular\
    \ very-closed binary-only operating system, in order to allow the same binary-only\
    \ driver to work “fine” on both SMP and UP kernels, can't inline much material.\
    \ In such an operating system, a `spin_lock()` or `spin_unlock()` for example\
    \ must be called through a function pointer and can't be inlined. This because\
    \ the same binary-only driver work fine on both SMP and UP kernels. A `spin_unlock`\
    \ is one locked ASM instruction:\n\n```\n```assembly\n#define spin_unlock_string\
    \ \\\\\n\"lock ; btrl $0,%0\"\n```\n```\n\nand calling such a clear-bit instruction\
    \ through a function pointer is complete overkill. Such silly binary-only constraints\
    \ aren't in Linux, and we can run at the full CPU speed.\n\nAnother plus of the\
    \ Linux system is that it scales very well in SMP and has nice garbage collection\
    \ for cache pages. Last but not least, the"
