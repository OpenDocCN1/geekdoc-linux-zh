- pgno: 255
  md: 'In this chapter we quickly explore the various components of the file system
    interface and touch on peculiarities of the file system implementation of Linux
    2.4, with emphasis on one particular implementation of a logging file system:
    the IBM Journaling File System (JFS).


    A file system is an indispensable component, providing the superblock- and file-operation
    system calls required by the Linux Virtual File System (VFS) layer, so that the
    OS can provide itself and applications with such basic storage management capabilities
    as:


    +   Create and delete files (i.e. allocate and deallocate space on the storage
    medium). Open files for reading and writing. Seek within a file (Note: Linux does
    not provide kernel-level support for the notion of file records). Close files.
    Create directories to hold groups of files. List the contents of a directory.
    Remove files from a directory.


    These functions have evolved until what we now commonly know as the modern UNIX
    environment offers complex file manipulation capabilities and provides an extensive
    set of data management interfaces.


    # Logical Volume Manager (LVM)


    One huge area of improvement for Linux has been the inclusion of the Logical Volume
    Manager (LVM) subsystem, as of kernel 2.3.48. The LVM in Linux very much resembles
    the HP-UX LVM, with which many system administrators have had very good experiences.
    LVM completely rethinks the way file systems and volumes are managed. It allows
    drives to span disks, be resized, and be managed in a more flexible way than can
    be done using the current partition table schemes.


    The Logical Volume Manager adds an additional layer, a new logical layer, of logical
    volumes (LVs) between the physical peripherals and the I/O interface in the kernel.
    This allows the concatenation of several disks (physical volumes or PVs) to form
    a storage pool (volume group or VG) with allocation units called physical extents
    (called PEs). These physical extents are mapped to offsets and blocks on the disk(s)
    in the volume group. Parts out of the volume group then can be allocated in the
    form of logical volumes in units called logical extents (LEs). Each logical extent
    is mapped to'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'a corresponding physical extent of equal size. The logical volumes can then
    be used through device special files similar to /dev/sd[a-z]* or /dev/hd[a-z]*
    named /dev/VolumeGroupName/LogicalVolumeName.


    The configuration information for each physical volume, the volume group, and
    the logical volume(s) is stored on each physical volume in an area called the
    volume group descriptor area or VGDA. At the time of this writing the VGDA is
    physically located immediately after the superblock, but this may change in the
    very next release. The configuration information is also stored in automatically
    created backup files, which are stored in the /etc/lvmtab.d directory.


    An LVM driver holds mapping tables between the logical extents of logical volumes
    and the physical extents of physical volumes. These tables are created, updated
    or deleted by superuser LVM commands. The main mapping function of the driver
    is called for a logical block in a logical volume from functions ll_rw_block()
    and ll_rw_swap_file() in the file /usr/src/linux/drivers/block/ll_rw_blk.c. The
    mapping function looks up the corresponding physical block/disk pair in a table.
    Then it returns this pair to the calling ll_rw_*( ) function thus causing a physical
    I/O request to the disk block(s) to be queued.


    The main data structures to implement LVM are:


    ```

    pv_disk_t

    vg_disk_t

    lv_disk_t


    and


    disk_pe_t

    ```


    As of this writing, these are in /usr/src/linux/include/linux/lvm.h (pv_disk_t
    is stored at offset 0), but this will drastically change in the next version.
    pv_disk_t describes a physical volume''s characteristics, that is, to which volume
    group the physical volume belongs, its internal number in the volume group, its
    size, and more. vg_disk_t holds the name of the volume group, its internal number,
    the maximum number of logical volumes in this volume group, the physical extent''s
    size, and more. The member vg_on_disk of the pv_disk_t structure describes where
    the vg_disk_t information is stored on disk.


    An array of lv_disk_t structures is stored on disk to hold information about each
    of the logical volumes that exist in the volume group. This array is stored at
    the disk location shown by the lv_on_disk member of the pv_disk_t structure. Each
    lv_disk_t structure holds infor-'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'mation about a logical volume, for example, its name, its access state (read/write),
    its internal number, its size, and more.


    The `disk_pe_t` array holds on disk the mapping information of logical extents
    to logical volumes and physical extents to physical volumes. It can be found starting
    from the location that the `pe_on_disk` member of `pv_disk_t` holds. Each slot
    in the `disk_pe_t` array corresponds to a physical extent on this physical volume—slot
    0 corresponds to physical extent 0, slot 1 to physical extent 1, and so on.


    The mapping information in the `disk_pe_t` array tells that a physical extent
    is used, and to which logical extent in which logical volume it is mapped.


    **How does LVM interact with the kernel’s block devices tables and with the IRQ
    handlers?** It only remaps a logical rdev/rsector pair in the `buffer_head` of
    an I/O request to a physical pair. This takes place in `drivers/block/ll_rw_blk.c`
    in function `ll_rw_block()`. Afterwards, the request gets queued like any other
    request in Linux.


    The correct configuration and maintenance of LVM necessitates learning a host
    of new commands. In Appendix C, the official LVM Abstract is reprinted for an
    introduction to configuration and maintenance.


    **How does LVM fit into the existing 2.3.x kernel?** It’s very simple, because
    the abstractions in the kernel are so powerful. A block device in Linux is simply
    a driver that can take `buffer_heads` and either fill them with data from some
    storage device, or else write their data to a storage device. How that read or
    write works is irrelevant. In particular, it is perfectly legal for a device driver
    to fulfill the I/O request by performing another I/O to a different device, or
    even, indeed, to several devices. Both LVM and the software RAID drivers take
    advantage of that, implementing I/O to the virtual device by performing one or
    more I/Os to one or more disks that belong to the logical volume or RAID set.


    There is a special optimization used when a single I/O to the LVM or RAID driver
    results in just a single I/O to an underlying disk. In that case, we don’t actually
    have to create a new I/O operation to send to the underlying device; rather, the
    logical device just adds a marker to the `buffer_head` that is being read or written,
    to say that the I/O should actually be performed to a different physical device
    than the logical volume—namely, the block device driver to which the given physical
    device was mounted at boot time.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# The Linux Kernel''s Relation

    to the File System


    Because the number of files on a UNIX system may easily range into the hundreds
    of thousands or more, the task of organizing the file system control structures
    is insulated from applications and yet is, strictly speaking, not a kernel either.
    The Linux kernel''s file subsystem has an unusually abstract view of a file system.
    There is no knowledge whatsoever in the Linux kernel of Linux''s own native ext2,
    nor procfs, nor reiserfs, nor any other file system; all file systems are treated
    equally. The kernel provides only very basic hooks into which each file system
    mounted at boot time can attach itself and provide (to both the kernel and to
    applications) the actual functionality, via the creation and management of intermediate
    control structures. This high level of abstraction is the key to allowing all
    file handling to be implemented as kernel system calls acting on instantiated
    control structure objects, rather than as user space file system handling code.
    This in turn allows control structures for open files to be allocated and deallocated
    dynamically both systemwide and per process.


    An application uses the file as an abstraction to address a linear range of bytes
    stored on some form of I/O medium, typically a storage device such as an SCSI
    disk. To access a file, the OS provides file manipulation interfaces to open,
    close, read, and write the data within each file.


    # Kernel Data Structure Objects for

    File System Control Operations


    Listed below are those common data structure objects instantiated by the kernel
    to control file system operations in Version 2.4. The abstractions as represented
    in these data structures are very generic. In the 2.3 kernel the developers finally
    managed to make them scale extremely well on SMP, while still remaining general-purpose
    enough to be able to describe procfs, devfs, and other virtual file systems, NFS,
    Novell, and Microsoft clients, and other network file systems, as well as various
    disk file systems.


    There are three main changes in 2.4. First, 2.4 scales much better on SMP. The
    new data structures are all organized so that we don''t need to hold any SMP locks
    while copying data between the caches and user space.'
  merge: -1
  img_proc: true
- pgno: 259
  md: "Second, the kernel now allows the buffer cache and the page cache to share\
    \ the same memory. The buffer cache has always been used to cache data being written\
    \ to disk, because the write-back code relies on having the physical locations\
    \ of the data available; the buffer cache is the only cache is suitable for physically\
    \ tagged blocks. In older kernels, that task (the tagging of buffered blocks to\
    \ physical addresses) required us to copy page-cache data into separate memory\
    \ when writing it to disk, but that inefficiency is eliminated in 2.4.\n\nThird,\
    \ at long last, we have support for large (>2GB) files, by virtue of defining\
    \ all the offsets into our caches in units of file system blocks rather than by\
    \ byte offsets.\n\n# The Common Data Structure Objects  \nInstantiated by the\
    \ Kernel\n\n+   struct super_block—Represents an entire file system mounted at\
    \ a  \n+   certain mount point in the directory tree.\n\n+   struct inode—Represents\
    \ a single object (file, directory, etc.) within  \n+   that file system.\n\n\
    +   struct file—Represents a particular opening of a file. A new struct  \n+ \
    \  file is created every time you open a file, so you can have many  \n+   struct\
    \ files attached to a single inode. A closed file won’t have any  \n+   struct\
    \ files, although inodes representing it may still exist in the  \n+   kernel’s\
    \ object cache.\n\n+   struct dentry—Represents the result of a directory lookup,\
    \ that is,  \n+   looking up a certain name in a certain directory.\n\n+   struct\
    \ address_space—The primary data cache in Linux is the page  \n+   cache, and\
    \ all pages are indexed in the page cache by offsets within  \n+   an address_space.\
    \ Every file inode has its own address space  \n+   assigned within the page cache\
    \ to identify cached data as belonging to  \n+   that inode.\n\n+   struct page—The\
    \ main page descriptor for the virtual memory sys-\n+   item; struct pages are\
    \ used extensively by cache and I/O manage-\n+   ment functions.\n\n+   struct\
    \ buffer_head—Describes a buffer in the buffer cache. The  \n+   buffer cache\
    \ is used to cache certain metadata on a file system, which  \n+   doesn’t correspond\
    \ to a real file. Buffers represent cached contents of  \n+   a physical disk,\
    \ not cached contents of files (files are virtual objects).  \n+   For example,\
    \ the buffer cache is used when we cache bitmaps or inode  \n+   tables under\
    \ most disk file systems. It is never used for network file  \n+   systems—only\
    \ when there is a disk involved."
  merge: -1
  img_proc: true
- pgno: 260
  md: '■ struct request—Describes an outstanding I/O request to a disk.


    # # Buffers, Caches, and Memory Garbage Collection


    Buffers represent not the cached contents of files, but rather cached contents
    of a physical disk. In contrast, caches actually cache file contents. Linux''s
    exploitation of buffers and caches is heavily dependent on VM functionality and
    performance, which is discussed in Chapter 5, "The Linux VM Manager."


    How does the kernel allocate buffers from the main memory, and how does it manages
    caches? As far as each file system is concerned, caching and buffer allocation
    are both very simple. The file system asks for a new page for the page cache or
    a new buffer the buffer cache, and the cache just takes a page off the kernel''s
    free page list to satisfy that request. Of course, at some point we will run out
    of memory if that''s all we do. So, there is an entirely separate mechanism, which
    makes sure that we don''t run low on free pages.


    That mechanism comprises a twofold reclamation regimen. First, if a kernel process
    requests a free page and the request isn''t urgent (e.g. we''re not in the middle
    of trying to find space for an incoming network packet), then the call to the
    memory allocator in turn calls the memory-reclaim functions to find something
    to evict from memory.


    Second, even if there are no memory allocation calls happening, a background daemon—kswapd—regularly
    checks the free memory situation and starts reclaiming memory if we get too low.


    In either case, the reclamation process is the same. The kernel cycles through
    various data structures, including the page tables that processes use to map files
    into virtual memory, and the page and buffer caches. It looks for pages that have
    not been accessed since the last time we passed over that page, and when it finds
    them, it removes those pages from use and returns them to the free list.


    # # Linux''s Use of Inodes


    During startup, the kernel initializes the table, which holds general information
    about the accessibility of files, by calling a routine (in the kernel''s memory
    allocator code) that creates a cache for kernel objects.'
