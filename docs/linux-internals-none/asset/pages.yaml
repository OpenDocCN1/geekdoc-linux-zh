  md: '# Types of DMA Mapping


    There are two types of DMA mapping, *consistent* and *streaming*.


    Consistent DMA mappings are usually mapped at driver initialization and unmapped
    at the end of driver initialization. The hardware should guarantee that the device
    and the CPU can access the data in parallel and will see updates made by each
    other without any explicit software flushing.


    Good applications of consistent mappings are:


    +   - Network card DMA ring descriptors.

    +   - SCSI adapter mailbox command data structures.

    +   - Device firmware microcode executed out of main memory.


    The invariant these examples all require is that any CPU store-to-memory is immediately
    visible to the device, and vice versa. Consistent mappings guarantee this.


    Streaming DMA mappings, which are usually mapped for one DMA transfer, are unmapped
    right after it (unless you use `pci_dma_sync`, as below). Hardware can optimize
    streaming mapping for sequential accesses.


    Good applications of streaming mappings are:


    +   - Networking buffers transmitted or received by a device.

    +   - Filesystem buffers written or read by a SCSI device.


    The interfaces for streaming mapping were designed in such a way that an implementation
    can make whatever performance optimizations the hardware allows. To this end,
    when using such mappings you must be explicit about what you want to happen.


    # Using Consistent DMA Mappings


    To allocate and map a consistent DMA region, you should enter:


    ```

    dma_addr_t dma_handle;

    cpu_addr = pci_alloc_consistent(dev, size, &dma_handle);

    ```


    where *dev* is a *struct pci_dev \**. You should pass *NULL* for PCI-like buses
    where devices don’t have *struct pci_dev* (like ISA and EISA). This'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'argument is needed because the DMA translations may be bus specific (and often
    may be private to the bus to which the device is attached).


    The size parameter is the length of the region the driver needs to allocate.


    This routine allocates RAM for that region, so it acts similarly to `_get_free_pages`,
    but takes size instead of a page order. It returns two values: the virtual address,
    which you can use to access it from the CPU, and the `dma_handle`, which you pass
    to the card.


    The CPU return address and the DMA bus master address are both guaranteed to be
    aligned to the smallest `PAGE_SIZE` order that is greater than or equal to the
    requested size. This invariant exists (for example) to guarantee that if you allocate
    a chunk that is smaller than or equal to 64 kilobytes, the extent of the buffer
    you receive will not cross a 64K boundary.


    To unmap and free such a DMA region, the driver calls:


    ```

    ```

    pci_free_consistent(dev, size, cpu_addr, dma_handle);

    ```

    ```


    where `dev, size` are the same as in the above call and `cpu_addr` and `dma_handle`
    are the values `pci_alloc_consistent` returned to you.


    # ## DMA Direction


    The interfaces described below take a DMA direction argument, which is an integer
    that takes on one of the following values:


    +   *   `PCI_DMA_BIDIRECTIONAL`

    +   *   `PCI_DMA_TODEVICE`

    +   *   `PCI_DMA_FROMDEVICE`

    +   *   `PCI_DMA_NONE`


    Provide the exact DMA direction if you know it.


    The value `PCI_DMA_TODEVICE` means “from main memory to the PCI device”; `PCI_DMA_FROMDEVICE`
    means “from the PCI device to main memory.” Device driver developers are strongly
    encouraged to specify this as precisely as possible.


    If you absolutely cannot know the direction of the DMA transfer, specify `PCI_DMA_BIDIRECTIONAL`.
    This means that the DMA can go in either direction. The platform guarantees that
    you may legally specify this and that it will work, but this may be at the cost
    of performance.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The value `PCI_DMA_NONE` is used for debugging. It is possible to hold this
    in a data structure before you come to know the precise direction of the DMA transfer.
    This helps catch cases where direction tracking logic has failed to set things
    up properly.


    Another advantage to specifying this value precisely (outside of potential platform-specific
    optimizations) is for debugging. Some platforms actually have a write permission
    Boolean flag, with which DMA mappings can be marked, much like page protections
    in a user program. Such platforms can and do report errors in the kernel logs
    when the PCI controller hardware detects violation of the permission setting.


    Only streaming mappings specify a direction; consistent mappings implicitly have
    a direction attribute setting of `PCI_DMA_BIDIRECTIONAL`.


    The SCSI subsystem provides mechanisms for you to easily obtain the direction
    to use, in the SCSI command:


    ```

    ```c

    scsi_to_pci_dma_dir(SCSI_DIRECTION)

    ```

    ```


    where `SCSI_DIRECTION` is obtained from the `sc_data_direction` member of the
    SCSI command on which your driver is working. The interface mentioned above returns
    a value suitable for passing to the streaming DMA mapping interfaces below.


    For networking drivers, it''s a rather simple affair. For transmit packets, map
    and unmap them with the `PCI_DMA_TODEVICE` direction specifier. For receive packets,
    just the opposite: map and unmap them with the `PCI_DMA_FROMDEVICE` direction
    specifier.


    # # Using Streaming DMA Mappings


    The streaming DMA mapping routines can be called from an interrupt context. There
    are two versions of each map/unmap, one of which will map or unmap a single memory
    region, the other of which will map or unmap a scatterlist.


    To map a single region, enter:


    ```

    ```c

    dma_addr_t dma_handle;

    dma_handle = pci_map_single(dev, addr, size, direction);

    ```

    ```


    To unmap it, enter:


    ```

    ```c

    pci_unmap_single(dev, dma_handle, size, direction);

    ```

    ```'
