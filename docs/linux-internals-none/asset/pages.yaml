- pgno: 289
  md: '# Configuration Concept


    The configuration information for the physical volume, volume group, and logical
    volume(s) is stored on each physical volume and in auto-

    matically created backup files, which are stored in the /etc/lvmtab.d

    directory.


    The config area on the disk(s) is called *volume group descriptor area*

    or VGDA.


    An LVM driver holds mapping tables between the LEs of LVs and the

    PEs of PVs. These tables are created/updated/deleted by super-user

    LVM commands.


    The main mapping function of the driver is called with a logical block

    in an LV from functions in `usr/src/linux/drivers/block/ll_rw_blk.c`

    (in functions `ll_rw_block()` and `ll_rw_swap_file()`) and looks up the

    corresponding physical block/disk pair in a table. Then it returns this

    pair to the calling `ll_rw.* ()` function, causing a physical I/O request to

    the disk block(s) to be queued.


    # Example


    If the capacity of an LV gets too small and your VG containing this LV is

    full, you could add another PV to that VG and simply extend the LV after-

    wards. If you reduce or delete an LV you can use the freed capacity for dif-

    ferent LVs of the same VG. This scenario is represented in Figure 10.4.


    ![](img/a248b1088891f07ca198e09ddb71aec7_289_0.png)


    In the illustration let `PV 1` be `/dev/sdc1`; `PV n` be `/dev/sde1`; `VG 1` be

    `vg00`; and `LV 1` be `/dev/test_vg/test_lv`.


    The configuration steps for getting the above scenario are:


    +   1. After installing LVM do an `insmod lvm` or set up `kernelld/kmod` to

    +   load it automatically (see INSTALL).


    +   2. Set up partitions (#1) on both disks with partition type `0x8e` (I used

    +   this type to avoid using Linux primary partitions.)'
