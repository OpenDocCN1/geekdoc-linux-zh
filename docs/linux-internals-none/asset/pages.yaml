    \n# The TLB in Linux\n\nTo speed up the process of address translation, the kernel\
    \ uses the TLB. There is actually not much for the kernel to do to manage the\
    \ TLB; the CPU does it all by itself. The only intervention required of the kernel\
    \ happens when the scheduler is switching to another user's address space for\
    \ execution and the TLB has to be reloaded with the cache entries for the new\
    \ address space. To do this, all the kernel needs to do is load a value into the\
    \ TLB, which forces the CPU to think it is invalidated and flush it. Through the\
    \ normal address translation work, the CPU repopulates the TLB with new entries.\n\
    \nThis flushing is done by calling the `__flush_tlb` assembler macro. All it does\
    \ is save the CR3 value to the temporary variable `tmpreg` and then copy `tmpreg`\
    \ back into CR3. That's enough to invalidate the TLB. The code for this is in\
    \ `include/asm-i386/pgtable.h`.\n\n```\n```\n#define __flush_tlb()           \
    \      \\\n    do {                               \\\n        unsigned int tmpreg;\
    \           \\\n                                       \\\n        __asm__ __volatile__(\
    \          \\\n            \"movl %%cr3, %0;          # flush TLB \\n\"\n```"
