    \ places.\n\nThe actual Linux timer code resides in `run_timer_list()`.\n\nLinux\
    \ timers are highly scalable. On busy Internet servers, more than a 100,000 timers\
    \ can run at once. The Linux timer implementation is a very clever trick, written\
    \ by Arne Gangstad, which has also been copied by proprietary OS vendors. The\
    \ trick consists in keeping *exponential* timeout values, instead of *absolute*\
