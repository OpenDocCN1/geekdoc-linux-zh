  md: '+   ▪ Time of last modification of the file

    +   ▪ The addresses of the file’s blocks on the disk (pointers to the extents
    that contain the file’s data)


    In an ext2fs file system, an inode occupies 128 bytes.$^1$ There are eight inodes
    in a standard ext2fs block of 1,024 bytes. The inode structure is padded. In reality
    it could be smaller than 100 bytes, but things are easier if file system structures
    align nicely with block boundaries. The number of inodes on a file system is decided
    when `mkfs` is run. There is one 128-byte inode allocated for each 4,096 bytes
    of disk space in a standard ext2fs file system, resulting in one block of inodes
    for each 32 blocks of data. This is an initial overhead of 3.12 percent.


    Disk space for the inodes is allocated when `mkfs` is run. In standard ext2fs,
    a bitmap and an inode allocation map are allocated for each block group. These
    allocation maps cannot span block boundaries in ext2fs.


    Linux keeps a cache of active and recently used inodes. There are two paths by
    which these inodes can be accessed. The first is through the `dcache`. Each entry
    in the `dcache` refers to an inode, and thereby keeps that inode in the cache.
    The second path is through the inode `hash table`. Each inode is hashed to an
    8-bit number based on the address of the file system’s super-block and the inode
    number. Inodes with the same hash value are chained together in a doubly linked
    list.


    Access through the hash table is achieved using the `iget` function, which is
    only called by a file system when looking up an inode which wasn’t found in the
    cache, and by `nfsd`. Basing the hash on the inode number is a bit restrictive,
    because it assumes that every file system can uniquely identify a file in 32 bits.
    This is a problem at least of the NFS file system, which prefers to use the 256-bit
    file handle as the unique identifier in the hash. The `nfsd` usage might be better
    served by having the file system provide a file handle-to-inode mapping function
    that interprets the file handle in the most appropriate manner.


    # Performance Issues and Optimization Strategies


    File system performance is a major component of overall system performance and
