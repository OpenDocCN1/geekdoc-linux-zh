- pgno: 99
  md: "# Processes\n\nThe most central concept in any operating system is the user\
    \ process: an abstraction of a running program.<sup>1</sup>\n\nAs we saw earlier,\
    \ Linux is a multitasking operating system and is therefore able to run several\
    \ such user processes at once, even on a uniprocessor system. Every operating\
    \ system with this capability needs a system to keep track of the various processes.\
    \ The system makes sure that the processes get all the resources they need on\
    \ time, but on a fair basis and without jeopardizing overall system stability.\
    \ It also needs to do this efficiently, to reduce the impact of this managing\
    \ activity to the lowest level possible. That model and its uses are the subject\
    \ of this chapter.\n\nThe fundamental data structure within the kernel, controlling\
    \ all processes, is the *process structure*, which grows and shrinks dynamically\
    \ as processes are forked and finish or are killed. The process structure (called\
    \ `task_struct` in the kernel source code) is around 1k in size. On a system with\
    \ 1,300 processes, the `task_struct` table takes about 1,300 KB of real memory.\
    \ You can get the exact size of the structure with the following simple C program:\n\
    \n```\n```\n#define __KERNEL__\n#include <linux/sched.h>\nmain()\n{\n printf(\"\
    sizeof(struct task_struct) -> %d\\n\", sizeof(struct task_struct));\n}\n```\n\
    ```\n\nOn IA32 (i386) machines the process structure is exactly 960 bytes in size.\
    \ The data structure of `task_struct` is reported at the end of this chapter for\
    \ reference. Unlike other UNIX implementations, however,"
  merge: -1
  img_proc: true
- pgno: 100
  md: "please note that this process structure does not occupy space in the real sense\
    \ of the world. How is this possible?\n\nSince the advent of Linux kernel 2.2.x,\
    \ the task_struct is allocated at the bottom of the kernel stack. It is therefore\
    \ possible to overlap the task_struct on the kernel stack because the kernel_struct\
    \ is a per-task structure exactly as the task_struct is.\n\nThe kernel stack has\
    \ a fixed size of 8,192 bytes (on the IA32). If the kernel recurses on the stack\
    \ for only 8192 - 960 = 7232 bytes, then the task_struct is overwritten and corrupted\
    \ (and the kernel will crash soon).\n\nBasically, what the kernel does is decrease\
    \ the size of the “usable” kernel stack to around 7,232 bytes, by allocating the\
    \ task structure in the bottom of the stack. It has to do this because 7Kbytes\
    \ are more than enough for the kernel stack, the rest can be used for the task_struct.\n\
    \nThere are a few advantages in doing so. The kernel reaches the kernel structure\
    \ without any memory accesses, thus reducing the memory usage and avoiding an\
    \ additional dynamic allocation at task creation time. The task_struct always\
    \ starts on a PAGE_SIZE boundary, so the cache line is always aligned on most\
    \ hardware on the market. Aligning on page boundaries (in Linux usually sized\
    \ at 4KB) is important to avoid unnecessary page faults and a reduction in overall\
    \ performance.\n\nAt any given moment, once Linux is in kernel mode, you can get\
    \ the address of the task_struct with this very fast pseudo-code:\n\n```\ntask_struct\
    \ = (struct task_struct *) STACK_POINTER & 0xffffe000;\n```\n\nThis is exactly\
    \ how the above pseudo-code is implemented in C under Linux, in linux/include/asm\
    \ -1386/current.h:\n\n```\nstatic inline struct task_struct * get_current(void)\n\
    {\n    struct task_struct *current;\n    _asm__(\"andl $esp,0; \":\"=r\" (current)\
    \ : \"0\" (~8190UL));\n    return current;\n}\n```\n\nFor example, on a PentiumII,\
    \ recalculating the task_struct from scratch starting from the stack pointer is\
    \ much faster than passing the task_struct address through the stack across function\
    \ calls, as is done in some other operating systems like Solaris 7. In other words,\
