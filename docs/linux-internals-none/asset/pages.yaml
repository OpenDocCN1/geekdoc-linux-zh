- pgno: 373
  md: '# ## An Insider''s Guide to the

    Linux Kernel


    ![](img/a248b1088891f07ca198e09ddb71aec7_373_0.png)


    Important coverage includes:


    +   • Differences Between OpenSource and Proprietary Design

    +   • Linux Design Principles

    +   • Resource Contention and SMP

    +   • Linux Driver Models

    +   • Loadable Modules and Architecture

    +   • Performance Issues

    +   • Tuning Linux Installations


    Today, millions use Linux as their operating system of choice. And although all
    Linux distributions include sourcecode, few people understand the inner workings
    of kernel programming. As more companies begin to rely on Linux for solutions,
    administrators and programmers need to optimize system performance to keep critical
    business functions running smoothly. Linux Internals is a comprehensive insider’s
    guide to kernel programming and OS theory. Written by recognized Linux expert,
    Moshe Bar, Linux Internals covers in detail core concepts of the Linux kernel,
    including the latest version 2.4. Including revealing commentary and enhancement
    suggestions, this book will give readers a thorough knowledge of Linux design
    principles and the process model.


    Includes in-depth coverage of:


    +   ▶ Factors affecting performance, with measurements and explanations

    +   ▶ Sample kernel enhancements

    +   ▶ Variations between different Linux versions

    +   ▶ Crisis-avoiding strategies for busy servers


    And the CD-ROM contains the latest in kernel enhancements, which can be incorporated
    into the server kernel. For experienced Linux users and busy professionals wanting
    to plan and implement powerful Linux-based solutions, this is the most insightful
    and important guide available.


    # ### ABOUT THE AUTHOR


    Moshe Bar is the Linux columnist for Byte.com and one of the creators of Khaos,
    an upcoming secure version of Linux. He is also a regular contributor for Linux
    Journal and contributes to Dr. Dobb’s Journal. Moshe is a system administrator
    and OS researcher, who started learning UNIX on a PDP-11 with AT&T UNIX Release
    6 back in 1981.


    ![](img/a248b1088891f07ca198e09ddb71aec7_373_1.png)


    # **ON THE VALUE-PAKCED CD-ROM:**


    +   • The latest Linux kernels including 2.3.61 and 2.3.99-pre4 file updates

    +   • Kernel core updates

    +   • Numerous network driver updates


    ![](img/a248b1088891f07ca198e09ddb71aec7_373_2.png)


    ![](img/a248b1088891f07ca198e09ddb71aec7_373_3.png)


    ![](img/a248b1088891f07ca198e09ddb71aec7_373_4.png)'
