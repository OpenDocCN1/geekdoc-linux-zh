- pgno: 245
  md: '# ## The User-Space System-Call Code Library


    The user-space call code library can be found in /usr/src/libc/syscall. The hardcoding
    of the parameter layout and actual system-call numbers is not a problem, because
    system calls are never really changed; they are only “introduced” and “obsoleted.”
    An “obsoleted” system call is marked with the old_ prefix in entry.S’s system
    call table. Reference to it is removed from the next glibc, and once no application
    uses the system call anymore, its slot is marked unused and is potentially reusable
    for a newly introduced system call.


    # ## Tracing System Calls


    If a user wishes to trace a program, it is equally important to know what happens
    during system calls, so the trace of a program usually includes a trace through
    the system calls as well. This is done through SIGSTOP and SIGCHLD ping-ponging
    between parent (tracing process) and child (traced process). When a traced process
    is executed, then every system call is preceded by a sys_trace() call.


    This makes the traced process send a SIGCHLD to the tracing process every time
    a system call is made. At once, the traced process enters TASK_STOPPED (a flag
    is set in the task_struct structure of the task) state. The tracing process then
    examines the entire address space of the traced process, through the use of _ptrace,
    which is a multi-purpose system call; the tracing process then sends a SIGSTOP
    to allow execution to begin again.


    # ## How to Add Your Own System Calls


    Adding your own system calls is actually quite easy if you use following simple
    steps. Remember that if you do not make these system calls available on other
    machines where your program may run, the result is nonportable code.


    +   1. Create a directory under the /usr/src/linux/ directory to hold your code.

    +   2. Put any include files in /usr/include/sys/ and /usr/include/linux/.'
