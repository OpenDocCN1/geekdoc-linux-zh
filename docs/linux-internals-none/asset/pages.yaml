  md: '```

    LOAD r0,r0

    CMP r0,#0

    BNE Loop

    ```


    where BNE means Branch Not Equal. Out-of-order execution here, as we saw before,
    is not possible, because the destination of the branch is dependent on a previous
    result.


    Modern CPUs however, can predict branches. A smart compiler knows how to order
    assembler code to facilitate the branch prediction of the CPU. It is also up to
    the C programmer to give hints to the compiler, to allow it to generate assembler
    code that takes branch prediction into consideration.


    # ## Software Issues


    In a system with just one CPU, keeping track of that CPU is quite easy. Because
    Linux is a Symmetric Multi-Processor (SMP)-capable operating system, the kernel
    also needs to keep track of all CPUs present and schedule work among them. Even
    the simplest form of an SMP computer, one with two CPUs, gives many new possibilities
    and difficulties. For one, making two CPUs work with the same kernel image and
    the same (shared) hardware is a rather complex task. A kernel that might be suitable
    for a one-CPU system will fail miserably when executed by two or more CPUs concurrently.


    To make Linux SMP-aware, the user must recompile the kernel with the SMP option
    set to yes. For a step-by-step tutorial on recompiling and installing a new Linux
    kernel, refer to Chapter 2.


    On a uniprocessor kernel, all SMP-related code is empty and does nothing. Therefore,
    a uniprocessor kernel and an SMP kernel are quite different in Linux. Unlike proprietary
    operating systems, like WinNT or Solaris, the uniprocessor version of the Linux
    kernel is much lighter than the SMP version, because it is not slowed down by
    unnecessary SMP code. Under SMP conditions, there are certain operations within
    the kernel that must be serialized. In other words, certain kernel transactions
    on certain data structures need to be executed by just one CPU at a time to avoid
    chaos.


    Let''s take an example of a data structure that indicates if an interrupt has
    been serviced yet, irq_serv ed. If irq_serv ed is greater than zero, then the
    kernel knows there is work to do. Now, let''s assume that while CPU 0 checks for
    the value, finds 1, and wants to begin execution,'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'CPU 1 has also found a value of 1 and also starts execution. Because CPU 0
    was briefly interrupted, CPU 1 has time to finish serving the interrupt. Now,
    when CPU 0 comes back to handle the interrupt it will find nothing to do (because
    CPU 1 already handled it), and will fail with an error. This might seem like an
    innocuous example, but there are hundreds of more dangerous code parts that will
    wreak havoc with your system if not properly serialized. In the parlance of kernels,
    these serialization mechanisms are called *spinlocks* or *mutexes*.


    # ## Spinlocks (Mutexes)


    With version 2.0, the Linux kernel became, for the first time, SMP- aware and
    scaled, if not excellently, at least well up to a limited number (at best maybe
    4) of CPUs. Version 2.4 and the forthcoming version 2.5, scale even better on
    systems with many CPUs.

    The graph below (Figure 3.1) illustrates how kernels can only scale up to a certain
    limit before adversely impacting performance.


    ![](img/a248b1088891f07ca198e09ddb71aec7_47_0.png)


    ![](img/a248b1088891f07ca198e09ddb71aec7_47_1.png)


    The Linux kernel developer''s main concern is how to make Linux work well on large,
    multiprocessor servers.

    Serialization is the main constraint in an OS on multiprocessor hardware. Systems
    implementing an SMP architecture have a single physical address space and kernel
    virtual address space. A single image of the operating system is shared by all
    the processors installed on the system. The symmetry is due to the peer-to-peer
    relationship between the'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'processors; there is no master processor that executes all kernel code and
    handles interrupts. All the processors can process interrupts, execute kernel
    functions, and so on, as seen in Figure 3.2.


    ![](img/a248b1088891f07ca198e09ddb71aec7_48_0.png)


    To understand spinlocks (we will also use the term “mutex,” which stands for “mutual
    exclusion;” the terms are interchangeable) better, it may help to use another
    example. Let’s assume the kernel needs to add a new process to its list of processes.
    The kernel must traverse the list of all processes, obtain the last process ID
    number (the PPID), and insert a new entry in the list. If, at the very moment
    the kernel is adding an entry, but just before it finishes doing so, a second
    processor executes the very same code section of the kernel, trying to add yet
    another process, the second processor gets the same new process ID number, and
    the list of processes might end up corrupted. Therefore, the whole section that
    inserts a new process has to be “mutexed.” The kernel does this by setting a variable
    to −1 just before it enters the critical code section; after finishing it adds
    +1 to the variable to indicate end of a spinlock/mutex. The data structure, with
    its definitions, is appended at the end of this section:


    ```

    linux/smp_lock.h

    linux/smp.h

    ```


    If another processor wants to execute the same code section, it will test the
    variable before entering; this second processor will see that the variable is
    now set to −1; as long as the variable stays negative, the sec-'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'ond processor will have to wait before it can enter the critical code section.
    Once the first processor exits the region it adds 1 to the variable. Now the value
    is 0 and the second processor can enter the region and immediately set the variable
    to −1 again, so that other processors are prevented from executing that region.


    There are two flavors of spinlocks, *adaptive* and *spin*. When a kernel code
    segment attempts to acquire a mutex lock, and the lock is being held, the thread
    can do one of two things: *spin* or *block*. Spinning on a spinlock means simply
    executing a tight loop, with lock acquisition attempted in each pass through the
    loop. Blocking means putting the thread to sleep.


    There are pros and cons to both approaches. Spinning has the advantage of not
    requiring a context switch in the processor, such that, once the lock is acquired,
    execution continues. Saving a context switch is important for performance. Upon
    context switching, the task that was executing might not find its cache lines
    still in the primary or secondary caches, and would thus cause an access to the
    much slower RAM modules through the bus. The downside is that a processor is consumed
    during the spin.


    Blocking frees up the processor, because the blocked task is put into a sleep
    state and the processor switches context to another task, thus freeing it up for
    other work. Blocking does, however, require the overhead of context-switching
    the thread back in once the lock is available, and the general overhead of dealing
    with a wakeup mechanism.


    Adaptive spinlocks deal with these choices in a dynamic fashion. If a spinlock
    is currently owned by another task when a kernel task attempts to acquire the
    lock, the state of the task is checked. If the task holding the lock is running,
    the kernel task trying to get the lock will spin, assuming that the running task
    will release the lock shortly. If the holder of the lock (its owner task) is sleeping,
    then the task wanting the lock will also block (sleep), because it doesn''t make
    sense to consume a processor spinning and waiting for the holder to wake up and
    release the lock. Most mutex locks in the Linux kernel are adaptive. Spinlocks
    are used only for locks where context switching is not allowed, such as in the
    top-half interrupts of the highest priority, like timers. In the event of a kernel
    task''s blocking on a mutex lock or a *reader/writer lock* (reader/writer locks
    are not adaptive—a held write lock always results in a sleep), sleep queues with
    expirations are used (see the text on interrupts handling later in this chapter)
    and these synchronize the wakeup when the lock is available.'
  merge: -1
  img_proc: true
