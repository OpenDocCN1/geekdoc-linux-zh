- pgno: 39
  md: 'This chapter is essential before proceeding further because it deals with the
    common functionality of the Linux kernel. This common functionality includes CPU
    management, device handling, interrupts handling, clock and time handling, and
    boot and shutdown issues. The reader is well advised to refer back to the concepts
    detailed in this chapter whenever he or she encounters them again in later chapters.
    (Throughout this chapter, whenever source is referenced it alludes to the 2.3.99
    (2.4) source, unless otherwise specified. Sometimes, a preview of the 2.5 series
    is given.)


    The sections on interrupts handling and clock handling are certainly the most
    technically challenging. It helps to have a good C reference book on hand when
    reading through these sections.


    As discussed in Chapter 2, the operating system’s main job is to provide a set
    of extended instructions. These extended instructions are called system calls.
    In the Microsoft Windows® world they are called Application Programming Interfaces
    or APIs. In many ways what we perceive of an operating system is really just its
    set of system calls. You can, for instance, run a program that was written for
    MS Windows95 under Linux, as long as you can provide the MS Windows’ system calls
    (or APIs). (And provided it runs on the same CPU architecture, obviously.) This
    is exactly what the Open Source WINE¹ project does; it allows applications such
    as Microsoft Word97 to run under Linux natively.


    # What’s an OS Anyway?


    According to Andrew Tanenbaum, the function of an operating system is primarily
    to provide its users with a convenient interface (this refers not only to the
    graphical user interface, but also to the Application Programming Interface) to
    the real hardware. In this respect, an operating system is an extension of the
    hardware. It presents the user with the equivalent of an extended machine or virtual
    machine that is easier to program than the underlying hardware.


    Operating systems are therefore interfaces between applications and the machine.
    This is why all physical processes (access to external or internal peripherals,
    memory, and other hardware resources) are transferred to the operating system.
    The virtualization of the physical layer, and its diversity, frees the developer
    from the complexity of managing all the existing peripherals.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'The OS also avoids exposing to the user the limitations of a particular machine.
    If the system is available on several machine architectures, the user interface
    and programs will be the same and won''t need to be adapted to the new architecture.


    # # Resource Management


    Modern computers contain a multitude of components, such as processors, memory,
    clocks, timers, disks, network interfaces, and many others. It is the job of the
    operating system to provide for an orderly and controlled allocation of the processors,
    memory, and I/O devices among the various programs competing for them.


    Because in a modern OS many programs and users can access or share the computer''s
    resources at the same time, some means of protection from competing demands is
    needed. User A should not be able to modify User B''s data without User B''s prior
    consent. Likewise, a misbehaving program should not be able to overwrite the memory
    reserved to the operating system itself, because this would invariably lead to
    a system crash; this is exactly what happens when users see the dreaded "blue
    screen of death" on Microsoft Windows operating systems. Finally, a modern OS
    should also be able to keep an account of the use of the computer''s resources
    and provide statistics or the raw data for the charging of the resources to its
    various users.


    # # CPU Management


    Before we enter kernel details and Linux-specific implementation, it is important
    to see how CPUs actually work. This will help later in the book to understand
    why the Linux kernel insists on doing things in an unorthodox way for the sake
    of performance.


    RISC-style CPUs, such as the MIPS$^{2}$ series or the PA-RISC$^{3}$, execute a
    data processing instruction (e.g. add, subtract, multiply, etc.) and send the
    result to the CPU registers. RISC-style CPUs typically use one or two instructions
    to handle what CISC processors do in five, six, or more instructions. Obviously,
    there is no magic involved. The CISC CPU needs to store temporary results somewhere,
    usually in internal registers not visible to the assembler programmer. Sometimes,
    CISC CPUs also use immediate constants instead of registers, which are com-'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'only used for a fixed value (e.g. “1”) in instructions such as $r0=1$ or MOV
    r0, #1.


    Suppose we have the following two instructions:


    ```

    MOV r0, #0;

    ADD r1, r2, r3;

    ```


    The first one is typically executed first, but because the second instruction
    has no data dependencies on the first instruction (i.e. it does not use the $r0$
    register), from a logical point of view, the CPU could just as well execute both
    at the same time. This is *instruction-level parallelism* or *ILP*.


    Now, suppose the program instead had the following instructions:


    ```

    MOV r0, #0;

    ADD r1, r0, r2;

    ```


    In this case, the second instruction could only execute after the first had completed,
    because it depends on the first instruction’s moving 0 to register $r0$. These
    two operations cannot be executed in parallel, because of the data dependency
    on $r0$. Needless to say, the compiler generating this assembler code should be
    shot dead, because it could just as well have directly added the constant 0 in
    the second instruction, thereby allowing the CPU to run both in parallel.


    # Memory Load Latency


    Load latency is the delay in CPU cycles (on today’s CPUs one cycle is typically
    around 1.5 nanoseconds; 1 nanosecond = 1 one-billionth of a second) between executing
    the load operation (to fetch data from memory) and being able to perform an operation
    on the data just loaded. The concept of load latency pertains to access to the
    RAM modules. Access to the CPU-internal memory (the registers) has no load latency.


    +   2 The MIPS CPU is produced by MIPS Inc., a subsidiary of Silicon Graphics,
    Inc. (SGI). MIPS CPUs are generally 64-bit and very fast, while still featuring
    modest requirements for electricity and space. Next to the SGI workstations and
    servers, many embedded systems run MIPS processors. There has been a Linux port
    available for MIPS for quite some time now.

    +   3 The PA-RISC is manufactured by Hewlett-Packard and is mainly used for their
    workstations and servers. A Linux port to this processor is available from the
    Puffin Group, a group of hackers financed by HP.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'A latency of 0 implies the possibility of combining another operation in the
    same cycle, such as a load and add in one cycle. A load latency of 1 implies that
    an operation on the data obtained can only start in the next cycle, and so on.


    Minimum load latency is when the data is in the Level 1 cache, which for Intel
    Pentium CPUs is on the processor die. A bad case of load latency happens when
    the system has to fetch data from the RAM banks. On modern systems this is generally
    takes in the neighborhood of 120 cycles, and worsens as CPUs get faster and RAM
    makes little progress in speed.


    From the point of view of the CPU, the worst case of all happens when a *page
    fault* occurs and the OS has to page-in a page of virtual memory from the hard
    drive. For somebody used to seeing the world in terms of nanoseconds, waiting
    50 or more milliseconds for a page to be brought in from disk and correctly processed
    by the OS is an eternity.


    Obviously, the greater the latency the more the ILP is reduced, because a parallelized
    instruction might not execute before the CPU resets after a fetch from memory.


    Most floating-point-heavy programs tend to store data in an array structure and
    thus tend to have a rather high potential for ILP, which is probably why floating-point
    (FP) performance has increased faster than integer performance, although another
    reason is that CPU designers have been able to allocate more transistors on the
    die to FP operations.


    To store data about the status of the system''s virtual memory, tasks, and many
    other things, the Linux kernel makes heavy use of *linked lists*; (sometimes also
    called an *array*). A linked list or array is an arrangement of data within a
    contiguous group of cells of all the same size. The location of any element in
    the array is simply:


    "index0_location + index_number * cell_size"


    For a linked list, each cell is separate, and contains a pointer to the location
    of the next cell in memory (or 0 if it''s the last cell in the list) and the actual
    data. Not only does this take up much more memory, but it is much slower to jump
    to a random position, because you have to go through every single previous cell
    in the list, which causes a lot of CPU stalls to reset after a fetch from the
    RAM banks. There are some advantages to linked lists, though, and we''re stuck
    with them.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Code to search for the end of a linked list


    | Label | Assembler instruction | Comments |

    |---|---|---|

    | Loop | LOAD r0,r0 | Load the pointer to the next cell (Often written like "LOAD
    r0,[r0]" though) |

    | | CMP r0,#0 | Compare the pointer to 0 |

    | | | Do a "branch" back to the "Loop" label if the last compare was Not Equal
    |

    | | BNE Loop | branch = jump = goto = set the Program Counter (PC) register. The
    PC register points to the next instruction to load and execute. |


    The above three instructions make up the core of a code loop that searches for
    the end of a linked list. The only register being used is *r0*, so you would think
    that parallelism is impossible. But the CPU can actually start executing the second
    iteration of the loop at the same time as the compare instruction. The load writes
    *r0* at the end of the cycle, so it doesn’t affect the compare, and the branch
    doesn’t use *r0*. You could do this by specially compiling the loop (a bit like
    “loop unrolling”), or by using out-of-order execution, if available. This is illustrated
    below.


    Possible ILP for linked-list loop


    | CPU cycle | Iteration 1 | Iteration 2 | Iteration 3 |

    |---|---|---|---|

    | 1 | LOAD r0,r0 |  |  |

    | 2 | CMP r0,#0 | LOAD r0,r0 |  |

    | 3 | BNE Loop | CMP r0,#0 | LOAD r0,r0 |

    | 4 |  | BNE Loop | CMP r0,#0 |

    | 5 |  |  | BNE Loop |


    Here, the row for each “CPU cycle” is executed during that cycle. On a 600MHz
    CPU, this cycle lasts a mere 1.667 nanoseconds. The CPU is actually executing
    three instructions per cycle. However, the above example assumes a load latency
    of 1. The Intel Pentium, Pentium II, and Pentium III processors have a load latency
    of 3 for the primary cache. Here is how the instruction flow would look in that
    case:'
