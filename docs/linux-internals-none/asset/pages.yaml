- pgno: 12
  md: '# # Preface


    In the last two years, first with version 2.0, then 2.2. and soon 2.4, Linux has
    undergone amazing progress to what now constitutes probably one of the most advanced
    operating systems for servers and workstations alike.


    Especially with the upcoming 2.4 series, much effort have been put by us developers
    into making the kernel highly scalable and able to efficiently handle and manage
    huge quantities of memories, many concurrent CPUs, and a vast array of modern
    peripherals.


    If somebody until a few years ago could go read the kernel source code and understand
    the main concepts by herself, it has become very hard indeed today. Not only has
    the size of the source code grown significantly, but as the core developers themselves
    learned new techniques and technologies, the algorithms and source code have become
    increasingly complex and hard-to-understand.


    Moshe Bar’s work in bringing the intricacies of the Linux kernel 2.3.xx and 2.4
    closer to the enthusiast, the system administrator, and system programmer is important
    to bridge the gap between kernel developers and users.


    During the making of this book, I was in close contact with Moshe and had to face
    and answer dozens of questions. He never accepted an answer as such until he fully
    understood the algorithm or functionality.


    As a core kernel developer, I have found this book to be a good introduction as
    well as a référence work to be used to look up the Linux kernel concepts.


    Moshe Bar has over the years written a great deal of articles, papers, and treatises
    on OS principles and his involvement with prior OS projects, such as MVS, VM,
    and bsd shows in his thorough approach and clear technical language.


    Ingo Molnar'
  merge: -1
  img_proc: true
