  md: 'Nowadays, this code is contained in the glibc2.1 library. 0x80 is hardcoded
    both into Linux and glibc, to be the system call number that transfers control
    to the kernel. At bootup the kernel has set up the interrupt descriptor table
    (IDT) vector 0x80 to be a call gate—see arch/i386/kernel/traps.c:trap_init():


    ```

    set_system_gate (SYSCALL_VECTOR,&system_call)

