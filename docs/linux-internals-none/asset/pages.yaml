  md: 'The kernel does not actually create the first object, which is a file control
    structure, until a file is opened.


    The distinct kernel objects, which are stored in said cache, are called inodes.
    An inode is a distinct object, within the kernel, which is managed by a file system,
    a network redirector, or some other storage management system. Linux implements
    inodes in plain C, but the design is very abstract and very object oriented. An
    inode can itself represent another object, like a file or a directory. There is
    an inode for each file; a file is uniquely identified by the file system on which
    it resides and its inode number on the file system.


    Every inode contains pointers to various methods, which can operate on itself
    or on the object it represents. These methods can read or write data, seek to
    a specific offset in the file, do directory operations such as creating new files
    or renaming existing ones, and so on. Not all operations or methods will be valid
    on all inodes. For example, you can''t rename on a regular file, because in UNIX
    a rename is an operation on the parent directory, not on the file itself. As another
    example, you can''t seek on a pipe.


    Each inode contains a count of the number of data blocks that it contains. The
    number of actual data blocks is the sum of the allocated data blocks and the indirect
    blocks. fsck computes the actual number of data blocks and compares that block
    count against the actual number of blocks the inode claims. If an inode contains
    an incorrect count, fsck prompts the operator to fix it.


    Each inode contains a 64-bit size field. The size is the number of data bytes
    in the file associated with the inode. The accuracy of the size field is roughly
    checked by computing from the size field the maximum number of blocks that should
    be associated with the inode, and comparing that expected block count against
    the actual number of blocks the inode claims.


    Each inode contains the following information:


    +   - The device where the node resides

    +   - Mode of file

    +   - Type of file

    +   - Locking information

    +   - File length (the number of bytes in the file)

    +   - Link count (the number of links to the file)

    +   - The owner’s user and group IDs

    +   - Access privileges

    +   - Time of last access to the file

    +   - Time the inode itself was last modified'
