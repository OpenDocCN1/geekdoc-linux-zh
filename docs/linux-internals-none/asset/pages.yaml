- pgno: 14
  md: '# # Introduction


    Linux Internals was written to enhance the general understanding of the inner
    workings of Linux. Most of these “internals” happen to be in a kernel inside the
    Linux operating system kernel. This book is, however, not a full source code commentary
    in the common sense of the term. Certainly a lot of the code is commented, but
    the emphasis is rather on the functionality of the code, rather than on the code
    itself.


    The Linux kernel contains the code that controls a system’s resources, user processes,
    data I/O, and extended functions, such as the Linux kernel-space web server kHTTPd.


    # ## The Linux Kernel


    A *kernel* is operating system software that runs in protected mode and has access
    to the hardware’s privileged registers. Some operating systems employ a *microkernel
    architecture*, where device drivers and other code are loaded and executed on
    demand, and do not necessarily reside always in memory.


    The kernel is not a separate process running on the system. It is the guts of
    the operating system, which controls the scheduling of processes to achieve multitasking
    and provides a set of routines, constantly in memory, to which every user-space
    process has access.


    By contrast, a *monolithic architecture*, in which all device drivers are part
    of the kernel proper, is more common among UNIX implementations, and is the design
    employed by classics such as BSD. The Linux kernel, too is a mostly monolithic
    kernel—all device drivers are part of the kernel proper—but unlike BSD, a Linux
    kernel’s device drivers also can be *loadable*, that is, they can be loaded and
    unloaded from memory through user commands.


    This book primarily references the 2.4.x series of kernels for the Intel x86 architecture
    (at the time of this writing, still called 2.3.51). All code samples used throughout
    this book are based on the 2.3.49 kernel, although sometimes, a preview on the
    2.5 kernel series is used.


    # ## Who Should Read This Book


    Linux Internals is targeted at system and network administrators, developers,
    and capacity planning managers. It will also appeal to Linux enthusiasts who have
    a good general understanding of hardware and software.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'In the chapters that follow, system administrators will learn how to adapt
    a kernel to specific needs and hardware environments. In addition, by tuning the
    kernel in the appropriate places, system throughput can be increased considerably.
    The File Systems section of this book discusses choosing, installing, and correctly
    configuring a file system. Linux developers will learn which programming techniques
    yield the best performance for their programs and debugging will be easier after
    reading this book because external factors to the user programs will be better
    understood.


    Finally, Linux enthusiasts in general, will learn to appreciate their favorite
    kernel even more after discovering its hidden gems of technical design.


    # What You Should Know Before Reading This Book


    No previous kernel knowledge is necessary, but it helps to have a good understanding
    of the general concepts of hardware and software. It addition, it helps if you
    have a working knowledge of the Linux interface and a rudimentary understanding
    of what’s involved in basic system administration.


    It also helps to be able to read C programs, although most of the code provided
    is explained. For a good introduction to C, I always strongly advise *The C Programming
    Language*, by Kernighan/Ritchie, the designers of C.


    # What This Book Contains


    This book begins with an introduction to OS theory and kernel concepts in general
    and relative to UNIX in detail.


    The next chapters are dedicated to the five pillars of every kernel:


    +   - Processes

    +   - Inter-process communication

    +   - Signals (interrupts) handling

    +   - Virtual memory

    +   - File systems


    Each chapter is structured the same way; it first gives a detailed explanation
    of the inner workings of the kernel pertinent to the subject. Then, a'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'few coding examples are provided to show how to change the functionality of
    the kernel. Finally, the relevant kernel data structures (the C include files)
    are listed for easy reference. Together with the algorithms listed in the main
    body of the chapter, the reader has a complete aggregation of code and data, as
    well as the necessary explanations. There is no attempt to present an exhaustive
    commentary on the Linux kernel source code, rather we focus on the most important
    subjects and on performance-relevant issues of the kernel. Appendices are included
    at the end of the book for system calls, the GPL license, and other useful information.


    You can read straight through the chapters to learn more about the Linux kernel,
    or you might choose to go straight to a chapter of interest and use this book
    as a reference. Whenever a code snippet is shown in the text, the corresponding
    data structures can be found at the end of the chapter.


    # Where to Find More Information


    The most up-to-date information on Linux kernels can be found on the Internet.
    It is, however, essentially raw data. Gathering this information, assembling it,
    and putting it into a coherent format is not a trivial task. This is the biggest
    value of Linux Internals—it provides a coherent, researched, and formatted source
    of information that is otherwise available to the public through scattered web
    sites, source code, and articles.


    One good source of information on the kernel is, of course, the kernel source
    code itself. There is a site with an excellent source code navigator for all available
    architectures and Linux versions at http://lxr.linux.no/source/.


    At http://www.linuxhq.com you can find information on all kernel versions, and
    particularly, on the version currently under development. For a full list of GNU
    tools, visit www.gnu.org.


    Finally, keeping up with the kernel developer mailing list is informative, although
    the sheer volume of this mailing list and the poor signal-to-noise ratio make
    it difficult at times to extract any useful information.


    # Suggestions, Comments


    Any suggestions or comments are very welcome and can be addressed either to moshe_bar@hotmail.com
    or to Moshe Bar, c/o McGraw-Hill, Professional Book Group, Two Penn Plaza, New
    York, NY 10121.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# ## Acknowledgments


    First of all, it is my duty to thank God for giving me all I needed to write this
    book.


    This book could not have been done without the help of some star developers of
    the Linux Kernel Hacking fraternity. People like Ingo Molnar, Andrea Arcangeli,
    Stephen Tweedie, Hans Reiser, and Steve Best contributed greatly to this book.


    Joe Pranevich''s article "The Wonderful World of 2.4 Kernels" gave me important
    ideas on how to generally describe the advances made in the 2.4 kernel. Thank
    you, Joe.


    Matthew Dillon, of FreeBSD fame, wrote an important paper describing general virtual
