- pgno: 268
  md: 'mechanism seeking to all of the random block locations that were allocated
    during the extension of the file. Random block allocation can be avoided by optimizing
    the block allocation policy so that it attempts to allocate a contiguous (sequential)
    series of blocks. If large sequential allocations can be achieved by using a smarter
    block allocation policy, disk seeking will be greatly reduced. However, contiguous
    file system block allocation will eventually end up with file blocks fragmented
    across the file system, and file system access will eventually revert to a random
    nature.


    Also, the block allocation scheme must write information about where each new
    block is allocated every time the file is extended. If the file is extended one
    block at a time, a lot of extra disk I/O required to write the file system block
    control structure information. (File system block control structure information
    is known as *metadata*.)


    In the ext2 file system, metadata is written asynchronously to the storage device,
    so that operations that change the size of a file do not need to wait for each
    metadata operation to complete. This greatly improves speed of updates to files,
    but increases the risk of inconsistent data if a system crash occurs after changing
    the file’s contents, but before the metadata was actually written.


    # The Transaction-Processing or Database Issue of Safety


    For managing synchronized access to the same file from multiple processes or threads,
    file locking interfaces are provided (discussed in my forthcoming book on Linux
    file systems to be published by McGraw-Hill). Linux, or any UNIX-type OS, does
    not provide kernel-level support for the notion of file records. In this section,
    we shall look at the differences between *static, journaling*, and *logging* file
    systems.


    All database files must reside on a file system. The native file system of Linux,
    ext2fs, fared well for Linux three or four years ago. It is, however, not well
    poised to handle the challenges of the Linux market today. For one thing, ext2fs
    is *static*: it does not keep track of changes to make sure all updates on the
    disk are done safely. Furthermore, ext2fs is one of the few file systems on any
    OS to write metadata asynchronously. Although this considerably accelerates file
    operations, it also means that the information about the file, such as creation
    and change dates, ownership, permissions, etc., is written in a deferred fashion
    rela-'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'tive to the file contents. If power goes off after writing the updates to the
    file, but before actually writing the file header, we have a problem.


    These shortcomings of ext2fs are a major hindrance to a more wide-spread employment
    of Linux on database servers. Oracle8i for Linux, for instance, does not support
    raw I/O devices (although there has been raw I/O support since the 2.2.x kernel).
    For some time now, there has been a quest among Linux hackers to come up with
    a journaling and/or logging file system, to counter the deficiencies of ext2fs.


    # ## Advantages of Journaling over Nonjournaling


    The journaling file system (JFS) which will be considered here is a key technology
    for Internet file servers, because it provides fast file system restart times
    in the event of a system crash. Using database journaling techniques, JFS can
    restore a file system to a consistent state in a matter of seconds or minutes.
    In nonjournaling file systems, file recovery can take hours or days. Most file
    server customers cannot tolerate the downtime associated with nonjournaling file
    systems. Only by a technology shift to journaling could these file systems avoid
    the time-consuming process of examining all of a file system''s metadata to verify
    and restore the file system to a consistent state.


    In a static file system such as ext2fs, there is a map of inode locations. These
    inodes point to directory blocks, which contain lists of other inodes and each
    one''s associated filename, and to data blocks. A Linux directory, like any UNIX
    directory, is an association between the file leafnames and inode numbers. A file''s
    inode number can be found using the -i switch to ls.


    An inode contains ownership and permission information, along with a pointer to
    where on the disk the data blocks for a file reside. What happens when we change
    the contents of file test.file? Let''s assume that the inode for test.file lists
    four data blocks.


    The data for test.file reside at disk locations 3110, 3111, 3506, and 3507. The
    gaps are there because, during the initial allocation of disk blocks, those between
    3111 and 3506 were already allocated to some other file(s). We therefore notice
    that this file is fragmented. The hard drive must seek to the 3110 area on the
    disk surface, read two blocks, then seek over to the 3506 area and read two blocks
    to read the entire file.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Let’s say you modify the third block. The file system reads the third block,
    makes your changes, and rewrites the third block, still located at 3506. If you
    append to the file, you could have blocks allocated anywhere.


    There is danger if the power fails. Imagine being in the midst of updating a directory.
    You’ve just modified 23 file entries in the fifth block of some giant directory.
    Just as the disk is in the middle of writing this block, there is a power outage;
    the block is incomplete and therefore corrupted.


    During reboot, Linux (like all UNIX systems) runs a program called `fsck` (file
    system check) that steps through the entire file system, validating all entries
    and making sure that blocks are allocated and referenced correctly. It will find
    this corrupted directory entry and attempt to repair it. However, there is no
    certainty that `fsck` will actually manage to repair the damage. Quite often,
    it does not. Sometimes, in such a situation all the directory entries are lost.


    For large file systems, `fsck` can take a very long time. On a machine with many
    gigabytes of files, `fsck` can run for up to 10 or more hours. During this time,
    the system is not available, and this represents for some installations an unacceptable
    amount of downtime.


    Journaling or logging file systems solve the problem…but introduce new ones. Let’s
    see why and how.


    # # How a Journaling File System Works


    A journaling file system uses techniques originally developed for databases to
    log information about operations performed on the file system metadata as atomic
    transactions. In the event of a system failure, a file system is restored to a
    consistent state by replaying the log and applying log records for the appropriate
    transactions. The recovery time associated with this log-based approach is much
    faster, because the replay utility need only examine the log records produced
    by recent file system activity rather than examine all file system metadata.


    A journaling file system such as JFS provides improved structural consistency
    and recoverability, and much faster restart times (JFS can restore a file system
    to a consistent state in a matter of seconds or minutes), than nonjouranling file
    systems such as HPFS, ext2fs, and traditional UNIX file systems. These other file
    systems are subject to corruption in the event of system failure, because a logical
    write-file operation often takes multiple media I/Os to accomplish and may not
    be totally'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'reflected on the media at any given time. These file systems rely on restart-time
    utilities (which in Linux usually means fsck), which examine all of the file system’s
    metadata (such as directories and disk addressing structures) to detect and repair
    structural integrity problems. This is a time-consuming and error-prone process,
    which, in the worst case, can lose or misplace data.


    Journaling file systems keep track only of inode changes, but not changes to the
    contents of a file; whereas logging file systems keep track of changes made to
    both data and inodes. All changes, all appends, and all deletes would be logged
    to a growing part of the file system known as the log.


    In our first example with the test.file file, rather than modifying the data in
    the 3506 block, a logging file system would store a copy of the inodes of both
    test.file and the third block in new locations on the disk.


    The in-memory list of inodes would be changed to point test.file to the new inode
    as well. Every once in a while, the file system will check-point and update the
    on-disk list of inodes, as well as freeing the unused parts of files (e.g. the
    original third block of test.file).


    A logging file system has a dramatically improved write speed because it’s only
    appending to the same area of the disk and never really needs to seek around looking
    for blocks on the disk.


    The writing speed is therefore improved as is the recovery time (actually, there
    is no recovery time at all because of its structure).


    Logging file systems, when compared to static file systems, have nearly identical
    read speed because their file data blocks are still easily seekable. The inode
    map has the lists of blocks, and those can be read quickly because they are usually
    memory mapped. Thus, logging file systems represent the best of both worlds. The
    read time is comparable to that of the static file system—well, possibly a bit
    slower due to more fragmentation: The major problem with logging file systems
    is that they can get fragmented easily.


    # Metadata Logging


    When a file system makes changes to its on-disk structure, it uses several disconnected,
    synchronous writes to make those changes. If an outage occurs halfway through
    an operation, the state of the file system is unknown, and the whole file system
    must be checked for consistency.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'If one block, say, is appended to the end of a file, the on-disk map that tells
    the file system where each block for the file is located needs to be read, modified,
    and rewritten to the disk before the data block is written.


    When a failure occurs, the file system must be checked before it is mounted at
    boot; the file system manager doesn''t know if the block map is correct, and it
    also doesn''t know which file was being modified during the crash. This results
    in a full file system scan.


    A metadata logging file system has a wrap-around, append-only log area on the
    disk, which it uses to record the state of each disk transaction. Before any on-disk
    structures are changed, an intent-to-commit record is written to the log. The
    directory structure is then updated and the log entry is marked complete. Because
    every change to the file system structure is in the log, file system consistency
    can be checked by looking in the log without the need for a full file system scan.
    At mount time, if an intent-to-commit entry is found but not marked complete,
    then the file structure for that block is checked and, if necessary, fixed.


    Figure 10.2 shows a file''s data block (gray) and its inode information (modification
    times, pointers to data blocks, etc.) in a regular (static) file system, like
    ext2fs, and what happens when you change the data in that file.


    ![](img/a248b1088891f07ca198e09ddb71aec7_272_0.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Figure 10.3 shows a similar file in a logging file system, and what happens
    when it is being modified.


    ![](img/a248b1088891f07ca198e09ddb71aec7_273_0.png)


    Notice how everything that is changed is appended at the end of the log.


    This speeds up things, because the disk doesn''t need to seek all over the disk
    to write to parts of a file. Also it''s much safer, because the original data
    blocks of the file aren''t “lost” until the log has successfully written the “new”
    data blocks. This leads to very stable file systems with nearly no fsck time required
    after a crash. Such file systems come back online after a crash almost immediately,
    because only the file system updates after the last checkpoint must be checked.


    All the changes in the log can be reapplied quickly. The corrupted part of the
    disk is always the last change added to the log, and it can be thrown away as
    invalid. The only data lost will be the single change that was lost at power-off.
    Metadata logging file systems of 20GB and more typically take 4 or 5 seconds to
    fsck and repair after a crash. Thus, a metadata logging file system can make the
    difference between mounting a heavily populated file system in a few seconds or
    in 10 or more hours without a log.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'It should, however, be noted that logging doesn''t come free, and there is
    a significant performance overhead. Logging requires more slow synchronous writes,
    and the most popular implementation of logging, metadata logging, requires at
    least three writes per file update, which is significantly more than would be
    required without logging. As a result, we should pay attention to our requirements:
    do we want the file system to be fast, or do we need maximum reliability?


    Some logging file systems provide an option to put file data into the log together
    with the metadata, thus avoiding a second seek and write. The data is first written
    to the log, and then replayed into the file system. This achieves two things:
    it ensures data integrity up to but not including the last block written and it
    helps performance for small synchronous writes, as in email and news servers,
    which would otherwise require two or more writes to different parts of the disk
    for every application write (one for the data and one for the log write).


    # Available Journaling File Systems


    Journaling file systems have been around for quite some time. Solaris''s native
    file system, the UFS file system, has always had the same reliability problem
    (namely delayed metadata writes) as ext2fs. Veritas (see www.veritas.com) has
    been offering a journaling file system and logical volume manager (LVM) for Solaris
    for many years now; most Solaris shops use Veritas'' product, VxFS. On January
    19, 2000, Solaris announced the forthcoming porting of VxFS to Linux. No specific
    date was divulged, though.


    Sun has its own improved file system, available with its Solstice Disk Suite.


    SGI (formerly Silicon Graphics Inc.) as of this writing is committed to making
    its excellent xfs journaling file system available for Linux under Open Source.
    The xfs file system is rock solid and very fast. xfs also has several other benefits
    to offer the Linux community. xfs is a 64-bit file system, which means that it
    can support large files (9 million terabytes), and even larger file systems (18
