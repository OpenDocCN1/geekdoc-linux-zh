  md: '# Executable Image Page


    If the PTE is not marked as being in swap, the appropriate page from the executable
    image is brought into memory and the PTE is updated to reflect the newly allocated
    and filled physical page. However the page is brought into memory, a new PTE is
    created for that page and the TLB is updated to reflect the page table changes
    that have been made.


    # Addressing Beyond 4GB on an Intel x86


    Recently, kernel hacker Andrea Arcangeli proposed a way to address more than 4GB
    of RAM on the IA32 architecture. The design that allows IA32 to break the old
    memory limit in 2.3.x, (and in 2.2.x with an additional patch) works like this:


    +   1. Basically you have 4GB of physical RAM and 4GB of virtual RAM:


    ```

    | userspace virtual 0-3g | kernelvirtual 3-4g |

    ```


    +   2. To access physical memory, we must first set up proper virtual-to-physical
    mapping. The kernel maps the 3GB to 4GB range to the 0 to 1GB physical range:


    ```

    | kernel-physical 0-1GB | unused-physical-memory 1(??)-4GB |

    ```


    and the user space _virtual_ addresses (0 to 3GB area) maps with 4kbyte (PAGE_SIZE)
    granularity all over the physical memory that the kernel can address, all depending
    on user page tables setting. The limitation of the old 2.2.x design, which is
    removed with this new design, is that the kernel isn''t able to deal with memory
    that couldn''t be accessed via identity mapping, the 3 to 4GB virtual area (where
    the kernel runs) which points to the 0 to 1GB physical memory). In other words,
    the kernel was always doing:


    ```

    * (virtual_address) = 0;

    ```


    to write to the physical memory at address virtual_address - 3GB:'
