  md: "struct khttpd_threadinfo represents the four queues that 1 thread has to deal\
    \ with. It is padded to occupy 1 (Intel) cache-line, to avoid \"cacheline-pingpong\"\
    .\n\n```\n```\n/**\n * struct khttpd_threadinfo\n */\nstruct khttpd_threadinfo\n\
    {\n    struct http_request* WaitForHeaderQueue;\n    struct http_request* DataSendingQueue;\n\
    \    struct http_request* LoggingQueue;\n    struct http_request* User_spaceQueue;\n\
    \    char    dummy[16];  /* Padding for cache-lines */\n};\n```\n```\n\nkHTTPd\
    \ can be compiled as a loadable module, or it can be linked statically into the\
    \ kernel. Linking statically into the kernel provides better performance, because\
    \ it will be allocated in a more efficient and TLB-persistent page table mapping.\n\
    \n# # Controlling kHTTPd\n\nThe kHTTPd daemon is controlled via system controls\
    \ (syscls) in /proc/sys/net/khttpd. These are the system controls, with a description\
    \ for each (from documentation):\n\n| | | |\n| :--- | :--- | :--- |\n| serverport\
    \ | 8080 | The port khttpd listens to. |\n| clientport | 80 | The port of the\
    \ user space HTTP daemon. |\n| threads | 2 | The number of server threads. Should\
    \ be one per CPU for small web sites, two per CPU for big (the active files do\
    \ not fit in the RAM) web sites. |\n| documentroot | /var/www | The directory\
    \ holding document files. |\n| start | 0 | Set to 1 to start kHTTPd. (This also\
    \ resets \"stop\" to 0.) |\n| stop | 0 | Set to 1 to stop kHTTPd. (This also resets\
    \ \"start\" to 0.) |\n| unload | 0 | Set to 1 to prepare kHTTPd to be unloaded.\
    \ |\n| sloppymime | 0 | If set to 1, unknown MIME types are set to text/html.\
    \ If set to 0, files with unknown MIME types are handled by the user space daemon.\
    \ |\n| perm_required | S_IROTH | Minimum permissions required; for values see\
    \ man 2 stat. |\n| perm_forbid | dir+sticky+execute | Permission mask with forbidden\
    \ permissions. (For values see man 2 stat.) |"
