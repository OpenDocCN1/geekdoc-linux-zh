- pgno: 142
  md: '+   2. Shrink the dentry cache.

    +   3. Shrink the *inode* cache.

    +   4. Try to swap shared memory out.

    +   5. Try to free “dirty” pages.


    The VM manager tries not to have too many pages written to the swap file at the
    same time, so it uses `nr_async_pages` to keep count of the number of pages currently
    being written to the swap file. The `free_pages_low` and `free_pages_high` parameters
    are set at system startup time and are related to the number of physical pages
    in the system. If there are enough free pages, the *swap* daemon sleeps until
    its timer expires; otherwise the *swap* daemon tries three ways to reduce the
    number of physical pages used by the system:


    +   1. Reduce the size of the buffer and page caches.

    +   2. Swap out shared pages.

    +   3. Swap out or discarding pages.


    By default, the *swap* daemon tries to free up four pages each time it runs. The
    above methods are each tried in turn until enough pages have been freed. The *swap*
    daemon then sleeps again until its timer expires.


    # ## Swapping Pages Out


    The *swap* daemon looks at each process in the system in turn to see if it is
    a good candidate for swapping. Good candidates are processes that can be swapped
    (some cannot) and that have one or more pages that can be swapped or discarded
    from memory. Pages are swapped only if the data in them cannot be retrieved another
    way. A lot of the contents of an executable image come from the image’s file and
    can easily be reread from that file. For example, the executable instructions
    of an image will never be modified by the image and so will never be written to
    the swap file. These pages can simply be discarded; when they are again referenced
    by the process, they will be brought back into memory from the executable image.


    Once the process to swap has been located, the *swap* daemon looks through all
    of its virtual memory regions looking for areas that are not shared or locked.
    Linux does not swap out all the swappable pages of the process that it has selected;
    instead it removes only a small number of pages. Pages cannot be swapped or discarded
    if they:'
