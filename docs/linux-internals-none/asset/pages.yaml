- pgno: 83
  md: 'Then, obviously, the IRQ handler needs to check and adjust the clock for possible
    jitter. At regular intervals the i386 port flushes the system time to the hardware
    clock (also known as CMOS, real time clock [RTC]) inside the timer IRQ.


    The IRQ handler then proceeds to calculate the percentages spent busy, waiting,
    and running during the previous time-unit of execution (jiffy). Note that the
    per-CPU and per-process accounting only tells if each CPU or process passed the
    last timer tick in user/nice(?)/system/idle modes. You don''t know if the last
    tick has been passed in the network code, for example.


    Some time ago Andrea Arcangeli wrote code to provide information about how many
    of this the CPU and the current process spend in kernel SMP locks. This is quite
    interesting, because if you see that one CPU is spending all its time in kernel
    locks, it means that the code is not SMP-threaded enough for your purposes.


    The loadavg accounting also is done within the timer IRQ.


    Basically, we can repeat the timer IRQ path in these steps:


    +   Save current time stamp counter and current latch count in static variables
    for `gettimeofday`.


    +   Enter the common code for all architectures calling `do_timer()`.


    +   Because `do_timer()` increases `jiffies` and accounts the tick as `lost_ticks`,
    the next update on the system clock will read and reset `lost_ticks`. `lost_ticks`
    is a trick necessary not to race (a race is a situation of contention with other
    tasks accessing the same resource; usually this occurs in poorly designed code
    running on an SMP system) with `gettimeofday` and to be allowed to do the update
    of the system clock inside the bottom-half handlers.


    +   Mark the timer bottom-half queue, so that before returning from the timer
    IRQ we''ll run it (or some other CPU returning before us will be allowed to start
    it also on another CPU).


    +   Update the kernel profiling with the information about the interrupted code
    (only if it was kernel code, of course).


    +   If it''s UP we also update the per-CPU and per-process profiling variables
    (because there''s no IO-APIC SMP timer IRQ in UP).


    +   Check to see whether it''s time to flush the system clock to the RTC (we do
    this about each 11 minutes).


    +   Return.


    Now the IRQ code (before effectively running `iret` and so still in IRQ context)
    will try to execute bottom-half handlers and will notice that the'
