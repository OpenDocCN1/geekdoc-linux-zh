    \ are irrelevant.\n\nEach element of free_area contains information about blocks\
    \ of pages. The first element in the array describes single pages, the next, blocks\
    \ of two pages, and so on upwards in powers of two. The list element is used as\
    \ a queue head and has pointers to the page structures in the mem_map array. Free\
    \ blocks of pages are queued here. map is a pointer to a bitmap, which keeps track\
