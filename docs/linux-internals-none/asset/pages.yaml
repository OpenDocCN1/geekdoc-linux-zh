- pgno: 135
  md: 'Figure 5.1

    Relation between virtual memory, physical memory, and auxiliary swap space on
    disk.


    ![](img/a248b1088891f07ca198e09ddb71aec7_135_0.png)


    Swapped-out Page Swapped-in Page Unmapped Page


    Accessing a swapped-out page causes a page fault, which causes the page to be
    loaded into physical memory, replacing another page.


    Accessing an unmapped page causes a page fault, which results in a segmentation
    violation.


    # Page Replacement


    When a page fault occurs, the VM manager has to choose a page to remove from memory
    to make room for the page that has to be brought in. If the page to be removed
    has been modified while in memory, it must be rewritten to the disk to bring the
    disk copy up to date. If, however, the page has not been changed, no refresh is
    needed. The page to be read in overwrites the page being evicted.


    Replacing pages at random might actually be a practical implementation of a page
    replacement algorithm. However, it might be much more'
