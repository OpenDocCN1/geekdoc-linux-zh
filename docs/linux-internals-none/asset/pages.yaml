    The data structures in the kernel to support signals in Linux are to be found
    in the task structure we discussed in Chapter 4 on Linux Processes.


    Here are the most common elements of the task structure pertaining to signals:


    +   - current->sig are the signal handlers.


    +   - sigmask_lock is a per-thread spinlock,which protects the signal queue and
    atomicity of other signal operations.


    +   - current->signal and current->blocked are a (currently 64-bit long but freely
    expandable) bitmask of pending and permanently blocked signals.


    +   - sigqueue and sigqueue_tail are double-linked lists of pending signals. Linux
    has RT signals that can get queued as well. “Traditional” signals are internally
    mapped to RT signals.'
