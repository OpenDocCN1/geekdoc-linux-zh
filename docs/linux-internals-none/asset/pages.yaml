    # Page Deallocation


    Allocating blocks of pages tends to fragment memory, with larger blocks of free
    pages broken down into smaller ones. The page deallocation code recombines free
    pages into larger blocks whenever it can. The page block size is important; it
    allows for an easy combination of blocks into larger blocks. Whenever a block
    of pages is freed, the adjacent block of the same size is checked to see if it
    is free. If it is, then it is combined with the newly freed block of pages to
    form a new free block of pages for the next size block of pages. Each time two
    blocks of pages are recombined into a bigger block of free pages, the page deallocation
    code attempts to recombine that block into a yet larger one. In this way the blocks
    of free pages are as large as memory usage will allow.


    For example, in Figure 5.3, if PFN 1 were to be freed, then that would be combined
    with the already free PFN 0 and queued onto element 1 of the *free_area* as a
    free block of two pages in size.'
