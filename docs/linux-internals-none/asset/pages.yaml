  md: 'ber of free pages goes under the min watermark, then the task block halts and
    kswapd frees memory itself, if it can. After a wakeup, kswapd continues to run
    until the number of free pages returns over the high watermark. In other words,
    its job is to move from low to high.


    kswapd is therefore useful to free pages in the background, and to free pages
    for allocations (as is done inside bottom-half handlers or IRQ handlers that can''t
    free memory themselves because they can''t block).


    # Reducing the Size of the Page and Buffer Caches


    Each time the kernel swap daemon tries to shrink page and buffer caches, it examines
    a number of pages in the mem_map page vector to see if any can be discarded from
    physical memory. The number of pages examined is defined by the priority at which
    the code is called. The blocks of pages are examined in a cyclical manner; a different
    block of pages is examined each time an attempt is made to shrink the memory map.


    Each page being examined is checked to see if it is cached in either the page
    cache or the buffer cache. Shared pages are not considered for discarding at this
    time, and a page cannot be in both caches at the same time. If the page is not
    in either cache, then the next page in the mem_map page vector is examined.


    Pages are cached in the buffer cache (or rather the buffers within the pages are
    cached) to make buffer allocation and deallocation more efficient. The memory
    map that is shrinking code tries to free the buffers that are contained within
    the page being examined. If the all the buffers are freed, then the pages that
    contain them are also freed. Pages are queued in the page cache to speed up access
    to images and data on disk. If the examined page is in this cache, it is removed
    from the page cache and freed.


    When enough pages have been freed on this attempt, then the kernel swap daemon
    waits until the next time it is awakened. Because none of the freed pages were
    part of any process''s virtual memory (they were cached pages), no page tables
    need updating. If there were not enough cached pages discarded, then the swap
    daemon will try to swap out some shared pages.'
