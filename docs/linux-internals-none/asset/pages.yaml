    JFS logs are maintained in each aggregate and used to record information about
    operations on metadata. The log has a format that also is set by the file system
    creation utility. A single log may be used simultaneously by multiple mounted
    filesytes within the aggregate. Several aspects of log-based recovery are of interest.
    First, JFS only logs operations on metadata, so replaying the log only restores
    the consistency of structural relationships and resource allocation states within
    the file system. It does not log file data or recover this data to consistent
    state. Consequently, some file data may be lost or stale after recovery, and customers
    with a critical need for data consistency should use synchronous I/O.


    Logging is not particularly effective in the face of media errors. Specifically,
    an I/O error during the write-to-disk of the log or metadata means that a time-consuming
    and potentially intrusive full integrity check is required after a system crash
    to restore the file system to a consistent state. This implies that bad block
    relocation is a key feature of any storage manager or device residing below JFS.


    JFS logging semantics are such that, when a file system operation that involves
    changes to metadata (e.g., unlink()) returns a successful return code, the effects
    of the operation have been committed to the file system and will be seen even
    if the system crashes. For example, once a file has been successfully removed,
    it remains removed and will not reappear if the system crashes and is restarted.'
