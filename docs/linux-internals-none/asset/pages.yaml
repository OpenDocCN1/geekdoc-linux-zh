- pgno: 222
  md: "Linux guarantees that on the IA32 (Intel x86) architecture we can run any iBC86-compliant\
    \ binary code. Finally, speed is an issue, too.\n\nFinally we return into entry.S,\
    \ but current->signal is already cleared, so we do not execute do_signal, but\
    \ jump to restore_all:\n\n```\nrestore_all:\n    RESTORE_ALL\n\n#define RESTORE_ALL\
    \           \\\n    popl %ebx;                \\\n    popl %ecx;             \
    \   \\\n    popl %edx;                \\\n    popl %esi;                \\\n \
    \   popl %edi;                \\\n    popl %ebp;                \\\n    popl %eax;\
    \                \\\n1:   popl %ds;                \\\n2:   popl %es;        \
    \        \\\n    addl $4, %esp;            \\\n3:   iret;                    \\\
    \n```\n\nwhich executes the iret that brings us into user-space; suddenly we are\
    \ magically executing the signal handler.\n\nDid you get lost yet? No? Here is\
    \ some more magic: Once the signal handler finishes (it does an assembly ret like\
    \ all well-behaved functions), it executes the small jump function we have set\
    \ up on the user-stack. We again return into the kernel, but now we execute the\
    \ sys_sigsuspend system call, which lives in arch/i386/kernel/signal.c as well.\
    \ It essentially executes the following code section:\n\n```\nif (restore_sigcontext(regs,\
    \ &frame->sc, &eax))\n    goto badframe;\nreturn eax;\n```\n\nThe above code restores\
    \ the exact user-register contents into the kernel stack frame (including the\
    \ return address and flags register), and executes a normal ret_from_syscall,\
    \ which brings us back to the original faulting code. Hopefully the SIGBUS handler\
    \ has fixed the problem of why we were faulting.\n\nNow, while reading the above\
    \ description, you might think that all this is awfully complex and slow. Well,\
    \ it actually isn't, 1mbench reveals that Linux has the fastest signal handler\
    \ installation and execution performance by far of any UNIX-type system running:\n\
    \n```\nmoon:~/1> ./lat_sig install\nSignal handler installation: 1.688 microseconds\n\
    ```"
