- pgno: 136
  md: 'worthwhile to implement an algorithm that selects a page that is not heavily
    used. In the 2.4 kernels, Linux uses the least recently used (LRU) algorithm.
    As the name implies, this algorithm is on the lookout for pages not referenced
    in a long time, on the assumption that they will continue to be unreferenced for
    longer, probably even never again. LRU is not cheap, in terms of overhead. Linux
    has to maintain a linked list of all pages in memory, with the most recently used
    page at the front and the least recently used page at the end. The difficulty
    is that the list must be updated on every memory reference. Finding a page in
    the list, deleting it, and then moving it to the front is a very time-consuming
    operation.


    # The Linux 2.4 Implementation


    In this section we explore the Linux VM implementation and the algorithms and
    data structures involved. It is important to remember that this book is based
    on the IA32 (Intel x86) architecture. The VM of any operating system is one of
    the most platform-dependent areas in the kernel. The kernel of a multi-architecture
    OS like Linux, needs, nonetheless, to be able to support a generalized approach.


    # Address Translation


    For the translation of logical addresses to physical addresses and vice versa,
    the kernel makes use of the hardware facilities available within the CPU, called
    the Memory Management Unit (MMU).


    The MMU has been present in CPUs for almost 30 years, and was introduced in its
    present modern form on the General Electric 645 computer, designed to run the
    legendary Multics<sup>1</sup> project. Multics was the first modern OS to have
    a virtual memory concept with demand paging. (The Atlas computer had demand paging,
    back in 1962. IBM''s MFP (multiple fixed partitions) operating system<sup>2</sup>
    had swapping of whole partitions a few years earlier. It did not, however, feature
    demand paging. The developers of UNIX directly took over the VM paradigm from
    the Multics project and applied it to the DEC PDP architecture, which had an optional
    MMU in certain models.)


    > 1 More information about the ground-breaking Multics project can be found at
    www.best.com/~thvv/~thvv/~thvv/multics.html.


    > 2 *IBM Systems Journal* Vol 5, 1966, "The Functional Structure of OS/360."'
