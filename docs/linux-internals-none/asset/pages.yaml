- pgno: 179
  md: "Operating system components, such as demand paging and signals handling, either\
    \ work correctly or they don’t. The individual implementation is not that important.\
    \ The implementation choices for these components are transparent to the user-space\
    \ programs. They are simply services that accomplish a required function. Quite\
    \ the contrary, however, is true for another important component of an OS: the\
    \ scheduler. More than any other component, the scheduler influences the perceived\
    \ behavior of a system as a whole, especially on multiple-CPU systems.\n\nA scheduler\
    \ is responsible for the coordination of the running of processes to manage their\
    \ access to the system resources such that each candidate process gets a fair\
    \ share of the available process time, with the utilization of the CPU being maximized.\
    \ The scheduler (dispatcher) must ensure that a process gains access to the CPU\
    \ for a time relative to its designated priority and process class and that no\
    \ process is starved of access to the CPU, even if it is the lowest priority task\
    \ available.\n\nA process may choose to voluntarily give up its use of the microprocessor\
    \ when it must wait, usually for some system resource or for synchronization with\
    \ another process. Alternatively, the scheduler may preemptively remove the thread\
    \ or process from the CPU at the expiry of its allocated time quantum. The scheduler\
    \ chooses which is the most appropriate process to run next.\n\nScheduling is\
    \ an operation of the kernel, which defines the following process states:\n\n\
    +   Running. The process is the current system process and is on the CPU carrying\
    \ out its execution.\n+   \n+   Running: Ready to Run. The process is in a run\
    \ queue ready to use the CPU when available.\n+   \n+   Waiting: Interruptible.\
    \ The process is waiting for a resource or event, but signals are not blocked\
    \ and it may be interrupted.\n+   \n+   Waiting: Uninterruptible. The process\
    \ is waiting for a resource or event but has disable signals such that it cannot\
    \ be interrupted.\n+   \n+   Stopped: The process has been stopped, usually by\
    \ a SIGSTOP signal, such as when performing debugging.\n+   \n+   Zombie. The\
    \ process has completed and is ready to die; the scheduler has not yet detected\
    \ this so its task_struct structure is still present.\n\nThe scheduling of tasks\
    \ on different operating systems is similar, but each OS solves the problem in\
    \ its own way. In Linux 2.4, tasks have a priority, which ranges from a setting\
    \ of −20 to +20. The default priority of a task is 0, with −20 being the highest.\
    \ Only the administrator can"
  merge: -1
  img_proc: true
- pgno: 180
  md: 'reset a process’s priority to be less than 0, but normal users can adjust priorities
    in the positive range. This is done using the `renice` command, although internally
    Linux uses a time quantum counter (in jiffies) to record this in the `task_struct`.


    New processes inherit the priority of their parent. Real-time processes are supported.
    Any real-time process will have higher priority than all non-real-time processes.
    Threads that have already received some CPU time will have lower priority than
    others of the same priority which have not.


    The data consistency and race condition problems may be addressed by the implementation
    of *mutual exclusion* and *synchronization* rules between processes, whereas starvation
    is a function of the scheduler.


    There are a number of synchronisation primitives, as shown in Table 6.1.


    | **Events** | A thread may wait for events such as the setting of a flag, integer,
    signal, or presence of an object. Until that event occurs the thread will be blocked
    and will be removed from the run queue. |

    | **Critical Sections** | These are areas of code that can only be accessed by
    a single thread at any one time. |

    | **Mutual Exclusions** | Mutexes are objects that ensure that only a single thread
    has access to a protected variable or code at any one time. |

    | **Semaphores** | These are similar to mutual exclusions but may include counters
    allowing only a specified number of threads access to a protected variable or
    code at any one time. |

    | **Atomic operations** | This mechanism ensures that a nondecomposable transaction
    is completed by a thread before access to the same atomic operation is granted
    to another thread. The thread may have noninterruptible access to the CPU until
    the operation is completed. |


    *TABLE 6.1 Synchronisation Primitives*


    *Deadlock* is a permanent blocking of a set of processes that either compete for
    system resources or communicate with each other. Deadlock may be addressed by
    *mutual exclusion* or by *deadlock avoidance*. Mutual exclusion prevents two threads
    accessing the same resource simultaneously. Deadlock avoidance can include initiation
    denial or allocation denial, both of which serve to eliminate the state required
    for deadlock before it arises. Linux implements multiprocessor mutual exclusion
    mechanisms called *spin locks*, which effectively stall the processor until a
    lock is achieved for a critical section.


    The Linux scheduler has undergone considerable changes (for the better) since
    version 1.0. The algorithms for the scheduling of tasks have'
