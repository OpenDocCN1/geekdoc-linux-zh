    The vector layout is defined in include/asm-i386/hw_irq.h.


    Not until the int $0x80 is executed does the call transfer to the kernel entry
    point _system_call(). This entry point is the same for all system calls. It is
    responsible for saving all registers, checking to make sure a valid system call
    was invoked, and then ultimately transferring control to the actual system-call
    code via the offsets in the _sys_call_table. It is also responsible for calling
    _ret_from_sys_call() when the system call has been completed, but before returning
    to user space.


    Actual code for the system_call entry point can be found in /usr/src/linux/kernel/sys_call.S
    and the code for many of the system calls can be found in /usr/src/linux/kernel/sys.c.
    Code for the rest is distributed all over the source files. Some system calls,
    like fork(), have their own source file (e.g. kernel/fork.c) devoted to them.


    The next instruction the CPU executes after the int $0x80 is the pushl %eax in
    entry.S:system_call(). There, we first save all user-space registers, then we
    range-check %eax and call into sys_call_table[%eax], which is the actual system
    call.


    Because the Linux system call interface is exclusively register-param-etered and
    the stack is not used for parameter passing, at most six parameters can be used
    with a single system call. %eax is the syscall number; %ebx, %ecx, %edx, %esi,
    %edi, and %ebp are the six generic registers used as parameters 0 to 5; and %esp
    cannot be used because it’s overwritten by the kernel on ring0-entry.


