- pgno: 351
  md: 'The following is a consolidated list of the kernel parameters as defined in
    the file init/main.c and sorted into English Dictionary order (defined as ignoring
    all punctuation and sorting digits before letters in a case insensitive manner),
    and with descriptions where known.


    The text in square brackets at the beginning of the description state the restrictions
    on the kernel for the said kernel parameter to be valid. The restrictions referred
    to are that the relevant option is valid if:


    +   * **APIC**: APIC support is enabled.

    +   * **APM**: Advanced Power Management support is enabled.

    +   * **AX25**: Appropriate AX.25 support is enabled.

    +   * **CD**: Appropriate CD support is enabled.

    +   * **EIDE**: EIDE/ATAPI support is enabled.

    +   * **FB**: The frame buffer device is enabled.

    +   * **HW**: Appropriate hardware is enabled.

    +   * **ISDN**: Appropriate ISDN support is enabled.

    +   * **JOY**: Appropriate joystick support is enabled.

    +   * **LP**: Printer support is enabled.

    +   * **LOOP**: Loopback device support is enabled.

    +   * **MCA**: MCA bus support is enabled.

    +   * **MDA**: MDA console support is enabled.

    +   * **MOUSE**: Appropriate mouse support is enabled.

    +   * **NET**: Appropriate network support is enabled.

    +   * **NFS**: Appropriate NFS support is enabled.

    +   * **PARIDE**: The ParIDE subsystem is enabled.

    +   * **PCI**: PCI bus support is enabled.

    +   * **PCMCIA**: The PCMCIA subsystem is enabled.

    +   * **PNP**: Plug & Play support is enabled.

    +   * **PPT**: Parallel port support is enabled.

    +   * **PS2**: Appropriate PS/2 support is enabled.

    +   * **RAM**: RAM disk support is enabled.

    +   * **SCSI**: Appropriate SCSI support is enabled.'
  merge: -1
  img_proc: true
