- pgno: 146
  md: '# Swapping Out Shared Pages


    Physical pages that have been shared between processes are swapped out separately
    from ordinary pages. When the swap daemon attempts to swap out shared pages, it
    uses `shm_segs`, a vector of pointers to `shmid_ds` data structures, to look through
    the shared pages for good candidates for swapping. For each `shmid_ds`, there
    is a list of `vm_area_struct` structures, each of which describes how the virtual
    memory of a particular process is related to this shared memory area. Just like
    nonshared memory, the page table entries must be modified to show that the page
    is in the swap file. However, the page tables of all the sharing processes must
    be modified before the page is written to the swap file and freed. The page table
    entries for each process are found by following the `vm_mun` pointer in each `vm_area_struct`
    structure. Each `vm_mun` pointer points at the level 1 page table for the process.


    # Swapping Pages In (Demand Paging)


    Whatever architecture Linux is running on, its page fault handler is called. The
    relevant page table entry (PTE) is examined, and if it is an invalid entry, there
    are three possible ways of dealing with it: *page in swap, shared page in swap,
    and executable image page*.


    # Page in Swap


    If the PTE is marked as page in swap, then the page must be read from the swap
    file and the `swap_cache` and PTE updated.


    # Shared Page in Swap


    Shared pages in the swap file are handled separately from nonshared pages.


    A physical page is allocated and the page is read into it from the swap file using
    the swap file information in the PTE and the information held in the `swap_info_struct`
    tree for the swap file. Because the page is a shared page, the page tables for
    all the processes sharing that virtual memory must be updated to show that the
    page again exists in physical memory.'
  merge: -1
  img_proc: true
