  md: 'FIRST_EXTERNAL_VECTOR is indeed 32; the entry points below 32 are used for
    the CPU exceptions.


    As you will undoubtedly notice, the kernel avoids overwriting the vector 0x80
    that corresponds to the system call entry point (int 0x80), but allocates all
    the entry points so that it can also trap and report spurious interrupts.


    The exceptions (lower than 0x20) and system-call entry points are initialized
    in trap_init() in arch/i386/kernel/traps.c. Vectors never change at runtime. All
    is done at kernel boot time. During runtime, the priority of simultaneously seen
    interrupts and exceptions is as follows:


    +   * Highest

    +     - Faults except debug faults

    +     - Trap instructions INTO, INT n, INT 3

    +     - Debug traps for this instruction

    +     - Debug traps for next instruction

    +     - NMI interrupt

    +   * Lowest

    +     - INTR interrupt


    # The Linux System Call Interface


    The Linux system call interface is vectored through a stub in libc (often glibc),
    and is exclusively register-parametered—the stack is not used for parameter passing.
    Each call within the libc library is generally a syscallX() macro, where X is
    the number of parameters used by the actual routine. Under Linux, the execution
    of a system call is invoked by a maskable interrupt or exception class transfer
    (e.g. throwing an exception object), caused by the instruction int 0x80. We use
    vector 0x80 to transfer control to the kernel. This interrupt vector is initialized
    during system startup, along with other important vectors like the system clock
    vector. On the assembly level (in user space), it goes like this:


    ```

    ```

    ae531:   b8 15 00 00 00       movl    $0x15,%eax

    ae536:   53                   pushl   %ebx

    ae537:   89 c3                movl    %eax,%ebx

    ae539:   b8 75 00 00 00       movl    $0x75,%eax

    ae53e:   cd 80                int     $0x80

    ae540:   5b                   popl    %ebx

    ae541:   89 c6                movl    %eax,%esi

    ae543:   81 fe 00 f0 ff ff    cmpl    $0xfffff000,%esi

    ```

