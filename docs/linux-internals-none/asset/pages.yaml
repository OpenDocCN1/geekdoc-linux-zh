    \ must be executed). For tv2, tv3, and others, “expiry” means that all timers\
    \ in that timer list must be moved into a one-lower timer vector. This is done\
    \ by cascade_timers().\n\nWhat is the advantage of this approach? The advantage\
    \ is that add_timer(), del_timer(), and modify_timer() execute in constant time,\
    \ independent of the number of timers in the system. I have found that a large\
