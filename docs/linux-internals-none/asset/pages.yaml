- pgno: 69
  md: "Of course, determining the date and time based on some integer count is impossible\
    \ without a point of reference and knowledge of the count unit (seconds, milliseconds,\
    \ and so on). Most UNIX systems available today use January 1, 1970, 00:00:00\
    \ as an *epoch*, or point of reference for time counters. In other words, clock\
    \ counter values maintain the number of seconds since the epoch, and, with a reference\
    \ date and interval, the kernel can do the necessary arithmetic to convert a counter\
    \ value to the correct date and time. The reason for the year 2038 problem in\
    \ UNIX systems is due to this use of January 1, 1970 as a reference date. Using\
    \ a 32-bit data type, counting the number of seconds since the epoch causes the\
    \ kernel to overflow sometime around January 19, 2038. This problem goes away\
    \ on a 64-bit kernel, where there is a 64-bit data type to count the seconds since\
    \ the epoch—so we’re good for about 10 billion years or so.\n\nAll Intel MP-compliant\
    \ SMP boards have the so-called *IO-APIC*, which is actually an enhanced interrupt\
    \ controller. It enables us to route hardware interrupts to multiple CPUs, or\
    \ to CPU groups.\n\nLinux supports all variants of compliant SMP boards, including\
    \ those with multiple IO-APICs. (Multiple IO-APICs are used in high-end servers\
    \ to distribute IRQ load further).\n\nThere are (a few) known breakages in certain\
    \ older boards, whose bugs are usually worked around by the kernel. If your MP-compliant\
    \ SMP board does not boot Linux, then consult the linux-smp mailing list archives\
    \ first.\n\nIf your box boots fine with enabled IO-APIC IRQs, then your */proc/interrupts*\
    \ will look like this:\n\n```\n```\nroot @ hatta:-> cat /proc/interrupts\n\n \
    \           CPU0\n0: 1360293  IO-APIC-edge    timer\n1:         4  IO-APIC-edge\
    \    keyboard\n2:         0  XT-PIC     cascade\n13:        1  XT-PIC     fpu\n\
    14:      1448  IO-APIC-edge    ide0\n16:    28232  IO-APIC-level  Intel EtherExpress\
    \ Pro 10/100 Ethernet\n17:     51304  IO-APIC-level  eth0\nNMI:       0\nERR:\
    \       0\n```\n```\n\nThe clock and timer facilities are used by the kernel for\
    \ general housekeeping chores that must be done at regular intervals. The kernel\
    \ (software) sets up the computer clock (hardware) to generate a clock interrupt\
    \ at regular intervals. An interrupt handler is entered with every clock interrupt,\
    \ and this handler code does interval processing for"
  merge: -1
  img_proc: true
