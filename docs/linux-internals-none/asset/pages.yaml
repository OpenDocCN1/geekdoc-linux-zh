- pgno: 240
  md: 'through 255, inclusive, can be used for maskable interrupts or programmed exceptions.


    The `startup_32()` code found in `/usr/src/linux/boot/head.S` starts everything
    off at boot time by calling `setup_idt()`. This routine sets up an Interrupt Descriptor
    Table (IDT) with 256 entries, each 4 bytes long, with a total of 1,024 bytes and
    offsets 0 to 255. It should be noted that the IDT contains vectors to both interrupt
    handlers and exception handlers, and so IDT is somewhat of a misnomer, but that''s
    the way it is.


    No interrupt entry points are actually loaded by `startup_32()`, because that
    is done only after paging has been enabled and the kernel has been relocated to
    `0xC000000`. At times, mostly during boot, the kernel has to be loaded into certain
    addresses because the underlying BIOS architecture demands it.


    After control is passed to the kernel exclusively, the Linux kernel can put itself
    wherever it wants. Usually this is very high up in memory, but below the 2GB limit.


    When `start_kernel()` (found in `/usr/src/linux/init/main.c`) is called, it invokes
    `trap_init()` (found in `/usr/src/linux/kernel/traps.c`). `trap_init()` sets up
    the IDT via the macro `set_trap_gate()` (found in `/usr/include/asm/system.h`).
    `trap_init()` initializes the interrupt descriptor table as shown in Table 9.1.


    **TABLE 9.1 Interrupt Descriptor Table**


    | OFFSET | DESCRIPTION |

