  md: 'the executable image running when the process attempts to access them.


    Because the process''s PTEs have been changed, the CPU''s Translation Lookaside
    Buffers (TLBs), which contain cached, internal, CPU-readable copies of PTEs, must
    be updated. This update mechanism is architecture specific. If enough of the swappable
    process''s pages have been swapped out or discarded, the swap daemon will again
    sleep. The next time it wakes it will consider the next process in the system.
    In this way, the swap daemon nibbles away at each process''s physical pages until
    the system is again in balance. This is much fairer than swapping out whole processes.


    Linux is quite sophisticated in the swap-out stage because it keeps a *swap cache*.
    This is like the page cache for the file system. The swap cache, for example,
    avoids our having to write to disk two times if we are going to swap out for a
    second time a page that is still up to date upon swap. It also avoids our having
    to swap in from disk if we swapped out the page and we fault into it again soon
    after (it becomes a minor fault instead of a major fault). Another function of
    the swap cache is to avoid a task having to fork a child, which then does major
    faults (swap-ins) of the swapped-out pages in the parent VM. (Because 2.0.x does
    not have the swap cache, often you see constant swap-in each time Apache forks
    a child. I discovered the cause of this problem in mid-2.1.x; the problem was
    fixed properly in 2.2.x, which makes better use of the swap cache.)


    The swap-out goes through these steps:


    +   1. Search out, in round-robin fashion, across all the page tables of the task,
    an anonymous page with the PTE marked "old."

    +   2. Add such a page to the swap cache marked as "locked."

    +   3. Write such a page to disk in async mode (per-page locked bit gets released
    by the IO-completion interrupt).

    +   4. Set the PTE with the swap-entry information and mark the PTE as "page-not-present."


    There are three watermarks in 2.4:


    ```

    high = min*3

    low = min*2

    min

