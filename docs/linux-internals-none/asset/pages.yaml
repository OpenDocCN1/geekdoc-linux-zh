- pgno: 64
  md: "implementation resides in timer vectors (kernel/timer.c) and looks like this:\n\
    \n```\nstruct timer_vec {\n  int index;\n  struct timer_list *vec[TVN_SIZE];\n\
    };\n\nstruct timer_vec_root {\n  int index;\n  struct timer_list *vec[TVR_SIZE];\n\
    };\n\nstatic struct timer_vec tv5 = { 0 };\nstatic struct timer_vec tv4 = { 0\
    \ };\nstatic struct timer_vec tv3 = { 0 };\nstatic struct timer_vec tv2 = { 0\
    \ };\nstatic struct timer_vec_root tv1 = { 0 };\n```\n\nEach timer vector is an\
    \ array of timer ringlists. Timers are ordered by timeout value relative to the\
    \ present time. Short-term timers are placed into tv1, timers with big timeouts\
    \ are placed into tv2, tv3, and so on. The addressing of timer vectors is exponential:\
    \ the timeout value is divided into bitfields, and the highest order non-zero\
    \ bitfield shows which timer vector is used.\n\nNow comes the juicy part. On every\
    \ timer interrupt all timers have to be advanced, because their timeout value\
    \ is decreased by 1. We obviously do not want to do this for, say, 100,000 timers,\
    \ so the following trick is used. The timer vectors have a current pointer (index),\
    \ which is increased by 1 if the previous time vector overflows. This is, the\
    \ index of tv1 advances from 0 to 255; once it reaches 256 we advance tv2 by one,\
    \ and the index of tv1 is set to 0. If tv2 overflows to 64, then tv3 is advanced\
    \ by one and tv2 index is set to zero. If tv3 has overflowed to 64 then tv4 is\
    \ advanced, and so on. As you can see, the tv1 index increases on every timer\
    \ tick (jiffy), tv2 index increases every 256 ticks, the tv3 index increases every\
    \ 256×64 ticks, the tv4 index increases every 256×64×64 ticks, and so on. Short-term\
    \ timers are so common that tv1 was increased to hold 256 timerlist entries.\n\
    \nAdditionally, if the current index (which has just been increased) has an entry\
    \ that is non-zero, then the entry has to be “expired”:\n\n```\nstatic inline\
    \ void run_timer_list(void)\n{\n  spin_lock_irq(&timerlist_lock);\n  while ((long)(jiffies\
    \ - timer_jiffies) >= 0) {\n    struct timer_list *timer;\n```"
