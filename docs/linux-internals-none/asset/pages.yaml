  md: "You should call `pci_unmap_single` when the DMA activity is finished, for example,\
    \ when interrupt status tells you the DMA transfer is done.\n\nSimilarly, with\
    \ scatterlists, map a region gathered from several regions by entering:\n\n```\n\
    ```\nint i, count = pci_map_sg(dev, sglst, nents, direction);\nstruct scatterlist\
    \ *sg;\nfor (i = 0, sg = sglst; i < count; i++, sg++) {\n\thw_address[i] = sg_dma_address(sg);\n\
    \thw_len[i] = sg_dma_len(sg);\n}\n```\n```\n\nwhere `nents` is the number of entries\
    \ in the `sglist`.\n\nThe implementation is free to merge several consecutive\
    \ `sglist` entries into one, and returns the actual number of `sg` entries to\
    \ which it mapped them. For example, if DMA mapping is done with `PAGE_SIZE` granularity,\
    \ any consecutive `sglist` entries can be merged into one—provided the first one\
    \ ends and the second one starts on a page boundary. In fact this is a huge advantage\
    \ for cards which either cannot do scatter-gather, or have a very limited number\
    \ of scatter-gather entries.\n\nIn these cases, you should loop `count` times\
    \ (this can be less than `nents` times) and use `sg_dma_address()` and `sg_dma_length()`\
    \ macros where you previously accessed `sg->address` and `sg->length`, as shown\
