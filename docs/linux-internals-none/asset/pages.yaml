  md: "computer. In fact if you run `halt -f` you will still be able to run your machine\
    \ fine; however `init` will stop forking login sessions, because it received the\
    \ SIGSTP from the `halt` process.\n\nThe common code at halt time recalls a per-architecture\
    \ function called `machine_halt()`. On IA32 this function is a noop. On Alpha,\
    \ for example, it sends an IPI to all CPUs so that they all call the palcode HALT\
    \ function and the SRM can get control of them later.\n\nThe reboot works basically\
    \ the same way, but instead of `machine_halt`, another function (`machine_restart`)\
    \ gets recalled. On IA32, it reboots, sending a stop to all CPUs and disabling\
    \ I/O-APIC in SMP and then writing a special value to an I/O address. If that\
    \ isn’t enough, we load a bogus interrupt table into the Interrupt Table Descriptor\
    \ (ITD) of the CPU. Then we call an int3 (soft interrupt), which causes a triple\
    \ fault; the CPU reboots the machine.\n\nThere are also kernel parameter options\
    \ that force the kernel to reboot using BIOS functions instead of the above technique.\n\
    \n# ## Data Structures—linux/reboot.h\n\n```\n```\n 1 #ifdef LINUX REBOOT_H\n\
