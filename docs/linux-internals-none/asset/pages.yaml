- pgno: 342
  md: '# # C


    APPENDIX


    # # Logical Volume Manager Abstract'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Goals:

    -----

    Implement a very flexible virtual disk subsystem to handle disk storage.

    Online allocation and relocation of storage.

    Online extension and reduction of storage.


    Function:

    ---------

    The Logical Volume Manager (LVM) adds an additional layer between

    the physical peripherals and the i/o interface in the kernel to

    get a logical view of disks.


    This allows the concatenation of several disks (so-called physical volumes

    or PVs) to form a storage pool (so-called Volume Group or VG) with

    allocation units called physical extents (called PE).


    Parts out of this VG then can be allocated in form of

    so-called Logical Volumes or LVs in units called logical extents or LEs.

    Each logical extent is mapped to a corresponding physical extent

    of equal size. These physical extents are mapped to offsets and blocks

    on the disk(s).


    The LVs can then be used through device special files similar to

    /dev/sd[a-z]* or /dev/hd[a-z]* named /dev/VolumeGroupName/LogicalVolumeName.


    But going beyond this, you are able to extend or reduce VGs AND LVs at runtime.


    Concept:

    --------

    The configuration information for the physical volume, volume group and

    logical volume(s) is stored on each physical volume and in automatically

    created backup files, which are stored in the /etc/lvmtab.d directory.


    The config area on the disk(s) is called Volume Group Descriptor Area or VGDA.


    A LVM driver holds mapping tables between the LEs of LVs and the PEs of PVs.

    These tables are created/updated/deleted by super user LVM commands.


    The main mapping function of the driver is called with a logical block

    in a LV from functions in /usr/src/linux/drivers/block/ll_rw_blk.c

    (in functions ll_rw_block() and ll_rw_swap_file() ) and looks up the

    corresponding physical block/disk pair in a table.

    Then it returns this pair to the calling ll_rw_() function causing a

    physical i/o request to the disk block(s) to be queued.


    Example:

    --------

    If the capacity of a LV gets too small and your VG containing this LV is full,

    you could add another PV to that VG and simply extend the LV afterwards.'
  merge: -1
  img_proc: true
- pgno: 344
  md: "# ## Logical Volume Manager Abstract\n\nIf you reduce or delete a LV you can\
    \ use the freed capacity for different LVs of the same VG.\n\nThe above scenario\
    \ looks like this:\n\n```\n      /-----------------------------------\\\n    \
    \  /---------\\   VG 1      /---------\\\n      |         |           |      \
    \   |\n      |    PV 1 |   ......   |    PV n  |\n      |         |          \
    \ |         |\n      | /--------------------------   \n      | \\\\----LV 1----/\
    \         \n      |\\-------/          \\\\-------/\n      \\\n```\n\n```\nPV\
    \ 1 could be /dev/sdc1\nPV n.could be /dev/sde1\nVG 1 could be vg00\nLV 1 could\
    \ be /dev/test_vg/test_lv\n```\n\nConfiguration steps for getting the above scenario:\n\
    \n+   1. after installing LVM do an \"insmod lvm\" or\n+      set up kernel/d/kmod\
    \ to load it automatic (see INSTALL)\n+   2. set up partitions (#1) on both disks\
    \ with partition type 0x8e\n+      (I used this type to avoid using L1NIX primary\
    \ partitions etc.)\n+   3. do a \"pvcreate /dev/sd[ce]1\"\n+      For testing\
    \ purposes you can use more than one\n+      primary and/or extended partition\
    \ on a disk.\n+      Don't do that for normal LVM operation for performance reasons.\n\
    +      If you have to, don't stripe logical volumes over physical volumes\n+ \
    \     associated to partitions on the same disk.\n+   4. do a \"vgcreate test_vg\
    \ /dev/sd[ce]1\"\n+      (vgcreate activates the volume group too)\n+   5. do\
    \ a \"lvcreate -L100 -ntest_lv test_vg\" to get a 100MB linear LV\n+      or a\
    \ \"lvcreate -i2 -I4 -l100 -nanoher_test_lv test_vg\" to get a\n+      100 LE\
    \ large logical volume with 2 stripes and stripsize 4 KB.\n+   6. use created\
    \ LVs as you like to.\n+      For example generate a file system in one with \"\
    mke2fs /dev/test_vg/test_lv\"\n+      and mount it.\n\nOverview and concept of\
    \ commands:\n————————————————————————————\nI grouped and named LVM commands analog\
    \ to HP's.\nSo the commands for physical volume handling all start with pv,\n\
    those for volume group handling start with vg and the ones for"
  merge: -1
  img_proc: true
- pgno: 345
  md: "logical volumes start with lv.\n\n+   e2fsadm - administration wrapper for\
    \ logical volume including file system resizing for lvextend, lvreduce, e2fsck\
    \ and resize2fs\n+   \n+   lvchange - change attributes of a logical volume\n\
    +   \n+   lvcreate - create a logical volume\n+   \n+   lvdisplay - display logical\
    \ volume config data\n+   \n+   lvextend - extend a logical volume in size\n+\
    \   \n+   lvreduce - reduce a logical volume in size\n+   \n+   lvremove - remove\
    \ a logical volume\n+   \n+   lvrename - renames an inactive logical volume\n\
    +   \n+   lvscan - find all existing logical volumes\n+   \n+   lmchange - emergency\
    \ program to change attributes of the LVM\n+   \n+   lvm.diskscan - scan all disks\
    \ / partitions and multiple devices and list them\n+   \n+   lvm.sadc - statistic\
    \ data collector\n+   \n+   lvm.sar - statistic data reporter\n+   \n+   pvchange\
    \ - change attributes of physical volumes\n+   \n+   pvcreate - create a physical\
    \ volume\n+   \n+   pvdata - debug list physical volume group descriptor area\n\
    +   \n+   pvdlsplay - display physical volume config information\n+   \n+   pvmove\
    \ - move logical extents to a different physical volume\n+   \n+   pvscan - find\
    \ all existing physical volumes\n+   \n+   vgcfgbackup - backup all volume group\
    \ descriptor areas\n+   \n+   vgcfgrestore - restore volume group descriptor area(s)\
    \ to disk(s)\n+   \n+   vgchange - activate/deactivate volume group(s)\n+   \n\
    +   vgck - check volume group descriptor area for consistency\n+   \n+   vgcreate\
    \ - create a volume group from physical volume(s)\n+   \n+   vgdisplay - display\
    \ volume group config information\n+   \n+   vgexport - export volume group (make\
    \ it unknown to the system)\n+   \n+   vgextend - extend a volume group by one\
    \ or more physical volumes\n+   \n+   vgimport - import a volume group (make it\
    \ known to the/another system)\n+   \n+   vgmerge - merge two volume groups into\
    \ one\n+   \n+   vgmknodes - creates volume group directory with all logical volume\
    \ specials\n+   \n+   vgreduce - reduce a volume group by one or more empty physical\
    \ volume(s)\n+   \n+   vgremove - remove an empty volume group\n+   \n+   vgrename\
    \ - renames an inactive volume group\n+   \n+   vgscan - scan for volume groups\n\
    +   \n+   vgsplit - split one volume group into two\n\nExample LVM session output:\n\
    \n```\n```\n\n# create physical volumes on 9 SCSI disk primary partition 1\npvcreate\
    \ /dev/sd[b-eg-k]1\npvcreate -- /dev/sdl has an invalid physical volume identifier\n\
    pvcreate -- physical volume on /dev/sdlb1 successfully created\npvcreate -- reinitializing\
    \ physical volume\n```\n```"
  merge: -1
  img_proc: true
