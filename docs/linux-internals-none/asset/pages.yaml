- pgno: 181
  md: "steadily improved and are now smart enough to be able to predict (well, mostly)\
    \ the requirements of processes and act accordingly.\n\nIn this chapter we will\
    \ first review the relationships between the main building blocks of scheduling\
    \ units, tasks, threads, and processes. Then, we will explore a peculiarity of\
    \ the Linux scheduler, *scheduling heuristics*. The preemption strategies will\
    \ be discussed, as well as some more general aspects of scheduling as done in\
    \ Linux. Finally, we will close with two examples of how to improve the functionality\
    \ provided by the Linux scheduler.\n\n# # Scheduling Classes\n\nAs the scheduler\
    \ improves, user-space programs experience better throughput and overall shorter\
    \ latencies for vital kernel tasks. In Linux 2.2.x there are three classes of\
    \ processes, as can be seen from the data definition for the scheduler. You can\
    \ find them in `linux/include/linux/sched.h`:\n\n```\n/*\n * Scheduling policies\n\
    \ */\n#define SCHED_OTHER      0\n#define SCHED_FIFO       1\n#define SCHED_RR\
    \         2\n```\n\n+   - `SCHED_OTHER` tasks are the normal user tasks (default).\n\
    +   - Tasks running in `SCHED_FIFO` will never be preempted. They will leave the\
    \ CPU only for waiting sync kernel events or if an explicit sleep or reschedule\
    \ has been requested from user space.\n+   - Tasks running in `SCHED_RR` are real-time\
    \ too, but they will leave the CPU if there is another real-time task in the run\
    \ queue. The CPU power will be distributed among all `SCHED_RR` tasks.\n\nIf at\
    \ least one real-time task is running, no `SCHED_OTHER` task will be allowed to\
    \ run on any CPU.\n\nEach real-time (RT) task has an `rt_priority`, so the `SCHED_RR`\
    \ class is allowed to custom-distribute CPU power among all the `SCHED_RR` tasks.\
    \ The `rt_priority` of the `SCHED_RR` class works exactly like the normal priority\
    \ field for the `SCHED_OTHER` (default) class. Only the root user can change the\
    \ class of the current task to RT (more precisely, the task must hold the `CAP_SYS_NICE`\
    \ capability) via the `sched_setscheduler` system call."
  merge: -1
  img_proc: true
- pgno: 182
  md: "One of the tasks of a kernel is to make sure the system remains firmly under\
    \ its control, even in situations of misbehaving programs. One such misbehaving\
    \ program might, for instance, fork() too many processes too quickly and the kernel\
    \ become so busy with itself that it cannot tend to its other responsibilities.\
    \ Linux has no limit to how fast user-land programs can spawn children. Many commercial\
    \ UNIX systems have a limit of one fork() per processor tick (jiffy). I wrote\
    \ the following patch for my kernel, to allow it a maximum of one fork() per jiffie\
    \ (usually 1/100 sec):\n\n```\n```text\n--- 2.3.26/kernel/fork.c\t\tThu Oct 28\
    \ 22:30:51 1999\n+++ /tmp/fork.c\t\tTue Nov 9 01:34:36 1999\n@@ -591,6 +591,14\
    \ @@\nint retwal = -ENOMEM;\nstruct task_struct *p;\nDECLARE_MUTEX_LOCKED(sem);\n\
    +static long last_fork;\n+\n+while (time_after(last_fork+1, jiffies))\n+{\n+\t\
    __set_current_state(TASK_INTERRUPTIBLE);\n+\tschedule_timeout(1);\n+}\n+last_fork\
    \ = jiffies;\n\nif (clone_flags & CLONE_PID) {\n\t/* This is only allowed from\
    \ the boot up thread */\n```\n```\n\n# ## Threads\n\nThreads, as we saw earlier,\
    \ are necessary to endow processes with the capability to make use of multiple\
    \ CPUs. To reiterate, Linux doesn't really make any distinction between a process\
    \ and a thread from a memory management and scheduling point of view. Some operating\
    \ systems, like Solaris, make thread management happen within the user process.\
    \ Inside their threads library, the scheduling of the user-space threads is handled\
    \ automatically. The kernel in those operating systems only sees the process and\
    \ doesn't know which thread—if any—is executing at any given moment inside the\
    \ user process. This saves the kernel from having to manage lists with thousands\
    \ of entries for each thread, for each process. As such, this approach is well\
    \ suited to workloads with relatively few processes, when each process has many\
    \ hundreds or thousands of threads."
  merge: -1
  img_proc: true
- pgno: 183
  md: 'In the Linux implementation of threads, the kernel sees every thread in every
    process and has to maintain kernel resources (e.g. scheduling lists) for them
    all. Still, the standard Linux threads model does not preclude the same approach
    taken by OSs such as Solaris. All that needs to be done is to create an appropriate
    thread library. The kernel continues to see and schedule the task as a single
    process.


    One shortcoming of the Solaris approach is that threads emulated on the top of
    one single user process won''t be allowed to run concurrently on an SMP system;
    the user-space approach won''t scale in SMP and as such is not very useful. Threading
    is strictly necessary only when all the threads are CPU-bound. If all the threads
    are CPU-bound, then you definitely want to scale SMP.


    Using threads only to wait for events is overkill; having threads sleep on schedule
    is a waste of resources and of performance. Almost all kernel subsystems offer
    asynchronous event registration. It is preferable to manage each asynchronous
    event via SIGIO signal, which is a kind of IRQ-driven handling, as opposed to
    the polled handling as done using threads.


    With the user-space approach, you''ll at least avoid the translation look-aside
    buffer (TLB) flushing, as all the threads share the same memory view.


    The advantage of having threads managed in user space through the threads library
    is that this gives the time which would be spent in kernel CPU scheduling over
    instead to user-space processes. It is true that in user space you may choose
    to implement a very fast and unfair round-robin scheduler that may cut down the
    scheduling cost, compared to the clever (but more expensive) kernel scheduler.
    Still, it is not really worthwhile to adopt the user-space approach, because SMP
    spin locking is a big hindrance. If the number of running threads is very high,
    there are kernel patches that make the Linux scheduler a modified scheduler.


    Speaking of SMP: as of 2.3.99, pre-2 there is no possibility to declare the processor
    affinity of any given userspace process. A solution to implement this functionality
    is presented at the end of this chapter in the section “Improving the Kernel:
    CPU Affinity.”


    The 2.2.x kernel scheduler has a bug that makes it, in SMP, sometimes less efficient
    than the UP (uniprocessor) scheduler. Andrea Arcangeli of Italy fixed all such
    bugs and rewrote the heuristics from scratch, and his new SMP scheduler gives
    an impressive SMP improvement under load.


    You can get the patch at **ftp://ftp.suse.com/pub/people/andrea/kernel-patches/my-2.2.12/SMP-scheduler-2_2_11-E**.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'This patch can be applied to kernels 2.2.11 and 2.2.12 to speed up both kernels
