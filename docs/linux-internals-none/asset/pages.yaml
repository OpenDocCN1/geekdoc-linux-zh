  md: "# The Linux Process Model\n\norities. This enables the system not to stall\
    \ during a fork flooding. This is the relevant code section in linux/kernel/fork.c:\n\
    \n```\n/*\n * \"share\" dynamic priority between parent and child, thus the\n\
    \ * total amount of dynamic priorities in the system doesnt change,\n * more scheduling\
    \ fairness. This is only important in the first\n * timeslice, on the long run\
    \ the scheduling behaviour is unchanged.\n */\ncurrent->counter >>= 1;\np->counter\
    \ = current->counter;\n```\n\nAdditionally, there is a per-user limit of threads\
    \ that can be set from init before spawning the first user process. It can be\
    \ set with ulimit -u on bash. You can tell it that user moshe can run at max 10\
    \ concurrent tasks (obviously the shell and every process must stay within these\
    \ 10 tasks). In Linux the root user always has some spare tasks to herself. So\
    \ if a user spawns tasks in loop, the administrator can just login and killall\
    \ all the tasks of the offending user.\n\nBecause the runtime priority (current->counter\
    \ in the source code) of the task is divided between the parent and the child,\
    \ the kernel reacts smoothly enough to handle these situations.\n\nIf you wanted\
    \ to amend the kernel to allow only one fork() per processor tick (a jiffy—usually\
    \ one every 1/100 seconds, but this parameter, too, is tunable), you would have\
    \ to patch the kernel in linux/kernel/fork.c like this:\n\n```\n--- 2.3.52/kernel/fork.c\n\
    +++ /tmp/fork.c Tue Nov 9 01:34:36 1999\n@@ -591,6 +591,14 @@\nint retval = -ENOMEM;\n\
    struct task_struct *p;\nDECLARE_MUTEX_LOCKED(sem);\n+\n static long last_fork;\n\
    +\n while (time_after(last_fork+1, jiffies))\n+\n{\n+\n __set_current_state(TASK_UNINTERRUPTIBLE);\n\
    +\n schedule_timeout(1);\n+\n}\n+\n last_fork = jiffies;\n\n\n if (clone_flags\
    \ & CLONE_PID) {\n/\n This is only allowed from the boot up thread */\n```\n\n\
    This is the beauty of OpenSource. If you don't like something, just change it!"
