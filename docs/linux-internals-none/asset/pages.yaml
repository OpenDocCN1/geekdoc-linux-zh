- pgno: 45
  md: '# # Caches


    A cache is a subset of main memory, used to make memory access faster. When a
    memory access is issued, the caches are checked first; if the data are not already
    cached, then main memory is to be accessed. Given that a cache will hold thousands
    of memory addresses, it is not possible to check every single cache line quickly,
    so compromises are made. The fastest type of cache is *direct-mapped* or *one-way
    associative*. For each possible memory request, there is only one place to check.
    Although it is very simple and very fast, it is not very efficient. Imagine that
    you only have 10 cache locations (10 “lines”) for each address in memory; the
    cache line to check would be the memory address “modulus 10”—0, 10, 20, etc. (goto
    position 0, 1, 11, 21 etc.; goto position 1, and so on). Most Level 1 caches are
    *two-way* or *four-way associative* caches. This means that each memory location
    can be in two or four possible places. This is slower. The larger a cache is,
    the harder it is to make it fast, which is why most really massive Level 2 caches
    are direct-mapped. The choice of size, speed, and associativity depends on speed
    requirements and transistor budget. You can’t have them both, although it gets
    easier as you make the fabrication process smaller.


    The most important factor in dealing with caches is the cache *hit rate*, which
    is the percentage of found items versus searched items. Different programs and
    different data sets have higher or lower hit rates. Regardless of how you increase
    the achieved ILP, the cache hit rates also have an impact on the final speed of
    a program. It is up to the kernel designer to make sure that a processor makes
    effective use of the caches available on it. In this respect, again, the Linux
    kernel always tries to avoid cache misses through clever algorithm and data structure
    design.


    # # Branch Prediction


    The instruction stream going through execution seldom goes beyond four instructions
    without a branch. As we saw, modern CPUs execute more than one instruction at
    a time—even out of order, sometimes. However, every branch in the code will stop
    this parallelism if the CPU doesn’t know which instruction comes at a branch.
    That’s because branches usually happen based on a condition.


