  md: 'As you can see by the above formula the only thing that we need to change to
    make the IA32 (Intel x86) port using a, say, 1000Hz timer is the HZ define, which
    is the only input of the formula.


    ```

    ```

    root@hirame:~/kernel > find 2.2.13/include/asm-* -type f -exec

    egrep ''# *define HZ'' {} /dev/null \;

