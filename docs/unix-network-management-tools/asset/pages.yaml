- img_proc: true
  md: '302 Chapter 07 / Web Enabled Network Management Tools


    # Table 7.5 Predefined SNMP MRTG Objects (Cont''d)


    | SNMP Object | Object Information |

    |---|---|

    | iOutNcastPkts | The total number of packets that higherlevel protocols requested
    be transmitted to non-unicast (i.e., a subnetwork-broadcast or subnetwork-multicast)
    address |

    | iOutDiscards | The number of outbound packets that were chosen to be discarded
    even though no errors had been detected to prevent their being transmitted |

    | iOutErrors | The number of outbound packets that could not be transmitted because
    of errors |

    | iOutQLen | The length of the output queue (in packets) |


    MRTG supports mathematical operations on the SNMP objects or OID strings. This
    could be used, for example, to group the total number of input errors and output
    errors for a collection of interfaces instead of just a single interface. Thus


    ```

    Target[monet]:ifInErrors.0:public@10.0.2.75+ifErrors.1:public@10.0.2.75&ifOutErrors.0:public@10.0.2.75+ifOutErrors.1:public@10.0.2.75

    ```


    computes the sum for both first and second interfaces found on the device 10.0.2.75.


    MRTG also supports the collection of data from custom programs or scripts. For
    example, MRTG can be used to display disk space usage information. Using the df2rtg
    script, available in the contributed software directory, it monitors individual
    disk partitions and provides disk usage and size information. The following command
    shows this task:


    ```

    Target[monet]: `/usr/rtg/bin/df2rtmg -u /dev/sk/c0t3d0s7`

    ```


    When this line and some additional options are placed in a MRTG configuration
    file, the graph shown in Figure 7.6 is produced.'
