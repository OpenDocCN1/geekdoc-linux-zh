    # Qualifiers


    Three qualifiers may be used in conjunction with the primitives listed in the
    tables above. A qualifier can be used to further define search characteristics
    to pinpoint specific network traffic. These qualifiers include the following:


    ```

    from or src

    to or dst

    etnether

    ```


    The from and src qualifiers are used with the host, net, ipaddr, etheraddr, port,
    or rpc primitives to filter, based on a specific destination address or port.
    The qualifiers to or dst are used to modify the same primitives mentioned above,
    but will result in the capture of packets going to a particular address or port.
    The ether modifier is used to resolve a name to a datalink address when used with
    the host primitive. To illustrate the use of the host keyword, let''s suppose
    we want to capture traffic from a particular host only. The following snoop command
    could be used:


    ```

    # snoop from host monet

    ```


    Contrast the above command with the following:


    ```

    # snoop host monet

    ```


    In the latter example, all the traffic involving monet, which includes packets
    being sent to and received from monet, will be displayed. In the former example,
    only traffic from monet will be displayed. As you see, this can make a big difference
    when attempting to isolate a network problem.


    # Network Management Problems


    At this point, we have mainly used snoop in isolated but important examples. However,
