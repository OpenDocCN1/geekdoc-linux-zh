    # Determining Network Performance


    The ping command can be used to measure the amount of time to transmit a message
    to a remote destination and the time required to obtain a response. This use of
    the ping command in essence measures the relative speed of the path between the
    two devices at a given point in time. It does not, by any means, provide a detailed
    analysis of the devices or connectivity between them. Rather, provide a glimpse
    of the general condition of the path at the point it is measured. It could be
    that network performance is like the stock market. One day it is up and the next
    it is down.

    The primary difference with respect to volatility is whether we are talking in
    terms of days or in terms of milliseconds. A large number of factors can cause
    network performance to vary.


    The ping command provides a means of determining system response times as well,
    but it takes a little more work to determine if the observed performance problem
    is related to a slow system or a delay in the network.'
