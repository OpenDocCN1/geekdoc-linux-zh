  md: '# TRACEROUTE Tool


    If this still doesn''t do the trick, attempt to use the -I option, which will
    instruct traceroute to use the ICMP protocol when sending probe packets instead
    of UDP. So the command


    ```

    monet# traceroute -m 5 -I 128.197.2.200

    ```


    with the -I option produces the correct results:


    ```

    traceroute to 128.197.2.200 (128.197.2.200), 5 hops max, 40 byte packets

    1 rodin (10.0.2.129) 4.412 ms * 2.235 ms

    2 vermeer (128.197.2.200) 6.875 ms 6.995 ms 6.935 ms

    ```


    As you see, this took a bit of trial and error to obtain the desired result. However,
    this is not a contrived example; rather, vermeer represents a laser printer. The
    real point here is that, when tracing to a particular destination, there can be
    many reasons why traceroute fails to reach a destination and they might not mean
    that the device is down or disconnected from the network.


    # Display Options


    Two options are available to modify the output of traceroute. The first, -v, will
    display, for each hop, the size and destination of the response packets. The following
    shows an example:


    ```

    traceroute -v vermeer

    # traceroute -i 1l1 -v rembrandt

    troute to rembrandt (10.0.2.75), 30 hops max, 40 byte packets

    1 rembrandt (10.0.2.75) 56 bytes to 10.0.2.1 3.450 ms 2.085 ms

    ```


    The second, -n, is used to display addresses in numerical form rather than using
    the symbolic name. This removes the added task from traceroute to have to resolve
    each router''s hostname.'
