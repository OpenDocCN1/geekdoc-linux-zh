  md: '# Using Web Mode


    To start ntop in Web mode, use the -w option followed by a port number. This is
    the port client Web browsers will use to connect to the NTOP program. Thus, start
    ntop on port 3000, issue the following command:


    -w 3000


    After the command has started, it displays the following output:


    ```

    ntop: listening on le0

    Warning: unable to read file ''//ntop''. No security will be used!

    Waiting for HTTP connections on port 3000...

    ```


    NTOP displays interface it is using when more than one is installed on the system
    and it confirms the specified port used for incoming connections by browser clients.
    Also, it warns that it was unable to read the security file and, as a result,
    no security will be used. In this case, any client browser may connect to ntop
    and view the reports. Securing the reports will be covered later.


    With Web mode, the main page is divided into two separate frames as shown in Figure
    7.8. The frame on the left-hand side provides a list of report types that the
    user may select, while the frame on the right displays the actual selected report.
    The types of NTOP supports include:


    +   * Data Received

    * Data Sent

    * Traffic Statistics

    * Host Information

    * Remote to Local Traffic

    * Local to Local Traffic

    * Active TCP Sessions

    * IP Protocol Distribution

    * IP Protocol Usage

    * IP Traffic Matrix'
