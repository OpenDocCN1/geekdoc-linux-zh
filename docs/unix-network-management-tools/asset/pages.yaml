    <datalink address> is the node address you want to use, as specified in the format
    previously discussed.


    When configuring the logical interfaces, use the following commands:


    ```

    ifconfig lel:1 <hostA> netmask + broadcast + up

    ifconfig lel:2 <hostB> netmask + broadcast + up

    ```


    The hostnames <hostA> and <hostB> should be defined in the local /etc/hosts file
    or in the NIS hosts database. The above com-'
