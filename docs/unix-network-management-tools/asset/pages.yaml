  md: '# Operating Systems U.S.A.


    # The Comprehensive UNIX Network Management Toolset


    From UNIX veteran Steve Maxwell comes this all-inclusive book/CD-ROM package—the
    first to offer a full set of power tools and utilities for managing multipatform
    environments with a variety of UNIX tools.


    Today, UNIX systems are being used to manage environments running Linux, Novell
    Network, Windows 95, and Windows NT operating. In this complex setting, administrators
    face many choices, including a wide assortment of tools. That''s why Maxwell''s
    UNIX Network Management Tools anticipates your need for a comprehensive collection
    of the working tools and techniques that make implementing and managing solutions
    for complex networks easier. Covering the most-common flavors of UNIX systems
    and all the important protocols, this comprehensive network management reference
    guides you through critical network management administration tasks.


    For showing how to manage a multipatform computing network and to integrate needed
    components, UNIX Network Management Tools is the resource you need, the most complete
    and up-to-date toolkit on the market.


    +   - Manage UNIX, Novell, Windows, and Windows NT, using SNMP and RMON

    - Use SNMP to handle switching, routing, and virtual LANs

    - Put ARP, Netstat, Ping, and Traceroute to work

    - Employ SNMP agents from Sun Microsystems and UCD


