    | Category | Keyword | Description |

    | --- | --- | --- |

    | Extensible | exec | Executes the specified command and makes the output available
    via the MIB |

    | | pass | Passes a MIB tree to specified program that can manipulate the MIB
    objects |

    | Informational | syslocation | Used to represent the physical location of agent
    device |

    | | syscontact | Used to represent the contact person for agent device |


    Comments are supported by placing a # character at the beginning of a line.


