    0: 0000 1d0a 5d01 0800 2004 cf2c 0800 4500 ...... ..]E.

    16: 00f4 1053 4000 003b ff11 5069 0a00 037e 0a00 .0.S@..Pi....

    32: 0364 0670 8076 00a1 0021 0030 8200 002f 0201 .d.v...:8.0.../

    48: 0004 0670 7562 6c69 63a0 8200 2002 043f ...public ..?

    64: df74 3402 0100 0201 0130 8200 1030 8200 ...t4......0..0...

    80: 0006 082b 0601 0201 0104 0104 0005 00 ......+.

    ```


    The ether[51] portion of the command instructs snoop to compare this byte in the
    packet to the 0x70 value we place after the equals sign. The 51 represents the
    fifty-first byte within the Ethernet frame that contains the community string.
    After the frame displayed, if needed to search for a different community string,
    you would simply convert it to hexadecimal and replace the 0x70 byte with the
    appropriate value


