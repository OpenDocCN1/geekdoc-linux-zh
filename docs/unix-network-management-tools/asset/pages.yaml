  md: '# TCP/IP Protocol Suite


    As a network manager or administrator, you will be required to interact directly
    with the TCP/IP protocols and related services. As a result, you will need a good
    understanding of TCP/IP and associated protocols and applications. Many network
    management systems support TCP/IP as well. Today, TCP/IP is used extensively by
    many corporations, institutions, and other organizations to address their networking
    requirements. It is considered the protocol family of choice by networking manufacturers,
    operating system vendors, and'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 48 Chapter 03 / TCP/IP Protocol Suite


    users alike. In fact, the world''s largest network, the Internet, uses

    TCP/IP exclusively.


    If you have accessed a Web site, transferred files from an FTP

    server, or sent email via the Internet, you have indirectly used the

    TCP/IP protocols. Fundamentally, TCP/IP provides a standard way

    to deliver data from one system to another without the concern for

    operating system differences and network hardware. TCP/IP is an

    acronym that stands for two separate protocols: Transmission

    Control Protocol (TCP) and Internet Protocol (IP). However,

