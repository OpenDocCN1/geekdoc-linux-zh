  md: '# Chapter 03 / TCP/IP Protocol Suite


    As shown in Figure 3.1, the TCP/IP model consists of four layers. Each layer maps
    to one or more of the OSI layers, which include:


    +   - Process


    +   - Host-to-host


    +   - Internet


    +   - Network Access


    Except for network access, the other three component layers are software based
    and consist of programmed modules that provide the required functionality. Typically,
    these components are incorporated into operating systems to provide generalized
    access.


    # Process Layer


    This layer provides user applications and interfaces with the host-to-host layer.
    Additional protocols and services are also found on this layer. The process layer
    maps to the presentation and application layers, which are defined within the
    OSI model. Applications on this layer include TELNET, FTP, SMTP, and many others.


    # Host-to-Host Layer


    This layer is responsible for ensuring that data is reliable and that each higher-level
    service obtains the correct information from the sending entity. The protocol
    supported on this layer is TCP. The layer maps to the OSI transport layer. The
    term used to describe information on the host-to-host layer is called the *segment*.


    # Internet Layer


    This layer provides an unreliable flow of information from one network to another.
    From an OSI standpoint, this layer is defined as the network layer. The Internet
    layer (or network) is responsible for routing between different IP networks. The
    protocol supported on this layer is IP. The term used to describe the information
    processed on this layer is called the *packet*.


    # Network Access Layer


    The network access layer involves physical attachment to the network, which traditionally
    requires a hardware interface from'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# TCP/IP Protocol Architecture


    the network to a computer''s internal bus. This layer includes both physical and
    datalink layers from the OSI model. The network access component architecture
    defines the network architecture and topology. Some examples include Ethernet,
    FDDI and Token Ring. The term used to describe the information processed on this
    layer is called the frame.


    A small driver program, which is provided by the interface manufacturers, is also
    needed to interface the hardware to the operating system.


    # Process Layer Services


    The TCP/IP services on the process layer include end-user tools, additional protocols,
    and system services. Found on different Unix platforms, TCP/IP provides a common
    mechanism to share files, send/receive email, access systems remotely, transfer
    files between systems, and accomplish other networking tasks. Although the TCP/IP
    protocol and application suite is large, many Unix system vendors provide a smaller
    subset of these services. Table 3.2 lists many of the TCP/IP services generally
    available on Unix systems.


    # End-User Tools


    The end-user tools, which are common to many Unix system implementations of TCP/IP,
    are applications that are generally available to normal system users. As a result,
    these tools do not require system root privileges for operation. For example,
    general users without any special consideration from an administration standpoint
    can invoke the TELNET and FTP commands. Some services within the TCP/IP suite
    refer to both end-user applications and protocols. TELNET is a good example of
    this because it represents both a user tool and a communication protocol.


    It is interesting to note that certain organizations disable some TCP/IP services
    as a way of tightening security. One organization in particular did not want its
    users to have the ability to send or receive email on core development systems
    and removed the SMTP servers from those systems. Another way that organizations
    typically disable services is by blocking access to system ports using a firewall
    device or router.'
