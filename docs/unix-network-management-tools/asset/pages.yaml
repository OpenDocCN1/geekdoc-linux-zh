    # IFCONFIG Tool\n\nGeneral Description\nThe ifconfig command is short for interface\
    \ configuration and is used to configure local network interfaces. This command\
    \ is normally invoked during system startup to set up each interface with a pre-defined\
    \ configuration. The ifconfig command can also be used to change the network interface\
    \ after the system has been booted. This command provides the following:\n\n+\
    \   - Lists the configuration of each defined network interface\n- Disables/enables\
    \ any defined network interface\n- Modifies network interface configuration parameters\n\
    \nTwo versions of ifconfig are available. The difference lies in their behavior\
    \ with respect to name service (or host resolution) functions. The name service\
    \ is responsible for mapping hostnames to IP addresses and back again. The first\
    \ version of ifconfig, found in /sbin, uses a fixed configuration when resolving\
    \ host-names and cannot be altered. In contrast, the second version of ifconfig,\
    \ found in /usr/sbin, provides name services based on the /etc/nsswitch.config\
    \ file. Using this file, it is possible to alter the ordering for hostname resolution.\
    \ By default, Solaris uses the first version of ifconfig during the first phase\
    \ of network initialization and the second version when the network is fully operational.\
    \ The first form is used during network initialization because the interface information\
    \ must be derived from the local system. After all, the network cannot be used\
    \ until the network"
