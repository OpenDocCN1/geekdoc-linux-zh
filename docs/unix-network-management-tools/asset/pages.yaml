    map between IP and datalink addresses be available. The Address Resolution Protocol,
    or ARP, has been proven to provide a very elegant and robust way to solve the
    address mapping problem. In particular, ARP was designed to handle address resolution
    of any network layer protocol to datalink protocol, not just between IP and Ethernet,
    for example.


