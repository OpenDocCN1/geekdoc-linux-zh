  md: '# FPING Tool


    We can go a step further and place a list of targets inside a file for processing.
    Let''s assume a file called host-list contains the following IP addresses:


    ```

    10.0.2.75

    10.0.2.100

    10.0.2.150

    10.0.2.151

    10.0.2.152

    10.0.2.153

    10.0.2.200

    10.0.2.201

    ```


    By redirecting the input to the host-list file, fping can process a larger number
    of targets instead of requiring you to specify them by one on the command line.
    Thus,


    ```

    # fping < host-list

    10.0.2.75 is alive

    10.0.2.100 is alive

    10.0.2.150 is alive

    10.0.2.151 is alive

    10.0.2.152 is alive

    10.0.2.153 is alive

    10.0.2.200 is alive

    10.0.2.201 is alive

    ```


    is a more reasonable way to handle a larger number of hosts.

    If you prefer, the -f option can also be used instead of the file redirection
    above. Thus the commands


    ```

    # fping < host-list

    # fping -f host-list

    ```


    are functionally equivalent and yield the same result. But this option is restricted
    to the root user, while any system user can use the redirection option shown in
    the previous example.


    These two options (-u and -a) are very handy and can be used in a variety of situations.
    For example, let’s assume you want to be notified via email when certain systems
    are down. A simple script, (see Listing 4.4) like that shown below, might do this
    for you:'
  merge: -1
