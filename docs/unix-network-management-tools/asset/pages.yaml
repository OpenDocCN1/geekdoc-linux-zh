  md: '# Snmptranslate


    snmptranslate tool is used to translate SNMP MIB objects into more readable text.
    When this command is run with a MIB object, it will translate the object into
    either the SMI value or symbolic form. When no options are specified, it defaults
    to displaying the SMI value. Several command line options are supported with this
    tool. They are listed in Table 6.8. The primary use of the command is to display
    the full characteristics of MIB objects, without resorting to reading the appropriate
    MIB definition files.


    # Table 6.8 Snmptranslate Command Line Options


    | Option | Description |

    | -d | Displays a description of the object |

    | -p | Displays the symbol table from the loaded MIB files |

    | -n | Displays objects in symbolic format |

    | -s | Displays only the last symbolic part of the OID |

    | -R | Uses random access when accessing the objects |

    | -w | Displays warnings when symbol conflicts occur |

    | -W | Displays more verbose warnings than -w displays |


    snmptranslate without any command arguments displays the numeric dotted object
    notation. Thus, translation of the system.sysDesc MIB object can be accomplished
    with the command


    snmptranslate system.sysDesc in:


    which results in:


    .1.3.6.1.2.1.1.1


    To display a fairly complete description of a MIB object, use the -d option. To
    illustrate, consider the following command:


    snmptranslate -d system.sysDesc'
