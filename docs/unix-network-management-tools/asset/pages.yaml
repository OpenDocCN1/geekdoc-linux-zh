    # Address Resolution Protocol


    As we previously discussed, IP imposes a certain structure and format on the addresses
    used by networking devices. In version 4 of IP, the address uses 32-bits and is
    expressed in dotted decimal notation. In version 6, the address is even larger,
    at 128-bits. As with any high-level network protocol such as IP, the requirement
    exists for a mechanism to translate these addresses into addresses used by such
    protocols as Ethernet, FDDI, or Token Ring. These datalink protocols have their
    own addressing structure, which is quite different from IP addresses. For example,
    Ethernet uses 48-bit addresses and is expressed using the colon hexadecimal notation.
    Thus, 8:0:24:c:2c represents a valid Ethernet address. In this case, this address
    doesn''t fit neatly with that of addresses used by IP. This is true for many other
    datalink protocols as well. This creates a dilemma without a way to map IP addresses
    to physical interfaces, communication between nodes would not be possible.


