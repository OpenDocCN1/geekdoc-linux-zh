- img_proc: true
  md: '# Simple Network Management Protocol Tools


    As the previous chapter discusses system tools and utilities, this chapter focuses
    on network tools that can help manage both systems and other network-ing devices
    such as switches, routers, probes, hubs, and other SNMP-compliant devices. The
    tools in this section will likely become a welcome addition to the suite of software
    that you have now.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Chapter 06 / Simple Network Management Protocol Tools


    Tools discussed in this chapter include:


    +   - UCD SNMP Commands

    - The SnmpconfCommand


    Taken collectively, these commands provide both monitoring and administration
    functions and can be used to:


    +   - Determine SNMP System Heartbeat

    - Determine System Up/Down Messages

    - Obtain Protocol Statistics

    - Obtain Interface Performance Measures

    - Monitor System Process Activity

    - Monitor Routing

    - Configure Networking Devices


    # Monitoring/Administration Functions


    System Heartbeat


    A system heartbeat is an SNMP get-request that a manager uses to determine the
    general reachability of the agent and the system. For example, the network manager
    may poll the system clock MIB variable of the agent to determine that each successive
    poll is older than the previous one. Each successive poll should indicate that
    time is moving forward. The MIB variable that can be used for this purpose is
    the unixTime object, part of the sunSystem group of the Sun agent. As an alternative,
    the sysUpTime object from the MIB-2 system group can be used and should be available
    from all SNMP agents.


    System Up/Down Messages


    Should the system be brought down and rebooted for any reason, a message will
    be sent to the designated network management system in the form of a trap. Recall
    that a trap is an unsolicited message from the agent indicating some special condition
    or event. Receiving these messages, the manager can be informed, for example,
    of system outages and take appropriate action. The UCD'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# UCD Commands


    agent configuration file and additional tools can be used to forward trap messages
    to one or more network management systems.


    # Protocol Statistics


    Because many SNMP agents support the MIB-II standard, protocol performance and
    system monitoring is possible. This includes IP, ICMP, TCP, SNMP, network interface
    counter, and some Sun system performance objects.


    # System Process Activity


    With the Sun MIB extensions and the UCD agent, the monitoring of system processes
    is also possible. Process objects can be used to establish the overall health
    of the network or the condition of an individual system by monitoring critical
    processes.


    # Route Monitoring


    The route monitoring agent can be used to determine the routing configuration
    of a system and report any errors found. For example, if an organization has determined
    that each machine must have a default route, this can be verified by probing the
    SNMP agent within these devices.


    # Interface Performance


    MIB-2 also provides objects that contain performance information for each of the
    interfaces installed within an SNMP device. It is possible to retrieve this information
    and monitor the performance of active interfaces.


    # Configuration Control


    Many networking devices (e.g., routers and switches) must be configured before
    they can be effectively used on the network. Also, as network requirements change,
    so too the configurations within networking devices must change. The tools listed
    here provide support for device configuration changes.


    # UCD Commands


    # General Description


    The UCD package not only provides a robust and powerful SNMP agent, it also provides
    a series of handy tools that can be used to manage SNMP-enabled networking devices.
    These tools'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'support SNMPv1, SNMPv2, and in a limited fashion, SNMPv3.

    You can select which version is used with a command line option. Further, these
    tools can be used to build scripts or other programs to accomplish complex network
    management functions or custom-tasks. For example, the snmpget command can monitor
    certain critical interfaces to determine if one or more of becomes inoperable.
    In such a case, the appropriate support staff will be notified automatically by
    the monitoring software.


    If the UCD distribution has been completely installed, a full set of Unix manual
    pages that cover all the UCD tools presented in this chapter will also be installed.
    The default location for these pages is /usr/local/man.


    The tools and utilities that are supplied with the UCD package, along with a general
    description, are listed in Table 6.1.


    # Table 6.1 UCD SNMP Tools


    | UCD Tool | Description |

    |---|---|

    | snmpbulkwalk | Obtains MIB object with SNMP bulk request |

    | snmpdelta | Monitors changes of SNMP variables |

    | snmpget | Obtains one or more MIB objects |

    | snmpgetnet | Continuously walks an SNMP MIB tree and obtains all supported MIB
    objects |

    | snmpnetstat | Obtains agent interface configuration information |

    | snmpspset | Sets one or more MIB objects to specified value |

    | snmpstatus | Obtains important MIB object information |

    | snmptable | Obtains a complete SNMP table |

    | snmptest | Communicates with an SNMP agent entity |

    | snmptranslate | Converts MIB objects into more meaningful information |


    (Cont’d)'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Table 6.1 UCD SNMP Tools (Cont’d)


    | UCD Tool | Description |

    |---|---|

    | snmptrap | Sends SNMP trap messages to one or more managers |

    | snmtrapd | Retrieves SNMP traps from the network |

    | snmpwalk | Obtains a group of related MIB objects |


    The basic syntax of the UCD tools is:


    snmpcmd protocol_version [additional_options] hostname community object [object]


    The word snmpcmd is a placeholder and represents one of the UCD commands listed
    in the above table.

    The word protocol_version is 1, 2c, or 2p. This string identifier specifies which
    SNMP version should be used. A 1 represents the standard SNMPv1. A 2c indicates
    differences within the supported SNMP data units, but uses the same community-based
    approach as in SNMPv1. A 2p indicates SNMPv2 with party-based security.


    The additional_options are listed in Tables 6.2 and 6.3 and control the operation
    and display attributes of the UCD tools. The most commonly used command line options
    are described more fully below.


    The word hostname can be replaced with the name of any host on the network that
    contains an SNMP agent that matches the protocol_version information specified
    on the command line. A valid IP address, expressed in dotted notation, may be
    used instead of a hostname.


    The word object represents the MIB object that should be retrieved (in the case
    of an SNMP GET) or altered (in the case of an SNMP SET). It may be expressed in
    either dotted numeric or dotted-named notation. In the case of an SNMP SET operation,
    additional-object object information will be required, as discussed in the “SNMP
    Set” section below. Note that one or more objects may be specified on the command
    line.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Common Command Line Options


    UCD tools share a common number of command line arguments. Having a core set of
    options makes it easier to remember and use the tools. The arguments supported
    by all the tools are divided into two categories: operational and display options.
    The operational options control the behavior of each of the tools, while the display
    options control how the MIB objects, associated values, and other information
    are displayed.


    # Display Options


    The display arguments are listed in Table 6.2; a total of eight are available.
    However, please note that not all of them are fully described below. For instance,
    the -h option that displays a help string that includes the command line options
    and meanings is not described because its function is fairly intuitive.


    # Table 6.2 Common Display Options


    | Option | Description |

    |---|---|n| -d | Dumps SNMP packets |

    | -D | Displays debugging information |

    | -h | Displays a help message |

    | -f | Displays full object identifier path |

    | -q | Makes it easier to parse for programs |

    | -s | Displays only suffix identifiers |

    | -S | Displays both suffix identifiers and MIB name |

    | -V | Displays version information |


    Three of the options provided control how MIB path information is formatted and
    displayed. These options include -f, -s, and -S. The -f option is used to display
    the full object identifier information. Thus the object, system.sysContact.0'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# UCD Commands


    will be printed as

    .iso.org.dod.internet.mgmt.mib-2.system.sysContact.0


    The -s option permits only the suffix to be printed; the last symbolic portion
    of the MIB object identifier will be shown. For example,

    .iso.org.dod.internet.mgmt.mib-2.system.sysName.0

    will be printed as

    sysName.0


    Finally, the -S option requests the MIB object be printed with both suffix and
    MIB names. Thus,

    .iso.org.dod.internet.mgmt.mib-2.system.sysTime.0

    will be displayed as

    SNMPv2-MIB:sysTime.0


    Please note, in this example, the sysTime object is found within the SNMPv2-MIB;
    this is true when using the UCD tools. However, this object is traditionally found
    in the MIB-2 tree.

    If you need to collect SNMP information from a device and use this information
    as input into another program, the -q option will come in handy. Normally, MIB
    object information is displayed as shown below:


    ```

    system.sysObjectID.0 = OID: enterprises.9.1.17

    system.sysUpTime.0 = (13949444) 16 days, 3:29:06.44

    system.sysContact.0 = Matthew Maxwell

    system.sysName.0 = remote - gw5

    system.sysLocation.0 = Remote Sales Office (San Jose)

    system.sysServices.0 = 6

    ```


    The -q option, which stands for a quick format, causes the above to be formatted
    differently. First, the equal sign (=) is removed; this makes it easier to parse
    the data is in column format. Second, notice that both sysObjectID and sysUptime
    formats have been changed. The object information in the above example is interpreted
    while, below, the raw data is displayed.'
