  md: '# NTOP


    Note the most important NTOP reports are described in more detail below.


    # Data Received Report


    This report shows network traffic that was received by the listed network hosts,
    sorted by network protocol type. This report plays a long table, as shown in Figure
    7.10, that contains the active hosts, the amount of received data in kilobytes,
    the percent of network traffic received by system, and the amount of data traffic
    broken down by network protocol type.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_334_0.png)


    **Figure 7.10** Data Received Report.


    In this example, three hosts have been identified, including durer, rembrandt,
    and 224.0.0.1. These are the active systems presently generating traffic on the
    network. However, in the case of 224.0.0.1, the Sun system periodically polls
    this IP address (using ICMP) to determine if the multicast address is available.
    The NTOP software is recording this as a real host when, in fact, it is the same
    system as durer.


    This report shows the total amount of received in the second column, expressed
    in bytes, kilobytes (Kb), and megabytes (Mb). Also, the received column shows
    the amount of traffic that each host received as a percent. In the example above,
    out of the listed systems, rembrandt was the recipient of the largest amount of
    traffic, which represents 91% of the total traffic transmitted on the network.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 316 Chapter 07 / Web Enabled Network Management Tools


    The next two columns show the total amount of data that were either TCP or UDP
    packets. In this case, TCP accounted for the lion''s share of traffic. The remaining
    column includes total data received by protocols such as ICMP, FTP, TELNET, and
    others. Although this report contains only a small number of hosts, from a network
    performance standpoint it provides some very useful information. We can sunrise
    that the FTP protocol is used more than any other protocol listed. This was determined
    by comparing the total FTP traffic with all other protocols.


    # Data Sent Report


    This report shows the hosts that transmitted traffic on the network and is shown
    in Figure 7.11. The format of this report is the same as the received report,
    except that it contains a sent column instead of a received column. This report
    is useful for tracking down hosts that generate or receive significant numbers
    of packets. In some cases, this could represent a normal situation reflecting
    true traffic patterns; on the other hand, it could indicate some type of trouble.
    It could provide evidence of a misconfigured device or some other undesirable
    activity. For example, it is interesting to note that the host richard transmitted
    a significant amount of data on the network using the NETBIOS ios protocol. This
    could be reason to suspect foul play, because the network being monitored is IP
    based.


    Further, the number of ICMP packets seems rather high. This could indicate that
    a large number of ping requests are flooding the network.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_335_0.png)


    Figure 7.11 Data Sent Report.'
