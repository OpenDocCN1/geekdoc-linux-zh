  md: '# Master and Subagent


    4. The PDU is decoded.


    5. The PDU is processed.


    Connectionless Protocol


    SNMP is a connectionless protocol, which means that it doesn''t support the concept
    of establishing and controlling a dedicated connection like TELNET or FTP. SNMP
    transmits information between an agent and a manager by the use of requests and
    return responses. This removes the burden from agents of having to support additional
    protocols and processes associated with connection-based schemes. Therefore, SNMP
    provides its own mechanism to address reliability and error detection.


    # Master and Subagent


    When deploying network management software, you commonly-have a single agent installed
    on every system that will be managed. In the case of networking devices such as
    network routers and switches, usually only a single agent is available. In either
    case, the agents will communicate with one or more network managers using the
    standard SNMP port of 161. For most needs, a single agent approach makes sense
    and is appropriate. However, there are instances when more than one agent is necessary
    to achieve the desired level of manageability. For example, workstation manufacturers
    will often provide an SNMP agent within their operating system. This particular
    system agent will usually support a limited number of operating system functions
    and parameters. If we wish to manage database services on this same system via
    SNMP this will require that we install another agent to specifically monitor the
    database functions. This poses a problem because both agents will typically be
    accessed by the SNMP manager using the standard port. Further, when the agents
    are started by the system, the first agent will start and open the port 161 and
    will operate normally. However, when the second agent starts and attempts to do
    the same it will get an error stating that the port is busy and it should abort
    operation.


    Two possible approaches can be used to address this port problem. First, one of
    the agents can be configured to use an alternative'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'port instead of standard 161. This solution will work if the agent can be made
    to support another port when it is started by the system. Many system agents do
    support alternative ports, but this is by no means the rule. The major drawback
    to this solution is that any SNMP managers used to poll the agent must now be
    configured to support this new port as well. This doesn''t pose a significant
    problem when only a small number of non-standard ports are used. However, if this
    solution is used on a large scale, with many system agents using all non-standard
    ports across a large number of systems, the approach loses its appeal because
    of the administrative burden it may introduce.


    The other solution might be considered more elegant, because it involves using
    a master agent and one or more subagents. A master agent solves the port conflict
    problem by becoming the keeper of the standard SNMP port and forwards all the
    SNMP traffic to the appropriate subagent. Subagents are normal SNMP agents, but
    they are registered with the master agent and are assigned non-standard ports
    that are used to communicate with the master agent. SNMP messages from managers
    to the master agent, who in turn delivers the message to the correct subagent
    using the port dynamically assigned to the subagent. Figure 2.8 shows a diagram
    of the master/subagent architecture. One major benefit of this solution that it
    alleviates the administration task of modifying the SNMP managers cited as the
    first solution. Also, this solution can scale very well because new subagents
    can be added in a straightforward manner.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_63_0.png)


    Figure 2.8 Master/Subagent Architecture.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Master and Subagent


    On the negative side, the master agent can pose a problem because it can crash
    or otherwise become inoperative. This would have the adverse effect of disabling
    the connectivity to the sub-agents. Because this particular problem can be said
    of other software systems as well, although not zero, isn''t necessarily a significant
    factor. Also, because the master agent is responsible for delivering the SNMP
    to the appropriate subagent, it takes a certain amount of processing time and
    overhead. This might be a factor in time-critical management functions.


    Several proposals and products have been put forth in an attempt to provide a
    standard mechanism that supports master and subagent architectures. These include
    SMUX¹ (RFC 1227), AgentX (RFC 2257), and vendor specific products like master
    agent on Solaris and the master agent on HP-UX. All of these accomplish the same
    purpose: permitting two or more agents to operate on the same system without port
    conflict problems.


    > 1. This RFC as been promoted to historic status'
  merge: -1
