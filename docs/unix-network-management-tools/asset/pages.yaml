    When the agent receives the above message and no errors have occurred, it will
    respond with the values of the MIB objects requested via a GetResponse PDU. The
    GetRequest command is an atomic operation. That is, all the values requested are
    returned or no values are returned. When the receiving entity responds to the
    GetRequest, it includes the values in the GetResponse variable- binding field.
    If, for some reason, at least one of the values cannot be supplied, no values
    will be provided.


    If the values requested from a manager cannot be returned by the agent, the agent
    will respond with an error. For example, the management system might have requested
    a MIB object that isn''t implemented in the agent. In this case, the agent can''t
    possibly sat-isf the request and an error is returned. Also, in certain situations,
    returning the value of a requested object fails it might be too large to be processed
    by the manager.


    The variable-binding includes a list of objects for which values are requested.
    When the agent responds via the GetResponse, the variable binding includes the
    requested objects and associated val-ues. Given the example above, the following
    GetResponse would be sent by the agent:


    ```

    GetResponse(sysDescr="3Com Enterprise Monitor", sysUpTime=000154477)

    ```


