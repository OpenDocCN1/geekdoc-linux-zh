    # Command Line Options


    The snmpdx agent supports several command line options, which are listed in Table
    5.2 and are described in following section.


    # Table 5.2 Master Agent Command Line Options


    | Option | Description |

    | -a | Specifies the path of the access control file used by the agent |

    | -c | Changes the path to search for the agent configuration |

    | -d | Activates debugging level |

    | -h | Prints online help |

    | -i | Specifies the path of another status file that is used by an agent |

    | -m | Instructs the agent to forward SNMP messages based on specified mode |

    | -o | Used to specify the path of the enterprise OID mapping file |

    | -p | Used to specify port instead of the default of 161 |

    | -r | Specifies the path of the resource file |

    | -y | Invokes recovery of the subagents |'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'The -a option is used to specify the path and filename for the access control
    file. The agent uses this file to control access to the MIB by external entities.
    The default file is /etc/snmp/conf/snmpdx.acl. The -i option is used to give another
    full path for the master agent status file. This is the file used by the master
    agent for recovery after a crash. It contains the Unix process id, port number,
    resource name, and agent name of each subagent defined. The default location and
    name of the status file is /var/snmp/snmpdx.st.


    The -c option is used to change the default configuration path from /etc/snmp/conf.
    The master agent searches for the agent configuration, resource file, and OID
    mapping files in this location. The -o command line option is used to change the
    default location and name of the enterprise-name OID. The master agent uses this
    file to map vendor names to enterprise numbers. This file is, by default, /etc/snmp/conf/enterprises.oid.
    Trap processing by the master agent requires this information to determine vendor-specific
    information. The -r option controls which resource file is used by the master
    agent. This file contains agent configuration information and the default path;
    the file name is /etc/snmp/conf/snmpdx.rsrc. Because the master agent is started
    at system boot time, these options should be changed in the /etc/init.d/init.snmpd
    startup file so that they may be permanent. However, it is recommended that any
    changes to the startup file be tested before the system reboot.


    Why the location of the files? Well, in some sites, the standard practice file
    system location that has been previously set up and is commonly available across
    every system on the network. Further, this area might be archived more regularly
    than other file systems and, as a result, used to store all configuration files
    for third-party tools. Using this area can be more beneficial than the default
    local for this reason. Also, if you want to test new configurations that may exist
    in other locations and with different file names, these options can help as well.


    The -h option is useful because it can be used to display the help summary of
    the master agent. Running the snmpd master agent'
