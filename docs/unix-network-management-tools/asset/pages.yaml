    Because the verbose mode of snoop displays a significant amount of detail, it
    should be used only when inspecting a small number of packets while debugging
    network protocol issues or problems. This approach should be followed for two
    reasons. First, verbose mode displays a large number of lines per packet and,
    as a result, attempts to find some specific information can be difficult. The
    proverbial "needle in the haystack" certainly applies. Second, decoding each frame
    and subsequently every encapsulated protocol requires additional computing processing
    overhead. Using the system resources to decode packets may have adverse effect
    on other system tasks and on snoop as well. Because snoop is run like any other
    system program, it must share the system with many competing tasks. The amount
    of traffic on the network will also have an effect on snoop, because a heavily
    loaded network will require more processing than a lightly loaded one. As a result,
    snoop can miss or drop packets if it is busy decoding or displaying a lot of packets.


    It is important to know, particularly in a networking situation, when snoop drops
    packets. If you think this might be happening, use the -D option to display the
    number of packets snoop drops. You might use this option, for example, when capturing
    a critical packet exchange between systems.


