    # Error Message/Problem:


    No answer from community@device. You may be using the wrong community


    # Solution


    MRTG is having trouble polling a device with the SNMP community string specified
    in the configuration file.


    # Error Message/Problem:


    ```

    ./mrtg rmon

    ERROR: I guess another mrtg is running. A lockfile (rmon_1) aged 264 seconds is
    hanging around. If you are sure that no other mrtg is running you can remove the
    lockfile.

    ```


    # Solution


    MRTG detected a lock file, which indicates that another copy of MRTG is presently
    running or ran in the past and failed to remove the lock file. Use the ps command
    to ensure that no additional MRTG process is running. If no additional process
    is running, remove the lock file.


    # Error Message/Problem:


    ```

    ERROR: I can''t find a "target[10.0.2.50.1]" definition

    ```


    # Solution


    MRTG reports that the target keyword command is missing from the configuration
    file.


    # Error Message/Problem:


    ```

    ERROR: "WorkDir" not specified

    ABORT: Please fix the error(s) in your config file

    ```


    # Solution


    The WorkDir command has not been included in the configuration file that was specified
    with the mrtg command. Because this keyword is not optional, MRTG aborts without
    this definition.


