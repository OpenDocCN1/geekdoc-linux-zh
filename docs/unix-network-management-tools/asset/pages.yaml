- img_proc: true
  md: '# Networking Management Agents


    This chapter provides a detailed overview of the Solstice Enterprise Agents (SEA)
    and University of California at Davis (UCD) SNMP system agent. The Solstice Enterprise
    Agents actually contain two agents: a master and a subagent. Because the term
    Solstice also refers to Sun’s network management framework and mix of products,
    the terms master agent and subagent will be used to describe these agents from
    Sun. The SEA package also includes support for the Desktop Management Interface
    (DMI). However, this chapter only focuses on the'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'SNMP portion and not on the DMI services or functionality.


    Included is an overview of how to use, obtain, install, and config-ure the master,
    subagent, and UCD agent. A description of the MIB groups and objects supported
    by each of the agents is presented as well.


    # Software Availability


    The Sun SNMP agent and master agent are available only on the Solaris Platform.
    They are shipped standard on the present version of Solaris, but can be installed
    on previous releases as well. The UCD SNMP agent is available on Solaris, HP-UX,
    Linux, and sev-eral other Unix platforms. The Sun agents are available from the
    Sun Web in binary form only; the UCD agent is also available from the Internet
    in source or binary form. Consult the end of this chapter on specific download
    information and installation instruc-tions for these tools.


    # Overview of Agents


    All the agents listed above provide some of the same fundamental services; namely
    the retrieval and setting of MIB objects. Each of the agents supports the standard
    SNMP basic operations, including `get-request`, `getnext-request`, `set-request`,
    `get-reply`, and trap. Additionally, each of the agents provides some func-tions
    such as support for disk or memory management. Table 5.1 outlines the functionality
    of each agent and can be used as a quick reference guide when choosing an agent.
    Selecting which agent to use depends on the environment and the types of problems
    you are attempting to solve. It might, for example, be necessary to use all three
    agents because each provides services that are required.


    The functionality of each of the agents can be summarized into several categories
    that include:


    +   - MIB-II Support—Indicates that the agent supports either or of the entire
    standard MIB-II set of objects.

    - Process Management—Indicates that additional MIB objects are available to manage
    Unix processes. Basic operations include listing and controlling these processes
    via the agent.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '+   Remote Configuration—Indicates the capability for the agent to manipulate
    its own configuration file via the SNMP protocol. For example, the agent can be
    made to dynamically alter a predefined action when the monitored object reaches
    a critical threshold.


    +   Extended MIB Support—The agent supports additional MIB objects, which provides
    more information beyond the MIB-II standard. This might either include proprietary
    vendor-specific MIBs or standard MIBs such as the RIP-MIB.


    +   Flexible Configuration Files—This implies that the agent provides a flexible
    set of configuration options and keywords, primarily used to control the operating
    state and behavior of the agent.


    +   Performance Objects—The agent supports additional MIB objects, which can be
    used to provide additional performance information or statistical data.


    +   Customizable Actions—The agent can execute external scripts or programs as
    directed by the agent. Usually, these actions are a direct result of some specific
    condition or event that the agent has detected.


    +   Memory/Disk Management—The agent provides additional MIB objects that can
    be used to provide additional memory or disk information or statistical data.


    +   Master Agent Support—The agent provides the capability for subagents to receive
    SNMP messages. The master agent is responsible for handling outside communication
    on behalf of the subagents. The master agent uses the SNMP port 161, while the
    subagents communicate with the master agent on another predefined port.


    +   Extensible—The agent can be extended to support additional functionality and
    support new features such as executing external Unix shell script or other commands.
    This might also imply that the agent provides a development environment that'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'includes interfaces that facilitate adding new features by recompiling (or
    linking) various components of the package.


    +   * SNMPv2/v3—The agent supports some of or the entire SNMPv2 and SNMPv3 protocol
    specifications.


    # Table 5.1 Functional Overview of Agents


    | Category | Sun Master | Sun | UCD |

    | :--- | :---: | :---: | :---: |

    | MIB-II Objects | | ✓ | ✓ |

    | Process Management Objects | ✓ | ✓ | ✓ |

    | Remote Configuration | | | ✓ |

    | Additional System Objects | | ✓ | |

    | Flexible Configuration | | ✓ | ✓ |

    | Additional Performance Objects | | ✓ | ✓ |

    | Customizable Actions | | | ✓ |

    | Memory Management Objects | | | ✓ |

    | Disk Management Objects | | | ✓ |

    | Master Agent | ✓ | | |

    | Subagent Management | ✓ | | |

    | Extensible Capabilities | | | ✓ |

    | SNMP v2/v3 | | | (partial v3) |


    # Sun''s Master Agent


    Sun provides a standard SNMP network management master agent that can be used
    as a basis for an enterprise management strategy. Sun provides an agent called
    snmpdx, which is used to provide a master/subagent facility for one or more subagents.
    Recall'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Overview of Agents


    from Chapter 2, “Simple Network Management Protocol,” that the main purpose and
    role of a master agent is to permit many SNMP agents to coexist. Because each
    SNMP agent must listen for requests on the well-known SNMP port 161, a mechanism
    must be provided so that all agents can share this port without conflict. Without
    special arbitration, the first agent to use the port would obtain an exclusive
    lock on the port and all other agents would be denied access. With the snmpd agent,
    many subagents can be installed on the same system without the traditional port
    contention problem. Also, this master agent supports a collection of MIB objects
    that describe each of the subagents that have been configured with the master
    agent.


    # Sun’s SNMP Agent


    Sun provides a standard SNMP network management system agent. This agent, known
    as mibiisa, supports SNMPv1 and provides read/write access to both MIB-II and
    Sun enterprise-specific objects. The agent supports the standard basic operations
    associated with SNMPv1. This agent works under Sun’s master/slave agent architecture,
    which means that it can operate in conjunction with a master agent or in standalone
    mode. This agent provides the ability to manage Sun workstations and servers from
    an operational and performance standpoint. It supports the standard MIB-II object
    groups and some of additional groups defined by Sun. Taken together, this agent
    can be used to monitor the more critical network management problems that face
    network and system managers alike.


    The advantages of using this agent include integration into the operating system
    and support by the vendor. As a result of the agent being shipped with Solaris,
    installation is a snap because the agent component can very easily be loaded with
    the operating software. On older versions of the operating system that don’t already
    have the agent, it is possible to install in a straightforward manner by using
    Sun’s pkgadd utility. Additionally, because the agent was developed by Sun, it
    will be supported problems that arise that require technical assistance. Finally,
    vendor support ensures that users can expect enhancements and new functionality
    to be included in future releases of the agent. This is important'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'because SNMP will continue to change to meet the growing requirements of network
    and system managers.


    # UCD’s SNMP Agent


    The UCD agent, known as snmpd, provides a comprehensive list of SNMP-related services.
    This agent supports SNMPv1 and SNMPv2 network management protocols. This means
    it supports not only the basic SNMP operations, but also associated with SNMPv2,
    such as get-bulk, get-inform, and several others. It supports MIB-II, the UCD
    MIB, and several other MIBs as well. The agent provides the capability to remotely
    execute Unix commands that have been configured based on certain events or conditions.
    The agent can be used to monitor both system memory and process information.


    The advantages of using the UCD packet are significant. First, the software provides
    a very complete set of tools and features available within the public domain.
    The package includes user SNMP tools, plus a fully functional SNMP agent. Many
    SNMP packages are available on the Internet, but most don’t compare to the stability,
    robustness, and features found within the UCD package. Next, despite the fact
    that the UCD software is public domain, it seems to have a loyal following and
    has seen continuous improvement over the years, surpassing some well-established
    commercial products in terms of SNMP protocol support or features. The UCD tools
    are supported on a large number of computer platforms and operating systems. Finally,
    the UCD is free, which means it can be deployed across the network enterprise
    without concern for licensing issues. This makes the UCD agent very attractive
    to budget-constrained institutions and other organizations.


    # Agent MIBs


    Each of the agents described in this section implement either standard or private
    (or both) MIBs. Because both the Sun and UCD agents use private MIBs, access to
    these objects is at the enterprise branch level. Figure 5.1 shows the path from
    root to each of the vendor’s private branches.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Security Considerations


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_190_0.png)


    **Figure 5.1** Sun/UCD Agent MIB Branches.


    # Security Considerations


    The capabilities of these agents are very powerful and can have a profound impact
    on network management. Because these agents provide access to critical portions
    of the system, care should be taken when configuring and using them. For example,
    the configuration file for the Sun Agent provides the ability to set community
    strings for both read and write access to the MIB. Many network'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'management systems and agents (including the ones listed here) are configured
    with the standard community strings of public and private by default. It would
    be important to change these to non-standard passwords when deploying these agents
    at a local site. Despite the fact that SNMP community string information can be
    obtained via a packet capture device and decoded, community names should still
    be unique and hard-to-guess. In a large installation it might be necessary to
    use a set of community strings for a collection of devices either geographically
    co-located or for certain types like Cisco or Bay routers.


    Failure to configure the agents correctly can be disastrous. For example, with
    the Sun agent, a network interface can be disabled with a simple SNMP set command
    if the community string is public. Someone with a MIB browser or snm command tool
    could easily disable one or more system interfaces. If the disabled interface
    is the only interface on that system, the system would effectively become disconnected
    from the network. As a result, all network-related processes would be affected
    by this action. In some environments, this would be considered an outage and would
    carry significant consequences. To restore the system to its original state, the
    administrator must log in to the system console if available and enable the interface
    using the ifconfig command. Alternately, if no system console exists, the system
    must be rebooted by cycling the system; this step also adds to the possibility
    of system loss.


    # Sun''s Master Agent


    # Master Agent Configuration/Configuring a Subagent


    Before a subagent can be used, it must be registered with the master agent. This
    is accomplished by updating a small number of configuration files that are located
    in the /etc/snmp/conf directory. When the master agent starts, it parses any registration
    and'
  merge: -1
  pgno: 191
- img_proc: true
  md: "# Sun's Master Agent\n\nresource files located in this directory. The master\
    \ agent also ensures that messages from the network flow to the correct sub-agent\
    \ and messages emitted from the subagents are also forwarded correctly. To register\
    \ with the snmpdx master agent, the following files must contain entries for the\
    \ subagent:\n\nagent.reg\nagent.rsrc\n\nThe agent prefix represents the name of\
    \ the subagent that will be configured under the master agent. The agent.reg file\
    \ is used to register the subagent with the master agent. The registration file\
    \ consists of a keyword (or token) followed by a single value separator by a new\
    \ line. Comments are permitted in these files using the hash character (#). A\
    \ single collection of keywords and values are enclosed in brackets and constitute\
    \ a subagent entry. The keywords that can be used in the registration file include\
    \ name, subtrees, timeout, and watch-dog-time.\nThe name keyword is a simple label\
    \ for naming the subagent internally. The subtrees keyword is used to specify\
    \ the MIB tree that the subagents support when queried by another SNMP entity.\
    \ The timeout keyword is used to control how much time the master should wait\
    \ for the subagent to process an SNMP request. The timeout value is expressed\
    \ in microseconds. The watch-dog-time keyword is used by the master agent to determine\
    \ if the subagent is still functioning by periodically checking the status of\
    \ the sub-agent. To further illustrate, consider the registration file (see List-5.1)\
    \ that is used by the mibisa subagent:\n\n# Listing 5.1 Agent Registration File\n\
    \n```\nagents = {\n    name = \"snmpd\"\n    subtrees = { mib-2, sun }\n    timeout\
    \ = 2000000\n    watch-dog-time = 86400\n}\n```"
  merge: -1
  pgno: 192
- img_proc: true
  md: "# 174\n\n# Chapter 05 / Networking Management Agents\n\nIn this case, the name\
    \ of the mibisa subagent is snmpd, which is used internally to the master agent.\
    \ The subtrees values denote two macros that are shorthand for specific OID strings.\
    \ The mip-2 is defined as 1.3.6.1.2.1 and sun 1.3.6.1.4.42. The timeout value\
    \ in the above example is 2 seconds (or 2,000 microseconds); the watch-dog-time\
    \ value is expressed in seconds.\n\nThe resource file, agent.rsrc, is also needed\
    \ when configuring a subagent to work with a master agent. This file is primarily\
    \ used to indicate the registration file and the sub program name. The resource\
    \ file for the mibisa subagent is listed below. This file shares the same format\
    \ as the registration file, with keywords followed by values. The resource file\
    \ requires a registration_file, policy, type, and command keyword and associated\
    \ values. The registration_file token is used to assign the subagent registration\
    \ file that the master agent will use. The policy token is used to indicate how\
    \ the master agent should execute the subagent. The command token represents the\
    \ subagent program that the master agent will start after it completes parsing\
    \ both the registration and resource files for each of the subagents. The SNMP\
    \ port can also be specified in this file by using the port keyword. However,\
    \ the subagent can also let the master agent assign a port to use by using the\
    \ $PORT string. In the example below, the mibisa subagent uses the $PORT string\
    \ instead of statically assigning a port.\n\n# Listing 5.2 Agent Resource File\n\
    \n```\nresource = {\n    registration_file = \"/etc/snmp/conf/mibisa.reg\"\n \
    \   policy = \"spawn\"\n    type = \"legacy\"\n    command = \"/usr/lib/snmp/mibisa\
    \ -p $PORT\"\n}\n```\n\nAlso, the master agent requires the following files:\n\
    snmpdx.acl\nsnmpdx.reg\nsnmpdx.rsrc"
