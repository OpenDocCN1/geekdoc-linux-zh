    # Troubleshooting MRTG Problems


    Because the MRTG configuration file consists of plain text, it is relatively simple
    to introduce syntax or other errors into this file during customization. Also,
    other conditions might exist that produce errors when executing other MRTG programs.
    Listed below is a list of some of the most common run-time and configuration problems.


    Error Message/Problem:


    ```

    Rateup WARNING: //rateup could not read the primary log file for 10.0.2.50.1

    Rateup WARNING: //rateup The backup log file for 10.0.2.50.1 was invalid as

    Rateup WARNING: //rateup Can''t remove 10.0.2.50.1.old updating log file.

    ```


    Solution


    Don''t worry about these errors. They occur once in a while, but don''t pose any
    serious problem and can be ignored.'
