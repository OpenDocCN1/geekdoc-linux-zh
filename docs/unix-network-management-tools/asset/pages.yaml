    # Routing Implications


    The private keyword can be used to indicate that the interface should not be advertised
    from a network routing standpoint. This has the effect of hiding the interface
    from the routing process that may be active on the system. Normally, routing functions
    are limited on those systems that contain at least two network interfaces. When
    two or more interfaces are found, routing functions are automatically activated.


    When routing is active on the system and an interface is established with a route,
    the metric keyword can be used to alter the routing hop count for that interface.


    # NETSTAT Tool


    General Description

    The netstat (network status) command provides a wealth of information regarding
    the present status of network connections, routing information, and other important
    network-related information. This tool is strictly for monitoring and is one of
    the most popular debugging aids available on Unix. Different command line options
    control the display behavior of netstat. As such, the functionality of netstat
    can be divided into a number of categories:


    +   * Active Network Sessions

    * Interface Information and Statistics

    * Routing Table Information

    * Network Data Structures

    * Miscellaneous Display Options


