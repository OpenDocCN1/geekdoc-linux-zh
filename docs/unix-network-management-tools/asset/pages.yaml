    # Monitoring Additional Information


    MRTG can be used to monitor other information—including additional SNMP objects
    and non-SNMP information—using the **Target** command. The **Target** command
    can be used to monitor and graph information. These formats include direct OID
    strings, SNMP abbreviated objects, and custom commands. The direct OID format
    uses Object Identifier (OID) strings, expressed in fully qualified dotted decimal
    notation, that specify which object should be monitored by MRTG. Fully qualified
    indicates that the entire path from the root to the object has been supplied.
    For example, to monitor *InErrors* and *ifOutErrors* from the device `10.0.2.200`,
    use the following command:


    ```

    Target[10.0.2.200.1]:1.3.6.1.2.1.2.2.1.14&1.3.6.1.2.1.2.2.1.20.1:public@10.0.2.200

