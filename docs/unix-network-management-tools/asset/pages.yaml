    attached to the console of the system. If the system only contains a single interface
    and it is marked down using the command line, then you will cut off your access
    to the system. Only a reboot can restore the network interface to its original
    state.


    # DHCP Support


    Starting with Solaris 2.6, Dynamic Host Configuration Protocol support has been
    included within the operating system and can be configured using the ifconfig
    command. The auto-dhcp keyword is used to indicate that DHCP should be used for
    an interface to automatically acquire IP address information over the network.
    Why use DHCP? DHCP is a very good way to handle IP address allocation within a
    growing network environment where host identifiers are modified or added on a
    frequent basis.


    With DHCP, one or more servers must be defined that contain a master list of IP
    address information that can be given to client systems. Conceptually, when a
    client system starts up, it makes a request via a broadcast for an IP address.
    The server receives the request, checks its local database for an available address,
    performs any defined security checks, and sends a reply back to the cli-'
