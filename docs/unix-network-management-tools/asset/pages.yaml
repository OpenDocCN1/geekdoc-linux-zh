    # PING Tool


    # General Description


    The ping tool can be used in one of two ways: by specifying a valid hostname or
    IP address or using command line options with a hostname or IP address. Using
    the first, ping provides a handy way to determine that a remote device is available
    on the network.


    Recall from Chapter 3, “TCP/IP Protocol Suite,” that ping uses the Internet Control
    Message Protocol (ICMP) to emit ICMP'
