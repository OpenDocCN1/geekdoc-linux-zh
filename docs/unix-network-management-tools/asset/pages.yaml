    The -m option is used to specify the mode to forward SNMP

    requests to each subagent. Two modes are available with the mas-ter agent. The
    first, GROUP, indicates that multiple variables can be\included with each request
    from the master agent. The second

    mode, SPLIT, ensures that each variable in the incoming request

    results in one send request to each subagent. The default forward-ing mode is
    GROUP.


    The -p option is used to specify an alternative port that the mas-ter agent will
    use when receiving or transmitting SNMP messages.

    The master agent uses the default SNMP port of 161 to send and

    received SNMP messages. Using this option, the master agent will

    listen on another port specified after the -p argument. For exam-'
