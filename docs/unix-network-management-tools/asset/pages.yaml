    # Master Index


    MRTG can be said to be “interface centric.” This means that its main focus is
    on the interface of the devices being monitored. MRTG is used to monitor a Cisco
    router with five interfaces, five separate MRTG reports will be created. Unfortunately,
    this structure, though sufficient for a small number of interfaces, becomes difficult
    to use and manage when faced with a large number of interfaces or the combination
    of many devices and interfaces. To assist with this task, a script has been provided
    in the MRTG distribution, called indexmaker, which produces an index of all the
    monitored devices and interfaces. The syntax of indexmaker is:


    indexmaker config label interfaces


    This command accepts three arguments—the MRTG configuration, the graph label,
    and the regular expression that includes all the monitored interfaces that should
    be included within the index. Because indexmaker writes to STDOUT, the output
    should be redirected to a file. Thus, the command,


    indexmaker cisco.conf “Summary of Interfaces” > backbone.html


    builds a master interface index for all the interfaces contained within the 10.0.2.75
    device using the file backbone.html. The new file, when displayed, should look
    similar to the window shown in Figure 7.5. It shows the daily graph for each interface
    and contains a link to each of the defined pages, which contain the remaining
    graphs for that interface.'
