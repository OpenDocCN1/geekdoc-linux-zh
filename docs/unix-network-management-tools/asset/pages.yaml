- img_proc: true
  md: '# TRACEROUTE Tool


    By default, traceroute sends a total of three probes, each with a different TTL
    value, to every hop. The first line of the output includes the destination along
    with the IP address, the default number of hops traceroute uses, and the size
    of the packets sent. The second line (with a l) displays the first hop encountered
    by traceroute (Figure 4.3a). Because vermeer is on a different network than monet,
    a router must be used to reach this system. Because the default router in this
    example is router-1, the first packet is sent. The first packet is an ICMP request
    with the TTL field set to 1. With IP, any packet that reaches the router decrements
    the TTL by 1, which makes it zero. When a router gets a packet and the TTL is
    zero, it is supposed to discard the packet and notify the sender with a TIME_EXCEEDED
    message back to monet. After this happens, traceroute measures the amount of time
    between when it sent the packet and when it obtained the reply. This is known
    as the round trip time in milliseconds (1000th of a second) as shown after the
    hostname and IP address information. This implies that the RTT of the first series
    of probe packets took 4.25 milliseconds (or .004 seconds) and the third series
    was 2.89 milliseconds (or .028 seconds).


    The second line details the second routing hop and shows that traceroute reached
    the destination system vermeer with slower RTT times than the first (see Figure
    4.3b). When the second probe was sent, the router decremented the TTL, and then
    passed this packet to the vermeer. Because the traceroute is attempting to access
    an unused port, vermeer responds with the PORT UNREACH-ABLE error. In fact, as
    a general rule on large (and some small) internets, performance between systems
    and networks will and can vary a significant amount from one moment to the next.


    There is no restriction on what constitutes a destination; it can be any kind
    of device that ranges from a simple host system to an Internet router. The only
    requirement is that it must support IP.


    # Reading Traceroute Output


    Due to variations and problems with router devices along certain paths, the general
    fluctuations of network routes can lead to unpredictable and strange traceroute
    output. As a result, certain'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'codes might appear after the timing information is displayed.

    These codes and their associated meanings are included in

    Table 4.14.


    # Table 4.14 Traceroute Display Codes


    | Code | Meaning |

    | --- | --- |

    | * | Indicates no response to probe packets |

    | ! | The TTL in the received packet is set to 1 |

    | !H | Destination host is unreachable |

    | !N | Destination network is unreachable |

    | !P | Destination protocol is unreachable |

    | !S | The source route option has failed. In practice, this shouldn’t happen
    and if it does, it indicates a bug or problem with the router that generated the
    error |

    | !F | Fragmentation was needed for a probe packet. In practice, this shouldn’t
    happen and if it does, it indicates a bug or problem with the router that generated
    the error |

    | !X | The path is blocked due to communication being administration disabled.
    In other words, the path is shutdown or blocked from a software standpoint |

    | !N | Indicates an ICMP error code where N is that number |


    Some of these display codes can come handy when debugging

    network problems. For example, if a destination (like www.whitehouse.gov) is not
    reachable by the system that is running the traceroute command,


    ```

    monet# traceroute www.whitehouse.gov

    ```


    will produce


    ```

    traceroute to www.whitehouse.gov (198.137.240.91), 30 hops max, 40 byte packets

    1 monet (10.0.2.126) 4.281 ms !N * 1.896 ms !N

    ```'
