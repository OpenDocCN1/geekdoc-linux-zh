  md: '# Management Information Base MIB


    Read-only MIB objects are not alterable by the network management system, but
    values may be obtained via a get or trap operation. Why would a change to a MIB
    object be prohibited? The reason is very clear: certain MIB information will never
    change during the life of a product. For example, the MIB object sysDesc, which
    stands for System Description, contains vendor information for the agent. An SNMP
    manager should not modify this information even if it can because it would disassociate
    the device with the actual product vendor, making agent identification difficult.
    Also, it could adversely affect the accuracy of any software-based inventory mechanisms.
    Another reason to make objects read-only is to ensure that accurate performance
    information or other statistical data remain accurate rather than altered unintentionally,
    which has the potential to provide incorrect information about the state of the
    network or device.


    Read-write access is necessary when a particular object must be altered to accomplish
    some specific goal or be configured in a certain way. For example, it might be
    necessary to disable a router port due to a large number of errors detected on
    one of its interfaces. In this case, the network management system must set the
    operational status of the interface to 0, shutting down the physical connection
    until the cause of the errors is determined.


    Objects defined as not-accessible within the MIB usually reference object definitions
    or other object descriptions that are not objects themselves.


    # Tables


    As noted above, a MIB may contain objects that represent physical characteristics
    or other information contained within an agent. These objects can either be in
    the form of discrete elements (i.e., individual objects like sysDesc) or, in some
    cases, two-dimensional tables. Tables are used to store related information that
    might contain several instances or copies of a MIB object. The best way to illustrate
