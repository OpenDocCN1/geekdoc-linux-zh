  md: '# TRACEROUT Tool


    # Table 4.15 Traceroute Operational Options (Cont’d)


    | Option | Description |

    | --- | --- |

    | -s | Use the specified address as the source address in transmitting probe packets
    |

    | -q | Set the number of probe queries |

    | -m | Set the maximum hops |

    | -d | Enable debug flag (SO_DEBUG) |

    | -F | Don’t fragment |

    | -t | Set the type of service (TOS) flag |

    | -w | Set the wait time for probe packets |

    | -x | Don’t calculate checksums |


    When traceroute is executed on a system that is multi-homed (i.e., a system that
    contains more than one network interface), it selects the first interface it encounters.
    Unfortunately, this might not be what you want because the destination are after
    can another interface. To address this issue, the i option can be used to force
    traceroute to send probe packets using the interface specified with this option.
    Thus the command


    traceroute -i hem0 traceroute: Warning: Multiple interfaces found; using 10.0.2.126
    @ hem0


    will cause traceroute to use the Fast Ethernet interface instead of the FDDI interface
    that it would normally use.


    In situations, the default TTL value of 30 is not enough to reach a destination
    that might contain a larger number of routes. When this occurs, traceroute will
    never reach the destination. In this situation, use the -m option to increase
    the hop count.


    When a traceroute to certain devices, it might sometimes fail, despite the fact
    that the path to the device is operational. Further, using the ping command against
    the device indicates that it is'
  merge: -1
