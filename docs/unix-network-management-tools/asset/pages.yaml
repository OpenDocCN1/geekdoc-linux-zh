    # NTOP


    # General Description


    The ntop program provides a way to determine the systems that are active on a
    network and the types of traffic sent and received by these systems. Network traffic
    is sorted by protocol and some of the most common network protocols are recognized,
    including TCP/IP and associated protocols. This tool also supports non-IP protocol
    types such as Decnet, IPX, AppleTalk, and others. A complete list of network protocols
    supported by ntop is found at the end of this section. This tool differs significantly
    from the snoop utility, because it concentrates on providing statistical data
    about network packets, not their contents. Also, ntop doesn''t require the use
    of a Web server; it supports the HTTP protocol internally.


    Why use ntop? First, it provides a quick and easy way to get an accurate snapshot
    of network activity without using a network probe or Sniffer device. In many cases
    a dedicated probe is necessary to trace-down network problems, but sometimes time
    is of the essence and ntop can be used in situations in which it is not possible
    to obtain a probe in a timely manner. Second, it might not be possible to attach
    a probe given certain network configurations, say between a pair of Unix systems
    interconnected via a WAN. In this situation, ntop can be used when deploying a
    probe might be very difficult, if not impossible. Third, where cost is a major
    consideration, purchasing probes will be far more expensive than installing a
    public domain software tool.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'On the negative side, there is no such thing as a free lunch! Running ntop
    across a number of systems does pose some problems. First, ntop places the interface
    in promiscuous mode, which means every network packet is being captured and, as
    a result, a significant processing load is placed on the system. To address this
    issue, care should be taken when running ntop. Setting up some automated mechanism
    may remedy any potential problems by ensuring that ntop is only run when necessary
    and, perhaps, not during critical times or peak system usage.


    Secondly, using ntop may further complicate security policies and procedures because
    unauthorized access to this tool could result in additional exposure of existing
    system vulnerabilities and security holes. Luckily, ntop has a rudimentary facility
    to protect the captured network information. It isn''t the most rigorous security,
    but it provides a reasonable amount of control. This will be discussed below.


    One of the most powerful features of ntop is that it provides two viewing modes:
    Web mode and basic ASCII terminal mode. This is a very unique feature and is one
    of the first public domain tools that successfully implement multiple robust interface
    capabilities. In the Web mode, a series of HTML pages are available to provide
    a number of network traffic statistics reports and additional network related
    information. In this mode, a standard Web browser is needed to view these reports
    and to support multiple simultaneous browser connections. This is a very handy
    feature when using ntop in a distributed network environment where access may
    originate from more than one location by different users at the same time. When
    a browser is connected to ntop, the main page shown in Figure 7.8 is displayed.


    For not wishing to use the Web interface, the second display mode provides terminal
    output similar to the Unix top command. In this mode, network information is presented
    in a constantly updated window, as shown in Figure 7.9. It contains a running
    status of network utilization sorted by network protocols. Several display options
    are available that can be used to toggle the information displayed and otherwise
    control ntop. The list of available keyword commands is described below.'
  merge: -1
