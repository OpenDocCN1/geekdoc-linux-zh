    # Overview of SNMP Versions


    SNMPv1, which accounts for the significant portion of the installed base of agents,
    has several fundamental problems. First, because it lacks a robust security mechanism,
    it can''t be used to its full potential. As a result, many vendors limit the set
    operations on agents to minimize the potential risk of a security breach. Second,
    SNMPv1 doesn''t handle large amounts of information, which also restricts the
    use of the SNMPv1 framework. Third, SNMPv1''s relationship of network manager
    and agent are well defined—agents play only a single, simplistic role of accepting
    commands from more superior management systems. This significantly limits SNMPv1
    when smart agents are needed to address specific requirements for distributed
    network management functions. To summarize, SNMPv1 provides:


    +   - The basic network management framework

    - Definition of the MIB-II standard

    - Descriptions of the Protocol Data Units (PDUs) that include: GetRequest, GetNextRequest,
    SetRequest, GetResponse, and Trap

    - Description of ASN.1 encoding language'
