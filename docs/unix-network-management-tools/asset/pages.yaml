    standard.


    # Protocol Primitives


    snoop provides protocol primitives as a shorthand way to select specific network
    traffic, without requiring the low-level protocol information. For example, the
    ip primitive can be used to capture all IP traffic. Without this keyword, you
    would need to use the IP type of x0800, which is harder to remember and use. These
    primitives support the TCP/IP, AppleTalk, and DECNet family of protocols. A list
    of these protocol keywords is in Table 4.10, along with a description and associated
    low-level numeric values expressed in hexadecimal.


    Table 4.10 Protocol Primitives


    | Primitive | Description |

    | --- | --- |

    | apple | AppleTalk protocol family |

    | arp | Address Resolution Protocol—includes both request and reply |

    | ethertype | Specifies another protocol type |

    | decnet | DECNet protocol family |

    | ip | Internet Protocol |

    | icmp | Internet Control Message Protocol—includes both echo and reply |

    | rarp | Reverse Address Resolution Protocol—includes both request and reply |

    | tcp | Transmission Control Protocol |

    | udp | User Datagram Protocol |'
