    network. This means all frames with a destination address of all 1 (255 in decimal,
    0xff in hexadecimal). The ether[1:4] indicates the first addressable byte of the
    frame (the destination address) and the 4 value specifies the length of this field.
    Despite the fact that Ethernet addresses are six bytes, we can'
