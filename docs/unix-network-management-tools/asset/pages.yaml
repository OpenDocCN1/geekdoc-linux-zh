    from monet will be displayed. To identify another system, obtain the datalink
    address of the system, convert it to hexadecimal, and place it on the right-hand
    side of the command above.


    # Miscellaneous Primitives


    A few additional primitives are also available from snoop that can''t be classified
    as either address or protocol primitives. These include the following:


    +   greater

    less

    length


    The greater and less primitives are used in conjunction with other snoop commands
    to filter, based on the total length of the packet. For example, to display all
    packets that are greater than 56 bytes, invoke the greater 56


    ```

    # snoop greater 56

    ```


    To display all packets that are less than 60 bytes, use the less primitive:


    ```

    # snoop less 60

    ```


    Why use the greater or less commands? The primary reason is to search for packets
    based on size, rather than content. Another primitive, length, can also be used
    to handle capturing packets based on their exact size. The length can be used
