- img_proc: true
  md: '# NTOP


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_342_0.png)


    Figure 7.15 Active TCP Sessions Report.


    The Client Port column shows the remote system and TCP port used, which represents
    the remote end of the connection. The Server Port column, which is the local end
    of the connection, also shows the system and TCP port. In Chapter 2, “Simple Network
    Management Protocol”, we discuss how a TCP connection consists of four items:
    the remote IP address, remote port, local IP address, and remote port. With this
    report, we can observe the state of each connection. This is found in the State
    column and provides the current state of all TCP connections. The title for this
    report is a little misleading, because it suggests that only active sessions will
    be displayed. This report also includes those connections for which termination
    is pending. Note, in this example, that there are a number of sessions in the
    TIME_WAIT state. This state is entered after either side of a TCP session has
    been terminated. The large number of sessions in this state is due to the HTTP
    activity on this system. Because HTTP uses a large number of TCP connections,
    it is also not uncommon to have many outstanding TCP connections pending termination
    on a Web server.


    The Data Sent and Data Recvd columns show the amount of data, expressed in bytes,
    kilobytes (Kb), or megabytes (Mb), that was sent/received by the connection. The
    Active Since field shows'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'when (data and time) the connection was first initialized. Also, the Duration
    field shows how the long connection was active. It is interesting to note that,
    when a connection is not active anymore from a TCP standpoint (it''s in TIME_WAIT
    mode, for example), the duration increases until the connection is fully terminated
    and no longer appears on the report.


    Also note that, when possible, ntop displays the application name of the service
    instead of just the TCP port itself. For example, the report shows that several
    TELNET sessions were active between the services durer and rembrandt. The report
    displays the port as telnet, and not the normal port number associated with the
    TELNET application (i.e., 23). The reason ntop can do this mapping is that it
    looks up each of the TCP ports it finds and searches the /etc/services file for
    an appropriate match.


    # IP Protocol Distribution Report


    One of the most useful of all the ntop reports, the IP protocol distribution report
    shows the breakdown of usage by higher-level protocols. It reveals the amount
    of data (sent/received) by protocol type, such as SNMP or FTP, as shown in Figure
    7.16. This is an important observation, because this report clearly shows which
    applications are used the most in comparison with those used. The report contains
    three tables that include protocol distribution for Local Traffic, Remote to Local
    Traffic, and Local to Remote Traffic. Each section or table contains three columns,
    IP Protocol, Data, and Percentage. The IP Protocol column includes the higher-level
    protocols that ntop understands. Those protocols that ntop does not support are
    listed under the Other IP category. Each protocol has associated Data and Percentage
    columns, which relate to the amount of data, expressed in bytes and as a percent
    of data, in comparison to each of the other protocols.


    Using the bar graphs contained within this report, it is relatively straightforward
    to identify network utilization by protocol or network application. For example,
    observe the second table that, out of all the IP traffic displayed, UDP usage
    is by far the most significant.'
