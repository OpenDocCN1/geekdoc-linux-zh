    # Source Quench


    The source quench within ICMP provides a way to handle congestion at the IP level.
    Congestion within a network can be caused by several factors. However, one primary
    cause is when several systems begin transmission of data that flows through a
    single router as shown in Figure 3.14. In this case, the router itself is overwhelmed
    by the combined traffic. Another cause of congestion is when a more powerful computer
    system is transmitting data to a less powerful system that cannot keep pace. If
    these situations go unchecked, eventually the router and under-powered system
    will begin to discard packets, which in turn will cause TCP to retransmit them,
    thus making the situation worse. In this case, the router and smaller system simply
    emit a source quench message, which indicates to the sender that it should stop
    sending data. As a result, the router and smaller system have time to process
    any outstanding packets.


