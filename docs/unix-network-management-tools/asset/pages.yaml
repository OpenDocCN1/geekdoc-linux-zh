- img_proc: true
  md: '# 318


    # Chapter 07 / Web Enabled Network Management


    cates frames that were dropped due to processing constraints or fil-tering criteria.
    The Total Traffic field indicates the total amount of data that was read from
    the interface. This is the sum of both IP and non-IP traffic. The Total IP Traffic
    field shows the total amount of IP-based traffic, which will include, for example,
    all upper-level protocols such as ICMP and TCP. The non-IP Traffic statistic includes
    protocols such as IPX, AppleTalk, and others. Thus, if we have a mixed network
    of both IP and AppleTalk protocols, this field will be non-zero and contain the
    AppleTalk traffic portion. Actual Throughput measures the observed performance
    of the interface (packet reception), while Max Throughput is indicative of the
    theoretical performance based on the type of interface (such as 10 Mbit/s)


    The second half in Figure 7.12 shows the total IP traffic sorted by protocol.
    The right is the protocol type with the total amount of data for that protocol.
    The left-hand side includes the visual representation of the data as a percent.
    The percentages include both TCP and UDP traffic. When viewed within the browser,
    the TCP usage is light blue, while the UDP traffic is light pink. For each TCP-based
    protocol, the amount of traffic is represented by the number and a graphical bar
    chart.


    # Host Information Report


    This report provides additional information pertaining to the hosts: Host found
    on the network. It includes Host Name, IP Address, MAC Address, and Nw Board Vendor.
    Figure 7.13 contains a sample of this report. If the IP address of a host cannot
    be mapped to a hostname, the IP address is used in the Host Name column. This
    is the reason why some of the entries contain both hostname and IP addresses.
    The IP address field is self-explanatory and the MAC Address column (media access
    control) contains the hardware address of the host interface that sent/received
    network traffic. The final column contains the vendor of the interface hardware
    as derived from the last three bytes from the MAC Address field.


    Notice the entries in the Host Name column are underlined. This is because they
    represent a link to another ntop. This report provides additional information
    about the host that includes more detailed traffic information, IP history, and
    the current TCP ses-'
