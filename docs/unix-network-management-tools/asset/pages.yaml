- img_proc: true
  md: '# Table 4.12 Display Options List


    | Option | Description |

    | -A | Show addresses of targets rather than hostnames |

    | -Q | Like the -q option, but shows summary results information every n seconds.
    Unfortunately, this command doesn''t seem to work |

    | -a | Show systems that are alive and reachable, given a list of targets on the
    command line |

    | -d | Show hostnames of targets instead of addresses. This is the reverse of
    the -A option |

    | -e | Show round trip times from packet was sent to receipt of reply |

    | -q | Quiet mode. Don''t display any results, but set the exit return status
    |

    | -u | Show systems are not alive, given a list of targets on the command line
    |

    | -v | Displays command version information and email address to send comments
    and bug reports to |


    One of the especially useful features of fping is that, given a list of targets
    following the -a option, it will display the systems that are reachable. For example,
    consider the following command:


    ```

    # fping -a verme monet rodin louvre

    monet

    rodin

    louvre

    ```


    The hosts monet, rodin, and louvre are displayed—indicating that they are alive—while
    vermeer was not displayed because it didn''t respond.


    Conversely, the opposite list can be displayed with the -u option. In this case,
    the hosts that don''t respond are displayed:


    ```

    # fping -u vermeer monet rodin louvre

    vermeer

    ```'
  merge: -1
  pgno: 165
