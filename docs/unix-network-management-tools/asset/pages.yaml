    # Stream Abstraction Interface


    From the application layer standpoint, TCP provides a buffered byte-oriented interface
    between two applications or processes. The data transmitted from the source entity
    is exactly the same information the destination receives. For example, if the
    sending entity transmits the message "hello world" the destination would receive
    "hello world." As it turns out, this is a very useful and convenient feature for
    developing networking applications and services. Also, the TCP stream is buffered,
    which means that applications have more flexibility when it comes to processing
    the data from the network.


