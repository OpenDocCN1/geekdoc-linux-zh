    GetBulkRequest

    This PDU is issued by an SNMPv2 manager or application to minimize network interaction
    and permit the agent to return larger size packets (as compared to the GetNextRequest
    or GetRequest), improving the efficiency of obtaining a large number of objects
    from the agent. This uses the same PDU format as most other SNMPv1 operators.
    The only difference is the re-naming of the Error-status and Error-index (from
    the Response PDU) fields to non-repeaters and max-repetitions, respectively. These
    fields are defined as follows:


    +   - Non-repeaters: The number of MIB objects that should be retrieved once at
    most.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '* Max-repetitions: The maximum number of times other MIB objects should be
    retrieved.


    InformRequest

    The InformRequest PDU is issued by an SNMPv2 entity acting in a manager role to
    another SNMPv2 entity acting in the same role for the purpose of providing network
    management information. The major function of this PDU is to provide distributed
    SNMP management capabilities. Thus, an agent can implement this PDU to provide
    management-like services and functions. The format of this PDU is the same as
    the GetRequest and other related PDUs.


    # SNMP Response Codes


    The error codes returned from an SNMPv1 agent were very limited. For example,
    if an SNMP manager requested the set operation on a MIB object and the agent couldn''t
    perform the set as requested, the agent would reply with noSuchName. With the
    addition of more error codes in SNMPv2, the agent would reply with notWritable
    in this situation. The complete list of SNMP response codes is included in Table
    2.5.


    Table 2.5 SNMP Response Codes

    | Response Code | Description |

    |---|---|

    | SNMPv1 | |

    | tooBig | Returned by the agent if the response to a request would be too large
    to serve |

    | noSuchName | Returned by the agent in either of these two cases: 1, if a set
    operation is attempted for an object that is not in the MIB view or 2, if a set
    operation is attempted for an object that is in the MIB view, but its object is
    read-only. This code is now used for proxy compatibility |


    (Cont''d)'
