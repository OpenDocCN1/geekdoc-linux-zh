  md: '# UCD Agent Package Information


    +   * mibs

    * ov

    * s

    * snmpplib

    * win32


    The agent, apps, local, m, and s directories contain source code, shell scripts,
    and header files, which constitute the bulk of the package. In particular, the
    apps location contains the source for all the SNMP tools (such as snmpget and
    snmpset) and the agent location is where the SNMP agent and trap handler source
    files (snmpd and trap) reside. The snmpplib directory contains the source to the
    SNMP APIs. The mibs directory contains a list of MIB files that the agent supports
    and the ov directory contains files that are used for integration into the HP
    OpenView software package. The etc directory contains the agent configuration
    needed to implement SNMP security. The win32 directory contains source code and
    Dynamically Loadable Library (DLL) modules of the UCD agent and applications for
    the Windows 95/NT system.


    Before attempting to install and compile the UCD package, you will need the following:


    +   * C compiler (gcc, for example)

