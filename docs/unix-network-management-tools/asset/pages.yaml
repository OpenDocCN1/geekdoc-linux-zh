    Miscellaneous Ping Options


    With the -n option, ping displays IP addresses rather than hostnames. This is
    useful, for example, when network problems involving DNS impact the use of ping.
    This option instructs ping not to invoke hostname resolution, permitting the tool
    to function while the name service is slow or temporarily disabled.


    The -R option enables the route option with the IP protocol. Toggling the route
    record informs each router along a path to place its IP address in the IP header.
    As a result, a list of routers that were used to reach the final destination is
    obtained.


    # SNOOP Tool


    Tool Availability


    > This command is available only on the Solaris operating system.


    General Description


    The snoop command is a general-purpose network traffic monitor that can be used
    to capture and display packets and their contents. This command can be used as
    protocol analyzer, providing one of the best ways to investigate communication
    problems among systems and networking devices. Most of the time network troubleshooting
    is centered on dealing with network configuration problems. Every now and then,
    however, you will be faced with a protocol-related problem and will be forced
    to delve into the heart of the particular protocol to resolve the problem.


    The packets scanned will be displayed with information in either a short or long
    form depending on the command line options provided. Also, snoop has a very powerful
    filtering mechanism that can be used to search for packets that match a specific
    criterion.'
