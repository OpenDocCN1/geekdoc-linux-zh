  md: '# Chapter 04 / System Utilities and Tools


    examined. These problems and tasks represent the kind of real world challenges
    that network support personnel face every day.

    The snoop command will be used to accomplish the following:


    +   - Determine who is causing broadcast storms


    +   - Determine who is polling your critical devices via SNMP


    To determine which systems are causing broadcast traffic, using the following
    command:


    ```

    snoop "ip[19]&0xff = 0xff"

