  md: '# Chapter 06 / Simple Network Management Protocol


    on obtaining object values from an SNMP agent. However, this tool is used to alter
    modifiable MIB agent objects. The ability to alter a MIB object is profound in
    its implications, because doing so changes the configuration or operating state
    of a managed agent. Consider, for example, a router with several interfaces that
    serve as remote connection points between important distant office networks. A
    single snmpset command executed against one or more of the interfaces on this
    router could sever the connectivity between the local network and the remote office(s).
    Because the snmpset command is powerful, caution should be exercised when this
    command is used on an active network.


    The basic syntax of the snmpset command is:


    ```

    snmpset [common arguments] MIB-ObjectID type value [MIB-ObjectID type value]

    ```


    The MIB ObjectID is the MIB object that will be given a new value. The type argument
    represents the type of object that should be altered and the value represents
    what the new value of the object should be changed to. The type is a single character
    that represents object types that were derived from the types found in the ASN.1.
    The types supported by snmpset are listed in Table 6.6.


    Table 6.6 snmpset Object Types


    | Character | Object Type |

    |---|-|

    | i | INTEGER |

    | s | STRING |

    | x | HEXADIMAL STRING |

    | d | DECIMAL STRING |

    | n | NULL OBJECT |

    | o | OBJECTID |

    | t | TIMESTICKS |

    | a | IPADDRESS |'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# UCD Commands


    There are legitimate reasons to use the snmpset command; a few of them are listed
    below:


    +   - To disable or enable a network interface


    +   - To update a device with new administration information (sysContact, for
    example)


    +   - To reset certain counters


    +   - To restart a device or agent


    +   - To modify some configuration parameter


    You may recall an earlier scenario in which a disabled interface caused a network
    problem. There are also situations when not disabling an interface can cause a
    network problem. For example, during a broadcast storm or when a hacker is attempting
    to penetrate the network, shutting down a network or interface might be the only
    way to prevent the problem from spreading to other parts of the network. However,
    before resorting to turning off interfaces, watch out for the *set of no return
    syndrome*. Consider the sample network found in Figure 6.1 on page 260.


    In this sample network, we have two routers, R1 and R2. Our only access to R2
    is via router R1, serial1 interface. From device Node A, we use an snmpset command
    to disable the serial0 interface from R2. This stops the broadcast storm, but
    it also causes a connectivity loss from the remote office. The problem is then:
    How do we enable the interface on R2 after the broadcast storm has been fixed?
    The *set of no return* means that access to the device has been cut off from the
    only means of access. Remote access to the router has been lost, unless some dial-up
    capability can be used. In this case, the port must be enabled from the local
    side, which could require instructing someone to enable the port or reboot the
    device to reset the port.


    The best solution to avoid the *set of no return* mentioned above is to disable
    the local serial1 interface on R1 or the remote ethernet1 interface of R2. This
    way, the broadcast problem is contained, and we still maintain access to the devices.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '![](img/0790df3a82cfb96e70cab5a9d94c0bd0_279_0.png)


    **Figure 6.1** Example of "Set of no return."


    To disable a serial10 interface on router R1, a modification of the ifOperStatus
    object must be made. This includes setting the object to zero (0) to disable the
    interface from an administrative perspective, disabling the flow of traffic to
    and from this interface.


    snmpset monet private interfaces.ifTable.ifEntry.ifAdminStatus.2 i 0 interfaces.ifTable.ifEntry.ifAdminStatus.3
    = 0


    Other MIB objects that are read/write may also need to be modified. For example,
    consider the sysContact and sysLocation objects. Let''s assign new values to these
    objects using a single snmpset command:


    ```

    snmpset cisco-gw10 private system.sysContact.0 s "NCC Support" \

    system.sysLocation.0 s "3rd Floor Closet"

    system.sysContact.0 = NCC Support

    system.sysLocation.0 = 3rd Floor Closet

    ```'
