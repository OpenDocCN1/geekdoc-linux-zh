  md: '# Loading ARP Bindings Using a File


    The ARP command also supports the ability to add bindings that are defined within
    a regular file instead of specifying the information on the command line. This
    method is used, for example, to load in a list of ARP entries together. It is
    not uncommon, for example, for a series of ARP bindings to be loaded during normal
    system startup procedures—especially if the system doesn''t support distributed
    database lookup schemes as NIS. The format of a file used for this purpose includes
    the following fields:


    ```

    hostname datalink address [ temp ] [ pub ] [ trail ]

    ```


    Using a text editor, you can create a list of ARP bindings using the format above
    and save it to a text file—for example /etc/arp-list. A sample file listing is
    shown below.


    ```

    bruegel 08:00:20:be:05 temp

    rubens 08:00:21:ce:01 temp

    rembrandt 08:00:26:fe:02

    cezanne 08:00:21:bb:01

    michehelangelo 08:00:24:ee:02

    ```


    Notice that bruegel and rubens contain the temp keyword, which indicates that
    these entries will be deleted from the ARP table after they expire. In practice,
    the temp option is not used because it might be undesirable for these bindings
    to expire and be removed from the cache. The pub keyword is used to publish the
    ARP binding to the network. The trail option is primarily used to indicate that
    trailer encapsulation is supported by the host. However, trailers have not been
    widely implemented and are obsolete on Sun systems; this option, for all practical
    purposes, can be ignored.


    After the file contains the desired entries, use the -f option of the arp command
    to load the contents of the file into the ARP table as shown below:


    ```

    # arp -f /etc/arp-list

    ```


    Should you wish to load this table automatically, edit one of the system startup
    files (/etc/init.d/inetsvc, for example) and include (see listing 4.1) the following
    entry:'
  merge: -1
  pgno: 113
