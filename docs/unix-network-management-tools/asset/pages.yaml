  md: '# Object Types


    Within a MIB, different object types are used to represent data structures or
    values contained in an agent. The agents can represent physical agent attributes,
    configuration information, or other data. These object types are derived from
    the Abstract Syntax Notation (ASN.1) standard rules. ASN.1 provides a detailed
    mechanism for the implementation and encoding of basic data types that are machine-independent
    and can be transmitted over the network in an unambiguous way.


    Why is this important to SNMP or network management? Because network management
    must address a heterogeneous network environment, a standard way must be provided
    to ensure that SNMP messages can be transmitted and understood by different systems
    and devices. Because various computer platforms store information differently,
    ASN.1 provides a common format. For example, an integer on one system can be expressed
    with the most significant digit first, while on others it can be the least significant
    digit first. Also, ASN.1 data types are found in MIBs, and for us to understand
    network management, we must be able to read and understand MIB objects. Without
    a good grasp of MIBs, it will be difficult to use SNMP tools and software to manage
    a network effectively.


    Two object data type classes are defined using ASN.1:


    +   * Universal Types

    * Application Types


    The universal class consists of primitive types that can be used to build additional
    data types of objects within a MIB. Table 2.1 defines the available simple data
    types found in the universal class: SNMP derives some application data types from
    the universal class type. These application types are used to further define additional
    types that can be used to represent specific values customized for within the
    network management environment. Table 2.2 describes the application data types
    that are presently available in the application class.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Management Information Base (MIB)


    # Table 2.1 Universal Data Types


    | ASN.1 Data Type | Description |

    |---|---|

    | INTEGER | A data type representing a cardinal number where no limitation is
    made to the level of precision that might be required to represent an integer
    value |

    | OCTET STRING | A data type representing zero or more octets where each octet
    may take any value from 0 to 255 |

    | NULL | A data type meant as a placeholder, but currently used |

    | OBJECT IDENTIFIER | A data type representing an authoritatively named object
    that consists of a sequence of values that specify a MIB tree |

    | SEQUENCE SEQUENCE OF | A data type used to denote an ordered list of zero or
    more elements that contain other ASN.1 types. SEQUENCE OF contains an ordered
    list of the same ASN.1 type |


    # Table 2.2 Application Data Types


    | ASN.1 Data Type | Description |

    |---|---|

    | IpAddress | Represents an OCTET STRING that has a length of 4 bytes (32-bits)
    and each of the four octets relates to the four bytes of a standard IP address
    |

    | NetworkAddress | Can represent an address from one of several network protocol
    address standards. Presently, it is the same as IpAddress |'
