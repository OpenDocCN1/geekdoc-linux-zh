- img_proc: true
  md: "# Listing 4.4 Sample FPING Script\n\n```\n```bash\n#!/usr/bin/ksh\n# Simple\
    \ Script to notify user\n# systems are down\n\nFILE=$1\nFPINGCMD=`fping -u $FILE`\n\
    MAIL=/bin/mailx\nUSER=root\n\nif [ \"$FPINGCMD\" != \"\" ]; then\n    $MAIL -s\
    \ \"down system(s)\" -u $USER $FPINGCMD\n```\n```\n\nThis script runs the fping\
    \ command against the hosts included in the specified file and, if any devices\
    \ contained in the file can't be reached, the user root is sent mail. Obviously,\
    \ a more robust and elaborate script could be written, but the point here is that\
    \ fping can be used to help automate some small network management tasks.\n\n\
    On special occasions, it might be necessary to manipulate IP addresses directly\
    \ rather than hostnames as in the previous examples. When given a list of hostnames,\
    \ it would be nice to return IP addresses. The -A option directs fping to display\
    \ IP address information instead of the hostname. So, in this example, we process\
