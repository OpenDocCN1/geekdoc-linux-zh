  md: '# 22 Chapter 02 / Simple Network Management Protocol


    RFCs was written, which later became known as SNMPv3. These RFCs (2271-2275) have
    been put forth by the IETF as Proposed Standards, which means that they are available
    to the general public for review and discussion. SNMPv3 is SNMPv2 plus provides
    for robust security and administration; it draws upon SNMPv2c RFCs (1902-1908).
    At a high level, the SNMPv3 proposals to:


    +   - Put a security model based on DES, MD5, and other authentication protocols

    - Define a view-based access control model

    - Redefine some of the SNMP concepts and terms


    # Management Information Base MIB


    As previously mentioned, the MIB is a storehouse of information related to the
    configuration and performance data contained within an agent. MIBs have an organization
    and common structure and may contain a large number of objects separated into
    groups.


    # Organization


    MIB objects are organized in a hierarchical tree structure in which each branch
    has a unique name and numeric identifier. Figure 2.2 shows the standard MIB organization
    from the root to additional branches. The branches of the tree serve as a logical
    grouping of related objects. The leaves, or nodes as are often called, represent
    individual objects. Also, sub-trees are formed and represent both intermediate
    branches and additional leaves. By using this structure, an SNMP manager (or MIB
    browser tool) can drill-down into the MIB in an easy, yet concise manner. MIB
    browser is a piece of software that traverses a MIB tree, showing a graphical
    display of branches and leaf objects.


    Objects within a MIB can be referenced by specifying each of the numeric identifiers
    starting with the top of the tree (or root) and proceeding to the individual leaf
    or object. This access method is also consistent with that of referencing files
    within the Unix operating system. However, one key difference is that Unix pathnames
    can be expressed in absolute or relative terms. MIB objects'
  merge: -1
