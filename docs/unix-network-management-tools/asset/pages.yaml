- img_proc: true
  md: 'Using ifconfig, the following information can be changed for an interface:


    +   - IP Address

    - Network Mask

    - Broadcast Address

    - Datalink Address

    - MTU


    The IP address is specified in the normal dotted decimal notation and represents
    the unique address for the host on the network to which the system is attached.
    The network mask (netmask) specifies the mask used to calculate the network and
    host portions of the IP address. The broadcast address is used to specify the
    IP address to which broadcast packets should be directed. The datalink address
    represents the unique low-level hardware address used in the networking protocol,
    such as Ethernet or FDDI, and is associated with the hardware itself. The maximum
    transmission unit (MTU) denotes the maximum message size that the interface can
    handle. The standard message size for Ethernet is 1500; FDDI is 2048. The MTU
    is rarely modified and, when it is, generally can''t be configured to support
    higher values than what was just listed; only lower values may be used.


    Let’s suppose that the IP address of a system must be changed because the system
    is moved to a different subnet. In this case, the netmask and broadcast information
    remains the same. The move to the new network involves changing the IP address
    of the interface only. The old IP address is 128.197.9.10 and the new IP address
    is 128.197.10.1. The following command would be used to change the network information
    on the fly:


    ```

    # ifconfig le0 128.197.10.1

    ```


    To make this change permanent, we are required to modify /etc/hosts file. This
    file contains the mapping between hostname and associated IP address. On system
