  md: '# Sample MIB Object Listing


    Because MIB objects are an important component of network management, some of
    the chapters in this book specifically describe MIB objects as they relate to
    system agent and management tools. Therefore, when discussing these objects, a
    common format has been selected as shown below.


    +   **Object Name:** agentDescr

    **OID:** sunSystem.1

    **Object Type:** DisplayString [255]

    **Access Mode:** read-only

    **Description:** A description of the SNMP agent, which it uses to identify itself
    to other entities such as an SNMP manager. The agent assigns the string value
    of: Sun Microsystems SNMP Agent


    The MIB format includes the object name, OID string, object type, access mode,
    and description. The object name is the name used when querying an agent for this
    particular object. In this example, the agentDescr object is a string that contains
    a general description of the Sun system agent. The object identifier (OID) shows
    which group the object is contained in and its logical position in group. In this
    case, it is the first object in the system group. The sunSystem is a group within
    the Sun MIB. The object type is DisplayString and can be as long as 255 characters.
    The access mode indicates how the manager or other tool may manipulate the object.
    It is very common for new to SNMP attempt to alter read-only objects. The description
    field provides an overview of the object, its significance, and its sample value.


    # SNMP Communities


    Often, a network management system will be deployed in a large network environment
    that contains a collection of many different groups of networks and devices. Thus,
    it is reasonable for an enterprise network to be divided into zones or communities
    of users in order to partition responsibility. As a result, a community name can
    be assigned to a class of devices that provide a security boundary that helps
    to implement the desired communities or'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Management Information Base (MIB) 33


    zones. SNMP supports this kind of security model based on community string information,
    which is physically added to each device within the selected community. Some practical
    examples include selecting a community that represents all the Cisco backbone
    routers and another community that includes devices in just the sales department.


    SNMP present community-based authentication model is considered very weak and
    poses a significant security problem. The major reason is that SNMP doesn''t provide
    any encryption facilities or other mechanisms to ensure that the community information
    is not simply copied from the network during an SNMP packet exchange. Using a
    packet capture tool, the entire SNMP packet could be decoded, revealing the community
    name. As a result of this limitation, many sites disable set operations to many
    of the agent devices. This has the unfortunate side effect of limiting SNMP usefulness
    because it can then only monitor object values and not alter them.


    # SNMP Protocol Operation


    The format of an SNMP message contains three major components: a version field,
    a community field, and an SNMP protocol data unit (PDU). Unlike TCP/IP protocols,
    SNMP packets are not fixed length and, instead, rely on ASN.1 formatting. This
    basic SNMP structure is shown in Figure 2.4.


    | INTEGER | OCTET | SEQUENCE |

    |---|---|---|n| Version | Community Name | SNMP Protocol Data Unit |


    **Figure 2.4** SNMP Message Format.


    *Version:* This field is used to indicate which version of the SNMP protocol is
    being used. Presently, version 1 is the most widely implemented and supported
    SNMP protocol.

    *Community Name:* The community is used as the primary security mechanism to establish
    authentication from a network manager to agents within SNMP. The community name
    or string is used as a password for which requests to access objects are permit-'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'ted, based on the condition that the network manager knows the agent''s password.
    If the agent has been configured to emit traps, an authenticationFailure trap
    is generated when a network manager queries an agent with an invalid community
    string.


    Protocol Data Units: SNMPv1 PDUs can be one of five different types and consist
    of request and response components. They include:


    +   * GetRequest

    * GetNextRequest

    * SetRequest

    * GetResponse

    * Trap


    SNMPv2 defines these additional PDUs:


    +   * GetBulkRequest

    * InformRequest


    Each of the GetRequest, GetNextRequest, and SetRequest components elicits a GetResponse
    from the responding agent that might contain valid data or an error status.


    # GetRequest


    The GetRequest PDU is issued by an SNMP manager or applicant to obtain one or
    more MIB object(s) from an SNMP agent. Figure 2.5 on page 35 shows the packet
    format that contains the following fields:


    PDU Type: Indicates the PDU type is a GetRequest.

    Request-id: Unique identifier that permits the SNMP manager to matched paired
    requests and responses. It also serves to aid in detecting duplicate messages
    that may be received when using an unreliable transport service.


    Variable-Bindings: A list of requested MIB objects.


    The GetRequest command is the primary way to obtain information from agents when
    the objects in question are known beforehand. For example, should the network
    manager decide to'
