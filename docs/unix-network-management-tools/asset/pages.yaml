  md: '# Installing the NTOP Package


    The installation procedures for the NTOP software are included below. Please note
    that these instructions are based on using the 1.0 version of this package on
    the Sun Solaris platform. This package contains only the binary for the Solaris
    system. If you will be installing a newer version, these procedures may not be
    accurate or complete. In this case, consult the installation instructions that
    accompany the NTOP distribution.


    +   1. Obtain the NTOP package from the site above or from the CD-ROM available
    with this book.


    +   2. Uncompress the archive:


    ```

    gunzip ntop-1_00-solaris-sparc.gz

    ```


    +   3. Use the Solaris pkgadd program:


    ```

    pkgadd -d ntop-1_00-solaris-sparc

    ```


    +   4. Step #4 causes the /opt/ntop/bin to be created. This is where the ntop
    binary has been placed.'
