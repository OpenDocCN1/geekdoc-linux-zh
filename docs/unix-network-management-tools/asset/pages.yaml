    # Operational Options


    The operational arguments are listed in Table 6.3, and like the display options,
    each are available. However, please note that not of them are described below.
    For instance, the -c option is used to define the clock values with SNMP v2 authentication
    messages. Because this is not a critical function for using the UCD tools, it
