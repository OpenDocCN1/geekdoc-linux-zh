    The ARP entry is set up as permanent unless the option is specified on the command
    line. Permanent indicates that the mapping will not expire the normal ARP mappings
    do. Unfortunately, permanent bindings are not saved across reboots.


    To understand why modifying the ARP table is restricted to the super-user, consider
    that static ARP entries are defined, no direct link exists between this information
    and the actual devices attached to the network. For example, the bruegel entry
    was added manually, but no mechanism is available to ARP to ensure that the physical
    address is indeed correct. The arp command assumes the information provided is
    accurate and that the device is actually attached to the network. Therefore, if
    normal users had the ability to modify the ARP table, more errors would likely
    lead to loss of network connectivity. Should the physical address field of a critical
    network resource (like a server) be incorrectly changed, all communication between
    the local system and the critical system would stop.


    Proxy ARP Services

    The ARP command can be used to support proxy ARP services. Proxy ARP is a way
    to respond to ARP requests on behalf of another network device. Typically, this
    configuration is used to support devices behind a router or a specialized configuration,
    such as those required for remote dial-up access strategies.'
