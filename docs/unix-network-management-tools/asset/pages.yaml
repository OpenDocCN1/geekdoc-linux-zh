    ```


    To remove a logical interface, use the unplumb keyword command.


    # Ensuring Interface Changes are Permanent


    As previously implied, interface changes made with ifconfig on the command line
    will not persist across reboots. As a result, if you want modifications to the
    datalink address or opera-'
