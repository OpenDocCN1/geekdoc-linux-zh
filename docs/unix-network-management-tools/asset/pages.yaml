  md: '# Chapter 07 / Web Enabled Network Management


    The first three items were already discussed. The Host Location indicates that
    this host is contained within the subnet that ntop is monitoring. That is to say,
    the interface that ntop is monitoring from is on the same network as the host.
    Why is this important? It helps to know if this host is local or remote from the
    perspective of ntop, that the additional information ntop reports is interpreted
    correctly. For example, the Data Sent Stats gives a graphical representation of
    the percentage of both local and remote traffic. This is very useful because it
    can be used to determine traffic patterns across an internet. In the case of the
    report shown above, approximately 90% of the traffic is local. Local traffic is
    blue and remote light pink when displayed on a color monitor. If this situation,
    for example, had been reversed, and 90% of the traffic was remote, it might be
    necessary to move durer to another remote network or limit access to this system
    from the remote location. Total Data Sent represents both the number of bytes
    and number of packets transmitted from durer.


    The Total Data Sent is a combination of broadcast and multicast in both bytes
    and number of packets sent. This is a true measure of what this transmitted to
    the network, regarding the final destination of the information. The Broadcast
    Pkts Sent statistic, as its name suggests, indicates the number of packets that
    used the broadcast address (255) to transmit packets. This includes both IP and
    datalink broadcast packets. These types of packets are used to send information
    to all local devices on the network. The Multicast Pkts Sent field represents
    those packets used with the multicast address as 224.0.0.1. As you can see, no
    packets were used to support this kind of network traffic. Total Data Rcvd shows
    the number of bytes and number of packets received by this system. The Data Received
    Stats field indicates that all received traffic was local to the system.


    The IP Session section of the report includes this host was involved. In this
    case, both TCP and UDP traffic were recorded. The report also provides additional
    details about the higher level protocol that was involved in the network activity—that
    is, higher than either TCP or UDP. As you can see, both FTP and ROUTE services
    are listed and additional information regarding these services is provided. In
    the first table, the FTP'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'activity shown includes the number of sessions (times) that service was active,
    the bytes sent/received, timestamp information, and which other systems (Peers)
    were involved in FTP sessions. In this example, both FTP sessions included the
    host rembrandt.


    The other table contains the same information, but notice that the peer is labeled
    as <broadcast>. The reason the peer of this service is the broadcast address because
    the service is the Unix routed command. The normal behavior of the route command
    is to transmit routing protocol information periodically on the network. This
    is why the number of sessions is relatively large. The fact that routed is running
    on this system should be no surprise because, when a system contains two network
    interfaces, IP routing is enabled by default.


    The Active TCP Session section is also included within this report and is described
    in detail below. However, the only difference between this report and the main
    report is that this is a subset of the main report.


    # Local and Remote Report


    The next three reports display IP traffic that is remote to local, local to remote,
    and to local from the perspective of ntop. Each of the reports shares the same
    general report layout and format. These reports—R->L IP Traffic, L->R IP Traffic,
    and L<->L IP Traffic—show the following details:


    +   - Hostname


    +   - IP Address


    +   - Data Received/Sent


    +   - Total Traffic


    +   - Data Received/Sent


    +   - Bandwidth


    Figure 7.14 shows a Remote to Local IP Traffic report only. Like the other graphs,
    these graphs list specific hostnames and IP address information. Also, they provide
    links to obtain additional host information as described previously. They also
    include two separate tables, one showing the individual traffic for each host,
    the other showing the totals for all hosts combined. In the first'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 322 Chapter 07 / Web Enabled Network Management Tools


    table, the Data Received and Data Sent statistics both contain two columns. The
    first column shows the amount of data that was either received or sent by each
    system and may be expressed in bytes, kilobytes (Kb), or megabytes (Mb). The second
    column shows the amount of traffic as a percent for all hosts listed in the table.
    The second table contains the Total Traffic column, which is a summary of both
    the Data Received and Data Sent columns from the first table. The next two columns,
    Data Received and Data Sent, are the sum of the columns with the same name in
    the first table. The Bandwidth column lists the effective bandwidth utilization
    as a result of the network traffic monitored.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_341_0.png)


    Figure 7.14 Remote/Local IP Report.


    # Active TCP Sessions


    The Active TCP Session report includes much of the information that can be obtained
    from the netstat command. However, it provides a much easier format in which to
    review the information as displayed in Figure 7.15. In general, it provides a
    way to view the state of all TCP-based connections from both a client and server
    perspective. This report contains the following information:


    +   * Client/Server Port Numbers

    * Data Sent/Rcvd

    * When the Connection was Initiated

    * Duration of Connection

    * State of Connection'
