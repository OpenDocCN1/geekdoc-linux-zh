    when displaying data; this character is used as a separator. Alternatively, one
    could use the SNMP-abbreviated object names instead of direct OID convention.
    Thus, this-mand


    ```

    Target[10.0.2.200.1]:ifInErrors.1&ifOutErrors.1:public@10.0.2.200

    ```


    is functionally equivalent to the previous Target command.

    MRTG knows a limited number of SNMP objects and the list of objects can be expanded
    by modifying and adding objects to the mbhelp.txt file. This file contains mappings
    between SNMP objects and fully qualified OID paths. The following is a sample
    of this file:


    | Descriptor | ifInErrors |

    | Identifier | 1.3.6.1.2.2.1.2.14 |

