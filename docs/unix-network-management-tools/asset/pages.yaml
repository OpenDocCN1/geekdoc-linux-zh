  md: '# PING Tool


    The ping tool uses a sequence number to keep track of requests and replies. Each
    request is given the next number in sequence and then is matched with the corresponding
    reply. Sequencing is used to determine packet loss if any requests do not receive
    an appropriate reply. Generally speaking, packet loss on a small network should
    be very rare and if it occurs it might indicate a network or system-related problem.
    However, on a large segmented network (internet with a lower case i) or on the
    Internet, packet loss is common and represents a normal state of affairs. Given
    a popular Internet site as shown below, a certain amount of packet loss is almost
    always observed:


    ```

    ping s www.whitehouse.gov 56 10

    PING www.whitehouse.gov: 64 bytes

    64 bytes from www.whitehouse.gov: icmp-seq=0. time=180. ms

    64 bytes from www.whitehouse.gov: icmp-seq=2. time=169. ms

    64 bytes from www.whitehouse.gov: icmp-seq=3. time=191. ms

    64 bytes from www.whitehouse.gov: icmp-seq=4. time=173. ms

    64 bytes from www.whitehouse.gov: icmp-seq=5. time=167. ms

    64 bytes from www.whitehouse.gov: icmp-seq=7. time=184. ms

    64 bytes from www.whitehouse.gov: icmp-seq=8. time=268. ms

    64 bytes from www.whitehouse.gov: icmp-seq=9. time=196. ms

    ---www.whitehouse.gov PING Statistics-----

    10 packets transmitted, 8 packets received, 20% packet loss

    -trip (ms) min/avg/max = 167/191/268

    ```


    The report above indicates that 20 percent of the packets sent to the www.whitehouse.gov
    system did not have corresponding replies they were lost. One possible reason
    for this noticeable packet loss is that some of the critical Internet routers
    might be quite busy or even overloaded with network traffic. As a result, some
    of the ICMP requests might be discarded because the requests expired before they
    were delivered to the final destination. Also, the load of the target device can
    be a factor because these systems might not have the computing resources to answer
    all network requests in the time required.


    Sometimes it is desirable to provide additional time for acknowledging each ping
    instead of using the default value of 1 second. If additional time is desired
    between successive ICMP requests, the -I option can be followed by the desired
    value. The interval should be long enough to provide the required'
