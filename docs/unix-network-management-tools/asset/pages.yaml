  md: 'tional status of a network interface to be permanent, a startup file will need
    to be modified. If other interface parameters will be changed, usually this is
    accomplished via changes to one or more system configuration files.


    The Solaris operating system uses a three-phase approach to starting network services
    during system startup. The file /etc/init.d/init is executed first. This script
    is responsible for establishing enough networking function to continue booting
    the system and mounting local file systems. Next, the file /etc/init.d/inetinit
    is invoked. It starts many of the required networking services for normal system
    operations. The final phase, which uses the /etc/init.d/inetsvc file, initializes
    the system interfaces if the NIS environment is used.


    Any of the startup files can be used to make local changes to the network configuration.
    However, as a general rule, these types of changes are made in the files that
    control the final stage of network initialization. The major reason for taking
    this approach is to ensure that any modifications have the least possible impact
    if something is wrong with the new configuration. To demonstrate how to include
    custom configuration information into the system, assume we need to do the following:


    +   - Change the datalink address of the lel interface.


