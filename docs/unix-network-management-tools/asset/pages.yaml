    # Using Packet Filters


    One very important aspect of network protocol debugging involves the use of packet
    filters. A packet filter is a predefined pattern that is compared to incoming
    packets and consists of a series of one or more primitives that might be combined
    with operators such as and, or not. When the pattern is matched, that packet is
    captured or displayed, or else the packet is discarded or not displayed. Packet
    filters are useful when searching for a particular protocol type or any other
    specific information available within the packet.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '134


    Chapter 04 / System Utilities and Tools


    snoop uses two different packet filter mechanisms, depending on whether snoop
    is capturing from the network or displaying previously captured packets from a
    file. The first, known as the kernel packet filter, is installed by snoop when
    a filter expression is given on the command line. This filter is placed within
    the operating system kernel and will filter the rules of the packet filter. Every
    packet is compared to the filter and when a match is found, the packet is forwarded
    to snoop. Otherwise, the packet is discarded. The kernel packet filter is very
    efficient because the processing of the filter is occurring within the kernel,
    not within snoop.


    The second filter mechanism, known as the snoop filter, is used when the -i option
    is specified (i.e., when reading packets from a file). This filter is used to
    control which of the previously captured packets will be displayed. The snoop
    filter is slower than the kernel filter, but filtering is not as critical as it
    is when processing packets asynchronously from the network. Figure 4.2 shows a
    diagram of packet filter types.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_153_0.png)


    Figure 4.2 Snoop Packet Filter Diagram.


    The snoop tool provides a large number of pre-defined expressions or primitives
    that can be used to build very powerful packet filters. These expressions can
    be divided into three groups. The first group, called address primitives, operates
    on packets using address information such as IP or datalink addresses; the second
    group, known as protocol primitives, operates on packets that use different protocols
    including IP, AppleTalk, and others. The final group'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# SNOOP Tool


    # 135


    includes Boolean and arithmetic primitives (or operators) that can be be with
    with the first two expression types to produce compound filters. Compound filters
    include more than one expression type separated by reserve words such as and,
    not, and or. These filters can also include arithmetic operators as +, -, *, and
    others. These expressions are evaluated to be either true or false and the result
    will determine what action snoop will take.


    # Address Primitives


    Expressions that operate on the addressing portions of a packet are listed in
    Table 4.9 and are described in more detail below.


    # Table 4.9 Address Related Primitives


    | Primitive | Description |

    |---|---|

    | gateway | Selects packets that have been used by specified host as a gateway
    |

    | host | Selects packets from specified host |

    | ipaddr etheraddr | Selects packets from either IP or datalink addresses |

    | broadcast | Selects broadcast packet that contains all 1s or FF in either source
    or destination fields |

    | multicast | Selects packets that are sent to multicast addresses |

    | net | Selects packets that contain specified network port used with the IP protocol
    |

    | port | Selects packets that contain specified port addresses used with the IP
    protocol |


    The gateway primitive is used to select packets that have been forwarded by a
    router. This indicates that the datalink addresses of the packet (either source
    or destination) match that of host, but not the IP address. Normally, a router
    will not change the IP address information when forwarding packets, but the datalink
    address will match the device that forwards the packet.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '136


    Chapter 04 / System Utilities and Tasks


    The host primitive followed by a valid hostname can be used to select packets
    that are either sent or received from the specified hostname. The host keyword
    is mainly used to avoid ambiguiquity that might arise if you were to specify a
    hostname that just happens to be the same as one of the snoop existing keywords.
    For example, when monitoring the host gateway, the host keyword must be used because
    the gateway keyword will be interpreted as a keyword, rather than as a valid hostname.
    The snoop command listed below produces an error because the gateway string is
    assumed to specify a local gateway.


    ```

    # snoop gateway

    snoop: hostname required:

    ```


    The way to specify the capture of packets from a host called gateway would be:


    ```

    # snoop host gateway

    Using device /dev/le1 (promiscuous mode)

    ```


    The ipaddr and etheraddr are used to specify actual IP addresses in dotted and
    colon formats, respectively. For example, to capture all packets from the IP address
    10.0.2.100, the following command would be used:


    ```

    # snoop ipaddr 10.0.2.100

    ```


    The ipaddr and etheraddr primitives will match on either the source or destination
    address. Some datalink addresses begin with a letter and will cause snoop to misinterpret
    these as hostnames, rather than true addresses. To avoid this problem, prepend
    a zero when specifying these types of addresses.


    To capture broadcast packets, use the broadcast primitive. A broadcast designates
    that all devices should receive the message. Several network protocols and services
    such as ARP, NIS, and RIP use broadcasts to propagate certain information across
    the network. Using broadcast will result in the capture of broadcast packets from
    the datalink level. That is to say, any address that contains 255 or FF within
    the source or destination field will be captured. This includes datalink packets
    that contain (such as ARP requests) and high-level protocol broadcasts (such as
    an IP broadcast). This primitive could be used'
  merge: -1
