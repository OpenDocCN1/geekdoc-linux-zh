- img_proc: true
  md: 'This system and network information will be available by polling the agent''s
    MIB. The agent supports both MIB-II and portions of Sun''s private MIB. The Sun
    MIB is described below. The trap definition must be done in the agent configuration
    file and is also described below.


    # Command Line Options


    The mibisa utility supports several command line options as outlined in Table
    5.3.


    Perhaps one of the most important is the -r option, which can be used to disable
    write access to the agent''s MIB. Because the mibisa utility implements SNMPv1,
    the agent doesn''t provide a very robust security model. It might be necessary
    to limit the access to the system objects supported by the agent. Using this option,
    SNMP set-requests will be rejected, but read access will operate without being
    affected.


    Any attempt to alter or set a MIB object after the -r option has been used will
    cause an error. More specifically, when using a MIB browser, for example, if an
    attempt is made to set MIB objects that are placed in read-only mode, the authentication
    trap message will be generated.


    Table 5.3 Master Agent (snmpd) Command Options


    | Option | Description |

    | - | - |

    | -a | Disable authentication traps |

    | -c | Specify path to search for the configuration file |

    | -d | Enable debugging output |

    | -p | Use specified port instead of 161 |

    | -r | Place the MIB in read-only mode |


    By default, the directory that mibisa searches for the configuration file is /etc/snmp/conf.
    To specify an alternate directory, use the -c option followed by the directory
    name. This option can be used to help test new configuration files that might
    reside in other directory locations. The mibisa agent requires a configura-'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Sun SNMP Agent


    tion file and if it can''t locate a valid configuration, it will exit with an
    error.


    When an SNMP entity attempts to poll an agent with the incorrect community string,
    an authentication message is dispatched to the addresses configured in the mibisa
    configuration file. If you would like to disable these trap messages, use the
    -a option.


    To place the agent in debug mode, the -d option can be used when invoking the
    agent on the command line. Also, an optional debug level can be included that
    decreases levels of debugging from 3 (which is the highest) to Ⅱ (which is the
    lowest).


    Depending on the networking services presently running on the system, it might
    be necessary to use a different UDP port instead of the default of 161. This will
    be a requirement if the mibisa agent is running with a master agent. In this case,
    the agent will need to be started on a different port using the -p option. For
    example, start the agent on port 32000, use the following command:

    # /usr/lib/snmp/mibisa -p 32000


    # Configuring the Sun Agent


    The mibisa agent uses a configuration file called snmppd.conf and, by default,
    searches the /etc/snmp/conf directory for this file. This file contains configuration
    information that controls access to the agent''s MIB and additional control information.
    Each entry contains a keyword followed by a string value, separated by one or
    more white spaces. Comments are also supported in this file by using the pound
    sign (#) and are ignored when processed by the agent. The keywords that can be
    used are outlined in Table 5.4 and are described in more detail below.


    # Table 5.4 Agent Configuration Options


    | Keyword | Description |

    |---|---|n| sysdescr | System agent information |

    | syscontact | System contact information |

    | syslocation | Information on physical location of system |


    (Cont’d)'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Table 5.4 Agent Configuration Options (Cont''d)


    | Keyword | Description |

    | --- | --- |

    | trap | Sends traps to specified hosts |

    | system-group-read-community | Controls read access to MIB-II and Sun’s system
    objects |

    | system-group-write-community | Controls write access to MIB-II and Sun’s system
    objects |

    | read-community | Controls read access to the entire MIB |

    | write-community | Controls write access to the entire MIB |

    | trap-community | Trap community string |

    | kernel-file | Symbol lookup file |

    | managers | Hosts that are permitted to communicate with agent |


    sysdescr: This keyword maps to the MIB object sysDescr and the associated value
    used by the agent when responding to requests for this object. This is used to
    describe the system on which the agent is running (e.g. Ultra SPARC 2 or SPARCclassic).
    Values for this object might include any string, but it should represent some
    information related to the type of system and perhaps operating system information
    as well.


    syscontact: This keyword maps to the MIB object sysContact and the associated
    value is used by the agent when responding to requests for this object. It is
    used to describe the contact group or name that is responsible for the system
    (e.g. Steve Maxwell x3190).


    syslocation: This keyword maps to the MIB object syslocation and the associated
    value is used by the agent when responding to requests for this object. It is
    used to describe the physical location of the system (e.g. Building 2, Graphics
    Lab 11-B).


    trap: This keyword is used to specify one or more hosts that should receive traps
    from the agent. Up to five hosts may be'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Sun SNMP Agent


    included with this option. Either the IP addresses or hostnames may be used. Any
    additional hosts beyond the maximum will be ignored. One use of this keyword is
    for forwarding authentication traps when an SNMP entity attempts to poll the agent
    with an incorrect community string. This is the primary way to determine if another
    party is attempting to access a device without having the proper authorization.


    An authorization trap may also indicate that the community string was changed
    on the agent side and this change was not propagated to the manager side as well.
    Also, it means that a new SNMP management software package was recently installed
    that uses the community strings of public or private, and that these must be adjusted
    to the strings used at the local site.


    system-group-read-community and system-group-write-community: These keywords are
    used to control read/write access to the agent MIB that includes the system group
    within MIB-II and Sun''s object groups.


    read-community and write-community: These keywords are used to control read/write
    access to the entire MIB.


    trap-community: This keyword is used to specify the community string for trap
    messages.


    kernel-file: This keyword is used to specify where the agent should search for
    symbols.


    managers: This keyword is used to control which hosts are permitted to communicate
    with the agent for either read or write access. It forms a basic access control
    list (ACL) for the agent. The ACL is one very good way to address some of the
    security flaws within the SNMP security model. However, bear mind that this option
    provides a fundamental authentication mechanism, which is vulnerable to compromise.
    Therefore, consider the managers option as part of your overall security strategy.


    # Sample Configuration


    To further illustrate the agent configuration file options, a sample (see Listing
    5.3) has been provided.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Listing 5.3 Agent Sample File


    ```

    #

    # System Information

    #

    sysdescr        SPARC Ultra 60

    syscontact      Steve Maxwell

    syslocation    Science Center room 22B

    #

    # Community Strings (system group only)

    #

    system-group-read-community  louvrehasart

    system-group-write-community louvrehasart

    #

    # Community Strings (entire MIB)

    #

    read-community louvrehasart_1834

    write-community louvrehasart_1824

    #

    # Trap Information

    #

    trap          rembrandt

    trap-community louvrehasart

    #

    # Standard Unix kernel

    #

    kernel-file    /vmunix

    #

    # Which systems are permitted to talk to this agent

    #

    managers        rembrandt monet

    ```


    The system information (sysdescr, syscontact, and syslocation) should be specific
    to each system that is running on. In this example, the agent is running on a
    SPARC ultra 60 workstation, the contact for the system is Steve Maxwell, and the
    system is located in the Science Center room 22B. Note that any descriptive information
    could be included. Therefore, the sysdescr might not represent the actual system
    type the agent is running. The system MIB objects are accessed with the read and
    write community string of louvrehasart. Access to the rest of the MIB for both
    read and write access is set to the louvrehasart_1824. The system community string
    is different from the entire MIB so that you'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Sun SNMP Agent


    might want others to have access to system information (for inventory purposes,
    for example) without having access to the core of the other agent objects. All
    traps generated from this agent will be sent to the host rembrandt with a community
    string of louvrehasart. Using the managers keyword as the basic ACL, the agent
    is permitted to access SNMP requests from the hosts rembrandt and monet and all
    other requests be discarded by the agent.


    # Sun Agent MIB Objects


    The mibiisa agent supports all of the objects defined within MIB-II, plus additional
    objects under the Sun enterprise wide vendor number (42). The MIB-II objects have
    been previously described in Chapter 3, "TCP/IP Protocol Suite." However, Sun
    has changed some of the attributes relating to either the return value or access
    modes of the standard MIBII definitions. These changes and the additional Sun
    objects are described in this section.


    # Sun MIB Differences


    The differences between mibiisa objects and the standard MIB-II objects include:


    +   * Access to MIB objects has changed


    +   * Certain MIB objects contain fixed values


    Table 5.5 outlines these differences and contains a list of MIB objects, flags
    that indicate the object differences, the access method (either read-write or
    read-only), and the return value, if any. The object flags v and A refer to whether
    the object change is related to the value (V) of the object or the access mode
    (A) of the object. A check mark is placed in the column to indicate which object
    attribute is different from standard MIB-II definitions. For example, the access
    mode of the symbolName object is read-write within MIB-II, while the Sun MIB provides
    read-only access. As a result, a check mark is placed in column A. Most of the
    Sun objects in this table just return a fixed value. In many of these cases, a
    1 is returned, which means the agent doesn''t support the object and is provided
    only for compatibility purposes.'
  merge: -1
  pgno: 210
