  md: '# OSI Model


    Networking protocols including TCP/IP can be mapped to a general network model.
    This model defines the relationship and services that each protocol will provide
    to other associated protocols, services, and applications. The most common standard
    network model is based on Open Standard Interconnect (OSI). The OSI model is represented
    by a series of layers stacked upon one another which, when viewed collectively,
    represent the operation of an entire network. Each layer represents a unique view
    of the elements that make up the network. The layers of the OSI model consist
    of the following:


    +   * Application

    * Presentation

    * Transport

    * Network

    * Datalink

    * Physical


    # Application Layer


    Provides services to users including file transfer, electronic email, remote host
    access, and many other services.


    # Presentation


    Used to provide a common interface for applications to the lower layers and implement
    common services that might include encryption, reformatting, and compression.


    # Session


    Provides the mechanism to establish, maintain, and terminate sessions between
    cooperating applications.


    # Transport


    Ensures reliable, transparent data transfer, flow control, and data error detection
    and recovery between two endpoints.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Network


    Provides upper layer protocol transparency because different network communication
    methodologies may be used. This layer is responsible for establishing, maintaining,
    and terminating connections for different networks.


    # Datalink


    Provides data transfer service on the physical link using frames; handles error
    detection, flow control, and related services.


    # Physical


    Addresses the mechanism connectivity requirements (such as cables and connectors)
    and provides transmission of a bit stream that involves controlling voltage characteristics
    to produce the appropriate signals.


    # TCP/IP Protocol Architecture


    The TCP/IP suite can be placed or overlaid on the OSI model to better understand
    TCP/IP''s protocol operation and its relationship to other protocols. Figure 3.1
    shows a pictorial view of where TCP/IP fits into the OSI model.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_70_0.png)


    Figure 3.1 TCP/IP over the OSI Networking Model.'
