  md: 'To display all packets that originate from a particular Sun system, for example,
    the command to use is:


    ```

    snoop "ether[6:4]&0xffffff = 0x08002004"

    ```


    This tells snoop to examine the sixth byte of the frame (the source frame address)
    and compare it to the 0x08002004 addresses using the &) operator. Its datalink
    address represents most of the address of a local system called monet. Recall
