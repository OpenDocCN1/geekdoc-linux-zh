    # Monitoring System Processes


    The proc command can be used to monitor specific services or Unix processes. The
    syntax includes:


    ```

    proc process [maximum limit] [minimum limit]

    ```


    This keyword is followed by a valid process name or command that is monitored
    by the agent. This directive is used to monitor a critical process or a set of
    processes that must be running continuously on the system. If the process is not
    found running on the local system by the agent, an error flag is set in the MIB
    object procTable.prEntry.errorFlag and a descriptive message is also placed in
    the MIB object procTable.prEntry.prErrorMessage. The agent uses the Unix /usr/bin/ps
    -e command to search for running processes as specified with the proc command.
    For instance, the following can be used to ensure that the mount process is alive:


    ```

    proc mountd

    ```


    Additionally, a maximum and minimum value can be included to further refine the
    processes that should be running. The maximum is used to indicate how many processes
    should be running concurrently while the minimum determines the smallest number
    that must be running. Because it is customary to have multiple mountd processes
    on a system, the agent can be configured to monitor the exact number. For the
    sake of discussion, let''s assume we have enabled the system to support four copies
    of mountd. The syntax of proc command is:


    ```

    proc mountd 4 4

    ```


    If the agent detects that either less than four or greater than four mountd process
    are running, it updates the MIB appropriately. If no maximum and minimum values
    are specified, the default of zero is assumed. In practice, the use of both the
    maximum and minimum options can provide a flexible way to address specific monitoring
    requirements.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'In the following example,


    proc ntalkd process is monitored and if more than four are running currently,
    the agent will update the MIB. Therefore, the maximum option provides a convenient
    way to ensure that only a certain number of processes are permitted to run currently.
    If we want to go a step further, we can automate the agent to take an action when
    ntalkd processes are found (for example, kill the process). Because no minimum
    was listed, the agent will take no action when no ntalkd processes are found to
    be running.


    The selection of which Unix processes to monitor with the proc keyword is largely
    a matter of determining which services are critical to the operation of your environment.
    If the computing systems are used to support publishing software, you might care
    about print spoolers and word processing applications while systems supporting
    online order entry software might need to have database server processes monitored.


    On the other hand, one might take the approach that everything running on a system
    is critical and must be monitored. At first glance, this might seem like a reasonable
    strategy. Unfortunately, this can lead to other problems and may well be overkill
    in many situations. If all processes are going to be monitored, does this include
    temporary processes like networking services as well? If so, which ones? Also,
    maintaining the configuration file for the agent can be a chore at best because
    it must be updated whenever new applications and software are added or removed
    from the system. Performance of the agent will be affected as well. In certain
    situations, this might be unacceptable.


    Assume we have configured the agent to monitor mount four ntalkd processes. The
    following example shows the values of the MIB when the agent detects that none
