    As you can see, having the ability to collect information from other sources is
    a very powerful feature of MRTG. If you are interested in developing custom programs
    to monitor non-SNMP information, the data returned from the program must be in
    a format that MRTG understands. Therefore, the program properly returns four lines
    of output that include the present state of the first variable, a string indicating
    the system uptime of the target, and a string indicating the name of the target.


    The first two variables are comparable to, for example, incoming bytes per second
    and outgoing bytes per second. The system update time is indicative of when the
    system was last rebooted (or when the network management component—the agent—was
    restarted). To ensure that the script output is matched with a target, the target
    name is returned.


