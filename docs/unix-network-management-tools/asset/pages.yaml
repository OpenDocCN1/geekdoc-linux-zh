  md: '# Special Configurations Parameters


    Additional parameters are supported by the ifconfig command. These include:


    +   - ARP


    +   - Plumb


    +   - Reverse ARP


    +   - Private


    +   - Trailers


    The arp keyword is used to specify that the interface should support an ARP style
    IP address resolution. When an interface is created with ifconfig, the default
    is to support ARP. To disable ARP on an interface, use the -arp keyword.


    The plumb keyword is used to initialize the interface to support logical interfaces
    and point-to-point (PPP) links. Logical interfaces are described in more detail
    below.


    The ifconfig command can also be used to support reverse ARP (RARP) for a network
    interface. The auto-revarp command obtains an IP address using RARP. A RARP server
    must be available on the network to respond to these requests.


    The private command is used to squelch advertisements of one or more interfaces
    from a routing perspective. The default is to advertise the interface available
    for routing.


    The trailers keyword enables the use of datalink encapsulation of frames that
    can improve network performance. However, because this type of encapsulation is
    non-standard, its use is limited and is no longer supported on certain Unix operating
    systems.


    # Logical Interfaces


    On Solaris, the ifconfig command can be used to create and configure logical (pseudo)
    interfaces. These interfaces behave like physical interfaces and can be used to
    assign multiple IP addresses to the same system. From a configuration standpoint,
    logical interfaces are configured independently but share the same physical address
    and interface characteristics as the real physical interface.'
  merge: -1
  pgno: 121
