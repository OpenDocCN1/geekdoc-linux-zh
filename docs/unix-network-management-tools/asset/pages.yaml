  md: '# The UCD Agent Installation Procedure


    The installation procedures for the UCD package include the following:


    +   1. Obtain the UCD package from one of the sites above or from the CD-ROM provided
    with this book.


    +   2. Uncompress the GNU archive:


    ```

    gunzip ucd-snmp-3.5.tar.gz

    ```


    +   3. Untar the archive into the directory you will be using:


    ```

    tar xvf ucd-snmp-3.5.tar

    ```


    +   4. Normally, the untaring will create a new directory named ucd-snmp plus
    the software version number. Change to this directory:


    ```\cd ucd-snmp-3.5

    ```


    +   5. Next, run the configure command from this directory:


    ```

    /configure

    [lots of output]

    ```


    After several pages of output, the configure program will ask a small number of
    questions as shown below:


    +   6. If no errors were encountered, run the make command:


    ```

    make

    [lots of output]

    ```


    +   7. After the make has completed and no serious errors were displayed, install
    the package by running:


    ```

    make install

    [lots of output]

    ```


    If you encounter a problem during the installation, consult the Frequently Asked
    Questions (FAQ) file and additional documentation that come with the package.
    The FAQ.txt file is located at the top level of the installation directory.'
