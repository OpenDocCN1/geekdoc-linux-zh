    # Positive Acknowledgement


    One way TCP provides reliability is by ensuring every message transmitted is confirmed
    by the receiving entity. The confirmation of TCP messages is known as positive
    acknowledgement and is used to ensure that the receiving entity has obtained all
    the segments that have been sent. When a TCP message is sent, the send'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'ing entity starts a timer. If no acknowledgement is received before the time
    expires, TCP assumes the message was lost or damaged in some way, preventing its
    delivery. As a result, TCP sends another message to replace the first and starts
    the timer over again. This process continues until all segments have been acknowledged
    or until an internal error threshold is reached. If the sender receives no acknowledgement
    for outstanding segments after the internal error count has been reached, the
    connection will be terminated.


    # Establishing and Closing a TCP Connection


    As previously discussed, TCP uses connections that provide a reliable, robust
    data transfer facility. The procedure for establishing or shutting down a connection
    is not a magical process. Instead, each TCP entity follows the same set of rules
    when creating a session or terminating one. To establish a connection, TCP uses
    a 3-way handshake protocol, which is outlined in Figure 3.5.


    | Source Entity | Destination Entity |

    |--- |--- |

    | Send SYN sequence (1) | Network |

    | | Receive SYN (2) Send SYN + ACK |

    | Receive SYN + ACK Send ACK (3) | Receive ACK |


    **Figure 3.5** Opening a TCP Connection Using the 3-way Handshake.


    First, the source transmits a SYN message segment. The SYN (pronounced "sin")
    or synchronization is a request to start a TCP session and have the SYN bit set
    in the code field. Next, the destination responds with an ACK segment that has
    both the SYN and ACK bits set in the code field, indicating that it has accepted
    the request and is continuing the handshake protocol. Finally, the source sends
    an ACK segment, which informs the destination that both entities agree that a
    connection has been established and that segments can now be transmitted and received.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# TCP/IP Protocol Architecture


    To close an established session, TCP uses a modified 3-way handshake, which is
    shown in Figure 3.6. First, the source transmits a FIN or finish segment (The
    FIN bit is set in the code field) as a result of the application wishing to close
    side of the connection. Recall that TCP views these connections as full duplex;
    therefore, either party may terminate their side of the connection. Once the application
    on the destination closes the connection, TCP emits a FIN segment to the source.
    Next, the source receives the FIN sequence and sends an acknowledgement.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_84_0.png)


    **Figure 3.6** Closing a TCP Connection.


    Please note that it takes three segments to create a TCP connection and four additional
    segments to shut it down. A total of seven messages are required to operate a
    TCP connection not including any data transfer segments.


    # State Machine


    The operation of TCP is best described using a state machine model, which controls
    the basic operation of the protocol. Figure 3.7 shows the TCP state machine model.
    Each TCP connection goes through a series of defined states. Movement from one
    state to another is the result of an event or transition. The label on each transition
    shows what TCP receives to cause the change between states. For instance, we discussed
    that TCP must open a connection before data can be transferred. Normally, each
    TCP side of the'
  merge: -1
  pgno: 84
- img_proc: true
  md: '66 Chapter 03 / TCP/IP Protocol Suite


    connection starts in the CLOSED state. When a connection is desired, a transition
    from the CLOSED to SYN SENT state is made. At this point the client side sends
    a SYN packet. If the SYN packet is accepted, the remote side emits an ACK, which
    causes a transition from the SYN SENT to SYN RECIVED state. Once the final ACK
    has been received, the ESTABLISHED state is reached and data transfer may begin.
    When a TCP connection has been made, it will remain in the ESTABLISHED state until
