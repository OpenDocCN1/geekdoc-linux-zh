  md: '# IFCONFIG Tool


    The -a option indicates that ifconfig should display all interfaces installed
    within the system regardless of their present configuration or operational state.


    The display example above indicates that four interfaces are defined. The first,
    `lo0`, is the loop-back interface, primarily used for internal communication and
    diagnostics. The loop-back interface can be used to determine if the TCP/IP software
    is operating correctly on a local level. For instance, it is possible to ping
    the loop-back address to determine valid responses. The second and third `eth0`
    and `eth1` represent the physical hardware interfaces for 10 Mb/s Ethernet using
    the Lance Ethernet driver. The Lance device is used with Sun Microsystems computers.
    The final `hme0` represents the Fast Ethernet 100 Mb/s interface that is available
    on Sun systems.


    Each interface contains a flags portion (surrounded by `<>` characters in the
    display) and several keyword configuration parameters, which must be specified
    when the interfaces are configured. The flag field is used to indicate the present
    state and special operating characteristics of the interface. The following options
    are supported within the flag field:


    +   * Current Administrative State

    * Supports Broadcast Traffic

    * Present Operating State

    * Supports Multicast Traffic


    Controlling Administration State

    With `ifconfig` it is possible to disable an active interface or enable a disabled
    interface. In the disabled state, no packets will be permitted across an interface.
    This is equivalent to disconnecting the interface from the network. When an interface
    is disabled, it is considered down from an administrative standpoint. To place
    an interface in the down state, invoke the ifconfig command with the appropriate
    interface and the the down keyword option as shown below:


    ```

    # ifconfig eth0 down

    ```'
