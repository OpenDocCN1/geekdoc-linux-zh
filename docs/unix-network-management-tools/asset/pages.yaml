    # Monitoring System Load


    The agent provides the ability to monitor the system load aver-

    age via the load agent command. The system load average is the

    umber of jobs (or programs) in the run queue. The agent

    provides the same basic information as the Unix uptime and w com-

    mands. The syntax of this command includes:


    load [1 minute max] [5 minute max] [15 minute max]


    The load command, followed by either 1 maximum, 5 maxi-\mum or 15 maximum, will
    instruct the agent to monitor the sys-

    load for these systems. If the system load exceeds the maximum

    for 1 minute, 5 minute, or 15 minute running averages, then the

    agent will set the loadaveError to 1 and include a

    descriptive error message in the loadaveErrMessage object. If no

    maximum load command is specified, then the default value of 1

    minute is used.


    The load command is an excellent way to monitor system utili-

    zation across a large number of systems. Establishing the system

    load threshold can be a little tricky because different kinds of sys-

    tems need different thresholds. For example, a workstation

    might experience high system load because the user just started a

    CPU-intensive application. On the other hand, a user starting the

    same application on a server with a large number of users could

    pose a significant problem. Also, some systems always have

    h higher load than other systems, but because the system is

    expected to be used in this manner, it might not be a problem.


    For critical systems, a load average higher than 2 or 3 may indi-

    c a severe problem that must be addressed in a timely manner. In

    the following example, the agent has been configured to monitor

    the 1-minute load average threshold of 2:


    load 2'
