  md: '# NETSTAT Tool


    As you can see, netstat displays some of the same information the ifconfig command
    provides, plus some basic statistics operating characteristics of each interface—specifically,
    the name of the interface, the maximum transfer unit (MTU), the network or destination
    address, and the address of the interface. Also, a count of the total number of
    input packets, input error packets, output packets, number of collisions, and
    packets remaining in the queue are displayed. The Net/Dest field shows just the
    address of the network to which this interface is attached. Normally, this information
    is derived from the interface address, but it can also be specified in the /etc/networks
    file or through NIS. The Address field is the IP address of the interface, which,
    again, is specified in the /etc/hosts file or with NIS.


    The Ipkts and Opkts fields represent the representation and validation of valid
    traffic across the interface, respectively. The Ierr field indicates any input
    error packets that have occurred on the interface; this includes, for example,
    any runt packet (that are smaller than the standard size) and other errors. The
    Oerr field indicates problems with the transmission of packets on the interface.
    In the output above, note that the interface reports a number of output packet
    errors. In this case, these errors are being generated because the interface is
    not physically attached to a network, yet the system is attempting to send out
    traffic. This is also the reason that the Ipkts and Opkts fields are zero; this
    indicates that no traffic has been sent or received across this interface.


    The Collis field indicates the number of collisions that have occurred as recorded
    by the local system. A collision is when two or more devices attempt to transmit
    packets at nearly the same time. After this happens, a jam signal is sent to inform
    all devices that a collision has occurred and that any transmission should stop
    briefly and then, after randomly determined intervals of time, be tried again.
    This is known as back-off and is the mechanism used by devices to resume normal
    operations. Collisions only occur on broadcast network technologies such as Ethernet.
    When the Collis field is non-zero, it indicates that the interface has recorded
    collisions for which it was directly involved. It is important to note that this
    field does not represent all collisions that have occurred on the network.'
