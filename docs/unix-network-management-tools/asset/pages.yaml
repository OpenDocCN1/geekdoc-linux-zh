    # Snmtrap


    The snmtrap command will emit an SNMP trap to a designated SNMP manager. This
    tool is very useful when embedded in a shell script or other program for sending
    traps to any number of SNMP network managers. One or more object identifiers can
    be specified on the command line, plus the type and value must accompany each
    object. The snmtrap supports both SNMPv1 and SNMPv2 formats. The basic syntax
    of the command is:


    ```

    snmtrap -v 1 [command arguments] enterprise-oid agent generic-trap specific-trap
    uptime [object ID value]

    ```


    The enterprise-oid field identifies the network management subsystem that generated
    the trap. The agent is the host that is emitting the trap. The generic-trap corresponds
    to one of the predefined SNMP traps. These traps were listed in Table 2.4 in Chapter
    2. The specific-trap value indicates more specifically the nature of the trap.
    The uptime field is used as a time-stamp between the last initialization of the
    device and the issuance of the trap. The object ID, type, and value are used to
    provide additional information relating to the trap. These additional fields are
    known as the variable binding and may contain any type of information that is
    related to the trap.


    The enterprise-oid, agent, and uptime need not to be specified on the command
    line. Instead, the empty character sequence '''' may be used to specify the default
    values for these fields. The default value for the enterprise-oid string is 1.3.6.1.4.1.3.1
    (or enterprises.cmu.1.1). The default agent value is the hostname of the machine
    running the snmtrap command. The uptime is obtained from the local system''s MIB
    system.sysUpTime.0.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# UCD Commands


    Consider, for example, that we would like to emit a link-down trap to a network
    management system called rembrandt. Further, if we want to communicate that a
    particular port has gone down, we include the port within the variable bindings
    of the trap. The command below can be used:


    ```

    smpntrap -v 1 monet public '''' monet 2 0 interfaces.iftable.ifentry.\nifindex.1
    i 1

    ```


    In this example, we use the default values for the enterprise-oid and uptime fields.
    Also, we specify the particular interface (ifindex.1) and set the value to 1 (which
    indicates the second interface with the device). The 2 represents the link-down
    trap and 0 provides a null value for the specific-trap value.


    If we are reviewing the traps on rembrandt, we will see output like the following:


    ```

    1998-11-27 17:48:45 monet [10.0.3.126] enterprises.3.1.1:

    Link Down Trap (O) Uptime: 1:29:06

    interfaces.ifTable.ifEntry.ifIndex.1 = 1

    ```


    In practice, most link-down messages are not meaningful or interesting. However,
    when they come from critical devices, such as core routers or switches, a downed
    interface enabling them can cause a trap flood disaster for the network.


    Care should be taken when configuring traps from network devices because enabling
    a trap flood. A trap flood is when a large number of traps are sent because a
    port is bouncing up and down many times per second. Often, this represents a malfunction
    with the device transmitting the traps. However, with a little bit of care, the
    problem can be avoided.


    # Snmtrapd


    The snmtrap command will receive and log SNMP traps. Traps that are sent on port
    162 are either logged to the Unix facility or displayed on the terminal. These
    messages are sent using LOG_WARNING and, if available, are sent to the LOG_LOCAL
    logging level. This command must be run as superuser because it listens on a reserved
    system port. Executing the command without any options will cause it to be placed
    in the background and detached from the calling shell.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'The snmertrap command supports a few command line arguments that include -P,
    -D, -d, and -q. The -P option will instruct snmprapd to display all traps on the
    standard output and the -d option will display a dump of the trap packet. Thus,
    to show received traps and display the trap packets, use the following command:


    ```

    snmprapd -P -d

    ```


    If this command is run, the previous example on the host rembrandt, the proceeding
    output will be displayed:


    ```

    1998-11-27 22:56:47 UCD-snmp version 3.5

    received 69 bytes from 10.0.3.126:-32566:

    0000: 30 82 00 41 02 01 00 04 06 70 75 62 6C 69 63 A4 0..A......public.

    0016: 82 30 32 06 08 28 06 01 04 01 03 01 01 40 04 0A ..2+......@.

    0032: 03 03 72 01 02 01 02 01 04 23 24 03 5C 96 30 82 ....C.$S.O.

    0048: 00 13 30 82 00 0F 06 0A 28 06 02 01 02 01 02 01 .O.....+......

    0064: 01 01 01 02 01

    1998-11-27 22:56:51 mon [10.0.3.126] enterprises.3.1.1:

    Link Down Trap (Uptime): 6:37:09

    interfaces.ifTable.ifEntry.ifIndex.1 = 1

    ```


    The first line shows the current version and when the snmtrapd process was run.
    Next, the output displays the number of bytes in the trap packet, the host the
    trap was sent from (monet), and the UDP port (32566, in this case). The contents
    of the trap include both hexadecimal and ASCII. Finally, the trap information,
    including the variable-binding information, it is shown.


    The -d option will display additional debugging information that includes the
    parsing of MIB files. The user manual reports that q provides a more verbose output,
    but it doesn''t seem to be implemented in this version of the command.


    # Snmpwalk


    The snmpwalk command will query an agent MIB tree using the SNMP GETNEXT request.
    An object variable may be given on the command line to specify with which portion
    of the MIB space search will begin. Without an object argument, snmpwalk searches
    and starts with the MIB-2 objects. Thus, the command


    snmpwalk monet public'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# UCD Commands


    will walk the entire system on the device monet. Since MIB-2 contains a large
    number of objects, the command will produce a rather long list. Instead of listing
    every object supported by the agent, we can limit the search and display only
    a single group of objects. Thus, we can list all the objects found within the
    MIB-2 system group as shown the following:


    ```

    snmpwalk cisco-gw5 public system

    system.sysDescr.0 = Cisco Internetwork Operating System Software

    IOS (tm) GS Software (RP-JV-M), Version 11.1(13a)CA1, EARLY DEPLOYMENT RELEASE
    SOFTWARE (fcl)

    synced to mainline version: 11.1(13a)

    Copyright (c) 1986-1997 by Cisco Systems, Inc.

    Compiled Wed 13-Aug-97 04:12 by richard

    system.sysObjectID.0 = OID: enterprises.9.1.46

    system.sysUpTime.0 = Timeticks: (236153209) 27 days, 7:58:52.09

    system.sysContact.0 = cisco-gw4

    system.sysLocation.0 = Testing Lab

    system.sysServices.0 = 78 -

    ```


    If you need to walk the MIB within a given agent and save the output to a file,
    using the following command:


    ```

    snmpwalk cisco-gw5 public .1 > walk.out

    ```


    Thus the command


    ```

    wc -l walk.out

    ```


    produces the following output:


    ```

    2242 walk.out

    ```'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'As you can see, this command output shows that the agent contained within the
    cisco-gw5 device supports roughly 2242 MIB objects. When no object is specified
    with the snmpwalk command, it will search the MIB-2 object tree by default. When
    a tree search causes the snmpwalk command to go beyond the end of the MIB within
    the agent, the message End of MIB will be displayed. This can happen, for example,
    when a MIB object group is given and the agent doesn''t actually support that
    group.


    # Snmpconf


    General Description

    Thenmpconf command provides the ability to configure devices using the snmpset
    command according to MIB objects defined within a configuration file. The configuration
    file may contain a list of MIB objects and values that will be set against an
    SNMP device. This tool provides an automated mechanism to apply standard configuration
    information to a number of devices or even a single device that must be configured
    the same way more than once. Consider, for example, the installation of several
    router devices. It would be easier to create a configuration file that contains
    many of the common configured objects that the router devices share. Such a configuration
    could be executed against the device when each of the devices is first installed.
    Contrast this to manually configuring each router by hand. Using this approach,
    the amount of time needed to install a device is reduced and the likelihood of
    possible configuration errors is decreased as well.


    The configuration file may contain MIB object entries, comments, and blank lines.
    Comments may be added using the hash mark (#). A valid configuration entry consists
    of a type, OID, value, and comment string. Listing 6.1 contains a sample configuration
    file:


    # Listing 6.1 Sample SNMPCONF File


    ```

    #

    # Setup standard system group information

    #

    s .1.3.6.1.2.1.1.4.0 Steve-Maxwell system contact

    s .1.3.6.1.2.1.1.5.0 host.dt.com system name

    s .1.3.6.1.2.1.1.6.0 Graphics_Lab system location

    ```'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'Each of the three configuration entries contains the S character in the first
    field, which identifies the type of MIB object listed in the second field. The
    S means that the object is of type STRING. This field is interpreted as a string
    and, therefore, it must not contain any extra spaces. Thus, Virginia-Maxwell is
    acceptable, but Virginia Maxwell is not. Also, the use of double quotes is not
    permitted. If the string "Virginia Maxwell" is used, it will result in a configuration
    error. The snmpconf tool defines two additional types: I for INTEGER and A for
    IPADDRESS.


    The second field is the MIB object that will be changed to the value contained
    within the third field. Note that only a fully qualified OID expressed in dotted
    notation is supported by snmpconf. Any other format, as a dotted name format (e.g.,
    iso.org.dotnet.mgmt.mib-2.system.sysLocation.0) or abbreviated MIB strings will
    cause configuration errors.


    As stated, the third field is the value that the MIB object will be set to. As
    such, it must match the character specified in the first field. Thus, in this
    example, each of the configuration lines expects a string in this field. The last
    or fourth field is for comments. It provides a comment that should be used to
    identify the MIB object and value. In this case, the MIB objects are the contact
    (sysContact), name (sysName), and location (sysLocation) objects from the MIB-2
    system group.


    Once the configuration file contains the needed/required MIB objects and values,
    it can be used against an SNMP device. The basic syntax of the snmpconf command
    includes:


    ```

    snmpconf hostname community configuration_file

    ```


    Thus, assume the above configuration is stored in a file named config1 nicodemus,
    which also has a community string of private. Given this information, the following
    command could be used:


    ```

    snmpconf nicodemus private config1

    ```


    When the above command executes, the output shown below is displayed:


    +   # # Setup standard system group information'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 272 Chapter 06 / Simple Network Management Protocol Tools


    ```

    #

    Set display string ''system contact'' to Steve-Maxwell

    Set display string ''system name'' to host.dt.com

    Set display string ''system location'' to Graphics_Lab

    Done.

    ```


    Notice that defined comments are displayed along with a confirmation that each
    set command was successful. If you would like to verify this, simply execute an
    snmpwalk within the MIB-2 system group. Thus, the command


    ```

    snmpwalk nicodemus public system

    ```


    will produce the output listed below:


    ```

    system.sysDesc.0 = unknown

    system.sysObjectID.0 = OID: enterprises.ucdavis.ucdSmpAgent.solaris

    system.sysUpTime.0 = Timesteps: (260633) 0:43:23.63

    system.sysContact.0 = Steve-Maxwell

    system.sysName.0 = host.dt.com

    system.sysLocation.0 = Graphics_Lab

    system.sysServices.0 = 72

    ```


    The host most is running UCD SNMP agent and the output above shows only part of
    the system group. In this example, we can confirm that the sysContact, sysName,
    and sysLocation objects have been updated according to the snmpconf configuration
    file.


    The SNMPCONF software provides a couple of ways to specify the required configuration
    file. First, the name of the file may be given on the command line in the preceding
    example; snmpconf will examine the current directory to find the file. Next, the
    file may be provided with a fully qualified pathname. Finally, if the environment
    variable SNMPCONF_LIB has been set, the software will search the directory specified
    in this variable.


    The snmpconf tool provides some basic error checking, and when problems occur,
    displays useful information. However, it is difficult to determine the cause of
    certain types of problems. For example, if the incorrect community string is given
    or the device given isn''t currently on the network, the same error message is
    displayed. Thus, the commands


    ```

    snmpconf didymus private configl

    smpconf monet public configl

    ```'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Snmpconf


    produce the same errors as shown below, but for different reasons:


    ```

    # Setup standard system group group information

    #

    ```


    UNABLE to set display string ''system contact'' to Steve-Maxwell

    UNABLE to set display string ''system name'' to host.dt.com

    UNABLE to set display string ''system location'' to Graphics_Lab

    Done.


    3 errors encountered.


    The first command attempts to set MIB objects on the system didymus, which isn''t
    presently reachable on the network. That is, the device was powered down when
    this command was run. The second command uses the wrong community string. In this
    case, the correct community string is private, not public. As you can see, the
    tool doesn''t respond differently to a down system and an incorrect community,
    making it difficult for you to determine the cause of the particular errors. With
    care, you can get around this problem by issuing the ping command before executing
    the snmpconf. In this way, you can avoid these kinds of ambiguities and address
    the separate problems appropriately.


    The SNMPCONF software provides two command line options. The first, version, displays
    version information for both the snmpconf tool itself and the CMU support library.
    The second, quiet, instructs snmpconf to squelch messages when executing.


