- img_proc: true
  md: 'working correctly as well. Why? Before we answer this question,

    let''s look at an example:


    ```

    monet# traceroute -m 5 128.197.2.200

    taceroute to 128.197.2.200 (128.197.2.200), 5 hops max, 40 byte

    packets

    ```


    +   1 rodin (10.0.2.129) 10.193 ms * 2.158 ms

    2 * * *

    3 * * *

    4 * * *

    5 * * *


    This traceroute produces no response to the probe packets.

    Note the use of the -m option to keep the number of probe packets

    small.


    The answer to this problem lies in the fact that, by default,

    taceroute sends probe packets based on the UDP protocol. It is

    most likely that the destination in question does not support this

    protocol directly or can''t handle the UDP designation used.

    From a TCP/IP standpoint, not all devices are required to support

    UDP and if they do support UDP, they do not necessarily support

    the port number used by traceroute.


    When traceroute sends probe packets, it uses, by default,

    the UDP port of 33434 and assumes that this isn''t being used

    by any other application or network service. It uses this high port

    number in hopes that the destination will respond with a port

    unreachable message, terminating the route tracing. On the

    other hand, if that port is being used, it will cause problems for

    taceroute. If this happens, use the -p option followed by another

    port number and traceroute will use that port instead of the

    default.


    For example:


    ```

    monet# traceroute -p 10 -m 5 128.197.2.200

    taceroute to 128.197.2.200 (128.197.2.200), 5 hops max, 40 byte

    packets

    ```


    +   1 rodin (10.0.2.129) 10.193 ms * 2.158 ms

    2 * * *

    3 * * *

    4 * * *

    5 * * *'
