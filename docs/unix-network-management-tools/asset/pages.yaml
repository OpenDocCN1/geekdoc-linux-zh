    \ le0 up\n```\n\nWhen the interface is up, it indicates that it is available on\
    \ the network and is receiving network information. Without the indication of\
    \ the up flag, the interface is operational, but no information is flowing to\
    \ or from the network.\n\n# Modifying Interface Parameters\n\nTwo methods can\
    \ be used to modify network interface parameters. First, using ifconfig directly,\
    \ changes can be made on the command line and will take effect immediately. The\
    \ second approach involves modifying the system startup and/or system files that\
    \ ifconfig uses to configure the interface. This approach ensures that interface\
    \ changes are made permanently and won't disappear across system reboots and Sometimes\
    \ both approaches are used. Often, a configuration change must be implemented\
    \ quickly before the system can be conveniently rebooted. As a result, ifconfig\
    \ is used to make the immediate change; the system configuration files are also\
    \ changed so that the network modifications will be permanent. Normally, when\
    \ a new interface is installed on a system, this configuration may be handled\
    \ by the installation procedure. However, if network interface information must\
    \ be changed prior to the installation, the ifconfig tool must be used."
