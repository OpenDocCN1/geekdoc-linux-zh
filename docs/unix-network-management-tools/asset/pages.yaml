  md: '# Overview of SNMP Versions


    To address some of the deficiencies in SNMPv1, a significant amount of effort
    has been made over the past five years to enhance SNMP. The first series of improvements
    came in 1993 when a set of 12 RFCs (1441-1452) was introduced, proposing added
    PDUs, and enhancements to the SNMP architecture and security model. This collection
    of RFCs was known as SNMPv2 Classic. At that time, many were expecting these improvements
    and planned to take advantage of the new features as soon as vendors upgraded
    their products.


    Unfortunately, there was still much debate about SNMPv2 security and remote configuration.
    When it became apparent that not all the original SNMPv2 proposals were going
    to be widely adopted, additional work was done to define SNMP security and remote
    configuration management components. This led to additional proposals that included
    the new protocol and new MIB structure elements (documented in RFCs 1901-1908).


    These proposals were more popular than SNMPv2 Classic and became known as community-base
    SNMPv2 or SNMPv2c. The problem with SNMPv2c is that, though it was endorsed by
    the IETF, it lacked security and administration.


    Additional improvements to the remote management capability of SNMPv1 resulted
    in proposals known as SNMPv2 usec and SNMPv2*, documented in RFC 1909-1910 and
    2222, respectively. The SNMPv2 use recommends a robust security model and administrative
    framework. One of the problems with SNMPv2 usec is that it lacks endorsement of
    the IETF, which relinquishes the proposal to a non-standard. With all the proposals
    completed, the major functions of SNMPv2 include:


    +   * Expanded data types as 64 bit counters

    * Improved performance and efficiency with the get-bulk PDU

    * Event notification with the inform PDU

    * Better error handling

    * More efficient row creation and deletion


    Finally, in an attempt to reach some agreement between the various remote management
    and security proposals, another set of'
