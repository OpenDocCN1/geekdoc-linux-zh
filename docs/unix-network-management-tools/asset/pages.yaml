    # Customizing MRTG Reports


    The MRTG package can be customized to produce differently formatted reports and
    graphs and to control certain operational aspects of MRTG. This is accomplished
    by using optional target configuration tags (or keywords) within the MRTG configuration
    file. The keywords can be divided into two groups: optional global commands and
    optional target commands. The global commands affect the operation or behavior
    of MRTG as a whole, while the optional target commands apply specifically to individual
    reports and graphs.


    # Global Commands


    There are four global commands supported by MRTG. They are listed in Table 7.2.
    These are optional keywords and are placed in the configuration file that is used
    with the mrtg program.


    The Refresh keyword specifies how often, in seconds, the browser should reload
    the MRTG report page. The default value is 300 seconds, which is five minutes.
    This is a very useful option when it becomes important to precisely control the
    granularity of the update of the MRTG reports. For example, if it is necessary
    to have nearly real-time performance information on certain critical devices,
    lowering the Refresh to as little as 60 seconds be'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Table 7.2 Optional Global Commands


    | Option | Description |

    | --- | --- |

    | Refresh | Specifies how frequently (seconds) to update the MRTG report |

    | Interval | Specifies how often mrtg is called |

    | WriteExpires | If to YES, will generate meta files that control expiration tags
    for the MRTG reports |

    | IconDir | Tells MRTG to look in an alternative location for GIF images |


    appropriate. On the other hand, the Refresh should be larger for those devices
    that may be less critical and don''t require up-to-the-minute reporting. To reduce
    the browser refresh rate to one minute, place the following command in the MRTG
    configuration file:


    ```

    Refresh: 60

    ```


    In order for the refresh value to be effective, it should match closely the interval
    that the mrtg is executed when polling devices. The crontab entry previously specified
    in this section runs mrtg every five minutes. If the refresh value is decreased
    from its default value, the crontab entry should also be updated with the same
    value as well. Consider the situation in which the refresh value is one minute
    while the execution of the mrtg is every five minutes. In this scenario, there
    would be no point in refreshing the MRTG reports because the data would only be
    updated every five minutes by mrtg. Clearly, to increase the granularity of the
    MRTG reports means running the mrtg program more often to collect additional data
    points from the devices being monitored.


    The Interval command specifies how often MRTG is executed. The purpose of this
    command is to generate a meta header in the MRTG report which is used to control
    the time-to-live of the report for caching purposes. Also, it is used to document
    the HTML pages with the correct calling interval. If the Web browser being used
    requires the generation of meta files that control the'
