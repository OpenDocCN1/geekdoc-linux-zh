  md: 'Management Information Base (MIB)


    # GetResponse


    Each of the SNMP operations, with the exception of the Trap, receives a GetResponse
    from the agent. The format of the GetResponse-packet is shown in Figure 2.6 and
    includes the following fields:


    +   * PDU Type: Indicates the PDU type, which is GetResponse.

    * Request-id: Unique identifier that permits the pairing of requests and responses.

    * Error-status: Indicates that an exception condition occurred while processing
    the request.

    * Error-index: When an error occurred, indicates which object variable in the
    variable-binding list caused the error.

    * Variable-Bindings: A list of MIB objects that are involved in the operation.


    | PDU Type | Request ID | Error Status | Error Index | Variable Bindings |


    Figure 2.6 GetResponse Message Format.


    # Trap


    A trap is an unsolicited message from an agent directed to a network management
    station that represents an asynchronous notification of some significant event
    or condition. The trap PDU is quite different from the other of the PDUs defined
    in SNMP, as shown in Figure 2.7. Unlike the other SNMP PDUs, traps do not warrant
    a response from the receiving network. The fields from a trap include:


    +   * PDU Type: Indicates the PDU type is a trap.

    * Enterprise: Contains the MIB object ObjectID of the sending agent. sysObjectID
    includes information regarding the vendor of the agent that sends the trap.

    * Agent-address: Represents the IP address of the sending agent.

    * Generic-trap: One of the predefined trap values listed in Table 2.4.

    * Specific-trap: More detailed information about the trap. This is usually zero
    unless the generic-trap is an enterpriseSpecific trap.'
