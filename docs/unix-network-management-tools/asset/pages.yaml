  md: '# UCD Commands


    # Environment Variables


    Each of the UCD tools uses a small set of environment variables that help establish
    global values of certain operating parameters or shortcuts for command line options.
    These include the following:


    +   - PREFIX

    - MIBS

    - MIBDIR

    - SUFFIX


    The PREFIX variable is a standard way to define the prefix of the MIB object identifiers.
    The default value is .iso.org.dod.inter-net.mgmt.mib-2. If this variable is defined,
    the contents of the variable are added to the beginning of the MIB object referenced
    with one of the UCD tools. Defining this value will help in situations in which
    a non-standard MIB is used. For example, if we are polling the Sun system agent,
    we will encounter MIB objects that are defined within the Sun MIB. Without the
    PREFIX definition, when polling for a specific Sun object, we get:


    ```

    snmpget 10.0.2.220 public system.sysDesc.0 system.UpTime.0

    sub-identifier not found: UpTime

    Invalid object identifier: system.UpTime.0

    ```


    But, when we define the PREFIX variable to:

    setenv PREFIX iso.org.dod.internet.mgmt.mib-2.enterprise.sun

    and then attempt the poll as we get:


    ```

    UpTimensystem.UpTime.0

    ```


    The MIBS and MIBDIR variables provide a way to load additional MIB modules. The
    variable MIBS functions the same way as the -m command line option. The MIBDIR
    variable functions the same way as the -M option. Both are a convenience because
    they work with all UCD applications.


    The SUFFIX variable is used to toggle the -s command line option, which displays
    the suffix, or last component, of the MIB object path.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Snmpbulwalk


    The snmpbulwalk tool is used to communicate with a network entity using SNMP2
    SNMP GET BULK requests. Like the snmp-walk tool, snmpbulwalk will walk a MIB tree
    until the end of the MIB is reached or an error occurs. As previously discussed,
    the BULK request provides a more efficient mechanism to transfer a large amount
    of data than the regular SNMPv1 GET request. For example, assume we would need
    to retrieve the MIB-2 interface group. The SNMPv1 snmpbulwalk command will obtain
    the information with 157 packets, while the snmpbulwalk will obtain the same information
    with just 4 packets! This is a tremendous savings in terms of network bandwidth
    and increased SNMP performance for the agent and manager.


    To walk the entire MIB tree of the device called cisco-gw1, use the following
    command:


    ```

    snmpbulwalk -v 2 cisco-gw1 public

    ```


    The snmpbulwalk command only works with SNMPv2 agents. This is because the GET
    BULK facility was not implemented until SNMPv2. Using this command on an SNMPv1
    agent will, therefore, generate an error.


    For instance, the following command attempts to walk the MIB tree of a device
    called remote-gw starting from the system group. In this example, remote-gw3 only
    supports SNMPv1.


    ```

    snmpbulwalk -v 2 remote-gw3 public system

    ```


    Because this device doesn''t understand the SNMP GET BULK request, inevitably
    times out and the following message is displayed following the snmpbulwalk command:


    Timeout: No Response from remote-gw3


    A timeout error occurs because the requests are sent to the device, but the agent
    residing in the device doesn''t understand the SNMP request format. As a result,
    the packet was not answered and thus timed out.


    Note that snmpbulwalk requires that one of the two SNMPv2 names be used (either
    2p or 2c). If you attempt to invoke'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# UCD Commands


    snmpbulwalk without specifying which version of the SNMPv2 protocol is to be used,
    the following error will be displayed:


    snmpbulwalk: Cannot send V1 PDU on V2 session


    # Snmpdelta


    The snmpdelta command collects changes in MIB integer values from an SNMP agent
    entity. This command monitors the specified integer objects and displays to the
    objects that occur over time. This is very useful in tracking networking errors.
    You might, for example, want to determine the number of packets discarded from
    an interface; the ifInDiscards MIB object. To monitor this object from the device
    remote-gw, for example, the following command may be used:


    snmpdelta -R remote-gw public ifInDiscards.


    # This command will produce the:


    ```

    ifInDiscards.1 /1 sec: 800

    ifInDiscards.1 /1 sec: 8353

    ifInDiscards.1 /1 sec: 449

    ifInDiscards.1 /1 sec: 3883

    ifInDiscards.1 /1 sec: 541

    ifInDiscards.1 /1 sec: 8316

    ifInDiscards.1 /1 sec: 4576

    ifInDiscards.1 /1 sec: 8763

    ifInDiscards.1 /1 sec: 9568

    ```


    This command supports a number of additional command line arguments over the common
    options previously discussed. Table 6.4 contains the available options.


    # Table 6.4 Additional snmpdelta Command Line Options


    | Option | Description |

    | -f | Reads configuration file |

    | -k | Displays seconds in output |

    | -l | Writes configuration to file |

    | -m | Displays the maximum value ever retrieved |


    (Cont’d)'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Table 6.4 Additional snmpdelta Command Line Options (Cont’d)


    | Option | Description |

    | --- | --- |

    | -p | Specifies the polling period |

    | -P | Specifies the reporting period in number of polling requests |

    | -s | Displays timestamp information |

    | -S | Logs data to logfile |

    | -t | Determines time interval |

    | -T | Produces table output |


