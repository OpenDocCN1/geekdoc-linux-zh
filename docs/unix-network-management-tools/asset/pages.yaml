    # GetNextRequest


    GetNextRequest PDU is similar to the GetRequest PDU and the packet formats are
    identical as shown in Figure 2.5. However, the GetNextRequest PDU has one difference:
    It is used to retrieve objects when the structure of the MIB tree is unknown.
    The GetNextRequest can be a great asset when it is used to cover the MIB structure
    of an agent. Why would an agent''s MIB structure be unknown to an SNMP manager?
    SNMP provides no direct way to determine which MIBs or MIB structure is available
    within an agent. Therefore, the network manager must disclose the device and supported
    MIBs by walking the MIB tree in an automated fashion. When the GetNextRequest
    is sent with the requested object''s value, plus the instance of the next lexicographic
    object in the MIB tree. As a result, each GetNextRequest will reveal the next
    object within the MIB without the manager specifically requesting it. The GetNextRequest
    operation also provides a more efficient mechanism to retrieve objects from an
    agent than GetRequest because it requires fewer request/response exchanges.


    # SetRequest


    The SetRequest is used to alter the value of a MIB object. The packet format is
    the same as GetRequest and GetNextRequest as shown in Figure 2.5. Unlike the GetRequest
    or GetNextRequest, the SetRequest is used to alter the value of a MIB object.
    As mentioned before, the SetRequest requires security privileges, which are presently
    mapped via the community string for the SNMPv1 protocol. Therefore, the agent
    must validate the SetRequest community string before the operation is permitted
    to succeed. The SetRequest is atomic; either all the values can be altered or
    none. If the SetRequest is successful, a GetResponse is returned and the variable-binding
    list contains the objects with their new values. This is how the network manager
    can determine that the set operation was successful. If the SetRequest was unsuccessful,
    an error is returned in the GetResponse.'
  merge: -1
  pgno: 55
