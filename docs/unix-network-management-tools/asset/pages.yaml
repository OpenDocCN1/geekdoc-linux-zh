    address for Node B, Node A will send a special broadcast message requesting Node
    B''s to all devices on the network, as shown in Figure 3.15a. All hosts receive
    the message, including Node B and Node C, but only Node B will respond with the
    correct physical address shown in Figure 3.15b.'
