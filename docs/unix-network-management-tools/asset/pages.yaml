    \ agent as shown below:\n\n```\n/usr/lib/snmp/snmpdx -y -c /etc/snmp/conf\n```\n\
    \nWhen the agent is automatically started by the system, the master agent has\
    \ no way of determining its previous state, and therefore uses the recovery option\
    \ by default. Any subagent not found to be running when the master agent starts\
    \ is restarted automatically by the master agent.\n\n# Master Agent MIB\n\nThe\
    \ snmpdx implements a collection of MIB objects that provide information of the\
    \ operational state and configuration of the master agent and any configured subagents.\
