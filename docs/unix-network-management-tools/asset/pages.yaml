    This snoop command will compare the nineteenth byte of the IP header, which is
    the last byte of the destination IP address that uses the broadcast address. Recall
    that 255 (0xff in hexadecimal) is used to represent the broadcast address. We
    use the 0xff mask and the & (&) symbol with this byte to test if it is equal to
    255. Any value combined with the & operator with all bits enabled (i.e., 0xff)
    will automatically return that. When this snoop command is run, it will display
    broadcast traffic for the local network. The sample output included below shows
