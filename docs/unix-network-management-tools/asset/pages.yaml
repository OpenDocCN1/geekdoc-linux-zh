  md: '# Listing 5.5 Agent Startup Script (Cont''d)


    ```

    36

    37 *)

    38 echo "Usage: /etc/init.d/init.snmpdx { start | stop }"

    39 ;;

    40 esac

    41 exit 0

    ```


    Like startup scripts on Solaris, this script provides the ability to start or
    stop the master agent and subagents. A case statement is used to provide the logic
    to determine which argument is given on the command line and takes appropriate
    action. If the string start is specified, then everything between lines 25-29
    is executed. When the stop string is used, then everything between lines 31-35
    is executed. When the system starts, it executes this script with the start argument.
    When the system is being brought down, the script is started with the stop argument.
    The (*) label (on line 37) is provided when the script is being executed on the
    command line. If either the start or stop argument isn''t provided, the script
    uses this to match anything that results in a usage string being played.


    When the script is going to start the agent processes, it first checks to ensure
    that the /etc/snmp/conf/snmpdx.rsrc file exists and is a regular file, and checks
    to see if the /usr/lib/snmp/snmpdx is executable. If either of these tests is
    false, the script silently stops without starting the agents.


    When the script is invoked to stop the agent processes, it uses the killproc (lines
    8-12) function with the name of each agent to name the stop. Before the killproc
    function actually kills each agent process it checks to see if each of these processes
    is in fact running by invoking the pidproc function. This function executes the
    ps command followed by a grep for the match of the agent name. If the agent is
    running, it will return a process id. If not, the null string " is returned. The
    last step is to issue the kill -9 with the process id of each running agent.'
