  md: '# SNOOP Tool


    Two primary capture modes are provided by snoop : promiscuous and non-promiscuous.
    In promiscuous mode, every packet that is transmitted on the network is captured,
    whether or not the packet was sent to the system snoop is listening from. This
    is the mode, for instance, RMON probes use when monitoring network traffic. Because
    LAN protocols such as Ethernet are broadcast-based, every frame transmitted can
    be seen by any network interface attached to the LAN. Any device can read every
    frame transmitted if that so chooses. When a device or interface reads every frame
    from the network, it is said to be in promiscuous mode. In practice, the interface
    must be configured for promiscuous mode is only used on special occasions when
    network diagnosis is required. For this reason, root may enable promiscuous mode
    on an interface.


    With non-promiscuous mode, only broadcast frames and frames addressed to the local
    device will be available to the interface. The term broadcast actually refers
    to both normal broadcast (with all in the destination field) and multicast traffic.
    Under normal circumstances, the interface is in this mode.


    When snoop is invoked without command options, it opens the primary network interface
    and begins capturing frames from the local network and displaying its contents.
    The command


    ```

    # snoop

    Using device /dev/le (promiscuous mode)

    ```


    when executed by root will display all network frames in the single-line, non-verbose
    format. The format of the output will include the source and destination hosts,
    the high-level network protocol, and additional protocol information as shown
    below:


    ```

    rembrandt -> monet TELNET C port=1032

    rembrandt -> monet TELNET C port=1033

    monet -> rembrandt ICMP Echo request

    rembrandt -> monet ICMP Echo reply

    ```


    In this example, rembrandt, the source host, and monet, the destination host,
    have a TELNET session established. monet has issued a ping request to rembrandt
    and rembrandt has responded with a reply. The -> string indicates the direction
    of the communication. Note that snoop always orients the communication path to
    point to'
