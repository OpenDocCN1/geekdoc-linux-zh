    mands should be placed at the end of the /etc/inetsvc file. Rebooting the system
    will cause their automatic execution at system startup.


    As a general rule, exercise care when changing the datalink address of any interface.
    Why? If a host is given a datalink address that is already in use by another local
    device, it will cause problems because any sending nodes will get duplicate replies.
    Also, any network requests from the duplicate device will confuse other nodes
    because it is possible that the original node is already defined in the other
    device ARP cache.


