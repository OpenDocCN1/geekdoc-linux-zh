- img_proc: true
  md: '# Overview of Network Management


    On a conceptual level, a network management system addresses three fundamental
    areas: performance monitoring, configuration management, and diagnostic management.
    Some network management systems provide all these services while most individual
    tools address only one or two.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Each of these areas is part of an overall puzzle, as shown in Figure 1.1. A
    network management system must function in all three areas and provide the tools
    necessary to implement effective network management. If one of the areas is not
    covered, the network management picture is incomplete and the solution is inadequate.
    That is to say, without tools to support critical network management functions,
    the overall network management effort will be hindered. These three functions
    are so basic to network management that every tool and utility discussed in this
    book implements one or more of them. One of the goals of this book is to address
    each of these areas by describing tools that implement one or more of these management
    functions. However, because some of the tools presented are not commercial products,
    not all areas will be covered by an appropriate network management tool.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_21_0.png)


    Figure 1.1 Three Elements of Network Management.


    Performance monitoring includes the ability to keep tabs on the general efficiency
    or health of the network from the perspective of an enterprise or an individual
    device. It involves the collection and subsequent analysis of traffic patterns
    to alleviate network performance bottlenecks and solve related problems. Given
    adequate historical performance information, performance monitoring tools provide
    trend analysis as well. By proactively conducting perfor-'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'mance reviews, the network administrator or designer can plan for network growth
    in a more consistent, timely, and strategic fashion.


    Network configuration management involves ensuring that each network device or
    system contains the appropriate configuration and correct version of operating
    system software. Sometimes, changes are made to individual devices while, at other
    times, changes are propagated to a large number of systems. In these cases, the
    network management system must ensure that these changes are made correctly and
    efficiently.


    Diagnostic management involves troubleshooting network failures, software problems,
    and other issues and problems that affect normal operation of the network or its
    components. It also involves effectively managing the many different types of
    problems and issues that result from software—and hardware—related failures. Network
    problems vary in complexity and can range from a simple hardware failure to a
    protocol-related problem. It is the goal of the network management system to isolate,
    describe, and in some cases, repair the problem.


    A significant challenge in network management is keeping pace with improvements
    and advances in network technology as a whole. With the deployment of virtual
    local area networks (VLANs), where network topologies can be defined and modified
    very quickly and individual devices and workstations are moved around the network
    logically rather than physically, the need for robust and functional management
    is critical. With the migration from standard wide area network (WAN) topologies
    to virtual private networks (VPNs) where a public network is used as the basis
    for networking infrastructure, network management must again play an important
    role in shaping the administration, support, and day-to-day operations of the
    network.


    With these factors in mind, a review of the major components of a network management
    system with an emphasis on specific system functionality is presented.


    # Network Management Components


    To understand how a network management system functions, we must first consider
    the individual elements that make up such a sys-'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'tem. A network management system consists of the following four components:


    +   * Managers

    * Agents

    * Management Information Bases (MIBs)

    * Proxies


    Generally speaking, the first three components are required elements in most networkworking
    management systems. The remaining element, proxies, is optional because proxy
    functionality is very specialized and might not be required in all network environments.


    # Managers


    Network management software includes important functionality to assist the network
    manager or administrator in the day-to-day tasks for managing the network or individual
    devices. Network manager software queries agent entities on a regular basis to
    collect vital device information. A manager might poll many agents on a regular
    basis to collect a host of information regarding the operating state, present
    configuration, or performance data. Figure 1.2 shows the relationship between
    a manager and an agent from a high level standpoint. The information collected
    by the manager is used to determine the general health of individual network devices,
    a portion of the network, or the network as a whole.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_23_0.png)


    Figure 1.2 Manager/Agent Relationship.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Agents


    Network management agents are software modules that reside in network devices
    such as Unix workstations, network printers, and other networking devices. Agents
    have access to the operational state, device characteristics, system configuration,
    and other related information as shown in Figure 1.3. Agents are the information
    brokers for each managed network device; they respond to requests for specific
    information and are usually polled by one or more network managers. Agents are
    responsible for the interface between the management software and the device in
    which the agent resides. Agents can control the functions of network devices by
    manipulating the database of information stored in the management information
    base (MIB) contained within the device.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_24_0.png)


    **Figure 1.3** Manager/Agent Relationship.


    The external behavior of network management agents is the same across different
    vendor products if the agent supports a standard protocol like SNMP. SNMP agents
    understand both the language and the type of questions a manager can ask. It is
    possible to deploy a network management system from one vendor, third-party network
    applications from another, and agents from a host of additional vendors and ensure
    communication among all components. SNMP provides the framework to permit communication
    and understanding among many disparate devices, software, and systems.


    The internals of many networking devices—such as routers, switches, and hubs—are
    proprietary by design, and the agent component is provided by the network equipment
    manufacturer as part of the base system or as an optional upgrade module. In many
    cases'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 01 / Overview of Network Management


    the agent is embedded in the operating system of the device and usually provides
    minimal configuration options. This is in sharp contrast to computer operating
    systems like Unix, where the agent is provided as a stand-alone system program
    and the user has much control over the system''s operation and configuration.
    Under the Unix system, several agents are available from both commercial vendors
    and the public domain. In contrast, no public domain agents are available for
    most networking hardware products.


    It is the responsibility of a network management agent to convert the network
    manager''s request from a standard network format, retrieve the desired information,
    and send back a valid response. In some situations, the manager might request
    the agent to perform some action by setting the value of a MIB object. For example,
    if an agent receives a request to reboot a device, no return message will be sent,
    but the agent will attempt to satisfy the request, provided the security requirements
    are met. Only with additional polls to the device would the manager actually know
    whether the device was restarted.


    Equipment vendors define which objects their agents can manipulate, which poses
    some interesting problems for agent developers. How does a vendor determine agent
    functionality? Generally, he does this by seeking customer advice and, in an ideal
    world, by attempting to mimic hardware functions. However, this second goal isn''t
    always practical or attainable; hardware designs generally change too quickly
    and agent software might not keep pace with hardware improvements. Also, network
    management as a whole is still in its infancy and not all equipment vendors behave
    as if agent development is as critical as hardware product development.


    # Management Information Base (MIB)


    The MIB defines a database of objects that can be retrieved or manipulated by
    a network management system. Figure 1.4 shows the relationship of the agent and
    MIB objects. The MIB is a store-house of information and can contain literally
    thousands of objects that the network manager can use to control, configure, and
    monitor devices by manipulating the objects directly. MIB objects are made available
    to a network management system via the agent.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Network Management Components


    is the responsibility of the agent to maintain the MIB object consistency regardless
    of the number of objects.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_26_0.png)


    **Figure 1.4** SNMP Agent and MIB Objects.


    Several common standard MIBs have been defined, which include specific objects
    that must be supported in networking devices so that they are compatible with
    the SNMP protocol. The most widely implemented and common MIB is MIB-II. Many
    additional MIBs have been developed and documented in Request for Comments (RFCs)
    to address different networking components and technologies. Table 1.1 shows a
    sample list of these MIBs. As you can see, MIBs are available for a diverse collection
    of services, networking protocols, and architectures.


    # **Table 1.1** List of Standard MIBs


    | MIB | Description |

    |---|---|

    | FDDI MIB | Provides access to Fiber Data Distribution Interface (FDDI) network
    management functions. |

    | Host Resource MIB | Provides access to system objects that are related to memory,
    disk, processes, and other system related information. |


    (Cont’d)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Table 1.1 List of Standard MIBs (Cont’d)


    | MIB | Description |

    | ISDN MIB | Used to provide management of Integrated Service Digital Network
    (ISDN) nodes |

    | DNS Resolver and Server MIB | Provides management capabilities for the Domain
    Name Service (DNS) |

    | MIB-II | Provides access to system level objects that include network protocols,
    network interfaces, and generic system information |

    | Printer MIB | Provides access to common printer management functions |


    Additionally, many vendors have developed their own proprietary MIBs. These MIBs
    have been developed mainly to address additional functionality not found in the
    standard MIBs. Many networking product vendors like Cisco, 3Com, Bay, and Cabletron,
    as well as computer manufacturers like Sun, IBM, HP, have developed their own
    MIBs.


    # Proxies


    > Proxy devices are used to bridge the gap between standard network protocol managers
    and legacy systems that do not directly support such standards. Figure 1.5 shows
    the basic functions of a proxy-based system. Proxies can also be used to provide
    a migration path from older standard protocols to newer versions without upgrading
    the entire network. For instance, a significant amount of work has been focused
    on establishing improvements to the SNMP protocol. When a new version of SNMP
    is available, all existing network devices are affected. When these enhancements
    are made from equipment vendors, it is reasonable to assume that not all products
    will be changed to support the new protocols.


    +   1. This term proxy here is not related to the proxy servers that are used
    today in many enterprise networks which provide protocol filtering and other related
    services to hide the details of an internal network to the outside world.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Network Management Components


    Some vendors will provide upgrades while others will not; it is a matter of product
    viability and economics. It is also entirely possible that certain devices will
    be upgraded while other products will be made obsolete. As a result, organizations
    must address the issue of supporting different versions of SNMP for the foreseeable
    future. The proxy mechanism is one way to deal with any migration concerns.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_28_0.png)


    Figure 1.5 Proxy-Based System.


    It is interesting to note that a proxy-based system might even provide proxy network
    connectivity to systems that do not support any standard network protocols (such
