    # Operators


    snoop supports several expression (or operator) types and can be combined to produce
    compound filters. These expressions include arithmetic and Boolean operators,
    listed in Table 4.11. Operators can be used to build powerful expressions to search
    for specific packets or information. Expressions can be composed of numbers, packet
    field selections, length primitives, and arithmetic operators. To use the value
    of a field in an expression within a packet, use the following syntax:


    ```

    primitive [offset [: size]]

    ```


    where the word primitive is replaced with ether, ip, udp, tcp, or icmp. The offset
    is used in the base of the protocol primitive and the size specifies the length
    of the field. If not supplied, it defaults to 1.


