  md: 'the ROUTE service doesn''t have a client that it uses a broadcast approach,
    thus removing the need for specific client connections.


    # Using the Command Options


    The ntop tool supports a number of command line options as listed in Table 7.8.
    This software considers a host that hasn''t generated or received traffic since
    its last poll to be an inactive host. If you are interested in viewing inactive
    hosts as well as active ones, use the -d option. This will show both types when
    generating reports. Also, when ntop is running in terminal mode, the -d key can
    be used to accomplish the same purpose. This is useful to display all hosts regarding
    their activity status. Another handy option is -i. This controls the network interface
    ntop will use to monitor the network. With multi-homed systems this is a must,
    because it may be necessary to run ntop on different interfaces, not just the
    default one.


    # Table 7.8 Command Line Options


    | Option | Description |

    | -d | Shows all hosts, not just active ones |

    | -l | Shows both local and remote hosts that generate network traffic |

    | -i | Specifies an alternate interface to use |

    | -n | Shows numeric IP addresses instead of names |

    | -r | Controls the delay between screen updates |

    | -p | Shows network traffic as percent |

    | -w | Enables web mode |


    If you are interested in monitoring systems by percentage, use the -p option.
    This option will display traffic as a percent of total traffic for each system
    active on the network. Figure 7.18 shows what will be displayed when ntop is run
    with this option enabled.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '![](img/0790df3a82cfb96e70cab5a9d94c0bd0_346_0.png)


    Figure 7.18 Traffic by Percent.


    # Security of the Web Reports


    If you are concerned about security with respect to the reports, no problem! The
    ntop tool supports a rudimentary, but very useful, security feature that can be
    implemented quickly and easily. When ntop is run, it searches the home directory
    of the user starting the process for a file called .ntop. This file may contain
    one or more names and associated passwords. When an entry is added to this file,
    the user is prompted with a login window as displayed in Figure 7.19.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_346_1.png)


    Figure 7.19 NTOP Login Window.


    In most instances, it is reasonable that ntop be run as the superuser of the system.
    As a result, a .ntop file can be placed in the directory of the / (root) file
    system. To make it as secure as possible, ensure that the file is not readable,
    except by the superuser.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 328 Chapter 07 / Web Enabled Network Management Tools


    Assume that we wish to provide access to ntop for a handful of ususers. The following
    sample .ntop would serve our purpose:


    netmgr

    techl-1 secret

    smaxwell 1ghost99

    acartwright 44 pleaseread


    With these entries, any of the four users—netmgr, tech-1, smax-well, or acartwright—can
    obtain access to the ntop reports, provided they they used the associated password
    string. Thus, netmgr would have to use private and so on. Clearly, this security
    feature is very simple, but it does have its weakness. Namely, someone could capture
    the login sequence with a probe or other device and obtain the name/password pair.


    # Using Terminal Mode


    By default, ntop starts in terminal mode. The information pre-sent with the Web
    interface is available in the terminal mode but, of course, the data is formatted
    differently. To review the different reports, ntop defines a number of keyboard
    commands that, when pressed, will utter a single letter without the enter key.


    For example, the h command provides help for the ntop tool and displays a list
    of available keyboard commands. Thus, when ntop is running, pressing this key
    (without the return or enter) will display the following:


    ```

    ntop v0.1 for sparc-solaris2.6 [libcap version 0.4a7]

    Written by Luca Deri <deri@unipi.it> and Stefano Suin <stefano@unipi.it>

    While ntop is running actively, the following keys are active:

    ''q'' - quit ntop

    ''- - reset statistics

    ''n'' - toggle address format (num <-> sym <-> MAC <-> Nw Board Manifest.)

    ''p'' - toggle traffic values (vs. bytes)

    ''l'' - toggle hosts display (local vs. all)

    ''d'' - toggle idle (idle vs. send/receive)

    ''- - toggle sort (sent vs. received)

    ''y'' - toggle columns sort

    ''h'' - show this help

    ''- - toggle protocol

    ```


    Strike a key to continue...'
