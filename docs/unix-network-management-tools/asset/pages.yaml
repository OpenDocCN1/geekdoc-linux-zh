  md: '# System Utilities and Tools


    This chapter provides a detailed overview of the following Unix utilities and
    tools:


    +   - ARP

    - IFCONFIG

    - NETSTAT

    - PING

    - SNOOP

    - FPING

    - TRACEROUTE'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'This collection of tools is considered the core set that a Unix or network
    administrator would use to solve a variety of system- and network-related problems.
    Many of the tools and utilities listed in this chapter are available on most Unix
    systems. However, some of the tools are only available within the public domain,
    and as a result, they must be installed separately from the operating system.
    In these cases, a section entitled “Software Availability” has been added to those
    tools to which these special circumstances apply.


    # ARP Tool


    General Description


    The arp command is used to display and manipulate the address table on a local
    Unix system. The address resolution table, also known as the ARP cache, contains
    a complete list of all datalink protocols to IP address mappings for the local
    network. Recall from the previous chapter that the ARP protocol is a dynamic facility
    that maps datalink addresses, such as Ethernet to IP addresses, and whenever the
    system must transmit a message, it must first know the low level (i.e., datalink)
    address for each node on the network.


    This command provides the ability to view and modify the ARP cache. To modify
    the ARP table, the super-user must invoke the command. Note that the terms ARP
    table and cache can be used interchangeably and binding also refers to an ARP
    entry. With the arp command, the following can be accomplished:


    +   - Display the ARP Cache

    - Delete an ARP Entry

    - Add an ARP Entry


    The arp command provides a small number of command line options listed in Table
    4.1 and fully described later.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# ARP Tool


    # Table 4.1 ARP Command Line Options


    | Option | Description |

    | --- | --- |

    | -a | Displays the current ARP cache |

    | -d | Deletes an ARP entry |

    | -f | Used to load a file that contains entries to place in the cache |

    | -s | Creates an ARP entry |


    Displaying the ARP Cache

    To display the contents of the ARP table, use the `arp -a command`. When the table
    is displayed, it includes the device, IP address, network mask, flags, and physical
    address for each entry. A sample is shown below.


    ```

    # arp -a

    ```


    | Device IP Address | Mask | Flags | Phys Addr |

    | --- | --- | --- | --- | --- |

    | le0 | 224.0.0..1 | 255.255.255 | | 01:00:5e:00:00:01 |

    | le1 | 224.0.0.1 | 255.255.255 | | 01:00:5e:00:00:01 |

    | le1 | durer | 255.255.255 | | 06:00:08:26:be:5e |

    | le1 | rembrandt | 255.255.255 | | 08:00:20:82:be:05 |

    | le1 | rubens | 255.255.255 U | 08:00:20:04:cf:2c |

    | le0 | monet-a | 255.255.255 SP | 08:00:20:04:cf:2c |

    | le0 | 224.0.0.0 | 240.0.0.0 SM | 01:00:5e:00:00:00 |

    | le0 | 224.0.0.0 | 240.0.0.0 SM | 01:00:5e:00:00:00 |


    The Device field corresponds to the network interface that is attached to the
    local network, for which the ARP entry was obtained. In the example above, two
    interfaces are shown with their own listings. In practice, most systems only contain
    a single interface. The le1 stands for Lance Ethernet, which is the name of hardware
    device driver under Solaris. Because this particular system contains two network
    interfaces, they are numbered le0 and le1.


    The IP Address field shows an IP address or hostname that corresponds to the ARP
    entry. This is the address that is used to search the ARP table to determine if
    the desired entry exists.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Chapter 04 / System Utilities and Tools


    When an IP address is displayed, this indicates that the IP address couldn''t
    be correctly resolved to a hostname.


    The Mask field is used to determine which part of the addresses should be examined.
    The Flags field provides additional details and options regarding the ARP entry.
    Table 4.2 shows the available flags and their associated meaning.


    # Table 4.2 ARP Entry Flags


    | ARP Flag | Meaning |

    |---|---|

    | S | Static ARP entry |

    | P | Publish this ARP entry |

    | M | Mapped ARP entry (Multicast Only) |

    | U | Unresolved |


    The Phys Addr (physical address) field contains the low-level address for each
    node on the local network and is expressed in 6 hexadecimal numbers in colon notation.


    ARP entries that are marked S are static and have been defined outside the normal
    ARP protocol (e.g., manually entered with the arp -s command). Each interface
    on the local system has a static ARP entry because the interface is local to the
    system and doesn''t need the ARP protocol to obtain this information. Certain
    special purpose interfaces are also statically defined. Static entries are also
    used to support networked systems that don''t support the ARP protocol. Therefore,
    the address binding must be manually entered in the ARP table. One problem with
    this approach is that if the IP address of any of these systems is changed as
    a result of moving to a new network, the ARP information must be manually updated
    to effect the change.


    Entries that contain the P flag will be transmitted over the network if a node
    makes an ARP request. Typically, the system interfaces are published so that other
    local devices can build their own ARP tables. Only the IP addresses associated
    with genuine interfaces are advertised with ARP. It is interesting to note that
    ARP information obtained from other network devices is not-'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# ARP Tool


    mally published by third-party systems. It is usually the responsibility of each
    device to respond to ARP requests with its own ARP information. There is one special
    case when a system will respond to ARP requests on behalf of others. This is known
    as proxy ARP and is described below.


    Mapped ARP entries include a timer, which controls how long the entry will remain
    in the ARP cache. By default, most systems hold the entry for approximately 20
    minutes before removing it.


    The U flag indicates that an ARP request is still pending and the mapping is presently
    unresolved. In the ARP example above, the system rubles is lacking a physical
    address because the ARP request hasn''t obtained a reply. This is known as an
    incomplete ARP entry.


    In the above example, some entries do not have corresponding physical interfaces.
    For example, the addresses 224.0.0.0 and 224.0.0.1 are pseudo addresses that are
    defined by the system for its own use. These addresses represent the multicast
    address facility, which is used to support real-time video/audio applications.


    # Deleting an ARP Cache


    It might become necessary to delete one or more entries from the ARP table. For
    example, a hardware failure result in the replacement of a network interface card,
    the network hardware address of the system will change. In this case, the existing
    ARP entry doesn''t reflect the low level address has changed. As a result, messages
    sent to this host will not be picked up because the hardware address is not recognized.


    To address this problem, the -d option is used to delete an ARP entry, as shown
    below. Removing ARP bindings can cause network problems, only the super-user is
    permitted to remove them. The arp command executes the -d option to be used with
    a valid host or IP address entry. In the example, the host durer is removed from
    the ARP table and the arp command displays the deleted entry:


    ```

    # arp -d durer

    durer (10.0.2.126) deleted

    ```


    If the ARP table were now displayed, the durer entry would not be listed.'
  merge: -1
  pgno: 110
- img_proc: true
