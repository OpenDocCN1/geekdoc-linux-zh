    the directory called gw-1. As you can see, this can be useful in managing a large
    installation of monitored devices and interfaces because each interface may be
    saved to its own location. The directory specified with the Directory command
    must exist before MRTG is run because MRTG will not create it. If MRTG is run
    before this directory exists, it will produce an error message and abort.

    The options keyword provides further capabilities to customize the way the MRTG
