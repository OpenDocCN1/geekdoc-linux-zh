  md: '# TRACEROUTE Tool


    Software Availability


    This command is standard on Solaris 2.7 and is available in the public domain
    for HPUX, Linux, previous versions of Solaris, and other Unix platforms. The source
    is also available and can be com-iled on many other Unix platforms as well.


    General Description


    The traceroute command is used to examine and record the path to a specified network
    destination. Within a traditional IP net-work, one or more routers provide connectivity
    between different IPs. IP routers come in all kinds of shapes and sizes from a
    simple-home Unix system with two interfaces to an industrial-strength Cisco router
    series that contains a large number of interfaces. In each of these cases, the
    routing function is primarily the same; it forwards IP packets from one interface
    to another based on established routing information. The traceroute command uses
    the time-to-Live (TTL) field contained with an IP packet and attempts to obtain
    an ICMP TIME_EXCEEDED message. Coupled with an attempt to attach to the destination
    at an unreachable port, it will cause a systematic response from every router
    along the path to the ultimate destination. It accomplishes this task by sending
    out requests (or probes) with a TTL of 1 and increases it by 1 until it either
    reaches the desired host or it exceeds the maximum TTL value. By default, the
    TTL is set to 30 hops, but this can be changed using a command line option.


    This command has a large number of command line options, but the only required
    argument is a hostname or IP address of the destination. For example, to display
    the IP path between the local system running traceroute and the destination system
    called vermeer, issue the following command:


    ```

    # traceroute vermeer

    ```


    Figures 4.3a and 4.3b show a sample network that consists of one router and two
    network nodes. When the above traceroute command is executed on monet, the following
    output will be displayed:'
  merge: -1
  pgno: 174
- img_proc: true
