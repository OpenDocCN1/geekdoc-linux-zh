  md: '# Snmpstatus


    The snmpstatus command obtains important information from an SNMP network entity
    using snmpget command. The syntax of the command is:


    snmpstatus host community


    When the remote agent utilizes the generic community string of public, it may
    be dropped from the SNMP commands, because public is used by default. When this
    command is used against a device, it displays the following information:


    +   * The IP Address of the device

    * The SysDesc MIB Object

    * The sysUpTime MIB Object

    * The number of packets received and transmitted on all active interfaces (i.e.,
    the sum of ifInUCastPkts.* and ifNUCastPkts.*)

    * The number of IP packets received and transmitted (i.e., ipInReceives.0 and
    ipOutRequests.0)

    * The number of active interfaces

    * The number of interfaces that have been disabled


    Thus, running this command on a device called switch-2200:


    ```

    snmpstatus switch-2200 private

    ```


    will reveal the following:

    [10.0.2.240]->[Model: LinkSwitch 2000, h/w rev: 02-03, s/w rev: 07-01-00] Up:
    90:23:02

    Interfaces: 17, Recv/Trans packets: 8 are down!

    Using this tool is a good way to obtain a quick snapshot of a network device without
    knowing a lot about the device or some of the specific MIB objects to poll. As
    you can see, the device is a LinkSwitch 2000 (made by 3Com) running version 7.1
    of the switching software. The device has been running for 90 hours and 23 minutes.
    Notice that snmpstatus has detected eight interfaces'
