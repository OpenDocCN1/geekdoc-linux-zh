- img_proc: true
  md: 'The growright option will cause data to be added from the right side of the
    graph instead of from the left, which is the default behavior. This also reverses
    the x-axis value for all graphs.


    With MRTG, all the monitored values, by default, are displayed in bytes. With
    the bits option, these values may be displayed in bits instead. This has a profound
    impact on graphs as the graph of only bytes. The noinfo and nopercent keywords
    are used to suppress information from the MRTG report. In the case of noinfo,
    neither uptime nor additional information will be displayed. The nopercent keyword
    is used to withhold calculated percent information from the graphs.


    The gauge switch is used to treat gathered values rather than increments to the
    values displayed in previous polls. This is useful for monitoring information
    related to disk space, processor utilization, and the number of users on a system.
    The gauge option is used in the disk space-monitoring example provided below.
    The absolute switch is used for data sources that reset their value when they
    are read. This indicates that MRTG doesn''t need to calculate the difference between
    the present value and the previous polled value. The absolute value is divided
    by the elapsed time between the last two polls, which makes it quite different
    from the gauge values previously discussed.


    # Special Target Names


