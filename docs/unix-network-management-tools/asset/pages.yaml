  md: '# Preface


    This book addresses network management from a tools perspective and is meant to
    be a guide to effective management of an enterprise network that may consist of
    Unix workstations, servers, and other networking components such as switches,
    routers, and hubs.


    During the past few years, enterprise networks have become the critical link and
    integral part of the information systems landscape. Gone are the days when connectivity
    between users was optional and network failures were a normal part of computing.
    In many corporations and institutions, a network outage or delay can have serious
    implications for the organization''s ability to conduct normal business activities
    or communicate with their customers. In the financial community, even a relatively
    short network outage can result in significant financial impact.


    Today''s corporate and institutional networks are characterized by significant
    growth in the diversity and number of systems attached to these networks. This
    is known as heterogeneous networking and is quite common. It is difficult to effectively
    manage the many computers, peripherals, and core devices because much of it must
    be done manually. A critical system or network failure can significantly impact
    the use of corporate services and affect the day-to-day operations of an organization.
    Many networks have also been deployed with very little regard concerning their
    manageability or upgrade capabilities. This makes the task of network management
    that much harder due to the added requirements of legacy systems.


    Also, with the widespread acceptance of the Internet as the primary external communication
    vehicle for many corporations, maintaining network up-time is even more critical
    because users and customers are accustomed to instant access to information and
    services. With the small number of steps involved in accessing a site from any
    location in the world, a disconnection from the Internet could mean lost revenue
    opportunities if customers choose a competitor''s site.


    Due to the explosive growth in the networking industry, the computing landscape
    is filled with various computing platforms and systems from many different vendors.
    Thanks to the TCP/IP protocol suite, many kinds of comput-'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Preface


    ing systems and devices can be connected to the network ranging from large mainframe
    systems to small hand-held devices. With TCP/IP many of these systems share common
    services and provide a framework for connectivity. Also, with common implementation
    of network management protocols among these systems, a standard network management
    model can be deployed.


    This book will give you the knowledge of critical tools and necessary skills to
    aid in systems and enterprise network management. The fundamental importance and
    goal of this book is to provide information on public domain tools and related-system
    utilities to manage a TCP/IP enterprise.


    # Audience


    The primary audience for this book is the network manager and system administrator.
    However, others will find the book useful because it deals with fundamentals of
    network management and specific networking management protocols. Although the
    book isn''t a complete introductory text, it does provide a launching point for
    those faced with supporting Unix networks in the real world. The text focuses
    more on tools than detailed descriptions of protocol operations, network management
    design, or architecture. At a minimum, the reader should be familiar with the
    basics of the Unix operating system and feel comfortable executing commands and
    accessing special files. Users unfamiliar with these subjects might consider examining
    the other titles in the series. A basic understanding of networking is also assumed.


    # Unix Versions


    All of the tools discussed and examples provided have been used on the Solaris
    2.5, 2.6, and 2.7 Unix operating systems. Because many of the tools are available
    across a wide variety of Unix versions, the reader will have little difficulty
    adapting and using the tools on his version of Unix. The tools for the most popular
    Unix versions can be found on the CD-ROM contained in this book.


    # Acknowledgments


    Special thanks to my wife Virginia for her help and witty supportive satire during
    the entire book development process. Also to Lisa, Matthew, and Joshua for understanding
    the time requirements and giving me the opportunity to'
