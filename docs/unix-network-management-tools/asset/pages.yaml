- img_proc: true
  md: 'requests waits for valid ICMP replies. Because ICMP is a required protocol
    within the TCP/IP family, ping can generally be found on every device that supports
    TCP/IP. The ping tool is a client side application only; no additional software
    is needed nor for it to function and interact directly with the remote system''s
    protocol layer to accomplish its task.


    # Determine System Availability


    The ping tool can be used to determine general availability of any TCP/IP device.
    For example, to determine if the host rembrandt is reachable, issue the ping command:


    ```

    # ping rembrandt

    rembrandt is alive

    ```


    In this case, ping reports that rembrandt is alive. This message generally means
    that the TCP/IP software is operational. Although “alive” indicates that the system
    is visible on the network, it is no guarantee that other network services, such
    as FTP or TELNET, are available. This is an important distinction. The ping tool
    can only be used to determine basic protocol connectivity—not the availability
    of higher-level applications or services. In fact, some systems will answer a
    ping even before they are fully booted. Keep in mind that no single piece of software
    is available that will determine every TCP/IP application or service is installed
    and operating on a system.


    If the host rembrandt is not reachable, ping will issue the following message


    ```

    no answer from rembrandt

    ```


    Normally, ping issues ICMP requests for approximately 20 seconds, and if no reply
    is received, generates the message shown above. The time-out value can be altered
    by providing an argument after the hostname. The command below will continue to
    issue requests up to a minute (or until the host responds) before reporting the
    host''s status:


    ```

    # ping rembrandt 60

    ```


    This is useful when a host requires additional time, perhaps because it is in
    the boot process, before it can respond to the request.'
