  md: '# Simple Network Management Protocol


    The Simple Network Management Protocol (SNMP) provides the low-level framework
    for many network management systems. SNMP is widely implemented and can be found
    in a large variety of different networking devices, software, and systems. Today,
    SNMP is considered the management protocol of choice for network hardware vendors,
    software application developers, and end-users.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Why is SNMP so popular? First, SNMP is simple to implement as compared to other
    network management architectures or protocols. The protocol, MIBs, and associated
    framework can be run on anything from low-end personal computers (PCs) to high-end
    mainframes, servers, and network devices such as routers and switches. An SNMP
    agent component doesn''t need to occupy a large footprint in terms of memory and
    doesn''t require significant processing power. SNMP can generally be developed
    very quickly on target systems, thus increasing the time-to-market for new products
    and enhancements. When SNMP was first introduced, other management mechanisms
    were available, but SNMP proved to be more flexible and easier to implement. It
    is true that SNMP lacks certain features found in other network management protocols
    (such as OSI, for example), but by its simple design, extensibility, and ease
    of use minimize any possible drawbacks.


    Second, SNMP is free and in the public domain. As a result, no single vendor can
    claim ownership of the protocol nor can it be copy protected by any company or
    individual. The only way to influence or change SNMP is via the standards process
    of the Internet Engineering Task Force (IETF), which can be a daunting task. The
    IETF is one of the standards bodies for the Internet. Vendors may choose to make
    proprietary changes to SNMP, but this could prove futile because they must lobby
    other vendors and users to support their non-standard enhancements, which defeats
    the purpose of having a standard in the first place.


    Third, SNMP is well documented (via RFCs, articles, and text-books) and is well
    understood in the industry. This provides an established foundation for continued
    enhancement and adoption.


    Finally, SNMP can be used to control a variety of devices. It is even finding
    its way into non-traditional equipment such as telephone systems, environmental
    control equipment, and just about anything else that can be attached to a network
    and requires control.


    # SNMP Operation


    SNMP defines the packet format and information exchange between a network manager
    and associated agents. At its core, SNMP manipulates objects within the MIB of
    the agent and as a'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# SNMP Operation


    result, can be used to manage a variety of tasks that are defined within the agent.
    The SNMP protocol and related components are described in a number of RFCs. Any
    SNMP-compliant agent can communicate with any network management system that supports
    SNMP. The management system knows what questions to ask the agent because it has
    a copy of the agent''s MIB.


    One of the reasons SNMP is considered simple because it provides three general-purpose
    operations that can be applied to objects. These operations, or commands, are
    at the heart of SNMP; they are Set, Get, and Trap.


    Set: A management system may update or change the value of an object that is contained
    in an agent. The set operation is a privileged command because it can be used
    to alter device configuration or control its operating state.


    Get: A management system may obtain or read the value of an object that is contained
    within an agent. The get command is the most common SNMP operation because this
    is the primary mechanism used to obtain management information from network devices.


    Trap: An agent may send an unsolicited message to a network manager. The purpose
    of the trap service is to notify a network management system of a special condition
    or problem without the management system specifically requesting this information.


    SNMP defines the relationship and message flow between manager and agent with
    respect to set, get, and trap messages as shown in Figure 2.1. As you can see,
    in most instances the SNMP manager is directing the message exchange with the
    agent. However, the agent has the ability to send asynchronous messages via the
    trap operation without being polled.


    SNMP doesn''t define any additional mechanisms for commands to device agents.
    The only actions that can be applied to MIB objects are to set or get a value.
    For example, there is no reboot command defined in SNMP. Instead, agent software
    can implement specific commands by associating MIB objects with the internal commands
    of the device. To reboot a device, the management station would set a specific
    MIB object to 1, for example. This would signal the agent to reboot the device
    and reset the MIB reboot object to its previous state.'
  merge: -1
