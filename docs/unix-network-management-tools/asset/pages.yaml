    After this has been done, additional ifconfig commands can be used to configure
    one or more pseudo interfaces. To configure a pseudo interface, combine the physical
    interface with a logical interface number reference separated by a colon: For
    example, to configure the first logical interface for le0, use the following-command:


    ```

    # ifconfig le0:1 128.191.2.1 netmask 0xffffff broadcast +

