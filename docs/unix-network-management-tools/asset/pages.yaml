    # ARP Cache


    At first glance, the ARP service may seem inefficient since it will send a broadcast
    packet each time a device wishes to communicate with another. However, ARP implementations
    include the use of an ARP cache to temporarily store address bindings from previous
    ARP requests. In fact, before an ARP request is made, the high-level software
    scans the ARP cache to see if the required datalink address mapping already exists
    in the cache. If it does, the existing binding is used, otherwise the ARP request
    is sent. As a result of the cache, network traffic is reduced because ARP requests
    are only made when devices are not in the cache. Also, application performance
    is improved by the sender''s ARP request can be satisfied by using the cache instead
    of transmitting a packet on the network. Finally, the cache provides the administrator
    with a way to view connectivity between the high-level protocols and the network
    hardware. As we will see later in this book, inspecting the ARP cache can be a
    powerful way to troubleshoot network and system problems.


    One interesting question regarding the ARP cache: when should the bindings be
    discarded from the cache? The answer is not simple. If we presume to keep the
    ARP cache populated with entries'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'forever (or until the system is restarted), the possibility exists that the
    cache will contain invalid information. Consider, for example, Node X and Node
    Y are communicating when Node Y''s network interface card (NIC) fails and is subsequently
    replaced. The new NIC will contain a new datalink address, unless the administrator
    has changed it after installation. As a result, Node X can''t talk to Node Y any
    longer because Node X''s cache contains invalid binding to Node Y''s datalink
    address. On the other hand, we can take the approach that binding in the ARP cache
    should expire in a relatively short period of time, 30 seconds. Unfortunately,
    this will adversely affect network performance because more network broadcasts
    will be needed because the ARP cache will be very small. However, it will address
    the problem of the incorrect bindings for NIC that have recently been replaced
    because the old entry would have been purged before the new NIC was operational.


    Perhaps the best solution to this problem can be described by taking the middle
    of the road approach. That is to say, the binding expiration shouldn''t be too
    small to be ineffective, but also not too long to address changes in the network.
    In general, most systems will delete ARP entries in approximately 20 minutes.
    Some versions of Unix also permit the administrator to change the ARP timeout
    to suit their individual network requirements.


    # Datalink Address Format


    As indicated, datalink addresses are expressed in 48-bits (6 bytes) and are separated
    by colons. This colon notation is used as the primary method to represent these
    hardware addresses. Many Unix tools, for example, use this format. Datalink protocol
    addresses for FDDI, Ethernet, and Token Ring contain a vendor code identification
    and serial number. This information can be used in node for inventory purposes.
    The IEEE registry authority assigns the vendor portion to any organization that
    produces networking hardware and has requested a vendor code. These codes are
    also referred to as organization unique identifiers (OUI). The first three bytes
    of the address represent the manufacturer or vendor of the device and the remaining
    bytes represent the serial number of the unit as depicted in Figure 3.17.'
