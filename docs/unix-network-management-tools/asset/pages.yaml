    To ensure that MRTG captures consistent and complete infor- m from the monitored
    devices, the mrtg program must be run at regular intervals. One of the best ways
    to do this is to use the cron facility. Since the daily graph, which is available
    on the MRTG report, is averaged over a five-minute period, it is reason- that
