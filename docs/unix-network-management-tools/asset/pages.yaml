    # Changing Operational Characteristics


    The traceroute command contains a number of operational parameters that can be
    modified to affect how a trace paths to the specified destination. Each of these
    parameters has an associated command line that can be used to alter its default
    values. These options are listed in Table 4.15.


    # Table 4.15 Traceroute Operational Characteristics


    | Option | Description |

    |---|---|

    | -i | Specify an alternate interface |

    | -p | Set the alternate port to probe packets |

    | -g | Set a router for loose source routing |

    | -f | Set the initial TTL value to be used |


    (Cont’d)'
