    # Host-to-Host Layer


    The host-to-host layer, or OSI network layer, is responsible for providing a robust
    data delivery mechanism between different network entities. The standard that
    provides this service is the transmission control protocol (TCP). Within a network,
    data can be lost or destroyed when transmission errors or network hardware failures
    occur. Data can also be delivered out of order and with significant delays before
    reaching the final destination. TCP was designed and developed to address these
    types of network related problems. TCP is responsible for ensuring that data arrives
    in the correct order and free from errors. It accomplishes these tasks by providing
    the following services:


    # Virtual Connections


    TCP provides a virtual connection interface to the network that is analogous to
    the way phone calls are established in the telephone network. Conceptually, a
    user calls another machine to request data transfer. After all the details of
    the connection setup are complete, data transmission can be made between applications.
    From an application perspective, the TCP connection looks and behaves as if a
    dedicated hardware link has been established. However, this is only an illusion
    provided by the TCP streams interface.'
