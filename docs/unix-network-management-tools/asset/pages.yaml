  md: '# Table 4.13 Operational Options List


    | Option | Description |

    | - | - |

    | -b | Number of bytes of data to include in the ping request |

    | -B | This option followed by a value is used to determine the delay time that
    fping uses when waiting for replies. The value is used as a multiplier and must
    be given in floating point format |

    | -c | Determines the number of requests sent to each target |

    | -C | Similar to -c, but per-target statistics are displayed in a format that
    is easier to parse |

    | -f | Obtain list of targets from specified file. This is restricted to the root
    user. Regular users should use file redirection instead of this option |

    | -l | Send an indefinite amount of requests to target. Can be stopped by ^C (control-c)
    |

    | -p | Set the amount of time in milliseconds that fping will wait between successive
    packets for a target. This is only meaningful with -1, -c, or -C options |

    | -r | The number of attempts that will be made at pinging a specified target.
    The default value is 3 |

    | -t | The amount of time to wait for the first response to the initial packet
    request. The default is 500 milliseconds |


