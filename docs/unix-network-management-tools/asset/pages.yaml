    | -c | Sets the clock values |

    | -m | Specifies a list of MIB modules to load |

    | -M | Specifies a list of directories to search for MIB files |

    | -p | Uses the specified port to communicate with agent |

    | -r | Specifies the number of retries |

    | -R | Requests random access to the agent MIB table |

    | -t | Specifies the timeout between retry attempts |

    | -v | Specifies the protocol version |


    MIBs. Using this approach, the system.sysContact MIB object may be entered as
    sysContact—without the system group name. To specify a single search of a MIB
    object, because it might appear more than once, specify the name of the MIB followed
