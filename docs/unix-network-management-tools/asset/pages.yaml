    Transmission of an SNMP Message

    The following series of events occurs when a network manager formulates an SNMP
    message:


    +   1. The basic PDU is constructed.

    2. The PDU is passed to the security service layer if available.

    3. The protocol layer formats the message, including the version and community
    information.

    4. The entire message is now encoded using ASN.1 rules.

    5. The message is passed to the transport service so that it will be delivered
    to the receiving entity.

    The following series of events occurs when an agent device receives an SNMP message:

    1. A basic check is performed to ensure the message is formatted correctly. The
    message is discarded if any errors are encountered.

    2. The protocol version information is verified. If there is a mismatch, the message
    is discarded.

    3. The security service attempts to verify the sending entity. If this fails,
    a trap is generated and the message is discarded.'
