    # Table 7.4 Options Boolean Switches


    | Option | Description |

    | growright | Causes graphs to grow from the right |

    | bits | Changes the bits per byte |

    | noinfo | Suppresses uptime and device information |

    | nopercent | Suppresses usage percentage information |

    | gauge | Treats poled values as absolute and not incrementing counters |

