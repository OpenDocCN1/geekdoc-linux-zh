  md: '# Table 7.5 Predefined SNMP MRTG Objects


    | SNMP Object | Object Information |

    | ifOperStatus | The current operational state of the interface |

    | ifAdminStatus | The current administrative state of the interface |

    | ifInOctets | The total number of octets received on the interface, including
    framing characters |

    | ifInUcastPkts | The number of subnetwork-unicast packets delivered to a higher-layer
    protocol |

    | ifInNUcastPkts | The number of non-unicast (i.e., subnetwork-broadcast or subnetwork-multicast)
    packets delivered to a higher-layer protocol |

    | ifInDiscards | The number of inbound packets that were chosen to be discarded
    |

    | ifInErrors | The number of inbound packets that contained errors preventing
    them from being a higher-layer protocol |

    | ifInUnknownProtos | The number of packets received via the interface that were
    discarded because of an unknown or unsupported protocol |

    | ifOutOctets | The total number of octets transmitted out of the interface, including
    framing characters |

    | ifOutUcastPkts | The total number of packets that higher-level protocols requested
    be transmitted to a subnetwork-unicast address, including those that were discarded
    or not sent |'
