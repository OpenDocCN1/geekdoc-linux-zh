- img_proc: true
  md: '# Web Enabled Network Management Tools


    As the previous chapter discusses network management tools and utilities (largely
    for the Unix command line), this chapter focuses on network management tools that
    provide a Web interface. No one can discount the significant impact the Web has
    had on applications development, specifically in the area of network management.
    Because of the immense popularity of the Web, it is reasonable to include some
    tools that can be used with common browsers.'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'These tools include both SNMP and non-SNMP based software. Non-SNMP tools have
    been selected for those sites that have yet to implement SNMP functionality or
    just need a system tool that can be implemented without a lot of fuss. For those
    who are already using SNMP, the tools in this section will be a welcome addition
    to any existing suite of software.


    This section includes the following tools:


    +   - MRTG

    - NTOP


    # MRTG


    General Description

    The Multi Router Traffic Grapher (MRTG) is a tool that can be used to monitor
    and graph network traffic obtained from networking devices that use SNMP. As the
    name implies, it displays traffic utilization and other statistical information
    gathered from routers and other networking devices. It generates HTML pages and
    GIF images, providing a visual representation of network performance via a Web
    browser. Network performance is one of the most important aspects of network management.
    This tool will make it easy to pinpoint device and network performance problems.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_297_0.png)


    Figure 7.1 Remote Office Network.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'For example, given the network topology shown in Figure 7.1, MRTG can be used
    to monitor the network from the remote router call remote-gw. Because this network
    is critical, it is important to monitor the network traffic going to and from
    the router. Specifically, it is important to monitor the serial interface and
    both Ethernet interfaces to ensure they do not become overloaded.


    Because MRTG can monitor any router or networking device that supports SNMP, it
    can be put to use both edge and backbone routers as well as other devices. The
    primary method MRTG uses to collect information is the snippet command. However,
    MRTG can be customized to display information derived through other means as well.
    For example, MRTG can be used to display Unix system load and disk space utilization.
    Further, because MRTG can poll any SNMP MIB object, many additional performance
    metrics and MIB object polls can be made. As a result of these capabilities, there
    are many practical uses for MRTG, including, but not limited to the following:


    +   * Displaying system CPU load on networking devices

    * Displaying system memory utilization on network devices

    * Displaying modem usage on remote access servers


    Conceptually, MRTG polls specific performance MIB objects from devices and displays
    the data in a graphical format using HTML. The operation of MRTG is shown in Figure
    7.2.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_298_0.png)


    Figure 7.2 Basic Operation of MRTG.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Web Page Overview


    MRTG displays the results of network performance polls in a series of graphs,
    along with other additional device information for each monitored interface. A
    total of four graphs is provided, showing bytes per second in Daily, Weekly, Monthly,
    and Yearly averages. Figure 7.3 shows only a MRTG report, containing some device
    information plus the Daily usage graph.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_299_0.png)


    Figure 7.3 MRTG Web Report.


    This report includes information that was obtained via SNMP from the MIB-II system
    and interface groups from the device remote-gw. The System is derived from the
    sysName and sysLocation objects while the Maintainer field was obtained from the
    sysContact object. The Interface string represents the hardware interface contained
    within the device and the number (1) indicates that this is the first interface.
    Notice in the above example that the interface is labeled Ethernet0, which means
    that this is the first interface on the device. It is labeled this way because
    Cisco routers always number their interfaces starting at zero. The IP string indicates
    that no associated hostname was found for the'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'IP address of this device. This is not really a problem because, most of the
    time, connectivity to many networking devices is via the IP address, not the hostname.


    The Max Speed field is calculated from the ifSpeed object that was divided by
    eight. This represents the maximum number of bytes per second the interface can
    theoretically support. The value of eight was selected because there are eight
    bits in a single byte. The Max Speed field also confirms that this interface is
    Ethernet by displaying the type as ethercmacd, which is derived from the ifType
    object. The report also displays the date and time the report was updated and
    how long the device has been running since it was last rebooted or when the network
    management component of the device was last reset.


    The Daily graph shows bytes per second over an approximate 36-hour period using
    a 5-minute average. This average is the difference between each successive poll
    of bytes transmitted or received, not cumulative totals or raw counts. In other
    words, the displayed value is the difference between the current and previous
    values divided by the time elapsed between these readings. The horizontal (x-axis)
    shows time in 2-hour increments, while the vertical (y-axis) shows bytes that
    range from 0 to a given maximum value. The graph displays bytes transmitted in
    and out of the interface, from ifOutOctets and ifInOctets MIB objects, respectively.


    The bottom of the report shows the legend; in this case, incoming traffic is displayed
    in green while outgoing traffic is displayed in blue. However, because this book
    is in black and white, the green in the graph appears gray and the blue appears
    black. Later on, we will show how to change the colors used in the graphs. Also,
    the bottom of the graph contains a short summary that lists the maximum, average,
    and current incoming and outgoing bytes per second. Using the customization options
    available with MRTG, these colors, as well as many other report and graph attributes,
    may be changed. Consult the MRTG customization section below for additional information.


    In a complete MRTG report, additional graphs for Weekly, Monthly, and Yearly totals
    are also included. The Weekly graph contains weekly averages for the past seven
    days, with the current'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'day displayed on the left. The Monthly report shows the last five weeks, with
    the current week on the left and the previous weeks to the right. The data in
    this graph has been averaged over a two-hour period. The Yearly graph spans the
    last 12 months, with the current month shown on the left, and shows the data as
    a daily average. These three graphs are shown in Figure 7.4.


    ![](img/0790df3a82cfb96e70cab5a9d94c0bd0_301_0.png)


    Figure 7.4 MRTG Weekly, Monthly, and Yearly Reports.


    As you can see, all the graphs can grow from the left, which is the default. By
    enabling one of the MRTG command options. Also by default, the report pages are
    updated automatically every five minutes when new information is obtained for
    each of the monitored interfaces. This update interval (or refresh rate) can be
    customized as well. MRTG customization and configuration are discussed in the
    next section.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Basic Configuration of MRTG


    MRTG uses a configuration file to specify which devices are to be monitored. The
    MRTG package doesn''t come with a predefined configuration because the devices
    listed wouldnt likely match those at your site. Instead, the package includes
    a utility program cfgmaker, which is used to build a basic configuration so you
    don''t have to poll a network device for specific SNMP objects (e.g., interfaces)
    and build a configuration file suitable for MRTG. The syn-tax of cfgmaker is:


    ```

    cfgmaker community@device

    ```


    Two arguments are required—the device''s community string and hostname (or IP
    address). Because cfgmaker writes to ST-OUT, the output should be redirected to
    a file when you want to save the results. To illustrate the use of this utility,
    let''s assume that we want to monitor a single router in a remote office. In this
    case, we have a Cisco 2500 router, called remote-gw with a community string of
    louvre. The command is:


    ```

    cfgmaker louvre@remote-gw >> cisco.conf

    ```


    builds the MRTG configuration file and calls it cisco.conf. Assuming the arguments
    provided to the cfgmaker are correct and the device responds to the SNMP requests,
    Listing 7.1 shows the configuration that was generated (minus any comments) by
    the cfgmaker script:


    # Listing 7.1 Sample Configuration File


    ```

    Target[10.0.2.75]: 1:public@10.0.2.75

    MaxBytes[10.0.2.75]: 1249994

    Title[10.0.2.75]: remote-gw (No hostname defined for IP addressnnnet0

    PageTop[10.0.2.75]: <H1>Traffic Analysis for Ethernet0

    </H1>

    <TABLE>

    <TR><TD>System</TD><TD>remote-gw in Graphics Lab 11-B</TD></TR>

    <TR><TD>Maintainer:</TD><TD>Steve Maxwell</TD></TR>

    <TR><TD>Interface:</TD><TD>Ethernet0(1)</TD></TR>

    <TR><TD>IP:</TD><TD>No hostname defined for IP address

    ```


    (Cont''d)'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Listing 7.1 Sample Configuration File (Cont''d)


