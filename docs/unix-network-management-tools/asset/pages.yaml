    # UCD''s SNMP Agent


    General Description

    The UCD Agent (snmpd) is a very powerful, extensible, fully functional SNMP system
    agent and is available on a large number of Unix platforms. See the Installation
    section for a list of specific platforms that are supported. As previously mentioned,
    the agent supports the MIB-II (network statistics), SNMPv2 MIBs, SMUX MIB, Host
    Resource MIB, and the UCD-SNMP MIB. These MIBs by default are located in the /usr/local/share/snmp/libs
    directory. The agent will still function correctly if it is unable to locate these
    files.


    From a network management perspective, the agent can be used to monitor critical
    system operating parameters (such as system load average) and provide alerts when
    these resources reach a critical threshold. The agent can be used to:


    +   - Monitor disk space usage

    - Monitor system processes

    - Monitor system load

    - Invoke Unix commands and shell scripts

    - Monitor agent information and status

    - Provide MIB extensions

    - Provide access to several MIBs


    Each of these features will be explored in greater detail to include how to configure
    the agent to monitor these resources and how to proactively address system resource
    limitation problems.


    # Agent Configuration File


    The agent requires a configuration file to operate. This file, by default, is
    located in the /usr/local/share/snmp directory. It con-'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# UCD SNMP Agent


    tains one or more action directives and each line contains a single keyword with
    an associated number of arguments. The keyword can be divided into one of the
    following categories: monitor, security, extensible, and informational. The monitoring
    directives include those used to monitor specific resources such as disk space
    or system load. Security keywords are used to define various layers of security
    for access to the agent, which may include ACL (access control lists) and various
    views of the MIB objects. The extensible keywords define ways to add functionality
    to the agent without changing the agent software. Finally, the informational keywords
    are used to assign static information to MIB objects. Each of the keywords has
    a fixed number of required parameters and may have additional optional arguments
    as well. Table 5.6 lists the supported keywords and functions sorted by the category
    to which they belong.


    Table 5.6 UCD Agent Keywords Sorted by Category


    | Category | Keyword | Description |

    | --- | --- | --- |

    | Monitor | proc | Checks to make sure specified processes are running |

    | | disk | Determines available disk space of specified file system |

    | | load | Monitors system load average |

    | Security | com2sec | Security Configuration Parameter |

    | | group | Security Configuration Parameter |

    | | view | Security Configuration Parameter |

    | | access | Security Configuration Parameter |


    (Cont’d)'
