  md: '# UCD''s SNMP Agent


    # Extending the Agent


    One of the most powerful features of the UCD agent is that it can be extended
    to include execution of external commands. These commands can either be shell
    scripts or binary programs, which are specified as part of the agent configuration.
    The output of these commands is captured within the MIB so that the information
    can be made available via SNMP requests. Still, the agent supports the concept
    of passing control of part of a MIB tree to an external program. When this program
    is executed, it can access the specified MIB tree. This gives the agent the ability
    to dynamically alter MIB objects, without requiring custom agent development.


    To invoke external Unix commands or shell scripts from the agent, use the exec
    keyword command. The syntax of this command includes:


    ```

    exec label program [args]

    exec MIB program [args]

    ```


    In the first form, the exec command is used with a label, program, and optional
    arguments. The label is used as an identifier, which is useful when perusing the
    agent''s MIB. The program is the actual Unix binary or shell script that the agent
    will invoke with any specified command line arguments listed in the args field.
    When the agent executes this command, the output is placed in the agent''s MIB
    under the extEntry table. In the example below, the exec command uses the who
    command to determine the run level of the local system:


    ```

    exec runlevel /usr/bin/who -r

    ```


    When the agent invokes this command, the output is placed in the agent''s MIB
    and is available for viewing. Using a snmpwalk tool, the following sample output
    was obtained from the:


    ```

    enterprises.ucdavis.extTable.extEntry.extIndex.1 = 1\enterprises.ucdavis.extTable.extEntry.extNames.1
    = "runlevel"\enterprises.ucdavis.extTable.extEntry.extCommand.1 = "/usr/bin/who
    -r"\enterprises.ucdavis.extTable.extEntry.extResult.1 = 0\enterprises.ucdavis.extTable.extEntry.extOutput.1
    = "  . run-

    level 3 Dec 21 10:44 3 0 S."\enterprises.ucdavis.extTable.extEntry.extErrFix.1
    = 0

    ```'
