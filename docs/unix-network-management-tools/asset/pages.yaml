  md: '# Management Information Base MIB


    The structure of the interface group is shown in Figure 2.3 on page 30. Tables
    are used to contain interface information because networking devices can contain
    many interfaces. For example, a router or switch device can contain literally
    dozens of interfaces, often representing different network protocols as Ethernet,
    ATM, or FDDI. Using a table provides a straightforward and convenient way to access
    individual objects within a given interface definition.


    The interface group includes the ifNumber object, which contains the total number
    of network interfaces within the networking device. Using the example data contained
    in Table 2.3 on page 31, the ifNumber value would be 2. In this case, the device
    reports two interfaces: one a pseudo-interface and the other defined as an Ethernet.
    It is common for networking devices to contain a pseudo-interface for internal
    diagnostic purposes.


    The rest of the Interface group consists of a table called ifTable, which contains
    a row for each interface defined within the device. This table is indexed by ifIndex,
    which contains the value between the range of 1 and the value of ifNumber. The
    ifIndex object uniquely addresses each column of the table or interface.


    Each row corresponds to each of the specific MIB objects contained within the
    ifEntry table. Table 2.3 shows the entire interface group in the first column
    and associated values taken from an actual network device in the remaining rows.
    Each ifEntry instance represents an interface defined in the table. To access
    the object ifDesc for the first interface, one would use the identifier (OID):


    1.3.6.1.2.1.2.2.1


    or


    iso.org.dod.internet.mgmt.mib-2.ifTable.ifEntry.ifDescr


    The objects starting from IfInOctets to IfOutQlen represent traffic counters within
    the agent for device interfaces and can be used to measure network and device
    performance.'
