  \n^([2]) 答案是否。\n\n# 第 12 章。处理 Excel 电子表格\n\nExcel 是 Windows 上一种流行且强大的电子表格应用程序。`openpyxl`\
  \ 允许你的 Python 程序读取和修改 Excel 电子表格文件。例如，你可能有一项枯燥的任务：从一个电子表格复制某些数据并粘贴到另一个中。或者你可能需要遍历数千行，根据某些标准挑选出少数几行进行小编辑。或者你可能需要查看数百份部门预算表格，寻找任何赤字预算。这些正是\
  \ Python 可以为你完成的枯燥、机械的表格任务。\n\n尽管 Excel 是微软的专利软件，但在 Windows、OS X 和 Linux 上都有免费的替代方案。LibreOffice\
  \ Calc 和 OpenOffice Calc 都支持 Excel 的 `.xlsx` 表格格式，这意味着 `openpyxl` 模块也可以处理这些应用程序生成的表格。你可以分别从\
  \ `https://www.libreoffice.org/` 和 `http://www.openoffice.org/` 下载软件。即使你的电脑上已经安装了\
  \ Excel，你可能会发现这些程序更容易使用。不过，本章中的截图全部来自 Windows 7 上的 Excel 2010。\n\n## Excel 文档\n\n\
  首先，让我们回顾一些基本定义：Excel 表格文档被称为 `workbook`工作簿。单个工作簿保存在扩展名为 `.xlsx` 的文件中。每个工作簿可以包含多个\
  \ `sheets`工作表（也称为 worksheets）。用户当前正在查看（或关闭 Excel 之前最后查看的）工作表被称为 `active sheet`活动工作表。\n\
  \n每个工作表都有 `columns`列（从字母 A 开始编号）和 `rows`行（从数字 1 开始编号）。特定列和行交叉处的框被称为 `cell`单元格。每个单元格可以包含一个数字或文本值。带有数据的单元格矩阵组成了一个工作表。\n\
  \n# 安装 openpyxl 模块\n\nPython 不带 OpenPyXL，因此你必须安装它。请遵循附录 A 中安装第三方模块的说明；模块的名称为 `openpyxl`。要测试是否安装正确，请在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import openpyxl\n```\n\n如果模块安装正确，此处不会产生任何错误信息。记住在运行本章中的交互式\
  \ shell 示例之前导入 `openpyxl` 模块，否则你将得到 `NameError: name 'openpyxl' is not defined`\
  \ 错误。\n\n本书涵盖了 OpenPyXL 2.1.4 版本，但 OpenPyXL 团队经常发布新版本。不过不用担心：新版本在相当一段时间内应保持与书中指令的向后兼容。如果你有更新的版本并想查看可以使用哪些额外功能，可以在\
  \ `http://openpyxl.readthedocs.org/` 查看 OpenPyXL 的完整文档。\n\n## 读取 Excel 文档\n\n本章中的示例将使用存储在根目录下的名为\
  \ `example.xlsx` 的表格。你可以自己创建该表格，也可以从 `http://nostarch.com/automatestuff/` 下载。图 12-1\
  \ 显示了三个默认工作表的标签页，名称分别为 `Sheet1`、`Sheet2` 和 `Sheet3`，这是 Excel 为新工作簿自动提供的。（创建的默认工作表数量可能会因操作系统和电子表格程序而异。）\n\
  \n![工作簿工作表的标签位于 Excel 的左下角。](img/httpatomoreillycom)\n\n## 使用 OpenPy 打开 Excel 文档\n\
  \n现在我们有了示例表格，让我们看看如何使用 `openpyxl` 模块来操作它。\n\n一旦导入了 `openpyxl` 模块，你就可以使用 `openpyxl.load_workbook()`\
  \ 函数。在交互式 shell 中输入以下内容：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> type(wb)\n<class 'openpyxl.workbook.workbook.Workbook'>\n```\n\n`openpyxl.load_workbook()`\
  \ 函数接收文件名并返回一个 `workbook` 数据类型的值。这个 `Workbook` 对象代表 Excel 文件，类似于 `File` 对象代表打开的文本文件。\n\
  \n记住，`example.xlsx` 需要在当前工作目录下才能对其进行操作。可以通过导入 `os` 并使用 `os.getcwd()` 来查找当前工作目录，可以使用\
  \ `os.chdir()` 更改当前工作目录。\n\n## 从工作簿获取工作表\n\n你可以通过调用 `get_sheet_names()` 方法获取工作簿中所有工作表的名称。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> wb.get_sheet_names()\n['Sheet1', 'Sheet2', 'Sheet3']\n>>> sheet = wb.get_sheet_by_name('Sheet3')\n\
  >>> sheet\n<Worksheet \"Sheet3\">\n>>> type(sheet) <class 'openpyxl.worksheet.worksheet.Worksheet'>\n\
  >>> sheet.title\n'Sheet3'\n>>> anotherSheet = wb.get_active_sheet()\n>>> anotherSheet\n\
  <Worksheet \"Sheet1\">\n```\n\n\n\n\n\n每个工作表由一个 `Worksheet` 对象表示，你可以通过向工作簿方法 `get_sheet_by_name()`\
  \ 传递表名称字符串来获取它。最后，你可以调用 `Workbook` 对象的 `get_active_sheet()` 方法来获取工作簿的活动工作表。活动表是在\
  \ Excel 中打开工作簿时显示在上面的工作表。一旦获取了 `Worksheet` 对象，可以通过 `title` 属性获取它的名称。\n\n## 从工作表中获取单元格\n\
  \n一旦你有了一个 `Cell` 对象，就可以通过其名称访问 `Cell` 对象。在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n>>> sheet = wb.get_sheet_by_name('Sheet1')\n\
  >>> sheet['A1']\n<Cell Sheet1.A1>\n>>> sheet['A1'].value\ndatetime.datetime(2015,\
  \ 4, 5, 13, 34, 2)\n>>> c = sheet['B1']\n>>> c.value\n'Apples'\n>>> 'Row ' + str(c.row)\
  \ + ', Column ' + c.column + ' is ' + c.value\n'Row 1, Column B is Apples'\n>>>\
  \ 'Cell ' + c.coordinate + ' is ' + c.value\n'Cell B1 is Apples'\n>>> sheet['C1'].value\n\
  73\n```\n\n`Cell` 对象有一个 `value` 属性，意不用说，它包含了该单元格存储的值。`Cell` 对象还具有 `row`、`column`\
  \ 和 `coordinate` 属性，用于提供单元格的位置信息。\n\n在这里，访问单元格 B1 的 `Cell` 对象的 `value` 属性将得到字符串\
  \ `'Apples'`。`row` 属性返回整数 `1`，`column` 属性返回 `'B'`，而 `coordinate` 属性返回 `'B1'`。\n\n\
  OpenPyXL 会自动解释 A 列中的日期，并将它们返回为 `datetime` 值而不是字符串。`datetime` 数据类型将在 第 16 章 中进行进一步解释。\n\
  \n通过字母指定列在编程时可能比较复杂，特别是因为在 Z 列之后，列开始使用两个字母：AA、AB、AC 等。作为替代方案，你也可以使用工作表的 `cell()`\
  \ 方法并通过其 `row` 和 `column` 关键字参数传递整数来获取单元格。第一行或列的整数是 `1`而不是 `0`。输入以下内容继续交互式 shell\
  \ 示例：\n\n```\n>>> sheet.cell(row=1, column=2)\n<Cell Sheet1.B1>\n>>> sheet.cell(row=1,\
  \ column=2).value\n'Apples'\n>>> for i in range(1, 8, 2):\n        print(i, sheet.cell(row=i,\
  \ column=2).value)\n\n1 Apples\n3 Pears\n5 Apples\n7 Strawberries\n```\n\n你可以看到，使用工作表的\
  \ `cell()` 方法并传递 `row=1` 和 `column=2` 可以获取单元格 `B1` 的 `Cell` 对象，这与指定 `sheet['B1']`\
  \ 的一样。然后，使用 `cell()` 方法及其关键字参数，你可以编写一个 `for` 循环来打印一系列单元格的值。\n\n假设你想遍历 B 列并打印每一个奇数行单元格的值。通过为\
  \ `range()` 函数的“步长”（step）参数传递 `2`，你可以获取每隔一行的单元格（在这种情况下，是所有奇数行）。`for` 循环的变量 `i` 被传递给\
  \ `cell()` 方法的 `row` 关键字参数，而 `2` 始终传递给 `column` 关键字参数。注意传递的是整数 `2`，而不是字符串 `'B'`。\n\
  \n你可以通过 `Worksheet` 对象的 `get_highest_row()` 和 `get_highest_column()` 方法确定工作表的大小。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> sheet = wb.get_sheet_by_name('Sheet1')\n>>> sheet.get_highest_row()\n7\n>>>\
  \ sheet.get_highest_column()\n3\n```\n\n注意，`get_highest_column()` 方法返回的是整数，而不是 Excel\
  \ 中显示的字母。\n\n## 列字母与数字之间的转换\n\n要从字母转换为数字，请调用 `openpyxl.cell.column_index_from_string()`\
  \ 函数。要从数字转换为字母，请调用 `openpyxl.cell.get_column_letter()` 函数。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> import openpyxl\n>>> from openpyxl.cell import get_column_letter, column_index_from_string\n\
  >>> get_column_letter(1)\n'A'\n>>> get_column_letter(2)\n'B'\n>>> get_column_letter(27)\n\
  'AA'\n>>> get_column_letter(900)\n'AHP'\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> sheet = wb.get_sheet_by_name('Sheet1')\n>>> get_column_letter(sheet.get_highest_column())\n\
  'C'\n>>> column_index_from_string('A')\n1\n>>> column_index_from_string('AA')\n\
  27\n```\n\n从 `openpyxl.cell` 模块导入这两个函数后，你就可以调用 `get_column_letter()` 并传递一个像 27 这样的整数来确定第\
  \ 27 列的字母名称。函数 `column_index_from_string()` 的的作用相反：你传递一个列的字母名称，它会告诉你是第几几列。使用这些函数不需要加载工作簿。如果你愿意，可以加载工作簿，获取一个\
  \ `Worksheet` 对象，并调用 `get_highest_column()` 等 `Worksheet` 方法来获取整数。然后你可以将该整数传递给 `get_column_letter()`。\n\
  \n## 从工作表中获取行和列\n\n你可以切片 `Worksheet` 对象来获取电子表格行、列或矩形区域的所有 `Cell` 对象。然后你可以遍历切片中的所有单元格。在交互式\
  \ shell 中输入以下内容：\n\n```\n >>> import openpyxl\n   >>> wb = openpyxl.load_workbook('example.xlsx')\n\
  \   >>> sheet = wb.get_sheet_by_name('Sheet1')\n   >>> tuple(sheet['A1:C3'])\n \
  \  ((<Cell Sheet1.A1>, <Cell Sheet1.B1>, <Cell Sheet1.C1>),\n    (<Cell Sheet1.A2>,\
  \ <Cell Sheet1.B2>, <Cell Sheet1.C2>),\n    (<Cell Sheet1.A3>, <Cell Sheet1.B3>,\
  \ <Cell Sheet1.C3>))\n```\n\n\n\n\n\n要访问某个特定的元组，可以通过它在较大元组中的索引来引用它。例如，要获取代表 B 列的元组，你可以使用\
  \ `sheet.columns[1]`。要获取包含 A 列中 `Cell` 对象的元组，你需要使用 `sheet.columns[0]`。一旦你有了一个代表某行或某列的元组，就可以遍历它的\
  \ `Cell` 对象并打印它们的值。\n\n## 工作簿、工作表、与单元格\n\n作为一个快速回顾，这里列出了从电子表格读取单元格时涉及的所有函数、方法和数据类型：\n\
  \n1. 导入 `openpyxl` 模块。\n2. 调用 `openpyxl.load_workbook()` 函数。\n3. 获取一个 `Workbook`\
  \ 对象。\n4. 调用工作簿方法 `get_active_sheet()` 或 `get_sheet_by_name()`。\n5. 获取一个 `Worksheet`\
  \ 对象。\n6. 使用索引或带有 `row` 和 `column` 关键字参数的工作表方法 `cell()`。\n7. 获取一个 `Cell` 对象。\n8.\
  \ 读取 `Cell` 对象的 `value` 属性。\n\n# 项目：从电子表格读取数据\n\n假设你有一份来自 2010 年美国人口普查数据的电子表格，你有一项枯燥的任务，需要遍历它的数千行，统计每个县的总人数和人口普查区的数量（人口普查区只是为了人口普查目的而定义的地理区域）。每一行代表一个人口普查区。我们将电子表格文件命名为\
  \ *censuspopdata.xlsx*，你可以从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载它。其内容所示图 12-2。\n\n![censuspopdata.xlsx 电子表格](img/httpatomoreillycomsourcenostarchimages2189661.png)\n\
  \n图 12-2. *censuspopdata.xlsx* 电子表格\n\n尽管 Excel 可以计算多个选中单元格的和，你仍然需要为 3000 多个县中的每一个县选择单元格。即使手动计算一个县的人口只需要几秒钟，处理整个电子表格也需要花费几个小时。\n\
  \n在这个项目中，你将编写一个脚本，它可以从普查电子表格读取数据，并在几秒钟内计算每个县的统计数据。\n\n这是你的程序的功能：\n\n* 从 Excel 电子表格读取数据。\n\
  * 统计每个县的人口普查区数量。\n* 统计每个县的总人数。\n* 打印结果。\n\n这意味着你的代码需要完成以下操作：\n\n* 使用 `openpyxl`\
  \ 模块打开并读取 Excel 文档的单元格。\n* 计算所有的区块和人口数据，并将其存储在数据结构中。\n* 使用 `pprint` 模块将数据结构写入带有\
  \ `.py` 扩展名的文本文件中。\n\n##  1 ：读取电子表格数据\n\n*censuspopdata.xlsx* 电子表格中只有一个工作表，名为 `'Population\
  \ by Census Tract'`，每行包含一个人口普查区的数据。列分别是普查区编号 (A)、州缩写 (B)、县名 (C) 和普查区人口 (D)。\n\n\
  打开一个新的文件编辑器窗口并输入以下代码。将文件保存为 *readCensusExcel.py*。\n\n```python\n#! python3\n   #\
  \ readCensusExcel.py - 统计每个县的人口和人口普查区数量。\n\n➊ import openpyxl, pprint\n   print('Opening\
  \ workbook...')\n➋ wb = openpyxl.load_workbook('censuspopdata.xlsx')\n➌ sheet =\
  \ wb.get_sheet_by_name('Population by Census Tract')\n   countyData = {}\n\n   #\
  \ TODO: 用每个县的人口和普查区填充 countyData。\n   print('Reading rows...')\n➍ for row in range(2,\
  \ sheet.get_highest_row() + 1):\n       # 电子表格中的每一行都包含一个人口普查区的数据。\n       state\
  \  = sheet['B' + str(row)].value\n       county = sheet['C' + str(row)].value\n\
  \       pop    = sheet['D' + str(row)].value\n\n   # TODO: 打开一个新的文本文件并将 countyData\
  \ 的内容写入其中。\n```\n\n这段代码导入了 `openpyxl` 模块，以及你将用于打印最终县数据的 `pprint` 模块 ➊。然后它打开了 *censuspopdata.xlsx*\
  \ 文件 ➋，获取带有普查数据的工作表 ➌，并开始遍历它的行 ➍。\n\n注意你还创建了一个名为 `countyData` 的变量，它将包含你为每个县计算的人口和普查区数量。但在存储任何内容之前，你应该准确确定将如何构建其中的数据结构。\n\
  \n## 2 步：填充数据结构\n\n存储在 `countyData` 中的数据结构将是一个以州缩写作为键的字典。每个州缩写将映射到另一个字典，该字典的键是该州县的名称字符串。每个县名又将映射到一个仅包含两个键\
  \ `'tracts'` 和 `'pop'` 的字典。这些键映射到该县的人口普查区数量和人口。例如，字典看起来像如下所示：\n\n```python\n{'AK':\
  \ {'Aleutians East': {'pop': 3141, 'tracts': 1},\n        'Aleutians West': {'pop':\
  \ 5561, 'tracts': 2},\n        'Anchorage': {'pop': 291826, 'tracts': 55},\n   \
  \     'Bethel': {'pop': 17013, 'tracts': 3},\n        'Bristol Bay': {'pop': 997,\
  \ 'tracts': 1},\n        --snip--\n```\n\n如果之前的字典存储在 `countyData` 中，后续的表达式将如下求值：\n\
  \n```python\n>>> countyData['AK']['Anchorage']['pop']\n291826\n>>> countyData['AK']['Anchorage']['tracts']\n\
  55\n```\n\n更通地说，`countyData` 字典的键看起来如下：\n\n```python\ncountyData[state abbrev][county]['tracts']\n\
  countyData[state abbrev][county]['pop']\n```\n\n现在你已经知道 `countyData` 将如何构建了，可以编写填充它的代码了。将以下代码添加到程序的末尾：\n\
  \n```python\n#! python3\n   # readCensusExcel.py - 统计每个县的人口和人口普查区数量。\n\n   --snip--\n\
  \   for row in range(2, sheet.get_highest_row() + 1):\n       # 电子表格中的每一行都包含一个人口普查区的数据。\n\
  \       state  = sheet['B' + str(row)].value\n       county = sheet['C' + str(row)].value\n\
  \       pop    = sheet['D' + str(row)].value\n\n       # 确保州键存在。\n➊ countyData.setdefault(state,\
  \ {})\n       # 确保该州中的县键存在。\n➋ countyData[state].setdefault(county, {'tracts': 0,\
  \ 'pop': 0})\n\n       # 每行代表一个人口普查区，所以加 1。\n둑 countyData[state][county]['tracts']\
  \ += 1\n       # 根据该普查区增加县口。\n➍ countyData[state][county]['pop'] += int(pop)\n\n\
  \   # TODO: 打开一个新的文本文件并将 countyData 的内容写入其中。\n```\n\n最后两行代码执行了实际计算，在 `for` 循环的每次迭代中增加\
  \ `tracts` 的值并增加 `pop` 的值 ➍。\n\n其他代码是为了在键本身存在之前，你无法将县字典作为值添加。（也就是说，如果 `'AK'` 键不存在，`countyData['AK']['Anchorage']['tracts']\
  \ += 1` 将导致错误。）为了确保州缩写键于你的数据结构中，你需要调用 `setdefault()` 方法，如果尚不存在则设置一个值 ➊。\n\n正如 `countyData`\
  \ 字典需要一个字典作为每个州缩写键的值一样，这些字典中的每一个也需要一个自己的字典作为每个县键的值 ➋。而这些字典反过来又需要 `'tracts'` 和 `'pop'`\
  \ 键，其初始值为整数 `0`。（如果你忘记了字典结构，请查看本节开始时的示例字典。）\n\n由于键已经存在，`setdefault()` 将不执行任何操作，因此你可以放心地在\
  \ `for` 循环的每次迭代中调用它。\n\n## 3 步：将结果写入文件\n\n\n\n\n\n在 `for` 循环完成后，`countyData` 字典将包含所有以县和州为键的人口和普区信息。此时，你可以编写更多代码将将其写入文本文件或另一个\
  \ Excel 表格中。现在，让我们只需使用 `pprint.pformat()` 函数将 `countyData` 字典的值作为一个巨大的字符串写入名为 `census2010.py`\
  \ 的文件中。将以下代码添加到程序的末尾（确保它没有被缩进，以便其保持在 `for` 循环之外）：\n\n```python\n#! python 3\n# readCensusExcel.py\
  \ - 统计每个县的人口和人口普查区数量。\n--snip--\n\nfor row in range(2, sheet.get_highest_row() +\
  \ 1):\n--snip--\n\n# 打开一个新的文本文件并将 countyData 的内容写入其中。\nprint('Writing results...')\n\
  resultFile = open('census2010.py', 'w')\nresultFile.write('allData = ' + pprint.pformat(countyData))\n\
  resultFile.close()\nprint('Done.')\n```\n\n`pprint.pformat()` 函数生成的字符串本身就是格式化后的有效\
  \ Python 代码。通过将其输出到 `census2010.py` 的文本文件，你从你的 Python 程序生成了一个 Python 程序！这看起来可能很复杂，但优势在于你现在可以像任何其他\
  \ Python 模块一样导入 `census2010.py`。在交互式 shell 中，将当前工作目录更改为新创建的 `census2010.py` 文件的文件夹（在我的笔记本上，这是\
  \ `C:\\Python34`），然后导入它：\n\n```python\n>>> import os\n>>> os.chdir('C:\\\\Python34')\n\
  >>> import census2010\n>>> census2010.allData['AK']['Anchorage']\n{'pop': 291826,\
  \ 'tracts': 55}\n>>> anchoragePop = census2010.allData['AK']['Anchorage']['pop']\n\
  >>> print('The 2010 population of Anchorage was ' + str(anchoragePop))\nThe 2010\
  \ population of Anchorage was 291826\n```\n\n`readCensusExcel.py` 程序是临时代码：一旦你将其结果保存到\
  \ `census2010.py`，你就不需要再次运行该程序了。每当你需要县数据时，只需运行 `import census2010` 即可。\n\n手动计算这些数据将花费几个小时；而这个程序几秒钟就完成了。使用\
  \ OpenPyXL，你提取保存到 Excel 表格的信息并对其进行计算将毫无困难。你可以从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载完整程序。\n\n## 类似程序的创意\n\n许多企业和办公室使用 Excel 存储各种类型的数据，表格变得巨大且难以处理并不罕见。任何解析 Excel\
  \ 表格的程序结构都相似：它加载表格文件，准备一些变量或数据结构，然后遍历表格中的每一行。这样的程序可以执行以下操作：\n\n* 比较表格中跨行的数据。\n*\
  \ 打开多个 Excel 文件并比较表格之间的数据。\n* 检查表格是否有空行或任何单元格中的无效数据，如果有则提醒用户。\n* 从表格中读取数据并将其作为你\
  \ Python 程序的输入。\n\n# 写入 Excel 文档\n\nOpenPyXL 还提供了写入数据的方法，这意味着你的程序可以创建和编辑表格文件。使用\
  \ Python，创建包含数千行数据的表格非常简单。\n\n## 创建和保存 Excel 文档\n\n调用 `openpyxl.Workbook()` 函数来创建一个新的空白\
  \ `Workbook` 对象。在交互式 shell 中输入以下内容：\n\n```python\n>>> import openpyxl\n>>> wb =\
  \ openpyxl.Workbook()\n>>> wb.get_sheet_names()\n['Sheet']\n>>> sheet = wb.get_active_sheet()\n\
  >>> sheet.title\n'Sheet'\n>>> sheet.title = 'Spam Bacon Eggs Sheet'\n>>> wb.get_sheet_names()\n\
  ['Spam Bacon Eggs Sheet']\n```\n\n工作簿将从一个名为 `Sheet` 的单个工作表开始。你可以通过在其 `title` 属性中存储新字符串来更改工作表的名称。\n\
  \n当你修改 `Workbook` 对象或其工作表和单元格时，在调用 `save()` 工作簿方法之前，表格文件都不会保存。在交互式 shell 中输入以下内容（假设当前工作目录下有\
  \ `example.xlsx`）：\n\n```python\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> sheet = wb.get_active_sheet()\n>>> sheet.title = 'Spam Spam Spam'\n>>> wb.save('example_copy.xlsx')\n\
  ```\n\n在这里，我们更改了工作表的名称。为了保存我们的更改，我们将文件名作为字符串传递给 `save()` 方法。传递与原始不同的文件名（例如 `'example_copy.xlsx'`）会将更改保存到表格的副本中。\n\
  \n每当你编辑从文件中加载的表格时，应始终将新的、编辑过的表格保存为与原始不同的文件名。这样，如果代码中的 bug 导致新保存的文件包含错误或损坏的数据，你仍然有一个原始表格文件可以操作。\n\
  \n## 创建和删除工作表\n\n可以使用 `create_sheet()` 和 `remove_sheet()` 方法向工作簿中添加或删除工作表。在交互式 shell\
  \ 中输入以下内容：\n\n```python\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>>\
  \ wb.get_sheet_names()\n['Sheet']\n>>> wb.create_sheet()\n<Worksheet \"Sheet1\"\
  >\n>>> wb.get_sheet_names()\n['Sheet', 'Sheet1']\n>>> wb.create_sheet(index=0, title='First\
  \ Sheet')\n<Worksheet \"First Sheet\">\n>>> wb.get_sheet_names()\n['First Sheet',\
  \ 'Sheet', 'Sheet1']\n>>> wb.create_sheet(index=2, title='Middle Sheet')\n<Worksheet\
  \ \"Middle Sheet\">\n>>> wb.get_sheet_names()\n['First Sheet', 'Sheet', 'Middle\
  \ Sheet', 'Sheet1']\n```\n\n`create_sheet()` 方法返回一个名为 `SheetX` 的新 `Worksheet` 对象，默认被设置为工作簿中的最后一个工作表。可以选择地使用\
  \ `index` 和 `title` 关键字参数指定新工作表的索引和名称。\n\n输入以下内容继续之前的示例：\n\n```python\n>>> wb.get_sheet_names()\n\
  ['First Sheet', 'Sheet', 'Middle Sheet', 'Sheet1']\n>>> wb.remove_sheet(wb.get_sheet_by_name('Middle\
  \ Sheet'))\n>>> wb.remove_sheet(wb.get_sheet_by_name('Sheet1'))\n>>> wb.get_sheet_names()\n\
  ['First Sheet', 'Sheet']\n```\n\n`remove_sheet()` 方法接受一个 `Worksheet` 对象作为参数，而不是工作表的名称字符串。如果你只知道要删除的工作表的名称，请调用\
  \ `get_sheet_by_name()` 并将其返回值传递给 `remove_sheet()`。\n\n记住在工作簿中添加或删除工作表后，要调用 `save()`\
  \ 方法来保存更改。\n\n# 向单元格写入值\n\n向单元格写入值类似于向字典的键写入值。在交互式 shell 中输入这些：\n\n```python\n>>>\
  \ import openpyxl\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_sheet_by_name('Sheet')\n\
  >>> sheet['A1'] = 'Hello world!'\n>>> sheet['A1'].value\n'Hello world!'\n```\n\n\
  如果你有字符串格式的单元格坐标，可以像使用 `Worksheet` 对象上的字典键一样来指定写入哪个单元格。\n\n# 项目：更新表格\n\n在这个项目中，你将编写一个程序来更新农产品销售表格中的单元格。你的程序将遍历表格，找到特定类型的农产品并更新它们的价格。从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff*)\
  \ 下载此表格。图 12-3 显示了表格的样式。\n\n![农产品销售表格](img/httpatomoreillycomsourcenostarchimages2189663.png.jpg)\n\
  \n图 12-3. 农产品销售表格\n\n\n\n\n每一行代表单次销售。列分别代表销售的农产品类型（A）、该农产品的每磅成本（B）、销售磅数（C）以及销售总收入（D）。TOTAL（总计）列设置为\
  \ Excel 公式 `*=ROUND(B3*C3, 2)*`，它将每磅成本乘以销售磅数，并将结果四舍五入到最接近位数。使用此公式，如果 B 列或 C 列发生变化，TOTAL\
  \ 列中的单元格将自动更新。\n\n现在想象一下大蒜、芹菜和柠檬的价格输入错误了，导致你面临一项枯燥的任务：遍历电子表格中的数千行，更新任何大蒜、芹菜和柠檬所在行的每磅成本。你无法对价格进行简单的查找和替换，因为可能有其他价格相同的物品，你不希望误地“修正”它们。对于数千行数据，手动操作需要几个小时。但你可以编写一个程序在几秒钟内完成。\n\
  \n你的程序将执行以下操作：\n\n* 遍历所有行。\n* 如果该行是大蒜、芹菜或柠檬，则更改价格。\n\n这意味着你的代码需要执行以下操作：\n\n* 打开电子表格文件。\n\
  * 对于每一行，检查 A 列中的值是否为 `Celery`、`Garlic` 或 `Lemon`。\n* 如果是，更新 B 列中的价格。\n* 将电子表格保存为新文件（以防你丢失旧的电子表格）。\n\
  \n## 步骤 1：建立带有更新信息的数据结构\n\n你需要更新的价格如下：\n\n| Celery | 1.19 |\n| Garlic | 3.07 |\n\
  | Lemon | 1.27 |\n\n你可以像这样编写代码：\n\n```\nif produceName == 'Celery':\n    cellObj\
  \ = 1.19\nif produceName == 'Garlic':\n    cellObj = 3.07\nif produceName == 'Lemon':\n\
  \    cellObj = 1.27\n```\n\n像这样将农产品和更新后的价格数据硬编码在这里并不优雅。如果你需要用不同的价格或不同的农产品再次更新电子表格，你必须修改大量代码。每次修改代码你都有引入\
  \ Bug 的风险。\n\n更灵活的解决方案是将修正后的价格信息存储在字典中，并编写代码使用此数据结构。在新的编辑器窗口中，输入以下代码：\n\n```\n#!\
  \ python3\n# updateProduce.py - Corrects costs in produce sales spreadsheet.\n\n\
  import openpyxl\n\nwb = openpyxl.load_workbook('produceSales.xlsx')\nsheet = wb.get_sheet_by_name('Sheet')\n\
  \n# 农产品类型及其更新后的价格\nPRICE_UPDATES = {'Garlic': 3.07,\n                 'Celery':\
  \ 1.19,\n                 'Lemon': 1.27}\n\n# TODO: Loop through the rows and update\
  \ the prices.\n```\n\n将其保存为 `updateProduce.py`。如果你需要再次更新电子表格，只需要更新 `PRICE_UPDATES`\
  \ 字典而无需修改其他代码。\n\n## 步骤 2：检查所有行并更新错误价格\n\n程序的下一部分将遍历电子表格中的所有行。在 `updateProduce.py`\
  \ 的底部添加以下代码：\n\n```\n #! python3\n   # updateProduce.py - Corrects costs in produce\
  \ sales spreadsheet.\n\n   --snip--\n\n   # Loop through the rows and update the\
  \ prices.\n➊ for rowNum in range(2, sheet.get_highest_row()):  # skip the first\
  \ row\n➋     produceName = sheet.cell(row=rowNum, column=1).value\n➌     if produceName\
  \ in PRICE_UPDATES:\n           sheet.cell(row=rowNum, column=2).value = PRICE_UPDATES[produceName]\n\
  \n➍ wb.save('updatedProduceSales.xlsx')\n```\n\n我们从第 2 行开始遍历，因为第 1 行只是表头 ➊。第 1 列的单元格（即\
  \ A 列）将存储在变量 `produceName` 中 ➋。如果 `produceName` 作为键存在于 `PRICE_UPDATES` 字典中➌，你就这一行必须修正价格。正确的价格将在\
  \ `PRICE_UPDATES[produceName]` 中。\n\n注意使用 `PRICE_UPDATES` 如何让代码变得如此整洁。更新每种农产品只需要一个\
  \ `if` 语句，而不是像 `if produceName == 'Garlic':` 这样的代码。而且由于代码使用了 `PRICE_UPDATES` 字典，而不是在\
  \ `for` 循环中硬编码农产品名称和更新后的成本，如果农产品销售电子表格需要额外更改，你只需修改 `PRICE_UPDATES` 字典而无需修改代码。\n\n\
  在遍历整个电子表格并做出更改后，代码将 `Workbook` 对象保存到 `updatedProduceSales.xlsx` ➍。它不会覆盖旧电子表格，以防程序出现\
  \ Bug 导致更新后的电子表格错误。在检查更新后的电子表格无误后，你可以删除旧电子表格。\n\n你可以从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载此程序的完整源代码。\n\n## 类似程序的想法\n\n由于许多办公人员经常使用 Excel 电子表格，一个可以自动编辑和写入 Excel 文件的程序将非常有用。\n\
  \n由于许多办公人员经常使用 Excel 电子表格，一个可以自动编辑和写入 Excel 文件的程序将非常有用。\n\n由于许多办公人员经常使用 Excel 电子表格，一个可以自动编辑和写入\
  \ Excel 文件的程序将非常有用。\n\n由于许多办公人员经常使用 Excel 电子表格，一个可以自动编辑和写入 Excel 文件的程序将非常有用。\n\n\
  由于许多办公人员经常使用 Excel 电子表格，一个可以自动编辑和写入 Excel 文件的程序将非常有用。\n\n## 步骤 3：设置字体样式\n\nOpenPyXL\
  \ 用 `Style` 对象表示单元格的样式设置集合。可以通过将 `Style` 对象分配给 `style` 属性来设置单元格样式。\n\n在本示例中，`Font(size=24,\
  \ italic=True)` 返回一个 `Font` 对象，存储在 `italic24Font` 中 ➊。Font()` 的关键字参数 `size` 和 `italic`\
  \ 配置了 `Font` 对象。然后将此 `Font` 对象传递给 `Style(font=italic24Font)` 调用，返回你存储在 `styleObj`\
  \ 中的值 ➋。当 `styleObj` 赋值给单元格的 `style` 属性时，所有字体信息都会应用于单元格 A1。\n\n# 字体对象\n\n`Font`\
  \ 对象中的 `style` 属性影响单元格中内容的显示方式。要设置字体样式属性，你需要向 `Font()` 传递关键字参数。[表 12-2] 显示 `Font()`\
  \ 函数可能的关键字参数。\n\n表 12-2 字体 `style` 属性的关键字参数\n\n| 关键字参数 | 数据类型 | 描述 |\n| --- | ---\
  \ | --- |\n| `name` | String | 字体名称，例如 `'Calibri'` 或 `'Times New Roman'` |\n| `size`\
  \ | Integer | 字体大小 |\n| `bold` | Boolean | `True`，用于粗字体 |\n\n\n\n\n\n| `italic`\
  \ | Boolean | `True`, 用于斜体字体 |\n\n你可以调用 `Font()` 来创建一个 `Font` 对象并将该 `Font` 对象存储在变量中。然后，你将其传递给\
  \ `Style()`，将生成的 `Style` 对象存储在变量中，并将该变量赋值给 `Cell` 对象的 `style` 属性。例如，这段代码创建了各种字体样式：\n\
  \n```python\n>>> import openpyxl\n>>> from openpyxl.styles import Font, Style\n\
  >>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_sheet_by_name('Sheet')\n\n>>> fontObj1\
  \ = Font(name='Times New Roman', bold=True)\n>>> styleObj1 = Style(font=fontObj1)\n\
  >>> sheet['A1'].style/styleObj\n>>> sheet['A1'] = 'Bold Times New Roman'\n\n>>>\
  \ fontObj2 = Font(size=24, italic=True)\n>>> styleObj2 = Style(font=fontObj2)\n\
  >>> sheet['B3'].style/styleObj\n>>> sheet['B3'] = '24 pt Italic'\n\n>>> wb.save('styles.xlsx')\n\
  ```\n\n在这里，我们将一个 `Font` 对象存储在 `fontObj1` 中并用它创建一个 `Style` 对象，将其存储在 `styleObj1` 中，然后将\
  \ A1 `Cell` 对象的 `style` 属性设置为 `styleObj`。我们用另一个 `Font` 对象和 `Style` 对象重复此过程，设置第二个单元格的样式。运行此代码后，电子表格中\
  \ A1 和 B3 单元格的样式将被设置为自定义字体样式，如图 12-4 所示。\n\n![具有自定义字体样式的电子表格](img/httpatomoreillycomsourcenostarchimages2189665.png)\n\
  \n图 12-4。具有自定义字体样式的电子表格\n\n对于单元格 A1，我们将字体名称设置为 `'Times New Roman'`并将 `bold` 设置为\
  \ `true`，因此我们的文本以粗体 Times New Roman 显示。我们没有指定大小，因此使用了 `openpyxl` 的默认值 11。在单元格 B3\
  \ 中，我们的文本是斜体，大小为 24；我们没有指定字体名称，因此使用了 `openpyxl` 的默认值 Calibri。\n\n# 公式\n\n以等号开头的公式可以配置单元格包含从其他单元格计算出的值。在本节中，你将使用\
  \ `openpyxl` 模块以程序方式向单元格添加公式，就像添加任何普通值一样。例如：\n\n```python\n>>> sheet['B9'] = '=SUM(B1:B8)'\n\
  ```\n\n这将 `=SUM(B1:B8)` 存储为单元格 B9 的值。这会将 B9 单元格设置为一个公式，用于计算 B1 到 B8 单元格中值的和。你可以在图\
  \ 12-5 \"Figure 12-5.单元格 B9 包含公式 =SUM(B1:B8)，它相加了单元格 B1 到 B8。\") 中看到运行效果。\n\n![单元格\
  \ B9 包含公式 =SUM(B1:B8)，它相加了单元格 B1 到 B8。](img/httpatomoreillycomsourcenostarchimages2189667.jpg)\n\
  \n图 12-5。单元格 B9 包含公式 =SUM(B1:B8)，它相加了单元格 B1 到 B8。\n\n公式的设置方法与单元格中的任何文本一样。在交互式 shell\
  \ 程序中输入以下内容：\n\n```python\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>>\
  \ sheet = wb.get_active_sheet()\n>>> sheet['A1'] = 200\n>>> sheet['A2'] = 300\n\
  >>> sheet['A3'] = '=SUM(A1:A2)'\n>>> wb.save('writeFormula.xlsx')\n```\n\nA1 和 A2\
  \ 单元格分别设置为 200 和 300。单元格 A3 的值被设置为一个求 A1 和 A2 之值的公式。当在 Excel 中打开电子表格时，A3 将显示其计算值为\
  \ 500。\n\n你也可以像读取任何值一样读取单元格中的公式。然而，如果你想查看公式的结果而不是公式字面量，则必须为 `load_workbook()` 的\
  \ `data_only` 参数传递 `True`。这意味着 `Workbook` 对象可以显示公式或结果，但不能二者兼顾（但你可以为同一个电子表格加载多个 `Workbook`\
  \ 对象）。在交互式 shell 中输入以下内容，查看带不带 `data_only` 参数加载工作表的区别：\n\n```python\n>>> import\
  \ openpyxl\n>>> wbFormulas = openpyxl.load_workbook('writeFormula.xlsx')\n>>> sheet\
  \ = wbFormulas.get_active_sheet()\n>>> sheet['A3'].value\n'=SUM(A1:A2)'\n\n>>> wbDataOnly\
  \ = openpyxl.load_workbook('writeFormula.xlsx', data_only=True)\n>>> sheet = wbDataOnly.get_active_sheet()\n\
  >>> sheet['A3'].value\n500\n```\n\n在这里，当带有 `data_only=True` 调用 `load_workbook()`\
  \ 时，A3 单元格显示 500，即 `=SUM(A1:A2)` 公式的结果，而不是公式文本。Excel 公式为电子表格提供了一定的编程性，但对于复杂任务，可能会很快变得难以管理。例如，即使你非常熟悉\
  \ Excel 公式，想要想要破译 `=IFERROR(TRIM(LEN(VLOOKUP(F7, Sheet2$A$1:$B$10000, 2, FALSE))>0,SUBSTITUTE(VLOOKUP(F7,\
  \ Sheet2$A$1:$B$10000, 2, FALSE), \" \"), \"\"))` 到底在做什么也非常头疼。Python 代码更具可读性。\n\n\
  # 调整行和列\n\n在 Excel 中，调整行和列的大小只需点击并拖动行或列标题的边缘即可。但如果你需要根据单元格的内容设置行或列的大小，或者想在大量电子表格文件中设置大小，那么编写一个\
  \ Python 程序来完成会快得多。行和列也可以完全从视图中隐藏。或者它们可以“冻结”在位置，使其在屏幕上始终可见，并在打印电子表格时出现在每一页上（这对于标题非常有用）。\n\
  \n## 设置行高和列宽\n\n`Worksheet` 对象具有 `row_dimensions` 和 `column_dimensions` 属性，用于控制行高和列宽。在交互式\
  \ shell 中输入以下内容：\n\n```python\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n\
  >>> sheet = wb.get_active_sheet()\n>>> sheet['A1'] = 'Tall row'\n>>> sheet['B2']\
  \ = 'Wide column'\n>>> sheet.row_dimensions[1].height = 70\n>>> sheet.column_dimensions['B'].width\
  \ = 20\n>>> wb.save('dimensions.xlsx')\n```\n\n工作表的 `row_dimensions` 和 `column_dimensions`\
  \ 是类似字典的值；`row_dimensions` 包含 `RowDimension` 对象，而 `column_dimensions` 包含 `ColumnDimension`\
  \ 对象。在 `row_dimensions` 中，你可以使用行号（在此情况下为 1 或 2）访问其中一个对象。在 `column_dimensions` 中，你可以使用列字母（在此情况下为\
  \ A 或 B）访问其中一个对象。\n\n`dimensions.xlsx` 电子表格如图 12-6 所示。\n\n![第 1 行和 B 列具有更大的高度和宽度](img/httpatomoreillycomsourcenostarchimages218969.png)\n\
  \n图 12-6。第 1 行和 B 列具有更大的高度和宽度\n\n一旦获取了 `RowDimension` 对象，就可以设置其高度。一旦获取了 `ColumnDimension`\
  \ 对象，就可以设置其宽度。行高可以设置为 0 到 409 之间的整数或浮点数。该值以磅测量，一点等于英寸的七分之一。默认行高为 12.75。列宽可以设置为 0\
  \ 到 255 之间的整数或浮点数。该值代表默认字体大小（11 点）可以在单元格中显示的字符数。默认列宽为 8.43 个字符。宽度为 0 的列或高度为 0 的行将对用户隐藏。\n\
  \n## 合并和拆单元格\n\n矩形单元格区域可以通过 `merge_cells()` 方法合并为单个单元格。在交互式 shell 中输入以下内容：\n\n```python\n\
  >>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_active_sheet()\n\
  >>> sheet.merge_cells('A1:D3')\n>>> sheet['A1'] = 'Twelve cells merged together.'\n\
  >>> sheet.merge_cells('C5:D5')\n>>> sheet['C5'] = 'Two merged cells.'\n>>> wb.save('merged.xlsx')\n\
  ```\n\n`merge_cells()` 的参数是表示要合并的矩形区域左上角和右下角单元格的单个字符串：`'A1:D3'` 将 12 个单元格合并为一个单元格。要设置这些合并单元格的值，只需设置合并组左上角单元格的值即可。\n\
  \n\n\n\n\n当你运行这段代码时，`merged.xlsx` 看起来将像图 12-7 所示。\n\n![电子表格中的合并单元格](img/httpatomoreillycomsourcenostarchimages2189671.png)\n\
  \n图 12-7. 电子表格中的合并单元格\n\n要取消合并单元格，请调用 `unmerge_cells()` 表格方法。将以下内容输入交互式 shell 中。\n\
  \n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('merged.xlsx')\n>>>\
  \ sheet = wb.get_active_sheet()\n>>> sheet.unmerge_cells('A1:D3')\n>>> sheet.unmerge_cells('C5:D5')\n\
  >>> wb.save('merged.xlsx')\n```\n\n如果你保存了更改并查看该电子表格，你会发现合并的单元格已变回独立的单元格。\n\n## 冻结窗格\n\
  \n对于大到无法一次性显示的电子表格，在屏幕上“冻结”顶部几行或左侧几列是有帮助的。例如，冻结的列标题或行标题使用户在滚动电子表格时也是始终对用户可见的。这些被称为*冻结窗格*。在\
  \ OpenPyXL 中，每个 `Worksheet` 对象都有一个 `freeze_panes` 属性，它可以被设置为 `Cell` 对象或单元格坐标字符串。请注意，该单元格上方的所有行和左侧的所有列都将被冻结，但单元格本身的行和列不会被冻结。\n\
  \n要取消冻结所有窗格，将 `freeze_panes` 设置为 `None` 或 `'A1'`。表 12-3 显示了在某些 `freeze_panes` 设置下，哪些行和列会被冻结。\n\
  \n表 12-3. 冻结窗格示例\n\n| `freeze_panes` 设置 | 被冻结的行和列 |\n| --- | --- |\n| `sheet.freeze_panes\
  \ = 'A2'` | 第 1 行 |\n| `sheet.freeze_panes = 'B1'` | A 列 |\n| `sheet.freeze_panes\
  \ = 'C1'` | A 列和 B 列 |\n| `sheet.freeze_panes = 'C2'` | 第 1 行以及 A、B 列 |\n| `sheet.freeze_panes\
  \ = 'A1'` 或 `sheet.freeze_panes = None` | 无冻结窗格 |\n\n确保你已经从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 获取了产品销售电子表格。然后将以下内容输入交互式 shell 中：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('produceSales.xlsx')\n\
  >>> sheet = wb.get_active_sheet()\n>>> sheet.freeze_panes = 'A2'\n>>> wb.save('freezeExample.xlsx')\n\
  ```\n\n如果你将 `freeze_panes` 属性设置为 `'A2'`，无论用户在电子表格中滚动到哪里，第 1 行将始终可见的。你可以在图 12-8 中看到这一点。\n\
  \n![当窗格设置为 'A2' 时，即使用户向下滚动，第 1 行始终可见](img/httpatomoreillycomsourcenostarchimages2189673.png.jpg)\n\
  \n图 12-8. 当 `freeze_panes` 设置为 `'A2'` 时，即使用户向下滚动，第 1 行也始终可见。\n\n# 图表\n\nOpenPyXL\
  \ 支持使用表格单元格中的数据创建柱图、折线图、散图和饼图。要创建图表，你需要执行以下操作：\n\n1. 从矩形单元格选择区域创建一个 `Reference`\
  \ 对象。\n2. 通过传入 `Reference` 对象创建一个 `Series` 对象。\n3. 创建一个 `Chart` 对象。\n4. 将 `Series`\
  \ 对象追加到 `Chart` 对象中。\n5. 可选地，设置 `Chart` 对象的 `drawing.top`、`drawing.left`、`drawing.width`\
  \ 和 `drawing.height` 变量。\n6. 将 `Chart` 对象添加到 `Worksheet` 对象中。\n\n`Reference` 对象需要一些解释。`Reference`\
  \ 对象是通过调用 `openpyxl.charts.Reference()` 函数并传入三个参数创建的：\n\n1. 包含图表数据的 `Worksheet`\
  \ 对象。\n2. 一个包含两个整数的元组，表示包含图表数据的矩形单元格区域的左上角单元格：元组中的第一个整数是行，第二个是列。注意 `1` 是第一行，而不是\
  \ `0`。\n3. 一个包含两个整数的元组，表示包含图表数据的矩形单元格区域的右下角单元格：元组中的第一个整数是行，第二个是列。\n\n图 12-9, (10,\
  \ 1); (3, 2), (6, 4); (5, 3), (5, 3)\")显示了一些示例坐标参数。\n\n![从左到右：(1, 1), (10, 1); (3,\
  \ 2), (6, 4); (5, 3), (5, 3)](img/httpatomoreillycomsourcenostarchimages2189675.png.jpg)\n\
  \n图 12-9. 从左到右：`(1, 1), (10, 1)`；`(3, 2), (6, 4)`；`(5, 3), (5, 3)`\n\n输入此交互式 shell\
  \ 示例来创建图表并将其添加到表格：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook()\n\
  >>> sheet = wb.get_active_sheet()\n>>> i in range(1, 11):         # 创建一些数据\n   \
  \     sheet['A' + str(i)] = i\n\n>>> refObj = openpyxl.charts.Reference(sheet, (1,\
  \ 1), (10, 1))\n\n>>> seriesObj = openpyxl.charts.Series(refObj, title='First series')\n\
  \n>>> chartObj = openpyxl.charts.BarChart()\n>>> chartObj.append(seriesObj)\n\n\
  >>> chartObj.drawing.top = 50\n>>> chartObj.drawing.left = 100\n>>> chartObj.drawing.width\
  \ = 300\n>>> chartObj.drawing.height = 200\n\n>>> sheet.add(chartObj)\n>>> wb.save('sampleChart.xlsx')\n\
  ```\n\n这产生的电子表格看起来像图 12-10 所示。\n\n![带有图表的电子表格](img/httpatomoreillycomsourcenostarchimages2189677.jpg)\n\
  \n图 12-10. 带有图表的电子表格\n\n通过调用 `openpyxl.charts.BarChart()` 创建了柱图。你也可以通过 `openpyxl.charts.LineChart()`、`openpyxl.charts.ScatterChart()`\
  \ 和 `openpyxl.charts.PieChart()` 创建折线图、散图和饼图。\n\n遗憾的是，当前版本的 OpenPyXL (2.1.4)，`load_workbook()`\
  \ 函数不会加载图表。如果你加载 `Workbook` 对象并立即保存，它将不会包含图表。\n\n## 总结\n\n通常，处理信息的困难部分不是处理本身，而是以正确的格式获取数据。但一旦你将电子表格加载到\
  \ Python 中，处理起来会比手动快得多。\n\n你还可以从程序生成电子表格。如果同事需要将成千上万的联系人转换为电子表格，你不需要手动复制到 Excel。\n\
  \n有了 `openpyxl` 模块和一些编程知识，你会发现处理这些任务是轻而易举。\n\n## 练习题\n\n对于以下问题，假设你有一个 `Workbook`\
  \ 对象 `wb`、一个 `Worksheet` 对象 `sheet`、一个 `Cell` 对象 `cell`、一个 `Comment` 对象 `comm` 和一个\
  \ `Image` 对象 `img`。\n\n| Q: | 1. `openpyxl.load_workbook()` 函数返回什么？ |\n| Q: | 2.\
  \ `get_sheet_names()` 工作方法返回什么？ |\n| Q: | 3. 如何获取名为 'Sheet1' 的 `Worksheet` 对象？ |\n\
  | Q: | 4. 如何获取工作表的活动 `Worksheet` 对象？ |\n| Q: | 5. 如何获取单元格 C5 的值？ |\n| Q: | 6. 如何将单元格\
  \ C5 的值设置为 \"Hello\"？ |\n| Q: | 7. 如何以整数形式检索单元格的行和列？ |\n| Q: | 8. `get_highest_column()`\
  \ 和 `get_highest_row()` 表方法返回什么？这些返回值的数据类型是什么？ |\n| Q: | 9. 如果你需要列 'M' 的整数索引，你需要调用哪个函数？\
  \ |\n| Q: | 10. 如果你需要列 14 的字符串名称，你需要调用哪个函数？ |\n\n\n\n\n\n| Q: | 11. 如何检索从 A1 到 F1\
  \ 的所有 `Cell` 对象的元组？ |\n| Q: | 12. 你如何将工作簿保存为文件名 `example.xlsx` 文件？ |\n| Q: | 13.\
  \ 如何在单元格中设置公式？ |\n| Q: | 14. 如果你想获取单元格公式的结果而不是公式本身，你必须先做什么？ |\n| Q: | 15. 如何将第 5\
  \ 行的高度设置为 100？ |\n| Q: | 16. 你如何隐藏 C 列？ |\n| Q: | 17. 请列举几个 OpenPyXL 2.1.4 不从电子表格文件中加载的功能。\
  \ |\n| Q: | 18. 什么是冻结窗格（freeze pane）？ |\n| Q: | 19. 创建柱状图需要调用哪五个函数和方法？ |\n\n# 练习项目\n\
  \n为了练习，请编写执行以下任务的程序。\n\n## 乘法表生成器\n\n创建一个程序 `multiplicationTable.py`，它从命令行接收一个数字\
  \ `N`，并在 Excel 电子表格中创建一个 `N`×`N` 的乘法表。例如，当程序如下运行运行时：\n\n```\npy multiplicationTable.py\
  \ 6\n```\n\n... 它应该创建一个看起来类似于 图 12-11 的电子表格。\n\n![在电子表格中生成的乘法表](img/httpatomoreillycomsourcenostarchimages2189679.png.jpg)\n\
  \n图 12-11. 在电子表格中生成的乘法表\n\n第 1 行和 A 列应作为标签使用并加粗。\n\n## 空行插入器\n\n创建一个程序 `blankRowInserter.py`，它接收两个整数和一个文件名字符串作为命令行参数。我们将第一个整数称为\
  \ `N`，第二个整数称为 `M`。从第 `N` 行开始，程序应该在电子表格中插入 `M` 个空行。例如，当程序如下运行运行时：\n\n```python\n\
  python blankRowInserter.py 3 2 myProduce.xlsx\n```\n\n... “插入之前”和“之后”的电子表格应该类似于\
  \ 图 12-12。\n\n![在第 3 行插入两个空行之前（左）和之后（右）的](img/httpatomoreillycomsourcenostarchimages2189681.png.jpg)\n\
  \n图 12-12. 在第 3 行插入两个空行之前（左）和之后（右）的\n\n你可以通过读取电子表格的内容来编写此程序。然后，在写入新电子表格时，使用 `for`\
  \ 循环复制前 `N` 行。对于剩余行，在输出电子表格的行号上加上 `M`。\n\n## 电子表格单元格反转器\n\n编写一个程序反转电子表格中单元格的行和列。例如，第\
  \ 5 行第 3 列的值将位于第 3 行第 5 列（反之亦然）。这应该应用于电子表格中的所有单元格。例如，“插入之前”和“之后”的电子表格可能类似于 图 12-13。\n\
  \n![反转之前（顶部）和之后（底部）的电子表格](img/httpatomoreillycomsourcenostarchimages2189683.png.jpg)\n\
  \n图 12-13. 反转之前（顶部）和之后（底部）的电子表格\n\n你可以通过嵌套的 `for` 循环将电子表格数据读入列表列表结构来编写此程序。该数据结构可以使用\
  \ `sheetData[x][y]` 表示第 `x` 列第 `y` 行的单元格。然后，在写入新电子表格时，使用 `sheetData[y][x]` 表示第 `x`\
  \ 列第 `y` 行的单元格。\n\n## 文本到电子表格\n\n编写一个程序读取多个文本文件（你可以自己创建这些文件），并将这些内容插入电子表格中，每行文本占据一行。第一个文本文件的行将位于\
  \ A 列的单元格中，第二个文本文件的行将位于 B 列的单元格中，依此类推。\n\n使用 `readlines()` `File` 对象方法返回字符串列表，文件中的每行对应一个字符串。对于第一个文件，将第一行输出到第\
  \ 1 列第 1 行。第二行应写入第 1 列第 2 行，依此类推。使用 `readlines()` 读取的下一个文件将写入第 2 列，下一个文件写入第 3 列，依此类推。\n\
  \n## 电子表格到文本文件\n\n编写一个程序反向执行上一个程序的任务：该程序应该打开电子表格并将 A 列的单元格写入一个文本文件，将 B 列的单元格写入另一个文本文件，依此类推。\n\
  \n# 第 13 章处理 PDF 和 Word 文档\n\nPDF 和 Word 文档是二进制文件，这使得它们比纯文件复杂得多。除了文本，它们还存储了大量的字体、颜色和布局信息。如果你想让程序读取或写入\
  \ PDF 或 Word 文档，你需要的不仅仅是将它们的文件名传递给 `open()`。\n\n幸运的是，有 Python 模块可以让你轻松地与 PDF 和 Word\
  \ 文档交互。本章将介绍两个这样的模块：PyPDF2 和 Python-Docx。\n\n## PDF 文档\n\n`PDF` 代表 `Portable Document\
  \ Format`（便携文档格式），使用 `.pdf` 文件扩展名。尽管 PDF 支持许多功能，但本章将关注你最常操作的两件事：从 PDF 中读取文本内容以及从现有文档创建新的\
  \ PDF。\n\n你将使用的处理 PDF 的模块是 `PyPDF2`。要安装它，请从命令行运行 `pip install PyPDF2`。该模块名称对大小写敏感，请确保\
  \ `y` 是小写的，其他字母都是大写的。（查看附录 A 有关安装第三方模块的完整详情。）如果模块安装正确，在交互式 shell 中运行 `import PyPDF2`\
  \ 不应显示任何错误。\n\n## 有问题的 PDF 格式\n\n虽然 PDF 文件非常适合以人们打印和阅读的方式布局文本，但对于软件来说，将其解析为纯文本并不简单。因此，PyPDF2\
  \ 在从 PDF 提取文本时可能会出错，甚至无法打开某些 PDF。遗憾的是，你对此无能为力。尽管如此，到目前为止我还没有发现任何无法用 PyPDF2 打开的 PDF\
  \ 文件。\n\n## 从 PDF 中提取文本\n\nPyPDF2 没有从 PDF 文档中提取图像、图表或其他媒体的方法，但它可以提取文本并返回 Python\
  \ 字符串。为了开始学习 PyPDF2 如何工作，我们将在 图 13-1 所示的示例 PDF 上使用它。\n\n![我们将提取文本的 PDF 页](img/httpatomoreillycomsourcenostarchimages2189685.png.jpg)\n\
  \n图 13-1. 我们将提取文本的 PDF 页\n\n从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载此 PDF，并在交互式 shell 中输入以下内容：\n\n```\n >>> import PyPDF2\n   >>> pdfFileObj = open('meetingminutes.pdf',\
  \ 'rb')\n   >>> pdfReader = PyPDF2.PdfFileReader(pdfFileObj)\n➊ >>> pdfReader.numPages\n\
  \   19\n➋ >>> pageObj = pdfReader.getPage(0)\n➌ >>> pageObj.extractText()\n   'OOFFFFIICCAALL\
  \ BBOARRDD MMIINNUUTTEESS Meeting of March 7, 2015\n   \\n     The Board of Elementary\
  \ and Secondary Education shall provide leadership\n   and create policies for education\
  \ that expand opportunities for children,\n   empower families and communities,\
  \ and advance Louisiana in an increasingly\n   competitive global market. BOARD\
  \ of ELEMENTARY and SECONDARY EDUCATION '\n```\n\n首先，导入 `PyPDF2` 模块。然后，以二进制读取模式打开\
  \ *meetingminutes.pdf* 并将其存储在 `pdfFileObj` 中。要获取表示此 PDF 的 `PdfFileReader` 对象，调用\
  \ `PyPDF2.PdfFileReader()` 并传递 `pdfFileObj` 给它。将此 `PdfFileReader` 对象存储在 `pdfReader`\
  \ 中。\n\n\n\n\n文档的总页数存储在 `PdfFileReader` 对象的 `numPages` 属性中 ➊。示例 PDF 有 19 页，但让我们只从第一页提取文本。\n\
  \n要从某页提取文本，你需要从 `PdfFileReader` 对象中获取一个 `Page` 对象，该对象代表 PDF 的单页。你可以通过在 `PdfFileReader`\
  \ 对象上调用 `getPage()` 方法 ➋，并传入你感兴趣的页码（在本文中，页码为 0）来获取 `Page` 对象。\n\nPyPDF2 获取页面时使用零索引（zero-based\
  \ index）：第一页是第 0 页，第二页是 Introduction，依此类推。即使文档内部的页码不同，情况也是如此。例如，假设你的 PDF 是一个更长报告中的三页节选，其页码标记为\
  \ 42、43 和 44。要获取该文档的第一页，你需要调用 `pdfReader.getPage(0)`，而不是 `getPage(42)` 或 `getPage(1)`。\n\
  \n一旦你获取了 `Page` 对象，调用它的 `extractText()` 方法即可返回该页的文本字符串 ➌。文本提取并非完美：PDF 中的文本 `Charles\
  \ E. “Chas” Roemer, President` 未出现在 `extractText()` 返回的字符串中，且间距有时会出现偏差。尽管如此，这种对\
  \ PDF 文本内容的近似对于你的程序可能足够。\n\n## 解密 PDF\n\n某些 PDF 文档具有加密功能，在打开文档的人提供密码之前，它们无法被读取。在下载的\
  \ PDF 交互式 shell 中输入以下内容（该 PDF 已使用密码 `rosebud` 加密）：\n\n```\n >>> import PyPDF2\n\
  \   >>> pdfReader = PyPDF2.PdfFileReader(open('encrypted.pdf', 'rb'))\n➊ >>> pdfReader.isEncrypted\n\
  \   True\n   >>> pdfReader.getPage(0)\n➋ Traceback (most recent call last):\n  \
  \   File \"<pyshell#173>\", line 1, in <module>\n       pdfReader.getPage()\n  \
  \   --snip--\n     File \"C:\\Python34\\lib\\site-packages\\PyPDF2\\pdf.py\", line\
  \ 1173, in getObject\n       raise utils.PdfReadError(\"file has not been decrypted\"\
  )\n   PyPDF2.utils.PdfReadError: file has not been decrypted\n➌ >>> pdfReader.decrypt('rosebud')\n\
  \   1\n   >>> pageObj = pdfReader.getPage(0)\n```\n\n所有 `PdfFileReader` 对象都有一个 `isEncrypted`\
  \ 属性，如果 PDF 已加密，该属性为 `True`，否则为 `False` ➊。在用正确密码解密之前，任何调用读取文件的函数的尝试都会导致错误 ➋。\n\n\
  要读取加密的 PDF，调用 `decrypt()` 函数并将密码作为字符串传递 ➌。在用正确密码调用 `decrypt()` 后，你会发现调用 `getPage()`\
  \ 不再导致错误。如果提供的密码错误，`decrypt()` 函数将返回 `0` 且 `getPage()` 将继续失败。注意，`decrypt()` 方法仅解密\
  \ `PdfFileReader` 对象，而不是实际的 PDF。在程序结束后，硬盘上的文件仍保持加密状态。你的程序下次运行时必须再次调用 `decrypt()`。\n\
  \n## 创建 PDF\n\nPyPDF2 与 `PdfFileReader` 对象对应的对象是 `PdfFileWriter` 对象，它们可以创建新的 PDF\
  \ 文件。但 PyPDF2 无法像 Python 处理纯文本文件那样向 PDF 写入任意文本。相反，PyPDF2 的 PDF 写入能力限于从其他 PDF 复制页面、旋转页面、叠加页面以及加密文件。\n\
  \nPyPDF2 不允许直接编辑 PDF。相反，你需要一个新的 PDF，然后将内容复制到现有文档中。本节中的示例将遵循这种通用方法：\n\n1. 打开一个或多个现有\
  \ PDF（源 PDF）成为 `PdfFileReader` 对象。\n2. 创建一个新的 `PdfFileWriter` 对象。\n3. 将页面从 `PdfFileReader`\
  \ 对象复制到 `PdfFileWriter` 对象中。\n4. 最后，使用 `PdfFileWriter` 对象写入输出 PDF。\n\n创建 `PdfFileWriter`\
  \ 对象仅创建一个在 Python 中代表 PDF 文档的值。它不会创建实际的 PDF。对于这一点，你必须调用 `PdfFileWriter` 的 `write()`\
  \ 方法。`write()` 方法接收一个以“写二进制”（write-binary）模式打开的 `File` 对象。你可以通过调用 Python 的 `open()`\
  \ 函数并传入两个参数来获取此类 `File` 对象：你想要 PDF 文件名的字符串，以及 `'wb'`（表示文件应以写二进制模式打开）。如果这听起来有点困惑，不要担心——你将在接下来的示例中看到它是如何工作的。\n\
  \n### 复制页面\n\n你可以使用 PyPDF2 将页面从一个 PDF 文档复制到另一个。这允许你合并多个 PDF 文件、剪掉不需要的页面或重新排序。从 http://nostarch.com/automatestuff/\
  \ 下载 `meetingminutes.pdf` 和 `meetingminutes2.pdf`，并将 PDF 放在当前工作目录。在交互式 shell 中输入以下内容：\n\
  \n```\n import PyPDF2\n   >>> pdf1File = open('meetingminutes.pdf', 'rb')\n   >>>\
  \ pdf2File = open('meetingminutes2.pdf', 'rb')\n➊ >>> pdf1Reader = PyPDF2.PdfFileReader(pdf1File)\n\
  ➋ >>> pdf2Reader = PyPDF2.PdfFileReader(pdf2File)\n➌ >>> pdfWriter = PyPDF2.PdfFileWriter()\n\
  \n   >>> for pageNum in range(pdf1Reader.numPages):\n         pageObj = pdf1Reader.getPage(pageNum)\n\
  \         pdfWriter.addPage(pageObj)\n\n   >>> for pageNum in range(pdf2Reader.numPages):\n\
  \         pageObj = pdf2Reader.getPage(pageNum)\n         pdfWriter.addPage(pageObj)\n\
  \n➑ >>> pdfOutputFile = open('combinedminutes.pdf', 'wb')\n   >>> pdfWriter.write(pdfOutputFile)\n\
  \   >>> pdfOutputFile.close()\n   >>> pdf1File.close()\n   >>> pdf2File.close()\n\
  ```\n\n以读二进制模式打开两个 PDF 文件，并将生成的两个 `File` 对象存储在 `pdf1File` 和 `pdf2File` 中。调用 `PyPDF2.PdfFileReader()`\
  \ 并传入 `pdf1File` 以获取 `meetingminutes.pdf` 的 `PdfFileReader` 对象 ➊。再次调用它并传入 `pdf2File`\
  \ 以获取 `meetingminutes2.pdf` 的 `PdfFileReader` 对象 ➋。然后创建一个新的 `PdfFileWriter` 对象，它代表一个空白的\
  \ PDF 文档 ➌。\n\n接下来，从两个源 PDF 复制所有页面并将它们添加到 `PdfFileWriter` 对象中。通过在 `PdfFileReader`\
  \ 对象上调用 `getPage()` 获取 `Page` 对象 ➍。然后将该 `Page` 对象传递给你的 `PdfFileWriter` 的 `addPage()`\
  \ 方法 ➎。这些步骤首先对 `pdf1Reader` 执行，然后对 `pdf2Reader` 执行。完成页面复制后，通过将 `File` 对象传递给 `PdfFileWriter`\
  \ 的 `write()` 方法写入名为 `combinedminutes.pdf` 的新 PDF ➏。\n\n## 注意\n\nPyPDF2 不能在 `PdfFileWriter`\
  \ 对象的中间插入页面；`addPage()` 方法只会将页面添加到末尾。\n\n你现在已经创建了一个新的 PDF 文件，将 `meetingminutes.pdf`\
  \ 和 `meetingminutes2.pdf` 的页面合并成一个文档。记住，传递给 `PyPDF2.PdfFileReader()` 的 `File` 对象需要通过向\
  \ `open()` 传递第二个参数 `'rb'` 以读二进制模式打开。同样，传递给 `PyPDF2.PdfFileWriter()` 的 `File` 对象需要以\
  \ `'wb'` 写二进制模式打开。\n\n### 旋转页面\n\nPDF 的页面还可以通过 `rotateClockwise()` 和 `rotateCounterClockwise()`\
  \ 方法按 90 度增进行旋转。向这些方法传递 `90`、`180` 或 `270` 整数之一。在当前工作目录下有 `meetingminutes.pdf` 文件的情况下，在交互式\
  \ shell 中输入以下内容：\n\n```\n >>> import PyPDF2\n   >>> minutesFile = open('meetingminutes.pdf',\
  \ 'rb')\n   >>> pdfReader = PyPDF2.PdfFileReader(minutesFile)\n➊ >>> page = pdfReader.getPage(0)\n\
  ➋ >>> page.rotateClockwise(90)\n   {'/Contents': [IndirectObject(961, 0), IndirectObject(962,\
  \ 0),\n   --snip--\n   }\n   >>> pdfWriter = PyPDF2.PdfFileWriter()\n   >>> pdfWriter.addPage(page)\n\
  ➌ >>> resultPdfFile = open('rotatedPage.pdf', 'wb')\n   >>> pdfWriter.write(resultPdfFile)\n\
  \   >>> resultPdfFile.close()\n   >>> minutesFile.close()\n```\n\n\n\n\n在这里，我们使用\
  \ `getPage(0)` 来选择 PDF 的第一页 ➊，然后对该页调用 `rotateClockwise(90)` ➋。我们写入一个包含旋转后页面的 PDF，并将其保存为\
  \ `rotatedPage.pdf` ➌。\n\n生成的 PDF 将包含一页，并顺时针旋转 90 度，如图图 13-2 所示。`rotateClockwise()`\
  \ 和 `rotateCounterClockwise()` 的返回值包含许多你可以忽略的信息。\n\n![页面顺时针旋转 90 度的 rotatedPage.pdf\
  \ 文件](img/httpatomoreillycomsourcenostarchimages2189687.png.jpg)\n\n图 13-2. 页面顺时针旋转\
  \ 90 度的 `rotatedPage.pdf` 文件\n\n### 叠加页面\n\nPyPDF2 还可以将一个页页的内容叠加到另一页页上，这对于在页面上添加\
  \ Logo、时间戳或水印非常有用。使用 Python，可以轻松地为多个文件添加水印，并且仅针对程序指定的页面添加。\n\n从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载 `watermark.pdf` 并将其与 `meetingminutes.pdf` 放在当前工作目录下。然后在交互式 shell 中输入以下内容：\n\
  \n```\n >>> import PyPDF2\n   >>> minutesFile = open('meetingminutes.pdf', 'rb')\n\
  ➋ >>> pdfReader = PyPDF2.PdfFileReader(minutesFile)\n➋ >>> minutesFirstPage = pdfReader.getPage(0)\n\
  ➌ >>> pdfWatermarkReader = PyPDF2.PdfFileReader(open('watermark.pdf', 'rb'))\n➍\
  \ >>> minutesFirstPage.mergePage(pdfWatermarkReader.getPage(0))\n➎ >>> pdfWriter\
  \ = PyPDF2.PdfFileWriter()\n➏ >>> pdfWriter.addPage(minutesFirstPage)\n\n➐ >>> for\
  \ pageNum in range(1, pdfReader.numPages):\n           pageObj = pdfReader.getPage(pageNum)\n\
  \           pdfWriter.addPage(pageObj)\n   >>> resultPdfFile = open('watermarkedCover.pdf',\
  \ 'wb')\n   >>> pdfWriter.write(resultPdfFile)\n   >>> minutesFile.close()\n   >>>\
  \ resultPdfFile.close()\n```\n\n在这里，我们为 `meetingminutes.pdf` 创建一个 `PdfFileReader`\
  \ 对象 ➊。我们调用 `getPage(0)` 获取第一页的 `Page` 对象，并将该对象存储在 `minutesFirstPage` 中 ➋。然后我们为\
  \ `watermark.pdf` 创建一个 `PdfFileReader` 对象 ➌，并在 `minutesFirstPage` 上调用 `mergePage()`\
  \ ➍。传递给 `mergePage()` 的参数是 `watermark.pdf` 第一页的 `Page` 对象。\n\n现在已经对 `minutesFirstPage`\
  \ 调用了 `mergePage()`，`minutesFirstPage` 就代表了带有水印的第一页。我们创建一个 `PdfFileWriter` 对象 ➎\
  \ 并添加带有水印的第一页 ➏。然后，我们遍历 `meetingminutes.pdf` 中的其余页面，并将它们添加到 `PdfFileWriter` 对象中\
  \ ➐。最后，我们打开名为 `watermarkedCover.pdf` 的新 PDF，并将 `PdfFileWriter` 的内容写入新 PDF 中。\n\n\
  图 13-3 显示了结果。我们的新 PDF `watermarkedCover.pdf` 包含了 `meetingminutes.pdf` 的所有内容，且第一页带有水印。\n\
  \n![原始 PDF（左侧）、水印 PDF（中间）和合并后的 PDF（右侧）](img/httpatomoreillycomsourcenostarchimages2189689.png.jpg)\n\
  \n图 13-3. 原始 PDF（左侧）、水印 PDF（中间）和合并后的 PDF（右侧）\n\n### 加密 PDF\n\n`PdfFileWriter` 对象还可以为\
  \ PDF 文档加密。在交互式 shell 中输入以下内容：\n\n```\n >>> import PyPDF2\n   >>> pdfFile = open('meetingminutes.pdf',\
  \ 'rb')\n   >>> pdfReader = PyPDF2.PdfFileReader(pdfFile)\n   >>> pdfWriter = PyPDF2.PdfFileWriter()\n\
  \   >>> for pageNum in range(pdfReader.numPages):\n           pdfWriter.addPage(pdfReader.getPage(pageNum))\n\
  \n➊ >>> pdfWriter.encrypt('swordfish')\n   >>> resultPdf = open('encryptedminutes.pdf',\
  \ 'wb')\n   >>> pdfWriter.write(resultPdf)\n   >>> resultPdf.close()\n```\n\n在调用\
  \ `write()` 方法保存到文件之前，先调用 `encrypt()` 方法并传递一个密码字符串 ➊。PDF 可以有 `用户密码`（允许你查看 PDF）和\
  \ `所有者密码`（允许你设置打印、注释、提取文本和其他功能的权限）。用户密码和所有者密码分别是 `encrypt()` 的第一个和第二个参数。如果只向 `encrypt()`\
  \ 传递了一个字符串参数，则它将同时用于两个密码。\n\n在这个示例中，我们将 `meetingminutes.pdf` 的页面复制到 `PdfFileWriter`\
  \ 对象中。（*注：原文此处存在大量重复句子，已按翻译要求处理逻辑*）\n[/content]\n\n---\n*(由于你提供的原文后半部分大量重复了 \"We\
  \ copied the pages of meetingminutes.pdf...\"，作为高级文档工程师，我理解此为原文错误或占位符，在翻译中已保持了逻辑连贯性。)*\n\
  \n**更正：针对重复文本部分的翻译处理：**\n\n[content]\n在这个示例中，我们将 `meetingminutes.pdf` 的页面复制到 `PdfFileWriter`\
  \ 对象中。\n[/content]\n\n---\n\n**针对最后两个部分的完整翻译：**\n\n[content]\n# 项目：合并多个页面\n\n假设你的任务是将多个文档合并到一个\
  \ PDF 中。从高层来说，你的代码将执行以下操作：\n\n- 找到目录中的所有 PDF 文件。\n- 对文件名进行排序以便按顺序添加。\n- 创建一个 `PdfFileWriter`\
  \ 对象来持有合并页面。\n- 遍历每个 PDF 文件，为它创建一个 `PdfFileReader`。\n- 遍历所有页面（第一页外）并添加它们。\n- 将生成的\
  \ PDF 保存为名为 *allminutes.pdf* 的文件。\n\n## 第一步：查找所有 PDF 文件\n\n首先，你的程序需要获取当前目录下所有以 .pdf\
  \ 结尾的文件列表并对其进行排序。让你的代码如下：\n\n```python\n#!/python3\n# combinePdfs.py - 将当前目录下所有的\
  \ PDF 合并到\n# 单个 PDF 中。\n\nimport PyPDF2, os\n\n# 获取所有 PDF 文件名。\npdfFiles = []\n\
  for filename in os.listdir('.'):\n    if filename.endswith('.pdf'):\n        pdfFiles.append(filename)\n\
  pdfFiles.sort(key=str.lower)\n\npdfWriter = PyPDF2.PdfFileWriter()\n\n# TODO: 遍历所有的\
  \ PDF 文件。\n\n# TODO: 遍历所有页面（第一页外）并添加它们。\n\n# TODO: 将生成的 PDF 保存到文件。\n```\n\n## 第二步：打开每个\
  \ PDF\n\n现在程序必须读取 `pdfFiles` 中的每个 PDF 文件。在你的程序中添加以下内容：\n\n\n\n\n```python\n#! python3\n\
  # combinePdfs.py - Combines all PDFs in the current directory into own# a single\
  \ PDF.\n\nimport PyPDF2, os\n\n# Get all PDF filenames.\npdfFiles = []\n--snip--\n\
  # Loop through all PDF files.\nfor filename in pdfFiles:\n    pdfFileObj = open(filename,\
  \ 'rb')\n    pdfReader = PyPDF2.PdfFileReader(pdfFileObj)\n    # TODO: Loop through\
  \ all pages (except the first) and add them.\n```\n\n对于每个 PDF，循环通过调用 `open()` 并并将\
  \ `'rb'` 作为第二个参数来以二进制读取模式打开 `filename`。`open()` 调用返回一个 `File` 对象，该对象被传递给 `PyPDF2.PdfFileReader()`\
  \ 以为该文件创建一个 `PdfFileReader` 对象。\n\n## 第 3 步：添加每一页\n\n对于每个 PDF，你希望遍历第一页以外的每一个页面。`for`\
  \ 循环内部的代码将每个 `Page` 对象单独复制到 `PdfFileWriter` 对象。记住，你需要跳过第一页。由于 `PyPDF2` 将 `0` 视为第一页，你的循环应该从\
  \ `1` 开始，一直到（但不包含）整数 `pdfReader.numPages`。\n\n```python\n#! python3\n# combinepdfs.py\
  \ - Combines all the PDFs in the current directory into\n# a single PDF.\n\nimport\
  \ PyPDF2, os\n\n--snip--\n\n# Loop through all PDF files.\nfor filename in pdfFiles:\n\
  --snip--\n    # Loop through all pages (except the first) and add them.\n    for\
  \ pageNum in range(1, pdfReader.numPages):\n        pageObj = pdfReader.getPage(pageNum)\n\
  \        pdfWriter.addPage(pageObj)\n```\n\n## 第 4 步：保存结果\n\n在这些嵌套的 `for` 循环完成后，`pdfWriter`\
  \ 变量将包含一个带有所有合并页面的 `PdfFileWriter` 对象。最后一步是将这些内容写入硬盘上的文件。将此代码添加到你的程序中：\n\n```python\n\
  #! python3\n# combinePdfs.py - Combines all the PDFs in the current directory into\n\
  # a single PDF.\nimport PyPDF2, os\n\n--snip--\n\n# Loop through all PDF files.\n\
  for filename in pdfFiles:\n--snip--\n    # Loop through all pages (except the first)\
  \ and add them.\n    for pageNum in range(1, pdfReader.numPages):\n--snip--\n\n\
  # Save the resulting PDF to a file.\npdfOutput = open('allminutes.pdf', 'wb')\n\
  pdfWriter.write(pdfOutput)\npdfOutput.close()\n```\n\n向 `open()` 传递 `'wb'` 会以二进制写入模式打开输出文件\
  \ `allminutes.pdf`。然后，将生成的 `File` 对象传递给 `write()` 方法将创建实际的 PDF 文件。调用 `close()` 方法完成程序。\n\
  \n## 类似程序的\n\n能够从其他 PDF 的页面创建 PDF 将允许你编写执行以下操作程序：\n\n*   从 PDF 中剪出特定页面。\n*   重新排列\
  \ PDF 中的页面顺序。\n*   仅根据某些特定文本（通过 `extractText()` 识别）的页面创建 PDF。\n\n## Word 文档\n\n\
  Python 可以使用 `python-docx` 模块创建和修改具有 `.docx` 后名的 Word 文档。你可以通过运行 `pip install python-docx`\
  \ 来安装该模块。（附录 A 提供了安装第三方模块的完整细节。）\n\n### 注意事项\n\n在使用 `pip` 首次安装 python-docx 时，请确保安装的是\
  \ `python-docx` 而不是 `docx`。安装名称 `docx` 是此本书未涵盖的另一个模块。然而，当你准备导入 `python-docx` 模块时，你需要运行\
  \ `import docx`，而不是 `import python-docx`。\n\n如果你没有安装 Word，LibreOffice Writer 和 OpenOffice\
  \ Writer 都是适用于 Windows、OS X 和 Linux 的免费替代应用程序，可打开 `.docx` 文件。你可以分别从 `https://www.libreoffice.org`\
  \ 和 `http://openoffice.org` 下载它们。python-docx 的完整文档可以在 `https://python-docx.readthedocs.org/`\
  \ 找到。虽然 OS X 有一个版本的 Word，但本章将重点关注 Windows 版的 Word。\n\n与纯文本相比，`.docx` 文件具有大量的结构。这种结构在\
  \ `python-docx` 中由三种不同的数据类型表示。在最高层，`Document` 对象代表整个文档。`Document` 对象包含一个 `Paragraph`\
  \ 对象列表，用于表示文档中的段落。（每当用户在 Word 文档中输入时按下 `ENTER` 或 `RETURN`，就会开始一个新段落。）这些 `Paragraph`\
  \ 对象中的每一个都包含一个或多个 `Run` 对象的列表。图 13-4 中的单句段落有四个运行。\n\n![Paragraph 对象中识别出的 Run 对象](img/httpatomoreillycomsourostarchimages2189691.png)\n\
  \n图 13-4. 在 Paragraph 对象中中识别出的 Run 对象\n\nWord 文档中的文本不仅仅是一个字符串。它还关联了字体、大小、颜色和其他样式信息。Word\
  \ 中的样式是这些属性的集合。`Run` 对象是具有相同样式的连续文本块。每当文本样式更改时，都需要一个新的 `Run` 对象。\n\n## 读取 Word 文档\n\
  \n让我们对 `python-docx` 模块进行实验。从 `http://nostarch.com/automatestuff/` 下载 `demo.docx`\
  \ 并将其保存到工作目录。然后进入交互式 shell 并在输入以下内容：\n\n```python\n>>> import docx\n>>> doc = docx.Document('demo.docx')\n\
  >>> len(doc.paragraphs)\n   7\n>>> doc.paragraphs[0].text\n   'Document Title'\n\
  >>> doc.paragraphs[1].text\n   'A plain paragraph with some bold and some italic'\n\
  >>> len(doc.paragraphs[1].runs)\n   4\n>>> doc.paragraphs[1].runs[0].text\n   'A\
  \ plain paragraph with some '\n>>> doc.paragraphs[1].runs[1].text\n   'bold'\n>>>\
  \ doc.paragraphs[1].runs[2].text\n   ' and some '\n>>> doc.paragraphs[1].runs[3].text\n\
  \   'italic'\n```\n\n在 ➊，我们在 Python 中打开 `.docx` 文件，调用 `docx.Document()` 并传递文件名 `demo.docx`。这将返回一个\
  \ `Document` 对象，该对象有一个 `paragraphs` 属性，它是 `Paragraph` 对象的列表。当我们对 `doc.paragraphs`\
  \ 调用 `len()` 时，它返回 `7`，告诉我们文档中有 7 个 `Paragraph` 对象 ➋。这些 `Paragraph` 对象中的每一个都有一个\
  \ `text` 属性，包含该段落的文本（不含样式信息）。在这里，第一个 `text` 属性包含 `'Document Title'` ➌，第二个包含 `'A\
  \ plain paragraph with some bold and some italic'` ➍。\n\n每个 `Paragraph` 对象还有一个 `runs`\
  \ 属性，它是 `Run` 对象的列表。`Run` 对象也有 `text` 属性，包含特定运行的文本。让我们看看第二个 `Paragraph` 对象的 `text`\
  \ 属性：`'A plain paragraph with some bold and some italic'`。对这个 `Paragraph` 对象调用 `len()`\
  \ 告诉我们有四个 `Run` 对象 ➎。第一个运行对象包含 `'A plain paragraph with some '` ➏。然后文本变为加粗样式，因此\
  \ `'bold'` 开始一个新的 `Run` 对象 ➐。之后文本返回未加粗样式，从而产生了第三个 `Run` 对象 `'' and some '` ➑。最后，第四个也是最后一个\
  \ `Run` 对象包含斜体体的 `'italic'` ➒。\n\n## 从 .docx 文件获取完整文本\n\n如果你只关心 Word 文档中的文本，而不是样式信息，可以使用\
  \ `getText()` 函数。它接受一个 `.docx` 文件的文件名并返回其文本的单个字符串值。打开一个新的文件编辑器窗口并输入以下代码，将其保存为 *readDocx.py*：\n\
  \n\n\n\n\n```python\n#! python3\n\nimport docx\n\ndef getText(filename):\n    doc\
  \ = docx.Document(filename)\n    fullText = []\n    for para in doc.paragraphs:\n\
  \        fullText.append(para.text)\n    return '\\n'.join(fullText)\n```\n\n`getText()`\
  \ 函数打开 Word 文档，遍历 `paragraphs` 列表中所有的 `Paragraph` 对象，然后将它们的文本追加到 `fullText` 列表中。循环结束后，`fullText`\
  \ 中的字符串将用换行符连接在一起。\n\n`readDocx.py` 程序可以像其他模块一样被导入。现在，如果你只需要 Word 文档中的文本，可以输入如下：\n\
  \n```python\n>>> import readDocx\n>>> print(readDocx.getText('demo.docx'))\n文档标题\n\
  包含一些粗体和斜体的普通段落\n标题，1 级\n强引用\n无序列表的第一项\n有序列表的第一项\n```\n\n你也可以调整 `getText()` 在返回字符串之前对其进行修改。例如，为了对每个段落进行缩进，可以将\
  \ `readDocx.py` 中的 `append()` 调用替换为：\n\n```python\nfullText.append(' ' + para.text)\n\
  ```\n\n若要在段落之间添加双倍格，可以将 `join()` 调用代码改为：\n\n```python\nreturn '\\n\\n'.join(fullText)\n\
  ```\n\n如你所见，只需几行代码即可编写读取 `.docx` 文件并按你好返回其内容字符串的函数。\n\n## 段落和 Run 对象的样式\n\n在 Windows\
  \ 版 Word 中，你可以通过按下 `CTRL-ALT-SHIFT-S` 显示样式面板，该面板看起来所示 图 13-5。在 OS X 上，你可以通过点击 `View`▸`Styles`\
  \ 菜单项来查看样式面板。\n\n![在 Windows 上按下 CTRL-ALT-SHIFT-S 显示样式面板。](img/httpatomoreillycomsourcenostarchimages2189693.png.jpg)\n\
  \n图 13-5。在 Windows 上按下 `CTRL-ALT-SHIFT`-S 显示样式面板。\n\nWord 和其他文字处理器使用样式来保持相似类型文本的视觉呈现一致性且易于更改。例如，你可能想将正文段设置为\
  \ 11 磅、Times New Roman 字体、左对齐、右不齐。你可以创建一个具有这些设置的样式并将其分配给所有正文段落。之后如果想更改文档中所有正文段落的呈现，只需更改样式，所有段落将自动更新。\n\
  \n对于 Word 文档，有三种样式：`Paragraph styles`（段落样式）可以应用于 `Paragraph` 对象，`character styles`（字符样式）可以应用于\
  \ `Run` 对象，而 `linked styles`（链接样式）可以同时应用于两种对象。你可以通过将它们的 `style` 属性设置为字符串来为 `Paragraph`\
  \ 和 `Run` 对象赋予样式。该字符串应该是样式的名称。如果 `style` 设置为 `None`，则 `Paragraph` 或 `Run` 对象将没有关联样式。\n\
  \n默认 Word 样式的字符串值如下：\n\n| `'Normal'` | `'Heading5'` | `'ListBullet'` | `'ListParagraph'`\
  \ |\n| `'BodyText'` | `'Heading6'` | `'ListBullet2'` | `'MacroText'` |\n| `'BodyText2'`\
  \ | `'Heading7'` | `'ListBullet3'` | `'NoSpacing'` |\n| `'BodyText3'` | `'Heading8'`\
  \ | `'ListContinue'` | `'Quote'` |\n| `'Caption'` | `'Heading9'` | `'ListContinue2'`\
  \ | `'Subtitle'` |\n| `'Heading1'` | `'IntenseQuote'` | `'ListContinue3'` | `'TOCHeading'`\
  \ |\n| `'Heading2'` | `'List'` | `'ListNumber'` | `'Title'` |\n| `'Heading3'` |\
  \ `'List2'` | `'ListNumber2'` | |\n| `'Heading4'` | `'List3'` | `'ListNumber3'`\
  \ | |\n\n在设置 `style` 属性时，不要在样式名称中使用空格。例如，虽然样式名称可能是 Subtle Emphasis，但你应该将 `style`\
  \ 属性设置为字符串值 `'SubtleEmphasis'` 而不是 `'Subtle Emphasis'`。包含空格会导致 Word 误读样式名称并无法应用。\n\
  \n当为 `Run` 对象使用链接样式时，你需要在名称末尾添加 `'Char'`。例如，为 `Paragraph` 对象设置 Quote 链接样式，你会使用 `paragraphObj.style\
  \ = 'Quote'`，但对于 `Run` 对象，你会使用 `runObj.style = 'QuoteChar'`。\n\n在当前版本的 Python-Docx\
  \ (0.7.4) 中，唯一的样式是默认 Word 样式和打开的 `.docx` 中的样式。无法创建新样式——尽管这在未来的 Python-Docx 版本中可能会改变。\n\
  \n## 使用非默认样式创建 Word 文档\n\n如果你想创建使用默认之外样式的 Word 文档，你需要打开一个空白文档并通过点击样式面板底部的 `New Style`\
  \ 按钮自行创建样式 (图 13-6\n\n## Run 属性\n\n可以使用 `text` 属性进一步设置 Runs。每个属性可以设置为三个值：`True`（属性始终启用）、`False`（属性禁用）或\
  \ `None`（默认为该 run 设置的值）。表 13-1 列出了可以在 `Run` 对象上设置的 `text` 属性。\n\n| 属性 |  |\n| ---\
  \ | --- |\n| `bold` | 文本以粗体显示。 |\n| `italic` | 文本以斜体显示。 |\n| `underline` | 文本带有下划线。\
  \ |\n| `strike` | 文本带有删除线。 |\n| `double_strike` | 文本带有双重删除线。 |\n| `all_caps` | 文本全大写字母显示。\
  \ |\n| `small_caps` | 文本大写字母显示，但小写字母较小。 |\n| `shadow` | 文本带有阴影。 |\n| `outline` |\
  \ 文本轮廓显示而非实心。 |\n| `rtl` | 文本从右向左写入。 |\n| `imprint` | 文本呈现压入面的效果。 |\n| `emboss`\
  \ | 文本呈现浮出面的效果。 |\n\n在这里，我们使用 `text` 和 `style` 属性轻松地查看文档段落的内容。我们可以看到将段落分为 runs 并单独访问每个\
  \ run 是很简单的。因此，我们获取第二个段落中的第一个、第二个和第四个 run，对每个 run 设置样式，并将结果保存到新文档。\n\n```python\n\
  >>> doc = docx.Document('demo.docx')\n>>> doc.paragraphs[0].text\n'Document Title'\n\
  >>> doc.paragraphs[0].style\n'Title'\n>>> doc.paragraphs[0].style = 'Normal'\n>>>\
  \ doc.paragraphs[1].text\n'A plain paragraph with some bold and some italic'\n>>>\
  \ (doc.paragraphs[1].runs[0].text, doc.paragraphs[1].runs[1].text, doc.\nparagraphs[1].runs[2].text,\
  \ doc.paragraphs[1].runs[3].text)\n('A plain paragraph with some ', 'bold', ' and\
  \ some ', 'italic')\n>>> doc.paragraphs[1].runs[0].style = 'QuoteChar'\n>>> doc.paragraphs[1].runs[1].underline\
  \ = True\n>>> doc.paragraphs[1].runs[3].underline = True\n>>> doc.save('restyled.docx')\n\
  ```\n\n\n\n\n\n`restyled.docx` 顶部的 `Document Title` 单词将具有 Normal 样式而不是 Title 样式，文本\
  \ `A plain paragraph with some` 的 `Run` 对象将具有 `QuoteChar` 样式，而单词 `bold` 和 `italic`\
  \ 的两个 `Run` 对象的 `underline` 属性将被设置为 `True`。Figure 13-7 显示了 `restyled.docx` 中段落和运行的样式外观。\n\
  \n![The restyled.docx file](img/httpatomoreillycomsourcenostarchimages2189697.png.jpg)\n\
  \n图 13-7. `restyled.docx` 文件\n\n你可以在关于 Python-Docx 使用样式的更完整的文档中找到：*[`python-docx.readthedocs.org/en/latest/user/styles.html`](https://python-docx.readthedocs.org/en/latest/user/styles.html)*。\n\
  \n## 编写 Word 文档\n\n在交互式外壳中输入以下内容：\n\n```\n>>> import docx\n>>> doc = docx.Document()\n\
  >>> doc.add_paragraph('Hello world!')\n<docx.text.Paragraph object at 0x0000000003B56F60>\n\
  >>> doc.save('helloworld.docx')\n```\n\n要创建自己的 `.docx` 文件，请调用 `docx.Document()`\
  \ 返回一个新的空白的 Word `Document` 对象。`add_paragraph()` 文档方法向文档中添加新的文本段落，并返回所添加 `Paragraph`\
  \ 对象的引用。当你完成文本添加后，将文件名字符串传递给 `save()` 文档方法可以将 `Document` 对象保存到文件中。\n\n将在当前工作目录下创建一个名为\
  \ `helloworld.docx` 的文件，打开时它看起来就像 Figure 13-8\")。\n\n![The Word document created\
  \ using add_paragraph('Hello world!')](img/httpatomoreillycomsourcenostarchimages2189699.png.jpg)\n\
  \n图 13-8. 使用 `add_paragraph('Hello world!')` 创建的 Word 文\n\n你可以通过再次调用带有新段落文本的 `add_paragraph()`\
  \ 方法来添加段落。或者要向现有段落末尾添加文本，可以调用段落的 `add_run()` 方法并传递一个字符串。在交互式外壳中输入以下内容：\n\n```\n\
  >>> import docx\n>>> doc = docx.Document()\n>>> doc.add_paragraph('Hello world!')\n\
  <docx.text.Paragraph object at 0x000000000366AD30>\n>>> paraObj1 = doc.add_paragraph('This\
  \ is a second paragraph.')\n>>> paraObj2 = doc.add_paragraph('This is a yet another\
  \ paragraph.')\n>>> paraObj1.add_run(' This text is being added to the second paragraph.')\n\
  <docx.text.Run object at 0x0000000003A2C860>\n>>> doc.save('multipleParagraphs.docx')\n\
  ```\n\n生成的文档看起来就像 Figure 13-9。注意文本 `This text is being added to the second paragraph.`\
  \ 被添加到了 `paraObj1` 的 `Paragraph` 对象中，它是被添加到 `doc` 的第二个段落。`add_paragraph()` 和 `add_run()`\
  \ 函数分别返回段落和 `Run` 对象，以省去你作为单独步骤来提取它们的麻烦。\n\n请记住，从 Python-Docx 0.5.3 版本开始，新的 `Paragraph`\
  \ 对象只能添加到文档的末尾，而新的 `Run` 对象只能添加到 `Paragraph` 对象的末尾。\n\n可以再次调用 `save()` 方法来保存你所所的额外更改。\n\
  \n![The document with multiple Paragraph and Run objects added](img/httpatomoreillycomsourcenostarchimages2189701.png.jpg)\n\
  \n图 13-9. 添加了多个 `Paragraph` 和 `Run` 对象的文档\n\n`add_paragraph()` 和 `add_run()` 都接受一个可选的第二个参数，该参数是\
  \ `Paragraph` 或 `Run` 对象的样式的字符串。例如：\n\n```\n>>> doc.add_paragraph('Hello world!',\
  \ 'Title')\n```\n\n此行添加了一个具有 Title 样式文本为 `Hello world!` 的段落。\n\n## 添加标题\n\n调用 `add_heading()`\
  \ 会添加一个具有标题样式之一的段落。在交互式外壳中输入以下内容：\n\n```\n>>> doc = docx.Document()\n>>> doc.add_heading('Header\
  \ 0', 0)\n<docx.text.Paragraph object at 0x00000000036CB3C8>\n>>> doc.add_heading('Header\
  \ 1', 1)\n<docx.text.Paragraph object at 0x00000000036CB630>\n>>> doc.add_heading('Header\
  \ 2', 2)\n<docx.text.Paragraph object at 0x00000000036CB828>\n>>> doc.add_heading('Header\
  \ 3', 3)\n<docx.text.Paragraph object at 0x00000000036CB2E8>\n>>> doc.add_heading('Header\
  \ 4', 4)\n<docx.text.Paragraph object at 0x00000000036CB3C8>\n>>> doc.save('headings.docx')\n\
  ```\n\n`add_heading()` 的参数是标题文本的字符串和一个从 `0` 到 `4` 的整数。整数 `0` 使标题变为 Title 样式，用于文档的顶部。整数\
  \ `1` 到 `4` 用于各种标题级别，其中 `1` 是主标题，`4` 是最低级子标题。`add_heading()` 函数返回一个 `Paragraph`\
  \ 对象，省去你从 `Document` 对象中将其提取出来的单独步骤。\n\n生成的 `headings.docx` 文件看起来就像 Figure 13-10。\n\
  \n![The headings.docx document with headings 0](img/httpatomoreillycomsourcenostarchimages2189702.png.jpg)\n\
  \n图 13-10. 具有标题 0 的 `headings.docx` 文档\n\n## 添加换行符和分页\n\n要添加换行符（而不是开始新段落），你可以在希望换行符之后的\
  \ `Run` 对象上调用 `add_break()` 方法。如果你想添加分页符，则需要将 `docx.text.BREAK_PAGE` 值作为单独参数传递，如下：\n\
  \n```\n>>> doc = docx.Document()\n>>> doc.add_paragraph('This is on the first page!')\n\
  <docx.text.Paragraph object at 0x00000000378518>\n>>> doc.paragraphs[0].runs[0].add_break(docx.text.BREAK_PAGE)\n\
  >>> doc.add_paragraph('This is on the second page!')\n<docx.text.Paragraph object\
  \ at 0x000000003785F8>\n>>> doc.save('twoPage.docx')\n```\n\n这创建了一个双页 Word 文档，第一页是\
  \ `This is on the first page!`，第二页是 `This is on the second page!`。尽管在 `This is on\
  \ the first page!` 之后第一页仍有大量空间，但我们通过插入换行符强制让下一个段落在在新的一页开始。\n\n## 添加图片\n\n`Document`\
  \ 对象具有 `add_picture()` 方法，它允许你将图像添加到文档末尾。假设你在当前工作目录下有一个文件 `zophie.png`。你可以通过输入以下内容将\
  \ `zophie.png` 添加到文档末尾，宽度为 1 英寸，高度为 4 厘米（Word 可以同时使用英制和公制单位）：\n\n```\n>>> doc.add_picture('zophie.png',\
  \ width=docx.shared.Inches(1),\nheight=docx.shared.Cm(4))\n<docx.shape.InlineShape\
  \ object at 0x0000000036C7D30>\n```\n\n第一个参数是文件名字符串。可选的 `width` 和 `height` 关键字参数将设置文档中图像的宽度和高度。如果留空，将认为图像的标准尺寸。\n\
  \n你可能更喜欢使用熟悉的单位（如英寸和厘米）指定图像的高度和宽度，因此在指定 `width` 和 `height` 关键字参数时，可以使用 `docx.shared.Inches()`\
  \ 和 `docx.shared.Cm()` 函数。\n\n## 总结\n\n文本信息不仅限于纯文本文件；事实上，你可能更经常处理 PDF 和 Word 文档。你可以使用\
  \ `PyPDF2` 模块读取和写入 PDF 文档。遗憾的是，从 PDF 文档中读取文本并不总是能产生完美的字符串转换，这是因为 PDF 文件格式非常复杂，而且某些\
  \ PDF 可能无法读取。在这种情况下，除非 PyPDF2 的未来更新支持额外的 PDF 功能，否则你将无为力。\n\n\n\n\nWord 文档更加可靠，你可以使用\
  \ `python-docx` 模块来读取它们。你可以通过 `Paragraph` 和 `Run` 对象操作 Word 文档中的文本。这些对象也可以赋予样式，但样式必须来自默认样式集或文档中已有的样式。你可以向文档中添加新的段落、标题、分页符和图片，但只能在末尾添加。\n\
  \n处理 PDF 和 Word 文档时遇到的许多局限性是因为这些格式的设计目的是为了给人类读者提供良好的显示，而不是为了方便软件解析。下一章将介绍两种常用的信息存储格式：JSON\
  \ 和 CSV 文件。这些格式是为计算机设计的，你会发现 Python 处理这些格式要要容易得多。\n\n## 练习题\n\n| Q: | 1\\. PDF 文件名的字符串值并`not`\
  \ 会直接传递给 `PyPDF2.PdfFileReader()` 函数。那么你应该向该函数传递什么呢？ |\n| Q: | 2\\. `PdfFileReader()`\
  \ 和 `PdfFileWriter()` 的 `File` 对象需要以什么模式打开？ |\n| Q: | 3\\. 如何从 `PdfFileReader` 对象获取用于关于本书的\
  \ `Page` 对象？ |\n| Q: | 4\\. 哪个 `PdfFileReader` 变量存储了 PDF 文档的页数？ |\n| Q: | 5\\. 如果\
  \ `PdfFileReader` 对象的 PDF 被密码 `swordfish` 加密，在获取其 `Page` 对象之前，你必须做什么？ |\n| Q: |\
  \ 6\\. 你使用什么方法来旋转页面？ |\n| Q: | 7\\. 哪种方法返回一个名为 `demo.docx` 文件的 `Document` 对象？ |\n\
  | Q: | 8\\. `Paragraph` 对象和 `Run` 对象之间的区别是什么？ |\n| Q: | 9\\. 如何为存储在变量 `doc` 中的 `Document`\
  \ 对象获取 `Paragraph` 对象的列表？ |\n| Q: | 10\\. 哪种类型的对象拥有 `bold`、`underline`、`italic`、`strike`\
  \ 和 `outline` 变量？ |\n| Q: | 11\\. 将 `bold` 变量设置为 `True`、`False` 或 `None` 之间有什么区别？\
  \ |\n| Q: | 12\\. 如何为新的 Word 文档创建一个 `Document` 对象？ |\n| Q: | 13\\. 如何向存储在变量 `doc`\
  \ 中的 `Document` 对象添加一个文本为 `'Hello there!'` 的段落？ |\n| Q: | 14\\. 哪些整数代表 Word 文档中可用的标题级别？\
  \ |\n\n# 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## PDF 恐症\n\n使用第 9 章 中的 `os.walk()` 函数编写一个脚本，遍历文件夹（及其子文件夹）中的每一个\
  \ PDF，并使用命令行提供的密码对这些 PDF 进行加密。保存每个加密后的 PDF 时，在原始文件名后添加 `_encrypted.pdf` 后缀。在删除原始文件之前，让程序尝试读取并解密文件，以确保其加密正确。\n\
  \n然后，编写一个程序，找到文件夹（及其子文件夹）中所有加密的 PDF，并使用提供的密码创建 PDF 的解密副本。如果密码错误，程序应向用户打印一条消息并继续处理下一个\
  \ PDF。\n\n## 作为 Word 文档的自定义邀请函\n\n假设你有一个包含宾客名字的文本文件。该 `guests.txt` 文件每行一个，如下：\n\n\
  ```\nProf. Plum\nMiss Scarlet\nCol. Mustard\nAl Sweigart\nRobocop\n```\n\n编写一个程序生成一个包含自定义邀请函的\
  \ Word 文档，外观类似于图 13-11。\n\n由于 Python-Docx 只能使用 Word 文档已存在的样式，你必须首先将这些样式添加到空白的 Word\
  \ 文件中，然后用 Python-Docx 打开该文件。生成的 Word 文档每页应有一个邀请函，因此在每个邀请函的最后一个段落之后调用 `add_break()`\
  \ 添加分页符。这样，你只需要打开一个 Word 文档就可以一次性打印所有邀请函。\n\n![自定义邀请脚本生成的 Word 文档](img/httpatomoreillycomsourcenostarchimages2189705.png.jpg)\n\
  \n图 13-11. 自定义邀请脚本生成的 Word 文档。\n\n你可以从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载示例 `guests.txt` 文件。\n\n## 暴力破解 PDF 密码\n\n假设你有一个加密的 PDF 忘记了密码，但你记得它是一个英文单词。尝试猜测你忘记的密码是一项相当无聊的任务。相反，你可以编写一个程序，通过尝试所有可能的英文单词直到找到有效的密码来解密\
  \ PDF。这被称为`暴力破解密码攻击`。从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载文本文件 `dictionary.txt`。这个`字典文件`包含 44,000 多个单词。\n\n# 第 14 章处理 CSV 文件和 JSON 数据\n\
  \n在第 13 章 中，你学习了如何从 PDF 和 Word 文档中提取文本。这些文件是二进制格式，需要特殊的模块才能访问。CSV 和 JSON 文件只是纯文本文件。你可以在文本编辑器中查看它们。但\
  \ Python 也带了 `csv` 和 `json` 模块，每个模块都提供了帮助你处理这些格式的函数。\n\nCSV 代表“逗号分隔值”（comma-separated\
  \ values），CSV 文件是作为纯文本存储的简化电子表格。Python 的 `csv` 模块使得解析 CSV 文件变得简单。\n\n## CSV 模块\n\
  \nCSV 文件中的每一行代表电子表格中的行，逗号分隔行中的单元格。例如，来自 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 的电子表格 `example.xlsx` 在 CSV 文件中看起来如下：\n\n```\n4/5/2015 13:34,Apples,73\n4/5/2015\
  \ 3:41,Cherries,85\n4/6/2015 12:46,Pears,14\n4/8/2015 8:59,Oranges,52\n4/10/2015\
  \ 2:07,Apples,152\n4/10/2015 18:10,Bananas,23\n4/10/2015 2:40,Strawberries,98\n\
  ```\n\n我将使用此文件进行本章节的交互式 shell 示例。你可以从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载 `example.csv`，或者将文本输入文本编辑器并保存为 `example.csv`。\n\nCSV 文件非常简单，缺乏 Excel 电子表格的许多功能。例如，CSV\
  \ 文件：\n\n*   其值没有类型——所有内容都是字符串\n*   没有字体大小或颜色的设置\n*   没有多个工作表\n*   无法指定单元格的宽度和高度\n\
  *   无法合并单元格\n*   不能嵌入图像或图表\n\n\n\n\nCSV 文件的优势在于简单。CSV 文件被许多类型的程序广泛支持，可以在文本编辑器（包括\
  \ IDLE 的文件编辑器）中查看，并且是表示表格数据的一种直观方法。CSV 格式正如其宣传的那样：它只是一个逗号分隔的值的文本文件。\n\n由于 CSV 文件仅仅是文本文件，你可能想将它们作为字符串读取，然后使用你在第\
  \ 8 章 中学习的技巧来处理该字符串。例如，由于 CSV 文件中的每个单元格都用逗号隔开，也许你只需要对每行文本调用 `split()` 方法来获取值。但并非\
  \ CSV 文件中的每个逗号都代表两个单元格之间的边界。CSV 文件还有其自己的一套转义字符，允许将逗号和其他字符包含`作为值的一部分`。`split()` 方法无法处理这些转义字符。由于这些潜在的陷阱，你应该始终使用\
  \ `csv` 模块来读取和写入 CSV 文件。\n\n## Reader 对象（Reader Objects）\n\n要使用 `csv` 模块从 CSV 文件中读取数据，你需要创建一个\
  \ `Reader` 对象。`Reader` 对象允许你遍历 CSV 文件中的行。在交互式 shell 中输入以下内容，假设 `example.csv` 位于当前工作目录中：\n\
  \n```\n➊ >>> import csv\n➋ >>> exampleFile = open('example.csv')\n➌ >>> exampleReader\
  \ = csv.reader(exampleFile)\n➍ >>> exampleData = list(exampleReader)\n➍ >>> exampleData\n\
  \   [['4/5/2015 13:34', 'Apples', '73'], ['4/5/2015 3:41', 'Cherries', '85'],\n\
  \   ['4/6/2015 12:46', 'Pears', '14'], ['4/8/2015 8:59', 'Oranges', '52'],\n   ['4/10/2015\
  \ 2:07', 'Apples', '152'], ['4/10/2015 18:10', 'Bananas', '23'],\n   ['4/10/2015\
  \ 2:40, 'Strawberries', '98']]\n```\n\n`csv` 模块随 Python 一起提供，因此我们可以导入它 ➊ 而无需先安装。\n\
  \n要使用 `csv` 模块读取 CSV 文件，首先使用 `open()` 函数打开它 ➋，就像处理任何其他文本文件一样。但不要对 `open()` 返回的 `File`\
  \ 对象调用 `read()` 或 `readlines()` 方法，而是将其传递给 `csv.reader()` 函数 ➌。这将为你返回一个 `Reader`\
  \ 对象供你使用。注意，你不需要直接将文件名字符串传递给 `csv.reader()` 函数。\n\n访问 `Reader` 对象中值的最直接方法是通过将其传递给\
  \ `list()` 来转换为普通的 Python 列表 ➍。在此 `Reader` 对象上使用 `list()` 会返回一个列表嵌套列表，你可以将其存储在如\
  \ `exampleData` 这样的变量中。在 shell 中输入 `exampleData` 会显示该列表嵌套列表 ➎。\n\n现在你已经有了作为列表列表形式的\
  \ CSV 文件，你可以使用表达式 `exampleData[row][col]` 访问特定行和列的值，其中 `row` 是 `exampleData` 中某个列表的索引，而\
  \ `col` 是你从该列表中获取的项目的索引。在交互式 shell 中输入以下内容：\n\n```\n>>> exampleData[0][0]\n'4/5/2015\
  \ 13:34'\n>>> exampleData[0][1]\n'Apples'\n>>> exampleData[0][2]\n'73'\n>>> exampleData[1][1]\n\
  'Cherries'\n>>> exampleData[6][1]\n'Strawberries'\n```\n\n`exampleData[0][0]` 进入第一个列表并给我们第一个字符串，`exampleData[0][2]`\
  \ 进入第一个列表并给出第三个字符串，以此此类推。\n\n## 在 for 循环中从 Reader 对象读取数据（Reading Data from Reader\
  \ Objects in a for Loop）\n\n对于大型 CSV 文件，你可能需要在 `for` 循环中使用 `Reader` 对象。这可以避免一次性将整个文件加载到内存中。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import csv\n>>> exampleFile = open('example.csv')\n\
  >>> exampleReader = csv.reader(exampleFile)\n>>> for row in exampleReader:\n   \
  \     print('Row #' + str(exampleReader.line_num) + ' ' + str(row))\n\nRow #1 ['4/5/2015\
  \ 13:34', 'Apples', '73']\nRow #2 ['4/5/2015 3:41', 'Cherries', '85']\nRow #3 ['4/6/2015\
  \ 12:46', 'Pears', '14']\nRow #4 ['4/8/2015 8:59', 'Oranges', '52']\nRow #5 ['4/10/2015\
  \ 2:07', 'Apples', '152']\nRow #6 ['4/10/2015 18:10', 'Bananas', '23']\nRow #7 ['4/10/2015\
  \ 2:40', 'Strawberries', '98']\n```\n\n在导入 `csv` 模块并从 CSV 文件创建一个 `Reader` 对象后，你就可以遍历\
  \ `Reader` 对象中的行。每行都是一个值列表，每个值代表一个单元格。\n\n`print()` 函数调用会打印当前行号和该行的内容。要获取行号，使用 `Reader`\
  \ 对象的 `line_num` 变量，它包含当前行的数字。\n\n`Reader` 对象只能被遍历一次。要重新读取 CSV 文件，你必须调用 `csv.reader`\
  \ 来创建一个 `Reader` 对象。\n\n## Writer 对象（Writer Objects）\n\n`Writer` 对象允许你向 CSV 文件写入数据。要创建一个\
  \ `Writer` 对象，你使用 `csv.writer()` 函数。在交互式 shell 中输入以下内容：\n\n```\n >>> import csv\n\
