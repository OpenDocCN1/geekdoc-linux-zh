  \ `0` 值的列表。这样，`colWidths[0]` 可以存储 `tableData[0]` 中最长字符串的宽度，`colWidths[1]` 可以存储 `tableData[1]`\
  \ 中最长字符串的宽度，依此类推。然后，你可以找到 `colWidths` 列表中的最大值，以确定要传递给 `rjust()` 字符串方法的整数宽度。\n\n\
  # 第二部分. 任务自动化\n\n# 第 7 章：使用正则表达式进行模式匹配\n\n你可能熟悉通过按下 `CTRL-F` 并输入你正在查找的单词来搜索文本。`正则表达式`\
  \ 更进一步：它们允许你指定一个要搜索的文本 `pattern`（模式）。你可能不知道某个企业的确切电话号码，但如果你在美国或加拿大，你就知道它将三位数字，后面跟着一个连字符，然后是四位数字（可选的，开头有一个三位的区号）。这就是你作为人类在看到电话号码时如何识别它的：415-555-1234\
  \ 是一个电话号码，但 4,155,551,234 则不是。\n\n正则表达式很有帮助，但并没有多少非程序员知道它们，尽管大多数现代文本编辑器和字文字处理器（如\
  \ Microsoft Word 或 OpenOffice）都具有查找和查找替换功能，可以根据正则表达式进行搜索。正则表达式是巨大的节省工具，不仅对于软件用户，对于程序员也是如此。事实上，技术作家\
  \ Cory Doctorow 认为在教授编程之前，我们应该先教授正则表达式：\n\n> “了解[正则表达式] 意味着解决 3 步和解决 3000 步之间的区别。当你成为一个极客时，你会忘记你几次击键就能解决的问题，别人可能需要几天枯燥且容易出错才能完成。”\n\
  \n在本章中，你将首先编写一个不使用正则表达式来查找文本模式的程序，然后查看如何使用正则表达式来大幅减少代码量。我将向你展示使用正则表达式的基础匹配，然后转向更强大的功能，例如字符串替换和创建自定义字符类。最后，在章节末尾，你将编写一个可以从文本块中自动提取电话号码和电子邮件地址的程序。\n\
  \n## 不使用正则表达式查找文本模式\n\n\n\n\n\n```python\n def isPhoneNumber(text):\n➊     if len(text)\
  \ != 12:\n           return False\n       for i in range(0, 3):\n➋         if not\
  \ text[i].isdecimal():\n               return False\n➌     if text[3] != '-':\n\
  \           return False\n       for i in range(4, 7):\n➍         if not text[i].isdecimal():\n\
  \               return False\n➎     if text[7] != '-':\n           return False\n\
  \       for i in range(8, 12):\n➏         if not text[i].isdecimal():\n        \
  \       return False\n➐     return True\n\n   print('415-555-4242 is a phone number:')\n\
  \   print(isPhoneNumber('415-555-4242'))\n   print('Moshi moshi is a phone number:')\n\
  \   print(isPhoneNumber('Moshi moshi'))\n```\n\n当运行此程序时，输出如下：\n\n```\n415-555-4242\
  \ is a phone number:\nTrue\nMoshi moshi is a phone number:\nFalse\n```\n\n`isPhoneNumber()`\
  \ 函数包含了几项检查代码，用于判断 `text` 中的字符串是否为有效的电话号码。如果其中任何一项检查失败，该函数将返回 `False`。首先，代码检查字符串是否恰好为\
  \ 12 个字符 ➊。然后，它检查区码（即 `text` 中的前三个字符）是否仅由数字组成 ➋。函数的其余部分检查字符串是否符合电话号码的格式：数字必须在区码后有一个第一个连字符\
  \ ➌，接是三个数字字符 ➍，然后是另一个连字符 ➎，最后是四个数字 ➏。如果程序执行成功通过了所有检查，它将返回 `True` ➐。\n\n使用参数 `'415-555-4242'`\
  \ 调用 `isPhoneNumber()` 将返回 `True`。使用 `'Moshi moshi'` 调用 `isPhoneNumber()` 将返回 `False`；第一个测试失败是因为\
  \ `'Moshi moshi'` 的长度不是 12 个字符。\n\n你可能需要添加更多的代码在更大的字符串中寻找这种模式的文本。请将 `isPhoneNumber.py`\
  \ 中的最后四个 `print()` 函数调用替换为以下：\n\n```\n message = 'Call me at 415-555-1011 tomorrow.\
  \ 415-555-9999 is my office.'\n   for i in range(len(message)):\n➊     chunk = message[i:i+12]\n\
  ➋     if isPhoneNumber(chunk):\n         print('Phone number found: ' + chunk)\n\
  \   print('Done')\n```\n\n当运行此程序时，输出如下：\n\n```\nPhone number found: 415-555-1011\n\
  Phone number found: 415-555-9999\nDone\n```\n\n在 `for` 循环的每次迭代中，从 `message` 中提取的\
  \ 12 个字符的新块被赋值给变量 `chunk` ➊。例如，在第一次迭代中，`i` 是 `0`，`chunk` 被赋值为 `message[0:12]`（即字符串\
  \ `'Call me at 4'`）。在下一次迭代中，`i` 是 `1`，`chunk` 被赋值为 `message[1:13]`（字符串 `'all me\
  \ at 41'`）。\n\n你将 `chunk` 传递给 `isPhoneNumber()` 以检查它是否匹配电话号码模式 ➋，如果是，则打印该块。\n\n\
  继续循环 `message`，最终 `chunk` 中的 12 个字符将是一个电话号码。循环会遍历整个字符串，测试每个 12 个字符的片段，并打印找到任何符合\
  \ `isPhoneNumber()` 的 `chunk`。一旦完成对 `message` 的遍历，我们就会打印 `Done`。\n\n虽然在这个例子中 `message`\
  \ 字符串很短，但它可能有数百万个字符，而程序仍然可以在一秒内运行。一个使用正则表达式查找电话号码的类似程序也会在一秒内运行，但正则表达式会让编写这些程序更快。\n\
