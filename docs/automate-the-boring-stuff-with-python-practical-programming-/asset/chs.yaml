  \ logo。\n\n## 在硬盘上识别照片文件夹\n\n我有一个坏习惯，会将文件从数码相机传输到硬盘某个地方的临时文件夹，然后忘记这些文件夹。如果能写一个程序扫描整个硬盘并找到这些遗留的“照片文件夹”就太好了。\n\
  \n编写一个遍历硬盘上每个文件夹并寻找潜在照片文件夹的程序。当然，你首先必须定义你认为什么是“照片文件夹”；假设是指超过一半的文件都是照片的文件夹。你如何定义哪些文件是照片呢？\n\
  \n首先，照片文件必须具有扩展名 `.png` 或 `.jpg`。此外，照片是大图像；照片文件的宽度和高度都必须大于 500 像素。这是一个稳妥的判断，因为大多数数码相机照片宽度和高度都有几千像素。\n\
  \n作为一个提示，这里是该程序可能的大纲：\n\n```python\n#! python3 #\n导入模块并编写注释来描述此程序。\n\nfor foldername,\
  \ subfolders, filenames in os.walk('C:\\\\'):\n    numPhotoFiles = 0\n    numNonPhotoFiles\
  \ = 0\n    for filename in filenames:\n        # 检查扩展名是否不是 .png 或 .jpg。\n      \
  \  if TODO:\n            numNonPhotoFiles += 1\n            continue    # 跳到下一个文件名\n\
  \n        # 使用 Pillow 打开图像文件。\n\n        # 检查宽度和高度是否大于 500。\n        if TODO:\n\
  \            # 图像足够大可以认为是照片。\n            numPhotoFiles += 1\n        else:\n  \
  \          # 图像太小，不是照片。\n            numNonPhotoFiles += 1\n\n    # 如果超过一半的文件是照片，\n\
  \    # 打印文件夹的绝对路径。\n    if TODO:\n        print(TODO)\n```\n\n当程序运行时，它会将任何照片文件夹的绝对路径打印到屏幕上。\n\
  \n## 自定义座位卡\n\n第 13 节 包含了一个练习项目，根据纯文本文件中的宾客列表创建自定义邀请函。作为额外项目，使用 `pillow` 模块为你的宾客创建自定义座位卡的图像。对于\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 资源中 `guests.txt`\
  \ 文件列出的每个宾客，生成一个带有宾客姓名和一些花卉装饰的图像。[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 资源中提供了公有领域的花图像。\n\n为了确保每张座位卡的大小相同，在邀请函图像的边缘添加黑色矩形，这样当打印图像时就会有一个剪裁线。Pillow 生成的\
  \ PNG 文件设置为每英寸 72 像素，因此一张 4×5 英的卡片需要一张 288×360 像素的图像。\n\n\n\n\n\n了解各种用于编辑表格、下载文件和启动程序的\
  \ Python 模块是有用的，但有时你工作所需的某些应用程序可能没有对应的模块。自动化计算机任务的终极工具是你编写的直接控制键盘和鼠标的程序。这些程序可以通过向其他应用程序发送虚拟按键和鼠标点击来控制它们，就像你亲自坐在电脑前与这些程序进行交互一样。这种技术被称为`图形用户界面自动化`，简称\
  \ `GUI 自动化`。通过 GUI 自动化，你的程序可以执行坐在电脑前的人类用户可以做的任何事情，除了把咖啡洒在键盘上。\n\n将 GUI 自动化想象成为机械臂编程。你可以编写机械臂在你的键盘上打字并为你移动鼠标。这种技术对于涉及大量无意义点击或填写表单的任务特别有用。\n\
  \n`pyautogui` 模块具有模拟鼠标移动、按钮点击和滚动滚轮的函数。本章仅涵盖 PyAutoGUI 功能的子集；你可以在 `[`pyautogui.readthedocs.org/`](http://pyautogui.readthedocs.org/)`\
  \ 找到完整文档。\n\n## 安装 pyautogui 模块\n\n`pyautogui` 模块向 Windows、OS X 和 Linux 发送虚拟按键和鼠标点击。根据你使用的操作系统，你可能需要在安装\
  \ PyAutoGUI 之前安装一些其他模块（称为`依赖`）。\n\n*   在 Windows 上，不需要安装其他模块。\n*   在 OS X 上，运行 `sudo\
  \ pip3 install pyobjc-framework-Quartz`、`sudo pip3 install pyobjc-core`，然后运行 `sudo\
  \ pip3 install pyobjc`。\n*   在 Linux 上，运行 `sudo pip3 install python3-xlib` 和 `sudo\
  \ apt-get scrot`。（`Scrot` 是 PyAutoGUI 使用的截图程序。）\n\n安装这些依赖项后，运行 `pip install pyautogui`（在\
  \ OS X 和 Linux 上使用 `pip3`）安装 PyAutoGUI。\n\n附录 A 提供了安装第三方模块的完整信息。要测试 PyAutoGUI 是否安装正确，请在交互式\
  \ shell 中运行 `import pyautogui` 并检查是否有任何错误信息。\n\n# 保持轨迹\n\n在投入 GUI 自动化之前，你应该知道如何应对可能出现的问题。Python\
  \ 可以以惊人的速度移动鼠标和输入按键。事实上，它的速度可能快到其他程序无法跟上。此外，如果发生故障但你的程序仍在移动鼠标，将很难判断程序到底在做什么或如何从问题中恢复。就像迪士尼《魔法师的弟子》中的魔法帚一样，不停地向米奇的浴缸注水——直到溢出——尽管你的程序完美地执行了你的指令，也可能失控。如果鼠标自动移动，停止程序可能会变得困难，因为你无法点击\
  \ IDLE 窗口来关闭它。幸运的是，有几种方法可以防止或恢复 GUI 自动化问题。\n\n## 通过注销关闭所有程序\n\n停止失控的 GUI 自动化程序最简单的方法可能是注销，这将关闭所有运行中的程序。在\
  \ Windows 和 Linux 上，注销热键是 `CTRL-ALT-DEL`。在 OS X 上，它是 `![](img/httpatomoreillycomsourcenostarchimages2189649.png.jpg)-SHIFT-OPTION-Q`。通过注销，你会丢失任何未保存的工作，但至少你不需要等待电脑完全重启。\n\
  \n## 暂停与安全机制\n\n你可以让脚本在每次函数调用后等待，以便在发生问题时为你留出简短的时间来接管鼠标和键盘。要做到这一点，将 `pyautogui.PAUSE`\
  \ 变量设置为你希望暂停的秒数。例如，在设置 `pyautogui.PAUSE = 1.5` 后，每个 PyAutoGUI 函数调用在执行其操作后将等待一秒半。非\
  \ PyAutoGUI 指令不会有这种暂停。\n\nPyAutoGUI 还有一个安全机制（fail-safe）。将鼠标光标移动到屏幕左上角会导致 PyAutoGUI\
  \ 抛出 `pyautogui.FailSafeException` 异常。你的程序可以使用 `try` 和 `except` 语句处理此异常，也可以让异常导致程序崩溃。无论哪种，如果你快速将鼠标移动到尽可能的左上方，安全机制将停止程序。你可以通过设置\
  \ `pyautogui.FAILSAFE = False` 来禁用此功能。在交互式 shell 中输入以下内容：\n\n```\n>>> import pyautogui\n\
  >>> pyautogui.PAUSE = 1\n>>> pyautogui.FAILSAFE = True\n```\n\n在这里我们导入 `pyautogui`\
  \ 并将 `pyautogui.PAUSE` 设置为 `1`，以便在每次函数调用后暂停一秒。我们将 `pyautogui.FAILSAFE` 设置为 `True`\
  \ 以启用安全机制。\n\n# 控制鼠标移动\n\n在本节中，你将学习如何使用 PyAutoGUI 移动鼠标并跟踪其在屏幕上的位置，但首先你需要理解 PyAutoGUI\
  \ 如何配合坐标工作。\n\nPyAutoGUI 的鼠标函数使用 `x` 和 `y` 坐标。图 18-1 显示了计算机屏幕的坐标系；它与第 17 章 中讨论的图像坐标系相似。`x`\
  \ 和 `y` 均为零的原点 位于屏幕的左上角。`x` 坐标向右增加，`y` 坐标向下增加。所有坐标均为正整数；没有负坐标。\n\n![1920×1080 分辨率计算机屏幕的坐标](img/httpatomoreillycomsourcenostarchimages2189749.png.jpg)\n\
  \n图 18-1。1920×1080 分辨率计算机屏幕的坐标。\n\n你的 `resolution`（分辨率）是屏幕宽和高的像素数。如果你的屏幕分辨率设置为 1920×1080，那么左上角的坐标将为\
  \ (0, 0)，右下角的坐标将为 (1919, 1079)。\n\n`pyautogui.size()` 函数返回一个包含屏幕宽度和高度（像素）的两个整数元组。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import pyautogui\n>>> pyautogui.size()\n(1920, 1080)\n\
  >>> width, height = pyautogui.size()\n```\n\n`pyautogui.size()` 在分辨率为 1920×1080\
  \ 的计算机上返回 (1920, 1080；取决于你的屏幕分辨率，返回值可能会不同。你可以将 `pyautogui.size()` 的宽度和高度存储在变量 `width`\
  \ 和 `height` 中，以提高程序的可读性。\n\n## 移动鼠标\n\n现在你理解了屏幕坐标，让我们移动鼠标吧。`pyautogui.moveTo()`\
  \ 函数会将鼠标光标移动到屏幕上的指定位置。`x` 和 `y` 坐标的整数值分别构成函数的第一个和第二个参数。可选的 `duration` 整数或浮点数关键字参数指定了移动到目的地所需的秒数。如果你留空它，默认值为\
  \ 0，即即时移动。（PyAutoGUI 函数中所有的 `duration` 关键字参数都是可选的。）在交互式 shell 中输入以下内容：\n\n```\n\
  >>> import pyautogui\n>>> for i in range(10):\n      pyautogui.moveTo(100, 100,\
  \ duration=0.25)\n      pyautogui.moveTo(200, 100, duration=0.25)\n      pyautogui.moveTo(200,\
  \ 200, duration=0.25)\n      pyautogui.moveTo(100, 200, duration=0.25)\n```\n\n\
  此示例在四个坐标之间顺时针移动鼠标光标，共移动十次。根据 `duration=0.25` 关键字参数指定，每次移动花费四分之一秒。如果你没有向任何 `pyautogui.moveTo()`\
  \ 调用传递第三个参数，鼠标光标将瞬间在点与点之间传传送。\n\n\n\n\n\n`pyautogui.moveRel()` 函数将鼠标光标`相对于`其当前位置移动。以下示例以相同的正方形模式移动鼠标，不同之处它从代码开始运行时鼠标在屏幕上的任意位置开始绘制正方形：\n\
  \n```python\n>>> import pyautogui\n>>> for i in range(10):\n      pyautogui.moveRel(100,\
  \ 0, duration=0.25)\n      pyautogui.moveRel(0, 100, duration=0.25)\n      pyautogui.moveRel(-100,\
  \ 0, duration=0.25)\n      pyautogui.moveRel(0, -100, duration=0.25)\n```\n\n`pyautogui.moveRel()`\
  \ 还接受三个参数：向右水平移动多少像素、向下垂直移动多少像素以及（可选的）完成移动所需的时间。第一个或第二个参数的负整数将导致鼠标分别向左或向上移动。\n\n\
  ## 获取鼠标位置\n\n你可以通过调用 `pyautogui.position()` 函数来确定鼠标的当前位置，该函数将返回一个包含函数调用时鼠标光标 `x`\
  \ 和 `y` 位置的元组。在交互式 shell 中输入以下内容，每次调用后移动鼠标：\n\n```python\n>>> pyautogui.position()\n\
  (311, 622)\n>>> pyautogui.position()\n(377, 481)\n>>> pyautogui.position()\n(1536,\
  \ 637)\n```\n\n当然，你的返回值将根据鼠标光标所在的位置而异。\n\n# 项目：“鼠标现在在哪里？”\n\n能够确定鼠标位置是设置 GUI 自动化脚本的重要组成部分。但仅通过观察屏幕几乎无法确定某个像素的精确坐标。如果有一个程序能在你移动鼠标时不断显示光标的\
  \ x 和 y 坐标，将非常方便。\n\n从高层次来说，你的程序应该执行以下操作：\n\n* 显示鼠标光标当前的 x 和 y 坐标。\n* 随着鼠标在屏幕上移动，更新这些坐标。\n\
  \n这意味着你的代码需要执行以下操作：\n\n* 调用 `position()` 函数获取当前坐标。\n* 通过向屏幕打印 `\\b` 退格格字符来擦除之前打印的坐标。\n\
  * 处理 `KeyboardInterrupt` 异常，以便用户可以按 CTRL-C 退出。\n\n打开一个新的文件编辑器窗口并将其保存为 `mouseNow.py`。\n\
  \n## 第 1 ：导入模块\n\n使用以下代码启动你的程序：\n\n```python\n#! python3\n# mouseNow.py - 显示鼠标光标的当前位置。\n\
  import pyautogui\nprint('Press Ctrl-C to quit.')\n#TODO: 获取并打印鼠标坐标。\n```\n\n程序的开头导入了\
  \ `pyautogui` 模块，并向用户打印提醒，按 CTRL-C 退出。\n\n## 第 2 ：设置退出代码和无限循环\n\n你可以使用无限 `while`\
  \ 循环来不断从 `pyautogui.position()` 打印当前鼠标坐标。至于退出程序的代码，你需要捕获 `KeyboardInterrupt` 异常，每当用户按下\
  \ CTRL-C 时就会触发该异常。如果你不处理此异常，它将向用户显示一个难看的回溯追踪和错误信息。向你的程序中添加以下内容：\n\n```python\n#!\
  \ python3\n   # mouseNow.py - 显示鼠标光标的当前位置。\n   import pyautogui\n   print('Press\
  \ Ctrl-C to quit.')\n   try:\n       while True:\n           # TODO: 获取并打印鼠标坐标。\n\
  ➊ except KeyboardInterrupt:\n     print('\\nDone.')\n```\n\n为了处理异常，将无限 `while` 循环封装在\
  \ `try` 语句中。当用户按下 CTRL-C 时，程序执行将移动到 `except` 子句 ➊ 并在新行打印 `Done.` ➋。\n\n## 第 3 ：获取并打印鼠标坐标\n\
  \n`while` 循环内部的代码应该获取当前鼠标坐标，对其进行格式化以便美观并打印。在 `while` 循环内部添加以下代码：\n\n```python\n\
  #! python3\n# mouseNow.py - 显示鼠标光标的当前位置。\nimport pyautogui\nprint('Press Ctrl-C\
  \ to quit.')\n--snip--\n        # 获取并打印鼠标坐标。\n        x, y = pyautogui.position()\n\
  \        positionStr = 'X: ' + str(x).rjust(4) + ' Y: ' + str(y).rjust(4)\n--snip--\n\
  ```\n\n使用多赋值技巧，`x` 和 `y` 变量获得了 `pyautogui.position()` 返回的元组中两个整数的值。通过将 `x` 和 `y`\
  \ 传递给 `str()` 函数，你可以得到整数坐标的字符串形式。`rjust()` 字符串方法将它们右对齐，以便无论坐标是一位、二位、三位还是四位数都占据相同的空间。将右对齐的字符串坐标与\
  \ `'X: '` 和 `' Y: '` 标签拼接，可以得到一个格式良好的字符串，它将存储在 `positionStr` 中。\n\n在程序的末尾，添加以下代码：\n\
  \n```python\n#! python3\n   # mouseNow.py - 显示鼠标光标的当前位置。\n   --snip--\n        \
  \   print(positionStr, end='')\n➊         print('\\b' * len(positionStr), end='',\
  \ flush=True)\n```\n\n这实际上是将 `positionStr` 打印到屏幕。`print()` 的关键字参数 `end=''` 防止在打印行的末尾添加默认的换行符。你可以擦除已经打印到屏幕上的文本——但仅限于最后的一行文本。一旦你打印了换行符，就无法擦除之前打印的任何内容。\n\
  \n要擦除文本，请打印 `\\b` 退格转义字符。这个特殊字符会擦除屏幕上当前行末尾的字符。➊ 处的行使用字符串复制产生了一个数量与 `positionStr`\
  \ 中存储的字符串长度相同的 `\\b` 字符字符串，其效果是擦除最后打印的 `positionStr` 字符串。\n\n由于超出本书范围的技术原因，对于打印\
  \ `\\b` 退格字符的 `print()` 调用，始终要传递 `flush=True`。否则，屏幕可能不会按预期更新文本。\n\n由于 `while` 循环重复得非常快，用户实际上不会注意到你正在屏幕上删除并重新打印整个数字。例如，如果\
  \ x 坐标是 563，鼠标向右移动一个像素，看起来只有 563 中的 3 变成了 4。\n\n当你运行程序时，将只会打印两行内容。它们看起来应该像这样：\n\n\
  ```\nPress Ctrl-C to quit.\nX: 290 Y: 424\n```\n\n第一行显示按 CTRL-C 退出的指令。带有鼠标坐标的第二行将随着你在屏幕上移动鼠标而发生变化。使用此程序，你将能够为你的\
  \ GUI 自动化脚本确定鼠标坐标。\n\n## 控制鼠标交互\n\n现在你已经知道如何移动鼠标以及它在屏幕上的位置，你可以开始点击、拖动和滚动了。\n\n##\
  \ 点击鼠标\n\n要向电脑发送虚拟鼠标点击，请调用 `pyautogui.click()` 方法。默认情况下，此点击使用左鼠标键并发生在鼠标光标当前所在的位置。如果你希望它发生在鼠标当前位置以外的地方，可以将点击的\
  \ x 和 y 坐标作为可选的第一和第二个参数。\n\n如果你想指定使用哪种鼠标键，请包含 `button` 关键字参数，值为 `'left'`、`'middle'`\
  \ 或 `'right'`。例如，`pyautogui.click(100, 150, button='left')` 将会在坐标 (100, 150) 点击左键，而\
  \ `pyautogui.click(200, 250, button='right')` 将在 (200, 250) 执行右点击。\n\n在交互式 shell\
  \ 中输入以下内容：\n\n```python\n>>> import pyautogui\n>>> pyautogui.click(10, 5)\n```\n\
  \n\n\n你应该看到鼠标指针移动到屏幕左上角附近并点击一次。一次完整的“点击”被定义为按下鼠标键然后释放，在此期间不移动光标。你也可以通过调用 `pyautogui.mouseDown()`\
  \ 来执行点击，它只负责按下鼠标键；以及调用 `pyautogui.mouseUp()`，它只负责释放按钮。这些函数的参数与 `click()` 相同，事实上，`click()`\
  \ 函数只是对这两个函数调用的一个方便封装。\n\n为了进一步方便起见，`pyautogui.doubleClick()` 函数将使用左鼠标键执行两次点击，而\
  \ `pyautogui.rightClick()` 和 `pyautogui.middleClick()` 函数将分别使用右键和中键执行点击。\n\n## 拖动鼠标\n\
  \n`Dragging` 意味着在按住一个鼠标键的同时移动鼠标。例如，你可以通过拖动文件夹图标在文件夹之间移动文件，或者在日历应用中移动日程安排。\n\nPyAutoGUI\
  \ 提供了 `pyautogui.dragTo()` 和 `pyautogui.dragRel()` 函数将鼠标指针拖动到新位置或相对于当前位置的位置。`dragTo()`\
  \ 和 `dragRel()` 的参数与 `moveTo()` 和 `moveRel()` 相同：x 坐标/水平移动、y 坐标/垂直移动，以及可选的持续时间。（OS\
  \ X 在鼠标移动过快时无法正确拖动，因此建议传递 `duration` 关键字参数。）\n\n要尝试这些函数，请打开一个图形绘制应用程序，如 Windows\
  \ 上的 Paint、OS X 上的 Paintbrush 或 Linux 上的 GNU Paint。（如果没有绘图程序，可以使用 `http://sumopaint.com/`\
  \ 在线工具）。我将使用 PyAutoGUI 在这些应用程序中绘图。\n\n当鼠标指针悬停在绘图程序的画布上并选择了铅笔或画笔工具时，在一个文件编辑器窗口中输入以下内容并保存为\
  \ `spiralDraw.py`：\n\n```\n import pyautogui, time\n➊ time.sleep(5)\n➋ pyautogui.click()\
  \    # 点击使绘图程序获得焦点\n   distance = 200\n   while distance > 0:\n➌     pyautogui.dragRel(distance,\
  \ 0, duration=0.2)   # 向右移动\n➍     distance = distance - 5\n➎     pyautogui.dragRel(0,\
  \ distance, duration=0.2)   # 向下移动\n➏     pyautogui.dragRel(-distance, 0, duration=0.2)\
  \  # 向左移动\n       distance = distance - 5\n       pyautogui.dragRel(0, -distance,\
  \ duration=0.2)  # 向上移动\n```\n\n当你运行此程序时，会有五秒的延迟 ➊，让你将鼠标指针移动到已选择铅笔或画笔工具的绘图程序窗口。然后\
  \ `spiralDraw.py` 将接管鼠标并点击使绘图程序获得焦点 ➋。当窗口具有活跃的闪烁光标时，它处于 `focus`（焦点）状态，你执行的操作——如输入或在本例中的拖动鼠标——将影响该窗口。一旦绘图程序获得焦点，`spiralDraw.py`\
  \ 将画出一个方形螺旋线图案，如图图 18-2 example\")所示。\n\n![dragRel() 示例的结果](img/httpatomoreillycomsourcenostarchimages2189751.png.jpg)\n\
  \n图 18-2. `pyautogui.dragRel()` 示例的结果\n\n`distance` 变量初始值为 `200`，因此在 `while` 循环的第一次迭代中，第一次\
  \ `dragRel()` 调用将指针向右移动 200 像素，耗时 0.2 秒 ➌。然后 `distance` 减到 195 ➍，第二次 `dragRel()`\
  \ 调用将指针向下移动 195 像素 ➎。第三次 `dragRel()` 调用将指针水平移动 -195 像素（向左移动）➏，`distance` 减到 190，最后一次\
  \ `dragRel()` 调用将指针向上移动 190 像素。在每次迭代中，鼠标都会向右、下、左、上移动，且 `distance` 比上一次略小。通过循环这段代码，你可以移动鼠标指针画出一个方形螺旋线。\n\
  \n你可以手动（或者说通过鼠标）画出这个螺旋线，但为了达到这种精度，你必须缓慢操作。PyAutoGUI 在几秒钟内就能完成！\n\n## 注意\n\n你可以使用\
  \ `pillow` 模块的绘图函数让代码绘制图像——更多信息请参见第 17 章。但使用 GUI 自动化允许你利用图形程序提供的绘绘制工具，例如渐变、不同的画笔或填充桶。\n\
  \n## 滚动鼠标\n\n最后一个 PyAutoGUI 鼠标函数是 `scroll()`，你通过传递一个整数参数来指定你想向上或向下滚动鼠标的单位。单位的大小随每个操作系统和应用程序而异，因此你必须通过实验来查看在特定情况下具体滚动了多远。滚动发生在鼠标指针当前的位置。传递正整数向上滚动，传递负整数向下滚动。当鼠标指针悬停在\
  \ IDLE 窗口时，在 IDLE 的交互式 shell 中运行以下代码：\n\n```\n>>> pyautogui.scroll(200)\n```\n\n\
  你会看到 IDLE 短暂向上滚动——然后又滚回来。向下滚动是因为 IDLE 在执行指令后会自动滚动到底部。请改输入以下代码：\n\n```\n>>> import\
  \ pyperclip\n>>> numbers = ''\n>>> for i in range(200):\n      numbers = numbers\
  \ + str(i) + '\\n'\n\n>>> pyperclip.copy(numbers)\n```\n\n这导入了 `pyperclip` 并设置了一个空字符串\
  \ `numbers`。代码随后遍历 200 个数字，并将每个数字连同换行符添加到 `numbers` 中。执行 `pyperclip.copy(numbers)`\
  \ 后，剪贴板将加载 200 行数字。打开一个新的文件编辑器窗口并将文本粘贴进去。这将给你一个大文本窗口来尝试滚动。在交互式 shell 中输入以下代码：\n\n\
  ```\n>>> import time, pyautogui\n>>> time.sleep(5); pyautogui.scroll(100)\n```\n\
  \n在第二行，你输入了两个用分号隔的命令，这告诉 Python 像分行编写一样运行这些命令。唯一的区别是交互式 shell 不会在命令之间提示你输入。这对本示例很重要，因为我们希望\
  \ `pyautogui.scroll()` 在等待后自动执行。（注意，虽然在交互式 shell 中将两个命令放在一行很有用，但在程序中应每个指令单独一行。）\n\
  \n按下回车运行代码后，你有五秒时间点击文件窗口使其获得焦点。等待结束后，`pyautogui.scroll()` 调用将导致文件窗口向上滚动。\n\n## 屏幕操作\n\
  \n你的 GUI 自动化程序不需要盲目点击。PyAutoGUI 具有截图功能，可以根据屏幕内容创建图像文件。这些函数还可以返回当前屏幕的 Pillow `Image`\
  \ 对象。如果你一直在跳读，在继续本节之前，建议阅读第 17 章 并安装 `pillow` 模块。\n\n在 Linux 计算机，需要安装 `scrot` 程序才能使用\
  \ PyAutoGUI 的截图功能。在终端窗口运行 `sudo apt-get install scrot` 安装该程序。如果你在 Windows 或 OS X\
  \ 上，请跳过此步骤继续本节。\n\n## 获取截图\n\n要在 Python 中获取截图，调用 `pyautogui.screenshot()` 函数。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import pyautogui\n>>> im = pyautogui.screenshot()\n\
  ```\n\n变量 `im` 将包含截图的 `Image` 对象。你现在可以像处理任何其他 `Image` 对象一样，对 `im` 中的对象调用方法。在交互式\
  \ shell 中输入以下内容：\n\n\n\n\n\n```python\n>>> im.getpixel((0, 0))\n(176, 176, 175)\n\
  >>> im.getpixel((50, 200))\n(130, 135, 144)\n```\n\n向 `getpixel()` 传递一个坐标元组，例如 `(0,\
  \ 0)` 或 `(50, 200)`，它将告诉你图像中这些坐标处像素的颜色。`getpixel()` 的返回值是一个包含三个整数的 RGB 元组，代表该像素中红色、绿色和蓝色的量。（这里没有第四个\
  \ alpha 值，因为截图图像是完全不透明的）。这就是你的程序“看到”当前屏幕上显示内容的方式。\n\n## 分析截图\n\n假设你的 GUI 自动化程序中的某个步骤是点击一个灰色按钮。在调用\
  \ `click()` 方法之前，你可以先取一张截图，并查看脚本即将点击的像素。如果该像素与灰色按钮的颜色不一致，你的程序就知道出问题了。可能是窗口意外移动了，也可能是弹出的对话框挡住了按钮。此时，程序与其继续执行——从而可能因点击错误物体而导致混乱——不如“看到”它没有点击到正确的位置并自此停止。\n\
  \nPyAutoGUI 的 `pixelMatchesColor()` 函数如果屏幕上给定 x、y 坐标处的像素与给定颜色匹配，将返回 `True`。第一个和第二个参数是\
  \ x 和 y 坐标的整数，第三个参数是一个包含三个整数的元组，代表屏幕像素必须匹配的 RGB 颜色。在交互 shell 中输入以下内容：\n\n```python\n\
  >>> import pyautogui\n>>> im = pyautogui.screenshot()\n➊ >>> im.getpixel((50, 200))\n\
  \   (130, 135, 144)\n➋ >>> pyautogui.pixelMatchesColor(50, 200, (130, 135, 144))\n\
  \   True\n➌ >>> pyautogui.pixelMatchesColor(50, 200, (255, 135, 144))\n   False\n\
  ```\n\n在截图并使用 `getpixel()` 获取特定坐标 ➊像素颜色的 RGB 元组后，将相同的坐标和 RGB 元组传递给 `pixelMatchesColor()`\
  \ ➋，它应该返回 `True`。然后更改 RGB 元组中的一个值，并对相同坐标再次调用 `pixelMatchesColor()` ➌。这应该返回 `False`。当你的\
  \ GUI 自动化程序准备调用 `click()` 的时候，调用这种方法非常有用。注意，给定坐标处的颜色必须完全匹配。即使只有微小差异——例如是 `(255,\
  \ 255, 254)` 而不是 `(255, 255, 255)`——`pixelMatchesColor()` 也返回 `False`。\n\n# 项目：扩展\
  \ mouseNow 程序\n\n你可以扩展本章早些的 `mouseNow.py` 项目，使其不仅提供鼠标光标当前位置的 x、y 坐标，还能提供光标下像素的 RGB\
  \ 颜色。将 `mouseNow.py` 中 `while` 循环内的代码修改如下：\n\n```python\n#! python3\n# mouseNow.py\
  \ - 显示鼠标光标当前位置。\n--snip--\n        positionStr = 'X: ' + str(x).rjust(4) + ' Y:\
  \ ' + str(y).rjust(4)\n        pixelColor = pyautogui.screenshot().getpixel((x,\
  \ y))\n        positionStr += ' RGB: (' + str(pixelColor[0]).rjust(3)\n        positionStr\
  \ += ', ' + str(pixelColor[1]).rjust(3)\n        positionStr += ', ' + str(pixelColor[2]).rjust(3)\
  \ + ')'\n        print(positionStr, end='')\n--snip--\n```\n\n现在，当你运行 `mouseNow.py`\
  \ 时，输出将包含鼠标光标下像素的 RGB 颜色值。\n\n```text\nPress Ctrl-C to quit.\nX:  406 Y:   17 RGB:\
  \ (161, 50, 50)\n```\n\n这些信息结合 `pixelMatchesColor()` 函数，应该让你在 GUI 自动化脚本中添加像素颜色检查变得非常简单。\n\
  \n## 图像识别\n\n但如果你预先不知道 PyAutoGUI 应该点击哪里该怎么办？你可以使用图像识别。给 PyAutoGUI 提供一张你想点击的物体图像，让它来计算出坐标。\n\
  \n例如，如果你之前截过屏来获取 `submit.png` 中的提交按钮图像，`locateOnScreen()` 函数将返回该图像在屏幕上找到的坐标。要查看\
  \ `locateOnScreen()` 如何工作，尝试对屏幕上的一小区域进行截图；然后保存图像并在交互 shell 中输入以下内容，将 `'submit.png'`\
  \ 替换为你的截图文件名：\n\n```python\n>>> import pyautogui\n>>> pyautogui.locateOnScreen('submit.png')\n\
  (643, 745, 70, 29)\n```\n\n`locateOnScreen()` 返回的四整数元组包含左边的 x 坐标、顶边的 y 坐标、以及屏幕上首次找到该图像的宽度和高度。如果你在自己的电脑上用自己的截图进行尝试，你的返回值将与此处显示的不同。\n\
  \n如果在屏幕上找不到该图像，`locateOnScreen()` 将返回 `None`。注意，屏幕上的图像必须与提供的图像完美匹配才能被识别。如果图像仅偏了一个像素，`locateOnScreen()`\
  \ 返回 `None`。\n\n如果图像可以在屏幕的多个地方找到，`locateAllOnScreen()` 将返回一个生成器（Generator）对象，可以传递给\
  \ `list()` 以返回一个包含四整数元组的列表。屏幕上每个找到图像的地点都会对应一个四整数元组。继续交互 shell 示例，输入以下内容（并将 `'submit.png'`\
  \ 替换为你自己的图像文件名）：\n\n```python\n>>> list(pyautogui.locateAllOnScreen('submit.png'))\n\
  [(643, 745, 70, 29), (1007, 801, 70, 29)]\n```\n\n每个四整数元组代表屏幕上的一个区域。如果你的图像只在一个区域找到，那么使用\
  \ `list()` 和 `locateAllOnScreen()` 只是返回一个包含一个元组的列表。\n\n一旦你获得了图像所在区域的四整数元组，就可以通过将元组传递给\
  \ `center()` 函数来点击该区域的中心，以返回区域中心的 x、y 坐标。在交互 shell 中输入以下内容，将参数替换为你自己的文件名、四整数元组和坐标对：\n\
  \n```python\n>>> pyautogui.locateOnScreen('submit.png')\n(643, 745, 70, 29)\n>>>\
  \ pyautogui.center((643, 745, 70, 29))\n(678, 759)\n>>> pyautogui.click((678, 759))\n\
  ```\n\n一旦从 `center()` 获取了中心坐标，将坐标传递给 `click()` 就会点击屏幕上与你传递给 `locateOnScreen()` 的图像匹配的区域中心。\n\
  \n## 控制键盘\n\nPyAutoGUI 还具有向计算机发送虚拟按键的函数，这让你能够填写表单或在应用程序中输入文本。\n\n## 从键盘发送字符串\n\n\
  `pyautogui.typewrite()` 函数向计算机发送虚拟按键。这些按键的作用取决于哪个窗口和文本字段拥有焦点。你可能想先向你想要的文本字段发送一次鼠标点击，以确保它拥有焦点。\n\
  \n作为一个简单的例子，让我们用 Python 自动在文件编辑器窗口中输入 *Hello world!*。首先，打开一个新的文件编辑器窗口并将其放在屏幕的左上角，这样\
  \ PyAutoGUI 就能点击正确的位置使其获得焦点。接下来，在交互 shell 中输入以下内容：\n\n```python\n>>> pyautogui.click(100,\
  \ 100); pyautogui.typewrite('Hello world!')\n```\n\n注意，将两个命令放在同一行并用分号隔开，可以防止交互 shell\
  \ 在运行两条指令之间提示你输入。这防止了你在调用 `click()` 和 `typewrite()` 之间意外切换到一个新窗口焦点，否则会搞乱示例。\n\n\
  Python 会先向坐标 `(100, 100)` 发送一次虚拟鼠标点击，这会点击文件编辑器窗口并使其获得焦点。`typewrite()` 调用将向窗口发送文本\
  \ *Hello world!*，看起来就像图 18-3。你现在拥有了可以为你打字的代码！\n\n\n\n\n\n![使用 PyAutogGUI 点击文件编辑器窗口并向其中输入\
  \ Hello world!](img/httpatomoreillycomsourcenostarchimages2189753.png.jpg)\n\n图\
  \ 18-3. 使用 PyAutogGUI 点击文件编辑器窗口并向其中输入 *Hello world!*\n\n默认情况下，`typewrite()` 函数会立即输入整个字符串。然而，你可以传递可选的第二个参数，在每个字符之间添加简短的暂停。该第二个参数是一个整数或浮点值，表示暂停的秒数。例如，`pyautogui.typewrite('Hello\
  \ world!', 0.25)` 将在输入 `H` 后等待四分之一秒，在输入 `e` 后再等待另一个四分之一秒，依此类推。这种逐渐出现的打字机效果对于那些处理按键速度不足以跟上\
  \ PyAutoGUI 的缓慢应用程序可能有用。\n\n对于像 `A` 或 `!` 等字符，PyAutoGUI 会自动模拟按住 `SHIFT` 键。\n\n##\
  \ 键名\n\n并不是所有的键都容易用单个文本字符表示。例如，你如何用单个字符表示 SHIFT 或左箭头键呢？在 PyAutoGUI 中，这些键盘键通过短字符串值表示：`'esc'`\
  \ 代表 ESC 键，`'enter'` 代表 ENTER 键。\n\n与其使用单个字符串参数，不如将这些键盘键字符串的列表传递给 `typewrite()`。例如，以下调用将按下\
  \ A 键，然后是 B 键，接着是两次左箭头键，最后是 X 和 Y 键：\n\n```\n>>> pyautogui.typewrite(['a', 'b',\
  \ 'left', 'left', 'X', 'Y'])\n```\n\n由于按下左箭头键会移动键盘光标，因此这将输出 *XYab*。表 18-1 列出了你可以传递给\
  \ `typewrite()` 的 PyAutoGUI 键盘键字符串，以模拟按下任何组合键。\n\n你还可以检查 `pyautogui.KEYBOARD_KEYS`\
  \ 列表，查看 PyAutoGUI 接受的所有可能的键盘键字符串。`'shift'` 字符串指的是左 SHIFT 键，等同于 `'shiftleft'`。`'ctrl'`、`'alt'`\
  \ 和 `'win'` 字符串也是如此；它们都指的是左侧键。\n\n表 18-1. PyKeyboard 属性\n\n| 键盘键字符串 | 含义 |\n| ---\
  \ | --- |\n| `'a'`, `'b'`, `'c'`, `'A'`, `'B'`, `'C'`, `'1'`, `'2'`, `'3'`, `'!'`,\
  \ `'@'`, `'#'` 等等 | 单个字符的键 |\n| `'enter'` (或 `'return'` 或 `'\\n'`) | ENTER 键 |\n\
  | `'esc'` | ESC 键 |\n| `'shiftleft'`, `'shiftright'` | 左、右 SHIFT 键 |\n| `'altleft'`,\
  \ `'altright'` | 左、右 ALT 键 |\n| `'ctrlleft'`, `'ctrlright'` | 左、右 CTRL 键 |\n| `'tab'`\
  \ (或 `'\\t'`) | TAB 键 |\n| `'backspace'`, `'delete'` | BACKSPACE 和 DELETE 键 |\n\
  | `'pageup'`, `'pagedown'` | PAGE UP 和 PAGE DOWN 键 |\n| `'home'`, `'end'` | HOME\
  \ 和 END 键 |\n| `'up'`, `'down'`, `'left'`, `'right'` | 上、下、左、右箭头键 |\n| `'f1'`, `'f2'`,\
  \ `'f3'` 等等 | F1 到 F12 键 |\n| `'volumemute'`, `'volumedown'`, `'volumeup'` | 静音、减音量、增音量键（某些键盘没有这些键，但你的操作系统仍然能够理解这些模拟按键）\
  \ |\n| `'pause'` | PAUSE 键 |\n| `'capslock'`, `'numlock'`, `'scrolllock'` | CAPS\
  \ LOCK、NUM LOCK 和 SCROLL LOCK 键 |\n| `'insert'` | INS 或 INSERT 键 |\n| `'printscreen'`\
  \ | PRTSC 或 PRINT SCREEN 键 |\n| `'winleft'`, `'winright'` | 左、右 WIN 键（在 Windows\
  \ 上） |\n| `'command'` | Command 键（OS X 上） |\n| `'option'` | OPTION 键（OS X 上） |\n\
  \n## 按下和释放键盘\n\n与 `mouseDown()` 和 `mouseUp()` 函数一样，`pyautogui.keyDown()` 和 `pyautogui.keyUp()`\
  \ 会向计算机发送虚拟按按下和释放信号。它们接收一个键盘键字符串作为参数（参见 表 18-1）。为了方便，PyAutoGUI 提供了 `pyautogui.press()`\
  \ 函数，它通过调用这两个函数来模拟完整的按键。\n\n运行以下代码，它将输入一个美元符号（通过按住 SHIFT 键并按下 4 ）：\n\n```\n>>> pyautogui.keyDown('shift');\
  \ pyautogui.press('4'); pyautogui.keyUp('shift')\n```\n\n这一行代码按下 SHIFT，按下（并释放）4，然后释放\
  \ SHIFT。如果你需要在文本字段中输入字符串，`typewrite()` 函数会更合适。但对于接受单键命令的应用程序，`press()` 函数是更简单的方法。\n\
  \n## 热键组合\n\n*热键*或*快捷键*是调用某些应用程序功能的按键组合。复制选中内容的常用热键是 CTRL-C（Windows 和 Linux 上）或\
  \ ⌘-C（OS X 上）。用户按下并按住 CTRL 键，然后按下 C 键，最后释放 C 和 CTRL 键。使用 PyAutoGUI 的 `keyDown()`\
  \ 和 `keyUp()` 函数实现此操作，你需要输入以下内容：\n\n```\npyautogui.keyDown('ctrl')\npyautogui.keyDown('c')\n\
  pyautogui.keyUp('c')\npyautogui.keyUp('ctrl')\n```\n\n这相当复杂。相反，请使用 `pyautogui.hotkey()`\
  \ 函数，它接受多个键盘键字符串参数，按顺序按下它们，并按反序释放它们。对于 CTRL-C 示例，代码简单如下：\n\n```\npyautogui.hotkey('ctrl',\
  \ 'c')\n```\n\n此函数对于较大的热键组合特别有用。在 Word 中，CTRL-ALT-SHIFT-S 热键组合会显示样式面板。与其调用八次不同的函数（四个\
  \ `keyDown()` 调用和四个 `keyUp()` 调用），你只需调用 `hotkey('ctrl', 'alt', 'shift', 's')`。\n\
  \n在屏幕左上角有一个新的 IDLE 文件编辑器窗口时，在交互式 shell 中输入以下内容（在 OS X 上，将 `'alt'` 替换为 `'ctrl'`）：\n\
  \n```\n >>> import pyautogui, time\n   >>> def commentAfterDelay():\n➊       pyautogui.click(100,\
  \ 100)\n➋       pyautogui.typewrite('In IDLE, Alt-3 comments out a line.')\n   \
  \      time.sleep(2)\n➌       pyautogui.hotkey('alt', '3')\n\n   >>> commentAfterDelay()\n\
  ```\n\n这定义了一个函数 `commentAfterDelay()`，当调用时，它会点击文件编辑器窗口使其聚焦 ➊，输入 *In IDLE, Alt-3\
  \ comments out a line* ➋，暂停 2 秒，然后模拟按下 ALT-3 热键（或 OS X 上的 CTRL-3）➌。这个键盘快捷键会在当前行前添加两个\
  \ *#* 字符，将其注释掉。（在 IDLE 中编写自己的代码时，这是一个非常实用的小技巧。）\n\n# PyAutoGUI 函数回顾\n\n由于本章涵盖了许多不同的函数，这里有一个快速总结参考：\n\
  \n* `moveTo(x, y)`。将鼠标光标移动到指定的 `x` 和 `y` 坐标。\n* `moveRel(xOffset, yOffset)`。相对于当前位置移动鼠标光标。\n\
  * `dragTo(x, y)`。在按住左键的同时移动鼠标光标。\n* `dragRel(xOffset, yOffset)`。在按住左键的同时相对于当前位置移动鼠标光标。\n\
  * `click(x, y, button)`。模拟点击（默认为左键）。\n* `rightClick()`。模拟右键点击。\n* `middleClick()`。模拟中键点击。\n\
  * `doubleClick()`。模拟双击左键。\n* `mouseDown(x, y, button)`。在 `x`, `y` 处按下指定的按钮。\n* `mouseUp(x,\
  \ y, button)`。在 `x`, `y` 处释放指定的按钮。\n* `scroll(units)`。模拟鼠标滚轮。正参数向上滚动；负参数向下滚动。\n\
  * `typewrite(message)`。输入给定消息字符串中的字符。\n* `typewrite([key1, key2, key3])`。输入给定的键盘键字符串。\n\
  \n\n\n\n\n*   `press(key)`. 按下指定的键盘键字符串。\n*   `keyDown(key)`. 模拟按下指定的键盘键。\n*   `keyUp(key)`.\
  \ 模拟释放指定的键盘键。\n*   `hotkey([key1, key2, key3])`. 模拟按顺序按下指定的键盘键字符串，然后按相反顺序释放它们。\n\
  *   `screenshot()`. 返回一个 `Image` 对象的截图。（有关 `Image` 对象的信息，请参见第 17 章* 找到它。它看起来就像图\
  \ 18-4。\n\n![项目使用的表单](img/httpatomoreillycomsourcenostarchimages2189755.png.jpg)\n\
  \n图 18-4. 该项目使用的表单\n\n从高层次来说，你的程序应该执行以下操作：\n\n*   点击表单的第一个文本字段。\n*   遍历表单，在每个字段中输入信息。\n\
  *   点击提交（Submit）按钮。\n*   对下一组数据重复此过程。\n\n这意味着你的代码需要执行以下操作：\n\n*   调用 `pyautogui.click()`\
  \ 来点击表单和提交按钮。\n*   调用 `pyautogui.typewrite()` 向字段中输入文本。\n*   处理 `KeyboardInterrupt`\
  \ 异常，以便用户可以使用 `CTRL-C` 退出。\n\n打开一个新的文件编辑器窗口并将其保存为 `formFiller.py`。\n\n## 第 1 ：确定步骤\n\
  \n在编写代码之前，你需要确定填写一次表单所需的精确按键和鼠标点击操作。项目：“我的鼠标现在在哪里？”  项目中的 `mouseNow.py` 脚本可以帮助你确定特定的鼠标坐标。你只需要知道第一个文本字段的坐标。点击第一个字段后，只需按\
  \ `TAB`即可将焦点移动到下一个字段。这将省去你为每个字段计算 x 和 y 坐标的麻烦。\n\n以下是向表单输入数据的步骤：\n\n1.  点击 Name（姓名）字段。（使用\
  \ `mouseNow.py` 在最大化浏览器窗口后确定坐标。在 OS X 上，你可能需要点击两次：一次让浏览器获取焦点，再次点击 Name 字段。）\n2.\
  \  输入姓名，然后按 `TAB`。\n3.  输入一个最大的恐惧，然后按 `TAB`。\n4.  按下正确次数的向下箭头来选择魔法师力量来源：按一次选择*魔棒*（wand），按两次选择*护身符*（amulet），三次选择*水晶球*（crystal\
  \ ball），四次选择*金钱*（money）。然后按 `TAB`。（注意，在 OS X 上，每个选项你都必须多按一次向下箭头。对于某些浏览器，你可能还需要按\
  \ `ENTER` 键。）\n5.  按右箭头键选择对警卫机器人（Robocop）问题的答案。按一次选择 *2*，两次选择 *3*，三次选择 *4*，或四次选择\
  \ *5*；或者只需按空格键即可选择 *1*（它是默认高亮的的）。然后按 `TAB`。\n6.  输入额外的评论，然后按 `TAB`。\n7.  按 `ENTER`\
  \ 键“点击”提交按钮。\n8.  提交表单后，浏览器将带你进入页面，你需要在其中点击链接返回表单页面。\n\n请注意，如果你以后再次运行此程序，你可能需要更新鼠标点击坐标，因为浏览器窗口的位置可能发生了变化。为了解决这个问题，在寻找第一个表单字段的坐标之前，务必确保浏览器窗口已最大化。此外，不同操作系统上的不同浏览器工作方式可能与此处提供的步骤略有不同，因此在运行程序之前，检查这些按键组合对你的电脑是否有效。\n\
  \n## 第 2：设置坐标\n\n在浏览器中加载你下载的示例表单（图 18-4）并最大化浏览器窗口。打开一个新的终端（Terminal）或命令行窗口运行 `mouseNow.py`\
  \ 脚本，然后鼠标悬停在 Name 字段上确定其 x y 坐标。这些数字将被赋值给程序中的 `nameField` 变量。此外，找到蓝色提交按钮的 x y 坐标以及\
  \ RGB 元组值。这些值将分别赋值给 `submitButton` 和 `submitButtonColor` 变量。\n\n接下来，为表单填写一些虚拟数据并点击\
  \ **Submit**。你需要查看下一页的样式，以便可以使用 `mouseNow.py` 找到新页面上 *Submit another response*（提交另一个回复）链接的坐标。\n\
  \n让你的源代码看起来所示，确保将所有斜体值替换为你通过自己的测试确定的坐标：\n\n```\n#! python3\n# formFiller.py - 自动填充表单。\n\
  \nimport pyautogui, time\n\n# 将这些设置为你电脑的正确坐标。\nnameField = (648, 319)\nsubmitButton\
  \ = (651, 817)\nsubmitButtonColor = (75, 141, 249)\nsubmitAnotherLink = (760, 224)\n\
  \n# TODO: 给用户一个杀死脚本的机会。\n\n# TODO: 等待表单页面加载。\n\n# TODO: 填充 Name 字段。\n\n# TODO: 填充\
  \ Greatest Fear(s) 字段。\n\n# TODO: 填充 Source of Wizard Powers 字段。\n\n# TODO: 填充 Robocop\
  \ 字段。\n\n# TODO: 填充 Additional Comments 字段。\n\n# TODO: 点击 Submit。\n\n# TODO: 等待表单页面加载。\n\
  \n# TODO: 点击 Submit another response 链接。\n```\n\n现在你需要实际想要输入到此表单的数据。在现实世界中，这些数据可能来自电子表格、纯文本文件或网站，需要额外的代码将其加载到程序中。但对于这个项目，你只需要在变量中硬编码所有数据。向你的程序添加以下内容：\n\
  \n```\n#! python3\n# formFiller.py - 自动填充表单。\n\n--snip--\n\nformData = [{'name':\
  \ 'Alice', 'fear': 'eavesdroppers', 'source': 'wand',\n            'robocop': 4,\
  \ 'comments': 'Tell Bob I said hi.'},\n            {'name': 'Bob', 'fear': 'bees',\
  \ 'source': 'amulet', 'robocop': 4,\n            'comments': 'n/a'},\n         \
  \   {'name': 'Carol', 'fear': 'puppets', 'source': 'crystal ball',\n           \
  \ 'robocop': 1, 'comments': 'Please take the puppets out of the\n            break\
  \ room.'},\n            {'name': 'Alex Murphy', 'fear': 'ED-209', 'source': 'money',\n\
  \            'robocop': 5, 'comments': 'Protect the innocent. Serve the public\n\
  \            trust. Uphold the law.'},\n           ]\n\n--snip--\n```\n\n`formData`\
  \ 列表包含四个不同名字的字典。每个字典都以文本字段名称作为键，以响应作为值。最后一步设置是设置 PyAutoGUI 的 `PAUSE` 变量，在每次函数调用后等待半秒。在\
  \ `formData` 赋值语句之后向你的程序添加以下内容：\n\n```\npyautogui.PAUSE = 0.5\n```\n\n## 第 3：开始输入数据\n\
  \n`for` 循环将遍历 `formData` 列表中的每个字典，将字典中的值传递给 PyAutoGUI 函数，在文本字段中虚拟输入文本。\n\n向你的程序添加以下代码：\n\
  \n\n\n\n\n```python\n#! python3\n   # formFiller.py - Automatically fills in the\
  \ form.\n\n   --snip--\n\n   for person in formData:\n       # 给用户一个机会终止脚本。\n  \
  \     print('>>> 5 SECOND PAUSE TO LET USER PRESS CTRL-C <<<')\n➊     time.sleep(5)\n\
  \n       # 等待表单页面加载。\n➋     while not pyautogui.pixelMatchesColor(submitButton[0],\
  \ submitButton[1],\n       submitButtonColor):\n           time.sleep(0.5)\n\n \
  \  --snip--\n```\n\n作为一个小小的安全特性，脚本设置了五秒的暂停 ➊，让用户有机会按下 CTRL-C（或将鼠标光标移动到屏幕左上角以触发 `FailSafeException`\
  \ 异常）在程序执行意外操作时将其关闭。然后，程序会等待提交按钮的颜色变为 ➋，这让程序知道表单页面已加载。记住你已经在步骤 2 中确定了坐标和颜色信息，并将其存储在\
  \ `submitButton` 和 `submitButtonColor` 变量中。要使用 `pixelMatchesColor()`，你需要传递坐标 `submitButton[0]`\
  \ 和 `submitButton[1]` 以及颜色 `submitButtonColor`。\n\n在等待提交按钮颜色可见的代码之后，添加以下内容：\n\n\
  ```python\n#! python3\n   # formFiller.py - Automatically fills in the form.\n\n\
  \   --snip--\n\n➊     print('Entering %s info...' % (person['name']))\n➋     pyautogui.click(nameField[0],\
  \ nameField[1])\n\n       # 填写姓名 (Name) 字段。\n➌     pyautogui.typewrite(person['name']\
  \ + '\\t')\n\n       # 填写最大的恐惧 (Greatest Fear(s)) 字段。\n➍     pyautogui.typewrite(person['fear']\
  \ + '\\t')\n\n   --snip--\n```\n\n我们偶尔调用 `print()` 来在终端（Terminal）窗口显示程序状态，让用户知道正在发生什么\
  \ ➊。\n\n既然程序知道表单已加载，现在是调用 `click()` 点击姓名字段 ➋，并使用 `typewrite()` 输入 `person['name']`\
  \ 中的字符串 ➌ 了。`'\\t'` 字符被添加到传递给 `typewrite()` 的字符串末尾，以模拟按下 TAB 键，这会将键盘焦点移动到下一个字段——最大的恐惧。再次调用\
  \ `typewrite()` 将将 `person['fear']` 中的字符串输入到该字段，然后跳到表单中的下一个字段 ➍。\n\n## 步骤 4：处理选择列表和单选按钮\n\
  \n“巫师力量”问题的下拉菜单和 Robocop 字段的单选按钮比文本字段更难处理。要用鼠标点击这些选项，你必须找出每个可能选项的 x 和 y 坐标。使用键盘方向键进行选择会更简单。\n\
  \n向你的程序中添加以下内容：\n\n```python\n#! python3\n   # formFiller.py - Automatically fills\
  \ in the form.\n\n   --snip--\n\n       # 填写魔法来源 (Source of Wizard Powers) 字段。\n\
  ➊     if person['source'] == 'wand':\n➋         pyautogui.typewrite(['down', '\\\
  t'])\n       elif person['source'] == 'amulet':\n           pyautogui.typewrite(['down',\
  \ 'down', '\\t'])\n       elif person['source'] == 'crystal ball':\n           pyautogui.typewrite(['down',\
  \ 'down', 'down', '\\t'])\n       elif person['source'] == 'money':\n          \
  \ pyautogui.typewrite(['down', 'down', 'down', 'down', '\\t'])\n\n       # 填写 Robocop\
  \ 字段。\n➌     if person['robocop'] == 1:\n➍         pyautogui.typewrite([' ', '\\\
  t'])\n       elif person['robocop'] == 2:\n           pyautogui.typewrite(['right',\
  \ '\\t'])\n       elif person['robocop'] == 3:\n           pyautogui.typewrite(['right',\
  \ 'right', '\\t'])\n       elif person['robocop'] == 4:\n           pyautogui.typewrite(['right',\
  \ 'right', 'right', '\\t'])\n       elif person['robocop'] == 5:\n           pyautogui.typewrite(['right',\
  \ 'right', 'right', 'right', '\\t'])\n\n   --snip--\n```\n\n一旦下拉菜单获得焦点（记得你已经编写了代码在填写最大的恐惧字段后模拟按下\
  \ TAB），按下向下方向键将移动到选择列表中的下一个项目。根据 `person['source']` 的值，你的程序应该在跳到下一个字段之前发送指定次数的向下方向键按下。如果该用户字典中\
  \ `'source'` 键的值为 `'wand'` ➊，我们模拟按下一次向下方向键（以选择 *Wand*）并按下 TAB ➋。如果 `'source'` 键的值为\
  \ `'amulet'`，我们模拟按下两次向下方向键并按下 TAB，其他其他可能的答案也以此类推。\n\nRobocop 问题的单选按钮可以使用右方向键进行选择——或者，如果你想选择第一个选项\
  \ ➌，只需按下空格键 ➍即可。\n\n## 步骤 5：提交表单并等待\n\n你可以通过将 `person['comments']` 作为参数使用 `typewrite()`\
  \ 函数填写额外评论（Additional Comments）字段。你可以输入额外的 `'\\t'` 将键盘焦点移动到下一个字段或提交按钮。一旦提交按钮获得焦点，调用\
  \ `pyautogui.press('enter')` 将模拟按下回车键并提交表单。提交表单后，你的程序将等待五秒加载下一个页面。\n\n一旦新页面加载，它将有一个\
  \ *Submit another response*（提交另一个回复）链接，它会将浏览器引导到一个新的空白表单页面。你在步骤 2 中将此链接的坐标存储为元组\
  \ `submitAnotherLink`，因此将这些坐标传递给 `pyautogui.click()` 来点击该链接。\n\n新表单准备就绪后，脚本的外层 `for`\
  \ 循环可以继续下一次迭代，并将下一个人的信息输入表单。\n\n添加以下代码完成你的程序：\n\n```python\n#! python3\n# formFiller.py\
  \ - Automatically fills in the form.\n\n--snip--\n\n    # 填写额外评论字段。\n    pyautogui.typewrite(person['comments']\
  \ + '\\t')\n\n    # 点击提交。\n    pyautogui.press('enter')\n\n    # 等待表单页面加载。\n   \
  \ print('Clicked Submit.')\n    time.sleep(5)\n\n    # 点击提交另一个回复链接。\n    pyautogui.click(submitAnotherLink[0],\
  \ submitAnotherLink[1])\n```\n\n一旦主 `for` 循环结束，程序就已经为每个人填好了信息。在这个例子中，只有四个人需要输入。但如果你有\
  \ *4,000* 人，那么编写一个程序来完成这将为你节省大量时间和打字工作！\n\n## 总结\n\n使用 `pyautogui` 模块进行 GUI 自动化允许你通过控制鼠标和键盘来与计算机上的应用程序交互。虽然这种方法灵活到可以执行人类用户可以任何操作，但缺点是这些程序对于它们正在点击或输入的内容几乎是盲目的。在编写\
  \ GUI 自动化程序时，尽量确保它们在收到错误指令时会快速崩溃。崩溃虽然恼人，但比程序带着错误运行要好得多。\n\n你可以使用 PyAutoGUI 在屏幕上移动鼠标光标，并模拟鼠标点击、击键和快捷键。`pyautogui`\
  \ 模块还可以检查屏幕上的颜色，这可以为你的 GUI 自动化程序提供足够的屏幕内容信息，以判断它是否偏离了轨道。你甚至可以给 PyAutoGUI 截图，让它确定你想点击区域的坐标。\n\
  \n你可以结合所有的 PyAutoGUI 特性来自动化计算机上任何机械的重复任务。事实上，看着鼠标光标自动移动和文字自动出现在屏幕上非常催眠。为什么不利用节省下的时间坐着看你的程序为你完成所有工作呢？看到你的聪明让你从那些无聊的工作解脱出来，会有某种满足感。\n\
