- "# Python 自动化无聊的东西：完全初学者的实用编程\n\n\n\n\n\n\n\n\n## 送我的侄子 Jack\n\n## 关于作者\n\nAl Sweigart\
  \ 是一位住在旧金山的软件开发者和技术书籍作者。Python 是他最喜欢的编程语言，他还是 Python 几个开源模块的开发者。他的其他书籍可以在他的网站 `http://www.inventwithpython.com/`\
  \ 上通过知识产权许可免费获取。他的猫重 14 磅。\n\n## 关于技术审查员\n\nAri Lacenski 是一位 Android 应用和 Python\
  \ 软件的开发者。她住在旧金山，在 `http://gradlewhy.ghost.io/`  Android Android 编程，并在 Women Who\
  \ Code 担任导师。她还是一位民谣吉他手。\n\n## 致谢\n\n如果没有许多人的帮助，我无法写出这样的书。我要感谢 Bill Pollock；我的编辑们\
  \ Laurel Chun、Leslie Shen、Greg Poulos 和 Jennifer Griffith-Delgado；以及 No Starch Press\
  \ 的全体员工提供的宝贵帮助。感谢我的技术审查员 Ari Lacenski 提供的极建议、编辑和支持。\n\n非常感谢我们的终身仁独者 Guido van Rossum\
  \ 以及 Python 软件基金会的所有卓越工作。Python 社区是我在技术行业中发现的最好的社区。\n\n最后，我要感谢我的家人、朋友以及 Shotwell’s\
  \ 的伙伴们，体谅我在写这本书期间忙碌的生活。干杯！\n\n# 引言\n\n“你只用了两个小时就完成了我们三个人需要两天才能完成的工作。”我的大学室友在 2000\
  \ 年代初一家零售电子产品商店工作。偶尔，商店会从竞争对手那里收到一份包含数千种产品价格的表格。一个三个人的小组会将表格打印在一叠厚纸上并分头查看。对于每个产品价格，他们会查询自己商店的价格，并记录所有竞争对手卖得更便宜的产品。这通常需要几天时间。\n\
  \n“你们知道，如果有这些打印出来的原始文件，我可以写个程序来做这件事，”我的室友看到他们坐在地板上，周围散落和堆叠着纸时对他们说。\n\n几个小时后，他写出了一个短程序，可以从文件中读取竞争对手的价格，在商店数据库中找到该产品，并记录竞争对手是否更便宜。他仍然是编程新手，大部分大部分时间都花在查阅编程书籍上。实际程序运行只需要几秒钟。我的室友和同事们那天吃了一顿超长的午餐。\n\
  \n这就是计算机编程的力量。计算机就像一把瑞士军刀，你可以为无数任务对其进行配置。许多人花费数小时点击和打字来执行重复任务，却没有意识到如果给机器正确的指令，他们使用的机器可以在几秒钟内完成他们的工作。\n\
  \n## 这本书是给谁看的\n\n软件是我们今天使用的许多工具的核心：几乎每个人都使用社交网络进行通信，许多人的手机里有连接互联网的电脑，大多数办公室工作都涉及与电脑交互以完成工作。因此，对会代码的人的需求激增。无数书籍、交互式网络教程和开发者训练营都承诺将野心勃勃的初学者转变为年薪六数字的软件工程师。\n\
  \n这本书不是给那些人准备的。它是给其他人准备的。\n\n单凭这本书无法让你成为专业的软件开发者，就像几节吉他课无法让你成为摇滚明星一样。但如果你是一名办公人员、管理员、学者或任何其他为了工作或娱乐使用电脑的人，你将学习编程基础，以便能够实现以下简单任务的自动化：\n\
  \n* 移动和重命名数千个文件并将它们分类到文件夹中\n* 填写在线表单，无需打字\n* 每当网站更新时下载文件或从网站复制文本\n* 让电脑向你发送自定义通知\n\
  * 更新或格式化 Excel 表格\n* 检查电子邮件并发送预先写的回复\n\n这些任务对人类来说简单但耗费时间，而且它们通常非常琐碎或特殊，以至于没有现成的软件来执行。掌握一点编程知识，你就可以让计算机替你完成这些任务。\n\
  \n## 规范\n\n这本书并非设计成参考手册；它是一本初学者的指南。代码风格有时违背最佳实践（例如，某些程序使用全局变量），但为了让代码更容易学习，这种权衡。这本书是为了人们编写丢弃型代码而做的，因此没有在风格和优雅上花费太多时间。复杂的编程概念——如面向对象编程、列表推导式和生成器——因为它们增加了复杂性而未涵盖。资深程序员可能会指出书中代码如何更改以提高效率，但这本书主要关注用最少的精力让程序运行。\n\
  \n## 编程是什么？\n\n电视节目和电影经常显示程序员在发光的屏幕上疯狂输入加密的 1 和 0 流，但现代编程并没有那么神秘。编程仅仅是为计算机输入执行指令的行为。这些指令可能计算某些数字、修改文本、在文件中查找信息，或通过互联网与其他计算机通信。\n\
  \n所有程序都使用基础指令作为构建块。以下是英语中最常见的几种指令：\n\n* “做这个；然后做那个。”\n* “如果这个条件为真，执行此操作；否则执行那个操作。”\n\
  * “执行这个操作若干次。”\n* “继续这样做，直到这个条件为真。”\n\n你也可以组合这些构建块来实现更复杂的决策。例如，这里是用 Python 编程语言编写的简单程序的编程指令，称为源代码。从顶部开始，Python\
  \ 软件运行每一行代码（某些行仅在特定条件为真时运行，否则 Python 运行其他行），直到到达底部。\n\n```\n➊ passwordFile = open('SecretPasswordFile.txt')\n\
  ➋ secretPassword = passwordFile.read()\n➌ print('Enter your password.')\n  typedPassword\
  \ = input()\n➍ if typedPassword == secretPassword:\n➎    print('Access granted')\n\
  ➏    if typedPassword == '12345':\n➐       print('That password is one that an idiot\
  \ puts on their luggage.')\n  else:\n➑    print('Access denied')\n```\n\n你可能对编程一无所知，但通过阅读上面的代码，你可能可以推出它的功能。首先，打开文件\
  \ `SecretPasswordFile.txt` ➊，并读取其中的秘密密码 ➋。然后，提示用户输入密码（从键盘输入） ➌。这两个密码 `typedPassword`\
  \ 和 `secretPassword` 经过比较 ➍，如果它们相同，程序在屏幕上打印 `Access granted` ➎。接下来，程序检查密码是否为 `12345`\
  \ ➏，并提示这个选择可能不是最好的密码 ➐。如果密码不相同，程序在屏幕上打印 `Access denied` ➑。\n\n### 什么是 Python？\n\n\
  \n\n\n\n`Python` 指的是 Python 语言（包含编写有效 Python 代码的语法规则）以及读取源代码（用 Python 语言编写）并执行其指令的\
  \ Python 解释器软件。Python 解释器可以从 `[`python.org/`](http://python.org/)` 免费下载，提供 Linux、OS\
  \ X 和 Windows 版本。\n\nPython 的名字来源于超现实主义的英国喜剧小组蒙提派森（Monty Python），而不是源于蛇。Python 程序员被亲切地称为\
  \ Pythonistas，而且蒙提派森和蛇的引用通常都会穿插在 Python 教程和文档中。\n\n### 程序员不需要多少数学\n\n我听过的关于学习编程的最常见的焦虑是，人们认为这需要大量的数学知识。实际上，大多数编程不需要基础算术以外的数学知识。事实上，擅长编程与擅长解数独谜没有太大区别。\n\
  \n要解开数独谜，必须在整个 9×9 盘格的每一行、每一列和每个 3×3 内部方格内填入 1 到 9 的数字。你通过初始数字应用推理和逻辑来找到解决方案。例如，由于数字\
  \ 5 出现在`图 1`所示所示，它不能出现在顶行的其他位置、最左列或左上角的 3×3 方格中。一次解决一行、一列或一个方格将为谜题的其他部分提供更多数字线索。\n\
  \n![一个新的数独谜（左侧）及其解决方案（右）。尽管使用了数字，但数独并不涉及大量数学。（图片 © Wikimedia Commons)](img/httpatomoreillycomsourcenostarchimages2189555.png.jpg)\n\
  \n图 1。一个新的数独谜（左侧）及其解决方案（右）。尽管使用了数字，但数独并不涉及大量数学。（图片 © Wikimedia Commons）\n\n仅仅因为数独涉及数字，并不意味着你必须擅长数学才能找到解决方案。编程也是如此。就像解数独一样，编写程序涉及将一个问题分解为单个、详细的步骤。同样，当你`debugging`\
  \ 程序时（即发现并修复错误），你会耐心地观察程序在做什么，并找到 bug 的原因。就像所有技能一样，你编程得越多，就会变得越好。\n\n### 编程是一项创造性活动\n\
  \n编程是一项创造性任务，有点像用乐高积木搭建城堡。你对想要的城堡的样子有一个基本想法，并清点可用的区块。然后开始构建。一旦你完成了程序的编写，就可以像装饰城堡一样美化你的代码。\n\
  \n编程与其他创造性活动的区别在于，编程时你的计算机里拥有所需的所有原材料；你不需要购买额外的画布、颜料、胶片、线、乐高积木或电子元件。当程序编写完成后，它可以轻松地在线与全世界共享。尽管你在编程时会出错，但活动活动仍然趣。\n\
  \n# 关于本书\n\n本书的第一部分涵盖基础 Python 编程概念，第二部分涵盖你可以让计算机自动化的各种任务。第二部分的每一章都有项目程序供你学习。以下是每章包含内容的简要概述：\n\
  \n**第一部分**\n\n*   **第 1 章**\n\n*   **第 7 章` 免费下载 Windows、OS X 和 Ubuntu 的 Python。如果你从网站下载页面下载最新版本，书中的所有程序应该都可以运行。\n\
  \n### 警告\n\n*务必下载 Python 3 版本（例如 3.4.0）。本书中的程序为 Python 3 编写，在 Python 2 上可能无法正确运行，或者根本无法运行。*\n\
  \n\n\n\n你可以在下载页面找到适用于各种操作系统的 64 位和 32 位电脑的 Python 安装程序，因此首先要确定你需要哪种安装程序。如果你是在 2007\
  \ 年或之后购买的电脑，它很可能是 64 位系统。否则，你使用的是 32 位版本，但这里是确确认的方法：\n\n- 在 Windows 上，选择`开始`▸`控制面板`▸`系统`并检查“系统类型”显示的是\
  \ 64 位还是 32 位。\n- 在 OS X 上，进入 Apple 菜单，选择`关于此本机`▸`更多信息` ▸ `系统报告`▸`硬件`，然后查看“处理器名称”字段。如果显示\
  \ Intel Core Solo 或 Intel Core Duo，则你有一台 32 位机器。如果显示其他任何内容（包括 Intel Core 2 Duo），则你有一台\
  \ 64 位机器。\n- 在 Ubuntu Linux 上，打开终端并运行命令 `uname -m`。响应 `i686` 表示 32 位，`x86_64` 表示\
  \ 64 位。\n\n## 安装 Python\n\n在 Windows 上，下载 Python 安装程序（文件名以 `.msi` 结尾）并双击它。按照安装程序在屏幕上显示的指令安装\
  \ Python，步骤所示：\n\n1. 选择`为所有用户安装`然后点击`下一步`。\n2. 点击`下一步`将安装到 `C:\\Python34` 文件夹。\n\
  3. 再次点击`下一步`以跳过自定义 Python 部分。\n\n在 Mac OS X 上，下载适用于你的 OS X 版本的 `.dmg` 文件并双击它。按照安装程序在屏幕上显示的指令安装\
  \ Python，步骤所示：\n\n1. 当 DMG 软件包在新窗口中打开时，双击 `Python.mpkg` 文件。你可能需要输入管理员密码。\n2. 点击`继续`通过欢迎界面，并点击`同意`接受许可协议。\n\
  3. 选择`HD Macintosh`（或你硬盘的名称）并点击`安装`。\n\n如果你正在运行 Ubuntu，可以通过以下步骤从终端安装 Python：\n\n\
  1. 打开终端窗口。\n2. 输入 `sudo apt-get install python3`。\n3. 输入 `sudo apt-get install idle3`。\n\
  4. 输入 `sudo apt-get install python3-pip`。\n\n# 启动 IDLE\n\n虽然 Python 解释器是运行 Python\
  \ 程序的软件，但交互式开发环境（IDLE）是你输入程序的地方，就像文字处理器一样。让我们现在启动 IDLE。\n\n- 在 Windows 7 或更高版本上，点击屏幕左下角的开始图标，在搜索框中输入\
  \ `IDLE`并选择 `IDLE (Python GUI)`。\n- 在 Windows XP 上，点击`开始`按钮，然后选择`程序`▸`Python 3.4`▸`IDLE\
  \ (Python GUI)`。\n- 在 Mac OS X 上，打开 Finder 窗口，点击`应用程序`，点击 `Python 3.4`，然后点击 IDLE\
  \ 图标。\n- 在 Ubuntu 上，选择`应用程序`▸`杂项`▸`终端`然后输入 `idle3`。（你也可以点击屏幕顶部的`应用程序`，选择`编程`，然后点击\
  \ `IDLE 3`。）\n\n## 交互式 Shell\n\n无论你运行的是什么操作系统，首次出现的 IDLE 窗口大部分应该是空白的，只有如下所示文本：\n\
  \n```\nPython 3.4.0 (v3.4.0:0f71465c13, Mar 2014, 19:25) [MSC v1600 Windows onAMD64]\
  \ Type \"copyright\", \"license()\" for more information.\n>>>\n```\n\n这个窗口被称为交互式\
  \ shell。shell 是一个让你向计算机输入指令的程序，类似于分别是 OS X 和 Windows 上的终端或命令提示符。Python 的交互式 shell\
  \ 允许你输入供 Python 解释器运行的指令。计算机读取你输入的指令并立即运行它们。例如，在交互式 shell 的 `>>>` 提示符处输入以下内容：\n\n\
  ```python\n>>> print('Hello world!')\n```\n\n在你输入该行并按回车键后，交互式 shell 应该显示：\n\n```python\n\
  >>> print('Hello world!')\nHello world!\n```\n\n# 如何获取帮助\n\n独立解决编程问题比你想象的要容易。如果你不确信，那么让我们故意制造一个错误：在交互式\
  \ shell 中输入 `'42 + 3`。你现在不需要知道这条指令的意思，但结果应该像这样：\n\n```\n>>> '42' + 3\nTraceback\
  \ (most recent call last):\n  File \"<string>\", line 1, in <module>\n    '42' +\
  \ 3\nTypeError: Can't convert 'int' object to str\n```\n\n错误消息在这里出现是因为 Python 无法理解你的指令。回溯（traceback）部分显示了\
  \ Python 出问题的特定指令和行号。如果你不确定某个特定错误消息是什么，请在网上搜索精确的错误消息。在你喜爱的搜索引擎中输入 `TypeError: Can’t\
  \ convert ‘int’ object to str`（包括引号），你应该能看到许多解释该错误消息含义及其原因的链接。\n\nGoogle 对错误消息的搜索结果非常有帮助。你经常会发现别人和你一样的问题，而且其他热心的人已经回答了它。没有人能知晓一切，所以软件开发者的日常工作之一就是查找答案。\n\
  \n# 如何聪明地提问\n\n如果你无法通过搜索找到答案，可以尝试在网络论坛上提问，例如 Stack Overflow (http://stackoverflow.com/)\
  \ 或 reddit 的“学习编程”板块 (http://reddit.com/r/learnprogramming/)。但记住，提问的方式有助于他人帮助你。\n\
  \n在提问编程问题时，请记住以下操作：\n\n- 解释你想做什么，而不仅仅是你做了什么。这让你的帮助者知道你是否找错了方向。\n- 指定错误发生点。它是在程序启动时发生的，还是在执行某些操作后发生的？\n\
  - 将*整个*错误消息和你的代码复制到 http://pastebin.com/ 或 http://gist.github.com/。这些网站方便你在互联网上共享大量代码，而不会丢失任何文本格式。你可以将发布代码的\
  \ URL 放在邮件或论坛帖子中。例如，这里是我发布的一些代码：http://pastebin.com/SzP2DbFx/ 和 https://gist.github.com/asweigart/6912168/。\n\
  - 解释你已经尝试过哪些解决问题的办法。这告诉人们你已经付出了努力来独立解决问题。\n- 如果错误是在你修改代码后出现的，解释你具体修改了什么。\n- 说明你每次运行程序时都能重现该错误，还是只有在执行某些操作后才会发生。如果是后者，请说明那些操作是什么。\n\
  \n始终遵循良好的网络礼仪。例如，不要用全大写发布你的问题，不要对试图帮助你的人提出不合理的要求。\n\n\n\n\n对于大多数人来说，计算机只是一个家用电器，而不是工具。但通过学习编程，你将获得现代世界最强大的工具之一，并在这个过程中发现乐趣。编程并不是脑手术——业余人士进行实验和犯错完全没有问题。\n\
  \n我喜欢帮助人们发现 Python。我在我的博客 [`inventwithpython.com/blog/`](http://inventwithpython.com/blog/)\
  \ 上撰写编程教程，你可以通过 al@inventwithpython.com 向我提问。\n\n这本书将带你从零零基础开始学习编程知识，但你可能会遇到超出本书范围的问题。请记住，提问有效的问题以及知道如何找到答案是你编程之旅中无无拟的工具。\n\
  \n让我们开始吧！\n\n# 第一部分 Python 编程基础\n\n# 第 1 章 Python 基础\n\nPython 编程语言具有广泛的语法结构、标准库函数和交互式开发环境功能。幸运的是，你可以忽略其中大部分内容；你只需要学习足够编写一些实用小程序的知识。\n\
  \n然而，在做任何事情之前，你必须学习一些基础编程概念。就像一个初级魔法师一样，你可能会认为这些概念看起来晦奥又枯燥，但通过一些知识和实践，你就能像指挥魔棒一样指挥你的计算机来完成不可思议的成就。\n\
  \n本章有几个示例，鼓励你在交互式 shell 中输入内容，这可以让你一次执行一条 Python 指令并立即显示结果。使用交互式 shell 对于学习基础 Python\
  \ 指令的作用非常有帮助，因此在跟随时请尝试一下。你对操作过的记忆会比只读过的要深刻得多。\n\n## 在交互式 shell 中输入表达式\n\n你可以通过启动\
  \ IDLE 来运行交互式 shell，你在引言中随 Python 一起安装了它。在 Windows 上，打开开始菜单，选择`所有程序` ▸ `Python 3.3`，然后选择\
  \ `IDLE (Python GUI)`。在 OS X 上，选择`应用程序` ▸ `MacPython 3.3` ▸ `IDLE`。在 Ubuntu 上，打开一个新的终端窗口并输入\
  \ `idle3`。\n\n一个带有 `>>>` 提示符的窗口将会出现；那就是交互式 shell。在提示符处输入 `2 + 2` 让 Python 执行一些简单的数学计算。\n\
  \n```\n>>> 2 + 2\n4\n```\n\nIDLE 窗口现在应该显示类似下面的文本：\n\n```\nPython 3.3.2 (v3.3.2:d047928ae3f6,\
  \ May 16 2013, 00:06:53) [MSC v.1600 64 bit\n(AMD64)] on win32\nType \"copyright\"\
  , \"credits\" or \"license()\" for more information.\n>>> 2 + 2\n4\n>>>\n```\n\n\
  在 Python 中，`2 + 2` 被称为*表达式*，它是该语言中最基本的编程指令。表达式由*值*（例如 `2`）和*运算符*（例如 `+`）组成，它们始终可以*求值*（即简化）为一个单一值。这意味着你可以在\
  \ Python 代码中任何可以使用值的地方也使用表达式。\n\n在上例的示例中，`2 + 2` 被求值为一个单一值 `4`。一个没有运算符的单一值也被视为一个表达式，尽管它只求值为其本身，如下所示：\n\
  \n```\n>>> 2\n2\n```\n\n### 错误是没关系的！\n\n如果程序包含计算机无法理解的代码，程序将会崩溃，这会导致 Python 显示错误信息。不过，错误信息不会损坏你的计算机，所以不要害怕犯错。*崩溃*只是意味着程序意外停止了运行。\n\
  \n如果你想了解更多关于错误信息的信息，可以在网上搜索精确的消息文本以查找更多关于该特定错误的信息。你也可以查看 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 资源，查看常见 Python 错误信息列表及其含义。\n\n在 Python 表达式中还有许多其他可以使用的运算符。例如，表 1-1 (#ch01.html_math_operators_from_highest_to_lowest_pr\
  \ \"表 1-1.优先级从高到低的数学运算符\") 列出了 Python 中所有的数学运算符。\n\n表 1-1. 优先级从高到低的数学运算符\n\n| 运算符\
  \ | 操作 | 示例 | 求值结果为 |\n\n| --- | --- | --- | --- |\n\n| `**` | 幂 | `2 ** 3` | `8`\
  \ |\n| `%` | 取模/余数 | `22 % 8` | `6` |\n| `//` | 整除/取整商 | `22 // 8` | `2` |\n| `/`\
  \ | 除法 | `22 / 8` | `2.75` |\n| `*` | 乘法 | `3 * 5` | `15` |\n| `-` | 减法 | `5 - 2`\
  \ | `3` |\n| `+` | 加法 | `2 + 2` | `4` |\n\nPython 数学运算符的运算顺序（也称为*优先级*）与数学类似。首先求值\
  \ `**` 运算符；接下来从左到右求值 `*`、`/`、`//` 和 `%`；最后求值 `+` 和 `-`。你可以使用括号来覆盖默认的优先级：\n\n```\n\
  >>> 2 ** 3\n8\n>>> 22 % 8\n6\n>>> 22 // 8\n2\n>>> 22 / 8\n2.75\n>>> 3 * 5\n15\n\
  >>> 5 - 2\n3\n>>> 2 + 2\n4\n>>> (2 + 2) * 3\n12\n>>> 2 * (2 + 3)\n10\n```\n\n\n\n\
  \nPython 程序也可以包含名为 `strings`（字符串）或 `strs`（读作“stirs”）的文本值。务必用单引号（`'`）包围你的字符串（例如 `'Hello'`\
  \ 或 `'Goodbye cruel world!'`），这样 Python 才能知道字符串从哪里开始到哪里结束。你甚至可以不包含任何字符的字符串 `''`，它被称为\
  \ `blank string`（空字符串）。关于字符串，在第 4 章中有更详细的介绍。\n\n如果你看到错误信息 `SyntaxError: EOL while\
  \ scanning string literal`，你可能忘记了在字符串的末尾加上最后一个单引号了，如下例所示：\n\n```\n>>> 'Hello world!\n\
  SyntaxError: EOL while scanning string literal\n```\n\n## 字符串拼接与复制\n\n运算符的含义可能会根据其相邻数值的数据类型而改变。例如，当\
  \ `+` 作用于两个整数或浮点数时，它是加法运算符。然而，当 `+` 用于两个字符串值时，它就作为`string concatenation`（字符串拼接）运算符。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> 'Alice' + 'Bob'\n'AliceBob'\n```\n\n该表达式求值得到一个单一的新字符串值，结合了两个字符串的文本。然而，如果你尝试对一个字符串和一个整数值使用\
  \ `+` 运算符，Python 将不知道如何处理，并会显示一条错误信息。\n\n```\n>>> 'Alice' + 42\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#26>\", line 1, in <module>\n    'Alice'\
  \ + 42\nTypeError: Can't convert 'int' object to str implicitly\n```\n\n错误信息 `Can't\
  \ convert 'int' object to str implicitly` 意味着 认为你正试图将整数拼接到字符串 `'Alice'` 上。你的代码必须显式将整数转换为字符串，因为\
  \ Python 无法自动完成。（在讨论 `str()`、`int()` 和 `float()` 函数时，将在剖析你的程序中详细解释数据类型的转换。）\n\n\
  当 `*` 运算符作用于两个整数或浮点数时，它被用于乘法。但当 `*` 运算符用于一个字符串值和一个整数值时，它就变成了`string replication`（字符串复制）运算符。在交互式\
  \ shell 中输入一个字符串乘以一个数字来观察效果。\n\n```\n>>> 'Alice' * 5\n'AliceAliceAliceAliceAlice'\n\
  ```\n\n该表达式求值得到一个单一的字符串值，重复原始字符串次数等于整数值。字符串复制是一个实用的技巧，但它的使用频率没有字符串拼接那么高。\n\n`*`\
  \ 运算符只能用于两个数值值（用于乘法）或一个字符串值和一个整数值（用于字符串复制）。否则，Python 将只会显示一条错误信息。\n\n```\n>>> 'Alice'\
  \ * 'Bob'\nTraceback (most recent call last):\n  File \"<pyshell#32>\", line 1,\
  \ in <module>\n    'Alice' * 'Bob'\nTypeError: can't multiply sequence by non-int\
  \ of type 'str'\n>>> 'Alice' * 5.0\nTraceback (most recent call last):\n  File \"\
  <pyshell#33>\", line 1, in <module>\n    'Alice' * 5.0\nTypeError: can't multiply\
  \ sequence by non-int of type 'float'\n```\n\nPython 无法理解这些表达式是有的：你不能将两个单词相乘，而且很难将任意字符串复制分数倍的次数。\n\
  \n## 在变量中存储值\n\n`variable`（变量）就像计算机内存中的一个盒子，你可以在其中存储单个值。如果你想在程序的后续部分使用求值表达式的结果，可以将其保存在变量中。\n\
  \n### 赋值语句\n\n你将通过`assignment statement`（赋值语句）在变量中存储值。赋值语句由一个变量名、一个等号（称为`assignment\
  \ operator`）和要存储的值组成。如果你输入赋值语句 `spam = 42`，那么名为 `spam` 的变量将存储整数值 `42`。\n\n将变量想象成一个带有标签的盒子，值被存放在其中，如图\
  \ 1-2 所示。\n\n![spam = 42 is like telling the program, “The variable spam now has\
  \ the integer value 42 in it.”](img/httpatomoreillycomsourcenostarchimages2189561.png.jpg)\n\
  \n图 1-2。`spam = 42` 就像在告诉程序，“变量 spam 现在包含整数值 42。”\n\n例如，在交互式 shell 中输入以下内容：\n\n\
  ```\n➊ >>> spam = 40\n   >>> spam\n   40\n   >>> eggs = 2\n➋ >>> spam + eggs\n \
  \  42\n   >>> spam + eggs + spam\n   82\n➌ >>> spam = spam + 2\n   >>> spam\n  \
  \ 42\n```\n\n变量在第一次向其存储值时被`initialized`（初始化，或创建） ➊。从此开始，你可以在包含其他变量和值的表达式中使用它 ➋。当变量被分配一个新值\
  \ ➌ 时，旧值就会被覆盖。这被称为`overwriting`变量。在交互式 shell 中输入以下代码尝试覆盖字符串：\n\n```\n>>> spam =\
  \ 'Hello'\n>>> spam\n'Hello'\n>>> spam = 'Goodbye'\n>>> spam\n'Goodbye'\n```\n\n\
  就像图 1-2 所示，`spam` 变量存储了 `'Hello'` 直到你将其替换为 `'Goodbye'`。\n\n### 变量名\n\n表 1-3 提供了合法变量名的示例。只要遵守以下三个规则，你可以为变量命名命名：\n\
  \n1. 必须是一个单词。\n2. 可以使用字母、数字和下划线（`_`）。\n3. 不能以数字开头。\n\n表 1-3. 有效和无效变量名\n\n| 有效变量名\
  \ | 无效变量名 |\n| --- | --- |\n| `balance` | `current-balance` (不允许使用连字符) |\n| `currentBalance`\
  \ | `current balance` (不允许空格) |\n| `current_balance` | `4account` (不能以数字开头) |\n\
  | `_spam` | `42` (不能以数字开头) |\n| `SPAM` | `total_$um` (不允许使用特殊字符 `$` |\n| `account4`\
  \ | `'hello'` (不允许使用特殊字符 `'`) |\n\n变量名对大小写敏感，这意味着 `spam`、`SPAM`、`Spam` 和 `sPaM`\
  \ 是四个不同的变量。Python 的习惯是用小写字母开始变量。\n\n\n\n虽然交互式 shell 适合逐条运行 Python 指令，但要编写整个 Python\
  \ 程序，你需要在编辑器中输入指令。`file editor`（文件编辑器）类似于记本或 TextMate 等文本编辑器，但它具有一些用于输入源代码的特定功能。在\
  \ IDLE 中打开文件编辑器，选择 `File`▸`New Window`。\n\n出现的窗口应该包含一个等待你输入的光标，但它与交互式 shell 不同，后者会在你按下\
  \ ENTER 键后立即运行 Python 指令。文件编辑器允许你输入许多指令、保存文件并运行程序。以下是区分两者的方法：\n\n*   交互式 shell 窗口总是带有\
  \ `>>>` 提示符的那一个。\n*   文件编辑器窗口没有 `>>>` 提示符。\n\n现在是时候创建你的第一个程序了！当文件编辑器窗口打开时，向其中输入以下内容：\n\
  \n```python\n➊ # 这个程序向我打招呼并询问我的名字。\n\n➋ print('Hello world!')\n   print('What is\
  \ your name?')    # 询问名字\n➌ myName = input()\n➍ print('It is good to meet you, '\
  \ + myName)\n➎ print('The length of your name is:')\n   print(len(myName))\n➏ print('What\
  \ is your age?')    # 询问年龄\n   myAge = input()\n   print('You will be ' + str(int(myAge)\
  \ + 1) + ' in a year.')\n```\n\n一旦输入了源代码，请保存它，这样你每次启动 IDLE 时就不需要重新输入。在文件编辑器窗口顶部的菜单中，选择\
  \ `File`▸`Save As`。在 Save As 窗口中，在 File Name 字段中输入 `hello.py`，然后点击 `Save`。\n\n你应该在输入程序时时不时保存。这样，如果计算机崩溃或你不小心退出了\
  \ IDLE，代码就不会丢失。作为快捷键，你可以在 Windows 和 Linux 上按下 `CTRL-S`，或在 OS X 上按下 `⌘-S` 来保存文件。\n\
  \n保存后，让我们运行程序。选择 `Run`▸`Run Module` 或直接按 `F5` 键。你的程序应该运行在你首次启动 IDLE 时出现的交互式 shell\
  \ 窗口中。记住，你必须在文件编辑器窗口中按 `F5`，而不是在交互式 shell 窗口中。当程序询问名字时，输入你的名字。交互式 shell 中的程序输出看起来像这样：\n\
  \n```\nPython 3.3.2 (v3.3.2:d047928ae3f6, May 16 2013, 00:06:53) [MSC v.1600 64\
  \ bit\n(AMD64)] on win32\nType \"copyright\", \"credits\" or \"license()\" for more\
  \ information.\n>>> ================================ RESTART ================================\n\
  >>>\nHello world!\nWhat is your name?\nAl\nIt is good to meet you, Al\nThe length\
  \ of your name is:\n2\nWhat is your age?\n4\nYou will be 5 in a year.\n>>>\n```\n\
  \n当没有更多代码行执行时，Python 程序就会 `terminates`（终止）；即停止运行。（你也可以说 Python 程序 `exits` 退出）。\n\
  \n你可以通过点击窗口顶部的 X 关闭文件编辑器。要重新加载已保存的程序，从菜单中选择 `File`▸`Open`。现在就操作，在出现的窗口中选择 `hello.py`，并点击\
  \ `Open` 按钮。你之前保存的 `hello.py` 程序应该会在文件编辑器窗口中打开。\n\n## 解析你的程序\n\n在你文件编辑器中打开新程序后，让我们通过观察每行代码的作用，来快速浏览一下它使用的\
  \ Python 指令。\n\n### 注释\n\n下面这一行被称为 `comment`（注释）。\n\n```python\n➊ # 这个程序向我打招呼并询问我的名字。\n\
  ```\n\nPython 会忽略注释，你可以使用它们来写笔记或提醒自己代码正尝试做什么。哈希标记 (`#`) 之后该行的任何文本都是注释的一部分。\n\n有时，程序员会在一行代码前面加一个\
  \ `#`，以便在测试程序时临时移除它。这被称为 `commenting out`（注释掉）代码，当你试图弄清楚程序为什么不起时，这非常有用。当你准备好放回该行时，可以以后删除\
  \ `#`。\n\nPython 也会忽略注释后的空行。你可以根据需要向程序中添加任意数量的空行。这可以让你的代码更易读，就像书中的段落一样。\n\n### print()\
  \ 函数\n\n`print()` 函数在屏幕上显示括号内的字符串值。\n\n```python\n➋ print('Hello world!')\n   print('What\
  \ is your name?') # 询问名字\n```\n\n`print('Hello world!')` 这一行的意思是“打印字符串 'Hello world!'\
  \ 中的文本。”当 Python 执行这一行时，你说 Python 正在 `calling`（调用）`print()` 函数，字符串值正被 `passed`（传递）给函数。传递给函数调的值被称为\
  \ `argument`（参数）。注意引号不会打印到屏幕上。它们只是标记字符串的开始和结束；不是字符串值的一部分。\n\n### Note 释\n\n你也可以使用此函数在屏幕上留出空行；只需调用\
  \ `print()` 即可。\n\n### input() 函数\n\n`input()` 函数等待用户在键盘上输入某些文本。\n\n```python\n\
  ➌ myName = input()\n```\n\n`input()` 函数的结果取决于用户输入的任何字符串。如果用户输入 `'Al'`，那么 `myName`\
  \ 等于 `'Al'`。\n\n### 打印用户的名字\n\n以下对 `print()` 的调用实际上包含表达式：\n\n```python\n➍ print('It\
  \ is good to meet you, ' + myName)\n```\n\n该表达式求值为 `'It is good to meet you, Al'`。这个单一字符串值随后被传递给\
  \ `print()`，由其打印出来。\n\n### len() 函数\n\n你可以向 `len()` 函数传递一个字符串值（或包含字符串的变量），该函数求值为该字符串中字符数量的整数值。\n\
  \n```python\n➎ print('The length of your name is:')\n   print(len(myName))\n```\n\
  \n在交互式 shell 中输入以下内容进行尝试：\n\n```python\n>>> len('hello')\n5\n>>> len('My energetic\
  \ monster just scarfed nachos.')\n46\n>>> len('')\n0\n```\n\n就像这些示例一样，`len(myName)`\
  \ 求值为整数。随后它被传递给 `print()` 显示在屏幕上。注意 `print()` 允许你传递整数值或字符串值。但注意在交互式 shell 中输入以下内容时显示的错误：\n\
  \n```python\n>>> print('I am ' + 29 + ' years old.')\nTraceback (most recent call\
  \ last):\n  File \"<pyshell#6>\", line 1, in <module>\n    print('I am ' + 29 +\
  \ ' years old.')\nTypeError: can't concatenate \"str\" to \"int\n```\n\n`print()`\
  \ 函数并不是导致该错误的原因，而是你尝试传递给 `print()` 的表达式。如果你单独在交互式 shell 中输入该表达式，也会得到相同的错误信息。\n\n\
  ```python\n>>> 'I am ' + 29 + ' years old.'\nTraceback (most recent call last):\n\
  \  File \"<pyshell#7>\", line 1, in <module>\n    'I am ' + 29 + ' years old.'\n\
  TypeError: can't concatenate \"str\" to \"int\n```\n\nPython 给出错误是因为你只能将 `+` 运算符用于两个整数相加或两个字符串拼接。你不能将整数加到字符串，因为这在\
  \ Python 中是不符合语法的。你可以通过使用整数的字符串版本来修复此，正如下一节解释的那样。\n\n\n\n\n如果你想将一个整数（如 `29`）与字符串拼接并传递给\
  \ `print()`，你需要获取值 `'29'`，它是 `29` 的字符串形式。`str()` 函数可以接受一个整数值，并将其求值为该值的字符串版本，如下：\n\
  \n```python\n>>> str(29)\n'29'\n>>> print('I am ' + str(29) + ' years old.')\nI\
  \ am 29 years old.\n```\n\n因为 `str(29)` 结果为 `'29'`，表达式 `'I am ' + str(29) + ' years\
  \ old.'` 结果为 `'I am ' + '29' + ' years old.'`，进而结果为 `'I am 29 years old.'`。这就是传递给\
  \ `print()` 函数的值。\n\n`str()`、`int()` 和 `float()` 函数将分别将你传递的值求值为其字符串、整数和浮点数形式。尝试在交互式\
  \ shell 中用这些函数转换一些值，并观察发生了什么。\n\n```python\n>>> str(0)\n'0'\n>>> str(-3.14)\n'-3.14'\n\
  >>> int('42')\n42\n>>> int('-99')\n-99\n>>> int(1.25)\n1\n>>> int(1.99)\n1\n>>>\
  \ float('3.14')\n3.14\n>>> float(10)\n10.0\n```\n\n之前的示例调用了 `str()`、`int()` 和 `float()`\
  \ 函数，并传递了其他数据类型的值，以获取这些值的字符串、整数或浮点数形式。\n\n当你有一个想要与字符串拼接的整数或浮点数时，`str()` 函数非常有用。如果你有一个作为字符串形式的数字想在某些数学计算中使用，`int()`\
  \ 函数也很有帮助。例如，`input()` 函数始终返回字符串，即使用户输入的是数字。在交互式 shell 中输入 `spam = input()`，并在等待文本时输入\
  \ `101`。\n\n```python\n>>> spam = input()\n101\n>>> spam\n'101'\n```\n\n存储在 `spam`\
  \ 内部的值不是整数 `101`，而是字符串 `'101'`。如果你想使用 `spam` 中的值进行数学计算，使用 `int()` 函数获取 `spam` 的整数形式，然后将其作为新值存储在\
  \ `spam` 中。\n\n```python\n>>> spam = int(spam)\n>>> spam\n101\n```\n\n现在你应该能够将 `spam`\
  \ 变量视为整数而不是字符串了。\n\n```python\n>>> spam * 10 / 5\n202.0\n```\n\n注意，如果你传递给 `int()`\
  \ 的值无法被求值为整数，Python 将显示一条错误消息。\n\n```python\n>>> int('99.99')\nTraceback (most recent\
  \ call last):\n  File \"<pyshell#18>\", line 1, in <module>\n    int('99.99')\n\
  ValueError: invalid literal for int() with base 10: '99.99'\n>>> int('twelve')\n\
  Traceback (most recent call last):\n  File \"<pyshell#19>\", line 1, in <module>\n\
  \    int('twelve')\nValueError: invalid literal for int() with base 10: 'twelve'\n\
  ```\n\n如果你需要将浮点数向下取整，`int()` 函数也很有用。如果你想将浮点数向上取整，只需在之后对其加 `1` 即可。\n\n```python\n\
  >>> int(7.7)\n7\n>>> int(7.7) + 1\n8\n```\n\n在你的程序中，你在最后三行使用了 `int()` 和 `str()`\
  \ 函数来获取代码所需数据类型的值。\n\n```python\nprint('What is your age?') # 询问他们的年龄\nmyAge = input()\n\
  print('You will be ' + str(int(myAge) + 1) + ' in a year.')\n```\n\n`myAge` 变量包含了\
  \ `input()` 返回的值。因为 `input()` 函数始终返回字符串（即使用户输入的是数字），你可以使用 `int(myAge)` 代码返回 `myAge`\
  \ 中字符串的整数值。这个整数值随后在表达式 `int(myAge) + 1` 中与 `1` 相加。\n\n此相加的结果被传递给 `str()` 函数：`str(int(myAge)\
  \ + 1)`。返回的字符串值随后与字符串 `'You will be '` 和 `' in a year.'` 拼接，求值为一个大的字符串值。这个大字符串最终被传递给\
  \ `print()` 显示在屏幕上。\n\n假设用户为 `myAge` 输入了字符串 `'4'`。字符串 `'4'` 被转换为整数，所以你可以对其加 1。结果是\
  \ `5`。`str()` 函数将结果转换回字符串，因此你可以将其与第二个字符串 `'in a year.'` 拼接，创建最终的消息。这些求值步骤看起来就像图\
  \ 1-4。\n\n### 文字与数字的等价\n\n尽管 `42` 和 `'42'` 具有相同的值，但它们是不等的。\n\n```python\n>>> 42\
  \ == '42'\nFalse\n>>> 42 == 42.0\nTrue\n>>> 42.0 == '42'\nFalse\n```\n\n## 总结\n\n\
  你可以使用 `+`、`-`、`*`、`/`、`//`、`%` 和 `**` 进行数学运算，使用 `+` 和 `*` 进行字符串运算。本章介绍了整数、浮点数和字符串。还介绍函数。`print()`\
  \ 和 `input()` 处理简单的文本输出（到屏幕）和输入（来自键盘）。`len()` 函数接收一个字符串并求值为字符串中的字符数。\n\n## 练习题\n\
  \n1. 以下哪些是运算符，哪些是值？\n```\n*\n'hello'\n-88.8\n-\n/\n+\n5\n```\n\n2. 以下哪个是变量，哪个是字符串？\n\
  ```\nspam\n'spam'\n```\n\n3. 列举三种数据类型。\n\n4. 表达式由什么组成？所有的表达式都做什么？\n\n5. 本章引入了赋值语句，例如\
  \ `spam = 10`。表达式和语句有什么区别？\n\n6. 在运行以下代码后，变量 `bacon` 包含什么？\n```python\nbacon = 20\n\
  bacon + 1\n```\n\n7. 以下两个表达式的求值应该是什么？\n```python\n'spam' + 'spamspam'\n'spam' *\
  \ 3\n```\n\n8. 为什么 `eggs` 是合法的变量名而 `100` 不是？\n\n9. 使用哪三个函数可以获取值的整数、浮点数或字符串版本？\n\n\
  10. 为什么这个表达式会导致错误？你可以如何修复它？\n```python\n'I have eaten ' + 99 + ' burritos.'\n```\n\
  \n**额外加分：** 在网上搜索 `len()` 函数的 Python 文。它会在一个标题为“Built-in Functions”的网页上。浏览 Python\
  \ 拥有的其他函数列表，查找 `round()` 函数的作用，并在交互式 shell 中对其进行实验。\n\n\n\n\n现在你已经了解单条指令的基础知识，并且知道程序只是一系列指令。但编程的真正力量不仅在于像执行周末待办清单那样一个接一个地运行（或`executing`）指令。根据表达式的求值结果，程序可以跳过指令、重复指令或从几条指令中选择一条运行。事实上，你几乎不会希望程序从代码的第一行开始并简单地执行每一行直到末尾。`流程控制语句`可以决定在什么条件下执行哪些\
  \ Python 指令。\n\n这些流程控制语句直接对应流程图中的符号，因此我将为本章讨论的代码提供流程图版本。图 2-1 展示了下雨时的流程图。遵循箭头从 Start（开始）到\
  \ End（结束）的路径即可。\n\n![一个告诉你下雨时该做什么的流程图](img/httpatomoreillycomsourcenostarchimages2189567.png.jpg)\n\
  \n图 2-1. 一个告诉你下雨时该做什么的流程图。\n\n在流程图中，从开始到结束通常有多种方法。计算机程序中的代码行也是如此。流程图用菱形表示这些分支点，而其他步骤用矩形表示。开始和结束步骤用圆矩形表示。\n\
  \n但在你学习流程控制语句之前，你首先需要学习如何表示那些 `yes` 和 `no` 选项，并且你需要理解如何将那些分支点编写成 Python 代码。为此，让我们探索布尔值、比较运算符和布尔运算符。\n\
  \n# 布尔值\n\n虽然整数、浮点数和字符串数据类型具有无限可能的可能值，但 `Boolean` 数据类型只有两个值：`True` 和 `False`。（Boolean\
  \ 首字母大写是因为该数据类型是以数学家乔治·布尔命命的。））当作为 Python 代码输入时，布尔值 `True` 和 `False` 缺少你在字符串周围放置的引号，并且它们总是以大写的\
  \ `T` 或 `F` 开头，单词其余部分为小写。在交互式 shell 中输入以下内容。（其中某些指令是故意错误的，会导致错误信息的出现。）\n\n```\n\
  ➊ >>> spam = True\n   >>> spam\n   True\n➋ >>> true\n   Traceback (most recent call\
  \ last):\n     File \"<pyshell#2>\", line 1, in <module>\n       true\n   NameError:\
  \ name 'true' is not defined\n➌ >>> True = 2 + 2\n   SyntaxError: assignment to\
  \ keyword\n```\n\n与其他任何值一样，布尔值用于表达式并可以存储在变量中 ➊。如果你没有使用正确的大小写 ➋ 或者尝试将 `True` 和 `False`\
  \ 用于变量名 ➌，Python 将给你出一个错误。\n\n## 比较运算符\n\n`比较运算符` 比较两个值并求值为单个布尔值。表 2-1 列出了比较运算符。\n\
  \n表 2-1. 比较运算符\n\n| 运算符 | 含义 |\n| --- | --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n|\
  \ `<` | 小于 |\n| `>` | 大于 |\n| `<=` | 小于等于 |\n| `>=` | 大于等于 |\n\n这些运算符根据你提供的值求值为\
  \ `True` 或 `False`。现在让我们尝试一些运算符，从 `==` 和 `!=` 开始。\n\n```\n>>> 42 == 42\nTrue\n>>>\
  \ 42 == 99\nFalse\n>>> 2 != 3\nTrue\n>>> 2 != 2\nFalse\n```\n\n正如你预期的，当两侧的值相同时，`==`（等于）求值为\
  \ `True`；当两个值不同时，`!=`（不等于）求值为 `True`。`==` 和 `!=` 运算符实际上适用于任何数据类型的值。\n\n```\n >>>\
  \ 'hello' == 'hello'\n   True\n >>> 'hello' == 'Hello'\n   False\n >>> 'dog' !=\
  \ 'cat'\n   True\n >>> True == True\n   True\n >>> True != False\n   True\n >>>\
  \ 42 == 42.0\n   True\n >>> 42 == '42'\n   False\n```\n\n注意，整数或浮点值始终不等于字符串值。表达式\
  \ `42 == '42'` ➊ 求值为 `False`，因为 Python 认为整数 `42` 与字符串 `'42'` 是不同的。相反，`<`、`>` 和 `>=`\
  \ 运算符适用于整数和浮点值。\n\n```\n >>> 42 < 100\n   True\n >>> 42 > 100\n   False\n >>> 42\
  \ < 42\n   False\n >>> eggCount <= 42\n   True\n >>> myAge >= 10\n   True\n```\n\
  \n### == 和 = 的区别\n\n你可能注意到 `==`（等于）有两个等号，而 `=`（赋值）只有一个等号。这两个运算符很容易淆。只需记住这些点：\n\n\
  - `==`（等于）询问两个值是否相同。\n- `=`（赋值）将右侧的值放入左侧的变量。\n\n为了帮助记忆，注意 `==` 由两个字符组成，就像 `!=` 由两个字符组成一样。你会经常使用比较运算符来比较变量的值与另一个值，例如\
  \ `eggCount <= 42` ➊ 和 `myAge >= 10` ➋ 这样的例子。（毕竟，在代码中输入 `'dog' != 'cat'`，你本可以只输入\
  \ `True`。）当你之后学习流程控制语句时，会看到更多示例。\n\n## 布尔运算符\n\n三个布尔运算符（`and`、`or` 和 `not`）用于比较布尔值。与比较运算符一样，它们将这些表达式求布尔值。让我们详细探索这些运算符，从\
  \ `and` 运算符开始。\n\n## 二元布尔运算符\n\n`and` 和 `or` 运算符总是接受两个布尔值（或表达式），因此它们是*二元*运算符。当两个布尔值都是\
  \ `True` 时，`and` 运算符将表达式求值为 `True`；否则求值为 `False`。在交互式 shell 中输入一些 `and` 表达式来看看它的作用。\n\
  \n```\n>>> True and True\nTrue\n>>> True and False\nFalse\n```\n\n真表显示了布尔运算符的所有可能结果。表\
  \ 2-2 是 `and` 运算符的真表。\n\n表 2-2. and 运算符的真表\n\n| 表达式 | 求值为... |\n| --- | --- |\n\
  | `True and True` | `True` |\n| `True and False` | `False` |\n| `False and True`\
  \ | `False` |\n| `False and False` | `False` |\n\n相反，当两个布尔值中有一个为 `True` 时，`or` 运算符将表达式求值为\
  \ `True`。如果两个都是 `False`，它求值为 `False`。\n\n```\n>>> False or True\nTrue\n>>> False\
  \ or False\nFalse\n```\n\n你可以在它的真表中看到 `or` 运算符的所有可能结果，真表所示于 表 2-3。\n\n表 2-3. or\
  \ 运算符的真表\n\n| 表达式 | 求值为... |\n| --- | --- |\n| `True or True` | `True` |\n| `True\
  \ or False` | `True` |\n| `False or True` | `True` |\n| `False or False` | `False`\
  \ |\n\n## not 运算符\n\n与 `and` 和 `or` 不同，`not` 运算符仅作用于一个布尔值（或表达式）。`not` 运算符简单地求值为相反的布尔值。\n\
  \n```\n >>> not True\n   False\n➊ >>> not not not True\n   True\n```\n\n就像在说话和写作中使用双重否定一样，你可以嵌套\
  \ `not` 运算符 ➊，尽管在实际程序中永远没有理由这么这样做。表 2-4 显示了 `not` 的真表。\n\n表 2-4. not 运算符的真表\n\n\
  | 表达式 | 求值为... |\n| --- | --- |\n| `not True` | `False` |\n| `not False` | `True`\
  \ |\n\n\n\n\n\n## 混合布尔运算符与比较运算符\n\n由于比较运算符的结果为布尔值，因此你可以在包含布尔运算符的表达式中使用它们。\n\n回想起\
  \ `and`、`or` 和 `not` 运算符被称为布尔运算符，因为它们始终对布尔值 `True` 和 `False` 进行操作。虽然像 `4 < 5` 这样的表达式不是布尔值，但它们是能够求值为布尔值的表达式。尝试在交互式外壳中输入一些使用比较运算符的布尔表达式。\n\
  \n```\n>>> (4 < 5) and (5 < 6)\nTrue\n>>> (4 < 5) and (9 < 6)\nFalse\n>>> (1 ==\
  \ 2) or (2 == 2)\nTrue\n```\n\n计算机先评估左侧表达式，然后评估右侧表达式。当它知道每个表达式的布尔值后，它会将整个表达式求值为一个布布尔值。你可以将计算机对\
  \ `(4 < 5) and (5 < 6)` 的评估过程视为图 2-2 and (5 < 6) 得到 True 的过程.\") 所示。\n\n你还可以在表达式中使用多个布尔运算符以及比较运算符。\n\
  \n```\n>>> 2 + 2 == 4 and not 2 + 2 == 5 and 2 * 2 == 2 + 2\nTrue\n```\n\n布尔运算符像数学运算符一样有优先级。在任何数学和比较运算符评估之后，Python\
  \ 会先评估 `not` 运算符，然后是 `and` 运算符，最后是 `or` 运算符。\n\n![评估 (4 < 5) and (5 < 6) 得到 True\
  \ 的过程](img/httpatomoreillycomsourcenostarchimages2189569.png.jpg)\n\n图 2-2.评估 `(4\
  \ < 5)` 和 `(5 < 6)` 为 `True` 的过程。\n\n# 流程控制元素\n\n流程控制语句通常以称为 `condition`（条件）的部分开始，后面都跟着一个称为\
  \ `clause`（子句）的代码块。在学习 Python 特有的流程控制语句之前，我将介绍什么是条件和代码块。\n\n## 条件\n\n你到为止看到的布尔表达式都可以被视为条件，它们与表达式是相同的东西；在流程控制语句的语境下，`condition`\
  \ 只是一个更具体的名称。条件始终求值为布尔值，`True` 或 `False`。流程控制语句根据其条件是 `True` 还是 `False` 来决定做什么，几乎每个流程控制语句都会使用条件。\n\
  \n## 代码块\n\nPython 代码行可以组合在 `blocks`（块）中。你可以通过代码行的缩进来判断块的开始和结束。块有三条规则：\n\n1. 当缩进增加时，块开始。\n\
  2. 块可以包含其他块。\n3. 当缩进减少到零或减少到包含块的缩进时，块结束。\n\n通过查看一些缩进的代码更容易理解块，所以让我们在这个小型游戏程序的一部分中寻找块，所示：\n\
  \n```\n if name == 'Mary':\n➊     print('Hello Mary')\n   if password == 'swordfish':\n\
  ➋     print('Access granted.')\n   else:\n➌     print('Wrong password.')\n```\n\n\
  第一个代码块 ➊ 从行 `print('Hello Mary')` 开始，并包含其之后的所有行。在这个块内部是另一个块 ➋，它只有一行内容：`print('Access\
  \ Granted.')`。第三个块 ➌ 也是一行长：`print('Wrong password.')`。\n\n# 程序执行\n\n在上一章的 `hello.py`\
  \ 程序中，Python 从程序顶部开始向下逐条执行指令，一个接一个。`program execution`（程序执行，或简称为 `execution`）是当前正在执行的指令的术语。如果你将源代码打印在纸上，并在执行每行时将手指放在其上，你可以将你的手指视为程序执行。\n\
  \n然而，并不是所有程序都是简单地向下执行的。如果你用手指追踪带有流程控制语句的程序，你可能会发现自己根据条件在源代码中来回跳跃，并且可能会跳过整个子句。\n\n\
  ## 流程控制语句\n\n现在，让我们探索流程控制中最最重要的部分：语句本身。语句代表了你在图 2-1 中流程图中看到的菱形，它们是你的程序将做出的实际决策。\n\
  \n## if 语句\n\n最常见的流程控制语句是 `if` 语句。如果 `if` 语句的 `clause`（即 `if` 语句后面的代码块）条件为 `True`，则执行该子句。如果条件为\
  \ `False`，则跳过该子句。\n\n用通白的话说，`if` 语句可以读作：“如果这个条件为真，执行子句中的代码。”在 Python 中，`if` 语句由以下部分组成：\n\
  \n* `if` 关键字\n* 条件（即求值为 `True` 或 `False` 的表达式）\n* 冒号\n* 从下一行开始的缩进代码块（称为 `if`）\n\n\
  例如，假设你有一些代码来检查某人是否是 Alice。假设 `name` 被赋值了某个值。\n\n```\nif name == 'Alice':\n    print('Hello')\n\
  ```\n\n所有流程控制语句都以冒号结束，并跟着一个新块（`if`）。图 2-3 显示了流程图的样子。\n\n图 2-3. if 的流程图。\n\n## else\
  \ 语句\n\n`if` 子句可以跟随跟随 `else` 语句。只有当 `if` 语句条件为 `False` 时，才会执行 `else` 子句。用通白的话说，`else`\
  \ 语句没有条件，在代码中 `else` 语句由以下部分组成：\n\n* `else` 关键字\n* 冒号\n* 从下一行开始的缩进代码块（称为 `else`）\n\
  \n回到 Alice 的示例，让我们看看使用 `else` 语句在名字不是时提供不同问候的代码。\n\n```\nif name == 'Alice':\n \
  \   print('Hi, Alice.')\nelse:\n    print('Hello, stranger.')\n```\n\n图 2-4 显示了流程图的样子。\n\
  \n图 2-4. else 的流程图。\n\n## elif 语句\n\n虽然 `if` 或 `else` 子句中只有一个会执行，但你可能遇到一种希望执行*多个*可能子句之一的情况。`elif`\
  \ 语句是“else if”语句，始终跟随 `if` 或另一个 `elif` 语句。它提供了另一个条件，只有当之前的任何条件都不满足时才会检查该条件。在代码中\
  \ `elif` 语句由以下部分组成：\n\n* `elif` 关键字\n* 条件（即求值为 `True` 或 `False` 的表达式）\n* 冒号\n* 从下一行开始的缩进代码块（称为\
  \ `elif` 子句）\n\n让我们在名字检查中添加一个 `elif` 来观察此语句的作用。\n\n```\nif name == 'Alice':\n  \
  \  print('Hi, Alice.')\nelif age < 12:\n    print('You are not Alice, kiddo.')\n\
  ```\n\n这次，你检查人的年龄，如果他们小于 12 岁，程序将告诉他们不同的内容。你可以在图 2-5 中看到此的流程图。\n\n![elif statement\
  \ 的流程图](img/httpatomoreillycomsourcenostarchimages2189575.png)\n\n\n\n\n当 `age <\
  \ 12` 为 `True` 且 `name == 'Alice'` 为 `False` 时，执行 `elif` 子句。然而，如果两个条件都为 `False`，则两个子句都会被跳过。程序**并不保证**至少有一个子句会被执行。当存在\
  \ `elif` 语句链时，只有一个子句或一个一个子句会被执行。一旦发现某一个语句的条件为 `True`，其余的 `elif` 子句就会自动被跳过。例如，打开一个新的文件编辑器窗口并输入以下代码，将其保存为\
  \ `vampire.py`：\n\n```\nif name == 'Alice':\n    print('Hi, Alice.')\nelif age <\
  \ 12:\n    print('You are not Alice, kiddo.')\nelif age > 2000:\n    print('Unlike\
  \ you, Alice is not an undead, immortal vampire.')\nelif age > 100:\n    print('You\
  \ are not Alice, grannie.')\n```\n\n在这里，我添加了两个 `elif` 语句，使名称检查器能够根据 `age` 对人给出不同的问候回答。图\
  \ 2-6 显示了此处的流程图。\n\n![vampire.py 程序中多个 elif 语句的流程图](img/httpatomoreillycomsourcenostarchimages2189577.png)\n\
  \n图 2-6. vampire2.py 程序中多个 `elif` 语句的流程图。\n\n然而，`elif` 语句的顺序确实很重要。让我们重新排列它们的顺序以引入一个\
  \ bug。记住，一旦发现了 `True` 条件，其余的 `elif` 子句就会自动被跳过，因此如果你交换了 `vampire.py` 中的某些子句，你就会遇到问题。将代码修改如下所示，并将其保存为\
  \ `vampire2.py`：\n\n```\n if name == 'Alice':\n       print('Hi, Alice.')\n   elif\
  \ age < 12:\n       print('You are not Alice, kiddo.')\n➊ elif age > 100:\n    \
  \   print('You are not Alice, grannie.')\n   elif age > 2000:\n       print('Unlike\
  \ you, Alice is not an undead, immortal vampire.')\n```\n\n假设在执行此代码之前，变量 `age` 值为\
  \ `3000`。你可能期望代码会打印字符串 `'Unlike you, Alice is not an undead, immortal vampire.'`。然而，因为\
  \ `age > 100` 条件为 `True`（毕竟 3000 *确实*大于 100）➊，打印了字符串 `'You are not Alice, grannie.'`，其余的\
  \ `elif` 语句自动被跳过。记住，最多只有一个子句会被执行，而且对于 `elif` 语句，顺序非常重要！\n\n图 2-7 显示了上述代码的流程图。注意\
  \ `age > 100` 和 `age > 2000` 的菱框是如何交换位置的。\n\n可选，你可以在最后一个 `elif` 语句之后添加一个 `else`\
  \ 语句。在这种情况下，**保证**至少有一个（且只有一个）子句会被执行。如果每个 `if` 和 `elif` 语句中的条件都为 `False`，则执行 `else`\
  \ 子句。例如，让我们重新创建 Alice 程序以使用 `if`、`elif` 和 `else` 子句。\n\n```\nif name == 'Alice':\n\
  \    print('Hi, Alice.')\nelif age < 12:\n    print('You are not Alice, kiddo.')\n\
  else:\n    print('You are neither Alice nor a little kid.')\n```\n\n图 2-8 显示了这段新代码的流程图，我们将它保存为\
  \ `littleKid.py`。\n\n用通俗语言来说，这种流程控制结构就是：“如果第一个条件为真，执行这个。否则，如果第二个条件为真，执行那个。否则，执行其他操作。”当你一起使用这三个三个语句时，记住这些关于排序的规则，以避免出现像图\
  \ 2-7 中的 bug。首先，始终有一个 `if` 语句。任何需要的 `elif` 语句都应该跟在 `if` 语句后面。其次，如果你想确保至少执行一个子句，请用\
  \ `else` 语句结束结构。\n\n![vampire2.py 程序的流程图。划掉的路径在逻辑上永远不会发生，因为如果 age 大于 2000，它已经大于\
  \ 100 了。](img/httpatomoreillycomsourcenostarchimages2189579.png)\n\n图 2-7. `vampire.py\
  \ 程序` 的流程图。划掉的路径在逻辑上永远不会发生，因为如果 `age` 大于 `2000`，它已经大于 `100`。\n\n![之前的 littleKid.py\
  \ 程序的流程图](img/httpatomoreillycomsourcenostarchimages2189581.png)\n\n图 2-8. 之前的 `littleKid.py\
  \ 程序` 的流程图\n\n## while 循环语句\n\n你可以使用 `while` 语句使一段代码反复执行。只要 `while` 语句的条件为 `True`，`while`\
  \ 子句中的代码就会执行。在代码中，`while` 语句始终包含以下内容：\n\n*   `while` 关键字\n*   一个条件（即一个评估为 `True`\
  \ 或 `False` 的表达式）\n*   冒号 `:`\n*   从下一行开始，缩进的代码块（称为 `while` 子句）\n\n你可以看到 `while`\
  \ 语句看起来与 `if` 语句相似。区别在于它们的行为。在 `if` 子句结束后，程序继续执行。但在 `while` 子句结束后，程序跳转回 `while`\
  \ 语句的开头。`while` 子句通常被称为 `while 循环`（loop）。\n\n让我们看看使用相同条件并执行相同操作的 `if` 语句和 `while`\
  \ 循环。这里是 `if` 语句的代码：\n\n```\nspam = 0\nif spam < 5:\n    print('Hello, world.')\n\
  \    spam += 1\n```\n\n这里是 `while` 语句的代码：\n\n```\nspam = 0\nwhile spam < 5:\n  \
  \  print('Hello, world.')\n    spam += 1\n```\n\n这些语句非常相似——`if` 和 `while` 检查 `spam`\
  \ 的值，如果它小于五，就会打印消息。但当你运行这两个代码段时，每个的情况都不同。对于 `if` 语句，输出只是 `\"Hello, world.\"`。但对于\
  \ `while` 语句，它是重复五次的 `\"Hello, world.\"`！查看这两个代码的流程图，图 2-9 和 图 2-10，以了解为什么会这样。\n\
  \n![if 语句的流程图](img/httpatomoreillycomsourcenostarchimages2189583.png)\n\n图 2-9.\
  \ `if 语句`的流程图\n\n![while 语句的流程图](img/httpatomoreillycomsourcenostarchimages2189585.png)\n\
  \n图 2-10. `while 语句`的流程图\n\n`if` 语句的代码检查条件，如果条件为真，只打印一次 `Hello, world.`。另一方面，`while`\
  \ 循环的代码会打印五次。它之所以停止是因为在每次循环迭代结束时，`spam` 中的整数增加 1，这意味着在 `spam < 5` 为 `False` 之前，循环会执行五次。\n\
  \n在 `while` 循环中，条件在每次*迭代*开始时（即每次执行循环时）都会检查。如果条件为 `True`，则执行子句，之后会再次检查条件。第一次发现条件为\
  \ `False` 时，`while` 子句被跳过。\n\n### 一个令人讨厌的 while 循环\n\n\n\n\n这是一个小型示例程序，它会不断要求你输入（字面上的）`your\
  \ name`。选择`File（文件）▸`New Window（新窗口）打开一个新的文件编辑器窗口，输入以下代码，并将文件保存为 `yourName.py`：\n\
  \n```\n➊ name = ''\n➋ while name != 'your name':\n       print('Please type your\
  \ name.')\n➌     name = input()\n➍ print('Thank you!')\n```\n\n首先，程序将 `name` 变量\
  \ ➊ 设置为空空字符串。这样做是为了让 `name != 'your name'` 条件的结果为 `True`，从而使程序执行进入 `while` 循环语句句\
  \ ➋。\n\n该语句句内部的代码要求用户输入其名称，并将其赋值给变量 `name` ➌。由于这是代码块的最后一行，执行流将回到 `while` 循环的开头并重新评估条件。如果\
  \ `name` 中的值不等于字符串 `'your name'`，则条件为 `True`，执行将再次进入 `while` 语句句。\n\n一旦用户输入了 `your\
  \ name`，`while` 循环的条件将变为 `'your name' != 'your name'`，其结果为 `False`。现在条件为 `False`，程序执行不再重新进入\
  \ `while` 循环语句句，而是跳过它并继续运行程序的其余部分 ➍。图 2-11 显示了 `yourName.py` 程序的流程图。\n\n![yourName.py\
  \ 程序的流程图](img/httpatomoreillycomsourcenostarchimages2189587.png)\n\n图 2-11. `yourName.py`\
  \ 程序的流程图。\n\n现在，让我们来看看 `yourName.py` 的运行效果。按 `F5` 运行，并在并在程序想要的内容之前，输入几次 `your name`\
  \ 以外的内容。\n\n```\nPlease type your name.\nAl\nPlease type your name.\nAlbert\nPlease\
  \ type your name.\n%#@#%*(^&!!!\nPlease type your name.\nyour name\nThank you!\n\
  ```\n\n如果你从未输入过 `your name`，那么 `while` 循环的条件永远不会为 `False`，程序将一直问下去。在这里，`input()`\
  \ 调用允许用户输入正确的字符串以便程序继续运行。在其他程序中，条件可能永远不会改变，这可能会导致问题。让我们看看如何跳出 `while` 循环。\n\n##\
  \ break 语句 (break Statements)\n\n有一种快捷方法可以让程序执行提前跳出 `while` 循环语句句。如果执行到了 `break`\
  \ 语句，它会立即退出 `while` 循环句。在代码中，`break` 语句仅包含 `break` 关键字。\n\n非常简单，对吧？这里有一个程序与上一个程序的功能相同，但它使用\
  \ `break` 语句来退出循环。输入以下代码，并将文件保存为 `yourName2.py`：\n\n```\n➊ while True:\n       print('Please\
  \ type your name.')\n➋     name = input()\n➌     if name == 'your name':\n➍    \
  \     break\n➎ print('Thank you!')\n```\n\n第一行 ➊ 创建了一个无限循环；它是一个条件始终为 `True` 的 `while`\
  \ 循环。（毕竟，`True` 表达式始终求值为 `True`。）程序执行将始终进入循环，只有在执行 `break` 语句时才会退出。（永不退出的无限循环是一种常见的编程错误。）\n\
  \n和之前一样，这个程序要求用户输入 `your name` ➋。现在，当执行仍在 `while` 循环内部时，会执行一个 `if` 语句 ➌ 来检查 `name`\
  \ 是否等于 `your name`。如果此条件为 `True`，则运行 `break` 语句 ➍，执行将移出循环并执行 `print('Thank you!')`\
  \ ➎。否则，带有 `break` 语句的 `if` 语句句将被跳过，这使得执行到达 `while` 循环的末尾。此时，程序执行跳回 `while` 语句的开头\
  \ ➊ 重新检查条件。由于此条件仅仅是 `True` 布尔值，执行将进入循环，再次要求用户输入 `your name`。该程序的流程图请图 2-12。\n\n\
  运行 `yourName2.py`，并输入你在 `yourName.py` 中输入的相同文本。重写的程序响应将与原始程序相同。\n\n![带有无限循环的 yourName2.py\
  \ 程序的流程图。注意 X 路径在逻辑上永远不会发生，因为循环条件始终为 True。](img/httpatomoreillycomsourcenostarchimages2189589.png.jpg)\n\
  \n图 2-12. 带有无限循环的 `yourName2.py` 程序的流程图。注意 X 路径在逻辑上永远不会发生，因为循环条件始终为 `True`。\n\n\
  ## continue 语句 (continue Statements)\n\n与 `break` 语句一样，`continue` 语句用于循环内部。当执行遇到\
  \ `continue` 语句时，程序回到循环开头并重新评估条件。（当执行到达 `while` 循环结束时发生的情况如此。）\n\n### 陷在无限循环中？\n\
  \n如果你运行了一个卡在无限循环中的程序，请按 `CTRL-C`。要尝试一下，在 `initeloop.py` 中创建一个简单的无限循环。\n\n```\nwhile\
  \ True:\n    print('Hello world!')\n```\n\n当运行运行此程序时，它将永远打印 `Hello world!`。在 IDLE\
  \ 的交互式 shell 中，只有两种方法停止此程序：`CTRL-C` 或从菜单选择 `Shell（外）▸ restart Shell（重启 Shell）`。如果你想立即终止程序，`CTRL-C`\
  \ 非常方便。\n\n让我们使用 `continue` 写一个请求名称和密码的程序。\n\n```\n while True:\n      print('Who\
  \ are you?')\n      name = input()\n➊    if name != 'Joe':\n➋        continue\n\
  \      print('Hello, Joe. What is the password? (It is a fish.)')\n➌    password\
  \ = input()\n      if password == 'fishfish':\n➍        break\n➎ print('Access granted.')\n\
  ```\n\n如果用户输入 `Joe` 以外的任何名称 ➊，`continue` 语句会导致执行回到循环开头。重新评估条件时，执行将进入循环。一旦通过该 `if`\
  \ 语句，就会要求输入密码 ➌。如果输入的密码是 `fishfish`，则运行 `break` 语句 ➍，执行跳出 `while` 循环并打印 `Access\
  \ granted.`。否则，执行继续到 `while` 循环末尾，然后回到循环开头。该程序的流程图见图 2-13。\n\n## 真值值与假值值 (Truthy\
  \ and Falsey Values)\n\n在其他数据类型中，某些值会被条件认为等同于 `True` 和 `False`。在条件中使用，`0`、`0.0`\
  \ 和 `''`（空字符串）被视为 `False`，而所有其他值都被视为 `True`。例如，查看以下程序：\n\n\n\n\n\n```\nname = ''\n\
  while not name:➊\n    print('Enter your name:')\n    name = input()\nprint('How\
  \ many guests will you have?')\nnumOfGuests = int(input())\nif numOfGuests:➋\n \
  \   print('Be sure to have enough room for all your guests.')➌\nprint('Done')\n\
  ```\n\n如果用户为 `name` 输入了一个空字符串，那么 `while` 语句的条件将为 `True` ➊，程序将继续询问姓名。如果 `numOfGuests`\
  \ 的值不是 `0` ➋，则该条件被被视为 `True`，程序将为用户打印一条提醒 ➌。\n\n你可以用 `not name != ''` 代替 `not name`，用\
  \ `numOfGuests != 0` 代替 `numOfGuests`，但使用真值（truthy）和假值（falsey）值可以让你的代码更易读。\n\n运行这个程序并输入一些内容。在你声称自己是\
  \ Joe 之前，它不应该询问密码，一旦你输入正确的密码，它应该退出。\n\n```\nWho are you?\nI'm fine, thanks. Who\
  \ are you?\nWho are you?\nJoe\nHello, Joe. What is the password? (It is a fish.)\n\
  Mary\nWho are you?\nJoe\nHello, Joe. What is the password? (It is a fish.)\nswordfish\n\
  Access granted.\n```\n\n## `for` 循环与 `range()` 函数\n\n`while` 循环在条件为 `True` 时会持续循环（这就是它的名字来源），但如果你只想执行固定次数的代码块怎么办？你可以通过\
  \ `for` 语句和 `range()` 函数来实现这一点。\n\n在代码中，`for` 语句看起来像 `for i in range(5):` 并包含：\n\
  \n*   `for` 关键字\n*   一个变量名\n*   `in` 关键字\n*   `range()` 方法调用，并传入整数\n*   一个冒号\n*\
  \   紧接着缩进的代码块（被称为 `for` 子句）\n\n让我们创建一个名为 `fiveTimes.py` 的新程序，帮助你观察 `for` 循环运行。\n\
  \n```python\nprint('My name is')\nfor i in range(5):\n    print('Jimmy Five Times\
  \ (' + str(i) + ')')\n```\n\n`for` 循环子句中的代码运行了五次。第一次运行时，变量 `i` 被设置为 `0`。子句中的 `print()`\
  \ 调用会打印 `Jimmy Five Times (0)`。在 `for` 循环执行完所有代码后，执行将回到循环顶部，`for` 语句将 `i` 加 1。这就是为什么\
  \ `range(5)` 会导致五次循环，变量 `i` 分别设置为 `0`、`1`、`2`、`3` 和 `4`，但不包含传入 `range()` 的那个整数。图\
  \ 24：fiveTimes.py 的流程图 显示了 `fiveTimes.py` 程序的流程图。\n\n![fiveTimes.py 的流程图](img/atomoreillycomsourostarch218593.png)\n\
  \n图 24：fiveTimes.py 的流程图\n\n当你运行这个程序时，它在离开 `for` 循环之前应该打印五次 `Jimmy Five Times` 以及\
  \ `i` 的值。\n\n```\nMy name is\nJimmy Five Times (0)\nJimmy Five Times (1)\nJimmy\
  \ Five Times (2)\nJimmy Five Times (3)\n```\n\n## 注意\n\n你也可以在 `for` 循环中使用 `break`\
  \ 和 `continue` 语句。`continue` 语句会让 `for` 循环计数到下一个值，就像程序执行到了结尾并返回开头一样。实际上，你只能在 `while`\
  \ 和 `for` 循环内部使用 `continue` 和 `break` 语句。如果你在其他地方使用，Python 会报错。\n\n另一个 `for` 循环的例子，考虑关于数学家卡尔·弗里德希·高斯（Karl\
  \ Friedrich Gauss）的故事。当高斯还是个孩子时，老师让他们把 0 到 100 的所有数字相加。高斯几秒钟就想出了答案，但你可以写一个使用 `for`\
  \ 循环的 Python 程序来完成这个计算。\n\n```python\ntotal = 0\nfor num in range(101):\n    total\
  \ = total + num\nprint(total)\n```\n\n结果应该是 5050。当程序开始运行时，`total` 变量设置为 `0` ➊。然后\
  \ `for` 循环执行 ➋ 100 次 `total = total + num` ➌。当循环完成所有 100 次迭代后，从 0 到 100 的每个整数都已加到\
  \ `total` 中。此时，屏幕打印 `total` ➍。即使在最慢的电脑上，这个程序的运行时间不到一秒。（高斯发现有 50 对数字相加等于 100：1+99，2+98，以此类推，直到\
  \ 49+51。由于 50 × 100 是 5000，加上中间的 50，0 到 100 的数字和为 5050。聪明的孩子！）\n\n### 等效的 `while`\
  \ 循环\n\n实际上可以使用 `while` 循环完成与 `for` 循环相同的工作；`for` 循环只是更简洁。让我们重写 `fiveTimes.py`，使用相当于\
  \ `for` 循环的 `while` 循环。\n\n```python\nprint('My name is')\ni = 0\nwhile i < 5:\n\
  \    print('Jimmy Five Times (' + str(i) + ')')\n    i = i + 1\n```\n\n如果你运行这个程序，输出应该与使用\
  \ `for` 循环的 `fiveTimes.py` 程序相同。\n\n### `range()` 的起始、停止和步长参数\n\n某些函数可以使用逗号分隔的多个参数调用，`range()`\
  \ 就是其中。这允许你更改传入 `range()` 的整数以遵循任何整数序列，包括从非零开始。\n\n```python\nfor i in range(12,\
  \ 16):\n    print(i)\n```\n\n第一个参数是 `for` 循环变量开始的地方，第二个参数是停止的位置，但不包含该数字。\n\n```\n\
  12\n13\n14\n15\n```\n\n`range()` 函数也可以用三个参数调用。前两个参数是起始和停止值，第三个是“步长参数”（step argument）。步长是变量每次迭代后增加的量。\n\
  \n```python\nfor i in range(0, 10, 2):\n    print(i)\n```\n\n因此，调用 `range(0, 10,\
  \ 2)` 将以二为间隔从零数到八。\n\n```\n0\n2\n4\n6\n8\n```\n\n`range()` 函数在为 `for` 循环产生数字序列时是非常灵活的。例如（我不对我的双关语道歉），你甚至可以使用负数作为步长，让\
  \ `for` 循环递减而不是递增。\n\n```python\nfor i in range(5, -1, -1):\n    print(i)\n```\n\
  \n运行 `for` 循环使用 `range(5, -1)` 输出 `i` 应该从五打印到零。\n\n```\n5\n4\n3\n2\n1\n0\n```\n\n\
  ## 导入模块\n\n所有的 Python 程序都可以调用一组基本的内置函数（built-in functions），包括你见过的 `print()`、`input()`\
  \ 和 `len()` 函数。Python 还带有一组被称为标准库的模块。每个模块都是一个包含一组相关函数的 Python 程序。例如，`math` 模块有数学相关的函数，`random`\
  \ 模块有随机数相关的函数，以此类推。\n\n在使用模块中的函数之前，你必须使用 `import` 语句导入模块。在代码中，`import` 语句由：\n\n\
  *   `import` 关键字\n*   模块名称\n*   可选的更多模块名称，只要用逗号隔开即可\n\n一旦导入了模块，你就可以使用该模块的所有函数。让我们用\
  \ `random` 模块尝试一下，这将让我们可以使用 `random.randint()` 函数。\n\n```python\nimport random\n\
  for i in range(5):\n    print(random.randint(1, 10))\n```\n\n当你运行这个程序时，输出看起来可能像这样：\n\
  \n```\n4\n1\n8\n4\n1\n```\n\n\n\n\n\n这是一个导入了四个不同模块的 `import` 语句示例：\n\n```\nimport\
  \ random, sys, os, math\n```\n\n现在我们可以使用这四个模块中的任何函数。我们将在书的后续部分学习更多关于它们的知识。\n\n##\
  \ 来自 import 语句\n\n`import` 语句的另一种形式由 `from` 关键字、模块名、`import` 关键字以及一个星号 `*` 组成；例如，`from\
  \ random import *`。\n\n使用这种形式的 `import` 语句，调用 `random` 中的函数时将不需要 `random.` 前缀。然而，使用全名会让代码更具可读性，因此最好使用常规的\
  \ `import` 语句。\n\n## 使用 sys.exit() 提前结束程序\n\n最后一个介绍的流程控制概念是如何终止程序。如果程序执行到指令的末尾，总是会发生这种情况。但是，你可以通过调用\
  \ `sys.exit()` 函数使程序终止或退出。由于该函数位于 `sys` 模块中，你必须在程序使用它之前导入 `sys`。\n\n打开一个新的文件编辑器窗口，输入以下代码，并将其保存为\
  \ `exitExample.py`：\n\n```\nimport sys\n\nwhile True:\n    print('Type exit to exit.')\n\
  \    response = input()\n    if response == 'exit':\n        sys.exit()\n    print('You\
  \ typed ' + response + '.')\n```\n\n在 IDLE 中运行此程序。该程序包含一个内部没有 `break` 语句的无限循环。该程序唯一的结束方法是用户输入\
  \ `exit`导致调用 `sys.exit()`。当 `response` 等于 `exit` 时，程序结束。由于 `response` 变量是由 `input()`\
  \ 函数设置的，用户必须输入 `exit` 来停止程序。\n\n## 总结\n\n通过使用评估为 `True` 或 `False` 的表达式（称为条件），你可以编写程序来决定执行哪些代码以及跳过哪些代码。你还可以在特定条件评估为\
  \ `True` 的时候在循环中反复执行代码。如果你需要退出循环或跳回开头，`break` 和 `continue` 语句非常有用。\n\n这些流程控制语句将允许你编写出智能得多的程序。还有另一种类型的流程控制可以通过编写你自己的函数来实现，那是下一章的主题。\n\
  \n## 练习题\n\n| Q: | 1\\. 布尔数据类型的两个值是什么？你如何编写它们？ |\n| Q: | 2\\. 三个布尔运算符是什么？ |\n| Q:\
  \ | 3\\. 写出每个布尔运算符的真值表（即该运算符的布尔值的所有可能组合以及它们的评估结果）。 |\n| Q: | 4\\. 以下表达式的评估结果是什么？\
  \ | \n\n```\n(5 > 4) and (3 == 5)\nnot (5 > 4)\n(5 > 4) or (3 == 5)\nnot ((5 > 4)\
  \ or (3 == 5))\n(True and True) and (True == False)\n(not False) or (not True)\n\
  ```\n\n| Q: | 5\\. 六个比较运算符是什么？ |\n| Q: | 6\\. 等于运算符与赋值运算符之间有什么区别？ |\n| Q: | 7\\\
  . 解释什么是条件以及你在什么情况下会使用它。 |\n| Q: | 8\\. 识别这段代码中的三个块： | \n\n```\nspam = 0\nif spam\
  \ == 10:\n    print('eggs')\n    if spam > 5:\n        print('bacon')\n    else:\n\
  \        print('ham')\n    print('spam')\nprint('spam')\n```\n\n| Q: | 9\\. 编写代码：如果\
  \ `spam` 中存储的是 `1`，打印 `Hello`；如果 `spam` 中存储的是 `2`，打印 `Howdy`；如果 `spam` 中存储的是其他任何内容，打印\
  \ `Greetings!`。 |\n| Q: | 10\\. 如果你的程序陷入了无限循环，你可以按什么键？ |\n| Q: | 11\\. `break` 和\
  \ `continue` 之间有什么区别？ |\n| Q: | 12\\. 在 `for` 循环中，`range(10)`、`range(0, 10)` 和 `range(0,\
  \ 10, 1)` 之间有什么区别？ |\n| Q: | 13\\. 写一个短程序，使用 `for` 循环打印数字 `1` 到 `10`。然后编写一个等程序，使用\
  \ `while` 循环打印数字 `1` 到 `10`。 |\n| Q: | 14\\. 如果你在名为 `spam` 的模块内部有一个名为 `bacon()`\
  \ 的函数，在导入 `spam` 后你会如何调用它？**额外加分：** 在网上查找 `round()` 和 `abs()` 函数，并找出它们的作用。在交互式外壳中对它们进行实验。\
  \ |\n\n# 第 3 章 函数\n\n你已经熟悉了之前几个章节中的 `print()`、`input()` 和 `len()` 函数。Python 提供了许多类似的内置函数，但你也可以编写自己的函数。函数就像程序中的一个微型程序。\n\
  \n为了更好地理解函数如何工作，让我们来创建一个。在文件编辑器中输入此程序并将其保存为 `helloFunc.py`：\n\n```\n➊ def hello():\n\
  ➋     print('Howdy!')\n       print('Howdy!')\n       print('Hello there.')\n  \
  \     hello()\n```\n\n`def` 语句 ➊ 定义了一个函数。`def` 语句 ➋ 后的代码是函数的体。当第一次调用 `hello()` 函数时，传入的参数是\
  \ `None`。程序执行进入函数并开始执行那里的代码。\n\n`hello()` 行 ➌ 是函数调用。在代码中，函数调用只是名称后跟括号，中间可能带有一些参数。当程序到达这些调用处时，它会跳转到函数的顶部。当它到达函数结束时，它会返回到调用函数的代码处。\n\
  \n由于此程序调用了三次 `hello()`，输出如下：\n\n```\nHowdy!\nHowdy!\nHowdy!\n```\n\n函数的一个主要目的是将多次使用的代码分组。如果没有函数，你每次都必须复制粘贴这些代码，程序看起来像这样：\n\
  \n```\nprint('Howdy!')\nprint('Howdy!')\nprint('Howdy!')\n```\n\n通常情况下，你总是想要避免重复代码，因为如果你决定更新代码——例如，你发现了一个需要修复的\
  \ bug——你必须修改所有复制过该代码的地方。\n\n随着编程经验的增加，你经常会发现自己在进行代码去重，这意味着消除重复或复制粘贴的代码。去重让你的程序更短、更易读且更易于更新。\n\
  \n## 带有参数的 def 语句\n\n当你调用 `print()` 或 `len()` 函数时，你通过在括号之间输入值（这些值在上下文中称为参数）。你也可以定义接受参数的自定义函数。在文件编辑器中输入此示例并将其保存为\
  \ `helloFunc2.py`：\n\n```\n➊ def hello(name):\n➋     print('Hello ' + name)\n\n\
  ➌ hello('Alice')\n  hello('Bob')\n```\n\n运行此程序时，输出如下：\n\n```\nHello Alice\nHello\
  \ Bob\n```\n\n该程序中 `hello()` 函数的定义有一个名为 `name` 的参数 ➊。参数是在函数被调用时存储参数的变量。第一次调用 `hello()`\
  \ 函数时，传入的参数是 `'Alice'` ➌。程序执行进入函数，变量 `name` 被自动设置为 `'Alice'`，这正是 `print()` 语句 ➋\
  \ 打印的内容。\n\n关于参数有一个需要注意的特殊点是：当函数返回时，存储在参数中的值就会被忘记。例如，如果在上一个程序的 `hello('Bob')` 之后添加\
  \ `print(name)`，程序将给你一个 `NameError`，因为没有名为 `name` 的变量。该变量在函数调用 `hello('Bob')` 返回后就被销毁了，因此\
  \ `print(name)` 将指向一个不存在的 `name` 变量。\n\n\n\n\n\n这类似于程序终止时程序变量被遗忘的方式。我将在本章后面讨论函数的局部作用域时，更详细地解释为什么会这种情况。\n\
  \n## 返回值与 return 语句 (Return Values and return Statements)\n\n当你调用 `len()` 函数并传递诸如\
  \ `'Hello'` 的参数时，该函数调用求值为整数值 `5`，这是你传递的字符串的长度。通常情况下，函数调用求值的结果被称为函数的**返回值**（return\
  \ value）。\n\n当使用 `def` 语句创建函数时，你可以使用 `return` 语句来指定返回值应该是什么。`return` 语句包含以下内容：\n\
  \n* `return` 关键字\n* 函数应该返回的数值或表达式\n\n当在 `return` 语句中使用表达式时，返回值就是该表达式求值的结果。例如，下面的程序定义了一个函数，该函数根据传入的参数数字返回不同的字符串。将此代码输入文件编辑器并将其保存为\
  \ `magic8Ball.py`：\n\n```\n➊ import random\n➋ def getAnswer(answerNumber):\n➌  \
  \   if answerNumber == 1:\n           return 'It is certain'\n       elif answerNumber\
  \ == 2:\n           return 'It is decidedly so'\n       elif answerNumber == 3:\n\
  \           return 'Yes'\n       elif answerNumber == 4:\n           return 'Reply\
  \ hazy try again'\n       elif answerNumber == 5:\n           return 'Ask again\
  \ later'\n       elif answerNumber == 6:\n           return 'Concentrate and ask\
  \ again'\n       elif answerNumber == 7:\n           return 'My reply is no'\n \
  \      elif answerNumber == 8:\n           return 'Outlook not so good'\n      \
  \ elif answerNumber == 9:\n           return 'Very doubtful'\n\n➍ r = random.randint(1,\
  \ 9)\n➎ fortune = getAnswer(r)\n➏ print(fortune)\n```\n\n当此程序启动时，Python 首先导入了 `random`\
  \ 模块 ➊。然后定义了 `getAnswer()` 函数 ➋。由于函数正在定义中（而不是被调用），执行会跳过其中的代码。接下来，调用了 `random.randint()`\
  \ 函数并传递了两个参数：`1` 和 `9` ➍。它求值为 `1` 到 `9` 之间的随机整数（包括 `1` 和 `9` 本身），并将值存储在名为 `r` 的变量中。\n\
  \n使用 `r` 作为参数调用了 `getAnswer()` 函数 ➎。程序执行移动到 `getAnswer()` 函数的顶部 ➌，值 `r` 被存储在名为 `answerNumber`\
  \ 的参数中。然后，根据 `answerNumber` 中的此值，函数返回许多可能的字符串值之一。程序执行返回到程序最初调用 `getAnswer()` 的那一行\
  \ ➎。返回的字符串被赋值给名为 `fortune` 的变量，然后该变量被传递给 `print()` 调用 ➏ 并打印到屏幕上。\n\n注意，由于你可以将返回值作为参数传递另一个函数调用，你可以缩短这三行：\n\
  \n```\nr = random.randint(1, 9)\nfortune = getAnswer(r)\nprint(fortune)\n```\n\n\
  将其简化为这一单行等效代码：\n\n```\nprint(getAnswer(random.randint(1, 9)))\n```\n\n记住，表达式由值和运算符组成。函数调用可以使用在表达式中，因为它可以求值为它的返回值。\n\
  \n## None 值 (The None Value)\n\n在 Python 中有一个值名为 `None`，它表示值的缺失。`None` 是 `NoneType`\
  \ 数据类型的唯一值。（其他编程语言可能将此值称为 `null`、`nil` 或 `undefined`。）就像布尔值 `True` 和 `False` 一样，`None`\
  \ 必须大大字母 `N` 输入。\n\n当你需要在变量中存储一个不会被误认为是真实值的内容时，这种“没有值”非常有帮助。`None` 使用的一个地方是作为 `print()`\
  \ 的返回值。`print()` 函数在屏幕上显示文本，但它不需要像 `len()` 或 `input()`那样返回任何内容。但由于所有函数调用都需要求值为返回值，`print()`\
  \ 返回 `None`。要查看其实效果，请在交互式 shell 中输入以下内容：\n\n```\n>>> spam = print('Hello!')\nHello!\n\
  >>> None == spam\nTrue\n```\n\n在后台，Python 为任何没有 `return` 语句的函数定义末尾添加 `return None`。这类似于\
  \ `while` 或 `for` 循环隐式地以 `continue` 语句结束。此外，如果你使用不带值的 `return` 语句（即只有 `return` 关键字本身），则返回\
  \ `None`。\n\n## 关键字参数与 print() (Keyword Arguments and print())\n\n大多数参数通过它们在函数调用中的位置识别。例如，`random.randint(1,\
  \ 10)` 与 `random.randint(10, 1)` 不同。函数调用 `random.randint(1, 10)` 将返回 `1` 到 `10`\
  \ 之间的随机整数，因为第一个参数是范围的低端，第二个参数是高端（而 `random.randint(10, 1)` 会导致错误）。\n\n然而，**关键字参数**（keyword\
  \ arguments）通过函数调用中前面的关键字来识别。关键字参数通常用于可选参数。例如，`print()` 函数有可选参数 `end` 和 `sep`，用于指定在结尾打印什么。\n\
  \n```\nprint('Hello')\nprint('World')\n```\n\n输出如下：\n\n```\nHello\nWorld\n```\n\n\
  由于 `print()` 会在字符串末尾添加换行符，你可以通过设置 `end` 参数来更改。如果你运行如下程序：\n\n```\nprint('Hello',\
  \ end='')\nprint('World')\n```\n\n输出如下：\n```\nHelloWorld\n```\n\n由于 `print()` 会在参数之间自动添加空格，你可以通过设置\
  \ `sep` 参数来更改分隔字符串。在交互式 shell 中输入以下内容：\n\n```\n>>> print('cats', 'dogs', 'mice')\n\
  cats dogs mice\n```\n\n但你可以通过传递 `sep` 关键字参数来替换默认分隔字符串：\n\n```\n>>> print('cats',\
  \ 'dogs', 'mice', sep=',')\ncats,dogs,mice\n```\n\n你也可以为编写的函数添加关键字参数，但首先你需要在后续章节中学习列表和字典类型。现在，只需知道某些函数在调用时可以指定可选参数即可。\n\
  \n\n\n\n作用域非常重要，原因有以下几点：\n\n*   全局作用域中的代码不能使用任何局部变量。\n*   但是局部作用域可以访问全局变量。\n*  \
  \ 函数局部作用域中的代码不能使用其他局部作用域中的变量。\n*   如果变量位于不同的作用域中，你可以对它们使用相同的名称。也就是说，可以有一个名为 `spam`\
  \ 的局部变量，同时也存在一个名为 `spam` 的全局变量。\n\nPython 拥有不同作用域而不是仅仅将所有内容都变为全局变量的原因是：当变量被特定函数调用中的代码修改时，该函数仅通过其参数和返回值与程序的其余部分交互。这缩小了可能引起\
  \ bug 的代码行范围。如果你的程序中只包含全局变量，并且因为某个变量被设置为错误值而产生 bug，那么将很难追踪这个错误值是在哪里设置的。它可能在程序的任何地方被设置过——而你的程序可能有几百或几千行长！但如果\
  \ bug 是由于局部变量值错误引起的，你就知道只有该函数中的代码可能错误地设置了它。\n\n虽然在小型程序中使用全局变量没有问题，但随着程序变得越来越大，依赖全局变量是一个坏习惯。\n\
  \n## 局部变量无法在全局作用域中使用\n\n考虑以下程序，运行它将会导致一个错误：\n\n```\ndef spam():\n    eggs = 31337\n\
  spam()\nprint(eggs)\n```\n\n如果你运行这个程序，输出将如下：\n\n```\nTraceback (most recent call):\n\
  \  File \"C:/test3784.py\", line 4, in <module>\n    print(eggs)\nNameError: name\
  \ 'eggs' is not defined\n```\n\n错误发生的原因是 `eggs` 变量只存在调用 `spam()` 时创建的局部作用域中。一旦程序执行从\
  \ `spam` 返回，该局部作用域就会被毁，不再有名为 `eggs` 的变量。因此，当你的程序尝试运行 `print(eggs)` 时，Python 会给你一个错误，说\
  \ `eggs` 未定义。如果你仔细考虑，这是合理的；当程序执行在全局作用域中时，不存在局部作用域，因此不存在任何局部变量。这就是为什么只有全局变量可以在全局作用域中使用。\n\
  \n## 局部作用域不能使用其他局部作用域中的变量\n\n每当调用函数时，都会创建一个新的局部作用域，包括从另一个函数调用函数时。考虑以下程序：\n\n```\n\
  \ def spam():\n    eggs = 99\n    bacon()\n    print(eggs)\n\n  def bacon():\n \
  \     ham = 101\n    eggs = 0\n\n spam()\n```\n\n当程序启动时，调用了 `spam()` 函数 ➎，并创建了一个局部作用域。局部变量\
  \ `eggs` ➊ 被设置为 `99`。然后调用了 `bacon()` 函数 ➋，创建了第二个局部作用域。多个局部作用域可以同时存在。在这个新的局部作用域中，局部变量\
  \ `ham` 被设置为 `101`，而局部变量 `eggs`——它与 `spam()` 局部作用域中的那个不同——也被创建 ➍ 并设置为 `0`。\n\n当\
  \ `bacon()` 返回时，该调用的局部作用域被销毁。程序执行在 `spam()` 函数中继续打印 `eggs` 的值 ➌，由于调用 `spam()` 的调用局部作用域在这里仍然存在，`eggs`\
  \ 变量被设置为 `99`。这就是程序打印的内容。\n\n结论是，一个函数中的局部变量与另一个函数中的局部变量是完全分离的。\n\n## 局部作用域可以读取全局变量\n\
  \n考虑以下程序：\n\n```\ndef spam():\n    print(eggs)\neggs = 42\nspam()\nprint(eggs)\n\
  ```\n\n由于 `spam()` 函数中没有名为 `eggs` 的参数，也没有任何给 `eggs` 赋值的代码，当在 `spam()` 中使用 `eggs`\
  \ 时，Python 将其视为对全局变量 `eggs` 的引用。这就是为什么运行上一个程序时打印了 `42` 的原因。\n\n## 同名的局部和全局变量\n\n\
  为了简化你的生活，请避免使用与全局变量或其他局部变量同名的局部变量。但在技术上，在 Python 中这样做是完全合法的。要查看发生什么，将以下代码输入文件编辑器并保存为\
  \ `sameName.py`：\n\n```\n def spam():\n    eggs = 'spam local'\n    print(eggs)\
  \ # 打印 'spam local'\n   def bacon():\n\n    eggs = 'bacon local'\n    print(eggs)\
  \ # 打印 'bacon local'\n    spam()\n    print(eggs) # 打印 'bacon local'\n\n eggs =\
  \ 'global'\n   bacon()\n   print(eggs) # 打印 'global'\n```\n\n运行此程序时，它输出如下：\n\n```\n\
  bacon local\nspam local\nbacon local\nglobal\n```\n\n此程序实际上有三个不同的变量，但混淆的是它们都被命名为\
  \ `eggs`。变量如下：\n\n➊ 在 `spam()` 调用时存在于局部作用域的名为 `eggs` 的变量。\n➋ 在 `bacon()` 调用时存在于局部作用域的名为\
  \ `eggs` 的变量。\n➌ 存在于全局作用域的名为 `eggs` 的变量。\n\n由于这三个相互独立的变量都具有相同的名称，要追踪哪一个是哪一个可能会令人困惑。\n\
  \n## global 语句\n\n如果你需要在函数内部修改全局变量，你必须使用 `global` 语句。例如，将以下代码输入文件编辑器并保存为 `sameName.py`：\n\
  \n```\n def spam():\n    global eggs\n    eggs = 'spam'\n\n  eggs = 'global'\n \
  \ spam()\n  print(eggs)\n```\n\n当你运行此程序时，输出将是所示：\n\n```\nspam\n```\n\n因为 `eggs`\
  \ 在函数顶部被声明为 `global`，所以它指向全局变量。没有创建局部变量。\n\n有四条规则可以判断变量是在局部作用域还是全局作用域：\n\n1. 如果变量在全局作用域中使用（即在所有函数之外），那么它始终是全局变量。\n\
  2. 如果在函数中有该变量的 `global` 语句，那么它就是全局变量。\n3. 否则，如果变量在函数中被赋值语句使用，它就是局部变量。\n4. 但如果变量没有在赋值语句中使用，那么它就是全局变量。\n\
  \n为了更好地感受这些规则，这里有一个示例程序。将以下内容输入文件编辑器并保存为 `sameName3.py`：\n\n```\n def spam():\n\
  \    global eggs\n    eggs = 'spam' # 这是全局的\n\n  def bacon():\n    eggs = 'bacon'\
  \ # 这是局部的\n  def ham():\n    print(eggs) # 这是全局的\n\n  eggs = 42 # 这是全局的\n  spam()\n\
  \  print(eggs)\n```\n\n在 `spam()` 函数中，`eggs` 是全局变量 `eggs`，因为在函数开头有一个针对 `eggs` 的\
  \ `global` 语句 ➊。在 `bacon()` 中，`eggs` 是局部变量，因为在该函数中有它的赋值语句 ➋。在 `ham()` ➌ 中，`eggs`\
  \ 是全局变量，因为在该函数中没有它的赋值语句或 `global` 语句。如果你运行 *sameName3.py*，输出将如下：\n\n```\nspam\n\
  ```\n\n在函数内部，变量要么始终是全局的，要么始终是局部的。函数中的代码无法先使用一个名为 `eggs` 的局部变量，随后在同一个函数内使用全局 `eggs`\
  \ 变量。\n\n## 注意\n\n如果你想在函数内部修改存储在全局变量中的值，必须对该变量使用 `global` 语句。\n\n如果你尝试在给局部变量赋值之前在函数中使用它，如以下程序所示，Python\
  \ 会给你一个错误。要查看这一点，请将以下内容输入文件编辑器并保存为 `sameName4.py`：\n\n\n\n\n\n```python\n def spam():\n\
  \      print(eggs) # ERROR!\n➊    eggs = 'spam local'\n\n➋ eggs = 'global'\n   spam()\n\
  ```\n\n如果你运行之前的程序，它会产生一条错误信息。\n\n```\nTraceback (most recent call last):\n  File\
  \ \"C:/test3784.py\", line 6, in <module>\n    spam()\n  File \"C:/test3784.py\"\
  , line 2, in spam\n    print(eggs) # ERROR!\nUnboundLocalError: local variable 'eggs'\
  \ referenced before assignment\n```\n\n此错误是因为 Python 看到在 `spam()` 函数中有一个 `eggs`\
  \ 的赋值语句 ➊，因此将 `eggs` 视为局部变量。但由于在给 `eggs` 赋值之前执行了 `print(eggs)`，局部变量 `eggs` 并不存在。Python\
  \ 不会退回到使用全局变量 `eggs` ➋。\n\n## 作为“黑盒”的函数\n\n通常，你对函数只需要知道它的输入（参数）和输出值；你并不总是需要纠结函数的代码实际上是如何工作的。当你以这种高层的方式思考函数时，通常认为你正在将函数视为一个“黑盒”。\n\
  \n这个想法是现代编程的基础。本书的随后的章节将向你展示几个由他人编写的包含函数的模块。虽然如果你好奇，可以查看一下源码，但你不需要了解这些函数是如何工作的就可以使用它们。而且由于鼓励在不使用全局变量的情况下编写函数，你通常不需要担心函数代码与程序的其余部分发生交互。\n\
  \n## 异常处理\n\n现在，在你的 Python 程序获取错误或 `exception` 意味着整个程序将崩溃。你不希望这种情况在真实世界的程序中发生。相反，你希望程序能够检测错误、处理错误，然后继续运行。\n\
  \n例如，考虑以下程序，它有一个“除以零”错误。打开一个新的文件编辑器窗口并输入以下代码，将其保存为 `zeroDivide.py`：\n\n```python\n\
  def spam(divideBy):\n    return 42 / divideBy\n\nprint(spam(2))\nprint(spam(12))\n\
  print(spam(0))\nprint(spam(1))\n```\n\n我们定义了一个名为 `spam` 的函数，给它传递了一个参数，然后用不同的参数打印了该函数的值以观察会发生什么。这是你运行之前的代码时得到的输出：\n\
  \n```\n21.0\n3.5\nTraceback (most recent call last):\n  File \"C:/zeroDivide.py\"\
  , line 6, in <module>\n    print(spam(0))\n  File \"C:/zeroDivide.py\", line 2,\
  \ in spam\n    return 42 / divideBy\nZeroDivisionError: division by zero\n```\n\n\
  每当你尝试将数字除以零时，就会发生 `ZeroDivisionError`。根据错误信息中提供的行号，你知道 `spam()` 中的 `return` 语句导致了错误。\n\
  \n错误可以使用 `try` 和 `except` 语句进行处理。可能发生错误的代码放在 `try` 子句中。如果发生错误，程序执行将移动到后续 `except`\
  \ 子句的开头。\n\n你可以将之前的除以零代码放在 `try` 子句中，并让 `except` 子句包含处理当此错误发生时情况的代码。\n\n```python\n\
  def spam(divideBy):\n    try:\n        return 42 / divideBy\n    except ZeroDivisionError:\n\
  \        print('Error: Invalid argument.')\n\nprint(spam(2))\nprint(spam(12))\n\
  print(spam(0))\nprint(spam(1))\n```\n\n当 `try` 子句中的代码引起错误时，程序执行将立即移动到 `except` 子句中的代码。在运行该代码后，执行将恢复正常继续。之前的程序的输出如下：\n\
  \n```\n21.0\n3.5\nError: Invalid argument.\nNone\n42.0\n```\n\n注意，在 `try` 块中的函数调用中发生的任何错误也会被捕获。考虑以下程序，它将\
  \ `spam()` 调用放在了 `try` 块中：\n\n```python\ndef spam(divideBy):\n    return 42 / divideBy\n\
  \ntry:\n    print(spam(2))\n    print(spam(12))\n    print(spam(0))\n    print(spam(1))\n\
  except ZeroDivisionError:\n    print('Error: Invalid argument.')\n```\n\n当运行此程序时，输出看起来如下：\n\
  \n```\n21.0\n3.5\nError: Invalid argument.\n```\n\n`print(spam(1))` 从未执行的原因是，一旦执行跳转到\
  \ `except` 子句中的代码，它就不会返回 `try` 子句。相反，它只是正常地继续向下移动。\n\n## 短程序：猜数字\n\n到目前为止向你展示的小示例对于介绍基础概念很有用，但现在让我们看看你所学的一切是如何在一个更完整的程序中的。在本节中，我将向你展示一个简单的“猜数字”游戏。当你运行这个程序时，输出看起来像这样：\n\
  \n```\nI am thinking of a number between 1 and 20.\nTake a guess.\n10\nYour guess\
  \ is too low.\nTake a guess.\n15\nYour guess is too low.\nTake a guess.\n17\nYour\
  \ guess is too high.\nTake a guess.\n16\nGood job! You guessed my number in 4 guesses!\n\
  ```\n\n将以下源代码输入文件编辑器，并将文件保存为 `guessTheNumber.py`：\n\n```python\n# This is a guess\
  \ the game.\nimport random\nsecretNumber = random.randint(1, 20)\nprint('I am thinking\
  \ of a number between 1 and 20.')\n\n### Ask the player to guess 6 times.\nfor guessesTaken\
  \ in range(1, 7):\n    print('Take a guess.')\n    guess = int(input())\n\n    if\
  \ guess < secretNumber:\n        print('Your guess is too low.')\n    elif guess\
  \ > secretNumber:\n        print('Your guess is too high.')\n    else:\n       \
  \ break    # This condition is the correct guess!\n\nif guess == secretNumber:\n\
  \    print('Good job! You guessed my number in ' + str(guessesTaken) + ' guesses!')\n\
  else:\n    print('Nope. The number I was thinking of was ' + str(secretNumber))\n\
  ```\n\n让我们逐行查看这段代码，从顶部开始。\n\n```python\n# This is a guess the game.\nimport random\n\
  secretNumber = random.randint(1, 20)\n```\n\n首先，顶部的注释解释了程序的功能。然后，程序导入 `random` 模块，以便可以使用\
  \ `randint()` 函数生成一个让猜的数字。返回值一个 1 到 20 之间的随机整数存储在变量 `secretNumber` 中。\n\n```python\n\
  print('I am thinking of a number between 1 and 20.')\n\n### Ask the player to guess\
  \ 6 times.\nfor guessesTaken in range(1, 7):\n    print('Take a guess.')\n    guess\
  \ = int(input())\n```\n\n程序告诉玩家它想了一个数字，并将给玩家六次猜测的机会。让玩家输入并检查猜测的代码位于 `for` 循环中，该循环最多运行六次。循环中发生的第一件事是玩家输入猜测。由于\
  \ `input()` 返回字符串，其返回值直接传递给 `int()`，将字符串转换为整数值。这被存储在名为 `guess` 的变量中。\n\n```python\n\
  if guess < secretNumber:\n    print('Your guess is too low.')\nelif guess > secretNumber:\n\
  \    print('Your guess is too high.')\n```\n\n这几行代码检查猜测是否小于或大于秘密数字。在任何情况下，屏幕上都会打印提示。\n\
  \n```python\nelse:\n    break    # This condition is the correct guess!\n```\n\n\
  如果猜测既不大于也不小于秘密数字，那么它一定等于秘密数字，在这种情况下，你希望程序执行跳出 `for` 循环。\n\n```python\nif guess ==\
  \ secretNumber:\n    print('Good job! You guessed my number in ' + str(guessesTaken)\
  \ + ' guesses!')\nelse:\n    print('Nope. The number I was thinking of was ' + str(secretNumber))\n\
  ```\n\n\n\n\n\n在 `for` 循环之后，之前的 `if...else` 语句会检查玩家是否正确猜中了数字，并在屏幕上打印适当的消息。在两种情况下，程序都会显示一个包含整数值的的变量（`guessesTaken`\
  \ 和 `secretNumber`）。由于必须将这些整数值转换为字符串，因此会将这些变量传递给 `str()` 函数，该函数会返回这些整数的字符串形式值。现在，这些字符串就可以用\
  \ `+` 运算符进行拼接，最后传递给 `print()` 函数调用。\n\n## 总结\n\n函数是将代码划分为逻辑组的主要方法。由于函数中的变量存在于自己的局部作用域中，因此一个函数中的代码不能直接影响其他函数中变量的值。这限制了能够修改变量值的代码范围，这在调试代码时非常有帮助。\n\
  \n函数是帮助你组织代码的绝佳工具。你可以将它们看作黑盒：它们具有以参数形式存在的输入和以返回值形式存在的输出，且其内部的代码不会影响其他函数中的变量。\n\n\
  在之前的章节中，单个错误就会导致你的程序崩溃。在本章中，你学习了 `try` 和 `except` 语句，它们可以在检测到错误时运行代码。这可以使你的程序对常见错误情况更具韧性。\n\
  \n## 练习题\n\n| Q: | 1\\. 为什么在程序中使用函数是有优势的？ |\n| Q: | 2\\. 函数中的代码何时执行：是在函数定义时还是在函数被调用时？\
  \ |\n| Q: | 3\\. 什么语句创建函数？ |\n| Q: | 4\\. 函数和函数调用之间有什么区别？ |\n| Q: | 5\\. 一个 Python\
  \ 程序中有多少个全局作用域？有多少个局部作用域？ |\n| Q: | 6\\. 当函数调用返回时，局部作用域中的变量会发生什么？ |\n| Q: | 7\\\
  . 什么是返回值？返回值可以作为表达式的一部分吗？ |\n| Q: | 8\\. 如果函数没有返回语句，那么调用该函数的返回值是什么？ |\n| Q: | 9\\\
  . 如何强制让函数中的变量引用全局变量？ |\n| Q: | 10\\. `None` 的数据类型是什么？ |\n| Q: | 11\\. `import areallyourpetsnamederic`\
  \ 语句的作用是什么？ |\n| Q: | 12\\. 如果你在 `spam` 模块中有一个名为 `bacon()` 的函数，在导入 `spam` 后如何调用它？\
  \ |\n| Q: | 13\\. 如何防止程序在遇到错误时崩溃？ |\n| Q: | 14\\. `try` 子句中放什么内容？`except` 子句中放什么内容？\
  \ |\n\n# 练习项目\n\n为了练习，请编写程序完成以下任务。\n\n## 考拉兹序列\n\n写一个名为 `collatz()` 的函数，它包含一个名为\
  \ `number` 的参数。如果 `number` 是偶数，则 `collatz()` 打印 `number // 2` 并返回该值。如果 `number`\
  \ 是奇数，则 `collatz()` 打印并返回 `3 * number + 1`。\n\n然后写一个程序，让用户输入一个整数，并对该数字不断调用 `collatz()`，直到函数返回值\
  \ `1` 为止。（惊讶的是，这个序列实际上适用于任何整数——迟晚通过这个序列，你都会到达 1！即使是数学家们也不确定为什么。你的程序正在探索所谓的*考拉兹序列*，有时被称为“最简单的数学数学难题”。）\n\
  \n记得使用 `int()` 函数将 `input()` 的返回值转换为整数；否则它将是一个字符串值。\n\n提示：如果 `number % 2 == 0`，则整数\
  \ `number` 是偶数；如果 `number % 2 == 1`，则它是奇数。\n\n该程序的输出可能如下：\n\n```\nEnter number:\n\
  3\n10\n5\n16\n8\n4\n2\n1\n```\n\n## 输入验证\n\n在之前的项目中添加 `try` 和 `except` 语句，以检测用户是否输入了非整数字符串。通常情况下，如果向\
  \ `int()` 函数传递非整数字符串（如 `int('puppy')`），它将抛出 `ValueError` 错误。在 `except` 子句中，向用户打印消息告诉他们必须输入整数。\n\
  \n# 第 4 章 列表\n\n在开始编写程序之前，你还需要理解另一个主题：列表数据类型及其表亲——元组。列表和元组可以包含多个值，这使得编写处理大量数据的程序变得更容易。由于列表本身可以包含其他列表，你可以使用它们将数据排列成分级结构。\n\
  \n在本章中，我将讨论列表的基础。我还会教你方法，方法是与特定数据类型的值绑定的函数。然后我将简要介绍类似于列表的元组和字符串数据类型，以及它们如何与列表值比较。在下一章中，我将为你介绍字典数据类型。\n\
  \n## 列表数据类型\n\n*列表*（list）是一个在有序序列中包含多个值的。*列表值*一语指的是列表本身（这是一个可以存储在变量中或像其他值一样传递给函数的值），而不是列表值内部的值。列表值看起来像：`['cat',\
  \ 'bat']`。就像字符串值用字符标记字符串的起始和结束位置一样，列表以左括号开始并以右括号结束。列表内部的值称为项。项之间用逗号分隔（即它们是用逗号分隔的）。例如，在交互式\
  \ shell 中输入：\n\n```\n >>> spam = ['cat', 'bat']\n   >>> spam\n   ['cat', 'bat']\n\
  ```\n\n`spam` 变量仍然赋值了一个值：列表值。但列表值本身包含了其他值。`[]` 是一个不任何值的空列表，类似于 `''`。## 获取列表中的单个值\n\
  \n假设你有一个名为 `spam` 的变量存储列表 `['cat', 'bat']`。Python 代码 `spam[0]` 的求值为 `'cat'`，`spam[1]`\
  \ 的求值为 `'bat'`，依此类推。列表方括号内的整数被称为索引。列表中的第一个值位于索引 `0`，第二个值位于索引 `1`，第三个值位于索引 `2`，依此类推。图\
  \ 4-1 显示了赋值给 `spam` 的列表值，以及索引表达式的求值结果。\n\n![变量 spam 中的列表值，显示索引引用的值](img/httpatomoreillycomsourcenarchimages2189595.png)\n\
  \n图 4-1 变量 `spam` 中的列表值，显示索引引用的值\n\n例如，在交互式 shell 中输入以下表达式。首先将列表赋值给变量 `spam`。\n\n\
  ```\n >>> spam = ['cat', 'bat', 'rat', 'elephant']\n   >>> spam[0]\n   'cat'\n \
  \  >>> spam[1]\n   'bat'\n   >>> spam[2]\n   'rat'\n   >>> spam[3]\n   'elephant'\n\
  \   >>> ['cat', 'bat', 'rat', 'elephant'][3]\n   'elephant'\n➊ >>> 'Hello ' + spam[0]\n\
  ➋ 'Hello cat'\n   >>> 'The ' + spam[1] + ' ate the ' + spam[0] + '.'\n   'The bat\
  \ ate the cat.'\n```\n\n注意，表达式 `'Hello ' + spam[0]` ➊ 的求值为 `'Hello ' + 'cat'`，因为\
  \ `spam[0]` 求值为字符串 `'cat'`。该表达式反而求值为字符串值 `'Hello cat'` ➋。\n\n如果你使用的索引超过了列表值中的数量，Python\
  \ 将给你一个 `IndexError` 错误消息。\n\n\n\n\n\n```\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n\
  >>> spam[10000]\nTraceback (most recent call last):\n  File \"<pyshell#9>\", line\
  \ 1, in <module>\n    spam[10000]\nIndexError: list index out of range\n```\n\n\
  索引只能是整数值，不能是浮点数。下面的示例会导致 `TypeError` 错误：\n\n```\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> spam[1]\n'bat'\n>>> spam[1.0]\nTraceback (most recent call last):\n\
  \  File \"<pyshell#13>\", line 1, in <module>\n    spam[1.0]\nTypeError: list indices\
  \ must be integers, not float\n>>> spam[int(1.0)]\n'bat'\n```\n\n列表还可以包含其他列表值。这些嵌套列表中的值可以使用多个索引来访问，如下：\n\
  \n```\n>>> spam = [['cat', 'bat'], [10, 20, 30, 40, 50]]\n>>> spam[0]\n['cat', 'bat']\n\
  >>> spam[0][1]\n'bat'\n>>> spam[1][4]\n50\n```\n\n第一个索引决定使用哪个列表值，第二个索引指示该列表值中的值。例如，`spam[0][1]`\
  \ 打印 `'bat'`，即第一个列表中的第二个值。如果你只使用一个索引，程序将打印该索引处的完整列表值。\n\n## 负索引\n\n虽然索引从 `0` 开始递增，你也可以使用负整数作为索引。整数值\
  \ `-1` 指列表中的最后一个索引，值 `-2` 指列表中的倒数第二个索引，依此类推。在交互式外壳中输入以下内容：\n\n```\n>>> spam = ['cat',\
  \ 'bat', 'rat', 'elephant']\n>>> spam[-1]\n'elephant'\n>>> spam[-3]\n'bat'\n>>>\
  \ 'The ' + spam[-1] + ' is afraid of the ' + spam[-3] + '.'\n'The elephant is afraid\
  \ of the bat.'\n```\n\n## 使用切片获取子列表\n\n就像索引可以从列表中获取单个值一样，*切片*（slice）可以以新列表的形式从列表中获取多个值。切片写在方括号中，与索引类似，但它有两个由冒号分隔的整数。注意索引和切片之间的区别。\n\
  \n*   `spam[2]` 是带有索引（一个整数）的列表。\n*   `spam[1:4]` 是带有切片（两个整数）的列表。\n\n在切片中，第一个整数是切片开始的索引。第二个整数是切片结束的索引。切片包含但不**包含**第二个索引处的值。切片评估为一个新的列表值。在交互式外壳中输入以下内容：\n\
  \n```\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[0:4]\n['cat', 'bat',\
  \ 'rat', 'elephant']\n>>> spam[1:3]\n['bat', 'rat']\n>>> spam[0:-1]\n['cat', 'bat',\
  \ 'rat']\n```\n\n作为快捷方式，你可以省略冒号两边的一个或两个索引。省略第一个索引等同于使用 `0` 或列表的开头。省略第二个索引等同于使用列表的长度，这将切片到列表的末尾。在交互式外壳中输入以下内容：\n\
  \n```\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[:2]\n['cat', 'bat']\n\
  >>> spam[1:]\n['bat', 'rat', 'elephant']\n>>> spam[:]\n['cat', 'bat', 'rat', 'elephant']\n\
  ```\n\n## 使用 len() 获取列表长度\n\n`len()` 函数将返回传递给它的列表中的值的数量，就像它可以计算字符串值中的字符数量一样。在交互式外壳中输入以下内容：\n\
  \n```\n>>> spam = ['cat', 'dog']\n>>> len(spam)\n2\n```\n\n## 使用索引更改列表中的值\n\n通常，变量名位于赋值语句的左侧，例如\
  \ `spam = 42`。然而，你也可以使用列表的索引来更改该索引处的值。例如，`spam[1] = 'aard'` 意味着“将列表 `spam` 中索引 `1`\
  \ 处赋值为字符串 `'aard'`。”在交互式外壳中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n\
  >>> spam[1] = 'aard'\n>>> spam\n['cat', 'aard', 'rat', 'elephant']\n>>> spam[2]\
  \ = spam[1]\n>>> spam\n['cat', 'aard', 'aard', 'elephant']\n>>> spam[-1] = 12345\n\
  >>> spam\n['cat', 'aard', 'rat', 12345]\n```\n\n## 列表拼接与列表复制\n\n`+` 运算符可以合并两个列表以创建一个新的列表值，就像它将两个字符串合并成新字符串一样。`*`\
  \ 运算符也可以与列表和整数值配合复制列表。在交互式外壳中输入以下内容：\n\n```\n>>> [1, 2, 3] + ['A', 'B', 'C']\n[1,\
  \ 2, 3, 'A', 'B', 'C']\n>>> ['A', 'B', 'C'] * 3\n['A', 'B', 'C', 'A', 'B', 'C',\
  \ 'A', 'B', 'C']\n```\n\n## 使用 del 语句从列表中删除值\n\n`del` 语句可以从列表中删除一个值。例如，`del spam[1]`\
  \ 将删除列表中的索引 1 处的值。如果你尝试删除一个不存在的索引，将抛出 `IndexError`。在交互式外壳中输入以下内容：\n\n```\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'elephant']\n>>> del spam[1]\n>>> spam\n['cat', 'rat',\
  \ 'elephant']\n>>> del spam[0]\n>>> spam\n['rat', 'elephant']\n>>> del spam[-1]\n\
  >>> spam\n['rat']\n```\n\n\n\n\n\n在第 2 章 中，你学习了使用 `for` 循环来执行特定次数的代码块。从技术上讲，`for`\
  \ 循环会为列表或类列表值中的每个值重复一次代码块。例如，如果你运行以下代码：\n\n```\nfor i in range(4):\n    print(i)\n\
  ```\n\n该程序的输出将如下：\n\n```\n0\n1\n2\n3\n```\n\n这是因为 `range(4)` 的返回值是一个类列表值，Python\
  \ 认为它类似于 `[0, 1, 2, 3]`。接下来的程序输出与上一个程序相同：\n\n```\nfor i in [0, 1, 2, 3]:\n    print(i)\n\
  ```\n\n之前的 `for` 循环实际上的作用是遍历它的子句，并在每次迭代中，将变量 `i` 设置为 `[0, 1, 2, 3]` 列表中的后继值。\n\n\
  ## 注意\n\n在本书中，我使用“类列表”（list-like）一词来指代技术上名为`sequences`序列）的数据类型。不过，你不需要知道这个术语的技术定义。\n\
  \nPython 的常用技术是使用 `range(len(someList))` 配合 `for` 循环来遍历列表的索引。例如，在交互式 shell 中输入以下内容：\n\
  \n```\n>>> supplies = ['pens', 'staplers', 'flame-throwers', 'binders']\n>>> for\
  \ i in range(len(supplies)):\n    print('Index ' + str(i) + ' in supplies is: '\
  \ + supplies[i])\n\nIndex 0 in supplies is: pens\nIndex 1 in supplies is: staplers\n\
  Index 2 in supplies is: flame-throwers\nIndex 3 in supplies is: binders\n```\n\n\
  在之前的 `for` 循环中使用 `range(len(supplies))` 非常方便，因为循环中的代码可以访问索引（作为变量 `i`）以及该索引处的值（作为\
  \ `supplies[i]`）。最棒的是，`range(len(supplies))` 会遍历 `supplies` 的所有索引，无论它包含多少项。\n\n\
  ## in 和 not in 运算符\n\n你可以使用 `in` 和 `not in` 运算符来确定一个值在或不在列表中。像其他运算符一样，`in` 和 `not\
  \ in` 用于表达式，并连接两个值：一个要在列表中查找的值，以及该值可能所在的列表。这些表达式将求值为一个布尔值。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> 'howdy' in ['hello', 'hi', 'howdy', 'heyas']\nTrue\n>>> spam = ['hello',\
  \ 'hi', 'howdy', 'heyas']\n>>> 'cat' in spam\nFalse\n>>> 'howdy' not in spam\nFalse\n\
  >>> 'cat' not in spam\nTrue\n```\n\n例如，下面的程序允许用户输入一个宠物名称，然后检查该名称是否在宠物列表中。打开一个新的文件编辑器窗口，输入以下代码并将其保存为\
  \ `myPets.py`：\n\n```\nmyPets = ['Zophie', 'Pooka', 'Fat-tail']\nprint('Enter a\
  \ name:')\nname = input()\nif name not in myPets:\n    print('I do not have a pet\
  \ named ' + name)\nelse:\n    print(name + ' is my pet.')\n```\n\n输出可能看起来像：\n\n\
  ```\nEnter a name:\nI do not have a pet named Rocky\n```\n\n## 多变量赋值技巧\n\n`多变量赋值技巧`（multiple\
  \ assignment trick）是一种快捷方法，让你在一行内将列表中的值赋值给多个变量。因此，与其这样做：\n\n```\n>>> cat = ['fat',\
  \ 'black', 'loud']\n>>> size = cat[0]\n>>> color = cat[1]\n>>> disposition = cat[2]\n\
  ```\n\n你可以输入这一行：\n\n```\n>>> cat = ['fat', 'black', 'loud']\n>>> size, color, disposition\
  \ = cat\n```\n\n变量的数量与列表的长度必须相等，否则 Python 将给你抛出一个 `ValueError`：\n\n```\n>>> cat\
  \ = ['fat', 'black', 'loud']\n>>> size, color, disposition, name = cat\nTraceback\
  \ (most recent call last):\n  File \"<pyshell#84>\", line 1, in <module>\n    ValueError:\
  \ need than 3 values to unpack\n```\n\n## 复合赋值运算符\n\n在给变量赋值时，你经常会使用变量本身。例如，在将 `42`\
  \ 赋值给变量 `spam` 后，你可以通过以下代码将 `spam` 中的值增加 `1`：\n\n```\n>>> spam = 42\n>>> spam =\
  \ spam + 1\n43\n```\n\n作为快捷方法，你可以使用复合赋值运算符 `+=` 来相同的操作：\n\n```\n>>> spam = 42\n\
  >>> spam += 1\n43\n```\n\n对于 `+`、`-`、`*`、`/` 和 `%` 运算符都有复合赋值运算符，见表 4-1。\n\n### 表\
  \ 4-1. 复合赋值运算符\n\n| 复合赋值语句 | 等效赋值语句 |\n| :--- | :--- |\n| `spam = spam + 1` | `spam\
  \ += 1` |\n| `spam = spam - 1` | `spam -= 1` |\n| `spam = spam * 1` | `spam *= 1`\
  \ |\n| `spam = spam / 1` | `spam /= 1` |\n| `spam = spam % 1` | `spam %= 1` |\n\n\
  `+=` 运算符还可以用于字符串和列表的拼接，而 `*=` 运算符可以用于字符串和列表的复制。在交互式 shell 中输入以下内容：\n\n```\n>>> spam\
  \ = 'Hello'\n>>> spam += ' world!'\n'Hello world!'\n```\n\n```\n>>> bacon = ['Zophie']\n\
  >>> bacon *= 3\n['Zophie', 'Zophie', 'Zophie']\n```\n\n## 方法\n\n`方法`（method）与函数是相同的，不同在于它是“在某个值上被调用的”。例如，如果一个列表值存储在\
  \ `spam` 中，你可以像这样在该列表上调用 `index()` 列表方法（我将在下文中解释它）：`spam.index('hello')`。方法部分位于值之后，用点号分隔。每个数据类型都有自己的方法。例如，`list`\
  \ 数据类型有几个用的方法，用于查找、添加、删除以及其他操作列表中的值。\n\n### 使用 index() 方法在列表中查找值\n\n列表值拥有 `index()`\
  \ 方法，可以向其传递一个值，如果该值存在于列表中则返回该值的索引。如果该值不在列表中，Python 会产生一个 `ValueError` 错误。在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> spam = ['hello', 'hi', 'howdy', 'heyas']\n>>> spam.index('hello')\n\
  0\n>>> spam.index('heyas')\n3\n>>> spam.index('howdy howdy howdy')\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#31>\", line 1, in <module>\n    spam.index('howdy\
  \ howdy howdy')\nValueError: 'howdy howdy howdy' is not in list\n```\n\n当列表中存在重复值时，将返回其第一次出现的索引。在交互式\
  \ shell 中输入以下内容，注意 `index()` 返回的是 `1` 而不是 `3`：\n\n```\n>>> spam = ['Zophie', 'Pooka',\
  \ 'Fat-tail', 'Pooka']\n>>> spam.index('Pooka')\n1\n```\n\n### 使用 append() 和 insert()\
  \ 方法向列表添加值\n\n要向列表添加新值，使用 `append()` 和 `insert()` 方法。在交互式 shell 中输入以下内容，对存储在变量 `spam`\
  \ 中的列表值调用 `append()` 方法：\n\n```\n>>> spam = ['cat', 'dog', 'bat']\n>>> spam.append('moose')\n\
  >>> spam\n['cat', 'dog', 'bat', 'moose']\n```\n\n之前的 `append()` 方法调用将参数添加到列表末尾。`insert()`\
  \ 方法可以在列表的任何索引处插入值。`insert()` 的第一个参数是新值的索引，第二个参数是待插入的新值。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> spam = ['cat', 'dog', 'bat']\n>>> spam.insert(1, 'chicken')\n>>> spam\n\
  ['cat', 'chicken', 'dog', 'bat']\n```\n\n注意代码是 `spam.append('moose')` 和 `spam.insert(1,\
  \ 'chicken')`，而不是 `spam = spam.append('moose')` 和 `spam = spam.insert(1, 'chicken')`。`append()`\
  \ 或 `insert()` 都没有将 `spam` 的新值作为其返回值。（事实上，`append()` 和 `insert()` 的返回值都是 `None`，所以你绝对不希望将其存储为新的变量值。）相反，列表是*原地*修改的。原地修改列表将在稍后在可变与不可变数据类型中进行详细介绍。\n\
  \n\n\n\n\n方法属于单一数据类型。`append()` 和 `insert()` 方法是列表方法，只能在列表值上调用，而不能在字符串或整数或其他值上调用。在交互式\
  \ shell 中输入以下内容，并注意出现的 `AttributeError` 错误消息：\n\n```\n>>> eggs = 'hello'\n>>> eggs.append('world')\n\
  Traceback (most recent call last):\n  File \"<pyshell#19>\", line 1, in <module>\n\
  \    eggs.append('world')\nAttributeError: 'str' object has no attribute 'append'\n\
  >>> bacon = 42\n>>> bacon.insert(1, 'world')\nTraceback (most recent call last):\n\
  \  File \"<pyshell#22>\", line 1, in <module>\n    bacon.insert(1, 'world')\nAttributeError:\
  \ 'int' object has no attribute 'insert'\n```\n\n## 使用 remove() 从列表中删除值\n\n`remove()`\
  \ 方法接收一个想要从其被调用的列表中删除的值。在交互式 shell 中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> spam.remove('bat')\n>>> spam\n['cat', 'rat', 'elephant']\n```\n\
  \n尝试删除列表中不存在的值将导致 `ValueError` 错误。例如，在交互式 shell 中输入以下内容，并注意显示的错误：\n\n```\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'elephant']\n>>> spam.remove('chicken')\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#11>\", line 1, in <module>\n    spam.remove('chicken')\n\
  ValueError: list.remove(x): x not in list\n```\n\n如果该值在列表中多次出现，则只会删除值的第一个实例。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat', 'cat', 'hat', 'cat']\n\
  >>> spam.remove('cat')\n>>> spam\n['bat', 'rat', 'cat', 'hat', 'cat']\n```\n\n当你知道想要从列表中删除的值的索引时，使用\
  \ `del` 语句很好。当你知道想要从列表中删除的具体值时，使用 `remove()` 方法很好。\n\n## 使用 sort() 方法对列表中的值进行排序\n\
  \n数值值列表或字符串列表可以使用 `sort()` 方法进行排序。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> spam = [2,\
  \ 5, 3.14, 1, -7]\n>>> spam.sort()\n>>> spam\n[-7, 1, 2, 3.14, 5]\n>>> spam = ['ants',\
  \ 'cats', 'dogs', 'badgers', 'elephants']\n>>> spam.sort()\n>>> spam\n['ants', 'badgers',\
  \ 'cats', 'dogs', 'elephants']\n```\n\n你也可以为 `reverse` 关键字参数传递 `True`，让 `sort()`\
  \ 反序对值进行排序。在交互式 shell 中输入以下内容：\n\n```\n>>> spam.sort(reverse=True)\n>>> spam\n['elephants',\
  \ 'dogs', 'cats', 'badgers', 'ants']\n```\n\n关于 `sort()` 方法有三点需要注意。首先，`sort()` 方法是原地排序（in\
  \ place）列表；不要尝试通过编写类似 `spam = spam.sort()` 的代码来捕返回值。\n\n其次，你不能对既包含数值又包含字符串的列表进行排序，因为\
  \ Python 不知道如何比较这些值。在交互式 shell 中输入以下内容，并注意 `TypeError` 错误：\n\n```\n>>> spam = [1,\
  \ 3, 2, 4, 'Alice', 'Bob']\n>>> spam.sort()\nTraceback (most recent call last):\n\
  \ File \"<pyshell#70>\", line 1, in <module>\n   spam.sort()\nTypeError: unorderable\
  \ types: str() < int()\n```\n\n第三，`sort()` 在排序字符串时使用的是“ASCII 顺序”而非实际字母顺序。这意味着大写字母在小写字母之前。因此，小写的\
  \ `a` 排序后的结果会位于大写的 `Z` 之后。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> spam = ['Alice', 'ants',\
  \ 'Bob', 'badgers', 'Carol', 'cats']\n>>> spam.sort()\n>>> spam\n['Alice', 'Bob',\
  \ 'Carol', 'ants', 'badgers', 'cats']\n```\n\n如果你需要按照常规字母顺序排序值，在调用 `sort()` 方法时为\
  \ `key` 关键字参数传递 `str.lower`。\n\n```\n>>> spam = ['a', 'z', 'A', 'Z']\n>>> spam.sort(key=str.lower)\n\
  >>> spam\n['a', 'A', 'z', 'Z']\n```\n\n这会导致 `sort()` 函数将列表中的所有项视作小写形式处理，而不会实际更改列表中的值。\n\
  \n# 示例程序：使用列表的魔力球\n\n使用列表，你可以写出一个比上一章魔力球程序优雅得多的版本。与其使用几行几乎完全相同的 `elif` 语句，你可以创建一个代码操作的单一列表。打开一个新的文件编辑器窗口并输入以下代码。将其保存为\
  \ `magic8Ball2.py`。\n\n```python\nimport random\n\nmessages = ['It is certain',\n\
  \    'It is decidedly so',\n    'Yes definitely',\n    'Reply hazy try again',\n\
  \    'Ask again later',\n    'Concentrate and ask again',\n    'My reply is no',\n\
  \    'Outlook not so good',\n    'Very doubtful']\n\nprint(messages[random.randint(0,\
  \ len(messages) - 1)])\n```\n\n## Python 缩进规则的例外\n\n在大多数情况下，代码行的缩进量告诉 Python 它处于哪个代码块中。然而，该规则有一些例外。例如，列表在源代码文件中实际上可以跨越几行。这些行的缩进并不重要；Python\
  \ 知道在看到结束的方括号之前，列表尚未结束。例如，你可以拥有像如下所示的代码：\n\n```python\nspam = ['apples',\n    'oranges',\n\
  \                     'bananas',\n'cats']\nprint(spam)\n```\n\n当然，从实际角度上说，大多数人利用\
  \ Python 的特性让他们的列表看起来美观且易读，就像魔力球程序中的 `messages` 列表一样。\n\n你可以使用末尾的 `\\` 换行符将单个指令拆分为多行。`\\\
  ` 之后一行的缩进并不重要。例如，以下是有效的 Python 代码：\n\n```python\nprint('Four score and ' + \\\n\
  \      'years ago...')\n```\n\n这些技巧想要重新排列长行使其更易读时非常有用。\n\n# 类列表类型：字符串和元组\n\n列表并不是表示有序值序列的数据类型。例如，字符串和列表实际上是类似的，如果你将字符串视为单个字符的“列表”。许多对列表可以的操作也可以对字符串进行：索引；切片；以及在\
  \ `for` 循环、`len()` 以及 `in` 和 `not in` 运算符中使用。要查看这一点，在交互式 shell 中输入以下内容：\n\n```\n\
  >>> name = 'Zophie'\n>>> name[0]\n'Z'\n>>> name[-2]\n'i'\n>>> name[0:4]\n'Zoph'\n\
  >>> 'Zo' in name\nTrue\n>>> 'z' in name\nFalse\n>>> for i in name:\n        print('*\
  \ * * ' + i + ' * *')\n\n* * * Z * * *\n* * * o * * *\n* * * p * * *\n* * * h *\
  \ * *\n* * * i * * *\n* * * e * * *\n```\n\n## 可变与不可变数据类型\n\n但列表和字符串在一个方面不同。列表值是一个*可变*数据类型：可以添加、删除或更改值。然而，字符串是*不可变*的：它不能被更改。尝试重新赋值字符串中的单个字符会导致\
  \ `TypeError` 错误，你可以在交互式 shell 中输入以下内容看到：\n\n```\n>>> name = 'Zophie a cat'\n>>>\
  \ name[7] = 'the'\nTraceback (most recent call last):\n  File \"<pyshell#50>\",\
  \ line 1, in <module>\n    name[7] = 'the'\nTypeError: 'str' object does not support\
  \ item assignment\n```\n\n\n\n\n“修改”字符串的正确方法是使用切片和拼接，通过复制旧字符串的部分来构建一个*新*字符串。在交互式\
  \ shell 环境中输入以下内容：\n\n```\n>>> name = 'Zophie a cat'\n>>> newName = name[0:7] +\
  \ 'the' + name[8:12]\n>>> name\n'Zophie a cat'\n>>> newName\n'Zophie the cat'\n\
  ```\n\n我们使用 `[0:7]` 和 `[8:12]` 来引用我们不想替换的字符。注意，原始字符串 `'Zophie a cat'` 并没有被修改，因为字符串是不可变的。\n\
  \n虽然列表值*是*可变的，但以下代码中的第二行并没有修改列表 `eggs`：\n\n```\n>>> eggs = [1, 2, 3]\n>>> eggs =\
  \ [4, 5, 6]\n>>> eggs\n[4, 5, 6]\n```\n\n在这里，`eggs` 中的列表值并没有被改变；相反，是一个完全不同的列表值（`[4,\
  \ 5, 6]`）覆盖了旧的列表值（`[1, 2, 3]`）。这在图 4-2 中有所所示。\n\n如果你想实际修改 `eggs` 中的原始列表以包含 `[4,\
  \ 5, 6]`，你必须执行类似下面的操作：\n\n```\n>>> eggs = [1, 2, 3]\n>>> del eggs[2]\n>>> del eggs[1]\n\
  >>> del eggs[0]\n>>> eggs.append(4)\n>>> eggs.append(5)\n>>> eggs.append(6)\n>>>\
  \ eggs\n[4, 5, 6]\n```\n\n![当执行 eggs = [4, 5, 6] 时，eggs 的内容被替换为新的列表值。](Images/httpatomoreillycomsourcenostarchimages2189597.png.jpg)\n\
  \n图 4-2。当执行 `eggs = [4, 5, 6]` 时，`eggs` 的内容被替换为新的列表值。\n\n在第一个示例中，`eggs` 最终获得的列表值与它开始时的列表值是相同的。只是这个列表被改变了，而不是被覆盖。图\
  \ 4-3 方法在原地修改同一个列表值。\")描述了上一个交互式 shell 示例中前七行所做的七个更改。\n\n![del 语句和 append() 方法在原地修改同一个列表值。](img/httpatomoreillycomsourcenostarchimages2189599.png.jpg)\n\
  \n图 4-3。`del` 语句和 `append()` 方法在原地修改同一个列表值。\n\n更改可变数据类型的值（如上一个示例中 `del` 语句和 `append()`\
  \ 方法所做的那）是在原地修改值的，因为变量的值没有被新的列表值替换。\n\n可变类型与不可变类型之间似乎是一个没有意义的区分，但引用传递将解释在使用可变参数与不可变参数调用函数时的不同行为。但在那，让我们先了解元组数据类型，它是列表数据类型的一种不可变形式。\n\
  \n## 元组数据类型\n\n*元组*数据类型与列表数据类型几乎相同，仅有两点不同。首先，元组使用圆括号 `(` 和 `)` 定义，而不是方括号 `[` 和 `]`。例如，在交互式\
  \ shell 环境中输入以下内容：\n\n```\n>>> eggs = ('hello', 42, 0.5)\n>>> eggs[0]\n'hello'\n\
  >>> eggs[1:3]\n(42, 0.5)\n>>> len(eggs)\n3\n```\n\n但元组与列表的主要区别在于，元组像字符串一样，是不可变的。元组的值不能被修改、添加或删除。在交互式\
  \ shell 环境中输入以下内容，并查看 `TypeError` 错误信息：\n\n```\n>>> eggs = ('hello', 42, 0.5)\n\
  >>> eggs[1] = 99\nTraceback (most recent call last):\n  File \"<pyshell#5>\", line\
  \ 1, in <module>\n    eggs[1] = 99\nTypeError: 'tuple' object does not support item\
  \ assignment\n```\n\n如果你的元组中只有一个值，可以通过在括号内的值后面添加一个尾随逗号来指示。否则，Python 会认为你只是在普通括号内输入了一个值。逗号让\
  \ Python 知道这是一个元组值（与某些其他编程语言不同，在 Python 中，在列表或元组的最后一项后添加尾随逗号是可以的）。在交互式 shell 环境中输入以下\
  \ `type()` 函数调用以查看区别：\n\n```\n>>> type(('hello',))\n<class 'tuple'>\n>>> type(('hello'))\n\
  <class 'str'>\n```\n\n你可以使用元组向任何阅读代码的人传达：你不打算让该值序列发生变化。使用元组的一个用处是它们不可变的，因此它们可以作为字典的键，而列表不能。\n\
  \n## 可变类型与不可变类型\n\n更改可变数据类型的值（如上一个示例中 `del` 语句和 `append()` 方法所做的那）是在原地修改值的，因为变量的值没有被新的列表值替换。\n\
  \n可变类型与不可变类型之间似乎是一个没有意义的区分，但引用传递将解释在使用可变参数与不可变参数调用函数时的不同行为。但在那，让我们先了解元组数据类型，它是列表数据类型的一种不可变形式。\n\
  \n\n\n\n随后，在图 4-5 中，`spam` 中的引用被复制到了 `cheese`。只创建了一个新的引用并存储在 `cheese` 中，而不是一个新列表。注意这两个引用都指向同一个列表。\n\
  \n![spam = cheese copies the reference, not the list.](img/httpatomoreillycomsourcenostarchimages2189603.png.jpg)\n\
  \n图 4-5。`spam = cheese` 复制的是引用，而不是列表。\n\n当你修改 `cheese` 所引的列表时，`spam` 所引的列表也会发生改变，因为\
  \ `cheese` 和 `spam` 都指向同一个列表。你可以在图 4-6 中看到这一点。\n\n![cheese[1] = 'Hello!' modifies\
  \ the list that both variables refer to.](Images/httpatomoreillycomsourcenostarchimages2189605.png.jpg)\n\
  \n图 4-6。`cheese[1] = 'Hello!'` 修改了两个变量共同指向的列表。\n\n变量包含的是列表值的引用，而不是列表值本身。但对于字符串和整数值，变量仅包含字符串或整数值。当变量必须存储可变数据类型（如列表或字典）的值时，Python\
  \ 会使用引用。对于字符串、整数或元组等不可变数据类型的值，Python 变量将存储值本身。\n\n尽管 Python 变量在技术上包含对列表或字典值的引用，但人们经常随口说变量包含了列表或字典。\n\
  \n## 传递引用 (Passing References)\n\n对于理解参数如何传递给函数，引用尤为重要。当函数被调用时，参数的值会被复制到参数变量中。对于列表（以及字典，我将在下一章描述），这意味着参数使用了引用的副本。要查看这种操作的后果，请打开一个新的文件编辑器窗口，输入以下代码并将其保存为\
  \ `passingReference.py`：\n\n```python\ndef eggs(someParameter):\n    someParameter.append('Hello')\n\
  \nspam = [1, 2, 3]\neggs(spam)\nprint(spam)\n```\n\n注意，当调用 `eggs()` 时，并没有使用返回值来给\
  \ `spam` 分配新值。相反，它直接在原处修改了列表。运行时，该程序会产生以下输出：\n\n```\n[1, 2, 3, 'Hello']\n```\n\n\
  尽管 `spam` 和 `someParameter` 包含的是独立的引用，但它们都指向同一个列表。这就是为什么函数内部的 `append('Hello')`\
  \ 方法调用在函数返回后仍然影响该列表。\n\n请记住这种行为：忘记 Python 是这样处理列表和字典变量可能会会导致令人困惑的 bug。\n\n## copy\
  \ 模块的 copy() 和 deepcopy() 函数\n\n虽然传递引用通常是处理列表和字典最方便的方法，但如果函数修改了传递的列表或字典，你可能不希望在原始列表或字典值中发生这些变化。为此，Python\
  \ 提供了一个名为 `copy` 的模块，该模块提供了 `copy()` 和 `deepcopy()` 函数。其中第一个 `copy.copy()` 可用于创建列表或字典等可变值的重复副本，而不仅仅是引用的副本。在交互式\
  \ shell 中输入以下内容：\n\n```python\n>>> import copy\n>>> spam = ['A', 'B', 'C', 'D']\n\
  >>> cheese = copy.copy(spam)\n>>> cheese[1] = 42\n>>> spam\n['A', 'B', 'C', 'D']\n\
  >>> cheese\n['A', 42, 'C', 'D']\n```\n\n现在 `spam` 和 `cheese` 变量指向独立的列表，这就是为什么当你在索引\
  \ `1` 处赋值 `42` 时，只有 `cheese` 中的列表被修改了。正如你在图 4-7 creates a second list that can be\
  \ modified independently of the first.\") 中所示，两个变量的引用 ID 不再相同，因为它们指向的是独立的列表。\n\n\
  ![cheese = copy.copy(spam) creates a second list that can be modified independently\
  \ of the first.](img/httpatomoreillycomsourcenostarchimages2189607.png.jpg)\n\n\
  图 4-7。`cheese = copy.copy(spam)` 创建了第二个可以独立于第一个进行修改的列表。\n\n如果你需要复制的列表包含列表，请使用 `copy.deepcopy()`\
  \ 函数代替 `copy.copy()`。`deepcopy()` 函数也会复制这些内部列表。\n\n## 总结\n\n列表是有用的数据类型，因为它们允许你在单个变量中编写对数量可修改值运行的代码。在书的后面，你将看到使用列表来完成那些在没有它们的情况下困难或无法完成的任务。\n\
  \n列表是可变的，这意味着其内容可以改变。元组和字符串虽然在某些方面与列表相似，但它们是不可变的，不能被更改。包含元组或字符串值的变量可以被新的元组或字符串值覆盖，但这并不是一回事。\n\
