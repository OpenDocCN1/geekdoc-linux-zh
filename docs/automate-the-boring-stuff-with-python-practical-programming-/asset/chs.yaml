  \ 函数，它们可以“漂亮打印”字典的值。当你想要比 `print()` 更清晰地显示字典项时，这非常有帮助。修改之前的 `characterCount.py`\
  \ 程序并将其保存为 `prettyCharacterCount.py`：\n\n```python\nimport pprint\nmessage = 'It\
  \ was a bright cold day in April, and the clocks were striking thirteen.'\ncount\
  \ = {}\n\nfor character in message:\n    count.setdefault(character, 0)\n    count[character]\
  \ = count[character] + 1\n\npprint.pprint(count)\n```\n\n这一次当运行程序时，输出看起来整洁得多，且键经过了排序。\n\
