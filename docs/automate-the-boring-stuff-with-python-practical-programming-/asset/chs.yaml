  \ Python 知识来完成下载网页、更新电子表格或发送短信等任务，但这正是 Python 模块大用之地！这些由其他程序员编写的模块提供了许多函数，让你轻松完成所有这些事情。所以，让我们学习如何编写真正的程序来执行实用的自动化任务。\n\
  \n## 练习题\n\n- Q: | 1. 空字典的代码看起来是什么样的？\n- Q: | 2. 键为 `'foo'` 值为 `42` 的字典值看起来是什么样子的？\n\
  - Q: | 3. 字典和列表之间的主要区别是什么？\n- Q: | 4. 如果 `spam` 是 `{'bar': 100}`，尝试访问 `spam['foo']`\
  \ 会发生什么？\n- Q: | 5. 如果字典存储在 `spam` 中，表达式 `'cat' in spam` 和 `'cat' in spam.keys()`\
  \ 之间有什么区别？\n- Q: | 6. 如果字典存储在 `spam` 中，表达式 `'cat' in spam` 和 `'cat' in spam.values()`\
