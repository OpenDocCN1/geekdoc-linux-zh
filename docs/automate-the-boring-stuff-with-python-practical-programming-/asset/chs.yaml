  \   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n\
  \   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam',\
  \ 'eggs', 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs',\
  \ 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon',\
  \ 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n\
  \   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n\
  \   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam',\
  \ 'eggs', 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs',\
  \ 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon',\
  \ 'ham'])\n   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n\
  \   21\n   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n\
  \   >>> outputWriter.writerow(['spam', 'eggs', 'bacon', 'ham'])\n   21\n   >>> outputWriter.writerow(['spam',\
  \ 'eggs', 'bacon', 'ham'])\n   21\n```\n\n首先将 `csv.writer()`传递给 `csv.reader()` 函数\
  \ ➌。这将为你返回一个 `Reader` 对象供你使用。注意，你不需要直接将文件名字符串传递给 `csv.reader()` 函数。\n\n访问 `Reader`\
  \ 对象中值的最直接方法是通过将其传递给 `list()` 来转换为普通的 Python 列表 ➍。在此 `Reader` 对象上使用 `list()` 会返回一个列表嵌套列表，你可以将其存储在如\
  \ `exampleData` 这样的变量中。在 shell 中输入 `exampleData` 会显示该列表嵌套列表 ➎。\n\n现在你已经有了作为列表列表形式的\
  \ CSV 文件，你可以使用表达式 `exampleData[row][col]` 访问特定行和列的值，其中 `row` 是 `exampleData` 中某个列表的索引，而\
  \ `col` 是你从该列表中获取的项目的索引。在交互式 shell 中输入以下内容：\n\n```\n>>> exampleData[0][0]\n'4/5/2015\
  \ 13:34'\n>>> exampleData[0][1]\n'Apples'\n>>> exampleData[0][2]\n'73'\n>>> exampleData[1][1]\n\
  'Cherries'\n>>> exampleData[6][1]\n'Strawberries'\n```\n\n`exampleData[0][0]` 进入第一个列表并给我们第一个字符串，`exampleData[0][2]`\
  \ 进入第一个列表并给出第三个字符串，以此此类推。\n\n对于大型 CSV 文件，你可能需要在 `for` 循环中使用 `Reader` 对象。这可以避免一次性将整个文件加载到内存中。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import csv\n>>> exampleFile = open('example.csv')\n\
  >>> exampleReader = csv.reader(exampleFile)\n>>> for row in exampleReader:\n   \
  \     print('Row #' + str(exampleReader.line_num) + ' ' + str(row))\n\nRow #1 ['4/5/2015\
  \ 13:34', 'Apples', '73']\nRow #2 ['4/5/2015 3:41', 'Cherries', '85']\nRow #3 ['4/6/2015\
  \ 12:46', 'Pears', '14']\nRow #4 ['4/8/2015 8:59', 'Oranges', '52']\nRow #5 ['4/10/2015\
  \ 2:07', 'Apples', '152']\nRow #6 ['4/10/2015 18:10', 'Bananas', '23']\nRow #7 ['4/10/2015\
  \ 2:40', 'Strawberries', '98']\n```\n\n在导入 `csv` 模块并从 CSV 文件创建一个 `Reader` 对象后，你就可以遍历\
  \ `Reader` 对象中的行。每行都是一个值列表，每个值代表一个单元格。\n\n`print()` 函数调用会打印当前行号和该行的内容。要获取行号，使用 `Reader`\
  \ 对象的 `line_num` 变量，它包含当前行的数字。\n\n`Reader` 对象只能被遍历一次。要重新读取 CSV 文件，你必须调用 `csv.reader`\
  \ 来创建一个 `Reader` 对象。\n\n`Writer` 对象允许你向 CSV 文件写入数据。要创建一个 `Writer` 对象，你使用 `csv.writer()`\
  \ 函数。在交互式 shell 中输入以下内容：\n\n```\n >>> import csv\n➊ >>> outputFile = open('output.csv',\
  \ 'w', newline='')\n➋ >>> outputWriter = csv.writer(outputFile)\n   >>> outputWriter.writerow(['spam',\
  \ 'eggs', 'bacon', 'ham'])\n   21\n...（此处省略重复输出）...\n   >>> outputWriter.writerow(['spam',\
  \ 'eggs', 'bacon', 'ham'])\n   21\n```\n\n首先调用 `open()` 并传递它 `'w'` 以在写入模式打开文件。这将创建一个\
  \ `Writer` 对象。在 Windows 上，你需要为 `open()` 设置 `newline`。\n\n`writerow()` 方法接受一个列表。列表中的每个值被放置在自己的单元格中。`writerow()`\
  \ 的返回值是写入文件的字符数（包括换行符）。\n\n这段代码产生的 *output.csv* 文件，内容如下：\n\n```\nspam,eggs,bacon,ham\n\
  \"Hello, world!\",eggs,bacon,ham\n1,2,3,4\n```\n\n注意 `Writer` 对象自动用双引号转义了 `'Hello,\
  \ world!'` 中的逗号。\n\n## 分隔符和换终止符参数（delimiter and linetinator Arguments）\n\n假设你想用制表符代替逗号分隔单元格，并希望行之间有双倍间隔。你可以在交互式\
  \ shell 中输入类似的内容：\n\n```\n >>> import csv\n   >>> csvFile = open('example.tsv',\
  \ 'w', newline='')\n➊ >>> csvWriter = csv.writer(csvFile, delimiter='\\t', linetinator='\\\
  n\\n')\n   >>> csvWriter.writerow(['apples', 'oranges', 'grapes'])\n   24\n   >>>\
  \ csvWriter.writerow(['eggs', 'bacon', 'ham'])\n   17\n   >>> csvWriter.writerow(['spam',\
  \ 'spam', 'spam', 'spam', 'spam', 'spam'])\n   32\n   >>> csvFile.close()\n```\n\
  \n这更改了文件中分隔符和换终止符字符。分隔符是出现在行单元格之间的字符。默认情况下，CSV 文件的分隔符是逗号。换终止符是出现在行末尾的字符。默认情况下，换终止符是换行符。你可以通过在\
  \ `csv.writer()` 中使用 `delimiter` 和 `lineterminator` 关键字参数将字符更改为不同的值。\n\n\n\n\n\n\
  ```\napples  oranges grapes\n\neggs    bacon   ham\nspam    spam    spam    spam\
  \    spam    spam\n```\n\n现在我们的单元格是通过制表符分隔的，因此我们正在使用 `.tsv` 文件扩展名，即制表符分隔的值。\n\n\
  # 项目：从 CSV 文件中移除表头\n\n假设你有一项无聊的工作：从几百个 CSV 文件中删除第一行。你可能需要将它们输入到一个自动化过程中，该过程只需要数据而不需要列顶部的表头。你*可以*在\
  \ Excel 中打开每个文件，删除第一行并重新保存文件——但这将花费几个小时。让我们写一个程序来完成这项任务。\n\n该程序需要打开当前工作目录下所有 `.csv`\
  \ 扩展的文件，读取 CSV 文件的内容，并在不包含第一行的情况下将内容重写到同名的文件中。这将用新的无表头内容替换 CSV 文件的旧内容。\n\n### 注意事项**\n\
  \n一如既往，每当你编写修改文件的程序时，请务必先备份文件，以防你的程序运行结果不符合预期。你不希望意外删除了原始文件。\n\n从高层逻辑来看，程序必须执行以下操作：\n\
  \n*   找到当前工作目录下所有的 CSV 文件。\n*   读取每个文件的完整内容。\n*   跳过第一行，将内容写入新的 CSV 文件中。\n\n在代码层面，这意味着程序需要执行以下操作：\n\
  \n*   遍历来自 `os.listdir()` 的文件列表，跳过非 CSV 文件。\n*   创建一个 CSV `Reader` 对象并读取文件内容，使用\
  \ `line_num` 属性来确定要跳过哪一行。\n*   创建一个 CSV `Writer` 对象，并将读取到的数据写入新文件。\n\n对于对于此项目，请打开一个新的文件编辑器窗口并将其保存为\
  \ `removeCsvHeader.py`。\n\n## 步骤 1：循环遍历每个 CSV 文件\n\n你的程序需要执行的第一件事是遍历当前工作目录下所有 CSV\
  \ 文件名的列表。让你的 `removeCsvHeader.py` 看起来像这样：\n\n```python\n # python3\n   # removeCsvHeader.py\
  \ - 移除当前\n   # 工作目录下所有 CSV 文件的表头。\n\n   import csv, os\n\n   os.makedirs('headerRemoved',\
  \ exist_ok=True)\n\n   # 遍历当前工作目录下的每一个文件。\n   for csvFilename in os.listdir('.'):\n\
  \       if not csvFilename.endswith('.csv'):\n           continue    # 跳过非 csv 文件\n\
  \n       print('Removing header from ' + csvFilename + '...')\n\n       # TODO:\
  \ 读取 CSV 文件（跳过第一行）。\n\n       # TODO: 写入 CSV 文件。\n```\n\n`os.makedirs()` 调用将创建一个\
  \ `headerRemoved` 文件夹，所有无表头的 CSV 文件都将写入其中。对 `os.listdir('.')` 使用 `for` 循环可以让你完成部分工作，但它会遍历工作目录中的*所有*文件，因此你需要在循环开始处添加代码，跳过不以\
  \ `.csv` 结尾的文件。`continue` 语句会让 `for` 循环遇到非 CSV 文件时移动到下一个文件名。\n\n为了在程序运行时有*一些*输出，打印一条显示程序正在处理哪个\
  \ CSV 文件的消息。然后为程序的剩余部分的功能添加一些 `TODO` 注释。\n\n## 步骤 2：读取 CSV 文件\n\n程序并没有删除 CSV 文件中的第一行，而是创建一个不包含第一行的\
  \ CSV 文件副本。由于副本的文件名与原始文件名相同，副本将覆盖原始文件。\n\n程序需要一种方法来跟踪当前是否正在循环第一行。在 `removeCsvHeader.py`\
  \ 中添加以下内容。\n\n```python\n#! python3\n# removeCsvHeader.py - 移除当前\n# 工作目录下所有 CSV\
  \ 文件的表头。\n\n--snip--\n# 读取 CSV 文件（跳过第一行）。\ncsvRows = []\ncsvFileObj = open(csvFilename)\n\
  readerObj = csv.reader(csvFileObj)\nfor row in readerObj:\n    if readerObj.line_num\
  \ == 1:\n        continue    # 跳过第一行\n    csvRows.append(row)\ncsvFileObj.close()\n\
  \n# TODO: 写入 CSV 文件。\n```\n\n`Reader` 对象的 `line_num` 属性可用于确定当前正在读取 CSV 文件中的哪一行。另一个\
  \ `for` 循环将遍历从 CSV `Reader` 对象返回的，除第一行外的所有行都将添加到 `csvRows` 中。\n\n当 `for` 循环遍历每一行时，代码会检查\
  \ `readerObj.line_num` 是否设置为 `1`。如果是，它将执行 `continue` 以移动到下一行，而不将其添加到 `csvRows`。对于之后的每一行，条件将始终为\
  \ `False`，该行将被添加到 `csvRows` 中。\n\n## 步骤 3：写入不包含第一行的 CSV 文件\n\n现在 `csvRows` 包含了第一行以外的所有行，接需要将该列表写入\
  \ `headerRemoved` 文件夹中的 CSV 文件中。在 `removeCsvHeader.py` 中添加以下内容。\n\n```python\n #\
  \ python3\n   # removeCsvHeader.py - 移除当前\n   # 工作目录下所有 CSV 文件的表头。\n   --snip--\n\
  \n   # 遍历当前工作目录下的每一个文件。\n   for csvFilename in os.listdir('.'):\n       if not csvFilename.endswith('.csv'):\n\
  \           continue    # 跳过非 CSV 文件\n\n       --snip--\n\n       # 写入 CSV 文件。\n\
  \       csvFileObj = open(os.path.join('headerRemoved', csvFilename), 'w',\n   \
  \                 newline='')\n       csvWriter = csv.writer(csvFileObj)\n     \
  \  for row in csvRows:\n           csvWriter.writerow(row)\n       csvFileObj.close()\n\
  ```\n\nCSV `Writer` 对象将使用 `csvFilename`（我们在 CSV 读取器中也使用了它）将列表写入 `headerRemoved`\
  \ 文件夹中的 CSV 文件。这将覆盖原始文件。\n\n一旦我们创建了 `Writer` 对象，我们就遍历存储在 `csvRows` 中的子列表，并将每个子列表写入文件。\n\
  \n代码执行后，外层 `for` 循环将循环到 `os.listdir('.')` 的下一个文件名。当该循环结束时，程序就完成了。\n\n要测试你的程序，请从\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 下载 `removeCsvHeader.zip`\
  \ 并将其解压到文件夹。在该文件夹中运行 `removeCsvHeader.py` 程序。输出如下：\n\n```\nRemoving header from\
  \ NAICS_data_1048.csv...\nRemoving header from NAICS_data_1218.csv...\n--snip--\n\
  Removing header from NAICS_data_9834.csv...\nRemoving header from NAICS_data_9986.csv...\n\
  ```\n\n该程序在每次从 CSV 文件中剥离第一行时都会打印一个文件名。\n\n\n\n\n许多网站以 JSON 格式提供其数据。Facebook、Twitter、Yahoo、Google、Tumblr、Wikipedia、Flickr、Data.gov、Reddit、IMDb、Rotten\
  \ Tomatoes、LinkedIn 以及许多其他热门网站为程序提供了 API。其中一些网站需要注册，而注册几乎总是免费的。你需要找到程序需要请求哪些 `URLs`\
  \ 来获取你想要的数据，以及返回的 JSON 数据结构的通用格式。这些文档应该由提供 API 的网站提供；如果它们有“开发者”（Developers）页面，请在该处查找文档。\n\
  \n使用 API，你可以编写执行以下操作的程序：\n\n*   从网站抓取原始数据。（访问 API 通常比下载网页并使用 `Beautiful Soup` 解析\
  \ HTML 更方便。）\n*   自动从你的其中一个社交网络账户下载新帖子并将其发布到另一个账户。例如，你可以将你的 `Tumblr` 帖子发布到 `Facebook`。\n\
  *   通过从 `IMDb`、`Rotten Tomatoes` 和 `Wikipedia` 提取数据并将其放入计算机上的单个文本文件中，为你的个人电影收藏创建一个“电影百科书”。\n\
  \n你可以在 `[http://nostarch.com/automatestuff/]` 的资源中看到一些 JSON API 的示例。\n\n## JSON\
  \ 模块\n\nPython 的 `json` 模块处理了带有 JSON 数据的字符串与 Python 值之间转换的所有细节，适用于 `json.loads()`\
  \ 和 `json.dumps()` 函数。JSON 无法存储每种 Python 值。它只能包含以下数据类型的值：字符串、整数、浮点数、布尔、列表、字典和 `NoneType`。JSON\
  \ 无法表示 Python 特有的对象，例如 `File` 对象、CSV `Reader` 或 `Writer` 对象、`Regex` 对象或 Selenium\
  \ `WebElement` 对象。\n\n## 使用 loads() 函数读取 JSON\n\n要将包含 JSON 数据的字符串转换为 Python 值，请将其传递给\
  \ `json.loads()` 函数。（该名字的意思是“加载字符串”，而不是“loads”）。在交互式 shell 程序中输入以下内容：\n\n```\n>>>\
  \ stringOfJsonData = '{\"name\": \"Zophie\", \"isCat\": true, \"miceCaught\": 0,\n\
  \"felineIQ\": null}'\n>>> import json\n>>> jsonDataAsPythonValue = json.loads(stringOfJsonData)\n\
  >>> jsonDataAsPythonValue\n{'isCat': True, 'miceCaught': 0, 'name': 'Zophie', 'felineIQ':\
  \ None}\n```\n\n导入 `json` 模块后，你可以调用 `loads()` 并传递一个 JSON 数据字符串。注意，JSON 字符串始终使用双引号。它将该数据作为\
  \ Python 字典返回。Python 字典无序的，因此在打印 `jsonDataAsPythonValue` 时，键值对可能会以不同的顺序出现。\n\n##\
  \ 使用 dumps() 函数写入 JSON\n\n`json.dumps()` 函数（其意思是“转储字符串”，而不是“dumps”）将一个 Python 值转换为\
  \ JSON 格式数据的字符串。在交互式 shell 程序中输入以下内容：\n\n```\n>>> pythonValue = {'isCat': True,\
  \ 'miceCaught': 0, 'name': 'Zophie',\n'felineIQ': None}\n>>> import json\n>>> stringOfJsonData\
  \ = json.dumps(pythonValue)\n>>> stringOfJsonData\n'{\"isCat\": true, \"felineIQ\"\
  : null, \"miceCaught\": 0, \"name\": \"Zophie\" }'\n```\n\n该值只能是以下基本 Python 数据类型之一：字典、列表、整数、浮点数、字符串、布尔或\
  \ `None`。\n\n# 项目：获取当前天气数据\n\n检查天气似乎相当简单：打开你的网络浏览器，点击地址栏，输入天气网站的 `URL`（或搜索一个网站然后点击链接），等待页面加载，忽略所有广告，等等。\n\
  \n实际上，如果你有一个程序可以下载未来几天的天气预报并将其以纯文本形式打印，你就可以跳过很多无聊的步骤。这个程序使用了第 11 章中的 `requests`\
  \ 模块从网络下载数据。\n\n总的来说，该程序执行以下操作：\n\n*   从命令行读取位置。\n*   从 OpenWeatherMap.org 下载 JSON\
  \ 天气数据。\n*   将 JSON 数据字符串转换为 Python 数据结构。\n*   打印今天以及后两天的天气。\n\n因此，代码需要执行以下操作：\n\
  \n*   合并 `sys.argv` 中的字符串以获取位置。\n*   调用 `requests.get()` 下载天气数据。\n*   调用 `json.loads()`\
  \ 将 JSON 数据转换为 Python 数据结构。\n*   打印天气预报。\n\n对于此项目，打开一个新的文件编辑器窗口并将其保存为 `quickWeather.py`。\n\
  \n## 第 1 步：从命令行参数获取位置\n\n该程序的输入将来自命令行。让 `quickWeather.py` 看起来像这样：\n\n```\n#! python3\n\
  # quickWeather.py - 从命令行打印某个位置的天气。\n\nimport json, requests, sys\n\n# 从命令行参数计算位置。\n\
  if len(sys.argv) < 2:\n    print('Usage: quickWeather.py location')\n    sys.exit()\n\
  location = ' '.join(sys.argv[1:])\n\n# TODO: 从 OpenWeatherMap.org 的 API 下载 JSON\
  \ 数据。\n\n# TODO: 将 JSON 数据加载到 Python 变量中。\n```\n\n在 Python 中，命令行参数存储在 `sys.argv`\
  \ 列表中。在 `#!` shebang 行和 `import` 语句之后，程序将检查是否存在多一个命令行参数。（记得 `sys.argv` 始终包含一个元素\
  \ `sys.argv[0]`，它包含 Python 脚本的文件名。）如果列表中只有一个元素，说明用户没有在命令行提供位置，程序将提供一条“用法”消息。\n\n\
  命令行参数按空格分割。命令行参数 `San Francisco, CA` 会使 `sys.argv` 包含 `['quickWeather.py', 'San',\
  \ 'Francisco,', 'CA']`。因此，调用 `join()` 方法合并第一个元素以外的所有字符串。将此合并字符串存储在名为 `location`\
  \ 的变量中。\n\n## 第 2 步：下载 JSON 数据\n\nOpenWeatherMap.org 提供 JSON 格式的实时天气信息。你的程序只需要下载\
  \ `[http://api.openweathermap.org/data/2.5/forecast/daily?q=<Location>&cnt=3]` 页面，其中\
  \ `<Location>` 是想要的城市名称。将以下内容添加到 `quickWeather.py`。\n\n```\n#! python3\n# quickWeather.py\
  \ - 从命令行打印某个位置的天气。\n\n--snip--\n\n# 从 OpenWeatherMap.org 的 API 下载 JSON 数据。\nurl\
  \ ='http://api.openweathermap.org/data/2.5/forecast/daily?q=%s&cnt=3' % (location)\n\
  response = requests.get(url)\nresponse.raise_for_status()\n\n# TODO: 将 JSON 数据加载到\
  \ Python 变量中。\n```\n\n我们从命令行参数获取了 `location`。为了构造我们要访问的 URL，我们使用 `%s` 占位并将存储在 `location`\
  \ 中的字符串插入到 URL 字符串相应的位置。我们将结果存储在 `url` 中并将 `url` 传递给 `requests.get()`。`requests.get()`\
  \ 调用返回一个 `Response` 对象，你可以通过调用 `raise_for_status()` 错误。如果没有抛出异常，下载的文本将在 `response.text`\
  \ 中。\n\n## 第 3 步：加载 JSON 数据并打印天气\n\n`response.text` 成员变量持有一个大大的 JSON 格式数据字符串。要将其转换为\
  \ Python 值，请调用 `json.loads()` 函数。JSON 数据看起来如下所示：\n\n\n\n\n\n```python\n{'city':\
  \ {'coord': {'lat': 37.7771, 'lon': -122.42},\n          'country': 'United States\
  \ of America',\n          'id': '5391959',\n          'name': 'San Francisco',\n\
  \          'population': 0},\n'cnt': 3,\n'cod': '200',\n'list': [{'clouds': 0,\n\
  \          'deg': 233,\n          'dt': 1402344000,\n          'humidity': 58,\n\
  \          'pressure': 1012.23,\n          'speed': 1.96,\n          'temp': {'day':\
  \ 302.29,\n                   'eve': 296.46,\n                   'max': 302.29,\n\
  \                   'min': 289.77,\n                   'morn': 294.59,\n       \
  \            'night': 289.77},\n          'weather': [{'description': 'sky is clear',\n\
  \                       'icon': '01d',\n--snip--\n```\n\n你可以通过将 `weatherData` 传递给\
  \ `pprint.pprint()` 来查看这些数据。你可能想检查 [`openweathermap.org/`](http://openweathermap.org/)\
  \ 获取更多关于这些字段含义的文档。例如，在线文档会告诉你 `'day'` 之后的 `302.29` 是开尔文的白天温度，而不是摄氏或华氏度。\n\n你需要的天气描述位于\
  \ `'main'` 和 `'description'` 之后。为了整齐地打印它们，请将以下内容添加到 `quickWeather.py`。\n\n```python\n\
  \ ! python3\n   # quickWeather.py - 从命令行打印某个位置的天气。\n\n   --snip--\n\n   # 将 JSON\
  \ 数据加载到 Python 变量。\n   weatherData = json.loads(response.text)\n   # 打印天气描述。\n➊\
  \ w = weatherData['list']\n   print('Current weather in %s:' % (location))\n   print(w[0]['weather'][0]['main'],\
  \ '-', w[0]['weather'][0]['description'])\n   print()\n   print('Tomorrow:')\n \
  \  print(w[1]['weather'][0]['main'], '-', w[1]['weather'][0]['description'])\n \
  \  print()\n   print('Day after tomorrow:')\n   print(w[2]['weather'][0]['main'],\
  \ '-', w[2]['weather'][0]['description'])\n```\n\n注意代码如何将 `weatherData['list']`\
  \ 存储在变量 `w` 中以节省你的一些输入量 ➊。你使用 `w[0]`、`w[1]` 和 `w[2]` 分别获取今天、明天和后天的天气字典。这些字典中的每一个都有一个\
  \ `'weather'` 键，其包含一个列表值。你感兴趣的是第一个列表项，即索引为 0 的包含更多键的嵌套字典。在这里，我们打印在 `'main'` 和 `'description'`\
  \ 键中的值，并用连字符分隔。\n\n当使用命令行参数 `quickWeather.py San Francisco, CA` 运行此程序时，输出如下：\n\n\
  ```\nCurrent weather in San Francisco, CA:\nClear - sky is clear\n\nTomorrow:\n\
  Clouds - few clouds\n\nDay after tomorrow:\nClear - sky is clear\n```\n\n（天气是我喜欢住在旧金山的原因之一！）\n\
  \n## 类似程序的创意\n\n访问天气数据可以形成许多类型程序的基础。你可以创建类似的程序执行以下操作：\n\n* 收集多个营地或徒步路线的天气预报，以查看哪一个的天气最好。\n\
  * 调度程序定期检查天气，并在需要将植物移到室内时向你发送霜冻警报。（`第 15 章` 和 `csv.writer()` 传递什么来创建 `Reader` 和\
  \ `Writer` 对象？ |\n| Q: | 3. 读取器和写入器的 `File` 对象需要在以什么模式下打开？ |\n| Q: | 4. 哪种方法接收列表参数并将其写入\
  \ CSV 文件？ |\n| Q: | 5. `delimiter` 和 `lineterminator` 关键字参数的作用是什么？ |\n| Q: | 6.\
  \ 哪个函数接收 JSON 数据字符串并返回 Python 数据结构？ |\n| Q: | 7. 哪个函数接收 Python 数据结构并返回 JSON 数据字符串？\
  \ |\n\n# 练习项目\n\n为了练习，请编写一个执行以下操作的程序。\n\n## Excel 转 CSV 转换器\n\nExcel 只需点击鼠标即可将表格保存为\
  \ CSV 文件，但如果你必须将数百个 Excel 文件转换为 CSV，将花费数小时去点击。使用来自 `第 12 章:\n    # 跳过非 xls 文件，加载工作簿对象。\n\
  \    for sheetName in wb.get_sheet_names():\n        # 遍历工作簿中的每一个工作表。\n        sheet\
  \ = wb.get_sheet_by_name(sheetName)\n\n        # 根据 Excel 文件名和工作表标题创建 CSV 文件名。\n\
  \        # 为此 CSV 文件创建 csv.writer 对象。\n\n        # 遍历工作表中的每一行。\n        for rowNum\
  \ in range(1, sheet.get_highest_row() + 1):\n            rowData = []    # 将每个单元添加到此列表\n\
  \            # 遍历行中的每个单元格。\n            for colNum in range(1, sheet.get_highest_column()\
  \ + 1):\n                # 将每个单元格的数据添加到 rowData\n\n            # 将 rowData 列表写入\
  \ CSV 文件。\n\n        csvFile.close()\n```\n\n从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载 ZIP 文件 *excelSpreadsheets.zip*，并将表格解压到与程序相同的目录。你可以使用这些文件来测试程序。\n\n# 第 15 章\
  \ 保持时间、调度任务和启动程序\n\n在你坐在电脑前运行程序是没问题的，但让程序在没有你直接监督的情况下运行也很有用。你的计算机时钟可以调度程序在指定的特定日期或定期运行代码。例如，你的程序可以每小时抓取一次网站以检查更改，或者在你睡觉的凌晨\
  \ 4 点执行 CPU 密集型任务。Python 的 `time` 和 `datetime` 模块提供了这些功能。\n\n你还可以使用 `subprocess`\
  \ 和 `threading` 模块编写按计划启动其他程序。通常，编程最快的方法是利用他人已经编写好的应用程序。\n\n## time 模块\n\n\n\n\n\
  你计算机的系统时钟设置了特定的日期、时间和时区。内置的 `time` 模块允许你的 Python 程序读取系统时钟以获取当前时间。`time.time()` 和\
  \ `time.sleep()` 函数是 `time` 模块中最常用的函数。\n\n## `time.time()` 函数\n\n`Unix epoch`（Unix\
  \ 纪）是编程中常用的时间参考点：协调世界时 (UTC) 1970 年 1 月 1 日凌晨 12 点。`time.time()` 函数返回自该刻起的秒数，格式为浮点数。（记住，浮点数就是带有小数点的数字。）这个数字被称为\
  \ `epoch timestamp`（纪时间戳）。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> import time\n>>> time.time()\n\
  1425063955.068649\n```\n\n在这里，我在 2015 年 2 月 27 日 11:05 太平洋标准时间（或 UTC 晚上 7:05）调用了\
  \ `time.time()`。返回值是从 Unix 纪到调用 `time.time()` 那一刻之间经过的秒数。\n\n## 注意\n\n交互式 shell\
  \ 示例显示的日期和时间是我写这一章时（2015 年 2 月）。除非你是时间旅行者，否则你的日期和时间将会不同。\n\n时间戳可以用于代码 `profile`（性能分析），即测量一段代码运行所需的时间。如果你在想要测量的代码块开始调用\
  \ `time.time()`，并在结束再次调用它，你可以用第二个时间戳减去第一个，以找到两次调用之间的运行时间。例如，打开一个新的文件编辑器窗口并输入以下程序：\n\
  \n```\n import time\n➊ def calcProd():\n       # 计算前 100,000 个数字的积。\n       product\
  \ = 1\n       for i in range(1, 100000):\n           product = product * i\n   \
  \    return product\n\n➋ startTime = time.time()\n   prod = calcProd()\n➌ endTime\
  \ = time.time()\n➍ print('The result is %s digits long.' % (len(str(prod))))\n➎\
  \ print('Took %s seconds to calculate.' % (endTime - startTime))\n```\n\n在 ➊ 处，我们定义了一个函数\
  \ `calcProd()` 来遍历从 1 到 99,999 的整数并返回它们的积。在 ➋ 处，我们调用 `time.time()` 并将其存储在 `startTime`\
  \ 中。在调用 `calcProd()` 之后，我们再次调用 `time.time()` 并将其存储在 `endTime` ➌。最后，我们打印 `calcProd()`\
  \ 返回的积的长度 ➍ 以及运行 `calcProd()` 所需的时间 ➎。\n\n将此程序保存为 `calcProd.py` 并运行它。输出将如下：\n\n\
  ```\nThe result is 456569 digits long.\nTook 2.844162940979004 seconds to calculate.\n\
  ```\n\n## 注意\n\n另一种分析代码性能的方法是使用 `cProfile.run()` 函数，它比简单的 `time.time()` 技术提供了详尽得多的详细信息。`cProfile.run()`\
  \ 函数可以在 [`docs.python.org/3/library/profile.html`](https://docs.python.org/3/library/profile.html)\
  \ 中找到。\n\n## `time.sleep()` 函数\n\n如果你需要让程序暂停一会儿，请调用 `time.sleep()` 函数并传递它你希望程序停留的秒数。在交互式\
  \ shell 中输入以下内容：\n\n```\n >>> import time\n   >>> for i in range(3):\n➊        \
  \ print('Tick')\n➋         time.sleep(1)\n➌         print('Tock')\n➍         time.sleep(1)\n\
  \   Tick\n   Tock\n   Tick\n   Tock\n➎ >>> time.sleep(5)\n```\n\n`for` 循环会打印 `Tick`\
  \ ➊，暂停一秒➋，打印 `Tock` ➌，暂停一秒➍，打印 `Tick`，暂停，以此此类推，直到 `Tick` 和 `Tock` 各打印三次为止。`time.sleep()`\
  \ 函数会 `block`（阻塞）——即它不会返回并释放程序去执行其他代码，直到传递给 `time.sleep()` 的秒数结束。例如，如果你输入 `time.sleep(5)`\
  \ ➎，你会发现过了五秒钟，下一个提示符 `>>>` 才会出现。请注意，在 IDLE 中按 CTRL-C 不会中断 `time.sleep()` 调用。IDLE\
  \ 会直等到整个暂停结束才抛出 `KeyboardInterrupt` 异常。为了解决这个问题，与其使用单一的 `time.sleep(30)` 调用来暂停 30\
  \ 秒，不如使用 `for` 循环进行 30 次 `time.sleep(1)`。\n\n```\n>>> for i in range(30):\n    time.sleep(1)\n\
  ```\n\n如果你在这 30 秒内的某时刻按下 CTRL-C，你应该看到抛出了 `KeyboardInterrupt` 异常。\n\n## 数字的舍入\n\n\
  在处理时间时，你经常遇到带有许多小数位的浮点值。为了让这些值更容易处理，你可以使用 Python 内置的 `round()` 函数简化它们，该函数可以将浮点数舍入到你指定的精度。只需传入你想舍入的数字，以及一个可选的第二个参数，代表你想保留的小数位数。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import time\n>>> now = time.time()\n>>> now\n1425064108.017826\n\
  >>> round(now, 2)\n1425064108.02\n>>> round(now, 4)\n1425064108.0178\n>>> round(now)\n\
  1425064108\n```\n\n在导入 `time` 并将 `time.time()` 存储在 `now` 后，我们调用 `round(now, 2)`\
  \ 将 `now` 舍入到小数点后两位，`round(now, 4)` 舍入到小数点后四位，`round(now)` 舍入到最近整数。\n\n## 项目：超级秒表\n\
  \n假设你想跟踪自己在尚未自动化的无聊任务上花费了多少时间。你没有物理秒表，而且很难为你的笔记本电脑或手机找到一个既不含广告又不发送副本的免费秒表应用。不要把你的浏览器历史记录发送给营销人员。你可以用\
  \ Python 编写一个简单的秒表程序。\n\n从高层次来说，你的程序将执行：\n\n- 跟踪每次按下 ENTER 键之间的时间，每次按键开始一个新的“圈”。\n\
  - 打印圈数、总时间和每圈时间。\n\n这意味着你的代码需要执行以下操作：\n\n- 通过调用 `time.time()` 找到当前时间，并在程序开始以及每圈开始时将其存储为时间戳。\n\
  - 保持计数器并在每次用户按下 ENTER 时递增。\n- 通过减去时间戳计算经过的时间。\n- 处理 `KeyboardInterrupt` 异常以便用户可以使用\
  \ CTRL-C 退出。\n\n打开一个新的文件编辑器窗口并将其保存为 `stopwatch.py`。\n\n### 第一步：设置程序跟踪时间\n\n秒表程序需要使用当前时间，因此你需要导入\
  \ `time` 模块。你的程序还应该在 `input()` 之前向用户打印一些说明，以便计时器在用户按下 ENTER 后开始。然后代码将开始跟踪圈时间。\n\n\
  在编辑器中输入以下代码，编写一个 `TODO` 注释作为剩余代码的占位符：\n\n```\n#! python3\n# stopwatch.py - 一个简单的秒表程序。\n\
  \nimport time\n\n# 显示程序的说明。\nprint('按 ENTER 开始。之后按 ENTER 点击秒表。\n按 Ctrl-C 退出.')\n\
  input()                    # 按 Enter 开始\nprint('已启动。')\nstartTime = time.time()\
  \    # 获取第一圈的开始时间\nlastTime = startTime\nlapNum = 1\n\n# TODO: 开始跟踪圈时间。\n```\n\n\
  现在我们已经写了显示说明、启动第一圈、记录时间并设置圈数为 1 的代码。\n\n### 第二步：跟踪并打印圈时间\n\n现在让我们编写代码来启动每一圈，计算上一圈花费的时间，并计算自启动秒表以来的总经过时间。我们将显示圈时间和总时间，并在每个新圈时增加圈数。将以下代码添加到你的程序中：\n\
  \n\n\n\n\n```python\n#! python3\n# stopwatch.py - 一个简单的计时器程序。\n\nimport time\n\n\
  --snip--\n\n# 开始跟踪每圈的时间。\n➊ try:\n➋    while True:\n           input()\n➌      \
  \   lapTime = round(time.time() - lastTime, 2)\n➍         totalTime = round(time.time()\
  \ - startTime, 2)\n➎         print('Lap #%s: %s (%s)' % (lapNum, totalTime, lapTime),\
  \ end='')\n           lapNum += 1\n           lastTime = time.time() # 重置上一个圈的时间\n\
  ➏ except KeyboardInterrupt:\n       # 处理 Ctrl-C 异常以防止错误信息显示。\n       print('\\nDone.')\n\
  ```\n\n如果用户按下 `CTRL-C` 来停止计时器，将抛出 `KeyboardInterrupt` 异常，如果其执行没有使用 `try` 语句，程序将会崩溃。为了防止崩溃，我们将程序的这部分封装在\
  \ `try` 语句中 ➊。我们将在 `except` 子句 ➏ 中处理异常，因此当按下 `CTRL-C` 并抛出异常时，程序执行将移动到 `except` 子句打印\
  \ `Done`，而不是显示 `KeyboardInterrupt` 错误信息。在此发生之前，执行处于一个无限循环 ➋ 中，该循环调用 `input()` 并等待用户按下\
  \ `ENTER` 结束一圈。当一圈结束时，我们通过从当前时间 `time.time()` 减去该圈的开始时间 `lastTime` 来计算该圈花费的时间 ➌。我们通过从计时器的总开始时间\
  \ `startTime` 减去当前时间来计算已过的总时间 ➍。\n\n由于这些时间计算的结果在小数点后会有很多位数字（例如 `4.766272783279419`），我们在\
  \ ➌ 和 ➍ 处使用 `round()` 函数将浮点值舍入为两位。\n\n在 ➎ 处，我们打印圈数、已总时间和每圈时间。由于用户在 `input()` 调用时按下\
  \ `ENTER` 会在屏幕上打印换行符，因此向 `print()` 函数传递 `end=''` 以避免输出双倍间距。打印圈信息后，我们通过将计数器 `lapNum`\
  \ 加 1 并将 `lastTime` 设置为当前时间（即下一圈的开始时间），为下一圈做好准备。\n\n## 程序的创意\n\n时间跟踪为你的程序开启了许多可能性。虽然你可以下载应用来完成这些事情，但自己编写程序的好处是它们是免费的，且没有广告和无用功能的干扰。你可以编写类似的程序来实现以下功能：\n\
  \n*   创建一个简单的工时表应用，在你输入人员姓名时记录时间，并使用当前时间为他们打上班或下班。\n*   为你的程序添加一个功能，显示进程启动以来的流逝时间，例如使用\
  \ `requests` 模块的下载。（参见第 11 章\n➋ datetime.datetime(2015, 2, 27, 11, 10, 49, 55, 53)\n\
  ➌ >>> dt = datetime.datetime(2015, 10, 21, 16, 29, 0)\n➍ >>> dt.year, dt.month,\
  \ dt.day\n   (2015, 10, 21)\n➎ >>> dt.hour, dt.minute, dt.second\n   (16, 29, 0)\n\
  ```\n\n调用 `datetime.datetime.now()` ➊ 会根据你计算机的时钟返回一个当前日期和时间的 `datetime` 对象 ➋。该对象包含了当前时刻的年、月、日、时、分、秒和微秒。你也可以通过\
  \ `datetime.datetime()` 函数 ➌ 获取特定时刻的 `datetime` 对象，传递代表你想要时刻的年、月、日、时、秒的整数。这些整数将存储在\
  \ `datetime` 对象的 `year`、`month`、`day` ➍、`hour`、`minute` 和 `second` ➎ 属性中。\n\n可以使用\
  \ `datetime.datetime.fromtimestamp()` 函数将 Unix 时间戳转换为 `datetime` 对象。`datetime` 对象的日期和时间转换为本地时间。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> datetime.datetime.fromtimestamp(1000000)\ndatetime.datetime(1970,\
  \ 1, 12, 5, 46, 40)\n>>> datetime.datetime.fromtimestamp(time.time())\ndatetime.datetime(1970,\
  \ 1, 12, 5, 46, 40)\n```\n（注：time.time() 的示例输出将根据你的当前日期而变化）\n\n## 注意\n\n`datetime`\
  \ 对象可以相互比较。较晚的一个“更大”。在交互式 shell 中输入以下内容：\n\n```\n➊ >>> halloween015 = datetime.datetime(2015,\
  \ 10, 31, 0, 0, 0)\n➋ >>> newyears016 = datetime.datetime(2016, 1, 1, 0, 0, 0)\n\
  ➌ >>> halloween015 == newyears016\n   False\n➍ >>> halloween015 > newyears016\n\
  \   False\n➎ >>> newyears016 > halloween015\n   True\n```\n\n为 2015 年 10 月 31 日午夜创建一个\
  \ `datetime` 对象并将其存储在 `halloween015` 中。为 2016 年 1 月 1 日的第一时刻创建一个 `datetime` 对象并将其存储在\
  \ `newyears016` 中。然后 `halloween015` 和 `newyears016` 显示它们不等。`newyears016` 大于 `halloween015`。\n\
  \n## timedelta 数据类型\n\n`datetime` 模块还提供了 `timedelta` 数据类型，它表示时间的*持续时间*而不是时间中的某个*时刻*。在交互式\
  \ shell 中输入以下内容：\n\n```\n➊ >>> delta = datetime.timedelta(days=11, hours=10, minutes=9,\
  \ seconds=8)\n➋ >>> delta.days, delta.seconds, delta.microseconds\n   (11, 36548,\
  \ 0)\n➌ >>> delta.total_seconds()\n   986948.0\n   >>> str(delta)\n   '11 days,\
  \ 10:09:08'\n```\n\n要创建一个 `timedelta` 对象，请使用 `datetime.timedelta()` 函数。`datetime.timedelta()`\
  \ 函数接受关键字参数 `weeks`、`days`、`hours`、`minutes`、`seconds`、`milliseconds` 和 `microseconds`。没有\
  \ `month` 或 `year` 关键字参数，因为“一个月”或“一年”取决于特定月份或年份的可变时长。`timedelta` 对象用天、秒和微秒表示总持续时间。这些数字分别存储在\
  \ `days`、`seconds` 和 `microseconds` 属性中。`total_seconds()` 方法仅以秒数返回持续时间。将 `timedelta`\
  \ 对象传递给 `str()` 将返回一个格式良好的、人类可读的对象的字符串表示。\n\n\n\n\n在本示例中，我们向 `datetime.delta()`\
  \ 传递关键字参数以指定持续时间为 11 天、10 小时、9 分钟和 8 秒，并将返回的 `timedelta` 对象存储在 `delta` 中 ➊。该 `timedelta`\
  \ 对象的 `days` 属性存储了 `11`，其 `seconds` 属性存储了 `36548`（10 小时、9 分钟和 8 秒转换为秒） ➋。调用 `total_seconds()`\
  \ 告诉我们 11 天 10 小时 9 分钟 8 秒等于 986,948 秒。最后，将 `timedelta` 对象传递给 `str()` 将返回一个清晰解释该持续时间的字符串。\n\
  \n可以使用算术运算符对 `datetime` 值进行日期运算。例如，要计算现在 1000 天后的日期，请在交互式 shell 中输入以下内容：\n\n```python\n\
  >>> dt = datetime.datetime.now()\n>>> dt\ndatetime.datetime(2015, 2, 27, 18, 38,\
  \ 50, 636181)\n>>> thousandDays = datetime.timedelta(days=1000)\n>>> dt + thousandDays\n\
  datetime.datetime(2017, 11, 23, 18, 38, 50, 636181)\n```\n\n首先，创建一个当前时刻的 `datetime`\
  \ 对象并将其存储在 `dt` 中。然后创建一个持续时间 1000 天的 `timedelta` 对象并存储在 `thousandDays` 中。将 `dt`\
  \ 和 `thousandDays` 相加以得到 1000 天后的 `datetime` 对象。Python 将执行日期运算，计算出 2015 年 2 月 27\
  \ 日之后的 1000 天是 2017 年 11 月 23 日。这非常有用，因为当你计算给定日期之后 1000 天时，你必须记住每个月份有多少天，并考虑闰年和其他棘手的细节。`datetime`\
  \ 模块会为你处理好这一切。\n\n可以使用 `+` 和 `-` 运算符将 `timedelta` 对象与 `datetime` 对象或其他 `timedelta`\
  \ 对象相加或减。可以使用 `*` 和 `/` 运算符将 `timedelta` 对象与整数或浮点值相乘或相除。在交互式 shell 中输入以下内容：\n\n\
  ```python\n➊ >>> oct21st = datetime.datetime(2015, 10, 21, 16, 29, 0)\n➋ >>> aboutThirtyYears\
  \ = datetime.timedelta(days=365 * 30)\n   >>> oct21st\n   datetime.datetime(2015,\
  \ 10, 21, 16, 29)\n   >>> oct21st - aboutThirtyYears\n   datetime.datetime(1985,\
  \ 10, 28, 16, 29)\n   >>> oct21st - (2 * aboutThirtyYears)\n   datetime.datetime(1955,\
  \ 11, 5, 16, 29)\n```\n\n在这里，我们创建了 2015 年 10 月 21 日的 `datetime` 对象 ➊ 以及一个持续约 30\
  \ 年的 `timedelta` 对象（我们假设每年为 365 天） ➋。从 `oct21st` 减去 `aboutThirtyYears` 得到 2015 年\
  \ 10 月 21 日之前的 30 年的 `datetime` 对象。从 `oct21st` 减去 `2 * aboutThirtyYears` 返回 2015\
  \ 年 10 月 21 日之前的 60 年的 `datetime` 对象。\n\n## 暂停直到特定日期\n\n`time.sleep()` 方法允许程序暂停指定的秒数。通过使用\
  \ `while` 循环，你可以让程序暂停到特定日期为止。例如，以下代码将持续循环直到 2016 年的万圣节：\n\n```python\nimport datetime\n\
  import time\nhalloween2016 = datetime.datetime(2016, 10, 31, 0, 0, 0)\nwhile datetime.datetime.now()\
  \ < halloween2016:\n    time.sleep(1)\n```\n\n`time.sleep(1)` 调用将暂停你的 Python 程序，这样计算机就不会浪费\
  \ CPU 处理周期来仅仅反复检查时间。相反，`while` 循环每秒只会检查一次条件，并在 2016 年万圣节之后（或你程序设定停止的时间）继续执行程序的剩余部分。\n\
  \n## 将 datetime 对象转换为字符串\n\nEpoch 时间戳和 `datetime` 对象对人类视觉来说并不直观。使用 `strftime()`\
  \ 方法可以将 `datetime` 对象显示为字符串。（`strftime()` 函数名称中的 *f* 代表 *format*（格式化）。）\n\n`strftime()`\
  \ 方法使用与 Python 字符串格式化类似的指令。表 15-1 列出了 `strftime()` 指令的完整列表。\n\n表 15-1. `strftime()`\
  \ 指令\n\n| strftime 指令 | 含义 |\n| --- | --- |\n| `%Y` | 带有世纪的年份，例如 `'2014'` |\n| `%y`\
  \ | 不带世纪的年份，`'00'` 到 `'99'` (1970 年到 2069 年) |\n| `%m` | 十进制表示月份，`'01'` 到 `'12'`\
  \ |\n| `%B` | 完整的月份名称，例如 `'November'` |\n| `%b` | 缩写的月份名称，例如 `'Nov'` |\n| `%d` |\
  \ 月份中的几天，`'01'` 到 `'31'` |\n| `%j` | 一年中的几天，`'001'` 到 `'366'` |\n| `%w` | 星期，`'0'`（星期日）到\
  \ `'6'`（星期六） |\n| `%A` | 完整的星期几名称，例如 `'Monday'` |\n| `%a` | 缩写的星期几，例如 `'Mon'` |\n\
  | `%H` | 小时（24 小时制），`'00'` 到 `'23'` |\n| `%I` | 小时（12 小时制），`'01'` 到 `'12'` |\n|\
  \ `%M` | 分钟，`'00'` 到 `'59'` |\n| `%S` | 秒，`'00'` 到 `'59'` |\n| `%p` | AM 或 PM |\n\
  | `%z` | UTC 偏移，`+HHMM` 或 `-HHMM` |\n| `%f` | 微秒，六位数字 |\n| `%X` | 区域化的时间表示 |\n|\
  \ `%x` | 区域化的日期表示 |\n| `%Y` | 带有世纪的年份 |\n\n## 将字符串转换为 datetime\n\n要从字符串 `'October\
  \ 21, 2015'` 获取 `datetime` 对象，请将 `'October 21, 2015'` 作为第一个参数传递，并将与 `'October 21,\
  \ 2015'` 对应的自定义格式字符串作为第二个参数传递 ➊。带有日期信息的字符串必须与自定义格式字符串完全匹配，否则 Python 将抛出 `ValueError`\
  \ 异常。\n\n在交互式 shell 中输入以下内容：\n\n（注：此处原文为重复代码块，逻辑上如下）\n➊ >>> oct21st = datetime.datetime(2015,\
  \ 10, 21, 16, 29, 0)\n➋ >>> aboutThirtyYears = datetime.timedelta(days=365 * 30)\n\
  \   >>> oct21st\n   datetime.datetime(2015, 10, 21, 16, 29)\n   >>> oct21st - aboutThirtyYears\n\
  \   datetime.datetime(1985, 10, 28, 16, 29)\n   >>> oct21st - (2 * aboutThirtyYears)\n\
  \   datetime.datetime(1955, 11, 5, 16, 29)\n\n\n\n\n*   `datetime.datetime(year,\
  \ month, day, hour, minute, second)` 函数返回一个由参数指定的时刻的 `datetime` 对象。如果未提供 `hour`、`minute`\
  \ 或 `second` 参数，它们默认值为 `0`。\n*   `datetime.datetime.now()` 函数返回一个当前时刻的 `datetime`\
  \ 对象。\n*   `datetime.datetime.fromtimestamp(epoch)` 函数返回一个由 `epoch` 时间戳参数代表的时刻的\
  \ `datetime` 对象。\n*   `datetime.timedelta(weeks, days, hours, minutes, seconds,\
  \ milliseconds, microseconds)` 函数返回一个表示持续时间的 `timedelta` 对象。该函数的关键字参数都是可选的，且不包含\
  \ `month` 或 `year`。\n*   `timedelta` 对象的 `total_seconds()` 方法返回该 `timedelta` 对象表示的秒数。\n\
  *   `strftime(format)` 方法返回一个基于 `format` 字符串的自定义格式表示的 `datetime` 对象所代表的时间字符串。格式细节请参见表\
  \ 15-1 Directives\")。\n*   `datetime.datetime.strptime(time_string, format)` 函数返回一个使用\
  \ `format` 字符串参数解析的由 `time_string` 指定时刻的 `datetime` 对象。格式细节请参见表 15-1 Directives\"\
  )。\n\n# 多线程\n\n为了引入多线程的概念，让我们先来看一个示例场景。假设你想安排某些代码在延迟后或在特定时间运行。你可以在程序的开头添加如下所示的代码：\n\
  \n```\nimport time, datetime\n\nstartTime = datetime.datetime(2029, 10, 31, 0, 0,\
  \ 0)\nwhile datetime.datetime.now() < startTime:\n    time.sleep(1)\n\nprint('Program\
  \ now starting on Halloween 2029')\n--snip--\n```\n\n这段代码指定了 2029 年 10 月 31 日为开始时间，并不断调用\
  \ `time.sleep(1)` 直到开始时间到达。在等待 `time.sleep()` 调用循环结束期间，你的程序无法做任何事情；它只是一直停在那里直到 2029\
  \ 年万圣节。这是因为 Python 程序默认只有一个执行线程。\n\n要理解什么是执行线程，请回想第 2 章 中关于流程控制的讨论，当时你将程序的执行想象成将手指放在程序中的某行代码上，并移动到下一行或流程控制语句发送到的任何地方。单线程程序只有一个手指。但多线程程序有多个手指。每个手指仍然按照流程控制语句的定义移动到下一行代码，但这些手指可以处于程序的不同位置，同时执行不同的代码行。（到目前为止，书中的所有程序都是单线程的。）\n\
  \n与其让你的所有代码都等待 `time.sleep()` 函数完成，你可以使用 Python 的 `threading` 模块在单独线程中执行延迟或调度的代码。该单独线程会在\
  \ `time.sleep` 调用处停顿。与此同时，你的程序可以在原始线程中执行其他工作。\n\n要创建一个单独线程，你首先需要通过调用 `threading.Thread()`\
  \ 函数来创建一个 `Thread` 对象。在新文件中输入以下代码并将其保存为 `threadDemo.py`：\n\n```\n import threading,\
  \ time\n   print('Start of program.')\n\n➊ def takeANap():\n       time.sleep(5)\n\
  \       print('Wake up!')\n\n➋ threadObj = threading.Thread(target=takeANap)\n➌\
  \ threadObj.start()\n\n   print('End of program.')\n```\n\n在 ➊ 处，我们定义了一个想要在新线程中使用的函数。要创建一个\
  \ `Thread` 对象，我们调用 `threading.Thread()` 并向传递关键字参数 `target=takeANap` ➋。这意味着我们想要在新线程中调用的函数是\
  \ `takeANap()`。注意，关键字参数是 `target=takeANap`，而不是 `target=takeANap()`。这是因为你想将 `takeANap()`\
  \ 函数本身作为参数，而不是调用 `takeANap()` 并传递它的返回值。\n\n我们将 `threading.Thread()` 创建的 `Thread`\
  \ 对象存储在 `threadObj` 中，然后调用 `threadObj.start()` ➌ 来创建新线程并在新线程中执行目标函数。当运行此程序时，输出如下：\n\
  \n```\nStart of program.\nEnd of program.\nWake up!\n```\n\n这可能会让人有点困惑。如果 `print('End\
  \ of program.')` 是程序的最后一行，你可能会认为它应该是最后一个打印的内容。`Wake up!` 在其之后的原因是，当调用 `threadObj.start()`\
  \ 时，`threadObj` 的目标函数在一个新的执行线程中运行。将其想象为在 `takeANap()` 函数开始处出现了一个第二个手指。主线程继续执行 `print('End\
  \ of program.')`。与此同时，一直在执行 `time.sleep(5)` 用的新线程停了 5 秒。在它从 5 秒的小睡中醒来后，它打印 `'Wake\
  \ up!'` 然后从函数返回。逻辑上，`Wake up!` 是程序最后打印的内容。但 Python 程序在所有线程执行完毕之前不会终止。当你运行 `threadDemo.py`\
  \ 时，尽管原始线程已经结束，第二个线程仍在执行 `time.sleep(5)` 调用。\n\n## 给线程函数传递参数\n\n如果在新线程中运行的目标函数带有参数，你可以将目标函数的参数传递给\
  \ `threading.Thread()`。例如，假设你想在自己的线程中运行这个 `print()` 调用：\n\n```python\n>>> print('Cats',\
  \ 'Dogs', 'Frogs', sep=' & ')\nCats & Dogs & Frogs\n```\n\n这个 `print()` 调用有三个普通参数\
  \ `'Cats'`、`'Dogs'` 和 `'Frogs'`，以及关键字参数 `sep=' & '`。普通参数可以通过列表传递给 `threading.Thread()`\
  \ 的 `args` 关键字参数。关键字参数可以通过字典传递给 `threading.Thread()` 的 `kwargs` 关键字参数。\n\n在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> import threading\n>>> threadObj = threading.Thread(target=print,\
  \ args=['Cats', 'Dogs', 'Frogs'],\nkwargs={'sep': ' & '})\n>>> threadObj.start()\n\
  Cats & Dogs & Frogs\n```\n\n为了确保参数 `'Cats'`、`'Dogs'` 和 `'Frogs'` 被传递给新线程中的 `print()`，我们向\
  \ `threading.Thread()` 传递 `args=['Cats', 'Dogs', 'Frogs']`。为了确保关键字参数 `sep=' & '`\
  \ 被传递给新线程中的 `print()`，我们向 `threading.Thread()` 传递 `kwargs={'sep': '& '}`。\n\n`threadObj.start()`\
  \ 调用将创建一个新线程来调用 `print()` 函数，并将 `'Cats'`、`'Dogs'` 和 `'Frogs'` 作为参数，并将 `' & '` 作为\
  \ `sep` 关键字参数。\n\n这是创建调用 `print()` 新线程的错误方法：\n\n```\nthreadObj = threading.Thread(target=print('Cats',\
  \ 'Dogs', 'Frogs', sep=' & '))\n```\n\n这样做实际上调用了 `print()` 函数并将返回值（`print()` 的返回值始终为\
  \ `None`）作为 `target` 关键字参数。它*没有*传递 `print()` 函数本身。在新线程中向函数传递参数时，请使用 `threading.Thread()`\
  \ 函数的 `args` 和 `kwargs` 关键字参数。\n\n## 并发问题\n\n\n\n\n你可以轻松地创建几个新线程并让它们同时运行。但多个线程也会导致被称为\
  \ `concurrency issues`（并发问题）的问题。当线程同时读取和写入变量时，就会发生这些问题，导致线程之间相互冲突。并发问题很难一致地复现，使得它们难以调试。\n\
  \n多线程编程是一个非常广泛的主题，超出了本书的范围。你必须记住这一点：为了避免并发问题，永远不要让多个线程读取或写入同一个变量。当你创建一个新的 `Thread`\
  \ 对象时，确保其目标函数只使用该函数中的局部变量。这将避免你的程序中出现难以调试的并发问题。\n\n### Note\n\n关于多线程编程的初级教程可以在 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 找到。\n\n# 项目：多线程 XKCD 下载器\n\n在第 11 章 中，你编写了一个程序从 XKCD 网站下载所有的 XKCD 漫画。这是一个单线程程序：它一次只下载一张漫画。程序的大部分时间花在了建立网络连接以开始下载以及将下载的图像写入硬盘上。如果你有宽带互联网连接，你的单线程程序并没有充分利用可用带宽。\n\
  \n多线程程序在某些线程下载漫画的同时，另一些线程建立连接并将漫画图像文件写入磁盘，可以更有效地利用你的互联网连接，并更快地下载漫画集。打开一个新的文件编辑器窗口并将其保存为\
  \ `multidownloadXkcd.py`。你将修改此程序以添加多线程。完全修改后的源代码可以在 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载。\n\n## 步骤 1：修改程序以使用函数\n\n该程序大部分将与第 11 章 中的下载代码相同，因此我将跳过 Requests 和 BeautifulSoup\
  \ 代码的解释。你需要做的主要更改是导入 `threading` 模块并创建一个 `downloadXkcd()` 函数，该函数接受起始和结束漫画编号作为参数。\n\
  \n例如，调用 `downloadXkcd(140, 280)` 将循环执行下载代码，下载 [`xkcd.com/140`](http://xkcd.com/140)、[`xkcd.com/141`](http://xkcd.com/141)、[`xkcd.com/142`](http://xkcd.com/142)\
  \ 等，直到 [`xkcd.com/279`](http://xkcd.com/279)。你创建的每个线程将调用 `downloadXkcd()` 并传递一个不同的漫画范围进行下载。\n\
  \n将以下代码添加到你的 `multidownloadXkcd.py` 程序中：\n\n```\n #! python3\n   # multidownloadXkcd.py\
  \ - 使用多线程下载 XKCD 漫画。\n\n   import requests, os, bs4, threading\n➊ os.makedirs('xkcd',\
  \ exist_ok=True) # 将漫画存储在 ./xkcd 中\n\n➋ def downloadXkcd(startComic, endComic):\n\
  ➌     for urlNumber in range(startComic, endComic):\n           # 下载页面。\n      \
  \     print('Downloading page http://xkcd.com/%s...' % (urlNumber))\n➍         res\
  \ = requests.get('http://xkcd.com/%s' % (urlNumber))\n           res.raise_for_status()\n\
  \n➎         soup = bs4.BeautifulSoup(res.text)\n\n           # 找到漫画图像的 URL。\n➏ \
  \        comicElem = soup.select('#comic img')\n           if comicElem == []:\n\
  \               print('Could not find comic image.')\n           else:\n➐      \
  \       comicUrl = comicElem[0].get('src')\n               # 下载图像。\n           \
  \    print('Downloading image %s...' % (comicUrl))\n➑             res = requests.get(comicUrl)\n\
  \               res.raise_for_status()\n\n               # 将图像保存到 ./xkcd。\n    \
  \           imageFile = open(os.path.join('xkcd', os.path.basename(comicUrl)), 'wb')\n\
  \               for chunk in res.iter_content(100000):\n                   imageFile.write(chunk)\n\
  \               imageFile.close()\n\n   # TODO: 创建并启动 Thread 对象。\n   # TODO: 等待所有线程结束。\n\
  ```\n\n在导入需要的模块后，我们在 ➊ 中创建了一个目录来存储漫画，并开始定义 `downloadxkcd()` ➋。我们遍历指定范围内的所有数字 ➌ 并下载每个页面\
  \ ➍。我们使用 Beautiful Soup 检查每个页面的 HTML ➎ 并找到漫画图像 ➏。如果页面上没有找到漫画图像，我们就打印一条消息。否则，我们获取图像的\
  \ URL ➐ 并下载图像 ➑。最后，我们将图像保存到我们创建的目录中。\n\n## 步骤 2：创建并启动线程\n\n现在我们已经定义了 `downloadXkcd()`，我们将创建多个线程，每个线程都调用\
  \ `downloadXkcd()` 从 XKCD 网站下载不同范围的漫画。在 `downloadXkcd()` 函数定义之后，将以下代码添加到 `multidownloadXkcd.py`\
  \ 中：\n\n```\n#! python3\n# multidownloadXkcd.py - 使用多线程下载 XKCD 漫画。\n\n--snip--\n\
  \n# 创建并启动 Thread 对象。\ndownloadThreads = []             # 所有 Thread 对象的列表\nfor i\
  \ in range(0, 1400, 100):    # 循环 14 次，创建 14 个线程\n    downloadThread = threading.Thread(target=downloadXkcd,\
  \ args=(i, i + 99))\n    downloadThreads.append(downloadThread)\n    downloadThread.start()\n\
  ```\n\n首先，我们创建一个空列表 `downloadThreads`；该列表将帮助我们跟踪将创建的许多 `Thread` 对象。然后我们开始 `for`\
  \ 循环。每次循环，我们都使用 `threading.Thread()` 创建一个 `Thread` 对象，将该 `Thread` 对象添加到列表中，并调用 `start()`\
  \ 在新线程中运行 `downloadXkcd()`。由于 `for` 循环以 100 为步长将变量 `i` 从 `0` 设置为 `1400`，因此 `i` 在第一次迭代中被设置为\
  \ `0`，在第二次迭代中设置为 `100`，第三次迭代中设置为 `200`，依此类推。由于我们向 `threading.Thread()` 传递了 `args=(i,\
  \ i + 99)`，传递给 `downloadXkcd()` 的两个参数在第一次迭代中将是 `0` 和 `99`，第二次迭代中将是 `100` 和 `199`，第三次迭代中将是\
  \ `200` 和 `299`，依此类推。\n\n当 `Thread` 对象的 `start()` 方法被调用且新线程开始运行 `downloadXkcd()`\
  \ 内部的代码时，主线程将继续执行 `for` 循环的下次迭代并创建下一个线程。\n\n## 步骤 3：等待所有线程结束\n\n当我们创建的其他线程下载漫画时，主线程正常继续运行。但假设你有一些代码在所有线程完成之前不想在主线程中运行。调用\
  \ `Thread` 对象的 `join()` 方法将阻塞，直到该线程完成。通过使用 `for` 循环遍历 `downloadThreads` 列表中的所有 `Thread`\
  \ 对象，主线程可以对其他线程的每一个调用 `join()` 方法。将以下内容添加到程序的末尾：\n\n```\n#! python3\n# multidownloadXkcd.py\
  \ - 使用多线程下载 XKCD 漫画。\n\n--snip--\n\n# 等待所有线程结束。\nfor downloadThread in downloadThreads:\n\
  \    downloadThread.join()\nprint('Done.')\n```\n\n`'Done.'` 字符串直到所有的 `join()` 调用返回后才会打印。如果一个\
  \ `Thread` 对象在调用其 `join()` 方法时已经完成，那么该方法将直接返回。如果你想扩展此程序，使其仅在所有漫画下载完成后运行代码，可以将 `print('Done.')`\
  \ 这一行替换为你的新代码。\n\n# 从 Python 启动其他程序\n\n\n\n\n\n你的 Python 程序可以使用内置 `subprocess` 模块中的\
  \ `Popen()` 函数在你的计算机上启动其他程序。（`Popen()` 函数名称中的 `P` 代表 `process`（进程）。）如果你打开了应用程序的多个实例，其中每一个实例都是该程序的一个单独的进程。例如，如果你同时打开了网络浏览器的多个窗口，其中每个窗口都是网络浏览器程序的一个不同进程。请参考图\
  \ 15-1）查看同时打开多个计算器进程的示例。\n\n每个进程都可以拥有多个线程。与线程不同，进程不能直接读写另一个进程的变量。如果你将多线程程序比作有多个手指在追踪源代码，那么打开同一个程序的多个进程就就像是你的一个朋友也拥有了一份程序源代码的独立副本。你们都在独立地执行同一个程序。\n\
  \n如果你想从 Python 脚本启动一个外部程序，请将程序的文件名传递给 `subprocess.Popen()`。（在 Windows 上，右键点击应用程序的“开始”菜单项并选择“属性”以查看应用程序的文件名。在\
  \ OS X 上，按 CTRL 点击应用程序并选择“显示包内容”以找到执行文件的路径。）`Popen()` 函数将立即返回。请记住，启动的程序并不是在你的 Python\
  \ 程序相同的线程中运行。\n\n![六个正在运行的同一计算器进程](img/httpatomoreillycomsourcenostarchimages2189709.png.jpg)\n\
  \n图 15-1. 六个正在运行的同一计算器进程\n\n在 Windows 计算机上，在交互式 shell 中输入以下：\n\n```\n>>> import\
  \ subprocess\n>>> subprocess.Popen('C:\\\\Windows\\\\System32\\\\calc.exe')\n<subprocess.Popen\
  \ object at 0x0000000003055A58>\n```\n\n在 Ubuntu Linux 上，你输入以下内容：\n\n```\n>>> import\
  \ subprocess\n>>> subprocess.Popen('/usr/bin/gnome-calculator')\n<subprocess.Popen\
  \ object at 0x7f2bcf93b20>\n```\n\n在 OS X 上，过程略有不同。请参考使用默认应用程序打开文件。\n\n返回值是一个 `Popen`\
  \ 对象，它有两个有用的方法：`poll()` 和 `wait()`。\n\n你可以将 `poll()` 方法想象为询问你的朋友她是否已经运行完你交给她的代码。如果在调用\
  \ `poll()` 时进程仍在运行，`poll()` 方法将返回 `None`。如果程序已终止，它将返回进程的整数 `exit code`（退出码）。退出码用于指示进程是在未发生错误的情况下终止的（退出码为\
  \ `0`），还是由于错误导致了进程终止（非零退出码——通常为 `1`，但取决于具体程序）。\n\n`wait()` 方法就像等待你的朋友完成她的代码工作，然后再继续编写你的代码。`wait()`\
  \ 方法会阻塞，直到启动的进程终止。如果你希望你的程序暂停，直到用户完成另一个程序，那么这非常有帮助。`wait()` 的返回值是进程的整数 `exit code`。\n\
  \n在 Windows 上，在交互式 shell 中输入以下内容。注意，`wait()` 调用将阻塞，直到你退出启动的计算器程序。\n\n```\n➊ >>>\
  \ calcProc = subprocess.Popen('c:\\\\Windows\\\\System32\\\\calc.exe')\n➋ >>> calcProc.poll()\
  \ == None\n   True\n➌ >>> calcProc.wait()\n   0\n   >>> calcProc.poll()\n   0\n\
  ```\n\n在这里我们打开了一个计算器进程 ➊。当它仍在运行时，我们检查 `poll()` 是否返回 `None` ➋。它应该是返回的，因为进程仍在运行。然后我们关闭计算器程序并对已终止的进程调用\
  \ `wait()` ➌。`wait()` 和 `poll()` 现在返回 `0`，表示进程在未发生错误的情况下终止。\n\n## 向 Popen() 传递命令行参数\n\
  \n你可以向使用 `Popen()` 创建的进程传递命令行参数。要做到这一点，你需要将一个列表作为 `Popen()` 的唯一参数传递。列表中的第一个字符串将是你想要启动的程序的可执行文件名；所有随其后的字符串都将是程序启动时传递给程序的命令行参数。从效果上看，这个列表将是启动的程序的\
  \ `sys.argv` 的值。\n\n大多数具有图形用户界面（GUI）的应用程序不像基于命令行或基于终端的程序那样频繁地使用命令行参数。但大多数 GUI 应用程序会接受单个文件参数，程序在启动时会立即打开该文件。例如，如果你正在使用\
  \ Windows，创建一个名为 `C:\\hello.txt` 的简单文本文件，然后在交互式 shell 中输入以下：\n\n```\n>>> subprocess.Popen(['C:\\\
  \\Windows\\\\notepad.exe', 'C:\\\\hello.txt'])\n<subprocess.Popen object at 0x00000000032DCEB8>\n\
  ```\n\n这不仅会启动记事本程序，还会使其立即打开 `C:\\hello.txt` 文件。\n\n## 任务计划、launchd 和 cron\n\n如果你精通计算机，可能知道\
  \ Windows 上的任务计划、OS X 上的 `launchd` 或 Linux 上的 `cron` 调度器。这些良好的工具都允许你在特定时间调度应用程序。如果你想了解更多关于它们的信息，可以在*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 上找到教程。使用操作系统的调度器可以让你避免编写自己的检查时间代码。然而，如果你只需要让你的程序短暂暂停，请使用 `time.sleep()` 函数。\n\n\
  ## 使用 Python 打开网站\n\n`webbrowser.open()` 函数可以从你的程序启动网络浏览器并访问特定网站，而不是使用 `subprocess.Popen()`\
  \ 启动浏览器应用程序。更多细节请参考项目：使用 webbrowser 模块 mapit.py。\n\n## 运行其他 Python 脚本\n\n你可以像启动任何应用程序一样从\
  \ Python 启动 Python 脚本。你只需要将 `python.exe` 可执行文件传递给 `Popen()`，并将你想运行的 `.py` 脚本文件名作为其参数。例如，以下代码将运行第\
  \ 1 章：Python 基础 中的 `hello.py` 脚本：\n\n```\n>>> subprocess.Popen(['C:\\\\python34\\\
  \\python.exe', 'hello.py'])\n<subprocess.Popen object at 0x000000000331CF28>\n```\n\
  \n向 `Popen()` 传递一个包含 Python 可执行路径字符串和脚本文件名字符串的列表。如果你启动的脚本需要命令行参数，请将它们添加到脚本文件名之后的列表中。在\
  \ Windows 上，Python 可执行文件的位置是 `C:\\python34\\python.exe`。在 OS X 上，它是 `/Library/Frameworks/Python.framework/Versions/3.3/bin/python3`。在\
  \ Linux 上，它是 `/usr/bin/python3`。\n\n与将 Python 程序作为模块导入不同，当你的 Python 程序启动另一个 Python\
  \ 程序时，两者是在独立的进程中运行的，并且无法共享彼此的变量。\n\n## 使用默认应用程序打开文件\n\n在你的计算机上双击 `.txt` 文件将自动启动与\
  \ `.txt` 扩展名关联的应用程序。你的计算机已经设置好了几个文件扩展名关联。Python 也可以这样通过 `Popen()` 打开文件。\n\n\n\n\n\
  \n每个操作系统都有一个程序可以执行等同于双击文档文件打开它的操作。在 Windows 上，这是 `start` 程序。在 OS X 上，这是 `open` 程序。在\
  \ Ubuntu Linux 上，这是 `see` 程序。在交互式 shell 中输入以下内容，并根据你的系统向 `Popen()` 传递 `'start'`、`'open'`\
  \ 或 `'see'`：\n\n```\n>>> fileObj = open('hello.txt', 'w')\n>>> fileObj.write('Hello\
  \ world!')\n12\n>>> fileObj.close()\n>>> import subprocess\n>>> subprocess.Popen(['start',\
  \ 'hello.txt'], shell=True)\n```\n\n在这里，我们向一个新的 `hello.txt` 文件写入 `Hello world!`。然后我们调用\
  \ `Popen()`，并向它传递一个包含程序名称（在本例中，Windows 下为 `'start'`）和文件名的列表。我们还传递了 `shell=True`\
  \ 关键字参数，这在 Windows 上是。操作系统知道所有的文件关联，并可以判断出应该启动例如 `Notepad.exe` 来处理 `hello.txt` 文件。\n\
  \n在 OS X 上，`open` 程序被用于打开文档文件和程序。如果你使用的是 Mac，请在交互式 shell 中输入以下内容：\n\n```\n>>> subprocess.Popen(['open',\
  \ '/Applications/Calculator.app/'])\n<subprocess.Popen object at 0x10202ff98>\n\
  ```\n\n计算器应用程序应该打开。\n\n# Unix 哲学\n\n设计良好并由其他程序启动的程序比其代码本身更强大。`Unix 哲学` 是 Unix 操作系统程序员（现代\
  \ Linux 和 OS X 基于此构建）建立的一套软件设计原则。它认为，编写小型、用途单一且可以相互操作的程序比编写功能丰富的应用程序更好。较小的程序更容易理解，而且通过相互操作，它们可以成为更强大应用程序的构建模块。\n\
  \n手机 App 也遵循这种方法。如果你的餐厅 App 需要显示前往咖啡馆的路线，开发者并没有通过编写自己的地图代码来重复轮子。餐厅 App 仅启动地图应用并向其传递咖啡馆的地址，就像你的\
  \ Python 代码调用函数并传递参数一样。\n\n你在书中编写的 Python 程序大多符合 Unix 哲学，特别是在一个重要方面：它们使用命令行参数而不是\
  \ `input()` 函数调用。如果你的程序所需的所有信息都可以提前提供，那么将这些信息作为命令行参数传递比等待用户输入要好。这样，命令行参数可以由人类用户输入，也可以由另一个程序提供。这种相互操作的方法会让你的程序可以作为另一个程序的一部分被复用。\n\
  \n唯一的例外是，你不希望密码作为命令行参数传递，因为命令行可能会将其记录为命令历史记录的一部分。相反，当你的程序需要你输入密码时，应该调用 `input()`\
  \ 函数。\n\n你可以在 `[`en.wikipedia.org/wiki/Unix_philosophy/`](https://en.wikipedia.org/wiki/Unix_philosophy/)`\
  \ 了解更多关于 Unix 哲学的知识。\n\n# 项目：简单倒计时程序\n\n就像找到一个简单的秒表应用很难，找到一个简单的倒计时应用可能也很。让我们写一个在倒计时结束时播放闹钟的倒计时程序。\n\
  \n从高层次来说，你的程序将执行以下操作：\n\n* 从 60 开始倒计时。\n* 计时归零时播放声音文件（`alarm.wav`）。\n\n这意味着你的代码需要执行以下操作：\n\
  \n* 在显示倒计时的每个数字之间，通过调用 `time.sleep()` 暂停一秒。\n* 调用 `subprocess.Popen()` 使用默认应用程序打开声音文件。\n\
  \n打开一个新的文件编辑器窗口并将其保存为 `countdown.py`。\n\n## 第 1 ：倒计时\n\n此程序需要 `time` 模块来实现 `time.sleep()`\
  \ 函数，以及 `subprocess` 模块来实现 `subprocess.Popen()` 函数。输入以下代码并将文件保存为 `countdown.py`：\n\
  \n```python\n #! python3\n   # countdown.py - 一个简单的倒计时脚本。\n\n   import time, subprocess\n\
  \n   timeLeft = 60\n   while timeLeft > 0:\n     print(timeLeft, end='')\n     time.sleep(1)\n\
  \     timeLeft = timeLeft - 1\n\n   # TODO: 在倒计时结束时，播放声音文件。\n```\n\n在导入 `time` 和\
  \ `subprocess` 后，创建一个名为 `timeLeft` 的变量来保存倒计时剩余秒数 ➊。它可以从 60 开始——或者你可以在此处更改任何你需要的数值，甚至可以从命令行参数设置它。\n\
  \n在 `while` 循环中，你显示剩余计数 ➋，暂停一秒 ➌，然后在循环重新开始之前递减 `timeLeft` 变量 ➍。只要 `timeLeft` 大于\
  \ `0`，循环就会持续进行。之后，倒计时结束。\n\n## 第 2 步：播放声音文件\n\n虽然有第三方模块可以播放各种格式的声音文件，但快速简单的方法是直接启动用户已经在使用的播放声音文件的任何应用程序。操作系统将根据\
  \ `.wav` 文件扩展名判断应该启动哪个应用程序来播放该文件。这个 `.wav` 文件也可以是其他声音文件格式，例如 `.mp3` 或 `.ogg`。\n\n\
  你可以使用计算机上的任何声音文件在倒计时结束时播放，或者从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载 `alarm.wav`。\n\n将以下内容添加到你的代码：\n\n```python\n#! python3\n# countdown.py - 一个简单的倒计时脚本。\n\
  \nimport time, subprocess\n\n--snip--\n\n# 在倒计时结束时，播放声音文件。\nsubprocess.Popen(['start',\
  \ 'alarm.wav'], shell=True)\n```\n\n在 `while` 循环结束后，`alarm.wav`（或你选择的声音文件）将播放以通知用户倒计时结束。在\
  \ Windows 上，确保在传递给 `Popen()` 的列表中包含 `'start'` 并传递参数 `shell=True`。在 OS X 上，传递 `'open'`\
  \ 代替 `'start'` 并移除 `shell=True`。\n\n与其播放声音文件，你可以在某处保存一个带有 `Break time is over!`\
  \ 消息的文本文件，并使用 `Popen()` 在倒计时结束时打开它。这将有效地弹出一个窗口。或者你可以使用 `webbrowser.open()` 函数在倒计时结束时打开特定的网站。与你在网上找到的一些免费倒计时应用不同，自己的倒计时程序的闹钟可以是任何你想要的\n\
  \n## 类似程序的创意\n\n倒计时是在程序执行之前的简单延迟。这也可以用于其他应用程序和功能，例如：\n\n* 使用 `time.sleep()` 让用户有机会按下\
  \ CTRL-C 取消操作，例如删除文件。你的程序可以打印“按 CTRL-C 取消”，然后用 `try` 和 `except` 语句处理任何 `KeyboardInterrupt`\
  \ 异常。\n* 对于长期倒计时，可以使用 `timedelta` 对象来测量距离未来某个时刻（生日？纪念日？）的天、小时、分钟和秒。\n\n## 总结\n\n\
  Unix 时间元（UTC 1970 年 1 月 1 日午夜）是许多编程语言（包括 Python）的标准参考时间。虽然 `time.time()` 函数返回的是时间戳（即自\
  \ Unix 时间元以来经过的秒数浮点值），但 `datetime` 模块更适合执行日期算术以及格式化或解析包含日期信息的字符串。\n\n`time.sleep()`\
  \ 函数将阻塞（即不返回）指定的秒数。它可以被用于在你的程序中添加暂停。但如果你想调度你的程序在特定时间启动，`[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 上的说明可以告诉你如何使用操作系统已提供的调度器。\n\n\n\n\n\n`threading` 模块用于创建多个线程，这在你需要同时下载多个文件或执行其他任务时非常有用。但请确保线程只读写写局部变量，否则你可能会遇到并发问题。\n\
  \n最后，你的 Python 程序可以使用 `subprocess.Popen()` 函数启动其他应用程序。可以将命令行参数传递给 `Popen()` 调用，以便用该应用程序打开特定的文档。或者，你也可以使用\
  \ `Popen()` 调用 `start`、`open` 或 `see` 程序，利用你计算机的文件关联来自动确定使用哪种应用程序打开文档。通过使用你计算机上的其他应用程序，你的\
  \ Python 程序可以利用它们的功能来满足你的自动化需求。\n\n## 练习题\n\n| Q: | 1\\. 什么是 Unix 纪（Unix epoch）？\
  \ |\n| Q: | 2\\. 哪个函数返回自 Unix 纪以来的秒数？ |\n| Q: | 3\\. 如何让你的程序精确暂停 5 秒？ |\n| Q: |\
  \ 4\\. `round()` 函数返回什么？ |\n| Q: | 5\\. `datetime` 对象和 `timedelta` 对象之间有什么区别？ |\n\
  | Q: | 6\\. 假设你有一个名为 `spam()` 的函数。你如何调用此函数并在单独线程中运行其内部代码？ |\n| Q: | 7\\. 为了避免多线程的并发问题，你应该做什么？\
  \ |\n| Q: | 8\\. 如何让你的 Python 程序运行位于 `C:\\Windows\\System32` 文件夹中的 `calc.exe` 程序？\
  \ |\n\n# 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## 美化后的秒表\n\n扩展本章的秒表项目，使其使用 `rjust()` 和 `ljust()`\
  \ 字符串方法来“美化”输出。（这些方法在第 6 章 中中介绍过。）而不是输出如下所示：\n\n```\nLap #1: 3.56 (3.56)\nLap #2:\
  \ 8.63 (5.07)\nLap #3: 17.68 (9.05)\nLap #4: 19.11 (1.43)\n```\n\n... 输出将看起来像这样：\n\
  \n```\nLap # 1:  3.56 (  3.56)\nLap # 2:  8.63 (  5.07)\nLap # 3: 17.68 (  9.05)\n\
  Lap # 4: 19.11 (  1.43)\n```\n\n注意，你需要将 `lapNum`、`lapTime` 和 `totalTime` 整数和浮点变量转换为字符串版本，以便对它们调用字符串方法。\n\
  \n接下来，使用第 6 章 中引入的 `pyperclip` 模块将输出复制到剪贴板，这样用户就可以快速将输出粘贴到文本文件或电子邮件中了。\n\n## 网络漫画下载器\n\
  \n编写一个程序检查几个网络漫画网站，如果漫画自程序上次访问以来已更新，则自动下载图像。你操作系统的调度程序（Windows 的计划任务、OS X 的 launchd\
  \ 和 Linux 的 cron）可以每天运行一次你的 Python 程序。Python 程序本身可以下载漫画然后将其复制到桌面，以便查找。这将让你无须需要自己检查网站查看是否已更新。（网络漫画列表可以在\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 找到。）\n\n#\
  \ 第 16 章. 发送电子邮件和短信\n\n检查和回复电子邮件是非常耗费时间的工作。当然，你不能只写一个程序来为你处理所有的电子邮件，因为每条消息都需要自己的回复。但一旦你学会了如何编写可以发送和接收电子邮件的程序，你仍然可以自动化许多与电子邮件的任务。\n\
  \n例如，也许你有一张满客户记录的电子表格，并根据每个客户的年龄和位置详情向每个客户发送不同的格式化邮件。商业软件可能无法为你做到；幸运的是，你可以编写自己的程序来发送这些电子邮件，节省大量复制和粘贴格式化邮件的时间。\n\
  \n你还可以编写程序发送电子邮件和短信，以便在你离开电脑时通知你某些事项。如果你正在自动化一个需要花费几个小时才能完成的任务，你不想每隔几分钟就回到电脑前检查程序的状态。相反，程序在完成后只需向你的手机发送短信——让你在离开电脑时能够专注于更重要的事情。\n\
  \n# SMTP\n\n正如 HTTP 是计算机在互联网上发送网页的协议一样，`简单邮件传输协议 (SMTP)` 是用于发送电子邮件的协议。SMTP 规定了电子邮件消息应该如何格式化、加密以及在邮件服务器之间中继，以及你的计算机在点击发送后处理的所有其他细节。不过，你不需要了解这些技术细节，因为\
  \ Python 的 `smtplib` 模块将它们简化为了几个函数。\n\nSMTP 仅负责向他人发送电子邮件。另一个名为 IMAP 的协议处理检索发送给你的电子邮件，并在\
  \ IMAP 中进行了描述。\n\n# 发送电子邮件\n\n你可能熟悉从 Outlook、Thunderbird 或通过 Gmail 或 Yahoo! Mail\
  \ 等网站发送电子邮件。遗憾的是，Python 并没有为你提供像这些服务那样的图形化用户界面。相反，你调用函数来执行 SMTP 的每个主要步骤，如下交互式 shell\
  \ 所示。\n\n## 注意\n\n不要在 IDLE 中输入此示例；它不起作用，因为 [smtp.example.com](http://smtp.example.com)、`bob@example.com`(mailto:bob@example.com)、`MY_SECRET_PASSWORD`\
  \ 和 `alice@example.com`(mailto:alice@example.com) 只是占位符。这段代码只是使用 Python 发送电子邮件过程的概述。\n\
  \n```\n>>> import smtplib\n>>> smtpObj = smtplib.SMTP('smtp.example.com', 587)\n\
  >>> smtpObj.ehlo()\n(250, b'mx.example.com at your service, [216.172.148.131]\\\
  nSIZE 35882577\\\nn8BITMIME\\nSTARTTLS\\nENHANCEDSTATUSCODES\\nCHUNKING')\n>>> smtpObj.starttls()\n\
  (220, b'2.0.0 Ready to start TLS')\n>>> smtpObj.login('bob@example.com', ' MY_SECRET_PASSWORD')\n\
  (235, b'2.7.0 Accepted')\n>>> smtpObj.sendmail('bob@example.com', 'alice@example.com',\
  \ 'Subject: So\nlong.\\nDear Alice, so long and thanks for all the fish. Sincerely,\
  \ Bob')\n{}\n>>> smtpObj.quit()\n(221, b'2.0.0 closing connection ko10sm23097611pbd.52\
  \ - gsmtp')\n```\n\n在接下来的章节中，我们将遍历每个步骤，将占位符替换为你的信息，以连接并登录 SMTP 服务器、发送电子邮件并断开与服务器的连接。\n\
  \n## 连接 SMTP 服务器\n\n如果你曾经设置过 Thunderbird、Outlook 或另一个程序连接到你的电子邮件帐户，你可能熟悉配置 SMTP\
  \ 服务器和端口。这些设置对于每个电子邮件提供商都是不同的，但在网络上搜索 `<your provider> smtp settings` 应该能找到要使用的服务器和端口。\n\
  \nSMTP 服务器的域名通常是你的电子邮件提供商域名的名称，前面带有 `smtp.`。例如，Gmail 的 SMTP 服务器位于 `smtp.gmail.com`。表\
  \ 16-1 列出了一些常见的电子邮件提供商及其 SMTP 服务器。（端口是一个整数值，几乎总是 587，它用于命令加密标准 TLS。）\n\n表 16-1.\
  \ 电子邮件提供商及其 SMTP 服务器\n\n| 提供者 | SMTP 服务器域名 |\n| --- | --- |\n| Gmail | `smtp.gmail.com`\
  \ |\n| Outlook.com/Hotmail.com | `smtp-mail.outlook.com` |\n| Yahoo Mail | `smtp.mail.yahoo.com`\
  \ |\n| AT&T | `smpt.mail.att.net` (port 465) |\n| Comcast | `smtp.comcast.net` |\n\
  | Verizon | `smtp.verizon.net` (port 465) |\n\n一旦你有了电子邮件提供商的域名和端口信息，就可以通过调用 `smptlib.SMTP()`\
  \ 创建一个 `SMTP` 对象，将域名作为字符串参数，并将端口作为整数参数。`SMTP` 对象代表到 SMTP 邮件服务器的连接，并具有发送电子邮件的方法。例如，以下调用创建了连接到\
  \ Gmail 的 `SMTP` 对象：\n\n\n\n\n\n```\n>>> smtpObj = smtplib.SMTP('smtp.gmail.com',\
  \ 587)\n>>> type(smtpObj)\n<class 'smtplib.SMTP'>\n```\n\n输入 `type(smtpObj)` 可以让你看到\
  \ `smtpObj` 中存储了一个 `SMTP` 对象。你需要这个 `SMTP` 对象来调用用于登录和发送邮件的方法。如果 `smtplib.SMTP()`\
  \ 调用未成功，可能是因为你的 SMTP 服务器在 `587` 端口上不支持 TLS。在这种情况下，你将需要使用 `smtplib.SMTP_SSL()` 和端口\
  \ `465` 来创建一个 `SMTP` 对象。\n\n```\n>>> smtpObj = smtplib.SMTP_SSL('smtp.gmail.com',\
  \ 465)\n```\n\n## 注意\n\n`*如果你没有连接到互联网，Python 将抛出 `socket.gaierror: [Errno 11004]\
  \ getaddrinfo failed` 或类似的异常。*`\n\n对于你的程序来说，TLS 和 SSL 的区别并不重要。你只需要知道你的 SMTP 服务器使用哪种加密标准，以便知道如何连接到它。在接后的所有交互式命令行示例中，`smtpObj`\
  \ 变量将包含由 `smtplib.SMTP()` 或 `smtplib.SMTP_SSL()` 函数返回的 `SMTP` 对象。\n\n## 发送 SMTP“你好”消息\n\
  \n一旦你拥有 `SMTP` 对象，就可以调用其命名奇异的 `ehlo()` 方法向 SMTP 邮件服务器“打招呼”。这种问候是 SMTP 的第一步，对于建立与服务器的连接至关重要。你不需要了解这些协议的具体细节。只需在获取\
  \ `SMTP` 对象后立即调用 `ehlo()` 方法，否则后续的方法调用将导致错误。以下是一个 `ehlo()` 调用及其返回值的示例：\n\n```\n\
  >>> smtpObj.ehlo()\n(250, b'mx.google.com at your service, [216.172.148.131]\\nSIZE\
  \ 35882577\\\nn8BITMIME\\nSTARTTLS\\nENHANCEDSTATUSCODES\\nCHUNKING')\n```\n\n如果返回元组中的第一个项是整数\
  \ `250`（SMTP 中的“成功”代码），则表示问候成功。\n\n## 启动 TLS 加密\n\n如果你连接到 SMTP 服务器的 `587` 端口（即你使用\
  \ TLS 加密），接下来需要调用 `starttls()` 方法。此必要步骤将为你的连接启用加密。如果你连接到端口 `465`（使用 SSL），则加密已经设置好，你应该跳过此步骤。\n\
  \n以下是 `starttls()` 方法调用的示例：\n\n```\n>>> smtpObj.starttls()\n(220, b'2.0.0 Ready\
  \ to start TLS')\n```\n\n`starttls()` 将你的 SMTP 连接置于 TLS 模式。返回值中的 `220` 告诉服务器已就绪。\n\
  \n## 登录 SMTP 服务器\n\n一旦建立了到 SMTP 服务器的加密连接，你就可以通过 `login()` 方法使用用户名（通常是你的邮箱地址）和邮件密码登录。\n\
  \n```\n>>> smtpObj.login(' my_email_address@gmail.com ', ' MY_SECRET_PASSWORD ')\n\
  (235, b'2.7.0 Accepted')\n```\n\n### Gmail 应用专用密码\n\nGmail 为 Google 账户提供了一种额外的安全功能，称为*应用程序专用密码*。当你的程序尝试登录时收到\
  \ `Application-specific password required`（需要应用程序专用密码）错误信息，你必须为你的 Python 脚本设置其中一个密码。请查看\
  \ *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)* 资源，获取有关为你的\
  \ Google 账户设置应用程序专用密码的详细说明。\n\n将你的邮箱字符串作为第一个参数，将密码字符串作为第二个参数。返回值中的 `235` 表示身份验证成功。如果密码错误，Python\
  \ 将抛出 `smtplib.SMTPAuthenticationError` 异常。\n\n### 警告\n\n`*小心不要在源代码中放置密码。如果任何人复制了你的程序，他们将获得访问你邮箱账户的权限！最好的做法是调用\
  \ `input()` 让用户输入密码。每次运行程序时都要输入密码可能不方便，但这种方法可以防止你将密码留在电脑的未加密文件中，黑客或笔记本电脑窃贼可以轻易获取它。*`\n\
  \n## 发送邮件\n\n一旦登录到邮件提供商的 SMTP 服务器，你就可以调用 `sendmail()` 方法实际发送邮件。`sendmail()` 方法的调用如下：\n\
  \n```\n>>> smtpObj.sendmail(' my_email_address@gmail.com ', ' recipient@example.com\
  \ ',\n'Subject: So long.\\nDear Alice, so long and thanks for all the fish. Sincerely,\n\
  Bob')\n{}\n```\n\n`sendmail()` 方法需要三个参数：\n\n- 你的邮箱地址（字符串，作为邮件的“发件人”地址）\n- 收件者的邮箱地址（字符串或字符串列表，用于多个收件人，作为“收件人”地址）\n\
  - 邮件正文（字符串）\n\n邮件正文字符串的开头*必须*是 `'Subject: \\n'` 作为邮件主题。`'\\n'` 换行符将主题行与邮件正文分开。\n\
  \n`sendmail()` 的返回值是一个字典。对于每个邮件投送*失败*的收件者，字典中将有一个键值对。空字典意味着所有收件者都*成功*收到了邮件。\n\n\
  ## 断开 SMTP 服务器连接\n\n发送完邮件后，请确保调用 `quit()` 方法。这将断开程序与 SMTP 服务器的连接。\n\n```\n>>> smtpObj.quit()\n\
  (221, b'2.0.0 closing connection ko10sm23097611pbd.52 - gsmtp')\n```\n\n返回值中的 `221`\
  \ 表示会话正在结束。\n\n要查看连接和登录服务器、发送邮件以及断开连接的所有步骤，请参阅 发送邮件。\n\n# IMAP\n\n正如 SMTP 是发送邮件的协议一样，*互联网消息访问协议\
  \ (IMAP)* 规定了如何与邮件提供商的服务器通信，以检索发送到你邮箱地址的邮件。Python 自带 `imaplib` 模块，但实际上第三方模块 `imapclient`\
  \ 更加易用。本章将介绍使用 `IMAPClient` 的方法；完整文档位于 *[`imapclient.readthedocs.org/`](http://imapclient.readthedocs.org/)*。\n\
  \n`imapclient` 模块以一种相当复杂的格式从 IMAP 服务器下载邮件。你可能想将它们从这种格式转换为简单的字符串值。`pyzmail` 模块会为你完成解析这些邮件消息的繁琐工作。你可以在\
  \ PyzMail 的完整文档 *[`www.magiksys.net/pyzmail/`](http://www.magiksys.net/pyzmail/)*\
  \ 中找到它。\n\n `从 Terminal 窗口安装 `imapclient` 和 `pyzmail`。附录 A 提供了如何安装第三方模块的步骤。\n\n\
  # 使用 IMAP 检索和删除邮件\n\n在 Python 中查找和检索邮件是一个多步骤过程，需要同时使用 `imapclient` 和 `pyzmail` 两个第三方模块。为了让你有一个概览，这里有一个完整的示例，演示了如何登录\
  \ IMAP 服务器、搜索邮件、获取邮件，然后从中提取邮件消息的文本。\n\n\n\n\n\n```\n>>> import imapclient\n>>> imapObj\
  \ = imapclient.IMAPClient('imap.gmail.com', ssl=True)\n>>> imapObj.login(' my_email_address@gmail.com\
  \ ', ' MY_SECRET_PASSWORD ')\n'my_email_address@gmail.com Jane Doe authenticated\
  \ (Success)'\n>>> imapObj.select_folder('INBOX', readonly=True)\n>>> UIDs = imapObj.search(['SINCE\
  \ 05-Jul-2014'])\n>>> UIDs\n[40032, 40033, 40034, 40035, 40036, 40037, 40038, 40039,\
  \ 40040, 40041]\n>>> rawMessages = imapObj.fetch([40041], ['BODY[]', 'FLAGS'])\n\
  >>> import pyzmail\n>>> message = pyzmail.PyzMessage.factory(rawMessages[40041]['BODY[]'])\n\
  >>> message.get_subject()\n'Hello!'\n>>> message.get_addresses('from')\n[('Edward\
  \ Snowden', 'esnowden@ns.gov')]\n>>> message.get_addresses('to')\n[(Jane Doe', 'jdoe@example.com')]\n\
  >>> message.get_addresses('cc')\n[]\n>>> message.get_addresses('bcc')\n[]\n>>> message.text_part\
  \ != None\nTrue\n>>> message.text_part.get_payload().decode(message.text_part.charset)\n\
  'Follow the money.\\r\\n\\r\\n-Ed\\r\\n'\n>>> message.html_part != None\nTrue\n\
  >>> message.html_part.get_payload().decode(message.html_part.charset)\n'<div dir=\"\
  ltr\"><div>So long, and thanks for all the fish!<br><br></div>-\nAl<br></div>\\\
  r\\n'\n>>> imapObj.logout()\n```\n\n你不需要记住这些步骤。在我们详细介绍每一个步骤之后，你可以返回此概览来复温记忆。\n\n\
  # 连接到 IMAP 服务器\n\n就像你需要一个 `SMTP` 对象来连接到 SMTP 服务器并发送邮件一样，你需要一个 `IMAPClient` 对象来连接到\
  \ IMAP 服务器并接收邮件。首先，你需要你的邮件提供商的 IMAP 服务器的域名。这与 SMTP 服务器的域名不同。表 16-2] 列出了几个流行邮件提供商的\
  \ IMAP 服务器。\n\n表 16-2. 邮件提供商及其 IMAP 服务器\n\n| 提供商 | IMAP 服务器域名 |\n| --- | --- |\n\
  | Gmail | *imap.gmail.com* |\n| Outlook.com/Hotmail.com | *imap-mail.outlook.com*\
  \ |\n| Yahoo Mail | *imap.mail.yahoo.com* |\n| AT&T | *imap.mail.att.net* |\n| Comcast\
  \ | *imap.comcast.net* |\n| Verizon | *incoming.verizon.net* |\n\n一旦你获得了 IMAP 服务器的域名，就调用\
  \ `imapclient.IMAPClient()` 函数来创建一个 `IMAPClient` 对象。大多数邮件提供商都需要 SSL 加密，因此传递 `ssl=True`\
  \ 关键字参数。在交互式 shell 中输入以下内容（使用你的提供商域名）：\n\n```\n>>> import imapclient\n>>> imapObj\
  \ = imapclient.IMAPClient('imap.gmail.com', ssl=True)\n```\n\n在后续章节的所有交互式 shell\
  \ 示例中，`imapObj` 变量将包含由 `imapclient.IMAPClient()` 函数返回的 `IMAPClient` 对象。在此上下文中，*客户端*是指连接到服务器的对象。\n\
  \n# 登录 IMAP 服务器\n\n一旦你有了 `IMAPClient` 对象，调用它的 `login()` 方法，并将用户名（这通常是你的邮件地址）和密码作为字符串传入。\n\
  \n```\n>>> imapObj.login(' my_email_address@gmail.com ', ' MY_SECRET_PASSWORD ')\n\
  'my_email_address@gmail.com Jane Doe authenticated (Success)'\n```\n\n## 注意\n\n\
  记住，永远不要将密码直接写在代码中！相反，设计你的程序来接受来自 `input()` 返回的密码。\n\n如果 IMAP 服务器拒绝此用户名/密码组合，Python\
  \ 将抛出 `imaplib.error` 异常。对于 Gmail 账户，你可能需要使用应用程序专用密码；更多详情，请参阅 Gmail 的应用程序专用密码。\n\
  \n#\n\n# 搜索邮件\n\n登录后，实际检索你感兴趣的邮件是一个两步过程。首先，你必须选择你想要搜索的文件夹。然后，你必须调用 `IMAPClient`\
  \ 对象的 `search()` 方法，传入一个 IMAP 搜索关键字字符串。\n\n### 选择文件夹\n\n几乎每个账户默认都有一个 `INBOX` 文件夹，但你也可以通过调用\
  \ `IMAPClient` 对象的 `list_folders()` 方法来获取文件夹列表。它返回一个元组列表。每个元组包含关于单个文件夹的信息。继续之前的交互式\
  \ shell 示例，输入以下内容：\n\n```\n>>> import pprint\n>>> pprint.pprint(imapObj.list_folders())\n\
  [(('\\\\HasNoChildren',), '/', 'Drafts'),\n (('\\\\HasNoChildren',), '/', 'Filler'),\n\
  \ (('\\\\HasNoChildren',), '/', 'INBOX'),\n (('\\\\HasNoChildren',), '/', 'Sent'),\n\
  --snip-\n (('\\\\HasNoChildren', '\\\\Flagged'), '/', '[Gmail]/Starred'),\n (('\\\
  \\HasNoChildren', '\\\\Trash'), '/', '[Gmail]/Trash')]\n```\n\n如果你有一个 Gmail 账户，输出可能如下所示。（Gmail\
  \ 将其文件夹称为 *标签*，但它们的工作方式与文件夹相同。）每个元组中的三个值——例如 `(('\\\\HasNoChildren',), '/', 'INBOX')`——如下所示：\n\
  \n*   文件夹标记的元组。（这些标记具体代表什么超出了本书的讨论范围，你可以安全地忽略此字段。）\n*   在名称字符串中用于分隔父文件夹和子文件夹的分隔符。\n\
  *   文件夹的全名。\n\n要选择一个文件夹进行搜索，将文件夹名称作为字符串传递给 `IMAPClient` 对象的 `select_folder()` 方法。\n\
  \n```\n>>> imapObj.select_folder('INBOX', readonly=True)\n```\n\n你可以忽略 `select_folder()`\
  \ 的返回值。如果选择文件夹不存在，Python 将抛出 `imaplib.error` 异常。\n\n`readonly=True` 关键字参数防止你在随后的方法调用期间意外对此文件夹中的任何邮件进行更改或删除。除非你*想要*删除邮件，否则始终将\
  \ `readonly` 设置为 `True` 是一个好主意。\n\n### 执行搜索\n\n选择文件夹后，你现在可以使用 `IMAPClient` 对象的 `search()`\
  \ 方法搜索邮件。`search()` 的参数是一个字符串列表，每个字符串格式都符合 IMAP 的搜索密钥。表 16-3]。\n\n表 16-3. IMAP 搜索密钥\n\
  \n| 搜索密钥 | 含义 |\n| --- | --- |\n| `'ALL'` | 返回文件夹中的所有消息。如果你在大型文件夹中请求所有消息，可能会遇到 `imaplib`\
  \ 的大小限制。参见大小限制。 |\n| `'BEFORE` *date'`*, `'ON` *date'`*, `'SINCE` *date'`* | 这三个搜索密钥分别返回在指定\
  \ *date* 之前、当天或之后到达 IMAP 服务器的消息。日期格式必须为 `05-Jul-2015`。此外，`'SINCE 05-Jul-2015'` 将匹配\
  \ 7 月 5 日及之后的邮件，而 `'BEFORE 05-Jul-2015'` 将仅匹配 7 月 5 日之前的邮件，但不包含 7 月 5 日。 |\n| `'SUBJECT`\
  \ *string'`*, `'BODY` *string'`*, `'TEXT` *string'`* | 返回 *string* 出现在主题、正文或两者中的邮件。如果\
  \ *string* 包含空格，请用双引号括起来：`'TEXT \"search with spaces\"'`。 |\n| `'FROM` *string'`*,\
  \ `'TO` *string'`*, `'CC` *string'`*, `'BCC` *string'`* | 分别返回 *string* 出现在发件地址、收件地址、抄送（cc）地址或密送（bcc）地址中的所有邮件。如果\
  \ *string* 中有多个邮件地址，请用空格分隔并将全部用双引号括起来：`'CC \"firstcc@example.com secondcc@example.com\"\
  '`*。 |\n| `'SEEN'`, `'UNSEEN'` | 分别返回带有不带 *Seen* 标记的消息。如果邮件通过 `fetch()` 方法调用（后文描述）访问过，或者当你在邮件程序或网络浏览器中检查邮件并点击时，它就会获得\
  \ *Seen* 标记。人们通常更习惯说邮件“已读”而不是“已查看”，但它们的意思相同。 |\n| `'ANSWERED'`, `'UNANSWERED'` |\
  \ 分别返回带有不带 *Answered* 标记的消息。消息在回复时会获得 *Answered* 标记。 |\n\n\n\n\n\n| `'DELETED'`,\
  \ `'UNDELETED'` | 分别返回带有和不带 `Deleted` 标记的所有邮件。使用 `delete_messages()` 方法删除的邮件会被赋予\
  \ `Deleted` 标记，但在调用 `expunge()` 方法之前，它们不会被永久删除（参见删除邮件）。 | |\n| `'DRAFT'`, `'UNDRAFT'`\
  \ | 分别返回带有和不带 `Draft` 标记的所有邮件。草稿邮件通常保留在独立的 `Drafts` 文件夹中，而不是 `INBOX` 文件夹中。 |\n|\
  \ `'FLAGGED'`, `'UNFLAGGED'` | 分别返回带有和不带 `Flagged` 标记的所有邮件。该标记通常用于将邮件标记为“重要”或“紧急”。\
  \ |\n| `'LARGER N'`, `'SMALLER N'` | 分别返回大于 `N` 字节或小于 `N` 字节的所有邮件。 |\n| `'NOT search-key'`\
  \ | 返回 `search-key` **不**会返回的邮件。 |\n| `'OR search-key1 search-key2'` | 返回匹配*第一个*或*第二个*\
  \ `search-key` 的邮件。 |\n\n注意，某些 IMAP 服务器在处理标记和搜索键方面的实现可能略有不同。你可能需要在交互式 shell 中进行一些实验，以查看它们的具体行为。\n\
  \n你可以向 `search()` 方法的列表参数中传递多个 IMAP 搜索键字符串。返回的邮件是匹配*所有*搜索键的邮件。如果你想匹配*任何一个*搜索键，请使用\
  \ `OR` 搜索键。对于 `NOT` 和 `OR` 搜索键，分别在 `NOT` 和 `OR` 之后紧跟一个和两个完整的搜索键。\n\n以下是一些 `search()`\
  \ 方法调用的示例及其含义：\n\n* `imapObj.search(['ALL'])`。返回当前选择文件夹中的所有邮件。\n* `imapObj.search(['ON\
  \ 05-Jul-2015'])`。返回 2015 年 7 月 5 日发送的所有邮件。\n* `imapObj.search(['SINCE 01-Jan-2015',\
  \ 'BEFORE 01-Feb-2015', 'UNSEEN'])`。返回 2015 年 1 月发送的所有未读邮件。（注意，这意味着*从* 1 月 1 日*及以后*，一直到*但不包括*\
  \ 2 月 1 日。）\n* `imapObj.search(['SINCE 01-Jan-2015', 'FROM alice@example.com'])`。返回自\
  \ 2015 年初以来来自 `alice@example.com` 的所有邮件。\n* `imapObj.search(['SINCE 01-Jan-2015',\
  \ 'NOT FROM alice@example.com'])`。返回 2015 年初以来除 `alice@example.com` 之外的所有人的发送邮件。\n\
  * `imapObj.search(['OR FROM alice@example.com FROM bob@example.com'])`。返回曾经从 `alice@example.com`\
  \ 或 `bob@example.com` 发送的所有邮件。\n* `imapObj.search(['FROM alice@example.com', 'FROM\
  \ bob@example.com'])`。陷阱示例！此搜索将永远不会返回任何邮件，因为邮件必须匹配*所有*搜索关键词。由于只能有一个“发件人”地址，一封邮件就不可能同时来自\
  \ `alice@example.com` 和 `bob@example.com`。\n\n`search()` 方法并不返回邮件本身，而是返回邮件的唯一标识（UID），格式为整数值。然后你可以将这些\
  \ UIDs 传递给 `fetch()` 方法以获取邮件内容。\n\n通过输入以下内容继续交互式 shell 示例\n\n```\n>>> UIDs = imapObj.search(['SINCE\
  \ 05-Jul-2015'])\n>>> UIDs\n[40032, 40033, 40034, 40035, 40036, 40037, 40038, 40039,\
  \ 40040, 40041]\n```\n\n在这里，`search()` 返回的邮件 ID 列表（针对 7 月 5 日之后收到的邮件）存储在 `UIDs`\
  \ 中。你计算机上返回的 UID 列表与此处显示的不同；它们对于特定的邮件账户是唯一的。当你之后将 UIDs 传递给其他函数调用时，请使用你收到的 UID 值，而不是书中示例中打印的值。\n\
  \n### 大小限制\n\n如果你的搜索匹配了大量邮件，Python 可能会抛出异常 `imaplib.error: got more than 10000 bytes`。发生这种情况时，你必须断开并重新连接到\
  \ IMAP 服务器重试。\n\n设置此限制是为了防止你的 Python 程序占用过多内存。遗憾的是，默认限制通常太小。你可以通过运行以下代码将此限制从 10,000\
  \ 字节更改为 10,000,000 字节：\n\n```\n>>> import imaplib\n>>> imaplib._MAXLINE = 10000000\n\
  ```\n\n这应该防止该错误信息再次出现。你可能希望将这两行作为你写的每个 IMAP 程序的一部分。\n\n### 使用 Imapclient 的 Gmail_Search()\
  \ 方法\n\n如果你登录 `imap.gmail.com` 服务器以访问 Gmail 账户，`IMAPClient` 对象提供了一个额外的搜索函数，模拟 Gmail\
  \ 网页版顶部的搜索栏，如图 16-1 所示。\n\n![Gmail 网页顶部的搜索栏](img/httpatomoreillycomsourcenostarchimages2189711.png.jpg)\n\
  \n图 16-1. Gmail 网页顶部的搜索栏\n\n注意，某些 IMAP 服务器在处理标记和搜索键方面的实现可能略有不同。你可能需要在交互式 shell 中进行一些实验，以查看它们的具体行为。\n\
  \n你可以向 `search()` 方法的列表参数中传递多个 IMAP 搜索键字符串。返回的邮件是匹配*所有*搜索键的邮件。如果你想匹配*任何一个*搜索键，请使用\
  \ `OR` 搜索键。对于 `NOT` 和 `OR` 搜索键，分别在 `NOT` 和 `OR` 之后紧跟一个和两个完整的搜索键。\n\n以下是一些 `search()`\
  \ 方法调用的示例及其含义：\n\n* `imapObj.search(['ALL'])`。返回当前选择文件夹中的所有邮件。\n* `imapObj.search(['ON\
  \ 05-Jul-2015'])`。返回 2015 年 7 月 5 日发送的所有邮件。\n* `imapObj.search(['SINCE 01-Jan-2015',\
  \ 'BEFORE 01-Feb-2015', 'UNSEEN'])`。返回 2015 年 1 月发送的所有未读邮件。（注意，这意味着*从* 1 月 1 日*及以后*，一直到*但不包括*\
  \ 2 月 1 日。）\n* `imapObj.search(['SINCE 01-Jan-2015', 'FROM alice@example.com'])`。返回自\
  \ 2015 年初以来来自 `alice@example.com` 的所有邮件。\n* `imapObj.search(['SINCE 01-Jan-2015',\
  \ 'NOT FROM alice@example.com'])`。返回 2015 年初以来除 `alice@example.com` 之外的所有人的发送邮件。\n\
  * `imapObj.search(['OR FROM alice@example.com FROM bob@example.com'])`。返回曾经从 `alice@example.com`\
  \ 或 `bob@example.com` 发送的所有邮件。\n* `imapObj.search(['FROM alice@example.com', 'FROM\
  \ bob@example.com'])`。陷阱示例！此搜索将永远不会返回任何邮件，因为邮件必须匹配*所有*搜索关键词。由于只能有一个“发件人”地址，一封邮件就不可能同时来自\
  \ `alice@example.com` 和 `bob@example.com`。\n\n`search()` 方法并不返回邮件本身，而是返回邮件的唯一标识（UID），格式为整数值。然后你可以将这些\
  \ UIDs 传递给 `fetch()` 方法以获取邮件内容。\n\n通过输入以下内容继续交互式 shell 示例\n\n```\n>>> UIDs = imapObj.search(['SINCE\
  \ 05-Jul-2015'])\n>>> UIDs\n[40032, 40033, 40034, 40035, 40036, 40037, 40038, 40039,\
  \ 40040, 40041]\n```\n\n在这里，`search()` 返回的邮件 ID 列表（针对 7 月 5 日之后收到的邮件）存储在 `UIDs`\
  \ 中。你计算机上返回的 UID 列表与此处显示的不同；它们对于特定的邮件账户是唯一的。当你之后将 UIDs 传递给其他函数调用时，请使用你收到的 UID 值，而不是书中示例中打印的值。\n\
  \n### 获取邮件并标记为已读\n\n一旦你有一组 UIDs，你就可以调用 `IMAPClient` 对象的 `fetch()` 方法来获取内容。\n\nUID\
  \ 列表将是 `fetch()` 的第一个参数。第二个参数应该是 `['BODY[]']`，这告诉 `fetch()` 下载所有的主体内容。\n\n让我们继续交互式\
  \ shell 示例\n\n```\n>>> rawMessages = imapObj.fetch(UIDs, ['BODY[]'])\n>>> import\
  \ pprint\n>>> pprint.pprint(rawMessages)\n{40040: {'BODY[]': 'Delivered-To: my_email_address@gmail.com\\\
  r\\n'\n                   'Received: by 10.76.71.167 with SMTP id '\n--snip--\n\
  \                   '\\r\\n'\n                   '------=_Part_6000970_707736290.1404819487066--\\\
  r\\n',\n         'SEQ': 5430}}\n```\n\n导入 `pprint` 并将 `fetch()` 的返回值（存储在变量 `rawMessages`\
  \ 中）传递给 `pprint.pprint()` 进行“美化打印”，你会发现这个返回值是一个以 UID 为键的嵌套字典。每封邮件都存储为具有两个键的字典：`'BODY[]'`\
  \ 和 `'SEQ'`。`'BODY[]'` 键映射到邮件的正文。\n\n如你所示，`'BODY[]'` 键中的邮件内容非常难以理解。它采用一种名为 RFC 822\
  \ 的格式，该格式是为 IMAP 服务器设计的。但你不需要理解 RFC 822 格式；在本章后面的内容，`pyzmail` 模块会为你解析它。\n\n\n\n\n\
  \n当你选择一个文件夹进行搜索时，你带有 `readonly=True` 关键字参数调用了 `select_folder()`。这样做可以防止你意外删除邮件——但也意味着如果你使用\
  \ `fetch()` 方法获取邮件，这些邮件不会被标记为已读。如果你*想要*在获取邮件时将它们标记为已读，则需要向 `select_folder()` 传递\
  \ `readonly=False`。如果所选文件夹已处于只读模式，你可以再次调用 `select_folder()` 来重新选择当前文件夹，这次使用 `readonly=False`\
  \ 关键字参数：\n\n```\n>>> imapObj.select_folder('INBOX', readonly=False)\n```\n\n## 从原始消息中获取邮箱地址\n\
  \n`fetch()` 方法返回的原始消息对于只想阅读邮件的人来说仍然并不用。`pyzmail` 模块解析这些原始消息并将它们作为 `PyzMessage` 对象返回，这使得你的\
  \ Python 代码可以轻松访问邮件的主题、正文、“收件人”（To）字段、“发件人”（From）字段以及邮件的其他部分。\n\n使用以下内容继续交互式 shell\
  \ 示例（使用你自己的邮箱账户 UID，而不是这里显示的这些）：\n\n```\n>>> import pyzmail\n>>> message = pyzmail.PyzMessage.factory(rawMessages[40041]['BODY[]'])\n\
  ```\n\n首先，导入 `pyzmail`。然后，要创建一个邮件的 `PyzMessage` 对象，调用 `pyzmail.PyzMessage.factory()`\
  \ 函数并将原始消息的 `'BODY[]'` 部分传递给它。将结果存储在 `message` 中。现在 `message` 包含一个 `PyzMessage`\
  \ 对象，它有多个方法可以轻松获取邮件的主题以及所有的发件人和收件人地址。`get_subject()` 方法以简单字符串的形式返回主题。`get_addresses()`\
  \ 方法返回你传递给它的字段的地址列表。例如，方法调用可能如下：\n\n```\n>>> message.get_subject()\n'Hello!'\n>>>\
  \ message.get_addresses('from')\n[('Edward Snowden', 'esnowden@nsa.gov')]\n>>> message.get_addresses('to')\n\
  [(Jane Doe', 'my_email_address@gmail.com')]\n>>> message.get_addresses('cc')\n[]\n\
  >>> message.get_addresses('bcc')\n[]\n```\n\n注意 `get_addresses()` 的参数是 `'from'`、`'to'`、`'cc'`\
  \ 或 `'bcc'`。`get_addresses()` 的返回值元组列表。每个元组包含两个字符串：第一个与邮箱地址相关的名称，第二个是邮箱地址本身。如果请求的字段没有地址，`get_addresses()`\
  \ 将返回空列表。在这里，`'cc'` 抄送字段和 `'bcc'` 密送字段都不包含地址，因此都返回了空列表。\n\n## 从原始消息中获取正文\n\n邮件可以以纯文本、HTML\
  \ 或两者都有的形式发送。纯文本邮件只包含文本，而 HTML 邮件可以具有颜色、字体、图像和其他让邮件内容看起来像小型网页的特征。如果邮件仅为文本，则其 `PyzMessage`\
  \ 对象的 `html_part` 属性将设置为 `None`。同样，如果邮件仅为 HTML，则其 `PyzMessage` 对象的 `text_part` 属性将设置为\
  \ `None`。\n\n否则，`text_part` 或 `html_part` 值将有一个 `get_payload()` 方法，该方法以 `bytes`\
  \ 数据类型的值返回邮件正文。（`bytes` 数据类型超出了本书的范围。）但这*仍然*不是一个我们可以直接使用的字符串值。唉！最后一步是对 `get_payload()`\
  \ 返回的字节值调用 `decode()` 方法。`decode()` 方法接受一个参数：消息的字符编码，存储在 `text_part.charset` 或 `html_part.charset`\
  \ 属性中。这最终将返回邮件正文的字符串。\n\n输入以下内容继续交互式 shell 示例：\n\n```\n➊ >>> message.text_part !=\
  \ None\n   True\n   >>> message.text_part.get_payload().decode(message.text_part.charset)\n\
  ➋ 'So long, and thanks for all the fish!\\r\\n\\r\\n-Al\\r\\n'\n➌ >>> message.html_part\
  \ != None\n   True\n➍ >>> message.html_part.get_payload().decode(message.html_part.charset)\n\
  \   '<div dir=\"ltr\"><div>So long, and thanks for all the fish!<br><br></div>-Al\n\
  \   <br></div>\\r\\n'\n```\n\n我们正在处理的邮件包含纯文本和 HTML 内容，因此存储在 `message` 中的 `PyzMessage`\
  \ 对象的 `text_part` 和 `html_part` 属性不等于 `None` ➊ ➌。对消息的 `text_part` 调用 `get_payload()`，然后对字节值调用\
  \ `decode()`，返回邮件文本版本的字符串 ➋。对消息的 `html_part` 使用 `get_payload()` 和 `decode()` 返回邮件\
  \ HTML 版本的字符串 ➍。\n\n 删除邮件\n\n要删除邮件，将消息 UID 列表传递给 `IMAPClient` 对象的 `delete_messages()`\
  \ 方法。这将邮件标记为 `Deleted` 标记。调用 `expunge()` 方法将永久删除所有带有 `Deleted` 标记的邮件。注意，某些邮件提供商（如\
  \ Gmail）会自动删除标记的消息，而不是等待 expunge 命令。考虑以下交互式示例：\n\n```\n➊ >>> imapObj.select_folder('INBOX',\
  \ readonly=False)\n➋ >>> UIDs = imapObj.search(['ON 09-Jul-2015'])\n   >>> imapObj.delete_messages(UIDs)\n\
  ➌ {40066: ('Seen', '\\\\Deleted')}\n   >>> imapObj.expunge()\n   ('Success', [(5452,\
  \ '\\\\Deleted')])\n```\n\n## 断开 IMAP 服务器连接\n\n当你的程序完成检索或删除邮件后，只需调用 `IMAPClient`\
  \ 的 `logout()` 方法即可与 IMAP 服务器断开连接。\n\n```\n>>> imapObj.logout()\n```\n\n如果你的程序运行几分钟更久，可能会超时。\n\
  \n呼！就是这些。虽然有很多步骤需要完成，但你现在有了一种方法让你的 Python 程序登录邮箱账户并获取邮件。每当你需要记住所有步骤时，都可以随时查阅使用 IMAP\
  \ 获取和删除邮件 中的概览。\n\n# 项目：发送会员会费提醒邮件\n\n假设你被“自愿”为“强制性义务服务俱乐部”负责跟踪会员会费缴纳。这是一份非常无聊的工作，涉及维护一份每月每月缴费情况的电子表格，并向那些未缴费的人发送提醒邮件。与其自己遍历表格并为每个欠费的人复制粘贴相同的邮件，不如让我们——你猜对了——写一个脚本来为你完成这些工作。\n\
  \n从高层次来说，你的程序将执行以下操作：\n\n*   从 Excel 电子表格中读取数据。\n*   找到最近一个月未缴会的会员。\n*   找到他们的邮箱地址并向他们发送个性化的提醒。\n\
  \n这意味着你的代码需要执行以下操作：\n\n*   使用 `openpyxl` 模块打开并读取 Excel 文档的单元格。（查看第 12 章了解如何处理 Excel\
  \ 文件。）\n\n\n\n\n*   创建一个字典，其中包含所有未交会费的成员。\n*   通过调用 `smtplib.SMTP()`、`ehlo()`、`starttls()`\
  \ 和 `login()` 登录 SMTP 服务器。\n*   对于所有未交会费的成员，调用 `sendmail()` 方法发送一封个性化的提醒邮件。\n\n\
  打开一个新的文件编辑器窗口并将其保存为 `sendDuesReminders.py`。\n\n## 第 1 ：打开 Excel 文件\n\n假设你用于跟踪成员会费支付情况的\
  \ Excel 表格如图 16-2，并且位于名为 `duesRecords.xlsx` 的文件中。你可以从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载此文件。\n\n![追踪成员会费支付的表格](img/httpatomoreillycomsourcenostarchimages2189713.png.jpg)\n\
  \n图 16-2. 追踪成员会费支付的表格\n\n该表格包含每个成员的姓名和邮箱地址。每个月都有一列用于跟踪成员的支付状态。一旦成员缴纳了会费，该成员对应的单元格就会被标记为文本\
  \ `paid`。\n\n程序必须打开 `duesRecords.xlsx`，并通过调用 `get_highest_column()` 方法确定最新月份的列。（你可以查阅第\
  \ 12 章以获取更多关于使用 `openpyxl` 模块访问 Excel 表格文件单元格的详细信息。）在文件编辑器窗口中输入以下代码：\n\n```\n #!\
  \ python3\n   # sendDuesReminders.py - 根据表格中的支付状态发送邮件。\n\n   import openpyxl, smtplib,\
  \ sys\n\n   # 打开表格并获取最新的会费状态。\n➊ wb = openpyxl.load_workbook('duesRecords.xlsx')\n\
  ➋ sheet = wb.get_sheet_by_name('Sheet1')\n\n➌ lastCol = sheet.get_highest_column()\n\
  ➍ latestMonth = sheet.cell(row=1, column=lastCol).value\n\n   # TODO: 每个成员的支付状态。\n\
  \n   # TODO: 登录邮箱账户。\n\n   # TODO: 发送提醒邮件。\n```\n\n在导入 `openpyxl`、`smtplib` 和 `sys`\
  \ 模块后，我们打开 `duesRecords.xlsx` 文件，并将生成的 `Workbook` 对象存储在 `wb` ➊。然后我们获取 Sheet 1，并将生成的\
  \ `Worksheet` 对象存储在 `sheet` ➋。现在我们有了一个 `Worksheet` 对象，可以访问行、列和单元格了。我们将最高列数存储在 `lastCol`\
  \ ➌，然后使用行号 1 和 `lastCol` 访问本应包含最新月份的单元格。我们获取该单元格的值并将其存储在 `latestMonth` ➍。\n\n##\
  \ 第 2 ：找到所有未缴费的成员\n\n一旦你确定了最新月份的列号（存储在 `lastCol` 中），你就可以遍历第一行（包含列标题的行）之后的所有行，以查看哪些成员在该月份的会费单元格中具有文本\
  \ `paid`。如果成员未缴费，你可以分别从第 1 列和第 2 列获取成员的姓名和邮箱地址。这些信息将进入 `unpaidMembers` 字典，该字典将跟踪所有在最近一个月未缴费的成员。将以下代码添加到\
  \ `sendDuesReminder.py` 中。\n\n```\n #! python3\n   # sendDuesReminders.py - 根据表格中的支付状态发送邮件。\n\
  \n   --snip--\n\n   # 每个成员的支付状态。\n   unpaidMembers = {}\n➊ for r in range(2, sheet.get_highest_row()\
  \ + 1):\n➋     payment = sheet.cell(row=r, column=lastCol).value\n       if payment\
  \ != 'paid':\n➌         name = sheet.cell(row=r, column=1).value\n➍         email\
  \ = sheet.cell(row=r, column=2).value\n➎         unpaidMembers[name] = email\n```\n\
  \n这段代码设置了一个空字典 `unpaidMembers`，然后遍历第一行之后的所有行 ➊。对于每一行，最新列的值被存储在 `payment` ➋ 中。如果\
  \ `payment` 不等于 `'paid'`，则第一列的值存储在 `name` ➌，第二列的值存储在 `email` ➍，并且 `name` 和 `email`\
  \ 被添加到 `unpaidMembers` ➎。\n\n## 第 3 ：发送个性化邮件提醒\n\n一旦你拥有了所有未缴费成员的列表，就是时候向他们发送提醒邮件了。将以下代码添加到你的程序中，但要替换真实的邮箱地址和提供商信息：\n\
  \n```\n#! python3\n# sendDuesReminders.py - 根据表格中的支付状态发送邮件。\n\n--snip--\n\n# 登录邮箱账户。\n\
  smtpObj = smtplib.SMTP('smtp.gmail.com', 587)\nsmtpObj.ehlo()\nsmtpObj.starttls()\n\
  smtpObj.login(' my_email_address@gmail.com ', sys.argv[1])\n```\n\n通过调用 `smtplib.SMTP()`\
  \ 创建 `SMTP` 对象，并传入你提供商的域名和端口。调用 `ehlo()` 和 `starttls()`，然后调用 `login()` 并传入你的邮箱地址和\
  \ `sys.argv[1]`（后者将存储你的密码字符串）。你每次运行程序时都会作为命令行参数输入密码，以避免将密码保存在源代码中。\n\n一旦你的程序登录了邮箱账户，它应该遍历\
  \ `unpaidMembers` 字典，并向每个成员的邮箱地址发送一封个性化的邮件。将以下内容添加到 `sendDuesReminders.py`：\n\n\
  ```\n #! python3\n   # sendDuesReminders.py - 根据表格中的支付状态发送邮件。\n\n   --snip--\n\n\
  \   # 发送提醒邮件。\n   for name, email in unpaidMembers.items():\n➊     body = \"Subject:\
  \ %s dues unpaid.\\nDear %s,\\nRecords show that you have not\n   paid dues for\
  \ %s. Please make this payment as soon as possible. Thank you!'\" %\n   (latestMonth,\
  \ name, latestMonth)\n➋     print('Sending email to %s...' % email)\n➌     sendmailStatus\
  \ = smtpObj.sendmail('my_email_address@gmail.com', email, body)\n\n➍     if sendmailStatus\
  \ != {}:\n           print('There was a problem sending email to %s: %s' % (email,\n\
  \           sendmailStatus))\n   smtpObj.quit()\n```\n\n这段代码遍历 `unpaidMembers` 中的姓名和邮箱。对于每个未缴费的成员，我们根据最新月份和姓名自定义了一条消息，并将其存储在\
  \ `body` 中 ➊。我们输出正在向该邮箱发送邮件 ➋。然后调用 `sendmail()`，传入发件人邮箱和自定义的消息 ➌。我们将返回值存储在 `sendmailStatus`。\n\
  \n记住，如果 SMTP 服务器在发送特定邮件时报错，`sendmail()` 将返回一个非空字典。`for` 循环的最后部分 ➍ 检查返回的字典是否为空，如果是，则打印对方邮箱和返回的字典。\n\
  \n在程序完成所有邮件发送后，调用 `quit()` 方法断 SMTP 服务器。\n\n当你运行程序时，输出如下：\n\n```\nSending email\
  \ to alice@example.com...\nSending email to bob@example.com...\nSending email to\
  \ eve@example.com...\n```\n\n收件者将收到一封如图 16-3 所示的邮件。\n\n# 使用 Twilio 发送短信\n\n大多数人靠近手机的可能性比靠近电脑大，因此发送短信可能是比邮件发送通知更及时、更可靠的方式。此外，短信的短小使得人们更有可能去阅读它们。\n\
  \n\n\n\n在本节中，你将学习如何注册免费的 Twilio 服务，并使用其 Python 模块发送短信。Twilio 是一个*短信网关服务*，这意味着它是一种允许你从程序中发送短信的服务。虽然你每月可以发送的短信数量有限制，且短信开头会有*发送自\
  \ Twilio 试用账户*的字样，但此试用服务可能足够你的个人程序使用。免费试用是无限期的；你以后不需要升级到付费方案。\n\nTwilio 并不是唯一的短信网关服务。如果你不想使用\
  \ Twilio，可以在网上搜索*免费短信网关*、*python 短信 api* 甚至 *twilio 替代方案*来寻找其他备用服务。\n\n在注册 Twilio\
  \ 账户之前，请安装 `twilio` 模块。附录 A 提供了关于安装第三方模块的更多细节。\n\n## 注意\n\n本节专门针对美国。Twilio 确实为美国以外的国家提供短信服务，但这些具体细节未在书中涵盖。不过，`twilio`\
  \ 模块及其函数在美国境外的工作方式是相同的。更多信息请参阅 [`twilio.com/`](http://twilio.com/)。\n\n## 注册 Twilio\
  \ 账户\n\n访问 [`twilio.com/`](http://twilio.com/) 并填写注册表单。一旦注册了新账户，你就需要验证一个你想要发送短信的手机号码。（这种验证是为了防止人们利用该服务向随机电话号码发送垃圾短信。）\n\
  \n在收到带有验证码的短信后，将其输入 Twilio 网站以证明你拥有正在验证的手机手机。现在，你已经可以使用 `twilio` 模块向该手机号码发送短信了。\n\
  \nTwilio 为你的试用账户提供一个电话号码作为短信的发送者。你还需要另外两个信息：你的账户 SID 和 auth（认证）令牌。在你登录 Twilio 账户后，可以在\
  \ Dashboard（控制面板）页面找到这些信息。当从 Python 程序登录时，这些值将作为你的 Twilio 用户名和密码。\n\n## 发送短信\n\n\
  一旦你安装了 `twilio` 模块、注册了 Twilio 账户、验证了手机号码、注册了 Twilio 号码并获取了账户 SID 和 auth 令牌，你终于准备好从你的\
  \ Python 脚本给自己发送短信了。\n\n与所有的注册步骤相比，实际的 Python 代码相当简单。在电脑连接互联网的情况下，在交互式 shell 中输入以下内容，并将\
  \ `accountSID`、`authToken`、`myTwilioNumber` 和 `myCellPhone` 变量值替换为真实信息：\n\n```\n\
  ➊ >>> from twilio.rest import TwilioRestClient\n   >>> accountSID = 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n\
  \   >>> authToken = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n➋ >>> twilioCli = TwilioRestClient(accountSID,\
  \ authToken)\n   >>> myTwilioNumber = '+14955551234'\n   >>> myCellPhone = '+14955558888'\n\
  ➌ >>> message = twilioCli.messages.create(body='Mr. Watson - Come here - I want\n\
  \   to see you.', from_=myTwilioNumber, to=myCellPhone)\n```\n\n输入最后一行几秒后，你应该收到一条内容为*Sent\
  \ from your Twilio trial account - Mr. Watson - Come here - I want to see you* 的短信。\n\
  \n由于 `twilio` 模块设置设置，你需要使用 `from twilio.rest import TwilioRestClient` 来导入它，而不仅仅是\
  \ `import twilio` ➊。将你的账户 SID 存储在 `accountSID` 中，将 auth 令牌存储在 `authToken` 中，然后调用\
  \ `TwilioRestClient()` 并传递 `accountSID` 和 `authToken`。调用 `TwilioRestClient()` 返回一个\
  \ `TwilioRestClient` 对象 ➋。该对象有一个 `messages` 属性，该属性又有一个你可以用于发送短信的 `create()` 方法。该方法将指示\
  \ Twilio 的服务器发送你的短信。在将你的 Twilio 号码和手机号分别存储在 `myTwilioNumber` 和 `myCellPhone` 后，调用\
  \ `create()` 并传递关键字参数，指定短信正文、发送者号码（`myTwilioNumber`）和接收者号码（`myCellPhone`） ➌。\n\n\
  `create()` 方法返回的 `Message` 对象将包含有关已发送短信的信息。通过输入以下内容继续交互式 shell 示例：\n\n```\n>>> message.to\n\
  '+14955558888'\n>>> message.from_\n'+14955551234'\n>>> message.body\n'Mr. Watson\
  \ - Come here - I want to see you.'\n```\n\n`to`、`from_` 和 `body` 属性分别持有你的手机号、Twilio\
  \ 号码和消息。注意，发送手机号码在 `from_` 属性中——末尾有一个下划线——而不是 `from`。这是因为 `from` 是 Python 中的关键字（例如，你曾在\
  \ `from modulename import *` 形式的 `import` 语句中见过它），所以它不能作为属性名。使用以下内容继续交互式 shell 示例：\n\
  \n```\n>>> message.status\n'queued'\n>>> message.date_created\ndatetime.datetime(2015,\
  \ 7, 8, 1, 36, 18)\n>>> message.date_sent == None\nTrue\n```\n\n`status` 属性应该给你一个字符串。如果消息已创建并发送，`date_created`\
  \ 和 `date_sent` 属性应该给你一个 `datetime` 对象。当你已经收到短信时，`status` 属性被设为 `'queued'` 且 `date_sent`\
  \ 属性被设置为 `None`，这似乎很奇怪。这是因为你在短信实际发送*之前*在 `message` 变量中捕获了 `Message` 对象。你需要重新获取 `Message`\
  \ 对象以查看其最新的 `status` 和 `date_sent`。每个 Twilio 消息都有一个唯一的字符串 ID (SID)，可以用它获取 `Message`\
  \ 对象的最新更新。通过输入以下内容继续交互式 shell 示例：\n\n```\n >>> message.sid\n   'SM09520de7639ba3af137c6fcb7c5f4b51'\n\
  ➊ >>> updatedMessage = twilioCli.messages.get(message.sid)\n   >>> updatedMessage.status\n\
  \   'delivered'\n   >>> updatedMessage.date_sent\n   datetime.datetime(2015, 7,\
  \ 8, 1, 36, 18)\n```\n\n输入 `message.sid` 将显示此消息的 SID。通过将此 SID 传递给客户端的 `get()` 方法\
  \ ➊，你可以获取一个新的 `Message` 对象。在这个新的 `Message` 对象中，`status` 和 `date_sent` 属性是正确的。\n\n\
  `status` 属性将被设置为以下字符串值之一：`'queued'`、`'sending'`、`'sent'`、`'delivered'`、`'undelivered'`\
  \ 或 `'failed'`。这些状态是显而易懂的，但要获得更精确的细节，请查看 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)。使用\
  \ Python 接收短信\n\n的是，使用 Twilio 接收短信比发送短信复杂得多。Twilio 要求你有一个运行自己的 Web 应用程序网站。这超出了本书的范围，但你可以在本书的资源中找到更多（[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)）。\n\
  \n## 项目：“给我发短信”模块\n\n你从程序中最常短信的人可能是你自己。短信是你离开电脑时发送通知的一种极方法。如果你用程序自动化了一个运行几小时的无聊任务，可以让它在完成后通过短信通知你。或者你可能有一个定期运行的程序，有时需要联系你，例如一个检查天气的程序，提醒你带伞。\n\
  \n作为一个简单的示例，这里有一个小型 Python 程序，包含一个 `textmyself()` 函数，它可以发送作为字符串参数传递给它的消息。打开一个新的文件编辑器窗口并输入以下代码，将账户\
  \ SID、auth 令牌和手机号码替换为你自己的信息。将其保存为 *textMyself.py*。\n\n\n\n\n```python\n#! python3\n\
  \   # textMyself.py - 定义 textmyself() 函数，用于发送\n   # 传递给它的字符串格式的消息。\n\n   # 预设值：\n\
  \   accountSID = 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n   authToken = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n\
  \   myNumber = '+15559998888'\n   twilioNumber = '+15552225678'\n\n   from twilio.rest\
  \ import TwilioRestClient\n\n➊ def textmyself(message):\n     twilioCli = TwilioRestClient(accountSID,\
  \ authToken)\n     twilioCli.messages.create(body=message, from_=twilioNumber, to=myNumber)\n\
  ```\n\n此程序存储了账户 SID、认证令牌、发送号码和接收号码。然后它定义了 `textmyself()` 来接收参数 ➊，创建一个 `TwilioRestClient`\
  \ 对象 ➋，并使用你传递的消息 ➌ 调用 `create()`。\n\n如果你想在其他程序中也能使用 `textmyself()` 函数，只需将 `textMyself.py`\
  \ 文件放置在与 Python 可执行文件相同的文件夹中（Windows 下为 `C:\\Python34`，OS X 下为 `/usr/local/lib/python3.4`，Linux\
  \ 下为 `/usr/bin/python3`）。现在你可以在其他程序中使用该函数了。每当你让其中某个程序给你发短信时，只需添加以下代码：\n\n```python\n\
  import textmyself\ntextmyself.textmyself('The boring task is finished.')\n```\n\n\
  你只需要注册 Twilio 并编写一次短信代码。此后，只需两行代码即可从你的任何其他程序发送短信。\n\n## 总结\n\n我们在互联网和手机网络上通过数十种不同的方式相互通信，但电子邮件和短信占据主流。你的程序可以通过这些通道进行通信，这为它们提供了强大的新通知功能。你甚至可以编写运行在不同计算机上的程序，它们通过电子邮件直接相互通信：一个程序使用\
  \ SMTP 发送邮件，另一个程序通过 IMAP 获取邮件。\n\nPython 的 `smtplib` 提供了使用 SMTP 通过你的邮件服务提供商的 SMTP\
  \ 服务器发送邮件的功能。同样，第三方模块 `imapclient` 和 `pyzmail` 允许你访问 IMAP 服务器并检索发送给你的邮件。虽然 IMAP\
  \ 比 SMTP 稍微复杂一些，但它也非常强大，允许你搜索特定邮件、下载邮件并解析它们以提取主题和正文的字符串值。\n\n发送短信与电子邮件略有不同，因为与电子邮件不同，发送\
  \ SMS 不仅需要互联网连接。幸运的是，像 Twilio 等服务提供了模块，允许你从程序中发送短信。一旦你完成了初始设置过程，只需几行代码就能发送短信。\n\n\
  在你的技能库中掌握这些模块后，你将能够编写程序发送通知或提醒的特定条件。现在，你的程序的范围将远超它们运行运行的计算机！\n\n## 练习题\n\n| Q: |\
  \ 1\\. 发送邮件的协议是什么？检查和接收邮件的协议是什么？ |\n| Q: | 2\\. 登录 SMTP 服务器必须调用哪四个 `smtplib` 函数/方法？\
  \ |\n| Q: | 3\\. 登录 IMAP 服务器必须调用哪两个 `imapclient` 函数/方法？ |\n| Q: | 4\\. 你向 `imapObj.search()`\
  \ 传递什么类型的参数？ |\n| Q: | 5\\. 如果你的代码收到了显示 `got more than 10000 bytes` 的错误消息，该怎么办？\
  \ |\n| Q: | 6\\. `imapclient` 模块处理连接到 IMAP 服务器和查找邮件。哪一个模块负责读取 `imapclient` 收集的邮件？\
  \ |\n| Q: | 7\\. 在发送短信之前，你需要从 Twilio 获取哪三条信息？ |\n\n# 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\
  \n## 随机家务分配邮件发送器\n\n编写一个程序，接收人员邮箱列表和需要完成的家务列表，并将家务随机分配给这些人。给每个人发送其分配到的家务邮件。如果你很有野心，可以记录每个人之前分配过的家务，以确保程序避免给任何人分配他们上次做过的相同家务。另一个可能的功能是安排程序每周自动运行一次。\n\
  \n这里有一个提示：如果你向 `random.choice()` 函数传递一个列表，它将从列表中随机选择一个项目。你的代码部分可能像这样：\n\n```python\n\
  chores = ['dishes', 'bathroom', 'vacuum', 'walk dog']\nrandomChore = random.choice(chores)\n\
  chores.remove(randomChore) # 这项家务已被占用，因此将其移除\n```\n\n## 雨伞提醒\n\n第 11 章 向你展示了如何使用\
  \ `requests` 模块从 `[`weather.gov/`](http://weather.gov/)` 爬取数据。编写一个在你早上起床之前运行的程序，检查当天是否下雨。如果是，让程序给你发一条短信，提醒你在出门前带雨伞。\n\
  \n## 自动退订阅\n\n编写一个程序扫描你的邮箱账户，找到所有邮件中的退订阅链接，并自动在浏览器中打开它们。该程序必须登录你的邮件提供商的 IMAP 服务器并下载所有邮件。你可以使用\
  \ BeautifulSoup（在 第 11 章 中介绍）来检查 HTML 标签中出现 `unsubscribe` 单词的情况。\n\n一旦你获得了这些 URL\
  \ 列表，就可以使用 `webbrowser.open()` 自动在浏览器中打开它们。你仍然需要手动处理并完成任何退订阅步骤。但这个脚本节省了你翻阅所有邮件寻找退订阅链接的时间。然后你可以将此脚本传给朋友，让他们在自己的邮箱账户上运行。（只需确保你的邮箱密码不是硬编码的！）\n\
  \n## 通过邮件控制你的计算机\n\n编写一个程序每 15 分钟检查一次邮箱账户，查看你发送的任何指令并执行这些指令。例如，BitTorrent 是一种点对点下载系统。使用\
  \ qBittorrent 等免费 BitTorrent 软件，你可以在家里电脑上下载大文件。如果你给程序发送一个 BitTorrent 链接，程序最终检查邮件，找到此消息，提取链接，然后启动\
  \ qBittorrent 开始下载。这样，你可以在离开时让家里电脑开始下载，并在回家时完成下载。\n\n第 15 章 涵盖了如何使用 `subprocess.Popen()`\
  \ 函数在计算机上启动程序。例如，以下调用将启动 qBittorrent 程序以及一个 torrent 文件：\n\n```python\nqbProcess\
  \ = subprocess.Popen(['C:\\\\Program Files (x86)\\\\qBittorrent\\\\qbittorrent.exe',\
  \ 'shakespeare_complete_works.torrent'])\n```\n\n当然，你可能希望程序确保邮件来自你。特别是，你可能希望邮件包含密码，因为黑客伪造邮件中的“发件人”地址相当容易。程序应该删除它找到的邮件，以免在每次检查邮箱账户时重复执行指令。作为一个额外功能，让程序每次执行命令时都向你发送邮件或短信进行确认。由于你没有坐在运行程序的计算机前，最好使用日志函数（参见\
  \ [第 10 章](../Text/10.html \"第 10 章 调试”）写入一个文本文件日志，以便在出现错误时进行检查。\n\n\n\n\n\nqBittorrent（以及其他\
  \ BitTorrent 应用）具有一项功能，可以在下载完成后自动退出。第 15 章 解释了你可以如何使用 `Popen` 对象的 `wait()` 方法来确定启动的应用程序何时退出。`wait()`\
  \ 方法的调用将阻塞，直到 qBittorrent 停止，然后你的程序就可以发送电子邮件或短信通知你下载已完成。\n\n你可以为这个项目添加很多可能的功能。如果你在过程中遇到困难，可以从\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 下载该程序的示例实现。\n\
  \n# 第 17 章 图像处理\n\n如果你有一台数码相机，或者只是经常从手机将照片上传到 Facebook，你可能经常与数字图像文件打交道。你可能知道如何使用基础图形软件，如微软画画（Microsoft\
  \ Paint）或更高级的应用程序，如 Adobe Photoshop。但如果你需要编辑大量的图像，手动编辑它们将是一项漫长且无聊的工作。\n\n现在让 Python\
  \ 出场吧。Pillow 是一个用于与文件交互的第三方 Python 模块。该模块具有多个函数，可以轻松地裁剪、调整大小和编辑图像内容。凭借像微软画画或 Adobe\
  \ Photoshop 等软件那样处理图像的能力，Python 可以轻松地自动编辑数百或数千张图像。\n\n# 计算机图像基础\n\n为了处理图像，你需要了解计算机处理图像中颜色和坐标的基础知识，以及如何在\
  \ Pillow 中处理颜色和坐标。在继续之前，请安装 `pillow` 模块。有关安装第三方模块的帮助，请参见附录 A。\n\n## 颜色和 RGBA 值\n\
  \n计算机程序将图像中的颜色表示为 `RGBA value`。RGBA 值是一组指定红、绿、蓝和 `alpha`（或透明度）量的数字。这些组件值都是从 `0`（完全没有）到\
  \ `255`（最大值）的整数。这些 RGBA 值被分配给单个 `pixels`；像素是计算机屏幕显示的单色最小点（你可以想象，屏幕上有数百万个像素）。像素的\
  \ RGB 设置精确地告诉它应该显示什么深色的颜色。图像还有 alpha 值来创建 RGBA 值。如果图像在背景图像或桌面壁纸上显示在屏幕上，alpha 值决定了你可以多大程度上“穿透”图像像素看到背景。\n\
  \n在 Pillow 中，RGBA 值由四个整数值组成的元组表示。例如，红色表示为 `(255, 0, 0, 255)`。这种颜色具有最大量的红色，没有绿色或蓝色，以及最大的\
  \ alpha 值，这意味着它是完全不透明的。绿色表示为 `(0, 255, 0, 255)`，蓝色为 `(0, 0, 255, 255)`。白色是所有颜色的组合，`(255,\
  \ 255, 255, 255)`，而完全没有颜色的黑色是 `(0, 0, 0, 255)`。\n\n如果颜色的 alpha 值为 `0`，它就是不可见的，RGB\
  \ 值是多少其实并不重要。毕竟，不可见的红色和不可见的黑色看起来是一样的。\n\nPillow 使用了 HTML 使用的标准颜色名称。表 17-1 列出了一些标准颜色名称及其对应的值。\n\
  \n表 17-1. 标准颜色名称及其 RGBA 值\n\n| 名称 | RGBA 值 | 名称 | RGBA 值 |\n| --- | --- | --- |\
  \ --- |\n| White | `(255, 255, 255, 255)` | Red | `(255, 0, 0, 255)` |\n| Green\
  \ | `(0, 128, 0, 255)` | Blue | `(0, 0, 255, 255)` |\n| Gray | `(128, 128, 128,\
  \ 255)` | Yellow | `(255, 255, 0, 255)` |\n| Black | `(0, 0, 0, 255)` | Purple |\
  \ `(128, 0, 128, 255)` |\n\nPillow 提供了 `ImageColor.getcolor()` 函数，这样你就不需要记忆想要使用的颜色的\
  \ RGBA 值。该函数接受颜色名称字符串作为第一个参数，并将 `'RGBA'` 字符串作为第二个参数，并返回一个 RGBA 元组。\n\n### CMYK 和\
  \ RGB 着色\n\n在小学，你学过混合红、黄、蓝颜料可以形成其他颜色；例如，你可以混合蓝色和黄色制作绿色颜料。这被称为 `减色模型`，它适用于染料、墨水和颜料。这就是为什么彩色打印机有\
  \ `CMYK` 墨盒：青色（Cyan）、品红（Magenta）、黄色（Yellow）和黑色墨可以混合在一起形成任何颜色。\n\n然而，光的物理学使用的是所谓的\
  \ `加色模型`。当组合光（例如计算机屏幕发出的光）时，红、绿、蓝光可以组合任何其他颜色。这就是为什么 `RGB` 值在计算机程序中表示颜色。\n\n要查看此函数如何工作，请在交互式\
  \ shell 中输入以下内容：\n\n```\n➊ >>> from PIL import ImageColor\n➋ >>> ImageColor.getcolor('red',\
  \ 'RGBA')\n   (255, 0, 0, 255)\n➌ >>> ImageColor.getcolor('RED', 'RGBA')\n   (255,\
  \ 0, 0, 255)\n   >>> ImageColor.getcolor('Black', 'RGBA')\n   (0, 0, 0, 255)\n \
  \  >>> ImageColor.getcolor('chocolate', 'RGBA')\n   (210, 105, 30, 255)\n   >>>\
  \ ImageColor.getcolor('CornflowerBlue', 'RGBA')\n   (100, 149, 237, 255)\n```\n\n\
  首先，你需要从 `PIL` 导入 `ImageColor` 模块 ➊（不是从 Pillow；你马上就会知道为什么）。传递给 `ImageColor.getcolor()`\
  \ 的颜色名称字符串是不区分大小大小的，因此传递 `'red'` ➋ 和传递 `'RED'` ➌ 会给你相同的 RGBA 元组。你还可以传递更不寻常的颜色名称，例如\
  \ `'chocolate'` 和 `'Cornflower Blue'`。\n\nPillow 支持海量的颜色名称，从 `'aliceblue'` 到 `'whitesmoke'`。你可以在\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 的资源中找到超过 100\
  \ 个标准颜色名称的完整列表。\n\n## 坐标和边界元组\n\n图像像素通过 x 和 y 坐标进行定位，这些坐标分别指定像素在图像中的水平和垂直位置。`origin`\
  \ 是图像左上角的像素，用符号 `(0, 0)` 指定。第一个 0 代表 x 坐标，它从原点的 0 开始，并向右增加。第二个 0 代表 y 坐标，它从原点的 0\
  \ 开始并向下增加。这里需要重复一下：y 坐标向下增加，这与你可能记得的数学课上的 y 坐标用法相反。图 17-1 展示了该坐标系是如何工作的。\n\nPillow\
  \ 的许多函数和方法接受一个 `box tuple` 参数。这意味着 Pillow 期望一个由四个整数坐标组成的元组，表示图像中的一个矩形区域。这四个整数顺序如下：\n\
  \n*   `Left`：框最左边缘的 x 坐标。\n*   `Top`：框顶边缘的 y 坐标。\n*   `Right`：框最右边缘右一个像素的 x 坐标。这个整数必须大于左侧整数。\n\
  *   `Bottom`：框底部下方一个像素的 y 坐标。这个整数必须大于顶部整数。\n\n\n\n\n\n注意，该框包含左侧和上方的坐标，包含但不包含右侧和下方的坐标。例如，框元组\
  \ `(3, 1, 9, 6)` 代表图 17-2 表示的区域\")黑色框中的所有像素。\n\n# # 使用 Pillow 处理图像\n\n现在你已经了解了 Pillow\
  \ 中颜色和坐标是如何工作的，让我们使用 Pillow 来处理图像吧。图 17-3 是本章中所有交互式命令行示例将使用的图像。你可以从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载它。\n\n一旦你在当前工作目录下有了图像文件 `Zophie.png`，就可以准备好将 Zophie 的图像加载到 Python 中，如下：\n\n\
  ```\n>>> from PIL import Image\n>>> catIm = Image.open('zophie.png')\n```\n\n![我的猫\
  \ Zophie。相机让她胖了 10 磅（这对猫来说大大了）。](img/httpatomoreillycomsourcenostarchimages2189721.png.jpg)\n\
  \n图 17-3. 我的猫 Zophie。相机让她胖了 10 磅（这对猫来说大大了）。\n\n要加载图像，你需从 Pillow 导入 `Image` 模块并调用\
  \ `Image.open()`，传入图像的文件名。然后你可以将加载的图像存储在如 `CatIm` 的变量中。Pillow 的模块名为 `PIL`，以便于与名为\
  \ Python Imaging Library 的旧模块向后兼容，这就是为什么你必须运行 `from PIL import Image` 而不是 `from\
  \ Pillow import Image`。由于 Pillow 创建者设置 `pillow` 模块的方式，你必须使用 `from PIL import Image`\
  \ 形式的 `import` 语句，而不是简单地 `import PIL`。\n\n如果图像文件不在当前工作目录下，请调用 `os.chdir()` 函数将工作目录更改为包含图像文件的文件夹。\n\
  \n```\n>>> import os\n>>> os.chdir('C:\\\\folder_with_image_file')\n```\n\n`Image.open()`\
  \ 函数返回一个 `Image` 对象数据类型的值，这就是 Pillow 将图像表示为 Python 值的方式。你可以通过向 `Image.open()` 函数传递文件名的字符串，从图像文件（任何格式）加载\
  \ `Image` 对象。你对 `Image` 对象进行的任何更改都可以使用 `save()` 方法保存到图像文件（同样可以是任何格式）。所有的旋转、缩放、裁剪、绘制和其他图像处理都将通过对此\
  \ `Image` 对象的方法调用来完成。\n\n为了简化本章的示例，我假设你已经导入了 Pillow 的 `Image` 模块，并且你将 Zophie 图像存储在名为\
  \ `catIm` 的变量中。请确保 `zophie.png` 文件位于当前工作目录下，以便 `Image.open()` 函数能够找到它。否则，你还必须在 `Image.open()`\
  \ 的字符串参数中指定完整的绝对路径。\n\n## 使用图像数据类型\n\n`Image` 对象具有几个实用的属性，可以提供关于其加载来源图像文件的基本信息：它的宽度和高度、文件名以及图形格式（如\
  \ JPEG、GIF 或 PNG）。\n\n例如，在交互式命令行中输入以下内容：\n\n```\n >>> from PIL import Image\n  \
  \ >>> catIm = Image.open('zophie.png')\n   >>> catIm.size\n➊ (816, 1088)\n➋ >>>\
  \ width, height = catIm.size\n➌ >>> width\n   816\n➍ >>> height\n   1088\n   >>>\
  \ catIm.filename\n   'zophie.png'\n   >>> catIm.format\n   'PNG'\n   >>> catIm.format_description\n\
  \   'Portable network graphics'\n➎ >>> catIm.save('zophie.jpg')\n```\n\n在从 `Zophie.png`\
  \ 创建 `Image` 对象并将该 `Image` 对象存储在 `catIm` 中之后，我们可以看到对象的 `size` 属性包含一个包含图像像素宽度和高度的元组\
  \ ➊。我们可以将元组中的值赋值给 `width` 和 `height` 变量 ➋，以便单独访问宽度 ➌ 和高度 ➍。`filename` 属性描述原始文件名。`format`\
  \ 和 `format_description` 属性是描述原始图像格式的字符串（其中 `format_description` 详细得多）。\n\n最后，调用\
  \ `save()` 方法并传入 `'zophie.jpg'` 会将一个名为 `zophie.jpg` 的新图像保存到你的硬盘上 ➎。Pillow 发现文件扩展名为\
  \ `.jpg`，并自动使用 JPEG 图像格式保存图像。现在你的硬盘上有两个图像，`zophie.png` 和 `zophie.jpg`。虽然这些文件基于同一图像，但由于格式不同，它们并不是完全相同的。\n\
  \nPillow 还提供了 `Image.new()` 函数，它返回一个 `Image` 对象——与 `Image.open()` 类似，区别是 `Image.new()`\
  \ 对象表示的图像将是空白的。`Image.new()` 的参数如下：\n\n* 字符串 `'RGBA'`，将颜色模式设置为 RGBA。（书中没有详细介绍其他模式。）\n\
  * 尺寸，即一个包含新图像宽度和高度的两个整数的元组。\n* 图像开始使用的背景颜色，即一个包含 RGBA 值的四个整数的元组。你可以使用 `ImageColor.getcolor()`\
  \ 函数的返回值作为此参数。或者，`Image.new()` 也支持直接传递标准颜色字符串。\n\n例如，在交互式命令行中输入以下内容：\n\n```\n >>>\
  \ from PIL import Image\n➊ >>> im = Image.new('RGBA', (100, 200), 'purple')\n  \
  \ >>> im.save('purpleImage.png')\n➋ >>> im2 = Image.new('RGBA', (20, 20))\n   >>>\
  \ im2.save('transparentImage.png')\n```\n\n在这里，我们创建一个宽 100 像素、高 200 像素且具有紫色背景的图像的\
  \ `Image` 对象 ➊。然后将此图像保存到文件 `purpleImage.png`。再次调用 `Image.new()` 创建另一个 `Image` 对象，这次传入\
  \ (20, 20) 作为尺寸，且不传背景颜色 ➋。如果没有指定颜色参数，则使用透明黑色 `(0, 0, 0, 0)` 作为默认颜色，因此第二张图像具有透明背景；我们将这个\
  \ 20×20 的透明正方形保存为 `transparentImage.png`。\n\n## 裁剪图像\n\n*裁剪*图像意味着选择图像内部的矩形区域并移除矩形之外的所有内容。`Image`\
  \ 对象上的 `crop()` 方法接收一个框元组并返回一个表示裁剪后图像的 `Image` 对象。裁剪不是原地进行的——也就是说，原始的 `Image` 对象保持不变，`crop()`\
  \ 方法返回一个新的 `Image` 对象。记住，框元组（在此情况下为被裁剪的部分）包含左侧列和顶行像素，但只到但不*包含*右侧列和底行像素。\n\n在交互式命令行中输入以下内容：\n\
  \n```\n>>> croppedIm = catIm.crop((335, 345, 565, 560))\n>>> croppedIm.save('cropped.png')\n\
  ```\n\n这为裁剪后的图像创建了一个新的 `Image` 对象，将对象存储在 `croppedIm` 中，然后对 `croppedIm` 调用 `save()`\
  \ 将裁剪图像保存为 `cropped.png`。新文件 `cropped.png` 将从原始图像创建，如图 17-4。\n\n![新图像将只是原始图像的裁剪部分。](img/httpatomoreillycomsourcenostarchimages2189723.png.jpg)\n\
  \n图 17-4. 新图像将只是原始图像的裁剪部分。\n\n## 将图像复制并粘贴到其他图像上\n\n`copy()` 方法将返回一个新的 `Image` 对象，其内容与被调用的\
  \ `Image` 对象相同。如果你需要对图像进行更改但又想保留原始的未修改版本，这非常有用。例如，在交互式命令行中输入以下内容：\n\n```\n>>> catIm\
  \ = Image.open('zophie.png')\n>>> catCopyIm = catIm.copy()\n```\n\n\n\n\n\n`catIm`\
  \ 和 `catCopyIm` 变量包含两个独立的 `Image` 对象，它们都包含相同的图像。现在，你已经在 `catCopyIm` 中存储了一个 `Image`\
  \ 对象，你可以随心意欲地修改 `catCopyIm` 并将其保存为新文件名，而保持 `zophie.png` 不变。例如，让我们尝试使用 `paste()`\
  \ 方法修改 `catCopyIm`。\n\n`paste()` 方法在 `Image` 对象上调用，并将另一张图像粘贴在其上方。让我们通过将一个较小的图像粘贴到\
  \ `catCopyIm` 上继续 shell 示例。\n\n```\n>>> faceIm = catIm.crop((335, 345, 565, 560))\n\
  >>> faceIm.size\n(230, 215)\n>>> catCopyIm.paste(faceIm, (0, 0))\n>>> catCopyIm.paste(faceIm,\
  \ (400, 500))\n>>> catCopyIm.save('pasted.png')\n```\n\n首先，我们向 `crop()` 传递一个框元组，表示\
  \ `zophie.png` 中包含 Zophie 脸部的矩形区域。这创建了一个表示 230×215 裁剪的 `Image` 对象，将其存储在 `faceIm`\
  \ 中。现在我们可以将 `faceIm` 粘贴到 `catCopyIm` 上。`paste()` 方法接受两个参数：一个“源” `Image` 对象和一个表示你想将源\
  \ `Image`对象的左上角粘贴到主 `Image` 对象上的 x 和 y 坐标的元组。在这里，我们对 `catCopyIm` 上调用了两次 `paste()`，第一次传递\
  \ (0, 0)，第二次传递 (400, 500)。这会将 `faceIm` 两次粘贴到 `catCopyIm` 上：一次是 `faceIm` 的左上角位于 `catCopyIm`\
  \ 的 (0, 0)，另是 `faceIm` 的左上角位于 `catCopyIm` 的 (400, 500)。最后，我们将修改后的 `catCopyIm` 保存为\
  \ `pasted.png`。`pasted.png` 图像看起来类似于图 17-5。\n\n![Zophie the cat, with her face pasted\
  \ twice](img/httpatomoreillycomsourcenostarchimages2189725.png.jpg)\n\n图 17-5. 猫咪\
  \ Zophie，它的脸被粘贴了两次\n\n### 注意事项\n\n尽管名称如此，Pillow 中的 `copy()` 和 `paste()` 方法并没有使用你计算机的剪贴板。\n\
  \n注意，`paste()` 方法会原地（in place）修改其 `Image` 对象；它不会返回一个带有已粘贴图像的 `Image` 对象。如果你想调用 `paste()`\
  \ 但又保留一个原始图像的未修改版本，你需要先复制图像，然后在该副本上调用 `paste()`。\n\n假设你想让 Zophie 的头部铺满整个图像，如图 17-6\
  \ 来复制猫的脸（可以这么说，一个副本\")。你只需要几个 `for` 循环就能这种效果。输入以下内容继续交互 shell 示例：\n\n```\n >>> catImWidth,\
  \ catImHeight = catIm.size\n   >>> faceImWidth, faceImHeight = faceIm.size\n➊  >>>\
  \ catCopyTwo = catIm.copy()\n➋ >>> for left in range(0, catImWidth, faceImWidth):\n\
  ➌         for top in range(0, catImHeight, faceImHeight):\n               print(left,\
  \ top)\n               catCopyTwo.paste(faceIm, (left, top))\n   0 0\n   0 215\n\
  \   0 430\n   0 645\n   0 860\n   0 1075\n   230 0\n   230 215\n   --snip--\n  \
  \ 690 860\n   690 1075\n   >>> catCopyTwo.save('tiled.png')\n```\n\n在这里，我们将 `catIm`\
  \ 的宽度和高度存储在 `catImWidth` 和 `catImHeight` 中。在 ➊ 处，我们复制了 `catIm` 并将其存储在 `catCopyTwo`\
  \ 中。现在我们有了可以粘贴的副本，开始循环将 `faceIm` 粘贴到 `catCopyTwo` 上。外层 `for` 循环的 `left` 变量从 0 开始，并增加\
  \ `faceImWidth(230)` ➋。内层 `for` 循环的 `top` 变量从 0 开始，并增加 `faceImHeight(215)` ➌。这些嵌套的\
  \ `for` 循环产生了 `left` 和 `top` 的值，以便在 `catCopyTwo Image` 对象上网格化粘贴 `faceIm` 图像，如图 17-6\
  \ 来复制猫的脸（可以这么说，一个副本\")。为了看到我们的嵌套循环正在工作，我们打印了 `left` 和 `top`。粘贴完成后，我们将修改后的 `catCopyTwo`\
  \ 保存为 `tiled.png`。\n\n![Nested for loops used with paste() to duplicate the cat’s\
  \ face (a duplicat, if you will).](img/httpatomoreillycomsourcenostarchimages2189727.png.jpg)\n\
  \n图 17-6. 使用嵌套 `for` 循环配合 `paste()` 来复制猫的脸（可以这么说，一个副本）。\n\n### 粘贴透明像素\n\n通常情况下，透明像素被作为白色像素粘贴。如果你想要粘贴的图像具有透明像素，请将\
  \ `Image` 对象作为第三参数传递，以免粘贴上一个实色矩形。这第三个参数是“掩码”（mask）`Image` 对象。掩码是一个 alpha 值显著的 `Image`\
  \ 对象，但红、绿、蓝值会被忽略。掩码告诉 `paste()` 函数哪些像素应该复制，哪些像素应该保持透明。掩码的高级用法出了本书的范围，但如果你想粘贴具有透明像素的图像，请再次将\
  \ `Image` 对象作为第三参数传递。\n\n## 调整图像 own\n\n`resize()` 方法在 `Image` 对象上调用，并返回一个指定宽度高度的新\
  \ `Image` 对象。它接受一个包含两个整数的元组参数，代表返回图像的新宽度和高度。在交互 shell 中输入以下内容：\n\n```\n➊ >>> width,\
  \ height = catIm.size\n➋ >>> quartersizedIm = catIm.resize((int(width / 2), int(height\
  \ / 2)))\n   >>> quartersizedIm.save('quartersized.png')\n➌ >>> svelteIm = catIm.resize((width,\
  \ height + 300))\n   >>> svelteIm.save('svelte.png')\n```\n\n在这里，我们将 `catIm.size`\
  \ 元组中的两个值赋值给变量 `width` 和 `height` ➊。使用 `width` 和 `height` 代替 `catIm.size[0]` 和 `catIm.size[1]`\
  \ 会让代码更具可读性。\n\n第一次 `resize()` 调用将 `int(width / 2)` 作为新宽度，将 `int(height / 2)` 作为新高度\
  \ ➋，因此 `resize()` 返回的 `Image` 对象长度和宽度是原始图像的一半，或者总体是原始图像尺寸的四分之一。`resize()` 方法在其元组参数中只接受整数，这就是为什么你需要将两个以\
  \ 2 的除法都封装在 `int()` 调用中。\n\n这种调整保持了宽度和高度的相同比例。但传递给 `resize()` 的新宽度高度不需要与原始图像成比例。`svelteIm`\
  \ 变量包含一个具有原始宽度但高度增加 300 像素的 `Image` 对象 ➌，让 Zophie 看起来更纤细。\n\n注意，`resize()` 方法不会原地编辑\
  \ `Image` 对象，而是返回一个新的 `Image` 对象。\n\n## 旋转和翻转图像\n\n可以使用 `rotate()` 方法对图像进行旋转，该方法返回一个旋转后图像的新\
  \ `Image` 对象，并保持原始 `Image` 对象不变。`rotate()` 的参数是一个单整数或浮点数，表示逆时针旋转图像的角度数。在交互 shell\
  \ 中输入以下内容：\n\n```\n>>> catIm.rotate(90).save('rotated90.png')\n>>> catIm.rotate(180).save('rotated180.png')\n\
  >>> catIm.rotate(270).save('rotated270.png')\n```\n\n注意如何通过直接在 `rotate()` 返回的 `Image`\
  \ 对象上调用 `save()` 来*链式*调用方法。第一次 `rotate()` 和 `save()` 调用创建一个表示逆时针旋转 90 度的新 `Image`\
  \ 对象，并将旋转图像保存为 `rotated90.png`。第二次和第三次调用相似，但针对 180 度和 270 度。结果类似于图 17-7。\n\n![The\
  \ original image (left) and the image rotated counterclockwise by 90, 180, and 270\
  \ degrees](img/httpatomoreillycomsourcenostarchimages2189729.png.jpg)\n\n图 17-7.\
  \ 原始图像（左侧）和逆时针旋转 90、180 和 270 图像。\n\n\n\n\n\n注意，当图像旋转 90 度或 270 度时，图像的宽度和高度会发生。如果你以其他角度旋转图像，图像的原始尺寸将保持不变。在\
  \ Windows 上，使用黑色背景来填充旋转产生的任何间隙，如图 17-8。在 OSX 上，则使用透明像素填充间隙。\n`rotate()` 方法有一个可选的\
  \ `expand` 参数，可以设置为 `True`，以放大图像以适应整个旋转后的图像。例如，在交互式终端输入以下内容：\n\n```\n>>> catIm.rotate(6).save('rotated6.png')\n\
  >>> catIm.rotate(6, expand=True).save('rotated6_expanded.png')\n```\n\n第一次调用将图像旋转\
  \ 6 度并保存为 `rotated6.png`（查看图 17-8 的左侧）。第二次调用将 `expand` 设置为 `True` 并旋转 6 度，保存为 `rotated6_expanded.png`（查看图\
  \ 17-8 的右侧）。\n\n![正常旋转 6 度并设置 expand=True 的图像](img/httpatomoreillycomcenostarchimages218973.jpg)\n\
  \n图 17-8。正常旋转 6 度并设置 expand=True。\n\n你还可以通过 `transpose()` 方法获取图像的“镜像翻转”。你必须向 `transpose()`\
  \ 方法传递 `Image.FLIP_LEFT_RIGHT` 或 `Image.FLIP_TOP_BOTTOM`。在交互式终端输入以下内容：\n\n```\n\
  >>> catIm.transpose(Image.FLIP_LEFT_RIGHT).save('horizontal_flip.png')\n>>> catIm.transpose(Image.FLIP_TOP_BOTTOM).save('vertical_flip.png')\n\
  ```\n\n与 `rotate()` 不同，`transpose()` 会创建一个新的 `Image` 对象。在这里我们传递 `Image.FLIP_LEFT_RIGHT`\
  \ 来水平翻转图像，然后将结果保存为 `horizontal_flip.png`。要垂直翻转图像，我们传递 `Image.FLIP_TOP_BOTTOM` 并保存为\
  \ `vertical_flip.png`。结果如图 17-9 所示。\n\n![原始图像、水平翻转和垂直翻转](img/httpatomoreillycomcenostarchimages2189733.jpg)\n\
  \n图 17-9。原始图像、水平翻转和垂直翻转\n\n## 修改单个像素\n\n单个像素的颜色可以通过 `getpixel()` 和 `putpixel()`\
  \ 方法进行检索或设置。这两个方法都接受一个表示像素 x 和 y 坐标的元组。`putpixel()` 方法还接受一个像素颜色的额外元组。该颜色参数可以是四整数\
  \ RGBA 元组或三整数 RGB 元组。在交互式终端输入以下内容：\n\n```\n➊ >>> im = Image.new('RGBA', (100, 100))\n\
  ➋ >>> im.getpixel((0, 0))\n   (0, 0, 0, 0)\n➌ >>> for x in range(100):\n       \
  \    for y in range(50):\n➍             im.putpixel((x, y), (210, 210, 210))\n \
  \  >>> from PIL import ImageColor\n➎ >>> for x in range(100):\n           for y\
  \ in range(50, 100):\n➏             im.putpixel((x, y), ImageColor.getcolor('darkgray',\
  \ 'RGBA'))\n   >>> im.getpixel((0, 0))\n   (210, 210, 210, 255)\n   >>> im.getpixel((0,\
  \ 50))\n   (169, 169, 169, 255)\n   >>> im.save('putPixel.png')\n```\n\n在 ➊ 处，我们创建了一个\
  \ 100×100 的透明正方形图像。在图像的某些坐标上调用 `getpixel()` 返回 `(0, 0, 0, 0)`，因为图像是透明的 ➋。要给图像中的像素染色，可以使用嵌套的\
  \ `for` 循环遍历图像上半部分的像素 ➌，并使用 `putpixel()` 为每个像素染色 ➍。在这里我们向 `putpixel()` 传递 RGB 元组\
  \ `(210, 210, 210)`，即浅灰色。\n\n假设我们想将图像下半部分染深灰色，但不知道深灰色的 RGB 元组。`putpixel()` 方法不接受\
  \ `'darkgray'` 等标准颜色名称，因此你必须使用 `ImageColor.getcolor()` 从 `'darkgray'` 获取颜色元组。遍历图像下部分的像素\
  \ ➎，并将 `ImageColor.getcolor()` 的返回值传递给 `putpixel()` ➏。结果如图 17-10\n\n图 17-10。put.png\
  \ 图像\n\n当然，一个像素一个像素地在图像上是不方便的。如果你需要绘制形状，可以使用本章介绍的 `ImageDraw` 函数。\n\n# 项目：添加 Logo\n\
  \n假设你有一项任务，需要调整数千张图像的大小并在角落添加一个小水印。使用 Paint 等基础程序处理会非常耗时。像 Photoshop 这样的高级软件可以批量处理，但软件价格昂贵。让我们写一个脚本来实现。\n\
  \n假设图 17-11 是你想添加的 logo：带边框的猫图标。\n\n![添加到图像的 logo](img/httpatomoreillycomcenostarchimages2189737.jpg)\n\
  \n图 17-11。添加到图像的 logo。\n\n在高级别，程序应该执行：\n\n* 加载 logo 图像\n* 遍历工作目录下的所有 `.png` 和 `.jpg`\
  \ 文件。\n* 检查图像是否宽或高超过 300 像素。\n* 如果是，将宽度或高度（较大者）缩小到 300 像素并按比例缩小另一个维度。\n* 将 logo\
  \ 插入角落。\n* 将修改后的图像保存到另一个文件夹。\n\n这意味着代码需要执行以下操作：\n\n* 作为 `Image` 对象打开 `catlogo.png`\
  \ 文件。\n* 遍历 `os.listdir('.')` 返回的字符串。\n* 从 `size` 属性获取图像的宽度和高度。\n* 计算调整图像的新尺寸。\n\
  * 调用 `resize()` 方法调整图像。\n* 调用 `paste()` 方法插入 logo。\n* 使用原始文件名调用 `save()` 方法保存。\n\
  \n## 第一步：打开 logo 图像\n\n对于此项目，打开一个新的文件编辑器窗口，输入以下代码并保存为 `resizeAndAddLogo.py`：\n\n\
  ```\n #! python3\n   # resizeAndAddLogo.py - 当前工作目录下所有图像的大小，\n   # 以适应 300x300 正方形，并将\
  \ catlogo.png 添加到右下角。\n   import os\n   from PIL import Image\n\n➊ SQUARE_FIT_SIZE\
  \ = 300\n➋ LOGO_FILENAME = 'catlogo.png'\n\n둑 logoIm = Image.open(LOGO_FILENAME)\n\
  ➍ logoWidth, logoHeight = logoIm.size\n\n   # TODO: 遍历工作目录下的所有文件。\n   # TODO: 检查图像是否需要调整大小。\n\
  \   # TODO: 计算调整尺寸的新尺寸。\n   # TODO: 调整图像。\n   # TODO: 添加 logo。\n   # TODO: 保存更改。\n\
  ```\n\n\n\n\n\n通过在程序开头设置 `SQUARE_FIT_SIZE` 和 `LOGO_FILENAME` 常量，我们使得以后修改程序变得非常容易。假设你添加的\
  \ logo 不是猫咪图标，或者你想要将输出图像的最大尺寸调整为 300 像素以外的其他数值。有了程序开头的这些常量，你只需要打开代码，修改一次这些值即可完成。（或者你也可以让这些常量的值从命令行参数中获取。）如果没有这些常量，你必须在代码中搜索所有的\
  \ `300` 和 `'catlogo.png'` 实例，并将它们替换为你的新项目的值。简而言之，使用常量会让你的程序更具通用性。\n\n`Image` 对象由\
  \ `Image.open()` 返回。为了可读性，`logoWidth` 和 `logoHeight` 被赋值为来自 `logoIm.size` 的值。\n\n\
  程序的其余部分目前只是 `TODO` 注释的骨架。\n\n## 步骤 2：遍历所有文件并打开图像\n\n现在你需要找到当前工作目录下的每一个 `*.png` 文件和\
  \ `*.jpg` 文件。注意，你不想将 logo 图片添加到 logo 图片本身中，因此程序应该跳过任何文件名与 `LOGO_FILENAME` 相同的图像。向你的代码添加以下内容：\n\
  \n```python\n#! python3\n# resizeAndAddLogo.py - 调整当前工作目录中所有图像的大小以适应\n#  300x300\
  \ 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom PIL import Image\n\n--snip--\n\n\
  os.makedirs('withLogo', exist_ok=True)\n# 遍历工作目录中的所有文件。\nfor filename in os.listdir('.'):\n\
  \    if not (filename.endswith('.png') or filename.endswith('.jpg')) \\\n      \
  \    or filename == LOGO_FILENAME:\n        continue # 跳过非图像文件和 logo 文件\n\n    im\
  \ = Image.open(filename)\n    width, height = im.size\n--snip--\n```\n\n首先，`os.makedirs()`\
  \ 调用会创建一个 `withLogo` 文件夹来存储带有 logo 的完成图像，而不是覆盖原始图像文件。`exist_ok=True` 关键字参数会防止在 `withLogo`\
  \ 已存在时 `os.makedirs()` 抛出异常。在使用 `os.listdir('.')` 遍历工作目录中的所有文件时，长 `if` 语句检查每个文件名是否不以\
  \ `*.png` 或 `*.jpg` 结尾。如果是——或者该文件是 logo 图片本身——循环应该跳过它并使用 `continue` 进入下一个文件。如果 `filename`\
  \ 确实以 `.png` 或 `.jpg` 结尾（且不是 logo 文件），你可以将其作为 `Image` 对象打开并设置 `width` 和 `height`。\n\
  \n## 步骤 3：调整图像大小\n\n程序只有在宽度或高度大于 `SQUARE_FIT_SIZE`（在这种情况下为 300 像素）时才应该图像大小，因此将所有调整大小的代码放在检查\
  \ `width` 和 `height` 变量的 `if` 语句内部。向你的程序添加以下代码：\n\n```python\n#! python3\n# resizeAndAddLogo.py\
  \ - 调整当前工作目录中所有图像的大小以适应\n#  300x300 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom\
  \ PIL import Image\n\n--snip--\n\n  # 检查图像是否需要调整大小。\n  if width > SQUARE_FIT_SIZE\
  \ and height > SQUARE_FIT_SIZE:\n      # 计算要调整大小的新宽度和高度。\n      if width > height:\n\
  \        height = int((SQUARE_FIT_SIZE / width) * height)\n        width = SQUARE_FIT_SIZE\n\
  \      else:\n        width = int((SQUARE_FIT_SIZE / height) * width)\n        height\
  \ = SQUARE_FIT_SIZE\n\n      # 调整图像大小。\n      print('Resizing %s...' % (filename))\n\
  \      im = im.resize((width, height))\n\n--snip--\n```\n\n如果图像确实需要调整大小，你需要确定它是宽图还是高图。如果\
  \ `width` 大于 `height`，则高度减少的比例应与宽度缩减的比例相同。这个比例是 `SQUARE_FIT_SIZE` 值除以当前宽度。新的 `height`\
  \ 值是该比例乘以当前的 `height` 值。由于除法运算符返回浮点值，而 `resize()` 要求维度为整数，请使用 `int()` 函数将结果转换为整数。最后，新的\
  \ `width` 值将简单地设置为 `SQUARE_FIT_SIZE`。\n\n如果 `height` 大于或等于 `width`（两种情况都在 `else`\
  \ 子句中处理），则进行相同的计算，只是交换了 `height` 和 `width` 变量。\n\n一旦 `width` 和 `height` 包含新的图像尺寸，将它们传递给\
  \ `resize()` 方法并将返回的 `Image` 对象存储在 `im` 中。\n\n## 步骤 4：添加 logo 并保存更改\n\n无论图像是否调整了大小，logo\
  \ 都应该粘贴到右下角。logo 粘贴的具体位置取决于图像的大小和 logo 的大小。图 17-12 显示了如何计算粘贴位置。粘贴 的左坐标将是图像宽度减去 logo\
  \ 宽度；粘贴 的顶部坐标将是图像高度减去 logo 高度。\n\n![在右下角放置 logo 的左坐标和顶部坐标应该是图像宽度/高度减去 logo 宽度/高度。](img/httpatomoreillycomsourcenostarchimages2189739.png.jpg)\n\
  \n图 17-12。在右下角放置 logo 的左坐标和顶部坐标应该是图像宽度/高度减去 logo 宽度/高度。\n\n在你的代码将 logo 粘贴到图像之后，它应该保存修改后的\
  \ `Image` 对象。向你的程序添加以下内容：\n\n```python\n#! python3\n# resizeAndAddLogo.py - 调整当前工作目录中所有图像的大小以适应\n\
  #  300x300 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom PIL import Image\n\n--snip--\n\
  \n    # 检查图像是否需要调整大小。\n    --snip--\n\n    # 添加 logo。\n  print('Adding logo to %s...'\
  \ % (filename))\n  im.paste(logoIm, (width - logoWidth, height - logoHeight), logoIm)\n\
  \n    # 保存更改。\n  im.save(os.path.join('withLogo', filename))\n```\n\n新代码打印一条消息告诉用户正在添加\
  \ logo，在计算出的坐标将 `logoIm` 粘贴到 `im` 上，并将更改保存到 `withLogo` 目录下的文件名。当你使用 `zophie.png`\
  \ 文件作为工作目录中的唯一图像运行此程序时，输出将如下：\n\n```\nResizing zophie.png...\nAdding logo to zophie.png...\n\
  ```\n\n图像 `zophie.png` 将变为一个 225×300 像素的图像，看起来如图 17-13 所示。记住，如果不传递 `logoIm` 作为第三参数，`paste()`\
  \ 方法将不会粘贴透明像素。此程序可以在几分钟内自动调整数百张图像的大小并进行“logo 化”。\n\n![图像 zophie.png 调整了大小并添加了 logo（左）。如果你忘记了第三参数，logo\
  \ 中的透明像素将被复制为实心白色像素（右）。](img/httpatomoreillycomsourcenostarchimages2189741.png.jpg)\n\
  \n图 17-13。图像 zophie.png 调整了大小并添加了 logo（左）。如果你忘记了第三参数，logo 中的透明像素将被复制为实心白色像素（右）。\n\
  \n## 类似程序的创意\n\n能够组合图像或批量修改图像大小在许多应用程序中非常有用。你可以编写类似的程序来实现以下功能：\n\n*   在图像上添加文本或网站\
  \ URL。\n\n\n\n\n\n-   为图像添加时间戳。\n-   根据图像的大小将图像复制或移动到不同的文件夹。\n-   在图像上添加半透明水印以防止他人复制。\n\
  \n# 在图像上绘图\n\n如果你需要在图像上绘制线条、矩形、圆形或其他简单形状，可以使用 Pillow 的 `ImageDraw` 模块。在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> from PIL import Image, ImageDraw\n>>> im = Image.new('RGBA',\
  \ (200, 200), 'white')\n>>> draw = ImageDraw.Draw(im)\n```\n\n首先，我们导入 `Image` 和\
  \ `ImageDraw`。然后我们创建一个新图像（在本例中是一个 200×200 的白色图像），并将 `Image` 对象存储在 `im` 中。我们将 `Image`\
  \ 对象传递给 `ImageDraw.Draw()` 函数以获取一个 `ImageDraw` 对象。该对象有多个方法可以在 `Image` 对象上绘制形状和文本。将\
  \ `ImageDraw` 对象存储在变量 `draw` 等中，以便在随后的示例中方便地使用。\n\n## 绘制形状\n\n以下 `ImageDraw` 方法可以在图像上绘制各种形状。这些方法的\
  \ `fill` 和 `outline` 参数是可选的，如果未指定，它们将默认为白色。\n\n### 点\n\n`point(xy, fill)` 方法绘制单个像素。`xy`\
  \ 参数表示你想要绘制的点集列表。该列表可以是 x 坐标和 y 坐标元组的列表，例如 `[(x, y), (x, y), ...]`，也可以是不带元组的 x 坐标和\
  \ y 坐标列表，例如 `[x1, y1, x2, y2, ...]`。`fill` 参数是点的颜色，可以是 RGBA 元组或颜色名称的字符串（例如 `'red'`）。`fill`\
  \ 参数是可选的。\n\n### 线条\n\n`line(xy, fill, width)` 方法绘制一条线或一系列线。`xy` 既可以是元组列表（例如 `[(x,\
  \ y), (x, y), ...]`），也可以是整数列表（例如 `[x1, y1, x2, y2, ...]`）。每个点都是你正在绘制的线条上的连接点之一。可选的\
  \ `fill` 参数是线条的颜色，格式为 RGBA 元组或颜色名称。可选的 `width` 参数是线条的宽度，如果未指定，默认为 1。\n\n### 矩形\n\
  \n`rectangle(xy, fill, outline)` 方法绘制矩形。`xy` 参数是一个格式为 `(left, top, right, bottom)`\
  \ 的边界框元组。`left` 和 `top` 值指定矩形左上角的 x 坐标和 y 坐标，而 `right` 和 `bottom` 指定右下角。可选的 `fill`\
  \ 参数是填充矩形内部的颜色。可选的 `outline` 参数是矩形轮廓的颜色。\n\n### 椭圆\n\n`ellipse(xy, fill, outline)`\
  \ 方法绘制椭圆。如果椭圆的宽高相同，该方法将绘制圆形。`xy` 参数是一个边界框元组 `(left, top, right, bottom)`，表示一个恰好包含椭圆的框。可选的\
  \ `fill` 参数是椭圆内部的颜色，可选的 `outline` 参数是椭圆轮廓的颜色。\n\n### 多边形\n\n`polygon(xy, fill, outline)`\
  \ 方法绘制任意多边形。`xy` 参数是一个元组列表（例如 `[(x, y), (x, y), ...]`）或整数列表（例如 `[x1, y1, x2, y2,\
  \ ...]`），表示多边形边的连接点。最后一对坐标将自动连接到第一对。可选的 `fill` 参数是多边形内部的颜色，可选的 `outline` 参数是多边形轮廓的颜色。\n\
  \n## 绘制示例\n\n在交互式 shell 中输入以下内容：\n\n```\n>>> from PIL import Image, ImageDraw\n\
  \   >>> im = Image.new('RGBA', (200, 200), 'white')\n   >>> draw = ImageDraw.Draw(im)\n\
  ➊ >>> draw.line([(0, 0), (199, 0), (199, 199), (0, 199), (0, 0)], fill='black')\n\
  ➋ >>> draw.rectangle((20, 30, 60, 60), fill='blue')\n➌ >>> draw.ellipse((120, 30,\
  \ 160, 60), fill='red')\n➍ >>> draw.polygon(((57, 87), (79, 62), (94, 85), (120,\
  \ 90), (103, 113)),\n   fill='brown')\n➎ >>> for i in range(100, 200, 10):\n   \
  \        draw.line([(i, 0), (200, i - 100)], fill='green')\n\n   >>> im.save('drawing.png')\n\
  ```\n\n在为 200×200 的白色图像创建一个 `Image` 对象后，将其传递给 `ImageDraw.Draw()` 以获取 `ImageDraw`\
  \ 对象，并将 `ImageDraw` 对象存储在 `draw` 中，你就可以调用 `draw` 上的绘制方法。在这里，我们在图像边缘绘制了一个细的黑色轮廓 ➊，一个左上角在\
  \ (20, 30)、右下角在 (60, 60) 的蓝色矩形 ➋，一个由从 (120, 30) 到 (160, 60) 的框定义的红色椭圆 ➌、一个具有五个点的棕色多边形\
  \ ➍，以及用 `for` 循环绘制的绿色线条模式 ➎。生成的 `drawing.png` 文件看起来像图 17-14。\n\n![The resulting\
  \ drawing.png image](img/httpatomoreillycomsourcenostarchimages2189743.png.jpg)\n\
  \n图 17-14. 生成的 `drawing.png` 图像\n\n`ImageDraw` 对象还有其他其他的形状绘制方法。完整文档可以在 [`pillow.readthedocs.org/en/latest/reference/ImageDraw.html`](http://pillow.readthedocs.org/en/latest/reference/ImageDraw.html)\
  \ 获取。\n\n## 绘制文本\n\n`ImageDraw` 对象还有一个 `text()` 方法用于在图像上绘制文本。`text()` 方法接受四个参数：`xy`、`text`、`fill`\
  \ 和 `font`。\n\n- `xy` 参数是一个两个整数的元组，指定文本框的左上角。\n- `text` 参数是你想要写入的文本字符串。\n- 可选的 `fill`\
  \ 参数是文本的颜色。\n- 可选的 `font` 参数是一个 `ImageFont` 对象，用于设置文本的字体类型和大小。这将在下一节中进行详细描述。\n\n\
  由于通常很难预先知道一段文本在给定字体中的多大，`ImageDraw` 模块还提供了一个 `textsize()` 方法。它的第一个参数是你想要测量的文本字符串，第二个参数是可选的\
  \ `ImageFont` 对象。`textsize()` 方法将返回一个包含两个整数的元组，表示给定字体中的文本如果写在图像上将具有的宽度和高度。你可以使用这个宽度和高度来帮助计算你想将文本放置在图像上的精确位置。\n\
  \n`text()` 的前三个参数非常直观。在使用 `text()` 在图像上绘制文本之前，让我们来看看可选的第四个参数 `ImageFont` 对象。\n\n\
  `text()` 和 `textsize()` 都接受一个可选的 `ImageFont` 对象作为它们的最后一个参数。要创建一个这样的对象，首先运行：\n\n\
  ```\n>>> from PIL import ImageFont\n```\n\n现在你导入了 Pillow 的 `ImageFont` 模块，可以调用 `ImageFont.truetype()`\
  \ 函数，它接受两个参数。第一个参数是 TrueType 文件的字符串——这是存储在硬盘上的实际字体文件。TrueType 文件具有 `.ttf` 扩展名，通常位于以下文件夹：\n\
  \n- Windows: `C:\\Windows\\Fonts`\n- OS X: `/Library/Fonts` 和 `/System/Library/Fonts`\n\
  - Linux: `/usr/share/fonts/truetype`\n\n你实际上不需要在 TrueType 文件字符串中输入这些路径，因为 Python\
  \ 知道会自动在这些目录中搜索。但如果 Python 无法找到指定的字体，将显示错误。\n\n`ImageFont.truetype()` 的第二个参数是以磅为单位的字体整数（而不是像素）。记住，Pillow\
  \ 默认创建的 PNG 图像每英寸 72 像素，而磅是 1/72 英寸。\n\n在交互式 shell 中输入以下内容，将 `FONT_FOLDER` 替换为你的操作系统使用的实际文件夹名称：\n\
  \n\n\n\n\n```python\n>>> from PIL import Image, ImageDraw, ImageFont\n>>> import\
  \ os\n➊ >>> im = Image.new('RGBA', (200, 200), 'white')\n➋ >>> draw = ImageDraw.Draw(im)\n\
  ➌ >>> draw.text((20, 150), 'Hello', fill='purple')\n   >>> fontsFolder = 'FONT_FOLDER'\
  \ # e.g. 'Library/Fonts'\n➍ >>> arialFont = ImageFont.truetype(os.path.join(fontsFolder,\
  \ 'arial.ttf'), 32)\n➎ >>> draw.text((100, 150), 'Howdy', fill='gray', font=arialFont)\n\
  \   >>> im.save('text.png')\n```\n\n在导入 `Image`、`ImageDraw`、`ImageFont` 和 `os` 后，我们为新的\
  \ 200×200 白色图像创建了一个 `Image` 对象 ➊，并从该 `Image` 对象创建一个 `ImageDraw` 对象 ➋。我们使用 `text()`\
  \ 在 (20, 150) 处绘制紫色的 `Hello` ➌。我们在这次 `text()` 调用中没有传递可选的第四个参数，因此文本的字体和大小没有经过自定义。\n\
  \n要设置字体和大小，我们首先将文件夹名称（如 `/Library/Fonts`）存储在 `fontsFolder` 中。然后我们调用 `ImageFont.truetype()`，并传递我们所需的字体的\
  \ `.ttf` 文件，紧接着是一个整数字体大小 ➍。将从 `ImageFont.truetype()` 获取的 `Font` 对象存储在 `arialFont`\
  \ 等变量中，然后在最后的关键字参数中将该变量传递给 `text()`。➎ 处的 `text()` 调用在 (100, 150) 处用 32 点 Arial 字体绘制了灰色的\
  \ `Howdy`。\n\n生成的 `text.png` 文件将看起来类似于 图 17-15。\n\n![The resulting text.png image](img/httpatomoreillycomsourcenostarchimages2189745.png.jpg)\n\
  \n图 17-15. 生成的 `text.png` \n\n## 总结\n\n图像由像素集合组成，每个像素都有表示颜色的 RGBA 值，并通过 x 和 y 坐标进行访问。两种常见的图像格式是\
  \ JPEG 和 PNG。`pillow` 模块可以处理这两种格式以及其他格式。\n\n当图像加载到 `Image` 对象时，其宽度和高度维度将以两个整数组成的元组形式存储在\
  \ `size` 属性中。`Image` 数据类型的对象还具有常用图像操作的方法：`crop()`、`copy()`、`paste()`、`resize()`、`rotate()`\
  \ 和 `transpose()`。要将 `Image` 对象保存为图像文件，请调用 `save()` 方法。\n\n如果你想让程序在图像上绘制形状，请使用 `ImageDraw`\
  \ 方法来绘制点、线、矩形、椭圆和多边形。该模块还提供了以选择的字体和字体大小绘制文本的方法。\n\n尽管像 Photoshop 这样高级（昂贵）应用程序提供了自动批处理功能，但你可以使用\
  \ Python 脚本免费地完成许多相同的修改。在之前的章节中，你编写了 Python 程序来处理纯文本文件、电子表格、PDF 和其他格式。有了 `pillow`\
  \ 模块，你已经将编程能力扩展到了处理图像！\n\n## 练习题\n\n| Q: | 1. 什么是 RGBA 值？ |\n| Q: | 2. 如何从 `Pillow`\
