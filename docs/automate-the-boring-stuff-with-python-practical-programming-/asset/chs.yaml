  \ |\n| Q: | 9\\. 书架的值类似于什么数据结构？ |\n\n# 练习项目\n\n为了练习，请设计并编写以下程序。\n\n## 扩展多剪贴板\n\n\
  扩展本章的多剪贴板程序，使其拥有 `delete <keyword>` 命令行参数，用于从书架中删除关键字。然后添加一个 `delete` 命令行参数用于删除*所有*关键字。\n\
  \n## Mad Libs（填空游戏）\n\n创建一个 Mad Libs 程序，读取文本文件，并允许用户在文本文件中出现 `ADJECTIVE`（形容词）、`NOUN`（名词）、`ADVERB`（副词）或\
  \ `VERB`（动词）的地方添加他们自己的文本。例如，一个文本文件可能如下：\n\n```\nThe ADJECTIVE panda walked to the\
  \ NOUN and then VERB. A nearby NOUN was\nunaffected by these events.\n```\n\n程序将找到这些出现处并提示用户进行替换。\n\
  \n```\nEnter an adjective:\nsilly\nEnter a noun:\nchandelier\nEnter a verb:\nscreamed\n\
  Enter a noun:\npickup truck\n```\n\n随后将创建以下文本文件：\n\n```\nThe silly panda walked\
  \ to the chandelier and then screamed. A nearby pickup\ntruck was unaffected by\
  \ these events.\n```\n\n结果应该打印到屏幕上并保存到新的文本文件中。\n\n## 搜索\n\n编写一个程序，打开文件夹中所有的 `.*txt*`\
  \ 文件，并搜索匹配用户提供的正则表达式的行。结果应打印到屏幕上。\n\n# 第 9 章. 组织文件\n\n在上一章中，你学习了如何在 Python 中创建和写入新文件。你的程序还可以组织硬盘上已存在的文件。也许你曾有过这样的经历：遍历一个包含几十、几百甚至上千个文件的文件夹，并手动对它们进行复制、重命名、移动或压缩。\n\
  \n*   为文件夹每个子文件夹中的所有 PDF 文件（*仅限* PDF 文件）制作副本\n*   在一个包含数百个 `spam001.txt`、`spam002.txt`、`spam003.txt`\
  \ 等文件的文件夹中，删除文件名开前的零\n*   将几个文件夹的内容压缩为一个 ZIP 文件（这可以是一个简单的备份系统）\n\n所有这些无聊的事情正适合用\
  \ Python 自动化。通过编程让计算机执行这些任务，你可以将其转变为一个高效的文件办事员。\n\n## shutil 模块\n\n`shutil`（shell\
  \ utilities）模块包含了一些函数，允许你在 Python 中复制、移动、重命名和删除文件。要使用 `shutil` 函数，你首先需要 `import\
  \ shutil`。\n\n## 复制文件和文件夹\n\n`shutil` 模块提供了复制文件以及整个文件夹的函数。\n\n调用 `shutil.copy(*source,\
  \ destination*)` 将将路径 `source` 下的文件复制到路径 `destination` 处的文件夹中（`source` 和 `destination`\
  \ 都是字符串）。如果 `destination` 是文件名，它将作为复制文件的新名称。此函数返回被复制文件的路径字符串。\n\n在交互式 shell 中输入以下内容以查看\
  \ `shutil.copy()` 如何工作：\n\n```\n>>> import shutil, os\n >>> os.chdir('C:\\\\')\n\
  ➊ >>> shutil.copy('C:\\\\spam.txt', 'C:\\\\delicious')\n   'C:\\\\delicious\\\\\
  spam.txt'\n➋ >>> shutil.copy('eggs.txt', 'C:\\\\delicious\\\\eggs2.txt')\n   'C:\\\
  \\delicious\\\\eggs2.txt'\n```\n\n第一次 `shutil.copy()` 调用将 `C:\\spam.txt` 的文件复制到\
  \ `C:\\delicious` 文件夹。返回值是新复制文件的路径。注意，由于指定了文件夹作为目标 ➊，因此原始的 `spam.txt` 文件名被用于新复制的文件。第二次\
  \ `shutil.copy()` 调用 ➋ 也将 `C:\\eggs.txt` 的文件复制到 `C:\\delicious` 文件夹，但为复制的文件命名为 `eggs2.txt`。\n\
  \n虽然 `shutil.copy()` 会复制单个文件，但 `shutil.copytree()` 会复制整个文件夹以及其中的每个文件夹和文件。调用 `shutil.copytree(*source,\
  \ destination*)` 将将路径 `source` 文件夹及其所有文件和子文件夹复制到路径 `destination` 文件夹。`source` 和\
  \ `destination` 参数都是字符串。该函数返回被复制文件夹的路径字符串。\n\n在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ shutil, os\n>>> os.chdir('C:\\\\')\n>>> shutil.copytree('C:\\\\bacon', 'C:\\\\\
  bacon_backup')\n'C:\\\\bacon_backup'\n```\n\n\n\n\n\n`shutil.copytree()` 调用会创建一个名为\
  \ `bacon_backup` 的新文件夹，其内容与原始 `bacon` 文件夹相同。你现在安全地备份了你宝贵的培根。\n\n## 移动和重命名文件与文件夹\n\
  \n调用 `shutil.move(source, destination)` 将路径 `source` 下的文件或文件夹移动到 `destination` 路径，并返回新位置的绝对路径字符串。\n\
  \n如果 `destination` 指向一个文件夹，则 `source` 文件将被移动到 `destination` 中并保持其当前文件名。例如，在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> import shutil\n>>> shutil.move('C:\\\\bacon.txt', 'C:\\\\\
  eggs')\n'C:\\\\eggs\\\\bacon.txt'\n```\n\n假设 `C:\\` 目录下已经存在一个名为 `eggs` 的文件夹，此 `shutil.move()`\
  \ 调用表示：“将 `C:\\bacon.txt` 移动到文件夹 `C:\\eggs` 中。”\n\n如果 `C:\\eggs` 中已经存在一个 `bacon.txt`\
  \ 文件，它将被覆盖。由于通过这种方式很容易意外覆盖文件，在使用 `move()` 时你应该得加小心。\n\n`destination` 路径也可以指定文件名。在接下来的示例中，`source`\
  \ 文件被移动*且*被重命名了。\n\n```\n>>> shutil.move('C:\\\\bacon.txt', 'C:\\\\eggs\\\\new_bacon.txt')\n\
  'C:\\\\eggs\\\\new_bacon.txt'\n```\n\n这一行表示：“将 `C:\\bacon.txt` 移动到文件夹 `C:\\eggs`\
  \ 中，并顺便将 `bacon.txt` 文件重命名为 `new_bacon.txt`。”\n\n上述两个示例都是基于 `C:\\` 目录下存在 `eggs`\
  \ 文件夹的前提的。但如果没有 `eggs` 文件夹，`move()` 将将 `bacon.txt` 重命名为名为 `eggs` 的文件。\n\n```\n>>>\
  \ shutil.move('C:\\\\bacon.txt', 'C:\\\\eggs')\n'C:\\\\eggs'\n```\n\n在这里，`move()`\
  \ 在 `C:\\` 目录下没有找到名为 `eggs` 的文件夹，因此假设 `destination` 指定的是一个文件名而不是文件夹。因此，`bacon.txt`\
  \ 文本文件被重命名为 `eggs`（一个没有 `.txt` 扩展名的文本文件）这可能不是你想要的！这可能是你程序中一个难以发现的 bug，因为 `move()`\
  \ 调用可能会很轻松地执行与你预期完全不同的操作。这是在使用 `move()` 时需要小心的另一个原因。\n\n最后，组成目的地的文件夹必须已经存在，否则 Python\
  \ 将抛出异常。在交互式 shell 中输入以下内容：\n\n```\n>>> shutil.move('spam.txt', 'c:\\\\does_not_exist\\\
  \\eggs\\\\ham')\nTraceback (most recent call last):\n  File \"C:\\Python34\\lib\\\
  shutil.py\", line 521, in move\n    os.rename(src, real_dst)\nFileNotFoundError:\
  \ [WinError 3] The system cannot find the path specified:\n'spam.txt' -> 'c:\\\\\
  does_not_exist\\\\eggs\\\\ham'\n\n在处理上述异常期间，发生了另一个异常：\n\nTraceback (most recent\
  \ call last):\n  File \"<pyshell#29>\", line 1, in <module>\n    shutil.move('spam.txt',\
  \ 'c:\\\\does_not_exist\\\\eggs\\\\ham')\n  File \"C:\\Python34\\lib\\shutil.py\"\
  , line 533, in move\n    copy2(src, real_dst)\n  File \"C:\\Python34\\lib\\shutil.py\"\
  , line 244, in copy2\n    copyfile(src, dst, follow_symlinks=follow_symlinks)\n\
  \  File \"C:\\Python34\\lib\\shutil.py\", line 108, in copyfile\n    with open(dst,\
  \ 'wb') as fdst:\nFileNotFoundError: [Errno 2] No such file or directory: 'c:\\\\\
  does_not_exist\\\\\neggs\\\\ham'\n```\n\nPython 在 `does_not_exist` 目录下查找 `eggs`\
  \ 和 `ham`。它没有找到不存在的目录，因此无法将 `spam.txt` 移动到你指定的路径。\n\n## 永久删除文件和文件夹\n\n你可以使用 `os`\
  \ 模块中的函数删除单个文件或空文件夹，而要删除文件夹及其所有内容，你需要使用 `shutil` 模块。\n\n*   调用 `os.unlink(path)`\
  \ 将删除 `path` 处的文件。\n*   调用 `os.rmdir(path)` 将删除 `path` 处的文件夹。该文件夹必须不包含任何文件或文件夹。\n\
  *   调用 `shutil.rmtree(path)` 将移除 `path` 处的文件夹，其包含的所有文件和文件夹也将被删除。\n\n在程序中使用这些函数时要小心！通常的好做法是先注释掉这些调用并运行程序，同时添加\
  \ `print()` 调用来显示将要删除的文件。这是一个旨在删除具有 `.txt` 扩展文件的 Python 程序，但其中有一个拼写错误（已**加粗**），导致它产生以下结果：\n\
  \n```python\nimport os\nfor filename in os.listdir('.'):\n    if filename.endswith('.txt'):\n\
  \        print(filename)\n        # os.remove(filename)\n```\n\n如果在 `C:\\eggs` 中已经存在一个\
  \ `bacon.txt` 文件，它将被覆盖。由于通过这种方式很容易意外覆盖文件，在使用 `move()` 时你应该得加小心。\n\n## 使用 sendtrash\
  \ 模块进行安全删除\n\n由于 Python 内置的 `shutil.rmtree()` 函数会不可逆地删除文件和文件夹，因此使用它可能是危险的。删除文件和文件夹的更好方法是使用第三方模块\
  \ `sendtrash`。你可以通过运行 `pip install sendtrash` 来安装它。\n\n使用 `sendtrash` 比使用 Python\
  \ 的常规删除函数安全得多，因为它会将文件发送到计算机的垃圾箱或回收站，而不是永久删除。如果你的程序中的 bug 使用 `sendtrash` 删除了你并不打算删除的内容，你稍后可以从回收站恢复它。\n\
  \n安装 `sendtrash` 后，在交互式 shell 中输入以下内容：\n\n```\n>>> import sendtrash\n>>> baconFile\
  \ = open('bacon.txt', 'a') # 创建文件\n>>> baconFile.write('Bacon is not a vegetable.')\n\
  25\n>>> baconFile.close()\n>>> sendtrash.sendtrash('bacon.txt')\n```\n\n通常情况下，你应该始终使用\
  \ `sendtrash.send2trash()` 函数来删除文件和文件夹。虽然将文件发送到回收站可以恢复它们，但它不会释放磁盘空间。如果你让程序释放磁盘空间，请使用\
  \ `os` 和 `shutil` 的删除文件和文件夹函数。注意，`sendtrash()` 函数只能将文件发送到回收站，无法将其从回收站取出。\n\n## 遍历目录树\n\
  \n假设你想重命名某个文件夹中的每个文件，以及该文件夹所有子文件夹中的每个文件。也就是说，你想遍历目录树，并在过程中处理每个文件。编写实现此功能的程序可能会变得复杂；幸运的是\
  \ Python 提供了一个函数来为你处理这个过程。\n\n让我们看看图 1 所示的 `C:\\delicious` 文件夹及其内容：\n\n![一个包含三个文件夹和四个文件的示例文件夹](img/httpatomoreillycomsourcenostarchimages2189629.png.jpg)\n\
  \n图 1. 一个包含三个文件夹和四个文件的示例文件夹\n\n这是一个使用 `os.walk()` 函数对图 1 中的目录树进行操作示例程序：\n\n\n\n\n\
  \n```\nimport os\n\nfor folderName, subfolders, filenames in os.walk('C:\\\\delicious'):\n\
  \    print('The current folder is ' + folderName)\n\n    for subfolder in subfolders:\n\
  \        print('SUBFOLDER OF ' + folderName + ': ' + subfolder)\n    for filename\
  \ in filenames:\n        print('FILE INSIDE ' + folderName + ': '+ filename)\n\n\
  \    print('')\n```\n\n`os.walk()` 函数接收一个单一字符串值：文件夹的路径。你可以在 `for` 循环语句中使用 `os.walk()`\
  \ 来遍历目录树，这就像你可以使用 `range()` 函数来遍历数字范围一样。与 `range()` 不同的是，`os.walk()` 函数在循环的每次迭代中会返回三个值：\n\
  \n1. 当前文件夹名称的字符串\n2. 当前文件夹内所有的字符串列表\n3. 当前文件夹内所有文件的字符串列表\n\n（我所说的当前文件夹，是指 `for`\
  \ 循环当前迭代的文件夹。`os.walk()` *不会*改变程序的当前工作目录。）\n\n就像你可以在代码 `for i in range(10):` 中选择变量名\
  \ `i` 一样，你也可以为前面列出的三个值选择变量名。我通常使用 `foldername`、`subfolders` 和 `filenames`。\n\n当你运行此程序时，它将输出如下：\n\
  \n```\nThe current folder is C:\\delicious\nSUBFOLDER OF C:\\delicious: cats\nSUBFOLDER\
  \ OF C:\\delicious: walnut\nFILE INSIDE C:\\delicious: spam.txt\n\nThe current folder\
  \ is C:\\delicious\\cats\nFILE INSIDE C:\\delicious\\cats: catnames.txt\nFILE INSIDE\
  \ C:\\delicious\\cats: zophie.jpg\n\nThe current folder is C:\\delicious\\walnut\n\
  SUBFOLDER OF C:\\delicious\\walnut: waffles\n\nThe current folder is C:\\delicious\\\
  walnut\\waffles\nFILE INSIDE C:\\delicious\\walnut\\waffles: butter.txt.\n```\n\n\
  由于 `os.walk()` 为 `subfolder` 和 `filename` 变量返回字符串列表，你可以在它们自己的 `for` 循环中使用这些列表。将\
  \ `print()` 函数调用替换为你自定义的代码即可。（或者如果你不需要其中一个或两者，可以删除这些 `for` 循环。）\n\n## 使用 zipfile\
  \ 模块压缩文件\n\n你可能熟悉 ZIP 文件（扩展名为 `.zip`），它可以包含许多其他文件的压缩内容。压缩文件可以减小其体积，这在通过互联网传输文件时非常有用。而且由于\
  \ ZIP 文件还可以包含多个文件和子文件夹，它是将几个文件打包成一个文件的方便方法。这个单独的文件被称为*归档文件*（archive file），可以将其附件到电子邮件。\n\
  \n你的 Python 程序可以使用 `zipfile` 模块中的函数来创建和打开（或*提取*）ZIP 文件。假设你有一个名为 `example.zip` 的\
  \ ZIP 文件，其内容所示图 9-2。\n\n你可以从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载此 ZIP 文件，或者直接使用电脑上有的 ZIP 文件进行练习。\n\n![The contents of example.zip](img/httpatomoreillycomsourcenostarchimages2189631.png.jpg)\n\
  \n图 9-2. `example.zip` 的内容\n\n## 读取 ZIP 文件\n\n要读取 ZIP 文件的内容，首先必须创建一个 `ZipFile` 对象（注意大写字母\
  \ `Z` 和 `F`）。`ZipFile` 对象在概念上类似于你在上一章看到的由 `open()` 函数返回的 `File` 对象：它们是程序与文件交互的值。要创建\
  \ `ZipFile` 对象，调用 `zipfile.ZipFile()` 函数，并传递 `.zip` 文件文件名的字符串。注意 `zipfile` 是 Python\
  \ 模块的名称，而 `ZipFile()` 是函数的名称。\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n >>> import zipfile,\
  \ os\n   >>> os.chdir('C:\\\\')    # 到包含 example.zip 的文件夹\n   >>> exampleZip = zipfile.ZipFile('example.zip')\n\
  \   >>> exampleZip.namelist()\n   ['spam.txt', 'cats/', 'cats/catnames.txt', 'cats/zophie.jpg']\n\
  \   >>> spamInfo = exampleZip.getinfo('spam.txt')\n   >>> spamInfo.file_size\n \
  \  13908\n   >>> spamInfo.compress_size\n   3828\n➊ >>> 'Compressed file is %sx\
  \ smaller!' % (round(spamInfo.file_size / spamInfo\n   .compress_size, 2))\n   'Compressed\
  \ file is 3.63x smaller!'\n   >>> exampleZip.close()\n```\n\n`ZipFile` 对象有一个 `namelist()`\
  \ 方法，它返回 ZIP 文件中包含的所有文件和文件夹的字符串列表。这些字符串可以传递给 `ZipFile` 的 `getinfo()` 方法，以返回关于该特定文件的\
  \ `ZipInfo` 对象。`ZipInfo` 对象有自己的属性，例如以字节为单位的 `file_size` 和 `compress_size`，它们分别存储原始文件大小和压缩文件大小的整数。虽然\
  \ `ZipFile` 对象代表整个归档文件，但 `ZipInfo` 对象持有关于归档中*单个文件*的有用信息。\n\n➊ 处的命令通过将原始文件大小除以压缩文件大小，来计算\
  \ `example.zip` 的压缩效率，并使用用 `%s` 格式化的字符串打印此信息。\n\n## 从 ZIP 文件中提取内容\n\n`ZipFile` 对象的\
  \ `extractall()` 方法会将 ZIP 文件中的所有文件和文件夹提取到当前工作目录。\n\n```\n >>> import zipfile, os\n\
  \   >>> os.chdir('C:\\\\')    # 到包含 example.zip 的文件夹\n   >>> exampleZip = zipfile.ZipFile('example.zip')\n\
  ➊ >>> exampleZip.extractall()\n   >>> exampleZip.close()\n```\n\n运行此代码后，`example.zip`\
  \ 的内容将被提取到 `C:\\`。可选，你可以向 `extractall()` 传递文件夹名称，以便将文件提取到当前工作目录以外的文件夹。如果传递给 `extractall()`\
  \ 方法的文件夹不存在，将创建它。例如，如果你将 ➊ 处的调用替换为 `exampleZip.extractall('C:\\\\delicious')`，代码将从\
  \ `example.zip` 将文件提取到新创建的 `C:\\delicious` 文件夹。\n\n`ZipFile` 对象的 `extract()` 方法将从\
  \ ZIP 文件提取单个文件。继续交互式 shell 示例：\n\n```\n>>> exampleZip.extract('spam.txt')\n'C:\\\
  \\spam.txt'\n>>> exampleZip.extract('spam.txt', 'C:\\\\some\\\\new\\\\folders')\n\
  'C:\\\\some\\\\new\\\\folders\\\\spam.txt'\n>>> exampleZip.close()\n```\n\n你传递给\
  \ `extract()` 的字符串必须与 `namelist()` 返回列表中的某个字符串匹配。可选，你可以向 `extract()` 传递第二个参数，以便将文件提取到当前工作目录以外的文件夹。如果第二个参数是一个尚的文件夹，Python\
  \ 将创建该文件夹。`extract()` 返回的值是文件提取到的绝对路径。\n\n## 创建并向 ZIP 文件添加内容\n\n要创建自己的压缩 ZIP 文件，你必须通过传递\
  \ `'w'` 作为第二个参数来以*写入模式*打开 `ZipFile` 对象。（这类似于向 `open()` 函数传递 `'w'` 以写入模式打开文本文件。）\n\
  \n当你向 `ZipFile` 对象的 `write()` 方法传递路径时，Python 将压缩该路径下的文件并将其添加到 ZIP 文件中。`write()`\
  \ 方法的第一个参数是待添加的文件名的字符串。第二个参数是*压缩类型*参数，它告诉计算机应该使用什么算法来压缩文件；你始终可以将此值设置为 `zipfile.ZIP_DEFLATED`。（这指定了\
  \ *deflate* 压缩算法，它对所有类型的数据都效果良好）。在交互式 shell 中输入以下内容：\n\n```\n>>> import zipfile\n\
  >>> newZip = zipfile.ZipFile('new.zip', 'w')\n>>> newZip.write('spam.txt', compress_type=zipfile.ZIP_DEFLATED)\n\
  >>> newZip.close()\n```\n\n此代码将创建一个名为 `new.zip` 的新 ZIP 文件，包含 `spam.txt` 的压缩内容。\n\
  \n请记住，就像向文件写入一样，写入模式会删除 ZIP 文件的所有现有内容。如果你只想将文件添加到现有的 ZIP 文件中，请将 `'a'` 作为第二个参数传递给\
  \ `zipfile.ZipFile()`，以*追加模式*（append mode）打开 ZIP 文件。\n\n\n\n\n\n# 项目：将美式日期格式的文件重命名为欧式日期\n\
  \n假设你的老板给你发了数千个带有美式日期（MM-DD-YYYY）文件名的文件，并要求将它们重命名为欧式日期（DD-MM-YYYY）。这项无聊的任务手动完成可能需要一整天！让我们写一个程序来完成它吧。\n\
  \n该程序的功能如下：\n\n* 它会在当前工作目录下的所有文件名中搜索美式日期。\n* 当找到日期时，它将交换月份和日期来重命名文件，使其变为欧式格式。\n\n\
  这意味着代码需要执行以下操作：\n\n* 创建一个可以识别美式日期文本模式的正则表达式。\n* 调用 `os.listdir()` 查找工作目录中的所有文件。\n\
  * 遍历每个文件名，使用正则表达式检查其是否包含日期。\n* 如果包含，使用 `shutil.move()` 重命名文件。\n\n对于这个项目，请打开一个新的文件编辑器窗口，并将你的代码保存为\
  \ `renameDates.py`。\n\n## 第一步：为美式日期创建一个正则表达式\n\n程序的第一部分需要导入必要的模块，并创建一个可以识别 MM-DD-YYYY\
  \ 日期的正则表达式。`TODO` 注释将提醒你程序中还剩下编写的内容。将它们输入为 `TODO` 可以方便使用 IDLE 的 CTRL-F 查找功能找到它们。让你的代码看起来如下：\n\
  \n```\n #! python3\n   # renameDates.py - 将美式 MM-DD-YYYY 日期格式的文件名重命名\n   # 为欧式 DD-MM-YYYY.\n\
  \n➊ import shutil, os, re\n\n   # 创建一个匹配美式日期格式文件的正则表达式。\n➋ datePattern = re.compile(r\"\
  \"\"^(.*?) # 日期之前的所有文本\n       ((0|1)?\\d)-                     # 月的一或两位数字\n   \
  \    ((0|1|2|3)?\\d)-                 # 日的一或两位数字\n       ((19|20)\\d\\d)       \
  \            # 年的四\n       (.*?)$                          # 日期之后的所有文本\n➌     \"\
  \"\", re.VERBOSE)\n\n   # TODO: 遍历工作目录中的文件。\n\n   # TODO: 跳过不带日期的文件。\n\n   # TODO:\
  \ 获取文件名的不同部分。\n\n   # TODO: 构造欧式格式的文件名。\n\n   # TODO: 获取完整的绝对文件路径。\n\n   # TODO:\
  \ 重命名文件。\n```\n\n从这一章中，你知道 `shutil.move()` 函数可以重命名文件：它的参数是要重命名的文件名和新文件名。因为此函数存在\
  \ `shutil` 模块中，你必须导入该模块 ➊。\n\n但在重命名文件之前，你需要识别想要重命名哪些文件。带有日期的文件名如 `spam4-4-1984.txt`\
  \ 和 `01-03-2014eggs.zip` 应该重命名，而不带日期的文件名如 `littlebrother.epub` 则可以忽略。\n\n你可以使用正则表达式来识别这种模式。在顶部导入\
  \ `re` 模块后，调用 `re.compile()` 创建一个 `Regex` 对象 ➋。为第二个参数传递 `re.VERBOSE` ➌ 将允许正则表达式字符串中包含空格和注释，以提高可读性。\n\
  \n正则表达式字符串以 `^(.*?)` 开始，匹配文件名开头可能在日期之前的任何文本。`((0|1)?\\d)` 组匹配月份。第一个数字可以是 `0` 或 `1`，所以正则表达式匹配\
  \ 12 月的 `12`，也匹配 2 月的 `02`。这个数字也是可选的，所以 4 月的月份可以是 `04` 或 `4`。日的组为 `((0|1|2|3)?\\\
  d)`，逻辑类似；`3`、`03` 和 `31` 都是有效的日期数字。（是的，这个正则表达式会接受一些无效的日期，如 `4-31-2014`、`2-29-2013`\
  \ 和 `0-15-2014`。日期有很多棘手的特殊情况，很容易遗漏。但为了简单起见，这个程序中的正则表达式足够用了。）\n\n虽然 1885 是有效年份，但你只需要寻找\
  \ 20 世纪或 21 世纪的年份。这可以防止程序意外匹配具有类日期格式的非日期文件名，例如 `10-10-1000.txt`。\n\n正则表达式的 `(.*?)$`\
  \ 部分将匹配日期之后的任何文本。\n\n## 第二步：从文件名中识别日期部分\n\n接下来，程序将遍历由 `os.listdir()` 返回的文件字符串列表，并将其与正则表达式进行匹配。任何不包含日期的文件都应该被跳过。对于包含日期的文件名，匹配文本将存储在几个变量中。用以下代码填充你程序中的前三个\
  \ `TODO`：\n\n```\n #! python3\n   # renameDates.py - 将美式 MM-DD-YYYY 日期格式的文件名重命名\n\
  \   # 为欧式 DD-MM-YYYY.\n\n   --snip--\n\n   # 遍历工作目录中的文件。\n   for amerFilename in\
  \ os.listdir('.'):\n       mo = datePattern.search(amerFilename)\n\n       # 跳过不带日期的文件。\n\
  ➊     if mo == None:\n➋         continue\n\n➌     # 获取文件名的不同部分。\n       beforePart\
  \ = mo.group(1)\n       monthPart = mo.group(2)\n       dayPart   = mo.group(4)\n\
  \       yearPart  = mo.group(6)\n       afterPart = mo.group(8)\n\n   --snip--\n\
  ```\n\n如果 `search()` 返回的 `Match` 对象为 `None` ➊，则文件名不匹配正则表达式。`continue` 语句 ➋ 将跳过循环的剩余部分并继续后续。\n\
  \n否则，正则表达式组将存储在变量 `beforePart`、`monthPart`、`dayPart`、`yearPart` 和 `afterPart` 中\
  \ ➌。\n\n为了保持组编号清晰，尝试从开始读取正则表达式，并在每遇到一个左括号时计数一次。例如：\n\n```\ndatePattern = re.compile(r\"\
  \"\"¹ # 日期之前的所有文本\n    ((2)(3))-                     # 月的一或两位数字\n    ((4)(5))- \
  \                # 日的一或两位数字\n    ((6)(7))                   # 年的四\n    (8)$    \
  \                      # 日期之后的所有文本\n    \"\"\", re.VERBOSE)\n```\n\n在这里，数字 `1` 到\
  \ `8` 代表你编写的正则表达式中的组。\n\n## 第三步：构造新文件名并重命名文件\n\n作为最后一步，将上一步创建的变量中的字符串与欧式日期拼接：日期在月份之前。用以下代码填充你程序中的三个\
  \ `TODO`：\n\n```\n #! python3\n   # renameDates.py - 将美式 MM-DD-YYYY 日期格式的文件名重命名\n\
  \   # 为欧式 DD-MM-YYYY.\n\n   --snip--\n\n       # 构造欧式格式的文件名。\n➊     euroFilename\
  \ = beforePart + dayPart + '-' + monthPart + '-' + yearPart +\n                \
  \      afterPart\n\n       # 获取完整的绝对文件路径。\n       absWorkingDir = os.path.abspath('.')\n\
  \       amerFilename = os.path.join(absWorkingDir, amerFilename)\n       euroFilename\
  \ = os.path.join(absWorkingDir, euroFilename)\n\n       # 重命名文件。\n➋     print('Renaming\
  \ \"%s\" to \"%s\"...' % (amerFilename, euroFilename))\n➌     #shutil.move(amerFilename,\
  \ euroFilename)   # 测试后取消注释\n```\n\n该程序注释了 `shutil.move()` 调用，取而打印将要重命名的文件 ➋。先这样运行程序可以让你双重检查文件重命名是否正确。然后你可以取消注释\
  \ `shutil.move()` 调用并再次运行程序以实际重命名文件 ➌。\n\n## 类似程序的创意\n\n\n\n\n还有许多其他原因导致你可能重命名大量文件。\n\
  \n- 在文件名开头添加前缀，例如通过添加 `spam_` 将 `eggs.txt` 重命名为 `spam_eggs.txt`\n- 将具有欧式日期格式的文件名改为美式日期格式\n\
  - 移除如 `spam0042.txt` 等文件中的零\n\n# 项目：将文件夹备份为 ZIP 文件\n\n假设你正在处理一个项目，其文件保存在一个名为 `C:\\\
  AlsPythonBook` 的文件夹中。你担心丢失工作成果，因此想为整个文件夹创建 ZIP 文件“快照”。你想保留不同的版本，因此你希望 ZIP 文件的文件名在每次创建时都能递增；例如，`AlsPythonBook_1.zip`、`AlsPythonBook_2.zip`、`AlsPythonBook_3.zip`\
  \ 等。你可以手动完成这一操作，但这非常繁琐，而且你可能会不小心弄错 ZIP 文件的命名。运行一个程序来为你完成这项枯燥的任务要简单得多。\n\n对于这个项目，请打开一个新的文件编辑器窗口并将其保存为\
  \ `backupToZip.py`。\n\n## 步骤 1：确定 ZIP 文件的名称\n\n该程序的代码将放在一个名为 `backupToZip()` 的函数中。这将方便将该函数复制并粘贴到其他需要此功能的\
  \ Python 程序中。在程序结束时，将调用该函数执行备份。让你的程序看起来如下：\n\n```python\n #! python3\n   # backupToZip.py\
  \ - 将整个文件夹及其内容复制到\n   # 文件名递增的 ZIP 文件。\n\n   import zipfile, os\n\n   def backupToZip(folder):\n\
  \       # 将 \"folder\" 的所有内容备份到 ZIP 文件。\n\n       folder = os.path.abspath(folder)\
  \ # 确保文件夹是绝对路径\n\n       # 根据已存在的文件确定此代码应该使用的文件名。\n     number = 1\n     while True:\n\
  \           zipFilename = os.path.basename(folder) + '_' + str(number) + '.zip'\n\
  \           if not os.path.exists(zipFilename):\n               break\n        \
  \   number = number + 1\n\n       # TODO: 创建 ZIP 文件。\n\n       # TODO: 遍历整个文件夹树并压缩每个文件夹中的文件。\n\
  \       print('Done.')\n\n   backupToZip('C:\\\\delicious')\n```\n\n首先完成基础工作：添加\
  \ shebang (`#!`) 行，描述程序的功能，并导入 `zipfile` 和 `os` 模块。\n\n定义一个 `backupToZip()` 函数，它只接受一个参数\
  \ `folder`。该参数是一个指向要备份内容内容文件夹的字符串路径。该函数将确定为它创建的 ZIP 文件使用什么文件名；然后该函数将创建文件、遍历 `folder`\
  \ 文件夹，并将每个子文件夹和文件添加到 ZIP 文件中。在源代码中为这些步骤编写 `TODO` 注释，以提醒自己以后完成。\n\n第一部分（命名 ZIP 文件）使用了\
  \ `folder` 绝对路径的基名。如果正在备份的文件夹是 `C:\\delicious`，那么 ZIP 文件的名称应该是 `delicious_N.zip`，其中\
  \ `N` = 1 是你第一次运行程序，`N` = 2 是第二次，依此类推。\n\n你可以通过检查 `delicious_1.zip` 是否已经存在，然后检查\
  \ `delicious_2.zip` 是否存在，依此类推，来确定 `N` 应该是几。使用名为 `number` 的变量作为 `N`，并在调用 `os.path.exists()`\
  \ 的循环内部不断递增它，以检查文件是否存在。找到的第一个不存在的文件名会导致循环 `break`，因为已经找到了新 zip 文件的文件名。\n\n## 步骤\
  \ 2：创建新的 ZIP 文件\n\n接下来让我们创建 ZIP 文件。让你的程序看起来如下：\n\n```python\n !! python3\n   # backupToZip.py\
  \ - 将整个文件夹及其内容复制到\n   # 文件名递增的 ZIP 文件。\n\n   --snip--\n       while True:\n    \
  \       zipFilename = os.path.basename(folder) + '_' + str(number) + '.zip'\n  \
  \         if not os.path.exists(zipFilename):\n               break\n          \
  \ number = number + 1\n\n       # 创建 ZIP 文件。\n       print('Creating %s...' % (zipFilename))\n\
  \     backupZip = zipfile.ZipFile(zipFilename, 'w')\n\n       # TODO: 遍历整个文件夹树并压缩每个文件夹中的文件。\n\
  \       print('Done.')\n\n   backupToZip('C:\\\\delicious')\n```\n\n现在新 ZIP 文件的文件名存储在变量\
  \ `zipFilename` 中了，你可以调用 `zipfile.ZipFile()` 来实际创建 ZIP 文件。确保将 `'w'` 作为第二个参数传递，以便以写入模式打开\
  \ ZIP 文件。\n\n## 步骤 3：遍历目录树并添加到 ZIP 文件\n\n现在你需要使用 `os.walk()` 函数来完成列出文件夹及其子文件夹中每个文件的工作。让你的程序如下：\n\
  \n```python\n !! python3\n   # backupToZip.py - 将整个文件夹及其内容复制到\n   # 文件名递增的 ZIP 文件。\n\
  \n   --snip--\n\n       # 遍历整个文件夹树并压缩每个文件夹中的文件。\n     for foldername, subfolders,\
  \ filenames in os.walk(folder):\n           print('Adding files in %s...' % (foldername))\n\
  \           # 将当前文件夹添加到 ZIP 文件。\n         backupZip.write(foldername)\n        \
  \   # 将此文件夹中的所有文件添加到 ZIP 文件。\n           for filename in filenames:\n          \
  \     newBase = os.path.basename(folder) + '_'\n               if filename.startswith(newBase)\
  \ and filename.endswith('.zip'):\n                   continue   # 不要备份已生成的 ZIP 文件\n\
  \               backupZip.write(os.path.join(foldername, filename))\n       backupZip.close()\n\
  \       print('Done.')\n\n   backupToZip('C:\\\\delicious')\n```\n\n你可以在 `for` 循环中使用\
  \ `os.walk()`，在每次迭代中，它都会返回当前当前的文件夹名称、该文件夹中的子文件夹以及该文件夹中的文件名。\n\n在 `for` 循环中，文件夹被添加到\
  \ ZIP 文件。嵌套的 `for` 循环可以遍历 `filenames` 列表中的每个文件名。这些文件都被添加到 ZIP 文件，之前生成的 ZIP 除外。\n\
  \n当你运行此程序时，输出将如下：\n\n```\nCreating delicious_1.zip...\nAdding files in C:\\delicious...\n\
  Adding files in C:\\delicious\\cats...\nAdding files in C:\\delicious\\waffles...\n\
  Adding files in C:\\delicious\\walnut...\nAdding files in C:\\delicious\\walnut\\\
  waffles...\nDone.\n```\n\n第二次运行时，它会将 `C:\\delicious` 中的所有文件放入一个名为 `delicious_2.zip`\
  \ 的 ZIP 文件中，依此类推。\n\n## 类似程序的思路\n\n你可以在其他程序中遍历目录树并将文件添加到压缩的 ZIP 归文件中。例如，你可以编写执行以下操作的程序：\n\
  \n- 遍历目录树并仅存档具有特定扩展名的文件（如 `.txt` 或 `.py`），而不包含其他文件\n- 遍历目录树并存档除 `.txt` 和 `.py` 外的所有文件\n\
  - 在目录树中找到文件数量最多或占用磁盘空间最大的文件夹\n\n## 总结\n\n即使你是一个经验丰富的计算机用户，你可能仍在使用鼠标和键盘手动处理文件。现代文件资源管理器让处理几个文件变得简单。但有时，你可能需要执行一项使用计算机文件资源管理器需要数小时才能完成的任务。\n\
  \n`os` 和 `shutil` 模块提供了复制、移动、重命名和删除文件的函数。在删除文件时，你可能想使用 `send2trash` 模块将文件移动到回收站或垃圾箱，而不是永久删除它们。在编写处理文件的程序时，最好注释掉执行复制/移动/重命名/删除的代码，并代之添加一个\
  \ `print()` 调用，这样你就可以运行程序并准确验证它将要做什么。\n\n\n\n\n通常，你不仅需要对一个文件夹中的文件执行这些操作，还需要对该文件夹中的每一个文件夹、子文件夹中的每个文件夹等执行此类操作。`os.walk()`\
  \ 函数会为你处理这种跨文件夹的遍历，这样你就可以专注于你的程序需要对这些文件进行的操作了。\n\n`zipfile` 模块提供了一种通过 Python 压缩和提取\
  \ `.zip` 归档中文件的方法。结合 `os` 和 `shutil` 的文件处理函数，`zipfile` 可以让你轻松地将硬盘上任何位置的多个文件打包。与许多单独的文件相比，这些\
  \ `.zip` 文件上传到网站或作为电子邮件附件发送要容易得多。\n\n本书的前面的章节已经为你提供了供你复制的代码。但当你编写自己的程序时，它们第一次运行可能不会非常完美。下一章将介绍一些\
  \ Python 模块，它们将帮助你分析和调试程序，以便你能够快速让它们正确运行。\n\n## 练习题\n\n| Q: | 1\\. `shutil.copy()`\
  \ 和 `shutil.copytree()` 之间的区别是什么？ |\n| Q: | 2\\. 使用哪个函数来重命名文件？ |\n| Q: | 3\\. `send2trash`\
  \ 模块和 `shutil` 模块中的删除函数之间有什么区别？ |\n| Q: | 4\\. `ZipFile` 对象像 `File` 对象一样也有一个 `close()`\
  \ 方法。哪一个 `ZipFile` 方法等同于 `File` 对象的 `open()` 方法？ |\n\n# 练习项目\n\n为了练习，请编写执行以下任务的程序。\n\
  \n## 选择性复制\n\n编写一个程序，遍历文件夹树并搜索具有特定扩展名的文件（例如 `.pdf` 或 `.jpg`）。将这些文件从所在的任何位置复制到一个新文件夹中。\n\
  \n## 删除不需要的文件\n\n几个不需要但体积巨大的文件或文件夹占据了硬盘的大部分空间并不罕见。如果你正试图为电脑腾出空间，删除那些不需要的文件中最大的将获得最高效率。但首先，你必须找到它们。\n\
  \n编写一个程序，遍历文件夹树并搜索异常巨大的文件或文件夹——例如文件大小大于 100MB 的文件。（记住，要获取文件大小，你可以使用 `os` 模块中的 `os.path.getsize()`。）将这些文件的绝对路径打印到屏幕上。\n\
  \n## 填补空白\n\n编写一个程序，在单个文件夹中找到所有给定前缀的文件（例如 `spam001.txt`、`spam002.txt` 等），并定位编号中的任何间隔（例如，如果有\
  \ `spam001.txt` 和 `spam003.txt` 但没有 `spam002.txt`）。让程序重命名所有后续文件以填补这个间隔。\n\n作为一个额外挑战，编写另一个程序，可以在编号文件中插入间隔，以便添加新文件。\n\
  \n# 第 10 章 调试\n\n现在你已经了了编写更复杂程序的知识，你可能开始发现程序中存在一些并不简单的错误。本章涵盖了一些用于寻找程序错误根源的工具和技术，帮助你更快、更省力地修复错误。\n\
  \n用程序员之间的一个老笑话来说来说：“写代码占了编程的 90%，调试代码占了剩下的 90%。”\n\n你的计算机只会执行你让它做的事；它不会读取你的心思并执行你*预期*让它做的事。即使是专业程序员也会不断编写错误，所以如果你的程序出现问题，不要感到沮丧。\n\
  \n幸运的是，有一些工具和技术可以识别你的代码到底在做什么以及哪里出了问题。首先，你将查看日志（logging）和断言（assertions），这是两个可以帮助你尽早发现错误的特性。通常情况下，越早发现错误，它们就越容易修复。\n\
  \n其次，你将学习如何使用调试器。调试器是 IDLE 的一个功能，它可以一次执行一条程序指令，让你在代码运行时有机会检查变量的值，并跟踪这些值在程序运行过程中的变化。这比全速运行程序慢得多，但在程序运行时查看实际值比从源代码中推断值可能的值要有帮助得多。\n\
  \n# 抛出异常\n\n当 Python 尝试执行无效代码时，就会抛出异常。在第 3 章 中，你学习了如何使用 `try` 和 `except` 语句处理 Python\
  \ 异常，以便你的程序可以从预料的异常中恢复。但你也可以在代码中抛出自己的异常。抛出异常是表示：“停止运行此函数中的代码，并将程序执行转移到 `except`\
  \ 语句。”\n\n使用 `raise` 语句抛出异常。在代码中，`raise` 语句由以下部分组成：\n\n* `raise` 关键字\n* 调用 `Exception()`\
  \ 函数\n* 传递给 `Exception()` 函数的带有有用错误消息的字符串\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n>>>\
  \ raise Exception('This is the error message.')\nTraceback (most recent call last):\n\
  \  File \"<pyshell#191>\", line 1, in <module>\n    raise Exception('This is the\
  \ error message.')\nException: This is the error message.\n```\n\n如果没有 `try` 和 `except`\
  \ 语句覆盖抛出异常的 `raise` 语句，程序将直接崩溃并显示异常的消息。\n\n通常是调用函数的代码而不是函数本身知道如何处理异常。因此，你会在函数内部看到\
  \ `raise` 语句，而在调用函数的代码中使用 `try` 和 `except` 语句。例如，打开一个新的文件编辑器，输入以下代码，并将程序保存为 *boxPrint.py*：\n\
  \n```\n def boxPrint(symbol, width, height):\n       if len(symbol) != 1:\n    \
  \     raise Exception('Symbol must be a single character.')\n       if width <=\
  \ 2:\n         raise Exception('Width must be greater than 2.')\n       if height\
  \ <= 2:\n         raise Exception('Height must be greater than 2.')\n       print(symbol\
  \ * width)\n       for i in range(height - 2):\n           print(symbol + (' ' *\
  \ (width - 2)) + symbol)\n       print(symbol * width)\n\n   for sym, w, h in (('*',\
  \ 4, 4), ('O', 20, 5), ('x', 1, 3), ('ZZ', 3, 3)):\n       try:\n           boxPrint(sym,\
  \ w, h)\n       except Exception as err:\n         print('An exception happened:\
  \ ' + str(err))\n```\n\n在这里我们定义了一个 `boxPrint()` 函数，它接收一个字符、一个宽度高度，并使用该字符创建一个该宽度高度的小盒子。这个盒子形状被打印到控制台上。\n\
  \n假设我们需要字符是单个字符，且宽度和高度大于 2。如果不满足这些要求，我们就添加 `if` 语句来抛出异常。随后，当我们使用各种参数调用 `boxPrint()`\
  \ 时，我们的 `try`/`except` 将处理无效参数。当你运行这个 *boxPrint.py* 时，输出看起来像这样：\n\n```\n****\n*\
  \  *\n*  *\n****\nOOOOOOOOOOOOOOOOOOOO\nO                  O\nO                \
  \  O\nO                  O\nOOOOOOOOOOOOOOOOOOOO\nAn exception happened: Width must\
  \ be greater than 2.\nAn exception happened: Symbol must be a single character.\n\
  ```\n\n通过 `try` 和 `except` 语句，你可以更优雅地处理错误，而不是让整个程序崩溃。\n\n# 获取异常回溯（Traceback）字符串\n\
  \n\n\n\n\n当 Python 遇到错误时，它会产生丰富的名为 `traceback`（回溯）的错误信息。`traceback` 包含了错误信息、导致错误的行号，以及导致该错误的函数调用序列。这个调用序列被称为\
  \ `call stack`（调用栈）。\n\n在 IDLE 中打开一个新文件编辑器窗口，输入以下程序，并将其保存为 `errorExample.py`：\n\n\
  ```\ndef spam():\n    bacon()\ndef bacon():\n    raise Exception('This is the error\
  \ message.')\n\nspam()\n```\n\n当你运行 `errorExample.py` 时，输出将如下所示：\n\n```\nTraceback\
  \ (most recent call last):\n  File \"errorExample.py\", line 7, in <module>\n  \
  \  spam()\n  File \"errorExample.py\", line 2, in spam\n    bacon()\n  File \"errorExample.py\"\
  , line 5, in bacon\n    raise Exception('This is the error message.')\nException:\
  \ This is the error message.\n```\n\n从 `traceback` 中你可以看到错误发生在第 5 行的 `bacon()` 函数中。这次特定的\
  \ `bacon()` 调用来自第 2 行的 `spam()` 函数，而该函数是在第 7 行被调用的。在函数可以从多处调用的程序中，`call stack` 可以帮助你确定哪次调用导致了错误。\n\
  \n每当抛出的异常未被处理时，Python 就会显示回溯。但你也可以通过调用 `traceback.format_exc()` 以字符串字符串的形式获取它。如果你需要异常的回溯信息，但又想用\
  \ `except` 语句优雅地处理异常，那么这个函数非常有用。在调用此函数之前，你需要导入 Python 的 `traceback` 模块。\n\n例如，与其在异常发生时立即让程序崩溃，你可以将回溯信息写入日志文件并让程序继续运行。你可以在准备好调试程序时再查看日志文件。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import traceback\n>>> try:\n         raise Exception('This\
  \ is the error message.')\nexcept:\n         errorFile = open('errorInfo.txt', 'w')\n\
  \         errorFile.write(traceback.format_exc())\n         errorFile.close()\n\
  \         print('The traceback info was written to errorInfo.txt.')\n\n116\nThe\
  \ traceback info was written to errorInfo.txt.\n```\n\n`116` 是 `write()` 方法的返回值，因为有\
  \ 116 个字符被写入文件。回溯文本已写入 `errorInfo.txt`。\n\n```\nTraceback (most recent call last):\n\
  \  File \"<pyshell#28>\", line 2, in <module>\nException: This is the error message.\n\
  ```\n\n## 断言 (Assertions)\n\n`assertion`（断言）是一种健全性检查，用于确保你的代码没有做明显错误的事。这些健全性检查通过\
  \ `assert` 语句执行。如果检查失败，就会抛出一个 `AssertionError` 异常。在代码中，`assert` 语句由以下部分组成：\n\n*\
  \ `assert` 关键字\n* 一个条件（即评估为 `True` 或 `False` 的表达式）\n* 一个逗号\n* 当条件为 `False` 时显示的字符串\n\
  \n例如，在交互式 shell 中输入以下内容：\n\n```\n>>> podBayDoorStatus = 'open'\n>>> assert podBayDoorStatus\
  \ == 'open', 'The pod bay doors need to be \"open\".'\n>>> podBayDoorStatus = 'I\\\
  'm sorry, Dave. I\\'m afraid I can't do that.''\n>>> assert podBayDoorStatus ==\
  \ 'open', 'The pod bay doors need to be \"open\".'\nTraceback (most recent call\
  \ last):\n  File \"<pyshell#10>\", line 1, in <module>\n    assert podBayDoorStatus\
  \ == 'open', 'The pod bay doors need to be \"open\".'\nAssertionError: The pod bay\
  \ doors need to be \"open\".\n```\n\n在这里，我们把 `podBayDoorStatus` 设置为 `'open'`，因此从现在起，我们完全预期该变量的值为\
  \ `'open'`。在使用该变量的程序中，我们可能在假设值为 `'open'` 的假设下编写了大量代码——这些代码依赖于其为 `'open'` 才能按我们的预期工作。因此，我们添加了一个断言，以确保我们对\
  \ `podBayDoorStatus` 为 `'open'` 的假设是正确的。在这里，我们包含了消息 `'The pod bay doors need to\
  \ be \"open\".'`，这样如果断言失败，就能很容易看出问题在哪里。\n\n稍后，假设我们犯了一个明显的错误，给 `podBayDoorStatus`\
  \ 赋值了另一个值，但在许多行代码中没有注意到。断言捕到了这个错误并清晰地告诉我们哪里错了。\n\n用通俗的话说，`assert` 语句表示：“我断言这个条件是成立的，否则，说明程序某处有\
  \ bug。” 与异常不同，你的代码不应该用 `try` 和 `except` 来处理 `assert` 语句；如果如果断言失败，你的程序**应该**崩溃。通过这种快速失败的方式，你缩短了\
  \ bug 产生原因与你第一次发现 bug 之间的时间。这将减少你在找到导致 bug 代码之前需要检查的代码量。\n\n断言是针对程序员错误的，而不是用户错误。对于可以恢复的错误（例如未找到文件或用户输入了无效数据），应该抛出异常，而不是用\
  \ `assert` 语句来检测。\n\n## 在交通灯模拟中使用断言\n\n假设你正在构建一个交通灯模拟。表示交通灯的数据结构是一个字典，键为 `'ns'`（南北）和\
  \ `'ew'`（东西方向）。这些键对应的值将是 `'green'`、`'yellow'` 或 `'red'` 字符串之一。代码看起来如下：\n\n```\n\
  market_2nd = {'ns': 'green', 'ew': 'red'}\nmission16th = {'ns': 'red', 'ew': 'green'}\n\
  ```\n\n为了启动项目，你想编写一个 `switchLights()` 函数，它接受一个交叉路字典作为参数并切换交通灯。实现这个想法的代码可能如下：\n\n\
  ```\ndef switchLights(stoplight):\n    for key in stoplight.keys():\n        if\
  \ stoplight[key] == 'green':\n            stoplight[key] = 'yellow'\n        elif\
  \ stoplight[key] == 'yellow':\n            stoplight[key] = 'red'\n        elif\
  \ stoplight[key] == 'red':\n            stoplight[key] = 'green'\n\nswitchLights(market_2nd)\n\
  ```\n\n你可能已经看出这段代码的问题了，但假设你在写了其余数千行的模拟代码，而完全没有注意到它。当你终于运行模拟时，程序没有崩溃——但你的虚拟汽车崩溃了！\n\
  \n由于你已经写了程序的其余部分，你完全不知道 bug 可能在哪里。也许它在模拟汽车的代码中，也可能在模拟虚拟驾驶员的代码中。可能需要几个小时才能将 bug 追踪回\
  \ `switchLights()` 函数。\n\n但如果在编写 `switchLights()` 时，你添加了一个断言来检查至少有一盏灯始终是红色的，你可能在函数底部包含了如下：\n\
  \n```\nassert 'red' in stoplight.values(), 'Neither light is red! ' + str(stoplight)\n\
  ```\n\n有了这个断言，你的程序将带有此错误信息发生崩溃：\n\n```\nTraceback (most recent call last):\n  File\
  \ \"carSim.py\", line 14, in <module>\n    switchLights(market_2nd)\n  File \"carSim.py\"\
  , line 13, in switchLights\n    assert 'red' in stoplight.values(), 'Neither light\
  \ is red! ' + str(stoplight)\n➊ AssertionError: Neither light is red! {'ns': 'yellow',\
  \ 'ew': 'green'}\n```\n\n这里重要的一行是➊ `AssertionError`。虽然程序崩溃并不理想，但它立即指出了健全性检查失败了：两个方向的交通都没有红灯。通过在程序执行早期快速失败，你可以节省未来大量的调试工作。\n\
  \n\n\n\n\n## 禁用断言 (Assertions)\n\n在运行 Python 时，可以通过传递 `-O` 选项来禁用断言。这在你完成程序的编写和测试，且不希望程序因执行健全性检查而减慢时非常有用（尽管大多数情况下，`assert`\
  \ 语句不会引起明显的速度差异）。断言是用于开发阶段的，而不是最终产品。在你将程序交给他人运行之前，它应该是没有 bug 的，且不再需要健全性检查。请参阅附录\
  \ B 了解有关如何使用 `-O` 选项启动你那些可能没问题的程序的详情。\n\n# 日志 (Logging)\n\n如果你曾经在代码中使用 `print()`\
  \ 语句在程序运行时输出某些变量的值，那么你已经使用了某种形式的 `logging` 来调试代码。日志记录是理解程序正在发生什么以及发生顺序的极佳方法。Python\
  \ 的 `logging` 模块让你能够轻松地创建你所编写的自定义消息记录。这些日志消息将描述程序执行何时到达日志函数调用，并列出你在该时间点指定的任何变量。另一方面，缺失的日志消息表示代码的某部分被跳过且从未执行。\n\
  \n## 使用 logging 模块\n\n要让 `logging` 模块在程序运行时在屏幕上显示日志消息，请将以下内容复制到程序的顶部（但在 `#! python`\
  \ shebang 行之下）：\n\n```\nimport logging\nlogging.basicConfig(level=logging.DEBUG,\
  \ format=' %(asctime)s - %(levelname)s\n- %(message)s')\n```\n\n你不需要过于担心它的工作原理，但基本上，当\
  \ Python 记录一个事件时，它会创建一个包含该事件信息的 `LogRecord` 对象。`logging` 模块的 `basicConfig()` 函数允许你指定想要查看关于\
  \ `LogRecord` 对象的哪些细节以及你希望如何显示这些细节。\n\n假设你写了一个计算数字阶乘`factorial`）的函数。在数学中，4 的阶乘是\
  \ 1 × 2 × 3 × 4，或 24。7 的阶乘是 1 × 2 × 3 × 4 × 5 × 6 × 7，或 5,040。打开一个新的文件编辑器窗口并输入以下代码。代码中有一个\
  \ bug，但你也会输入几条日志消息来帮助自己找出哪里出了问题。将程序保存为 `factorialLog.py`。\n\n```\nimport logging\n\
  logging.basicConfig(level=logging.DEBUG, format=' %(asctime)s - %(levelname)s\n\
  - %(message)s')\nlogging.debug('Start of program')\n\ndef factorial(n):\n    logging.debug('Start\
  \ of factorial( %)' % (n))\n    total = 1\n    for i in range(n + 1):\n        total\
  \ *= i\n        logging.debug('i is ' + str(i) + ', total is ' + str(total))\n \
  \   logging.debug('End of factorial( %)' % (n))\n    return total\n\nprint(factorial(5))\n\
  logging.debug('End of program')\n```\n\n在这里，当我们想要打印日志信息时，使用 `logging.debug()` 函数。这个\
  \ `debug()` 函数会调用 `basicConfig()`，并打印一行信息。这些信息将按照我们在 `basicConfig()` 中指定的格式输出，并包含我们传递给\
  \ `debug()` 的消息。`print(factorial(5))` 是原始程序的一部分，因此即使禁用了日志消息，结果也会显示。\n\n该程序的输出如下：\n\
  \n```\n2015-05-23 16:20:12,664 - DEBUG - Start of program\n2015-05-23 16:20:12,664\
  \ - DEBUG - Start of factorial(5)\n2015-05-23 16:20:12,665 - DEBUG - i is 0, total\
  \ is 0\n2015-05-23 16:20:12,668 - DEBUG - i is 1, total is 0\n2015-05-23 16:20:12,670\
  \ - DEBUG - i is 2, total is 0\n2015-05-23 16:20:12,673 - DEBUG - i is 3, total\
  \ is 0\n2015-05-23 16:20:12,675 - DEBUG - i is 4, total is 0\n2015-05-23 16:20:12,678\
  \ - DEBUG - i is 5, total is 0\n2015-05-23 16:20:12,680 - DEBUG - End of factorial(5)\n\
  0\n2015-05-23 16:20:12,684 - DEBUG - End of program\n```\n\n`factorial()` 函数返回 `0`\
  \ 作为 `5` 的阶乘，这是不对的。`for` 循环应该将 `total` 中的值与 `1` 到 `5` 的数字相乘。但 `logging.debug()`\
  \ 显示的日志消息显示变量 `i` 是 `0` 开始的，而不是 `1`。由于零乘以任何数都是零，其余迭代的 `total` 值也是错误的。日志消息提供了一条面包屑线索，可以帮助你找出问题从何时开始出错。将\
  \ `for i in range(n + 1):` 改为 `for i in range(1, n + 1):`，再次运行程序。输出将如下：\n\n```\n\
  2015-05-23 16:20:12,664 - DEBUG - Start of program\n2015-05-23 16:20:12,664 - DEBUG\
  \ - Start of factorial(5)\n2015-05-23 16:20:12,665 - DEBUG - i is 1, total is 1\n\
  2015-05-23 16:20:12,668 - DEBUG - i is 2, total is 2\n2015-05-23 16:20:12,670 -\
  \ DEBUG - i is 3, total is 6\n2015-05-23 16:20:12,673 - DEBUG - i is 4, total is\
  \ 24\n2015-05-23 16:20:12,675 - DEBUG - i is 5, total is 120\n2015-05-23 16:20:12,680\
  \ - DEBUG - End of factorial(5)\n120\n2015-05-23 16:20:12,684 - DEBUG - End of program\n\
  ```\n\n`factorial(5)` 调用正确返回了 `120`。`logging.debug()` 的日志消息显示了循环内部的情况，这直接指向了 bug。你可以看到\
  \ `logging.debug()` 调用不仅打印了传递给它们的字符串，还打印了时间戳和 `DEBUG` 字样。\n\n## 不要用 print 调试\n\n\
  输入 `import logging` 和 `logging.basicConfig(level=logging.DEBUG, format='%(asctime)s\
  \ - %(levelname)s - %(message)s')` 有些繁琐。你可能想用 `print()` 来代之，但不要妥协！一旦你完成工作，你将花费大量时间从代码中移除每条日志消息的\
  \ `print()` 调用。`logging` 模块让你轻松在显示和隐藏日志消息之间切换。你可以通过添加一个 `logging.disable(logging.CRITICAL)`\
  \ 调用来随时禁用它们。\n\n## 日志级别 (Logging Levels)\n\n*日志级别*提供了一种按重要性对日志消息进行分类的方法。共有五个日志级别，如表\
  \ 10-1 所示，从不重要到最重要。可以使用不同的日志函数在每个级别记录消息。\n\n你的日志消息是作为字符串传递给这些函数的。日志级别只是建议。最终，由你决定你的日志消息属于哪一类。在交互式\
  \ shell 中输入以下内容：\n\n\n\n\n\n```\n>>> import logging\n>>> logging.basicConfig(level=logging.DEBUG,\
  \ format=' %(asctime)s -\n%(levelname)s - %(message)s')\n>>> logging.debug('Some\
  \ debugging details.')\n2015-05-18 19:04:26,901 - DEBUG - Some debugging details.\n\
  >>> logging.info('The logging module is working.')\n2015-05-18 19:04:35,569 - INFO\
  \ - The logging module is working.\n>>> logging.warning('An error message is about\
  \ to be logged.')\n2015-05-18 19:04:56,843 - WARNING - An error message is about\
  \ to be logged.\n>>> logging.error('An error has occurred.')\n2015-05-18 19:05:07,737\
  \ - ERROR - An error has occurred.\n>>> logging.critical('The program is unable\
  \ to recover!')\n2015-05-18 19:05:45,794 - CRITICAL - The program is unable to recover!\n\
  ```\n\n日志级别的好处是，你可以你想要查看什么优先级的日志消息。将 `logging.DEBUG` 传递给 `basicConfig()` 函数的 `level`\
  \ 关键字参数，将显示所有日志级别的消息（DEBUG 是最低级别）。但当你进一步开发你的程序后，你可能只对错误感兴趣。在这种情况下，你可以将 `basicConfig()`\
  \ 的 `level` 参数设置为 `logging.ERROR`。这将只显示 ERROR 和 CRITICAL 消息，并跳过 DEBUG、INFO 和 WARNING\
  \ 消息。\n\n## 禁用日志\n\n在调试完程序后，你可能不希望所有这些日志信息弄乱屏幕。`logging.disable()` 函数可以禁用这些日志，这样你就不需要手动进入程序并删除所有的日志调用。你只需要向\
  \ `logging.disable()` 传递一个日志级别，它就会抑制该级别或更低的所有日志消息。因此，如果你想完全禁用日志，只需在程序中添加 `logging.disable(logging.CRITICAL)`\
  \ 即可。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> import logging\n>>> logging.basicConfig(level=logging.INFO,\
  \ format=' %(asctime)s -\n%(levelname)s - %(message)s')\n>>> logging.critical('Critical\
  \ error! Critical error!')\n2015-05-22 11:10:48,054 - CRITICAL - Critical error!\
  \ Critical error!\n>>> logging.disable(logging.CRITICAL)\n>>> logging.critical('Critical\
  \ error! Critical error!')\n>>> logging.error('Error! Error!')\n```\n\n由于 `logging.disable()`\
  \ 将禁用其之后的所有消息，你可能想将它添加到程序中 `import logging` 代码行附近。这样，你就可以轻松地找到并注释或取消注释该调用，以根据需要启用或禁用日志消息。\n\
  \n## 将日志写入文件\n\n与其将日志消息显示在屏幕上，不如将它们写入文本文件。`logging.basicConfig()` 函数接受一个 `filename`\
  \ 关键字参数，如下：\n\n```\nimport logging\nlogging.basicConfig(filename='myProgramLog.txt',\
  \ level=logging.DEBUG, format='\n%(asctime)s - %(levelname)s - %(message)s')\n```\n\
  \n日志消息将保存到 `myProgramLog.txt` 中。虽然日志消息很有用，但它们会弄乱你的屏幕并让你难以阅读程序的输出。将日志消息写入文件可以保持屏幕整洁，并存储消息以便你可以在运行程序后阅读它们。你可以使用任何文本编辑器（如记事本或\
  \ TextEdit）打开此文本文件。\n\n## IDLE 调试器\n\n`debugger` 是 IDLE 的一个功能，允许你逐行执行程序。调试器将运行单行代码，然后等待你告诉它继续。通过这种方式“在调试器下”运行你的程序，你可以花费任何需要的时间检查程序生命周期内任何一点的变量值。这是一个追踪\
  \ bug 的有用工具。\n\n要启用 IDLE 调试器，请在交互式 shell 窗口中点击 `Debug`▸`Debugger`。这将弹出调试控制窗口，它的外观类似于图\
  \ 10-1。\n\n当调试控制窗口出现时，勾选 `Stack`、`Locals`、`Source` 和 `Globals` 所有四个复选框，以便窗口显示完整的调试信息。当调试控制窗口显示时，每当你从文件编辑器运行程序时，调试器都会第一条指令之前暂停执行并显示以下内容：\n\
  \n*   即将执行的代码行\n*   所有局部变量及其值的列表\n*   所有全局变量及其值的列表\n\n![调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189633.png.jpg)\n\
  \n图 10-1. 调试控制窗口\n\n你会注意到，在全局变量列表中有几个你没有定义的变量，例如 `__builtins__`、`__doc__`、`__file__`\
  \ 等。这些是 Python 在运行程序时自动设置的变量。这些变量的含义超出了本书的范围，你可以放心地忽略它们。\n\n程序将一直保持暂停状态，直到你按下调试控制窗口中的五个按钮之一：Go,\
  \ Step, Over, Out, Quit。\n\n## Go\n\n点击 `Go` 按钮将导致程序正常执行，直到遇到断点。如果你完成了调试并想让程序继续，请点击\
  \ `Go` 按钮。\n\n## Step\n\n点击 `Step` 按钮将导致调试器执行下一行代码，然后再次暂停。如果全局和局部变量的值发生变化，调试控制窗口的列表将更新。如果下一行代码是一个函数调用，调试器将“进入\
  \ (step into)”该函数并跳转到函数的第一行代码。\n\n## Over\n\n点击 `Over` 按钮将执行下一行代码，类似于 `Step` 按钮。然而，如果下一行代码是一个函数调用，`Over`\
  \ 按钮将“跳过 (step over)”函数中的代码。函数代码将全速执行，调试器将在函数返回后立即暂停。例如，如果下一行代码是一个 `print()` 调用，你并不关心\
  \ `print()` 函数内部的代码；你只想将传递的字符串打印到屏幕上。由于这个原因，使用 `Over` 按钮比 `Step` 按钮更常见。\n\n## Out\n\
  \n点击 `Out` 按钮将导致调试器全速执行代码直到从当前函数返回。如果你使用 `Step` 按钮进入了函数调用，现在只想继续执行直到出来，点击 `Out`\
  \ 按钮“跳出 (step out)”当前函数调用。\n\n## Quit\n\n如果你想完全停止调试并且不再继续执行程序的其余部分，点击 `Quit` 按钮。`Quit`\
  \ 按钮将立即终止程序。如果你想再次正常运行程序，请再次选择 `Debug`▸`Debugger` 来禁用调试器。\n\n## 调试一个数字加法程序\n\n打开一个新的文件编辑器窗口并输入以下代码：\n\
  \n```\nprint('输入要加的第一个数字：')\nfirst = input()\nprint('输入要加的第二个数字：')\nsecond = input()\n\
  print('输入要加的第三个数字：')\nthird = input()\nprint('和为 ' + first + second + third)\n```\n\
  \n将其保存为 *buggyAddingProgram.py* 并先在未启用调试器的情况下运行。程序将输出类似的内容：\n\n```\n输入要加的第一个数字：\n\
  5\n输入要加的第二个数字：\n3\n输入要加的第三个数字：\n42\n和为 5342\n```\n\n程序没有崩溃，但和显然是错误的。让我们启用控制窗口并再次运行，这次在调试器下运行。\n\
  \n\n\n\n\n当你按下 `F5` 或选择 `Run`▸`Run Module`（在启用 `Debug`▸`Debugger` 并勾选调试控制窗口上的四个复选框）时，程序将在第\
  \ 1 行以暂停状态启动。调试器总会在它即将执行的代码行上暂停。调试控制窗口看起来将如图 10-2 所示。\n\n![程序在调试器下首次启动时的调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189635.png.jpg)\n\
  \n图 10-2. 程序在调试器下首次启动时的调试控制窗口\n\n点击一次 `Over` 按钮来执行第一个 `print()` 调用。在这里你应该使用 `Over`\
  \ 而不是 `Step`，因为你不想进入 `print()` 函数的内部代码。调试控制窗口将更新到第 2 行，文件编辑器窗口中的第 2 行将被高亮，如图 10-3\
  \ 所示。\n\n![点击 Over 后的调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189637.png.jpg)\n\
  \n图 10-3. 点击 Over 后的调试控制窗口\n\n再次点击 `Over` 执行 `input()` 函数调用，此时调试控制窗口中的按钮将禁用，而 IDLE\
  \ 将等待你在交互式壳窗口为 `input()` 调用输入内容。输入 `5` 并按回车。调试控制窗口的按钮将重新启用。\n\n继续点击 `Over`，并输入接两个数字\
  \ `3` 和 `42`，直到调试器到达第 7 行，即程序中最后一个 `print()` 调用。调试控制窗口看起来应该如图 10-4 所示。你可以在 Glob（全局）部分看到第一、第二和第三个变量被设置为字符串值\
  \ `'5'`、`'3'` 和 `'42'`，而不是整数值 `5`、`3` 和 `42`。当执行最后一行时，这些字符串会被拼接而不是相加，导致了错误。\n\n\
  ![最后行的调试控制窗口。变量被设置为字符串，导致了错误。](img/httpatomoreillycomsourcenostarchimages2189639.png.jpg)\n\
  \n图 10-4. 最后行的调试控制窗口。变量被设置为字符串，导致了错误。\n\n使用调试器逐步执行程序很有帮助，但可能很慢。通常你可能希望程序正常运行，直到到达某行代码。你可以通过断点来配置调试器实现这一点。\n\
  \n## 断点\n\n*断点*（breakpoint）可以设置在特定的代码行上，并强制调试器在每次程序执行到达该行时都暂停。打开一个新的文件编辑器窗口并输入以下程序，该程序模拟了抛硬币\
  \ 1000 次。将其保存为 `coinFlip.py`。\n\n```python import random\n   heads = 0\n   for i\
  \ in range(1, 1001):\n➊     if random.randint(0, 1) == 1:\n           heads = heads\
  \ + 1\n       if i == 500:\n➋         print('Halfway done!')\n   print('Heads came\
  \ up ' + str(heads) + ' times.')\n```\n\n`random.randint(0, 1)` 调用 ➊ 有一半时间返回 `0`，另一半时间返回\
  \ `1`。这可以模拟 50/50 的硬币抛，其中 `1` 代表正面。当你不用调试器运行此程序时，它会快速输出如下内容：\n\n```\nHalfway done!\n\
  Heads came up 490 times.\n```\n\n如果你在调试器下运行此程序，在程序终止之前你需要点击数千次 `Over` 按钮。如果你对程序执行一半（即已完成\
  \ 500 次抛硬币时）`heads` 的值感兴趣，你只需要在 `print('Halfway done!')` ➋ 行设置一个断点即可。要设置断点，在文件编辑器中右键点击该行并选择\
  \ `Set Breakpoint`，如图 10-5 所示。\n\n![设置断点](img/httpatomoreillycomsourcenostarchimages2189641.png.jpg)\n\
  \n图 10-5. 设置断点\n\n你不想在 `if` 语句行上设置断点，因为 `if` 语句在每次迭代中都会执行。通过在 `if` 语句的代码上设置断点，调试器只会在执行进入\
  \ `if` 子句时中断。\n\n文件编辑器中带有断点的行将被黄色高亮。在调试器下运行程序时，它将像往一样从第一行开始暂停。但如果你点击 `Go`，程序将全速运行直到到达设置了断点的行。然后你可以点击\
  \ `Go`、`Over`、`Step` 或 `Out` 继续操作。\n\n如果你想移除断点，在文件编辑器中右键点击该行并从菜单中选择 `Clear Breakpoint`。黄色高亮将消失，调试器将来不再在该行中断。\n\
  \n## 总结\n\n断言（Assertions）、异常、日志和调试器都是发现和防止程序 bug 的有效工具。使用 Python 的 `assert` 语句进行断言是实现“健全检查”的好方法，当必要条件不成立时，它能给你早期警报。断言仅用于程序不应尝试恢复且应该快速失败的错误。否则，你应该抛出异常。\n\
  \n异常可以被 `try` 和 `except` 语句捕获并处理。`logging` 模块是运行运行代码的好方法，由于具有不同的级别以及记录到文件的能力，它比使用\
  \ `print()` 函数方便得多。\n\n## 练习题\n\n| Q: | 1\\. 编写一个 `assert` 语句，如果 `spam` 是小于 `10`\
  \ 的整数，则触发 `AssertionError`。 |\n| Q: | 2\\. 编写一个 `assert` 语句，如果 `eggs` 和 `bacon`\
  \ 包含相同的字符串（即使大小写不同），则触发 `AssertionError`（即 `'hello'` 和 `'hello'` 被视为相同，`'goodbye'`\
  \ 和 `'GOODbye'` 也被视为相同）。 |\n| Q: | 3\\. 编写一个*总是*触发 `AssertionError` 的 `assert` 语句。\
  \ |\n| Q: | 4\\. 你的程序必须包含哪两行才能调用 `logging.debug()`？ |\n| Q: | 5\\. 你的程序必须包含哪两行才能\
  \ `logging.debug()` 将日志消息发送到名为 `programLog.txt` 的文件？ |\n| Q: | 6\\. 五种日志级别是什么？ |\n\
  | Q: | 7\\. 你可以添加哪行代码来禁用程序中的所有日志消息？ |\n| Q: | 8\\. 为什么使用日志消息比使用 `print()` 显示相同消息更好？\
  \ |\n| Q: | 9\\. 调试控制窗口中的 `Step`、`Over` 和 `Out` 按钮之间有什么区别？ |\n| Q: | 10\\. 在调试控制窗口中点击\
  \ `Go` 后，调试器何时何时停止？ |\n| Q: | 11\\. 什么是断点？ |\n| Q: | 12\\. 如何在 IDLE 中对代码行设置断点？ |\n\
  \n# 练习项目\n\n## 调试抛硬币\n\n\n\n\n以下程序是一个简单的硬币猜猜游戏。玩家有两次猜测的机会（这是一个很容易的游戏）。然而，程序中有几个\
  \ bug。运行几次程序，找出那些阻止程序正常运行的 bug。\n\n```python\nimport random\nguess = ''\nwhile guess\
  \ not in ('heads', 'tails'):\n    print('Guess the coin toss! Enter heads or tails:')\n\
  \    guess = input()\ntoss = random.randint(0, 1) # 0 是反面，1 是正面\nif toss == guess:\n\
  \    print('You got it!')\nelse:\n    print('Nope! Guess again!')\n    guesss =\
  \ input()\n    if toss == guess:\n       print('You got it!')\n    else:\n     \
  \   print('Nope. You are really bad at this game.')\n```\n\n# 第 11 章. 网络爬虫\n\n在那些没有\
  \ Wi-Fi 的罕见且可怕的时刻，我意识到我在电脑上做的大部分工作实际上都是在互联网上完成的。出于习惯，我会发现自己正试图检查邮件、阅读朋友的 Twitter\
  \ 动态，或者回答这个问题：“库特伍德·史密斯在主演 1987 年原版《机械警察》之前之前出演过什么主要角色吗？”\n\n由于在电脑上进行的许多工作都涉及上网，如果你的程序可以联网，那就太棒了。`网络爬虫`（Web\
  \ scraping）是指使用程序从网上下载并处理内容的术语。例如，Google 运行了许多网络爬虫程序来为它的搜索引擎索引网页。在本章中，你将学习几个让 Python\
  \ 能够轻松爬取网页的模块。\n\n*   `webbrowser`。随 Python 一带，用于打开浏览器特定页面。\n*   `Requests`。从互联网下载文件和网页。\n\
  *   `Beautiful Soup`。解析 HTML，即网页编写的格式。\n*   `Selenium`。启动并控制网络浏览器。`Selenium` 能够在浏览器中填写表单并模拟鼠标点击。\n\
  \n# 项目：使用 webbrowser 模块实现 mapit.py\n\n`webbrowser` 模块的 `open()` 函数可以启动新浏览器访问指定的\
  \ URL。在交互式 shell 中输入以下内容：\n\n```\n>>> import webbrowser\n>>> webbrowser.open('http://inventwithpython.com/')\n\
  ```\n\n浏览器标签页将打开到 URL `http://inventwithpython.com/`。这几乎是 `webbrowser` 模块能做的唯一事情。尽管如此，`open()`\
  \ 函数确实让一些有趣变得可能。例如，将街道地址复制到剪贴板并在 Google Maps 上显示地图是很麻烦的。你可以通过编写一个简单的脚本，利用剪贴板的内容自动在浏览器中启动地图，从而简化这项任务。这样，你只需要将地址复制到剪贴板并运行脚本，地图就会为你加载。\n\
  \n这就是你的程序将实现的功能：\n\n*   从命令行参数或剪贴板获取街道地址。\n*   打开浏览器到该地址对应的 Google Maps 页面。\n\n\
  这意味着你的代码需要执行以下操作：\n\n*   从 `sys.argv` 读取命令行参数。\n*   读取剪贴板内容。\n*   调用 `webbrowser.open()`\
  \ 函数打开网络浏览器。\n\n打开一个新的文件编辑器窗口，并将其保存为 `mapIt.py`。\n\n## 步骤 1：确定 URL\n\n根据附录 B 中的说明，设置\
  \ `mapIt.py`，使得当你从命令行运行它时（如下所示……\n\n```\nC:\\> mapit 870 Valencia St, San Francisco,\
  \ CA 94110\n```\n\n……脚本将使用命令行参数而不是剪贴板。如果没有命令行参数，程序将知道去使用剪贴板的内容。\n\n首先，你需要确定给特定的街道地址使用什么\
  \ URL。当你在浏览器中加载 `http://maps.google.com/` 并搜索一个地址时，地址栏中的 URL 看起来类似于：`https://www.google.com/maps/place/870+Valencia+St/@37.7590311,-122.4215096,17z/data=!3m1!4b1!4m2!3m1!1s0x808f7e3dadc07a37:0xc86b0b2bb93b73d8`。\n\
  \n地址位于 URL 中，但那里有很多额外的文本。网站通常会在 URL 中添加额外数据以帮助跟踪访问者或自定义网站。但如果你尝试直接访问 `https://www.google.com/maps/place/870+Valencia+St+San+Francisco+CA/`，你会发现\
  \ `address_string` 就是正确的页面。由于 `sys.argv` 是一个字符串列表，你可以将其传递给 `join()` 方法，该方法会返回单个字符串。`sys.argv`\
  \ 是一个字符串列表，该表达式评估出的最终字符串为 `https://www.google.com/maps/place/870+Valencia+St/@37.7590311,-122.4215096,17z/data=!3m1!4b1!4m2!3m1!1s0x808f7e3dadc07a37:0xc86b0b2bb93b73d8`。\n\
  \n\n\n\n看看 `mapIt.py` 如何让这项任务变得不再枯燥？\n\n## 类似程序的创意\n\n只要你有一个 URL，`webbrowser` 模块就可以让用户跳过打开浏览器并导航到网站的步骤。其他程序可以使用此功能执行以下操作：\n\
  \n* 在单独浏览器标签页中打开页面上的所有链接。\n* 打开指向你本地天气预报的 URL。\n* 打开你经常查看的几个社交网络网站。\n\n# 使用 requests\
  \ 模块从网络下载文件\n\n`requests` 模块让你轻松地从网络下载文件，而无需担心网络错误、连接问题和数据压缩等复杂问题。`requests` 模块不随\
  \ Python 一起，因此你必须先安装它。在命令行运行 `pip install requests`。（附录 A 有关于如何安装第三方模块的更多细节。）\n\n\
  编写 `requests` 模块是因为 Python 的 `urllib2` 模块太复杂而难以使用。事实上，拿一把永久性马克笔，涂掉整个段落。忘记我曾提到过 `urllib2`\
  \ 就。如果你需要从网络下载东西，直接使用 `requests` 模块即可。\n\n接下来，做一个简单的测试以确保 `requests` 模块已正确安装。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import requests\n```\n\n如果没有显示错误信息，说明 `requests` 模块已成功安装。\n\
  \n## 使用 requests.get() 函数下载网页\n\n`requests.get()` 函数接收一个 URL 字符串进行下载。通过对 `requests.get()`\
  \ 的返回值调用 `type()`，你可以看到它返回一个 `Response` 对象，该对象包含了 Web 服务器对你的请求的响应。我稍后会详细解释 `Response`\
  \ 对象，但现在，在电脑连接时时在交互式 shell 中输入以下内容：\n\n```\n >>> import requests\n➊ >>> res = requests.get('http://www.gutenberg.org/cache/epub/1112/pg1112.txt')\n\
  \   >>> type(res)\n   <class 'requests.models.Response'>\n➋ >>> res.status_code\
  \ == requests.codes.ok\n   True\n   >>> len(res.text)\n   178981\n   >>> print(res.text[:250])\n\
  \   The Project Gutenberg EBook of Romeo and Juliet, by William Shakespeare\n\n\
  \   This eBook is for the use of anyone anywhere at no cost and with\n   almost\
  \ no restrictions whatsoever. You may copy it, give it away or\n   re-use it under\
  \ the terms of the Proje\n```\n\n该 URL 指向由 Gutenberg 项目 ➊ 提供的*罗密欧与朱丽叶*全剧文本网页。你可以通过检查\
  \ `Response` 对象的 `status_code` 属性来判断该网页请求是否成功。如果它等于 `requests.codes.ok` 的值，则说明一切正常\
  \ ➋。（顺便提到，HTTP 协议中“OK”的状态码是 200。你可能已经熟悉表示“未找到”的 404 状态。）\n\n如果请求成功，下载的网页将作为一个字符串存储在\
  \ `Response` 对象的 `text` 变量中。该变量持有整个剧的长字符串；调用 `len(res.text)` 显示其长度超过 178,000 个字符。最后，调用\
  \ `print(res.text[:250])` 只显示前 250 个字符。\n\n## 检查错误\n\n如你所见，`Response` 对象有一个 `status_code`\
  \ 属性，可以与 `requests.codes.ok` 进行比较以查看下载是否成功。检查成功的更简单方法是调用 `Response` 对象的 `raise_for_status()`\
  \ 方法。如果下载文件出错，该方法将抛出异常；如果下载成功，则什么都不做。在交互式 shell 中输入以下内容：\n\n```\n>>> res = requests.get('http://inventwithpython.com/page_that_does_not_exist')\n\
  >>> res.raise_for_status()\nTraceback (most recent call last):\n  File \"<pyshell#138>\"\
  , line 1, in <module>\n    res.raise_for_status()\n  File \"C:\\Python34\\lib\\\
  site-packages\\requests\\models.py\", line 773, in raise_for_status\n    raise HTTPError(http_error_msg,\
  \ response=self)\nrequests.exceptions.HTTPError: 404 Client Error: Not Found\n```\n\
  \n`raise_for_status()` 方法是确保在发生错误下载时停止程序的好方法。这是好事：你希望程序在发生意外错误时立即停止。如果下载失败对你的程序来说*不是*致命的，你可以用\
  \ `try` 和 `except` 语句包裹 `raise_for_status()` 行，以处理这种错误情况而不导致崩溃。\n\n```\nimport requests\n\
  res = requests.get('http://inventwithpython.com/page_that_does_not_exist')\ntry:\n\
  \    res.raise_for_status()\nexcept Exception as exc:\n    print('There was a problem:\
  \ %s' % (exc))\n```\n\n此 `raise_for_status()` 方法调用会导致程序输出以下内容：\n\n```\nThere was\
  \ a problem: 404 Client Error: Not Found\n```\n\n在调用 `requests.get()` 之后，始终调用 `raise_for_status()`。\n\
  \n\n\n\n`requests` 模块的内容就此结束！`for` 循环和 `iter_content()` 等内容可能比你编写文本文件时使用的 `open()`/`write()`/`close()`\
  \ 工作流复杂，但这是为了确保即使在下载大文件，`requests` 模块也不会占用过多内存。你可以从 [http://requests.readthedocs.org/]\
  \ 了解 `requests` 模块的其他功能。\n\n# HTML\n\n在拆解网页之前，你将学习一些 HTML 基础知识。你还将看到如何访问浏览器强大的开发者工具，这将使得从网络上抓取信息变得简单得多。\n\
  \n## 学习 HTML 的资源\n\n*超文本标记语言 (HTML)* 是网页编写的格式。本章假设你已经具有了一些 HTML 基础经验，但如果你需要初学者教程，我建议以下网站之一：\n\
  \n- [http://htmldog.com/guides/html/beginner/]\n- [http://www.codecademy.com/tracks/web/]\n\
  - [https://developer.mozilla.org/en-US/learn/html/]\n\n## 快速回顾\n\n以防你已经有一段时间没看 HTML\
  \ 了，这里有一个基础知识的快速概述。HTML 文件是带有 `.html` 扩展名的纯文本文件。这些文件中的文本被*标签*（tags）围绕，标签是包含尖括号的单词。标签告诉浏览器如何格式化网页。起始标签和结束标签可以包含某些文本形成一个*元素*（element）。*文本*（或*内层\
  \ HTML*）是起始标签和结束标签之间的内容。例如，以下 HTML 将浏览器中显示 *Hello world!*，其中 *Hello* 会加粗：\n\n```\n\
  <<strong>Hello</strong> world!\n```\n\n此 HTML 在浏览器中看起来会像 图 11-1 一样\n\n![在浏览器中渲染的\
  \ Hello world!](img/httpatomoreillycomsourcenostarchimages2189643.png.jpg)\n\n图\
  \ 11-1. 在浏览器中渲染的 *Hello world!*\n\n起始标签 `<<strong>` 表示所包含的文本将以粗体显示。结束标签 `</strong>`\
  \ 告诉浏览器粗体文本的结束位置。\n\nHTML 中有许多不同的标签。其中一些标签在尖括号内具有名为*属性*（attributes）的额外属性。例如，`<a>`\
  \ 标签包含了应该是链接的文本。文本所链接的 URL 由 `href` 属性决定。这里有一个例子：\n\n```\nAl's free <a href=\"http://inventwithpython.com\"\
  >Python books</a>.\n```\n\n此 HTML 在浏览器中看起来会像 图 11-2 一样\n\n![在浏览器中渲染的链接](img/httpatomoreillycomsourcenostarchimages2189645.png.jpg)\n\
  \n图 11-2. 在浏览器中渲染的链接\n\n某些元素具有 `id` 属性，用于唯一标识页面中的该元素。你经常会指示程序通过其 `id` 属性寻找元素，因此使用浏览器的开发者工具确定元素的\
  \ `id` 属性是编写网络爬虫程序时的常见任务。\n\n## 查看网页的 HTML 源代码\n\n你需要查看程序将处理的网页的 HTML 源代码。要此操作，在网络浏览器的任何网页上点击右键（或在\
  \ OS X 上按 CTRL 点击），并选择“查看源代码”或“查看页面源代码”以查看页面的 HTML 文本（参见 图 11-3）。这是你的浏览器实际接收的文本。浏览器知道如何从此\
  \ HTML 显示或*渲染*网页。\n\n![查看网页源代码](img/httpatomoreillycomsourcenostarchimages2189647.png.jpg)\n\
  \n图 11-3. 查看网页源代码\n\n我强烈建议查看你喜的一些网站的源代码。即使你在查看源代码时并不完全理解你看到了什么也没关系。编写简单的网络爬虫程序不需要精通\
  \ HTML——毕竟，你不需要编写自己的网站。你只需要足够的知识从现有网站中提取数据。\n\n## 打开浏览器的开发者工具\n\n除了查看网页源代码，你还可以使用浏览器的开发者工具查看页面\
  \ HTML。在 Windows 的 Chrome 和 Internet Explorer 中，开发者工具已经安装好，你可以按 `F12` 让它们出现（参见 图\
  \ 11-4）。再次按 `F12` 将使开发者工具消失。在 Chrome 中，你也可以通过选择查看▸开发▸开发者工具来调出开发者工具。在 OS X 上，按 `![](img/httpatomoreillycomsourcenostarchimages2189649.png.jpg)-OPTION-I`\
  \ 将打开 Chrome 的开发者工具。\n\n![Chrome 浏览器中的开发者工具窗口](img/httpatomoreillycomsourcenostarchimages2189651.png.jpg)\n\
  \n图 11-4. Chrome 浏览器中的开发者工具窗口\n\n在 Firefox 中，你可以在 Windows 和 Linux 上按 `CTRL-SHIFT-C`\
  \ 或在 OS X 上按 `⌘-OPTION-C` 来打开 Web 开发者工具检查器。布局与 Chrome 的开发者工具几乎相同。\n\n在 Safari 中，打开“设置”窗口，在“高级”面板中勾选“在菜单栏显示开发菜单”选项。启用后，你可以按\
  \ `![](img/httpatomoreillycomsourcenostarchimages2189649.png.jpg)-OPTION-I` 调出开发者工具。\n\
  \n在浏览器中启用或安装开发者工具后，你可以右键点击网页的任何部分，并从上下文菜单中选择“检查元素”，调出负责该页面部分的 HTML。当你开始为你的网络爬虫程序解析\
  \ HTML 时，这将非常有帮助。\n\n### 不要使用正则表达式解析 HTML\n\n在字符串中定位特定的 HTML 片段似乎是正则表达式的完美用例。然而，我不建议你这样做。HTML\
  \ 有许多不同的格式化方式仍然可以被视为有效的 HTML，但尝试在正则表达式中捕获所有可能的变体非常繁琐且容易出错。专门为解析 HTML 开发的模块（例如 Beautiful\
  \ Soup）较不容易产生 bug。\n\n你可以在此处找到关于为什么你不应该用正则表达式解析 HTML 的扩展论证：[http://stackoverflow.com/a/1732454/1893164/]。\n\
  \n## 使用开发者工具查找 HTML 元素\n\n一旦你的程序使用 `requests` 模块下载了网页，你将获得页面的 HTML 内容作为一个单个字符串值。现在，你需要确定\
  \ HTML 的哪个部分对应你感兴趣的网页上的信息。\n\n这就是浏览器的开发者工具可以提供帮助的地方。假设你想写一个程序从 [http://weather.gov/]\
  \ 获取天气预报数据。在编写任何代码之前，先做研究。如果你访问该网站并搜索邮政编码 94105，网站将带你进入显示该区域预报的页面。\n\n如果你对抓取该邮政编码的温度信息感兴趣怎么办？在页面相应位置右键（或在\
  \ OS X 上按 CONTROL 点击），并在出现的上下文菜单中选择“检查元素”。这将调出开发者工具窗口，它向你显示生成网页特定部分的 HTML。图 11-5\
  \ 显示了开发者工具打开到温度对应的 HTML。\n\n\n\n\n\n![使用开发者工具检查持有温度文本的元素](img/httpatomoreillycomsourcenostarchimages2189653.png.jpg)\n\
  \n图 11-5. 使用开发者工具检查持有温度文本的元素\n\n通过开发者工具，你可以看到网页温度部分的 HTML 代码是 `<p class=\"myforecast-current\
  \ -lrg\">57°F</p>`。这正是你要寻找的内容！看起来温度信息包含在一个具有 `myforecast-current-lrg` 类的 `<p>` 元素中。现在你已经知道要找什么，`BeautifulSoup`\
  \ 模块将帮助你从字符串中找到它。\n\n# 使用 BeautifulSoup 模块解析 HTML\n\nBeautiful Soup 是一个用于从 HTML\
  \ 页面提取信息的模块（对于这个目的，它比正则表达式要好得多）。`BeautifulSoup` 模块的名称为 `bs4`（代表 Beautiful Soup 版本\
  \ 4）。要安装它，你需要在命令行运行 `pip install beautifulsoup4`。（有关安装第三方模块的说明，请查看附录 A。）虽然安装时使用的名称是\
  \ `beautifulsoup4`，但导入 Beautiful Soup 时运行 `import bs4`。\n\n在本章中，Beautiful Soup 的示例将\
  \ `parse`（即分析并识别部分）硬盘上的一个 HTML 文件。在 IDLE 中打开一个新文件编辑器窗口，输入以下内容并将其保存为 `example.html`。或者，也可以从\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 下载它。\n\n```\n\
  <!-- 这是一个 example.html 示例文件 -->\n\n<html><head><title>网站标题</title></head>\n<<body>\n\
  <p>从 <a href=\"http://\ninventwithpython.com\">我的网站</a> 下载我的 <strong>Python</strong>\
  \ 书。</p>\n<p class=\"slogan\">用简单的方法学习 Python 吧！</p>\n<p>作者：<span id=\"author\"\
  >Al Sweigart</span></p>\n</body></html>\n```\n\n如你所见，即使是简单的 HTML 文件也涉及许多不同的标签和属性，在复杂的网站中，这些事情很快就会变得混乱。幸运的是，Beautiful\
  \ Soup 让处理 HTML 变得简单得多。\n\n## 从 HTML 创建 BeautifulSoup 对象\n\n需要调用 `bs4.BeautifulSoup()`\
  \ 函数，并传入包含其要解析的 HTML 的字符串。`bs4.BeautifulSoup()` 返回的是一个 `BeautifulSoup` 对象。在电脑连接互联网时，在交互\
  \ shell 中输入以下内容：\n\n```\n>>> import requests, bs4\n>>> res = requests.get('http://nostarch.com')\n\
  >>> res.raise_for_status()\n>>> noStarchSoup = bs4.BeautifulSoup(res.text)\n>>>\
  \ type(noStarchSoup)\n<class 'bs4.BeautifulSoup'>\n```\n\n这段代码使用 `requests.get()`\
  \ 从 No Starch Press 网站下载首页，并将响应的 `text` 属性传递给 `bs4.BeautifulSoup()`。返回的 `BeautifulSoup`\
  \ 对象存储在名为 `noStarchSoup` 的变量中。\n\n你也可以通过向 `bs4.BeautifulSoup()` 传递 `File` 对象来从硬盘加载\
  \ HTML 文件。在交互 shell 中输入以下内容（确保 `example.html` 文件位于工作目录）：\n\n```\n>>> exampleFile\
  \ = open('example.html')\n>>> exampleSoup = bs4.BeautifulSoup(exampleFile)\n>>>\
  \ type(exampleSoup)\n<class 'bs4.BeautifulSoup'>\n```\n\n一旦你拥有了 `BeautifulSoup`\
  \ 对象，就可以使用它的方法来定位 HTML 文档的特定部分。\n\n## 使用 select() 方法查找元素\n\n你可以通过调用 `select()` 方法并传递一个要查找元素的\
  \ CSS 选择器字符串，从 `BeautifulSoup` 对象中检索网页元素。选择器类似于正则表达式：它们指定了要查找的模式，在这种情况下是在 HTML 页面中而不是普通文本字符串。\n\
  \n关于 CSS 选择器语法的详细讨论超出了本书的范围（在 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 的资源中有一个很好的选择器教程），但这里是对选择器的简要介绍。表 11-2 显示了常见的 CSS 选择器模式示例。\n\n| 传递给 `select()`\
  \ 方法的选择器 | 将匹配 |\n| --- | --- |\n| `soup.select('div')` | 所有名为 `<div>` 的元素 |\n|\
  \ `soup.select('#author')` | 具有 `id=\"author\"` 元素 |\n| `soup.select('.notice')`\
  \ | 所有使用名为 `notice` 的 CSS `class` 属性的元素 |\n| `soup.select('div span')` | 所有位于名为\
  \ `<div>` 元素内部的 `<span>` 元素 |\n| `soup.select('div > span')` | 所有*直接*位于名为 `<div>`\
  \ 元素内部且中间没有其他元素的 `<span>` 元素 |\n| `soup.select('input[name]')` | 所有具有任何值的 `name`\
  \ 属性的 `<input>` 元素 |\n| `soup.select('input[type=\"button\"]')` | 所有具有 `type=\"\
  button\"` 值的 `<input>` 元素 |\n\n## 从元素的属性获取数据\n\n`Tag` 对象的 `get()` 方法使得访问元素的属性值变得简单。该方法接收属性名称字符串并返回该属性的值。使用\
  \ `example.html`，在交互 shell 中输入以下内容：\n\n\n\n\n\n```\n>>> import bs4\n>>> soup = bs4.BeautifulSoup(open('example.html'))\n\
  >>> spanElem = soup.select('span')[0]\n>>> str(spanElem)\n'<span id=\"author\">Al\
  \ Sweigart</span>'\n>>> spanElem.get('id')\n'author'\n>>> spanElem.get('some_nonexistent_addr')\
  \ == None\nTrue\n>>> spanElem.attrs\n{'id': 'author'}\n```\n\n在这里我们使用 `select()`\
  \ 来查找任何 `<span>` 元素，并将第一个匹配的元素存储在 `spanElem` 中。将属性名称 `'id'` 传递给 `get()` 会返回属性的值\
  \ `'author'`。\n\n# 项目：“我手气不错”Google 搜索\n\n每当我在 Google 上搜索一个主题时，我并不会只看一个搜索结果。通过中键点击搜索结果链接（或在按住\
  \ `CTRL` 时点击），我会在一组新标签页中打开前几个链接，以便稍后阅读。我经常搜索 Google，这种工作流——打开浏览器、搜索主题、并逐一中键点击几个链接——非常乏味。如果我只需在命令行中输入搜索词，我的电脑就能自动打开浏览器并在新标签页中显示所有顶部搜索结果，那就太好了。让我们写一个脚本来实现这一功能。\n\
  \n这是你的程序执行的操作：\n\n* 从命令行参数获取搜索关键词。\n* 获取搜索结果页。\n* 为每个结果打开一个浏览器标签页。\n\n这意味着你的代码需要执行以下操作：\n\
  \n* 从 `sys.argv` 读取命令行参数。\n* 使用 `requests` 模块获取搜索结果页。\n* 找到每个搜索结果的链接。\n* 调用 `webbrowser.open()`\
  \ 函数打开网络浏览器。\n\n打开一个新的文件编辑器窗口并将其保存为 `lucky.py`。\n\n## 第 1 ：获取命令行参数并请求搜索页面\n\n在编写任何代码之前，你首先需要知道搜索结果页的\
  \ URL。通过在 Google 搜索后查看浏览器的地址栏，你可以看到结果页有一个类似于 `https://www.google.com/search?q=SEARCH_TERM_HERE`\
  \ 的 URL。`requests` 模块可以下载此页面，然后你可以使用 Beautiful Soup 在 HTML 中查找搜索结果链接。最后，你将使用 `webbrowser`\
  \ 模块在浏览器标签页中打开这些链接。\n\n让你的代码看起来像下面：\n\n```\n#! python3\n# lucky.py - 打开多个 Google\
  \ 搜索结果。\n\nimport requests, sys, webbrowser, bs4\n\nprint('Googling...') # 在下载 Google\
  \ 页面时显示文本\nres = requests.get('http://google.com/search?q=' + ' '.join(sys.argv[1:]))\n\
  res.raise_for_status()\n\n# TODO: 获取顶部搜索结果链接。\n\n# TODO: 为每个结果打开一个浏览器标签页。\n```\n\
  \n用户在启动程序时使用命令行参数指定搜索词。这些参数将作为字符串存储在 `sys.argv` 列表中。\n\n## 第 2 步：找到所有结果\n\n现在，你需要使用\
  \ Beautiful Soup 从下载的 HTML 中提取顶部的搜索结果链接。但你如何找到该该工作的正确选择器呢？例如，你不能只搜索所有的 `<a>` 标签，因为\
  \ HTML 中有很多你并不关心的链接。相反，你必须使用浏览器的开发者工具检查搜索结果页，尝试找到一个能够只选出你想要的链接的选择器。\n\n在 Google\
  \ 上搜索 *Beautiful Soup* 之后，你可以打开浏览器的开发者工具并检查页面上的一些链接元素。它们看起来极其复杂，类似于这样：`<a href=\"\
  /url?sa =t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=1&amp;cad=rja&amp;uact=8&\
  \ amp;ved=0CCgQFjAA&amp;url=http%3A%2F%2Fwww.crummy.com%2Fsoftware%2FBeautifulSoup\
  \ %2F&amp;ei=LHBVU_XDD9KVyAShmYDwCw&amp;usg=AFQjCNHAxwplurFOBqg5cehWQEVKi-TuLQ&a\
  \ mp;sig2=sdZu6WVlBlVSDrwhtworMA\" onmousedown=\"return rwt(this,'','','','1','AFQ\
  \ jCNHAxwplurFOBqg5cehWQEVKi-TuLQ','sdZu6WVlBlVSDrwhtworMA','0CCgQFjAA','','',ev\
  \ ent)\" data-href=\"http://www.crummy.com/software/BeautifulSoup/\"><em>Beautiful\
  \ Soup</em>: We called him Tortoise because he taught us.</a>`。\n\n元素看起来极其复杂这没关系。你只需要找到所有搜索结果链接都具有的模式。但这个\
  \ `<a>` 元素并没有可以轻松将其与页面上非搜索结果 `<a>` 元素区分来来。\n\n让你的代码看起来像下面：\n\n```\n#! python3\n\
  # lucky.py - 打开多个 google 搜索结果。\n\nimport requests, sys, webbrowser, bs4\n\n--snip--\n\
  \n# 获取顶部搜索结果链接。\nsoup = bs4.BeautifulSoup(res.text)\n\n# 为每个结果打开一个浏览器标签页。\nlinkElems\
  \ = soup.select('.r a')\n```\n\n但是，如果你在 `<a>` 元素上向上看，会发现一个这样的元素：`<h3 class=\"r\"\
  >`。通过查看 HTML 源码的其他部分，发现 `r` 类似乎仅用于搜索结果链接。你不需要知道 CSS 类 `r` 是什么或它有什么用。你只需要将其用作你正在寻找的\
  \ `<a>` 元素的标记。你可以从下载的页面的 HTML 文本创建一个 `BeautifulSoup` 对象，然后使用选择器 `'.r a'` 来找到所有位于具有\
  \ `r` CSS 类元素内的 `<a>` 元素。\n\n## 第 3 步：为每个结果打开浏览器\n\n最后，我们将告诉程序为我们的结果打开浏览器标签页。将以下内容添加到你程序的末尾：\n\
  \n```\n#! python3\n# lucky.py - 打开多个 google 搜索结果。\n\nimport requests, sys, webbrowser,\
  \ bs4\n\n--snip--\n\n# 为每个结果打开一个浏览器标签页。\nlinkElems = soup.select('.r a')\nnumOpen\
  \ = min(5, len(linkElems))\nfor i in range(numOpen):\n    webbrowser.open('http://google.com'\
  \ + linkElems[i].get('href'))\n```\n\n默认情况下，你使用 `webbrowser` 模块在新标签页中打开前五个搜索结果。然而，用户搜索的内容可能少于五个。`soup.select()`\
  \ 调用返回所有匹配你的 `'.r a'` 选择器的元素列表，因此你想打开的标签页数量是 `5` 或该列表的长度（取较小者）。\n\nPython 内置函数 `min()`\
  \ 返回它所接收的整数或浮点数参数的最小值。（还有一个内置的 `max()` 函数返回它所接收参数的最大值。）你可以使用 `min()` 来判断列表中是否少于五个链接，并将打开打开链接数量存储在名为\
  \ `numOpen` 的变量中。然后你可以通过调用 `range(numOpen)` 来运行 `for` 循环。\n\n在循环的每次迭代中，你使用 `webbrowser.open()`\
  \ 在浏览器中打开新标签页。注意返回的 `<a>` 元素中的 `href` 属性值不包含初始的 `http://google.com` 部分，因此你需要将其与\
  \ `href` 属性的字符串值拼接。\n\n现在你可以通过在命令行运行 `lucky python programming tutorials` 来立即打开\
  \ *Python 教程* 前五个 Google 搜索结果！（关于如何在操作系统上轻松运行程序，请参见附录 B。）\n\n## 类似程序的创意\n\n下载所有\
  \ XKCD 漫画\n\n博客和其他经常更新的网站通常有一个包含最新文章的首页，页面上的“上一个”按钮可以带你进入上一个文章。该文章也会有一个“上一个”按钮，依此类推，形成了一条从最新页面到站点第一个文章的轨迹。如果你想拥有站点内容的副本以便在离线时阅读，你可以手动导航到每个页面并保存每一个。但这些工作非常无聊，所以让我们写一个程序来完成它吧。\n\
  \n\n\n\nXKCD 是一个流行的极客网络漫画，其网站符合这种结构（参见图 11-6”）。`[`xkcd.com/`](http://xkcd.com/)`\
  \ 首页有一个 `Prev` 按钮，引导用户返回之前的漫画。手动下载每部漫画需要花费大量时间，但你可以编写一个脚本在几分钟内完成任务。\n\n以下是你的程序的功能：\n\
  \n* 加载 XKCD 首页。\n* 保存页面上的漫画图像。\n* 跟随“上一部漫画”链接。\n* 重复上述过程直到到达第一部漫画。\n\n![XKCD，“关于浪漫、讽刺、数学和语言的网络漫画”](img/httpatomoreillycomsourcenostarchimages2189655.png.jpg)\n\
  \n图 11-6. XKCD，“关于浪漫、讽刺、数学和语言的网络漫画”\n\n这意味着你的代码需要执行以下操作：\n\n* 使用 `requests` 模块下载页面。\n\
  * 使用 Beautiful Soup 找到页面中漫画图像的 URL。\n* 使用 `iter_content()` 下载并将漫画图像保存到硬盘上。\n* 找到“上一部漫画”链接的\
  \ URL 并重复。\n\n打开一个新的文件编辑器窗口并将其保存为 `downloadXkcd.py`。\n\n## 第 1 步：设计程序\n\n如果你打开浏览器开发者工具并检查页面上的元素，你会发现以下内容：\n\
  \n* 漫画图像文件的 URL 由 `<img>` 元素的 `href` 属性提供。\n* `<img>` 元素位于 `<div id=\"comic\">`\
  \ 元素内部。\n* `Prev` 按钮有一个值为 `prev` 的 `rel` HTML 属性。\n* 第一部漫画的 `Prev` 按钮链接到 `[`xkcd.com/#`](http://xkcd.com/#)`\
  \ URL，表示没有更多的页面了。\n\n让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py - 下载每一部\
  \ XKCD 漫画。\n\nimport requests, os, bs4\n\nurl = 'http://xkcd.com'              #\
  \ 起始 url\nos.makedirs('xkcd', exist_ok=True)   # 将漫画存储在 ./xkcd\nwhile not url.endswith('#'):\n\
  \    # TODO: 下载页面。\n\n    # TODO: 找到漫画图像的 URL。\n\n    # TODO: 下载图像。\n\n    # TODO:\
  \ 将图像保存到 ./xkcd。\n\n    # TODO: 获取 Prev 按钮的 url。\n\nprint('Done.')\n```\n\n你有一个\
  \ `url` 变量，其初始值为 `'http://xkcd.com'`，并反复（在 `for` 循环中）将其更新为当前页面 Prev 链接的 URL。在循环的每一步中，你都会下载\
  \ `url` 处的漫画。当 `url` 以 `'#'` 结尾时，你就知道循环结束了。\n\n你把图像文件下载到当前工作目录下名为 `xkcd` 的文件夹中。`os.makedirs()`\
  \ 调用确保该文件夹存在，而 `exist_ok=True` 关键字参数防止函数在文件夹已存在时抛出异常。代码的其他部分只是概述你程序剩余部分的注释。\n\n\
  ## 第 2 步：下载网页\n\n让我们实现下载页面的代码。让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py\
  \ - 下载每一部 XKCD 漫画。\n\nimport requests, os, bs4\n\nurl = 'http://xkcd.com'      \
  \        # 起始 url\nos.makedirs('xkcd', exist_ok=True)   # 将漫画存储在 ./xkcd\nwhile not\
  \ url.endswith('#'):\n    # 下载页面。\n    print('Downloading page %s...' % url)\n \
  \   res = requests.get(url)\n    res.raise_for_status()\n\n    soup = bs4.BeautifulSoup(res.text)\n\
  \n    # TODO: 找到漫画图像的 URL。\n\n    # TODO: 下载图像。\n\n    # TODO: 将图像保存到 ./xkcd。\n\n\
  \    # TODO: 获取 Prev 按钮的 url。\n\nprint('Done.')\n```\n\n首先，打印 `url` 让用户知道程序即将下载哪个\
  \ URL；然后使用 `requests` 模块的 `request.get()` 函数下载它。一如既常，你立即调用 `Response` 对象的 `raise_for_status()`\
  \ 方法，如果在下载过程中出现问题，则抛出异常并结束程序。否则，你从下载页面的文本中创建一个 `BeautifulSoup` 对象。\n\n## 第 3 步：查找并下载漫画图像\n\
  \n让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py - 下载每一部 XKCD 漫画。\n\nimport\
  \ requests, os, bs4\n\n--snip--\n\n    # 找到漫画图像的 URL。\n    comicElem = soup.select('#comic\
  \ img')\n    if comicElem == []:\n         print('Could not find comic image.')\n\
  \    else:\n         comicUrl = comicElem[0].get('src')\n         # 下载图像。\n    \
  \     print('Downloading image %s...' % (comicUrl))\n         res = requests.get(comicUrl)\n\
  \         res.raise_for_status()\n\n    # TODO: 将图像保存到 ./xkcd。\n\n    # TODO: 获取\
  \ Prev 按钮的 url。\n\nprint('Done.')\n```\n\n通过开发者工具检查 XKCD 首页，你知道用于漫画图像的 `<img>` 元素位于\
  \ `id` 属性设置为 `comic` 的 `<div>` 元素内部，因此选择器 `'#comic img'` 将从 `BeautifulSoup` 对象中获取正确的\
  \ `<img>` 元素。\n\n某些 XKCD 页面包含不是简单图像文件的特殊内容。没关系；你只需跳过它们。如果你的选择器没有找到任何元素，`soup.select('#comic\
  \ img')` 将返回一个空列表。当这种情况发生时，程序只需打印错误消息并继续，而不下载图像。\n\n否则，选择器将返回一个包含一个 `<img>` 元素的列表。你可以从这个\
  \ `<img>` 元素获取 `src` 属性，并将其传递给 `requests.get()` 以下载漫画图像文件。\n\n## 第 4 步：保存图像并查找上一部漫画\n\
  \n让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py - 下载每一部 XKCD 漫画。\n\nimport\
  \ requests, os, bs4\n\n--snip--\n\n        # 将图像保存到 ./xkcd。\n        imageFile =\
  \ open(os.path.join('xkcd', os.path.basename(comicUrl)), 'wb')\n        for chunk\
  \ in res.iter_content(100000):\n            imageFile.write(chunk)\n        imageFile.close()\n\
  \n    # 获取 Prev 按钮的 url。\n    prevLink = soup.select('a[rel=\"prev\"]')[0]\n   \
  \ url = 'http://xkcd.com' + prevLink.get('href')\n\nprint('Done.')\n```\n\n此时，漫画的图像文件存储在\
  \ `res` 变量中。你需要将此图像数据写入硬盘上的文件。\n\n你需要为本地图像准备一个文件名以传递给 `open()`。`comicUrl` 将具有类似于\
  \ `'http://imgs.xkcd.com/comics/heartbleed_explanation.png'` 的值——你可能已经注意到它看起来像文件路径。事实上，你可以对\
  \ `comicUrl` 调用 `os.path.basename()`，它将仅返回 URL 的最后部分 `'heartbleed_explanation.png'`。你可以将其作为保存图像到硬盘时的文件名。你使用\
  \ `os.path.join()` 将此名称与 `xkcd` 文件夹名称合并，这样你的程序在 Windows 上使用反斜杠 (`\\`)，在 OS X 和 Linux\
  \ 上使用正斜杠 (`/`)。现在你终于有了文件名，可以调用 `open()` 以 `'wb'` “二进制写入”模式打开新文件。记得本章前面提到的，为了保存使用\
  \ Requests 下载的文件，你需要遍历 `iter_content()` 方法的返回值。`for` 循环中的代码将图像数据块（每个最多 100,000 字节）写入文件，然后关闭文件。图像现在已保存到你的硬盘上。\n\
  \n之后，选择器 `'a[rel=\"prev\"]'` 识别 `rel` 属性设置为 `prev` 的 `<a>` 元素，你可以使用此 `<a>` 元素的 `href`\
  \ 属性获取上一部漫画的 URL，将其存储在 `url` 中。然后 `while` 循环将为该漫画再次开始整个下载过程。\n\n该程序的输出看起来如下：\n\n\
  \n\n\n\n```\nDownloading page http://xkcd.com...\nDownloading image http://imgs.xkcd.com/comics/phone_alarm.png...\n\
  Downloading page http://xkcd.com/1358/...\nDownloading image http://imgs.xkcd.com/comics/nro.png...\n\
  Downloading page http://xkcd.com/1357/...\nDownloading image http://imgs.xkcd.com/comics/free_speech.png...\n\
  Downloading page http://xkcd.com/1356/...\nDownloading image http://imgs.xkcd.com/comics/orbital_mechanics.png...\n\
  Downloading page http://xkcd.com/1355/...\nDownloading image http://imgs.xkcd.com/comics/airplane_message.png...\n\
  Downloading page http://xkcd.com/1354/...\nDownloading image http://imgs.xkcd.com/comics/heartbleed_explanation.png...\n\
  --snip--\n```\n\n该项目是一个良好的示例，展示了如何自动跟踪链接以从 Web 上抓取大量数据。你可以从它的文档中了解 Beautiful Soup\
  \ 的其他功能：*[`www.crummy.com/software/BeautifulSoup/bs4/doc/`](http://www.crummy.com/software/BeautifulSoup/bs4/doc/)*。\n\
  \n## 类似程序的创意\n\n下载页面和跟踪链接是许多网络爬虫程序的基础。类似的程序还可以执行以下操作：\n\n*   通过跟踪所有的链接来备份整个网站。\n\
  *   复制网络论坛所有的消息。\n*   复制在线商店的销售商品目录。\n\n只要你能够找到传递给 `requests.get()` 的 URL，`requests`\
  \ 和 `BeautifulSoup` 模块就是非常好用的。然而，有时找到它 并不容易。或者，你希望程序导航的网站可能要求你先登录。`selenium` 模块将赋予程序执行此类复杂任务的能力。\n\
  \n# 使用 selenium 模块控制浏览器\n\n`selenium` 模块允许 Python 通过程序化点击链接和填写登录信息来直接控制浏览器，就像有一个人类用户与页面交互一样。Selenium\
  \ 允许你以比 Requests 和 Beautiful Soup 更高级的方式与网页进行交互；但因为它启动了网络浏览器，它的速度有点慢，而且如果你只需要从 Web\
  \ 上下载一些文件，它很难在后台运行。\n\n附录 A 提供了关于安装第三方模块的更详细步骤。\n\n## 启动 Selenium 控制的浏览器\n\n对于这些示例，你需要\
  \ Firefox 浏览器。这将是你你所控制的浏览器。如果你还没有 Firefox，可以从 *[`getfirefox.com/`](http://getfirefox.com/)*\
  \ 免费下载。\n\n导入 Selenium 模块稍微有点棘。你不需要运行 `import selenium`，而是需要运行 `from selenium import\
  \ webdriver`。（`selenium` 模块这样设置的确切原因超出了本书的范围。）之后，你就可以用 Selenium 启动 Firefox 浏览器。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> from selenium import webdriver\n>>> browser = webdriver.Firefox()\n\
  >>> type(browser)\n<class 'selenium.webdriver.firefox.webdriver.WebDriver'>\n>>>\
  \ browser.get('http://inventwithpython.com')\n```\n\n你会注意到当调用 `webdriver.Firefox()`\
  \ 时，Firefox 浏览器就会启动了。对值 `webdriver.Firefox()` 调用 `type()` 可以发现它是 `WebDriver` 数据类型。调用\
  \ `browser.get('http://inventwithpython.com')` 会将浏览器重定向到 *[`inventwithpython.com/`](http://inventwithpython.com/)*。你的浏览器看起来应该像图\
  \ 11-7](#ch11.html_after_calling_webdriverdotfirefoxleft_pa \"Figure 11-7. 在 IDLE\
  \ 中调用 webdriver.Firefox() 和 get() 后，Firefox 浏览器出现了。\")\n\n![在 IDLE 中调用 webdriver.Firefox()\
  \ 和 get() 后，Firefox 浏览器出现了。](img/httpatomoreillycomsourcenostarchimages2189657.png.jpg)\n\
  \n图 11-7。在 IDLE 中调用 `webdriver.Firefox()` 和 `get()` 后，Firefox 浏览器出现了。\n\n## 在页面上查找元素\n\
  \n`WebDriver` 对象有很多用于在页面上查找元素的方法。它们被分为 `find_element_*` 和 `find_elements_*` 方法。`find_element_*`\
  \ 方法返回单个 `WebElement` 对象，代表页面上匹配你查询的第一个元素。`find_elements_*` 方法返回页面上每个匹配元素的 `WebElement_*`\
  \ 对象的列表。\n\n表 11-3 显示了在存储在变量 `browser` 中的 `WebDriver` 对象上调用 `find_element_*` 和 `find_elements_*`\
  \ 方法的几个示例。\n\n表 11-3. Selenium 用于查找元素的 WebDriver 方法\n\n| 方法名 | 返回的 WebElement 对象/列表\
  \ |\n| --- | --- |\n| | |\n```\nbrowser.find_element_by_class_name(name)\nbrowser.find_elements_by_class_name(name)\n\
  ```\n| 使用 CSS 类 `name` 的元素 |\n| | |\n```\nbrowser.find_element_by_css_selector(selector)\n\
  browser.find_elements_by_css_selector(selector)\n```\n| 匹配 CSS `selector` 的元素 |\n\
  | | |\n```\nbrowser.find_element_by_id(id)\nbrowser.find_elements_by_id(id)\n```\n\
  | 具有匹配的 `id` 属性值的元素 |\n| | |\n```\nbrowser.find_element_by_link_text(text)\nbrowser.find_elements_by_link_text(text)\n\
  ```\n| 完全匹配所提供 `text` 的 `<a>` 元素 |\n| | |\n```\nbrowser.find_element_by_partial_link_text(text)\n\
  browser.find_elements_by_partial_link_text(text)\n```\n| 包含所提供 `text` 的 `<a>` 元素\
  \ |\n| | |\n```\nbrowser.find_element_by_name(name)\nbrowser.find_elements_by_name(name)\n\
  ```\n| 具有匹配的 `name` 属性值的元素 |\n| | |\n```\nbrowser.find_element_by_tag_name(name)\n\
  browser.find_elements_by_tag_name(name)\n```\n| 具有匹配标签 `name` 的元素（不区分大小写；`<<a>>`\
  \ 元素由 'a' 匹配） |\n\n除了 `*_by_tag_name()` 方法，所有方法的参数都是区分大小写的。如果页面上不存在匹配方法查找的元素，`selenium`\
  \ 模块会抛出 `NoSuchElement` 异常。\n\n一旦有了 `WebElement` 对象，可以通过阅读属性或调用 表 11-4 中的方法来进一步了解它。\n\
  \n表 11-4. WebElement 属性和方法\n\n| 属性或方法 | 描述 |\n| --- | --- |\n| `tag_name` | 标签名，例如\
  \ `<a>` 元素的 'a' |\n| `get_attribute(name)` | 元素的 `name` 属性值 |\n| `text` | 元素内的文本，例如\
  \ `<span>hello</span>` 中的 'hello' |\n| `clear()` | 对于文本字段或文本区域，清除输入的文本 |\n| `is_displayed()`\
  \ | 如果元素可见则返回 `True`；否则返回 `False` |\n| `is_enabled()` | 对于输入元素，如果元素可用则返回 `True`；否则返回\
  \ `False` |\n| `is_selected()` | 对于复选框或单选按钮，如果元素被选中则返回 `True`；否则返回 `False` |\n|\
  \ `location` | 一个包含元素在页面位置的 'x' 和 'y' 的字典 |\n\n例如，打开一个新的文件编辑器并输入以下程序：\n\n```\nfrom\
  \ selenium import webdriver\nbrowser = webdriver.Firefox()\nbrowser.get('http://inventwithpython.com')\n\
  try:\n    elem = browser.find_element_by_class_name('bookcover')\n    print('Found\
  \ <%s> element with that class name!' % (elem.tag_name))\nexcept:\n    print('Was\
  \ not able to find an element with that name.')\n```\n\n在这里我们打开 Firefox 并将其重定向到\
  \ URL。在这个页面上，我们尝试查找类名为 `'bookcover' 的元素，如果找到了这样的元素，我们就使用 `tag_name` 属性打印它的标签名。如果没有找到此类元素，我们将打印一条不同的消息。\n\
  \n该程序将输出以下：\n\n```\nFound <img> element with that class name!\n```\n\n\n\n\n\n我们找到了一个类名为\
  \ `'bookcover'` 且标签名为 `'img'` 的元素。\n\n## 点击页面\n\n从 `find_element_*` 和 `find_elements_*`\
  \ 方法返回的 `WebElement` 对象具有 `click()` 方法，该方法可以模拟对该元素进行鼠标点击。此方法用于跳转链接、选择单选按钮、点击 `Submit`\
  \ 按钮，或触发元素被鼠标点击时可能发生的任何操作。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> from selenium import\
  \ webdriver\n>>> browser = webdriver.Firefox()\n>>> browser.get('http://inventwithpython.com')\n\
  >>> linkElem = browser.find_element_by_link_text('Read It Online')\n>>> type(linkElem)\n\
  <class 'selenium.webdriver.remote.webelement.WebElement'>\n>>> linkElem.click()\
  \ # 点击“Read It Online”链接\n```\n\n这会打开 Firefox 访问 `http://inventwithpython.com/`，获取文本为\
  \ `Read It Online` 的 `<a>` 元素的 `WebElement` 对象，然后模拟点击该 `<a>` 元素。这就像你自己点击了链接一样；浏览器随后会跟随该链接。\n\
  \n## 填写并提交表单\n\n向网页上的文本框发送按键，只需要找到该文本框对应的 `<input>` 或 `<textarea>` 元素，然后调用 `send_keys()`\
  \ 方法。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> from selenium import webdriver\n>>> browser\
  \ = webdriver.Firefox()\n>>> browser.get('http://gmail.com')\n>>> emailElem = browser.find_element_by_id('Email')\n\
  >>> emailElem.send_keys('not_my_real_email@gmail.com')\n>>> passwordElem = browser.find_element_by_id('Passwd')\n\
  >>> passwordElem.send_keys('12345')\n>>> passwordElem.submit()\n```\n\n只要 Gmail\
  \ 自此书出版以来没有更改用户名和密码文本框的 `id`，之前的代码就会用提供的文本填充这些文本框。（（你可以随时使用浏览器的检查器来验证 `id`。））在任何元素上调用\
  \ `submit()` 方法的效果与点击该元素所所在表单的 Submit 按钮相同。（你完全可以同样调用 `emailElem.submit()`，代码的效果是一样的。）\n\
  \n## 发送特殊键\n\nSelenium 有一个键盘键模块，用于处理无法输入到字符串值中的键，其功能类似于转义字符。这些值存储在 `selenium.webdriver.common.keys`\
  \ 模块的属性中。由于该模块名称非常长，在程序开头运行 `from selenium.webdriver.common.keys import Keys` 要简单得多；如果这样做了，你可以在任何通常需要写\
  \ `selenium.webdriver.common.keys` 的地方直接编写 `Keys` 即可。表 11-5 列出了常用的 `Keys` 变量。\n\n\
  表 11-5. `selenium.webdriver.common.keys` 模块中的常用变量\n\n| 属性 | 含义 |\n| --- | --- |\n\
  | `Keys.DOWN`, `Keys.UP`, `Keys.LEFT`, `Keys.RIGHT` | 键盘方向键 |\n| `Keys.ENTER`, `Keys.RETURN`\
  \ | 回车键和 Return 键 |\n| `Keys.HOME`, `Keys.END`, `Keys.PAGE_DOWN`, `Keys.PAGE_UP`\
  \ | `home`, `end`, `pagedown` 和 `pageup` 键 |\n| `Keys.ESCAPE`, `Keys.BACK_SPACE`,\
  \ `Keys.DELETE` | ESC, BACKSPACE 和 DELETE 键 |\n| `Keys.F1`, `Keys.F2`,..., `Keys.F12`\
  \ | 键盘顶部的 F1 到 F12 键 |\n| `Keys.TAB` | TAB 键 |\n\n例如，如果光标不在文本框中，按下 HOME 和 END 键将分别将浏览器滚动到顶部和底部。在交互式\
  \ shell 中输入以下内容，注意 `send_keys()` 调用是如何滚动页面的：\n\n```\n>>> from selenium import webdriver\n\
  >>> from selenium.webdriver.common.keys import Keys\n>>> browser = webdriver.Firefox()\n\
  >>> browser.get('http://nostarch.com')\n>>> htmlElem = browser.find_element_by_tag_name('html')\n\
  >>> htmlElem.send_keys(Keys.END)     # 滚动到底部\n>>> htmlElem.send_keys(Keys.HOME)\
  \    # 滚动到顶部\n```\n\n`<html>` 标签是 HTML 文件的基础标签：HTML 文件的完整内容包含在 `<html>` 和 `</html>`\
  \ 标签内。调用 `browser.find_element_by_tag_name('html')` 是向整个网页发送按键的好地方。如果例如，当你滚动到页面底部后加载了新内容，这将会非常有用。\n\
  \n## 点击浏览器按钮\n\nSelenium 可以通过以下方法模拟对各种浏览器按钮的点击：\n\n- `browser.back()`。点击后退按钮。\n\
  - `browser.forward()`。点击前进按钮。\n- `browser.refresh()`。点击刷新按钮。\n- `browser.quit()`。点击关闭按钮。\n\
  \n## 关于 Selenium 的更多信息\n\nSelenium 的功能远超这里描述的内容。它可以修改浏览器的 cookie、截屏以及运行 JavaScript。要了解更多这些功能，请访问\
  \ `selenium-python.org/`。\n\n## 总结\n\n大多数任务并不限于文件。要能够自动化任何网页，你需要直接控制浏览器。`requests`\
  \ 模块让下载变得简单直观，通过掌握一些选择器的知识，你可以利用\n\n## 练习题\n\n1. 简述 `webbrowser`、`requests`、`BeautifulSoup`\
