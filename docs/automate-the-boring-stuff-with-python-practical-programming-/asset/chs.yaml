  16. `copy.copy()` 和 `copy.deepcopy()` 有什么区别？\n\n# 练习项目\n\n为了练习，编写程序完成以下任务。\n\n##\
  \ 逗号代码 (Comma Code)\n\n假设你有这样一个列表值：\n\n```python\nspam = ['apples', 'bananas', 'tofu',\
  \ 'cats']\n```\n\n编写一个接收列表值作为参数，并返回一个字符串，其中所有项目都用逗号和空格分隔，并在最后一个项目之前插入 *and*。例如，将之前的\
  \ `spam` 列表传递给函数将返回 `'apples, bananas, tofu, and cats'`。但你的函数应该能够处理给它的任何列表值。\n\n\
  ## 字符图片网格 (Character Picture Grid)\n\n假设有一个嵌套列表，内部列表中的每个值都是单字符字符串，如下：\n\n\n\n\n\n\
  ```\ngrid = [['.', '.', '.', '.', '.', '.'],\n        ['.', 'O', 'O', '.', '.',\
  \ '.'],\n        ['O', 'O', 'O', 'O', '.', '.'],\n        ['O', 'O', 'O', 'O', 'O',\
  \ '.'],\n        ['.', 'O', 'O', 'O', 'O', 'O'],\n        ['O', 'O', 'O', 'O', 'O',\
  \ '.'],\n        ['O', 'O', 'O', 'O', '.', '.'],\n        ['.', 'O', 'O', '.', '.',\
  \ '.'],\n        ['.', '.', '.', '.', '.', '.]]\n```\n\n你可以将 `grid[x][y]` 为用文本字符绘制的“图片”中\
  \ `x` 坐标和 `y` 坐标处的字符。`(0, 0)` 原点位于左上角，`x` 坐标向右增加，`y` 坐标向下增加。\n\n复制之前的网格值，并编写代码使用它来打印出图像。\n\
  \n```\n..OO.OO..\n.OOOOOOO.\n.OOOOOOO.\n..OOOOO..\n...OOO...\n....O....\n```\n\n\
  提示：你将需要嵌套循环来打印 `grid[0][0]`，然后是 `grid[1][0]`，接着是 `grid[2][0]`，依此类推，直到 `grid[8][0]`。这将完成第一行，然后打印一个换行符。接着你的程序应该打印\
  \ `grid[0][1]`，然后是 `grid[1][1]`，然后是 `grid[2][1]`，依此类推。程序打印的最后一个字符是 `grid[8][5]`。\n\
  \n另外，如果你不想在每次调用 `print()` 后自动打印换行符，请记住向 `print()` 传递 `end` 关键字参数。\n\n# 第 5 章 字典与数据结构化\n\
  \n在本章中，我将介绍字典数据类型，它提供了一种灵活访问和组织数据的方法。然后，通过结合字典与上一章中学的列表知识，你将学习如何创建一个数据结构来为井棋盘建模。\n\
  \n## 字典数据类型\n\n和列表一样，`dictionary`（字典）是许多值的集合。但与列表索引不同，字典的索引可以使用许多不同的数据类型，而不仅仅是整数。字典的索引被称为\
  \ `keys`（键），一个键及其关联的值被称为 `key-value pair`（键值对）。\n\n在代码中，字典用大括号 `{}` 定义。在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> myCat = {'size': 'fat', 'color': 'gray', 'disposition': 'loud'}\n\
  ```\n\n这会将一个字典赋值给变量 `myCat`。这个字典的键是 `'size'`、`'color'` 和 `'disposition'`。这些键的值分别是\
  \ `'fat'`、`'gray'` 和 `'loud'`。你可以通过键来访问这些值：\n\n```\n>>> myCat['size']\n'fat'\n>>>\
  \ 'My cat has ' + myCat['color'] + ' fur.'\n'My cat has gray fur.'\n```\n\n字典仍然可以使用整数作为键，就像列表使用整数作为索引一样，但它们不必从\
  \ `0` 开始，可以是任何数字。\n\n```\n>>> spam = {12345: 'Luggage Combination', 42: 'The Answer'}\n\
  ```\n\n## 字典与列表\n\n与列表不同，字典中的项是无序的。名为 `spam` 的列表中的第一个项是 `spam[0]`。但字典中没有“第一个”项。虽然项的顺序对于判断两个列表是否相同非常重要，但在字典中，键值对的键入顺序并不重要。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = ['cats', 'dogs', 'moose']\n>>> bacon = ['dogs',\
  \ 'moose', 'cats']\n>>> spam == bacon\nFalse\n>>> eggs = {'name': 'Zophie', 'species':\
  \ 'cat', 'age': '8'}\n>>> ham = {'species': 'cat', 'age': '8', 'name': 'Zophie'}\n\
  >>> eggs == ham\nTrue\n```\n\n因为字典无序的，所以它们不能像列表那样进行切片。\n\n尝试访问字典中不存在的键会导致 `KeyError`\
  \ 错误消息，类似于列表的“超出范围”的 `IndexError` 错误消息。在交互式 shell 中输入以下内容，注意由于没有 `'color'` 键而出现的错误消息：\n\
  \n```\n>>> spam = {'name': 'Zophie', 'age': 7}\n>>> spam['color']\nTraceback (most\
  \ recent call):\n  File \"<pyshell#1>\", line 1, <module>\n    spam['color']\nKeyError:\
  \ 'color'\n```\n\n虽然字典无序的，但你可以为键设置任意值，这一事实允许你以强大的方式组织数据。假设你想让程序存储关于你朋友生日的数据。你可以使用字典，以名称为键，生日值为值。打开一个新的文件编辑器窗口并输入以下代码。将其保存为\
  \ `birthdays.py`。\n\n```\nbirthdays = {'Alice': 'Apr 1', 'Bob': 'Dec 12', 'Carol':\
  \ 'Mar 4'}\n\n   while True:\n       print('Enter a name: (blank to quit)')\n  \
  \     name = input()\n       if name == '':\n           break\n\n     if name in\
  \ birthdays:\n         print(birthdays[name] + ' is the birthday of ' + name)\n\
  \       else:\n           print('I do not have birthday information for ' + name)\n\
  \           print('What is their birthday?')\n           bday = input()\n      \
  \     birthdays[name] = bday\n           print('Birthday database updated.')\n```\n\
  \n你创建了一个初始字典并将其存储在 `birthdays` 中。你可以像处理列表那样，使用 `in` 关键字检查输入的名称是否作为字典中的键。如果名称在字典中，你使用方括号访问关联的值；如果不在，你可以使用相同的方括号语法结合赋值运算符来添加它。\n\
  \n当你运行这个程序时，它看起来像这样：\n\n```\nEnter a name: (blank to quit)\nAlice\nApr 1 is the\
  \ birthday of Alice\nEnter a name: (blank to quit)\nEve\nI do not have birthday\
  \ information for Eve\nWhat is their birthday?\nDec 5\nBirthday database updated.\n\
  Enter a name: (blank to quit)\nEve\n```\n\n\n\n\n\n```\n>>> spam = {'name': 'Zophie',\
  \ 'age': 7} \n>>> 'name' in spam.keys()\nTrue \n>>> 'Zophie' in spam.values()\n\
  True \n>>> 'color' in spam.keys()\nFalse \n>>> 'color' not in spam.keys()\nTrue\
  \ \n>>> 'color' in spam\nFalse\n```\n\n在在上一个示例中，注意 `'color' in spam` 本质上是编写 `'color'\
  \ in spam.keys()` 的简写形式。情况始终如此：如果你想检查某个值是否是（或不是）字典中的键，可以直接对字典值本身使用 `in`（或 `not in`）关键字。\n\
  \n## `get()` 方法\n\n在访问键的值之前检查该键是否存在于字典中是非常麻烦的。幸运的是，字典有一个 `get()` 方法，它接受两个参数：要检索的值的键，以及当该键不存在时返回的备用值。\n\
  \n在交互式 shell 中输入以下内容：\n\n```\n>>> picnicItems = {'apples': 5, 'cups': 2} \n>>> 'I\
  \ am bringing ' + str(picnicItems.get('cups', 0)) + ' cups.'\n'I am bringing 2 cups.'\
  \ \n>>> 'I am bringing ' + str(picnicItems.get('eggs', 0)) + ' eggs.'\n'I am bringing\
  \ 0 eggs.'\n```\n\n由于 `picnicItems` 字典中没有 `'eggs'` 键，`get()` 方法返回了默认值 `0`。如果不使用\
  \ `get()`，代码将导致错误信息，如下例所示：\n\n```\n>>> picnicItems = {'apples': 5, 'cups': 2}\n\
  >>> 'I am bringing ' + str(picnicItems['eggs']) + ' eggs.'\nTraceback (most recent\
  \ call last):\n  File \"<pyshell#34>\", line 1, in <module>\n    'I am bringing\
  \ ' + str(picnicItems['eggs']) + ' eggs.'\nKeyError: 'eggs'\n```\n\n## `setdefault()`\
  \ 方法\n\n你经常需要在某个键还没有对应值时，才为字典中的该键设置一个值。代码看起来如下：\n\n```python\nspam = {'name': 'Pooka',\
  \ 'age': 5}\nif 'color' not in spam:\n    spam['color'] = 'black'\n```\n\n`setdefault()`\
  \ 方法提供了一种用一行代码完成此操作的方法。传递给方法的第一个参数是要检查的键，第二个参数是如果该键不存在时在该键上设置的值。如果键已存在，`setdefault()`\
  \ 方法将返回该键的值。在交互式 shell 中输入以下内容：\n\n```\n>>> spam = {'name': 'Pooka', 'age': 5}\n\
  >>> spam.setdefault('color', 'black')\n'black'\n>>> spam\n{'color': 'black', 'age':\
  \ 5, 'name': 'Pooka'}\n>>> spam.setdefault('color', 'white')\n'black'\n>>> spam\n\
  {'color': 'black', 'age': 5, 'name': 'Pooka'}\n```\n\n第一次调用 `setdefault()` 时，`spam`\
  \ 中的字典变更为 `{'color': 'black', 'age': 5, 'name': 'Pooka'}`。该方法返回了值 `'black'`，因为这是现在为键\
  \ `'color'` 设置的值。当下次调用 `spam.setdefault('color', 'white')` 时，该键的值不会变为 `'white'`，因为\
  \ `spam` 已经有一个名为 `'color'` 的键。\n\n`setdefault()` 方法是一个确保键存在的很好的快捷方法。这里有一个短的程序，用于统计字符串中每个字母出现的次数。打开文件编辑器窗口并输入以下代码，将其保存为\
  \ `characterCount.py`：\n\n```python\nmessage = 'It was a bright cold day in April,\
  \ and the clocks were striking thirteen.'\ncount = {}\n\nfor character in message:\n\
  \    count.setdefault(character, 0)\n    count[character] = count[character] + 1\n\
  \nprint(count)\n```\n\n该程序遍历 `message` 变量字符串中的每个字符，统计每个字符出现的频率。`setdefault()` 方法的调用确保了键在\
  \ `count` 字典中（默认值为 `0`），这样程序在执行 `count[character] = count[character] + 1` 时就不会抛出\
  \ `KeyError` 错误。当你运行此程序时，输出将如下所示：\n\n```\n{' ': 13, ',': 1, '.': 1, 'A': 1, 'I':\
  \ 1, 'a': 4, 'c': 3, 'b': 1, 'e': 5, 'd': 3, 'g': 2, 'i': 6, 'h': 3, 'k': 2, 'l':\
  \ 3, 'o': 2, 'n': 4, 'p': 1, 's': 3, 'r': 5, 't': 6, 'w': 2, 'y': 1}\n```\n\n从输出中可以看出，小写字母\
  \ `c` 出现了 3 次，空格出现了 13 次，大写字母 `A` 出现了 1 次。无论 `message` 变量中是什么字符串，该程序都能工作，即使字符串有数百万字符长！\n\
