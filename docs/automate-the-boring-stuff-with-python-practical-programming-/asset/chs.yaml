  \ 对象进行更改后，如何将其保存为图像文件？ |\n| Q: | 8. 哪个模块包含 Pillow 的形状绘制代码？ |\n| Q: | 9. `Image`\
  \ 对象没有绘制方法。哪种对象有？你如何获取这种对象？ |\n\n# 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## 扩展和修复章节项目程序\n\
