- img_proc: true
  md: 'CUPS uses IPP for the internal data transmission. This is the preferred protocol
    for a forwarding queue between CUPS servers.


    The port number for IPP is 631.


    Device URI (Universal Resource Identifier) example: ipp://cupserver/printers/printqueue.
    The Device URI can be used to specify a printer. See “Add a Printer from the Command
    Line” on page 10-19.


    +   **LPD (Line Printer Daemon).** The LPD protocol is described in RFC 1179 (requests
    for comments can be found at http://www.ietf.org/rfc.html).


    Some job-related data as the printer queue is sent before the actual print data.
    This means a printer queue must be specified when configuring the LPD protocol
    for the data transmission.


    The implementations of most printer manufacturers are flexible enough to accept
    any name as the printer queue. If necessary, the printer manual might indicate
    which name to use (such as LPT, LPTI, or LP1).


    Of course, an LPD queue can also be configured on a different Linux or UNIX host
    in a network that uses the CUPS system. The port number for an LPD service is
    515.


    Device URI example: lpd://host-printer/LPT1


    +   **SMB (Standard Message Block).** CUPS also supports printing on printers
    connected to Windows shares. The protocol used for this purpose is SMB.


    SMB uses port numbers 137, 138, and 139.


    Device URI examples:


    ```

    smb://user:password@workgroup/server/printer

    smb://user:password@host/printer

    smb:///server/printer

    ```'
  merge: -1
  pgno: 434
- img_proc: true
