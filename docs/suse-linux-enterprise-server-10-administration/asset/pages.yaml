  md: '# Monitor and Check a File System


    Once you set up and begin using your Linux file system, you can monitor the status
    and health of the system by doing the following from the command line:


    +   - Check Partition and File Usage (df and du)

    - Check Open Files (Isof)

    - Identify Processes Using Files (fuser)

    - Check Lost+found (ext2 and ext3 only)

    - Check and Repair File Systems (fsck)

    - Check and Repair ext2/ext3 and ReiserFS (e2fsck and reiserfsck)

    - Use Additional tools to manage file systems


    # Check Partition and File Usage (df and du)


    The following commands help you monitor usage by partitions, and directories:


    +   - **df.** This command provides information on where hard drives and their
    partitions or other drives are mounted in the file system, and how much space
    they occupy.


    If you use the df command without parameters, the space available on all currently-mounted
    file systems is displayed. If you provide a filename, df displays the space available
    on this file system resides in.


    Some useful options include **-h** (human readable format—in MB or GB), **-i**
    (list inode information instead of block usage), and **-l** (limit listing to
    local file systems).


    For example, to list information for all local file systems in human-readable
    format, you would enter **df -lh**.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '+   du. This command provides information on the space occupied by files and
    directories.


    Some useful options include -c (display a grand total), -h (human-readable format),
    -s (display only a total for each argument), and --exclude=pattern (exclude files
    that match pattern).


    For example, to display information for files in human-readable format except
    for files that end in ".o," you would enter the following:


    ```

    du -h --exclude="*.o''

    ```


    # Check Open Files (lsof)


    The command lsof lists open files. Entering lsof without any options lists all
    open files belonging to all active processes.


    An open file can be a regular file, a directory, a device file, a library, or
    a stream or a network file (Internet socket, NFS file, or UNIX domain socket).


    In addition to producing a single output list, lsof can run in repeat using the
    option -r. In repeat mode it outputs, delays, and repeats the output operation
    until stopped with an interrupt or quit signal.


    Some useful options include -x (list only files starting with x), -s (display
    file sizes), and -u x (list only files for users who are x).


    For example to open files for the users root and geeko only and include the file
    sizes, you would enter lsof -s -u root.geeko.


    # Identify Processes Using Files (fuser)


    The command fuser displays the PIDs of processes using the specified files or
    file systems.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'In the default display mode, each filename is followed by a letter that describes
    the type of access:


    +   - c: current directory

    - e: executable being run

    - f: open file (omitted in default display mode)

    - r: root directory

    - m: memory mapped file or shared library


    A non-zero return code is displayed if none of the files are accessed or in case
    of a fatal error. If at least one access has been found, fuser returns zero.


    Some useful options include -a (return information for all files, if they are
    not accessed by a process), -v (verbose mode), and -u (append the user name of
    the process owner to each PID).


    Another useful option is -m. To check the PID information for processes accessing
    files on the partition that holds /home, you would enter fuser -m /home.


    # Check lost+found (ext2 and ext3 only)


    The directory lost+found is a special feature of the ext2 and ext3 file system
    format. After a system crash, Linux automatically carries out a check of the complete
    file system. Files or fragments to which a name can no longer be allocated are
    not simply deleted, but stored in this directory.


    By reviewing the contents of this directory, you can try to reconstruct the original
    name and purpose of a file.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Check and Repair File Systems (fsck)


    The command fsck lets you check and optionally repair one or more Linux file systems.
    Normally, fsck tries to run file systems on different physical disk drives in
    parallel to reduce the total amount of time to check all file systems.


    If you do not specify a file system on the command line and do not specify the
    option -A, fsck defaults to checking filesystems in /etc/fstab serially.


    fsck is a frontend for the various file system checkers (fsck.fstype) available
    on the system. The fsck utility looks for the system-specific checker in /bin/
    first, then in /etc/fsl/ and /etc/, and finally in the directories listed in the
    PATH environment variable.


    To check a specific file system, use the following syntax:


    ```

    fsck device

    ```


    For example if you wanted to check the file system on /dev/hda2, you would enter
    fsck /dev/hda2.


    Some options that are available with fsck include -A (walk through the /etc/fstab
    file and try to check all the file systems in one pass), -N (don''t execute, just
    show what would be done), and -V (verbose output).'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Check and Repair ext2/ext3 and ReiserFS (e2fck and reiserfsck)


    Switching off the Linux system without unmounting partitions (for example, when
    a power outage occurs) can lead to errors in the file system.


    The next time you boot the system, the fact that the computer was not shut down
    correctly is detected and a file system check is performed. If errors are found
    in the file system, they are corrected, if possible. If not, the computer does
    not start properly and you are prompted to enter the root password, together with
    a hint on how to correct the issue. In cases of severe file system damage, you
    may have even to resort to the rescue system to repair the system.


    Depending on the file system type, you use either /bin/e2fck or /bin/reiserfs.
    These tools check the file system for a correct superblock (the block at the beginning
    of the partition containing information on the structure of the file system),
    faulty data blocks, or faulty allocation of data blocks.


    A possible problem in the ext2 (or ext3) file system is damage to the superblock.
    You can first view the location of all copies of the superblock in the file system
    using dumpe2fs.


    Then, with e2fck, you can use one of the backup copies, as in the following:


    ```

    e2fck -f -b 32768 /dev/hda1

    ```


    In this example, the superblock located at data block 32768 is in the ext2 file
    system of the partition /dev/hda1 is used and the primary superblock is updated
    appropriately upon completion of the file system check.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'With a block size of 4k, a backup copy of the superblock is stored every 32768
    blocks.


    **reiserfck**, the file system is subjected to a consistency check. The journal
    is checked to see if certain transactions need to be repeated. With the option
    **--fixfixable**, errors such as wrong file sizes are fixed as soon as the file
    system is checked.


    With an error in the binary tree, it is possible to have this rebuilt entering
    **reiserfck --rebuild-tree**.


    # Use Additional tools to manage file systems


    There are additional tools to administer various aspects of file systems.


    **tune2fs** is used to adjust tunable filesystem parameters on ext2/ext3 filesystems.
    Amongst these is the number of days or number of mounts a file system check is
    done. It is also used to add a label to the file system, or to add a journal to
    an ext2 file system, turning into an ext3 file system.


    **reiserfstune** is the corresponding tool for ReiserFS. See the reiserfstune
    manual page for options and uses for this tool.


    **resize2fs** and **resize_reiserfs** are used to shrink or enlarge an ext2/3
    and ReiserFS, respectively, resize_reiserfs can enlarge ReiserFS online. Shrinking
    file systems as well as enlarging ext2/3 can only be done while the file system
    is unmounted.


    As stated before, when planning to manipulate partitions and file systems, back
    up your data first!


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
