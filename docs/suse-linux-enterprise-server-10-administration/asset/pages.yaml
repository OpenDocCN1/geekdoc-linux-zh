- img_proc: true
  md: '# Disk Space Distribution


    Depending on the amount of space and how the computer will be used, adjust the
    distribution of the available disk space. The following are some basic guidelines:


    # Up to 4 GB


    One partition for the swap space and one root partition (/). In this case, the
    root partition must allow for those directories that often reside on their own
    partitions if more space is available.


    # 4 GB or More


    A swap partition, a root partition (1 GB), and 1 partition each for the following
    directories as needed:


    +   - **/boot/**. Depending on the hardware, it might be useful to create a boot
    partition (/boot) to hold the boot mechanism and the Linux kernel.


    This partition should be located at the start of the disk and should be at least
    20 MB or 1 cylinder.


    As a rule of thumb, always create such a partition if it was included in YaST''s
    original proposal. If you are unsure about this, create a boot partition to be
    on the safe side.


    +   - **/opt/**. Some (mostly commercial) programs install their data in /opt/.
    In this case, you might want to create a separate partition for /opt/ (4 GB or
    more). For instance KDE and GNOME installed in /opt/.


    +   - **/usr/**. Apart from directories holding user data, /usr/ is usually the
    biggest directory in the Linux installation. Putting it on a separate partition
    allows special mount options, like read only to prevent changes to programs. Software
    updates require to remount the partition read-write, though.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '+   /var/. If the computer is used as a mail server, it might be a good idea
    to put /var/ on a separate partition. Too much mail might still render the mail
    service unusable, they would just fill the partition containing the /var directory,
    not the root file system. The administrator would still be able to administer
    the server and correct the issue.


    +   /srv/ . When the machine acts as a web or ftp server, the data offered to
    users could be put on a separate partition.


    +   /home/. Putting /home/ on a separate partition prevents users from using up
    all disk space and facilitates updates. If you have to reinstall the operating
    system you can preserve data in /home by leaving the partition untouched


    +   /tmp/. Having /tmp/ on a separate partition allows you to mount it with special
    options, like noexec, and also prevents processes from filling the disk with files
    in /tmp/.


    +   Additional partitions. If the partitioning is performed by YaST and other
    partitions are detected in the system, these partitions are also entered in the
    file /etc/fstab to enable easy access to this data.


    The following is an example:


    ```

    dev/sda8 /data2 auto noauto,user 0 0

    ```


    Such partitions, whether they are Linux or FAT, are specified by YaST with the
    options noauto and user. This allows any user to mount or unmount these partitions
    as needed.


    For security reasons, YaST does not automatically enter the exec option, which
    is needed for executing programs from the respective location. However, you can
    enter this option manually.


    Entering the exec option is necessary if you encounter system messages such as
    “bad interpreter” or “Permission denied”.'
