    # Network Printers


    CUPS supports the IPP, LPD, SMB, and socket protocols. The following describes
    these protocols:


    +   - IPP (Internet Printing Protocol), IPP is a relatively new protocol (since
    1999) that is based on the HTTP protocol. Compared to other protocols, it is possible
    to transmit more job-related data.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    10-8 Version 1'
