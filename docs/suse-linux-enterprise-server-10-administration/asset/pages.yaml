- img_proc: true
  md: 'One way to access a system that is not booting anymore is to set a different
    program for the init process. Normally, the Linux kernel tries to find a program
    with the name init and starts this program as the first process. All other processes
    are started by it.


    With the boot parameter `init=new_init_program`, you can change the first program
    loaded by the kernel. For example, entering the boot parameter `init=/bin/bash`,
    the system is started directly into a bash shell. You are directly logged in as
    root without being asked for a password.


    You can use this bash file to access the file system and fix a misconfiguration.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_330_0.png)


    The file systems are mounted as read-only after booting into a shell. To change
    configuration files, you need to remount the file system with the following command:


    `mount -o remount,rw,sync -t filesystem_type device_name mount_point`


    Entering `exec /sbin/init` at the bash prompt replaces the shell by the init program
    and continues the boot process until the default runlevel is reached.


    If you want to prevent access to the machine as described above, you can change
    the boot configuration to require a password before the kernel command line can
    be edited.


    In the file `/boot/grub/menu.lst`, the line


    # password secret


    within the general options makes sure that the choices defined further below in
    the file (title SLES 10, etc.) can only be selected in unmodified form. The use
    of additional kernel parameters requires the password `secret`.


    As the graphical boot menu could be used to circumvent the password feature, it
    is automatically disabled.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'GRUB can also handle MD5-encrypted passwords that are generated as follows:


