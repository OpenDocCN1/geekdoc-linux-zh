  md: '# Tools to Administer Logical Volumes


    To create a logical volume, use **lvcreate**, specifying the size, the name for
    the logical volume, and the volume group:


    ```

    da10:~ # lvcreate -L 100M -n data system system

    Logical volume "data" created

    ```


    The next step is to create a file system within the logical volume and mount it:


    ```

    da10:~ # lvscan ''/dev/system/data'' [100,00 MB] inherit

    da10:~ # mkreiserfs /dev/system/data

    mkreiserfs 3.6.19 (2003 www.namesys.com)


    ReiserFS is successfully created on /dev/system/data.

    da10:~ # mount /dev/system/data /data

    ```


    As shown above, **lvscan** is used to view the logical volumes. It shows the device
    to use for the formatting and mounting.


    **lvextend** is used to increase the size of a logical volume. After that you
    can increase the size of the file system on that logical volume to make use of
    the additional space.


    Before you use **lvreduce** to reduce the size of a logical volume, you have to
    reduce the size of the file system. Only then reduce the size of the logical volume.
    If you cut off parts of the file system by simply reducing the size of the logical
    volume without shrinking the file system first, you will loose data.'
