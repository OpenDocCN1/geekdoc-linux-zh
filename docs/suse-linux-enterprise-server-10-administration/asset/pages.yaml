  md: '# Objective 4


    # Configure Logical Volume Manager (LVM) and Software RAID


    Logical volume manager (LVM) provides a higher-level view of the disk storage
    on a computer system than the traditional view of disks and partitions. This gives
    you much more flexibility in allocating storage space to applications and users.


    After creating logical volumes with LVM, you can (within certain limits) resize
    and move logical volumes while they are still mounted and running.


    You can also use LVM to manage logical volumes with names that make sense (such
    as “development” and “sales”) instead of physical disk names such as “sda” and
    “sdb."


    To configure a file system with LVM, you need to know the following:


    +   - How to Use VM Components

    - How to Use VM Features

    - How to Configure Logical Volumes With YaST

    - How to Configure LVM with Command Line Tools


    The Linux Kernel is capable of combining hard disks to arrays with the RAID levels
    0, 1, 5, and 6. Software RAID is covered in


    +   - Manage Software RAID


    # How to Use VM Components


    Conventional partitioning of hard disks on a Linux file system is basically inflexible.
    When a partition is full, you have to move the data to another medium before you
    can resize the partition, create a new file system, and copy the files back.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Normally, these changes cannot be implemented without changing adjacent partitions,
    whose contents also need to be backed up to other media and written to their original
    locations after the repartitioning.


    Because it is difficult to modify partitions on a running system, LVM was developed.
    It provides a virtual pool of memory space (called a volume group) from which
    logical volumes can be generated if needed. The operating system accesses these
    logical volumes like conventional physical partitions.


    This approach lets you resize the physical media during operation without affecting
    the applications.


    The basic structure of LVM includes the following components:


    # Figure 2-7


    ![](img/84d12236ddfe17cc29fd21173b9904ac_129_0.png)


    +   * Physical volume. A physical volume can be a partition or an entire hard
    disk.


    **CNI USE ONLY-1 HARDCOPY PERMITTED**'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Volume group. A volume group consists of one or several physical volumes grouped
    together. The physical partitions can be spread over different hard disks. You
    can add hard disks or partitions to the volume group during operation whenever
    necessary.


    The volume group can also be reduced in size by removing physical volumes (hard
    disks or partitions).


    +   Logical volume. A logical volume is a part of a volume group. A logical volume
    can be formatted and mounted like a physical partition.


    You can think of volume groups as hard disks and logical volumes as partitions
    on those hard disks. The volume group can be split into several logical volumes
    that can be addressed with their device names (such as /dev/system/usr) like conventional
    partitions with theirs (dev/hda1).


    > Just as with other direct manipulations of the file system, a data backup should
    be made before configuring LVM.


    # How to Use VM Features


    LVM is useful for any computer, as it is very flexible when the need to adapt
    to changed needs for storage space arises.


    The following are features of LVM that help you implement storage solutions:


    +   You can combine several hard disks or partitions into a large volume group.


    +   Provided the configuration is suitable, you can enlarge a logical volume when
    free space is exhausted. Resizing logical volumes is easier than resizing physical
    partitions.


    +   You can create extremely logical volumes (Terabytes).'
  merge: -1
  pgno: 130
- img_proc: true
  md: '+   You can add hard disks to the volume group in a running system, provided
    you have hot-swappable hardware capable of such actions.


    +   You can add logical volumes in a running system, provided there is free space
    in the volume group.


    +   You can use several hard disks with improved performance in the RAID 0 (striping)
    mode.


    +   There is no limit that is relevant in practice on the number of logical volumes
    (the limit in LVM version 1 was 256).


    +   The Snapshot feature enables consistent backups in the running system.


    # How to Configure Logical Volumes With YaST


    The following are the basic steps for configuring logical volumes (LVM) with YaST:


    +   Define the LVM partitions (physical volumes) on the hard drive


    +   Create the volume group and logical volumes


    +   Access the YaST Module lvm_config


