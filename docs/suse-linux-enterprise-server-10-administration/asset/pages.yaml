- img_proc: true
  md: '# Objective 2


    # Use System Logging Services


    In a Linux system, there are many logs that track various aspects of system operation.
    Many services log their activities to their own log files, and the level of detail
    can be set on a per-service basis. In addition, system logs in /var/log/ track
    system-level events.


    The information logged in these logs files is typically used to assist in troubleshooting
    and for security purposes. Especially the latter mandates that the log files are
    reviewed regularly.


    To use system logging services, you need to understand the following:


    +   - The Syslog Daemon syslog-ng

    - Important Log Files

    - Archive Log Files (logrotate)


    # The Syslog Daemon syslog-ng


    The syslog daemon syslog-ng is used by many services to log system events. The
    advantage in using a single service for logging is that all logging can be managed
    from one configuration file.


    Up to SUSE Linux Enterprise Server 9, syslogd was used to log system events. With
    SUSE Linux Enterprise Server 10 these events are logged by syslog-ng, the new
    generation syslog.


    The main advantage of syslog-ng over syslogd is its capability to filter messages
    not only based on facilities and priorities, but also based on the content of
    each message.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'The syslog daemon accepts messages from system services, and, depending on
    its configuration, other hosts, and logs them based on settings in the configuration
    files /etc/sysconfig/syslog and /etc/syslog-ng/syslog-ng.conf. The file /etc/syslog-ng/syslog-ng.conf
    is generated by SuSEConfig from /etc/syslog-ng/syslog-ng.in. Both files share
    the same syntax.


    The configuration of syslog-ng is distributed across three files:


    +   - /etc/sysconfig/syslog

    - /etc/syslog-ng/syslog-ng.in

    - /etc/syslog-ng/syslog-ng.conf


    # /etc/sysconfig/syslog


    The file /etc/sysconfig/syslog contains general parameters applicable to syslog-ng
    as well as syslogd.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'Parameters set in this file include switches passed to syslogd or syslog-ng,
    kernel log level, parameters for klogd, and which syslog daemon is to be used.


    ```

    ...

    ## Type: string

    ## Default: **

    ## Config: **

    ## ServiceRestart: syslog

    #

    ## if not empty: parameters for syslogd

    # for example SYSLOGD_PARAMS="-r -s my.dom.ain"

    #

    SYSLOG_PARAMS=""



    ```


    ```

    ## Type: string

    ## Default: -x

    ## Config: **

    ## ServiceRestart: syslog

    #

    ## if not empty: parameters for klogd

    # for example KLOGD_PARAMS="-x" to avoid (duplicate) symbol resolution

    #

    KLOGD_PARAMS="-x"

    ```


    ```

    ## Type: list(syslogd, syslog-ng)

    ## Default: syslog

    ## Config: syslog-ng

    ## Command: /sbin/rcyslog restart

    ## PreSaveCommand: /sbin/rcyslog status &&

    #

    ## The name of the syslog daemon used as

    # syslog service: "syslogd", "syslog-ng"

    #

    SYSLOG_DAEMON="syslog-ng"

    ...

    ```'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'Parameters set in /etc/sysconfig/syslog are evaluated by the start script /etc/init.d/syslog.
    Furthermore, SuSEConfig uses /etc/sysconfig/syslog to add log sockets to the file
    /etc/syslog-ng/syslog-ng.conf when generating this file /etc/syslog-ng/syslog-ng.in.


    # /etc/syslog-ng/syslog-ng.in


    /etc/syslog-ng/syslog-ng.in is the template used to create the file /etc/syslog-ng/syslog-ng.conf,
    which is the configuration file actually used by syslog-ng. Both files have the
    same syntax.


    However, unless you turn off generation of /etc/syslog-ng/syslog-ng.conf in /etc/sysconfig/syslog,
    any manual changes to this file will be overwritten when SuSEConfig is executed.


    Therefore, changes to the configuration of syslog-ng should be made in this file.


    # /etc/syslog-ng/syslog-ng.conf


    syslogd and syslog-ng share two concepts that you have to understand to be able
    to configure either one:


    +   - Facilities

    - Priorities


    The configuration of syslog-ng consists of several parts which are then combined
    to configure which information is logged where.


    These are:


    +   - Sources

    - Filters'
  merge: -1
  pgno: 292
- img_proc: true
  md: '+   * Destinations

    * Log Paths


    # Facilities


    The facility refers to the subsystem that provides the corresponding message.
    Each program that uses syslog for logging is assigned such a facility, usually
    by its developer.


    The following describes these facilities:


    # Table 6-2


    | Facility | Description |

    | --- | --- |

    | authpriv | Used by all services that have anything to do with system security
    or authorization. All PAM messages use this facility. The ssh daemon uses the
    auth facility. | Used by all services that have anything to do with system security
    or authorization. All PAM messages use this facility. The ssh daemon uses the
    auth facility. |

    | cron | Accepts messages from the cron and daemons. |

    | daemon | Used by various daemons that do not have their own facility, such as
    the ppp daemon. |

    | kern | All kernel messages. |

    | lpr | Messages from the printer system. |

    | mail | Messages from the mail system. This is important because many messages
    can arrive very quickly. |

    | news | Messages from the news system. As with the mail system, many messages
    might need to be logged in a short time. |

    | syslog | Internal messages of the syslog daemon. |

    | user | A general facility for messages on a user level. For example, it is used
    by log to failed login attempts. |'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Table 6-2 (continued)


    | Facility | Description |

    |---|---|n| uucp | Messages from the uucp system. |

    | local0 – local7 | These 8 facilities are available for your own configuration.
    All of the local categories can be used in your own programs.<br>By configuring
    one of these facilities, messages from your own programs can be administered individually
    through entries in the file /etc/syslog-ng/syslog-ng.conf. |


    # Priorities


    The priority gives details about the urgency of the message. The following priorities
    are available (listed in increasing degree of urgency):


    # Table 6-3


    | Priority | Description |

    |---|---|n| debug | Should only be used for debugging purposes, since all messages
    of this category and higher are logged. |

    | info | Used for messages that are purely informative. |

    | notice | Used for messages that describe normal system states that should be
    noted. |

    | warning | Used for messages displaying deviations from the normal state. |

    | err | Used for messages displaying errors. |

    | crit | Used for messages on critical conditions for the specified program. |

    | alert | Used for messages that inform the system administrator that immediate
    action is required to keep the system functioning. |'
  merge: -1
  pgno: 294
- img_proc: true
  md: "# Table 6-3 (continued)\n\n| Priority | Description |\n|---|---|n| emerg |\
    \ Used for messages that warn you that the system is no longer usable. |\n\n#\
    \ Sources\n\nA source is a collection of source drivers, which collect messages\
    \ using a given method. These sources are used to gather log messages. The general\
    \ syntax is as follows:\n\n```\nsource <identifier> { source-driver(params); source-driver(params);\
    \ ... };\n```\n\nThe respective section in /etc/syslog-ng/syslog-ng.conf looks\
    \ like\n\n```\nsource src {\n    # include internal syslog-ng messages\n    #\
    \ note: the internal() svare is required!\n    internal();\n\n    # the following\
    \ line will be replaced by the\n    # socket list generated by UseConfig using\n\
    \    # variables from /etc/sysconfig/syslog:\n    unix-dgram(\"/dev/log\");\n\n\
    \    # uncomment to process log messages from network:\n    udp(ip(\"0.0.0.0\"\
    ) port(514));\n}\n```\n\nIn this example, one source for internal messages of\
    \ syslog-ng and the socket /dev/log are defined."
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Filters


    Filters are boolean expressions that are applied to messages and are evaluated
    as either true or false. The general syntax is as follows:


    ```

    filter <identifier> ( expression );

    ```


    The identifier has to be unique within the configuration and is used later to
    configure the actual logging.


    The following excerpt of /etc/syslog-ng/syslog-ng.conf shows some filters used
    in SUSE Linux Enterprise Server 10:


    ```

    #

    # Filter definitions

    #

    f_iptables { facility(kern) and match("IN=") and match("OUT="); }

    f_console { level(warn) and facility(kern) and not filter(f_iptables) or level(err)
    and not facility(authpriv); };

    f_newsnotice { level(notice) and facility(news); };

    f_newcrit { level(crit) and facility(news); };

    f_newerr { level(err) and facility(news); };

    f_news { facility(news); };

    ...

    f_messages { not facility(news, mail) and not filter(f_iptables); };

    ...

    ```


    As you can see, facility and priority(level) can be used within filters. However,
    it is also possible to filter according to the content of a line being logged,
    as in the f_iptables filter above.


    Combining the expressions with "and", "or", and "not" allows you to create very
    specific filters.'
  merge: -1
  pgno: 296
- img_proc: true
  md: "# Destinations\n\nDestinations defines where messages can be logged. The general\
    \ syntax is as follows:\n\n```\ndestination <identifier> {\ndestination-driver(params);\n\
    destination-driver(params); ... };\n```\n\nPossible destinations are files, fifos,\
    \ sockets, tty of certain users, programs, or other hosts.\n\nA sample from /etc/syslog-ng/syslog-ng.conf\
    \ looks like this:\n\n```\ndestination console { file(\"/dev/tty10\") group(tty)\
    \ perm(0620)); \ndestination messages { file(\"/var/log/messages\"); };\n```\n\
    \n# Log Paths\n\nLog paths are the point where it all comes together. They define\
    \ which messages are logged where, depending on source, filter, and destination.\
    \ The general syntax is as follows:\n\n```\nlog { source(s1); source(s2); ...\
    \ \nfilter(f1); filter(f2); \ndestination(d1); destination(d2); ... \nflags[flag1,\
    \ flag2...]; };\n```\n\nThe following entries in /etc/syslog-ng/syslog-ng.conf\
    \ for instance are responsible for logging to /dev/tty10 and /var/log/messages:\n\
    \n```\nlog { source(src); filter(f_console); destination(console); \nlog { source(src);\
    \ filter(f_messages); destination(messages); };\n```"
  merge: -1
  pgno: 297
- img_proc: true
  md: 'In the first line, messages that come in through sources defined

    in source src are logged to tty10 if they match the filter f_console.

    In line two, messages that come in through sources defined in

    source src are logged to /var/log/messages if they match the filter

    f_messages.


    For further details on the syslog-ng.conf file, enter man 5 syslog-ng.conf.

    The documentation in /usr/share/doc/packages/syslog-ng/html/book1.html

    gives a general overview of syslog-ng as well as details on the configuration.


    # Important Log Files


    The log file to which most messages are written the file

    /var/log/messages. Often hints can be found here about problems

    such as why a service does not function properly it starts. If

    there is no hint in /var/log/messages, then a look at

    /var/log/audit/audit.log, the file for AppArmor messages, might

    help. Firewall messages are logged in /var/log/firewall.


    The best approach for reading the log files from the command line

    is to use the command tail (tail /var/log/messages). This displays

    the last 10 n of the file, which are also the current entries.


    By using tail -n (such as tail -n 30) you can specify the number of

    lines to display.


    If you want to have new messages displayed immediately, use the

    interactive mode with tail -f. For example, entering tail -20f

    /var/log/messages switches tail to interactive mode. The last 20

    lines of the file /var/log/messages are displayed. If new messages

    are added these are displayed immediately.


    You can stop tail -f by pressing Ctrl+c.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '| Log File | Description |

    |---|---|

    | /var/log/audit/ | This directory stores the Novell AppArmor logfile audit.log.
    |

    | /var/log/cups/ | This directory stores the log files for the printing system
    CUPS. |

    | /var/log/news/ | This directory stores messages for the news system. |

    | /var/log/YaST2/ | This directory stores log files for YaST. |

    | /var/log/boot.msg | When the system boots, all boot script messages are displayed
    on the first virtual console. This often happens so fast that you cannot read
    all the messages.


    You can, however, read the boot messages in this file. |

    | /var/log/mail | Messages from the mail system are written to this file. Because
    this system often generates a lot of messages, there are additional log files:

    - /var/log/mail.err

    - /var/log/mail.info

    - /var/log/mail.warn |

    | /var/log/wtmp | This file contains information about which user was logged in
    from where and for how long (since the file was created).

    The file contents are in binary form and can only be displayed with the command
    last (/usr/bin/last).

    Because of the binary format, it is difficult to manipulate entries in this file.
    |'
  merge: -1
  pgno: 299
- img_proc: true
  md: '| Table 6-4 (continued) | Log File | Description |

    | --- | --- | --- |

    | | /var/log/lastlog | This file contains information about which user was last
    logged in, from where, and for how long. You can only view the contents with the
    command **lastlog** (/usr/bin/lastlog). |


    # # Archive Log Files (logrotate)


    It is important to ensure that log files do not get too large and require too
    much space inside the system. For this reason, the size and age of log files are
    monitored automatically by the program **logrotate** (/usr/sbin/logrotate).


    The program is run daily by the cron daemon **/etc/cron.daily/logrotate**. The
    program checks all log files listed in its configuration files and takes any action
    required by the configuration for the respective file.


    You can configure the settings in the files to indicate whether files should be
    compressed or deleted in regular intervals or when a determined size is reached.


    You can also configure how many compressed versions of a log file are kept over
    a specified period of time. Log files can also be forwarded by email.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'The configuration file of logrotate is /etc/logrotate.conf, which contains
    general configuration settings. The following is an example of logrotate.conf:


    ```

    # see "man logrotate" for details

    # rotate log files weekly

    weekly


    # keep 4 weeks worth of backlogs

    rotate 4


    # create new (empty) log files after rotating old ones

    create


    # uncomment this if you want your log files compressed

    #compress


    # uncomment these to switch compression to bzip2

    #compresscmd /usr/bin/bzip2

    #uncompresscmd /usr/bin/bzip2


    # RPM packages drop drop log rotation information into this directory

    include /etc/logrotate.d

    ```


    The following table describes the options in the file:


    # Table 6-5


    | Option | Description |

    |---|---|

    | weekly | The log files are created or replaced once a week. |

    | rotate 4 | Unless the option rotate is specified, the old files are deleted.
    In this example, the last 4 versions of the log file are kept (rotate 4). |

    | create | The old file is saved under a new name and a new, empty log file is
    created. |

    | compress | If the option compress is activated, the copies are stored in a compress
    form. |'
  merge: -1
  pgno: 301
- img_proc: true
  md: "Many RPM packages contain preconfigured files for evaluation by logrotate,\
    \ which are stored in /etc/logrotate.d/. The files contained in that directory\
    \ are read by logrotate through the include /etc/logrotate.d entry in /etc/logrotate.conf.\n\
    \nAny settings in the logrotate.d files supersede the general settings in logrotate.conf.\n\
    \nAll the files to monitor must be listed. This is done through the entries in\
    \ /etc/logrotate.conf (such as /var/log/wtmp [options]) or in separate configuration\
    \ files.\n\nThe following is an example of the file syslog in /etc/logrotate.d/:\n\
    \n```\n#\n# Please note, that changing of log file permissions in this\n# file\
    \ is not sufficient if syslog-ng is used as log daemon.\n# It is required to specify\
    \ the permissions in the syslog-ng\n# configuration /etc/syslog-ng/syslog-ng.conf.\
    \ as well\n#\n/var/log/warn /var/log/messages /var/log/allmessages\n/var/log/localmessages\
    \ /var/log/firewall {\ncompress\ndateext\nmaxage 365\nrotate 99\nmissingok\nnotifyempty\n\
    size +4096k\ncreate 640 root root\nsharedscripts\npostrostate\n    /etc/init.d/syslog\
    \ reload\nendscript\n..\n```\n\nThe files syslog and syslog-ng in /etc/logrotate.d/\
