- img_proc: true
  md: 'Log in as root with the appropriate password. Restart the display manager by
    entering rcxdm restart. After a few moments, a graphical login is displayed.


    Your SUSE Linux Enterprise Server 10 is ready to be accessed remotely for administration.


    > You can deactivate remote administration on your SUSE Linux Enterprise Server
    by following the same steps but selecting Do Not Allow Remote Administration.


    # Access Your Server for Remote Administration


    To access a SUSE Linux Enterprise Server that has been configured for remote administration,
    you can use a VNC client or a Java-enabled web browser.


    To access the server from a web browser, open the web browser from the computer
    desktop; then enter the following:


    ```

    http://hostname:5801

