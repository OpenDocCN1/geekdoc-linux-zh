    # Device Statistics


    You can use the option -s with the command ip to display additional statistics
    information about the devices. The command looks like the following:


    # ip -s link show eth0


    By giving the device name at the end of the command line, the output is limited
    to one specific device. This can also be used to display the device setup or the
    device attributes.


    The following is an example of the information displayed for the device eth0:


    ```

    da2-: # ip -s link show eth0

    2: eth0:<BROADCAST,MULTICAST,NOTRAILERS,UP> mtu 1500 qdisc

    pififo_fast qlen 1000

    link/ether 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff

    RX: bytes packets errors dropped overrun mcast

    849172787 9304150 0 0 0

    TX: bytes packets errors dropped carrier collns

    857278145 1125639 0 0 0

    ```


    Two additional sections with information are displayed for every device. Each
    of the sections has a headline with a description of the displayed information.


    The section starting with RX displays is information about received packets, and
    the section starting with TX displays information about sent packets.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'The sections display the following information:


    +   - **Bytes.** The total number of bytes received or transmitted by the device.

    - **Packets.** The total number of packets received or transmitted by the device.

    - **Errors.** The total number of receiver or transmitter errors.

    - **Dropped.** The total number of packets dropped due to a lack of resources.

    - **Overrun.** The total number of receiver overruns resulting in dropped packets.

    - **Mcast.** The total number of received multicast packets. This option is supported
    by only a few devices.

    - **Carrier.** The total number of link media failures, because of a lost carrier.

    - **Collns.** The total number of collision events on Ethernet-like media.

    - **Compressed.** The total number of compressed packets.


    As a rule, if a device is overrun, it means that there are serious problems in
    the Linux kernel or that your computer is too slow for the device.


    # Change the Current Network Configuration


    You can use the ip tool to change the network configuration by performing the
    following tasks:


    +   - Assign an IP Address to a Device

    - Delete the IP Address from a Device

    - Change Device Attributes'
