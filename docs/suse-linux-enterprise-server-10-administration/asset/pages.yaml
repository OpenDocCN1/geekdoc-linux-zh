  md: '# Public Key Authentication Management


    Besides password authentication, a user can also authenticate using a public key
    procedure. Protocol version 1 only supports RSA keys. Protocol version 2 provides
    authentication through RSA and DSA keys.


    To manage public key authentication, you need to know the following:


    +   - Public Key Authentication Process

    - Create a Key Pair

    - Configure and Use Public Key Authentication


    # Public Key Authentication Process


    To use public key authentication, the public key of the user has to be stored
    on the server in the home directory of the user account being accessed. These
    public keys are stored on the server in the file ~/.ssh/authorized_keys. The corresponding
    private key must be stored on the client computer.


    With the keys stored in the appropriate places, the following occurs in the public
    key authentication process:


    +   1. The client informs the server which public key is being used for authentication.

    2. The server checks to see if the public key is known.

    3. The server encrypts a random number using the public key and transfers this
    to the client.

    4. Only the client is able to decrypt the random number with its private key.

    5. The client sends the server an MD5 checksum that it has calculated from the
    number.'
  merge: -1
  pgno: 513
- img_proc: true
  md: '+   6. The server also calculates a checksum and if they are identical, the
    user has authenticated successfully.


    +   7. If public key authentication fails and password authentication is allowed,
    the user is asked for the login password.


    The secret key should be protected by a passphrase. Without passphrase protection,
    simply owning the file containing the private key is sufficient for a successful
    authentication.


    However, if the key is additionally protected with a passphrase, the file is useless
    if you do not know the passphrase.


    # Create a Key Pair


    You create a key pair with the command ssh-keygen. A different key is required
    for SSH1 than for SSH2. For this reason, you need to create a separate key pair
    for each version.


    You use the option -t keytype to specify the type of key. ssh-keygen -t rsa1 generates
    a key pair for SSH1; ssh-keygen -t rsa or ssh-keygen -t dsa are used to create
    key pairs for ssh2.


    The keys are stored in the directory ~/.ssh. For SSH1, the default of these files
    are ~/.ssh/identity (private key) and ~/.ssh/identity.pub (public key). For SSH2
    the default files are ~/.ssh/id_rsa and ~/.ssh/id_dsa, respectively, plus the
    corresponding public key files with the .pub extension.'
  merge: -1
  pgno: 514
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    The following shows how a key pair for the protocol version 2 is

    generated using option -t (required) to generate a DSA key pair:


    ```

    geeko@da10:~ ssh-keygen -t dsa

    Generating public/private dsa key pair.

    Enter file in to save the key (/home/geeko/.ssh/id_dsa):

    Enter passphrase (empty for no passphrase):

    Enter same passphrase again:

    Your identification has been saved in /home/geeko/.ssh/id_dsa.

    Your public key has been saved in /home/geeko/.ssh/id_dsa.pub.

    The key fingerprint is:

    ef:73:c6:f6:8a:ff:3d:d1:50:01:cf:07:65:54:8b geeko@da10

    ```


    # Configure and Use Public Key Authentication


    For authentication using RSA or DSA keys, you need to copy the

    public key to the server, and then append the public key to the file

    ~/.ssh/authorized_keys.


    For example, you can copy the key to the server with the command

    scp, as in the following:


    ```

    geeko@da10:~ scp .ssh/id_dsa.pub da50:geeko-pubkey

    ```


    > The key should then be added to the file ~/.ssh/authorized_keys in

    such a way that the existing keys are not overwritten, in the

    following:


    ```

    geeko@da10:~ ssh da50

    Password:

    Last login: Tue May 30 12:03:29 2006 from da50.digitalairlines.com

    geeko@da50:~> cat geeko-pubkey >> ~/.ssh/authorized_keys

    geeko@da50:~> exit

    geeko@da10:~> _

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.

    To report suspected copying, please call 1-800-PIRATES.


    11-24


    Version 1'
  merge: -1
  pgno: 515
- img_proc: true
  md: 'You can now launch the client to see if authentication with the DSA key works
    properly, as in the following:


    ```

    geeko@da10-> ssh da50

    Enter passphrase for key ''/home/geeko/.ssh/id_dsa'':

    Last login: Tue May 30 12:03:40 2006 from da10.digitalairlines.com

    geeko@da50->

    ```


    You can use the option -i to enter the file name for a private key with a different
    name or location.


    When authentication is done with keys, the passphrase is required when logging
    in to the server or copying with scp. The ssh-agent can be used to avoid having
    to type this passphrase upon each connection.


    When you first start the ssh-add, you need to enter the passphrase using the command
    ssh-add. After that, the ssh-agent monitors all SSH requests and provides the
    required private key as necessary.


    The ssh-agent serves as a wrapper for any other process (such as a shell or the
    X server). The following example shows the start of a bash shell through the ssh-agent:


    ```

    geeko@da10-> ssh-add bash

    geeko@da10-> ssh-add .ssh/id_dsa

    Enter passphrase for .ssh/id_dsa:

    Identity added: .ssh/id_dsa (.ssh/id_dsa)

    ```


    For all ssh or scp commands entered from this shell (for which a key authentication
    is configured), the agent will automatically provide the private key.


    You can also use the ssh-agent with a graphical interface, an X server is started.
    If you log in by using a display manager, the X server loads the file /etc/X11/xdm/sys.session.'
  merge: -1
  pgno: 516
- img_proc: true
  md: 'For the ssh-agent to start automatically when an X server starts, simply enter
    the following parameter in the file sys.xsession:


    usesh="yes"


    This entry is already set by default in SUSE Linux Enterprise Server.


    After entering the yes parameter, the ssh-agent starts automatically the next
    time the user logs in to the graphical interface. The agent running in the background
    must be given the passphrase once, as as in the following:


    ```

    geeko@da10:~ ssh-add .ssh/id_rsa

    Enter passphrase for .ssh/id_rsa:

    Identity added: .ssh/id_rsa (.ssh/id_rsa)

    ```


    For subsequent connections in which authentication takes place with the public
    key procedure, a passphrase no longer has to be given. This ssh-agent takes care
    of the private keys.


    When the X server is terminated, the ssh-agent is also closed. The passphrase
    is never stored in a file, only the private keys are stored in memory by the ssh-agent
    until the user has logged out again.'
  merge: -1
  pgno: 517
