- img_proc: true
  md: '# Summary


    | Objective | Summary |


    +   1. Configure User Authentication with PAM | Linux uses PAM (Pluggable Authentication
    Modules) in the authentication process as a layer that communicates between users
    and applications.


    Within the PAM framework there are four different module types: auth, account,
    session, and password. flags—required, requisite, sufficient, optional—govern
    what happens on success or failure of a module.


    Files in /etc/pam.d/ are used to configure PAM, with additional configuration
    options in files in /etc/security/ for certain modules.


    +   2. Manage and Secure the Linux User Environment | You should only use the
    root account when absolutely necessary, using tools like sudo, su, or gnomes as
    applicable.


    Defaults for user accounts and other security relevant settings can be configured
    using the YaST Local Security module.


    The configuration settings are written to various files, the most pertinent being
    in /etc/default/, and /etc/login.defs.'
  merge: -1
