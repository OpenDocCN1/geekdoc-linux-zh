    # Understand Services (Daemons)


    A service is also called a daemon and is a process or collection of processes
    that wait for an event to trigger an action on the part of the program. In network
    based services, this event is a network connection. Other services, like cron
    and atd, are time-based and perform certain tasks at certain points in time.


    These network-based services create a listener on a TCP or UDP port when they
    are started, usually during system startup. This listener waits for network traffic
    to appear on the designated port, and when traffic is detected, the program processes
    the traffic as input and generates output that is sent back to the requester.'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'For example, when a web browser connects to a web server, it sends a request
    to the web server, the web server processes the request and sends back its response.
    This response is then handled by the web browser, which would make the page human-readable.


    Most network-based services work in a similar way, although the data is not always
    clear text data as in the web server example.


    # Manage a Daemon Process


    Daemons run in the background and are usually started when the system is booted.
    Daemons make a number of services available.


    For this reason, daemons are terminal-independent processes, and are indicated
    in the ps x TTY column by a “”.


    ```

    da10:- # ps x

    PID TTY     STAT TIME COMMAND

    ... ...

    2767 ?     Ssl  0:00 /usr/sbin/nscd

    ```


    In most cases, you can recognize a daemon by the ending “d” (such as syslog or
    sshd). However there are also a number of services where this is not the case
    (such as cron or portmap).


    There are 2 types of daemons available:


    +   - Signal-controlled daemons. These are always activated when a corresponding
    task exists (such as cuspd).

    - Interval-controlled daemons. These are always activated at certain intervals
    (such as cron or atd).'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'For each daemon, there is a script in /etc/init.d/. Each script can be controlled
    and run with the following parameters:


    # Table 5-8


    | Parameter | Description |

    | --- | --- |

    | start | Starts the service |

    | stop | Stops the service |

    | reload (or restart) | Reloads the configuration file of the service, or stops
    the service and starts it again |


    For many scripts, there is a symbolic link in the directory /usr/sbin/ or in the
    directory /usr/bin/, which has the following:


    ```

    da10: # ls -l /usr/sbin/rcsshd

    lrwxrxrwx 1 root root 16 Jul 16 17:26 /usr/sbin/rcsshd -> /etc/init.d/sshd

    ```


    You can start the service from the directory /etc/init.d/ (such as /etc/init.d/sshd
    start). If a link exists in the /usr/sbin/ or /usr/bin/, you can use rservice
    (as rcsshd start).


    You can find configuration files for daemons in the directory /etc/ or in a subdirectory
    of /etc/.


    The executable programs (the actual daemons) are located either in the directory
    /sbin/ or in the directory /usr/bin/.


    For documentation on most daemons, see /usr/share/doc/packages/.


    Some important daemons include the following:


    +   - cron Starts other processes at specified times.

    - cupsd The printing daemon.

    - httpd The daemon of the Apache2 web server


