  md: '# SECTION 10 Manage Printing


    The first objective in this section covers configuring printing on the local machine,
    using either a locally connected printer or a printer available in the local network.


    The next objective deals with management of the print queues using CUPS (Common
    UNIX Printing System) command line tools.


    The following objectives cover information on how CUPS works and how to make local
    printers available for others in the network. Access control, CUPS configuration
    and other advanced topics are also covered.


    CUPS is based on the Internet Printing Protocol (IPP). This protocol is supported
    by most printer manufacturers and operating systems. IPP is a standardized printer
    protocol that enables authentication and access control.


    While SUSE Linux Enterprise Server 10 also supports the traditional LPr printing
    system, this section is limited to CUPS, because it is the default printing system
    for the SUSE Linux Enterprise Server 10.


