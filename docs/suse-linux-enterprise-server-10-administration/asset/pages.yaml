- img_proc: true
  md: '# Assign an IP Address to a Device


    To assign an address to a device, use a command similar to the following:


    ```

    da2:~ # ip address add 10.0.0.2/24 brd + dev eth0

    ```


    In this example, the command assigns the IP address 10.0.0.2 to the device eth0.
    The network mask is 24 bits long, as determined by the /24 after the IP address.
    The brd + option sets the broadcast address automatically as determined by the
    network mask.


    You can enter ip address show dev eth0 to verify the assigned IP address. The
    assigned IP address is displayed in the output of the command line.


    You can assign more than one IP address to a device.


    # Delete the IP Address from a Device


    To delete the IP address from a device, use a command similar to the following:


    ```

    da2:~ # ip address del 10.0.0.2 dev eth0

    ```


    In this example, the command deletes the IP address 10.0.0.2 from the device eth0.


    Use ip address show eth0 to verify that the address was deleted.


    # Change Device Attributes


    You can also change device attributes with the ip tool. The following is the basic
    command to set device attributes:'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# ip link set device attribute


    The possible attributes are described in “Device Attributes” on 4-6. The most
    important attributes are up and down. By setting these attributes, you can enable
    or disable a network device.


    To enable a network device (such as eth0), enter the following command:


    ```

    da2:~ # ip link set eth0 up

    ```


    To disable a network device (such as eth0), enter the following command:


    ```

    da2:~ # ip link set eth0 down

    ```


    # Save Device Settings to a Configuration File


    All device configuration changes you make with are lost when the system is rebooted.
    To restore the device configuration automatically when the system is started,
    the settings need to be saved in configuration files.


    The configuration files for network devices are located in the directory /etc/sysconfig/network/.


    If the network devices are set up with YaST, one configuration file is created
    for every device.


    For Ethernet devices, the filenames consist of ifcfg-eth-id- and the hardware
    address of the device. For a device with the hardware address 00:30:05:4b:98:85,
    the filename would be ifcfg-eth-id-00:30:05:4b:98:85.'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'We recommend that you set up a device with YaST first and make changes in the
    configuration file. Setting up a device from scratch is a complex task, because
    the hardware driver also needs to be configured manually.


    If you have more than one network adapter in your system, it might be difficult
    to find the corresponding configuration file for a device.


    You can use the command **ip link show** to display the hardware address for each
    Ethernet device. Because the hardware address is part of the file name, you can
    identify the right configuration file.


    The content of the configuration files depends on the configuration of the device.
    To change the configuration file, you need to know how to do the following:


    +   - Configure a Device Statically


    +   - Configure a Device Dynamically with DHCP


    +   - Start and Stop Configured Interfaces


    # Configure a Device Statically


    The content of a configuration file of a statically configured device is similar
    to the following:


    ```

    BOOTPROTO=''static''

    BROADCAST=''''

    ETHTOOL_OPTIONS=''''

    IPADDR=''10.0.0.2''

    MTU=''

    NAME=''Digital DECChip 21142/43''

    NETMASK=''255.255.255.0''

    NETWORK=''''

    REMOTE_IPADDR=''''

    STARTMODE=''auto''

    UNIQUE=''BUF,+xOL8ZSCAQC''

    USERCONTROL=''no''

    _dm_name=''bus-pci-0000:00:0b.0''

    ETHTOOL_OPTIONS='' ''

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 222
- img_proc: true
  md: "The configuration file includes several lines. Each line has an option\nand\
    \ a value assigned to that option, as explained below:\n\n+   **BOOTPROTO='static'**\n\
    The option BOOTPROTO determines the way the device is\nconfigured. There are 2\
    \ possible values:\n* Static, The device is configured with a static IP address.\n\
    * DHCP. The device is configured automatically with a\nDHCP server.\n\n+   **REMOTE_IPADDR=\"\
    **\nnYou need to set the value for the REMOTE_IPADDR option\nonly if you are setting\
    \ up a point-to-point connection.\n\n+   **STARTMODE='onboot'**\nThe STARTMODE\
    \ option determines how the device is started.\nThe option can include the following\
    \ values:\n* auto. The device is started at boot time or when initialized\nat\
    \ runtime.\n* manual. The device must be started manually with ifup.\n* ifplugd.\
    \ The interface is controlled by ifplugd. If you want\nto use interfaces mutually\
    \ exclusive, also set\n  IFPLUGD_PRIORITY\n\n+   **UNIQUE='rBUF+xOL8ZCSCAQ'**\n\
    _nm_name='bus-pci-0000:00:0b.0'\n\nThese 2 lines contain options added by YaST\
    \ when the device is\nconfigured. They don't affect the network configuration\
    \ itself.\n\n+   **BROADCAST=\"**\nIPADDR='10.0.0.2'\nNETMASK='255.255.255.0'\n\
    NETWORK='\"\n\nThese 4 lines contain the options for the network address\nconfiguration.\
    \ The options have the following meanings:"
  merge: -1
  pgno: 223
- img_proc: true
  md: '+   - BROADCAST. The broadcast address of the network. If empty, the broadcast
    address is derived from the IP address and the netmask, according to the configuration
    in /etc/sysconfig/network/config.


    +   - IPADDR. The IP address of the device.


    +   - NETMASK. The network mask.


    +   - NETWORK. The address of the network itself.


    +   - MTU="


    YnYou can use the MTU option to specify a value for the MTU (Maximum Transmission
    Unit). If you don''t specify a value, the default value is used. For an Ethernet
    device, the default value is 1500 bytes.


    +   - ETHTOOL_OPTIONS="


    nethtool is used for querying settings of an Ethernet device and changing them,
    for instance setting the speed or half/full duplex mode. The manual page for ethtool
    lists the available options.


    If you want ethtool to modify any settings, list the options here; if no options
    are listed, ethtool is not called.


    The file /etc/sysconfig/network/ifcfg.template contains a template that you can
    use as a base for device configuration files. It also has comments explaining
    the various options.


    # Configure a Device Dynamically with DHCP


    If you want to configure a device using a DHCP server, you set the BOOTPROTO option
    to dhcp as shown in the following:


    ```

    BOOTPROTO=''dhcp''

    ```'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'When the device is configured by using DHCP, you don''t need to set any options
    for the network address configuration in the file. If there are any settings,
    they are overwritten by the settings of the DHCP server.


    # Start and Stop Configured Interfaces


    To apply changes to a configuration file, you need to stop and restart the corresponding
    interface. You can do this with the commands ifdown and ifup.


    For example, entering ifdown eth0 disables the device eth0. **ifup eth0** enables
    eth0 again.


    When the device is restarted, the new configuration is read from the configuration
    file.


    The interfaces with IP addresses, routes, etc. with the ip tool requires an existing
    device setup, including a correctly loaded kernel module. This is usually done
    at boot by /bin/hwup, with the configuration contained in files in the directory
    /etc/sysconfig/hardware/. Information is available in the manual page for hwup.


    Under certain circumstances physical network devices can change the interface
    name, for instance the interface that used to be eth0 now becomes eth1 and vice
    versa. Sometimes this happens from one boot to the next, without any physical
    changes on the hardware. Information on how to achieve persistent interface names
    is contained in the file /usr/share/doc/packages/sysconfig/README.Persistent_Interface_Names.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Objective 3 Set Up Routing with the ip Tool


    You can use the ip tool to configure the routing table of the Linux kernel. The
    routing table determines the path IP packets use to reach the destination system.


    Because routing is a very complex topic, this objective only covers the common
    routing scenarios.


    You can use the ip tool to perform the following tasks:


    +   - View the Routing Table

    - Add Routes to the Routing Table

    - Delete Routes from the Routing Table


    As changes made with ip are lost with the next reboot, you also have to know how
    to:


    +   - Save Routing Settings to a Configuration File


    # View the Routing Table


    To view the current routing table, enter ip route show. For most systems, the
    output looks similar to the following:


    ```

    da2-# ip route show

    10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.2

    169.254.0.0/16 dev eth0 scope link

    127.0.0.0/8 dev lo scope link

    default via 10.0.0.254 dev eth0

    ```


    Every line represents an entry in the routing table. Each line in the example
    is shown and explained below:


    +   - 10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.2'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'This line represents the route for the local network. All network packets to
    a system in the same network are sent directly through the device eth0.


    +   - 169.254.0.0/16 dev eth0 scope link


    This line shows a network route for the 169.254.0.0 network. Hosts can use this
    network for address auto configuration.


    SLES 10 automatically assigns a free IP address from this network when no other
    device configuration is present. The route to this network is always set, especially
    when the system itself has no assigned IP address from that network


    +   - 127.0.0.0/8 dev lo scope link


    This is the route for the loopback device.


    +   - default via 10.0.0.254 dev eth0


    This line is the entry for the default route. All network packets that cannot
    be sent according to the previous entries of the routing table are sent through
    the gateway defined in this entry.


    Depending on the setup of your machine, the content of the routing table varies.
    In most cases, you have at least 2 entries in the routing table:


    +   - One route to the local network the system is connected to

    - One route to the default gateway for all other packets


    # Add Routes to the Routing Table


    The following are the most common tasks you do when adding a route:


    +   - Set a Route to the Locally Connected Network

    - Set a Route to a Different Network

    - Set a Default Route'
  merge: -1
  pgno: 227
- img_proc: true
  md: Packets that cannot be sent according to previous entries in the routing table
    are sent through the gateway **10.0.0.254.**
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Delete Routes from the Routing Table


    To delete an entry from the routing table, use a command similar to the following:


    ```

    da2:~ # ip route delete 192.168.1.0/24 dev eth0

    ```


    This command deletes the route to the network **192.168.1.0** assigned to the
    device **eth0**.


    # Save Routing Settings to a Configuration File


    Routing settings made with the ip tool are lost when you reboot your system. Settings
    have to be written to configuration files to be restored at boot time.


    Routes to the directly connected network are automatically set up when a device
    is started. All other routes are saved in the configuration file `/etc/sysconfig/network/routes`.


    The following shows the content of a typical configuration file:


    ```

    192.168.1.0 10.0.0.100 255.255.255.0 eth-id-00:30:05:4b:98:85

    default 10.0.0.254 - -

    ```


    Each line of the configuration file represents an entry in the routing table.
    Each line is shown and explained below:


    +   * **192.168.1.0 10.0.0.100 255.255.255.0 eth-id-00:30:05:4b:98:85**

    All packets sent to the network **192.168.1.0** with the mask **255.255.255.0**
    are sent to the gateway **10.0.0.100** through the device with the **eth-id-00:30:05:4b:98:85**.
    The id is the same as used for the device configuration file.

    * **Default 10.0.0.254 - -**'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'This entry represents a default route. All packets that are not affected by
    the previous entries of the routing table are sent to the gateway 10.0.0.254.
    It’s not necessary to fill out the last 2 columns of the line for a default route.


    To apply changes to the routing configuration file, you need to restart the affected
    network device with the commands ifdown and ifup.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Objective 4


    # Test the Network Connection With Command Line Tools


    After the network is configured, you might want to test the network connection
    by doing the following:


    +   - Test Network Connections with ping

    - Trace Network Packets with traceroute


    # Test Network Connections with ping


    The tool ping lets you check network connections in a simple way between two hosts.
    If the ping command works, then both the physical and logical connections are
    correctly set up between the two hosts.


    The ping command sends special network packets to the target system and waits
    for a reply. In the simplest scenario, you enter ping with an IP address:


    # ping 10.0.0.10


    You can also use the host name of the target system instead of an address. The
    output of ping looks similar to the following:


    ```

    PING 10.0.0.10 (10.0.0.10) 56(84) bytes of data.

    64 bytes from 10.0.0.10: icmp_seq=1 ttl=60 time=2.95 ms

    64 bytes from 10.0.0.10: icmp_seq=2 ttl=60 time=2.16 ms

    64 bytes from 10.0.0.10: icmp_seq=3 ttl=60 time=2.18 ms

    64 bytes from 10.0.0.10: icmp_seq=4 ttl=60 time=2.08 ms

    ```


    Each line of the output represents a packet sent by ping. Ping keeps sending packets
    until it is terminated by pressing Ctrl+C.


    The output displays the following information:


    +   - The size of an ICMP datagram (64 bytes).'
  merge: -1
  pgno: 231
- img_proc: true
  md: '+   ■ The IP address of the target system (from 10.0.0.10).


    +   ■ The sequence number of each datagram (seq=1).


    +   ■ The TTL (TTL, time to live) of the datagram (ttl=60).


    +   ■ The amount of time that passes between the transmission of a packet and
    the time a corresponding answer is received (time=2.95 ms). This time is also
    called the Round Trip Time.


    If you get an answer from the target system, you can be sure that the basic network
    device setup and routing to the target host works.


    The following table provides some options for ping you can use for advanced troubleshooting:


    # Table 4-1


    | Option | Description |

    | --- | --- |

    | -c count | The number of packets to be sent. After this number has been reached,
    ping is terminated. |

    | - interface | Specifies the network interface to be used on a computer with
    several network interfaces. |

    | -l seconds | Specifies the number of seconds to wait between individual packet
    shipments. The default setting is 1 second. |

    | -f | (Flood ping) Packets are sent one after another at the same rate as the
    respective replies arrive. For normal users the root can use this option. The
    minimum time is 200 milliseconds. |

    | -l preload | (Lowercase L) sends packets without waiting for a reply. |

    | -n | The numerical output of the IP address. Address resolutions to host names
    are not carried out. |

    | -t ttl | Sets the Time To Live for packets to be sent. |'
  merge: -1
  pgno: 232
- img_proc: true
  md: '| Table 4-1 (continued) | Option | Description |

    | --- | --- | --- |

    | -w maxwait | Specifies a timeout in seconds, before ping exits regardless of
    how many packets have been sent or received. |

    | -b | Sends packets to the broadcast address of the network. |


    # Trace Network Packets with traceroute


    The diagnosis tool traceroute is primarily used to check the routing between different
    networks. To achieve this task, traceroute sends packets with an increasing TTL
    value to the destination host, whereby three packets of each value are sent.


    Traceroute also uses UDP packets, which are called datagrams.


    First, three datagrams with a TTL=1 are sent to the host, then three packets with
    a TTL=2, and so on. The TTL of a datagram is reduced by one, every time it passes
    through a router.


    When the TTL reaches zero, the datagram is discarded and a message is sent to
    the sender. Because the TTL is increased by one every packet, traceroute can collect
    information about every router on the way to the destination host.


    You normally include a host name with the traceroute command, as in the following:


    ```

    traceroute pluto.example.com

    ```'
  merge: -1
