  md: '# Objective 2


    # Schedule Jobs


    Most SUSE Linux Enterprise Server administrators and users that they need to carry
    out certain tasks regularly on a running system (such as updating a database or
    backing up data).


    You can automate these jobs in Linux by doing the following:


    +   - Schedule a Job (cron)

    - Run a Job One Time Only (at)


    # Schedule a Job (cron)


    You can schedule jobs to be carried out on a regular basis by using the service
    cron (/usr/sbin/cron).


    The service runs as a daemon and checks once to minute see if jobs have been defined
    for the current time. By default, the service should be activated.


    The file that contains the list of jobs is called a crontab. A crontab exists
    for the entire system as well as for each user defined on the system.


    The file /etc/sysconfig/cron contains variables for the configuration of some
    scripts started by cron.


    There are 2 types of jobs that can be defined with cron:


    +   - System Jobs

    - User Jobs'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# System Jobs


    You control system jobs with the file /etc/crontab. After installation there is
    only one job defined that runs the scripts contained in the following directories
    in the intervals indicated:


    | Directory | Interval |

    | --- | --- |

    | /etc/cron.hourly | Jobs are run on an hourly basis. |

    | /etc/cron.daily | Jobs are run on a daily basis. |

    | /etc/cron.weekly | Jobs are run on a weekly basis. |

    | /etc/cron.monthly | Jobs are run on a monthly basis. |


    You can add lines to /etc/crontab, but you should not delete the lines added at
    installation.


    > For a detailed description of the syntax for /etc/crontab, enter man 5 crontab.


    The scripts called from the file /etc/crontab not only ensure that the scripts
    are run at the prescribed intervals (handled by the script /usr/lib/cron/run-crons),
    but also that jobs are run later if they could not be run at the specified time.


    For example, if a script could not be run at the specified time because the computer
    was turned off overnight, the script is automatically run later using the settings
    in /etc/crontab.


    This is only valid for jobs defined in a script in cron.hourly, cron.daily, cron.weekly,
    cron.monthly.


    Information about the last time the jobs were run is kept in the directory /var/spool/cron/lastrun/
    in a file such as cron.daily.


    The time stamp of the file is evaluated by the script /usr/lib/cron/run-crons
    to determine if scripts have to be run or not.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'In a standard installation, only the directory /etc/cron.daily/ contains

    scripts, as visible in the following:


    ```

    da10:~# ls -l /etc/cron*

    -rw-r-- 1 root root 11 2006-05-08 20:47 /etc/cron.deny

    -rw-r--r 1 root root 255 2006-05-08 20:47 /etc/crontab


    /etc/cron.d:

    insgesamt 0


    /etc/cron.daily:

    insgesamt 32

    -rwxr-xr-x 1 root root 393 ... logrotate

    -rwxr-xr-x 1 root root 948 ... suse-clean-catman

    -rwxr-xr-x 1 root root 1875 ... suse.de-backup-rc.config

    -rwxr-xr-x 1 root root 2059 ... suse.de-backup-rpmdb

    -rwxr-xr-x 1 root root 566 ... suse.de-check-battery

    -rwxr-xr-x 1 root root 1320 ... suse.de-clean-tmp

    -rwxr-xr-x 1 root root 371 ... suse.de-cron-local

    -rwxr-r-- 1 root root 1196 ... suse-do-mandb


    /etc/cron.hourly:

    insgesamt 0


    /etc/cron.monthly:

    insgesamt 0


    /etc/cron.weekly:

    insgesamt 0

    ```


    These shell scripts are overwritten when you update your system.

    Any modifications you make to these files get lost when these files

    are updated.


    For this reason, it is advisable to write your own additions and

    modifications to /root/bin/cron.daily,local (see

    /etc/cron/suse.de-cron-local), because this script is not

    overwritten when you update your system.


    Other files for system jobs can be stored in the directory

    /etc/cron.d/. These files must have the same format as /etc/crontab.

    Jobs defined in /etc/cron.d are not run automatically at a later time.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# User Jobs


    The jobs of individual users are stored in the directory /var/spool/cron/tabs/
    in files matching the user names. These files always belong to the user root.
    Users create their own jobs using the command crontab.


    The following are options for the command crontab:


    | Option | Description |

    | --- | --- |

    | crontab | Creates or edits jobs. The vi editor is used. |

    | crontab file | The specified file contains a list of jobs in the proper format
    and replaces any existing crontab file for that user. |

    | crontab -l | Displays current jobs. |

    | crontab -r | Deletes all jobs. |


    # Table 5-10


    Each line in a file defines a job. There are 6 fields in a line.

    The first 5 fields define the time, the final field contains the command to run.
    This can be any type of command or shell script. However, no user interaction
    is available when the command or shell script is run.

    The first 5 fields have the following format:


    | Field | Range |

    | --- | --- |

    | Minutes | 0–59 |

    | Hours | 0–23 |

    | Day of the Month | 1–31 |

    | Month | 0–12 |

    | Weekday | 0–7 |


    # Table 5-11'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'The following are guidelines for configuring these fields:


    +   - If you want a job to run on every date, enter an asterisk (*) in the corresponding
    field.

    - You can include several entries in a field, separated by commas.

    - You can specify a range with start and end values separated by a hyphen.

    - You can configure time steps with /n (where n stands for the size of the step).

    - You can specify months and weekdays by their first letters (not case-sensitive).
    However, when you use letters, you cannot use ranges or lists.

    - Numbers representing the weekdays start at 0 for Sunday and run through the
    entire week consecutively, with 7 representing Sunday again.


    For example, 3 is Wednesday and 6 is Saturday.


    The following is an example of a cron job entry:


    ```

    /10 8-17 * * 1-5 fetchmail mailserver

    ```


    In this example, from Monday to Friday (1-5) every 10 minutes (*/10) between 8.00
    and 17.00 (8-17), the command fetchmail is run to fetching emails from the computer
    mailserver.


    For system jobs, the user who has the permissions to run the command must be specified
    in the file /etc/crontab, by entering the user name between the time details (the
    first 5 fields) and the name of the command (which now becomes the seventh field).'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Run a Job One Time Only (at)


    If you want to run a job one time only (instead of scheduling it at on a regular
    basis with cron) you can use the command **at**. To use at, you must make sure
    the service atd is started.


    There are 2 files that determine which users can run this command:


    +   - /etc/at.allow (users entered here can define jobs)

    - /etc/at.deny (users who are not listed in this file can define jobs)


    These files are text files that you can modify or create.


    By default, the file /etc/at.deny already exists with its own entries, such as
    the following:


    ```

    alias

    backup

    bin

    daemon

    ftp

    games...

    ```


    If the file /etc/at.allow exists, only this file is evaluated. If neither of these
    files exist, only the user root can define jobs with at.


    You define a job from a command prompt by entering **at launch_time** (where **launch_time**
    is when you want the job to begin, for instance 12:34).


    At this point you are placed in a special environment where you enter commands
    1 line at a time. When you finish entering commands, you save the job by pressing
    **Ctrl+D**.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'The following is an example of creating a job with the command at:


    ```

    geeko@da10:~ at 21:00

    warning: commands will be executed using /bin/sh

    at> /home/geeko/bin/doit

    at> mail -s *Results file of geeko@da10 < /home/geeko/results

    at> <EOT

    job 4 at 20004-08-27 21:00

    ```


    If the commands you want executed are contained in a text file, you need to enter
    at -f file launch_time (where file is the pathname of the file).


    The following are some other commonly-used commands and options at:


    | Command | Description |

    | --- | --- |

    | atq | Delete defined jobs (including job numbers, which are needed to delete
    a job) |

    | atrm job_number | Delete a job (using the job number) |


    # Table 5-12'
  merge: -1
  pgno: 274
