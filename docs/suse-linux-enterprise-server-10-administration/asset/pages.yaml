- img_proc: true
  md: '# Manage and Secure the Linux User Environment


    Besides managing individual user user accounts, you also need to know how to do
    the following to manage and secure the Linux user environment:


    +   * Perform Administrative Tasks as root

    * Delegate Administrative Tasks With sudo

    * Set Defaults for New User Accounts

    * Configure Security Settings


    # Perform Administrative Tasks as root


    As a system administrator, you are advised to log in as a normal user and only
    switch to root to perform tasks that require root permissions.


    To switch between a normal user and root while performing administrative tasks,
    you can do the following:


    +   * Switch to Another User With su

    * Switch to Another Group With newgrp

    * Start Programs as Another User From Gnome


    # Switch to Another User With su


    You can use the command su (switch user) to assume the UID of root or of other
    users.


    The following is the su syntax:


    ```

    su [options] ...[-] [user[argument]]

    ```


    Objective 2'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'For example, to change the user geeko, enter su geeko; change to the user root,
    enter su root or su (without a user name). If you want to start a login shell
    when changing to the user root, you can enter su - .


    Root can change to any user ID without knowing the password of the user.


    To return to your previous user ID, enter exit.


    To change to the user root and execute a single command, use the option -c:


    ```

    geeko@da10:~> su -c "grep geeko /etc/shadow"

    ```


    For additional information on the command, enter su --help.


    # Switch to Another Group With newgrp


    A user can be a member of many different groups, but only one GID is his effective
    (current) group at any one time. Normally this is the primary group, which is
    specified in the file /etc/passwd.


    If a user creates directories or files, then they belong to the user and to the
    effective group.


    You can change the effective group GID with the command newgrp or sg (such as
    sg video).


    Only group members may perform this group change, unless a group password is defined.
    In this case, any user who knows the group password can make the change too.


    You can undo the change (return to the original effective GID) by entering exit
    or by pressing Ctrl+D.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Start Programs as Another User From Gnome


    In Gnome you can start any program with a different UID (as long you know the
    password), use the program gnomesu.


    From the Gnome desktop, open a command line dialog by pressing Alt+F2; then enter
    gnomesu. You are prompted for the root password, and after entering it a terminal
    window opens up. The path is still that of the user logged in to Gnome; if you
    need the standard environment for root, enter su - in the terminal window.


    You can specify a different user than root and also start a program directly with
    the following syntax: gnomesu -u user command. If the command is not in the path
    of the user logged in, you have to enter the full path, like gnomesu /sbin/yast2,
    which starts YaST after the root password is entered.


    > For some programs it is not necessary to use gnomesu after entering Alt+F2;
    for instance when you enter yast2 directly you are automatically prompted for
    the root password.


    # Delegate Administrative Tasks With sudo


    Sometimes it is necessary to allow a normal user access to a command which is
    usually reserved for root. For example, you might want a co-worker to take over
    tasks such as shutting down the computer and creating users while you are on vacation,
    without sharing the root password.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_171_0.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: "The default configuration of sudo in SLES10 requires the knowledge of the root\
    \ password. If you know the root password, you would actually not need to use\
    \ sudo for administrative tasks. Its use has the advantage that the commands executed\
    \ are logged to /var/log/messages and that you do not need to retry the password\
    \ for each command (as with su -c command), because it is cached for some minutes\
    \ by sudo.\n\n```\ngeeko@da10:~ sudo /sbin/shutdown -h now\n```\n\nWe trust you\
    \ have received the usual lecture from the local System Administrator. It usually\
    \ boils down to these three things:\n\n+   #1) Respect the privacy of others.\n\
    #2) Think before you type.\n#3) With great power comes great responsibility.\n\
    \n```\nroot's password:\n```\n\nYou can change the configuration of sudo so that\
    \ it asks for the password instead of the root password. In order to do this,\
    \ put a comment sign (#) in front of the following two lines in /etc/sudoers,\
    \ using the command visudo.\n\n| In the default (unconfigured) configuration,\
    \ sudo asks for the root |\n| # password. This allows use of an ordinary user\
    \ account for administration |\n| of a freshly installed system. When configuring\
    \ sudo, delete the two |\n| following lines: |\n| Defaults targetpw # ask for\
    \ the password of the target user i.e. root |\n| ALL ALL=(ALL) ALL # WARNING!\
    \ Only use this together with 'Defaults |\n targetpw!' |\n\nUsing sudo, you can\
    \ specify which commands a user can or cannot enter by configuring the file /etc/sudoers.\n\
    \nThe following is the general syntax of an entry in the configuration file:\n\
    \n```\nuser/group host = command1, command2 ...\n```\n\n# CNI USE ONLY-1 HARDCOPY\
    \ PERMITTED"
  merge: -1
