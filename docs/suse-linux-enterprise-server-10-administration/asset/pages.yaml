  md: '# Objective 2


    # Configure Linux File System Partitions


    A basic task of all system administrators is maintaining file system layouts.
    As a note of caution, you should always back up your data before working with
    tools that change the partition table or the file systems.


    In most cases, YaST proposes a reasonable partitioning scheme during installation
    that can be accepted without change. However, you can also use YaST to customize
    partitioning after installation.


    On the command line, you would first use fdisk to manage partitions, and then
    create a file system on partition using mkfs.


    To implement partitions on your SUSE Linux Enterprise Server, you need to know
    the following:


    +   * Linux Device and Partition Names

    * Design Guidelines for Implementing Partitions

    * Manage Partitions with YaST

    * Manage Partitions with fdisk


