  md: '# Access Restrictions


    You can restrict the access to various CUPS resources. The resources are displayed
    as directories (/printers or /jobs).


    Normally, the following resources are available on the CUPS server:


    +   - /(root). The access restrictions for this resource apply for all subsequent
    resources if no other restrictions are specified there.

    - /printers. All printers or queues.

    - /classes. Available printer classes; for example, all color printers.

    - /jobs. Print jobs on the CUPS server.

    - /admin. These settings concern the access to the server configuration.


    These resources can be accessed in various ways, for example, with a web browser:


    +   - http://localhost:631/printers

    - http://localhost:631/admin


    You can configure access restrictions by using YaST.


    In the CUPS Server Settings dialog, where you configured browsing (Figure 10-20),
    select the resource and then Change Permissions.'
  merge: -1
  pgno: 472
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    You can define the order in which access directives are applied (whether to apply
    the allow rules first then deny rules or vice versa), and the default directive
    in the next dialog.


    # Figure 10-21


    ![](img/84d12236ddfe17cc29fd21173b9904ac_473_0.png)


    Under Permissions, define the entities to which the access rules should be applied
    in line with the previously specified order.


    Access settings are stored in the configuration file `/etc/cups/cupsd.conf`.


    YaST writes most of these entries to the end of the file.


    10-48 CNI USE ONLY-1 HARDCOPY PERMITTED Version 1


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
