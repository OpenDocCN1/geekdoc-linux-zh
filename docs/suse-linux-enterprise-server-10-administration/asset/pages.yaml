- img_proc: true
  md: '# Objective 3


    # Manage Runlevels


    Managing runlevels is an essential part of Linux system administration. In this
    objective, you learn what runlevels are, the role of the program init, and how
    to configure and change runlevels:


    +   * The init Program and Linux Runlevels

    * init Scripts and Runlevel Directories

    * Change the Runlevel


    # The init Program and Linux Runlevels


    +   * The init Program

    * The Runlevels

    * init Configuration File (/etc/inittab)


    # The init Program


    The system is initialized by /sbin/init, which is started by the kernel as the
    first process of the system.


    This process, or one of its child processes, starts all additional processes.
    In addition, because init is the last process running, it ensures that all other
    processes are correctly ended. This means that init controls the entire booting
    and shutting down of the system.


    Because of this position of priority, signal 9 (SIGKILL), with which all processes
    can normally be ended, has no effect on init.


    The main configuration file of init is /etc/inittab. Various scripts are started
    by init, depending on entries in this file. All these scripts are located in the
    directory /etc/init.d.


    Part of the configuration in /etc/inittab is the runlevel the system uses after
    booting.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# The Runlevels


    In Linux, various runlevels define the state of the system. The following are
    the available runlevels:


    | Command | Description |

    | --- | --- |

    | 0 | Halt |

    | S | Used to boot into single-user mode (US keyboard layout) |

    | 1 | Single-user mode |

    | 2 | Multiuser mode without network server services |

    | 3 | Multiuser mode with network |

    | 4 | Not used |

    | 5 | Multiuser mode with network and display manager |

    | 6 | Reboot |


    The command runlevel displays the runlevel you are currently in (second number)
    and the previous runlevel (first number), as in the following:


    ```

    dailo0:~ # runlevel

    N 5

    dailo0:~ #

    ```


    # init Configuration File (/etc/inittab)


    To understand the contents of the file /etc/inittab, you need to know the following:


    +   - inittab Syntax

    - inittab Standard Entries'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# inittab Syntax


    The following is the syntax of each line in the file /etc/inittab:

    id:rl:action:process


    The following describes the parameters:


    +   - id. A unique name for the entry in /etc/inittab. It can be up to four characters
    long.

    - rl. Refers to one or more runlevels in which this entry should be evaluated.

    - action. Describes what it is to do.

    - process. Is the process connected to this entry.


    # inittab Standard Entries


    The first entry in the file /etc/inittab contains the following parameters:


    ```

    id:5:initdefault:

    ```


    The parameter initdefault signals the init process which level it should bring
    the system to. The standard default runlevel is 3 or 5.


    The next entry in /etc/inittab looks like this:


    ```

    si:bootwait:/etc/init.d/boot

    ```


    The parameter bootwait indicates to carry out this command while booting and wait
    until it has finished.'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'The next few entries describe the actions for runlevels 0 to 6:


    ```

    10:0:wait:/etc/init.d/rc 0

    11:1:wait:/etc/init.d/rc 1

    12:2:wait:/etc/init.d/rc 2

    13:3:wait:/etc/init.d/rc 3

    #14:4:wait:/etc/init.d/rc 4

    15:5:wait:/etc/init.d/rc 5

    16:6:wait:/etc/init.d/rc 6


    ls:S:wait:/etc/init.d/rc S

    --S:respawn:/sbin/sulogin

    ```


    The parameter wait means that when the system changes to the indicated level,
    the appropriate command is carried out and init waits until it has been completed.
    The parameter also means further entries for the level are only performed after
    this process is completed.


    The single user mode S is a special case, as it works if the file /etc/initabb
    is missing. In such a case, enter S at the boot prompt when the computer starts.
    The command login is started, which allows only the system administrator to log
    in. The parameter respawn indicates to wait for the end of the process and then
    restart it.


    /etc/initabb also defines the Ctrl+Alt+Del key combination for restarting:


    ```

    ca::ctrlaltdel:/sbin/shutdown -r -t 4 now

    ```


    The action ctrlaltdel is carried out by the init process only if these keys are
    pressed. If you do not want to allow this action, comment out (#) or remove the
    line.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'The final large block of entries describes in which runlevels getty

    processes (login processes) are started:


    ```

    1:2345:respawn:/sbin/mingetty --noclear tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```


    The getty processes provide the login prompt and return expect

    user name as input. They are started in runlevels 2, 3, and 5.


    If a session ends, the processes are started again by init. If a line is

    disable here, no further login is possible at the corresponding

    virtual console.


    You should take great care when making changes to the /etc/initabb. If the

    file is corrupted, the system will no longer correctly.


    If an error occurs, first trying S at the kernel command line in the

    GRUB boot menu. If this does not work, it is still possible to boot the system.

    enter init=/bin/bash at the kernel command line in the GRUB boot menu.


    In this way, the init process is replaced by a shell (so initabb it is not read)

    y you can repair the system manually.


    When you changed /etc/initabb, use init q to have init reload its

    configuration.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# init Scripts and Runlevel Directories


    /etc/initab defines the runlevel the system uses after booting is complete. The
    services that need to be started in a certain runlevel are not defined in /etc/initab
    itself. These are configured by symbolic links in directories /etc/init.d/rcx.d/
    which point to scripts in /etc/init.d/. To be able to manage runlevels, you need
    to understand the following:


    +   * init Scripts

    * Runlevel Symbolic Links

    * How init Determines which Services to Start and Stop

    * Activate and Deactivate Services for a Runlevel

    * Activate and Deactivate Services for a Runlevel with YaST'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# init Scripts


    The directory /etc/init.d/ contains shell scripts that are used to perform certain
    tasks at boot up and start stop services in the running system. The following
    shows some of the files in

    /etc/init.d/


    ```

    da10:- # ls -al /etc/init.d/

    total 635

    drwxr-xr-x 11 root root     3336 May 24 13:40 .

    drwxr-xr-x 77 root root     6712 May 25 13:19 .

    -rw-r--r-- 1 root root     1393 May 24 13:40 .depend.boot

    -rw-r--r-- 1 root root     3465 May 24 13:40 .depend.start

    -rw-r--r-- 1 root root     3002 May 24 13:40 .depend.stop

    -rw-r--r-- 1 root root      482 Aug 25 2004 Makefile

    -rw-r--r-- 1 root root     7827 May 18 README

    drwxr-xr-x 1 root root     1257 May  8 20:09 Sufirewall2_init

    drwxr-xr-x 1 root root     1650 May  8 20:09 Sufirewall2_setup

    drwxr-xr-x 1 root root     2609 May  8 20:29 aevydent

    -rw-r--r-- 1 root root     5729 May  8 20:29 acpid

    drwxr-xr-x 1 root root     5265 May  8 21:01 alsound

    drwxr-xr-x 1 root root     3689 May  9 14:49 atd

    drwxr-xr-x 1 root root     6691 May  9 15:03 auditd

    -rw-r--r-- 1 root root     9234 May  9 15:01 autofs

    drwxr-xr-x 1 root root     2967 Mar 14 13:40 autostart

    -rw-r--r-- 1 root root     7072 Apr 20 15:02 boot

    drwxr-xr-x 1 root root     27922 May 29 20:29 boot.apparmor

    ...

    ```


    The files .depend.[boot,start,stop] are created by inserv and contain dependencies
    that are used to determine the proper sequence for starting services.


    The shell scripts can be called in the following ways:


    +   - Directly by init when you boot the system, the system is shut down, or when
    you stop the system with Ctrl+Alt+Del. Examples for these scripts are /etc/init.d/boot
    or /etc/init.d/rc.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 339
- img_proc: true
  md: '+   - Indirectly by init when you change the runlevel. In this case, it is
    the script /etc/init.d/rc that calls the necessary scripts in the correct order
    and with the correct parameter during the runlevel change.


    +   - Directly by /etc/init.d/script parameter.


    You can also enter rcscript parameter if corresponding links are in /sbin/ or
    /usr/sbin/.


    The following parameters may be used:


    # Table 7-2


    | Parameter | Description |

    | --- | --- |

    | start | Starts a service that is not running. |

    | restart | Stops a running service and restarts it. |

    | stop | Stops a running service. |

    | reload | Rereads the configuration of the service without stopping and restarting
    the service itself. |

    | force-reload | Reloads the configuration if the service supports this. Otherwise,
    it does the same thing as restart. |

    | status | Displays the current status of the service. |


    When a script is called without parameters, a message informs you about the possible
    parameters.


    Some of the more important scripts stored in /etc/init.d/ or are:


    +   - boot. This script is started directly by init when the system starts. It
    is run once and only once. It evaluates the directory /etc/init.d/boot.d/ and
    starts all the scripts linked by filenames with an “S” at the beginning of their
    names (see “Runlevel Symbolic Links” on 7-30).


    These scripts perform, for instance, the following tasks:


    +   - Check the file systems'
  merge: -1
  pgno: 340
- img_proc: true
  md: '+   Set up of LVM


    +   Delete unnecessary files in /var/lock/


    +   Set the system time


    +   Configure PnP hardware with the isapnp tools


    +   **boot.local.** This script includes additional commands to execute at boot
    before changing to a runlevel. You can add your own system extensions to this
    script.


    +   **halt.** This script is run if runlevel 0 or 6 is entered. It is called up
    either with the command halt (the system is completely shut down) or with the
    command reboot (the system is shut down and then rebooted).


    +   **rc.** This script is responsible for the correct change from runlevel to
    another. It runs the stops scripts for the current runlevel, and then it runs
    the start scripts for the new one.


    +   **service.** Each service (like cron, apache2, cups) comes with a script allowing
    you to start and stop the service, to reload its configuration, or to view its
    status. To create your own scripts, you can use the file /etc/init.d/skeleton
    as a template.


    # Runlevel Symbolic Links


    To enter a certain runlevel, init calls the script /etc/init.d/rc with the runlevel
    as parameter. This script examines the respective runlevel directory `/etc/init.d/rc.d/`
    and starts and stops services depending on the links in this directory.


    For each runlevel, there is a corresponding subdirectory in /etc/init.d/. For
    runlevel 1 it is /etc/init.d/rc1.d/, for runlevel 2 it is /etc/init.d/rc2.d/,
    and so on.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'When you view the files in a directory such as /etc/init.d/rc3.d, you see two
    kinds of files—those that start with a “K” and those that start with an “S":


    ```

    da10:- # ls /etc/init.d/rc3.d/

    K10cron K17network S07auditd

    K10smbfs K20haldaemon S07portmap

    K11nscd K21accpid S07splash-early

    K11postfix K21ldbus S08nfs

    K12alsasound K21fbset S08nfsboot

    K12boot.apparmor K21irq_balancer S10alsasound

    K12cups K21random S10boot.apparmor

    K12microcode K21resmgr S10cups

    K12powersaved S01accpid S10microcode

    K12splash S01dbus S10powered

    K12shsd S01fbset S10splash

    K14fns S01irq_balancer S10ssd

    K14fsboot S01random S11nscd

    K15audit S01resmgr S11postfix

    K15portmap S02haldaemon S12cron

    K15splash_early S05network S12smbfs

    K16novell-zmd S06novell-zmd

    K16slpd S06ipid

    K16syslog S06syslog

    ```


    The first letter is always followed by 2 digits and the name of a service. Whether
    a service is started in a specific runlevel depends on whether there are Sxxservice
    and Kxxservice files in the /etc/init.d/rcx.d/ directory.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    Entering ls -l in an /etc/init.d/rcx/d directory indicates that these files are
    actually symbolic links pointing to service scripts in -/etc/init.d/ (as in the
    following):


    ```

    dal10:- # ls -1 /etc/init.d/rc3d/

    total 0

    lrwxrxrwx 1 root root  7 May 15 10:32 K10cron -> ../cron

    lrwxrxrwx 1 root root 8 May 15 10:48 -> ../smbfs

    lrwxrxrwx 1 root root 7 May 15 10:32 K11lnscd -> ../nscd

    lrwxrxrwx 1 root root 10 May 15 10:32 K11postfix -> ../postfix

    lrwxrxrwx 1 root root 12 May 15 10:26 K12lsasound -> ../lsasound

    ...

    lrwxrxrwx 1 root root 7 May 15 10:32 S10sshd -> ../sshd

    lrwxrxrwx 1 root root 7 May 15 10:32 S11lnscd -> ../nscd

    lrwxrxrwx 1 root root 10 May 15 10:32 S11postfix -> ../postfix

    lrwxrxrwx 1 root root 7 May 15 10:32 S12cron -> ../cron

    lrwxrxrwx 1 root root 8 May 15 10:48 S12smbfs -> ../smbfs

    ```


    By using symbolic in subdirectories only the version in /etc/init.d/ needs to
    be modified in case of necessary changes to the script.


    Usually, two links within a runlevel point point to the same script. For example,
    if you enter

    **ls -network**

    in /etc/init.d/rc3d/ directory, you see that two network links point to the script
    /etc/init.d/network:


    ```

    dal10:- # ls -1 /etc/init.d/rc3d/ -network

    lrwxrxrwx 1 root root 10 May 15 10:23 /etc/init.d/rc3d/K17network -> ../network

    lrwxrxrwx 1 root root 10 May 15 10:23 /etc/init.d/rc3d/S05network -> ../network

    ```


    > Sometimes Kxx links are referred to as kill scripts, Sxx links are referred
    to as start scripts. In fact, there are no separate scripts for starting and stopping
    services, but the script is either called with the parameter stop


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# How init Determines which Services to Start and Stop


    You already know that a service is started with the parameter start and stopped
    with the parameter stop. The same parameters are also used when changing from
    one runlevel to another.


    When the runlevel is changed, init calls the script rc with the new runlevel as
    parameter, like /etc/init.d/rc 3. The script /etc/init.d/rc examines the directories
    /etc/init.d/rccurrent/ and /etc/init.d/rcnewl/ and determines what to do.


    Let''s say we change from our current runlevel 5 to the new runlevel 3. There
    are three possibilities:


    +   * There is a Kxx link for a certain service in /etc/init.d/rc5/ and there
    is an Sxx link in /etc/init.d/rc3/ for the same service.


    In this case, the service is neither started nor stopped; the corresponding script
    in /etc/init.d/ is not called at all.


    +   * There is a Kxx link for a certain service in /etc/init.d/rc5/ and there
    is no corresponding Sxx link in /etc/init.d/rc3/.


    In this case, the script in /etc/init.d/service is called with the parameter stop
    and the service is stopped.


    +   * There is an Sxx link in /etc/init.d/rc3/ and there is no corresponding Kxx
    link for the service in /etc/init.d/rc5.


    In this case, the script in /etc/init.d/service is called with the parameter start
    and the service is started.


    The number after the K or S determines the sequence in which the scripts are called.


    Therefore script K10cron is called before script K20haldaemon, which means that
    cron is shut down haldaemon.


    Script S05network is called before S1postfix, which means that the service starts
    before postfix. This is important if postfix depends on a running service network.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'For example the following happens when you change from runlevel

    3 to runlevel 5:


    +   1. You tell init to change to a different runlevel by entering (as root)

    it 5.


    +   2. init checks its configuration file (/etc/inittab) and determines it

    should start /etc/init.drc with the new runlevel (5) as a

    parameter.


    +   3. rc calls the stop scripts (Krx) of the current runlevel those

    services for which there is no start script (Sxx) in the new

    runlevel.


    +   4. The start scripts in the new runlevel for those services for

    there was no kill script in the old runlevel are launched.


    When changing to the same runlevel as the current runlevel, init

    only checks /etc/inittab for changes and starts the appropriate steps

    (such as starting a getty on another interface).


    # Activate and Deactivate Services for a Runlevel


    Services are activated or deactivated in a runlevel by adding or

    removing the respective K**service and S**service links in the

    runlevel directories /etc/init.d/rcx/.


    Although you could create symbolic links in the runlevel

    subdirectories yourself to modify services, an easier way is to edit

    the header of a script and then call inserv.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'The INIT INFO block at the beginning of the script for a service describes
    in which runlevel the service should start or stop and what services should run
    as a prerequisite:


    ```

    ### BEGIN INIT INFO

    # Provides: syslog

    # Required-Start: network

    # Should-Start: earlysyslog

    # Required-Stop: network

    # Default-Start: 2 3 5

    # Default-Stop:

    # Description: Start the system logging daemons

    ### END INIT INFO

    ```


    The INIT INFO block is used by the program inserv to determine in which runlevel
    subdirectories links need to be placed and what numbers need to be put after K
    and S.


    For details on the program inserv, enter man inserv.


    The entry Default-Start determines in which runlevel directories links are to
    be placed. The entry Required-Start determines which services have to be started
    before the one being considered.


    After editing the INIT INFO block, enter inserv -d service (default) to create
    the needed links and renumber the existing ones as needed.


    To remove all links for a service (disabling the service), stop the service (if
    it is running) by entering /etc/init.d/service stop, and then enter inserv -r
    service (remove).


    Within the INIT INFO block, the use of certain variables is possible. These are
    explained and defined in /etc/inserv.conf.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    Version 1 Copying all or part of this manual, or distributing such copies, is
    strictly prohibited. To report suspected copying, please call 1-800-PIRATES. 7-35'
