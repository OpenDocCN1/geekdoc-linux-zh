  md: '+   Check New Passwords. It is important to choose a password that cannot be
    found in a dictionary and is not a name or other simple, common word. By selecting
    this option, you enforce password checking in regard to these rules.


    +   Test for Complicated Passwords. Passwords should be constructed using a mixture
    of uppercase and lower case characters as well as numbers. Special characters
    like;:etc. may be used too, but could be hard to enter on a different keyboard
    layout. This makes it very difficult to guess the password. Select this option
    to enable additional checks.


    +   Password Encryption Method. From the drop-down list, select one of the following
    encryption methods:


    +   DES. This is the lowest common denominator. It works in all environments,
    but it restricts you to passwords no longer than eight characters. If you need
    compatibility with other systems, select this method.


    +   MD5. This encryption method allows longer passwords and is supported by all
    current Linux distributions, but not by other systems or older software.


    +   Blowfish. This encryption method uses the blowfish algorithm to encrypt passwords.
    It is not yet supported by many systems. A lot of CPU power is needed to calculate
    the hash, which makes it difficult to crack passwords with the help of a dictionary.
