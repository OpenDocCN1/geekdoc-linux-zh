  md: '# Objective 1


    # Configure Local Printing


    YaST provides printer installation and configuration functionality. To configure
    a printer, you need to know the following:


    +   - When to Configure a Printer

    - Required Printing Software

    - Add a Printer


    # When to Configure a Printer


    You can configure your printer at the following times:


    +   - **During installation.** If you are at the Hardware Configuration dialog
    during installation (see in the following figure) and your automatic detection
    is not correct, select the **Printers** link or use the **Change...** drop-down
    list:


    # Figure 10-1


    ![](img/84d12236ddfe17cc29fd21173b9904ac_427_0.png)'
  merge: -1
  pgno: 427
- img_proc: true
  md: 'Note that during installation, only locally connected printers are detected
    automatically and listed under Printers.


    +   **After installation.** You can change your printer configuration settings
    from the YaST Control Center by selecting **Hardware > Printer.**


    With the command **yast2 printer**, it is also possible to start the YaST printer
    configuration module directly from a terminal window.


    # Required Printing Software


    The following packages are needed to set up a print server:


    | Package | Content |

    | --- | --- |

    | cups | Provides the printer daemon cupsd |

    | cups-client | Provides the command-line printing tools |

    | cups-libs | Should always be installed, because a number of programs (such as
    Samba) are linked against the CUPS libraries |

    | cups-drivers | Provide the PPD files for print queues

    | cups-drivers-stp |

    | cups-SUSE-ppds-dat | Provides a pregenerated file /etc/cups/ppds.dat |


    These files are installed automatically if YaST is used for printer configuration.


    YaST also creates the symbolic links in runlevel directories to ensure that the
    CUPS daemon is started automatically when booting.'
  merge: -1
