  md: '# Restrict Access to the Web Interface


    You can protect resources such as the administration interface by using passwords.


    The default configuration entry in /etc/cups/cupsd.conf in SLES 10 looks like
    the following:


    ```

    <Location /admin>

    AuthType BasicDigest

    AuthClass Group

    AuthGroupName sys

    Order Deny,Allow

    Deny From All

    Allow From 127.0.0.1

    </Location>

    ```


    The relevant directives are


    +   **AuthType BasicDigest.** A special CUPS user database (/etc/cups/passwd.md5)
    is used for authentication.

    The following types are possible:

    - **None.** No authentication should be performed.

    - **Basic.** Basic authentication should be performed using the UNIX password
    and group files.


    Note: This authentication type does not work on SLES 10 due to the fact that cups
    runs as user lp, and therefore cannot access /etc/cups/shadow.

    - **Digest.** Digest authentication should be performed using the /etc/cups/passwd.md5
    file.

    - **BasicDigest.** Basic authentication should be performed using the /etc/cups/passwd.md5
    file.

    - **AuthClass Group.** Access is only possible for valid users who are members
    of the system (sys) group.

    - **AuthGroupName.** Name of the system group (in this example, sys).'
  merge: -1
  pgno: 477
- img_proc: true
  md: 'With the above default configuration, CUPS accesses the user database /etc/cups/passwd.md5.


    This file does not exist by default and is created when the first user is generated
    using lpppasswd:


    ```

    # lpppasswd -a root -g sys

    Enter password:

    Enter password again:

