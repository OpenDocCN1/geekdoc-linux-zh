  md: 'To check first, query the installed version of the package:


    ```

    da10:~ ~ # rpm -q procmail

    procmail-3.22-42

    ```


    The output indicates the currently installed version of procmail.

    Then check if the patch RPM is suitable for this version of

    procmail:


    ```

    da10:~ ~ # rpm -qp --basedon \

    procmail-3.22-42.4.i586.patch.rpm

    procmail = 3.22-42

    procmail = 3.22-42.2

    ```


    The output indicates that the patch is suitable for 2 different

    versions of procmail. The installed version in the example is

    also listed, so the patch can be installed.


    +   - Which files are replaced by the patch?


    The files affected by a patch can easily be seen in the patch

    RPM. The option -P lets you select special patch features.


    You can display the list of files with the following command:


    ```

    da10:~ ~ # rpm -qPl procmail-3.22-42.4.i586.patch.rpm

    /usr/bin/formail

    /usr/bin/lockfile

    /usr/bin/procmail

    ```


    If the patch is already installed, use the following command:


    ```

    da10:~ ~ # rpm -qPl procmail

    /usr/bin/formail

    /usr/bin/lockfile

    /usr/bin/procmail

    ```


    +   - How can a patch RPM be installed in the system?'
