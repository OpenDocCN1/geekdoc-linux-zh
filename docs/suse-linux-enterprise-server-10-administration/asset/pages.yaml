  md: '# Enable Remote Administration with YaST


    You can enable remote administration of your SUSE Linux Enterprise Server by using
    the YaST Remote Administration module.


    As a matter of fact, this module activates remote access to the entire graphical
    environment, not just remote administration.


    To implement and use this remote connection, you need to know the following:


    +   - VNC and YaST Remote Administration

    - Configure Your Server for Remote Administration

    - Access Your Server for Remote Administration


    A Remote Administration connection is less secure than SSH, which encrypts all
    data transmitted (including the password). For this reason, we recommend using
    the remote connection via VNC only when necessary for performing administrative
    tasks. SSH would be the preferred choice.


    # VNC and YaST Remote Administration


    VNC (virtual network computing) is a client-server solution that allows a remote
    X server to be managed through a lightweight and easy-to-use client from anywhere
    on the Internet (though you should limit this to your LAN as the transmitted data
    are not encrypted).


    The two computers don''t have to be of the same type. The server and client are
    available for a variety of operating systems, including Microsoft Windows, Apple
    MacOS, and Linux.


    You can use the YaST Remote Administration module to configure your SUSE Linux
    Enterprise Server for remote access through VNC from any network computer.'
  merge: -1
  pgno: 519
- img_proc: true
  md: 'When you activate Remote Administration, xinetd offers a connection that exports
    the X login through VNC.


    With the Remote Administration activated, you connect to the server through a
    VNC client as vncviewer (connect to **hostname:5901**), through a VNC connection
    in Konqueror (**vnc://hostname:5901**), or through a Java-capable web browser
    (**http://hostname:5801**).


    The host parameter can be the actual host name (such as **http://da10.digitalairlines.com:5801**)
    or the host IP address (such as **http://10.0.0.10:5801**).


    For additional information on VNC, enter **man vncviewer** or http://www.realnc.com.
    Also refer to the documentation in /etc/xinetd.d/vnc, or enter **netstat -patune**
    for a list of Internet connections to the server.


    # Configure Your Server for Remote Administration


    To configure your SUSE Linux Enterprise Server for remote administration, do the
    following:


    Start the YaST Remote Administration module by starting the YaST Control Center;
    then select **Network Services > Remote Administration**; or open a terminal window,
    **su** - to root and enter **yast2 remote**.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_520_0.png)'
  merge: -1
  pgno: 520
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    The following appears:


    # Figure 11-3


    ![](img/84d12236ddfe17cc29fd21173b9904ac_521_0.png)


    Select Allow Remote Administration; if your firewall is active, also select Open
    Port in Firewall; then select Finish.


    The following appears:


    # Figure 11-4


    ![](img/84d12236ddfe17cc29fd21173b9904ac_521_1.png)


    Close the dialog by selecting OK.


    As the message says, you need to restart the display manager to activate the remote
    administration settings. Close any open applications; then display a console pressing
    Ctrl+Alt+F2.


