  md: '# Introduction


    SUSE Linux Enterprise Server 10 Administration (Course 3072) focuses on the routine
    system administration of SUSE Linux Enterprise Server 10.


    This course covers common tasks a system administrator of SUSE Linux Enterprise
    Server 10 has to perform, like installation and configuration of the system, maintenance
    of the file system, software management, management of processes, and printing.


    These skills, along with those taught in SUSE Linux Enterprise Server 10 Fundamentals
    (Course 3071) and SUSE Linux Enterprise Server 10 Advanced Administration (Course
    3073), prepare you to take the Novell Certified Linux Professional 10 (Novell
    CLP 10) certification practicum test.


    The contents of your student kit include the following:


    +   * SUSE Linux Enterprise Server 10 Administration Manual

    * SUSE Linux Enterprise Server 10 Administration Workbook

    * SUSE Linux Enterprise Server 10 Administration Course DVD

    * SUSE LINUX Enterprise Server 10 Product DVD

    * SUSE LINUX Enterprise Desktop 10 Product DVD


    The SUSE Linux Enterprise Server 10 Administration Course DVD contains an image
    of a SUSE Linux Enterprise Server 10 installation that you can use with the SUSE
    Linux Enterprise Server 10 Administration Workbook outside the classroom to practice
    the skills you need to take the Novell CLP 10 Practical exam.


    Instructions for setting up a self-study environment are in the setup directory
    on the Course DVD.'
