- img_proc: true
  md: '# Hardware Information (/proc/)


    The directory /proc/ contains a lot of information on the running system, including
    hardware information stored in the kernel memory space.


    For example, if you cat /proc/cpuinfo, output is generated from data stored in
    kernel memory that gives you information such as the CPU model name and cache
    size.


    You can view the available information by using commands such as cat, more, or
    less with a file name (such as /proc/cpuinfo).


    The following are some of the commonly-used filenames to generate information:


    +   - /proc/devices. View the devices used on your Linux system.

    - /proc/cpuinfo. View processor information.

    - /proc/ioports View the I/O ports on your server. The I/O ports are the addresses
    of various hardware devices.

    - /proc/interrupts. View the IRQ (hardware interrupt signal) assignments for your
    Linux system.

    - /proc/dma. View the DMA (Direct Memory Access) channels used on your Linux system.

    - /proc/bus/pci/devices. View the PCI (Peripheral Component Interconnect) information
    on your Linux system.

    - /proc/scsi/scsi. View a summary of the SCSI (Small Computer System Interface)
    information on your Linux system.


    # Hardware Information (Command Line Utilities)


    The following are utilities you can use from the command line to view information
    about hardware on your Linux system:'
  merge: -1
  pgno: 282
- img_proc: true
  md: '+   hwinfo. Entering this command generates and displays a list of specific
    information about the devices installed on your Linux system. If you want to be
    able to scroll up and down the list, enter hwinfo | less.


    For a summary listing, enter hwinfo --short. hwinfo --log filename writes the
    information to a log file.


    +   hdparm. Entering this command with various options lets you view information
    about your hard drive and manage certain hard drive parameters.


    For example, the option -i displays hard drive identification information available
    at boot time. The option -l requests information directly from the hard drive.


    For a summary list of available options, enter hdparm -h.


    +   fdisk. While this command is primarily used for managing the partition table
    on a Linux system, you can also use options as -l (list partition tables), -s
    (size of partition) to view hard drive information.


    +   iostat. Entering this command displays CPU and input/output (I/O) statistics
    for devices and partitions. The program iostat is part of the package sysstat.


    This command generates reports that can be used to change system configuration
    to better balance the input/output load between physical disks.


    The first report generated provides statistics concerning the time since the system
    was booted. Each subsequent report covers the time since the previous report.


    You can generate 2 types of reports with the command—the CPU usage report and
    the device usage report.


    The option -c generates only the CPU usage report; the option -d generates only
    the device usage report.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '+   Ispci. Entering this command displays information about all PCI buses in
    your Linux system and all devices connected to them.


    The options -v and -vv generate verbose reports. The option -b gives you a bus-centric
    view of all the IRQ numbers and addresses as seen by the cards (instead of the
    kernel) on the PCI bus.


    +   siga. System Information GAthering. It collects various information on your
    system and outputs it in HTML or ASCII format.


    +   sitar. System InformaTion Runtime. Prepare system information using Perl,
    reading the /proc filesystem. Output is written to /tmp in HTML, LaTeX, and simplified
    docbook-xml.


    # System and Process Information (Command Line Utilities)


    Besides ps and top, which have been covered in the Section “Administer Linux Processes
    and Services” on page 5-1, there are several more commonly-used command line tools
    for viewing system information:


    +   uptime


    +   netstat


    +   uname


    # uptime


    Although the command top gives you system information in the header, there might
    be times when you only want specific information without starting a utility.'
  merge: -1
