    # Table 2-1


    | Inode Number | Filename |

    |---||

    | 2 | |

    | 2 | .. |

    | 4 | usr |

    | 5 | proc |

    | 18426 | boot |

    | 80044 | tmp |

    | 80045 | floppy |

    | 80046 | var |

    | ... | |


    # Network File System Formats


    In addition to the already mentioned file system formats on the local computer,
    Linux also understands various network file system formats. The most significant
    of these is the Network File System (NFS), the standard in the UNIX world.


    With NFS, it does not matter which file system format is used locally on individual
    partitions. As soon as a computer is functioning as an NFS server, it provides
    its file systems in a defined format NFS clients can access.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Using additional services included on SUSE Linux Enterprise Server, Linux can
    also work with the network file system formats of other operating systems.


    These include the Server Message Block (SMB) format used in Windows and the Net
    Core Protocol (NCP) by Novell.


    SMB allows Linux to mount Windows 9x/NT/XP network shares.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_90_0.png)


    File types, like directories, FIFOs, as well as the layout of the file system
    tree are covered in SUSE Linux Enterprise Server 10 Fundamentals (Course 3071).


    # File System Journaling


    File systems are basically databases that store files and use file information
    such as the filename and timestamp (called metadata) to organize and locate the
    files on a disk.


    When you modify a file, the file system performs the following transactions:


    +   - It updates the file (the data)

    - It updates the file metadata


    Because there are two separate transactions, corruption can happen when only the
    file data is updated (but not the metadata) or vice versa, resulting in a difference
    between the data and metadata.


    This can be caused, for instance by a power outage. The data might have been written
    already, but the metadata might not have been updated yet.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'When there is a difference between the metadata, the state of the file system
    is inconsistent and requires a file system check and possibly repair. For ext2,
    this includes a walk through the entire file system, which is very time consuming
    on today''s hard disks with hundreds of GB capacity.


    In a journal-based file system, the journal keeps a record of all current transactions,
    and updates the journal as transactions are completed. Checking the file system,
    for instance after a power outage, consists mainly in replaying the journal and
    is much faster than checking the entire file system.


    For example, when you first start copying a file from a network server to your
    workstation, the journaled file system submits an entry to the journal indicating
    that a new file on the workstation is being created.


    After the file data and metadata are copied to the workstation, an entry is indicating
    that the file was created successfully.


    While recording entries in a journal requires extra time for creating files, it
    makes recovering an incomplete transaction easy as the journal can be used to
    repair the file system.


    # Additional File System Documentation


    Each of the Linux file systems maintains its own home page on to find mailing
    list information, further documentation, and FAQs. These include the following:


    | File System | URL |

