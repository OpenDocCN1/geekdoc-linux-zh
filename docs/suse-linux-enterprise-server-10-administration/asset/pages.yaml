- img_proc: true
  md: '# Modify the Software Library Configuration File (etc/ld.so.conf)


    The file /etc/ld.so.conf contains a list of paths the Linux system uses to search
    for libraries, as in the following:


    ```

    # cat /etc/ld.so.conf

    /usr/X11R6/lib/Xaw3d

    /usr/X11R6/lib

    /usr/1486-linux-libc5/lib=libc5

    /usr/1386-guse-linux/lib

    /usr/local/lib

    /opt/kde3/lib

    /opt/gnome/lib

    include /etc/ld.so.conf/*

    ```


    In order to modify the /etc/ld.so.conf, you need to be authenticated as the root
    user. The file format for this file is simply a list of system directories containing
    dynamic libraries.


    Typical library directories include the following: /lib/, /usr/lib/, /usr/local/lib/,
    and /usr/X11R6/.


    As the directories /lib/ and /usr/X11R6/ are taken into account in all cases they
    are not listed in this file. You can enter the command /sbin/ldconfig -p to list
    all libraries available in the cache that will be found by the system.


    If a library is located in a directory not listed above, you can set the variable
    LD_LIBRARY_PATH=$path to make sure that it is loaded:


    ```

    export LD_LIBRARY_PATH=$path

    ```


    For a listing of variables that can be used, enter man 8 ld.so.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Update the Library Cache (/etc/ld.so.cache)


    The program **lib/ld-linux.so.2** (this is a link to /lib/ld-2.4.so), referred
    to as the *runtime linker*, makes sure that the needed libraries are found and
    loaded when a program is started.


    If you modify the /etc/ld.so.conf to reflect any new dynamic library paths, you
    need to enter the command `ldconfig` to update the library cache. If new libraries
    are installed during operation, you also need to run ldconfig manually.


    This is the same command used to update the library cache when rebooting the system.


    The command sets the required links to the current shared libraries that are either
    located in directories listed in the file /etc/ld.so.conf or in the directories
    /usr/lib/ and /lib.


    The library cache file is /etc/ld.so.cache and is read by the runtime linker.
    The cache file contains a list of all the system libraries stored in a binary
    format to speed the location of the libraries on the system.


    Running ldconfig with the option -v displays detailed information about the libraries
    ldconfig has found.'
  merge: -1
  pgno: 378
