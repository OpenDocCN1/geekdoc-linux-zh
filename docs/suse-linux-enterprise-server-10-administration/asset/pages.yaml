  md: 'SSH can also be used to protect unencrypted traffic, like POP3, by tunnelling
    it through an SSH connection. The following examples illustrate this:


    +   - geeko@da10:~> ssh -L 4242:da20.digitalairairlines.com:110 geeko@da20.digitalairairlines.com


    In this example, the user geeko forwards the connection coming on port 4242 of
    his local host da10 to port 110 (POP3) of the remote host da20 via an SSH tunnel
    (port forwarding).


    By using port forwarding through an SSH tunnel, you can set an additional secure
    channel for connections between the local host and a remote host.


    Privileged ports (0–1024) can only be forwarded by root.


    +   - geeko@da10:~> ssh -R 4242:da10.example.com:110 geeko@da20.digitalairairlines.com


    With this command, you forward port queries addressed to a port of a remote host
    to the port of the local host (reverse port forwarding).


    In this example, queries coming in on port 4242 of the remote host da20.digitalairairlines.com
    are reverse-tunneled via SSH to port 110 of the local host da10.


    If the host you want to forward cannot be reached directly through SSH (for example,
    because it is located behind a firewall), you can establish a tunnel to another
    host running SSH, as in the following:


    +   - geeko@da10:~> ssh -L 4242:da20.digitalairairlines.com:110 geeko@da30.digitalairairlines.com


    In this example, the user geeko forwards incoming connections on port 4242 of
    his local host da10 to da30.digitalairairlines.com by way of an SSH tunnel.'
  merge: -1
