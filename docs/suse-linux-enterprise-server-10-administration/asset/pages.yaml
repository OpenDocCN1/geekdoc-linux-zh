- img_proc: true
  md: '# Objective 1 Monitor a SUSE Linux Enterprise Server 10 System


    As a system administrator, you sometimes have questions similar to the following:


    +   - Did the system boot normally?

    - What is the kernel version?

    - What services are running?

    - What is the load on the system?


    In this objective, you are introduced to tools that help you discover information
    about your hardware and Linux system:


    +   - Boot Log Information

    - Hardware Information (/proc/)

    - Hardware Information (Command Line Utilities)

    - System and Process Information (Command Line Utilities)

    - Monitor Hard Drive Space


    # Boot Log Information


    When SUSE Linux Enterprise Server 10 starts, some lines scroll too quickly for
    you to read easily. If there is an error message, it might be nearly impossible
    to read it.


    These messages are kept in the kernel ring buffer. As the capacity of this buffer
    is limited, older entries in the ring buffer are deleted when new entries are
    added to it.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Monitor SUSE Linux Enterprise Server 10


    To have the boot messages available even when they have been deleted from the
    buffer, they are written to the file /var/log/boot.msg in a slightly modified
    format after booting the machine. For each line displayed at the console during
    startup, there are one or several lines in the file /var/log/boot.msg.


    dmesg is the command to view the current content of the kernel ring buffer. dmesg
    | less allows you to scroll up and down in the output, which looks similar to:


    ```

    Linux version 2.6.14-6-smp (geeko@buildhost) (gcc version 4.1.0 (SUSE Linux))
