  md: '# Objective 2 Verify and Update Software Library Access


    In addition to checking for software package dependencies, you might also need
    to verify that the system is configured properly to access dynamic libraries an
    application uses.


    Normally this is handled by the software installation, but occasionally you might
    need to verify software library access after installation.


    For example, if an application that has been installed fails to start, try starting
    it from a terminal window. If the application reports that a library could not
    be found, you might need to verify access to the dynamic libraries.


    To verify the libraries needed for an application, you need to know the following:


    +   * Software Library Basics

    * View Shared Library Dependencies (ldd)

    * Modify the Software Library Configuration File (/etc/ld.so.conf)

    * Update the Library Cache (/etc/ld.so.cache)


    # Software Library Basics


    To understand the role of software libraries in SUSE Linux, you need to know the
    following:


    +   * Dynamic Software Libraries

    * Static Software Libraries

    * Library Naming Syntax'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Dynamic Software Libraries


    In a Linux environment, most programs share some code through the use of shared
    libraries. This provides advantages from a development and a system management
    standpoint.


    For developers, it means their programs include only the code that is unique to
    the program itself, sharing functions that other programs have in common with
    it.


    This reduces the size of the program executable, thus reducing the amount of disk
    space required for the application (an advantage for system administrators).


    Unlike some other operating systems, a Linux system locates its dynamic libraries
    through a configuration file that points to the locations, eliminating confusion
    about which version of which dynamic library is used by each piece of software.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_374_0.png)


    Developers still have the ability to link everything into their executable. This
    can be important if the program will be used on a system that might not include
    all of the necessary libraries, such as an emergency rescue disk or minimal Linux
    installation.


    # Static Software Libraries


    In contrast to dynamic program linking, you can link the needed libraries statically
    when a program is compiled.


    Although static linking increases the program size, it provides independence from
    libraries at runtime, and is especially useful for system maintenance purposes.'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'An example of a program with statically linked libraries is sash. sash (stand-alone
    shell) is useful for recovering from certain types of system failures. It was
    created in order to cope with the problem of missing shared libraries or important
    executables. Built in commands include -mount, -mknod, -kill, -ln, -gzip, -gunzip,
    and others.


    # Library Naming Syntax


    Library filenames normally use the following syntax:


    ```

    libname.so.version

    ```


    The letters “so” indicate a shared dynamic library; the letter “a” (as in /usr/lib/libc.a)
    is used for static libraries. The version indicates a major version number of
    the library (such as 1, 2, or 6).


    For example, the library used for the ncurses screen library (version 4.2) might
    be named:


    ```

    libncurses.so.4.2

    ```


    # View Shared Library Dependencies (ldd)


    You can view the shared libraries required by a specific program or shared library
    by using the command ldd.


    The following is the syntax of the command:


    ```

    ldd option filename

    ```'
  merge: -1
  pgno: 375
- img_proc: true
