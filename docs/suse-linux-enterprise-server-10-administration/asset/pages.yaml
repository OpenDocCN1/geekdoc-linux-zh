  md: '# Objective


    # Summary


    +   3. Use Access Control Lists (ACLs) for Advanced Access Control


    ACLs extend the classic Linux file system permissions.


    They let you assign permissions to named users and named groups.


    ACLs also provide a mask entry, which basically limits the permissions of named
    users and named groups.


    The ACL entries are managed with **getfacl** and **setfacl**.


    Directories can have a default ACL that is inherited by newly created files or
    subdirectories.'
