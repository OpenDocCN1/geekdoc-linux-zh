    ```


    For detailed information about using the command ps, enter man ps.


    # pstree


    With the command pstree, you can view a list of processes in the form of a tree
    structure. This gives you an overview of the hierarchy of a process.


    To end a series of processes, find the appropriate parent process and end instead.
    The option -p displays the PID of the processes. The option -u displays the user
    ID if the owner has changed.


    Because the list of processes is often long, you can enter pstree -up less to
    view part of the processes at a time.


    # nice and renice


    Linux always tries to distribute the available computing time equitably to all
    processes. However, you might want to assign a process more or less computing
    time.


    You can do this with the command nice, as in the following:


    ```

    geeko@dal0:- > nice -n +5 sleep 99

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'This command assigns a process specific nice value that affects the calculation
    of the process priority (which is increased or decreased). If you do not enter
    a nice value, the process is started with the value +10.


    The NI column in the top list (see Figure 5-3) contains the nice value of the
    process. The default value 0 is regarded as neutral. You can assign the nice level
    using a numeric value of -20 to 19.


    The lower value of the nice level, the higher priority of the process. A process
    with a nice level of -20 runs at the highest priority; a process with a nice level
    of 19 runs at the lowest priority.


    The nice level is used by the scheduler to determine how frequently to service
    a running process.


    Only root is permitted to start a process with a negative nice value (such as
    nice -n -3 sleep 99). If a normal user attempts to do this, an error message is
    returned.


    You can use the command renice to change the nice value of a running process,
    such as


    ```

    geekoo@da10:- > renice 5 1712

    ```


    In this example, the command assigns the process with the PID 1712 the new nice
    value 5.


    Only root can reduce the nice value of a running process (such as 10 to 9 or from
    3 to -2). All other users can only increase the nice value (such as from 10 to
    11).


    For example, if the user geekeko attempts to assign the process 28056 that currently
    has a nice value of 3 to a nice value of 1, a “Permission denied” message is returned.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    # top


    The command top allows to watch processes continuously in a list that is updated
    in short intervals, providing a real-time view of a running system. top can also
    be used to assign a new nice value to running processes or to processes.


    The information displayed in top can be filtered by a specific user, and can be
    sorted on any displayed field. By typing r, you can adjust the priority of a process,
    provided you have sufficient privileges to do so.


    As with the command renice, the same restrictions apply when process levels using
    top. Non-root users can increase the nice level, but they cannot lower it.


    When you enter top, a list similar to the following appears:


