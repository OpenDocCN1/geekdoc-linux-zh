  md: '# Mount File Systems


    In Windows systems separate drive letters represent different partitions. Linux
    does not use letters to designate partitions, it mounts partitions to a directory
    in the file system. Directories used for mounting are also called mount points.


    For example, to add a new hard disk to a Linux system, first you partition and
    format the drive. You then use a directory (such as /data/) in the file system
    and mount the drive to that directory using the command mount.


    To unmount (detach) a file system, you use the ummount command (for details, enter
    umount).


    You can also mount remote file systems, shared via the Network File System (NFS),
    to directories you create in your file system.


    The directory /mnt/ is used by default for temporarily mounting local and remote
    file systems. All removable devices are mounted by default to /media/, such as
    the following:


    +   - A CD-ROM on /dev/cdrom is mounted by default to /media/cdrom.


    +   - A floppy disk on /dev/floppy is mounted by default to /media/floppy.


    When SLES 10 from a desktop environment such as Gnome or KDE, media such as floppy
    disks and CDs are automatically mounted and unmounted. If the CD-ROM has a label,
    it is mounted to /media/label.


    To manage mounting (and unmounting) file systems, you need to know the following:


    +   - Configuration File for Mounting File Systems: /etc/fstab


    +   - View Currently Mounted File Systems


    ![](img/84d12236ddfe17cc29fd21173b9904ac_113_0.png)'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Configuration File for Mounting File Systems: /etc/fstab


    +   - Mount a File System

    - Unmount a File System


    The file systems and their mount points in the directory tree are configured in
    the file /etc/fstab. This file contains 1 line with 6 fields for each mounted
    file system.


    The lines look similar to following:


    | Field 1 | Field 2 | Field 3 | Field 4 | Field 5 | Field 6 |

    |---|---|---|---|---|--|

    | /dev/hda2 | | reiserfs | acl,user_xattr | | 1 | 1 |

    | /dev/hda1 | swap | swap | defaults | | 0 | 0 |

    | proc | /proc | | defaults | | 0 | 0 |

    | sysfs | /sys | | sysfs | noauto | | 0 | 0 |

    | debugfs | /sys/kernel/debug | debugfs | noauto | | 0 | 0 |

    | usbfs | /proc/bus/usb | usbfs | noauto | | 0 | 0 |

    | devpts | /dev/pts | devpts | mode=0620,gid=5 | | 0 | 0 |

    | /dev/fd0 | /media/floppy | auto | noauto,user,sync | | 0 | 0 |


    Each field provides the following information for mounting the file system:


    +   - Field 1. Lists the name of the device file, or the system label, or the
    UUID (Universally Unique Identifier). Use of LABEL=label or UUID=uuid has the
    advantage that the partition is mounted correctly even if the device used changes,
    for instance because you swapped hard disks on the IDE controller.

    - Field 2. Lists the mount point—the directory to which the file system should
    be mounted. The directory specified here must already exist. You can access the
    content on the media by changing to the respective directory.

    - Field 3. Lists the file system type (such as ext2, reiserfs).'
  merge: -1
  pgno: 114
- img_proc: true
  md: "+   * Field 4. Shows the mount options. Multiple mount options are separated\
    \ by commas (such as noauto,user,sync).\n\n+   * Field 5. Indicates whether to\
    \ use the backup utility dump for the file system. 0 means no backup.\n\n+   *\
    \ Field 6. Indicates the sequence of the file system checks (with the fsck utility)\
    \ when the system is booted:\n  * 0: file systems that are not to be checked\n\
    \  * 1: the root directory\n  * 2: all other modifiable file systems; file systems\
    \ on different drives are checked in parallel\n\nWhile /etc/fstab lists the file\
    \ systems and where they should be mounted in the directory tree during startup,\
    \ it does not contain information on the actual current mounts.\n\nThe /etc/mtab\
    \ file lists the file systems currently mounted and their mountpoints. The mount\
    \ andmount commands affect the state of mounted file systems and modify the /etc/mtab\
    \ file.\n\nThe kernel also keeps information for /proc/mounts, which lists all\
    \ currently mounted partitions.\n\nFor troubleshooting purposes, if there is a\
    \ conflict between /proc/mounts and /etc/mtab information, the /proc/mounts data\
    \ is always more current and reliable than /etc/mtab."
  merge: -1
  pgno: 115
- img_proc: true
  md: '# View Currently Mounted File Systems


    You can view the file systems currently mounted by entering the command **mount**.
    Information similar to the following appears:


    ```

    da10:~ # mount

    /dev/sda2 / type reiserfs (rw,acl,user_xattr)

    proc /proc type proc (rw)

    sys on /sys type sysfs (rw)

    debugfs on /sys/kernel/debug type debugfs (rw)

    udev on /dev type tmpfs (rw)

    devpts on /dev/pts type devpts (rw,mode=0620,gid=5)

    securityfs on /sys/kernel/security type sysfs (rw)

    ```


    You can also view this information in the file /proc/mounts.


    # Mount a File System


    You can use the command **mount** to manually mount a file system. The general
    syntax for mounting a file system with is


    **[-t file_system_type] [-o mount_options] device mount_point_directory**


    By using mount, you can override the default settings in /etc/fstab.


    For example, entering the following mounts the partition /dev/hda9 to the directory
    /space/


    ```

    mount /dev/hda9 /space

    ```


    You do not usually specify the file system type because it is recognized automatically
    (using magic numbers in the superblock, or simply by trying different file system
    types; see **man mount** details.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'The following are some of the options you can use when mounting a file system
    with the command mount or entering them in /etc/fstab


    +   - **remount.** This option causes file systems that are already mounted to
    be mounted again.


    When you make a change to the options in /etc/fstab, you can use mount to incorporate
    the changes.


    +   - **rw, ro.** These options indicate whether a file system should be writable
    (rw) or only readable (ro).


    +   - **sync, async.** These options set synchronous (**sync**) or asynchronous
    (**async**) input and output in a file system. The default setting is async.


    +   - **atime, noatime.** These options set whether the access time of a file
    is updated in the inode (**atime**) or not (**noatime**). The option noatime should
    improve the performance.


    +   - **nodev, dev.** The **nodev** option prevents device files from being interpreted
    as such in the file system.


    +   - **noexec, exec.** You can prohibit the execution of programs on a file system
    with the option **noexec.**


    +   - **nosuid, suid.** The **nosuid** option ensures that the suid and sgid bits
    in the file system are ignored.


    Some options only make sense in the file /etc/fstab. These options include the
    following:


    +   - **auto, noauto.** File systems set with the option **noauto** in the file
    /etc/fstab are not mounted automatically when the system is booted.


    +   - **user, nouser.** This option lets users mount the file system. Normaly,
    this is a privilege of the user root.


    +   - **defaults.** This option causes the default options rw, auto, nouser, and
    async to be used.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'The options **noauto** and **user** are usually combined for removable media
    such as floppy disk or CD-ROM drives.


    # Unmount a File System


    Once a file system is mounted, you can use the **umount** command (without an
    “n”) to unmount the file system.


    You can unmount the file system using umount with the device mount point.


    For example to unmount a CD file system mounted at /media/cdrecorder, you could
    enter one of the following:


    +   - **umount /media/cdrecorder**

    - or

    - **umount /dev/hdb**


    In order to unmount the file system, no application or user may use the file system.
    If it is being used, Linux sees the file system as being “busy” and will refuse
    to unmount the file system.


    > To help determine the processes that are acting on a file or directory, you
    can use the fuser utility. For details on using the fuser utility, see “Identify
    Processes Using Files (fuser)” on page 2-45.


    One way to make sure the file system is not busy is to enter **cd /** at the shell
    prompt before using the ummount command. This command takes you to the root of
    the file system.


    However, there might be times when the system (kernel) still sees the file system
    as busy, no matter what you try to do.'
  merge: -1
  pgno: 118
- img_proc: true
  md: In these cases, you can enter umount -f to force the file system to unmount.
    However, we recommend using this only as a last resort, as there is probably a
    reason why the kernel thinks the file system is still mounted.
  merge: -1
