  md: '# Objective 7


    # Automate Data Backups with cron


    Backing up data is a task that you should perform on a regular basis. You can
    automate backups in Linux with the cron service.


    System jobs are controlled with the file /etc/crontab and the files in the directory
    /etc/cron.d. They are defined with the scripts in the directories /etc/cron.hourly,
    /etc/cron.daily, /etc/cron.weekly, and /etc/cron.monthly.


    Specifying which users can create cron jobs is done through the files /var/spool/cron/allow
    and /var/spool/cron/den, which are evaluated in this order. If both do not exist,
    then only root can define jobs.


    The jobs of individual users are stored in files in the directory /var/spool/cron/tabs
    with names matching the user names. These files are processed with the command
    crontab.


    The following is an example of a cron job:


    ```

    0 22 * * 5 /root/bin/backup

    ```


    In this example, the script /root/bin/backup is started every Friday at 10 P.M.
    The format for the line is described in man crontab.'
  merge: -1
  pgno: 418
- img_proc: true
