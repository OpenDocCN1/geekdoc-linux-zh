  md: "+   * You want to delete existing operating systems so you have more space\
    \ available for your SLES 10 installation.\n\nTo partition the hard drive manually,\
    \ you need to know the following: \n\n+   * The Basics of Hard Drive Partitioning\n\
    \n+   * The Basic Linux Partitioning Scheme\n\n+   * How to Change YaST's Partitioning\
    \ Proposal\n\n+   * Use the YaST Expert Partitioner\n\n# The Basics of Hard Drive\
    \ Partitioning\n\nPartitions divide the available space of a hard drive into smaller\
    \ portions. This lets you install more than one operating system on a hard drive\
    \ or use different areas for programs and data.\n\nEvery hard disk (on an Intel\
    \ platform) has a partition table with space for four entries. An entry in the\
    \ partition table can correspond to a primary partition or an extended partition.\
    \ However, only one extended partition entry is allowed.\n\nA primary partition\
    \ consists of a continuous range of cylinders (physical disk areas) assigned to\
    \ a particular file system. If you use only primary partitions, you are limited\
    \ to four partitions per hard disk (because the partition table can only hold\
    \ four primary partitions).\n\nThis is why extended partitions are used. Extended\
    \ partitions are also continuous ranges of disk cylinders, which can be subdivided\
    \ into logical partitions. Logical partitions do not require entries in the main\
    \ partition table. In other words, an extended partition is a container for logical\
    \ partitions.\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED"
  merge: -1
  pgno: 32
- img_proc: true
  md: 'If you need more than four partitions, create an extended partition instead
    of a fourth primary partition. This extended partition include the entire remaining
    cylinder range. Then create multiple logical partitions within the extended partition.
    The maximum number of partitions is 15 on SCSI disks and 63 on (E)IDE disks.


    It does not matter which type of partitions you use on Linux systems; primary
    and logical partitions both work well.


    # The Basic Linux Partitioning Scheme


    The optimal partitioning scheme for a server depends on the purpose of the server.


    A SLES 10 installation needs at at least two partitions:


    +   **Swap partition.** This partition is used by Linux to move unused data from
    the main memory to the hard drive, freeing main memory which can then be used
    by other processes.


    +   **Root partition.** This is the partition that holds the top (/) of the file
    system hierarchy, the so-called root directory.


    No matter what partition scheme you choose, you always need at least one swap
    partition and a root partition.


    The following guidelines help determine what you can install depending on the
    space available on your hard disk for your file system:


    +   **800 MB.** This allows for a minimal installation with no graphical interface.
    With this configuration, you can only use console applications.


    +   **1300 MB.** This allows for an installation with a minimum graphical interface.
    This includes the X Window system and a few graphical applications.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '+   2 GB. This holds the default installation proposed by YaST. This configuration
    includes a modern desktop environment (such as KDE or GNOME), and provides enough
    space for several additional applications.


    +   4 GB. This allows for a full installation, including all software packages
    shipped with SLES 10.


    You can put certain directories on separate partitions. If you do this, your root
    partition can be smaller than outlined above. Any space for data needs to be added
    to the above.


    Today''s computers are equipped with hard disks with capacities of 100 GB and
    more, there is still plenty of space for data. The difficulties involved with
    changing partitions in an installed system and the size of current hard disks,
    you should therefore allocate more space than the above minimum when deciding
    on the hard disk layout.


    Partitions and partitioning schemes will be covered more extensively in the objective
    "Configure Linux File System Partitions" on page 2-16.'
  merge: -1
  pgno: 34
