  md: '# Administer the Linux File System


    To view the available format options, select **Options**; the options depend on
    the file system you choose from the drop-down menu. We recommend keeping the default
    settings for implementations. To return to the main format menu, select **OK**.


    If you want to encrypt all data saved to the partition, select **Encrypt file
    system**. Encrypting a file system only prevents unauthorized mounting; once mounted
    the files are accessible like any other file on the system. You should only use
    this option for non-system partitions such as home directories.


    Select **Fstab Options** to edit the fstab entry for this partition.


