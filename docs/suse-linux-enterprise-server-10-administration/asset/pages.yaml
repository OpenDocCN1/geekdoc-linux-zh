  md: '# Manage Software for SUSE Linux Enterprise Server


    In this section, you learn how to manage software packages on your SUSE Linux
    Enterprise server with RPM Package Manager (RPM) and YaST. You are also introduced
    to dynamic software libraries.


    # Objectives


    +   1. Manage RPM Software Packages

    2. Verify and Update Software Library Access'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Objective 1


    # Manage RPM Software Packages


    While there are several software package formats available for Linux, the format
    used most commonly in SUSE Linux installations is the RPM Package Manager (RPM)
    format.


    Installing software in the RPM format can be done with YaST or by using the command
    rpm. YaST ensures the automatic resolution of dependencies, while rpm only controls
    them (resolution but performed manually).


    To manage installation of RPM software packages, you need to know the:


    +   - RPM Components and Features

    - RPM Basics

    - Manage Software Packages with rpm


    # RPM Components and Features


    RPM Package Manager (or RPM) is a package management system primarily intended
    for Linux. RPM installs, updates, uninstalls, verifies software, and allows various
    queries about the installed software.


    The following are the basic components of RPM:


    +   - RPM Package Manager. The utility that handles installing and uninstalling
    RPM packages.

    - RPM database. The RPM database works in the background of the package manager
    and contains a list of all information on all installed RPM packages.


    The database keeps track of all files that are changed and created when a user
    installs a program. This helps the package manager to easily remove the same files
    that were originally installed.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '+   - RPM package. RPM lets you take software source code and package it into
    source and binary packages for end users. These are called RPM packages or RPM
    archives.


    +   - Package label. Every RPM package includes a package label that contains
    information such as the software name, version, and the package release number.


    This information helps the package manager track the installed versions of software
    to make it easier to manage software installations on a Linux computer.


    Some of the advantages of using RPM package manager and RPM packages include the
    following:


    +   - Provides a consistent method for users to install programs in Linux.


    +   - Makes it easier to uninstall programs (because of the RPM database).


    +   - Original source archives (such as tar.gz, .tar.bz2) are included and easy
    to verify.


    +   - You can use RPM tools to enable software installations using noninteractive
    scripts.


    +   - You can use RPM tools to verify that the software installed correctly.


    +   - RPM can track dependent software, preventing deinstallation of packages
    needed by other packages. It also informs the administrator if required software
    is missing when she tries to install a software package.


    +   - RPM allows for all packaged software to use public-key technology to digitally
    sign the software.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# RPM Basics


    To manage software packages with RPM, you need to understand the following:


    +   - RPM Package File Naming Convention

    - RPM Configuration File

    - RPM Database


    # RPM Package File Naming Convention


    RPM package files use the following naming format:


    ```

    software_name-software_version-release_number.architecture.rpm, for instance apache2-2.2.0-21.i586.rpm

    ```


    The following describes each component of the naming format:


    +   - software_name. This is normally the name of the software being installed.

    - software_version. This is the version number of the software in the RPM package
    and is normally a number.

    - release_number. This is the number of times the package has been rebuilt using
    the same version of the software.

    - architecture. This indicates the architecture the package was built under (such
    as i586, i686, ppc, ...) or the type of package content.


    For example, if the package has an i586 architecture, you can install it on 32-bit
    Intel-compatible machines that are Pentium class or higher.


    If the package has a noarch extension, it does not include any binary code.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '+   - rpm. RPM archives normally have the extension .rpm. The distribution
    also includes source packages, called source RPMs, which have the filename extension
    .src.rpm (.rpm or .srpm are also possible).


    Note: Source packages are not included in the RPM database and thus are not recorded.


    # # RPM Configuration File


    The global RPM configuration file of the command rpm is /usr/lib/rpm/rmprc. However,
    when the rpm command is updated, all changes to this file are lost.


    To prevent this from happening, write the changes to the file /etc/rpmrc (for
    the system configuration) or to file ~/.rpmrc (for the user configuration).


    # # RPM Database


    The files of the RPM database are stored in /var/lib/rpm/. If the partition /usr/
    has a size of 1 GB, this database can occupy nearly 30 MB, especially after a
    complete update.


    If the database is much larger than expected, it is useful to rebuild the database
    by entering rpm --rebuilddb. Before doing this, make a backup of the old database.


    The cron script de.backup-rpmdb stored in /etc/cron.daily/ checks daily daily
    to see if there are any changes. If so, a copy of the database is made (compressed
    with gzip) and stored in /var/admin/backup/rpmdb.


    The number of copies is controlled by the variable MAX_RPMDB_BACKUPS (default
    is 5) in /etc/sysconfig/backup.


    The size of a single package is approximately 5 MB for 1 GB in /usr.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Manage Software Packages with rpm


    You can use the command rpm to manage software packages. This includes querying
    the RPM database for detailed information about the installed software.


    The command provides the following modes for managing software packages:


    +   - Installing, uninstalling, or updating software packages

    - Querying the RPM database or individual RPM archives

    - Checking the integrity of packages

    - Rebuilding the RPM database


    You can use the command rpmbuild to build installable RPM packages from pristine
    sources. rpmbuild is not covered in this course.


    RPM packages contain program, configuration, and documentation files to install,
    and certain metadata used during installation by RPM to configure the software
    package. This same information is stored in the RPM database after installation
    for documentation purposes.


    To manage software packages with RPM, you need to know how to do the following:


    +   - Verify Package Authenticity

    - Install, Update, and Uninstall Packages

    - Query the RPM Database and RPM Archives

    - Update Software with Patch RPMs

    - YaST as a Frontend to RPM'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Verify Package Authenticity


    All SUSE RPM packages are signed with the following

    GnuPG key:


    ```

    dalio:- # gpg --list-keys -v --fingerprint "build@suse.de"\ [expires: 2008-06-21]

    pub 1024D/9C800ACA 2000-10-19 [expires: 2008-06-21]

    Key fingerprint = 79C1 79B2 E1C8 20C1 890F 9994 A8E6 DAE8 9C80 0ACA

    SuSE Package Signing Key <build@suse.de>

    sub 2048G/849516C 2000-10-19 [expires: 2008-06-21]

    ```


    You can enter the command rpm --checksig package_name (such

    as rpm --checksig apache2-2.2.0-10.i586.rpm) to verify the

    signature of an RPM package. This lets you determine whether the

    package originated from SU or from another trustworthy facility.


    Verifying the package signature is especially recommended for

    update packages from the Internet.


    The SUSE public package signature key is stored in the directories

    /root/.gnupg/ and /usr/lib/rpm/gnupg/. Storing the key in

    /usr/lib/rpm/gnupg/ lets normal users verify the signature of RPM

    packages.


    # Install, Update, and Uninstall Packages


    To manage RPM software packages, you need to know how to do

    the following:


    +   * Install an RPM Package

    * Update an RPM Package

    * Uninstall an RPM Package'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Install an RPM Package


    For most RPM packages, you use the following command to install the software:


    ```

    rpm -i package_name.rpm

    ```


    When you install an RPM package, the executable programs, dokumentation files,
    configuration files, and start scripts are copied to the appropriate directories
    in the file system.


    During installation, the RPM database ensures that no conflicts arise (such as
    a file belonging to more than 1 package). The package is installed only if its
    dependencies are fulfilled and there are no conflicts with other packages.


    If dependencies are not fulfilled, RPM lists those packages that need to be installed
    to meet dependency requirements. Packages that conflict with the packages are
    also listed.


    You could use other options to ignore these errors (like --nodeps to ignore dependencies,
    or --force to overwrite existing files), but this is only for experts. If you
    force the installation despite dependency requirements not being met, the installed
    software most likely will not work properly.


    With the option -v (verbose) more information is displayed, and the option -h
    (hash) produces a progress bar consisting of # signs during package installation.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_363_0.png)


    For a number of packages, the components needed for software development (libraries,
    headers, include files, etc.) have been put into separate packages. These development
    packages are only needed if you want to compile software yourself (such as the
    most recent GNOME packages).


    Such packages can be identified by the name extension -devel, such as the packages
    alsa-devel or gimp-devel.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Update an RPM Package


    You can use the options -U (or --upgrade) and -F (or --freshen) to update a package
    by using the following syntax:


    ```

    rpm -F package_name.rpm

    ```


    This command removes the files of the old version and immediately installs the
    new files. If there is no previous version installed, the package is not installed.


    If there is an old version installed, the option -U does the same as -F, however
    if there is no previous version installed, -U installs the new version.


    RPM updates configuration files carefully using the following guidelines:


    +   - If a configuration file was not changed by the system administrator, RPM
    installs the new version of the appropriate file. No action by the system administrator
    is required.

    - If a configuration file was changed by the system administrator before the update,
    RPM saves the file with the extension .rpmorig or .rpmsave (backup file). It then
    installs the version from the new package, but only if the originally installed
    file and the newer version are different.


    If this is the case, compare the backup file (.rpmorig or .rpmsave) with the newly
    installed file and make your changes again in the new file. Be sure to delete
    all .rpmorig and .rpmsave files afterwards to avoid problems with future updates.


    The .rpmorig extension is assigned if the file has not previously been recognized
    by the RPM database; otherwise, .rpmsave is used.


    In other words, .rpmorig results from updating from a foreign format to RPM. .rpmsave
    results from updating from an older RPM to a newer RPM.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '+   A set of .rpmnew files are created if the configuration file already exists
    and if the noreplace label was specified in the file controlling the package creation
    (the so-called .spec-file).


    This is httpd to not overwrite certain configuration files (such as /etc/httpd/httpd.conf)
    to ensure continued operation.


    .rpmnew does not disclose any information as to whether the system administrator
    has made any changes to the configuration file.


    The script /etc/init.d/rpmconfigcheck searches for such files and writes a list
    of these files to /var/adm/rpmconfigcheck.


    The option -U is not equivalent to uninstalling with the -e option and installing
    with the -i option. -U whenever possible for updating packages.


    # Uninstall an RPM Package


    To uninstall (remove) an RPM package, enter the following:


    ```

    rpm -e package_name

    ```


    When you install a package, all files except modified configuration files are
    removed from the system with the help of the RPM database. This ensures a clean
    uninstallation.


    RPM will delete the package only if this does not break dependencies. If other
    packages depend on the package you want to delete, these are listed in the error
    message.


    You could force deletion of the package with the parameter --nodeps, however this
    is not advisable as the dependent software will most likely not work anymore.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Query the RPM Database and RPM Archives


    With the -q option, you can query the RPM database of installed packages and,
    by adding the option -p, inspect RPM archives that are not yet installed.


    The following are the most commonly-used RPM query options:


    # Table 8-1


    | Option | Results |

    | - | - |

    | -a | List all installed packages |

    | -i | List package information |

    | -l | Display a file list |

    | -f file | Find out to which package file belongs (the full path must be specified
    with file) |

    | -d | List only documentation files (implies -l) |

    | -c | List only configuration files (implies -i) |

    | --dump | Display a file list with complete details (to be used with -i, -c,
    or -d) |

    | --provides | List features of the package that another package can request with
    --requires |

    | --requires, -R | List the capabilities the package requires |

    | --scripts | List installation scripts (preinstall, postinstall, uninstall) |

    | --changelog | Displays a detailed list of information (updates, configuration,
    modifications, etc.) about a specific package. |'
  merge: -1
  pgno: 366
- img_proc: true
