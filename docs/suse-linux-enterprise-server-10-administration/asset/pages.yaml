  md: '# Objective 5 Set Up and Configure Disk Quotas


    Drive space continues to be a problem. When no limits are imposed, a user can
    easily fill up hard drive space with all kinds of data.


    Linux includes a quota system that allows you to specify a specific amount of
    storage space each user or group may use, and how many users or groups may create.


    In SUSE Linux Enterprise Server you can use the quota package to establish these
    limitations.


    The following illustrates the quota architecture:


    # Figure 2-14


    ![](img/84d12236ddfe17cc29fd21173b9904ac_144_0.png)


    You can implement disk quotas for partitions configured with the ext2, ext3, or
    Reiser file systems.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Setting up and configuring the disk quota service on your server includes installing
    the package quota and the following tasks:


    +   * Prepare the File System

    * Initialize the Quota System

    * Start and Activate the Quota Service

    * Configure and Manage User and Group Quotas


    # Prepare the File System


    When the system is started, the quotas for the file system must be activated.
    You can indicate for which file systems quotas are to be activated by configuring
    entries in the /etc/fstab.


    You enter the keyword **usrquota** for quotas on the user level and the keyword
    **grpquota** for group quotas, in the following:


    ```

    /dev/hda2 /      reiserfs acl,user_xattr,usrquota,grpquota 1 1

    /dev/hda1 swap swap      defaults 0 0

    proc /proc proc        defaults 0 0

    ......

    ```


    In this example, quotas are configured for the file system / (root). Quotas are
    always defined for file systems (partitions).


    If you have configured /etc/fstab without rebooting your server, you need to remount
    the file systems for quotas which have been defined. In the case of quotas for
    the partition holding the root file system, you do this by using the mount option
    **(-o) remount** like in the following:


    ```

    da10~ # mount -o remount /

    ```'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Initialize the Quota System


    After remounting, you need to initialize the quota system. You can do this by
    using the command quotacheck. This command checks the partitions with quota keywords
    in /etc/fstab to determine the already occupied data blocks and inodes and the
    stored values in the files quota.user (for user quotas) and quota.group (for group
    quotas).


    Up to kernel version 2.4 these files were called quota.user and quota.group, and
    had to be created before quotacheck run.


    If you enter the command quotacheck -avug, all file systems with the option usquear
    or grpuota /etc/fstab (-a) are checked for data blocks and inodes that are occupied
    by users (-u) and groups (-g). The option -v provides a detailed output.


    When checking file systems, you might need to use the option -m to force the check.


    Assuming the quota entries exists for /, after running quotacheck the following
    files are created:


    ```

    da10:~ # ls -1 /aquota* /export/aquota*

    -rw------ root root 9216 Aug 27 10:06 /aquota.group

    -rw------ root root 9216 Aug 27 10:06 /aquota.user

    ```


    # Start and Activate the Quota Service


    In order for the quota system to be initialized when the system is booted, the
    appropriate links must be made in the runlevel directories by entering inserv
    boot.quota (inserv quotad for NFS). Runlevels and the command inserv are explained
    in detail Section 7, “Manage System Initialization” on page 7-1.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'You can then start the quota system by entering

    /etc/init.d/boot.quota start.


    You can also start or stop the quota system by entering one of the

    following:


    ```

    /sbin/quotaon filesystem

    /sbin/quotaoff filesystem

    ```


    You can use the option -a to activate and deactivate all automatically

    mounted file systems (except NFS) with quotas.


    For additional information on quota options, enter man quotaon.


    # Configure and Manage User and Group Quotas


    To configure quotas for users and groups, you need to know how to

    do the following:


    +   - Configure Soft and Hard Limits for Blocks and Inodes

    - Configure Grace Periods for Blocks and Inodes

    - Copy User Quotas

    - Generate a Quota Report


    # Configure Soft and Hard Limits for Blocks and Inodes


    With the command edquota and the following options, you can edit

    the current quota settings for a user or group:


    +   - edquota -u user: for setting up user quotas.

    - edquota -g group: for setting up group quotas. All members of

    t group together share this quota.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'The current settings are displayed in the vi editor for you to edit.

    You can edit the soft and hard limits. The values under blocks and inodes show
    the currently used blocks and inodes are for information only; changing them has
    no effect.


    For example, you can enter the following to configure quotas for the user geeko:


    ```

    edquota -u geeko

    ```


    After entering the command, the following quota information appears in vi:


    | Quotas for user geeko (uid 1001) | | | | | |

    | Filesystem | blocks | soft | hard | inodes | soft |

    | /dev/sda2 | 7820 | 10000 | 20000 | 145 | 0 |


    The following describes the settings:


    +   - Blocks. Shows how much hard disk space is currently used, with soft and
    hard limits listed.


    The values for blocks are given in blocks of 1 KB (independent of the block size
    of the file system).


    For example, the value 7820 under Blocks indicates that the user geeko is currently
    using about 8 MB of hard drive space.


    Notice that the soft limit is set to 10 MB and the hard limit is set to 20 MB.


    +   - Inodes. Indicates how many files belong to the user on the file system,
    with soft and hard limits listed.


    Notice that the soft and hard limits for geeko are set to 0, which means that
    the user can create an unlimited number of files.


    The soft limits indicate a quota that the user cannot permanently exceed. The
    hard limits indicate a boundary beyond which no more space or inodes can be used.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    If users move beyond the soft limit, they have a fixed time available (a grace
    period) to free up space by deleting files or blocks.


    If users exceed the grace period, they cannot create any new files until they
    delete enough files to get below the soft limit.


    # Configure Grace Periods for Blocks and Inodes


    You can edit the grace periods in vi for blocks and inodes by entering **edquota
    -t**. A screen similar to the following appears:


    ```

    Grace period before enforcing soft limits for users:

    Time units may be: days, minutes, or seconds

    Filesystem Block grace period Inode grace period

    /dev/sda2 7days 7days

    ```


    You can set the grace periods in days, hours, minutes, or seconds for a listed
    file system. However, you cannot specify a grace period for a specific user or
    group.


    # Copy User Quotas


    You can copy user quotas from one user to another by using **edquota -p**.


    For example, by entering **edquota -p tux geeko**, you can copy the user quotas
    for the user **tux** to the user **geek**.


    # Generate a Quota Report


    The quota file system contain information in binary format about the space occupied
    by users and groups, and which quotas are set up. You can display this information
    by using the command **repquota**.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 149
