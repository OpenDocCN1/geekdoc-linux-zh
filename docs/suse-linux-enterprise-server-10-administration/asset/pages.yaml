  md: 'The following describes the options in the file:


    | Option | Description |

    | --- | --- |

    | size +4096k | Files will not be rotated weekly, but as soon as they reach a
    size of 4096 KB. |

    | rotate 99 | Ninety-nine versions of each of the files will be kept. |

    | compress | The old log files will be compressed. |maxage 365 | As soon as a
    compressed file is older than 365 days, it is deleted. |

    | nonempty | If a log file is empty, no rotation takes place. |

    | create 640 root | New log files are created after the rotation and owner, group,
    and permissions are specified. |

    | postrotate ... endscript | Scripts can be called after the rotation. For example,
    some services have to be restarted after log files have been changed.|


    In this example, the syslog daemon will reread its configuration files after the
    rotation (/etc/init.d/syslog reload). As this script is the same for syslogd and
    syslog-ng, as for logrotate is concerned, it does not matter which one is used.


    Most of the services whose log files should be monitored come with preconfigured
    files, so only minor adjustments are normally needed.


