- img_proc: true
  md: '# The error_log File


    The error_log file lists messages from the scheduler (such as errors and warnings):


    ```

    I [31/Mar/2006:09:48:47 +0200] Adding start banner page "none" to job 16.

    I [31/Mar/2006:09:48:47 +0200] Adding end banner page "none" to job 16.

    I [31/Mar/2006:09:48:47 +0200] Job 16 queued on ''grayscale'' by ''root''.

    I [31/Mar/2006:09:48:47 +0200] Started filter

    /usr/lib/cups/filter/textopps (PID 4088) for job 16.

    I [31/Mar/2006:09:48:47 +0200] Started filter /usr/lib/cups/filter/pstops

    (PID 4089) for job 16.

    I [31/Mar/2006:09:48:47 +0200] Started filter

    /usr/lib/cups/filter/fomatic-rip (PID 4090) for job 16.

    I [31/Mar/2006:09:48:47 +0200] Started backend

    /usr/lib/cups/backend/parallel (PID 4091) for job 16.

    ```


    The following explains the entries in the lines (from left to right):


    +   - E. An error occurred.

    - W. The server was unable to perform an action.

    - I. Operational message.

    - D. Debugging message.


    - The date-time field contains the date and time of the entry, instance when a
    page started printing.


    The format of this field is identical to the data-time field in the access_log
    file.


    - The message field contains a free-form textual message.


    # The page_log File


    The page_log file lists each page that is sent to a printer.


    ```

    grayscale root 16 [31/Mar/2006:09:48:57 +0200] 1 1 - localhost

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 464
- img_proc: true
  md: 'Each line contains the following information (from left to right):


    +   - The **printer** field contains the name of the printer that printed the
    page (in this example, grayscale).


    If you send a job to a printer class, this field contains the name of the printer
    that was assigned the job.


    +   - The **user** field contains the name of the user that submitted this file
    for printing.


    +   - The **job-id** field contains the job number of the page being printed (in
    this example, 16).


    +   - The **date-time** field contains the date and time the page started printing.


    The format of this field is identical to the date-time field in the access_log
    file.


    +   - The **page-number** field contain the number of pages (in this example,
    1).


    +   - The **num-pages** field contains the number of copies (in this example,
    1).


    For printers that cannot produce copies on their own, the num-pages field will
    always be 1.


    +   - The **job-billing** field contains a copy of the job-billing attribute provided
    with the IPP create-job or print-job requests "-" if none was provided.


    +   - The **hostname** field contains the name of the host that originated the
    print job (in this example localhost).


    # Set the Log Level to Record Errors


    Messages from cusd are written to the file /var/log/cups/error_log. With the default
    log level **info**, only requests and status changes are logged to the file.'
