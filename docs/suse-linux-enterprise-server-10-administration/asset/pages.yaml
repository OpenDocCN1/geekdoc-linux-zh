  md: '# Summary


    | Objective | Summary |


    +   1. Develop a Backup Strategy To develop a backup strategy, you need to complete
    the following steps:

    - Choose a backup method

    - Choose a backup media

    There are 3 basic backup strategies:

    - **Full backup.** All data is backed up every day.

    - **Incremental backup.** Only the data that has been changed since the last Incremental
    or full backup is saved every day.

    - **Differential backup.** Only the data that has been changed since the last
    full backup is saved every day.

    Which method you use depends on the backup window.

    The backup window is the time period in which a system is used and is available
    for a backup.'
  merge: -1
