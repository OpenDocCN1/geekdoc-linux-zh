  md: 'The file contains 2 types of entries:


    +   - **search.** The domain name in this option is used to complete incomplete
    host names. For example, if you look up the host name da3, the name is automatically
    completed to the fully qualified domain name da3.digitalairlines.com.


    +   - **nameserver.** Every entry starting with nameserver is followed by an IP
    address of a name server. You can configure up to 3 name servers. If the first
    name server fails, the next one is used.'
