    \ (GLIBC_2.0) => /lib/libm.so.6\n        libthread.so.0 (GLIBC_2.0) => /lib/libthread.so.6\n\
    \        libc.so.6 (GLIBC_2.2) => /lib/libc.so.6\n        libc.so.6 (GLIBC_2.3.4)\
    \ => /lib/libc.so.6\n        libc.so.6 (GLIBC_2.1) => /lib/libc.so.6\n       \
