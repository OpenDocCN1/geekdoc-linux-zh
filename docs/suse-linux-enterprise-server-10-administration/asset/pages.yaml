- img_proc: true
  md: 'SUSE Linux Enterprise Server 10 Administration


    +   - gfxmenu(hd0,0)/boot/message. This defines where the graphical menu is stored.


    +   - The general options are followed by options for the various operating systems
    that can be booted with the GRUB.


    +   - title title. Each entry for an operating system begins with title.


    +   - root (hd0,0). The following entries are relative to this hard disk partition
    given in the syntax of GRUB, in this example the first partition on the first
    hard disk. With this entry is not necessary to specify the partition on each of
    the following entries like kernel.


    Note the following regarding the designations for hard disks and partitions:


    GRUB does not distinguish between IDE and SCSI hard disks. The hard disk that
    is recognized by the BIOS as the first hard disk is designated as hd0, the second
    hard disk as hd1, and so on.


    The first partition on the first hard disk is called hd0,0, the second partition
    hd0,1, and so on.


    +   - kernel /boot/vmlinuz. This entry describes the kernel location, relative
    to the partition specified above. It is followed by kernel parameters, like root=/dev/hda1,
    vga=normal, etc.


    +   - initrd /boot/initrd. This entry sets the location of the initial ramdisk
    (initramfs in SLES 10), relative to root (hd0,0) specified above. The initrd contains
    hardware drivers that are needed before the kernel can access the hard disk (such
    as a driver for the IDE or SCSI controller).


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


