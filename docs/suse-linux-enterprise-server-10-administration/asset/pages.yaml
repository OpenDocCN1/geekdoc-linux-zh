    # Design Guidelines for Implementing Partitions


    YaST normally proposes a reasonable partitioning scheme with sufficient disk space.
    This is usually a swap partition (between 256 and 500 MB) and with the rest of
    the disk space reserved for a / partition.


    In addition, if there is an existing partition on the hard drive, YaST attempts
    to maintain that partition.


    If you want to implement your own partitioning scheme, consider the following
    recommendations:'
