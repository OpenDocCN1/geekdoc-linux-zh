    \        libm.so.6 (GLIBC_2.0) => /lib/libm.so.6\n        libc.so.6 (GLIBC_2.2)\
    \ => /lib/libc.so.6\n        libc.so.6 (GLIBC_2.1.3) => /lib/libc.so.6\n     \
    \   libc.so.6 (GLIBC_2.3.4) => /lib/libc.so.6\n    ...\n```\n\nBy using the command\
    \ lld, you can also find out if all required libraries are installed on a system\
    \ for specific program. The output of lld would indicate “not found” for the missing\
