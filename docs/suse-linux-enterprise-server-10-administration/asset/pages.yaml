- img_proc: true
  md: '# Objective 1


    # Describe the Linux Load Procedure


    The following represents the basic steps of booting a computer with a Linux system
    installed:


    Figure 7-1


    ![](img/84d12236ddfe17cc29fd21173b9904ac_313_0.png)


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'The following describe the process:


    +   - BIOS and Boot Manager

    - Kernel

    - initramfs (Initial RAM File System)

    - init


    # BIOS and Boot Manager


    Tasks performed by the BIOS (Basic Input Output System) include performing a power-on
    self test, conducting the initial detection and setup of hardware, and accessing
    bootable devices (such as a CD or hard drive).


    If the bootable device is a hard drive, BIOS also reads the MBR (master boot record).
    Using the code in the MBR, the BIOS starts the boot manager.


    The boot manager (such as GRUB) loads the kernel and the initrd to memory and
    starts the kernel.


    # Kernel


    The kernel (/boot/mlinuz, which is a link to /boot/mlinuz-kernelversion) uncompresses
    itself and then organizes and takes control of the continued booting of the system.


    The kernel checks and sets the console (the BIOS registers of graphics cards and
    the screen output format), reads BIOS settings, and initializes basic hardware
    interfaces.


    Next, the drivers, which are part of the kernel, probe existing hardware and initialize
    it accordingly.'
  merge: -1
  pgno: 314
- img_proc: true
  md: "The kernel controls the entire system, managing hardware access and allocating\
    \ CPU time and memory to programs.\n\n# initramfs (Initial RAM File System)\n\n\
    **initramfs** is a cpio archive that the kernel can load to a RAM disk. It provides\
    \ a minimal Linux environment that enables the execution of programs before the\
    \ actual root file system is mounted. initramfs must always provide an executable\
    \ named **init** that should execute the actual init program on the root file\
    \ system for the boot process to proceed.\n\nFormer SUSE Linux versions used an\
    \ initial RAM disk, **initrd**, instead. Despite the fact that the format changed,\
    \ the file name is still /boot/initrd. /boot/initrd is a link to /boot/initrd-**kernel-version**,\
    \ the file that holds the gzipped cpio archive.\n\nThe kernel starts the program\
    \ contained in the initramfs. It is a shell script that, amongst other things,\
    \ loads the kernel modules needed to mount the actual root file system, mounts\
    \ the root system and then starts **/sbin/init** from the root file system.\n\n\
    To look at the script in initramfs, unpack the cpio archive:\n\n```\nda10:~ #\
    \ mkdir /tmp/initramfs\nda10:~ # cd /tmp/initramfs/\nda10:/tmp/initramfs # gunzip\
    \ -c /boot/initrd-2.6.16.14-6-smp | cpio -i\n12765 blocks\nda10:/tmp/initramfs\
    \ # ls\n  bin bootsplash dev etc init lib proc root sbin sys tmp\nnda10:/tmp/initramfs\
    \ # less init\n```"
  merge: -1
  pgno: 315
- img_proc: true
  md: 'The initramfs is created with the proper modules included, for instance needed
    to access the file system, during installation. The modules to include are listed
    in the variable INITRD_MODULES= in /etc/sysconfig/kernel. If additional different
    modules are needed, for instance due to a hardware change, you would edit the
    list of modules, and then rebuild the initramfs. The command is the same as the
    one to build initrd, mkinitrd


    ```

    # mkinitrd

    Root device: /dev/sda2 (mounted on / as reiserfs)

    Module list: piix aic7xxx sym53c8xx processor thermal

    fan reiserfs edd (xennet xenblk)


    Kernel image: /boot/vmlinuz-2.6.16.14-smp

    Initrd image: /boot/initrd-2.6.16.16-smp

    Shared libs: lib/ld-2.4.so lib/libacsl.so.1.1.0

    lib/libattr.so.1.1.0 lib/libc-2.4.so

    lib/libhistory.so.5.1 lib/libncurses.so.5.5

    lib/libthread-2.4.so lib/libreadline.so.5.1

    lib/libuid-2.4.so


    Driver modules: initde-core ide-disk scsi sd_mod piix

    scsi_transport-spi aic7xxx sym53c8xx processor thermal fan

    edd

    Filesystem modules: reiserfs

    Including: initramfs fsck.reiserfs

    Bootsplash: SuSE-SLES (1024x768)

    12765 blocks

    ```


    ![](img/84d12236ddfe17cc29fd21173b9904ac_316_0.png)


    The manual page for mkinitrd lists the parameters that can be passed to the init
    program in the initramfs via the kernel command line.


    # init


    After checking the partitions and mounting the root file system, the program init
    located in initramfs starts /sbin/init, which boots the system with all its programs
    and configurations.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'The init process is always assigned a process ID number of 1, and relies on
    the /etc/inittab file for configuration information on how to run the initialization
    process.


    Once the init process starts, it begins by accessing the /etc/init.d/boot script.
    The /etc/init.d/boot script controls the start of services such as initializing
    disk quotas and mounting local file systems.


    After the boot script has been completed, init starts the /etc/init.d/rc script
    which uses configured runlevels to start services and daemons.


    Each runlevel has its own set of services that are initiated. For example, runlevel
    5 includes the X Window components that run the Linux desktop.


    For additional details on init, see “Manage Runlevels” on 7-22.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_317_0.png)'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Objective 2 GRUB (Grand Unified Bootloader)


    To manage GRUB, the Grand Unified Bootloader, you need to know the following:


    +   * What a Boot Manager Is

    * Boot Managers in SUSE Linux

    * Start the GRUB Shell

    * Modify the GRUB Configuration File

    * Configure GRUB with YaST

    * Boot a System Directly into a Shell


    # ### What a Boot Manager Is


    To boot a system, you need a program that can load the respective operating system
    into memory. This program, called the *boot loader*, loads the operating system
    kernel, which then loads the system.


    After running the Power-On Self Test (POST), the PC BIOS searches various media
    configured in the BIOS for a boot loader. If it finds one, it turns control of
    the boot process over to the boot loader.


    The boot loader then locates the operating system files on the hard drive and
    starts the operating system.


    *A boot manager* is not only a boot loader, but it can handle several operating
    systems. If there is more than one operating system present, the boot manager
    presents a menu allowing you to select a specific operating system to be loaded.


    Linux boot managers can be used to load Linux or other operating systems, such
    as Microsoft Windows.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'GRUB is designed with the following 2-stage architecture:


    +   - **Stage 1.** The first stage of a boot loader is usually installed in the
    master boot record (MBR) of the hard disk (first stage boot loader).


    As the space in the MBR is limited to 446 bytes, this program code merely contains
    the information for loading the next stage.


    Stage 1 can be installed in the MBR, in the boot sectors of partitions, or on
    a floppy disk.


    +   - **Stage 2.** This stage usually contains the actual boot loader. The files
    of the second stage boot loader are located in the directory /boot/.


    # Boot Managers in SUSE Linux


    SUSE Linux Enterprise Server provides 2 boot managers for the Linux environment:
    GRUB (GRand Unified Bootloader) and LILO (LinuxLoader).


    To understand something about these boot managers, you need to know the following:


    +   - GRUB Boot Manager


    +   - LILO Boot Manager


    +   - Map Files, GRUB, and LILO


    # GRUB Boot Manager


    GRUB is the standard boot manager in SUSE Linux Enterprise Server. The following
    are some special features of GRUB:


    +   - **File system support.** Stage 2 includes system drivers for ReiserFS, ext2,
    ext3, Minix, JFS, XFS, FAT, and FFS (BSD). For this reason, the boot manager can
    access files even before the operating system is loaded.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'This feature is useful when the boot manager configuration is faulty and you
    have to search for and load the kernel.


    +   - **Interactive control.** GRUB has its own shell that enables interactive
    control of the boot manager.


    # LILO Boot Manager


    Because LILO is not the default boot manager of SUSE Linux Enterprise Server,
    it is only covered briefly in this objective.


    The LILO configuration file is /etc/lilo.conf. Its structure is similar to that
    of the GRUB configuration file.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_320_0.png)


    When you modify the configuration file /etc/lilo.conf, you need to enter the command
    **lilo** for the changes to be applied.


    You also need to use the command lilo when moving the kernel or the initrd on
    your hard disk.


    # Map Files, GRUB, and LILO


    The main obstacle for booting an operating system is that the kernel is usually
    a file within a file system on a partition on a disk. These concepts are unknown
    to the BIOS. To circumvent this, maps and map files were introduced.


    These maps simply note the physical block numbers on the disk that comprise the
    logical files. When such a map is processed, the BIOS loads all the physical blocks
    in sequence as noted in the map, building the logical file in memory.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'In contrast to LILO, which relies entirely on maps, GRUB tries to become independent
    from the fixed maps at an early stage. GRUB achieves this by means of the file
    system code, which enables access to files by using the path specification instead
    of the block numbers.


    More information on GRUB and LILO can be found in the respective manual and pages
    and in /usr/share/doc/packages/grub and /usr/share/doc/packages/lilo.


    # Start the GRUB Shell


    As GRUB has its own shell, you can boot the system manually if the Linux system
    does not start due to an error in the boot manager.


    There are two ways to start the GRUB shell:


    +   - Start the GRUB Shell in the Running System

    - Start the GRUB Shell at the Boot Prompt


    # Start the GRUB Shell in the Running System


    To start the GRUB shell during operation, enter the command grub as root. The
    following appears:


    | GNU GRUB version 0.94 | (640K lower / 3072K upper memory) |


    ```

    [ Minimal BASH-like line editing is supported. For the first word, TAB lists possible
    command completions. Anywhere each TAB lists the possible completions of a device/filename.
    ]

    ngub>

    ```'
  merge: -1
  pgno: 321
- img_proc: true
  md: "# Manage System Initialization\n\nIn a bash shell, you can complete GRUB shell\
    \ commands with\ntab key. To find out which partition contains the kernel, enter\n\
    the command find, as in the following:\n\n```\ngrub> find /boot/vmlinuz\n(hd0,2)\n\
    \nggrub>\n```\n\nIn this example, the kernel (/boot/vmlinuz) is located in the\
    \ third\npartition of the first hard disk (hd0,2).\n\nClose the GRUB shell by\
    \ entering quit.\n\n# Start the GRUB Shell at the Boot Prompt\n\nStart the GRUB\
    \ shell at the boot prompt by doing the following:\n\n+   1. From the graphical\
    \ boot selection menu, press Esc.\n   A text-based menu appears.\n2. Start the\
    \ GRUB shell by typing e (US keyboard layout).\n\n# Modify the GRUB Configuration\
    \ File\n\nConfigure GRUB by editing the file /boot/grub/menu.lst.\nThe following\
    \ is the general structure of the file:\n\n+   First, there are general options:\n\
    \  - color-white/blue black/light-gray. Colors of the boot\n    manager menu.\n\
    \  - default 0. The first entry (numbering from 0) is the default\n    boot entry\
    \ that starts automatically if no other entry is\n    selected with the keyboard.\n\
    \  - timeout 8. The default boot entry is started automatically\n    after 8 seconds.\n\
