  md: '# Objective 3 Monitor Login Activity


    One of the most critical tasks you have as an administrator is to make sure that
    any suspicious activity on your system that might indicate a compromise of security
    is noticed and acted upon.


    Monitoring tasks include evaluating login activity for signs of security breach
    as multiple failed logins.


    Reviewing files such as /var/log/messages also gives you information about login
    activity.


    To monitor login activity, you can use the following commands:


    +   - **who.** This command shows who is currently logged in to the system and
    information such as the time of the last login.


    You can use options such as **-H (display column headings), -r (current runlevel),
    and -a (display information provided by most options).


    For example, entering **who -H** returns information similar to the following:


    ```

    da10:~ # who -H

    NAME LINE COMMENT

    root pts/0 2006-05-24 10:33 (dal.digitalairines.com)

    geekko :0 2006-05-24 13:54

    geekko pts/1 2006-05-24 13:54

    ```


    +   - **w.** This command displays information about the users currently on the
    machine and its processes.


    The first line includes information on the current time, how long the system has
    been running, how many users are currently logged on, and the system load averages
    for the past 1, and 15 minutes.'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'Below the first line is an entry for each user that displays the login name,
    the tty name, the remote host, login time, idle time, JCPU, PCPU, and the command
    line of the user''s current process.


    The JCPU time is the time used by all processes attached to the tty. It does not
    include past background jobs, but does include currently running background jobs.


    The PCPU time is the time used by the current process, named in the What field.


    You can use options such as -h (don''t display the header), -s (don''t display
    the login time, JCPU, and PCPU), and -V (display version information).


    For example, entering w returns information similar to the following:


    ```

    da10:~# w

    15:06:45 up 4:35,  4 users,  load average: 0.00, 0.00, 0.00

    USER      TTY     LOGIN#    IDLE    JCPU    PCPU    WHAT

    root      :pts/0  10:33   0.00s  0.73s  0.02s w

    geeko     :0     13:54   ?xdm?   1:15  0.58s /bin/sh

    /opt/kde3/bin/startkde

    ```


    This command displays information about local and remote systems. By default,
    the following information is displayed about each user currently logged in to
    the local host:


    +   - Login name

    - User''s full name

    - Associated terminal name

    - Idle time

    - Login time (and from where)


    You can use options such as -l (long format) and -s (short format).'
