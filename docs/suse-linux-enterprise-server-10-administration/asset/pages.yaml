- img_proc: true
  md: '# Learn Jobs and Processes


    In Linux, you use a job identifier (commonly called a job ID) to refer to processes
    when launching processes at the command line. The job identifier is a shell-specific
    numeric value that identifies the running program uniquely within that shell.


    Independent of the shell each process is identified using a process ID (commonly
    called a PID) that is unique across the entire system. All jobs have a PID, but
    not all processes have a job identifier.


    PID 1 always belongs to the init process. This is the first process started on
    the system and it creates a number of processes, which in turn can generate additional
    processes.


    If the highest possible PID within that system has been reached, the next process
    is allocated the lowest available number (such as PID 17494). Processes run for
    different lengths of time. After one process has ended, its number again becomes
    available.


    When performing tasks such as changing the priority level of a running program,
    you use the PID instead of the job ID.


    When you want to switch a process from the background to the foreground (and the
    process was started from a terminal), you use the job ID.


    # Manage Foreground and Background Processes


    The Linux shell environment allows processes to run in either the foreground or
    the background.


    Processes executed in the foreground are started in a window and run until the
    process completes; the terminal window does not return to a prompt until the program''s
    execution is complete.


    > CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Administration


    Background process execution occurs when a process is started and the terminal
    window returns to a prompt before the process finishes executing.


    Existing processes can be switched from foreground to background execution under
    the following circumstances:


    +   - The process must be started in a terminal window or console shell.

    - The process does not require input from the terminal window.


    If the process meets this criteria, it can be moved to the background.


    Processes that require input within the terminal can be moved to the background
    as well, but when input is requested, the process will be suspended until it is
    brought to the foreground and the requested input is provided.


    Commands in a shell can be started in the foreground or in the background. Processes
    in the foreground can directly receive transmitted signals.


    For example, if you enter xeyes to start the XEYES program, it is running in the
    foreground. If you press Ctrl+Z, the process stops:


    | [1]+ Stopped xeyes |

    | geeko@da10:-> |


    You can continue running a stopped process in the background by entering bg, as
    in the following:


    ```

    geeko@da10:-> bg

    [1]+ xeyes &

    gegeeko@da10:->

    ```


    The ampersand (&) displayed in the output means that the process is now running
    in the background.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    5-6


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    Version 1'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Appending an ampersand to a command starts the process in the background (instead
    of the foreground), as in the following:


    With this shell from which you started the program is available again for user
    input immediately.


    In the above example, both the job ID ([2]) and the process ID of the program
    (4351) are returned.


    Each process started from the shell is assigned a job ID by the job control of
    the shell. The command jobs lists the contents of job control, as in the following:


    ```

    geeko@da10:-> jobs xeyes\n[1]+ Stopped xeyes &\n[2] Running xeyes &\n[4]- Running
    sleep 99 &\ngeeko@da10:->

    ```


    In this example, the process with job ID 3 is already terminated. The processes
    2 and 4 are running in the background (notice the ampersand), and process 1 is
    stopped.


    The + sign indicates the process that will respond to fg without options, and
    the - sign indicates the process that inherits the + sign once the process with
    the + sign ends.


    The next background process will be assigned the job ID of 5 (highest number +
    1).'
  merge: -1
