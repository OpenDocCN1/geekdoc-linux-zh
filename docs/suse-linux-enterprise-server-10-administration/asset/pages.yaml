- img_proc: true
  md: '# Objective 1 View and Manage Processes


    To manage processes on your SUSE Linux Enterprise Server, you need to know the
    following:


    +   - Understand Process Definitions

    - Learn Jobs and Processes

    - Manage Foreground and Background Processes

    - View and Prioritize Processes

    - End a Process

    - Understand Services (Daemons)

    - Manage a Daemon Process


    # Understand Process Definitions


    The following terms are used to describe Linux processes:


    +   - **Program.** A structured set of commands stored in an executable file on
    a Linux file system. A program can be executed to create a process.

    - **Process.** A program that is loaded into memory and executed by the CPU.

    - **User Process.** A process launched by a user that is started from a terminal
    or within the graphical environment.

    - **Daemon Process.** A system process that is not associated with a terminal
    or a graphical environment. It is a process or collection of processes that wait
    for an event to trigger an action on the part of the program. In network-based
    services, this event is a network connection. Other services, like cron and atd,
    are time-based and perform certain tasks at certain points in time.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'The following illustrates the relationship between daemon processes and user
    processes:


    # Figure 5-1


    ![](img/84d12236ddfe17cc29fd21173b9904ac_246_0.png)


    In this example, during the boot process of a Linux system, the init process launches
    several daemons (daemon processes), including a daemon for user login.


    After the user logs in on a text console, a shell is started that lets him start
    processes manually (user processes). Within a graphical environment he can open
    a terminal window from which he can start user processes, or he starts processes
    by clicking on icons (PID), or choosing from menus.


    +   - Process ID (PID). A unique identifier assigned to every process as it begins.

    - Child Process. A process that is started by another process (the parent process).'
  merge: -1
  pgno: 246
