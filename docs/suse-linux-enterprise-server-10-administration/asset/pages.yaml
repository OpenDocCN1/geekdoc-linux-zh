- img_proc: true
  md: '# SECTION 4 Configure the Network Manually


    Although almost every step of a network configuration is done for you when you
    use YaST, it’s sometimes useful to configure the network settings manually. For
    testing and troubleshooting, it can be much faster to change the network setup
    from the command line.


    In this section, you learn how to configure network devices manually. You also
    learn how to configure routing with command line tools and how to to save the
    network setup to configuration files.


    # Objectives


    +   1. Understand Linux Network Terms

    2. Set Up Network Interfaces with the ip Tool

    3. Set Up Routing with the ip Tool

    4. Test the Network Connection With Command Line Tools

    5. Configure Host Name and Name Resolution

    6. Use the NetworkManager to Configure the Network'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Objective 1


    # Understand Linux Network Terms


    Before you can configure the network manually with ip, you need to understand
    the following Linux networking terms:


    +   - **Device.**The network adapter built into the system.


    +   - **Interface.** To use a physical device, a software component creates an
    interface to the device. This interface can be used by other software applications.


    The software component which creates the interface is also called a *driver.*


    In Linux, network interfaces use a standard naming scheme. Interfaces to Ethernet
    adapters follow the naming scheme eth0, eth1, eth2, and so on. For every adapter
    installed in the system, an interface is created when the appropriate driver is
    loaded.


    The command line tools for the network configuration use the term *device* when
    they actually mean an interface. The term device is used in this section for both
    physical devices and software interfaces.


    +   - **Link.** The command line tool ip uses term *link* to refer to the connection
    of a device to the network.


    +   - **Address.** The IP address assigned to a device. The address can be either
    an IPv4 or an IPv6 address. To use a device in a network, you have to assign at
    least one address to it. However, you can assign more than one address to a device.


    +   - **Broadcast.** The broadcast address of a network. By sending network packet
    to the broadcast address, you can reach all hosts in the locally connected network
    at the same time. When you assign an IP address to a device, you can also set
    this broadcast address


    +   - **Route.** The path an IP packet takes from the source to the destination
    host. The term *route* also refers to an entry in the routing table of the Linux
    kernel.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Set Up Network Interfaces with the ip Tool


    You normally configure a network card with YaST during or after installation.
    You can use the tool ip to change the network interface configuration quickly
    from the command line.


    Changing the network interface configuration at the command line is especially
    useful for testing purposes; but if you want a configuration to be permanent,
    you must save it in a configuration file. These configuration files are generated
    automatically when you set up a network card with YaST.


    You can use ip to perform the following tasks:


    +   - Display the Current Network Configuration

    - Change the Current Network Configuration


    You can enter /sbin/ip as a normal user to display the current network setup only.
    To change the network setup, you have to be logged in as root.


    As changes made with ip are lost with the reboot, you also have to know how to:


    +   - Save Device Settings to a Configuration File


    # Display the Current Network Configuration


    With the ip tool, you can display the following information:


    +   - IP Address Setup

    - Device Attributes

    - Device Statistics'
  merge: -1
  pgno: 214
