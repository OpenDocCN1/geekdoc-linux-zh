- img_proc: true
  md: '# Objective 3 Understand How CUPS Works


    To understand how CUPS works, you need to understand the following:


    +   - Steps of the Printing Process

    - Print Queues

    - Log Files


    # Steps of the Printing Process


    The printing process involves the following steps:


    +   1. A print job is submitted by a user or by a program.

    2. The file destined for the printer is stored in a print queue, which creates
    two files per print job in the directory

    `/var/spool/cups/`


    One of the file contains the actual data to print. The other one

    contains information about the print job; for example, the

    identity of the user who created the print job and the printer to

    use.


    +   3. The cuspsd printer daemon acts as the print spooler. It is

    responsible for watching all print queues and for starting the

    filters required to convert data into the printer-specific format.

    4. The conversion of print data is done in the following way:

    a. The data type is determined using the entries in

    `/etc/cups/mime.types`

    b. Subsequently, data is converted into PostScript using the

    program specified in

    `/etc/cups/mime.conv`

    c. After that, the program pstops (/usr/lib/cups/pstops) is

    used to determine the number of pages, which is written to'
  merge: -1
  pgno: 457
- img_proc: true
  md: "# /var/log/cups/page_log\n\n+   d. CUPS uses other filtering pstops as needed,\
    \ depending on the options set for the print job.\n\nFor instance, the psselect\
    \ option of pstops makes it possible to limit the printout to a certain selection\
    \ of pages, or the ps-n-up option of pstops allows to print several pages on one\
    \ sheet.\n\nTo learn how to activate these filtering functions, /usr/share/doc/packages/cups/sum.html.\n\
    \n+   e. If the selected printer is not a PostScript printer, cupsd will start\
    \ the appropriate filter to convert data into the printer-specific format.\n\n\
    One of these filter programs is /usr/lib/cups/filter/cupsomatic which in turn\
    \ relies on ghostscript for conversion.\n\nFilters are responsible for processing\
    \ all printer-specific options, including resolution, paper size, and others.\n\
    \n+   f. For the actual transfer of the data stream to the printer device, CUPS\
    \ uses another type of filter, or back end, depending on how the printer is connected\
    \ to the host.\n\nThese back ends are found in the directory /usr/lib/cups/backend/\n\
    \n```\nda10: ~ # ls /usr/lib/cups/backend/\n  canon http lpd parallel scsi usb\n\
    \  epson ipp novell pipe serial socket\n```\n\n+   5. Once the print job has been\
    \ transferred to the printer, the spooler deletes the job from the queue and starts\
    \ the next job. When the job is deleted, the print data file in /var/spool/cups/\
    \ is removed."
  merge: -1
  pgno: 458
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10 Administration


    The file that has information about the print job is not deleted. The filename
    for the first print job is labeled c00001. The number in each of the following
    print jobs is increased by one.


    The following is a schematic representation of the filtering process:


    # 10-17


    ![](img/84d12236ddfe17cc29fd21173b9904ac_459_0.png)


    # Print Queues


    With CUPS, printer devices are addressed using print queues. Rather than sending
    print jobs directly to the printer, they are sent to a print queue associated
    with the device. On a print server, each print queue is registered with its name
    in the file


    /etc/cups/printers.conf


    Among other things, this file defines through which queues the printer is addressed,
    how it is connected, and to which interface it is connected.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    10-34


    Version 1'
  merge: -1
  pgno: 459
- img_proc: true
  md: 'Several print queues can be defined for one printer, as in the

    following example:


    ```

    dal0:- # cat /etc/cups/printers.conf

    # Printer configuration file for CUPS v1.1.23

    # Written by cupsd on Thu Mar 30 16:39:17 2006

    <DefaultPrinter draft>

    Info Laserjet 4050TN

    Location Office Training Services

    DeviceURI socket://muc-hp4050TN-3.muc.novell.com:9100

    State Idle

    Accepting Yes

    JobSheets none none

    QuotaPeriod 0

    PageLimit 0

    KLimit 0

    </Printer>

    <Printer color>

    Info HEWETT-PACKARD DESJKET 880C

    Location Parallel printer on /dev/lp0

    DeviceURI parallel:/dev/lp0

    State Idle

    Accepting Yes

    JobSheets none none

    QuotaPeriod 0

    PageLimit 0

    KLimit 0

    </Printer>

    <Printer grayscale>

    Info HEWETT-PACKARD DESJKET 880C

    Location Parallel printer on /dev/lp0

    DeviceURI parallel:/dev/lp0

    State Idle

    Accepting Yes

    JobSheets none none

    QuotaPeriod 0

    PageLimit 0

    KLimit 0

    </Printer>

    ..

    ```


    For instance, in the case of color printers, it is useful to have at

    two queues, one for black-and-white printing of text documents and

    for color printing.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 460
- img_proc: true
  md: 'The following explains some entries in /etc/cups/printers.conf:


    +   - <DefaultPrinter queuename>. The entry for the default printer.


    +   - <Printer color> and <DefaultPrinter grayscale>. The queues as defined for
    the printer “HEWlett-PACKARD DESKJET 880C”.


    +   - State Idle. Currently, there is no print job in this queue.


    +   - Accepting Yes. The queue is accepting print jobs.


    +   - JobSheets none none. No starting banner and ending banner will be printed.


    Each existing queue has its own configuration file, which is stored on the print
    server in the directory


    # /etc/cups/ppd/


    These files contain entries to configure the paper size, the resolution, and other
    settings.


    By contrast, on the client side the names of queues are registered in the file
    /etc/printcap:


    ```

    da10:- # cat /etc/printcap

    # This file was automatically generated by cupsd(8) from

    # the /etc/cups/printers.conf file. All changes to it

    # file will be lost.

    draft|Laserjet 4050TN:rm=da10:rp=draft:

    color|HEWlett-PACKARD DESKJET 880C:rm=da10:rp=color:

    gayscale|HEWlett-PACKARD DESKJET 880C:rm=da10:

    rp=grayscale:

    printer|Laserjet 4050TN:rm=da10:rp=printer:

    ```


    In fact/etc/printcap is a link to /etc/cups/printcap. This file is generated and
    updated automatically by cupsd and is relevant for a number of applications (such
    as OpenOffice) that use the entries in to list the available printers in their
    printer selection dialogs.'
  merge: -1
  pgno: 461
- img_proc: true
  md: 'You should not change the file /etc/printcap manually.


    # Log Files


    The log files of CUPS are stored in the directory


    /var/log/cups/


    There are three files:


    +   - The access_log File

    - The error_log File

    - The page_log File


    For troubleshooting CUPS issues:


    +   - Set the Log Level to Record Errors


    # The access_log File


    The access_log file lists each HTTP resource that is accessed by a

    web browser or CUPS/IPP client.


    Lines in the log file looks like this:


    ```

    localhost -- [31/Mar/2006:09:48:47 +0200] "POST / HTTP/1.1" 200 132

    localhost -- [31/Mar/2006:09:48:47 +0200] "POST / HTTP/1.1" 200 132

    localhost -- [31/Mar/2006:09:48:47 +0200] "POST / HTTP/1.1" 200 72

    localhost -- [31/Mar/2006:09:48:47 +0200] "POST /printers/grayscale

    HTTP/1.1" 200 799

    ```


    The parts of a line are (from left to right):


    +   - The host field (in the example, localhost).

    - The group field always contains "-" in CUPS.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 462
- img_proc: true
  md: "+   - **The user** field is the authenticated user name of the requesting user.\n\
    \nIf a user name and password are not supplied for the request, this field contains\
    \ \"-\".\n\n+   - **The date-time** field (in this example: [31/Mar/2006:09:48:47\
    \ +0200]) shows the date and time of the request in local time. \n\nThe format\
    \ is: [DD/MON/YYYY:HH:MM:SS +ZZZZ] where ZZZZ is the time offset in hours and\
    \ minutes of coordinated universal time (UTC).\n\n+   - **The method** field is\
    \ the HTTP method used (such as \"GET, \"PUT\", and \"POST\")\n\n+   - **The resource**\
    \ field is the filename of the requested resource. Possible resources are\n  -\
    \ /\n  - /admin/\n  - /printers/\n  - /jobs/\n\n+   - **The version** field is\
    \ the HTTP version used by the client. For CUPS clients, this is always \"HTTP/1.1\"\
    .\n\n+   - **The status** field contains the HTTP status result of the request.\
    \ Usually it is \"200\", but other HTTP status codes are possible. For example,\
    \ \"401\" indicates unauthorized access.\n\n+   - **The bytes** field contains\
    \ the number of bytes in the request. For POST requests, the bytes field contains\
    \ the number of bytes that were received from the client."
  merge: -1
