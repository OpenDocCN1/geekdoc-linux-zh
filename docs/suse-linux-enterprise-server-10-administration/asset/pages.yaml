  md: '# Objective 2


    # Manage Print Jobs and Queues


    CUPS comes with several command line tools to start, stop, and modify print queues.
    The command line tools for the CUPS printing system and their man pages are included
    in the package cups-client.


    Documentation for these tools is installed with the package cups in /usr/doc/packages/cups/


    +   - CUPS Software Users Manual: sum.html and sum.pdf


    +   - CUPS Software Administration Manual: sam.html and sam.pdf


    The CUPS tools allow you to use commands according to two different styles or
    conventions, which are called:


    +   - Berkeley style (Berkeley style commands are identical to those used with
    the LPRng printing system)


    +   - System V style


    Compared with Berkely style, System V provides a somewhat extensive range of features
    for printer administration.


    To manage printer queues, you need to know how to do the following:


    +   - Generate a Print Job


    +   - Display Information on Print Jobs


    +   - Cancel Print Jobs


    +   - Manage Queues


    +   - Configure Queues


    +   - Start and Stop CUPS


    Print queues can also be managed via a web interface, which is covered later in
    this section.'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# Generate a Print Job


    Use the following commands to generate a print job:


    +   - Berkeley: **lpr -P queue file**


    +   - System V: **lp -d queue file**


    Example:


    ```

    geekoo@da10:~ # lpr -P color chart.ps

    ```


    or:


    ```

    geekoo@da10:~ # lp -d color chart.ps

    ```


    With these commands, the file chart.ps is submitted to the color queue.


    If no queue is specified, the job is printed to the default queue.


    The -o parameter needs to be used whenever any additional print options are specified:


    ```

    geekoo@da10:~ # lpr -P lp -o duplex=none order.ps

    ```


    or:


    ```

    geekoo@da10:~ # lp -o duplex=none order.ps

    ```


    This submits the file order.ps to the lp queue and disables duplex printing for
    the corresponding device (duplex=none). To view possible options, enter **lpoptions
    -l** (see “Configure Queues” on page 10-26).


    The command must be given in a slightly different form to print through a remote
    queue:


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 447
- img_proc: true
  md: '+   - Berkeley: **lpr -P queue@server file**


    +   - System V: **lp -d queue -h server file**


    Example:


    ```

    geeko@da10:~ # lpr -P lp@da101.digitalairlines.com \

    /etc/motd

    ```


    or:


    ```

    geeko@da10:~ # lp -d lp -h da101.digitalairlines.com \

    /etc/motd

    ```


    This submits the file /etc/motd to the lpr queue located on the print

    server da101.digitalairlines.com.


    For more information on these command line tools, enter **man lpr** and **man
    lp

    lp,


