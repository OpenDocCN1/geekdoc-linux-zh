- img_proc: true
  md: 'While the resource /printers concerns all queues, you can specify access restrictions
    on a per queue basis in additional entries that might look like this:


    ```

    <Location /printers/color>

    Deny From All

    Allow From 10.0.0.0/10

    Order Deny,Allow

    </Location>

    ```


    In the above example, all clients belonging to network 10.0.0.0/22 and host 10.0.1.2
    can print on all queues in the network (see previous page), with the exception
    of the color queue, which can only be accessed by the client 10.0.0.10.


    The syntax to specify clients is the same as that used to specify browse addresses
    described in “Broadcast Information about Printers to other Computers” on page
    10-43.


