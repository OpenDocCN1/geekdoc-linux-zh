  md: '# Objective 1


    # Select a Linux File System


    One of the key roles performed by the Linux operating system is providing storage
    services through creating and managing a file system.


    To successfully select a file system that meets your server requirements, you
    need to understand the following about file systems available for Linux:


    +   - Linux File Systems

    - Virtual Filesystem Switch

    - Linux File System Internals

    - Additional File System Documentation


    It is very important to keep in mind that there might be no file system that suits
    all kinds of applications. Each file system has its particular strengths and weaknesses,
    which must be taken into account.


    Always bear in mind that even the most sophisticated file system cannot be a substitute
    for a reasonable backup strategy.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_79_0.png)


    For additional details on specific file systems (such as ext3 and ReiserFS), see
    Section 18.2 in the SLES 10 Installation and Administration manual (/usr/share/doc/manual/sles-admin_en/,
    package sles-admin_en).


    Also see “Additional File System Documentation” on page 2-14 at the end of this
    objective.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Linux File Systems


    The type of file system you select depends on several factors (including speed
    and journaling). The following describes the file systems and formats available
    on Linux:


    +   - Traditional File Systems

    - Journaling File Systems


    All of these file system types are included in the 2.6 Linux kernel (used in SUSE
    Linux Enterprise Server 10).


    You can enter the following command to list the file system formats the kernel
    currently supports:


    ```

    cat /proc/filesystems

    ```


    # Traditional File Systems


    Traditional file systems supported by Linux do not journal data or metadata (permissions,
    file size, timestamps, etc.). These include the following:


    +   - ext2. The ext2 file system is inode-based, designed for speed, efficient,
    and does not fragment easily.


    Because of these features, ext2 continues to be used by many administrators, even
    though it does not provide a journaling feature.


    The ext2 file system has been available for many years, and is easily converted
    to an ext3 file system.


    +   - MS-DOS/VFAT. FAT (File Allocation Table) is the primary file system for
    consumer versions of Microsoft Windows up to and including Windows Me.


    VFAT is the 32-bit version of FAT that includes long filenames.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '+   - minix. The minix file system is old and fairly limited, but is still
    sometimes used for floppy disks or RAM disks.


    # Journaling File Systems


    A journaling file system is a file system that logs changes to a journal before
    actually writing them to the main file system. Depending on the file system and
    how it is mounted, the journal can include metadata, or also the data itself.


    The following file systems available for Linux include a journaling feature:


    +   - ext3. ext3 is the version of the ext2 file system that supports journaling.


    +   - ReiserFS. Originally designed by Hans Reiser, ReiserFS treats the entire
    disk partition as if it were a single database table, storing not only the file
    metadata, but the file itself.


    Directories, files, and file metadata are organized in an efficient data structure
    called a "balanced tree," which offers significant speed improvements for many
    applications, especially those who use lots of small files.


    +   - XFS. XFS is a high-performance journaling file system from SGI. It provides
    quick recovery after a crash, fast transactions, high scalability, and excellent
    bandwidth.


    XFS combines advanced journaling technology with full 64-bit addressing and scalable
    structures and algorithms.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_81_0.png)


    For details on XFS, see http://oss.sgi.com/projects/xfs/.


    +   - NTFS. NTFS (New Technology File System), the file system used by Windows
    NT.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Currently only reading of the file system is supported under Linux. Support
    for creating, changing and deleting files is still experimental.


    # Virtual Filesystem Switch


    For a user or program, it does not matter which file system format is used. The
    same interface to the data always appears. This is implemented by the Virtual
    Filesystem Switch (VFS) (also referred to as the virtual file system).


    This is an abstract level in the kernel providing defined interfaces for processes.
    It includes functions such as open a file, write to a file, and read a file.


    A program does not have to worry about how file access is implemented technically.
    The VFS forwards these requests to the corresponding driver for the file system
    format, as illustrated in the following:


    Figure 2-1


    ![](img/84d12236ddfe17cc29fd21173b9904ac_82_0.png)


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'One of the features of the VFS is to display file characteristics to the user
    as they are known from UNIX file system formats. This includes access permissions,
    even if they do not exist, as is the case with FAT/VFAT.


    # Linux File System Internals


    File systems in Linux are characterized by the fact that data and administration
    information are kept separate. Each file is described by an *inode* (index node
    or information node).


    Each of these inodes has a size of 128 bytes and contains all the information
    about this file except the filename. This includes details such as the owner,
    access permissions, the size, various time details (time of modification, last
    time of access, and time of modification of the inode), and the links to the data
    blocks of the file.


    How data organization takes place differs from one file system format to the next.
    To understand the basics of file system data organization on Linux, you need to
    know the following:


    +   - ext2Fs File System Format

    - ReiserFS Format

    - Directories

    - Network File System Formats'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# ext2fs File System Format


    The ext2 file system format is, in many ways, identical to traditional UNIX file
    system formats. The concepts of inodes, blocks, and directories are the same.


    When a file system is created (the equivalent of formatting in other operating
    systems), the maximum number of files that can be created is specified. The inode
    density (together with the capacity of the partition) determines how many inodes
    can be created.


    Remember that it is not possible to generate additional inodes later. You can
    only specify the inode density when creating the file system.


    An inode must exist for each file or directory on the partition. The number of
    inodes also determines the maximum possible number of files. Typically, an inode
    is generated for 4096 bytes of capacity.


    On average, each file should be 4 KB in size for the capacity of the partition
    to be used optimally. If a large number of files are smaller than 4 KB, more inodes
    are used compared with the capacity.


    This can result in the system being unable to create any more files, even if there
    is still space on the partition.


    For applications that create a large number of very small files, the inode density
    should be increased by setting the corresponding capacity to a smaller value (such
    as 2048 or even 1024). However, the time needed for a file system check will increase
    substantially.


    The space on a partition is divided into *blocks*. These have a fixed size of
    1024, 2048, or 4096 bytes. You specify the block size when the file system is
    created; it cannot be changed.


    The block size determines how much space is reserved for a file. The larger this
    value is, the more space is consumed by the file, even if the actual amount of
    data is smaller.'
  merge: -1
  pgno: 84
- img_proc: true
  md: "In the classic file system formats (to which ext2 also belongs), data is stored\
    \ in a linear chain of blocks of equal size. A specific number of blocks is grouped\
    \ together in a block group (as illustrated in the following) and each block group\
    \ consists of 32768 blocks:\n\n# Figure 2-2\n\n| Block Group O | Block Group X\
    \ | --- | Block Group N |\n| --- | --- | --- | --- |\n| Super Block | Group Descriptor\
    \ | Block Bitmap | Inode Bitmap | Inode Table | Data Blocks |\n\nThe boot sector\
    \ is at the beginning of this chain and contains static information about the\
    \ file system, including where the kernel to load can be found.\n\nEach block\
    \ group contains the following components:\n\n+   **Superblock.** The superblock\
    \ is read when the file system is mounted and contains the following information\
    \ about the system:\n    - The number of free and occupied blocks and inodes.\n\
    \    - The number of blocks and inodes for each block.\n    - Information about\
    \ file system use, such as the time of the last mount, the last write access,\
    \ and the number of mounts since the last file system check.\n    - A valid bit,\
    \ which is set to **0** when the file system is mounted and set to **1** again\
    \ by unmount.\n    When the computer is booted, the valid bit is checked. If it\
    \ is set to 0 (power failure or reset), the automatic file system check is started."
  merge: -1
  pgno: 85
- img_proc: true
  md: 'The remains of files that can no longer be reconstructed stored in the directory
    lost+found (in an ext2/ext3 file system).


    For reasons of security, there are copies of the superblock. Because of this,
    the file system can be repaired, even if the first superblock has been destroyed.


    +   - Group Descriptor. Information on the location of other areas (such as block
    bitmap and inode bitmap) is stored here. This information is stored at several
    locations within the file system for reasons of data security.


    +   - Block Bitmap. Information is stored here indicating which blocks in this
    group are free or occupied.


    +   - Inode Bitmap. Information is stored here indicating which inodes are free
    or occupied.


    +   - Inode Table. File information is stored in this table that includes owners,
    access permissions, time stamps, and links to the data blocks in which the data
    is located.


    +   - Data Blocks. This is where the actual data is located.


    The ext2 file system format can process filenames with a length of up to 255 characters.
    With the path, a name can be a maximum of 4096 characters in length (slashes included).


    A file can be up to 16 GB for a block size of 1024 bytes or two TB for a block
    size of 4096 bytes. The maximum file system size is two TB (with a block size
    of 1024 bytes) or 16 TB (with a block size of 4096 bytes).


    > The limitation on file size remains for the ext2 file system. However, the kernel
    can now handle files of almost any size.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_86_0.png)'
  merge: -1
