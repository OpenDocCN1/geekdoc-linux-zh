    # Create a File System Using Command Line Tools


    There are various commands to create file systems, including mke2fs, mkfs.ext3,
    and mreiserfs. You can use these to create file systems, such as ext2, ext3, and
    ReiserFS.


    The alternative is the command **mkfs**, which is a frontend for the actual commands
    that create file systems (such as mkfs.ext2, mkfs.ext3, or mkfs.msdos).


    When using **mkfs**, you need to use the option **-t** to indicate the file system
    type you want to create. If you do not indicate a file system, mkfs automatically
    creates an ext2 file system.


