    # # End a Process


    You can use the following to end the process:


    +   - kill and killall

    - Gnome System Monitor


    > You can also send a signal to end the process in top using the command k.


    # kill and killall


    You can use the commands **kill** and **killall** to terminate a process. The
    command **killall** kills all processes with an indicated command name; the command
    **kill** kills only the indicated process.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'The command kill requires the PID of the process (use ps or top to find the
    PID). The command killall needs the command name of the process.


    For example, if you enter xeyes at the command line to start the xeyes program
    (the PID is 18734), you can enter kill 18734 or killall xeyes to end the process.


    A process can do one of the following when receiving a signal:


    +   Capture the signal and react to it (if it has a corresponding function available).
    For example, an editor can close a file properly before it is terminated.


    or


    +   Ignore the signal if no function exists for handling signal.


    However, the process does not have control over the following 2 signals as they
    are handled by the kernel:


    ```

    kill -SIGKILL or kill -9

    ```


    ```

    kill -STOP or kill -19

    ```


    These signals cause the process to be ended immediately (SIGKILL) or to be stopped
    (STOP).


    You should use SIGKILL with caution. Although the operating system closes all
    files that are still open, data in buffers is no longer processed. This means
    that some processes may leave the service in an undefined state, so it cannot
    easily be started.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_260_0.png)


    For a complete list of signals generated by kill and what their numbers stand
    for, kill -l or man 7 signal.


