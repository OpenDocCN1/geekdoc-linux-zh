  md: '# Create an ext2 or ext3 File System


    When you create an ext2 or ext3 file system with mkfs, you can use the following
    options:


    | Option | Description |

    | --- | --- |

    | -b blocks | You can use this option to indicate the size of the data blocks
    in the file system. Values of 1024, 2048, ..., 16384 are allowed for the block
    size. |

    | -i bytes_per_inode | You can use this option to indicate how many inodes are
    created on the file system. For bytes_per_inode you can use the same values available
    for the block size. |

    | -j | You can use this option to create an ext3 Journal on the file system. |


