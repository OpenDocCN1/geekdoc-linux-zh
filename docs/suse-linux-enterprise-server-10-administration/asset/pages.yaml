  md: 'To configure a service, select a service from the list, then from the options
    below the list, select the **runlevels** you want associated with the service.


    The list includes the services and daemons available, indicates whether they are
    currently enabled on your system, and lists the runlevels currently assigned.


    If you want a service activated after editing the runlevels, from the drop-down
    list select **Start now, Stop now**, or **Refresh status.**


    You can Refresh status to check the current status (if this has not been done
    automatically).


    From the Set/Reset drop-down list, select one of the following:


    +   - **Enable the service**: activates the service in the standard runlevels.


    +   - **Disable the service**: deactivates the service.


    +   - **Enable all services**: Activates all services in their standard runlevels.


    When you finish configuring the runlevels, save the configuration by selecting
    **Finish.**


    Remember that faulty runlevel settings can make a system unusable. Before applying
    your changes, make absolutely sure you know the impact of the changes.


    # Change the Runlevel


    When starting the system, you can choose a runlevel different from the default
    runlevel defined in /etc/initab. The runlevel can also be changed in the running
    system.


    To change the runlevel, you need to understand:


    +   - Change the Runlevel at Boot'
  merge: -1
  pgno: 350
- img_proc: true
  md: '+   Manage Runlevels from the Command Line


    # Change the Runlevel at Boot


    The standard runlevel is 3 or 5, as defined in the file /etc/inittab by the entry
    initdefault. However, it is also possible to boot to another runlevel by specifying
    the runlevel on the kernel command line of GRUB.


    Any parameters that are not evaluated by the kernel itself are passed as parameters
    by the kernel. The desired runlevel is simply appended to the boot options already
    specified in GRUB (/boot/grub/menu.list), as in the following example:


    ```

    root=/dev/hda1 vga=0x317 resume=/dev/hda2 splash=silent showopts 1

    ```


    As root /dev/hda1 is transmitted to the kernel, various parameters including the
    framebuffer are set, and the system boots to runlevel 1 (single user mode for
    administration).


    # Manage Runlevels from the Command Line


    You can change to another runlevel once the system is running using the command
    init. For example, you can change to runlevel 1 from a command line by entering
    init 1.


    In the same way, you can change back to the standard runlevel where all programs
    needed for operation are run and where individual users can log in to the system.


    For example, you can return to a full GUI desktop and network interface (runlevel
    5) by entering init 5.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '> If the partition /usr of a system is mounted through NFS, you should not
    use runlevel 2 because NFS file systems are not available in this runlevel.


    Like most modern operating systems, Linux reacts sensitively to being switched
    off without warning. If this happens, the file systems need to be checked and
    corrected before the system can be used again.


    For this reason, the system should always be shut down properly. With the appropriate
    hardware, Linux can also switch off the machine as the last stage of shutting
    down.


    You stop the system by entering init 0; you restart the system by entering init
    6. The commands halt and poweroff are equivalent to init 0; the command reboot
    is equivalent to init 6.


    The command shutdown shuts down the system after the specified time (+m: minutes
    from now; hh:mm: time in hours.minutes, when Linux should shut down; system is
    stopped immediately). The option -h causes a system halt, if you use the option
    -r instead the system is rebooted. Without options, it changes to runlevel 1 (single
    user mode).


    The command shutdown controls the shutdown of the system in a special way, compared
    with the other stop commands. The command informs all users that the system will
    be shut down and does not allow other users to log in before it shuts down.


    The command shutdown can also be supplied with a warning message, such as the
    following:


    ```

    shutdown +5 The new hard drive has arrived

    ```


    If a shutdown planned for a later time should not be carried out all, you can
    revoke the shutdown by entering shutdown -c.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
