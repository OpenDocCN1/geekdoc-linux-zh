- img_proc: true
  md: 'RPM uses the following character symbols to provide hints about the changes:


    | Character | Description |

    | --- | --- |

    | 5 | MD5 check sum |

    | S | File size |

    | L | Symbolic link |

    | T | Modification time |

    | D | Major and minor device numbers |

    | U | Owner |

    | G | Group |

    | M | Mode (permissions and file type) |


    Table 8-2  Character  Description


    In the case of configuration files, the letter “c” is displayed. The following
    is an example for changes to /etc/wgetrc (wget):


    ```

    rpm -V wget

    S.5...T c /etc/wgetrc

    ```


    # Update Software with Patch RPMs


    To guarantee the operational security of a system, you update packages frequently
    by installing patched packages.


    You could update the complete package, or you could use a patch RPM suitable to
    the installed RPM package. The patch RPM has the advantage of being smaller, reducing
    the download time.


    When planning an update, you need to consider the following (using the package
    procmail as an example):


    +   - Is the patch RPM suitable for my system?'
  merge: -1
