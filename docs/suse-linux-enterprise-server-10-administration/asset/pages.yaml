- img_proc: true
  md: '# Use Access Control Lists (ACLs) for Advanced Access Control


    To use ACLs for advanced file system access control you need to know the following:


    +   * The Basics of ACLs

    * Basic ACL commands

    * Important ACL Terms

    * ACL Types

    * How ACLs and Permission Bits Map to Each Other

    * How to Use the ACL Command Line Tools

    * How to Configure a Directory with an ACL

    * How to Configure a Directory with a Default ACL

    * The ACL Check Algorithm

    * How Applications Handle ACLs


    # The Basics of ACLs


    Traditionally, 3 sets of permissions are defined for each file object on a Linux
    system. These sets include the read (r), write (w), and execute (x) permissions
    for each of three types of users: the file owner, the group, and other users.


    This concept is adequate for most practical cases. In the past however, for more
    complex scenarios or advanced applications, system administrators had to use a
    number of tricks to circumvent the limitations of the traditional permission concept.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'ACLs (Access Control Lists) provide an extension of the traditional file permission
    concept. They allow you to assign permissions to individual users or groups even
    if these do not correspond to the original owner or the owning group.


    ACLs are a feature of the Linux kernel and are supported by the ReiserFS, Ext2,
    Ext3, JFS, and XFS file systems. Using ACLs, you can create complex scenarios
    without implementing complex permission models on the application level.


    The advantages of ACLs are clearly evident in situations like replacing a Windows
    server with a Linux server providing file and print services with Samba.


    Since Samba supports ACLs, user permissions can be configured both on the Linux
    server and in Windows with a graphical user interface (only on Windows NT and
    later).


    # Basic ACL commands


    There are two basic commands for ACLs: setfacl (set file ACLs) to set getfacl
    (get file ACLs) to view the ACLs of a file or directory.


    Allowing write access to a file to one single user is a simple scenario where
    ACLs come in handy. Using the conventional approach, you would have to create
    a new group, make the two users members of the group, change the owning group
    of the file to the new group and grant write access to the file for the group.
    root access would be required to create the group and to make the two users members
    of that group.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# With ACLs you can achieve the same by making the file writable for the owner
    plus the named user:


    ```

    geeko@dal0:-> touch file

    geeko@dal0:-> ls -l file

    -rw-r--r-- 1 geeko users 2006-05-22 15:08 208

    geeko@dal0:-> setfacl -m u::rw

    geeko@dal0:-> ls -l file

    -rw-rw-r-- 1 geeko users 2006-05-22 15:08 208

    geeko@dal0:-> getfacl file

    # file: file

    # owner: geeko

    # group: users

    user::rw-rw-

    group::r--

    mask::rw--

    other::r--

    ```


    Another advantage of this approach is that the system administrator does not have
    to get involved to create a group. The user can decide on his own whom he grants
    access to his files.


    Note that the output of ls changes when ACLs are used (see the second output of
    ls above). A + is added to the fact that ACLs are defined for this file, and the
    permissions displayed for the group have a different significance. They display
    the value of the ACL mask now, and no longer the permissions granted to the owning
    group.


    # Important ACL Terms


    The following list defines terms concerning ACLs:


    +   - user class. The conventional POSIX permission concept uses three classes
    of users for assigning permissions in the file system: the owning user, the owning
    group, and other users.


    Three permission bits can be set for each user class, giving permission to read
    (r), write (w), and execute (x).'
  merge: -1
  pgno: 191
- img_proc: true
  md: '+   - access ACL. Determine access permissions for users and groups for all
    kinds of file system objects (files and directories).


    +   - default ACL. Default ACLs can only be applied to directories. They determine
    the permissions a file system object inherits from its parent directory when it
    is created.


    +   - ACL entry. Each ACL consists of a set of ACL entries. An ACL entry contains
    a type, a qualifier for the user or group to which the entry refers, and a set
    of permissions. For some types, the qualifier for the group or users is undefined.


    # ACL Types


    There are two basic classes of ACLs:


    +   - Minimum ACL. A minimum ACL includes the entries for the types: owning user,
    owning group, and other. These correspond to the conventional permission bits
    for files and directories.


    +   - Extended ACL. An extended ACL goes beyond this. It contains a mask entry
    and can contain several entries of the named user and named group types.


    ACLs extend the classic Linux file permission by the following permission types:


    +   - named user. With this type, you can assign permissions to individual users.


    +   - named group. With this type, you can assign permissions to individual groups.


    +   - mask. With this type, you can limit the permissions of named users or groups.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'The following is an overview of all possible ACL types:


    | Type | Text Form |

    |---|---|

    | owner | user::rwx |

    | named user | user:name:rwx |

    | owning group | group::rwx |

    | named group | group:name:rwx |

    | mask | mask::rwx |

    | other | other::rwx |


    The permissions defined in the entries owner and other are always effective. Except
    for the mask entry, all other entries (named user, owning group, and named group)
    can be either or masked.


    If permissions exist in the named user, owning group, or named group entries as
    well as in the mask, they are effective (logical AND). Permissions contained only
    in the mask or in the actual entry are not effective.


    The following example determines the effective permissions for the user jane:


    | Entry Type | Text Form | Permissions |

    |---|---|---|

    | named user | user:jane:r-x | r-x |

    | mask | mask::rw- | rw |

    | Effective permissions: | | r-- |


    The ACL contains two entries, one for the named user jane and mask entry. Jane
    has permissions to read and execute the corresponding file, but the mask only
    contains permissions for reading and writing.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Because of the AND combination, the effective rights allow to janee

    only read the file.


    # How ACLs and Permission Bits Map to Each Other


    When you assign an ACL to a file or directory, the permissions set

    in the ACL are mapped to the standard UNIX permissions.


    The following figure illustrates the mapping of a minimum ACL:


    Figure 3-11


    | owner | user::rw-- | rw- | owner class |

    |---|---|---|---|n| owning group | group:r-- | r-- | group class |

    | other | other:--- | --- | other class |


    The figure is structured in three blocks:


    +   - The left block shows the type specifications of the ACL entries.

    - The center block displays an example ACL.

    - The right block shows the respective permission bits according to the conventional
    permission concept as displayed by ls -l, for example.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Figure 3-12


    The following is an example of an extended ACL:


    | owner::rw-- named user group:jane-- group::r-- mask::rw-- other:---- |


    In both cases (minimum ACL and extended ACL), the owner class permissions are
    mapped to the ACL entry owner. However, the mapping of the group class permissions
    is different in the second case.


    In the case of a minimum ACL without a mask, the group class permissions are mapped
    to the ACL entry owner group. In the case of an extended ACL with a mask, the
    group class permissions are mapped to the mask entry.


    This mapping approach ensures the smooth interaction of applications, regardless
    of whether they have ACL support or not.


    The access permissions that were assigned by permission bits represent the upper
    limit for all other adjustments made by ACLs.


    Any permissions not reflected here are either not in the ACL or not effective.
    Changes made to the permission bits are reflected by the ACL and vice versa.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# How to Use the ACL Command Line Tools


    To manage the ACL settings, you can use the following command line tools:


    +   - getfacl. The command getfacl can be used to display the ACL of a file.

    - setfacl. The command setfacl can be used to change the ACL of a file.


    The following are the most important options for the setfacl command:


    Table 3-3


    | Option | Description |

    | --- | --- |

    | -m | Adds or modifies an ACL entry. |

    | -x | Removes an ACL entry. |

    | -d | Sets a default ACL. |

    | -b | Removes all extended ACL entries. |


    The options -m and -x expect an ACL definition on the command line. The following
    are the definitions for the extended ACL types:


    +   - named user. The following is an example for the user tux: setfacl -m u:tux:rx
    my_file

    - named groups. The following is an example for the group accounting: setfacl
    -m g:accounting:rw my_file

    - mask. Sets the ACL mask: setfacl -m m:rx'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# How to Configure a Directory with an Access ACL


    To configure a directory with ACL access, do the following:


    +   1. Before you create the directory, use the umask command to define which
    access permissions should be masked each time a file object is created.


    The command **umask 027** sets the default permissions by giving the owner the
    full range of permissions (0), denying the group write access (2), and giving
    other users no permissions at all (7).


    umask actually masks the corresponding permission bits or turns them off.


    > For more information about umask, see the corresponding man page umask.


    The command **mkdir mydir** should create the mydir directory with the default
    permissions as set by umask. Enter the following command to check if all permissions
    were assigned correctly:


    ```

    geekoo@da10:-> umask 027

    geekoo@da10:-> mkdir mydir

    geekoo@da10:-> ls -dl mydir

    drwx-x-- ... geekoo project3 ... mydir

    ```


    +   2. Check the initial state of the ACL by entering the following command:


    ```

    geekoo@da10:-> getfacl mydir

    # file: mydir

    # owner: geekoo

    # group: project3

    user::rwx

    group::r-x

    other::

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'The output of getfacl precisely reflects the mapping of permission bits and
    ACL entries as described before. The first three output lines display the name,
    owner, and owning group of the directory.


    The next three lines contain the three ACL. In fact, the case of this minimum
    ACL, the getfacl command does not produce any information you could not have obtained
    with ls.


    Your first modification of the ACL is the assignment of de-o read, write, and
    execute permissions to an additional user jane and an additional group jungle
    by entering the following:


    ```

    geeko@da10:-> setfacl -m user:jane:rwx,group:jungle:rwx mydir

    ```


    The option -m prompts setfacl to modify the existing ACL. The following argument
    indicates the ACL entries to modify (several entries are separated by commas).
    The final part specifies the name of the directory to which these modifications
    should be applied.


    Use the getfacl command to take a look at the resulting ACL:


    ```

    geeko@da10:-> getfacl mydir

    # file: mydir

    # owner: geeko

    # group: project3

    user::rwx

    user:jane:r-x

    group:jungle:rwx

    mask::rwx

    other:----

    ```


    In addition to the entries initiated for the user jane and the group jungle, a
    mask entry has been generated.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'This mask entry is set automatically to reduce all entries in the group class
    to a common denominator. In addition, setfac automatically adapts existing mask
    entries to the settings you modified, provided you do not deactivate this feature
    with -n.


    The mask type defines the maximum effective access permissions for all entries
    in the group class. This includes named user, named group, and owning group.


    The group class permission bits that would be displayed by ls -ld mydir now correspond
    to the mask entry:


    ```

    geeko@da10-> ls -dl mydir

    drwxrwx--+ ... geeko project3 ... mydir

    ```


    The first column of the output now contains an additional + to indicate that there
    is an extended ACL for this item.


    +   3. According to the output of the ls command, the permissions for the mask
    entry include write access. Traditionally, such permission bits would mean that
    the owning group (in this example project(3)) also has write access to the directory
    mydir.


    However, the effective access permissions for the owning group correspond to the
    overlapping portion of permissions defined for the owning group and for the mask,
    which is r-x in the example.


    As far as the effective permissions of the owning group are concerned, nothing
    has changed even after adding the ACL entries.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'In the following example, the write permission for the owning group is removed
    with the chmod command:


    ```

    geeko@da10-> chmod g-w mydir

    geeko@da10-> ls -dl mydir

    dwrxr-x++ geeko project3 ... mydir

    geeko@da10-> getfacl mydir

    # file: mydir

    # owner: geeko

    # group: project3


    user::jane:rwx # effective: r-x

    group:r-x

    group:jungle:rwx # effective: r-x

    mask::r-x

    other::--

    ```


    After executing the chmod command to remove the write permission from the group
    class bits, the output of the ls command is sufficient to see that the mask bits
    have changed accordingly: write permission is again limited to the owner of mydir.


    The output of the getfacl confirms this includes a comment for all those entries
    in which the effective permission bits do not correspond to the original permissions
    because they are filtered according to the mask entry.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'The original permissions can be restored at any time with chmod:


    ```

    geeko@da10:> chmod g+w mydir

    geeko@da10:> ls -dl mydir

    drwxrw---+ ... geeko project3 ... mydir

    geeko@da10:> getfacl mydir

    # file: mydir

    # owner: geeko

    # group: project3

    user::rwx

    user:jane:rwx

    group::r-x

    group:ungle:rwx

    mask::rwx

    other::--

    ```


    You can change the mask with setfac as well, using setfac -m m:rwx. The following
    removes write access from the mask using setfacl, with the same result as chown
    g-w above:


    ```

    geeko@da10:> setfac -m m:rwx mydir

    geeko@da10:> ls -dl mydir

    drwx-x-- ... geeko project3 ... mydir

    geeko@da10:> getfacl mydir

    # file: mydir

    # owner: geeko

    # group: project3

    user::rwx

    user:jane:rwx # effective: r-x

    group::r-x

    group:ungle:rwx # effective: r-x

    mask::r-x

    other::--

    ```'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# How to Configure a Directory with a Default ACL


    Directories can have a default ACL, which is a special kind of ACL that defines
    the access permissions that objects under the directory inherit when they are
    created. A default ACL affects subdirectories as well as files.


    There are two different ways in which the permissions of a directory''s default
    ACL are passed to the files and subdirectories it:


    +   - A subdirectory inherits the default ACL of the parent directory both as
    its own default ACL and as an access ACL.


    +   - A file inherits the default ACL as its own access ACL.


    All system functions that create file system objects use a mode parameter that
    defines the access permissions for the newly created file system object.


    If the parent directory does not have a default ACL, the permission bits are set
    depending on the setting of umask.


    If a default ACL exists for the parent directory, the permission bits assigned
    to the new object correspond to the overlapping portion of the permissions of
    the mode parameter and those that are defined in the default ACL. The umask command
    is disregarded in this case.


    The following three examples show the main operations for directories and default
    ACLs:


    +   - Add a default ACL to the existing directory mydir with the following command:


    ```

    setfacl -d -m group:jungle:r-x mydir

    ```


    The option -d of the setfacl command performs setfacl to perform the following
    modifications (option -m) in the default ACL.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Take a closer look at the result of this command:


    ```

    geeko@da10:-> setfacl -d -m group:jungle:r-x mydir

    geeko@da10:-> getfacl mydir

    # file: mydir

    # owner: geeko

    # group: project3

    user::rwx

    user:jane:rwx

    group::r-x

    group:jungle:rwx

    mask::--

    other::--

    default:user:rwx

    default:group:r-x

    default:group:jungle:r-x

    default:mask:r-x

    default:other:--

    ```


    getfacl returns both the access ACL and the default ACL. The default ACL is formed
    by all lines that start with default.


    Although you merely executed the setfacl command with an entry for the jungle
    group for the default ACL, setfacl copied all other entries from the access ACL
    to create a valid default ACL.


    Default ACLs do not have an immediate effect on access permissions. They only
    come into play when file system objects are created. These new objects inherit
    permissions only from the default ACL of their parent directory.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '+   In the following example, mkdir is used to create a sub Gli in mydir, which
    inherits the default ACL:


    ```

    geeko@dal10:-> mkdir mydir/mysubdir

    geeko@dal10:-> getfac mydir/mysubdir

    # file: mydir/mysubdir

    # owner: geeko

    # group: project3

    user::rwx

    group::r-x

    group:jungle:r-x

    mask::r-x

    other::---

    default:user::rwx

    default:group:r-x

    default:group:jungle:r-x

    default:mask:r-x

    default:other::---

    ```


    As expected, the newly-created subdirectory mysubdir has permissions from the
    default ACL of the parent directory.


    The access ACL of mysubdir is an exact reflection of the default ACL of mydir,
    as is the default ACL that this directory hands down to its subordinate objects.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'In the following example, touch is used to create a file in the mydir directory:


    ```

    geeko@da10:-> touch mydir/myfile

    geeko@da10:-> ls -l mydir/myfile

    -rw-r--+ ... geeko project3 ... mydir/myfile

    geeko@da10:-> getfac mydir/myfile

    # file: mydir/myfile

    # owner: geeko

    # group: project3

    user::rw

    group::r-x # effective:r--

    group:jungle:r-x # effective:r--

    mask::

    ```


    touch passes a mode with the value 0666, which means that new files are created
    with read and write permissions for all user classes, provided no other restrictions
    exist in umask or in the default ACL.


    In effect, this means that all permissions not contained in the mode value are
    removed from the respective ACL entries. Although no permissions were removed
    from the ACL entry of the group class, the mask entry was modified to mask permissions
    not set using mode.


    This approach ensures the smooth interaction of applications such as compilers,
    with ACLs. You can create files with restricted access permissions and subsequently
    assign them as executable. The mask mechanism guarantees that the right users
    and groups can execute them as desired.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Additional setfac Options


    Named user entries are deleted using the option -x:


    ```

    geeko@da10:-> setfac -x g:jungle mydir/

    ```


    The option -b is used to remove all ACL entries.


    ACLs can be saved to a file and restored from a file. Simply use getfac to write
    the ACLs to a file and setfac with the option -M to restore them to a file, as
    in the following example:


    ```

    geeko@da10:-> touch fileA fileB

    geeko@da10:-> setfac -m u:ux:rw fileA

    geeko@da10:-> getfac fileA > ACL-backup

    geeko@da10:-> setfac -M ACL-backup fileB

    geeko@da10:-> getfac fileB

    # file: fileB

    # owner: geeko

    # group: project3

    user::rw-

    user::ux:rw-

    group::r--nmask::rw-

    other::r--

    ```


    # The ACL Check Algorithm


    A check algorithm is applied before any process or application is granted access
    to an ACL-protected file system object.


    As a basic rule, the ACL entries are examined in the following sequence: owner,
    named user, owning group or named group, and other. The access is handled in accordance
    with the entry that best suits the process. Permissions do not accumulate.


    Things are more complicated if a process belongs to more than one group and belongs
    to several group entries. An entry is randomly selected from the suitable entries
    with the required permissions.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'It is irrelevant which of the entries triggers the final result, which is access
    granted. Likewise, if none of the suitable group entries contains the correct
    permissions, a randomly selected entry triggers the final result, which is access
    denied.


    # How Applications Handle ACLs


    As described in the preceding sections, you can use ACLs to implement very complex
    permission scenarios that meet the requirements of applications. However, some
    important applications still lack ACL support. Except for the star archiver, there
    are currently no backup applications included with SLES 10 that guarantee the
    full preservation of ACLs.


    The basic file commands (cp, mv, ls, and so on on) support ACLs, but many editors
    and file managers (such as Konqueror or Nautilus) do not.


    For example, when you copy files with Konqueror or Nautilus, the ACLs of these
    files are lost. When you modify files with an editor, the ACLs of files are sometimes
    preserved, sometimes not, depending on how the editor handles files.


    If the editor writes the changes to the original file, the access ACL is preserved.
    If the editor saves the updated contents to a new file that is subsequently renamed
    to the old filename, the ACLs might be lost, unless the editor supports ACLs.'
  merge: -1
  pgno: 207
