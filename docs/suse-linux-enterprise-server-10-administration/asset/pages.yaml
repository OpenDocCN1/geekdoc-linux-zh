    # # How to Configure LVM with Command Line Tools


    Setting up LVM consists of several steps, with a dedicated tool for each:


    +   - Tools to Administer Physical Volumes


    +   - Tools to Administer Volume Groups


    +   - Tools to Administer Logical Volumes


    This is a brief overview, not all available LVM tools are covered. To view the
    tools that come with LVM, enter **rpm -ql lvm2 | less** on a command line, and
    have a look at the corresponding manual pages for details on each of them.


    # ## Tools to Administer Physical Volumes


    Partitions or entire disks serve as physical volumes for LVM.


    The ID of a partition used as part of LVM should be **Linux LVM, 0xe8**. However
    the ID **0x83, Linux**, works as well.


    To use an entire disk as physical volume, it may not contain a partition table.
    Overwrite any existing partition table with **dd**:


    ```

    da10:~ # dd if=/dev/zero of=/dev/hdd bs=512 count=1

    ```'
  merge: -1
