- img_proc: true
  md: '# Objective 1


    # Provide Secure Remote Access with OpenSSH


    In the past, remote connections were established with Telnet, which offers no
    guards in the form of encryption or other security mechanisms against eavesdropping.
    There are also other traditional communication channels (such as FTP and some
    remote copying programs) that provide unencrypted transmission.


    The SSH suite was developed to provide secure transmission by encrypting the authentication
    strings (usually a login name and a password) and all the other data exchanged
    between the hosts.


    With SSH, the data flow can still be recorded by a third party, but the contents
    are encrypted and cannot be reverted to plain text unless the encryption key is
    known.


    SUSE Linux Enterprise Server 10 installs the package OpenSSH by default, which
    includes programs such as ssh, scp, and sftp as alternatives to Telnet, rlogin,
    rsh, rcp, and FTP.


    To provide secure remote access on a network with the OpenSSH version of SSH,
    you need to know the following:


    +   - Cryptography Basics

    "- SSH Features and Architecture

    "- Configure the SSH Server

    "- Configure the SSH Client

    "- SSH-related Commands

    "- Public Key Authentication Management"'
  merge: -1
  pgno: 493
- img_proc: true
  md: '# Cryptography Basics


    Cryptography deals with procedures and techniques used to encrypt data and prove
    the authenticity of data. An encryption algorithm is used to convert clear text
    into cipher text using a key. The key is the information required to encrypt and
    decrypt data.


    There are basically two types of encryption procedures:


    +   - Symmetric Encryption

    - Asymmetric Encryption


    # Symmetric Encryption


    With symmetric encryption, the same key is used for encryption and decryption.
    If this secret key is known, then all data encrypted with that key can be decrypted.


    An important feature of an encryption procedure is the length of the key. A symmetric
    key with a length of 40 bits (109951162776 possibilities) can be broken by brute
    force methods in a short time. Currently, symmetric keys with 128 bits or more
    are considered secure.


    In other words, the longer the key length, the more secure the data transmission,
    provided there is no cryptographic flaw in the encryption algorithm.


    The following are some of the more important symmetric encryption technologies:


    +   - DES (Data Encryption Standard). DES was standardized in 1977 and is the
    foundation of many encryption procedures (such as UNIX/Linux passwords). The key
    length is 56 bits.'
  merge: -1
  pgno: 494
- img_proc: true
  md: 'However, in January 1999 the EFF (Electronic Frontier Foundation) decrypted
    a text encrypted with DES in 22 hours using brute force (trying one possible key
    after the other). Therefore, a key with a length of 56 bits is no longer secure,
    as messages protected with such a key can be decrypted in a short time.


    +   - Triple-DES. Triple DES is an extension of DES, using DES three times. Depending
    on the variant used, the effective key length offered is 112 or 168 bits.


    +   - IDEA. IDEA is an algorithm with a key length of 128 bits. This algorithm
    has been patented in the USA and Europe (its noncommercial use is free).


    +   - Blowfish. This algorithm has a variable key length of up to 448 bits. It
    was developed by Bruce Schneider; it is unpatented and license-free, and can be
    freely used by anyone.


    +   - AES (Advanced Encryption Standard). AES is the successor to DES.


    In 1993 the National Institute of Standards and Technology (NIST) decided that
    DES no longer met today''s security requirements, and organized a competition
    for a new standard encryption algorithm. The winner of this competition was announced
    on October 2, 2000, and is the Rijndael algorithm which supports keys of 128,
    192 or 256 bits.


    The advantage of symmetric encryption is the fact that it can efficiently encrypt
    and decrypt data. Its disadvantages are the difficulties associated with key distribution
    and management.


    # Asymmetric Encryption


    In an asymmetric encryption there are two keys—a private key and a public key.
    Data that is encrypted with the private key can only be decrypted with the public
    key, and data encrypted with the public key can only be decrypted with the private
    key.'
  merge: -1
  pgno: 495
- img_proc: true
  md: '# Configure Remote Access


    The main advantage of asymmetric encryption is the fact that the public key can
    be distributed freely. A disadvantage of asymmetric procedures is their low speed
    in data processing. Symmetric procedures are much faster.


    Therefore symmetric and asymmetric procedures are often combined. For example,
    a key for symmetric encryption is transmitted through a channel encrypted symmetrically.
    SSH uses a combination of both procedures.


    Some important cryptographic procedures in this context are


    +   * RSA. The name is derived from the surnames of its developers, Rivest, Shamir,
    and Adleman. Its security is mainly based on the fact that it is easy to multiply
    two large prime numbers, but it is difficult to regain the factors from this product.


    +   * DSA. Digital Signature Algorithm. It is a US Government standard for digital
    signatures.


    +   * Diffie-Hellman. The Diffie-Hellman key exchanges a method to establish cryptographic
    keys securely without having to send the keys across insecure channels. A key
    then can be used as a secret key in symmetric encryption.


    Keys for asymmetric encryption are much longer than those used for symmetric procedures.
    For instance with RSA, the minimum key length currently considered secure is 1024
    bit.'
  merge: -1
  pgno: 496
- img_proc: true
  md: '# SSH Features and Architecture


    To understand what SSH can offer as a secure, remote transmission protocol, you
    need to know the following:


    +   - SSH Features

    - SSH Protocol Versions

    - SSH Authentication Mechanism Configuration


    # SSH Features


    The shell not only provides all the functionality of Telnet, rlogin, rsh and rcp,
    but even includes some features of FTP.


    SSH supports the protection of X11 and any TCP connections, by routing them through
    a cryptographically secure channel.


    The following lists the basic functionality provided by SSH:


    +   - Login from a remote host.

    - Interactive or noninteractive command execution on remote hosts.

    - Copying files between different network hosts; optional support for compressing
    data.

    - Cryptographically secured authentication and communication across insecure networks.

    - Automatic and transparent encryption of all communication.

    - Complete substitution of the “r” utilities: rlogin, rsh, and rcp.

    - Port forwarding.

    - Tunneling.


    SSH not only encrypts the traffic and authenticates the client, it also authenticates
    the involved servers. Various procedures are available for server authentication.'
  merge: -1
  pgno: 497
- img_proc: true
  md: 'In SUSE Linux Enterprise Server the Open Source implementation of SSH (OpenSSH)
    is used. OpenSSH is available as open source because it does not use any patented
    algorithms.


    By default, the OpenSSH server is not activated when you install SUSE Linux Enterprise
    Server 10, but it can be easily activated during or after installation.


    For more details on OpenSSH functionality, see http://www.openssh.org.


    # SSH Protocol Versions


    The following are the versions currently available for the SSH protocol:


    +   - Protocol Version 1 (SSH1)


    +   - Protocol Version 2 (SSH2)


    > SSH1 and SSH2 are used for convenience in referencing the protocol versions
    in this section. They are not official designations of the protocol versions.'
  merge: -1
  pgno: 498
- img_proc: true
  md: '# Protocol Version 1 (SSH1)


    The following illustrates the process SSH1 uses to transmit data over a secure
    connection:


    Figure 11-1


    ![](img/84d12236ddfe17cc29fd21173b9904ac_499_0.png)


    The following describes the steps in this process:


    +   1. The client establishes a connection to the server (port 22).


    In this phase the SSH client and the server agree on the protocol version and
    other communication parameters.


    +   2. The SSH server works with the following two RSA key pairs and transmits
    the public keys to the client:'
  merge: -1
  pgno: 499
- img_proc: true
  md: '+   Long-life host key pair (HK). This key pair consists of a public host key
    (/etc/ssh/ssh_host_key.pub) and a private host key (/etc/ssh/ssh_host_key) that
    identify the computer.


    Long-life key pair is identical for all SSH processes on the host.


    +   Server process key pair (SK). This key pair is created at the start of each
    server process that includes a public server key and a private server key that
    are changed at specific intervals (normally once an hour).


    This pair is never stored in a file. These dynamic keys help prevent an attacker
    from being able to decrypt recorded sessions, even if the attacker can break into
    the server and steal the long-life key pair.


    +   3. The client checks to see if the public host key is correct.


    To do this, it compares the host key with keys in the file /etc/ssh/ssh_known_hosts
    or -/.ssh/known_hosts. If these files do not contain the key, depending on the
    configuration, the connection is terminated or the user is asked how to proceed.


    +   4. The client generates a 256-bit random number, encrypts this using the public
    keys of the SSH server and sends it to the server.


    +   5. The server is now in a position to decrypt the random number, because it
    possesses the secret key.


    +   6. This random number is the key for the symmetric encryption now follows.


    The random number is also referred to as the *session key*.


    When the user now types his password, it is protected by the encrypted connection.'
  merge: -1
  pgno: 500
- img_proc: true
  md: '# Protocol Version 2 (SSH2)


    SSH protocol version 1 does not have a mechanism to ensure the integrity of a
    connection. This allows attackers to insert data packets into an existing connection
    (an insertion attack).


    SSH2 provides features to avoid such attacks. These are referred to as HMAC (Keyed-Hash
    Message Authentication Code) and are described in detail in RFC 2104.


    You should only use SSH1 if SSH2 is not available.


    The following illustrates the process SSH2 uses to transmit data over a secure
    connection:


    Figure 11-2


    ![](img/84d12236ddfe17cc29fd21173b9904ac_501_0.png)


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 501
- img_proc: true
  md: 'The following describes the steps in this process:


    +   1. A connection is established between the server and client as described
    for SSH1.


    +   2. The server now contains a key pair (DSA or RSA), the public and private
    host key.


    The private key files are /etc/ssh/ssh_host_rsa_key (RSA) and /etc/ssh/ssh_host_d_key
    (DSA), respectively.


    +   3. With SSH1, the host key is compared with the keys in the files /etc/ssh/ssh_known_hosts
    and ~/.ssh/known_hosts.


    +   4. A Diffie-Hellman key agreement then follows, through which client and server
    agree on a secret session key, without having to send the key across the wire.


    +   5. As with SSH1, communication is ultimately encrypted symmetrically.


    The basic difference between SSH1 and SSH2 are mechanisms within the protocol
    that guarantee the integrity of the connection. A keyed-hash message authentication
    code (HMAC) is used for this purpose, The mechanism for the session key agreement
    (Diffie-Hellman) is different as well.


    To see which SSH version an server supports, you can log on to port 22 Telnet.
    The following shows the potential responses from the server:


    # Table 11-1


    | Protocol | Server Response |

    |---|---|

    | SSH1 only | SSH-1.5-OpenSSH... |

    | SSH1 and SSH2 | SSH 1.99-OpenSSH... |

    | SSH2 only | SSH-2.0-OpenSSH... |'
  merge: -1
  pgno: 502
- img_proc: true
  md: 'The following is an example of # Telnet connection on port 22:


    ```

    da20:- # telnet da20 22

    Trying 10.0.0.20...

    Connected to da20.

    Escape character is ''^''.

    SSH-1.99-OpenSSH_4.2

    ```


    In the server configuration file /etc/ssh/sshd_config, the Protocol parameter
    defines which protocol versions are supported.


    For example, Protocol 2,1 in the configuration file means that SSH2 and SSH1 are
    both supported, but preference is given to SSH2. If SSH2 is not available, then
    SSH1 is used.


    You can also specify the version to use when starting the clients (such as ssh
    -1 for SSH1).


    # SSH Authentication Mechanism Configuration


    The SSH server can decrypt the session key generated and encrypted by the client
    only if it has the private key. If the server does not do this, the communication
    ends at that point.


    An absolute condition for the security of this procedure is that the client can
    check if the public host key of the server really belongs to the server.


    SSH currently does not use any directory services (such as LDAP) or any certificates
    (such as SSL) for public key management. This means that a random key pair can
    be easily created by anyone, even potential attackers, and included in the authentication
    dialog.


    When first contacting an unknown server, it is possible to “learn” its host key.
    In this case, the SSH client then writes this key to the local database.'
  merge: -1
  pgno: 503
- img_proc: true
  md: 'The following is an example of an SSH connection to a computer

    whose host key is unknown:


    ```

    geeko@da50:~ > ssh geeko@da10

    The authenticity of host ''da10 (10.0.0.10)'' can''t be established.

    RSA key fingerprint is ea:79:90:d4:bf:b6:a2:40:ee:72:56:f8:d9:e5:76.

    are you sure you want to continue connecting (yes/no)?nWarning: Permanently added
    ''da10,10.0.0.10'' (RSA) to the list of known

    hosts.

    ```


    If you answer the question with "yes," the host key is saved in

    ~/ssh/known_hosts.


    Several mechanisms are available on the server side to authenticate

    clients. The mechanisms allowed by the server are specified in its

    configuration file /etc/ssh/sshd_config.


    The following describes the two most important mechanisms with

    t appropriate configuration parameters for /etc/ssh/sshd_config in

    parentheses:


    +   * **Public Key (RSA/DSA) Authentication**


    **(sshd_config: RSAAuthentication for SSH1)**n**(sshd_config: PubkeyAuthentication
    for SSH2)


    Authentication through a public key procedure is the most

    secure method. In this case, the user proves knowledge of her

    private key (and thus her identity) through a challenge-response

    procedure, which can be run automatically using the SSH agent.


    +   * **Password Authentication**


    **(ssh_config: PasswordAuthentication)


    This authentication procedure takes place through a UNIX

    password. The transfer of the password is encrypted.'
  merge: -1
  pgno: 504
- img_proc: true
  md: 'After successful authentication, a work environment is created on the server.
    For this purpose, environment variables are set (TERM and DISPLAY), and X11 connections
    and any possible TCP connections are redirected.


    The redirection of the X11 connections only works if the DISPLAY variable set
    by SSH is not subsequently changed by the user. The SSH daemon must appear to
    X11 applications as a local X11 server, which requires a corresponding setting
    of DISPLAY.


    In addition the program xauth (used to edit and display the authorization information
    used in connecting to the X server) must exist. This program is in the package
    xf86.


    The parameter X11Forwarding in the configuration file of the SSH server (/etc/ssh/sshd_config)
    determines whether or not the graphical output is forwarded when the client requests
    it.


    If you want to use X forwarding, you must set the parameter to Yes, and you start
    the SSH client with the option -X.


    # Configure the SSH Server


    The configuration file for the server is /etc/ssh/sshd_config. Some of the more
    commonly used options include the following:


    | Option | Description |

    | --- | --- |

    | AllowUsers | Allows SSH login only for users listed, separated by spaces |

    | DenyUsers | Denies SSH login to users listed, separated by spaces |

    | Protocol | Specifies the protocol versions supported. (Default: 2,1) |'
  merge: -1
  pgno: 505
- img_proc: true
  md: '# Table 11-2 (continued) | Option | Description


    | Option | Description |

    | --- | --- |

    | ListenAddress | Specifies the local addresses sshd should listen on, **IP_address:port**
    |

    | Port | Specifies the port number that sshd listens on. The default is 22. Multiple
    options of this are permitted. |

    | PasswordAuthentication | Specifies whether password authentication is allowed.
    If you want to disable it, set this to no and also UsePAM to no. |

    | UsePAM | Enables the Pluggable Authentication Module interface. |


    ![](img/84d12236ddfe17cc29fd21173b9904ac_506_0.png)


    For additional information on SSH server configuration options, enter **man sshd**,
    and **man sshd_config**.


    # Configure the SSH Client


    You configure the SSH client by editing the file /etc/ssh/ssh.config. Each user
    can edit his individual settings in the file ~/.ssh/config.


    If a user wants to ensure that only servers are accepted which have been previously
    added to ~/.ssh/known_hosts or /etc/ssh/ssh_known_hosts, she should select the
    option StrictHostKeyChecking in the client configuration file (~/.ssh/config)
    to **yes**.


    This prevents the SSH client from simply adding new keys from unknown servers
    to ~/.ssh/known_hosts when connecting to unknown servers. Any new keys have to
    be added manually using an editor. Connections to servers whose key has changed
    are refused.'
  merge: -1
  pgno: 506
- img_proc: true
  md: 'From SSH version 1.2.20 on, three values are allowed for

    StrictHostKeyChecking: yes, no, and ask. The default setting is ask,

    which means that before a new key is entered, the user is asked for

    permission.


    The precedence of configuration options is as follows:


    +   1. Command line options

    2. ~/.ssh/config

    3. /etc/ssh/ssh_config


    For additional information on SSH client configuration options, enter man ssh_config.


    ![](img/84d12236ddfe17cc29fd21173b9904ac_507_0.png)


    # SSH-related Commands


    The following are commonly used SSH-related client commands:


    | Command | Description |

    | ssh | This is the SSH client. SSH can be a replacement for login, rsh, and Telnet.
    login is a symbolic link to ssh.

    Every user should use ssh consistently instead of Telnet. |

    | scp | This command copies files securely between two computers using ssh, and
    replaces rcp and FTP (for pure file transfer). |

    | sftp | This command offers an interface similar to a command line ftp client.
    You can view files on the remote machine with ls and transfer files using put
    and get. |'
  merge: -1
