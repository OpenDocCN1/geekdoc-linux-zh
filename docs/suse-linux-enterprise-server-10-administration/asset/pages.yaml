  md: '# Add a Printer from the Command Line


    Besides YaST, you can also configure CUPS with command line tools. After collecting
    the information you need (such as the PPD (Postscript Printer Description) file
    and the name of the device), enter the following:


    ```

    lpadmin -p <queue> -v <device-URI> \\n-P <PPD-file>-E

    ```


    The option -p specifies the queue name of the printer, the option -v sets the
    device URI attribute of the printer queue (see “Network Printers” on page 10-8),
    and the option -P is used to specify the PPD file.


    Do not use -E as the first option. For all CUPS commands, -E as the first argument
    implies the use of an encrypted connection and -E at the end enables the printer
    to accept print jobs.


    For example, to enable a parallel printer, enter a command similar to the following:


    ```

    lpadmin -p ps -v parallel:/dev/lp0 -P \/usr/share/cups/model/Postscript.ppd.gz
    -E

    ```


    To enable a network printer, enter a command similar to the following:


    ```

    lpadmin -p ps -v socket://10.0.0.200:9100/-P \/usr/share/cups/model/Postscript-level1.ppd.gz
    -E

    ```'
  merge: -1
