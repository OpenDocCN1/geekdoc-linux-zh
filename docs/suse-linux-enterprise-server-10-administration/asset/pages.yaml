- img_proc: true
  md: '# Objective 4


    # Work with Magnetic Tapes


    To work with magnetic tapes in SUSE Linux Enterprise Server 10, use the command
    mt. With this command, you can position tapes, switch compression on or off (with
    some SCSI-2 tape drives), and query the tape status.


    Magnetic tape drives used under Linux are always SCSI devices and can be accessed
    with the following device names:


    +   * dev/st0. Refers to the first tape drive.


    +   * dev/nst0. Addresses the same tape drive in the no rewind mode. This means
    that after writing or reading, the tape remains at that position and is not rewind
    back to the beginning.


    For reasons of compatibility with other UNIX versions, 2 symbolic links exist:
    /dev/rmt0 and /dev/nrmt0.


    You can query the status of the tape by entering the following command:


    mt -f /dev/st0 status


    In this example, the -f option is used to indicate the device name of the tape
    drive. The command status displays the status of the tape drive.


    The output of the command looks like the following:


    ```

    drive type = Generic SCSI-2 tape drive

    status = 620756992

    sense key error = 0

    residue count = 0

    file number = 0

    block number = 0

    Tape size 0 bytes. Density code 0x25 (unknown). Soft error count since last status=0

    General status bits on (41010000):

    BOT ONLINE IM_REP_EN

    ```'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'The most important information in this example is the file number (file number,
    starting at 0) and the block numbers (block number, starting at 0).


    These parameters determine the position of the tape. In this example, the tape
    is positioned at the beginning of the first file.


    The file count starts with 0.


    To position the tape at the beginning of the next file, use the following command:


    ```

    mt -f /dev/nst0 fsf 1

    ```


    In this example, the command fsf forwards the tape by the given number of files,
    and the tape will start before the first block of the second file.


    This can be verified with the status command, as in the following:


    ```

    mt = /f /dev/nst0 status

    drive type = Generic SCSI-2 tape drive

    status = 620756992

    sense key error = 0

    residue count = 0

    file number = 1

    block number = 0

    Tape block size 0x25 (unknown).

    Density error count since last status=0

    General status bits on (81010000);

    EOF ONLINE IM_REP_EN

    ```


    Now the file is set to 1, and the final line of the output contains EOF (end of
    file) inside of BOT (beginning of tape).


    With the option bsf, the tape can be repositioned back by a corresponding number
    of files.'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'In general, when positioning the tape, you should use a non rewinding device
    file like /dev/nst0.


    If you want the tape to be spooled back to the beginning after the reading or
    writing process, enter the following command:


    ```

    mt -f /dev/nst0 rewind

    ```


    If you want to eject the tape from the drive, then enter the following command:


    ```

    mt -f /dev/nst0 offline

    ```


    Normally, tapes should always be written without compression, otherwise you cannot
    recover the subsequent data in case of a write or read error.


    To check whether data compression is switched on or off, enter the following command:


    ```

    mt -f /dev/st0 datcompression

    ```


    The command shows whether data compression is switched on or off.


    If the parameter on or off is specified at the end of the command, then data compression
    will be switched on or off. By default, compression is switched on.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Objective 5


    # Copy Data with dd


    You can use the command dd to convert and copy files byte-wise. Normally dd reads
    from the standard input and writes the result to the standard output. But with
    the corresponding parameters, files can also be addressed directly.


    You can copy all kinds of data with this command, including entire hard disk partitions.
    Exact copies of an installed system (or just parts of it) can be created very
    simply.


    In the simplest case, a file can be copied with the following command:


    ```

    dd if=/etc/protocols of=protocols.org

    ```


    The output of dd during the copying process looks like following:


    | 12+1 records in |

    | 12+1 records out |


    Use the option if=(input file) to specify the file to be copied, and the option
    of=(output file) to specify the name of the copy.


    Copying files in this way is done using records. The standard size for a record
    is 512 bytes. The output shown above indicates that 12 complete records of the
    standard size and an incomplete record (that is, less than 512 bytes) were copied.


    If the record size is now modified by the option bs=block size, then the output
    will be modified:


    ```

    dd if=/etc/protocols of=protocols.old bs=1

    6561+0 records in

    6561+0 records out

    ```'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# A file listing shows that their sizes are identical:


    ```

    ls -l protocols*

    -rw-r--r-- 1 root root 6561 Apr 30 11:28 protocols

    -rw-r--r-- 1 root root 6561 Apr 30 11:30 protocols.old

    ```


    If you want to copy a complete partition, then the corresponding device file of
    the partition should be given as the input, as in the following:


    # dd if=/dev/sda1 of=boot.partition


    In this example, the whole partition /dev/sda is written to the file boot.partition.


    You can also use dd to create a backup copy of the MBR (master boot record), as
    in the following:


    # dd if=/dev/sda of=/tmp/mbr_copy bs=512 count=1


    In this example, a copy of the MBR is created from the hard disk /dev/sda and
    is written to the file /tmp/mbr_copy.'
  merge: -1
  pgno: 411
- img_proc: true
