- img_proc: true
  md: '# For example


    **geeko** ALL = /sbin/shutdown


    In this example, the user **geeko** is able to carry out the command **/sbin/shutdown**
    with the permissions of root on all computers (**ALL**). Being able to specify
    the computer in /etc/Sudoers allows to copy the same file to different computers
    without granting the same permissions on all computers involved.


    The following is more complex example that illustrates the flexibility of sudo:


    # 3-3


    ```

    User_Alias ADMINS = tux, geeko

    User_Alias WEBMASTER = john

    User_Alias SUBSTITUTE = oli, klaas


    # Cmnd alias specification

    Cmnd_Alias PRINTING = /usr/sbin/lpc, /usr/bin/lprm

    Cmnd_Alias SHUTDOWN = /sbin/shutdown

    Cmnd_Alias APACHE = /etc/init.d/apache


    # User privilege specification

    root ALL=(ALL) ALL


    ADMINS ALL = NOPASSWD:!/usr/bin/passwd,/usr/bin/passwd [A-z]*

    !/usr/bin/passwd root

    WEBMASTER ALL = APACHE

    SUBSTITUTE ALL = SHUTDOWN, PRINTING

    ```


    Lines 1 to 9 define aliases. You can do this for the following:


    +   * Users with User_Alias (lines 1–3)

    * Commands with Cmnd_Alias (lines 7–9)

    * Hosts with Host_Alias


    Lines 14–17 in this example show how these aliases can be used in the actual rules:


    +   * **ADMINS.** This is the User_Alias for the users tux and geeko (see line
    1).


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The following are additional parameters:


    +   - !usr/bin/passwd, /usr/bin/passwd [A-z]*. This indicates that both users
    are allowed to run the command passwd with one single argument and change the
    passwords for user accounts.


    +   - !usr/bin/passwd root. This indicates that both users are not allowed to
    change the password for root. However, they can change the passwords of other
    users.


    With this configuration, tux and geeko could still lock out root by entering sudo
    /usr/bin/passwd root -l.


    +   - WEBMASTER. This is the User_Alias for the user account john (see line 2).
    This user can start and stop the web server (APCHE).


    +   - SUBSTITUTE. This is the User_Alias for the user accounts olii and klaas
    (see line 3). These users can execute commands summarized in sections SHUTDOWN
    and PRINTING (see lines 7 and 8).


    For additional documentation and configuration examples, enter man 5 sudoers.


