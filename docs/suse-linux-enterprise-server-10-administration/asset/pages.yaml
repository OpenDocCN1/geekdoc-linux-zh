- img_proc: true
  md: 'Here is an example:


    ```

    <Location />

    Order Deny,Allow

    Deny From All

    Allow From 127.0.0.1

    Allow From 127.0.0.2

    Allow From @LOCAL

    </Location>


    <Location /admin>

    ...

    Order Deny,Allow

    Deny From All

    Allow From 127.0.0.1

    </Location>


    <Location /printers>

    Deny From All

    Allow From 10.0.0.0/24

    Allow From 10.0.1.2

    Order Allow,Deny

    </Location>

    ```


    The following explains the configuration directives:


    +   **Order,Deny.** Defines the order of the rules and the default directive:


    **Allow,Deny.** Allow requests from all systems except for those listed in a Deny
    directive


    **Deny,Allow.** Allow requests only from those listed in an Allow directive.

    * **Deny From All.** All access to the resource is prohibited.

    * **Allow From.** Access is permitted.'
