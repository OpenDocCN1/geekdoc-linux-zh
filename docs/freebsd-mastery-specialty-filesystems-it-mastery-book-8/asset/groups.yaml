  - '[PAGE 181]


    # ACL Inheritance


    ACL management is normally performed on a per-directory basis. You set an ACL
    on a directory, and tell it all files and directories within that directory inherit
    the ACL. When you need to change the ACL, change it at the directory and it automatically
    percolates down the filesystem.


    Strictly speaking, inheritance is a feature standardized in NFS 4.1, while the
    rest of the ACL implementation comes from the NFS 4 specification. Inheritance
    is compatible with NFS 4, however, and it''s an important feature.


    # Inheritance Styles


    NFSv4 ACLs have two different inheritance models, and a few widely used ones.
    We''ll talk about the popular ones separately, then dive into the lesser-known
    ones.


    The default inheritance model combines the user''s umask with the inherited umask
    to set permissions and privileges on newly created files and directories. The
    owner loses the `write_owner` and `write_acl` privileges on any inherited ACL,
    meaning that they can''t change the file permissions with chmod(8). This retains
    much of the traditional Unix model, where the user adjusts their umask to set
    permissions. Microsoft clients have no concept of a umask, and CIFS servers like
    Samba can''t make reasonable guesses on what umask it should use for all the different
    files and directories it creates. Using this model completely confuses users.


    In addition to the default model, ZFS supports a `passthrough mode`. This ignores
    the user''s umask and simply propagates a directory''s ACL down to files and directories.
    If you''re serving Windows clients, you almost certainly want passthrough mode.
    To enable passthrough, set the ZFS properties `aclmode` and `aclherit` to `passthrough`.


    ```

    # zfs set aclmode=passthrough zroot

    # zfs set aclherit=passthrough zroot

    ```


    Change these settings before creating any files or directories, especially for
    Windows clients.


    # Inheritance Options


    You can adjust a ZFS dataset''s `aclherit` property to dictate how inheritance
    functions. While passthrough mode is the most popular, other options might fit
    special situations.


    The default, `restricted`, strips any inherited `write_owner` and `write_acl`
    permissions on new files and directories. Only the file owner can change the ACL
    of their own files. The'
  - '[PAGE 182]


    inherited ACL cannot assign privileges beyond those permitted by the user''s umask.


    To disable ACL inheritance on newly created files and directories, set aclinherit
    to discard.


    If we set aclinherit to noallow, new files and directories inherit only deny ACEs.
    An outside process must assign any allow ACEs.


    Setting aclinherit to passthrough ignores umask, creating files with Unix-style
    permissions based on the ACLs.


    Lastly, an aclinherit value of passthrough-x restricts execute permissions on
    new files. If an inheritable ACE includes execute permission, and the umask permits
    creating executable files, new files inherit the executable permission.


    # Mode Options


    The aclmode property dictates how chmod(8) can change the file''s permissions.


    An aclmode setting of groupmask makes the user''s umask the maximum permissions
    level a file can see. See “Umask and ACL Inheritance” later this chapter for a
    full discussion.


    Having aclmode set to discard chmod(8) removes all ACL information.


    An aclmode of passthrough sends the ACL straight through to new files.


    # Inheritance Flags


    You can dictate how a directory propagates its ACL using inheritance flags. You
    remember that next-to-last field in each ACE''s always been dashes? Here’s where
    we fill in that. These flags can only be placed on directories, not on individual
    files. As with privilege flags, you cannot mix names and letters.


    The file_inherit (f) flag means that all files within the directory inherit the
    ACL on the directory.


    The dir_inherit (d) flag means that the directory''s subdirectories inherit the
    directory''s ACLs.


    The inherit_only (i) flag means that newly created files and files within the
    directory get this, but this ACL doesn''t apply to the directory. This gets applied
    if, say, files in the directory have loose permissions but you don''t want anyone
    to delete the directory itself.'
  - '[PAGE 183]


    The no_propagate (n) flag tells the directory to add its ACL to child directories,
    but not their children.


    While only directories can have these inheritance flags, you will see one inheritance
    flag on files. The inherited (i) flag means that the ACL on this file or directory
    was inherited. This flag is only supported in FreeBSD 11 and later.


    Files and directories inherit their ACLs when they''re added to the filesystem.
    On a file server, this might be when a a user uploads a document. For local users,
    it’s at file creation time.


    # Directories and Inheritance


    Let’s apply an ACL to a directory and add some files. We''ll start with the common
    case, a ZFS dataset with ACLs in passthrough mode. Note that while I use the full
    name of a privilege set, I use the letters for the inheritance options. I can''t
    mix full names of privileges with letter privileges, the full names of inheritance
    options with letters, but I can use different methods for privilege and inheritance.


    ```

    # mkdir support

    # setfacl -a0 g:vermin:full_set:fd:allow

    # setfacl -q support

    group:vermin:rwxpddaAWRcCCos:fd-----allow

    owner@rwxp---AWRcCCos::allow

    group@r-- -a-R-C--s::allow

    everyone@r-- -a-R-C--s::allow

    ```


    My system group vermin has full access to this directory. The (file_inherit) inheritance
    flags tell the system to apply this same ACL to any files and subdirectories.


    User phk uploads a file, phones.docx, containing instructions on how to set up
    new phones. He doesn’t do anything special to the file ACL.


    ```

    # getfacl -q phones.docx

    group:vermin:rwxpddaAWRcCCos-----I:allow

    owner@rwx-p---AWRcCCos::allow

    group@r-- -a-R-C--s::allow

    everyone@r-- -a-R-C--s::allow

    ```


    The ACL on this file differs from that on the directory only by the inheritance
    flags. The i means this ACL is inherited.


    If a user in this group creates a subdirectory, it will get the same ACL, plus
    the f and d inheritance flags.'
