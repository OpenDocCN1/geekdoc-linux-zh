- md: "\nsubdirectory, so the subdirectory retains its ACL.\n\nIf you create a new\
    \ subdirectory, it will inherit the new ACL from the parent directory.\nFiles\
    \ in that new subdirectory will not inherit the ACL.\n\nThis is no different than\
    \ you’d experience on a Microsoft system. Changing the ACL in a directory and\
    \ having it propagate to the entire directory tree rooted causes a lot of disk\
    \ churn touches every single file. Recursively changing the ACLs on a whole ZFS\
    \ directory tree probably requires two find(1) commands: one for the files, and\
    \ a separate one for the directories. You’re best off reading the ACL from a file\
    \ with -b before applying the new one.\n\n## Umask and ACL Inheritance\n\nIf you’re\
    \ using ACLs on UFS, or you don’t want to use ZFS’ passthrough mode, the user’s\
    \ umask gives the upper limit on permissions in an ACL. If you’re not familiar\
    \ with umask and permissions at file creation time, read umask(2) and any number\
    \ of tutorials on the Internet. Every systems administrator must understand umask\
    \ before even beginning to ponder about implementing ACLs.\n\nThe default FreeBSD\
    \ umask is 022, meaning that files get created with a mode that the owner can\
    \ read and write them, while the group and everyone else can only read them. If\
    \ you’re using this umask and create a file, those are the maximum permissions\
    \ the file can have. If your inherited ACL says “this other group should have\
    \ read and write access to the file,” and your umask says “everybody else gets\
    \ read-only access to a file create,” the umask wins.\n\nFreeBSD gives users a\
    \ default umask of 022 for very good reasons. In cases it might make sense to\
    \ increase the umask—on some shared systems I set my umask to 027, so that random\
    \ system users can’t view the contents of my files. It rarely makes sense to lower\
    \ your umask.\n\nIf you don’t use ZFS’s ACL passthrough features, you’ll need\
    \ to reduce your umask to 0 when working within an ACL-protected part of the directory\
    \ tree, then increase back to 022 when you’re done. I can’t be bothered to remember\
    \ to do that, not when passthrough mode handles it for me.\n\n## ACE Ordering@\
    \ Deny\n\nNFSv4 ACLs are processed on a first-match basis. A match doesn't trigger\
    \ the whole ACE, however. Rather, each permission gets checked separately. Consider\
    \ the following file.\n\n```\n# touch daft\n# chmod 157 daft\n# ls -l daft\n-xr-wwx\
    \ 1 mwl 0 Nov 19 14:55 daft\n```\n\nThis really is a daft file. It's executable\
    \ by the owner. It's readable and executable by the group owner. And it's writable,\
    \ readable, and executable by everyone except the owners. You also must never\
    \ do in this real world.\n\n```\n# getfacl -v daft\nowner@-rw-p----: deny\ngroup@--w-p----:\
    \ deny\nowner@--X--aARWCoCos: allow\ngroup@-r--x-a-R-C-S allow\neveryone@rwx-a-R-C-S--\
    \ allow\n```\n\nThis is the first time I've seen a deny ACE in an ACL, so let's\
    \ touch on that quickly.\n\nGenerally speaking, deny ACEs should appear at the\
    \ beginning of the ACL. Microsoft clients in particular throw a hissy when deny\
    \ statements appear intermixed with allow statements. The only deny ACE that comes\
    \ only after an allow is the implicit one at the very end. ACLs don't putting\
    \ all of the deny statements at the beginning of the file, though. Run chmod 0101\
    \ on a file and look at the ACL.\n\nWhen a principal tries to access a file, each\
    \ privilege it tries to use gets checked separately. Each check \"drops down\"\
    \ through the ACL until it hits a match of principal and privilege.\n\nSuppose\
    \ the owner wants to execute the daft file. The principal on the first ACE is\
    \ the owner. This ACE specifically forbids reading and writing, but says nothing\
    \ about execution. We check the next ACE, and the next, until an ACE permits execution,\
    \ an ACE explicitly denies execution, or we hit the terminal implied deny.\n\n\
    This example looks trivial, but the same theory applies to complex ACLs. A user\
    \ might get access to one privilege as a member of one principal, then a second\
    \ privilege as a member of another principal. Each individual privilege check\
    \ falls through the ACL until it is either granted to the user or blocked.\n\n\
    ## ACLs and Samba\n\nNFSv4 ACLs are most commonly deployed on Samba 4 servers\
    \ (http://www.samba.org), as storage back ends for CIFS. Here are a few things\
    \ that commonly trip up these sysadmins, courtesy of John Hickson, the FreeNAS\
    \ support guy who answers most ACL questions.\n\n- Always use ZFS. Once you have\
    \ ZFS, always set aclmode and aclinherit to passthrough On datasets for Samba.\n\
    - Do not use world-writable files (mode 777), or use a umask of 000. If you do,\
    \ you will suffer.\n- Windows Search on directories requires allow on at least\
    \ the rxaRc privileges.\n- ACLs can get far more complicated than the examples\
    \ in this chapter. Remember, simplicity is the key to successful ACL deployment.\
    \ Good luck.\n\nAfter ACLs, FUSE and autofofs will seem positively trivial.\n\n\
    > ^1 All usernames are randomly generated. Any resemblance to primordial FreeBSD\
    \ core team members, living or dead, is purely coincidental.\n\n> ^2 Still a coincidence.\n\
    \n> ^3 I would say \"absolutely never,\" but then some annoying user would tell\
    \ me.\n\n> ^4 Hickson would also like to know that is it.\n\n## Chapter 12: Filesystem\
    \ Glues\n\nNFSv4 ACLs are most commonly deployed on Samba 4 servers (http://www.samba.org),\
    \ as storage back ends for CIFS. Here are a few things that commonly trip up these\
    \ sysadmins, courtesy of John Hickson, the FreeNAS support guy who answers most\
    \ ACL questions.\n\n- Always use ZFS. Once you have ZFS, always set aclmode and\
    \ aclinherit to passthrough On datasets for Samba.\n- Do not use world-writable\
    \ files (mode 777), or use a umask of 000. If you do, you will suffer.\n- Windows\
    \ Search on directories requires allow on at least the rxaRc privileges.\n- ACLs\
    \ can get far more complicated than the examples in this chapter. Remember, simplicity\
    \ is the key to successful ACL deployment. Good luck.\n\nAfter ACLs, FUSE and\
    \ autofofs will seem positively trivial.\n\n> ^1 All usernames are randomly generated.\
    \ Any resemblance to primordial FreeBSD core team members, living or dead, is\
    \ purely coincidental.\n\n> ^2 Still a coincidence.\n\n> ^3 I would say \"absolutely\
    \ never,\" but then some annoying user would tell me.\n\n> ^4 Hickson would also\
    \ like to know that is it.\n\n## FUSE\n\nFilesystem in Userspace, or FUSE, presents\
    \ a way for userland programs to handle filesystems. FUSE programs run as user\
    \ processes, interpreting data and handling the kernel. \n\nA filesystem can be\
    \ more than just a place to stick data. FUSE systems can also be useful tools\
    \ for accessing data in novel ways. Consider devfs (Chapter 2), which FreeBSD\
    \ uses to access hardware through a filesystem. Optional tools like fdescfs and\
    \ mqueues (Chapter 3) let you access kernel memory structures as a filesystem.\
    \ Many users could benefit from exposing their own data in ways you can't guess\
    \ at. FUSE also supports interesting data transformations, such as mounting a\
    \ filesystem over SSH. The FreeBSD developers would never permit an SSH client\
    \ in the kernel, but since we're out in userland anyway, might as fire SSH while\
    \ you' there. Or an MP3 transcoder. Or an HTTP client, letting you mount and examine\
    \ an ISO on a web server without downloading the whole thing. There is even a\
    \ Wikipedia FUSE module, letting you view and edit Wikipedia as a filesystem.\
    \ Some filesystems like MooseFS (www.moosefs.org) are implemented entirely for\
    \ FUSE.\n\nFUSE modules are frequently portable between operating systems. The\
    \ data structures of a Microsoft NTFS disk don't change based on the operating\
    \ system you're reading it on. FUSE modules do need changes to work between operating\
    \ systems—FreeBSD expects different filesystem structures than Linux or Solaris—but\
    \ that is trivial compared to the difficulty of implementing a filesystem inside\
    \ the kernel.\n\nUsing FUSE is not risk-free. FUSE modules feed data into the\
    \ kernel. While the kernel sanitizes the data, a corrupt filesystem might throw\
    \ garbage into the kernel. A clever intruder might be able to leverage his way\
    \ into privileged access.\n\nSometimes, though, FUSE is the best way to solve\
    \ a problem. You need to investigate files on another server? Use SSH. A program\
    \ needs to investigate files on another server, but it can only look at local\
    \ files? Stick FUSE’s mount-over-SSH module in the middle and go on.\n"
