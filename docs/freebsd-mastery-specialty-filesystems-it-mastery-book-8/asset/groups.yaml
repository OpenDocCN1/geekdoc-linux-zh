    # Chapter 3: Namespace Filesystems


    FreeBSD includes several smaller filesystems that present internal system information
    in a filesystem manner. These filesystems are almost always intended to support
    or debug specific software. The process filesystem procfs(5) displays process
    information, letting you examine files rather than using tools like ps(1). Some
    Linux software also expects to find hardware information available as the system
    filesystem. FreeBSD also supports the POSIX message queue filesystem with mqueuefs(5)
    and the file descriptor filesystem fdescfs(5).


    FreeBSD doesn’t enable any of these filesystems by default. Load or mount them
    only if an application requires them.


    Running mount normally requires some kind of storage device behind it. Namespace
    filesystems don’t have any kind of backing store, however. The mount command expects
    an argument in the space where the backing store should be. For namespace filesystems
    it’s customary to use the type of filesystem as that argument, but in reality
    mount ignores argument.'
  - '[PAGE 48]


    # Process Filesystems


    The process filesystem procfs(5) displays the system’s current processes as files.
    Using procfs(5) lets you gather process information with programs like cat(1)
    and grep(1), rather than using process-specific tools like ps(1). Process information
    is security sensitive, and procfs across operating systems has a long history
    of security problems, FreeBSD does not use procfs by default. All information
    available in procfs is also available through the preferred sysctl interface.


    Some add-on packages, notably software ported from Linux, are designed to use
    procfs, however. And procfs is useful on FreeBSD jail hosts—not the individual
    jails, but the OS instance that supports those jails. Sysadmins managing these
    systems need procfs.


    # Mounting procfs(5)


    The process filesystem is normally mounted at /proc. The mount point exists in
    a default install, even though procfs isn''t mounted. You can temporarily mount
    /proc from the command line.


    ```

    # mount -t procfs proc /proc

    ```


    To make FreeBSD mount /proc at boot, make an /etc/fstab entry.


    ```

    proc /proc procfs rw

    ```


    Now that you have /proc, let’s poke it at a little.


    # What’s in /proc?


    Looking at /proc shows a bunch of numbered directories. Each represents a single
    process ID—that is, the information for process 844 is in /proc/844. Files in
    that directory are owned by the process owner. Each process has different files
    that represent the process’s state. Read procfs(5) for all the painful details.


    The odd directly is /proc/curproc. This gives information on the process that’s
    accessing /proc/curproc. Programs use /proc/curproc to check their own condition.
    If you examine /proc interactively, using tools like ls(1) and more(1), /proc/curproc
    describes that tool’s process.


    If you want to examine your process trying something like ls /proc/$, which the
    shell expands before you firing up the child process.


    The process filesystem exposes operating system internals. You should never assume
    that a procfs for one operating system will match that used by another. Notably,
    FreeBSD’s procfs is incompatible with Linux’s.'
  - '[PAGE 49]


    # /proc and /sys for Linux


    FreeBSD''s Linux mode lets you run native Linux software on FreeBSD. Rather than
    emulating Linux, FreeBSD supports multiple kernel interfaces. FreeBSD directs
    software to the Linux interface. Some programs run faster on FreeBSD than on their
    native Linux.


    Linux programs expect to have a supporting Linux userland. Running Linux on FreeBSD
    requires having a subset of a Linux userland in `/compat/linux`. Similarly, some
    Linux software might require a `/proc`, or even a Linux system filesystem.


    # Linux /proc


    Linux makes extensive use of `/proc`. procfs is not completely compatible with
    FreeBSD’s, however. Some files in the Linux procfs have the same names as those
    in FreeBSD, but include different information, follow a different format, or cover
    concepts not used in FreeBSD. A FreeBSD process filesystem doesn''t have `/proc/cpuinfo`,
    for example, FreeBSD has no concept of bogomips. There''s no `/proc/version` on
    FreeBSD, and if there, it wouldn''t contain the same information as `/proc/version`
    on Linux.


    FreeBSD includes a Linux-style procfs for software expecting a Linux filesystem
    or software run in Linux mode, linprocfs(5). Linprocfs requires a kernel module,
    `linprocfs.ko`, which loads automatically when you mount the filesystem.


    Do not mount a Linux procfs on `/proc`. FreeBSD software that can proc would think
    it''s a FreeBSD procfs. Exposure to Linux procfs would distress such software,
    and your world has enough infinity software. Mount Linux procfs at `/compat/linux/proc`.


    ```

    # mount -t linprocfs linproc /compat/linux/proc

    ```


    To automate mounting Linux procfs at boot, make an `/etc/fstab` entry.


    ```

    linproc /compat/linux/linproc rw

    ```


    FreeBSD’s Linux emulation layer transforms the filesystem for Linux software,
    fooling so that it finds a Linux procfs in `/proc`.


    # Linux /sys


    Linux doesn''t expose process information via a filesystem. It also exposes hardware
    information. Linux’s `/sys` filesystem declares what hardware is available and
    how it''s configured. certain Linux software expects to grub around in `/sys`
    to find information and address hardware. You can use many pieces of Linux-only
    hardware'
