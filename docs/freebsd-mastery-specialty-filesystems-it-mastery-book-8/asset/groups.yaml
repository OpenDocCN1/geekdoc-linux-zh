    If you create a new subdirectory, it will inherit the new ACL from the parent
    directory.

    Files in that new subdirectory will not inherit the ACL.


    This is no different than you’d experience on a Microsoft system. Changing the
    ACL in a directory and having it propagate to the entire directory tree rooted
    causes a lot of disk churn touches every single file. Recursively changing the
    ACLs on a whole ZFS directory tree probably requires two find(1) commands: one
    for the files, and a separate one for the directories. You’re best off reading
    the ACL from a file with -b before applying the new one.


    # Umask and ACL Inheritance


    If you’re using ACLs on UFS, or you don’t want to use ZFS’ passthrough mode, the
    user’s umask gives the upper limit on permissions in an ACL. If you’re not familiar
    with umask and permissions at file creation time, read umask(2) and any number
    of tutorials on the Internet. Every systems administrator must understand umask
    before even beginning to ponder about implementing ACLs.


    The default FreeBSD umask is 022, meaning that files get created with a mode that
    the owner can read and write them, while the group and everyone else can only
    read them. If you’re using this umask and create a file, those are the maximum
    permissions the file can have. If your inherited ACL says “this other group should
    have read and write access to the file,” and your umask says “everybody else gets
    read-only access to a file create,” the umask wins.


    FreeBSD gives users a default umask of 022 for very good reasons. In cases it
    might make sense to increase the umask—on some shared systems I set my umask to
    027, so that random system users can’t view the contents of my files. It rarely
    makes sense to lower your umask.


    If you don’t use ZFS’s ACL passthrough features, you’ll need to reduce your umask
    to 0 when working within an ACL-protected part of the directory tree, then increase
    back to 022 when you’re done. I can’t be bothered to remember to do that, not
    when passthrough mode handles it for me.'
  - '[PAGE 186]


    # ACE Ordering@ Deny


    NFSv4 ACLs are processed on a first-match basis. A match doesn''t trigger the
    whole ACE, however. Rather, each permission gets checked separately. Consider
    the following file.


    ```

    # touch daft

    # chmod 157 daft

    # ls -l daft

    -xr-wwx 1 mwl 0 Nov 19 14:55 daft

    ```


    This really is a daft file. It''s executable by the owner. It''s readable and
    executable by the group owner. And it''s writable, readable, and executable by
    everyone except the owners. You also must never do in this real world.


    ```

    # getfacl -v daft

    owner@-rw-p----: deny

    group@--w-p----: deny

    owner@--X--aARWCoCos: allow

    group@-r--x-a-R-C-S allow

    everyone@rwx-a-R-C-S-- allow

    ```


    This is the first time I''ve seen a deny ACE in an ACL, so let''s touch on that
    quickly.


    Generally speaking, deny ACEs should appear at the beginning of the ACL. Microsoft
    clients in particular throw a hissy when deny statements appear intermixed with
    allow statements. The only deny ACE that comes only after an allow is the implicit
    one at the very end. ACLs don''t putting all of the deny statements at the beginning
    of the file, though. Run chmod 0101 on a file and look at the ACL.


    When a principal tries to access a file, each privilege it tries to use gets checked
    separately. Each check "drops down" through the ACL until it hits a match of principal
    and privilege.


    Suppose the owner wants to execute the daft file. The principal on the first ACE
    is the owner. This ACE specifically forbids reading and writing, but says nothing
    about execution. We check the next ACE, and the next, until an ACE permits execution,
    an ACE explicitly denies execution, or we hit the terminal implied deny.


    This example looks trivial, but the same theory applies to complex ACLs. A user
    might get access to one privilege as a member of one principal, then a second
    privilege as a member of another principal. Each individual privilege check falls
    through the ACL until it is either granted to the user or blocked.'
