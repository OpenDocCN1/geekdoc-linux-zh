    analyze the data itself to capture and reconcile the changes. How do you that
    depends entirely on the data.


    The split brain issue is why I recommend not using HAST as database storage backend.
    Clustered databases like PostgreSQL, and even MySQL or MariaDB, have built-in
    routines, well understood processes, or accepted hacks for resolving split brain
    problems. Filesystems do not.


    In many cases, sysadmins struggle with data reconciliation, give up, and resolve
    the split brain by destroying one copy of the HAST device, re-initializing it,
    and letting HAST resync. They accept a small amount of data loss in the name of
    restoring service.


    Once you''ve reconciled the data differences caused by the split brain, resynchronize
    the two HAST providers. You can''t tell HAST to shuffle bits back and forth until
    the two devices are all caught up with each other. Rather, you must wipe out and
    re-initialize the HAST resource. Put the resource in `init` mode, then rerun the
    `create` command and assign it to the secondary host. forcing a complete resynchronization
    of the backup secondary role. Here I recreate the backup HAST resource hast1.


    ```

    # hastctl role init hast1

    # hastctl create hast1

    # hastctl secondary hast1

    ```


    The primary feeds the secondary everything on the device, restoring integrity.


    But it''s best to manage HAST meticulously and not split the brain in the first
    place.'
  - '[PAGE 146]


    # Commands on HAST Events


    Use the exec keyword to tell HAST to run a command on an event. HAST runs this
    script when the resources change role, at the initial hastd connection between
    hosts, when a hastd peer disconnects, when a secondary resource starts synchronizing
    with the primary, when a resource finishes synchronizing, an interrupted synchronization,
    and when hastd detects a split brain condition. I run the script /usr/local/scripts/hstates.sh
    any time any event happens.


    ```

    exec /usr/local/scripts/hstates.sh

    ```


    You cannot have per-event scripts; one script must handle all of these events.
    HAST gives the script different arguments depending on the event.


    The script runs immediately after the event. You cannot put commands to prepare
    for the event in the switch. For example, having the script export your HAST-ZFS
    pool when the host switches to the resource won’t work—the pool’s back end is
    gone when hastd runs the script! You could have the script import a ZFS pool when
    the host assumes the primary role, however.


    # Script Arguments and Execution


    At a role, hastd runs the command with four arguments: the word role, the resource
    name, the old role, and the new role. Both hosts run the script.


    The synchronization events run the script with the event name (either syncstart,
    syncdone, or syncintr for interruptions) and the resource name. Synchronization
    events only trigger the script on the primary node.


    Finally, in the event of a split brain, the script is run with the argument split-brain
    and the resource name. The script runs on both primary nodes.


    # hastd(8) Scripts


    A hastd script is a set of nested case statements. I recommend starting with a
    simple script on test servers to log these arguments and whenever the script is
    run. Abuse your test servers and see what sort of messages get logged.'
