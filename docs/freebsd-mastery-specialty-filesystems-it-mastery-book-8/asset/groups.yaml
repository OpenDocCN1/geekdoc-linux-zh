    The FreeBSD iSCSI initiator lets you adjust timing, failure, performance, and
    logging behavior boot-time tunables. Although you can read these values through
    sysctl(8), you can only change them in /boot/loader.conf.


    iSCSI log messages normally appear in /var/log/messages. The sysctl kern.iscsi.debug
    enables messages. It defaults to 1, for on. To disable iSCSI logging, set kern.iscsi.debug
    to 0. You will still get messages when you attach and detach drives, but your
