    # Afterword


    While I''m a fan of several different BSD-based operating systems, FreeBSD’s filesystems
    really are a killer feature that offers a flexibility unmatched by any other operating
    system. FreeBSD doesn''t pat you on the head and tell you it knows how your storage
    should work. FreeBSD lets you make your own decisions, and configure storage in
    ways that the developers even conceived of. The specialty filesystems herein,
    combined with tools like GEOM and ZFS, will let you make FreeBSD work almost anywhere,
    under almost conditions, and address problems other operating systems can’t.


    Of all the books I’ve written, this has unexpectedly been among the most difficult.
    Exploring so many different filesystems, all with their own uses and sharp edges,
    has demanded that I fill my brain to overflowing and empty it many times.


    I hope you find this book worthwhile.


    If not, it’s easily recyclable.


