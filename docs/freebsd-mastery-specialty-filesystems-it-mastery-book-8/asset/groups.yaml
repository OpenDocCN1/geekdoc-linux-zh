    # Chapter 2: devfs


    Unix-like operating systems traditionally put the filesystem''s interface to the
    hardware in the /dev directory. The special files in /dev are called device nodes.
    Running commands on the device nodes gives instructions to the hardware. You''ve
    seen device nodes like /dev/da0 or /dev/ada0s, where the device name indicates
    a disk or a partition thereof. You''ll also see device nodes for hardware like
    keyboards (/dev/ukbd0 or /dev/kbd0), serial ports (/dev/cuaa0), and more. You''ll
    also find device nodes for system functions, like the vaguely randomish number
    generator /dev/random, terminal sessions (/dev/tty0), and so on.


    FreeBSD creates and configures these device nodes automatically, using the device
    file devfs(5). With no special configuration, they automatically configure all
    typical system common features and functions. If you do anything different, though,
    you might need to reconfigure devfs(5). A chrooted process that can''t access
    /dev might need a device node for logging, but it certainly doesn''t need access
    to disks or terminals or anything like that. A jail needs access to the device
    nodes for logging in and basic programs, but shouldn''t see any of the host''s
    underlying hardware. These cases, and more, require that the sysadmin reconfigure
    devfs to provide the needed infrastructure.


    FreeBSD breaks device node management into three pieces: configuring devices present
    at boot, configuring devices that appear after boot, and managing device node
    permissions and access control.'
  - '[PAGE 35]


    # Boot-time /dev Configuration


    Sysadmins can change device nodes using normal system tools, changing their ownership
    and permissions. But suppose an unprivileged process needs access to the serial
    terminal /dev/cua1. I would normally add that user to the dialer group, which
    grants access to all the serial ports. If you need tighter control, you can change
    the owner of /dev/cua1 to the unprivileged user. Or perhaps a piece of clunky
    software might need a device node accessible under a different name.


    The problem is, devfs(5) is a logical filesystem. It''s in system memory. When
    you reboot the server, all your manual changes to /dev evaporate. The kernel and
    devfs create a pristine /dev that reflects the initial hardware configuration.


    While the kernel and devfs know how to do their job without any help from you,
    they read /etc/devfs.conf at boot to see if you have any special instructions
    for them. Rules in devfs.conf have the format:


    ```

    action devicename desiredvalue

    The devicename entry is the device node you want to change, while the desiredvalue
    is a new value. Using these rules you can add new device nodes, change their ownership,
    and alter their permissions.

    ```


    Devfs only reads devfs.conf at boot. To make a change take effect immediately,
    change the existing /dev entries. Any time you change devfs.conf, reboot to verify
    the configuration.


    # New Device Nodes


    The link action creates a symlink between a new device node and an existing node.
    This lets you create aliases for existing devices.


    ```

    link cd@ cdrom

    link cd@ acd0

    ```


    Devfs creates two device nodes, /dev/cdrom and /dev/acd0, which point to the CD
    drive at /dev/cd0. Some software expects the CD drive to be at /dev/cdrom, and
    I don''t feel like tweaking those preferences. And for many years, FreeBSD''s
    ATA drives lived at /dev/acd0, and sometimes my fingers revert to that while my
    brain is otherwise occupied.


    # Device Owner


    Change a device node''s owner and group with the own action. Here, we let user
    m1 have absolute control of the CD drive.'
  - '[PAGE 36]


    Many programs that work on device nodes have internal checks to verify that they’re
    running as root before doing anything. I’ve seen more than one program itself
    shut down when it’s not run as root, without even trying to access the target
    device nodes. Changing the device node ownership won’t make those programs work.


    While you can change the owner of a device node alias, that change applies only
    to the symlink, not the target node. Always change the owner of the actual device
    node.


    # Device Permissions


    The mode keyword changes the permissions on a device node. Give the desired permissions
    in octal form.


    ```

    mode cd0 0664

    ```


    This grants read and write access to the owner and group owner of /dev/cd0.


    As with ownership, only change the permissions of the actual device node, not
    any aliases.'
  - '[PAGE 37]


    # Dynamic Hardware


    Devfs dynamically creates device nodes when new hardware gets plugged in, and
    deletes device nodes when the hardware is removed. Much hot-pluggable hardware
    is very simple—when a new USB keyboard appears, FreeBSD attaches it to the console.


    Other hardware requires more complicated configuration. The daemon dev(8) automatically
    runs upland programs when hardware appears, disappears, and changes state. You
    can have, say, FreeBSD automatically run dhclient(8) when you plug in your laptop''s
    Ethernet interface, or change the permissions on a USB-to-serial-port adapter.


    The dev(8) daemon reads its configuration from /etc/devd.conf and any file ending
    in .conf in the directory /usr/local/etc/devd. AS /etc/devd.conf is a system file
    and upgrades it, I strongly recommend your local rules in /usr/local/etc/devd.
    You could use a single file for your rules, but if your rules gets complicated
    using a separate local file for each type of device helps.


    # Devd Rules


    Devatch for four separate types of events: attach, detach, nomatch, and notify.
    Each of these events triggers a rule of that type. It also has an options statement,
    which controls how devd(8) itself behaves.


    Attach rules trigger when hardware matching the rule is attached to the system.
    When you plug in a USB flash drive, an attach rule can mount the device and scan
    for viruses.


    Removing hardware from a system triggers detach rules. The kernel automatically
    notices when you remove hardware and removes the resources from the system, so
    detach rules are uncommon. There''s no need to remove the network configuration
    from a nonexistent interface.


    A nomatch rule triggers when you plug in new hardware that doesn''t match any
    device driver. Generally speaking, hardware without a device driver is unusable.


    The notify rules apply when the kernel senses a matching event notice to upland.
    These messages normally appear in /var/log/messages and on the console. The message
    that a network interface has is a notify event.


    Each rule also has a priority, with 0 being the lowest; devd(8) processes only
    the highest matching rule, skipping any lower-priority matching rules.


    Finally, a rule has a bunch of matching terms, and an action to take. If the matching'
- md: '

    terms match the device, the rule type matches the event, and no higher-priority
    rule has kicked in, devd(8) triggers the specified action.


    Here''s a sample rule.


    ```

    notify  {

    match "system" "IFNET";nmatch "subsystem" "usb[0-9]+";nmatch "type" "ATTACH"

    action "etc/pccard_ether $subsystem start";

    };

    ```


    This is a notify rule, so it activates when the kernel notifies the userland of
    an event. But as a priority 0 rule, it triggers only if no rule of higher priority
    matches the specified criteria.


    The matching terms appear within brackets. For this rule to trigger, the system
    IFNET. The device subsystem must match the regular expression usb[0-9]. This boils
    down to "the device driver can''t start with usbus," which excludes USB devices.
    This rule matches on an ATTACH, or when the kernel notifies userland hardware
    has been attached to the system. In English, this fires when the kernel announces
    that a non-USB network device is plugged in. It''s intended for the removable
    network cards found on older laptops.


    The last line of this rule (other than the brackets) gives an action to take.
    This rule fires up the network configuration script for removable network cards.


    Taken all together, this rule says "When you plug in a removable non-USB network
    card, configure it.".


    ## Match Statements


    You can match any aspect of a device in a devd(8) rule. I''m not going to list
    all the possible matches here, as that would be pages and pages of stuff you''ll
    never use. Read devd.conf(5) for the complete list. In general, though, you can
    match devices by manufacturer, vendor, model, serial number, network interface
    media, parent device, hardware revision, and so on.


    Some rule types permit additional terms. In attach and detach rules, for example,
    you can use device-name as an alias for match device-name. These are optional.


    I could fill this entire book with more examples. The best way to understand devd.conf
    rules is to read the examples in /etc/devd.conf.


    ## Creating devd(8) Rules


    I strongly recommend never writing your devd(8) rules from scratch. Look at /etc/devd.conf.
    Find a rule that does something like what you want. Copy that rule into a .conf
    file in /usr/local/etc/devd. Edit that rule until it does what you want.


    In opinion, the easiest rules to write notify rules. You can read /var/log/messages
    or check the console to see exactly what messages the kernel passes to userland,
    and use them as match terms.


    But easy is boring, so we''ll create a simple attach rule.


    ## Flash Drives


    If I plug in a flash drive, I probably want it mounted on /media. This isn''t
    always true, but it''s common that I''m willing to have it be the default. I''d
    rather manually unmount /media once every ten inserts than manually it nine times
    out of.


    On a simple system with SATA the flash drive probably appears as /dev/dao. On
    a more complex system it might be any device node. Insert the flash drive to see
    where it shows up on your system.


    ```

    attach 10 {

    match "device-name" "umass1"

    action "sleep 2 && mount -t msdos /dev/da4s1 /media";n}

    ```


    Some USB drives need a second or two to wake up when you plug them in, so I added
    the sleep(1) command. You could also call an external script.


    FreeBSD can''t prevent you from removing a mounted drive, but it can complain.
    Here we automatically force unmounting /media when devd(8) detects the device
    removal.


    ```

    detach 10 {

    match "device-name" "umass0"

    action "umount -f /media";n}

    ```


    You don''t have to mount the drive, however. I once had to prepare 40 flash drives
    for a largeFreeNAS deployment. A devd.conf rule and a simple script will tell
    me "when the light stops flashing, put the next one in" so I could return to playing
    FreeCell. If your organization''s operations or security policies say "don''t
    plug USB media into running production servers," a devd.conf rule that calls newfs(8)
    can enforce that. (By the time FreeBSD could newfs, USB''s inherent security flaws
    could have already destroyed your server. Disconnecting USB ports is more secure,
    and leaves more flexibility for future maintenance as filling the ports with superglue.


    ## CARP Failover


    The Common Address Redundancy Protocol (CARP) lets multiple hosts share one IP
    address. When one host dies, another takes over the address, keeping the service
    alive. Some services need a quick kick when failing over. Often you need to tell
    the backup database that it was once the student, it is now the master.


    CARP events generate kernel notifications, which means you can use devd to tell
    the application what''s happening. Here''s a dev.conf configuration to run a script
    when the host takes over as the CARP master.


    ```

    notify 30 {

    match "system"      "CARP"

    match "subsystem"   "[0-9]+@[0-9a-z]+"

    match "type"        "MASTER"

    action "/usr/local/scripts/carp-up";

    }

    ```


