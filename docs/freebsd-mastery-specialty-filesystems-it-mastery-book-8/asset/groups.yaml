    \n```\n# getfacl -q file2\nuser:jkh:rwx--aARWccos:allow\nowner:rwx--aARWccos:allow\n\
    group:rw-p--a-R-C--S:allow\neveryone:@-----a-R-C--S:allow\n```\n\nThese permissions\
