    # FreeBSD Mount Commands


    We normally use the mount command to attach a filesystem to the directory tree.
    Using multiple filesystems changes how you use mount(8).


    The mount command assumes that any local disk partitions use UFS. If you try to
    mount a different filesystem you''ll get an error.


    ```

    # mount /dev/da4s /mnt

    mount: /dev/da4s: Invalid argument

    ```


    The device /dev/da4s exists, but it contains neither a UFS nor a UFS2 filesystem.
    You need to tell mount what kind of filesystem this partition contains. Use either
    the -t command-line argument or a filesystem-specific mount command.


    Every filesystem has a name, listed either in mount(8) or in the filesystem manual
    page. (Every filesystem has a manual page, in section 5). Give the filesystem
    name as an argument with -t.


    ```

    # mount -t msdosfs /dev/da4s /media

    ```


    Many filesystems (but not all) also have a filesystem-specific version of the
    mount command, which you could use instead.


    ```

    # mount_msdosfs /dev/da4s /media

    ```


    If a non-UFS filesystem has an entry in /etc/fstab, mount(8) can mount that filesystem
    by mount point. We''ll see example /etc/fstab entries throughout this book.


    ```

    # mount /media

    ```


    Unmount everything with ummount(8). The filesystem type doesn''t matter. Give
    it a directory with something mounted there, and umount will gleefully disconnect
    it.'
