    # Failures, Startup, and Split Brain


    A HAST pair with only one working node enters the degraded state. If a HAST node
    reboots, the other node sees the HAST device as degraded.


    If the primary node fails, presumably you or the system will switch the secondary
    node to be primary until the other node comes back to life. Or, maybe.


    This uncertainty dictates a key aspect of HAST behavior. While you can start hastd
    on boot, HAST makes no assumptions about the peer state. At system boot, HAST
    devices enter the init state. They’re ready for action, as you tell them how they
    fit into your world.


    ```

    # hastctl status

    Name Status Components

    hast1 init /dev/zvol/zroot/hast1 192.0.2.1

    ```


    You must use hastctl after the system boots to tell each HAST device its role.


    In operation, you’d think that a newly booted HAST server would assume a secondary
    role so that the primary can send all the updates to bring the freshly booted
    device up to date. That would work—except when machines are newly booted. When
    both machines boot simultaneously they’ll sit there, wait for the other to claim
    the primary role, and while into /var/log/messages. You need a way for one node
    to claim the primary role. If you have a log-watching program, you could have
    it promote a preferred node when the relevant log message appears. You could log
    in and manually promote one of the nodes to primary. FreeBSD can automatically
    promote one of the nodes through CARP and devd(8), as discussed in Chapter 10.


    HAST behaves curiously because it is possible to have multiple hosts simultaneously
    claim the primary role, causing a split brain condition. Each host modifies the
    HAST device as it thinks should, and sends updates to the HAST peer. The peer
    doesn’t listen, because it thinks it’s the master. On each copy of the device
    differs. It’s your job to figure out how to resolve those differences.


    If software can readily examine the data on the HAST devices—say, if ls(1) displays
    what you need to know—you could programmatically resolve the difference by shell
    scripting. If they’re more complex records, such as a database or logs, you’ll
    need to'
- md: "\nanalyze the data itself to capture and reconcile the changes. How do you\
    \ do? That depends entirely on the data.\n\nThe split brain issue is why I recommend\
    \ not using HAST as database storage backend. Clustered databases like PostgreSQL,\
    \ and even MySQL or MariaDB, have built-in routines, well understood processes,\
    \ or accepted hacks for resolving split brain problems. Filesystems do not.\n\n\
    In many cases, sysadmins struggle with data reconciliation, give up, and resolve\
    \ the split brain by destroying one copy of the HAST device, re-initializing it,\
    \ and letting HAST resync. They accept a small amount of data loss in the name\
    \ of restoring service.\n\nOnce you've reconciled the data differences caused\
    \ by the split brain, resynchronize the two HAST providers. You can't tell HAST\
    \ to shuffle bits back and forth until the two devices are all caught up with\
    \ each other. Rather, you must wipe out and re-initialize the HAST resource. Put\
    \ the resource in `init` mode, then rerun the `create` command and assign it to\
    \ the secondary host. forcing a complete resynchronization of the backup secondary\
    \ role. Here I recreate the backup HAST resource hast1.\n\n```\n# hastctl role\
    \ init hast1\n# hastctl create hast1\n# hastctl secondary hast1\n```\n\nThe primary\
    \ feeds the secondary everything on the device, restoring integrity.\n\nBut it's\
    \ best to manage HAST meticulously and not split the brain in the first place.\n\
    \n## Commands on HAST Events\n\nUse the exec keyword to tell HAST to run a command\
    \ on an event. HAST runs this script when the resources change role, at the initial\
    \ hastd connection between hosts, when a hastd peer disconnects, when a secondary\
    \ resource starts synchronizing with the primary, when a resource finishes synchronizing,\
    \ an interrupted synchronization, and when hastd detects a split brain condition.\
    \ I run the script /usr/local/scripts/hstates.sh any time any event happens.\n\
    \n```\nexec /usr/local/scripts/hstates.sh\n```\n\nYou cannot have per-event scripts;\
    \ one script must handle all of these events. HAST gives the script different\
    \ arguments depending on the event.\n\nThe script runs immediately after the event.\
    \ You cannot put commands to prepare for the event in the switch. For example,\
    \ having the script export your HAST-ZFS pool when the host switches to the resource\
    \ won’t work—the pool’s back end is gone when hastd runs the script! You could\
    \ have the script import a ZFS pool when the host assumes the primary role, however.\n\
    \n## Script Arguments and Execution\n\nAt a role, hastd runs the command with\
    \ four arguments: the word role, the resource name, the old role, and the new\
    \ role. Both hosts run the script.\n\nThe synchronization events run the script\
    \ with the event name (either syncstart, syncdone, or syncintr for interruptions)\
    \ and the resource name. Synchronization events only trigger the script on the\
    \ primary node.\n\nFinally, in the event of a split brain, the script is run with\
    \ the argument split-brain and the resource name. The script runs on both primary\
    \ nodes.\n\n## hastd(8) Scripts\n\nA hastd script is a set of nested case statements.\
    \ I recommend starting with a simple script on test servers to log these arguments\
    \ and whenever the script is run. Abuse your test servers and see what sort of\
    \ messages get logged.\n\n```\n#!/bin/sh\nlogger hastd: $1 $2 $3 $4\n```\n\nHere\
    \ I use the script for two functions. First, it mails the server’s root account²\
    \ whenever HAST resource starts synchronizing. Ideally, you’d replace the email\
    \ with an SNMP trap or another call to the monitoring system. Theoretically, HAST\
    \ resources should always be synchronized. A deliberate sync is a hint that something\
    \ is wrong with the connection between the two hosts. (You’ll also see synchronization\
    \ whenever the two hosts switch roles, so this notification does double duty.)\
    \ Secondly, it imports a ZFS pool named after the resource. That is, when this\
    \ host becomes primary for the HAST resource shared1, it then imports a ZFS pool\
    \ also shared1. You could also start processes here. Last, all events get logged.\n\
    \n```\n#!/bin/sh\n```\n\n```\nHOSTNAME=$(hostname)\n```\n\n```\ncase $1 in\n \
    \ case $4 in\n    primary)\n      sleep 3\n      zpool import -f $2\n      logger\
    \ \"importing pool $2\"\n      # start your programs here\n      ;;\n  *)\n  \
    \    ;\nesac\n```\n\n```\nsyncstart())\n  mail -s \"sync started for $2 on $HOSTNAME\
    \ root <<EOF\nHAST sync started, what happened?\nEOF\n*)\n  ;\n```\n\n```\nlogger\
    \ hastd event: $1 $2 $3 $4\n```\n\nAdd other cases as needed for your environment.\n\
    \nNote that the script waits three seconds between becoming the master node and\
    \ importing the ZFS pool. HAST needs a little bit of time to perform the switch\
    \ and verify everything is caught up. If you have a large HAST device, test the\
    \ switch and adjust the timing as needed.\n\nIf you're using UFS on HAST, you\
    \ can replace the zpool import with a call to `fsck` and a mount command. Giving\
    \ the mount point and the HAST resource the same name will simplify your script.\n\
    \nThe `hast.conf(5), hastd(8), and hastctl(8) manual pages have even more on configuring\
    \ and using HAST. To see how to automatically switch the primary device when a\
    \ host fails, however, read the next chapter.\n\n> ^1 I am not aware of any circumstances\
    \ in which you would need to disable HAST compression, but I have faith you can\
    \ find it.\n\n> ^2 Your server is configured to send mail to a human being with\
    \ the job.\n"
