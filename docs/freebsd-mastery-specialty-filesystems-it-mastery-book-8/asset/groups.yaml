    directory. By denying privilege, you make the files within a directory non-deletable.


    The delete (d) privilege controls a principal''s ability to remove a file. Normally,
    this comes along with the ability to write to the file, and so it''s not generally
    granted. Use delete when you want to override delete_child on a specific file
    in a directory.


    So, a directory can declare all of the files in it immovable, except for files
    specifically marked removable. Any user that can change the ACL on the file can
    add the delete privilege, so you''ll need to block that access as well if you
    want files to be immovable.


    This sort of thing is why so many sysadmins drink.


    ## Other Permissions


    These two permissions don''t really fit in anywhere else.


    The execute (x) permission lets the user run the file as a program or open a directory.
    It''s the same as assigning the execute bit with chmod(8). I would still encourage
    you to manage access to a program with groups rather than individuals, but using
    an ACL will let you multiple groups execute permission. Just as with chmod(8),
    denying execute permission on an interpreted script (such as a shell or Perl script)
    doesn''t prevent the user from running the script by calling it as an argument
    to the interpreter. You can disallow someone from running /home/mwl/script.sh,
    but if they can read the file, they can run /bin/sh /home/mwl/script.sh.


    The synchronize (s) permission is ignored on FreeBSD and OpenSolaris-derived systems.
    It lets a file be accessed synchronously at the server and at the client simultaneously,
    which happens anyway as part of the filesystem.


    ## Permission Sets


    Some of permissions make sense to be granted or revoked en masse. If a user should
    be able to write to a file, you''ll want him to have all the privileges. Reading
    a file without errors the ability to see the file metadata. That''s where the
    permission sets come in. Permission sets have no single-character representations.


    The full_set includes all permissions. The principal is allowed or denied access
    to everything.


    The modify_set grants the principal everything except write_acl and write_owner.
    He cannot change file ownership or the ACL on the file, but he can modify it any
    other way.


    The `read_set` gives the principal ability to read the file, its metadata, ACL,
    and any extended attributes.


    Finally, `write_set` lets the user write to the file, its metadata, and its extended
    attributes, but not its ACL.


    ## Implicit ACEs for Owner


    The file owner always gets the rights `read_acl`, `write_acl`, `read_attributes`,
    and `write_attributes`, even if they don’t appear in any ACE in the ACL. Users
    cannot lock themselves out of their own files—that takes a sysadmin.


    ## Setting ACLs


    Now that you have some idea what these ACL privileges mean, let''s apply some.
    Use setfacl(8) to edit ACLs.


    ACE order is crucial in interpreting ACLs, as discussed in “ACL Ordering and Deny”
    later this chapter. Many changes require that you pick a spot to insert a new
    ACE, or pick the number of ACE you want to remove. ACES in an ACL are numbered
    starting with 0, just like chapters in this book.


    ## Adding ACES


    Use the -a flag to add an Access Control Entry to an ACL. This flag takes two
    arguments: the rule number where you want this ACE inserted and the ACE itself.
    You can give multiple ACES, separated by commas. Multiple Aces will be inserted
    in the order you give. Then have the file to be changed.


