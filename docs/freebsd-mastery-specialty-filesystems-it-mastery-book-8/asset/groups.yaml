    # Acknowledgements


    I planned to spend six weeks writing this book. Six months later, when I finally
    typed the last words, I looked back at the plan and laughed maniacally. FreeBSD
    has an incredible variety of special-purpose filesystems, and getting a handle
    on them took far longer than expected (mainly because I''m not as smart or efficient
    as I think I). Some of these filesystems will solve problems you never knew you
    had. Some of them will make you glad you don''t have the problems these filesystems
    solve.


    As overdue as this book is, it would have been completely impossible without all
