  - '[PAGE 139]


    the data makes it to disk. The writes must leave the primary node, traverse the
    network, pass through the secondary node, and get on the secondary node''s disk
    before the application can move on. If your data is critical, you probably want
    fast disk hardware and fullync mode.


    Memsync is faster than fullync, but increases risk. If the secondary node fails
    at exactly the wrong moment, that data won''t get to disk. If the primary node
    fails while the secondary node is rebooting, that data might be entirely lost
    on both nodes. HAST exists below the filesystem, data might corrupt the filesystem.
    When I truly need redundant block device storage on multiple machines, I use fullync
    mode. If my application can''t take the small performance hit, I reconsider your
    decision.


    HAST also has async mode, where it acknowledges data as soon as it''s written
    to the primary node''s disk. The data will be sent to the secondary node, and
    get written to the disk there, but the program won''t wait for that. Async mode
    dramatically increases the risk of data loss, as the primary node might fail before
    the secondary node receives data.


    Every time I''ve used async mode, I''ve regretted it. The only time you should
    consider async mode is if the secondary node is so far away from the primary that
    the speed of light induces unacceptable latency. Even then, I would encourage
    re-architecting your application rather than using async mode.


    Set the replication mode with the *replication* keyword and the desired value.


    ```

    replication fullync

    ```


    Replication mode is only one way to manage integrity, though.


    # Checksum


    HAST can calculate a checksum for each chunk of data, and transmit that checksum
    with the data. The secondary host uses checksum to verify that the data it writes
    to disk is the same as the data the primary host sent.


    The HAST checksum is not intended for protection against a malicious attacker.
    Both the checksum and the data are transmitted in plain text on the same wire.
    An intruder who can alter data can also alter the checksum to match. Checksums
    are useful for detecting transmission errors, however, HAST supports CRC32 and
    SHA256 checksums.


    Set the checksum with the *checksum* keyword.


    ```

    checksum sha256

    ```'
  - '[PAGE 140]


    I always use a checksum in production. Most modern systems have processing power
    that far exceeds their disk or network throughput. Calculating SHA256 checksums
    requires more processing power than calculating the CRC32 checksums. The CRC32
    checksum is perfectly adequate to catch the common sorts of bit errors you''ll
    encounter. Personally, I’m still a SHA256 bigot.


    By default, HAST does not use any checksums. You must enable them if you want
    them.


    # Compression


    Compression exchanges processor time for network bandwidth. If you have a lot
    of disk writes, compressing them can reduce the amount of bandwidth HAST requires
    so that it will actually fit on your network. Use the *compression* keyword to
    set a compression method.


    HAST defaults to *hole* compression, which means that only blocks made up of zeros
    get compressed. Compression vastly accelerates resource initialization, as a brand-new
    disk device contains only zeros. It doesn''t do much for day-to-day performance,
    however.


    If you want to routinely compress data, HAST supports the *lzf* compression algorithm.
    LZF gets used in many places, including in ZFS. Compression won''t hurt, but it
    doesn''t help as much as you might. Enabling LZF in HAST when you have LZF compression
    on the ZFS filesystem on top of the HAST device won''t do you much.


    You can also completely disable compression with the *none* option.¹


    ```

    lzf

    ```


    I normally use LZF, because when compression doesn''t help it will hurt.


    # Metadata Flushing


    Hard drive write caches can make the hardware put data on disk out of order. HAST
    might tell the drive to write block A and then block B, but the write cache can
    get in the middle and decide to write block B first. If block B requires block
    A, though, and the system fails between writing the two blocks, the hardware has
    corrupted your filesystem. This is most common with metadata.


    The *metadataflush* option tells `hast` to automatically flush the write cache
    after every metadata update. HAST normally flushes the write cache after updating
    metadata. If the hardware doesn’t support write cache flushing, though, HAST stops
    trying to flush it.'
  - '[PAGE 141]


    I''m not aware of any time you would want to set metaflush to off. I only bring
    up this option to encourage you to buy good hard drives that support write cache
    flushing.'
  - '[PAGE 142]


    # HAST Networking


    You can control how HAST listens to the network, where it sends connections, and
    the source address binds to for outgoing connections.


    The listen keyword tells hastd what address to bind to for incoming connections.
    This is the IP address and port where the secondary host listens for updates,
    and where the primary listens for acknowledgments. HAST defaults to listening
    to TCP port 8457 on all available IP addresses and interfaces.


    You can choose the listen option globally, or in a special per-server section
    of hast.conf. Here I lock hast down to one IP address on each of my hosts.


    ```

    on www1 {

    listen 192.0.2.1

    }


    on www2 {

    listen 192.0.2.2

    }

    ```


    You can change IPv6 addresses as well, of course. And you can change the port
    by specifying the new port with a colon and the port number.


    ```

    listen 192.0.2.1:8888

    ```


    If you use the listen keyword globally, you''re saying that all hosts listen to
    the stated IP address. The whole point of IP addresses is that they’re unique
    to a machine. A global listen keyword is only useful to change the TCP port hastd
    uses when your hosts'' hastd attaches to all available IP addresses.


    ```

    listen 0.0.0.0:80

    ```


    I encourage you to create per-host entries and limit the number of addresses hastd
    listens on.


    Each node entry for each resource, you can control the address of the remote peer
    and send to that peer. We’ve already seen the remote keyword, a necessary part
    of any HAST configuration. The source keyword goes next to remote, and lets you
    dictate the source port for outgoing connections to that peer.


    ```

    on www1 {

    local /dev/zvol/zroot/hast1

    remote 192.0.2.2

    ```'
  - '[PAGE 143]


    ```

    source 192.0.2.1

    }


    ```


    You would need to use source if your host has multiple IP addresses on that subnet
    and the remote peer uses packet filtering to restrict connections to hastd.'
