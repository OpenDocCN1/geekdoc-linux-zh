  - '[PAGE 54]


    # Chapter 4: Rearranging Filesystems


    Sometimes you''ll find that your filesystem isn''t laid out as you''d like


    Null mounts and union mounts are counterintuitive to many, and best understood
    by example.'
  - '[PAGE 55]


    # Null Mounts


    A null mount, sometimes called a loopback mount, adds a second way to access part
    of an existing filesystem. You might take /usr/home and also make it available
    at /home, or make /media accessible as /usr/src. Most mount commands work on partitions
    or disk images. Null mounts work on any directory. Create null mounts with mount_nullfs(8).


    While you can do similar tricks with symlinks, commands that use the working path
    or use the system calls getwd(3) or getcwd(3) expose the non-symlinked path. With
    a null mount, this software sees the null mount path. Null mounts work with both
    UFS and ZFS. Users don''t care so much about the true path, but applications like
    chroot(8) and jails certainly do. A null mount can let share a read-only tree
    among many jails on a system.


    Understanding how null mounts change behavior is easiest through example. My test
    machine puts home directories at /home. FreeBSD''s installer puts home directories
    under /usr/home. Here I use a null mount to make user home directories available
    in both locations. Let’s start by using a symlink.


    ```

    # cd /usr

    # ln -s /home

    ```


    I can now access my home directory in both locations.


    ```

    # cd /usr/home/mw1

    # pwd

    /home/mw1

    ```


    The pwd(1) command understands that I''m in a directory tree that''s rooted in
    /home, even if I got there going to /usr/home/mw1.


    Remove the symlink, and replace it with a null mount. The mount_nullfs(8) command
    takes two arguments: the existing directory tree, then the point where you want
    it to be mounted.


    ```

    # mount_nullfs /home /usr/home

    ```


    What impact does this have on users? I can now go to either /usr/home/mw1 Or /home/mw1
    and reach the same directory, just like with a symlink. Now that I’m using a null
    mount, the pwd(1) command shows my actual location.


    ```

    # cd /usr/home/mw1

    # pwd

    /usr/home/mw1

    ```


    While the real filesystem is rooted in /home, pwd(1) saw only the null mount.'
  - '[PAGE 56]


    Many of us have closed-source programs or unfamiliar scripts with hard-coded paths.
    A null mount can keep that software working even as you move filesystems around
    your server.


    You can use standard mount(8) options with mount_nullfs(8). Use -o on the command
    line and, separated by commas.


    ```

    # mount_nullfs -o ro /home /usr/home

    ```


    The -o ro option makes the null mount read-only. You can now edit your files under
    /home, but the copy under /usr/home is read-only. This particular example will
    really tick people off, so you probably shouldn''t do that. But it might make
    sense to mount a filesystem noexec nosuid, depending on your use case. While noatime
    and async might sound sensible for your use case, they have no effect in null
    mounts.


    You can perform null mounts automatically at boot with an /etc/fstab


    ```

    /home /usr/home nullfs rw, noatime

    ```


    If you decide to get into filesystem programming, null mounts are a great place
    to start. They contain the bare bones of a filesystem implementation. See mount_nullfs(8)
    details.'
  - '[PAGE 57]


    # Union Mounts


    All FreeBSD file systems are stackable, which means you can mount one another.

    Users can only see the filesystem on top. Again, this is better demonstrated explained.


    Suppose the directory /usr/src contains the FreeBSD source code. Here I mount
    an unused, brand-new filesystem at /usr/src.


    ```

    # mount /dev/ad01 /usr/src/

    ```


    The /usr/src directory now appears empty. I''ve stacked the new filesystem above
    the old. The original /usr/src is still on the disk, but nobody can see it. Unmounting
    the empty partition reveals the code.


    A union mount lets users see the contents of both filesystems simultaneously,
    in the same location. If I mount a filesystem above /usr/src and run ls(1), I''ll
    see the contents of both filesystems.


    Perform union mounts with mount_unionfs(8). The first argument is the filesystem
    that gets mounted on; the second, the mount point and lower filesystem. Here''s
    a rather messy but illustrative demonstration.


    ```

    # mount_unionfs /home/mwl/usr/src/

    ```


    I''ve mounted my home directory above the source code. The /usr/src directory
    now contains everything that was in /usr/src before, plus everything that was
    in my home directory. So there''s /usr/src/UPDATING and /usr/src/.cshrc.


    I will never find anything again.


    Union mounts work with ZFS and UFS, but not simultaneously. You can union mount
    a UFS partition over another UFS partition, or a ZFS dataset over another ZFS
    dataset. Union mounting over ZFS or vice-versa appears to work, until you try
    to view or change the union-mounted data.


    Union mounts have a bad reputation. The union mount feature was completely rewritten
    for FreeBSD 7.0, and it''s more reliable than it was once. The mount_unionfs(8)
    manual page contains big scary warnings. The common cases, such as typical jail
    deployments, work fairly well and are widely deployed. Union mounts still do many
    things filesystem developers consider worrisome to awful, however. If you plan
    to use union mounts in a novel manner, test your system very carefully before
    deploying.'
- md: '

    ## Upper and Lower Layers


    When you query the filesystem, FreeBSD checks the upper layer first. If that fails,
    the query fails through to the lower level. Whenever you wonder why a union mount
    behaves the way it does, fall back to this fact.


    Created files go in the top layer. With a union mount of /home/mwl over /usr/src,
    if I create a file /usr/src/test, all files appear in the filesystem on top—/home/mwl.
    If I unmount the union, the file /usr/src/test disappears with my .cshrc and all
    other personal files.


    Changed files also go in the top layer. If I edit /usr/src/Makefile to the top
    layer, creating /home/mwl/Makefile. The edits go to the upper layer. When I disconnect
    the union mount, the original /usr/src/Makefile is unchanged and the edited version
    appears in /home/mwl.


    When a file in each filesystem has the same name, the top version is visible in
    the union mount. If I had /usr/src/UPDATE and /home/mwl/UPATING, in this union
    mount you''d see only the version in my home directory.


    The most common use for union mounts is jails. I''ll use a jail example through
    the rest of this section. I''ve placed a basic FreeBSD install in /jars/basejail.
    I want to use it as the bottom layer for /jars/jail1, /jars/jail2, and so on.
    These individual jails start off empty.


    The mount_unionfs(8) command uses the first argument as the upper layer and the
    second argument as its bottom layer and the mount point. We need exactly the opposite
    behavior for reusing a read-only directory tree, however. The layer with FreeBSD
    needs to go on the bottom, so any changes go into the top layer. We must use the
    top layer''s mount point, however. Use the -o below mount option to achieve this.


    ```

    # mount_unionfs -o /jars/basejail /jars/jail1

    ```


    The rest of this section discusses the behavior of union mounts with this configuration.


    ## atime and Union Mounts


    You''ll quickly notice that the upper layer acquires a directory hierarchy. Reading
    a directory updates the atime (access time). When you go into /jars/jail1 and
    ls /usr/bin, a /usr/bin directory appears in the upper layer. The directories
    in the upper layer have the correct atime for the union mount, while the lower
    layer keeps its own correct atime. These are called shadow directories.


    Shadow directories can confuse you. Suppose you go to the lower layer and move
    /var/log/httpd/ to /var/log/httpd-old. The union mount will still have a /var/log/httpd
    directory, because the shadow directory still exists. You''d need to delete that
    directory separately.


    Most jails and virtual hosts don''t need atime on their filesystem. You can disable
    atime in a union mount without disabling it in the lower filesystem using the
    noatime mount option.


    ```

    # mount_unionfs -o below,noatime /jails/basejail /jails/jail1

    ```


    I have one virtual machine that requires atime, but that''s because I read mail
    locally on the machine. Web, database, and application servers generally don''t
    require it.


    ## Deleting and Renaming Files


    Removing files from a union mount behaves differently depending on the underlying
    filesystem.


    A union mount on top of ZFS will not let you delete or rename files from the lower
    layer, as ZFS lacks whiteout support. The rm(1) command appears to work, but actually
    fails silently. If you try to move a file with mv(1), you''ll create a duplicate
    of the file.


    For most applications, an inability to change the lower layer is a benefit rather
    than a problem. If you''re using one FreeBSD installation beneath dozens of jails,
    you don''t want any of those jails to change the underlying installation.


    UFS supports whiteouts, which allow a union mount''s upper layer to hide a file
    in the lower layer. Removing a file from the lower layer of a UFS-backed union
    mount actually creates a new file in the upper layer of the same name but with
    inode 1. Node 1, by definition, is not part of any file. If a file contains inode
    1, it doesn''t exist. The lower layer''s copy of the file is hidden, not removed.


    Whiteouts mean files can be deleted. The -w flag to rm(1) attempts to undelete.


    ```

    # mount_unionfs -o /jars/basejail /jars/jail1

    ```


    The rest of this section discusses the behavior of union mounts with this configuration.

    '
  mdcn: '


    ## 上层与下层


    当你查询文件系统时，FreeBSD 会首先检查上层。如果检查失败，查询将向下传递到下层。每当你疑惑联合挂载（union mount）的行为为何是这样时，请记住这个事实。


    创建的文件会存储在顶层。如果将 `/home/mwl` 联合挂载到 `/usr/src` 之上，如果我创建一个文件 `/usr/src/test`，那么所有文件都会出现在顶层文件系统——即
    `/home/mwl`中。如果我卸载该联合挂载，文件 `/usr/src/test` 会随着我的 `.cshrc` 以及所有其他个人文件一起消失。


    修改的文件也会存储在顶层。如果我编辑 `/usr/src/Makefile` 到顶层，就会创建 `/home/mwl/Makefile`。这些修改会进入上层。当我断开联合挂载时，原始的
    `/usr/src/Makefile` 保持不变，而修改后的版本出现在 `/home/mwl` 中。


    当每个文件系统中的文件具有相同名称时，联合挂载中只显示顶层版本。如果我有 `/usr/src/UPDATE` 和 `/home/mwl/UPATING`，在这个联合挂载中，你只会看到我主目录下的版本。


    联合挂载最常见的用途是 jail（监狱）。在本节的剩余部分中，我将使用一个 jail 示例。我将一个基础 FreeBSD 安装放置在 `/jars/basejail`
    中。我希望将其用作 `/jars/jail1`、`/jars/jail2` 等的底层。这些独立的 jail 初始状态都是空的。


    `mount_unionfs(8)` 命令将第一个参数用作上层，将第二个参数用作下底层和挂载点。然而，对于复用只读目录树，我们需要恰好相反的行为。包含 FreeBSD
    的层必须位于底部，这样任何更改都会进入上层。但我们必须使用上层的挂载点。请使用下面的 `-o` 挂载选项来实现。


    ```

    # mount_unionfs -o /jars/basejail /jars/jail1

    ```


    本节的剩余部分将讨论在此配置下联合挂载的行为。


    ## atime 与联合挂载


    你会很快注意到上层获得了一个目录层次结构。读取目录会更新 `atime`（访问时间）。当你进入 `/jars/jail1` 并执行 `ls /usr/bin`
    时，上层中会出现一个 `/usr/bin` 目录。上层中的目录具有联合挂载正确的 `atime`，而下层则保留其自身的正确 `atime`。这些被称为影子目录（shadow
    directories）。


    影子目录可能会让你困惑。假设你进入下层并将 `/var/log/httpd/` 移动到 `/var/log/httpd-old`。联合挂载仍然会有一个 `/var/log/httpd`
    目录，因为影子目录仍然存在。你需要单独删除该目录。


    大多数 jail 和虚拟主机进程文件系统不需要 `atime`。你可以使用 `noatime` 挂载选项在不禁用底层文件系统 atime 的情况下，在联合挂载中禁用
    `atime`。


    ```

    # mount_unionfs -o below,noatime /jails/basejail /jails/jail1

    ```


    我有一个虚拟机需要 `atime`，但那是因为我在机器本地读取邮件。Web、数据库和应用程序服务器通常不需要它。


    ## 删除和重命名文件


    从联合挂载中删除文件的行为取决于底层文件系统。


    在 ZFS 之上的联合挂载不会让你删除或重命名下层中的文件，因为 ZFS 缺乏白出（whiteout）支持。`rm(1)` 命令似乎可以工作，但实际上是静默失败了。如果你尝试用
    `mv(1)` 移动文件，将创建一个该文件的副本。


    对于大多数应用程序来说，无法更改底层是一个优势而非问题。如果你在几十个 jail 之下使用一个 FreeBSD 安装，你不希望其中任何一个 jail 更改底层的安装。


    UFS 支持白出，这允许联合挂载的上层隐藏下层中的文件。在基于 UFS 的联合挂载中，从下层删除文件实际上是在相同的上层中创建一个同名但 inode 为 1
    的新文件。根据定义，节点 1 不属于任何文件。如果一个文件包含 inode 1，那么它是不存在的。下层的文件副本被隐藏了，而不是被删除了。


    有了白出意味着文件可以被删除。`rm(1)` 的 `-w` 标志尝试恢复删除。


    ```

    # mount_unionfs -o /jars/basejail /jars/jail1

    ```


    本节的剩余部分将讨论在此配置下联合挂载的行为。


    '
