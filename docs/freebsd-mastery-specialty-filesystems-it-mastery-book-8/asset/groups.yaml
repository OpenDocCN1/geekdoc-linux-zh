    noauto special map, privileged users can mount the device.


    There''s a commented-out entry for -noauto filesystems in /etc/auto_master. Uncomment

    it and run automount to activate it.


    The noauto special map has no mount options. The sysadmin presumably configures

    mount options in /etc/fstab. Sensible options for an NFS share don''t really apply
    to a

    CD drive. Here are a couple of common entries that might appear in a filesystem
    table.


    ```

    /dev/cd0 /cdrom dc9660 ro, noauto 0 0

    mail:/usr/ports /usr/ports nfs rw, tcp,soft,intr,noauto 0 0

