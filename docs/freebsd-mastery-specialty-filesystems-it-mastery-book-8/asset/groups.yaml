  - '[PAGE 108]


    # iSCSI Target Authentication


    You probably don''t want any random yahoo to connect to your iSCSI devices, even
    if you''re inside your organization’s security perimeter. Even if you trust everyone
    you work with, we''ve all had those moments when we hit ENTER and abruptly realize
    we''ve just ruined everything. Requiring authentication to access remote disks
    helps prevent daft mistakes.


    iSCSI supports the Challenge Handshake Authentication Protocol, or CHAP, for username
    and password authentication. The iSCSI protocol uses two types of CHAP: plain
    old CHAP and mutual CHAP.


    With standard CHAP, a username and password are required to access an iSCSI client.
    Clients must provide valid credentials to access an iSCSI target.


    Mutual CHAP assigns usernames and passwords to both the iSCSI target and the initiator.
    With mutual CHAP, the initiator presents its own username and password and demands
    the target''s username and password in return. Mutual CHAP might seem overkill
    in your environment, but authenticating both initiators and targets reduces accidents
    and can detect both misconfigurations and security incidents. If your iSCSI target
    suddenly forgets its own username and password, something is very wrong!


    An iSCSI user''s password is called a secret. Secrets are normally stored in plain
    text in configuration files. There are legitimate reasons for multiple people
    to have access to an iSCSI secret, so they aren''t stored as hashes like passwords.
    Unlike passwords, you''ll type an iSCSI secret only rarely—usually you copy and
    paste them. While the example secrets in this book are short and easily remembered,
    CHAP secrets should be at least 12 characters long and contain many sorts of different
    characters.


    Configure authentication in `ctl.conf`, through authentication groups.


    # Authentication Groups


    Multiple initiators connecting to a single target shouldn''t all use the same
    username and secret. FreeBSD uses authentication groups to create collections
    of usernames and secrets. You assign an authentication group to a target, effectively
    saying “these users can connect to this.” While you can assign authentication
    information on a per-target basis, authentication groups let you reuse authentication
    across multiple portals and targets.


    Authentication groups start with the string `auth-group` and a name. Each authentication
    group needs a unique name. Here I define an authentication group, `db`, with two
    valid'
  - '[PAGE 109]


    ```

    usernames.

    auth-group db {

    chap bugs daffy

    chap pinky binary

    }

    ```


    Yes, usernames and passwords are stored in plain text, in a text file. That''s
    why /etc/ctl.conf needs not to be world-readable. Only users who should have access
    to the host''s iSCSI secrets should be read by the file.


    Each target needs an authentication group, set by the auth-group keyword. Portals,
    similarly, require an authentication group for discovery, defined by the discovery-auth-group
    keyword.


    Each authentication group can only contain one type of credentials. You cannot
    mix CHAP and mutual CHAP in one authentication group.


    The ctld(8) daemon always creates, but does not necessarily use, the authentication
    group no-authentication. This group lets anyone connect to a target without authenticating.
    Similarly, the authentication group default prevents anyone from authenticating
    to the target. Configure any other authentication groups yourself.


    # CHAP Authentication


    To define CHAP users, use the string chap, a username, and the user''s secret.
    Here I define the user pepe and the secret penelope.


    CHAP user definitions must go inside an auth-group or target statement, as shown
    under “Authentication Groups” above.


    Do not combine CHAP and mutual CHAP statements in a single auth group.


    # Mutual CHAP Authentication


    Configuring mutual CHAP requires two usernames, each with their own secret. Use
    the chap-mutual keyword.


    Here the initiator has username mickey and the password minnie. The target has
    the username donald and the password goofy.


    Your secrets should be 12 characters or longer and far more complex than these
    examples.'
  - '[PAGE 110]


    As with a standard CHAP statement, mutual CHAP can only be defined inside an authentication
    group or a target. You cannot combine chap and chap-mutual statements in a single
    group.


    # Restricting Initiators


    In addition to requiring a username and password to access a target, you can also
    restrict which initiators can connect to which targets by using the initiator
    name and IP address.


    Use the initiator-name keyword to define initiator names that can connect in an
    authentication group. If you have multiple permitted initiators, list each initiator
    name on its own line. Here I require the initiator to use the name I created earlier
    in this chapter, as well as similar initiator names.


    ```

    auth-group db {

    chap bugs daffy

    initiator-name iqn.2013-11.io:mwl:host1

    initiator-name iqn.2013-11.io:mwl:host2

    initiator-name iqn.2013-11.io:mwl:host987

    }

    ```


    Most software configuration can set the initiator name, so restricting initiator
    names isn''t a security measure. If someone has the target''s CHAP username and
    secret, they can probably capture the initiator name as well. It''s more of a
    way to specifically to prevent problems caused by human error.


    Restricting initiators by IP address is probably more effective. Use the initiator-portal
    keyword and the permitted IP address or network block. If you have multiple IP
    blocks, list each on its own line with its initiator-portal keyword.


    ```

    auth-group db {

    chap bugs daffy

    initiator-name iqn.2013-11.io:mwl:host1

    initiator-portal 203.0.113.0/24

    initiator-portal [2001:db8:bad:ce::]/64

    initiator-portal 192.0.2.87

    }

    ```


    While restricting connections by IP address is probably more secure than limiting
    initiator names, it still doesn''t replace firewalls or packet filters. You really
    need a network access control device between your targets and the public Internet.


    Restrictions by IP or initiator name are usable only in addition to other authentication
    methods. You must either use some sort of CHAP or specifically allow access without
    authentication.'
  - "[PAGE 111]\n\n# Portal Groups\n\nA portal group is the glue attaching iSCSI targets\
    \ to an IP address. It also lets you set the authentication needed for discovery.\n\
    \n# Portal Address\n\nWhile your iSCSI server might listen on all addresses on\
    \ the system, sometimes you want specific targets available only on particular\
    \ IP addresses. Use the listen keyword and an IP address.\n\n```\nportal-group\
    \ group {\n  discovery-auth-group db\n  listen 192.0.2.1\n  listen [2001:db8::ace]\n\
    }\n```\n\nThis is useful for, migration situations. Imagine your iSCSI load has\
    \ hit a point where you need to split the server into two hosts. Add a second\
    \ IP address to the host. Configure half of your hosts to use the new IP as their\
    \ iSCSI target. On migration day, move the new IP to the new host and plug the\
    \ associated SCSI shelf into the new server.\n\n# Discovery Authentication\n\n\
    Use the discovery-auth-group keyword to attach one and only one authentication\
    \ group to the portal group. When an initiator queries the portal to learn which\
    \ resources are available, the portal will require a username and secret before\
    \ sending any information."
  - "[PAGE 112]\n\n# Targets\n\nTargets are where you attach on-disk storage to the\
    \ iSCSI service. In addition to the back end storage, you can assign authentication\
    \ credentials, aliases, and LUNs.\n\nEach target starts with the target keyword\
    \ and the target's iSCSI name. A working, useful target must contain an authentication\
    \ configuration, a portal group, and at least one Lun. (You can write a ctl.conf\
    \ entry that lacks some of these, but it won't be useful.)\n\n# Target Authentication\n\
    \nThe simplest (and, in opinion, best) way to configure authentication for a target\
    \ is to use an authentication group, abstracting the authentication away from\
    \ the target itself. The auth-keyword tells the target to pull in an authentication\
    \ configuration from a previously defined group.\n\n```\ntarget iqn.2013-11.io.mwl:target@\n\
    \  auth-group databases\n\n...\n```\n\nYou can configure authentication information\
    \ directly within the target, however. Use the auth-keyword to define the type\
    \ of authentication needed to access this target. You can use either chap or chap-mutual,\
    \ meaning that you get to set usernames and secrets later in this target. If set\
    \ to deny, nobody can authenticate to this target. Finally, none tells the target\
    \ that it doesn't require authentication (but it might have other restrictions).\n\
    \nThe chap and chap-mutual keywords work inside a target definition exactly as\
    \ they do in an authentication group. You can use only one type of authentication\
    \ for each target—that is, you't set auth-type chap and then have a chap-mutual\
    \ statement.\n\n```\ntarget iqn.2013-11.io.mwl:target@\n  auth-type chap\n  chap\
    \ dbuser dbsecret\n```\n\nA target can include only one type of username and secret\
    \ authentication—either auth-group, chap or chap-mutual. Multiple targets can\
    \ use different authentication methods.\n\nThe auth-type keyword is most optional.\
    \ If you don't explicitly state an authentication type, the presence of chap or\
    \ chap-mutual lets FreeBSD infer the authentication type. The main reason auth-type\
    \ keyword exists is so you can explicitly specify auth-type"
- md: "\nIf a target does not offer any authentication methods, all attempts to use\
    \ the iSCSI device are denied. To allow access without authentication, use the\
    \ built-in CHAP no-authentication.\n\nYou can also use the initiator-name and\
    \ initiator-portal options in a target, exactly as in an authentication group.\
    \ Here I permit a specific IP with a particular initiator name to access the target\
    \ without a password.\n\n```\ntarget iqn.2013-11.io.mwl:target {\n  auth-type\
    \ none\n  initiator-name iqn.2013-11.io.mwl:host1\n  initiator-portal 203.0.113.208\n\
    \n}\n```\n\nIf you configure an initiator to use authentication, but the target\
    \ doesn't require authentication, the connection succeeds.\n\n## Portal Group\n\
    \nEvery target must be attached to a portal group. Use the portal-group keyword\
    \ and the name of a previously defined portal group.\n\n```\ntarget iqn.2013-11.io.mwl:target\
    \ {\n  portal-group group0\n}\n```\n\nEach target can belong to only one portal\
    \ group.\n\n## Aliases\n\nAdd a human-readable description to a target with the\
    \ alias keyword.\n\n```\ntarget iqn.2013-11.io.mwl:target {\n  alias database-storage\n\
    }\n```\n\nAliases cannot contain whitespace.\n\nYou'll see the alias in a few\
    \ iSCSI discovery tools. FreeBSD's initiator shows the alias in verbose mode.\n\
    \n## Logical Unit Numbers and Backing Stores\n\nA Logical Unit Number (LUN) is\
    \ a storage device. It might be a ZFS volume, a chunk of disk space, or even a\
    \ physical device. Each iSCSI target that connects to this target accesses all\
    \ LUNs in the target. Define LUNs within target statements. Each LUN requires\
    \ a path to the back end storage device. The size in bytes is optional.\n\nHere\
    \ I define target with three LUNs.\n\n```\ntarget iqn.2013-11.io.mwl:target0 {\n\
    \  alias database-storage\n  auth-group db\n  portal-group group0 {\n    path\
    \ /dev/zvol/db/disk1\n    size 1T\n  }\n  lun 1 {\n    path /db/disk2.img\n  \
    \  size 2T\n  }\n  lun 2 {\n    path /dev/da0\n    size 1T\n  }\n}\n```\n\nLUN\
    \ 0 is a 1 TB ZFS volume, accessible through the device node /dev/zvol/db/disk1.\
    \ For optimal performance, create the volume with the volmode property set to\
    \ dev. Using a volmode of dev lets ZFS bypass GEOM and manage I/O sizes more flexibly.\
    \ It also enables DPO and FUA cache control, letting ZFS tell the drive to not\
    \ put select data in the write cache.\n\nLUN 1 is backed by a file on the filesystem,\
    \ /db/disk2.img. This might be on a UFS partition or a file on a ZFS dataset.\
    \ It could be a regular file or a sparse file.\n\nLUN 2 is backed by a physical\
    \ disk with the device /dev/da0.\n\nNumber other LUNs with positive integers.\
    \ I didn't need to use LUNs 2 and 3, here, I like short numbers. LUN numbers do\
    \ not need to be sequential.\n\nIf you have many iSCSI devices served by files\
    \ or zols, consider naming the backing store for each LUN after the LUN. Use zols\
    \ or files with commas in the name, such as target1,1,0 for target 1, LUN 0. (Note\
    \ that the middle character here is the letter I, not the number 1.)\n\nAny initiator\
    \ that connects to this target gets access to all three LUNs.\n\n## LUN Size\n\
    \nEach LUN can have a size statement, giving the size ctld reports to the initiator,\
    \ in bytes. You can use abbreviations like G for gigabytes and T for terabytes.\
    \ If you don't specify a size, FreeBSD will probe the device to figure out the\
    \ size. I like the size statement because I'm forgetful.\n\nThe size given should\
    \ be the same as the actual size of the storage device, but doesn't always happen.\
    \ In the example above, I claim that the disk behind LUN 3 is one terabyte. It's\
    \ a physical 1 TB disk, which means the manufacturer measured the size in base\
    \ 10. FreeBSD measures disk sizes in base 2. Running geom list dao gives the actual\
    \ size of this specific disk is 1000204886016 bytes, and 932 GB. I'd be off listing\
    \ the actual value rather than rounding it to the nearest terabyte. Remember,\
    \ not all \"1 TB\" disks are the same size.\n\nIn addition to size and the backing\
    \ store, you can set a variety of other LUN characteristics.\n\n## Blocksize\n\
    \nWhile physical hard drives have had 512-byte sectors for decades, newer \"advanced\
    \ format\" drives have 4096-physical sectors. For physical disks and ZFS volumes,\
    \ ctld(8) passes the physical sector size to the initiator. On file-backed iSCSI\
    \ volumes, the size sector size with the blocksize keyword.\n\n```\nlun 2 {\n\
    path /jails/disk2.img\nblocksize 4K\nsize 2T\n}\n```\n\nIf you're using file-backed\
    \ iSCSI storage rather than a zvol or a physical disk, the block size can help\
    \ the iSCSI initiator write requests correctly for the underlying storage.\n\n\
    ## Drive Information\n\nSCSI commands expose physical hard drive's model name,\
    \ serial numbers, and other vendor-specific data. You can set this same information\
    \ within a LUN definition. ctld(8) provides device-id and serial keywords. Use\
    \ device-id to provide something like model name. The serial keyword is for anything\
    \ like serial number. Neither entity can assign a meaningless serial number. Here\
    \ I use device-id to let people view what sort of storage uses.\n\n```\nlun 0\
    \ {\n  path /dev/zvol/jails/disk1\n  size 500G\n  device-id zvol\n  serial 0123456789abcdef\n\
    }\n```\n\nOn the client, the device ID is visible in the lunname and lunid values\
    \ of geom list. The serial number is visible in the disk's ident string.\n\n```\n\
    geom list\ndescr: FreeBSD\nlunname: FreeBSD\nlunid: FreeBSD\nident: 123456789abcdef\n\
    ```\n\nThe leading FreeBSD always appear in LUN name and ID.\n\n## ctld(8) Performance\n\
    \nWhile ctld is designed to perform well, you can tweak a few things in its behavior.\
    \ Each incoming connection makes ctld spawn a child process. By default, ctld\
    \ limits the number of child processes to 30. Setting maxproc to allows unlimited\
    \ child processes.\n\n```\nmaxproc 30\n```\n\nInitiators generate a constant flow\
    \ of traffic to their targets. Even if iSCSI disk is idle, the target will receive\
    \ traffic every few seconds. The timeout value tells ctld how long to maintain\
    \ an idle connection before dropping it. The default is 60, a reasonable average.\
    \ Your equipment or environment might need a different timeout.\n\n```\ntimeout\
    \ 90\n```\n\nAll performance and debugging options go at the top level of lun.conf,\
    \ not inside any braces.\n\n## Debugging ctld(8)\n\nWhile the SCSI command set\
    \ gets complicated, iSCSI itself is pretty straightforward. Even so, sysadmins\
    \ can discover many ways mess up iSCSI configurations. ctld(8) debugging features\
    \ give good insight into problems. Use the debug statement to enable debugging.\
    \ The default level, 0, provides bare operational messages. A debugging level\
    \ of 3 gives useful information when an iSCSI connection goes awry. Whenever an\
    \ initiator fails to authenticate, or when the storage for a LUN is absent or\
    \ faulty, ctld(8) logs the error. Most ctld error messages are actually fairly\
    \ to understand. Authentication errors describe which authentication constraint\
    \ was violated. LUN errors are more generic, but normally mean that you mistyped\
    \ the path to the backing storage in ctld.conf.\n\n```\ndebug 3\n```\n\nInformation\
    \ from ctld appears in /var/log/messages. You cannot change the log facility and\
    \ level (daemon.debug), so you want to log them separately you'll split them out\
    \ in syslog(8). I use a debug level of 3 during normal production use, to easily\
    \ identify and resolve issues. Log space is cheap.\n\n## Configuring Initiators\n\
    \nThe iSCSI initiator programs share a configuration file, /etc/iscsi.conf. This\
    \ configuration file was also used by the iSCSI initiator in older versions of\
    \ FreeBSD, so its documentation includes references to the obsolete control(8).\
    \ The configuration format deliberately not between the two sets of software,\
    \ however.\n\nThe simplest uses of the iSCSI initiator do not require a configuration\
    \ file. You can discover targets on a host, connect to and disconnect from them,\
    \ and perform CHAP authentication without a configuration file. A configuration\
    \ file permits use of more options like mutual CHAP, and allows more selective\
    \ iSCSI management. In production, always use a configuration file.\n\nEach iSCSI\
    \ target gets a bracketed section in iscsi.conf.\n\n```\ntarget-nickname {\nTargetAddress\
    \ = storm.mwl.io\nTargetName = iqn.2013-11-io.mwl:target0\nInitiatorName = iqn.2013-11-io.mwl:host1\n\
    }\n```\n\nA target's entry starts with a nickname. This sample target is unimaginatively\
    \ nicknamed target-nickname.\n\nInside the braces we have the various iSCSI settings\
    \ and their values, as defined in iscsi.conf(5). We'll add more settings in the\
    \ relevant topics, but the three here are very commonly used.\n\nTargetAddress\
    \ can be a hostname or IP address. It's the IP address of the iSCSI portal providing\
    \ the target. My iSCSI server is called storm.mwl.io.\n\nTargetName is the formal\
    \ name of the iSCSI target you want to connect to. This connection is for the\
    \ target name we created earlier this chapter.\n\nInitiatorName is a name you've\
    \ chosen to assign to this initiator. If you don't assign a name for this initiator,\
    \ FreeBSD creates one for you. Assigning an initiator name is a convenience for\
    \ you.\n\nA target definition's closing bracket must appear on a line by itself.\
    \ Don't tack it onto the end of the last variable setting.\n\nWhen using iSCSI\
    \ disks, remember that the device node is even more dynamic than on normal hardware.\
    \ The disk that is /dev/das5 today might be a completely different disk node.\n"
  mdcn: "\n如果目标（target）未提供任何身份验证方法，所有使用 iSCSI 设备的尝试都将被拒绝。若要在无身份验证的情况下访问，请使用内置的 CHAP\
    \ 无身份验证。\n\n你也可以在目标中使用 `initiator-name` 和 `initiator-portal` 选项，这与身份验证组完全相同。在这里，我允许具有特定启动器名称的\
    \ IP 无需密码访问目标。\n\n```\ntarget iqn.2013-11.io.mwl:target {\n  auth-type none\n\
    \  initiator-name iqn.2013-11.io.mwl:host1\n  initiator-portal 203.0.113.208\n\
    \n}\n```\n\n如果你配置启动器使用身份验证，但目标并不要求身份验证，则连接将成功。\n\n## 端口组 (Portal Group)\n\n每个目标都必须附加到一个端口组。使用\
    \ `portal-group` 关键字以及之前定义的端口组名称。\n\n```\ntarget iqn.2013-11.io.mwl:target {\n\
    \  portal-group group0\n}\n```\n\n每个目标只能属于一个端口组。\n\n## 别名 (Aliases)\n\n使用 `alias`\
    \ 关键字为目标添加一个人类可读的描述。\n\n```\ntarget iqn.2013-11.io.mwl:target {\n  alias database-storage\n\
    }\n```\n\n别名不能包含空格。\n\n你将在一些 iSCSI 发现工具中看到该别名。FreeBSD 的启动器在详细模式（verbose mode）下会显示别名。\n\
    \n## 逻辑单元号与后端 (Logical Unit Numbers and Backing Stores)\n\n逻辑单元号（LUN）是一个存储设备。它可能是一个\
    \ ZFS 卷、一块磁盘空间，甚至是一个物理设备。连接到此目标的 iSCSI 目标将访问该目标中的所有 LUN。在 `target` 语句中定义 LUN。每个\
    \ LUN 都需要指向后端存储设备的路径。以字节为单位的大小是可选的。\n\n在这里我定义了一个具有三个 LUN 的目标。\n\n```\ntarget iqn.2013-11.io.mwl:target0\
    \ {\n  alias database-storage\n  auth-group db\n  portal-group group0 {\n    path\
    \ /dev/zvol/db/disk1\n    size 1T\n  }\n  lun 1 {\n    path /db/disk2.img\n  \
    \  size 2T\n  }\n  lun 2 {\n    path /dev/da0\n    size 1T\n  }\n}\n```\n\nLUN\
    \ 0 是一个 1 TB 的 ZFS 卷，通过设备节点 `/dev/zvol/db/disk1` 访问。为了获得最佳性能，创建卷时将 `volmode` 属性设置为\
    \ `dev`。使用 `volmode=dev` 让 ZFS 跳过 GEOM 并更灵活地管理 I/O 大。它还启用了 DPO 和 FUA 缓存控制，让 ZFS\
    \ 告诉驱动器不要将特定数据写入缓存。\n\nLUN 1 由文件系统上的文件 `/db/disk2.img` 支持。这可能位于 UFS 分区上，或者是 ZFS\
    \ 数据集上的一个文件。它可以是一个普通文件，也可以是稀疏文件。\n\nLUN 2 由设备为 `/dev/da0` 的物理磁盘支持。\n\n使用正整数为其他\
    \ LUN 编号。在这里我不需要使用 LUN 2 和 3，我喜欢短数字。LUN 编号不需要连续的。\n\n如果你有许多通过文件或 zols 提供的 iSCSI\
    \ 设备，考虑根据 LUN 编号来命名每个 LUN 的后端存储。使用名称包含逗号的 zols 或文件，例如目标 1 的 LUN 0 可以名为 `target1,1,0`。（注意这里中间的字符是字母\
    \ I，而不是数字 1。）\n\n任何连接到此目标的启动器都可以访问所有三个 LUN。\n\n## LUN 大小\n\n每个 LUN 都可以有一个 `size`\
    \ 语句，用于指定 `ctld` 向启动器报告的大小（单位为字节）。你可以使用如 `G`（GB）和 `T`（TB）之类的缩写。如果你不指定大小，FreeBSD\
    \ 将探测该设备以确定大小。我喜欢 `size` 语句，因为我很健忘。\n\n给出的大小应该与存储设备的实际大小相同，但并非总是如此。在上面的示例中，我声称\
    \ LUN 3 后面的磁盘是一个太字节。它是一个物理 1 TB 磁盘，这意味着制造商是按 10 进制测量大小的。FreeBSD 按 2 进制测量磁盘大小。运行\
    \ `geom list dao` 显示此特定磁盘的实际大小为 `1000204886016` 字节，即 932 GB。如果列出实际值而不是舍入到最接近的太字节，我就错了。记住，并不是所有的“1\
    \ TB”磁盘大小都是相同的。\n\n除了大小和后端存储外，你还可以设置各种其他 LUN 特性。\n\n## 块大小 (Blocksize)\n\n虽然物理硬盘几十年来一直使用\
    \ 512 字节扇区，但新的“高级格式”驱动器具有 4096 物理扇区。对于物理磁盘和 ZFS 卷，`ctld(8)` 将物理扇区大小传递给启动器。对于基于文件的\
    \ iSCSI 卷，使用 `blocksize` 关键字指定块大小。\n\n```\nlun 2 {\npath /jails/disk2.img\nblocksize\
    \ 4K\nsize 2T\n}\n```\n\n如果你使用的是基于文件的 iSCSI 存储 own zvol 或物理磁盘，块大小可以帮助 iSCSI 启动器为底层存储正确写入请求。\n\
    \n## 驱动信息\n\nSCSI 命令暴露了物理硬盘的信息。对于物理磁盘和 ZFS 卷，`ctld(8)` 将物理扇区大小传递给启动器。对于基于文件的 iSCSI\
    \ 卷，使用 `blocksize` 关键字指定扇区大小。\n\n```\nlun 2 {\npath /jails/disk2.img\nblocksize\
    \ 4K\nsize 2T\n}\n```\n\n如果你使用的是基于文件的 iSCSI 存储而非 zvol 或物理磁盘，块大小可以帮助 iSCSI 启动器为底层存储正确写入请求。\n\
