    ```

    # mkisofs -o cd1.iso cdfiles/

    ```


    The image file is now ready to burn to CD. Before burning it, however, double-check
    the contents by mounting the disk image as discussed in Chapter 5. You’ll see
    that the contents are slightly different.


    # ls -la /media/


    ```

    total 159

    dr-xr-xr-x 1 root wheel    2048 Aug 25 14:30 .

    drwxr-xr-x 28 root wheel     35 Aug 25 11:47 .

    -r-xr-xr-x 1 root wheel    50769 Mar 13 2014 expositi.zip

    -r-xr-xr-x 1 root wheel    50718 Aug 25 14:30 file1.zip

    -r-xr-xr-x 1 root wheel    50719 Aug 25 14:30 file3.zip

    ```


    The ownership has changed. If the directory had symbolic links, they’d be missing.
    And one file has a truncated name!


    The ISO 9660 standard imposes a limit of eight characters on a filename, plus
    a period and a three-character extension. It has a maximum depth of eight directories,
    a maximum of 65,535 directories, and assorted other annoying limitations. Also,
    ISO 9660 does not reflect all of POSIX’s filesystem semantics—or all of the Microsoft
    filesystem standards. Various extensions support these features,


    # ISO 9660 Extensions and Features


    Using any ISO 9660 extension requires specifying the extension when creating the
    ISO image. You cannot retrofit extensions onto an existing ISO, as the information
    the extensions support doesn’t exist in the ISO. The most common sets of extensions
    are Joliet and Rock Ridge.


    Microsoft created Joliet extensions to support Windows filenames and attributes.
    Filenames on an ISO with Joliet extensions can be up to 103 characters long, and
    directories can run more than eight layers deep. Activate Joliet extensions with
    the -j flag.


    Rock Ridge extensions are designed for Unix-like systems. They also allow longer
    filenames and greater directory depth, but also include Unix attributes like file
    ownership, symbolic links, and more. Enable Rock Ridge extensions with the -R
    flag.


    The El Toronto extensions mark an ISO as a bootable device. You will have to put
    a boot loader and an operating system in the ISO. Enable El Toronto with -b and
    the path to the boot loader. See “Bootable CDs” later in this chapter for more
    information.


    The presence of any of these extensions will not interfere with reading the CD
    on other'
- md: "\noperating systems. Windows systems can open CDs created with Rock Ridge extensions,\
    \ but ignore the Unix-style permissions and symbolic links. Unix hosts can open\
    \ Joliet CDs, but won't use Windows-specific information. FreeBSD’s CD driver\
    \ handles all these extensions by default.\n\nIf a CD will be used only on FreeBSD\
    \ hosts, you can completely bypass all ISO restrictions with -u. The image will\
    \ properly violate ISO 9660, but retain all filename information.\n\nI normally\
    \ create ISOs with both the Joliet and Rock Ridge extensions. Unix hosts will\
    \ get the full filename and other POSIX metadata, while Microsoft systems will\
    \ at least get the complete name.\n\n```\n# mkisofs -JR -cd cd1.iso cdfiles/\n\
    ```\n\nBurn the image to disk and you're ready to go.\n\n## Bootable CDs\n\nIn\
    \ addition to the directory tree, bootable CDs need a boot loader, an operating\
    \ system kernel, and some kind of userland.\n\nSpecify the boot loader with -b.\
    \ FreeBSD includes a boot loader for running FreeBSD from CD, /boot/cdboot. Unlike\
    \ other boot loaders, cdboot does not emulate a floppy disk, so you'll have to\
    \ also add the -no-emul-boot flag.\n\nCopy the kernel and userland into your source\
    \ directory tree before creating the ISO. A FreeBSD boot loader expects to find\
    \ a kernel and any kernel modules in the directory /boot/kernel. You can change\
    \ this, if you hack the loader internals. The userland can be small, but to actually\
    \ use a bootable CD you'll want basic programs such as those found in /bin and\
    \ /sbin.\n\nHere I have my complete directory tree in the directory cdfiles, including\
    \ a copy of the boot loader. I create the bootable ISO with mkisofs(1).\n\n```\n\
    # mkisofs -R -no-emul-boot -b cdfiles/boot/cdboot -o cd1.iso cdfiles\n```\n\n\
    The easiest way to create a custom FreeBSD boot CD, including custom installation\
    \ media, is the make release process.\n\nSadly, CDs are approaching obsolescence.\
    \ DVDs and Blu-ray are the more modern optical media.\n\n## DVD and Blu-ray: UDF\n\
    \nYou can use the CD-style ISO 9660 filesystems on any optical media up to 4.3\
    \ GB. This means you can use a CD filesystem on a single layer DVD. Larger optical\
    \ media, like a multi-layer DVD or Blu-ray, use the Universal Data Format (UDF)\
    \ filesystem or a hybrid ISO 9660/UDF filesystem. Like ISO 9660, UDF is a read-only\
    \ filesystem. You can create UDF images and burn them to disk, but you can't edit\
    \ an existing image.\n\nFreeBSD supports reading from and writing to UDF disks.\
    \ UDF is a read-only filesystem, where FreeBSD can write a filesystem to a disk,\
    \ exactly like an (ISO.). You can use DVD and Blu-ray disks to store and transfer\
    \ data. Writable optical media is not a durable long-term storage medium, but\
    \ in some environments it's the best option.\n\nUDF support is not the same thing\
    \ as reading commercial DVDs and Blu-ray disks. Commercial optical disks, like\
    \ those used for films, are encrypted. There is no freely available solution for\
    \ watching DVD or Blu-ray disks on open source operating system. An Internet search\
    \ will expose many methods for breaking much of that encryption, but that's beyond\
    \ the scope of this book.\n\nWe're not going to spend time exploring the specifics\
    \ of the DVD-Video format, a specific arrangement of files suitable for a Blu-ray\
    \ or DVD player. That quickly becomes complicated, and you can find extensive\
    \ cross-platform literature on DVD-Video. Use third-party tools like the dvdauthor\
    \ package to create filesystems.\n\nFinally, with CDs, we're not going to cover\
    \ multisession disks. Multisession disks are where you append data to the end\
    \ of a read-write optical disk, rather than overwriting the existing filesystem.\
    \ Hardware support for multisession disks is mixed, and DVD-RW and DVD+RW have\
    \ different restrictions on their use. If you really want to dive into multisession\
    \ disks, check the FreeBSD Handbook for all the tedious details. Instance, we'll\
    \ cover all that the UDF users must know.\n\n## UDF Hardware\n\nDVD disks are\
    \ standardized. And you get several standards to choose from.\n\nThe most common\
    \ standards for DVD disks are DVD-R and DVD+R. Each comes in a read-write format,\
