  - '[PAGE 120]


    # Enabling the iSCSI Initiator


    FreeBSD provides iSCSI initiator services through iscsid(8) and iscsict(8). The
    iscsid daemon handles connections, while iscsictl lets you issue iSCSI commands.


    # iscsid(8)


    The iSCSI daemon iscsid(8) manages an initiator''s iSCSI logins and discovery.
    Once iscsid establishes a connection, it connects to the FreeBSD kernel. To enable
    iscsid, set iscsid_enable to YES in /etc/rc.conf.


    ```

    # sysrc iscsid_enable=YES

    ```


    If you have trouble with iSCSI logins, you might try iscsid debugging mode. The
    -d flag tells iscsid to run in the foreground, and print all the debugging information
    to the terminal. Debug-mode iscsid terminates after handling only one connection.
    This won''t interrupt existing connections, as iscsid handles only logins and
    discovery. Even without iscsid running, established iSCSI connections remain up
    until something interrupts them. With


    While iscsid normally gets its debugging level from iscsi.conf, you can override
    the setting on the command line with -1 and a log level. This lets you debug specific
    problems without editing the configuration file. A log level of 3 will identify
    most problems.


    Each iSCSI login spawns a child process. These child processes handle authentication,
    negotiate various iSCSI parameters, hand the connection off to the kernel, and
    exit. Normally, the maximum number of simultaneous child processes is 30. If you
    must process more than 30 iSCSI simultaneously, use the -m flag to set a new maximum.
    Setting the maximum to 0 removes any limits on the number of child processes.'
