    # Chapter 12: Filesystem Glues


    This last chapter covers a couple different tools that aren’t exactly filesystems,
    but simplify working with filesystems: FUSE and autofs(5).


    FUSE, or Filesystem in Userspace, lets users manage filesystems, mount filesystems
    not supported by the FreeBSD kernel, and transform their own data to be accessible
    in a filesystem-like manner.


    The automounter filesystem autofs(5) can automatically mount filesystems for you,
    either via NFS or when physically attached to the system.


    We’ll start with FUSE, and proceed to autofs.'
  - '[PAGE 190]


    # FUSE


    Filesystem in Userspace, or FUSE, presents a way for userland programs to handle
    and process unusual filesystems. FUSE programs run as user processes, interpreting
    data and handling the kernel predigested memory structures so the kernel can present
    the filesystem to the system. This allows a userland program to provide filesystem
    support to the kernel.


    A filesystem can be more than just a place to stick data. FUSE systems can also
    be useful tools for accessing data in novel, unexpected ways. Consider devfs (Chapter
    2), which FreeBSD uses to let programs access hardware through a filesystem. Optional
    tools like fdescfs and mqueues (Chapter 3) let you access kernel memory structures
    as a filesystem. Many users could benefit from exposing their own data in ways
    you can''t even guess at.


    FUSE also supports interesting data transformations, such as mounting a filesystem
    over SSH. The FreeBSD developers would never permit an SSH client in the kernel,
    but since we''re out in userland anyway, might as well fire SSH while you''re
    there. Or an MP3 transcoder. Or an HTTP client, letting you mount and examine
    an ISO on a web server without downloading the whole thing. There is even a Wikipedia
    FUSE module, letting you view and edit Wikipedia as a filesystem. Some filesystems
    like MooseFS (www.moosefs.org) are implemented entirely for FUSE. FreeBSD has
    over dozen FUSE modules as I write this, with more appearing regularly.


    FUSE modules are frequently portable between operating systems. The data structures
    of a Microsoft NTFS disk don''t change based on the operating system you''re reading
    it on. FUSE modules do need changes to work between operating systems—FreeBSD
    expects different filesystem structures than Linux or Solaris—but that is trivial
    compared to the difficulty of implementing a filesystem inside the kernel.


    Using FUSE is not risk-free. FUSE modules feed data into the kernel. While the
    kernel sanitizes the data, a corrupt filesystem might throw garbage into the kernel.
    A clever intruder might be able to leverage his way into privileged access.


    Sometimes, though, FUSE is the best way to solve a problem. You need to investigate
    files on another server? Use SSH. A program needs to investigate files on another
    server, but it can only look at local files? Stick FUSE’s mount-over-SSH module
    in the middle and go on.'
- md: '

    # FUSE Prerequisites


    FreeBSD implements its FUSE support as a kernel module, fuse.ko. Load it with
    kldload(8), or at boot-time in /boot/loader.conf.


    Using FUSE requires access to the /dev/fuse device. By default, only root and
    users in the operator group get access. Assigning users with FUSE privileges to
    operator is reasonable on some systems. If that doesn''t suit your environment,
    create a special group for FUSE and use a devd(8) rule to assign /dev/fuse to
    that group owner. If you want unprivileged users to have access to FUSE, you''ll
    need to set the vfs.usermount to 1.


    We''ll use the FUSE SSH module as an example. Once you understand how to use sshfs(1),
    deploying other modules should be a matter of understanding the module''s target—that
    is, to deploy the FUSE NTFS module, you''ll need to dive into NTFS. After covering
    sshfs we''ll delve into details of FreeBSD''s mount_fusefs(8), which lets you
    fine-tune how FreeBSD treats FUSE filesystems.


    # SSHFS


    The fusefs-sshfs FUSE module lets mount a remote directory over SSH. This lets
    you treat a remote filesystem as local, and run commands on files stored on the
    remote host. Once you''ve installed the package, use sshfs(1). You''ll need two
    arguments: the remote host, and the directory on which you want the SSH filesystem
    mounted.


    I strongly encourage use of public key authentication with SSH. If you''re still
    using password-based authentication with SSH, check out any number of online tutorials
    or your SSH Mastery (Tilted Windmill Press, 2012).


    Here use sshfs(1) as a regular user, mounting my home directory on the server
    mail on a directory I own, $HOME/mnt.


    ```

    $ sshfs mail: mnt/

    ```


    If I go into the mnt directory I''ll see the files from my home directory on the
    server. I can move, copy, and rename these files as I.


    The sshfs module deliberately shares such syntax with the SSH client. To use a
    different username, put it before the hostname, separated by an "at" sign. If
    you want to mount a different directory, put that directory after the colon. Change
    the port with -p and the port number.


    ```

    $ sshfs -p 2222 mail:/tmp mnt/

    ```


    To unmount the sshfs, use umount(8) as normal.


    ```

    $ umount /home/mnt/mnt

    ```


    If you have weird behavior, add the -d to enable FUSE debugging. The sshfs command
    won''t detach from the terminal, instead showing only debugging information as
    you use the filesystem.


    ```

    $ sshfs -d mail: mnt/

    ```


    Use sshfs(1) for many more options, most of which most of us won''t need. Most
    of these exists as arguments to -o, exactly as in sshfs(1).


    # Permissions and Execution


    FUSE filesystems get treated differently than other filesystems.


    Only the user who mounted a FUSE filesystem can access it. While root can see
    that a user has mounted a FUSE filesystem, it can''t see the contents of that
    filesystems. Attempts to cd into that directory will be met with "Operation not
    permitted."


    Also, file ownership and privileges on the FUSE-mounted filesystem might not directly
    match the permissions on the local filesystem. I can mount a remote filesystem
    with sshfs, and sshfs doesn''t coordinate user and group IDs between my workstation
    and the server. I can manipulate those remote files exactly as if I was logged
    in at a command line. My workstation might support NFSv4 ACLs, but files mounted
    via sshfs use whatever permission scheme the SSH server uses.


    Finally, just because an sshfs mount has files that are executable, don''t assume
    that those programs will actually function on your host. You''ll need the correct
    shared libraries, and any other resources the program requires. I find that many
    of my simple shell scripts don''t work the way I expected when run on a sshfs
    mount, as I wrote assuming they''d only be executed on the server.


    # Sharing FUSE Filesystems


    FreeBSD''s FUSE allows only the user who mounted the filesystem to access it.
    The root user can override this, making a FUSE filesystem available to everyone.
    Most FUSE modules have an option to request this behavior. For sshfs, it''s the
    allow_other option. (You''ll also see an allow_root option, but that has no effect
    on FreeBSD.) Here I specifically mount an SSH FUSE filesystem so that anyone can
    access it.


    ```

    # sshfs -o allow_other mnt@local:/mnt

    ```


    This can only be run by root. Using allow_other as a non-root user triggers an
    error.


    Because of the nature of FUSE, this mount point lacks all permissions protections.
    Any user who can access /mnt gains complete access to the SSH session underlying
    the filesystem. Carefully restrict access to this directory!


    FUSE opens nearly limitless storage options. One of them might fix your intractable
    problem. For more details on FreeBSD''s FUSE implementation and management, mount_fusefs(8).


    # Autofounting with autofs


    FreeBSD 10 and later include a new automounter service, autofs(5). It replaces
    the more complicated automounter amd(8) in older versions. Autofs automatically
    identifies and mounts filesystems for users, even if they don''t have permissions
    to mount anything. If you plug in a flash drive, FreeBSD can examine it, identify
    the filesystems on it, and mount them. When user tries to access an,,, and mounts
    it if the server permits.


    In versions of FreeBSD, the sysadmin could allow unprivileged users to mount filesystems
    by setting thectl...usermount to 1. Users could mount media that they owned. While
    many sysadmins feel lucky if their users walk away from the terminal, requiring
    that users remember how to mount(8). Autofs.


    FreeBSD''s autofs was deliberately designed to be compatible with the Solaris
    automounter. The underlying code is quite different, but the practice should be
    the same. Any tasks that feel over-engineered as well as distressing Sun Microsystems
    licensed their automounter to just about every Unix vendor, so your existing automounter
    experience should apply.


    Automatically mounted filesystems can pile up. Autofs’ automountd(8) disconnects
    unused filesystems after a timeout. Yanking mounted removable media from the system
    can damage the media’s filesystem, and automatic unmounting reduces the risk of
    that happening. Unmounting unused NFS shares reduces load on your NFS server.


    # Enabling autofs


    Enable autofs in /etc/rc.conf.


    ```

    # sysrc autofs_enable=YES

    ```


    The default autofs configuration expects to mount removable media in /media and
    NFS shares in /net. (Automounting of removable media is disabled by default, but
    we''ll cover shortly.) While /media exists in FreeBSD installs, /net does not.
    Create the /net directory before enabling autofs. The directory''s absence won''t
    prevent autofs from

    starting, but it will prevent you from automounting NFS shares.


    # autofs Components


    You won''t find an autofofs startup script. FreeBSD manages each of the three
    major components separately, all controlled by the autofofs_enable setting.


    The automountd(8) command is used to manage automounted filesystems. The /etc/rc.d/automount
    startup script loads the autofofs kernel module autofofs.ko.


    The automountd(8) daemon handles mount requests. When you go to a directory used
    by autofofs, autofofs checks for filesystems of that type. Visit /media, and automountd
    checks for the presence of removable media. Once you try to access the media,
    automountd calls mount(8) or a variant thereof to perform the mount.


    Most of these programs take their instructions from the autofofs map file, /etc/auto_master
    and the related map files in /etc/autofs.

    '
  mdcn: '


    # FUSE 前提条件


    FreeBSD 将其 FUSE 支持实现内核模块 `fuse.ko`。使用 `kldload(8)` 加载它，或在启动时通过 `/boot/loader.conf`
    加载。


    使用 FUSE 需要访问 `/dev/fuse` 设备的权限。默认情况下，只有 root 用户和 `operator` 组的用户具有访问权限。在某些系统中，将具有
    FUSE 权限的用户分配到 operator 组是合理的。如果不符合你的环境，可以为 FUSE 创建一个特殊组，并使用 `devd(8)` 规则将 `/dev/fuse`
    分配给该组的所有。如果你想让非特权用户访问 FUSE，则需要将 `vfs.usermount` 设置为 `1`。


    我们将使用 FUSE SSH 模块作为示例。一旦你理解了如何使用 `sshfs(1)`，部署其他模块将只需理解该模块的目标——也就是说，要部署 FUSE NTFS
    模块，你需要深入 NTFS。在介绍完 sshfs 之后，我们将深入研究 FreeBSD `mount_fusefs(8)` 的细节，它允许你精调整 FreeBSD
    处理 FUSE 文件系统的方式。


    # SSHFS


    `fusefs-sshfs` FUSE 模块允许通过 SSH 挂载远程目录。这让你将远程文件系统视为本地文件系统，并在存储在远程主机上的文件上运行命令。安装软件包后，使用
    `sshfs(1)`。你需要两个参数：远程主机以及你想要挂载 SSH 文件系统的目录。


    我强烈建议在 SSH 中使用公钥身份验证。如果你仍在使用基于密码的 SSH 认证，请查阅许多在线教程或你的《SSH Mastery》(Tilted Windmill
    Press, 2012)。


    这里，我们作为普通用户使用 `sshfs(1)`，将服务器 `mail` 上的我的主目录挂载到我拥有的目录 `$HOME/mnt` 上。


    ```

    $ sshfs mail: mnt/

    ```


    如果我进入 `mnt` 目录，将看到来自服务器上我主目录的文件。我可以随心所欲地移动、复制和重命名这些文件。


    `sshfs` 模块刻意与 SSH 客户端共享此类语法。要使用不同的用户名，请将其放在主机名之前，并用“@”符号分隔。如果你想挂载不同的目录，请将该目录放在冒号后面。使用
    `-p` 和端口号来更改端口。


    ```

    $ sshfs -p 2222 mail:/tmp mnt/

    ```


    要卸载 sshfs，像往常一样使用 `umount(8)`。


    ```

    $ umount /home/mnt/mnt

    ```


    如果你遇到异常行为，添加 `-d` 以启用 FUSE 调试。`sshfs` 命令将不会从终端分离，而是在你使用文件系统时仅显示调试信息。


    ```

    $ sshfs -d mail: mnt/

    ```


    使用 `sshfs(1)` 查看更多选项，其中大多数选项是我们大多数人并不需要的。这些选项中的大部分作为 `-o` 的参数存在，与 `sshfs(1)` 中的完全一致。


    # 权限与执行


    FUSE 文件系统的处理方式与其他文件系统不同。


    只有挂载 FUSE 文件系统的用户才能访问它。虽然 root 用户可以看到某个用户挂载了 FUSE 文件系统，但它无法查看该文件系统的内容。尝试 `cd`
    进入该目录将遇到“Operation not permitted（操作不允许）”的错误。


    此外，FUSE 挂载文件系统上的文件所有权和权限可能不会直接对应本地文件系统上的权限。我可以使用 `sshfs` 挂载远程文件系统，而 `sshfs` 不会在我的工作站和服务器之间协调用户和组
    ID。我可以像登录命令行一样完全操纵这些远程文件。我的工作站可能支持 NFSv4 ACL，但通过 `sshfs` 挂载的文件使用的是 SSH 服务器所使用的任何权限方案。


    最后，仅仅因为 `sshfs` 挂载项中有可执行文件，也不要假设这些程序将会在你的宿主机上实际运行。你需要正确的共享库以及程序所需的任何其他资源。我发现，我的许多简单
    shell 脚本在 `sshfs` 挂载点上运行时，并没有像我预期的那样工作，因为我在编写它们时假设它们只会在服务器上执行。


    # 共享 FUSE 文件系统


    FreeBSD 的 FUSE 仅允许挂载文件系统的用户访问它。root 用户可以覆盖此限制，使 FUSE 文件系统对所有人可用。大多数 FUSE 模块都提供一个请求此类行为的选项。对于
    `sshfs`，它是 `allow_other` 选项。（你也会看到 `allow_root` 选项，但它在 FreeBSD 上没有作用。）在这里，我专门挂载了一个
    SSH FUSE 文件系统以便任何人都能访问。


    ```

    # sshfs -o allow_other mnt@local:/mnt

    ```


    这只能由 root 运行。非 root 用户使用 `allow_other` 会触发错误。


    由于 FUSE 的性质，此挂载点缺少所有的权限保护。任何可以访问 `/mnt` 的用户都会获得文件系统底层 SSH 会话的完全访问。请仔细限制对该目录的访问！


    FUSE 开启了几乎无限的存储选项。其中一个可能会解决你的难题。关于 FreeBSD FUSE 实现和管理的更多细节，请参考 `mount_fusefs(8)`。


    # 使用 autofs 自动挂载


    FreeBSD 10 及更高版本包含一个新的自动挂载服务 `autofs(5)`。它取代了旧版本中更复杂的自动挂载器 `amd(8)`。Autofs 会自动为用户识别并挂载文件系统，即使他们没有挂载权限。当你插入闪存驱动器时，FreeBSD
    可以检查它，识别其上的文件系统并挂载它们。当用户尝试访问时，如果服务器允许，就会进行挂载。


