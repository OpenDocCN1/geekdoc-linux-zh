  - '[PAGE 62]


    # Chapter 5: Memory Filesystems


    FreeBSD lets you create filesystems backed by system RAM, for short-lived memory
    disks. Reading and writing from memory is much faster than accessing files on
    disk, which makes memory-backed filesystems a fantastic optimization for certain
    applications. As with everything else in memory, though, at system shutdown you
    lose the filesystem.


    FreeBSD supports two different RAM-based disks: *tmpfs* (pronounced "temp fs")
    and *memory disks*. While they have similar concepts behind them, the underlying
    code is completely different, and they serve different roles. Use tmpfs(5) for
    memory-backed filesystems on long-running systems. Memory disks are more flexible
    but more suited for short-term use (unless carefully configured) or mounting disk
    images.'
  - '[PAGE 63]


    # tmpfs(5)


    The “tmp” in tmpfs doesn’t mean “temporary.” It literally means tmp, as in /tmp.
    Use tmpfs(5) for a speed memory-backed /tmp and similar filesystems. Don’t deploy
    tmpfs everywhere you see a path with tmp in it,—remember, data in /var/tmp is
    intended to survive a reboot. You might also use tmpfs for application lock files
    and other ephemeral data where speed would improve performance. Older versions
    of tmpfs had problems, as of FreeBSD 10 it''s widely deployed and considered production-ready.


    When you mount a tmpfs(5), it automatically creates a filesystem.


    ```

    # mount - t tmpfs tmpfs /tmp

    ```


    You could also use an /etc/fstab entry to have your tmpfs automatically mounted
    at boot.


    ```

    tmpfs /tmp tmpfs rw,mode=1777 0 0

    ```


    If users are permitted to mount tmpfs (by setting the sysctl vfs.usermount to
    1), they can create and mount tmpfs filesystems. Machines with this setting generally
    belong to a single user, however.


    Let’s consider some tmpfs options.


    # tmpfs Size


    Left to its own devices, a tmpfs has a maximum size equal to the amount of available
    RAM plus the amount of swap space. Copying a sufficiently large file to your tmpfs
    partition would exhaust all system memory. This would be bad.


    Use the mount size to set a maximum size of a tmpfs. Here I create a 1 GB tmpfs,
    mounted at /mnt.


    ```

    # -o size=1g -t tmpfs tmpfs /mnt

    ```


    If you mount tmpfs filesystems without a maximum size, they will all think that
    their maximum size is equal to the entire available memory and swap space. This
    means you could have two half-full tmpfs instances and run out of memory.


    One way you can reduce the odds of memory exhaustion is to limit the size of files
    that go on a tmpfs with the maxfilesize option. Most files in /tmp OR /var/tmp
    are tiny, and on most systems none exceed a few megabytes. I set a maximum file
    size of 10 MB on any one of these tmpfs.


    ```

    # -o maxfilesize=10m -t tmpfs tmpfs /tmp/

    ```


    Copy a large file to your tmpfs, and you’ll get a “File too large” error.'
  - '[PAGE 64]


    If you want to restrict how many files can exist on the tmpfs, consider restricting
    the number of inodes. While every file and directory needs inodes, the number
    of inodes does not directly correlate to the number of files and directories.
    You''ll want to experiment with this restriction to see if it works for you and
    how it needs adjusting.


    ```

