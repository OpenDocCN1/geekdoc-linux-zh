    # Autofounting with autofs


    FreeBSD 10 and later include a new automounter service, autofs(5). It replaces
    the more complicated automounter amd(8) in older versions. Autofs automatically
    identifies and mounts filesystems for users, even if they don''t have permissions
    to mount anything. If you plug in a flash drive, FreeBSD can examine it, identify
    the filesystems on it, and mount them, all without human intervention. When a
    user tries to access an NFS share, autofs mounts it if the server permits. Autofs
    automatically handles removable media, NFS shares and filesystems configured in
    /etc/fstab with the noauto flag, and can be configured to handle anything FreeBSD.
    While many sysadmins won''t want servers to automount removable media, they might
    find automounting NFS shares very useful.


    In versions of FreeBSD, the sysadmin could allow unprivileged users to mount removable
    filesystems by setting the sysctl vfs.usermount to 1. Users could mount media
    on directories that they owned. While many sysadmins feel lucky if half of their
    users remember to log out when they walk away from the terminal, requiring that
    users remember how to run mount(8). For most users, this wasn''t going to happen.
    Automounting gives the sysadmin better control over what media users can mount,
    and where it gets mounted.


    FreeBSD''s autofs was deliberately designed to be compatible with the Solaris
    automounter. The underlying code is quite different, but the practice should be
    the same. Any tasks that feel over-engineered as well as particularly distressing
    behaviors can be blamed on Oracle.¹ If you have automounter problems, you might
    check Solaris documentation as well as for FreeBSD. Sun Microsystems licensed
    their automounter to just about every commercial Unix vendor, so your existing
    automounter experience should apply.


    # Enabling autofs


    Enable autofs in /etc/rc.conf.


    ```

    # sysrc autofs_enable=YES

    ```


    The default autofs configuration expects to mount removable media in /media and
    NFS shares in /net. (Automounting of removable media is disabled by default, but
    we''ll cover shortly.) While /media exists in FreeBSD installs, /net does not.
    Create the /net directory before enabling autofs. The directory''s absence won''t
    prevent autofs from'
