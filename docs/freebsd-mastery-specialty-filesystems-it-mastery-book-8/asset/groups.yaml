  - '[PAGE 128]


    # Chapter 9: GEOM_GATE and HAST


    In addition to exporting filesystems across the network, FreeBSD lets you export
    device nodes. Device nodes are very operating system specific—there’s rarely a
    reason to say, address a Linux device node directly on a FreeBSD host or vice-versa.
    But perhaps you need to access the CD burner in machine A from machine B, or you
    need to get a filesystem image on a host that doesn''t have enough space to store
    that, or you just need some temporary storage space. FreeBSD includes the geom_gate
    kernel module, or ggate, that can transport storage device nodes (disks and partitions,
    memory devices, and optical drives) across the network.


    Exporting device nodes across the network makes all kinds of things possible.
    The most obvious is to mirror a disk partition between two hosts, so that the
    hosts constantly synchronize data on those partitions. FreeBSD’s HAST, or Highly
    Available Storage, lets you synchronize disks across the network.


    These disk device exports are neither encrypted nor authenticated. Anyone who
    can intercept the traffic can view the transactions. so you get a small amount
    of security through obscurity, but never rely on an attacker’s ignorance. If you
    don’t trust the network layer, tunnel this traffic inside a VPN or over SSH. These
    exports use TCP port 3080 by default. If you deploy geom_gate or HAST on a public
    network, protect TCP/3080 with a firewall or packet filter. Better still, directly
    connect the mirrored hosts with a direct (crossover-style) cable or private VLAN.'
