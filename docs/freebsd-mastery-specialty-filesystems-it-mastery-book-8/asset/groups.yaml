  mdcn: '


    ## 第 7 章：常用互联网文件系统客户端


    典型的办公室通过微软的通用互联网文件共享（CIFS）协议共享网络驱动器。CIFS 也称为 Windows 的“网络邻域”（Network Neighborhood）、服务器消息块（SMB），以及“为什么我无法映射该驱动器？”。虽然它最初仅在微软操作系统可用，但如今任何对企业文件服务器有一定要求的设备都支持
    SMB 和 CIFS。


    严格来说，SMB 是一个较低层次的协议。微软将 CIFS 视为该协议的一种方言。


    FreeBSD 包含了 smbutil(8) 程序，用于作为 CIFS 客户端查找、挂载和使用 CIFS 共享。FreeBSD 基础系统中不包含 CIFS
    服务器，但开源的 CIFS 服务器 Samba (www.samba.org) 在 FreeBSD 上运行得很好。Samba 是一个足以写满比本书大得多的的话题，因此我们不再在此展开。


    FreeBSD 对 CIFS 的支持允许你利用现有的 Windows 基础设施进行操作。你不会部署 CIFS 来支持 Unix 系统——对于这种情况，请改用
    NFS。


    ## 前提条件


    在尝试挂载 CIFS 共享之前，你需要准备一些信息。首先，获取一个具有共享访问权限的有效用户名和密码，以及 Windows 域名。你的宿主机需要具备发现文件服务器的能力；Windows
    DNS 服务器的 IP 地址即可，或者使用你想要挂载共享的文件服务器的主机名或 IP 地址。


    在 FreeBSD 端，你需要加载 `smbfs.ko` 内核模块。这会同时加载 `libiconv.ko` 和 `libmchain.ko` 模块。你可以通过
    `/boot/loader.conf` 条目在启动时自动加载这些模块。


    ```

    smbfs_load=YES

    ```


    准备好后，你就可以配置 CIFS 了。


    ## CIFS 配置


    与 NFS 或 iSCSI 不同，你只能通过配置文件管理 CIFS。CIFS 的复杂性可能比其中任何一种都要得多。主配置文件是 /etc/nsmb.conf，但用户可以在
    $HOME/.nsmbrc 中拥有个人配置。/etc/nsmb.conf 中的任何配置都会覆盖用户的个人设置。这两个文件使用相同的配置语法和关键字，虽然本书提的是
    `nsmb.conf`，但用户可以在其个人配置文件中执行相同类型的配置。


    配置文件分为多个节。每个节以方括号括起的标签开头。适用于所有 CIFS 连接的设置位于 [default] 节。你可以创建其他标签来按服务器、用户名和共享提供配置设置，如下所示：


    - [server]

    - [server:user]

    - [server:user:share]


    适用于整个服务器的设置存放在以服务器命名的节中。仅适用于服务器上特定用户的设置存放在以服务器和用户命名的节中。仅适用于单个共享的设置存放在以服务器、用户和共享名称命名的节中。


    使用来自 CIFS 宿主机的值配置 FreeBSD 的 CIFS 客户端。你无法使用 FreeBSD 账户凭据登录 Windows 宿主机。


    ## nsmb.conf 关键字


    通过在相应的节中放入关键字和值来配置 CIFS。使用等号 (=) 为关键字赋值。虽然 nsmb.conf(5) 列出了所有有效关键字，但这里是你几乎肯定需要的。


    ### workgroup


    `workgroup` 关键字指定 Windows 域的。工作组是域的先身。几乎所有的 CIFS 服务器都有 Windows 域。


    ```

    workgroup=BigOrg

    ```


    ### nbns


    使用 `nbns` 设置 NetBIOS (WINS) 名称服务器的 IP 地址。你可以将此行放在 [default] 节下或特定服务器下。对于大多数环境，请使用域控制器的
    IP。


    ```

    nbns=203.0.113.8

    ```


    虽然现代 Windows 网络使用 DNS 查找主机，但 WINS 在旧网络上可能仍然有用。许多大型公司在后台仍运行着 WINS。


    ### password


    `password` 关键字允许你为用户或共享设置明文密码。如果你必须在 nsmb.conf 中发布密码，请务必确保 root 可以读取该文件。在多用户系统中，将密码存储在
    $HOME/.nsmbrc 中是一个极糟糕的主意。然而，在启动时自动挂载共享需要使用硬编码密码。


    FreeBSD 允许你为此关键字分配一个加密后的密码。加密很容易反转，但可以保护密码免受意外泄露。加密后的密码以双美元符号 ($) 开头。使用 `smbutil
    crypt` 加密你的密码。


    ```

    # smbutil crypt RealPassword

    $15e5a3b0c32f01e9f2f8db

    ```


    在包含用户信息的节中使用 `password`。


    如果服务器的角色需要访问，请不要使用自己的账户，而是向你的 Windows 团队请求一个仅具有挂载共享权限的账户。


    整体来看，工作组 mwl 在服务器上的文件大小用户 mwl，你可能会得到一个像这样的 /etc/nsmb.conf 文件：


    ```

    [default]

    nbns=203.0.113.12

    workgroup=MwL

    [FILESERVER:mwl]

    password=$$1744a412a293f03

    ```


    有了这个简单的配置，你就可以访问并挂载 CIFS 共享。


    ## 使用 CIFS


    使用 CIFS 需要理解服务器的角色和权限。


    ### 域名解析


    在 FreeBSD 挂载共享之前，它需要找到主机。虽然现代 Windows 网络使用 DNS 查找主机，但 WINS 在旧网络上可能仍然有用。许多大型公司在后台仍运行着
    WINS。


    ### 挂载 CIFS


    要挂载共享，请使用 `mount_smbfs` 命令。根据需要为挂载的文件指定用户和组。


    ```bash

    # mount_smbfs //username/fileserver/share /mnt

    ```


    如果需要提供密码，系统会提示。一旦有了有效密码，FreeBSD 即可挂载共享。


    ### CIFS 文件所有权


    Windows 和 Unix 类系统的权限方案完全不同。结合来看，这意味着在挂载 CIFS 共享时需要注意权限。CIFS 挂载默认使用与挂载点相同的权限。如果我将共享挂载到
    /mnt，文件将获得 root:wheel 所有权 755 模式。如果挂载在 /home/mw1/mnt，文件将属于用户 mw1 以及目录指定的权限。


    你可以使用 -u 和 -g 选项为挂载的文件指定用户和组。同样，使用 -d 修改目录模式，使用 -f 修改权限模式。在这里，我专门指定挂载的文件属于 smb
    用户和组，并更改权限使得只有用户可以访问文件。


    ```bash

    # mount_smbfs -u smbfs -g smb -d 700 -f 600 //mw1/fileserver/corporate /mnt

    ```


    ### CIFS 与大小写


    Windows 文件系统对大小写不敏感。FreeBSD 倾向于保留发现文件时的大小写，但这可能并非尽如人意。自动化进程可能会发现大小写一致的文件更容易识别。-c
    标志告诉 mount_smbfs(8) 为所有内容赋予统一的大小写。使用 -c 1 将所有内容转换为小写，-c u 将所有内容转换为大写。


    '
