    # FUSE Prerequisites


    FreeBSD implements its FUSE support as a kernel module, fuse.ko. Load it with
    kldload(8), or at- boot-time in /boot/loader.conf.


    Using FUSE requires access to the /dev/fuse device. By default, only root and
    users in the operator group get access. Assigning users with FUSE privileges to
    operator is reasonable on some systems. If that doesn''t suit your environment,
    create a special group for FUSE and use a devd(8) rule to assign /dev/fuse to
    that group owner. If you want unprivileged users to have access to FUSE, you''ll
    need to set the vfs.usermount to 1.


    We''ll use the FUSE SSH module as an example. Once you understand how to use sshfs(1),
    deploying other modules should be a matter of understanding the module''s target—that
    is, to deploy the FUSE NTFS module, you''ll need to dive into NTFS. After covering
    sshfs we''ll delve into details of FreeBSD''s mount_fusefs(8), which lets you
    fine-tune how FreeBSD treats FUSE filesystems.'
  - '[PAGE 192]


    # SSHFS


    The fusefs-sshfs FUSE module lets mount a remote directory over SSH. This lets
    you treat a remote filesystem as local, and run commands on files stored on the
    remote host. Once you''ve installed the package, use sshfs(1). You''ll need two
    arguments: the remote host, and the directory on which you want the SSH filesystem
    mounted.


    I strongly encourage use of public key authentication with SSH. If you''re still
    using password-based authentication with SSH, check out any number of online tutorials
    or your SSH Mastery (Tilted Windmill Press, 2012).


    Here use sshfs(1) as a regular user, mounting my home directory on the server
    mail on a directory I own, $HOME/mnt.


    ```

    $ sshfs mail: mnt/

    ```


    If I go into the mnt directory I''ll see the files from my home directory on the
    server. I can move, copy, and rename these files as I.


    The sshfs module deliberately shares such syntax with the SSH client. To use a
    different username, put it before the hostname, separated by an “at” sign. If
    you want to mount a different directory, put that directory after the colon. Change
    the port with -p and the port number.


    ```

    $ sshfs -p 2222 mail:/tmp mnt/

    ```


    To unmount the sshfs, use umount(8) as normal.


    ```

    $ umount /home/mnt/mnt

    ```


    If you have weird behavior, add the -d to enable FUSE debugging. The sshfs command
    won''t detach from the terminal, instead showing only debugging information as
    you use the filesystem.


    ```

    $ sshfs -d mail: mnt/

    ```


    Use sshfs(1) for many more options, most of which most of us won''t need. Most
    of these exists as arguments to -o, exactly as in sshfs(1).


    # Permissions and Execution


    FUSE filesystems get treated differently than other filesystems.


    Only the user who mounted a FUSE filesystem can access it. While root can see
    that a user has mounted a FUSE filesystem, it can''t see the contents of that
    filesystems. Attempts to cd into that directory will be met with “Operation not
    permitted.”'
  - '[PAGE 193]


    Also, file ownership and privileges on the FUSE-mounted filesystem might not directly
    match the permissions on the local filesystem. I can mount a remote filesystem
    with sshfs, and sshfs doesn''t coordinate user and group IDs between my workstation
    and the server. I can manipulate those remote files exactly as if I was logged
    in at a command line. My workstation might support NFSv4 ACLs, but files mounted
    via sshfs use whatever permission scheme the SSH server uses.


    Finally, just because an sshfs mount has files that are executable, don''t assume
    that those programs will actually function on your host. You''ll need the correct
    shared libraries, and any other resources the program requires. I find that many
    of my simple shell scripts don''t work the way I expected when run on a sshfs
    mount, as I wrote assuming they''d only be executed on the server.


    # Sharing FUSE Filesystems


    FreeBSD''s FUSE allows only the user who mounted the filesystem to access it.
    The root user can override this, making a FUSE filesystem available to everyone.
    Most FUSE modules have an option to request this behavior. For sshfs, it''s the
    allow_other option. (You''ll also see an allow_root option, but that has no effect
    on FreeBSD.) Here I specifically mount an SSH FUSE filesystem so that anyone can
    access it.


    ```

    # sshfs -o allow_other mnt@local:/mnt

    ```


    This can only be run by root. Using allow_other as a non-root user triggers an
    error.


    Because of the nature of FUSE, this mount point lacks all permissions protections.
    Any user who can access /mnt gains complete access to the SSH session underlying
    the filesystem. Carefully restrict access to this directory!


    FUSE opens nearly limitless storage options. One of them might fix your intractable
    problem. For more details on FreeBSD''s FUSE implementation and management, mount_fusefs(8).'
