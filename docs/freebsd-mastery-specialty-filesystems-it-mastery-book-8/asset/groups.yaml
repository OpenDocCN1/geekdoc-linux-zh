    # Disk Images


    You can mount UFS images with mdmfs, but it''s far more common to mount ISO or
    UDF images. FreeBSD''s tar(1) can extract files from ISO images thanks to libarchiva¹,
    that''s often overkill. Also, ISO images are read-only. You can inflict fumble-fingered
    damage on files extracted with tar(1), but ISOs resist tampering. Also, libarchive
    cannot extract files from pure UDF images. Sometimes your simplest choice is mounting
    a disk image.


    To mount a disk image, use mdconfig(8) to attach the file to a vnode-backed memory
    device. When you give a filename as an argument, mdconfig assumes you want to
    use the file as a filesystem.


    ```

    # mdconfig FreeBSD-10.2-RELEASE-amd64-disc1.iso

    d1

    ```


    In response you get the device node for this memory disk, md1. Now use the proper
    mount command to mount this filesystem.


    ```

    # mount -t cd9660 /dev/md1 /media

    ```


    Remember that mount(8) assumes that all filesystems are UFS unless told otherwise.


    When you''re done accessing the image, unmount the image and destroy the memory
    disk device as you would any other memory device.


    # Disk Images and /etc/fstab


    You can specify a memory device in /etc/fstab and attach it to a disk image. Give
    the filesystem type as mfs. Specify the filesystem is read-only, and use the -F
    flag to give a path to the disk image. At boot this entry creates memory device
    md10, attaches it to /iso/stuff.iso, and mounts it at /.


    ```

    md10 /stuff mfs ro, -F/iso/stuff.iso @ @

    ```


    The system will need to access the disk image in the early boot process. If the
    image isn''t available, the process will hang. You might need to use noauto for
    disk images in a home directory, for example.


    By combining the noauto mount option and autofs (Chapter 12), the system can mount
    the image when needed and automatically unmount it when it''s not in use.


    You can also use mdconfig_md entries in /etc/rc.conf to configure memory disks
    at boot, and then use simpler /etc/fstab entries, but that method is less flexible
    than pure /etc/fstab'
