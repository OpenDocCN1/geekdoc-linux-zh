    ## 挂载 UDF


    UDF 支持并不等同于读取商业 DVD 和蓝光光盘。商业光盘（如用于电影的光盘）是加密的。在开源操作系统上没有免费的解决方案可以观看 DVD 或蓝光光盘。


    ## 创建 UDF


    一旦进入了干净的 shell，使用 `-dev-compat` 和 `-z` 标志将你的 UDF 镜像刻录到刻录机 `/dev/burner`。


    # growofs -dev-compat -Z /dev/burner/imagefile


