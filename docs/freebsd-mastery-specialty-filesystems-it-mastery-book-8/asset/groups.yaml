    # Chapter 11: NFSv4 Access Control Lists


    Using FreeBSD as a storage back end for a corporate NFS or CIFS file store requires
    replicating the organization’s structure and information control in file permissions.
    The traditional Unix user/group/everyone model just won''t cut it. You need an
    access control model that lets you construct permissions and privileges any way
    you need.


    That''s where Access Control Lists, or ACLs, come in.


    ACLs let you select from a list of privileges, and apply them to any system user
    or group, creating rules for who may access what. You want a file readable by
    anyone in the company, but editable only by the people in Billing, except for
    Fred, because he kicked off the chief accountant? An ACL can do that. Maybe you
    have some files that users want to be able to write to, but not delete. That’s
    an ACL. Or perhaps you have dozens of users, each of whom gets slightly different
    access to a specific file. An ACL can do that. You’ll go bonkers from administrative
    overhead, mind you, but it’s possible.


    While understanding ACLs is pretty straightforward, the actual practice of implementing
    and managing ACLs quickly gets complicated. The reason Windows NTFS ACLs are so
    frequently cursed is not because they’re on Windows. It’s because people use ACLs
    to map and emulate human relationships, and human relationships often merit cursing.
    Ponder any large organization you’re a member of, and all the ways different groups
    of people in that organization want to offer and control access. Imagine writing
    rules in software to emulate that. Plus, today’s heroic employee is tomorrow’s
    scapegoat, so you’ll have to redo everything at random intervals.


    The key to successful ACL management is simplicity. Don’t assign ACLs just because
    you can. Assign them when needed.


    ACLs are always interpreted on the local host. If you’re sharing a filesystem
    via NFS or Samba, the client can think whatever it wants about the mounted share
    and can issue requests accordingly. The server interprets any ACL itself, though,
    and responds to the client as the ACL dictates.'
  - '[PAGE 168]


    # ACL types


    While many different styles of Access Control Lists have been implemented over
    the years, the three you''ll encounter most often today are POSIX, NTFS, and NFSv4.


    Portable Operating System Interface (POSIX) is a set of standards for operating
    system interoperability. One proposed POSIX standard, POSIX.1e, describes a set
    of Access Control List behaviors. The proposed ACL standard underwent several
    revisions, and many operating systems implemented one of those revisions. Everyone
    who implemented these draft ACLs assumed that they''d update their implementation
    when the final draft became a standard. At the end, though, POSIX.1e was not adopted
    as a standard. All of these operating systems have highly differently “POSIX”
    ACL implementations. FreeBSD supports POSIX.1e ACLs, but they''re not recommended,
    and so I don''t cover them. Anything that can be implemented with a POSIX ACL
    can also be implemented with an NFSv4 ACL.


    Microsoft created NTFS Access Control Lists. The NTFS ACL model has more features
    and types of access control than POSIX ACLs, and is widely deployed in enterprise
    environments. Entries in an NFS ACL are processed in order, on a first-match basis.


    NFSv4 ACLs were created as part of the NFS version 4 negotiations. They closely
    resemble NTFS ACLs, and were specifically created to allow Unix-like hosts to
    better serve Windows clients. They''re so close that NFSv4 ACLs can be used on
    a Samba server and managed via Windows security tools. Like NTFS ACLs, entries
    in an NFSv4 ACL are processed in order. Unlike other ACLs, each privilege is checked
    separately. The first matching rule for each privilege wins. A request can accumulate
    these privileged from several different access rules.(See “ACE Ordering and Deny”
    for more discussion.) Also like NTFS, NFSv4 ACLs default to denying. If you need
    ACLs on FreeBSD, use NFSv4.


    FreeBSD''s NFSv4 ACL implementation is deliberately modeled after that found in
    OpenSolaris-derived operating systems. The management interface differs, but the
    various permissions and ACL handling traces OpenSolaris fairly closely. Other
    operating systems implement them differently. Linux, for example, implements its
    NFSv4 ACL support atop POSIX ACLs, something compliant for most users.


    This chapter does not cover everything there is to know about NFSv4 ACLs. The
    NFSv4 specification is about 135,000 words, or almost three times the size of
    the entire'
- md: "\nbook, and the ACL details are layered throughout it. Much of that is written\
    \ in pseudocode. Converting that to a systems administration text would fill many\
    \ volumes, and would include lots of stuff a sysadmin doesn't need (or want!)\
    \ to know. The goal is to orient you to how NFSv4 ACLs function and behave, so\
    \ that you can make vaguely sensible design decisions and have a reasonable hope\
    \ of identifying and solving common problems.\n\n## ACLs and Filesystems\n\nAll\
    \ ACL implementations require support in the underlying filesystem. UFS supports\
    \ POSIX and NFSv4 ACLs. Both UFS and ZFS support NFSv4 ACLs, but they behave slightly\
    \ differently. I'll give the details in “ACL Inheritance” later this chapter,\
    \ but here are the basics.\n\nZFS is preferable for NFSv4 ACLs, and ZFS enables\
    \ them by default. ZFS offers two modes of passing directory ACLs down to files\
    \ and subdirectories. Users who want the more popular way of inheriting ACLs,\
    \ the one expected by Windows clients, need to set the properties `acmode` and\
    \ `aclherit` to `passthrough` on any dataset before creating any files or directories\
    \ that will need ACLs. Set this value before creating any files or applying any\
    \ ACLs.\n\nYou can use NFSv4s on UFS filesystems. UFS filesystems support only\
    \ one method of ACL inheritance, however, and while it's the less popular method,\
    \ it might do for you. You must enable ACLs with the `nfsv4acls mount(8)` option.\n\
    \n## ACL Format\n\nNFSv4 Access Control List contains a list of Access Control\
    \ Entries (ACEs). Each ACE describes the permissions assigned to a single entity\
    \ such as a user, a group, or everyone on the system. The easiest way to understand\
    \ ACLs is to look at a simple one. Use getfacl(1) to view the ACL on a file or\
    \ directory.\n\nHere I have a file with very common permissions.\n\n```\n# ls\
    \ -l file1\n-rw-rw-r-- 1 mwl Nov 16 13:16 file1\n```\n\nI have not assigned any\
    \ ACLs to this file. The owner can read, write, and execute the file, members\
    \ of the owning group can read and write the file, and everyone else can read\
    \ it. Let's see how these permissions show up as an ACL.\n\n```\n# getfacl file1\n\
    # file: file1\n# owner: mwl\n# group: mwl\nowner@rwwx::allow\ngroup@rw--a-R-C--s::allow\n\
    everyone@------a-R-C--s::allow\n```\n\nWhere did this ACL come from? It's built\
    \ out of the standard file permissions. Once I apply an ACL to this file, the\
    \ filesystem permissions and the ACL diverge. This ACL contains three ACE entries,\
    \ each with four colon-separated fields.\n\nThe first field, the ACL tag, gives\
    \ the type of entity this ACL applies to. For the first entry, owner@, says that\
    \ ACE is for the file owner. The second ACE tag, group@, means this ACL is for\
    \ the group owner, while the third, everyone@, represents everyone on the system\
    \ (“Everyone” in traditional Unix means “everyone except the owner and group owner”),\
    \ while in NFSv4 ACLs it means “everyone including the owners.”\n\nThe second\
    \ field gives the ACL permissions assigned to the tag. The first three characters\
    \ of each should look familiar; they’re the standard Unix-style permissions for\
    \ this user or group. For example, the tag owner@ (representing the file owner)\
    \ gets rw-, just as you see in ls -l. These get a whole bunch of new settings,\
    \ though, represented by the jumble of letters after the leading three. We’ll\
    \ see what privilege each letter represents in “ACL Permissions,” later this chapter.\n\
    \nThe third field gives any inheritance settings for the files and directories.\
    \ Files and directories can inherit ACL settings from their parent directories\
    \ or directories above them. As this file has built its ACL out of standard Unix-style\
    \ permissions and there’s no on the parent directory, it hasn't inherited any\
    \ ACL-specific information.\n\nThe last entry, the ACL type, says that matching\
    \ items are either allowed or denied.\n\nNow let's look at a file with ACL.\n\n\
    ```\n# ls -l file2\n# rwx-rw-r+ 1 mwl mwl 0 Nov 16 13:47 file2\n```\n\nNote that\
    \ the standard Unix-style permissions are identical to the first file we looked\
    \ at. The permissions end with a (+) sign, however. This indicates extended permissions,\
    \ or an ACL. Let's look at these permissions. I am adding the -q flag, to eliminate\
    \ commented-out information at the top.\n\n```\n# getfacl -q file2\nuser:jkh:rwx--aARWccos:allow\n\
    owner:rwx--aARWccos:allow\ngroup:rw-p--a-R-C--S:allow\neveryone:@-----a-R-C--S:allow\n\
    ```\n\nThese permissions are very similar to the ones for files, but the ACL has\
    \ an Access Control Entry. The first non-commented line has five fields. What\
