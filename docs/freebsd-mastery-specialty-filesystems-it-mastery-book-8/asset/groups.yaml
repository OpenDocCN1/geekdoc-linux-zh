    \n在许多情况下，系统管理员在数据协调方面挣扎，最终放弃，并通过删除一个 HAST 设备的副本、重新初始化并让 HAST 重新同步来解决脑裂问题。为了恢复服务，他们接受了少量的数据丢失。\n\
    \n一旦你协调了脑裂引起的数据差异，就可以重新同步两个 HAST 提供者。你不能告诉 HAST 在两个设备之间来回传输比特，直到两个设备完全同步。相反，你必须清除并重新初始化\
