    服务器不支持 TCP，你需要使用 UDP 挂载。`udp` 挂载选项启用 UDP。


    NFS 服务器比硬盘更容易从网络中消失。使用 NFS 共享的程序可能会一直挂起，直到 NFS 服务器返回，而这种返回可能永远不会发生。请使用可中断的挂载（interruptible
    mounts）在文件系统消失时停止程序。你可以通过 `CTRL-c` 中断挂在不可用但可中断的 NFS 挂载上的进程。使用 `intr` 选项使挂载变为可中断。


