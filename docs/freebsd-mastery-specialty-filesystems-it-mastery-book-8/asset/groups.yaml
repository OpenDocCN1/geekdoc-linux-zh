  raw:
  - '[PAGE 134]


    really bad day.


    Always consider what happens in a catastrophic failure. Suppose one of your HAST
    nodes catches fire and needs complete replacement. The replacement HAST secondary
    node must initialize its copy of the HAST data. HAST, unlike ZFS, does not understand
    the filesystem running on top of it. If you have a measly 4 TB drive backing your
    highly available storage, the backup must transfer all four terabytes over the
    network. How fast is your network interface, 1 Gb/s? Your 4 TB drive holds roughly
    32,000 gigabits. Unless your network interface can actually send a full gigabit
    per second (unlikely, but let''s be generous), reinitializing mirror will take
    almost nine hours.


    Make your HAST providers no larger than necessary to fulfill their purpose. Perhaps
    you truly do need that 4 TB drive.


    In most cases, I recommend using ZFS as the back end for HAST storage. You can
    easily clone and snapshot zvols (when not) something goes wrong. If you''re using
    U, use a disk image file instead. For these examples, both of your HAST hosts
    are using a 1 GB ZFS volume, zroot/hasta. This application stores only the very
    latest or most vital data on this. This reduces recovering lost HAST nodes to
    seconds.


    One goal in designing your HAST configuration should be to minimize the amount
    of metadata you need to synchronize. You can use four zvols as the backing store
    for HAST and then build a striped mirror on top of them, but then you must pass
    a bunch of ZFS metadata back and forth between the hosts. Networked disk is already
    slow—why make it slower? It''s more efficient and faster to put a single redundant
    device beneath your HAST, and handle any filesystem redundancy locally. If you
    need multiple HAST devices as separate entities, go ahead and use them. Just don''t
    do your mirroring on the client side.


    You can use HAST on larger filesystems, but this requires that you pay careful
    attention to filesystem integrity and system administration practice. A multi-terabyte
    HAST-backed filesystem can go right on a disk partition, but demands a configuration
    with the maximum number of safety checks possible. If restoring your redundant
    storage takes nine hours, you''ll want to perform that restoration as rarely as
    possible.


    # Configuring HAST


    Configure HAST with hastctl(8) and in /etc/hasta.conf. The configuration file
    should be identical on both hosts. I strongly recommend maintaining the file in
    a config management tool such as Ansible or Puppet to guarantee consistency.'
  - "[PAGE 135]\n\nHAST calls each mirror of block devices a resource. A minimal hast.conf\
    \ describes a single resource, without any special options. Each host in the mirror\
    \ has a subsection within the resource description. Here's a hast.conf for bare\
    \ minimum replication.\n\n```\nresource hasti {\n on www1 {\n  local /dev/zvol/root/hasti1\n\
    \  remote 192.0.0.2\n}\n on www2 {\n  local /dev/zvol/root/hasti1\n  remote 192.0.0.1\n\
    }\n}\n```\n\nThis creates a single HAST device, called mirror1. Two hosts support\
    \ this, www1 and www2. You must use the actual hostname for each host. Each host\
    \ has two mandatory settings, where to find the local and remote parts of the\
    \ mirror. For this mirror I created the ZFS volume hasti1 on each host. I also\
    \ give the IP address where the remote mirror is found. (These two hosts happen\
    \ to be connected by a private cable).\n\nSome HAST configuration happens only\
    \ within a resource entry. Any configuration can be outside any resource, and\
    \ applies to all resources. The integrity options discussed later, can be set\
    \ on a global level so they apply to all resources. Options in a resource entry\
    \ override global settings.\n\nUse hastctl(8) to initialize the HAST resource\
    \ on both nodes. Then enable and start hastd(8) on both hosts.\n\n```\n# hastctl\
    \ create hasti\n# sysrc hastd_enable=YES\nhastd_enable: NO -> YES\n# service hastd\
    \ start\n```\n\nUse hastctl(8) to tell the primary node that it's primary for\
    \ the resource hastl.\n\n```\n# hastctl role primary hasti\n```\n\nOn the secondary\
    \ node, use hastctl to set it as a backup.\n\n```\n# hastctl role secondary hasti\n\
    ```\n\nThe first time you create the device and assign roles, HAST quickly initializes\
    \ your storage device.\n\n# HAST Status\n\nTo check the status of a HAST device,\
    \ use hastctl status. If you add the name of a HAST"
  - '[PAGE 136]


    resource, you''ll see only that resource. Here I look at the sample HAST resource
    I just created.


    ```

    # hastctl status hast1

    Name Status Role Components

    hast1 complete primary /dev/zvol/zroot/hast1 192.0.2.2

    ```


    This shows a single resource, hast1. The status, complete, means that the two
    hosts are synchronized. We then have this host''s role in the HAST mirror, primary,
    and the storage nodes that are part of this resource.


    To see more complete statistics for a host''s HAST resources, use hastctl list
    and (if desired) the resource name. This gives everything from the number of dirty
    blocks to the number of local write errors.


    # HAST Filesystems


    Each HAST resource has a device node in /dev/h, named after the resource. Device
    nodes for a particular resource appear only on the primary host for that resource.
    Our sample resource, hast1, is available as /dev/h/hast1 on the primary node.


    > Here I create a ZFS pool on the HAST resource


    ```

    # zpool create hast1 /dev/h/hast1

    ```


    You can use newfs(8) if U is preferable. I strongly recommend using soft journaling
    newfs -j on UFS.


    For UFS or ZFS alike, setting noatime helps reduce the amount of HAST traffic
    and makes it easier for your hosts to synchronize the HAST device.


    When your primary and secondary hosts switch roles, the device node for the HAST
    resource appears on the secondary node.'
  - '[PAGE 137]


    # HAST Failover


    Switching a HAST host from the secondary role to primary requires demoting the
    primary

    node and promoting the secondary node.

    nThe unceremonious way to promote the primary node is to yank the power. For a
    more

    decorous migration, though, start by deactivating everything using the HAST resource.

    Shut down programs writing or reading to the resource, and unmount the filesystem
    or

    export the zpool.


    ```

    # zpool export -f hast

    ```


    You can use hastctl role the primary node to tell it it''s now the secondary node.

    hastctl role secondary hasti


    The host is now standing by waiting for someone to claim the primary for this
    resource.

    Both nodes will have a status somewhat like this.


    | Name Status Role Components |

    | hast1 - secondary | /dev/zvol/zroot/hasti 192.0.2.2 |


    The status on both hosts is a dash, indicating that this resource is idle.


    Over the backup node, claim the primary role and import the pool.


    ```

    # hastctl role primary hasti

    # zpool import hasti

    ```


    If you''re using UFS, run fsck before mounting the filesystem. While the filesystem

    should be clean after you manually switch roles, a fsck before mounting the filesystem
    is

    best practice. On small filesystems fsck doesn''t take long, and on large filesystems

    really need to use soft updates journaling.'
  - "[PAGE 138]\n\n# Synchronization and Integrity Options\n\nWhile HAST's default\
    \ behavior is acceptable for most uses, you can fine-tune synchronization between\
    \ hosts to best fit your environment and requirements. You can adjust the replication\
    \ mode, the use of checksums, compression, and more.\n\nThese options are either\
    \ set per-resource or globally. Setting an option globally, outside of any resource,\
    \ means that it applies to every HAST resource in the configuration file. Here\
    \ I set the replication option.\n\n```\nreplication fullsync\n```\n\n```\nresource\
    \ hasti {\n  on www1 {\n  }...\n```\n\nSome resources might have different performance\
    \ or integrity requirements than others. You can set these options on a per-resource\
    \ basis. Here I set the replication option for the resource hast1.\n\n```\nresource\
    \ hasti {\n  replication fullsync\n  on www1 {\n  }...\n```\n\nSet options whenever\
    \ needed.\n\n# Replication Mode\n\nHAST replication mode controls when the operating\
    \ system acknowledges writing the data to disk. As filesystems can work in synchronous\
    \ mode, asynchronous mode, or something in between, HAST lets you decide when\
    \ the kernel should tell the application that a write is complete. Replication\
    \ mode heavily impacts the apparent speed of the storage system. Many programs\
    \ that write to disk will not proceed to the next step until the system storage\
    \ acknowledges receipt of the data. Experienced admins call this “blocking on\
    \ disk.\"\n\nThe default mode, memync, acknowledges the write the data is on the\
    \ primary host's disk and in the secondary host's memory. The data doesn't need\
    \ to be on the secondary host's disk, only in memory. The secondary host will\
    \ store the data right away as part of normal operation, the program can proceed\
    \ without waiting for the disk.\n\nThe safest way to use HAST is fullsync mode.\
    \ HAST only acknowledges receipt of a write when it's safely on disk on both the\
    \ primary and secondary nodes. This guarantees"
- md: "\nthe data makes it to disk. The writes must leave the primary node, traverse\
    \ the network, pass through the secondary node, and get on the secondary node's\
    \ disk before the application can move on. If your data is critical, you probably\
    \ want fast disk hardware and fullync mode.\n\nMemsync is faster than fullync,\
    \ but increases risk. If the secondary node fails at exactly the wrong moment,\
    \ that data won't get to disk. If the primary node fails while the secondary node\
    \ is rebooting, that data might be entirely lost on both nodes. HAST exists below\
    \ the filesystem, data might corrupt the filesystem. When I truly need redundant\
    \ block device storage on multiple machines, I use fullync mode. If my application\
    \ can't take the small performance hit, I reconsider your decision.\n\nHAST also\
    \ has async mode, where it acknowledges data as soon as it's written to the primary\
    \ node's disk. The data will be sent to the secondary node, and get written to\
    \ the disk there, but the program won't wait for that. Async mode dramatically\
    \ increases the risk of data loss, as the primary node might fail before the secondary\
    \ node receives data.\n\nEvery time I've used async mode, I've regretted it. The\
    \ only time you should consider async mode is if the secondary node is so far\
    \ away from the primary that the speed of light induces unacceptable latency.\
    \ Even then, I would encourage re-architecting your application rather than using\
    \ async mode.\n\nSet the replication mode with the *replication* keyword and the\
    \ desired value.\n\n```\nreplication fullync\n```\n\nReplication mode is only\
    \ one way to manage integrity, though.\n\n## Checksum\n\nHAST can calculate a\
    \ checksum for each chunk of data, and transmit that checksum with the data. The\
    \ secondary host uses checksum to verify that the data it writes to disk is the\
    \ same as the data the primary host sent.\n\nThe HAST checksum is not intended\
    \ for protection against a malicious attacker. Both the checksum and the data\
    \ are transmitted in plain text on the same wire. An intruder who can alter data\
    \ can also alter the checksum to match. Checksums are useful for detecting transmission\
    \ errors, however, HAST supports CRC32 and SHA256 checksums.\n\nSet the checksum\
    \ with the *checksum* keyword.\n\n```\nchecksum sha256\n```\n\nI always use a\
    \ checksum in production. Most modern systems have processing power that far exceeds\
    \ their disk or network throughput. Calculating SHA256 checksums requires more\
    \ processing power than calculating the CRC32 checksums. The CRC32 checksum is\
    \ perfectly adequate to catch the common sorts of bit errors you'll encounter.\
    \ Personally, I’m still a SHA256 bigot.\n\nBy default, HAST does not use any checksums.\
    \ You must enable them if you want them.\n\n## Compression\n\nCompression exchanges\
    \ processor time for network bandwidth. If you have a lot of disk writes, compressing\
    \ them can reduce the amount of bandwidth HAST requires so that it will actually\
    \ fit on your network. Use the *compression* keyword to set a compression method.\n\
    \nHAST defaults to *hole* compression, which means that only blocks made up of\
    \ zeros get compressed. Compression vastly accelerates resource initialization,\
    \ as a brand-new disk device contains only zeros. It doesn't do much for day-to-day\
    \ performance, however.\n\nIf you want to routinely compress data, HAST supports\
    \ the *lzf* compression algorithm. LZF gets used in many places, including in\
    \ ZFS. Compression won't hurt, but it doesn't help as much as you might. Enabling\
    \ LZF in HAST when you have LZF compression on the ZFS filesystem on top of the\
    \ HAST device won't do you much.\n\nYou can also completely disable compression\
    \ with the *none* option.¹.\n\n```\nlzf\n```\n\nI normally use LZF, because when\
    \ compression doesn't help it will hurt.\n\n## Metadata Flushing\n\nHard drive\
    \ write caches can make the hardware put data on disk out of order. HAST might\
    \ tell the drive to write block A and then block B, but the write cache can get\
    \ in the middle and decide to write block B first. If block B requires block A,\
    \ though, and the system fails between writing the two blocks, the hardware has\
    \ corrupted your filesystem. This is most common with metadata.\n\nThe *metadataflush*\
    \ option tells `hast` to automatically flush the write cache after every metadata\
    \ update. HAST normally flushes the write cache after updating metadata. If the\
    \ hardware doesn’t support write cache flushing, though, HAST stops trying to\
    \ flush it.\n\nI'm not aware of any time you would want to set metaflush to off.\
    \ I only bring up this option to encourage you to buy good hard drives that support\
    \ write cache flushing.\n\n## HAST Networking\n\nYou can control how HAST listens\
    \ to the network, where it binds to address. The listen keyword is only useful\
    \ for connections. HAST defaults to all addresses. You can choose the IP address\
    \ and port in the per-host section.\n\n```\non www1 {\n  listen 192.0.2.1\n}\n\
    \non www2 {\n  listen 192.0.2.2\n}\n```\n\nYou can also change IPv6 as well.\n\
    \n```\nlisten 0.0.0:80\n```\n\nThe remote keyword goes next to configuration,\
    \ and lets you define the peer. The source keyword is necessary if the primary\
    \ node fails, the system will to switch the secondary node to primary.\n\n```\n\
    on www1 {\n  local /dev/zroot/hast1\n  remote 192.0.2.2\n}\n\non www2 {\n  source\
    \ 192.0.2.1\n}\n```\n\nYou would need to use source if your host has multiple\
    \ addresses on that subnet.\n\n## Failures, Startup, and Split Brain\n\nA HAST\
    \ pair with only one working node enters the degraded state. If a HAST node reboots,\
    \ the other node sees the HAST as degraded.\n\nIf the primary node fails, presumably\
    \ you or the system will switch the secondary node to primary until the other\
    \ node comes back to life. Or, maybe.\n\nThis uncertainty dictates a key aspect\
    \ of HAST behavior. While you can start hastd on boot, HAST makes no assumptions\
    \ about the peer state. At system boot, HAST devices enter the init state. They’re\
    \ ready for action, as you tell them how they fit into world.\n\n```\n# hastctl\
    \ status\nName Status Components\nhast1 init /dev/zroot/hast1 192.0.2.1\n```\n\
    \nYou must use hastctl after the system boots to tell each HAST device its role.\n\
    \nIn operation, you’d think that a newly booted HAST server would assume a secondary\
    \ role so that the primary can send all the updates to bring the freshly booted\
    \ device up to date. That would work—except when machines are newly booted. When\
    \ both machines boot simultaneously they’ll sit there, wait for the other to claim\
    \ the primary role, and while /var/log/messages. You need a way for one node to\
    \ claim the primary role. If you have a log-watching program, you could have it\
    \ promote a preferred node when the relevant log message appears. You could log\
    \ in and manually promote one of the nodes to primary. FreeBSD can automatically\
    \ promote one of the nodes through CARP and devd(8), as discussed in Chapter 10.\n\
    \nHAST behaves curiously because it is possible to have multiple hosts simultaneously\
    \ claim the primary role, causing a split brain condition. Each host modifies\
    \ the HAST device as it thinks should, and sends updates to the HAST peer. The\
    \ peer doesn’t listen, because it thinks it’s the master. On each copy of the\
    \ device differs. It’s your job to figure out how to resolve those differences.\n\
    \nIf software can readily examine the data on the HAST devices—say, if ls(1) displays\
    \ what you need to know—you could programmatically resolve the difference by shell\
    \ scripting. If they’re more complex records, such as a database or logs, you’ll\
    \ need to\n"
  mdcn: "\n数据必须写入磁盘。写入操作必须离开主节点，穿越网络，通过备节点，并到达备节点的磁盘，应用程序才能继续运行。如果你的数据至关重要，你可能需要快速的磁盘硬件和\
    \ `fullync` 模式。\n\n`memsync` 比 `fullync` 快，但增加了风险。如果备节点在恰好错误的时间点故障，数据将无法到达磁盘。如果主节点在备节点重启期间故障，这些数据可能在两个节点上都完全丢失。HAST\
    \ 运行在文件系统之下，数据可能会损坏文件系统。当我确实需要在多台机器上冗余块设备存储时，我会使用 `fullync` 模式。如果我的应用程序无法忍受微小的性能损失，我会重新考虑你的决定。\n\
    \nHAST 还有 `async` 模式，该模式在数据写入主节点磁盘后立即进行确认。数据将发送到备节点并在那里写入磁盘，但程序不会等待该操作。`async`\
    \ 模式极大增加了数据丢失的风险，因为主节点可能在备节点接收到数据之前故障。\n\n每当我使用 `async` 模式，我都会后悔。只有当备节点距离主节点非常远以至于光速会导致无法接受的延迟时，你才应该考虑\
    \ `async` 模式。即便如此，我也鼓励你重新架构应用程序，而不是使用 `async` 模式。\n\n使用 *replication* 关键字和所需的值设置复制模式。\n\
    \n```\nreplication fullync\n```\n\n不过，复制模式只是管理完整性的方法之一。\n\n## 校验和 (Checksum)\n\
    \nHAST 可以为每块数据计算校验和，并将校验和随数据一起传输。备主机使用校验和来验证写入磁盘的数据与主主机发送的数据相同。\n\nHAST 校验和并非旨在防止恶意攻击者。校验和和数据都以明文形式在同一条线路上传输。能够修改数据的入侵者也可以修改校验和以与之匹配。然而，校验和对于检测传输错误非常有用，HAST\
    \ 支持 CRC32 和 SHA256 校验和。\n\n使用 *checksum* 关键字设置校验和。\n\n```\nchecksum sha256\n\
    ```\n\n我在生产环境中始终使用校验和。大多数现代系统的处理能力远超过其磁盘或网络吞吐量。计算 SHA256 校验和所需的处理能力比计算 CRC32 校验和更多。CRC32\
    \ 校验和完全足够捕捉你会遇到的常见位错误。个人而言，我仍然是一个 SHA256 偏执者。\n\n默认情况下，HAST 不使用任何校验和。如果你想使用它们，必须启用它们。\n\
    \n## 压缩 (Compression)\n\n压缩是用处理器时间换取网络带宽。如果你有大量的磁盘写入，压缩它们可以减少 HAST 所需的带宽，使其实际上能够适应你的网络。使用\
    \ *compression* 关键字设置压缩方法。\n\nHAST 默认使用 *hole* 压缩，这意味着只有由零组成的数据块会被压缩。压缩极大地加速了资源初始化速度，因为一个全新的磁盘设备只包含零。然而，它对日常性能没有太大帮助。\n\
    \n如果你想常规地压缩数据，HAST 支持 *lzf* 压缩算法。LZF 被用于许多地方，包括 ZFS。压缩并无害，但它提供的帮助可能没有你想象的那么大。如果你在\
    \ HAST 设备上的 ZFS 文件系统上开启了 LZF 压缩，那么在 HAST 中启用 LZF 对你没太大帮助。\n\n你还可以通过 *none* 选项完全禁用压缩¹。\n\
    \n```\nlzf\n```\n\n我通常使用 LZF，因为当压缩没有帮助时，它反而会有害。\n\n## 元数据刷新 (Metadata Flushing)\n\
    \n硬盘写入缓存可能会导致硬件无序将数据放在磁盘。HAST 可能会告诉驱动器写入块 A 然后写入块 B，但写入缓存可能会介入并决定先写入块 B。然而，如果块\
    \ B 需要块 A，且系统在写入这两个块之间发生故障，那么硬件就损坏了你的文件系统。这在元数据上最为常见。\n\n*metadataflush* 选项告诉\
    \ `hast` 在每次元数据更新后自动刷新写入缓存。HAST 通常会在更新元数据后刷新写入缓存。然而，如果硬件不支持写入缓存刷新，HAST 将停止尝试刷新它。\n\
    \n我不知道在任何情况下你会将 `metaflush` 设置为 `off`。我提到这个选项是为了鼓励你购买支持写入缓存刷新的良好硬盘。\n\n## HAST\
    \ 网络 (Networking)\n\n你可以控制 HAST 如何监听网络，以及它绑定到哪个地址。`listen` 关键字仅对连接有用。HAST 默认监听所有地址。你可以在每个主机的部分选择\
    \ IP 地址和端口。\n\n```\non www1 {\n  listen 192.0.2.1\n}\n\non www2 {\n  listen 192.0.2.2\n\
    }\n```\n\n你也可以更改 IPv6。\n\n```\nlisten 0.0.0:80\n```\n\n`remote` 关键字紧跟配置之后，允许你定义对端。如果主节点故障，系统会将备节点切换为主节点，此时\
    \ `source` 关键字是必要的。\n\n```\non www1 {\n  local /dev/zroot/hast1\n  remote 192.0.2.2\n\
    }\n\non www2 {\n  source 192.0.2.1\n}\n```\n\n如果你的主机在该子网上有多个地址，你就需要使用 `source`。\n\
    \n## 故障、启动与脑裂 (Failures, Startup, and Split Brain)\n\n仅有一个工作节点的 HAST 配对会进入降级（degraded）状态。如果\
    \ HAST 节点重启，另一个节点会将 HAST 视为降级。\n\n如果主节点故障，系统会将备节点切换为主节点，直到另一个节点恢复。或者，也许吧。\n\n\
    这种不确定性决定了 HAST 行为的一个方面。虽然你可以在启动时启动 hastd，但 HAST 对对端状态不做任何假设。在系统启动时，HAST 设备进入 init\
    \ 状态。在告诉它们如何融入世界之前之前。\n\n```\n# hastctl status\nName Status Components\nhast1\
    \ init /dev/zroot/hast1 192.0.2.1\n```\n\n你必须在系统启动后使用 `hastctl` 告诉每个 HAST 设备其角色。\n\
    \n在运行时，你可能会认为新启动的 HAST 服务器应该假设从用角色，以便主节点发送所有更新以使新启动的设备同步。这将可行——除非机器是同时启动的。当两个机器同时启动时，它们会坐在那里等待另一个节点占据主角色，并在\
    \ /var/log/messages。你需要一种方法让一个节点占据主角色。如果你有一个日志监控程序，可以让它在相关日志消息出现时提升首选节点。你可以登录并手动将其中一个节点提升为主节点。FreeBSD可以通过\
    \ CARP 和 devd(8) 自动提升一个节点，正如第 10 节所述。\n\nHAST 的行为很奇怪，因为可能出现多个主机同时声称主节点，导致脑裂（split\
    \ brain）状况。每个主机按照它认为应该的方式修改 HAST 设备，并将更新发送给 HAST 对端。对端不监听，因为它认为自己是主。每个设备副本上的内容都不同。解决如何处理这些差异是你的工作。\n\
    \n如果软件可以方便地检查 HAST 设备上的数据——例如，如果 ls(1) 显示了你需要的信息——你可以通过 shell 脚本程序地解决差异。如果它们是更复杂的记录，例如数据库或日志，你将会\n"
