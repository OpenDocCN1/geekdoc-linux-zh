    子目录，因此子目录保留其自身的 ACL。


    如果你创建一个新的子目录，它将继承来自父目录的新 ACL。

    该新子目录中的文件不会继承该 ACL。


    这与你在微软系统上的体验没有区别。更改目录中的 ACL 并使其传播到以该目录为根的整个目录树，会导致每个文件都产生大量的磁盘抖动。递归地更改整个 ZFS 目录树的
    ACL 可能需要两个 `find(1)` 命令：一个用于文件，另一个单独用于目录。你最好的做法是在应用新 ACL 之前，使用 `-b` 参数从文件中读取 ACL。


    ## Umask 与 ACL 继承


    如果你在 UFS 上使用 ACL，或者你不想使用 ZFS 的透传模式（passthrough mode），那么用户的 umask 决定了 ACL 中权限的上限。如果你不熟悉
    umask 以及文件创建时的权限，请查阅 `umask(2)` 以及互联网上的任何任意数量的教程。任何系统管理员在开始考虑实现 ACL 之前，必须理解 umask。


    FreeBSD 的默认 umask 是 022，这意味着创建文件时的模式允许所有者读写，而组和其他其他人都只能读取。如果你使用此 umask 并创建一个文件，这些就是该文件拥有的最高权限。如果你继承的
    ACL 说“其他其他组应该对该文件有读写权限”，而你的 umask 说“其他人在创建文件时获得只读权限”，那么 umask 胜出。


    FreeBSD 给用户默认 022 的 umask 有非常充分的。在某些情况下，增加 umask 是有意义的——在某些共享系统上，我将 umask 设置为
    027，这样随机系统用户就无法查看我的文件内容。降低 umask 通常没有意义。


    如果你不使用 ZFS 的 ACL 透传功能，那么在受 ACL 保护的目录树部分工作时，你需要将 umask 降低到 0，完成后后再将其恢复到 022。我懒得记住去这样做，既然透传模式已经为我处理好了它。


    ## ACE 排序与拒绝（Deny）


    NFSv4 ACL 按照首次匹配原则进行处理。然而，匹配并不会触发整个 ACE。相反，每个权限都会被单独检查。请考虑以下文件。


    ```

    # touch daft

    # chmod 157 daft

    # ls -l daft

    -xr-wwx 1 mwl 0 Nov 19 14:55 daft

    ```


    这确实是一个愚蠢的文件。所有者可以执行它。组所有者可以读取和执行它。除了所有者之外，每个人都可以读写、读取和执行它。你你在现实世界中也绝对不应该这样做。


    ```

    # getfacl -v daft

    owner@-rw-p----: deny

    group@--w-p----: deny

    owner@--X--aARWCoCos: allow

    group@-r--x-a-R-C-S allow

    everyone@rwx-a-R-C-S-- allow

    ```


    这是我第一次在 ACL 中看到拒绝（deny）ACE，所以让我们快速提一下这一点。


    通常情况下，拒绝 ACE 应该出现在 ACL 的开头。特别是微软客户端，当拒绝语句与允许（allow）语句混杂出现时会大发雷霆。唯一出现在允许语句之后的拒绝
    ACE 是位于末尾的隐式拒绝。不过，ACL 并没有将所有拒绝语句都放在文件的开头。对文件运行 `chmod 0101` 并查看 ACL。


    当一个主体（principal）尝试访问文件时，它尝试使用的每个权限都会被单独检查。每次检查都会通过 ACL “向下查找”，直到遇到主体和权限的匹配。


    假设所有者想要执行 `daft` 文件。第一个 ACE 中的主体是所有者。这个 ACE 特别禁止读取和写入，但对执行未字未言。我们检查下一个 ACE，以及下一个，直到某个
    ACE 允许执行、某个 ACE 显式拒绝执行，或者我们遇到了终端的隐式拒绝。


    这个例子看起来很平凡，但同样的理论也适用于复杂的 ACL。用户可能作为一个主体的成员获得一种权限访问，然后作为另一个主体的成员获得第二个权限。每个单独的权限检查都会穿过
    ACL，直到被授予用户或被拦截。


    ## ACL 与 Samba


    NFSv4 ACL 最常部署在 Samba 4 服务器（http://www.samba.org）上，作为 CIFS 的存储后端。这里有几件经常让这些系统管理员困惑的事情，感谢
    John Hickson，他是那个回答大多数 ACL 问题的 FreeNAS 支持人员。


    - 始终使用 ZFS。一旦你有了 ZFS，始终用于 Samba 的数据集始终将 `aclmode` 和 `aclinherit` 设置为 `passthrough
    On`。

    - 不要使用 world可写的文件（模式 777），或使用 000 umask。如果你这样做，你会遭受痛苦。

    - 目录上的 Windows 搜索需要至少对 `rxaRc` 权限拥有允许。

    - ACL 可能比本章中的示例复杂得多。记住，简单是成功 ACL 部署的关键。祝你好运。


    在 ACL 之后，FUSE 和 autofofs 将显得完全微不足道。


