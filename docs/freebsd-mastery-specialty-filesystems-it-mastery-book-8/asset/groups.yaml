    # 关于本书


    我们将从你可能会发现的本地连接文件系统开始，例如 Linux 文件系统、ISO 9660（用于 CD）和可移动介质。然后，我们将介绍逻辑文件系统，它们仅存在于运行系统的内存中。这包括内存文件系统、devfs(5)、联合挂载（union
    mounts）等。随后，我们将介绍网络文件系统，包括 NFS、iSCSI 和 CIFS。最后，我们将讨论自动挂载器（automounter）和 FUSE，这些你可以部署用来将存储整合在一起的胶水。


    第一章“外国文件系统”涵盖了其他操作系统的文件系统。FreeBSD 可以以不同程度访问 Microsoft FAT 以及某些类型的 Linux EXT 和
    ReiserFS 文件系统。它还可以访问跨平台文件系统，如 CD-ROM 和蓝光磁盘上的文件系统。


    第二章“devfs”讨论了用于 /dev 的设备文件系统。FreeBSD 的文件系统动态地管理设备。你可以控制系统如何管理硬件，以及当硬件出现或消失时 FreeBSD
    采取的行动。


    第三章“命名空间文件系统”涵盖了进程文件系统等信息性文件系统。FreeBSD 还包括特殊文件系统，提供对文件描述符和可移植操作系统接口（POSIX）消息队列的视图。


    第四章“重组文件系统”描述了空挂载（null mounts）和联合挂载（union mounts），这些是使用和重定向传统文件系统的方法。


    第五章“内存文件系统”概述了两种基于内存的文件系统。你将学习何时使用每种系统，以及如何使用内存磁盘查看磁盘镜像。


    第六章“网络文件系统”讨论了悠久的 NFS 协议。FreeBSD 支持从旧的第 2 版本到第 4.1  NFS。


    第七章“通用互联网文件系统客户端”涵盖了 FreeBSD 对访问由 Windows 风格 CIFS 服务器提供的文件共享的内置支持。


    第八章“iSCSI”讨论了互联网 SCSI 的管理，或者通过 IP 访问类磁盘设备。FreeBSD 包含高性能的 iSCSI 启动器和目标器。


    第九章“GEOM_GATE 和 HAST”概述了 FreeBSD 分享类磁盘设备自定义自定义方法。


    第十章“网络化磁盘故障转移”讨论了如何使用 iSCSI 或 HAST 等工具创建高可用存储，这些工具建立在通用地址冗余协议（CARP）之上。


    第十一章“NFSv4 访问控制列表”涵盖了为最新版本的网络文件系统创建的行业标准扩展权限方案。


    第十二章“文件系统胶水”讨论了通过文件系统相关工具简化系统管理的方法。FUSE（即用户空间文件系统）允许你使用第三方模块访问不支持的文件系统，或转换数据使其以文件系统的形式呈现。最后，FreeBSD
    可以自动挂载可移动和动态生成的文件系统，这对于工作站来说是一个非常实用的功能。


    本书不涵盖磁带存储。也不涵盖打孔卡。即使对于一本关于特种文件系统的书来说，它们也太特殊了。


    # 第一章：外国文件系统


    FreeBSD 可以读写由其他操作系统使用的文件系统。你可以从非 FreeBSD 机器上获取磁盘，将它们挂载到你的 FreeBSD 主机上，并从中读取文件。对于本书而言，任何使用
    UFS 或 ZFS 以外文件系统的永久性物理存储都是外国文件系统。FreeBSD 支持多种外国文件系统，但它们在 FreeBSD 上的行为可能与在原生操作系统上不同。Linux
    文件系统不支持 FreeBSD 风格的文件标志，而派自 FAT 的文件系统不支持文件权限或所有权。


    本章讨论了各种 Microsoft FAT 文件系统、CD 使用的 ISO 9660 标准、大型可移动存储使用的通用数据格式（UDF）以及 Linux EXT
    和 ReiserFS 文件系统。我们将从使用可移动介质的基础开始。


    # 可移动介质


    现代计算机有多种可移动存储介质，从 CD 和 USB 设备到外接硬盘。你们中的某些人可能还藏着软盘，可能是为了翻新那些古老的嵌入式设备。


    处理可移动介质的操作几乎与使用永久连接的存储完全一样，但稍微复杂一些。不过，任何一个可移动介质可能只偶尔使用，而且有时没有用的（或任何）文件系统分区表。


    # 可移动介质设备节点


    使用可移动介质需要知道介质的设备节点。设备节点取决于设备类型。USB 驱动器、硬盘和闪存显示为 /dev/sd。CD 和蓝光磁盘等光光磁盘显示为 /dev/cd。软盘为
    /dev/fd。


    识别设备最简单的方法是查看 `geomcontrol` 的输出。此命令显示所有可用设备、其大小和分区方案。


    （注：由于原始文本存在大量 OCR 错误，此处根据逻辑进行了修正重建）

    使用可移动介质需要知道介质的设备节点。设备节点取决于设备类型。USB 驱动器、硬盘和闪存显示为 /dev/sd。CD 和蓝光磁盘等光电磁盘显示为 /dev/cd。软盘为
    /dev/fd。


    识别设备最简单的方法是查看 `geomcontrol` 的输出。此命令显示所有可用设备、其大小和分区方案。

