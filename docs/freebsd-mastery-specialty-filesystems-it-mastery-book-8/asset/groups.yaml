    # ACL Permissions


    What do all of those permissions letters mean, anyway? Let''s dismantle them and
    find out.


    Each permission can be represented by either a single character (such as x or
    c) or a name (such as execute read_acl). Remembering what all these letters mean
    is annoying, though. If you use the -v flag to getfacl(8), you''ll get the name
    of each privilege rather than the letter code.


    ```

    # getfacl -qv file2

    user:jkh:read_data/write_data/execute/append_data/read_attributes/write_attributes/read_xattr/write_x_

    ...

    ```


    Even the most cryptic names are slightly easier to remember than single letters.


    You can use the long names in commands, rather than the separate letters. Separate
    long names by slashes, as shown above. The single-character privileges don''t
    need any separators.


    Here are the privileges grouped by general functions: reading, writing, deletion,
    and others. We''ll also discuss privilege groups.


    # Read Permissions


    Permissions control a user''s ability to access information in a file.


    The read_data (r) permission controls access to the file''s contents, exactly
    like the standard Unix-style read permission. This permission usually, but not
    necessarily, comes with access to all the other read privileges.


    The read_attributes (a) permission determines access to Unix-level metadata, such
    as the inodes and size, rather than the file. If a principal lacks this, he can
    see the file exists using ls(1), but requesting details with ls -l generates an
    error. You can see the file exists, but nothing about the file. If the user uses
    the read_data permission but lacks read_attributes, he can cat(1) the file, but
    not view the file''s size, timestamp, xattr, and so on.


    The read_xattr (k) permission is ignored on FreeBSD and Solaris. Theoretically,
    it lets the principal read extended attributes other than those used for ACLs.
    While UFS and ZFS have extended attributes for storing special data, most sysadmins
    never need to access them.


    The read_acl (c) privilege permits reading the special subset of extended attributes
    that'
  - '[PAGE 174]


    contain ACL data. If a user has read_data but doesn''t have read_acl, running
    ls(1) on the file shows the file and gives an error. The ls command can''t check
    the ACL to see if it should print the + sign after the permissions. Perversely,
    the presence of the error is a giveaway that the file does have additional attributes
    that the user is not allowed to.


    # ## Write Permissions


    These permissions control a user''s ability to change a file.


    The write_data (w) privilege is identical to the standard Unix-style write permission.
    The principal can change the file. This privilege usually, but not necessarily,
    comes with all of the other write permissions as well.


    The append_data (a) privilege is intended to allow the principal to add data to
    the end of the file, but not overwrite it. Both OpenSolaris and FreeBSD ignore
    this flag on files, and check for write_data instead. For directories, though,
    append_data lets the principal create a subdirectory. For this reason, it''s a
    good idea to always assign append_data with


    write_data.


    The write_attributes (A) privilege lets the principal arbitrarily change the access,
    modification, and creation timestamps on a file. A user who can write a file could
    programmatically change all of the timestamps on a file to, say 23 February 1972,
    without otherwise accessing the file. Lacking this privilege doesn''t mean these
    times don''t change when the user accesses the file; rather, it means that the
    user can''t change them by means other than accessing, modifying, or creating
    the file.


    The write_attr (w) privilege is ignored on FreeBSD and Solaris. (In theory, it
    would allow the principal to write extended attributes on the file, other than
    ACLs.)


    The write_acl (c) privilege allows the principal to edit the ACLs on a file.


    The write_owner (o) privilege permits changing ownership on the file. Without
    this privilege, shown(8) and chgrp(1) will not work. It is disabled for normal
    users, for security reasons. You don''t want users executing scripts to root.


    # ## Deletion Permissions


    You can use ACLs to remove the ability to delete a file, through the delete and
    delete_child privileges.


    The delete_child (o) privilege controls a principal''s ability to delete files
    within'
