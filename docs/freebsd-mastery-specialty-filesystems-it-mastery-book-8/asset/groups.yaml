    ## 消息文件系统


    某些消息和进程管理设施也实现为文件系统或类文件系统功能。最流行的是文件描述符文件系统和 POSIX 消息队列。只有当应用程序需要时，你才需要这些文件系统。


    ## 文件描述符文件系统


    文件描述符文件系统 dfscs(5) 让进程以文件系统的方式访问自己的文件描述符。文件描述符包括标准输入（描述符 0）、标准输出（1）、标准错误（2）以及程序创建的任何描述符。


