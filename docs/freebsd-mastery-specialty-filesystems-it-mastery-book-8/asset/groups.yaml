    # About This Book


    We''ll start with filesystems you might find locally attached, such as the Linux
    filesystem, ISO 9660 (used for CDs), and removable media. Then we''ll cover logical
    filesystems, which exist only in the memory of a running system. This includes
    memory filesystems, devfs(5), union mounts, and more. We''ll proceed to network
    filesystems, including NFS, iSCSI, and CIFS. Finally we''ll discuss the automounter
    and FUSE, glues you can deploy to hold your storage together.


    Chapter 1, "Foreign Filesystems," covers filesystems from other operating systems.
    FreeBSD can access filesystems as Microsoft FAT and certain types of Linux EXT
    and ReiserFS, to varying degrees. It can also access cross-platform filesystems
    like those on CD-ROMs and Blu-ray disks.


    Chapter 2, "devfs," discusses the device filesystem used for /dev. FreeBSD’s filesystem
    dynamically manages devices. You can control how the system manages hardware and
    how FreeBSD takes action when hardware appears or disappears.


    Chapter 3, "Namespace Filesystems," covers informative filesystems like the process
    filesystem. FreeBSD also includes special-filesystems that offer views into file
    descriptors and Portable Operating System Interface (POSIX) messaging queues.


    Chapter 4, "Rearranging Filesystems," describes null mounts and union mounts,
    ways to use and redirect traditional filesystems.


    Chapter 5, "Memory Filesystems," gives an overview of two different memory-based
    filesystems. You''ll learn when to use each, and well as using memory disks to
    view disk images.


    Chapter 6, "Network File System," discusses the venerable NFS protocol. FreeBSD
    supports NFS from the old-fashioned version 2 up to NFS version 4.1.


    Chapter 7, "Common Internet File System Client," covers FreeBSD’s built-in support
    for accessing file shares served by Windows-style CIFS servers.


    Chapter 8, "iSCSI," discusses management of Internet SCSI, or accessing disk-like
    devices over IP. FreeBSD includes a high-performance iSCSI initiator and target.


    Chapter 9, "GEOM_GATE and HAST," gives an overview of FreeBSD’s custom methods
    for sharing disk-like devices.


    Chapter 10, "Networked Disk Failover," discusses creating highly available storage
    with tools like iSCSI or HAST, building on top of the Common Address Redundancy
    Protocol (CARP).


    Chapter 11, “NFSv4 Access Control Lists,” covers the industry standard extended
    permissions scheme created for the latest version of the Networked File System.


    Chapter 12, “Filesystem Glues,” discusses ways to simplify systems administration
    through filesystem-related tools. FUSE, or Filesystems in User Space lets you
    use third-party modules to access unsupported filesystems, or transform data so
    that it’s presented as a filesystem. Finally, FreeBSD can automatically mount
    removable and dynamic filesystems, a very useful feature for workstations.


