    这两个权限确实不适用于任何其他地方。


    执行 (x) 权限允许用户作为程序运行文件或打开目录。这与使用 `chmod(8)` 分配执行位相同。我仍然鼓励你通过组而不是个人来管理对程序的访问权限，但使用
    ACL 可以允许你为多个组设置执行权限。与 `chmod(8)` 一样，对解释型脚本（如 shell 或 Perl 脚本）拒绝执行权限并不能阻止用户通过将其作为解释器的参数来运行脚本。你可以禁止某人运行
    `/home/mwl/script.sh`，但如果他们可以读取该文件，就可以运行 `/bin/sh /home/mwl/script.sh`。


    同步 (s) 权限在 FreeBSD 和基于 OpenSolaris 的系统上被忽略。它允许文件在服务器端和客户端同时同步访问，这作为文件系统的一部分已经实现了。


    ## 权限集


    某些权限适合批量授予或撤销。如果一个用户应该能够写入文件，你将希望他拥有所有权限。读取文件而不报错，以及查看文件元数据的能力。这就是权限集大显用场。权限集没有单字符表示形式。


    `full_set` 包含所有权限。主体允许或拒绝访问所有内容。


    `modify_set` 授予主体除 `write_acl` 和 `write_owner` 之外的所有权限。他不能更改文件所有权或文件的 ACL，但可以通过任何其他方式对其进行修改。


    `read_set` 赋予主体读取文件、其元数据、ACL 以及任何扩展属性的能力。


    最后，`write_set` 允许用户写入文件、元数据及其扩展属性，但不能写入其 ACL。


    ## 所有者的隐式 ACE


    文件所有者始终拥有 `read_acl`、`write_acl`、`read_attributes` 和 `write_attributes` 权限，即使它们没有出现在
    ACL 的任何 ACE 中。用户无法把自己锁在文件外面——那需要系统管理员来。


    ## 设置 ACL


    现在你已经了解了一些这些 ACL 权限的含义，让我们来应用它们吧。使用 `setfacl(8)` 来编辑 ACL。


    ACE 的顺序在解释 ACL 时至关重要，在本章后面的“ACL 排序与拒绝”部分将讨论这一点。许多更改需要你选择一个插入新 ACE 的位置，或者选择要删除的
    ACE 编号。ACL 中的 ACE 从 0 开始编号，就像书中的章节一样。


    ## 添加 ACE


    使用 `-a` 标志向 ACL 添加访问控制条目（ACE）。该标志接受两个参数：你想要插入此 ACE 的规则编号以及 ACE 本身。你可以提供多个用逗号分隔的
    ACE。多个 ACE 将按照你提供的顺序进行插入。然后是要更改的文件。


    这里是我们示例的原始 ACL。


    ```

    # getfacl -q file2

    user:jkh:rxwx--aARWCos::allow

    owner@rxwx--aARWCos::allow

    group@rxwx--a-R-C-s::-allow

    everyone@r-----a-R-C-s::-allow

    ```


    用户 jkh 的 ACL 与文件所有者的 ACL 相同。


    我赋予用户 phk 与用户 jkh 相同的权限，所以我复制了更改原则，并尽可能去掉连字符。在添加 ACE 时，你可以将 `user` 简化为 `u`。我需要将此
    ACE 插入到第 1 行。


    ```

    # setfacl -a 1 u:phk:rxwxpaARWCos::allow file2

    ```


    该文件具有以下 ACL。


    ```

    user:jkh:rxwx--aARWCos::allow

    user:phk:rxwx--aARWCos::allow

    owner@rxwx--aARWCos::allow

    group@rxwx--a-R-C-s::-allow

    everyone@r-----a-R-C-s::-allow

    ```


    用户 phk 和 jkh 拥有完全权限，这可能会让他们都感到不快。


    以用户为单位管理 ACL 是一种糟糕的做法。理想情况下，我们应该为 phk 和 jkh 担任的角色创建一个系统组。否则，你的 ACL 会迅速变得非常大。每当一个人变换职位时，你都需要更改该用户访问的所有文件的
    ACL。使用组来管理一切（即使组最初只有一个人）要更具可持续性得多，而且更不容易让系统管理员抓狂。在添加 ACE 时，我们可以将 `group` 简化为 `g`。在这里，我为
    phk 和 jkh 创建了一个系统组，并为他们的访问添加了一个组 ACE。我没有使用整个权限列表，而是使用了 `full_set` 权限。


    ```

    # setfacl -a 1 g:phk_jkh:full_set::allow file2

    ```

