    - V: permission to write the name of the file\n- K: permission to write the extended\
    \ attributes\n- c: permission to write the ACLs\n- o: permission to change the\
    \ owner\n\n## Execute Permissions\n\nExecute permissions control a user's ability\
    \ to execute the file.\n\nThe (x) permission is the standard Unix execute permission.\
