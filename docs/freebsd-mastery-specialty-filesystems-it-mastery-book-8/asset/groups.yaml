  - '[PAGE 158]


    to suit your environment and prejudices. I did.


    # HAST Failover Scripts


    When hastd starts, it places all HAST devices in init mode. They’re ready to do
    something, as soon as you tell them what to do. This is for safety reasons; if
    two hosts both decide that they’re the primary node for the same HAST devices,
    and you server both develop a split brain error.


    When you’re designing a HAST-backed failover system, remember that HAST synchronizes
    devices in serial, rather than parallel. A host must synchronize every HAST device
    before switching roles. If a host has eight HAST devices, the slowest part of
    the failover process will take eight times longer than it would with only one
    device.


    You can automatically put your HAST devices in the secondary role safely, however.
    If the other node has been running and assumed the master role, everything will
    just work. If both nodes boot simultaneously, they’ll be in secondary mode. Services
    won’t be up, but you won’t have data loss. You must hastctl after hastd starts,
    however. Here’s a very stripped-down rc.d script that accomplishes this. I’ve
    skipped most of the recorder(8) functions, as putting your HAST devices in a usable
    state isn’t really a.


    ```

    #!/bin/sh


    # PROVIDE: hastctl

    # REQUIRE: hastd

    ```


    ```

    hastctl role secondary hast1

    hastctl role secondary hast2

    ```


    Make an entry for each of your HAST devices. Or add loops, for fancy. If you have
    so many HAST devices that you need loops, though, reconsider your application
    architecture. It’s best to put ZFS redundancy below the HAST devices. Remember,
    the purpose of sending ZFS metadata over HAST is to make your redundant disk slower.
    Copy this script to /usr/local/etc/rc.d/hastctl and make it executable.¹


    These failover scripts assume that your ZFS pools have the same name as your HAST
    resources. Each pool should have only one device beneath it—remember, any redundancy
    belongs below the HAST device.


    If you use UFS with HAST, also name your UFS mount points after your HAST resources.
    Replace the zpool(8) commands with calls to unmount(8).'
