    On the plus side, directories for the available NFS shares now exist.


    This mail server exports /var/log via NFS. Once I try to examine /net/mail/var/log
    on my workstation, autofs mounts the NFS share on that directory. I have whatever
    access the mail server is configured to permit, exactly as if my sysadmin had
    mounted this share for me.


    If an NFS server disappears, mount requests can still hang. That’s why autofs
    defaults'
