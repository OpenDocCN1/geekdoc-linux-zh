    ## Chapter 7: Common Internet File System Client


    The typical office shares network drives via Microsoft’s Common Internet File
    Sharing (CIFS) protocol. CIFS also gets called the Windows “Network Neighborhood,”
    Server Message Block (SMB), and “why can’t I map that drive?” While originally
    available on Microsoft operating systems, these days anything with even modest
    aspirations as a corporate file server supports SMB and CIFS.


    Strictly speaking, SMB is a lower-level protocol. Microsoft considers CIFS a particular
    dialect of that protocol.


    FreeBSD includes the smbutil(8) program to find, mount, and use CIFS shares as
    a CIFS client. FreeBSD does not include a CIFS server in the base system, but
    the open source CIFS server Samba (www.samba.org) works very well on FreeBSD.
    Samba is a topic that fills books much larger than this one, so we won’t go there.


    FreeBSD’s CIFS support allows you to operate with existing Windows infrastructure.
    You wouldn’t deploy CIFS to support Unix systems—use NFS for that instead.


    ## Prerequisites


    You need a few pieces of information before you can even try to mount a CIFS share.
    First, get a valid username and password with access to your share, along with
    the Windows domain name. Your host needs the ability to find the fileserver; the
    IP address of the Windows DNS server will do, or alternately the hostname or IP
    of the fileserver you want to mount a share from.


    On the FreeBSD side, you''ll need to load the smbfs.ko kernel module. This brings
    the modules libiconv.ko and libmchain.ko along for the ride. You can load these
    automatically at boot time with a /boot/loader.conf entry.


    ```

    smbfs_load=YES

    ```


    With this ready, you can configure CIFS.


    ## CIFS Configuration


    Unlike NFS or iSCSI, you can only manage CIFS with a configuration file. CIFS
    is potentially far more complex than either of those. The main configuration file
    is /etc/nsmb.conf, but users can have personal configurations in $HOME/.nsmbrc.
    Any configuration in /etc/nsmb.conf overrides a user''s personal settings. Both
    files use the same configuration syntax and keywords, while this book refers to
    nsmb.conf, a user can perform the same type of configuration in their personal
    config file.


    The configuration file is divided into sections. Each section starts with a label,
    in square brackets. Settings that apply to every CIFS connection are in the [default]
    section. You''ll create other labels to provide configuration settings by server,
    username, and share, like this.


    - [server]

    - [server:user]

    - [server:user:share]


    Settings that apply to an entire server go into a section named after that server.
    Settings that apply only to a specific user on a server go in a section named
    after the server and the user. Settings that apply only to a single share go in
    a section named after the server, and the user, and the share name.


    Configure FreeBSD''s CIFS client using the values from the CIFS host. You cannot
    log into a Windows host with your FreeBSD account credentials.


    ## nsmb.conf Keywords


    Configure CIFS by putting keywords and values in the appropriate sections. Assign
    values to keywords with an equals sign (=). While nsmb.conf(5) lists every valid
    keyword, here are the ones you''ll almost certainly need.


    ### workgroup


    The workgroup keyword specifies the name of the Windows domain. Workgroups were
    the predecessor to domains. Almost all CIFS servers have a Windows domain.


    ```

    workgroup=BigOrg

    ```


    ### nbns


    Set the IP address of a NetBIOS (WINS) nameserver with the nbns. You can put this
    line in the [default] section or under a particular server. For most environments,
    use the IP of the domain controller.


    ```

    nbns=203.0.113.8

    ```


    While modern Windows networks use DNS to find hosts, WINS might still be useful
    on older networks. Many huge corporations still have WINS kicking around in back
    offices.


    ### password


    The password keyword lets you set a clear-text password for a user or share. If
    you must post passwords in nsmb.conf, be absolutely certain that root can read
    the file. On a multi-user system, storing passwords in $HOME/.nsmbrc is a terrible
    idea. Automatically mounting a share at boot requires using a hard-coded password,
    however.


    FreeBSD lets you assign a scrambled password to this keyword. The scrambling is
    easily reversed, but protects the password against casual exposure. Scrambled
    passwords start with double dollar signs ($). Scramble your password with smbutil
    crypt.


    ```

    # smbutil crypt RealPassword

    $15e5a3b0c32f01e9f2f8db

    ```


    Use password in a section with user information.


    If the server''s role requires access, rather than using your own account, ask
    your Windows team for an account that only has access to mount the share.


    Taken as a whole, the user mwl on the server filesize in the workgroup mwl you
    might wind up with an /etc/nsmb.conf much like this.


    ```

    [default]

    nbns=203.0.113.12

    workgroup=MwL

    [FILESERVER:mwl]

    password=$$1744a412a293f03

    ```


    Given this simple configuration, you can access and mount CIFS shares.


    ## Using CIFS


    Working with CIFS requires understanding the server''s role and permissions.


    ### Name Resolution


    Before FreeBSD can mount a share, it needs to find the host. While modern Windows
    networks use DNS to find hosts, WINS might still be useful on older networks.
    Many huge corporations still have WINS kicking around in back offices.


    ### Mount CIFS


    To mount a share, use the mount_smbfs command. You can specify the user and group
    for mounted files as needed.


    ```

    # mount_smbfs //username/fileserver/share /mnt

    ```


    If you need to provide a password, you will be prompted for one. Once you have
    a valid password, FreeBSD can mount the share.


    ### CIFS File Ownership


    Windows and Unix-like systems have utterly different permissions schemes. Combined,
    these mean you need to pay careful attention to permissions when mounting CIFS
    shares. A CIFS mount defaults to using the same permissions as the mount point.
    If I mount the share on /mnt, the files will get root:wheel ownership and mode
    755. If mounted on /home/mw1/mnt, the files will be owned by the user mw1 and
    whatever permissions the directory dictates.


    You can specify a user and group for mounted files with the -u and -g options.
    Similarly, use -d to change the directory mode and -f to change the permissions
    mode. Here I specifically assign my mounted files to be owned by the user and
    group smb, and change the permissions so that only the user can access the files.


    ```

    # mount_smbfs -u smbfs -g smb -d 700 -f 600 //mw1/fileserver/corporate /mnt

    ```


    ### CIFS and Case


    Windows filesystems are case-sensitive. FreeBSD tends to leave the case on files
    as it finds it, but that might not be desirable. Automated processes might find
    it easier to identify files with consistent case. The -c flag tells mount_smbfs(8)
    to give everything a consistent case. Using -c 1 changes everything to lowercase,
    -c u changes everything to uppercase.

