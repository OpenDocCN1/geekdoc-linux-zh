    \ configuration you might have.\n\nIf you're one of the very few who can't use\
    \ the special maps, you can create custom maps to automatically mount directories\
    \ and media. The auto_master(5) man page gives the whole syntax for /etc/auto_master\
    \ and custom maps. In (but not all) cases, using a custom map is an administrative\
    \ choice rather than a technical necessity.\n\nWe'll focus our attention on the\
    \ special maps.\n\n## auto_master\n\nThe file /etc/auto_master points to the automounter\
    \ maps. Each line is a single mapping, with two or three parts: the mount point,\
    \ the name of the map, and if desired any options. \nThe default configuration\
    \ contains only one uncommitted map, the NFS special map.\n\nThis map controls\
    \ the mount point /net. It uses the map named -hosts. When something checks for\
    \ directories under this mount point, autofofs mounts the requested NFS share\
    \ with the options nosuid and intr. The nobrowse option is specific to autofofs,\
    \ and prevents autofofs from automatically creating subdirectories for all the\
    \ hosts in /etc/hosts.\n\nAny time you edit auto_master, you must run automount\
    \ to reconfigure the maps for the autofofs support daemons.\n\nAutofs attaches\
    \ to all mount points referenced in auto_master. Run automount -L to view all\
    \ directories.\n\n```\n# automount -L\n/net -browse, nosuid, intr -hosts\n```\n\
    \nThe /net directory now has an autofofs instance mounted on it, using the map\
    \ -hosts. As BSD filesystems are stackable you can mount something else on /net,\
    \ but you shouldn't unless unnecessary confusion am you.\n\n## /etc/autofs\n\n\
    You can put maps directly in /etc, or use special maps in /etc/autofs. Special\
    \ maps are scripts. Autofs runs the script when the mount point is accessed. Non-executable\
    \ files are almost certainly custom maps created by the sysadmin. Autofs opens\
    \ and parses these files like any other map.\n\nAll of the maps in the /etc/autofs\
    \ directory shipped with FreeBSD are special maps.\n\n## Automounting with Special\
    \ Maps\n\nFreeBSD comes with four special maps: -hosts, -media, -noauto, and -null.\
    \ (There’s also a special map to read map information from LDAP, but that’s highly\
    \ environment-dependent, so we won’t cover it.) You know a map is classed special\
    \ because its name in /etc/auto_master begins with a dash.\n\nThe -hosts special\
    \ map, in /etc/autofs/special_hosts, identifies the NFS shares available on a\
    \ host. When you trigger an NFS automount request, the special map queries the\
    \ NFS server to see what's available to you.\n\nThe -media special map in /etc/autofs/special_media\
    \ probes unmounted devices, like removable media, and helps mount them.\n\nThe\
    \ -noauto special map, /etc/autofs/special_noauto, checks /etc/fstab for devices\
    \ that are not automatically mounted at boot, and mounts them when you try to\
    \ use them.\n\nFinally, the -null special map /etc/autofs/special_null ties up\
    \ a mount point so that automount(d) can’t mount anything there.\n\n## Automounting\
    \ NFS\n\nLet’s try this automounting thing with NFS. My test network has two NFS\
    \ servers, mail and www. I know that my workstation can access shares on both\
    \ because I’ve previously mounted them manually.\n\nTo automount from a server,\
    \ look in a directory named after the server in /net. The directory won’t exist\
    \ before you look for it, but look anyway. Right now, my workstation’s /net is\
    \ empty. To see the shares available on the host mail, I cd or ls the /net/mail\
    \ directory.\n\n```\n# ls /net/mail\nusr var\n```\n\nNothing is actually mounted\
    \ at this point: autofs displays the available shares. On the plus side, directories\
