    # MSDOS Filesystems


    The File Allocation Table (FAT) is probably the lowest common denominator of filesystems.
    FAT dates back from the Microsoft DOS days, but has been updated over the years
    to support more modern systems.


    Today, FAT is mostly used for removable media as USB flash drives and, if you''re
    in a very dark place, floppy disks. FreeBSD has excellent support for reading,
    writing, and creating the various versions of FAT, lumping them all together as
    msdos filesystems.


    # Reading MSDOS Filesystems


    Tell mount(8) that a FAT filesystem is of type msdos, or use the mount_msdosfs(8)
    command to mount a FAT partition.


    ```

    # mount -t msdos /dev/da4s /media

    ```


    You don''t need any special arguments to mount older FAT types such as FAT16 or
    FAT12; FreeBSD automatically detects the FAT version on the media.


    You can mount FAT devices through their label names as they appear in /dev/msdosfs.


    # Creating MSDOS Filesystems


    Use newfs_msdos(8) to create a FAT filesystem. For most modern storage media


    Here I create an MBR partition table and a FAT partition on the 2 GB USB drive
    da4. (I chose to use MBR rather than GPT so that this drive is compatible with
    my old television.)


    ```

    # gpart create -s mbr da4

    da4 created

    # gpart add -t fat32 da4

    da4s1 added

    ```


    Now that this disk has a partition table, I can create a FAT32 filesystem on it.


    FreeBSD can assign a label to a FAT filesystem. Use -L and the label name. A FAT
    label can be up to 11 characters. Legitimate characters include alphanumeric,
    spaces, and a dozen basic symbol characters.


    ```

    # newfs_msdos -L label /dev/da4s1

    95304192 sectors 3016374 clusters (3278 bytes/cluster)

    BytesPerSector=512 SecClass=64 Resectors=32 FATs=Media=0xf0 SecTrack=6 Heads=255
    HiddenSec=0 HugeSectors=1953252105 FATcs=238410 RootCluster=2 FSInfo=1 Backup=2

    ```'
