    Specify the boot loader with -b. FreeBSD includes a boot loader for running FreeBSD
    from CD, /boot/cdboot. Unlike other boot loaders, cdboot does not emulate a floppy
    disk, so you''ll have to also add the -no-emul-boot flag.


