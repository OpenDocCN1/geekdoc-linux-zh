    ## Linux Filesystems


    FreeBSD supports the Linux filesystems ext2fs, ext3fs, ext4fs, and ReiserFS. These
    filesystems support many of the same features as UFS, and readily map to FreeBSD
    features. Some filesystems are better supported than others, however.


    In my experience, the best use for FreeBSD’s Linux filesystem support is to migrate
    a Linux system to a FreeBSD one. While you can copy files over the new, on a large
    system it’s faster to remove the hard drive from one machine, plug it into the
    new host, and copy from the old filesystem to the new one. FreeBSD can run Linux
    systems in a jail.


    Linux filesystem support is also useful on a dual-boot desktop or laptop, so you
    can access any Linux files while running FreeBSD. (In fairness, most Linux systems
    can also mount FreeBSD UFS partitions, and some of them can mount ZFS).


    We’ll discuss ext and ReiserFS separately.


    ## ext Filesystems


    FreeBSD classifies all ext systems as type ext2fs. The ext3fs and ext4fs filesystems
    are expansions and variations on ext2fs. You must load the kernel module /boot/kernel/ext2fs.ko
    before using any ext filesystem. There is no ext-specific mount command, so you
    must use mount(8)’s -t option to mount it.


    ```bash

    # mount -t ext2fs /dev/da42 /mnt

    ```


    FreeBSD has full-read support for ext2fs.


    While FreeBSD can read and write ext3fs, some features are missing. FreeBSD can’t
    journal inodes greater than 128 bytes are not supported. Linux extended attributes
    also don’t work, although many of those attributes don’t directly map to anything
    on FreeBSD, so that’s not terribly surprising.


    FreeBSD mounts all ext4 filesystems read-only. FreeBSD cannot write to ext4 filesystems.


    If you need to do a lot of work with ext filesystems, grab the e2fsprogs package.
    The tools you need to create and fsck(8) ext filesystems.


    ## ReiserFS


    Many ReiserFS features don’t map easily onto FreeBSD supports. While FreeBSD can
    mount ReiserFS volumes read-only, that support is best reserved for migrating
    from Linux, digital forensics, or other non-production uses.


    FreeBSD does not have a ReiserFS-specific mount(8) command. You must use the -t
    option to mount a ReiserFS volume.


    ```bash

    # mount -t reiserfs /dev/da4s /media

    ```


    You cannot create, repair, or edit ReiserFS volumes on FreeBSD. And there''s really
    no reason to add them to /etc/fstab.


    Now that you can manage local storage, let''s go on to FreeBSD’s only mandatory
    logical filesystem: devfs.


