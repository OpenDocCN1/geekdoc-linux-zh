    protocol.


    # NFS Server Options


    You can change how the NFS server connects to the network, which versions of NFS
    it supports, and how many servers it runs. You can also fall back to the older
    NFS server if needed. Set all of these options to nfsd(8), using the `nfs_server_flags
    in rc.conf` option.


    NFS can work over TCP or UDP. UDP is the traditional NFS transport protocol. TCP
    works better over lossy networks, and can cope better with varying network speeds.
    TCP is a stateful protocol, however. An interrupted TCP connection won''t transparently
    resume. Use the -u flag to enable UDP and -t for TCP. FreeBSD uses TCP by default
    but enables both. If you add your own mount flags, you must specify which protocol
    you want the mount to use.


    The NFS server, by default, listens to all IP addresses on a machine. This causes
    problems because UDP-based NFS is stateless, so replies to NFS requests can come
    from any IP address on the server, possibly confusing the clients. When an NFS
    server has multiple IP addresses, configure the NFS server to accept connections
    only on a single IP with the -n option and the desired IP.


    Servers that process NFS traffic from many clients might need additional instances
    of nfsd(8) to support those clients. The -n flag specifies how many copies of
    nfsd FreeBSD should start.


    This rc.conf entry tells FreeBSD to support both UDP and TCP connections, bind
    to the IP address 203.0.113.99, and run six copies of nfsd.


    ```

    nfs_server_flags="-u 203.0.113.99 -n 6"

    ```


    FreeBSD 9.0 has a completely new NFS kernel support, written so that FreeBSD could
    support NFSv4. It is possible that the new server has bugs (although it was extensively
    tested). By using the -o flag, you tell nfsd to use the old NFS server. One way
    to determine if a problem is specific to a FreeBSD server or somewhere else is
    to reproduce the problem with the old NFS server. If you find an NFS issue that
    doesn''t exist in the old NFS server, be sure to file a bug report.


    Your server is now ready to export filesystems or directories.


    # Export Configuration


    You can configure exactly what a server exports to which clients. You could export
    all directories and systems on the entire server, but that''s begging for people
    to take advantage of your server. If someone can edit any file on the server,
    she can also edit the exports configuration. An ideal NFS configuration permits
    as little as possible while letting it fulfill its duties and keep necessary files.
    While clients might need the files under /home, they probably don''t need to remotely
    mount the NFS server’s root filesystem.


    FreeBSD lets you configure exports in two different ways. You can configure all
    exports in /etc/exports. If a server uses ZFS, however, you can also configure
    exporting each dataset via the shares property. A ZFS-based server creates the
    file /etc/zfs/exports out of the property settings. Never edit /etc/zfs/exports
    by hand—always use the dataset shares property.


    Choose one method of managing your NFS exports. Either edit /etc/exports, or use
    zfs and /etc/zfs/exports. Using both simultaneously will at best confuse and frustrate
