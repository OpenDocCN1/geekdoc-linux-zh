    This FAT32 filesystem is ready for use. I now have a flash drive to hold Doctor
    Who seasons 7 through 11.


    If you need to create an older version of FAT, use the -F argument and the FAT
    version number. FreeBSD supports three versions of FAT: FAT12, FAT16, and FAT32.


    ```

    # newfs_msdos -F 12 /dev/da451

    ```


    Yes, some networks (open telecom) have hardware so old it only speaks FAT12. And
    you corrupt your servers were old!


    # Fixing FAT Filesystems


    FreeBSD is pretty good with FAT, but not everyone is so careful. If you have a
    device with a corrupt FAT, fsk_msdosfs(8) might be able to fix it.


    ```

    # fsk_msdosfs /dev/da451 ** /dev/da451 ** Phase 1 - Read and Compare FATs ** Phase
    2 - Check Cluster Chains ** Phase 3 - Checking Directories ** Phase 4 - Checking
    for Lost Files 1, 2074816 (64838 clusters)

    ```


    If fsk_msdosfs(8) finds an error, you have the option of "fixing" it. You should
    end up with a usable filesystem but not necessarily all the FATs you''d hoped
    to recover. With any filesystem, your ability to recover a FAT with complex corruption
    is limited by your understanding of FAT.


    # MSDOS and /etc/fstab


    List filesystems in /etc/fstab to easily mount them. Here I list my new FAT device
    with a mount point of /media.


    ```

    /dev/da451 /media msdos rw,noauto 0 0

    ```


    Note that I used the noauto mount option, so that the system won''t automatically
    mount this at boot. I don''t want my system to hang during boot because I unplugged
    the USB drive!


    # Other MSDOS Hints


    FreeBSD''s mount_msdosfs(8) includes several rarely used features that might help
    you when working with older FAT filesystems, such as managing Windows 95''s long
    filenames. Check the page when you have a FAT issue.


    While FAT filesystems don''t support UTF-8 character sets or other locales, you
    can have FreeBSD map the DOS codepage and these character sets. You must load
    the kernel module msdosfs_iconv.ko, and configure your locale. Use the -l flag
    to set your locale and -D to specify the DOS codepage, as discussed in mount_msdosfs(8).


    If you need to handle a whole bunch of FAT disks, check out the mtools package.
    It contains several flexible tools for working with FAT filesystems without mounting
    them.


    # CDs: ISO 9660


    The ISO 9660 was developed to support CDs. FreeBSD supports reading and writing
    CD images, as well as burning images to disk. The overwhelming majority of CDs
    are formatted with ISO 9660, which FreeBSD calls cd9660. DVDs and Blu-ray disks
    use UDF, discussed in the next section.


    Normal CDs are read-only media. You cannot rewrite CDs. Rewritable CDs exist,
    but they have short lives and are mostly supplanted by more robust USB flash drives,
    so we''re not going to discuss them.


    The write-only nature of CDs can be an advantage in some environments, however.
    You can be confident that the files you burned to a CD, labeled in your clumsy
    Iuse-a-keyboard-not-a-pen handwriting, won''t be tampered with. A CD won''t catch
    viruses from an infected client computer. While you can throw a switch to flip
    some USB flash drives to read-only mode, which leaves room for human error to
    flip the switch back at inconvenient moment.


    We''re not going to cover multisession disks. Multisession disks let you append
    data to the end of a read-write optical disk, rather than overwriting the existing
    filesystem. Using multisession CDs depends largely on your hardware.


    Creating a CD has two parts: making an image of an ISO 9660 filesystem, and burning
    that image to disk. We''ll cover each separately.


    # Multiple CD Drives


    In systems with multiple CD drives, figuring out which piece of hardware corresponds
    with which device node can frustrate anyone. If you have multiple /dev/cd devices,
    the easiest way to identify which device node goes to which drive is use cdcontrol(1).


    Close the doors of all your CD trays. For each device node, run the cdcontrol
    eject command. Give the device node with the -f flag, like so.


    ```

    # cdcontrol -f cd1 eject

    ```


    And voilà! The tray of the hardware associated with /dev/cd1 opens.


    The cdcontrol(1) command also has a close function, but not all CD drives support
    automatic closing.


    My examples assume that you''re using the CD drive /dev/cd0.


    # Reading CDs


    To mount a CD, tell mount(8) to mount filesystem cd9660.


    ```

    # mount -t cd9660 /dev/cd0 /media

    ```


    ISO 9660 needs nor warrants partitions, but on rare occasions you might find the
    optical disk burned with a partition table. If you have trouble mounting the disk,
    check for a partition table.


    CD drives can also have a permanent entry in /etc/fstab.


    ```

    /dev/cd0 /cdrom cd9660 rw,noauto 00

    ```


    I assign this CD drive mount point of /cdrom. If I want to use /media for the
    CD drive, I''ll need a different mount point for USB drives. Removable drives
    in /etc/fstab always use the noauto option, so a missing CD won''t make the system
    hang at boot. All CD mounts are read-only.


    # Burning CD Images to Disk


    So you have an ISO image and want to get it on disk. Use cdrecord(1) from the
    cdtools package to burn ISO images to disk. Give the image as an argument.


    ```

    # cdrecord FreeBSD-10.4-RELEASE-amd64-disc1.iso

    ```


    If you have multiple CD drives, add the -dev flag and the device name.


    ```

    # cdrecord -dev=cd1 FreeBSD-10.2-RELEASE-amd64-disc1.iso

    ```


    It might take a couple of cd to burn the disk, depending on the CD drive''s speed.


    # Creating ISO 9660 Images


    Burning existing images is fine, FreeBSD also lets you create images for CD drives
    from your own files. Use the mkissoff(1) utility included with cdtools to transform
    a directory tree into a filesystem image.


    Here I''ve put the files and directories I want to burn in the directory. Check
    the contents by mounting the disk.


    ```

    # mkissoff(1)

    ```


    The image file is now ready to burn. Before burning it, however, double-check
    the contents by mounting the disk as discussed in Chapter 5.


    ```

    # mkissoff -o cd1.iso cfiles/

    ```


    Now transform this directory into an ISO 9660 filesystem. Give the destination
    image with


    ```

    # mkissoff -o cd1.iso cfiles/

    ```


    The image file is now ready to burn. Before burning it, however, double-check
    the contents by mounting the disk.


    # ls -la /media/


    ```

    total 159

    dr-xr-xr-x 1 root wheel    2048 Aug 25 14:30 .

    drwxr-xr-x 28 root wheel     35 Aug 25 11:47 ..

    --rw-r--r-- 1 root wheel    50769 Mar 13 2014 exposition.zip

    --rw-r--r-- 1 root wheel    50718 Aug 25 14:30 file1.zip

    --rw-r--r-- 1 root wheel    50719 Aug 25 14:30 file3.zip

    ```


    The ownership has changed. If the directory had symbolic links, they’d be missing.
    And one file has a truncated name!


    The ISO 9660 standard imposes a limit of eight characters on a filename, plus
    a period and a three-character extension. It has a maximum depth of eight directories,
    a maximum of 65,535 directories, and assorted annoying limitations. Also, ISO
    9660 does not reflect all of POSIX’s filesystem semantics—or all of the Microsoft
    filesystem standards. Various extensions support these features,


    # ISO 9660 Extensions and Features


    Using any ISO 9660 extension requires specifying the extension when creating the
    ISO image. You cannot retrofit extensions onto an existing ISO, as the information
    the extensions support doesn’t exist in the ISO. The most common sets of extensions
    are Joliet and Rock Ridge.


    Microsoft created Joliet extensions to support Windows filenames and attributes.
    Filenames on an ISO with Joliet extensions can be up to 103 characters long, and
    directories can run more than eight layers deep. Activate Joliet extensions with
    the -j flag.


    Rock Ridge extensions are designed for Unix-like systems. They also allow longer
    filenames and greater directory depth, but also include Unix attributes like file
    ownership, symbolic links, and more. Enable Rock Ridge extensions with the -R
    flag.


    The El Toronto extensions mark an ISO as a bootable device. You will have to put
    a boot loader and an operating system in the ISO. Enable El Toronto with -b and
    the path to the boot loader. See “Bootable CDs” later in this chapter for more
    information.


    The presence of any of these extensions will not interfere with reading the CD
    on other'
