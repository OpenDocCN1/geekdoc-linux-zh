    \n}\n```\n\nYou now have live failover of iSCSI-backed systems.\n\n# Cluster Startup\n\
    \nThese scripts place a host in backup mode at boot. If you reboot one host at\
    \ a time, everything fails over correctly. A cold start of both nodes, however,\
    \ is more problematic. An individual system has no way to tell that the whole\
    \ cluster has been cold booted.\n\nFreeBSD starts its early in the boot process.\
    \ The network includes CARP, of course. It starts CARP before HAST or iSCSI. Do\
    \ you reboot a server to automatically claim the master role from a fully functional\
    \ peer? Probably not—it won't have the storage ready, or its applications, or\
    \ even SSH. Debugging a troubled server means rebooting multiple times.\n\nWhen\
    \ both nodes boot simultaneously, I recommend having a third party decide which\
    \ node to make the master. This third party may be you. It might be a piece of\
    \ software on another machine. Running the promote script on the select master\
    \ node should bring it fully and initiate the failover.\n\nAre there alternatives?\
    \ Sure. They all boil down to: what risks can you accept? You could write a system\
    \ boot script to enable and configure CARP well after the host boots. You could\
    \ declare that host A always claims the master role when it boots. Each of these\
    \ risks, depending entirely on your environment and architecture. Think carefully,\
    \ and choose the most automated solution that imposes only acceptable risk.\n\n\
    To really dive into risk, let's talk about Access Control Lists.\n\n> ¹ If I tell\
    \ you how to make a file executable, you should not be implementing highly available\
    \ filesystems.\n\n> ² If you can't kill this particular software ungracefully,\
    \ it's probably a database. And I warned against running databases on filesystem-level\
    \ failback in Chapter 9, so I have a complete lack of sympathy for you.\n\n# Chapter\
    \ 11: NFSv4 Access Control Lists\n\nUsing FreeBSD as a storage back end for a\
    \ corporate NFS or CIFS file store requires replicating the organization’s structure\
    \ and information control in file permissions. The traditional Unix user/group/everyone\
    \ model just won't cut it. You need an access control model that lets you construct\
    \ permissions and privileges any way you need.\n\nThat's where Access Control\
    \ Lists, or ACLs, come in.\n\nACLs let you select from a list of privileges, and\
    \ apply them to any system user or group, creating rules for who may access what.\
    \ You want a file readable by anyone in the company, but editable only by the\
    \ people in Billing, except for Fred, because he kicked off the chief accountant?\
    \ An ACL can do that. Maybe you have some files that users want to be able to\
    \ write to, but not delete. That’s an ACL. Or perhaps you have dozens of users,\
    \ each of whom gets slightly different access to a specific file. An ACL can do\
    \ that. You’ll go bonkers from administrative overhead, mind you, but it’s possible.\n\
    \nWhile understanding ACLs is pretty straightforward, the actual practice of implementing\
    \ and managing ACLs quickly gets complicated. The reason Windows NTFS ACLs are\
    \ so frequently cursed is not because they’re on Windows. It’s because people\
    \ use ACLs to map and emulate human relationships, and human relationships often\
    \ merit cursing. Ponder any large organization you’re a member of, and all the\
    \ ways different groups of people in that organization want to offer and control\
    \ access. Imagine writing rules in software to emulate that. Plus, today’s heroic\
    \ employee is tomorrow’s scapegoat, so you’ll have to redo everything at random\
    \ intervals.\n\nThe key to successful ACL management is simplicity. Don’t assign\
    \ ACLs just because you can. Assign them when needed.\n\nACLs are always interpreted\
    \ on the local host. If you’re sharing a filesystem via NFS or Samba, the client\
    \ can think whatever it wants about the mounted share and can issue requests accordingly.\
    \ The server interprets any ACL itself, though, and responds to the client as\
    \ the ACL dictates.\n\n# ACL types\n\nWhile many different styles of Access Control\
    \ Lists have been implemented over the years, the three you'll encounter most\
    \ often are POSIX, NTFS, and NFSv4.\n\nPortable Operating System (POSIX) is a\
    \ set of standards for operating system interoperability. One proposed POSIX standard,\
    \ POSIX.1e, describes a set of Access List behaviors. The proposed ACL standard\
    \ underwent several revisions, and many operating systems implemented one of those\
    \ revisions. Everyone who implemented these draft ACLs assumed they'd update their\
    \ implementation when the final draft became a standard. At the end, though, POSIX.1e\
    \ was not adopted as a standard. All of these operating systems have highly differently\
    \ “POSIX” ACL implementations. FreeBSD supports POSIX.1e ACLs, but they're not\
    \ recommended, and so I don't cover them. Anything that can be implemented with\
    \ a POSIX ACL can also be implemented with an NFS4 ACL.\n\nMicrosoft created NTFS\
    \ Access Control Lists. The NTFS ACL model has more features and types of access\
    \ control than POSIX ACLs, and is widely deployed in enterprise environments.\
    \ Entries in an NFS ACL are processed in order, on a first-match basis.\n\nNFSv4\
    \ ACLs were created as part of the NFS version 4 negotiations. They closely resemble\
    \ NTFS ACLs, and were specifically created to allow Unix-like hosts to better\
    \ serve Windows clients. They're so close that NFSv4 ACLs can be used on a Samba\
    \ server and managed via Windows security tools. Like NTFS ACLs, NFSv4 ACLs default\
    \ to denying. If you need ACLs on FreeBSD, use NFSv4.\n\nFreeBSD's NFSv4 ACL implementation\
    \ is deliberately modeled after that found in OpenSolaris-derived operating systems.\
    \ The management interface differs, but the various permissions and ACL handling\
    \ traces OpenSolaris fairly closely. Other operating systems implement them differently.\
    \ Linux, for example, implements its NFSv4 ACL support atop POSIX ACLs, something\
    \ compliant for most users.\n\nThis chapter does not cover everything there is\
    \ to know about NFSv4 ACLs. The NFSv4 specification is about 135,000 words, or\
    \ almost three times the size of the entire\n"
