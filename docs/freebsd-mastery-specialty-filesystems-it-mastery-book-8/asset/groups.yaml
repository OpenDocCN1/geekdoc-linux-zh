    ## 第 12 章：文件系统胶水


    NFSv4 ACL 最常部署在 Samba 4 服务器（http://www.samba.org）上，作为 CIFS 的存储后端。这里有几件经常让这些系统管理员困惑的事情，感谢
    John Hickson，他是那个回答大多数 ACL 问题的 FreeNAS 支持人员。


    - 始终使用 ZFS。一旦你有了 ZFS，始终用于 Samba 的数据集始终将 `aclmode` 和 `aclinherit` 设置为 `passthrough
    On`。

    - 不要使用 world可写的文件（模式 777），或使用 000 umask。如果你这样做，你会遭受痛苦。

    - 目录上的 Windows 搜索需要至少对 `rxaRc` 权限拥有允许。

    - ACL 可能比本章中的示例复杂得多。记住，简单是成功 ACL 部署的关键。祝你好运。


    在 ACL 之后，FUSE 和 autofofs 将显得完全微不足道。


    > ^1 所有用户名都是随机生成的。与原始 FreeBSD 核心团队成员（无论生与死）的任何相似之处纯属巧合。


    > ^2 仍然是巧合。


    > ^3 我会说“绝对没有”，但随后会有某个讨厌的用户告诉我。


    > ^4 Hickson 也想知道那是。


    ## FUSE


    用户空间文件系统（Filesystem in Userspace，简称 FUSE）为用户态程序提供了一种处理文件系统的方法。FUSE 程序作为用户进程运行，解释数据并处理内核。


    文件系统不仅仅是存放数据的地方。FUSE 系统也可以作为新颖访问数据的有用工具。考虑 `devfs`（第 2 章），FreeBSD 通过文件系统访问硬件。可选工具如
    `fdescfs` 和 `mqueues`（第 3 章）允许你作为文件系统访问内核结构。许多用户可以从意想不到的方式中从中受益。FUSE 还支持有趣的数据转换，例如通过
    SSH 挂载文件系统。FreeBSD 开发者绝不会允许在内核内置 SSH 客户端，但既然我们已经在用户态了，顺便用一下它吧。或者 MP3 转换器。或者 HTTP
    客户端，让你无需下载整个文件即可挂载并检查 ISO。甚至有一个 Wikipedia FUSE 模块，让你像文件系统一样查看和编辑 Wikipedia。像 MooseFS（www.moosefs.org）的一些文件系统完全为
    FUSE 实现。


    使用 FUSE 并不是没有风险的。FUSE 模块向内核输入数据。虽然内核清理数据，损坏的文件系统可能会向内核注入垃圾数据。聪明的入侵者可能会借此获得特权访问。


    尽管如此，有时 FUSE 是解决问题的最佳方式。你需要访问另一个服务器上的文件？使用 SSH。一个程序需要访问另一个服务器上的文件，但它只能查看本地文件？在中间插入
    FUSE 的 `ssh` 挂载模块即可继续。

    '
