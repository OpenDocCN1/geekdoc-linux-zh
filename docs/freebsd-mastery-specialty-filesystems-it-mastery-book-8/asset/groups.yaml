    not the number 1.)


    Any initiator that connects to this target gets access to all three LUNs.


    # LUN Size


    Each LUN can have a size statement, giving the size ctld reports to the initiator,
    in bytes. You can use abbreviations like G for gigabytes and T for terabytes.
    If you don''t specify a size, FreeBSD will probe the device to figure out the
    size. I like the size statement because I''m forgetful.


    The size given should be the same as the actual size of the storage device, but
    doesn''t always happen. In the example above, I claim that the disk behind LUN
    3 is one terabyte. It''s a physical 1 TB disk, which means the manufacturer measured
    the size in base 10. FreeBSD measures disk sizes in base 2. Running geom list
    dao gives the actual size of this specific disk is 1000204886016 bytes, and 932
    GB. I''d be off listing the actual value rather than rounding it to the nearest
    terabyte. Remember, not all "1 TB" disks are the same size.


    In addition to size and the backing store, you can set a variety of other LUN
    characteristics.


    # Blocksize


    While physical hard drives have had 512-byte sectors for decades, newer "advanced
    format" drives have 4096-physical sectors. For physical disks and ZFS volumes,
    ctld(8) passes the physical sector size to the initiator. On file-backed iSCSI
    volumes, the size sector size with the blocksize keyword.


    ```

    lun 2 {

    path /jails/disk2.img

    blocksize 4K

    size 2T

    }

    ```


    If you''re using file-backed iSCSI storage rather than a zvol or a physical disk,
    the block size can help the iSCSI initiator write requests correctly for the underlying
    storage.


    # Drive Information


    SCSI commands expose a physical hard drive''s model name, serial numbers, and
    other vendor-specific data. You can set this same information within an iSCSI
    LUN definition.


    ctld(8) daemon provides the device-id and serial keywords. Use device-id to'
  - "[PAGE 116]\n\nprovide something like model name. The serial keyword is for anything\
    \ like a serial number. Neither entity can spaces.\n\nHere I use device-id to\
    \ let people administer initiator hosts view what sort of storage target uses.\
    \ I have assigned a meaningless serial number, but you might use the serial number\
    \ to pass other data to the client.\n\n```\nlun 0 {\n  path /dev/zvol/jails/disk1\n\
    \  size 500G\n  device-id zvol\n  serial 0123456789abcdef\n}\n```\n\nOn the client,\
    \ the device ID is visible in the lunname and lunid values of geom disk list.\n\
    The serial number is visible in the disk's ident string. Here I log into an initiator\
    \ host and view this as it appears on the local system.\n\n```\n# geom disk list\
    \ da5\n\ndescr: FREEBSD CTLDISK\nlunname: FreeBSD zvol\nlunid: FreeBSD zvol\n\
    ident: 0123456789abcdef\n```\n\nThe leading FREEBSD and the space always appear\
    \ in the LUN name and LUN ID.\n\n# ctld(8) Performance\n\nWhile ctld is designed\
    \ to perform well, you can tweak a few things in its behavior.\n\nEach incoming\
    \ TCP connection makes ctld spawn a child process. By default, ctld limits the\
    \ number of child processes to 30. If you're running a busy iSCSI server with\
    \ many initiators, you might need to increase this with the maxproc option.\n\n\
    ```\nmaxproc 30\n```\n\nSetting maxproc to allows unlimited child processes.\n\
    \nInitiators generate a constant flow of traffic to their targets. Even if the\
    \ iSCSI disk is idle, the target will receive traffic every few seconds. Initiators\
    \ that stopping traffic for more than a few seconds are probable. The timeout\
    \ value tells you ctld how long to maintain an idle connection before dropping\
    \ it. The default is 60, a reasonable average. Your equipment or environment might\
    \ need a different timeout.\n\n```\ntimeout 90\n```\n\nAll performance and debugging\
    \ options go at the top level of ctl.conf, not inside any"
  - '[PAGE 117]


    braces.


    # Debugging ctdld(8)


    While the SCSI command set gets complicated, iSCSI itself is it pretty straightforward.
    Even so, we sysadmins can discover many ways to mess up our iSCSI configurations.
    The ctdld(8) debugging features usually give good insight into problems.


    Use the debug statement to enable debugging. The default level, 0, provides only
    bare operational messages. A debugging level of 3 gives useful information when
    an iSCSI connection goes awry, so that''s what I normally use.


    debug 3


    Information from ctld appears in /var/log/messages. You cannot change the log
    facility and level (daemon.debug), so if you want to log them separately you''ll
    split them out in syslog(8).


    Whenever an initiator fails to authenticate, or when the storage for a LUN is
    absent or faulty, ctld(8) logs the error. Most ctld error messages are actually
    fairly easy to understand. Authentication errors describe which authentication
    constraint was violated. LUN errors are more generic, but normally mean that you
    mistyped the path to the backing storage in ctld.conf.


    I use a debug level of 3 during normal production use, to easily identify and
    resolve issues. Log space is cheap.'
  - '[PAGE 118]


    # Configuring Initiators


    The iSCSI initiator programs share a configuration file, /etc/iscsi.conf. This
    configuration file was also used by the iSCSI initiator in older versions of FreeBSD,
    so its documentation includes references to the obsolete control(8). The configuration
    format deliberately not change between the two sets of software, however.


    The simplest uses of the iSCSI initiator do not require a configuration file.
    You can discover targets on a host, connect to and disconnect from them, and perform
    CHAP authentication without a configuration file. A configuration file permits
    use of more complex options like mutual CHAP, and allows more selective iSCSI
    management. In production, always use a configuration file.


    Each iSCSI target gets a bracketed section in iscsi.conf.


    ```

    target-nickname {

    TargetAddress = storm.mwl.io

    TargetName = iqn.2013-11-io.mwl:target0

    InitiatorName = iqn.2013-11-io.mwl:host1

    }

    ```


    A target''s entry starts with a nickname. This sample target is unimaginatively
    nicknamed target-nickname.


    Inside the braces we have the various iSCSI settings and their values, as defined
    in iscsi.conf(5). We''ll add more settings in the relevant topics, but the three
    here are very commonly used.


    TargetAddress can be a hostname or IP address. It''s the IP address of the iSCSI
    portal providing the target. My iSCSI server is called storm.mwl.io.


    TargetName is the formal name of the iSCSI target you want to connect to. This
    connection is for the target name we created earlier this chapter.


    InitiatorName is a name you''ve chosen to assign to this initiator. If you don''t
    assign a name for this initiator, FreeBSD creates one for you. Assigning an initiator
    name is a convenience for you.


    A target definition''s closing bracket must appear on a line by itself. Don''t
    tack it onto the end of the last variable setting.


    When using iSCSI disks, remember that the device node is even more dynamic than
    on normal hardware. The disk that is /dev/das5 today might be a completely different
    disk node'
- md: "\ntomorrow. Always manage filesystems on iSCSI disks with labels rather than\
    \ by device node.\n\n## Enabling the iSCSI Initiator\n\nFreeBSD provides iSCSI\
    \ initiator services through iscsid(8) and iscsict(8). The iscsid daemon handles\
    \ connections, while iscsictl lets you issue iSCSI commands.\n\n## iscsid(8)\n\
    \nThe iSCSI daemon iscsid(8) manages an initiator's iSCSI logins and discovery.\
    \ Once iscsid establishes a connection, it connects to the FreeBSD kernel. To\
    \ enable iscsid, set iscsid_enable to YES in /etc/rc.conf.\n\n```\n# sysrc iscsid_enable=YES\n\
    ```\n\nIf you have trouble with iSCSI logins, you might try iscsid debugging mode.\
    \ The -d flag tells iscsid to run in the foreground, and print all the debugging\
    \ information to the terminal. Debug-mode iscsid terminates after handling only\
    \ one connection. This won't interrupt existing connections, as iscsid handles\
    \ only logins and discovery. Even without iscsid running, established iSCSI connections\
    \ remain up until something interrupts them. With\n\nWhile iscsid normally gets\
    \ its debugging level from iscsi.conf, you can override the setting on the command\
    \ line with -1 and a log level. This lets you debug specific problems without\
    \ editing the configuration file. A log level of 3 will identify most problems.\n\
    \nEach iSCSI login spawns a child process. These child processes handle authentication,\
    \ negotiate various iSCSI parameters, hand the connection off to the kernel, and\
    \ exit. Normally, the maximum number of simultaneous child processes is 30. If\
    \ you must process more than 30 iSCSI simultaneously, use the -m flag to set a\
    \ new maximum. Setting the maximum to 0 removes any limits on the number of child\
    \ processes.\n\n## Initiator Controller: iscsctl(8)\n\nConfigure and manage your\
    \ iSCSI initiator through iscsctl. While you can perform some figuration at the\
    \ command line, complex setups require the configuration file etc/iscsi.conf.\n\
    \nAn iSCSI initiator has three core functions: discovering targets, connecting\
    \ to targets, connecting from targets. You can also list existing iSCSI sessions.\n\
    \n## Initiator Authentication\n\nMaking iSCSI connections and performing discovery\
    \ often requires authentication. You can set authentication options on the command\
    \ line or in iscsi.conf.\n\nBy default, iscsctl does not offer authentication.\
    \ If a target doesn't need authentication, don't include any authentication information.\
    \ Offering authentication information to a target that doesn't need authentication\
    \ might cause the connection to fail.\n\nTo authenticate with CHAP on the command\
    \ line, use -u to define a user and -s to give t secret. Here I run an iSCSI command\
    \ (discovery) with the user pinky and the secret brain.\n\n```\n# iscsctl -Ad\
    \ storm -u pinky -s brain\n```\n\nTo set CHAP authentication in iscsi.conf, you\
    \ must set the AuthMethod, ChapName, and Secret variables. Here I set that same\
    \ username and secret for the target icknamed db.\n\n```db\ndb {\n  TargetAddress\
    \ = storm.mwl.io\n  InitiatorName = iqn.2013-11.io.mwl:host1\n  TargetName = iqn.2013-11.io.mwl:target0\n\
    \  AuthMethod = CHAP\n  ChapName = pinky\n  ChapSecret = brain\n}\n```\n\nIf a\
    \ target requires authentication, set AuthMethod to CHAP—even if the target uses\
    \ mutual CHAP. And pay special attention to the username variable. There's a capital\
    \ I in the middle of ChapName.\n\nYou cannot perform mutual CHAP on the command\
    \ line. You must set the remote user and secret in iscsi.conf, using the tgtChapName\
    \ and tgtChapSecret values as shown here.\n\n```db\ndb {\n  TargetAddress = storm\n\
    \  TargetName = iqn.2013-11.io.mwl:target0\n  AuthMethod = CHAP\n  ChapName =\
    \ mickey\n  ChapSecret = minnie\n  tgtChapName = donald\n  tgtChapSecret = goofy\n\
    }\n```\n\nThis connects the initiator to the mutual CHAP target built earlier\
    \ this chapter. Authentication is only needed for discovery and connecting. You\
    \ can disconnect without authenticating.\n\n## iSCSI Discovery\n\nThe simplest\
    \ way to connect an initiator to a portal is to perform an iSCSI discovery. This\
    \ is where the initiator goes to the iSCSI portal on the target server and says,\
    \ \"Hey, what LUNs can you tell me?\" If the initiator successfully authenticates,\
    \ the portal returns a list of targets.\n\nThe AA flag iscsctl to add a session.\
    \ The -d flag triggers discovery, and takes one argument: the hostname or IP address\
    \ of the iSCSI portal group. Here I perform iSCSI discovery across the host data.mwl.io\n\
    \n```\n# iscsctl -A -d data.mwl.io\n```\n\nWhen the initiator get drive information,\
    \ it automatically logs into the system and attaches all of the discovered LUNs\
    \ to the local system. The only way to see what your initiator discovered is to\
    \ view the existing iSCSI sessions.\n\n## Viewing iSCSI Session and Connections\n\
    \nTo see all iSCSI sessions, run iscsctl without any arguments or use the -L\n\
    \n```\n# iscsctl -L\nTarget name Target.mwl:target0 storm Connected: da4 da5\n\
    iqn.2013-11.io.mwl:target1 storm Connected: da3\n```\n\nThis initiator has connected\
    \ to two targets on this host. you'll see the target names, the portal, and the\
    \ device local has assigned to the drives in this target. If you want more detail,\
