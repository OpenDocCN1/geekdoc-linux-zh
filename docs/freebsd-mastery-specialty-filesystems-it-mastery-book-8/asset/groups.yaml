  - '[PAGE 23]


    # CDs: ISO 9660


    The ISO 9660 was developed to support CDs. FreeBSD supports reading and writing
    CD images, as well as burning images to disk. The overwhelming majority of CDs
    are formatted with ISO 9660, which FreeBSD calls cd9660. DVDs and Blu-ray disks
    use UDF, discussed in the next section.


    Normal CDs are read-only media. You cannot rewrite CDs. Rewritable CDs exist,
    but they have short lives and are mostly supplanted by more robust USB flash drives,
    so we''re not going to discuss them.


    The write-only nature of CDs can be an advantage in some environments, however.
    You can be confident that the files you burned to a CD, labeled in your clumsy
    Iuse-a-keyboard-not-a-pen handwriting, won''t be tampered with. A CD won''t catch
    viruses from an infected client computer. While you can throw a switch to flip
    some USB flash drives to read-only mode, which leaves room for human error to
    flip the switch back at inconvenient moment.


    We''re not going to cover multisession disks. Multisession disks let you append
    data to the end of a read-write optical disk, rather than overwriting the existing
    filesystem. Using multisession CDs depends largely on your hardware.


    Creating a CD has two parts: making an image of an ISO 9660 filesystem, and burning
    that image to disk. We''ll cover each separately.


    # Multiple CD Drives


    In systems with multiple CD drives, figuring out which piece of hardware corresponds
    with which device node can frustrate anyone. If you have multiple /dev/cd devices,
    the easiest way to identify which device node goes to which drive is use cdcontrol(1).


    Close the doors of all your CD trays. For each device node, run the cdcontrol
    eject command. Give the device node with the -f flag, like so.


    ```

    # cdcontrol -f cd1 eject

    ```


    And voilà! The tray of the hardware associated with /dev/cd1 opens.


    The cdcontrol(1) command also has a close function, but not all CD drives support
    automatic closing.


    My examples assume that you''re using the CD drive /dev/cd0.


    # Reading CDs'
  - '[PAGE 24]


    To mount a CD, tell mount(8) to mount filesystem cd9660.


    ```

    # mount -t cd9660 /dev/cd0 /media

    ```


    ISO 9660 needs nor warrants partitions, but on rare occasions you might find an

    optical disk burned with a partition table. If you have trouble mounting the disk,
    check for

    a partition table.


    CD drives can also have a permanent entry in /etc/fstab.


    ```

    /dev/cd0 /cdrom cd9660 rw,noauto 00

    ```


    I assign this CD drive mount point of /cdrom. If I want to use /media for the
    CD drive,

    I''ll need a different mount point for USB drives. Removable drives in /etc/fstab

    always use the noauto option, so a missing CD won''t make the system hang at boot.

    All CD mounts are read-only.


    # Burning CD Images to Disk


    So you have an ISO image and want to get it on disk. Use cdrecord(1) from the
    cdtools

    package to burn ISO images to disk. Give the image as an argument.


    ```

    # cdrecord FreeBSD-10.4-RELEASE-amd64-disc1.iso

    ```


    If you have multiple CD drives, add the -dev flag and the device name.


    ```

    # cdrecord -dev=cd1 FreeBSD-10.2-RELEASE-amd64-disc1.iso

    ```


    It might take a couple of cd to burn the disk, depending on the CD drive''s

    speed.


    # Creating ISO 9660 Images


    Burning existing images is fine, FreeBSD also lets you create images for CD drives

    from your own files. Use the mkissoff(1) utility included with cdtools to transform
    a

    directory tree into a filesystem image.


    Here I''ve put the files and directories I want to burn in the directory $HOME/cdfiles.
    Take

    a look at what''s in that directory.


    ```

    # ls -la cdfiles/

    total 167

    drwxrxr-x 2 root mwl      5 Aug 25 14:30 .

    drwxr-xr-x 21 root mwl      84 14:24..

    --rw-r--r-- 1 root mwl 50709 Mar 13 2014 exposition.zip

    --rw-r--r-- 1 root mwl 50718 Aug 25 14:30 file1.zip

    --rw-r--r-- 1 root mwl 50719 Aug 25 14:30 file3.zip

    ```


    Now transform this directory into an ISO 9660 filesystem. Give the destination
    image'
