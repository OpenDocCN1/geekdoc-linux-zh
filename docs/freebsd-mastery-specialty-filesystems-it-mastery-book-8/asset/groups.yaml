    # Automounting with Special Maps


    FreeBSD comes with four special maps: -hosts, -media, -noauto, and -null. (There’s
    also a special map to read map information from LDAP, but that’s highly environment-dependent,
    so we won’t cover it.) You know a map is classed special because its name in /etc/auto_master
    begins with a dash.


    The -hosts special map, in /etc/autofs/special_hosts, identifies the NFS shares
    available on a host. When you trigger an NFS automount request, the special map
    queries the NFS server to see what''s available to you.


    The -media special map in /etc/autofs/special_media probes unmounted devices,
    like removable media, and helps mount them.


    The -noauto special map, /etc/autofs/special_noauto, checks /etc/fstab for devices
    that are not automatically mounted at boot, and mounts them when you try to use
    them.


    Finally, the -null special map /etc/autofs/special_null ties up a mount point
    so that automount(d) can’t mount anything there.


    # Automounting NFS


    Let’s try this automounting thing with NFS. My test network has two NFS servers,
    mail and www. I know that my workstation can access shares on both because I’ve
    previously mounted them manually.


