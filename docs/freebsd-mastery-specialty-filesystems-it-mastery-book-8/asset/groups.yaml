    # Chapter 0: Introduction


    Storage: a hole with no bottom, into which you pour data.


    The last 50 years of computing have seen countless types of data storage hardware.
    Modern flash drives improve on spinning disks, which in turn improved on punch
    cards, which improved on tape, which was a lot better than carved marble tablets.
    BSD operating systems, and FreeBSD in particular, have been around for most of
    that time, and at one time had to utilize many different data storage methods.
    Support for hardware remains long after the hardware was in common use. Even paper
    tape support lingers in the bcd(6) command.


    Once you pick a physical medium, though, you have to decide how you''re going
    to use it. Different operating systems have evolved entirely different filesystems
    to stuff data onto each sort of media. Your FreeBSD installation might need to
    interoperate with all of these, and more.


    Then there are filesystems developed for special purposes, such as devfs and the
    Memory File System. The network opens up many storage possibilities, such as iSCSI
    and the Network File System and various replication technologies.


    To truly master FreeBSD, you need to understand many of these. That''s where this
    book comes in. You won''t find information about GEOM and the Unix File System
    here, or about ZFS, or about how to implement filesystems in code. Those topics
    have their own books. This book is for all the other filesystems, storage methods,
    and data storage tricks.'
  - '[PAGE 12]


    # Prerequisites


    As this book is for filesystems meant for special situations, it has perhaps the
    widest range of prerequisites of any book I''ve ever written.


    While the individual topics in this book aren''t difficult, they presume you understand
    FreeBSD GEOM storage subsystem. You don''t need to understand how to write storage
    classes, but I assume you'' familiar with commands like label and show. Partitioning
    is another complex topic you need to bring to the table. Some filesystems assume
    a disk Master Boot Record (MBR) partitions, while others work only on Globally
    Unique ID (GUID) Partition Tables (GPT). Similarly, you''ll need to understand
    the basics of the Unix File System (UFS), including critical file systems like
    /etc/fstab. We''ll also cover ZFS issues, where ZFS interoperates with other filesystem
    attributes.


    This book pulls in knowledge from the whole spectrum of systems administration
    practice. If you want to use FreeBSD''s iSCSI support, you''d best know something
    about TCP/IP and storage hardware. Using the Filesystem in Userspace (FUSE) support
    with the SSH module means you should understand starting and stopping services
