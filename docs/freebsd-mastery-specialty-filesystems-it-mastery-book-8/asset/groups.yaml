    automounting removable drives on /media. It''s not enabled by default; while /media
    is intended for removable drives, many sysadmins use it for manual media mounts.
    Having the automounter suddenly monopolize /media would violate the Principle
    of Least Astonishment.


    This rule reserves the /media directory for the automounter. It applies the special
    media-media, and everything with the nosuid option. Uncomment the line and run
    autom as root to activate it.


