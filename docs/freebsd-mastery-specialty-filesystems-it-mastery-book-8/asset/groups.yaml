    # devfs(5) Rules


    In addition to changing devfs with devfs.conf, and running commands on dynamic
    devices with devd(8), you can use devfs rules with /etc/devfs.rules. All device
    nodes, whether present at boot or dynamically added, are subject to devfs.rules.
    Rules let set ownership and permissions on device nodes, and make device nodes
    visible or invisible. In addition to the configuration file, you can add devfs
    rules at the command line.


    Just like rc.conf and periodic.conf, FreeBSD as a default devfs.rules file in
    /etc/defaults/. Upgrades overwrite this file. Put your own devfs rules in /etc/devfs.rules.
    Entries in /etc/devfs.rules override the default rules by file number—that is,
    rule 5 in /etc/devfs.rules overrides rule 5 in /etc/defaults/devfs.rules.


    # devfs Rule Design


    Every devfs rule starts with a unique name and rule number, given between square
    brackets. You can refer to this ruleset by name elsewhere in devfs.rules. The
    number is only a unique identifier—devfs rules don''t have a priority or processing
    order outside the rule. The rule then has a statement adding an action to this
    ruleset.


    Here''s a complete devfs rule from the default devfs.rules.


    ```

    [devfsrules_hide_all=1]

    add hide

    ```


    This rule is named devfsrules_hide_all, and is rule number 1. It adds an action
    to this ruleset: hide. It hides every single device, giving you an empty /dev.


    # Rule Content


    All devfs rules begin with the word add, adding a rule to the ruleset. Then there''s
    either a path keyword and a regex of device names, or a type keyword and a device
    type. At the end of the rule you have an action, whatever the rule does. Here''s
    a complete devfs rules.


    ```

    path cuau* user mwl

    ```


    This rule declares that the user mw owns all device nodes beginning with cuau.
    These device nodes go to serial ports. On a multi-user system this would be a
