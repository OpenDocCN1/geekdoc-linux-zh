  raw:
  - '[PAGE 152]


    # Failover Architecture


    Failover automation is built on top of two key technologies, CARP and devd(8).
    How they get depends on the storage back end used.


    # CARP


    The Common Address Redundancy Protocol (CARP) is an OpenBSD creation for sharing
    IP addresses between machines. It lets addresses float between machines as needed.
    CARP resembles Cisco''s Virtual Router Redundancy Protocol (VRRP), but also includes
    checks for security and integrity. Additionally, CARP lacks the burden of patents,
    so you''re free to use, distribute, or re-implement it for any purpose whatsoever.


    Each host in a CARP cluster has a CARP attribute attached to one or more interfaces.
    Each interface with CARP continually announces its presence to the other hosts
    on the network. The hosts negotiate to see which one will be the master. While
    each interface running CARP has an IP address assigned for that machine, the CARP
    master answers all requests for the floating CARP IP address. When the master
    stops responding, another host in the cluster takes over and claims the CARP IP.


    Clients know only about the CARP IP address, not the individual machine''s management
    address. When the address floats to the other machine, client requests follow
    it. The trick is to get the filesystem and server processes to follow it.


    # Devd


    When a CARP interface goes up or down, taking over or relinquishing an IP address,
    it sends an event to devd(8). As Chapter 2 discusses, devd events can trigger
    commands. You can have FreeBSD activate storage when the CARP interface goes up
    and deactivate storage when the interface goes down.


    # Storage Back Ends


    FreeBSD has two block storage systems that can share: iSCSI (Chapter 8) and HAST
    (Chapter 9). Which should you depends on your environment.


    In a large environment, iSCSI is the best choice for networked storage devices.
    Have two separate servers offer iSCSI targets, and another two client-facing servers.
    The client-facing servers can use one drive from each iSCSI server to create a
    mirror, or multiple drives from created striped mirrors. The environment can withstand
    the failure of one iSCSI server and one client-facing server. So long as you have
    one server of each type active and working, the service remains up. You can easily
    expand this environment and'
  - '[PAGE 153]


    replace hardware as needed. You will probably want a stand-alone Storage Area
    Network (SAN), to separate your storage traffic from the client and management
    traffic. For even higher availability, investigate multipath SCSI.


    Using RAID-Z for high availability is possible, but requires more iSCSI targets
    on more independent servers. An eight-disk RAID-3 can withstand the loss of three
    disks. If you have two iSCSI servers, losing one server means losing disks—and
    the pool. You could create a separate RAID-Z device on each iSCSI server, and
    then mirror the pools.


    If you have only two hosts, HAST is your only real choice for failover filesystem.
    It would be possible to provide a drive to the other, but that reaches astonishing
    new levels of clunky. Ideally, the HAST hosts will have a private network connection
    between them, such as a crossover cable.


    Let''s work through this architecture one piece at a time.'
  - '[PAGE 154]


    # Configuring CARP


    In FreeBSD 10 and later, CARP is an attribute attached to an existing interface.
    Older versions of FreeBSD (and all versions of OpenBSD) created a virtual interface
    for CARP, but the new model simplifies management on hosts with many interfaces.
    CARP is incredibly flexible, so we''ll only cover its basic configuration. For
    far more details, see carp(4).


    Start by loading the carp(4) kernel module at boot with a loader.conf entry.


    ```

    carp_load=YES

    ```


    The basic unit of CARP is the virtual host. A virtual host, and IP addresses attached
    to virtual host, can float between machines. Each virtual host needs an ID number,
    or most people start number VHIDs at 1.


    Each VHID also needs a password. The password prevents rogue hosts on the same
    network from spoofing CARP announcements. Like ISCSI passwords, a CARP password
    is stored in plain text on each machine, as anyone who configures the host''s
    network needs access to it.


    Configure CARP as an Ethernet interface alias in /etc/rc.conf. Here interface
    em0 has its own address, but also has a CARP VHID.


    ```

    ifconfig em0="inet 203.0.113.214 netmask 255.255.255.0"

    ifconfig em0_alias="vhid 1 pass Gelato 203.0.113.219/32"

    ```


    Both hosts need exactly the same CARP alias configuration. (They need unique IP
    addresses, of course.) You should add additional CARP configuration to both, such
    as hard-coding one as the CARP master, that imposes additional risks.(Cluster
    Startup) later this chapter.


    Reboot the first host. You should see the CARP information in ifconfig.


    ```

    # ifconfig em0


    inet 203.0.113.214 netmask 0xffffff broadcast 203.0.113.255

    inet 203.0.113.219 netmask 0xffffff broadcast 203.0.113.219 vhid 1


    carp: MASTER vhid 1 advbase 1 advskew 0

    ```


    This host has its own IP address, 203.0.113.214. It also has the IP 203.0.113.219,
    as part of VHID 1. The last line shows that this interface is a CARP master, meaning
    that it''s currently serving requests for this VHID.


    Reboot the second host. Its ifconfig output should show that host in the backup
    state. If'
  - '[PAGE 155]


    the master fails, the backup will assume service.


    Force a host to change roles by using ifconfig. Give the interface name, the VHID,
    and the new state.


    ```

    # ifconfig em0 vhid 1 state backup

    ```


    I normally run such commands on the master host to tell it to demote itself to
    backup status, but they work just as well as the backup.


    If this is your first experience of CARP, play with it before continuing. Start
    an ongoing ping of your VHID IP. Reboot the master CARP host. Depending on your
    network switch and the server hardware, your client might drop a ping as the CARP
    IP address moves from one host to the other. When the host finishes rebooting,
    it will see that the other host has claimed master status and will take the backup
    role for itself.


    Once you understand how VHIDs float between machines, we’ll configure devd.'
  - '[PAGE 156]


    # CARP and devd(8)


    On FreeBSD, CARP interfaces send events to devd(8) when they change roles. On
    older versions, when CARP ran as a virtual interface, those events were up and
    down notifications. Now that CARP is an attribute applied to an existing interface,
    those events specifically notify devd when the interface assumes the master or
    backup role. If you''re unclear on how of this works, review Chapter 2.


    Processing these events requires custom rules to trigger shell scripts. I advise
    putting these rules in /usr/local/etc/devd/carp.conf. As we don''t have filesystem
    failover scripts yet, I use these events to trigger a log entry.


    ```

    notify 30 {

    match "system" "CARP";

    match "subsystem" "[0-9]+@[0-9a-z]*";nmatch "type" "MASTER"

    action "/usr/bin/logger devd carp up event detected";n}

    ```


    ```

    notify 30 {

    match "system" "CARP";

    match "subsystem" "[0-9]+@[0-9a-z]*";nmatch "type" "BACKUP"

    action "/usr/bin/logger devd carp down event detected";n}

    ```


    Have your hosts switch between the master and backup roles a few times. Run tail
    -f /var/log/messages in a separate terminal window, so you can see the logs appear.
    Once it''s clear that devd runs commands as you expect, you''re ready to actually
    implement filesystem failover.'
  - '[PAGE 157]


    # Failover Scripts


    No matter which storage back end you use for your high-availability networked
    disk, you''ll need three basic scripts.


    At system boot, you must put the storage in a usable state. This startup script
    can''t make the newly booted host the cluster master—that’s likely to cause a
    HAST split brain or a corrupt ZFS pool. But at boot you can safely attach iSCSI
    targets, or put HAST devices in a secondary role.


    When a host becomes the CARP master, you''ll need to activate the storage. HAST
    hosts must switch to the primary role and import or mount any filesystems. iSCSI
    hosts must import or mount any filesystems. Finally, this script needs to start
    any processes that you use the filesystem.


    When a host becomes the CARP backup, quickly stop any processes using the filesystem.
    Those processes are no longer serving client requests—the IP address clients go
    to is no longer attached to this machine. After terminating the processes, unmount
    or export the filesystem. If you''re using a HAST device, the host switches the
    HAST device to the secondary role.


    Before deploying failover scripts, test them. Use the script to demote the master
    to a backup. Then run the promotion script on the alternate host. Make sure that
    everything mounts automatically. Reverse the process: dem the new master, then
    promote the backup. Remember, you can''t have two master hosts simultaneously—that
    causes split brain problems or an otherwise corrupt filesystem. Once you''re confident
    that the scripts work with your environment, /usr/local/etc/dev/carp.conf to have
    CARP state changes automate the failover process. Then trigger failures by changing
    CARP state. Reboot each host and see that the other takes over. Perform "unceremonious
    shutdown" tests. Pull the power on one host, and make sure that the other takes
    over.


    Batter and abuse your test hosts as thoroughly as possible. Each test you perform
    before deploy reduces the risk of data loss in production.


    Here are some sample scripts for each storage back end. These scripts use ZFS,
    but you can easily modify them to use UFS. They conform to my scripting prejudices—specifically,
    they''re small scripts that perform a single task each. The promotion and demotion
    scripts are based on Freddie Cash''s HAST and CARP failover scripts. I''ve folded,
    spingled, and mutilated them so badly that he certainly retains credit for his
    work, he no longer bears any responsibility for their failures. Feel free to rearrange
    them'
- md: "\nto suit your environment and prejudices. I did.\n\n# HAST Failover Scripts\n\
    \nWhen hastd starts, it places all HAST devices in init mode. They’re ready to\
    \ do something, as soon as you tell them what to do. This is for safety reasons;\
    \ if two hosts both decide that they’re the primary node for the same HAST devices,\
    \ and you server you'll both develop a split-brain error.\n\nWhen you’re designing\
    \ a HAST-backed failover system, remember that HAST synchronizes devices in serial,\
    \ rather than parallel. A host must synchronize every HAST device before switching\
    \ roles. If a host has eight HAST devices, the slowest part of the failover process\
    \ will take eight times longer than it would with only one device.\n\nYou can\
    \ automatically put your HAST devices in the secondary role safely, however. If\
    \ the other node has been running and assumed the master role, everything will\
    \ just work. If both nodes boot simultaneously, they’ll be in secondary mode.\
    \ Services won’t be up, but you won’t have data loss. You must run hastctl after\
    \ hastd starts, however. Here’s a very stripped-down rc.d script that accomplishes\
    \ this. I’ve skipped most of the recorder(8) functions, as putting your HAST devices\
    \ in a usable state isn’t really a.\n\n```sh\n#!/bin/sh\n\n# PROVIDE: hastctl\n\
    # REQUIRE: hastd\n```\n\n```sh\nhastctl role secondary hast1\nhastctl role secondary\
    \ hast2\n```\n\nMake an entry for each of your HAST devices. Or add loops, for\
    \ fancy. If you have so many HAST devices that you need loops, though, reconsider\
    \ your application architecture. It’s best to put ZFS redundancy below the HAST\
    \ devices. Remember, the purpose of sending ZFS metadata over HAST is to make\
    \ your redundant disk slower. Copy this script to /usr/local/etc/rc.d/hastctl\
    \ and make it executable.\n\nThese failover scripts assume that your ZFS pools\
    \ have the same name as your HAST resources. Each pool should have only one device\
    \ beneath it—remember, any redundancy belongs below the HAST device.\n\nIf you\
    \ use UFS with HAST, also name your UFS mount points after your HAST resources.\
    \ Replace the zpool(8) commands with calls to unmount(8).\n\nFor the master-to-backup\
    \ script, you must set resources to the name of your HAST resources. You must\
    \ also identify processes to stop. In this example I've used httpd, and stopped\
    \ it by using service(8). If all fails, your script can use pkill -9 to terminate\
    \ processes with prejudice. By the time your script runs, the CARP VHID is on\
    \ the other host. This machine is no longer providing service.\n\n```sh\n#!/bin/sh\n\
    ```\n\n```sh\n# in hast.conf\n# Use the same name for your pool or mount point\n\
    \nresources=\"hast1 hast2\"\n\n#logging\nlog=\"local0.debug\nname=\"hast-carp-demote.sh\"\
    \n\n#terminate processes here\n\nservice httpd stop\n\n# end of user configurable\
    \ stuff\n# do not go beyond this point\n\nfor disk in ${resources}; do\n\n  #\
    \ forcibly unmount the filesystem\n\n```sh\nzpool export -f ${disk} 2>&1\nif [\
    \ $? -ne 0 ]; then\n  logger -p $log -t name=\"Unable to export the pool ${disk}\"\
    \n  exit 1\nfi\n```\n\n```sh\n# Switch roles for the HAST resources\nhastctl role\
    \ secondary ${disk} 2>&1\nif [ $? -ne 0 ]; then\n  logger -p $log -t name=\"Unable\
    \ to switch role to secondary for resource ${disk}\"\n  exit 1\nfi\n```\n\n```sh\n\
    logger -p $log -t name=\"Role switched to secondary for resource ${disk}\"\ndone\n\
    ```\n\nCopy this script to /usr/local/scripts/hast-carp-demote.sh and make it\
    \ executable.\n\nThe backup-to-master script below requires that you set resources\
    \ to the name of your HAST resources. This script doesn't actually mount any filesystems.\
    \ Use a HAST events script, as shown in Chapter 9, to mount the filesystems. Start\
    \ any processes either in the HAST events script or at the end of this script.\n\
    \n```sh\n#!/bin/sh\n\n# The names of the HAST resources, as listed in hast.conf\n\
    # Use the same name for your pool or mount point\n\nresources=\"hast1 hast2\"\n\
    \n# logging\nlog=\"local0.debug\"\n\n# end of user configurable stuff\n# do not\
    \ go beyond this point\n\nname=\"hast-carp-promote.sh\"\n\nlogger -p $log -t $name\
    \ \"Switching to primary provider for ${resources}\"\n\n# Wait for all \"hasd\
