    # DVD and Blu-ray: UDF


    You can use the CD-style ISO 9660 filesystems on any optical media up to 4.3 GB.
    This means you can use a CD filesystem on a single layer DVD. Larger optical media,
    like a multi-layer DVD or Blu-ray, use the Universal Data Format (UDF) filesystem
    or a hybrid ISO 9660/UDF filesystem. Like ISO 9660, UDF is a read-only filesystem.
    You can create UDF images and burn them to disk, but you can''t edit an existing
    image.


    FreeBSD supports reading from and writing to UDF disks. UDF is a read-only filesystem,
    where FreeBSD can write a filesystem to a disk, exactly like an (ISO.) You can
    use DVD and Blu-ray disks to store and transfer data. Writable optical media is
    not a durable long-term storage medium, but in some environments it''s the best
    option.


    UDF support is not the same thing as reading commercial DVDs and Blu-ray disks.
    Commercial optical disks, like those used for films, are encrypted. There is no
    freely available solution for watching DVD or Blu-ray disks on open source operating
    system. An Internet search will expose many methods for breaking much of that
    encryption, but that''s beyond the scope of this book.


    We''re not going to spend time exploring the specifics of the DVD-Video format,
    a specific arrangement of files suitable for a Blu-ray or DVD player. That quickly
    becomes complicated, and you can find extensive cross-platform literature on DVD-Video.
    Use third-party tools like the dvdauthor package to create filesystems.


    Finally, with CDs, we''re not going to cover multisession disks. Multisession
    disks are where you append data to the end of a read-write optical disk, rather
    than overwriting the existing filesystem. Hardware support for multisession disks
    is mixed, and DVD-RW and DVD+RW have different restrictions on their use. If you
    really want to dive into multisession disks, check the FreeBSD Handbook for all
    the tedious details. Instance, we''ll cover all that the UDF users must know.


    # UDF Hardware


    DVD disks are standardized. And you get several standards to choose from.


    The most common standards for DVD disks are DVD-R and DVD+R. Each comes in a read-write
    format, DVD-RW and DVD+RW. DVD drives work with one of these, but might not support
    both. DVD drives manufactured today are classified as DVD+/-, and support both
    media types. Before experimenting with reading and writing DVDs, be sure that
    your hardware and blank media are compatible with each other. Burning a DVD-RW'
