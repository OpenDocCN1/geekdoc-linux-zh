    # Highly Available Storage


    The ability to access disks across the network immediately leads to the idea of
    mirroring disks across the network. You could build your own networked mirrored
    disks with raw iSCSI or geom_gate, from FreeBSD includes the Highly Available
    Storage (or HAST) system engineered exactly for this.


    HAST works as a GEOM layer. It sits on top of a storage provider such as a disk,
    ZFS volume, or image file. Each HAST instance is paired with a HAST provider on
    another system. The HAST support daemon, hastd(8), keeps the HAST devices synchronized.
    Any change to the provider assigns one of the HAST servers mirrored on the primary
    provider.


    The sysadmin assigns one of the HAST servers the primary role and the other secondary
    role. HAST offers a device node in /dev/hast for each pair of mirrored storage
    devices. Use that device node as you would any other node—partition, put a filesystem
    on it, use it as part of a ZFS pool, whatever.


    When the primary host fails, the secondary host can make itself, mount the filesystem,
    and resume providing service. This failover is not automatic, but is pretty easy
    to automate through the Common Address Redundancy Protocol (CARP) and dev(8).


    Before configuring HAST, consider carefully if you need disk-level redundancy.
    Does your app truly require synchronized filesystems on two machines? Or is HAST
    just enough to configure real-time MySQL replication? Mirroring across the network
    introduces many possible points of failure. While your database software’s replication
    methods might drive you to the edge of madness, recovering a wonky database is
    much easier than recovering a scrambled filesystem.


    HAST is best suited to an environment where you have two physical servers and
    want to mirror a chunk of storage between them. If you have a larger infrastructure
    than two hosts, using two iSCSI drives on servers as the data store and having
    multiple hosts configure them as ZFS or GEOM mirrors. If you need interoperability
    with other operating systems, use iSCSI instead.


    HAST requires assigning devices to participate in the mirror, configuring and
    initializing the mirror, creating a filesystem, and configuring failover.


    # Provisioning HAST


