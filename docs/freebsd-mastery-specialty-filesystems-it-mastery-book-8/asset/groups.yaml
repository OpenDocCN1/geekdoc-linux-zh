    # iSCSI Discovery


    The simplest way to connect an initiator to a portal is to perform an iSCSI discovery.
    This is where the initiator goes to the iSCSI portal on the target server and
    says, "Hey, what LUNs can you tell me?" If the initiator successfully authenticates,
    the portal returns a list of targets.


    The AA flag iscsctl to add a session. The -d flag triggers discovery, and takes
    one argument: the hostname or IP address of the iSCSI portal group. Here I perform
    iSCSI discovery across the host data.mwl.io


    ```

    # iscsctl -A -d data.mwl.io

    ```


    When the initiator get drive information, it automatically logs into the system
    and attaches all of the discovered LUNs to the local system. The only way to see
    what your initiator discovered is to view the existing iSCSI sessions.


    # Viewing iSCSI Session and Connections


    To see all iSCSI sessions, run iscsctl without any arguments or use the -L


    ```

    # iscsctl -L

    Target name Target.mwl:target0 storm Connected: da4 da5

    iqn.2013-11.io.mwl:target1 storm Connected: da3

    ```


    This initiator has connected to two targets on this host. You''ll see the target
    names, the portal, and the device node local host has assigned to the drives in
    this target.


    If you want more detail, add the -v flag to -L.


    ```

    # iscsctl -Lv

    Session ID: 21

    Initiator name: iqn.2013-11.io.mwl:host1

    Initiator portal:

    Initiator alias:

    ```'
