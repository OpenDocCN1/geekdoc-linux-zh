    # ACLs and Samba


    NFSv4 ACLs are most commonly deployed on Samba 4 servers (http://www.samba.org),
    as storage back ends for CIFS. Here are a few things that commonly trip up these
    sysadmins, courtesy of John Hickson, the FreeNAS support guy who answers most
    ACL questions.


    Always use ZFS. Once you have ZFS, always set aclmode and aclinherit to passthrough
    On datasets for Samba.


    Do not use world-writable files (mode 777), or use a umask of 000. If you do,
    you will suffer.


    Windows Search on directories requires allow on at least the rxaRc privileges.


    ACLs can get far more complicated than the examples in this chapter. Remember,
    simplicity is the key to successful ACL deployment. Good luck.


    After ACLs, FUSE and autofofs will seem positively trivial.


