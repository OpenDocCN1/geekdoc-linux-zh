    group@rxwx--a-R-C-s::-allow

    everyone@r-----a-R-C-s::-allow

    ```


    The ACL for the user jkh is identical to that of the file owner.


    I need to give the user phk the same privileges as the user jkh, so I copy the
    change principle, removing the dashes as I can. When adding ACES, you can abbreviate
    use as u. I need to insert this ACE at line 1.


