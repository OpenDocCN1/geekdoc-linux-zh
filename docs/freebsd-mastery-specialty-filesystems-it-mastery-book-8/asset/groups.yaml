- md: "\nIt’s rare that all your systems will fail simultaneously. You can tell the\
    \ initiator how to react when the target disappears.\n\nBy default, the FreeBSD\
    \ initiator retains the device nodes for the missing drives. The iscid(8) daemon\
    \ keeps trying to restore the connection to the targets. In some settings it makes\
    \ more sense to remove the device nodes, however, such as the failover discussed\
    \ in Chapter 10. To make the initiator remove the device nodes when the target\
    \ disappears, set the tunable `kern.iscsi.fail_on_disconnection` to 1.\n\nNow\
    \ that you can compel iSCSI to obey your will, let’s move on to HAST.\n\n> No,\
    \ you can’t have LUN π.\n\n## Chapter 9: GEOM_GATE and HAST\n\nIn addition to\
    \ exporting filesystems across the network, FreeBSD lets you export device nodes.\
    \ Device nodes are very operating system specific—there’s rarely a reason to say,\
    \ address a Linux device node directly on a FreeBSD host or vice-versa. But perhaps\
    \ you need to access the CD burner in machine A from machine B, or you need to\
    \ get a filesystem image on a host that doesn't have enough space to store that,\
    \ or you just need some temporary storage space. FreeBSD includes the geom_gate\
    \ kernel module, or ggate, that can transport storage device nodes (disks and\
    \ partitions, memory devices, and optical drives) across the network.\n\nExporting\
    \ device nodes across the network makes all kinds of things possible. The most\
    \ obvious is to mirror a disk partition between two hosts, so that the hosts constantly\
    \ synchronize data on those partitions. FreeBSD’s HAST, or Highly Available Storage,\
    \ lets you synchronize disks across the network.\n\nThese disk device exports\
    \ are neither encrypted nor authenticated. Anyone who can intercept the traffic\
    \ can view the transactions. So you get a small amount of security through obscurity,\
    \ but never rely on an attacker’s ignorance. If you don’t trust the network layer,\
    \ tunnel this traffic inside a VPN or over SSH. These exports use TCP port 3080\
    \ by default. If you deploy geom_gate or HAST on a public network, protect TCP/3080\
    \ with a firewall or packet filter. Better still, directly connect the mirrored\
    \ hosts with a direct (crossover-style) cable or private VLAN.\n\n## geom_gate\
    \ Drawbacks\n\nThe geom_gate protocol manages to combine the disadvantages of\
    \ user space filesystems (Chapter 12) with the disadvantages of networked disks\
    \ as used by iSCSI (Chapter 8).\n\nLike FUSE, both geom_gate and HAST pass storage\
