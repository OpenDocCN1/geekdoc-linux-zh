    You cannot arbitrarily remap user accounts to each other. In complex environments,
    be sure you synchronize your accounts and UIDs on all machines in your network.


    One thing to remember is that users in NFS belong to no more than 16 groups. (Some
    older operating systems limit their NFS servers to fewer groups.) Some operating
    systems can break that limit, but they break the NFS protocol in doing so. If
    a user can''t access files with group-based access control, check the number of
    groups that they''re in.


    ## Exporting Multiple Directories


    You might want to export multiple directories on one partition. List all directories
    exported to /etc/exports, separated by spaces. Here I export four directories
    on your system''s root partition.

    `/home/mwl/usr/var/log/var/db -maproot=nfsroot`


    Clients may mount any of these directories, and requests from root mapped to the
    user nfsroot.


    Perhaps you want clients to be able to mount a directory on a partition. Permit
    this with the -aldirs option. Here, users can mount any directory on the /home
    partition.

    `-aldirs`


    The -aldirs option works only when the directory is a partition mount point. I
    could not specify a directory that''s not a mount point and permit mounting any
    directory beneath it.


    ## Long Lines


    Do not use any identifiers, delimiters, commas, or other separators between the
    various parts of the line. Tabs are okay.


    In the example, having each directory on its own line would be easier to read,
    but as they''re all on the same partition, we can''t do that. The FreeBSD NFS
    folks could redesign /etc/exports in a more structured manner, but FreeBSD would
    have an exports file incompatible with any other Unix-like operating system. Yes,
    organizations frequently share exports between machines, even machines with different
    operating systems.


    You can break lines up with a backslash, however. Once an exports line gets long
    enough, line breaks are almost mandatory.

    `/home/mwl \`


    ```

    /usr/src \

    /var/log \

    /var/db \

    -maproot=65533

    ```


    However you arrange your exports file, it’s not fun to read. Choose your preferred
    pain.


    ## Restricting Clients


    By default, any host anywhere in the world may access exported NFS shares. To
    restrict access, listed permitted hosts at the end of the /etc/exports entry.
    Here I restrict access to my home directory to a single IP address.


    ```

    /home/mwl 203.0.113.111

    ```


    Restrict NFS mounts to clients on a specific network by using the -network and
    -mask qualifiers.


    ```

    /home/mwl -network 203.0.113.0 -mask 255.255.255.0

    ```


    Here, any host with an IP address beginning in 203.0.113 can access my home directory.


    Those of you familiar with slash netmask notation can use that instead.


    ```

    /home/mwl -network 203.0.113.0/24

    ```


    The two examples above are functionally identical, but I find the second readable.


    You can have only one network statement per entry. To export to multiple networks,
    use multiple lines.


    ```

    /home/mwl -network 203.0.113.0/24

    /home/mwl -network 198.51.100.0/24

    ```


    IPv6 addresses work exactly the same, of course. Here I let an IPv6 block access
    my NFS share.


    ```

    /home/mwl -network 2001:db8:bad::/64

    ```


    You can also specify hosts by hostnames or NIS netgroups. List each host by short
    or long name at the end of the line, separated by spaces. Here I give three hosts
    access to the share.


    ```

    /home/mwl -maproot=fsroot blue agouti

    ```


    Using hostnames creates dependencies on name resolution. Losing domain service
    (DNS) is sufficiently unpleasant without adding NFS failures to that. Additionally,
    these names are not dynamic. The NFS server looks up the IP address of each host
    when you restart mount. Changing a client''s IP means reloading the name service
    and restarting mountd.


    Using individual IP addresses instead of hostnames in the exports file means that
    you change a client''s IP, you must change its entry in /etc/exports and restart
    mountd.


    Either way, managing per-host NFS assignments takes more work. Assign NFS permissions
    as broadly as possible without compromising security.


    ## Invalid Combinations


    One combination of a partition (or directories on a single partition) and a host
    (or group of hosts) can have only one line in /etc/exports. A host with only one
    filesystem cannot use these exports statements. Remember, FreeBSD''s installer
