    It’s rare that all your systems will fail simultaneously. You can tell the initiator
    how to react when the target disappears.


    By default, the FreeBSD initiator retains the device nodes for the missing drives.
    The iscid(8) daemon keeps trying to restore the connection to the targets. In
    some settings it makes more sense to remove the device nodes, however, such as
    the failover discussed in Chapter 10. To make the initiator remove the device
    nodes when the target disappears, set the tunable `kern.iscsi.fail_on_disconnection`
    to 1.


    Now that you can compel iSCSI to obey your will, let’s move on to HAST.


