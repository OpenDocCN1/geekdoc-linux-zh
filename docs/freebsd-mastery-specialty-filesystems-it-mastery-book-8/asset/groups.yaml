  - '[PAGE 165]


    # Cluster Startup


    These scripts place a host in backup mode at boot. If you reboot one host at a
    time, everything fails over correctly. A cold start of both nodes, however, is
    more problematic. An individual system has no way to tell that the whole cluster
    has been cold booted.


    FreeBSD starts its early in the boot process. The network includes CARP, of course.
    It starts CARP before HAST or iSCSI. Do you reboot a server to automatically claim
    the master role from a fully functional peer? Probably not—it won''t have the
    storage ready, or its applications, or even SSH. Debugging a troubled server means
    rebooting multiple times.


    When both nodes boot simultaneously, I recommend having a third party decide which
    node to make the master. This third party may be you. It might be a piece of software
    on another machine. Running the promote script on the select master node should
    bring it fully and initiate the failover.


    Are there alternatives? Sure. They all boil down to: what risks can you accept?
    You could write a system boot script to enable and configure CARP well after the
    host boots. You could declare that host A always claims the master role when it
    boots. Each of these risks, depending entirely on your environment and architecture.
    Think carefully, and choose the most automated solution that imposes only acceptable
    risk.


    To really dive into risk, let''s talk about Access Control Lists.


    > ¹ If I tell you how to make a file executable, you should not be implementing
    highly available filesystems.


    > ² If you can''t kill this particular software ungracefully, it''s probably a
    database. And I warned against running databases on filesystem-level failback
    in Chapter 9, so I have a complete lack of sympathy for you.'
