  mdcn: '

    这本书介绍了 ACL 的细节贯穿于其中。很大大部分内容是用伪代码编写的。将这些内容转换为系统管理文本将写满很多卷书，并且包含许多系统管理员不需要（或不想！）知道的内容。其目标是让你熟悉
    NFSv4 ACL 的运行机制和行为，以便你能够做出大致合理的的设计决策，并对识别和解决常见问题有合理的希望。


    ## ACL 与文件系统


    所有的 ACL 实现都要求底层文件系统的支持。UFS 支持 POSIX 和 NFSv4 ACL。UFS 和 ZFS 都支持 NFSv4 ACL，但它们的行为略有不同。我将在本章稍后的“ACL
    继承”部分给出详细细节，但这里是基础知识。


    对于 NFSv4 ACL 来说，ZFS 是更好的选择，并且它默认启用了这些。ZFS 提供了两种将目录 ACL 传递给文件和子目录模式。想要使用更流行的 ACL
    继承方式（Windows 客户端预期的那种）的用户，在创建任何需要 ACL 的文件或目录之前，需要将任何数据集的 `acmode` 和 `aclherit`
    属性设置为 `passthrough`。在创建任何文件或应用任何 ACL 之前设置此值。


    你可以在 UFS 文件系统上使用 NFSv4。然而，UFS 文件系统仅支持一种 ACL 继承方法，虽然这种方法不太流行，但它可能适用于你。你必须通过 `nfsv4acls
    mount(8)` 选项启用 ACL。


    ## ACL 格式


    NFSv4 访问控制列表包含一组访问控制条目（ACE）。每个 ACE 描述了分配给单个实体（如用户、组或系统上的所有人）的权限。理解 ACL 最简单方法是看一个简单的示例。使用
    `getfacl(1)` 查看文件或目录上的 ACL。


    这里我有一个具有常见权限的文件。


    ```

    # ls -l file1

    -rw-rw-r-- 1 mwl Nov 16 13:16 file1

    ```


    我没有给这个文件分配任何 ACL。所有者可以读取、写入和执行该文件，所属组的成员可以读取和写入该文件，其他人可以读取它。让我们看看这些权限是如何作为 ACL
    显示的。


    ```

    # getfacl file1

    # file: file1

    # owner: mwl

    # group: mwl

    owner@rwwx::allow

    group@rw--a-R-C--s::allow

    everyone@------a-R-C--s::allow

    ```


