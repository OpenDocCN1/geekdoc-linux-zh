    \nReading this ACL, the user jkh has exactly the same permissions on this file\
    \ as the owner. We have four groups of permissions on the file.\n\n## Read Permissions\n\
    \nRead permissions control a user's ability to read the file.\n\nThe (r) permission\
    \ is the standard Unix read permission. In NFSv4, it's broken down into:\n\n-\
