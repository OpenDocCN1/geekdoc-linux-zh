    # Memory Disks and /etc/fstab


    Listing memory disks in /etc/fstab tells FreeBSD to automatically create them
    at boot. The device name is md and the filesystem type is mfs. In the options
    column, list any command-line options used to create this device, as shown here.


    ```

    md /mnt mfs rw, -s16m

    ```


    When mounted from /etc/fstab, memory disks are world-writable and have the sticky
    bit set. These permissions are appropriate for /tmp, but not so much for anywhere
    else. Specify the permissions as a mount option, but remember that /etc/fstab
    does not tolerate extra spaces. Separate the various options with commas, and
    eliminate any command-line options and their arguments.


