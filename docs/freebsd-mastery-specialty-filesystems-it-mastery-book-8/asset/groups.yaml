    ...字符串的中间部分，或者给出一个精确的名称。如果我只想更改笔记本电脑上的第二个串口，可以指定设备 `cuau1`。


    `type` 关键字指定了这些规则应用的设备。有效的类型有 `disk`（磁盘设备）、`mem`（内存设备）、`tape`（磁带设备）和 `ty`（终端和伪终端）。我很少精确使用
    `type` 关键字，因为它的范围太广。虽然我可能希望某个磁盘具有不同的配置，但我并不希望重新配置系统中所有的磁盘。


    如果你既不使用 `path` 也不使用 `type` 关键字，`devfs` 将规则应用于所有设备节点。如果你不知道为什么这是个坏主意，请在测试机器上尝试一次。这是你教育中至重要的一部分。


    规则的操作可以是 `group`、`user`、`mode`、`hide` 和 `unhide` 中的任何一个。


    `group` 操作允许你将设备的组所有者设置为额外参数。同样，`user` 操作分配设备的所有者。我在我们的第一个示例中更改了所有者，但在这里我更改了同一个设备的组所有者。


    ```

    add path cuau* group wheel

    ```


    `mode` 操作允许你为设备节点分配八进制权限。


    ```

    add path da4 mode 664

    ```


    `hide` 关键字可以让设备节点消失，而 `unhide` 则让它们重新显示。程序无法使用被隐藏的设备节点。你可以将 `hide` 和 `unhide`
    用于 chroots 和 jails，在这些情况下，系统应该只访问一小部分设备节点。


    ## 嵌套规则 (Nesting Rules)


    一个规则集可以包含其他规则集。考虑这个默认规则集：


    ```

    [devfsrules_jail=-4]

    add include $devfsrules_hide_all

    add include $devfsrules_unhide_basic

    add include $devfsrules_unhide_login

    add path zfs unhide

    ```


    这个规则集是用于 jail 的。它被命名为 `devfs.rules_jail`，并被分配规则集编号 4。“add include” 语句引入了其他规则集，分别为
    `devfs.rules_hide_all`、`devfs.rules_unhide_basic` 和 `devfs.rules_unhide_login`。这些规则在默认规则之前已经定义。它还显式地取消了
    `/dev/zfs` 下设备节点的隐藏。


    你可能需要特定应用程序需要稍微不同的规则集。某些在 chroot(8) 中运行的程序需要 syslog 设备套接字或 `/dev/log`。你可以创建一个自己的规则集，重置为
    `hide_all` 规则，然后取消隐藏日志设备。


    ```

    [devfsrules_logony=100]

    add include $devfsrules_hide_all

    add path log unhide

    ```


    同样，你可能有一个需要访问特定设备的 jail。你可以引用该 jail 的 devfs 规则并添加所需的设备。在这里，我有一个用于串口连接的 jail。


    ```

    [devfsrules_serialjail=100]

    add include $devfsrules_jail

    add path cuau* unhide

    ```


    嵌套规则允许你创建任何想要的变体，同时让更改在规则集中传播。


    ## 使用规则挂载 /devfs


    你可能不想更改 `/dev` 的 devfs 规则。主系统应该能够访问系统上的所有设备。应用程序和 jail 会相应地挂载它们自己的 `/dev` 文件系统。然而，如果你需要为应用程序或根目录挂载设备文件系统，请在
    `/etc/fstab` 中创建一个条目。


    ```

    devfs /var/app/devfs rw,ruleset=101

    ```


    要使用规则集，请使用 `ruleset` 挂载选项和规则集编号。确保逗号和规则集编号之间没有空格。


    ## 命令行中的 Devfs


    你可以使用 `devfs(8)` 命令在命令行中添加、删除和更改 devfs 规则。例如，运行 `devfs rule apply hide` 将移除你所有的设备节点。去吧，试一下。很少有人为了这个功能使用此功能，所以我不打算介绍它，但如果你是其中一员，请使用
    `devfs(8)`。


    如果你决定玩玩这个，请务必使用 `-m` 选项指定非默认设备文件系统的挂载点——否则，你将在默认的系统 `/dev` 上操作，并且可能需要重启系统来恢复。


    现在让我们讨论一些 FreeBSD 的支持系统。


    > 1 别问我在忙些什么。答案不会让你成为一个更快乐的人。


    > 2 为什么要在 FreeBSD 机器上扫描病毒？我不担心 FreeBSD 机器。但 USB 闪盘会在机器之间传输文件。我更倾向于在感染我的蓝光播放器或垃圾处理机之前识别出任何病毒。


    > 3 是的，我的笔记本电脑有多个串口。它还有多个硬盘、64 GB 内存和四个处理器。我的大腿非常大。


    ## 第 3 章：命名空间文件系统 (Namespace Filesystems)


    FreeBSD 包含了几个较小的文件系统，它们以文件系统的方式呈现内部系统信息。这些文件系统几乎总是为了支持或调试特定的软件。进程文件系统 `procfs(5)`
    显示进程信息，让你通过检查文件而不是使用 `ps(1)` 等工具。某些 Linux 软件也期望在系统文件系统中找到硬件信息。FreeBSD 还通过 `mqueuefs(5)`
    支持 POSIX 消息队列文件系统，并通过 `fdescfs(5)` 支持文件描述符文件系统。


    FreeBSD 默认不启用这些文件系统。仅当应用程序需要时才加载或挂载它们。


    运行 `mount` 通常需要在后面有某种存储设备。然而，命名空间文件系统并没有任何后端存储。`mount` 命令期望在后端存储应该的地方有一个参数。对于命名空间文件系统，通常使用文件系统的类型作为参数，但实际上
    `mount` 会忽略它。


    ## 进程文件系统 (Process Filesystems)


    进程文件系统 `procfs(5)` 将当前进程显示为文件。使用 `procfs(5)` 允许你通过 `cat(1)` 和 `grep(1)` 等程序收集信息，而不是使用
    `ps(1)` 等特定的进程工具。由于信息是敏感的，且跨操作系统的 `procfs` 长期存在安全问题，FreeBSD 默认不使用 `procfs`。`procfs`
    中的所有信息也可以通过首选的 `sysctl` 接口获取。

