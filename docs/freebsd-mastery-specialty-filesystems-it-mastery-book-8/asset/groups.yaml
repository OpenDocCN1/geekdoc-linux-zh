  mdcn: '


    ## 配置 autofofs


    Autofs 通过映射（maps）进行配置。映射将设备或分区与挂载该实体的方法关联起来。


    FreeBSD 包含了几个特殊映射。特殊映射是用于处理一整类介质的通用映射。FreeBSD 包含了针对可移动介质、NFS 共享、非自动挂载（noauto）文件系统以及防止
    autofofs 的特殊映射。特殊映射可以处理你可能需要的任何自动挂载配置。


    如果你是极少数无法使用特殊映射的人之一，你可以创建自定义映射来自动挂载目录和介质。`auto_master(5)` 手册页提供了 `/etc/auto_master`
    和自定义映射的完整语法。在某些情况下（但并非所有情况），使用自定义映射是一种管理选择，而非技术上的必要选择。


    我们将重点放在特殊映射上。


    ## auto_master


    `/etc/auto_master` 文件指向自动挂载器映射。每一行都是一个单一映射，包含两个或三个部分：挂载点、映射名称，以及在需要时指定的任何选项。

    默认配置仅包含一个未提交的映射，即 NFS 特殊映射。


    该映射控制挂载点 `/net`。它使用名为 `-hosts` 的映射。当某些程序检查此挂载点下的目录时，autofs 会使用 `nosuid` 和 `intr`
    选项挂载请求的 NFS 共享。`nobrowse` 选项是 autofofs 特有的，它能防止 autofofs 自动为 `/etc/hosts` 中的所有主机创建子目录。


    每当你编辑 `auto_master` 时，都必须运行 `automount` 来为支持 autofofs 的守护进程重新配置映射。


    Autofs 挂载到 `auto_master` 中引的所有挂载点。运行 `automount -L` 查看所有目录。


    ```

    # automount -L

    /net -browse, nosuid, intr -hosts

    ```


    `/net` 目录现在有一个挂载在上面的 autofofs 实例，该实例使用了 `-hosts` 映射。由于 BSD 文件系统是可堆叠的，你可以在 `/net`
    上挂载其他内容，但除非不引起必要的混乱，否则你不这样做。


    ## /etc/autofs


    你可以将映射直接放在 `/etc` 中，或者在 `/etc/autofs` 中使用特殊映射。特殊映射是脚本。当访问挂载点时，Autofs 会运行该脚本。不可执行文件几乎都是系统管理员创建的自定义映射。Autofs
    会像处理其他映射一样打开并解析这些文件。


    FreeBSD 自带的 `/etc/autofs` 目录中的所有映射都是特殊映射。


    ## 使用特殊映射自动挂载


    FreeBSD 附带四个特殊映射：`-hosts`、`-media`、`-noauto` 和 `-null`。（还有一个从 LDAP 读取映射信息的特殊映射，但它高度依赖于环境，因此我们不涵盖它。）你知道一个映射被归类为特殊是因为它在
    `/etc/auto_master` 中的名称以连字符开头。


    位于 `/etc/autofs/special_hosts` 的 `-hosts` 特殊映射识别主机上可用的 NFS 共享。当你触发 NFS 自动挂载请求时，特殊映射会查询
    NFS 服务器以查看哪些资源可用。


    位于 `/etc/autofs/special_media` 的 `-media` 特殊映射会探测未挂载的设备（如可移动介质）并帮助挂载它们。


    `/etc/autofs/special_noauto` 的 `-noauto` 特殊映射会检查 `/etc/fstab` 中未在启动时自动挂载的设备，并在你尝试使用它们时挂载它们。


    最后，`/etc/autofs/special_null` 的 `-null` 特殊映射会锁定挂载点，使得 `automount(d)` 无法在那里挂载任何内容。


    ## 自动挂载 NFS


    让我们尝试用 NFS 测试这种自动挂载。我的测试网络有两个 NFS 服务器：`mail` 和 `www`。我知道我的工作站可以访问这两个者的共享，因为我之前手动挂载过它们。


    要从服务器自动挂载，请查看 `/net` 中以服务器命名的目录。在你查找它之前该目录并不存在，但尽管如此请试试。现在，我的工作站的 `/net` 是空的。要查看主机
    `mail` 上的可用共享，请 `cd` 或 `ls` `/net/mail` 目录。


    ```

    # ls /net/mail

    usr var

    ```


    此时没有任何内容实际上被挂载：autofs 显示了可用的共享。好在，可用 NFS 共享的目录现在存在了。


    这台邮件服务器通过 NFS 导出 `/var/log`。一旦我在工作站上尝试检查 `/net/mail/var/log`，autofs 就会将 NFS 共享挂载到该目录。我邮件服务器配置允许的任何权限，就像我的系统管理员为我挂载了这个共享一样。


    如果 NFS 服务器消失，挂载请求可能仍会阻塞。这就是为什么 autofofs 默认使用 `intr` 选项挂载 NFS 共享，这样用户可以使用 `CTRL-c`
    取回终端，而无需打扰系统管理员。


    ## 自动挂载可移动介质


    `/etc/auto_master` 中的默认配置包含了一行注释掉的行，用于在 `/media` 上自动挂载可移动驱动器。它默认未启用；虽然 `/media`
    用于可移动驱动器，但许多系统管理员使用它手动挂载介质。让自动挂载器突然垄断 `/media` 将违反最小惊讶原则。


    此规则为自动挂载器预留了 `/media` 目录。它适用于 `media-media` 以及所有带有 `nosuid` 选项的内容。取消注释并以 root
    身份运行 `autom` 来激活它。


