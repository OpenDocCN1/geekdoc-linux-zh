    # 后记


    虽然我是几种基于 BSD 的操作系统的粉丝，但 FreeBSD 的文件系统确实是一个杀手级特性，提供了任何其他操作系统都无法比拟的灵活性。FreeBSD 不会拍你的头并告诉你它知道你的存储应该如何工作。FreeBSD
