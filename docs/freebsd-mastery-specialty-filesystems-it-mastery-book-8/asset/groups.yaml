    # ACLs and Filesystems


    All ACL implementations require support in the underlying filesystem. UFS supports
    POSIX and NFSv4 ACLs. Both UFS and ZFS support NFSv4 ACLs, but they behave slightly
    differently. I''ll give the details in “ACL Inheritance” later this chapter, but
    here are the basics.


    ZFS is preferable for NFSv4 ACLs, and ZFS enables them by default. ZFS offers
    two modes of passing directory ACLs down to files and subdirectories. Users who
    want the more popular way of inheriting ACLs, the one expected by Windows clients,
    need to set the properties `acmode` and `aclherit` to `passthrough` on any dataset
    before creating any files or directories that will need ACLs. Set this value before
    creating any files or applying any ACLs.


    You can use NFSv4s on UFS filesystems. UFS filesystems support only one method
    of ACL inheritance, however, and while it''s the less popular method, it might
    do for you. You must enable ACLs with the `nfsv4acls mount(8)` option.'
  - '[PAGE 171]


    # ACL Format


    NFSv4 Access Control List contains a list of Access Control Entries (ACEs). Each
    ACE describes the permissions assigned to a single entity such as a user, a group,
    or everyone on the system. The easiest way to understand ACLs is to look at a
    simple one. Use getfacl(1) to view the ACL on a file or directory.


    Here I have a file with very common permissions.


    ```

    # ls -l file1

    -rw-rw-r-- 1 mwl Nov 16 13:16 file1

    ```


    I have not assigned any ACLs to this file. The owner can read, write, and execute
    the file, members of the owning group can read and write the file, and everyone
    else can read it. Let''s see how these permissions show up as an ACL.


    ```

    # getfacl file1

    # file: file1

    # owner: mwl

    # group: mwl

    owner@rwwx::allow

    group@rw--a-R-C--s::allow

    everyone@------a-R-C--s::allow

    ```


    Where did this ACL come from? It''s built out of the standard file permissions.
    Once I apply an ACL to this file, the filesystem permissions and the ACL diverge.
    This ACL contains three ACE entries, each with four colon-separated fields.


    The first field, the ACL tag, gives the type of entity this ACL applies to. For
    the first entry, owner@, says that ACE is for the file owner. The second ACE tag,
    group@, means this ACL is for the group owner, while the third, everyone@, represents
    everyone on the system (“Everyone” in traditional Unix means “everyone except
    the owner and group owner”), while in NFSv4 ACLs it means “everyone including
    the owners.”)


    The second field gives the ACL permissions assigned to the tag. The first three
    characters of each should look familiar; they’re the standard Unix-style permissions
    for this user or group. For example, the tag owner@ (representing the file owner)
    gets rw-, just as you see in ls -l. These get a whole bunch of new settings, though,
    represented by the jumble of letters after the leading three. We’ll see what privilege
    each letter represents in “ACL Permissions,” later this chapter.


    The third field gives any inheritance settings for the files and directories.
    Files and directories can inherit ACL settings from their parent directories or
    directories above'
  - '[PAGE 172]


    them. As this file has built its ACL out of standard Unix-style permissions and
    there’s no on the parent directory, it hasn''t inherited any ACL-specific information.


    The last entry, the ACL type, says that matching items are either allowed or denied.


    Now let''s look at a file with ACL.


    ```

    # ls -l file2

    # rwx-rw-r+ 1 mwl mwl 0 Nov 16 13:47 file2

    ```


    Note that the standard Unix-style permissions are identical to the first file
    we looked at. The permissions end with a (+) sign, however. This indicates extended
    permissions, or an ACL. Let''s look at these permissions. I am adding the -q flag,
    to eliminate commented-out information at the top.


    ```

    # getfacl -q file2

    user:jkh:rwx--aARWccos:allow

    owner:rwx--aARWccos:allow

    group:rw-p--a-R-C--S:allow

    everyone:@-----a-R-C--S:allow

    ```


    These permissions are very similar to the ones for files, but the ACL has an Access
    Control Entry. The first non-commented line has five fields. What appears as the
    first field in later entries is two fields here.


    In addition to the owner@, group@, and everyone@ tags that map to traditional
    Unix permissions, the tag can specify a user or a group. These tags are followed
    by a qualifier, narrowing down exactly which this ACE applies to. The first entry
    in this ACL applies to the user jkh¹.


    Reading this ACL, the user jkh has exactly the same permissions on this file as
    the owner. We have four groups of permissions on the file, something normal Unix
    permissions don’t permit.


    The user identification part of an ACE—the tag derived from Unix-style permissions,
    or the combination of a tag and a qualifier—is called a principal. Every ACE includes
    a principal, permissions, inheritance, and type.'
