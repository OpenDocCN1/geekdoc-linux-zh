  - '[PAGE 99]


    # Using CIFS


    Working with CIFS requires finding the host, mounting and unmounting shares, and
    understanding permissions and case.


    # CIFS Name Resolution


    BeforeFreeBSD can mount a share, it needs to find the host the share is on. While
    Microsoft has used DNS for many years now, typical Windows environments often
    have a whole budget of legacy protocols. Make sure FreeBSD’s CIFS client can find
    the CIFS server with smbutil lookup.


    ```

    # smbutil lookup fileserver

    Got response from 203.0.113.77

    IP address of fileserver: 203.0.113.77

    ```


    A correct answer means that the simplest CIFS functionality works. Now let''s
    assume some data.


    If you have trouble with name resolution, you might need to use the address keyword
    in nmb.conf to manually set the IP address of any host you want to access. Address
    resolution should always work, but given CIFS has changed in the last quarter
    and how some organizations have structured their environments, it’s nice to have
    the option.


    # Mount CIFS


    Mount a CIFS share with mount_smbfs(8). The mount must include the Windows username,
    as shown here.


    ```

    # mount_smbfs /username@server/mountpoint

    ```


    I want to mount the corporate share on the server fileserver, using the account
    mwl. This share will get mounted at /mnt.


    ```

    # mount_smbfs /mwl@fileserver/corporate/mnt

    ```


    You’ll get prompted for a password. Once you get a vaild password, FreeBSD mounts
    the share and you can easily access documents on the Windows server.


    View all of the servers you’re logged into with smbutil lc.


    ```

    # smbutil lc

    SMB connections:

    VC: \FILESERVER\MWL

    (root:wheel) 711

    Share: CORPORATE(root:wheel) 711

    ```


    This FreeBSD machine is connected to one user account on one host.'
  - '[PAGE 100]


    Disconnect the CIFS filesystem with umount(8), exactly like any other filesystem.


    # CIFS File Ownership


    Windows and Unix-like systems have utterly different permissions schemes. FreeBSD
    usernames map to Windows usernames only accidentally. Combined, these mean you
    need to pay careful attention to permissions when mounting CIFS shares.


    A CIFS mount defaults to using the same permissions as the mount point. If I mount
    the share on /mnt, the files will get the root:wheel ownership and mode 755 used
    by /mnt. If mounted on /home/mw1/mnt, the files will be owned by the user mw1
    and whatever permissions the directory dictate.


    You can specify a user and group for mounted files with the -u and -g options
    to. Similarly, use -d to change the directory mode and -f to change the permissions
    mode. Here I specifically assign my mounted files to be owned by the user and
    group smb, and change the permissions so that only user can access the files.


    ```

    # mount_smbfs -u smbfs -g smb -d 700 -f 600 //mw1/fileserver/corporate /mnt

    ```


    Despite any permissions you assign on the FreeBSD side, the Windows permissions
    also apply. If the Windows user you use to mount the share lacks permission to
    view or edit files, the FreeBSD host cannot view or edit those files.


    # CIFS and Case


    Microsoft filesystems are case-sensitive. FreeBSD tends to leave the case on files
    as it finds it, but that might not be desirable. Automated processes might find
    it easier to identify files with consistent case. The -c flag tells mount_smbfs(8)
    to give everything a consistent case. Using -c 1 changes everything to lowercase,
    -c u changes everything to uppercase.


    CIFS and NFS let you access filesystems over the network. Now let''s make the
    network part of the filesystem itself, with iSCSI and HAST.'
- md: "\n# Chapter 8: iSCSI\n\nSometimes you want to give a host access to a disk\
    \ over the network. This can let you exceed the host's physical limitations. No\
    \ room in the chassis for another disk? Add disk space over the network! Perhaps\
    \ several hosts need access to the same hard drive, as is common for virtualization\
    \ systems. Or you might have hardware that doesn’t have a local disk at all.\n\
    \nThat's where iSCSI comes in. Most storage devices use the Small Computer System\
    \ Interface (SCSI) command set or a subset of those commands. While SCSI hard\
    \ drives disappeared from new systems years ago, SCSI commands linger on in modern\
    \ SATA and SAS drives. iSCSI, or Internet SCSI, tunnels SCSI commands inside TCP.\
    \ Where protocols like NFS (Chapter 6) and CIFS (Chapter 7) require teaching the\
    \ client about a whole new filesystem, iSCSI only requires wrapping standard SCSI\
    \ commands inside a network connection. The client sees the iSCSI drive as a normal\
    \ local drive and can use it accordingly. What could possibly go wrong? Well,\
    \ the network is not a SAS cable—not even a SCSI cable, so the answer is “quite\
    \ a bit, really.”\n\nFreeBSD 10 and newer has an integrated high-performance iSCSI\
    \ stack, interoperable with all major vendors.\n\n# Storage and Network Speed\n\
    \nNetworks are much slower than storage systems. Most modern computers use gigabit\
    \ network interfaces, while their SATA or SAS systems run at six times that. Combined\
    \ with the facts that not all gigabit hardware actually runs at gigabit speeds,\
    \ and most hosts have four or more SATA ports, common disk activity can completely\
    \ saturate a network interface.\n\nIf you start to have performance problems,\
    \ separate your storage network from the rest of your network traffic. I only\
    \ deploy networked storage on a private network. If I have only two machines sharing\
    \ storage over the network, in a failover configuration, I'll connect a cable\
    \ directly between them and put the storage traffic there there. Using iSCSI or\
    \ other raw disk protocols over the network demands careful attention to network\
    \ performance.\n\n# iSCSI Essentials\n\niSCSI is something like a client-server\
    \ protocol. The client is called an iSCSI initiator. iSCSI uses a special name\
    \ for the client because it takes its terminology from SCSI. The client initiates,\
    \ or causes, all activity—that's why it's called the initiator. The target receives\
    \ the requests and acts on them. It's much like any other storage device: the\
    \ operating system makes requests and drives the storage devices. FreeBSD initiators\
    \ use the isiscid(8) daemon to connect to targets.\n\nFreeBSD provides server-side\
    \ iSCSI services with the CAM Target Layer daemon ctld(8). An iSCSI server exports\
    \ storage devices to initiators. These storage devices might be actual hardware,\
    \ ZFS volumes, or on disks. Each storage device offered by the server is called\
    \ an iSCSI target. One iSCSI server can offer as many targets as the underlying\
    \ operating system or hardware support.\n\nAn iSCSI portal is the IP address and\
    \ TCP port where the iSCSI server accepts requests for iSCSI targets. (iSCSI defaults\
    \ to TCP port 3260.) Portals are collected into portal groups, which define which\
    \ IP addresses the portal may listen on. iSCSI is not a protocol for use on the\
    \ public Internet. Always protect your storage with a firewall or packet filter.\n\
    \niSCSI supports authentication via CHAP. You can disable authentication, require\
    \ the initiator to authenticate, or require both the initiator and the target\
    \ to authenticate. You can also disallow authentication, but that prevents anyone\
    \ from talking to your targets.\n\nFinally, iSCSI supports discovery, where an\
    \ initiator asks an iSCSI portal group to list all accessible storage devices.\n\
    \nWe'll start into all this with iSCSI device naming.\n\n# iSCSI Device Naming\n\
    \nThe first thing most people choke on when they start with iSCSI is the naming\
    \ scheme used for both clients and initiators. Looking at a string like iSCSI.1996-03.com.sun:01:3a7b...\
    \ followed by a whole string of hexadecimal numbers and some more periods and\
    \ then more random gobbledygook can be intimidating, annoying, and headache-inducing.\
    \ iSCSI device naming doesn't have to be that difficult, however.\n\nAll iSCSI\
    \ names start with the string *iqn*, for iSCSI Qualified Name, followed by a period.\n\
    \nThen there's the year and month the organization was founded, separated by a\
    \ dash.\n\nThere's another period, and the organization's domain name in reverse\
    \ order. A domain like michaelwlucas becomes .michaelwlucas.\n\nLast you have\
    \ a colon and a name for a particular device on the iSCSI target.\n\nLet's put\
    \ this all together. I'm using the domain name mwl.io, registered in November\
    \ 2013. My iSCSI devices will all have names starting with *iqn.2013-11.io.mwl*.\
    \ Despite many storage vendors claim, iSCSI devices don't need a big long unique\
    \ identifier. Long identifiers make sense on large storage farms, but a simple\
    \ name works when learning. I'll call my first initiator *iqn.2013-11.io.mwl:host1*,\
    \ and my first target *iqn.2013-11.io.mwl:target1*. I could use more meaningful\
    \ names, like the initiator's hostname or the target's drive LUN, but this suffice\
    \ to get started.\n\nThe important thing to remember about all these names is\
    \ that they must be unique on the network. iSCSI device naming can be confusing,\
    \ but the structure is consistent.\n\n# Target Setup\n\nStart by creating a ctld(8)\
    \ configuration file, /etc/ctld.conf. This file should not be world-readable.\n\
    \n```bash\n# /etc\n# set the permissions so that the initiator can't read it\n\
    # chmod 600 /etc/ctld.conf\n```\n\nThen enable ctld at boot.\n\n```bash\n# sysrc\
    \ ctld_enable=YES\n```\n\nNow create your portal group configuration in /etc/ctld.conf.\
    \ You must reload ctld for any changes to take effect.\n\n```text\nportal-group\
    \ group {\n  discovery-auth no-authentication\n  listen 0.0.0.0\n  listen ::\n\
    }\n```\n\nNow you have a portal group to put in the target, create the target\n\
    \n```text\ntarget iqn.2013-11.io.mwl:target0 {\n  auth-group no-authentication\n\
    \  portal-group group0\n  lun 0 {\n    path /dev/zvol/data/disk1\n    size 1T\n\
    \  }\n}\n```\n\nThis gives you a minimal iSCSI configuration that exports one\
    \ device to the entire world, with no iSCSI-level security. Let's expand this\
    \ into something you might want to actually use.\n"
  mdcn: "\n\n# 第 8 章：iSCSI\n\n有时你可能希望让主机通过网络访问磁盘。这可以让你突破主机的物理限制。机箱内没有空间再放另一块磁盘？通过网络添加磁盘空间吧！也许有多个主机需要访问同一块硬盘，这在虚拟化系统中很常见。或者你可能拥有完全没有本地磁盘的硬件。\n\
    \n这就是 iSCSI 大显身手的地方。大多数存储设备使用小型计算机系统接口（SCSI）命令集或其子集。虽然 SCSI 硬盘在多年前已从新系统中消失，但 SCSI\
    \ 命令在现代 SATA 和 SAS 驱动器中仍然存在。iSCSI（或 Internet SCSI）将 SCSI 命令封装在 TCP 内部。诸像 NFS（第\
    \ 6 章）和 CIFS（第 7 章）这样的协议需要让客户端学习全新的文件系统，而 iSCSI 只需将标准的 SCSI 命令封装在网络连接中。客户端将 iSCSI\
    \ 驱动器视为普通的本地驱动器，并据此使用它。可能会出什么问题呢？嗯，网络不是 SAS 线——甚至不是 SCSI 线，所以答案是“实际上会出很多问题”。\n\
    \nFreeBSD 10 及更高版本集成了高性能的 iSCSI 栈，可与所有主要供应商兼容。\n\n# 存储与网络速度\n\n网络远远比存储系统慢。大多数现代计算机使用千兆网络接口，而它们的\
    \ SATA 或 SAS 系统运行速度是后者的六倍。结合并非所有千兆硬件真的都能以千兆速度运行，以及大多数主机拥有四个或更多 SATA 端口等事实，常见的磁盘活动可能会完全饱和网络接口带宽。\n\
    \n如果你开始遇到性能问题，请将你的存储网络与其余网络流量分离。我只在私有网络上部署网络存储。如果只有两台机器通过网络共享存储（处于故障备配置），我会在它们之间直接连接一根线，并将存储流量放在那里。在网络上使用\
    \ iSCSI 或原始磁盘协议需要对网络性能给予关注。\n\n# iSCSI 基础\n\niSCSI 类似于一种客户端-服务器协议。客户端被称为 iSCSI\
    \ 初始化器（initiator）。iSCSI 为客户端使用了一个特殊的名称，因为它的术语源自 SCSI。客户端发起或引起所有活动——这就是为什么它被称为初始化器。目标端（target）接收请求并执行操作。这与任何其他存储设备非常相似：操作系统发出请求并驱动存储设备。FreeBSD\
    \ 初始化器使用 `iscid(8)` 守护进程连接到目标端。\n\nFreeBSD 通过 `ctld(8)` 守护进程提供服务器端 iSCSI 服务。iSCSI\
    \ 服务器向初始化器导出存储设备。这些存储设备可能是实际硬件、ZFS 卷或磁盘上的文件。服务器提供的每个存储设备都称为一个 iSCSI 目标。一个 iSCSI\
    \ 服务器可以提供的目标数量取决于底层操作系统或硬件的支持。\n\niSCSI 端口（portal）是 iSCSI 服务器接受 iSCSI 目标请求的 IP\
    \ 地址和 TCP 端口。（iSCSI 默认使用 TCP 端口 3260。）端口被收集到端口组（portal groups）中，定义了端口监听哪些 IP 地址。iSCSI\
    \ 不是用于公共互联网的协议。请务必使用防火墙或包过滤器保护你的存储。\n\niSCSI 支持通过 CHAP 进行验证。你可以禁用验证、要求初始化器验证，或要求初始化器和目标端都验证。你也可以不允许验证，但这会防止任何人与你的目标通信。\n\
    \n最后，iSCSI 支持发现（discovery），即初始化器询问 iSCSI 端口组列出所有可用的存储设备。\n\n我们将从 iSCSI 设备命名开始介绍这些内容。\n\
    \n# iSCSI 设备命名\n\n大多数人开始使用 iSCSI 时第一个感到困惑的问题就是用于客户端和初始化器的命名方案。看到像如 `iSCSI.1996-03.com.sun:01:3a7b...`\
    \ 后面跟着一串十六进制数字、一些点号以及更多的随机乱码，可能会令人敬畏、恼火且头疼。然而，iSCSI 设备命名并不一定那么困难。\n\n所有 iSCSI\
    \ 名称都以字符串 *iqn*（即 iSCSI 规定名称）开头，后面紧跟一个点。\n\n然后是组织成立的年份和月份，用连字符分隔。\n\n是另一个点，以及倒序排列的组织域名。域名如\
    \ `michaelwlucas` 会变成 `.michaelwlucas`。\n\n最后是一个冒号以及 iSCSI 目标端上特定设备的名称。\n\n让我们把这些整合在一起。我使用的域名是\
    \ `mwl.io`，注册于 2013 年 11 月。我的 iSCSI 设备名称将将以 `iqn.2013-11.io.mwl` 开头。尽管许多存储供应商声称，但\
    \ iSCSI 设备不需要长长的唯一标识符。长标识符在大型存储场是有意义的，但在学习阶段，简单的名称即可。我会将我的第一个初始化器命名为 `iqn.2013-11.io.mwl:host1`，第一个目标命名为\
    \ `iqn.2013-11.io.mwl:target1`。我可以使用更有意义的名字，例如初始化器的主机名或目标的驱动器 LUN，但这些足够入门了。\n\n\
    记住所有这些名称最重要的点是，它们在网络必须是唯一的。iSCSI 设备命名可能令人混乱，但其结构是一致的。\n\n# 目标端设置\n\n首先创建一个 `ctld(8)`\
    \ 配置文件 `/etc/ctld.conf`。此文件不应该是所有人可读的。\n\n```bash\n# /etc\n# 设置权限让初始化器无法读取它\n\
    # chmod 600 /etc/ctld.conf\n```\n\n然后在启动时启用 ctld。\n\n```bash\n# sysrc ctld_enable=YES\n\
    ```\n\n现在在 /etc/ctld.conf 中创建你的端口组配置。你必须重载 ctld 使任何更改生效。\n\n```text\nportal-group\
    \ group {\n  discovery-auth no-authentication\n  listen 0.0.0.0\n  listen ::\n\
    }\n```\n\n现在你有一个可以放入目标的端口组，创建目标：\n\n```text\ntarget iqn.2013-11.io.mwl:target0\
    \ {\n  auth-group no-authentication\n  portal-group group0\n  lun 0 {\n    path\
    \ /dev/zvol/data/disk1\n    size 1T\n  }\n}\n```\n\n这为你提供了一个最小的 iSCSI 配置，向全世界导出了一个设备，且没有任何\
    \ iSCSI 级别的安全保护。让我们将其扩展为你可能真正想要使用的内容。\n\n"
