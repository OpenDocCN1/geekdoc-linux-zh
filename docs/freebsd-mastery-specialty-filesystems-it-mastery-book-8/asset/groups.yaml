  - '[PAGE 132]


    Adding network to storage adds a delightful layer of uncertainty to your data.
    You can feel confident that a server’s SATA cable won’t decide to stop passing
    bits. The network is less certain. Using geomgate userland programs into the mix,
    and userland processes have been known to choke on their own bile.


    If a geomgate component dies, storage requests back up on the client. Recover
    the broken connection by using the ggate rescue command, the -u option, and the
    device number. Here I kickstart a new ggate process for `/dev/ggate3`.


    ```

    # ggatec rescue -u 3 storm /dev/dao0

    ```


    When you rescue the process, any buffered storage requests get sent to the server.


    If you specifically want long-term mirrored storage, check out Highly Available
    Storage.'
