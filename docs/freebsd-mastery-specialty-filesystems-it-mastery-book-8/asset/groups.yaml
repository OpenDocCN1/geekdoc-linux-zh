    # 故障转移架构


    故障转移自动化基于两项关键技术：CARP 和 devd(8)。它们的具体实现方式取决于所选的存储后端。


    ## CARP


    公共地址冗余协议（CARP）是 OpenBSD 创建的一项技术，用于在机器之间共享 IP 地址。它允许地址根据需要跨机器之间进行“漂浮”。CARP 类似于思科的虚拟路由器冗余协议（VRRP），但它包含了对安全性和完整性的检查。此外，CARP
    没有专利负担，因此你可以自由地出于任何目的将其使用、分发或重新实现它。


    CARP 集群中的每台主机都在一个或多个接口上附载了 CARP 属性。每个运行 CARP 的接口都会向网络上的其他主机持续宣告自己的的存在。主机之间通过协商决定由哪一台成为主节点（master）。虽然每个运行
    CARP 的接口都为该机器分配了 IP 地址，但 CARP 主节点会响应所有对浮动 CARP IP 地址的请求。当主节点停止响应时，集群中的另一台主机将接管并声明该
    CARP IP。


    客户端只知道 CARP IP 地址，而不知道单个机器的管理地址。当地址漂浮到另一台机器时，客户端请求会随之移动。关键在于让文件系统和服务器进程也随之移动。


    ## Devd


    当 CARP 接口启动或关闭（即接管或放弃 IP 地址）时，它会向 devd(8) 发送事件。如第 2 节所述，devd 事件可以触发命令。你可以让 FreeBSD
    在 CARP 接口启动时激活存储，在接口关闭时停用存储。


    ## 存储后端


    FreeBSD 有两个可以共享的块存储系统：iSCSI（第 8 节）和 HAST（第 9 节）。选择哪一个取决于你的环境。


    在大型环境中，iSCSI 是网络存储设备的最佳选择。让两台独立的服务器提供 iSCSI 目标（targets），另外两台面向客户端的服务器。面向客户端的服务器可以使用每个
    iSCSI 服务器的一个驱动器创建一个镜像，或者从创建的条带镜像中使用多个驱动器。该环境可以承受一台 iSCSI 服务器和一台面向客户端服务器的故障。只要每种类型的服务器有一台处于激活工作状态，服务就能保持在线。你可以轻松地扩展此环境并根据需要更换硬件。你可能想要一个独立的存储区域网络（SAN），以将存储流量与客户端及管理流量分离。为了获得更高的可用性，请研究多路
    SCSI。


    使用 RAID-Z 实现高可用性是可能的，但它需要在更多独立的服务器上运行 iSCSI 目标。八盘 RAID-3 可以承受三块磁盘的损失。如果你有两台 iSCSI
    服务器，丢失一台服务器意味着丢失磁盘以及整个池。你可以在每台 iSCSI 服务器上创建一个独立的 RAID-Z 设备，然后对池进行镜像。


    如果你只有两台主机，HAST 是你故障转移文件系统的唯一实际选择。向另一台机器提供驱动器是可能的，但这会达到一种极其极其笨拙的新水平。理想情况下，HAST
    主机之间应该有一个私有网络连接，例如交叉线。


    让我们逐一分析该架构。


    ## 配置 CARP


    在 FreeBSD 10 及更高版本中，CARP 是一个附载在现有接口上的属性。旧版本的 FreeBSD（以及所有版本的 OpenBSD）为 CARP 创建了虚拟接口，但新模型简化了具有许多接口的主机的管理工作。CARP
    极其灵活，因此我们只涵盖其基础配置。有关更多详细信息，请参阅 carp(4)。


    首先通过 loader.conf 条目在启动时加载 carp(4) 内核模块。


    ```

    carp_load=YES

    ```


    CARP 的基本单元是虚拟主机（virtual host）。虚拟主机以及附载在虚拟主机上的 IP 地址可以在机器之间漂浮。每个虚拟主机都需要一个 ID 数字，大多数人从
    VHID 1 开始计数。


    每个 VHID 还需要一个密码。该密码可以防止同一网络上的恶意主机伪造 CARP 宣告。与 ISC 密码一样，CARP 密码以明文形式存储在每台机器上，任何配置该主机的网络都需要访问它。在
    /etc/rc.conf 中将 CARP 配置为以太网别名。接口 em0 有它自己的地址，但也拥有 CARP VHID。


    ```

    ifconfig em0="inet 203.0.1.1 netmask 255.255.255.0"

    ifconfig em0_alias="vhid 1"

    ```


    两台主机需要完全相同的 CARP 别名配置（当然，它们需要唯一的 IP 地址）。你应该在两端都添加额外的 CARP 配置，例如将一个硬编码为主节点，这带来了额外的风险。重启第一台主机。你应该在
    ifconfig 中看到 CARP 信息。


    ```

    ifconfig em0="inet 203.0.1.1 netmask 255.255.255.0"

    ifconfig em0_alias="vhid 1"

    ```


    这台主机有它自己的地址 203.0.1.2，作为 VHID 1 的一部分。最后一行显示该接口是 CARP 主节点，意味着它正在处理该 VHID 的请求。重启第二台主机。它的
    ifconfig 输出显示为 backup 状态。如果主节点故障，备份节点将接管。使用 ifconfig 强制主机切换角色。给出接口名称、VHID 和新状态。


    ```

    ifconfig em0 vhid 1 backup

    ```


    通常在主节点上运行此类命令让其降级为备份，效果同样。如果这是你第一次使用 CARP，在继续之前先尝试。根据你的网络切换机硬件，CARP IP 地址从一台主机移动到另一台。一旦你理解了
    VHID 如何在机器之间漂浮，我们将配置 devd(8)。


    在 FreeBSD 上，当 CARP 接口切换角色时会向 devd(8) 发送事件。在旧版本中，当 CARP 作为虚拟接口运行时，这些事件是 up 和 down
    通知。现在 CARP 是应用到现有接口的属性，当接口承担主节点或备份角色时，这些事件会通知 devd。处理这些事件需要自定义规则来触发脚本。我建议将这些规则放在
    /usr/local/etc/devd/carp.conf。由于我们还没有文件系统故障转移脚本，请使用这些事件触发日志记录。


    ```

    notify {

    match "system" "CARP";

    match "subsystem" "[0-9]+@[a-zA-Z]*";

    match "type" "MASTER";

    action "/usr/bin/logger devd carp up";

    }

    ```


    ```

    notify {

    match "system" "CARP";

    match "subsystem" "[0-9]+@[a-zA-Z]*";

    match "type" "BACKUP";

    action "/usr/bin/logger devd carp down";

    }

    ```


    让你的主机在主节点和备份角色之间切换几次。在单独的终端窗口运行 `tail -f /var/log/messages`，这样你可以看到日志出现。一旦明确 devd
    按照你的预期运行命令，就可以实际实现故障转移了。


    ## 故障转移脚本


    无论你为高可用磁盘使用哪种后端，都需要三个基础脚本。


    在系统启动时，你必须使存储处于可用状态。此启动脚本不能让新启动的主机成为集群主节点——这可能导致 HAST 脑裂或 ZFS 池损坏。但在启动时，你可以安全地附加
    iSCSI 目标，或将 HAST 设备设置为辅助角色。


    当主机成为 CARP 主节点时，你需要激活存储。HAST 主机必须切换到主角色并导入或挂载任何文件系统。iSCSI 主机必须导入或挂载任何文件系统。最后，此脚本需要启动使用文件系统的进程。


    当主机成为 CARP 备份时，快速停止任何使用文件系统的进程。这些进程不再提供客户端请求——客户端访问的 IP 地址不再附载到这台机器上。终止进程后，卸载或导出文件系统。如果你使用
    HAST 设备，主机会将 HAST 设备切换到辅助角色。


    在部署故障转移脚本之前，请测试它们。使用脚本将主节点降级为备份。然后在另一台主机上运行提升脚本。确保一切都自动挂载。反转过程：降级新主节点，然后提升备份。记住，你不能同时拥有两个主节点——这会导致脑裂问题或文件系统损坏。一旦你确认脚本在你的环境中可行，配置
    /usr/local/etc/devd/carp.conf 以让 CARP 状态变化自动化故障转移过程。然后通过更改 CARP 状态触发故障。重启每台主机并查看另一台是否接管。执行“非正常关机”测试。拔掉一台主机的电源，确保另一台接管。


    尽可能彻底地折磨你的测试主机。在部署之前进行的每个测试都会减少生产环境中数据丢失的风险。


    以下是每个存储后端的示例脚本。这些脚本使用 ZFS，但你可以轻松修改它们以使用 UFS。它们符合我的脚本偏好——具体来说，它们是执行单一任务的小脚本。提升和降级脚本基于
    Freddie Cash 的 HAST 和 CARP 故障转移脚本。我对其进行了大量的折叠、扭曲和破坏，以至于他确实保留了他的工作的声誉，但不再对其失败承担任何责任。你可以随意重新排列它们。


    '
