    ## Memory Disks and /etc/fstab


    Listing memory disks in /etc/fstab tells FreeBSD to automatically create them
    at boot. The device name is md and the filesystem type is mfs. In the options
    column, list any command-line options used to create this device, as shown here.


    ```

    md /mnt mfs rw, -s16m

    ```


    When mounted from /etc/fstab, memory disks are world-writable and have the sticky
    bit set. These permissions are appropriate for /tmp, but not so much for anywhere
    else. Specify the permissions as a mount option, but remember that /etc/fstab
    does not tolerate extra spaces. Separate the various options with commas, and
    eliminate any command-line options and their arguments.


    ```

    md /home/mnt/mwl/mnt mfs rw,-p700,-wmwl:mwl1,-s16m

    ```


    ## Disk Images


    You can mount UFS images with mdmfs, but it''s far more common to mount ISO or
    UDF images. FreeBSD''s tar(1) can extract files from ISO images thanks to libarchiva¹,
    that''s often overkill. Also, ISO images are read-only. You can inflict fumble-fingered
    damage on files extracted with tar(1), but ISOs resist tampering. Also, libarchive
    cannot extract files from pure UDF images. Sometimes your simplest choice is mounting
    a disk image.


    To mount a disk image, use mdconfig(8) to attach the file to a vnode-backed memory
    device. When you give a filename as an argument, mdconfig assumes you want to
    use the file as a filesystem.


    ```

    # mdconfig FreeBSD-10.2-RELEASE-amd64-disc1.iso

    d1

    ```


    In response you get the device node for this memory disk, md1. Now use the proper
    mount command to mount this filesystem.


    ```

    # mount -t cd9660 /dev/md1 /media

    ```


    Remember that mount(8) assumes that all filesystems are UFS unless told otherwise.


    When you''re done accessing the image, unmount the image and destroy the memory
    disk device as you would any other memory device.


    ## Disk Images and /etc/fstab


    You can specify a memory device in /etc/fstab and attach it to a disk image. Give
    the filesystem type as mfs. Specify the filesystem is read-only, and use the -F
    flag to give a path to the disk image. At boot this entry creates memory device
    md10, attaches it to /iso/stuff.iso, and mounts it at /.


    ```

    md10 /stuff mfs ro, -F/iso/stuff.iso @ @

    ```


    The system will need to access the disk image in the early boot process. If the
    image isn''t available, the process will hang. You might need to use noauto for
    disk images in a home directory, for example.


    By combining the noauto mount option and autofs (Chapter 12), the system can mount
    the image when needed and automatically unmount it when it''s not in use.


    You can also use mdconfig_md entries in /etc/rc.conf to configure memory disks
    at boot, and then use simpler /etc/fstab entries, but that method is less flexible
    than pure /etc/fstab entries.


    That takes us through every filesystem that runs on the local machine. Let’s head
    out into network-aware filesystems.


    > ¹ All hail libarcharchive!


    ## Chapter 6: Network File System


    FreeBSD supports the venerable Network File System (NFS) out of the box. NFS lets
    you share mount points and directories on one machine with other hosts. Entire
    books have been written about NFS, its various versions, and the good and bad
    points. This book doesn''t take you deep into the inner workings of NFS, but instead
    focuses on establishing and managing NFS services.


    NFS uses a client-server model. A server offers filesystems to other computers.
    This is called NFS exporting, and the offered filesystems are called *exports*.
    NFS clients can mount exports much as they would mount any filesystem.


    NFS was not designed as a secure protocol. Do not put NFS servers on the Internet
    without a packet filter or firewall. Merely restricting access at the NFS level
    is utterly insufficient—you must prevent random Internet hosts from poking at
    the host''s Remote Procedure Call (RPC) services. If you use one of FreeBSD''s
    built-in packet filters, be sure to restrict NFS access by IP address as well
    as port number.


    Additionally, NFS is not encrypted. Anyone with packet sniffer access to your
    wire can see files as clients access them. Encrypting NFS requires Kerberos, which
    could be an entire book in itself.


