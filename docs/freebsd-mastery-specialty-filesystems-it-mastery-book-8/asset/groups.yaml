    on a drive that supports only DVD+RW will not make you a happy sysadmin.


    You’ll burn files and images to DVD-RW and DVD+RW differently. Be sure to follow
    the instructions for your blank media.


    You’ll also find a few DVD-RAM disks, which are read-write DVD disks. DVD-RAM
    drives and players were manufactured in small numbers, and are difficult to find
    nowadays. A DVD-RAM disk can be rewritten at slow speed 100,000 times. (Faster
    writing speeds reduce the number of rewrites.) A DVD-RAM is expected to be stable
    for much longer than either other type of disk. With its high rewrite tolerance,
    a DVD-RAM is best managed like a regular hard drive. Partition it with gpart(8),
    create a file system with newfs(8), and stash your data.


    Blue-ray disks are also standardized. Unlike DVD, there’s only one standard. Lucky
    you.


    # Mounting UDF Disks


    Mount UDF disks with mount_udf. You’ll need two arguments: the device node and
    the mount point. Here I mount a Blu-ray at /dev/cd0 (containing all of the FreeBSD
    releases I use in my test lab) /mnt.


    ```

    # mount_udf /dev/cd0 /mnt

    ```


    There are no UDF-specific mount options. While you can theoretically use some
    generic options from mount(8), I don’t know of any case where they are useful.
    UDF is a read-only filesystem.


    # Creating UDF Images


    Use mkisofs(8) to create a UDF disk image. You’ll need the -udf and the iso-level
    3 flags, in addition to the -R and -J needed for ISO 9660 image.


    ```

    $ mkisofs -R -J -udf -iso-level 3 -o filename

    ```


    Here I bundle all of the FreeBSD releases in /home/mwl/udf into the UDF image.


    ```

    $ mkisofs -R -J -iso-level 3 -o FreeBSD-releases.udf /home/mwl/udf/*

    ```


    You’ll get a bunch of status messages saying exactly how along the filesystem
    creation process is, and then a nice summary.


    If you have any doubt about the quality or contents of your UDF image, use mdconfig(8)
    as discussed in Chapter 5 to mount the disk image and make sure it’s correct.
    Once you’re happy, burn the image to disk.'
