    DVD 或蓝光光）使用通用数据格式（UDF）文件系统或混合 ISO 9660/UDF 文件系统。像 ISO 9660 一样，UDF 是只读文件系统。你可以创建
    UDF 镜像并将其刻录到磁盘，但无法编辑现有的镜像。


    FreeBSD 支持读写 UDF 磁盘。UDF 是一种只读文件系统，FreeBSD 可以向磁盘写入文件系统，就像写入 (ISO.) 一样。你可以使用 DVD
    和蓝光磁盘来存储和传输数据。可写光学介质不是持久的长期存储介质，但在某些环境下它是最佳选择。


    支持 UDF并不等同于读取商业 DVD 和蓝光光盘。商业光盘（如用于电影的光盘）是经过加密的。目前在开源操作系统上没有免费的解决方案可以观看 DVD 或蓝光光盘。网络搜索可以发现许多破解这些大部分加密的方法，但这超出了本书的范围。


    我们不会花费时间去探索 DVD-Video 格式的细节，这是一种适用于蓝光或 DVD 播放器的特定文件排列。这会很快变得复杂，你可以找到大量关于 DVD-Video
    的跨平台文献。使用如 `dvdauthor` 包之类的第三方工具创建文件系统。


    最后，对于 CD，我们不会涵盖多次刻录盘（multisession disks）。多次刻录盘是将数据追加到读写光盘的末尾，而不是覆盖现有的文件系统。硬件对多次刻录盘的支持参不齐，DVD-RW
    和 DVD+RW 有不同的限制。如果你真的想深入研究多次刻录盘，请查阅 FreeBSD 手册。我们将介绍 UDF 用户必须了解的所有内容。


    ## UDF 硬件


    DVD 磁盘是标准化的。你可以从几种标准中选择。


