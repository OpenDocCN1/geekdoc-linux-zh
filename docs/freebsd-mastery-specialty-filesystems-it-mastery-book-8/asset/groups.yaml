    \ files and directories. Files and directories can inherit ACL settings from their\
    \ parent directories or directories above them. As this file has built its ACL\
    \ out of standard Unix-style permissions and there’s no on the parent directory,\
    \ it hasn't inherited any ACL-specific information.\n\nThe last entry, the ACL\
    \ type, says that matching items are either allowed or denied.\n\nNow let's look\
    \ at a file with ACL. \n\n```\n# ls -l file2\n# rwx-rw-r+ 1 mwl mwl 0 Nov 16 13:47\
    \ file2\n```\n\nNote that the standard Unix-style permissions are identical to\
    \ the first file we looked at. The permissions end with a (+) sign, however. This\
    \ indicates extended permissions, or an ACL. Let's look at these permissions.\
