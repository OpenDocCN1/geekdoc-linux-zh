    will accept your maps. FreeBSD can slip straight into your Solaris-based infrastructure,
    and it accepts the maps distributed by your configuration management system. You’ll
    have other issues integrating FreeBSD with Solaris, but the automounter isn''t
    one of them.'
  - '[PAGE 202]


    # Debugging Automounting


    Automounting uses two processes: the automount(8) command you run whenever you
    update /etc/auto_master, and the automount(8) daemon that watches the mount points
    for activity and performs the mounts. Both commands use the -v flag to increase
    verbosity.


    The automounter daemon logs all the debugging information generated with -v to
    syslog by the facility daemon.debug, so it won''t appear in /var/log/messages.
    You''ll need a debugging log or the all-encompassing all.log demonstrated in /etc/syslog.conf
    to capture these messages. Alternately, you can stop the main automount(8) service
    and run automountd in foreground debugging mode with -d. This puts all debugging
    information straight to the terminal.


    ```

    # automountd

    ```


    You''ll get some startup information, then helpful lines like this:


    ```

    automountd: "mount -t cd9660 -o ro, noauto,automount /dev/cd0 /cdrom/" as pid
    1230 automountd: "mount -t cd9660 -o ro, noauto,automount /dev/cd0 /cdrom/", pid
    1230, terminated gracefully

    ```


    If automount requests fail, this is where the error messages appear.


    Running automount(8) with -v shows more detail about its activity, including how
    it parses /etc/auto_master. Try it sometime when automounting works, just to see
    what normal output looks like.'
  - '[PAGE 203]


    # Auto-Unmounting


    Automounting is helpful, but what about unmounting filesystems?


    Unprivileged users cannot unmount automated filesystems. The autounmountd(8) daemon
    watches automated filesystems, however. It tries to unmount the filesystems every
    so often—by default, every 10 minutes.


    If an automed filesystem is in use, in any way, autounmountd(8) will not unmount
    it. Even an idle command prompt in the directory will block unmounting, exactly
    as if you were running autounmount(8).


    You can adjust how often autounmountd tries to unmount the filesystem. The -t
    flag lets you set the number of seconds after automounting that autounmountd makes
    its first attempt to unmount, -r sets the number of seconds before retrying. rc.conf
    settings autounmountd to try to unmount a filesystem three minutes after mounting,
    and retry every 60 seconds thereafter, because my users are shiny and impatient.


    ```

    autounmountd_flags=-t 15 -r 69

    ```


    You can increase autounmountd(8)''s verbosity with -v, and run it in the foreground
    debugging with -d. Exactly like automount, automounmount uses the syslog facility
    daemon.debug, so you''ll need to configure a log file to capture that.


    The systems administrator can unmount every automed filesystem with -automount
    u.


    ```

    # automount -u

    ```


    This disconnects specifically automed filesystems, but leaves the general automount(8)
    infrastructure in place and functioning.


    You can shut down automounting, leaving the daemons in place, by unmounting all
    autofofs(5) filesystems with automount(8).


    ```

    # umount -At autofofs

    ```


    Suddenly /net is empty and ls /media does... nothing. Run automount to restore
    the autofofs mounts.


    Automounting can help the sysadmin''s job, and FUSE can make some difficult tasks
    merely annoying.


    > Yes, automounting was originally created by Sun. But Oracle owns Sun, and blaming
    Oracle is never wrong.


    > “would violate the Principle of Least Astonishment” is a polite but long-winded
    way to say “would really tick off the'
