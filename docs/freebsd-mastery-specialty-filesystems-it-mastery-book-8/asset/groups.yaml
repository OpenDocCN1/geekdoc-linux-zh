    by refashing antediluvian embedded devices.


    Working with removable media is almost exactly like using permanently attached
    storage, but slightly more complicated. Any one piece of removable media is probably
    used only occasionally, though, and sometimes doesn’t have a useful—or any—filesystem
    partition table.


    # Removable Media Device Node


    Using removable media requires knowing the media''s device node. The device node
    depends on the type of device. USB drives, both spinning and flash, show up as
    a `/dev/da` device. Optical disks like CDs and Blu-ray appear as `/dev/cd`, even
    if they are USB devices.


    Floppy disks are `/dev/fd0`. The hard part is figuring out the device number.
    If you have only one CD device, it''s almost certainly `/dev/cd0`, but hard drives
    are more difficult.


    The easiest way to identify the device node of a removable storage device is to
    check `/var/log/messages` or the console when you plug the device in. Some people,
    like the tech editor of this book, prefer to read through `geom disk list`. The
    kernel will log the name assigned to your new device.


    Once you identify the device, check for partitions on the device. Some smaller
    removable storage, like floppies and small USB drives, put the filesystem straight
    on the physical device. Others use partition tables. The easiest way to check
    for partitions is to look for partition device nodes, but tools like `gpart` also
    work.


    The mount point can be any existing directory on the system. FreeBSD includes
    a `/media` directory intended for removable media, and it also offers `/mnt` for
    whatever random short-term mount you need. You can mount a partition on any directory
    you like, however.


    Attach the device or partition to the directory tree with mount(8).


    Use the proper mount(8) flags or mount program for the type of filesystem on the
    device.


    Normally, only root can mount filesystems. If you want to grant unprivileged users
    the right to mount removable media, set the sysctl vfs.usermount to 1.


    ```

    # mount /dev/fd0 /mnt

    ```'
  - '[PAGE 19]


    # Removing Media


    Removing the hardware beneath a mounted filesystem can cause data loss or program
    crashes, and can even panic the system, depending on the disk''s filesystem and
    what was happening on the disk. To safely remove media from your system, first
    unmount all filesystems on the media. Optical trays won’t open until the disc
    is unmounted, which is a helpful reminder, but nothing prevents you from yanking
    out a USB drive.


    # Using Floppy Disks


    Floppy disks work just like any other removable media, except that they must be
    formatted before use. This low-level format prepares the disk to receive a filesystem.
    Floppies do not normally use partition tables. While the floppy disk factory almost
    always formats the disks before shipping them, perfectly good floppies need reformatting.


    Start by performing a low-level format with fdformat(1). This program requires
    only two arguments: the size of the floppy and the device name. Here I format
    a standard 1.44 MB floppy.


    ```

    # fdformat -f 1440 /dev/fd0

    Format 1440K floppy ''/dev/fd0.1440'' (y/n): y

    ```


    The fdformat(1) command runs more slowly than newfs(8). Go get a cup of coffee
    and come back.


    At this point you can create a filesystem on the floppy.


    You cannot run fdformat on a USB floppy drive. If a floppy disk needs reformatting
    and you have a USB floppy drive, throw the disk away.'
