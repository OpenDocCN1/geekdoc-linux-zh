    ;\n};\n```\n\nYou now have HAST-backed failover.\n\n# iSCSI Failover\n\niSCSI\
    \ failover is both simpler and more complicated than HAST-based failover. iSCSI-backed\
    \ systems are far more flexible than HAST and allow much greater expansion. On\
    \ the other hand, HAST is specifically designed as a failover protocol. Its integrity-very\
    \ design lets you verify that storage is not in use before mounting it. Any number\
    \ of hosts can simultaneously attach to iSCSI targets. Multiple hosts simultaneously\
    \ mounting a UFS partition or using a ZFS pool on those targets will corrupt the\
    \ filesystem. It might—will. Those accesses even panic the hosts, corrupt the\
    \ buffer cache, spread the problem to other filesystems, and trigger a rain of\
    \ frogs. It will unquestionably cause meetings, with you in the hot seat.\n\n\
    Performing iSCSI-based failover requires a protocol specifically designed for\
    \ failover. You need to know, conclusively, that the other host is not using the\
    \ disk before trying to import it. Fortunately, we have one. We'll use HAST. We\
    \ won't use any data on the HAST device, but rather piggyback on the HAST protocol.\
    \ You can find other options, including failover deemons for this specific purpose,\
    \ but they don't have any features we need, and HAST is included in the base system.\n\
    \nStart creating a very small HAST device. I'm using a 10 MB zvol as the backing\
    \ store.\n\n```\n# zfs create -V 10m zroot/failover\n```\n\nWith a HAST device\
    \ like this, we don't need much in the way of integrity. The presence of the HAST\
    \ device permits mounting the filesystem, not any data stored on the HAST device.\
    \ Here's a bare-bones but completely sufficient hast.conf file.\n\n```\nresource\
    \ failover {\non www1 {\n  local /dev/zvol/zroot/failover\n  remote 192.0.2.2\n\
    }\n```"
