    # NFSv2/NFSv3 Protocol


    To a sysadmin, NFS versions 2 and 3 appear very similar. FreeBSD uses the same
    server software for both versions of NFS.


    Traditional NFS is stateless. An NFS server does not track how a client is connecting
    or what it''s accessing. Rebooting an NFS server won''t crash the clients. The
    clients won''t be able to access files on an unavailable NFS server, but once
    the server returns it''ll pick up where where it left off. Other network file
    sharing protocols are not always so resilient.


    Statelessness causes its own problems, however. For example, clients cannot know
    when a file they currently have open is modified by another client. And a net-booted
    diskless host will probably hang when the server disappears.


    We’ll configure the server first, then discuss the client.'
