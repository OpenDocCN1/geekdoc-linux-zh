    \ 和资源名称运行。脚本在两个主节点上运行。\n\n## hastd(8) 脚本\n\nhastd 脚本是一组嵌套的 `case` 语句。我建议在测试服务器上从一个简单的脚本开始，记录这些参数以及脚本运行的次数。尽管使用你的测试服务器，看看记录了什么信息。\n\
