    configuration software for FreeBSD, if you mount a Linux /sys using lsysfs(5).


    On FreeBSD, /sys is a link to the kernel source code. Mount the Linux /sys compat/linux/sys.


    ```

    # mount -t lsysfs lsysfs /compat/linux/sys

    ```


    Mount the Linux /sys automatically at boot with an /etc/fstab entry.


    ```

    lsysfs /compat/linux/sys lsysfs rw

    ```


    When you''re done configuring your hardware with that Linux-specific software,
    be sure to yell at your hardware vendor for not having a FreeBSD version of their
    utilities.


    Both linprofs(5) and lsysfs(5), as well as the FreeBSD-native procfs(5), are built
    on top of a filesystem layer called pseudofs(9). Pseudofs is a kernel programming
    framework for presenting filesystem information that changes every time you access
    it. Sysadmin never directly interact with pseudofs, but you''ll occasionally see
    references to it.


    ## Messaging Filesystems


    Certain messaging and process management facilities are also implemented as filesystems
    or filesystem-like features. The most popular are the file descriptor filesystem
    and the POSIX message queue. You only need these filesystems if an application
    demands them.


    ## File Descriptor Filesystem


    The file descriptor filesystem dfscs(5) gives processes filesystem-style access
    to their own file descriptors. File descriptors include standard input (descriptor
    0), standard output (1), and standard error (2) plus any descriptors a program
    creates.


    FreeBSD shows the three file descriptors under `/dev/fd`. Processes can only see
    their own file descriptors in that directory. Programs can create dozens or hundreds
    of file descriptors, however, and programs (notably Java) will not work without
    filesystem-level access to their descriptors. Viewing those additional file descriptors
    dfscs(5).


    Always mount dfscs(5) at `/dev/fd`.


    ```

    # mount -t dfscs /dev/fd

    ```


    To automatically mount dfscs(5) at boot, add an `/etc/fstab` entry.


    ```

    null /dev/fd dfscs rw

    ```


    You can now use Java.


    ## POSIX Message Queues


    The POSIX inter-process communication (IPC) and semaphore standards include named
    message queues. FreeBSD gives you the option of exposing these queues as a filesystem.


    Using mqueue requires loading both the message queue filesystem mquefs(5) and
    the semaphore kernel modules. You don''t need to actually mount an mqueue partition;
    the presence of the kernel module will let you use these message queues. Load
    the modules at boot with these `loader.conf` entries.


    ```

    sem_load=YES

    mquefs_load=YES

    ```


    Mounting an mqueue filesystem lets you view the existing queues as files. This
    might be useful for debugging. Here is mqueue at `/mnt`.


    ```

    # mount -t mqueues mqueues mnt

    ```


    Examine your queues, figure out your problem, and unmount the filesystem.


    To automatically mount mqueuefs(5) at boot, use an /etc/fstab entry.


    ```

    null /mqueue mqueuefs rw

    ```


    You can create POSIX queues by manually creating files, although this is strongly
    discouraged. POSIX message queues are designed for API use, not at the command
    line.


    Now let’s take a look at how FreeBSD lets you rearrange filesystems on the disk.


    > ^1 Do you really need to know this? Not really. But one day you’d stumble across
    pseudofs(9) and say, “Why didn’t that lazy Lucas cover that in his book?”


    > ^2 I’m sorry.


    ## Chapter 4: Rearranging Filesystems


    Sometimes you''ll find that your filesystem isn''t laid out as you''d like.


    Null mounts and union mounts are counterintuitive to many, and best understood
    by example.


    ## Null Mounts


    A null mount, sometimes called a loopback mount, adds a second way to access part
    of an existing filesystem. You might take /usr/home and also make it available
    at /home, or make /media accessible as /usr/src. Most mount commands work on partitions
    or disk images. Null mounts work on any directory. Create null mounts with mount_nullfs(8).


    While you can do similar tricks with symlinks, commands that use the working path
    or use the system calls getwd(3) or getcwd(3) expose the non-symlinked path. With
    a null mount, this software sees the null mount path. Null mounts work with both
    UFS and ZFS. Users don''t care so much about the true path, but applications like
    chroot(8) and jails certainly do. A null mount can let share a read-only tree
    among many jails on a system.


    Understanding how null mounts change behavior is easiest through example. My test
    machine puts home directories at /home. FreeBSD''s installer puts home directories
    under /usr/home. Here I use a null mount to make user home directories available
    in both locations. Let’s start by using a symlink.


    ```

    # cd /usr

    # ln -s /home

    ```


    I can now access my home directory in both locations.


    ```

    # cd /usr/home/mw1

    # pwd

    /home/mw1

    ```


    The pwd(1) command understands that I''m in a directory tree that''s rooted in
    /home, even if I got there going to /usr/home/mw1.


    Remove the symlink, and replace it with a null mount. The mount_nullfs(8) command
    takes two arguments: the existing directory tree, then the point where you want
    it to be mounted.


    ```

    # mount_nullfs /home /usr/home

    ```


    What impact does this have on users? I can now go to either /usr/home/mw1 or /home/mw1
    and reach the same directory, just like with a symlink. Now that I’m using a null
    mount, the pwd(1) command shows my actual location.


    ```

    # cd /usr/home/mw1

    # pwd

    /usr/home/mw1

    ```


    While the real filesystem is rooted in /home, pwd(1) saw only the null mount.


    Many of us have closed-source programs or unfamiliar scripts with hard-coded paths.
    A null mount can keep that software working even as you move filesystems around
    your server.


    You can use standard mount(8) options with mount_nullfs(8). Use -o on the command
    line and, separated by commas.


    ```

    # mount_nullfs -o ro /home /usr/home

    ```


    The -o ro option makes the null mount read-only. You can now edit your files under
    /home, but the copy under /usr/home is read-only. This particular example will
    tick people off, so you probably shouldn''t do that. While noatime and async might
    sound sensible for your use case, they have no effect in null mounts. You can
    perform null mounts automatically at boot with an /etc/fstab


    ```

    /home /usr/home nullfs rw,noatime

    ```


    If you decide to get into filesystem programming, null mounts are a great place
    to start. See mount_nullfs(8) details.


    ## Union Mounts


    All FreeBSD file systems are stackable, which means you can mount one another.
    Users can only see the filesystem on top. Again, this is better demonstrated.


    Suppose the directory /usr/src contains the FreeBSD source code. Here I mount
    an unused, brand-new filesystem at /usr/src.


    ```

    # mount /dev/ad01 /usr/src/

    ```


    The /usr/src directory now appears empty. I''ve stacked the new filesystem above
    the old. The original /usr/src is still on the disk, but nobody can see it. Unmounting
    the partition reveals the code.


    A union mount lets users see the contents of both filesystems simultaneously,
    in the same location. If I mount a filesystem above /usr/src and run ls(1), I''ll
    see the contents of both filesystems.


    Perform union mounts with mount_unionfs(8). The first argument is the filesystem
    that gets mounted on; the second, the mount point and lower filesystem. Here''s
    a rather messy but illustrative demonstration.


    ```

    # mount_unionfs /home/mwl/usr/src/

    ```


    I''ve mounted my home directory above the source code. The /usr/src directory
    now contains everything that was in /usr/src before, plus everything that was
    in my home directory. So there''s /usr/src/UPDATING and /usr/src/.cshrc.


    I will never find anything again


    Union mounts work with ZFS and UFS, but not simultaneously. You can union mount
    a UFS partition over another UFS partition, or a ZFS dataset over another ZFS
    dataset. Union mounting over ZFS or vice-versa appears to work, until you try
    to view or change the union-mounted data.


    Union mounts have a bad reputation. The union mount feature was completely rewritten
    for FreeBSD 7.0, and it''s more reliable than it was once. The mount_unionfs(8)
    manual page contains big scary warnings. The common cases, such as typical jail
    deployments, work fairly well and are widely deployed. Union mounts still do many
    things filesystem developers consider worrisome to awful, however. If you plan
    to use union mounts in a novel manner, test your system very carefully before
    deploying.

