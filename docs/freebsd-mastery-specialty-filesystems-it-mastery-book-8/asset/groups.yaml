    FreeBSD 没有专门针对 ReiserFS 的 `mount(8)` 命令。你必须使用 `-t` 选项挂载 ReiserFS 卷。


    ```bash

    # mount -t reiserfs /dev/da4s /media

    ```


    你无法在 FreeBSD 上创建、修复或编辑 ReiserFS 卷。真的没有理由将它们添加到 `/etc/fstab`。


