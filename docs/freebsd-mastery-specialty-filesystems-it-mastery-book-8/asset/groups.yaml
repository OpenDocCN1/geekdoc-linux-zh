    # Memory Disks


    A memory disk is an ephemeral storage device. Despite the name, a memory disk
    is not always a chunk of memory being treated as a disk. It can be such a device,
    but it might instead use a file or swap space as a backing store. The storage
    device disappears after reboot.


    FreeBSD supports four types of memory disks: malloc-backed, swap-backed, vnode-backed,
    and null.


    Malloc-backed disks are pure RAM. Even if your system runs out of memory, FreeBSD
    will absolutely not page or swap out a malloc-backed disk. Using a large malloc-backed
    disk is a great way to exhaust system memory. Malloc-backed disks are most useful
    for swapless embedded devices.


    Swap-backed disks are mostly memory, but FreeBSD can shuffle them out to swap
    if necessary. This is the safest way to get a high-performance memory disk.


    Vnode-backed memory disks are built on top of the disk''s filesystem. Using a
    file for backing a memory disk is the safest way to use a memory disk, but it''s
    slower than just having the files on the partition''s filesystem—reads and writes
    to traverse the memory filesystem, which in turn calls up the file on the disk.
    Two layers of filesystems are involved. Vnode-backed memory disks are useful for
    mounting disk images, as well as for testing.


    > A null disk discards everything sent to it. Any writes are successful, while
    any reads return only zeroes. I won''t cover null devices, as I prefer to lose
    my data by hand.


    # Creating and Mounting Memory Disks


    The mdmfs(8) utility is a convenient wrapper for creating common memory disks.
    You can get down and dirty with programs like mdconfig(8) and newfs(8), but mdmfs
    bundles everything for you. You only need to know the size of the disk you want
    to use, the type of memory disk, and the mount point. The mdmfs(8) command defaults
    to swap-backed memory disks, the most common.


    Unprivileged users cannot create memory disks, even if they’re allowed to mount
    removable media.


    Use the -s flag to specify the filesize size. Here I create a 16 MB swap-backed
    memory disk on /mnt.


    ```

    # mdmfs -s 16m md /mnt

    ```


    The md option above means “I don’t care which memory disk device node gets, just
    give me the next one.”


