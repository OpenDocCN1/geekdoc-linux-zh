    FreeBSD version 10.2 and later, this appears in /etc/devd.conf but is commented
    out. Create a /usr/local/etc/devd/auto.conf that contains the following.


    ```

    # Discard autofs cache, useful for the -media special map.

    notify 100 {

    match "system" "GEOM"

    match "subsystem" "DEV"

    action "/usr/sbin/automount -c";

    };

