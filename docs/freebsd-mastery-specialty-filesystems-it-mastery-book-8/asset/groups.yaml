    \ (attributes)\n- U: permission to read the name of the file\n- k: permission\
    \ to read the extended attributes\n\n## Write Permissions\n\nWrite permissions\
    \ control a user's ability to modify the file.\n\nThe (w) permission is the standard\
    \ Unix write permission. In NFSv4, it's broken down into:\n\n- W: permission to\
