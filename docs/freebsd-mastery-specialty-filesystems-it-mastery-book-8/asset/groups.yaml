    \ same thing as reading commercial DVDs and Blu-ray disks. Commercial optical\
    \ disks, like those used for films, are encrypted. There is no freely available\
    \ solution for watching DVD or Blu-ray disks on open source operating system.\n\
    \n## Creating UDF.\n\nOnce you have a clean shell, use the -dev-compat and -z\
    \ flags to burn your UDF image to the burner /dev/burner.\n\n# growofs -dev-compat\
    \ -Z /dev/burner/imagefile\n\nYes, there's an equal sign between the device and\
    \ the image file.\n\nHere I am using FreeBSD-releases.udf to the Blu-ray writer\
    \ at /dev/cd0.\n\n# growofs -dev-compat -Z /dev/cd0=FreeBSD-releases.udf\n\n```\n\
    Executing /buildin dd if=FreeBSD-releases.udf of=/dev/pass11 bs=32k seek=0\n/dev/pass11:\
