    \ via NFS. Once I try to examine /net/mail/var/log on my workstation, autofs mounts\
    \ the NFS share on that directory. I have whatever access the mail server is configured\
    \ to permit, exactly as if my sysadmin had mounted this share for me.\n\nIf an\
    \ NFS server disappears, mount requests can still hang. That’s why autofs defaults\
    \ to mounting NFS shares with the intr option, so a user can CTRL-c and get a\
    \ terminal back without bugging the sysadmin.\n\n## Automounting Removable Media\n\
    \nThe default configuration in /etc/auto_master includes a commented-out line\
