    ```


    虽然简单的 NFS 非常直观，但你可以花费许多小时对其进行调优。


    ## NFS 性能


    NFS 性能是一个深奥的话题，最好根据具体情况处理。不同的服务器和客户端组合可能在截然不同的性能设置下效果最佳。不要害怕尝试不同的 NFS 设置和配置，看看是否可以提高你所在环境的吞吐量。大多数
    NFS 调优发生在客户端；服务器响应客户端的调优请求。


    要调整性能，请查看挂载选项 `rsize`、`wsize`、`wcommitsize`、`readahead` 和 `readdirsize`。虽然你可以将这些选项设置为任何值，但出于互操作性或协议原因，FreeBSD
    将大部分选项限制在一个最大值上。


    `rsize` 和 `wsize` 选项决定了读写请求的大小。对于 UDP 挂载，NFSv2 上的最大值是目录读取请求的大小。16K，NFSv3 允许。NFSv4
    不使用 UDP。


    NFSv3 无法为 TCP 和 UDP 的 `rsize`、`wsize` 和 `readdirsize` 指定单独的最大值。然而，许多服务器无法处理大于
    16K 的请求，因此会将这些值限制为 16K。


    服务器使用 `readahead` 来预测客户端下一步将要请求的内容，并在客户端请求之前从磁盘加载它。如果你通常使用 NFS 访问大文件，请尝试调整 `readahead`。


    要查看挂载使用的实际值，请运行 `nfsstat -m`。然后测量性能、进行实验、测试，再进行更多测试。


    ## NFSv4


    现在你已经了解如何使用 NFS 第 2 和第 3 版本，让我们看看第 4 版本是如何将所有组件抛向空中并以不同的方式将它们组合的。NFSv4 为 NFS 增加了三个核心功能：访问控制列表（ACLs）、委托（delegations）和引用（referrals）。它还增加了状态支持，并改变了它识别用户的方式。


    文件系统 ACL 允许扩展的权限设置，让人们为文件添加许多不同层级的权限。ACL 对于同时通过 NFS 和 CIFS 提供文件共享的系统特别有用。这是 FreeBSD
    的 NFSv4 实现的主要用例。第 11 节将详细讨论 ACL。


    委托允许客户端在本地编辑文件并将更新发送到服务器。FreeBSD 的 NFSv4 客户端支持委托，但服务器不支持。


    引用允许服务器透明地将请求重定向到另一个服务器。同样，FreeBSD 的 NFSv4 客户端支持引用，但服务器不支持。


    与旧版本的 NFS 不同，第 4 版本是有状态的。客户端将大量的 RPC 调用封装在一个get请求中，并作为一个单一单元发送到服务器，以提高性能。服务器按顺序处理请求。如果其中一个请求失败，服务器将取消队列中的其余请求并将结果发送给客户端。NFSv4
    始终在 TCP 上运行。


    最后，NFSv4 增加了 `nfsuser(8)` 守护进程来识别用户。


    ## nfsuserd(8)


    旧版本的 NFS 使用账户数字来识别用户。NFSv4 通过其 UID 以及用户名与 NFSv4 域名的组合来识别用户。


    NFSv4 域名是一个文本字符串，通常对应于主机的域名。如果单独保留，FreeBSD 会抓取主机的域名并将其用作 NFSv4 域名。然而，如果主机没有域名，或者你的
    NFS 主机具有不同的域名，你需要手动设置 NFSv4 域名。


    不同的域名甚至会影响小型网络。我的家庭网络生产环境使用一个域名，测试环境使用另一个域名。即使在我家里，我也需要选择一个 NFSv4 域名并告诉我的主机。


    客户端和服务器都使用 `nfsuserd(8)` 守护进程的用户名信息。使用 `-domain` 命令行参数告诉 NFSv4 使用哪个域名。


    你的域名不应经常更改，因此我在 `/etc/rc.conf` 中设置了它。在这里，我既启用了 `nfsuserd` 又告诉它使用 `mwl.io` 域。


    ```

    nfsuserd_enable=YES

    nfsuserd_flags="-domain mwl.io"

    ```


    额外的配置取决于主机是 NFSv4 服务器还是客户端。


    ## NFSv4 服务器


    配置 NFSv4 服务器需要启用所需的服务并配置导出文件系统。


    ### 启用 NFSv4 服务器


    NFSv4 服务器需要以下 `rc.conf` 选项。


    ```

    nfs_server_enable=YES

    mount_enable=YES

    nfsv4_server_enable=YES

    nfsuser_enable=YES

    ```


    NFSv4 监听 2049。只要 2049 是开启的，你就可以使用 NFSv4，但服务器仍然需要运行 `mount(8)` 以提供某些服务。


    主机可以同时提供三个版本的 NFS。


    ## NFSv4 导出


    与旧版本的 NFS 不同，NFSv4 是有状态的。NFSv4 导出的是单个挂载点。客户端可以挂载该挂载点下的任何目录。如果你想导出 NFS 树的各个部分，请使用挂载（第4节）。


    在 `/etc/exports` 中配置你的 NFS 导出，以 `V4:` 开头。在这里我将 `/home` 导出到网络。


    ```

    V4:/home -network 192.168.1.0/24

    ```


    虽然你只导出一个目录，但只要它们具有相同的根，你就可以导出多个网络。


    如果你导出 ZFS 数据集，其子数据集将自动导出。你必须显式使用 `shares` 属性来导出子集。


    NFSv4 客户端不使用旧版本的挂载协议。要使 `/etc/exports` 的更改生效，请像处理旧版本一样使用 `service reload`。


    ## NFSv4 客户端


    在客户端上启用 NFSv4 只需要运行 `nfsuserd(8)`。所有其他依赖项会自动启动。在 /etc/rc.conf` 中启用 `nfsuserd(8)`。


    ```

    nfsuserd_enable=YES

    ```


    NFSv4 使用来自 `resid(3)` 的主机唯一标识符。FreeBSD 在启动时自动生成此 ID，除非有人故意禁用了它。客户端的 `rc.conf`
    包含 `hostid_enable=NO`，你使用 NFSv4 可能会损坏文件。


    你可以通过 NFSv4 挂载 NFS 共享。FreeBSD 默认尝试通过版本 3 挂载 共享，如果失败则回退到版本 2。自动化没有考虑 NFSv4，因此你必须作为挂载选项指定
    NFS 版本。


    ```

    # mount -o nfsv4 agouti:/mwl /mnt

    ```


    可以在不运行 `nfsuserd` 的情况下使用 NFSv4，但你会获得文件的权限错误。如果你运行了 `nfsuserd` 但仍然获得权限错误，请检查 NFSv4
    域名。


    FreeBSD 的 NFS 服务器不支持委托，客户端支持。NFSv4 客户端可以在本地编辑文件，减少带宽并提高性能。如果客户端请求访问被委托给另一个客户端的文件，那么
    NFS 服务器将能够提醒被委托的客户端并检索当前文件。这被称为回调（callback）。要在 FreeBSD NFSv4 客户端上启用委托支持，请启用 NFS
    回调守护进程 `nfscbd(8)`。


    ```

    nfscbd_enable=YES

    ```


    虽然客户端可以在未使用 nfscbd 的挂载 NFSv4 导出，但客户端将无法获得委托。


    你可以调优 NFS 以满足几乎任何情况，但它不是唯一的网络存储协议。让我们转向 CIFS。



