    NFSv3 contains many incremental improvements over NFSv2 and boasts greatly improved
    performance. Most of these improvements don''t require special configuration,
    however. You can choose to tweak settings, but you don''t have to specifically
    enable NFSv3 features.


    NFSv4 is an entirely different beast, and breaks many of the long-standing rules
    of NFS. When people say “NFS,” they almost certainly mean versions 2 or 3. I’ve
    heard versions 2 and 3 are referred to as “traditional NFS.” Someone who means
    NFSv4 generally says “NFSv4.” This chapter starts with versions 2 and 3. Once
    you understand them, we’ll cover the changes that make NFSv4 unique.


    While almost every Unix-like operating system supports some version of NFS, each
    of those operating systems implements it slightly differently. If you have multiple
    operating systems on your network, don''t be shocked if some of the hosts need
    tweaking to interoperate nicely with the other hosts. The FreeBSD-net@FreeBSD.org
    mailing list archive contains discussions on how to get the best performance out
    of just every possible combination of operating system and NFS versions. If you
    have trouble, check there first.'
