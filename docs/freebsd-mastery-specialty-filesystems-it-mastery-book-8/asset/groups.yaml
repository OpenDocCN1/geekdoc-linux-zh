    # Chapter 10: Networked Disk Failover


    Running disks and filesystems over the network presents interesting possibilities.
    The most obvious is the ability to keep a data store running even when the host
    supporting it goes down. FreeBSD includes tools to let a backup host take over
    when a primary host fails, using standard hardware found in every datacenter.


    When you first try networked disk failover, use a test environment. Be prepared
    to reboot. A lot.


    Any type of failover automation requires that you be comfortable with basic shell
    scripts. This book provides scripts to get you started. They’re also available
    on the author’s GitHub site (https://github.com/mwlucas).'
  - '[PAGE 151]


    # Clustering Risks


    Any two-node clustering solution on commodity hardware has a risk of going style
    split brain. HAST can issue a literal "split brain" error, but iSCSI-backed high
    availability can have identical problems when multiple hosts mount the same UFS
    filesystem or import the same ZFS pool. A flaky network switch can only interrupt
    client connectivity, but convince each server that its peer has gone down and
    that it should become master. Mer unplugging a network cable can trigger this
    error. Certain stages of operating a two-node cluster do require highly intelligent
    management.


    Advanced cluster systems usually have at least three hosts involved in the cluster,
    so that they can use a quorum method for determining the master host. In a quorum
    system, a majority of the hosts involved must agree on which host is acting as
    master. One isolated host cannot declare itself to be the dictator. These systems
    fill a book on their own and have greater hardware requirements.


    Look carefully at your hardware, and investigate FreeBSD''s support for it. Some
    hardware has solutions for these problems. For example, if you''re one of the
    lucky few with shared SCSI shelves, you could use SPC-3 SCSI persistent reservations
    via camcontrol(8) in your failover script. If you have multipath SCSI behind your
    iSCSI devices, investigate FreeBSD''s high availability support through Asymmetric
    Logical Unit Access (ALUA) as discussed in ctl(4).


    Any specific hardware recommendations I would make would go obsolete before you
    could read this book, so I encourage you to do your own hardware research.


    The systems described here are as safe as possible given the software''s limitations
    and commodity hardware. If you decide to build a two-host cluster, be prepared
    to recover the worst happen.


    Many people successfully use CARP for filesystem failover. They''ve thought long
    and about how to recover from problems. Be sure you do the same before deploying.'
- md: "\n# Failover Architecture\n\nFailover automation is built on top of two key\
    \ technologies, CARP and devd(8). How they get depends on the storage back end\
    \ used.\n\n## CARP\n\nThe Common Address Redundancy Protocol (CARP) is an OpenBSD\
    \ creation for sharing IP addresses between machines. It lets addresses float\
    \ between machines as needed. CARP resembles Cisco's Virtual Router Redundancy\
    \ Protocol (VRRP), but also includes checks for security and integrity. Additionally,\
    \ CARP lacks the burden of patents, so you're free to use, distribute, or re-implement\
    \ it for any purpose whatsoever.\n\nEach host in a CARP cluster has a CARP attribute\
    \ attached to one or more interfaces. Each interface with CARP continually announces\
    \ its presence to the other hosts on the network. The hosts negotiate to see which\
    \ one will be the master. While each interface running CARP has an IP address\
    \ assigned for that machine, the CARP master answers all requests for the floating\
    \ CARP IP address. When the master stops responding, another host in the cluster\
    \ takes over and claims the CARP IP.\n\nClients know only about the CARP IP address,\
    \ not the individual machine's management address. When the address floats to\
    \ the other machine, client requests follow it. The trick is to get the filesystem\
    \ and server processes to follow it.\n\n## Devd\n\nWhen a CARP interface goes\
    \ up or down, taking over or relinquishing an IP address, it sends an event to\
    \ devd(8). As Chapter 2 discusses, devd events can trigger commands. You can have\
    \ FreeBSD activate storage when the CARP interface goes up and deactivate storage\
    \ when the interface goes down.\n\n## Storage Back Ends\n\nFreeBSD has two block\
    \ storage systems that can share: iSCSI (Chapter 8) and HAST (Chapter 9). Which\
    \ should you depends on your environment.\n\nIn a large environment, iSCSI is\
    \ the best choice for networked storage devices. Have two separate servers offer\
    \ iSCSI targets, and another two client-facing servers. The client-facing servers\
    \ can use one drive from each iSCSI server to create a mirror, or multiple drives\
    \ from created striped mirrors. The environment can withstand the failure of one\
    \ iSCSI server and one client-facing server. So long as you have one server of\
    \ each type active and working, the service remains up. You can easily expand\
    \ this environment and replace hardware as needed. You will probably want a stand-alone\
    \ Storage Area Network (SAN), to separate your storage traffic from the client\
    \ and management traffic. For even higher availability, investigate multipath\
    \ SCSI.\n\nUsing RAID-Z for high availability is possible, but requires more iSCSI\
    \ targets on more independent servers. An eight-disk RAID-3 can withstand the\
    \ loss of three disks. If you have two iSCSI servers, losing one server means\
    \ losing disks—and the pool. You could create a separate RAID-Z device on each\
    \ iSCSI server, and then mirror the pools.\n\nIf you have only two hosts, HAST\
    \ is your only real choice for failover filesystem. It would be possible to provide\
    \ a drive to the other, but that reaches astonishing new levels of clunky. Ideally,\
    \ the HAST hosts will have a private network connection between them, such as\
    \ a crossover cable.\n\nLet's work through this architecture one piece at a time.\n\
    \n## Configuring CARP\n\nIn FreeBSD 10 and later, CARP is an attribute attached\
    \ to an existing interface. Older versions of FreeBSD (and all versions of OpenBSD)\
    \ created a virtual interface for CARP, but the new model simplifies management\
    \ on hosts with many interfaces. CARP is incredibly flexible, so we'll only cover\
    \ its basic configuration. For far more details, see carp(4).\n\nStart by loading\
    \ the carp(4) kernel module at boot with a loader.conf entry.\n\n```\ncarp_load=YES\n\
    ```\n\nThe basic unit of CARP is the virtual host. A virtual host, and IP addresses\
    \ attached to virtual host, can float between machines. Each virtual host needs\
    \ an ID number, or most people start number VHIDs at 1.\n\nEach VHID also needs\
    \ a password. The password prevents rogue hosts on the same network from spoofing\
    \ CARP announcements. Like ISCSI passwords, a CARP password is stored in plain\
    \ text on each machine, as anyone who configures the host's network needs access\
    \ to it.\n\nConfigure CARP as an Ethernet interface alias in /etc/rc.conf. Here\
    \ interface em0 has its own address, but also has a CARP VHID.\n\n```\nifconfig\
    \ em0=\"inet 203.0.113.214 netmask 255.255.255.0\"\nifconfig em0_alias=\"vhid\
    \ 1 203.0.113.215/32\"\n```\n\nBoth hosts need exactly the same CARP alias configuration.\
    \ (They need unique IP addresses, of course.) You should add additional CARP configuration\
    \ to both, such as hard-coding one as CARP master, that imposes additional risks.\
    \ Reboot the first host. You should see the CARP information in ifconfig.\n\n\
    ```\nifconfig em0=\"inet 203.0.113.214 netmask 255.255.255.0\"\nifconfig em0_alias=\"\
    vhid 1 203.0.113.215/32\"\n```\n\nThis host has its own address, 203.0.113.214.\
    \ It also has 203.0.113.215, as part of VHID 1. The last line shows that this\
    \ interface is CARP master, meaning that's currently serving requests for this\
    \ VHID. Reboot the second host. Its ifconfig output should show host in backup\
    \ state. If the master fails, the backup will assume service. Force a host to\
    \ change roles by using ifconfig. Give the interface name, the VHID, and the new\
    \ state.\n\n```\nifconfig em0 vhid 1 state backup\n```\n\nYou normally run such\
    \ commands on the master host to tell it to demote itself to backup, but they\
    \ work just as well as backup. If this is your first experience of CARP, play\
    \ with it before continuing. Start an ongoing ping of your VHID. Reboot the master\
    \ host. Depending on your network switch and hardware, your client might drop\
    \ as the CARP IP address moves from one host to the other. Once you understand\
    \ how VHIDs float between machines, we’ll configure devd(8). \n\nOn FreeBSD, CARP\
    \ interfaces send events to devd(8) when they change roles. On older versions,\
    \ when CARP ran as a virtual interface, those events were up and down notifications.\
    \ Now that CARP is an attribute applied to an existing interface, those events\
    \ specifically notify devd when the interface assumes the master or backup role.\
    \ Processing these events requires custom rules to trigger shell scripts. I advise\
    \ putting these rules in /usr/local/etc/devd/carp.conf. As we don't have filesystem\
    \ failover scripts yet, use these events to trigger a log entry.\n\n```\nnotify\
    \ {\nmatch \"system\" \"CARP\";\nmatch \"subsystem\" \"[0-9]+@[a-zA-Z]*\";\nmatch\
    \ \"type\" \"MASTER\";\naction \"/usr/bin/logger devd carp up detected\";\n}\n\
    ```\n\n```\nnotify {\nmatch \"system\" \"CARP\";\nmatch \"subsystem\" \"[0-9]+@[a-zA-Z]*\"\
    ;\nmatch \"type\" \"BACKUP\";\naction \"/usr/bin/logger devd carp down detected\"\
    ;\n}\n```\n\nHave your hosts switch between the master and backup roles a few\
    \ times. Run tail -f /var/log/messages in a separate terminal window, so you can\
    \ see the logs appear. Once it's clear that devd runs commands as you expect,\
    \ you're ready to actually implement failover.\n\n## Failover Scripts\n\nNo matter\
    \ which storage back end you use for your high-availability networked disk, you'll\
    \ need three basic scripts.\n\nAt system boot, you must put the storage in a usable\
    \ state. This startup script can't make the newly booted host the cluster master—that’s\
    \ likely to cause a HAST split brain or a corrupt ZFS pool. But at boot you can\
    \ safely attach iSCSI targets, or put HAST devices in a secondary role.\n\nWhen\
    \ a host becomes the CARP master, you'll need to activate the storage. HAST hosts\
    \ must switch to the primary role and import or mount any filesystems. iSCSI hosts\
    \ must import or mount any filesystems. Finally, this script needs to start any\
    \ processes that use the filesystem.\n\nWhen a host becomes the CARP backup, quickly\
    \ stop any processes using the filesystem. Those processes are no longer serving\
    \ client requests—the IP address clients go to is no longer attached to this machine.\
    \ After terminating the processes, unmount or export the filesystem. If you're\
    \ using a HAST device, the host switches the HAST device to the secondary role.\n\
    \nBefore deploying failover scripts, test them. Use the script to demote the master\
    \ to a backup. Then run the promotion script on the alternate host. Make that\
    \ everything mounts automatically. Reverse the process: dem the new master, then\
    \ promote the backup. Remember, you can't have two master hosts simultaneously—that\
    \ causes split brain problems or an otherwise corrupt filesystem. Once you're\
    \ confident that the scripts work with your environment, /usr/local/etc/devd/carp.conf\
    \ to have CARP state changes automate the failover process. Then trigger failures\
    \ by changing CARP state. Reboot each host and see that the other takes over.\
    \ Perform \"unceremonious shutdown\" tests. Pull the power on one host, and make\
    \ sure the other takes over.\n\nBatter and abuse your test hosts as thoroughly\
    \ as possible. Each test you perform before deploy reduces the risk of data loss\
    \ in production.\n\nHere are some sample scripts for each storage back end. These\
    \ scripts use ZFS, but you can easily modify them to use UFS. They conform to\
    \ my scripting prejudices—specifically, they're small scripts that perform a single\
    \ task each. The promotion and demotion scripts are based on Freddie Cash's HAST\
    \ and CARP failover scripts. I've folded, spingled, and mutilated them so badly\
    \ that he certainly retains credit for his work, he no longer bears any responsibility\
    \ for their failures. Feel free to rearrange them.\n"
