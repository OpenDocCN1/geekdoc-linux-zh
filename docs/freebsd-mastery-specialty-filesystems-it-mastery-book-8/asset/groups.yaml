    \ mount the filesystem\n\nservice httpd start\n```\n\nCopy this script to /usr/local/scripts/hast-carp-promote.sh.\n\
    \nTest your scripts as described at the beginning of this section. Once you're\
    \ confident that they work, you can edit /usr/local/devd.conf.\n\n"
