    While simple NFS is pretty straightforward, you can spend many hours tuning it.


    ## NFS Performance


    NFS performance is an arcane topic, and best handled on a case-by-case basis.
    Different combinations of server and client might work best with wildly different
    performance settings. Don''t be afraid to play with NFS settings and configurations
    to see if you can improve throughput for your environment. Most NFS tuning happens
    at the client; the server responds to the client''s tuning requests.


    To adjust performance, look at the mount options rsize, wsize, wcommitsize, readahead,
    and readdirsize. While you can set these options to any value, FreeBSD clips most
    of them at a maximum size for interoperability or protocol reasons.


    The rsize and wsize options dictate the size of read and write requests. With
    UDP mounts, the maximum value on NFSv2 is the size of directory read requests.
    16K, NFSv3 permits. NFSv4 doesn''t use UDP.


    NFSv3 cannot specify separate maximum sizes for TCP and UDP rsize, wsize, and
    readdirsize. Many servers cannot handle requests greater than 16K, however, so
    clips clips these values to 16K.


    The server uses readahead to guess what the client''s going to ask for next and
    load it up from the disk before the client asks for it. Play with readahead if
    you normally use NFS to access large files.


    To see the actual values used by a mount, nfsstat -m. Then measure performance,
    experiment, test, and test some more.


    ## NFSv4


    Now that you understand how to use NFS versions 2 and 3, let''s see how version
    4 throws all the pieces in the air and puts them together in a different way.
    NFSv4 adds three core functions to NFS: access control lists (ACLs), delegations,
    and referrals. It also adds state and changes how it identifies users.


    Filesystem ACLs allow extended permissions settings, letting people add many different
    layers of permissions to files. ACLs are mostly useful for systems that offer
    file shares over both NFS and CIFS. This is the primary use case for FreeBSD''s
    NFSv4 implementation. Chapter 11 discusses ACLs in detail.


    Delegations allow a client to edit a file locally and send the updates to the
    server. FreeBSD''s NFSv4 client supports delegations, but the server does not.


    Referrals allow servers to transparently redirect requests to another server.
    Again, FreeBSD''s NFSv4 client supports referrals, but the server does not.


    Unlike older versions of NFS, version 4 is stateful. The client bundles up a whole
    bunch of RPC calls in a single request and ships them to the server as a single
    unit, for improved performance. The server processes the requests in order. If
    one of the requests fails, the server cancels the rest of the requests in the
    queue and sends the results to the client. NFSv4 always runs over TCP.


    Finally, NFSv4 adds the nfsuser(8) daemon to identify users.


    ## nfsuserd(8)


    Older versions of NFS use an account''s number to identify the user. NFSv4 identifies
    users by both their UID and a combination of the username and the NFSv4 domain
    name.


    The NFSv4 domain name is a string of text that usually corresponds to the host''s
    domain name. Left on its own, FreeBSD grabs the host''s domain name and uses that
    as the NFSv4 domain name. If a host doesn''t have a domain name, however, or if
    your NFS hosts have different domain names, you''ll need to set the NFSv4 domain
    manually.


    Different domain names can impact even small networks. My home network uses one
    domain for production and a separate domain for testing. Even in my house, I need
    to pick an NFSv4 domain and tell my hosts about it.


    Both the client and the server use the nfsuserd(8) daemon process username information.
    Use the -domain command-line argument to tell NFSv4 which domain to use.


    Your domain shouldn''t change often, so i set it in /etc/rc.conf. Here, I both
    enable nfsuserd and tell it to use the mwl.io domain.


    ```

    nfsuserd_enable=YES

    nfsuserd_flags="-domain mwl.io"

    ```


    Additional configuration depends if the host is an NFSv4 server or client.


    ## NFSv4 Servers


    Configuring an NFSv4 server requires enabling required services and configuring
    filesystems to export.


    ### Enable the NFSv4 Server


    An NFSv4 server needs the following `rc.conf` options.


    ```

    nfs_server_enable=YES

    mount_enable=YES

    nfsv4_server_enable=YES

    nfsuser_enable=YES

    ```


    NFSv4 listens to port 2049, making it possible to put a packet filter between
    an NFSv4 client and server, so as long as 2049 is open. You will still need the
    general NFS support functions in nfsd(8), though, as well as mount(8).


    Hosts can serve and mount all three versions of NFS simultaneously.


    ## NFSv4 Exports


    Unlike older versions of NFS, NFSv4 exports a single filesystem and all directories
    beneath it. Each NFSv4 server has a single export root directory. Clients can
    mount any directory beneath that mount point. If you want to export disconnected
    parts of a server''s directory tree, use null mounts (Chapter 4) to attach them
    to the NFS hierarchy.


    Configure your NFS export in `/etc/exports`, on a line starting with V4:. Then
    give the root directory and any NFS options. NFSv4 accepts the network restriction
    options from older versions of NFS, as well as security options. Here I export
    `/home` to my network.


    ```

    V4:/home -network 192.168.1.0/24

    ```


    While you only export a single directory, you can export multiple networks, provided
    they have the same root.


    If you export a ZFS dataset, all its child datasets are automatically exported.
    You must explicitly use the `shares` property to export-child datasets.


    NFSv4 clients do not use the mount protocol required by older versions, but the
    server still needs to run mount(8) to provide some services. To make `/etc/exports`
    changes take effect, use `service reload`, exactly as you would for older versions.


    ## NFSv4 Clients


    Enabling NFSv4 on a client requires only running nfsuserd(8). All other dependencies
    get started automatically. Enable nfsuserd(8) in /etc/rc.conf.


    ```

    nfsuserd_enable=YES

    ```


    NFSv4 uses the host''s unique identifier from resid(3). FreeBSD automatically
    generates this ID at boot, unless someone has deliberately disabled it. The client''s
    rc.conf includes hostid_enable=NO, you can''t use NFSv4 without possibly corrupting
    files.


    You can mount NFS shares via NFSv4. FreeBSD defaults to trying to mount NFS shares
    with version 3, failing back to version 2 if that fails. The automation doesn''t
    consider NFSv4, so you must specify the NFS version as a mount option.


    ```

    # mount -o nfsv4 agouti:/mwl /mnt

    ```


    It is possible to use NFSv4 without running nfsuserd, but you''ll get incorrect
    permissions on files. If you''re running nfsuserd but still get incorrect permissions,
    check the NFSv4 domain name.


    FreeBSD''s NFS server does not support delegations, the client does. NFSv4 clients
    can edit files locally, reducing bandwidth and improving performance. If a client
    asks to access a file delegated to another client, however, the NFS server will
    be able to poke the delegated client and retrieve the current file. This is called
    a callback. To enable delegation support on a FreeBSD NFSv4 client, enable the
    NFS callback daemon nfscbd(8).


    ```

    nfscbd_enable=YES

    ```


    While a client can mount NFSv4 exports without using nfscbd, the client won''t
