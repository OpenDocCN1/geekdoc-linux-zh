  \ `grep` 命令），还可以使用正则表达式来描述如何转换数据。最后，列出了一系列示例展示了 `sed` 命令的通用性，并希望传达出这样一个信息：它是比我们在单章中可以展示的更加灵活且强大的工具。\n\
  \n# 第 7 章\n\n## 使用 awk 完成所有其他工作\n\n本章将向你介绍 `awk` 命令，这是一种用于处理数据和重构数据集的多功能工具。事实上，这个工具的功能是如此强大，以至于有整本书的书都是关于\
  \ `awk` 工具的。`awk` 本质上是一个在一个命令中的完整编程语言，它接受标准输入，产生标准输出，并像其他 Unix 命令一样使用正则表达式和元字符。这允许你将其插入到其他表达式中并执行几乎任何操作，代价是为可能已经承担大量任务的命令字符串增加了复杂性。在使用\
  \ `awk` 时添加注释是有用的，因为它的功能太强大，一眼很难看清你正在使用众多功能中的哪一个。\n\n本章的第一部分对 `awk` 命令进行了简要介绍。你将学习一些\
  \ `awk` 的内置变量，以及如何使用 `awk` 操控字符串变量。注意，某些与字符串相关的示例也可以用其他 `bash` 命令处理。\n\n本章的第二部分将向你展示\
  \ `awk` 中的条件逻辑、`while` 循环和 `for` 循环，用于操作数据集中的行和列。该部分将展示如何删除数据集中的行和合并行，以及如何将文件内容作为单行文本打印。你将看到如何“连接”数据集中的行和行组。\n\
  \n第三部分包含了涉及 `awk` 命令中元字符（在第 1 章 中引入）和字符集的代码示例。你还将看到如何在使用 `awk` 命令中使用条件逻辑来确定是否打印一行文本。\n\
  \n第四部分说明了如何将包含多个 `.` 字符的文本字符串作为分隔符进行分割，随后提供了 `awk` 示例在包含数值数据的文件中执行数值计算（如加、减、乘、除）。该部分还向你展示了\
  \ `awk` 中可用的各种数值函数，以及如何在固定的列中打印文本。\n\n第五部分解释了如何对齐数据集中的列，以及如何对齐并合并数据集中的列。你将看到如何删除列、如何从数据集中选择列子集，以及如何处理数据集中的多行记录。该部分包含了一些单行\
  \ `awk` 命令，它们对于操作数据集的内容非常有用。\n\n本章的最后部分有一组涉及结构化数据嵌套嵌套和日期格式的用例。\n\n## awk 命令\n\n\
  `awk`（Aho, Weinberger 和 Kernighan）命令具有类似 C 语言的语法，你可以使用该工具对数字和文本字符串执行非常复杂的操作。\n\n\
  顺带提一下，还有一个 `gawk` 命令即 GNU `awk`，以及 `nawk` 命令是“新”的 `awk`（书中未讨论这这两个命令）。`nawk` 的一个优点是它允许你从外部设置内部变量的值。\n\
  \n字体 控制 awk 的内置变量\n\n`awk` 命令提供了可以从其默认值更改的变量，以控制 `awk` 如何执行操作。此类变量（及其默认值）示例包括 `FS`\
  \ (\" \")、`RS` (\"\\n\")、`OFS` (\" \")、`ORS` (\"\\n\")、`SUBSEP` 和 `IGNORECASE`。变量\
  \ `FS` 和 `RS` 指定字段分隔符和记录分隔符，而变量 `OFS` 和 `ORS` 分别指定输出字段分隔符和输出记录分隔符。\n\n你可以将字段分隔符视为我们之前在其他命令中使用的分隔符/IFS。记录分隔符的行为类似于\
  \ `sed` 处理单行的方式；例如，`sed` 可以匹配或删除范围内的行，而不是匹配或删除符合正则表达式的内容（默认 `awk` 记录分隔符是换行符，因此默认情况下，`awk`\
  \ 和 `sed` 具有相似的处理和引用文本文件中行的能力）。\n\n作为一个简单的示例，你可以通过更改 `ORS`（从默认的一个换行符改为两个换行符）在文件的每行之后打印一个空行，如下：\n\
  \n```\ncat columns.txt | awk 'BEGIN { ORS =\"\\n\\n\" } ; { print $0 }'\n```\n\n\
  其他内置变量包括 `FILENAME`（`awk` 当前正在读取的文件名）、`FNR`（当前文件中的当前记录数）、`NF`（当前输入记录中的字段数）以及 `NR`（自程序执行以来\
  \ `awk` 处理的输入记录数）。\n\n请参阅在线文档以获取有关 `awk` 命令这些（以及其他）参数的更多信息。\n\n### awk 命令是如何工作的？\n\
  \n`awk` 命令一次读取输入文件的一个记录（默认情况下，一个记录为一行）。如果记录匹配模式，则执行相应的操作（否则不执行任何操作）。如果没有给出搜索模式，则\
  \ `awk` 将对输入的每条记录执行给定的动作。如果没有给出动作，默认行为是打印所有匹配给定模式的记录。最后，不带任何动作的空括号 `{}` 什么都不做；即它不会执行默认的打印操作。注意，动作中的每条语句应该用分号隔开。\n\
  \n为了使上一段更清晰，这里有一些涉及字符串的简单 `awk` 示例（结果显示在代码片段之后）。`-F` 切换将分隔符设置为其后的内容，在本例中是空格。通常在\
  \ `BEGIN{}` 块中使用命令：\n\n```\nx=\"a b c d e\"\necho $x | awk -F\" \" '{print $1}'\n\
  a\necho $x | awk -F\" \" '{print NF}'\n5\necho $x | awk -F\" \" '{print $0}'\na\
  \ b c d e\n```\n\n让我们将 `FS`（分隔符）更改为空字符串以计算字符串长度，这次使用 `BEGIN{}` 语法：\n\n```\necho\
  \ \"abc\" | awk 'BEGIN { FS = \"\" } { print NF }'\n3\n```\n\n下面的示例说明了指定 `test.txt`\
  \ 作为 `awk` 命令输入文件的等等方法：\n\n```\nawk < test.txt '{ print $1 }'\nawk '{ print $1 }'\
  \ < test.txt\nawk '{ print $1 }' test.txt\n```\n\n这里展示了另一种方法（但正如我们之前讨论过的，效率不高，只有当\
  \ `cat` 增加了价值时才这样做）：\n\n```\ncat test.txt | awk '{ print $1 }'\n```\n\n这个执行相同任务的四种方法说明了为什么复杂的注释几乎总是好主意。记住，下一个查看你代码的人可能熟悉你的编码风格。\n\
  \n### 使用 printf() 命令对齐文本\n\n由于 `awk` 是单个命令内部的编程语言，它也有通过 `printf()` 语句产生格式化输出的方法。\n\
  \n列表 7.1 显示了 `columns2.txt` 的内容，列表 7.2 显示了 脚本 `AlignColumns1.sh` 的内容，它向你展示了如何对齐文本文件的列。\n\
  \n***列表 7.1: columns2.txt***\n\n```\none two\nthree four\none two three four\nfive\
  \ six\none two three\nfour five\n```\n\n***列表 7.2: AlignColumns1.sh***\n\n```\n\
  awk '\n{\n   # 左对齐 $1 在 10 字符列中\n   # 右对齐 $2 在 10 字符列中\n   # 右对齐 $3 在 10 字符列中\n\
  \   # 右对齐 $4 在 10 字符列中\n   printf(\"%-10s*%10s*%10s*%10s*\\n\", $1, $2, $3, $4)\n\
  }\n' columns2.txt\n```\n\n\n\n\nListing 7.2 包含一个 `printf()` 语句，用于显示 `columns2.txt`\
  \ 文件中每行的前四个字段，其中每个字段的宽度为 10 个字符。\n\n运行 Listing 7.2 中的代码，输出如下：\n\n```\n one     \
  \  *       two*          *          *\nthree     *      four*          *       \
  \   *\none       *       two*     three*      four*\nfive      *       six*    \
  \      *          *\none       *       two*     three*          *\nfour      * \
  \     five*          *          *\n```\n\n请记住，`printf` 功能相当强大，因此它有自己的语法，这超出了本章的范围。你可以在网上搜索找到手册页，以及关于“如何使用\
  \ `printf()` 实现 X”的讨论。\n\n### 条件逻辑与控制语句\n\n与其他编程语言一样，`awk` 提供对条件逻辑（`if/else`）和控制语句（`for/while`\
  \ 循环）的支持。`awk` 是在管道命令流中放置条件逻辑的唯一方法，无需创建、安装并将其自定义的可执行 shell 脚本添加到路径中。以下代码块展示了如何使用\
  \ `if/else` 逻辑：\n\n```\n echo \"\" | awk ' \nBEGIN { x = 10 }\n{\n  if (x % 2 ==\
  \ 0) }\n      print \"x is even\"\n  }\n  else }\n      print \"x is odd\"\n  }\n\
  }\n'\n```\n\n上述代码块将变量 `x` 初始化为值 10，如果 `x` 能被 2 整除，则打印“x is even”，否则打印“x is odd”。\n\
  \n### while 语句\n\n以下代码块说明了如何在 `awk` 中使用 `while` 循环：\n\n```\n echo \"\" | awk '\n\
  {\n  x = 0\n  while(x < 4) {\n    print \"x:\",x\n    x = x + 1\n  }\n}\n'\n```\n\
  \n上述代码块生成了以下输出：\n\n```\n x:0\nx:1\nx:2\nx:3\n```\n\n以下代码块说明了如何在 `awk` 中使用 `do while`\
  \ 循环：\n\n```\n echo \"\" | awk '\n{\n  x = 0\n  do {\n    print \"x:\",x\n    x\
  \ = x + 1\n  } while(x < 4)\n}\n'\n```\n\n上述代码块生成了以下输出：\n\n```\n x:0\nx:1\nx:2\n\
  x:3\n```\n\n### awk 中的 for 循环\n\nListing 7.3 显示了 `Loop.sh` 的内容，该内容说明了如何在循环中打印数字列表。注意\
  \ `i++` 是 `awk`（以及大多数 C 派语言）中 `i=i+1` 的另一种写法。\n\n***LISTING 7.3: Loop.sh***\n\n\
  ```\n echo \"\" | awk '\nBEGIN {}\n{\n  for(i=0; i<5; i++) {\n    printf(\"%3d\"\
  , i)\n  }\n}\nEND { print \"\\n\" }\n'\n```\n\nListing 7.3 包含一个 `for` 循环，通过 `printf()`\
  \ 语句在同一行打印数字。注意换行符只在代码的 `END` 块中被打印。Listing 7.3 的输出如下：\n\n```\n 0 1 2 3 4\n```\n\
  \n#### 带有 break 语句的 for 循环\n\n以下代码块说明了如何在 `awk` 的 `for` 循环中使用 `break` 语句：\n\n```\n\
  \ echo \"\" | awk '\n{\n  for(x=1; x<4; x++) {\n     print \"x:\",x\n     if(x ==\
  \ 2) {\n        break;\n     }\n  }\n}\n'\n```\n\n上述代码块仅输出到变量 `x` 的值为 2 为止，之后循环退出（因为条件逻辑内部存在\
  \ `break`）。显示如下输出：\n\n```\n x:1\nX:2\n```\n\n#### next 和 continue 语句\n\n以下代码段插说明了如何在\
  \ `awk` 的 `for` 循环中使用 `next` 和 `continue`：\n\n```\n awk '\n{ \n   /expression1/\
  \ { var1 = 5; next }\n   /expression2/ { var2 = 7; next }\n   /expression3/ { continue\
  \ }\n   // some other code block here\n' somefile\n```\n\n当当前行匹配 `expression1` 时，`var1`\
  \ 被赋值为 5，`awk` 读取下一行输入；因此，`expression2` 和 `expression3` 将不会被测试。如果 `expression1`\
  \ 不匹配且 `expression2` *匹配*，则 `var2` 被赋值为 7，然后 `awk` 将读取下一行输入。如果只有 `expression3` 导致匹配成功，则\
  \ `awk` 将跳过剩余的代码块并处理下一行输入。\n\n#### 删除数据集中的交替行\n\nListing 7.4 显示了 `linepairs.csv`\
  \ 的内容，Listing 7.5 显示了 `deletelines.sh` 的内容，说明如何打印数据集 `linepairs.csv` 中恰好有两个列的交替行。\n\
  \n\n\n\n\n[Listing 7.10] 显示了 `columns2.txt` 的内容，[Listing 7.11] 显示了 `JoinLines.sh`\
  \ 的内容，该脚本“合并”了 `columns2.txt` 文件中的连续行文本。\n\n### 列表 7.10: columns2.txt\n```\n one\
  \ two \nthree four\none two three four\nfive six  \none two three\nfour five\n```\n\
  \n### 列表 7.11: JoinLines.sh\n```\n awk '\n{\n   printf(\"%s\",$0)\n   if( $1 !~\
  \ /one/) { print \" \" }\n}\n' columns2.txt\n```\n\n运行[Listing 7.11] 的输出如下：\n\n\
  ```\n one two three four  \none two three four five six  \none two three four five\
  \ \n```\n\n注意，[Listing 7.11] 中的代码取决于交替文本行中第一个字段是否存在字符串“one”——我们是基于匹配简单模式进行合并，而不是将其与记录组合绑定。\n\
  \n要合并每对行而不是基于模式匹配合并，请使用[Listing 7.12]中的修改代码。\n\n### 列表 7.12: JoinLines2.sh\n```\n\
  \ awk '\nBEGIN { count = 0 }\n{\n   printf(\"%s\",$0)\n   if( ++count % 2 == 0)\
  \ { print \" \" }\n} columns2.txt\n```\n\n另一种“合并”连续行的方法在[Listing 7.13]中显示，其中输入文件和输出文件指的是你可以填充数据的文件。这是另一个\
  \ `awk` 命令的示例，如果在没有注释的程序中遇到它，可能会像一个谜题。它执行的操作与[Listing 7.12]完全相同，但由于语法更紧凑，它的目的并不那么明显。\n\
  \n### 列表 7.13: JoinLines3.sh\n```\n inputfile=\"linepairs.csv\"\noutputfile=\"linepairsjoined.csv\"\
  \nawk ' NR%2 {printf \"%s,\", $0; next;}1' < $inputfile > $outputfile\n```\n\n##\
  \ 使用元字符和字符集进行匹配\n\n既然我们可以匹配简单模式，现在你可能预计你也可以匹配正则表达式，就像我们在 `grep` 和 `sed` 中做的那样。[Listing\
  \ 7.14] 显示了 `Patterns1.sh` 的内容，它使用元字符来匹配 `columns2.txt` 文件中行文本的开头和结尾\n\n### 列表 7.14:\
  \ Patterns1.sh\n```\n awk '\n   /^f/    { print $1 }\n   /two $/ { print $1 }\n\
  ' columns2.txt\n```\n\n运行[Listing 7.14] 的输出如下：\n\n```\n one\nfive\nfour\n```\n\n\
  [Listing 7.15] 显示了 `RemoveColumns.txt` 的内容，其行包含不同数量的列。\n\n### 列表 7.15: columns3.txt\n\
  ```\n 123 one two\n456 three four\none two three four\nfive 123 six\none two three\n\
  four five\n```\n\n[Listing 7.16] 显示了 `MatchAlpha1.sh` 的内容，它匹配以字母开头的文本行，以及第二列包含数字字符串的行。\n\
  \n### 列表 7.16: MatchAlpha1.sh\n```\n awk '\n{ \n   if( $0 ~ /^[0-9]/) { print $0\
  \ }\n   if( $0 ~ /^[a-z]+ [0-9]/) { print $0 }\n}\n' columns3.txt\n```\n\n[Listing\
  \ 7.16] 的输出如下：\n\n```\n 123 one two \n456 three four \nfive 123 six\n```\n\n## 使用条件逻辑打印行\n\
  \n[Listing 7.17] 显示了 `products.txt` 的内容，该文件包含三列信息。\n\n### 列表 7.17: products.txt\n\
  ```\n MobilePhone 400  new\nTablet      300  new\nTablet      300  used\nMobilePhone\
  \ 200  used\nMobilePhone 100  used\n```\n\n以下代码片段打印 `products.txt` 中第二列大于 300 的文本行：\n\
  \n```\n awk '$2 > 300' products.txt \n```\n\n前一个代码片段的输出如下：\n\n```\n MobilePhone\
  \ 400  new\n```\n\n以下代码片段打印 `products.txt` 中产品为新的文本行：\n\n```\n awk '($3 == \"new\"\
  )' products.txt \n```\n\n前一个代码片段的输出如下：\n\n```\n MobilePhone 400  new\nTablet   \
  \   300  new\n```\n\n以下代码片段打印 `products.txt` 中成本等于 300 的文本行的第一和第三列：\n\n```\n awk\
  \ ' $2 == 300 { print $1, $3 }' products.txt\n```\n\n前一个代码片段的输出如下：\n\n```\nTablet\
  \ new\nTablet used\n```\n\n以下代码片段打印 `products.txt` 中以字符串 `Tablet` 开头的文本行的第一和第三列：\n\
  \n```\n awk '/^Tablet/ { print $1, $3 }' products.txt\n```\n\n前一个代码片段的输出如下：\n\n\
  ```\n```\n```\n\n## 使用 AWK 分割文件名\n\n[Listing 7.18] 显示了 `SplitFilename2.sh` 的内容，说明了如何分割包含\
  \ `.` 的文件名以增加其中一个组件的数值。请注意，此代码仅适用于预期语法的文件名。可以编写更复杂的代码来计算段数，或者简单地说“更改 `.` 之前的字段”，这将文件名具有类似于\
  \ `number.zip` 的格式。\n\n### 列表 7.18: SplitFilename2.sh\n```\n echo \"05.20.144.az.zip\"\
  \ | awk -F\".\" '\n{\n  f5=$5 + 1\n  printf(\"%s.%s.%s.%s.%s\",$1,$2,$3,$4,$f5)\n\
  }'\n```\n\n运行[Listing 7.18] 的输出如下：（注：原文中输出已被截断）。\n\n## 使用后缀算术运算符\n\n[Listing 7.19]\
  \ 显示了 `mixednumbers.txt` 的内容，它包含了带有后缀运算符的数字，即负号在数值末尾\n\n### 列表 7.19: mixednumbers.txt\n\
  ```\n 324 10-\n453 30-\n783 20-\n```\n\n[Listing 7.20] 显示了 `Add1.sh` 的内容，它展示了如何处理\
  \ `mixednumbers.txt` 中带有后缀运算符（即负号在数值末尾）的数字。\n\n### 列表 7.20: Add1.sh\n```\nmyfile=\"\
  mixednumbers.txt\"\nawk -F\"|\" '\nBEGIN { total = 0 }\n{\n   split($1, arr, \"\
  -\")\n   f1 = arr[1]\n   if(arr[2]) { f1 = -f1 }\n   total += f1\n\n split($2, arr,\
  \ \"-\")\n   f2 = arr[1]\n   if(arr[2]) { f2 = -f2 }\n   total += f2\n\n split($3,\
  \ arr, \"-\")\n   f3 = arr[1]\n   if(arr[2]) { f3 = -f3 }\n   total += f3\n\nEND\
  \ { print \"Total: \",total }\n' $myfile\n```\n\n运行[Listing 7.20] 的输出如下，请尝试推导出代码在做什么：\n\
  \n```\nTotal: -3128\n```\n\n## AWK 中的数值函数\n\n`int(x)` 函数返回数字的整数部分。如果数字不是整数，它将位于两个整数之间。在两个整数中，该函数将返回最接近\
  \ 0 的一个。这与舍入函数不同。\n\n例如，`int(3)` 是 3，`int(3.9)` 是 3，`int(-3.9)` 是 -3，`int(-3)` 也是\
  \ -3。`awk` 命令中使用 `int(x)` 函数的示例如下：\n\n```\n awk 'BEGIN {\n   print int(3.534);\n\
  \   print int(4);\n   print int(-5.223);\n   print int(-5);\n}'\n```\n\n输出如下：\n\n\
  ```\n 3\n4\n-5\n-5\n```\n\n`exp(x)` 函数给出 x 的指数，如果 x 超范围则报错。你可以使用的 x 值范围取决于你机器的浮点表示。\n\
  \n```\n awk 'BEGIN{\n   print exp(123434346);\n   print exp(0);\n   print exp(-12);\n\
  }'\n```\n\n\n\n\n\n```\n inf\n1\n6.14421e-06\n```\n\n`log(x)` 函数在 `x` 为正数时返回 `x`\
  \ 的自然对数；否则，它会报告错误（输出中的 `inf` 表示无穷大，`nan` 表示“非数字”）。\n\n```\n awk 'BEGIN{\n  print\
  \ log(12);\n  print log(0);\n  print log(1);\n  print log(-1);\n}'\n```\n\n输出如下：\n\
  \n```\n 2.48491\n-inf\n0\nnan\n```\n\n`sin(x)` 函数返回 `x` 的正弦值，`cos(x)` 返回 `x` 的余值，其中\
  \ `x` 的单位是弧度：\n\n```\n awk 'BEGIN {\n   print cos(90);\n   print cos(45);\n}'\n\
  ```\n\n输出如下：\n\n```\n -0.448074\n0.525322\n```\n\n`rand()` 函数产生一个随机数。`rand()` 的值在\
  \ 0 到 1 之间均匀分布：该值永远不会是 0 也永远不是 1。\n\n通常你想要随机整数。这里有一个自定义函数，可以用来获取小于 `n` 的随机非负整数：\n\
  \n```\n function randint(n) {\n     return int(n * rand())\n}\n```\n\n乘积结果产生一个大于\
  \ 0 且小于 `n` 的随机实数。然后我们使用 `int` 将其转换为 0 到 `n - 1` 之间的整数。\n\n以下是一个示例，使用类似的函数生成 1 到\
  \ `n` 之间的随机整数：\n\n```\n echo \"\" | awk '\n# 模拟掷骰子的函数。\nfunction roll(n) { return\
  \ 1 + int(rand() * n) }\n# 投掷 3 颗六面骰子并打印总点数。\n{\n      printf(\"%d points\\n\",\
  \ roll(6)+roll(6)+roll(6))\n}'\n```\n\n注意，`rand` 在每次调用 `awk` 时都会从同一个点（或称为“种子”）开始生成数字。因此，程序每次启动都会产生相同的结果。如果你希望程序在每次使用时执行不同的操作，则必须将种子更改为每次运行时都不同的值。\n\
  \n使用 `srand(x)` 函数将生成随机数的起始点（即种子）设置为值 `x`。每个种子值都会导致一特定的特定的“随机”数字序列。因此，如果你第二次将种子设置为相同的值，你将再次获得相同的“随机”数字序列。如果你省略参数\
  \ `x`（如 `srand()` 所示），则使用当前的日期和时间作为种子。这正是获取真正不可预测的随机数的方法。`srand()` 的返回值是上一个种子。这便于跟踪种子，以便一致地重建随机数序列。\n\
  \n`time()` 函数（并非所有 `awk` 版本都支持）返回自 1970 年 1 月 1 日以来的秒数。`ctime` 函数（并非所有 `awk` 版本都支持）接受一个秒数值参数，并返回表示对应日期的字符串，适用于打印或进一步处理。\n\
  \n`sqrt(x)` 函数返回 `x` 的正平方根。如果 `x` 为负数，它会报告错误。因此，`sqrt(4)` 为 2。\n\n```\n echo \"\"\
  \ | awk 'BEGIN{\n   print sqrt(16);\n   print sqrt(0);\n   print sqrt(-12);\n}'\n\
  ```\n\n输出如下：\n\n```\n 4\n0\nnan\n```\n\n### 单行 AWK 命令\n\n本节中的代码段引用了文本文件 `short1.txt`，你可以用任意数据填充它。\n\
  \n以下代码段打印每行，并在行前加上该行的字段数：\n\n```\n awk '{print NF \":\" $0}' short1.txt\n```\n\n\
  打印每行最右侧的字段：\n\n```\n awk '{print $NF}' short1.txt\n```\n\n打印包含超过 2 个字段的行：\n\n```\n\
  \ awk '{if(NF > 2) print }' short1.txt\n```\n\n如果当前行包含超过 2 个字段，则打印右侧字段的值：\n\n```\n\
  \ awk '{if(NF > 2) print $NF }' short1.txt\n```\n\n去除开头和结尾的空白字符：\n\n```\n echo \"\
  \ a b c \" | awk '{gsub(/^[ \\t]+|[ \\t]+$/,\"\");print}'\n```\n\n对于包含至少 3 个字段的行，反序打印第一和第三字段：\n\
  \n```\n awk '{if(NF > 2) print $3, $1}' short1.txt \n```\n\n打印包含字符串 \"one\" 的行：\n\
  \n```\nawk '{if(/one/) print }' *txt\n```\n\n如前述代码段所示，使用 `awk` 命令中简单的条件逻辑和内置变量，可以很容易从文本文件中提取信息或行、列的子集。\n\
  \n### 有用的短 AWK 脚本\n\n本节包含了一组基于 `awk` 的简短脚本，用于执行各种操作。其中某些脚本也可以用于其他 shell 脚本以执行更复杂的操作。列表\
  \ 7.21 显示了本节中各种代码示例使用的文件 `data.txt` 内容。\n\n***列表 7.21: data.txt***\n\n```\n this\
  \ is line one that contains more than 40 characters\nthis is line two\nthis is line\
  \ three that also contains more than 40 characters\nfour\nthis is line five\n```\n\
  \n\n\n如果发生匹配，则 `count` 的值将加 1。`END` 块会报告字符串 `past` 在第 2、5、7 列中找到的次数。注意，像 `paste`\
  \ 和 `pasted` 这样的字符串也会匹配字符串 `past`。Listing 7.25 的输出如下：\n\n```\n List of files: data1.csv\
  \ data2.csv \npast: matched 5 times (INEXACT) in field 3 in lines 2/5/7\n```\n\n\
  shell 脚本 `checkrows2.sh` 将 `checkrows.sh` 中的项 `$3 ~ \"past\"` 替换为 `$3 == \"past\"\
  ` 以检查精确匹配，这产生了以下输出：\n\n```\n List of files: data1.csv data2.csv \npast: matched\
  \ 4 times (EXACT) in field 3 in lines 2/5/7\n```\n\n### 在固定列数中打印字符串\n\nListing 7.26\
  \ 显示了 `FixedFieldCount1.sh` 的内容，它说明了如何使用 `awk` 命令打印文本字符串中的单词。\n\n***LISTING 7.26:\
  \ FixedFieldCount1.sh***\n\n```\n echo \"aa bb cc dd ee ff gg hh\"| awk '\nBEGIN\
  \ { colCount = 3 }\n{\n  for(i=1; i<=NF; i++) {\n     printf(\"%s \", $i)\n    \
  \ if(i % colCount == 0) {\n        print \" \"\n     }\n  }\n}\n'\n```\n\nListing\
  \ 7.26 的输出如下：\n\n```\n aa bb cc  \ndd ee ff  \ngg hh\n```\n\n### 在固定列数中打印数据集\n\n\
  Listing 7.27 显示了 `VariableColumns.txt` 的内容，其中的文本行包含不同数量的列。\n\n***LISTING 7.27: VariableColumns.txt***\n\
  \n```\n this is line one\nthis is line number one \nthis is the third and final\
  \ line\n```\n\nListing 7.28 显示了 `Fields3.sh` 的内容，它说明了如何使用 `awk` 命令打印文本字符串中的单词。\n\
  \n***LISTING 7.28: Fields3.sh***\n\n```\n awk '{printf(\"%s \", $0)}' | awk '\n\
  BEGIN { columnCount = 3 }\n{ \n  for(i=1; i<=NF; i++) {\n     printf(\"%s \", $i)\n\
  \     if( i % columnCount == 0 )\n       print \" \"\n  }\n}\n' VariableColumns.txt\n\
  ```\n\nListing 7.28 的输出如下：\n\n```\n this is line  \none this is  \nline number one\
  \  \nthis is the  \nthird and final  \nline\n```\n\n### 对齐数据集中的列\n\n如果你已经阅读了前面的两个例子，那么本节中的代码示例将很容易理解。你将学习如何重新对齐数据列，这些数据在内容上是正确的，但被放置在了不同的行（因此未对齐）。Listing\
  \ 7.29 显示了 `mixed-data.csv` 的内容，其中包含未对齐的数据。此外，Listing 7.28 中的第一行和最后一行是空行，这些行将被本节中的\
  \ shell 脚本删除。\n\n***LISTING 7.29: mixed-data.csv***\n\n```\n Sara, Jones, 1000,\
  \ CA, Sally, Smith, 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\n\
  Dave, Jones, 5000, NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA \n```\n\nListing\
  \ 7.30 显示了 `mixed-data.sh` 的内容，它说明了如何重新对齐 Listing 7.29 中的数据集。\n\n***LISTING 7.30:\
  \ mixed-data.sh***\n\n```\n #----------------------------------------- \n# 1) remove\
  \ blank lines\n# 2) remove line feeds\n# 3) print a LF after every fourth field\n\
  # 4) remove trailing ',' from each row \n#-----------------------------------------\n\
  \ninputfile=\"mixed-data.csv\"\n\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
  %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n  \
  \   printf(\"%s \", $i) \n     if( i % columnCount  == 0) { print \"\" }\n   } \n\
  }' > temp-columns \n\n# 4) remove trailing ',' from output:\ncat temp-columns |\
  \ sed 's/, $//' | sed 's/ $//' > $outputfile\n```\n\nListing 7.30 以一个 `grep` 命令开始，其用于删除空行，随后是一个\
  \ `awk` 命令，将数据集的行作为单行打印。第二个 `awk` 命令在 `BEGIN` 块中将 `columnCount` 变量初始化为 `4`，随后在主执行块中使用\
  \ `for` 循环遍历字段。在同一行中打印四个字段后，会打印一个换行符，其效果是将输入数据集重新对齐为每行包含四个字段的输出数据集。Listing 7.30\
  \ 的输出如下：\n\n```\n Sara, Jones, 1000, CA\nSally, Smith, 2000, IL\nDave, Jones, 3000,\
  \ FL\nJohn, Jones, 4000, CA \nDave, Jones, 5000, NY\nMike, Jones, 6000, NY\nTony,\
  \ Jones, 7000, WA\n```\n\n### 对齐列与多行\n\n前一节向你展示了如何重新对齐数据集，使其每行具有相同的列数。本节展示了如何重新对齐数据，使其在内容上正确且每行代表一个完整的记录。Listing\
  \ 7.31 显示了 `mixed-data.csv` 的内容，其中包含未对齐的数据值。此外，Listing 7.30 中的第一行和最后一行是空行，这些行将被本节中的\
  \ shell 脚本删除。\n\n***LISTING 7.31: mixed-data.csv***\n\n```\n Sara, Jones, 1000,\
  \ CA, Sally, Smith, 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\n\
  Dave, Jones, 5000, NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA \n```\n\nListing\
  \ 7.32 显示了 `mixed-data.sh` 的内容，它说明了如何重新对齐 Listing 7.31 中的数据集。\n\n***LISTING 7.32:\
  \ mixed-data.sh***\n\n```\n #----------------------------------------- \n# 1) remove\
  \ blank lines\n# 2) remove line feeds\n# 3) print a LF after every fourth field\n\
  # 4) remove trailing ',' from each row \n#-----------------------------------------\n\
  \ninputfile=\"mixed-data.csv\"\n\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
  %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n  \
  \   printf(\"%s \", $i) \n     if( i % columnCount  == 0) { print \"\" }\n   } \n\
  }' > temp-columns \n\n# 4) remove trailing ',' from output:\ncat temp-columns |\
  \ sed 's/, $//' | sed 's/ $//' > $outputfile\n```\n\nListing 7.32 以一个 `grep` 命令开始，其用于删除空行，随后是一个\
  \ `awk` 命令，将数据集的行作为单行打印。第二个 `awk` 命令在 `BEGIN` 块中将 `columnCount` 变量初始化为值 `4`，随后在主执行块中使用\
  \ `for` 循环遍历字段。在同一行中打印四个字段后，会打印一个换行符，其效果是将输入数据集重新对齐为每行包含四个字段的输出数据集。Listing 7.32\
  \ 的输出如下：\n\n```\n Sara, Jones, 1000, CA\nSally, Smith, 2000, IL\nDave, Jones, 3000,\
  \ FL\nJohn, Jones, 4000, CA \nDave, Jones, 5000, NY\nMike, Jones, 6000, NY\nTony,\
  \ Jones, 7000, WA\n```\n\n### 从文本文件中删除列\n\nListing 7.34 显示了 `VariableColumns.txt`\
  \ 的内容，其中的文本行包含不同数量的列。\n\n***LISTING 7.34: VariableColumns.txt***\n\n```\n this is\
  \ line one\nthis is line number one \nthis is the third and final line\n```\n\n\
  Listing 7.35 显示了 `RemoveColumn.sh` 的内容，它说明了如何从文本文件中删除第一列。\n\n***LISTING 7.35: RemoveColumn.sh***\n\
  \n```\n awk '{ for (i=2; i<=NF; i++) printf \"%s \", $i; printf \"\\n\"; }' products.txt\n\
  ```\n\n循环位于 2 到 `NF` 之间，遍历了第一个字段以外的所有字段。此外，`printf()` 显式地添加了换行符。上述代码段的输出如下：\n\n\
  ```\n 400 new \n300 new \n300 used \n200 used \n100 used\n```\n\n\n\n\nListing 7.35\
  \ 展示了你如何对齐数据集的行，本节的代码示例说明了如何提取现有列的子集和行的子集。Listing 7.36 显示了目标数据集 `sub-rows-cols.txt`\
  \ 的内容，该数据集包含来自 `aligned-data.txt` 文件每个偶数行的列。\n\n### 列表 7.36: sub-rows-cols.txt\n\
  ``````\n Sara, 1000\nDave, 3000\nDave, 5000\nTony, 7000\n```\n\nListing 7.37 显示了\
  \ `sub-rows-cols.sh` 的内容，该文件说明了如何生成 Listing 7.36 中的数据集。大部分代码与 Listing 7.33 相同，新代码已加粗显示。\n\
  \n### 列表 7.37: sub-rows-cols.sh\n``````\n #-----------------------------------------\
  \ \n# 1) 删除空行\n# 2) 删除换行符\n# 3) 在每四个字段后打印一个 LF\n# 4) 删除每行末尾的逗号 \n#-----------------------------------------\n\
  \ninputfile=\"mixed-data.txt\"\n\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
  %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n  \
  \   printf(\"%s \", $i) \n     if( i % columnCount  == 0) { print \"\" }\n   } \n\
  }' > temp-columns \n\n# 4) 删除输出末尾的逗号:\ncat temp-columns | sed 's/, $//' | sed 's/$//'\
  \ > temp-columns2\n\ncat temp-columns2 | awk ‘\nBEGIN { rowCount = 2; currRow =\
  \ 0 }\n{\n   if(currRow % rowCount == 0) { print $1, $3 }\n   ++currRow\n}’ > temp-columns3\n\
  \ncat temp-columns3 | sed ‘s/,$//’ | sed ‘s/ $//’ > $outputfile\n```\n\nListing\
  \ 7.37 包含一个新的代码块，它将步骤 #4 的输出重定向到临时文件 `temp-columns2`，该文件的内容由 Listing 7.37 最后部分的另一个\
  \ `awk` 命令进行处理。注意，`awk` 命令包含一个 `BEGIN` 块，它将变量 `rowCount` 和 `currRow` 分别初始化为 `2`\
  \ 和 `0`。\n\n主代码块在当前行号为偶数时打印当前行的第 1 列和第 3 列，然后增加 `currRow` 的值。该 `awk` 命令的输出被重定向到另一个临时文件，作为最终代码片段的输入，该片段使用\
  \ `cat` 命令和两个 `sed` 命令来移除末尾的“，”和末尾的空格，如下所示：\n\n```\n cat temp-columns3 | sed ‘s/,$//’\
  \ | sed ‘s/ $//’ > $outputfile\n```\n\n还有其他方法可以实现 Listing 7.37 中的功能，但主要目的是向展示组合各种\
  \ `bash` 命令的不同技术。\n\n### 在数据集中统计单词频率\n\nListing 7.38 显示了 `WordCounts1.sh` 的内容，该文件说明了如何统计文件中单词的频率。\n\
  \n### 列表 7.38: WordCounts1.sh\n``````\n awk '\n## 打印单词频率列表\n{\n    for (i = 1; i\
  \ <= NF; i++)\n        freq[$i]++\n}\nEND {\n    for (word in freq)\n        printf\
  \ \"%s\\t%d\\n\", word, freq[word]\n}\n' columns2.txt\n```\n\nListing 7.38 包含一个处理\
  \ `columns2.txt` 中行的代码块。每遇到一个单词（行中的），代码就会哈希表 `freq` 中该单词的出现次数。`END` 块包含一个 `for`\
  \ 循环，显示 `columns2.txt` 中每个单词的出现次数。\n\nListing 7.38 的输出在此：\n\n```\n two     3\none\
  \     3\nthree   3\nsix     1\nfour    3\nfive    2\n```\n\nListing 7.39 显示了 `WordCounts2.sh`\
  \ 的内容，该文件执行不区分大小写的单词统计。\n\n### 列表 7.39: WordCounts2.sh\n``````\n awk '\n{\n    #\
  \ 将所有转换为小写\n    $0 = tolower($0)\n    # 移除标点符号\n   #gsub(/[^[:alnum:]_[:blank:]]/,\
  \ \"\", $0)\n\n    for(i=1; i<=NF; i++) {\n       freq[$i]++\n    }\n}\nEND {\n\
  \    for(word in freq) {\n       printf \"%s\\t%d\\n\", word, freq[word]\n    }\n\
  } columns4.txt\n```\n\nListing 7.39 起于一段代码，它将每行文本转换为小写，如下：\n\n```\n $0 = tolower($0)\n\
  ```\n\n下一个代码片段移除标点符号，随后的循环统计每个单词的出现次数。Listing 7.39 的最后部分显示文本中的每个单词及其频率。Listing 7.40\
  \ 显示 `columns4.txt` 的内容。\n\n### 列表 7.40: columns4.txt\n``````\n 123 ONE\n456 three\n\
  ONE TWO\nfive 123\none two\n```\n\n运行 Listing 7.39 并配合 `columns4.txt` 的输出在此：\n\n\
  ```\n 456     1\ntwo     3\none     3\nthree   3\nsix     1\n123     2\nfour   \
  \ 3\n```\n\n## 在数据集中仅显示单词\n\n为了简单起见，让我们处理文本字符串，这样我们可以看到中间结果。这个示例在之前的章节中很常见，但现在我们看\
  \ `awk` 如何实现它。Listing 7.41 显示了 `onlywords.sh` 的内容，它包含三个 `awk` 命令，用于显示字符串中的单词、整数和字母数字字符串。\n\
  \n### 列表 7.41: onlywords.sh\n``````\n x=\"ghi Ghi 123 #def5 123z\"\n\necho \"Only\
  \ words:\"\necho $x |tr -s '\\n' | awk -F\" \"\n{\n  if($0 ~ /^[a-zA-Z]+$/) { print\
  \ $0 }\n}' | sort | uniq\n\necho \"Only integers:\"\necho $x |tr -s '\\n' | awk\
  \ -F\" \"\n{\n  if($0 ~ /^[0-9]+$/) { print $0 }\n}' | sort | uniq\n\necho \"Only\
  \ alphanumeric words:\"\necho $x |tr -s '\\n' | awk -F\" \"\n{\n  if($0 ~ /^[0-9a-zA-Z]+$/)\
  \ { print $0 }\n}' | sort | uniq\n```\n\nListing 7.41 首先初始化变量 `x`：\n\n```\n x=\"\
  ghi Ghi 123 #def5 123z\"\n```\n\n下一步是将 `x` 拆分为单词：\n\n```\n echo $x |tr -s '\\n'\n\
  ```\n\n输出在此：\n\n```\n ghi\nabc\nGhi\n123\ndef5\n123z\n```\n\n第三步是调用 `awk` 并检查正则表达式\
  \ `^[a-zA-Z]+` 的单词，该正则匹配任何一个或多个大写或小写字母（且无其他字符）：\n\n```\n if($0 ~ /^[a-zA-Z]+$/)\
  \ { print $0 }\n```\n\n输出在此：\n\n```\n ghi\nabc\nGhi\n```\n\n最后，如果你也对输出进行排序并只打印唯一单词，可以将\
  \ `awk` 命令的输出重定向到 `sort` 命令和 `uniq` 命令。第二个 `awk` 命令使用正则表达式 `^[0-9]+` 检查整数，第三个 `awk`\
  \ 命令使用正则表达式 `^[0-9a-zA-Z]+` 检查字母数字单词。运行 Listing 7.37 的输出在此：\n\n```\n Only words:\n\
