  \    29.67  \n  6 0.16   79.00    30.00  \n  7 0.27   74.00    30.33 \n```\n\n###\
  \ 计算字段值的组合\n\nListing 9.29 显示了壳脚本 `linear-combo.sh` 的内容，该脚本计算多个数据集列的各种线性组合并将一个数据集输出。\n\
  \n***Listing 9.29: linear-combo.sh***\n\n```\n # combinations of columns\nawk -F','\
  \ '\n{\n  $2 += $3 * 2 + $4 / 2\n  $3 += $4 / 3 + $2 / 10\n  $4 += $2 + $3\n  $1\
  \ += $2 * 3 - $4 / 10\n  printf(\"%d,%.2f,%.2f,%.2f\\n\",$1,$2,$3,$4)\n} \n' rain?.csv\n\
  ```\n\nListing 9.29 处理数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv` 的值，它们的内容在本节之前显示。关键观察是\
  \ `awk` 语句体中的计算顺序涉及依赖关系。具体来说，`$2` 的值是 `$3` 和 `$4` 值的线性组合。接下来，`$3` 的值是 `$4` 和 `$2`\
  \ 值的线性组合，后者不是数据集中的原始值，而是计算值。第三，`$4` 的值是 `$2` 和 `$3` 的线性组合，两者都是计算值而非数据集中的值。最后，`$1`\
  \ 的值是新计算的 `$2` 和 `$4` 值的线性组合。\n\n你可以看到，`awk` 提供了以简单顺序方式指定任意计算组合（包括非线性组合）。Listing\
  \ 9.30 的输出如下：\n\n```\n194,113.60,1348.50,1477.10\n196,116.12,1407.72,1539.84\n204,135.19,1895.97,2041.16\n\
  187,183.75,3470.07,3676.82\n202,122.68,1567.70,1707.38\n194,175.23,3160.89,3370.12\n\
  207,142.84,2113.33,2277.17\n201,138.00,1975.40,2137.40\n202,140.52,2046.92,2212.15\n\
  ```\n\n### **总结**\n\n在本章中，你看到了如何创建一些实用 bash 命令的示例。首先，你看到了处理包含多行记录文本文件的 bash 脚本。接下来，你看到了如何计算记录中数值字段的累积和。然后你学习了如何在带有\
  \ `awk` 命令的壳脚本中使用 `split()` 函数。\n\n你学习了如何使用 `awk` 处理跨数据集的记录以计算平均值和总值。多数据集任务使你学习了更复杂的壳脚本，这些脚本对以文件形式呈现的一组“关系”表进行操作。最后，你学习了如何动态地从多个数据集中计算各种列组合。\n\
  \n在本章中，你将学习如何执行涉及多个文件和目录的各种任务、处理压缩文件、后台进程以及打印简单的报告。\n\n本章的第一部分向你展示如何从目录树中选择性地复制和删除文件。第二部分包含一组根据字符串在目录中创建子目录的脚本。其中一个脚本向你展示了如何检查给定的字符串是子目录还是文件。\n\
  \n\n\n\n\n本章第三部分讨论了处理 zip 文件的各种命令，例如 `gzip` 和 `gunzip`。（请参见第 4 章 查看创建归档文件的 `tar`\
  \ 命令示例。）本章的第四部分将向你展示如何使用 `at` 和 `crontab` 命令调度任务。最后，你将学习与打印相关的命令以及如何生成简单的报告。\n\n\
  ## 在目录上使用 RM 和 MV\n\n在开始查看 shell 脚本之前，有一些你可以通过 `rm` 命令完成的简单任务。例如，如果你想删除 `my_stuff`\
  \ 目录及其所有内容，可以使用此命令：\n\n```\n rm -r my_stuff\n```\n\n或者，你可以使用 `mv` 命令将 `my_stuff`\
  \ 目录移动到 `/tmp` 目录：\n\n```\n mv my_stuff /tmp\n```\n\n然而，前面的命令最多只能执行一次；如果 `/tmp`\
  \ 中已经存在该目录，则上述的 `mv` 命令将失败。\n\n如果你想将 `my_stuff` 目录的全部内容（包括所有子目录）克隆到 `my_stuff2`\
  \ 目录，请使用此命令：\n\n```\n cp -r my_stuff my_stuff2\n```\n\n你也可以结合 `cp` 或 `mv` 命令与反向替换，复制（或移动）多个子目录中的部分文件。\n\
  \n例如，假设你有一个包含多个子目录的目录，其中包含 Word 文档和文本文件，如下：\n\n```\n myfiles/wordfiles/chapter1/chapter1.doc\n\
  myfiles/wordfiles/chapter2/chapter2.doc\nmyfiles/wordfiles/chapter3/chapter3.doc\n\
  myfiles/wordfiles/chapter4/chapter4.doc\nmyfiles/wordfiles/chapter1/data1.txt\n\
  myfiles/wordfiles/chapter2/data2.txt\nmyfiles/wordfiles/chapter3/data3.txt\nmyfiles/wordfiles/chapter4/data4.txt\n\
  ```\n\n列表 10.1 显示了 shell 脚本 `maketree.sh` 的内容，它会在当前目录下创建一组子目录。\n\n**列表 10.1: maketree.sh**\n\
  \n```\n # remove myfiles\nrm -r myfiles 2>/dev/null\n\n### create subdirectories\n\
  mkdir -p myfiles/wordfiles/chapter1\nmkdir -p myfiles/wordfiles/chapter2\nmkdir\
  \ -p myfiles/wordfiles/chapter3\nmkdir -p myfiles/wordfiles/chapter4\n\n### create\
  \ empty files\ntouch myfiles/wordfiles/chapter1/chapter1.doc\ntouch myfiles/wordfiles/chapter2/chapter2.doc\n\
  touch myfiles/wordfiles/chapter3/chapter3.doc\ntouch myfiles/wordfiles/chapter4/chapter4.doc\n\
  touch myfiles/wordfiles/chapter1/data1.txt\ntouch myfiles/wordfiles/chapter2/data2.txt\n\
  touch myfiles/wordfiles/chapter3/data3.txt\ntouch myfiles/wordfiles/chapter4/data4.txt\n\
  ```\n\n列表 10.1 删除了 `myfiles` 目录，然后使用 `mkdir -p` 命令创建一组子目录，随后使用 `touch` 命令创建空的 Word\
  \ 文档和空的文本文件。\n\n### 在目录上使用 FIND 命令\n\n首先，确保你运行了上一节中的 shell 脚本 `mktree.sh`，以指定的文件创建指定的目录结构。\n\
  \n以下命令查找 `myfiles` 目录中的所有 Word 文档：\n\n```\n find myfiles -name \"*.doc\"\n```\n\n\
  以下命令将 `myfiles` 目录中的所有 Word 文档复制到 `/tmp` 目录：\n\n```\n cp `find myfiles -name \"\
  *.doc\"` /tmp\n```\n\n你可以通过将 `*.doc` 替换为 `*.txt` 对文本文件执行类似的操作。\n\n或者，以下命令结合使用了 `cp`、`find`\
  \ 和 `grep` 命令将 `myfiles` 目录中的所有 Word 文档复制到 `/tmp` 目录：\n\n```\n cp `find myfiles\
  \ |grep \"\\.doc$\"` /tmp\n```\n\n注意 `grep` 命令中的模式 `\\.doc$\"`，它确保了 `grep` 命令只会找到后缀为\
  \ `.doc` 的文件。该模式防止了 `mydoc_stuff` 或 `mydoc` 文件（或目录）在 `grep` 命令中被匹配。\n\n然而，可能会创建一个名为\
  \ `my.doc` 的目录，它也会在 `grep` 命令中被匹配。在这种情况下，`cp` 命令将显示错误信息，提示目录 `my.doc` 未被复制。\n\n\
  ### 创建包含目录的目录\n\n列表 10.2 显示了 shell 脚本 `makedirs.sh` 的内容，它在 `names` 目录中创建一组子目录。\n\
  \n**列表 10.2: makedirs.sh**\n\n```\n ###################################################\n\
  ### 定义一个包含目录名列表的变量\n# 此方法不依赖外部文件。\n### 或者，将这些名称放在文本文件中\n# 然后读取该文本文件的内容。\n###################################################\n\
  \n# 将 mydir 的值更改为你需要的任何值\nmydir=\"names\"\n\nname_list=\"andrew-webber dave-jones\
  \ jane-smith john-smith\"\n\nif [ ! -d $mydir ]\nthen\n  mkdir $mydir\n  cd $mydir\n\
  \n  for name in `echo $name_list`\n  do\n    echo \"creating directory $name\"\n\
  \    mkdir $name\n  done\nelse\n  echo \"Directory $mydir exists\"\nfi\n```\n\n\
  列表 10.2 初始化了变量 `name_list`，其中包含硬编码的名称列表，这些名称都将成为 `mydir` 的子目录。列表 10.2 的后续包含了 if/else\
  \ 逻辑来判断 `mydir` 目录是否存在。如果不存在，则循环遍历 `$name_list` 中的字符串并在 `mydir` 中创建相应的子目录。\n\n运行列表\
  \ 10.2 中的代码，你将看到如下输出：\n\n```\n creating directory andrew-webber\n creating directory\
  \ dave-jones\n creating directory jane-smith\n creating directory john-smith\n creating\
  \ directory keith-thompson\n```\n\n如果你再次运行列表 10.2 中的代码，你将看到如下输出：\n\n```\n Directory\
  \ names\n```\n\n### 克隆一组子目录\n\n列表 10.3 显示了 `names` 目录的内容，而列表 10.4 显示了 shell 脚本 `makedirs1.sh`\
  \ 的内容，它向 `names2` 目录填充子目录。\n\n**列表 10.3: names**\n\n```\njohn-smith\njane-smith\n\
  dave-jones\nandrew-webber\nkeith-thompson\n```\n\n**列表 10.4: makedirs1.sh**\n\n\
  ```\n if [ ! -d names2 ]\nthen\n   echo \"creating directory 'names'\"\n   mkdir\
  \ names2\nfi\n\ncd names2\necho \"inside directory names2\"\n\nfor d in `ls ../names`\n\
  do\n   echo \"Creating directory $d\"\n   mkdir $d\ndone \n```\n\n列表 10.4 包含一个简单的\
  \ `for` 循环，遍历遍历 `names` 目录的内容，显示消息并在 `names2` 目录中创建相应的子目录。\n\n运行列表 10.4 中的代码，你将看到如下输出：\n\
  \n```\n Creating directory andrew-webber\nCreating directory dave-jones\nCreating\
  \ directory jane-smith\nCreating directory john-smith\n Creating directory keith-thompson\n\
  ```\n\n然而，如果你再次运行列表 10.4 中的代码，由于目录已经存在，你将看到多个错误，如下：\n\n```\n Creating directory\
  \ andrew-webber\nmkdir: andrew-webber: File exists\nCreating directory dave-jones\n\
  mkdir: dave-jones: File exists\n Creating directory jane-smith\nmkdir: jane-smith:\
  \ File exists\n Creating directory john-smith\nmkdir: john-smith: File exists\n\
  \ Creating directory keith-thompson\nmkdir: keith-thompson: File exists\n```\n\n\
  列表 10.5 显示了 shell 脚本 `makedirs2.sh` 的内容，它在向 `names2` 目录填充目录之前会检查该目录是否已存在。\n\n**列表\
  \ 10.5: makedirs2.sh**\n\n```\n if [ ! -d names2 ]\nthen\n   echo \"creating directory\
  \ 'names'\"\n   mkdir names2\nfi\n\ncd names2\necho \"inside directory names2\"\n\
  \nfor d in `ls ../names`\ndo\n  if [ -d $d ]\n  then\n    echo \"Directory $d already\
  \ exists\"\n  else\n    echo \"Creating directory $d\"\n    mkdir $d\n  fi\ndone\
  \ \n```\n\n\n\n\n\n列表 10.5 包含一个简单的 for 循环，用于遍历（兄弟）目录名称的内容。`if/else` 代码块检查目录是否已存在；如果，则显示消息；如果没有，则在\
  \ `names2` 目录中创建该目录。\n\n运行列表 10.5 中的代码，你将看到以下输出：\n\n```\nDirectory andrew-webber\
  \ already exists\nDirectory dave-jones already exists\nDirectory jane-smith already\
  \ exists\nDirectory john-smith already exists\nDirectory keith-thompson already\
  \ exists\n```\n\n列表 10.6 显示了 脚本 `clonedirs3.sh` 的内容，该脚本首先检查 `names2` 中的文件是否为文件而不是目录：如果是，则不创建目录。接下来，如果\
  \ `names2` 中的文件实际上是一个目录，代码会在向 `names2` 目录填充 `names` 目录中的目录之前，检查该目录是否已存在。\n\n**列表\
  \ 10.6: clonedirs3.sh**\n\n```bash\nif [ ! -d names2 ]\nthen\n   echo \"creating\
  \ directory 'names'\"\n   mkdir names2\nfi\n\ncd names2\necho \"inside directory\
  \ names2\"\n\nfor d in `ls ../names`\ndo\n  if [ -f $d ]\n  then\n    echo \"$d\
  \ is a file (not a directory)\"\n  elif [ -d $d ]\n  then\n    echo \"Directory\
  \ $d already exists\"\n  else\n\n    echo \"Creating directory $d\"\n    mkdir $d\n\
  \  fi\ndone \n```\n\n列表 10.6 包含一个简单的 for 循环，用于遍历（兄弟）目录名称的内容。`if/else` 代码块检查目录是否已存在；如果，则显示消息；如果没有，则在\
  \ `names2` 目录中创建该目录。\n\n运行列表 10.6 中的代码，你将看到以下输出：\n\n```\nDirectory andrew-webber\
  \ already exists\nDirectory dave-jones already exists\nDirectory jane-smith already\
  \ exists\nDirectory john-smith already exists\nDirectory keith-thompson already\
  \ exists\n```\n\n列表 10.7 显示了 脚本 `copy-file1.sh` 的内容，该脚本首先检查 `names2` 中的文件是否为文件而不是目录：如果是，则不进行复制。接下来，如果\
  \ `names2` 中的文件实际上是一个目录，代码会将 `file1` 复制到该目录中。如果文件不存在，代码将创建一个目录并将 `file1` 复制到该目录。\n\
  \n**列表 10.7: copy-file1.sh**\n\n```bash\necho \"hello world\" >/tmp/file1\nfile1=\"\
  /tmp/file1\"\n\nfor d in `ls`\ndo\n  if [ -f $d ]\n  then\n    echo \"Skipping copy\
  \ command for $d\"\n  elif [ -d $d ]\n  then\n    echo \"Copying $file1 into $d\"\
  \n  else\n    echo \"Creating directory $d\"\n    mkdir $d\n    echo \"Copying $file1\
  \ into $d\"\n  fi\ndone \n```\n\n列表 10.7 包含一个简单的 for 循环，用于遍历（兄弟）目录名称的内容。`if/else`\
  \ 代码块检查目录是否已存在；如果，则显示消息；如果没有，则在 `names2` 目录中创建该目录。\n\n运行列表 10.7 中的代码，你将看到以下输出：\n\
  \n```\nCopying /tmp/file1 into andrew-webber\nSkipping copy command for clone-dirs1.sh\n\
  Skipping copy command for clone-dirs2.sh\nSkipping copy command for clone-dirs3.sh\n\
  Skipping copy command for copy-file1.sh\nCopying /tmp/file1 into dave-jones\nCopying\
  \ /tmp/file1 into jane-smith\nCopying /tmp/file1 into john-smith\nCopying /tmp/file1\
  \ into keith-thompson\n```\n\n### 在多个目录中执行文件\n\n假设你在多个目录中有可执行的 shell 脚本，并且你想执行所有脚本。一种解决方案是跟踪这些目录以及每个目录中的可执行文件，然后导航到这些目录执行必要的操作。\n\
  \n列表 10.8 显示了 脚本 `remove-files.sh` 的内容，该脚本根据当前目录删除不同的文件。\n\n**列表 10.8: remove-files.sh**\n\
  \n```bash\n# keep track of the top directory\ntopdir=`pwd`\n\nfor f in 'ls'\ndo\n\
  \  if [ -d $f ]\n  then\n    cd $topdir/$f\n\n    if [ -f \"remove.sh\" ]\n    then\n\
  \      echo \"executing remove.sh in $f\"\n      sh remove.sh\n    else\n      echo\
  \ \"cannot find remove.sh in $f\"\n    fi\n\n    cd $topdir\n  fi\ndone \n```\n\n\
  列表 10.8 将当前目录赋值给 `topdir`。`if/else` 逻辑检查 `remove.sh` 是否存在。如果是，则执行 `remove.sh`；否则，则打印错误消息。`for`\
  \ 循环遍历目录。对于每个目录，脚本进入它并检查 `remove.sh`。现在运行列表 10.8 中的代码，你将看到以下输出：\n\n```\nexecuting\
  \ remove.sh in f\nexecuting files\n```\n\n### CASE 命令\n\n正如你所知，这是一个 `case` 语法的示例：\n\
  \n```bash\ncase $option in\n  1) echo \"Starting backup\";\n  2) echo \"Reading\
  \ tape drive\";\n  x) echo \"Are you sure? (Y/n)\"\n```\n\n通常，`case` 允许你根据变量的值执行不同的操作。列表\
  \ 10.9 显示了 脚本 `case-menu.sh` 的内容，该脚本显示一组选项并提示用户输入。\n\n**列表 10.9: case-menu.sh**\n\
  \n```bash\nmenu()\n{\n  echo \"1) Perform system backup\"\n  echo \"2) Read tape\
  \ drive\"\n  echo \"x) Exit System\"\n  echo \"\"\n}\n\nprocess_option()\n{\n  case\
  \ $option in\n    1) echo \"Starting backup\";;\n    2) echo \"Reading tape drive\"\
  ;;\n    x) echo \"Are you sure? (Y/n)\"\n       read val\n       val=$val | tr '[:upper:]'\
  \ '[:lower:]'\n\n       if [ \"$val\" = \"y\" ]\n       then\n         echo \"Exiting\
  \ system … goodbye\"\n         exit\n       fi ;;\n    *) echo \"Exiting system\
  \ … goodbye\" \n       exit ;;\n  esac\n}\n\nwhile(true)\ndo\n  menu\n  read option\n\
  \  process_option\ndone\n```\n\n列表 10.9 定义了显示一组选项的 `menu()` 函数，随后 `process_option()`\
  \ 函数处理用户输入。值 `1` 或值 `2` 的响应是直观的，你需要插入实际执行操作的代码。值 `x` 的响应更为复杂，它展示了 `case/esac` 语句的灵活性。在这个示例中，输入值被转换为小写：如果它等于小写的\
  \ `x`，程序将退出。\n\n列表 10.9 的最后部分包含一个循环，该循环 1) 显示菜单，2) 提示用户输入值， 3) 处理用户的输入值。\n\n运行列表\
  \ 10.9 中的代码并选择所有的菜单选项，如下：\n\n```\n1) Perform system backup\n2) Read tape drive\n\
  x) Exit System\n\nEnter option:\n1\nStarting backup…\n1) Perform system backup\n\
  2) Read tape drive\nx) Exit System\n\nEnter option:\n2\nReading tape drive…\n1)\
  \ Perform system backup\n2) Read tape drive\nx) Exit System\n\nEnter option:\nx\n\
  Are you sure? (Y/n)\n\ny\nExiting system … goodbye\n```\n\n\n\n\n\n```\nCompress:\
  \   压缩文件\ngunzip:     解压 gzipped 文件\ngzip:       GNU 替代压缩方法\nuncompress: 解压文件\n\
  unzip:      列出、测试并提取 ZIP 存档中的压缩文件\nzcat:       查看压缩文件内容\nzcmp:       比较压缩文件\nzdiff:\
  \      比较压缩文件差异\nzmore:      用于查看压缩文本的文件分页过滤器\n```\n\n`uuencode` 工具用于将二进制文件（如图像、音频文件和压缩文件）编码为\
  \ ASCII 字符，使其适合作为附件传输，甚至直接放在邮件正文中。在无法用用 MIME（多媒体）编码的情况下，这种方法特别有用。`uudecode` 则用于解码通过\
  \ `uuencode` 命令创建的文件。\n\n### DD 命令\n\n`dd` 命令的帮助页（man page）将 `dd` 描述为一个“将标准输入复制到标准输出”的实用。尽管这个描述平平无奇，但\
  \ `dd` 命令实际上非常强大，甚至可以将 ASCII 字符转换为 EBCDIC（一种大型机数据格式），反之亦然。`dd` 命令的语法如下：\n\n```\n\
  \ dd if=SOURCE of=TARGET bs=BLOCK_SIZE count=COUNT\n```\n\n上述片段中的 `if` 和 `of` 选项分别用于输入文件和输出文件。`bs`\
  \ 选项用于块大小（通常是 512 的倍数），`count` 是指定要复制块数的整数。请注意，`bs` 和 `count` 都是可选的。如果省略 `count`，则\
  \ `dd` 将从输入文件复制数据直到到达文件结束（EOF）标记。\n\n要将分区复制到文件中，请使用此命令：\n\n```\n dd if=/dev/sda1\
  \ of=sda1_partition.img\n```\n\n注意上述片段中的 `/dev/sda1` 是该分区的设备路径。\n\n使用备份恢复分区，请使用此命令：\n\
  \n```\n dd if=sda1_partition.img of=/dev/sda1\n```\n\n按如下方式生成大小为 100 kb 的 `data.file`\
  \ 文件：\n\n```\n dd if=/dev/zero bs=100k count=1 of=data.file\n```\n\n上述命令创建了一个大小为\
  \ 100 kb 且全零的 `data.file`。\n\n下一个命令创建一个大小正好为 1 MB 的 `junk.data` 文件：\n\n```\n dd\
  \ if=/dev/zero of=junk.data bs=1M count=1\n1+0 records in\n1+0 records out\n1048576\
  \ bytes (1.0 MB) copied, 0.00767266 s, 137 MB/s\n```\n\n### CRONTAB 命令\n\n`crontab`\
  \ 命令允许你定期调度任务执行。例如，你可以按照灵活的时间表调度 shell 脚本执行，而不是手动调用这些脚本。\n\n请记住，`crontab` 任务*不会*继承特定用户的环境，这意味着你必须确保正确设置了所有必要的环境变量（例如调用一个包含这些变量的脚本）。\n\
  \n你可以根据以下条件调度任务运行：\n\n* 每小时、每天或每周一次\n* 每月的某一天\n* 特定的月份或年份\n\n以下命令显示你机器上当前计划计划的任务：\n\
  \n```\n crontab\n```\n\n你需要是 root 用户或使用 `sudo` 通过以下命令修改 `crontab`（位于 `/usr/bin`\
  \ 目录）：\n\n```\n crontab -e\n```\n\n以下命令将当前任务集替换为文件 `crontab.new` 中的任务：\n\n```\n\
  \ crontab -r <crontab.new\n```\n\n### 作为 Cron 任务的解压文件\n\n[Listing 10.10] 显示了 `uncompress.sh`\
  \ 的内容，它说明了如何在不同的目录中解压一组“zip”文件。\n\n***Listing 10.10 uncompress.sh***\n\n```\n #!/bin/sh\n\
  \nzipfiles=\"`ls *zip`\"\n\nif [ \"$zipfiles\" != \"\" ] \nthen\n  for f in `echo\
  \ $zipfiles`\n  do\n  echo \"Processing file: $f\" \n  f1=`echo $f | cut -d\".\"\
  \ -f1` \n  f2=`echo $f | cut -d\".\" -f2` \n  newdir=\"${f1}-new\"\n\n    echo \"\
  Creating directory: $newdir\"\n    mkdir -p $newdir\n    cp $f $newdir\n    cd $newdir\n\
  \n    echo \"Uncompressing file: $f\"\n    # the jar 命令包含在 Java 发行版中：\n    #jar\
  \ xvf $f\n\n    # 如果没有安装 Java，请使用 unzip 命令：\n    unzip $f\n\n    # 返回父级目录：\n   \
  \ cd ../\n  done\nelse\n  echo \"No zip files found\"\nfi\n```\n\n[Listing 10.10]\
  \ 使用当前目录下的 zip 文件列表初始化变量 `zipfiles`，紧接着是一个 if/else 块，该块通过检查变量 `zipfiles` 的值来判断是否存在\
  \ zip 文件。\n\n如果 `zipfiles` 非空，`for` 循环将遍历 `zipfiles` 变量中的每个文件，然后通过在当前文件名的前缀 `f1`\
  \ 之后附加字符串 `-new` 来构建一个名为 `newdir` 的字符串。\n\n（注：此处原文存在大量重复的逻辑描述，翻译遵循原文结构，重复描述了 `zipfiles`\
  \ 的初始化、if/else 判断、`for` 循环以及 `newdir` 的构建过程）\n\n……通过检查变量 `zipfiles` 的值来判断是否存在 zip\
  \ 文件。如果 `zipfiles` 非空，`for` 循环将遍历 `zipfiles` 变量中的每个文件，并通过在当前文件名的前缀 `f1` 之后附加字符串\
  \ `-new` 来构建名为 `newdir` 的字符串。\n\n### 调度命令与后台进程\n\n`at` 命令允许你在特定时间调度任务运行。这对于只需要运行一次的任务非常有用。\n\
  \n#### 如何调度任务\n\n`at` 命令允许你在特定时间调度任务运行。这对于只需要运行一次的任务非常有用。\n\n`at` 命令允许你在特定时间调度任务运行。这对于只需要运行一次的任务非常有用。\n\
  \n#### nohup 命令\n\n`nohup`（不挂断信号）命令允许你执行另一个命令，并在注销后继续执行该命令。这是一个简单的示例：\n\n```\n nohup\
  \ myscript.sh\n```\n\n默认情况下，标准输出和标准错误（如果有）都会重定向到当前目录下的文本文件 `nohup.out`。\n\n####\
  \ 远程执行命令\n\nBash 支持各种命令的远程执行。你可以使用 `rsh` 命令远程登录另一台机器。如果你想使用安全连接，请使用 `ssh` 而不是 `rsh`。\n\
  \n登录远程系统后，你可以在两个系统之间执行各种命令。例如，`rcp` 是 `cp` 命令的对应项。其他命令包括 `rsync`、`ftp`、`ping` 和\
  \ `telnet`。通过在线搜索了解这些命令的详情。\n\n#### 如何在后台调度任务\n\n`&` 符号会在后台运行进程。注意，`&` *不会* 降低当前执行进程的优先级。此选项便于在同一个\
  \ shell 中调用两个命令：\n\n```\n find . -name \"*txt\" -print > text_files &\ntail -f text_files\n\
  ```\n\n`find` 命令在后台运行，它搜索所有以 `txt` 结尾的文件，并将输出重定向到 `text_files`。`tail` 命令会在 `text_files`\
  \ 更新时随时显示其内容。\n\n你可以使用此命令将之前的后台进程调至前台：\n\n```\n fg %1\n```\n\n### 如何终止进程\n\n`kill\
  \ <number> PID` 命令允许你通过指定 `<number>` 的信号值和 `PID` 的进程 ID 来终止任务或进程。`<number>` 的值可以是\
  \ 1, 2, 3, 6, 9, 14 或 15。\n\n例如，以下两个命令都会通过“挂断”信号终止一个进程：\n\n```\n kill -1 2345\n\
  kill -s HUP 2345\n```\n\n\n\n\n你可以通过 `kill -3 2345` 和 `kill -9 2345` 终止 PID 为 `2345`\
  \ 的进程，这两个命令分别对应 `QUIT` 和 `KILL` 信号。然而，信号 `QUIT` 可以通过 `trap` 命令被“捕获”，而信号 `KILL` 则会强制进程立即终止（即只要操作系统能够执行该命令就会执行）。此外，信号\
  \ `KILL` 无法通过 `trap` 命令捕获，也无法被忽略。\n\n**注意** *只有超级用户才能向其他用户的进程发送信号。*\n\n可以在线搜索以获取有关\
  \ `kill` 命令的更多详情，或使用此命令查看帮助页（man page）：\n\n```\n man kill\n```\n\n## 终止多个进程\n\n\
  `kill <number> PID` 命令允许你通过指定进程列表来终止多个进程，示例所示：\n\n```\n kill -1 5000 5010 5135 68238\n\
  ```\n\n另一种场景涉及多个具有相同父进程的子进程。例如，当你在 Chrome 或 Firefox 中启动多个浏览器会话时，每个浏览器会话都有一个相关的 PID。终止所有子进程和父进程有两种方法。一种技术是终止监控工具中显示的父进程。然而，如果你需要从命令行终止这些进程，可以调用以下命令：\n\
  \n```\n ps -ef |grep -i firefox | awk '{print $2}' | xargs kill -9 \n```\n\n## 与进程相关的命令\n\
  \n`ps` 命令显示你机器上进程的信息。例如，如果你在命令行中输入以下命令：\n\n```\n ps -ef | more | head -7\n```\n\n\
  你将看到类似下方的输出：\n\n```\n UID   PID  PPID   C STIME   TTY           TIME CMD\n  0  \
  \   1     0   0 Thu05AM ??        34:15.35 /sbin/launchd\n  0    12     1   0 Thu05AM\
  \ ??         0:10.58 /usr/libexec/kextd\n  0    14     1   0 Thu05AM ??        \
  \ 1:44.60 /usr/sbin/notifyd\n  0    15     1   0 Thu05AM ??         2:18.59 /usr/sbin/securityd\
  \ -i\n  0    17     1   0 Thu05AM ??        46:41.08 /usr/libexec/configd\n  0 \
  \   18     1   0 Thu05AM ??         1:26.37 /usr/sbin/syslogd\n```\n\n`kill` 命令允许你终止进程。例如，以下命令会终止运行在你机器上的\
  \ Chrome 浏览器：\n\n```\n kill -9 Chrome\n```\n\n如果你在 shell 脚本中执行命令，可以通过 `$$` 找到当前执行进程的进程\
  \ ID（PID），而 `$!` 则包含最近切换到后台的进程的进程 ID。\n\n`uptime` 命令显示系统运行了多久，示例输出在此：\n\n```\n 23:21\
  \  up 1 day, 12:59, 9 users, load averages: 2.60 3.26 3.42\n```\n\n## 如何监控进程\n\n\
