  md: '# 2.2.3 More Presents


    As you can tell from the preceding discussion, KDE is not about hours, days, months,
    or years writing code. Instead, the focus is on the structure, Session Management,
    and savable configuration of the application. So far, we''ve yet to discuss Session
    Management or savable configuration issues. That''s not about change.


    Under Session Management, the internal state of the program (loaded, edited, or
    created files) as well as the exterior state of the program (where and on which
    desktop the program''s window(s) has been opened) are saved at the termination
    of KDE. When KDE is started the next time ("Session”), the Window Manager will
    restore the correct state of the program at the correct desktop and at the exact
    location.


    This means that a text editor will be loaded with the correct file (maybe with
    changes that hadn''t been saved yet) on the desktop at the next session. Try it
    with the KDE_editor KWrite.


    It really works! Clearly, the application programmer must save the inner state
    of the program correctly by himself. How exact that state is saved is left to
    the programmer. K remembers where the cursor was, for example: Chapter 7, "Session
    Management," discusses this in more detail.


    The other present is savable. It means we can make our program configurable and
    save the configuration at the termination of the program. Everything can be saved
    from the size of the window to very program-specific things such as the preferred
    drawing tool (pen, brush, spray can) in a drawing program. The corresponding settings
    load at the next start of the program.


    After the programmer arranges to save the settings, he doesn''t have to monitor
    that save; KDE will save the configuration settings. By the time KTp has properties
    that are worth saving, we will discuss this in more detail (see Section 5.2, "KConfig").


    # 2.3 Signals and Slots


    Finally, we''re one of the most interesting features that Qt provides. This time
    KDE has nothing to do with it. The concept of signals and slots is completely
    realized in Qt. KDE just uses it.


    What happens if the user presses the N key or clicks the left mouse button, but
    X sends an event that says something like "N pressed" or "Left mouse button pressed
    at position 228, 175." With this information, the application programmer could
    hunt down the widget where the mouse was pressed. This would be an unbelievably
    boring task and could produce tons of errors in the source code, not to mention
    all the time that it would'
