    \ the data. That's why we create the data of type double on the heap, assign the\
    \ correct value to it, and insert it into the list by calling QList::append().\
    \ We don't have to handle the freeing of the memory because we told QList to take\
    \ care of it by itself. Finally, receivedValues have been incremented. The Graph\
    \ won't know how much data has been received unless we increment it.\n\nAll widgets\
    \ inherit the virtual method paintEvent() from QWidget, which does nothing in\
