- pgno: 48
  md: "and 100 times, and then use the best result. With the speed at which the algorithm\
    \ performs, this is not a problem.\n\nAt the beginning when the water level is\
    \ at its lowest, GDA can move freely within the solution space. As the waters\
    \ ascend over time, however, GDA will be forced to move up the hills and finally\
    \ onto a peak. The critical phase is the middle one, when GDA starts to move up\
    \ a mountain range. If the water level is high enough, GDA won't get down again.\
    \ Here's where it's important not to get fooled by our three-dimensional imagination.\
    \ In high-dimensional spaces, there are many ways to get from one point to the\
    \ other (in this case, from mountain to mountain, or from peak to peak). The chances\
    \ are extremely rare that GDA will find itself on a low mountain in the middle\
    \ phase and only finds ways to get the water to the other mountain(s). The probability\
    \ states that it's likely that there are “dry waves.” Only at the end, when only\
    \ the highest peaks are above water, will GDA's movement be seriously restricted.\
    \ At that point, the motto becomes: Go For It!\n\nThe rest of this book could\
    \ focus on optimizing solution spaces that can confuse any conceivable, but that's\
    \ not necessary; the literature is full of them. This is not a book about optimization\
    \ algorithms or malicious spaces posing exceptionally big challenges for optimization\
    \ algorithms. This book sticks to the assumption that problems coming from practical\
    \ applications normally have good-natural solution spaces. By the way, we can\
    \ test the quality of GDA by ourselves when KTSp finally does something.\n\nWe\
    \ can sketch a cycle of GDA in pseudo code:\n\n```\nchoose a random initial solution\
    \ currentSolution;\ninitialize the rain speed rainSpeed > 0;\nset the initial\
