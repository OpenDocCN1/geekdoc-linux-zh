- pgno: 24
  md: '# The First KDE Program: KTsp


    Okay, enough talk. Let''s write something. It''s time to create your first KDE
    program. First, create the kde directory in your home directory and copy ktsp-0.0.1.tgz
    into it. You can decompress the archive with


    ```

    tar -xvf ktsp-0.0.1.tgz

    ```


    Change to the directory kde/ktsp-0.0.1 and enter the following sequence of commands:


    +   - /configure

    - make!

    - make install


    No errors should occur while compiling, linking, or installing; therefore, you
    can instantly test your handiwork. First click on K, and then click on Panel.
    The panel will re-initialize its menu items. You can now find the TSP Optimizer³
    under K, Applications. Click on it. After a short time, the main window of KTsp
    displays onscreen, as shown in Figure 2.1.


    ![](img/45a3abfe173d274ae06c571b14950e5b_24_0.png)


    Figure 2.1 The KTsp''s main window (version 0.0.1).


    > ¹ If you are a bit short of RAM, this might take quite a long time to compile
    (especially as the program becomes more complex).


    > ² If KDE is installed system wide, and not just in your home directory, KTsp
    will also be installed for the whole system. To do this, you must have root rights.


    > ³ Later you will learn how to get items for all the KDE-supported languages.'
