- pgno: 156
  md: '# 8


    # Localization


    For a program to gain universal acceptance, it''s not enough to just write the
    source code and “kill” the bugs. Users, as the word implies, must be able to use
    the program and, further, they must feel “at home” with it. KDE helps meet those
    conditions in a big way. It provides the programmer with a base framework from
    which to create easy-to-use and consistent environments.


    KDE provides a significant advantage over the confusing number of different GUIs
    in X. Users who have learned to operate a KDE program won''t have a problem with
    other programs either. Something important is still missing, however, such as
    the language. Generally, this is a good compromise. Sometimes, however, it isn''t
    so good. Consider, for example, a program such as a word processor that is supposed
    to have wide recognition. Consider further a Brazilian secretary who would have
    to learn all the relevant English words to use the word processor (font type,
    size, and so on). I don''t think she would really appreciate it. And what about
    the Egyptian musician who wants to use the KDE score editor? English is probably
    not one of his strengths


    The program will make the user feel “at home” only if it''s supporting his native
    language. That''s why one of the first goals of KDE is to support as many languages
    as possible. We want to use this property for KTsp.


    # 8.1 KDE Supports More Than 30 Languages


    At the printing of this book, KDE supported more than 30 languages, including
    exotic ones and hard ones such as a simplified Chinese. The internationalization
    was based on this ideal: Users who neither want to read the source code nor compile
    it after the translation should be able to translate KDE to their native language.


    This goal specified that internationalization (preparing for translations) and
    localization (the actual translation) must be strictly divided. We have'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Chapter 8: Localization


    already taken care of the internationalization in KTsp twice. First, we enclosed
    all strings with `i18n()`. This macro will not only make sure that all output
    appears in the correct language when the translations are available, it will help
    us extract all strings from the source code. Second, we prepared all the widgets
    for different-sized texts by using layout managers. The last step for the internationalization
    was to extract the texts from the source code.


    This part, the internationalization, has to be done by the programmer. There''s
    only one thing left to do; he has to find a translator. The program—it doesn''t
    matter whether in source or binary format—will be released with the extracted
    texts. The user can provide the translations (in other words, localization).


    This method has a significant advantage over other methods. The Icelandic Ministry
    of Education, for example, demands that all software in schools be available in
    Iceland. A well-known software refuses to provide the translations because the
    market is too small to generate a profit. Because of this decision, local KDE
    users began to translate KDE. The KDE internationalization model makes it possible
    for small groups to translate into their native language as long as users are
    willing to do so.


    # 8.2 The Translation


    The two most important tools we will use are the programs xgettext and msgfmt.
    First, we need to find the file with all the extracted texts. Let''s change into
    the directory of our source (ktsp-0.1.0/ktsp) and enter the following command:


    ```

    xgettext -a -C -ki18n -s -d ktsp *.C

    ```


    The options are as follows:


    +   -a All texts.

    -C Recognize C++ comments.

    -k The expression i18n specifies the beginning of a text.

    -s Sort the texts and delete copies.

    -d Name the result ktsp.po.


    At the end, `.C` instructs xgettext to search all files with the ending C for
    texts. After doing so, we get a file that looks like this:


    ```

    # ktsp.C:181

    msgid "&Graphic Preferences..."

    msgstr **

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 8.2 The Translation 143


    ```

    # ktsp.C:119

