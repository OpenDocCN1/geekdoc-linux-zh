  md: '# 6

    KTsp Matures


    It''s time to give KTsp more functionality. In this chapter, we add the standard
    functions of a KDE program to KTsp.


    # 6.1 Progress Indicators for “Long” Actions


    If the computer needs more than a few seconds to do something, the user should
    be informed about the current progress. It''s extraordinarily frustrating for
    users to sit in front of a “silent” computer without knowing whether the program
    has crashed or why it isn''t doing anything (or at least “seems” to be doing nothing).
    For actions that take some time, you can set up a dialog box to give progress
    feedback by using QProgressDialog.


    ![](img/45a3abfe173d274ae06c571b14950e5b_114_0.png)


    Figure 6.1 A QProgressDialog.


    To get an idea about how this all works, set a large number of points in Preferences,
    TSP Preferences. When you start the program, quite a long time will pass before
    the actual optimization begins. As currently set, we do inform the user about
    the point from which we are currently calculating the neighbor, but that''s not
    enough. We want to make the whole thing more user friendly, and we can do so using
    QProgressDialog.


    Install ktsp-0.0.7.tgz from the New Riders website. Configure KTsp for 1000 points
