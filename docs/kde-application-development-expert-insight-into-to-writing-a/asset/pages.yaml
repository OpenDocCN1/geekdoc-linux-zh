- pgno: 186
  md: '# 13

    Becoming a Part of KDE


    KDE is more than just another freeware project. KDE is an international team of
    programmers creating the new standard desktop for UNIX in general and Linux in
    particular. What began as a small group of undunted people is now a worldwide
    band of programmers, system administrators, artists, translators, and users.


    As you might already think, such a diverse group creates problems. Artists see
    things differently than programmers most of the time; translators need other time
    frames for their work than the programmers who want to release their code as fast
    as possible. The creators of KDE came from different cultures. Sometimes communication
    hits rough patches when someone understands something as rude, although the other
    one did not mean it that way.


    The diversity of the personalities and cultures, which come together in KDE, provides
    a big advantage going far beyond a technical advantage. Those who actively take
    part in KDE make new friends from totally different backgrounds and surroundings.
    Not all communication is about technical questions, although it is in the foreground.


    Naturally, every programmer can take part in developing applications without taking
    part in the discussions about KDE. No one will force you to become a part of the
    community. If you don''t, however, you will lose the possibility to influence
    the further development of KDE or to get help.


    # 13.1 The Mailing Lists


    The mailing lists are the cornerstone of the communication possibilities of KDE.
    They''re listed under www.kde.org/contact.html. The most important list for programmers
    is kde-devel@kde.org. Hundreds of developers discuss their projects, their difficulties,
    and their strategies on this list. You can find an archive of all KDE-related
    lists at http://lists.kde.org.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The spectrum goes from “Why doesn’t the following piece of code code compile
    correctly?” to “The class XY wastes tons of memory!”, and to “Here’s a design
    for our interface to databases. Especially for programmers who write their first
    project, this list is an inexhaustible treasure chest. Before you ask a question
    that''s already been asked 199 times, you should take a look in the lists’ archives
    to see whether or not you can find the answer.


    The language of lists is English, although most people do not speak English as
    their native language. Please keep this in mind. If it seems that somebody is
    rude, please remember the language differences. The “rudeness” might just be a
    misunderstanding, without a slight ever being intended.


    You can sign up for this list by sending an email to kde-devel-request@kde.org
    with “subscribe joe@mydomain!” on the subject line. Because this information might
    have changed since the time of your writing, it''s always better to take a look
    at the Web site for any updated information. Shortly after we get your email address,
    you''ll receive the first mailing from list. Please abstain from asking user questions
    on kde-devel@kde.org. This list is for developers. You have other lists from which
    you can ask things like “How do I configure my panel so it’s not at the bottom?


    There’re special lists for big projects like KOffice. If you want to work on these
    projects, you should sign up for the corresponding lists. The Web site names all
    the lists and is more current than this book.


    # 13.2 The Newsgroups


    Two KDE newsgroups exist, a German one and an international (English) one:


    +   - de.alt.comp.kde

    - comp.windows.x.kde


    Users are the majority participants in these newsgroups, but programmers also
    find them interesting. Programmers often answer user questions through the newsgroups,
    and also find feedback from other users regarding various problems, including
    misunderstood functions. These responses are useful because users have another
    understanding of “easy to use” than programmers do. If you don’t just want to
    read, but also to post answers, you should stick to the corresponding language.


    > Of course, you have to replace this email address with your own.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'A new newsgroup specific to KDE development is being discussed. It would be
    located at comp.windows.x.kde-devel or similar (check the Web site). Because setting
    up a newsgroup involves a lot of work and voting in the Usenet (the “newsgroup
    part” of the Internet), I can''t say right how soon this new newsgroup might become
    available. If you come across a vote on this issue while perusing the KDE mailing
    lists, please take note.


    # 13.3 The IRC Channel


    For fast communication without the delay of email, you can use the Internet Relay
    Chat (IRC) channel for KDE on the server .kde.org. The channel is #kde. Most of
    the time, the mailing lists offer the better way to communicate because of the
    different time zones around the globe. Sometimes you need a fast response, however,
    and that’s what the channel is for.


    # 13.4 CVS


    An introduction to the Concurrent Versions System (CVS) would go far beyond the
    scope of this book. CVS is a system to save different versions of documents in
    a central repository. It is an additional layer to the known Revision Control
    System (RCS) and provides methods to solve conflict created by many developers
    working on the same source.


    The complete code for all libraries and applications in the official releases
    of KDE and some other applications can be found in a CVS Repository on the server.
    As long as you are writing a program for KDE, you only need to bother with CVS.
    If you work on the base of KDE, or on the Killer-Application everyone wants to
    have and needs to become a part of the official releases of KDE, you’ll need access
    to the CVS server. Stephan Kulow (kool0@kde.org) is the coordinator of this server.
    He’s the one to contact if you need full access to this server. My hint: First,
    start to program for KDE. CVS has time.


    # 13.5 FTP


    The software needs to get to the users. Besides the CDs of the Linux distributions,
    this is mainly done by downloading it from FTP servers. Numerous servers around
    the world distribute the load. The Web site www.kde.org/mirrors.html provides
    information about these servers.


    If you have decided to release a version of your KDE program, it has to be uploaded
    to this network of servers. The corresponding server upload.kde.org. To keep the
    usage at a low level, this is not a download server.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Load your software via FTP to upload.kde.org/kde/Incoming. It will be copied
    to the correct directory over a semi-automatic process. It works only if you''ve
    uploaded a correct LSM file. A current template for a correct LSM file can be
    found at http://ftp.kde.org/kde/Incoming/ØLSM.README. It might appear to be complicated,
    but it''s necessary for the fields in the semi-automatic copy process. If you
    have doubts about the fields you fill out the Primary Site line very carefully
    and specify where you- take a look at some of the other LSM files. It''s important
    that your program should be copied. You can direct your questions to ftpmaster@kde.org.
    When everything is finished, your package will be copied and distributed over
    the other FTP servers. How long it takes depends on the workload on upload.kde.org.
    If the distribution of the package begins, the server will generate an announcement
    from your LSM file and send it to the mailing list kde-announce@kde.org.


    2 LSM stands for Linux Software Map.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 14

    nThe Future of KDE


    The future has already started. While programmers, artists, and translatorsnprepare
    KDE 1.1.2, the development of KDE 2.0 is already in the works.

    The enormous success of KDE has actually accelerated the development of

    DE and not slowed it down. Many things will change in KDE, including

    even the basic technology. (How radical!)


    # 14.1 KOM


    The K Object Model/OpenParts (KOM/OP) is a component layer over the

    Common Request Broker Architecture (CORBA). This object model

    is not new in the sense that it is being developed for KDE 2.0. KOffice

    has based on it for more than a year now, and after intensive development\and
    testing, it''s time to change KDE to the new technology.


    KDE won''t consist of single applications, but more so of single compon-

    nents can be built together into an application. Let''s say that KMailnn an email
    with an MP3 attachment. The current technology gives

    KMail three possibilities:


    +   1. It can ignore or ask whether it should be saved.

    2. It can be linked with a library being able to deal with MP3 files and

    play the data with this library.

    3. It can start an MP3 player and pass the data to it.


    While the first possibility is more like “I can''t deal with this,” 2 and 3 are

    very inflexible. In the second case, KMail—or better yet, the developers-

    would have to know all possible kinds of data that could occur in mail

    attachments and link the program against an unreasonable number of'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Chapter 14: The Future of KDE


    libraries. In the third case, KMail has to know about the MP3 players installed
    on the system.


    The solution is much easier with CORBA and KOM/OP. KMail notices viaimetypes that
    the data is of the type MP3, and therefore needs an MP3 player. It requests the
    service of such a player from the KDE-Trader. The corresponding player (if there
    is one) will be started, embedded in KMail, and will play the data. From the user''s
    view, it looks like the player is a part of KMail, although in reality it''s a
    totally different application or component.


    This approach leads to significantly better flexibility than the current technology.
    At the time when the program is being compiled and linked, it doesn''t need to
    know about the services it has to provide. Actually, this type of service doesn''t
    even have to exist at this point. All that is needed is one or more methods to
    determine the service type, and a method that asks the KDE-Trader for such a service.
    On the other hand, every component that provides a service must register itself
    with the Trader like this: "I can display JPEG." Then every other component can
    request this service. Because the registration of a service is done at the installation,
    services from the offering component (which isn''t running) can be used as well.


    If this method is used correctly, it not only leads to greater flexibility, but
    also to smaller applications because properties can be distributed over other
    components.


    # 14.2 KOffice


    KOffice is a new suite of office applications that range from a word processor
    (KWord) to a spreadsheet application (KSpread) to a vector graphics program (KIllust).
    KOM/OP has been developed parallel to KOffice. KOffice uses this technology more
    than all the other programs in KDE do.


    Every single KOffice application is an OpenPart and can embed all the other ones
    as well as be embedded in them. Although all the programs that make up KOffice
    are powerful applications by themselves, their real strength comes from working
    together. If you take a look at http://kde.org, you''ll see the high level at
    which KOffice is already and how much KDE stands to to gain through KOM/OP.


    +   - KWord Word processor

    - KSpread Spreadsheet application

    - Katabase Database

    - KPresenter Graphics presentations'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 14.3 When Is KDE 2.0 Going To Be Released?


    +   - KIllrator Vector graphics program

    - KFormula Formula editor

    - KDiagram Create diagrams

    - KImage Display pictures


    Although some of these parts of KOffice are still in their preliminary stages,
    other ones such as KWord, KSpread, and KPresenter are already advanced, but still
    unsuitable for end users at the time of this writing.


    All KOffice programs use the standard XML file format. This way, avoid the obscure
    and mostly proprietary file formats and head into a future of open standards.
    A filter manager for import and export filters for other formats already exists.


    # 14.3 When Is KDE 2.0 Going To Be Released?


    Just as with all freeware projects, it’s hard to answer this question. The development
    is going very fast, but something like the complete Office suite isn’t produced
    overnight. Because KDE is based on a completely new technology, it will have to
    go through long beta cycles.


    KDE’s plan is to start with the beta cycles in the last quarter of 1999 and to
    release the final KDE 2.0 and KOffice 1.0 in the first half of the year 2000.
    Unlike the programmers of commercial software, freeware developers don’t have
    marketing deadlines. The software gets released when it is finished.


    Those who want to develop stable applications based on a reliable desktop must
    trust KDE 1.x, which will stay the standard desktop of Linux for quite a while
    to come.


    The actual dispute—whether the computer desktop will remain hostage to the monopoly
    of proprietary software—won’t really begin before KDE 2.0 is released.'
  merge: -1
  img_proc: true
