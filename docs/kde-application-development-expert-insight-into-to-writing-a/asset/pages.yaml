- pgno: 16
  md: '# Why KDE?


    Some may ask why we have decided to use the KDE Desktop Environment (KDE). The
    most important reason is because KDE isn''t just another library of widgets. Because
    a program based on the KDE “looks” quite similar to all the other KDE programs,
    the average user can find his way through it very quickly. In addition, KDE applications
    can communicate with each other very easily. They also benefit from the Window
    Manager''s (kwm Session Management). It is also possible to drag and drop between
    KDE applications.


    To compete in the marketplace, developers must offer end users something-advantageous,
    always something new. Although some developers get trapped on the user-expectation
    treadmill, many others are bit lazy. (It''s not a disgrace to admit to it). The
    sentence “Good programmers write good code” has its justification. The developer
    who wants to write many useful and easy-to-use programs has to steal as much as
    possible. KDE offers the best conditions for just such stealing, and actually
    makes the theft legal.


    KDE is based on Qt, the class library from the Norwegian company Troll Tech (www.troll.no).
    Qt contains a repertoire of widgets and other classes. KDE itself contains widgets
    and other applications that programmers can use. For example, KDE''s HTML-based
    Help system is available for free every single program. Menus, toolbars, and statusbars
    are also available, and require very little developer input. And let''s not forget
    the File Selector, kfile; it''s hard to beat.


    > ¹ Session management makes it possible for applications to save their internal
    state if KDE crashes or quits for some other reason. Upon the next start of KDE,
    the Window Manager loads the applications with the exact same state.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter I: Why KDE?


    And finally, although a KDE program just automatically looks good and serious,
    that''s not the most important factor or consideration. In the end, what is most
    important is that the Trolls² eliminated one of the most annoying sources of errors
    in the development of a complex program, Callback function (discussed in greater
    detail later).


    All in all, KDE makes it possible to write software very quickly. This book identifies
    KDE''s most significant advantages and explains how to use them.


    # 1.1 Oh, That''s C++


    Yes! ... and your point? Don''t let C++ scare you away. Actually, I could leave
    it at that, but I feel compelled to reassure you C++-phobes with these four calming
    words: It''s not that hard. If you know C, C++ should be a breeze (or at least
    not much of a problem at all). The Trolls included some very useful tutorials
    with their Qt library. The tutorials provide a good introduction to Qt programming.
    For the programmer, these tutorials also show how programs can be successfully
    developed with C++.


    The program that we will develop together through the course of this book demonstrates
    just basic techniques. There is, however, a whole world of object-oriented design
    and object-oriented programming out there; but it is beyond the scope of this
    book. To learn more about C++, check out The C++ Programming Language (Addison-Wesley),
    by Bjarn Stroustrup. To learn a few tricks and tips, try More Effective C++ (Addison-Wesley),
    by Meyers.


    KDE was not written in C++ just to ape fashions. Instead, KDE''s more than one
    million lines of code significantly influenced the decision to use C++. Such complex
    tasks are much easier to solve in C++ than in C. C++ has definitely speedy KDE''s
    evolution, from its first release 18 months ago to the fully usable 1.0 version
    now available.


    # 1.2 Introduction


    Anyone who wants to develop programs for X faces many possibilities.


    It is possible, of course, to develop a program based specifically on Xlib and
    its extensions. That''s the way "but-what-if men" go—those who can''t help but
    to tinker. Others of us (and I am including myself in this


    > ² Trolls is an amusing appropriate term that refers to those who work at Troll
    Tech.


    > ³ I am not a C++ fanatic. No, definitely not. If I had my choice, I would prefer
    a language that enforces object-oriented programming. C++ is a viable compromise;
    however, it builds on the solid base, while incorporating elements of object-oriented
    programming.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.3 Conditions


    description) are a little lazy; We want to put the seat belt on and just drive
    the car from Point A to Point B; we don''t even want to think about all the possibilities
    and exigencies.


    Even so, we face the dilemma of an enormous number of libraries and widget collections:
    Tel/Tk, XForms, Motif, to name just a few.


    # 1.3 Conditions


    By the time this book hits the shelves, all current Linux distributions in the
    United States should contain all components necessary for the development of a
    KDE program. If a component is missing in a recent distribution, alert your distributor
    and/or change your distribution. Those who have personally compiled their Linux
    system most likely need to install additional components or change to a newer
    version.


    # 1.3.1 X


    KDE is a graphical user interface (GUI) and runs under X. This means that X must
    be installed. To use KDE, you need the corresponding libraries for your graphic
    card and the corresponding X server installed.


    Unfortunately, meeting this minimum requirement to use KDE does not enable you
    to develop KDE programs. The X header files must exist, too. It is important,
    therefore, to determine whether they exist. You can check by entering the following
    command:


    ```

    ls /usr/X11/include/X11/X.h

    ```


    If the file X.h displays successfully, you can assume that the header files are
    installed.


    If X.h does not display, you must use X to install the headers. How you do this
    depends on the Linux distribution being used. Consult the Linux Manual for instructions.


    # 1.3.2 Qt 1.42


    The examples in this book were developed based on Qt 1.42, but were tested with
    Qt 1.44. Therefore, later versions (before 2.0) should function without any problems.
    If Qt isn''t installed on your system, you can download it from the ftp://ftp.troll.no/qt/source.
    The README file included in Qt explains how to compile and install Qt.


    # 1.3.3 KDE 1.1


    KDE 1.1 (or a newer version before 2.0) is available on the KDE FTP server (ftp://ftp.kde.org/pub/kde/stable).
    You can find precompiled packages for many systems on the server. In my opinion,
    however, KDE developers'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'should download the source and compile it. That way, if any problems arise,
    you can take a look directly at KDE’s source code. Who knows, maybe you will be
    the lucky person who discovers the bug in KDE that no one has found before.


    # 1.3.4 Compiler


    All examples in this book have been compiled with egcs-1.0.2. New versions of
    egcs should work fine, too. Your Linux distributor should have a current version
    of egcs. According to information from third parties, gcc-2.8.0 can also be used.


    # 1.3.5 Automake


    Automake version 1.3 has been used. You should be able to get a newer version
    from your Linux distributor.


    # 1.3.6 Autoconf


    Autoconf 2.12 was used to create all the configure files in this book. Again,
    you should be able to get packages with newer versions from your Linux distributor.


    # 1.4 Help!


    No human can memorize the whole Application Programming Interface (API) of a development
    environment. Thank goodness, therefore, that it is not necessary with KDE. Both
    KDE and the underlying class library, Qt, are delivered with excellent online
    Help.


    # 1.4.1 Qt Online Help


    The location of the Qt Help on your system depends on the Linux distribution being
    used. The correct directory is probably /usr/local/qt/html if you''ve installed
    Qt by yourself.


    The output of the command


    ```

    find '''' -name ''qfile.html'' print

    ```


    should direct you to the right location. Set the KDE File Manager (kfm) to the
    corresponding directory and you can see a selection like that shown in Figure
    1.1.


    Qt Help is written in HTML, so you can easily view it with the KDE Manager. If
    you want to, however, you can use other Web browsers (such as Netscape) to view
    the Qt online Help.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.4 Help!


    ![](img/45a3abfe173d274ae06c571b14950e5b_20_0.png)


    Figure 1.1 The Qt online Help in the KDE browser.


    The Qt "newbie" should pay particular attention to "Introduction to Signals and
    Slots," "Tutorial," and "Examples." Anyone who works his way through the tutorials,
    understanding the signal-slot mechanism, is ready to write his first Qt program.4


    A look in the "Class List" certainly won''t do any harm. In particular, to get
    an impression about how Qt''s classes are built, you should take a very close
    look at one of the fundamental classes (QWidget, for example). The Trolls offer
    some excellent Help, and you should definitely take a look here while programming.


    # 1.4.2 KDE Online Help


    KDE offers online Help as well. Sadly, KDE''s Help is not distributed directly
    with KDE; instead, it must be created. You can create the Help using the kdesdk
    program from the kdesdk package. You can download the kdesdk package from the
    KDE FTP server at http://ftp.kde.org/pub/kde/. After you have installed kde doc
    by doing


    ```

    /configure

    make

    make install

    ```


    in the kdesdk/kdedoc directory, you can create the KDE documentation. Assume,
    for example, that you want to generate the documentation in your


    > 4 For those interested in learning more about Qt programming, I suggest Programming
    with Qt, by Kalle Dalheimer (O''Reilly).


    > 5 The kdesdk package is KDE''s Software Development Kit. Although still being
    developed, it already contains many useful tools. The kdesdk package is discussed
    in more detail later in this book.'
  merge: -1
  img_proc: true
