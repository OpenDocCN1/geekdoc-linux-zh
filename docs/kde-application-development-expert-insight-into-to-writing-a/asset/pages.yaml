  md: '# 3

    KTsp is Supposed to Do Something


    So far, we have created a program that can display a window on the desk-top and
    can be terminated. Other than that, it can''t do anything else. For an application
    with a graphical interface, that''s really no mean feat. Our program should do
    something, and we should be able to do something with the program—use dialog boxes,
    load and save files, and so forth.


    I''m sure that you''ve had your fill of "Hello World" programs, and I''m really
    not in the mood to write another (Are you?). They don''t really do anything. Instead,
    I have decided to advance one program through the course of this book until we
    have a real application at the end. Our first steps were pretty simple, but now
    it''s time to get some functionality into the program.


    # 3.1 The Problem: TSP


    Most likely, every computer science major has been confronted with the Traveling
    Salesman Problem (TSP)—and probably tortured him/herself with it. For those who
    might have missed the TSP experience, it''s your lucky day. We''re going to go
    through it here. After a quick introduction to the problem, I''ll show you how
    we can use the computer to “solve” it.


    On a sales trip, a traveling salesman must travel five cities, A-E. He starts
    in City A and is supposed to return to City A at the end. Our salesman is practical;
    he wants to know the full path with the shortest distance. Because we do not have
    an algorithm that directly calculates the shortest path, we must calculate all
    of them. The question remains: how many circuits are there? They can be thought
    of as permutations as follows:


    +   A-B-C-D-E

    A-B-C-E-D

    A-B-E-C-D'
