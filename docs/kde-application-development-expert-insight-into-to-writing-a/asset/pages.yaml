  md: '# 2.4 Accelerator Keys and Shortcuts


    Among types, you''re bound to come across the “mouse cliquer” as well as the “keyboard
    hacker.” Everyone who writes a lot with his computer gets annoyed with programs
    that force you to take your hands from the keyboard and use the mouse to perform
    a specific task. That''s why every programmer should ensure that his program is
    used as much as possible with the keyboard, too. Okay, there are some exceptions:
    Freehand drawing in a graphics program is hard to effect with the keyboard. On
    the other hand, a dialog box in an editor window that has syntax highlighted,
    but is only accessible with the mouse, is aggravating.


    Perhaps you''ve ever wondered about the ampersand (&) in each menu item at the
    introduction of the menu bar.


    Consider this line, for:


    ```

    int id = p->addItem(tr1n(\&Quit"), SLOT(slotQuit()));

    ```


    If an ampersand appears in front of a letter, an underline highlights that letter.
    All menus can be activated with the Alt key and the underline line. The Alt key
    is used, for example, because the user could be in an editor. The editor program
    would not be able to differ between an f that is written in the text and an f
    that should open the File menu. When the menu is activated, the modifier isn''t
    used anymore because it is clear that the menu items are of interest. If you open
    the menu in the program KTSp Alt+F, you can see that the Q of Quit is underlined.
    Press Q (when the menu is activated) terminates the program.


    This mechanism is already provided by Qt. The Trolls will call it accelerator
    keys. We''re dealing with a method to go through a menu step by step and execute
    the desired action. The programmer must ensure that the same key isn''t used multiple
    times as an accelerator within a menu.


    The two items “Save” and “Save as” must be written as “&Save” and “Save &as” in
    the source code. By the way, it doesn''t matter whether capitals or small letters
    are highlighted.


    It''s immediately clear that the accelerator keys are language dependent. At the
    translation of menus, you should pay attention to logically place the ampersand
    in front of letters.


    KDE provides another method to control programs from the keyboard: shortcuts.
    This method differs completely from the accelerator keys and doesn''t just work
    with menus. A key plus a modifier (such as the Ctrl key) is directly bound to
    an action. Execute the program KTSp and press Ctrl+Q. KTSp will terminate.


    The class kAccel provides shortcut functionality. (Shortcuts are different from
    accelerator keys. Shortcut functionality is provided by class kAccel.


    ![](img/45a3abfe173d274ae06c571b14950e5b_41_0.png)'
