  md: '# 4.2 Layouts 83


    I''ll only show the relevant parts from now on; you know the rest by heart now.
    This time both of the first buttons in the loop get a fixed size, and the third
    one outside the loop gets the minimal size. In the loop, we add a fixed size of
    15 pixels as space that must be kept. Additionally, we use addStretch() to insert
    the "rubber band."


    ![](img/45a3abfe173d274ae06c571b14950e5b_98_0.png)


    Figure 4.7 Layout with stretch factors.


    The remaining possible way to influence the size proportions of the widgets within
    the layout is to let them grow and shrink at different speeds. There''s no known
    function for this. We just an an "stretch factor" in addwidget(). They are integers
    whose values don''t matter. Only the ratios between the stretch factors are important.
    If we insert widget A with a factor of 1 and widget B with a factor of 2 into
    a layout, B will grow or shrink twice as fast as A. A factor 0 means there''s
    no change to the size of the widget.


    Using stretch factors together with addStretch() and setSizeF() doesn''t make
    much sense. The results are totally unexpected. If you use the stretch factor,
    set the minimal sizes of the widgets and don''t use addStretch(). If you use stretch
    factors, you should specify them for every widget in the layout.


    It works with other ways, too; but as a rule, not as it is expected. A-responsive
    dialog box can be seen in Figure 4.7. The changes in the source have a greater
    extent this time:


    ```

    layout->addSpacing( 10 );

    ```


    ```

    button = new QPushButton( "B 1", this );

    CHECK_PTR( button );

    button->setMinimumSize(button->sizeHint());

    layout->addWidget(button, 1 );

    layout->addSpacing( 15 );

    ```


    ```

    button = new QPushButton( "B 2", this );

    CHECK_PTR( button );

    button->setMinimumSize(button->sizeHint());

    layout->addWidget(button, 2 );

    layout->addSpacing( 15 );

    ```


    > You can achieve interesting "special effects" by using combinations of stretch
    factors and setFixedSize(), but the results won''t work as expected in most of
    the cases (and it will take a lot of testing before everything works). It''s better
    to leave it alone.'
