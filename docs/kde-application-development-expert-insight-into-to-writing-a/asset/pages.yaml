- pgno: 35
  md: 'take. “Who would want to do all this?” you ask. Well, that’s a fair question.
    All that hunting is not the task of the application. It’s the job of the underlying
    toolkit. The underlying toolkit finds out which widget the mouse has been used,
    whether it was pressed, and whether it was clicked or double-clicked. In reality,
    all toolkits that live up to the name “toolkit” perform this function. Qt certainly
    does.


    The next problem is, what do we do with this? The user has clicked on the Quit
    button. The application programmer has written the code, some-where, which is
    supposed to be executed. How?


    # 2.3.1 The Disadvantages of Previous Solutions


    The solution to this problem is controversial. Many toolkits use the called Callback
    function. The application registers its own code, which is supposed to be executed
    at the widget (the Quit button in this example). You can do this by giving a function
    pointer to the widget.


    If the user clicks on the Quit button, the code will be executed over the corresponding
    pointer to this function. This is, to speak, pure C! So far good.


    For the registration, the widget expects a pointer to function with a set number
    of parameters and a specific return type. Unfortunately, the compiler cannot check
    this, which means there’s no real “type” safety. The programmer must register
    the “right” function at the widget. Every time we hear, “The programmer has to...,”
    it definitely means more work for the programmer. In this case, it also means
    less security. If the programmer registers a function with different numbers of
    parameters or with parameters of the false type or a false return type, the application
    will most likely crash. This is annoying for both the user and for the programmer
    (who must then put more work into his program to find this bug). If the project
    is big and complex, a lot of faults are inevitable. Callback functions can become
    nightmare.


    Some toolkits take another approach, corresponding with the C++ philosophy. Widgets
    already contain element functions pressed(), released(), and clicked(). They are
    declared virtually and the implementation doesn’t do anything on its own. The
    programmer derives his own widgets from the ones provided by the toolkit and overwrites
    the methods that are of interest to him.


    > 7 Be aware of the beloved, but still unfounded, assumptions (like an int being
    the same as a void. Assumptions don’t count on 64-bit DEC Alpha systems; instead,
    they just make more faults possible.'
  merge: -1
  img_proc: true
