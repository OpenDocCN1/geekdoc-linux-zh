- pgno: 159
  md: '```

    msgstr **

    "KTsp - Der TSP Optimierer\n"

    "Version 0.1.0\n"

    "\n"

    * (1999 Uwe Thiem\n"\uwe@kde.org\n"

    "\n"

    Der Algorithmus GDA wurde\n"

    von Gunter Dueck \n"

    "entwicklung."

    ```


    The first example is normal text in a single line. After msgstr, we just enter
    the German expression. The second example shows that translated texts can look
    like format strings in C. For example, %d will be replaced by a value. The third
    example is more complicated. It''s a multiline text that will be shown in the
    About box in the Help menu. First, it is remarkable that xgettext extracted the
    whole text even though it had multiple lines. We translate the item line for line,
    but the translation doesn''t have to contain as many lines as the original. By
    the way, the translator can skip whole messages if they can''t come up with a
    translation now. They''ll be shown in the original language.


    After we''ve translated the texts into German, we must create a database from
    the file (which KDE must understand). The following command takes care of it:


    ```

    msgfmt -o de.mo -v de.po

    ```


    The program msgfmt is intelligent enough to warn the user about small inconsistencies.
    It''ll detect whether there''s a Newline "\n" missing at the end when there''s
    one in the original. We leave the resulting database de.mo in the directory ktsp/po.
    The command “make install” will automatically install it in the right place in
    your system.


    Here''s a summary of what happens at runtime of the program: First, i18n() searches
    the program-specific database for a translation. If it finds one, it uses it.
    If it can''t find any, it searches in the KDE-wide database. If it doesn''t find
    it there either, it uses the original (English) text. This approach has the following
    consequences:


    +   * It''ll never happen that no text appears onscreen. If no translation has
    been found, the original text displays.


    +   * Translations in the program-specific database overwrite the ones in the
    KDE-wide database. If the program-wide database translates Directory as Ordner,
    and the program-specific database translates it as Verzeichnis, the final translation
    will be Verzeichnis.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 8.3 And How Do I Get a Finnish Translation? 145


    +   - If a KDE-wide translation fits in the context of the program, you shouldn''t
    provide your own translation (otherwise, you might confuse the user). The consistency
    of all KDE programs is more important than originality.


    If the program is being expanded with new text later, the program “update” will
    help to insert the new text into the already translated ones so that no translations
    are lost


    ```

    tupdate new.po old.po > latest.po

    ```


    This command creates the file latest.po, which contains all the old and new translations.

    Now install ktsp-0.1.0.tgz and switch KDE to (German). Besides seeing KTsp presented
    in German, you can also take a look at the layout management, which we''ve implemented
    with all this hard work, in action. All elements adjust their size to the text.


    # 8.3 And How Do I Get a Finnish Translation?


    If you''re a language genius, you''ll be able to do it just like the German translation.
    Copy ktsp.pot to fi.po, translate the text, and create the database of Finnish
    translations:


    ```

    msgfet -o fi.po -v fi.po

    ```


    If you can do this, congratulations and applause. Most programmers, however, really
    aren''t language geniuses and we haven''t strictly divided internationalization
    and localization for the fun of it. It is better to let the Finnish do the translation
    for us.


    The KDE server contains the page www.kde.org/i18n.html, which contains all the
    information that relates to “translations.” The information in Figure 8.1 might
    be outdated when you read this book, but the original page of the KDE server will
    always provide you with new information. You should read the original page before
    you contact the corresponding persons because they could have changed.


    Strictly speaking, this process is pretty easy. If you write a freeware program
    and the program is in a state where the text won''t change often anymore, create
    a *.pot file of our program. Now send an email to the coordinator of KDE Internationalization
    and ask him to add your program to the project. He will contact you and ask you
    to send him the *.pot file. If special expressions need more explanation (perhaps
    the translator doesn''t know the translation corresponding to the context of your
    program), you''ll have to provide them.'
  merge: -1
  img_proc: true
