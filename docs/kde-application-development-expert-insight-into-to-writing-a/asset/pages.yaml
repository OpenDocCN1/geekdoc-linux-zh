- pgno: 155
  md: 'The display "All runs" is deleted only if KTsp has been started in Normal mode
    and not via Session Management.


    Our program KTsp is finished; we''re at the end of the programming. Naturally,
    there is always more that can be done. For example, KTsp optimizes the way that
    the hypothetical drilling machine has to move, but that is not what our workshop
    manager really wants. He''s interested in how long the treatment of the work piece
    takes. Because the drilling head does not move in a uniform way from one hole
    to the other—but speeds up and slows down—the time it needs is not proportional
    to the distance moved. Actually, we would have to optimize the time needed instead
    of the distance moved.


    Tsp6da::nextAction() and Tsp6da::calculateQuality() create a new possibility of
    configuring the properties of the drilling machine (acceleration, slowing down,
    and top speed) in KTsp. These things relate only to the precision of KDE programming.
    That''s why we ignore this complex option and leave it to the one who wants to
    use the program in reality.


    We might also create a possibility to actually watch the algorithm optimizing
    a TSP. This could be a display continuously adapted to the ongoing optimizations.
    Such a display would reduce the speed of the optimization significantly and wouldn''t
    really be of much practical use. Because the required changes to implement such
    behavior would be real KDE programming, the reader might consider doing them as
    an exercise.'
