    \ even one time. In rare cases, however, this function proves useful.\n\n# 2.3.3\
    \ The Meta Object Compiler (moc) and How It Is Used\n\nThe preceding section explained\
    \ that only the programmer declares signals; Qt implements them. Naturally Qt\
    \ can't intervene in the compiler (except through the pre-processor). So does\
    \ Qt implement signals?\n\nThe Trolls have developed another useful tool: The\
    \ Meta Object Compiler (moc). It generates C++ source code from the class declarations\
    \ that contain signals and slots, which you can compile and link to the program.\n\
    \nThere's not much to say about moc. It's used like this:\n\n```\n- mysource.cpp\
    \ mysource.h\n```\n\nThe syntax is expected from a compiler. Some people call\
    \ moc another pre-processor and because pre-processors are rightfully taboo (except\
    \ #include), most people reject moc. Moc is actually a Meta Object Compiler and\
    \ not a pre-processor. A pre-processor actually changes parts of the source code\
    \ so that the compiler gets something different as input from what is in; moc,\
    \ on the other hand, generates additional source code from the header files.\n\
    \nYou may be asking yourself, \"How can the compiler compile something that uses\
    \ the new keywords signal, slot, and emit?\" The compiler doesn't know them! In\
    \ this case, the pre-processor is really used. It eliminates these keywords before\
    \ the compiler gets to see the source."
