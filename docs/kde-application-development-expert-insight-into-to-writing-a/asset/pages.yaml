- pgno: 162
  md: '# Documentation


    All KDE programs open a window with Help text when you click on Help, Contents
    (or press F1). Most programs provide a Help index with clickable entries. These
    Help texts are HTML documents shown by dkehelp, a small browser functioning as
    the Help viewer. Users who display KTSp Help will see only the text “Yet to be
    written.” Of course, we want a nice little online handbook for KTSp, too.


    # 9.1 The Online Help for KTSp


    Because KDE Help consists of nothing more than HTML files, those files can be
    generated with every HTML editor (or even with vi). If you have some artistic
    talent, you’ll probably think about adding graphics and elaborated HTML documents.
    It might look great, but please remember that KDE is all about consistency. Users
    not only want to be able to control the program, but also to easily navigate in
    Help. That’s why every KDE program should have a similar Help system.


    Luckily, RDE provides a lot of tools to help us with this. Therefore, we won''t
    just get a Help system that looks similar to ones in other KDE programs, but one
