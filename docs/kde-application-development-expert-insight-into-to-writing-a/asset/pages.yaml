    That makes a delection. We should think about which changes come into force immediately
    and which must take effect later. The number of points could be considered only
    with the next TSP that is generated anyway. The number of neighbors could be taken
    into account at the next run of the TSP.


    To simplify the program, we want to activate this with the next TSP only run.
    The number of runs can be changed during an optimization without any problem.
    If the number is less than the runs that have already taken place, the optimization
    will just quit after the current run. A change of the infall speed can be done
    even during a run. The graphics parameter will activate only at the opening of
    a new TSP viewer anyway, because we draw in a TSP viewer only once. After that
    we just copy.


    Last, but not, we have to think about the design of the dialog box(es). Many developers
    prefer dubbed dialog boxes. You can find a good example of one in the DVI viewer
    (kdvi) by clicking on Options, Preferences. This dialog box''s compact size proves
    advantageous to both the user and to the programmer. The user has everything in
    one place; the programmer can group similar settings under the same tab while
    separating the dissimilar ones under other tabs. It is definitely user friendly
    to have all settings in one dialog box. However, such a setup also has disadvantages.
    The tabbed dialog box has a Defaults or Apply button, for many users will be confused;
    They might wonder, "If I click on Defaults, will it affect the current tab or
    all of them?" is a real problem for the user. Consider, for example, a user who
    makes an important change in a tab, but can''t remember it two weeks later (and
    can''t be seen). The user clicks on Defaults and his change is lost. When he returns
    to the application, he will wonder why something that worked fine is totally different.


    Another potentially confusing aspect of this setup is that the Defaults button
    affects the visible tab only (the tab that is currently open). Assume, for example,
    that the user has hopelessly messed up his configurations.(This happens more often
    than developers think.) The user opens the tabbed dialog box and clicks on Defaults
    and OK, but this action changes the visible tab only (perhaps to suboptimal, but
    usable, settings). All other tabs that were misconfigured earlier are still unchanged.
    It will take some time for the user to discover that he has to go through all
    tabs and click on every Defaults button to restore the standard configuration
    that he can use as a starting point for his customized settings.


    Another possibility is to put every group of parameters in its own dialog box.
    Confusion is nearly impossible, but users have to deal with myriad dialog boxes
    in larger applications until they''ve customized everything to the'
