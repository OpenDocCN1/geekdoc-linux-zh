  md: '# 6.2 Loading of TSPs


    than four seconds, it will be displayed onscreen; if it''s less, it won''t be
    displayed. That''s a very nice property.


    If a "long action" is keeping Qt from processing events, the progress bar won''t
    be updated either. Luckily, KTSP version 0.0.2 has taken care of that already.
    We just call keep->processEvents() from time to time. Otherwise it wouldn''t have
    been possible to pass information about the status of the program to the main
    window. Basically, there''s a rule for every KDE program: keep->processEvents()
    has to be called in between; otherwise, the GUI will "hang". The word might be
    important. Most things are taken care of quickly, but sometimes they can last
    longer. A short file, for example, can be loaded very quickly, but the programmer
    can''t know whether the file is on the local hard drive. Perhaps it''s on a disk
    that has been included included in the local file system with NFS. Because traffic
    in the network could be high, the small file might take quite some time.


    # 6.2 Loading of TSPs


    So far, we''ve only worked with TSPs that have been generated with random numbers.
    That''s not enough for the workshop manager who wants an optimization for the
    treatment of his work pieces. He wants to load real-world tasks in the program
    and achieve results that are hopefully better than the current ones. Therefore,
    we need to enable KTSP to load and save TSPs.


    What is the TSP file format supposed to look like? We could write all coordinates
    of the points one after the other in a binary file. We need to keep in mind, however,
    that the binary representation of numbers is not the same on every computer system.
    Because the user should be able to exchange TSPs between the computer where KTSP
    runs and the machine that treats the work pieces, we need a format that every
    computer can read.


    ASCII is the only thing left. Now the decision isn''t hard anymore. Every point
    is specified through exactly two numbers (the coordinates). We write those numbers
    as a string after the other, one per line, beginning with the X value. An odd
    number of values shows that the file is corrupted. Empty lines are ignored. Everything
    behind a pound sign (#) is a comment. We add a header so that the file can be
    identified as a TSP; the header contains the version number of the file format.
    Later versions can be designed so that they can be directly inserted as programs
    to the machines. As the file extension, we use .tsp.


    With this, the file format is finished:


    +   # TSP file

    # Version 1.0'
