- pgno: 65
  md: 'If we cut connections and create new ones, one part of the circuit will have
    false directions. The directions have to be reversed either in the part F->A->B->E
    or in the part E<-D<-C<-F. The do-loop, which follows in acceptAction(), takes
    care of this task. Fortunately, our data structure has double points.


    Point::flipDirection() doesn''t do anything except flip a bool variable in every
    point, determining which of the two pointers means "forward" and which means "backward."


    Although it sounds strange, Tpgida is in the small do-loop most of the time (from
    500 points on).


    That''s why it makes sense to optimize the loop as much as possible. It''s already
    quite fast because of the double points. If it were possible to know which branch
    was the shorter one, the loop (and with it the whole program) performance would
    be enhanced. The source code comments it all: I couldn''t come up with a solution.
    But even if we only guessed right 70% of the time, the speed increase would still
    be significant.


    The following approach is conceivable: The branch that goes from the current point
    to the current neighbor is probably the shorter one in a halfway optimized TSP
    because it''s not likely that it leads through many points. Although this program
    is correct, it''s of no use to us. Most of the accepted changes—and with them,
    calls of acceptance()—happen at the beginning when the circuit isn''t even anywhere
    close to "halfway optimized.\^8 (In fact, it''s really in a pretty bad state at
    that point.) That''s why the preceding statement is right for a few changes at
    a run only. If a reader knows a codable answer to this problem, I would be interested
    in it!


    # 3.5 Adaptations in the Class KTsp


    Before dealing with the GUI class of KTsp, we should take a look at version 0.0.2.
    From the files on the New Riders website, install ktsp-0.0.2.tgz:


    ```

    tar -xzvf ktsp-0.0.2.tgz

    cd ktsp-0.0.2

    ./configure

    make

    make install

    ```


    For the last step, you must have root rights.


    > ^8 If you watch the program during optimization, you''ll notice that it seems
    to become faster at the end. (This is the reason for the speed-up.)'
