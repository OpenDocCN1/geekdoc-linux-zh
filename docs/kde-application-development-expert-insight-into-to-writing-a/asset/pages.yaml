  md: '# Smart Card Developers Kit

    by Scott Guther and Tim Jorgensen

    1st Edition

    $79.99

    ISBN: 1-57870-027-2


    This is all the practical information a computing professional needs to write
    and run on smart cards. Card communications and commands, SDKs, terminal-side
    and card-side APIs, financial applications and e-commerce are all covered in this
    title.


    # Autoconf, Autumake, and Libtool

    by Ben Elliston, et al.

    1st Edition

    $34.99, Spring 2000

    ISBN: 1-57870-190-2


    This is the first of its kind, authored by Open Source community learners and
    current maintainers of the tools, teaching developers how to boost their productivity
    and the portability of their applications using GNU autoconf and GNU libtool.


    # DCE/RPC over SMB

    by Luke Leighton

    1st Edition

    $45.00

    ISBN: 1-57870-150-3


    Security people, system and network administrators, and the folks writing tools
    for them the packets flowing across their networks. Authored by a key member of
    the SAMBA team, this book describes how Microsoft has taken DCE/RPC and implemented
    it over SMB and TCP/IP.


    # Delphi COM Programming

    by Eric Harrington

    1st Edition

    $45.00, Winter 2000

    ISBN: 1-57870-221-6


    Delphi COM Programming is for all Delphi 4 and 5 programmers. After providing
    readers an understanding of the COM framework, it offers a practical exploration
    of COM developers to program component-based applications. Typical real-world
    scenarios, such as Windows Shell programming, automating Microsoft Agent, and
    creating using ActiveX controls, are explored. Discussions of each topic are illustrated
    with detailed examples.'
  merge: -1
