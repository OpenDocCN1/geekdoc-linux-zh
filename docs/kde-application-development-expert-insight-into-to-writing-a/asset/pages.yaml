    # 10.4.3 The File ktsp.kdelnk


    A delnk file is assigned to every KDE program and contains a bunch of information
    about the program. For KTsp looks like the following:


    ```

    # KDE Config File

    [KDE Desktop Entry]

    Type=Application

    Protocols=file;ftp;

    Exec=ktsp -caption "%c" %i %m

    Icon=ktsp.xpm

    MiniIcon=ktsp.xpm

    DocPath=ktsp/index.html

    Comment=The TSP Optimizer

    Comment[de]=TSP Optimier

    Name=TSP Optimizer

    Name[de]=TSP Optimier

    Terminal=0

    MimeType=text/tsp

    ```


    The first two lines characterize the file as one that can be placed on the desktop
    and can be clicked on. The third line specifies it as an application (and not
    a device such as a floppy drive or an URL). The protocols understood by the application
    are specified in the fourth line; in this case, local files (but also over NFS,
    because these files are treated like local ones) and FTP.


    The next line specifies how the program is executed. First, the name of the program
    file ktsp. The two parameters set the text in the title bar: -caption the following
    string is %c means that the string doesn''t stand direct in, but has to be loaded
    from the Name line. In this, %c will be set to the TSP Optimizer if we''ve set
    the language to German or to TSP Optimizer in all other cases because it''s the
    standard item. The parameters %i and %m will be replaced by'
