    As you can instantly see, we either destroyed a crossing in the circuit with this
    action or we created one. Our TSP is finely suboptimal as there''re crossings,
    because there''s always a shorter total way. In comparison, a crossing-free course
    isn''t optimal, so se. There''re many crossing-free ways with every given distribution
    of a larger number of cities on the plane. In any case, a crossing-free way isn''t
    bad. We can leave it to GDA to find a solution that pleases our workshop-manager
    practicality.


    The criterion for GDA is not freeness, but quality, which means a "short way"
    in our case.


    The abort condition for our loop in the pseudo code could still use an explanation.
    If it hasn''t been any change accepted for a long time, GDA will be surrounded
    by water and won''t be able to move anymore. In other words, GDA is on a peak
    (which doesn''t necessarily represent the global optimum). But how long is "Long?"


    It depends on the concrete problem. We definitely can use a large number of actions
    that haven''t been accepted. Say, for example, that if 100,000 actions haven''t
    been accepted on one piece, we''ll abort. This number would be absurdly high for
    a little TSP with 50 cities, and we would perform the same actions over and over
    again. Our program would run unnecessarily long. However, this number might be
    too small for a big TSP. There be actions left that haven''t been tested. This
    means that GDA could still move.


    At least for TSPs, it''s easy to choose the right number of actions: if the GDA
    has traveled through all the cities one time and tried all possibilities by cutting
    and connecting the circuit without finding one acceptable solution, it will abort.
    Every other cycle would lead to the same actions that have already been rejected.
    GDA can confidently assume that it''s on a peak.


    We want to implement GDA so that it doesn''t know anything about TSPs and can
    be used for every arbitrary optimizing method. That''s why we


