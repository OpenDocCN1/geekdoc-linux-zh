    # 10.3 A New Project


    How can we start a completely new project? The simplest method is to use an existing
    project and to delete all sources, icons, translations, and so on. All references
    to the old project (including sources, icons, and so forth) in Makefile.am have
    to be replaced with references to your new project. All references must be replaced
    in the file configure.in in the main directory of your project. Search especially
    for AG_OUT and adjust the structure to your project. Also determine whether the
    subdirectory .deps is deleted in the directory with the sources (in this case,
    ktsp-0.2.0/ktsp). If not, delete it. After you have finished this procedure and
    have created at least a source file with main(), enter the following sequence
    of commands:


    ```

    autoconf

    automake

    perl automoc

    ./configure

    make

    ```


    All files will be updated. If you add new source files (or translations, icons,
    and so forth), you must adjust the file Makefile.am in the corresponding directory.
    Don''t forget to begin the sequence with automake again. If you add new subdirectories,
    you have to adjust configure.in and begin with autoconf.


    If your project has reached the state where you want to release it, you should
    delete all the compiled and linked files as well as core dumps and system-specific
    information created by configure. The following command takes care of it:


    Next, your user has to enter only the three lines you are already familiar with
    from installing the different versions of KTsp:


    ```

    ./configure

    make

    make install

    ```


    Now, what project should you start with? You can begin with KTsp.

    Actually, KDE is now evolving very quickly, as are automake and autoconf. In fact,
    this part of KTsp will probably already be outdated upon the release of'
