    \ bar changes its size very little, while the graphical displays gets most of\
    \ the size changes.\n\nThe graphics displays, just as the progress bar, connected\
    \ to the responding signals of TsGda so that the display will be updated if needed.\n\
    \nWe need to talk about a limitation of KTMW. In our case, the main view of KTMW\
    \ is a QWidget containing the other widgets. A QWidget itself doesn't provide\
    \ a reasonable minimal size by itself. It shouldn't be a problem for us because\
    \ the layout takes care of it. The problem is KTMW not caring about this minimal\
    \ size. We have found another solution. We can set the minimal size with setMinimum()\
    \ right after the creation of the main view at the beginning of the constructor.\
    \ Although this works well for Qt, it is still nothing more than a hack that won't\
    \ take care of different font types and sizes. We have to live with it until KDE\
    \ 2.0 is released.\n\nThe graphics displays in the main window have the types\
    \ ActionDisplay and RunDisplay. They are derived from the base type GraphDisplay.\
    \ Before we deal with GraphDisplay, we want to take a look at the widget Graph,\
    \ which is the main component of GraphDisplay. The declaration of Graph is as\
    \ follows:\n\n```\nclass Graph : public QWidget\n{\npublic:\n    Graph(QWidget\
    \ *parent = 0, const char *name = 0 );\n    virtual ~Graph();\n    virtual QSize\
    \ sizeHint() const;\n    // clears the display and resets all data\n    void clear();\n\
