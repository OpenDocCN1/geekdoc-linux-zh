  md: "# 3.7 Why Not Another Design?\n\nWhy not use rand() or rand48()? In “Numerics\
    \ in C” the authors advise everyone to use rand() since it's supposed to be implemented\
    \ rather badly on various systems. When I began to use the DEC Alpha, rand48()\
    \ anything else but random numbers. The problem is fixed now—at least, it seems\
    \ to be fixed. Otherwise, Random exists now. It can be expanded very well to normally\
    \ distributed random numbers, for example, and it generates very good random numbers\
    \ very fast. That's why I decided not to throw it away, but to reuse it. The algorithm\
    \ itself is not of interest for this book and I won't get into details.\n\n# 3.7\
    \ Why Not Another Design?\n\nAfter introducing signals and slots, a new question\
    \ arises: Why haven't we used a completely different design for our program. Gda\
    \ and Tsp could be two totally different classes that communicate over signals\
    \ and slots. Tsp sends a signal that the signal been sent before the slot's execution.\
    \ Gda answers the signal and either rejects or accepts it. It would be a much\
    \ more elegant design! Right?\n\nThe short answer is, “It wouldn't work.” The\
    \ detailed answer is a little bit longer. If a signal is sent, Qt will make sure\
    \ that the slot connected to the signal has been sent before the slot's execution\
    \ has finished. Program control won't return to where the signal been sent from;\
    \ in other words, if we send a signal, we actually call a function, the slot.\
    \ The difference is that Qt makes sure that everything is working if there's no\
    \ slot.\n\nThis presents no problem so long as we're in the GUI. The user just\
    \ clicks on several buttons, menu items, or icons, we'll never get more than a\
    \ few slots deep. If our calculation slaves, Tsp and Gda, would communicate over\
    \ signals and slots, slots would call other slots, which would again call other\
    \ slots. This could happen many thousand times or even a million times the program\
    \ returning to the starting point. Because we don't have an unlimited stack, our\
    \ program will crash sooner or later. The following mini-program demonstrates\
    \ the problem:\n\n```\n#include <qobject.h>\nclass Foo : QObject\n{\n    Q_OBJECT\n\
    \    signals:\n    void send();\n    public slots:\n    void receive();\n};\n\
    ```\n\nFoo::receive()"
