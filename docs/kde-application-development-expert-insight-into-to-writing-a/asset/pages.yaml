    of this, it is possible for KDE to exist on different systems at different paths
    and the installation still will work.


    Most of the items are self-explanatory. Some are interesting enough for us to
    take a closer look at them. After we have specified the subdirectories, the program
    name, and the source files that have to be compiled, we get to this line:


    ```

    ktsp_METASOURCES = \$(USE_AUTOMOC

    ```


    This line relates to the Qt Metacompiler (moc).


    A source file has to be created by moc from all the header files that contain
    Q_OBJECT. It can be compiled just like any other file. At the beginning of the
    book, I talked about


    ```

    moc mysource.moc.cpp mysource.h

    ```


    creating the source file from the header files. If we want to automate this process,
    we can''t insert the *.cpp files into the source files in Makefile.am; they don''t
    exist at the beginning. The tool automoc helps us. It''s a Perl script searching
    all header files for Q_OBJECT and inserting the corresponding items to the Makefile.in.


    The program itself, the code for the program, and the ktsp.kdeink will be automatically
    installed by make install. Additionally, we want to install a mini icon (for example,
