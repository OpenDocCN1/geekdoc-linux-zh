  md: '# Books for Technology Professionals


    # Windows NT


    ![](img/45a3abfe173d274ae06c571b14950e5b_206_0.png)


    Windows NT Automated Deploy and Customization by Richard Puckett 1st Edition $32.00
    ISBN: 1-57870-045-0


    NT and UNIX in the same network, beginning with the fundamentals of both NT and
    UNIX, and following with discussions of file sharing, proven solutions to the
    problems related to printing in an integrated environment,


    Time-saving advice helps you install, update and configure software on each of
    your clients, without having to visit each client. Control all clients remotely
    for tasks such as security and legal software tools. Include reference material
    on NT tools, registry edits and third-party tools.


    ![](img/45a3abfe173d274ae06c571b14950e5b_206_1.png)


    Windows NT Device Deployment by Peter Viscarola and W. Anthony Mason 1st Edition
    $50.00 ISBN: 1-57870-058-2


    ![](img/45a3abfe173d274ae06c571b14950e5b_206_2.png)


    Windows NT Scripting by Tim Hill 1st Edition $32.00 ISBN: 1-57870-047-7


    This title begins with an introduction to the general Windows NT operating system
    connects to drivers, then progresses to more detailed information about the operating
    system, such as interrupt management, synchronization issues, the I/O Subsystem,
    standard kernel mode drivers, and more.


    A complete reference for Windows NT scripting, this book guides you through a
    high-level introduction to the shell language itself and the shell commands that
    are useful for controlling or managing different components of a network.


    ![](img/45a3abfe173d274ae06c571b14950e5b_206_3.png)


    Windows NT Heterogeneous Networking by Steven Thomas 1st Edition $40.00 ISBN:
    1-57870-064-7


    ![](img/45a3abfe173d274ae06c571b14950e5b_206_4.png)


    Windows NT & UNIX Integration by Gene Henriksen 1st Edition $32.00 ISBN: 1-57870-048-5


    A complete reference for internetworking all major systems with Windows NT, both
    at the OS and protocol levels, you''ll find information on how to successfully
    develop an enterprise model as well as coverage of how to optimize hardware, domain
    controllers, and enterprise service traffic.


    This book provides you with an all-in-one guide to integrating'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Windows NT Thin Client Solutions

    by Todd Mathers and Shawn Genow

    1st Edition

    $35.00

    ISBN: 1-57870-065-5


    # Windows 2000 Server: Planning and Migration

    by Sean Dubois

    1st Edition

    $40.00

    ISBN: 1-57870-023-X


    Explore the cost-saving features of Windows Based Terminal Server—which allows
    applications to run on a server—as well as the software built upon Citrix''s core
    ICA (Independent Computing Architecture) protocol which provides enterprise functionality.


    Windows 2000 can quickly save the NT professionals of dollars and hundreds of
    hours. This title includes authoritative information on key features of Windows
    2000 and offers recommendations on how to best position your NT network for Windows
    2000.


    # Windows NT Win32 Perl Programming: The Standard Extensions

    by Dave Roth

    1st Edition

    $40.00

    ISBN: 1-57870-067-1


    # Windows 2000 Quality of Service

    by David Isenberg

    1st Edition

    $45.00

    ISBN: 1-57870-115-5


    Consider numerous examples and practical uses of Perl in solving everyday Win32
    problems. This is the only book available with comprehensive coverage of Win32
    extensions, where most of the Perl functionality resides in Windows settings.


    As the traffic on networks continues to increase, the strain on network infrastructure
    and available resources has grown. Windows 2000 Quality of Service teaches engineers
    and administrators how to define traffic control patterns and utilize bandwidth
    and their networks.


    # Windows NT Domain Architecture

    by Gregg Bramham

    1st Edition

    $38.00

    ISBN: 1-57870-112-0


    # Windows NT Applications: Measuring and Optimizing Performance

    by Paul Ginsberg

    1st Edition

    $45.00

    ISBN: 1-57870-176-7


    As Windows NT continues to be deployed more and more in the enterprise, the domain
    architecture for the network becomes more critical as the complexity increases.
    This book contains the in-depth expertise that is necessary to truly plan a complex
    enterprise domain.


    This book offers crucial insight into the underlying structure of Windows NT,
    as well as the methodology and tools for measuring and ultimately optimizing code
    performance.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Windows 2000 and Mainframe Integration by William Zack

    1st Edition

    $39.99

    ISBN: 1-57870-200-3


    Windows 2000 integration provides mainframe computing professionals with the practical
    know-how to build and integrate Windows 2000 technologies into their current environment.


    # Windows Script Host by Tim Hill

    1st Edition

    $35.00

    ISBN: 1-57870-139-3


    Windows Script Host is one of the first powerful tools. The text focuses on system
    scripting and using objects, server scriptlets, and ready to use script solutions.


    # Handbook of Programming Languages, Volume II Edited by Peter Salus

    1st Edition

    $49.99

    ISBN: 1-57870-009-4


    The four most important languages are covered in this title: Fortran, C, Turbo
    Pascal, and Icon. Evaluate them to find the best language for your purpose at
    hand, and learn how these languages are related to each other historically and
    syntactically.


    # Handbook of Programming Languages, Volume III Edited by Peter Salus

    1st Edition

    $49.99

    ISBN: 1-57870-010-8


    Beginning with Jon Bentley''s discussion of little languages, this book continues
    to discuss languages “specialized to a particular domain”—such as Perl, sed, awk,
    SQL, Tcl/Tk, Python and more.


    # Programming


    # Handbook of Programming Languages, Volume I Edited by Peter Salus

    1st Edition

    $49.99

    ISBN: 1-57870-008-6


    # Handbook of Programming Languages, Volume IV Edited by Peter Salus

    1st Edition

    $49.99

    ISBN: 1-57870-011-6


    This is the most comprehensive source on the principal object-oriented languages.
    It covers languages from Smalltalk to Java, with explanations of the languages''
    histories, descriptions of their syntax and semantics, how-to information and
    tips, and pointers to potential traps.


    This book begins with the functional programming group, descended from John McCarthy''s
    LISP of the late 1960s, and moves on to discuss its offspring: Emacs Lisp, Scheme,
    Guile and CLOS.'
  merge: -1
  img_proc: true
