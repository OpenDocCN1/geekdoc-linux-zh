  md: '# Acknowledgments


    A book like this one is never the product of one single person. Without the help
    of other people, the book and its translation to English would have not been possible.


    I would like to thank Kurt Granroth for going through the text and figuring out
    technical errors that crept in during the translation process.


    My special thanks to Keith Cline, the copy editor. His hard work on the book was
    invaluable and made the text readable.


    Katie Purdue, the acquisitions editor, made the English edition of this book possible—no
    easy task with regard to the translation process and an author who just can''t
    run the “usual” word processor on his Linux computer.


    Although the Trolls of Troll Tech, the creators of Qt, did not contribute directly,
    it goes saying that this book would not have been possible without their excellent
    Qt library.


    Countless KDE developers around the globe contributed directly or indirectly.
    Without them, KDE would not exist and obviously neither would this book. The open
    and friendly atmosphere of KDE makes it easy to ask questions without hesitating.
    Answers then emerge most of the time. This atmosphere is crucial for the speed
    of development and it helps the author who writes about KDE.


    As a former printer, I am aware that producing a book doesn''t stop when the text
    is ready. Many people—most of them unknown—must put their work into it until,
    finally, a complete product hits the shelves in bookstores. My special thanks
    go to these people.


    My little son Mathis was annoyed by being banned from hacking on my keyboard.
    But more important to him was that his daddy “wasn''t there” when he needed him.
    My daughter Sonja had to accept a “Not now!” far too often. Even worse, a “later”
    wouldn''t follow. My wife Ulla, who has enough to worry about with just the Namibian
    groundwater, carried more than her share of the household and family burdens.
    I thank the three of you for your patience, and I promise to become a normal human
    being again.


    —Uwe Thiem'
