    "been invented by them\n"

    "Gunter Dueck.\

    "

    ```


    1 Please remember to rename ktsp.po to ktsp.pot. The t stands for template.

    2 This is not always the case. Think, for example, of an English verb and its
    substantive forms looking the same from time to time. This differs, however, in
