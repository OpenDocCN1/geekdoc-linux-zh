    # 12.2.1 KAppgen


    KAppgen generates all needed files for a minimal KDE application doing nothing
    more than displaying itself onscreen and terminating. It''s a good start for a
    new project.


    KAppgen belongs to the package kdesdk, which can be downloaded from the KDE''s
    FTP address. After you''ve compiled and installed KAppgen, you can find the program
    under the panel menu Applications. If you execute KAppgen, you''ll be presented
    with four pages of questions about your new project. You must answer these questions.
    Figure 12.5 shows the first one of these pages. After you''ve finished everything,
    choose File, Generate Application. KAppgen will generate the project with all
    the needed files. Now you can start to develop your program with the tool of your
    choice.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 12.2 Application Generators 169


    ![](img/45a3abfe173d274ae06c571b14950e5b_184_0.png)


    # 12.2.2 Shaman


    Shaman is actually a lot more than an application generator for KDE. It likes
    to describe itself as a system for generating documents. The files needed for
    a KDE project are also documents and that''s why we''ll use Shaman as a generator
    for “application frameworks.” The program has a Web site:


    www.kirchheim.netsurf.de/~tfischer/shaman.html


    You can get the program itself and information about new developments from this
    site.


    After you have installed Shaman, a new item will appear on the panel menu: Developer.
    You can execute the program with presenting it as in Figure 12.6. In the left
    part of the main window of Shaman, you''ll see the directory tree with the already
    existing document templates. There are three document templates for KDE:


    +   - Minimal

    - Standard

    - KOffice_index[KOffice]


    A minimal KDE application is a program with a main window without a menu, toolbar,
    and statusbar. A standard application has a menubar and a toolbar. The KOffice
    template generates an application for KOffice, KDE’s office applications. The
    standard template is good for most of the programs. If you choose a template in
    the left part of the window, Shaman will display information about it in the right
    part. If you''re pleased with it, you can start the generator by clicking on File,
    New Project from Template.'
  merge: -1
  img_proc: true
