    Please change the font as well as the font size with the help of the KDE Control
    Center or KPanel by selecting K, Settings, Desktop, Fonts. Choose the Lucida font
    and 16 as the font size. Now open the dialog box again. Oh my, it doesn''t look
    good anymore! I''m not talking about the font itself. It could be that the corresponding
    font size is not installed on your system. Or, in this case, it will look bad.
    I''m talking about the dialog box itself. The word Defaults doesn''t fit on the
    button anymore, and overall! the dialog box just doesn''t seem balanced.


    ![](img/45a3abfe173d274ae06c571b14950e5b_93_0.png)


    Figure 4.2 The consequences of fixed widget sizes.


    We just statically defined the sizes of all widgets! Naturally, changes to font
    type or size will lead to problems, but it gets worse. So far, there''re no translations
    for KTSp. Let''s assume that a Finnish translation already exists and someone
    uses KDE in Finnish (with all those very long Finnish words). The user probably
    won''t be able to read again. After all, we prepared all texts with i18n() for
    the translation; we never considered that words have different lengths in different
    languages.


    So now what? Is there a way out?


    # 4.2 Layouts


