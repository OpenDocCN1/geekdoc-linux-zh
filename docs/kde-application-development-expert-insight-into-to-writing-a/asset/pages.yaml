  md: "# 6.6 Facelifting 119\n\nvirtual void paintEvent( QEvent *e );\n\nprivate:\n\
    \n// internal store of the scales\n\nint hScale;\n\ndouble vScale;\n\n// number\
    \ of received values\n\nint receivedValues;\n\n// storage of all values received\
    \ so far\n\nQList<double> values;\n\n}\n\nGraph is derived from QWidget. The two\
    \ methods vScale() and hScale() set the largest possible value that can be displayed\
    \ and, respectively, the number of values.\n\nGraph::slotNextValue() deletes the\
    \ next value in the graphic and saves the value for future redraws. Graph::clear()\
    \ deletes the graphic along with all saved points. We've overwritten the virtual\
    \ method paintEvent() so that we can redraw our graphics in the main window (and\
    \ this widget) gets resized. The QList is the only interesting aspect of primitive\
    \ elements. It is a template class instance we're using to save all values as\
    \ doubles.\n\n```\nGraph::Graph( QWidget *parent, const char *name )\n{\n  vScale\
    \ = 0.0;\n  hScale = 0;\n  receivedValues = 0;\n  values.setAutoDelete( true );\n\
    \  setBackgroundColour( black );\n  setMinimumSize(200, 100 );\n}\n```\n\nThe\
    \ constructor initiates all internal data. Apart from that, only two lines are\
    \ of interest to us. As I was saying, QList should save the received data. Actually,\
    \ it saves pointers to the data. So, the question arises: What will happen with\
    \ the data if the instance of QList deletes or if List::clear() is called? Its\
    \ preset clear deletes the internal list of pointers, but not the data itself.\
    \ The List acts as if it doesn't own the data. That's not exactly what we need,\
    \ because no other class is responsible for the data. We change the behavior with\
    \ QList::setAutoDelete( true ) so that the data gets deleted if something is deleted\
    \ from the list. We set the minimal size of our graphic display with Graph::setMinimumSize().\
    \ We've chosen the values for width and height more or less at random to make\
    \ that Graph can display the data reasonably, even when at its minimal size."
