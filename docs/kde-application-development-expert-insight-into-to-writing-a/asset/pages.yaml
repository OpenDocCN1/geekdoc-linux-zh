  md: "Besides this, every slot can be declared as virtual. Most of the slots that\
    \ you'll encounter will be public. A slot is actually no more than a member function\
    \ that can connect to signals. That's why the programmer must implement it, because\
    \ this is the place where the answer to the signal has to be defined. No one except\
    \ the programmer can know this. The implementation of the slot changeColour()\
