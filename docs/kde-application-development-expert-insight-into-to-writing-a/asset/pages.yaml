- pgno: 45
  md: '# 30 Chapter 3: KTSp is Supposed to Do Something


    These three routes are only some of possibilities. You can imagine the ends being
    connected to each other so that you have a complete circuit. If there are n cities,
    there will be n!—that is, n * (n-1) * ... * 1 circuits. Actually, there are fewer
    possibilities for our salesman, because some of the routes are the same. A-B-C-D-E
    is the same as for C-D-E-A-B; both equal the same distance. Therefore, instead
    of n!, we have only (n-1)! possible circuits. This number can be reduced again
    A-B-C-D-E and E-D-C-B-A are the same. At the end, we''re left with only (n-1)!/2
    possible circuits. With five cities, this doesn''t compute to a very large number—12,
    in fact. With 12, we can easily calculate the relative distances and quickly determine
    the shortest full circuit. As the number of stops (cities, in this case) increase,
    however, we begin to face a much more complex task.


    Because calculators can display up to two-digit exponents, they “give up” at 100
    digits and display an error message. At 70j!, with the size of a 100-digit number.
    Are you beginning to understand our little problem?


    Let''s assume that we want to calculate the solution of a TSP with 300 cities.
    Why would anybody do this? Because knowledge is power: He knows the shortest way
    can finish in the quickest time. When thousands of “work pieces” (be they cities
    in a sales circuit, stitches in a suit, certain number of drill holes, or whatever)
    must be accomplished, this knowledge provides a significant advantage. Using today''s
    fastest computers (well, at least in this example), we can solve our 300-city
    TSP in a reasonable time (about half an hour).


    As the number of work increases, however, so does the time takes to solve a TSP.
    With 301 cities (a number we will actually deal with later), today''s fastest
    computers need 300 times as much time to calculate (about 150 hours). This isn''t
    reasonable at all. And the numbers don''t just stop there. Assume, for example,
    that the fastest computer in the world can solve a TSP for 1,000 cities in half
    an hour. If we need the solution for 1,001 cities, we''re going to wait for future
    computer generations that have approximately 1,000 times faster speed before we
    can solve this task in a reasonable amount of time. How impractical is that?


    If the time needed to solve a problem increases with the size of the problem,
    we can consider the problem unsolvable.¹ Unfortunately, many problems fit this
    classification.


    > The key term here is NP-complete problems. NP stands for “non-polynomial,” and
    means that no problem describes the dependence of the time it takes to the size
    of the problem. Every computer science handbook should have a section about.'
  merge: -1
  img_proc: true
