    So far, we have hard coded a couple of parameters in the source, including the
    number of TSP points if it is to be generated, the number of neighbors, and the
    number of runs with KTsp tries to optimize. The rain speed do you still remember
    GDA? is also hard coded in the source. Additionally, we could think about the
    colours that should be used for the points and lines in the TSP viewer. Some users
    might not like the circles that represent the points in the viewer.


    We don''t want to expect users to recompile KTsp if they want to change these
    parameters, and the same applies to the programmer who has to test the program
    under various conditions. The answer is: We need a configuration dialog box or
    even multiple ones, because some things don''t relate to each other. The number
    of neighbors who have to be considered is specified at the same place where the
    number of points is specified. Actually, they don''t have anything to do with
    each other. The number of points influences the number generator. The number of
    neighbors is a parameter that influences the optimizations, just like the amount
    of rainfall.


    We can specify some groups of parameters that belong to each other as the following
    table shows.


    | Group | Parameters |

    |---|---|

    | TSP | Number of points<br>Number of neighbors<br>Number of runs<br>Amount of
    rainfall |

    | Graphics | Colour of the points<br>Colour of the connections<br>Line width of
