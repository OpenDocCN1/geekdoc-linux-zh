    The line kapp->processEvents() is interesting. The method startGd takes a long
    time before it returns. No other code is executed during this time, not even the
    part responsible for taking care of events (keyboard, mouse, and so on). The user
    clicks on a button and nothing happens. Such behavior (the nothing happening part)
    can''t be tolerated in a GUI program. We have to give QApplication a chance, in
    between, to take care of some events. QApplication provides a global pointer kapp
    to make it easier for us.


    This approach works because there is only one instance of QApplication in every
    program. QApplication inherits the member function processEvents() from QApplication.
    This function takes care of events from the event queue for a maximum of three
    seconds or until no events are there anymore; then it returns. Three seconds is
    a horribly long time for a calculation-intensive program. We can rightfully assume,
    however, unless the user hacks on the keyboard like crazy or makes a race with
    his mouse while he watches the program working, the function will never last three
    seconds.


    Very distrusting programmers can use the function processEvents( int maxime )
    instead; meantime specifies in milliseconds how long the events can be worked
    off. Warning: If you ever get into a situation where you have to restrict the
    time for events, there is probably something wrong with your program (at least
    that is my opinion). After all, this means events that have not yet been taken
    of in the event queue. They will stack up with time and the GUI will once more
    react only hesitantly.


    Programmer hint: If your program executes for a long time without giving a chance
    to be executed from time to time; otherwise, the response characteristics of the
    GUI will be totally degenerated. The reason for this trouble is that Qt currently
    isn’t “thread safety.” We can only hope that future versions of Qt function safely
    with threads, enabling us to run timeconsuming operations in a thread other than
    the GUI. This would have other advantages, too: At the moment, no “blocking IO”
    is being performed. If an IO operation is blocked, the GUI is blocked, too. Because
    of this, we must execute all IO operations as “non-blocking,” which is rather
    unpleasant.


