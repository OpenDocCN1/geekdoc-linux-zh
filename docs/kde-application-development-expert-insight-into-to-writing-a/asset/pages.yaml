    Why this approach? The first reason is that we have to draw the graphic

    only one time, at the first call of paintEvent() at which data already exists.

    The drawing takes a lot longer than the copying. We save time, which we

    use for further optimizations in the program. The second reason is of

    aesthetic nature. Let''s say that we draw the graphic every time directly on

    first and draw the new one. That would lead to a lot of flicker, if we

    were to erase the old graphic

    ew redraw requests follow each other. There''s a lot flicker by copying the

    QPixmap into the Canvas as we don''t have to erase anything. We buy

    speed and aesthetics for the memory of the additional QPixmap. I think

    that it''s worth.


    After the paintEvent() is clear, we need to take a look at the tools that

    are used.


    QRect isn''t anything special. Just like the names says, it''s a class that

    defines a rectangle. It can be passed along functions as a parameter or to

    can be returned by functions.


    QPixmap is more exciting. Actually, it can be imagined as a rectangular\piece
    of the screen which doesn''t display itself onscreen. You can copy from

    an appropriately appropriately sized piece of a widget into a QPixmap and the
    other way

    round, but it''s more than a passive cache. You can draw in it just like with

    screen, which makes it practical for every task for which you have to

    invisibly finish the graphic first and then display the whole thing at once.


    QPainter is a powerful tool. It''s important to us because we can use it to

    paint and write on QWidgets, QPixmaps, and QPrinter (a logical printing

    device). Besides drawing points, QPainter can be draw lines, rectan-

    elipses, circles and circle segments, pi graphics, polyg, Bézier func-

    tions and some other things such as pictures (QPicture), and

    naturally, text. The methods begin with the word draw and have logical

    draw: drawEllipse() draws an ellipse; drawPolygon() draws a polygon. The

    other methods are named accordingly. Different widths, pen styles

    (lines, dotted lines, and so on), and colours to its repertoire, too.


