  md: 'home directory. First, you create the kedoc directory in your home directory.
    With the kedoc directory, create a directory called kedoc-reference.


    Next you must go into the directory where you can find the source of the KDE libraries,
    and from there to the directory kdecore. You now enter the following command:


    ```

    kdoc -d $HOME/kedoc/kdecore -u file:$HOME/kedoc/kdecore -L $HOME

    kedoc/kedoc-reference kdecore *

    ```


    You can get information about the individual parameters with kedoc help. This
    process continues for every directory in the KDE libraries. You must replace kdecore
    with the name of the directory for which you''re creating the document. Although
    this might seem inconvenient (and I agree that it is), at the end when you direct
    your browser to $HOME/kedoc, you''ll be rewarded with a document like that shown
