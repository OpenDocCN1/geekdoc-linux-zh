  md: '# 11.2 Filename Extensions


    We write our programs in C++, and we can use various extensions for it: .C, .cpp,
    .c++, .cc. It is up to you to choose one. I prefer .C—not least to show that we''re
    on a UNIX system, which is case sensitive. Just a little hint if you''re not a
    friend of cpp: atomic creates filenames as *.moc.cpp. The whole mechanism of the
    Makefiles will only work if at least one of the source files has a .cpp extension.
    That''s why I use main.cpp and name all my other files *.c.


    # 11.3 Comments


    Some people (well, actually, many) think that there has to be “political correctness”
    in the source code. We at KDE don''t care about that. Why shouldn''t the developer
    be able to let his displeasure take its course // shit! we are traversing a cursor
    on a deleted list


    if only I and the other developers will see it. I just can''t imagine why someone
    would have a problem with it; I know that there are such people (or so I''ve heard).
    We write software, not Be Nice books.


    # 11.4 Colours


    We tend to look at colours as easily distinguishable. In general, that''s true.
    The whole theory of false-colour photography is based on us being able to distinguish
    between colours more than between grayscales.


    There''s an anecdote from the beginning of KDE. The icons for “mounted” and “unmounted”
    floppy disks and CDs differed only through the use of a red and a green rectangle.
    It''s obvious, isn''t it? Actually, many people have a red-green fairness and
    can''t distinguish the colours. Blue-green fairness is rare, but many people can''t
    distinguish those colours. Even a rarer person is the one who fits into the third
    category: persons who can''t differentiate between any colours.


    In summary, never make the visualization of differences in your program colour
    dependent only. We don''t want to exclude all colour-impaired people.


    # 11.5 Icons and Graphics


    Icons (in particular) and graphics (in general) are normally intuitive and self-explanatory.
    That''s why they''re often used for long descriptions. “A picture is worth a thousand
    words.” Well, they are intuitive, but only in connection with the culture from
    which they came. Intuitive thinking is a'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 11.5 Icons and Graphics 161


    synthetic act that isn''t based on deduction. It works only if the picture rings
    a bell in us. You won''t believe me?


    Let''s take a look at the icon of KMail. It is an envelope. Because we are all
    (well, at least the readers of this book, I hope) are computer users, we have
    heard of email. So, we immediately associate the envelope with the idea "I can
    send/receive email with it." Maybe. But what if letters are sent in a totally
    different way in my culture? They could be rolls or artistically folded sheets.
    The meaning if the icon becomes completely unclear. Maybe drums or smoke signals
    would be good symbols for them.


    Consider this simple example and you will see how it can mislead us. A diagonal
    line from the lower left corner to the right corner means "upward." Am I right
    or not? In Western culture, this might be true because we read from the left to
    the right. If we look at the line from the left to the right, it will go upward.
    We have been conditioned from childhood to think of it as "normal." In other cultures
    that read from the right to the left, however, this line is going "downward,"
    and is just as "normal." Someone recently asked me, "And if we add an arrow to
    the top?" A reader reading from the right to the left would probably associate
    it with "backward."


    The diagonal line is a very rare example. In most of the cases, the difference
    between the imagination and association of icons and other graphics is much more
    subtle. The University of Namibia conducted an experiment related to icons with
    the students, and ended up with surprising results. A good example was the No
    Smoking sign. We all know it: a red circle with a red diagonal on a white background
    and a cigarette. Everyone knew that it had something to do with smoking, but they
    weren''t so sure about the rest of the sign. An interesting answer was "Only half
    cigarettes are allowed to be smoked—but this is nonsense!" The person knew that
    it didn''t make any sense, but it was what she thought.


    I''m not suggesting that you do not use icons. I''m just emphasizing that not
    all symbols are intuitively understood worldwide. Intuition comes from the culture(s)
    in which persons grow up or become familiar with. This means that in some cultures
    your icons may not make any sense (in a best-case scenario) or that they are interpreted
    as something totally different from what you intend (worst-case scenario). Conclusion:
    Don''t depend totally on graphics in your program.'
  merge: -1
  img_proc: true
