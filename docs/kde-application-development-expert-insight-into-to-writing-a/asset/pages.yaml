- pgno: 4
  md: '# About the Author


    Uwe Thiem is an experienced KDE programmer/developer who has developed software
    for driverless vehicles, as well as system close software for UNIX. Since discovering
    Linux in the kernel version 0.99pl19, he has written several applications for
    it.


    He took up GUI programming when KDE was launched after finding out that it made
    X programming easier by several magnitudes. Recently he has worked on making KDE
    64-bit clean, and he has started the IT company SysEx (www.SysEx.com.na) in Windhoek,
    Namibia.'
