  md: "# 2.2 Presents from KApplication 17\n\nWe pass a pointer to a string to translate()\
    \ and get a pointer to a string back. One KDE database contains translations of\
    \ common expressions such as 'Open', 'File', and 'Options'. Another KDE database\
    \ has every program that contains translations of expressions used specifically\
    \ by this program.\n\ntranslate() first searches in the program-specific database.\
    \ If it can't find anything, it then searches in the KDE-wide database. This provides\
    \ us with a standard set of common translations that we don't have to worry about\
    \ in our program. Be aware, however, that it also makes possible to overwrite\
    \ KDE-wide translations (if our translation doesn't fit within the context of\
    \ a specific program, for example).\n\nIf no translation is found in either database,\
    \ translate() returns the string which was given as the parameter earlier. This\
    \ makes it possible to work with unfinished translations, too.\n\nThe passed pointer\
    \ is used as the index while searching the databases. Although this method is\
    \ very flexible and doesn't require any special identification for expressions,\
    \ it still sounds rather. Don't be fooled, however; translate() is actually implemented\
    \ so that there won't be any distinct delay on your computers.\n\nKDE is still\
    \ based on the ASCII character set. That's why the possibilities of supporting\
    \ languages are limited to languages that can be expressed with ASCII. Qt 2.0,\
    \ which is probably available with the release of this book, will support Unicode.\
    \ Unicode is a 16-bit character set that provides enough characters for all the\
    \ \"living\" languages. With it, KDE has the possibility to speak all languages\
    \ (at least that's the goal).\n\nYou're not just reading this book for fun, are\
    \ you? My guess is that you probably plan on developing KDE software. If you don't\
    \ see any reason why your program should support multiple languages, you should\
    \ at least internationalize it with i18n(). This isn't much work, and doing so\
    \ makes it possible for other users to integrate your language into the program\
    \ without changing the source code. Who knows, maybe you will change your mind\
    \ in a year. You'll certainly be glad about your decision to include the possibility.\n\
    \n# 2.2.2 Help\n\nKApplication gives us two presents that we can use while creating\
    \ a system for the user. You have already learned about:\n\n```\np = kapp->getHelpMenu(\n\
    \    \"KTSt - The TSP Optimizer\\n\"\n    \"Version 0.0.1\\n\"\n    \"(c) 1999\
    \ Uwe Thiem\\n\"\n    \"uwe@kde.org\" \\);\n```"
