  md: "# 7\n\n# Session Management\n\nBefore we can finish the pure programming part\
    \ of KTSp, we need one more integral property. Open a document with KWrite and\
    \ log out of KDE. When you restart KDE, KWrite will be on the correct desktop\
    \ with the opened document. This feature is called Session Management. It means\
    \ that an application “memorizes” its internal state at the end of a session and\
    \ later restores it at the next session.\n\nNaturally, “memorizes” means saving\
    \ the corresponding data to a file that will be read at the beginning of the next\
    \ session. In our case, it’s $HOME/.kde/share/config/ktsprc.1. Most of it is done\
    \ by KDE—the desktop KTSp has been saved without the size of the window, the position\
    \ of the menubar and toolbar...everything will without a single line of code from\
    \ the programmer. However, KDE doesn’t know anything about the data being edited\
    \ by our program. We have to take care of saving it ourselves.\n\n# 7.1 KTSp Memorizes\
    \ the TSP\n\nThis data is the TSP being processed by KTSp. During the first try,\
    \ we will see if we can get KTSp to load and process the same TSP. A naive approach\
    \ would be to just memorize the filename or the URL. A drawback to this approach\
    \ is that the file could have been deleted between the sessions or that the remote\
    \ computer isn’t online to the URL. It is better to save the data in a temporary\
    \ file and to delete it later when KTSp is automatically started in the next session.\n\
    \nTo make the Session Management possible, we have to change main() a little bit:\n\
    \n```\nint main(int argc, char* argv[]) {\n    KApplication app(argc, argv);\n\
    \    if (app.isRestored()) {\n        RESTORE(KTSp);\n    }\\}\n```"
