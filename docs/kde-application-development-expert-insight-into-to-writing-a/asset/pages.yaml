    \ make sense that Save overwrites the old version with the new without a query\
    \ (and perhaps creates a backup of the old one). It's not what we want in KTSp.\
    \ We don't want to overwrite the original version with the optimized version.\
    \ again. That's why Save doesn't make any sense in this program. We would have\
