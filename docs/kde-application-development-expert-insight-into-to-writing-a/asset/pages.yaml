  md: "# Chapter 2: The First KDE Program: KTSp\n\nThe code that should be executed\
    \ at the termination of the program now has to know that the signal is sent; otherwise,\
    \ this whole exercise senseless. Slots are the receivers. They’re actually normal\
    \ member functions distinguished so that Qt can connect signals to them. The implementation\
    \ of a slot is executed when the signal is received. Before going into detail,\
    \ take a look at this little example:\n\n```\nclass MyClass : QWidget\n{\n  Q_OBJECT\n\
    public:\n  MyApp();\n  virtual ~MyApp();\n\nsignals:\n  void colourChanged(int\
    \ colour);\n\npublic slots:\n  void changeColour(int colour);\n\nprivate:\n  int\
    \ colour;\n};\n```\n\nFirst, take a look at q_OBJECT. Every class declaration\
    \ that contains signals or slots has to have q_OBJECT, too (discussed in more\
    \ detail later). As you can see, the new keywords signals and slots are used like\
    \ normal access specifiers. We declared the signal `colourChanged(int colour);`\
    \ \\`), which obviously should be sent when the widget changes its colour.\n\n\
    The programmer never implements a signal; he can declare it only. Qt takes care\
    \ of the implementation by itself. The return type is always void. A signal can\
    \ have an unlimited number of parameters of any type. You should, however, use\
    \ standard types such as `int`, `char`, and `float`, and avoid using self-defined\
    \ types. That’s how to make sure that slots have not using self-defined types\
    \ can be connected with the signals; it just makes the whole mechanism more flexible.\n\
    \nThe return type of a slot is just like the one of the signal, always void. Just\
    \ signals, slots have an unlimited number of parameters of any type. Standard\
    \ types should be used here as well, just like the signals. Unlike with signals,\
    \ we will assign access to the slots. Their means are:\n\n+   * Public Slots—Every\
    \ class can connect signals with it.\n* Protected Slots—Only the class itself\
    \ and the derived classes can connect signals with it.\n* Private Slots—Only the\
    \ class itself connects signals to it."
