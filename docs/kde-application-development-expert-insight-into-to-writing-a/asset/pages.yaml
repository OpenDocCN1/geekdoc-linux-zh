    actions_num->setGeometry(90, 60, 70, 20 );nconnect( tsp, SIGNAL(actions_num (int
    ))

    actions_num, SLOT(setNum (int )) );

    ```


    Both the QLabels show the number of actions that have been performed during the
    optimization. The first one, actions, is a static QLabel to which we just assign
    the text to be displayed. We internationalize the text with i18n() and prepare
    it for localization (translation). The second QLabel, actions_num, is more interesting.
    With the help of connect(), we connect it with the Signal actions(), which is
    sent by Tspdaa. That''s all we have to do guarantee that the current number of
    actions sent by the calculation will display.


    Lazy programmers will use the second parameter that we pass along to the constructor
    of QLabel. It is a pointer to the parent widget. Child widgets are automatically
    deleted if the parent widget is deleted. In other words, we don''t have to bother
    with deleting child widgets in the destructor of the parent widget. Qt automatically
    takes care of that for us. This property of Qt and KDE—which KDE inherits from
    Qt—prevents tons of memory leaking possibilities!


    All widgets provided by Qt, just like all widgets of KDE, have this property.
    We need only to specify a parent, because the constructor will specify parent
    = 0 if we do not do it. Unless specified, widgets know a parent and there is no
    automatic deletion.


    All widgets contain a member function setGeometry(x, y, w, h). x and y are the
    coordinates of the upper-left corner of the widget relative to the parent widget.
    Width and height can be adjusted over w and h. The layout discussion examines
    more (and better) ways to adjust widget geometry.


    QLabel contains the setNum(int ) and setNum ( double ), which makes it possible
    to connect the QLabel actions_num directly. This means that the QLabel can frequently
    change its content upon receipt of a signal from Tspdaa. This feature is realized
    in the line where connect() is called.


    Whenever Tspdaa sends a new value, actions_num automatically displays it—a fine
    thing, which eases the work of the programmer significantly.


    The counterpart to connect() is disconnect(), which can break a connection between
    signals and slots. You can disconnect only if you don''t want the signal to receive
    anymore (which would be very seldom). When either the object that sends the signal
    or the object that receives the signal gets deleted, you don''t have to break
    the connection explicitly (although it''s up to you whether you want to). Qt automatically
    takes care of this task for you.'
