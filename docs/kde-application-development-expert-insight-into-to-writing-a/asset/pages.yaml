  md: '# 3.2 The Solution: GDA


    Let''s be honest: Programmers are a breed apart. They use their skill (and perhaps
    a bit of magic) to get things that others can''t—from the Global Positioning System
    (GPS) to the special effects (all based on programmed calculations) in the movie
    Titanic. That''s why we (programmers) can''t get over the fact that nowadays feels
    in boring, everyday life. Yes, in fact, we probably are geeks.


    Many techniques have been developed to calculate better solutions for a variety
    of tasks. Those techniques, although beyond the scope of this book, are available
    in most every computer science handbook. We''re not here to do math. We''re here
    to solve a real problem.


    The mathematician searches for the global optimum. The workshop manager who wants
    to produce work units as cheaply as possible is pleased with a local optimum coming
    close to the global one. Actually, he doesn''t care how he comes to the global
    optimum so long as he gets a solution that is significantly better than the one
    he used so far. If he needs 9 minutes for his work piece rather than the 10 minutes
    needed before, he''ll be very pleased. Apart from the setup time of the drilling
    machine, he saves 10% of machine usage. This can add up to a lot of money.


    Just like the workshop manager in the preceding paragraph, we do not have to seek
    the global optimum. We can give up the goal of finding the shortest circuit and
    content ourselves instead with a short circuit. That is, rather than search for
    the best solution, we can accept a good solution (even our definition of “good”
    can be flexible). We want to solve a practical task; it''s not our goal to write
    a theoretical dissertation.


    In 1990, Professor Gunter Dueck and Tobias Scheuer introduced their new Threshold
    Accepting Algorithm (TAA) in the Journal of Computational Physics in the article
    titled “Threshold Accepting: A General Purpose Optimization Algorithm Appearing
    Superior to Simulated Annealing.” The exciting thing with this new algorithm was
    that it was fully deterministic, compared to Simulated Annealing (SA), for example,
    which made use of random numbers. TAA used significantly less CPU time than SA
    and provided at least as good results as SA.


    In 1999, Professor Dueck released the article “New Optimization Heuristics—The
    Great Deluge Algorithm and the Record-to-Record Travel,” again in the Journal
    of Computational Physics. I want to explain the Great Deluge Algorithm (GDA) a
    little bit. Just like the TAA, it''s fully determministic.


    First we need to think of our problem scenario in three-dimensional terms, as
    a place. Then we can determine the lay of the land—that is, learn'
