  md: '# 2.3 Signals and Slots 21


    With a Quit button, we probably don''t have to be concerned about pressed() and
    released()—at least I can''t think of any logical use (so it''s okay with us that
    they don''t anything). We''ll only overwrite clicked() and insert the code for
    our version of the function that will be called at the termination of the program.
    It''ll probably check whether the program contains changed data and a corresponding
    dialog box that asks whether the data be saved.


    This sounds a lot better. We won''t jump around in the program over pointers to
    functions, but a class does what it was made for. Although the compiler guarantees
    type safety, something still seems amiss. Imagine a program with widgets rather
    than just a few dialog boxes, buttons, icons, and combo boxes. The poor programmer
    will have to derive classes the whole time even he wants to check only one button.
    This won''t be a problem so long as we provide a small user interface with menus,
    a few dialog boxes, and some icons on the toolbar. If, on the other hand, we provide
    a rich interface, we must write hundreds of lines of code—when we really want
    to focus on the functionality of our program.


    Other ways exist to fix this problem. In the Windows world, it''s normal to use
    macros, for example; but they can never provide any type safety. All the previously
    discussed ways are absolutely practical and not just theoretical, but all have
    at least one disadvantage. They definitely mean more work for the developer because
    they''re either insecure and lead to a lot of debugging, or they demand so many
    lines of code from the beginning. That''s something for workaholic. We want it
    earlier!


    # 2.3.2 A New Approach: Signals and Slots


    We want type safety and as little as possible. The Trolls responded to our demands
    with a new way, their own signals and slots. To say it right at the beginning:
    the signals in Qt represent something totally different from UNIX signals, although
    both of them are a kind of asynchronous communication.


    The idea behind this is that a widget sends a signal to inform its environment
    something changed in the widget. In our example, the Quit button sends the signal
    clicked(). For the widget, it doesn''t matter whether something will receive the
    signal. It informed its surroundings (the program as the whole), "I''ve been clicked,"
    and the widget has fulfilled its responsibility. Actually, this orientates the
    C++ way more than the virtual methods discussed in the preceding section. It''s
    not the responsibility of the Quit button to check whether the data of the program
    has been changed and whether to start other actions.'
