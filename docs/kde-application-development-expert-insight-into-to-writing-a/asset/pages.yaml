    # 5.1 The Directory .kde in the Home Directory


    In the home directory of every user, KDE creates a hidden directory called .kde.
    It contains a lot of information about the individual programs in it. The directory
    tree of $HOME/.kde normally looks like that shown in Figure 5.1. Under $HOME/.kde/share/apps/,
    you can see another bunch of directories with the names of popular KDE programs.
    That''s where applications can save their application-specific files. The other
    interesting directory is $HOME/.kde/share/config/. All the configuration files
    of the programs that have been started at least once are in it, with the name
    of the program and rc (for "resources") appended to the name. It would be "ktsprc"
    for our program; and actually there''s really a file in it, but it''s empty because
    we haven''t saved the configuration yet.'
