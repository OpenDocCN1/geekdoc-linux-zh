  md: "# 6.6 Lifelacing 127\n\nThe differences between the values received by ActionsDisplay\
    \ are significantly larger than the ones of RunsDisplay. That’s why we don't have\
    \ to use the trick with the “base value.” However, once again, we have another\
    \ problem coming up. The first result is the length of the non-optimized TSP.\
    \ As a rule, this value is so large that it can't be used for the vertical scale.\
    \ If we used it, the graph would be practically invisible. We just skip it and\
    \ use the second one for the scale. The missing break in the case statement isn't\
    \ really missing. The value is used not only for the scale, but also to be displayed.\n\
    \nAlong with the lifelacing, we've added another small feature. Programs such\
    \ as KWrite can be called with a command-line parameter. The program interprets\
    \ it as a filename or an URL and tries to open the corresponding file. If you\
    \ have a *.xlink file for your desktop (or panel), you start the program by clicking\
    \ on the icon. It has worked with KTsp, too. You can drop a file on the icon and\
    \ the program start and open the file. It'll only work, however, if your program\
    \ understands the command-line parameter.\n\nWe want to include this useful property\
    \ in KTsp. We need to make only a few changes:\n\n```\nint main(int argc, char\
    \ *argv[])\n{\n    KApplication app(argc, argv, \"KTsp\");\n    QString s;\n \
    \   if (argc > 1) {\n        KURL *url = new KURL(argv[1]);\n        CHECK_PTR(url);\n\
    \        if (url->isMalformed()) {\n            s = QDir::currentDirPath();\n\
    \            s += \"/\";\n            s += argv[1];\n            delete url;\n\
    \            url = new KURL(s);\n        }\n        delete url;\n    }\n    KTsp\
    \ *ktsp = new KTsp(s);\n    CHECK_PTR(ktsp);\n    ktsp->show();\n    return app.exec();\n\
    }\n```"
