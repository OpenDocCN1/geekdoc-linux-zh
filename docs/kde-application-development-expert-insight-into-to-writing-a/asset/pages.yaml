- pgno: 11
  md: '# Preface


    A friend urged me to take a look at the then still-embryonic KDE at the beginning
    of 1997. After having done so, my whole attitude toward X changed within one week.
    Even though I was an experienced UNIX and Linux programmer, I always tried to
    avoid X—not as a user, of course, but as a programmer. My fainthearted attempts
    to become involved in X programming always stopped quite early because of the
    complexity of the subject matter.


    With KDE (and the early Qt of Troll Tech), X programming became easy for the first
    time (if programming ever be said to be really easy). This is why KDE has grown
    from an idea to the standard desktop for Linux and why it has gained wide acceptance
    in the UNIX in general within the two and a half years that have passed since
    Matthias Etrich''s call for programmers in October 1996.


    During the past 12 months, KDE also managed to change my whole perception. Prior
    to KDE, Linux had always been a synonym for server (from my point of view). Stable,
    fast, reliable, moderate when it comes to hardware: These are the properties that
    made Linux the ideal operating system for servers. With KDE, Linux got the chance
    to gain a significant share of the desktop market for the first time.


    Easy and consistent use for users on the one hand and fast, simple, and efficient
    development of applications for the programmers on the other hand: These two factors
    will enable KDE and Linux to penetrate the desktop market.


    This book would like to drive this process further. More often than not, the first
    steps in a new development environment are the most difficult ones. Heavy reference
    manuals are of little help in that situation. It is the “getting started” that
    is needed badly. Accordingly, I have concentrated on those things needed by the
    KDE developer-to-be to write his first application.


    I was not really interested in writing a bunch of tiny “Hello World” programs
    to demonstrate the use of each and class and widget in KDE. Together, we will
    develop a real application during the course of the book instead. That’s more
    fun (at least for me) and closer to actual practice.


    For those who have remained skeptical of X programming thus far, I hope to open
    the door to software development for this new desktop. The future of desktop computing
    has already begun.


    Uwe Thiem

    uwe@kde.org

    Windhoek, Namibia

    October 1999'
  merge: -1
  img_proc: true
