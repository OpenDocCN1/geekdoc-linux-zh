- pgno: 47
  md: 'about the topography of the place. All the possible circuits are mapped on
    the XY plane; the similar ones are close to each other. In the Z direction, we
    determine the quality of every circuit. Because the TSP only discrete solutions,
    we won''t get a continuum. Instead, we get discrete points in the solution space.
    We can connect these points with each other so that the whole thing looks like
    a grid (just like function plotters draw).


    The highest peak (or summit) in the solution space obviously represents the global
    optimum. A lot of other peaks appear as well; these represent local optima. The
    bad solutions appear, obviously, the flat or deep areas. A priori we can''t assume
    this landscape''s appearance: We can''t know whether it will look like a dune
    landscape with mostly similar peak levels or more like the Himalayas with a large
    number of peaks with different heights (including many high ones).


    Now it''s to put GDA on a randomly chosen place in the solution space. Randomness
    applies in this instance only; we don''t use it again. From now on, everything
    will be strictly deterministic. The next step is to let it rain on the landscape.
    With time, the water will accumulate in the valleys, and the water level will
    ascend until only the highest summit is left. GDA is allowed to move with little
    steps—this means only to flankingthrough the solution space. There''s only one
    restriction: Our algorithm might not get wet feet. It can move only on dry land.
    The process is finished when our algorithm can''t move anymore, which means it''s
    surrounded by water.


    Our algorithm might be stranded on the summit or on a totally unimportant optimum.
    However, the probability is against it. The solution space as three dimensional.
    In reality, it has a lot more dimensions mapped on the XY plane. The more dimensions,
    the more ways from one point to the other (and fewer passes). Our algorithm has
    a lot of possibilities to move. The ascending water level cuts its way a lot less
    than in three-dimensional imaginings.


    Still, GDA might find itself stranded on the summit of the Spitzkoppe in Namibia².
    That''s why we''ll run GDA many times, every time from a random place in the solution
    space, and use the best result. We could still get results we don''t like, possibly
    over and over. But we can apply the practical approach (like our workshopmanager
    example earlier): If the result is worse than the solution we are currently using
    so far, we just ignore it or calculate some until we''re pleased with one. In
    serious applications, we would run GDA between 50


    ² The Spitzkoppe is a mountain in the Namib Desert. Although though it would be
    strange to see the mountain surrounded by water, we can still imagine such an
    event.'
