    We will get a line with msgid and the text as a string for every text found. A
    second line begins with msgstr and contains an empty string. The empty string
    will later contain the translation (in our case, German).


    We move the file ktsp-0.1.0/ktsp.po to ktsp-0.1.0/po/ktsp.pot. It will serve as
    the template for other translations. Now before we start deleting a lot of items,
    it''s important to consider what we can keep and what we should ditch. Nearly
    all KDE programs have a menu called File. It doesn''t make sense to translate
    this expression for every program. You can find the kde .pot in the source of
    the KDE libraries (kdelibs). Every text included in it can be deleted from ktsp.pot,
    if it means the same in your program,2 KDE is intelligent enough to find the correct
    translation nonetheless. When we finish this exercise, we will get our real template.


    We''ll copy it from ktsp-0.1.0/ktsp.po to ktsp-0.1.0/po/ktsp.pot and start with
    the translations. The following represents a small part from de.po that has already
    been translated:


    ```

    # ktsp.C:392

    msgid "Generating neighbours"

    msgstr "Nachbarn erzeugen"

    ```


