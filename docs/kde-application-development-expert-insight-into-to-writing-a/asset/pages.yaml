    # 10.4 Icons and Other Small Files


    Besides source code, KDE projects have another bunch of important files for the
    GUI programs. You have already learned about the translation and the online Help.
    Icons are essential GUI elements that every program needs. There''s the icon representing
    the program itself. We need it in two variants. The normal size, which is used
    on the desktop and on the panel; and a mini icon, which is used on the title bar
    of the program window, in the menus of the panel, and on the taskbar.


    # 10.4.1 Icon and Mini Icon


    Because you need an icon for your program, you''ll have to do it on your own.
    KIconEdit, an excellent tool, can help you with this task. KIconEdit automatically
    takes care of the correct size and the correct color palette, because there are
    still a lot of 8-bit displays. The KDE icons are all drawn with the same color
    palette being displayed by KIconEdit right next to the drawing. It helps to leave
    enough colors for the application itself on the old displays.


    If you don''t think you can draw something representing your program adequately
    and looking something aesthetic, you can contact the KDE artist team, which has
    developed most of the icons for KDE. You should give them a description of your
    program and maybe a sketch of the icon so that they can imagine how the program
    might best be represented. The coordinator of team at the printing of this book
    is Torsten Rahen (torsten@kde.org). Please remember that the artists are volunteers,,


    > 3 Attention! If your Linux distribution isn''t up to date, you might need a
