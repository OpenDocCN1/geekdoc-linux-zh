    # 3.6 A Short Tour of Some of the Help Classes


    Tsp10 is a fairly simple class at the moment. All it can do is randomly create
    a TSP and return it to the caller. It''ll become more complex over the course
    of time. As soon as it can load and save TSPs, we''ll take a close look at it
    (because we''ll use the functionality of Qt). The next step is to create network-transparent
    IO operations. Tsp10 will teach the KDE mechanism how to use FTP.


    We''ll take a close look at this, too. Finally, we''ll implement drag and drop.
    It''s not worth getting ourselves bogged down in the details just yet, however.


    Random is the other class that we need. It is totally independent of Qt and KDE.
    I''ll leave it to thanking Makoto Matsumoto and Takujii Nishimimura for developing
    this extremely fast algorithm, which provides very good random numbers. Faults
    in the implementation—if there are—are my fault and my fault alone.'
