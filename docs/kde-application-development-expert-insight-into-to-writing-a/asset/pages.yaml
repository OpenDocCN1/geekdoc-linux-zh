  md: '# 5.2 KConfig


    The configuration files are pure ASCII files and are readable by humans just like
    any text editor. I don''t want to encourage you to change this file by hand at
    all. It''s the opposite: Hands away from it! If something goes wrong and the files
    are corrupt, it is really practical and useful that the user—or if not you, then
    probably the system administrator—can repair the configuration. All configuration
    files have the following structure:


    ```

    # KDE Config File

    [Group name]

    Parameter name=value

    ```


    The first line characterizes the file as a configuration file. Names of groups
    of parameters appear in the rectangular brackets. Such names might include Colours,
    Appearance, Fonts, or any name of a corresponding group of program-important parameters.
    Within every group, the corresponding parameters are listed. Every line contains
    the parameter name, an equal sign, and on the right side of the equal sign (the
    “equals” side), the value that has to be set. The value could be a string, such
    as a number. In an email program, the configuration file could contain the following
    section:


    > That''s why KDE has chosen this form for configuration files. It takes a little
    longer to read and evaluate them than is the case with binary files, but they
    can be repaired rather easily.


    ![](img/45a3abfe173d274ae06c571b14950e5b_109_0.png)'
  merge: -1
  img_proc: true
