- pgno: 178
  md: '# 12


    # Helpers


    So far, we’ve done everything “by hand.” It was necessary to understand how KDE
    works and where problems can come up. KDE offers the programmer tools, however,
    to hopefully ease the programmer’s life. This chapter discuss exactly what tools
    are.


    # 12.1 Integrated Development Environments


    Integrated Development Environments are not everyone’s cup of tea, at least not
    under UNIX. Emacs users swear that nobody needs anything else. Vim fans back them
    up and say the same about Vim. The reality is, for those of us who don’t sleep
    with their keyboard, IDEs are a real blessing: They perform a lot of small work
    for us (generating correct Makefiles, for example).


    KDE exists because many different applications relate to it, making it easy (well,
    easy enough) for programmers to develop their goods. Qt and KDE provide an excellent
    “application framework” that enable developers to write appealing programs with
    a small amount of code. IDEs take care of the “little things.”


    # 12.1.1 KDevelop


    At the time of this writing, KDevelop is available in the version 1.0beta3. Although,
    the KDevelop developers claim that the program is still in the beta state, it
    is already perfectly usable to develop applications with it. Figure 12.1 shows
    the main window of KDevelop. You can get it at www.kdevelop.org/. This site has
    the latest news, including the current developers’ plans.'
  merge: -1
  img_proc: true
