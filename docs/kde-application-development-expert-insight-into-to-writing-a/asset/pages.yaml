- pgno: 166
  md: '# Automated Make Process


    As a developer, you have probably written a whole lot of non-trivial programs.
    You''re familiar with make and Makefiles. Perhaps, you have wondered why Makefiles
    are always so big in KDE, whereas you normally get along with 30 or maybe 50 lines.
    This chapter discusses KDE''s Makefiles are so big, and how you can get to an
    automatic build process without a lot of work.


    # 10.1 KDE Doesn''t Just Run on Linux


    The fact that KDE doesn''t run on Linux is the most important reason why the KDE
    Makefiles are so complicated. Even Linux doesn''t always equal Linux. For example,
    from many of the socket functions of Linux/Alpha are declared differently from
    those in Linux/Intel. And besides those, KDE also runs on FreeBSD, Solaris, and
    HPUX. Users have even got it to work on IRIX, True64 (formerly Digital UNIX),
    and other UNIX variants.


    In addition, several X Alone under Linux, three different standard X variants
    exist: XFree86, AcceleratedX, and Metro-X; and all support the X protocol, but
    still have small differences. On commercial UNIX variants, there are the proprietary
    X servers of the UNIX vendors. Normally, Qt hides these small things from the
    application developer, but some programs have to work well together with the X
    server (for example, screen savers).


    Put simply, KDE has to be portable. If you''ve ever written programs for a bunch
    of UNIX variants using more than cin, cout and cerr, you''ll know how fast Makefiles
    grows with the number of supported platforms and how fast the source gets confusing
    with all the #ifdef. KDE tries to go around these difficulties by using autoconf
    and automate.


    You start every installation of a new version of KTSp with this line:

    ./configure'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'This command analyzes the system in depth. That''s why it runs for a relatively
    long time, depending on the performance of your computer. It doesn''t just guess:
    "Aha, we''re on a FreeBSD system, so..."; it really checks for special headers,
    the parameters needed by some functions, whether there are special libraries installed
    on the system, and what functionality is provided. It compiles little programs
    and checks them for errors.


    After it retrieves all the information, it generates the Makefiles in each directory
    of the project from the Makefile.in files. The Makefile will be used by "make".
    In addition, it creates a file named config.h in the main directory, which should
    be included via #include, by all source programs that might need specific system
    knowledge.


    Instead of writing Makefiles, we write Makefile.in. However, even Makefile.in
    tends to be long and complicated. That''s why we use another tool to automatically
    create Makefile.in.


    # 10.2 automake


    automake takes care of this task. It generates Makefile.in from the Makefile.am.
    With automate we are finally where we wanted to be. It is really simple. Take
    a look at ktsp-0.2.0/Makefile.am:


    ```

    # This file you have to edit. Change the name here

    SUBDIRS = ktsp po

    ```


    ```

    # not a GNU package. You can remove this line, if

    # we have all needed files, that a GNU package needs

    AUTOMAKE_OPTIONS = foreign

    ```


    It has only two items. The first specifies the subdirectories of ktsp-0.2.0. The
    second one states that although it''s licensed under the GPL, it''s not a real
    GNU package and doesn''t need all the Free Software Foundation (FSF) files. That''s
    all. automake generates the 412-lines-big Makefile.in out of it.


    The file ktsp-0.2.0/Makefile.am is somewhat more complicated, but still easy compared
    to Makefiles for portable programs:


    ```

    # these 10 paths are KDE specific. Use them:

    # kde_htmdir Where your docs should go to. (contains lang subdirs)

    # kde_appsdir Where your application file (.kdelnk) should go to.

    # kde_icondir Where your icon should go to.

    # kde_sounddir Where system sounds should go to.

    # kde_datadir Where you install application data. (Use a subdir)

    # kde_locale Where translation files should go to. (contains lang subdirs)

    ```


    > 1 You can find the GPL on the New Riders website.'
  merge: -1
  img_proc: true
