    KCCode::Quit is the predefined shortcut. KDE knows a total of 18 of these shortcuts,
    as identified in the following table.


    | Action | Shortcut |

    |---|---|n| Close | Ctrl+W |

    | Copy | Ctrl+C |

    | Cut | Ctrl+X |

    | End | Ctrl+End |

    | Help | F1 |

    | Home | Ctrl+Home |

    | Insert | Ctrl+Insert |

    | New | Ctrl+N |

    | Next | PageDown |

    | Open | Ctrl+O |

    | Paste | Ctrl+V |

    | Print | Ctrl+P |

    | Prior | PageUp |

    | Quit | Ctrl+Q |

    | Replace | Ctrl+R |

    | Save | Ctrl+S |

    | Undo | Ctrl+Z |


    Not all these shortcuts are useful in every program. The programmer has to decide
    which ones he wants to use. Then the developer defines the exact meaning in the
    context of the program by connecting the corresponding slots with the shortcuts.
    In an editor, Next is certainly the next page; in a graphics program, however,
    it probably refers to the next picture. After all is said and done, the lazy programmer
    can essentially rely on a set of predefined shortcuts that cover most actions.


    Shortcuts are language independent! No matter which language the KDE activates,
    Ctrl+Q is always Quit. Although in some languages the shortcut designations might
    look a bit strange, the language-independent consistency does make the shortcuts
    easier to remember and, therefore, easier to use.'
