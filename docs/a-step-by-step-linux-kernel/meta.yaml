    \ ourselves the **MAYBE_BUILD_ON**\n\n```\n#define BUILD_BUG_ON(cond) ((void)sizeof(char[1-2\
    \ * !!(cond)]))\n```\n\nIf the condition is true, it will trigger an allocation\
    \ with a negative size which will cause a compilation error. Pretty handy!\n\n\
    Mimicking a simple structure is easy, just to know what the kernel does:\n\n```\n\
