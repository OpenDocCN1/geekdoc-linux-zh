    {\n    int lock;\n    struct list_head task_list;\ntntyped int (*wait_queue_func_t)(void\
    \ *wait, unsigned int flags, void, void *key);\nstruct wait_queue\n{\n    unsigned\
    \ int flags;\n    #define WQ_FLAGS_EXCLUSIVE 0x01\n    void *private;\n    wait_queue_func_t\
    \ func;\n    struct list_head task_list;\n};\n```\n\nThat's it!\n\nOn the other\
