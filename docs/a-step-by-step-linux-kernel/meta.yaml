    \ To keep it simple, consider that the first object address is s_mem, the second\
    \ object is s_mem + obj_size, the third is s_mem + 2*obj_size... This is actually\
    \ quite complex because of \"colouring\" used for hardware efficiency, but is\
    \ out-of-sync.\n\n# # Slabs Housekeeping and Buddy interactions\n\nWhen a new\
    \ slab is created, the slab allocator asks the Buddy for page frames. When a slab\
    \ is destroyed, it gives its pages back to the Buddy. Of course, the kernel tries\
    \ to reduce slab/defragmentation for performance reasons.\n\n**NOTE:** one might\
    \ wonder why gpuorder(struct kmem_cache) is the \"logarithm number of contiguous\
    \ page frames. The reason is that the Buddy allocator does not work with bytes\
    \ sizes. It works with power-of-two \"order\". That is, an order of 0 means 1\
    \ page, order of 1 contiguous pages, order of 2 means 4 contiguous pages, etc.\n\
    \nFor each cache, the slab allocator creates three doubly-linked lists of slabs:\n\
    \n+   - full slabs: all objects of a slab are used (i.e. allocated)\n- free slabs:\
    \ all objects of a slab are free (i.e. the slab is empty)\n- partial slabs: some\
    \ objects of the slab are used and other are free\n\nThese lists are stored in\
    \ the cache descriptor (struct kmem_cache) in the nodelist. Each slab belongs\
    \ to one of these lists. A slab can be moved during allocation or free operations\
    \ (e.g. when allocating the last object of a partial list, the slab is moved to\
    \ the full slabs list).\n\nIn order to reduce the interaction with the Buddy,\
    \ the SLAB allocator keeps a pool of several free/partial slabs. If every slab\
    \ is full, an allocation tries to find a free object from those lists. If it fails,\
    \ the Slab needs to create new slabs by asking the page to the Buddy. This is\
    \ known as cache_grow() operation. If the Slab has \"too much free free, it gives\
    \ some pages back to the Buddy.\n\n# ## Per-CPU Array Cache\n\nIn the previous\
    \ section, we've seen that during allocation, the Slab needs to scan the free\
    \ or the partial slabs list. Finding a free slot through scanning is somewhat\
    \ inefficient (e.g. accessing lists requires some locking, to find the offset\
    \ in the slab, etc.)"
