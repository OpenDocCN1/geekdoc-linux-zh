    \ This is not a skippable step, exploit the kernel when your crash happens (as\
    \ we experienced it).\n\nA common way to exploit UAF in the Linux kernel is through\
    \ **type confusion**. A type confusion occurs when the kernel misinterprets the\
    \ data. It uses data (a pointer) that it thinks is one type actually points to\
    \ another type of data. Because it is done in C, type checking is performed during\
    \ compilation. **The cpu actually doesn't care about types, it only references**\
