  md: "In order to allocate memory, the Slab stores objects of a fixed size. This\
    \ is achieved by using an array of struct kmem_cache,\n\n```\nstruct array_cache\
    \ {\n// number of pointers available AND index to the first free slot\n    unsigned\
    \ int avail;                 // maximum number of pointers\n    unsigned int list;\n\
    \    unsigned int batch;\n    unsigned int touched;\n    spinlock_t lock;\n  \
    \  void *entry[];                     // the actual pointers array\n}\n```\n\n\
