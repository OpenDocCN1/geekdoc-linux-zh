    # CVE-2017-11176: A step-by-step Linux Kernel exploitation (part 3/4)


    Tue 02 October 2018 by Lexfo in Vulnerability


    - Linux

    - Exploit

    - Vulnerability

    - Kernel

    - Step-by-step


    ## Introduction


    In the previous article, we implemented a proof-of-concept that triggers the bug
    from usersland, dropping kernel modifications with Tap in part 1.


    This article starts by introducing the memory subsystem and the SLAB allocator.
    Those are such huge topics that we strongly recommend the reader to explore the
    resources pointed out. Understanding them is absolutely mandatory to exploit any
    kind of use-after-free (UAF) or heap overflows.


    The basic theory about use-after-free is well explained, as well as the information
    gathering strategies required to exploit them. We will try to apply it to the
    bug and analyze different primitives available in our particular bag. A reallocation
    strategy will be presented to turn the use-after-free into an arbitrary call.
    In the end, we will be able to panic the kernel in a controlled manner (no random
    crash anymore).


    The techniques exposed here are a common way to use-after-free in the Linux Kernel
    (type confusion). Moreover, we choose to exploit the use-after-free as an arbitrary
    call because of hardcoded stuff; the exploit cannot be targetless, nor bypass
    kASLR (the kernel version of Address Layout Randomization).


    Note that this may be exploited in various ways to gain other primitives (i.e.
    read/write) and by bypassing kASLR/SMAP/SMEP (we will bypass SMEP in part 4 however).
    The proof-of-concept code is in hand, this is where we can actually be creative
    as an exploit writer.


    In addition, kernel runs in a very chaotic environment. While it was not a problem
    in previous articles, now it will (due to reallocation). That is, there is one
    place where your exploit can fail (because you''ve been raced), it will mostly
    be here. Reliably relying on an open field subject, some complex tricks cannot
    fit in this space.


    Finally, because kernel structure layout will matter now, and those being different
    in the debug/production kernel, we will say goodbye to System Tap as it can''t
    run on a production kernel. It is what we need to use more classic tools in order
    to debug the exploit. Furthermore, your structure layouts will be different from
    ours, the exploit provided here won''t work on your system without modifications.


    Get ready to crash (a lot), this is where the fun begins:-.


    ## Table of Contents


    - Core Concepts #3

    - Use-after-free 101

    - Analyze the UAF (cache, allocation, free)

    - Analyze the UAF (dangling pointers)

    - Exploit (Reallocation)

    - Exploit (Arbitrary Call)

    - Conclusion (Wait, the text ends at Core Concepts)


    ## Core Concepts #3


    The third ''core concepts'' section introduces the memory subsystem (also called
    ''mm''). This is such a vast subject that exists only to cover this part of the
    kernel. Because this section isn''t sufficient, it is recommended to read the
    following documentations. Nevertheless, we will present the data structure of
    the Linux kernel to manage memory so it can be on the same page (pun intended).


    - Understanding the Linux Kernel (2,8,9)

    - Understanding The Linux Virtual Memory Manager

    - Linux Device Driver: Allocating Memory

    - OSDev: Paging


    At the very least, please read the chapter 8 of "Understanding The Linux Virtual
    Memory".


    In the end of this course, we will include the container_of() macro and present
    a case of doubly-linked circular list in the Linux kernel. A basic example will
    be developed using the list_for_each_entry_safe() macro (mandatory for exploit).


    ## Physical Page Management


    One of the most critical tasks of any operating system is to manage memory. It
    has to be fast, secure, stable and minimize fragmentation. For efficiency reasons,
    the memory is divided into a fixed-length block of contiguous memory. This block
    is called a page frame and (generally) has a size of 4096 bytes. It can be retrieved
    using the PAGE_SIZE macro.


    Because the kernel must manage it, it keeps track of every free physical page
    as well as information about them. For instance, it has to know if a particular
    page is free or not. Which kind of information is stored in a `struct page` data
    structure (also called "Page Descriptor").


    The kernel can request one or more pages with `alloc_pages()` and `free_pages()`.
    The allocator to handle these requests is called the Zone Page Allocator. Since
    it uses a buddy system algorithm, it is often called the Buddy Allocator.


    ## Slab Allocators


    The generosity offered by the buddy is not suitable for every situation. For instance,
    if the kernel only wants to allocate 128 bytes of memory, it might ask for a page
    and 3968 bytes of memory will be wasted. This is internal fragmentation. To overcome
    this, Linux implements fine-grained allocators: Slab. To keep it simple, the Slab
    is responsible for handling the management of `malloc()` for the kernel.


    The kernel offers three Slab allocators (only one is used):


    - SLAB allocator: the classic, focused on hardware cache optimization (Debian
    still uses it)

    - SLUB allocator: the ''new'' slab allocator since 2007 (by Ubuntu/CentOS).

    - SLOB allocator: designed for embedded systems with very little memory.


    NOTE: We will use the following naming convention: Slab is "a" Slab allocator
    (be SLAB, SLUB, SLOB).


