    # Physical Page Management


    One of the most critical tasks of any operating system is to manage memory. It
    has to be fast, secure, stable and minimize fragmentation. For efficiency reasons,
    the memory is divided into a fixed-length block of contiguous memory. This block
    is called a page frame and (generally) has a size of 4096 bytes. It can be retrieved
    using the PAGE_SIZE macro.


    Because the kernel must manage it, it keeps track of every free physical page
    as well as information about them. For instance, it has to know if a particular
    page is free or not. Which kind of information is stored in a struct page data
    structure (also called "Page Descriptor").


    The kernel can request one or more pages with alloc_pages() and free_pages().
    The allocator to handle these requests is called the Zone Page Allocator. Since
    it uses a buddy system algorithm, it is often called the Buddy Allocator.


    # Slab Allocators


    The generosity offered by the buddy is not suitable for every situation. For instance,
    if the kernel only wants to allocate 128 bytes of memory, it might ask for a page
    and 3968 bytes of memory will be wasted. This is internal fragmentation. To overcome
    this, Linux implements fine-grained allocators: Slab. To keep it simple, the Slab
    is responsible for handling the management of malloc() for the kernel.


    The kernel offers three Slab allocators (only one is used):


    +   - SLAB allocator: the classic, focused on hardware cache optimization (Debian
    still uses it)

    - SLUB allocator: the ''new'' slab allocator since 2007 (by Ubuntu/CentOS).

    - SLOB allocator: designed for embedded systems with very little memory.


    NOTE: We will use the following naming convention: Slab is "a" Slab allocator
    (be SLAB, SLUB, SLOB). The Slab (capital) is one of the three allocators. While
    a slab (lowercase) is an object used by Slab-allocators.


    We cannot cover every Slab allocator here. We detail the SLUB allocator which
    is well documented. The SLUB seems to be more widespread and there isn''t much
    documentation about the code itself. Frankly, we think (that) the SLUB is easier
    to understand. There is no "cache coloring", there is no internal/external slab
    management. In order to know which slab to use on your target, check the file


    ```

    $ grep "CONFIG_SLAB=" /boot/config-$r

    ```


    The reallocation depends on the deployed Slab allocator. While being more complex
    than, it is easier to use alloc-free on the SLAB than On the other hand, exploiting
    the SLUB brings another benefit: slab aliasing (i.e. more objects are stored in
    the "general" kmemcaches).


    # Cache and slab


    Because the kernel tends to allocate objects of the same size again and again,
    it would be insufficient to request/release pages of the same memory area. To
    prevent this, the Slab allocator stores objects of the same size in a cache (a
    pool of allocated pages). A cache is described by the struct kmem_cache (also
    called "cache descriptor").'
