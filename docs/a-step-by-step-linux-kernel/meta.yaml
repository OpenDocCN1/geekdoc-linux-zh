    \ // holds list of empty/partial/full slabs\n    struct array array[NR_CPUS];\
    \ // per-cpu cache\n};\n```\n```\n\nThe objects are stored in slabs. A slab is\
    \ basically one or more contiguous page frames(s). A single slab can hold num\
    \ objects of obj_size. For instance, a slab spanning across a single page (4096\
    \ bytes) can hold 1024 objects of 4-byte size.\n\nThe status of a slab is described\
    \ by the struct slab (also called \"slab management structure\"):\n\n```\n```c\n\
    struct slab {\n    struct list_head head;      // virtual address of the first\
    \ object\n    unsigned long colourff;\n    void *s_mem;\n    unsigned int inuse;\
    \         // number of \"used\" object in the slab\n    kmem_bufctl_t free;  \
    \       // the use/free status of each objects\n    unsigned short nod;\n};\n\
    ```\n```\n\nThe slab management structure can be stored in the slab itself (internal)\
    \ or in another memory location (external). The rationale behind this is avoid\
    \ external fragmentation. The slab management structure is stored depending on\
    \ the size of cache. If the size is smaller the slab management structure is stored\
    \ inside the slab otherwise it is stored externally.\n\n**NOTE:** Do not worry\
    \ too much about internal/external, unless you use a use-after. On the other hand,\
    \ if you have a heap overflow, this would be mandatory.\n\nRetrieving the virtual\
