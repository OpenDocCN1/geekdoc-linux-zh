    .\n.\n.\n.\n.\n.\n.\n.\n.\nWait, I see I didn't output the full text correctly.\
    \ \n(Please see below)\n\n[content]\nThat is, we are in the current situation:\n\
    \n| file cnt | sock cnt | [fd3] | [fd4] | [fd5] | file_ptr->private_data | socket_ptr->sk\
    \ |\n|---|---|---|---|---|---|---||\n| 3 | 2 | file_ptr | file_ptr | file_ptr\
    \ | socket_ptr | socket_ptr |\n\nThe difference between **socket_ptr** (struct\
    \ socket) and **sock_ptr** (struct netlink_sock).\n\nLet's assume that:\n\n- fd3\
    \ is \"sock_fd\"\n- fd4 is \"unblock_fd\"\n- fd5 is \"sock_fd2\"\n\nThe `struct\
    \ file` associated to our netlink socket has a counter of **three** because of\
    \ 1 socket() and 2 dup(). In turn, the sock counter is **two** because 1 socket()\
    \ and 1 bind().\n\nNow, let's consider that the bug occurs. As we know, the sock's\
    \ counter will be decreased by one, the file's counter decremented by the `fdt[5]`\
    \ entry becomes NULL. Note that calling **close(5)** did not decrease the socket\
    \ counter because we bugged it!\n\nThe situation becomes:\n\n| file cnt | sock\
    \ cnt | [fd3] | [fd4] | [fd5] | file_ptr->private_data | socket_ptr->sk |\n|---|---|---|---|---|---|---||\n\
    | 2 | 1 | file_ptr | file_ptr | NULL | socket_ptr | socket_ptr |\n\nLet's trigger\
    \ the bug second time:\n\n| file cnt | sock cnt | [fd3] | [fd4] | [fd5] | file_ptr->private_data\
    \ | socket_ptr->sk |\n|---|---|---|---|---|---|---||\n| 1 | FREE | NULL | file_ptr\
    \ | NULL | socket_ptr | (DANGLING) sock_ptr |\n\nAgain, close(3) did not refer\
    \ to a reference of the socket, the bug did it! Because the receiver reaches zero,\
    \ the socket is freed. \nAs we can see, dangling pointer on the just-free socket\
    \ object. This is the aforementioned **UAF transfer**. Unlike the first scenario\
    \ (cf. part 1), where the \"socket\" was the dangling pointer in `mq_notify()`,\
    \ now it is the \"sk_ptr\" of the `struct file`. In other words, we have \"access\"\
    \ to the socket's dangling pointer through the `struct file` through the `unblock_fd`\
    \ file descriptor.\n\n- 1. Call the sock's destructor (i.e. .netlink_sock_destruct())\n\
    - 2. Calls sk_ptr_free()\n\n# NONE OF THEM ACTUALLY UPDATED THE \"SOCKET\"\n\n\
    If you look at **dmmsg** before pressing a key (in the exploit), you will find\
    \ a similar message:\n\n```\n141.771253 Freeing alive netlink socket ffff80001ab88000\n\
    ```\n\nIt comes from the sock's destructor **netlink_sock_destruct()** (called\
    \ by __sk_free):\n\n```c\nstatic void netlink_sock_destruct(struct sock *sk)\n\
    {\n    struct netlink_sk *nlk = nlk_sk(sk);\n    // cut ...\n    if (!sk->flag\
    \ & SOCK_DEADO) {\n        printk(KERN_ERR, \"Freezing alive netlink socket %s\\\
    n\", sk); // <<-----\n        return;\n    }\n    // cut ...\n}\n```\n\nAlright,\
    \ we identified the target socket with netlink_bind(), we saw that the reference\
    \ counter has increased by one. While binding we reference it with netlink_getsockbypid().\
    \ Without detailing much, netlink_sock pointers are stored inside the nl_table\
    \ hash (this is covered in part 4). Without destroying the sock object, these\
    \ pointers became dangling pointers.\n\nIt is important to identify every pointer\
    \ for two reasons:\n\n- We can use them to trigger the use-after-free, give us\
    \ the UAF primitives\n- We will need to fix them during kernel repair\n\nLet's\
    \ move on and understand why the kernel is crashing during this.\n\n# Understand\
    \ The Crash\n\nIn the previous section, we identified three dangling pointers:\n\
    \n- the sk pointer in the struct socket\n- two netlink_sock pointers are inside\
    \ the nl_table hash list\n\nIt is time to understand why the PoC crashes.\n\n\
    What happens when we press a key in the poor-of-concept code? The exploit simply\
    \ exits, but this means a lot. The kernel needs to release every resources allocated\
    \ to the process, otherwise that would be lots of memory leak.\n\nThe exit procedure\
    \ itself is simple but a bit complex sits in the do_exit(). At some point, it\
    \ wants to release the file resources. This roughly does:\n\n- Function do_exit()\
    \ is invoked when (kernel/exit)\n- It calls exit_files() which releases a reference\
    \ of current's struct_files_struct with put_files_struct(n)\n- It was because\
    \ the last reference, put_files_struct() calls close_files()\n- close_files()\
    \ iterates over the FD and calls flip_close() for every remaining file\n- flip_close()\
    \ calls put() on the path to be freed by \"unblock_fd\"\n- It was because the\
    \ last reference, ...put() is invoked\n- Finally, ...put() calls the sock-ops->release()\
    \ which is sock_close(sk)\n- sock_close() calls sock->release() (proto_ops: netlink_release(netlink))\
    \ and set sock->release()\n"
