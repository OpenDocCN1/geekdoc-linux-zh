    \ a stack). This is the reason why using-after-free is efficient over SLAB or\
    \ SLUB.\n\nIn the fastest cache, memory management is as simple as:\n\n```\nstatic\
    \ inline void __cache_alloc(struct kmem_cache *cache, gfp_t flags) // yes... four\
    \ \"\"\n    void *obj;\n    struct array_cache *ac;\n\n    ac = cpu_cache(cache);\n\
    \n    if (likely(ac->avail)) {\n        STATS_INC_ALLOCIT(cache);\n        ac->touched++;\n\
    \        obj = ac->entry[--ac->avail]; // <----\n    }\n\n    // cut ...\n\n \
    \   return obj;\n```\n\nIn the very fast cache, the free path is as follows:\n\
    \n```\nstatic inline void __cache_free(struct kmem_cache *cache, void *obj)\n\
    {\n    struct array_cache *ac = cpu_cache_get(cache);\n\n    // cut ...\n\n  \
    \  if (unlikely(ac->avail < ac->limit)) {\n        STATS_INC_FREEHIT(cache);\n\
    \        ac->entry[ac->avail++] = obj; // <----\n    }\n    return;\n}\n```\n\n\
