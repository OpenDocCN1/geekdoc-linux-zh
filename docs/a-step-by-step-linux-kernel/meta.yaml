    | 2 | 1 | file_ptr | file_ptr | NULL | socket_ptr | socket_ptr |\n\n让我们第二次触发漏洞：\n\
    \n| file cnt | sock cnt | [fd3] | [fd4] | [fd5] | file_ptr->private_data | socket_ptr->sk\
