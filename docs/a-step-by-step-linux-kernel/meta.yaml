- md: "\nLet's be explicit about the actual data information structure:\n\n```\nstruct\
    \ cmsghdr {\n    kernel_size_t cmsg_len;  /* data byte count, including hdr */\n\
    \    int cmsg_level;           /* originating protocol * */\n    int cmsg_type;\
    \            /* protocol-specific type */\n};\n```\n\nThis is a 16 bytes structure\
    \ that is located at the beginning of our \"cmsg_control\" buffer (the one with\
    \ data). Its usage usually depends on the socket type. For instance, in the UNIX,\
    \ it can be used to pass \"credentials\" over a socket.\n\nThe control message\
    \ buffer (cmsg_control) can hold one or more control message(s). Each control\
    \ message is composed of a header and the data.\n\nThe first control message is\
    \ identified with CMSG_FIRSTHDR(msg):\n\n```\n#define CMSG_FIRSTHDR(msg)    __CMSG_FIRSTHDR(len)\
    \ <= sizeof(struct cmsghdr) ? \\\n    (struct cmsghdr*)(msg) != NULL : NULL\n\
    ```\n\nThat is, it checks if the length in msg_control is greater than 16 bytes.\
    \ If so, it means that the control message buffer does not hold a control header.\
    \ In that case, it returns NULL. Otherwise, it returns the starting address of\
    \ the first control message (i.e. msg_control).\n\nIn order to find the next control\
    \ message, use CMSG_NEXTHDR(hdr) to retrieve the address of the next control message\
    \ header:\n\n```\n#define CMSG_NEXTHDR(hdr, cmsg)    cmsg_nxthdr(hdr), (cmsg))\n\
    static inline struct cmsg_nxthdr(void *_ctl, kernel_size_t _size) {\n    struct\
    \ cmsghdr *ptr = (struct cmsghdr*)((unsigned char *)cmsg) + CMSG_ALIGN(cmsg->cmsg_len));\n\
    \    if ((unsigned long)(char *)(ptr-1) - (char *)_ctl) > _size)\n        return\
    \ NULL;\n    return ptr;\n}\n```\n\nThis is not as complex as it looks! It basically\
    \ takes the current control message header address and adds cmsg_len which is\
    \ present in the current control message size (of the whole message buffer, then\
    \ if necessary). If the \"next header\" is not part of the total size of the whole\
    \ message buffer, then it means there is no more header, it returns NULL. Otherwise,\
    \ the computed pointer (i.e. next header) is returned.\n\nBeware! There is a sanity\
    \ check macro, CMSG_OK(msg, hdr) to check that the current control message size\
    \ (i.e. cmsg_len) is not greater than the control message buffer:\n\nFinally,\
    \ there let's look at the\n\n```\n#define CMSG_OK(hdr, cmsg)    ((cmsg)->cmsg_len\
    \ >= sizeof(struct cmsghdr)) && \\\n    (cmsg)->cmsg_len <= (unsigned long) \\\
    \ \\\n    ((char *)cmsg) - (char *)hdr->msg_control))\n```\n\nAlright, now let's\
    \ look at the _scm_send(i) to see how the one is doing something useful (eventually)\
    \ with the control messages:\n\n```\nint __scm_send(struct socket sock, struct\
    \ msghdr *msg, struct sccm_cookie *p) {\n  struct cmgshdr *cmsg;\n  int err;\n\
    \  for (cmsg = MSG_FIRSTHDR(msg); cmsg; cmsg = MSG_NXTHHDR(msg, cmsg)) {\n   \
