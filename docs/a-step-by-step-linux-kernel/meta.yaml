    # CVE-2017-11176: Linux内核漏洞利用逐步详解 (第 3/4 部分)


    2018年10月2日，作者 Lexfo 发布于 漏洞分类


    - Linux

    - 漏洞利用利用

    - 漏洞

    - 内核

    - 逐步详解


    ## 引言


    在上一旧文章中，我们实现了一个从用户态（usersland）触发漏洞的概念验证，并在第 1 部分通过 Tap 释放了内核修改。


    本文从介绍内存子系统和 SLAB 分配器开始。这些都是非常庞大的主题，我们强烈建议读者探索所提到的资源。要利用任何类型的释放后使用（UAF）或堆溢出，理解这些内容是绝对必须的。


    释放后使用的基本理论已经有了详尽解释，以及利用它们所需的信息收集策略也是如此。我们将尝试将其应用于该漏洞，并分析我们特定工具包中可用的不同原语（primitives）。将展示一种重新分配策略，将释放后使用转换为任意调用。最后，我们能够以受控的方式使内核崩溃（不再是随机崩溃）。


    这里这里介绍的技术是 Linux 内核中使用释放后使用的常用方法（类型混淆）。此外，我们选择将释放后使用作为任意调用是因为存在硬编码的内容；漏洞利用无法是无目标的，也无法绕过
    kASLR（内核版的地址布局随机化）。


    请注意，这可以通过多种方式被利用以获取其他原语（即读/写），并通过绕过 kASLR/SMAP/SMEP（不过我们将在第 4 部分中绕过 SMEP）。概念验证代码已在手中，这正是我们作为漏洞编写者可以发挥创意的地方。


    此外，内核运行在一个非常混乱的环境中。虽然这在之前的文章中不是问题，但现在会变成（由于重新分配）。这意味着，你的漏洞利用在一个地方可能会失败（因为你输掉了竞态条件），而大部分情况下会发生在这里。可靠地依赖于开放领域的主题，某些复杂的技巧无法在这个空间内实现。


    最后，由于内核结构布局现在变得至关重要，且调试/生产内核中的这些布局不同，我们将与 System Tap 作别，因为它无法在生产环境内核上运行。这意味着我们需要使用更经典的工具来调试漏洞。此外，你们的结构布局将与我们的不同，如果不进行修改，这里提供的漏洞利用将在你们的系统上运行。


    准备好崩溃（很多次）吧，乐趣才刚刚开始:-。


    ## 目录


    - 核心概念 #3

    - 释放后使用 101

    - 分析 UAF（缓存、分配、释放）

    - 分析 UAF（悬挂指针）

    - 漏洞利用（重新分配）

    - 漏洞利用（任意调用）

    - 结论（等等，文本在核心概念处结束了）


    ## 核心概念 #3


    第三部分“核心概念”引入了内存子系统（也称为“mm”）。这是一个极其广泛的主题，仅为了涵盖内核的这部分。由于该部分内容并不充分，建议阅读以下文档。尽管如此，我们将展示
    Linux 内核管理内存的数据结构，以便大家处于同一个“页面”（page，双关语）。


    - 理解 Linux 内核 (2,8,9)

    - 理解 Linux 虚拟内存管理器

    - Linux 设备驱动：内存分配

    - OSDev：分页机制


    至少，请阅读《Understanding The Linux Virtual Memory》书的第 8 章。


    在本课程的结束处，我们将包含 `container_of()` 宏，并展示 Linux 内核中双向循环链表的案例。将使用 `list_for_each_entry_safe()`
    宏开发一个基础示例（这对于利用是强制的）。


    ## 物理页管理


    任何操作系统的最关键的任务之一就是管理内存。它必须快速、安全、稳定并尽可能减少碎片。出于效率考虑，内存被划分为固定长度的连续内存块。这种块被称为页帧（page
    frame），（通常）大小为 4096 字节。可以使用 `PAGE_SIZE` 宏获取。


    由于内核必须管理它，它会跟踪每一个空闲物理页以及相关信息。例如，它必须知道某个页面是否空闲。这类信息存储在 `struct page` 数据结构中（也称为“页描述符”）。


    内核可以使用 `alloc_pages()` 请求一个或多个页面。处理这些请求的分配器被称为区域分配器（Zone Allocator）。由于它使用了伙伴算法（buddy
    system），通常被称为伙伴分配器（Buddy Allocator）。


    ## Slab 分配器


    伙伴系统提供的“慷性”（generosity，此处可能指分配策略）并不适用于所有情况。例如，如果内核只想分配 128 字节内存，可能会浪费 3968 字节内存。这就是内部碎片。为了克服这个问题，Linux
    实现了细粒度分配器：Slab。为了保持简单，Slab 负责处理 `malloc()` 管理。


    内核提供了三种 分配器：


    - SLAB 分配器：经典的，侧于缓存优化（Debian 仍在使用）

    - SLUB 分配器：2007 年引入的“新”分配器（Ubuntu/CentOS）

    - SLOB 分配器：为内存极有限的嵌入式系统设计


