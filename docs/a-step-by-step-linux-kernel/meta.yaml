    • Let''s assume the cache has sock object, we have 2 slabs for now


    Before freeing the `struct netlink_sock` object, we are in this situation:


    ![](img/c903366d9618e8c23a6431aa9b885863_20_0.png)


    Note that the `ac->available` is the index (plus one) of the next object. When
    the `netlink_sock` object is free, the fastest `kfree(obj)` is equivalent to:


    ```

    ac->entry[ac->available++] = objp;   // "ac->avail" is POST-incremented

    ```


    It leads to this situation:


    ![](img/c903366d9618e8c23a6431aa9b885863_20_1.png)


    Finally, a struct sock object is allocated with `kmalloc(1024)` (with fastest
    path):


    ```

    objp = ac->entry[--ac->avail];   // "ac->avail" is PRE-decremented

    ```


    Which leads to:


    ![](img/c903366d9618e8c23a6431aa9b885863_20_2.png)


    That''s it! The **memory location of the new struct sock is the same as the (old)
    memory location of the `struct netlink_sock`** (e.g. `0xffffff0aabbccd`). So we
    do a retry or "re-allocation". Not too bad, right?

    **Well, this is the ideal case.**


    ### Reallocation Gadget

    The previous articles covered two buffers: the sending buffer and the receiver
    buffer. There is actually a third: one **option buffer** (also called "ancillary
    data buffer"). In this section, we will see how to fill it with arbitrary data
    and use it as our reallocation gadget.

    This gadget is accessible from the "upper" part of the `sendmsg()` syscall. Function
    `__sys_sendmsg()` is (almost) directly called by `SCALL_DEFINE3(sendmsg)`'
