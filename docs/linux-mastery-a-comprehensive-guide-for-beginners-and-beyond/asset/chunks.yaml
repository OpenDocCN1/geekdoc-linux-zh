    In Linux, network interfaces are represented by names such as `eth0` or `enp0s3`.
    We''ll learn how to view and manage network interfaces using tools like `ifconfig`
    and the newer `ip` command.


    ## IP Address Configuration

    Assigning IP addresses to network interfaces is essential for communication. We''ll
    explore different ways to configure IP addresses manually and automatically using
    `DHCP` (Dynamic Host Configuration Protocol).


    ## DNS Configuration

    The Domain Name System (`DNS`) translates human-readable domain names (like `example.com`)
    into IP addresses. We''ll learn how to configure `DNS` settings in Linux, enabling
    systems to resolve domain names and access websites.


    ## Routing

    We''ll explore how to view and manage routing tables in Linux, ensuring that data
    reaches its intended destination efficiently.


    # A Solid Networking Foundation


    With a solid understanding of IP addressing, subnetting, network interfaces, and
    essential network configurations, you now possess a strong foundation in networking.
    These concepts are the building blocks of Linux networking, and they''ll serve
    as a solid base as we dive into more advanced networking topics in the following
    chapters.


    Networking is a fascinating and crucial aspect of modern computing, and Linux
    provides a wealth of tools and capabilities to create, configure, and manage networks
    effectively. So, buckle up as we explore the depths of Linux networking and take
    your connectivity to new heights!


    ## 6.1.1 IP Addressing and Subnetting

    We''ll learn about both `IPv4` and `IPv6` addressing schemes and how to configure
    IP addresses in Linux. Additionally, we''ll explore subnetting to efficiently
    manage IP address spaces.


    An `IP` (Internet Protocol) address plays a pivotal role in networking as it serves
    as a unique identifier assigned to each device connected to a network. Understanding
    IP addressing is fundamental for establishing communication between devices and
    facilitating data exchange.


    ### IPv4 and IPv6 Addressing Schemes


    ### IPv4 Addressing

    `IPv4` (Internet Protocol version 4) addresses are the most widely used addresses
    on the internet today. They consist of 32 bits, usually represented in four groups
    of numbers separated by periods. Each group can range from 0 to 255. For example,
    an `IPv4` address may look like `192.168.1.100`. `IPv4` addresses were initially
    sufficient for the number of devices on the internet, but as the internet has
    grown exponentially, the available `IPv4` address space is becoming depleted.


    ### IPv6 Addressing

    To address the shortage of `IPv4` addresses, `IPv6` (Internet Protocol version
    6) was introduced. `IPv6` uses a 128-bit addressing scheme, expressed in eight
    groups of four hexadecimal digits, separated by colons. For example, an `IPv6`
    address appears as `2001:0db8:85a3:0000:0000:8a2e:0370:7334`. This significantly
    larger address space in `IPv6` allows for an enormous number of unique addresses,
    providing a virtually unlimited supply to accommodate the growing number of connected
    devices.


    ### Configuring IP Addresses in Linux

    In Linux, the process of configuring IP addresses can be accomplished manually
    or automatically, depending on the network requirements.


    ### Manual Configuration

    To manually configure an IP address, you need to specify the IP address, subnet
    mask, and default gateway. The subnet mask determines which portion of the IP
    address represents the network and which part represents the host.


    In Linux, you can use the `ifconfig` command to configure IP addresses. For example,
    to set the IP address of a network interface `eth0` to `192.168.1.100` with a
    subnet mask of `255.255.255.0`, you would use the following command:


    ```

    sudo ifconfig eth0 192.168.1.100 netmask 255.255.255.0

    ```


    ### Automatic Configuration with DHCP

    Dynamic Host Configuration Protocol (`DHCP`) automates the process of IP address
    assignment. A `DHCP` server dynamically allocates IP addresses to devices on the
    network, making it easier to manage and administer large networks.


    In Linux, you can use the `dhclient` command to obtain an IP address automatically
    from a `DHCP` server. For example:


    ```

    sudo dhclient eth0

    ```


    ### Subnetting for Efficient IP Address Management

    As networks grow in size, efficient IP address management becomes crucial. Subnetting
    is a technique used to divide a large IP address space into smaller sub-networks,
    known as subnets. Subnetting offers several benefits, including reduced network
    congestion, improved security, and simplified administration.


    In subnetting, a subnet mask is used to distinguish the network portion from the
    host portion of an IP address. By customizing subnet masks, you can create smaller,
    manageable subnets.


    For example, with an IP address like `192.168.1.100` and a subnet mask of `255.255.255.0`,
    the first three groups (`192.168.1`) represent the network, while the last group
