    ```


    ## 基于密钥的身份验证


    基于密钥的身份验证比基于密码的身份验证更安全、更方便。它涉及在本地机器上生成密钥对（保留私钥），并将公钥复制到远程系统的 `~/.ssh/authorized_keys`
    文件。


    ```bash

    ssh-keygen

    ```


    公钥通常存储在 `~/.ssh/id_rsa.pub` 文件中，私钥存储在 `~/.ssh/id_rsa` 中。你可以使用 `ssh-copy-id` 命令将公钥复制到远程系统：


    ```bash

    ssh-copy-id username@remote_ip_or_domain

    ```


    一旦公钥添加到远程系统的 `~/.ssh/authorized_keys` 文件，你就可以使用基于密钥的身份验证连接到远程系统无需输入密码。


    ## 使用 SSH 执行管理任务


    `SSH` 为远程系统提供了一个安全的命令行，允许你执行各种管理任务、运行命令、传输文件并远程管理系统。这使得 `SSH` 成为系统管理员和任何需要远程访问
    Linux 机器的人不可或缺的工具。


    例如，你可以这样使用 `SSH` 在远程系统上执行命令：


    ```bash

    ssh username@remote_ip_or_domain command

    ```


    这将在远程系统上执行指定的命令并将输出显示在你的本地终端上。


    ## 结论：使用 SSH 进行安全远程访问


    在本节中，我们探索了 `SSH` 作为 Linux 远程访问和命令执行的安全加密协议的强大功能和通用性。`SSH` 安全验证用户的能力结合其加密通信，确保了敏感数据和登录凭据免受未经授权的访问和截获。


    通过掌握 `SSH`，你可以安全地连接到远程系统，执行管理任务并放心地管理资源。随着你继续你的 Linux 之旅，`SSH` 将证明是是你工具箱中不可或缺的工具，实现跨网络的无缝远程访问和安全通信。拥抱
    `SSH` 的安全与便利，释放 Linux 远程管理的真正潜力。


    # 6.2.2 FTP（文件传输协议）和 SFTP（SSH 文件传输协议）


    `FTP` 和 `SFTP` 用于在系统之间传输文件。我们将比较这两种协议，探索它们的区别，并学习如何使用它们进行文件传输。


    `FTP`（文件传输协议）和 `SFTP`（SSH 文件传输协议）都被广泛用于系统之间的文件传输。然而，它们具有不同的特征，包括它们的安全特性和用于数据传输的方法。让我们深入比较这两种协议，探索它们的区别，并学习如何使用它们进行高效且安全的文件传输。


    ## FTP（文件传输协议）


    ### FTP 简介


    `FTP` 是最早开发的用于文件传输的网络协议之一，且直到今天它仍被广泛使用。它在两个独立的通道上运行：命令通道（控制通道）和数据通道。命令通道负责发送命令和接收响应，而数据通道用于实际的文件传输。


    ### FTP 特性


    `FTP` 允许客户端和服务器之间轻松地传输文件。它支持用于列出文件、浏览目录、上传和下载文件的各种命令。`FTP` 使用相对简单，使得所有技术水平的用户都能轻松上手。


    ### 安全考量


    然而，`FTP` 的一个显著缺点是缺乏内置的安全功能。通过 `FTP` 传输的数据未加密，使其容易被未经授权的方截获。由于这种固有的安全缺陷，不建议在互联网等不可信的网络上通过
    `FTP` 传输敏感或机密数据。


    ## SFTP（SSH 文件传输协议）


    ### SFTP 简介


    相反，`SFTP` 是 `FTP` 的安全扩展，通过 `SSH`（安全外壳）连接运行。与传统的 `FTP` 不同，`SFTP` 在传输过程中对所有数据进行加密，为文件传输提供了安全的通道。它受益于
    `SSH` 强大的安全特性，使其即使在不可信的网络上也能进行安全的文件传输。


    ### SFTP 特性


    `SFTP` 提供与 `FTP` 类似的功能，支持列出文件、浏览目录和传输文件的命令。由于它在 `SSH` 上运行，`SFTP` 还提供了远程文件编辑和属性操作等功能。


    ### 增强的安全性


    `SFTP` 的优势之一是其增强的安全性。所有数据（包括登录凭据和文件内容）都经过加密，使其免受截获和未经授权的访问。因此，当安全性优先级时，`SFTP`
    是首选，特别是传输敏感数据时。


    ## 使用 FTP 和 SFTP 进行文件传输


    ### FTP 客户端使用


    要连接 FTP 服务器并传输文件，可以使用各种 FTP 客户端，如 `ftp` 或 `FileZilla`。


    例如，使用 `ftp` 命令连接到 FTP 服务器的其语法如下：


    ```bash

    ftp ftp_server_ip_or_domain

    ```


    连接后，你可以使用 `FTP` 命令如 `ls`、`get`、`put` 和 `cd` 来列出文件、下载文件、上传文件和浏览目录。


    ### SFTP 客户端使用


    `SFTP` 客户端如 `sftp`、`WinSCP` 或 `FileZilla` 用于连接到 SFTP 服务器并执行安全的文件传输。


    使用 `sftp` 命令连接到 SFTP 服务器的语法如下：


    ```bash

    sftp username@remote_ip_or_domain

    ```


    连接后，你可以使用 `SFTP` 命令如 `ls`、`get`、`put` 和 `cd`，类似于 `FTP`，但具有安全加密数据传输的优势。


    ## 为文件传输选择正确的协议


    在本节中，我们比较了 `FTP` 和 `SFTP`，强调了它们不同的特性和安全考量。虽然 `FTP` 对于基础文件传输来说仍然是一个简单直接的选择，但它缺乏传输敏感数据所需的安全性。


    另一方面，`SFTP` 通过其加密能力提供了强大的安全性，使其成为安全数据传输的首选。


