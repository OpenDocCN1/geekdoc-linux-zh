    ```

    2. **Place website files**: Upload your website''s files (HTML, CSS, JavaScript,
    etc.) to the appropriate directory on the server, usually under `/var/www/html/`.

    3. **Configure virtual hosts**: If hosting multiple websites on the same server,
    set up virtual hosts to differentiate between them.

    4. **Enable the website**:

    ```bash

    sudo a2ensite your_website.conf

    ```

    5. **Restart Apache**:

    ```bash

