    DNS is a critical service that translates human-readable domain names, like `example.com`,
    into IP addresses that computers can understand. Configuring DNS settings in Linux
    allows your system to resolve domain names and access websites on the internet.


    ### Editing /etc/resolv.conf


    The primary file for DNS configuration in Linux is `/etc/resolv.conf`. You can
    manually edit this file using a text editor to specify DNS servers, search domains,
    and other DNS-related parameters.


    For example, to set Google''s public DNS servers as your system''s DNS resolvers,
    you would edit `/etc/resolv.conf` as follows:


    ```bash

    nameserver 8.8.8.8 nameserver 8.8.4.4

    ```


    ### NetworkManager and nmcli


    Modern Linux distributions often use `NetworkManager` to manage network connections,
    including DNS settings. The `nmcli` command-line tool allows you to interact with
    `NetworkManager` and configure DNS settings easily.


    ### Managing Routing


    Routing is the process of directing network traffic from one network to another.
    Proper routing ensures that data packets reach their intended destination efficiently.


    #### The route Command


    It allows you to add, delete, or modify routes manually.


    For example, to add a route to the network `192.168.2.0` via the gateway `192.168.1.1`
    on interface `eth0`, you would use the following command:


    ```bash

    sudo route add -net 192.168.2.0/24 gw 192.168.1.1 dev eth0

    ```


    #### The ip Command for Routing


    Similarly to its versatility in network interface configuration, the `ip` command
    also provides functionalities for managing routing tables. You can add, delete,
    or modify routes using the `ip route` subcommand.


