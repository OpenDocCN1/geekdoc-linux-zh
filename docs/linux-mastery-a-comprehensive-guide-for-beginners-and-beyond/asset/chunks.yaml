    SSH is designed to replace insecure remote access protocols like `Telnet` and
    `rlogin`, which transmitted data in plaintext, leaving it vulnerable to interception
    and unauthorized access. SSH, on the other hand, encrypts all data exchanged between
    the client and the server, providing a secure channel for communication.

