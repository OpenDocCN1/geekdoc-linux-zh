    DNS 是一项关键服务，它将人类可读的域名（例如 `example.com`）转换为计算机可以理解的 IP 地址。在 Linux 中配置 DNS 设置允许你的系统解析域名名并访问互联网上的网站。


    ### 编辑 /etc/resolv.conf


    Linux 中用于 DNS 配置的主文件是 `/etc/resolv.conf`。你可以使用文本编辑器手动编辑此文件，以指定 DNS 服务器、搜索域以及其他与
    DNS 相关的参数。


    例如，要将 Google 的公共 DNS 服务器设置为系统的 DNS 解析器，你可以按照如下方式编辑 `/etc/resolv.conf`：


    ```bash

    nameserver 8.8.8.8 nameserver 8.8.4.4

    ```


    ### NetworkManager 和 nmcli


    现代 Linux 发行版通常使用 `NetworkManager` 来管理网络连接，包括 DNS 设置。`nmcli` 命令行工具允许你与 `NetworkManager`
    交互并轻松地配置 DNS 设置。


    ### 管理路由


    路由是将网络流量从一个网络引导到另一个网络的过程。适当的路由可以确保数据包高效地到达目的地。


    #### route 命令


    它允许你手动添加、删除或修改路由。


    例如，要通过接口 `eth0` 网关 `192.168.1.1` 添加到网络 `192.168.2.0` 的路由，你可以使用以下命令：


    ```bash

    sudo route add -net 192.168.2.0/24 gw 192.168.1.1 dev eth0

    ```


    #### 用于路由的 ip 命令


    与其在网络接口配置中的通用类似，`ip` 命令也提供了管理路由表的功能。你可以使用 `ip route` 子命令添加、删除或修改路由。


    ## 高效网络配置


    在本小节中，我们探索了 Linux 网络配置的关键方面。通过理解如何配置网络接口、设置 DNS 设置以及管理路由，你可以创建高效且可靠的网络连接。


    `ifconfig`、`ip` 和 `route` 工具在有效配置网络设置方面起着至关重要的作用。无论你是使用经典的 `ifconfig` 还是采用多功能的
    `ip` 命令，Linux 都提供了必要的工具来完全控制你的网络环境。


    在随后的章节中，我们将进一步深入研究高级网络主题，使你能够在 Linux 中构建和管理健壮的网络。准备好开启一段增强网络能力的奇妙旅程吧！


    ## 6.2 建立网络连接


    连接到网络和远程系统是 Linux 中的常见场景。我们将探索各种协议和工具来建立安全连接。


    在 Linux 世界中，建立网络连接是一项常见且重要的任务。无论你需要连接到本地网络、访问远程系统上的资源，还是与其他设备进行安全通信，Linux 都提供了各种协议和工具来促进这些连接。


    ### 6.2.1 SSH（安全外壳）


    #### SSH 简介


    SSH（Secure Shell）是一种加密网络协议，用于在网络上提供安全的通信。它允许用户安全地访问和管理远程系统，使其系统管理员和开发人员的基础工具。


    #### 建立 SSH 连接


    要与远程系统建立 SSH 连接，你需要远程系统的 IP 地址或域名，以及有效的登录凭据。SSH 最常用的工具是 `ssh` 命令。


    要通过 SSH 连接到远程系统，请使用以下语法：


    ```bash

    ssh username@remote_ip_or_domain

    ```


    例如，要连接到名为 `john`、IP 地址为 `192.168.1.100` 的远程系统，你可以使用：


    ```bash

    ssh john@192.168.1.100

    ```


    #### 基于密钥的认证


    SSH 还支持基于密钥的身份验证，这提供了一种无需输入密码更安全、更方便的方法。基于密钥的验证涉及生成一个由公钥和私钥组成的密钥对。公钥放在远程系统上，而私钥保留在你的本地机器上。


    ```bash

    ssh-keygen

    ```


    一旦生成密钥对，你就可以将公钥复制到远程系统的 `~/.ssh/authorized_keys` 文件中以启用基于密钥的验证。


    ### 6.2.2 FTP（文件传输协议）和 SFTP（SSH 文件传输协议）


    #### FTP


    FTP（文件传输协议）是一种用于在网络客户端和服务器之间传输文件的标准协议。虽然 FTP 被广泛使用，但它缺乏安全机制，使其不适用于敏感数据。


    #### SFTP


    SFTP（SSH 文件传输协议）是 FTP 的安全扩展，使用 SSH 对数据进行加密。


    #### 建立 SFTP 连接


    要与远程系统建立 SFTP 连接，你可以像 SSH 一样使用 `sftp` 命令。要通过 SFTP 连接到远程系统，请使用以下语法：


    ```bash

    sftp username@remote_ip_or_domain

    ```


    例如，要连接到名为 `john`、IP 地址为 `192.168.1.100` 的远程系统，你可以使用：


    ```bash

    sftp john@192.168.1.100

    ```


    ### 6.2.3 HTTP/HTTPS


    #### HTTP/HTTPS 简介


    它促进客户端（通常是网络浏览器）与 Web 服务器之间的信息交换。虽然 HTTP 被广泛使用，但它缺乏安全特性。


    HTTPS（安全超文本传输协议）是 HTTP 的安全版本，使用加密来保护数据。HTTPS 常用于安全的在线交易和敏感数据传输。


    #### 使用 HTTP/HTTPS 浏览


    使用 HTTP 或 HTTPS 访问网站，可以使用 `Firefox`、`Chrome` 或 `Chromium` 等浏览器。只需在浏览器地址栏中输入网站的
    URL，浏览器就会启动与 Web 服务器的 HTTP 或 HTTPS 连接。


    ## 安全无缝网络


    在本节中，我们探索了在 Linux 中建立安全无缝网络连接的各种协议和工具。无论你是需要通过 SSH 连接到远程系统、通过 SFTP 安全地传输文件，还是使用
    HTTP 或 HTTPS 访问网页，Linux 都提供了多种解决方案来满足你的网络需求。


    随着你继续 Linux 之旅，掌握这些网络工具将使你能够充满心地在广大的数字世界，确保跨网络的安全通信和高效数据传输。


    ### 6.2.1 SSH（安全外壳）


    SSH 是一种广泛用于远程访问和命令执行的安全加密协议。我们将学习如何使用 SSH 安全地连接到远程系统并执行管理任务。


    SSH（Secure Shell）是一种强大且广泛使用的加密网络协议，用于在网络上提供安全加密的通信。它是 Linux 世界中的基础工具，为远程系统的远程访问和命令执行提供了安全方法。


    #### SSH 简介


    SSH 的设计旨在取代不安全的远程访问协议（如 `Telnet` 和 `rlogin`），这些协议以明文传输数据，容易被拦截和未经授权的访问。相比之下，SSH
    对客户端和服务器之间交换的所有数据进行加密，为通信提供安全通道。


