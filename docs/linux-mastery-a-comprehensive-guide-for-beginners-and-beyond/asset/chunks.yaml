    在 Linux 中，网络接口由如 `eth0` 或 `enp0s3` 等名称表示。我们将学习如何使用 `ifconfig` 和较新的 `ip` 命令等工具来查看和管理网络接口。


    ## IP 地址配置

    为网络接口分配 IP 地址对于通信至关重要。我们将探索手动配置 IP 地址以及使用 `DHCP`（动态主机配置协议）自动配置 IP 地址的各种方法。


    ## DNS 配置

    域名系统（`DNS`）将人类可读的域名（如 `example.com`）翻译为 IP 地址。我们将学习如何在 Linux 中配置 `DNS` 设置，以使系统能够解析域名并访问网站。


    ## 路由

    我们将探索如何在 Linux 中查看和管理路由表，确保数据能够高效地到达其目标地。


    # 坚实的网络基础


    通过对 IP 划分、子网划分、网络接口和基本网络配置的坚实理解，你现在拥有了网络领域的深厚基础。这些概念是 Linux 网络的基石，在我们于后续章节中深入探讨更高级的网络主题时，它们将作为坚实的基础。


    网络技术是现代计算中一个迷人且至关重要的方面，Linux 提供了丰富的工具和能力，可以有效地创建、配置和管理网络。因此，请系好，我们将探索 Linux 网络的深度，并将你的连接能力提升到新的高度！


    ## 6.1.1 IP 划分与子网划分

    我们将学习 `IPv4` 和 `IPv6` 划分方案以及如何在 Linux 中配置 IP 地址。此外，我们将探索子网划分以高效地管理 IP 地址空间。


    `IP`（互联网协议）地址在网络中起着至关重要的作用，因为它是分配给连接到网络的每个设备的唯一标识。理解 IP 划分对于建立设备之间的通信和促进数据交换是基础。


    ### IPv4 和 IPv6 划分方案


    ### IPv4 划分

    `IPv4`（网协议第 4 版）地址是目前互联网上最广泛使用的地址。它们由 32 位组成，通常由四组用点分隔的数字表示。每组数字的范围从 0 到 255。例如，一个
    `IPv4` 地址可能看起来像 `192.168.1.100`。`IPv4` 地址最初足以互联网上的设备数量，但随着互联网的指数级增长，可用的 `IPv4`
    地址空间变得枯竭。


    ### IPv6 划分

    为了解决 `IPv4` 地址短缺的问题，引入了 `IPv6`（互联网协议第 6 版）。`IPv6` 使用 128 位划分方案，表示为八组四位十六进制数字，用冒号分隔。例如，一个
    `IPv6` 地址显示为 `2001:0db8:85a3:0000:0000:8a2e:0370:7334`。`IPv6` 大大的地址空间允许产生大量的唯一地址，提供了几乎无限的供应，以适应日益增长的连接设备。


    ### 在 Linux 中配置 IP 地址

    在 Linux 中，配置 IP 地址的过程可以手动或自动完成，取决于网络需求。


    ### 手动配置

    要手动配置 IP 地址，你需要指定 IP 地址、子网掩码和默认网关。子网掩码决定 IP 地址的哪部分代表网络，哪部分代表主机。


    在 Linux 中，你可以使用 `ifconfig` 命令来配置 IP 地址。例如，要将网络接口 `eth0` 的 IP 地址设置为 `192.168.1.100`，子网掩码为
    `255.255.255.0`，你需要使用以下命令：


    ```

    sudo ifconfig eth0 192.168.1.100 netmask 255.255.255.0

    ```


    ### 使用 DHCP 自动配置

    动态主机配置协议（`DHCP`）动态地为网络分配 IP 地址。在 Linux 中，你可以使用 `dhclient` 命令来实现：


    ```

    sudo dhclient eth0

    ```


    ### 子网划分以管理 IP 地址

    随着网络规模扩大，高效管理 IP 地址变得至关重要。子网划分是一种将 IP 地址空间划分为更小网络网的技术。


    在子网划分中，子网掩码决定了 IP 地址的网络部分和主机部分。例如，一个 IP 地址 `192.168.1.100` 的子网掩码为 `255.255.255.0`，其中前三组
    `192.168.1` 代表网络，最后一组 `100` 代表主机。


    通过子网划分，你可以创建更小的网络，提高性能、安全性并简化管理。


    ## 结论：赋能网络通信

    在本节中，我们探讨了 IP 划分、子网划分以及 `IPv4` 和 `IPv6` 的区别。此外，我们学习了如何手动和自动使用 `DHCP` 配置 IP 地址。理解
    IP 划分对于建立设备间的通信是基础。


    在接下来的章节中，我们将深入研究网络配置和各种工具。准备好进一步提升你的网络知识吧！


