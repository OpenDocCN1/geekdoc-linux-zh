  trans: '

    当你继续你的 Linux 之旅时，请记住，文件系统是一块等待你发挥创意和进行组织的画布。接受构建结构良好的文件系统的挑战，让它成为你生产力和效率的基础。


    在接下来的章节中，我们将深入探索 Linux 命令行中文本处理的迷人世界，在那里，你将学习如何轻松地操纵和分析文本数据。所以，请准备好迎接前方场精彩的文本冒险吧！


    祝你在使用 Linux 导航和管理数据时愉快！


    # 第 5 章：实战操作


    ## 面向现实应用的实践性练习


    ### 在做中学学习

    恭喜你完成了这段旅程，跨越了 Linux 命令行、文件系统以及更广阔的领域！在本章中，我们将通过参与实践性练习将你的学习体验提升一个层次，这些练习将强化你对
    Linux 概念的理解，并让你能够在现实场景中应用新学的知识。


    在做中学学习是一种强大的方法，这些实践练习将挑战你将理论付诸。无论你是 Linux 新手还是想要磨炼技能的资深用户，这些练习都为你提供了实验、解决问题和创造性探索的宝贵机会。


    拿起你的键盘，打开终端，让我们进入这些实践练习，成为一名真正的 Linux 命令行大师吧！


    ## 5.1 练习 1：文件系统导航

    **目标：** 使用各种命令导航 Linux 文件系统。


    1. 打开你的终端。

    2. 使用 `pwd` 命令显示当前工作目录的绝对路径。

    3. 使用 `ls` 命令列出你的家目录的内容。

    4. 使用 `cd` 命令移动到 `Desktop`（桌面）目录。

    5. 列出 `Desktop` 目录的内容。

    6. 在桌面上创建一个名为 `Linux_Exercises` 的新目录。

    7. 进入 `Linux_Exercises` 目录。

    8. 在 `Linux_Exercises` 目录创建三个新文本文件：`file1.txt`、`file2.txt` 和 `file3.txt`。

    9. 列出 `Linux_Exercises` 目录的内容以确认文件已创建。

    10. 使用 `mv` 命令将 `file1.txt` 重命名为 `important_file.txt`。

    11. 将 `important_file.txt` 移动到你的家目录。

    12. 回到你的家目录。

    13. 使用 `rm` 命令从 `Linux_Exercises` 目录删除 `file2.txt` 和 `file3.txt`。

    14. 使用 `rmdir` 命令删除空的 `Linux_Exercises` 目录。


    ## 5.2 练习 2：文件权限

    **目标：** 练习更改文件权限并理解其对访问的影响。


    1. 在你的家目录下创建一个名为 `secret.txt` 的新文本文件。

    2. 使用 `ls -l` 命令检查 `secret.txt` 的当前权限。

    3. 使用 `chmod` 命令设置 `secret.txt` 的权限，使得所有者拥有读写权限，而组和其他用户没有读取、写入或执行该文件的权限。

    4. 使用 `ls -l` 命令验证权限已正确设置。

    5. 尝试使用文本编辑器读取 `secret.txt` 的内容。注意，你不应该能够读取或修改该文件。

    6. 更改 `secret.txt` 的权限，使得所有者拥有读写权限，而组和其他用户拥有只读权限。

    7. 使用 `ls -l` 命令验证权限已更新。

    8. 使用文本编辑器读取并修改 `secret.txt` 的内容。注意，你可以读取文件但无法修改它。


    ## 5.3 练习 3：文本处理

    **目标：** 使用 Linux 命令练习文本处理。


    1. 创建一个名为 `sample_text.txt` 的新文本文件并在其中写入几行文本。

    2. 使用 `cat` 命令显示 `sample_text.txt` 的内容。

    3. 使用 `grep` 命令在 `sample_text.txt` 中搜索特定的单词或短语。

    4. 使用 `wc` 命令统计 `sample_text.txt` 中的行数、单词数和字符数。

    5. 使用 `sort` 命令按字母顺序对 `sample_text.txt` 中的行排序。

    6. 使用 `cut` 命令从 `sample_text.txt` 中提取特定列。

    7. 使用 `sed` 命令将 `sample_text.txt` 中的一个单词或短语替换为另一个单词或短语。

    8. 使用 `head` 命令显示 `sample_text.txt` 的几行。

    9. 使用 `tail` 命令显示 `sample_text.txt` 的最后几行。


    ## 5.4 练习 4：文件系统导航挑战

    **目标：** 练习使用相对路径和绝对路径高效导航文件系统。


    1. 从你的家目录开始。

    2. 在不使用 `cd` 命令的情况下，使用相应的相对路径导航到家目录下的 `Pictures`（图片）目录。

    3. 列出 `Pictures` 目录的内容以确认你已成功到达正确的位置。

    4. 使用相应的相对路径返回家目录。

    5. 使用绝对路径移动到根目录。

    6. 从根目录，使用相应的绝对路径导航到家目录下的 `Documents`（文档）目录。

    7. 列出 `Documents` 目录的内容确保你已到达正确位置。

    8. 使用相应的相对路径返回家目录。


    ## 5.5 练习 5：文件管理挑战

    **目标：** 练习管理文件和目录。


    1. 在家目录下创建一个名为 `Linux_Backup` 的新目录。

    2. 使用 `mv` 命令将 `Documents` 目录下的所有文件移动到 `Linux_Backup` 目录。

    3. 列出 `Linux_Backup` 目录的内容以确保文件已移动。

    4. 将 `Linux_Backup` 目录重命名为 `Linux_Backup_YYYYMMDD`，将 `YYYYMMDD` 替换为今天的日期。

    5. 使用 `cp` 命令创建 `Linux_Backup_YYYYMMDD` 目录的副本并放在家目录下。

    6. 列出家目录的内容确认复制成功。

    7. 在家目录下创建一个名为 `Temp` 的新目录。

    8. 使用 `mv` 命令将家目录中的复制文件移动到 `Temp` 目录。

    9. 列出 `Temp` 目录的内容验证文件已移动。

    10. 最后，使用 `rm` 命令删除 `Temp` 目录及其内容。


    ## 5.6 练习 6：高级权限

    **目标：** 使用符号表示法练习设置权限。


    1. 在 `Confidential` 目录下创建两个文本文件：`confidential_data.txt` 和 `public_data.txt`。

    2. 使用 `chmod` 命令设置 `confidential_data.txt` 的权限，使得所有者拥有读写权限，而组和其他用户没有读取、写入或执行该文件的权限。

    3. 设置 `public_data.txt` 的权限，使得所有者、组和其他用户都拥有读写权限，但没有执行权限。

    4. 使用 `ls -l` 命令验证两个文件的权限已正确设置。

    5. 使用文本编辑器尝试读取两个文件以测试权限。

    6. 更改 `public_data.txt` 的权限，赋予所有者、组和其他用户执行权限。

    7. 再次使用 `ls -l` 命令验证 `public_data.txt` 的权限已更新。


    ## 5.7 练习 7：文本处理挑战

    **目标：** 使用 Linux 命令练习高级文本处理。


    1. 创建一个名为 `song_lyrics.txt` 的新文本文件并在其中写入你喜歌曲的歌词。

    2. 使用 `cat` 命令显示 `song_lyrics.txt` 的内容。

    3. 使用 `grep` 命令在 `song_lyrics.txt` 中搜索特定的单词或短语。

    4. 按字母顺序对 `song_lyrics.txt` 中的行排序，并将排序后的输出保存到新文件 `sorted_lyrics.txt` 中。

    5. 使用 `cut` 命令从 `song_lyrics.txt` 中提取特定列，并保存到新文件 `chorus.txt` 中。

