    85    IPv4 and IPv6 Addressing Schemes


    86     IPv4 Addressing:


    IPv4 (Internet Protocol version 4) addresses are the most widely used addresses
    on the internet today. They consist of 32 bits, usually represented in four groups
    of numbers separated by periods. Each group can range from 0 to 255\. For example,
    an IPv4 address may look like 192.168.1.100. IPv4 addresses were initially sufficient
    for the number of devices on the internet, but as the internet has grown exponentially,
    the available IPv4 address space is becoming depleted.


    87     IPv6 Addressing:


    To address the shortage of IPv4 addresses, IPv6 (Internet Protocol version 6)
    was introduced. IPv6 uses a 128-bit addressing scheme, expressed in eight groups
    of four hexadecimal digits, separated by colons. For example, an IPv6 address
    appears as 2001:0db8:85a3:0000:0000:8a2e:0370:7334. This significantly larger
    address space in IPv6 allows for an enormous number of unique addresses, providing
    a virtually unlimited supply to accommodate the growing number of connected devices.


    88    Configuring IP Addresses in Linux


    In Linux, the process of configuring IP addresses can be accomplished manually
    or automatically, depending on the network requirements.


    89     Manual Configuration:


    To manually configure an IP address, you need to specify the IP address, subnet
    mask, and default gateway. The subnet mask determines which portion of the IP
    address represents the network and which part represents the host.


    In Linux, you can use the ifconfig command to configure IP addresses. For example,
    to set the IP address of a network interface eth0 to 192.168.1.100 with a subnet
    mask of 255.255.255.0, you would use the following command:


    Copy code


    sudo ifconfig eth0 192.168.1.100 netmask 255.255.255.0


    90     Automatic Configuration with DHCP:


    Dynamic Host Configuration Protocol (DHCP) automates the process of IP address
    assignment. A DHCP server dynamically allocates IP addresses to devices on the
    network, making it easier to manage and administer large networks.


    In Linux, you can use the dhclient command to obtain an IP address automatically
    from a DHCP server. For example:


    Copy code


    sudo dhclient eth0


    91    Subnetting for Efficient IP Address Management


    As networks grow in size, efficient IP address management becomes crucial. Subnetting
    is a technique used to divide a large IP address space into smaller sub-networks,
    known as subnets. Subnetting offers several benefits, including reduced network
    congestion, improved security, and simplified administration.


    In subnetting, a subnet mask is used to distinguish the network portion from the
    host portion of an IP address. By customizing subnet masks, you can create smaller,
    manageable subnets.


    For example, with an IP address like 192.168.1.100 and a subnet mask of 255.255.255.0,
    the first three groups (192.168.1) represent the network, while the last group
    (100) identifies the host within that network.


    By effectively subnetting, you can design network architectures that suit your
    specific needs, allowing for efficient use of IP addresses and more streamlined
    network management.


