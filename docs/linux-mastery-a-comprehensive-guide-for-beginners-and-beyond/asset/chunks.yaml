    ### Configuring Network Interfaces

    A network interface is a hardware or software component that allows a device to
    connect to a network. In Linux, network interfaces are identified by names such
    as `eth0`, `enp0s3`, or `wlan0`. Configuring network interfaces involves assigning
    IP addresses, setting up subnet masks, and enabling or disabling interfaces.


    #### Using ifconfig

    The `ifconfig` command has been a widely used tool for configuring network interfaces
    in Linux. It allows you to view and modify network interface settings, such as
    assigning an IP address, setting a subnet mask, enabling or disabling an interface,
    and configuring other parameters like the `MTU` (Maximum Transmission Unit).


    For example, to set the IP address of `eth0` to `192.168.1.100` with a subnet
    mask of `255.255.255.0`, you would use the following command:


    ```

    sudo ifconfig eth0 192.168.1.100 netmask 255.255.255.0 up

    ```


    #### The ip Command

    While `ifconfig` has been a longstanding tool, the `ip` command has become the
    modern replacement and offers more extensive functionality. It allows you to perform
    various network-related tasks, including configuring network interfaces, displaying
    routing tables, and managing the network stack.


    To set the IP address of `eth0` to `192.168.1.100` with a subnet mask of `255.255.255.0`,
    you would use the following `ip` command:


    ```

    sudo ip addr add 192.168.1.100/24 dev eth0

    ```


