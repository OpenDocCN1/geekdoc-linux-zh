    # Web 服务器与 HTTP


    ### Web 服务器简介

    Web 服务器是某种软件应用程序，负责处理来自客户端（网页浏览器）的入站 `HTTP` 请求，并响应请求的网页。它们存储并提供网页内容（如 HTML、CSS、JavaScript
    和多媒体文件）给通过网页浏览器访问网站的用户。


    ### HTTP 基础

    当你在网页浏览器中输入 URL 并按回车键时，你的浏览器会向托管该网站的 Web 服务器发送一个 `HTTP` 请求。Web 服务器处理该请求并响应请求的网页，然后你的浏览器对其进行渲染并显示。


    `HTTP` 的设计基于客户端-服务器模型，其中客户端（网页浏览器）向服务器发送请求，而服务器响应请求的数据。


    # 使用 HTTP 托管网站


    ### 托管网站的步骤

    要托管网站，你需要在服务器上安装 Web 服务器软件，例如 `Apache`、`Nginx` 或 `Lighttpd`。你还需要配置你的 Web 服务器以提供网站文件并响应入站的
    `HTTP` 请求。


    以下是使用 `Apache` 作为示例托管网站的一些基本步骤：


    1. **安装 Apache**:

    ```bash

    sudo apt update && sudo apt install apache2

    ```

    2. **放置网站文件**：将你的网站文件（HTML、CSS、JavaScript 等）上传到服务器上相应的目录，通常位于 `/var/www/html/`
    之下。

    3. **配置虚拟主机**：如果在同一台服务器上托管多个网站，请设置虚拟主机以区分它们。

    4. **启用网站**：

    ```bash

    sudo a2ensite your_website.conf

    ```

    5. **重启 Apache**:

    ```bash

    sudo systemctl restart apache2

    ```

    现在，你的网站应该可以通过其域名或 IP 地址访问了。


