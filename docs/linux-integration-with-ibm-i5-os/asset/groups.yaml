    ## Preface


    IBM® System iTM platform offers many points of integration that support Linux®
    applications leveraging IBM i/OS applications and data, such as IBM eServer™ iSeries™
    Access for Linux, IBM i/OS NetServer™ with Samba, and IBM Java™ Virtual Machine
    and JTOpen start.


    This Redbook covers every communication technique with sample code and shows you
    methods that you can use to connect Linux applications with IBM i/OS.


    This book is intended to help Linux users, programmers and administrators, with
    an IBM i/OS background, to connect Linux with IBM i/OS.


    ## The team that wrote this IBM Redbook


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    ![](img/165c050f45ac58e1635258993855261a_10_0.png)


    Manik Ahuja is an IT Architect for IBM. His work designing IT infrastructure solutions
    by selecting the best combination of hardware software for each requirement. Manik
    has industry recognized certifications for most operating systems and is equally
    proficient in both hardware and software technologies. He started his career as
    a computer lab assistant in 1995 and gradually moved to being a Systems Administrator
    and then to an IT Architect. He is an acknowledged expert at all open source and
    also writes technology articles for various magazines. His areas of specialization
    include designing and implementing e-mail systems, high availability clusters,
    data consolidation techniques, and visualization solutions.


    ![](img/165c050f45ac58e1635258993855261a_10_1.png)


    Erwin Earley is an Advisory Software Engineer for IBM, assigned to the System
    Technology Center in Rochester, Minnesota. In his role in the Linux Center of
    Competency, Erwin is responsible for technical enablement of field personnel for
    Linux on the IBM i platform. Erwin has written numerous articles centered on Linux
    on System i and is a certified professional with the Linux Professional Institute,
    as well as a Red Hat Certified Technician. He can be reached at erwin.earley@us.ibm.com.


    ![](img/165c050f45ac58e1635258993855261a_10_2.png)


    Franco Rico is an i Technical Specialist with IBM in Germany. He has five years
    of experience in iSeries Access, EIM / Kerberos, integrated IBM iSeries® systems
    (IXA) and logical partition (LPAR). He provides assistance in problem determination,
    configuration, and usage for IBM customers. He holds a degree of engineering in
    Information Technology from the University of Cooperative Education Mannheim.


    Vlatko Kosturjak is an IT Specialist with IBM Global Services Security and Privacy
    Services at IBM Croatia. In his practice, Vlatko Kosturjak specializes in ethical
    hacking, IT audit, security policy development according to ISO/IEC 17799, consultative
    services for the design, implementation, and validation of enterprise-wide continuity
    and recovery programs, and assisting clients with developing and implementing
    effective security solutions for the protection of their information assets. He
    has extensive experience in security design for networks and server hardening
    on various operating systems.


    ![](img/165c050f45ac58e1635258993855261a_11_0.png)


    Rajeev Sharma is an IT specialist in Linux with Sales and Distribution at IBM
    India. His previous jobs include a Technical Account Manager in Linux Impact Team
    in Novelle Bangalore and a Systems Engineer and Business Development in NetCore
    Solutions in Mumbai. He is a subject expert in consulting and solution designing
    and implementation of SUSE Enterprise Server and SUSE Linux Open Exchange among
    other things.


    Yessong Jong is IBM Certified Specialist at the International Technical Support
    Organization, Rochester Center. He started his career at IBM as an S/38 Systems
    Engineer in 1982 and has been with S/38, IBM AS/400.

