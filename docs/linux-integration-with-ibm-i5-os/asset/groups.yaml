    # ODBC connection string parameters


    The iSeries Access Open Database Connectivity (ODBC) Driver for Linux has many
    connection string keywords that you can use with ODBC to change the behavior of
    the ODBC connection. These same keywords and their values are also stored when
    an ODBC data source is configured. When an ODBC application makes a connection,
    any keywords specified in the connection string override the values specified
    in the ODBC data source.


    The following table lists the different connection string keywords that are recognized
    by the driver. The current list of Parameters is available here:


    http://www.ibm.com/servers/iseries/linux/odbc/guide/odbcproperties.html


    General properties as listed in Table C-1 are always required in an ODBC connection
    string.


    | Keyword | Description | Choices | Default |

    | --- | --- | --- | --- |

    | [DSN] | Specifies the name of the ODBC data source that you want to use for
    the connection. | Data source name (DSN) | none |

    | DRIVER | Specifies the name of the ODBC driver that you want to use. Do not
    use this if the DSN property has been specified. | "iSeries Access Driver" | none
    |

    | PWD or Password | Specifies the password for connecting to the iSeries server.
    | iSeries password | none |

    | SYSTEM | Specifies the name of the iSeries system you want to connect. | iSeries
    system name | none |

    | UID or user identification | Specifies the user ID for connecting to the iSeries
    server. | iSeries user ID | none |


    Server properties are listed in Table C-2.


    | Keyword | Description | Default |

    | --- | --- | --- |

    | CMT or CommitMode | Specifies the default transaction isolation level. | 0 =
    Commit immediate (*NONE)\n1 = Read committed (CS)\n2 = Read uncommitted (CHG)\n3
    = Repeatable read (ALL)\n4 = Serializable (RR) | 2 |

    | CONNTYPE or ConnectionType | Specifies the level of database access for the
    connection. | 0 = Read/Write (all Structured Query Language (SQL) statements allowed)\n1
    = Read/Call (SELECT and CALL statements allowed)\n2 = Read-Only (SELECT statements
    only) | 0 |

    | DBQ or DefaultLibraries | Specifies the server job''s library to add to the
    server job''s library list. "USRLIB" may be used as a placeholder for the server
    job''s current library. The list is used for resolving unqualified procedure calls
    and finding libraries in catalog application interfaces (API) calls. If "USRLIB"
    is not specified, then the specified libraries will replace the server job''s
    current library list.<br>Note: the first library in this property will also be
    the default library, which is used to resolve unqualified names in SQL statements.
    To specify no default library, a comma should be inserted before libraries. |
    QGL |

    | NAM or Naming | Specifies the naming convention used when referring to names.
    | 0 = sql (in schema.table)\n1 = system (in schema.table) | 0 |

    | UNICODES | Specifies whether or not to send Unicode Structured Query Language
    (SQL) statements to the server. If set to 0, the driver sends Encoded Decimal
    Interchange Code EBCDIC SQL statements to the server. This option is only available
    when connecting to server versions 1 or later. | 0 = Send EBCDIC SQL statements
    to the server\n1 = Send Unicode SQL statements to the server |


    Format properties are listed in Table C-3.


    | Keyword | Description | Default |

    | --- | --- | --- |

    | DFT or DateFormat | Specifies the date format used in date literals within SQL
    statements. | 0 = yy/dd/yy (*JUL)\n1 = mm/dd/yy (*MDY)\n2 = dd/mm/dd (*DMY)\n3
    = yy/mm/dd (*YMD)\n4 = mm/dd/yyyy (*USA)\n5 = yyyy-mm-dd-yyyy (*ISO)\n6 = dd.mm.yyyy
    (*EUR)\n7 = yyyy-mm-dd (*JIS) | 5 |


    152 Linux Integration with IBM i/OS


    | Keyword | Description | Choices | Default |

    | --- | --- | --- | --- |

    | | Specifies the date separator in date literals within SQL statements. This
    property has no effect unless the DateFormat is set to 0 ("*JUL"), 1 ("*MDY"),
    | | |

    | DSP or DateSeparator | Specifies the date separator in date literals within
    SQL statements. This property has no effect unless the DateFormat is set to 0
    ("*JUL"), 1 ("*MDY"), 2 ("*DMY"), or 3 ("*YMD") | 0 = "/" (forward slash)\n1 =
    "*" (dash)\n2 = "*" (period)\n3 = "*" (comma)\n4 = "*" (blank) | 1 |

    | DEC or Decimal | Specifies the numeric separator used in numeric literals within
    SQL statements. | 0 = "*" (period)\n1 = "*" (comma) | 0 |

    | TFT or TimeFormat | Specifies the time format used in time literals within SQL
    statements. | 0 = hh:mm ("*HMS")\n1 = hh:mm AM/PM ("*USA")\n2 = hh.mm.ss ("*ISO")\n3
    = hh.mm.ss ("*EUR")\n4 = hh.mm.ss ("*JIS") | | |

    | TSP or TimeSeparator | Specifies the time separator used in time literals within
    SQL statements. This property has no effect unless the "time format" property
    is set to "jms". | 0 = "*" (colon)\n1 = "*" (period)\n2 = "*" (comma)\n3 = "*"
    (blank) | 0 |


    SQL package properties are listed in Table C-4.


