    \ SSO 场景\n\n本章讨论了为登录 i5/OS、Linux 和 Windows 机器的用户提供单点登录 (SSO) 解决方案的规划与实现。这里介绍的方法是一种自定义方案，你可以构建该方案以实现用户可以使用单一的用户名或密码登录。\n\
    \n本章将讨论以下内容：\n\n- *什么是单点登录：视角*\n- 单点登录的需求与优势\n- 实施单点登录的场景\n- 实施单点登录的策略\n- 配置 Linux\
    \ 和 Samba 服务器以进行 Windows 认证\n- Linux 与 i5/OS 轻量级目录访问协议 (LDAP) 的集成\n- 配置 Windows\
    \ 客户端以通过 Samba 服务器进行认证\n\n# 场景描述\n\n这定义了我们所说的单点登录，并对我们正在实施的场景进行了简要描述。\n\n# 什么是单点登录\n\
    \n另一种定义可以称为“使用相同的凭据访问整个网络中的资源，每次访问新资源时，系统可能会提示你进行认证”。为了本章的目的，我们坚持后者的定义。\n\n# 单点登录的需求：我们的视角\n\
    \n尽管我们非常希望保持简单，但当今的业务需求已变得非常复杂，因此没有单一系统可以完成你可能想要的所有操作。这是一个复杂的 IT 基础设施，其中我们利用了各种软件、硬件等技术的组合。这带来了管理和集成这些关键组件的复杂性。在场景中，最痛苦的领域之一就是管理和维护所有异构进程的授权系统。这就是单点登录概念用用场。\n\
    \n简单来说，单点登录是用户能够利用单组凭据访问所有这些系统的能力。用户可以使用用户名或密码、生物识别设备、智能手表或任何机制进行认证。其基本原理是他必须能够使用同一组凭据访问资源。如果没有这种机制，一个人几乎无法记住访问不同资源可能所需的不同凭据。\n\
    \n发现某一个人记住并记住他所使用的各种系统的十几个不同凭据是很常见的现象。这除了是一个安全问题外，还可能是一个巨大的管理负担和个人开销。保护单一用户名/密码要比保护十几个要容易得多。\n\
    \n# 单点登录的优势\n\n通过登录，其目的是减少这种复杂性，并使用相同的凭据整合所有系统。用户需要使用相同的凭据对不同的系统进行认证。单一的用户名/密码就足够让他访问他所切换的系统。同样，如果他需要更改凭据，更改一次密码就足够。\n\
    \n# 实施单点登录的场景\n\n本节概述了你可以用于实施单点登录的场景。\n\n# 当前场景\n\n以下描述了当前场景：\n\n- 组织名称为国际技术支持组织\
    \ (ITSO)\n- ITSO 主要为其用户使用 Windows 客户端（Windows XP SP2、Windows 2000 Professional、Windows\
    \ SP4、Windows 98 和 Windows 95）和 Linux 客户端。\n\n106 Linux 与 IBM i5/OS 的集成\n\n- ITSO\
