  - '[PAGE 33]


    When -STAND_ONE is specified on the command line or the resource setting IBM5250*STAND_ALONE:
    TRUE, then:


    +   - The emulator hot-key switching between sessions is disabled.

    - Each emulator runs in its process (stand alone process mode).

    - Multiple users are allowed to run on the same Linux system.


    When -STAND_ONE is NOT specified on the command line or the resource setting IBM5250*STAND_ALONE:
    FALSE, then:


    +   - Only one user is allowed to run ibm5250 sessions

    - If multiple users try to launch ibm5250, the emulator hangs.

    - The emulator hot-key switching between sessions is allowed.

    - Emulator runs as a single process (shared process mode).


    # 2.4.4 Getting HMC Remote 5250 console from your Linux desktop


    You can get an i/OS 5250 console from your Linux desktop (in the same way you
    would get on a Hardware Management Console (HMC) box. You get this service using
    the 5250 emulator of iSeries for Linux (ibm5250) and HMC Telnet Proxy.


    To configure the HMC support for the Linux product, use the setup5250 to create
    a connection. For the 5250 Emulator Connection properties page, specify the parameter.
    In place of "i/OS Host Name or IP Address", give HMC''s IP address or Domain Name
    System (DNS) name.


    On the Advanced 5250 Connection properties page specify:


    +   - Emulator User ID: Q#HMC

    - Emulator Password: Q#HMC

    - Telnet Port: 2300


    > Note: The special Q#HMC string is not used for security authentication in any
    way, you are prompted for additional values by the HMC Telnet Proxy.


    # 2.5 Implementing SSO with EIM and Kerberos


    Starting with Version 1.10, iSeries Access for Linux includes support Enterprise
    Identity Mapping (EIM) and Kerberos authentication. Using these features, you
    can implement simple sign-on (SSO) for your network. These functions allow a user
    to minimize the usage of different users and passwords. With sign-on a user requires
    to log in only once. Kerberos and EIM allow a user to be authenticated and get
    connected to every IBM i/OS system he is allowed to. Even if he has different
    users on different systems.


    For detailed informations about Kerberos and EIM as well as configuration examples
    for iSeries Information center and find the location page to R530 and select security
    → Enterprise Identity Mapping (EIM) or security → single sign-on:


    ```

    http://publib.boulder.ibm.com/pubs/html/as400/

    ```


    You could also see the IBM Redbook titled Windows-based Single Signon and the
    EIM Framework on the IBM eServer iSeries Server, SG24-6975.'
- md: '

    There are two major Kerberos implementations available for Linux: MIT and Heimdal.
    Most Linux distributions have at least one version of Kerberos included with them.
    For specific informations about Heimdal visit:


    http://www.pdc.kth.se/heimdal/


    Use the following link to visit MIT - Massachusetts Institute of Technology:


    http://web.mit.edu/kerberos/www/


    To install and configure Linux for Kerberos, see one of the many How-to''s available
    at the Internet. For example, the Linux Documentation Project:


    http://www.tldp.org/


    ## 2.5 Prerequisites and configuration for Kerberos


    The following steps provide an example about Kerberos setup on a Linux workstation.
    We assume that Kerberos and EIM are configured and working in a Windows environment
    with iSeries Access for Windows. Therefore, we use the Windows Active Directory
    Server as a Kerberos server.


    iSeries for Linux requires Kerberos Version 5. You could use the Heimdal or the
    MIT implementation of Kerberos. Most every Linux distribution includes installation
    packages of at least one of the implementations.


    Linux also supports Kerberos as an initial login method using the Pluggable Authentication
    Module (PAM) pam_krb. In this case Kerberos is used for Linux user authentication
    of the local password file. For our example, we do not need to change the Linux
    authentication to Kerberos but it might be used as an alternative Kerberos login
    method in your environment. If you plan to use pam_krb5, refer to the documentation
    of your distribution about the setup.


    After Kerberos5 and its utilities are installed on your Linux system you must
    have at least the Kerberos commands:


    - kinit

    - klist

    - kpasswd


    You must also have the Kerberos5 configuration file, which is /etc/krb5.conf.


    The krb5.conf contains the basic kerberos5 configuration and has the requirement
    to be customized for your environment. The following information about your Active
    Directory are required:


    - Windows login domain name in Kerberos Terms: default realm

    - DNS Name of Windows Server (Domain controller), provides the functions: Key
    distribution Center (KDC) and Password server


    If you are not sure about this configuration then you verify this in your existing
    Kerberos configuration on i5/OS. On IBM i5/OS, the Kerberos service is called
    Network Authentication Service (NAS) and the settings are located in a similar
    file like Linux:


    ```

    /IBM/UserData/OS400/NetworkAuthentication/krb5.conf

    ```


    Because Kerberos and EIM must already be configured on IBM i5/OS, the file must
    resemble Example 2-4. The double question mark and the parentheses are replacements
    for brackets, as ''??'' to ''<'' and ''??'', while double question mark and the
    arrow replaces brace, as ''??'' to ''<'' and ''??'' to ''>>''.


    ## Example 2-4: IBM i/OS Kerberos configuration


    ```

    <libdefaults>

    default_keytab = /QIBM/UserData/DS400/NetworkAuthentication/keytab/krb5.keytab

    default_realm = \ITSODOMAIN.TEST

    <realms>

    ITSODOMAIN.TEST = {

    kdc = master.itsodomain.test:88

    kpasswd_server = master.itsodomain.test:464

    }

    <domain_realm>

    .itso.rbm = ITSODOMAIN.TEST

    <capaths>

    ```


    Example 2-4 shows the settings used in Table 2-2.


    | Table 2-2 Settings for IBM i/OS Kerberos configuration | |

    | Description | Parameter | Value |

    |---|---|---|

    | Kerberos Realm/Name of our Active Directory | default_realm | ITSODOMAIN.TEST
    |

    | KDC/our Active Directory Server | kdc | master.itsodomain.test |

    | Password server/same as our KDC server | kpasswd_server | master.itsodomain.test
    |


    Insert your settings in the configuration file /etc/krb5.conf on your Linux system
    similar to Example 2-5. It is a convention that the Realm is always written in
    uppercase and DNS names are written in lowercase.


    Example 2-5 Example of /etc/krb5.conf


    ```

    [libdefaults]

    default_realm = ITSODOMAIN.TEST

    clockskew = 300


    [realms]

    ITSODOMAIN.TEST = {

    kdc = master.itsodomain.test

    admin_server = master.itsodomain.test

    kpasswd_server = master.itsodomain.test

    }


    [logging]

    kdc = FILE:/var/log/krb5kdc.log

    admin_server = FILE:/var/log/admin.log

    default = FILE:/var/log/krb5libig.log


    [appdefaults]

    pam = {

    ticket_lifetime = 1d

    renew_lifetime = 1d

    forwardable = true

    proxable = false

    retain_after_close = false

    minimum_uid = 0

    }

    ```


    If your IBM i/OS uses a different domain name than your Windows domain, then Kerberos
    requires to know about this. In our example, IBM i/OS is known in the network
    with the hostname: iseries.ito.ibm.com, but our Kerberos Realm is ITSODOMAIN.TEST.
    Therefore, add another section to the kerb5.conf file configure Kerberos to use
    the ITSODOMAIN.TEST settings if the server has a DNS extension of .ito.ibm.com:


    ```

    [domain_realm]

    .itso.rbm = ITSODOMAIN.TEST

    ```


    After the kerb5.conf is modified, check the following considerations:


    Kerberos expects that participating systems have a consistent time. If the time
    skew between systems exceed more than 300 seconds, we recommend to keep the time
    low.


    If your IBM i/OS uses a different domain name than your Windows domain, then Kerberos
