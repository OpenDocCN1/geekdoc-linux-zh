    , \"Dallas\"\n```\n\n12 rows fetched\n*** Approximate time to run this stmt: 36\
    \ milliseconds ***\n\n## 3.2.3 DataManagerII\n\nDataManagerII, which is included\
    \ in existing unixODBC, a graphical tool for exploring data sources. It allows\
    \ to explore data sources in a similar manner as exploring file systems.\n\nThe\
    \ following procedure provides the steps to work with unixODBC DataManagerII:\n\
    \n- 1. On a graphical session, open the DataManagerII in a Linux terminal or use\
    \ start menu → Run Command:\n`linux:> DataManagerII`\n\n- 2. Open your existing\
    \ Data Sources and log in to the IBM i5/OS as illustrated in Figure 3-5.\n\n![img/165c050f45ac58e1635258993855261a_51_0.png\n\
    \n- 3. DataManagerII has two panes. The left pane displays a Tree view. In this\
    \ view, you can see elements like tables, restriction keys, indexes, and views.\n\
    \nThe right pane is the detail view. It shows any details that may be available\
    \ for the selected item. In this view you can also execute SQL command to do queries.\
    \ Write an SQL query as illustrated in Figure 3-6. Click the runner to execute\
    \ the query.\n\n![img/165c050f45ac58e1635258993855261a_51_1.png\n\n## 3.3 Accessing\
    \ the iSeries DB2 UDB via OpenOffice.org\n\nOpenOffice.org is an open source productivity\
    \ suite like StarOffice. The source code for OpenOffice.org project was originally\
    \ provided by the Sun™ StarOffice™ project. OpenOffice.org and Sun's StarOffice\
    \ are functionally very similar and both include word processing, spreadsheet,\
    \ presentation applications. StarOffice has been successfully tested with the\
    \ iSeries Access DB for Linux but for the purpose of this demonstration, we use\
    \ the open source OpenOffice.org. The spreadsheet application includes a great\
    \ deal of the same functionality as MS Excel®, including the ability to query\
    \ remote databases via ODBC. This section describes using OpenOffice.org spreadsheet\
    \ to pull data from the DB2 UDB.\n\n### 3.3.1 Requirements\n\nA recent version\
    \ of OpenOffice.org 1.1.x or 2 must be installed. If your Linux distribution does\
    \ not include OpenOffice then you could download an x86 or PPC Linux. For the\
    \ installation instructions, program code, and other documentation, see:\n\nhttp://www.openoffice.org/\n\
    \n### 3.3.2 Importing DB2 UDB for iSeries data in OpenOffice.org\n\nOpenOffice.org\
    \ has the capabilities to import data from an ODBC datasource. The following steps\
    \ provide an example of the data import. We used OpenOffice.org 1.1.3.\n\n- 1.\
    \ On a graphical session, start OpenOffice with the command office or use Start\
    \ menu.\n2. Select File -> New -> Spreadsheet.\n\n> Note: Starting with Version\
    \ 2.0, OpenOffice includes its own database module. To configure an ODBC connected\
    \ data source on Version 2.0, use the database wizard, File -> New -> Database.\n\
    \n- 3. Select Tools -> Data Sources.\nThe OpenOffice Data Source Administration\
    \ window opens. This window helps you to configure an OpenOffice data source.\
    \ This new data source is usable only by OpenOffice.\n"
