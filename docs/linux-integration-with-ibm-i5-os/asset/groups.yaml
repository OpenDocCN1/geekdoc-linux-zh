    EBCDIC SQL 语句。此选项仅在连接到 1 或更高版本的服务器时可用。 | 0 = 向服务器发送 EBCDIC SQL 语句\n1 = 向服务器发送
    Unicode SQL 语句 |


    格式属性列在表 C-3 中。


    | 关键字 | 描述 | 默认值 |

    | --- | --- | --- |

    | DFT 或 DateFormat | 指定 SQL 语句中日期字面量使用的日期格式。 | 0 = yy/dd/yy (*JUL)\n1 = mm/dd/yy
    (*MDY)\n2 = dd/mm/dd (*DMY)\n3 = yy/mm/dd (*YMD)\n4 = mm/dd/yyyy (*USA)\n5 = yyyy-mm-dd-yyyy
    (*ISO)\n6 = dd.mm.yyyy (*EUR)\n7 = yyyy-mm-dd (*JIS) | 5 |


    152 Linux 与 IBM i/OS 的集成


