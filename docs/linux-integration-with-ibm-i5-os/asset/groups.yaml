    # Store the LDAP password


    Finally, you have to store the password that is used in the LDAP queries in the
    /etc/ldap.secret file. Ensure that there a newline (which means, RETURN/ENTER)
    at the end of the password. Also, you must change the mode (permissions) of the
    file so that only root can view the file (chmod 600 /etc/ldap.secret).


    # Samba configuration


    This section discusses the steps involved in configuring Samba Server 3.0.xx on
    SUSE Linux Enterprise 10. Configure Samba as to Windows-NT PDC and also configure
    it to synchronize the user passwords with the Linux password database.


    The following packages are required to be installed on SUSE Linux Enterprise Version
    10 for proper Samba functionality. Ensure that the following packages are installed.
    Perform the following steps:


    +   1. Use the Linux command to check for relevant packages. Log in to the root
    user before you issue this command.

    # rpm -qa | grep samba

    You see a list similar to the one in Example A-2. Verify if you have the samba-client-3.0.22-13.16
    and samba-3.0.22-13.16 listed out in your configuration:


    > Example A-2: Checking Samba server and its version


    ```

    linux:/etc/samba # rpm -qa | grep samba

    samba-client-64bit-3.0.22-13.16

    yasty2-samba-64bit-23.22-2.0

    samba-64bit-winbind-64bit-3.0.22-13.16

    samba-client-3.0.22-13.16

    kdebase3-samba-3.5.1-69.29

    samba-3.0.22-13.16

    samba-pdb-3.0.22-13.16

    samba-winbind-3.0.22-13.16

    yasty2-samba-server-2.13.11-1.3

    ```


    +   2. The next step is to configure the Samba Server configuration file. This
    file is named smb.conf and is located in the /etc/samba directory. You are required
    to edit the file to configure Samba server to act as a Windows NT PDC. After this
    is completed, you can join Windows client machines to the Samba PDC.


    +   3. The smb.conf file has distinct sections, the Global Section and the Shares
    Section and the Printers Section are some of the most commonly used. The actual
    working smb.conf is provided for representation in Example A-3. Make changes specific
    to your environment and save the file. Give due attention to your Domain Name.


    > Example A-3: Samba configuration file examples


    ```

    # smb.conf is the main Samba configuration file. You find a full comment

    # version at /usr/share/doc/packages/samba/examples/smb.conf.SUSE if the

    # samba-doc package is installed.

    # Date: 2006-06-17

    [global]

    ```


    #Name of the example domain that we are using for this scenario, replace this
    name with

    #the correct name for your organization.

    workgroup = ITSODMN'
