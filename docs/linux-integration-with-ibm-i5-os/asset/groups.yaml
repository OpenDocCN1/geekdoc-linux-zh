    # # Connect iSeries NetServer with Samba


    This chapter discusses the connection of Samba client on Linux to iSeries NetServer
    and gives examples of how it may be used in an IBM i5/OS and Linux environment.


    This chapter discusses the following:


    +   * iSeries NetServer Samba client support

    * NetServer versus Network File System (NFS)

    * Walkthrough on using iSeries NetServer Samba client support

    * Troubleshooting guide to iSeries NetServer Samba client support

    * Printing on IBM i5/OS printers'
  - '[PAGE 81]


    # 5.1 NetServer introduction


    There are some conventions that we use when discussing Samba access to iSeries
    NetServer. In Windows, a user maps a network drive to shared resources. In Linux,
    a user mounts an existing directory. For example, you might map a network drive
    to the I:\ drive in Windows, while you would mount a remote iSeries NetServer
    on /mnt/myshare in Linux. The ability to use any directory as a local mount lifts
    the restriction on how mapped drives you can have on a Linux system as you are
    not limited to single drive letters.


    # 5.1.1 NetServer versus NFS


    Both NetServer and NFS allow a Linux system to access the i/OS file system. Even
    if the development of the NetServer or Server Message Block (SMB) and the NFS
    protocol is not restricted to a specific operating system, NFS finds mostly in
    a UNIX® environment and SMB in a Windows environment.


    The main differences between NFS and NetServer connection is the user authentication.
    NetServer shares authenticate user per session. This means that if multiple users
    use the same mount of a NetServer at the same time, all of them are using the
    i/OS user profile which was specified during mounting. If every user requires
    to be authenticated on i/OS NetServer with his or her user profile, then every
    user requires one connection to NetServer. This behavior produces a large overhead
    in multiuser environment.


    NFS clients authenticate users on a server with their User ID (UID). This means
    that different users can use one connection to i/OS, but all are working with
    their own user profiles. Administrator must synchronize the UID on the Client
    with the UID on the server.


    In an NFS environment, the mount is made by an administrator and is often static/permanent.
    NetServer shares can also be mounted permanently by the root user, but there are
    tools for temporary/dynamic file access that non administrator users can use.
    One of the tools is smbclient. Using "smbclient to copy a file between iSeries
    NetServer and Linux" on page 72.


    # 5.1.2 iSeries NetServer Samba client support


    Starting with version 5 release 1 of OS/400, Linux Samba client connectivity is
    supported to iSeries NetServer. Thus, Linux PCs, or any Linux system for that
    matter, can mount network to iSeries NetServer and share files back and forth
    just as Windows PCs do.


    > Note: IBM i5/OS has an SMB client in the form of the QNTC file system. It was
    designed for accessing Windows NT® SMB servers and is not supported for use with
    Samba servers. Consider using NFS to access Linux servers from IBM i5/OS.'
