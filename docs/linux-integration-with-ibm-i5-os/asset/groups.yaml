    # 6.4.2 Apply object level security


    Object level security on an NFS directory means that a Linux user profile can
    be identified by IBM i/OS and mapped to a local user profile. Linux and Unix systems
    define user by User Identifications (UID) and Group Identifications (GID). UID
    and GID are unique numbers on each Linux system. The numbers are assigned by the
    system during creation of user profiles or by an administrator.


    # User Identification


    It is important that the UID is the same as the NFS server and client, otherwise
    you are connected with the permissions of another user profile. It does not matter
    names the user profile has. In IBM i/OS, the UID can be set in the creation of
    a user profile (CRTUSPRPF) or changed (CHGUSPRPF). In IBM i/OS, for example, the
    QSECOFR profile has a UID of 0, which is convenient because Linux the UID of root
    is 0. When changing the UID, the user must not own any files in the IFS.


