    \ = \"SELECT * FROM QIWS.QCUSTDT\";\n```\n\n```c\nvoid die(char *reason, SQLRETURN\
    \ code) {\n    if (code != 0) {\n        printf(\"Error code: %d\\n\", code);\n\
    \    }\n    printf(\"Failure: %s\\n\", reason);\n    exit(1);\n}\n```\n\n```c\n\
    int main(int argc, char *argv[]){\n    #define MAX_CONNECTIONS 5\n    char field1[255];\
    \ /* receives values from row */\n    char field2[255];\n    char field3[255];\n\
    \    SQLINTEGER ret1; /* For completeness. */\n    SQLINTEGER ret2; /* For NULL\
