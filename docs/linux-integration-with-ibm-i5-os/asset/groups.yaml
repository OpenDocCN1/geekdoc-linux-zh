    # # 5.3 Using iSeries NetServer Samba support


    This section provides an introduction to utilizing iSeries NetServer support for
    Linux Samba clients.


    iSeries NetServer is a large topic and has its own IBM Redbook titled The AS/400
    NetServer Advantage, SG24-5196. For details on iSeries NetServer, consult this
    manual. Up-to-date details on iSeries NetServer and its support for Linux Samba
    clients are available at:


    http://www.ibm.com/servers/eserver/iseries/netserver/


    # # 5.3.1 iSeries NetServer configuration


    Before a client can get access to IBM i/OS file system, a share has to be defined
    on iSeries Net. This is accomplished via iSeries Navigator. Perform the following
    steps:


    +   1. Open iSeries Navigator.


    +   2. Expand sections iSeriesname -> File Systems -> Integrated File System ->
    Root. See Figure 5-2.


    ![](img/165c050f45ac58e1635258993855261a_83_0.png)


    Figure 5-2 iSeries Navigator


    +   3. Create a new directory under the root or /home directory. Right-click the
    directory and select New Folder.


    +   4. Name the folder and click OK. The directory /root/test is the one we created
    in this example.


    +   5. This folder opens in the right-hand window.


    +   6. Right-click the folder and select, Sharing -> New Share. As the name of
    the share we use is Test.


    +   7. Change the access to Read/Write. You may also provide a description for
    the iSeries NetServer share. The same name can be different from the folder. Click
    OK.


    > Note: Make a note of the small blue band that is displayed beneath the folder.
    This indicates that the directory has been shared.


    After these steps are completed, you are ready to access the share from a Samba
    client.'
