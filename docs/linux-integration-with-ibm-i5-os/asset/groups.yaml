    \ i5/OS syslog 程序\n\nsyslog 程序与 socket 服务器不同，因为 syslog 程序预计仅在 IBM i5/OS 上运行。根据此，所有语句都需要明确代码。还需要获取额外数据，如当前时间和传输控制协议/网际\
    \ (TCP/IP)。最后，必须打开一个文件来存储传入消息并将选定的消息发送到 QSYSOPR。\n\n示例 B-2 所示程序流程：\n\n- 打开存储所有消息的文件。如果文件不存在，则创建它。否则，以追加模式打开文件。这确保不会丢失已记录的消息。\n\
    - 打开 socket 描述符。\n- 将端口 514 绑定到新的 socket 描述符。这是 Linux 使用的端口。如果连接 Linux，IBM i5/OS\
    \ 程序也需要更改。\n- 创建转换表。所有传入数据均来自 Linux，因此从美国标准代码 (ASCII) 转换为扩展二进制编码 (EBCDIC)。启动程序主体循环直到停止：\n\
    \  a. 从 socket 接收传入请求。\n  b. 将数据转换为 EBCDIC。\n  c. 移除末尾的换行符。\n  d. 获取系统信息并将其添加到消息头部。\n\
