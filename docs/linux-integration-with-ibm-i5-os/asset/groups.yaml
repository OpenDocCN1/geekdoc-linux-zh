    # Introduction to Linux integration with IBM i5/OS


    This chapter provides a brief overview of the connection methods between Linux
    and IBM i5/OS. This chapter discusses the following areas:


    +   - Advantages of integrating Linux with IBM i5/OS

    - Overview of communication techniques between Linux and IBM i5/OS'
  - '[PAGE 15]


    # 1.1 Advantages of integrating Linux with IBM i5/OS


    IBM is committed to supporting the Linux operating system on the iSeries platform.
    There is the capability of installing Linux onto iSeries partitions, Integrated
    xSeries Server (IXS), and Integrated xSeries Adapter (IXA) thus reducing the capital
    expenditure of purchasing extra hardware. This configuration is covered in detail
    in the IBM eSeries Server: An Implementation Guide, SG24-6232, Implementing Linux
    on Integrated xSeries Solutions for iSeries, SG24-6379, and Implementing Web Applications
    with CM Information Integrator for Content and OnDemand Web Enable Kit, SG24-6338.


    IBM has further enhanced its support of Linux by developing several methods by
    which the actual data and applications running on both Linux and IBM i5/OS can
    be integrated. One example is iAccess for Linux product, which enables a Linux
    user to connect to an IBM i5/OS with a 5250 session or Open Database Connectivity
    (ODBC) enabled applications.


    The ability to connect Linux and i5/OS applications draws the main strengths of
    both operating systems. For example, the database applications of i5/OS and the
    web qualities of Linux, provide a powerful, consolidated computing environment.


    Traditionally, the iSeries system and its predecessor, the AS/400 has been used
    as a database machine by customers to store and retrieve vast amounts of information
    relating to their business. IBM DB2 Universal Database for iSeries is fully integrated
    into the i5/OS operating system. Customers can benefit from the single level security,
    object, file and print management, reliability and scalability of the iSeries.
    Unlike some other system types, as a customer''s business expands, the iSeries
    system hardware can be upgraded to accommodate the requirement for greater processing
    power or storage space.


    Linux is recognized as an e-business system. At present high percentage of business
    implementations of Linux are Web servers using the Apache Web Server and Tomcat
    Web Server. The Linux operating system provides an excellent environment on which
    to run applications based on PHP Hypertext Preprocessor (PHP) and Perl.


    However, the following implementation types are also popular:


    +   * Mail Servings like Sendmail mail gateway

    * File and Print Serving with Samba

    * Firewall


    Given the wide-welcome development community and the open source of Linux, new
    and appealing applications reflecting the ever-changing domain of e-business can
    be developed relatively quickly and economically. Applications requiring access
    to a database may now be enhanced by the ability to access an existing DB2 Universal
    Database running on an iSeries logical partition, reducing development time and
    costs.


    # 1.2 Overview of Linux connection techniques


    This section presents an overview of the methodologies that you can use to connect
    the Linux operating system with i5/OS. The techniques and methods are expanded
    upon in subsequent chapters of this book, in some cases conjunction with sample
    program code.'
  - '[PAGE 16]


    # 1.2.1 iSeries Access for Linux


    iSeries Access for Linux offers Linux-based access to i/OS. It allows you to establish
    a 5250 session to an i/OS from a Linux system. It also includes the ODBC driver
    to access the DB2 Universal Database (UDB) for iSeries.


    iSeries Access for Linux is available for Intel® and IBM platforms. It runs on
    standalone PC, IBM PowerPC®, on IXA and IXS, and on IBM eServer logical partitions.


    The iSeries Access for Linux product is further explained in Chapter 2, "iSeries
    Access for Linux" on page 5.


    The following Web site presents current information about iSeries Access for Linux:

    http://www.ibm.com/servers/eserver/iseries/access/linux/


    # 1.2.2 The iSeries Access ODBC Driver for Linux


    The iSeries ODBC Driver for Linux is a part of iSeries Access for Linux. It allows
    access to an IBM DB2 UDB for iSeries from a Linux system. This driver is based
    upon the ODBC driver shipped with the iSeries Access for Windows product 5722XE1
    and similarly accesses the system using the Host Servers interface via a socket
    connection.


    The ODBC driver is covered in Chapter 3, "Connect IBM i/OS with ODBC" on page
    29.


    # 1.2.3 IBM i/OS connection using the JDBC driver


    The IBM Toolbox for Java product 5722JC1 contains a Java Connectivity (JDBC) driver
    which allows you to use JDBC programming interface (API) to issue Structured Query
    Language (SQL) statements and to process results from the iSeries database. The
    Toolbox for Java also contains a set of Java classes enhancing the ease with which
    you can develop programs to access IBM i/OS data and resources.


    The JDBC driver is further explained in Chapter 4, "Connect IBM i/OS with JDBC"
    on page 51. Sample program code demonstrating it is also presented.


    The following Web site presents information about the iSeries driver:

    http://www-03.ibm.com/servers/eserver/iseries/toolbox/


    # 1.2.4 NetServer support for Linux clients using Samba


    Support has been added to VSR1 of OS/400 allowing Samba clients, using the Server
    Message Block (SMB) protocol. The support that is being provided here allows a
    Linux client running Samba to connect to iSeries Support for Windows Network Neighborhood,
    iSeries NetServer, through the smbclient and smbmount utilities.


    The iSeries NetServer samba client is covered in Chapter 5, "Connect iSeries NetServer
    with Samba" on page 67.


    The following Web site presents current information about the iSeries NetServer:

    http://www-1.ibm.com/servers/eserver/iseries/netserver/'
  - '[PAGE 17]


    # 1.2.5 Network File System


    The Network File System (NFS) is a file system that allows users to access files
    located on a remote computer via an Internet Protocol (IP) network.


    The nature and structure of the Linux file system lends itself to being stored
    in different places. The Network File System was developed to allow machines to
    read and write files on remote systems as though they were on a local hard drive.
    This facilitates the seamless sharing of files across a network.


    The NFS is further explained in Chapter 6, "Connect IBM i5/OS with NFS" on page
    81.


    # 1.2.6 File Transfer Protocol


    File Transfer Protocol (FTP) is the standard file transfer protocol for Transmission
    Control Protocol/Internet Protocol (TCP/IP). You can transfer text and binary
    data between Linux and i5/OS using FTP.


    FTP is discussed in further detail in Chapter 7, "Connect IBM i5/OS with FTP"
    on page 89.


    # 1.2.7 Programmed socket connections


    Sockets and the programs written on top of sockets are able to handle almost any
    integration you want to provide between Linux and i5/OS.


    Chapter 8, "Connect IBM i5/OS with socket programming" on page 95, provides an
    example how to work with sockets and gives you an idea about how to use it for
    your purposes.'
  - '[PAGE 18]


    # 2


    # iSeries Access for Linux


    iSeries Access for Linux is a new offering in the iSeries Access product line.
    iSeries Access for Linux allows you to access the DB2 Universal Database (UDB)
    for iSeries using its Open Database Connectivity (ODBC) driver and to establish
    a 5250 session to an IBM i5/OS system from a Linux client.


    This chapter covers the following items:


    +   - iSeries Access for Linux overview

    - iSeries Access for Linux requirements

    - Installation procedure

    - 5250 configuration


    ODBC topic is discussed in detail in Chapter 3, "Connect IBM i5/OS with ODBC"
    on page 29.'
- md: "\n## 2.1 iSeries Access for Linux product overview\n\niSeries Access for Linux\
    \ is an additional offering in the iSeries Access family 5722XW1. It offers Linux-based\
    \ access to i5/OS systems. iSeries Access for Linux enables users to leverage\
    \ business information, applications, and resources across an enterprise by extending\
    \ the i/OS resources to Linux.\n\n### 2.1.1 iSeries Access for Linux product features\n\
    \niSeries Access for Linux consists of the following product features:\n\n- *\
    \ *iSeries Access ODBC Driver*\nLinux applications written to the ODBC programming\
    \ interfaces (APIs) can use this driver to access DB2 DB for iSeries. The iSeries\
    \ Access ODBC Driver is based on the ODBC driver in iSeries Access for Windows.\
    \ It uses the iSeries database Host Servers as the access point to the system.\n\
    \n- * *The 5250 emulator*\nIt provides the function equivalent to that of an IBM\
    \ 5250 terminal. The emulator also provides extended 5250 terminal functions similar\
    \ to that the IBM PC5250 emulator provides. The emulator supports the following\
    \ functions:\n    - Customizable multi-selection support up to 99 sessions\n \
    \   - Best Fonts: different fonts are available and the font to the windows size\n\
    \    - Multi language support\n    - Macro record/playback\n    - Copy/paste\n\
    \    - 24x48 and 27x32 screen size support\n    - Screen print to Postscript printers\n\
    \    - Hot spot highlighting option\n    - Automatic, customizable, communication\
    \ error recovery\n    - Double-byte character set (DBCS) support is available\
    \ in Version 1.8\n    - Single sign-on and Kerberos support in Version 1.10\n\n\
    ### 2.1.2 iSeries Access for Linux facts sheet\n\nThis section covers the topics\
    \ related to this product. At the time of writing this the actual version of iSeries\
    \ Access for Linux used was 1.10.\n\nLatest available version is 5.4.0-1.0\n\n\
    ## Platform choice\n\nThe iSeries Access for Linux is designed to work on Linux\
    \ systems based on the Intel and IBM POWER™ platform. POWER platforms include:\n\
    \n- Linux partitions on i5\n- Linux partitions on p5\n- IBM OpenPower™ Server\n\
    \nFor Intel compatible systems:\n\n- Integrated xSeries Server (IXS)\n- xSeries\
    \ servers connected via Integrated xSeries Adapter (IXA)\n- Stand alone Intel\
    \ PC and Server\n\n## Product architecture\n\nThe product is available in a 32-bit\
    \ version as an Intel and a POWER implementation.\nLatest version supports additional\
    \ 64-bit platforms (PowerPC-64 and x86-64). The ODBC and Extended Dynamic Remote\
    \ Support (EDRS) drivers are included in both the 32-bit and 64-bit packages.\
    \ The 5250 emulator is included with the 32-bit packages but not included with\
    \ the 64-bit packages.\n\n## License requirements\n\niSeries Access is not an\
    \ Open Source product. You require a license of IBM iSeries Family 5722XX for\
    \ 5250 emulation. License is not required for using the ODBC driver. Licensing\
    \ for iSeries Access for Linux is the same as iSeries Access for Windows.\n\n\
    ## Availability\n\niSeries Access for Linux is available as a downloadable package.\
    \ Visit the following page for the latest version:\nhttp://www.ibm.com/servers/eserver/iseries/access/\n\
    \n## 2.2 iSeries Access for Linux requirements\n\nThis section lists the requirements\
    \ for iSeries Access for Linux even before its installation. Check the i/OS requirements\
    \ first:\n\n- For 5250 emulation, IBM iSeries Access Family 5722XW1 requires to\
    \ be installed and you require a license of the Product.\n- Enable the QUSER user\
    \ profile. Use the following procedure to verify the user profile status. On 5250\
    \ command entry screen, type:\nDSPUSRPRF USRPRF (QUSER)\nThis command shows the\
    \ status of QUSER, which must be *ENABLED. If the status is *DISABLED, type:\n\
    CHUSRPRF USRPRF (QUSER) STATUS (*ENABLED)\n- Transmission Control Protocol/Internet\
    \ Protocol (TCP/IP) must be up and running on your IBM i5/OS.\n- Start the hosts\
    \ servers in IBM i5/OS. To start them type:\nSTRHOSTSVR *ALL\n\nOn Linux client,\
    \ require the following packages installed:\n- glibc 2.2 or later\nThis package\
    \ contains the GNU C Library. It contains the most important standards libraries\
    \ for C, math, and Portable Operating System Interface (POSIX). Use the following\
    \ command to check your installed version:\n\n```\nlinux:~> rpm -qa | glibc\n\
    glibc-2.4-31.2\nglibc-64bit-2.4-31.2\n```\n\n- Red Hat Package Manager (RPM) 3.0\
    \ or later\n\nRPM manages the software packages. With it you can install, remove,\
    \ and update software packages. Check the installed version:\n\n```\nlinux:> rpm\
    \ --version\nRPM version 4.4.2\n```\n\n- openmfit 2.0 or later\n\nOpenmfit is\
    \ a runtime environment. This software is necessary for 5250 emulator. To check\
    \ if it is installed, type:\n\n```\nlinux:> rpm -qa | grep openmfit\n```\n\nIf\
    \ the system returns you lines of its package, it is installed.\n\n- unixODBC\
    \ driver manager Version 2.0.11 or later\n\nThis provides a standard interface\
    \ between applications and ODBC driver on the Linux platforms. To check if it\
    \ is installed, type:\n\n```\nlinux:> rpm -qa | grep openmfit\n```\n\nTo get more\
    \ information, go to: http://www.unixodbc.org\n"
  mdcn: "\n\n## 2.1 iSeries Access for Linux 产品概述\n\niSeries Access for Linux 是 iSeries\
