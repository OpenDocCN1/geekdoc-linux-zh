    # 3.3 Accessing the iSeries DB2 UDB via OpenOffice.org


    OpenOffice.org is an open source productivity suite like StarOffice. The source
    code for OpenOffice.org project was originally provided by the Sun™ StarOffice™
    project. OpenOffice.org and Sun''s StarOffice are functionally very similar and
    both include word processing, spreadsheet, presentation applications. StarOffice
    has been successfully tested with the iSeries Access DB for Linux but for the
    purpose of this demonstration, we use the open source OpenOffice.org. The spreadsheet
    application includes a great deal of the same functionality as MS Excel®, including
    the ability to query remote databases via ODBC. This section describes using OpenOffice.org
    spreadsheet to pull data from the DB2 UDB for iSeries via ODBC.


    # 3.3.1 Requirements


    A recent version of OpenOffice.org 1.1.x or 2 must be installed. If your Linux
    distribution does not include OpenOffice then you could download an for x86 or
    PPC Linux. For the installation instructions, program code, and other documentation,
    see:


    http://www.openoffice.org/


    # 3.3.2 Importing DB2 UDB for iSeries data in OpenOffice.org spreadsheets


    OpenOffice.org has the capabilities to import data from an ODBC datasource. The
    following steps provide an example of the data import. We used OpenOffice.org
    1.1.3.


    +   1. On a graphical session, start OpenOffice with the command office or use
    Start menu.

    2. Select File -> New -> Spreadsheet.


    > Note: Starting with Version 2.0, OpenOffice includes its own database module.
    To configure an ODBC connected data source on Version 2.0, use the database wizard,
    File -> New -> Database.

    Again, we are using OpenOffice.org 1.1.3, but configuration steps must be similar
    to what you have with Version 2.0.


    This opens the spreadsheet application Calc.


    +   3. Select Tools -> Data Sources.

    The OpenOffice Data Source Administration window opens. This window helps you
    to configure an OpenOffice data source. This new data source is usable only by
    OpenOffice.'
