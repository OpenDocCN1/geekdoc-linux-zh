    The remote system name is iseries.itso.ibm.com.

    CPC2102 - Library SSOTEST created.


    Even in ODBC data source name (DSN), a user name of Kerberos is allowed. This
    means every ODBC application can get the advantages of Kerberos single sign-on.


    ## 2 Encrypt the connection with Secure Sockets Layer


    If you use a secured login method such as Kerberos, the 5250 Telnet connection
    is still unencrypted. This means that persons who have access to the network environment
    can easily monitor and change every input and screen data. To prevent any unauthorized
    data access in the network, the Secure Sockets Layer (SSL) protocol was invented.
    It provides data encryption, integrity, and supports authentication of client
    and server.

    iSeries Access for Linux can use the advantages of iSeries by using the Linux
    tunnel.


    For SSL communication you must apply certificates to each IBM i/OS TCP/IP server
    or Host you want to use. Otherwise the SSL TCP/IP ports are not available. How
    to set up a public/private infrastructure is described in the iSeries Infocenter
    under Security -> Secure Sockets Layer:


    ```

    http://publib.ibm.com/pubs/html/a500/

    ```


    The program tunnel establishes an SSL tunnel between a server and a client. In
    this case **stunnel connects** to the Telnet Port on IBM i/OS, transfers the encrypted
    data to the Linux client, decrypts it and provides the telnet stream to local
    applications. Instead of connecting IBM i/OS, **ibm5250** connects to the end
    of the SSL tunnel at localhost.

    See Figure 2-7: After the tunnel is established every user on the Linux client
    can use it. The same scenario also applies to Host server connections such as
    ODBC.


    ![](img/165c050f45ac58e1635258993855261a_38_0.png)


    Figure 2-7 Stunnel connection


    The stunnel command reads his configuration from a file. The structure of the
    file is very simple. First specify that you use the client method of tunnel. Then
    add a section for every SSL service you want to connect to:


    - Service name: [service]

    - Local IP address and port: accept = localIPAddress:localPort

    - Remote IP address and port: connect = remoteHost:remotePort


    An example configuration is provided in Example 2-7.


    Example 2-7 Stunnel configuration file: stunnel.conf


    ```conf

    # Enable client mode

    client = yes


    # Debug and Foreground are for testing / Uncomment for debugging stunnel problems

    ##debug = 5

    #foreground = yes


    # Services: The sections contain the port maps for iSeries Access connections.


    # Used for 5250 Telnet emulation, ibm5250

    [telnet]

    accept = 127.0.0.2:23

    connect = iseries.itbo.com:992


    # Used for license and conversion tables (ibm5250, cwbnltbl)

    [as-central]

    accept = 127.0.0.2:8470

    connect = iseries.itbo.com:9470


    # Used for ODBC (rdmtdoc, cwbrunsq, isql, DataManager, ...)

    [as-database]

    accept = 127.0.0.2:8471

    connect = iseries.itbo.com:9471


    # Used for Remote commands (rmtcmd)

    [as-rmtcmd]

    accept = 127.0.0.2:8475

    connect = iseries.itbo.com:9475


    # Used for SSO Signon

    [as-signon]

    accept = 127.0.0.2:8476

    connect = iseries.itbo.com:9476

    ```


    For the first use of stunnel may you uncomment foreground = yes line and start
    the SSL tunnel as root using the command stunnel.conf. Open a 5250 session with
    ibm5250 127.0.0.2. If all works correctly you see an output of stunnel similar
    to Example 2-8.


    Example 2-8 Output of a successful connection through tunnel


    ```

    root@linux:~ stunnel tunnel.config

    2005.08.01 LOG[]: stunnel 4.07 on i686-6-linux-gnu PTHREAD+POLL+IPv4 with

    OpenSSL 0.9.7e 25 Oct 2004

    2005.08.01 LOG[]: 5 clients allowed

    2005.08.01 LOG[]: as-central connected from 127.0.0.2:21774

    2005.08.01 LOG[]: Connection closed: 783 bytes sent to SSL, 215 bytes sent to

    socket

    2005.08.01 LOG[]: telnet connected from 127.0.0.2:2218

    ```


    This configuration establishes an encrypted connection between Linux and IBM/OS,
    but it does not prove whether the remote computer is IBM/OS that you want to connect.
    To prevent a so called man in the middle attack, tunnel can verify the remote
    server with a certificate. During establishing an SSL connection, the server provides
    his certificate to the client in order which the client can verify his authenticity.
    On many IBM/OS a signed certificate is used. Means, IBM/OS is also the Certification
    Authority (CA).


    If you use self-signed certificates the public key is stored on IBM/OS Integrated
    File System (IFS) in /AS/Data/CertAuth/CA.txt. You can download it with ftp in
    American Standard Code (ASCII) or use the procedure provided in Example 2-9. The
    example retrieves the public key and convert it with iconv from EBCDIC encoding
    to ASCII.


    If you have your own infrastructure or a certificate signed by some other you
    must use the appropriate key. See Example 2-9: Install i/OS certificate


    ```

    linux://iseries.ibm.com/

    Password:

    Domain=[i/400] Support for Network

    tunnel > get userdata/ics/certauth/ca.txt size 765 (249.0 kb)/(249.0 kb)

    tunnel > exit

    tunnel > iconv -f IBM -t EBCDIC -o ca

    tunnel > cat.txt

    BEGIN CERTIFICATE

    MIIC9TCCAlGAwIBAgpleIqHK1g9W0QAFADBIMQswCQYDVQGEwJkZFTEMMAUECMQwMDY0QVqkJvSR1GT2XpMXETAPBNGY

    

    END CERTIFICATE

    ```


    The default directory for tunnel configuration is /etc/tunnel/. You must use your
    CA key file and the tunnel.conf file. Add the following text in the First of the
    tunnel.conf file:


    ```

    # enable CA validation

    CAFile = /etc/tunnel/ca.txt

    verify = 2

    ```


    To test the certificate for your authentication start tunnel and connect to IBM
    i/OS with it this test must show a tunnel message as follows:


    ```

    2005.08.10 LOG[5]: telnet connected from 127.0.0.2:1039

    2005.08.10 LOG[5]: VERIFY OK: depth=1,c=/us/st/0=IBM-OS/ITS-CA

    2005.08.10 LOG[5]: VERIFY OK: depth=0,c=/us/mm/0=IBM-OS/ISERIES

    ```


    After you finish the tests do not forget to comment the foreground = yes parameter
    in the stunnel.conf file.


    For a better usability you can alias names in your local /etc/hosts file such
    as:

    127.0.0.2 SSLSeriesA

    127.0.0.3 SSLSeriesB


    > Note: If you want to map the full IBM i/OS DNS name to a localhost address instead
    of an alias case you must use the IP address of IBM i/OS in your stunnel.conf
    file.


    If you use Kerberos in this environment then you have to map the localhost address
    to the fully qualified domain name of your IBM i/OS. Otherwise the Kerberos tickets
    are not created for the correct principal, all non-SSL services are not reachable
    therefore, all non-SSL services are not reachable with this DNS name.


    ## 2.7 Printing service


    You cannot use any printing service. iSeries Access for Linux does not provide
    5250 printer emulation. However, it is possible to print from an iSeries to a
    Linux printer. Usually the printing system on a Linux system supports to send
    and receive Print jobs via Line Printer Daemon (LPD), Line Print Requestor (LPR),
    and/or Internet Printing Protocol (IPP). Review your Linux documentation about
    enabling your local Linux printer for remote network access.


    IBM i/OS is able to print to a Linux client using a remote out queue with LPR/LPD.
    This configuration is in detail explained in the IBM Redbook titled IBM AS/400
    Printing V, SG24-2160.


    The usage of the Internet Printing Protocol is described in the IBM Redbook titled
    V5 TCP/IP Applications on the IBM eServer Server, SG24-6321.

