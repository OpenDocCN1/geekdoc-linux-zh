    # 4.2.2 Creating the sample database


    All the examples in this chapter use a sample database. The creation of the sample
    database is done using the stored procedure CREATE_SQL_SAMPLE("library"), where
    library is the name of the sample library you wish to create. This stored procedure
    is new in version 5 release 1 and shipped with the operating system. To create
    the sample database perform the following steps:


    +   1. STRSQL

    Get into interactive SQL

    2. CALL QSYS/CREATE_SQL_SAMPLE("DBSAMPLE")

    To create the library (or collection in SQL terminology) with the sample tables


    Creating the sample database takes a couple of minutes to complete. After it is
    finished you have 13 tables and numerous logical views. Sample data is also included
    in the tables. There are two sets of database tables in the sample schema. One
    includes ORG, STAFF and SALES. This set is a very simple schema with limited interaction
    between the tables and less complex data types within the tables. The remaining
    tables make up a more complicated database schema and make use of more complex
    data types, such as BLOBs and CLOBs. These tables also interact with each other
    more.


    # 4.3 Command line JDBC application


    Get started with JDBC programming on Linux, you can start with a command line
    approach where all input is from standard input and all the output is sent to
    standard out. This is a great way to test your JDBC and SQL code without the worries
    of the graphical interfaces. The sample command line JDBC application selects
    the records of the ORG table to get the list of departments. It then takes the
    department number and runs a prepared SQL statement to get the members of each
    department, their position, and the number of years with the company. This information
    is sent to standard out for each department, producing a department type listing.


    Use javac to create the Java program, which is a program source that is shown
    in Example 4-1 on page 54:


    ```

    linux:~ javac SimpleJDBC.java

    ```


    This executes the Java code. To run the program, run the java command:


    ```

    linux:~ java SimpleJDBC

    ```


    You may have to add the current directory to your CLSPATH to get the Java program
    to. To do this use the following command:


    ```

    linux:~ export CLSPATH=$CLSPATH:./jopen/lib/jt400.jar.

    ```


    Or use the classpath parameter to include jtopen and the program search for the
    path:


    ```

    linux:~ java -classpath ./jopen/lib/jt400.jar:: SimpleJDBC

    ```


    This adds the current directory (identified by the '':'') to the end of the current
    path. The output of this Java program is sent to standard out. If you want to
    send the data to a file, you can redirect standard out to a file using the following:


    ```

    linux:~ java SimpleJDBC > jdbc.output

