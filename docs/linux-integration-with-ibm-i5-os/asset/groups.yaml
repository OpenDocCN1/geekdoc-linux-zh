    ```


    Alternatively, you can go to the IBM Redbooks Web site at:


    ```

    ibm.com/redbooks

    ```


    Select the Additional materials and open the directory that corresponds with the
    IBM Redbook number, SG24-6551.


    Use your browser and point to the previously mentioned location and save the Scripts.zip
    file to your Windows client PC. This scenario package contains all the files that
    you require to restore/install/configure in the Linux server and the i/OS server.
    The following sections explain all these procedures in detail.


    Specifically the Scripts.zip archive contains the following structure as Figure
    A-2 illustrates.


