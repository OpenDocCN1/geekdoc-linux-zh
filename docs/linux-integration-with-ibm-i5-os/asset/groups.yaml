    \    - 复制/粘贴\n    - 支持 24x48 和 27x32 屏幕尺寸\n    - 屏幕打印到 Postscript 打印机\n    - 热点高选项\n\
    \    - 自动、自定义的通信错误恢复\n    - 1.8 版本支持双字节字符集 (DBCS)\n    - 1.10 版本支持单点登录和 Kerberos\n\
    \n### 2.1.2 iSeries Access for Linux 数据表\n\n本节介绍了与该产品相关的主题。在编写本文时，iSeries Access\
    \ for Linux 的实际版本为 1.10。\n\n最新可用版本为 5.4.0-1.0\n\n## 平台选择\n\niSeries Access for\
    \ Linux 设计用于基于 Intel 和 IBM POWER™ 平台的 Linux 系统。POWER 平台包括：\n\n- i5 上的 Linux 分区\n\
    - p5 上的 Linux 分区\n- IBM OpenPower™ 服务器\n\n对于 Intel 兼容系统：\n\n- 集成 xSeries 服务器 (IXS)\n\
