    users are created with the same password as their usernames to maintain integrity
    while importing them into Linux. Following this then the chguser script is invoked
    with two arguments, username and password. This script automatically set the password
    for both the user in the Linux System and the Samba password file. Repeat this
    for all the users that you have added in i/OS and then imported using dosingle
    script.


    You can execute the chguser script as follows. On the Linux command prompt issue
    the following:


    ```

    # /usr/local/bin/chguser username password

    ```


    # Detailed logical flow


    Supported for user profiles a number of files to be installed in both i/OS and
    Linux. As you may have realized by now this entire procedure is fairly complex
    and you may require to understand how the system is working. The following sections
    explain in details the purpose and function of all the scripts and their relationships.
    You may require to understand this flow in case you have to change or adapt the
    scenario to your specific situation or requirement.


    +   - dosingle

    Per script to import new users with projected profiles from i/OS. This script
    imports all the users with projected profiles in i/OS and creates respective users
    in the Linux Server. It only creates the Linux System users. This script does
    not reset the passwords of existing i/OS users in Linux and Samba servers. The
    chguser script to set a Linux password and to create a Samba password for these
    new users.

    - chguser

    Bash script is invoked with two arguments, username and password. Each time this
    script is run, it sets the password of the Linux user to the value supplied. It
    also sets the password for the Samba user as well. If the Samba user does not
    exist, it creates the Samba user. This script is intended to be used when you
    have already imported the bulk of your i/OS users earlier by utilizing the "doall"
    script. This is a follow up action after you runringle script.

    - chgiuser

    Bash script that is called by Samba Server through the use of passwd parameter
    in sm.conf file. The purpose of this file is to look up and change the password
    for the user in i/OS and the local Linux System. Samba takes care of changing
    the password inside the Samba password database. This script is also called by
    the chguser and smbchat scripts in relevant situations.'
