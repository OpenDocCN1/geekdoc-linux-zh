    \nFigure A-42 Scenario validation\n\n# Windows XP Professional: Change password\n\
    \nThe procedure for changing the password on a Windows XP Professional system\
    \ is as that documented for Windows 2000 Professional. Refer to “Windows 2000\
    \ Professional: Change the domain password” on page 135.\n\n# Linux system message\
    \ logging\n\nThis appendix describes a mechanism for logging Linux system messages\
    \ in IBM i5/OS using syslog on Linux and a syslogd server program on IBM i5/OS.\n\
    \nAll Linux system messages are logged to a file and those that are selected go\
    \ as messages to QSYSOPR. This allows you to effectively monitor multiple Linux\
    \ systems from an IBM i5/OS partition.\n\nEvery Linux system can send messages\
    \ whether it is installed on a standalone PC, a logical partition (LPAR), or on\
    \ an IXS/IXA. Topics in this appendix include:\n\n- Introduction to syslogd\n\
    - Linux configuration\n- IBM i5/OS configuration\n\n# Introduction to syslog\n\
    \nSyslog is a Linux daemon responsible for logging messages on UNIX and Linux\
    \ systems. Processing of the syslog daemon is controlled by the /etc/syslog.conf\
    \ file and you can find detailed information about this configuration file using\
    \ the following Linux command: \n\n```\nlinux:-> man syslog.conf\n```\n\nThe important\
    \ part of the man page is the section talking about remote logging. Built in to\
    \ the syslog program is the ability to send the system messages to a remote system\
    \ where it is logged. At the remote system you get a time stamp, source originating\
    \ system, and the original message as follows:\n\nNOTE: SLESI10 also comes with\
    \ syslog-ng, which is a \"new-generation\" syslog (replacement) for Unix and Unix-like\
    \ systems. It tries to fill the gaps in the original syslog. Processing of the\
    \ syslog daemon is controlled by the /etc/syslog-ng/syslog-ng.conf file and detailed\
    \ information about this configuration file can be found using the following Linux\
    \ command:\n\n```\nlinux:-> man syslog-ng.conf\n```\n\nWe are using syslog daemon\
    \ in this book.\n\n# Syslog system configuration\n\nThe configuration of syslog\
    \ is controlled by the /etc/syslog.conf file on your Linux server. There is extensive\
    \ help for this configuration in the man pages. The configuration of this file\
    \ allows an administrator to log certain messages (those coming from certain applications,\
    \ of a certain severity, and so on) to files or to reroute these messages to another\
    \ system running the syslog job. Typically the remote system is another Linux\
    \ system, but with the i5/OS syslog program these messages can easily be rerouted\
    \ to IBM i5/OS.\n\nExample-1 a copy of the /etc/syslog.conf file from one of the\
    \ example Linux systems.\n\nExample:B-1 File /etc/syslog.conf\n\n```\n# /etc/syslog.conf\
    \ - Configuration file for syslog(0)\n#\n# For info about the format of this file,\
    \ see \"man syslog.conf\".\n#\n#\n#\n*.emerg *\n\n# enable this, if you want that\
    \ root is informed\n# immediately, e.g. of logins\n# *.alert root\n\n#\n# all\
    \ email-messages in one file\n#\n#mail.* -var/log/mail\n```\n\n```\n#\n# all news-messages\n\
    # these files are rotated and examined by \"news.daily\"\n#news.crit-*/var/log/news/news.crit\n\
    #news.err-*/var/log/news/news.err\nnews.notice-*/var/log/news/news.notice\n# enable\
    \ this, if you want to keep all news messages\n# in one file\n#news.*- /var/log/news/news.all\n\
    ```\n\n```\n#\n# Warnings in one file\n#*.warn;*.*=err-/var/log/warn\n#*.crit\
    \ /var/log/warn\n```\n\n```\n#\n# save the rest in one file\n#*.*;mail.none;news.none-*/var/log/messages\n\
    ```\n\n```\n#\n# enable this, if you want to keep all news messages\n# in one\
    \ file\n#.*- /var/log/allmessages\n*.* SYSTEM\n```\n\n```\n#\n# Some foreign boot\
    \ scripts require local7\n#local10,local11.*-var/log/localmessages\n#local12,local13.*-var/log/localmessages\n\
    #local14,local15.*-var/log/localmessages\n#local16,local17.*-var/log/localmessages\n\
    ```\n\n```\n#kern.*-var/log/firewall\n```\n\nThe changes to rotate this file are:\n\
    *.*- /var/log/allmessages\n*.* SYSTEM\n\nThe first line is the original in the\
    \ file which was commented out. The second line is the one added to reroute all\
    \ messages to the system designated by host. The \"@\" character before the host\
    \ name indicates that the messages are rerouted to a remote system. SYSTEM can\
    \ be the IP Address or the DNS name of your i5/OS. If you use a DNS name then\
    \ you must also add the DNS name to the hosts file to prevent connection problems.\n\
    \n# IBM i5/OS system configuration\n\nOn IBM i5/OS, the only configuration required\
    \ is to create a program that acts as a remote syslog and receives incoming messages.\
    \ The first step is to determine how syslog sends messages to a remote system.\
    \ To do this, look through the /etc/services file and find an entry for syslog.\
    \ This entry looks like:\n\n```\nsyslog          514/udp\n```\n\nThis tells that\
    \ syslog uses port 514 and protocol User Datagram Protocol (UDP). If you want\
    \ to view the /etc/services file, we recommend you pipe the output to search because\
    \ the /etc/services file is large. Use the following command to limit the results\
    \ to only lines that contain \"syslog\":\n\n```\nlinux:~$ cat /etc/services |\
    \ grep\n```\n\nAfter you know how syslog sends messages, it is a fairly simple\
    \ step to take the socket server example from \"Sockets programming\" on page\
    \ 97 and modify it to receive syslog messages. Based on what the messages look\
    \ like, you can then refine the server code until you get the exact behavior you\
    \ desire.\n\n# IBM i5/OS syslog program\n\nThe syslog program differs from the\
    \ socket server because the syslog program is expected to run only on IBM i5/OS.\
    \ According to this, all statements are required to clarify the code. Also you\
    \ have to get additional data such as the current time and Transmission Control\
    \ Protocol/Internet Protocol (TCP/IP). Finally, you have to open a file to store\
    \ the incoming messages and send selected messages to QSYSOPR.\n\nThe program\
    \ program flow, as shown in Example B-2, is as follows:\n\n- Open the log file\
    \ where all messages are stored. If the file does not exist it is created. Otherwise\
    \ the file is opened in append mode. This ensures that you do not lose previous\
    \ messages that were logged. own- Open the socket descriptor.\n- Bind port 514\
    \ to the new socket descriptor. This is the port that syslog on Linux uses. If\
    \ linked on Linux then the IBM i5/OS server program also requires to be changed.\n\
    - Create a conversion table. All incoming data comes from Linux machines and therefore\
    \ is converted from American Standard Code for Information (ASCII) to Extended\
    \ Binary Coded Decimal Code (EBCDIC).- Start the main body of the program by looping\
    \ until stop. Inside the loop follow these steps:\n  a. Receive incoming requests\
    \ from the socket.\n  b. Convert the data to EBCDIC.\n  c. Remove the newline\
    \ character from the end of the message.\n  d. Get the system information and\
    \ add it to the front of the message.\n  e. Check if this message goes to QSYSOPR\
    \ and send it there if it must.\n  f. Get the current timestamp.\n  g. Write the\
    \ message to the log file.\n  h. Finally, flush the write buffer.\n- Before exiting\
    \ the program close the conversion table and socket descriptor.\n\n# Linux Integration\
    \ with IBM i5/OS\n\nTo create the syslogd program run the following commands in\
    \ this order:\n\n1. CRTCMOD (ITSOLIB/SYSLOGD) SRCSTMF('/ifs/src/syslog.c') SRCTYPE(*SRFS)\
    \ TGTAID(37)\n2. CRTPGM (ITSOLIB/SYSLOGD) BNDSRVPGM(QSYS/QICONV)\n\nThese commands\
    \ create a program called SYSLOGD in library ITSOLIB and they assume that the\
    \ source for the program is in file /ifs/src/syslog.c in Integrated File System\
    \ (IFS). You have to adjust the object names to fit your environment.\n\nThe next\
    \ step required before running the program is to create the IFS directory structure.\
    \ The program creates the file if it does not exist, but it cannot create the\
    \ full directory structure that is required. The directory is /var/log and you\
    \ can create it using the mkdir command on QSYSOPR. You also need to create a\
    \ message file with a message description that is used for the QSYSOPR messages.\
    \ In the program we deploy, the message file is ITSOLIB/LINUX or you can change\
    \ this to meet your requirements as long as the program is active. These are the\
    \ steps:\n\n1. MKDIR DIR(/var/log)\n2. CRMSGF (ITSOLIB/LINUX) TEXT(Message file\
    \ for SYSLOGD)\n3. ADDMMSG MSGID(LNX0001) MSGF(ITSOLIB/LINUX) MSG('&*1') SECLVL('&2')\
    \ FMT(*CHAR 80) (*BACK 5)\n\nAfter the program and message file are created, you\
    \ can submit the syslogd program to run in batch using the following command:\n\
    \n```\nSBJOB CMD (ALL SYSLOGD/SYSLOGD)\n```\n\nA batch job now runs and monitors\
    \ the 514 port for incoming messages. All incoming messages are logged to file\
    \ /var/log/messages and any message containing \"kernel\" are also sent to the\
    \ QSYSOPR message queue.\n\nExample B-2 Syslogd source code on IBM i/OS.\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n\
    \n#include <errno.h>\n#include <sys/types.h>\n#include <sys/socket.h>\n#include\
    \ <netinet/in.h>\n#include <netdb.h>\n\n#include <iconv.h>\n#include <QHMSNDM.H>\n\
    \n#define SERVER_PORT 514\n#define BACK_LOG 20\n#define BUFFER_SIZE 512\n\ntypedef\
    \ struct {\n char name[8];\\ char ccsid[5];\\ char conversion[3];\n};\n```\n"
