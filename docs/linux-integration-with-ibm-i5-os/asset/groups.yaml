    ## 前言


    IBM® System i 平台提供了许多集成点，支持利用 IBM i/OS 应用和数据的 Linux® 应用，例如用于 Linux 的 IBM eServer™
    iSeries™ Access、带有 Samba 的 IBM i/OS NetServer™ 以及 IBM Java™ Virtual Machine 和
    JTO。


    本 Redbook 涵盖了所有的通信技术并附有示例代码，为您展示了可以用于连接 Linux 应用与 IBM i/OS 的方法。


    本书旨在帮助具有 IBM i/OS 背景的 Linux 用户、程序员和管理员连接 Linux 与 IBM i/OS。


    ## 编写本 IBM Redbook 的团队


    本书由来自全球普普基斯基中心（Poughkeepsie Center）的国际技术支持组织的专家团队编写。


    ![](img/165c050f45ac58e1635258993855261a_10_0.png)


    Manik Ahuja 是 IBM 的 IT 架构师。他的工作是通过为每个需求选择软硬件组合来设计 IT 基础设施解决方案。Manik 拥有大多数操作系统的行业认可认证，并且精通硬件和软件技术。他于
    1995 年从计算机实验室助理开始职业，逐渐变为系统管理员，然后成为 IT 架构师。他是公认的开源专家，并为各种杂志编写技术文章。他的专业领域包括设计和实施电子邮件系统、高可用性集群、数据整合技术和可视化解决方案。


    ![](img/165c050f45ac58e1635258993855261a_10_1.png)


    Erwin Earley 是 IBM 的顾问软件工程师，分配在明尼苏达州罗彻斯特的系统技术中心。在 Linux 卓越中心的工作中，Erwin 负责为 IBM
    i 平台上的 Linux 人员提供技术赋能。Erwin 写了大量关于 System i 上 Linux 的文章，是 Linux 专业协会的认证专业人士，也是红帽认证技术员。可以通过
    erwin.earley@us.ibm.com 联系他。


    ![](img/165c050f45ac58e1635258993855261a_10_2.png)


    Franco Rico 是德国 IBM 的 i 技术专家。他在 iSeries Access、EIM / Kerberos、集成 IBM iSeries®
    系统 (IXA) 和逻辑分区 (LPAR) 方面拥有五年经验。他为 IBM 客户提供问题确定、配置和使用方面的帮助。他拥有曼海姆合作教育大学的信息技术工程学士学位。


    Vlatko Kosturjak 是位于克罗维亚 IBM 全球服务安全与隐私服务的 IT 专家。在实践中，Vlatko Kosturjak 专注于黑客攻击、IT
    审计、根据 ISO/IEC 17799 开发的安全策略制定、企业级连续性与恢复计划的设计、实施和验证的咨询服务，并协助客户开发和实施有效的安全解决方案以保护其信息资产。他在网络安全设计和各种操作系统的服务器加固方面拥有丰富经验。


    ![](img/165c050f45ac58e1635258993855261a_11_0.png)


    Rajeev Sharma 是 IBM 印度销售与分销部的 Linux IT 专家。他之前的工作包括 Novelle 班罗 Linux Impact 团队的技术客户经理，以及孟买
    NetCore Solutions 的系统工程师和业务开发。他是 SUSE Enterprise Server 和 SUSE Linux Open Exchange
    等咨询及解决方案设计实施领域的专家。


    Yessong Jong 是罗彻斯特中心国际技术支持组织的 IBM 认证专家。他于 1982 年作为 S/38 系统工程师开始 IBM 职业，并一直从事 S/38
    和 IBM AS/400 工作。


