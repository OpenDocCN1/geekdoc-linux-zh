    注意：此脚本旨在您向 i/OS 添加新用户并希望将其用户导入到 Linux 和 Samba 时运行。此脚本的作用与 "doall" 脚本完全相同，但它不会为这些新用户创建密码或
    Samba 账户。调用 "chguser" 脚本来设置 Linux 用户的密码并创建他们的 Samba 用户名/密码。我们建议您在即时添加用户过程中运行此脚本。首次使用
    "doall" 脚本进行导入时。


    ## 执行 chguser 脚本


    在使用先的 `dosingle` 脚本导入新用户后，您现在需要设置他们的密码。为了简单起见，我们假设所有 i/OS 用户在创建时使用的密码与其用户名相同，以便在将其导入
    Linux 时保持其完整性。随后，调用 `chguser` 脚本并传入两个参数：用户名和密码。该脚本会自动为 Linux 系统中的用户和 Samba 密码文件设置密码。对您在
    i/OS 中添加并使用 `dosingle` 脚本导入的所有用户重复此操作。


    您可以如下执行 `chguser` 脚本。在 Linux 命令行提示符上输入以下内容：


    ```

    # /usr/local/bin/chguser username password

    ```


    ## 详细逻辑流


    支持的用户配置文件在 i/OS 和 Linux 中都要安装若干数量的文件。正如您现在可能意识到的，整个过程相当复杂，您可能需要理解系统是如何运行的。接下来的章节详细解释了所有脚本的作用、功能及其之间的关系。如果您需要更改或调整场景以适应您的特定情况或需求，您可能需要理解这一流程。


    - dosingle: 脚本，用于从 i/OS 导入具有预设配置的新用户。此脚本导入 i/OS 中所有具有预设配置的用户，并在 Linux 服务器上创建相应的用户。它只创建
    Linux 系统用户。此脚本不会重置 Linux 和 Samba 服务器中已存在的 i/OS 用户的密码。需要使用 `chguser` 脚本为这些新用户设置
    Linux 密码并创建 Samba 密码。

    - chguser: 调时带有两个参数：用户名（username）和密码（password）的 Bash 脚本。每运行一次此脚本，它都会将 Linux 用户的密码设置为提供的值。它还会设置
    Samba 用户的密码。如果 Samba 用户不存在，则会创建 Samba 用户。此脚本旨在用于您之前已利用 "doall" 脚本导入了大部分 i/OS 用户的情况。这是您运行
    `ringle` 脚本后的后续操作。

    - chgiuser: Samba 服务器通过 `sm.conf` 文件中的 `passwd` 参数调用的 Bash 脚本。该文件的目的是查找并更改 i/OS
    和本地 Linux 系统用户的密码。Samba 负责更改 Samba 密码数据库的密码。该脚本在相关情况下也会 `chguser` 和 `smbchat`
    脚本调用。


