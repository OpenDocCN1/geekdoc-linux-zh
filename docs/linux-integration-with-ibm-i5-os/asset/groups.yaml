    # 5.3.3 Troubleshooting SMB connectivity to iSeries NetServer


    Following are common problems that can occur: (Called not present)


    +   session request to <sysname> failed (Called name not)


    This error occurs when the system name or IP address used to make the smbmount
    connection is different from the iSeries NetServer name. You can ignore it. The
    smbmount and smclient only require the IP address of the remote system or the
    ability to resolve the system name to an IP address.


    +   cannot mount on /mountpoint: Operation not permitted


    This error occurs because the user executing smbmount does not have authority
    to the mount point.


    +   Input/output error


    If you get input/output error while trying to perform a function with a mount
    point or when you try to unmount (smbmount) the mount point, this means that the
    SMB connection has been lost. This can be caused by forcing the end of the IBM
    i/OS QoS server or network issue, and so on. To get the Linux system to know the
    mount point has been lost, the root user requires to execute:


    ```

    linux:> ummount /mountpoint

    ```


    ```

    umount: /mountpoint: device is busy or in use

    ```


    A running process that you are unaware of using the file system you are trying
    to unmount. The first thing to check is whether your working directory is inside
    the smbfs file system. The Linux command pid shows your working directory. To
    find users of a file system, Linux provides the very helpful command, fuser: In
    Example 5-2 the working directory is inside the smbfs, therefore you must prevent
    the unmount with your own bash shell.


    > Example 5-2 user command

    linux:/mnt/smtest> umount /mnt/smtest/

    umount: /mnt/smtest: device is busy

    linux:/mnt/smtest> fuser -mauv /mnt/smtest


    USER PID ACCESS COMMAND

    /mnt/smtest root 25582 ..c.. bash

    linux:/mnt/smtest>


    If you have no control over the process which is still using the smbfs file then
    you could use the kill command to end the process by providing the process identification
    (PID) as argument. For an immediate end of the process use the parameter -9 between
    command and PID:


    ```

    linux:> kill 25582

    ```'
