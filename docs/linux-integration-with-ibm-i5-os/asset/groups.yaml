    # ODBC 连接字符串参数


    用于 Linux 的 iSeries Access 开放数据库接口 (ODBC) 驱动具有许多连接字符串关键字，您可以使用这些关键字配合 ODBC 来更改
    ODBC 连接的行为。在配置 ODBC 数据源时，也会存储这些相同的关键字及其对应值。当 ODBC 应用程序建立连接时，连接字符串中指定的任何关键字将覆盖
    ODBC 数据源中指定的值。


    下表列出了驱动程序识别的不同连接字符串关键字。当前参数列表可在此处查看：


    http://www.ibm.com/servers/iseries/linux/odbc/guide/odbcproperties.html


    表 C-1 中列出的通用属性在 ODBC 连接字符串中是始终要求的。


    | 关键字 | 描述 | 选项 | 默认值 |

    | --- | --- | --- | --- |

    | [DSN] | 指定连接要使用的 ODBC 数据源名称。 | 数据源名称 (DSN) | 无 |

    | DRIVER | 指定要使用的 ODBC 驱动程序名称。如果已指定 DSN 属性，则不要使用此项。 | "iSeries Access Driver"
    | 无 |

    | PWD 或 Password | 指定连接到 iSeries 服务器的密码。 | iSeries 密码 | 无 |

    | SYSTEM | 指定要连接的 iSeries 系统名称。 | iSeries 系统名称 | 无 |

    | UID 或 user identification | 指定连接到 iSeries 服务器的用户 ID。 | iSeries 用户 ID | 无 |


    服务器属性列在表 C-2 中。


    | 关键字 | 描述 | 默认值 |

    | --- | --- | --- |

    | CMT 或 CommitMode | 指定默认事务隔离级别。 | 0 = 立即提交 (*NONE)\n1 = 读取已提交 (CS)\n2 = 读取未提交
    (CHG)\n3 = 可重复读 (ALL)\n4 = 可串行化 (RR) | 2 |

    | CONNTYPE 或 ConnectionType | 指定该连接的数据库访问级别。 | 0 = 读/写 (允许所有结构化查询语言 (SQL) 语句)\n1
    = 读/调用 (允许 SELECT 和 CALL 语句)\n2 = 只读 (仅允许 SELECT 语句) | 0 |

    | DBQ 或 DefaultLibraries | 指定要添加到服务器作业库列表中的服务器作业库。"USRLIB" 可作为服务器作业当前库的占位符。该列表用于解析未限定的过程调用并在目录应用程序接口
    (API) 调用中查找库。如果未指定 "USRLIB"，则指定的库将替换服务器作业的当前库列表。<br>注意：此属性中的第一个库也将成为默认库，用于解析 SQL
    语句中的未限定名称。若要不指定默认库，应在库之前插入逗号。 | QGL |

    | NAM 或 Naming | 指定在引用名称时使用的命名规范。 | 0 = sql (在 schema.table 中)\n1 = system (在
    schema.table 中) | 0 |

