    \ from qiws.cusctcdt\" | isql iSeriesDB ITSOuter password -b -c > cust.csv\n```\n\
    \nNote: For testing more complex queries you can use a database which is created\
    \ on IBM i/OS ('dbsample'). This creates a collection with sample tables, which\
    \ come with DB2 for iSeries itself.\n\n## 3.2.2 cwbrunsql\n\niSeries Access for\
    \ Linux is shipped with a tool cwbrunsql that allows running SQL scripts in batch\
    \ mode. An interactive shell like iSQL is not available. You can use cwbrunsql\
    \ with an existing DSN, where iSeriesDB is the DSN and itsouser is the IBM i/OS\
    \ user profile:\n\n```\ncwbrunsql/DSN:iSeriesDB /USER:itsouser/PASSWORD:password/:batch.sql\n\
    ```\n\nOn the other hand, you can use cwbrunsql without a DSN but with the IBM\
    \ i/OS host name:\n\n```\ncwbrunsql/SYSTEM:iseries.com/USER:itsouser/PASSWORD:password/:batch.sql\n\
    ```\n\nSpecify the SQL batch file with the parameter /- We use the same batch\
    \ file as shown in Example 3-5. The result includes additional data such as execution\
    \ time and the IBM i/OS job shown in Example 3-6. Due to explicit error messages\
    \ the tool is also helpful for problem determination.\n\nExample 3-6: cwbrunsql\
    \ example iSeries Access for Linux\n```\n****************************************************************\n\
