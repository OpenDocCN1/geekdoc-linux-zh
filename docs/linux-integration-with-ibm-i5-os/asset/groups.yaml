    如果你不确定此配置，可以在 i5/OS 现有的 Kerberos 配置中进行验证。在 IBM i5/OS 上，Kerberos 服务被称为网络认证服务 (NAS)，设置位于与
    Linux 类似的文件中：


    ```

    /IBM/UserData/OS400/NetworkAuthentication/krb5.conf

    ```


