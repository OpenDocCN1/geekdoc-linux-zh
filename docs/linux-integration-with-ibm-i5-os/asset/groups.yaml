    \ &statement))\n    die(\"Alloc stmt\", 0);\n\n    /* Do query */\n    if ((sqle\
    \ = SQLExecDirect(statement, querystring, SQL_NTS))\n    die(\"exec direct\",\
    \ sqle);\n\n    /* Bind col fields */\n    if ((sqle = SQLBindCol(statement, 1,\
    \ SQL_CHAR, field1, 255, &ret1))\n    die(\"Bind field 1\", sqle);\n    if ((sqle\
    \ = SQLBindCol(statement, 2, SQL_CHAR, field2, 255, &ret2))\n    die(\"Bind field\
    \ 2\", sqle);\n\n    if ((sqle = SQLBindCol(statement, 3, SQL_CHAR, field3, 255,\
    \ &ret3))\n    die(\"Bind 3\", sqle);\n\n    /* While loop to fetch all records\
