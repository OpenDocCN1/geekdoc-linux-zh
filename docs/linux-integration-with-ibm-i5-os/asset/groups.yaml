    # Linux 与 IBM i5/OS 集成简介


    本章概述了 Linux 与 IBM i5/OS 之间的连接方法。本章将讨论以下领域：


    - 将 Linux 与 IBM i5/OS 集成的优势

    - Linux 与 IBM i5/OS 之间通信技术的概述


    # 1.1 将 Linux 与 IBM i5/OS 集成的优势


    IBM 致力于在 iSeries 平台上支持 Linux 操作系统。它支持将 Linux 安装到 iSeries 分区、集成 xSeries 服务器 (IXS)
    以及集成 xSeries 适配器 (IXA)，从而减少购买额外硬件的资本支出。这些配置在《IBM eSeries Server: An Implementation
    Guide》（SG24-6232）、《Implementing Linux on Integrated xSeries Solutions for iSeries》（SG24-6379）以及《Implementing
    Web Applications with CM Information Integrator for Content and OnDemand Web Enable
    Kit》（SG24-6338）中有详细介绍。


    IBM 通过开发多种方法进一步增强了对 Linux 的支持，这些方法可以集成运行在 Linux 和 IBM i5/OS 上的实际数据和应用程序。例如 iAccess
    for Linux 产品，它允许 Linux 用户通过 5250 会话或启用开放数据库连接（ODBC）的应用程序到 IBM i5/OS。


    连接 Linux 和 i5/OS 的能力结合了这两个操作系统的主要优势。例如，i5/OS 的数据库应用程序和 Linux 的 Web 特性提供了一个强大且集中的计算环境。


    传统上，客户一直将 iSeries 系统及其前身 AS/400 作为数据库机器，用于存储和检索与其业务相关的大量信息。IBM DB2 Universal Database
    for iSeries 完全集成到 i5/OS 操作系统中。客户可以从 iSeries 的单级安全、对象、文件和打印管理、可靠性和可扩展性中受益。与其他某些系统类型不同，随着客户业务的扩大，iSeries
    系统硬件可以升级，以满足对更大处理能力或存储空间的需求。


    Linux 被认为是一种电子商务系统。目前，很大比例的 Linux 业务实现是使用 Apache Web Server 和 Tomcat Web Server
    的 Web 服务器。Linux 操作系统为运行基于 PHP 超文本预处理器（PHP）和 Perl 的应用程序提供了一个极佳的环境。


    然而，以下实现类型也很流行：


    - 如 Sendmail 邮件网关之类的邮件服务器

    - 使用 Samba 的文件和打印服务

    - 防火墙


    鉴于 Linux 广受欢迎的社区和开源特性，可以快速且经济地开发出反映不断变化的电子商务领域的新型、且具有吸引力的应用程序。需要访问数据库的应用程序现在可以通过访问运行在
    iSeries 逻辑分区上的现有 DB2 Universal Database 来进行增强，从而缩短开发时间和成本。


    # 1.2 Linux 连接技术概述


    本节概述了您用于连接 Linux 操作系统与 i5/OS 的方法。这些技术和方法将在本书的后续章节中详细介绍，在某些情况下还会结合示例程序代码。


    # 1.2.1 iSeries Access for Linux


    iSeries Access for Linux 提供基于 Linux 的 i/OSset。它允许您从 Linux 系统建立到 i/OS 的 5250 会话。它还包含了用于访问
    iSeries DB2 Universal Database (UDB) 的 ODBC 驱动。


    iSeries Access for Linux 支持 Intel® 和 IBM 平台。它运行在独立 PC、IBM PowerPC®、IXA 和 IXS 以及
    IBM eServer 逻辑分区上。


    iSeries Access for Linux 产品在第5页的第2章“iSeries Access for Linux”中有进一步解释。


    以下网站提供了有关 iSeries Access for Linux 的最新信息：

    http://www.ibm.com/servers/eserver/iseries/access/linux/


    # 1.2.2 用于 Linux 的 iSeries Access ODBC 驱动


    iSeries Linux ODBC 驱动是 iSeries Access for Linux 的一部分。它允许从 Linux 系统访问 iSeries IBM
    DB2 UDB。该驱动程序基于随 iSeries Access for Windows 产品 5722XE1 提供的 ODBC 驱动，并类似地通过 socket
    连接使用主机服务器接口访问系统。


    ODBC 驱动在第29页的第3章“使用 ODBC 连接 IBM i/OS”中介绍。


    # 1.2.3 使用 JDBC 驱动连接 IBM i/OS


    IBM Toolbox for Java 产品 5722JC1 包含一个 Java 连接 (JDBC) 驱动，允许您使用 JDBC 编程接口 (API) 发出结构化查询语言
    (SQL) 语句并处理来自 iSeries 数据库的结果。Toolbox for Java 还包含一组 Java 类，提高了开发访问 IBM i/OS 数据程序的便利。


    JDBC 驱动在第51页的第4章“使用 JDBC 连接 IBM i/OS”中有进一步解释。


    以下网站提供了有关 JDBC 驱动的信息：

    http://www.ibm.com/servers/eserver/iseries/toolbox/


    # 1.2.4 使用 Samba 的 NetServer 支持


    OS/400 已增加了对 Samba 使用服务器消息块 (SMB) 协议的支持。此处支持允许运行 Samba 的 Linux 客户端通过 smclient
    和 smbmount 连接 iSeries NetServer。


    Samba 客户端在第67页的第5章“使用 Samba 连接 iSeries NetServer”中介绍。


    以下网站提供了有关 NetServer 的最新信息：

    http://www.ibm.com/servers/eserver/iseries/netserver/


    # 1.2.5 网络文件系统


    网络文件系统 (NFS) 允许用户通过网协议 (IP) 网络访问远程计算机上的文件。Linux 文件系统的性质使其能够存储在不同的位置。网络文件系统的目的是允许机器像访问本地驱动一样读写远程文件。这促进了跨网络的无缝共享。


    NFS 在第81页的第6章“使用 NFS 连接 IBM i/OS”中有进一步解释。


    # 1.2.6 文件传输协议


    文件传输协议 (FTP) 是传输控制协议/网协议 (TCP/IP) 的标准文件传输协议。可以使用 FTP 在 Linux 和 i5/OS 之间传输文本和二进制数据。


    FTP 在第89页的第7章“使用 FTP 连接 IBM i/OS”中进行了更详细的讨论。


    # 1.2.7 编程 socket 连接


    Socket 以及在 socket 之上的程序可以处理您要在 Linux 和 i5/OS 之间提供的任何集成。


    第95页的第8章“使用 socket 编程连接 IBM i/OS”提供了如何使用 socket 的示例，并让您了解如何将其用于您的目的。


    # 2


    # iSeries Access for Linux


    iSeries Access for Linux 是 iSeries Access 系列中的新产品。iSeries Access for Linux 允许您使用其开放数据库连接
    (ODBC) 驱动访问 iSeries DB2 Universal Database (UDB)，并从 Linux 客户端建立到 IBM i5/OS 系统的
    5250 会话。


    本章涵盖以下内容：


    - iSeries Access for Linux 概述

    - iSeries Access for Linux 要求

    - 安装步骤

    - 5250 配置


    ODBC 主题在第29页的第3章“使用 ODBC 连接 IBM i/OS”中进行了详细讨论。


