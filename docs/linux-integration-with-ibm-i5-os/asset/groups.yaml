    \ (EDRS) 驱动均包含在 32 位和 64 位包中。5250 模拟器包含在 32 位包中，但不包含在 64 位包中。\n\n## 许可证要求\n\n\
    iSeries Access 不是开源产品。使用 5250 模拟需要 IBM iSeries Family 5722XX 的许可证。使用 ODBC 驱动程序不需要许可证。iSeries\
    \ Access for Linux 的许可与 iSeries Access for Windows 相同。\n\n## 可用性\n\niSeries Access\
    \ for Linux 以下载包的形式提供访问访问页面获取最新版本：\nhttp://www.ibm.com/servers/eserver/iseries/access/\n\
    \n## 2.2 iSeries Access for Linux 要求\n\n本节列出了 iSeries Access for Linux 安装前的要求。请先检查\
    \ i/OS 要求：\n\n- 对于 5250 模拟，需要安装 IBM iSeries Access Family 5722XW1 并且你需要该产品的许可证。\n\
    - 启用 QUSER 用户配置文件。使用以下步骤验证配置文件状态。在 5250 命令输入屏幕上输入：\nDSPUSRPRF USRPRF (QUSER)\n\
    此命令显示 QUSER 的状态，必须为 *ENABLED*。如果状态为 *DISABLED*，输入：\nCHUSRPRF USRPRF (QUSER) STATUS\
    \ (*ENABLED)\n- 传输控制协议/网协议 (TCP/IP) 必须在你的 IBM i5/OS 上运行。\n- 在 IBM i5/OS 中启动主机服务器。要启动它们，请输入：\n\
    STRHOSTSVR *ALL\n\nLinux 客户端需要安装以下包：\n- glibc 2.2 或更高版本\n此包包含 GNU C 库。它包含了 C、数学和可移植操作系统接口\
    \ (POSIX) 最重要的标准库。使用以下命令检查已安装的版本：\n\n```\nlinux:~> rpm -qa | glibc\nglibc-2.4-31.2\n\
    glibc-64bit-2.4-31.2\n```\n\n- Red Hat Package Manager (RPM) 3.0 或更高版本\n\nRPM\
    \ 管理软件包。通过它你可以安装、删除和更新软件包。检查已安装的版本：\n\n```\nlinux:> rpm --version\nRPM version\
    \ 4.4.2\n```\n\n- openmfit 2.0 或更高版本\n\nOpenmfit 是一个运行时环境。5250 模拟器需要此软件。要检查是否已安装，输入：\n\
    \n```\nlinux:> rpm -qa | grep openmfit\n```\n\n如果系统返回了其包的行，则说明已安装。\n\n- unixODBC\
    \ 驱动管理器版本 2.0.11 或更高版本\n\n它在 Linux 平台上提供了应用程序与 ODBC 驱动之间的标准接口。要检查是否已安装，输入：\n\n\
    ```\nlinux:> rpm -qa | grep openmfit\n```\n\n要获取更多信息，请访问：http://www.unixodbc.org\n\
    \n"
