    ## 2.4 5250 emulator


    The iSeries Access for 5250 emulator is a client implementation. It is intended
    to be used on a Linux client.


    This version allows multiple Virtual Network Computing (VNC) and Linux Terminal
    Server Project (LTSP) users to easily use the 5250 emulator.


    This section covers:


    - Emulator language support

    - Emulator modules

    - Some functions


    The other major feature of iSeries Access for package is the ODBC driver, which
    is discussed further in Chapter 3, "Connect i5/OS with ODBC".


    ## 2.4.1 Emulator languages


    The main emulator labels and helper applications are translated in many languages
    and is displayed by the LANG environment variable. The command -LANGID can be
    used to override the default language. See Table 2-1.


