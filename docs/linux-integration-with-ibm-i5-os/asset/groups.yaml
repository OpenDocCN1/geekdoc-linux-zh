    ## 5.4 Connect to an iSeries NetServer printer share


    Linux has its own spooling support through lpr, jpd, cups, and so on. However,
    it may be beneficial for Linux to send files requiring printing to an IBM i/OS
    printer using IBM i/OS spooling and printer management capabilities as the printer.


    ### 5.4.1 How to configure a printer share


    The following example shows how to configure a printer share and enable users
    on a Linux system to share an IBM i/OS configured printer. We assume that a printer
    is already configured on IBM i/OS and you could use the printer''s OUTQ for you.


    > **Important:** Due to the limited printer driver support present on Linux your
    IBM i/OS printer must be able to print PCL or postscript data streams. If you
    intend to set up a printer share to configure as IBM ''iDPTS'', IBM Advanced Function
    Printing™ (IBM AFP*) YES then you have to use the IBM Infoprint® Server for iSeries
    75221P1 product to convert a PCL or Postscript data stream to AFP.


    For further information see the IBM Redbook titled IBM eServer iSeries Printing
    Vi: Delivering the Output of e-business, SG24-6250.


    In this example, we use a Novel Linux distribution to connect to iSeries NetServer
    printer share. If you are using a different Linux distribution, the steps and
    displays may be different.


    Initially select a suitable OUTQ on IBM i5/OS or create one using the CRTOUQ command.
    To set up a printer share on IBM i5/OS, you require the iSeries Navigator.


    ## Create a printer share with iSeries Navigator


    To share an i5/OS OUTQ, perform the following steps from the iSeries Navigator
    interface:


    - 1. Select Network -> Servers -> TCP/IP and iSeries NetServer.

    - 2. Expand iSeriesNetServer and right-clicked Shared Objects. Select New and
    then Printer.

    - 3. In the following screen illustrated in Figure 5-3 fill the Name and Output
    queue and library fields.


    ![](img/165c050f45ac58e1635258993855261a_89_0.png)


    Figure 5-3 iSeries NetServer Print Share screen


    - 4. Select OK.

    - 5. Select Shared Objects to check that this printer share opens in the list.


    ## Connect to a shared printer from Linux


    After an IBM i5/OS OUTQ has been shared, you can configure a Samba printer from
    the Linux client.


    - 1. On a Novell SUSE Linux start the configuration utility YaST. Select the Hardware
    section on the left panel and click the Printer icon on the right panel.

    - 2. YaST then initializes the printer configuration tool. When the printer setup
    window opens, select Add.

    - 3. At the Printer Type window select Network Printer.


    - 4. At the Connection for printer window, select Print via SMB Network Server
    and select Next. See Figure 5-4.


    ![](img/165c050f45ac58e1635258993855261a_90_0.png)


    Figure 5-4 Connection to a printer share with YaST


    - 5. The Samba/Windows printer screen opens. Enter the following information as
    shown in Figure 5-5 and select Next:

    - Host name: Enter the host name or IP address for the IBM i5/OS.

    - Remote query: Define the printer share name.

    - User: Enter a valid IBM i5/OS user profile

    - Password: Enter the password for this user.


    ![](img/165c050f45ac58e1635258993855261a_90_1.png)


    Figure 5-5 Samba/Windows printer configuration window in YaST


    - 6. On the Queue Name Window specify the printer name for Linux and check the
    option **Do Local Filtering**. See Figure 5-6.


    ![](img/165c050f45ac58e1635258993855261a_91_0.png)


    Figure 5-6 Specify the name of the NetServer


    - 7. From the Manufacturer and model of printer select the type of your IBM i/OS.
    See Figure 5-7. If your printer is not available in the list but supports PCL
    or Postscript select one of the generic printer types as **PCL5 Printer** or **Postscript
    Printer.**

    - 8. The value selected in Selected model determines the exact Standard Code for
    Architecture (ASCII) printer data stream into which a Linux file is converted
    and sent to i5OS output.


    ![](img/165c050f45ac58e1635258993855261a_91_1.png)


    Figure 5-7 Manufacturers and model of printer window


    From the iSeriesOS windows you must set your default settings as paper size or
    tray and also the hardware settings as duplex and orientation. Then click OK.


    ![](img/165c050f45ac58e1635258993855261a_92_0.png)


    Figure 5-8 General printer settings


    ## 5.4.2 Points to keep mind


    From the final window, select Finish. This updates the CUPS configuration. There
    are some limitations and restrictions that you require to consider when setting
    up Samba share for many Linux users.


    - During creation of SMB you have to specify an IBM i/OS user profile. This user
    is the owner of spool files on i5OS regardless of which Linux users use it. If
    you want to keep the owner of spool file in connection to Linux then you have
    to create one per Linux.

    - You can move spool files from one OUTQ to another, or you can start different
    printer against the initial OUTQ. However, doing this ensures that the physical
    printer supports the same language as the spool file was created. The attributes
    of file type cannot be changed after spool file is placed on IBM i/OS. For example,
    PCL data stream must print successfully on PCL5 compliant printer. However, it
    would print incorrectly if sent to printer supporting PPS data stream.

    - Some functions, such as drawer selection, finisher support may not work with
    the generic drivers. However, there are Linux drivers for various IBM printers.
    See the following site for details:


    http://www.printers.ibm.com


    ## Connect i5/OS with NFS


    This chapter discusses the usage of the Network File System (NFS) in connection
    with IBM i/OS. It gives examples about the configuration and how it may be used
    between IBM i/OS and Linux.


    This chapter discusses the following:


    - Set up IBM i/OS as NFS server

    - Mount an IBM i/OS Integrated File system (IFS) directory on a Linux system

    - Security considerations


    ## 6.1 Introduction into the Network File System


    The NFS is a file system which allows users to access files located on a remote
    computer via an Internet Protocol (IP) network.


    The nature and structure of the Linux file system lends itself to being stored
    in different places. NFS is developed to allow machines to read and write files
    on remote systems as if they were on a local hard drive. This facilitates the
    sharing of files across a network. Both Linux and IBM i/OS support NFS.


    The advantages of NFS include:


    - Exchanging data between IBM i/OS and Linux

    - Sharing the same files between multiple Linux clients and IBM i/OS


    If you have Linux partitions on your IBM eServer i5, then you can use NFS to share
    the data across multiple Linux servers, saving disk space.


    A comparison between NFS and NetServer is written in 5.1.1, "NetServer versus
    NFS" on page 68.


    ### 6.1.1 Running NFS server on i/OS versus Linux


    This section briefly compares the options of running NFS server either on i/OS
    side or on Linux side.


    > **Attention:** Whether you run NFS server on i/OS side or Linux side, be aware
    of the security considerations regarding NFS. Keep in mind that the security of
    the NFS protocol is bounded by the client IP address. The user profiles are identified
    by a user identification (UID) number which every Linux administrator can change
    at any time. No further password checks are performed.


    For further discussion of security matters regarding NFS, refer to 6.4, "Advanced
    NFS configuration and security" on page 85.


    ## Running NFS server on IBM i/OS


    IBM i/OS as an NetServer provides the complete advantages of using your object
    security, backup concepts, and availability to Linux systems.


    As the files are stored in the IFS of IBM i/OS you can use your existing methods
    and tools for managing resources and administering the data. You can easily include
    the files in your IBM i/OS backup without the requirement of additional backup
    devices on NFS client side.


    ## Running NFS server on Linux


    For a large amount of NFS traffic the Linux system can be the preferred choice
    to be NFS server. On Linux systems you have much more influence to runtime the
    parameter of the operating system and the NFS server. Experienced Linux administrator
    has the opportunity to change a lot of performance related settings and adjust
    the NFS server specially to their kind of workload. This causes more administration
    complexity, but may result in performance improvements.

