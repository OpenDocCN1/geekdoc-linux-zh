    ```\n\n用于轮换此文件的更改为：\n*.*- /var/log/allmessages\n*.* SYSTEM\n\n第一行是文件中的原始内容，已被注释掉。第二行是添加的行，用于将所有消息重定向到主机指定的系统。主机名前的\
    \ \"@”字符表示消息被重定向到远程系统。SYSTEM 可以是 IP 地址或你 i5/OS 的 DNS 名称。如果你使用 DNS 名称，则必须将 DNS\
    \ 名称添加到 hosts 文件以防止连接问题。\n\n# IBM i5/OS 系统配置\n\n在 IBM i5/OS 上，唯一的配置是创建一个作为远程 syslog\
    \ 并接收传入消息的程序。第一步是确定 syslog 如何向远程系统发送消息。要做到这一点，查看 /etc/services 文件中的 syslog 条目如下：\n\
    \n```\nsyslog          514/udp\n```\n\n这告诉 syslog 使用 514 端口和用户数据协议 (UDP)。如果你想查看\
    \ /etc/services 文件，建议通过输出管道搜索，因为 /etc/services 文件很大。使用以下命令限制结果为包含 \"syslog\" 的行：\n\
    \n```\nlinux~$ cat /etc/services | grep\n```\n\n知道 syslog 如何发送消息后，简单的步骤是取第 97\
