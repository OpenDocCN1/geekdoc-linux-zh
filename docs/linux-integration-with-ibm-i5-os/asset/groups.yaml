    To use Kerberos, replace the iSeries user name with "kerberos" as Example 2-6
    shows. Any


    Example 2-6 rmtcmd with Kerberos


    ```

    linux:~ /opt/ibm/iSeriesAccess/bin/rmcmd CRTLIB SSOTEST

    system:iSeries.ito.ibm.com /user*:kerberos

    ```


    ## 2.5.2 Login with Kerberos


    After the configuration is completed you must be able to successfully authenticate
    to the domain using the kinit command. As we are using Windows Active Directory,
    your login name is Windows user.


    ```

    linux:~ kinit windowouser

