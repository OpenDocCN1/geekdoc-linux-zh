    | |

    | DSP 或 DateSeparator | 指定 SQL 语句中日期字面量中的日期分隔符。除非 DateFormat 设置为 0 ("*JUL")、1
    ("*MDY")、2 ("*DMY") 或 3 ("*YMD")，否则此属性无效。 | 0 = "/" (斜杠)\n1 = "-" (连字符)\n2 = "."
    (点号)\n3 = "," (逗号)\n4 = "" (空格) | 1 |

    | DEC 或 Decimal | 指定 SQL 语句中数字字面量使用的数字分隔符。 | 0 = "." (点号)\n1 = "," (逗号) | 0 |

    | TFT 或 TimeFormat | 指定 SQL 语句中时间字面量使用的时间格式。 | 0 = hh:mm (*HMS)\n1 = hh:mm AM/PM
