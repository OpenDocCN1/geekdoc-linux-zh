  mdcn: "\n\n# 配置脚本\n\n在 doel 脚本中有三个值（变量）需要进行修改，以匹配 idapconf 配置文件中设置的 idap 配置值。\n\n\
    - 修改 $dn 值以反映之前为支持扩展用户配置文件 (os400-profile) 建立的 i5/OS 配置文件 (linuxsys1)，以及 idap\
    \ 用户来源的 i5/OS 系统 (os400-sys)。使用我们书中的示例以及示例的 idapconf，请更改 doel 脚本中的 $dn 值以反映以下内容：\n\
    \  > $dn = 'os400-profile=linuxsys1,cn=accounts,os400-sys=rchas61.rhland.ibmcom';\n\
    \n- 此外，修改 $b 值以反映 idap 用户来源的系统名称 (os400-sys)。使用示例的 idapconf，请更改 $b 脚本（此处应为$ 值）以反映以下内容：\n\
    \  > $b = 'os400-sys=rchas61.rhland.ibmcom';\n\n- 最后，修改 $h 值以反映 idap 用户来源的系统主机名。确保该名称可以通过域名系统\
    \ (DNS) 或 Linux 上的 /etc/hosts 文件进行解析。使用示例 $h 值将反映以下内容：\n  > $h = 'rchas61'\n\n\
    # 执行 doel 脚本\n\n你必须在完成 i5/OS 设置步骤后执行 doel 脚本。只需输入以下命令即可执行：\n# perl /usr/src/linuxusers/doall`\n\
    \n> 注意：此脚本旨在用于从 i5/OS 导入用户时首次运行。在导入期间，它会将这些用户的用户名和密码设置为默认值。默认密码与 Linux 服务器和 Samba\
    \ 服务器上的用户名相同。\n\n# 安装 chgi5user, chguser, smchat 和 smgbpass 脚本\n\n将 Windows PC\
    \ 上 `bin` 文件夹中的其余脚本安装到 Linux 的 `/usr/local/bin` 目录中。执行以下命令来完成相同操作：\n\n1. 在 Windows\
    \ PC 上，将目录切换到解压后的 scripts.zip 文件层级中的 bin 目录。\n2. 在位于脚本的 Windows PC 上，启动到 Linux\
    \ 系统的 ftp 会话：\n  > ftp linux-system\n3. 登录 ftp 后，切换目录到 /usr/local/bin 目录：\n  >\
    \ cd /usr/local/bin\n4. 在 ftp 会话中更改传输类型以正确传输二进制文件：\n  > bin\n5. 在 ftp 会话中传输以下脚本：\n\
    \  > put chgi5pass\n  > put chguser\n  > put smchat\n  > put smbpass\n6. 退出 ftp\
    \ 会话：\n  > quit\n\n# 详细逻辑流\n\n支持投影用户配置文件需要在 i/OS 和 Linux 中安装多个文件。如你现在所意识到的，整个过程相当复杂，你可能需要真正理解系统的工作原理。本节详细解释了所有脚本的作用、功能以及它们之间的关系。在你根据特定情况或需求更改或调整场景时可能可能理解此流程。\n\
    \n- ldap.conf\nLinux 客户端使用 OpenLDAP 配置文件。\n\n- doall\nPerl 脚本，从 i/OS 导入带有投影配置文件的用户，并在\
    \ Linux Samba 服务器中创建相应的用户。它会创建 Linux 系统用户和 Samba 用户。旨在用于从 i/OS 导入用户时首次运行。它会将 Linux\
    \ 和 Samba 用户的用户名和密码重置为默认值。密码的默认值与用户名相同。\n\n- smmpass\nBash 脚本，由 doall 调用，并初始化添加到\
    \ Samba 的新用户的密码。默认密码与用户的用户名相同。这是创建并设置所有用户 Samba 密码的脚本。它由 doall 自动调用，不需要你单独运行。\n\
    \n- smbchat\n主密码同步脚本。通过 smb.conf 文件中的 `passwwdm` 参数调用。\n\n- chg5user\nBash 脚本，由\
    \ Samba 服务器通过 smb.conf 文件中的 `passwd` 参数调用。该文件的目的是查找并更改 i/OS 和本地 Linux 系统中用户的密码。Samba\
    \ 负责更改 Samba 数据库内部的密码。此脚本脚本也会被 chguser 和 smbchat 调用。\n\n# 向域添加新用户\n\n本节提供了向域中添加新用户的信息，该域是在第\
    \ 108 页的“初始环境设置”中设置的。\n\n# 前提检查点\n\n我们假设你已经安装并配置了场景包。你可以通过在 i/OS 终端上执行以下命令来检查这一点：\n\
    \n- 在 i/OS 侧：\nDSPBJ0D OBJ(QSYS/LINUXUSERS) TYPE(*LIB)\n\n- 在 Linux 侧：\n检查 /etc/openldap/ldap.conf\
    \ 文件的存在性和正确性。\n检查 /etc/samba/smb.conf 文件的存在性和正确性。\n\n检查 /usr/local/bin 目录下的以下文件的存在性和正确性：\n\
    \n- chgi5user\n- chguser\n- smbchat\n- smbpass\n\n检查 /usr/src/linuxusers 目录下的以下文件的存在性和正确性：\n\
    \n- doall\n\n# 在 Linux 上设置\n\n支持投影用户配置文件需要在 i/OS 和 Linux 中安装多个文件。如你现在所意识到的，整个过程相当复杂，你可能需要真正理解系统的工作原理。本节详细解释了所有脚本的作用、功能以及它们之间的关系。在你根据特定情况或需求更改或调整场景时可能需要理解此流程。\n\
    \n*(注：原文后续存在大量重复的段落，已按要求处理，未进行重复输出)*\n\n"
