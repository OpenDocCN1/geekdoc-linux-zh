    \n图 2-2 5250 会话\n\n# setup5250\n\nsetup5250 是一个设置程序，可以使用它配置适用于当前用户 ID 的 5250 会话的设置，并定义多个连接。\n\
    \n- 1. 在 GUI 终端中，输入 `setup5250`：\n  linux:\\> setup5250\n  setup5250: [ INFORMATIONAL\
    \ ]: Build Date: 2005年7月13日 (1.10)\n  setup5250: [ INFORMATIONAL ]: setup5250\n\
    \n主菜单如图 2-3 所示。\n\n![](img/165c050f45ac58e1635258993855261a_28_1.png)\n\n图 2-3\
    \ setup5250\n\n第 2 章 Linux 下的 iSeries  15\n\n菜单栏有 Connection（连接）、Preferences（首选项）、Options（选项）和\
    \ Help（帮助）四个列表。\n\n- Connection（连接）\n使用此选项创建、编辑、浏览、复制和删除仿真器连接配置。还可以使用此选项连接到任何现有连接配置。\n\
    \n- Preferences（首选项）\n此菜单允许您开启或关闭仿真器选项。首选项设置适用于所有 5250 会话。\n\n- Options（选项）\n\
    您可以定义密码以防止他人使用 setup5250 工具。\n\n- Help（帮助）\n使用此菜单获取设置程序的详细说明。\n\n2. 创建新会话\n从 Connection\
    \ 菜单栏选择 **New**（新建）。如图 2-4 所示，提供连接描述以及 iSeries 的名称或 IP 地址。\n\n![](img/165c050f45ac58e1635258993855261a_29_0.png)\n\
    \n图 2-4 5250 仿真器连接\n\n随后，在同一面板上，如果您想定义其他选项，点击 **Advanced 5250 Connection** 按钮，如图\
    \ 2-5 所示：\n\n- Session title（会话标题）：显示为会话标题的文本值。\n- Display name（显示名称）：此文本值决定 IBM\
    \ i5/OS 中的 5250 显示设备名称。\n- Window size（窗口大小）：指定 5250 窗口的初始大小和位置。\n- Full screen（全屏）：勾选此框，5250\
    \ 窗口将使用整个屏幕。\n- Width（宽度）：该值决定窗口的像素水平宽度。\n- Height（高度）：该值决定窗口的像素垂直高度。\n- Horizontal,\
    \ vertical, and corner offset（水平、垂直和角偏移）：移动窗口在屏幕上的位置。\n- Bypass sign（跳过登录）：此选项允许您跳过\
    \ IBM i5/OS 登录屏幕。\n- Use Kerberos principal name, no prompting（使用 Kerberos主体名称，无提示）：启用\
    \ Kerberos 身份验证。\n\n- Emulator User ID（仿真器用户 ID）：此值用于跳过登录的 IBM/OS 配置文件。\n- Emulator\
