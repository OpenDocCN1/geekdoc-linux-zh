  - '[PAGE 65]


    # 4.1 Introduction to JDBC


    The JDBC application programming interface (API) was designed to make coding common
    Structured Query Language (SQL) statements in Java simple and easy. At the same
    time, more complex SQL statements are possible. The typical steps to use the JDBC
    API are:


    +   1. Load the JDBC driver.

    2. Create the JDBC connection.

    3. Create and execute your SQL statements.

    4. Close the JDBC connection.


    The JDBC API is part of the standard Java Development Kit (JDK™). Version 1.0
    of JDBC runs on JDK 1.1 and later. Version 2.0 of JDBC runs on JDK 1.2 and later.


    # 4.2 Preparing to use JDBC


    As you can see in 4.1, "Introduction to JDBC" on page 52, the first step is to
    load the JDBC driver. This leads to the question of which driver to use and where
    to get it. For DB2 Universal Database (UDB) for iSeries there are two different
    JDBC drivers that can be used. They are commonly known as the native driver and
    the toolbox driver. The native driver is shipped as part of licensed Java Development
    Kit 5722JC1. A simple comparison of the two drivers is that the native driver
    is fast but runs only on IBM OS virtual machine (JVM™), while the toolbox driver
    runs on any JVM. A good discussion about these drivers can be found at:


    ```

    http://www-03.ibm.com/servers/eserver/iseries/toolbox/faqjdbcbc.html

    ```


    We used the driver in the examples in this book.


    # 4.2.1 Downloading the Java Toolbox


    You can install the IBM Toolbox for Java on IBM i5/OS after 5722JC1. The installed
    jar files are found in the Integrated File System (IFS) in directory /IBM/ProdData/HTTP/jt400/lib.
    The toolbox is also an open source project and the source code is available under
    the IBM Public license. Further information about the toolbox, a downloadable
    version and the documentation can be found at:


    ```

    http://www.ibm.com/servers/eserver/iseries/toolbox/

    ```


    To use the toolbox you require download the appropriate jar file to your client
    and update the CLASSSPATH to include the jar files. For JDBC application here,
    only the jt400.jar file is required.


    > Note: The toolbox is packaged in a ZIP file named jtopen_x.zip, where x is the
    version. The zip archive contains different files. In this example the zip is
    unpacked in the same directory as the java program. The jt400.jar is located in
    the following path:


    ```

    ./jt40/lib/jt400.jar

    ```


    The Java class for the program must include the jt400.jar. Therefore, you must
    add the path to the CLASSSPATH.


    ```

    linux:~ export CLASSSPATH=$CLASSSPATH:./jtopen/lib/jt400.jar:

    ```'
- md: "\n## 4.2.2 Creating the sample database\n\nAll the examples in this chapter\
    \ use a sample database. The creation of the sample database is done using the\
    \ stored procedure CREATE_SQL_SAMPLE(\"library\"), where library is the name of\
    \ the sample library you wish to create. This stored procedure is new in version\
    \ 5 release 1 and shipped with the operating system. To create the sample database\
    \ perform the following steps:\n\n- 1. STRSQL\n  Get into interactive SQL\n- 2.\
    \ CALL QSYS/CREATE_SQL_SAMPLE(\"DBSAMPLE\")\nTo create the library (or collection\
    \ in SQL terminology) with the sample tables\n\nCreating the sample database takes\
    \ a couple of minutes to complete. After it is finished you have 13 tables and\
    \ numerous logical views. Sample data is also included in the tables. There are\
    \ two sets of database tables in the sample schema. One includes ORG, STAFF and\
    \ SALES. This set is a very simple schema with limited interaction between the\
    \ tables and less complex data types within the tables. The remaining tables make\
    \ up a more complicated database schema and make use of more complex data types,\
    \ such as BLOBs and CLOBs. These tables also interact with each other more.\n\n\
    ## 4.3 Command line JDBC application\n\nGet started with JDBC programming on Linux,\
    \ you can start with a command line approach where all input is from standard\
    \ input and all the output is sent to standard out. This is a great way to test\
    \ your JDBC and SQL code without the worries of the graphical interfaces. The\
    \ sample command line JDBC application selects the records of the ORG table to\
    \ get the list of departments. It then takes the department number and runs a\
    \ prepared SQL statement to get the members of each department, their position,\
    \ and the number of years with the company. This information is sent to standard\
    \ out for each department, producing a department type listing.\n\nUse javac to\
    \ create the Java program, which is a program source that is shown in Example\
    \ 4-1 on page 54:\n\n```\nlinux:~ javac SimpleJDBC.java\n```\n\nThis executes\
    \ the Java code. To run the program, run the java command:\n\n```\nlinux:~ java\
    \ SimpleJDBC\n```\n\nYou may have to add the current directory to your CLSPATH\
    \ to get the Java program to. To do this use the following command:\n\n```\nlinux:~\
    \ export CLSPATH=$CLSPATH:./jopen/lib/jt400.jar.\n```\n\nOr use the classpath\
    \ parameter to include jtopen and the program search for the path:\n\n```\nlinux:~\
    \ java -classpath ./jopen/lib/jt400.jar:: SimpleJDBC\n```\n\nThis adds the current\
    \ directory (identified by the ':') to the end of the current path. The output\
    \ of this Java program is sent to standard out. If you want to send the data to\
    \ a file, you can redirect standard out to a file using the following:\n\n```\n\
    linux:~ java SimpleJDBC > jdbc.output\n```\n\n### 4.3.1 More about the program\n\
    \nWhen making the JDBC connection, we have imbedded the user profile and password\
    \ that are going to be used during the connection. If a user profile and password\
    \ are not provided then a prompt emerges asking for profile and password.\n\n\
    > Note: If a user and password are not configured, the Toolbox generates a graphical\
    \ user interface (GUI) dialog box prompted for them. This means you require an\
    \ X-Window environment to get this prompt. If you are working on the text mode\
    \ server, you will see some font error messages on the command prompt, but the\
    \ log works without problems.\n\nThe program flow is to execute a query to identify\
    \ all the departments from the ORG table. For each resulting department a prepared\
    \ statement query is run to get all the members of the department from the STAFF\
    \ table. The SQL statements can be simple as shown in Example 4-1, which shows\
    \ the JDBC code using the ORG, STAFF, and SALES tables.\n\n- Example 4-1 Simple\
    \ JDBC source code Simple.JDBC.java\n\n```\nimport java.sql.*;\n\npublic class\
    \ SimpleJDBC {\n    // format a string to a set length\n    private static String\
    \ format(String s, int width) {\n        String formattedString;\n\n        if\
    \ (s.length() < width) {\n            StringBuilder buffer = new StringBuilder();\n\
    \            for (int i = s.length(); i < width; ++i) {\n                buffer.append(\"\
    \ \");\n            }\n            formattedString = buffer.toString();\n    \
    \    } else {\n            formattedString = s.substring(0, width);\n        }\n\
    \        return formattedString;\n    }\n\n    public static void main(String[]\
    \ args) {\n        Connection connection = null;\n\n        try {\n          \
    \  // load the Toolbox JDBC driver\n            Class.forName(\"com.ibm.as400.access.AS400JDBCDriver\"\
    );\n\n            // get the connection to the iSeries database\n            //\
    \ if no user or password is given a prompt will appear\n            String system\
    \ = \"iseriesname\";\n            String url = \"jdbc:as400://\"\" + system;\n\
    \            String user = \"Username\";\n            String password = \"Password\"\
    ;\n            connection = DriverManager.getConnection(url, user, password);\n\
    ```\n\n```\nDatabaseMetaData meta = connection.getMetaData();\n```\n\n```\n//\
    \ create and execute a simple SQL select statement\nStatement orgSelect = connection.createStatement();\n\
    ResultSet orgResults = orgSelect.executeQuery(\"SELECT * FROM DBSAMPLE\");\n```\n\
    \n```\nPreparedStatement deptSelect = connection.prepareStatement(\n\"SELECT NAME,\
    \ YEARS, JOB FROM DBSAMPLE\"\n+ meta.getCatalogSeparator())\n+ null;\n+ \"WHERE\
    \ DEPT = ?\");\n```\n\n```\nResultSet deptResults = null;\nint deptNum = 0;\n\
    ```\n\n```\n// output info from each record\nwhile (orgResults.next()) {\ndeptNum\
    \ = orgResults.getInt(\"DEPT\");\n```\n\n```\ndeptResults = deptSelect.executeQuery();\n\
    ```\n\n```\nwhile (deptResults.next()) {\n    System.out.println(format(deptResults.getString(\"\
    NAME\"), 15)\n    + \" | \" + deptResults.getString(\"DIVISION\")\n    + \" |\
    \ \" + deptResults.getString(\"JOB\")\n    + \" | \" + deptResults.getInt(\"YEARS\"\
    ));\n}\n```\n\n```\ncatch (SQLException e) {\n    e.printStackTrace();\n} finally\
    \ {\n    if (connection != null) {\n        connection.close();\n    }\n}\n```\n\
    \n### 4.3.2 Sample output\n\nExample 4-2 is a sample of the output generated by\
    \ the simple JDBC.\n\nNAME | DIVISION | JOB | YEARS\n---------------------------------------\n\
    JOHN DOE | SALES | MANAGER | 5\nJANE SMITH | SALES | CLERK | 2\nBOB JOHNSON |\
    \ IT | DEV | 10\nALICE WHITE | HR | REP | 3\n"
  mdcn: "\n\n## 4.2.2 创建示例数据库\n\n本章中的所有示例都使用示例数据库。示例数据库的创建是通过存储过程 `CREATE_SQL_SAMPLE(\"\
    library\")` 完成的，其中 library 是你是你想要创建的示例库名称。该存储过程是版本 5 Release 1 中引入的，并随操作系统发布。要创建示例数据库，请执行以下步骤：\n\
    \n- 1. STRSQL\n  进入交互式 SQL 界面\n- 2. CALL QSYS/CREATE_SQL_SAMPLE(\"DBSAMPLE\")\n\
    \  创建包含示例表的库（SQL 术语中的集合）\n\n创建示例数据库需要几分钟时间。完成后，你将拥有 13 张表和许多逻辑视图。表中还包含示例数据。示例模式中包含两组数据库表。一组包含\
    \ `ORG`、`STAFF` 和 `SALES`。这是一组非常简单的模式，表之间的交互有限，表内的数据类型也不复杂。其余表组成了一个更复杂的数据库模式，并使用了更复杂的数据类型，例如\
    \ BLOB 和 CLOB。这些表之间的交互也更加频繁。\n\n## 4.3 命令行 JDBC 应用程序\n\n要在 Linux 上开始 JDBC 编程，你可以从命令行方法开始，所有输入都来自标准输入（stdin），所有输出都发送到标准输出（stdout）。这是测试\
    \ JDBC 和 SQL 代码的极佳方法，无需担心图形界面。示例命令行 JDBC 应用程序选择了 `ORG` 表的记录以获取部门列表。然后它获取部门编号并运行预编译\
    \ SQL 语句，以获取每个部门的成员、职位以及在公司的年限。这些信息会每个部门发送到标准输出，生成部门类型列表。\n\n使用 `javac` 创建 Java\
    \ 程序，程序源代码见第 54 页的示例 4-1：\n\n```\nlinux:~ javac SimpleJDBC.java\n```\n\n这会执行 Java\
    \ 代码。要运行程序，请运行 `java` 命令：\n\n```\nlinux:~ java SimpleJDBC\n```\n\n你可能需要将当前目录添加到\
    \ `CLSPATH` 中才能找到 Java 程序。要做到这一点，请使用以下命令：\n\n```\nlinux:~ export CLSPATH=$CLSPATH:./jopen/lib/jt400.jar.\n\
    ```\n\n或者使用 `classpath` 参数来包含 jtopen 并让程序搜索路径：\n\n```\nlinux:~ java -classpath\
    \ ./jopen/lib/jt400.jar:: SimpleJDBC\n```\n\n这会将当前目录（通过 `:` 标识）添加到当前路径的最后。此 Java\
    \ 程序的输出将发送到标准输出。如果你想将数据发送到文件，可以使用以下命令将标准输出重定向到文件：\n\n```\nlinux:~ java SimpleJDBC\
    \ > jdbc.output\n```\n\n### 4.3.1 关于程序的更多\n\n在建立 JDBC 连接时，我们嵌入了连接期间将使用的用户配置和密码。如果未提供配置和密码，则会弹出提示要求输入配置和密码。\n\
    \n> 注意：如果未配置用户和密码，Toolbox 会生成一个图形用户界面 (GUI) 对话框进行提示。这意味着你需要 X-Window 环境才能看到此提示。如果你在文本模式服务器上工作，你将在命令行提示符上看到一些字体错误消息，但日志可以正常工作。\n\
    \n程序流是执行一个查询以识别 `ORG` 表中的所有部门。对于每个结果部门，运行一个预编译语句查询以从 `STAFF` 表获取该部门的所有成员。SQL 语句可以如示例\
    \ 4-1 所示简单，该示例展示了使用 `ORG`、`STAFF` 和 `SALES` 表的 JDBC 代码。\n\n- 示例 4-1 简单的 JDBC 源码\
    \ Simple.JDBC.java\n\n```\nimport java.sql.*;\n\npublic class SimpleJDBC {\n \
    \   // 将字符串格式化为固定长度\n    private static String format(String s, int width) {\n\
    \        String formattedString;\n\n        if (s.length() < width) {\n      \
    \      StringBuilder buffer = new StringBuilder();\n            for (int i = s.length();\
    \ i < width; ++i) {\n                buffer.append(\" \");\n            }\n  \
    \          formattedString = buffer.toString();\n        } else {\n          \
    \  formattedString = s.substring(0, width);\n        }\n        return formattedString;\n\
    \    }\n\n    public static void main(String[] args) {\n        Connection connection\
    \ = null;\n\n        try {\n            // 加载 Toolbox JDBC 驱动\n            Class.forName(\"\
    com.ibm.as400.access.AS400JDBCDriver\");\n\n            // 获取到 iSeries 数据库的连接\n\
    \            // 如果未提供用户或密码，将出现提示\n            String system = \"iseriesname\"\
    ;\n            String url = \"jdbc:as400://\"\" + system;\n            String\
    \ user = \"Username\";\n            String password = \"Password\";\n        \
    \    connection = DriverManager.getConnection(url, user, password);\n```\n\n```\n\
    DatabaseMetaData meta = connection.getMetaData();\n```\n\n```\n// 创建并执行一个简单的 SQL\
    \ 选择语句语句\nStatement orgSelect = connection.createStatement();\nResultSet orgResults\
    \ = orgSelect.executeQuery(\"SELECT * FROM DBSAMPLE\");\n```\n\n```\nPreparedStatement\
    \ deptSelect = connection.prepareStatement(\n\"SELECT NAME, YEARS, JOB FROM DBSAMPLE\"\
