    其他 FTP 命令是 `cd` 和 `lcd`，它们分别更改远程和本地系统的目录位置。`prompt` 命令与 `mget` 或 `mput` 配合使用非常有用。


    ### 7.1.2 管理 FTP


    配置 i/OS 使用命令 `CHGPTBL *`。启动和停止 FTP 使用 `ENDTCPSVR *`。


