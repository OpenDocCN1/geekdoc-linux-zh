    # Product architecture


    The product is available in a 32-bit version as an Intel and a POWER implementation.

    Latest version supports supports additional 64-bit platforms (PowerPC-64 and x86-64).
    The ODBC and Extended Dynamic Remote Support (EDRS) drivers are included in both
    the 32-bit and 64-bit packages. The 5250 emulator is included with the 32-bit
    packages but not included with the 64-bit packages.


    # License requirements


    iSeries Access is not an Open Source product. You require a license of IBM iSeries
    Family 5722XX for 5250 emulation. License is not required for using the ODBC driver.
    Licensing for iSeries Access for Linux is the same as iSeries Access for Windows.


    # Availability


    iSeries Access for Linux is available as a downloadable package. Visit the following
    page for the latest version:

    http://www.ibm.com/servers/eserver/iseries/access/


    # 2.2 iSeries Access for Linux requirements


    This section lists the requirements for iSeries Access for Linux even before its
    installation. Check the i/OS requirements first:


    +   - For 5250 emulation, IBM iSeries Access Family 5722XW requires to be installed
    and you require a license of the Product.

    - Enable the QUSER user profile. Use the following procedure to verify the user
    profile status. On 5250 command entry screen, type:

    DSPUSRPRF USRPRF (QUSER)

    This command shows the status of QUSER, which must be *ENABLED. If the status
    is *DISABLED, type:

    CHUSRPRF USRPRF (QUSER) STATUS (*ENABLED)

    - Transmission Control Protocol/Internet Protocol (TCP/IP) must be up and running
    on your IBM i5/OS.

    - Start the hosts servers in IBM i5/OS. To start them type:

    STRHOSTSVR *ALL


    On Linux client, require the following packages installed:

    - glibc 2.2 or later

    This package contains the GNU C Library. It contains the most important standards
    libraries for C, math, and Portable Operating System Interface (POSIX). Use the
    following command to check your installed version:


    ```

    linux:~> rpm -qa | glibc

    gibc-2.4-31.2

    gibc-64bit-2.4-31.2

    ```'
  - '[PAGE 21]


    +   Red Hat Package Manager (RPM) 3.0 or later


    RPM manages the software packages. With it you can install, remove, and update
    software packages. Check the installed version:


    ```

    linux:> rpm --version

    RPM version 4.4.2

    ```


    +   openmfit 2.0 or later


    Openmfit is a runtime environment. This software is necessary for 5250 emulator.
    To check if it is installed, type:


    ```

    linux:> rpm -qa | grep openmfit

    ```


    If the system returns you lines of its package, it is installed.


    +   unixODBC driver manager Version 2.0.11 or later


    This provides a standard interface between applications and ODBC driver on the
    Linux platforms. To check if it is installed, type:


    ```

    linux:> rpm -qa | grep unixODBC

    ```


    To get more information or download the latest version of unixODBC driver manager,
    go to:

    http://www.unixodbc.org


    > Note: At the time of writing this we noticed some problems with using dynamic
    linked libraries on RHEL 3 and RHEL 4 for iSeries and IBM pSeries.... The source
    of the packages are 64-bit versions of Openmfit and unixODBC, which are installed
    as default.


    You have replace the installed packages of Openmfit and unixODBC with the 32-bit
    versions.


    ```

    linux:> rpm -e openmfit

    linux:> rpm -e unixODBC

    linux:> update2 -l openmfit --arch=ppc

    linux:> update2 -l unixODBC --arch=ppc

    ```


    For your information, 64-bit versions come with --arch=pp64.


    The ibm5250 works with the default installed fonts of SU or Red Hat Linux but
    in some cases you require more font sizes to fit the 5250 to your display size.
    In order to display 5250 emulation screens properly, ibm5250 requires fixed, mono-spaced
    75dpi and 100dpi fonts.


    > Note: To check current install for 75dpi and 100dpi, type:


    ```

    linux:> rpm -qa | grep dpi

    xorg-x11-fonts-75dpi-6.9.0-50.14

    xorg-x11-fonts-100dpi-6.9.0-50.14

    ```


    Some Linux distributions do not install the 100dpi fonts by default, but they
    provide it as optional package.


    Scalable fonts fill most of the screen but are considered by some to be fuzzy
    or not as sharp as fixed fonts. The emulator automatically detects and uses scalable
    fonts if they are available.'
