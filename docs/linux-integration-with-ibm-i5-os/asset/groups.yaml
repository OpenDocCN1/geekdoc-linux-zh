    ## 5.3.2 Linux Samba client configuration


    There are many methods to access to a NetServer share, on graphical user interface
    (GUI) and also on the console. The GUI methods are very similar to Windows operating
    system, we discuss two methods of accessing SMB resources from a Linux console:


    - smbmount

    - smbclient


    The smbmount command is the equivalent of mapping a drive in Windows, but instead
    of drive letters with Windows, directories are mounted on a directory. These directories
    are called mount points. Any directory you have authorization to, can be mounted.


    Executing the smbmount command starts an smb daemon process that manages the mount
    point. While the smb daemon runs, the mount point is active.


    In order to mount arbitrary file systems, you must either be signed in as the
    root user or smbclient commands allow non-root user execution. For further information,
    see the pages of mount, smbclient, and fstab. The type of file system mounted
    by smbclient is called cifs.


    The smbclient command is an interface similar to the File Transfer Protocol (FTP)
    that you can use to access remote shares. It is generally used when a user requires
    a short connection to a remote share or wants to see a list of the available shares.


    ### Using smbmount to mount a network drive


    Because you have created a new folder and shared it with iSeries Navigator, you
    are now ready to mount iSeries NetServer. First you require a local mount point
    on the Linux system. Most distributions have a directory named /mnt. Therefore,
    a good place to create a mount point would be within /mnt/:


    1. Execute:

    ```bash

    linux~$ mkdir /mnt/smbtest

    ```

    It is not a requirement for the directory name to match the share name on iSeriesOS.


    2. Now, if you are signed in as root, you can mount the remote share:

    ```bash

    linux~$ smbmount //iseries.ibm.com/mnt/smbtest -o username=itsouser

    ```

    The username parameter must be specified to specify the iSeriesOS user. You are
    now prompted for a password. You may now treat the mounted directory as though
    it were a local file system.


    3. To test, execute:

    ```bash

    linux~$ ls /mnt/smbtest

    ```


    ### smbmount command details


    The first argument of the smbmount command is the remote share which is an IP
    address or resolvable to an IP address via Domain Name System (DNS), /etc/samba/hosts.
    The second argument is the local mount point. The -o switch indicates optional
    parameters and settings to set to the mount daemon. In this case, the only option
    you specify is the iSeriesOS user profile you would like to sign in with. For
    additional smbmount options use man smbmount.


    The ummount command is the equivalent to unmapping a network drive in Windows.
    It unmounts a remote share from the local file system. The only parameter for
    this command is the mount point. Using the example given previously, the command
    is:

    ```bash

    linux~$ umount /mnt/smbtest

    ```

    This command fails if the actual connection no longer exists. In this case, the
    root user has to execute the more general umount command.


    ### Using smbclient to copy a file between iSeries NetServer and Linux


    As mentioned earlier, smbclient is an FTP-like client that you can use to copy
    files to and from an SMB share on a remote system.


    1. Verify what shares are available on the remote system:

    ```bash

    linux~$ smbclient -U username -L //systemname

    ```

    provides you with a list of shares from the remote SMB server as shown in Example
    5-1.


    Example 5-1 smbclient lists available share

    ```bash

    linux~$ smbclient -U itsouser -L //iseries.ibm.com

    ```


    | Sharename | Type | Comment |

    | :--- | :--- | :--- |

    | QIBM | Disk | IBM Product Directories |

    | ADMIN | IPC | AS400 Resource |

    | QDIRSRV | Disk | OS/400 Directory Services |

    | IPCS | IPC | AS400 Resource |


    | Server | Comment |

    | :--- | :--- |

    | Workgroup | Master |


    2. Establish an smbclient connection to the iSeries NetServer:

    ```bash

    linux~$ smbclient //iseries/sharename -U username

    ```

    You are prompted for a password. You are then presented with the smb prompt: `smb:
    `


    3. Type help.

    You are presented with the list of available commands. Notice that they are similar
    to FTP.


    4. Try to get a file list of the share you have connected to.


    5. Use get or put to copy a file from or to the NetServer.


    6. To copy any directory, you must turn on directory recursion and disable prompting,
    which would otherwise prompt for every file you want to copy. The commands recurse
    and prompt are toggle switches. The first usage of recurse turns the function
    on and the second turns it off. The command prompt acts vice versa.


    To enable recurse and disable prompting, execute:

    ```bash

    smb> recurse

    smb> prompt

    ```

    You may now use the mget and put commands to copy directories to and from the
    iSeries NetServer share.


    ### 5.3.3 Troubleshooting SMB connectivity to iSeries NetServer


    Following are common problems that can occur:


    - session request to <sysname> failed

    This error occurs when the system name or IP address used to make the smbmount
    connection is different from the iSeries NetServer name. You can ignore it. The
    smbmount and smclient only require the IP address of the remote system or the
    ability to resolve the system name to an IP address.


    - cannot mount on /mountpoint: Operation not permitted

    This error occurs because you do not have permission to mount on the mountpoint.


    - Input/output error

    If you get an input/output error while trying to unmount the mount point, it means
    the connection is lost. To find out which process is still using the mount point,
    use the Linux fuser command:

    ```bash

    linux~$ fuser /mnt/smbtest

    ```

    umount: /mnt/smbtest: device busy


    - Overwriting files on the share fails with input/output error, even if permissions
    are set correctly. Copying the file with cp:

    cp: cannot create regular file /mnt/smbtest/test.txt: Input/output error


    If the file does not exist on the share then cp or mv command works. Linux with
    Kernel 2.4x does not show this behavior. As a circumstance, you can use the smclient
    utility or delete the file on the share prior to copying the new one.

    '
