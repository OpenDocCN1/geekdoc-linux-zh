    ## 2.3 Installing iSeries Access for Linux


    The following procedure guides you to install iSeries Access for Linux:


    - 1. Download the iSeries Access for Linux RPM package from:

    http://www.ibm.com/servers/eserver/iseries/access/linux


    - 2. There is an option to use 32-bit with 5250 emulator and 64-bit with no 5250
    emulator RPM to install the iSeries Access for Linux. We are using 32-bit IBM
    PowerPC® with 5250 emulator RPM, on Linux terminal type for platform:

    linux:\> rpm -ivh iSeriesAccess-5.4.0-X.YY.pc.rpm

    For Intel platform:

    linux:\> rpm -ivh iSeriesAccess-5.4.0-X.YY.i386.rpm

    in these instances, the X.YY indicates the version of the iSeries Access as shown
    in Example 2-2.


    Example 2-2 Installing the iSeries Access for Linux RPM


    ```

    linux:\> rpm -ivh iSeriesAccess-5.4.0-1.0.pc.rpm

    ###################################### [100%]

    Preparing...

    1:iSeriesAccess

    ###################################### [100%]

    post installing process for iSeriesAccess 1.0...1

    iSeries Access OODBC Driver has been deleted (if it existed at all) because its
    usage became zero

    dobcdriver: Installed. Usage increased to 1.

    Target directory is /etc/unixODBClinux:">

    ```


    Make a note of the following points:


    - The files are installed in /opt/ibm/iseriesAccess directory.

    - For logging, run the rpm with -vv parameter at the end of the command, such
    as:

    linux:\> rpm -ivh iSeriesAccess-5.4.0-X.YY.pc.rpm -vv

    - To update a former version of iSeries Access for Linux, run the rpm command
    with the -Uvh option, such as:

    linux:\> rpm -Uvh iSeriesAccess-5.4.0-X.YY.i386.rpm

    - To uninstall, run the rpm command with the -ev option, such as:

    linux:\> rpm -ev iSeriesAccess


    If you used the outdated iSeries ODBC driver for Linux, then you have to remove
    the package with the following command:


    ```

    linux:> rpm -ev iSeriesODBC

    ```


    If the installation fails because of a dependency on libodbc.so or by another
    library, make sure that you have installed unixODBC driver manager. If the problem
    persists run the installation with the -nodes parameter to stop the dependency
    checking:


    ```

    linux:> rpm -ivh iSeriesAccess-5.4.0-X.yy.rpm --nodes

    ```


    - 3. Test the installation with the cwbping command as shown in Example 2-3. This
    command pings to the IBM i5/OS server, in which case it is pointed by the IP address
    of 192.168.1.1. Successful returns of ping verifies the communication link between
    two systems is established.


    Example 2-3 cwbping command


    ```

    linux:> /opt/ibmSeriesAccess/bin/cwbping 192.168.1.1

    ```


