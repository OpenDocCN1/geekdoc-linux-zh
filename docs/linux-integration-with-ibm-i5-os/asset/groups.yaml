    Dallas\"\n93845, \"Johnson\" \"Helen\"\n839283, \"Jones\" \"Clay\"\n192837, \"\
    Lee\" \"Hector\"\n389572, \"Stevens\" \"Denver\"\n693829, \"Thomas\" \"Casper\"\
