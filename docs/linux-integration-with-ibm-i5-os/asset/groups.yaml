  mdcn: "\n\n## 6.2 在 IBM i/OS 上设置 NFS 服务器\n\n本节将介绍如何使用 iSeries Navigator 在 IBM i/OS\
    \ 端配置和管理 NFS 服务器。执行以下步骤：\n\n- 1. 在 IFS 中创建一个目录来存放 Linux 文件，例如：\n  `MKDIR DIR('/nfshome')`\n\
    - 2. 在 iSeries Navigator 上选择文件系统（File System）→ 集成文件系统（Integrated File System）→\
    \ 根目录（Root）。\n  选择所需的存放 NFS 目录。右键点击，选择 NFS 导出（NFS Export），然后选择属性（Properties），如图\
    \ 6-1 所示。\n\n![](img/165c050f45ac58e1635258993855261a_96_0.png)\n\n图 6-1 使用 iSeries\
    \ Navigator 创建 NFS 导出\n\n- 3. 检查详情是否正确（默认用户为 QNFSANON），然后如图 6-2 所示选择导出（Export）。\n\
    \n![](img/165c050f45ac58e1635258993855261a_96_1.png)\n\n图 6-2 使用 iSeries Navigator\
    \ 配置 NFS 导出 /nfshome\n\n注意：如果选择“添加到永久定义的导出列表”（Add to list of permanently defined\
    \ exports），条目将被添加到 IFS /etc/EXPORTS 文件。\n\n- 4. 现在启动 NFS 服务器。选择网络（Network）-> 服务器（Servers）->\
    \ TCP/IP。右键点击 NFS 并选择全部（All），如图 6-3 所示。\n\n![](img/165c050f45ac58e1635258993855261a_97_0.png)\n\
    \n图 6-3 启动 NFS 服务器\n\n现在，IBM i/OS 上的 NFS 已就绪。\n\n## 6.3 挂载 IBM i/OS NFS 导出\n\n\
    使用 mount 命令对可用的 NFS 导出进行临时连接。如果你希望在 Linux 启动期间建立 NFS 连接，请修改 /etc/fstab 文件以在 Linux\
    \ 启动时挂载文件系统。执行以下步骤：\n\n- 1. 以 root 用户身份登录 Linux 系统。\n- 2. 创建一个目录作为挂载点，例如 /mnt/iseries：\n\
    \  `linux:> mkdir /mnt/iseries`\n- 3. 使用以下远程文件系统挂载系统语法 `systemname:exportname\
    \ /localmountpoint` 将导出挂载到目录：\n  `linux:> mount iseries.ito.ibm.com/nfshare /mnt/iseries`\n\
    - 4. 不带参数的 mount 命令将显示所有挂载的文件系统，如示例 6-1 所示。\n\n示例 6-1 所有挂载的文件系统\n\n```\n/mount\n\
    /dev/sda3 on reiserfs (rw,acl,user_xattr)\nproc on /proc type proc (rw)\nsysfs\
    \ on /sys/sys type sysfs (rw)\ntmpfs on /dev/shm type tmpfs (rw)\ndevpts on /dev/pts\
    \ type devpts (rw,mode=0620,gid=5)\niseries.ito.ibm.com/nfshare /mnt/iseries type\
    \ nfs (rw,addr=10.1.1.1)\n```\n\n84 Linux 与 IBM i/OS 的集成\n\n- 5. 现在你可以在 NFS 目录之间进行文件复制：\n\
    \  `echo \"Test file for NFS\" > /mnt/iseries/test.txt`\n- 6. 在 iSeries 的 5250\
    \ 会话或 iSeries Navigator 中验证该文件：\n  `DSPF STMF'('/nfshome/test.txt')`\n- 7. 使用以下命令从\
    \ Linux 系统中移除 NFS 连接：\n  `mount /mnt/iseries`\n- 8. 如果你想在启动时挂载 NFS 导出，则必须编辑 /etc/fstab\
    \ 文件。该文件包含关于各种文件系统的信息，例如哪些系统在启动时被挂载。小心编辑，损坏的 fstab 文件会导致你的 Linux 无法启动。参见示例 6-2。按照正确的顺序添加关于\
    \ NFS 导出的以下信息：\n\n  - a. 文件类型：systemname:export\n  - b. 本地点：/mountdirectory\n\
    \  - c. 文件类型：nfs\n  - d. 挂载选项，即读/写权限：rw\n  - e. 必须是备份的文件系统（仅用于备份）：0\n  - f. fsck\
    \ 检查文件系统的顺序：0 不检查\n\n```\n示例 6-2 NFS 导出\nlinux:~> /etc/fstab\n/dev/sda3 reiserfs\
    \ acl,user_xattr 1 1\n/dev/sda2 swap swap pri=42 0 0\n/devpts /dev/pts devpts\
    \ mode=0620,gid=5 0 0\n/proc proc defaults 0 0\nsysfs /sys sysfs noauto 0 0\n\
    iseries.ito.ibm.com:/nfshome /mnt/iseries rw 0 0\n```\n\n## 6.4 高级 NFS 配置与安全\n\
    \n前述描述的配置仅提供了简单的 NFS 配置。它不包含任何安全选项。每个人都可以在自己的电脑上挂载文件系统，因为没有配置相关的限制。此外，文件访问是由 IBM\
    \ i/OS 上的一个用户执行的：QNFS。在这种情况下，无法实现对象级安全。IBM i/OS 不区分哪些用户访问了 NFS 导出。但有不同的选项可以扩展安全级别。\n\
    \n### 6.4.1 通过主机 IP 地址限制访问\n\n第一要务是限制访问……（此处省略部分重复的引导性文字，保持逻辑一致）\n\n- 1. 在 iSeries\
    \ Navigator 中打开 Network -> Servers -> TCP/IP。\n- 2. 右键点击 NFS 服务器并选择 Exports。\n\
    - 3. 选择导出的目录……\n\n![](img/165c050f45ac58e1635258993855261a_99_0.png)\n\n图 6-4\
    \ - 通过主机限制\n\n图 6-5 通过 IP 地址限制访问\n\n![](img/165c050f45ac58e1635258993855261a_99_1.png)\n\
    \n### 6.4.2 应用对象级安全\n\n对象级安全意味着 UID 与 i/OS 相同。UID 与 i/OS 相同非常重要。在示例中创建了一个名为 linuxuser\
    \ 的 Linux 用户，其 UID 为 1001。使用以下命令验证 UID：\n\n```\nlinuxuser:~> id\nuid=1001(linuxuser)\
    \ gid=100(users),14(dialout)\n```\n\n使用示例 6-3 所示的命令显示 UID：\n\n| 用户配置文件 - 基本 :\
    \ ISERIESUSR |\n| 对象审计值 . . . . . . : *NONE |\n| 动作审计值 . . . . . : *NONE |\n|\
    \ 用户 ID 编号 . . . . . . . . : 1001 |\n| 组 ID 编号 . . . . . . . . : *NONE |\n\n示例\
    \ 6-3 显示当前 UID\n\n"
