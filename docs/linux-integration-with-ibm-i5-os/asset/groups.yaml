    ## 2.5 Kerberos 的前提条件和配置


    以下步骤提供了一个在 Linux 工作站上设置 Kerberos 的示例。我们假设 Kerberos 和 EIM 已在带有 iSeries Access for
    Windows 的 Windows 环境中配置并正常运行。因此，我们使用 Windows Active Directory 服务器作为 Kerberos 服务器。


    iSeries for Linux 需要 Kerberos 版本 5。你可以使用 Heimdal 或 MIT 的 Kerberos 实现。几乎每个 Linux
    发行版都包含了至少一种实现性的安装包。


    Linux 还支持使用可插拔认证模块 (PAM) `pam_krb` 将 Kerberos 作为初始登录方法。在这种情况下，Kerberos 用于 Linux
    本地密码文件的 Linux 用户认证。对于我们的示例，我们不需要将 Linux 认证更改为 Kerberos，但它可以作为你环境中的另一种备用 Kerberos
    登录方法。如果你计划使用 `pam_krb5`，请参考你发行版中关于设置的文档。


    在 Linux 系统上安装 Kerberos5 及其实用工具后，你必须至少拥有以下 Kerberos 命令：


    - kinit

    - klist

    - kpasswd


    你必须拥有 Kerberos5 配置文件，即 `/etc/krb5.conf`。


    `krb5.conf` 包含了基础 kerberos5 配置，并要求根据你的环境进行自定义。需要以下关于你的 Active Directory 的信息：


    - Kerberos 术语中的 Windows 登录域：默认 realm (default realm)

