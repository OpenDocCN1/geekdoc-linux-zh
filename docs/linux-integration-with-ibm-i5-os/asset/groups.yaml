    \ i/OS、Linux 和 Samba 服务器并利用资源。\n\n# 预期场景\n\n以下描述了预期场景：\n\n- 所有用户必须有一个单一的用户名/密码来访问所有三个服务器。\n\
    - 用户创建/修改和常规维护的单一点。\n- 单次密码更改必须同步到所有三个系统。\n\n图-1 帮助你理解本章涉及的整体场景。\n\n| i5/OS 服务器\
