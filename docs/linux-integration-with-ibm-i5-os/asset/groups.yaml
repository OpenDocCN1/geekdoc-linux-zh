  - "[PAGE 128]\n\n# Configuring the script\n\nThere are three values (variables)\
    \ in the doel script that you have to change to match the configured idap values\
    \ as set in the idapconf profile.\n\n+   - Change the $dn value to reflect the\
    \ i5/OS profile (linuxsys1) that was established earlier in support of extended\
    \ user profiles (os400-profile) and the i5/OS system that the idap users are being\
    \ pulled from (os400-sys). Using the example we use in this book, and the example\
    \ idapconf, change the $dn value in the doel script to reflect the following:\n\
    \  > $dn = 'os400-profile=linuxsys1,cn=accounts,os400-sys=rchas61.rhland.ibmcom';\n\
    - Additionally, change the $b value to reflect the system name that the idap users\
    \ are being pulled from (os400-sys). Using the example idap conf, change the $b\
    \ value to reflect the following:\n  > $b = 'os400-sys=rchas61.rhland.ibmcom';\n\
    - Lastly, change the $h value to reflect the host name of the system that idap\
    \ users are being pulled from. Ensure that the name can be resolved either through\
    \ Domain Name System (DNS) or through the /etc/hosts file on Linux. Using the\
    \ example $h value would reflect the following:\n  > $h = 'rchas61'\n\n# Executing\
    \ the doel script\n\nYou must execute the doel script after the i5/OS setup steps\
    \ have been completed. It can be executed simply by entering the following command:\n\
    # perl /usr/src/linuxusers/doall\n\n> Note: This script is intended to run the\
    \ first time when importing users from i5/OS. During the import, this sets the\
    \ usernames and passwords for such users to the default values. The default passwords\
    \ are the same as the usernames on both the Linux and also the Samba servers.\n\
