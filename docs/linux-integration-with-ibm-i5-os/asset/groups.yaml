    From the Printer windows you must set your default settings as paper size or tray
    and also the hardware settings such as duplex and orientation. Then click OK.


    ![](img/165c050f45ac58e1635258993855261a_92_0.png)


    Figure 5-8 General printer settings


    # 5.4.2 Points to keep in mind


    From the final window, select Finish. This updates the CUPS configuration.


    There are some limitations and restrictions that you require to consider when
    setting up a Samba printer share for many Linux users.


    +   - During creation of an SMB printer you have to specify an IBM i5/OS user
    profile. This user is the owner of the spool files on i5OS regardless of which
    Linux users use it. If you want to keep the owner of the spool file in connection
    to a Linux user then you have to create one printer per Linux.

    - You can move spool files from one OUTQ to another, or you can start a different
    printer against the initial OUTQ. However, doing this ensures that the physical
    printer supports the same file type languages as the printer the spool file was
    created for. The attributes of a file type *USERASCI* cannot be changed after
    the spool file is placed on an IBM i5/OS OUTQ. For example, a *USERASCI* PLF built
    with the HP PCL5 data stream must print successfully on a PCL5 compliant printer.
    However, it would print incorrectly if sent to a printer supporting the IBM PPS
    data stream.

    - Some functions, such as correct drawer selection, staple or finisher support
    may not work with the generic drivers. However, there are Linux printer drivers
    for various IBM printers. See the following Web site for more details:


    http://www.printers.ibm.com'
