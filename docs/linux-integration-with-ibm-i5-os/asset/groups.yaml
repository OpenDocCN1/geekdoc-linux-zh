    \n图 A-42 验证\n\n# Windows XP Professional：更改密码\n\n在 Windows XP Professional 系统上更改密码的操作与\
    \ Windows 2000 Professional 的文档相同。请参阅第 135 页的“Windows 2000 Professional：更改域密码”。\n\
    \n# Linux 系统消息日志\n\n本附录描述了一种在 Linux 上使用 syslog 以及在 IBM i5/OS 上使用 syslogd 服务器程序记录\
    \ Linux 系统消息的机制。\n\n所有 Linux 系统消息都记录在一个文件中，被选中的消息将作为消息发送到 QSYSOPR。这允许你从 IBM i5/OS\
    \ 分区有效监控多个 Linux 系统。\n\n无论 Linux 安装在独立式 PC、逻辑分区 (LPAR) 还是 IXS/IXA 上，每个 Linux 系统都可以发送消息。本附录中的主题包括：\n\
    \n- syslogd 简介\n- Linux 配置\n- IBM i5/OS 配置\n\n# syslog 简介\n\nSyslog 是一个负责记录 UNIX\
    \ 和 Linux 系统消息的 Linux 守护进程。syslog 守护进程的处理由 /etc/syslog.conf 文件控制，你可以使用以下 Linux\
    \ 命令找到有关此配置文件的详细信息：\n\n```\nlinux:-> man syslog.conf\n```\n\n帮助页（man page）的重要部分是关于远程日志的章节。syslog\
    \ 程序内置了将系统消息发送到远程系统并进行记录的能力。在远程系统中，你将获得如下时间戳、源起始系统和原始消息：\n\n注意：SLESI10 还带有一个 syslog-ng，它是用于\
    \ Unix 和类 Unix 系统的“新一代”syslog（替代品）。它试图填补原始 syslog 的缺陷。syslog 守护进程的处理由 /etc/syslog-ng/syslog-ng.conf\
    \ 文件控制，可以使用以下 Linux 命令找到有关此配置文件的详细信息：\n\n```\nlinux:-> man syslog-ng.conf\n```\n\
    \n我们在本书中使用的是 syslog 守护进程。\n\n# Syslog 系统配置\n\nsyslog 的配置由你 Linux 服务器上的 /etc/syslog.conf\
    \ 文件控制。帮助页中对此配置提供了广泛的帮助。该文件的配置允许管理员将某些消息（来自特定应用程序、特定严重程度的消息等）记录到文件中，或将这些消息重定向到运行\
    \ syslog 任务的另一个系统。通常，远程系统是另一个 Linux 系统，但通过 i5/OS syslog 程序，这些消息可以轻松地重定向到 IBM i5/OS。\n\
    \n示例-1 从一个示例 Linux 系统复制的 /etc/syslog.conf 文件。\n\n示例：B-1 文件 /etc/syslog.conf\n\n\
    ```\n# /etc/syslog.conf - syslog(0) 的配置文件\n#\n# 有关此文件格式的信息，请参见 \"man syslog.conf\"\
    。\n#\n#\n#\n*.emerg *\n\n# 启用此项，如果你希望让 root 立即\n# 通知，例如登录登录\n# *.alert root\n\n\
    #\n# 所有邮件消息都保在一个文件中\n#\n#mail.* -var/log/mail\n```\n\n```\n#\n# 所有新闻消息\n# 这些文件由\
    \ \"news.daily\" 轮换和检查\n#news.crit-*/var/log/news/news.crit\n#news.err-*/var/log/news/news.err\n\
    news.notice-*/var/log/news/news.notice\n# 启用此项，如果你想将所有新闻消息\n# 保在一个文件中\n#news.*-\
    \ /var/log/news/news.all\n```\n\n```\n#\n# 警告在一个文件中\n#*.warn;*.*=err-/var/log/warn\n\
