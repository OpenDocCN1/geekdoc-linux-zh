    # Connect IBM i5/OS with ODBC


    The iSeries Access Open Database Connectivity (ODBC) Driver for Linux allows you
    to access the DB2 Universal Database (UDB) for iSeries from any Linux application
    written to the ODBC application programming interfaces (APIs). It is an ODBC 3.5
    American National Standards Institute (ANSI) driver with the ability to store
    and process Unicode data. Similar to the iSeries Access for Windows ODBC Driver,
    it uses a Transmission Control Protocol/Internet Protocol (TCP/IP) socket connection
    to the database server to access data on the IBM i5/OS.


    The ODBC driver is included in iSeries Access for Linux package. For information
    about the installation of the product, refer to 2.3, "Installing iSeries Access
    for Linux" on page 10.


    Some examples of using this driver for Linux applications accessing data stored
    in IBM i5/OS side include:


    - OpenODBC applications integrating DB2 UDB for iSeries database

    - DataManagerII is a graphical user interface (GUI) application to view and manage
    data sources.

    - Command line applications such as iSQL for interactive Structured Query Language
    (SQL) requests

    - cwbrunsq1 for running batch SQL scripts

    - PHP Hypertext Preprocessor (PHP) applications serving various Web pages

    - Simple ODBC application written in C or Perl


    ## 3.1 ODBC configuration


    The installation of ODBC driver as a part of iSeries for Linux is discussed in
    Chapter 2, "iSeries Access for Linux" on page 5. Do not use the outdated iSeries
    ODBC driver for Red Hat Package Manager (RPM). The superseding version of the
    driver is included in iSeries Access for Linux.


    There are two options for configuring the iSeries Access ODBC Driver, using a
    graphical tool such as ODBCConfig or editing the odbc.ini file. The GUI tool ODBCConfig
    is modeled closely on Microsoft ODBC administrator and is the best choice for
    those who work with ODBC in a Microsoft environment.


    You must also choose the type of data source DNS. DSNs can be either a user DSN
    or a system DSN. User DSNs are stored in ~/odbc.ini in the home directory of the
    user who created the DSN, for example, /home/itsouser/odbc.ini. they can only
    be accessed by the user who created them. System DSNs may only be configured by
    root and are stored in the file at /etc/unixODBC/odbc.ini and are accessible by
    all users of the system. The location differs on several Linux distributions.
    Use the following command to get information about unixODBC configuration files
    on your system:


    ```

    linux:> dbinst -j

    unixODBC 2.2.11

    DRIVERS:... /etc/unixODBC/odbc.ini

    SYSTEM DATA SOURCES: /etc/unixODBC/odbc.ini

    USER DATA SOURCES:... /root/odbc.ini

    ```


    ### 3.1.1 ODBCConfig: GUI method of ODBC configuration


    A data source can be configured using the ODBC data source GUI. This GUI contains
    fields to set required and frequently used options. The following instructions
    describe how to create or configure an iSeries Access ODBC Driver - DSN.


    > Note: ODBCConfig, or different name your Linux distribution might use, is required
    if you want to use it, you may require to install it. In Novel SUSE distributions
    the ODBCConfig tool is included in unixODBC-gui-qt. Red Hat has ODBCConfig in
    unixODBC-kde. Your distribution may have a different package name or similar tools
    like goODBC.


    Perform the following steps:


    1. On a graphical session, open the Data Source Administrator with the command
    ODBCConfig in the Linux terminal or use start menu → Run Command:

    linux:> ODBCConfig

    2. Decide what type of data source you want to use.

    User DSN are only accessible by the user who created them. System DSN are accessible
    by any user on the machine.

    The System DSN is configured by root user.


    In the example used, click User DSN to create a new User DSN as illustrated in
    Figure 3-1.


    ![](img/165c050f45ac58e1635258993855261a_44_0.png)


    Figure 3-1 ODBC Data Source Administrator


    3. In Figure 3-1, click Add to create a new data source or click Configure if
    you want to configure a data source that already exists.

    4. Select an ODBC driver. Click iSeries Access ODBC Driver and click the OK button
    as illustrated in Figure 3-2.


    ![](img/165c050f45ac58e1635258993855261a_44_1.png)


    Figure 3-2 Add DSN


    5. Configure your DSN properties. All the default values work fine.

    Fill in the data source name in the Name field and your system name in the System
    field. All other fields are optional.


    For test purposes you can change the Default library to QIWS. QIWS provides the
    file QCUSTCDT.


    A DSN example is shown in Figure 3-3.


    ![](img/165c050f45ac58e1635258993855261a_45_0.png)


    Figure 3-3 ODBC config


    6. Then, the Data Source Administrator shows the new user DSN as illustrated in
    Figure 3-4. Click the OK Button to to the window.


    ![](img/165c050f45ac58e1635258993855261a_45_1.png)


    Figure 3-4 Data Source Administrator: new DSN


    ## 3.1.2 Editing odbc.ini: Text mode of ODBC configuration


    Some of the driver options are not available via ODBCConfig. If you want to use
    them, you must edit the odbc.ini file. The following example describes how to
    add options to the system.


    > Note: It is easy to make a mistake of keying in the same entry twice. For example,
    Trace=0, and elsewhere in the same file. Having multiple entries in the same file
    can lead to unpredictable behaviors.


    Perform the following steps:


    1. Use the dbinst -j command to locate your odbc.ini file. Using your text editor
    of choice, edit the file with the contents as shown in Example 3-1.


    Example 3-1 Editing o.ini


    | User | iSeries Access Driver |

    | :--- | :--- |

    | Description | |

    | Driver | iSeries Access Driver |

    | System | iSeries.itso.com |

    | UserID | |

    | Password | |

    | Naming | 0 |

    | DefaultLibraries | QPL |

    | Database | |

    | ConnectionType | 0 |

    | CommitMode | 2 |

    | ExtendedDynamic | 1 |

    | DefaultPkgLibrary | QG

    | DefaultPackage | A/DEFAULT(IBM),2,0,1,0,512 |

    | AllowDataCompression | 1 |

    | LibraryView | 0 |

    | AllowUnsupportedChar | 0 |

    | ForceTranslation | 0 |

    | Trace | 0 |

    | DFT | 1 |


    2. You can add rows after the last entry. For example, the default date format
    is 1 as shown in Example 3-2.


    Example 3-2 Changing connection options


    | User | iSeries Access Driver |

    | :--- | :--- |

    | Description | |

    | Driver | iSeries Access Driver |

    | System | iSeries.itso.com |

    | UserID | |

    | Password | |

    | Naming | 0 |

    | DefaultLibraries | QIWS |


    ```

    Database =

    ConnectionType = 0

    CommitMode = 2

    ExtendedDynamic = 1

    DefaultPkgLibrary = QG

    DefaultPackage = A/DEFAULT(IBM),2,0,1,0,512

    AllowDataCompression = 1

    LibraryView = 0

    AllowUnsupportedChar = 0

    ForceTranslation = 0

    Trace = 0

    DFT = 1

    ```


    ## 3.2 Tools and utilities for data access


    There are some readily available tools and utilities using iSeries ODBC Driver
    to access data stored in DB2 UDB for iSeries. This section covers the following:


    - Using ISQL

    This is a small sample application that comes with unixODBC and can be useful
    to test queries or extract in batch mode to a delimited file. It can also be used
    to generate results wrapped in Hypertext Markup Language (HTML).


    - Using cwbrunsql

    iSeries Access for Linux is shipped with a tool called cwbrunsql that also allows
    SQL scripts in batch.


    - DataManager

    This is a GUI application which allows the user to view and manage data sources.
    It comes with unixODBC driver manager package.

