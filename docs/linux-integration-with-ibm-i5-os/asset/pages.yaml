  md: '# 6.4.2 Apply object level security


    Object level security on an NFS directory means that a Linux user profile can
    be identified by IBM i/OS and mapped to a local user profile. Linux and Unix systems
    define user by User Identifications (UID) and Group Identifications (GID). UID
    and GID are unique numbers on each Linux system. The numbers are assigned by the
    system during creation of user profiles or by an administrator.


    # User Identification


    It is important that the UID is the same as the NFS server and client, otherwise
    you are connected with the permissions of another user profile. It does not matter
    names the user profile has. In IBM i/OS, the UID can be set in the creation of
    a user profile (CRTUSPRPF) or changed (CHGUSPRPF). In IBM i/OS, for example, the
    QSECOFR profile has a UID of 0, which is convenient because Linux the UID of root
    is 0. When changing the UID, the user must not own any files in the IFS.


    For the example in this book, a Linux user named linuxuser was created with UID
    1001. You can verify the UID with the linux command id:


    ```

    linux:\~> id

    uid=1001(linuxuser) gid=100(users),14(uucp),16(dialout)

    ```


    The IBM i/OS user profile is called ISERIESUSR and is also defined with UID 1001:

    CHGUSPRPF USPRPF(ISERIESUSR) UID(1001)


    To display the UID using the following command as shown in Example 6-3.


    > Example 6-3 Displaying current UID


    | User Profile - Basic : ISERIESUSR |

    | Object auditing value . . . . . . : *NONE |

    | Action auditing values . . . . . : *NONE |

    | User ID number . . . . . . . . : 1001 |

    | Group ID number . . . . . . . : *NONE |


    Disable the QNFSANSON user in the NFS export properties:

    1. Open in iSeries Navigator Network -> Servers -> TCP/IP.

    2. Right-click the NFS server and choose Exports.

    3. Select the exported directory, which is /nfshome and click Properties.

    4. On the General tab change the anonymous user to NONE.

    5. On the access tab as shown in Figure 6-5 you may turn off the root access.


    Now you can be in the linuxuser and create your own files and directory inside
    the mounted file system. See Example 6-4.


    > Example 6-4 Creating your files and directory


    ```

    linuxuser:\~> mkdir /mnt/iseries/linuxuser

    linuxuser@mceas2131linux:\~> ls -l /mnt/iseries/

    drwx-xr-x 2 linux root 8192 2005-08-05 00:00 linuxuser

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: '```

    linuxuxer@linux:~> chmod 700 /mnt/iseries/linuxuxer/

    linuxuxer@linux:~> ls -l /mnt/iseries/

    drwx------ 2 linuxuxer 8192 2005-08-05 00:00 linuxuxer

    ```


    ```

    linuxuxer@linux:~> echo "secret of linuxuxer" > /mnt/iseries/linuxuxer/secret.txt

    ```


    As you turn off the root access to NFS export, the Linux root user is mapped to
    the QNFASON iSeries user. It is not possible to access files with a root account
    anywhere:

    root@linux:~> ls -l /mnt/iseries/

    /bin/ls: Permission denied


    Now you are able to separate the data of different users, for example, set up
    users home directory on IBM i/OS. Keep in mind that the UID is the only authentication
    criteria in NFS protocol. If the UID is not mapped to the correct user profile
    on IBM i/OS, someone can get unauthorized file access. Especially, if a user is
    allowed to create his own profiles on NFS connected Linux system then he can create
    any UID he wants and get access to any files inside the NFS


    # Group Identification


    The Group Identification operates in the same fashion as IBM i/OS. On a Linux
    system there is a unique number for every user group. GID allows to build groups
    of users who have the same subset of permissions.


    In the example mentioned previously, you did not set up any GID on IBM i/OS. Created
    files have a GID of null. On a Linux system a UID or GID of 0 means root. The
    ls -1 command shows the permission, owner, size, and date of a file. The group
    is shown as:


    ```

    linuxuxer@linux:~> ls -1 /mnt/iseries/

    drwx------ 2 linuxuxer root 8192 2005-08-05 00:00 linuxuxer

    ```


    To change this you can create a group on IBM i/OS with the same GID as the group
    of the linuxuser. To obtain the GID of the group use the Linux command id:


    ```

    linux:~> id linuxuxer

    uid=1001(users) gid=100(users),14(wucp),16(dialout)

    ```


    On IBM i/OS create a group profile with the GID of 100:

    CRTUSPRPRF USRPRF(USERGRP) PASSWORD(''MONE'') TEXT(''Linux users group'') GID(100)


    Now the linuxuxer can create a new file within the NFS mount:


    ```

    linux:~> mkdir /mnt/iseries/linuxuxer

    linux:~> echo "TEST" > /mnt/iseries/linuxuxer/gid100.txt

    ```


    ```

    linux:~> ls -1 /mnt/iseries/linuxuxer/

    -rw-r--r-- 1 linuxuxer 9 2005-08-05 18:00 gid100.txt

    ```'
