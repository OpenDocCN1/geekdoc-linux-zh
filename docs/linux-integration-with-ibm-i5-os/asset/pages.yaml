    The string for this property must be in the following format: A/DEFAULT(IBM),x,y,z

    The x, y, and z are special attributes that require to be replaced when the package
    is used. If the package does not exist on the server, a value of 2 must be specified
    for the x.

    x = Specifies whether or not to add statements to an existing SQL package.

