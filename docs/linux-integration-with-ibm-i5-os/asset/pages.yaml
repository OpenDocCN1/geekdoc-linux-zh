    If you want to run an FTP server on a Linux server, refer to the Linux documentation
    of your distribution about the FTP management. There are different implementations
    of an FTP server available for Linux. Therefore, we cannot provide a general management
    description. Some Linux distributions have no configuration utility or a tool
