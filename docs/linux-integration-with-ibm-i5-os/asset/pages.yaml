    # Building an SSO scenario using i5/OS projected profiles


    This chapter discusses the planning and implementation of a single sign-on (SSO)
    solution for users who log in to i5/OS, Linux, and Windows machines. The method
    explained here is custom solution that you can build to enable a single username
    or password for the users.


    This chapter discusses the following:


    +   * What is single sign-on: perspective

    * The requirements and benefits of single sign-on

    * The scenario for implementing single sign-on

    * The strategy for implementing single sign-on

    * Configuring Linux and Samba server for Windows authentication

    * Linux integration with i5/OS Lightweight Directory Access Protocol (LDAP)

    * Configuring Windows clients for authentication with Samba server'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Scenario description


    This defines what we mean by single sign-on and gives a brief description of the
    scenario we are implementing.


    # What is single sign-on


    Another definition may be termed as "The ability to use the same credentials to
    access resources throughout the network, you may be prompted for authentication
    each time you access a new resource". For the purpose of this chapter we stick
    to the latter definition.


    # The requirement for single sign-on: our perspective


    As much as we would have preferred to keep things simple, today''s business requirements
    have become very complex, subsequently no single system can perform everything
    you may want to do. It is a complex IT infrastructure where we utilize various
    combinations of software, hardware, and such technologies. This brings with it
    the complexity of managing and integrating these key components. One of the most
    painful areas in a scenario is to manage and administer and authorization systems
    for all these disparate processes. This is where the concept of single sign-on
    steps comes in.


    Single sign-on, in simple terms, is the ability of a user to utilize a single
    set of authentication for all these systems. The user can authenticate using username
    or password, biometric devices, smartwatch, or any mechanism. The underlying principle
    being that he must be able to access resources with the same set of credentials.
    Without such a mechanism it is nearly impossible for a person to keep track of
    the different credentials that the person may require to access different resources.


    It is common to find a single person remembering and remembering a dozen or so
    different credentials for the various systems that the person uses. This can be
    a big management and also a personal overhead apart being a security issue. It
    is easier to protect a single username/password rather than having protect a dozen.


    # The benefits for a single sign-on


    With sign-on, it aims to reduce this complexity and to integrate all these systems
    using the same credentials. The user requires to authenticate to the different
    systems using the same credentials. A single username/password is sufficient for
    him to gain access to systems that he changes. Similarly, a single password change
    is enough if he requires to change his credentials.


    # The scenario to implement single sign-on


    This section outlines the scenario that you can utilize for implementing single
    sign-on.


    # Current scenario


    The following describe the current scenario:


    +   The name of the organization is International Technical Support Organization
    (ITSO)


    +   ITSO primarily utilizes Windows clients (Windows XP SP2, Windows 2000 Professional,
    Windows SP4, Windows 98, and Windows 95) and Linux clients for their users.


    106 Linux Integration with IBM i5/OS'
  merge: -1
  pgno: 119
- img_proc: true
  md: '+   ITSO has IBM i/OS and SUSE Linux Enterprise Server 10 as their primary
    operating systems.


    +   ITSO uses Samba on Linux as their Primary Domain Controller for authenticating
    Windows clients. The domain name is ITSODMN.


    +   All users have a minimum of three username/password sets that enable them
    to log in and utilize resources on i/OS, Linux, and Samba servers respectively.


    # Desired scenario


    The following describe the desired scenario:


    +   All users must have a single username/password to access all three servers.


    +   A single point for user creation / modification and general maintenance.


    +   A single password change must propagate to all three systems.


    Figure-1 help you to understand the overall scenario that this chapter addresses.


    | i5/OS Server | | Windows Clients |

    |---|---|---|

    | User profiles exported to Linux via Projected Profiles | | • Windows XP SP2
    |

    | Password updates accomplished through ldapmodify on Linux | | • Windows 2000
    Professional SP |

    | Samba PDC on SLES 10 | Authentication | • Windows 98 |

    | • Password checked with /etc/samba/passwd | | • Windows 95 |

    | • Password updated in Linux /etc/passwd | | |

    | • Password updated in Linux /etc/samba/passwd | | |

    | • Password updated on i/OS via ldapmodify | Password Changes | |


    Figure A-1 Logical overview of the scenario


    The following are the steps in setting up the system and are discussed later in
    the chapter.


    +   1. i/OS hosts the Users Profiles. Selected User Profiles are exported to Linux.

    2. Linux script is used to import Projected Profiles from i/OS.

    3. Linux and Samba User Accounts/Passwords are created during this import process.

    4. Windows clients authenticate using the i/OS Username/Password.

    5. Windows clients change password and the same is synced with Linux/Samba and
    i/OS.

    6. Password changes to i/OS are done using scripts on Linux (utilizing ldapmodify
    command).


    # The strategy to implement single sign-on


    This section outlines the process that you must follow before a single sign-on
    mechanism be implemented in an organization. These are steps that you must follow,
    to assess the feasibility of implementing such a solution.'
