  md: '# 3.2.2 cwbrunsql


    iSeries Access for Linux is shipped with a tool cwbrunsql that also running SQL
    scripts in batch mode. An interactive command shell like iSQL is not available.
    You can use cwbrunsql with an existing DSN, where iSeriesDB is a User DSN and
    itsouser on IBM i/OS user profile:


    ```

    cwbrunsql/DSN:iSeriesDB /USER:itsouser/PASSWORD:password/:1:batch.sql

    ```


    On the other hand, you can use cwbrunsql without a DSN but with the IBM i/OS host
    name:

