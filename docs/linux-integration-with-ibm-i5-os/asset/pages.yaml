  md: "To create the syslogd program run the following commands in this order:\n\n\
    +   1. CRTCMOD MODULE (ITSOLIB/SYSLOGD) SRCSTMF('/itsodir/src/syslogd.c')\nSYCISOPFT(*IFSIO)\
    \ TGGTCSID(37)\n2. CRTPGM (ITSOLIB/SYSLOGD) BNDSRVPGM(QSYS/QQTICONV)\n\nThese\
    \ commands create a program called SYSLOGD in library ITSOLIB and they assume\
    \ that the source for the program is in file /itod/src/syslogd.c in Integrated\
    \ File System (IFS). You have to adjust the object names to fit your environment.\n\
    \nThe next step required before run the program is to create the IFS directory\
    \ structure. The program creates the file if it does not exist, but it cannot\
    \ create the full directory structure that is required. The directory is /var/log\
    \ and you can create it using the mkdir command on QSYSOPR messages. You also\
    \ need to create a message file with a message description that is used for the\
    \ QSYSOPR messages. In the program we deploy, the message file is ITSOLIB/LINUX\
    \ or you can change this to meet your requirements as long as the program is active.\
    \ These are the steps:\n\n+   1. MKDIR DIR(/var/log)\n2. CRTMSGF (ITSOLIB/LINUX)\
    \ TEXT(Message file for SYSLOGD)\n3. ADDMMSG MSGID(LNX0001) MSGF(ITSOLIB/LINUX)\
    \ MSG('&*1') SECLVL('&2') FMT(*CHAR 80) (*BACK 5)\n\nAfter the program, and message\
    \ file are created, you can submit the syslogd program to run in batch using the\
    \ following command:\n\nSMBJOB CMD (ALL SYSLOGD/SYSLOGD)\n\nA batch job now runs\
    \ and monitors the 514 port for incoming messages. All incoming messages are logged\
    \ to file /var/log/messages and any message containing \"kernel\" are also sent\
    \ to the QSYSOPR message queue.\n\nExample B-2 Syslogd source code on IBM/OS.\n\
    \n```\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <time.h>\n\n#include <errno.h>\n#include <sys/types.h>\n#include <sys/socket.h>\n\
    #include <netinet/in.h>\n#include <netdb.h>\n\n#include <iconv.h>\n#include <QHMSNDM.H>\n\
    \n#define SERVER_PORT 514\n#define BACK_LOG 20\n#define BUFFER_SIZE 512\n\ntypedef\
    \ struct {\n char name[8];\\ char ccsid[5];\\ char conversion[3];\n```"
