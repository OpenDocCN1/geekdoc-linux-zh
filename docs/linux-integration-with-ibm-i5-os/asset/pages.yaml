  md: "# Setup on i5/OS side\n\nThis section discusses how to set the scenario environment\
    \ on the i5/OS side.\n\n# Restoring scenario library on i5/OS\n\nFirst, you have\
    \ to restore the scenario library on i5/OS. linuxusers.savf has the i5/OS save\
    \ file that contains the code to support exporting of user profiles to Linux.\
    \ This file is located in the i5-OS Directory of the unzipped Scripts.zip file.\
    \ See Figure A-2.\n\n# Configuring i5/OS LDAP support\n\nConfiguration of i5/OS\
    \ LDAP support for Extended User Attributes requires that the linuxusers save\
    \ file be restored on the i5/OS partition. You can accomplish this with the following\
    \ steps:\n\n+   1. First, transfer the linuxusers.savf file to the i5/OS system\
    \ using ftp. On the Windows client PC, change the directory to the i5-OS directory\
    \ within the hierarchy of the unzipped scripts.zip file.\n2. Start an ftp session\
    \ to the i5/OS system, such as:\n```\nftp i5-os-system\n```\n3. In the ftp session\
    \ change the name format parameter to properly recognize DOS style directories:\n\
    ```\nquote name fmt\n```\n4. In the ftp session change the transfer type to properly\
    \ transfer binary files:\n```\bin\n```\n5. In the ftp session, transfer the save-file\
    \ from the PC to i5/OS:\n```\\put linuxusers.savf linuxusers.savf\n```\n6. Quit\
    \ the ftp session:\n```\nquit\n```\n\n# Restore the save-file\n\nPerform the following\
    \ steps to restore the save-file was properly transferred to the i5/OS partition:\n\
    \n+   1. In i5/OS, issue the following command to ensure that the save-file was\
    \ properly transferred to the i5/OS partition:\n```\nDSPSAF FILE(QPL/LINUXUSERS)\n\
    ```\n2. In i5/OS, restore the save-file with the following command:\n```\nRSTLIB\
    \ USRPRF(LINUXUSERS) DEV(*SAVF) SAVF(*QPL/LINUXUSERS)\n```\n\n# Creating user\
    \ profiles\n\nTo provide the necessary handshake between the Linux and i5/OS LDAP\
    \ components, two user accounts need to be established. The first user profile\
    \ (linuxys1) is used by LDAP in Linux to access the LDAP server in i5/OS. The\
    \ following command must be issued in i5/OS to create this user profile:\n\n```\n\
    CTRTRUSPRF USRPRF(LINUXSYS1) PASSWORD(*1dlapacc) USRLCS(*SECADM) INLMNU(*SIGNOFF)\
    \ LMTCPB(*YES) G(*NONE)\n```"
