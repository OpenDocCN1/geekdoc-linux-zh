  md: '# 2.4.2 Starting a 5250 emulator


    The emulator consists of two main binaries:


    +   - ibm5250

    - setup5250


    > Note: We do not recommend running ibm5250 as default. The default environment
    variables required to run X applications are not, by default, set up correctly
    when switching to the root user. Running ibm5250 as a normal user after running
    can cause problems (file permissions). A common symptom is that the emulator cannot
    read a config file. Therefore, it reverts back to default values.


    # ibm5250


    ibm5250 invokes the 5250 emulator and opens a graphical user interface (GUI) window
    that prompts you for the system name, user ID, and password. This information
    is used to obtain a 572XX1 license on the system, which is required for a 5250
    session to be brought up.


    Type <iSeriesName> to start the emulator or use ibm5250 --help to see command
    line options. The iSeries name is an optional parameter. This opens the New 5250
    Session window as illustrated in Figure 2-1. Type your IBM i/OS user profile and
    password and then click OK to open a 5250 session. If you get an error like ibm5250:
    command not found then you must add the directory /opt/ibm/iSeriesAccess/bin/
    to the shell variable:


    ```

    linux:~> ibm5250

    5250: [ INFORMATIONAL ]: Build Date: 13 July 2005 (1.10).

    ```


    ![](img/165c050f45ac58e1635258993855261a_27_0.png)


    Figure 2-1 New 5250 session'
  merge: -1
  pgno: 27
