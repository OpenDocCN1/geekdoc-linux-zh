  md: '# Linux Integration with IBM i5/OS


    # iSeries access for Linux installation, features, and users guide


    IBM System i5/OS platform offers many points of integration that support Linux
    applications leveraging IBM i5/OS applications and data, such as IBM eServer iSeries
    Access for Linux, IBM i5/OS NetServer with Samba support, and IBM Java Virtual
    Machine and JOpen technique


    Various access methods of IBM i5/OS data from Linux


    This Redbook covers every communication technique with sample code and shows you
    the methods that you can use to connect Linux applications with IBM i5/OS.


    This book is intended to help Linux users, programmers and administrators, with
    an IBM i5/OS background, to connect Linux with IBM i5/OS.


    Plan and implement an SSO scenario with Linux


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-6551-00    ISBN 0738496677'
