    Performance related properties are listed in Table C-5.


    | Keyword | Description | Choices | Default |

    | --- | --- | --- | --- |

    | BLOCKFETCH | Specifies whether or not blocking will be done on fetches of 1
    row. When set, the driver will try to optimize fetching when one record is requested
    by the application. Multiple records will be retrieved and stored by the driver
    for later retrieval by the application. When an application requests another,
    the driver does not require sending another fetch to the host database to get
    it. If not, blocking is used according to the application''s ODBC settings for
    that particular statement. | 0 = Use ODBC settings for blocking

    1 = Blocking with a fetch of 1 row | 1 |

    | BLOCKSIZE or BlockSizeKB | Specifies the block size (in kilobytes) to retrieve
    from the Iserver and cache on the Client. This property has no effect unless BLOCKFETCH
    is 1. Larger block sizes reduce the frequency of communication to the server,
    and therefore may increase performance. | 1

