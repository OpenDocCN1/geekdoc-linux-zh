  md: "# Setup on Linux side\n\nRun the following scripts on Linux side.\n\n# Install\
    \ the dosling script\n\nInstall the script in Linux with the following commands:\n\
    \n+   1. In Linux, create a directory to hold the script:\n   mkdir /usr/src/linuxusers\n\
    2. On the Windows client PC change the directory to the linuxusers directory within\
    \ the hierarchy of the unzipped scripts.zip file.\n3. From the PC client where\
    \ the script is located, start an ftp session to the Linux system:\n   ftp linux-system\n\
    4. After logging into ftp, change the directory to the /usr/src/linuxusers directory:\n\
    \   cd /usr/src/linuxusers\n5. In the ftp session change the type to properly\
    \ reflect binary files:\n   bin\n6. In the ftp session transfer the doall script:\n\
    \   put dosling dosling\n7. Quit the ftp session:\n   quit\n\n# Configuring the\
    \ dosling script\n\nThere are three (or variables) in the dosling script that\
    \ you must change to match the configured ldap values in the ldap.conf file: established\
    \ earlier in support of extended user profiles (os400-profile) and the I/OS system\
    \ that the ldap users are being pulled from (os400-sys). Using the example we\
    \ use in this book, and also the example ldap.conf file, the $dn value in the\
    \ doall script reflects the following:\n\n```\n$dn = \"os400-profile=linux1,cn=accounts,os400-sys=rchas61.rhland.ibm.com\"\
    ;\n```\n\nAdditionally, change the $b value to reflect the system that the ldap\
    \ users are being pulled from (os400-sys). Again, using the example ldap.conf\
    \ file, the $b value would reflect the following:\n\n```\n$b = \"os400-sys=rchas61.rhland.ibm.com\"\
    ;\n```\n\nLastly, change the $h value to reflect the host name of the system that\
    \ ldap users are being pulled from. Ensure that the name can be resolved through\
    \ DNS or through the /etc/hosts file on Linux. Again using the name the $h value\
    \ would reflect the following:\n\n```\n$h = \"rchas61\";\n```\n\nExecute the dosling\
    \ script in the /usr/local/bin directory each time you add a new user in the I/OS\
    \ system. Remember to complete all I/OS steps for adding a user and to run the\
    \ RVMLXUSERS and ADDLNXUSERS commands before you run this script.\n\nExecute the\
    \ dosling script after all the I/OS setup steps previously discussed have been\
    \ completed. Executed it by executing the following command:\n\n```\n# perl /usr/src/linuxusers/dosling\n\
    ```"
  merge: -1
