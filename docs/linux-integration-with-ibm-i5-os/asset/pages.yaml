  md: 'This configuration establishes an encrypted connection between Linux and IBM/OS,
    but it does not prove whether the remote computer is IBM/OS that you want to connect.
    To prevent a so called man in the middle attack, tunnel can verify the remote
    server with a certificate. During establishing an SSL connection, the server provides
    his certificate to the client in order which the client can verify his authenticity.
    On many IBM/OS a signed certificate is used. Means, IBM/OS is also the Certification
    Authority (CA).


    If you use self signed certificates the public CA key is stored on IBM/OS Integrated
    File System (IFS) in /IBM/User/Data/ICS/Cert/CertAuth/CA.txt. You can download
    it with ftp in American Standard Code for Information (ASCII) mode or use the
    procedure provided in Example 2-9. The example retrieves the public CA key and
    convert it with iconv from Extended Boded Decimal Information Code (EBCDIC) encoding
    to ASCII.


    If you have your own infrastructure or a certificate signed by some other then
    you must use the appropriate CA key. See Example 2-9.


    # Example 2-9 Install i/OS CA certificate


    ```

    linux://~iseries.ibm.com/qibm

    Password:

    Domain=[T150] Server=[05/400 V5R3MO]=[1 Support for Windows Network Neighborhood


    tunnel > get userdata/ics/cert/certauth/ca.txt ca.ebcdic

    getting file /userdata/ics/cert/certauth/ca.txt size 765 as ca.ebcdic (249.0 kb/s)/(249.0
    kb/s)

    tunnel > exit


    tunnel > iconv -f IBM037 -t IBM64 ca.ebcdic -o ca

    tunnel > cat.txt


    BEGIN CERTIFICATE-

    MIIC9TCCAlGAwIBAgEpleIJANBqHKC1g9W0OAQAFQADBIMQswCQYDVQQQGEwJk

    ZFTEMZMAUECMQYwMDY0QVqQk3YvSRT1GTJ2XpMXETAPBNGYM

    BCAEMFTWNAYUBM0K8B4TYATMXY5F01JITMYtXN35AYNDX5MFOWSDL

    BKAMEGUBIZMC0QY3B6GZ0QVBAgRBA3Y3S37YBYGAHUCEMNI1UbUpByv2Y

    9U1B0UTTLTKANcVdTUs4Y6K4455kS2+S3Y/fPswUq2PlmG37I1fDclQ0

    nq2Y3fHB3qP2f900B10F/JECvQYk3kd3YqOs0CAWAETANBQqkhig9

    9W0OAQAFQ0ABQMCTAOC989J37gFePoV2qF0QnHumJksQY6B5Pr1Q0AS10

    Ctys/Ieb1ubG1W35cmX4H149gFePoV2+J0S3cYF97Qgle1+h18s6YtPloz1ux

    dxd118Fn1xt00Qk0Xw4I1Q900AQN0MS3ctp1YfBcmMgJFIQ10==-

    END CERTIFICATE-

    ```


    The default directory for tunnel configuration is /etc/tunnel/. You must use your
    CA key file and the tunnel.conf file. Add the following text in the First of the
    section of the tunnel.conf file:


    ```

    # enable CA validation

    CAFile = /etc/tunnel/ca.txt

    verify = 2

    ```


    To test the certificate for your authentication start tunnel and connect to IBM
    i/5OS with it this test must show a tunnel message as follows:


