    # 3.4 Writing ODBC applications


    There are many methods of writing your Linux applications to access database on
    IBM i/OS. This section provides an overview of ODBC programming and demonstrates
    the usage of unixODBC API with small sample code. The following scenarios are
    presented in this section:


    +   - Client Servers: Using C applications can fetch an ordinary database file
    from a back-end i/OS using the iSeries Access ODBC Driver for Linux.

    - On three tiers: These are common in Web pages. They use a PHP module that provides
    built-in ODBC functions and access to DB2 for iSeries.

    - Using Perl to establish a database connection


    # 3.1 Client application written in C


    The ODBCExample.c is a working example of an application fetching an ordinary
    database file (QIWS/QCUSTCDT) from a backend i/OS using the iSeries Access ODBC
    Driver for Linux.


    This example assumes unixODBC and the iSeries Access ODBC Driver for Linux is
    installed. The target i/OS database must be registered as a data source in unixODBC.
    For compiling, you may also require unixODBC-dev package. The command to compile
    this is:


    ```

    linux:~$ gcc -o ODBCExample -lodbc ODBCExample.c

    ```


    The -o switches the output executable. The -lodbc switch links the ODBC libraries.
    The source code of ODBCExample is shown in Example 3-7.


