  md: 'The menu bar four pull-down lists of Connection, Preferences, Options, and
    Help.


    +   - Connection

    Use this option to create, edit, browse, copy, and remove emulator connection
    configurations. Also use this option to connect to any existing connection configuration.


    +   - Preferences

    This menu allows you to turn on or off emulator options. Preference settings apply
    to all 5250 sessions.


    +   - Options

    You can define a password to prevent others from using the setup5250 utility.


    +   - Help

    Use this menu to get a detailed description about the setup program.


    2. To create a new session

    Select **New** from the Connection menu bar. Give a connection description and
    the Name or IP address of the iSeries as illustrated in Figure 2-4.


    ![](img/165c050f45ac58e1635258993855261a_29_0.png)


    Figure 2-4 5250 Emulator Connection


    Then, on the same panel, click **Advanced 5250 Connection** button if you want
    to define additional options, as illustrated in Figure 2-5:


    +   - Session title: The text value displayed as the session title.

    - Display name: This text value determines the 5250 display device name in IBM
    i5/OS.

    - Window size: This specifies the initial size and location of 5250 window.

    - Full screen: If this box is checked, the 5250 window uses whole screen.

    - Width: This value determines the horizontal width of the window in pixels.

    - Height: This value determines the vertical height of the window in pixels.

    - Horizontal, vertical, and corner offset shift the windows location on screen.

    - Bypass sign: This option allows you to bypass the IBM i5/OS sign screen.

    - Use Kerberos principal name, no prompting: This enables Kerberos authentication.'
