  md: '# Linux system message logging


    This appendix describes a mechanism for logging Linux system messages in IBM i5/OS
    using syslog on Linux and a syslogd server program on IBM i5/OS.


    All Linux system messages are logged to a file and those that are selected go
    as messages to QSYSOPR. This allows you to effectively monitor multiple Linux
    systems from an IBM i5/OS partition.


    Every Linux system can send messages whether it is installed on a standalone PC,
    a logical partition (LPAR), or on an IXS/IXA. Topics in this appendix include:


    +   * Introduction to syslogd

    * Linux configuration

    * IBM i5/OS configuration'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Introduction to syslog\n\nSyslog is a Linux daemon responsible for logging\
    \ messages on UNIX and Linux systems. Processing of the syslog daemon is controlled\
    \ by the /etc/syslog.conf file and you can find detailed information about this\
    \ configuration file using the following Linux command: \n\n```\nlinux:-> man\
    \ syslog.conf\n```\n\nThe important part of the man page is the section talking\
    \ about remote logging. Built in to the syslog program is the ability to send\
    \ the system messages to a remote system where it is logged. At the remote system\
    \ you get a time stamp, source originating system, and the original message as\
    \ follows:\n\nNOTE: SLESI10 also comes with syslog-ng, which is a \"new-generation\"\
    \ syslog (replacement) for Unix and Unix-like systems. It tries to fill the gaps\
    \ in the original syslog. Processing of the syslog daemon is controlled by the\
    \ /etc/syslog-ng/syslog-ng.conf file and detailed information about this configuration\
    \ file can be found using the following Linux command:\n\n```\nlinux:-> man syslog-ng.conf\n\
    ```\n\nWe are using syslog daemon in this book.\n\n# Syslog system configuration\n\
    \nThe configuration of syslog is controlled by the /etc/syslog.conf file on your\
    \ Linux server. There is extensive help for this configuration in the man pages.\
    \ The configuration of this file allows an administrator to log certain messages\
    \ (those coming from certain applications, of a certain severity, and so on) to\
