  md: '# Connect IBM i5/OS with FTP


    This chapter discusses the File Transfer Protocol (FTP) method of accessing data
    stored on an IBM i5/OS system from a Linux operating system. Covered methods include:


    +   * FTP operation tips

    * Running FTP commands in interactive mode

    * Running FTP commands in batch mode'
  merge: -1
