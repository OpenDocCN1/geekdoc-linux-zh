  md: 'Note: As an Window system, you might be using either Xorg or XFree86 implementation.
    Also, you may be using font server or not. Therefore, for a correct configuration,
    you have to check two items:


    +   - Which implementation of X Window system are you using.

    - Whether you are using font server.


    To configure your system for scalable fonts follow the next steps:


    +   a. Check which X Window system you are using. Type the commands as shown in
    Example 2-1.


    Example 2-1 Type commands to check X Window system


    ```

    linux:-> # X -version

    X Window System Version 6.9.0

    Release Date: 21 December 2005

    X Version 11, Revision 0, Release 6.9

    X Protocol Linux [ELF] SuSE

    Building System: SuSE Linux

    Current Operating System: Linux 2.6.16.21-0.8-ppc64 #1 SMP Mon Jul 3

    18:25:39 UTC 2006 ppc64

    Build Date: 17 June 2006

    Before reporting problems, check http://wiki.X.Org

    to make sure that you have the latest version.

    ```


    Module Loader present


    If you are using Xorg implementation as shown in Example 2-1, you see the X Window
    configuration file, which is /etc/X11/xorg.conf.


    For Free86, the file is /etc/X11/XF86Config.


    +   b. Check whether you are using font server or not. Neither of the W Window
    configuration files that you found in the previous step (either/etc/X11/xorg.conf
    or /etc/X11/XF86Config file), search for the FontPath entry. If you find the entry
    and it is commented out, means you are using a font server. Following is an example
    of that entry.


    FontPath "unix:/7100"


    +   c. Now you are ready to edit the configuration file.


    > Note: Depending on what you have found, the actual configuration file is to
    edit different:


    +   - If you are not using font server, edit X Window configuration file:

    - /etc/X11/xorg.conf file

    - /etc/X11/XF86Config file

    - If you are using font server, edit:

    - /etc/X11/fs/config


    Look for the following lines in the located configuration file:


    +   - /usr/X11R/lib/lib/fonts/75dpi:unscaled,

    - /usr/X11R/lib/lib/fonts/100dpi:unscaled,


    The word unscaled at the end of the lines means that you are using unscaled fonts.'
