  md: '# Detailed logical flow


    Support for projected user profiles requires a number of files to be installed
    in both i/OS and Linux. As you have realized by now this entire procedure is fairly
    complex and you may require to really understand how the system is working. This
    section explains in details the purpose and function of all the scripts and their
    relationships. You may require to understand this flow in case you have to change
    or adapt the scenario to your specific situation or requirement.


    +   ldap.conf

    Linux client uses OpenLDAP configuration file.


    +   doall

    Perl script to import users with projected profiles from i/OS and creates respective
    users in the Linux Samba server. It creates both Linux system users and Samba
    users. Intended to be the first time when importing users from i/OS. This resets
    the usernames and passwords for both Linux and Samba users to their default values.
    The default value of the passwords is the same as the usernames.


    +   smpass

    Bash script is called by doall and initializes the password for the new users
    added to Samba. The default password is the same as the user''s username. This
    is the script that creates and sets the Samba password for all the users. It is
    called automatically by doall and does not require you to run it individually.


    +   smbchat

    The main password synchronization script. This is called through the passwwdm
    parameter in smb.conf file.


    +   chg5user

    Bash script is called by Samba server through the use of passwd parameter in smb.conf
    file. The purpose of this file is to look up and change the password for the user
    in i/OS and the local Linux system. Samba takes care of changing the password
    inside the Samba database. This script is also called by the chguser and smbchat


    # Adding new users into domain


    This section provides the information for adding new users into the domain which
    you set up in "Initial environment setup" on page 108.


    # Prerequisites checkpoint


    We assume that you have already installed and configured the scenario package.
    You can check this by executing the following commands on the i/OS terminal:


    +   On the i/OS side:

    DSPBJ0D OBJ(QSYS/LINUXUSERS) TYPE(*LIB)


    +   On Linux side:

    Check for the existence and correctness of the /etc/openldap/ldap.conf file

    Check for the existence and correctness of the /etc/samba/smb.conf file.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Check for the existence and correctness of the following files in the /usr/local/bin
    directory:


    +   - chgi5user

    - chguser

    - smbchat

    - smbpass


    Check for the existence and correctness of the following files in the /usr/src/linuxusers
    directory:


    +   - doall

    - dosingle


    Follow the steps given in the following sections in case everything checks out
    correctly and you already ran the initial setup process earlier.


    # Setup on i5/OS side


    This section describes the procedure of scenario setup on i5/OS side.


    # Adding new user to Linux group user profile


    Add new i5/OS user that you want to add as a part of this scenario. You can give
    the following commands in order to create the user and also to make him a member
    of the linux group profile (linuxsysg) that was created in the initial environment
    setup:


    ```

    CTRUSPRF USPRF (NEWUSR) GRPRF (LINUXSYSG)

    ```


    Replace the NEWUSR variable in the previous command with the actual username that
    you want to create. This command creates the respective user and also makes him
    a member of the correct Linux Group Profile.


    # Building the i5/OS group list


    After adding the user profiles in i5/OS to the "linuxsysg" group, initialize the
    group list in i5/OS and rebuild it with the following command:


    ```

    CHGURL18 LINUXUSERS

    RMVLNUXUSERS LINUXSYS(LINUXSYS1) LINUXGRP(LINUXSYSG)

    ```


    The RMVLNUXUSERS command disables the users in Linux. Specifically, the RMVLNUXUSERS
    command causes the list of Linux users to be cleared.


    +   - ADDLNUXUSERS LINUXSYS(LINUXSYS1) LINUXGRP(LINUXSYSG)


    The ADDLNUXUSERS command enables the users in Linux. Specifically, the ADDLNUXUSERS
    command causes the list of Linux users to be rebuilt by finding all i5/OS user
    profiles that belong to the Linux group (in this case LINUXSYS1G) and adding them
    to the Linux users list.


    > Note: Execute these commands each time a user profile in i5/OS is added to or
    removed from the linuxsys1g group.'
  merge: -1
  pgno: 130
