    # Testing Socket scenario


    After the client and server programs are compiled and ready to run, you must start
    the server socket program to receive a message. You can run the server in either
    interactive mode or in batch mode. On both IBM i/OS and Linux, the messages sent
    to the server are outputted to standard out. To run the server interactively on
    IBM i/OS, use the command CALL ITSOLIB/SERVER. To run the server interactively
    on Linux you use the .server command. To run the server code in a background or
    batch jobs, you can use the following commands:


    +   - On IBM i/OS:

    SBJMJOB CMD ITSOLIB/SERVER

    This submits a batch job and by default standard out, it goes to a pooled file.


    +   - On Linux:

    linux:> server > output.file &

    This starts a background job and redirects standard out to file output.file in
    the current directory.


    Now you can send a message to your server. To run the client program on IBM i/OS
    you can use the following command:


    CALL ITSO/CLIENT PARM(Servername) "This is my text message")


    Here, Servername is the host name or IP address of the server you want to send
    your message to. To end the server program send it a STOP message. On Linux you
    can run the program using:


    client Servername "This is my text message"


    Example 8-3 is a sample of the output generated by a server running on a Linux
    system.


    Example 8-3 Sample server output


    ```

    linux:> server

    Received data from: 1513462665

    ''This is a message from iSeries''

    ```


    ```

    Received data from: 1513462666

    ''This is text from Linux''

    ```


    ```

    Received data from: 1513462666

    ''STOP''

    ```


    ```

    linux:>

    ```'
