  md: '# 3.1.2 Editing odbc.ini: Text mode of ODBC configuration


    Some of the driver connection options are not available via the ODBCConfig GUI.
    If you have the requirement to use some of the advanced DSN options then you must
    edit an odbc.ini file. The following example describes the edit of a system DSN,
    the same steps (except the file location) also applies to a user DSN.


    See the list of connection DSN options in Appendix C, "ODBC string parameters"
    on page 151 or at:

    http://www.ibm.com/servers/eserver/iseries/linux/odbc/guide/odbcproperties.html


    Perform the following steps to manually add connection options to the system odbc.ini
    file:


    +   1. An empty file odbc.ini must already exist after installation of unixODBC.
    Using your text editor of choice, edit this file with the contents as shown in
    Example 3-1. Make sure that you have root authorities for editing the system DSN
    file. Use the dbcinst -j command to locate your user DSN.


    Example 3-1 Editing odbc.ini file


    | iSeriesDB84allUser | iSeries Access ODBC Driver |

    | Description = |

    | Driver = iSeries Access ODBC Driver |

    | System = iSeries.itso.ibm.com |

    | UserID = |

    | Password = |

    | Naming = 0 |

    | DefaultLibraries = QPL |

    | Database = |

    | ConnectionType = 0 |

    | CommitMode = 2 |

    | ExtendedDynamic = 1 |

    | DefaultPkgLibrary = QPL |

    | DefaultPackage = A/DEFAULT(IBM),2,0,1,0,512 |

    | AllowDataCompression = 1 |

    | LibraryView = 0 |

    | AllowUnsupportedChar = 0 |

    | ForceTranslation = 0 |

    | Trace = 0 |


    +   2. You can add rows to modify the default behavior of the driver at run time.
    For example, the default date format is 5 which is yyyy-mm-dd or "ISO". If you
    want to change this format to 1 which is mm/dd/yy or "MDY", add a new row after
    the last entry in the data source and enter the new connection option and in the
    syntax of keyword = value. The entry this book uses DFT = 1 as shown in Example
    3-2.


    Example 3-2 Changing ODBC connection options


    | iSeriesDB84allUser | iSeries Access ODBC Driver |

    | Description = |

    | Driver = iSeries Access ODBC Driver |

    | System = iSeries.itso.ibm.com |

    | UserID = |

    | Password = |

    | Naming = 0 |

    | DefaultLibraries = QIWS |'
