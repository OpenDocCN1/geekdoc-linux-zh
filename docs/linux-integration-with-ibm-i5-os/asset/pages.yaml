    After the kerb5.conf file is modified check the following important considerations:


    +   The Kerberos protocol expects that participating computer systems have a consistent

    time setting. This is a proper setting of the current time and the time zone.
    If the time

    skew between systems exceed more than 300 seconds, then an authentication is

    longer possible. We recommend that you use a network time source to keep a

    dispancy as low as possible.


    +   For Kerberos authentication, a correct DNS resolution is also very important.
    To get

    access to the target system if the Kerberos client resolves a different name than
    the system known

