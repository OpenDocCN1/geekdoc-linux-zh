  md: 'Table 8-1 shows several examples and the differences.


    Table 8-1 Bytes ordering (endian)


    | Decimal value, C source code value | Big endian representation | Little endian
    representation |

    |--- |--- |--- |

    | 125 - 0x7D | 7D | 7D |

    | 500 - 0x01F4 | 01 F4 | F4 01 |

    | 200,000,000 - 0x0BEBC200 | 0B EB C2 00 | 00 C2 EB 0B |

    | 4,294,967 - 0x0100000002 | 00 00 00 01 00 00 00 02 | 02 00 00 01 00 01 00 00
    |


    +   The best thing to avoid endian ordering or problems is to minimize dependencies.
    The following are the steps you can take in C and C++:

    - Avoid casting smaller sized storage over larger sizes (for example, no (short
    *) over (int *)).n- Avoid casting larger sized storage over smaller ones (for
    example, no (int *) over).

    - Avoid casting structure over another.

    - Avoid unions with different sized items (this is the same as avoiding unions).

    - Avoid the use of bit variables.


    If you cannot avoid these coding styles, you must employ the use of suitable #ifdef
    statements with big endian and little endian versions of the code provided. This
    lets the compiler select the correct byte order dependent.


    # 8.2 Sockets programming example


    Sockets and the programs written on top of sockets are able to handle almost any
    integration you want to provide between Linux and IBM i/OS. In fact, most of the
    other methods discussed in this book use flavors of sockets or under the cover.
    Example 8-1 shows how to send a message from one system to the other using sockets
    interface.


    # 8.2.1 Client code example


    The client has two input parameters. The first parameter is the host name or Internet
    Protocol (IP) address of the server where the message is sent. The second parameter
    is the text to send. If the second parameter is left off then a default message
    is sent.


    The client is C program that opens a socket on a specific port to a specific host,
    sends data using the socket, and finally closes the socket. It also converts from
    EBCDIC to ASCII when it runs on the IBM i/OS system. Multiple #ifdef statements
    around the IBM i/OS specific code allow the exact same code to compile and run
    on Linux and on IBM i/OS.


    To create the client program on Linux, issue the following command:


    ```

    linux:~$ gcc -o client.c

    ```'
