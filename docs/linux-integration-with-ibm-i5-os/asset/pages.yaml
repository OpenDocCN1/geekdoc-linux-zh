- img_proc: true
  md: 'The second user profile, we call it a Linux group profile (linuxys1g), is used
    to group all of the user accounts to be given Linux access as a single group:


    ```

    CRUSRPPRF USRPRF (LINUXYS1G) PASSWORD(*NONE) INLNU (*SIGNOFF) LMCPB(*YES) GID(*GEN)

    ```


    # Adding users to Linux group profile


    Now, all existing i/OS users (that you want to include in this scenario) into
    the linuxys1g group profile. To accomplish this, you have to enter the following
    commands on the i/OS:


    ```

    CHUGUSRPF (CURUSR) GRPPRF (LINUXYS1G)

    ```


    Replace the CURUSR with the actual name of the user that you have to include in
    the linuxys1g group. Based on your setup, repeat this command for all users that
    you require to configure for this scenario.


    # Running required commands


    After all of the user profiles in i5/OS have been added to the "linuxys1g" group,
    the group list in i5/OS requires to be initialized and rebuilt with the following
    command:


    ```

    CHCGIL8 LINUXERS

    ```


    +   - RMVLNXUSRS (LINUXYS1) LINUXGRP (LINUXYS)

    The RMVLNXUSRS command disables the users in Linux. Specifically, the RMVLNXUSRS
    command causes the list of Linux users to be cleared.

    - ADDLNXUSRS LINUXYS (LINUXYS1) LINUXGRP (LINUXYS)

    The ADDLNXUSRS command enables the users in Linux. Specifically, the ADDLNXUSRS
    command causes the list of Linux users to be rebuilt by finding all i5/OS user
    profiles that belong to the Linux group (in case LINUXYS1G) and adding them to
    the Linux list.


    > Note: Execute these commands each time a user profile in i5/OS is added to or
    removed from the linuxys1 group.


    In addition, run the Linux commands doal1/dosingle.


    # Setup on Linux side


    This section describes the setup procedure of the scenario on Linux side.


    # OpenLDAP client configuration


    Place the OpenLDAP client configuration file (ldap.conf) in the /etc/openldap
    directory and modify it to reflect the environment on LDAP is being used.


    # Transfer Idap.conf file to Linux system


    On the Windows client PC, change the directory to the OpenLDAP directory within
    the hierarchy of the unzipped zip.file.'
