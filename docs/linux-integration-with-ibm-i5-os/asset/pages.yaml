- img_proc: true
  md: '# 7.1 FTP operations


    FTP is the standard for Transmission Control Protocol/Internet Protocol (TCP/IP).
    FTP consists of both a client and a server application. A client application is
    included with most operating systems and is run typically in an interactive mode.
    The server application is also included in most operating systems. However, the
    server application runs in a background or batch mode and must be started explicitly.


    # 7.1.1 Common FTP commands


    There are two ways to transfer data in FTP. These are binary and American Standard
    Code for Information Exchange (ASCII) mode. In binary mode the bits of the file
    are copied exactly as is. No conversion is done to the data. Binary mode is used
    for transferring actual programs, images, file objects, and other files. In non-binary
    mode, data may be converted between two systems. Non-binary, or ASCII mode, is
    used for text files, program source, and other files that are read by humans.
    By default your FTP session in non-binary mode. To switch to binary mode enter
    FTP command bin.


    To start an FTP session, enter FTP server where server is the host name or IP
    address of the system you want to transfer files. After you start the FTP session,
    you can use the command to get files from the remote system to the local system
    and the command put to put files from the local system to the remote system. You
    can perform many get and put commands during a single FTP session.


    When you initialize FTP IBM/OS, you are in the QSYS file system. Files are accessed
    by library/file/member for objects within a file or library/object for non-file
    objects. You can also access files in the Integrated File System (IFS). To switch
    to IFS mode you enter the FTP command quote site namefmt 1 cd / . To access QSYS
    files you can use /qsys.lib/library.lib/file/member.mbr or /qsys.lib/library/object.type.
    To access files in IFS you can use /directory/directory2/file.name where file.name
    is the name of the file you want to.


    Other FTP commands are cd and 1cd, which change the directory location on the
    remote and local systems respectively. The prompt command is useful in conjunction
    with the mget or mput commands. The prompt command turns off interactive prompting
    which you may want to do, mget or mput allow you to get or put multiple files
    with a single command.


    # 7.1.2 Managing FTP server


    To configure the i/OS FTP server use the command CHGPTA. For starting and stopping
    FTP server use the commands STRTCPSVR *FTP AND ENDTCPSR *FTP.


    Alternatively use the iSeries Navigator. The FTP Server is located in Network
    -> Server -> TCP/IP -> FTP.


    Additionally, the iSeries Navigator shows the status of the FTP server.'
