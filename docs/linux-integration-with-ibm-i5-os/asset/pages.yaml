  md: '# 5.3.2 Linux Samba client configuration


    There are many methods to access to a NetServer share, on graphical user interface
    (GUI) and also on the console. The GUI methods are very similar to Windows operating
    system, we discuss two methods of accessing SMB resources from a Linux console:


    +   - smbmount

    - smbclient


    The smbmount command is the equivalent of mapping a drive in Windows, but instead
    of drive letters with Windows, directories are mounted on a directory. These directories
    are called mount points. Any directory you have authorization to, can be mounted.


    Executing the smbmount command starts an smb daemon process that manages the mount
    point. While the smb daemon runs, the mount point is active.


    In order to mount arbitrary file systems, you must either be signed in as the
    root user or the smbmount and smbclient commands must allow non-root user execution.
    For further information, see the pages of mount, smbmount, and fstab. The type
    of file system mounted by smbclient is called cmbfs.


    The smbclient command is an interface similar to the File Transfer Protocol (FTP)
    interface that you can use to access remote shares. It is generally used when
    a user requires a short connection to a remote share or wants to see a list of
    the available shares.


    # Using smbmount to mount a network drive


    Because you have created a new folder and shared it with iSeries Navigator, you
    are now ready to mount remote iSeries NetServer share. First, you require a local
    mount point on the Linux system. Most distributions have a directory of the root
    named /mnt. Therefore, a good place to create a mount point would be within /mnt/:


    +   1. Execute:


    ```

    linux:~$ mkdir /mnt/smbtest

    ```


    It is not a requirement for the directory name to match the share name on IBM
    i5/OS.


    +   2. Now, if you are signed in as root, you can mount the remote share:


    ```

    linux:~$ smbmount //iseries.itso.ibm.com/test /mnt/smbtest -o username=itsouser

    ```


    Password:


    The user name parameter must be specified to specify an i5/OS user name. You are
    now prompted for a password. You may now treat the mounted directory as though
    it were a local file system.


    +   3. To test, execute:


    ```

    linux:~$ ls /mnt/smbtest

    ```


    # smbmount command details


    The first argument of the smbmount command is the remote share which is an Internet
    Protocol (IP) address or be resolvable to an IP address via Domain Name System
    (DNS), /etc/hosts, /etc/samba/hosts. The second argument is the local mount point.
    The -o switch indicates optional parameter and precedes settings to be set to
    the mount daemon. In this case, the only option you are signing is the i5/OS user
    profile you would like to sign in with. For additional smbmount command options
    use man smbmount or the:


    ```

    linux:~$ smbmount --help

    ```'
