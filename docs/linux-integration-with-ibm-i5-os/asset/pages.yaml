    toolbox contains many other useful classes for accessing IBM i/OS. You can use
    the toolbox to do things as run i/OS commands, create users and groups, call IBM
    i/OS programs and APIs, and access other objects. Included in the toolbox are
    graphical classes that make presenting IBM i/OS information and objects easy and
    consistent. The toolbox is also written as an open source project and the source
    code is available under the IBM Public license. More information about the toolbox
    and the open source features can be found at:


    http://www.ibm.com/servers/eserver/iseries/toolbox/


