    # 7.2 Using Linux as an FTP client


    To transfer data from Linux to IBM i/OS on the Linux system, simply enter ftp
    server where server is the host name or IP address of the IBM i/OS system. After
    this, you are prompted for a user and then password in the FTP session. This will
    require you to use a valid IBM i/OS user profile and password. Getting logged
    in you can use the put command to transfer a file from Linux to IBM i/OS. By default
    you are operating in the QCCS file system. This is the traditional file system
    with libraries, files, and members. To move, for example, a program source file
    from Linux to IBM i/OS you can issue the following command within the FTP session:


    ```

    put /client.c qcscrc.client

    ```


    This moves the file client user''s home directory to member MEMBER in the file
    QCSRC in the library ITSO on the i/OS side. The data is converted from ASCII to
    Extended Binary Coded Decimal Interchange Code (EBCDIC) by the FTP server. If
    the file is something as an image file that cannot be translated, you must first
    issue the bin FTP command.


    Chapter 7. Connect IBM i/OS with FTP 91'
