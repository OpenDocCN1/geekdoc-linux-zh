  md: '# 5.2 Requirements and installation


    The iSeries NetServer is included in the IBM i5/OS operating system. The iSeries
    Navigator allows you to check the NetServer status, starting, stopping, stopping,
    and changing properties like the NetServer network name. See Figure 5-1.


    ![](img/165c050f45ac58e1635258993855261a_82_0.png)


    Figure 5-1 Check NetServer status with iSeries Navigator


    Ensure that a current PTF level is installed. The recommended fixes can be found
    on iSeries NetServer home page under Service Updates (PTFs):


    http://www.ibm.com/servers/iserver/netserver/


    The following minimum levels are required on a Linux system. Today''s Linux distributions
    must meet these criteria:


    +   - Linux kernel 2.4.4+

    - Samba versions 2.0.7+ or 2.2+


    Samba stands de facto package included in all Linux distributions. Check if Samba
    is already installed by using the `rpm` command:


    ```

    linux:~> rpm -qa | grep samba

    samba-client-64bit-3.0.22-13.16

    samba-64bit-3.0.22-13.16

    samba-3.0.22-13.16

    ```


    If nothing is returned, you have to install at least the Samba client before mounting
    an iSeries NetServer share. The Samba file names may be different from the names
    listed previously depending on the Linux distribution you are using and the release
    level of Samba.'
