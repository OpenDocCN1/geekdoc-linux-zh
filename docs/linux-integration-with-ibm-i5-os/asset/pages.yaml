    - Option menu: This option allows you to enable or disable the 5250 menu bar Option
    choice. If it is disabled you do not have access to fonts selection, keypad customization,
    record/playback selections, color mapping, or keyboard remapping.

    - Print menu: The Print menu option allows you to enable or disable the 5250 menu
    bar Print choice (to print the 5250 screen). "No menu, keyboard print only" means
    you can use a key sequence to print the 5250 screen.

    - Help menu: Turns help on or off.

    - New session: This option allows you to enable or disable starting another 5250
    emulator to a different i/OS or OS/400.

    - Browser hotspot: The Browser hotspot allows you to enable or disable recognizing
    a URL hotspot and starting a browser. When enabled and the command specified in
    the system environment variable BSER is called with the URL passed as a parameter.


    > Note: For other options and detailed description refer to 5250 Preferences Help.'
