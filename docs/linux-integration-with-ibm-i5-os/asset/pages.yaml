    256

    512 | 32 |

    | COMPRESSION or AllowDataCompression | Specifies whether to compress data to
    send to the server. In most cases, data compression improves performance to less
    data being transmitted between driver and the server. | 0 = Disable compression

    1 = Enable compression | 1 |

    | CONCURRENCY | Specifies whether to override the ODBC settings by opening all
    cursors as updateable. Note: Setting has no effect. When you are performing a
    SELECT SQL statement, you can add the FETCH ONLY or FOR UPDATE clause. If either
    of these clauses are present in an SQL statement, the driver handles the concurrency
    associated with the clause. Result sets are always read-only. | 0 = Use ODBC concurrency
    settings

    1 = Open all cursors as updateable | 0 |

    | LAZYCLOSE | Specifies whether to delay closing curs until subsequent requests.
    This increases performance by reducing the total number of requests. This option
    can cause problems, due to the cursors holding locks on result rows after the
    close request. | 0 = Do not lazy cursors

