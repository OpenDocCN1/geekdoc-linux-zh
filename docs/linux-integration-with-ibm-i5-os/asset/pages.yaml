  md: '# 3.4.2 PHP for three-tier applications


    PHP stands for PHP Hypertext Preprocessor. PHP is a widely-used general-purpose
    scripting language that is especially well-suited for Web development. It is commonly
    embedded into HTML.


    PHP is mainly focused on server-side scripting, therefore you can do anything
    that any other Common Gateway Interface (CGI) programs can do, such as collecting
    form data, generating dynamic page content, or sending and receiving cookies.


    The PHP module provides built-in ODBC functions compiled with unixODBC support.
    It can access DB2 UDB for iSeries using the iSeries ODBC Driver for Linux.


    # PHP overview


    Figure-30 describes the full process. When the Apache Web server receives a PHP
    request from a client Web browser, it forwards the request to the PHP module.
    The PHP module then finds the source code of the requested PHP page and interprets
    and executes that source code. If the PHP module finds a database access function
    in the source code, it invokes the iSeries ODBC Driver for Linux to access DB2
    UDB for iSeries and executes the related SQL statement. The ODBC driver returns
    the data set to the PHP module. The PHP module then embeds the resulting data
    with HTML tags and other content, and forwards it to the Apache server. Apache
    sends the HTML page to the client''s Web browser.


    ![](img/165c050f45ac58e1635258993855261a_58_0.png)


    Figure-30 Apache and PHP with ODBC driver on a Linux system


    # Using PHP


    The NodeJS Linux Enterprise Server and the Red Hat Enterprise Linux include all
    required software to run an Apache Web server with PHP scripting language using
    unixODBC for database access.'
