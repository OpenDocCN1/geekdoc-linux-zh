  md: '# # 8.1 General considerations


    Before starting with socket programming using the programming language C, there
    are a couple of things that you have to watch out for. First is the character
    set used in the different platforms and second is the byte order scheme used by
    the different architectures.


    # ## 8.1.1 ASCII and EBCDIC character sets


    You are probably aware that the IBM i/OS runs natively in an EBCDIC character
    set while Windows and all flavors of UNIX (including Linux) run in an ASCII character
    set. This is most noticeable when you handle integration between the platforms
    at a lower level, because higher levels of data movement usually handle the conversion
    automatically. Three common mechanisms for handling the different character sets
    include:


    +   * Using the capabilities in DB2 Universal Database (UDB) for Series


    If the data is something that you require and the integration method allows you
    to use database tables, then you must use them. The database capabilities of IBM
    i/OS handles the conversion between ASCII and EBCDIC (and many other character
    set translations). The Open Database Connectivity (ODBC) and Java Database Connectivity
    (JDBC) examples use this mechanism.


    +   * Using unicode


    Unicode is a larger character set that is available on both the IBM i/OS and the
    Linux platform. This is the approach that Java uses extensively.


    +   * Performing your own conversion


    You can perform the conversion on either Linux or IBM i/OS. However, it is probably
    the easiest and best to perform the conversion in IBM i/OS. There are numerous
    tools available for character conversion. The socket example code demonstrates
    the use of the `iconv()` application programming interface (API) to convert from
    one character set identifier (CSID) to another.


    The example program this describes uses the IBM i/OS iconv() API for ASCII-EBCDIC
    conversion. The approach we took was to send the message in ASCII format. This
    means that the program on IBM i/OS requires to convert messages.


    # ## 8.1.2 Endian byte order


    The IBM eServer system works with Power processors. One of the differences between
    the Power architecture and Intel x86 architecture is the byte ordering.


    A 32-bit integer is always represented as four bytes in the memory of a computer.
    On a PowerPC System, for bytes such as 0xA0B8COD is stored with the 0xA0 byte
    in the first memory, 0xB8 at the second, and so on. This is called big endian
    because the high order (“big”) byte is the first one in memory.


    However, on an x86 processor, the relation is the other way around. It is called
    little endian because the low order (“little”) byte is stored at the first position
    in memory. Thus, in little endian, the 0D is stored at the first byte position,
    0C at the second, and so on.


    It is important that programmers understand the situation and code in such a way
    that they avoid avoiding the exact order. Your code, written on an x86 Linux system
    can easily be ported to run on an IBM eServer i5 partition.'
