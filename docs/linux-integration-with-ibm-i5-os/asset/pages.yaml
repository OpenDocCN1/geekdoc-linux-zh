- img_proc: true
  md: "# 2.1 iSeries Access for Linux product overview\n\niSeries Access for Linux\
    \ is an additional offering in the iSeries Access family 5722XW1. It offers Linux-based\
    \ access to i5/OS systems. iSeries Access for Linux enables users to leverage\
    \ business information, applications, and resources across an enterprise by extending\
    \ the i/OS resources to Linux.\n\n# 2.1.1 iSeries Access for Linux product features\n\
    \niSeries Access for Linux consists of the following product features:\n\n+  \
    \ * iSeries Access ODBC Driver\nLinux applications written to the ODBC programming\
    \ interfaces (APIs) can use this driver to access DB2 DUB for iSeries. The iSeries\
    \ Access ODBC Driver is based on the ODBC driver in iSeries Access for Windows.\
    \ It uses the iSeries database Host Servers as the access point to the system.\n\
    \n+   * The 5250 emulator\nIt provides the function equivalent to that of an IBM\
    \ 5250 terminal. The emulator also provides extended 5250 terminal functions similar\
    \ to that the IBM PC5250 emulator provides. The emulator supports the following\
    \ functions:\n    * Customizable multi-selection support up to 99 sessions\n \
    \   * Best Fonts: different fonts are available and the font to the windows size\n\
    \    * Multi language support\n    * Macro record/playback\n    * Copy/paste\n\
    \    * 24x48 and 27x32 screen size support\n    * Screen print to Postscript printers\n\
    \    * Hot spot highlighting option\n    * Automatic, customizable, communication\
    \ error recovery\n    * Double-byte character set (DBCS) support is available\
    \ in Version 1.8\n    * Single sign-on and Kerberos support in Version 1.10\n\n\
    # 2.1.2 iSeries Access for Linux facts sheet\n\nThis section covers the topics\
    \ related to this product. At the time of writing this the actual version of iSeries\
    \ Access for Linux used was 1.10.\n\nLatest available version is 5.4.0-1.0\n\n\
    # Platform choice\n\nThe iSeries Access for Linux is designed to work on Linux\
    \ systems based on the Intel and IBM POWER™ platform. POWER platforms include:\n\
    \n+   * Linux partitions on i5\n* Linux partitions on p5\n* IBM OpenPower™ Server\n\
    \nFor Intel compatible systems:\n\n+   * Integrated xSeries Server (IXS)\n* xSeries\
    \ servers connected via Integrated xSeries Adapter (IXA)\n* Stand alone Intel\
    \ PC and Server"
  merge: -1
