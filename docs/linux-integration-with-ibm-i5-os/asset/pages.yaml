  md: "# IBM i5/OS system configuration\n\nOn IBM i5/OS, the only configuration required\
    \ is to create a program that acts as a remote syslog job and receives incoming\
    \ messages. The first step is to determine how syslog was sending messages to\
    \ a remote system. To do this, look through the /etc/services file and find an\
    \ entry for syslog. This entry looks like the following:\n\n```\nsyslog      \
    \    514/udp\n```\n\nThis told that syslog uses IP port 514 and a protocol of\
    \ User Datagram Protocol (UDP). If you want to view the /etc/services file, we\
    \ recommend you to pipe the output to a search function as grep, because the /etc/services\
    \ file is quite large. We used the following command to limit the results to only\
    \ lines that contain the word \"syslog\".\n\n```\nlinux:~$ cat /etc/services |\
    \ grep\n```\n\nAfter you know how syslog is sending remote messages, it is a fairly\
    \ simple step to take the socket server code from 8.2, \"Sockets programming example\"\
    \ on page 97 and modify it to receive syslog messages. Your initial step can be\
    \ to change the port number so that you can see what the messages look like. Based\
    \ on the messages you look like, you can then refine the server code until you\
    \ get the exact behavior that you desire.\n\n# IBM i5/OS syslog server program\n\
    \nThe syslog server program differs from the socket server because the syslog\
    \ program is expected to only run on IBM i5/OS. According to this, all statements\
    \ are required to clarify the code. Also, you have to get additional data such\
    \ as the current time and Transmission Control Protocol/Internet Protocol (TCP/IP)\
    \ host information. Finally, you have to open a file to store the incoming messages\
    \ and send out selected messages to QSYSOPR.\n\nThe program flow of the syslog\
    \ program, as shown in Example B-2, is as follows:\n\n+   1. Open the log file\
    \ where all the messages are stored. If the file does not exist it is created.\
    \ Otherwise, the file is opened in append mode. This ensures that you do not lose\
    \ previous messages that were logged.\n2. Open the socket descriptor.\n3. Bind\
    \ port 514 to the new socket descriptor. This is the port that syslog on Linux\
    \ uses. If it is linked on the Linux side then the IBM i/OS server program also\
    \ requires to be changed.\n4. Create a conversion table. All incoming data is\
    \ coming from Linux machines and therefore has been converted from American Standard\
    \ Code for Information Interchange (ASCII) to Extended Binary Coded Decimal Interchange\
    \ Code (EBCDIC).\n5. Start the main body of the program by looping until stop.\
    \ Inside the loop following steps take:\n   a. Receive incoming requests from\
    \ the socket.\n   b. Convert the data to EBCDIC.\n   c. Remove the newline character\
    \ from the end of the message.\n   d. Get the system information and add it to\
    \ the front of the message.\n   e. Check if this message goes to QSYSOPR and send\
    \ it there if it must.\n   f. Get the current time stamp.\n   g. Write the message\
    \ to the log file.\n   h. Finally, flush the write buffer every tenth.\n6. Before\
    \ exiting the program close the conversion table and socket descriptor.\n\nLinux\
    \ Integration with IBM i5/OS"
