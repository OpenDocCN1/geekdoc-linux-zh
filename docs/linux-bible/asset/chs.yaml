  \ 可用的链\n\n# 引言\n\n不通过付诸实践，你就无法学习 Linux。\n\n在教了十多年 Linux 学习之后，我得出了这个结论。你不能只读书，不能只听讲座。你需要有人引导你，而且你必须亲身上手去做。\n\
  \n1999 年，Wiley 出版了我的 `Red Hat Linux Bible`。这本书的巨大成功让我获得了成为全职独立 Linux 作者的机会。在长约十年的时间里，我在安静的小家庭办公室里写了几本\
  \ Linux 著作，并探索了解释 Linux 的最佳方法。\n\n2008 年，我开始奔波。我被 Red Hat, Inc. 聘为全职讲师，向寻求红帽认证工程师\
  \ (RHCE) 认证的专业系统管理员教授 Linux。在担任 Linux 讲师的三年里，我面对 Linux 经验从零到专业人士不等的现场听众，磨炼了我的教学技巧。\n\
  \n在上一个版本中，我将教学经验转化为文字，让读者从一个从未用过 Linux 的人成长为具备 Linux 专业技能的人。在这一版中，我致力于将这些技能扩展到云端。这`Linux\
  \ Bible` 第九版的重点可以总结为以下几点：\n\n*   **从新手到认证专业人士：** 只要你用过电脑、鼠标和键盘，就可以从这本书开始。我将告诉你如何获取\
  \ Linux、开始使用它、逐步学习关键主题，并最终精通它的管理和安全防护。\n*   **侧重系统管理员：** 当你读完这本书后，你将知道如何使用 Linux\
  \ 以及如何修改和维护它。成为红帽认证工程师所需的所有主题在书中都已涵盖。尽管如此，许多软件开发者也利用了这本书来理解如何将 Linux 系统作为开发平台或应用程序的目标平台进行工作。\n\
  *   **强调命令行工具：** 尽管用于管理 Linux 的点击式界面在近年来有了巨大改进，但许多高级功能 own 通过通过输入命令和手动编辑配置文件来实现。我将教你如何精通\
  \ Linux 命令行壳（shell），并偶尔将 shell 功能与完成相同任务的图形化工具进行比较。\n*   **针对更少的 Linux 发行版：** 在之前的版本中，我描述了大约\
  \ 18 种不同的 Linux 发行版。除极少数显著例外外，大多数流行的 Linux 发行版要么基于红帽（Red Hat Enterprise Linux、Fedora、CentOS\
  \ 等），要么基于 Debian（Ubuntu、Linux Mint、KNOPPIX 等）。虽然这本书最详尽地涵盖了红帽发行版，但在这一版中我增加了 Ubuntu\
  \ 的覆盖范围（因为那是许多顶级 Linux 粉丝的起点）。\n*   **大量的大量的演示和练习：** 我不仅仅是告诉你 Linux 是做什么的，我实际上向你展示它是做什么的。然后，为了确保你掌握了，你有机会自己尝试练习。每个步骤和练习都经过测试，可以在\
  \ Fedora 或 Red Hat Enterprise Linux 中运行。大部分在 Ubuntu 中同样。\n*   **引入云技术：** Linux 是当今云计算领域大多数技术进步的核心。这意味着你需要对\
  \ Linux 有深入的理解，才能在未来的数据中心高效工作。在书开头学习 Linux 基础。在最后几章中，我将演示如何尝试将 Linux 系统作为虚拟机、云控制器和虚拟机，以及管理虚拟网络和网络存储。\n\
  \n## 本书结构\n\n本书的结构旨在让你从 Linux 的基础开始，成长为一名专业的 Linux 系统管理员和高级用户。\n\n第一部分，“入门”，包含两个章节，帮助你理解\
  \ Linux 是什么并开始使用 Linux 桌面：\n\n*   第 1 章，“从 Linux 开始”，涵盖了诸如 Linux 操作系统是什么、源自何处以及如何开始使用它等主题。\n\
  *   第 2 章，“创建完美的 Linux 桌面”，提供了有关如何创建桌面系统以及使用一些最流行的桌面功能的信息。\n\n第二部分，“成为 Linux 高级用户”，提供了关于如何使用\
  \ Linux shell、处理文件系统、操作文本文件、管理进程以及使用 shell 脚本的深度细节：\n\n*   第 3 章，“使用 Shell”，包含了如何访问\
  \ shell、运行命令、回溯命令（使用 history）以及进行 Tab 补全的信息。该章还描述了如何使用 `variables`（变量）、`aliases`（别名）和\
  \ `man pages`（传统的 Linux 命令参考页）。\n*   第 4 章，“在文件系统中移动”，包含了列出、创建、复制和移动文件及目录的命令。本章中更高级主题包括文件系统安全，如文件所有权、权限和访问控制列表。\n\
  *   第 5 章，“处理文本文件”，包含了从基础文本编辑器到查找文件和在文件中搜索文本的工具的一切内容。\n*   第 6 章，“管理运行进程”，描述了如何查看系统上运行的进程并更改这些进程。更改进程的方法包括杀死、暂停和发送其他类型的信号。\n\
