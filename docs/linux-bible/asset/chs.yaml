  \n用户产品的“安装信息”（Installation Information）是指为了从其 `Corresponding Source` 的修改版本在该用户产品中安装并执行受涵盖作品的修改版本而所需的任何方法、程序、授权密钥或其他信息。这些信息必须足以确保在任何情况下，都不会仅因为进行了修改而阻止或干扰修改后的目标代码的持续运行。\n\
