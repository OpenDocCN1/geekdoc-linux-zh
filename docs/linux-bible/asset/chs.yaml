  \n**Chris Negus** 是红帽认证讲讲师 (RHCI)、红帽认证考官 (RHCX)、红帽认证架构师 (RHCA) 以及红帽公司的首席技术文档工程师。在红帽工作的六多年里，Chris\
  \ 教导了数百名渴望成为红帽认证工程师 (RHCE) 的 IT 专业人员。\n\n在红帽的目前职位上，Chris 为红帽客户门户编写文章。他从事的项目包括红帽企业\
  \ Linux 7、红帽企业 OpenStack 平台、红帽企业虚拟化以及 Docker 格式的 Linux 容器。\n\n除了 RHCA 认证外，Chris\
  \ 还是红帽认证虚拟化管理员 (RHCVA) 和红帽认证数据中心专家 (RHCDS)。他还在部署与系统管理、集群与存储管理、云存储和服务器加固方面拥有专家证书。\n\
  \n在加入红帽之前，Chris 编写或合著了数十本关于 Linux 和 UNIX 的书籍，包括*Red Hat Linux Bible》（所有版本）、*CentOS\
  \ Bible、Fedora Bible、Linux Troubleshooting Bible、Linux Toys* 以及 *Linux Toys II*。Chris\
  \ 还为面向高级用户的 *Linux Toolbox* 系列合著了多几本书，包括：*Fedora Linux Toolbox、SUSE Linux Toolbox、Ubuntu\
  \ Linux Toolbox、Mac OS X Toolbox,* 以及 *BSD UNIX Toolbox*。\n\nChris 在 20 世纪 90 年代初离开犹他州帮助贡献\
  \ Novell 的 UnixWare 项目之前，曾在 AT&T 开发 UNIX 的该组织工作了八年。在不写 Linux 文章时，Chris 喜欢踢足球，并和妻子\
  \ Sheree 以及儿子 Seth 待在一起。\n\n# 关于技术编辑\n\n**Richard Blum, LPIC-1,** 在 IT 行业工作了 20\
  \ 多年，担任系统和网络管理员，并出版了许多关于 Linux 和开源的书。他曾管理过 UNIX、Linux、Novell 和 Microsoft 服务器，并曾协助设计和维护了一个使用\
  \ Cisco 交换机和路由器的 3500 用户网络。他曾使用 Linux 服务器和 shell 脚本执行自动化网络监控，并在大多数常用的 Linux shell\
  \ 环境编写过 shell 脚本。Rich 是美国全美高校所使用的《Linux 简介》课程的在线讲师。当他不当一个电脑宅男时，Rich 在几个不同的教会崇拜乐队中弹奏电贝斯，并喜欢与他的妻子\
  \ Barbara 以及两个女儿 Katie Jane 和 Jessica 一起度时光。\n\n# 致谢\n\n**项目编辑**\nMartin V. Minner\n\
