  \n(此处由于系统生成的重复文本错误，已恢复正常逻辑)\n\n在这个过程中，我在两台物理计算机上安装了 Fedora 21，并将它们配置为运行 `libvirtd`\
  \ 服务的 KVM 主机。按照以下步骤自己完成此操作。\n\n### 第 1 步：获取 Linux 软件\n\n前往 Get Fedora 页面（[`https://getfedora.org`](https://getfedora.org)）并下载\
  \ Fedora 21。我选择下载 Fedora 21 64 位工作站版 DVD ISO。如果有更新版本的 Fedora，你可能可以使用它代替。\n\n使用任何可用的\
  \ DVD 刻录程序将镜像刻录到 DVD，或以其他方式使镜像可用（例如通过 PXE 启动）。\n\n### 第 2 步：检查你的计算机\n\n你在 Fedora\
  \ 21 中用作虚拟机程序的计算机需要满足几项要求。在开始安装之前，你应该检查计算机的这些事项：\n\n*   **支持虚拟化**——你可以通过查看 CPU 设置的标志来检查对虚拟化的支持。\n\
  *   **内存**——计算机必须有足够的 RAM 不仅运行操作系统，还要运行你预计在系统中运行的每个虚拟机。\n*   **处理能力**——记住，每个虚拟机都会自身以及虚拟机内部运行的任何应用程序消耗处理能力。\n\
  \n存储是另一个考虑因素。由于我们打算从网络上的独立节点配置存储，因此我们稍后处理这个问题。\n\n要检查计算机的可用功能是否符合要求，启动 Linux Live\
  \ 光盘或 DVD，打开终端窗口并输入以下命令：\n\n```\n# cat /proc/cpuinfo | grep --color -E \"vmx|svm|lm\"\
  \nflags  : fpu vme de pse tsc msr pae mce cx8 apic sep mtrr pge mca\n   cmov pat\
  \ pse36 clflush dts acpi mmx fxsr sse sse2 ss ht tm pbe\n   syscall nx pdpe1gb rdtscp\
  \ lm constant_tsc arch_perfmon pebs bts\n   rep_good xtopology nonstop_tsc aperfmperf\
  \ pni pclmulqdq dtes64\n   monitor ds_cpl vmx smx es...\n...\n```\n\n上一个命令显示这台计算机是\
  \ 64 位计算机 (`lm`)，且 Intel 芯片支持虚拟化功能 (`vmx`)）。如果 CPU 是 AMD 芯片，看到的不是 `vmx` 而是 `svm`。这些设置显示了这台计算机可以作为虚拟机程序。\n\
  \n当你在宿主机上运行虚拟机时，内存通常是瓶颈。对于内存需求，你必须将宿主机所需的加上每个虚拟机所需的内存。你可以通过不安装桌面软件来降低内存需求。但在这种情况下，我安装了桌面版，大多数虚拟机程序是这样运行的。\n\
  \n一台计算机被配置为在两个虚拟机程序之间提供共享存储。为了简单起见，使用了 NFS 创建共享存储，但在生产环境中，iSCSI 或光纤通道（Fibre Channel）是更好的解决方案。\n\
  \n## 配置虚拟机程序\n\n在这个过程中，我在两台物理计算机上安装了 Fedora 21，并将它们配置为运行 `libvirtd` 服务的 KVM 主机。按照以下步骤自己完成此操作。\n\
  \n### 3 步：在虚拟机程序上安装 Linux\n\n使用 Fedora 21 工作站版安装媒体，开始安装两个虚拟机程序。按照第 9 章中的描述安装 Fedora。你应该了解这些针对本次过程的特定事项：\n\
  \n\n\n\n\n*   **命名虚拟机主机**——我将虚拟机主机上的主机名设置为 `host1.example.com` 和 `host2.example.com`。\n\
  \n*   **分区**——在分区时，我擦除了整个块硬盘。然后，我创建了一个 500MB 的 `/boot` 分区和一个 12GB 的交换分区（swap），并将磁盘的剩余空间分配给根分区（`/`）。`/var/lib/libvirt/images`\
  \ 目录存储了该系统的大部分数据，但这是一个共享目录，可以从网络上的另一个系统访问，并在两个虚拟机主机之间共享。（稍后会详细介绍。）\n\n*   **网络连接**——如果提供了该选项，请为每个虚拟机主机开启有线网络接口。虚拟机主机和存储设备都应该在同一个局域网内，因为这些机器之间的网络连接速度对于获得良好的性能至关重要。\n\
  \n*   **软件包**——在安装期间，我只安装了默认的 Fedora Workstation 软件包。安装完成并重启系统后，我为每个虚拟机主机安装了更多所需的软件。\n\
  \n安装完成后重启电脑（弹出 DVD 并从硬盘启动）。系统重启后，按照如下步骤更新 Fedora 软件、添加新软件包并再次重启：\n\n```\n# yum update\
  \ -y\n# yum install virt-manager libvirt-daemon-config-network\n# reboot\n```\n\n\
  `virt-manager` 软件包包含了用于管理虚拟机的 GUI 工具。`libvirt-daemon-config-network` 软件包创建了默认网络接口，允许虚拟机通过网络地址转换（NAT）（通过宿主机）访问外部网络。分配给虚拟机的默认地址范围是\
  \ `192.168.122.2` 到 `192.168.122.254`。\n\n你需要的其他软件包应该已经包含在 Fedora Workstation 的安装中了。如果你使用了不同的安装类型，请确保也添加了以下软件包：`libvirt-client`（用于\
  \ `virsh` 命令）和 `libvirt-daemon`（用于获取 `libvirtd` 服务）。\n\n### 第 4 步：在虚拟机主机上启动服务\n\n\
  你需要确保 `libvirtd` 服务在两个虚拟机主机上均已运行。同时也一并启动 `sshd` 服务。它们可能已经在运行了，但为了万无一失，请在两个虚拟机主机上以\
  \ root 身份执行以下操作：\n\n```\n# systemctl start sshd.service\n# systemctl enable sshd.service\n\
  # systemctl start libvirtd.service\n# systemctl enable libvirtd.service\n```\n\n\
  `sshd` 服务允许你在必要时通过网络登录虚拟机主机。`libvirtd` 服务则是你可能不太熟悉的那个。它负责监听在每台主机上管理你虚拟机的请求。\n\n\
  ### 第 5 步：编辑 /etc/hosts 或设置 DNS\n\n为了方便虚拟机主机与存储系统之间的通信，你应该为每个系统分配主机名，并将这些名称映射到 IP\
  \ 地址。设置一个所有系统都指向的 DNS 服务器可能是最好的此方法。但是，对于我们的简单示例，你只需要编辑每个系统上的 `/etc/hosts` 文件，并为每个主机添加条目即可。\n\
  \n以下是在本过程中使用的三个系统在 `/etc/hosts` 文件中可能显示的额外条目示例：\n\n```\n192.168.0.138  host1.example.com\
  \ host1\n192.168.0.139  host2.example.com host2\n192.168.0.1    storage.example.com\
  \ storage\n```\n\n接下来，你需要配置存储系统。\n\n### 配置存储\n\n在本过程中，你可以通过多种方式为虚拟机主机提供网络存储。我选择在与虚拟机主机相同的局域网上设置一个独立的\
  \ Fedora 系统，并使用 NFS 将共享存储挂载到两个虚拟机主机上。\n\nNFS 不是在虚拟机主机之间共享存储最高效的方法，但它是最简单、最常用的方法之一。在本过程中，我使用虚拟机管理器窗口（`virt-manager`）来配置\
  \ NFS 存储池。\n\n为了一致性，从存储系统设置的 NFS 共享目录是 `/var/lib/libvirt/images` 目录。它被挂载在每个虚拟机主机的相同位置。（为了测试，如果你只有两台机器可用，可以从其中一个虚拟机主机配置存储。但请记住，这意味着你不能在不关闭所有虚拟机的情况下关闭那台虚拟机主机。）\n\
  \n#### 第 1 步：安装 Linux 软件\n\n若要在 NFS 服务器上设置存储，你可以使用几乎任何提供 NFS 服务的 Linux 系统。在安装 Linux\
  \ 时请考虑以下几点：\n\n*   **磁盘空间**——确保包含共享目录的分区上有足够的可用存储空间。对于此示例，`/var/lib/libvirt/images`\
  \ 是共享目录。\n*   **性能**——为了获得最佳性能，你希望具有快速的访问数据传输速率。对于 Fedora 和 RHEL，NFS 服务器可以使用 `nfs-utils`\
  \ 软件包。对于 Ubuntu，你需要 `nfs-kernel-server`。\n\n安装完成后，检查 NFS 服务器是否已安装。对于 Fedora 或 RHEL，使用以下命令：\n\
  \n```\n# yum install nfs-utils\n```\n\n对于 Ubuntu，执行：\n\n```\n# apt-get install nfs-kernel-server\n\
  ```\n\n#### 第 2 步：配置 NFS 共享\n\n要创建 NFS 共享，你需要识别要共享的目录并将其添加到 `/etc/exports` 文件中。执行以下步骤：\n\
  \n1.  **创建目录**——你可以共享任何目录。对于此示例，我创建一个名为 `/storage` 的目录：\n\n```bash\n# mkdir -p /storage\n\
  ```\n\n2.  **允许导出**——在你的存储系统上，为 `/etc/exports` 文件创建一个条目，向选择系统共享（通过名称或 IP 地址）。对于此示例，我允许\
  \ 192.168.0.* 网段读写（`rw`）：\n\n```\n/storage 192.168.0.*(no_root_squash,sync)\n```\n\
  \n#### 第 3 步：启动 NFS 服务\n\n在存储系统上启动 NFS 服务并打开防火墙以允许该服务。方法如下：\n\n1.  **启动并启用 NFS**——在最新的\
  \ Fedora 和 RHEL 系统上输入以下命令启动 NFS 服务器：\n\n```\n# systemctl start nfs-server.service\n\
  # systemctl enable nfs-server.service\n```\n\n在 RHEL 6、旧版 Fedora 和某些 Ubuntu 系统上，使用这些命令启动并启用\
  \ NFS 服务：\n\n```\n# service nfs start\n# chkconfig nfs on\n```\n\n2.  **打开防火墙**——为了让本地外部可以使用你的\
  \ NFS 共享，在 Fedora 上执行以下操作：\n\n```\n# firewall-cmd --permanent --add-service=rpc-bind\n\
  # firewall-cmd --permanent --add-service=nfs\n# systemctl restart firewalld\n```\n\
  \n对于直接使用 `iptables` 的系统，请参阅[第 20 章]了解如何为 NFS 服务打开防火墙。\n\n#### 第 4 步：在虚拟机主机上挂载 NFS\
  \ 共享\n\n登录到每个虚拟机主机并按照这些步骤使该共享在本地可用。请注意，每个虚拟机主机上的挂载点位置必须相同。方法如下：\n\n1.  **检查 NFS\
  \ 共享可用性**——从两台虚拟机主机中的某一个，输入以下命令确保你可以看到可用共享：\n\n```\n# showmount -e storage.example.com\n\
  Export list for storage.example.com:\n/var/storage 192.168.0.*\n```\n\n2.  **挂载\
  \ NFS 共享**——将共享的信息添加到 `/etc/fstab` 文件中。对于我们的示例，为了在每次系统启动时都将来自 192.168.0.1 系统的目录挂载到相同的目录，`/etc/fstab`\
  \ 文件中的条目如下：\n\n```\nstorage.example.com:/storage /var/lib/libvirt/images nfs defaults\
  \ 0 0\n```\n\n\n\n\n\n### 3. 测试 NFS 挂载。要检查挂载项是否正确，请运行以下命令挂载 `/etc/fstab` 文件中尚未挂载的所有条目，并检查\
  \ NFS 共享是否已挂载：\n\n```\n# mount -a\n# mount | grep libvirt\nstorage.example.com:/var/storage\
  \ on /var/lib/libvirt/images type\nnfs4\n(rw,relatime,vers=4.0,rsize=1048576,wsize=1048576,namlen=255,hard,\n\
  proto=tcp,port=0,timeo=600,retrans=2,sec=sys,\nclientaddr=192.168.0.1,local_lock=none,addr=192.168.0.138)\n\
  ```\n\n现在你的宿主机程序和存储已就绪，你现在开始创建虚拟机了。\n\n### 创建虚拟机\n\n虚拟机管理器（`virt-manager`）是一个创建第一个虚拟机的良好工具。它会引导你完成虚拟机的安装和设置，并提供查看和更改现有虚拟机状态的方法。\n\
  \n稍后，当你理解了创建虚拟机的各种功能后，你可以使用 `virt-install` 命令来代替创建虚拟机。`virt-install` 的优势在于你可以编写脚本或轻松地复制粘贴命令行来创建虚拟机，而无需反复点击\
  \ GUI 窗口。\n\n你已在本章早些时候下载了 Fedora 21 Workstation ISO 镜像，因此我将在示例中使用它来创建虚拟机。不过，如果你愿意，也可以安装许多不同版本的\
  \ Linux 或 Windows 作为你的虚拟机。\n\n#### 第 1 步：获取创建虚拟机的镜像\n\n你可以通过多种方式创建虚拟机。通常情况下，你从预构建的镜像（基本上是运行中的虚拟机的副本）开始，或者直接从安装\
  \ ISO 镜像安装到新的存储区域。在这里，我们将采用后者，从 Fedora 21 Workstation 安装 ISO 镜像创建一个虚拟机。\n\n假设你已以\
  \ root 身份登录到其中一个宿主机程序，并且 ISO 镜像位于当前目录，请将 ISO 复制到 `virt-manager` 用于存储的默认目录（`/var/lib/libvirt/images`）：\n\
  \n```\n# cp Fedora-Live-Workstation-x86_64-21-5.iso /var/lib/libvirt/images/\n```\n\
  \n由于该目录被两个宿主机程序共享，你可以去任意一个宿主机程序使用该镜像。\n\n#### 第 2 步：检查网桥\n\n在每个宿主机程序上，都应该有一个默认网桥名称\
  \ `virbr0`。所有宿主机程序都会添加到此网络接口并自动分配 IP 地址。默认情况下，宿主机程序使用 `192.168.122.2` 到 `192.168.122.254`\
  \ 的地址范围分配给虚拟机。通过网络地址转换（NAT），主机可以使用这些私有地址将虚拟机的数据包路由到外部网络接口。\n\n在每个宿主机程序上执行以下操作以检查网桥：\n\
  \n```\n# brctl show virbr0\nbridge name  bridge id            STP enabled  interfaces\n\
  virbr0      8000.001aa0d7483e    yes           vnet0\n# ip addr show virbr0\n5:\
  \ virbr0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue\n        state\
  \ UP group default\n   link/ether fe:54:00:57:71:67 brd ff:ff:ff:ff:ff:ff\n   inet\
  \ 192.168.122.1 brd 192.168.122.255 scope global dynamic virbr0\n```\n\n#### 第 3\
  \ 步：启动虚拟机管理器 (virt-manager)\n\n在任意一个宿主机程序的桌面上执行以下操作以打开虚拟机管理器并连接到宿主机程序：\n\n1. **启动\
  \ `virt-manager`**。进入活动（Activities）屏幕，在搜索框中输入 **Virtual Machine Manager** 并回车，或在\
  \ shell 中输入 `virt-manager`。按提示输入 root 密码。你应该看到虚拟机管理器窗口。\n\n2. **检查与宿主机程序的连接**。在“添加连接”（Add\
  \ Connection）弹出窗口中，宿主机程序（QEMU/KVM）应该已经设置好且自动连接（Autoconnect）复选框已勾选。如果尚未连接，点击“连接”（Connect）连接到本地宿主机程序。\n\
  \n#### 第 4 步：检查连接细节\n\n连接到宿主机程序后，设置一些连接细节。在虚拟机管理器窗口中执行以下操作：\n\n1. **查看连接细节**。选择编辑\
  \ ![arr](img/arr.jpg) 连接详情（Connection Details）查看连接详情窗口。选择概览（Overview）、虚拟网络（Virtual\
  \ Networks）、存储（Storage）和网络接口（Network Interfaces）选项卡，熟悉你的宿主机程序的连接信息。例如，存储选项卡出现在图\
  \ 26.1 中，显示宿主机程序默认存储位置（`/var/lib/libvirt/images` 目录）有 438.40GB 的可用空间。\n\n2. **检查网桥可用**。选择网络接口选项卡，确保我们刚刚创建的网桥（`bridge0`）在可用网络接口列表中。\n\
  \n![image](img/c26f001.jpg)\n\n**图 26.1** 启动虚拟机管理器并检查连接细节。\n\n#### 第 5 步：创建新虚拟机\n\
  \n要在虚拟机管理器窗口中创建新虚拟机，执行以下操作：\n\n1. **启动向导**。要启动“新建虚拟机”向导，选择文件 ![arr](img/arr.jpg)\
  \ 新虚拟机（New Virtual Machine）。出现“新建虚拟机”窗口。\n\n2. **选择安装方法**。将提供四种创建虚拟机的方法。前三种是识别安装媒体位置的方法。第四种允许你导入现有的磁盘镜像。对于我们的示例，选择第一个选项（本地安装媒体）并点击下一步。\n\
  \n3. **选择 ISO**。点击使用 ISO 镜像（Use ISO Image）按钮并选择浏览（Browse）。在出现的窗口中，选择或浏览到 Fedora\
  \ 21 Workstation ISO，选择选择卷（Choose Volume），并点击下一步继续。\n\n4. **选择内存和 CPU**。为虚拟机选择可用的\
  \ RAM 容量和处理器数量，并点击下一步。我建议至少使用 1024MB RAM 和一个处理器。如果可用，使用 2048MB RAM 更好。\n\n5. **启用存储**。选择你希望虚拟机消耗的磁盘空间。我建议\
  \ Fedora Workstation 至少使用 10GB，但你可能用更。创建的 qcow2 镜像会根据你实际消耗的大小增长（最高到分配量），因此在实际尝试使用该空间之前，过度分配不会产生问题。点击下一步。\n\
  \n6. **在安装开始前检查设置**。为虚拟机命名，并检查安装的其他设置。点击高级选项（Advanced Options），确保选择了 `bridge0` 条目。选择“在安装前自定义配置”（Customize\
  \ Configuration Before Install）以进一步检查设置。目前其他设置保持默认值，并点击完成。\n\n7. **安装虚拟机**。满意后，点击开始安装（Begin\
  \ Installation）。系统会提示安装系统，就像你直接安装到硬件上一样。完成安装并重启虚拟机。如果虚拟机窗口未打开，双击 `virt-manager`\
  \ 窗口中的虚拟机条目（在此例中为 fedora21）并登录。图 26.2\n\n**图 26.2** 打开虚拟机并开始使用。\n\n### 管理虚拟机\n\n\
  在宿主机程序上安装了一个或多个虚拟机后，你可以用与管理直接安装在硬件上的计算机系统相似的方式来管理每个虚拟机。你可以执行这些操作：\n\n\n\n\n\n* \
  \  **从控制台查看系统。** 在 `virt-manager` 窗口中双击正在运行的虚拟机。将打开一个指向虚拟机的控制台窗口，让你像使用物理控制台那样使用虚拟机，以访问直接安装在硬件上的操作系统。\n\
  *   **关闭虚拟机。** 右键点击虚拟机条目，并选择 `Shut down`。然后选择 `Shut down`（正常关机）或 `Force off`（相当于拔掉电源）。或者你也可以选择\
  \ `Reboot`（重启）。\n*   **启动虚拟机。** 如果虚拟机当前处于关闭状态，右键点击条目并选择 `Run` 即可启动虚拟机。\n*   **删除虚拟机。**\
  \ 如果你已完全不再使用该虚拟机，选择 `Delete`。系统会询问你是否也要同时删除存储。如果你想保留与虚拟机关联的存储，请取消勾选该框。\n\n现在你已经熟练练了使用虚拟机，可以尝试将虚拟机迁移到另一个虚拟机程序了。\n\
  \n### 迁移虚拟机\n\n能够在不同的虚拟机程序之间迁移你的虚拟机，可以为你管理计算机工作负载提供极大的灵活性。以下是一些优势：\n\n*   **提高性能**：将虚拟机从负载过高的虚拟机程序移动到具有可用内存和\
  \ CPU 能力的虚拟机程序。\n*   **进行例行维护**：在保持虚拟机运行的同时对虚拟机程序进行维护。\n*   **将虚拟机从利用率不高的虚拟机程序移出**：这样你就可以关闭它们以节省能量，直到再次需要。\n\
  *   **将虚拟机移出站点**：如果你预计关闭数据中心，或者预计飓风或其他灾难袭击你的数据中心。\n\n特别是热迁移，如果你需要虚拟机在不中断的情况下继续工作，那么它非常有价值。实现虚拟机热迁移的关键在于正确配置你的环境。请确保以下条件到位：\n\
  \n*   虚拟机程序之间共享网络化存储\n*   在每个虚拟机程序上配置了相同的网络接口\n*   虚拟机程序之间的 CPU 兼容（通常，一组虚拟机程序具有完全相同的硬件。）\n\
  *   虚拟机程序与存储之间有快速的网络连接\n*   虚拟机程序上运行相同或相似版本的虚拟化软件（在案例中，我们都使用了 `Fedora 21` 并以类似的方式安装。）\n\
  \n在完成所有准备后，热迁移仅需几步即可。\n\n#### 步骤 1：识别其他虚拟机程序\n\n假设虚拟机管理器窗口仍运行在其中一个虚拟机程序上，转到该窗口并执行以下操作以连接另一个虚拟机程序：\n\
  \n1.  **连接到虚拟机程序。** 选择 `File` ![arr](img/arr.jpg) `Add Connection`。会出现 `Add Connection`\
  \ 窗口。\n2.  **添加连接。** 勾选 `Connect to Remote Host` 复选框，选择 `SSH` 作为 `Method`，使用用户名\
  \ `root`，输入另一个虚拟机程序机名（例如 [`host1.example.com`](http://host1.example.com)）。当你点击 `Connect`\
  \ 时，可能会提示输入远程虚拟机程序 `root` 用户的密码以及其他信息。\n\n虚拟机管理器窗口上会出现一个新的虚拟机程序的条目。\n\n#### 步骤 2：将运行中的虚拟机迁移到另一个虚拟机程序\n\
  \n右键点击任何正在运行的虚拟机，并选择 `Migrate`。出现 `Migrate the Virtual Machine` 窗口，如图 26.3\n\n**图\
  \ 26.3** 选择将虚拟机迁移到哪个虚拟机程序。\n\n选择新主机。在我的示例中，虚拟机当前在 `host2` 上运行，因此我想选择 `host1` 作为新主机。等待一段时间虚拟机的内存镜像复制到另一个主机后，虚拟机应该会显示在该主机上运行。\n\
  \n如果由于某种原因，你的迁移失败了（CPU 不兼容或其他问题），你可以随时在一个主机上关闭虚拟机并在另一台主机上重新启动。这样做只需要你的共享存储到位。在第二个主机上，只需运行\
  \ `Create a new virtual machine` 向导，但选择运行现有镜像而不是安装 `ISO`。\n\n我刚才向你展示的虚拟机程序配置可能非常适合你的家庭工作站甚至是小型企业。虽然帮助你开发整个云计算平台超出了本书的范围，但帮助你使用不同的云平台运行你的\
  \ Linux 系统是在我们的职责范围内的。下一章将帮助你实现这一点。\n\n## 总结\n\nLinux 是当今大多数新兴云技术构建的基础。本章描述了基于 Linux\
  \ 和其他开源技术构建云的许多基础组件。然后，通过设置几个虚拟机程序并启动虚拟机，帮助你了解其中一些基础技术。\n\n## 练习\n\n本节中的练习描述了与设置虚拟机程序（KVM\
  \ 宿主机）以及使用它运行虚拟机相关的任务。如果你遇到困难，任务的解决方案在附录 B 中。请记住，附录 B 中显示的解决方案通常是完成任务的多种方法之一。\n\n\
  尽管本章所示的设置虚拟机程序的示例使用了三台物理机器，但这些练习可以在单台物理机器上完成。\n\n1.  检查你的电脑查看其是否支持 KVM 虚拟化。\n2.\
  \  安装 Linux 系统以及用其作为 KVM 宿主机和运行虚拟机管理器所需的包。\n3.  确保 `sshd` 和 `libvirtd` 服务正在运行。\n\
  4.  获取一个与你的虚拟机程序兼容的 Linux 安装 `ISO` 镜像，并将其复制到虚拟机管理器使用的默认目录。\n5.  检查默认网络桥接 `virbr0`\
  \ 当前处于激活状态。\n6.  使用你复制的镜像安装虚拟机。\n7.  确保你可以登录并使用该虚拟机。\n8.  检查你的虚拟机是否可以连接到虚拟机程序之外或其他网络。\n\
  9.  停止虚拟机使其不再运行。\n10. 再次启动虚拟机使其处于运行并可用。\n\n# 第 27 章将 Linux 部署到云端\n\n为了获取一个新的 Linux\
  \ 系统使用，而不是仅仅从物理 DVD 运行标准安装程序，你可以获取云镜像并将其部署到云端。一种方法是获取通用的 Linux 镜像（可引导但未配置的镜像），并根据你的需求提供配置该镜像的信息。另一种方法是前往云提供商，选择一个镜像，点击选项进行配置并启动它。\n\
  \n## 让 Linux 在云端中运行\n\n云平台非常适合快速高效地启动新的虚拟机。它们能够做到这一点，是因为每次当你需要一个新的操作系统实例时，都不需要重新安装。\n\
  \n\n\n\n\n公共云（例如 Amazon EC2 ([`http://aws.amazon.com/ec2`](http://aws.amazon.com/ec2))）提供了不同\
  \ Linux 发行版的实例供你启动和使用。你可以选择经过特定优化的 Linux 实例，例如 Ubuntu、红帽企业 Linux (RHEL) 或 SUSE Linux\
  \ 企业服务器 (SLES)，这些实例已针对特定目的进行了调整。例如，某些实例专门针对高性能处理或内存密集型应用进行了优化。\n\n云实例的内容本质上往往是通用的。预计云用户或云提供商会使用\
  \ `cloud-init` 等服务在镜像中附加更多信息。这些信息分为两大类：元数据（meta-data）和用户数据（user-data）：\n\n*   `meta-data`——元数据包含了镜像启动之前所需的信息。这些数据是镜像之外的内容，通常由云提供商管理。其中某些数据源于存储、内存和处理能力等资源是从资源池调取的，而不是来自你正在安装的物理机器。因此，元数据告诉云提供商在启动实例的早期分配多少此类资源（可能还有其他资源）。\n\
  *   `user-data`——用户数据信息被插入到镜像上存在的操作系统中。这是虚拟机的使用者提供的数据。这可能包括用户账户和密码、配置文件、首次启动时运行的命令、软件仓库的标识，或你可能想在操作系统内部运行或更改的任何内容。\n\
  \n当你在云环境中运行 Linux 实例时，通常会通过基于 Web 的云控制器（如 OpenStack Dashboard 或红帽企业虚拟化管理器）点击复选框并填写表单来输入元数据和用户数据信息。当你通过云控制器配置实例时，这些信息可能不会被识别为元数据和用户数据。\n\
  \n你用于运行 Linux 虚拟机的云可能是公共云、私有云或混合云。你选择的云类型可能取决于你的需求和预算：\n\n*   `Public cloud`（公共云）——Amazon\
  \ EC2 和 Google Compute Engine 是云平台的示例，允许你从 Web 界面启动并使用 Linux 虚拟机。你为实例运行的时间付费。运行服务时使用的内存、存储和虚拟\
  \ CPU 数量也计算在成本内。公共云的优势在于你不需要购买和维护自己的云基础设施。\n*   `Private cloud`（私有云）——通过私有云，你部署自己的计算基础设施（虚拟化程序、控制器、存储、网络配置等）。建立自己的私有云意味着要承担更多的前期成本来拥有和维护基础设施。但它为你提供了对计算资源额外的安全性和控制力。因为你控制了基础设施，你可以在你的\
  \ OpenStack 基础设施中创建用户访问的镜像，并以你自己的方式计算用户对该基础设施的使用。\n*   `Hybrid cloud`（混合云）——许多公司正转向混合云解决方案。混合云允许由中央设施管理多个云平台。例如，Red\
  \ Hat CloudForms 可以在 OpenStack、VMware vSphere 和红帽企业虚拟化平台上部署和管理虚拟机，将不同类型的负载分配到适当的环境。在需求高峰时期，CloudForms\
  \ 还可以引导虚拟机运行在 Amazon EC2 云上。\n\n这些云环境有不同的方式来配置和设置虚拟机。然而，云为虚拟机管理需要提供的功能是相似的。理解这些功能有助于你在配置运行在云中的\
  \ Linux 系统时。\n\n为了更好地感受配置 Linux 云实例，下一节描述了 `cloud-init` 如何工作以配置 Linux 云实例。随后，它将帮助你创建自己的元数据和用户数据文件，并将它们应用到云实例中，以便在云镜像启动时可以使用这些信息。\n\
  \n## 为云创建 Linux 镜像\n\n回想你在 第 9 章 中安装 Linux 系统时做了什么。在手动安装过程中，你设置了根密码，创建了普通用户账户和密码，可能定义了网络接口，并执行了其他任务。你输入的信息成为了操作系统的永久部分，在每次启动系统时都会存在。\n\
  \n当你从预构建的云镜像开始使用 Linux 系统时，你可以使用 `cloud-init` 让 Linux 系统准备就绪运行。`cloud-init` 设施 ([`http://launchpad.net/cloud-init`](http://launchpad.net/cloud-init))\
  \ 设置一个通用的虚拟机实例，以你想要的方式运行，而无需经过安装过程。下一节描述了使用 `cloud-init` 的一些方法。\n\n### 配置并运行 cloud-init\
  \ 云实例\n\n在接下来的步骤，我将向你展示如何手动创建可以与可启动的 Linux 云镜像结合的数据，这样当该镜像启动时，它将根据你的数据进行配置。在运行时将数据与镜像结合，允许你在每次运行镜像之前更改数据，而不是将其永久地安装在镜像中。\n\
  \n我建议你在 第 26 章 中配置的某个虚拟化程序上运行此步骤。这不仅允许你为你的 Linux 云镜像创建自定义数据，还让你能够在该虚拟化程序上作为虚拟机运行该镜像。\n\
  \n要添加数据并运行现有的云镜像，此步骤要求你获取云镜像、创建数据文件并生成一个结合这些元素的新镜像。此步骤旨在非常简单地让云镜像启动。之后，我会告诉你如何向这些数据文件添加更多功能。要配置并运行云镜像，请遵循以下步骤：\n\
  \n1.  **创建 cloud-init 元数据文件。** 创建名为 `meta-data` 的文件，用于存储从外部识别云实例信息的数据。例如，你可以添加一个名称来识别实例\
  \ (`instance-id`)、一个主机名 (`local-hostname`) 以及其他信息。为了第一次尝试尽可能简单，我只分配两个字段（将它们设置为你喜欢的任何名称）：\n\
  \n    ```\n    instance-id: FedoraWS01\n    local-hostname: fedora01\n    ```\n\n\
  2.  **创建 cloud-init 用户数据文件。** 创建名为 `user-data` 的文件，用于存储配置镜像本身操作系统内部的数据。在这个简单的案例中，我仅为默认用户\
  \ (fedora) 设置密码为 `cloudpass`，并设置 `cloud-init` 不过期：\n\n    ```\n    #cloud-config\n\
  \    password: cloudpass\n    chpasswd: {expire: False}\n    ```\n\n3.  **将数据合并到单独的镜像。**\
  \ 使用当前目录下的 `meta-data` 和 `user-data` 文件，创建一个包含这些数据的 ISO 镜像。稍后我们将此镜像作为 CD-ROM 呈现给\
  \ Linux 镜像，这样 `cloud-init` 就知道如何配置 Linux 镜像。（如果尚未安装，请先安装 `genisoimage` 包。）\n\n \
  \   ```\n    # yum install genisoimage\n    # genisoimage -output fedora21-data.iso\
  \ -volid cidata \\\n          -joliet -rock user-data meta-data\n    ```\n\n4. \
  \ **获取基础云镜像。** Ubuntu、Fedora 和 RHEL 的云镜像已配置好供 `cloud-init` 使用。获取官方的 Fedora 云镜像（其他发行版的镜像将在稍后描述），并执行以下操作：\n\
  \n    *   **访问** [`getfedora.org`](http://getfedora.org)。打开网络浏览器，并访问 [`https://getfedora.org/en/cloud/download/`](https://getfedora.org/en/cloud/download/)。\n\
  \n\n\n\n\n-   **点击 OpenStack。** 点击“General Purpose”（通用目的）下的“Are you an OpenStack\
  \ user”链接，并点击出现的“Download”（下载）按钮以获取可用于 OpenStack 环境的 `qcow2` 镜像。镜像名称类似于：`Fedora-Cloud-Base-20141203-21.x86_64.qcow2`。\n\
  \n5. **对镜像进行快照。** 在获得所需的镜像之前，你可能需要多次此此。因此，不要直接使用下载的镜像，而是对它创建一个快照。为了跟踪版本，我在新的快照名称中添加了\
  \ `01`：\n\n```bash\n# qemu-img create -f qcow2 \\\n   -o backing_file=Fedora-Cloud-Base-20141203-21.x86_64.qcow2\
  \ \\\n   Fedora-Cloud-Base-01.qcow2\n```\n\n6. **将文件复制到镜像目录。** 在宿主机（`libvirtd` 服务）上使用镜像时，将镜像拷贝到\
  \ `/var/lib/libvirt/images/` 目录是一个良好的习惯。例如，将云镜像和数据镜像拷贝到该目录，输入以下：\n\n```bash\n# cp\
  \ Fedora-Cloud-Base-20141203-21.x86_64.qcow2 \\\n    Fedora-Cloud-Base-01.qcow2\
  \ \\\n    fedora21-data.iso          \\\n    /var/lib/libvirt/images/\n```\n\n7.\
  \ **启动云实例。** 文件准备就绪后，运行以下命令启动你的云镜像实例：\n\n```bash\n# cd /var/lib/libvirt/images\n\
  # virt-install --import --name fedora21-01 --ram 4096 --vcpus 2 \\\n  --disk path=Fedora-Cloud-Base-01.qcow2,format=qcow2,bus=virtio\
  \ \\\n  --disk path=fedora21-data.iso,device=cdrom \\\n  --network bridge=virbr0\
  \ &\n```\n\n上一个 `virt-install` 示例显示虚拟机被分配了 4GB 内存（`--ram 4096`）和两个虚拟 CPU（`--vcpus\
  \ 2`）。根据你计算机的资源，系统的内存和 VCPU 值可能会不同。\n\n此时，你的宿主机上运行着一个名为 `fedora21-01` 的虚拟机。随着虚拟机的启动，将会打开控制台窗口允许你登录新的云虚拟机。\n\
  \n### 调查云实例\n\n为了研究我们创建的云镜像，你可以打开运行中的实例并查看其内部。如果它尚未打开，一种方法是使用 `virt-viewer` 打开虚拟机：\n\
  \n```bash\n# virt-viewer fedora21-01\n```\n\n从弹出的控制台窗口中，使用我们添加到镜像中的数据进行登录。使用 `fedora`\
  \ 作为用户，使用 `cloudpass` 作为密码登录。`fedora` 用户具有 `sudo` 权限，因此你可以使用该账户通过输入一些命令来调查实例：在这里，你可以看到\
  \ `user-data` 是如何复制到实例中的：\n\n```bash\n$ sudo cat /var/lib/cloud/instances/FedoraWS01/user-data\n\
  #cloud-config\npassword: cloudpass\nchpasswd: {expire: False}\n```\n\n基础云配置在 `/etc/cloud/cfg`\
  \ 文件中完成。你可以看到 root 账户默认是被禁用的。在文件底部，你可以看到名为 `fedora` 的用户是默认用户，并且具有不需要密码的 `sudo` 权限。\n\
  \n```yaml\n$ sudo cat /etc/cloud/cfg\nusers:\n - default\ndisable_root: 1...\nsystem_info:\n\
  \  default_user:\n    name: fedora\n    lock_paswd: true\n    groups: [wheel, systemd-journal]\n\
  \    sudo: [\"ALL) NOPWD:ALL\"]\n    shell: /bin/bash\n  distro: fedora\n  paths:\n\
  \    cloud_dir: /var/lib/cloud\n    templates_dir: /etc/cloud/templates\n  ssh_svcname:\
  \ sshd\n```\n\n你也可以在 `cloud.cfg` 文件中看到其他内容。你可以看到哪些 `cloud-init_modules` 在初始化期间运行（例如设置主机名或启动\
  \ `rsyslog` 的模块）。你可以看到 `cloud-config_modules`，它们设置本地区域、设置时区并运行进一步的配置工具（例如 `chef`\
  \ 和 `puppet`）。由于启用了 `yum` 仓库，只要你有网络连接（DHCP 默认应为虚拟机分配地址），你就可以从 Fedora 仓库中安装任何包。\n\
  \n### 克隆云实例\n\n如果你喜欢你创建的云实例，可以通过克隆组成云实例的两个镜像（云镜像和数据镜像）来保存其副本以供以后运行。要使用 `virt-manager`\
  \ 克隆运行中的云实例，请执行以下操作：\n\n1. **启动 virt-manager。** 在运行虚拟机的主机系统上，运行 `virt-manager` 命令，或从桌面的“活动”（Activities）屏幕启动“虚拟机管理器”。\n\
  2. **暂停虚拟机。** 在 `virt-manager` 窗口中右键点击虚拟机项，并选择“Pause”（暂停）。这将使虚拟机暂时变为活动状态。\n3. **克隆虚拟机。**再次右键点击虚拟机项，并选择“Clone”（克隆）。出现“克隆虚拟机”窗口，如图\
  \ 27.1\n\n图 27.1 允许你保存一个云实例的永久副本。克隆的云实例现在可以从“虚拟机管理器”窗口或 `virsh` 命令根据你的意愿进行启动、停止或其他管理。\n\
  \n### 尝试 Ubuntu 云镜像\n\n任何启用了 `cloud-init` 的 Linux 镜像都可以像刚才所示的 Fedora 那样进行配置。以下是一个如何在本地\
  \ Linux 宿主机无云供应商的情况下运行 Ubuntu 云镜像的示例：\n\n1. **下载 Ubuntu tar 包。** 前往 Ubuntu 网站，选择你需要的版本和特定镜像。我从以下网站下载了\
  \ `ubuntu-14.10-server-cloudimg-amd64.tar.gz` 云 tar 包：\n\n```\nhttp://cloud-images.ubuntu.com/releases/\n\
  ```\n\n2. **解压云 tar 包。** 我输入以下命令从 tar 包中提取文件：\n\n```bash\n# tar xvf ubuntu-14.10-server-cloudimg-amd64.tar.gz\n\
  ```\n\n3. **将数据合并到单独的镜像中。** 从用于 Fedora 的相同的 `meta-data` 和 `user-data` 文件开始。将 `meta-data`\
  \ 的名称改为 `ubuntu` 而不是 `fedora`。默认用户不同（`ubuntu`），但你可以以相同的方式分配密码。运行此命令创建数据镜像：\n\n```bash\n\
  # genisoimage -output ubuntu-data.iso -volid cidata \\\n      -joliet -rock user-data\
  \ meta-data\n```\n\n4. **对镜像进行快照。** 如下所示对镜像进行快照：\n\n```bash\n# qemu-img create -f\
  \ qcow2 \\\n   -o backing_file=utopic-server-cloudimg-amd64.img \\\n   utopic-server-01.img\n\
  ```\n\n5. **复制镜像文件。** 将 Ubuntu 镜像文件拷贝到相应的目录。为了运行 Ubuntu 镜像文件，你需要添加软盘镜像使云实例可启动：\n\
  \n```bash\n# cp ubuntu-data.iso      \\\n     utopic-server-cloudimg-amd64-floppy\
  \  \\\n     utopic-server-cloudimg-amd64.img /var/lib/libvirt/images/\n```\n\n6.\
  \ **启动云实例。** 要启动 Ubuntu 云实例，运行以下命令：\n\n```bash\n# cd /var/lib/libvirt/images\n#\
  \ virt-install --import --name ubuntu1410-01 --ram 4096 --vcpus 2 \\\n  --disk path=utopic-server-cloudimg-amd64-floppy,device=floppy\
  \ \\\n  --disk path=utopic-server-cloudimg-amd64.img,format=raw,bus=virtio \\\n\
  \  --disk path=ubuntu-data.iso,device=cdrom --network bridge=virbr0 &\n```\n\n此时，你运行着一个基础的\
  \ Ubuntu 云实例。使用用户 `ubuntu` 和 `user-data` 文件中定义的密码登录。\n\n### 扩展你的 cloud-init 配置\n\
  \n\n\n\n你可以向元数据（meta-data）和用户数据（user-data）文件添加更多信息来配置你的云实例。`cloud-init` 设置示例可以在\
  \ Cloud-Init 配置示例页面（[`cloudinit.readthedocs.org/en/latest/topics/examples.html``](http://cloudinit.readthedocs.org/en/latest/topics/examples.html)）找到。以下章节展示了你可以添加到\
  \ user-data 文件中的设置示例。\n\n## 使用 cloud-init 添加 ssh 密钥\n\n与其使用密码登录云实例，不如你可以使用基于密钥的身份验证并配合\
  \ `ssh` 命令通过网络登录。这通常由云提供商使用，以允许用户访问云镜像。\n\n如果你已经为计划用于 `ssh` 登录到云实例的用户账户生成了公钥和私钥\
  \ `ssh` 密钥，那么你可以在此过程中使用该公钥。如果你生成了 RSA 密钥对，该公钥默认位于 `id_rsa.pub` 文件中：\n\n```\n# cat\
  \ $HOME/.ssh/id_rsa.pub\nssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDMzdq6hqDUhueWzl7rIUwjxB/rrJY4o\n\
  ZpoWINzeGVf6m8wXlHmmqd9C7LtnZg2P24/ZBb3S1j7vK2WymOcwEoWekhbZHBAyYeqXK\nYQQjUB2E2Mr6qMkmrjQBx6ypxbz+VwADNCwegY5RCUoNjrN43GVu6nSOxhFf7hv6dtCjv\n\
  osOvtt0979YS3UcEyrobpNzreGSJ8FMPMRFMWWg68Jz5hOMCIE1IldhpODvQVbTNsn/ST\nxO7ZwSYV6kfDj0szvdoDDCyh8mPNC1kIDhf/qu/Zn1kxQ9xfecQ+SUi+2IwN69o1fNpex\n\
  JPFr+Bwjkwcrk58C6uowG5eNSgnuu7GMUkT root@host2.example.com\n```\n\n该文件中的公钥通常会被复制到你想登录的远程系统用户的\
  \ `$HOME/.ssh/authorized_keys` 文件中。我们可以通过 user-data 文件中的如下条目，将密钥添加到云实例的该文件中：\n\n\
  ```\nusers:\n  - default\n  - name: wsmith\n    gecos: William B. Smith\n    primary-group:\
  \ wsmith\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    lock-passwd: true\n    ssh-authorized-keys:\n\
  \      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDMzdq6hqDUhueWzl7rIUwjx\nB/rrJY4oZpoWINzeGVf6m8wXlHmmqd9C7LtnZg2P24/ZBb3S1j7vK2WymOcwEoWekhbZH\n\
  BAyYeqXKYQQjUB2E2Mr6qMkmrjQBx6ypxbz+VwADNCwegY5RCUoNjrN43GVu6nSOxhFf7\nhv6dtCjvosOvtt0979YS3UcEyrobpNzreGSJ8FMPMRFMWWg68Jz5hOMCIE1IldhpODvQV\n\
  bTNsn/STxO7ZwSYV6kfDj0szvdoDDCyh8mPNC1kIDhf/qu/Zn1kxQ9xfecQ+SUi+2IwN6\n9o1fNpexJPFr+Bwjkwcrk58C6uowG5eNSgnuu7GMUkT\
  \ root@host2.example.com\n```\n\n根据前面的信息，可以看到 `wsmith` 是默认用户。gecos 条目通常是用户的全名，用于\
  \ `/etc/passwd` 文件的第五字段。该用户的密码已锁定。然而，由于我将 [`host2.example.com`](http://host2.example.com)\
  \ 上 root 账户的 `ssh-rsa` 条目作为用户的 `ssh-authorized-keys` 提供在此处，我可以通过 `ssh` 以 `wsmith`\
  \ 身份登录云实例而无需输入密码（只要我的私钥与该公钥关联）。\n\n## 使用 cloud-init 添加网络接口\n\n如果你希望在启动过程的早期在云实例上配置网络接口，你可以在这些云实例的元数据文件中添加\
  \ `network-interfaces` 条目。以下是一个示例：\n\n```\nnetwork-interfaces: |\n  iface eth0 inet\
  \ static\n  address 192.168.100.50\n  network 192.168.100.0\n  netmask 255.255.255.0\n\
  \  broadcast 192.168.1.255\n  gateway 192.168.100.1\nbootcmd:\n  - ifdown eth0\n\
  \  - ifup eth0\n```\n\n此处显示的 `network-interfaces` 值标识云实例内的 `eth0` 接口包含静态地址（换句话说，不是来自\
  \ DHCP）。接口的 IP 地址设置为 `192.168.100.50`，而路由数据包到世界的网关被设置为 `192.168.100.1`。为了在新地址上启动该接口，`bootcmd`\
  \ 被设置为关闭接口（`ifdown eth0`）然后启用接口（`ifup eth0`）。\n\n## 使用 cloud-init 添加软件\n\n你并不限于云镜像中已有的的软件。在你的\
  \ user-data 文件中，你可以定义 `yum` 仓库（在 Fedora 和 RHEL 中）或 `apt` 仓库（在 Ubuntu 或 Debian 中），然后指定任何希望在云实例启动时安装的包。\n\
  \n以下示例展示了 user-data 文件中的条目可能如下所示，用于向你的云实例添加 `yum` 仓库（针对 Fedora 或 RHEL），然后从该仓库或任何其他启用的仓库安装包：\n\
  \n```\nmyownrepo:\n    baseurl: http://myrepo.example.com/pub/myrepo/\n    enabled:\
  \ true\n    gpgcheck: true\n    gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-MY\n\
  ```\n\n\n\n\n至于元数据（meta-data）和用户数据（user-data），可以开发更复杂的配置方案来部署你的云实例。`Cloud-init`\
  \ 支持配置工具，例如 Puppet ([`puppetlabs.com/puppet/puppet-open-source``](http://puppetlabs.com/puppet/puppet-open-source))\
  \ 和 Chef ([`www.chef.io/chef/`](https://www.chef.io/chef/))。这些工具让你可以将配置信息脚本应用到你的云实例，甚至可以根据需要替换组件或重启服务，以将系统恢复到所需的状态。\n\
  \n然而，此时我的任务并不是让你成为一个完全的云管理员（几百页之前，你可能还只是个 Linux 初学者）。相反，我想让你了解如果你最终进入云数据中心，你将面对什么……因为许多人相信，在不遥远的将来，大多数数据中心将作为云基础设施进行管理。\n\
  \n到本章为止，你已经了解了为云计算配置 Linux 的内部细节工作。接下来，让我们退一步，看看如何使用两个最流行的基于 Linux 的云平台来运行自己的 Linux\
  \ 虚拟机：OpenStack 和 Amazon EC2。\n\n## 使用 OpenStack 部署云镜像\n\n根据大多数说法，OpenStack 是当今最热门的开源项目。通过\
  \ OpenStack，你可以获得一个不断发展的平台来管理你的物理云计算基础设施以及运行在上面的虚拟系统。OpenStack 让你部署自己的私有云，或将其作为公有云提供给世界。\n\
  \n与其让你自己搭建 OpenStack 云，我将向你展示如何使用 OpenStack Dashboard 部署虚拟机。如果你想亲自尝试，可以通过以下方式获取\
  \ OpenStack：\n\n* **Linux 发行版**——Fedora、Ubuntu 和 CentOS 都有免费的 OpenStack 版本供你自己部署。红帽企业\
  \ Linux（Red Hat Enterprise Linux）提供了通过订阅提供的 OpenStack 版本。它设置起来比较复杂。某些 OpenStack\
  \ 的一体化设置可以在单机上运行，但我认为如果你从三台物理机器开始：一个控制器节点和两个虚拟机监控程序（hypervisors），会有更好的体验。\n* **公有\
  \ OpenStack 云**——你可以尝试不同成本的公有 OpenStack 云。OpenStack 项目网站提供了公共 OpenStack 云列表 ([`www.openstack.org/marketplace/public-clouds/``](http://www.openstack.org/marketplace/public-clouds/))。\n\
  \n我的第一点是帮助你在没有能力在自己的计算机上完成你想的操作时，在云中运行 Linux 系统。然而，我的另一个目的是向你展示云提供商的基于 Web 界面（如\
  \ OpenStack Dashboard）如何极大简化在本章之前通过 `cloud-init` 手动完成的云配置。\n\n### 从 OpenStack Dashboard\
  \ 开始\n\n我将从一个已经就绪的 OpenStack 设置开始。OpenStack 环境的管理员为我创建了一个名为 `cnegus-test-project`\
  \ 的项目和一个允许我访问该项目的用户账户（`cnegus`）。以下是我计划要做的操作：\n\n* **配置网络**——就像我要设置路由器并将我的计算机物理地插入该路由器一样，我将设置一个虚拟网络。该虚拟网络将包含一组地址，通过\
  \ DHCP 分发到我的虚拟机上。\n* **配置虚拟机**——我将逐步演示选择、配置和部署几台虚拟机的过程。\n\n本演示使用的 OpenStack 版本是红帽企业\
  \ Linux OpenStack 平台（RHEL-OSP）。然而，在任何 OpenStack 环境中的体验都是类似的。下一节将向你展示如何开始配置网络。\n\n\
  #### 配置你的 OpenStack 虚拟网络\n\n1. **登录 OpenStack。** 使用 OpenStack 管理员分配给你的用户名和密码，从网页浏览器登录\
  \ OpenStack Dashboard。你应该能看到一个概述（Overview）屏幕，类似于图 27.2 所示所示。\n2. **创建网络。** 要创建网络，从概述页左侧列选择\
  \ Networks（网络）。在出现的 Networks 屏幕上，按如下创建新网络（我使用的示例在括号中）：\n    1. **选择 Create Network（创建网络）按钮。**\n\
  \    2. **在 Network 标签页上输入网络名称（`mynet`）。**\n    3. **在 Subnet 标签页输入子网名称（`mysub01`）、网络地址（`192.168.100.0/24`）、IP\
  \ 版本（`IPv4`）和网关 IP（`192.168.100.1`），并取消勾选 Disable Gateway（禁用网关）。**\n    4. **在 Subnet\
  \ Detail 标签页的 Allocation Pool 箱中输入逗号分隔的 IP 地址范围。** 在我的示例中，我选择了 `192.168.100.10,192.168.100.50`，向客户端分配从\
  \ 192.168.100.10 到 192.168.100.50 的 IP 地址范围。从你的 OpenStack 云管理员处获取 DNS 服务器建议，或使用公共\
  \ DNS 服务器（如 Google 的 8.8.8.8 或 8.8.4.4）。\n    5. **选择 Create 创建新网络。** 新网络出现在 Networks\
  \ 屏幕上。\n3. **创建路由器。** 为了让你的虚拟机能够访问互联网，你需要一个连接到私有网络并可以到达公网的路由器。操作步骤如下：\n    1. **从左侧列选择\
  \ Routers（路由器）。**\n    2. **点击 Create（创建）按钮。**\n    3. **输入路由器名称（`myrouter1`），并创建路由器。**\n\
  \    4. **选择 Set Gateway（设置网关）。**\n    5. **在 Set Gateway 屏幕上，点击 External Network（外部网络）框并选择可用的外部网络。**\
  \ 保持 Router Name 和 Router ID 不变。点击 Set Gateway。新路由器出现在 Routers 屏幕。\n4. **将你的网络连接到路由器。**\
  \ 从 Routers 屏幕（你仍在该屏幕上），选择你刚刚创建的路由器名称（`myrouter`）：\n    1. **从 Router Details 屏幕选择\
  \ Add Interface（添加接口）按钮。**\n    2. **在 Add Interface 屏幕上，点击 Subnet 箱并选择你之前创建的子网（`mynet:\
  \ 192.168.100.0/24 mysub01`）。** 你不需要更改 Router Name 或 Router ID。\n    3. **点击 Add\
  \ Interface。**\n5. **查看网络拓扑。** 从左侧列点击 Network Topology。然后将鼠标指针悬停在路由器名称（`myroute01`）上。图\
  \ 27.3 展示了你的网络配置的一个示例。\n\n![image](img/c27f002.jpg)\n\n图 27.2 登录 OpenStack Dashboard。\n\
  \n![image](img/c27f003.jpg)\n\n图 27.3 从 OpenStack Dashboard 查看网络拓扑。\n\n配置好网络后，你可以创建密钥来访问虚拟机。\n\
  \n#### 配置远程访问的密钥\n\n在云环境中，配置虚拟机访问的标准方法是创建一个公私密钥对，以便从你的桌面系统使用 `ssh` 相关工具对虚拟机进行安全访问。私钥存储在桌面用户的家目录下，公钥被注入到虚拟机中，这样你无需密码即可远程（通过\
  \ `ssh`）登录虚拟机。以下是设置密钥的方法：\n\n1. **选择 Access & Security。** 从左侧列选择 Access & Security。\n\
  2. **创建密钥对。** 如果你已经有了密钥对，可以跳到下一步。如果没有，选择 Keypairs 标签并点击 Create Keypair（创建密钥对）按钮。当\
  \ Create Keypair 窗口出现时，执行以下操作：\n\n\n\n\n\n1. 输入密钥对名称（`mycloudkey`），并点击创建密钥对（Create\
  \ Keypair）按钮。弹出的窗口会询问你是要打开还是保存 `*.pem` 文件。\n2. 选择保存文件（Save File），并点击确定（OK）。提示保存位置时，将其保存到主目录下的\
  \ `.ssh` 目录。\n\n你现在已准备好部署 OpenStack 实例（云云虚拟机）。\n\n## 在 OpenStack 中启动虚拟机\n\n要开始启动新的云虚拟机实例，转到左列并选择\
  \ `Instances`（实例）。然后点击启动实例（Launch instance）按钮。将出现启动实例界面。要填写启动实例所需的信息，请按照以下步骤操作：\n\
  \n1. **选择详情（Select Details）。** 在详情（Details）选项卡中，选择以下项目：\n\n    * **可用区（Availability\
  \ Zone）**——可用性区域由一组计算主机组成。有时会创建单独的区域来识别物理上在一起（例如在同一机架上）或具有相同硬件特征的计算机组（这样可以用于相同类型的应用程序）。从列表中选择一个区域。\n\
  \    * **实例名称（Instance Name）**——为实例命名任何有助于你记住它用途的名字。\n    * **规格（Flavor）**——通过选择规格，你为你的虚拟机实例分配一组资源。这些资源包括虚拟\
  \ CPU 核心数、可用内存量、分配的磁盘空间以及可用的临时磁盘空间。（临时空间是实例运行时从本地磁盘可用的空间，但在实例关闭时不会保存。）默认规格包括 `m1.tiny`、`m1.small`、`m1.medium`、`m1.large`\
  \ 和 `m1.xlarge`。云管理员可以添加其他规格。\n    * **实例数量（Instance Count）**——默认设置为 1，即启动一个实例。如果你需要，可以更改数字以启动更多实例。\n\
  \    * **实例启动源（Instance Boot Source）**——实例可以从镜像、快照、卷、包含新卷的镜像或包含新卷的卷快照启动。\n    *\
  \ **镜像名称（Image Name）**——选择你想要启动的镜像。名称通常包含你正在启动的操作系统名称。\n    * **设备大小和设备名称（可选）（Device\
  \ size and Device Name (optional)）**——如果你在选择实例启动源时选择了包含新卷，你可以在这些字段中设置该卷的尺寸（GB）和设备名称。对于设备名称，如果你选择\
  \ `vda` 作为设备名称（用于虚拟机上的第一个磁盘），则代表该设备的设备将是 `/dev/vda`。\n\n2. **选择访问与安全（Select Access\
  \ & Security）。** 选择访问与安全选项卡，并选择你之前创建的密钥对。\n3. **选择网络（Select Networking）。** 选择网络选项卡。从可用网络列表中，用鼠标选中你需要的网络并将其拖入已选网络（Selected\
  \ Networks）框中。\n4. **添加创建后设置（Add Post-Creation settings）。** 你可以添加在系统启动后进一步配置系统的命令和脚本。这里你可以添加在在本章之前关于\
  \ `cloud-init` 部分中描述的 user-data 文件中所添加的信息。\n\n选择启动（Launch）以启动虚拟机。虚拟机运行时，你可以通过选择实例并点击控制台（Console）选项卡来登录该系统。虚拟机的控制台窗口应向你显示登录提示。如果你希望通过网络使用\
  \ `ssh` 访问虚拟机，请继续下一节。\n\n## 通过 ssh 访问虚拟机\n\n一旦你的公钥注入到正在运行的虚拟机中，它就准备好让你使用 `ssh` 登录了。然而，在此之前你必须执行以下步骤：\n\
  \n1. **添加浮动 IP 地址（Add a floating IP address）。** 从 OpenStack 板中，从左列选择实例，点击包含实例的条目上的\
  \ More，然后点击关联浮动 IP（Associate Floating IP）。选择 IP 地址框旁的加号 (+)，选择具有可用浮动 IP 的池（Pool），并点击分配\
  \ IP（Allocate IP）。分配的地址应出现在 IP 地址字段中。选择要关联的端口（Port），并点击关联（Associate）。\n2. **使用 ssh\
  \ 访问实例（Use ssh to access the instance）。** 从可以访问分配浮动地址网络的 Linux 系统上运行 `ssh` 命令进行登录。假设你的密钥\
  \ `.pem` 文件名为 `mycloud.pem`，实例上的默认用户是 cloud-user，且 IP 地址为 10.10.10.100，你可以输入以下内容进行登录：\n\
  \n```\n# ssh -i mycloud.pem cloud-user@10.10.10.100\n```\n\n你现在应该不需要密码即可登录。要对系统进行管理管理，你可以作为默认用户使用\
  \ `sudo` 命令。\n\n## 使用 Amazon EC2 部署云镜像\n\nAmazon Elastic Compute Cloud (Amazon EC2)\
  \ 是一个特别适用于按需付费云计算的云平台。与 OpenStack 类似，它允许你从预配置的虚拟机镜像中选择并根据需要进行配置。\n\n要开始使用 Amazon\
  \ EC2 启动虚拟机，请访问 Amazon Web Services 入门页面并按照链接创建新账户（[`aws.amazon.com/getting-started/`](http://aws.amazon.com/getting-started/)）。登录后，系统将显示全系列\
  \ AWS 服务。选择 EC2，你将看到 EC2 管理控制台，如图 27.4](#c27.xhtml_c27-fig-0004）所示。\n\n![image](img/c27f004.jpg)\n\
  \n图 27.4 使用 Amazon EC2 管理控制台启动云实例。\n\n要启动第一个实例，点击启动实例（Launch Instance）按钮。随后你将获得\
  \ Linux（红帽企业 Linux、SUSE Linux、Ubuntu 等）和 Windows 镜像的选择。向导将引导你选择不同的实例类型（通用型或优化型），并让你配置实例详情、添加存储、标记实例以及配置安全。\n\
  \n虚拟机配置好后，你可以直接从控制台窗口与虚拟机交互，或者使用 `ssh` 和公/私钥对通过网络进行登录。在任何时候，你都可以返回 EC2 管理控制台以跟踪你正在消耗的资源并监控虚拟机的健康状况。\n\
  \n## 总结\n\n理解云计算与直接在计算机硬件上安装操作系统的区别，将帮助你在越来越多的数据中心向云计算迁移时做出适应。在本章的开始时，我鼓励你尝试上手云镜像，将它们与数据结合，并在本地虚拟化程序上启动它们，以理解云镜像是如何工作的。\n\
  \n之后，我演示了如何在 OpenStack 云平台上启动你自己的云镜像。这包括配置网络接口、选择实例运行方式以及启动云镜像。我还快速介绍了 Amazon 云服务，如果你没有自己的计算资源，可以在那里付费使用云存储和处理时间。\n\
  \n本章没有练习，因为我打算让它作为超出本书范围的内容。我希望在你掌握基础 Linux 技能并准备好将这些技能扩展到云端后，发现这些材料是有用的。\n\n# 第七部分\n\
  \n附录\n\n# 附录 A 媒体\n\n除非你购买了预装 Linux 的计算机或有人为你安装了 Linux，否则你需要一种方法获取 Linux 发行版，然后在你的计算机上安装或现场运行。在本录中，你将学习如何：\n\
  \n* 获取几个不同的 Linux 发行版\n* 创建用于安装发行版的启动盘\n* 从 USB 驱动器启动 Linux\n\n为了有效使用本书，你面前应该有一个\
  \ Linux 发行版可以操作。在阅读时能够体验 Linux 是重要的。因此，请尝试示例并完成练习。\n\n\n\n\nLinux 发行版通常可以从其制作组织的网站获取。以下章节描述了与\
