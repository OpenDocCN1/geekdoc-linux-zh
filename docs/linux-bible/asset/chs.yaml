  \n### 7. 附加条款\n\n“额外许可”（Additional permissions）是指通过对本许可的一项或多个条件进行例外处理来补充本许可条款的条款。适用于整个程序的额外许可，在适用法律下有效的范围内，应被视为已包含在本许可中。如果额外许可仅适用于程序的部分，则该部分可以根据这些许可被单独使用，但整个程序仍继续受本许可的约束，而不受额外许可的影响。\n\
  \n当您传输受涵盖作品的副本时，您可以根据意愿从该副本或其任何部分移除任何额外许可。（在您修改作品的某些情况下，额外许可可能被写明要求自身的删除。）您可以在您添加到受涵盖作品的材料上放置额外许可，前提是您拥有或可以提供适当的版权许可。\n\
