  \ 系统管理员”，你将学习如何管理 Linux 系统：\n\n*   第 8 章，“学习系统管理”，提供了管理 Linux 系统的基础图形化工具、命令和配置文件。\n\
  *   第 9 章，“安装 Linux”，涵盖了常见的安装任务，如磁盘分区和初始软件包选择，以及更多的安装工具，例如从 kickstart 文件安装。\n* \
  \  第 10 章，“获取和管理软件”，提供了对软件包如何工作以及如何获取和管理软件包的理解。\n*   第 11 章，“管理用户账户”，讨论了添加和删除用户及组的工具，以及如何集中用户账户管理。\n\
  *   第 12 章，“管理磁盘和文件系统”，提供了添加分区、创建文件系统和挂载文件系统的信息，以及与逻辑卷管理的工作。\n\n第四部分，“成为 Linux 服务器管理员”，你将学习创建强大的网络服务器以及管理它们所需的工具：\n\
  \n*   第 13 章，“理解服务器管理”，涵盖了远程日志、监控工具和 Linux 启动过程。\n*   第 14 章，“管理网络”，讨论了如何配置网络。\n\
  *   第 15 章，“启动和停止服务”，提供了启动和停止服务的信息。\n*   第 16 章，“配置打印服务器”，描述了如何配置打印机以便在你的 Linux\
  \ 系统本地或通过网络从其他计算机使用。\n\n\n\n\n* 第 17 章“配置 Web 服务器”描述了如何配置 Apache Web 服务器。\n* 第 18\
