  md: '# Get in the queue


    When you print a file, it doesn''t go directly to the printer. Instead, it goes
    to an area called a print queue. The printer then prints the files waiting in
    the queue in the order which they arrived at the queue. In this way, one program
    doesn''t have to wait for the printer to stop printing before giving the command
    to print a file. In addition, the queue allows multiple programs to print to the
    same printer at the same time having to wait for the physical printer to become
    idle.

    Each printer in your system needs a queue name and a place to put the queue. This
    place is called the spool directory. The dialog box shown in Figure 5-38 is where
    you enter these.


    # ISA Plug ''n Play configuration


    The next screen you see after you finishing LILO is the Configure ISA PnP Devices
    dialog box, shown in Figure 5-30. Allowing TurboLinux to detect your ISA Plug
    ''n Play (PnP) devices saves you sweetheart later on, so go ahead and select the
    Select button and press Enter.


    ![](img/8ae48244df88d68913b10871643fd825_118_0.png)


    Figure 5-30:

    Detecting Plug ''n Play

    devices.


    After a short time, a screen like the one in Figure 5-31 appears, telling you
    that your PnP devices (if you have any) have been configured.


    If you need to change the PnP configuration after your setup, you can reconfigure
    or tune the settings at any time using the turbopnpcfg command.'
  merge: -1
