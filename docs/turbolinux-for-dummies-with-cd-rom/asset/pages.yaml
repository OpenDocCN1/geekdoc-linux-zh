    # Adding More Disk Storage


    Sooner or later, you''re likely to add more disk storage to your TurboLinux system
    to hold more programs, hold more data, or enable more users to log in. Disk storage
    is usually added one or more hard drives at a time, and each drive can have one
    or more partitions.


    The disk partition is Linux''s basic file storage unit. First you create the file
    systems on the disk partitions, and then you combine the file systems to form
    a single directory tree structure. The directory tree structure can span one disk
    or spread across many.


    You can define partitions while adding a new disk or later. In most cases, Linux
    defines partitions during the original Linux installation. You may divide a disk
    into one, two, four, or more partitions, of which may contain a file system or
    be used as a swap partition. Swap partitions allow large or small programs to
    run even if they take up much memory than you have RAM in your computer. The total
    of all your swap partitions and RAM is called virtual memory.


    After you create a partition, you must create a file system. The file system occupies
    a single space on the disk that has a unique special file (device) name. This
    name accesses the file system regardless of whether the data is stored on all
    or only part of a physical disk or is an aggregate- of multiple physical disks.'
  merge: -1
