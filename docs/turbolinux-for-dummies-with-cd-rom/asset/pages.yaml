  md: '# Introduction


    Other books about Linux contain fascinating information for Unix system administrators
    as well as long lists of unpronounceable commands with confusing options. TurboLinux
    For Dummies is different. The fascinating information is for you, and the descriptions
    and directions are written in plain English.


    Use this book as an entertaining and informative reference to Linux. Or buy a
    whole stack of them and use them to press flowers. (Hey, you can still use the
    top one as a reference for Linux.)


    # About This Book


    This book is designed to be a helping-hands reference, providing a place to turn
    to for help and solace in those moments when, after two hours of typing xstart
    fruitlessly and reloading X Window System twice, your 5-year-old tells you that
    the x goes at the end of the word.


    We tried our hardest to fill up this book with the things you need to know about,
    such as


    +   - Installing TurboLinux

    - Installing X Window System

    - Issuing important commands

    - Working with files and directories

    - Using text editors and other applications

    - Getting online

    - Finding help


    You''ll see troubleshooting tips throughout the book. Not that Linux is all that
    much trouble — we just want your experience to be as trouble-free as possible.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# # Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn''t make a few. This book is for you


    +   - You have a copy of the TurboLinux operating system. Surprise — one is on
    the TurboLinux For Dummies CD-ROM in the back of the book!

    - You have a computer.

    - You want to put the TurboLinux operating system and the computer together, using
    duct tape that hasn''t worked.

    - You don''t need to become a Linux guru — at least not yet.


    # # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues, such as


    +   - Is Coke better than Pepsi?

    - Are Tim-Tams the ultimate junk food?

    - What is the best hardware for running Linux?


    These aren''t the types of conventions we talk about in this section. Our conventions
    are shorthand ways of designating specific information, such as what is and isn''t
    a command or the meaning of certain funny-looking symbols.


    # # Typing code


    Commands in the text are shown `like`. Commands not in the text, but set off on
    lines by themselves, look like this:


    ```

    [maddog@shamet maddog]$pwd

    /home/maddog

    ```


    When you see stuff in boldface, it means it''s something you should type. The
    non-bold stuff that looks `like this` is text that the computer displays. So,
    in the preceding, when you type `pwd` (and press Return), the computer displays
    `/home/maddog`.


    Well, not quite. The notice `[maddog@localhost maddog]` in the preceding code.
    You won''t see that on your system, unless you''re my, same-named twin. You will
    see something similar. The same goes for `/home/maddog`; the maddog is replaced
    with the directory name on your system.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Introduction


    If you want to enter a command that takes up more space than one line allows,
    you need to use the continuation character. If you place a backslash (\ at the
    end of a line, then you can continue on the next line, and TurboLinux treats it
    as a single command.


    Now for some further complications. Check out the following:


    ```

    [root@localhost /root]# password <name>

    ```


    <name> is in italic, meaning that you should replace <name> with a real name.
    In this case, you replace <name> with your login name. How are you supposed to
    know that? Don''t worry. I tell you so in the text.


    Here''s a rundown of the command syntax in Linux:


    +   * Text not surrounded by [ ], or < must be typed exactly as shown.

    * Text inside brackets [ ] is optional.

    * Text inside angle brackets < must be replaced with appropriate text.

    * Text inside braces { } indicates that you must choose one of the values that
    are the braces and separated by the | sign.

    * An ellipsis (...) means so and on to repeat the preceding command as needed.


    Don''t concern yourself with this stuff too much now. For most of the book, you
    don''t need to know these particulars. And when you do need to know something
    about a particular syntax, come back here for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign (+) between the keys. For example, Ctrl+Alt+Delete
    means you should press the Ctrl key, Alt key, and Delete key all at the same time.
    (No, I don''t make you press any more than three keys of the same time)


    You may also see this from time to time:


    ```

    [maddog@localhost maddog]$ vi quagmire

    echo Report of login names and users on the Linux system date

    echo

    cut -f 1,5 -d: /etc/passwd | sed -e ''s/:/ - /''

    <ESC>

    :wq

    ```'
  merge: -1
