- img_proc: true
  md: '# # Chapter 17


    # # Ten Sources of Help


    **In This Chapter**


    +   - Read, read, read

    - Check out the Linux HOWTOs

    - Go back to school

    - Become a newshound

    - Become a user groupie

    - Pay for support

    - Go the commercial route

    - Visit Web sites

    - Attend conferences

    - Try to help others


    By now, you''re probably wondering whether an end exists to the amount of information
    and knowledge needed to run a TurboLinux (or Linux/Unix) system. The answer is
    yes, an end exists to the knowledge needed to run a system well, but not to the
    knowledge you can accumulate while figuring out how things work and interact.
    In this chapter, we suggest several ways to get additional training and support
    for your TurboLinux efforts.


    # # Books and More Books


    When we started working with computers many years ago, the books about computers
    would fill one bookshelf and were mostly about the electronics of the hardware
    itself. You hardly ever saw books on computers in the popular bookstores. Today,
    you can find thousands of books on computers; most describe the software and its
    interactions, with the hardware taking a back seat.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 298 Part VI: The Part of Tens


    Perhaps you looked at other books before you bought this one and were intimidated
    by their use of technical terms. Or you thought them too general for what you
    wanted to do, and you wanted something more task-oriented. You may want to look
    over these other books again when your knowledge level will be higher after using
    this book. TCP/IP networking, compiler design, operating system design, formal
    language theory, computer graphics, and systems administration training are all
    related topics that you may want to study in greater depth.


    Many books specific to the Unix operating system are either or completely applicable
    to TurboLinux, such as books on Perl, a comprehensive interpreter. By getting
    one (or more) books on Perl and sitting down with your TurboLinux system, you
    can have both a new tool for doing your work and a new appreciation for a complete
    programming language. If you want to see how your file works, the source code
    is there for you to view.


    ![](img/8ae48244df88d68913b10871643fd825_323_0.png)


    # Becoming a geek


    My editor hates it when I say things like “fsck your file system.” I’m supposed
    to say “run the fsck program against the file system.” I have gone along with
    this for the most part, but here is where I tell you that true Unix (and Linux)
    says the following:


    Geeks talk about “disks” when my editor would make say “change drives,” and geeks
    intersect the words X, X11, and X Window System, while my editor patiently interjects,
    “Try to stick with one term as much as possible—how X?”


    +   - FS Check: the file system instead of “run F-S-C-K on the file system"

    - vi (rhymes with “eye”) instead of V-I when talking about the editor vi


    I also want to point out that geeks are not nerds. Geeks are people who love technical
    topics, but also typically have a wide range of other interests. Geeks are often
    outgoing, and (many) not all enjoy being with people.


    I point out to my editor fsck is a noun, a verb, and an adjective:


    +   - fsck.

    - fscked the file system.

    - I put the files into the fscked file system.


    One of my favorite T-shirts (I have more than 3,000 XL T-shirts) reads:


    It is hard being a geek, but it is easier. So, if you, really, start to like the
    Linux operating system and learn to work it, you may be a closet geek. Welcome
    to the club.


    but this concept just induces an editorial shudder.'
  merge: -1
