  md: '# Chapter 18: Problem Areas and Solutions


    Note that in this example, the directory is owned by root and the group ownership
    is bin, which does not allow lembre to have access to the directory structure.
    Because the shells and terminal emulators of X needs access to that directory
    structure, X can''t fully work.


    To correct this problem, use the chown and chgrp commands to change the ownership
    of the lembre home directory to lembre and to change the group ownership of the
    lembre home directory to users:


    ```

    chown lembre ~lembre

    chgrp users ~lembre

    ```


    Make sure you replace the lembre login name that we use in this example with the
    login name you are having difficulty with.


    # Don''t Know How to Make X Start at Boot Time


    Problem: You don''t have to log in to a command-line mode (such as DOS) and then
    type startx. Instead, you want to log in through X.


    ![](img/8ae48244df88d68913b10871643fd825_338_0.png)


    Solution: I set up my machine so that it starts in character-cell mode and then
    allows me to switch to X. (Many times, I want to only make a simple edit or look
    at something on the system, and logging in without X is simply faster.) If you
    like to see a graphical interface from the beginning, however, do the following:
    in /etc/inititt file, change this line:


    ```

    id:3:initdefault:

    ```


    to this:


    ```

    id:5:initdefault:

    ```


    Save your changes and reboot. X starts at the end of the boot process, and you
    can then log in through the graphical interface. To go back to the old way of
    booting, change the line in /etc/inititt file back to the following:


    ```

    id:3:initdefault:

    ```


    and reboot the machine.'
