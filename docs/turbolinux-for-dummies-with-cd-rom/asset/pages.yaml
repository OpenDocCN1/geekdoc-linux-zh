  md: 'sdd, respectively. You must now, at the very least, change your /etc/fstab
    file. For this reason, it''s a good idea to add SCSI disk drives to your system
    starting with ID 0 and working up the number chain, with no gaps in the numbering.


    # Partitioning a drive


    Now that you''ve created block special files, you can use fdisk to partition the
    drive. The command to call this utility is /usr/bin/fdisk.


    For example, if you want to invoke fdisk for partitioning the first SCSI disk
    on your system, you type the following:


    ```

    /sbin/fdisk /dev/sda

    ```


    To see how to use fdisk, refer to Chapter 5. Using fdisk is not all that difficult;
    you can partition the drive fairly easily. Remember to keep track of fdisk information
    such as the partition numbers, type, size, and starting and ending blocks.


    # Making the file system


    Every disk partition is simply an empty space with a beginning and an end. Unless
    the partition is being used for swap space, you have to put some type of file
    system on the partition before it can become useful. The mkfs (which stands for
    make file system) command is used to create the file system on the partition.
    Normally, the file system is a native Linux file system, which at this time is
    called ext2. The Linux version of mkfs has been nicely streamlined and requires
    hardly any input. To create a file system on the disk partition sd1, enter the
    following command:


    ```

    mkfs -t ext2 /dev/sda1

    ```


    If you want to create an MS-DOS file system on the disk partition, you can use
    this command:


    ```

    mkfs -t msdos /dev/sda2

    ```


    You can continue to execute mkfs commands to create file systems for every partition
    on your new hard drive. Or you can leave some partitions without file systems
    (for future use), as long as you remember to perform the mkfs command on them
    before trying to attach them to your file system by using either the /etc/fstab
    file.


    Congratulations! Your hard drive has been physically added to your system and
    partitioned, and you''ve added file systems to it. Now the disk is ready'
