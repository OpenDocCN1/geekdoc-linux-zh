    In all numbers and pieces of data, we are concerned about the page in and page
    numbers as well as the swap in and swap out numbers in memory. Although these
    numbers (particularly the page in and page out numbers) may be zero, having numbers
    that are gigantic or increasing at a fast rate is not good because would mean
    your system is memory starved and your CPU is waiting for virtual memory to be
    brought into memory before it can continue processing. How much can this slow
    your computer down? In a particular bad (and, luckily, rare) case, memory shortages
    make a program that would normally run in three minutes run in ten.


    ![](img/8ae48244df88d68913b10871643fd825_273_0.png)


    # Enhancing Disk Performance


    After your system has enough main memory, you may want to look at how your disks
    are performing. Linux (like a lot of Unix operating systems) is very disk-oriented.
    Many programs that Linux users run from disk, execute for a short time (creating
    swap on the disk and then de)terminate. In particular, when you create a long
    pipeline in shell programming, the last few programs on the command line may never
    do any work because they depend on data flowing through them before they do anything.
    If no data reaches the last programs in the pipeline, they can terminate. Suppose
    that the last program is the sort program. Its job is to sort the output into
    a particular order and then allow the display of the output on the screen. If
    no data comes through the pipeline to sort, the sort program''s job is very short
    (kind of nonexistent), and all the work sort program preparing to do is useless.


    Linux also does a lot of work with temporary files. The C compiler generates many
    temporary files while it is compiling a program, and the sort routine does the
    same while sorting (dart sort routine). All these temporary files may flush data
    out to the disk or bring data from the disk, creating a bottleneck through the
    disk subsystem.'
