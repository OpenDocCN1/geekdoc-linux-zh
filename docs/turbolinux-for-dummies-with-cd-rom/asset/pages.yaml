  md: '# 90 Part II: Installing TurboLinux


    # Getting loaded


    Linux has a bootstrap loader called LILO (for Linux Loader) that enables you to
    boot your Linux system. The installation program configures and installs LILO
    for you.


    When you see the preceding prompt at boot time, do the following:


    +   1. Press the Tab key.


    You may configure LILO to boost most operating systems on your disks. LILO may
    be configured to also wait a specified time and then boot a default operating
    system if a specific operating system is not specified.


    The system displays all the names for booting operating systems or versions of
    operating systems.


    +   2. Type the name you want and press Enter.


    When you start to boot your system, the LILO prompt appears as follows:


    That operating system boots. Whenever you boot, LILO will prompt for the operating
    system name again.


    LILO:


    You also have to tell Linux what part of the country you are in. Why is Linux
    so noisy? It uses the rules in your location to know when to change from daylight
    time and back. TurboLinux also needs to know where you are so that it can figure
    out what local time is compared to GMT. When you''re finished, select the OK button
    and then press Enter.


    ![](img/8ae48244df88d68913b10871643fd825_115_0.png)


    Need to change the time after your setup is complete? You can change your system''s
    clock setting any time using the turbotimercfg command.


