  md: "# Chapter 15: Interacting with the Internet\n\n# Finding your modem from Windows\n\
    \nAfter you connect your modem, you have to tell Linux which serial line (or simulated\
    \ serial line) the modem is connected to. If you have Windows 95 or 98 on your\
    \ system, you can see which port or COM line the modem is connected to as follows:\n\
    \n+   1. Choose Start>Settings>Control Panel.\n   The Control Panel window appears.\n\
    2. Double-click the Modem icon.\n   The Modems Properties dialog box appears.\n\
    3. Click the Diagnostics tab.\n   You see your modem listed, with a COM line number\
    \ beside it. This is the Windows designation for your modem's serial communications.\n\
    \n# Finding your modem from Linux\n\nYour modem can only be connected to one of\
    \ four serial ports on your PC. If you have an external modem, then it will generally\
    \ be connected to port /dev/ttyS0 or /dev/ttyS1 (although it is possible to configure\
    \ it as /dev/ttyS2 or /dev/ttyS3, it is not common). If you have an internal modem,\
    \ then it can be any of the tty devices.\n\nIf you do not know what port modem\
    \ is connected to, then it's unreasonable to find it by elimination. If you have\
    \ an external modem, then send data to it and look for the light-emitting diodes\
    \ (LEDs) to light up. The following instruction shows a simple way of doing that.\n\
    \n```\necho \"i am not a number\" > /dev/ttyS0\n```\n\nThis simple script sends\
    \ a text string to the first serial port. If it's connected you should be able\
    \ to see the LEDs light up in a short burst. If it doesn't work, then try ttyS1,\
    \ ttyS2, and finally, ttyS3.\n\nIf you have an internal modem, then life is a\
    \ bit harder because it doesn't provide visual response. You can use the modem's\
    \ speaker to provide an audio response, however. Enter the following:\n\n```\n\
    echo \"atdt55553309\" > /dev/ttyS0\n```\n\nIf you hear the modem pick up and dial\
    \ (kind of a screechy, nails-on-chalkboard type of sound), then you've won the\
    \ game of hide-and-go-seek. If that doesn't work, then use the dialup program\
    \ dip. Type in dip-t and at the prompt enter the following instructions:"
