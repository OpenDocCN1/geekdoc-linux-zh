  md: '# # Chapter 13


    # # File System Management


    **In This Chapter**


    +   - Making your files available to TurboLinux by mounting a file system

    - Dismounting a file system

    - Playing inspector to search for other users

    - Experiencing the joys of configuration files

    - Rehabilitating corrupted files

    - Increasing disk space with a new drive

    - Using more floppies

    - Adding a CD-ROM drive


    Managing the Linux file system is one of the more important jobs in maintaining
    and updating your TurboLinux system. You have the responsibility of creating the
    Linux file system and seeing to it that users (even if you are the only user)
    have access to secure, uncorrupted data.


    The tasks associated with file system management include the following:


    +   - Diagnosing hardware failures

    - Preventing file corruption

    - Blocking user errors

    - Connecting and configuring new hardware

    - Managing disk resources


    TurboLinux performs some file management tasks automatically, thank goodness.
    But you must perform other tasks manually as needed. In this chapter, you discover
    the ins and outs of managing your Linux file system — the easy way.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 226 Part IV: Maintaining Your System


    # Mounting and Dismounting


    Files are important to Linux and other Unix-like operating systems in ways that
    are different from their importance to DOS, Windows, and Macintosh operating systems.
    Linux, everything is stored as a file in a predictable location in the directory
    structure — Linux even stores commands as files. Like other modern operating systems,
    Linux has a tree-structured, hierarchical directory organization called a file
    system.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the root directory, which is designated with a slash (/). You
    can make the contents of a file system available to Linux by merging the file
    system into the system directory through a process called mounting.


    File systems can be mounted or dismounted, which means that file systems can be
    connected or disconnected to the directory tree. The exception is the root file
    system, which is always mounted on the root directory when the system is running,
    which cannot be dismounted. Other file systems, such as systems contained on another
    hard drive, a floppy disk, or a CD-ROM, may be mounted and dismounted as needed.


    # The command syntax


    Here''s the command syntax for manually mounting a file system:


    ```

    mount <block-special-file> <mount-point>

    ```


    In this line, block-special-file is the device driver file for the partition of
    the disk drive (such as a hard drive or a CD-ROM) where you can find a file system.
    And mount-point is the directory where you want the file system.


    Do you want to see the mount command assign the first floppy drive, /dev/fd0,
    to the /mnt directory? Hey, did we promise you a good time or what?


    ```

    mount /dev/fd0 /mnt

    ```


    You can mount a file system in only one directory at any given time.


    The directory where you want to mount the file system (the mount-point) must exist
    before you issue the mount command. Otherwise, the command doesn''t work. If you
    need to create the directory, use the mkdir command, like this:


    ```

    mkdir /canadianpolice

    mount /dev/fd0 /canadianpolice

    ```


    ![](img/8ae48244df88d68913b10871643fd825_251_0.png)'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 13: File System Management 227


    The first command makes a new directory called /canadianpolice. The second command
    mounts onto that new directory the file system on the disk in the floppy drive
    — /dev/fd0.


    When you are finished or fed up with the file system you mount on /canadian police,
    you must dismount it using the mount command. The syntax for the mount command
    is


    ```

    mount <name>

    ```


    where name is either the name of the block-special-file (/dev/fd0) or the name
    of the directory that is the mount-point (canadianpolice).


    # Sleuthing for other file users


    Because Linux is a multiuser and multitasking operating system, more than one
    user can log in to the system at the same time. This may mean that multi-file
    systems are mounted and in use. The mount command works only on inactive file
    systems. If you issue the mount command and see an error message indicating that
    a device is busy, you can guess that at least one file in the file system is open
    or that the file system is mounted in the current directory.


    But why guess? Linux can help you find out which files are open and which user
    is responsible. Use the fuser command (Get it?) Find user — fuser.) to identify
    which processes are using a particular file or file system and which user is using.
    If you use fuser with a filename, it returns information on that file. If you
    invoke fuser with the block special filename, fuser reports on all the files in
    that file system.


    The fuser command has two options that you might find useful:


    +   -u displays user names along with process IDs

    -m enables you to specify the file system by name


    By running fuser (which is a character-cell program) with the -u option, you get
    a system response that looks something like the following example:


    ```

    [maddog@shamet p3ch0920$] /usr/sbin/fuser -u /home

    /:492r(maddog) 503r(maddog)

    504r(maddog) 508r(maddog) 580r(maddog)

    581r(maddog) 585r(maddog) 586r(maddog)

    598r(maddog) 599r(maddog) 601r(maddog)

    879r(maddog) 1287r(maddog)

    [maddog@shamet p3ch0920$]

    ```'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'You can see here that maddog (that dirty dog!) has a series of programs

    using the /home file system. If you want to see what those programs are, you

    can use the ps command, which shows the process numbers and names of

    the processes running in the system:


    ```

    [maddog@shamet p3ch0g920]ps ax | grep 601

    601 p S 0:00 /opt/applix/applix

    [maddog@shamet p3ch0g920]$

    ```


    This example uses ps ax to show all processes in the system in extended

    mode so that you see additional information about the processes instead of

    j names. Then, by using the grep command with the process number

    601 as an argument, you can isolate one line from the output of the ps com-

    mand and see that the program is running the /opt/applix/applix-pro-

    gram. This is just one of the programs that you have to shut down before

    unmount the root file system.


    By repeating the ps and grep commands and substituting other process

    numbers for 601, you can see all the processes and know which programs to

    shut down. You can then ask the people running those processes to quit their

    programs, or you can use the kill function of fuser on the file system.


    To use the kill function of fuser, you simply use the -k flag on fuser you

    y list the file systems you are trying to unmount. For example:


    ```

    fuser -ku /home

    ```


    kills all the processes using the /home file system for any reason.


    After all programs are shut down and no one else is using the file system, you

    unmount the root file system.


    # Configuring file systems


    Mounting all file systems manually every time you boot the system quickly

    becomes annoying. To avoid this, you can have the system execute the

    required mount commands when you boot. The information needed to exe-

    cute the required mount commands is in the standard Linux system com-

    guration file located at /etc/fstab. The entries in the file usually follow

    format:


    ```

    <block-special-file> <mount-loc> <type> [opts] <dump-freq>

    <passnumber>

    ```'
  merge: -1
  pgno: 253
- img_proc: true
  md: "# Chapter 13: File System Management\n\nIn this format\n\n+   - block-special-file\
    \ is the name of the special file where the file system resides; a block device\
    \ name such as /dev/hd1 is for the first partition on an IDE drive.\n- mount-loc\
    \ is the directory where the file system will be mounted. If the directory is\
    \ on a partition used for swapping, use swap for mount-loc.\n- type is the kind\
    \ of partition. For a native Linux file system, type is ext2.\n- opts is the field\
    \ for listing options, separated by commas. The options may include any of the\
    \ following:\n  - rw Allow the file to be read and written to (read-write mode).\
    \ The default.\n  - ro Allow the file to be read only (read-only mode).\n  - dev\
    \ Treat special files in this file system as special files.\n  - nodev Treat special\
    \ files in this file system as filenames.\n  - exec Permit execution of binary\
    \ files from this system.\n  - noexec Prevent the execution of binary files from\
    \ this system. This is useful for file systems that contain only data to prevent\
    \ programs from being introduced by system crackers or to prevent people from\
    \ trying to execute programs that were meant to run on a different system, such\
    \ as MS-DOS.\n  - auto Allow the file system to be mounted with the -a option\
    \ to the mount command.\n- nouser Forbid a non-superuser from mounting onto the\
    \ file system.\n- async Write data to the file system asynchronously. The system\
    \ is faster but can lose data if a system failure occurs.\n- sync Write data to\
    \ the file system synchronously.\n- suid Permit the suit (set user ID) access\
    \ mode (the default).\n\nThe suit access mode enables an executable program with\
    \ the suit (or setuid) permission bit set to take on the personality and permissions\
    \ of the owner (or the group) of the executable program. This can be a security\
    \ hole that allows user(s) to act as if they are the user who owns a file. If\
    \ the owner of the file is root, then a nonroot user can potentially gain complete\
    \ access to the file system — and thus the computer — if setuid is used haphazardly;\
    \ specifying the nosuid option prevents file system from having the set user ID\
    \ (or setuid) access effect.\n\n![](img/8ae48244df88d68913b10871643fd825_254_0.png)"
  merge: -1
  pgno: 254
