  md: '# 76 Part II: Installing TurboLinux, or ending point of,


    5. Type the size, the ending point, of the partition


    You can enter the size in four ways:


    +   * With a plus sign, followed by the size specified in bytes

    * With a plus sign, followed by the size specified in megabytes, followed immediately
    by M

    * With a plus sign, followed by the size specified in kilobytes, followed immediately
    by K

    * By specifying the ending cylinder (without the plus sign)


    The first three are particularly useful in setting areas of the disk large enough
    to hold your Linux distribution, your /home directory, your swap space, or other
    areas. The last option, specifying the ending cylinder, is useful when allocating
    all remaining space to the file system we are defining. We typed 1018, which is
    the end of the disk. This means we can''t put any partitions on that disk, and
    all our Linux files have to go into that one partition (unless we have another
    disk).


    6. Type — you guessed it — p to display the partition table again.


    # Creating multiple partitions


    Just for grins, we''ll go back and create multiple partitions on the disk to illustrate
    having several partitions just for Linux. First, we delete the large partition
    2, which we created in the preceding section, by typing d and 2.


    Now look at Figure 5-12. We make several partitions on the disk, using the same
    series of steps that we went through in the preceding section, but we use the
    size specification for the first two partitions and then use the cylinder specification
    for the last one.


    Now we have DOS partition for my Microsoft operating system and three partitions
    for Linux. Partition 2 is small for Linux, but we wanted to create all four partitions
    on one disk, so the 200MB size is used only for illustration. The recommended
    value is approximately 1GB for all the code on the TurboLinux For Dummies CD-ROM.


    Finally, Figure 5-13 shows a final display of the partition table, showing how
    the four partitions appear.'
