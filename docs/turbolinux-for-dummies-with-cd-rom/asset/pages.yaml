  md: '# Chapter 11: Getting to Gnow GNOME and X


    TIP

    It''s usually confusing to have both virtual screens and the virtual desktop turned
    on at the same time, so we recommend that you go with the virtual desktop. Both,
    however, are explained in this section.


    # Getting to know (and configure) GNOME


    Now that you are familiar with the basics of what GNOME can do, it''s time to
    briefly describe how you can modify it. There are two configuration systems that
    you need to pay attention to. The first is the GNOME Control Center system. The
    second is the Enlightenment Configuration system.


    The GNOME Control Center is started by clicking the Main Button and choosing Settings:GNOME
    Control Center buttons. The screen shown in Figure 11-6 appears. The Control Center
    lets you modify all the basic properties of GNOME. For example, choose Desktop:Background
    and you can set the color and other aspects of the Desktop. Choose Desktop:Screensaver:Xjack
    and switch from the default random screen saver to the "All work and no play makes
    Jack a dull boy" screen saver. Not bad selection for those long winters at remote
    resorts!


    The Control Center also lets you configure things other than maniacal rantiings.
    We leave it to you to explore the wonderful world of setting your keyboard-bell
    and shell. This system gives you lots of flexibility.


    # The Age of Enlightenment


    The Enlightenment window manager is reached by positioning the cursor over a blank
    part of the desktop and simultaneously clicking both the left and right mouse
    buttons. A menu appears and you click the Enlightenment Configuration item. The
    Enlightenment Configuration Editor window appears, as shown in Figure 11-7.


    The important menu is the Settings menu. The Settings options let you change the
    style of how windows appear as they are moved and resized. More importantly, the
    Settings menu lets you change the way windows are controlled by the movement of
    your mouse. This is called keyboard focus.


    By default, you have to click on a window to bring it to the surface (this is
    referred to as focus). You can change it so that merely moving the mouse cursor
    to a window focuses it. The sloppy option works more or less in between these
    two options.'
