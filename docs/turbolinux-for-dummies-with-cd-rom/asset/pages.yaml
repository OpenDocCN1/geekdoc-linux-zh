    # The Bourne-again shell


    When Ken Thompson and Dennis Ritchie started writing Unix, they wanted to investigate
    lots of new ideas in using computers. One of the ideas they explored was making
    the human interface to the computer changeable and adaptable to the specific needs
    of the application.


    This human interface (or more specifically, what humans interacted with) is typically
    called a command interpreter because it looks at each


    command as it typed and converts it into something the computer can follow as
    an instruction. Most computer systems of the day had the command interpreter built
    into the operating system, which meant the user couldn''t change it. The developers
    of Unix wanted to separate the command interpreter from the rest of the operating
    system. Because the functionality was both a command interpreter and a complete
    environment, it was'
