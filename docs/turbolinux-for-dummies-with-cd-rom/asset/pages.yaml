  md: '# 78 Part II: Installing TurboLinux


    # Changing partition types


    When fdisk creates partitions, it creates Linux native partitions by default.

    Many styles of file systems are available, as shown in Figure 5-14. The file system
    you choose determines the operating system puts on the disk partition, the maximum
    size of directories, the length of file names, and how many files can be in any
    one partition.


    Figure 5-14:

    The file systems

    and codes

    available for

    the partition.

    Command (m for help: l)

    | | | | | | | | |

    |---|---|---|---|---|---||

    | 0 | Empty | 90 AI boot | 75 PC/CD | 87 BDI swap |

    | 1 | DOS 12-bit FAT | 84 A/G Boot | 80 Old Linux | 81 Linux/MIN | 88 BDI swap
    |

    | 2 | NTFS root | 85 WinFS2 | 82 Linux swap | 89 System |

    | 3 | Linux ext2 | 31 C3m | 83 Linux native | 90 swM |

    | 4 | DOS 16-bit | 32-63 | Novell | 86 Memory | e1 DOS access |

    | 5 | Swap | 62 GNU MBR | 94 MacOS Boot | f2 F2 secondary |

    | 6 | DOS 16-bit | 32-63 | Linux | a0 808386 | ff |

    | 7 | MFS | 65 Novell Nature | | |

    | 8 | AIX | | | |

    Command (m for help: l)


    One of the native file systems you want to create a swap partition.

    In the preceding section, we created one swap partition: disk partition 3, set
    up for 127MB, which is the maximum size of any swap partition in Linux.

    Linux systems can handle up to 16 swap partitions, so the size limitation is not
    crucial.


    Linux is stingy with memory space, and a swap partition is not always necessary.

    Adding one at this time, however, allows you to run many programs as well as large
    programs without reing your disk. We recommend 127MB to start, assuming you have
    enough disk space for that amount.


    When you create the swap partition, you must remember to use the command to change
    it to a swap partition, which brings us to the point of this section. In Figure
    5-15, we show you the steps for switching the file system from Linux to native.
    Use these steps to follow along:


    +   1. Type p.

    The partition table appears and allows you to choose which partition you want
    to make a swap partition.


    +   2. Type t.

    The t command tells disk that you want to change the type of a partition.


    +   3. Type the number of the partition you want to change.

    In this example, we typed 3 because partition 1 is for DOS and partition 2 is
    for the Linux main installation.


    +   4. Type L to list the file codes, if you want.'
