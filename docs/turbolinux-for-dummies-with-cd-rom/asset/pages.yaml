  md: '# Chapter 15: Interacting with the Internet


    After a few seconds, networking is working, and your computer is connected to
    the Internet. To test that everything is okay, type the following at the command-line-prompt
    to communicate with the ISP providing the Web page for paunchy.net:


    ```

    ping www.paunchy.net

    ```


    If you see a message like the one shown below, you are not only connected to the
    Internet but are part of it.


    ```

    PING www.swcp.com: 56 data bytes

    64 bytes from www.swcp.com (204.134.15.9): icmp_seq=0

    time=80, ms

    64 bytes from www.swcp.com (204.134.15.9): icmp_seq=1

    time=82, ms

    ```


    You can stop the pings by pressing Ctrl+C.


    If you get a message saying that the system is not found, wait a minute and try
    again. Eventually, you should receive a message talking about how many milliseconds
    it takes for a round-trip message. Congratulations, your networking is working!


    You have now set up the hardware and software to connect your system to the Internet.
    Your computer has been joined with the Force.


    To actually surf the Net, read e-mail, and otherwise interact with others on the
    Net, check out Chapter 16, where you find how to configure and use a major tool
    of the Internet, the Netscape Navigator program.


    # # Batten Down the Hatches


    After you''re connected to the Internet, you run the risk of running amok with
    the bad guys (also known as black hats). You''ve heard of hackers, Trojan Horses,
    and such. Unfortunately, they''re real, and the Net is a perfect vehicle for them.


    # # Securing your computer


    You might think there''s safety in numbers. Literally millions of people, businesses,
    and organizations are connected at any one time, and what do you — a simple person
    with a simple computer — have to be concerned about? All, the bad guys are interested
    in big money or big publicity, and plenty of more attractive plums than you are
    out.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 272 Part V: Going Online


    Well, that line of thinking is all true, and chances are that you''ll never suffer
    anything bad. That''s a risk that you may not want to take. Linux offers a rather
    simple method for protecting yourself. The ipchains RPM (Red Hat Package Manager)
    that is packaged with TurboLinux can be used as a firewall — a tool for preventing
    unauthorized access to your computer.


    Linux is a multiuser and multitasking operating system. Unlike Windows, more than
    one person can be logged on at once. More than one task can be run at once, this
    offers an attractive launching point for black hats. If someone can gain access
    to your Linux computer while it''s on the Net, then that person can use your machine
    to launch attacks against other machines. You become the proxy that helps you
    hide your identities.


    ![](img/8ae48244df88d68913b10871643fd825_297_0.png)


    # Building a simple but effective firewall


    The ipchains software is a system that filters IP packets, which are the backbone
    of the Internet. IP stands for Internet Protocol, in fact. When you''re connected
    to the Internet, all the information (graphics and text) that you receive is sent
    in the form of IP packets. These packets contain information that you''re interested
    in or as — and this is how your stuff gets around the world — the destination
    and source address.


    Anyway, all the information that enters and leaves your computer via the Internet
    is packaged in the form of IP packets. You can use ipchains to accept or deny
    the IP packets based on their destination and source address and ports. (Oh yeah,
    ports are another aspect of the Internet Protocol. Suffice to say that they''re
    used for the internal workings for such things as Web browsing.)


    # Creating your firewall filtering rules


    The ipchains-based firewall that we describe in this chapter allows you to access
    all the Internet services except FTP. No one can access your machine or even it.
    (Tools as nmap are available on the Internet that can be used to scan your computer
    and find out what type of operating system you have as well as what services it
    offers.) You can modify the rules to allow FTP but that makes it a little more
    complicated. You can find more extensive and complete rules at Paul''s Web site:
    http://www.paunchy.net/turbodummies Look for ipfilter.rules and ipfilter.register.


    ![](img/8ae48244df88d68913b10871643fd825_297_1.png)


    The following steps describe how to protect yourself by building a firewall:


    +   1. Log in as root and mount the TurboLinux for Dummies CD-ROM.

    2. Install the ipchains RPM by typing this at the command prompt:'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Chapter 15: Interacting with the Internet


    rpm -ivh /mnt/cdrom/TurboLinux/RPMS/ipchains*


    3. The following script is used to set up the ipchains rules that create a firewall.
    Create a file containing the following rules called ipfilter. simpl. Put it in
    the /usr/local/etc directory. [The lines preceded by the hash (#) symbol are comments.]


    ```

    #Flush out all existing rules

    ipchains -F

    ipchains -X

    ```


    ```

    #Set default filters to deny everything

    ipchains -P input DENY

    ipchains -P output DENY

    ipchains -P forward DENY

    ```


    ```

    #Allow all internal network traffic

    ipchains -A input -i lo -j ACCEPT

    ipchains -A output -i lo -j ACCEPT

    ```


    ```

    #Allow all private network traffic (If you have configured an Ethernet interface
    on a local network)

    ipchains -A input -i eth0 -j ACCEPT

    ipchains -A output -i eth0 -j ACCEPT

    ```


    ```

    #Allow all TCP packets out to the Internet

    ipchains -A output -p TCP -j ACCEPT -i ppp0 -d 0.0.0.0/0

    ```


    ```

    #Allow all TCP SYN packets back in (the return packets)

    ipchains -A input -p TCP -j ACCEPT -i ppp0 ! -y -s

    0.0.0.0/0

    ```


    ```

    #Allow DNS UDP packets out to the Internet

    ipchains -A output -p UDP -j ACCEPT -i ppp0 -d 0.0.0.0/0

    domain

    ```


    ```

    #Allow DNS UDP packets back in from the Internet

    ipchains -A input -p UDP -j ACCEPT -i ppp0 -s 0.0.0.0/0

    domain

    ```


    4. Use an editor to create the script that will be used to turn off the fire-wall.
    Call it ipfilter.reset and put it in the /usr/local/etc directory as well.


    ```

    ipchains -F

    ipchains -X

    ipchains -P input ACCEPT

    ipchains -P output ACCEPT

    ipchains -P forward ACCEPT

    ```'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 274 Part V: Going Online


    +   5. Make scripts executable by root:

    chmod 770 /usr/local/etc/ipfilter.*


    # Firing your firewall


    Activate your firewall, follow these steps:


    +   1. Log in as root and connect your Linux computer to the Internet with the
    following command:

    ifup ppp


    +   2. After you''re connected, turn on the firewall by entering the command:

    /usr/local/etc/ipfilter.simpl


    +   3. Try connecting to a Web site with Netscape Communicator.

    Everything should work as usual.

    Netscape is described in Chapter 16.


    +   4. Next, look at the rules that you''ve set up by entering the command:

    ipchains -L


    +   5. You should see a list, as follows:

    | Chain input (policy DENY): | | | |

    | :--- | :--- | :--- | :--- |

    | target | prot opt | destination | ports |

    | ACCEPT | all | anywhere | anywhere | n/a |

    | ACCEPT | all | anywhere | anywhere | n/a |

    | ACCEPT | tcp ly- | anywhere | anywhere | any -> |

    | any | | | |

    | ACCEPT | udp | anywhere | anywhere | domain -> |

    | Chain forward (policy DENY): | | | |

    | Chain output (policy DENY): | | | |

    | target | prot opt | source | ports |

    | ACCEPT | all | anywhere | anywhere | n/a |

    | ACCEPT | all | anywhere | anywhere | n/a |

    | ACCEPT | tcp | anywhere | anywhere | any -> any |

    | ACCEPT | udp | anywhere | anywhere | any -> |

    | domain | | | |


    The first chain (which is simply a set of rules used for a common purpose) is
    for incoming — IP packets. You can see that the default policy is to deny all
    IP packets. The first two rules ipchains allow all packets on the local loopback
    (lo) and Ethernet (eth0) interfaces. The next rules return the packets from outgoing
    connections to come back in. The last rule allows the incoming UDP domain packets,
    which are used for domain name service (DNS).'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 15: Interacting with the Internet 275


    The next chain — forward — denies all packets from being forwarded through your
    Linux computer. Forwarding is only necessary if you use your computer for routing
    or other advanced networking functions.


    The last chain — output — defines what IP packets are allowed out of your computer.
    The first two rules are for your eth0 interfaces again and allow internal traffic.
    The next rule allows any and all packets destined for the Internet to leave through
    your firewall. The last rule allows domain (DNS) packets to go out to the Internet.


    You can make your ipchains tighter by allowing only certain types of packets out
    to the Internet. You can specify certain ports and addresses that are allowable,
    for instance. This makes your firewall incrementally safer but also more restrictive.


    # Testing your firewall


    To test your firewall, follow these steps:


    +   1. Try to Telnet to your ISP or University account; any computer account that''s
    external to your own computer will.

    2. Log in as any user and start an xterm by clicking on the little terminal window
    on the Panel.


    (Telnet is a network program that allows you to connect to a remote computer via
    a network and interactively enter commands.)


    +   3. Enter the following command from the shell prompt in the xterm window,
    substituting the name of the computer you are connecting to and the name of the
    network you''re connecting to in the <computer.networkname> parameter.


    ```

    telnet <mycomputer.networkname>

    ```


    When I connect to my ISP, for instance, use the following command:

    telnet login.swcp.


    +   4. After you''re logged on to your account, try connecting back to your Linux
    computer.


    You can find out your temporary (dynamic) IP address is by entering the following
    command from your external account if it is a Linux or Unix computer:


    ```

    who grep <myloginname>

    ```


    This command should show an IP address in numeric form. For instance:

    me (192.168.1.250) ...


    Please note that the IP address has been changed to protect the innocent. The
    address is what is known as a public address and will (should) never exist on
    the Internet anyway.


    ![](img/8ae48244df88d68913b10871643fd825_300_0.png)'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 276 Part V: Going Online


    +   5. Try to Telnet back to your Linux computer:


    telnet 192.168.1.250


    If your firewall is set up correctly, then nothing should happen. If you turn
    off your firewall, however, then you should be able to telnet in your Linux computer.


    This firewall is simple and effective. But it''s by no means the last word in
    Internet or any other type of security. A firewall will do what it meant to do:
    allow you to access the Internet but not allow the Internet to access you.


    For more information, search the Internet for security-related topics. The SANS
    (www.sans.org), UNIXIX (www.unix.org), Red Hat (www.redhat.com), and CERT (www.cert.org)
    Web sites are all good places to start. The companion CD-ROM also has good HOWTO
    documents on the subject. Numerous books also deal with security, including my
    Red Linux Network Toolkit and Red Hat Linux in Small Business (both from IDG Books
    Worldwide, Inc.), which provide introductory to intermediate discussions on the
    subject. They also offer more in-depth IP filtering rules.


    # Setting up a Local Network Connection


    If your TurboLinux computer lives in a location with an existing network, then
    you can easily connect to it. You need to have an Ethernet adapter installed in
    your computer and a network hub or switch to connect to it. After you have the
    hardware set up, then you simply need to configure your network settings. The
    following instructions describe how to use turbonetcfg


    +   1. Log in as root and start turbonetcfg.


    +   2. Select Basic Settings.


    The Global Network Settings screen appears.


    +   3. Enter a hostname in the Hostname field (imagine that!) and a domain name
    in the Domainname field.


    If you are connecting to a network not controlled by yourself, then you''ll have
    to use the existing domain name. If you are connecting to a corporate or organization''s
    network, you can hopefully select your own host-name. Otherwise, whatever dull
    hostname you enter it gives you.


    +   4. Tap down to the Gateway IP field and enter the numeric IP address of your
    network''s Internet gateway.'
  merge: -1
  pgno: 301
- img_proc: true
