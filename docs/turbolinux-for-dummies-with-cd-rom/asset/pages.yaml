    # Here''s vi


    The vi editor on your TurboLinux system is really the vim editor, but you can
    invoke it by using vi because a symbolic link exists between vi and vim.


    Like the ed editor, the vi editor has modes of operation and the same type of
    single-letter commands. To start vi, you type vi at the command line. The screen
    clears, and the leftmost column displays tilde (~). You are looking at an empty,
    unnamed buffer in memory, into which you can enter text until you save the text
    to a named file.'
