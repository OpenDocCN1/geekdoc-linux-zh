  md: '# Chapter 6


    # Solving Problems with X Window System Installation


    In This Chapter


    +   - Uncovering details about your video controller, monitor, and mouse

    - Sleuting with SuperProbe

    - Configuring X Window System

    - Finding some help if X Window System still doesn''t work

    - Paying attention to power-down-etiquette


    I received an error message during the TurboLinux installation informing you that
    the X Window System was not installed properly, then this chapter is for you.
    Take solace in the fact that X Window System is one of the hardest parts of Linux
    to get working properly.


    ![](img/8ae48244df88d68913b10871643fd825_128_0.png)


    The X Window System is also known as X Window or usually just X. Because using
    the entire X Window System moniker sounds a bit stuffy and also takes extra work
    to type, we refer to it as X from here on.


    # Discovering Your Hardware''s True Identity


    Before you attempt to configure X later in this chapter, you need to know the
    particulars of your video card, monitor, mouse, and keyboard.


    For your video card, you need to know


    +   - The model number

    - The video chip used (for example, AGP, Cirrus, and so on)

    - The amount of video RAM that came with your video card'
