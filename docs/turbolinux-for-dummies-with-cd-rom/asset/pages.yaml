  md: '# Chapter 1: Linux and You


    Linux was on the Internet four hours after the problem was identified, and people
    could get the fix easily and apply it to their systems. Various commercial Unix
    vendors took weeks to develop the fix and send it to their customers.


    # Three-tier client/server


    Whoa! What the heck is three-tier client/server? Well, this rather frightening
    term really just means that most computer problems can be broken down into three
    separate problems, or tiers:


    +   - Data storage and retrieval

    - Data manipulation

    - Data presentation


    When you break a problem down into these three levels, the problem is typically
    easier to solve and easier to change as necessary. Until recently, the data presentation
    level consisted of Microsoft Windows systems running on the desktop (perhaps using
    Visual Basic to develop the interface). The data manipulation level and the data
    storage and retrieval level consisted of Unix or older systems communicating over
    the network.


    Now, however, the data presentation level can be a Linux system running a freely
    distributed Web browser or a freely distributed Java system (a portable environment
    for applications). By using Linux, some firms can save thousands of dollars on
    operating system costs and yet still achieve required security and system robustness.


    Like most Unix systems, Linux also has sophisticated data manipulation tools that
    make it a good second-tier system. Linux can extract data from several types of
    databases or reports kept in files from older systems and then sort, combine,
    process, and otherwise manipulate the data, passing the newly created results
    to a presentation level on the desktop.


    Finally, Linux has the facilities to act as a good data storage and retrieval
    level. Several commercial database packages work with Linux. If you can''t afford
    a commercial database package, you can use one of the freely available ones, such
    as Postgres.


    The three-tier concept is to divide work logically, but after you accomplish that,
    you can put all three pieces of functionality on one computer — a Linux system.'
