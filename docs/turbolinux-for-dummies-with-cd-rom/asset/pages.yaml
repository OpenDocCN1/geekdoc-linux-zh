    When the shell automatically expands a filename and then hesitates, waiting for
    you to confirm a command by pressing the Enter key, this is known as command completion.
    You can now press the Enter key to execute the command.


    But what happens if you have two files, one /etc/passwd and the other /etc/password?
    When you press the Tab key, the system rings the bell and the name doesn''t expand.
