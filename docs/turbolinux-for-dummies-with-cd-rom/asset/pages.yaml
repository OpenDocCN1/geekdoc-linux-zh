    # History, herstory


    One of the most useful features of bash is command-line editing, which is the
    capability to change parts of a command without having to retype the entire command.
    Suppose you typed the following line:


    ```

    [username@hostname login]$$ ls -1 * | more

    ```


    Your mind was wandering because you meant to use the less command, not the more
    command, but you pressed Anyway.


    You groan. You press Ctrl+C to halt the command. You would like to reexecute the
    command, changing more to less, without having to type the entire command. Just
    do the following:


    ```

    [username@hostname login]$$ more^less

    ```


    This line resubmits the command to bash with the more changed to less, as follows:


    ```

    ls -1 * | less

    ```


    Output appears. If you have to stop the less command, press q.'
