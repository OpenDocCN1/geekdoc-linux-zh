  md: '# Chapter 11: Getting to Know GNOME and X 207


    # Going out to Lunch: Using the Screen Lock


    You can save the time of logging out of your GNOME desktop by using the screen
    lock. Click the Main Menu Button and choose Lock Screen and the screen saver is
    displayed. To return to productive life and your desktop, press any key or jiggle
    your mouse and then enter your password in the X Screensaver window.


    # Locking Up the Shop


    When you''ve finished for the day and want to go home (or just upstairs), you
    need to log out. Click the Main Menu Button< Log out. The Really log out? Click
    Yes to finish your day.


    You also have the option of using this window to halt or reboot your Linux computer.
    You are prompted for the root password before the computer is halted or rebooted.


    # Stopping X


    When you can''t get your applications screen to respond to you, you can simply
    stop X, which also kills all the programs running under it. To stop X, press Ctrl+Alt+Backspace
    keys all at once. If you started X manually, you can then log out of the account.
    If X is started automatically at boot time (as this book assumes), then you get
    the X logon screen and you can log back on.'
