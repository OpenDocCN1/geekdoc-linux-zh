    # Multitasking


    When executing programs on Linux systems, it''s nice to be able to take advantage
    of its multitasking capabilities — that is, running multiple programs at the same
    time. This process is also called job control. Windows NT does this, Windows 95
    seems to do it (with Windows 98 hovering somewhere in between), and Unix systems
    have been doing it for almost 30 years. Most of this job control capability is
    due to the shell being able to launch-ground jobs and manage them.


    For example, perhaps you have a task that will be running a long time, with little
    or no human input. When you start that task, all you have to do is put an & (ampersand)
    sign at the end of the line, and the job starts running in the background.


    For example, if you start ical (a really nice graphical program on the TurboLinux
    For CD-ROM), you probably want to run a long time, and you want to put other commands
    at the same time. (For more on the ical program, see Chapter 12.) To put ical
    in the background (assuming you have X Window System running), you can start ical
    by typing the following command into a terminal emulator:


    ![](img/8ae48244df88d68913b10871643fd825_218_0.png)


    ```

    [maddog@localhost maddog]$ ical&

    [1] 2449

    [maddog@localhost maddog]$

    ```


    The number in brackets is the job number, followed by the process ID number. The
    job number is the number shell gives the ical program to keep track of the ical
    job. The process ID number is the number the entire operating system uses to keep
    track of the ical program.


    # But wait, there''s more


    Linux is known for its cryptic command names, error messages, and documentation.
    We prefer to think of the command names as terse a lot of meaning in a small space.
    The man page on bash, however, is more than 60 pages, with no examples and no
    cheery dialogue to enter-you.


    From that length, you can surmise shell programming involves a lot more than we
    can tell you in these few pages. Entire books have been written just about shell
    programming. What we have shown here however, should help you write a few scripts
    to make your life easier.'
