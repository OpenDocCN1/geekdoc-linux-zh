  md: '# Old systems and new hard drives


    Hard disks, or drives, are made up of cylinders of information, which in turn
    are made up of tracks of information, which in turn are made up of blocks of information.
    Newer disks have more cylinders than older computer systems can handle easily.
    A method called logical block addressing, or LBA, was created so that older computer
    systems could work with newer devices with more than 1023 cylinders would make
    the data on the disk inaccessible. Therefore, before changing your disk to LBA,
    you should back it up if it contains any valuable data. (You may decide that adding
    another hard drive is not such a bad idea as an expansion strategy.)


    The BIOS setup on your hard drive specifies whether your computer system is capable
    of LBA. Your disk may already be accessed as an LBA disk. Some BIOS systems do
    this automatically the first time a disk with a large number of cylinders is accessed.
    Note, Different hardware systems have different ways to enter the BIOS setup.
    Usually, you can enter when you turn on the power and start to boot, press the
    Reset button on the front of the system and start to reboot, or when you go through
    the normal shutdown of your Windows system and ask to reboot.


    If you have a mixture of IDE and SCSI controllers, your C disk could be any of
    them. The ''Getting Information from Windows 95/98'' and ''Getting Information
    from MS-DOS or Windows 3.1'' sections later in this chapter show you how to identify
    how many hard drives you have, as well as what type they are and which controllers
    they are attached to.


    # Disk drives


    You need to decide whether you will be putting Linux on a separate hard drive
    from MS-DOS or Windows whether you want the two operating systems to share one
    drive.


    Most people think of Windows (either Windows 3.1, Windows 95, or Windows 98) as
    an operating system. All these operating systems, however, have an underlying
    operating system called MS-DOS that manages the disk and many hardware components
    of your PC. From here on, unless we mention a particular operating system, when
    we refer to Windows we''re referring to the Windows/MS-DOS conflation.'
  merge: -1
  pgno: 62
