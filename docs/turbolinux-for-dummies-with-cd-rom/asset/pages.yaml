- img_proc: true
  md: '# Chapter 15: Interacting with the Internet 263


    # The Polish connection


    A young friend of Jon''s from Poland came to visit him. He had obtained a nationwide
    ISP service to keep in touch through the Internet with family and friends back
    home. Unfortunately, the closest number to his ISP connection site was a long-distance
    call from Jon''s house. Jon cautioned him to keep his time down so that he wouldn''t
    have a lot of long-distance charges. He assured Jon that he would. The month after
    he went back to Poland, Jon received his phone bill — with $70 in-distance telephone
    charges to his friend''s provider. Hi, Antoni!


    After you choose your service provider and arrange payment, the ISP provides you
    with certain pieces of information, including the following:


    +   * Telephone access numbers

    * A username (usually not the one you supplied)

    * A password (usually the one you supplied)

    * An e-mail address, which is typically your username added to the ISP''s domain
    name

    * A primary Domain Name Server (DNS) number, which is a large number separated
    by periods into four groups of digits

    * A secondary Domain Name Server (DNS) number, which is another large number separated
    by periods into four groups of digits

    * An SMTP (mail) server name

    * An NNTP (news) server name

    * A POP3 or IMAP4 server name, which is used to download e-mail from the ISP''s
    server to your machine


    The ISP may also give software on a CD-ROM or to floppy to help you get your account
    working, but that software probably works only with Microsoft operating systems.
    That''s okay, because your Linux distribution has more enough software to use
    with the Internet and to help you get your account working.


    # Connecting Your Modem


    To use Linux with the Internet, you must have at least one of these devices:


    +   * A serial modem (just a regular modem)

    * An ISDN line'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 264 Part V: Going Online


    A high-speed (broadband) connector of some type (such as Ethernet, FDDI, a cable
    modem, DSL, ADSL, or ATM if you''re one of the lucky souls to be blessed with
    such service. US West, where are you??


    For the second and third items, you or someone you know (your boss, your systems
    administrator, or your 10-year-old) probably arranged for you to get the connection
    and even set up your computer for it. The serial modem is a device that you may
    have chosen yourself, or it may have come with your computer, in which case you
    may have little knowledge of how to use it with Linux. For the rest of this chapter,
    we assume you''re connecting to the Internet by using a serial modem and a phone
    line.


    Modems, quite simply, perform three main functions:


    +   Convert digital information into tones that travel across telephone lines
    (and vice versa).


    +   Dial the telephone number you want to reach and make the connection with a
    modem at the other end.


    +   Negotiate with the modem at the other end about what speed to use when sending
    bits of information.


    # Sorting through modems


    Modems can be either internal or external. An external modem stays in its own
    box and usually plugs into a wall outlet for power, into the telephone line for
    the connection, and into a serial connector on the back of your computer. An internal
    modem is usually plugged into a slot on the motherboard inside the computer case.
    (Some internal modems are built directly onto the motherboard.) To the computer
    and one or more serial ports, an internal modem appears as if it were two or more
    serial ports. Internal modems draw their power from the computer system and plug
    into the phone jack.


    Usually internal modems are less expensive than their external counterparts, but
    some people like external modems because they can hook them up to different computers
    by simply unplugging the serial line from one system box and plugging it into
    another.


    A third type of serial line modem is a PCMCIA card (sometimes called a PC card).
    These are used most often with laptop computers.


    Avoid using WinModems at all costs. These modems are designed for Windows only.
    They''re cheaper than regular modems because they''re lazy (or smart depending
    on how you look at it) and depend on the Windows operating system to do much of
    their work for them. As far as we are aware — no Linux drivers exist for such
    modems.


    ![](img/8ae48244df88d68913b10871643fd825_289_0.png)'
  merge: -1
