  md: '# Chapter 14: Customizing TurboLinux


    # Putting the finishing touches on the kernel


    After the kernel is rebuilt the you want it, you''ll probably have to remake any
    modules you want to use. These are the modules that you specified in the kernel
    as loadable. The easiest way to do this is to type make modules and make modules_install
    after the basic kernel is built.


    In addition to making the kernel the you want it, you have to tell the system
    where you want to put the new version of the kernel. One way to do this is through
    /etc/lilo.conf, which is the configuration file for the LILO loader. If you edit
    /etc/lilo.conf, you see a file that looks like this:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    other=/dev/hda1

    label=dos

    table=/dev/hda

    image=/boot/bzImage

    label=linux

    root=/dev/hda2

    read-only

    ```


    The first line, boot=/dev/hda, means the master boot block is on device /dev/hda.
    If you wanted to create a LILO boot file on a floppy disk, you would make this
    boot=/dev/fd0. The second line names a file that shows how Linux inside the kernel.
    The third line shows where to get a boot block. For now, leave these three lines
    alone.


    The prompt line means you want to be prompted for multibooting operations (using
    LILO to boot more than one operating system), and you want it to wait at least
    50 seconds before booting the default operating system, which in this case is
    DOS. When this system was loaded, DOS was loaded on the first partition of /dev/hda1,
    and when you press the Tab key after the first boot prompt appears, you see dos
    as one of the labels for which operating system to choose and linux as the other
    label. The next section of the /etc/lilo.conf file, which starts with image=/boot/bzImage,
    describes the Linux part of the boot process. Note here that the image is located
    in /boot/bzImage.


    The final two tell LILO that your root file system is /dev/hda2 and that it should
    be mounted read-only until it has a chance to be checked by fsck.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 258 Part IV: Maintaining Your System


    ![](img/8ae48244df88d68913b10871643fd825_283_0.png)


    Please remember that all disk names such as /dev/hda2 as well as the layout are
    only examples; your system may have a different layout and no DOS to act as a
    second operating system to boot. In this case, your `lilo.conf` file would be
    a lot smaller and simpler, but just as effective.


    After you update the `/etc/lilo.conf` file to reflect your system configuration,
    check for a new copy of the kernel (residing at `/boot/bzimage`) by verifying
    that the date and time stamp on the file belongs to the latest build.


    Then you can enter the `lilo` command and update the master boot record. The next
    time you boot, you will be running your rebuilt kernel.'
