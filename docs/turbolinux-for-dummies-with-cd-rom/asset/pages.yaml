  md: '# 252 Part IV: Maintaining Your System


    ![](img/8ae48244df88d68913b10871643fd825_277_0.png)


    Trying to reduce the number of I/Os to any one disk by spreading the load over
    several drives is important and can sometimes help a slow system — without the
    need for a CPU upgrade.


    # Using multiple swap partitions


    If your system is paging and swapping heavily and you can''t afford more memory,
    try creating multiple swap partitions and distributing them across your drives.
    This can help to alleviate de contention because your programs are swapped and
    paged across multiple drives instead of just one. On Intel systems, Linux is limited
    to 2GB per swap partition and 8 swap partitions per system.


    # Kernel Building


    One item that may be slowing down your system is a kernel that is not tailored
    to your hardware or your needs. A nontailored kernel has two major causes:


    +   - Your kernel was compiled for a processor you don''t have.

    - Your kernel contains more instructions and data than you may need.


    This section describes both cases and what you can do to change the situation.


    # Tailoring a kernel for your processor


    Linux distribution kernels were compiled to install onto the largest range of
    systems. Therefore, they are compiled to run on the slowest processor of a particular
    architecture (Intel, Alpha, and so on). In the Intel side of the house, this typically
    means that the installation kernel (the one you install from the CD-ROM or the
    one on the boot floppy) is made for an Intel 386 and not a Pentium III.


    To take advantage of the Pentium III power (for the most part), you need to rebuild
    the kernel portion of Linux, specifying the processor you have to do this:


    +   1. Log in as root.

    2. Type cd /usr/src/linux at the system prompt.'
