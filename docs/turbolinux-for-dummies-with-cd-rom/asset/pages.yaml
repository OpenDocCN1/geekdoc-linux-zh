    - Logging out and locking GNOME


    In 1984, MIT Project Athena was trying to develop a computer system that could
    deploy over thousands of computers tied together by networking. Bob Scheifler
    of MIT and Jim Gettys of Digital Equipment Corporation built on earlier work performed
    at Stanford University by Brian Reid and Paul Ascente (also of Digital Equipment
    Corporation). Brian and Paul''s work was called W, of course Bob and Jim named
    their X. This work, with the work of thousands of other people and companies,
    eventually developed the X Window System, the graphical interface to the Linux
    operating system as well as many other operating systems.


    More recently the fine GNU people (technically the GNU Project) introduced the
    GNOME Network Model Environment — GNOME. GNOME is a graphical desktop environment
    that is easy to work in and modify to your own taste. The Enlightenment window
    manager is used together with GNOME and X to give you a complete graphical environment.
    Enlightenment provides the look and feel for your system. The line where GNOME
    starts and Enlightenment ends get blurry, so in order to keep things simple, in
    this book the combination GNOME/Enlightenment is referred to as simply GNOME.


    In this chapter, you find some basic ways to work in X and GNOME. You start by
    learning some of each system''s basics. Then you mess with the GNOME panel and
    desktop; the *panel* is similar to the taskbar on a Windows'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 196 Part III: Using TurboLinux


    computer. Later, you fool around with simple maneuvers, such as moving windows,
    changing their size, bringing them to the forefront, and hiding them in the background.
    You finish by locking your screen, logging off GNOME, and finally stopping X altogether.


    # Introducing the Amazing X Window System


    X Window System is also referred to as X Windows or simply X. We refer to it as
    X from here on out. X has three main parts:


    +   - A graphics server — the X Server

    - A set of graphics libraries

    - Numerous graphics clients — X clients


    The X Server is responsible for converting the graphical information that the
    X clients send it into the pixels displayed on your screen (it''s also responsible
    for responding to input from your keyboard and mouse). Pixels are the individual
    dots on your screen that when put create an image. The terminology can be confusing
    because one normally thinks of server as a computer running an application for
    one or more client computers. In the case of the X Server, however, it''s the
    X client who is running the application for the X Server.


    The X Server is not part of the TurboLinux operating system, as is in some other
    operating systems. Instead, X Server is a user-level program — a special and complex
    one. A user-level program doesn''t have any special privileges and can''t control
    other processes that don''t specifically allow themselves to be controlled. A
    system-level program, on the other hand, has special privileges and can control
    other processes.


    Three main types of programs use X:


    +   - Window managers

    - Terminal emulators

    - General applications


    # But I don''t do windows!


    Window managers like Enlightenment are programs that receive commands indirectly
    from the user through mouse clicks and keystrokes. The window manager passes those
    commands to X. X then communicates with the X'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Chapter 11: Getting to Gnow GNOME and X


    server to manipulate windows on the graphics device, which is usually your screen.
    TurboLinux uses Enlightenment as its default window manager.


    The window manager acts like a playground monitor; it''s the central point of
    control for the major windows seen on the screen (and even some windows that can''t
    be seen). The window manager behaves a whistle when a window gets unruly. The
    window manager can also serve as a desktop, where you can use it to launch applications.
    A window manager isn''t necessary, but it would be difficult to use more than
    one or two applications at once without also using a window manager. (The applications
    would need to be written to allow resizing, window positioning, and so on.)


    Here are some typical manipulations:


    +   * Move a window around a screen

    * Make a window smaller or larger

    * Overlap a window with another

    * Bring an overlapped window into full visibility (called raising a window)

    * Send a window into less visibility (called lowering a window)

    * Make a window very small but still accessible (called iconifying a window)


    Window managers may also maintain an icon bar, which keeps icons easy to find
    and manage, as well as performs other functions. The most important thing to remember
    about window managers in X is they are user-level programs like any other. They
    are not part of the system. You have a choice of window managers, and each has
    different capabilities, although a discussion of these window managers and capabilities
    is outside the scope of this book.


    # With these smarts, why should I play dumb?


    The second main category of program under X is the terminal emulator, a program
    that emulates dumb character-cell terminals. You may be wondering why you would
    want to simulate a dumb, inexpensive terminal when you paid a lot of money for
    a few graphics monitor. Shouldn''t every program be graphical?


    In the early days of X, few graphical programs were available. Most programs were
    written to run on character-cell terminals and did not include the libraries that
    create graphical programs on X Server. Therefore, to run both character-cell and
    graphical programs, the dumb terminal had to be emulated through software. The
    main terminal emulator in Linux is xterm. The xterm simulates both a Digital VT102
    and a Tektronix 4014 terminal. Most character-cell programs were written to drive
    these terminals.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 198 Part III: Using TurboLinux


    If you start xterm, it executes a shell and gives you a command-line prompt. You
    type commands, and the results are output to the window containing xterm. You
    can use xterm to start the execution of a totally graphical-based program such
    as xedit or xid by by typing the name of that graphical-based program on the command
    line presented by xterm.


    # Now the good stuff!


    The third main type of program that use X is the general application, and this
    can range from browsers like Netscape to games such as Doom or Quake. These programs
    would be impossible, or at least pretty boring, when run on a character-cell terminal.


    TurboLinux comes with several nifty applications, such as


    +   - File Manager: Well, it manages your files! Couldn''t guessed that!

    - Address book: A Roll-o-dex-like address book.

    - Calendar: A calendaring program.

    - gnotepad+: An intermediate-level text editor.

    - GTimeTracker: A project time organizer.

    - Gnumeric Spreadsheet: A simple but effective spreadsheet program.

    - The Gimp: A powerful graphics manipulation and screen capture system.


    # Two interfaces in one


    The Linux operating system comes with two interfaces in one, making use of both
    a command-line interface (like that found in MS-DOS) and the graphical interface.
    X is said to "sit on top of" the command-line operating system, allowing total
    access to the operating system through a command-line interface as well as you
    through a graphical interface. (Some operating systems provide you with only a
    graphical interface.)


    TheLinux For Dummies CD-ROM includes several window managers, including GNOME,
    KDE, and the previous standard, Fvw95. GNOME is the default in this book. KDE
    is similar to GNOME in that it is a modern system, but we leave it up to you to
    explore. You can also use old Fvw95 to start applications (and stop them of course),
    move windows, shrink windows, expand windows, and everything but wash windows.
    Just think, you can use your TurboLinux system without ever typing a command!


    ![](img/8ae48244df88d68913b10871643fd825_223_0.png)'
