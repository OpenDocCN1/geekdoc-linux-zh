  md: '# Part II: Installing TurboLinux


    # All about files


    Linux, unlike Unix, refers to everything as a file. In other words, the name for
    a device such as a hard drive is the file address of its driver. For example,
    /dev/hda is the name of the first IDE hard drive and /dev/sdb is the name of the
    second SCSI hard drive.


    different parts of the file system. Since Linux doesn''t use letters to designate
    each drive, it simply inserts them into the tree. For instance, /dev/hda1 may
    be mounted at /, /dev/hda2 is mounted at /home. This means that all of the files
    in the /home directory reside on the partition /dev/hda2, and all of the rest
    are on /dev/hda1. The directory to which a partition or drive is mounted as a
    mount point.


    Linux refers to disks and partitions using a system of lists and numbers, which
    may seem confusing to the DOS or Windows user. Following is a short description
    of the naming conventions for hard drives and partitions.


    Letters refer to the device on which the partition is located. IDE drives, for
    example, are named hda, hdb, hdc, and so. SCSI drives are referred to as sda,
    sdb, sdc, and so on. The hd stands for hard drive, and the sd stands for SCSI
    drive.


    Normally, you need at least a root partition in your directory structure and a
    swap space (particularly if you have a system with 16MB RAM). Therefore you should
    set up a minimum types of disk space: a Linux file system starting at the root
    and a swap space. Theoretically, you do not have to set up swap space, some people
    do not. If you do, you can run more programs than you have real memory or use
    sizes greater than the real memory you have on system.


    Numbers designate the partitions. Linux supports only four partitions, but one
    may be an extended partition — that is, subdivided into more logical partitions.
    The numbers 1, 2, 3, and 4 denote partitions; the logical partitions start at
    5. /dev/hdb3 is the name for the third partition on the second IDE hard drive.
    In a SCSI world, /dev/sdc6 is the name for the second logical partition on the
    third hard drive.


    As mentioned, it''s better to set up a separate partition for your user files
    (usually the /home directory), and better still to set up multiple partitions
    for your Linux. This makes it easier to back up your files and update your system
    to new versions of Linux. The downside is that you have to leave empty space in
    each partition for new files, and these empty spaces add up.


    The Linux file system (represented by the upside-down tree in Figure 5-4) is made
    up of one or more partitions that are mounted to


    With cdisk, you will be able to see all the partitions. You may want to delete
    one or more of the other partitions, or carve them into smaller partitions for
    Linux, or both. This all is covered in the following instructions about cdisk:


