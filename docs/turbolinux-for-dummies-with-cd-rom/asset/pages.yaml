    # Character-Cell or Graphical?


    Linux applications are available not only as free and nonfree applications, but
    also as character-cell and graphical applications. Character-cell applications
    are textual types of applications in which you type a command and the system responds.
    MS-DOS is an example of a character-cell operating system. In a graphical application,
    you use the mouse as well as the keyboard to tell the computer what to do. Microsoft
    Windows is a ubiquitous example of a graphical operating system. The graphical
    portion of Linux is called X System.


    If you use X Window System (which is referred to most often as simply X) and your
    system is running out of main memory or disk space, try switching Linux to character-mode.


    Unix started out as a character-cell operating system and had graphical window
    systems added to it. Linux inherited both character-cell and graphical features
    from Unix.


    You will probably spend most of your time using Linux in its graphical mode. Many
    Linux character-cell applications, however, were created before the age of X or
    simply work better in character-cell mode. In Chapter 10, you can see a bunch
    of applications that work very well in character-cell mode.


    If you''re using a laptop for short periods of time (to take notes in a meeting,
    for example) and find the startup time for X and its associated programs is too
    long, you may want to opt (as I do) for character-cell mode.'
