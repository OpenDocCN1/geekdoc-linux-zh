  md: '# 68 Part II: Installing TurboLinux


    +   * If you have no IDE drives but do have SCSI drives, the root partition must
    be on either ID 0 or ID 1; no other SCSI ID will work.


    +   * Your Linux kernel must live below cylinder 1023. This requirement is because
    the BIOS can''t("see") things far out on the disk, beyond the 1023rd cylinder.
    The major booting process for Linux, called LILO, depends on the BIOS for its
    functions; if the Linux kernel is beyond cylinder 1023, LILO can''t find it and
    start the booting process.


    On IDE drives, cylinder 1023 is generally below the 512MB mark; for SCSI drives,
    it is usually below the 1GB. If you are using larger hard drives, you''re probably
    okay. Otherwise, you will probably need to take this issue into account as you
    are installing the system. The easiest way to ensure that the kernel is located
    on cylinders 0 to 1023 is to specify this with the `fdisk` program when you get
    to disk partitioning. Newer versions of BIOS support Logical Block Addressing
    (LBA), so they may not have with this limitation. By using LBA, you can fool the
    BIOS into seeing the disk as having less than 1023 cylinders.


