  md: '# Chapter 8: Working with Files and Commands 147


    # # Have It Your Way


    Most commands for your TurboLinux system are flexible and can be modified to perform
    special tasks. You can use two devices to alter a command: command options and
    standard input and standard output redirection. You find out about command options
    first.


    You can use command options to fine-tune the actions of a Linux command. We introduced
    the ls command, so you could see the results of actions taken on the file system,
    but we didn''t explain how it worked or how its options changed what it did. To
    see how options work, in the next example you you try out the ls command several
    times with different options.


    Use the mkdir command to make a new directory called gregger, and then use the
    cd command to change your working directory to that new directory:


    ```

    [maddog@localhost emptydirectory]$ mkdir gregger

    [maddog@localhost emptydirectory]$ cd gregger

    ```


    At the Linux prompt, type ls as follows:


    ```

    [maddog@localhost gregger]$ ls

    [maddog@localhost gregger]$ ls

    ```


    That didn''t do much, did it? It seems as if the account has no files. You may
    need an option. Try the -a option and see what happens:


    ```

    [maddog@localhost gregger]$ ls -a

    [maddog@localhost gregger]$ ls

    ```


    Remember to type the commands and options exactly as shown. For example, the ls
    -a command has a space between the command and the option, and no space between
    the hyphen and the letter a.


    Notice the two files (they''re actually directories, but in Linux all directories
    are just files) that the ls command displayed. What all you see are dots? Well,
    the single dot represents the directory you are in; the double dot represents
    the parent directory, the one above the directory you''re. TurboLinux creates
    these filenames and puts them into the directory for you. If you just installed
    your directory, all you have are files that begin with a period.)


    Now let''s create a few additional files in the /gregger directory, using the
    touch command:


    ```

    [maddog@localhost gregger]$ touch file1

    [maddog@localhost gregger]$ touch .dotfile

    ```


