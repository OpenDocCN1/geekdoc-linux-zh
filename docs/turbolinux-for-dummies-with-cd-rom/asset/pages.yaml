  md: '# 194 Part III: Using TurboLinux


    To find all the programs running under the shell you are currently using, you
    can use the jobs shell command as follows:


    ```

    [maddog@localhost]$ jobs

    [1]+ Running ical &\n[maddog@localhost maddog]$ ]

    ```


    This tells you that ical is job #1, is running fine (thank you), and is not waiting
    for any input from the console, and is just having a great old time.


    On the other hand, you could have another job (such as largejob) that you''ve
    put temporarily into the background simply by putting the & at the end of the
    line:


    ```

    [maddog@localhost maddog]$ largejob &

    ```


    When you type jobs as a command in this case, you would see that large-job was
    stopped, waiting for input or for some other reason:


    ```

    [maddog@localhost maddog]$ jobs

    [1]- ical &

    [2]+ Stopped (tty1) largejob

    [maddog@localhost maddog]$

    ```


    You could bring largejob into the foreground by typing fg %2 and giving it more
    input, and then put largejob back into the background by pressing Ctrl-Z and typing
    bg. Whew. Here''s how it works:


    ```

    [maddog@localhost maddog]$ fg %2

    largejob

    MADDOG tries hard.

    [2]- Stopped largejob

    [maddog@localhost maddog]$ bg

    [2]+ largejob &\n[maddog@localhost maddog]$

    ```


    You could have dozens or even hundreds of background processes. If they all accepted
    data from the keyboard at the same time, how would you know which program is receiving
    the data? Therefore, each program has to wait until you recognize it, bring it
    into the foreground, enter the necessary data, and then put it back into the background,
    where it blissfully keeps running until it terminates or needs input from the
    keyboard (or standard input, as you have come to know it). Now you know why largejob
    was waiting to accept such valuable and timely input.'
  merge: -1
