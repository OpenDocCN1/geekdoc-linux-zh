  md: '# 84 Part II: Installing TurboLinux


    We suggest that you select the Check for Bad Blocks During Format option, which
    instructs Linux to check for bad blocks while formatting. Note, however-ever,
    checking for bad blocks on large disk partitions takes a long time and the process
    must be run to completion. On the upside, waiting for the process to finish is
    a great excuse for indulging in your favoritecomputer activity.


    After you have indicated which file systems you formatted and you want the disk
    checked for bad blocks, press the Tab key until the Ok button is selected, and
    then press Enter. When the file systems are formatted, a screen appears allowing
    you to configure your network.


    # Configuring network components


    The next dialog box you see is shown in Figure 5-20, asking you to configure TCP/IP
    (Transport Control Protocol, Internet Protocol — the method used by computers
    to communicate over the Internet and many other networks). You may need to consult
    your network administrator or ISP for some of this infor-mation, depending on
    your network configuration.


    ![](img/8ae48244df88d68913b10871643fd825_109_0.png)


    Figure 5-20: The TCP/IP dialog box.


    When you are done entering the required information, tab over to the Ok button
    and press Enter. TurboLinux attempts to get hostname information for your computer
    from the nameserver you provided — don’t worry if this fails: you can just up
    a hostname to suit if you haven''t got one assigned. Justin generally uses computername.home.lan
    for computers on his home LAN: for example turbo.home.lan, as shown in Figure
    5-21. You can safely leave the secondary and tertiary nameservers blank in most
    cases.'
  merge: -1
  pgno: 109
