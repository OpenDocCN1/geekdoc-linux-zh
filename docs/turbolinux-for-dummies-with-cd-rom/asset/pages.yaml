  md: '# Identifying your new hard drive


    After the new hard drive is attached to your system, Linux recognizes it when
    you boot. To review the booting messages in a slower fashion they are displayed
    when you boot, use the dmesg command. If you added a new IDE drive, look for the
    mention of a new hdx drive, where the x is replaced with the letter b, c, d, or
    e. This tells you that your Linux kernel “saw” the new disk as it booted, and
    rebuilding the kernel is not necessary to add this. Likewise, if you are adding
    a new SCSI disk drive, you see a boot message indicating a new disk drive that
    has the designation sdb, where the x is a letter. In either the IDE or SCSI case,
    you may see other messages with additional information.


    The dmesg command is a convenient way of showing the information that was displayed
    when you boot your Linux computer — the detected hardware, file system, and other
    stuff. This information is stored in the /var/log/dmesg file.


    The messages for an IDE drive may look like this:


    ```

    hdb: HITACHI_DK227A-0, 4789MB w/512KB Cache, CHS=610/255/63

    ```


    And sometimes later, you see a message that looks like the following, which describes
    the existing partitions on the new disk (if any):


    ```

    hdb: hdb1 hdb2 < hdb5 hdb6 hdb7 hdb8 >

    ```


    A SCSI disk drive has messages that look like this:


    ```

    SCSI device sdb: hdwr device= .......

    sdb: sdb1

    ```


    If you see these messages, the Linux kernel has seen your new disk, and you don’t
    have to rebuild the kernel to use the new disk.


    ```

    cd /dev; makedev std

    ```


    This creates the block special files for SCSI disk 7. Note that in both IDE and
    SCSI disks, the letters and disk numbers correspond: a for the first disk, b is
    the second disk, and so on.


    If you add a SCSI disk with a lower ID number than the one you already have, the
    new disk takes over that number. Suppose you have SCSI disk drives with hardware
    ID numbers of 0, 2, and 3. Linux gives these disks names sda, sdb, and sdc, respectively.
    You make your partitions and your file systems and create your entries in the
    /etc/fstab file to show where you want the file systems mounted. Now you get a
    new disk drive and set the hardware ID number to 1. When you reboot, the new disk
    gets the sdb designation, and the disk drives with ID numbers of 2 and 3 are renamed
    to sdc and sd'
