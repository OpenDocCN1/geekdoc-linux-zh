  md: '# vi(1) Commands


    vi filename Invokes vi text editor, inserting before the current position


    i Enter insert mode, inserting at the beginning of the current line


    a Enter insert mode, inserting after the current position


    A Enter insert mode, inserting at the end of the current line


    <Esc> Return from insert mode to command mode


    x Delete a character while in command mode


    cw Delete the word before the current position, and put the editor in input mode


    :w Write the file out


    :q Quit with no additional writes to the disk


    :wq Write back the file, and then quit


    :q! Quit the file with impending changes unwritten


    /string Search forward through the file for the string


    ?string Search backward through the file for the string


    n Find the next string (either forward or backward)


    u Undo the last command


    # A Few System Administration Commands


    mount Mount a file system, connecting a disk or a floppy section to the tree


    umount Unmount a file system, making it ready to be removed from the system


    fsck File system check of the structure and integrity of the file system


    mkfs Put a directory structure on the low-level formatted disk


    shutdown Shut the system down now, instead of waiting for a message to be sent;
    Ctrl+Del does the same thing


    vmstat Look at the virtual memory performance


    procinfo Gather information about processes


    # File Permissions


    -f rwr wwx Read, write, execute permissions for user, group, and other (the world)
    — mode 777


    drwxr-xr-- A directory that is completely open to its owner and can be read and
    searched (but not searched) by the world — mode 754


    crw-r--r A character special file that the owner can read or write to but the
    group and the world can only read — mode 644


    brw------ A block special file; only the owner can read or write to it — mode
    600


    # For Dummies*: Bestselling Book Series for Beginners'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# A Few Good Commands


    cd directory Change the current directory to directory


    ls List the directory


    ls -l List the directory, along with sizes, permissions, ownership, and dates
    of files


    ls -a List all files, including invisible files (files whose name begins with
    a period)


    pwd Print the working directory (the one you are in)


    rm file Remove file


    mkdir Make a new (empty) directory


    rmdir Remove an empty directory


    cp Copy a file


    mv Move (or rename) a file


    cat Concatenate files


    more Paginate a file


    less Paginate a file


    touch Make a new (empty) file, changing the access date of an existing file


    chown Change the owner of a file or a directory


    chgrp Change the group of a file or a directory


    chmod Change the permissions of a file or a directory


    sort Sort a file in a particular order (depending on the option)


    echo Echo what is typed after the command back to the screen


    date Read the date and time (without an argument); set the date and time (with
    an argument)


    cut Break a wide file into multiple narrow files


    sed Stream editor for large files or real-time editing


    ln Link a file to another name


    grep Searching program that uses general regular expressions to find data, and
    then prints it to its output'
