  md: '# 88 Part II: Installing TurboLinux


    +   * The first sector on your root partition (the partition of the disk that
    holds the beginning of the Linux file system and the kernel of the operating system)
    is the recommended place if you are using another bootstrap loader (such as System
    Commander) on your system. You set up that loader to boot LILO and then have LILO
    Linux. For making your other bootstrap loader know LILO, please refer to the documentation
    for the other bootstrap loader.


    +   * The first sector of a floppy disk is the recommended place if you are using
    a less flexible bootstrap loader (such as Windows NT''s NTLoader) on your system.
    You can configure NT to boot LILO, but it''s a long, drawn-out process, and we
    don''t cover it.


    2. Tab over to select the Ok button and press Enter.


    The dialog box shown in Figure 5-24 appears. This screen provides additional information
