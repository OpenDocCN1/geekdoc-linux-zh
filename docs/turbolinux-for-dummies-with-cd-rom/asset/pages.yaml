  md: '# 50 Part II: Installing TurboLinux


    Next, we tell you all the exciting details for creating boot and supplemental
    disks.


    # Making installation disks in MS-DOS


    If you have a Windows 3.x (including Windows 3.1 and 3.11 for Workgroups) or 9x
    (including Windows 95 or 98) system, you can use it to read the TurboLinux For
    Dummies CD-ROM and create boot and supplemental floppies. The CDs include a program
    called RAWWRITE.EXE, which you can use to make the floppies.


    ![](img/8ae48244df88d68913b10871643fd825_75_0.png)


    First, you need a formed, high-density (1.44MB) 3½inch floppy for each disk you
    plan to create (The boot floppy and possibly the supplemental floppy). Then place
    the TurboLinux For Dummies CD-ROM into your CD-ROM drive.


    In these instructions, I assume that your CD-ROM is drive D and your floppy drive
    is A. If your drive letters are different, substitute D and A in the example with
    the appropriate letters for your system.


    Next, change to the directory on the CD drive or other hard drive where RAWWRITE.EXE
    is stored, and follow:


    ```

    C:> D:

    D:\> cd dosutils

    D:\>DOSUTILS\> rawwrite

    Enter disk image source file name: d:\images\boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and press

    ENTER- <Enter>

    D:\DOSUTILS>

    ```


    Now you can use the RAWWRITE program again to copy the supplemental and extra
    hardware images to the other blank disks. Remove the boot floppy (label it Boot
    Floppy so you know what it is) and replace it with another floppy disk, which
    you may label Supplemental Disk. Then do the following (repeat for extra hardware
    floppy, substituting extrahw.img for supp.img):


    ```

    D:\DOSUTILS\> rawwrite

    Enter disk image source file name: d:\images\supp.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and press

    ENTER- <Enter>

    D:\DOSUTILS>

    ```'
