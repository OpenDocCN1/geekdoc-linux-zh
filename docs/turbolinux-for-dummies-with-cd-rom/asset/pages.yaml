  md: '# Chapter 18


    # # Ten Problem Areas and Solutions


    In This Chapter


    +   - I can''t boot TurboLinux anymore

    - My disk numbers changed since installation

    - My CD-ROM isn''t detected

    - I don''t know how to remove LILO and restore my MBR

    - I can''t use LILO to boot

    - The ls command doesn''t show files in color

    - Linux can''t find a shell script (or a program)

    - When I start X, I see a gray screen

    - I don''t know how to make X start at boot time

    - I never seem to have the correct time


    In any complex, technical situation, people end up having problems and issues
    they need help with. The problems in this chapter were taken from a database of
    questions and answers created after hundreds of people installed the CD-ROM. Some
    of these questions have been answered in the rest of the book, but because they
    still generate "what happened" questions, we repeat the information here.


    # # I Can''t Boot TurboLinux Anymore


    **Problem:** You''ve installed TurboLinux and everything is fine (naturally).
    Then one day you make a change to your Windows 9x or Windows NT 4.0 or 2000 system,
    and Linux stops working. You no longer see the lilo boot prompt, so you can no
    longer specify that you want to boot Linux.


    **Solution:** Various operating systems tend to think that they are the only operating
    system on the disk or on the system. Therefore, when they are installed or updated,
    they write things to an area of the system called the master boot record (MBR).
    This process overlays the boot loader (called LILO) and stops you from booting
    TurboLinux. The best correction is an ounce of the'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'prevention: Make an emergency boot floppy disk, as we instruct you to do during
    installation. Keep this disk handy when you update your system (or during any
    other significant system event, such as repartitioning disks or rebuilding your
    kernel). Then, if you make a mistake, you can boot the floppy, which will enable
    you to reboot your Linux operating system. When you''ve rebooted your system using
    the floppy, just log in as root and type lilo on the command line. This repairs
    the MBR by reinstalling LILO.


    ![](img/8ae48244df88d68913b10871643fd825_333_0.png)


    If you are installing multiple operating systems on a new machine, do your-self
    a favor and install TurboLinux last. Otherwise, you have to keep rein-stalling
    LILO.


    # # My Disk Numbers Have Changed Since Installation


    Problem: Linux numbers disks each time it boots, calling SCSI disks names like
    sda, sdb, and sdc. Suppose that sda holds your Windows system, sdb holds the bulk
    of TurboLinux, sdc holds your user files, and sdd holds your swap space. Now you
    add another disk and your user files are on sdd and your swap space is on sde.
    The new disk is called sdc but has not-hing on it. What happened?


    Solution: SCSI disks are lettered according to the SCSI IDs set on each disk.
    TurboLinux names the disks using this ordering scheme. If you insert a new disk
    into the SCSI bus with a SCSI ID that is lower than an existing disk, you rename
    all disks with a SCSI ID number above the one you just installed. It''s best to
    start installing your SCSI disks with a SCSI ID of 0, 1, 2, and so on; then put
    other devices at the other end of the SCSI bus IDs 6, 5, 4, and so on). Note that
    most SCSI controllers are set to SCSI ID 7 by default.


    IDE disks are numbered according to the IDE controller they are and whether they
    are a master or a slave on that controller. Therefore, adding a new disk to a
    set of IDE controllers will not change the existing names, as shown here:


    | Controller | Disk | TurboLinux Name |

    | --- | --- | --- |

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |

    | ide1 | slave | hdd |

    | ide2 | master | hde |

    | ide2 | slave | hdf |'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 18: Problem Areas and Solutions 309


    ```

    ide3 master hdg

    ide3 slave hdh

    ide0 = primary controller

    ide1 = secondary controller

    ide2 = third controller

    ide3 = fourth controller

    ```


    # # My CD-ROM Isn’t Detected


    **Problem:** You''re installing TurboLinux, but it doesn’t find your CD-ROM.


    **Solution:** Most newer CD-ROMs are either EIDE (ATAPI) or SCSI, and most newer
    computer systems have enough support to see either the ATAPI CD-ROMs or the SCSI
    CD-ROMs, so CD-ROM support is not quite an issue as in the early days. In addition,
    some older systems and CD-ROMs are not supported.


    Some early CD-ROMs pretended to be other devices (such as tape drives or floppies)
    to fool the computer system into using them, but these CD-ROMs were hidden from
    the detection system. If your system is one of these, don''t despair! You can
    supply information to help Linux find your CD-ROM.


    First look at the preceding section about disk numbering. This lets you figure
    out the name TurboLinux would call your CD-ROM if TurboLinux knew about it. If
    you have an EIDE/ATAPI CD-ROM, type the following line whenever you see the boot
    `init:1` prompt while booting or installing your system:


    ```

    linux hdx-cdrom

    ```


    where *X* is the number your CD-ROM would have if it could be detected. For example,
    if it is connected to the second IDE controller, *hdb*, then type the following
    line:


    ```

    linux hdc-cdrom

    ```


    # # I Don’t Know How to Remove LILO and Restore My MBR


    **Problem:** You don’t know how to replace the boot record that was on your system
    before you started installing TurboLinux.'
  merge: -1
