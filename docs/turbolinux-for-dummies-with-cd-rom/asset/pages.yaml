  md: '# # Chapter 3


    # # Discovering What''s in Your System


    In This Chapter


    +   - Figuring out the resources TurboLinux requires

    - Unearthing the type of hardware you have


    The sole function of this chapter and the three that follow is to help you install
    your system. If your TurboLinux system is already installed, count your lucky
    stars and check out one of the chapters after Part II. If you haven''t installed
    your system, console yourself with the fact that you will find out a lot this
    chapter and will be the better for later. Your computer will not seem like such
    a stranger because you will find out what lies inside it. (You can also use your
    newfound knowledge to impress friends at parties.)


    I would like to dispel a myth that Linux is harder to install than Microsoft Windows.
    I believe that Linux is no harder to install than any other operating system.
    I''ve tried on several occasions to install Windows 95 from the beginning, and
    have met with frustration due to Plug and Play (often derisively called "plug-and-pray")
    or because drivers were always on the "other" disk (no matter which disk I had).
    Windows seems easy to install because it''s usually preinstalled, because most
    people only update it, and people who do install it have all the hardware documentation.


    If you''re the rare reader who is buying a system just for TurboLinux, look up
    a hardware supplier on the World Wide Web or in a Linux magazine and ask them
    to build a compatible system for you.


    If you''re like most readers, however,


    +   - Want to install TurboLinux to your existing hardware

    - Want to use your existing disks

    - Want to keep MS-DOS, or Windows, or both on your system


    You''ve chosen the most adventurous type of installation. Don''t worry, though,
    because we''re here to guide you through it.'
