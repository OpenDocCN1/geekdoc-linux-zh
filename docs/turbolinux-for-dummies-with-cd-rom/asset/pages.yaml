  md: '# Chapter 14: Customizing TurboLinux 249


    Linux sets aside a certain amount of main memory in its dynamic buffer cache to
    hold data moving from the disk to the CPU and vice versa. When data is read from
    the disk, it first goes into the dynamic buffer cache. Usually, more data than
    was originally requested goes into the cache (in a process known as readahead).
    When more information is needed, the CPU can just go to the buffer cache and get
    the data quickly, without having to wait for the disk. When data is written to
    the disk, it often goes only as far as the buffer cache, where it sits until it
    is needed again or until the buffer cache is told to write its data out.


    # Sync or swim


    In the preceding section, you find out about the dynamic buffer cache, which is
    used to reduce the number of physical accesses to the disks. The operation of
    syncing the file system is a request - initiated by the user or a program in Linux
    - to write the dynamic buffer cache out to the disk (also nonvolatile memory)
    for keepsake rather than leaving it in RAM (also volatile memory). If a sync were
    never performed, some data might stay in RAM forever, without ever being out to
    the drive. If this happened, the system crashed (due to a power failure, of course),
    you wouldn''t know whether data ever made it to the drive. When you execute a
    sync command, you request that the system write out all this data. Unless something
    is radically wrong, the system writes out most or all the data in the next few
    seconds. Then the buffer cache is empty and starts to fill again, if necessary.


    In Linux, the process of flushing the dynamic buffer cache has been given to a
    daemon (a program that runs in the background and does things for the user transparently)
    bdflush, which flushes data every 30 seconds or so. Smaller, crucial pieces of
    data go out every five seconds. (This is why your Linux system does something
    every few seconds, even when you''re not doing anything with your system.) Unless
    your hard drive fails, the work bdflush means that you may have a significant
    loss of data. bdflush normally starts automatically when you boot Linux.


    The dynamic buffer cache shares RAM with the virtual memory subsystem, VM. As
    VM becomes more active and needs more RAM to be efficient, your dynamic buffer
    cache tends to become smaller, giving up its memory to the VM subsystem. As the
    buffer cache becomes smaller, the I/O load on the disks tends to get heavier.
    Each disk on your system probably experiences more I/Os, but in an uneven fashion.
    When things quiet down and VM has a lot free RAM, the memory is automatically
    given back to the dynamic buffer cache.


    ![](img/8ae48244df88d68913b10871643fd825_274_0.png)'
