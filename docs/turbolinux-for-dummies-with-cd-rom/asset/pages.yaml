    # Grant You Permission


    Files and directories in TurboLinux have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    access to files. Permissions can also be used to determine whether a file is executable
    as a command and who can use the file or command. It is important to know even
    if you are the only one who uses your system, there are commands and databases
    by other users, including root (the superuser). Permissions on these files either
    allow or disallow the general user, to update or even access these files.


    Using the ls -l option allows you to see the permissions of the files, along with
    other relevant information, such as who has permission to access or modify the
    file, the size of the file or directory, the last time the file was modified,
    and the name of the file.


    First, create a file with the touch command. The touch command is used for many
    things inside the Unix and Linux communities, and one thing it is for creating
    a little zero-length file:


    ```

    [maddog@shamet maddog]$ touch partytime

    [maddog@shamet maddog]$ ls -l Oct 31 16:00 partytime

    --rw-r--r-- group 0 16:00 partytime

    ```


    The -rw-r--r-- are the permissions for the partytime file: the owner is you, and
    the group is probably you, but could be someone or something else, depending on
    how your system is set up and administered.


    You may be wondering how you can become an owner of a file. Well, you are automatically
