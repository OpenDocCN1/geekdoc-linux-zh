  md: '# Reforming Corrupted File Systems


    The repairs fsck can perform are limited to structural repairs of the file system
    and its data components. If you have corrupted data in a structurally intact file,
    fsck can''t help you. Also remember that, except for the root file system, fsck
    runs on only unmounted file systems. You must make sure that the system is in
    single-user mode to use fsck on the root file system.


    Here''s the syntax for the fsck command:


    ```

    fsck [options] filesystem

    ```


    where filesystem names the block special file where the file system resides. If
    filesystem is omitted, the fsck utility checks all file systems listed in /etc/fstab
    configuration file. If the fsck utility finds any errors, it prompts you for input
    on what to do about the errors. For the most part, you simply agree with whatever
    the program suggests.


    The fsck command has the following options:


    +   - -p — Clean the file system. Perform automatic repairs that don''t change
    the contents of files.

    - -n — Answer no to all prompts and only list problems; don''t repair them.

    - -y — Answer yes to all prompts and repair damage regardless of how severe.

    - -f — Force a file system check.


    A lot of people run the fsck command with the -y option. some steps are automatically
    performed for you. If you run fsck with the -p option, files are placed in the
    lost-found directory, zero-length files are deleted, and missing blocks are placed
    back on the list of free blocks, which are blocks available for filling with data,
    among other things.


    Suppose that your electricity went out and your system crashed. As the system
    reboots, you see messages similar to the following:'
