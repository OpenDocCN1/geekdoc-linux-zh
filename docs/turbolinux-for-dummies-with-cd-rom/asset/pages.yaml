  md: '# Chapter 17: Ten Sources of Help 303


    This list is not exhaustive. You can find many more URLs in some of the Web sites
    mentioned here.


    Opinions in some of the lists are for mature audiences only. Most of the lists
    are moderated and most of the opinions are mature, but people sometimes get carried
    away.


    ![](img/8ae48244df88d68913b10871643fd825_328_0.png)


    # Attend Conferences


    You can attend a number of conferences and trade shows for more information on
    Linux. All these shows are accurate as of the time we''re writing this, but events
    may change. Where possible, we''ve listed the more general Web addresses for these
    events. You may have to do a little Web surfing for the next event of the year.
    If you get stuck, try the Linux International Web site, which has an Events page
    that lists new events.


    # Linux Kongress


    Linux Kongress is the oldest Linux event. Held in Germany every year, it''s a
    technical conference with a small trade show. The Web site is www. linux-kongress.de.


    # Linux Expo


    Linux Expo is held every spring and late summer in locations throughout the United
    States. It''s a technical conference, trade show, and a Linux aforementioned wonderland
    all wrapped in one. The last show was held in New York City in February 2000 and
    had thousands of attendees and dozens of vendors in attendance. The Linux Expo
    Web site is www.linuxexpo.com.


    # USENIX/FREEIX


    USENIX, a technical organization that has long supported Unix people, has several
    technical conferences and small trade shows per year on various topics. A few
    years ago, a separate set of presentations, FREENIX, was created for freely distributed
    operating systems as Linux. If you''re interested in a good technical conference
    that attracts Unix giants such as Dennis Ritchie, or you are a Linux developer,
    you may want to take a look at www.usenix.org.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 304 Part VI: The Part of Tens


    # CeBIT


    CeBIT, the largest computer trade show in the world, is held yearly in Hannover,
    Germany. It often draws more than 600,000 people. Last year, Linux International
    (www.li.org) had a booth along with several other Linux ven-dors and drew more
    than 3,000 people. CeBIT is mostly a trade show, with very little (if any) conference
    sessions on Linux. To find out more about CeBIT, check out www.messe.de.


    # Comdex


    For the past four years, Comdex has had a Linux Pavilion, made up of an ever-growing
    show of vendors who are trying to explain to over 200,000 resellers, distributors,
    and other vendors what Linux is and how to use it. Comdex is held both in the
    spring and fall, and you can check it out at www.comdex.com.


    # IDG''s Linux World


    IDG World is a new show with conferences. The Web site is at www.linuxexpo.com.


    # Try to Help Others


    ![](img/8ae48244df88d68913b10871643fd825_329_0.png)


    After you''ve exhausted all avenues of help (or maybe even before), you should
    just try to do whatever you want to do. Often, you will find that the pieces fit
    together or that the software is not as difficult as you thought. Here are some
    tips:


    +   - If you are investigating a large software package, scan the documenta-tion
    one time and then concentrate on the necessary topics.


    I still remember the first time I Tried to learn groff(1), a powerful text-processing
    system. The documentation was daunting, and I thought I would never learn the
    package. It turns out I was right; I never learned it. But I did learn enough
    to do a few things, and that was all I needed. With these “simple things” (less
    than 2 percent of the power of the package), I could write letters, create overhead
    slides, and do the necessary text processing. When I needed another command, I''d
    look it up in a reference book.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Chapter 17: Ten Sources of Help


    +   - Create a small sample of what you want to do.


    If you''re working with a new command or part of Linux, create a small example
    of the one part of the command or software that you don''t know, and see how that
    works.


    +   - Keep it small.


    A friend named Mike Gancarz (Hi, Mike!) wrote a book The Philosophy of Unix. In
    this book, he talks about Unix systems were created and programmed in the early
    days, utilizing lots of the small, cryptic (we prefer the word terse) commands
    that lurk below the glossy interface of X. With these commands, you can create
    powerful programs shell scripts or just use the commands one at a time to transform
    your data. The main tenet of his book is to keep things simple and small.


    +   - Remember that Linux is only a piece of code and your computer is only a
    machine.


    So if you make a mistake? You''re probably running Linux on a machine that has
    only one user. That''s the great thing about Linux. It runs on inexpensive machinery
    that you can buy an old 486 computer with disk and memory in it to run Linux as
    a practice system for under $50. (I bought such a machine at a Ham Fest. Linux
    very nicely.) So if you have to reinstall your system due to some mistake you
    made, it will disturb no one else on your practice machine. You now how to install
    Linux, so no one has to know but when something goes wrong.


    Give it a try!


    Our other suggestion is to help someone else. "What?" you say. "How can I help
    someone else? I''m just a beginner in this field"


    We all started that way. No one is born with a knowledge of computer science (except
    perhaps Sean Flynn, a former student). We all pick it over time. The way to cement
    a thought or an idea, however, is to explain clearly to someone else. Helping
    others install Linux on their PC will help cement some of the concepts you''ve
    discovered. Another idea is to attend a Linux Install Fest, where lots of people
    go (with their machines) to install Linux. Here you not only get to help someone
    else, but can probably learn something from other attendees.


    A main tient of Linux is the word open. Linux is open and is best when shared.'
