    +   - Formatting text


    Everyone who writes Linux books needs a good editor. But the kinds of editors
    I talk about in this chapter are text editors, not the tweedy, frazzled publishing
    professionals who struggle mightly with books. Text editors work with text files
    to give you the ability to add, delete, search, and move text — everything from
    thousands of lines of text right down to a single character.


    Nowadays, text files are usually updated with word processors, but every once
    in a while you may have to go in and update a file with a bare-bones text editor.
    In addition, text editors create small, compact files of characters, which are
    still the cheapest way to send e-mail and store character data on disk.


    Take the time to play around with these editors, getting down the basics, because
    sometimes they may be the only thing available. Also, the ed editor is small enough
    to fit on a recovery disk, which is used to boot when all else fails. (Other editors
    such as emacs and word processors are too big to fit on a recovery floppy.) (For
    more information about text editors, see Chapter 2.)


    # Text Editor Basics


    A text editor is an essential tool for TurboLinux, enabling you to create and
    modify an array of text files, including the following:


    +   - User files, such as the login file


    +   - System configuration files, such as /etc/fstab, /etc/inittab, and /etc/lilo.conf'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# 152 Part III: Using TurboLinux


    +   - C and C++ programs

    - Shell programs

    - Mail messages


    TurboLinux comes with not one but two text editors: ed and vi. The ed editor is
    a line-oriented text editor. ed was one of the first editors for Unix systems
    and traditionally is included with every Unix and TurboLinux system; it''s also
    a small editor that can be included on small distributions of Unix and TurboLinux.
    You can always count on ed to be there. The second editor included with TurboLinux
    is vi. This full-screen editor supports the command set of a line-oriented editor
    named ex. A third major text editor for Linux is emacs; some people prefer this
    one for most of their


    In Linux, ex and vi are emulated by another text editor vim, which are indicated
    by Ctrl+. commands for vi work just fine with vim. In addition, vim has more capability
    than vi, as a separate program is not supplied with Linux systems. When you type
    vi, you are really using vim, but this is invisible to you.


    All three editors have different interfaces and capabilities, although they all
    support the following standard features: reading and writing files, searching
    text, inserting and deleting, and copying and moving text.


    We can''t detail all the options these editors offer. Before you get involved
    in some monstrous editing project, read the manual page for the editor you have.
    You may be surprised to find many handy shortcuts. Assuming you installed the
    manual pages on your TurboLinux system, you can find the manual page on the editor
    by typing the following at a command prompt:


    ```

    man <editorname>

    ```


    <editorname> is ed, vi, or emacs.


    # Two for one


    Some editors use control keys or meta keys, Meta+, respectively, in this book
    and sometimes shortened to C+ and M+. The Ctrl key is usually marked on your keyboard,
    but the Meta key may be hiding under an assumed alias, usually as the Alt key.


    When you see Ctrl-Z, for example, press and hold down the Ctrl key while pressing
    the Z key. (Don''t press Ctrl+Shift+Z.) Likewise, Meta+H means to hold down the
    Meta key (in most cases Alt) and press the H key. This really is much easier than
    rubbing your stomach and patting your head at the same time.


    ![](img/8ae48244df88d68913b10871643fd825_177_0.png)


    ![](img/8ae48244df88d68913b10871643fd825_177_1.png)'
  merge: -1
