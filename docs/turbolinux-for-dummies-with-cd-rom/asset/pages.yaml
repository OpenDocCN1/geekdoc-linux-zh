- img_proc: true
  md: '# Chapter 15


    # Interacting with the Internet


    In This Chapter


    +   - Finding an Internet service provider

    - Connecting with your modem

    - Making the connection between your modem and Internet service provider

    - Starting and stopping the Internet service software

    - Creating a simple but effective firewall


    One of the things to do these days is to surf the Net. You connect to the Internet
    and tie up your phone line for hours, looking for obscure information and sending
    e-mail to people you barely know and speak to on the phone.


    Now you, too, can go to a party and drop the casual phrase, "I found this while
    surfing the Net this afternoon . [which will draw bored looks] . on my Linux system."
    The mention of Linux immediately shows that you are truly a person of class and
    standing in the Internet community.


    First, though you have to find a good Internet service provider, hook up your
    phone to the computer (using a device called a modem), and feed a few simple commands
    to your Linux system (and the networking gods) to make the connection.


    # Locating Your ISP


    We categorize Internet service providers (ISPs) into two categories: those that
    specialize in Windows and Windows NT products and those that are good. By good,
    we mean ISPs that can handle Unix and Linux accounts.


    To find a good ISP, first look in your local Yellow Pages under Internet or Internet
    Service Providers (ISP). List the names and telephone numbers of any ISPs that
    you find. These companies are probably local companies, which is fine if you want
    to communicate only from your home. If you do a lot of traveling, you may want
    to call the following "good" national providers:'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 262 Part V: Going Online


    | Provider | Toll-free Number |

    |---|---|n| AT&T WorldNet | 800-967-5363 |

    | CompuServe | 800-336-6823 |

    | eFortress | 888-930-1030 |

    | Mindspring | 888-677-7464 |

    | SprintNet | 800-473-7983 |

    | Compuglobal Hypermeget | 555-5309 |


    Next, talk to some friends who live close to you and ask them which ISP they use
    and what they think of the service. If a service has overloaded local access numbers,
    you get busy signals a lot. Also ask about the technical help, which in some services
    is poor or nonexistent.


    Finally, call the ISPs and tell them you have a Linux system and are interested
    in PPP services with e-mail and newsgroups. Find out whether they have access
    numbers in your local calling area. Otherwise, you''ll end making a long-distance
    call each time you connect. Check the ISP''s prices and whether they have unlimited
    service (a flat rate no matter how many hours you''re logged on). A typical price
    for unlimited service is $20 to $30 per month (usu-closer to the former).


    ISPs that host web pages are a plus, as are ISPs that can filter junk e-mail,
    or spam. Find out how and what kind of service they provide. Most ISPs are small-to-sized
    organizations and cannot afford to staff their lines 24 hours a day, 7 days a
    week. However, many small ISPs are owned and run by technical people who happen
    to monitor their systems for what seems like 24 hours a day. They are often logged
    on at home and periodically monitor their e-mail—a good indicator is if they have
    a generic e-mail address such as help@swcp.com. If you get lucky or do your homework,
    you''ll connect with one of these ISPs (South Cyberport in Albuquerque, New Mexico,
    is one such place) and get excellent help.


    ![](img/8ae48244df88d68913b10871643fd825_287_0.png)


    Now is a good time to verify that your own telephone service is billed at a flat
    rate and not metered.


    Tell the ISP the highest speed of your modem. ISP your worth handles 56Kbps modems
    (if you have a V90 56Kbps modem, make sure the ISP sup-ports the V90 standard,
    or you''ll only be able to connect at 33.6Kbps maxi-mum). You''ll probably need
    to supply a login name and a password for the ISP''s server, so you may want to
    have these written down ahead of time.'
  merge: -1
