  md: '# 246 Part IV: Maintaining Your System


    +   - si (swapped in) and so (swapped out) monitor the program registers

    swapped in and out.


    +   - bi (blocks in) and bo (blocks out) indicate I/O activity on disks.


    +   - The in value reports interrupts per second (including the clock).


    Knowing the number of interrupts per second is useful if you have a device that
    has gone crazy. An improperly wired serial line, for example, can eat CPU time
    with thousands of interrupts per second. Although hundreds of interrupts per second
    is not uncommon on most systems today, sudden, unexplained jumps in the number
    of interrupts (for example, thousands of interrupts per second on an unused machine)
    may be worth investigating.


    ![](img/8ae48244df88d68913b10871643fd825_271_0.png)


    +   - cs reports the number of context switches per second. A context switch is
    when your system changes from one process to another—the values stored in the
    CPU''s registers are stored in memory and the state of the second is returned
    to the CPU. The second process starts exactly where it is stopped when its context
    switches.


    +   - us, and id (user, system, and idle) CPU numbers are the percentages of time
    the CPU is running your program, doing some type of service (per requested by
    your program), or standing idle, respectively. Note that a system with lots of
    idle time is not necessarily the best; the CPU may be idle because of programs
    waiting on I/O.


    # Measuring performance with procinfo


    procinfo is another program used to measure system performance. In many ways,
