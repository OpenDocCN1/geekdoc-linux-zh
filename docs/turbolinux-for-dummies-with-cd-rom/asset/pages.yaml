- img_proc: true
  md: 'The last reason is the most insidious because it means the people you bought
    the PC from did not bother to buy the documentation for each part of the PC when
    they assembled it for you. That would have cost them more money. Instead they
    used OEM parts ("sans documentation and colorful box") and bought only one copy
    of the documentation for their use. With Windows already installed, reason, why
    would an end user need any documentation about the system?


    Contact the place where you bought your system. Perhaps you can obtain a copy
    of the documentation from the dealer.


    If that doesn''t work, open up your system and look at the components. For instance,
    a source of information about your disk is the label on top of the hard drive.
    If you don''t feel comfortable opening up your system, you may want to take it
    back to where you bought it — assuming you didn''t buy it by mail order — and
    perhaps the dealer can open it and tell you what you have.


    You can also look to the Wide Web for information. Many vendors use their Web
    sites to provide technical data about their devices. For that, you will need to
    know your equipment''s manufacturer, make, and model number.


    Another source of information is MS-DOS, Windows 3.1, or Windows 95/98. Step-by-step
    instructions in the following sections show you exactly how to use these operating
    systems to get all the information you need.


    If you don''t have any literature about your system, and you don''t have Windows
    3.1 or Windows 95/98 on your system (perhaps you like to run FAT free), and no
    dealer is within hundreds of miles, don''t give up hope. TurboLinux is good at
    sniffing out and identifying hardware during the installation.


