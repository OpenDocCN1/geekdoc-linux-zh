    - Mounting the file systems. You may have to make a directory for a mount point.


    The next four sections step you through the process of configuring a hard drive
    after you physically install it. And the rest of the chapter tells you about the
    differences in the process for a CD-ROM and the floppy drive.


    # Setting up a new hard drive


    After your new hard drive is attached to your computer, you need to make Linux
    aware of it. To clue Linux in, you must gather certain information about your
    hard drive''s characteristics and then share that information with Linux. Some
    information (such as a description of the hardware''s elements) comes from the
    device manufacturer. Other information (such as elements of the formatting) becomes
    available during the configuration process. In either case, you need to keep a
    record of this information.


    ![](img/8ae48244df88d68913b10871643fd825_261_0.png)


    To complete all the tasks necessary to install and configure your new hard drive,
    your computer must know the drive''s total formatted drive capacity and the number
    of heads and cylinders, among other details. Modern PCs (typically those made
    in the late 1990s and beyond) can gain that information by probing the disk if
    you choose the BIOS menu Autodet Hard Disk (or some words to that effect). The
    BIOS menu can be accessed by pressing either the Del, F1, F2, or F8 keys when
    you first turn on the power or reboot your computer (the computer will display
    which key accesses the BIOS menu during the initial boot sequence).


    Older computers require you to manually enter the hard drive information into
    the BIOS hard disk configuration. You can usually find this information from the
    label on the hard drive itself, in the documentation that came with your drive
    or directly from the manufacturer (most manufacturers post their hard disk information
    on their Web sites).


    You may want to keep a record of the data from the partition table as is displayed
    by fdisk, such as


    +   - Type

    - Size

    - Starting and ending blocks'
