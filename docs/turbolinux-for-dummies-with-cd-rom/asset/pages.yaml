  md: '# Chapter 9: Working with Editors 155


    To illustrate additional ed commands, first create a file using ed:


    ```

    [maddog@localhost maddog]$ ed -p tove.and.linus

    tove.and.linus: No such file or directory

    a: Once upon a time there was a very nice lady, who met a very nice gentleman.
    They eventually got married and had two of the most exceptional baby girls that
    anyone would want to have as granddaughters.

    They lived in a magical kingdom called "Santa Clara,"

    ad had a very nice house with two cats in the yard.

    :w

    312

    :q

    [maddog@localhost maddog]

    ```


    The line where ed applies your command is called the current line. Each line has
    a line number, which acts as an address. The p command displays the current line.
    You can modify the p command to show a range of lines. For example, to see the
    first five lines of a file, you use the following command:


    ```

    :1,5p

    ```


    Which displays the following:


    > Once upon a time there was a very nice lady, who met a very nice gentleman.
    They eventually got married and had two of the most exceptional baby girls that
    anyone would want to have as granddaughters.


    A period (.) refers to the current line, and $ refers to the last line. A comma
    (.) indicates that should apply the command that follows to all lines in the buffer.
    Confused? See if you can figure out what the following command displays:


    ```

    ..,$

    ```


    Here''s the answer. Note that we start with a blank line:


    > They lived in a magical kingdom called "Santa Clara,"

    ad had a very nice house, with two cats in the yard.


    The command displays all lines in the file from the current line to the last one.'
