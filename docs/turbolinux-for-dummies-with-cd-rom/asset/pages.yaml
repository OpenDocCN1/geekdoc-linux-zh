- img_proc: true
  md: '# Chapter 17: Ten Sources of Help


    # Linux HOWTOs


    ![](img/8ae48244df88d68913b10871643fd825_324_0.png)


    Don''t forget about the Linux HOWTOs, which are on the TurboLinux For Dummies
    CD-ROM. These excellent guides to Linux are covered under the Linux Documentation
    Project copyfleft, which means you can print them. You can also read them with
    more(1) or less(1).


    # School Days


    Another source of information on Unix and Linux is through formal courses, perhaps
    at a local community college. A lot of colleges have courses on Unix, and many
    have started using Linux to teach the Unix courses. With Linux, you can do a lot
    of your homework on your system at home or on your notebook anywhere. (MadDog
    typed text for the first edition of Linux For Dummies in a Auckland, New Zealand
    and updated text for the second edition in the United Airlines lounge in Chicago.)
    What I would have given in college for the ability to do my computer projects
    sitting in the comfort of my own pub... er, dorm room. Instead, I had to sit in
    a room with a lot of punch-card machines... well, never mind. I would have been
    a lot more comfortable and productive with a Linux system.


    # In the News


    You can obtain additional information on the Linux operating system from the Internet.
    A facility called netews has tens of thousands of newsgroups, and each newsgroup
    is about a special topic. More than 30 newsgroups are devoted to Linux topics.


    ![](img/8ae48244df88d68913b10871643fd825_324_1.png)


    Access to reading netews is usually a service provided by an ISP (Internet service
    provider). You can use a news reader (such as tr, tin, or pine) or one of several
    Web browsers (such as the Netscape browser included on your TurboLinux For Dummies
    CD-ROM) to read netews.


    # User Groups


    User groups are springing all over the country. Some are more active than others,
    but have meetings at least once a month. Some groups are Linux only; others are
    attached to a larger computer group — either Unix or a more general computer user
    association. User groups offer a good opportunity to ask questions. Also, user
    groups tend to stimulate ideas and methods of doing things.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 300 Part VI: The Part of Tens


    You can find out whether a Linux user is in your area by checking with GLUE (Groups
    of Linux Users Everywhere), which is run as a service by SSC (the publishers of
    the Linux Journal). GLUE is an automated map of user groups and can be found at
    the following address:


    ```

    www.ssc.com

    ```


    When you get to the site, check under Resources. Go to your area in the world
    and find out where the user group closest to you meets.


    ![](img/8ae48244df88d68913b10871643fd825_325_0.png)


    No user group in your area? Then leave a note at www.ssc.com saying you want to
    start one, and perhaps other people in your area will join you. Terrified at trying
    to start a user group? Leaders of user groups are often not the most technically
    knowledgeable, but are simply good planners. They organize the meeting space,
    find (hound) speakers, send out meeting notices, locate sponsors, arrange refreshments
    (beer), and perform other organizational tasks. Sometimes it seems like a thankless
    job, but when a meeting turns really well, it makes it all worthwhile. As a newbie
    to Linux, you may not know a grep(1) from an awk(1), but you still may make a
    very good chairperson. (You may also be able to have Linux SIGs organized by general
    PC users.)


    # Bring in the Cavalry


    Some people want to be able to hire people to manage or fix their systems. This
    is what the commercial world calls support. A lot of times, support is delivered
    by the place where you bought your computer, whether it''s a store, value-added
    reseller (VAR), or the manufacturer.


    Linux has been criticized for not having this level of support. Although it''s
    true that the number of hardware vendors is low, and more people are versed in
    Linux and are willing to offer some level of support, whether by e-mail, telephone,
    or on-site services.


    The first group of people who offers support is TurboLinux — others sell support
    contracts for their Linux distribution. These contracts range from e-mail support
    to telephone support.


    Another group of people offering support are resellers of Linux systems. These
    people typically choose one or more versions of Linux and will install them on
    hardware that you purchase from them. They will repair your system when it breaks
    and help you with tricky problems (all for a fee).


    The final group of people who offer support are independent consultants who have
    learned about Linux and are now in the business of offering support for the system.
    A list of consultants is available from a document called the Consultants HOWTO,
    which is available at the following address:'
  merge: -1
