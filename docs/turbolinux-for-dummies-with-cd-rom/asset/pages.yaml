  md: '# Chapter 16


    # # Surfing the Web


    # ## In This Chapter


    +   - Tailoring Netscape Communicator to suit you

    - Checking out Web pages

    - Getting and reading e-mail

    - Sending an e-mail message


    Once upon a time, there was a company called Netscape that created a browser called
    Mozilla. Despite the fact that the company spelled the name "Netscape," you were
    supposed to pronounce it "Mozilla." In any case, the browser was one of the best
    in the world (if not the best), and the folks at Netscape made it better by turning
    it over to the open source community to help them improve it.


    Mozilla is the open-source effort that resulted in the new Netscape Communicator,
    which should be at least in, if not final release, by the time this book sees
    the shelf. To check out the latest, ever-changing version of Mozilla, see www.mozilla.org
    and www.mozazine.org for news about Mozilla. For the latest version of Communicator,
    go to www.netscape.com/download.


    Versions of Netscape newer than the 4.x Communicator family (version 4.6 is included
    with TurboLinux) are very likely to be at least different in functionality, with
    tons of new features and modifications. If you download a 5.x version of Communicator
    from the Web, bear in mind that many the instructions in this chapter may no longer
    apply! You may want to stick with the version on the CD until you get the hang
    of it, and then upgrade and take advantage of the new functionality and standards
    support the new Communicator.


    In this chapter, you find out how to set up Communicator 4.61 for your system.
    Then with the information from your ISP, you finally surf the Web and send and
    receive e-mail.


    ![](img/8ae48244df88d68913b10871643fd825_304_0.png)'
