    |


    Figure 5-1 lists some of the keyboard maps for your system. If you are in the
    United States, you will probably choose the us option. Even then, you might have
    a different keyboard than the us, so it is worthwhile to browse through the list
    to see what else it offers.


    # Choosing a Disk Partitioning Tool


    You have two choices for disk partitioning. The newer and greatly simplified option
    of the two partitioning methods is cdisk. The other, less favored option is fdisk.


    Luckily, cdisk meets the needs of most new users and is considerably easier to
    use than fdisk. Not surprisingly, we recommend cdisk as your choice. The sections
    that follow, however, offer steps for each method.


    TurboLinux may be installed in a range of different ways. You could install TurboLinux
    and your personal files all in one large partition. When you want to reinstall
    TurboLinux (such as when you get an updated version or a different distribution),
    however you''d have to back up and restore all your data files.


    The other extreme of installing Linux is to create a partition for each of the
    following areas:


    +   - A root partition mounted as / (the root directory) where the kernel needs
    to boot the system and the system configuration files reside. This partition needs
    to be only 30MB to 50MB.


    +   - A swap partition, which enables Linux to take advantage of virtual memory.
    If you have 16MB or less in your machine, you should have a swap partition. Actually,
    you should have a swap partition even if your system has more than 16MB. The swap
    partition should be the same size as the memory installed in your computer, for
    example, your swap file should be 32MB.'
