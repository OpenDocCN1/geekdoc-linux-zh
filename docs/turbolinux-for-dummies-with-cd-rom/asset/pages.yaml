- img_proc: true
  md: 'Linux developers are constantly supporting new file systems. The following
    file system types are the major ones:


    +   - Local: ext, ext2, hufs

    - NFS: nfs

    - Samba: SMB

    - CD-ROM: iso9660

    - DOS: msdos, umdsos, vfat

    - Other: sysv and minix


    If you want to add one of these file system types, you have to make a new partition,
    which may mean adding a new disk drive. That''s the subject of the next section.


    # Adding a Disk Drive


    If you want to increase your disk space, you can add a new disk drive. Technically,
    disk drives can take the form of hard drives with either SCSI or IDE controllers,
    floppy disks, or CD-ROM drives. However, we try to stick with the term "hard drive"
    for hard drives, to avoid confusion with disks for floppy disks, and so. Similarly,
    CDs are referred to discs, with a C, and the drives that use them are known as
    CD-ROM drives.


    For any drive added to your system, you (or someone else) must complete the following
    tasks to make the drive accessible to users:


    +   - Attaching the drive to your computer system.

    This task involves the physical connection of the device to your computer system
    and is beyond the scope of this book. Your new drive may be IDE or SCI, and the
    setup of the physical disk depends on the rest of the hardware in your system.
    We suggest you consult the hardware manual that came with your system or a reseller
    physically install your new drive. The installation process on a Linux system
    can be complicated by the fact that several operating systems — such as Windows,
    TurboLinux, and SCO — may share the same disk.

    - Providing a suitable device driver for the disk''s controller in TurboLinux.
    This may mean rebuilding the kernel of the TurboLinux operating system, a process
    which is detailed in Chapter 14.

    - Defining at least one partition.

    - Creating block special files for the partition(s).

    - Creating a TurboLinux file system(s) on any partition(s) to be used for user
    files.


    ![](img/8ae48244df88d68913b10871643fd825_260_0.png)'
