  md: '# Two drives are better than one


    You can picture your hard drives as being the tollbooths on a highway. When a
    road has only one toll booth, all the traffic has to go through it. If the traffic
    is light, no problem occurs (other than paying the toll). If the traffic is heavy,
    however the cars back up. Putting in another booth allows almost twice as many
    cars to be handled. We say almost twice as many because cars may not line up properly,
    so more cars may try to go through one toll booth (probably the one next to the
    combination information booth and liquor store) than the other toll booth.


    Having one drive on your system is like having one toll booth on the highway.
    All I/O on your system (including paging and swapping) goes out to each drive.
    If you have two drives, proportions of data flowing to each drive may change over
    time, it would be nice if on average half the data was going to one drive and
    half to the other.


    To try to accomplish a balance in the data flow, some systems put separate directory
    structures on different drives and similarly divide up the file systems. For example,
    suppose you broke up the drives into the following directories and made a file
    system for each:


    +   /

    /tmp

    /usr

    /usr/tmp

    /home


    You may find that under a normal load, data is written to each file system equally.


    Separating the swap areas onto another drive means that even more I/O load is
    distributed evenly. Think of it as having a mountain of backpacks to carry. You
    can put them all on one poor, unsuspecting pack mule and watch its knees buckle
    under the load, or you can distribute them to several mules (but you have to manage
    them all as you trundle down the trail).


    Another reason for breaking up the data into separate file systems is known as
    head contention. Drives have moving parts called disk heads that are like the
    heads of an audio cassette deck. To read or write data, the data must pass underneath
    the heads. Unlike the heads in an audio cassette, the disk heads do not touch
    the disk but float a very short distance over its surface. Moving these heads
    from one place to another to read data is a slow process in computer time, and
    most people want to avoid moving them unnecessarily. By having all the data on
    one drive, each program fights with the others'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Chapter 14: Customizing TurboLinux


    to move the heads where they should be for that program. By separating the data,
    you have a better chance that the data you want is close to the previous data
    you requested and not clear across the drive.


    # Measuring disk drive performance


    procinfo tells you how many reads and writes you do per disk. Keeping an eye on
    these numbers tells you how much data is being written to your disks and how much
    the disk heads are moving. How can you tell your drive''s peak potential for reading
    or writing data? The peak potential depends on the disk seek speed, how much data
    you are writing, and the order in which the data is written back to the disks.


    In the literature that came with your hard drive, you should find the amount of
    time required for the following disk activities:


    +   - A cylinder-to-cylinder seek, where the disk head moves between adjacent
    cylinders.

    - A full seek, which move the disk head over the entire surface of the disk.

    - An average seek, where *average* is halfway between the cylinder-to-cylinder
    seek time and the time needed to move the disk head completely across the disk.

    - One rotation, where the disk moves — you guessed it — completely around. Half
    of one rotation is called the *average rotational delay*


    Normally, in finding out disk capacity (the average potential throughput for your
    disk), you add one average rotational seek time plus the rotational delay for
    allowing the data to be read under the disk head. Depending on how much data you
    are reading, this can be up to one full rotational delay. If you need to read
    more data than that, you will have to move the disk head again and reinstate the
    drive, which may mean waiting another average rotational delay before the disk
    heads line up with the data again.


    On average, one-half the rotational delay and one average seek for each average
    access time. Suppose that this is 100 milliseconds, or one-tenth of a second.
    This means the system can do 10 reads or writes to the disk, on average, every
    second (600 reads or writes to the disk every minute). If you look at information
    from successive `procinfo` commands, you can get a feeling for how many disk I/Os
    your system is doing as opposed to how many it could be.


    Remember that the numbers reported by procinfo are averages over time. If the
    numbers are close to the maximum, you may have periods where the drive is trying
    to answer every request but is overwhelmed by the number of I/Os. The bottom line
    is that your system is having to wait for your drives.'
