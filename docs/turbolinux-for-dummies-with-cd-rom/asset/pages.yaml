    # Virtually working on your virtual desk


    We think you can see at this point that you could have lots and lots of windows
    on the screen. You may even lose a window behind other windows. Do you wish that
    your monitor was larger just so you could open more windows and do more things
    at one time? Or maybe you don''t want to close down or minimize one application
    before going to another application.


    Well, monitors are expensive, and a lot of systems have only one graphics card,
    so you are stuck using a single monitor. But you don''t have to be stuck with.
    With the help of GNOME, X can give you both virtual screens and virtual desktops.


    A virtual desktop enables you to have a full screen of applications. By clicking
    a button or moving your cursor to a particular location, you can display an additional
    screen of different applications.


    A virtual screen is when the screen of one desktop is larger than your monitor,
    and you can''t see the entire desktop at one time. As you move your cursor to
    one side of the monitor or the other, you automatically pan over that virtual'
