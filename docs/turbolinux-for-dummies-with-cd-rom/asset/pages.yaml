  md: '# 104 Part II: Installing TurboLinux


    You should be able to find this information in your system''s documentation or
    by using MS-DOS or Windows, as we describe in Chapter 3. But now that you have
    Linux up and running, the next best method for finding missing information is
    to run the SuperProbe program, which comes with TurboLinux. We describe how to
    run SuperProbe in the next section.


    Next, you need to know the following about your mouse:


    +   - The model number and manufacturer

    - Whether it is a PS/2 bus mouse or a serial mouse


    Again, your system''s documentation should give you this information, and often
    the bottom of the mouse tells you as well.


    A PS/2 mouse has a connector on the end of its wire, or tail (unless it has an
    adapter attached to it). A serial mouse is an oblong connector with nine holes.
    All varieties of PS/2 bus mice look the same to Linux. Different serial mice,
    however, have different characteristics. If you have a serial mouse, you have
    to know its model number and manufacturer or whether it emulates other well-known
    mouse.


    Three-button mice are best with Linux, but you can get by with a two-button mouse.
    To X, holding down both buttons at the same time on a two-button mouse emulates
    the action of holding down the middle of a threebutton mouse, but only if the
    system is configured correctly. (You can find out how to configure the mouse in
    Chapter 5.)


    Finally, you need to know about your monitor. The TurboLinux configuration program,
    described later in this chapter, has a database of existing monitors. If your
    monitor is in that database, you''re cool and need only to enter the monitor during
    the configuration process. If your monitor is not listed, however, you need to
    know its basic specifications.


    Most monitor manuals have a table at the back with information such as the following:


    +   - Horizontal and vertical sync ranges: These numbers help X determine how
    to place the dots on the screen.


    +   - Resolution: Tells how many dots can be on the screen horizontally and vertically.
    The lowest resolution of 640 x 480 considered to be the worst, with 1,280 x 1,024
    is generally the maximum. In those extremes you should be able to achieve between
    800 x 600 and 1,024 x 768 on most modern computers.


    +   - Multisync: If your monitor has this option, it can run at every resolution
    rates. Other monitors, particularly VGA monitors that came with older systems,
    aren''t multisync. These monitors could be damaged if you try to use them at a
    higher resolution than VGA (which is 640 x 480).


