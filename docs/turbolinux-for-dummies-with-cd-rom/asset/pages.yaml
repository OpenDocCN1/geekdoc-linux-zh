  md: '# Chapter 5: Installation: Down to the Final Stretch


    # Choosing a root password


    The installation program now prompts you to select a password to use for logging
    in to your Linux system for the first time, as shown in Figure 5-34. The password
    is for the root user, also known as the superuser (da, da if!), who has access
    to the entire system.


    ![](img/8ae48244df88d68913b10871643fd825_122_0.png)


    Figure 5-33: Selecting the Window manager or Desktop.


    Log in as the root user only to do maintenance or administrative tasks. The root
    user is the only one with access to critical system files. To avoid making unwanted
    changes or deletions, add another, less dangerous user for your nonadministrative
    user.


    ![](img/8ae48244df88d68913b10871643fd825_122_1.png)


    Figure 5-34: Inputting your root, or superuser, password.'
