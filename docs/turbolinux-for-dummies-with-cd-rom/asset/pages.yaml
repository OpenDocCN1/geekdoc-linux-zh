  md: '# 230 Part IV: Maintaining Your System


    +   * nosuid Do not permit the suid access mode.

    * noauto Do not automatically mount this file system when the -a option is used
    with the mount command.

    * usrquota User quotas may be in effect.

    * grpquota Group quotas may be in effect.

    * defaults A combination of rw, suid, dev, exec, auto, nouser, and async.


    dump-freq is the frequency with which the file system may be backed up by the
    dump utility (not all systems use this).


    pass-number is a decimal number specifying the order in which fsck (which stands
    for file system check) utility checks the file systems. A pass-number of 1 (one)
    indicates that this file system should be checked first. This is the pass-number
    assigned to root. All other file systems should have a higher number. Two file
    systems on different drives can be checked in parallel to speed up, but file systems
    on the same drive have different pass-numbers. For swap devices, the pass-number
    should be 0 (zero), which disables fsck checking.


    Examples of some typical /etc/fstab entries:


    | dev/hdb1 / ext2 defaults 1 1 |

    | dev/hdb3 none swap sw 0 0 |

    | dev/hda1 /w95 mdos noauto 0 0 |


    The first line enables the mounting of the first partition of the second IDE (the
    hdb1 designates the IDE controller) as the root file system. The disk is a Linux
    native file system (ext2) and uses the default rw, suid, dev, exec, auto, nouser,
    and async options. The first entry in /etc/fstab also indicates that the root
    file system should be dumped (once a week (using the man dump command for details
    on dump). Finally, the first /etc/fstab file indicates that the root file system
    should be the first file system to have fsck performed on after booting the system.


    The second line shows that the third partition of the second IDE disk (the hdb3
    designates the third partition) is a swap partition and has the format of a swap
    file. The swap partition should never be backed up or have the fsck command performed
    on it.


    The third line of /etc/fstab points to the first partition of the first disk,
    which is a file system to be mounted on the /w95 directory. /w95 probably holds
    Windows 95 files that are stored on an MS-DOS (FAT) file system, and you can read
    and write to this file system. The DOS file system will not be automatically mounted
    because the noauto option is used (for example, if you specify the -a option using
    the mount command, the /w95 file will not be mounted). Because /dev/hda1 is not
    a Linux ext2 file system, you should never use dump back to root, or you should
    run fsck on it.'
