    # ## Counting the Days with Your Linux Calendar


    Ical is a nice calendar available on TurboLinux — cool enough in fact that we
    discuss it briefly here. You can use Ical not only to display your own calendar
    but also to combine other calendars, such as your boss''s a calendar of holidays.
    You can make calendar items repeat daily, weekly, or monthly — all with different
    alarm settings. The calendar program includes excellent online documentation under
    the Help key, so we don''t go into a lot of detail about the program.


    To take the calendar program out for a spin, follow these steps:


    +   1. Log in as any user.

    2. If X is not running, then start it by typing `startx` at the command line.

    3. Click the Main Menu Button and then choose `Applications:Calendar`.


    The calendar program appears, as shown in Figure 12-1.'
