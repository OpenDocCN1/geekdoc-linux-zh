  md: '# 100 Part II: Installing TurboLinux


    If the installation program couldn''t probe for your card automatically, a dialog
    box appears, telling you to choose your video card. You need to indicate which
    video card you have, as follows:


    +   1. Use the arrow keys to move through the list and choose your video card.

    2. If you do not see your video card but see a previous model by the same manufacturer,
    try that.

    3. Press the Tab key to select the Ok button, and then Enter. A dialog box appears,
    asking you to choose your monitor type.

    4. Specify the arrow keys to move through the list. If you don''t see the name
    and make of your monitor, choose Custom.

    5. Press the Tab key to select the Ok button and then Enter.

    6. If you choose Custom in Step 3, enter the horizontal and vertical sync rates.


    These rates are in the manual you received with your monitor and modern monitors
    are also sometimes on the label on the back of your monitor.

    Older monitors can''t handle resolution rates and scan frequencies higher than
    what they were designed for. A monitor designed for 640 x 480 resolution (and
    a low scan frequency) can display 2,048 x 1,024 resolution (and a high scan frequency).
    More importantly, if you try to make the monitor display that a high frequency,
    it might burst into flames. (Maddog didn''t believe this until he saw a monitor
    smoke.) Modern monitors, Multisync, can automatically match themselves to a series
    of scan frequencies and resolutions. Some of these monitors are smart enough to
    turn themselves off if the frequencies become too high, burst into flames. It''s
    best (particularly with older monitors) to find the documentation and match your
    vertical and horizontal frequencies properly. Locking this, try a lower resolution
    (VGA or SVGA), first to get X Window System running.


    +   6. Specify the amount of video memory that you have and then over to the Ok
    button and press Enter.


    You use the dialog box that appears to specify the amount of memory on your video
    card. (Note that this memory is different from the amount of main memory). Most
    modern cards have 1, 2, 4, or 8MB of video

    If you do not know how much video memory your card has, try 1MB (the 1 meg option).
    Although this limits the resolution of your screen, you will probably be able
    to get X Window System going. Later, you can experiment with the Xconfigurator
    we describe in Chapter 6 to figure out the best values for how much video memory
    you have if the probe did not work properly.


    ![](img/8ae48244df88d68913b10871643fd825_125_0.png)


