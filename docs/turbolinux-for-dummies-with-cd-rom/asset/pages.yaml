  md: '# 82 Part II: Installing TurboLinux


    ![](img/8ae48244df88d68913b10871643fd825_107_0.png)


    Figure 5-17: Selecting and initializing the swap partition(s).


    If the installation program can''t find your swap partition(s), it''s probably
    because you don''t have the partition type to Linux swap. If you want a swap partition,
    the best thing to do is to start the installation over the boot procedure in the
    "Beginning the Installation" section, choose either cfdisk or fdisk to repartition
    the disks, and make sure a swap partition is defined, as in Figure 5-17.


    After you have selected which swap spaces to initialize and whether you wanted
    them for bad blocks, press the Tab key until the Ok button is selected and then
    press Enter. The program goes to work.


    > If you chose to test for bad blocks during the formatting of the swap partition(s),
    it could take a while to test the surface of the disk. Don''t panic if nothing
    seems to be happening for a few minutes — the computer is simply checking for
    damaged or lost data.


    TIP


    # Preparing partitions


    The next dialog box to appear is the Select Root Partition dialog box. Use the
    arrow keys to select the partition you used as root (any other Linux partitions
    can be mounted later on), tab over to the Ok button, and press Enter.


    Now see the mount table, as shown in Figure 5-18. This allows you to tell TurboLinux
    what mount, where to mount it, and what file system to use. You can use this to
    mount your other partitions and make them accessible in Linux. Arrow down to the
    partition you want to mount, press Enter, and enter the mount point. Figure 5-18
    shows one possible configuration, with separate partitions for /usr and /home
    — this is probably a little more trouble than you want to go for for your first
    time, a weird configuration.'
