    # Configuring a CD-ROM Drive


    You treat CD-ROM drives similar to — but not exactly like — disk drives. The block
    special file for CD-ROMs in Linux is usually /dev/cdrom, /dev/hdc, /dev/hdd, or
    /dev/srd0, depending on factors such as the CD-ROM''s type, how it is connected
    to the controller, and its drive number.


    The most common type of CD-ROM is ATAPI, and Linux recognizes ATAPI CD-ROMs at
    boot; SCSI CD-ROMs are normally recognized as the kernel boots. If you installed
    the system from the TurboLinux for Dummies CD-ROM, the CD-ROM will have been recognized
    by Linux and possibly /dev/cdrom.


    Understanding that CD-ROMs are “not exactly like” other disks is important because
    CD-ROMs are read-only (which means that you cannot change their contents) and
    typically have only one file system to a disk. Therefore, you do not partition
    a CD-ROM, nor do you make a file system before mounting it. The manufacturer already
    did these things. You simply have to determine where you want to mount the CD-ROM
    and which drive it is attached to. You assume your CD-ROM drive is /dev/cdrom,
    which is really just a pointer to another special device. This extra pointer (called
    a link) enables you to call the CD-ROM by the name /dev/cdrom, instead of having
    to call it /dev/scda on some systems (because it happens to be a SCSI device)
    and /dev/hdc on other systems (because it happens to be an IDE-based device).'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 13: File System Management


    Following is the command to mount a CD-ROM on your TurboLinux system:


    ```

    mount -r -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    Now you know just about every type of disk storage that you''ll see on a Linux
    system. You know how to identify the types of disk storage and partition them.
    You also know how to create file systems for them and how to mount and dismount
    those file systems while the system is running. The Linux system dismounts file
    systems automatically when you shut the machine down and — if you have put all
    of the necessary information into the /etc/fstab file — automatically mounts them
    when you start the system up. So far as disk systems go, you should be all set.'
