    # Making installation disks in TurboLinux


    If you don''t have access to MS-DOS or Windows but do access to another Linux
    system, this section is for you. To make the boot, extra hard-ware, and supplemental
    disks in Linux, you must be logged on as a user with permissions to write to the
    3% drive, which Linux refers as /dev/fd0.


    +   1. To make the boot disk, put a blank, formatted floppy in the floppy drive.
    Place the TurboLinux For Dummies CD-ROM into your CD-ROM drive, and mount the
    Linux CD (connecting it to the rest of the file system) by typing the following:


    mount /dev/cdrom /mnt

    2. Change to the images directory by typing


    cd /mnt/images

    3. Finally, type the following command:


    d if=boot.img=/dev/fd0


    After the floppy drive goes out, you may make the extra hardware and supplemental
    disks if needed. Even if you don''t think you need them, it''s a good idea to
    make them (just in case), place a blank disk in /dev/fd0 (the floppy disk) and
    then type this command (repeat the process, replacing supp.img with extrahw.img,
    for the extra hardware disk):


    After you finish making the floppies, you may dismount the CD-ROM (removing it
    from the rest of the file system) by typing these commands:


    ```

    cd /

    umount /mnt

    ```


    Wait until the floppy light is out before removing the floppy disk.'
