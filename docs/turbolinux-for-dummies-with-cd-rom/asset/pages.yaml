  md: '# Chapter 7


    # # Using Linux for the First Time


    **In This Chapter**


    +   - Starting TurboLinux

    - Logging in as superuser

    - Adding yourself as a general user

    - Stopping TurboLinux


    Congratulations! TurboLinux is now on your system and raring to go! But before
    you go on finding out how to use TurboLinux for work — or play — you have to make
    an account for yourself, which is how you log in to TurboLinux and do whatever
    your heart desires.


    TurboLinux is a multiuser system, so you — and every other user — need individual
    name and password to protect your information and keep your tasks separate from
    other people''s tasks. You find out how to create user accounts in this chapter,
    too.


    Names and passwords in Linux have one other advantage over those in Windows systems:
    Linux has a rich file permissions strategy that keeps either you or others from
    erasing and replacing system files. This is important both in a networked environment
    and when a system is sitting idle at a desk.


    # # Giving TurboLinux the Boot


    Are you ready to boot TurboLinux? Here goes:


    +   1. Make sure everything is turned off.

    2. Turn on all peripheral devices, such as a printer and scanner.

    3. Turn on the power to the monitor (if it''s separate from the main system box).

    4. Turn on the main power switch.


    After a short time, LILO boot: appears on your screen.'
