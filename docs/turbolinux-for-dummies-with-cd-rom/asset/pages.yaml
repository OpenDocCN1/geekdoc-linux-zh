  md: '# 160 Part III: Using TurboLinux


    You can start the vi editor in a number of ways with different options, but the
    most common way is to start vi with only a filename as the argument, this like:


    ```

    vi dove.and.linus

    ```


    where dove.and.linus is the name of either an existing file that you want to edit
    or a new file you want to create.


    The vi editor has three modes of operation:


    +   - Visual command mode

    - Colon command mode

    - Text mode


    When you invoke vi with a filename, the editor screen appears. At the bottom left
    corner is the following line:


    ```

    "filename" [New File]

    ```


    This status line tells you what the editor is doing. In this case, the editor
    has opened a buffer and the save and quit option saves the contents of the buffer
    to the filename file. If you did indeed invoke vi with the following command:


    ```

    vi dove.and.linus

    ```


    the bottom left corner would display the following line:


    ```

    "tove.and.linus" [New File]

    ```


    When you first invoke vi, you are in visual command mode, which is the default.
    You can use four special commands to either locate text or transition to more
    complex commands:


    +   / Forward search

    ? Backward search

    n Continue the search in whichever direction you were currently moving

    : ex command (ex is the line editor included in vi)


    In command mode, the characters you type used as commands, not as input into the
    file. To use commands, type the character on the command line. For the first two
    search commands (/ and ?), the cursor moves to the bottom of the screen, where
    you type the string you are searching for. When you press Enter, if you want to
    search for an additional string, you can just press n to reexecute the search.


    When you type :, the cursor moves to the bottom of the screen and waits for you
    to enter a command or a command string. You must press the Enter key to execute
    the command.'
