    Don''t know what those are? That''s okay for now because the creators of TurboLinux
    have put their best foot forward and given you a good set of defaults. Use the
    defaults for now by pressing the Escape key to exit. You can figure out what you
    really want after you become more familiar with Linux.


    # Selecting a desktop


    Now it''s time to select a Window manager or desktop. At this point, the Window
    Manager Selection dialog box appears, similar to the one in Figure 5-33. This
    dialog box lists the available desktops and allows you to choose based on your
    preference.


    Don''t know what the differences are? Try the default selection, GNOME. You can
    change it later on using the turbowcfg command.'
