  md: '# 292 Part V: Going Online


    # Sending E-Mail


    To send an e-mail message, you have to know the recipient''s e-mail address. Just
    as a URL consists of certain components, an e-mail address is made up of the person''s
    e-mail name (often the same as his or her login name) and domain name. For example,
    to send an e-mail to the President of the United States, we address it to president@whitehouse.gov.


    Your ISP should have given you an e-mail address, and you can ask your friends
    for their e-mail addresses. It''s the height of irony that people first get on
    the Internet and can send e-mail, they invariably spend a lot of time calling
    their friends on the telephone to get their e-mail addresses.


    From the Messenger screen, click the New Msg icon. A window like the one in Figure
    16-14 appears.


    ![](img/8ae48244df88d68913b10871643fd825_317_0.png)


    Figure 16-14: Writing a new message.


    The row of icons near the top of the window is the To. To the right is a white
    space where — after you click in it — you can type the e-mail address of the person
    you are trying to reach. Just for fun, try the following steps for sending a letter
    to your own e-mail address. Then if you receive it properly, you''ll know you
    did everything correctly:'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Chapter 16: Surfing the Web 293


    +   1. Click in the Field and type your own e-mail address.

    2. Click in the Subject field and type a suitable subject.

    3. Click in the body of the message and type your message.

    4. Click the Send Now icon.


    If you are sending a message to yourself, it won''t appear instantaneously. It
    still has to go down the telephone line, be analyzed by the server, and be sent
    back to you, so be patient.


    You can also attach a file, an image, or even a sound to your message and to friends
    also use Netscape (or another MIME-compliant mail reader). To attach a file to
    your letter, simply click the Attach icon at the top of the Compose window. A
    dialog box like the one in Figure 16-15 allows you to search for the file structure
    looking for the file you want to.


    ![](img/8ae48244df88d68913b10871643fd825_318_0.png)


    Figure 16-15:

    The Attach file dialog box.


    If you select the file, you are asked whether you want to encode it using Base64
    or Uencoding. Either one is fine for sending mail to most of your friends, Base64
    is probably the most used in the Microsoft world.


    At this point, you can do basic functions with the Internet, but much more is
    available. For stores, use the Help facility in Netscape to read about the different
    options. Out across the Net (despite our earlier sarcasm) is a wealth of data
    to which you now have access. Remember, however, that data can be good data or
    bad data, and you have to use your common sense to figure out whether your data
    source is knowledgeable or unreliable. Happy surfing!'
