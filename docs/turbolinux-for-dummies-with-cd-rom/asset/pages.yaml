    if the person had left the office exactly as he or she found it?


    bash creates an environment for commands to operate. When a new command is executed,
    bash creates a clean copy of the environment, executes the command in it, and
    then throws away that environment, returning to the environment it started with.


    Now look at a more complex example than the just one command ls -1 *:


    ```

    cd /usr/lib

    ls -1 * | more

    ```


    In this case


    +   1. bash creates a new environment for the ls command to be executed in determines
    what should be standard input and standard output to the command. You can call
    this new environment child 1; the old environment is its parent.


    +   2. bash creates another environment for the more command to be executed in,
    called child 2, and determines what should be standard input and standard output
    to the more command. Because the symbol was between the ls -1 * command and the
    more command, the standard output of the ls -1 * command is attached to the standard
    input of the more command. The standard output of more is attached to the standard
    output of the parent shell. The parent shell is the one into which you have been
    typing commands and information, and the standard output of original bash shell
    is the screen.


    +   3. bash expands * to match all the filenames in that particular directory,
    as before.


    +   4. Next, in the child 1 environment, bash searches the PATH environmental
    variable looking for a command called ls. The same process occurs for the more
    command in child 2.'
