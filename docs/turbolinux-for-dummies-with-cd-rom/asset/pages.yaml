  md: '# 312 Part VI: The Part of Tens


    You see a stream similar to the following:


    ```

    /bin:/usr/bin:/usr/local/bin

    ```


    These are the directories Linux looks in to find the command, program, or shell
    you want to execute. You might see more directories depending on your distribution
    or how your system administrator (if you have one) set up your system.


    Now suppose you create a shell or a program called flobnob and want to execute
    it (and assuming you have set the permission bits to make flobnob executable by
    you). You have two choices (well, you have more than two choices, but I''m listing
    the safest ones). One choice is to type the following on the command line:


    ```

    /flobnob

    ```


    This tells Linux to look in this directory (./) and execute flobnob.


    Your second choice is to move flobnob to one of the directories shown in the PATH
    variable, such as /usr/local/bin.


    # When I Start X, Is a Grey Grey


    **Problem:** You configured X, but when you log in as a general user (that is,
    not as root) and type startx, all you get is a grey screen with a big X in the
    middle. You wait a long time, but nothing happens.


    **Solution:** Recognize that you may have to wait a long time for a slow CPU with
    a small amount of main memory (about 8MB). Some machines with small amounts of
    memory have required as long as six minutes to start X. By assuming that you are
    starting X on a machine with a faster CPU and more memory, you may have problems
    with permissions on your home directory. This is particularly true if X works
    when you are logged in as root (that is, as super) but not when you are logged
    as a general user.


    To correct this, log in as root and go to the home directory of the user who is
    having problems. For this example, suppose that the login name of the user is
    lmember. After you are in the user''s home directory, list the -ld command to
    see who owns that directory and what the permissions are on that directory:


    ```

    cd ~lmember

    ls -ld

    drwxr-xr-x root bin 1024 Oct 31 16:00 .

    ```'
