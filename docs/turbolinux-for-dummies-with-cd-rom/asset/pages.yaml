  md: '# Chapter 7: Using Linux for the First Time 121


    For now, you will be logging in as *root*, which in Linux terms is known as superuser.
    The *superuser* (da, da! Superuser!) is a privileged account that enables a person
    to go anywhere and do anything on the system. Supersers can add disk drives, do
    backups, restore damaged files, and turn the system off and on. They can also
    damage the system if they make a mistake. Because supersusers are all-powerful,
    their mistakes can be all-bad.


    ![](img/8ae48244df88d68913b10871643fd825_146_0.png)


    Before doing much in this chapter, you need to create another account for yourself
    that is *unprivileged* — root is a privileged account, of course. In that way,
    when you make a mistake while becoming familiar with TurboLinux — and who doesn''t?—
    that mistake will be limited to the power of your account. You can erase your
    own files and data, but not someone else''s files or your system''s files. Comforting,
    isn''t it?


    Before you create that safe, new account for yourself, though, you need to log
    in as *root*. For that, you need the superuser password you entered during the
    installation in Chapter 5.


    If you have not configured X to start automatically at boot time, then you are
    presented with a simple login prompt, as follows:


    ```

    login:

    ```


    Otherwise, you are given a window prompting you for a login. The graphical and
    text-based login functions are the same. You want to enter your user name — **root**
    in this case, as shown below.


    ```

    login: root

    ```


    After you enter your username, you are prompted for a password, as shown:


    Password:


    You won''t see the password while you type it on the screen. This secrecy ensures
    that anyone watching over your shoulder cannot see the password and try to log
    in as *root*. Sound paranoid? It is — but it happens.


    If you make a mistake while typing the password (or while typing the word *root*),
    the system responds with


    ```

    Login incorrect

    ```


    and gives you another chance to enter the proper password by redisplaying


    ```

    login:

    ```


    Type *root*, and then type your password.'
