  md: '# Chapter 8: Working with Files and Commands


    Strictly speaking, the file has still not really moved. The data bits are still
    on the same part of the disk where they were originally. The file specification
    (the directory path plus the filename) that you use to talk about the file is
    different, so it appears to have moved.


    In early versions of Unix, you were not allowed to use mv to move a file from
    one partition to another; you could only copy it using the cp(1) command. Linux
    allows you to use the mv command to move a file anywhere. Normally, mv leaves
    the data in place and changes the file''s name or the directory where the name
    is placed. But when the file is moved across disk partitions (for example, from
    /usr to /home in a lot of Linux systems), the data is copied to the new disk partition,
    the new name is put in place in that partition''s directory structure, and the
    name and file''s data are removed from the old partition.


    Copying a file does some data. The syntax is


    ```

    cp <source> <destination>

    ```


    Look familiar? Its same syntax you use for the mv command.


