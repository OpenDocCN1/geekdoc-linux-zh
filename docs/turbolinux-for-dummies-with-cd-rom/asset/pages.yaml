  md: '# In this part...


    You''re about to embark on a journey through the TurboLinux installation program.
    (If your TurboLinux system is already installed, you can skip this part and peruse
    another one.\) Perhaps you know nothing about setting up the operating system
    on your computer. That''s okay. TurboLinux is smart, and reasonable. Plus, you
    have to guide you.


    In Chapter 3, you find out what TurboLinux needs as well as your system has in
    terms of hardware. In Chapter 4, you do more all-important preparation, such as
    creating a boot floppy disk. You also find out how to squeeze the data on your
    hard disk so that you can fit TurboLinux there, too.


    Chapter 5 shows you how to do what you''ve been waiting for ever since you bought
    this book: Install TurboLinux. Like park rangers, we guide you along the various
    trails of the installation process, pointing out pitfalls and cautioning you about
    hazards. You get to enjoy the views, too, as you move screen-by-screen through
    your trek.


    Your travels through the installation may not be over yet, however. Installing
    the graphical desktop (the X Window System and KDE) can be tricky, which is why
    we provide an entire troubleshooting chapter on it. So, if you have any troubles
    with this part of the installation, Chapter 6 is for you. If you installed the
    X Window System without a hitch, break out the trail mix and enjoy a well-deserved
    rest.


    Finally, in Chapter 7, you reap the benefits of all your efforts and use TurboLinux
    for the first time. Happy trails.'
