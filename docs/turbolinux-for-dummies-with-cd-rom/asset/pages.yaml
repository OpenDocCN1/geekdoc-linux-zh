  md: '# Chapter 11


    # Getting to Gknow GNOME and X


    **In This Chapter**


    +   - Introducing the X Window System

    - Introducing GNOME and Enlightenment

    - Configuring GNOME

    - Managing windows

    - Understanding the virtual desktop

