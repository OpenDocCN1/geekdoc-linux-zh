  md: '# Chapter 4


    # Making Room for TurboLinux


    # In This Chapter


    +   - Finding out what you need to install TurboLinux from a CD-ROM

    - Creating your boot disk

    - Discovering whether you need a supplemental hard drive

    - Squeezing TurboLinux onto your hard drive


    Now it''s time to open your TurboLinux distribution — unless you''re the impatient
    type and have already ripped it from its packaging like a child on Christmas morning.
    If you have a TurboLinux distribution or are using the one on the TurboLinux For
    Dummies CD-ROM, the installation should work almost exactly as we describe here.
    If you have a different installation, read the instructions supplied with the
    distribution and use this chapter as a guide.


    # Installing from a CD-ROM


    The easiest way to install Linux is on a system with a CD-ROM (especially an ATAPI/IDE
    or SCSI CD-ROM). First, you must create a boot floppy, an extra hardware floppy,
    and perhaps a supplemental floppy from files on the CD. If, to install Linux,
    you need to use a PCMCIA card for a CD-ROM controller, you will have to make the
    supplemental floppy as well as the boot floppy. The supplemental floppy contains
    the device drivers and other code needed for PCMCIA cards to work. The extra hardware
    floppy contains drivers for less common hardware.


    ![](img/8ae48244df88d68913b10871643fd825_74_0.png)


    If you aren''t sure whether you need a supplemental or extra hardware floppy,
    make them anyway. If they''re required, you have them. If they are not required,
    hey, you can always overwrite the floppies.'
