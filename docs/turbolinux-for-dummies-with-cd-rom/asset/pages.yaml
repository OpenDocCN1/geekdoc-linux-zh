  md: '# 36 Part II: Installing TurboLinux


    # Notebooks before PCMCIA


    Early notebooks had no built-in CD-ROMs, and until Linux had PCMCIA support, I
    had to install Linux using floppies. I still remember the day I got both my new
    notebook and the new release of Linux that had PCMCIA support. I ran out and bought
    a PCMCIA SCSI controller that night I could use my SCSI CD-ROM to do the installation.


    My life has been better ever since. Having used floppies to install Linux on various
    notebooks not once or twice, seven times, I would have paid ten times the amount
    for PCMCIA card.


    The main types of hard disks are IDE and SCSI, and each type has its own controller.
    IDE is more common in PCs, and usually usually have two controllers than one.
    For each IDE controller, your system can have only two hard disks: a master and
    a slave. Therefore, a PC with two IDE controllers can have up to four hard disks.
    You should know which hard drive is on which controller, as well as whether it
    is the master or slave on that controller. Also, if you have a Windows system
    that you want to preserve, you should know which hard drive it resides on. Normally,
    on a Windows system


    # Disk controllers


    +   * The first controller''s master disk is called C.

    * The next hard disk is called D and is the slave disk on the first controller.

    * The next disk is E and is the master disk on the second controller.

    * The last disk is F and is the slave disk on the second controller.


    Normally, Windows is located on your C drive, and data is on your other drives.
    This lettering scheme is just one possibility; your disks can be set up differently
    and even include CD-ROMs as drives on your IDE controllers.


    High-end PCs have a SCSI controller on the motherboard or on a separate SCSI controller
    board, either in addition to or instead of the IDE controllers. Older SCSI controllers
    can have up to eight devices on them, numbered 0–7, including the controller.
    Newer SCSI controllers (known as wide controllers) can have up to 16 devices,
    including the controller itself.


    If all you have a SCSI disk, usually disk 0 or disk 1 is your C drive, and others
    follow in order.'
  merge: -1
