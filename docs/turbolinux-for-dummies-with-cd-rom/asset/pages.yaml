    Your password must be at least six characters long. I recommend that you use a
    combination of uppercase and lowercase letters as well as numbers to make the
    password as difficult to compromise as possible. In addition, do not choose names
    or items that are easy to associate with. In other words, your name, your dog''s
    name, qerty, 123456, passwd, and the like are poor choices. Beer, for example,
    is a poor selection for Maddog''s password, even though it has both uppercase
