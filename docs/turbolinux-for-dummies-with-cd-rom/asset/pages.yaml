- img_proc: true
  md: '# Chapter 9: Working with Editors


    Most Unix books show meta keys without the + sign. For example, Ctrl+Z in this
    book becomes Ctrlz, ctrl-z, or ''z''. Another frequent occurrence in Unix texts
    is ''d as the symbol for ending a file, which is the same as pressing the Ctrl
    key at the same time.


    # Saving yourself


    When you work with the text of a file, the text is kept in a buffer (a place in
    memory), and no changes are made to the file until you save and exit. Get into
    the habit of saving your text early and often. Although TurboLinux systems are
    stable, it would be just your luck to have a power failure after you''ve spent
    five hours typing a large, unsaved text file.


    Saving your file is particularly useful when you are going to execute some large,
    complex command that will transform your text file dramatically. Most editors
    have an undo command that backs out the last one or two (or) commands and text
    you have given the editor. Writing the buffer to disk, however, is foolproof.


    When you make a mistake and you want the file back when you did the last save,
    you must quit — rather than exit — the editor. Quitting usually means leaving
    the editor without doing one save of the file. Exiting usually means saving the
    changes that exist in the buffer and then leaving the editor. Most editors have
    both functions.


    Some editors have autosave, which is a nice feature for people who are forget
    about saving their files. Autosave counts how many commands or changes you make
    to a file, and then automatically saves the buffer to the file after a certain
    number of changes. We, however, do not like autosave. For one, the autosave feature
    causes some editors to freeze during autosaving, and we find this trait annoying.
    Two, autosave can happen at the worst time. For example, if you execute a complex
    command that erases your buffer and then autosave kicks in, the undo command may
    be unable to undo that complex command.


    If you use autosave, we recommend that you consciously save a manually (which
    resets the autosave counter) right before you do a complex command. Then you can
    recover the file if necessary by quitting the editor without saving the buffer,
    getting back to the command prompt, and restarting the editor on the file again.'
