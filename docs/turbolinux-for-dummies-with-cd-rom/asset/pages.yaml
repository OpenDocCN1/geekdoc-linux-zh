  md: "# 154 Part III: Using TurboLinux\n\n# Working with ed\n\nIn this discussion\
    \ of editors, we start with the smallest and simplest. The ed editor is the one\
    \ you must use if you boot a minimal version of Linux, as you would from a boot\
    \ floppy. Also, with some hardware configurations, the system can't support a\
    \ full-screen text editor such as vi or emacs.\n\nTo invoke ed, you use the following\
    \ command syntax:\n\n```\ned [-] [-p prompt-string] [filename]\n```\n\nRemember,\
    \ the command arguments inside the brackets are optional. These are the functions\
    \ of the command options:\n\n+   - Suppresses the printing of diagnostic messages\
    \ and character counts\n - p prompt-string Sets the prompt to prompt-string, where\
    \ the default is no prompt\n - filename The name of the file you want to edit\n\
    \nThe ed has two modes of operation: Command mode is the default. When in mode,\
    \ everything type is a command to ed. The ed command set is a simple one in which\
    \ commands are expressed as single characters.\n\nText-input mode is when you\
    \ enter text into the buffer with commands for append, c for change, or i for\
    \ insert. To leave text-input mode, you enter a period (.) on a line by itself.\n\
    \nThe following is an example of how to invoke ed to edit the tove.and.linux file:\n\
    \n```\ned -p: tove.and.linus\n```\n\nThis command sets the prompt as : and opens\
    \ the tove.and.linus file for editing. Prompt characters are a good idea because\
    \ it's difficult to tell whether ed is in command mode or text-input mode without\
    \ a prompt. You can select any prompt you want.\n\nAlthough you can select any\
    \ prompt you want, we suggest that you use the colon (:) for two reasons. First,\
    \ other text editors use the colon, so it's familiar. Second, using the colon\
    \ avoids confusion with shell prompts such as $, &, and #.\n\n![](img/8ae48244df88d68913b10871643fd825_179_0.png)"
