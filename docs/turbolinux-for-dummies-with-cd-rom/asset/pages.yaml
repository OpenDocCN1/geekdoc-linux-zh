  md: '# Chapter 8: Working with Files and Commands 145


    # # Making Your Own Rules


    You, as the owner of a file, you can specify permissions for reading, writing
    to, or executing a file. You can also determine who (whether, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission):


    +   - Read permission for a file enables you to read the file. For a directory,
    read permission allows the ls command to list the names of the files in the directory.
    You must also have execute permission for the directory name to use the -l option
    of the ls command or to change that directory.


    +   - Write permission for a file means you can modify the file. For a directory,
    you can create or delete files inside that directory.


    +   - Execute permission for a file means you can type the name of the file and
    execute it. You can''t view or copy the file unless you have read permission.
    This means that files containing executable Linux commands, called shell scripts,
    must be both executable and readable by the person executing them. Programs written
    in a compiled language such as C, however, have only executable permissions to
    protect them from being copied whatever they shouldn''t be.


    For a directory, execute permission means that you can change to the directory
    (with cd). Unless you also have read permission for the directory, ls -l will
    not work. You can list directories and files in that, but you can''t see additional
    information about the file or directory by just doing an -l command. This may
    seem strange, but it''s useful for security.


    The first character of a file permission is a hyphen (-) if it is a file or d
    if the file is a directory. The nine other characters are read, write, and execute
    positions for each of the three categories of file permissions:


    +   - Owner (also known as the user)


    +   - Group


    +   - Others


    Your playtime file, for example, might show the following permissions when listed
    with the ls -l playtime command:


    ```

    -rw-r--r--

    ```


    The hyphen (-) in the first position indicates that it is a regular file (not
    a directory or other special file). The next characters (rw-) are the owner''s
    permissions. The owner can read and write to the file but can''t execute it. The
    next three characters (r--) are the group''s permissions. The group has read-only
    access to the file. The last three characters (r--) are the others'' permissions,
    which are also read-only.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 146 Part III: Using TurboLinux


    [ ] r-- r-- illustrates the four parts of the permissions: the file type followed
    by three sets of triplets indicating the read, write, and execute permissions
    for the owner, group, and other users of the file.


    It''s easy to specify most file permissions using only six letters:


    +   - ugo, which stands for — no, not a car — user (or owner), group, and other

    - rwx, which stands for read, write, and execute


    These six letters, and some symbols such as = and commas, are put together into
    a specification of how you want to set the permissions of the file.


    The command for changing permissions is chmod. The syntax for the command is


    ```

    chmod <specification> filename

    ```


    Change the mode of party to give the user the ability to read, write, and execute
    the file:


    ```

    chmod u=rwx party

    ```


    That was easy enough, wasn''t it? What if you wanted to give the group permission
    to only read and execute the file? You could execute the following command:


    ```

    chmod g=rx party

    ```


    Note that this last command does not affect the permissions for owner or other,
    just the group''s permissions.


    Now set all the permissions at once. Separate each group of characters with a
    comma:


    ```

    chmod u=r,g=rw,o=rwx party

    ```


    This sets the user''s permissions to just read, write, and the other''s permissions
    to read, write, and execute.


    You can set the permission bits in other ways. This way is so simple, though —
    why use any other?'
