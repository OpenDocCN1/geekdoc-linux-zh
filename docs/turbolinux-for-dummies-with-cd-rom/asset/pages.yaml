  md: '# 302 Part VI: The Part of Tens


    # Using Web Sites


    Among the most flexible and up-to-date places to find information on any subject
    including Linux of course is — who''d have thought it — the Web. The following
    sites are a sampling of places that you find helpful.


    # Visiting TurboLinux''s Web site


    TurboLinux provides the perquisite Web site at www.turbolinux.com providing all
    of the services that you need to get with your system. You can download the entire
    distribution or parts of it. You can also find information from the FAQ (Frequently
    Asked Questions) that the site maintains. If you purchase TurboLinux, you are
    provided with 60 days of installation via e-mail. Beyond that, you can purchase
    additional support.


    # Visiting other Web sites


    You have a variety of Web sites available for help. Some of these sites provide
    technical information, some news of the Linux community, and others furnish a
    bandstand for the Linux community to voice their opinions. For example:


    +   * Linux International: www.li.org

    * LinuxHQ: www.linuxhq.com

    * Linux Today: www.linuxtoday.com

    * Linux Documentation Project: www.metalab.unc.edu/LDP/

    * Linux Now: www.linuxnow.com

    * Linux Journal, Linux Gazette, Linux Resources: www.ssc.com

    * Linux Focus: www.linuxfocus.org

    * Linux Weekly News: www.lwn.net

    * Slashdot: www.slashdot.org

    * Freshmeat: www.freshmeat.org

    * File Watcher: www.filewatcher.org

    * The creator of nmap (security oriented): www.insecure.org

    * Root shell (security oriented): www.rootshell.com

    * CERT''s homepage (security oriented): www.cert.org

    * Josh''s Linux Guide: http://jgo.local.net/-LinuxGuide'
  merge: -1
