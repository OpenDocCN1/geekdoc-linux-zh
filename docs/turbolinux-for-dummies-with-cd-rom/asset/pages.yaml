    up more of the screen, color depth versus resolution is a trade-off you can make
    by choosing the options in the dialog box in Figure 5-6.


    If your system has a small amount of memory (such as 1MB), your screen can have
    a resolution of 1,024 x 768 pixels (dots) with 256 colors (bits) on the screen
    at one time. If your system has 2MB, you can have 64,000 (16 bits) on the screen
    at the same time as resolution. If you have an older video board with a small
    amount of video memory but some additional memory sockets, you may be able to
    upgrade the amount of video memory on the video card.


