  md: '# 34 Part II: Installing TurboLinux


    # Hardware Supported by TurboLinux


    Generally, TurboLinux runs on any Intel-compatible computer with a 386 or newer
    processor, with ports to the Digital Alpha and PowerPC in the works. I concentrate
    on Intel PCs because they represent the bulk of modern systems. If you have one
    of these other systems, don''t despair: They aren''t that different and you can
    probably adapt the instructions. You need a different CD-ROM (and may need to
    wait) than the one in the back of the book, however, because it supports only
    the Intel line of processors.


    TurboLinux supports symmetric multipcessing (SMP), which means you can have more
    than one CPU per box. In fact, it supports several processors per system box.
    If your system has more than one CPU, TurboLinux will be able to utilize those
    CPUs also, by speeding up a specific program written to take advantage of multiple
    CPUs or by allowing more programs to execute at one time. (If you have an SMP
    system, would you care to test one of us?)


    But the processor isn''t the only piece of hardware that you need to know before
    you install TurboLinux. You should also know about the items in the following:


    +   - Disk controllers. How many do you have, and what are their types (IDE, SCSI)?
    Which hard drives are connected to your controllers? If a SCSI controller is installed
    in your machine, what is its make and model number?


    +   - Hard disk. How many hard drives do you have? What is each drive''s size
    and order (which one is first, second, and so on)?


    TurboLinux installs in about 200MB of disk space, but if you plan to use the graphical
    interface, I suggest a total of about 700MB. And by the time you install all the
    goodies, you will probably have installed a total of over 1GB of computer programs,
    data, games, and anything else you download from the Internet. When considering
    your system needs more disk space or RAM, remember that gluttony can be a good
    thing—you never have too much of either.


    +   - CD-ROM. What is the interface type? Is an IDE drive, a SCSI drive, or some
    other type? For CD-ROM drives other than IDE (ATAPI) or SCSI, what is the make
    and model number?


    TurboLinux handles IDE/ATAPI, SCSI, and other miscellaneous CD-ROM drives. Some
    early CD-ROM drives are not standard; they attach directly to sound cards and
    other devices. TurboLinux''s installation program can detect and use these. If
    you don''t have an IDE/ATAPI or SCSI CD-ROM drive, you need to know the make and
    model number of your CD-ROM drive and what type of controller (perhaps a specific
    sound card) the CD-ROM drive is attached to. To do this, you need to open up your
    system and look for the make and model number of the CD-ROM on the physical drive.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 3: Discovering What''s in Your System


    +   - RAM. How much RAM is installed on the computer? Without graphics, Linux
    runs (er, walks) with 4MB. With graphics, Linux runs in a minimum supported 8MB;
    with 16MB, the graphics get much faster. With 32MB, Linux screams and the speed
    of the application (particularly program) increases dramatically. Some Linux developers
    have 128MB in their systems they tend to run many programs at a time, and each
    program takes a certain amount of RAM when running.


    +   - Mouse. What type of mouse do you have — a bus mouse, PS/2 mouse, or a serial
    mouse? How many buttons does it have? If you have a serial mouse, which COM port
    is attached to it and what software drivers does it use (such as Microsoft or
    Logitech)?


    +   - Monitor. What is the name and model of the monitor? What are its vertical
    and horizontal refresh rates? You need this information only if you will be using
    the graphical portion of Linux, called X Window System.


    +   - Video card. What is the name and number of the video card or chip set and
    the amount of RAM?


    +   - Network interface card (NIC). If you have a network connection, what is
    the name and model of the network interface card?


    TurboLinux supports a variety of sound cards, serial line cards (for attaching
    lot of serial printers or modems to a system), and other peripherals. The hardware
    components supported by the code on your TurboLinux For Dummies are listed in
    Appendix A. You generally install TurboLinux from a CD-ROM.


    You can install TurboLinux, after making one or two disks, by copying files over
    the network. This is a viable way of installing Linux on the type of local area
    network (LAN) used at colleges or businesses or if you have a friend who has a
    Linux system, a CD-ROM drive, and a networking card of the same type as yours.
    If the network is not fast (that is, it can''t pull lots of data quickly), however,
    the easiest way to install Linux is by using a CD-ROM drive attached to your system.
    Trust me.


    You install TurboLinux on a notebook by using the notebook''s built-in CD-ROM
    drive (if it has, a CD-ROM drive attached to the notebook''s docking station,
    or a SCSI CD-ROM drive attached to a PCMCIA SCSI controller). If you do not have
    any of these, you could try to get a PCMCIA Ethernet controller and do a network
    installation if another Linux system on the network has a CD-ROM drive installed.


    To install Linux, you need to answer the questions in the preceding list. Now
    that you know what you should be looking for, the next section delves a bit more
    into how to locate and capture information.


    ![](img/8ae48244df88d68913b10871643fd825_60_0.png)'
  merge: -1
