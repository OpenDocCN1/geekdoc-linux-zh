  md: '# 118 Part II: Installing TurboLinux


    # X-terminating X


    If you are accustomed to Windows, it may seem strange to have a section on shutting
    down your graphical interface system. After all, shouldn''t you just turn off
    the power switch? The answer is no! Just like Windows, Linux systems require a
    systematic process to shut down the operating system, after which you can turn
    off the power switch.


    If you have just finished installing the system, you are logged on as a systems
    administrator called root. Follow these steps to shut down the system:


    +   1. If X is running, press Ctrl+Alt+Backspace to stop it.

    The system returns to character-cell mode, and the # prompt appears. The # prompt
    tells you that you have the powers of the systems administrator (don''t let it
    go to your head) and that you can shut down the operating system.

    2. Type shutdown-h now at the prompt.

    This tells Linux to halt the system now rather than later.


    shutdown is a command to Linux. Some commands have options, flags, that provide
    additional information about what the command should do. -h means to halt the
    system after it shuts down, rather than rebooting. -r means to start rebooting
    after shutting down. Without now, the shutdown command would hesitate and send
    warning messages to people still working on the system, telling them that the
    system is about to be turned off.


    One other method of rebooting the system is the infamous three-finger salute that
    Microsoft users know: Ctrl+Alt+Delete, which simply sends a shut down -r command
    to Linux. This is also known as a "soft" reboot, whereas a "hard" reboot is manually
    turning off the computer and then switching back on.


    As a Linux user, rebooting the system should be an infrequent occurrence. Because
    the login procedure provides a Linux system with the necessary security, you do
    not need to shut it down between sessions. Linux is stable, so it does not freeze
    often, as some other PC-based operating systems. If you have multiple operating
    systems on the same machine, however, rebooting takes you back to the LILO prompt
    (or the System Commander, or other booting program) to allow you to boot another
    operating system.


    ![](img/8ae48244df88d68913b10871643fd825_143_0.png)'
  merge: -1
