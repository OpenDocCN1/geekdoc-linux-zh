  md: '# About the Authors


    Jon "maddog" Hall is the Executive Director of Linux International, a vendor organization
    dedicated to promoting the use of the Linux OS. He has been in the computer industry
    for over a quarter century. While working for DEC, maddog met Lin Torvalds, and
    Linux entered and changed his life, mostly by providing him with 22-hour work
    days. You can usually find Jon speaking at various Linux conferences and events,
    and he has also been known to travel long distances to speak to local Linux user
    groups.


    Justin Ryan started PChelp (www.computers.iwz.com) including product reviews and
    operating system info (featuring Linux). He is a Developer Relations/Support Associate
    for PacificTech. He writes for Linux Journal.


    Paul Sery works for Sandia National Laboratories in Albuquerque, NM, USA. He is
    a member of the Computer Service Unit, Special Projects, which specializes in
    managing and troubleshooting UNIX and Linux systems.


    When he is not beating his head against systems administration problems, Paul
    and his wife Lidia enjoy riding their tandem through the Rio Grande valley. They
    also enjoy traveling throughout Mexico. Paul is the author of Red Hat Linux Network
    Toolkit and Red Hat Linux 6 in Small Business, both published by IDG Worldwide,
    Inc. He has a bachelor''s degree in Electrical Engineering from the University
    of New Mexico.'
