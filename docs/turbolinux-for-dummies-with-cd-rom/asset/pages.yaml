    +   5. Fill in the remaining blanks.


    The Description is just a textual description to distinguish one dial-connection
    from another. The other fields are mostly self-explanatory. Note that username
    and password are only valid options if you''re using PAP authentication; if you''re
    not, you have to enter the challenge/response phrases directly (the following).


    There are many option checkboxes on this screen (and even more if you go into
    the More Options section, but those aren''t necessary to set up a working interface).
    The options you need to be concerned with


    +   Use PAP Authentication — Most ISPs (Internet service providers) can use PAP
    (Password Authentication Protocol). This is what Windows uses to talk to your
    ISP when connecting via Dialup Networking. At least one major ISP (PSINET) does
    not accept PAP.


    +   Passive-Mode LCP — Some ISPs do not want clients to initiate authentication
    requests themselves. If your ISP does this, turn this option on. If you''re not
    sure, leave it off. If your PPP interface doesn''t work, come back to this screen
    by running turboppppcfg as root and reconfigure this option.


    +   Automatically Reconnect — If something causes the connection to die, this
    option will attempt to restart the PPP interface.


    +   Connect at Boot — Turn this on if you want the interface to be activated when
    you boot your system.


    +   Use Static IP — If your ISP has assigned you a static IP address, select this.


    +   Demand Dialing — If you want the interface to only be activated there is a
    need for it, select this option.


    If are NOT using PAP authentication, you will have to enter and challenge/response
    phrases. For example, some ISPs require you to manually log in. An example would
