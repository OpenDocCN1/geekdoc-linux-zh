  md: '# Text Editors


    Linux systems often come with several different text editors. Text editors are
    programs that typically enable you to type and manipulate alphanumeric characters.
    Some text editors can do simple word-processing tasks, such as word wrap, but
    they can''t perform most word-processing functions, such as spell checking or
    italicizing text.


    Text editors are good for simple text-editing tasks and for writing simple or
    complex programs. Most editors have built-in help functions, and some have full-scale
    documentation built in or available online. In addition, you can find books about
    a few editors, as which `vi` and emacs.


    In this section, we describe character-cell text editors and graphical-based editors
    that you can find as freeway or shareware. We also describe some commercial text
    editors.


    # Character-cell text editors


    ed(1) is the oldest character-cell text editor and comes with every Unix system,
    ed is difficult to use because it doesn''t normally show you the entire file,
    and it doesn''t show you the changes you made until you ask it to do. Those who
    use ed are usually old-time Unix users with long, gray beards who wear suspenders
    with their shorts. Even with these downsides, it''s useful to know how to use
    ed it usually comes with every Linux system.


    Following quickly after the introduction of ed was an extended editor called vi
    and a visual front vi was written in the mid-1970s, and it allowed people to see
    a full screen of text at one time! Believe or not, this was big news in those
    days. Many Linux systems ship with a new version of vi called vim(1), which stands
    for vi improved.


    You can execute vim by typing vim, but most distributions also have made a link
    to it as vi and ex. a link is a way to give two names to the same program. Although
    the program is being executed, the system is smart and looks at what the users
    use when starting the program. If the user types vi, the program acts like vi;
    if the user types ex in this way, users can continue to type vi and see what they
    are used to seeing with vi, and vim can likewise type vim.


    Another character-cell editor is emacs, one of the shining stars of the Free Software
    Foundation. Devotees of emacs claim that it is more than just a text editor; it''s
    an interface to reading mail, debugging your programs, reading-news from the Internet,
    and a variety of text-oriented activities.


    ![](img/8ae48244df88d68913b10871643fd825_46_0.png)'
