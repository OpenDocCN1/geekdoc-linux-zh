    3. Enter the boot options needed to identify your hardware, if any.


    If you have not needed special options in booting or identifying your hardware
    to Linux, don''t enter any special options in the dialog box. If you''ve had to
    add special options to the boot line to get Linux to see some of your devices,
    this dialog box is the place to put those options.


    If you''ve used LBA mode to address SCSI disks with boot blocks 1023 cylinders
    and you have turned on LBA mode in your BIOS, select the Use Linear Mode box.'
