  md: '# Some ed commands


    You found out how to invoke ed. You created a file and then displayed it. The
    ed editor has a lot more commands; simply moving around in a file can be accomplished
    in many different ways. One reason why people think Unix or Linux is too difficult
    to use is that others overwhelm them by showing every possible way to accomplish
    a task. Instead, they really need to know only the simple way to do something;
    they can discover the shortcuts later. In that spirit, we present the three most
    basic movement commands in Table 9-1.


    | Table 9-1 | Moving Around in ed |

    | Command | What It Does |

    | + | Goes to the next line |

    | - | Goes to the preceding line |

    | $ | Goes to the last line in the buffer |


    With the three commands in Table 9-1, you can move to any line in your file and
    update it. Yes, you can move through a file in other ways, but these are a good
    place to start. Table 9-2, continuing with the idea of not showing you every possible
    command variation, lists the most frequently used ed commands.


    | Table 9-2 | Everyday ed Commands |

    | Command | What It Does |

    | . | Refers to the current line in the buffer |

    | ; | Refers to a range of lines in the buffer |

    | c | Changes specified lines |

    | /regex/ | Searches forward for the specified regular expression |

    | ?regex/ | Searches backward for the specified regular expression |

    | = | Prints the line number |

    | ä | Appends after the current line |

    | i | Inserts text before the current line |

    | [Enter key] | Displays the next line and makes that line current |

    | d | Deletes specified lines |

    | j | Joins contiguous lines |'
