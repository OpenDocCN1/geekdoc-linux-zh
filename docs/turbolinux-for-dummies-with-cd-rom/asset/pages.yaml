    # Your Wish Is My Command


    We''ve been showing you interactive shell functions, a fancy term that simply
    means that you type something and the computer executes it immediately. After
    a while, you may notice that you''re typing a certain series of commands over
    and over. Wouldn''t it be nice to put them in a file and execute them all at once?
    Well, you can!


    For the rest of this section, you work on creating shell scripts, which contain
    a series of commands that are executed every time you type the name of the script
    as a command. First you create a simple shell script, and later you create a more
    complex one.


    Suppose you want to generate a report from time to time showing owns the login
    accounts. You could simply print the /etc/passwd file, but that has a lot more
    information in it than you need. Plus, you''re an organized type of person and
    want to format the report more nicely than the passwd file is formatted.


    First, look at the following entry in the passwd file:


    ```

    maddog:eyrtwuir:500:500:TurboLinux

    User...,/home/maddog:/bin/bash

    ```


    Each grouping of characters between the colons is called a field. For the report,
    you want only the first and fifth fields. The cut command is the way to go. The
    man page for the cut command shows that the command to go is the first and fifth
    fields is as follows:


    ```

    cut -f 1,5 -d: /etc/passwd

    ```


    The man pages are terse but complete descriptions of commands. To get to the man
    page for the cut command, type man cut on the command line.


    ![](img/8ae48244df88d68913b10871643fd825_205_0.png)'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# # Chapter 10: Avoiding Shell Shock


    You use the -f option the cut command to list the fields you want printed, in
    this case the first and fifth fields. You use the -d option to specify the delimiter
    for the field, which in this case is a colon. The preceding command gives lines
    of output formatted like:


    ```

    maddog:TurboLinux User...,

    ```


    Maybe you''d prefer to replace the colon with a hyphen, adding a space on each
    side to make the reader easier to read. The stream editor sed is your ticket to
    formatting happiness. You can send the output of cut directly to sed with the
    following command line:


    ```

    cut -f 1,5 -d:/etc/passwd | sed -e ''s/:/ /''

    ```


    The pipe symbol, |, takes the output of the cut command and feeds it to the sed
    command. Look at the part of the command line to the right of the pipe symbol,
    and you can see that the e option of the sed command tells the command to use
    the next string of characters (in this case, what appears between the two apostrophes,
    or single quotation marks) as a command for the sed editor. (The command here
    is basically the same as the vim editor, which you can read about in Chapter 9.)
    The command finds the string of characters between the first and second slash
    and replaces them with the characters between the second and third slash marks.


    Note the single quotes around /s/:/ / ''. This makes the shell think the entire
    string of characters as one thing and the string to the sed editor as the thing
    that e has to work with. Without the single quotes, the shell would include the
    blanks in the string that three different things are in that of characters: s/:/,
    -, and /. In shell statements, unquoted blank space (called white space) is considered
    a separator.


    Continuing with your report, you want some type of header that states the subject
    of the report and the date. You can use the echo command (for the header) and
    the date command (for the date):


    ```

    echo Report of login names and users on the Linux system date

    echo

    cut -f 1,5 -d:/etc/passwd | sed -e ''s/:/ / ''

    ```


    These four lines are not difficult to type, but you would have to remember them
    and retype them each time you run the report. We like to save time whenever we
    can, and our memory cells seem to be dropping like ... ah, we forget. For those
    reasons, we want to use our favorite text editor to type the lines in a file.


    Our favorite editor is vi. If you want to use another editor, we won''t stop you.
    But be sure to name your file quagmire so that the rest of the example will work.'
