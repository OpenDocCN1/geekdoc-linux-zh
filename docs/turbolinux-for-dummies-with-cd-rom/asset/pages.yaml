    2. Select the number of bits per pixel (bpp) that you want your video card to
    display. If the number you choose is rejected by turboxcfg, then go back and select
    a smaller number.


    Video memory is used to determine both the resolution and the color depth of your
    display — that is, the number of different colors that can be displayed. The more
    colors you have, the more natural or lifelike of your display will be.


    ![](img/8ae48244df88d68913b10871643fd825_138_0.png)


    Figure 6-7:

    The Default Color Depth dialog box.


    Color depth is controlled by the number of bits set aside for your display. The
    lowest depth is 8-bit color, which provides 256 colors. 16-bit color with 32,767
    colors is much better than 8-bit color (yech!). 24-bit color allows for over 16
    million colors, or true color as it is called. 32-bit color is the best of all,
    with the same number of colors as 24-bit color but another 8 bits added for 3-D
