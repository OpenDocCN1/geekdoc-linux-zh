  md: '# Chapter 4: Making Room for TurboLinux


    +   6. Boot your PC with the disk you just created.


    Place the disk in the floppy drive and restart your computer.


    +   7. Run fdisk (the MS-DOS version).


    At the A: prompt, type the following:


    ```

    FDISK

    ```


    +   8. Use the fdisk menu options to delete the partitions you want to change
    and make new ones for Windows and Linux. You may be asked about large disk support
    in the first message; go ahead and say yes if you aren''t sure.


