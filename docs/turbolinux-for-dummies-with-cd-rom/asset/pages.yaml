  md: '# # Chapter 14


    # # Customizing TurboLinux


    **In This Chapter**


    +   * Finding out about different types of memory

    * Unearthing how much RAM your system has

    * Checking out the performance of your disks

    * Rebuilding your kernel


    Our TurboLinux system is a mélange of hardware and software, and you have choices
    to make about both. So how do you tune your system for good performance? Follow
    this chapter, that''s how.


    Tuning operating systems can become a life-consuming task. If you''re obsessed
    about squeezing the most from your hardware and software, you won''t have time
    for anything else. Take advantage of the tips in this chapter, take a deep breath,
    and get on with the rest of your life.


    # ## Tuning Your TurboLinux System


    Most Unix-like systems don''t have many knobs and buttons you can change to make
    them work faster or better. TurboLinux, however, has a few special features that
    you can tweak for better performance. More importantly, if you follow a few guidelines,
    you help your TurboLinux system perform at its best.


    # ## You can never have enough memory


    Although having too much memory is theoretically possible, we suppose, most people
    have too little — in their systems, that is. Today, memory is so inexpensive that
    there are few excuses for not having enough.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 244 Part IV: Maintaining Your System


    Not having enough RAM is a holdover from memory prices such as $23,000 per megabyte.
    I paid $400 for 4 kilobytes (.004MB) of main memory about the same time I purchased
    a new pickup truck for $2,000.


    ![](img/8ae48244df88d68913b10871643fd825_269_0.png)


    # Real versus virtual memory


    When we talk about memory; we''re referring to the semiconductor RAM (random-access
    memory) in your machine. It''s best to have at least 32MB of RAM but 64MB is much
    better and 128MB won''t hurt at all. (Linux can run as little as 4MB, but that
    is pure torture.) Some users have up to 1GB (1GB = 1,000MB) of RAM in their PCs.


    If semiconductor RAM is the only type of memory you have, Linux and all programs
    running under it have to fit in that RAM. Although 64MB sounds like a lot, it
    fills up pretty quickly.


    Virtual memory uses hard disk drive space (which is cheaper than RAM) to make
    Linux think you have more memory. Virtual memory extends the RAM that you have
    and provides the following features:


    +   - More programs and files can run at the same time.


    +   - The space that programs and files require can exceed the size of actual
    RAM.


    Being able to run more programs or very large ones increases the flexibility of
    your Linux computer. For example, you can use an inexpensive or older PC as a
    small network server.


    The hard drive space that simulates memory is called swap space. (When you installed
    TurboLinux, you probably were asked to set up a swap space. Chapter 5 for the
    specific instructions.) Here''s how Linux uses swap space:


    +   - When Linux needs RAM to start a new application or allow an application
    to expand, some disk space becomes a substitute for the necessary RAM. The contents
    of an existing section of RAM is copied onto the swap space. This frees that section
    of RAM for the new data.


    +   - When Linux needs the information from the swap space, it must make room
    in RAM. Therefore, Linux may write other program''s data to the swap space before
    recalling data. This process is called paging, because the data is in RAM only
    when a demand exists for it to be. Otherwise, data stays on the swap area of the
    disk.


    +   - When the computer doesn''t have enough RAM to do its normal tasks (things
    like running programs and displaying graphics) efficiently, the computer is memory
    bound; the CPU must wait while the virtual memory are brought back into RAM. If
    this happens often, the computer is thrashing and becomes very slow.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Finding your RAM


    The procinfo and vmstat commands can help evaluate what and how your RAM is being
    used. Also, using these commands by themselves or with each other can tell you
    whether you are overutilizing your RAM memory. If so, your CPU is waiting for
    RAM to be available, and as a result, your computer''s overall performance speed
    may suffer.


    In the next two sections, we tell you how to measure your system performance with
    the procinfo and vmstat commands, and we offer some practical guidelines for getting
    Linux to help you work efficiently.


    # Measuring memory usage with vmstat


    The vmstat command displays information about memory utilization, the status of
    a process, the status of the I/O system, and CPU utilization. The command also
    tells you whether the swap partition is in use, and if so, how much of it is in
    use.


    Following is sample output of the vmstat command:


    ```

    ```

    [maddog@puddle]$ vmstat

    procs      memory swap          to system    cpu

    r b w swpd free free buff cache si so bo in cs us sy id

    1 0  2100 2372 13248 0 4 1 123 52 3 2 95

    ```

    ```


    The following list describes each element of the vmstat command output to your
    computer''s performance evaluation:


    +   - The r (run) value indicates the number of processes that are ready to run
    but are waiting for the CPU to pay attention to them. The more processes you have
    in this segment, the slower the system runs. That''s because the system has to
    provide time slices — to run — to all processes. The more process you have, the
    less time can be allocated to each one.


    +   - The b (blocked) value indicates processes waiting for something to happen
    (usually some type of I/O). These processes can''t run even if you have some free
    CPU cycles available to them.


    +   - The w value is the number of processes that are swapped out. Processes are
    swapped out if the system doesn''t have enough memory to run them efficiently
    or if they have been idle for more than 20 seconds.


    +   - The next four elements show memory amounts in kilobytes:


    +   - swpd shows the amount of virtual memory used.


    +   - free shows the amount of idle memory.


    +   - buff shows the amount of memory in I/O buffers.


    +   - cache shows the amount of memory in I/O cache.'
