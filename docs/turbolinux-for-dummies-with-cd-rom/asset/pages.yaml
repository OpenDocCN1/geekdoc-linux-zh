  md: '# Part II: Installing TurboLinux


    # Using different keyboard maps


    | Different countries have different keyboards. Linux, like Unix systems, has
    a keyboard mapping feature that enables you to use it with different keyboard
    configurations. | If you are not in the United States, you will probably choose
