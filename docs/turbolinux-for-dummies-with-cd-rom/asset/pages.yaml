    # # Just a few good commands


    Shell programming depends heavily on the many hundreds of specialized programs
    that come with most Unix systems. Of these many hundreds, 20 or 30 are used in
    day-to-day scripting, but the others are there just in case, if not at all, are
    documented in section one of the man pages.


    So I started going through the manual pages looking for a command that might help.
    Sure enough, it was there. From that day on, I felt comfortable with Unix, even
    though I keep learning about every day. Time to time, I still go through the reference
    pages of the manual one by one, to find out new commands and to refresh my memory
    on old days.


    I Madd, still remember the day I began to feel comfortable with Unix (long before
    Linux was available). I was trying to do something with a shell script, utilizing
    the 20 to 30 commands I knew. Finally the thought occurred to me although I was
    not sure Unix had the command needed, there was a strong probability that it did.


    Each one of these commands typically does very well, and you can put them together
    with pipes and shell script to solve the larger problem. Becoming familiar with
    them takes time and practice, but once you do that, your abilities expand thousandfold.


    The program we generated and an example of it being run:


    ```

    [maddog@localhost]$ cat -~/bin/genreport

    cat /etc/passwd | date +%Y%m

    <CTRL+D>

    [maddog@localhost]$ chmod u+x ~/bin/genreport

    [maddog@localhost]$ cd

    [maddog@localhost]$ mkdir reports ; cd reports;

    [maddog@localhost]$ genreport

    [maddog@localhost]$ reports]$ ls

    passwd199807

    [maddog@localhost]$ reports]$

    ```


    Note that on the second line, we typed two accent characters, not apostrophes.


    Single commands that are not separated by a pipe symbol — that is, their standard
    output not being fed to the standard input of the next command — may be placed
    on the same line and separated with a semicolon (;). This shortcut is useful in
    interactive mode because you don''t have to press Enter and wait for a response,
    but it saves some time in scripts. In scripts, it''s better to put commands on
    separate lines so they are easier to change if necessary.


    Suppose you run the program on the first day of the month over several months''
    time. You accumulate several copies of the passwd file, each with changes as login
    accounts are added and deleted.


