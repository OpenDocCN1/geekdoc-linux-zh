  md: "# 52 Part II: Installing TurboLinux\n\n# # Move Over and Make Room\n TurboLinux\n\
    \nYou can install Linux on your system, you need to make room for it. Some people\
    \ find space by getting rid of MS-DOS and Windows. Others don't want to make such\
    \ drastic changes and prefer to have both Linux and their other operating system\
    \ peacefully coexist. If this latter method fits the bill for you, the easiest\
    \ way to go is to add a new hard drive — either IDE or SCSI — to your system and\
    \ install TurboLinux on that.\n\nIf you don't want to get rid of your current\
    \ operating system or add another disk to your system, your only remedy is to\
    \ defragment your other operating system, make its disk space smaller, and then\
    \ install Linux in the free space.\n\nWindows systems usually have one big FAT.\
    \ That's the spot you need to make smaller so you can install Linux in the leftover\
    \ space. You can shrink the FAT partition by using destructive repositioning,\
    \ which wipes out all the data on the hard disk, or nondestructive partitioning,\
    \ which is not supposed to wipe out all the data on the hard drive. It's an adventure,\
    \ but as your guide, we steer you clear the pitfalls. Please keep your hands inside\
    \ the car at all times.\n\nNote: If you decide to keep space on your hard drive\
    \ for Windows, try to keep Windows in the first partition because it makes it\
    \ easier to manage Windows and Linux together.\n\nBefore performing any major\
    \ work on restructuring your disk, as you are about to do, it is always wise to\
    \ back up your disk in case something goes wrong. You don't want to lose any data\
    \ or programs that went hard to install. Please refer to your system's owner's\
    \ manual to find out how to back up your system (and how to restore the data if\
    \ necessary). We can't stress this strongly enough — backing up saves sanities\
    \ (like buckling up saves lives).\n\n# # Nestructive repositioning\n\nIf you can\
    \ add another disk to your system and your only choices are destructive and nondestructive\
    \ repositioning, nondestructive repositioning is definitely the better of the\
    \ two. You still need to back up your system, just in case you have to restore\
    \ it afterward.\n\nYou use an MS-DOS utility called FIPS (which is a clone of\
    \ fdisk) to nondestructive-resize your DOS partitions. FIPS is included in the\
    \ Turbo Linux For Dummies CD-ROM and from all other Linux distributions. I suggest\
    \ that you read the documentation in the fipsdocs subdirectory of the Turbo Linux\
    \ For Dummies CD-ROM before you use the FIPS utility.\n\n![](img/8ae48244df88d68913b10871643fd825_77_0.png)"
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Chapter 4: Making Room for TurboLinux


    Although FIPS is supposed to be nondestructive, make sure that you always back
    up your system before using it.


    98 and newer versions of Windows 95 have a 32-bit file allocation table (FAT)
    and drive management that provides for single-disk configurations larger than
    2GB. Older versions of Windows 95 had a 16-bit FAT; to use the space above 2GB,
    the drive had to be partitioned into logical drives of 2GB or less. Newer computers
    often have drives larger than the 2GB limit. If the drive is repartitioned, the
    large drive management system is disabled and DOS and Windows partitions are again
    limited to 2GB.


    The FIPS utility works by dividing the drive into two partitions. The first one
    is the DOS partition. The second one, beginning at the end of the space used by
    DOS and Windows encompassing the rest of the drive, is the non-DOS partition where
    Linux loads. If you want to use the FIPS utility to partition your drive, keep
    in mind that your DOS partition can hold only 2GB or less. If the amount of used
    space on your C partition is greater than 2GB, you will not be able to nondestructive
    repartition unless you either delete some files or move them to another disk.


    The problem with older computers is that the BIOS doesn''t recognize hard disks
    over a certain size (such as 512 MB) and hard disk makers have software overlays
    to trick the BIOS into recognizing the entire disk. You may be risking the loss
    of all your data by using a utility like FIPS (or even a commercial package like
    PartitionMagic) on an existing hard drive with these software overlays, so you
    should be careful!


    # Defragmenting


    The next steps in nondestructive partitioning are to defragment the disk (which
    moves all the data to the front of the disk segment, leaving space behind it for
    Linux) and then to use FIPS to carve the disk into partitions. But first things
    first, in this section you defragment your C partition by running the defragmentation
    program.


    In Windows 3.x and MS-DOS:


    +   1. Close all programs and windows on your system.


    +   2. If you are running Windows, exit from Windows into MS-DOS.


    To do so, go to the Program Manager window, choose File>Exit Windows, and allow
    Windows to exit as gracefully as it can.


    +   3. Now that you are in MS-DOS, change to your C: drive and go to the C:\\DOS
    directory.


    To do so, type


    ```

    C:\> cd dos

    ```'
