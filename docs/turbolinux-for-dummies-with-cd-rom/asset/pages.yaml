  md: '# Getting E-Mail


    Because surfing the Net can be so intriguing, you probably want to tell people
    about your online adventures. Well, Communicator helps you send and receive e-mail,
    too.


    Go to the main Navigator window and choose Communicator: Messenger. You are taken
    to the mail side of Communicator, known as Messenger, as shown in Figure 16-12.


