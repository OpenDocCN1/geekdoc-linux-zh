    of Linux are from a variety of people who distribute the programs over the Internet
    or on CD-ROM. Typically, these people add an installation technique, some management
    tools, some applications (either freer or commercial), and a distribution medium.
    The base Linux system must be able to be freely copied, even if value-added components
