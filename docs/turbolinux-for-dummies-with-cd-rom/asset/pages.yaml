  md: 'Given that characters you type are interpreted as commands in command mode,
    how do you get from command mode to text mode? Simple. Enter a command to do something
    in text mode and vi will take you to there. Here are some commands that can be
    used to illustrate how to switch from command mode to text mode:


    +   - Insert text before the cursor

    - Insert text after the cursor

    - Insert text at the beginning of the current line

    - Insert text at the end of the current line


    As soon as you type any of these commands, you are placed in text input mode.
    Do not press Enter after entering the command. Any text you type after you invoke
    the command is placed in a buffer and echoed to the screen.


    You may be asking yourself (the reasons are skimpy or there is no one else to
    ask), "How do I get out of text mode and back to command mode?" Again, the answer
    is simple. If you want out, just press the Escape (Esc) key and you''re immediately
    whisked back to command mode. That''s pretty easy, isn''t it?


    If you don''t know whether you are in command mode, just press Esc a few times.


    # Moving around in a file


    Now that you know how to open a file in vi, it might help if you knew how to move
    around in it. The commands in Table 9-3 move the cursor around. First, make sure
    you are in command mode; otherwise these keys are just placed in your file like
    any other data.


    | Table 9-3 Moving Around in vi |

    | Command | What It Does |

    | j | Moves one line down |

    | k | Moves one line up |

    | h | Moves one character to the left |

    | l | Moves one character to the right |

    | Ctrl+f | Scrolls down a full screen |

    | Ctrl+b | Scrolls up a full screen |'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'If you want to go to a specific line number, you use a colon command. Type
    a colon (:) and it appears at the bottom of the screen; then type the line number
    where you want to be. For example:


    :12


    Press Enter, and the cursor moves to the beginning of line 12.


    # Deleting and moving text


    The vi editor has several commands for deleting. You can delete characters, words,
    or lines. The command for deleting a word is dw; this deletes the word to the
    right of the cursor. More words can be deleted by prefacing the dw command with
    the number of words you want deleted from the cursor position. For example, the
    command 6dw deletes the next six words following the cursor. Table 9-4 lists additional
    deletion commands.


    | Command | What It Does |

    | :--- | :--- |

    | D$ | Deletes up to the end of the current line |

    | dd | Deletes the current line |

    | x | Deletes the character under the cursor (4x, 5x, and so on) |


    ![](img/8ae48244df88d68913b10871643fd825_187_0.png)


    A handy command to remember is u; it''s the undo command, and edits may be undone
    immediately with it, in the unlikely event that you make a mistake.


    The business of moving text around in the file usually requires the following
    general steps:


    +   1. Position the cursor at the beginning of the first line you want to move
    or copy.

    2. Type ma, marking that position with the letter a.

    3. Position the cursor at the beginning of the last line that you want to move
    or copy.

    4. Type mb, marking that position with the letter b.

    5. Position the cursor at the line where you want to insert the text.

    6. Type ''a, bm. if you want to move the text, or ''a,bt. if you want to copy
    the text. Note that the single quotation mark and period are required.'
