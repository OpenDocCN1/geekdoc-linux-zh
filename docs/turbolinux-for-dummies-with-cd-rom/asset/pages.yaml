    # # Surfing with the proper footing


    When you want to start with the Web, you need the proper footing. To get a page
    of information on the Internet, you type or click a URL (Uniform Resource Locator).
    After you have even one URL, it''s usually easy to go from there to other places
    on the Web. URLs look like this:


    ```

    http://.ii.org/

    ```


    or this:

    www.ii.org/

    Some browsers omit the http:// Some browsers also allow you to omit the trailing
    slash, unless the final segment is a filename.


    URLs are usually underlined on Web pages. The underline identifies the text as
    a link, which means you can simply click the underlined and go to that location.
    If you''re not taken to that location, one of the following is usually the culprit:


    +   - The URL is old and the page to which it is pointing no longer exists.

    - The server that the page is on is operative. You might see the message "the
    server is down."

    - The server system is under too much of a load with everyone trying to get to
    that page. This happens, for example, when the Sports illustrated server puts
    up the swimsuit aisle.

    - Your network connection went down, either from you to your ISP or from your
    ISP to the requested Web site.


    When surfing the Net, be patient. Even on the best days, downloading certain pages
    can take several minutes.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 284 Part V: Going Online


    6. Under Mail & Newsgroups, click Mail Server. Fill in any necessary information.


    A window like the one in Figure 16-5 appears. Because you probably stay attached
    to the Internet for relatively short periods of time, your Internet service provider
    supplies you with machines called servers, which send and deliver your e-mail
    when you are not attached to the Internet. When you then attach to the Internet,
    your computer tells the server to deliver the e-mail or send your messages. You
    are given a login name for the mail server (usually the same as your login name),
    and you''re told what the name is for both your incoming and outgoing mail server.
    These two names are usually the same, but if you are using a special service called
    POP (Post Office Protocol), it allows you to download e-mail to your system from
    the server, your ISP gives you a name for the POP server. IMAP4 is an even newer
    protocol for doing similar procedures as POP, and if your ISP has an IMAP4 server,
    they tell you that also.


    7. Under Mail & Newsgroups, click Newsgroups Server. If you want to participate
    in a news server, fill in the fields.


