- img_proc: true
  md: '# # Appendix A


    # # Modifying Text Using vi


    Anyone who writes a Linux book needs a good editor. But the editor that we are
    talking about is a text editor — the ubiquitous vi — not the tweedy, frazzled,
    publishing professionals who struggle mightily with books. Text editors work with
    text files to give you the ability to add, delete, search, and move text — everything
    from thousands of lines of text right down to a single character.


    Text files are usually updated with word processors, but every once in a while,
    you may have to go in and update a file with a text editor. In addition, text
    editors create small, compact files of characters, which are still the cheapest
    way to send e-mail and store character data on disk.


    # # Defining Text Editors


    A text editor is an essential tool for Linux. Text editors enable you to create
    and modify an array of text files, including the following:


    +   - User files, such as the login file

    - System configuration files, such as /etc/fstab, /etc/initstab, and /etc/lilo.conf

    - C and C++ programs

    - Shell programs

    - Mail messages


    Linux comes with not one but two text editors: ed and vi is a line-oriented text
    editor, and was one of the first editors for Unix systems and traditionally included
    with every Unix and Linux system. ed is also a small editor, so small distributions
    of Unix and Linux can include it. You can always count on ed being there.


    ![](img/8ae48244df88d68913b10871643fd825_342_0.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'The second editor that comes with Linux is vi; it''s included with almost every
    Linux distribution (some specialized distributions such as Trinus don''t necessarily
    include it). This full-screen editor also supports the command set of a line-oriented
    editor named ex. The third major text editor for Linux is emacs; some people prefer
    to use this editor for most of their work.


    In TurboLinux, ex and vi are emulated by another text editor named vim. The commands
    for vi work just fine with vim. In addition, vim has more capabilities than vi.
    For example, vim makes editing easier by allowing you to switch from command to
    insert mode and still move around the file with the cursor keys. On the other
    hand, vi forces you to continually toggle between the two modes in order to insert
    text and move around the file. Therefore, vi isn''t included as a separate program
    with TurboLinux systems. When you type vi, you''re using vim, but this fact is
    invisible to you.


    ![](img/8ae48244df88d68913b10871643fd825_343_0.png)


    # # Using vi


    The vi editor on your TurboLinux system is really the vim editor. With a little
    vim and vigor (bad pun unintentional) you can invoke it by typing vi, or a symbolic
    link exists between vi and vim.


    vi has two modes of operation and the same type of single-letter commands. To
    start vi, you type vi at the command line. The screen clears, and the left-column
    displays one tilde (-) per line. You are looking at an empty, unnamed buffer in
    memory, into which you can enter text until you save the text to a named file.


    You can start vi in a number of ways, with different options, the most common
    way to start vi is to start the program with only a filename as the argument,
    like this:


    ```

    vi tome.and.linux

    ```


    vi tome.and.linux is the name of either an existing file that you want to edit
    or a new file that you want to create.


    The vi editor has three modes of operation:


    +   - Visual command mode

    - Colon command mode

    - Text mode


    When you invoke vi with a filename, the editor screen appears. The name and status
    of the file appears in the bottom-left corner.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Appendix A: Modifying Text vi 319


    This status line tells you what the editor is doing. In this case, the editor
    has opened a buffer, and the Save and Quit option saves the contents of a file.
    If you did indeed invoke vi with the following command:


    ```

    vi to.and.linus

    ```


    The bottom-left corner displays the following line:


    ```

    "''''tove.and.linus'''' [New File]

    ```


    When you invoke vi, you are in visual command mode, which is the default. You
    can use four special commands to either locate text or transition to more complex
    commands:


    +   / Forward search

    ? Backward search

    n Continue the search in whichever direction you were currently going

    : ex command (ex is the line editor included in vi)


    In command mode, the characters you type are used as commands, not as input into
    the file. To use commands, type the character on the command line. For the first
    search commands (/ and ?), the cursor moves to the bottom of the screen, where
    you type the string you are searching for. After you press Enter, the search begins.
    If you want to search for an additional string, press the n key to reexecute the
    search; to search backward, press Shift+N.


    When you type the :, the cursor moves to the bottom of the screen and waits for
    you to enter a command or a command string. You must press the Enter to execute
    the command.


    Given that characters you type are interpreted as commands in command mode, how
    do you get from command mode to text mode? Simple; enter a command to do something
    in text mode, and vi takes you there. Here are some commands that you can use
    to switch from command mode to text mode:


    +   i Insert text before the cursor

    a Insert text after the cursor

    Shift+I Insert text at the beginning of the current line

    Shift+A Insert text at the end of the current line


    As soon as you type any of these commands, TurboLinux puts you in input mode.
    Do not press Enter after entering the command. Any text you type after you invoke
    the command is placed in a buffer and echoed to the screen.'
