  md: "# Chapter 15: Interacting with the Internet\n\n# Setting up DNS\n\nFinding\
    \ your way around the Internet would be impossible if it were not for the Domain\
    \ Name Service (DNS) system. This system converts the dot.com type of Internet\
    \ name format into an Internet Protocol (IP) address. The IP address is numeric.\
    \ An example of an IP address is 198.59.115.2. All the information that flows\
    \ across the Internet (Web sites, e-mail, and so on) is carried by IP packets\
    \ that have source and destination IP addresses. Therefore, when you go to browse\
    \ www.paunchy.net, for instance, that name is converted into a numeric IP address\
    \ by DNS.\n\nUnless you want to do all of your browsing and e-mail by remembering\
    \ numeric IP addresses, it's necessary to set up your own DNS. Your ISP provides\
    \ you with one or two DNS server addresses such as 198.59.115.2. You need to tell\
    \ Linux about the DNS servers before you can browse the Net.\n\n+   1. Log in\
    \ as root and run turbonetcfg.\n   The Network Configuration menu appears.\n2.\
    \ Select Basic Settings.\n   The Global Network Settings window is displayed,\
