  md: '# Chapter 5: Installation: Down to the Final Stretch


    In that way, Linux can run in 64MB of virtual memory. Having more swap space allows
    more programs to run simultaneously or larger programs to run with more data.
    Linux allows each swap partition to be up to 127MB, with up to a total of 16 swap
    partitions for Intel systems.


    +   - /home partition, where the users'' home directories grow. The size of /home
    is influenced by how many users you have planned for the system.


    +   - /usr/local partition for storing programs you want to separate from the
    rest of the TurboLinux.


    +   - /tmp partition, an additional partition for temporary files in larger multiuser
    systems and network file servers.


    +   - /usr partition, where most of the software is on the Linux system resides.
    This should be around 150MB to 350MB, depending on which packages you are installing.


    +   - /usr/src partition, which contains much of the Linux source code.


    The problem with this type of setup is that you have a lot of separate partitions
    that can''t share their space, resulting in a lot of wasted hard drive space.
    If you need a little more space in /tmp partition, for example, and your /home
    is almost empty, Linux cannot easily utilize the space in /home for /tmp usage.
    This is particularly true of smaller systems that have fewer disks and less disk
    space.


    A happy medium that we use is to create a root partition that includes /usr, /tmp,
    /usr/src, and /usr/local, another partition for swap space, and another partition
    for /home. On larger systems with more disks, you can usually create more separate
    partitions. The preceding list shows the order we sometimes use when creating
    separate partitions, in priority from top to bottom, stopping when we feel that
    the disk space is becoming fragmented.


    Some BIOSs have rules about where you can install the root partition. You must
    consider the following if you will be installing the root partition on your hard
    drive:


    +   - If you have two IDE (EIDE) drives, the root partition must be on one of
    them. If the hard drive and the CD-ROM drive are on the primary controller, the
    root partition must be on that hard drive.


    +   - If you have one IDE drive and any SCSI drives, the root partition must be
    either on the IDE drive or on the SCSI drive that is ID 0. Other SCSI IDs won''t
    work.'
