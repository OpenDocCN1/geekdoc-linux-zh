    # Description


    The description section is a brief introduction to the command''s functionality,
    which is then expanded on by what the options specify the command to do. A good
    example of a description is the manual page for man itself.


    # Options


    As stated in the "Synopsis" section, the options section tells how the command
    treats data in the arguments. Each option modifies the command''s actions, either
    drastically or subtly. The options can also pass information to the command about
    where to find files. The three types of options are


    +   - No argument

    - Attached argument

    - Positional argument


    No argument means the option has a hyphen followed by one or more single-character
    options. For example:


    ```

    [maddog@localhost maddog]$$ ps -ax

    ```'
  merge: -1
