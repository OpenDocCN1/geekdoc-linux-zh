  md: '# Part III: Using TurboLinux


    ![](img/8ae48244df88d68913b10871643fd825_229_0.png)


    The Focus Settings menu gives you the ability to more finely control your keyboard
    focus. Keyboard focus is a way to create shortcuts by assigning certain keys to
