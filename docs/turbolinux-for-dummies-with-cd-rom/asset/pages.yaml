  md: '# Chapter 8: Working with Files and Commands


    +   - $\checkmark$ All directory paths that include (.) or (...) are relative
    directory paths.


    You can see these files by using the -a option of the ls -l command. Without the
    -a option, the ls -l command does not bother to list the . or .. files, nor does
    it list any filename beginning with a period. This may seem strange, the users
    of Unix directory cleaner that having some files were normally hidden kept the
    directory structure cleaner. Therefore, filenames are always there (. and ..)
    and special-purpose files are hidden. The types of files that should be hidden
    are those that the user normally does not need to see in every listing of the
    directory structure (files used to tailor applications to the user''s preferences,
    for example).


    Now specify a pathname relative to where you are. For example:


    ```

    [maddog@shamet maddog]$pwd

    /home/maddog

    [maddog@shamet maddog]$ls -la ../../etc/passwd

    ```


    This snippet indicates that to find the passwd file, we go up two directory levels
    (../../), and down to /etc.


    If you want to see the login accounts on your system, you could issue the following
    command from your home directory:


    ```

    [maddog@shamet maddog]$ ls -la ..

    ```


    This command lists the parent directory. Because the parent directory (/home)
    has all the login directories of the people on your system, this command shows
    you the names of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are absolute filenames. These filenames always begin with the slash character
    (/), which signifies root.


    ```

    ls -la /etc/passwd

    ```


    # Changing your working directory


    Sometimes, you may want to change your working directory because doing allows
    you to work with shorter relative pathnames. To do so, you simply use the cd (for
    change directory) command.


    To change from your current working directory to the /usr directory, for example,
    type the following:


    ```

    cd /usr

    ```'
