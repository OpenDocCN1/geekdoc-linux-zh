  md: '# Part II: Installing TurboLinux


    In Part II, you get your answer to the age-old question: How the heck do I install
    Linux? I give you detailed, step-by-step instructions. You also get lots of help
    installing X Window System, the graphical part of Linux. You may want a double
    espresso or a cup of Jolt soda (Twice the caffeine!) by your side for this one.


    # Part III: Using TurboLinux


    In Part III, you get the glorious particulars on actually doing something with
    TurboLinux. I take you through the history of text editors and how to use them.
    You find that not all shells are found on the ocean floor; TurboLinux has one
    for you. You can also take X Window System through its paces by moving, resizing,
    hiding, and closing windows.


    # Part IV: Maintaining Your System


    TurboLinux isn''t a high-maintenance operating system, but it does need care.
    (Chocolate helps, too.) In Part IV, you find out how to manage the TurboLinux
    file system, which is the biggest part of the care and feeding of TurboLinux.
    You also get some hints on boosting the performance of TurboLinux. Vroom, vroom.


    # Part V: Going Online


    Everyone is online these days, and TurboLinux is no exception. In Part V, you
    find out how to contact an Internet service provider to get an account for accessing
    the Internet, how to set up your TurboLinux system to interact with that account,
    and how to use the Netscape Communicator browser package with that account to
    surf the Web.


    # Part VI: The Part of Tens


    A For Dummies book just isn''t complete without a Part of Tens. And that''s Part
    VI. You find ten all-important resources in Chapter 17. In Chapter 18, I provide
    answers to the ten most bothersome questions people have after installing TurboLinux.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# TurboLinux For Dummies


    # Part VII: Appendixices


    Finally, the appendixes. In Appendix A, I tell you how to use the vim text editor.
    In Appendix B you find out all you need to know about the Linux man pages. And
    in Appendix C, I tell you where you are in the book you can get information on
    installing the CD-ROM.


    # What You''re Not to Read


    Heck, you don''t have to read any of the book if you don''t want to, but then
    why did you buy it? (Not that I''m complaining.) Part I has background information.
    If you don''t want it, don''t read it. Also, text in sidebars is optional, though
    often helpful. If you''re on the fast track to using TurboLinux, you could skip
    the sidebars and the text with a technical stuff icon. I suggest instead that
    you slow down a bit and enjoy the experience.


