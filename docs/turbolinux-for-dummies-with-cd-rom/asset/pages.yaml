  md: '# 86 Part II: Installing TurboLinux


    included along with the base components in a Developer Workstation. The installation
    program gives you two choices: installing by individual packages (perhaps saving
    some disk space) or choosing an installation type, which can also be customized
    to an extent.


    Unless you are using Linux for a specific job, don''t select the Package List
    option. Unless you know exactly what you are doing, it''s not best to try select
    individual packages because some parts of a package depend on others being (though
    TurboLinux resolves dependencies for you, it''s still complicated).


    ![](img/8ae48244df88d68913b10871643fd825_111_0.png)


    If you have plenty of room on your drive, you may want to choose the All-in-one
    Workstation option, which installs all packages included with the TurboLinux For
    Dummies CD-ROM.


    After selecting an installation type, tab over to the OK button and press Enter.
    If you select a component that needs another component that not selected for installation,
    the system displays a dialog box showing the dependency (that is, one component
    is dependent upon another) and allows you to decide whether or not you want to
    resolve the dependency. If you need to remove components from the preselected
    installation types, TurboLinux may reselect them if it considers them important
    or critical.


    After any dependency problems are resolved, the installation program tells you
    how much space is required and available, and it gives you the option to customize—unless
    you are lacking in space, just go on it and you can trim it later on.


    When TurboLinux begins installing the packages and lists them in /tmp/turbopkg.log
    on your system. The installation status dialog box appears, listing the packages
    being installed along with a brief description of the contents and the estimated
    time to complete the installation. The time varies from minutes to hours. On our
    system, it took just under 15 minutes to load all the packages—your mileage may
    vary.


    Eventually, a kernel selection dialog window appears, which means that all your
    components were installed.


    # Selecting your kernel


    The kernel is the brain of TurboLinux, handling all of the low-level operations
    such as accessing hardware, file systems, networks, and so on. If you have a normal
    desktop system, choose the Regular kernel. Notebook users want the APM kernel,
    which saves power and supports other related features that are important to notebook
    users. If you have a multiprocessor system'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Chapter 5: Installation: Down to the Final Stretch


    (generally high-powered workstation and server machines), you''ll need the SMP
    kernel. You may also want to choose a kernel specific to your processor for increased
    performance.


    # Pulling Linux Up by the Bootstraps


    This section describes how to configure the LILO bootstrap loader (Linux Loader
    — the software that starts Linux). We also show how the installation specifies
    which systems will be booted.


    To continue with the installation, follow these steps:


    +   Use the arrow keys to choose which place (Master Boot Record, floppy disk,
    or root partition) you want to place LILO, as shown in Figure 5-23.


    ![](img/8ae48244df88d68913b10871643fd825_112_0.png)


    For LILO to supply the names of the different operating systems to boot and allow
    you to select an operating system, LILO has to store itself and its boot information
    someplace. You can store the information in one of three places:


    +   The Master Boot Record (MBR) is the recommended place for installing LILO
    unless another operating system loader such as System Commander or Windows NT''s
    NToader is loaded here (you should know if you installed them). If LILO is installed
    on the MBR when your machine boots, LILO starts when the BIOS finishes loading
    displays the boot prompt.'
  merge: -1
  pgno: 112
