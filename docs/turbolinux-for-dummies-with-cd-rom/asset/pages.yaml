    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the mv command. No, you''re
    not really moving the file, but in TurboLinux (and Unix), the developers realized
    that renaming something was a lot like moving it. The format of the move command
    is


    ```

    mv <source> <destination>

    ```


    With your example files, you could move the file named radman to a file named
    bryant by executing the following command:


    ```

    mv radman bryant

    ```


    This leaves the file in the /santa_cruz directory, but changes its name to bryant.
    So you see the file was not really moved, but just renamed. Now try moving the
    bryant file to the work directory. To do that, you have to first move the file
    up and then move it into the /work directory. You can do it with one command:


    ```

    mv bryant ../work

    ```


    Note that the destination file uses the .. (or parent directory) designation.
    This tells Linux to go up one directory level and look for a directory called
    /work and then put the file into that directory with the name bryant you did not
    specify any other name. If you instead did this


    ```

    mv bryant ../work/supersalesman

    ```


    the bryant file would have been moved to the /work directory with the name supersalesman.
    Note that in both cases (with the file maintaining its name of bryant or taking
    the new name supersalesman), your current directory is still /santa_cruz, and
    all of your filenames are relative to that directory.'
