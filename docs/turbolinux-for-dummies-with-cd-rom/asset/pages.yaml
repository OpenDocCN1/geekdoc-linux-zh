  md: '# 54 Part II: Installing TurboLinux


    4. Initiate the defragmentation program under MS-DOS:


    ```

    C:\DOS> defrag

    ```


    The defrag program asks you which drive to defragment.

    5. Use the alphabetical keys on the keyboard to select the drive you want to defragment.

    The defragmentation program looks at the drive to determine whether it needs defragmentation.


    6. Defragment the disk — even if the program says the disk doesn''t need defragmenting.

    After may seem like a long time, defragmentation finishes and all useful blocks
    of information are now at the beginning of the disk, making it ready for the FIPS
    program in the next section.


    In Windows 9x:


    +   1. Close all programs and windows on your system, leaving just the desktop
    and icon bar.

    2. Double-click the My Computer Icon on the desktop.

    3. Select your C drive by clicking it.

    4. Choose File >Properties Tools.

    5. Click Defragment Now.


    You may get a message telling you that it''s not necessary to defragment your
    disk is not very fragmented. Under normal circumstances this may be true, but
    in this case it is necessary to defragment your disk because you''re going to
    move to the end of the file system and make it smaller. Any data outside that
    barrier is lost, so you have to move the barrier closer to the front.


    +   6. Click Start.

    7. Click Show Details.


    The defragmentation window appears.

    The defragmentation takes time to finish. As the defragmentation continues, you
    can scroll up and down the large window showing the progress, which is represented
    by different colored blocks. See Figure 4-1. You can expect to see white space
    starting to appear toward the bottom of the window, which represents the end of
    your disk. This shows that the data is moving forward on your disk. At the end
    of the defrag process, no colored blocks should be at the bottom of the window,
    and all the blocks should be compressed toward the top of the window. The colored
    blocks represent programs and data, and the white space is free space in your
    MS-DOS file system, which you may now allocate to the Linux file system (you have
    to leave OS or Windows space to breathe, after all).'
