  md: '# In this part ...


    Ah, the part you find in every For Dummies book: The Part of Tens. Here''s where
    we get to rummage around and come up with ten of this and ten of that.


    In Chapter 17, we list ten important places to find help. Also, you can use some
    of these sources to enhance and widen your knowledge of Linux in general and TurboLinux
    in particular. The things you can find out about these great technologies are
    endless.


    In Chapter 18, we put together ten of the most frequently encountered problems
    people have after installing TurboLinux. If you''re having trouble, turn here
    first.'
  merge: -1
