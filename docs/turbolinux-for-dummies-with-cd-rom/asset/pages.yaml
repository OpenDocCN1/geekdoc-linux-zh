  md: '# Chapter 11: Getting to Know GNOME and X 205


    Depending on how you''ve set up GNOME, you can give a window focus with GNOME
    in several ways:


    +   - Click the window''s name, which is in the Panel at the bottom of the screen.


    +   - Click the window''s title bar, which is at the top of the window.


    +   - Click the window itself, which typically also makes the window the topmost-one.


    +   - If you''re working in an office with a lot of people, then you can shout,
    "Hey you, wake up!"


    For the purposes of this chapter, we stick with the TurboLinux/GNOME default of
    having to click a window to focus it.


    # Moving day


    To move a window, click and hold the left mouse button anywhere on the title bar.
    As you hold the left mouse button, the window moves anywhere that you move your
    mouse to. Release the button and the window stays there. Note that the title bar
    is the bar along the top of any window where the window''s name is located


    # Resizing to your heart''s content


    Sometimes a window is a little too big or a little too small. Life would be much
    easier if you could nudge that window into shape. To do just that, you can position
    the cursor on either the left or right corner of a window until the cursor changes
    into a double-sided arrow. Then you left-click and pull the window''s outline
    to your desired size. Release the mouse button and your window takes the new size,
    and all is right with the world.


    Another way to resize a window is to click the far upper-left corner. A menu appears.
    Click the Window Size submenu and you get another that allows you to toggle the
    height, width, or entire window between its normal (default) size and the size
    of the entire desktop.


    # Making a molehill out of a mountain . .


    You can minimize (iconify) a window by clicking on the bold, underscore button
    toward the upper-right corner. Doing that removes the window from the desktop
    and places it in a storage area on the right-hand side of the Panel.


    ![](img/8ae48244df88d68913b10871643fd825_230_0.png)'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 206 Part III: Using TurboLinux


    # And making a mountain out of a molehill


    You can return a minimized window to the desktop by clicking on the icon that
    corresponds to the window on the Panel. You also have the option of completely
    closing the application by right-clicking its icon on the Panel and choosing either
    Close or Annihilate in the menu that appears. The difference between the two is
    that Annihilate closes the program if it doesn''t respond to the Close command.
    Annihilation isn''t as nice as simple closure and potentially can cause problems
    if you are running a program like a database that is actively manipulating data.


    You''re probably thinking, "If the underscore-looking button to the right of the
    title bar minimizes a window, one of those other buttons properly maximizes a
    window." Or maybe your thinking, "I hope I can take a break soon." Okay, your
    hunch is right. Check out those buttons to the right of the title bar. The maximize
    button is the one in the middle; it looks like a square and is similar in action
    to the cascade button in Windows. Stay tuned to find out about the X button to
    the right of the Maximize button, which is similar to the Windows cascade button.


    ![](img/8ae48244df88d68913b10871643fd825_231_0.png)


    # Minimizing Your Windows


    Now that you''ve put a lot of windows on the screen, how can you get rid of few
    or all of them? Well, you can put them in the background by reducing them to icons,
    or you can be more drastic and kill them. Here are a few ways to do so:


    +   First, take advantage of any exit buttons or menu options that the application
    gives you.

    Click the Close button (the X) in the upper-right corner of the window''s title
    bar to kill a window.

    Click the upper-left corner of the window and then click either the Close or Annihilate
    options in the menu that appears. Close attempts to contact the application and
    ask it nicely to stop itself. Annihilate doesn''t care what the application thinks
    and stops it immediately.

    Click the title bar to get to the menu described in the previous two steps. The
    menu works exactly as described in those steps. This is just another way to get
    to it.'
  merge: -1
  pgno: 231
