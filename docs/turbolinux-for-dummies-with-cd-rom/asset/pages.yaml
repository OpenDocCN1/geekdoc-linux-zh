    # Bang-bang


    The fact that the shell remembers the command lines you have typed is useful for
    reexecution of commands at a later time. Simple reexecution commands are represented
    by exclamation points. In computerese, an exclamation point is called a bang and
    two exclamation points are called — you guessed it — bang-bang.


    Here are two key ways you can use the exclamation point:


    +   - !! reexecutes the last command

    - !partial command line reexecutes the command line that started with <command
    line>


    Here''s an example. Type !cat on the command line as follows. (cat the <command
    line) mentioned in the preceding list.


    ```

    [username@hostname loginname]$ !cat

    ```


    bash searches through the previously executed commands in this session, looking
    for the most recent occurrence of a command line that started with the letters
    cat. When the program locates the command, it is reexecuted.


    A little timid about this? Perhaps your memory of which command you typed and
    when is a little faulty. (My memory is usually that way.) Append :p to the command
    line to see what history finds. The command looks like:


    ```

    [username@hostname loginname]$ !cat:p

    cat /etc/passwd

    ```


    To run the command !:p found, enter bang-bang, like:


    ```

    [username@hostname loginname]$ !!

    ```'
