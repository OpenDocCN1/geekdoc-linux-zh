- img_proc: true
  md: '# 310 Part VI: The Part of Tens


    Solution: You can log in to Linux as root and then type the following command:


    ```

    /sbin/lilo -u

    ```


    Another solution is to boot MS-DOS or Windows 3.x, 9x, NT 4.0 or 2000 to an MS-DOS
    prompt and type the following:


    ```

    fdisk /mbr

    ```


    # I Can''t Use LILO to Boot


    **Problem:** You need to put TurboLinux on a disk or a partition that is beyond
    the 1023rd cylinder, the second IDE disk, or the second SCSI ID number, or you
    need to do something else that will make it difficult for Linux to boot using
    LILO. Can you boot Linux in another way?


    **Solution:** You can use a program called LOADLIN to boot from your MS-DOS or
    Windows system:


    +   1. Copy your configured Linux kernel to the C drive of your MS-DOS or Windows
    system.


    The easiest way to do this is to install TurboLinux, log in as root, and type
    the following:


    ```

    grep image /etc/lilo.conf

    ```


    A line similar to the following appears:


    ```

    image=/boot/vmlinuz-2.2.13-12

    ```


    This points to your compressed kernel, which in this example is located at /boot/vmlinuz-2.2.13-12.


    +   2. Copy the copied kernel to a floppy disk, as follows:


    ```

    mcopy /boot/vmlinuz-2.2.13-12 a:\vmlinuz.gz

    ```


    The kernel name vmlinuz-2.2.13-12 refers to a specific version of the TurboLinux
    kernel. Except for the /boot/vmlinuz-part, which remains constant, the name may
    be slightly different on your system.


    Now you have to copy LOADLIN from the TurboLinux For Dummies CD-ROM.


    +   3. Boot MS-DOS or Windows and put the TurboLinux For Dummies CD-ROM in your
    CD-ROM drive.'
  merge: -1
