    # The ls Command Doesn''t Show Files in Color


    Problem: Using Linux from the TurboLinux For Dummies CD-ROM, you can get the ls
    command to show files in color.


    Solution: You have to edit the .bashrc file in your home directory to add the
    following line to the end of the file:


    ```

    alias ls =''ls --color=auto''

    ```


    Then log off and then back on to reexecute your .bashrc file (assuming you are
    using the bash shell), and ls shows different file types in different colors.


    # TurboLinux Can''t Find a Shell Script (Or a Program)


    Problem: You type a command name, but Linux can''t find the command, even if it''s
    in the current directory.


    Solution: When you type a shell or binary command name, Linux looks for the name
    in specific places and in a specific order. To find out what directories Linux
    looks in, and in what order, type the following command:


    ```

    echo $PATH

    ```'
