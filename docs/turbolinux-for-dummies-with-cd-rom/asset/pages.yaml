    What you just wrote is a shell program, or a shell script. In many cases, shells
    are more efficient than writing many hundreds of lines in C or Fortran. Shells
    are fairly easy to write, fairly easy to change, and even experienced C and Fortran
    programmers use them every day instead of writing more complex programs using
    those other languages. System administrators couldn''t survive without scripting
    languages such as the shell.


    # From the Simple to the Sublime


    If you followed through the previous section, you program always works on the
    same file, which is hard-coded into the script. But this program for the rest
    of this chapter, we show you how to create more flexible scripts, ones that can
    generate different filenames as needed and automatically adapt to running on different
    dates.


    Suppose you want to keep monthly copies of the passwd file and see the differences
    between them. First, write a program that saves the passwd file and stores it
    in a directory:


    +   1. Use the cat command to create a script in ~/bin directory called genreport.

    2. Thereport script is simple; it copies the file /etc/passwd to standard output
    using the cat command; the redirection symbol puts it into a file.

    3. For a filename that the script will generate when it is executed, start with
    the name passwd, but attach the year and the month to it.


    For example, the passwd file for July 1998 would be passwd19987, and the one for
    August 1998 would be passwd19988.


    To create these files, execute the date command inside the shell script, and use
    its output to append to the word passwd. If you use the backslash quote (called
    accent grave) it generates 199807 to be appended to the string of characters,
    if this was July 1998. The accent grave tells Linux to "execute what is between
    the accent symbols as a Linux command, and use the results of that command as
    a string in the larger command." Therefore, the date command generates the 199807,
    which is appended to the name passwd to create passwd199807.


    If you''re searching your keyboard for that accent grave character, you may find
    it under the tilde character.


    ![](img/8ae48244df88d68913b10871643fd825_209_0.png)


