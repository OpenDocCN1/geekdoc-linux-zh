  md: '# Chapter 1


    # Linux and You


    # In This Chapter


    +   * Finding out what Linux is all about

    * Discovering why Linux outperforms other systems

    * Figuring out how to use Linux


    In 1991, Linus Torvalds, an undergraduate student at the University of Helsinki,
    got a brand-new IBM 386 PC. Dissatisfied with the operating system that came with
    the hardware, he wanted to run the Unix system instead. Unix, however, was too
    expensive, so Linux and a team of talented programmers tackled the daunting task
    of creating a new version of Unix. They created a core operating system, or *kernel*,
    named Linux.


    # Free as in Freedom


    One of the most important decisions Linus Torvalds made in the early days of the
    Linux kernel was to make all the code freely distributable. Several organizations
    accumulated huge amounts of freely distributable software available from the Free
    Software Foundation and other places, added the software to the Linux kernel,
    and then created a way to install the software on the computer. This process is
    called creating a *distribution*


    These distributions were available in several forms: over the Internet, CD-ROMs
    from software publishers (who charged a distribution fee), or bundled with other
    programs (that organizations charged for). In every case, though, the base Linux
    kernel and other freely distributable code had to be identified and made without
    charge.


    I can''t overstress the importance of the availability of the operating system
    source code. Freely distributable source code has made Linux an operating system
    that continues to improve rapidly. Each developer can build on the efforts of
    the one before, and this benefits everyone — including you.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 12 Part I: Introducing TurboLinux


    ![](img/8ae48244df88d68913b10871643fd825_37_0.png)


    # Let''s be open about Linux


    Linux is the first operating system in major use today that was started outside
    the United States of America. All other operating systems, although they have
    received some support and construction from non-U.S. participants, were conceived
    and maintained in the United States. People from all over the world — increasingly
    from countries not globally recognized as technology countries — contribute to
    Linux.

    When people ask me why I think Linux and the Open Source Code development projects
    are so important, I answer that I am not egotical


    to think that all good programmers come from the United States. I tell them that
    the next Albert Einstein of computer science might come from Korea, or China,
