  md: '# 38 Part II: Installing TurboLinux


    We strongly recommend that if your hard drive is smaller than 2GB, put TurboLinux
    on a hard drive by itself. First, these days you can buy disks for less than $100
    in U.S. currency. Second, the task of shrinking Windows small enough to allow
    TurboLinux to reside in its full glory on a disk with less than 2GB is difficult
    at best and at worst. And although splitting the TurboLinux distribution across
    disks is possible, doing so will make updating the distribution


    ![](img/8ae48244df88d68913b10871643fd825_63_0.png)


    If you follow our recommendation and buy another hard drive, make it the second
    disk on the first IDE controller or as disk 1 on your SCSI controller, assuming
    that your existing Windows disk is either the first disk on your IDE controller
    or ID 0 on SCSI controller. If your CD-ROM drive is a slave on the first IDE controller,
    you may want to move it to the secondary master. Moving the CD-ROM drive will
    provide better performance and less headache in the long run. Adding hard disks
    is a hardware thing; the store you buy the disk should be able to add it to your
    system for you. And while the system is there, you can ask the store folks to
    tell you the details of the other hardware in your system


    If you have your computer apart looking for other information (a pox on manufacturers
    who don''t supply such useful information), you may well write down all the disk
    information you can find. You should look for the number of heads, cylinders,
    and sectors. This information is used to operate the system where to to put data
    with respect to the beginning of the disk. If you have trouble, check out the
    "Getting Information from Windows 95/98" and "Getting Information from MS-DOS
    or Windows 3.1" sections in this chapter. SCSI disk users do not have to supply
    this information because the SCSI controller and device drivers calculate it on
    the fly. SCSI disk owners should, however, know the size of their disks, which
    is printed on the disk or is available through the sections mentioned.


    # Finding Out What You Have


    One of the most important preliminary steps for a successful installation of Linux
    is finding out the type of hardware you have. You can find most of this information
    in the manuals that came with your computer. The manuals won''t be much help,
    however if


    +   - You threw the manuals out

    - You lost the manuals

    - You bought your computer secondhand someone who threw away or lost the manuals

    - You bought your PC with Windows already installed and it didn''t come with any
    stinking manuals'
