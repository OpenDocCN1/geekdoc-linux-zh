  md: '# ls -al /etc


    This command lists all the files in your /usr directory. Because this directory
    holds a truckload of files, the information scrolls down your screen faster than
    you — or any Evelyn Wood graduate can read it. You can, however, correct this.


    With a process called piping, Linux uses the output from one command as the input
    for another. Piping is not as confusing as it may sound. In the last example,
    you had too much information — or output — to fit on one lonely screen. You can
    take that information and put — or — it into a program that divides the information
    into screen-sized pieces and displays them.


    To do this, use the more command, which is an appropriate name for your tool.
    You pipe the list''s output to the more command. But how do you pipe? You use
    the character on your keyboard. I bet you were wondering what the heck that key
    was for. Type the command as follows:


    ```

    ls -al /etc | more

    ```


    TurboLinux doesn''t care if spaces surround the | character, but you may want
    to use them for clarity and to get in the habit of including spaces because they
    are important at other times.


    When you press Enter, the information appears one screen at a time with the word
    More appearing at the bottom of each screen except the last one. To move to the
    next screen, press the spacebar. When you finish with the last screen, the more
    command takes you back to the Linux prompt. The more command can do even more.
    When the screen halts with the word more at the bottom, you can type commands
    to the more program:


    +   - q to get out of the more command without wading through all those

    - h to see a list of all commands available in the more command


    Note that some commands to the more program (such as the b command) don''t work
    when you are piping input into the program, as opposed to using more with a file.


    Everyone makes mistakes. Everything changes from time to time. For your reasons,
    you need to know how to delete text from the TurboLinux command line. If you want
    to start over, press Ctrl-U to remove everything you have typed on the command
    line — if you have not yet pressed Enter. The Backspace key erases one character
    at a time. The left and right keys move the cursor along the line of characters
    without erasing; when you get to the place you want to change, use the Backspace
    key to erase mistakes and type in any changes. In most cases, the up and down
    arrow keys jump the cursor back and forth through the last few commands.'
