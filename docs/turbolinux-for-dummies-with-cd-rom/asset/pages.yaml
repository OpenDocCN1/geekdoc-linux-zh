    # Living with Floppy Disks


    Floppy disks are treated a little differently than hard disks, mostly due to their
    size and fragility. Floppy disk are not normally mounted and used for hours and
    days on end to hold gigabytes of data. More often, floppy disks are used to transfer
    data to another computer or to back up a few files.


    Although you can create Linux file systems on floppy disks, it’s more advantageous
    to use them in other ways. For example, you can


    +   - Mount floppy disks as DOS file systems, which you can then access with the
    standard Linux utilities such as cp and ls. These simple commands allow you to
    copy files to and from the disk as well as listing their contents.

    - Use floppy disks as raw devices with commands as tar and cpio. A raw device
    is one that is not formatted with a file system. Commands like tar and cpio use
    raw devices as simple pools of storage.

    - Use floppy disks with special utilities that can read and write to DOS disks.


    On Linux systems, the block special file for the first floppy drive is /dev/fd0.
    The default density is 1,440KB. I assume that you are using standard, 3½-inch
    preformatted floppy disks.


    The following commands format a floppy disk and write a DOS file to it. Remember
    to replace <any-dosfile.txt> with a real filename:


    ```

    mount /dev/fd0 /mnt/floppy

    cp <any-dosfile.txt> /mnt/floppy

    umount /mnt/floppy

    ```


    Using these commands is one way to move files back and forth to a Windows machine.
    You can add the file to a floppy disk and insert the floppy in the Windows machine,
    and it can read the file from the disk. Likewise, mounting a floppy disk created
    on a Windows machine, you can read and manipulate the files using TurboLinux.


    The mtools package installed on your system enables you to access DOS disks and
    files without mounting the floppy disk and adding it to your file system. Table
    13-1 presents some mtools commands, which are probably familiar to DOS users.


    ![](img/8ae48244df88d68913b10871643fd825_264_0.png)'
  merge: -1
