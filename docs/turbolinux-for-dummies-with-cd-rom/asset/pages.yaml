  md: '# # Appendix C

    # About the CD


    The TurboLinux For Dummies CD-ROM contains everything you need to get TurboLinux
    Workstation 6.0 up and running.


    # # System Requirements


    Make sure your computer meets the minimum system requirements listed here. If
    your computer doesn''t match up to most of these requirements, you may have problems
    using the contents of the CD:


    +   - A PC with a 486 or faster processor.

    - At least 8MB of total RAM installed on your computer. For the best performance,
    we recommend that people who want to use X Window have at least 16MB and preferably
    32MB of main memory.

    - At least 800MB of hard drive space available to install all the software from
    the CD. You won''t need space if you don''t install every program. For example,
    if you want to install only the smallest subset of the base system, you can do
    that in about 180MB.

    - A CD-ROM drive.

    - A 3-¼-inch floppy disk drive and a blank 3-¼-inch disk. (This is only necessary
    if you are incapable of booting from CD-ROM, but it can''t hurt).

    - A monitor capable of displaying at least 256 colors or grayscale.

    - An IDE or a SCSI disk.

    - A keyboard and a mouse.

    - A modem with a speed of at least 14,400 bps if you want to access the Internet
    via dial-up.

    - A supported Network Interface Card (NIC) if you want to access the Internet
    via LAN or cable modem/DSL.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 340 Part VII: Appendixes


    # Using the CD


    The instructions for installing the CD are in Part II. After you install the software,
    return the CD to its plastic jacket for safekeeping.


    # What You''ll Find


    The CD contains the freely distributable parts of TurboLinux Version 6.0. You
    may view the documentation on this CD through a PDF viewer such as Adobe Acrobat,
    or you may print it. We recommend that you look at the "The TurboLinux Installation
    Guide," which is in the following directory:


    ```

    [Your CD-ROM drive number]: \Manual\TLW60.PDF

    ```


    Because the CD-ROM has a full implementation of TurboLinux, it would take too
    much room to list all the accompanying tools and utilities. Briefly, the CD includes
    much of the software you use to access the Internet; write programs in several
    computer languages; create and manipulate images; create, manipulate, and play
    back sounds (if you have a sound board); play certain games; and work with electrical
    design. And, of course, all the source code is included.


    # If You Have Problems (Of the CD Kind)


    We tried our best to test various computers with the minimum system requirements.
    Alas, your computer may differ, and Linux may not install or work as stated.


    The likeliest problems are that you don''t have enough RAM for the programs you
    want to use or you have some hardware that Linux doesn''t support. Luckily, the
    latter problem occurs less frequently each day as more hardware is supported under
    Linux.


    You may also have SCSI disks that use a controller not supported by Linux or a
    controller that is simply too new for the Linux development team to have given
    it the proper support at the time the CD was pressed.


    If you have trouble with corrupt files on the CD, please call the IDG Books Worldwide
    Customer service number: 800-762-2974 (outside the United States: 317-572-3993).
    Customer service won''t be able to help with complications relating to the program
    or how it works. Please see the Installation Instructions at the end of this book.'
  merge: -1
