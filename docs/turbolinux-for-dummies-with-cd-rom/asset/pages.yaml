  md: '# Destructive repartitioning


    You use an MS-DOS utility called fdisk to wreak your destruction, as follows:


    +   1. Make a full backup of your system.


    If you want to reinstall DOS and Windows data, follow the instructions for your
    Windows backup utility. At a minimum, copy anything you can''t rein-stall from
    original program disks. This data includes your files from a word processor, a
    spreadsheet, and a database, as well as an e-mail you want to save. Most people
    customize settings for the programs themselves, so you really need to back up
    everything.


    +   2. Make sure you have full backup of your system.


    +   3. Get out of Windows and into MS-DOS.


    For Windows 3.1:


    +   1. From the Program Manager window, choose File-Exit Windows 9x.


    For Windows 9x:


    +   1. Click the Start button.


    +   2. Click Shut Down.


    +   3. Select the Restart the Computer in MS-DOS Mode option.


    +   4. Click the Yes button.


    +   4. Create an MS-DOS bootable backup disk


    Place a blank, formatted disk in the floppy drive (which we assume is drive A)
    and type the following:


    ```

    FORMAT /s A:

    ```


    +   5. Copy fdisk.exe and format.com to the disk.


    To copy the files, you type the following:


    ```

    cd \

    cd dos

    copy format.com a:

    copy fdisk.exe a:

    ```


    Please check the manual for your backup program to see whether any other utilities
    are needed to restore files. Copy those utilities at this time as well.


    ![](img/8ae48244df88d68913b10871643fd825_83_0.png)'
