  md: '# Chapter 17: Ten Sources of Help


    www.cyrius.com/tbm/Consultants-HOWTO


    ![](img/8ae48244df88d68913b10871643fd825_326_0.png)


    A not-as-current copy of the consultants list is on the TurboLinux For Dummies
    CD-ROM. The /usr/doc/HOWTO/Consultants-HOWTO file contains the information and
    is part of the howto RPM.


    # Commercial Applications


    When talking about commercial support, we should mention something about commercial
    applications. A lot of Linux users are frugal (We prefer that term rather than
    cheap) and often want or need to use freely distributable software is very good
    and does exactly what they want. Other times, though, the application you want
    is available only commercially.


    Other people who use Linux buy the latest and greatest hardware and want the same
    commercial applications on Linux that they have on their other operating systems,
    no matter what the price.


    For commercial application vendors everywhere who may be reading this, we cannot
    stress enough that you should look at Linux like any other operating system. You
    can sell your applications to a market that is not only appreciative but also,
    for various reasons, that its operating system should be open.


    Let''s take an example of functionality available from the commercial world, Applix,
    Inc. It has a word processor, a spreadsheet, a presentation package, a mail front
    end, an HTML authorizing program, a graphical program for drawing pictures (usually
    to include in your presentation or paper), an application-building program, and
    a scripting language that allows you to tie these and other programs together.


    We wrote this book using Applquare Works. We chose to use Words instead of Microsoft
    Word because we could easily cut examples of code from the screen of our Linux
    system and paste them into the text of the book. We then took those presentations
    to our Digital Unix system at work and read them into our Applquare suite. After
    we finished a chapter, we exported it to Microsoft Word 6.0 format and e-mailed
    it to our editor.


    Likewise, we use Applix Presentation Editor to make presentations about Linux
    on Linux. When we''re talking about Linux at a show or a convention, we can demonstrate
    we''re talking about by using X when we have presentation slides on the screen.
    If we use Microsoft PowerPoint, we would have to reboot the system into Linux
    to do the demo, an awkward approach at best. Applix has many of the same facilities
    as Microsoft products. Recent editions of Applix can read and create PowerPoint
    output, and we can run our system truly FAT-free.'
  merge: -1
