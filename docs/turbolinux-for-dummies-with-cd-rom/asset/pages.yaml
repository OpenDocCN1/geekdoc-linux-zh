  md: '# # Appendix B

    # The Linux man Pages


    In This Chapter


    +   - Using the man command

    - Reading the man pages

    - Finding commands


    Unix and Linux systems are largely made up of small, terse commands executed on
    the command line. Typically, each command is associated with at least one man
    page. The man pages have nothing to do with gender: The man stands for manual.


    > At one time, the man pages were the only documentation that came with Unix systems.
    Somewhere I still have the thin book I received as a first-time Unix user and
    systems administrator. All it contained were the man pages, and from that I was
    supposed to install a Unix system. Many years later, I still look at the man pages
    first to get a quick idea of what a command should do and what arguments to use
    on the command line or what values to set.


    This appendix shows you how to use the man(1) command, how to read and understand
    the man pages, and how to locate other man pages that may help you understand
    the Linux command you are investigating.


    # ## Using the man Command


    To get started using the man pages, follow these steps:


    +   1. With Linux up and running, log on as a user (either a general user or as
    root).

    2. Type man at the command prompt.

    The system asks what manual page you want. The syntax of the man command (like
    many other commands) requires at least one argument.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 326 Part VII: Appendixes


    3. Supply an argument by typing man man.


    The first man is the command name, and the second man tells Linux that you want
    information on the manual program itself. The system may tell you to wait a moment
    while it formats the page to your screen, and then it displays the reference page
    for the man command.


    4. If a colon () appears at the bottom of the screen, press the spacebar to see
    the next page or use the arrow keys to maneuver around the pages.


    5. To quit the program, press q.


    # Sections in the man Pages


    The man pages are usually found in several directories throughout the system:


    +   /usr/man

    /usr/local/man

    /usr/X11/man

    /usr/lib/per15/man


    Each directory is broken up into subdirectories representing sections of the manual,
    as follows:


    +   man1: User commands

    man2: System calls

    man3: Library functions

    man4: Special files

    man5: File formats

    man6: Games (look at everyone going to that section!)

    man7: Miscellaneous

    man8: System administration commands

    mann: nroff, troff, and groff (and now tk) macros


    Note that some directories have more than one section.


    Two sections may have an entry for a command of the same name. For example, section
    1 has an open command and section 2 has an open system call. To make sure that
    you''re reading about the right one, you can specify the command on the man command
    line. For example:'
  merge: -1
