  md: '# 130 Part III: Using TurboLinux


    # Files 101


    A file is a collection of information with a distinct identification made up of
    a filename (called a directory path) where the file is kept. Linux can store many
    files in the same directory — as long as the files have different names. Linux
    can also store files with the same name in directories.


    Confused? An example would help. Suppose you get a grand idea and decide to keep
    it in a file name in your directory called /wonderful/, which would look like
    /wonderful/idea. Now you are having a very little day and come with another idea.
    If you are keeping your second idea in the /wonderful directory, you would use
    a different name for the second file, such as /wonderful/idea2. (I hope your ideas
    are more original than filenames.) You can also however, keep the file in another
    location — call it the /bizarre directory. If you decide to keep your second idea
    in /bizarre/, and the filename becomes bizarre/idea. Linux sees this file and
    the /wonderful/idea as different files. Remember, that each directory may contain
    only one file with the same name.


    Linux filenames can be as long as 256 characters. They can contain uppercase and
    lowercase letters (also known as mixed case), numbers, and special characters,
    such as the underscore (_), the dot (.), and the hyphen (-). Because filenames
    can be made of mixed case names, and each name is distinct, I can call these names
    case sensitive. For example, the names FILENAME, filename, and FileNameName can
    be unique filenames of different files; on some systems (like Compaq/OpenVMS),
    they are the same filename.


    ![](img/8ae48244df88d68913b10871643fd825_155_0.png)


    Although filenames technically can contain wild characters, such as the asterisk
    (*) and the question mark (?), it''s not a good idea to use them. Various command
    interpreters, or shells, use wild cards to match several filenames at one time.
    If your filenames contained wild characters, you would have trouble specifying
    only those files. I recommend that you create filenames that don''t contain spaces
    or other characters that have meaning to you.


    # File types


    TurboLinux files can contain all sorts of information. Five categories of files
    that cover certain types of information will become the most familiar to you:
    use data files, system data files, directory files, special files, and executable
    files.


    +   * User data files contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex user data files, such as graphics or spreadsheet files,
    must be interpreted and used by a special program.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Chapter 8: Working with Files and Commands


    These files are mostly illegible if you look at them with a text editor because
    the contents of these files are not usually ASCII text. Changing these files generally
    affects only the user who owns the files.


    +   - System data files are used by the system to keep track of users on the system,
    logins, passwords, and so on. As system administrator, you may be required to
    view or edit these files. As a regular user, you will not be concerned with system
    data files except for those that you use as examples for your own startup files.


    +   - Directory files hold the names of — and other directories — called children.
    Directories in Linux (UNIX) are just another type of file. If you are in a directory,
    the directory above you is called the parent. Isn''t this home?


    When you list files with the ls -l command, directory files begin with the letter
    d. For example:


    ```

    maddog@shamet$ ls -ld plot

    drwxr-x 2 maddog 1024 Jul 111997 plot

    maddog@shamet$ ls

    ```


    In this example, I used the d option of the ls to tell the command I wanted to
    see the directory as if it were the example in the directory. If I had not used
    the d option, I would have seen every file in the plot directory, along with the
    directory itself.


    +   - Special files represent either hardware devices (such as a disk drive, a
    tape drive, or a keyboard) or some type of placeholder the operating system uses.
    /dev is a directory that holds many of these special files. You can see this by
    typing the following:


    ```

    ls -1 /dev

    ```


    +   - Executable files contain instructions (usually called programs, or shell
    scripts) for your computer. When you type the name of one of these files, you
    are telling the operating system to execute the instructions. Some executable
    files look like gibberish, and others look like long lists of computer commands.
    A lot of these executable files are in /bin, /usr/bin, /sbin, and /usr/sbin.


    # Files and directories


    You can think of the TurboLinux file system as one huge file folder that contains
    files and other file folders, which in turn contain files and other file folders,
    which in turn contain files and other file folders, and so on. In fact, the Linux
    file system is generally organized this way. One big directory contains files
    and other directories, and all the other directories in turn contain files'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 132 Part III: Using TurboLinux


    # Directories and subdirectories


    A directory contained, or *nested*, in another directory is called a subdirectory
    of that directory. For example, the directory called /mother may contain a subdirectory
    called /child. The relationship between the two is referred to as parent and child.
    The full pathname of the subdirect is /mother/child, which would make a good place
    to keep file containing information about a family reunion called /mother/child/reunion,
    where the directory would be /mother/child, the file would be called /mother/child/reunion.


    # The root directory


    In the tree directory structure of Linux, DOS, and Unix, the big directory at
    the bottom of the tree that is the parent for all the other directories is called
    the root directory and is represented by a single / (pronounced "slash”). From
    the root directory, the whole directory structure grows like a tree, with directories
    and subdirectories branching off like limbs, and the sprouting leaves of the tree.


    If you turned the tree over so that the trunk was in the air and the branches
    were toward the ground, you would have an inverted tree — which is the way the
    Linux file system is normally drawn and represented (with the root at the top).
    If we were talking about Mother Nature, you''d soon have a dead tree. Because
    this is computer technology, however, you have something that looks like an ever-growing,
    upside-down tree.


    # What''s a name?


    You name directories in the same way you name files, following the same rules.
    Almost the only way that you can tell whether a name is a filename or a directory
    name is the way that the slash character / is used to show directories nested
    in other directories. For example, usr/local means that local is found in the
    usr directory. You know that usr/ is a directory because the trailing slash character
    tells you so, but you don''t know whether local is a file or a directory.


    ![](img/8ae48244df88d68913b10871643fd825_157_0.png)


    If you use the -F option, directories are listed with a slash character at the
    end, as in local/, you would then know that local is a directory.


    The simple way to tell whether the slash character indicates the root directory
    or separates directories (or directories and files) is to see whether anything
    appears before the slash character in the directory path specification. If nothing
    appears before the slash, you have the root directory. For example, you would
    know that /usr is a subdirectory or a file in the root directory because it has
    only a single slash character before it.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 8: Working with Files and Commands 133


    # Home again


    TurboLinux systems have a directory called /home, which contains the user''s home
    directory, where he or she can


    +   - Store files

    - Create more subdirectories

    - Move, delete, and modify subdirectories


    TurboLinux system files as well as files belonging to other users are never in
    a user''s /home directory. Linux decides where the /home directory will be placed,
    and that location can be changed only by a superuser, not by general users. Linux
    is dictatorial because it has to maintain order and keep a handle on security.


    /home directory is not safe from prying eyes. To be your privacy is maintained,
    you need to lock your directory. (We tell you how in the "We Grant You Permission"
    section later in this chapter.) Anyone logging in to your system as root (superuser),
    however, can see what''s in your /home directory, even if you do lock it up.


    ![](img/8ae48244df88d68913b10871643fd825_158_0.png)


    # Getting Around with pwd and cd


    You can navigate the TurboLinux file system without a map or a GPS. All you need
    to know are two commands: pwd and cd.


    # Where am I?


    To find out where you are in the TurboLinux file system, simply type pwd at the
    command prompt as follows:


    ```

    [maddog@shamet maddog]$$pwd

    /home/maddog

    [maddog@shamet maddog]$

    ```


    This indicates that I''m logged in as maddog and am in the /home/maddog directory.
    Your alter ego is out there, you should be logged in as <yourself> and be in the
    /home/<yourself> directory, where <yourself> is your login name.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Conventions without Shriners


    You''ll be seeing a lot of commands, so you may find it helpful to review the
    syntax of TurboLinux commands:


    +   - Text inside braces | indicates that you must choose one of the values that
    are inside the braces separated by the | sign.


    +   - Text not surrounded by [ ], ( ), or < > must be typed exactly as shown.


    +   - An ellipsis (...) means and so on or to repeat the preceding command line
    as needed.


    +   - Text inside brackets [] is optional.


    +   - Text inside angle brackets < > must be replaced with appropriate text.


    The pwd command stands for print working directory. Your working directory is
    the default directory where TurboLinux commands perform their actions. When you
    type the ls(1) command, for example, Linux shows you the files in your working
    directory. Any file actions on your part occur in your directory.


    Type this command:


    ```

    ls -la

    ```


    The files you see are only those in your working directory. If you want to specify
    a file that isn''t in your working directory, you have to name the directory that
    contains the file as well as the name of the file. For example, the following
    command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    # Every directory has a parent and lots of relatives


    If the file you want to read is in a subdirectory of the one you are in, you can
    reach the file by typing a relative filename. Relative filenames specify the location
    of files relative to where you are.


    In addition to what we told you about specifying directory paths, you need to
    know about these three additional rules:


    +   - One dot (.) always stands for your current directory.


    +   - Two dots (...) specify the parent directory of the directory you are currently.'
  merge: -1
  pgno: 159
