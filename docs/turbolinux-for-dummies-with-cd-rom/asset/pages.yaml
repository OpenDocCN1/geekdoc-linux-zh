    manager or the terminal emulator window, check out Chapter 11.


    Your shell prompt should look something like this:


    ```

    [username@hostname login]$

    ```


    The most important element is the $ at the end of the line. This is the prompt,
    and it''s the shell''s method of saying, "Okay, I''m finished with the last thing,
    so give me something else to do."


    ![](img/8ae48244df88d68913b10871643fd825_195_1.png)


    If you are logged on as root or have become a superuser through the use of the
    su[1] command, the $ is replaced with a # sign, which indicates that the user
    is root or otherwise has become a superuser.


    To make sure you''re using the bash shell versus one of the other shells, type
    the following:


    ```

    [username@hostname login]$

    ```


