  \ |\n| 跟踪已读/未读邮件 | 当此字段设置为 `Yes` 时，模块将跟踪邮箱中的哪些消息已读，并对已读消息显示标记。它还将显示标记单条或多条邮件为读或未读的额外按钮。此功能仅在您将模块作为邮件客户端时才有用，因此该字段的默认值为\
