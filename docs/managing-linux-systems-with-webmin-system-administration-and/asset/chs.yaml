  \ 计数速度缓慢，则您可能需要禁用此项。 |\n| **用于索引的最小邮件文件大小** | 通常情况下，`Webmin` 会为用户 `mailbox` 中的消息创建一个索引文件，这样它就不需要在每次刷新时重新读取\
  \ `mail file`。这可以加速 `mailbox` 和单个电子邮件页面的显示，但如果 `mailbox` 频繁变化，则可能会失效。索引失败的常见症状是显示大量空白消息，而不是\
  \ `mailbox` 的实际内容。此字段可用于完全关闭索引，或将其限制为仅针对大型邮件文件。默认值 `1 MB` 会停止对被 `POP3` 频繁清理的小型 `mailboxes`\
  \ 进行索引，同时对留在服务器上的大型信箱开启索引。 |\n| **转发消息时带引用？** | 当启用此选项时（默认启用），使用模块的邮件读取功能转发的单条消息，其每行开头都将加上\
  \ `>` 字符。由于某些人不喜欢这种形式的引用，可以使用此配置字段将其关闭。 |\n| **删除消息前是否确认？** | 此字段决定 `Webmin` 在删除用户\
  \ `mailbox` 中的消息之前是否会要求您进行确认。 |\n| **sendmail.cf 的完整路径** | 此字段必须包含 `Sendmail` 主配置文件\
  \ `sendmail.cf` 的完整路径。它几乎总可以在 `/etc` 或 `/etc/mail` 目录中找到。 |\n| **Sendmail M4 基础目录**\
