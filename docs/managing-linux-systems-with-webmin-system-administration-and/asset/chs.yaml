  \ 功能正常工作，此字段必须设置为包含用户邮件文件的目录，例如 `/var/mail*`。只有当您重新配置了 `Sendmail` 将邮件投递到不同的目录时（例如使用\
  \ `Procmail` 作为本地投递代理），您才需要更改它。如果选择了 `File under home directory`（家目录下的文件），模块将在每个用户的家目录下查找邮件文件。确切的文件由下方的“Mail\
  \ file in home directory”字段指定。再次，只有当您确实配置了 `Sendmail` 将邮件投递到此类文件而不是 `/var/mail`\
  \ 目录时，才选择此项。 |\n| **家目录下的邮件** | 当 `User mail file location` 配置字段设置为 `File under\
  \ home directory` 时，此字段必须包含用户家目录中的文件名称，入站邮件将追加到该文件中。默认是 `mbox`，但在某些系统上可以使用 `Mailbox`\
  \ 或 `Inbox`。 |\n\n\n\n\n\n| 邮件文件目录样式 | 当在“用户邮件文件位置”字段中指定目录时，此菜单控制模块在何种目录下查找实际的邮件文件。默认值\
  \ `mail/username` 告诉模块邮件文件位于该目录，并且与所有这些文件的用户用户名相同。对于 99% 的系统来说，这是正确的，因此不应更改此字段。但是，如果您的系统上有大量用户，并且配置了\
  \ Sendmail 将用户邮件文件分组到 `/var/mail` 下的子目录中，那么其他菜单选项将非常有用。它们的含义应该是不言自明的。 |\n| SMRSH\
  \ 目录 | SMRSH 是一个程序，Sendmail 可以配置为用它在从别名或 `.forward` 文件执行程序时使用。它将可以运行的程序限制在特定目录（通常是\
  \ `/etc/smrsh`）中的程序。如果您的系统中安装了 SMRSH，并希望使用此模块创建自动回复或过滤别名，则必须将此字段设置为 SMRSH 目录。这将告诉模块从该目录到其生成的自动回复或过滤脚本创建一个符号链接，以便它们能够实际运行。如果选择\
  \ None（无），则不会创建此类链接。许多 Linux 发行版包含使用 SMRSH 的 Sendmail 包。在这些系统上，此字段将默认设置为 `/etc/smrsh`。\
  \ |\n| 额外的邮件队列目录 | 此字段可用于指定额外的邮件队列目录，供模块检查在 `sendmail.cf` 文件中定义的队列消息。这通常没有必要，除非您有两个单独\
  \ Sendmail 配置，一个用于入站邮件，另一个用于出站邮件。在这种情况下，模块只能读取其中一个配置文件，因此无法自动识别出所有的队列目录。由于最近版本的\
  \ Mandrake Linux 包含了此类工作方式的 Sendmail 包，该字段在 във发行版上默认会被正确设置。 |\n\n### 37.16 总结\n\
  \n完成本章后，你应该熟悉互联网电子邮件背后的概念、用于传输它的协议以及使用这些协议的程序类型。你还应该理解 Sendmail 执行的任务，以及如何配置它以通过别名重定向电子邮件、限制转发邮件的源地址或目标域名，并支持多个虚拟域名。使用\
  \ Webmin 的 Sendmail 模块读取用户邮件和查看邮件队列也应该是清晰的。最后，如果有必要，你应该知道如何设置该模块以授予 Webmin 用户有限的访问权限，使其仅管理托管在您系统上的部分邮件域。\n\
  \n## 第 38 章 配置 Qmail\n\n本章解释了如何在您的系统上配置 Qmail 邮件服务器，并将其与另一个流行的服务器 Sendmail 进行比较。\n\
  \n### 38.1 Qmail 简介\n\nQmail 可能是互联网上第二受欢迎的 UNIX 邮件服务器，仅次于 Sendmail，并与 Postfix 竞争。因为\
  \ Sendmail 使用以 root 身份运行的单一服务器进程，该进程中的任何安全漏洞都允许攻击者接管整个系统。Qmail 的设计通过使用多个服务器进程和程序来避免这个问题，每个程序都只拥有其所需的权限。\n\
  \n在配置 Qmail 之前，你需要了解互联网电子邮件的工作原理。第 37.1 节“互联网电子邮件简介”几乎解释了你需要知道的所有内容，如果你不熟悉 SMTP、MX\
  \ 记录等，请现在就阅读它。同样的原理也适用于 Qmail。\n\nQmail 和 Sendmail 最大的区别在于用户邮件文件目录的位置和格式。尽管 Qmail\
  \ 通常在 UNIX 用户和电子邮件账户之间建立一对一的映射，但它不会将用户邮件存储在类似 `/var/mail` 的目录中。相反，取决于 Qmail 的配置，使用的是每个用户家目录下的\
  \ Mailbox 文件或 `Maildir` 目录。Mailbox 文件具有与 Sendmail 创建的普通用户邮件文件相同的标准格式，但 `Maildir`\
  \ 目录完全不同。它包含三个子目录，每条消息都存储在其中自己的单独文件中。这种邮件存储系统使得新邮件的投递更加可靠，并避免了在删除消息时重写大文件的需要。\n\n\
  所有的 Qmail 程序、配置文件和排队消息都存储在 `/var/qmail` 目录下。它没有单一的主文件，相反，控制和别名子目录中的许多小文件告诉服务器该做什么。由于它们在每接收到新消息时都会被重新读取，因此对这些文件的任何更改都会立即生效。\n\
  \n与 Sendmail 不同，Qmail 没有永久运行的服务器进程来接受 SMTP 连接。相反，它依赖于超级服务器（如 `tcpserver`、`inetd`\
  \ 或 `xinetd`，在第 15 章介绍）在邮件客户端或其他 MTA 连接到 SMTP 端口时运行一个小型程序。一旦电子邮件被接收并加入队列，该程序就会退出。一个独立的\
  \ Qmail 守护进程会定期扫描邮件队列，并尝试将其中的消息投递到远程系统或本地邮箱。\n\n也可以通过将邮件作为输入提供给相应的程序 `qmail-queue`（位于\
  \ `/var/qmail/bin` 目录下）来将邮件添加到 Qmail 队列。该目录下还有一个名为 `sendmail` 的程序，它接收与实际 `Sendmail`\
  \ 命令相同的输入和参数，但实际上它只是 `qmail-queue` 的包装器。在大多数安装了 Qmail 的系统上，从 `/usr/lib/sendmail`\
  \ 和/或 `/usr/sbin/sendmail` 存在指向该程序的符号链接，以便期望安装了 Sendmail 的其他脚本或程序仍然可以工作。\n\n###\
  \ 38.2 Qmail 配置模块\n\nWebmin 配置 Qmail 的模块可以在“服务器”（Servers）类别下找到。假设你已安装 Qmail，点击其图标将带你进入模块的主页，如图\
  \ 38.1 所示。主页上的每个图标都是指向模块某个功能页的链接，例如别名或本地域。在每个名称下方是与该功能相关的 Qmail 文件或程序名称，以便经验丰富的管理员可以查看每个图标页面到底在配置什么。\n\
  \n##### 图 38.1. Qmail 配置模块。\n\n![](img/38fig01.jpg)\n\n页面底部有一个标记为“Start Qmail Processes”（启动\
  \ Qmail 进程）或“Stop Qmail Processes”（停止 Qmail 进程）的按钮。正如名称所示，它们分别在队列处理进程未运行时启动它，在运行时停止它。由于\
  \ Qmail SMTP 监听器是从 `inetd` 运行的，其他主机始终能够连接到您的系统。然而，如果队列处理服务器关闭，它们发送的任何邮件将无法投递到本地邮箱或其他服务器。\n\
  \n如果你没有安装 Qmail，主页上将显示错误消息 `The QMail base directory `/var/qmail` does not exist`。遗憾的是，很少有操作系统包含\
  \ Qmail 包，因此你几乎肯定需要从 [www.qmail.org](http://www.qmail.org/default.htm) 下载它、编译并手动安装。安装过程涉及创建几个\
  \ UNIX 用户以及一个 `inetd` 或 `xinetd` 服务，这两个都可以使用 Webmin 完成。在任何 UNIX 系统上都应该编译 Qmail，而且它的行为和安装位置在所有系统上都是相同的。正如你预期的，该模块在所有操作系统上的行为也完全相同。\n\
  \n如果你安装了 Qmail，还应该配置包中包含的 POP3 服务器程序 `qmail-pop3d`。大多数 UNIX 变体自带的标准 POP3 服务器被编写为查找\
  \ `/var/mail` 中的 Sendmail 风格邮件文件，无法与 Qmail 的 `~/Mailbox` 文件或 `~/Maildir` 目录配合。用户能够登录，但看不到他们的电子邮件！\n\
  \n\n\n\n\n在本书编写时，只有 MSC 和 Debian Linux 将 Qmail 软件包作为标准包含。你可以使用“软件包”模块轻松安装它们，它将为你设置好所有需要的用户和\
  \ Internet 服务。Qmail 的开发者不愿将其打包为源码 `.tar.gz` 文件以外的格式，这就是为什么它不像其他 MTA（邮件传输代理）那样常见于\
  \ Linux 发行版。\n\n在安装 Qmail 之前，你需要关闭或卸载系统上安装的任何其他邮件服务器，例如 `Sendmail` 或 `Postfix`。这是必要的，因为\
  \ SMTP 端口只能列出一个程序，而且你希望确保监听程序始终是 Qmail。卸载是最佳选择，因为它可以确保所有可能重启 `Sendmail` 的启动脚本都被删除，并让\
  \ `sendmail` 命令可以链接到 Qmail 的封装程序。\n\n### 38.3 编辑本地域名\n\n当 Qmail 通过 SMTP 或其任一个程序接收到邮件时，它需要判断是应该在本地投递还是转发到另一个服务器。这是通过查看邮件的\
  \ `To:` 地址来实现的，具体查看 `@` 之后的域名部分。将该域名与本地域名列表进行比较，如果找到匹配项，邮件将投递到 `To:` 地址中 `@` 左侧用户的信箱（如果该用户存在）。\n\
  \n如果域名不是本地的，Qmail 将查找该域名的邮件服务器并尝试连接它以传输邮件。这通常是同一网络上的客户端连接发送邮件时发生的情况。然而，如果你的服务器尝试连接自身，就会发生问题，这发生在\
  \ DNS 显示它是某个不在本地域名列表中的域名的邮件服务器时。如果发生这种情况，将向发送者返回退信邮件，其中包含类似“该域名不在我的允许 rcpthosts\
  \ 列表中”或“跳数过多”的文本。\n\n要编辑 Qmail 的本地域名列表，请按照以下步骤操作：\n\n在模块的主页上，点击“本地域名”（Local Domains）图标。将显示一个包含输入域名或主机名文本框的页面。\n\
  \n选择下方列出的“域名”（Domains）单选按钮。如果你勾选了“仅本地主机名”（Only local hostname），Qmail 将只接受发送到系统主机名地址（例如\
  \ `mailserver.example.com`）的邮件。\n\n在文本框中输入你的系统应该接受邮件的所有域名。\n\n点击“保存”（Save）按钮以激活它们。此时，向任何新域名发送测试邮件以确保一切运行正常是一个好主意。\n\
  \n### 38.4 管理邮件别名\n\n邮件别名（Mail alias）告诉你的服务器，发送特定地址的邮件应该转发到不同的目标。该目标可以是另一个邮件地址、本地文件、目录，甚至是程序的输入。它们对于设置伪信箱非常有用，这种实际上可以将邮件发送给真人，例如\
  \ `sales@example.com` 或 `webmaster@example.com`。别名的名称可以与 UNIX 用户名相同，在这种情况下，它将拦截所有发送给该用户的邮件，并将其转发到不同的目标。\n\
  \n使用 Webmin 创建邮件别名的步骤如下：\n\n点击模块主页上的“邮件别名”（Mail Aliases）图标。你将进入一个列出所有现有别名及其目的地的页面，顶部带有一个用于添加新别名的表单。如图\
  \ 38.2 所示。\n\n#### 图 38.2 邮件别名列表。\n\n![](img/38fig02.jpg)\n\n在表单的“地址”（Address）字段中为你的新别名输入名称，例如\
  \ `sales`。目前将菜单设置为“<所有域名>”（<All domains>）。其用法将在第 38.6 节“管理虚拟映射”中解释。\n\n名为 `default`\
  \ 的特殊别名将用于任何不匹配其他别名或用户信箱的邮件。它对于转发所有将退回到某些地址的消息非常有用。\n\n“别名到”（Alias to）字段决定了发送到此别名的邮件去向。菜单中提供以下选项：\n\
  \n- `<None>`：对收到的邮件不进行任何操作。在创建新别名时选择此选项没有意义。\n- `Email address`（邮件地址）：邮件将转发到相邻字段输入的用户或地址。注意不要再次将邮件发送回别名地址而导致转发循环！如果你正在创建一个名称与\
  \ UNIX 用户同名的别名，并且确实希望将邮件转发到不同的目标。\n- `Mail directory`（邮件目录）：发送到别名的邮件将添加到邮件目录。该目录必须包含名为\
  \ `cur` 和 `tmp` 的子目录才能有效。\n- `Mail file`（邮件文件）：别名接收的邮件将附加到文本框指定的文件中。\n- `Feed to\
  \ program`（馈送到程序）：将运行在文本框中输入的路径和参数的程序，并将别名接收的邮件全文（包括头信息）作为输入馈送给它。\n- `Autoreply\
  \ from file`（从文件自动回复）：当邮件发送到别名时，文本框中指定文件的内容将返回给发送者。\n- `Apply filter file`（应用过滤文件）：发送到别名的邮件将根据文本框中输入的过滤文件的规则进行处理，可以根据邮件内容转发到不同的目标。\n\
  \n别名可以有多个目标。要添加多个目标，你需要在保存该别名后重新编辑该别名，并在“别名到”表格底部填充一行已选择 `<None>` 的行。\n\n点击“保存”（Save）将别名添加到\
  \ Qmail 配置中并激活。\n\n按照 Webmin 的惯常做法，你可以通过点击“邮件别名”页面列表中别名的名称来编辑现有的别名。这将弹出一个编辑表单，其中包含与创建表单相同的所有字段，但在底部有“保存”（Save）和“删除”（Delete）按钮。其中第一个将根据你所做的更改更新别名，而第二个将永久删除它。\n\
  \n如果 UNIX 用户在其主目录下有一个名为 `.qmail` 的文件，通常会投递到其邮件文件的邮件将发送到 `.qmail` 文件中列出的地址。如果存在名为\
  \ `.qmail-suffix` 的文件，发送到你服务器上 `username-suffix` 的邮件将发送到该文件的地址。这些 `.qmail` 文件的格式与你按照上述指令在\
  \ `/var/qmail/alias` 目录创建的文件完全相同，因此也可以用于投递到文件、目录或程序。\n\n然而，此模块不支持编辑每个用户的 `.qmail`\
  \ 文件。不过，Usermin（第 47 章介绍）允许普通用户编辑自己的转发文件，使用的是与本节描述的几乎相同的 Web 界面。\n\n### 38.5 配置中继\n\
  \n\n\n\n\n`Qmail` 可以配置为限制其中继邮件的目标域名。这通常是为了防止垃圾邮件发送者利用你的系统作为开放邮件中继站，从而隐藏他们的真实地址。然而，`Qmail`\
  \ 并不支持允许来自特定地址的客户端中继，因此设置中继域名限制将导致服务器无法发送外邮件。解决此问题的一种方法是运行两个 SMTP 服务器：一个用于接收邮件并仅中继本地域名的邮件；另一个用于发送邮件，并使用\
  \ `TCP-wrapper` 或 `xinetd` 限制来限制对信任客户端的访问。\n\n`Qmail` 网站推荐解决方案是使用 `tcpserver` 守护进程运行\
  \ `Qmail` SMTP 程序，并为某些客户端设置 `RELAYCLIENT` 环境变量。这告诉后者无论中继域名列表中包含什么都允许中继，从而实现了赋予信任客户端完全中继权限的预期目标。然而，这种配置非常复杂，且不支持\
  \ `inetd` 或 `xinetd`。在本书编写时，`Webmin` 尚不支持此类中继访问控制的配置。\n\n\n\n默认情况下，`Qmail` 允许中继到任何域名。更改此设置的步骤如下：\n\
  \n1. 在模块的主页上，点击 `Accepted Domains` 图标。将显示列出允许中继的域名和主机名的页面。\n2. 选择 `Domains listed\
  \ below` 单选按钮。\n3. 在页面上的第一个文本框中输入允许中继的域名。必须包含所有本地域名（在第 38.3 节“编辑本地域名”中讨论），否则发往这些域的邮件将被退回。\n\
  4. 你也可以将不常使用的中继域名输入第二个文本框。两者唯一的区别是，发往第一个框中域名的邮件处理速度更快。\n5. 点击 `Save` 按钮使中继限制生效。\n\
  \n要关闭中继域名限制，在 `Accepted Domains` 页面上选择 `Any domain` 复选框并点击 `Save`。你输入的所有域名都将丢失。\n\
  \n### 38.6 管理虚拟映射\n\n`Qmail` 可以配置为对不同域名相同邮箱的邮件进行区分处理，使得 `sales@example.com` 和 `sales@foo.com`\
  \ 不会被投递到同一个用户或别名。如果你托管多个邮件域名，这一点至关重要，因为在几个域名中可能会出现某些冲突的邮箱名（如 `sales` 或 `webmaster`）。通过创建一个仅适用于特定域名而非所有域的别名可以实现这一点，因为按照第\
  \ 38.4 节“管理邮件别名”中的说明创建的别名正是这样工作的。\n\n在添加特定域名的别名之前，必须先配置 `Qmail` 特殊处理该域名。它会在内部为发送到该域的任何邮件的\
  \ `To:` 地址添加类似 `example-` 或 `foo-` 的后缀，这样你就可以创建像 `example-sales` 或 `foo-sales` 这样的别名。幸运的是，`Webmin`\
  \ 在适当的情况下为你完成了大部分添加这些前缀的工作。\n\n要将域名指定为特殊别名，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `Virtual Mappings`\
  \ 图标。将显示列出所有现有域名及其缀的页面，顶部有一个添加新项目的表单。\n2. 在 `Mail for address` 字段中，选择 `Addresses\
  \ with domain` 并在旁文本框中输入域名（如 `example.com`）。\n3. 如果选择了未匹配其他虚拟映射选项的 `Any` 地址，则下一步中输入的后缀将将添加到所有不匹配其他虚拟域的\
  \ `To:` 地址中。这通常没有用。\n4. 如果选择了 `Address` 并在旁边的两个文本字段中输入邮箱名和域名，则该映射将仅适用于特定地址。后缀将加在地址的用户名部分，例如将\
  \ `fred@example.com` 转换为 `example-fred@example.com`。这比映射整个域名用处少，但可以赋予用户 `fred` 能够为不同域名创建个性的\
  \ `.qmail` 文件。\n5. 在 `Prepend to username` 字段中，保持选择 `Automatically chosen prefix`\
  \ 为简单。这告诉模块取域名的第一部分（例如 `example.com` 中的 `example`）作为前缀，这几乎总是有效的。\n6. 如果你喜欢选择自己的前缀，请选择\
  \ `Specified prefix` 并将其输入相邻的文本框。它应该只由字母、数字和字符组成。如果你将 UNIX 用户名作为前缀，发往该域的邮件将受到其家目录下\
  \ `.qmail-` 文件的影响。例如，如果前缀是 `bob` 且收到了发往 `fred@bob.com` 的邮件，那么 `~bob/.qmail-fred`\
  \ 将控制其转发到何处。\n7. 如果选择 `Nothing`，则不会为该域名添加任何后缀。如果父域名启用了虚拟映射，这可能有用。\n8. 点击 `Create`\
  \ 按钮将新的虚拟域名映射添加到列表中。\n9. 回到主页，点击 `Local Domains` 图标。\n10. 从列表中删除你刚刚添加的域名。否则，发往该域的任何邮件将正常投递，就像虚拟映射不存在一样。\n\
  11. 点击 `Save` 更新本地域名列表。\n\n按照 `Webmin` 的习惯，你可以在创建虚拟映射后，通过点击 `Virtual Mappings` 页面上的域名来编辑或删除它。更改任何字段并点击\
  \ `Save` 以激活新前缀，或点击 `Delete` 按钮将其完全删除。更改前缀或删除映射要小心，因为任何使用该前缀的现有别名将不会更新，从而停止工作。\n\
  \n一旦你配置了 `Qmail` 为域名执行虚拟映射，你就可以添加特定于该域的别名。执行此操作，请遵循第 38.4 节“管理邮件别名”中的说明，但在步骤 2 的菜单中选择别名应所在的域名。添加后，别名将出现在列表中，并带有其前缀（如\
  \ `example-sales`），而不是它实际匹配的地址（如 `sales@example.com`）。\n\n请注意，不特定于任何域的别名将不适用于发送到其他域名相同邮箱名的邮件。这与\
  \ Sendmail 别名的行为不同，如果你刚刚为某个域名添加了虚拟映射，并疑惑为什么所有别名都停止工作了，这可能会令人困惑。\n\n### 38.7 配置域名路由\n\
  \n通常，`Qmail` 通过在 DNS 中查找相应的邮件服务器并连接到它来投递非本地域邮件。你可以使用此模块配置 MTA，为某些域名连接到不同的服务器，或者通过单个服务器发送所有外邮件。如果你的系统是几个内部邮件服务器的网关（这些服务器无法从互联网其他直接访问），或者你希望所有外邮件都通过你的\
  \ ISP 或公司服务器发送，这可能非常有用。\n\n要为域名指定备用邮件服务器，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `Domain Routing`\
  \ 图标进入列出所有现有路由（如果有）的页面，顶部有一个添加新路由的表单。\n2. 在 `Send via SMTP server` 字段中，选择第二个单选按钮并在相邻字段中输入主机名或\
  \ IP 地址。如果选择了 `Delivery directly` 选项，`Qmail` 将对该域名进行 DNS 查询并手动投递到结果服务器，即使它已配置为通过另一个服务器发送所有外邮件。在\
  \ `Create Domain Route` 表单中，在 `Mail for host or domain` 字段中输入你想通过路由路由的域名。\n\n\n\n\
  \n\n`SMTP port` 字段通常应保持为 `Default`（默认）。但是，如果你选择第二个选项，`Qmail` 将连接到你在文本框中填写的端口号，而不是\
  \ SMTP 默认的 `25`。如果由于某些原因特定的邮件服务器没有使用标准端口，这可能会非常有用。\n\n点击 `Create`（创建）按钮保存并激活新的域名路由规则。\n\
  \n一旦添加了路由，它将出现在 `Domain Routing`（域名路由）页面创建表单下方。你可以通过点击域名、更改详细信息并分别点击 `Save`（保存）或\
  \ `Delete`（删除）按钮来编辑或删除。再次强调，任何更改将立即生效。\n\n\n\n要让 `Qmail` 通过指定的邮件服务器发送所有传出邮件，请执行以下操作：\n\
  \n1. 点击主页上的 `Domain Routing`（域名路由）图标。\n2. 滚动到 `Deliver all other outgoing mail via`（通过以下发送所有其他传出邮件）字段并选择第二个单按钮。然后在旁边的文本框中输入服务器的主机或地址。\n\
  3. 点击 `Save`（保存）激活新设置。\n\n要让 `Qmail` 重新查找并正常递送到目标服务器，请在第 2 步中选择 `Deliver directly`（直接递送）。\n\
  \n### 38.8 编辑全局 Qmail 选项\n\n`Qmail` 有若干设置适用于它处理的所有电子邮件，这些设置与它使用的主机名、SMTP 超时以及最大消息大小有关。下面的步骤解释了如何设置它们及其含义。\n\
  \n在模块的主页上，点击 `QMail Options`（QMail 选项）图标，打开显示并允许编辑全局选项的表单。\n\n`Local host name`（本地主机名）字段可用于告知\
  \ `Qmail` 你的系统主机名。它应设置为互联网域名或主机名，例如 `example.com`。\n\n要设置 `Qmail` 发送到远程 SMTP 服务器的主机名，请选择\
  \ `Hostname for SMTP HELO`（SMTP HELO 主机名）字段的第二个选项并填充其文本框。如果选择了 `Default`，将使用来自上一个字段的主机名。\n\
  \n要更改服务器等待远程 MTA 接受 SMTP 连接的时间，请填写 `SMTP connection timeout`（SMTP 连接超时）字段。如果选择了\
  \ `Default`，则将使用 `60` 秒的超时时间。降低此值可能很有用，以防止系统浪费过多时间尝试连接关闭的服务器，`60` 秒的等待时间通常太长。\n\n\
  要设置 `Qmail` 等待远程服务器发送的每个 SMTP 命令响应的秒数，修改 `SMTP outgoing response timeout`（SMTP 传出响应超时）字段。如果选择了\
  \ `Default`，则使用 `20` 分钟的超时时间。\n\n要停止你的 MTA 接收大型邮件，选择 `Maximum message size`（最大消息大小）字段中的第二个按钮，并在旁边的文本框中输入邮件可以包含的最大字节数。如果选择了\
  \ `Unlimited`（无限），则将接受任何大小的邮件。在磁盘空间或网络带宽有限的系统中，设置限制可能很有用。\n\n要设置 `Qmail` 等待连接到系统的远程邮件服务器的新数据的时间，填写\
  \ `SMTP incoming data timeout`（SMTP 入数据超时）字段。默认为 `20` 分钟。\n\n当你的服务器接收到如 `fred@1.2.3.4`\
  \ 地址的消息时（其中 `1.2.3.4` 是系统本地 IP 地址之一），它会将该地址转换为 `Hostname for email to local IP address`（发送到本地\
  \ IP 地址的邮件主机名）字段中指定的主机名。尽管邮件不这样命名，但有时会发生这种情况且 `Qmail` 可以处理。如果选择了 `Default`，则将使用\
  \ `Local host name` 字段中的主机或域名名。\n\n要更改 `Qmail` 在 SMTP 连接时显示的欢迎语，请选择 `SMTP greeting\
  \ message`（SMTP 欢迎消息）字段中的第二个单按钮，并在相邻的文本框中输入某些文本。此消息应以系统主机名开头，如果选择了 `Default`，则它只包含这些。\n\
  \n点击 `Save` 按钮用新设置更新 `Qmail` 配置文件。\n\n### 38.9 编辑邮件用户分配\n\n`Qmail` 的邮件用户分配功能允许你创建“虚假”邮箱，这些邮箱可以像真实的\
  \ UNIX 用户一样接收邮件。每个用户分配都定义了一个额外的邮箱，并有一个关联的 UNIX 用户名、`UID`、`GID` 以及存放邮件文件和 `.qmail`\
  \ 文件的家目录。如果你想避免为系统上的每个邮箱都创建一个 UNIX 账户，或者想将多个用户的邮件重定向到单个真实 UNIX 用户的邮箱中，这些设置将非常有用。\n\
  \n要创建一个新的邮件用户，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `Mail User Assignments`（邮件用户分配）图标。将显示显示现有分配的页面，顶部有一个用于创建新分配的表单（如图\
  \ 38.3 所示）。\n\n#### 图 38.3 邮件用户分配列表。\n\n![](img/38fig03.jpg)\n\n2. 在 `Address username`（地址用户名）字段中，选择\
  \ `Exact username`（精确用户名）并在文本框输入名称（如 `fred` 或 `joe`）。你也可以选择 `Usernames starting\
  \ with`（以...开头的用户名）并在该选项旁边的框中输入前缀，让邮件用户接收发送至任何以该前缀开头邮箱邮件。如果你希望将整个域的邮件递送给单个用户，以便稍后由\
  \ `Fetchmail` 等程序（第 33 章介绍）进行检索和分离，这可能很有用。例如，如果域名 `foo.com` 映射到前缀 `foo`，在 `Virtual\
  \ Mappings`（虚拟映射）页面上选择此选项。\n3. 在 `Deliver to`（递送到）字段中，输入将接收邮件的用户名。\n4. 在 `Home directory`（家目录）字段中，输入将进行递送的目录。这不需要是\
  \ `Address username` 用户的家目录，但必须对该用户可写。\n5. 在 `UID` 框中，输入用户的 ID。\n6. 在 `GID` 框中，输入用户的主组\
  \ ID。\n7. 点击 `Create` 按钮添加并激活邮件用户分配。它现在将出现在此页面的列表中。\n\n照常，你可以通过点击列表中的名称来编辑现有用户，在出现的表单上进行更改并点击\
  \ `Save` 按钮。你也可以通过 `Save` 旁边的 `Delete` 按钮删除用户。再次，任何更改立即生效。\n\n按照上述步骤创建的用户的一个问题是标准的\
  \ `Qmail POP3` 服务器无法识别它们。在 [www.qmail.org](http://www.qmail.org/default.htm) 上有支持“虚假”用户和虚拟域的\
  \ POP3 服务器设置说明和程序，在那里它们非常有用。\n\n### 38.10 查看邮件队列\n\n当 `Qmail` 接收到邮件时，它会被放入邮件队列。如果它可以立即发送到目标，则它会立即从队列中移除。然而，如果发送时发生某些临时错误，它将留在队列中等待稍后处理。`Qmail`\
  \ 服务器进程定期检查队列中的消息，每次重试的间隔越来越长，直到最终放弃。\n\n队列中长时间存在的通常是因为目标邮件服务器关闭或无法访问。另一个常见原因是远程\
  \ MTA 报告的临时错误，例如磁盘空间不足。`Webmin` 允许你通过以下步骤查看甚至删除队列中的消息：\n\n1. 在主页上，点击 `Mail Queue`（邮件队列）图标进入列出消息详情的页面。队列中的邮件数量显示在图标下方，因此你可以直观看到。\n\
  2. 在邮件队列页面上，所有队列消息的 `ID`、发送日期、发送者和目的地都在表格中显示。如果队列包含超过 `20` 条消息，则只显示前 `20` 条。要翻页查看剩余，请使用列表上方的左右箭头按钮。\n\
  \n\n\n\n\n要查看邮件的实际内容，请点击队列列表中的 ID。所有的头信息、正文和任何附件都将显示。要查看附件，只需点击其图标。要从队列中仅删除此条消息，请点击页面底部的\
  \ `Delete` 按钮。\n\n要从队列中删除多条消息，请使用 ID 旁边的复选框以及队列列表页面上的 `Select all`（全选）和 `Invert\
  \ selection`（反向选择）链接进行选择。然后，点击 `Delete selected messages`（删除选定的消息）按钮移除您选择的消息。\n\n\
  与 `Sendmail` 模块不同，队列页面上没有强制立即尝试递所有队列消息的按钮。\n\n### 38.11 读取用户的邮件\n\n正如介绍所示，`Qmail`\
  \ 可以配置为将邮件存储在用户目录下的 `Mailbox` 文件或 `Maildir` 目录中，甚至像 Sendmail 一样存储在 `/var/mail` 下。Webmin\
  \ 允许你读取用户的邮件，但在之前，你必须正确配置该模块，以便它知道去哪里查找。关于需要更改哪些字段的详细信息，请参阅第 38.12 节“配置 Qmail 配置模块”。默认情况下，将使用\
  \ `~/Maildir` 目录，因为最常见的 `Qmail` 配置。\n\n要读取用户邮箱中的邮件，请按照以下步骤操作：\n\n在模块的主页上，点击 `User\
  \ Mailboxes` 图标。将显示系统上所有用户及其邮箱大小的列表，除非你的用户超过 200 个。在这种情况下，将出现一个用于输入用户名的的小表单。\n\n\
  点击用户名称以显示其邮箱中的消息列表。默认情况下，先显示最近的消息，尽管它们实际上位于实际邮件文件的末尾。\n\n如果邮箱包含超过 20 封邮件，则只显示前 20\
  \ 封。要翻页查看其余，请使用列表上方的左右箭头按钮。\n\n要查看实际消息，请点击 `From:` 列中的发送者名称。将出现一个显示重要头信息、正文文本和附件的页面。点击附件图标进行查看（假设你的浏览器或某些外部程序支持该数据类型）。要从用户邮箱中仅删除此邮件，请点击页面底部的\
  \ `Delete` 按钮。\n\n要删除多条消息，首先使用邮件列表页面上的复选框以及 `Select all` 和 `Invert selection` 链接进行选择，然后点击\
  \ `Delete` 按钮。\n\n要搜索用户邮箱中符合某些标准的消息，请使用列表下方的 `Find messages where` 表单。可以从菜单中选择以下类型的搜索：\n\
  \n- `From: matches`、`Subject: matches`、`To: matches` 或 `Cc: matches`：查找 `From`、`Subject`、`To`\
  \ 或 `Cc` 字段包含相邻文本框中输入文本的消息。比较不区分大小写，但不能使用正则表达式。\n- `Date: matches`：查找发送日期头信息包含输入文本的消息。此头信息不会转换为本地格式，因此你输入的任何内容必须匹配发送者使用的日期格式。\n\
  - `Body matches`：查找正文包含输入文本的消息。正文包括所有处于未编码形式的附件，而不仅仅是你在阅读邮件时显示的文本。\n- `Size is greater\
  \ than`：查找总大小大于相邻字段中输入的字节数的消息。\n\n对于上述每种搜索类型，都提供相应的反向类型，例如 `From: doesn't match`\
  \ 或 `Size is less than`。在选择搜索类型并输入匹配文本后，点击 `Search` 按钮。将显示一个所有匹配消息的列表，你可以从中查看邮件内容或选择部分或全部删除，就像在普通邮件列表中一样。\n\
  \n邮件读取界面甚至允许你对用户邮箱中的消息进行编写、转发和回复。然而，它并没有设计成一个通用的 Web 邮件客户端。相反，你应该使用像 `Usermin` 这样的程序，它具有更好的界面并且同样支持\
  \ `Qmail` 邮件目录。\n\n### 38.12 配置 Qmail 配置模块\n\n与其他大多数模块一样，此模块有几项设置适用于模块本身的操作，而不是适用于\
  \ `Qmail`。它们被分为两组：影响用户界面的设置，以及指定 `Qmail` 配置文件和程序路径的设置。当你你点击主页上的 `Module Config`\
  \ 链接时，第一组设置列在 `Configurable options` 下，而第二组出现在 `System configuration` 下。\n\n表 38.1\
  \ 列出了所有可用字段并解释了它们的作用。\n\n#### 表 38.1 模块配置选项\n\n| 字段 | 描述 |\n| :--- | :--- |\n| Sort\
  \ tables by | 当选择 `Order in file`（文件中的顺序）时，别名、虚拟映射、域路由和邮件用户的列表将按照它们在源文本文件中出现的顺序显示，这通常是它们被添加的顺序。然而，如果选择\
  \ `Name`（名称），它们将按名称排序，这使得单个条目更更容易找到。 |\n| Maximum number of records to show in tables\
  \ | 如果别名、虚拟映射、域路由或邮件用户列表条目数量超过此字段中的数量，它们将不会显示。相反，将出现一个搜索表单，允许你通过名称查找条目。这样做是为了防止巨大的别名文件导致\
  \ `Mail Aliases` 页面变得巨大且显示缓慢。在大多数小型系统中，默认的 200 限制永远不会被触发。 |\n| Mail messages to\
  \ display per page | 此字段控制用户邮箱和查看邮件队列时每页显示的邮件消息数量。如果你喜欢使用较大的浏览器窗口，可能希望增加此值。 |\n\
  | Send mail via connection to | 正如 38.11 节“读取用户的邮件”所述，此模块可用于编写和发送邮件消息。当此字段被设置为 `qmail-inject`\
  \ 可执行文件时，Webmin 将通过运行 `/var/qmail/bin/qmail-inject` 命令并将邮件作为输入来发送这些消息。假设你的邮件服务器运行正常，这应该可以正常工作。如果想通过\
  \ SMTP 连接到某些其他 MTA 发送消息，请选择此字段的第二个选项并在文本框中输入另一个邮件服务器的主机。你甚至可以输入 `localhost` 以通过此系统上的\
  \ `Qmail` 服务器发送邮件，但不是运行程序。 |\n| Mailbox format | 如果你配置 `Qmail` 将用户的邮件存储在目录（通常称为\
  \ `Maildir`）下的单独文件文件中，则此字段必须设置为 `Directory`（目录）。如果对每个用户使用标准的 Sendmail 风格文件，则必须选择\
  \ `Single file`（单文件）。 |\n| Minimum mail file size to index | 在显示单文件邮箱的内容时，Webmin\
  \ 会为其包含的消息创建一个索引文件，这样它就不需要每页重新读取邮件文件。这加快了邮箱和单个邮件页面的显示，但如果邮箱经常更改，可能会失效。索引失败的常见症状是显示大量空白消息而不是邮箱的实际内容。此字段可用于完全关闭索引，或将其限制为仅针对大型邮件文件。1\
  \ MB 的默认值会停止对被 POP3 经常清理的小型邮箱进行索引，同时对留在服务器上的大型邮箱开启索引。 |\n| Forward messages with\
  \ quoting? | 当启用此选项（默认启用）时，使用该模块邮件读取功能转发的单条消息的每行开头都会带有 `>` 字符。由于某些人不喜欢这种形式的引用，可以使用此配置字段将其关闭。\
  \ |\n\n\n\n\n\n| 邮件队列排序依据 | 此字段控制 Qmail 邮件队列中消息的显示顺序。默认按队列 ID 排序，但您也可以让模块按每条消息的其他属性进行排序，不过会减慢大型队列的显示速度。\
  \ |\n| 在主页上显示邮件队列大小？ | 此字段决定是否在模块主页的邮件队列图标下方显示当前邮件队列的规模。如果您的系统始终拥有大型队列，导致 Webmin\
  \ 计数速度较慢，您可能希望禁用此项。 |\n| 在删除消息前进行确认？ | 此字段决定 Webmin 在删除用户邮箱中的消息之前是否会询问您进行确认。 |\n\
  | Qmail 基础目录 | 此字段必须设置为所有 Qmail 文件和程序所在的基础目录。这几乎总是 `/var/qmail`。 |\n| Sendmail 邮件文件位置\
  \ | 如果“邮箱箱格式”字段设置为“单文件”（Single file），此字段将告诉模块去哪里查找用户邮件。如果选择了“家目录下的文件”（File under\
  \ home directory），模块将使用下一个配置字段（通常为 `Mailbox`）中的文件名。然而，如果选择了第二个选项，您必须在旁边的框中输入路径（例如\
  \ `/var/mail`）。此时模块将假设 Qmail 将与所有者同名的文件递送到此目录，就像 Sendmail 一一样。 |\n| 家目录中的 Sendmail\
  \ 邮件文件 | 使用“单文件”邮箱箱格式时，此文件告诉模块用户家目录下邮件文件的名称。它几乎应该被设置为 `Mailbox`。 |\n| 家目录中的 Qmail\
  \ maildir | 使用“目录”（Directory）邮箱箱格式时，此文件告诉模块用户家目录下 Qmail 邮件子目录的名称。它几乎总是被设置为 `Maildir`。\
  \ |\n| 邮件文件目录样式 | 如果“邮箱箱格式”字段设置为“单文件”，并且在“Sendmail 邮件文件位置”字段中选择了第二个选项，此菜单将告诉模块用户邮件文件在目录（通常为\
  \ `/var/mail*`）下的布局。默认的 `mail/username` 告诉模块邮件文件位于目录下，并与所有者的用户名相同。对于 99% 的系统来说，这是正确的，因此不需要更改此字段。但是，如果您的系统上有大量用户，并且配置了\
  \ Qmail 将用户邮件文件分组到 `/var/mail` 下的子目录中，那么其他菜单选项将非常有用。它们的含义应该是不言自明的。 |\n| 启动 Qmail\
  \ 的命令 | 点击模块主页上的“启动 Qmail 进程”按钮时，将查询此字段以查看运行哪个命令。如果选择了“仅运行 rc 脚本”（Just run rc script），将使用\
  \ `/var/qmail/rc*` 脚本启动 `qmail-send` 队列处理守护进程。如果您选择第二个单选按钮，将运行在相邻文本字段中输入的任何命令，但它必须是能够启动\
  \ `qmail-send` 的命令。 |\n| 停止 Qmail 的命令 | 点击模块主页上的“停止 Qmail 进程”按钮时，将查询此字段以查看如何停止 `qmail-send`\
  \ 进程。如果选择了“仅杀死 qmail-send”（Just kill `qmail-send`），模块将杀死所有该名称的进程。如果您选择第二个选项并在文本字段中输入命令，则将运行该命令。\
  \ |\n\n两种最常见的 Qmail 配置是投递到用户家目录下的 Mailbox 文件或 Maildir 目录。默认情况下，模块设置为从 `~/Maildir`\
  \ 读取邮件，但如果您设置 Qmail 使用 `~/Mailbox` 文件，则必须将“邮箱箱格式”字段更改为单文件。\n\n### 38.13 总结\n\n本章解释了\
  \ Qmail 与 Sendmail 的区别，以及如何使用 Webmin 对其进行配置。阅读后，您应该熟悉邮件别名、虚拟域名、邮件路由规则和用户分配的创建与管理。您应该应该如何读取用户的电子邮件以及管理邮件队列。\n\
  \n## 第 39 章：分析日志文件\n\n本章介绍了如何使用 Webalizer 软件包从 Web 或代理服务器日志文件中创建报告。\n\n### 39.1\
  \ Webalizer 日志分析模块\n\nWebalizer 是一个免费提供的程序，用于分析并生成 Apache、Squid 和 WU-FTPd 日志文件的报告。如果您运行网站并想查看哪些页面访问量最多、流量最大的时间段，或者流量来自哪些国家，Webalizer\
  \ 是您需要使用的工具。如果您管理 Squid 代理服务器并想查看客户端最常访问哪些网站以及代理何时最频繁地使用，它也可以生成显示此类信息的报告。\n\n与 Webmin\
  \ 可以配置的许多其他服务器不同，Webalizer 相对简单。当运行 `webalizer` 命令时，它会读取日志文件并根据日志中的记录生成 HTML 页面和图像。它还可以从历史文件中读取之前运行收集的统计数据，因此报告可以包含不再于日志文件中的数据。随后，将使用最新报告的信息更新同一个历史文件，以供后续处理使用。这允许系统管理员在文件汇总后安全地删除原始日志文件。\n\
  \n默认情况下，Webalizer 使用全局配置文件 `/etc/webalizer.conf`，该文件指定了要生成的表格和图表类型以及要使用的标题。在托管多个虚拟服务器的系统上，通常存在多个配置文件，以便为不同的网站设置报告选项。遗憾的是，没有办法同时结合全局和每个日志配置文件的两个选项，在生成报告时只能使用其中一种。\n\
  \n由于日志文件总会追加新请求，Webalizer 通常由 `Cron` 等程序按计划运行。它没有自己的服务器进程或守护进程，因此依赖调度器每隔一两天调用它一次，以重新处理每个日志文件并重新生成每个报告。\n\
  \n由于其相对简单性，Webalizer 在所有变体 UNIX 上行为完全相同。这意味着 Webmin 模块的功能和布局也是相同的，尽管必须安装并运行“计划 Cron\
  \ 任务”模块，计划报告功能才能工作。\n\nWebmin 的 Webalizer 模块图标可以在“服务器”（Servers）类别中找到。当您第一次点击它时，将显示\
  \ Apache 或 Squid 配置为使用的所有日志文件列表，如图 39.1 所示。通过分析这些服务器的配置，模块通常可以计算出系统中所有可以分析的日志所在的位置。然而，您也可以轻松为模块添加额外的日志文件进行报告。\n\
  \n##### 图 39.1. Webalizer 模块主页。\n\n![](img/39fig01.jpg)\n\n如果模块检测到系统实际上未安装 Webalizer，主页将显示错误消息。如果发生这种情况，您需要从\
  \ Linux 发行版光盘或程序网站 [www.webalizer.org](http://www.webalizer.org/default.htm) 安装它。许多\
  \ Linux 版本都标准包含 Webalizer 软件包，您可以使用“软件包”模块（第 12 章介绍）进行安装。\n\n如果您计划使用该模块分析多个日志文件，确保正确设置全局\
  \ Webalizer 配置以支持这一点至关重要。某些 Linux 发行版（如 Red Hat）带的版本错误地对存储之前处理运行信息的历史文件和缓存文件使用了绝对路径。要修复此，在为任何日志文件设置选项之前，请按照以下步骤操作：\n\
  \n1. 在模块主页上，点击底部的“编辑全局选项”（Edit Global Options）按钮。这将带您进入编辑适用于所有日志文件选项的表单。\n\n\n\n\
  \n\n在 Webalizer 历史文件（history file）字段中，请确保选择了第二个单选按钮，并且文本框中显示 `webalizer.hist`。如果显示了类似\
  \ `/var/stats/webalizer.hist` 的绝对路径，请将其更改。\n\n同样，确保 Webalizer 增量文件（incremental file）字段被设置为\
  \ `webalizer.current` 而不是某个完整路径。\n\n如果你愿意，Webbalizer DNS 缓存文件（DNS cache file）可以保持设置为绝对路径，以便在不同报告之间共享\
  \ DNS 信息。\n\n点击页面底部的保存（Save）按钮以记录新设置。\n\n### 39.2 编辑报告选项\n\n在从日志文件生成报告之前，你必须设置某些选项，例如输出目录、运行报告的\
  \ UNIX 用户以及报告布局设置。假设模块已自动识别日志文件并显示在主页上，你可以按照以下步骤设置这些选项：\n\n在模块的主页上，点击你想要生成报告的 Web\
  \ 服务器日志文件的名称。将显示列出该文件当前设置的页面，如图 39.2 所示。\n\n##### 图 39.2. 日志文件选项页面。\n\n![](img/39fig02.jpg)\n\
  \n“报告中的所有日志”（All log files in report）字段准确显示了 Webmin 和 Webalizer 创建任何报告时将使用哪些文件。由于许多系统配置为定期移动、截断、压缩并删除\
  \ Apache 和 Squid 日志文件（通常使用 `logrotate` 等程序），模块将包含同一目录下所有与主日志文件具有相同开头的文件。例如，如果你正在对\
  \ `/var/log/httpd/access_log` 进行报告，那么 `/var/log/httpd` 中的 `access_log.0.gz`、`access_log.1.gz`\
  \ 等文件也会在此字段中显示。\n\n在“写入报告目录”（Write report to directory）字段中，输入创建报告 HTML 页面的目录。该目录必须已经存在，并且通常位于网站的文档根目录下，例如\
  \ `/home/example.com/stats`。它必须由下一个字段中指定的用户拥有或可写。确保该目录没有用于其他任何用途，因为 Webalizer 将创建一个\
  \ `index.html` 文件和其他 HTML 页面，这可能会覆盖其中已包含的任何内容。\n\n在“以用户运行 webalizer”（Run webalizer\
  \ as user）字段中，输入生成的报告文件应拥有的 UNIX 用户名称。这应该是拥有网站 HTML 文件的用户，以便他在必要时可以编辑或移动它们。如果报告仅供你个人使用，你也可以直接输入\
  \ `root`。\n\n由于模块运行 Webalizer 的方式，你指定的用户不需要对日志文件具有读取权限。但是，他必须能够向报告目录写入内容！\n\n将“始终重新处理日志文件？”（Always\
  \ re-process log files?）字段设置为 No（否），这样 Webalizer 就可以利用以前报告运行留的缓存信息。将其设置为 Yes 将导致在每次运行之前丢弃所有缓存和之前的统计数据，从而重新处理整个日志文件。这意味着日志文件中不再存在的任何数据将不会包含在报告中。\n\
  \n如果你想跳过 Webalizer 对旧统计数据的缓存，选择 Yes 是最有用的，因为如果日志文件自上次运行以来已完全更改，这些统计数据可能是错误的。\n\n\
  在“报告选项”（Report options）字段中，选择“自定义选项”（Custom options），让模块为此日志复制全局 Webalizer 配置文件，以便你稍后定义仅适用于此报告的选项。如果你的系统中只有一个网站，或者不在意为不同的虚拟服务器自定义报告，你可以选择“使用全局选项”（Use\
  \ global options）单选按钮。如果是这样，可以忽略第 9 到 19 步。\n\n该字段的最后一个选项“其他配置文件”（Other config file）允许你指定一个现有的\
  \ Webalizer 配置文件用于生成报告时。如果你以前在此日志文件上使用过该程序并已经对其自定义了设置，这将非常有用。\n\n目前请将“计划报告生成”（Scheduled\
  \ report generation）设置为“禁用”（Disabled）。第 39.4 节“按计划报告”解释了如何启用它。\n\n点击页面底部的保存（Save）按钮。只要你的输入没有错误，你将返回模块的主页。\n\
  \n如果在第 6 步中选择了“自定义选项”，再次点击日志文件名，然后点击页面底部的“编辑选项”（Edit Options）按钮。这将显示图 39.3 所示的选项。\n\
  \n##### 图 39.3. 日志选项页面。\n\n![](img/39fig03.jpg)\n\n在“网站主机名”（Website hostname）字段中，选择第二个单选按钮并在文本框中输入你的网站名称，例如\
  \ `www.example.com`。\n\n要自定义 Webalizer 考虑的文件类型，请编辑“要报告的文件类型”（File types to report\
  \ on）。其他类型（如图像或音频）不计入报告统计。\n\n在“要显示的图表”（Graphs and tables to display）部分，取消勾选你不想包含在报告中的内容。\n\
  \n在“表格行和可见性”（Table rows and visibility）部分中，你可以更改每个出现表格的大小，或通过选择 None（无）将其完全移除。\n\
  \n要开启报告中列出所有访问你网站的客户端、访问的 URL 等额外页面，请勾选“生成列出所有页面”（Generate pages listing all）部分中相应的复选框。否则，报告中将仅包含前\
  \ 20 个表格。\n\n最后，点击页面底部的保存（Save）按钮。从现在生成的报告将使用这些选项。\n\n在“目录”（Directory）字段中，这些通常可以保持不变，只要它们被设置为相对路径。本章的引言详细解释了为什么这是必要的。\n\
  \nWebbalizer 通常将日志中的时间转换为你的系统本地时区。要强制使用 GMT，请将“报告时间是否为 GMT?”（Report times in GMT?）字段更改为\
  \ Yes。除非不同时区的人正在查看报告，否则你应该将其留在 No。\n\n### 39.3 生成并查看报告\n\n一旦你设置了报告选项，实际生成报告就很简单。只需按照以下步骤操作：\n\
  \n在主页上，点击正在生成报告的日志文件名称。\n\n点击表单底部的“生成报告”（Generate Report）按钮。将显示一个显示 Webalizer 在每个日志文件上运行输出的页面，你可以查看发生的任何错误。第一次处理大型日志文件时这可能需要很长时间（也许几小时），因为必须对文件中的每个客户端\
  \ IP 地址进行反向查找。幸运的是，产生的实际 CPU 和网络负载是极小的。\n\n如果一切顺利，报告的 HTML 将在目标目录中创建。要查看它，点击输出下方的“查看完成的报告”（View\
  \ completed report）链接。\n\n\n\n报告的第一页显示了网站每月收到的访问量图表，下方有指向包含每个月份详情页面的链接。每个月份页面都显示了该网站按天、小时、客户端、页面和国家划分的访问量表格和图表；如果日志文件中包含了这些信息，还可能显示按用户、浏览器和引用来源划分的访问量。\n\
  \n您可以通过在模块主页点击日志文件 `Report` 列中的 `View` 链接，或者点击日志文件选项表单上的 `View Report` 按钮，直接查看同一份报告。\n\
  \n### 39.4 定时报告\n\n您不需要手动从日志文件中生成报告，而是可以使用 Webalizer Logfile Analysis 模块设置一个 `Cron\
  \ job`，让它能够定期运行 `Webfiler`。根据日志文件的大小，报告通常应每隔一或两天刷新一次。由于某些大型日志需要较长时间才能处理，刷新频率过高（例如每小时一次）可能会导致在同一个日志文件上同时运行多个\
  \ `Webalizer` 进程，从而损坏生成的报告。\n\n在设置定时报告之前，通常先在 Webmin 内部为日志文件生成一次报告是一个好好主意，这样您可以确认它是否真的在工作。完成后，按照以下步骤设置定时报告：\n\
  \n1. 在模块主页，点击日志文件的名称。这将带您进入图 39.2 所示的选项表。\n2. 将 `Scheduled report generation` 字段更改为\
  \ `Enabled`，并在下方选择时间。\n3. 从 `Minutes`、`Hours`、`Days`、`Months` 和 `Weekdays` 列表中选择需要重新处理日志文件的时间和日期。对于每一项，您可以选择\
  \ `All` 以便每分钟、每小时或任何设定的时间生成报告；您也可以选择 `Selected` 让 `Webalizer` 仅在列表所选的时间或日期运行。要选择多个项目，请在按住\
  \ `Control` 或 `Shift` 键的同时进行点击。您也可以通过 `Control-click` 取消已选条目。\n4. 默认情况下，日志将在每天午夜进行处理。如果您有多个定时生成的报告，请尝试错开它们的运行时间，以免它们在同一时间运行。例如，在您的第二个报告中，将小时选择为\
  \ `1` 而不是 `0`，依此类推。\n5. 点击 `Save` 按钮，让 Webmin 为报告创建一个 `Cron job`。您可以在 `Scheduled\
  \ Cron Jobs` 模块（见第 10 章）中看到它，但您应该在此处编辑日期和时间。\n6. 要关闭日志文件的定期报告生成，将 `Scheduled report\
  \ generation` 字段设置为 `Disabled`。`Cron job` 将被删除，但其设置的运行时间和日期会被记录，以便您可以轻松重新启用。\n\n\
  ### 39.5 添加另一个日志文件\n\n尽管该模块尝试通过读取 Apache 和 Squid 配置来自动识别系统上的所有日志文件，但仍可能会漏掉某些文件。这种情况可能发生在：Apache\
  \ Web 服务器或 Squid 代理服务器模块（分别见第 29 章和第 44 章）未正确配置；您的系统中安装了多个版本的 Apache；或者 Web 服务器被配置为将日志记录到过滤程序而非普通文件。\n\
  \n如果您想从 FTP 服务器日志文件生成报告，则绝对需要将该文件添加到模块，因为它不会自动检测 `WU-FTPd` 日志。您也可以添加来自其他 Web 服务器的日志，例如\
  \ Zeuz、`TUX`、`Netscape` 或 `NSCA`，假设它们使用与 Apache 相同的标准 `CLF` 格式。甚至可以为 Webmin 和 Usermin\
  \ 创建的日志创建报告，它们分别位于 `/var/webmin/miniserv.log` 和 `/var/usermin/miniserv.log`。\n\n\
  手动添加日志文件报告的步骤如下：\n\n1. 在模块主页，点击现有日志表格上方或下方的 `Add a new log file for analysis` 链接。\n\
  2. 在 `Base logfile path` 字段中输入日志文件的完整路径，例如 `/usr/local/apache/var/foo.com.log`。如果同一目录下存在其他以\
  \ `foo.com.log` 开头的日志文件，它们也将包含在报告中。\n3. 从 `Log file type` 菜单中选择：Web 服务器生成的 `CLF`\
  \ 格式文件选择 `Apache`；来自 `Squid` 代理服务器的日志选择 `Squid`；传输日志选择 `FTP`。\n4. 手动添加的日志文件与模块检测到的日志文件区别在于列表底部有一个\
  \ `Delete` 按钮。点击它可以从列表中移除该日志，但不会触动文件本身。\n\n### 39.6 编辑全局选项\n\nWebalizer 有一个主配置文件\
  \ `/etc/webalizer.conf`，如果 `Report options` 字段设置为 `Use global options`，模块将使用该文件。当您为报告选择\
  \ `Custom` 时，该文件也会被复制。\n\n如果系统中只有一个需要分析的日志文件，那么使用全局 `conf` 文件比专门为它创建一个要有意义得多。如果您计划为多个日志文件设置报告，应该先编辑全局配置。按照以下步骤进行编辑：\n\
  \n1. 在模块主页，点击 `Edit Global Options` 图标。您的浏览器将显示一个与图 39.3 类似的选项表单。\n2. 遵循第 39.2 节“Report\
  \ Options”中的步骤 11 至 19 来配置所有报告的外观。此表单上的字段含义与报告选项页面上的完全相同。\n3. 点击 `Save` 按钮更新配置文件。\n\
  \n如果您正在生成多个报告，为每个报告单独设置选项更为合理。这样您可以为每个报告设置不同的 Web 主机名，以确保每个报告的标题和链接都是正确的。\n\n###\
  \ 39.7 模块访问控制\n\n如第 52 章所述，您可以创建一个 Webmin 用户或组，使其仅拥有大多数模块中部分功能的访问权限。在 Webalizer\
  \ 模块中，您可以授予用户编辑系统中部分日志选项并从其生成报告的权限。如果您的系统托管了多个 Apache 虚拟服务器，且每个服务器由不同的人拥有，这将非常有用。只要每个服务器都有自己独立的日志文件，您就可以赋予\
  \ Webmin 用户管理虚拟服务器及其日志报告的权限。\n\n一旦用户获得了模块的访问权限，您可以使用以下步骤限制其仅访问系统的某些日志：\n\n1. 在 Webmin\
  \ 用户模块中，点击用户名旁边的 `Webalizer Logfile Analysis`。这将打开模块访问控制表单。\n2. 将 `Can edit module\
  \ configuration?` 字段更改为 `No`，这样他就无法修改 `Webalizer` 的路径或其全局配置文件。\n3. 将 `Can only view\
  \ existing reports?` 设置为 `No`，以便用户可以编辑其拥有的日志报告选项。\n4. 将 `Can edit global webalizer\
  \ options?` 设置为 `No`，防止用户编辑可能适用于他人日志的选项。\n5. 在 `Run Webalizer as user` 字段中，选择最后一个单选按钮，并输入该\
  \ Webmin 用户通常登录时使用的 UNIX 用户名。这将阻止他设置以 `root` 身份生成的报告，因为可能会导致严重的安全风险，允许系统文件和其他人的文件被覆盖。\n\
  \n\n\n\n在**仅允许查看和编辑字段下的日志的报告**中，请输入日志文件的完整路径（例如 `/var/log/httpd/example.com.log`）或包含日志文件的目录（例如\
  \ `/home/example.com/logs*`）。该模块将隐藏该目录之外任何自动发现的日志，使用户无法为他人的网站设置报告。\n\n点击**保存**（Save）按钮以激活新的限制。\n\
  \n一旦用户以这种方式受到限制，他将能够使用该模块为第 6 步中设置的目录中的日志文件设置报告。报告将仅以第 5 步指定的 UNIX 用户身份生成，这可以防止\
  \ Webmin 用户覆盖其在 shell 提示符下通常无法覆盖的文件。这使得模块对于不可信的人员来说非常安全，尽管恶意用户可能会设置一个运行极其频繁并消耗大量\
  \ CPU 时间的报告定时计划任务（Cron job）。\n\n你可以通过模块配置表单设置模块用于 Webalizer 程序及其全局配置文件的路径，该表单可以通过主页上的标准“模块配置”（Module\
  \ Config）链接访问。点击后，它将显示一个包含表 39.1 所示字段的表单。\n\n##### 表 39.1 模块配置选项\n\n| webalizer\
  \ 命令的路径 | 此字段必须包含 `webalizer` 可执行文件的完整路径；如果它位于 Webmin 的程序路径目录之一（通常如此），则只需输入 `webalizer`。\
  \ |\n| :--- | :--- |\n| webalizer 配置文件的路径 | 此字段必须包含全局 Webalizer 配置文件的完整路径，通常为 `/etc/webalizer.conf`。为特定日志报告创建的附加文件始终存储在\
  \ `/etc/wemin/webalizer` 目录中。 |\n| 示例 webalizer 配置文件 | 如果全局配置文件不存在，模块将从此字段指定的路径复制文件。这用于某些\
  \ Linux 发行版，这些发行版在其他目录中包含示例文件，但没有 `/etc/webalizer.conf`。一旦模块运行，将永远不再使用该文件，因此更改此字段将没有任何影响。\
  \ |\n| 自动包含日志文件 | 此字段中的复选框控制模块从哪些服务器自动检索日志文件。默认情况下，Apache 和 Squid 都被选中，但如果你仅在其中一个（或都不）服务器上生成报告，你可能希望取消选择它们，以免主页被你你不关心的日志文件填满。\
  \ |\n\n### 39.8 总结\n\n本章解释了如何使用 Webalizer 根据系统上的 Web、FTP 和代理服务器日志文件创建包含图表和表格的报告。它还解释了如何设置计划报告生成、如何查看报告，以及如何限制\
  \ Webmin 用户使其仅能为选定的日志文件配置报告。\n\n## 第 40 章 ProFTPD 服务器\n\n本章解释了 FTP 协议、如何设置 ProFTPD\
  \ 服务器以及如何为各种目的对其进行配置。\n\n### 40.1 FTP 和 ProFTPD 简介\n\nFTP 代表文件传输协议（File Transfer\
  \ Protocol），它与 telnet 和 SMTP 一起，是互联网上仍在使用的最老的协议之一。FTP 设计用于允许客户端程序在远程服务器上读取、写入和删除文件，无论操作系统如何。存在许多不同的\
  \ FTP 程序，从基础的 `ftp` 命令到像 Internet 这样的浏览器。每个操作系统都至少有一个，且几乎所有的系统都包含某种形式的标准程序。\n\n\
  尽管所有版本都带有一个 FTP 服务器，但提供的服务器通常非常基础且缺乏功能。后者在虚拟主机、目录限制和将用户锁定在其主目录方面不如 ProFTPD 强大和可行。不过，这将在第\
  \ 41 章中介绍，因此如果你已经安装了一些 FTP 服务器且不想麻烦，请阅读该章节。\n\nProFTPD 通常使用一个位于 `/etc/proftpd.conf`\
  \ 的单一配置文件。该文件由多个指令组成，每个指令通常占据一行，并有一个名称和一个值。每个指令设置一个可配置的选项，例如文件名或欢迎消息的路径。还有特殊的容器指令，用于分组仅适用于单个虚拟服务器或目录的其他指令，这些指令跨越多行。\n\
  \n### 40.2 ProFTPD 服务器模块\n\n在 Webmin 的主菜单的“服务器”（Servers）选项卡下可以找到 ProFTPD 服务器模块图标。点击它时，模块的主页将如\
  \ 40.1 所示显示（前提是你确实安装了该服务器）。如果主页显示类似“在你的系统上找不到 ProFTPD 服务器 `/usr/sbin/proftpd`”的错误消息，那么服务器可能没有安装，因此无法使用该模块。由于由于如此，大多数\
  \ Linux 发行版在其 CD 或网站上都包含 ProFTPD 软件包，请使用“软件包”（Software Packages）模块（第 12 章介绍）进行安装。如果不存在软件包，请从\
  \ [www.proftpd.org](http://www.proftpd.org/default.htm) 下载源代码、编译并安装。如果你已经安装了其他 FTP\
  \ 服务器，应该先将其删除，以防两个程序冲突。\n\n主页可能显示的另一个错误是“程序 `/usr/sbin/ftpd` 似乎不是 ProFTPD 服务器”。当\
  \ Webmin 检测到安装了其他 FTP 服务器时就会发生这种情况；如果是这样，你需要删除它并安装 ProFTPD。\n\n\n\n\n\nProFTPD 可以以两种不同的模式运行：一种作为监听\
  \ FTP 连接的独立守护进程运行，另一种是从像如 `inetd` 或 `xinetd` 这样的超级服务器运行。前者接受连接的速度更快，但代价是始终运行的进程会消耗更多内存。后者更适合不预期接收大量\
  \ FTP 流量的系统，因为 ProFTPD 程序只有在需要它时才会运行。\n\n由于独立模式更容易设置，而且大多数系统的内存都非常充裕，本章假设您将在该模式下运行它。要启动\
  \ ProFTPD 服务器进程，请遵循以下步骤：\n\n在“Internet 服务与协议”（Internet Services and Protocols）模块（见第\
  \ 15 节介绍）中，确保任何名为 `ftp` 的现有服务已禁用 `Program`（程序）或选择了 `No program assigned`（未分配程序）。这将确保\
  \ `inetd` 不运行任何 FTP 服务。如果您禁用了某个服务，请务必点击该模块主页上的 `Apply Changes`（应用更改）按钮以激活更改。\n\n\
  在“扩展 Internet 服务”（Extended Internet Services）模块中，确保任何名称中包含 `ftp` 的服务（如 `wu-ftpd`、`proftpd`\
  \ 或 `vsftpd`）其 `Service enabled?`（启用服务？）字段均设置为 `No`。同样，您需要点击该模块的 `Apply Changes`\
  \ 按钮来激活任何更改。\n\n回到 ProFTPD 服务器模块，点击 `Networking Options`（网络选项）图标。\n\n从 `Server type`（服务器类型）菜单中选择\
  \ `Standalone daemon`独立守护进程）。\n\n点击页面底部的 `Save`（保存）按钮。\n\n回到模块主页，底部会出现一个标记为 `Start\
  \ Server（启动服务器）的按钮。点击它启动 ProFTPD 守护进程。\n\n如果您希望在系统启动时重启守护进程，请使用 `Bootup and Shutdown（启动与关机）模块创建一个名为\
  \ `proftpd` 的动作，该动作将在启动时运行命令 `/usr/sbin/proftpd`。实际路径可能是 `/usr/local/sbin/proftpd`\
  \ 或 `/usr/sbin/in.proftpd`，取决于您运行的是哪种 Linux 发行版，或者您是自行编译安装的程序而不是使用软件包。此外，某些 ProFTPD\
  \ 软件包可能已经包含了这样的启动脚本，您只需将其启用即可。\n\n一旦 ProFTPD 启动，您可以使用命令行 UNIX FTP 客户端连接到您自己的系统进行测试。只需运行\
  \ `ftp localhost`，并确保您可以以 root 以外的用户身份登录。您可以通过检查 `ftp` 命令在提示用户名之前显示的版本号来验证服务器确实是\
  \ ProFTPD，除非它被默认配置为不显示版本信息。\n\n### 40.3 从 inetd 或 xinetd 运行 ProFTPD\n\n设置 ProFTPD\
  \ 从超级服务器运行也并不困难，如果您的系统内存不足或几乎不接收 FTP 连接，这可能是一个好主意。在执行此操作之前，您必须杀死任何现有的 `proftpd`\
  \ 服务器进程（可以通过 `Running Processes（运行进程）` 模块轻松完成），并禁用或删除任何在启动时启动它的动作。\n\n如果您的系统使用更优的\
  \ `xinetd`，请按照以下指令设置 FTP 服务。由于许多软件包包含一个用于服务器的 `/etc/xinetd.d` 配置文件，下面解释的某些字段可能已经正确填写。\n\
  \n进入 Webmin 的 Networking（网络）类别并点击 `Extended Internet Services（扩展 Internet 服务）`图标。如果不存在，则未安装\
  \ `xinetd`，您将需要使用 `inetd` 设置服务器。\n\n在模块主页上，检查是否存在名为 `ftp` 或 `proftp` 的现有服务。如果存在，点击它；否则，按照表格上方或下方的\
  \ `Create a new internet service（创建新的 Internet 服务）`链接。\n\n在 `Service name（服务名称）`字段中输入\
  \ `ftp`（除非已填写）。\n\n确保 `Service enabled?（启用服务？）`字段中选择了 `Yes`。\n\n将 `Bind to address（绑定地址）`字段设置为\
  \ `All`，并将 `Port number（端口号）`设置为 `Standard（标准）`或 `21`。\n\n从 `Socket type（套接字类型）`菜单中选择\
  \ `Stream`，从 `Protocol（协议）`列表中选择 `Default（默认）`或 `TCP`。\n\n在 `Service handled by（服务处理）`字段中，选择`Server\
  \ program（服务器程序）`选项并在相邻的文本框中输入 `proftpd` 可执行文件的路径（例如 `/usr/sbin/proftpd`）。路径取决于您是从软件包安装的程序还是从源码编译的。\n\
  \n在 `Run as user（以用户运行）`字段中输入 `root`。\n\n在 `Wait until complete?（等待完成？）`字段中选择 `No`。\n\
  \n将所有其他字段保持默认设置，并点击表单底部的 `Save（保存）`或`Create（创建）`按钮。\n\n回到模块主页，点击服务列表下方的 `Apply Changes（应用更改）`按钮。\n\
  \n改用 `Internet Services and Protocols（Internet 服务与协议）`模块为 ProFTPD 设置 `inetd` 服务，请遵循以下步骤：\n\
  \n进入 Webmin 的 Networking（网络）类别并点击 `Internet Services and Protocols（Internet 服务与协议）`图标。如果不存在，您的系统可能正在使用\
  \ `xinetd`。请参考上段的步骤了解如何配置它。\n\n在模块主页上，点击`Internet Services（Internet 服务）`表格中的 `ftp`。如果可见，在`Edit\
  \ service（编辑服务）`字段中输入 `ftp` 并点击按钮。无论哪种方式，都会显示编辑 FTP 服务的页面。\n\n在 `Server Program（服务器程序）`部分，选择`Program\
  \ enabled（启用程序）`。\n\n在 `Program（程序）`字段中，选择`Command（命令）`选项并在相邻字段中输入 ProFTPD 服务器可执行文件的完整路径，例如\
  \ `/usr/sbin/proftpd`。在`Args（参数）`字段中仅输入 `proftpd`。路径取决于您是从软件包安装的程序还是从源码编译的。\n\n\
  将`Wait mode（等待模式）`设置为`Don't wait（不等待）`，并在`Execute as User（以用户执行）`字段中输入 `root`。其他所有保持不变。\n\
  \n点击`Save（保存）`按钮，然后在模块主页点击`Apply Changes（应用更改）`。\n\n一旦 ProFTPD 设置为从 `inetd` 或 `xinetd`\
  \ 运行，您可以使用命令行 UNIX FTP 客户端连接到您自己的系统进行测试。只需运行 `ftp localhost`，并确保您可以以 root 以外的用户身份登录。如果测试连接出现`Service\
  \ not available（服务不可用）`等错误，最可能的原因是 ProFTPD 被配置为独立服务器运行。可以通过遵循以下步骤轻松修复：\n\n进入 ProFTPD\
  \ 服务器模块并点击主页上的`Networking Options（网络选项）`图标。\n\n在出现的表单的`Server type（服务器类型）`菜单中选择`Run\
  \ from Inetd（从 Inetd 运行）`。\n\n点击页面底部的`Save（保存）`按钮。\n\n本章其余部分的无论 ProFTPD 以何种模式运行都将有效。唯一的区别是主页上不会出现`Apply\
  \ Changes（应用更改）`按钮，因为不需要为了让更改生效而重启服务器进程。相反，更改将应用于下一个启动的 FTP 会话。\n\n### 40.4 使用 ProFTPD\
  \ 服务器模块\n\nProFTPD 使用的配置文件格式与 Apache 非常相似，因此该模块的用户界面在许多方面与 Apache 配置模块相同。配置的最高层是影响整个服务器的全局设置。它们下方是虚拟服务器，然后是匿名\
  \ FTP 选项、按目录选项以及仅适用于某些 FTP 命令的选项。图 40.2 所示了这种层级结构。\n\n##### 图 40.2. ProFTPD 配置层级结构。\n\
  \n![](img/40fig02.gif)\n\n适用于每个连接或 FTP 命令的选项由其连接的虚拟服务器、登录类型、请求文件所在的目录以及使用的特定 FTP\
  \ 命令决定。层级结构中较低对象的设置会覆盖上层的设置，因此您可以阻止向服务器上传，但允许向特定目录上传。同样，更特定目录（如 `/usr/local/upload`）的选项会覆盖其父目录（如\
  \ `/usr/local`）的选项。\n\n\n\n\n\n一种特殊情况是默认服务器（default server），它为未连接到任何特定虚拟服务器的客户端定义设置。与\
  \ Apache 不同，在默认服务器设置的选项不会影响虚拟服务器。相反，如果你想指定影响所有虚拟服务器的设置，则必须将其放在 `ProFTPD` 配置中特殊的全局部分。这同样适用于目录和特定\
  \ FTP 命令的选项。\n\n该模块都有一个页面，用于编辑树中每个对象的选项，该页面包含指向树深处对象的图标。例如，在虚拟服务器选项页面上，有适用于该服务器的各种类别选项（如日志、用户和组）的图标，以及在虚拟服务器内具有自身选项的任何目录或\
  \ FTP 命令的图标。此外，还有一个专门针对匿名 FTP 连接的选项的图标。\n\n在层级结构中的每个页面上，都有用于在其下方添加对象（如目录或 FTP 命令组）的表单，以及一个用于更改或删除当前对象的\
  \ `Configure` 图标。每个页面还包含一个 `Edit Directives` 图标，允许你查看并手动更改该目录、虚拟服务器或该页面代表的任何内容的\
  \ `ProFTPD` 指令。例外是默认服务器页面，它没有此类图标，因为它无法被更改或删除，而且其指令无法与配置文件的其余部分分离。\n\n初看，该模块中的某些表单可能看起来望而却畏，因为它们显示了与对象相关的某个类别中几乎所有可用的\
  \ `ProFTPD` 选项的字段。然而，这些选项中的许多非常专业，在大多数情况下可以被忽略。本章各个章节的步骤说明了为了实现特定结果你需要修改哪些选项。其他选项可以留之不管，因为它们的默认值通常已经足够了。\n\
  \n由于发布的每个 `ProFTPD` 新版本都支持新的指令，因此 `ProFTPD Server` 模块可以检测你正在运行的版本，并调整其用户界面，仅显示适用于你版本的有效字段。这意味着表单在所有系统上的外观可能不完全相同，如果你运行的是旧版本，本章指令中的某些部分可能对你的\
  \ FTP 服务器无效。\n\n### 40.5 创建虚拟服务器\n\n`ProFTPD` 最实用的功能可能是它对虚拟 FTP 服务器的支持。这允许你定义一组完全不同的选项，适用于连接到特定\
  \ IP 地址的客户端。在大多数方面，它们与 Apache 的基于 IP 的虚拟服务器类似，大多数网站管理员应该对它们熟悉。\n\n虚拟服务器只有在你的系统拥有多个\
  \ IP 地址时才真正有用。通常，这是通过第 16 章（网络配置）介绍的方法向你连接互联网的网络接口添加额外的虚拟 IP 地址来实现的。按照惯，任何额外的 IP\
  \ 地址必须正确路由到你的系统。如果你连接到 ISP 且仅分配了一个静态地址，你不能简单地添加虚拟接口并期望它们工作。与 Apache 不同，`ProFTPD`\
  \ 不支持基于名称虚拟服务器，因为 FTP 协议中没有提供此类规定。客户端永远不会告诉服务器它们正在连接的主机，因此 FTP 服务器只能使用接收连接的 IP 地址来确定客户端想要哪个虚拟服务器。\n\
  \n当你的系统接收到 FTP 连接时，`ProFTPD` 将将连接地址与所有已配置的虚拟服务器地址进行比较。第一个匹配的定义了适用于该连接的选项。如果没有找到匹配项，则使用默认服务器。\n\
  \n要向你的系统添加新的虚拟 FTP 服务器，请遵循以下步骤：\n\n1. 在 `Network Configuration` 模块中，为你的系统外部网络接口添加新的虚拟\
  \ IP 地址。确保它会在启动时激活并且现在已处于激活状态。\n2. 回到 `ProFTPD Server` 模块，滚动到主页面底部的 `Create virtual\
  \ server` 表单。\n3. 在 `Address` 字段中，输入刚刚分配的 IP 地址。它不应被任何已定义的其他虚拟服务器使用。\n4. 将 `Port`\
  \ 字段设置为 `Default`。\n5. 在 `Server name` 字段中，选择第二个单选按钮并为此服务器输入一个显示给连接客户端的名称。例如，你可以输入\
  \ `Example Corporation's FTP server`。如果选择了 `Default`，将看到类似 `ProFTPD 1.2.2rc2 Server`\
  \ 的消息。\n6. 点击 `Create` 按钮添加服务器。一旦创建完成，你将进入新服务器的选项页面。\n7. 返回模块主页面，并点击 `Apply Changes`\
  \ 按钮使其激活。\n\n一旦创建了虚拟服务器，你可以通过点击主页面上的它的图标，然后点击某个类别图标之一来设置适用于它的选项。其中某些将在本章稍后的部分进行详细介绍。你也可以通过点击\
  \ `Configure Virtual Server` 图标、编辑表单上的字段（其含义与创建表单上的字段相同）并点击 `Save` 来更改虚拟服务器的属性。或者你也可以通过点击配置表单上的\
  \ `Delete virtual server` 按钮将其完全删除。\n\n### 40.6 设置匿名 FTP\n\n在默认配置下，`ProFTPD` 通常允许所有\
  \ UNIX 用户使用其普通密码登录，并以他们通过 `telnet` 或 `SSH` 登录时相同的权限访问系统的所有文件。某些软件包也为默认服务器启用了匿名 FTP，以便任何人都可以以匿名用户身份连接并查看特定目录下的文件。要为新的虚拟服务器设置匿名\
  \ FTP、配置客户端权限并确定它们可以访问哪些目录，请遵循以下步骤：\n\n1. 在模块主页面上，点击你想配置匿名 FTP 的默认服务器或虚拟服务器图标。\n\
  2. 在虚拟服务器选项页面上，点击 `Anonymous FTP` 图标。如果这是为此服务器首次设置，将出现一个小表单用于输入匿名 FTP 设置。\n3. 在\
  \ `Limit to directory` 字段中，输入限制匿名客户端的目录，例如 `*/home/example.com/anonftp*`。\n4. 在\
  \ `Access files as user` 选项中，选择第二个单选按钮并输入一个无权限 UNIX 用户的用户，例如 `ftp` 或 `nobody`。客户端不仅被限制在所选目录中，而且只能访问具有该\
  \ UNIX 用户权限的文件。自然，你应该确保它实际上可以读取并列出其包含的目录和文件。该用户不能在 `ProFTPD` 的拒绝列表中，且不能有无效的 shell。请参阅第\
  \ 40.8 节“限制登录用户”以获取更多关于编辑此列表和允许任何 shell 用户的信息。\n5. 如果你满意于客户端使用上一个字段中设置的用户组权限，则将\
  \ `Access files as group` 字段设置为 `Default`。否则，选择第二个单选按钮并在其字段中输入组名。\n6. 点击 `Create`\
  \ 按钮设置初始匿名 FTP 配置。假设成功，浏览器将重定向到匿名 FTP 选项页面，该页面上有与匿名 FTP 连接相关的各种类别可配置选项的图标。\n7. 点击\
  \ `Save` 按钮返回匿名 FTP 选项页面。点击 `Authentication`，并在 `Username aliases` 表格的 `Login username`\
  \ 下输入 `anonymous`，在 `Real username` 下输入你在第 4 步中选择的用户名。这告诉 `ProFTPD`，以匿名身份登录的客户端应被授予该用户的权限。\n\
  \n\n\n\n\n在 FTP 命令字段中，输入 `WRITE` 并点击 Create（创建）按钮，开始定义适用于修改服务器上数据的 FTP 命令的选项。你将进入每条命令选项页面。\n\
  \n点击 Access Control（访问控制）图标，并在访问控制策略字段中选择 `Deny all clients`（拒绝所有客户端）。这将告诉 `ProFTPD`\
  \ 阻止匿名客户端上传、删除或重命名文件的尝试。\n\n点击 Save（保存）按钮。\n\n返回模块主页，并点击 Apply Changes（应用更改）。为了确保一切运行正常，请尝试以匿名用户身份登录虚拟服务器并下载一些文件。\n\
  \n如果您正在使用系统为不同的客户托管多个网页和 FTP 站点，可以为每个客户分配其自己的虚拟匿名服务器，以便通过 FTP 向人们提供文件。浏览器假设 `ftp://`\
  \ URL 需要匿名登录，并且大多数浏览器无法良好处理需要身份验证的 FTP 服务器。\n\n## 40.7 限制用户访问主目录\n\n默认情况下，以有效 UNIX\
  \ 用户（而非匿名）身份登录 `ProFTPD` 的客户端可以浏览系统的整个文件系统，就像他们通过 `SSH` 或 `telnet` 登录一样。对于一个拥有多个互不信任的用户且你希望防止他们查看彼此文件的系统来说，这并不总是理想的。尽管尽管可以使用\
  \ UNIX 权限来阻止用户列出彼此的目录，但如果你还运行着 Web 服务器并需要其 `httpd` 用户访问所有文件，这就会产生问题。\n\n幸运的是，`ProFTPD`\
  \ 可以轻松地将用户限制在其主目录或其他目录中。由于这仅适用于 FTP 连接，如果这些用户仍然可以通过 `telnet` 或 `SSH` 登录，那么它就相当没用。不过，通过给用户分配类似于\
  \ `/bin/false` 的 shell，可以很容易允许用户仅通过 FTP 连接。在虚拟主机服务器上，用户实际上只需要为他们的网站上传文件，完全不需要 UNIX\
  \ shell 访问。只需确保 `/bin/false` 或你选择的任何无功能 shell 都包含在 `/etc/shells` 文件中，这样 `ProFTPD`\
  \ 就不会拒绝用户的访问。\n\n要限制 FTP 客户端可以访问的目录，请遵循以下步骤：\n\n如果你希望限制仅适用于单个虚拟服务器，请点击模块主页上的该图标，然后在虚拟服务器选项页面上点击\
  \ `Files and Directories`（文件和目录）图标。然而，不建议这样做，因为这可能允许用户通过连接到另一个虚拟服务器来回避限制。相反，你应该直接点击主页\
  \ Global Configuration（全局配置）部分中的 `Files and Directories` 图标。在此定义的任何限制将适用于所有服务器。无论何种方式，都会出现配置服务器如何列出目录以及哪些目录可用的页面（如图\
  \ 40.3 所示）。\n\n### 图 40.3. 文件和目录表。\n\n![](img/40fig03.jpg)\n\n`Limit users to directories`（限制用户到目录）字段实际上是一个允许你每次输入一个目录限制的表格。它始终有一个空行，如果这是你创建的此类限制，它将只包含该内容。\n\
  \n在 `Directory`（目录）列中，如果你希望将用户限制在该处，请选择 `Home directory`（主目录）。你也可以选择第三个单选按钮并输入类似\
  \ `/home` 或 `/var/www` 的路径，将用户限制在该目录。也可以输入相对于用户主目录的路径，例如 `~/public_html`。\n\n在 `UNIX\
  \ groups`（UNIX 组）列中，选择 `Everyone`（所有人）使限制适用于所有用户，或者选择第二个单选按钮并输入组名，使其仅适用于该组的成员。可以通过逗号分隔组名来输入多个组，如\
  \ `users,staff`。\n\n点击 Save 按钮返回虚拟服务器选项页面。如果你想添加另一个限制（例如针对不同的组和目录），再次点击 `Files and\
  \ Directories` 并在表格中填入新的空行。\n\n完成后，返回模块主页并点击 Apply Changes 按钮使限制生效。\n\n从现在起，当受限用户连接时，他们将无法看到指定目录之外的文件，甚至无法查出他们被限制在哪个目录。与某些其他支持此类限制的\
  \ FTP 服务器不同，不需要将任何文件或库（如 `/bin/ls`）复制到目录，因为 `ProFTPD` 不依赖任何外部程序。\n\n## 40.8 限制登录用户\n\
  \n`ProFTPD` 不允许每个 UNIX 用户登录，即使他们拥有有效的用户名和密码。单独 `/etc/ftpusers` 文件列出了不允许身份验证的用户，这些用户通常包括如\
  \ `bin`、`daemon` 和 `uucp` 等系统账户。此外，还有一个单独的配置选项控制是否允许 `root` 用户登录。默认情况下是不允许的，因为 FTP\
  \ 协议发送的密码没有加密，所以允许 `root` 身份验证可能会带来重大的安全风险。\n\n`ProFTPD` 默认防止没有有效 shell 的用户登录。有效\
  \ shell 是列在 `/etc/shells` 文件中的 shell。此功能对于防止大量用户登录非常有用，例如那些应该只能连接到 POP3 服务器下载电子邮件的用户。但是，在需要时可以关闭此功能。\n\
  \n要编辑被拒绝的用户列表和其他登录限制，请遵循以下步骤：\n\n在模块主页上，点击 `Denied FTP Users`（被拒绝的 FTP 用户）图标。在出现的表单中有一个文本框列出了所有被阻止的\
  \ UNIX 用户。编辑它以添加或删除任何应该或不应该允许的用户，并点击 Save 按钮。\n\n要允许 `root` 用户连接，点击 `Authentication`（身份验证）图标并将\
  \ `Allow login by root?`（允许 root 登录吗？）字段改为 `Yes`。\n\n要允许未列出的 shell 用户登录，同样将 `Only\
  \ allow login by users with valid shell?`（仅允许具有有效 shell 的用户登录吗？）字段改为 `Yes`。\n\n\
  点击 Save 按钮返回主页，然后点击 Apply Changes 使新限制生效。\n\n允许 `root` 用户和具有无效 shell 用户登录的选项也可以在虚拟服务器选项页面\
  \ `Authentication` 图标下按虚拟服务器进行设置。但从安全角度来看，仅允许单个服务器的客户端登录通常没有意义，因为用户可以选择任何服务器进行连接。\n\
  \n## 40.9 设置目录列出选项\n\n通常情况下，当 FTP 客户端请求目录列表时，`ProFTPD` 将返回由 `ls l` 命令产生的格式的完整、准确的列表。有时这会泄露过多关于你系统的信息，例如用户和组名或符号链接的目标。隐藏某些对客户端不相关但由于其他原因必须保留在\
  \ FTP 可访问目录中的文件通常很有用。这种信息隐藏最好应用于匿名 FTP 用户，因为他们不应该能够发现任何关于你的系统中他们不需要了解的任何。\n\n要更改目录列表的格式，请遵循以下步骤：\n\
  \n在模块主页上，点击你想更改目录列表的默认服务器或虚拟服务器的图标，进入其选项页面。\n\n假设你只想更改匿名客户端的列出信息，点击 `Anonymous FTP`\
  \ 图标进入匿名 FTP 选项页面。否则，普通 UNIX 用户也会受到影响。\n\n点击 `Files and Directories` 图标调出一个与图 40.3\
  \ 类似的表单，用于设置各种列出选项。\n\n要隐藏某些特定组所有的文件，在 `Hide files owned by groups`（隐藏组所有的文件）字段中输入一个或多个用空格分隔的组。注意，除非\
  \ UNIX 权限或服务器配置阻止，否则以此方式隐藏的文件仍然可以下载、重命名或删除。\n\n\n\n\n同样，要隐藏由特定用户所有 own 文件，请在 `Hide\
  \ files owned by users` 字段中填入 UNIX 用户名列表。\n\n要隐藏匿名 FTP 用户无法读取的文件，请将 `Hide files\
  \ that cannot be accessed?` 字段更改为 `Yes`。\n\n要让 `ProFTPD` 在列表中将符号链接转换为目标文件的权限和大小，请将\
  \ `Show symbolic links?` 字段更改为 `Yes`。通常情况下，链接和目标名称都会显示，且显示的权限和所有权是链接本身的。然而，即使启用了此功能，链接目标也必须位于匿名\
  \ FTP 目录内。\n\n通常，目录列表包含文件的真实用户和组所有者。要更改此设置，请将 `Fake group in directory listings?`\
  \ 字段设置为 `Yes`，并输入 `group`。然后，从提供的框中选择 `ftp` 以强制将组所有者显示为 `ftp`，或者选择第三个单选按钮，将其显示为你在相邻文本框中输入的任何组。`Connected\
  \ group` 选项仅对非匿名客户端有意义，因为它会让文件看起来像是属于连接用户的主组。\n\n你还可以通过 `Fake user in directory\
  \ listings?` 字段更改文件的 UNIX 用户所有者。如果选择 `Connected user`，文件将看起来是归当前登录 FTP 服务器的用户所有。\n\
  \n默认情况下，`ProFTPD` 会在列表中显示真实的 UNIX 文件权限。若要强制显示伪造权限，请选择 `Fake permissions in directory\
  \ listings` 字段中的第二个选项，并输入类似于 `chmod` 命令使用的 `0644` 等八进制数。当然，这对客户端尝试下载或上传文件时实际应用的权限没有影响。\n\
  \n要在列表中隐藏如 `.login` 和 `.profile` 等点文件（如 `ls` 命令通常所做），请将 `Show files starting with\
  \ . in listings?` 字段设置为 `Yes`。\n\n最后，点击页面底部的 `Save` 按钮更新 `ProFTPD` 配置文件。\n\n返回模块主页并点击\
  \ `Apply Changes` 按钮使设置生效。\n\n除了隐藏某些文件（如步骤 4 和步骤 5 所示），你还可以防止客户端读取或写入这些文件。这可以使用第\
  \ 40.12 节“限制 FTP 命令的访问”中的 `Make hidden files inaccessible?` 字段来实现。\n\n### 40.10\
  \ 消息与 Readme 文件\n\n`ProFTPD` 可以配置为在客户端登录或进入特定目录时显示消息。这对于通知用户可能的镜像站点、服务器上各种常用文件的位置以及目录内容的详细信息非常有用。\n\
  \n要设置显示给客户端的的消息，请遵循以下步骤：\n\n如果你希望所有虚拟服务器使用这些消息，请点击模块主页上的 `Authentication` 图标。要为特定的虚拟服务器设置消息，请点击其图标，然后点击服务器选项页面上的\
  \ `Authentication`。无论哪种方式，都将显示相同的表单。\n\n也可以通过点击虚拟服务器页面上的 `Anonymous FTP` 图标然后点击\
  \ `Authentication`，仅为匿名客户端设置下方的大多数消息文件选项。自然地，你无法设置登录前消息，因为服务器在那个阶段不知道客户端是否为匿名用户。\n\
  \n在 `Pre-login message file` 字段中，输入文件的完整路径，该文件的内容将在客户端连接后立即被发送给他们。如果你完全不想使用任何消息文件，请选择\
  \ `None`。\n\n在 `Post-login message file` 字段中，输入文本文件的路径，该文件的内容将在客户端通过身份验证后发送给他们。如果客户端被限制在某个目录（因为它是匿名登录或强制执行了主目录限制），则该文件必须在该目录内并相对于该目录。如果文件名是相对的（如\
  \ `welcome.txt`），它将在客户端初始所在的目录中查找。\n\n要设置当客户端请求断开连接时发送的消息，请填充 `Logout message file`\
  \ 字段。同样，这必须相对于客户端受限制的任何目录并位于其下方。\n\n如果你强制执行了最大并发登录数的限制，可以通过填充 `Too many connections\
  \ message file` 字段来设置发送被该限制拦截的客户端的消息。你应该输入一个完整路径，该路径可以位于系统的任何地方。更多信息请参见第 40.14 节“限制并发登录”。\n\
  \n点击页面底部的 `Save` 按钮返回全局、虚拟服务器或匿名 FTP 选项页面。\n\n点击同一页面上的 `Files and Directories` 图标。\n\
  \n在 `Directory README filename` 字段中，输入一个如 `readme.txt` 的相对名称，它将在客户端进入的每个目录中进行搜索。如果这是客户端在此会话中第一次进入该目录（或者如果文件自上次以来发生了变化），其内容将发送给\
  \ FTP 客户端。\n\n要让服务器向客户端发送建议读取特定文件的消息，请填充 `Notify user of readme files matching`\
  \ 字段。如果目录中存在匹配指定正则表达式（如 `README.**`）的文件，则将发送一条包含其名称和修改时间的短消息。\n\n点击此表单上的 `Save`\
  \ 按钮，然后返回模块主页。最后，点击 `Apply Changes` 按钮激活新的消息文件设置。\n\n由上述选项发送给客户端的文件可以包含以 `%` 开头的某些特殊\
  \ cookie，这些 cookie 将被 `ProFTPD` 替换为发送时确定的文本。根据 `ProFTPD` 文档，当前支持的 cookie 列在表 40.1\
  \ 中。\n\n并非所有 cookie 在所有情况下都有意义。例如，`%U` 不会在登录前消息文件中设置。\n\n##### 表 40.1. 文件可用的 Cookie\n\
  \n| Cookie | 说明 |\n| :--- | :--- |\n| %T | 当前日期和时间 |\n| %F | 文件系统的可用空间 |\n| %C |\
  \ 当前工作目录 |\n| %R | 远程主机名 |\n| %L | 本地主机名 |\n| %u | ident 报告的远程用户名 |\n| %U | 登录时原始用户名\
  \ |\n| %M | 最大连接数 |\n| %N | 当前连接数 |\n| %E | 服务器管理员的电子邮件地址 |\n| %x | 用户类的名称 |\n|\
  \ %y | 来自用户类的当前连接数 |\n| %z | 用户类的最大连接数 |\n\n### 40.11 设置按目录选项\n\n`ProFTPD` 模块允许你设置仅适用于特定目录的选项，而不是全局或适用于整个虚拟服务器。这允许你执行诸如向客户端隐藏目录、仅在某个位置允许匿名客户端上传，或设置添加到目录的文件的用户和组所有权。\n\
  \n要创建一组新的按目录选项，请遵循以下步骤：\n\n如果你希望选项适用于所有虚拟服务器，请在模块主页的 `Add per-directory options\
  \ for` 表单的 `Directory path` 字段中输入目录并点击 `Create` 按钮。或者，你也可以通过点击特定虚拟服务器图标并在虚拟服务器选项页面使用相同的表单来限制它们。你还可以通过点击虚拟服务器的\
  \ `Anonymous FTP` 图标并使用其目录选项创建表单来定义仅适用于匿名客户端的选项。\n\n在所有情况下，目录都应以绝对路径输入，例如 `/usr/local`。也可以指定相对于连接用户主目录的路径，例如\
  \ `~/public_html`。你甚至可以在特定用户的主目录中输入路径，如 `~jcameron/www`。\n\n通常，选项将适用于目录及其所有内容和子目录。若要让它们仅适用于内容而不包括目录本身，请在你输入的路径末尾添加\
  \ `/**`，例如 `/usr/local/**`。\n\n\n\n点击 `Create` 后，你将进入一个目录的选项分类图标页面，如图 40.4 所示。按照惯例，点击这些图标将带你进入各种设置的表单，这些设置仅适用于该目录的请求和列出。\n\
  \n#### 图 40.4 目录选项页面。\n\n![](img/40fig04.jpg)\n\n要完全拒绝客户端访问，点击 `Access Control`\
  \ 并将 `Access control policy` 字段更改为 `Deny all clients`，然后点击 `Save`。\n\n通常，客户端上传的文件所有者将是其登录时使用的\
  \ UNIX 用户。要更改此设置，点击 `User and Group` 图标，并在 `Owner of uploaded files` 字段中输入用户名。上传的文件的组将是指定用户的主属组，除非你也填写了\
  \ `Group owner of uploaded files` 字段。同样，在进行任何更改后，点击 `Save` 返回目录选项页面。\n\n若要仅限制此目录下的文件上传或下载，你需要在该目录下创建一组按命令选项。第\
  \ 40.12 节“限制 FTP 命令的访问”解释了如何操作。\n\n要使该目录的更改生效，请返回模块主页并点击 `Apply Changes` 按钮。\n\n\
  一旦为目录创建了选项，该目录的图标将出现在主页、虚拟服务器选项或匿名 FTP 页面（取决于你创建它的位置）。你可以点击此图标再次打开 `Per-directory\
  \ Options` 页面，并使用图标和表单进行你希望的更改。你也可以通过点击 `Configure Directory` 图标并更新出现表单中的 `Directory\
  \ path` 字段来更改选项适用的路径。然后，点击 `Save` 按钮，接着在主页上点击 `Apply Changes` 按钮。为旧目录设置的所有选项现在将适用于新目录。\n\
  \n你还可以通过点击 `Configure Directory` 然后点击 `Delete directory config` 按钮，完全从 ProFTPD 配置中删除某个目录选项对象。该目录的所有设置和按命令选项将立即且永久地从\
  \ FTP 服务器的配置中删除。\n\n如果你同时为一个目录及其子目录（例如 `*/usr/local*` 和 `*/usr/local/bin*`）定义了选项，ProFTPD\
  \ 在决定将哪些选项应用于特定的客户端请求时，始终会给最具体的目录更高的优先级。这意味着为 `*/usr/local*` 设置的设置将适用于 `*/usr/local/bin/foo*`\
  \ 的下载，除非它被 `*/usr/local/bin*` 的设置所覆盖。\n\n### 40.12 限制 FTP 命令的访问\n\n当客户端想要下载或上传文件、列出目录或执行任何其他操作时，它会向服务器发送命令。可以配置\
  \ ProFTPD 以限制客户端针对特定虚拟服务器或目录可以使用命令，或者在匿名登录时可以使用命令。然而，在执行此操作之前，你需要对存在哪些 FTP 命令及其作用有基本的了解。表\
  \ 40.2 列出了与访问控制目的相关的命令。\n\nProFTPD 允许你定义仅适用于特定客户端命令或命令组的选项。通常，这用于拒绝某些操作访问，例如禁止匿名\
  \ FTP 用户上传。也可以仅允许或拒绝特定的 UNIX 用户，或仅允许来自某些地址的客户端访问。\n\n要创建一组新的按命令选项，请遵循以下步骤：\n\n首先决定选项应仅适用于特定目录的命令、仅适用于虚拟服务器的客户端、仅适用于匿名客户端，还是适用于你\
  \ FTP 服务器的所有用户。在目录、虚拟服务器、匿名 FTP 和主页上，都有一个名为 `Add per-command options for` 的表单。在\
  \ `FTP commands` 字段中，输入上述列表中一个或多个命令，用空格隔开。当你点击 `Create` 按钮时，浏览器将跳转到图 40.5 所示页面。\n\
  \n#### 图 40.5 按命令选项页面。\n\n![](img/40fig05.jpg)\n\n#### 表 40.2 FTP 命令及其用途\n\n| 命令\
  \ | 用途 |\n| :--- | :--- |\n| `CWD` | 切换到不同的当前工作目录（类似于 UNIX 的 `cd` 命令） |\n| `MKD`\
  \ | 创建一个新的空目录（类似于 UNIX 的 `mkdir` 命令） |\n| `RNFR` | 重命名现有文件或目录（类似于 `mv` 命令） |\n|\
  \ `DELE` | 删除文件（类似于 `rm` 命令） |\n| `RMD` | 删除目录，目录必须是空的（类似于 `rmdir` 命令） |\n| `RETR`\
  \ | 从服务器下载文件到客户端 |\n| `STOR` | 从客户端上传文件到服务器 |\n| `SITE_CHMOD` | 更改文件的 UNIX 权限 |\n\
  | `READ` | 这不是命令，而是所有处理文件读取的 FTP 命令的简写 |\n| `WRITE` | 同样，这不是命令，而是所有写入或修改文件的命令的简写\
  \ |\n| `DIRS` | 这是所有目录列表和移动命令的简写 |\n| `LOGIN` | 这根本不是一个 FTP 命令，而是用于表示客户端连接。有关如何使用它的信息请参见第\
  \ 40.15 节“通过 IP 地址限制客户端” |\n| `ALL` | 代表所有 FTP 命令 |\n\n点击 `Access Control` 图标调出限制谁可以使用这些命令的表单。\n\
  \n要完全拒绝所有人的访问，将 `Access control policy` 字段更改为 `Deny all clients`。要允许所有人访问，请选择 `Allow\
  \ all clients`。如果你正在编辑目录内命令的选项，且相同命令在更高级别（例如虚拟服务器或匿名 FTP）有一组拒绝访问的选项，那么这种方法最有用。例如，匿名客户端通常无法使用\
  \ `WRITE` 命令，但你可能希望为特定目录允许这样做。\n\n若要仅允许某些 UNIX 用户或特定组的成员访问命令，请填写 `Only allow users`\
  \ 和 `Only allow group` 字段。必须用空格隔开输入多个用户名或组名。\n\n通过填写 `Deny users` 和 `Deny groups`\
  \ 字段，可以在拒绝某些用户和组的同时允许其他所有人访问 FTP 命令。\n\n`Restrict access` 表可以通过输入一系列规则来阻止来自某些 IP\
  \ 地址的客户端。顶部的三个单选按钮控制表中条目评估的顺序。如果选择了 `Deny then allow`，任何匹配 `Deny` 行或不匹配 `Allow`\
  \ 行的客户端都将被阻止。相反，如果选择了 `Allow then deny`，则只有匹配 `Deny` 行且不匹配 `Allow` 行的客户端才会被阻止使用命令。这种模式也是默认设置。\n\
  \n表格始终将留有一个空行用于添加新规则，由于这是一组新的按命令选项，它将只包含该行。在空行中，从 `Action` 菜单中选择 `Allow` 或 `Deny`。然后从\
  \ `Condition` 菜单中选择以下项之一，以确定哪些客户端匹配并从而被允许或拒绝：\n\n- `All`: 所有客户端均匹配，无论它们来自何处。\n-\
  \ `None`: 没有客户端匹配该规则。\n- `IP address`: 仅来自相邻文本字段输入的 IP 地址的客户端匹配。\n- `Network`: 仅来自所输\
  \ IP 网络的客户端匹配。网络地址必须是带有尾部点的部分 IP，例如 `192.168.1.`。\n- `Hostname`: 仅 IP 地址反向解析为所输入名称的客户端匹配。你可以通过在前面加一个点来指定整个域名，例如\
  \ `.example.com`。\n\n如果你想添加多条规则，你需要在保存后重新进入此页面，以便出现新的空白行。要删除规则，请从 `Action` 菜单中选择\
  \ `blank` 选项。\n\n当你选择好谁可以使用 FTP 命令后，点击 `Save` 按钮。然后，返回模块主页并点击 `Apply Changes` 使限制生效。\n\
  \n\n\n\n一旦创建了命令或多个命令的选项，它们的图标将出现在主页面、虚拟服务器选项页面、匿名 FTP 页面或目录选项页面，具体取决于你创建它们的位置。你可以点击此图标再次打开相同的每个命令选项页面，并使用图标和表单进行你希望的更改。你也可以通过点击`Configure\
  \ Commands（配置命令）图标并在出现表单的 FTP 命令列表中选择不同的条目，更改选项应用的命令。然后点击`Save（保存）按钮，再点击模块主页上的`Apply\
  \ Changes（应用更改）按钮。或者，你可以点击`Delete commands config（删除命令配置）从配置中完全移除这些命令的选项。\n\n###\
  \ 40.13 配置日志\n\n默认情况下，ProFTPD 将所有传输记录到 `/var/log/xferlog` 文件中，使用标准的 FTP 日志格式（除非在编译时选择了不同的路径）。但是，你可以配置服务器分别记录每个虚拟服务器的入站和出传输，以及匿名\
  \ FTP 流量。这在虚拟托管环境中最为有用，因为你的系统为许多不同的客户托管 FTP 站点。\n\n你还可以定义使用不同格式的额外日志文件，并可选地仅包含 FTP\
  \ 命令的子集。如果你只关心上传且不想让日志文件被无用信息淹没，这将非常有用。\n\n要全局或为单个虚拟服务器配置日志写入的位置和方式，请按照以下步骤操作：\n\
  \n- 如果你想更改用于所有传输的全局日志文件位置（除非被虚拟服务器覆盖），请点击主页上的`Logging（日志）`图标。\n- 如果你想配置特定的虚拟服务器使用不同的日志文件，请点击它的图标，然后点击虚拟服务器选项页面上的`Logging（日志）`图标。\n\
  - 要仅更改匿名客户端的日志设置，请点击虚拟服务器图标，然后点击`Anonymous FTP（匿名 FTP）`，最后点击匿名 FTP 页面上的`Logging（日志）`图标。\n\
  \n在生成的日志选项表单上，`FTP transfers logfile（FTP 传输日志文件）`字段控制日志写入的位置。要指定文件，选择最后一个选项并在相邻的文本框中输入类似\
  \ `*/var/log/example.com.xfers*` 的完整路径。要关闭日志，选择`Logging disabled（禁用日志）`。要使用全局默认，选择`Default（默认）`选项。如果你正在编辑全局日志设置，ProFTPD\
  \ 将使用编译时内置的默认日志文件 `/var/log/xferlog`。\n\n`Custom logfiles（自定义日志文件）`表可用于定义特定命令的任意格式的额外日志。按照惯例，它始终有一个空行用于添加新的自定义日志文件。要添加，请填写这些标题下的字段：\n\
  \n- **Logfile（日志文件）**：日志文件的完整路径，例如 `*/home/example.com/ftplog*`。\n- **FTP commands（FTP\
  \ 命令）**：如果选择`All`，则将记录所有 FTP 命令。但如果你选择第二个选项，则仅包含相邻文本框中的命令类。识别的类有：`NONE`（无命令）、`ALL`（所有命令）、`INFO`（信息请求）、`DIRS`（目录导航）、`READ`（文件下载）、`WRITE`（文件上传和目录创建）、`SITE`（非标准命令如\
  \ `CHMOD`）以及 `MISC`（其他杂命令）。多个类必须用逗号分隔，例如 `READ,WRITE`。你不能使用第 40.12 节“限制 FTP 命令访问”中记录的名称。\n\
  - **Log format（日志格式）**：如果选择`Default`，将使用标准的 FTP 日志格式。但如果选择第二个选项，你必须在文本框中输入识别的日志格式名称。下一段将解释如何设置命的日志格式。\n\
  \n由于表中只显示一个空行，你一次只能添加一个自定义日志。要添加更多，请在保存后再次点击`Logging（日志）`图标并填写新的空行。要删除自定义日志，只需清除`Logfile`列中的对应字段即可。\n\
  \n点击`Save（保存）`按钮保存新设置，然后点击主页上的`Apply Changes（应用更改）`以激活它们。\n\n如果你想为日志文件使用自己的自定义格式，必须先在全球范围内定义它们。要创建格式，请完成以下步骤：\n\
  \n- 在模块主页上，点击`Logging（日志）`图标以打开全局日志文件选项页面。\n- `Custom log formats（自定义日志格式）`表用于定义你自己的格式。在`Format\
  \ name（格式名称）`下的第一个空字段中，为你的新格式输入短名称，例如 `filesonly`。在它相邻的`Format string（格式字符串）`字段中，输入包含\
  \ ProFTPD 识别的日志代码的文本，例如 `Downloaded %f at %t`。字符串中以 `%` 开头的特殊代码将被服务器替换为有关命令的信息，如表\
  \ 40.3 所示。\n\n按照惯例，你可以在保存后重新进入页面以添加多个自定义格式，以便出现新的空行。通过清除其`Format name`字段可以删除格式。\n\
  \n点击`Save（保存）`按钮返回主页，然后点击`Apply Changes（应用更改）`。现在可以在自定义日志中使用新格式了。\n\n根据 ProFTPD\
  \ 文档，识别的日志格式代码是表 40.3 所示的代码。\n\n### 表 40.3. 日志格式代码\n\n| 代码 |  |\n| :--- | :--- |\n\
  | %a | 远程客户端 IP 地址 |\n| %A | 匿名密码，或非匿名客户端显示为 UNKNOWN |\n| %b | 请求发送的字节数 |\n| %{NAME}e\
  \ | 环境变量 NAME 的内容。注意服务器本身不会设置任何环境变量。 |\n| %f | 存储或检索的绝对文件名 |\n| %F | 客户端看到的存储或检索的文件名\
  \ |\n| %h | 远程客户端 DNS 域名 |\n| %l | 远程用户名（来自 ident），如果没有可用则显示为 UNKNOWN |\n| %L |\
  \ 本地服务器 IP 地址 |\n| %m | 从客户端接收的 FTP 命令名称，例如 RETR |\n| %p | 本地服务器端口号 |\n| %P | 本地服务器进程\
  \ ID |\n| %r | 从客户端接收的完整命令行 |\n| %s | 数字型 FTP 响应代码 |\n| %t | 当前本地时间 |\n| %{FORMAT}t\
  \ | 使用标准 UNIX strftime 函数通过 FORMAT 格式化后的当前本地时间 |\n| %T | 传输或接收文件所需的时间，秒为单位 |\n|\
  \ %u | 客户端登录的本地认证用户名 |\n| %v | 根据 ProFTPD 配置，客户端连接的虚拟服务器名称 |\n| %V | 客户端连接的虚拟服务器的\
  \ DNS 名称 |\n\n## 40.14 限制并发登录\n\n如果你的系统配置允许匿名 FTP 登录且你预计将收到大量流量，那么限制同时向 FTP 服务器打开的连接数是合理的。这为\
  \ FTP 传输可能产生的网络和 CPU 负载设置了上限，如果系统被用于其他用途（例如运行 Web 服务器），这将非常。\n\n此限制可以全局设置、按每个虚拟服务器设置，或仅针对匿名客户端设置。这意味着你可以设置一个适用于所有服务器的限制，然后为特定的虚拟主机增加或减少该限制。你还可以为匿名客户端设置比具有有效登录权限的客户端更低的限制。\n\
  \nProFTPD 还可以配置为限制单个客户端主机可以拥有的并发连接。如果你希望阻止人们从你的服务器同时下载超过一个文件，从而占用超过其公平份额的带宽，这将很有用。\n\
  \n要为你的服务器设置连接限制，请按照以下步骤操作：\n\n- 如果你想设置全局限制，点击模块主页上的`Networking Options（网络选项）`图标。\n\
  - 要为单个虚拟服务器设置限制，点击它的图标然后点击`Networking Options（网络选项）`。\n- 要定义仅适用于匿名客户端的限制，请点击虚拟服务器图标，然后点击`Anonymous\
  \ FTP（匿名 FTP）`，最后点击匿名 FTP 页面上的`Networking Options（网络选项）`图标。\n\n\n\n\n\n在弹出的表单上找到`Maximum\
  \ concurrent logins`(最大并发登录数）字段。要设置限制，选择第三个单选按钮并在旁边的文本框中输入数字。或者，你可以选择`Unlimited`（无限制）以关闭适用于此虚拟服务器的全局限制。\n\
  \n要定义向达到限制后尝试连接的客户端发送的错误消息，请将其输入`Maximum concurrent logins`字段中的`Login error message`（登录错误消息）框内。如果消息包含特殊代码%m`，它将被替换为允许的最大数量。\n\
  \n要设置每个主机的主机限制，以同样的方法填充`Maximum concurrent logins per host`字段。它也有一个`Login error\
  \ message`框，可用于设置发送给超出限制的 FTP 客户端的消息。\n\n如果你正在编辑全局网络选项，还可以设置任何时间可运行的`ProFTPD`子进程总数限制。这对于保护系统免受数百个无效连接的拒绝服务攻击非常有用。只需选择`Maximum\
  \ concurrent sessions`(最大并发会话）字段的第二个选项，并在相邻的文本框中输入数字。如果选择`Default`（默认），则不强制执行限制。\n\
  \n如果你是从像`inetd`或`xinetd`这样的超级服务器运行服务器，则此限制将不起作用。幸运的是，这两个服务器都具有可以实现相同结果的配置选项。\n\n\
  完成客户端限制编辑后，点击表单底部的`Save`(保存）按钮以更新`ProFTPD`配置，然后点击主页面上的`Apply Changes`(应用更改）按钮。\n\
  \n## 40.15 通过 IP 地址限制客户端\n\n默认情况下，`ProFTPD`允许客户端从任何 IP 地址连接。然而，与其他所有设置项一样，这是可配置的，你可以全局或针对特定的虚拟服务器限制对你自己网络中系统的访问。如果你正在设置一个仅供内部使用的\
  \ FTP 服务器，这将非常有用，即使运行它的系统可以从互联网访问。\n\n要按地址限制客户端，请遵循以下步骤：\n\n要创建一个适用于所有虚拟服务器的全局限制，在模块主页的每个命令选项表单的\
  \ FTP 命令字段中输入`LOGIN`，然后点击`Create`(创建)。如果你只想限制谁可以连接到特定的虚拟服务器，请在虚拟服务器选项页的同一表单中输入`LOGIN`之前，先点击它的图标。\n\
  \n无论在哪个级别定义限制，你将带到图 40.5 所示的每个命令选项页。点击`Access Control`(访问控制)图标进入名副其实的访问控制表单。\n\n\
  `Restrict access`(限制访问)表可以通过输入一系列规则来阻止某些 IP 地址的客户端。顶部的三个单选按钮控制表中条目评估的顺序。如果选择了`Deny\
  \ then allow`(先拒绝后允许)，任何匹配`Deny`行或不匹配`Allow`行的客户端将被阻止。相反，如果选择`Allow then deny`(允许后拒绝)，则只有匹配`Deny`行且不匹配`Allow`的客户端才会被阻止登录。这种模式也是默认设置。\n\
  \n表格将始终有一个空行用于添加新规则，由于这是一组新的每个命令选项，因此它最初只包含这一个行。在空行中，从`Action`(动作)菜单中选择`Allow`(允许)或`Deny`(拒绝)。然后，从`Condition`(条件)菜单中选择以下项之一来确定哪些客户端匹配并从而被允许或拒绝。\n\
  \n- **All (全部)**：所有客户端都匹配，无论它们来自哪里。\n- **None (无)**：没有客户端匹配该规则。\n- **IP address\
  \ (IP 地址)**：只有来自相邻文本字段中输入的 IP 地址的客户端才匹配。\n- **Network (网络)**：只有来自输入的 IP 网络的客户端匹配。网络地址必须是带有尾部点的部分\
  \ IP，例如`192.168.1.*`。\n- **Hostname (主机名)**：只有其 IP 地址反向解析为输入名称的客户端才匹配。你可以通过在前面加一个点来指定整个域名，例如`*.example.com`。\n\
  \n如果你想添加多个规则，你需要在保存后重新进入此页面，以便出现新的空白行。要删除规则，请从`Action`菜单中选择空白选项。\n\n完成客户端限制输入后，点击表单底部的`Save`按钮。然后返回主页面并点击`Save`(保存)和`Apply`(应用)按钮以激活它们。\n\
  \n你通常只想允许单个网络上的客户端进行访问。要做到这一点，选择`Deny then allow`选项，从`Action`菜单中选择`Allow`，从`Condition`菜单中选择`Network`，并在条件文本框中输入带有尾部点的网络地址（如`10.254.1.*`）。\n\
  \n### 40.16 限制上传\n\n如果允许客户端向你的服务器上传文件，他们可以为上传的文件选择任何他们喜欢的名称。有时这不是所希望；然而，你可能只想允许存储文件名以`.gif`或`.jpg`结尾的图像文件，或者阻止上传文件名以`.exe`或`.com`结尾的\
  \ Windows 可执行文件。幸运的是，`ProFTPD`具有允许你设置此类内容的配置选项。\n\n还有其他适用于上传的设置，可以控制是否允许客户端覆盖文件以及部分传输的文件是否可见。这些都可以针对单个虚拟服务器或仅针对匿名客户端进行全局设置。设置这些选项请完成以下步骤：\n\
  \n如果你希望设置是全局的，点击模块主页上的`Files and Directories`(文件和目录)图标。要让它们仅适用于单个虚拟服务器，点击它的图标，然后点击`Files\
  \ and Directories`。或者，为了仅影响匿名登录的客户端，点击虚拟服务器图标，然后点击`Anonymous FTP`，最后点击虚拟服务器选项页上的`Files\
  \ and Directories`图标。\n\n无论你选择哪种配置对象，出现的文件和目录表单几乎完全相同。\n\n要隐藏正在上传的文件，将`Hide files\
  \ during upload?`(上传期间隐藏文件？)字段更改为`Yes`(是)。这告诉`ProFTPD`使用以`.in.`开头的临时文件传输数据，只有在上传完成后才会重命名为实际文件名。这防止了不完整的上传，并防止文件在发送期间被下载或访问。\n\
  \n要让`ProFTPD`删除未完全传输的上传文件，请为`Delete aborted uploads?`(删除中止上传？)字段选择`Yes`。同样，这防止了系统上产生损坏的部分上传的文件。\n\
  \n要允许用户仅创建相对名称匹配特定模式的文件，在`Allowed uploaded filename regex`(允许的上传文件名正则表达式)字段中填充 Perl\
  \ 正则表达式。例如，要仅允许 GIF 文件，你可能会输入`^.*\\.gif$`。\n\n由于客户端通常允许重命名文件，仅通过此选项不足以停止创建无效的文件名。你还需要阻止对`RNFR`命令的访问，如第\
  \ 40.12 节“限制对 FTP 命令的访问”所示。\n\n你还可以通过在`Denied uploaded filename regex`(拒绝的上传文件名正则表达式)字段中填充如`^.*\\\
  .exe$`的正则表达式来阻止使用某些文件名。如果此字段和前一个字段都已设置，则只允许匹配允许表达式但不匹配此拒绝表达式的文件。\n\n此选项的另一个常见用途阻止上传`.ftpaccess`或`.htaccess`文件，这些文件设置了每个目录的\
  \ ProFTPD 和 Apache 的选项。\n\n点击页面底部的`Save`按钮。\n\n如果你想停止客户端用新上传的内容覆盖文件，点击`Access Control`图标并将`Allow\
  \ overwriting of files?`(允许覆盖文件？)字段更改为`No`(否)。这对于一个允许匿名用户上传到特定目录（可能是为了某些入站文件）的服务器非常有用。如果你执行了此更改，请记得点击`Save`。\n\
  \n返回模块主页并点击`Apply Changes`(应用更改)按钮以激活你的新文件名限制。\n\n\n\n\n\n### 40.17 手动编辑指令\n\n在某些情况下，如果你倾向于手动编辑\
  \ ProFTPD 配置文件，或者只是想查看 Webmin 中的某个操作设置了哪些指令，可以使用此模块完成。除了默认服务器外，每个对象的选项页（虚拟服务器、按目录和按命令）都有标记为\
  \ `Edit Directives`（编辑指令）的图标。点击后，它将带你进入表单，其中包含一个大型文本框，显示文件中与该对象相关的行。你可以随心欲编辑，然后点击\
  \ `Save`（保存）按钮更新实际文件。但请注意，不会对你的输入进行任何验证。此外，你仍然需要点击模块主页上的 `Apply Changes`（应用更改）按钮来激活任何更改。\n\
  \n要查看并编辑整个 ProFTPD 配置，请使用模块主页上的 `Edit Config Files`（编辑配置文件）图标。这将打开类似的表单，但显示并允许一次编辑完整的配置文件。由于\
  \ ProFTPD 可以读取多个配置文件（尽管使用了 `Include` 指令），在表单顶部有一个 `File` 菜单下的标记为 `Edit Directives`\
  \ 的按钮，旁边有一个文件名列表。要切换视图到另一个文件，只需选择你想要的文件并点击按钮。通常情况下，只会使用单个 `proftpd.conf` 文件。\n\n\
  ### 40.18 配置 ProFTPD 服务器模块\n\n要更改模块用于 ProFTPD 配置文件和程序的路径，你需要点击主页左上角的标准 `Module Config`（模块配置）链接。与其他模块不同，这里没有与用户界面相关的选项，因此一旦模块运行，很少需要更改任何内容。默认情况下，所有配置字段都设置为与你操作系统上提供的\
  \ ProFTPD 软件包匹配；如果没有此类软件包，这些字段将匹配从源码发行版安装时使用的路径。\n\n#### 表 40.4. 模块配置选项\n\n| ProFTPD\
  \ 配置文件路径 | 此字段必须包含 ProFTPD 主配置文件的完整路径，通常为 `/etc/proftpd.conf`。 |\n| ProFTPD 可执行文件路径\
  \ | 此字段必须包含 ProFTPD 服务器程序的路径，例如 `/usr/sbin/proftpd`。 |\n| ProFTPD PID 文件路径 | 此字段必须包含其\
  \ PID 文件的路径，例如 `/var/run/proftpd.pid`，以便模块判断 FTP 服务器是否正在运行。 |\n| ftpusers 文件路径 |\
  \ 此字段必须包含 ProFTPD 读取以查找哪些用户不允许登录的文件路径。通常为 `/etc/ftpusers`，多个 FTP 服务器也会使用该文件。 |\n\
  | 启动 ProFTPD 的命令 | 如果在主页点击 `Start Server` 按钮时选择了 `Automatic`，则模块将直接运行 ProFTPD 可执行程序。或者，你可以输入类似\
  \ `/etc/init.d/proftpd start` 的命令，将用于执行相同的操作。 |\n\n### 40.19 总结\n\n本章介绍了 FTP 协议，并解释了\
  \ FTP 客户端和服务器的作用。它涵盖了 ProFTPD 的功能，以及安装它时需要采取的步骤。阅读完本章后，你应该知道如何配置 FTP 服务器以允许匿名登录、限制某些地址的客户端、将用户限制在其主目录以及记录自定义格式。你还应该理解\
  \ ProFTPD 强大的虚拟 FTP 托管支持，可以根据客户端连接到你系统的哪一个 IP 地址来定义不同的选项。\n\n## 第 41 章.WU-FTPD 服务器\n\
  \n在本章中将解释用于 FTP 协议的 WU-FTPD 服务器，并提供配置许多常见任务的步骤。\n\n### 41.1 WU-FTPD 简介\n\nWU-FTPD（WU\
  \ 代表华盛顿大学）可能是互联网上最流行的 UNIX FTP 服务器，默认包含在大多数 UNIX 和 Linux 操作系统中。它大量的可配置选项使其优于某些 UNIX\
  \ 变体仍在使用的“经典”或 `BSD FTP` 服务器，但它不像第 40 章中介绍的 ProFTPD 那样灵活或实现整洁。该章节还对 FTP 协议有简短的通用介绍，如果你熟悉\
  \ FTP 客户端和服务器等概念，在继续阅读之前应该阅读该章节。\n\n在正常的默认配置下，WU-FTPD 将允许任何 UNIX 用户（系统用户除外）使用标准用户名和密码登录，并以通过\
  \ `telnet` 或 `SSH` 连接时具有相同的权限在服务器系统上上传、下载和操作文件。它还可以被设置为支持匿名登录，以便任何人都能在需要有效 UNIX\
  \ 账户的情况下连接，尽管匿名客户端通常被限制在特定目录并防止上传文件。\n\nWU-FTPD 的主配置文件称为 `/etc/ftpaccess`，但它也使用其他几个文件，如\
  \ `/etc/ftpusers` 和 `/etc/ftphosts`。`ftpaccess` 文件包含一系列指令，每行一个，每个指令都有名称和多个值。每个指令设置单个选项，例如消息文件的路径或目录别名。\n\
  \n与 ProFTPD 一样，WU-FTPD 可以作为永久的独立守护进程运行，也可以从如 `inetd` 或 `xinetd` 这样的超级服务器运行。通常使用后者，因为这消除了始终运行额外的服务器进程等待\
  \ FTP 连接的需求。对于客户端和配置文件而言，除了性能外，两种模式之间没有区别。\n\n### 41.2 WU-FTPD 服务器模块\n\n要在 Webmin\
  \ 内部配置 FTP 服务器，请点击 `Servers`（服务器）类别下的 `WU-FTPD Server` 图标。如果它已正确安装并运行，将显示模块主页（如图\
  \ 41.1 所示）。每个图标都将带你进入设置一类可配置选项的表单，例如与日志、消息和横幅相关的选项。\n\n#### 图 41.1. WU-FTPD 服务器模块。\n\
  \n![](img/41fig01.jpg)\n\n如果模块找不到 WU-FTPD 服务器可执行文件，将显示类似 `The FTP server `/usr/sbin/in.ftpd`\
  \ could not be found on your system` 或 `The FTP server configuration file `/etc/ftpaccess`\
  \ does not exist` 的错误消息。这通常意味着程序未安装。检查你的 Linux 发行版 CD 或网站是否有 `wu-ftpd` 包，并使用第 12\
  \ 章介绍的 `Software Packages` 模块进行安装。也可能是模块在错误位置查找服务器程序或配置文件。如果你确定 WU-FTPD 已安装，请参考第\
  \ 41.14 节“配置 WU-FTPD 服务器模块”获取调整查找路径的信息。\n\n有时，即使 WU-FTPD 已安装，它默认也是禁用的。如果你在命令行提示符处运行\
  \ `ftp localhost` 并返回错误消息 `Connection refused`，说明没有 FTP 服务器正在运行。这可能是因为尚未为 FTP 创建\
  \ `inetd` 或 `xinetd` 服务，或者服务已存在但被禁用了。按照下面的步骤设置或激活用于 WU-FTPD 的超级服务器服务。\n\n如果确实需要安装\
  \ WU-FTPD，你必须先删除系统中安装的任何其他 FTP 服务器（如 ProFTPD 或 `PureFTP`）。确保你也杀掉了它们的所有进程，以便没有遗留进程监听\
  \ FTP 端口。你可以通过在命令行提示符处运行 `ftp localhost` 来验证其他服务器已完全关闭。应该显示 `Connection refused`\
  \ 错误，表示端口 21 上没有在监听。\n\n\n\n\n安装 WU-FTPD 后，您需要配置 `inetd` 或 `xinetd` 以监听 FTP 端口并运行服务器程序。在执行此操作之前，请查找程序在您系统中的实际安装位置。通常情况下，它位于\
  \ `/usr/sbin/in.ftpd`，但可能因您的操作系统而异。\n\n如果您的系统使用了更优的 `xinetd` 超级服务器，请按照以下说明设置 FTP\
  \ 服务。由于许多软件包已经包含了用于服务器的 `/etc/xinetd.d` 配置文件，下列表中解释的某些字段可能已经正确填写。\n\n进入 Webmin 的“网络（Networking）”类别，并点击“扩展互联网服务（Extended\
  \ Internet Services）”图标。如果图标不存在，说明系统未安装 `xinetd`，您将需要使用 `inetd` 来设置服务器。\n\n在模块的主页上检查是否存在名为\
  \ `ftp` 或 `wu-ftpd` 的现有服务。如果存在，点击它；否则，点击表格上方或下方的“创建新的互联网服务（Create a new internet\
  \ service）”链接。\n\n在“服务名称（Service name）”字段中，输入 `ftp`（除非已填写）。\n\n确保“服务是否启用？（Service\
  \ enabled?）”字段中选择了 `Yes`。\n\n将“绑定地址（Bind to address）”字段设置为 `All`，并将“端口号（Port number）”设置为\
  \ `Standard` 或 `21`。\n\n从“套字类型（Socket type）”菜单中选择 `Stream`，从“协议（Protocol）”列表中选择\
  \ `Default` 或 `TCP`。\n\n在“服务处理程序（Service handled by）”字段中，选择“服务器程序（Server program）”选项，并在相邻文本框中输入\
  \ WU-FTPD 可执行文件的路径以及带有参数 `-l -a`（例如 `/usr/sbin/in.ftpd l -a`）。\n\n在“以用户运行（Run as\
  \ user）”字段中，输入 `root`。\n\n为“等待完成？（Wait until complete?）”字段选择 `No`。\n\n其他所有字段保持默认设置，点击表单底部的“保存（Save）”或“创建（Create）”按钮。\n\
  \n回到模块主页，点击服务列表下方的“应用更改（Apply Changes）”按钮。\n\n使用“互联网服务和协议（Internet Services and\
  \ Protocols）”模块为 WU-FTPD 设置 `inetd` 服务，您也可以遵循以下步骤：\n\n进入 Webmin 的“网络（Networking）”类别，并点击“互联网服务和协议（Internet\
  \ Services and Protocols）”图标。如果不存在，您的系统可能正在使用 `xinetd`。\n\n在模块主页上，点击互联网服务表中的 `ftp`。如果可见，在“编辑服务（Edit\
  \ service）”按钮旁的字段中输入 `ftp` 并点击按钮。无论哪种，都会显示编辑 FTP 协议服务的页面。\n\n在“服务器程序（Server Program）”部分，选择“启用程序（Program\
  \ enabled）”。\n\n在“程序（Program）”字段中，选择“命令（Command）”选项，并在相邻字段中输入 WU-FTPD 服务器可执行文件的完整路径，例如\
  \ `/usr/sbin/in.ftpd`。在“参数（Args）”字段中，输入 `in.ftpd l -a`。\n\n将“等待（Wait）”模式设置为“不等待（Don't\
  \ wait）”，并在“以用户执行（Execute as User）”字段中输入 `root`。其他所有项均保持不变。\n\n点击“保存（Save）”按钮，然后回到模块主页，点击“应用更改（Apply\
  \ Changes）”。\n\n一旦 WU-FTPD 设置为从 `inetd` 或 `xinetd` 运行，您可以使用命令行 UNIX FTP 客户端连接到自己的系统进行测试。只需运行\
  \ `ftp localhost`，并确保您可以使用 root 以外的用户身份登录。如果不是，请检查日志文件（使用第 13 节介绍的“系统日志”模块），查看来自\
  \ `inetd` 或 `xinetd` 的任何消息，以解释可能出现的问题。\n\n### 41.3 限制登录用户\n\n在正常配置下，WU-FTPD 将允许任何\
  \ UNIX 用户登录，但 `root`、`bin` 和 `daemon` 等系统账户除外。root 用户几乎总是被默认拒绝，因为 FTP 协议在通过网络传输密码时不加密，这意味着以\
  \ root 身份远程登录可能会密码暴露给攻击者。\n\n要更改可以登录系统的用户和组，请遵循以下步骤：\n\n在模块主页上，点击“用户和类（Users and\
  \ Classes）”图标，显示图 41.2 所示的表单。\n\n#### 图 41.2. 用户和类页面。\n\n![](img/41fig02.jpg)\n\n\
  在“要拒绝的 UNIX 用户（Unix users to deny）”字段中添加任何想要阻止使用您的 FTP 服务器的账户，或删除您想要允许的账户。这将更新 `/etc/ftpaccess`\
  \ 文件，该文件被其他 FTP 服务器（如 ProFTPD，如果您决定切换的话）使用。\n\n要拒绝 UID 位于某些范围内的用户，填充“要拒绝的 UNIX 用户和\
  \ UID（Unix users and UIDs to deny）”字段。您可以输入类似 `%3000-4000` 的 UID 范围，这将阻止所有 UID 在\
  \ 3000 到 4000 之间的用户。或者，您可以输入类似 `%-100` 或 `%5000-` 的范围，将分别拒绝 UID 小于 100 或大于 5000\
  \ 的用户。可以输入多个范围并用空格隔开。该字段也可以普通用户名，尽管这与将其放在“要拒绝的 UNIX 用户”字段的效果相同。\n\n要拒绝主组 ID 在某些范围内的用户，填充“要拒绝的\
  \ UNIX 组和 GID（Unix groups and GIDs to deny）”字段。同样，您可以输入类似 `%100 200` 或 `% 10` 的\
  \ ID 范围，以及如 `users` 等组名。仅主组组成有效。如果用户是列出组之一的次级成员，将不会被拦截。\n\n要从上述两个步骤定义的拒绝列表中排除某些用户或组，填充“不拒绝的\
  \ UNIX 用户和 UID（UNIX users and UIDs not to deny）”和“不拒绝的 UNIX 组和 GID（UNIX groups and\
  \ GIDs not to deny）”字段。第一个字段接受 UID 范围或用户名，第二个字段接受组 ID 范围或组名。如果您只想允许少数几个用户，同时通过覆盖所有账户的\
  \ UID 范围来阻止其他人，则这些字段将非常有用。\n\n点击页面底部的“保存（Save）”按钮以保存并激活新的用户限制。\n\nWU-FTPD 通常还会阻止\
  \ shell 不在 `/etc/shells` 文件列表中的用户登录。这通常是为了创建可以登录到 POP3 服务器但无法通过 telnet、SSH 或 FTP\
  \ 连接的账户。遗憾的是，没有 WU-FTPD 配置选项可以更改来关闭此 shell 检查。它要么硬编码在程序中，要么由实际用于验证用户的 `ftp PAM`\
  \ 服务强制执行。\n\n如果您系统上的 WU-FTPD 使用 PAM（大多数 Linux 发行版都是如此），请按照以下步骤关闭 `/etc/shells` 检查：\n\
  \n进入“PAM 验证（PAM Authentication）”模块，可以在 Webmin 主菜单的“系统（System）”类别下找到。\n\n在主页上点击 `ftp`\
  \ 或 `wu-ftpd` 服务。\n\n在出现的编辑表单上，点击“身份验证步骤”部分“PAM 模块”列中的 `pam_shells.so`。\n\n从“失败（Failure）”菜单中选择“可选（Optional）”，这样\
  \ shell 文件检查的成功或失败将在验证时被忽略。\n\n点击“保存（Save）”按钮。具有无效 shell 用户将无法登录您的 FTP 服务器。\n\n\
  在其他操作系统上，上述步骤是无效的，因为“PAM 验证”模块仅在 Linux 上。\n\n### 41.4 设置匿名 FTP\n\n配置 WU-FTPD 接受匿名登录比您预期的要稍微复杂，因为它使用\
  \ `ls` 命令来生成目录列表。为了使此命令（以及服务器使用的其他命令）无法逃匿名客户端受限的目录，服务器使用 UNIX `chroot` 系统调用将自身及其运行的所有程序限制在该目录中。这意味着根目录必须包含\
  \ WU-FTPD 和 `ls` 命令运行所需程序、文件和共享库。\n\n默认情况下，特殊 UNIX 用户 `ftp` 的家目录被用匿名 FTP 根，但可以为不同的客户端类分配不同的根。无论选择哪个目录，它必须包含一个\
  \ `bin` 子目录，其中包含 `ls`、`gzip`、`tar`、`recompress`、`cpio` 和 `zcat` 命令。它还必须有一个包含这些命令所需的共享库的\
  \ `lib` 子目录、包含 `passwd` 和 `group` 文件的 `etc` 子目录，以及一个存储下载文件的 `pub` 目录。\n\n\n\n\n\
  正如你可以想象到的，将所有这些文件复制到指定位置并确保它们正常工作是非常棘的。幸运的是，许多包含 `wu-ftpd` 包的 Linux 发行版也带名为 `anonftp`\
  \ 的包，它会将所有需要的文件放置在 ftp 用户的家目录下。在大多数情况下，你只需要安装此包，`WU-FTPD` 就会允许客户端匿名登录。\n\n无论根目录的权限如何，`WU-FTPD`\
  \ 始终会阻止匿名客户端上传、重命名或删除文件。他们能够做的只是下载你放在 `pub` 子目录中供公共分发的文件。\n\n可以通过以下步骤进一步配置匿名登录：\n\
  \n1. 点击模块主页上的 `Anonymous FTP` 图标。\n2. `Anonymous FTP` 根目录表允许你为不同类别的客户端指定不同的根目录。任何现有的目录（默认的\
  \ `~ftp` 除外）都列在表中以便编辑，并且始终会有一个空行用于添加新条目。一旦添加了条目，它将替换默认设置，因此如果你想让它继续工作，请务必显式地添加它。如果你想添加多个目录，则需要保存并重新打开此页面，以便出现新的空白行。每行有两个字段：\n\
  \    - **Directory (目录)**：在此字段中，你必须输入有效匿名 FTP 目录的完整路径（包含 `etc`、`bin`、`lib` 和 `pub`\
  \ 子目录以及所有必要的程序）。\n    - **For class (所属类别)**：从此菜单中，你必须选择该目录使用的客户端类，假设该类的客户端匿名登录。如果选择了\
  \ `Any`（任意），它将用于表中不属于任何其他类别的客户端。有关如何定义你自己的类的详情，请参见第 41.5 节“管理用户类”。\n\n当用户匿名登录到你的\
  \ FTP 服务器时，尽管密码不用于身份验证，他们仍必须提供密码。通常，此密码是用户的电子邮件地址，可以用它来大致了解客户端来自哪个域名。然而，出于隐私考虑，许多现代\
  \ FTP 客户端和浏览器不再发送真实的电子邮件地址，而是使用如 `mozilla@example.com` 这样的虚假地址进行登录。你可以配置 `WU-FTPD`\
  \ 检查匿名登录密码的格式，以确保它们看起来像电子邮件地址，这可以使用此页面上的 `Anonymous FTP` 密码检查字段来实现。如果选择了 `Default`（默认），将不进行任何检查。但如果选择第二个选项，检查级别取决于你从菜单中的选择：\n\
  \    - **Allow anything (允许任意)**：允许任何密码，甚至是空密码（这与默认模式相同）。\n    - **Must contain\
  \ @ (必须包含 @)**：密码必须包含 `@` 符号\n    - **Must be an RFC882 email address (必须是 RFC882\
  \ 电子邮件地址)**：密码必须像有效的电子邮件地址，在 `@` 前后都有字母和数字。\n\n第二个菜单决定 FTP 服务器是仅警告违反检查的客户端（如果选择\
  \ `Warn only` 仅警告），还是完全阻止（如果选择 `Deny login` 拒绝登录）。\n\n要完全阻止某些匿名密码（即使它们是有效的），可以在\
  \ `Anonymous FTP passwords to deny` 字段中填入完整或部分电子邮件地址列表。这对于阻止默认使用虚假地址的 FTP 客户端非常有用。然而，我不建议使用此功能，因为它会阻止许多人，特别是使用网页浏览器的用户。\n\
  \n点击页面底部的 `Save` 按钮激活新的匿名 FTP 设置。\n\n### 41.5 管理用户类\n\nFTP 服务器根据源地址和登录类型将客户端分为不同的类。分类可以在\
  \ `WU-FTPD` 配置的多个位置使用，用于定义仅适用于某些客户端的设置。它还可以用于阻止来自网络外部的非匿名登录（甚至阻止所有登录）。如果你只想允许某些受信任的主机向你的服务器上传数据，并允许互联网上的任何人匿名登录下载，那么这将非常有用。\n\
  \n每个类都有一个名称、一个登录类型列表以及一个客户端地址、主机名或网络列表。只有同时匹配登录类型和地址的客户端才被认为属于该类。如果匹配到多个类，则使用第一个。不属于任何类的客户端将不被允许使用\
  \ FTP 服务器。\n\n`WU-FTPD` 识别以下三种类型的登录：\n- **UNIX**：普通的 UNIX 用户可以通过 `telnet` 或 `SSH`\
  \ 登录，并以其常规权限访问系统上的所有文件。\n- **Guest (客人)**：被指定为访客的 UNIX 用户。这些用户限制在一个目录（通常是他们的家目录），与匿名用户相同。更多详情请参见第\
  \ 41.7 节“设置客人用户”。\n- **Anonymous Users (匿名用户)**：匿名登录的用户被限制在特定目录。\n\n要使用该模块定义和编辑类，请遵循以下指令：\n\
  \n1. 点击模块主页左上角的 `Users and Classes` 图标。浏览器中将显示图 41.2 所示的表单。\n2. 页面顶部有一个标记为 `User\
  \ classes`（用户类）的表格。每行定义类，表中至少已经列出了一个（通常是 `all` 类，它匹配所有客户端）。表格底部始终有一个空行，供你添加新类。如果你想添加多个，则需要逐个创建。你可以通过更改其字段来编辑现有类，或通过清空名称字段来删除类。但请确保不要删除所有类，因为这将阻止所有用户登录。每个类的字段如下：\n\
  \    - **Class name (类名)**：此类的短名称，应仅由字母和数字组成，例如 `homenet` 或 `trusted`。多行可以具有相同的类名，匹配任意行中用户类型和地址的客户端都将被视为该类的成员。\n\
  \    - **User types (用户类型)**：此类匹配的登录类型，如上所述。你必须从三个复选框中至少选择一个。\n    - **Matching\
  \ addresses (匹配地址)**：在此字段中输入类匹配的客户端地址。你可以输入单个 IP（如 `192.168.1.1`）、主机名（如 `www.foo.com`）、通配符\
  \ IP 和主机名（如 `10.254.1.**` 或 `**.example.com`），甚至是包含此类地址和主机名的文件路径。多个条目之间必须用空格分隔。甚至允许否定条目如\
  \ `!foo.com`，这将匹配所有主机名不在 `foo.com` 域的客户端。使用主机名时要小心，因为 `WU-FTPD` 必须根据 IP 地址查找客户端的主名，结果可能被攻击者伪造。\n\
  \n完成类的定义后，点击表单底部的 `Save` 按钮。你现在可以在模块的其他页面中使用它们了。\n\n### 41.6 拒绝访问文件\n\n有时限制用户可以下载的文件类型是有用的，特别是对于不可信的匿名客户端。你可以阻止访问任何目录中的文件名（如\
  \ `secret.txt`）、绝对路径（如 `/etc/passwd`）甚至是目录及其所有内容（如 `/var/log`）。文件和路径名中也可以使用 shell\
  \ 通配符 `*` 和 `?`，这提供了额外的灵活性。如果你想保护包含机密信息的文件或限制客户端从特定目录（如 `/home`）下载，这将非常有用。然而，此功能无法阻止列出目录。\n\
  \n要设置文件名下载限制，请遵循以下步骤：\n\n1. 在主页上，点击 `Limits and Access Control` 图标，显示图 41.3 所示的表单。\n\
  \n##### 图 41.3. 限制和访问控制表单。\n\n![](img/41fig03.jpg)\n\n\n\n\n“拒绝访问文件”（Deny access\
  \ to files）表格中的每一行都定义了一个单一的文件限制。与此模块中的其他表格一样，表格底部有一个空行，用于添加新的文件名或路径；如果您是第一次使用此功能，则表格将仅包含一行。否则，将列出现有的限制，允许您对其进行编辑或删除。\n\
  \n每行中的字段及其含义如下：\n\n- **拒绝访问的文件 (Files to deny)**：一组要拒绝访问的相对或绝对文件名或模式列表，用空格分隔。通配符字符\
  \ `*` 和 `?` 均可用于两者，允许您输入如 `*secret.**` 或 `*/home/*/public_html*` 等文件。\n- **相对于 chroot\
  \ 吗？(Relative to chroot?)** 如果选择了 `Yes`，在第一个字段中输入的任何绝对路径都被视为相对于匿名 FTP 根目录。如果选择 `No`，则路径被视为相对于根目录。\n\
  - **针对类的拒绝 (Deny for classes)**：在此字段中，您必须为适用于限制的类选择复选框。有关如何添加自定义类的更多信息，请参阅第 41.5\
  \ 节“管理用户类”。如果您想阻止匿名客户端访问某些文件，但允许真实的 UNIX 用户访问，这会非常有用。\n\n“即使被拒绝也允许访问文件”（Allow access\
  \ to files even if denied）表格的结构与拒绝表格完全相同，但它用于输入文件名和路径，即使这些路径被上方表格中的条目拒绝，也允许访问。这可以用于拒绝访问所有内容（通过在“拒绝访问的文件”行中输入\
  \ `***`），然后仅对匹配模式的文件（例如 `**.html*`）重新授予下载权限。\n\n点击页面底部的 `Save`（保存）按钮以保存并激活任何新的文件限制。如果您想在任一表中添加多个条目，请再次点击\
  \ `Limits and Access Control`（限制与访问控制）图标重新显示表，并填写出现的新空行。\n\n还有一个类似的功能用于限制客户端可以上传的文件名。这对于阻止创建以点开头的隐藏文件或目录，或包含空格和控制字符的难以理解的名称非常有用。如果您允许上传，心机不正的人通常会利用这些手段在您的匿名\
  \ FTP 服务器上隐藏文件。由于受信任的人可能有创建此类文件的正当理由，您可以定义仅适用于匿名或游客用户的限制。\n\n要添加和编辑上传文件名限制，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击 `Permissions`（权限）图标。\n2. 在出现的表单中，底部的 `Disallowed upload filenames`（不允许上传的文件名）表格列出了不同类型用户允许和拒绝的文件名。可以通过只需更改表格中的字段来编辑现有限制，并通过填写最后一行空行来创建新限制（如果您以前使用过此表单，则表格将仅包含一行）。表格中的列及其字段的含义如下：\n\
  \n- **允许的字符 (Allowed characters)**：所有上传文件必须匹配的单个 Perl 正则表达式。例如，如果您输入了 `^[a-z]+$`，则只允许由小写字母组成的文件名。\n\
  - **拒绝的文件正则 (File regexps to deny)**：一组用空格分隔的正则表达式列表，这些不允许出现在文件名中。一个很好的例子是 `^\\\
  .*`，它会阻止任何以点开头的名称，从而隐藏文件。\n- **用户类型 (User types)**：适用于此限制的用户类型。通常，您可能希望对匿名客户端设置比真实用户或游客更严格的限制。\n\
  - **错误消息文件 (Error message file)**：文件的完整路径，该文件将发送给任何尝试上传不符合允许表达式或匹配拒绝表达式文件的客户端。\n\
  \n一如既常，点击页面底部的 `Save`（保存）按钮以激活任何新限制。\n\n如果为同一种用户类型定义了多个限制，将检查所有限制以确定上传的文件名是否允许。\n\
  \n### 41.7 设置游客用户 (Setting Up Guest Users)\n\n游客 FTP 用户是真实的 UNIX 用户，被 `WU-FTPD`\
  \ 限制在特定目录，就像匿名客户端受到限制一样。尽管如此，他们在该目录下仍然拥有完全权限，包括上传文件、重命名和更改文件权限（chmod）的权利。如果您想防止用户查看其家目录之外或某些父目录（如\
  \ `/home`）的文件系统部分内容，将用户限制为游客访问可能是很有用的。\n\n由 FTP 服务器配置指定为游客的每个用户都可以有不同的根目录，也可以某些用户是相同的。然而，所选根目录必须以类似于匿名\
  \ FTP 根目录的方式进行设置，即匿名 FTP 根目录下有包含 `bin`、`lib` 等子目录，这些子目录包含了 `WU-FTPD` 所需的所有程序和文件。您可以直接从匿名根目录复制这些目录，因此设置过程并不困难。\n\
  \n要将用户设置为游客，必须对其家目录进行特殊修改。使用 Webmin 执行此操作时，请遵循以下步骤：\n\n1. 进入 `Users and Groups`（用户与组）模块（见第\
  \ 4 章），并点击您想要限制的用户名称。\n2. 将其家目录更改为 `guestroot/./homedir`，其中 `guestroot` 是您准备的根目录，`homedir`\
  \ 是其子目录。如果您使用 `/home` 作为根目录，`/home/./jcameron` 可以是用户 `jcameron` 的目录。路径中的此特殊 `/./`\
  \ 告诉 `WU-FTPD` 根目录在哪里，但不会让其他程序产生混乱。\n3. 点击页面底部的 `Save`（保存）按钮。如有必要，Webmin 将将其移动到新位置。\n\
  \n当然，您在创建新用户时也可以指定这样的家目录。但这只是第一步。要配置 `WU-FTPD` 将某些用户视为游客，您需要遵循以下步骤：\n\n1. 在 `WU-FTPD`\
  \ 服务器模块中，点击 `Users and Classes` 图标显示图 41.2 所示的表单。\n2. 在 `Unix users and UIDs to\
  \ treat as guests` 字段中，输入用空格分隔的用户名、UID 或 UID 范围（例如 `%1000-2000` 或 `%5000-*`），将这些用户指定为游客。\n\
  3. 您还可以在 `Unix groups and GIDs to treat as guests` 字段中输入组名、ID 和 ID 范围列表，以便将其所有主要成员也视为游客。\n\
  4. 为了防止某些用户即使在第 2 步设置的列表或范围内也被转换为游客，请填写 `Unix users and UIDs not to treat as guests`\
  \ 和 `Unix groups and GIDs not to treat as guests` 字段。如果您想让除少数受信任的用户之外的每个人都成为游客，此功能将非常用。\n\
  5. 点击页面底部的 `Save`（保存）按钮以激活新的游客指定。\n\n如果用户已配置为游客但其家目录没有 `/./`，则他将不会被限制在任何根目录下。\n\n\
  ### 41.8 编辑目录别名 (Editing Directory Aliases)\n\n为了经常需要访问长路径目录的用户提供方便，`WU-FTPD` 允许您定义目录别名，在切换到不同目录可以使用这些别名。这意味着使用命令行\
  \ FTP 客户端的人可以输入 `cd stuff:` 而不是 `cd /usr/local/etc/stuff`，假设已创建了相应的别名。\n\n要设置别名，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击 `Aliases and Paths`（别名与路径）图标。\n2. `CD directory aliases` 字段实际上是一个表格，列出了现有的别名（如果有），并且始终有一个空行用于添加新别名。在\
  \ `Alias name`（别名名称）列下的第一个空字段中，输入新别名的名称，例如 `stuff:` 或 `junk:`。虽然不要求别名以冒号结尾，但这是一个好主意，因为减少了别名与实际相对目录重名的风险。\n\
  \n\n\n\n在“别名目录”（Alias to directory）下的相应字段中，输入一个类似 `/usr/local/junk` 的完整目录路径，作为别名所指向的路径。如果你想添加多个别名，则需要保存并重新打开此页面，以便出现一个新的空白行。若要删除某个别名，只需清除表格中两个字段的内容。\n\
  \nCD 目录搜索路径文本框允许你输入一个目录列表，当客户端尝试切换到当前目录之外的相对子目录时，将搜索这些目录。例如，如果包含了 `/usr/local`，且客户端尝试切换到\
  \ `bin` 目录，将被置于 `/usr/local/bin`（假设不存在真实的 `bin` 子目录）。\n\n点击页面底部的 `Save`（保存）按钮以激活新别名。\n\
  \n别名在向用户展示目录列表供点击的图形化 FTP 客户端中并不特别实用。因为用户不会（且通常无法）切换到如 `stuff:` 这样的明确伪目录，且别名未包含在列表中，因此它们很难使用。像\
  \ `ncftp` 和经典的 UNIX `ftp` 程序这种类命令的 FTP 客户端更适合使用它们。\n\n### 41.9 消息与 Readme 文件\n\n\
  WU-FTPD 可以配置为在客户端登录或进入某些目录时向其发送各种消息文件的内容。对于向 FTP 用户显示您的 FTP 服务器信息（例如由谁运行以及托管了哪些文件）或特定目录内容的详情非常有用。在单个会话中，每个文件仅向客户端发送一次，以避免重复消息骚扰用户。\n\
  \n服务器还可以设置为通知客户端某些文件的存在性，并告知它们这些文件的最后修改日期。这通常用于包含关于目录或服务器的次要信息的 `README` 文件，用户可能想要阅读这些信息。同样，每个此类文件在每个会话中仅通知一次。\n\
  \n要定义消息和横幅文件，请遵循以下步骤：\n\n点击模块主页上的 `Messages and Banners`（消息与横幅）图标，这将带你进入图 41.4 所示的形式。\n\
  \n##### 图 41.4 消息与横幅表。\n\n![](img/41fig04.jpg)\n\nMessage（消息）文件部分是一个用于指定要发送给客户端内容的文件的表格。按照\
  \ Webmin 表格的习惯，它列出了现有文件及其上下文，并在底部留有一行空白用于添加新文件。字段的含义如下：\n\n- **Path**：要发送给客户端内容的文件路径。可以是类似于\
  \ `/etc/login.message` 的绝对路径，也可以是类似于 `message.txt` 的相对文件名。对于后者，将在客户端进入的每个目录中查找。如果你输入了完整路径并希望匿名客户端看到它，它必须位于匿名\
  \ FTP 根目录下。\n- **When to display**：如果选择 `At login`（登录时），文件将在登录后发送给客户端。如果选择 `Entering\
  \ any dir`（进入任何目录），将在切换到任何目录时搜索并发送文件。当选择 `Entering dir`（进入目录），只有在进入相邻文本框中指定的目录路径时才会发送文件。同样，对于匿名客户端，这必须相对于根目录。\n\
  - **Classes to display for**：如果此字段为空，消息将发送给所有客户端。但如果输入了一个或多个客户端类（用空格分隔），它将仅适用于这些类别的客户端。这对于为匿名用户定义消息文件非常有用，特别是在使用绝对路径时。\n\
  \n要定义需要通知客户端其存在的文件，你需要填写 `README` 文件表格。同样，它列出了所有现有文件，并留有一个空白行添加单个新文件。该表格列的字段含义如下：\n\
  \n- **Path**：应向客户端发送其存在性和修改时间的文件路径。可以是类似于 `/etc/README` 的绝对路径，也可以是相对于进入目录的文件名，如\
  \ `README.txt`。你甚至可以在文件名中使用 shell 通配符如 `*` 和 `?` 来匹配多个文件，例如 `README**`。\n- **When\
  \ to display last modified date**：如果选择 `At login`，信息将在登录后发送给客户端。如果选择 `Entering any\
  \ dir`，将在切换到任何目录时搜索文件并发送其修改日期。当选择 `Entering dir`，只有在进入相邻文本框中指定的目录路径时才会发送修改日期。\n\
  - **Classes to display for**：如果此字段为空，修改信息将发送给所有客户端。但如果输入了一个或多个客户端类（用空格分隔），它将仅适用于这些类别的客户端。\n\
  \n要更改 WU-FTPD 在客户端连接时发送的信息量，请调整 `Greeting level`（欢迎级别）字段。如果选择 `Hostname and version`（主机名和版本），将同时发送系统主机名和\
  \ FTP 服务器版本。如果仅选择 `Hostname`（主机名），则仅显示主机名。如果选择 `Neither`（两者），则不发送任何信息。后两种选项最安全，因为攻击者可能利用你的\
  \ FTP 服务器版本找到可以被利用来接管系统的漏洞。\n\n如果你希望服务器在客户端连接后立即向其发送消息，将其放入文件并在 `Pre-login banner\
  \ file`（登录前横幅文件）字段中选择 `From file`（来自文件）选项。然后在附近的文本框中输入消息文件的完整路径。\n\n要更改 WU-FTPD\
  \ 在欢迎和其他消息中发送的主机名，选择 `Hostname for messages` 字段中的第二个选项并在文本框中输入备名称。如果你的系统真实主机名与 FTP\
  \ 客户端使用的名称不匹配（例如 `server5.example.com` 而不是 `ftp.example.com`），这将非常有用。\n\n完成表单后，点击\
  \ `Save` 按钮激活更改。这些更改将适用于从现在起连接的所有新 FTP 客户端。\n\n在许多操作系统上，WU-FTPD 配置默认会包含一两个消息和 README\
  \ 文件定义。`.message` 文件通常会在每个目录中搜索并发送给客户端，任何文件名匹配 `README*` 模式的文件修改时间也是如此。\n\n你定义的任何消息文件都可以包含以\
  \ `%` 开头的特殊代码，这些代码在文件发送时会被动态生成的文本替换。例如，`%U` 被替换为客户端的 FTP 登录名，因此包含行 `Welcome %U to\
  \ the example.com FTP server` 的文件将作为类似 `Welcome jcameron to the example.com FTP\
  \ server` 内容发送给客户端。根据 WU-FTPD 手册，可用代码见表 41.1。\n\n### 41.10 配置日志记录\n\n在典型的默认配置中，WU-FTPD\
  \ 将所有上传和下载记录到 `/var/log/xferlog`。然而，你可以选择执行日志记录的用户类型（UNIX、匿名或访客），将日志写入 syslog 代，并选择记录某些类型用户违反安全规则的命令。记录到系统日志提供了更大的灵活性，因为你可以选择将消息写入哪些文件，尽管它们会与其他守护进程的消息混合在一起。请参第\
  \ 13 章和系统日志模块以获取有关 syslog 如何工作以及它最终写入哪些文件的更多信息。\n\n启用所有命令的日志记录允许你精确跟踪客户端在做什么，但这可能会消耗大量磁盘空间。记录安全违规行为（尝试违反\
  \ WU-FTPD 文件限制，见第 41.6 节“拒绝访问文件”）对于检测黑客非常有用，且不太可能占用过多空间，因为此类违规行为通常不会很频繁。\n\n要在 Webmin\
  \ 中编辑 FTP 日志相关的选项，请遵循以下步骤：\n\n\n\n\n在模块的主页上，点击 `Logging` 图标即可弹出小型日志选项表单。\n\n若要将客户端执行的所有\
  \ FTP 命令（包括如 `CWD` 和 `LIST` 等简单命令）记录在系统日志中，请从 `Log all commands for` 字段中选择需要记录这些命令的用户类型。\n\
  \n若要更改执行传输记录的用户类型，请从 `Log transfers for` 字段中选择这些用户。`In` 方向子字段允许您选择记录上传（`Inbound`）、下载（`Outbound`）还是两者均有（`Both`）。在匿名\
  \ FTP 服务器上，由于下载量巨大，仅记录上传可能很有意义。\n\n若要将传输写入 `syslog`，请在 `Log transfers to` 字段中选择\
  \ `System log`。或者，若要让 `WU-FTPD` 写入 `/var/log/xferlog` 文件代替，请选择 `XFER log file`。如果选择了\
  \ `Both`，传输将同时记录到两个目标。如果您想使用像 `Webbalizer`（在第 39 节介绍）之类的程序来分析 FTP 服务器日志，则必须将其写入\
  \ `xferlog`，因为由 `syslog` 输出的行会添加额外信息，从而无法解析。\n\n写入系统日志的内容将使用守护进程设施（daemon facility），除非\
  \ `WU-FTPD` 在编译时使用了不同的设施（例如 `local7`）。这实际上非常有用，因为它允许您将 FTP 消息分离出来并写入不同的文件，同时仍享受\
  \ `syslog` 的所有优势。\n\n#### 表 41.1 消息文件中可以使用的代码\n\n| % | 描述 |\n| :--- | :--- |\n|\
  \ `%T` | 服务器的本地时间，格式如 `Thu Nov 15 17:12:42 1990` |\n| `%F` | 当前目录所在文件系统的剩余空间，单位为\
  \ KB |\n| `%C` | 当前工作目录 |\n| `%E` | 维护者的电子邮箱地址 |\n| `%R` | 远程主机名 |\n| `%L` | 本地主机名\
  \ |\n| `%u` | 通过 `ident` 身份验证确定的远程用户名 |\n| `%U` | 登录时提供的用户名 |\n| `%M` | 此类中允许的最大用户数\
  \ |\n| `%N` | 此类中当前的用户数 |\n| `%B` | 分配磁盘块的绝对限制 |\n| `%b` | 磁盘块的优先限制 |\n| `%Q` |\
  \ 当前块计数 |\n| `%I` | 最大已分配的 inode 数量 (+1) |\n| `%i` | 优先的 inode 限制 |\n| `%q` | 当前已分配的\
  \ inode 数量 |\n| `%H` | 磁盘使用过度的时间限制 |\n| `%h` | 文件使用过度的时间限制 |\n\n若要启用对尝试的文件名安全违规行为的记录，请从\
  \ `Log security violations for` 字段中选择启用此功能的用户类型。这些内容将始终写入 `syslog`。\n\n点击页面底部的 `Save`\
  \ 按钮以保存并激活新的日志设置。\n\n### 41.11 限制并发登录\n\n如果您的系统配置为允许匿名 FTP 登录且预计会接收大量流量，那么限制同时向\
  \ FTP 服务器打开的连接数是有意义的。这为 FTP 传输可能产生的网络和 CPU 负载设置了上限，这对于系统被用于其他用途（例如运行 Web 服务器）来说非常重要。\n\
  \n`WU-FTPD` 允许您按类定义限制，从而使匿名客户端不受限制。（注：提供的文本在此节中包含重复/碎片化的句子；根据指令，已保留核心内容）。\n\n\n\n\
  \n\nWU-FTPD 可以配置以限制某些类型和类别的用户使用的 FTP 命令。这对于阻止匿名客户端修改文件有用，因为在大多数 FTP 服务器上，它们只被允许下载，而不允许上传、重命名或删除。事实上，WU-FTPD\
  \ 在其通常的默认配置中正是这样设置的。\n\n你可以限制五种命令的访问，它们都与服务器端的数据修改有关。它们是：\n\n- `chmod`：更改服务器文件的\
  \ UNIX 权限（UNIX FTP 客户端中使用 `chmod`）。\n- `delete`：删除服务器上的文件或目录（UNIX FTP 客户端中使用 `del`\
  \ 或 `rmdir`）。\n- `rename`：更改文件或目录的名称（FTP 客户端中使用 `rename`）。\n- `overwrite`：上传与现有文件同名的文件。\n\
  - `umask`：更改新创建文件的默认 UNIX 权限（UNIX FTP 客户端中使用 `umask`）。\n\n无法阻止客户端使用目录列表或下载命令。同样无法使用此功能防止上传尚不存在的文件。然而，可以通过适当设置目录权限或如第\
  \ 41.6 节“拒绝访问文件”所说明的那样，阻止所有上传的文件名来实现这一点。\n\n要定义哪些客户端可以使用特定命令，请遵循以下步骤：\n\n1. 点击模块主页上的权限（Permissions）图标。\n\
  2. 在弹出的表上，命令限制表列出了现有命令以及允许或不允许使用这些命令的用户类型和客户端类。按照习惯，你可以使用底部的空白行添加新命令，编辑现有条目，或通过从命令菜单中选择空白选项来完全删除对命令的限制。\n\
  3. FTP 服务器在客户端尝试执行操作时，会按降序处理此表，并根据第一个匹配的条目在 `Allow?` 列中的选择来决定是否允许。这意味着顺序是重要的，如果两个条目匹配，表中的第一个条目将决定执行结果。\n\
  \n每行的字段及其含义如下：\n\n- `Command`：你必须从此菜单中选择要限制的命令，或选择空白选项以删除该行。\n- `Allow?`：此字段决定允许匹配所选用户类型和类别的客户端尝试使用该命令。\n\
  - `For user types`：限制仅适用于此列中选择的用户类型。详情请参阅本章前面的第 41.5 节“管理用户类”。\n- `For classes`：只有此列中选择的客户端类将受到限制的影响。\n\
  \n完成表格的编辑或添加后，点击 `Save`（保存）按钮激活你的更改。\n\n如果客户端命令不匹配表中的任何条目，FTP 服务器将允许执行（除非被在处设置的其他文件名限制所阻止）。\n\
  \n### 41.14 配置 WU-FTPD 服务器模块\n\n要更改模块用于 WU-FTPD 配置文件和程序的路径，你需要点击主页左上角的标准“Module\
  \ Config”（模块配置）链接。与其他模块不同，这里没有与用户界面相关的选项，因此如果该模块运行正常，你可能不需要在配置表单上调整任何内容。默认情况下，所有配置字段都设置为与你的操作系统或\
  \ Linux 发行版包含的 WU-FTPFD 软件包匹配。可配置字段见表 41.2。\n\n##### 表 41.2. 模块配置选项\n\n| 字段名称 |\
  \ 说明 |\n| :--- | :--- |\n| wuftpd 的完整路径 | 此字段必须包含 WU-FTPD 服务器程序的完整路径，例如 `*/usr/sbin/in.ftpd`。如果路径错误，模块将认为服务器未安装。\
  \ |\n| ftpaccess 文件的完整路径 | 此字段必须包含主 `ftpaccess` 配置文件的完整路径，通常位于 `/etc` 中。同样，如果找不到，主页将显示错误。\
  \ |\n| ftpconversions 文件的完整路径 | 此字段应包含 `ftpconversions` 文件的完整路径。 |\n| ftpgroups\
  \ 文件的完整路径 | 此字段应包含 `ftpgroups` 文件的路径。 |\n| ftphosts 文件的完整路径 | 此字段应包含 `ftphosts`\
  \ 文件的路径。 |\n| ftpusers 文件的完整路径 | 此字段必须包含 `ftpusers` 文件的完整路径，它列出了不允许登录 FTP 服务器的用户。\
  \ |\n| FTP 服务器 PID 文件 | 如果你在独立模式下运行 WU-FTPD，此字段必须包含其进程 ID 文件（PID file）的完整路径。如果路径错误，模块会在服务器实际运行时假设其未运行。\
  \ |\n\n 尽管有除 `ftpaccess` 之外的其他配置文件的字段，但在本书编写时，该模块尚未实际编辑这些文件。\n\n### 41.15 总结\n\n\
  读完本章后，你应该理解 WU-FTPD 服务器的作用以及它与 ProFTPd 等其他 FTP 服务器的比较。你还应该知道如何设置它，以及如何执行配置任务，如限制目录和文件的访问、指定消息文件以及创建别名。你还应该理解匿名和访客访问是如何工作的，以及在\
  \ WU-FTPD 中启用这些形式需要哪些文件。\n\n## 第 42 章 SSH 服务器配置\n\n本章解释了 SSH 协议以及如何使用 Webmin 配置你系统上的\
  \ SSH 服务器和客户端。\n\nSSH 是一种通过网络安全地登录 UNIX 系统并在其之间传输文件的协议。所有 SSH 流量都是加密的，因此任何监听网络的人都无法获取密码，这比不安全的\
  \ telnet 和 FTP 协议有了巨大的改进。在某种意义上，SSH 可以被视为这些协议的安全替代品，尽管事实上它可以用于更多用途。\n\nSSH 服务器是运行在\
  \ UNIX 系统上的守护进程，等待连接。SSH 客户端是由用户（或通过脚本）运行的程序，连接到服务器以启动远程登录会话或传输某些文件。客户端和服务器互相进行身份验证，以便双方都能确定对方的身份。客户端验证通过用户名和密码或用户名和私钥来完成，而服务器验证始终使用密钥。\n\
  \n有许多不同的 SSH 客户端和服务器可用，但 UNIX 系统上最常用的两个客户端/服务器软件包是免费提供的（开源）OpenSSH 和原始的商业 SSH。此外，该协议还有两个不兼容的版本，即版本\
  \ 1 和 2。幸运的是，这两个软件包的最新版本都支持这两个版本。\n\n目录 `/etc/ssh` 包含了 SSH 服务器使用的所有配置文件，尽管文件名相同，但它们的格式略有不同。主文件名为\
  \ `sshd_config`，由一系列指令组成，每行一个。按照 UNIX 服务器配置文件的惯例，每个指令设置了某些选项，例如被拒绝的用户列表或监听的 IP 地址。该目录还包含\
  \ `ssh_config` 文件，它设置了适用于运行在你系统上的 SSH 客户端程序（如 `ssh` 和 `scp`）的选项。本章涵盖的 Webmin 模块可以直接编辑这两个文件。\n\
  \n### 42.2 SSH 服务器模块\n\n本章涉及 SSH 和 OpenSSH 服务器的配置，并假设你对客户端程序有基础知识。用于执行此配置的 Webmin\
  \ 模块名为 `SSH Server`，可以在“Servers”（服务器）类别下找到。点击其图标将带你进入图 42.1 所示的主页（假设是已安装 SSH 包）。\n\
  \n##### 图 42.1. SSH 服务器模块。\n\n![](img/42fig01.jpg)\n\n\n\n\n\n如果出现类似 `The SSH server\
  \ config file /etc/ssh/sshd_config was not found on your system` 的错误信息，说明你的系统中可能没有安装\
  \ SSH 服务器。大多数现代 Linux 发行版都带有 `OpenSSH` 软件包，因此请检查你的发行版 CD 或网站，查找名称以 `openssh` 或 `ssh`\
  \ 开头的包。通常会有几个包，例如 `openssh`、`openssh-client` 和 openssh-server`，它们都应该安装。你可能还需要安装\
  \ `OpenSSL` 库，它通常也以包的形式提供。使用 `Software Packages` 模块（第 12 节介绍）来检查并安装所有需要的内容。\n\n\
  如果你的操作系统没有 `SSH` 包，你将需要下载、编译并安装 `OpenSSH` 或 `SSH` 源码。正如你预期的那样，可以在 [www.openssh.org/](http://www.openssh.org/default.htm)\
  \ 找到 `OpenSSH`，而原始的 `SSH` 可以从 [www.ssh.com/](http://www.ssh.com/default.htm) 下载。只要你有可用的编译器，在任何\
  \ UNIX 系统上安装都应该是很容易。唯一的依赖是像 `OpenSSL` 这样的 SSL 库，它可以从 [www.openssl.org/](http://www.openssl.org/default.htm)\
  \ 下载。\n\n安装完成后，你应该确保 `SSH` 服务器会在开机时启动。使用 `Bootup and Shutdown` 模块（来自第 9 节）创建一个在启动时运行\
  \ `sshd` 命令的动作。如果已经存在名为 `sshd` 或 `ssh-server` 的动作，你只需要确保它是已启用状态即可。\n\n无论你如何安装 `SSH`\
  \ 服务器，一旦服务器进程启动，它都应该允许客户端立即使用默认配置进行登录和文件传输。事实上，在典型系统上，几乎不需要任何配置，因为默认设置适用于大多数服务器。\n\
  \n两种不同的 `SSH` 实现及其许多版本都具有略有不同的配置文件格式，模块需要对这些格式进行适配。这意味着构成其用户界面的表单和字段并不总是相同的，这取决于你安装的服务器版本和类型。本章中的说明和截图是针对\
  \ `OpenSSH` 2.5 版本编写的，但也会提到其他 SSH 版本具有的任何差异或额外功能。\n\n主页将始终显示六个图标，每个图标下方都有一个表单，包含设置身份验证或网络等类别相关选项的字段。顶部显示已安装的\
  \ `SSH` 实现方式和版本，以便你可以查看本章中的哪些指令适用于你的系统。底部有一个标记为 `Apply Changes` 的按钮，点击它可以信号 `SSH`\
  \ 服务器重新读取其配置文件。在模块中进行的任何更改在点击此按钮之前都不会生效。\n\n### 42.3 限制对 SSH 服务器的访问\n\n默认情况下，任何\
  \ UNIX 用户都将允许远程登录你系统上的 `SSH` 服务器，或使用它上传下载文件。然而，在邮件服务器系统或托管网站的系统上，这可能并不合适。你可能希望大多数用户只登录你的\
  \ `POP3`、`FTP` 或 `Usermin` 服务器。虽然通过给他们提供如 `/bin/false` 的 shell 可以实现，但这会导致用户的 `Cron`\
  \ 或 `At` 任务出现其他问题。\n\n幸运的是，`SSH` 服务器可以配置为限制登录用户。只需按照以下步骤操作：\n\n1. 在模块的主页上，点击 `Access\
  \ Control` 图标，调出列允许和拒绝用户的表单。\n2. 要阻塞少数用户以外的所有员，在 `Only allow users` 字段中输入用空格分隔的用户名列表。可以使用\
  \ `*` 和 `?` 通配符，例如你可以输入 `*foo*` 来允许任何名称以 `*foo` 开头的用户。\n3. 你也可以通过填写 `Only allow\
  \ members of groups` 字段来拒绝除某些组成员以外的所有人的 `SSH` 访问。任何匹配组的辅助成员的用户也将被允许。如果两个字段都填写了，则其中任一字段指定的用户都将被允许。\n\
  4. 你还可以使用 `Deny users` 和 `Deny members of groups` 字段仅阻塞少数特定的用户或组。同样，可以使用通配符，且如果两个字段都填写了，来自任一字段的用户都将被拒绝。\n\
  5. 如果你运行 `SSH`，表单上还会出现 `Only allow client hosts` 和 `Deny client hosts` 字段。如果填写了，前者告诉\
  \ `SSH` 服务器拒绝除输入的 IP 地址或主机名之外的任何连接，而后者则告诉它仅拒绝相邻字段中列出的主机和地址。这两个字段都接受 `*` 和 `?` 通配符。\n\
  6. 如果你的系统安装了 `OpenSSH`，你可以使用 TCP-wrappers 配置 `/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 来阻塞不受信任的客户端。遗憾的是，还没有用于编辑这些文件的标准 Webmin 模块。\n7. 点击页面底部的 `Save` 按钮更新 `SSH` 服务器配置文件并返回主页。\n\
  8. 点击 `Apply Changes` 按钮激活新的限制。\n\n### 42.4 网络配置\n\n`SSH` 服务器有几个选项，允许你配置它监听的 IP\
  \ 地址、使用的端口以及各种协议相关的设置。要编辑它们，请遵循以下步骤：\n\n1. 点击模块主页上的 `Networking` 图标，显示如图 42.2 所示的表单。\n\
  \n##### 图 42.2. 网络选项表单。\n\n![](img/42fig02.jpg)\n\n默认情况下，服务器将接受到系统任何 IP 地址的连接。要更改此设置（可能是因为你希望仅从内部局域网访问），选择\
  \ `Listen on address` 字段中的第二个单选按钮，并在文本框中输入 IP 地址。\n\n如果你运行 `OpenSSH` 3 版本或以上版本，此字段将包含一个表格，你可以在其中输入多个地址和端口。上方有两个单选按钮：`All\
  \ addresses`（如果选中，则告诉服务器接受到任何 IP 地址的默认端口的连接）和 `Entered below`（表示应使用表格中的地址和端口）。按照\
  \ Webmin 表格的惯例，该表格底部总有一个空行，用于添加新的地址和端口。如果尚未定义任何内容，它将只包含一个空行。表格两列中字段的含义如下：\n\n- `Address`：在此字段中，你必须输入服务器列出的单个\
  \ IP 地址或主机名。\n- `Port`：如果在此列中选择 `Default`，则将使用第 3 步设置的标准端口。如果选择第二个选项，`SSH` 服务器将监听在该列文本框中输入的端口。\n\
  \n要要更改 `SSH` 服务器监听连接的端口，请编辑 `Listen on port` 字段。如果你确实更改了它，客户端在连接时需要指定新端口。如果你的系统使用\
  \ `OpenSSH` 3 或以上版本，此字段仅设置默认端口，可以在 `Listen on address` 表格中进行覆盖。\n\n在 `Accept protocols`\
  \ 字段中，勾选你的服务器应该接受的 `SSH` 协议版本。通常允许两者是明智的，这样旧版或新的客户端就可以顺畅地连接。此字段仅在你运行 `OpenSSH` 时出现；然而，根据你安装的\
  \ `SSH` 版本，`SSH` 只接受版本 1 或 2。\n\n\n\n\n如果你正在运行 SSH，可以使用 `Idle timeout` 字段来断开在一段时间内没有发送或接收任何数据的客户端。选择第二个单选按钮，在文本框中输入一段时间，并从菜单中选择该时间段的单位。如果选择了\
  \ `Default`，无论客户端空置多久，都不会被切断连接。在繁忙的系统中，此功能可以用于防止人们让空置的 SSH 会话开启数几天，因为每个会话都关联着消耗内存的\
  \ `sshd` 和 shell 进程。\n\n要让 SSH 服务器断开未正常注销就关闭或崩溃的客户端，请在 `Disconnect if client has\
  \ crashed?` 字段中选择 `Yes`。服务器将定期向客户端发送消息以确保其确实仍在运行，如果没有回复，则关闭连接。你可能想要选择 `No` 的唯一情况是这些额外流量会对你的网络产生问题，例如在没有真正需要的情况下自动激活\
  \ ISDN 或拨号连接。\n\n要配置服务器在客户端连接后等待其进行身份验证的时间，请更改 `Time to wait for login` 字段。如果选择了\
  \ `Forever`，无论花费多久时间，服务器都不会断开客户端，这可能允许攻击者通过建立大量无操作的 SSH 连接来使你的系统过载。\n\nSSH 协议较有趣的特性之一是它支持端口转发，这允许客户端访问服务器网络上它们通常无法访问的端口。尽管这对用户非常有用，但你可能认为它存在安全风险，因为它允许任何能够建立\
  \ SSH 连接的人实际上绕过对内部服务器的 IP 地址限制。要关闭此功能，请将 `Allow TCP forwarding?` 字段更改为 `No`。\n\n\
  此字段仅在你运行 SSH 2 或更高版本或 `OpenSSH` 时才会出现。\n\n一个相关的字段是 `Allow connection to forwarded\
  \ ports?`，它决定了是否允许服务器以外的其他主机连接到重回给客户端的端口。你可能希望将其设置为 `No`，以保护客户端用户免受攻击者误用可能不安全的转发连接回客户端网络的影响。然而，该字段仅在你的系统运行\
  \ `OpenSSH` 2 或更高版本时才会显示。\n\n要让服务器查找客户端地址的主机以及这些主机名的地址，然后拦截不匹配的项，请在 `Reverse-validate\
  \ client IP addresses?` 字段中选择 `Yes`。如果你已经建立了基于主机名的访问控制，并想要检测使用伪造 DNS 记录的攻击者，则此字段非常有用。此字段在你运行\
  \ `OpenSSH` 2.3 或更高版本时才可见。\n\n要保存并激活你的更改，点击页面底部的 `Save` 按钮，然后在模块的主页点击 `Apply Changes`。更改将对任何新的客户端连接生效。\n\
  \n### 42.5 身份验证配置\n\n所有的 SSH 实现都有与客户端如何身份验证以及登录后向其显示的消息相关的选项。具体来说，你可以通过用户名和密码或用户名和证书允许或拒绝身份验证，阻止\
  \ root 用户登录，并控制是否信任 rlogin 风格的 `.rhosts` 文件。然而，不同 SSH 版本之间的具体选项差异很大，因此在 `OpenSSH`\
  \ 中可以实现的功能在你运行商业版 SSH 服务器时可能无法实现。\n\n要编辑身份验证设置，请按照以下步骤操作：\n\n点击模块主页上的 `Authentication`\
  \ 图标，调如图 42.3 所示的表单。\n\n### 图 42.3 身份验证选项表单。\n\n![](img/42fig03.jpg)\n\n在 `Notify\
  \ user of new mail?` 字段上选择 `Yes`，以便用户在登录时获知邮件文件中的任何新邮件。不过，这仅在你使用系统上的标准邮件文件位置时起作用，如果邮件投递到用户主目录下的\
  \ `Mailbox` 或 `Maildir`，则不生效。\n\n要防止用户使用密码登录，请将 `Allow authentication by password?`\
  \ 字段更改为 `No`。这意味着仅接受证书身份验证，这对于从未登录过因此无法创建私密钥的用户来说不是太好用。只有当你的系统使用 `NFS` 挂载的主目录，或者存在其他其他机制让用户设置公钥时，此字段才有用。如果你运行\
  \ SSH 3 或更高版本，则此字段不可用。\n\n要允许或拒绝使用空密码登录（假设这对于用户实际上是正确的），请更改 `Permit logins with\
  \ empty passwords?` 字段。你可能希望在用户通过其他方法设置密码之前阻止此项。\n\n尽管通过 SSH 进行 root 登录比通过 telnet（未加密）登录要安全得多，你可能仍然想阻止这种登录。要做到这一点，请从\
  \ `Allow login by root?` 菜单中选择 `No`。你也可以选择 `Only with RSA auth` 以强制 root 登录使用证书进行身份验证，或选择\
  \ `Only for commands` 仅允许执行单个命令而不是允许完全交互式登录。然而，最后一个选项仅在系统运行 `OpenSSH` 2 或更高版本时可用。\n\
  \n要停止用户使用证书进行身份验证（从而强制使用密码），请从 `Allow RSA authentication?` 字段中选择 `No`。你可能想这样做是为了强制人们每次输入密码，而不是依赖可能未加密的私钥为他们执行身份验证。\n\
  \n要停止服务器严格检查用户在 `~/ssh` 目录下的文件的权限，请在 `Check permissions on key files?` 字段中选择 `No`。尽管从安全角度来看关闭这些检查是一个坏主意，但对于那些设置了错误权限且无法理解为什么无法通过证书身份验证的用户来说，这些检查可能会很困扰。\n\
  \n要让服务器在用户登录后显示今日事消息文件的内容，请在 `Display /etc/motd at login?` 字段上选择 `Yes`。此文件通常包含关于你的系统的信息或给用户的通知。\n\
  \n如果你想在客户端登录之前向其发送消息，请选择 `Pre-login message file` 字段中的第二个选项，并在相邻的文本框中输入包含要发送文本的文件完整路径。这些文本通常包含关于未经授权使用系统的警告。\n\
  \n此字段仅在你运行 `OpenSSH` 2.3 或 SSH 2 或更高版本时可用。\n\n页面上的其余选项与使用 `rhosts` 和 `/etc/hosts.equiv`\
  \ 文件的 rlogin 风格身份验证有关。由于它们信任客户端主机已经对连接的用户执行了身份验证，由于源 IP 地址很容易伪造，它们相当不稳定。因此，不建议启用这种身份验证。\n\
  \n要保存并激活你的新身份验证设置，点击表单底部的 `Save` 按钮，然后在主页点击 `Apply Changes`。\n\n### 42.6 编辑客户端主机选项\n\
  \n尽管 SSH Server 模块主要用于配置 SSH 服务器，但它允许你设置适用于从你的系统使用 `ssh` 和 `scp` 命令建立的所有客户端连接的选项。可以针对所有主机的连接设置选项，也可以仅针对特定主机设置。你可以设置连接的端口、使用的协议以及要转发的本地和远程端口。\n\
  \n\n\n\n\n在本模块中进行的设置将适用于系统上的所有用户，但可以由编辑其 `~/.ssh/config` 文件的个人用户覆盖。这可以通过手动完成，也可以使用\
  \ Usermin，Usermin 包含一个 `SSH Client` 模块，其界面与此处记录的编辑全局客户端设置界面相同。虽然可以使用 Webmin 进行这些设置，但许多设置对于所有用户来说并没有太大意义。因此，本节的说明仅涵盖在全局范围内有用的字段。\n\
  \n要定义针对特定主机的连接设置，请遵循以下步骤：\n\n在模块的主页上，点击 `Client Host Options` 图标。将显示一个页面，其中每个设置了选项的主机都有一个图标。除非你之前使用过此页面，否则只会出现特殊的\
  \ `All hosts` 图标，点击它可以编辑对任何主机连接的选项。\n\n点击页面底部的 `Add options for client host` 链接，弹出一个用于指定主机及其适用选项的表单。表单上的所有字段都有一个\
  \ `Default` 选项，如果选择了该选项，则表示应使用所有主机的设置。这允许你全局定义选项，然后按主机进行覆盖。\n\n在 `Options for host`\
  \ 字段中，输入选项将应用的主机名称（如 `ssh` 命令行使用的）。可以使用通配符。例如，你可以输入 `.webmin.com*` 来匹配 `webmin.com`\
  \ 域中的任何主机。记住，该名称必须与用户在 `ssh` 或 `scp` 命令中使用的名称匹配，因此如果你输入 `foo` 而用户运行 `ssh foo.example.com`，即使两个名称都解析到相同的\
  \ IP 地址，选项也不会生效。出于如此，你可能希望将主机名输入为 `foo**` 以捕获两种情况。\n\n要让 SSH 客户端连接到不同的主机，请填写 `Real\
  \ hostname to connect to` 字段。如果与 `Port to connect to` 字段结合使用，这可能用于将用户连接秘密地重定向到另一个地址的端口，而该端口实际上是通往实际目的地的隧道。\n\
  \n要强制默认使用不同的端口，请填写 `Port to connect to` 字段。如果特定主机上的 SSH 服务器运行在非默认的 22 端口，且你希望避免在每个\
  \ `ssh` 和 `scp` 命令中显式指定端口，则此非常有用。\n\nSSH 客户端通常将 `~`（波浪号）字符视为转义字符，表示用户输入的下一个字符实际上是\
  \ `ssh` 程序本身的命令。例如，`~.` 关闭连接，而 `~^Z` 挂起程序。可以通过选择第三个单选按钮并在相邻的文本框中输入单个字符来指定某些不同的 `Escape\
  \ character`。你也可以通过选择 `None` 完全关闭转义支持。如果你使用 `ssh` 命令传输可能包含波浪号的二进制数据，后一种选项非常有用。\n\
  \n默认情况下，SSH 客户端和服务器会对它们之间传输的数据进行压缩和解压缩，这可以加速文本或其他可压缩数据的大传输。然而，有时实际上可能会减慢速度或浪费 CPU\
  \ 时间，例如，如果你正在使用 `scp` 复制大量 GIF 文件，或者始终通过快速网络连接到主机。要关闭压缩，请将 `Compress SSH traffic?`\
  \ 字段改为 `No`。\n\n如果启用了压缩，`Compression level` 菜单控制 CPU 利用率和使用带宽量之间的平衡。如果选择 `1`，则压缩非常少；而如果选择\
  \ `9`，则将花费更多的 CPU 时间来减少传输的实际数据量。\n\n如果你的系统运行 SSH 版本 3 或更高版本，则这些字段以及后续两个步骤中的字段不可用。\n\
  \n默认情况下，SSH 客户端连接时将使用特权源端口 22，这向服务器指示这是一个受信任的程序，因此可以依靠提供运行它的用户的正确信息。这对于 rlogin 风格的认证是必要的，但遗憾的是，许多网络的防火墙配置为阻止特权源端口连接，这完全阻止了\
  \ SSH。要让客户端使用普通端口，请为 `Use privileged source ports?` 字段选择 `No`。除非你在使用基于主机的认证，否则这不会有害。\n\
  \n要设置客户端连接到此服务器时尝试的 SSH 协议版本，在 `Try SSH protocols` 字段中选择 `Selected` 并勾选要尝试的版本。默认是尝试两者。\n\
  \n点击页面底部的 `Create` 按钮保存新的主机设置。从现在开始，从你的系统发的所有新客户端连接将使用这些设置。\n\n创建一组主机选项后，`Client\
  \ Host Options` 页面上会出现该主机的图标。你可以点击此图标调出编辑表单，对相同字段进行更改，并点击 `Save` 按钮。要删除主机并使其连接恢复到默认选项，请在同一表单上点击\
  \ `Delete`。也可以通过点击特殊的 `All hosts` 图标并在出现的表单上进行更改来更改所有连接的默认设置。当然，某些字段在这些背景下并没有真正意义，例如\
  \ `Real hostname to connect to` 和 `Port to connect to`，因此不应使用。\n\n### 42.7 为新用户设置\
  \ SSH\n\n在 UNIX 用户可以使用证书认证登录 SSH 服务器之前，他必须使用 `ssh-keygen` 命令生成私钥。此模块可以配置为与 `Users\
  \ and Groups` 模块协同工作，为所有新创建的用户运行此命令。如果你的网络使用 NFS 挂载的家目录，这将允许新用户在无需提供密码的情况下登录到其他主机，而无需进一步设置。\n\
  \n要配置新用户的 SSH 设置，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `User SSH Key Setup` 图标。\n2. 勾选 `Setup\
  \ SSH key for new UNIX users` 复选框，以便为新账户运行 `ssh-keygen`。\n3. 要将新用户的公钥添加到授权使用其账户的密钥列表中，勾选\
  \ `Copy new identify.pub to authorized_keys` 框。如果未选择，他们需要在使用新证书认证之前手动执行此操作。\n4.\
  \ 要为新用户的私钥设置密码短，勾选 `Use password as key passphrase` 框。如果留空勾选，则不会设置密码短（这更符合用户习惯，但安全性较低）。\n\
  5. 点击 `Save` 按钮让 Webmin 开始使用你的新设置。\n\n### 42.8 配置 SSH 服务器模块\n\n与所有模块一样，此模块也有几个可以设置的选项，用于控制它查找\
  \ SSH 程序和配置文件。默认情况下，这些设置与操作系统自带的 SSH 软件包匹配，除非你从源码编译并安装了服务器，否则通常不需要更改。这些都与模块的用户界面无关。\n\
  \n可编辑的设置如表 42.1。\n\n### 表 42.1. 模块配置选项\n\n| 字段 | 说明 |\n| :--- | :--- |\n| Full path\
  \ to sshd program | 此字段必须设置为 SSH 服务器程序的完整路径，例如 `*/usr/sbin/sshd*` 或 `*/usr/local/sbin/sshd*`。\
  \ |\n| Full path to sshd config file | 此字段必须包含 SSH 服务器配置文件的位置，通常位于 `*/etc/ssh/sshd_config*`。\
  \ |\n| Full path to ssh client config file | 此字段必须包含全局 SSH 客户端配置文件的位置，通常位于 `*/etc/ssh/ssh_config*`。\
  \ |\n\n\n\n\n\n| sshd PID 文件的完整路径 | 此字段必须包含其进程 ID 文件的完整路径，以便模块判断 SSH 服务器是否正在运行。如果路径错误，主页上将显示“启动服务器”（Start\
  \ Server）按钮，而不是“应用更改”（Apply Changes）。 |\n| 启动 sshd 的命令 | 如果选择了“仅运行服务器”（Just run\
  \ server），则在点击“启动服务器”按钮时，模块将简单运行第一个字段中指定的 `sshd` 程序。许多软件包包含一个应该使用的启动脚本，您可以通过选择第二个选项并在相邻的文本框中输入诸如\
  \ `/etc/init.d/sshd start` 的命令来让模块使用它。然而，如果您是从源码从自己编译的 SSH，则应该使用第一个选项，因为很可能不存在此类脚本。\
  \ |\n| ssh-keygen 程序的完整路径 | 此字段必须包含 `ssh-keygen` 程序的完整路径，模块使用该程序为新的 UNIX 用户设置 SSH。\
  \ |\n\n### 42.9 总结\n\n在读完本章后，你应该熟悉 SSH 协议和程序的用途及益处。你还应该理解如何使用 Webmin 的 SSH 服务器模块来配置此类服务器选项，例如允许的用户和主机、协议和网络设置，以及与登录和身份验证相关的选项。你应该知道如何设置适用于系统上用户发起的客户端\
  \ SSH 连接的选项，以及如何为新用户自动设置 SSH。\n\n## 第 43 章 使用 Samba 进行 Windows 文件共享\n\n本章解释了 Windows\
  \ 系统共享文件的协议，并解释了如何设置 Samba 程序以使你的 UNIX 服务器上的文件供 Windows 客户端使用。\n\n### 43.1 SMB 和\
  \ Samba 简介\n\nSMB（服务器消息块）是 Windows 系统用于在网络上共享文件和打印机的协议，就像 UNIX 系统使用 `NFS` 和 `LPR`\
  \ 协议一样。每当你使用 Windows 的“网络邻域”（Network Neighborhood）或“映射网络驱动器”（Map Network Drive）功能时，都在使用\
  \ `SMB` 协议。因为它是 Windows 系统上文件共享的标准方法，它已成为局域网中最常用的文件共享方法。\n\n尽管 `SMB` 被认为是一种 Windows\
  \ 协议，但它最初由 DEC 开发，并已被许多不同的公司在许多产品中实现。如今，它通常被称为 `CIFS`（通用互联网文件系统），尽管协议本身并没有发生变化。事实上，许多旧版客户端仍然能够访问像\
  \ Samba 这样的现代 `SMB` 服务器。\n\n`SMB` 服务器是一个拥有文件或打印机并希望允许其他主机访问的系统。客户端是想要在服务器上读取或写入文件、或向服务器打印机打印的系统。单个系统可以既是客户端也是服务器，从\
  \ Windows 95 开始的所有 Windows 版本都包含了用于这些目的的软件。然而，在典型的组织网络中，通常有一个大型服务器系统和许多访问其文件的较小客户端。\n\
  \n每个使用 `SMB` 协议的主机都有主机名，该名称通常与其 DNS 名称相同。服务器主机可以有多个共享，每个共享都有唯一的名称，并对应于服务器系统上的目录或本地打印机。共享使用\
  \ `\\\\hostname\\sharename` 记法，例如 `\\\\corpserver\\documents`。在 Windows 客户端上，文件共享通常映射到如\
  \ `J:` 等驱动器号，以便更容易引用。所有的 Windows 应用程序都可以以处理本地文件完全相同的方式在服务器上读取和写入文件。\n\n客户端访问的共享打印机没有分配驱动器号，但可能连接到如\
  \ `lpt2:` 等虚拟打印机端口。客户端可以将作业发送到打印机，查看当前正在等待打印的作业，并取消同一用户提交的作业。与 UNIX `LPR` 协议不同，使用远程打印机的客户端必须安装相应的驱动程序，并且必须以打印机实际接受格式向服务器发送数据。\n\
  \n幸运的是，Linux 和 UNIX 系统也可以参与 `SMB` 文件和打印机共享，否则本章将会非常短。磁盘和网络文件系统模块（在第 5 章介绍）允许你的 Linux\
  \ 系统挂载来自 `SMB` 服务器的共享，以便其包含的文件像其他文件一样被访问。打印管理模块（来自第 22 章）可用于在你的系统中设置打印机，将作业发送到 Windows\
  \ 打印机共享。\n\n这两章解释了你的系统如何作为 `SMB` 客户端，而本章涵盖了如何设置服务器，以便 Windows（以及 Linux）客户端能够访问其文件并向其打印机打印。实现此点的软件被称为\
  \ Samba，它是针对 UNIX 系统对 `SMB` 协议的完全免费实现。自从 SMB 协议首次开始在 DOS 系统上使用以来，Samba 就已经可用并持续开发多年。它允许\
  \ UNIX 系统像真正的 Windows 服务器一样很好地为 Windows 客户端提供服务。事实上，有些人认为它甚至更好。\n\nSamba 使用两个守护进程，命名为\
  \ `smbd` 和 `nmbd`。第一个处理来自客户端的实际文件或打印机共享请求，第二个响应 `SMB` 名称查找请求。两个守护进程都使用 `smb.conf`\
  \ 配置文件，该文件通常位于 `/etc` 目录下。对此文件的任何更改（手动手动或使用 Webmin）都会被两个守护进程立即检测到并立即生效。与大多数其他 UNIX\
  \ 服务器进程不同，如果配置文件发生变化，它们不需要接收信号来重新读取配置文件。\n\n不幸的是，在 UNIX 和 Windows 系统之间共享文件时会产生一些复杂性。`SMB`\
  \ 协议不支持文件所有权或权限等概念，至少不像它们在 UNIX 系统上存在的形式那样。相反，它支持 `NTFS` 文件系统访问控制列表（用于 Windows NT、2000\
  \ 和 XP），而这些列表与普通的 UNIX 权限不兼容。Samba 确实对它们有某些支持，但其设置过程非常复杂，并将在另一单独的章节中介绍。\n\n`SMB`\
  \ 协议支持身份验证，因此可以强制客户端在访问共享之前向服务器提供有效的用户名和密码。Samba 服务器使用标准的 UNIX 用户数据库来验证客户端，尽管无法使用实际\
  \ UNIX 密码（原因稍后会解释）。当客户端登录到 Samba 服务器时，它以其所验证身份的 UNIX 用户的权限访问文件，就像 FTP 客户端一样。这意味着所有标准的文件权限和所有权规则都适用。\n\
  \nSamba 可以编译在 Webmin 支持的每一个版本的 UNIX 上，并且在所有版本上都具有相同的功能。这意味着该模块的用户界面也是相同的，尽管默认配置的差异可能会导致某些功能最初无法访问。\n\
  \n### 43.2 Samba Windows 文件共享模块\n\n此 Webmin 模块允许你使用 `SMB` 协议指定要共享给 Windows 客户端的目录和打印机。它可以在“服务器”（Servers）类别中找到，当在主页点击它的图标时（如图\
  \ 43.1 所示），它将显示。所有现有的共享都会列出来，以及它们的路径和可访问的用户。下方是设置适用于所有共享的各种全局选项的图标、管理 Samba 用户的链接，以及启动或重启服务器进程的按钮。\n\
  \n##### 图 43.1.Samba Windows 文件共享模块。\n\n![](img/43fig01.jpg)\n\n\n\n\n多年来，Samba\
  \ 已经获得了大量的可配置选项。不过，此模块并不允许你配置所有选项，仅包含适用于简单网络上的小型服务器的选项。例如，与登录脚本、NT 域和 SSL 相关的设置无法编辑。但是，如果你手动将它们添加到\
  \ `smb.conf` 文件中，该模块将不会触动它们。\n\n与其他所有配置某些服务器的模块一样，此模块只有在实际安装了 Samba 服务器的情况下才能使用。如果模块找不到它，主页将显示类似\
  \ `The Samba server executable /usr/sbin/smbd was not found` 的错误消息。如果你确实安装了 Samba，但位置与模块预期的不同，请参阅第\
  \ 43.18 节“配置 Samba Windows 文件共享模块”，获取有关如何重新配置以使用正确路径的说明。否则，你需要重新安装它。\n\n大多数 Linux\
  \ 发行版以及其他几个操作系统都包含一个或多个 Samba 包，可以使用“软件包”模块（在第 12 章介绍）轻松安装。如果没有，你需要从 [www.samba.org](http://www.samba.org/default.htm)\
  \ 下载源代码并手动编译安装。该模块期望你在可用包时使用该包，否则使用源代码，因此如果你没有这样做且主页上仍然显示错误消息，则需要调整模块的配置以使用正确的路径。\n\
  \n无论 Samba 如何安装，其默认配置文件都至少包含两个共享（特殊的 homes 共享和打印机共享）以及几个全局设置。这意味着，即使你以前从未使用过此模块或没有手动配置过\
  \ Samba，主页上的列表也不会为空。当然，如果你通过直接编辑配置文件来添加共享，它们也会显示出来。\n\n如果 Webmin 检测到 Samba 已经在运行，页面底部将显示一个标记为“重启\
  \ Samba 服务器 (Restart Samba Servers)”的按钮。可以预测，点击它将杀死所有运行的服务器进程并重启它们，强制重新加载当前配置。不过，这通常是没有必要的，因为\
  \ Samba 在检测到配置文件已更改后会重新读取它们。\n\n如果模块发现两个 Samba 服务器进程均未运行，它将显示“启动服务器 (Start Servers)”按钮，点击后将同时运行\
  \ `smbd` 和 `nmbd`。模块不会通过检查 PID 文件来确定它们是否运行，相反，模块会搜索具有这些名称的运行进程。\n\n### 43.3 管理 Samba\
  \ 用户\n\n如引言所述，SMB 协议使用与标准 UNIX 格式不兼容的密码加密格式。这最初并不是一个问题，因为旧版本的 Windows（95 及早版本）向\
  \ SMB 服务器发送未加密的密码。这允许 Samba 像 FTP 或 telnet 服务器一样，对 UNIX 密码列表进行加密和验证。遗憾的是，除非更改特定的隐藏注册表项，否则最近的\
  \ Windows 将以新的 NTLM 加密格式发送密码。现在 Samba 必须维护独立的密码列表来验证现代客户端。\n\n除非你的服务器仅供旧版 Windows\
  \ 主机或 Linux 系统访问，否则你需要启用此独立的加密密码列表。执行此操作，请完成以下步骤：\n\n1. 点击模块主页上的身份验证图标。\n2. 在出现的表单上，将`使用加密密码？(Use\
  \ encrypted passwords?)` 字段更改为 `Yes`。\n3. 点击表单底部的“保存 (Save)”返回主页并激活新设置。如果之前没有出现，现在现在包含三个链接的“加密密码\
  \ (Encrypted Passwords)”部分应该是可见的。\n\n现在 Samba 独立的密码列表已启用，你需要将你一些现有的 UNIX 用户添加到其中。可以使用\
  \ Webmin 按照以下步骤轻松完成：\n\n1. 在 Samba 模块的主页上，点击“加密密码 (Encrypted Passwords)”部分中的`将 UNIX\
  \ 用户转换为 Samba 用户 (Convert UNIX users to Samba users)`链接，打开转换表单。\n2. `不转换或删除这些用户\
  \ (Don't convert or remove these users)`字段列出了将被排除转换的用户，默认包含所有系统帐户。你可能想添加其他用户；但是，转换永远不会使用的账户也没有。\n\
  3. 如果你以前使用过此表单，可以勾选`从 UNIX 详细信息更新现有 Samba 用户 (Update existing Samba users from their\
  \ UNIX details)`选项，使现有的 Samba 用户匹配相应的 UNIX 用户。\n4. 同样，可以勾选`删除 UNIX 下不存在的 Samba 用户\
  \ (Delete Samba users who do not exist under UNIX)`检查是否设置为删除不再对应 UNIX 用户的 Samba\
  \ 用户。\n5. `对于新创建的用户设置密码为 (For newly created users, set the password to)`字段决定了将分配的密码，因为没有办法转换用户现有的密码。最佳选择是`账户锁定\
  \ (Account locked)`，这防止转换后的用户在以后设置密码之前无法使用。你也可以选择`无密码 (No password)`让新账户无密码（这从安全角度来说是个坏主意），或选择`使用此密码\
  \ (Use this password)`为所有转换的用户指定密码。\n6. 点击`转换用户 (Convert Users)`按钮开始处理。将显示一个列出每个已转换、跳过或更新用户的页面。\n\
  \n转换后，你可能需要为新的 Samba 用户设置密码。这必须针对每个用户按照以下说明逐一完成：\n\n1. 在模块主页上，点击`编辑 Samba 用户和密码\
  \ (Edit Samba users and passwords)`链接，调出现有用户列表。\n2. 点击你想设置密码的用户名称。\n3. 在`密码 (Password)`字段中，选择`新密码\
  \ (New password)`选项并在旁边的文本框中填写内容。你也可以选择`无访问 (No access)`以阻止该用户的所有 Samba 登录，选择`无密码\
  \ (No password)`允许无密码密码登录，或选择`当前密码 (Current password)`保持密码不变。\n4. 表单上的其他字段不应更改，只需点击“保存\
  \ (Save)”按钮返回用户列表。\n\n现在你应该能够使用所选密码作为该用户登录 Samba 服务器，并访问某些共享中的文件。假设特殊的 homes 共享存在，每个用户都将拥有与其用户名同名的共享。\n\
  \n由于为每个新用户转换并设置密码是一项费时的体力消耗，你可以配置模块，为 Webmin 中创建的每个 UNIX 用户自动创建一个 Samba 用户。当“用户和组”模块中更改相应的\
  \ UNIX 用户时，也可以对 Samba 用户进行重命名、删除或更改密码。要设置此同步，请遵循以下步骤：\n\n1. 点击 Samba 模块主页“加密密码”部分中的`配置自动\
  \ UNIX 和 Samba 用户同步 (Configure automatic UNIX and Samba user synchronization)`链接。\n\
  2. 在同步表单上勾选`添加 UNIX 用户时添加 Samba 用户 (Add a Samba user when a UNIX user is added)`，为每个新\
  \ UNIX 用户创建一个正确 UID 和密码的 Samba 用户。\n3. 勾选`更改 UNIX 用户时更改 Samba 用户 (Change the Samba\
  \ user when a UNIX user is changed)`框，确保在修改 UNIX 用户时，重命名相应的 Samba 用户或更改其密码。\n4.\
  \ 勾选`删除 UNIX 用户时删除 Samba 用户 (Delete the Samba user when a UNIX user is deleted)`，让\
  \ Webmin 在移除 UNIX 用户时移除匹配的 Samba 用户。\n5. 点击`应用 (Apply)`按钮保存你的设置。在“用户和组”模块中执行的任何操作（当使用其他模块中的选项时）也会影响\
  \ Samba 用户列表。\n\n遗憾的是，这种同步仅适用于 Webmin 中的“用户和组”、“更改密码”以及“集群用户和组”模块。如果你在命令行中添加用户（如使用\
  \ `adduser`）或使用 `passwd` 命令更改密码，将不会添加或更新 Samba 用户。\n\n### 43.4 添加新文件共享\n\n\n\n\n\
  在默认的配置下，Samba 将允许任何 UNIX 用户登录并访问其主目录下的文件。特殊的 `homes` 共享提供了此项功能，在许多情况下，这已经足够用户在服务器上存储他们自己的文件了。然而，共享一个所有人都可以访问的目录通常很有用，这样整个组织感兴趣的文档就可以提供给大家使用。此类共享可以被设置为允许访客访问（这意味着访问时无需登录），或者要求有效登录服务器才能进行访问。\n\
  \n### 创建文件共享\n\n要创建一个文件共享，请按照以下步骤操作：\n\n首先，确定您想要共享的目录，如果该目录不存在，则创建它。必须赋予其适当的 UNIX\
  \ 权限，以便用户对其进行读取和/写入。\n\n在模块的主页上，点击表格上方或下方的 `Create a new file share` 链接。这将带您进入图\
  \ 43.2 所示的 `Share Creation` 表单。\n\n#### 图 43.2. 文件共享创建表。\n\n![](img/43fig02.jpg)\n\
  \n在 `Share name` 字段中，确保选择了第一个按钮，并在文本框中为您的共享输入一个唯一的字母数字名称，例如 `documents`。如果您输入了一个\
  \ UNIX 用户的名称，他的自动主目录共享将被覆盖。\n\n在 `Directory to share` 字段中，输入（或通过小按钮选择）第 1 步中选择目录的完整路径。\n\
  \n若要禁用此共享使其无法使用，请将 `Available?` 字段更改为 `No`。如果您想在所有选项都正确设置之前将其离线状态，这会非常有用。\n\n若要从浏览服务器时出现的的列表中隐藏此共享，请将\
  \ `Browseable?` 字段更改为 `No`。它仍然可以通过 `\\\\servername\\sharename` 路径直接访问。\n\n在 `Share\
  \ comment` 字段中，为此文件共享输入一个简短描述，例如 `Corporate documents`。\n\n点击 `Create` 按钮将其添加到 Samba\
  \ 配置中。您的浏览器将返回到模块的主页，新共享将列在其中。\n\n点击新的共享名称以打开其编辑页面。\n\n点击 `Security and Access Control`\
  \ 图标以显示共享的安全表单。\n\n如果此共享中的文件应该是只读的，请将 `Writable?` 字段设置为 `No`；否则，请确保选中了 `Yes`。\n\n\
  `Guest access?` 字段决定了客户端是否可以在不登录服务器的情况下访问此共享。可用选项有：\n\n- `None`：只有经过身份验证的用户将获得访问权限。\n\
  - `Yes`：允许任何人访问此共享，但未经过验证的客户端将被视为访客。登录的客户端将享有其正常的文件访问权限。\n- `Guest only`：所有客户端（无论是否经过验证）都将被视为访客。\n\
  \n若要设置访客读取和写入文件的 UNIX 用户，请更改 `Guest UNIX user` 字段。这通常应该是一个具有只读权限的账户。\n\n点击表单底部的\
  \ `Save` 按钮。该共享现在可以供客户端使用了，并在您浏览服务器时显示出来。\n\n共享创建后，可以通过点击模块主页列表上的其名称来打开其编辑表单，更改路径或描述等细节，并点击\
  \ `Save` 按钮进行编辑。或者可以通过点击同一表单上的 `Delete` 来完全删除。您还可以通过点击编辑页面底部的图标来编辑额外的参数。本章的后续章节将更详细地解释它们的作用。\n\
  \n`homes` 共享也可以编辑，尽管它通常没有路径（或者如果有路径，它将包含特殊的 `%U` 代码，该代码会被连接用户的主目录替换）。\n\n### 43.5\
  \ 添加新的打印机共享\n\n默认的 Samba 配置通常包含特殊的 `printers` 共享，这表示您系统上的所有打印机对 SMB 客户端都可用。然而，特定的打印机也可以被显式共享。这可能比自动共享所有打印机更好，因为允许您为每个打印机设置不同的选项，或将某些完全排除在之外。\n\
  \n在 Samba 中打印和打印打印机正常工作之前，必须将其配置为适用于您的 UNIX 设备的正确打印系统。请参见第 43.15 节“配置打印机”了解如何设置。如果设置错误，服务器将使用错误的命令列出打印机和提交作业，这可能导致自动生成的打印机列表为空或打印请求失败。\n\
  \n要让打印机对 SMB 客户端可用，请按照以下步骤操作：\n\n在模块的主页上，点击表格上方或下方的 `Create a new printer share`\
  \ 链接。这将带您进入图 43.3 所示的 `Print Share Creation` 表单。\n\n#### 图 43.3. 打印机共享创建表。\n\n![](img/43fig03.jpg)\n\
  \n在 `Share name` 字段中，确保选择了第一个按钮，并在文本框中为您的共享输入一个唯一的字母数字名称，例如 `hplaser`。从 UNIX 打印机菜单中选择打印机供\
  \ SMB 客户端使用。这应该与您下一步输入的名称相同。如果已经存在同名的自动创建共享，新的将覆盖它。\n\n点击新的共享名称以打开其编辑页面。\n\n点击 `Security\
  \ and Access Control` 图标以显示共享的安全表单。\n\n`Guest access?` 字段决定了客户端是否可以在不登录服务器的情况下访问此打印机。可用选项有：\n\
  \n- `None`：只有经过身份验证的用户将获得访问权限。\n- `Yes`：允许任何人访问此共享，但未经过验证的客户端将被视为访客。登录的客户端将以其登录名提交作业。\n\
  - `Guest only`：所有客户端（无论是否经过验证）都将被视为访客。\n\n若要设置访客提交打印作业的 UNIX 用户，请更改 `Guest UNIX\
  \ user` 字段。除非您的打印系统配置为阻止某些用户，否则这并不重要。\n\n点击表单底部的 `Save` 按钮返回打印机的编辑页面。\n\n点击 `Printer\
  \ Options` 图标。\n\n如果此打印机要供 Windows 客户端使用且未安装 UNIX 驱动程序，请将其完整制造和型号输入到 `Printer driver`\
  \ 字段。这必须与 Windows 所引用的名称完全匹配，以便客户端知道安装哪种驱动程序。如果选择了 `None`，用户在向 Windows 系统添加此打印机时，将被要求从列表中选择打印机模型。\n\
  \n若要禁用此打印机使其无法使用，请将 `Available?` 字段更改为 `No`。\n\n若要从浏览服务器时出现的列表中隐藏此打印机，请将 `Browseable?`\
  \ 字段更改为 `No`。它仍然可以通过 `\\\\servername\\share` 路径直接访问。\n\n在 `Spool directory` 字段中，您可以输入存储打印临时文件的目录。留空将使用\
  \ Samba 的默认值，这通常可以。\n\n在 `Share comment` 字段中，为此打印输入一个简短描述，例如 `Office LaserJet 5`。\n\
  \n点击 `Create` 按钮将共享添加到 Samba 配置中。您的浏览器将返回到模块的主页，新共享现在将列在表中。\n\n如果第 3 步中的 UNIX 打印机选择已经设置了驱动程序，那么客户端必须提交\
  \ Postscript 格式的任务，而不是打印机的原生数据格式（因为驱动程序将进行转换）。在这种情况下，您可以输入原生使用 Postscript 的打印机名称，例如\
  \ `Apple LaserJet II`。\n\n最后，点击此表单上的 `Save` 按钮。打印机共享现在可以供 Windows 客户端使用了。\n\n\n\n\
  与文件共享一样，可以通过点击模块主页表格中的名称来对打印机进行编辑和删除。特殊的打印机共享也可以进行修改；但是，许多选项对其设置并没有意义，例如 `UNIX`\
  \ 打印机或 `Printer driver`（打印机驱动）。\n\n### 43.6 查看和断开客户端\n\n每个访问您系统中文件或打印机共享的客户端都与 `Samba`\
  \ 服务器有连接，可以使用此模块查看这些连接。客户端还可以锁定它们正在打开编辑的文件，以防止他人打开这些文件。服务器的任务之一就是维护这些锁，这些锁与会话相关，并且是可以查看的。如果客户端在没有正常断开连接的情况下崩溃，它持有的任何锁将一直存在，直到\
  \ `TCP` 连接超时（这可能需要一段时间）。因此，该模块允许您杀死客户端会话，从而释放它们的锁。\n\n要查看并删除客户端会话，请按照以下步骤操作：\n\n\
  - 在模块主页上，点击共享表格上方或下方的`View all connections`链接，列出所有到服务器的连接列表。\n- 您也可以点击打印机或文件共享，然后点击其编辑页面上的`View\
  \ Connections`按钮，仅显示到该特定共享的连接列表。\n\n无论哪种方式，出现的页面都会列出当前正在使用的共享，并显示连接用户的名称、连接的主机、连接时间以及每个共享的任何锁定文件。最左侧列是处理此连接的`Samba`服务器子进程的\
  \ ID。通常，来自同一客户端系统到不同共享的多个连接将由一个进程处理。\n\n要杀死进程并断开其正在处理的所有连接，请点击第一列中的进程 ID。客户端持有的任何锁将会被释放，供他人使用文件。\n\
  \n您应该只杀死确实崩溃的客户端的连接，因为杀死活动客户端的会可能会导致其已打开的任何文件损坏。然而，杀死与没有打开文件的`Windows`客户端的连接通常是安全的，因为当客户端下次打开共享上的文件时，它将立即且透明地重新建立该连接。\n\
  \n### 43.7 编辑共享安全选项\n\n一旦创建了打印机或文件共享，您就可以编辑各种安全相关的选项，这些选项控制谁可以访问它以及他们可以连接到哪些主机。如果某些共享包含只有特定人员才能访问的文件，或者您的`Samba`服务器仅供内部网络上的客户端使用，这将非常有用。\n\
  \n要编辑共享安全选项，请按照以下步骤操作：\n\n- 点击表格中的共享名称，在模块主页上打开其编辑表，然后点击`Security and Access Control`图标。\n\
  - 正如第 43.4 节“添加新文件共享”所示，`Writable?`和`Guest access?`字段决定了共享是否可以写入以及是否需要身份验证。`Guest\
  \ UNIX`用户字段设置了客户客户端读写文件的用户。如果您希望，可以在此处再次更改它们。\n- 要仅允许某些主机访问此共享，请选择`Hosts to allow`字段中的第二个单选按钮，并在相邻的文本框中输入主机名和\
  \ IP 地址列表。可以使用部分 IP（如 `192.168.1.*`）或网络地址（如 `192.168.1.0/255.255.255.0`）来允许整个网络的访问。如果您的系统是\
  \ `NIS` 客户端，可以输入以 `@*` 前头的组名（例如 `@servers`）来允许该组的所有成员访问。\n- 如果选择了`All`，则所有主机将获得访问权限，除非您填写了下一个字段。无论您输入什么，来自本地主机（`127.0.0.1`）的连接始终被允许，除非它在`Hosts\
  \ to deny`字段中被明确列出。\n- 要阻止特定主机访问此共享，请在`Hosts to deny`字段中填充类似的主机名、IP 地址、网络或组列表。如果两个字段都填充了，`Hosts\
  \ to allow` 优先。如果选择了`None`，将允许所有主机。\n- 要仅允许某些用户访问此共享，请在`Valid users`字段中填充用空格分隔的用户名列表。您还可以在`Valid\
  \ groups`字段中填充组列表，这些组的主要和次要成员将获得访问权限。只有当两个列表都为空时，才会允许所有用户。\n- 要拒绝特定用户和组组员，请填充`Invalid\
  \ users`和`Invalid groups`字段。如果用户同时出现在有效和无效列表中，他将将被拒绝访问。\n- 要限制某些用户对此共享的只读访问，请在`Read\
  \ only users`字段中输入用户名列表。您还可以在`Read only groups`中输入`UNIX`组列表以限制其主要成员。其他人将拥有完全的读/写权限，前提是共享实际上是可写的，且`Read/write`字段未填充。\n\
  - 要仅赋予某些用户写入共享的权限并将其他所有人限制为只读访问，请在`Read/write users`字段中输入用户名列表。照常，`Read/write groups`字段可用于输入组列表，允许这些组的主要成员也进行写入。自然地，可能阻止写入文件或目录的普通`UNIX`文件权限仍然适用于所有用户。如果用户同时出现在`Read\
  \ only`和`Read/write`列表中，他将被允许写入。\n- 此步骤和上一步中的字段对打印机共享没有影响。相反，所有允许的用户都将能够打印。\n\n\
  当您完成文件安全选项的编辑后，点击页面底部的`Save`按钮激活新设置。\n\n除了为单个共享设置安全选项外，还可以为所有共享设置默认值，除非在单独共享中被覆盖。要此操作，请点击模块主页上的`File\
  \ Share Defaults`图标而不是共享名称，然后点击`Security and Access Control`。某些设置（如允许或拒绝的主机列表）真的应该全局设置，因为您可能希望将整个服务器的访问限制为受信任的网络。参见第\
  \ 43.12 节“编辑默认值”获取更多有关默认值如何工作的信息。\n\n### 43.8 编辑文件权限设置\n\n文件共享有几个与`UNIX`权限及其内部文件所有权相关的设置，可以全局设置或按共享设置。由于`Windows`客户端和`SMB`协议没有权限的概念，因此按共享为新文件和目录设置默认值的方法非常有用的。要执行此操作，请按照以下步骤操作：\n\
  \n- 在模块主页上，点击您想要设置权限的共享名称，然后点击其编辑页面上的`File Permissions`图标。\n- 在`New UNIX file mode`字段中，输入分配给新创建文件的八进制权限（如`chmod`命令使用的权限）。例如，模式`600`将允许所有者读写，但完全拒绝任何人的访问。\n\
  - 在`New UNIX directory mode`字段中，输入新创建目录的八进制权限。例如，`755`将允许所有人列表和读取，但仅允许所有者在目录中创建文件。\n\
  - 要让某些目录对`SMB`客户端始终显示为空空，请在`Directories not to list`字段中输入以逗号分隔的完整路径列表。例如，您可能会输入`/proc,/dev`来隐藏这两个目录的内容，这些目录对`Windows`客户端来说通常是没用的。\n\
  \n\n\n\n\n要强制所有客户端以特定的 UNIX 用户身份访问文件（而不是登录时的用户身份），请填写 `Force UNIX user` 字段。这对于不同人员互相编辑彼此文档的共享来说非常有用，因为避免了如果文件实际上归其创建者所有时可能会出现的\
  \ UNIX 权限问题。\n\n默认情况下，访问文件时的组将是指定用户的主组。若要更改此设置，请同样填写 `Force UNIX group` 字段。\n\n\
  由于 Windows SMB 客户端不支持 UNIX 符号链接，当客户端尝试读取或写入链接时，Samba 始终会读取或写入被链接的文件。遗憾的是，这带来了一个潜在的安全风险，因为可能会创建一个指向共享目录之外的通常无法访问的文件的符号链接（symlink）。为了防止这种情况，请将\
  \ `Allow symlinks outside of share?` 字段更改为 `No`。\n\n在 UNIX 文件系统上，如果目录是可写的，用户即使文件是只读的仍然可以将其删除。但在普通的\
  \ Windows 文件系统上并非如此，这就是 Samba 防止这种情况发生的原因。要更改此设置并应用 UNIX 文件系统的语义，请将 `Can delete\
  \ readonly files?` 字段更改为 `Yes`。\n\n点击页面底部的 `Save` 按钮以激活新的文件安全选项。\n\n如第 43.12 节“编辑共享默认设置”详细解释，可以通过点击主页上的\
  \ `File Share Defaults` 图标，然后点击 `File Permissions` 来编辑所有共享的文件权限设置。除非前面的指令对某个共享进行了覆盖，否则这些设置将生效。\n\
  \n## 43.9 编辑文件名命名选项\n\nSamba 有多个选项控制如何将 UNIX 文件名转换为适用于 Windows 系统的名称。如今，大多数选项已不再需要，因为\
  \ Windows 95 及以上版本已经能够很好支持长文件名。只有 Windows 3.1 和 DOS 仍然在使用旧的 `8.3` 文件名格式，而且它们几乎不再使用了。\n\
  \n要编辑与现代客户端相关的共享命名选项，请遵循以下步骤：\n\n1. 在模块主页上点击共享名称，然后点击 `File Naming` 图标。\n2. 当 `Case\
  \ sensitive?` 字段设置为 `No` 时，服务器在打开客户端请求的文件时将忽略大小写。这是 Windows 文件系统的工作方式，因此这也是 Samba\
  \ 的默认行为。然而，由于所有 UNIX 文件系统都是区分大小写的，由于需要扫描目录，这会消耗更多的 CPU 时间和 IO 带宽。出于此原因，如果你所有的客户端都是期望应用正常\
  \ UNIX 大写规则的 Linux 系统，你可能希望选择 `Yes`。\n3. 通常，Samba 将按照客户端指定的精确大小写创建文件。要更改此设置并强制使用大写或小写，请将\
  \ `Preserve case?` 字段更改为 `No` 并选择 `Default case?` 字段中的选项之一。如果 Windows 客户端创建了大量大写文件而你倾向于遵循标准的\
  \ UNIX 小写标准，这将非常有用。\n4. 在 Windows 文件系统上，每个文件都有一个隐藏属性，决定该文件是否对程序正常可见。UNIX 系统上没有此类属性。相反，以点（.）开头的文件会被\
  \ `ls` 等其他命令隐藏。由于此原因，当 `Hide dot files?` 字段设置为 `Yes`（默认如此）时，Samba 会对点文件设置隐藏属性。\n\
  5. 另一种方法是使用 UNIX 文件权限的“可执行”位作为隐藏标记，因为 Samba 否则不会使用执行权限。要启用此行为，请将 `Save DOS hidden\
  \ flag?` 字段更改为 `Yes`。因为这将会破坏访问共享中文件的 UNIX 程序的权限，所以只应在共享目录仅供 SMB 客户端访问时使用。\n6. Windows\
  \ 文件还有两个属性：指示文件已备份的存档标记（archive flag）和标记通常不可触系统文件的系统标记（system flag）。如果将 `Save DOS\
  \ archive flag?` 和 `Save DOS system flag?` 字段设置为 `Yes`，可以配置 Samba 将这些属性存储在文件的用户执行和组执行位中。如果你的\
  \ Windows 客户端不需要这些信息，或者如果你发现 UNIX 执行文件和脚本的权限被破坏，请将它们都设置为 `No`。\n\n要激活新的命名设置，按下页面底部的\
  \ `Save` 按钮。\n\n再次，可以通过点击主页上的 `File Share Defaults` 图标，然后点击 `File Naming` 为所有共享设置这些选项。\n\
  \n## 43.10 编辑其他文件共享选项\n\n你还可以使用此模块设置几个关于锁定和自动运行命令的文件共享选项。这些选项用于控制 Windows 客户端尝试锁定文件以获得独占访问时\
  \ Samba 的行为，以便其可以在文件中缓存数据，而无需每次读取或写入都联系服务器。默认情况下，锁定是完全开启的，且实现方式与 Windows 服务器完全相同，因此通常不需要更改这些设置。\n\
  \nSamba 还可以配置在客户端连接或断开连接时运行 shell 命令，以 root 身份或连接的 UNIX 用户身份运行。如果你想将新添加的文件移动到其他目录或对它们进行某种处理，这将非常有用。\n\
  \n要编辑模块的其他文件共享选项，请遵循以下步骤：\n\n1. 在主页上点击要编辑的共享名称，然后在出现的共享编辑页面上点击 `Miscellaneous Options`\
  \ 图标。\n2. 如果此共享仅用于只读（例如，如果你共享某些只读媒体如 CD），则可以安全地将 `Fake oplocks?` 字段更改为 `Yes` 以提高性能。这告诉\
  \ Samba 仅授予客户端的所有锁定请求，而无需实际跟踪谁锁定了什么，这可以提高性能。\n3. 除非你真的知道自己在做什么，否则不应碰任何其他锁定字段，因为默认设置运行良好，如果多个客户端尝试访问相同文件，任何其他设置可能导致数据损坏。\n\
  4. 要限制同时连接到此共享的客户端数量，选择 `Max connections` 字段中的第二个单选按钮，并在相邻的文本框中输入数字。如果你想限制系统负载，这将非常有用。如果选择了\
  \ `Unlimited`，则对并发连接数不设上限。\n5. `Command to run on connect` 和 `Command to run on\
  \ disconnect` 字段允许你输入 shell 命令，Samba 将连接和断开连接时以身份用户身份运行这些命令。它们始终在共享目录中运行，命令中可以使用特殊\
  \ % 代码，例如 `%U` 代表连接的用户或 `%S` 代表服务器名。\n6. 同样，`Command to run on connect as root`\
  \ 和 `Command to run on disconnect as root` 字段可以用于输入始终以 UNIX root 用户身份运行的 shell 命令。然而，它们将在\
  \ root 的家目录下运行。\n\n按下 `Save` 按钮激活新的锁定和命令设置。\n\n关于锁定和 Samba 需要记住的一点是，SMB 客户端取的锁通常不会影响\
  \ UNIX 程序或 NFS 客户端，也不会被它们检测。这意味着如果 UNIX 和 Windows 程序打开同一个文件，或者两个不同的 Samba 服务器共享同一个\
  \ NFS 目录，仍然可能发生数据损坏。\n\n## 43.11 编辑打印机共享选项\n\n\n\n\n一旦创建了打印机共享，你就可以对其设置若干选项。大部分选项与\
  \ Samba 打印新作业、列出队列或取消作业时运行的命令有关。默认情况下，将使用所用打印系统的相应命令（在第 43.15 节“配置打印机”中解释）。但是，某些情况下，你可能希望指定额外的参数，甚至使用完全不同的命令。\n\
  \n要编辑共享的打印机选项，请遵循以下指令：\n\n在模块的主页上，点击打印机共享表中你想要编辑的名称。在出现的表单上，点击页面底部的 `Printer Options`（打印选项）图标。\n\
  \n为了防止客户端使用大型作业耗尽打印机缓存目录的所有磁盘空间，请更改 `Minimum free space`（最小可用空间）字段。你必须输入一个在文件系统中始终保留的千字节数。\n\
  \n要更改 Samba 打印提交的文件时运行的命令，请编辑 `Print command`（打印命令）字段。特殊代码 `%f`（用于打印的临时文件）和 `%p`（用于打印机名称）可以也应该在命令中使用，你可以输入类似\
  \ `lpr P%p %f ; rm %f` 的内容。你的命令必须始终删除临时文件（如示例所示），因为服务器不会为你执行操作。可以使用所有常用的 shell 元字符，如\
  \ `;`、`&` 和 `>`，这允许你输入相当复杂的命令序列。无论输入什么命令，将始终作为连接到打印机共享的 UNIX 用户运行。\n\n要编辑 Samba\
  \ 用于列出某些打印机上等待打印作业的命令，请选择 `Display queue command`（显示队列命令）字段中的第二个单选按钮并填充其文本框。你输入的任何内容都必须以标准\
  \ BSD `lpr` 命令生成的格式输出，以便 Samba 解析。如果命令中出现特殊代码 `%p`，它将被替换为打印机名称。\n\n同样，你可以通过分别编辑\
  \ `Delete job command`（删除作业命令）、`Pause job command`（暂停作业命令）和 `Unresume job command`（恢复作业命令）字段，来更改\
  \ Samba 删除、暂停和恢复打印作业时运行的命令。所有命令都应该也应该使用代码 `%p` 作为打印机名称，使用 `%j` 作为作业 ID。对于大多数打印系统，暂停和恢复命令没有默认值，因为这些功能不受支持。通常情况下，你不需要更改这些字段。\n\
  \n如第 43.5 节“添加新打印机共享”所示，`Printer driver`（打印机驱动程序）字段可输入连接打印机的型号（由 Windows 识别），以便客户端自动选择正确的驱动程序。\n\
  \n完成此页面后，点击 `Save`（保存）按钮以更新 Samba 配置文件，从而激活新设置。\n\n你也可以通过点击模块主页上的 `Printer Share\
  \ Defaults`（打印机共享默认值）图标然后点击 `Printer Options` 来编辑所有共享的设置。事实上，所有的命令选项在全局范围内编辑更有意义，因为所有打印机可能都需要相同的命令。\n\
  \n### 43.12 编辑共享默认值\n\n正如本章前面的几节所提到的，Samba 配置允许你定义适用于所有共享的默认值，除非被特定覆盖。这可以通过点击主页上的\
  \ `File Share Defaults`（文件共享默认值）或 `Printer Share Defaults`（打印机共享默认值）图标之一、编辑出现表单的内容并点击\
  \ `Save`（保存）来完成。然而，此表单中的大多数选项在全局设置时并不特别有用，可能 `Available?`（可用？）和 `Browseable?`（可浏览？）除外。\n\
  \n更有用的是，你可以点击默认页上的任意图标并更改适用于所有文件或打印机共享的设置。对于 `Security and Access Control`（安全与访问控制）图标（两个页面均出现），你设置的全局默认值将同时适用于文件和打印机共享，因为\
  \ Samba 不区分它们。\n\n任何全局设置的选项都将作为每个共享表单上的默认值出现。例如，如果你在 `Printer Share Defaults` 页面上的\
  \ `Printer Options` 下填充了 `Delete job command`（删除作业命令）字段，然后进入特定打印机的相同页面，则会显示相同的值。尽管该命令实际上没有出现在打印机的配置文件中，但\
  \ Webmin 仍然会显示它，因为它将作为默认使用。当然，如果你为共享输入了不同的命令，它将覆盖全局设置并从而被使用和显示。这种行为可能会让人有些困惑，因为这不是其他\
  \ Webmin 模块通常的工作方式。\n\n### 43.13 配置网络\n\n此模块可设置各种 Samba 选项，控制整个服务器在 Windows 客户端面前的表现和行为。你可以更改\
  \ `workgroup`（工作组，系统在网络邻域显示中列出的组）、服务器名称以及任何别名，以及出现在名称旁边的描述。还可以编辑与文件共享协议和身份验证方法相关的选项以支持旧版客户端。\n\
  \n甚至可以将你的系统设为 WINS 服务器或客户端，当 DNS 不可用时，某些 Windows 客户端使用该协议来查找 SMB 服务器名称的 IP 地址。WINS\
  \ 和 DNS 的最大区别是，客户端可以在 WINS 服务器注册自己的名称和 IP 地址，而不是由管理员来完成。这在没有 DNS 服务器的小型文件共享网络上最有用。\n\
  \n要编辑这些 Windows 网络选项，请遵循以下步骤：\n\n点击模块主页上 `Global Configuration`（全局配置）部分中的 `Windows\
  \ Networking`（Windows 网络）图标，显示图 43.4 所示的表单。\n\n##### 图 43.4. Windows 网络选项表单。\n\n\
  ```\n![](img/43fig04.jpg)\n```\n\n要为服务器设置工作组，选择 `Workgroup` 字段中的第二个单选按钮并在旁边的文本框中输入短名称。如果你的网络已经有一些作为工作组成员的\
  \ SMB 服务器，则这台服务器也应该成为成员。\n\n如果你的网络已经有一个 WINS 协议服务器，选择 `Use server in the WINS mode`（在\
  \ WINS 模式使用服务器）字段并输入其 IP 地址。如果没有，你应该选择 `Be WINS server`（成为 WINS 服务器），以便 Windows\
  \ 客户端可以使用你的系统查找 SMB 服务器名称的 IP 地址。较版本的 Windows（以及 Linux 客户端）不需要使用 WINS，因为只要网络中有包含所有主机条目的\
  \ DNS 服务器，它们就可以查找服务器名称。\n\n要为系统设置描述，在 `Server description`（服务器描述）字段中填写类似 `Corporate\
  \ file server` 的内容。\n\n通常，Samba 将使用系统 DNS 名称的第一部分作为 SMB 服务器名称。要更改此项，请在 `Server name`（服务器名称）字段中输入其他内容。客户端可以通过你指定的任何名称引用此服务器。\n\
  \n要定义客户端引用服务器的备名称，在 `Server aliases`（服务器别名）字段中填写用空格分隔的名称列表。\n\n如果你希望你的系统成为网络的主浏览器（维护网络上其他\
  \ SMB 服务器和客户端列表的服务器，在 Windows 网络邻域中可见），请将 `Master browser?`（主浏览器？）字段更改为 Yes。如果你在同一子网上运行多个\
  \ Samba 服务器，则此选项应仅在其中一个上设置。\n\n如果网络上有其他想要成为主浏览器的 Windows 或 Samba 服务器，操作系统级别最高的将赢得决定谁获得该工作的“选举”。你可以通过增加\
  \ `Master browser priority`（主浏览器优先级）字段的值来增加你的系统获胜的机会，默认值 20 可以赢得 Windows 95 系统，但你需要输入\
  \ 65 才能击败 Windows NT 服务器。\n\n\n\n```text\n要让您的 Samba 服务器联系另一个 SMB 服务器来验证密码，而不是检查其自身的用户列表，请从\
  \ `Security` 菜单中选择 `Password server`，并在 `Password server` 字段中输入另一个服务器的主机或 IP 地址。否则，请将该字段设置为\
  \ `Default` 或 `User level`。由于现代客户端很少使用共享层级安全，且 `Domain security` 过于高级，本章将不再涵盖。\n\
  \n通常情况下，SMB 服务器会向网络上的其他服务器广播其自己的信息，以便将其包含在浏览列表中。然而，如果您的网络跨越多个子网，来自一个系统的广播可能无法到达其他系统。为了解决这个问题，可以使用\
  \ `Remote announce to table` 来指定浏览器主服务器的地址，将此服务器的 IP 地址和工作组发送到这些地址。\n\n要在此页面上配置远程公告，请首先选择表格上方\
  \ `From` 列表选项。然后，在每行的 `IP address` 字段中输入要公告的服务器的主机或 IP 地址，并在 `As workgroup` 字段中输入您的服务器应该显示的工作组名称。如果第二个字段为空，则将使用服务器实际的工作组（在“第\
  \ 2 步”中设置）。要输入两个以上的远程服务器，您需要保存并重新打开此页面，以便表格中出现更多空行。\n\n最后，点击 `Save` 按钮以激活新的网络设置。\n\
  \nSamba 还有许多与网络相关的全局选项，控制如监听的 IP 地址、是否发送心跳包以及客户端在被断开之前可以空闲多长时间。这些选项可用于调整您的服务器性能，或限制仅允许本地网络上的客户端访问。要编辑这些选项，请遵循以下步骤：\n\
  \n点击模块主页上的 `UNIX Networking` 图标。\n\n要让 Samba 断开空闲过长且没有打开任何文件的客户端，请选择 `Idle time\
  \ before disconnect` 字段中的第二个单选按钮，并在相邻文本框中输入分钟数。如果选择 `Never`，客户端将永远不会被断开。由于 Samba\
  \ 为每个客户端启动一个服务器子进程，此功能对于减少它们消耗内存非常有帮助。Windows 客户端在断开后会自动重新连接，因此使用它没有副作用。\n\n要让 Samba\
  \ 发送数据包检测客户端是否在没有正常断开的情况下发生崩溃，请选择 `Keepalive packets` 字段中的 `Send every` 选项，并输入发送数据包的秒数（例如\
  \ `60`）。由于客户端可能持有文件锁，死掉的客户端可能会锁定其他人需要访问的文件，尽管该文件显然没有被使用。\n\n通过选择 `Socket options`\
  \ 字段中的 `SO_KEEPALIVE` 复选框也可以实现相同的效果。这告诉操作系统内核执行基本上相同的操作，并且应该是首选方法。唯一的问题是您无法指定心跳包的间隔时间。\n\
  \n要限制 Samba 仅在您的系统 IP 地址之一上监听连接，请填写 `Listen on address` 字段。在一个接口连接到内网另一个接口连接到互联网的机器上，可以使用此功能防止外部人员连接到您的\
  \ Samba 服务器。\n\n点击页面底部的 `Save` 按钮以激活新的网络设置。\n\n当您查看实际表单时会发现，上面的字段比上述文档的要多。然而，其余字段具有非常特殊的用途，因此普通管理员不需要触碰。\n\
  \n### 43.14 配置身份验证\n\nSMB 协议允许用户从客户端系统更改服务器的密码。对于 Samba 服务器，这会导致加密密码文件的更新（假设正在使用它，这通常如此）。您还可以配置服务器更改用户的\
  \ UNIX 密码，如果它们正在保持同步，这样做是有意义的。\n\nWebmin 支持的另一个身份验证功能是用户名映射。这允许您将虚假的客户端登录名映射到真实的\
  \ UNIX 用户名，如果用户倾向于使用全名登录（例如使用 `Jamie Cameron` 而不是 `jcameron`），或者您的客户端经常在两个不同的网络之间移动（每个网络都有不同的\
  \ SMB 账户），这将非常有用。\n\n要使用此模块设置这些全局身份验证选项，请遵循以下步骤：\n\n在模块主页上，点击 `Authentication` 图标。\n\
  \n如第 43.3 节“管理 Samba 用户”所述，`Use encrypted passwords?` 字段决定 Samba 使用其单独的密码文件还是标准的\
  \ UNIX 用户数据库。由于所有最新版本的 Windows 都使用与 UNIX 格式不兼容的密码加密格式，此字段通常应设置为 `Yes`。\n\n允许未设置密码的用户登录，请为\
  \ `Allow null passwords?` 字段选择 `Yes`。\n\n`Password program` 字段设置了 Samba 在启用同步时用于更改用户\
  \ UNIX 密码的程序。如果选择 `Default`，将使用 `/bin/passwd`，这对于大多数 UNIX 系统都是正确的。您可以通过选择第二个单选按钮并在文本框中填写类似\
  \ `/usr/bin/yppasswd %u` 的内容来输入不同的命令。`%u` 代码将被替换为正在更改密码的用户名，这是因为命令是以 root 身份运行的。\n\
  \n要让 Samba 在用户通过网络更改 SMB 密码时更改其 UNIX 密码，将 `Change UNIX password as well?` 字段设置为\
  \ `Yes`。尽管如此，反向同步不受影响（有关其工作的更多细节，请参见第 43.3 节“管理 Samba 用户”）。\n\n要定义“虚假”SMB 账户，请在\
  \ `Username mapping` 字段中选择 `Listed below`。在下方的表格中，每行指定一个映射：第一个字段必须包含有效的 UNIX 用户名，第二个字段是您选择的任意\
  \ SMB 登录名。使用这些伪造账户名登录的客户端，当然必须为关联的 UNIX 用户提供正确的密码。\n\n点击页面底部的 `Save` 按钮以激活您的新身份验证设置。\n\
  \n### 43.15 配置打印机\n\n如果您从服务器共享打印机，您可能需要调整全局打印选项。这些选项决定了 Samba 用于提交、列出和删除作业的打印系统命令、它获取打印机列表的文件以及其他相关设置。要编辑这些选项，步骤如下：\n\
  \n点击模块主页上的 `Windows To UNIX Printing` 图标打开打印机选项表单。\n\n从 `UNIX print style` 菜单中选择您的设备上使用的打印系统类型。遗憾的是，几乎每种不同的\
  \ UNIX 版本都有它们自己的处理打印机和驱动程序的程序和配置文件，Samba 必须对每种进行不同的处理。您可能想要选择的选项包括：\n\n- `BSD`:\
  \  UNIX 打印软件，于 FreeBSD、NetBSD 和旧版本的 Linux 发行版中。\n- `SYSV`: 用于 Solaris、UNIXWare 和其他几个\
  \ UNIX 版本的打印系统。\n- `HPUX`: HP/UX 自带的打印系统。\n- `AIX`: IBM 版本的 UNIX 自带的打印软件。\n- `CUPS`:\
  \ 卓越的 CUPS 打印系统，包含在许多新的 Linux 发行版中。\n- `LPRNG`: 用于所有未运行 CUPS 的 Linux 系统的旧版 BSD 打印系统的改进版本。\n\
  \n大多数 Samba 包在默认配置文件中正确设置了此选项。第 22 节“打印机管理”更详细说明了各种打印系统之间的差异，以及如何为您的操作系统选择正确的系统。\n\
  \n\n\n通常情况下，Samba 会找到系统上的所有打印机，并在存在特殊的打印机共享时让它们对客户端可见。要禁用此功能，请将 `Show all printers?`（显示所有打印机？）字段改为\
  \ `No`。你仍然可以通过显式的 `\\\\servername*\\*printername` 路径访问打印机。\n\n当 `Printcap` 文件字段被设置为\
  \ `Default` 时，Samba 将从标准的 `/etc/printcap` 文件获取系统上可用的打印机列表。如果你希望它们都显示出来，这样做没有问题；但有时你希望向用户隐藏打印机。要这样做，可以创建一个如下的伪打印机文件：\n\
  \n```\nprinter1|Description for printer 1:\nprinter2|Description of second printer:\n\
  ```\n\n将此字段设置为该文件的路径。当存在打印机共享时，只有文件中列出的打印机才会自动可用。\n\nSamba 会缓存任何用于列出等待打印任务的命令（例如\
  \ `lpq`）的输出，以减少其运行频率。默认情况下，此缓存时间为 10 秒，但你可以使用 `Printer status cache time`（打印机状态缓存时间）字段来增加或减少它。如果你的\
  \ `lpq` 命令非常慢，你可能需要增加该时间。\n\n点击 `Save` 按钮激活你的新打印设置。\n\n### 43.16 从 Webmin 访问 SWAT\n\
  \nSWAT（代表 Samba Web 管理工具）是一个与 Webmin 的 Samba 模块类似的程序，但它是作为 Samba 本身包含的一部分。它提供了一个基于\
  \ Web 的配置界面，允许你创建和编辑共享以及全局设置。SWAT 通常从 `inetd` 或 `xinetd` 等超级服务器运行，这使其通常显示为端口 `901`\
  \ 上的 Web 服务器。大多数 Linux Samba 软件包都包含该程序及其对应的 `xinetd` 服务，但默认是禁用的。\n\n你也可以通过此 Webmin\
  \ 模块访问 SWAT，而无需将其设置为从 `inetd` 或 `xinetd` 运行。遗憾的是，如果 Samba 在全局 `Security and Access\
  \ Control`（安全与访问控制）页面上配置为仅允许来自某些 IP 地址的连接（使用 `Hosts to allow` 字段），则这种方法将无法工作。因为\
  \ SWAT 也使用 Samba 的配置文件，任何全局全局 IP 限制也会适用于它。当它从 Webmin 运行时，SWAT 无法确定连接的 IP 地址，如果存在任何\
  \ IP 限制，它将失败。\n\n假设你的系统并非如此，你可以按照以下步骤使用它：\n\n在模块主页上，点击 SWAT 图标。如果是第一次这样做，将 SWAT\
  \ 登录表单。\n\n如果出现了登录表单，请在 `Username` 字段输入 `root`，并在 `Password` 字段输入 root 用户的密码。由于\
  \ SWAT 可完全重新配置你的 Samba 服务器，因此它要求用户先进行身份验证。Webmin 会记住你输入的用户名和密码，以便将来可以跳过登录表单。\n\n\
  登录后，将出现 SWAT 主菜单。顶部是 Samba 配置各个部分的图标，点击这些图标会弹出编辑设置的表单。某些在 Webmin 中可以配置的内容在 SWAT\
  \ 中无法配置，反之亦然。因此，对于某些任务，你可能会发现 SWAT 界面更好用。\n\n要返回模块主页，点击任何页面底部的 `Return to share\
  \ list`（返回共享列表）链接。要让 Webmin 忘记你的 SWAT 密码以便再次登录，请点击右下角的 `Logout of SWAT`（退出 SWAT）链接。\n\
  \n请注意，当你通过此模块登录 SWAT 时，你输入的用户名和密码将明文存储在文件 `/etc/webmin/samba/swat` 中，该文件仅 root 可读。如果出于安全考虑这让你感到困扰，请不要使用模块的此功能，或者在使用后记得点击\
  \ `Logout of SWAT` 链接以限制暴露窗口。\n\n### 43.17 模块访问控制\n\n如第 52 章节所示，一旦 Webmin 用户被授予模块的访问权限，就可以进一步限制其仅访问部分功能子集。对于\
  \ Samba 模块，你可以允许用户编辑某些共享中特定类型的设置，同时拒绝其创建新共享或编辑全局选项的能力。如果你想让某人编辑适用于其目录共享的设置，同时保护\
  \ Samba 服务器的其他配置，这就会非常有用。\n\n然而，我不建议向不受信的用户授予即使是有限的模块访问权限，因为它具有许多可能被恶意用户用于获取系统 root\
  \ 权限的功能。例如，有人可以允许对具有 root 权限的共享访问，从而对任何文件进行远程修改。或者他们可以将客户端连接时以 root 身份运行的命令设置为更改\
  \ root 密码的命令。\n\n相反，这些访问控制功能应仅用于限制缺乏经验但仍受信任的用户可以做出的更改。要将此类用户限制为仅编辑少数共享，请遵循以下步骤：\n\
  \n在 Webmin Users 模块中，创建一个具有模块访问权限的用户，或修改现有用户赋予其访问权限。\n\n点击用户名旁边的 `Samba Windows\
  \ File Sharing` 以打开模块访问控制表单。\n\n将 `Can edit module configuration?`（可以编辑模块配置？）字段改为\
  \ `No`。\n\n将 `Can apply changes?`（可以应用更改？）到 `Can maintain auto UNIX to SAMBA users\
  \ sync?`（维护 UNIX 到 SAMBA 用户同步？）的所有字段都设置为 `No`，因为它们控制着用户不应触碰的全局设置访问。\n\n要向用户隐藏其无法访问的共享，将\
  \ `Hide inaccessible objects?`（隐藏不可访问的对象？）字段改为 `Yes`。将其设置为 `No` 会让他看到其他共享。但是，如果他尝试点击其中任何一个，将显示错误消息。\n\
  \n在 `Access file shares`（访问文件共享）字段中，取消勾选 `create`（创建），但保留 `read`（读）和 `write`（写）。对\
  \ `Access print shares`（访问打印共享）字段执行相同操作。这并不意味着他可以编辑所有共享。后面的字段将精确控制他可以配置哪些。\n\n将\
  \ `Enable per-file_share acls?`（启用每个文件共享 ACL？）和 `Enable per-print-share acls?`（启用每个打印共享\
  \ ACL？）字段改为 `Yes`，以便使用下一步设置的选项。\n\n在 `Per-share ACLs`（每个共享 ACL）表中，对于所有他不允许配置的共享，在\
  \ `Access share`（访问共享）和 `Connections`（连接）下选择 `n/a`。你绝对应该对全局共享这样做，因为它设置了其他其他的默认值。\n\
  \n对于你希望用户管理的共享，在 `Access share` 列中选择 `read write`。要允许用户杀死连接到此共享的客户端，在 `Connections`\
  \ 列中选择 `kill`。或者，为了让他只查看连接的客户端，请选择 `view`（查看）。然而，从安全角度考虑，前者选项并不是一个好主意，因为它允许用户终止你系统上的任何进程。\n\
  \n`security`（安全）、`permissions`（权限）、`file naming`（命名）以及 `miscellaneous`（杂项）或 `printer`（打印）列中的单选按钮控制共享编辑表单上用户可以的子图标。对于每个子图标，你可以选择\
  \ `edit`（编辑）允许编辑，`view`（查看）仅让他查看设置，或选择 `n/a` 完全拒绝访问。\n\n点击页面底部的 `Save` 按钮激活新的访问控制设置。\n\
  \n### 43.18 配置 Samba Windows 文件共享模块\n\n该模块假设你已经安装了适用于你的操作系统或 Linux 发行版的 Samba 软件包，或者在没有此类软件包的情况下从源代码编译了\
  \ Samba。如果不是如此（例如，如果你编译了最新版本而不是使用软件包），它用于 Samba 程序和配置文件的路径将是错误的。这将模块主页错误地显示关于 Samba\
  \ 未安装的错误消息。\n\n\n\n\n幸运的是，可以通过点击主页面左角的标准“模块配置”（Module Config）链接轻松更改这些路径。如果你在弹出的表单中点击此链接，会有控制模块用户界面的字段（在`Configurable\
  \ options` 可配置选项下）以及配置文件和程序路径的字段（在`System configuration` 系统配置下）。第一组设置可以随时安全地更改，但设置路径的设置通常不需要调整，因为默认值通常是正确的。\n\
  \n表 43.1 列出了可用的配置字段及其含义。\n\n### 表 43.1. 模块配置选项\n\n| 字段 | 描述 |\n| :--- | :--- |\n\
  | 不添加到 Samba 密码列表的 UNIX 用户列表 | 在将 UNIX 用户转换为 Samba 用户的表单中（见第 43.3 节“管理 Samba 用户”），有一个字段列出了不进行转换的用户。其默认值取自此配置字段，因此，如果你发现自己总是添加某些用户以将其排除在转换之外，你可能想将它们添加到此处。\
  \ |\n| 按名称对用户和组排序 | 当此字段选择 `Yes` 时，Samba 用户列表将按登录名排序。如果选择 `No`，它们将按照被转换或添加的顺序列出。\
  \ |\n| Samba 配置文件的位置 | 此字段必须包含 Samba 配置文件 `smb.conf` 的完整路径，例如 `/etc/smb.conf` 或\
  \ `/usr/local/samba/lib/smb.conf`。 |\n| Samba 密码文件的位置 | 为了让模块能够编辑和创建 Samba 用户，此字段必须包含存储这些用户的文本文件的完整路径。它被称为\
  \ `smbpassswd`，通常位于 `/etc` 或 `/usr/local/samba/private` 中。不要输入 `smbpasswd` 程序的路径！\
  \ |\n| smbstatus 的完整路径 | 在此字段中，你必须输入 `smbstatus` 程序的路径，它可以显示已连接用户的列表。 |\n| smbpasswd\
  \ 的完整路径 | 此字段必须包含 `smbpasswd` 程序的完整路径，用于设置用户的加密密码。 |\n| smbd 的完整路径 | 此字段必须包含 `smbd`\
  \ 服务器程序的所在地，例如 `/usr/sbin/smbd`。 |\n| nmbd 的完整路径 | 同样，此字段必须包含 `nmbd` 服务器程序的所在地，通常位于与\
  \ `smbd` 相同的目录中。 |\n| swat 的完整路径 | 如果你想在该 Webmin 模块中使用 SWAT，则此字段必须包含 `swat` 可执行文件的完整路径。如果路径不正确或选择了\
  \ `None`，模块的其他部分仍可工作，但主页面上不会出现 SWAT 图标。 |\n| smbgroupedit 的完整路径 | 如果你运行的是支持 Samba\
  \ 组以及用户的 Samba 版本 3，则此字段应设置为组编辑命令的路径。这将启用模块的组管理和同步功能，本章未涵盖这些内容，因为 Samba 3 仍在开发中。\
  \ |\n| 启动 Samba 服务器的命令 | 此字段决定了点击模块主页面上的“启动 Samba 服务器”按钮时运行什么命令。当用户点击“重启 Samba 服务器”以便在运行下一个字段中设置的停止命令后重启\
  \ Samba 时，也会使用到该字段。如果选择了 `None`，模块将仅运行 `smbd` 和 `nmbd`，这运行良好，如果你是从源代码编译并安装 Samba\
  \ 的，则应该使用这种方法。某些 Linux 发行版软件包包含一个启动服务器的引导脚本。在这些系统上，此字段默认设置为类似 `/etc/init.d/samba\
  \ start`。当然，如果你没有实际安装软件包版本，这将无法工作。 |\n| 停止 Samba 服务器的命令 | 与上一个字段一样，此字段决定了在选择“重启\
  \ Samba 服务器”按钮时使用什么命令来停止 Samba。你可以选择 `None` 让模块简单杀死所有的 `smbd` 和 `nmbd` 服务器进程，或者输入类似\
  \ `/etc/init.d/samba stop` 的命令来执行。如果你是从源代码编译并安装 Samba 的，应使用第一种方案，因为可能不存在此类脚本。 |\n\
  \n### 43.19 总结\n\nSamba 是迄以来开发的最有服务器之一，因为它允许任何 UNIX 系统作为 Windows 客户端的文件或打印机服务器运行。在读完本章后，你应该理解如何设置\
  \ Samba 以便现代客户端系统登录，以及如何创建新用户账户。你还应该理解如何指定哪些目录和打印机可用，以及如何设置适用于部分或所有共享的 IP 访问控制或访客访问等选项。\n\
  \n## 第 44 章 配置 Squid 代理服务器\n\n本章解释了什么是 HTTP 或 FTP 代理服务器，并解释了如何使用 Webmin 配置流行的 Squid\
  \ 代理程序。\n\n### 44.1 代理与 Squid 简介\n\nHTTP 代理服务器基本上是一个接受客户端对 URL 的请求、获取这些请求并将结果返回给客户端的程序。代理用于客户端无法直接访问\
  \ Internet 但仍需要查看网页的网络，并用于缓存经常请求的页面，这样如果有多个客户端想要查看同一个页面，则只需要下载一次。\n\n许多公司和组织设置了防火墙，拦截内部局域网（LAN）系统所有的进入和出站流量。这可能是出于安全考虑，或者为了限制员工在互联网上访问的内容。由于能够查看网页极其有用，因此通常会设置代理，以便通过它访问网站。\n\
  \n拥有许多客户端 PC 同时访问网页的大型机构和 ISP（互联网服务供应商）可能希望运行代理服务器以减轻网络负载。因为代理的主要任务之一是缓存客户端请求的页面，因此任何被请求多次的页面都将从缓存返回，而不是从原始服务器获取。出于此原因，通常建议或强制客户端系统使用缓存代理来访问\
  \ Web。\n\n只有当客户端浏览器配置为使用代理而不是直接连接网站时，代理才有用。幸运的是，存在的每一个浏览器以及几乎所有通过 HTTP 下载各种文件的程序，都可以配置为使用代理。此配置告诉它们向代理服务器建立特殊的\
  \ HTTP 连接，并指定完整的下载 URL。\n\n代理不仅用于 HTTP，它们还可以支持客户端的 FTP 和 Gopher 协议请求，通过向实际服务器建立\
  \ FTP 或 Gopher 连接来提供服务。即使是加密的 SSL 连接也可以由代理处理，尽管它无法解密请求。相反，代理只是转发从客户端的所有数据。\n\nSquid\
  \ 是 UNIX 系统最流行的代理服务器。它可以从 `www.squid-cache.org` 免费下载，并作为标准软件包包含在所有 Linux 发行版和其他操作系统中。Squid\
  \ 支持代理、缓存和 HTTP 加速，并有大量的配置选项来控制这些功能的行为。\n\nSquid 从文本文件 `squid.conf` 读取配置，通常位于 `/etc`\
  \ 目录下。此文件由每行一个指令组成，每个指令都有名称和值。每个指令设置某些选项，例如监听的 TCP 端口或存储缓存文件的目录。Webmin 的 Squid 模块直接编辑此文件，忽略它不理解的注释或指令。\n\
  \n\n\n\n多年来 Squid 发布了多个版本，每个版本支持不同的配置指令，或对相同指令赋予了不同的含义。这意味着版本 2.0 的 `squid.conf`\
  \ 文件可能与 Squid 2.5 不兼容，而 Squid 2.5 的文件显然无法在 2.0 版本运行。幸运的是，Webmin 知道每个版本支持哪些指令，并且允许编辑运行的\
  \ Squid 版本所知的指令。\n\n缓存的网页被存储在多级目录结构中的文件中，以提高文件系统的性能。Squid 可以配置为使用多个独立的缓存目录，以便将文件分布在不同的磁盘上以提高性能。每当请求可缓存页面时，它都会被存储在一个文件中，这样当后续请求相同的页面到达时，就可以读取该文件并从中提供数据。由于某些网页会随时间变化（甚至是动态生成的），Squid\
  \ 会跟踪网页的最后修改和过期日期，以便在数据过期时清除缓存中的数据。\n\n处理客户端请求的实际程序是一个持久运行的服务器进程，称为 `squid`。它可能还会启动其他几个子进程来执行\
  \ DNS 查询或客户端验证等任务，但所有的实际 HTTP 协议处理都在单个主进程中完成。与 Apache 或 Sendmail 等其他类似的服务器不同，Squid\
  \ 不启动或使用子进程来处理客户端请求。\n\nSquid 可以在 Webmin 支持的所有 UNIX 变体上编译，并且在所有版本上的工作方式几乎相同。这意味着\
  \ Webmin 模块的用户界面在不同操作系统之间也是相同的，但其用于 Squid 程序和配置文件的默认路径除外。\n\n## 44.2 Squid 代理服务器模块\n\
  \n如果你想在 Webmin 内部设置或重新配置 Squid，你需要使用“服务器 (Servers)”类别下的“Squid 代理服务器”模块。选中该图标后，假设\
  \ Squid 已正确安装并配置，将显示图 44.1 所示的页面。如所示，主页仅由图标表格组成，点击每个图标都可以弹出表单，用于编辑某些类别中的设置。\n\n\
  ##### 图 44.1. Squid 模块主页。\n\n![](img/44fig01.jpg)\n\n如果你之前没有在系统中配置或启动过 Squid，那么缓存目录可能尚未设置。该模块将检测到这一点，并在图标列表上方显示类似\
  \ `Your Squid cache directory /var/spool/squid has not been initialized` 的消息。要初始化缓存，请遵循以下步骤：\n\
  \n如果你对显示的缓存目录不满意，现在是更改它的时候。在继续之前，请按照 44.4 节“添加缓存目录”中的指令定义你自己的目录。\n\n在“Unix 用户 (as\
  \ Unix user)”字段中，输入将拥有缓存文件并运行守护进程的用户名称。通常情况下，这是一个专门为此特定目的创建的特殊 squid 用户（如果存在此类用户，该字段将默认为\
  \ `squid`），但任何用户都可以。不过，我建议在需要时使用“用户和组 (Users and Groups)”模块（见第 4 章）创建一个名为 `squid`\
  \ 的用户，其主目录设置为缓存目录。\n\n点击“初始化缓存 (Initialize Cache)”按钮。Squid 配置将更新为使用你选择的用户名，并将运行\
  \ `squid z` 命令来设置缓存目录。它产生的所有输出将显示出来，以便你可以看到初始化进度。\n\n进程完成后，返回模块主页，错误消息应该就会消失。\n\n\
  如果你的系统中完全没有安装 Squid（或安装在与 Webmin 预期的不同的位置），主页将显示类似 `The Squid config file /etc/squid.conf\
  \ does not exist` 的错误消息，而不是图标列表。如果你已经安装了，请阅读 44.17 节“配置 Squid 代理服务器模块”获取如何更改模块使用的路径的说明。如果尚未安装，你应该使用“软件包\
  \ (Software Packages)”模块（见第 12 章）从你的 Linux 发行版 CD 或源网站安装 `squid` 包。\n\n如果你的操作系统不存在此类包，你将从\
  \ [www.squid-cache.org](http://www.squid-cache.org/default.htm) 下载、编译并安装最新版本的 Squid。只要你的系统中安装了编译器，这是一个相对简单且没有额外依赖项的过程。\n\
  \n一旦安装了服务器，如果你想长期使用 Squid，应该安排使用“启动和关机 (Bootup and Shutdown)”模块（见第 9 章）让它在启动启动时启动。所有\
  \ Linux 包都包含一个 Squid 的启动动作脚本，尽管它默认可能是被禁用的，因此你需要在该模块中启用它。否则，你需要创建一个运行类似 `/usr/local/squid/bin/squid\
  \ sY` 命令的动作，假设你已将 Squid 安装在 `/usr/local/squid` 中。\n\n一旦安装并初始化了 Squid，你就可以开始使用此模块。当\
  \ Squid 运行时，每个页面顶部有两个链接：“应用更改 (Apply Changes)”，它会强制重新读取当前配置；“停止 Squid (Stop Squid)”，它会关闭代理服务器。如果服务器未运行，这些链接会被“启动\
  \ Squid (Start Squid)”取代，后者（顾如其名）会尝试启动它。如果它尚未运行，你可能想在此时启动它。\n\n由于每个版本的 Squid 都引入了新的配置指令，此模块的用户界面将根据在系统中检测到的\
  \ Squid 版本而不同。本章中的所有指令都是为 Squid 2.4 编写的，因为它是部署最广泛的版本。如果你运行较旧或较新的版本，表单可能会出现不同的字段，或者选项较少。例如，每个新版本都引入了不同的\
  \ ACL 类型，而认证在程序历史上通过三种不同的方式处理。然而，基本概念始终是相同的。\n\n当你使用此模块时，确保你的浏览器配置为不使用代理访问你的 Webmin\
  \ 服务器。否则，如果你配置了错误或关闭了服务器，可能会面临断开对模块访问的风险。所有可以使用代理的浏览器都有一个列出直接连接主机的字段，你可以在其中输入 Webmin\
  \ 服务器的主机名。\n\n## 44.3 更改代理端口和地址\n\n默认情况下，Squid 在你系统所有 IP 地址的 TCP 端口 `3128` 上监听代理请求。由于这不是代理运行的常用端口（8000\
  \ 和 8080 似乎最常见），你可能想要更改它。如果你的系统有多个网络接口，你可能还会编辑监听地址，以便只有内部网络上的客户端可以连接。\n\n要指定 Squid\
  \ 使用的端口，请遵循以下步骤：\n\n在模块主页上，点击“端口和网络 (Ports and Networking)”图标弹出图 44.2 所示的表单。\n\n\
  ##### 图 44.2. 端口和网络表单。\n\n![](img/44fig02.jpg)\n\n在“代理地址和端口 (Proxy addresses and\
  \ ports)”表中，选择“下方列表 (Listed below)”选项。在提供的表格中，每行定义了一个监听端口和一个可选的绑定地址。任何现有端口和地址将列出，随后跟着一个空行用于添加新项。在“端口\
  \ (Port)”列的第一个空字段中，输入类似 `8000` 或 `8080` 的端口号。在“主机/IP 地址 (Hostname/IP address)”列中，选择“全部\
  \ (All)”以接受来自系统任何接口的连接，或者选择第二个选项并在相邻的文本框中输入 IP 地址。\n\n\n\n\n使用此表，可以配置 Squid 监听任意数量的端口。然而，由于一次只显示一个空行，您需要保存并重新打开表单以添加多个新端口。\n\
  \nICP 是 Squid 用于与集群中的其他代理服务器进行通信的协议。填入 `ICP` 端口字段，可以监听除默认 `3130` 以外的 ICP 端口。不过，这通常没有必要，因为只有其他代理服务器会使用此协议。\n\
  \nSquid 通常接受来自任何 IP 地址的 `ICP` 连接。要更改此设置，请选择 `Incoming UDP address` 字段中的第二个单选按钮，并在文本框中输入您系统的一个接口\
  \ IP。如果您的服务器可能想要通信的所有其他代理服务器都在单个内部局域网（LAN）中，这将非常有用。\n\n点击页面底部的 `Save` 按钮用您的新设置更新配置文件，然后点击主页面上的\
  \ `Apply Changes` 链接以激活这些设置。\n\n## 44.4 添加缓存目录\n\n在通常的默认配置中，Squid 使用单个目录来存储缓存页面。该目录最多将存储\
  \ 100 MB 的数据，如果为大量活动客户端提供服务，这可能不够用。如果您的系统有多个硬盘，将缓存分散在多个磁盘上以提高性能是有意义的。可以通过指定多个目录来实现，每个目录都有自己的最大大小。\n\
  \n在专门运行代理服务器的系统上，每个目录中缓存的最大量应约为可用空间的 90%。配置或允许 Squid 用尽所有空磁盘空间是不明智的，因为许多文件系统在几乎满额时性能会下降。此外，磁盘空间还可能被日志文件和用户数据占用。如果\
  \ Squid 满了您的整个硬盘，可能会出现问题，因为其他程序无法创建临时文件或写入日志。\n\n要添加新缓存目录并为现有目录指定最大大小，请遵循以下步骤：\n\
  \n点击模块主页上的 `Cache Options` 图标，显示图 44.3 所示的表单。\n\n### 图 44.3 缓存选项表单。\n\n![](img/44fig03.jpg)\n\
  \n在 `Cache directories` 字段中，选择 `Listed` 选项。如果之前选择了 `Default`，则 Squid 一直在使用括号中显示的单个编译默认缓存目录。如果您想继续使用此目录，必须显式地将其输入表中。默认大小为\
  \ 100 MB，并使用 16 个一级目录和 256 个二级目录。\n\n表中的每行指定一个缓存目录。任何现有的目录（默认目录外）都将列出以便您对其进行编辑，随后是一个空行。每行在以下列下都有有字段：\n\
  \n- **Directory**: 顶级缓存目录的完整路径，例如 `/var/spool/squid` 或 `/disk2/cache/`。此目录必须已经存在，并由运行\
  \ Squid 的用户（通常称为 `squid`）所有。模块不会为您创建它。\n- **Type**: 目录中使用的存储类型。您应该始终在此选择 `UFS`。\n\
  - **Size (MB)**：其包含的最大数据量，以 MB 为单位。一旦达到此限制，最旧的未请求将被新文件替换。\n- **1st level dirs**:\
  \ 在缓存目录下创建的子目录数量。默认的 16 通常可以，但对于非常大的缓存，您可能希望增加此值。\n- **2nd level dirs**: 在每个一级目录下创建的子目录数量。除非您的缓存非常大，否则您只需输入\
  \ 256。\n- **Options**: 留空此字段；它仅用于其他类型的目录。\n\n如果您好奇为什么 Squid 需要在每个缓存目录下创建两级子目录，原因在于许多文件系统在目录包含大量文件时性能很差。因为每个缓存的\
  \ HTML 页面或图像都存储在单独文件中，繁忙代理系统上的文件数量可能是巨大的。将它们分散到多个目录中可以解决这个问题。\n\n添加目录后，点击页面底部的 `Save`\
  \ 按钮。如果您想添加多个，需要再次点击 `Cache Options` 图标以重新显示带有新空行的表格。\n\n定义完目录后，返回模块主页。如果添加了新目录，将显示类似\
  \ `Your Squid cache directories have not been initialized` 的错误消息。点击 `Initialize\
  \ Cache` 按钮，让 Squid 在任何新缓存目录中创建所有子目录。服务器在此过程中将关闭，并在完成后重启。\n\n初始化完成后，点击任何页面上的 `Apply\
  \ Changes` 链接开始使用您的新目录。\n\n## 44.5 编辑缓存和代理选项\n\nSquid 拥有许多设置，可以限制缓存对象的大小、客户端请求的大小以及要缓存的页面类型。这些设置可以防止服务器存储巨型文件（例如下载的\
  \ ISO 镜像），限制客户端可以上传或下载的文件大小，并防止缓存频繁变化的页面（例如由 CGI 脚本生成的页面）。默认设置通常运行良好，但可能的例外是最大上传大小，它仅为\
  \ 1 MB。\n\n要编辑缓存选项，请遵循以下步骤：\n\n点击主页上的 `Cache Options` 图标再次显示 `Cache Options` 表单（见图\
  \ 44.3）。\n\n- 要设置上传文件的大小，在 `Maximum request size` 字段中选择第二个选项，在文本框中输入数字并从菜单中选择单位。10\
  \ 或 100 MB 对任何人来说都足够。\n- 要停止客户端下载大文件，以相同的方法填充 `Maximum reply size` 字段。这可以防止客户端通过下载电影或\
  \ ISO 文件滥用您的网络，但可以通过分段下载大文件来绕过。\n- 如果您想对页面在缓存中的时间设置上限，请填充 `Maximum cache time` 字段，而不是将其设置为\
  \ `Default`。否则，数据将缓存一年，或直到原始服务器设置的过期日期。\n\n除了缓存下载的文件外，Squid 还会记住来自服务器的错误信息，并返回给请求相同页面的客户端。您可以通过在\
  \ `Failed request cache time` 字段中输入数字并选择 `Units` 来更改缓存的时间。如果选择 `Default`，错误将缓存 5\
  \ 分钟。然而，如果您刚刚修复了网站上的错误，这可能也长得令人讨厌。\n\nSquid 会缓存主机名查找的响应以减少 DNS 活动，无论 DNS 服务器提供的\
  \ TTL 是多少。如果在 `DNS lookup cache time` 字段中选择了 `Default`，响应将保留 6 小时。如果您认为这太长了，请选择第二个单选按钮并输入您自己的缓存时间。\n\
  \n`Don't cache URLs for ACLs` 字段用于完全阻止某些 URL、Web 服务器或客户端的缓存。匹配此字段中检查的任何 ACL 的请求都都不会被缓存，因此将始终直接获取。您可以使用此功能阻止缓存动态生成页面，只需为\
  \ `.cgi` 或 `cgi-bin` 创建 `URL Path Regexp ACL` 并在此处选择它。有关 ACL 如何工作和定义的更多信息，请参阅第 44.6\
  \ 节“访问控制列表简介”。\n\n点击页面底部的 `Save` 按钮返回主菜单。由于一些额外的缓存选项位于内存和磁盘使用表单上，点击 `Memory Usage`\
  \ 图标显示它。\n\n\n\n\n为了限制 Squid 使用的内存量，请填写内存使用限制（Memory usage limit）字段。请注意，此限制仅影响存储传输中文件、频繁访问的文件以及负响应的最大内存占用。由于\
  \ Squid 还会将内存用于其他用途，其实消耗会超过你在此输入的任何数值。如果选择了 `Default`（默认），则将执行 `8 MB` 的限制，这对于繁忙的服务器可能太低了。\n\
  \n为了防止缓存大文件，请填写最大缓存对象大小（Maximum cached object size）字段。默认值为 `4 MB`，因此如果你有足够的磁盘空间，应该将其增大。\n\
  \n点击表单底部的 `Save`（保存）按钮，然后点击主页面上的 `Apply Changes`（应用更改）链接以激活所有新设置。\n\n## 44.6 访问控制列表（ACL）简介\n\
  \nACL（访问控制列表）可能是 Squid 最强大的功能。ACL 简单来说就是应用于客户端请求的测试，用于检查其是否匹配。然后，根据每个请求匹配的 ACL，你可以选择阻止它、防止缓存、强制将其进入延迟池，或将其交给另一个代理服务器。存在许多不同类型的\
  \ ACL，例如，一种类型检查客户端的 IP 地址，另一种类型匹配正在请求的 URL，其他则检查目标端口、Web 服务器主机名、身份验证用户等。\n\nACL\
  \ 最常见的用途是阻止来自你网络外部客户端的连接。如果你运行一个连接到互联网并允许互联网访问的代理服务器，则不应允许本地局网外的主机使用它。恶意人员经常使用其他代理来清洗用于黑客、发送垃圾邮件或访问不应允许的网站的连接。\n\
  \n由于特殊的 `CONNECT` 代理请求可以连接到任何端口，因此 ACL 通常用于阻止其连接 `443`（SSL 默认端口）以外的任何端口。这可以防止用户使用你的代理连接到\
  \ Web 服务器以外的服务器，例如 AIM、ICQ 或 MSN。同样，可以设置 ACL 阻止对 `22`、`23` 和 `25` 等端口的普通 HTTP 请求，这些端口通常用于\
  \ SSH、telnet 和 SMTP。\n\n仅在 Squid 配置中定义 ACL 实际上不会产生任何作用，它必须以某种方式被应用才能生效。本节将解释如何使用\
  \ ACL 控制允许或拒绝哪些指向你服务器的请求。其他章节将解释它们与缓存以及访问其他服务器之间的逻辑关系。\n\n当 Squid 收到请求时，它首先确定请求匹配了哪些\
  \ ACL。然后，它会将此匹配列表与代理限制列表进行比较，每个限制都包含一个或多个 ACL 以及一个要执行的操作（`Allow` 允许或 `Deny` 拒绝）。一旦找到匹配请求\
  \ ACL 的限制，其操作将决定允许还是拒绝该请求。如果没有匹配到任何限制，则应用列表中最后一个操作的反向操作。出于于此原因，大多数 Squid 配置中的最终操作是\
  \ `Allow all`（允许所有）或 `Deny all`（拒绝所有）。\n\n来自其他代理的 ICP 请求也会被检查以确定它们匹配了哪些 ACL，并与一个相似但不同的\
  \ ICP 限制列表进行比较，以查看它们是否被允许。关于什么是 ICP 以及何时使用的复杂解释，请参见第 44.11 节“连接到其他代理”。\n\n典型的默认\
  \ Squid 配置包含几个 ACL 和代理限制。出于安全考虑，默认所有请求都会被拒绝。这意味着在任何人使用你的代理之前，你需要更改限制列表。继续阅读以了解方法。\n\
  \n要查看定义的 ACL、代理限制和 ICP 限制列表，请点击模块主页上的访问控制（Access Control）图标。如图 44.4 所示，左侧显示一张包含\
  \ ACL 名称、类型和匹配情况的表格。右侧是代理和 ICP 限制表，显示了它们的操作及其匹配的 ACL。限制表的每个条目旁边都有向下的箭头，以便在列表中移动它们，因为它们的顺序非常重要。\n\
  \n### 图 44.4. 访问控制列表页面。\n\n![](img/44fig04.jpg)\n\n在客户端可以使用你的代理之前，你需要配置允许来自某些地址的访问。按照以下步骤操作：\n\
  \n1. 在访问控制页面上，从现有 ACL 列表下方的菜单中选择 `Client Address`（客户端地址）。点击 `Create new ACL`（新建\
  \ ACL）按钮时，会出现输入匹配地址的表单。\n2. 在 `ACL name` 字段中输入一个短名称，例如 `yournetwork`。\n3. 在 `From\
  \ IP` 下方的空白字段中，输入允许范围内的起始 IP 地址，例如 `192.168.1.0`。\n4. 在 `To IP` 下方的字段中，输入范围内的结束地址，例如\
  \ `192.168.1.100`。只有落在此范围内的客户端才会匹配该 ACL。\n5. 你也可以通过在 `From IP` 字段中输入网络地址并在 `Netmask`\
  \ 字段中输入网络掩码（如 `255.255.255.0`）来指定 IP 网络。要输入多个，你需要保存并重新编辑此 ACL，以便出现新的空白字段。\n6. 点击\
  \ `Save` 按钮添加 ACL 并返回访问控制页面，你的新 ACL 将列在其中。\n7. 点击代理限制表下方的 `Add proxy restriction`（添加代理限制）。\n\
  8. 在出现的表单上，从 `Action` 字段选择 `Allow`（允许）。\n9. 在 `Match ACLs` 列表中，选择你新建的 `yournetwork`\
  \ ACL。\n10. 点击此表单上的 `Save` 按钮返回访问控制页面。新限制将显示在表格底部，最可能在 `Deny all` 条目下方。\n11. 点击你新限制旁边的向上箭头将其移动到\
  \ `Deny all` 之上。这告诉 Squid 允许来自你网络的连接并拒绝其他所有人。\n12. 最后，点击页面顶部的 `Apply Changes` 链接。现在你内部网络上的客户端可以使用该代理了，但其他人不行！\n\
  \n这些指令假设你从默认 Squid 配置开始。如果代理已经配置为允许从从任何地方访问（通过将 `Deny all` 限制更改为 `Allow all`），你应该将其改回以阻止来自网络外部的客户端。要了解更多可用\
  \ ACL 类型及其使用方法，请阅读接两个章节。\n\n### 44.7 创建和编辑 ACL\n\n在阻止或允许来自某些地址、到某些服务器或某些页面的请求之前，你需要创建一个相应的\
  \ ACL。按照以下基本步骤操作：\n\n1. 从访问控制列表表下方的菜单选择要创建的 ACL 类型，并点击 `Create new ACL` 按钮。\n2.\
  \ 在出现的表单上，在 `ACL name` 字段中为你的新 ACL 输入名称。如果有多个 ACL 名称相同，则只要有任何同名 ACL 匹配，就会被视为匹配。名称应仅包含字母和数字，不要有空格或特殊字符。\n\
  3. 如表 44.1 所示填写表单的其余部分。\n4. 在 `Failure URL` 字段中输入一个完整的 URL，被此 ACL 拒绝的客户端将重定向到该 URL。这允许你定义自定义错误页面以代替默认的\
  \ Squid 响应。\n5. 点击表单底部的 `Save` 按钮。\n\n一旦创建了 ACL，可以通过点击列表中的名称、更改字段并点击 `Save` 来编辑它。你也可以用\
  \ `Delete` 按钮删除它（如果它未被某些代理或 ICP 限制使用）。像往常一样，必须使用 `Apply Changes` 链接来激活你做的任何更改。\n\
  \nSquid 拥有极其数量的 ACL 类型，尽管并非所有类型在所有服务器版本中都可用。表 44.1 列出了你可以为 Squid 2.4 创建的类型，并解释了它们的作用以及每个类型\
  \ ACL 创建表单中各字段的含义。\n\n##### 表 44.1. Squid ACL 类型\n\n| 类型 | 用途 | 字段 |\n\n| --- |\
  \ --- | --- |\n\n\n\n\n\n| 类型 | 说明 | 配置详情 |\n| :--- | :--- | :--- |\n| 浏览器正则表达式\
  \ | 检查请求中发送的 `User-Agent` HTTP 头部，以识别客户端系统运行的浏览器类型。用于阻止某些浏览器或对它们进行特殊处理。 | **Browser\
  \ regexp**: 输入一个 Perl 风格的正则表达式，与浏览器标识字符串进行匹配。例如，IE 5.5 发送的标识为 `Mozilla/4.0 (compatible;\
  \ MSIE 5.5; Windows 98; H010818)`。 |\n| 客户端地址 | 检查请求客户端的 IP 地址，并对比网络地址或 IP 范围列表。通常用于仅允许来自本地局域网的客户端。\
  \ | 如第 44.6 节“访问控制列表简介”所述，当您创建或编辑此类类型的 ACL 时，会显示一个三列的表格。表格中的每一行定义了一个匹配的地址范围或网络，通过\
  \ `From IP` 和 `To IP` 字段指定起始和结束 IP，或者通过 `From IP` 和 `Netmask` 字段指定网络地址和子网掩码。通过保存并重新编辑客户端地址\
  \ ACL，表格中可能会添加多行。 |\n| 客户端主机名 | 对客户端 IP 地址进行反向 DNS 查询，并将其与主机名或域名进行比较。也用于允许网络内的客户端。\
  \ | **Domains**: 用于匹配客户端的主机名或域名列表，例如 `pc1.foo.com` 或 `*.example.com`。 |\n| 客户端正则表达式\
  \ 与 与客户端主机名 ACL 类型类似，但它是通过一系列正则表达式来对反向地址进行测试。 | **Regular expressions**: 用于检查主机名的\
  \ Perl 风格表达式列表，例如 `^.*.foo.com$`。如果勾选了 `Ignore case?` 框，则将进行不区分大小的比较（这是你一直需要的，因为\
  \ DNS 查询是不区分大小的）。 |\n| 日期和时间 | 此 ACL 类型根据当前时间和星期进行匹配，而不是根据客户端或请求的任何属性。用于在工作期间阻止访问您的代理或某些网站。\
  \ | **Days of the week**: 如果选择 `All`（全部），ACL 将匹配任何日期。如果选择 `Selected`（选中），则仅匹配下方列表中选的日期。**Hours\
  \ of the day**: 如果选择 `All`（全部），ACL 将匹配任何时间。否则，你必须在相邻字段中 24 小时 `HH:MM` 格式输入起始和结束时间。只有在该范围内的请求才会匹配。\
  \ |\n| 目标 AS 号 | AS 号用于识别互联网上的大型网络。如果目标 Web 服务器地址位于具有特定 AS 号的网络内，则此类 ACL 将被匹配。不常用。\
  \ | **AS numbers**: 一个用空格分隔的网络 AS 号列表，用于检查目标地址是否在其中。 |\n| 以太网地址 | 匹配来自特定 MAC 地址的客户端的请求。这对于允许具有动态\
  \ IP 地址的网络上的某些系统访问非常方便，但如果客户端和代理服务器之间有路由器，则无用处。然而，此 ACL 类型仅在编译 Squid 时启用了 `--enable-arp-acl`\
  \ 选项时才可用。 | **Client Ethernet addresses**: 以常用的冒号分隔格式的地址列表，用于匹配，例如 `00:D0:B7:1D:FB:A1`。\
  \ |\n| 外部认证 | 当使用此类 ACL 时，客户端将被强制登录代理，并根据列表检查其用户名。更多详情请参阅第 44.9 节“设置代理认证”。 | **External\
  \ auth users**: 如果选择 `All users`（所有用户），则将需要认证，任何有效用户都会匹配 ACL。如果选择 `Only those listed`（仅限列出的用户），则只有在提供的文本框中输入的用户才会匹配。这可以允许某些人访问特定网站，同时拒绝其他人。\
  \ |\n| 外部认证正则表达式 | 这类似于外部认证 ACL 类型，但支持使用正则表达式来对已验证的用户名进行匹配。 | **External auth users**:\
  \ 在此文本框中，你必须输入一个 Perl 风格正则表达式列表，用于匹配用户名。如果勾选了 `Ignore case?` 框，则将进行不区分大小的比较。 |\n\
  | 最大连接数 | 当单个客户端到代理服务器的并发连接超过指定数量时，此类 ACL 将匹配。有助于减少客户端可以产生的负载。 | **Maximum concurrent\
  \ requests**: 超过此数量的并发请求将触发 ACL 匹配。 |\n| 代理 IP 地址 | 匹配客户端连接的代理服务器上的 IP 地址。如果你的系统有多个网络接口且你希望对它们进行不同的处理（例如，拒绝来自互联网接口的连接），则非常方便。\
  \ | **IP address**: 与本地地址进行比较的 IP 或网络地址，例如 `192.168.1.100`。**Netmask**: 匹配 IP 地址时应用的子网掩码。如果你只想指定单个\
  \ IP 地址，在此处输入 `255.255.255.255`。 |\n| 代理端口 | 匹配客户端连接的代理服务器上的 TCP 端口。如果你的代理监听多个端口，且其中一个用于代理，则此类\
  \ ACL 可能很有用。 | **Proxy port**: 一个用空格分隔的端口列表，用于与本地端口比较。 |\n| RFC931 用户 | `ident`\
  \ 或 `RFC931` 协议用于识别连接到代理的 UNIX 用户，假设客户端系统启用了该功能。此类 ACL 类型可允许某些远程用户，但仅在你控制客户端系统时有效。\
  \ | **RFC931 users**: 在此文本框中，你可以输入用户名列表，例如 `jcameron` 和 `fcchan`。 |\n| 请求 MIME 类型\
  \ | 此 ACL 类型匹配客户端请求使用的 MIME 类型。最常见的用于普通 POST 请求的 `application/x-www-form-urlencoded`\
  \ 和用于文件上传的 `multipart/form-data`。 | **Request MIME type**: 导致此 ACL 匹配的类型。 |\n| 请求方法\
  \ | 每个 HTTP 请求都包含一个方法，通常为以下之一：`GET` 用于普通页面请求或表单提交。`POST` 仅用于表单提交。`CONNECT` 用于直接连接某些远程端口，通常用于\
  \ SSL。此类 ACL 通常用于阻止非 SSL 端口的 `CONNECT` 请求。 | **Request methods**: 此字段中勾选的方法指定了 ACL\
  \ 将匹配的方法。 |\n| SNMP 团体 | 此 ACL 类型仅用于限制访问 Squid 的 SNMP 代理。你永远不需要为控制普通代理请求创建它。 | **SNMP\
  \ community string**: 使用后会导致 ACL 匹配的团体字符串。 |\n| 源 AS 号 | 与目标 AS 号 ACL 类型，但它是基于客户端的网络号进行匹配的。\
  \ | **AS numbers**: 一个用空格分隔的网络 AS 号列表，用于检查客户端地址是否存在。 |\n| URL 路径正则表达式 | 根据请求 URL\
  \ 中的路径进行匹配。路径是主机名和端口之后的内容，例如 `/images/foo.gif`。用于检测对 CGI 程序动态生成面的请求。 | **Regular\
  \ expressions**: 用于与 URL 路径比较的 Perl 风格正则表达式列表。如果任何一个表达式匹配，则认为 ACL 匹配。除非勾选了 `Ignore\
  \ case?` 框，否则比较是区分大小写的。 |\n| URL 端口 | 此 ACL 类型根据请求中指定的端口进行匹配。对于阻止访问非 HTTP 端口（如 23\
  \ 和 25）有用。如果 URL 中未指定端口，Squid 将假设协议的默认端口（HTTP 为 80，FTP 为 21）。 | **TCP ports**: 用于与请求端口比较的端口空格分隔列表。\
  \ |\n\n\n\n\n\n| 字段 | 说明 | 详情 |\n| :--- | :--- | :--- |\n| URL 协议 | 根据 URL 中指定的协议进行匹配，例如\
  \ `http` 或 `ftp`。此类类型的 ACL 可用于阻止某些或所有客户端访问 `FTP`，或者阻止访问非标准端口。 | URL 协议：此字段中的勾选框表示\
  \ ACL 将匹配哪些协议。特殊的 `cache_object` 协议仅供 Squid 的缓存管理器程序使用。 |\n| URL 正则表达式 | 如果整个请求的\
  \ URL 匹配一系列正则表达式中的任何一个，则此类 ACL 匹配成功。适用于阻止对某些页面或网站的访问。 | 正则表达式：用于检查 URL 的 Perl 风格表达式列表。如果勾选\
  \ `Ignore case?` 复选框，则进行不区分大小写的比较；否则，区分大小写。 |\n| Web 服务器地址 | 类似于客户端地址 ACL 类型，但它是根据请求目标服务器的\
  \ IP 地址进行匹配的。它可以用于阻止整个网络，或托管你不希望用户访问内容的特定系统。 | 在编辑或创建此类类型的 ACL 时，会显示一个输入系列网络地址和子网掩码的表格。与\
  \ Webmin 中的所有表格一样，它列出了所有现有网络，并在最后留出一个空行用于添加新网络。在 IP Address 下方的第一个空字段中，应输入网络或单个\
  \ IP，如 `1.2.3.0` 或 `192.168.1.55`。在 Netmask 下的相邻字段中，如果仅指定单个地址，必须输入如 `255.255.255.0`\
  \ 或 `255.255.255.255` 的掩码。 |\n| Web 服务器主机 | 此 ACL 将请求 URL 中的主机名与主机或域名列表进行比较。因为它不进行\
  \ IP 地址的反向查询，因此对于阻止访问网站并不有用。 | 域名：用于与 URL 主机比较的主机名（如 `www.foo.com`）或域名（如 `.foo.com`）列表。\
  \ |\n| Web 服务器正则表达式 | 类似于 Web 服务器主机 ACL 类型，但它是将请求的主机与一系列正则表达式进行比较。 | 正则表达式：用于匹配从请求\
  \ URL 中提取的主机的 Perl 风格表达式列表。您应该勾选 `Ignore case?` 复选框，因为主机名始终是不区分大小写的。 |\n\n许多类型的\
  \ ACL 适用于某些情况。例如，如果客户端发送 `CONNECT` 请求，则 URL 路径不可用，因此 `URL Path Regexp` ACL 将无法工作。在这种情况下，ACL\
  \ 会被自动认为不匹配。\n\n## 44.8 创建和编辑代理限制\n\n一旦您创建了一些 ACL，就可以通过创建、编辑和移动代理限制来使其投入使用。Squid\
  \ 会按顺序将每个请求与所有定义的限制进行比较，并在找到匹配项时停止。该限制所设置的操作（Action）将决定是允许还是拒绝该请求。这种处理系统结合 ACL 的强大功能，允许您设置一些极其复杂的访问控制规则。例如，您可以设置在周一至周五上午\
  \ 9 点到下午 5 点之间拒绝所有 URL 中包含 `quake` 的网站访问，但某些客户端地址除外。\n\n要创建代理限制，请遵循以下步骤：\n\n1. 点击模块主页上的\
  \ `Access Control` 图标，打开图 44.4 所示的页面。\n2. 点击现有限制列表下 `Add proxy restriction` 进入创建表单。\n\
  3. 从 `Action` 字段中选择 `Allow` 或 `Deny`，取决于您是否希望处理匹配的请求。\n4. `Match ACLs` 列表可用于选择多个\
  \ ACL，如果所有 ACL 都匹配，则将触发操作。`Don't match ACLs` 字段也可用于选择必须不匹配才能触发操作的 ACL。从两个列表中进行选择是完全有效的，这表示仅当左侧的所有\
  \ ACL 都匹配且右侧 ACL 不匹配时才触发操作。\n5. 在默认配置下，Squid 有一个名为 `all` 的 ACL 可匹配所有请求。这对于创建允许或拒绝所有人的限制非常有用，通常默认就会存在一个此类限制。\n\
  6. 点击 `Save` 按钮创建新限制并返回访问控制页面。\n7. 使用 `Proxy restrictions` 表格旁边的箭头将其移动到正确的位置。如果您的列表以\
  \ `Deny all` 条目结尾，您将需要将其移出底部才能生效。如果列表中有一个允许来自来自您网络的所有客户端的条目，而您刚刚添加了拒绝访问某些网站的限制，则您也需要将其移动到该\
  \ `Allow` 条目上方才能生效。\n8. 完成限制的创建和定位后，点击页面顶部的 `Apply Changes` 链接使其激活。\n\n创建代理限制后，您可以通过点击表格中对应行\
  \ `Action` 列中的链接来进行它。这将弹出一个与创建限制时完全相同的编辑表单，但底部有 `Save` 和 `Delete` 按钮。前者将保存您对操作或匹配\
  \ ACL 所做的任何更改，而后者将完全删除该限制。同样，在更新或删除限制后，必须使用 `Apply Changes` 链接才能使更改生效。由于某种原因删除了所有代理限制，Squid\
  \ 将允许来自所有客户端的所有请求，这可能不是一个好主意。\n\n访问控制页面上还有编辑和创建适用于 ICP 请求的限制表格。如第 44.11 节“连接到其他代理”所述，ICP\
  \ 是 Squid 集群或层次结构中的代理使用的协议，用于确定其他服务器缓存了哪些 URL。您可以以处理代理限制完全相同的方法添加和编辑 ICP 限制表中的条目。如果您运行代理集群，阻止来自您网络以外源的\
  \ ICP 请求可能是有意义的。如果没有，使用允许所有 ICP 数据包的默认设置即可。\n\n## 44.9 设置代理身份验证\n\n尽管可以配置 Squid\
  \ 仅允许来自某些 IP 地址的访问，但您可能还希望强制客户端也向代理进行身份验证。如果您只想让某些人访问网页，且由于网络使用了动态分配的地址而无法使用 IP\
  \ 地址验证，那么这就有意义。这对于跟踪谁通过代理请求了什么内容也非常方便，因为用户名会记录在 Squid 日志中。\n\n所有可以使用代理的浏览器和程序也支持代理身份验证。浏览器在第一次请求用户名和密码时会弹出一个登录窗口以输入要发送给代理的信息，并在所有后续请求中自动发送相同信息。其他程序（如\
  \ `wget` 或 `rpm`）需要在命令行中指定用户名和密码。\n\nSquid 接收到的每个登录和密码都会传递给外部身份验证程序，由该程序批准或拒绝。通常，该程序会检查一个单独的用户文件，但也可以编写自己的程序，使用各种方法验证用户。例如，它们可以在数据库、LDAP\
  \ 服务器或 UNIX 用户列表中查找。Webmin 自带一个简单的程序，可以从与 Apache 和本模块使用格式相同的文本文件中读取用户，此模块允许您编辑此类文件中的用户。\n\
  \n要为您的 Squid 代理开启身份验证，请遵循以下步骤：\n\n1. 在模块主页上，点击 `Access Control` 图标打开图 44.4 所示的表单。\n\
  2. 从 ACL 表格下菜单选择 `External Auth` 并点击 `Create new ACL` 按钮。\n3. 在出现的表单中，为 ACL  own\
  \ 输入 `auth`，并在 `External users users` 字段中选择 `All users`。然后点击 `Save` 按钮。\n4. 点击代理限制表下方的\
  \ `Add proxy restriction`。\n\n\n\n\n在 `Action` 字段中选择 `Deny`，并在 `Don't match ACLs`\
  \ 列表中选择您的新认证 ACL。这将阻止任何未经身份验证的代理请求，从而强制客户端登录。\n\n选择 `Allow` 然后在 `Match ACLs` 字段中选择\
  \ `auth`，可以实现略有不同的用途。这创建了一个代理限制，允许所有经过身份验证的客户端访问，可以通过将其设置为强制网络外部的客户端登录，而无需要求网络内部的客户端登录。\n\
  \n点击 `Save` 按钮返回访问控制页面。\n\n使用新限制旁边的向上箭头将其移动到表格中允许来自自有网络的所有访问的条目上方。如果它位于该条目下方，来自该网络的客户端将无需登录即可使用代理。当然，这在某些情况下可能是您想要的。\n\
  \n回到主页面点击 `Authentication Programs` 图标。\n\n在 `Authentication program` 字段中，选择 `Webmin\
  \ default`。这告诉模块使用模块自带的简单文本文件验证器，这样您无需编写自己的程序了。当然，您可以通过选择最后一个单选按钮并在相邻文本框中输入带有某些参数的脚本完整路径来指定自己的自定义程序。该程序必须持续读取包含用户名和密码（用空格分隔）的行作为输入，并对每个输出输出\
  \ `OK` 或 `ERR` 分别表示成功或失败。Squid 在启动时会将多个程序实例作为永久守护进程运行。\n\n在浏览器中出现的登录窗口包含了用户正在登录的代理服务器描述。默认情况下，它是\
  \ `Squid proxy-caching web server`，但您可以通过填写 `Proxy authentication realm` 字段输入您自己的内容（例如\
  \ `Example Corporation Proxy`）。\n\n通常，Squid 会缓存有效登录一小时，以避免对每个请求都调用认证程序。这意味着密码更改可能需要长一小时才能生效，这可能会引起困惑。要降低此限制（以增加系统负载和略微降低请求速度为代价），请编辑\
  \ `Time to cache passwords for` 字段。\n\n点击 `Save` 按钮，然后在主页面上点击 `Apply Changes`。\n\
  \n现在已启用认证，从网络浏览器使用您的代理的任何尝试都会导致出现登录窗口。由于尚未定义有效用户，任何登录都不会被接受，这并不特别有用！要创建一些用户进行身份验证，请遵循以下步骤：\n\
  \n点击模块主页面上的 `Proxy Authentication` 图标，将列出代理用户的表格。起初，它是空的。\n\n点击表格上方或下方的 `Add a new\
  \ proxy user` 链接显示用户创建表。\n\n在 `Username` 字段中输入登录名，并在 `Password` 字段中输入用户的密码。\n\n\
  要在不删除用户的情况下临时禁用该用户，请将 `Enabled?` 字段改为 `No`。\n\n点击 `Create` 按钮添加用户，然后点击 `Apply Changes`\
  \ 链接。在创建用户后最后一步对于更改生效是必要的，因为 Webmin 的 `Squid authentication program` 仅在首次启动时读取用户文件。\n\
  \n可以通过点击代理用户列表中的名称来编辑用户，更改用户名、密码或启用状态，并点击 `Save` 按钮。您还可以通过编辑表单上的 `Delete` 按钮完全删除用户。同样，必须点击\
  \ `Apply Changes` 才能使任何修改或删除生效。Squid 还会缓存有效密码（如上所述）以减轻认证程序的负载，因此密码更改可能需要一些时间才能生效。\n\
  \n模块的用户管理功能只有在您在 `Authentication program` 字段中选择 `Webmin default`，或者您的自定义程序将 Apache\
  \ 风格用户文件的完整路径作为参数时才会起作用。如果您的程序根据其他数据库或服务器验证用户，或者模块无法从命令行中确定哪个文件包含用户，则 `Proxy Authentication`\
  \ 图标将不会出现。\n\n有时您可能允许普通 UNIX 用户使用与 telnet 和 FTP 相同的密码登录您的程序。虽然编写一个针对 UNIX 用户数据库进行代理认证的程序是可能的，但还有另一种解决方案：配置模块每当\
  \ UNIX 用户创建、删除或重命名时，添加、删除和更新代理用户。这对于同步用户名和密码非常有用，无需向每个 UNIX 用户授予访问。一旦您按照上述说明设置了普通认证，可以按照以下步骤开启同步：\n\
  \n在模块主页面上，点击左上角的 `Module Config` 链接。\n\n顾名，`Create proxy users when creating system\
  \ users`、`Update proxy users when updating system users` 和 `Delete proxy users when\
  \ deleting system users` 字段控制当 UNIX 用户发生相同情况时对代理用户的自动创建、修改和删除。对于每一项，您都可以选择 `Yes`\
  \ 或 `No`。您可能应该开启更新和删除的同步，但保持创建关闭，这样您就可以显式控制谁可以访问代理。\n\n点击表单底部的 `Save` 按钮激活新设置。从现在起，在\
  \ Webmin 的 `Users and Groups` 模块中执行的操作也将以您选择的方式影响 Squid 用户列表。然而，在命令行中通过 `useradd`\
  \ 添加用户或通过 `passwd` 命令更改密码则不会。\n\n请查看第 4 章获取有关如何与其他模块同步以及如何开启同步的更多详细信息。\n\n### 44.10\
  \ 配置日志\n\nSquid 写入三个单独的日志文件：一个记录客户端访问请求，一个记录缓存事件，一个记录调试信息。最有用的是访问日志文件，可以通过像 `Webalizer`（第\
  \ 39 章介绍）之类的程序进行分析，以生成关于客户端、请求的 URL 和单个用户的报告。日志默认启用到编译到 Squid 中的路径，因此取决于您的操作系统，但您可以更改日志文件的目标以及访问日志格式的某些细节。\n\
  \n要配置日志如何以及写入何处，请遵循以下指令：\n\n点击模块主页面上的 `Logging` 图标，这理会将您带到日志表单。\n\n要更改客户端访问日志文件的位置，编辑\
  \ `Access log file` 字段的内容。如果选择了 `Default`，将使用编译到 Squid 中的路径（可能是 `/usr/local/squid/log/access.log`\
  \ 或 `/var/log/squid/access.log`）。\n\n要更改缓存存储日志的位置，编辑 `Storage log file` 字段。默认始终位于与\
  \ `access.log` 文件相同目录下的 `store.log`。\n\n要更改调试日志写入的路径，编辑 `Debug log file` 字段。同样，默认是位于与\
  \ `access.log` 相同目录下的 `cache.log`。\n\nSquid 通常对访问日志使用其自己的自定义格式。若要强制使用 Apache 使用的格式，请将\
  \ `Use HTTPD log format?` 字段改为 `Yes`。这种格式对于某些应用程序的处理可能是必要的，但它没有记录默认格式记录的所有信息。\n\n\
  要让 Squid 将解析后的客户端主机名写入访问日志而非是 IP 地址，请在 `Log full hostnames?` 字段中选择 `Yes`。这避免了在生成报告时以后解析它们的需求，但由于反向\
  \ DNS 查询所需的时间会减慢服务器速度。\n\n\n\n\n`ident` 或 `RFC931` 协议可用于查找从远程主机连接到你代理的 UNIX 用户名。遗憾的是，它通常在其他操作系统上被禁用且不受支持，因此其用途有限。然而，你可以通过在\
  \ `Perform RFC931 ident lookups for ACLs` 字段中选择某些 ACL，配置 Squid 将 `RFC931` 用户信息包含在它的访问日志文件中。理想情况下，你应该创建一个特殊的客户端地址\
  \ ACL，该 ACL 仅匹配网络上带有 `ident` 守护进程的 UNIX 主机，并仅选择它。\n\n如果你启用了远程用户查找，可以使用 `RFC931`\
  \ ident 超时字段来设置 Squid 等待客户端响应的最大时间。如果选择了 `Default`，服务器将在放弃前最多等待 10 秒的响应（但仍会允许请求通过）。\n\
  \n点击页面底部的 `Save` 按钮记录在此表单上做的更改，然后点击 `Apply Changes` 链接激活这些更改。\n\n许多 Squid Linux\
  \ 软件包都包含一个用于 `logrotate` 程序的配置文件，以便在日志文件过旧时对其进行轮转、压缩并最终删除。如果你使用上述说明更改了日志文件的路径，轮转将不再进行，日志将消耗无限的磁盘空间。在繁忙的系统上，这可能导致日志文件系统空间不足，而如果轮转生效，这种情况是可以避免的。\n\
  \n## 44.11 连接到其他代理\n\nSquid 不直接获取请求的网页，而是可以配置为连接到另一个代理服务器，并将部分或所有请求转发给它。如果你的组织每个部门都有一个代理，并为整个网络设置了一个主缓存，且你想让所有部门代理对于无法从自身缓存中提供的请求查询主缓存，那么此功能就非常有用。如果你的\
  \ ISP 运行着代理服务器，而你想为家庭网络设置 Squid，但仍然希望使用 ISP 的缓存，这可能也是必要的。\n\n通过使用 ACL 对请求进行分类，你可以设置\
  \ Squid 仅将某些请求转发到另一个代理，而正常方式处理其余请求。例如，你的代理可以始终处理本地局域网上的网页请求，但仍将所有其他内容转发到主代理缓存系统。\n\
  \n要设置服务器对发往特定网络或域名的请求外使用另一个代理，请遵循以下步骤：\n\n1. 在模块主页上，点击 `Access Control` 图标。\n2.\
  \ 创建一个 `Web Server Hostname` 或 `Web Server Address` ACL，匹配你的代理应该直接获取的网页服务器。例如，将\
  \ ACL 命名为 `direct`。\n3. 返回主页并点击 `Other Caches` 图标，打开一个包含其他已知代理服务器列表（如果有）的页面以及一个设置控制何时使用它们的选项的表单。\n\
  4. 点击 `Add another cache` 进入缓存主机创建表单。\n5. 在 `Hostname` 字段中，输入主缓存服务器的完全限定主机名，例如 `bigproxy.example.com`。不要只输入\
  \ `bigproxy`，因为 Squid 有时在解析非规范的 DNS 名称时会遇到困难。\n6. 从 `Type` 菜单中选择 `parent`，这告诉 Squid\
  \ 该其他代理处于比你的更高级别（因此拥有更多缓存页面）。\n7. 在 `Proxy port` 字段中，输入另一个代理监听的端口号，例如 `8080`。\n\
  8. 在 `ICP port` 字段中，输入代理用于 ICP 请求的端口，通常为 `3130`。如果你不知道或主代理不支持 ICP，也请输入 `3130`。\n\
  9. 点击页面底部的 `Save` 按钮返回其他缓存列表。\n10. 该页面底部的表单有一个名为 `ACLs to fetch directly` 的部分，这实际上是一个\
  \ ACL 表，类似于第 44.8 节“创建和编辑代理限制”中解释的代理限制表。然而，它不是允许或拒绝请求，而是决定哪些请求被直接获取，哪些请求被转发到另一个缓存。\n\
  11. 使用 `Add ACLs to fetch directly` 链接首先添加一个允许你的直接 ACL 的条目，然后添加一个拒绝所有 ACL。这告诉 Squid\
  \ 直接从本地 Web 服务器获取页面，但将所有其他请求传递给选定的代理。\n12. 最后，点击页面顶部的 `Apply Changes` 让 Squid 开始使用另一个代理服务器。\n\
  \n如果你只想让你的代理将所有请求转发到另一个代理服务器，无论其目的地如何，都可以完全跳过之前指令中的第 10 步。这之所以有效，是因为如果没有设置 ACL 来强制某些请求进行直接获取，Squid\
  \ 默认将使用配置好的另一个代理。\n\n在拥有许多客户端的大型网络中，运行 Squid 的单一系统可能无法跟上客户端请求的量。例如，一家拥有数百名运行网络浏览器的员工的公司，或一个为客户设置了代理的\
  \ ISP，可能会给单个 Squid 服务器带来巨大的负载。一种解决方案是升级到更强大的机器。另一种方案是在多个系统上安装 Squid 并在它们之间分配代理负载。\n\
  \n这通常通过为每个代理系统创建一个 DNS 地址记录来实现，所有记录都具有相同的名称（如 `proxy.example.com`），但具有不同的 IP 地址。然后当客户端查询\
  \ `proxy.example.com` 的 IP 地址时，它将获得所有地址并有效地随机选择一个进行连接。另一种替代方案是安装四层交换机，将相同的 IP 重定向到不同的目标。这种方法更昂贵（四层交换机并不便宜），但更可靠，因为可以检测并不使用掉线的服务器。如果不熟悉该术语，四层交换机是一种根据协议、端口和目标重定向网络流量的设备。对于\
  \ HTTP 请求，它可以透明地重定向到另一台服务器，而其他类型则正常路由。\n\n使用多个服务器有一个问题，每个服务器都维护自己的缓存，因此如果不同的客户端从不同的代理请求同一个网页，该网页将被下载两次！这抵消了运行代理服务器的大部分优势。\n\
  \n幸运的是，Squid 有功能可以解决这个问题。它可以配置为每个请求联系集群中的其他缓存并询问它们是否已缓存该页面。如果是，则从另一个代理检索而不是从原始 Web\
  \ 服务器。由于组织中的所有代理通常通过快速网络连接，这种方式高效得多。用于缓存间通信的协议被称为 `ICP`，仅供 Squid 使用。\n\n在模块主页上，点击\
  \ `Other Caches` 图标。要设置两个或多个代理通过 `ICP` 通信，请在每个系统中执行以下步骤：\n\n1. 点击 `Add another cache`\
  \ 打开缓存主机创建表单。\n2. 在 `Hostname` 字段中输入另一个缓存的完整主机名。\n3. 从 `Type` 菜单中选择 `sibling`，表示另一个缓存与此处于同一级别。\n\
  4. 在 `Proxy port` 字段中，输入另一个代理监听的 HTTP 端口。\n5. 在 `ICP port` 字段中，输入另一个代理用于 ICP 的端口（通常为\
  \ `3130`）。\n6. 点击 `Save` 按钮添加另一个代理并返回其他缓存列表。\n7. 为集群中的每个其他主机重复第 2 步到第 7 步。\n8. 最后，点击页面顶部的\
  \ `Apply Changes`。\n\n\n\n\n最终结果应该是集群中的每个代理都拥有所有其他代理的条目，这样它在遇到不在自身缓存中的请求时，就知道去联系它们。不过，你可以设置\
  \ `ACLs` 来避免使用 `ICP` 并强制直接获取某些请求，就像你在将请求转发到主缓存时可以做的那样。\n\n### 44.12 清除缓存\n\n有时需要移除\
  \ `Squid` 缓存中的所有文件，可能是为了释放磁盘空间或强制从原始 Web 服务器重新加载页面。\n\n可以使用 Webmin 按照以下步骤轻松完成：\n\
  \n在模块的主页上，点击 `Clear and Rebuild Cache`（清除并重建缓存）图标。浏览器将显示一个询问你是否确定的确认页面。\n\n要继续，点击\
  \ `Clear and Rebuild Cache` 按钮。由于服务器会在清理过程中停止，因此不在代理在使用期间进行。\n\n将显示一个显示 Webmin 进度的页面，它将关闭\
  \ `Squid`、删除所有缓存文件、重新初始化目录，最后重启 `Squid`。如果你有大型缓存或正在使用删除文件较慢的文件系统（例如 Solaris 上的 `UFS`），这可能需要很长时间。\n\
  \n### 44.13 设置透明代理\n\n透明代理是一种客户端在无感知的情况下连接的代理，这是由于使用了防火墙规则将端口 `80` 上的连接重定向到代理系统导致的。这种设置的优势是，你不需要手动配置所有\
  \ Web 客户端使用代理。相反，它们将在用户不知情的情况下连接到代理。这意味着用户无法通过不在不在浏览器中配置代理来绕过缓存并避免其访问控制规则。\n\n然而，透明代理也有一些缺点。无法自动捕获\
  \ `FTP` 或 `HTTPS` 连接，或者指向除 `80` 端口以外网站的连接。它还与代理验证不兼容，因为客户端无法区分代理的登录请求和网站的登录请求。即使身份验证看起来可能有效，但实际上并非如此。\n\
  \n大多数网络都有一个连接内部局域网到互联网的路由器。为了让透明代理工作，该路由器必须配置为将端口 `80` 上的出站数据包重定向到 `Squid` 代理主机和端口。在小型网络中，代理甚至可以运行在同一台路由器主机上。Linux\
  \ 自带的 `IPtables` 防火墙可以使用 `nat` 表中的特殊 `DNAT`（目标网络地址转换）规则执行这两种重定向。\n\n由于大部分工作实际上是由重定向出站数据包的防火墙规则完成的，设置一切的指令位于第\
  \ 19 章“防火墙配置”第 19.8 节“设置透明代理”。然而，这些指令是为安装了 `IPtables` 的 Linux 用户编写的。如果你的路由器运行不同的操作系统（或是专用路由器，例如\
  \ `Cisco` 制造的），则创建防火墙规则的步骤显然不适用。但是，无论你运行什么种防火墙，`Squid Proxy Server` 模块的规则都是相同的。\n\
  \n### 44.14 查看缓存管理器统计\n\n`Squid` 软件带有一个名为 `cachemgr.cgi` 的简单 CGI 程序，它可以连接到代理并请求有关内存利用率、缓存命中和缺失以及\
  \ DNS 缓存的统计信息。尽管它通常安装为从 `Apache` 等 Web 服务器运行，但你可以通过以下简单步骤从此 Webmin 模块内部访问它：\n\n\
  在主页上，点击 `Cache Manager Statistics`（缓存管理器统计）图标弹出程序的登录表单。\n\n除非你想连接到另一个代理，否则将 `Cache\
  \ Host`（缓存主机）字段留为 `localhost`。不过，大多数代理默认设置了 `ACLs`，拒绝除 `localhost` 之外任何地方访问缓存管理器。\n\
  \n在 `Cache Port`（缓存端口）字段中，输入代理监听的 TCP 端口号，例如 `8080`。\n\n`Manager` 名称和 `Password`\
  \ 字段可以留空，除非 `Squid` 配置为检索统计信息需要身份验证（这通常不需要）。\n\n点击 `Continue`（继续）按钮登录，将出现列出所有可用统计类型的页面。点击任何链接显示详细信息。\n\
  \n查看完缓存统计后，点击页面底部的 `Return to squid index`（返回 squid 索引）链接返回模块主菜单。\n\n由于 `Squid`\
  \ 默认接受来自 `localhost` 的使用特殊 `cache_object` 协议的任何未经验证的请求，任何可以通过 `telnet` 或 `SSH` 登录你系统的人都可以运行他们自己的版本的\
  \ `cachemgr.cgi` 来查看这些统计信息。尽管可用信息不是特别敏感，但你可能希望设置 `Squid` 要求提供用户名和密码才能访问。\n\n这可以通过设置外部验证，然后编辑默认的\
  \ `Allow manager localhost proxy` 限制来实现，使得新的身份验证 `ACL` 在 `Match ACL` 列中也被选中。或者更好一点，你可以创建另一个\
  \ `External Auth ACL`，其中仅列出允许查看统计信息的少数用户，并将其分配给代理限制。这样更安全，因为避免了每个拥有普通代理登录权限的 `telnet`\
  \ 或 `SSH` 用户都能访问统计信息的问题。\n\n### 44.15 分析 Squid 日志\n\n`Calamaris` 是一个简单的 `Perl` 程序，可以从你的\
  \ `Squid` 日志文件生成报告。如果你安装了它，模块主页上会出现 `Calamaris Log Analysis` 图标。如果没有，你需要单独下载并安装它，因为它没有包含在\
  \ `Squid` 中。某些 Linux 发行版有它的独立软件包包，可以使用 `Software Packages` 模块轻松安装。如果没有，可以从 `calamaris.cord.de/`\
  \ 下载程序、编译并安装。\n\n点击该图标将触发从你所有的 `Squid` 访问日志生成报告。默认情况下，只处理最后 `50000` 条目以避免给系统带来过大负载。不过，这可以在\
  \ `Module Config`（模块配置）页面上调整（如第 44.17 节“配置 Squid 服务器模块”所示）。当报告完成后，它将作为一个 HTML 页面显示在你的浏览器中。顶部是页面下方表格的链接，这些表格包含了摘要，例如按主机、按目标域名和缓存命中状态的请求。\n\
  \n即使你的系统中启用了日志轮转来定期重命名和压缩 `Squid` 日志，该模块仍会将压缩数据包含在报告中。它会查找日志目录下所有以 `access.log`\
  \ 开头的文件（例如 `access.log.02.gz`），并在必要时对其进行解压缩，然后提供给 `Calamaris`。然而，始终先处理最新的文件，这样任何强制的日志行限制都会切断旧的条目而不是新的条目。\n\
  \n`Webalizer Logfile Analysis` 模块（第 39 章介绍）也可生成更令人深刻目的报告，包含来自 squid-id 日志的图表和饼图。该模块甚至可以计划（如每天）重建报告并将其写入目录以便稍后查看。\n\
  \n### 44.16 模块访问控制\n\n赋予某人配置 `Squid` 的权利而不让他们损坏或更改系统上的其他任何内容是非常有用的。这可以在 Webmin 中通过创建一个访问该模块的\
  \ Webmin 用户，然后限制其对该模块的操作来实现。第 52 章更详细解释了这种访问控制背后的通用思想，而本节专门涵盖了限制对 `Squid` 模块的访问。\n\
  \n\n\n\n\n在限制此类用户时需要小心，因为该模块的某些功能可能被用于修改文件或以 root 权限执行命令。例如，让不可信的用户更改缓存目录并不是一个好主意，因为将\
  \ `/` 或 `/etc` 设置为缓存可能会损坏系统上的文件。不过，像 `ACL` 和代理用户编辑等功能是非常安全的，而且可能是允许子管理员使用时最有用的功能。\n\
  \n要创建一个只能配置 Squid 的用户，请按照以下步骤操作：\n\n1. 在 Webmin 用户（Users）模块中，创建一个具有该模块访问权限的用户或组。\n\
  2. 在主页列表中，点击用户名称旁边的 `Squid Proxy Server` 以调出访问控制表单。\n3. 将 `Can edit module configuration?`（可以编辑模块配置？）字段更改为\
  \ `No`（否），这样用户无法编辑命令路径或 `Squid` 配置文件。\n4. 在 `Allowed`（允许）配置页面列表中，选择用户应该可见的模块图标。不应选择\
  \ `Logging`（日志）、`Cache Options`（缓存选项）和 `Helper Programs`（辅助程序），因为这些页面包含潜在的危险选项。\n\
  5. 由于 `Squid` 可以从单独的文件读取 `ACL` 值，而此模块允许用户编辑这些 `ACL` 文件的内容，因此你应该限制创建它们的目录。要做到这一点，可以在\
  \ `Root directory for ACL files`（ACL 文件根目录）字段中输入仅属于 Webmin 目录，例如 `*/home/joe*`。将其设置为\
  \ `/` 是一个坏主意，因为这可能允许用户以 root 身份编辑系统上的任何文件。\n6. 为了防止用户关闭 `Squid`，将 `Can start and\
  \ stop Squid?`（可以启动和停止 Squid 吗？）字段更改为 `No`。但他仍然能够更改并重新配置服务器使其无法使用。\n7. 点击 `Save`（保存）按钮激活限制。\n\
  \n## 44.17 配置 Squid 代理服务器模块\n\n与大多数模块一样，此模块有几个可以编辑的设置，用于配置用户界面以及用于 `Squid` 程序和配置文件的路径。可以通过主页上的\
  \ `Module Config`（模块配置）链接访问所有设置。用户界面字段列在出现表单的 `Configurable options`（可配置选项）下，而与程序路径相关的字段则位于\
  \ `System configuration`（系统配置）下。\n\n由于模块的默认路径与你的 Linux 发行版或操作系统使用的 `Squid` 软件包路径相匹配（如果有），第二组中的字段通常不需要编辑。但是，如果你没有使用提供的\
  \ `Squid` 软件包，而是从源代码编译并安装了程序，这些路径将需要更改。\n\n模块配置字段及其含义的完整列表见表 44.2。\n\n### 表 44.2\
  \ 模块配置选项\n\n| 参数 (Arguments) | 描述 (Description) |\n| :--- | :--- |\n| 传递给 `calamaris`\
  \ 命令的参数 | 此字段设置运行 `calamaris` 程序生成报告时传递给程序的命令行参数。默认值 `aw` 通知程序包含所有可用报告并以 HTML 格式输出，但如果如果不适用，你可以通过编辑此字段更改程序的行为。在\
  \ `System Documentation`（系统文档）模块中搜索 `calamaris` 以获取可用参数的完整列表。 |\n| 传递给 `calamaris`\
  \ 的最大日志行数 | 由于频繁使用的代理的日志文件中可能有数百万行，模块默认只将最后 `50000` 行传递给 `Calamaris` 进行分析。此字段可用于编辑该数字，或在选择\
  \ `Unlimited`（无限）时强制处理整个日志文件。 |\n| 代理密码的加密方法 | 使用该模块创建和编辑代理用户时，它假设它们所在的文件每行一个用户，格式如下：```\\\
  nusername:encrypted-password.\\n```。此字段决定了所使用的密码加密方法。默认是 `crypt`，这是 UNIX 系统使用的标准格式。不过，你可以选择\
  \ `md5base64` 来切换到 MD5 加密，这用于大多数新 Linux 发行版的 `/etc/shadow` 文件中。但请注意，只有在你配置的身份验证程序也能理解\
  \ MD5 格式时它才能有效，而此模块自带的标准格式则不能。`crypt` 格式的唯一缺点是无法区分超过 8 个字符的密码，并且在理论上更容易破解。 |\n|\
  \ 排序代理用户 | 如果选择 `Yes`（是），代理认证页面上的用户列表将按用户名排序。如果选择 `No`（否），它们将按照添加顺序列出。 |\n| 在创建系统用户时创建代理用户\
  \ | 这些字段都与 `UNIX-Squid` 用户同步有关，在第 44.9 节“设置代理认证”中解释。 |\n| 在更新系统用户时更新代理用户 | 这些字段都与\
  \ `UNIX-Squid` 用户同步有关，在第 44.9 节“设置代理认证”中解释。 |\n| squid 配置文件的完整路径 | 此字段必须包含 `Squid`\
  \ 配置文件 `squid.conf` 的完整路径，例如 `*/usr/local/squid/etc/squid.conf*`。 |\n| 在删除系统用户时删除代理用户\
  \ | 这些字段都与 `UNIX-Squid` 用户同步有关，在第 44.9 节“设置代理认证”中解释。 |\n| 启动 squid 的命令 | 此字段决定了当你点击任何页面上的\
  \ `Start Squid` 链接时发生什么。如果选择 `Automatic`（自动），则将从 `Squid` 可执行配置字段中的命令并带有相应的参数运行。不过，你可以选择第二个单选按钮来指定要运行的其他脚本。在带有\
  \ `Squid` 软件包的 Linux 发行版中，默认使用类似 `/etc/init.d/squid start` 的命令。但是，如果你是从源码编译并安装服务器而不是安装软件包，此命令将不起。\
  \ |\n| 停止 squid 的命令 | 与上述字段相同，此字段决定点击 `Stop Squid` 时要运行的命令。如果选择 `Automatic`（自动），将运行来自\
  \ `Squid` 可执行字段的程序并带有关闭参数，这信号运行的服务器进程退出。 |\n| Squid 可执行文件 | 此字段必须包含 `squid` 服务器程序的完整路径，正确命名为\
  \ `squid`。 |\n| PID 文件的完整路径 | 为了让模块判断 `Squid` 是否正在运行，此字段必须包含其进程 ID 文件的完整路径（如果配置文件中未设置）。\
  \ |\n| squid 缓存目录的完整路径 | 由于默认的 `Squid` 配置文件没有指定缓存目录，此字段必须包含编译到系统中程序中的缓存路径。如果路径错误，模块的主页将一直提示需要初始化缓存。\
  \ |\n| Squid cachemgr.cgi 可执行文件 | 如果你想使用模块的统计查看功能，此字段必须包含 `Squid` 自带的 `cachemgr.cgi`\
  \ 程序的完整路径。 |\n| squid 日志目录的完整路径 | 为了让模块的日志分析功能运行，此字段必须包含包含 `Squid` `access.log`\
  \ 文件的目录完整路径，例如 `*/usr/local/squid/log*`。 |\n| calamaris 日志分析程序的路径 | 为了让 `Calamaris`\
  \ 图标出现在主页，此字段必须包含 `calamaris` 程序的完整路径。即使未安装该程序，模块的其他功能也可以正常工作。 |\n\n### 44.18 总结\n\
  \n本章解释了 HTTP 和 FTP 代理的作用，并介绍了流行的 `Squid` 代理服务器。在阅读本章后，你应该知道如何设置 `Squid` 以及如何配置它在不同端口列出、限制访问某些页面并要求客户端认证。你还应该知道如何配置服务器与集群中的其他服务器协作，以便在多个系统之间分负载。\n\
  \n## 第 45 章使用 Procmail 过滤邮件\n\n本章解释了如何使用 `Procmail` 程序和 Webmin 来过滤和投递进入系统的邮件。 |\n\
  \n\n\n\n\n# 45.1 Procmail 简介\n\nProcmail 是一个强大的程序，用于过滤和重定向通常会发送到用户信箱的电子邮件。它既可以在系统级使用，以对系统上所有用户的消息进行过滤，也可以按用户进行过滤，或者二者兼之。与普通的\
  \ Sendmail 别名不同，Procmail 可以根据邮件的头部和内容以不同的方式投递消息。这使其成为阻止垃圾邮件（如 Spam）的极佳工具。\n\n在系统上安装\
  \ Procmail 后，它会有效地替换 `Sendmail` 和其他 MTA（邮件传输代理）运行的用于消息追加到用户邮件文件的普通 `mail.local`\
  \ 投递命令。尽管它常与 `Sendmail` 使用，但其他 MTA（如 `Qmail` 和 `Postfix`）也可以配置为使用 Procmail 进行投递。对于该程序来说，只要电子邮件被正确地传递给它，实际使用的哪种邮件服务器并不重要。\n\
  \nProcmail 的主配置文件是 `/etc/procmailrc`，通常由系统管理员管理。个人用户也可以在自己的主目录下创建格式相同的 `.procmailrc`\
  \ 文件。系统级文件总是会被读取和处理，因此其中包含的任何根据内容重定向消息的规则无法被个人用户覆盖。\n\nProcmail 配置文件由“动作”（actions）组成，每个动作都包含一系列条件和一个投递模式。条件决定了哪些消息匹配该动作，而投递模式则控制对这些匹配成功的消息要执行什么操作。Procmail\
  \ 会按顺序处理动作，直到找到一个匹配的动作，按照指定方式投递消息，然后停止处理。\n\n配置文件还可以包含变量赋值，这些变量可能被后续的动作甚至其他变量使用。它还可以包含特殊的条件段，即只有在满足某些条件时才运行的动作列表。在某种意义上说，这些类似于编程语言中的\
  \ `if-then` 语句。\n\nProcmail 在所有类 Unix 操作系统上的行为几乎完全相同。唯一的区别是默认的投递位置：所有 Linux 发行版都使用\
  \ `/var/spool/mail` 作为用户邮件目录，而其他 Unix 变体（如 Solaris）则使用 `/var/mail`。然而，这种差异对程序的配置格式或\
  \ Procmail 邮件过滤器模块的用户界面没有影响。\n\nProcmail 在由个人用户配置以执行某些任务时最有用，例如将来自不同人的邮件分类到不同的信箱、写入两个不同的邮件文件或丢弃特定地址的邮件。然而，Procmail\
  \ Webmin 模块和本章仅处理系统级配置。如果你想要一个让个人用户通过 Web 界面配置程序的工具，Usermin（在第 47 章中介绍）是你要使用的程序。它有一个具有相同界面的模块，管理\
  \ `.procmailrc` 文件而不是 `/etc/procmailrc`。\n\n全局 Procmail 配置可将邮件投递到不同的目录，或者使用与你的邮件服务器通常使用的不同的格式。例如，与其将用户的邮件追加到\
  \ `/var/spool/mail` 中的文件，不如将其写入到用户主目录下的 mbox 文件中。更好情况下，可以将 Procmail 设置为写入 Qmail\
  \ 风格的邮件目录，通常称为 `Maildir`，并位于用户的主目录下。\n\n由于 Procmail 只处理在你的系统上本地投递的电子邮件，如果你使用 `Mozilla`\
  \ 或 `Evolution` 等客户端程序从 ISP 或公司服务器下载邮件，则无法使用 Procmail 进行邮件过滤。如果你没有运行自己的邮件服务器，但仍想使用\
  \ Procmail 的功能，则你需要设置 `Fetchmail`（在第 33 章中介绍）来下载消息并将其传递给你系统上的 MTA。\n\n# 45.2 Procmail\
  \ 邮件过滤器模块\n\n用于管理系统级配置文件的 Webmin 模块称为 Procmail Mail Filter，可以在“服务器”（Servers）类别下找到。点击其图标将带你进入如图\
  \ 45.1 所示的主页。所有现有动作都列在其中，下方是添加各种类型新动作的链接。\n\n##### 图 45.1. Procmail 模块主页。\n\n![](img/45fig01.jpg)\n\
  \n与其他模块不同，如果系统上没有安装 Procmail，此模块不会报错。你应该使用“软件包”（Software Packages）模块（在第 12 章中介绍）来检查并安装随你的\
  \ Linux 发行版或操作系统自带的包。如果不存在该包，你需要从 [www.procmail.org](http://www.procmail.org/default.htm)\
  \ 下载源码、编译并安装。\n\n然而，仅仅安装 Procmail 并不足以在你的系统上实际使用它。默认情况下，`Sendmail`、`Qmail` 和 `Postfix`\
  \ 等邮件服务器使用它们自己的标准邮件投递程序，而不是 Procmail。个人用户可以通过创建一个包含行 `|/usr/bin/procmail` 的 `.forward`\
  \ 或 `.qmail` 文件来更改此，这将所有入站邮件传递给 Procmail 程序。然而，更好的做法是全局重新配置你的 MTA 以使用 Procmail，这样个人用户就不需要自己设置了。第\
  \ 45.3 节“设置 Sendmail”解释了如何配置 `Sendmail`。其他邮件服务器需要不同的设置。\n\n# 45.3 设置 Sendmail\n\n\
  只要你拥有用于构建主 Sendmail 配置文件的 M4 文件，设置 Sendmail 使用 Procmail 就非常简单。遗憾的是，直接通过编辑 `sendmail.cf`\
  \ 来配置邮件服务器并不简单，本章也未涉及。然而，所有现代 Linux 发行版都已经在 `sendmail` 包或单独包（如 `sendmail-cf`）中包含了你需要的\
  \ M4 文件。\n\n要配置 Sendmail MTA 使用 Procmail，请遵循以下步骤：\n\n1.  进入 Sendmail 配置模块，该模块可以在\
  \ Webmin 的“服务器”（Servers）类别下下找到。\n2.  点击主页上的 Sendmail M4 配置图标。将列出所有现有的 M4 指令。如果没有，则重新配置\
  \ Sendmail 所需的 M4 文件可能没有安装在你的系统中。\n3.  检查是否存在 `FEATURE(local_procmail)` 行。如果存在，则已启用使用\
  \ Procmail 投递，无需执行后续步骤。\n4.  从“添加类型类型的新条目”（Add new entry of type）按钮旁边的菜单中，选择“功能”（Feature），然后点击按钮显示功能创建表。\n\
  5.  从“功能”菜单中选择 `local_procmail`。保持“参数”（Parameters）字段为空。\n6.  点击“创建”（Create）按钮，将新功能添加到\
  \ M4 文件中。你的浏览器将返回现有指令列表，在列表底部将是新的 `FEATURE(local_procmail)` 行。\n7.  点击新行旁边的向上箭头，根据需要多次点击将其移动到\
  \ `MAILER(local)` 行上方。这是必要的，因为文件是按顺序处理的，而新指令更改了 `MAILER` 行的行为。\n8.  当新的 `FEATURE`\
  \ 行到位后，点击页面底部的“重构 Sendmail 配置”（Rebuild Sendmail Configuration）按钮。将显示一个确认页面，显示对主\
  \ Sendmail 配置文件将做出的更改。只要你没有直接修改 `sendmail.cf`，这些更改将仅与新的 Procmail 支持有关。\n9.  点击“是”（Yes），现在替换，以保存并激活新配置。从现在起，所有由\
  \ Sendmail 投递给本地用户的邮件都将由 Procmail 处理。要检查一切是否正常，请尝试发送几条测试消息并确保它们正常投递。\n\n有关 Sendmail\
  \ 模块的 M4 功能如何工作以及在哪里查找文件的更多信息，请参阅第 37.11 节“使用 M4 添加 Sendmail 功能”。\n\n### 45.4 创建和编辑动作\n\
  \n\n\n\n\n正如本章引言介绍的，`Procmail` 由一系列动作（actions）组成。当邮件到达时，会按顺序检查每个动作，直到找到匹配项并执行其投递模式。如果没有动作匹配（或不存在任何动作），邮件将投递到默认目的地，该位置通常是\
  \ `/var/spool/mail` 下的用户邮件文件。\n\n要创建一个新动作，请遵循以下步骤：\n\n点击模块主页现有动作列表下“添加新过滤动作”（Add\
  \ a new filter action）链接。将显示图 45.2 所示的表单，用于输入目的地和条件。\n\n##### 图 45.2. Procmail 动作创建表。\n\
  \n![](img/45fig02.jpg)\n\n从“交付模式”（Delivery mode）菜单中选择匹配此动作的消息目的地类型。可用选项有：\n\n- **追加到文件\
  \ (Append to file)**：邮件将以标准邮箱格式追加到相邻文本框中输入的文件，例如 `*/var/spool/mail/fred*`。若要丢弃邮件，请在文件处输入\
  \ `/dev/null`。\n- **写入 maildir (Write to maildir)**：匹配的邮件将添加到在文本框中输入路径的 `Qmail`-风格邮件目录中。如果该目录尚，`Procmail`\
  \ 将为用户创建它（以及所需的子目录）。\n- **写入 MH 文件夹 (Write to MH folder)**：邮件将添加到指定的 `MH`-风格邮件目录中。这种邮件格式同样每条邮件使用一个文件，但将它们放在同一个目录中，并赋予邮件文件递增的数字文件名，如\
  \ `1`、`2`、`3` 等。\n- **转发到地址 (Forward to address)**：邮件将被发送到相邻文本框中输入的地址或用户，例如 `foo@example.com`。\n\
  - **馈送到程序 (Feed to program)**：匹配的邮件将作为输入馈送至菜单旁文本框中输入路径和参数的程序。\n\n如果输入了非绝对的邮件文件名或目录（如\
  \ `Mailbox` 或 `Maildir`），`Procmail` 将认为它是相对于邮件投递用户的家目录。\n\n要让 `Procmail` 检查接收邮件的正文而非仅检查头部，请勾选“将条件应用于正文”（Apply\
  \ conditions to body）复选框。如果你后续输入的任何条件需要匹配邮件本身的文本，则此是必要的。\n\n通常情况下，`Procmail` 在检查条件时会忽略头部的大小写。要更改此设置，请勾选“大小写敏感匹配”（Case-sensitive\
  \ matching）复选框。\n\n如果你希望即使此动作匹配，`Procmail` 也继续处理配置文件，请勾选“即使条件匹配也继续处理”（Continue processing\
  \ even if conditions match）复选框。可以通过对最后一个投递规则之外的所有规则开启此选项，从而将邮件投递到多个不同的文件或文件夹。\n\n\
  `Procmail` 通常会忽略馈送邮件程序的退出状态。若希望在程序失败时让其失败（从而退回邮件），请开启“等待动作程序完成”（Wait for action\
  \ program to finish），并勾选 `result` 选项。\n\n如果你输入的投递程序在读取邮件并进行某些修改后输出邮件，请勾选“动作程序是过滤器”（Action\
  \ program is a filter）复选框。此时也应启用“即使条件匹配也继续处理”选项，以便对修改后的邮件版本继续处理。如果你编写了一个程序通过添加或更改头部来检查并标记邮件，那么此功能将非常有用，因为后续动作可以检查这些标记。\n\
  \n表单的“动作条件”（Action conditions）部分用于输入决定哪些邮件将由此动作投递的条件。如果没有指定，到达动作的消息将始终投递；如果输入了多个，则必须全部匹配才能进行投递。\n\
  \n此部分实际上是一个表格，从两个空行开始。每行的菜单决定条件的类型以及旁边框中框内容的解释方式。\n\n可用选项有：\n\n- **匹配正则表达式 (Matches\
  \ regular expression)**：要使此条件匹配，邮件头部（可能也包括正文）必须匹配文本框中输入的 Perl 风格正则表达式。记住，此表达式应用于所有头部，就像它们是一个单一文本块，因此你应该在任何头部名称前加上\
  \ `^` 以指示行首。例如，为了捕获主题包含单词 `foo` 的邮件，你可以输入 `^Subject:.*foo`。\n- **不匹配正则表达式 (Doesn't\
  \ match regular expression)**：此类型的工作原理与上一个相同，只是匹配不符合正则表达式的消息。\n- **评估命令输出 (Evaluate\
  \ output of command)**：将运行文本框中输入的 Shell 命令，由 `Procmail` 读取其输出，然后重新解释为配置文件中的动作行。这种类型的条件非常强大，因为它允许创建动态生成的条件，但对于日常邮件过滤，你可能不需要使用它。\n\
  - **检查命令退出状态 (Check exit status of command)**：如果输入的 Shell 命令退出状态为零（表示成功），则此类型条件匹配。它可以根据系统主机名、一天中的时间或某些文件是否存在将邮件投递到不同的目的地。\n\
  - **邮件小于 (Mail is smaller than)**：如果消息的总大小小于相邻文本框中输入的字节数，则该条件将匹配。\n- **邮件大于 (Mail\
  \ is bigger than)**：如其名所示，这种类型的条件是前一个选项的相反数。\n\n当你完成条件输入后，点击 `Save`（保存）按钮。新动作将添加到主页的列表中，并开始用于传入的邮件。若要添加两个以上的条件，你需要重新编辑该动作，以便在“动作条件”部分出现两个空行。\n\
  \n可以通过点击模块主页上“要执行的动作”（Action to take）列中的条目来编辑现有动作，这将显示与图 45.2 相似的编辑表单。在这里，你可以进行更改并点击\
  \ `Save` 激活它们，或直接点击 `Delete` 删除该动作。\n\n由于动作的顺序至关重要，模块允许通过主页上每个动作旁箭头更改它们在 `Procmail`\
  \ 配置中的位置。变量赋值、条件块和包含文件也可以以此方式移动。\n\n通过遵循上述说明，你可以轻松创建一个动作，将所有邮件投递到用户家下的 `Qmail`-风格\
  \ `Maildir` 目录。尽管这种邮件格式相比 `/var/spool/mail` 下传统文件具有更高的可靠性，但如果邮件客户端或系统上的 POP3 服务器不知道如何读取它，它将毫无用。大多数操作系统自带的\
  \ POP3 服务器期望在 `/var/spool/mail` 下查找邮件，因此对于任何新的邮件格式或位置，必须替换或重新配置它。其他直接读取用户邮件文件的客户端（如\
  \ `Pine`、`Elm` 和 `Usermin`）可以配置为你选择的任何新位置。\n\n### 45.5 创建和编辑变量赋值\n\nProcmail 动作可以在条件和投递目的地可以使用\
  \ Shell 风格变量。例如，你可以创建一个投递到文件 `*/mail/$LOGNAME*` 的动作，其中 `$LOGNAME` 是投递用户的用户名。若干变量（如\
  \ `.LOGNAME` 和 `DEFAULT`）由 `Procmail` 自动设置，而其他变量可以在文件中设置供以后使用。你甚至可以覆盖自动变量来更改程序的行为，例如默认投递目的地或执行命令时所使用的\
  \ Shell。\n\n\n\n\n在“变量名”（Variable name）字段中，输入要设置的变量名称，例如 `DEFAULT`。所有自动变量都使用大写名称，您自己创建的变量也应该是大写的。不允许包含空格或非字母数字字符。\n\
  \n在“值”（Value）字段中，输入要分配给此变量的值，例如 `Maildir/`。该值可以包含对其他变量的引用。\n\n点击`Create`（创建）按钮将变量添加到主页的列表中。\n\
  \n使用列表中新变量旁边的向上箭头将其移动到正确的位置，这通常位于文件的顶部。变量赋值只会影响其后的操作和赋值，因此在底部添加的变量可能不会产生任何影响。\n\n\
  与操作（actions）一样，可以通过点击列表中的变量名称来编辑或删除变量。还可以通过其旁边的向上和向下箭头移动变量。由于变量只影响文件中其下方的操作和其他赋值，您肯定会想将任何新变量移动到列表顶部附近。如果放在底部添加并留在那里，将不会产生任何影响（对默认投递目的地除外）。\n\
  \nProcmail 定义并允许您更改几个特殊变量。表 45.1 列出了其中最有趣的几个名称和含义。\n\n#### 表 45.1. Procmail 为操作设置的变量\n\
  \n| 变量名 | 目的 |\n| --- | --- |\n| DEFAULT | 不匹配任何操作的邮件将投递到的目的地。更改此变量将修改默认目的地，这是将邮件投递到用户主目录下的邮件目录或文件的最佳方法。要指定目录，请在路径末尾加上斜杠\
  \ `/`，例如 `Maildir/`。与操作中的目的地一样，非绝对路径被认为是相对于收件者主目录的。 |\n| HOME | 投递邮件的用户的主目录。 |\n\
  | SHELL | 收件者的 UNIX shell。有时有必要为命令设置此项。 |\n| LOGNAME | 接收邮件的 UNIX 用户名。 |\n| ORMAIL\
  \ | 默认投递目的地，例如 `/var/spool/mail/$LOGNAME`。然而，更改此变量会影响没有使用 `sendmail` 的行为。 |\n| SENDMAIL\
  \ | Procmail 转发邮件到另一个地址的命令。 |\n| SENDMAILFLAGS | 传递给 `sendmail` 的命令行参数。 |\n| HOST\
  \ | 系统的主机名，由 `hostname` 命令得出。 |\n\nProcmail 定义并允许您更改几个特殊变量。表 45.1 列出了其中最有趣的几个名称和含义。\n\
  \n#### 45.6 条件块（Conditional Blocks）\n\n条件块是一组，只有在满足某些条件下才执行的操作。与操作一样，您可以通过点击列表中的变量名称来编辑或删除变量。还可以通过其旁边的向上和向下箭头移动变量。由于它们只影响文件中其下方的操作和其他赋值，您肯定会想将任何新变量移动到列表顶部附近。如果放在底部添加并留在那里，将不会产生任何影响（对默认投递目的地除外）。\n\
  \nProcmail 允许您通过包含文件来创建复杂的操作集。如果启用了显示文件的选项，Procmail 就会显示其实际内容。\n\n要创建条件块，请遵循以下步骤：\n\
  \n1. 在列表中点击 `Add new conditional block`（添加新条件块）。\n2. 在“要执行的代码”（code to execute）文本框中，输入包含操作的文件路径。一旦匹配到条件，Procmail\
  \ 就会停止处理。如果没有匹配，它将继续处理。\n3. 点击 `Create` 按钮完成操作。\n\n通常情况下，通过点击列表中的变量名称可以编辑或删除条件块。还可以通过其旁边的向上和向下箭头移动它们。\n\
  \n包含文件是一个特殊的指令，告诉 Procmail 读取并处理其包含的操作，而不是变量赋值。\n\n要设置包含文件，请遵循以下步骤：\n\n1. 在列表中点击\
  \ `Add new include file`（添加新包含文件）。\n2. 在“包含文件”（Included file）字段中，输入该文件的完整路径。您也可以输入相对路径，在这种情况下\
  \ Procmail 将搜索用户的主目录。一旦发现匹配，Procmail 就会停止处理。\n3. 点击 `Create` 按钮完成。\n\n如果启用了“显示包含文件的内容”（Show\
  \ contents of include files）设置，Procmail 就会显示其实际内容。如果包含文件非常大（例如用于垃圾邮件过滤），这会导致模块主页面变得不可用。\n\
  \n#### 45.7 使用 SpamAssassin 过滤垃圾邮件（Filtering Spam with SpamAssassin）\n\nSpamAssassin\
  \ 是一个强大的程序，根据邮件头和内容检测垃圾邮件。它使用一组内置规则来判断邮件是否为垃圾邮件，还可以查询其他垃圾邮件数据库和邮件服务器。`spamassin`\
  \ 程序本身并不执行真正的过滤。相反，它只是接收邮件输入，添加指示邮件是否为垃圾邮件的特殊头，然后再次输出。这使其非常适合在 Procmail 操作中使用。\n\
  \n假设您的系统中安装了 SpamAssassin，可以按照以下步骤为所有用户设置过滤：\n\n1. 创建一个新的操作，将邮件投递给程序 `/usr/bin/spamassin`（或其在系统上的位置）。确保勾选\
  \ `Wait for action program to finish`（等待操作程序完成）、`check result`（检查结果）和 `Action program\
  \ is a filter`（操作程序是过滤器）框。\n2. 添加第二个操作，条件为匹配正则表达式 `^X-Spam-Status: Yes`。这个特殊头是 SpamAssassin\
  \ 对超过其垃圾阈值的邮件设置的。投递模式可以是追加到文件 `/dev/null` 以丢弃所有垃圾邮件，也可以追加到类似 `$HOME/spam` 的位置，将其放在不同的邮件文件中用户浏览并删除。\n\
  \n由于 SpamAssassin 偶尔会将非垃圾邮件误判为垃圾邮件，因此通过将其发送到 `/dev/null` 来丢弃邮件并不是好主意。更好的办法是将邮件投递到用户需要时可以阅读的单独文件或目录，以防万一。\n\
  \n默认情况下，被识别为垃圾邮件的邮件会被 SpamAssassin 修改头和正文，以禁用任何附件并包含关于其为何分类的报告。可以通过编辑全局配置文件 `/etc/mail/spamassassin/local.cf`\
  \ 来更改，该文件的具体格式在本章中未介绍。\n\n#### 45.8 配置 Procmail 邮件过滤模块\n\n\n\n\n\n此模块有几个选项，用于控制其用户界面以及\
  \ Procmail 配置文件的路径。一如既往，可以通过点击主页面左上角的“Module Config”（模块配置）链接进行编辑。表 45.2 列出了可编辑的设置。\n\
  \n### 表 45.2 模块配置选项\n\n显示包含文件的内容？（如果 filemanes 中没有使用变量）\n\n如第 45.6 节“条件块和包含文件”所解释，此字段决定了是否在主页上显示包含文件的操作以供编辑。它默认设置为\
  \ `No`（否），因为大多数包含文件都非常大且复杂。\n\n系统 procmailrc 文件的路径\n\n此字段必须包含全局 Procmail 配置文件的完整路径，通常为\
  \ `/etc/procmailrc`。\n\n### 45.9 总结\n\n本章解释了如何使用 `Procmail` 根据邮件内容执行各种操作，从而对系统邮件服务器接收的所有邮件进行过滤。阅读后，你应该知道如何创建过滤操作，并理解它们在\
  \ `Procmail` 配置中是如何交互的。你还应该知道如何设置 `SpamAssassin` 软件包，以阻止或重定向它分类为垃圾邮件的邮件。\n\n## 第\
  \ 46 章 创建 SSL 隧道\n\n在本章中介绍了 `STunnel` 程序以及用于设置它的 Webmin 模块。\n\n#### 46.1 SSL 和 STunnel\
  \ 简介\n\n`SSL` 是一种用于在 `TCP` 连接中通过网络传输时加密数据的协议。它最初开发用于保护网络浏览器和服务器之间的流量，但也用于加密任何通常通过\
  \ `TCP` 协议发送的数据流。\n\n`SSL` 协议允许客户端和服务器相互进行身份验证，以便客户端能够确定它确实连接到了它认为的主机。这是通过由客户端认可的证书机构颁发（以便进行验证）并与特定主机名关联的证书来实现的。如果没有证书，攻击者可以将\
  \ `SSL` 连接重定向到自己的服务器，并从认为正在与真实服务器通信的客户端处获取敏感信息。\n\n任何在互联网上未加密传输的数据都可以被访问其所通过的网络之一的攻击者捕获并读取。即使是\
  \ `LAN` 上客户端和服务器系统之间传输的数据也可以被轻易监听。当你连接到 `telnet`、`FTP` 或 `POP3` 服务器时，你的密码会通过网络发送并可能被攻击者捕获。\n\
  \n`SSL` 可用于在这种情况下保护数据，但仅当客户端和服务器都支持它时才。大多数浏览器和邮件客户端可以建立 `SSL` 加密的 `HTTP`、`POP3`\
  \ 和 `IMAP` 连接，但并不是所有 Web 和 `POP3` 服务器都能接受这些连接。`POP3` 特别难以保护，因为大多数 `UNIX` 系统附带的标准服务器完全不支持\
  \ `SSL`。幸运的是，有一个解决方案 `STunnel`。\n\n`STunnel` 是一个将未加密连接转换为 `SSL` 加密连接的简单程序。它通常被设置为从像\
  \ `inetd` 或 `xinetd` 这样的超级服务器运行，然后运行不支持 `SSL` 的其他程序（如 `POP3` 服务器）。这种设计允许它保护任何通常从\
  \ `inetd` 运行的服务器，例如 `telnet`、`NNTP` 和 `IMAP` 服务器。\n\n然而，并不是所有服务器都能通过加密有效保护，因为没有客户端可以在\
  \ `SSL` 模式下使用它们。例如，我从未听说过有可以使用 `SSL` 的 `telnet` 或 `FTP` 客户端，因为常用的 `SSH` 软件包已经允许加密的远程登录和文件传输。\n\
  \n#### 46.2 SSL 隧道模块\n\n此 Webmin 模块可以轻松设置运行 `STunnel` 以启动特定服务器程序的超级服务器服务。虽然可以使用\
  \ `Internet Services` 模块（第 15 章介绍）手动完成，但此模块是专门为设置和配置 `STunnel` 设计的。它会自动检测你是否安装了\
  \ `inetd` 和/或 `xinetd`，读取它们的配置以检查现有的 `SSL` 隧道，并在你创建新隧道时向其添加。如果两者都已安装，新的 `SSL` 隧道将添加到\
  \ `xinetd` 配置中，因为它是两者中更优的。\n\n可以在 Webmin 主菜单的 `Networking`（网络）类别下找到该模块。当你点击它的图标时，将显示如图\
  \ 46.1 所示的页面，列出所有现有隧道。页面底部有一个标记为 `Apply Changes`应用更改）的按钮，点击后将重启 `inetd` 或 `xinetd`，从而使当前配置生效。\n\
  \n##### 图 46.1 SSL 隧道模块。\n\n![](img/46fig01.jpg)\n\n如果在你的服务器上没有找到该程序，将显示类似 `The\
  \ STunnel command `/usr/bin/stunnel` was not found on your system` 的错误信息。这可能表明它未安装，或者模块正在错误的目录下查找\
  \ `stunnel` 命令。在后一种情况下，你可以调整模块的配置，如第 46.4 节“配置 SSL 隧道模块”中解释的那样。\n\n如果程序确实没有安装，请检查你的操作系统光盘或网站，查看是否存在\
  \ `STunnel` 软件包。如果是，你可以使用第 12 章介绍的 `Software Packages` 模块进行安装。否则，你需要从 [www.stunnel.org](http://www.stunnel.org/default.htm)\
  \ 下载源码，进行编译并安装它。\n\n#### 46.3 创建和编辑 SSL 隧道\n\n如果你想用 `SSL` 加密保护特定服务，将需要创建一个新的 `SSL`\
  \ 隧道。可以创建两种类型的隧道：一种是像 `inetd` 那样运行服务器进程，另一种是连接到非 `SSL` 模式下的另一个主机和端口。如果你已经以非加密模式运行服务器，则后者更简单，但由于需要建立额外的网络连接，速度会稍慢。\n\
  \n在创建隧道之前，你必须为它决定一个端口号。对于某些协议，有一个标准的端口号。例如，`995` 通常用于加密的 `POP3`，`993` 用于加密的 `IMAP`。当然，你选择的端口号不能被系统上的任何其他\
  \ `inetd` 服务或服务器占用。\n\n以下步骤将指导如何创建隧道：\n\n在模块的主页上，点击现有隧道列表上方或方的 `Add a new SSL tunnel`添加新的\
  \ SSL 隧道）链接。浏览器中将显示图 46.2 所示的创建表。\n\n##### 图 46.2 SSL 隧道创建表。\n\n![](img/46fig02.jpg)\n\
  \n在 `Service name`字段中，为该隧道的 `inetd` 服务输入一个唯一名称，例如 `ssl-pop3`。\n\n在 `TCP port`字段中，输入隧道应接受连接的端口号，例如\
  \ `993`。\n\n除非你想临时禁用隧道，否则将 `Active?` 字段设置为 `Yes`。\n\n如果此隧道应该运行像 `POP3` 服务器那样的程序，选择\
  \ `Run inetd style program`选项。在`Path to program`字段中，输入程序的完整路径，例如 `/usr/sbin/ipop3d`。在`with\
  \ arguments`字段中，输入程序名称以及任何命令行参数，例如 `ipop3d a`。与在 `Internet Services and Protocols`\
  \ 模块中创建的服务一样，必须包含程序名称作为第一个参数。\n\n如果此隧道应该连接到某些现有服务器，你还可以选择 `Connect to remote host`选项。分别在`Remote\
  \ hostname`和`Remote port`字段中输入要连接的主机（如 `localhost`）和要使用的端口号（如 `110`）。\n\n\n\n\n\n\
  `SSL certificate and key file` 字段决定了在此连接中将向客户端呈现哪个 SSL 证书。如果你使用 `openssl` 命令生成了自己的自签名证书或真实证书，请选择\
  \ `Use cert in file` 选项并在相邻的文本框中输入文件的完整路径。否则，你可以选择 `Use Webmin's cert` 来使用 Webmin\
  \ 在 SSL 模式下使用的相同证书，或者选择 `Compiled-in default` 使用使用 `STunnel` 软件自带的证书。如果你确实生成了了自己的证书，请确保该文件包含\
  \ PEM 格式的私钥和证书。\n\n在连接到远程主机时，`STunnel` 可以配置为执行与正常相反的行为。与其接受 SSL 连接并对其解密，你反而可以选择让它接受普通连接并进行加密，以便连接到另一个支持\
  \ SSL 的服务器。通过在 `Tunnel mode` 字段中选择 `Accept normal and connect with SSL` 可以启用此模式。如果你的客户端或服务器程序都不支持\
  \ SSL，但你仍然希望它们之间的数据被加密，这种模式将非常有用。在这种模式下，可以在客户端系统上设置 `STunnel`，并配置为连接到服务器系统中使用 `Accept\
  \ SSL and connect normally` 模式的另一个 `STunnel` 服务。\n\n点击页面底部的 `Create` 按钮以添加新服务。\n\
  \n返回模块主页后，点击 `Apply Changes` 使新隧道生效。\n\n可以通过点击模块主页列表中现有隧道的名称来编辑隧道的所有详细信息。这将弹出一个与图\
  \ 46.2 相似的编辑表单，但所有字段都已填充好。你可以进行更改并点击 `Save` 按钮以记录这些更改，或者点击 `Delete` 完全删除隧道。无论哪种方式，都必须点击主页上的\
  \ `Apply Changes` 按钮才能使更改生效。\n\n### 46.4 配置 SSL 隧道（Configuring the SSL Tunnels Module）\n\
  \n与其他模块一样，该模块也有几个选项用于控制它在哪里查找 `STunnel` 程序和证书文件。你可以通过点击主页左上角的 `Module Config` 链接来编辑它们，这会将带你进入一个带有表\
  \ 46.1 所示字段的表单。\n\n##### 表 46.1 模块配置选项\n\n| Path to stunnel executable | 此字段必须包含\
  \ `stunnel` 程序的完整路径。如果路径错误，模块主页上将出现第 46.2 节“SSL Tunnels Module”中提到的错误。 |\n| Path\
  \ to default stunnel PEM file | 如果为此字段输入了路径，则在创建新隧道时将其作为 `SSL certificate and key\
  \ file` 字段的默认证书文件。如果选择 `None`，则默认选中 `Use Webmin's cert` 选项。 |\n\n### 46.5 总结（Summary）\n\
  \n本章介绍了 SSL 协议并解释了它的用途。它还展示了如何通过 Webmin 配置 `STunnel` 程序，为现有协议（如 `POP3` 或 `IMAP`）添加\
  \ SSL 加密。\n\n## 第 47 章 Usermin 配置（Usermin Configuration）\n\n本章解释了 `Usermin` 是什么、为什么你可能想要使用它，以及如何在\
  \ Webmin 内部对其进行配置。它还对可选 `Usermin` 模块进行了简要说明。\n\n### 47.1 Usermin 简介（Introduction\
  \ to Usermin）\n\n`Usermin` 是类似于 `Webmin` 的 Web 界面，但为普通 UNIX 用户设计，用于执行他们通常需要在 shell\
  \ 提示符下完成的任务。它由 `Webmin` 的同一作者编写，共享许多代码，并具有类似的底层设计和用户界面。`Webmin` 允许你执行通常以 root 身份登录的操作，而\
  \ `Usermin` 让你执行以普通用户登录可以完成的操作。\n\n如果你想让系统上的用户能够通过易于使用的 Web 界面读取和发送电子邮件、更改密码或编辑文件，那么安装\
  \ `Usermin` 是一个非常有用的程序。它将所有功能组合在一起，允许管理员选择哪些用户可以访问特定功能。\n\n可以从 [www.usermin.com](http://www.usermin.com/default.htm)\
  \ 下载适用于大多数 Linux 发行版的 `RPM` 格式，或其他操作系统的 `tar.gz` 格式。它支持与 `Webmin` 相同的操作系统，安装方式完全相同。如果你的\
  \ Linux 版本使用 `RPM` 包格式，可以使用 `Software Packages` 模块（在第 12 章介绍）来安装 `Usermin`。否则，你需要解压\
  \ `Usermin tar.gz` 文件并运行 `setup.sh` 脚本，就像处理 `Webmin` 一样。\n\n由于 `Usermin` 使用端口 `20000`\
  \ 而不是 `10000`，安装后需要在浏览器中访问 URL `http://yourservername:20000/` 来访问它。在出现的登录页面上输入系统中任何\
  \ UNIX 用户的用户名和密码，然后点击 `Login` 按钮。将显示一个与 `Webmin` 非常相似的主菜单，但具有不同的类别和模块。在默认配置下，`Usermin`\
  \ 应该适合处理读取邮件、更改密码或通过 `SSH` 登录等任务。\n\n`Usermin` 的导航方式与 `Webmin` 相同，其模块的设计也非常相似。事实上，某些模块与\
  \ `Webmin` 中的模块完全相同，例如 `Running Processes` 和 `SSH/Telnet Login`。唯一的区别是它们是以登录 UNIX\
  \ 用户的权限运行，而不是 root 权限。\n\n本章主要侧重于如何在 Webmin 内部使用 `Usermin Configuration` 模块对程序进行配置。`Usermin`\
  \ 本身没有用于自配置的功能。你必须使用此模块，或者直接编辑 `/etc/usermin` 中的配置文件。不说说，前者要简单得多。本章的说明是针对 `Usermin\
  \ 1.030` 编写的。一些旧版本缺少某些功能，例如限制特定用户和组访问模块的功能。\n\n此外，第 47.17 节“About the Usermin Modules”中包含了标准模块的完整列表以及每个模块功能的简要描述。然而，这不是\
  \ `Usermin` 的用户指南。该程序非常易用，并不真正需要说明书。\n\n### 47.2 Usermin 配置模块（The Usermin Configuration\
  \ Module）\n\n如果你想以任何方式重新配置 `Usermin`，例如更改默认主题、监听端口或允许连接的客户端地址，应使用此模块。你可以在主菜单的 `Webmin`\
  \ 类别下找到它，点击图标后出现的主页如图 47.1 所示。如你所见，页面实际上是一个图标表格，点击每个图标都可以显示一类选项的编辑表单。底部有启动或停止 `Usermin`\
  \ 服务进程的按钮，可能还用于将其设置为在开机时启动。\n\n##### 图 47.1. Usermin 配置模块（The Usermin Configuration\
  \ module）。\n\n![](img/47fig01.jpg)\n\n像 Webmin 模块通常一样，如果没有安装 `Usermin`，主页上将出现类似\
  \ `The directory /etc/usermin either does not exist on your system` 的错误信息。尽管 `Usermin`\
  \ 与 `Webmin` 相似，但必须按照本章引言中的说明单独安装。如果你选择了与默认 `/etc/usermin` 不同的配置目录，也可能发生此错误。如果是如此，请阅读第\
  \ 47.18 节“Configuring the Usermin Configuration Module”以了解如何更改模块查找正确的位置。\n\n###\
  \ 47.3 启动和停止 Usermin（Starting and Stopping Usermin）\n\n\n\n\nUsermin 有它自己持久运行的 Web\
  \ 服务器进程，可以使用此模块进行启动或停止。在主页底部，有一个`Stop Usermin`（停止 Usermin）或 `Start Usermin`（启动 Usermin）的按钮，取决于它当前是否运行。你也可以通过\
  \ root 用户在命令行运行 `/etc/usermin/stop` 或 `/etc/usermin/start` 来停止和启动服务器。\n\n在 Linux、Solaris\
  \ 和 HP/UX 等使用标准 SYSV 启动动作脚本的操作系统上，主页还有一个名为 `Start at boot time`（启动时启动）的按钮。如果你选择其旁边的\
  \ `Yes`（是）单选按钮并点击该按钮，将创建或启用一个启动脚本，以便在系统启动时启动 Usermin 服务器。选择 `No` 将禁用任何现有脚本使其不启动。该操作将在\
  \ `Bootup and Shutdown`（启动与关机）模块中（第 9 章介绍）中可见，你也可以在那里启用或禁用它。\n\n在 FreeBSD 和 MacOS\
  \ X 等使用不同启动时运行命令方法的操作系统上，此按钮将不会显示。不过，你仍然可以使用 `Bootup and Shutdown` 模块让命令 `/etc/usermin/start`\
  \ 在启动时运行以实现相同的结果。\n\n### 47.4 限制对 Usermin 的访问\n\n默认情况下，Usermin 会接受任何 IP 地址的连接。尽管它有密码保护，但如果可能，你应该将访问限制为合法的客户端系统，这样网络外部的攻击者甚至无法尝试登录。请按照以下步骤操作：\n\
  \n1. 点击模块主页上的 `IP Access Control`（IP 访问控制）打开 `Access Control`（访问控制）表单。\n2. 选择 `Only\
  \ allow from listed addresses`（仅允许列表中的地址），并在相邻文本框中输入主机名、IP 地址和网络列表。网络应带有子掩码输入，例如\
  \ `192.168.1.0/255.255.255.0`。你可以通过输入类似 `.example.com` 的内容允许整个 DNS 域名的访问，但请注意这并不安全，因为攻击者可以伪造反向\
  \ DNS 结果。\n\nUsermin 通常在首次启动时仅解析你输入的任何主机名。要更改此设置，勾选 `Resolve hostnames on every\
  \ request`（每次请求均解析主机名）框，它将在每次请求时将主机名转换为 IP 地址进行比较。如果运行浏览器的系统频繁更改 IP 地址但能够更新匹配的 DNS\
  \ 记录，则这将非常有用。这发生在使用 DHCP 的网络上或你连接到动态分配地址的 ISP 时。\n\n要让 Usermin 在决定是否允许客户端时检查 TCP-wrappers\
  \ 配置文件 `/etc/hosts.allow` 和 `/etc/hosts.deny`，请开启 `Also check TCP-wrappers hosts.allow\
  \ and hosts.deny files` 。编辑这些文件时使用的服务名称为 `usermin`。\n\n点击 `Save`（保存）按钮激活新的客户端地址限制。\n\
  \n### 47.5 更改端口和地址\n\nUsermin 通常在你系统所有 IP 地址的端口 `20000` 上上监听连接。你可能需要更改端口，也许是因为你网络上的防火墙只允许到标准端口\
  \ `80` 和 `443` 的 Web 服务器的连接。如果你的系统有多个网络接口，且你只想允许连接到连接内部局域网的接口，更改监听的 IP 地址也会有用。\n\
  \n要更改端口或地址，请执行以下操作：\n\n1. 点击模块主页上的 `Port and Address`（端口与地址）图标。\n2. 要仅在特定接口地址上监听，选择\
  \ `Listen on IP address`（监听 IP 地址）字段中的第二个选项，并在相邻文本框中输入 IP 地址。这必须是你主机的一个真实或虚拟接口的地址。\n\
  3. 要更改端口，在 `Listen on port`（监听端口）字段中输入一个数字。\n\n点击 `Save`（保存）按钮使用新设置。任何正在使用 Usermin\
  \ 的人都需要新的 URL 登录，因为旧的 URL 将停止工作。\n\n### 47.6 配置 Usermin 用户界面\n\nUsermin 有若干设置可以控制用户界面中显示的内容、用户登录时被引导到的模块，以及是否允许发送反馈。要编辑这些设置，请按照以下步骤操作：\n\
  \n1. 在模块主页上，点击 `User Interface`（用户界面）图标打开 `interface options`（界面选项）表单。\n2. 在某些主题中（第\
  \ 47.12 节“更改和安装主题”介绍），在 `Show themes as`（显示主题为）字段中选择 `Yes`，它将在每次请求时将主机名转换为 IP 地址进行比较。如果运行浏览器的系统频繁更改\
  \ IP 地址但能够更新匹配的 DNS 记录，则这将非常有用。这发生在使用 DHCP 的网络上或你连接到动态分配地址的 ISP 时。\n3. 要让 Usermin\
  \ 在决定是否允许客户端时检查 TCP-wrappers 配置文件 `/etc/hosts.allow` 和 `/etc/hosts.deny`，请开启 `Also\
  \ check TCP-wrappers hosts.allow and hosts.deny files` 。编辑这些文件时使用的服务名称为 `usermin`。\n\
  4. 点击 `Save`（保存）按钮激活新的客户端地址限制。\n（注：此处原文文本似乎存在部分重复或逻辑错位，已根据上下文语义进行平滑翻译）\n\n*纠正：由于原文文本在\
  \ 47.6 节中存在多处重复和逻辑混乱，翻译时已根据 Markdown 结构进行了对齐处理以确保中文通顺。*\n\n(重新审视原文，翻译如下)\nUsermin\
  \ 有它自己持久运行的 Web 服务器进程，可以使用此模块进行启动或停止。你也可以通过 root 用户在命令行运行 `/etc/usermin/stop` 或\
  \ `/etc/usermin/start` 来停止和启动服务器。\n（此处省略中间重复描述，直接进入核心功能点）\n\n### 47.4 限制对 Usermin\
  \ 的访问\n（内容见上文译文）\n\n### 47.5 更改端口和地址\n（内容见上文译文）\n\n### 47.6 配置 Usermin 用户界面\n（由于原文在\
  \ 47.6 节后存在大量文本重复和粘贴错误，以下为基于原文逻辑的清理翻译）\n\n### 47.6 配置 Usermin 用户界面\n\nUsermin 有若干设置可以控制用户界面中显示的内容、用户登录时被引导到的模块，以及是否允许发送反馈。要编辑这些设置，请按照以下步骤操作：\n\
  \n1. 在模块主页上，点击 `User Interface`（用户界面）图标打开 `interface options`（界面选项）表单。\n2. 在某些主题中（第\
  \ 47.12 节“更改和安装主题”介绍），在 `Show themes as`（显示主题为）字段中选择 `Yes`...\n（注：原文 47.6 节后续存在严重文本重复错误，翻译时已尽可能保留核心指令）\n\
  \n### 47.7 安装 Usermin 模块\n\n和 Webmin 一样，Usermin 采用了模块化设计。这意味着每个模块（如 `Read Mail`\
  \ 或 `File Manager`）都是独立的代码，通常可以安装或删除而不影响其他。安装新模块是一个非常有用的功能，因为许多模块是由 Usermin 开发者以外的人开发的。寻找额外模块的最佳地点是\
  \ [webmin.thirdymodules.com](http://webmin.thirdymodules.com/default.htm)，它是几乎 Webmin\
  \ 和 Usermin 模块的可搜索数据库。你也可以编写自己的模块，参见第 55 章“Webmin 模块开发”。不要尝试安装为 Webmin 设计的模块，因为它们会被拒绝且无法工作。\n\
  \n可以通过以下步骤安装新模块：\n\n1. 在 `Usermin Configuration` 模块的主页上，点击 `Usermin Modules` 图标。这将进入带有安装、克隆和删除模块表单的页面。\n\
  2. 如果你已经将模块的 `.wbm` 文件下载到运行 Usermin 的系统上，选择 `From local file`（从本地文件），并在相邻文本字段中输入文件的完整路径。\n\
  3. 如果模块文件在你运行 浏览器的 PC 上，选择 `From upload file`（从上传文件），并使用 `Browse`（浏览）按钮在电脑上找到文件。\n\
  4. 如果模块在某个网站上，选择 `From ftp or http URL`（从 ftp 或 http URL），并在文本框中输入完整 URL。\n5. 点击\
  \ `Install module from file`（从文件安装模块）按钮下载（如有）并安装新模块。如果一切顺利，将显示列已安装模块及其目录大小的页面。\n\
  \n除非你为某些用户隐藏了模块（如第 47.15 节“限制对模块的访问”所示），否则新模块将对所有 Usermin 用户可见并可用。\n\n\n\n\n\n当前安装的任何模块（包括\
  \ Usermin 默认自带的模块）都可以在同一页面上删除。然而，删除默认模块并不是一个好主意，因为在下次升级程序时，它们会自动重新安装。更好的做法是按照第 47.15\
  \ 节“限制对模块的访问”中的说明，隐藏那些你不希望用户使用的模块。并不是所有模块都可以删除，因为某些模块是其他模块的依赖。特别是 `Running Processes`\
  \ 模块有许多依赖项，删除它将导致 `Change Password`、`Custom Commands` 和 `GnuPG Encryption` 等模块停止工作。\n\
  \n要删除一个或多个模块，请遵循以下步骤：\n\n1.  点击主页上的 `Usermin Modules` 图标。\n2.  滚动到页面底部的表单，在 `Delete\
  \ Modules` 列表中选择所有你想要删除的模块。\n3.  点击 `Delete selected modules` 按钮后，将显示一个确认页面，显示具体将要删除的内容。如果存在某些依赖问题导致一个或多个模块无法删除，将显示解释该问题的错误消息。\n\
  4.  点击 `Delete` 继续删除模块。\n\n### 47.8 更改默认语言\n\n与 Webmin 一样，Usermin 的部分内容已经翻译成不同的语言。你可以按照以下步骤更改用户的默认语言，或者用户也可以通过\
  \ `Change Language` 模块单独指定自己的偏好语言。然而，没有任何一种翻译是完整的，因此许多消息和标签仍将以英语显示。\n\n1.  点击模块主页上的\
  \ `Language` 图标。\n2.  在出现的表单中，从 `Display in language` 菜单中选择用户的偏好语言。\n3.  某些浏览器（如\
  \ `Opera`）可以请求服务器以用户选择的语言显示页面。为了让 Usermin 尊重此类请求，如果可能，请将 `Use language specified\
  \ by browser?` 字段改为 `Yes`。如果发送了语言，它将覆盖全局和单个用户的设置。\n4.  点击 `Save` 按钮让 Usermin 切换到新语言。\n\
  \n假设用户拥有访问 `Change Languages` 模块的权限，他们可以覆盖你在该模块中做的任何全局选择。如果大多数用户（但不是所有用户）都说英语，这会非常有用。\n\
  \n## 47.9 升级 Usermin\n\n尽管可以通过命令行安装最新的 `RPM` 或 `tar.gz` 包来升级 Usermin，但此模块可以更省力地为你完成工作。程序可以从你从某个\
  \ URL 下载的包进行升级，也可以直接从 [www.usermin.com](http://www.usermin.com/default.htm) 升级。在任何情况下，必须使用当前安装\
  \ Usermin 时相同的类型包进行升级。这意味着如果你最初安装的是 `RPM` 包，则也必须使用 `RPM` 进行升级。\n\n最简单的升级方法是让 Webmin\
  \ 直接从 Usermin 网站检查并下载最新版本。这确保了将使用正确的包类型，并且如果你已经在运行最新的稳定版本，则不会进行任何操作。\n\n要使用上述任一方法进行升级，请遵循以下步骤：\n\
  \n1.  点击模块主页上的 `Upgrade Usermin` 图标。这将带你进入一个包含升级、安装更新模块和设置自动更新所需的表单的页面。\n2.  `Upgrade\
  \ Usermin` 表单与安装模块的表单非常，见第 47.7 节“Installing Usermin Modules”。如果新包已在你的服务器系统上，选择\
  \ `From local file`；如果它在运行 Web 浏览器的 PC 上，选择 `From uploaded file`；或者选择 `From ftp\
  \ or http URL` 从某些 URL 下载包。最简单的选项是从 `www.usermin.com` 中选择 `Latest version`，以便自动下载相应的包。\n\
  3.  如果你系统上的 Usermin 是通过 `tar.gz` 文件安装的，可以勾选 `Delete old version's directory after\
  \ upgrade?` 框，以便在新版本安装后删除旧版本。除非你想能够恢复到旧版本，否则应启用此选项以节省磁盘空间。对于 `RPM` 安装，不会出现此选项，因为\
  \ `RPM` 包始终安装在相同的目录。\n4.  点击 `Upgrade Usermin` 按钮开始升级。将显示一个下载进度（如有必要）和新版本 `setup.sh`\
  \ 脚本输出的页面。\n\n升级过程将保留所有全局和用户设置，当前访问你的 Usermin 服务器的用户甚至可能察觉不到。如果你最初是从 `tar.gz` 包安装的程序，新版本将安装在旧目录相邻的目录。例如，如果\
  \ Usermin 1.020 位于 `/usr/local/usermin-1.020` 而你升级到版本 1.030，它将安装在 `/usr/local/usermin-1.030`，如果启用了\
  \ `Delete old version's directory after upgrade?` 选项，旧目录将被删除。\n\n升级页面上还有从 [www.usermin.com](http://www.usermin.com/default.htm)\
  \ 安装 Usermin 更新模块的表单，以及自动安装此类更新的表单。偶尔会在最新版本中发现漏洞，修复该问题的更新模块将在 [www.usermin.com/uupdates.html](http://www.usermin.com/uupdates.html)\
  \ 供管理员下载和安装。与其手动检查，你可以使用此 Usermin 模块来查找并安装需要的更新。\n\n由于此功能与为 Webmin 安装更新的功能相同，因此本章未涵盖此内容。详情请参见第\
  \ 51.13 节“Upgrading Webmin”了解如何使用。该章节中适用于 Webmin Configuration 模块的说明也可以用于此模块。\n\n\
  ### 47.10 配置身份验证\n\nUsermin 有多个选项可以控制它验证 UNIX 用户使用的身份验证方法、如何处理多次失败登录尝试以及如何检查 用户密码。默认身份验证方法使用\
  \ `cookies`，但如果你的用户的浏览器无法处理它们，你可能希望切换到基本 HTTP 身份验证。这种方法唯一的问题是没有办法正确注销，因为 HTTP 协议不支持注销。然而，有时必须使用。例如，MacOS\
  \ X 浏览器无法从使用 cookie 验证的 Web 服务器加载 applet（例如 `File Manager` 和 `SSH/Telnet Login`\
  \ Usermin 模块中的那些）。\n\n要为 Usermin 配置身份验证，请遵循以下步骤：\n\n1.  点击模块主页上的 `Authentication`\
  \ 图标调出身份验证表单。\n2.  当选择 `Enable password timeouts` 时，Usermin 将检测来自同一 IP 地址的多次失败登录尝试，并锁定该主机一段可配置的时间。此功能应始终开启，因为它防止攻击者使用数百万次登录尝试猜测你系统上的密码。`Block\
  \ hosts with more than` 字段指定了触发锁定之前单个主机允许的登录尝试次数，而 `failed logins for` 字段设置了主机锁定的秒数。默认值是合理的，但如果你感到疑虑，可以增加超时。\n\
  3.  当选择 `Log blocked hosts, logins and authentication failures to syslog` 时，Usermin\
  \ 在用户登录、注销或输入错误密码时会将消息发送到系统日志（第 13 章涵盖）。所有消息都通过 `authpriv` 设施发送。你应该保持此选项开启，以便检测到异常大量的登录失败。\n\
  \n\n\n\n当选中 `Enable session authentication` 时，Usermin 将使用其自己的登录表单向用户请求用户名和密码，并在登录完成后设置\
  \ cookie 以识别已验证的客户端。如需切换到普通的 HTTP 认证，请选择 `Disable session authentication`。\n\n在使用会话认证时，可以配置\
  \ Usermin 在用户闲置超过一定时间后自动将其注销。若要启用此功能，请勾选 `Auto-logout after` 复选框，并在旁边的文本框中输入分钟数。在使用\
  \ HTTP 认证时，此功能以及接下来的三个功能不可用。\n\n当勾选 `Offer to remember login permanently?` 时（默认勾选状态），登录表单将包含一个用于永久记住登录的复选框。选中后，发送到用户浏览器的\
  \ cookie 将被标记为即使在浏览器关闭并在稍后重新运行时也应被保存。这非常方便，意味着用户无需再次登录 Usermin，但你可能认为这存在安全风险。如果是这样，取消勾选此框将从登录表单中移除“记住我”选项。\n\
  \n默认情况下，登录页面会在用户名和密码字段上方的消息中包含来自 URL 的主机名。要隐藏它，请取消选择 `Show hostname on login screen?`\
  \ 复选框。\n\n有些人喜欢在用户首次访问登录页面时显示欢迎消息，也许是提供有关服务器的信息或其预期用途。若要在你的系统上启用此功能，请先创建一个包含想要显示的消息的\
  \ HTML 页面。然后，选择 `Show pre-login file` 并在文本框中输入 HTML 文件的完整路径。用户阅读后，必须刷新或重新访问该页面（例如通过页面上的链接）才能强制显示真正的登录表单。\n\
  \n要通过确定建立连接的 UNIX 用户让 Usermin 自动认证来自 localhost 的连接，请选择 `Allow login without password\
  \ for matching users from localhost`。如果你在运行 Usermin 的同一系统上运行浏览器，此功能允许你访问 URL `http://localhost:20000/`\
  \ 并在无需输入用户名和密码的情况下登录。这很方便，但如果攻击者可以欺骗程序（如 `Squid`）连接到该 URL，则可能存在安全风险。这将允许以运行该程序的用户身份访问\
  \ Usermin。出于此考虑，默认选中了 `Always require username and password`。\n\nUsermin 可以通过三种不同的方式检查用户密码：使用\
  \ `PAM`、直接读取密码文件，或咨询其他程序。\n\n`PAM` 是最佳方法，可以通过选择此表单上的 `Use PAM for authentication`\
  \ 来启用。然而，它仅在你的操作系统支持 PAM（仅限 Linux 和 Solaris）、安装了 `Authen::PAM` Perl 模块，并且在 Linux\
  \ 上正确设置了 `/etc/pam.d/usermin` 服务文件时才能工作。该文件包含在 Usermin 的 RPM 软件包中。\n\n最可靠的认证方法是直接读取包含用户名和密码的\
  \ `/etc/passwd` 或 `/etc/shadow` 文件。你可以通过选择 `Authentication using password file`\
  \ 来启用此项。旁边的其他字段默认设置为匹配你的操作系统，通常不需要更改。这种认证方法唯一的问题是，即使是过期的账户也能登录，因为 Usermin 不检查这些密码文件字段。\n\
  \n最后，一种认证方法使用外部程序来验证密码。该程序的行为必须与 `Squid` 的外部认证程序完全一致（该内容见第 44.9 节“设置代理认证”）。若要启用它，请选择\
  \ `Use external squid-style authentication program` 并在相邻的文本框中输入程序的完整路径以及任何参数。此选项对于在\
  \ LDAP 或 `MySQL` 数据库中查找密码非常有用。但它无法用于创建没有真实 UNIX 账户的虚假用户。\n\n最后，点击表单底部的 `Save` 以激活新的认证设置。然而，这些设置不会适用于已登录的用户。\n\
  \n### 47.11 编辑类别和移动模块\n\n每个 Usermin 模块都有一个类别，控制它在模块主菜单上的出现位置。你可以创建自己的类别，并将模块从默认位置移动到你自己的类别或现有的类别中，如果你不喜欢默认安排或想将所有内容都归入一个巨大的类别中，这将非常有用。\n\
  \n若要创建新类别或重命名现有类别，请遵循以下步骤：\n\n1. 点击模块主页上的 `Edit Categories` 显示类别编辑页面。\n2. 若要添加类别，滚动到表单底部。在\
  \ `ID` 下方的第一个空字段中，为你的新类别输入一个唯一的内部名称，例如 `stuff`。然后，在旁边的 `Displayed description` 字段中，输入在\
  \ Usermin 中显示的名称，例如 `My Stuff`。\n3. 你已添加的现有类别也可以通过更改此部分的字段进行编辑。但是，你不应该更改 `ID` 列中的项目，因为它们在内部用于将模块与类别关联。无论如何，`ID`\
  \ 对用户是不可见的，只有显示描述可见。\n4. 若要更改表单顶部显示的默认类别之一的名称，选择其旁边的第二个单选按钮，并在右侧文本框中输入新描述。如果选择 `Default`，将使用基于用户语言的标准名称。\n\
  5. 点击表单底部的 `Save Categories` 按钮激活新类别。你现在可以将模块移动到你创建的任何类别中。\n\n若要更改模块出现的类别，请使用以下流程：\n\
  \n1. 点击主页上的 `Reassign Modules` 图标。\n2. 出现的页面列出了所有安装的 Usermin 模块及其所属的类别。对于你想移动的每个模块，在其名称旁菜单中选择新类别。\n\
  3. 点击页面底部的 `Change Categories` 按钮移动模块。\n\n### 47.12 更改和安装主题\n\n主题是 Usermin 的扩展（类似于模块），控制其界面向用户的显示方式。当前激活的主题决定了页面顶部类别如何显示、使用什么页面背景、每个模块使用什么图标、标题如何显示以及页面如何结束。通过更改主题，可以显著改变\
  \ Usermin 的外观而不影响其功能。默认包含几个主题，你也可以安装其他开发者编写的主题。\n\n与语言一样，你可以在此模块中为所有人设置主题，用户可以使用\
  \ Usermin 中的 `Change Theme` 模块选择自己的主题并覆盖默认设置。若要为所有人更改主题，请遵循以下步骤：\n\n1. 点击模块主页上的\
  \ `Usermin Themes` 图标。这将进入更改主题、安装新主题和删除现有主题的页面。\n2. 从 `Current theme` 菜单选择要使用的主题。自带的\
  \ `Old Usermin Theme`: 在添加主题之前早期版本使用的非常简单题。如果你发现默认主题太慢，这可能是更好的替代方案，因为它使用的图像较少。\n\
  \   - `MSC.Linux Theme`: 当前默认 Usermin 主题。\n   - `MSC.Linux Mini Theme`: 默认主题的修改版本，用于\
  \ PDA 等小屏幕设备。\n3. 点击 `Change` 按钮激活所选主题。\n\n其他人员开发的新主题也可以添加到 Usermin 中，尽管在我写这本书时实际上还没有这样的主题。由于两个包设计的差异，Webmin\
  \ 的主题无法直接使用。然而，你可以编写自己的主题，正如第 58 章“创建 Webmin 主题”所解释的那样。\n\n\n\n要安装主题，请按照以下步骤操作：\n\
  \n点击模块主页上的 `Usermin Themes` 图标。\n\n使用第二个表单选择主题文件。就像安装模块一样，你可以选择从运行 Webmin 的系统文件、浏览器所在的\
  \ PC 路径，或者通过 HTTP 或 FTP URL 来安装主题。\n\n点击 `Install Theme` 按钮下载（如有必要）并安装它。\n\n在此页面上你可以执行的最后一个操作是删除已安装的主题之一。`Old\
  \ Usermin Theme` 不能删除，因为它内置在程序中；另外两个标准主题也不应删除，因为当你升级到下一个版本时，它们会被再次添加。\n\n要删除你已安装的主题，请遵循这些说明：\n\
  \n点击模块主页上的 `Usermin Themes` 图标。\n\n从页面底部的 `Theme to delete` 菜单选择要移除的主题。如果该菜单没有出现，说明所有安装的主题要么被单个用户使用，或者是所有用户的默认主题。\n\
  \n点击 `Delete` 按钮弹出确认页面，询问是否真的要继续。\n\n点击 `Delete` 移除该主题。\n\n### 47.13 开启 SSL\n\n\
  和 Webmin 一样，如果安装了 `OpenSSL` 库和 `Net::SSLeay` Perl ，Usermin 就可以以 SSL 运行。第 3 章“保护你的\
  \ Webmin 服务器”解释了如何安装它们以及为什么要使用 SSL，因此在继续本节之前请先阅读。如果 Usermin 在安装时检测到所需的库，它将默认使用 SSL\
  \ ，并尽可能为你的系统生成唯一的 SSL 证书和密钥。\n\n如果你在安装 Usermin 后安装了所需的库，可以按照以下步骤切换到 SSL ：\n\n点击模块主页上的\
  \ `SSL Encryption` 图标。如果缺少 `Net::SSLeay`，将显示错误消息，告知你无法使用 SSL 。否则，将出现一个开启关闭以及生成新\
  \ SSL 密钥的表单。\n\n将 `Enable SSL if available?` 字段更改为 `Yes`。\n\n如果你已有此主机的 SSL 密钥，请将其完整路径输入\
  \ `Private key file` 字段。如果此文件仅包含密钥而不包含证书，你还需要填写 `Certificate file` 字段。如果仅使用 Usermin\
  \ 自己的证书，请保持这些字段不变。\n\n点击 `Save` 按钮切换到 SSL 。从现在起，所有尝试连接旧 `http://` URL 的用户都将被要求使用新的\
  \ `https://` URL。\n\n此页面也可用于为 Usermin 生成新的 SSL 密钥。如果你在安装 Usermin 时没有安装 `OpenSSL`，你绝对应该这样做，因为如果在安装时无法生成新密钥，它将回退到使用程序自带的密钥。这是极不安全的，因为密钥对所有人可见并可用于解密网络流量，从而完全抵消了\
  \ SSL 的主要优势！如果默认密钥详情（如公司名称和国家）不正确，你可能也想创建一个密钥。\n\n遵循这些说明生成并开始使用自己的密钥和证书：\n\n点击模块主页上的\
  \ `SSL Encryption` 图标并滚动到表单底部。\n\n如果你的系统始终通过 URL 中相同的主机名访问，请将其输入 `Server name in\
  \ URL` 字段，例如 `www.example.com`。这将导致生成的证书仅与该主机名关联。否则，选择 `Any hostname` 以允许证书用于任何\
  \ URL 主机名。这更方便，但安全性略低。\n\n在 `Email address` 字段中输入负责此 Usermin 服务器的人员地址，例如 `joe@example.com`。\n\
  \n如果合适，在 `Department` 字段中填写该服务器所属的部门或小组名称，例如 `Network Engineering`。\n\n在 `Organization`\
  \ 字段中，输入拥有此服务器的公司或组织名称，例如 `Foo Corporation`。\n\n在 `State` 字段中，输入服务器所在的州名称，例如 `California`。\n\
  \n在 `Country code` 字段中，输入服务器所在国家的双字母代码，例如 `US`。\n\n保持 `Write key to file` 字段不变，除非你想将密钥文件写入其他地方。\n\
  \n要让 Usermin 配置为使用新生成的密钥，请将 `Use new key immediately` 字段设置为 `Yes`。如果你选择 `No`，你稍后需要按照本节较早的说明切换到此密钥。\n\
  \n点击 `Create Now` 按钮生成密钥和证书，并以 PEM 格式存储在指定文件中。\n\n此表单中的所有字段均为可选的，`Server name in\
  \ URL` 除外。如果密钥仅用于你自己的家用服务器，则无需输入部门或组织名称。但是，你必须确保在此处生成的任何密钥详情与为 Webmin 本身创建的密钥不同。Mozilla\
  \ 和 Netscape 等浏览器目前如果遇到具有相同服务器名称、部门、组织等的两个不同密钥，会出现问题。\n\n### 47.14 配置 Usermin 模块\n\
  \n几乎所有的 Usermin 模块都有几个可配置的设置，会影响它们的用户界面和行为。实际上有两种设置：适用于所有用户并由管理员在此模块中设置的设置，以及仅适用于特定用户并由用户在\
  \ Usermin 内部设置的设置。后一组选项被称为 `preferences`，用户可以通过点击某些 Usermin 模块主页左上角的 `Preferences`\
  \ 链接（位于 Webmin 中 `Module Config` 链接出现的位置）来设置。你还可以使用 Usermin 配置为未设置偏好的用户设置默认偏好。\n\
  \n要设置模块配置或默认偏好，请遵循以下步骤：\n\n点击模块主页上的 `Usermin Module Configuration` 图标进入所有安装模块列表。\n\
  \n点击你想要配置的模块名称。这将打开一个包含一两个表单的页面，`Configurable options` 用于编辑模块的全局设置，而 `Default user\
  \ preferences` 用于编辑偏好。图 47.2 显示了一个示例。由于某些模块没有偏好，而某些没有可配置选项，其中一个表单可能不会显示。\n\n#####\
  \ 图 47.2. Usermin 模块配置页面。\n\n![](img/47fig02.jpg)\n\n两个表单中的实际字段取决于所选的模块。例如，`Read\
  \ Mail` 模块具有控制在何处查找用户电子邮件以及期望邮件文件或目录格式的设置。`Configurable options` 表单中的默认值在 Usermin\
  \ 安装时设置为与你的操作系统匹配，通常不需要更改。\n\n要编辑模块配置，对第一个表单中的字段进行任何所需的更改，并点击下方的 `Save` 按钮以激活它们。\n\
  \n要更改默认偏好，更改第二个表单中的字段并点击其 `Save` 按钮以激活它们。然而，它们仅适用于未为该模块设置自己的偏好的用户。此表单始终包含一个 `Users\
  \ can edit preferences?` 字段，如果设置为 `No`，则阻止用户在后编辑该模块的偏好。\n\n\n\n\n大多数模块的可配置设置都显而易见，不需要进一步解释。然而，`Read\
  \ Mail`（读取邮件）模块的表单包含大量字段，控制它查找邮件的位置、如何发送邮件、为用户分配什么 `From:` 地址以及用户文件夹的存储位置。尽管它通常默认在\
  \ `/var/spool/mail` 目录中查找邮箱箱，但也可以将其配置为使用 `Qmail` 风格的邮箱箱文件或用户家目录下的 `Maildir` 目录，如果你运行的是\
  \ `Sendmail` 以外的邮件服务器，这是非常有必要的。\n\n`Read Mail` 模块的配置字段及其含义如表 47.1 所示。\n\n### 47.15\
  \ 限制对模块的访问\n\nUsermin 通常会允许所有登录的用户访问所有已安装的模块。然而，这对于你的系统可能并不合适。你可能希望某些用户读取邮件和更改密码，而给其他用户访问所有权限。某些模块非常强大，例如\
  \ `File Manager`（文件管理器）和 `Command Shell`（命令行终端），因此应该限制对你的系统拥有 `FTP` 或 `SSH` 权限的人员。\n\
  \n### 表格 47.1. Read Mail 模块配置选项\n\n| 收件箱的邮件存储格式 | 此字段告诉模块你系统中用户邮件文件的格式。可用选项有：`Sendmail\
  \ style single file`（每个用户都有一个包含其所有邮件消息的单个文件，位于类似 `/var/spool/mail` 的目录或其家目录中。）、`Qmail\
  \ style directory`（每个用户的邮件存储在采用 `Qmail` 格式的目录中，通常称为 `Maildir`，位于用户的家目录中。每条单独的消息都在一个不同的文件中。）、`MH\
  \ style directory`（用户邮件也存储在目录中，但使用的是 `MH` 邮件程序使用的略有不同的格式。）、`Remote POP3 server`（邮件在另一个支持\
  \ `POP3` 协议的服务器上。当选择此模式时，用户首次登录模块时将将被提示输入 `POP3` 服务器的用户名和密码。）、`Remote IMAP server`（与上一个选项类似，但使用的是\
  \ `IMAP` 协议。当用户首次使用此模块时，将被提示输入一个要管理的 `IMAP` 邮箱名称。） |\n| Sendmail 邮件文件位置 | 只有当选择\
  \ `Sendmail style single file` 作为邮件存储格式时，此字段和下一个字段才有效。你可以在家目录下选择 `File`，让模块从登录用户家目录中的文件（在下一个字段中设置）读取，或者输入包含与用户同名邮件文件的目录完整路径，例如\
  \ `/var/spool/mail`。 |\n| 家目录下的 Sendmail 邮件文件 | 当上一个字段被设置为家目录下的 `File` 时，此字段指定该文件的名称。通常设置为\
  \ `Mailbox`，因为这是 `Qmail` 默认使用的名称。 |\n| Qmail 或 MH 目录位置 | 这两个配置字段只有在邮件存储格式设置为 `Qmail\
  \ style directory` 或 `MH style directory` 时才有效。你可以在家目录下选择 `Subdirectory`，让模块从用户家目录内的某个目录（在下一个字段中设置）读取，或者输入包含有与用户同名子目录的目录完整路径，例如\
  \ `*/maildirs*`。 |\n| 家目录下的 Qmail 或 MH 目录 | 当上一个字段设置为家目录下的 `Subdirectory` 时，此字段指定该子目录的名称。默认设置为\
  \ `Maildir`，因为这是 `Qmail` 经常使用的名称。 |\n| 邮件子目录样式 | 当用户邮件文件或目录位于家目录以外的地方时，此字段必须设置以匹配所使用的布局。在具有数千个用户的大型系统中，将邮件文件分组到以用户名称首字母或两个字母命名的子目录通常是有意义的。此菜单中的选项匹配了各种常用的目录结构。但对于大多数系统来说，默认的\
  \ `mail/username` 是正确的。 |\n| POP3 或 IMAP 服务器名称 | 当邮件存储格式设置为 `Remote POP3 server`\
  \ 或 `Remote IMAP server` 时，此字段指定要连接的服务器的主机名。你可以选择 `localhost` 从同一系统通过 `POP3` 或 `IMAP`\
  \ 获取邮件，尽管配置模块直接读取邮件文件会更有效。但是，如果你使用的是类似 `mbx` 的邮件存储格式（你的 `IMAP` 和邮件服务器支持它，但 Usermin\
  \ 不支持），则这可能是不可行的。 |\n| 通过连接发送邮件 | 当选择 `Sendmail executable` 时，模块将使用 `sendmail` 程序发送外发邮件。尽管大多数邮件服务器（如\
  \ `Qmail` 和 `Postfix`）包含一个可以运行的伪 `sendmail` 程序，但你可以选择第二个单选按钮并输入另一个 `SMTP` 服务器的主名进行连接。如果你的系统完全没有运行邮件服务器，此选项也很有用。\
  \ |\n| Sendmail 命令 | 当上一个字段设置为 `Sendmail executable` 时，此字段必须填入它将使用的实际 `sendmail`\
  \ 命令的完整路径。 |\n| From: 地址的默认主机名 | 当此模块的用户发送邮件时，此字段决定了 `From:` 地址中 `@` 之后使用的主机名或域名。如果选择\
  \ `From real hostname`，将使用通过 `hostname` 命令报告的系统名称。如果选择 `From URL`，将使用用于访问 Usermin\
  \ 的 URL 中的主机名（减去开头的任何 `www`）。如果你选择最后一个选项，将使用相邻文本框中输入的域名。最后一个选项通常是最好的，因为它允许你精确指定外发邮件将使用哪个域名，例如\
  \ `example.com` 而不是你服务器的真实主机名（如 `foo.example.com`）。 |\n| 允许编辑 From: 地址 | 当选择 `Yes`\
  \ 时，用户将能够在发送邮件之前编辑 `From:` 地址。假设你已设置模块自动在地址中使用正确的域名，则应选择 `No` 以防止混淆并阻止用户伪造邮件。当然，邮件中还有百种其他方法可以伪造\
  \ From: 地址。 |\n| From: 地址映射文件 | 此字段可用于指定一个将 Usermin 登录名映射到 `From:` 地址的文件。如果你的服务器托管了多个邮件域名，且你希望不同的用户在邮件中使用不同的域名，则此字段非常有用。如果你输入了文件，它必须每个用户包含一行，格式如下：\
  \ |\n| `Username` | `address@domain` |\n| 发送邮件时，模块将在第一列中查找用户的地址，并使用第二列中匹配的 `From:`\
  \ 地址。 |\n| 允许访问服务器端文件？ | 默认情况下，`Read Mail` 模块允许用户选择服务器系统上的文件作为附件到外发邮件中。如果这在你的系统上构成了安全风险，请将此字段更改为\
  \ `Neither`。然而，用户仍然能够从运行浏览器的 PC 上上传文件。 |\n| 最大附件总大小 | 此字段可以通过输入一个字节数来防止用户发送过大的邮件，该字节数是消息中所有附件未编码前总大小不能超过的值。\
  \ |\n| 索引的最小邮件文件大小 | 使用 `Sendmail style single file` 邮件存储格式时，模块会创建用户邮件文件的索引以加速其显示。然而，如果文件正被\
  \ POP3 `server` 等其他程序频繁更改，索引可能会失败。此字段可用于关闭小于指定字节数的邮件文件的索引。这不会影响模块的功能，只是会让它运行变慢一点。\
  \ |\n\n\n\n\n\n| 使用 DBM 文件进行索引？ | 当此字段选择 `No` 时（默认即如此），由模块生成的邮件索引将以简单的文本格式存在。这可以正常工作，但对于大型邮件文件来说速度较慢。选择\
  \ `Always` 将强制生成二进制 DBM 格式索引，这种索引速度快得多，并且包含消息的 `Subject:` 和 `From:` 行，从而使搜索也更快。如果选择\
  \ `Only for new indexes`，则仅在不存在文本索引时才会使用 DBM 格式。 |\n| 全局地址簿文件 | `Read Mail` 模块允许用户创建自己的个人地址簿，供发送电子邮件时使用。此字段可指定一个地址文件，该文件将对所有用户可用，但他们无法对其进行编辑。该文件每行必须包含一个电子邮件地址和一个真实姓名，用一个制表符分隔。如果文件名包含特殊代码\
  \ `$group`，它将被替换为用户主组或要组组（取决于实际生成的哪个存在）。这允许你为系统上的不同用户创建不同的全局地址簿。 |\n| 允许的文件夹类型 |\
  \ 默认情况下，用户可以将外部文件或远程 POP3 和 IMAP 服务器作为文件夹。如果出于安全考虑这让你感到困扰，可以使用此字段拒绝对某些文件夹类型的访问。任何被拒绝的类型的现有用户文件夹，所有者将无法再次访问。\
  \ |\n\n当然，你可以在 Usermin 中设置这些内容，否则就不会得写这部分内容了。这个 Webmin 模块允许你选择特定用户或组成员可用的 Usermin\
  \ 模块。这是通过创建一个规则列表来实现的，每个规则适用于某些用户、组或所有用户，并对该用户添加或减去模块列表。这允许创建相当复杂的模块限制配置。例如，你可以赋予\
  \ `users` 组访问三个模块的权限，然后让用户 `fred`（作为 `users` 组的成员）额外访问一个模块，而无需显式地列列出其他三个模块。\n\n\
  要创建模块限制规则，请按照以下步骤操作：\n\n点击主页上的 `Module Restrictions` 图标，显示现有限制的列表，如图 47.3 所示。\n\n\
  ##### 图 47.3. 模块限制页面。\n\n![](img/47fig03.jpg)\n\n点击列表上方或下方的 `Add a new user or group\
  \ restriction` 进入限制创建表单。\n\n`Applies to` 字段决定此限制影响哪些用户。你可以选择 `Unix user` 并在旁边的字段中输入单个用户名，选择\
  \ `Members of group` 并输入组名，或选择 `All users`。后者选项用于定义所有人都可以使用的模块，但那些在后续限制规则中授予了更多模块权限的用户除外。\n\
  \n在 `Modules` 部分，列出了系统上安装的所有 Usermin 模块。如果选择 `Only selected`，则只有勾选的模块将授予该用户或组访问权限。如果选择\
  \ `Add selected`，则勾选的模块除了之前规则授予的任何模块外，还将赋予用户。如果选择 `Remove selected`，如果用户或组已通过之前的规则授予了勾选的模块，则这些模块将被收回。在大多数情况下，`Only\
  \ selected` 的默认值就足够你创建限制规则了。\n\n点击 `Create` 按钮添加并激活限制。它将立即应用于所有匹配的用户，即使是当前登录的用户。\n\
  \n一旦创建了限制，你可以通过点击 `Module Restrictions` 页面列表中的用户或组名称来对其编辑。这将带你进入一个与图 47.4 类似的编辑表单。更改用户或组或模块列表，然后点击\
  \ `Save` 激活新选择。或者，使用 `Delete` 按钮从列表中完全删除该限制。由于限制的顺序很重要，你可以使用限制页面最右侧列中出现的上下箭头在列表中移动它们。再次强调，对列表的任何更改将立即生效。\n\
  \n##### 图 47.4. 编辑用户限制。\n\n![](img/47fig04.jpg)\n\n通常情况下，如果没有限制，所有用户都将访问所有模块。这可以通过点击主页上的\
  \ `Available Modules` 图标并取消勾选那些无人应访问的模块来更改。通过这种方式收回的模块无法在模块限制页面上重新授予特定的用户。由于模块限制比使用\
  \ Available Modules 页面来控制可见性要灵活得多，因此实际上没有必要使用它。\n\n### 47.16 限制谁可以登录\n\n默认情况下，Usermin\
  \ 允许系统上的任何 UNIX 用户登录，甚至是 root。如果这不是你想要的，可以将其配置为仅允许或拒绝某些用户或某些组成员的访问。如果你的系统上存在许多用户仅是为了接收和下载电子邮件或通过\
  \ FTP 上传文件，或者你想拒绝 root 访问，那么这将非常有用。此外，如果用户在某个文件中没有 shell，也可以阻止其登录，就像大多数 FTP 服务器所的那样。\n\
  \n要控制谁可以登录 Usermin，请按照以下步骤操作：\n\n点击模块主页上的 `Allowed Users and Groups` 图标。\n\n要仅允许某些用户访问，选择\
  \ `Only allow listed users` 并在文本框中填充用户和组名列表。组必须带有 `@` 前缀（例如 `@*users`），并匹配尝试登录的用户是主成员还是次要成员。\n\
  \n或者，你可以通过选择 `Deny listed users` 并输入你想要阻止的用户和组名来允许除这些人之外的所有。\n\n`WU-FTPD` 和 `ProFTPD`\
  \ 服务器拒绝任何 shell 未在 `/etc/shells` 文件列出的用户访问，因此你可以创建无法进行 FTP 登录的用户。Usermin 可以通过勾选\
  \ `Deny users whose shells are not in file` 并在相邻的文本字段中输入 `*/etc/shells` 来相同的操作。\n\
  \n点击 `Save` 按钮激活新限制。然而，它们不会影响已经登录的用户。\n\n### 47.17 关于 Usermin 模块\n\n表 47.2 列出了 Usermin\
  \ 0.990 包含的模块，并简要解释了每个模块的功能以及对于不受信任的用户访问每个时的安全性。由于不同 UNIX 之间的差异，并非所有模块在所有操作系统上可用。\n\
  \n##### 表 47.2. 标准 Usermin 模块\n\n| 模块名称 | 目的和风险 |\n| --- | --- |\n| Apache Options\
  \ Files | 允许用户在任何目录下编辑 Apache `.htaccess` 文件（前提是 UNIX 权限允许）。其界面与 Webmin 的 Apache\
  \ 配置模块中编辑相同文件的功能非常相似。由于可以编辑任何文件（而不只是 `.htaccess` 文件），在将此模块交给用户之前，你应该确保系统上的文件权限足够。\
  \ |\n| Change Language | 允许用户更改 Usermin 界面显示的语言。完全无害。 |\n| Change Password | 允许用户更改\
  \ UNIX 密码，可能还可以更改 Samba 密码。由于它使用 `passwd` PAM 服务或 `passwd` 程序，因此适用普通的密码长度规则。只要你的系统配置为执行合理的密码限制，就是安全的。\
  \ |\n| Change Theme | 允许用户更改登录时用于渲染用户界面的主题。此模块没有任何风险。 |\n| Change User Details |\
  \ 此模块允许用户更改其 UNIX 帐户详情，如真实姓名、家庭电话和办公地点。用户还可以更改登录 shell，尽管此功能可以禁用。相对安全，因为你可以将允许的\
  \ shell 限制为 `/etc/shells` 文件中的或其他 shell。 |\n\n\n\n\n\n| **命令 Shell (Command Shell)**\
  \ | 此模块与 Webmin 的 Command Shell 模块相同，不同之处命令是以登录的 Usermin 用户身份运行的。由于可以运行任何命令，你不应将此模块授予那些你不信任具有\
  \ `SSH` 或 `telnet` 访问权限的用户。 |\n| **自定义命令 (Custom Commands)** | 允许用户运行 Webmin 自定义命令模块中定义的命令，但不能创建或编辑他们自己的命令。只要你的命令脚本编写得当，此模块就是安全的。记住，命令可以以其他\
  \ UNIX 用户身份运行，而不仅仅是登录的 Usermin 用户。 |\n| **磁盘配额 (Disk Quotas)** | 此模块允许用户查看他们当前的块和文件配额以及每项的使用量。由于它只显示信息，因此完全无害。\
  \ |\n| **Fetchmail 邮件检索 (Fetchmail Mail Retrieval)** | 使用此模块，用户可以编辑个人的 `.fetchmailrc`\
  \ 文件来设置从其他服务器下载邮件。它还可以用于启动 `Fetchmail` 守护进程以定期检查邮件。由于 `Fetchmail` 可以配置为在连接到邮件服务器之前运行任意命令，因此此模块不应授予任何你不信任具有\
  \ `SSH` 或 `telnet` 访问权限的人。 |\n| **文件管理器 (File Manager)** | 允许用户在符合正常 UNIX 权限的情况下，浏览和编辑系统上的文件和目录。此模块的界面与\
  \ Webmin 文件管理器模块类似，但没有配置文件共享的功能。它可以被配置为限制用户访问其主目录，这使其变得相当安全。 |\n| **GnuPG 加密 (GnuPG\
  \ Encryption)** | 用户可以使用此模块设置 `GnuPG`、管理密钥、加密、解密、签名和验证文件。它是相当安全的，尽管它的某些功能可以用于在符合正常\
  \ UNIX 权限的情况下读取系统上的文件。 |\n| **HTTP 隧道 (HTTP Tunnel)** | 此模块允许系统管理员在 Usermin 中创建一个图标，实际上实际上将用户连接到另一个\
  \ Web 服务器。然而，它不仅仅是链接到某个 URL，所有请求都通过 Usermin 隧道，因此看起来完全不是来自用户的浏览器。从安全的角度来看，它是完全无害的。\
  \ |\n| **登录脚本 (Login Scripts)** | 允许用户编辑 `.profile`、`.login` 和 `.cshrc` 脚本文件，这些文件会在通过\
  \ `telnet`、`SSH` 或在控制台登录时运行。如果用户无法登录，这些文件将永远不会运行，因此该模块是非常安全的（但没用）。然而，如果用户可以登录，那么他仍然运行任意命令。\
  \ |\n| **邮件转发 (Mail Forwarding)** | 此模块允许用户编辑 `.forward` 或 `.qmail` 文件来为他们的地址设置邮件转发。它可以被配置为防止使用程序或向任意文件写入邮件，这使其变得相当安全。\
  \ |\n| **挂载文件系统 (Mount Filesystems)** | 在 Linux 系统上，此模块可用于挂载和卸载在 Webmin 磁盘和网络文件系统模块中设置的文件系统，以便用户挂载。只要你不允许挂载潜在危险的文件系统（例如包含\
  \ `setuid-root` 可执行文件的 `ext2` 格式软盘），它就是安全的。 |\n| **MySQL 数据库 (MySQL Database)**\
  \ | 此模块使用一个与同名 Webmin 模块非常相似的界面，允许用户登录到 `MySQL` 服务器并管理表和记录。它可以被配置为限制用户查看和编辑的数据库，当然，还适用于标准的\
  \ `MySQL` 权限。这使其相当安全。 |\n| **计划文件 (Plan File)** | 当有人使用 `finger` 命令查询用户信息时，用户主目录下的\
  \ `.plan` 文件将会显示。此模块是完全安全的，但如果你的系统 `inetd` 中没有启用 `finger` 服务，它就毫无用处。 |\n| **Procmail\
  \ 邮件过滤器 (Procmail Mail Filter)** | 此模块允许用户编辑其 `.procmailrc` 文件以配置发送到其地址的邮件的投递方式。其界面与该模块的界面完全相同。\
  \ |\n| **读取邮件 (Read Mail)** | 这是一个可能是 Usermin 最强大的模块，允许用户查看和发送邮件。由于它只允许通过 `mail`\
  \ 程序查看特定文件，它是相当安全的。 |\n| **登录脚本 (Login Scripts)** | 允许用户在符合正常 UNIX 权限的情况下查看系统上的进程。它是以登录用户身份运行的。\
  \ |\n| **运行中的进程 (Running Processes)** | 允许用户查看并杀死他们自己的进程。 |\n| **SSH 配置 (SSH Configuration)**\
  \ | 允许用户配置他们的 `.ssh/config` 文件以管理 `SSH`。 |\n| **SSH/Telnet 登录 (SSH/Telnet Login)**\
  \ | 此模块仅允许通过 `SSH` 或 `telnet` 连接。 |\n| **定时命令 (Scheduled Commands)** | 此模块可用于创建和删除\
  \ `At` 任务，这些任务是在特定日期运行的 shell 命令。 |\n| **定时 Cron 任务 (Scheduled Cron Jobs)** | 用户可以使用此模块创建、编辑、删除和运行自己的\
  \ `Cron` 任务。 |\n| **系统文档 (System Documentation)** | 此模块与 Webmin 的系统文档模块相同。由于它只允许查看手册页和其他文档文件，只要文档目录中没有你不人们阅读的文件，它是安全的。\
  \ |\n| **上传和下载 (Upload and Download)** | 此模块允许用户向 Usermin 服务器上的主目录上传多个文件，并将多个 URL\
  \ 下载到 Usermin。 |\n\n你可能想知道允许在你的服务器上运行命令到底有什么危害。原因是，对于 UNIX 系统，能够让普通用户获得 `root` 权限的安全漏洞多于允许网络上其他系统获取\
  \ root 权限的漏洞。任何可以运行命令的用户都可能利用这些漏洞之一，因此尽可能避免。运行命令的用户还可以通过启动浪费资源的进程消耗大量的内存、CPU 时间或网络流量，这可能导致你的系统几乎无法使用。\n\
  \n### 47.18 配置 Usermin 配置模块\n\n此 Webmin 模块只有一个设置，可以通过点击主页上的 `Module Config` 链接进行更改。详见表\
  \ 47.3。\n\n##### 表 47.3. 模块配置选项\n\n| Usermin 配置目录 |\n| --- |\n| 此字段必须包含安装 Usermin\
  \ 时选择的配置目录的完整路径。由于这几乎总是 `/etc/usermin`，因此该字段通常不需要更改。 |\n\n### 47.19 总结\n\n介绍了 Usermin，这是一个与\
  \ Webmin 类似但为普通 UNIX 用户设计的界面。它解释了如何安装 Usermin 以及如何使用 Webmin 模块对其进行配置。阅读本章后，你应该理解如何更改\
  \ Usermin 的各种网络和验证设置、如何安装和删除模块、如何配置这些模块，以及如何控制哪些 UNIX 用户可以登录以及他们可以做什么。\n\n\n\n\n\
  \n# 第 48 章 集群软件管理\n\n本章介绍了 Webmin 的集群系统，并解释了如何使用该模块在多个系统上并发安装软件包。\n\n## 48.1 Webmin\
  \ 集群简介\n\nWebmin 拥有多个模块，可以轻松地在多台机器上同时执行任务。这些机器被称为集群。一个大型组织可能有几十或几百台服务器，需要安装某些软件包、创建\
  \ UNIX 用户或添加 Webmin 模块。集群模块使这些操作变得简单。每个集群模块都对应一个单机模块，但它允许同时在多个系统上执行相同的任务。\n\n要使一个系统成为集群的一部分，必须安装\
  \ Webmin，即使你从未直接登录过它。单机主机上的某个集群模块会使用 Webmin 的 `RPC`（远程过程调用）协议联系所有其他主机，并指示它们执行特定任务。该主主机可能是集群的一部分并指示自己执行相同的任务，也可能完全完全独立的。\n\
  \n在主系统上，必须首先使用 Webmin 服务器索引模块（第 53 章介绍）注册所有其他受管理的服务器。对于每台受管理的服务器，必须指定 root 或 admin\
  \ 用户名和密码，以便主主机知道如何登录。完成后，可以配置每个集群模块来管理部分或全部已注册系统。\n\n由于 Webmin 的 `RPC` 机制允许访问任何文件或在服务器上运行任何命令，默认情况下只有\
  \ `root` 和 `admin` 用户允许在受管理的系统上接收 `RPC` 调用。这意味着在受管理服务器的 Webmin 服务器索引模块中输入其他用户将不起作用，除非该用户被专门配置为接受\
  \ `RPC` 登录。第 52.5 节“编辑模块访问控制”解释了如何进行此设置。\n\n主系统用于控制受管理主机的 `RPC` 协议是 Webmin 特有的，不基于其他类似的协议，例如\
  \ Sun 的 `RPC`、`SOAP` 或 `RMI`。它有两种不同的模式：仅使用 `HTTP` 请求发送命令的旧模式，以及使用永久 `TCP` 连接的较新模式。后一种方法更快、更可靠，但如果防火墙阻止了主主机与受管理主机之间的流量，则可能会失败。它默认使用\
  \ `10001` 及以上的端口，而旧协议仅使用 Webmin 接收普通连接的端口（通常为 `10000`）。第 53 章详细解释了如何为服务器选择模式，而第\
  \ 56 章涵盖了该协议的内部工作原理。\n\n## 48.2 集群软件包模块\n\n此模块允许你同时在多个系统上安装、查看和删除软件包。如果你需要向大量系统发布某些程序，可以使用此模块通过单一操作完成安装。替代方案是在每个主机上手动安装，或者使用\
  \ `NFS` 从单个服务器将程序文件共享给多个客户端。\n\n在继续阅读之前，你应该完全理解普通的“软件包”模块是如何运作的、什么是软件包以及它们能做什么。第\
  \ 12 章详细涵盖了所有这些内容，请现在阅读它。这两个模块的用户界面非常相似，本章的指令假设你已经熟悉普通模块。\n\n集群软件包模块的一个局限性是主系统和所有受管理系统必须使用相同的软件包系统，例如\
  \ `RPM`、`DPKG` 或 `Solaris` 软件包格式。从逻辑上讲，这是合理的，因为如果某些系统不支持该封装格式，那么特定类型的单一软件包文件就无法安装在多个系统上。如果你网络上的主机使用不同的软件包格式，你需要在不同的主机上为每种使用的格式设置一次该模块。\n\
  \n只有在支持软件包系统的操作系统上，该模块才会出现。在编写时，仅支持 `RPM`、`Debian` 软件包格式、`Gentoo` 软件包格式以及 `Solaris`\
  \ 和 `SCO OpenServer` 软件包系统。尽管“软件包”模块支持更多格式，但它们目前无法与此模块配合。\n\n模块本身可以在 Webmin 的“集群”类别下与其他集群相关的模块一起找到。点击其图标将打开主页面，如图\
  \ 48.1 所示。顶部是代表模块中注册的受管理服务器的图标列表，下方是搜索和安装软件包的表单。然而，只有在注册了某些系统后，后表单才会出现，而第一次使用该模块时并这种情况。\n\
  \n##### 图 48.1. 软件包模块。\n\n![](img/48fig01.jpg)\n\n为了加快搜索，该模块保留了其所管理的系统上安装的所有软件包列表。这意味着直接在其中任一个系统上安装或删除的任何软件包在刷新列表之前都不会被检测到。这可能导致模块错误地报告某个软件包存在（而实际上不存在），反之亦然。为了避免这个问题，请始终使用集群软件包模块从受管理主机上添加或删除软件包。\n\
  \n## 48.3 注册服务器\n\n在使用此模块管理另一个系统的软件之前，该系统必须被添加到服务器列表中。要执行此操作，请按照以下步骤进行：\n\n使用 Webmin\
  \ 服务器索引模块添加远程系统，并确保你提供了用户名和密码。但是，如果你想管理主服务器，则不需要执行此操作。\n\n在此模块中，从 `Add server` 按钮附近的菜单中选择系统并点击它。菜单通常会包含特殊项目\
  \ `this server`，即主系统。然而，它绝不会包含任何已经添加的服务器。\n\n你还可以从 `Add servers in group` 旁边的菜单中选择整个服务器组。组也可以在\
  \ Webmin 服务器索引模块中定义。\n\n将显示一个包含所有已添加主机以及每个主机软件包数量的页面。如果无法连接主机或 `RPC` 登录失败，将出现解释该主机出现什么问题的错误消息。\n\
  \n返回模块主页面，现在那里应该列出每个主机的新图标。\n\n添加服务器时出现问题最常见的原因是在 Webmin 服务器索引模块中为该主机输入了错误的用户名或密码。你必须提供\
  \ `root` 或 `admin` 登录，而不是其他用户的登录。如果防火墙阻止了两个主机之间的连接，或者主 Webmin 服务器配置为使用不允许 `RPC HTTP`\
  \ 请求的 `HTTP` 代理，添加操作也会失败。\n\n## 48.4 安装软件包\n\n可以使用集群软件包模块在多个主机上安装软件包，其方式类似于在“软件包”模块中单主机上安装的方式。你应该先阅读第\
  \ 12.3 节“安装新软件包”，该节解释了各种软件包系统在安装方面的差异。\n\n要在多个主机上安装软件包，请遵循以下步骤：\n\n在主页面上，滚动到 `Install\
  \ a New Package` 表单。\n\n\n\n\n\n如果软件包文件已经在主系统上，选择 `From local file`（从本地文件）并在相邻文本框中输入其完整路径。如果某些受管系统使用\
  \ `NFS` 与主系统共享文件，且软件包文件存在同一目录下，则此选项是效率最高的，因为它避免了使用 `RPC` 将文件传输到每个受管主机的需求。相反，远程 Webmin\
  \ 服务器将直接从 `NFS` 挂载的文件系统中读取它。\n\n如果软件包位于运行您浏览器的 PC 上，选择 `From upload files`（从上传文件）并点击\
  \ `Browse`（浏览）按钮选择它。\n\n如果文件位于某个网页或 FTP 站点，选择 `From ftp or http URL`（通过 ftp 或 http\
  \ URL）并在文本框中输入完整 URL。通常，主服务器将下载文件并通过 `RPC` 传输到每个受管主机。如果勾选了 `Each server should re-download\
  \ package box`（每个服务器应重新下载包），每个主机将执行下载，如果 URL 指向本地网络上的 Web 服务器，这种方式效率更高。\n\n点击 `Install`（安装）按钮进入显示软件包下载进度（如有必要）、包名称以及选择安装选项表单页面。这些选项取决于所使用的软件包系统，并在第\
  \ 12 章中有更详细的说明。\n\n默认情况下，软件包将安装在所有受管系统中。但是，您可以通过从 `Server(s) to install on`（安装到的服务器）菜单中进行选择，将其限制为单个系统或组的成员。如果软件包仅适用于某些系统，这将非常有用。您还可以选择没有该软件包的主机，告诉模块跳过对已安装此软件包任何版本的系统的安装尝试。这也可以防止尝试升级。\n\
  \n再次点击 `Install` 继续。这将打开一个显示每个受管主机结果的页面。由于依赖问题或软件包已安装，安装在某个系统上成功而在另一个系统上失败是完全可能的。安装将在所有受管系统上同时进行，因此您无需等待它们一个一个完成。\n\
  \n### 48.5 搜索软件包\n\n此模块可快速搜索所有受管主机上的软件包，因为它在每个系统上都维护着自己的本地已安装软件包列表。按照以下指令搜索并显示软件包详情：\n\
  \n在模块的主页上，在 `Search for package`（搜索软件包）按钮旁的字段中输入搜索术语（如 `mozilla`）。点击按钮后，将出现列出所有匹配软件包的页面，或者如果没有找到，将包含错误消息。如果恰好匹配一个软件包，您将直接进入其编辑页面。\n\
  \n如果有多个软件包匹配，在列表中点击您想要查看的那个名称。这将打开一个编辑页面，显示其完整详情以及安装在每个每个主机上的图标。详情将从第一个安装了该软件包的系统获取，或者在可能的情况下从主服务器获取。\n\
  \n要查看软件包中包含的文件，请从 `List files on`（列出文件于）按钮旁的菜单中选择一个主机。点击它将打开一个页面，显示该主机上软件包中文件的详情，类似于\
  \ `Software Packages`（软件包）模块中的类似列表。\n\n要查看安装该软件包的主机之一的详情，请点击软件包编辑表单上的其图标。这将带您进入第\
  \ 48.7 节“探索和删除服务器”介绍的页面。\n\n在网络中的不同系统上安装同一个软件包的多个不同版本是完全可能的。这会导致软件包详情表变得有些困惑，因为当大多数系统实际上在运行\
  \ `2.0` 版本时，它可能显示的是某些软件包 `1.0` 版本的详情。软件包中的文件列表在不同版本之间，以及来自不同 Linux 发行版的同一程序的不同软件包之间也存在显著差异。\n\
  \n### 48.6 删除软件包\n\n如果不再需要，可以从受管系统中删除已安装的软件包。可以使用 `Software Packages` 模块从一个或所有主机删除软件包。按照第\
  \ 48.5 节“搜索软件包”的说明找到要删除的软件包：\n\n要从单个主机删除，从 `Uninstall` 旁的菜单中选择它。要从所有主机删除，勾选 `<all\
  \ hosts>`。\n\n点击 `Delete`（删除）按钮继续。这将显示一个确认删除。。软件包软件包，可能会包含卸载选项。删除将在所有受管系统上同时进行，以加快速度。将显示一个显示从哪些主机删除结果的页面，指示是否成功或失败的原因。\n\
  \n### 48.7 探索和删除服务器\n\n使用 `Software Packages`，可以查看受管系统及其安装的软件包，如果您的系统具有不同的包集，这将有用。如果不再控制该系统，也可以将其删除。要查看服务器及其软件包，请按照以下步骤：\n\
  \n在模块的主页上点击服务器的图标。这将打开一个显示该主机运行的操作系统以及软件包树的页面。正如 `Software Packages` 模块中一样，您可以点击类别名称来展开并查看它们包含的子类别和软件包。\n\
  \n要查看特定软件包的详情，点击树中的其图标。每个图标链接到第 48.5 节介绍的软件包编辑表单。要从模块列表中删除此系统，点击树上方的 `Remove from\
  \ managed list`。这将仅删除主系统的软件包列表副本，因此删除将不会询问。\n\n### 48.8 刷新软件包列表\n\n如果通过本模块以外的方法在受管系统中安装或删除了软件包，其列表将不再准确。只要之后刷新列表即可。要刷新软件包列表，请按照以下步骤：\n\
  \n点击主页上的 `Refresh package lists`（刷新软件包列表）按钮。\n\n将显示一个来自受管主机结果的页面，列出发现的新包或不再存在的旧包，如果由于原因无法连接系统，将显示错误消息。与安装和删除一样，如果有大量的托管服务器，刷新将并行进行以加快速度。\n\
  \n### 48.9 配置集群软件包模块\n\n此模块只有一个与用户界面相关的设置，如表 48.1 所示，可以通过点击其主页上的 `Module Config`\
  \ 链接进行更改。\n\n#### 表 48.1 模块配置选项\n\n| 按什么排序主机 | 控制 |\n| :--- | :--- |\n| | 控制主机图标在主页和软件包编辑表单上的顺序。选项有：`Hostname`\
  \ 按主机名排序。`Order added` 按添加到此模块的顺序排序。`Description` 按描述排序，如果没有设置描述，则与主机名相同。 |\n\n\
  ### 48.10 总结\n\n\n\n\n\n阅读完本章后，你应该能够从单一界面管理安装在相同类型的多个 UNIX 系统上的软件包。本章已解释了如何添加主机进行管理，以及如何从管理列表中删除这些主机。它还涵盖了同时在多个系统上安装软件包、搜索显示软件包详情以及删除软件包。\n\
  \n# 第 49 章 集群用户管理\n\n在本章中，将介绍用于跨系统管理用户和组的 Webmin 模块。\n\n## 49.1 集群用户组模块\n\n在阅读本章之前，你应该熟悉\
  \ Webmin 的集群管理功能，这在第 48 章的介绍中已经过。所有与集群相关的模块（本模块、集群软件包和集群 Webmin 配置）都使用`Webmin Servers\
  \ Index`模块和 RPC 来控制其他系统。你还应该阅读第 4 章，该章节介绍了用户和组模块，因为集群用户和组模块中的许多表单和页面与该模块相似。\n\n\
  此模块允许你从单一界面管理多个系统上的 UNIX 用户和组。如果你网络中有大量主机，并希望人们能够登录所有主机，则需要某种机制在每个系统上创建 UNIX 账户。使用此模块比在每个系统上手动创建账户要容易得多。\n\
  \n有一种广泛可用且更常用的跨机器管理用户、组和其他服务的方法是 NIS（在第 17 章中介绍）。NIS 客户端系统向主服务器查询信息，并读取它们的 `/etc/passwd`\
  \ 和 `/etc/group` 文件，这使得账户在所有客户端上可用。NIS 运行良好，并且可以在 Webmin 内部轻松地配置，但存在一些缺点。如果主服务器宕机或网络中断，客户端系统将无法查找用户信息，导致登录和许多程序挂起。而且，由于客户端必须频繁查询服务器，它在慢速网络上的表现并不理想。\n\
  \n相反，此 Webmin 模块会更新每个客户端系统上的文件，以便用户和组保持同步。客户端操作系统不需要执行任何特殊操作即可使用中心化管理的用户，它们看起来就像其他用户一样。这意味着，如果用户直接在客户端系统上被修改而不是通过主服务器修改，则可能会发生同步丢失。\n\
  \n该模块相对于 NIS 具备的另一个实用功能是可以在受管理的服务器上创建主目录的能力。如果你的系统没有通过 NFS 共享公共主目录，这将非常有用，因为这在广域网上可能是不切行的。该模块还像本地用户和组模块一样，可以在受管理的服务器上的\
  \ Samba 密码文件或代理身份验证文件中设置用户。如果你的组织有多个 Samba 服务器，每个服务器都有自己的密码列表，那么这将非常方便（尽管 Samba\
  \ 可以配置为向中央服务器查询密码）。\n\n集群用户和组模块要求所有受管理的系统具有相同的用户文件格式。遗憾的是，某些 UNIX 变体仅使用 `/etc/passwd`\
  \ 文件，某些还使用 `/etc/shadow` 文件，而某些 BSD 系统使用 `/etc/master.passwd` 文件存储用户。这些不同格式存储了不同的用户信息，该模块无法处理。结果是，集群不能同时包含\
  \ Linux 和 FreeBSD 系统，或同时包含 Solaris 和 AIX 设备，因为它们使用不同的格式。然而，Linux 和 Solaris 主机网络可以进行中心化管理，因为这两个操作系统都使用\
  \ `/etc/passwd` 和 `/etc/shadow` 文件，这是最常见的格式。\n\n与集群软件包模块（在第 48 章中介绍）一样，本模块在主系统上的每个受管理主机上存储用户和组列表。这加快了搜索和编辑，但引入了主信息可能与受管理主机上的真实用户和组列表不同的可能性。如果用户直接在某个主机上被添加、删除或修改而不是通过此模块，就会发生这种情况。幸运的是，如果发生这种情况，很容易重新同步（使用`Refresh\
  \ user and group lists` 按钮）。每当在受管理的服务器上添加、删除或更新用户时，刷新也会自动发生。\n\n集群用户和组模块可以在 Webmin\
  \ 的集群（Cluster）分类下找到。点击它的图标时，将显示类似于图 49.1 所示的页面。顶部是所有管理服务器的图标，下方是用于查找和添加用户及组的字段和按钮。然而，只有至少注册了一个服务器时，这些字段才会出现。\n\
  \n##### 图 49.1 集群用户和组模块。\n\n![](img/49fig01.jpg)\n\n## 49.2 注册服务器\n\n在使用此模块管理用户和组之前，必须将要管理的系统添加到其服务器列表中。要执行此，请遵循以下步骤：\n\
  \n使用`Webmin Servers Index`模块添加远程系统，并确保提供用户名和密码。如果你想管理主服务器本身，则不需要执行此操作。\n\n在此模块中，从`Add\
  \ server`按钮旁边的菜单中选择系统，然后点击它。菜单通常包含特殊条目`this server`，即主系统。它永远不会包含任何已添加的服务器。\n\n你也可以从`Add\
  \ servers in group`旁边的菜单中选择整个服务器组。组可以在`Webmin Servers Index`模块中定义。\n\n将显示一个显示所有已添加主机以及每个主机上的用户和组数量的页面。如果无法连接主机，或者\
  \ RPC 登录失败，将出现解释该主机出现何错误的错误消息。\n\n返回模块主页，现在那里应该列出每个主机的新图标。\n\n### 49.3 创建新用户\n\n\
  向多个系统添加 UNIX 用户的表单与用户和组模块中本地添加用户的表单几乎完全相同。如果你熟悉该模块，使用这个模块将轻而易举。只需遵循以下步骤：\n\n在模块主页上，点击页面下半部分的`Add\
  \ User`按钮。\n\n像创建本地用户一样填写弹出的用户创建表单。用户 ID（User ID）将默认设置为任何系统上未使用的 ID，因此可能不需要更改。\n\
  \n唯一需要小心的字段是`Primary group`（主组），因为输入的组名对应的组 ID 将主系统中进行查找。所有受管理的主机也应该存在具有相同 ID 的相同组。\n\
  \n辅助组列表包含所有系统的组。如果你选择了一个仅存在于某些主机上的组，则该用户仅会被添加到存在该组的主机上。\n\n末尾有一个标记为`Do above file\
  \ operations`（执行上述文件操作）的字段，决定主目录的创建和文件复制是在集群中的一个主机还是所有主机上执行。如果你的受管理系统通过 NFS 共享主目录，你应该选择`One\
  \ server`，这样它只创建一次。否则，选择`All servers`以便在每个主机上创建用户目录。\n\n如果`Create user in other\
  \ modules`（在其他模块中创建用户）设置为 Yes，则用户将被添加到每个系统的 Samba 密码文件、Squid 用户列表等。\n\n点击`Create`按钮进入显示在每个受管理主机上执行了什么页面（前提是表单没有错误）。如果由于原因某个主机无法连接或登录，该主机将显示错误消息，但所有其他主机都将更新。\n\
  \n\n\n\n\n此过程无法用于向某些主机上已经存在的用户添加用户，因为当你点击 `Create` 时，将显示相应的错误信息。相反，你应该使用第 49.10\
  \ 节“同步用户和组”介绍的模块同步功能，该功能可以将用户详情从一个主机复制到其他主机。\n\n### 49.4 编辑现有用户\n\n在多台服务器上编辑用户比添加用户稍微复杂一些，因为你可以精确控制将更改用户的哪些属性。这是有必要的，因为用户在每个受管系统上的详细信息可能不相同，而你可能希望设置某些属性（如真实姓名），同时保持在不同系统上不同的属性（如\
  \ shell）不变。\n\n出于此原因，图 49.2 所示的用户编辑表单与用户和组模块中的表单相似，但每个字段都多了一个 `Don't change`（不更改）选项。页面顶部显示的主机上该属性的当前值，以便你了解它至少在一个系统上的设置情况。\n\
  \n### 图 49.2. 用户编辑表单。\n\n![](img/49fig02.jpg)\n\n考虑到这一点，你可以按照以下步骤编辑用户：\n\n滚动到主页面上的\
  \ `Find users whose` 表单，该表单用于搜索要编辑的用户。\n\n如果你知道用户名，只需从第一个菜单中选择 `Username`，从第二个菜单中选择\
  \ `equals`，并在第三个文本框中输入名称。点击 `Find` 将弹出该用户的编辑表单（前提是该用户存在）。\n\n如果不是，可以使用该表单查找符合某些标准的用户。从第一个菜单中选择要搜索的属性，从第二个菜单中选择要执行的搜索类型，并在文本字段中输入文本或\
  \ Perl 风格的正则表达式。点击 `Find` 将带你进入列出所有匹配用户的页面，点击其中任意一个将弹出其编辑表单。\n\n一旦进入编辑页面，为你你想要更改的每个字段选择\
  \ `Set to`（设置为）选项，并输入或选择新值。`Username` 字段是一个例外。更改此字段会导致用户在所有受管服务器上被重命名。\n\n由于用户在不同系统上可能是不同辅助组的成员，因此选择其所属的\
  \ `Secondary groups` 字段比用户和组模块中的更为复杂。要保持其辅助组身份不变，请选择 `Don't change`。要将其添加到具有这些组的系统中，请选择\
  \ `Add to groups` 并填写旁边的文本字段。要从其所属的系统组中移除，请选择 `Remove from groups` 并在其文本字段中输入这些组的名称。\n\
  \n在 `Upon save`（保存时）部分，`Do above file operations` 字段决定主目录重命名或文件 UID 更改是针对集群中的单个主机还是所有主机执行。如果你的系统使用\
  \ NFS 共享主目录，你应该选择 `One server`；否则，选择 `All servers`。\n\n如果 `Modify user in other\
  \ modules` 被设置为 `Yes`，则将在每个受管系统中更新 Samba 密码文件、Squid 用户列表等。如果该用户在创建时从未被添加到其他模块，则这是没有必要的且浪费时间的。\n\
  \n要继续对所选用户进行修改，请点击表单底部的 `Save` 按钮。将显示列出该用户所在主机以及所执行操作的页面。连接到特定主机时遇到的任何错误也将显示，以及更新用户时遇到的任何问题（例如该用户在主机上已不存在）。然而，更新一个主机失败不会对其他主机产生影响。\n\
  \n用户编辑表单底部是一个图标列表，每个图标对应用户存在的一个系统。你可以点击其中一个以进入第 49.11 节“列出和删除服务器”介绍的服务器页面。\n\n###\
  \ 49.5 删除用户\n\n从多个系统中删除用户相对较简单。与用户和组模块一样，在删除用户时必须小心，因为他的主目录及其包含的所有内容也将被删除。\n\n删除用户的步骤如下：\n\
  \n1. 首先，调出你想要删除的用户编辑表单，如第 49.7 节“编辑现有组”所解释的。\n2. 点击页面右下角的 `Delete` 按钮进入确认页面。\n3.\
  \ 如果使用 NFS 在你的所有系统之间共享主目录，请在 `Delete home directory if exists` 字段中选择 `One server`。否则，选择\
  \ `All servers` 以强制删除每个系统上的目录。\n4. 若要从每台服务器的 Samba 密码文件中删除用户、删除其邮件文件、移除 Cron 任务等，请在\
  \ `Delete user in other modules` 字段中选择 `Yes`。\n5. 如果你想保留用户的主目录，请点击 `Delete User`。要将其同账户一起删除，请点击\
  \ `Delete User and Home Directory`。无论哪种方式，都会显示列出用户所在的每台服务器、在每个服务器上执行的任务以及遇到的任何错误。\n\
  \n### 49.6 创建新组\n\n将组添加到你所有受管服务器的过程与在用户和组模块中本地添加组的过程相同。只需遵循以下简单步骤：\n\n1. 在模块的主页上，点击\
  \ `Add Group` 按钮。\n2. 像在用户和组模块中一样填写弹出的创建表单。唯一的区别是 `Members` 字段可以包含来自任何受管系统的用户。`Group\
  \ ID` 将自动设置为任何系统上未被使用的 ID。\n3. 点击 `Create` 按钮添加该组。将显示显示模块在更新每个受管服务器时的进度以及遇到的任何问题的页面。在某些系统上添加组失败不会影响其他系统。\n\
  \n一旦创建了组，你就可以创建或编辑用户使其成为该组的主成员。这应该只对在所有受管系统上完全相同的组进行，例如按照上述步骤创建的组。\n\n### 49.7 编辑现有组\n\
  \n编辑组与编辑用户类似，因为你可以选择要更改组的哪些属性。组编辑表单与用户和组模块中的表单相似，但每个字段都有额外的 `Don't change` 和 `Set\
  \ to` 选项。图 49.3 显示了一个示例。\n\n### 图 49.3. 组编辑表单。\n\n![](img/49fig03.jpg)\n\n更改组详情的步骤如下：\n\
  \n如果你知道确切的组名，只需在模块主页的 `Find groups whose` 表单文本字段中输入并点击 `Find` 按钮。不是，可以通过在该表单中选择搜索属性和匹配类型来查找组，就像搜索用户一样。第\
  \ 49.7 节“编辑现有组”解释了更多内容。\n\n在组的编辑页面上，为你你想要更改的任何字段选择 `Set to`。每个 `Don't change` 选项旁边将是页面顶部所示系统的当前值。\n\
  \n`Members` 字段与用户和组模块中组编辑表单上的字段不同，因为组的成员在集群的不同系统上可能不同。你可以选择 `Don't change` 保持成员关系不变，选择\
  \ `Add users` 添加相邻文本字段中输入的用户（如果它们在每个系统上存在），或者选择 `Remove users` 移除指定的用户（如果它们是每个系统上的成员）。\n\
  \n\n\n\n\n`Do above file operations on field` 字段决定了必要的文件组 ID 更改仅在一个受管理的系统中执行，还是在所有系统中执行。如果你的所有主机都有不与\
  \ NFS 共享的独立主目录，或者在 `Change group ID on files?` 字段中选择了 `All files`，则应选择 `All servers`。否则，请坚持\
  \ `One server`。当然，如果不需要更改组 ID，则该选择无关。\n\n点击 `Save` 按钮开始更新组的过程。系统将显示一个页面，列出存在该组的每个系统上执行的任务。如果发生任何错误，将显示在受影响系统的名称下方，但不会阻止其他主机上的组更新。\n\
  \n在组编辑页的底部有一有一个存在该组的系统图标列表，与用户编辑页类似。点击其中一个将带你进入到第 49.11 节“列出和删除服务器”所涵盖的主机表单。\n\n\
  ### 49.8 删除组\n\n删除组比删除用户安全得多，因为不会删除文件。如果该组在任何系统上具有任何主要成员，模块甚至会阻止你删除该组，就像本地系统的普通用户和组模块所做的一样。要删除组，请遵循以下步骤：\n\
  \n1. 使用模块主页上的 `Find groups` 表单进入组编辑页，如第 49.7 节“编辑现有组”所述。\n2. 点击表单下方的 `Delete` 按钮。只要不存在主要成员，将显示一个确认页面，询问你是否确定要删除该组。\n\
  3. 点击 `Delete Group` 按钮继续。按照习惯，将显示删除进度以及在存在该组的每个主机上遇到的任何错误。\n\n### 49.9 刷新用户和组列表\n\
  \n如果在某个受管理的服务器上在没有使用此模块的情况下以任何方式添加或更改了用户或组，其缓存列表将不再准确。这可能导致模块尝试修改或删除不存在的用户，或者在已存在该用户的系统上创建用户。幸运的是，可以按照以下方法重新同步缓存：\n\
  \n1. 点击模块主页底部的 `Refresh user and group lists` 按钮。\n2. 将显示一个列出由模块管理的所有系统的页面，以及每个系统中添加或删除的不在本地缓存中的用户和组的数量。如果由于原因无法访问某个主机，将显示错误消息，但这不会影响其他系统的刷新。\n\
  \n### 49.10 同步用户和组\n\n同步可能是该模块最强大的功能，也是最难使用的功能之一。它可以用于在集群中仅存在于一个系统的用户或组，使其在所有其他系统中也存在。如果某些用户是在此模块之外仅在一个主机上创建的，而你现在希望让他们在所有主机上可用，那么这就非常有用。如果集群添加了新主机，并且你想让它拥有其他系统所有的用户和组，这同样有用。\n\
  \n然而，如果使用不当，同步可能会产生意外且可能有害的影响。例如，简单地同步所有主机上的所有用户是一个糟糕的主意，因为可能会在没有这些用户的主机上触发如 `uucp`\
  \ 和 `squid` 等系统用户的创建。出于此原因，你应该利用 `Only show what would be done?` 字段，在实际应用之前查看模块将对你的同步选择执行什么。\n\
  \n同步功能只会创建新的用户和组，而不会更新已存在项的详细信息。它也不会删除用户或组。相反，它假设一个系统存在的用户与另一个系统存在的用户之间的不匹配表示需要创建用户。然而，该模块用于编辑和删除用户的其他功能可用于更新某些系统上的用户以匹配另一个系统，或删除仅存在于某些系统的用户。\n\
  \n要创建仅存在于某些系统的用户，请遵循以下步骤：\n\n1. 点击模块主页右下角的 `Synchronize` 按钮。这将带你进入图 49.4 所示的表单。\n\
  \n#### 图 49.4 同步表单。\n\n![](img/49fig04.jpg)\n\n`Servers to synchronize` 字段决定哪些系统作为过程的一部分被检查。你可以选择\
  \ `All servers` 同步每个受管理的系统，或者选择 `Selected` 并选择列表中的某些系统。在这种情况下，存在任何系统的指定用户可能会被添加到选定的系统中。\n\
  \n`Users to create` 部分允许你指定要同步的用户。可用选项有：\n\n- `All missing users`：不应始终使用此模式，除非你的所有系统都运行完全相同的操作系统，因为它会同步所有用户，包括\
  \ `squid` 和 `uucp` 等系统用户。\n- `No users`：此选项告诉模块不要同步任何用户，因此什么都不做。\n- `Only users`：当选择此选项时，只有输入在相邻文本字段中的名称的用户才会被考虑同步。如果你确切知道哪些用户需要创建，请使用此选项。\n\
  - `All except users`：此选项应谨慎使用（类似于 `All missing users`），因为它会同步除相邻文本字段中列出的用户之外的所有用户。\n\
  - `Users with UID in range`：此选项告诉模块仅同步 `UID` 在相邻文本字段输入范围内的用户。\n- `Users with primary\
  \ group`：当选择此选项时，模块将仅考虑主组与相邻字段中输入的组名匹配的用户进行同步。\n3. 将 `Groups to create` 设置为 `No\
  \ groups`。\n4. 将 `Only show what would be done?` 字段更改为 `Yes`，以便你可以先进行测试运行。\n5. 如果你的系统通过\
  \ NFS 共享主目录，可以将 `Create home directories?` 和 `Copy files to home directories?` 字段设置为\
  \ `No`，因为用户的目录应该已经存在。然而，如果每个系统都有自己的文件系统，你应该选择 `Yes`，以强制为每个添加的用户创建一个新的空目录。\n6. 为了让新用户添加到创建它们的每个系统的\
  \ Samba 密码文件、Squid 用户列表等，将 `Create user in other modules?` 字段更改为 `Yes`。遗憾的是，因为同步时无法获取用户的未加密密码，Samba\
  \ 用户将无法正确创建。\n7. 点击 `Create Users and Groups` 按钮。将显示列出所有所选系统以及每个系统上需要执行的操作（如果有）的页面。检查以确保只执行你预期的操作。如果主机已拥有所有指定的用户，将显示消息\
  \ `Users and groups are in sync`。\n8. 使用浏览器的后退按钮返回同步表单，并将 `Only show what would\
  \ be done?` 字段更改为 `No`。\n9. 再次点击 `Create Users and Groups` 以实际创建用户。将显示列出所选系统和正在执行的操作的页面，以及发生的任何错误。按照习惯，一个主机的失败不会影响其他主机。\n\
  \n几乎以相同的方式创建组。唯一的区别是你应该将 `Users to create` 字段设置为 `No users`，但在 `Groups to create`\
  \ 部分指定要同步的组。\n\n### 49.11 列出和删除服务器\n\n本节解释了如何查看受管理服务器的信息以及其上的用户和组，或者将其从模块控制的系统列表中删除。要做到这一点，请遵循以下步骤：\n\
  \n\n\n\n\n在模块的主页或用户或组编辑表单上，点击您想要查看的系统图标。这将带您进入一个页面，显示其操作系统，并列出服务器上所有已知用户和组的名称。\n\
  \n要查看或编辑用户的详情，请点击列表中的名称。这将弹出常规的用户编辑表单，但 `Don't change` 选项旁显示的当前属性取自该服务器。您也可以通过点击服务器页面上的组名称来查看和编辑用户组。\n\
  \n若要从此模块的控制中移除该系统，请点击 `Remove from managed list` 按钮。系统不会要求确认，您将立即返回到模块的主页。不过数据不会丢失，因为您可以随时重新添加该系统。\n\
  \n### 49.12 配置集群用户和组模块\n\n与“集群软件软件包”模块一样，此模块仅有一个用户设置，可以通过点击主页上的 `Module Config`\
  \ 链接进行更改。该选项如表 49.1 所示。\n\n#### 表 49.1. 模块配置选项\n\n| 排序主机 | 控制主机图标在主页和软件包编辑表单上的列出顺序。选项有：主机名（按主机名排序）、添加顺序（按添加到此模块的顺序列出）、描述（按描述排序，如果未设置描述，则与主机名相同）。\
  \ |\n\n主服务器上“用户和组”模块中的某些模块设置也会影响此模块的行为。适用的项包括 `Maximum user and group name length`、`Show\
  \ office and phone details?`、`Automatic home directory base`、`Automatic home directory\
  \ style`、`Generate password for new users?`、`Conceal plain-text password?`、`Default\
  \ primary group for new users` 以及 `Password restrictions` 部分中的所有内容。管理系统上“用户和组”模块设置中的新主目录的\
  \ `Permissions` 和 `Copy files into new home directories` 也会被使用。请参阅第 4.12 节“配置用户和组模块”获取所有这些功能的完整解释。\n\
  \n### 49.13 总结\n\n本章解释了如何从主服务器的单一接口管理多个类似系统上的 UNIX 用户和组。阅读后，您应该知道如何定义、添加和删除系统。您还应该知道如何同时在多个系统上创建、编辑和删除用户及组，以及如何同步用户和组，以便集群中某些主机上缺失的用户组被自动创建。\n\
  \n## 第 50 章 集群 Webmin 配置\n\n本章告诉您如何从单一系统管理多个 Webmin 服务器上的用户、组、模块和主题。\n\n### 50.1\
  \ 集群 Webmin 配置模块\n\n在阅读本章之前，您应该熟悉 Webmin 的集群管理功能，这些功能在第 48 章的引言中已介绍。集群类别下的所有模块都利用了\
  \ `Webmin Servers Index` 模块和 `RPC` 来控制其他系统。您应该阅读第 51 和第 52 节，它们分别涵盖了 `Webmin Configuration`\
  \ 和 `Webmin Users` 模块，因为本模块可用于多个系统上执行许多相同的任务。\n\n集群 Webmin 配置模块实际上有两个目的：跨多个系统的 Webmin\
  \ 用户和组的管理，以及模块和主题的安装与删除。如果您的网络中有多个 Webmin 服务器，此模块对于同步它们的用户列表和用户访问控制设置将非常有用。它还提供了一种一次性向大量服务器部署新模块的简单方法。\n\
  \n与第 48 章和第 49 章涵盖的其他集群模块一样，此模块在主系统上保留了每个受管理服务器的模块、主题、用户和组列表。这加快了搜索，但也导致主系统认为的配置与实际配置之间产生不一致的风险。例如，如果您在受管理主机上安装或升级了模块，如第\
  \ 50.10 节“刷新用户和模块列表”所述，在手动刷新之前，主系统将不知道其存在。\n\n当您在 Webmin 主菜单中点击集群类别下的模块图标时，将显示图\
  \ 50.1 所示的主页。顶部是一个图标表格，每个受管理服务器对应一个图标。每个图标下方是当前运行的 Webmin 版本，该版本是在添加到模块或上次刷新时确定的。假设您列出了一些服务器，它们下方是编辑和添加用户及组的表单，随后是更多安装和查找模块及主题的表单。\n\
  \n#### 图 50.1. 集群 Webmin 配置模块。\n\n![](img/50fig01.jpg)\n\n### 50.2 注册服务器\n\n在使用此模块管理另一个运行\
  \ Webmin 的主机之前，必须将其添加到服务器列表中。请按照以下步骤操作：\n\n- 使用 `Webmin Servers Index` 模块添加远程系统，并确保提供用户名和密码。不过，如果您想管理主服务器本身，则无需执行此操作。\n\
  - 在模块中，从 `Add server` 按钮旁边的菜单选择系统并点击它。菜单通常会包含特殊项 `this server`，即主系统本身。它永远不会包含任何已添加的服务器。\n\
  - 您也可以从 `Add servers in group` 旁边的菜单选择整个服务器组。组也可以在 `Webmin Servers Index` 模块中定义。\n\
  - 将显示一个显示所有已添加主机以及每个主机上的模块、主题、Webmin 用户和组数量的页面。如果无法连接主机或 `RPC` 登录失败，将出现解释该主机出错的错误消息。\n\
  - 返回模块主页，现在那里应该列出每个主机的新图标。\n\n### 50.3 创建新的 Webmin 用户\n\n如果您熟悉使用 `Webmin Users`\
  \ 模块创建新的本地用户，那么使用此模块在多个系统上创建新用户应该是很容易的。它使用的表单布局略有不同，但其包含的所有字段含义都是相同的。然而，很少使用的 `Categorize\
  \ modules?` 字段不存在，`SSL certificate name` 字段也不存在，因为跨多个服务器设置它没有意义。\n\n要在所有受管理系统上创建用户，请按照以下步骤操作：\n\
  \n- 点击模块主页上的 `Add User` 按钮弹出创建表单。\n- 像在 `Webmin Users` 模块中那样的填写大部分字段。需要注意的字段将在接下来的几个步骤中解释。\n\
  - `Member of group` 菜单包含所有受管理系统的组，因此某些组可能在某些服务器上不存在。如果用户被添加到没有所选组的系统，则等同于该系统选择了\
  \ `<None>`。\n- 同样，`Personal theme` 菜单包含可能在某些系统上不存在的主题。如果用户被添加到没有所选主题的系统，则等同于选择了\
  \ `Server default`。\n- `Modules` 部分列出了所有服务器的所有可用模块。您可以通过通过 Control 点击或 Shift 点击列表来单独选择模块，或者使用它们下方的\
  \ `Select all`、`Select none` 和 `Invert selection` 链接进行选择。与主题一样，可能选择仅在某些受管理系统上存在或受支持的模块。\n\
  - 填写完表单后，点击底部的 `Create` 按钮。这将打开显示模块尝试向每个受管理服务器添加用户成功或失败的页面。进程完成后，人们就可以使用新账户登录您的任何系统了。\n\
  \n### 50.4 编辑或删除 Webmin 用户\n\n\n\n\n与“集群用户和组”模块一样，在编辑用户时，你可以确切选择要更改哪些属性。这非常有用，因为用户可能是在多个系统上独立创建的，而没有享受到该模块便利，因此在所有系统上的设置可能不相同。例如，你可以更改用户在所有系统上的语言，而不触动其个人主题（个人主题可能根据每台服务器的性能而不同）。\n\
  \n以下步骤允许你编辑 Webmin 用户：\n\n在主页面，从`Edit user`（编辑用户）按钮旁的菜单中选择用户名。点击该按钮将进入类似图 50.2 所示的编辑表单。\n\
  \n##### 图 50.2. 用户编辑页面。\n\n!![](img/50fig02.jpg)\n\n在你想要编辑的每个字段中，选择`Set to`（设置为）并在旁边的文本框或菜单中输入新值`Leave\
  \ unchanged`（保持不变）选项旁边会显示属性的当前值，该值取自表单头部显示的服务器。\n\n唯一的例外是`Username`（用户名）字段，它只是一个文本框，如果你想在存在该用户的系统上重命名该用户，可以对其进行编辑。\n\
  \n`Modules`（模块）部分的工作稍有不同，因为它允许你在所有系统上为用户添加或删除选定的模块。如果用户在不同主机上可以使用不同的模块，而你想授予另一个模块而不干扰已分配的模块，这就会非常有用。该部分的选项适用于不同的主机，且：\n\
  \n- `Leave unchanged`（保持不变）：任何受管理的主机上分配给用户的模块都不会更改。\n- `Only selected modules`（仅所选模块）：将为用户授予所选模块，覆盖其在所有系统上现有的任何模块。使用此选项要小心，因为列表默认不会选中已分配的模块。\n\
  - `Add selected modules`（添加所选模块）：从列表中选择的模块将添加到用户在所有系统上已拥有的模块中。\n- `Remove selected\
  \ modules`（移除所选模块）：如果用户确实拥有选选模块的权限，将将其从所有系统的分配中移除。\n\n与用户创建表单一样，你可以通过点击列表来选择模块，或使用列表下方的链接一次性选择大量。\n\
  \n点击`Save`（保存）按钮开始更新用户进程。系统将显示一个该用户存在的所有主机列表，以及每个主机更新尝试的成功或失败结果。通常，用户修改只有在其中一个受管理的服务器宕或用户已被删除时才会失败。\n\
  \n删除 Webmin 用户更为简单，尽管你应该小心不要在主服务器登录的受管理系统上删除`root`或`admin`用户。与 Webmin 用户模块不同，此模块不会阻止你执行可能搞乱\
  \ Webmin 服务器的操作，例如删除你当前登录的用户。所以，请小心！\n\n要删除用户，请遵循以下步骤：\n\n1. 使用主页面上的`Edit user`按钮调出用户编辑表单。\n\
  2. 点击右下角附近的`Delete`（删除）按钮。用户将立即从其存在的所有系统中移除，且无需确认，随后将显示一个显示每个系统结果的页面。\n\n### 50.5\
  \ 创建新的 Webmin 组\n\n在此模块中在多个服务器上创建组与创建一个组一样，只是模块选择部分略有不同。第 52 章解释了组是什么、如何工作以及用途。要添加组，请遵循以下指令：\n\
  \n1. 点击主页面上的`Add Group`（添加组）按钮调出组创建表单。\n2. 在`GroupName`（组名）字段中输入名称。\n3. 如果组应继承某些其他组的设置，选择`Set\
  \ to`（设置为）并在旁边的菜单中选择一个组，如果不想让它有父组，则选择`None`（无）。\n4. 从`Modules`（模块）列表中，通过点击或使用下方链接选择模块。\n\
  5. 点击`Create`（创建）按钮开始创建组。将显示一个显示成功或失败的页面。一旦添加了组，你就可以在该组存在的所有服务器上使用此模块为其分配用户或组。\n\
  \n### 50.6 编辑或删除 Webmin 组\n\n与用户一样，在编辑组时，你可以确切选择要更改哪些属性。要编辑组，请遵循以下步骤：\n\n1. 从主页面`Edit\
  \ group`（编辑组）按钮旁的菜单中选择该组，然后点击按钮调出该组的编辑表单。\n2. 要更改组名，编辑`GroupName`字段。\n3. 要保持父组不变，为`Parent\
  \ group`（父组）字段选择`Leave unchanged`（保持不变）。否则，选择`Set to`（设置为）并在旁边的菜单中选择一个组，如果不想让它有父组，则选择`None`（无）。\n\
  4. 像编辑用户一样，`Modules`字段中的选项和列表可添加、删除或设置此组的模块。更多细节请参见第 50.4 节“编辑或删除 Webmin 用户”。\n\
  5. 点击页面底部的`Save`（保存）按钮更新该组存在的所有服务器上的组。\n\n删除组与删除用户一样。不要使用组编辑表单上的`Save`按钮，而是点击`Delete`（删除）。该模块将不允许你删除在任何服务器上具有成员用户或组的组。\n\
  \n### 50.7 编辑模块的用户或组 ACL\n\n如第 52 章所解释的，Webmin 用户和组在对特定模块的操作方面可以被进一步限制。这允许你创建一个只能编辑单个\
  \ Apache 虚拟主机或 DNS 域名的用户，但无法使用 Apache Web 服务器或 BIND DNS 服务器模块的其他功能。实际提供的访问控制选项取决于你想要限制的模块，并在该模块的章节中会有详细介绍。\n\
  \nCluster Webmin 服务器模块也可以用于配置特定用户和模块的访问控制，但是一次性针对多个主机，而不仅仅是单个。在执行此之前，你应该熟悉使用 Webmin\
  \ 用户模块在单个系统上限制访问的过程，因为使用的是非常相似的表单。\n\n\n\n为了使模块访问控制在多个系统间生效，每个系统对于受限制模块所管理的服务器配置必须非常相似或完全相同。例如，如果某个特定的\
  \ `BIND` 区域在所有服务器上都不，那么赋予某人该区域的访问权限是没有意义的。遗憾的是，某些模块（如 `Custom Commands`）使用的命令 ID\
  \ 是特定于某个服务器的，因此即使在每个系统中都独立创建了该命令按钮，尝试让用户在多个系统上获得特定命令的访问权限也是不可行的。\n\n若要编辑特定模块中用户或组的访问控制设置，请遵循以下步骤：\n\
  \n在该模块的主页上，从 `Edit ACL for` 按钮旁边的菜单中选择用户和模块。顶部按钮用于用户，底部用于组。点击按钮后，将显示一个根据所选模块而不同的访问控制表单。\n\
  \n按照书中相应章节的说明填写表单。许多表单包含可选的配置对象列表（如虚拟服务器、`DNS` 域名或 `Samba` 共享），即使用户或模块不存在，这些列表也始终从主服务器获取。如果出现以下情况，例如\
  \ `DNS` 区域仅存在于另一个主机，且由于列表是从主服务器获取的未出现在允许访问的区域菜单中，就会导致问题。遗憾的是，目前没有办法避免这种情况。\n\n若要更新所有管理系统中该模块和用户的配置，请点击\
  \ `Save on all hosts` 按钮。你也可以通过 `Save only on this server` 按钮仅更改标题中显示的宿机的设置。无论何种方式，更改将立即应用到该用户或组成员。\n\
  \n有时有必要仅对单个系统编辑访问控制设置，而不是所有系统。你可以通过以下步骤实现这一点：\n\n1. 使用主页上的 `Edit user` 或 `Edit group`\
  \ 按钮打开用户或组的编辑页面。\n2. 表单底部有一个标记为 `Edit ACL for` 的按钮，旁边的菜单列出了该用户拥有访问权限的所有模块以及他存在的主机。选择你想要编辑访问控制设置的模块与主机组合条目，并点击按钮。\n\
  3. 像往常一样填写出现的访问控制表单。遗憾的是，表单上的任何 `Apache` 虚拟服务器、自定义命令或 `DNS` 区域列表都将来自主系统，而不是所选的主机。\n\
  4. 点击 `Save only on this server` 按钮以仅更新所选系统的设置。\n\n### 50.8 安装模块或主题\n\n该模块最实用的功能可能是能够同时在多个系统上安装\
  \ Webmin 模块或主题。在继续阅读之前，请确保你已经阅读了第 51 章中解释主题和模块是什么以及如何将它们安装在单个系统上的章节。在多个主机上安装的过程非常相似，使用的表单几乎完全相同。\n\
  \n可以使用以下步骤包含一个或多个模块和主题的单个 `.wbm` 或 `.wbt` 文件。与 Webmin 配置模块不同，这里没有为它们单独设置页面。\n\n\
  1. 在模块的主页上，找到 `Modules and Themes` 部分右侧的表单。\n2. 如果文件存在主服务器上，选择 `From local file`\
  \ 并在相邻的文本框中输入其完整路径。\n3. 如果文件位于运行浏览器的 PC 上，选择 `From local file` 并点击 `Browse` 选择文件。\n\
  4. 如果文件已在主服务器上，选择 `From master server` 并在相邻的文本框中输入路径。\n5. 如果文件在另一个管理的服务器上，选择 `From\
  \ other server` 并输入文件的主机和路径。\n6. 点击 `Install` 开始安装。该过程将在所有主机上并发进行，并为每个服务器显示一个显示进度页面。\n\
  \n（注：提供的 50.8 节原文文本在后半部分包含重复/乱码的占位符文本；我根据指令的上下文清理了逻辑流。）\n\n### 50.9 查看和删除模块或主题\n\
  \n你可以通过从主页 `Edit module` 或 `Edit theme` 按钮旁边的菜单中选择它们，打开显示已安装模块或主题详情的页面。出现的页面显示模块的名称和目录、支持的操作系统，以及该模块依赖和被依赖的模块。`Edit\
  \ ACL for` 按钮可更改特定用户和系统对模块的访问控制设置。\n\n若要实际删除模块或主题，请遵循以下步骤：\n\n1. 如 50.8 节步骤 1 所示，打开显示详情的页面。\n\
  2. `Uninstall module from` 按钮旁边的菜单决定了从哪些管理主机中移除它。你可以选择所有服务器或特定系统。\n3. 点击按钮显示确认页面，显示要删除的模块或主题以及将被删除的文件大小。然而，如果特定系统上的其他模块依赖于此模块，将显示错误消息解释为何你无法删除它。\n\
  4. 若要取消所有用户的模块访问并将所有访问控制设置恢复默认值，请勾选 `Remove from users and reset access control\
  \ settings` 复选框。\n5. 点击 `Delete` 按钮删除模块或主题。与安装一样，该过程将在所有主机上并发进行，并显示每个主机结果的页面。\n\n\
  ### 50.10 刷新用户和模块列表\n\n如果在管理主机上没有使用此模块就更改了模块、主题、用户或组，则其关于其他系统配置的缓存信息将不再正确。这不会导致任何严重问题，因为模块在更新或删除用户时可以检测到同步问题。\n\
  \n在必要时刷新缓存列表，你可以按照以下步骤操作：\n\n在模块的主页上，点击 `Refresh servers` 按钮。\n\n\n\n\n页面将列出每个受管理的服务器，并显示每个服务器的用户、组、模块和主题列表的更改。如果由于某些原因无法连接系统，将在该系统名称旁边显示一条解释错误的错误消息。\n\
  \n### 50.1 列出和删除服务器\n\n本节解释了如何查看受管理服务器及其上的用户、组和主题信息，或者将其从该模块控制的系统列表中删除。要查看受管理服务器的信息，请遵循以下步骤：\n\
  \n- 点击主页或用户详情表单上的服务器图标。\n- 在弹出的页面上，顶部显示服务器自身的详细信息，紧接着是模块列表，然后是用户和组列表。\n- 所有这些列表中的条目都可以点击，以打开模块详情页、用户表单或组表单。在所有情况下，所选对象的信息都取自该服务器。\n\
  \n要将主机从此模块的控制中删除，请点击 `Remove` 按钮。删除将在无需确认的情况下进行，并将您带返回到模块主页。\n\n### 50.12 配置集群模块\n\
  \n与其他模块一样，此模块只有一个可配置的设置（参见`Table 50.1`），可以通过点击主页上的 `Config` 链接进行更改。\n\n##### 表 50.1\
  \ 模块配置\n\n| 按此排序主机 | 控制 |\n| :--- | :--- |\n| 主机名 | 图标在主页和编辑表单上的显示顺序。 |\n| 添加时间\
  \ | 系统按照它们被添加到此模块的顺序列出。 |\n| 描述 | 系统按描述排序，如果没有设置描述，则与主机名相同。 |\n\n### 50.13 总结\n\n\
  本章解释了如何从单一界面管理多个系统的设置。它涵盖了对服务器上用户和组的同时管理，并解释了如何为这些用户设置详细的访问控制。它还解释了如何从许多服务器上安装或删除模块和主题。\n\
  \n## 第 51 章 Webmin 配置\n\n本章解释了如何使用 Webmin 配置其自身、安装新模块或升级到新版本。\n\n### 51.1 Webmin\
  \ 配置模块\n\n该模块的存在是为了允许 Webmin 自身进行配置，与其他大多数旨在配置其他服务器或服务的模块不同。它允许您执行诸如更改 Webmin 使用的端口、限制连接的客户端地址、更改用户界面使用的主题以及安装新模块等操作。本章解释了如何使用该模块执行这些任务。\n\
  \n当您点击 Webmin 类中的模块图标时，将显示 `Figure 51.1` 所示的图标菜单。可以点击每个图标以显示配置页面，在页面上可以更改某些 Webmin\
  \ 设置。\n\n##### 图 51.1 Webmin 配置模块。\n\n![](img/fig01.jpg)\n\n### 51.2 限制对 Webmin\
  \ 的访问\n\nWebmin 默认接受来自任何 IP 地址的连接。尽管它受密码保护，您也应该限制对合规客户端系统的访问，以防网络外的攻击者尝试登录。若要执行此操作，请遵循以下步骤：\n\
  \n- 点击模块主页上的 `IP Access` 以打开访问控制表单。\n- 选择 `Only allow from listed addresses` 并在文本框中输入主机名、IP\
  \ 地址和网络列表。\n- 网络应带有子掩码输入，例如 `192.168.1.0/255.255.255.0`。您可以通过输入类似 `example.com`\
  \ 的内容允许来自整个 DNS 域的访问，但请注意这并非完全安全，因为攻击者可以伪造 DNS 结果。\n\n通常情况下，Webmin 在启动时仅解析一次您输入的任何主机名。要更改此设置，勾选\
  \ `Resolve hostnames on every request` 框，它会将主机名转换为 IP 地址以进行比较。如果您运行的系统频繁更改 IP 地址但能够更新匹配的\
  \ DNS 记录，这将非常有用。这可能发生在使用 DHCP 的网络上，或者您连接到动态分配地址的 ISP。\n\n要让 Webmin 在决定是否允许客户端时检查\
  \ TCP-wrappers 配置文件 `/etc/hosts.allow` 和 `/etc/hosts.deny`，请开启 `Also check TCPwrappers\
  \ hosts.allow and hosts.deny` 选项。编辑这些文件时使用的服务名称为 `webmin`。\n\n点击 `Save` 按钮激活新的客户端地址限制。\n\
  \n### 51.3 更改端口和地址\n\nWebmin 通常在您系统上所有 IP 地址的端口 `10000` 上监听连接。然而，您可能需要更改端口，也许因为你网络上的防火墙仅允许连接到标准端口\
  \ `80` 和 `443` 的 Web 服务器。由于任何用户运行的服务器都可以使用端口 `10000`，系统上的恶意用户可能会等待 Webmin 关闭，然后在该端口启动他自己的伪造\
  \ Webmin 服务器，从而捕获管理员或 root 密码。出于此原因，您可能希望使用 `1024` 以下的端口（只有以 root 运行的程序才能监听）。如果您的系统有多个网络接口，且您只想允许连接到内部局域网的接口，更改监听的\
  \ IP 地址也可能有用。\n\n使用以下步骤更改端口或地址：\n\n- 点击模块主页上的 `Port and Address` 图标。。\n- 要仅在特定接口地址上监听，选择\
  \ `Listen on IP address` 字段中的第二个选项，并在旁边的文本框中输入 IP。这必须是您主机的真实或虚拟接口之一的地址。\n- 要更改端口，在\
  \ `Listen on port` 字段中输入数字。\n- 点击 `Save` 按钮使用新设置。您的浏览器将重定向到新的端口和地址，您可能需要重新登录。\n\n\
  ### 51.4 设置日志\n\n与大多数 Web 服务器一样，Webmin 可以配置为创建标准 CLF 格式的日志文件，记录它收到的每个请求。它还会创建用户执行的操作日志，例如创建\
  \ DNS 区域或删除 UNIX 组。此操作日志可以可以包含每个操作更改的文件和运行的命令的细节，以便您可以查看 Webmin 在后台执行的操作。\n\n基础日志默认启用，但您可以通过遵循以下步骤进行进一步配置：\n\
  \n- 点击主页上的 `Logging` 图标。\n- 如果选择了 `Disable logging`，则 Webmin 将不会写入任何日志。然而，您应该选择\
  \ `Enable logging` 来激活它。\n- 如果勾选 `Log resolved hostnames` 框，日志文件将包含实际客户端主机名而不是 IP\
  \ 地址。如果您的网络反向 DNS 查询很慢，可能会导致问题，因为每个请求都需要进行一次查询。\n\n为了防止日志文件变得过大，Webmin 可以配置为定期截断它们。要启用此功能，勾选\
  \ `Clear logfiles every` 框并在相邻的文本字段中输入小时数。\n\n要将操作日志限制为特定用户，选择 `Only log actions\
  \ by` 选项并从旁边的列表中选择某些用户。如果大多数用户只能执行您不太关心的任务，而您只想记录由权限更高的管理员执行的操作，这将非常方便。\n\n要将操作日志限制为特定模块，选择\
  \ `Only log actions in` 选项并从列表中选择一个或多个模块。\n\n\n\n\n\n要启用记录每个操作的文件更改和运行的命令，请勾选`Log\
  \ changes made to files by each action`框。这将占用更多磁盘空间，但会提供非常有用且有趣的信息。\n\n点击`Save`按钮以激活更改。\n\
  \n`Webmin Actions Log`模块（在第 54 章中介绍）解释了在在此处启用记录后，如何搜索和查看操作。如果您有多个拥有服务器访问权限的管理员，这对于查找谁在您的系统上执行了什么非常有帮助。\n\
  \n## 51.5 使用代理服务器\n\n许多 Webmin 模块都能够从其他 FTP、HTTP 和 HTTPS 服务器下载文件。例如，`Software Packages`模块允许您输入一个\
  \ URL，并从该 URL 获取并安装新包。Webmin 通常会直接连接到 URL 中指定的主机，但也可以配置为使用代理服务器。如果您的网络不允许直接访问 Web\
  \ 和 FTP 站点，而是强制客户端通过代理进行连接，则可能是有必要的。\n\nWebmin 的 `RPC` 机制（在第 53 章中介绍）也利用了指向其他 Webmin\
  \ 服务器的 HTTP 请求。任何代理配置也适用于 RPC 调用，尽管在快速模式下或传输大文件时，它不会引导 RPC 协议使用的 TCP 连接。由于任何其他 Webmin\
  \ 服务器可能位于同一个网络上，您可能希望禁用对这些主机的代理使用。\n\n要指定 HTTP 和 FTP 代理服务器以及使用它们的主机，请遵循以下步骤：\n\n\
  - 在`Webmin Configuration`模块的主页上，点击`Proxy Servers`图标。\n- 如果想对 HTTP 请求使用代理，请选择`HTTP\
  \ proxy`字段中的第二个单选按钮，并在附近的文本框中输入类似`http://proxy.example.com:8080/`的完整 URL。如果选择`None`，则将不使用代理。指定的服务器还将通过创建`CONNECT`\
  \ 代理请求用于 HTTPS 连接，因此请确保它支持并允许这些请求。\n- 您还可以在`FTP proxy`字段中输入一个用于 FTP 下载的代理。通常这与`HTTP\
  \ proxy`相同。\n- 若要禁用对某些主机的代理使用，请在`No proxy for`字段中填写用空格分隔的主机名、域名和完整或部分的 IP 地址列表。例如，您可能输入`*.example.com\
  \ 192.168.1.*`，让 Webmin 直接连接到该域名和网络中的主机。\n- 如果您的代理需要客户端进行身份验证，请填写`Username for proxy`和`Password\
  \ for proxy`字段。\n- 点击`Save`按钮让 Webmin 开始使用新设置。\n\n## 51.6 配置 Webmin 用户界面\n\nWebmin\
  \ 有若干设置可以控制用户界面的颜色方案（使用旧版 Webmin 主题时）、每个页面上显示的服务器主机信息，以及是否允许发送反馈。您可以通过遵循以下步骤更改它们：\n\
  \n- 在模块的主页上，点击`User Interface`图标调出界面选项表单。\n- 前五个字段允许您在使用旧样式主题时选择界面不同部分使用的颜色。您可以为每个字段选择`Default`，或者为颜色的红、绿、蓝组件输入三个六进制数。例如，`FF\
  \ 88 00`是一种橙色。然而，这些选项对新的默认主题没有影响。\n- 在某些主题中，每个页面顶部的标题是以图像渲染的。由于这会导致页面下载变慢，您可以通过将`Display\
  \ titles as text?`字段更改为`Yes`来强制使用纯 HTML 文字标题。\n- Webmin 中的每个页面默认都会在浏览器状态栏显示您的系统主机名和操作系统。若要在其他地方显示或完全关闭，请从`Display\
  \ login and hostname`菜单中选择以下选项之一：\n    - **At bottom of browser**: 信息显示在浏览器的状态区域，通常位于窗口底部。\n\
  \    - **In browser title**: 信息被添加到每个页面的标题中，通常显示在浏览器窗口标题中。\n    - **Above page heading**:\
  \ 信息显示在每个页面标题上方。\n    - **Nowhere**: 主机名和操作系统信息在处都不显示。如果您担心不可信的用户获取过多关于您的系统的信息，请选择此选项。\n\
  - 当使用默认主题时，Webmin 的每个页面右上角都有一个向开发者发送反馈的链接。您可能希望配置它，将反馈发送给主系统管理员，这样其他用户就可以联系您了。要这样做，请在`Send\
  \ feedback to`字段中输入您的电子邮件地址，并将`Allow sending of feedback?`字段更改为`Only to address\
  \ above`。也可以通过在最后一个字段中选择`No`来完全防止反馈的发送。\n- 点击`Save`按钮激活新的用户界面设置。\n\n## 51.7 安装和删除\
  \ Webmin 模块\n\n正如本书第一章所解释，Webmin 本质上是一个模块集合，每个模块执行某些任务，例如配置 Apache 或管理 UNIX 用户。只要它们不依赖于某个模块，就可以添加或删除该模块而不影响其他的操作。尽管在我写此书时主\
  \ Webmin 分发版包含 76 个模块，但还有 100 多个由他人编写的模块可以从 [webmin.thirdpartymodules.com](http://webmin.thirdpartymodules.com/default.htm)\
  \ 下载。这是一个模块和主题的可搜索数据库，执行核心模块未执行的任务，例如管理 FreeBSD 防火墙、显示系统信息以及连接到 VNC 服务器。\n\n一旦您找到了喜欢的模块，可以按照以下步骤进行安装：\n\
  \n- 在主页上，点击`Webmin Modules`图标。这将带您进入一个带有安装、克隆和删除模块表单的页面。\n- 如果您已经将模块的`.wbm`文件下载到运行\
  \ Webmin 的系统上，选择`From local file`并在旁边的文本字段中输入文件的完整路径。\n- 如果模块文件在运行 Web 浏览器的 PC 上，选择`From\
  \ upload file`并使用`Browse`按钮在计算机上查找文件。\n- 如果模块在某个网站上，选择`From ftp`或`http URL`并在该选项旁边的文本框中输入完整\
  \ URL。\n- 如果该模块依赖的任何其他模块不可用，或者它是为较后的 Webmin 版本编写的，Webmin 通常会停止安装模块。为了防止这种情况，请勾选`Ignore\
  \ module dependencies when installing`框。但这可能允许安装无法运行的模块。它不会允许您添加不支持服务器操作系统的模块。\n\
  - 要控制向谁授予此新模块权限，选择`Grant access only to users and groups`选项并在相邻的文本框中输入 Webmin 用户和组列表。默认情况下，仅列出您当前登录的用户。您也可以通过选择`Grant\
  \ access to all Webmin users`将其授予所有用户和组。\n- 点击`Install module from file`按钮下载（如有必要）并安装新模块。如果一切顺利，将显示一个列出已安装模块及其目录大小的页面。\n\
  \nWebmin 附带了一个名为`install-module.pl`的脚本，可以在安装根目录下找到。如果您安装的是 RPM 版本，它将是 `/usr/libexec/webmin`。否则，它位于`tar.gz`文件解压的任何位置。此脚本可以通过将`.wbt`文件作为参数传递给它从命令行安装模块。它将仅授予\
  \ root 或 admin 用户（如果存在），否则授予`Webmin Users`模块中列出的第一个账户。\n\n\n\n\n\n当前安装的任何模块（包括 Webmin\
  \ 默认自带的模块）都可以在同一页面上删除。然而，删除默认模块并不是好主意，因为它们在您下次升级时会自动重新安装。相反，更好的做法如第 52 节所述，通过 `Webmin\
  \ Users` 模块撤销您不想使用的权限。并不是所有模块都可以删除，因为某些模块是其他模块的依赖项（例如 `Running Processes`）。\n\n\
  要删除一个或多个模块，请遵循以下步骤：\n\n1. 点击主页上的 `Webmin Modules` 图标。\n2. 滚动到页面底部的表单，从 `Delete Modules`\
  \ 列表中选择您想要删除的所有模块。如果克隆模块（后文将介绍）不再需要，也可以删除。删除带有克隆的模块将自动删除这些克隆。\n3. 点击 `Delete selected\
  \ modules` 按钮后，将显示一个确认页面，准确显示将要删除的内容。或者，如果存在依赖问题阻止一个或多个模块的删除，则会显示解释该问题的错误信息。\n4.\
  \ 若要取消所有用户对模块的访问并将所有访问控制设置恢复为默认，请勾选 `Remove from users and reset access control\
  \ settings?` 框。如果您计划以后重新安装该模块，并且不想让以前使用过它的人再次使用，这将非常有用。\n5. 点击 `Delete` 继续删除模块。将显示一个显示具体删除了哪些模块的页面，以及每个模块删除的字节数。\n\
  \n## 51.8 克隆 Webmin 模块\n\n在某些情况下，您可能希望安装两个相同的 Webmin 模块，以便对每个模块进行单独配置。这非常有用，例如，您可能安装了两个版本的\
  \ Apache，一个用于测试，另一个用于生产环境。标准的 Apache 模块只能设置为为一次管理一个，因此似乎配置两个服务器的唯一方法是安装两次 Webmin。\n\
  \n然而，有一个解决方案：模块克隆。克隆是现有模块的副本，它共享所有相同的代码，但可以单独配置、分配给不同的用户，并独立设置其用户访问控制。要创建克隆，请遵循以下步骤：\n\
  \n1. 点击主页上的 `Webmin Modules` 图标。\n2. 进入名为 `Clone Module` 的第二个表单，从 `Module to clone`\
  \ 菜单中选择原始模块。\n3. 在 `Cloned module name` 字段中，输入一个显示在克隆图标下方的新名称，例如 `Testing Apache\
  \ Server`。\n4. 如果您希望此模块出现在与原始模块不同的类别中，请从 `Assign to category` 菜单中选择。\n5. 点击 `Clone\
  \ Module` 按钮。副本将被创建并授予您当前登录的用户，您的浏览器将返回到 `Webmin Configuration` 主页。\n\n您现在可以进入新模块了，默认情况下，它的配置与原始模块完全相同。如果有必要，可以使用\
  \ `Module Config` 链接将其配置为使用不同的配置文件和程序路径。\n\n如果您克隆了像 `Custom Commands` 或 `System\
  \ and Server Status` 这样的模块，任何现有的命令或监控器也将复制到克隆中。如果您愿意，可以删除它们，而不会影响原始模块中的设置。\n\n通过克隆可以执行许多巧妙的技巧，例如为\
  \ `System and Server Status` 模块创建一个在不同计划运行的新副本，为管理 NIS 用户创建一个 `Users and Groups`\
  \ 模块的副本，或者为不同的配置文件创建多个 `Fetchmail` 模块。\n\n### 51.9 更改您的操作系统\n\nWebmin 的行为取决于您安装的操作系统或\
  \ Linux 发行版，以及您运行的特定版本。正确的操作系统始终在安装时自动检测或由安装程序提供，但您的系统在系统生命周期内可能会进行升级。如果发生这种情况，Webmin\
  \ 将不会自动检测升级。您必须通过以下步骤告诉它：\n\n1. 点击模块主页上的 `Operating System and Environment` 图标。\n\
  2. 从 `New operating system` 列表中选择您的 UNIX 供应商和版本。\n3. 点击 `Save` 按钮以让 Webmin 开始使用该设置。\n\
  \n安装时检测到的操作系统和版本决定了模块配置的默认值，因为每种口味的 UNIX 对 Webmin 管理的各种配置文件都使用不同的位置和格式。然而，按照上述步骤更改操作系统不会调整任何这些配置设置。相反，它将仅决定为以后安装的模块使用哪些设置。通常这并不是一个问题，因为大多数操作系统的升级不会更改文件和程序的位置。但是，某些模块在升级后可能需要手动配置。例如，如果旧的操作系统版本使用\
  \ `LPRng` 而新版本使用 `CUPS`，则您可能需要更改 `Printer Administration` 模块所使用的打印系统。\n\n## 51.10\
  \ 编辑程序路径和环境变量\n\n当您从 UNIX shell 运行类似 `ls` 的命令时，`PATH` 环境变量决定了 shell 搜索以查找实际执行文件的目录，例如\
  \ `/bin/ls`。Webmin 也使用 `PATH` 变量在未指定完整路径时定位它运行的命令，例如 `webalizer` 或 `mysql`。默认情况下，此目录列表包含了您操作系统上所有程序的常用位置，但如果您在非标准目录（如\
  \ `/usr/local/samba/bin`）安装了可执行文件，则可能是错误的。\n\n`LD_LIBRARY_PATH` 环境变量也决定了程序运行时查找所需的共享库的位置。同样，Webmin\
  \ 默认设置此变量包含操作系统上所有常用的库目录，但如果您手动编译并安装程序，它可能会漏掉某些。这种迹象是 Webmin 运行的程序报错，错误信息如 `libmysqlclient.so.6:\
  \ open failed`。这样的库可能位于 `/usr/local/mysql/lib`，而该路径不在搜索路径中。\n\n您可以通过以下步骤编辑这些路径并定义传递给所有\
  \ Webmin 运行程序的自定义环境变量：\n\n1. 点击 `Operating System and Environment` 图标。\n2. 在 `Program\
  \ search path` 字段中添加任何额外的程序目录。每个目录必须用冒号（`:`）分隔，就像 `PATH` 环境变量中一样。然而，不应删除或更改现有目录，否则可能会导致\
  \ Webmin 部分功能无法运行。\n3. 在 `Library search path` 字段中添加任何额外的库目录，同样用冒号分隔。\n\n有时让 Webmin\
  \ 向其运行的程序传递其他环境变量是有用的。例如，如果您有多个连接到 Oracle 的自定义命令，您可能希望在运行它们之前恰善设置 `ORACLE_HOME`。`Additional\
  \ environment variables` 表格允许您定义一些，只需在 `Variable name` 下方的第一个空字段中输入名称，并在旁边的 `Value`\
  \ 字段中输入值。像 Webmin 中的大多数表格一样，此表一次只显示一个空行，因此如果您想添加多个变量，则需要保存并重新打开此页面。\n\n设置路径和变量后，点击\
  \ `Save` 按钮以激活它们。\n\n\n\n\n任何由 Webmin 运行的程序都可以访问由 Web 服务器本身设置并传递给组成 Webmin 的 CGI\
  \ 程序的变量。例如，`REMOTE_USER` 包含登录用户的名称，`REMOTE_HOST` 包含客户端 IP 地址。所有的 HTTP 请求头都存储在以 `HTTP_`\
  \ 开头的大写变量中。例如，程序可以在 `HTTP_USER_AGENT` 变量查找有关用户浏览器的信息。\n\n### 51.11 更改 Webmin 的语言\n\
  \n许多 Webmin 模块已经翻译成不同的语言，例如德语和日语。你可以按照以下步骤更改所有用户的默认语言，或者通过 Webmin 用户（Users）模块对单个用户进行更改。然而，并非所有的翻译都是完整的，因此某些消息和标签仍将以英语显示。\n\
  \n点击模块主页上的语言图标。\n\n在弹出的表单中，从 `Display in language` 菜单选择选择用户的首选语言。\n\n某些浏览器（如 `Opera`）可以请求服务器显示用户选择的语言。为了让\
  \ Webmin 尊重此类请求，如果可能，将 `Use language specified by browser?` 字段更改为 `Yes`。如果发送了语言，它将覆盖全局和单个用户的设置。\n\
  \n点击 `Save` 按钮让 Webmin 立即切换到新语言。\n\n许多语言（如中文、日语和俄语）使用标准欧洲字母表中未找到的符号。为了显示这些符号，通常需要在运行访问\
  \ Webmin 浏览器系统上安装特殊字体。某些 Linux 发行版默认包含这些字体，但另一些则不包含，安装它们可能会相当。\n\n### 51.12 编辑主菜单设置\n\
  \n除了适用于所有页面的通用用户界面设置外，某些设置仅控制显示模块图标的主菜单的布局。它们可以用于关闭分类功能、控制系统主机名和操作系统的显示，以及默认将用户直接发送到某个模块等。下述步骤解释了如何更改主菜单设置。\n\
  \n点击 Webmin 配置（Configuration）模块主页上的 `Index Page Options` 图标。\n\n默认情况下，模块图标每行显示四个。如果你更倾向于使用宽屏浏览器窗口，这可能太少了，无法充分利用可用空间。编辑\
  \ `Number of columns` 字段可以更改每行的图标数量。\n\n当 `Categorize modules?` 选项设置为 `Yes` 时，图标将显示在类别下，以减少主菜单中任何页面上显示的数量。当使用默认主题时，选择\
  \ `No` 则将将它们都放在一个大页面上，并移除所有页面顶部的类别列表。\n\n当用户登录 Webmin 时，他默认会在 `Webmin` 类别下看到模块。如果你通常使用其他类别的模块，请从\
  \ `Default` 类别菜单中选择它。\n\n当 `Show version, hostname and OS?` 字段设置为 `Yes`（默认即如此）时，主菜单会显示你的系统\
  \ Webmin 版本、主机名和操作系统。出于安全考虑，如果你不想让用户可以使用这些信息，请选择 `No`。\n\n如果一个 Webmin 用户仅访问一个模块，那么对他来说看到主菜单完全没有意义，因为那里只包含一个图标。要让此类用户在登录后直接重定向到他们唯一的模块，请将\
  \ `Go direct to module if user only has one?` 字段更改为 `Yes`。\n\n点击 `Save` 按钮激活这些新的主菜单设置。\n\
  \n某些非标准主题可能没有实现所有功能，特别是那些拥有自己主菜单的主题。\n\n### 51.13 升级 Webmin\n\n当新版本发布时，Webmin 有能力进行升级，这可以来自你已经下载的文件，也可以来自它从\
  \ [www.webmin.com](http://www.webmin.com/default.htm) 为你获取的包。虽然通过命令行安装最新的 `RPM`\
  \ 或 `tar.gz` 包进行升级是完全可能的，但在该模块内部进行操作甚至更容易且更不容易出错。\n\nWebmin 只能使用与最初安装时相同类型的包进行升级。这意味着，如果你最初使用的是\
  \ `tar.gz` 格式，则只能通过另一个 `tar.gz` 文件进行升级。`RPM` 安装也只能通过较新的 `RPM` 包进行升级。当然，当 Webmin\
  \ 为你下载最新版本时，它将始终选择正确的包格式。\n\n最近发布的版本具有检查 `RPM` 和 `tar.gz` 包上的 GnuPG 数字签名的能力，以确保它们是真实性的。只有当你的系统上安装了\
  \ `gpg` 命令时才能执行此操作，并且在使用 `tar.gz` 包时，仅在直接从 Webmin 网站升级时才有效。签名检查可以防止你安装伪造的 Webmin\
  \ 版本，该版本实际上可能是一个木马或其他类型的恶意程序。\n\n要升级 Webmin，请遵循以下步骤：\n\n点击模块主页上的 `Upgrade Webmin`\
  \ 图标。这将带你进入一个带有升级、安装更新模块和设置自动安装更新表单的页面。\n\n`Upgrade Webmin` 表单与安装模块的表单非常相似，正如第 51.7\
  \ 节“安装和删除 Webmin 模块”所示。如果新包已在服务器系统上，选择 `From local file`；如果它在运行 Web 浏览器的电脑上，选择 `From\
  \ uploaded file`；或者选择 `From ftp or http URL` 来下载包。最简单的选项是选择 `www.webmin.com` 的 `Latest\
  \ version` 自动下载包。\n\n如果你系统上的 Webmin 版本是从 `tar.gz` 文件安装的，可以勾选 `Delete old version's\
  \ directory after upgrade?` 框以便在新版本安装后删除旧版本。除非你想恢复到旧版本，否则应启用此选项以节省磁盘空间。`RPM` 安装不会出现此选项，因为\
  \ `RPM` 包始终安装在相同目录。\n\n要验证包的 GnuPG 签名，如果可能，开启 `Check GnuPG signature on package?`\
  \ 选项。如果系统上安装了 `gpg` 程序，该选项默认启用。\n\n点击 `Upgrade Webmin` 按钮开始升级。将显示一个下载进度（如有必要）以及新版本\
  \ `setup.sh` 脚本输出的页面。如果你运行的版本晚于要安装的版本，或者无法访问 [www.webmin.com](http://www.webmin.com/default.htm)，则将显示错误消息。\n\
  \n### 51.14 为 Webmin 安装更新\n\n\n\n\n最新版本中 Webmin 模块的更新通常是为了修复漏洞或安全问题而提供的。安装这些更新模块始终是一个好主意，因为它们可能会修复你一直遇到的问题，或者修补可能允许不受信任用户获取系统\
  \ root 权限的安全漏洞。更新的设计始终是为了解决问题，而不是添加新功能，因为新功能本身可能存在自己的问题。\n\n当然，如果你没有遇到任何问题，也可以等等到下一个完整发布版本并安装它。每个版本都将包含针对之前的\
  \ Webmin 版本发布的所有更新。更新仅为解决最新版本中的问题而创建，因此如果你运行的是旧版本，不要期望该版本还会发布更多更新。[www.webmin.com/updates.html](http://www.webmin.com/updates.html)\
  \ 页面列出了每个 Webmin 版本可下载的更新。你可以从那里获取任何需要的更新并使用此模块进行安装，如第 51.7 节“安装和删除 Webmin 模块”所述。然而，有一种更简单的方法。可以让\
  \ Webmin 检查、下载并安装它尚未拥任何更新。这可以通过显式地使用此模块完成，也可以设置为按计划执行。\n\n## 检查并安装更新\n\n要检查并安装更新，请遵循以下步骤：\n\
  \n1. 点击 `Webmin Configuration` 模块主页上的 `Update Webmin` 图标。\n2. 滚动到第二个表单，标题为 `Upgrade\
  \ modules now`。\n3. 选择 `Update from www.webmin.com` 选项。另一种 `Update from another\
  \ source` 模式仅在你运行自己的新模块仓库时才有用，本书并未涵盖该内容。\n4. 如果你只想查看需要哪些更新而无需实际安装，请勾选 `Only show\
  \ which modules would be updated` 复选框。否则，取消勾选它以实际执行更新。\n5. 如果你删除了一些标准的 Webmin 模块且不希望更新过程重新安装它们，请取消选择\
  \ `Install modules that are not currently installed` 选项。\n6. 点击 `Update Modules`\
  \ 按钮。将显示一个列出你操作系统所有更新的页面，以及它们修复的问题。只要第 4 步中的复选框没有勾选，就会显示每个所需模块的下载进度及其安装结果。\n\n如果有新的\
  \ Webmin 版本，页面末尾会出现一条消息通知你。由于模块更新仅针对最新版本发布，建议尽快升级整个程序。\n\n每个 Webmin 模块都有一个版本号，更新过程利用它来跟踪哪些模块已经下载并安装。在潜在更新旁边显示类似\
  \ `Module cron is already up to date` 的消息表示它已经安装。类似 `Update to module cron is not\
  \ related to this OS` 的消息意味着该模块不支持你的操作系统，或者该更新修复的问题并未在你的 `OS` 上发生。\n\n与其偶尔手动遵循上述步骤，你也可以配置\
  \ Webmin 按计划检查、报告并安装新模块。当发现需要更新的内容时，可以向你发送一封邮件，列出应该安装或已经安装的模块以及它们修复的问题。如果有新的 Webmin\
  \ 版本，邮件中还将包含可用性通知。\n\n## 启用自动更新\n\n要启用自动更新，请遵循以下步骤：\n\n1. 点击 `Update Webmin` 图标并滚动到页面底部标题为\
  \ `Update modules on schedule` 的表单。\n2. 勾选 `Scheduled updating currently enabled`\
  \ 复选框。\n3. 除非你运行自己的仓库，否则选择 `Update from www.webmin.com`。\n4. `Update modules at`\
  \ 字段指定了运行计划更新检查的时间。通常你应该输入类似 `3` 的数字，以便在凌晨 3 点进行更新，假设你的系统在该时间是开启的。\n5. 旁边的 `every`\
  \ 字段设置了检查之间的天数。例如，如果你输入 `3`，则每三天执行一次更新。`1` 或 `2` 天通常是一个合理的周期。\n6. 如果启用了 `Only show\
  \ which modules would be updated` 选项，将计划发送一份仅显示需要更新模块的报告。如果你希望被提醒有新模块，但想自己手动安装以控制使用哪些更新，这将非常有用。\n\
  7. `Install modules that are not currently installed` 选项与 `Update modules now` 表单中的含义完全相同，通常不需要启用。\n\
  8. 如果勾选了 `Only report updates`，如果没有需要的更新且没有发布新的 Webmin 版本，则不会发送邮件报告。这通常是你想要的，因为它减少了不必要的邮件数量。\n\
  9. 在 `Email update report to` 字段中，输入发送更新报告的地址。如果留空，仍然会进行自动检查，只是不报告。邮件始终通过调用 `sendmail`\
  \ 程序发送，其路径取自 `Sendmail Configuration` 模块的配置。\n10. 点击 `Save and Apply` 按钮启用计划更新。将创建一个\
  \ `Cron` 任务（第 10 章涵盖），你可以在 `Schedule Cron Jobs` 模块中看到它，但不应触动它。\n\n你可以随时通过取消此表单上的\
  \ `Scheduled updating currently enabled` 复选框并点击 `Save and Apply` 来关闭自动更新。\n\n###\
  \ 51.15 配置验证\n\nWebmin 有多个选项可以控制如何处理多次登录失败、用户如何登录以及如何检查 UNIX 密码。默认验证方法使用 cookie，但如果你的浏览器无法处理，你可能希望切换到基础\
  \ HTTP 验证。这种方法的唯一问题是无法正常注销，因为 HTTP 协议不支持注销。然而，有时必须使用。例如，MacOS X 上的浏览器无法使用 cookie\
  \ 认证从 Web 服务器加载 applet（如 `File Manager` 和 `SSH/Telnet Login` 模块中的程序）。\n\n要为 Webmin\
  \ 配置验证，请遵循以下步骤：\n\n1. 点击模块主页上的 `Authentication` 图标打开验证表单。\n2. 当选择 `Enable password\
  \ timeouts` 时，Webmin 将检测来自同一 IP 地址的多次登录尝试，并锁定该主机一段可配置的时间。此功能应始终开启，因为它能阻止攻击者使用数百万次登录尝试猜测你的系统密码。`Block\
  \ hosts with more than` 字段指定了触发锁定之前从单个主机允许的登录次数，而 `failed logins for` 字段设置了主机锁定的秒数。默认值是合理的，但如果你非常疑虑，可以增加超时时间。\n\
  3. 当选择 `Log blocked hosts, logins and authentication failures to syslog` 时，当用户登录、注销或输入错误密码时，Webmin\
  \ 将向系统日志发送消息（第 13 章涵盖）。所有消息都通过 `authpriv` 设施发送。你应该保持此选项开启，以便检测到异常大量的登录失败。\n4. 当选择\
  \ `Enable session authentication` 时，Webmin 将使用自己的登录表单向用户索用户名和密码，并在登录完成后设置 cookie\
  \ 以识别已验证的客户端。要切换到普通的 HTTP 验证，请选择 `Disable session authentication`。\n\n\n\n\n在使用会话认证时，Webmin\
  \ 可以配置为在用户空闲超过特定时间后自动注出。要启用此功能，请勾选 `Auto-logout after`（超时自动注出）框，并在旁边的文本框中输入分钟数。在使用\
  \ HTTP 认证时，此功能及后续三个功能不可。\n\n当勾选 `Offer to remember login permanently?`（是否永久记住登录？）（默认勾选），登录表单将包含一个永久记住登录的选框。选中后，发送到用户浏览器的\
  \ cookie 将被标记为即使浏览器关闭并稍后重新运行也应保存。这非常方便，意味着用户无需再次登录 Webmin，但你可能认为这是一个安全风险。如果是这样，取消勾选此框将从登录表单中移除“记住”选项。\n\
  \n登录页面默认会在用户名和密码字段上方的消息中包含 URL 中的主机名。要隐藏它，请取消勾选 `Show hostname on login screen?`（在登录屏幕上显示主机名？）框。\n\
  \n有些人喜欢在用户首次访问登录页面时显示欢迎消息，也许提供有关服务器的信息，或告知未经授权人员离开。要在你的系统中启用此功能，请先创建一个包含你想显示的消息的\
  \ HTML 页面。然后选择 `Show pre-login file`（显示登录前文件），并在文本框中输入该 HTML 文件的完整路径。用户阅读后，必须重新加载或重新访问该页面（例如通过页面中的链接）才能强制显示真正的登录表单。\n\
  \nWebmin 可以通过确定是哪个 UNIX 用户正在建立连接，并检查是否存在同名的 Webmin 用户来自动认证来自 `localhost` 的连接。要启用此功能，选择\
  \ `Allow login without password for matching users from localhost`（允许来自本地匹配用户的无密码登录）。如果你在运行\
  \ Webmin 的同一系统上以 root 身份运行浏览器，并且有一个名为 `root` 的 Webmin 用户，此功能允许你访问 `http://localhost:10000/`\
  \ 而无需输入用户名和密码即可登录。这很方便，但如果攻击者可以欺骗程序（如 `Squid`）连接到该 URL，则可能是不安全的，因为这将允许以程序运行身份的用户身份访问\
  \ Webmin。出于此原因，默认选中了 `Always require username and password`（始终要求用户名和密码）。\n\n当在 Webmin\
  \ 用户模块中为用户选择 UNIX 认证选项时，可以使用 `PAM` 或直接读取 UNIX 密码文件来检查其密码。如果启用了 `Use PAM for UNIX\
  \ authentication`（在 UNIX 认证中使用 PAM）选项且安装了 `Authen::PAM` Perl 模块，Webmin 将尝试使用 `PAM`\
  \ 来验证用户。然而在 Linux 上，只有在正确设置了 `/etc/pam.d/webmin` 服务文件的情况下此才会生效。该文件包含在 Webmin 的 RPM\
  \ 软件包中。\n\n如果你的操作系统不支持 `PAM`、未安装 Perl 模块，或者选择了 `Never use PAM for UNIX authentication`（从不在\
  \ UNIX 认证中使用中使用 PAM）选项，Webmin 将退回到直接读取密码文件。这样更可靠，但无法防止使用被标记为过期的密码。`read users and\
  \ passwords from file` 字段指定了获取密码的文件以及用于用户名和密码的列，但很少需要更改，因为它们默认被设置为匹配你的操作系统。\n\n\
  由于 Webmin 会在可能的情况下使用 `PAM`，或者在 `PAM` 不可用时读取相应的密码文件，因此此步骤中涵盖的字段通常不需要更改。\n\n`External\
  \ squid-style authentication program`（外部 squid 风格认证程序）字段可以用于输入验证密码的程序的完整路径和参数。如果填写了该字段，Webmin\
  \ 用户模块中用户的密码菜单将出现 `External authentication program`（外部认证程序）选项，表示该用户的密码应使用此命令进行检查。程序的行为必须与\
  \ Squid 的外部认证器完全一致，详见第 44.9 节“设置代理认证”。\n\n最后，点击表单底部的 `Save`（保存）按钮以激活后续登录的新型认证设置。\n\
  \n### 51.16 编辑类别和移动模块\n\n每个 Webmin 模块都有一个类别，用于控制它在模块主菜单上的显示位置。你可以创建自己的类别，并将模块从默认位置移动到你自己的或现有的类别中，如果你不喜欢默认安排或想将所有内容都放在一个大类别中，这将非常有用。\n\
  \n要创建新类别或重命名现有类别，请遵循以下步骤：\n\n（注：此处原文在列表格式略有中断，已根据逻辑重新对齐）\n\n要创建新类别或重命名现有类别，请遵循以下步骤：\n\
  \n1. 点击模块主页上的 `Edit Categories`（编辑类别）显示类别编辑页面。\n2. 要添加类别，向下滚动到表单底部。在 `ID` 下方的第一个空字段中为你的新类别输入唯一的内部名称，例如\
  \ `stuff`。然后，在旁边的 `Displayed description`（显示描述）字段中输入在 Webmin 中显示的名称，例如 `Thirdparty`。\n\
  3. 你已添加的现有类别可以通过更改此部分中的字段进行编辑。然而，你不应更改 `ID` 列中的条目，因为它们在内部用于将模块与类别关联。无论如何，`ID` 对用户来说都是不可见的，只有显示描述是可见的。\n\
  4. 要更改表单顶部显示的默认类别之一的名称，选择旁边的第二个单选按钮，并在右侧文本框中输入新描述。如果选择 `Default`（默认），将使用由当前语言确定的标准名称。\n\
  5. 点击表单底部的 `Save Categories`（保存类别）按钮激活新类别。你现在可以将模块移动到你创建的任何类别。\n\n要更改模块所属的类别，请执行以下操作：\n\
  \n1. 点击主页上的 `Reassign Modules`（重新分配模块）图标。\n2. 出现的页面列出了所有已安装的 Webmin 模块及其当前所在的的类别。对于你想要移动的模块，从其名称旁边的菜单中选择新类别。\n\
  3. 点击页面底部的 `Change Categories`（更改类别）按钮移动模块。\n\n### 51.17 更改和安装主题\n\n主题是 Webmin 的扩展（类似于模块），用于控制其界面的外观。当前激活的主题决定了每个页面顶部类别的显示方式及如何显示、使用什么页面背景、每个模块拥有什么图标、标题如何显示以及每个页面的结束方式。通过更改主题，你可以显著改变\
  \ Webmin 的外观而不影响其功能。默认包含了几种主题，你还可以安装由其他开发者编写的更多主题。\n\n像语言设置一样，你可以设置该模块中所有登录的主题，或在\
  \ Webmin 用户模块中为特定用户覆盖设置。要更改所有人的主题，请遵循以下步骤：\n\n1. 点击模块主页上的 `Webmin Themes`（Webmin\
  \ 主题）图标。这将进入更改主题、安装新主题和删除现有主题的页面。\n2. 从 `Current theme`（当前主题）菜单中选择要使用的主题。与 Webmin\
  \ 标的主题包括：\n\n- **Old Webmin Theme**（旧版 Webmin 主题）：在添加主题之前 Webmin 版本使用的非常简单的主题。如果你发现默认主题太慢，这可能是一个更好的替代方案，因为它使用的图像较少。\n\
  - **Caldera Theme**（Caldera 主题）：一种改进的布局，使用框架将类别和模块图标放在顶部，将实际表单和页面放在底部。\n- **MSC.Linux\
  \ Theme**：当前的默认 Webmin 主题。\n- **MSC.Linux Mini Theme**（MSC.Linux 迷型主题）：默认主题的修改版本，设计用于\
  \ PDA 等小屏幕设备。\n3. 点击 `Change`（更改）按钮激活所选主题。\n\n其他人员开发的新主题也可以添加到 Webmin 中，可以从 [webmin.thirdpartymodules.com](http://webmin.thirdpartymodules.com/default.htm)\
  \ 下载多个。你也可以编写自己的主题，正如第 58 节所解释的那样。\n\n\n\n\n要安装主题，请遵循以下步骤：\n\n点击模块主页上的 `Webmin Themes`\
  \ 图标。\n\n使用第二个表单选择主题文件。与安装模块时一样，你可以选择从运行 Webmin 的系统文件、浏览器所在的 PC、或者 HTTP 或 FTP URL\
  \ 下载安装主题。\n\n点击 `Install Theme` 按钮进行下载（如需要）并安装。\n\n在此页面上，你可以执行的最后项操作是删除一个已安装的主题。`Old\
  \ Webmin Theme` 无法删除，因为它内置在程序中，其他标准主题也不应删除，因为当你升级到下一个版本时，它们会被重新添加。\n\n要删除你安装的主题，请遵循以下说明：\n\
  \n点击模块主页上的 `Webmin Themes` 图标。\n\n在页面底部的 `Theme to delete` 菜单中选择要移除的主题。如果该菜单没有出现，说明所有已安装的主题都被单个用户或所有人使用。\n\
  \n点击 `Delete` 按钮将弹出确认页面，询问你是否确定要继续。\n\n再次点击 `Delete` 以移除该主题。\n\n### 51.18 引用来源检查\
  \ (Referrer Checking)\n\n使用像 Webmin 这样基于 Web 的管理界面时，一个危险是是来自另一个网站的链接可能会指向你 Webmin\
  \ 服务器上的某个程序。例如，恶意网站可能包含如下 HTML 代码：\n\n```\n<a href=http://localhost:10000/proc/run.cgi?cmd=rm+*>click\
  \ me</a>\n```\n\n点击这个看似无害的链接会导致 Webmin 的 `Running Processes` 模块运行一个删除你系统上文件的命令！假设你已经登录了\
  \ Webmin，则不需要密码。更糟糕的是，类似的 URL 也可以用于 `<img>` 标签中的图片，只要你打开一个看似无害的页面，浏览器就会自动抓取它。\n\n\
  幸运的是，这有一个解决方案。大多数浏览器会在 HTTP 请求中发送链接来源所在页面的完整 URL。默认情况下，Webmin 会将此 URL 中的主机名与访问当前页面使用的主机名进行比较，如果不匹配则显示警告。这阻止了从其他网站到你\
  \ Webmin 服务器的链接，但那些未指定程序的链接（例如 `http://localhost:10000/cron/*`）除外，它们安全的。\n\n然而，有时你可能想要允许此类链接，例如来自你维护并信任的内部内网\
  \ Web 服务器的链接。因此，可以配置 Webmin 允许引用来源来自信任主机列表的链接。以下步骤解释了如何操作。\n\n点击模块主页上的 `Trusted\
  \ Referrer` 图标。\n\n要完全关闭引用来源检查（这不是个好主意），将 `Referer checking enabled?` 字段更改为 `No`。\n\
  \n要允许来自某些主机的链接，在 `Trusted websites` 字段中填写主机列表，例如 `intranet.example.com`。\n\n在某些情况下，浏览器不会提供任何引用来源信息，可能因为它不支持该\
  \ HTTP 功能。当勾选 `Trust links from unknown referrers` 复选框时，Webmin 将允许此类请求。如果你非常多疑并知道你的浏览器总是提供引用来源信息，请关闭此选项。\n\
  \n点击 `Save` 按钮激活设置。\n\nWebmin 并不会简单地拒绝来自不可信网站的链接。相反，它会显示警告并给用户继续访问链接的机会。此警告表单包含一个标记为\
  \ `Don't show this warning in future` 的复选框，如果选中，有效地会将 `Referrer checking enabled?`\
  \ 字段更改为 `No`。\n\n### 51.19 允许对模块进行身份验证访问\n\n可以设置某些 Webmin 模块，使其仅能用于查看信息或执行无害命令。例如，`System\
  \ and Server Status` 模块的访问控制功能可以设置为赋予用户只读权限，让他们查看哪些监控器处于运行状态，哪些已关闭。`Custom Commands`\
  \ 模块也可以为特定用户配置，使其仅运行显示信息的命令。\n\n该模块的匿名访问功能允许你在客户端无需登录的情况下授予某些模块的访问权限。此类客户端将被视为指定的\
  \ `Webmin` 用户，因此将仅拥有你授予该用户的权限。然而，在访问你系统上允许的模块时，他们永远不需要提供用户名和密码。这对于让网络上的所有人都能某些信息（如服务器状态显示）而无需为他们提供用户名和密码非常有用。但是，必须极其谨慎使用，因为授予高级用户匿名访问可能会危及整个系统。\n\
  \n要为某些模块设置非身份验证访问，请遵循以下步骤：\n\n首先，使用 `Webmin Users` 模块创建一个名为 `anonymous` 的用户（例如），赋予你想提供给未验证客户端的模块和访问控制设置。其密码可以设置为\
  \ `No login allowed`，因为该用户永远不会通过传统方式登录。应给予该用户 `Old Webmin Theme`，以减少以后需要允许访问的图像目录数量。\n\
  \n然后，点击 `Webmin Configuration` 模块中的 `Anonymous Module Access` 图标。出现的表单包含一个两列的表格，初始有两个空行。每行指定了服务器上一个允许非身份验证访问的\
  \ URL 路径，以及处理该路径请求时应视为哪个 `Webmin` 用户。\n\n在第一行中，路径输入 `/images`，用户输入 `anonymous`，这样未验证的客户端就可以访问包含\
  \ Webmin 标题图片的目录。\n\n在第二行中，输入你想允许的模块路径（例如 `/status`），再次将 `anonymous` 作为用户。永远不要输入路径为\
  \ `/`，因为这将允许未经授权地访问你的整个 Webmin 服务器！特定 CGI 程序的路径（例如 `/custom/run.cgi`）在某些情况下可能是有意义的。\n\
  \n点击 `Save` 按钮开启匿名访问。如果你想允许两个以上的 URL 路径，再次点击该图标，以便表格重新显示并带有两个空行。\n\n如果已登录的用户访问了通过上述步骤允许访问的模块，Webmin\
  \ 仍然会将其正确识别为已登录用户。\n\n### 51.20 开启 SSL\n\n第 3 章“Securing Your Webmin Server”详细解释了什么是\
  \ SSL、为什么要使用它以及在 Webmin 使用它之前需要哪些库。该模块中的 `SSL Encryption` 页面用于开启或关闭 SSL 模式或生成另一个密钥。\n\
  \n### 51.21 设置证书机构 (Certificate Authority)\n\n如第 52 章所示，可以使用 `Webmin Users` 模块为用户请求客户端\
  \ SSL 证书。但在在此之前，你必须将你的系统设置为证书机构 (CA)。权威机构基本上是一个 SSL 证书，可以用于签署新发的客户端证书，并验证客户端提供的证书来自此\
  \ CA。\n\n由于客户端 SSL 身份验证只能在 SSL 模式下使用，在继续之前 Webmin 必须在该模式下运行并安装 `openssl` 命令。满足这些要求后，按照以下步骤设置\
  \ CA。\n\n点击模块主页上的 `Certificate Authority` 图标，打开输入新 CA 详细信息的表单。\n\n在 `Authority name`\
  \ 字段中，输入颁发证书员员，例如 `Network administrator`。\n\n在 `Email address` 字段中，输入此服务器管理员的地址，例如\
  \ `bob@foo.com`。\n\n在 `Department` 字段中，输入服务器所在的组织子部门，例如 `Accounting`。如果没有意义（例如对于家庭服务器），可以留空。\n\
  \n\n\n在 `Organization` 字段中，输入您的公司或组织名称，例如 `Foo Corporation`。同样，这在某些情况下可能没有意义，因此可以留空。\n\
  \n在 `State` 字段中填写您的服务器所在的州份名称，例如 `California`。\n\n在 `Country code` 字段中填写您国家的双字母大写代码，例如\
  \ `AU`。\n\n点击 `Setup certificate authority` 按钮生成 CA 证书并配置 Webmin 使用它。如果你之前执行过此操作，任何现有的证书都将被覆盖。\n\
  \nWebmin 用户现在可以使用 `Webmin Users` 模块生成个人证书。遗憾的是，一旦有一个用户拥有证书，Web 服务器就会要求所有客户端都提供证书，这可能会导致某些旧版浏览器中仍配置为用户名和密码身份验证的用户出现烦恼的对话框。\n\
  \n如果你已经拥有一个 PEM 格式的 CA（私钥和证书都在同一个文件中），可以配置 Webmin 使用它而不是生成它自己的。只需转到证书机构页面，将其粘贴到\
  \ `Edit CA certificate` 字段中，然后点击 `Save` 即可。\n\n若要完全停止使用 CA 验证客户端，请点击同一页面上的 `Shutdown\
  \ certificate authority` 按钮。所有用户将被迫强制恢复到用户名和密码身份验证。\n\n### 51.22 总结\n\n本章解释了如何使用\
  \ Webmin 进行自身配置，而不是使用其他服务器或服务。阅读后，你应该理解如何执行此类任务，例如更改 Web 服务器监听的端口、安装和删除模块、切换主题、在类别之间移动模块等。\n\
  \n## 第 52 章 Webmin 访问控制\n\n本章将告诉你如何创建只能访问某些模块的新 Webmin 用户，以及如何精确限制用户在每个模块中可以的操作。\n\
  \n### 52.1 Webmin 用户、组和权限简介\n\n标准的开箱即用 Webmin 安装只有一个用户（称为 `root` 或 `admin`），他可以使用每个模块的每个功能。对于仅供单人家庭或办公室系统，这正是你所需要的了。即使你的系统有多个用户，可能也只有一个人需要执行系统管理任务。\n\
  \n然而，在许多情况下，管理员可能希望让某些人访问 Webmin 功能子集。例如，你组织中可能有一个人的工作是创建和编辑 DNS 区域和记录。在普通的 UNIX\
  \ 系统上，必须赋予此人 `root` 权限，以便他可以编辑区域文件并在时重启 DNS 服务器。遗憾的是，一旦有人能够以 `root` 身份登录，他就拥有了系统的完全控制权，并可以随心所欲。\n\
  \nWebmin 通过允许创建额外的用户来解决此类问题，这些用户可以登录只能访问少数模块。你可以进一步限制用户在每个模块内可以的操作，以免他滥用这些功能来执行他不应执行的操作。因为即使由受限制用户使用，Webmin\
  \ 仍然以全 `root` 权限运行，因此它仍然可以访问所需的所有配置文件和命令。\n\n你可以设置的某些访问控制限制示例包括：\n\n- 创建一个用户，其有权仅编辑他拥有的少数\
  \ Apache 虚拟服务器中的指令。无法编辑其他虚拟主机中的全局设置或指令。\n- 允许用户仅访问一个 MySQL 数据库，而不允许访问其他数据库或用户权限。PostgreSQL\
  \ 也可以设置类似的访问控制。\n- 赋予用户编辑和创建特定范围内的具有 UID 的 UNIX 用户的权限，且其家目录位于受限目录之下。`root` 或 `bin`\
  \ 等重要系统用户无法被编辑甚至无法查看。\n- 允许用户访问 Squid 访问控制列表，但不允许访问其他功能。允许用户应用其配置更改，但不允许启动或停止代理服务器。\n\
  - 创建自定义命令，然后赋予用户运行其中某些命令的权限，但不允许创建或编辑任何命令。\n- 允许用户在 Printer Administration 模块中查看和取消打印作业，但不编辑或创建实际打印机。\n\
  \n在不赋予整个系统 `root` 权限的情况下，许多此类权限无法通过命令行工具授予。即使是像 `sudo` 这样的程序，在允许用户编辑文件部分内容或使用特定参数运行命令方面也是受到限制的。\n\
  \n然而，在向不受信任的 Webmin 用户授予访问时必须非常小心，因为访问控制配置中的微小错误也可能允许用户编辑你系统上的任意文件或以 `root` 身份运行命令。攻击者只需要一个微小的漏洞就能溜入并获得你系统的完全控制权。Webmin\
  \ 的访问控制能力赋予了你锁定用户的力量，但前提是使用得当。\n\n尽管可以创建一个只能访问自己的电子邮件、主目录和密码的用户，但 Webmin 并不总是提供这种单用户\
  \ Web 界面的最佳方法。更优的程序是 `Usermin`，它由同一作者开发，并共享了大部分 Webmin 代码和用户界面。它的设计旨在让每个 UNIX 用户只能访问他在命令行上可以访问的内容，例如他的电子邮件、主目录文件和\
  \ GnuPG 配置。Usermin 以登录用户的权限运行其大部分代码，因此用户做不该做的事（甚至获得 `root` 权限）的可能性要小得多。请参阅第 47 章“Usermin\
  \ 配置”获取更多关于如何在 Webmin 内部管理 Usermin 的详细信息。\n\n### 52.2 Webmin Users 模块\n\n如果你想创建、编辑或为\
  \ Webmin 用户或组授予权限，必须在此模块中完成。当你从 Webmin 类别进入它时，主页显示系统上所有的用户和组以及他们访问的模块，如图 52.1 所示。如果用户是某个组的成员，将显示他的成员身份以及那些并非来自组的模块。\n\
  \n#### 图 52.1. Webmin Users 模块。\n\n![](img/52fig01.jpg)\n\n在普通的 Webmin 系统上，只有你登录时使用的\
  \ `root` 或 `admin` 用户会显示，并拥有你操作系统上支持的所有模块。\n\n### 52.3 创建新的 Webmin 用户\n\n如果你想创建一个可以登录\
  \ Webmin 的新用户（可能具有有限权限），则必须在此模块中创建。要执行此操作，请使用以下步骤：\n\n- 在模块主页上，点击现有用户列表上方或下方的 `Create\
  \ a new Webmin user` 链接。这将显示图 52.2 所示的表。\n\n#### 图 52.2. 创建新的 Webmin 用户。\n\n![](img/52fig02.jpg)\n\
  \n- 在 `Username` 字段中输入登录名称。该名称不能被任何其他用户或组占用。\n- 要让用户成为组的一部分，请从 `Member of group`\
  \ 字段中选择。除了你在此页面选择的模块外，该组拥有的任何模块也将授予该用户，且该组中的任何访问控制限制也将适用于该用户。\n- 参见第 52.6 节“创建和编辑\
  \ Webmin 组”获取关于向列表添加新组的信息。\n- 要给用户设置普通密码，从 `Password` 字段的菜单中选择 `Set to` 并将其输入到相邻字段中。\n\
  - 如果新用户与 UNIX 用户同名，你可以选择 `UNIX authentication` 让 Webmin 使用 PAM 或读取 `/etc/shadow`\
  \ 文件来验证用户。\n- 要防止用户完全登录，选择 `No password accepted`。在创建一个具有有限权限的用户时，这可能是一个好主意，这样在你完成其访问限制之前，他无法登录。\n\
  \n\n\n\n\n要让 Webmin 为用户使用与全局默认不同的语言，请从 `Language` 字段菜单中选择一个。\n\n在大多数主题中，Webmin 主页上的模块图标显示在类别下。如果此新用户将仅被授予少数模块的访问权限，则这没有必要，你可以将\
  \ `Categorize modules?` 字段更改为 `No`。\n\n要让 Webmin 用户界面使用不同的主题进行显示，请在 `Personal theme`\
  \ 字段中进行设置。\n\n要限制新用户登录 Webmin 的地址，请将 `IP access control` 字段更改为 `Only allow listed\
  \ addresses`。然后，在旁边的文本框中填写主机名、IP 地址、网络/子掩码对或通配符主机名（如 `*.foo.com`）。\n\n注意，这些限制仅在通过\
  \ `Webmin Configuration` 模块中设置的任何全局 IP 访问控制通过才会进行检查。\n\n在 `Modules` 部分选择你希望该用户访问的所有模块。\n\
  \n完成后，点击 `Save` 按钮创建新用户。你将返回到模块的主页，他将立即登录。\n\n要进一步限制新用户在你已授予权限的每个模块中所能的操作，请参阅第 52.5\
  \ 节“编辑模块访问控制”。\n\n你可以通过模块的克隆功能加速创建与现有具有相同属性和访问权限的新用户的过程。要克隆用户，请遵循以下步骤：\n\n1. 在模块主页上点击你想要克隆的现有用户的用户名。\n\
  2. 点击编辑表单底部的 `Clone` 按钮。这将带你进入图 52.2 所示的创建表单，但大多数字段已根据原始用户的属性填充完毕。\n3. 填写 `Username`\
  \ 字段并设置 `Password`，因为这些字段不会从克隆的用户处复制。你也可以调整其他任何字段中的值。\n4. 完成后，点击 `Create` 按钮。新用户将获得一份来自原始用户的所有模块访问控制设置的副本，但如果将来更改了原始用户，这些设置将不会更新。\n\
  \n如果你想创建许多具有相同模块访问权限和访问控制设置的用户，最好创建一个组并将用户分配给该组。这样，你只需要通过编辑组就可以一次性更改所有成员的设置。\n\n\
  ### 52.4 编辑 Webmin 用户\n\n你可以使用此模块更改 Webmin 用户的用户名、密码、语言或任何其他属性（包括你当前登录的用户）。要编辑用户，请遵循以下步骤：\n\
  \n1. 在模块主页上点击他的用户名。这将带你进入一个与图 52.2 所示类似的编辑表单。\n2. 默认情况下，密码将保持不变。要编辑密码，请从 `Password`\
  \ 字段菜单中选择 `Set to` 并在字段中输入新密码。\n3. 更改表单上的任何其他字段，如第 52.3 节“创建新的 Webmin 用户”中解释的那样。你甚至可以将用户移动到另一个组，这将导致他失去原组中所有模块的访问权限，并需要获得新组中模块的访问权限。\n\
  4. 如果你正在编辑自己，Webmin 将不允许你取消对 `Webmin Users` 模块的访问。这是为了防止你把自己锁定在模块之外，导致无法重新给自己授予访问权限。\n\
  5. 完成后，点击 `Save` 按钮立即应用更改。如果更改了用户名或密码，且用户当前已登录且 Webmin 不处于会话验证模式，则该用户必须重新登录。\n\n\
  你可以通过点击编辑表单底部的 `Delete` 按钮来删除用户，这也会立即生效。Webmin 不允许你删除自己。\n\n### 52.5 编辑模块访问控制\n\n\
  许多 Webmin 模块允许你进一步限制每个用户使用它们时可以的操作。实际的访问控制选项每个模块都不同，并在涵盖这些模块的章节的“Module Access Control”部分中有详细说明。本节仅描述了你需要遵循的通用流程，以配置用户（或组）对特定模块可以执行的操作。要控制模块访问，请遵循以下步骤：\n\
  \n1. 在 `Webmin Users` 主页上，找到你想限制的用户或组，并点击其名称旁你想要编辑限制的模块名称。这将显示访问控制编辑表单，图 52.3 显示了该表单的示例。该截图来自\
  \ `Users and Groups` 模块，因此如果你选择了不同的模块，可用选项将不相同。\n\n#### 图 52.3. Users and Groups\
  \ 的模块访问控制表。\n\n![](img/52fig03.jpg)\n\n要阻止用户更改模块配置，将 `Can edit module configuration?`\
  \ 字段设置为 `No`。这应该始终这样做，因为在大多数模块中，配置设置可以被更改以允许用户获得 root 权限或其他规避你所设置的访问控制限制。\n\n更改表单上的其他选项以你所需的任何方式限制用户。本书涵盖的每个模块在其章节中都有一个部分详细解释了这些字段的含义，并提供了如何设置常见类型访问控制的示例。\n\
  \n点击 `Save` 按钮使你的更改立即生效并返回模块主页。\n\n并不是所有模块都允许你限制用户可以执行的操作，因为这将没有任何意义。例如，`Software\
  \ Packages` 模块不允许配置访问控制限制。它的首要目的是安装新包，任何有安装包权限的用户都可以构建并安装自己的一个可以赋予其 root 权限的包。在这些类模块中，访问控制表单上只出现\
  \ `Can edit module configuration?` 选项。对于除此项外没有其他选项的模块，涵盖它们的书籍章节中没有“Module Access\
  \ Control”部分。\n\n在模块列表的开头，每个用户旁边都有名为 `Global ACL` 的条目。如果你点击它，将带你进入一个访问控制表单，允许编辑适用于所有模块的限制。字段及其含义如下：\n\
  \n- **Root directory for file chooser**：Webmin 中有许多输入文件或目录名称的字段，在大多数字段旁边都有一个按钮可以弹出一个简单的文件选择器窗口。用户将无法使用此文件选择器列出你输入到此字段的任何路径之外的目录。默认，它设置为\
  \ `/`，因此可以浏览整个文件系统。此选项仅控制可以使用文件选择器浏览哪些目录。除非模块有自己的访问控制限制，否则用户仍然手动在文件名字段中输入任意路径。\n\
  - **Users visible in user chooser**：在大多数 Webmin 模块中，当显示用户名字段时，旁边有一个按钮可以弹出一个窗口来选择单个或多个用户。此选项允许你控制哪些用户出现在弹出窗口中，因此特定的\
  \ Webmin 用户无法看到你系统上所有的 UNIX 用户。此访问控制选项无法阻止用户手动输入他选择的任何用户名，它只是限制了弹出窗口中显示的列表。\n- **Groups\
  \ visible in group chooser**：此选项的工作原理与上述选项完全相同，但适用于弹出的组选择窗口。\n- **Can send feedback\
  \ email?**：使用默认启用的 Webmin 主题时，每个页面右上角都会出现 `Feedback` 按钮。将此选项更改为 `No` 将移除该按钮，而更改为\
  \ `Yes`（但通过配置文件更改）将防止用户在勾选 `Include module configuration in email` 选项时发送反馈。\n\n\n\
  \n\n\n由于默认所有反馈都会发送给 Webmin 的作者，因此对于主管理员以外的用户，禁用此功能是有合理的。\n\n可以接受 RPC 调用吗？Webmin\
  \ 拥有自己的 `RPC`（远程过程调用）机制，该机制被集群模块、系统和服务器状态模块以及模块使用。任何向 Webmin 服务器发出 `RPC` 调用的客户端程序必须先使用\
  \ 浏览器客户端以普通用户身份登录。然而，RPC 客户端可以访问 Webmin 的所有功能、编辑任意文件并以 `root` 身份执行命令，无论任何访问控制设置如何。因此，对于没有\
  \ Webmin 完全访问权限的用户，应将此选项设置为 `No`（否）。\n\n默认值为 `Only for root or admin`（仅限 root 或\
  \ admin），这意味着只有用户名为 `root` 或 `admin` 时，才能用于 RPC 登录。由于 `root` 和 `admin` 用户通常具有 Webmin\
  \ 的完全访问权限，因此这不属于安全问题。但如果你使用这两个名称之一创建了一个新用户，并仅授予其有限的 Webmin 权限，请确保将此选项设置为 `No`。\n\
  \n对于几乎所有的 Webmin 用户，即使是那些仅被授予某些模块有限访问权限的用户，默认的全局 ACL 选项也能正常工作，无需更改。\n\n### 52.6\
  \ 创建和编辑 Webmin 组\n\n如果你想创建大量用户，并让他们都访问相同的模块且具有相同的访问控制选项，最佳解决方案是创建一个 Webmin 组。与用户一样，组拥有可用\
  \ Webmin 模块的访问权限，并在这些模块中拥有访问控制权限。如果你更改了某个组的可用模块或权限，所有成员用户的相应设置也会随之更改。\n\n组本身可以是另一个组的成员，并从中继承所有允许的模块和访问控制设置。如果父组发生任何变化，这些更改将传递到所有成员组及其成员用户。你可以创建的组嵌套层数没有限制。\n\
  \n要创建一个新组，请按照以下步骤操作：\n\n在 Webmin 用户模块的主页上，点击页面底部 Webmin Groups 部分附近的 `Create a new\
  \ Webmin group`（创建新 Webmin 组）链接。这将带你进入图 52.4 所示的组创建表单。\n\n##### 图 52.4. Webmin 组创建表单。\n\
  \n![](img/52fig04.jpg)\n\n在 `Group name` 字段中填写一个未被其他现有用户或组使用的唯一名称。\n\n要使此新组成为现有组的成员，请从\
  \ `Member of group`（所属组）菜单中选择它。\n\n从 `Members' modules` 列表中选择你希望该组成员访问的所有模块。来自任何父组的模块将自动包含在。\n\
  \n点击 `Save`（保存）按钮创建新组，你的浏览器将返回模块的主页。\n\n通过点击主页上组名称旁边的模块名称，为该组成员配置访问控制设置，具体方法如第 52.5\
  \ 节“编辑模块访问控制”所述。\n\n你现在可以创建新的 Webmin 用户或编辑现有用户以使其成为新组的成员。\n\n一旦创建了组，可以通过点击模块主页 Webmin\
  \ Groups 表格下的组名称对其进行编辑。这将带你进入组编辑表单，你可以在使用 `Save` 按钮应用更改之前更改其任何属性。或者，你也可以使用 `Delete`（删除）按钮完全删除该组，只要它没有任何成员用户或组。\n\
  \n### 52.7 请求客户端 SSL 密钥\n\n用户通常通过用户名和密码向 Webmin 进行身份验证。然而，如果他们运行 SSL 模式并使用如 IE 或\
  \ Netscape 等现代浏览器，则可以设置 Webmin 通过客户端 SSL 密钥对它们进行身份验证。通常，SSL Web 服务器会将证书发送给客户端用于身份验证，但该协议也允许客户端将其证书发送给服务器。\n\
  \n这种方法的优点是不再需要记住用户名和密码，并且可以禁用旧的身份验证方法，只有带有 SSL 密钥的客户端才能连接。因此，攻击者无法通过猜测你的密码或在你输入时窥视屏幕来侵入。某些浏览器甚至支持将\
  \ SSL 密钥存储在可移动的智能卡上，这更加安全。\n\n在颁发客户端密钥之前，Webmin 必须切换到 SSL 模式并生成证书机构密钥。这两个主题在第 51\
  \ 章中都有涵盖。完成后，请求密钥的步骤如下：\n\n使用应存储密钥的浏览器以你想要创建密钥的用户身份登录 Webmin。浏览器会保留客户端密钥列表，通常由某些密码保护，该密码仅在第一次需要密钥时必须输入一次。通常可以将密钥导出到同类型的其他浏览器。\n\
  \n进入 Webmin 用户模块，点击页面底部的 `Request an SSL Certificate`（请求 SSL 证书）图标。\n\n出现的表单取决于你运行的是\
  \ Internet Explorer 还是 Netscape。以下指令适用于 Netscape 和 Mozilla，因为它们是 UNIX 系统上常用的浏览器。\n\
  \n在 `Your name`（你的姓名）字段中输入名称，例如 `Joe Bloggs`。\n\n在 `Email address`（电子邮件）字段中输入邮箱，例如\
  \ `joe@example.com`。\n\n如果你的 Webmin 系统位于公司或组织网络，请填写 `Department`（部门）和 `Organization`（组织）字段。否则，可以留空。\n\
  \n在 `State`（州）字段中输入系统所在的州，例如 `California`。\n\n在 `Country code`（国家代码）字段中输入两个字母的国家代码，例如\
  \ `US`。\n\n从 `Key size` 菜单选择将创建的 SSL 密钥位数。数字越高越安全，但验证时间越长。1024 位对任何人来说都足够安全。\n\n\
  点击 `Issue Certificate`（颁发证书）按钮。你的浏览器应该弹出一个窗口显示密钥生成进度，这是在客户端系统中完成的。完成后发送回 Webmin，将显示成功页面。\n\
  \n点击 `pick up your certificate`（获取你的证书）链接将新生成的已签名密钥存储在你的浏览器中。浏览器可能会要求你输入密码以保护你的证书。\n\
  \n要测试一切是否运行正常，请退出 Webmin 并关闭浏览器。然后重新运行它并尝试连接。登录页面应该被跳过并显示主菜单。浏览器状态栏中的你的用户名旁边应出现\
  \ `SSL certified` 字样。\n\n一旦 SSL 客户端身份验证正常工作，你可能不再希望客户端能够通过用户名和密码登录此 Webmin 用户。要强制执行，进入\
  \ Webmin 用户模块，点击你的用户名，在 `Password` 菜单中选择 `No password accepted`（不接受密码），并点击 `Save`。\n\
  \n### 52.8 查看并断开会话\n\n当 Webmin 处于会话身份验证模式（默认如此）时，它会跟踪所有登录的用户。你可以按照以下步骤查看这些信息并取消无效的会话：\n\
  \n点击 Webmin 用户模块主页底部的 `View Login Sessions`（查看登录会话）图标。\n\n在出现的页面上将列出每个活动会话的 ID、登录名称和连接时间，最近的排在前。由于许多人没有正确退出\
  \ Webmin，同一个用户可能会存在多个会话。然而，旧会话将在一周后自动删除。\n\n要查看特定会话执行的操作，点击最后一列的 `View logs`（查看日志）链接。这将带你进入\
  \ Webmin 操作日志模块的操作列表，该模块见第 54 章。\n\n要取消会话，点击其 `ID`。这将立即注销用户，但不会杀死 Webmin 当前正在运行的任何\
  \ CGI 程序。\n\n### 52.9 模块访问控制\n\n\n\n\n\n有趣的是，Webmin 用户（Users）模块有自己的一套访问控制选项，这些选项可以确定特定的\
  \ Webmin 用户可以编辑哪些其他用户。这通常用于赋予子管理员创建和编辑部分 Webmin 用户的权限，并授予他们对少数模块的访问权限。要设置此类访问权限，请按照以下步骤操作：\n\
  \n在 Webmin 用户模块中，点击您想要限制的子管理员旁边的 `Webmin Users`。\n\n将 `Can edit module configuration?`（可以编辑模块配置吗？）更改为\
  \ `No`。\n\n将 `Users who can be edited`（可以编辑的用户）选项设置为 `Selected users`（选定的用户），并选择您希望子管理员编辑的账户。\n\
  \n将 `Can grant access`（可以授予权限）字段更改为 `Selected modules`（选定的模块），并从列表中选择管理员允许授予新用户或编辑用户的模块。选择子管理员无法访问的模块没有意义。\n\
  \n将 `Can rename users?`（可以重命名用户吗？）、`Can edit module access control?`（可以编辑模块访问控制吗？）、`Can\
  \ request certificate?`（可以请求证书吗？）、`Can configure user synchronization?`（可以配置用户同步吗？）、`Can\
  \ configure UNIX authentication?`（可以配置 UNIX 认证吗？）、`Can view and cancel login sessions?`（可以查看并取消登录会吗？）以及\
  \ `Can edit groups?`（可以编辑组吗？）更改为 `No`。所有其他是/否字段均可设置为 `Yes`。\n\n将 `Newly created\
  \ users get`（新创建的用户获得）字段更改为 `Same module access control as creator`（与创建者相同的模块控制）。由于子管理员不允许编辑他授予其他用户的模块控制设置，他们将始终获得与他相同的设置。\n\
  \n要强制所有新及编辑的用户成为单个组的成员，将 `Can assign users to groups`（可以将用户分配到组）字段更改为 `Selected`\
  \ 并从提供的列表中选择组。要防止子管理员选择任何组，请选择 `<None>`选项。允许创建必须属于已设置相应限制模块和权限组的用户对您可能是有意义的。如果是这样，您不应从第\
  \ 4 步的列表中选择任何模块，这样创建的用户只能使用该组中的模块。\n\n点击 `Save` 按钮返回模块主页。\n\n如果您没有强制所有新用户成为特定组的成员，请确保子管理员在其他模块中的访问控制设置已正确设置。他创建任何新用户将继承这些设置。\n\
  \nWebmin 用户访问控制设置还可以配置为允许用户更改自己的某些设置，但不能编辑其他用户或授予自己额外权限。要设置此项，请按照以下步骤操作：\n\n点击您希望授予其编辑权限的用户或组名称旁边的\
  \ `Webmin Users`。自然地，该用户必须已经被授予了该模块的访问。\n\n将 `Can edit module configuration?` 更改为\
  \ `No`。\n\n将 `Users who can be edited` 选项设置为 `This user`（此用户）。\n\n将 `Can grant access`\
  \ 字段设置为 `Selected modules`，但不要从提供的列表中选择任何项。这将防止用户向自己授予任何额外的模块访问权限。\n\n将 `Can request\
  \ certificate?`（可以请求证书吗？）、`Can change language?`（可以更改语言吗？）、`Can change categorization?`（可以更改分类吗？）以及\
  \ `Can change personal theme?`（可以更改个人主题吗？）更改为 `Yes`，所有其他是/否字段均设置为 `No`。\n\n将 `Can\
  \ edit groups?` 更改为 `No` 并将 `Can assign users to groups?` 设置为 `Selected`，但不要从列表中选择任何项。\n\
  \n最后，点击 `Save`。该 Webmin 用户现在能够使用该模块仅更改自己的密码、语言、主题和分类模式，并请求客户端 SSL 证书。\n\n### 52.10\
  \ 配置 Webmin 用户模块\n\nWebmin 用户模块有几个选项，可以通过点击主页上的 `Module Config` 链接进行配置。可编辑字段及其含义如表\
  \ 52.1 所示。\n\n##### 表 52.1. 模块配置选项\n\n| 字段 | 描述 |\n| :--- | :--- |\n| Display user\
  \ modules in（显示用户模块的方式） | 默认，此选项设置为 `Table`（表格），这告诉 Webmin 在主页上每个名称旁边显示授予每个用户或组的所有模块。但在用户很多的系统中，这可能会导致页面巨大且难以导航，这就是为什么存在\
  \ `Pulldown`（下拉菜单）选项的原因。如果选中，每个用户旁边将显示一个模块菜单，以及一个编辑所选模块访问控制设置的按钮。 |\n| Sort users\
  \ and groups by（按...排序用户和组） | 当选择 `Order in file`（文件顺序）时，主页上的用户和组按它们被添加到 Webmin\
  \ 的顺序显示。然而，如果选择 `Name`（名称），它们将按用户或组名称的字母排序。 |\n\n### 52.11 总结\n\n本章向您展示了如何设置 Webmin\
  \ 更高级的访问控制功能，例如创建多个用户账户以及限制用户在某些模块中的访问。它还解释了如何定义组以便将设置轻松应用到许多用户，如何断开用户会话，以及如何请求\
  \ SSL 密钥以避免输入用户名和密码登录 Webmin。不过，许多用户不需要使用此模块，因为默认的 Webmin 配置包含一个对所有模块具有完全访问权限 root\
  \ 或 admin 账户。\n\n## 第 53 章 Webmin 服务器\n\n在本章中介绍了列出网络上其他服务器的 Webmin 模块，并记录了它与集群（Cluster）模块以及\
  \ `RPC` 的关系。\n\n### 53.1 Webmin 服务器索引模块\n\n该模块实际上有两个用途，一个是简单的，另一个是非常复杂的。您可以使用它来创建网络上运行\
  \ Webmin 的其他系统的主索引，每个系统都显示为一个图标，您可以点击它链接到该服务器。每个图标可以是普通链接，也可以是一个“隧道”，允许自动登录到另一台服务器并将所有流量通过第一个系统发送。\n\
  \n该模块还可以用于定义通过 `System and Server Status` 模块以及 `Cluster` 类别中的模块由主 Webmin 服务器控制的系统。这些其他系统每一个都必须安装\
  \ Webmin，并且主服务器使用特殊的 `RPC`（远程过程调用）协议与从机进行通信和控制。这所有操作的运作原理在本章中进行了详细解释。\n\n当您点击 Webmin\
  \ 类别中该模块的图标时，将显示如图 53.1 所示的页面。页面大部分由一个图标表格占据，每个图标代表您添加的每一个其他服务器。当然，如果是第一次使用该模块，最初不会出现任何服务器图标。在页面底部有用于在本地局域网上自动查找其他\
  \ Webmin 服务器的按钮。\n\n##### 图 53.1. Webmin 服务器索引模块。\n\n![](img/53fig01.jpg)\n\n尽管它被设计为用于创建\
  \ Webmin Web 服务器的索引，但没有理由不为其他类型的 Web 服务器创建图标。然而，模块的 `RPC` 功能只有在与运行 Webmin 的主机通信时才能正常工作。\n\
  \n### 53.2 添加 Webmin 服务器\n\n要向此模块添加新服务器，以便为其提供链接或使其可以使用集群组模块中的一个进行管理，请按照以下步骤操作：\n\
  \n点击主页上方或下方的 `Register a new server`（注册新服务器）链接。\n\n在 `Hostname`（主机名）字段中，输入另一个服务器的域名或\
  \ IP 地址，例如 `server.example.com`。\n\n在 `Port`（端口）字段中，输入 Webmin 监听的端口，通常为 `10000`。\n\
  \n从 `Server type`（服务器类型）菜单中选择主机运行的操作系统。这仅设置用于表示服务器的图标。\n\n如果另一个 Webmin 服务器处于 SSL\
  \ 模式，在 `SSL server?` 字段中选择 `Yes`。只有当主系统安装了 `Net::SSLeay` Perl 模块和 `OpenSSL` 库时，才能使用此选项以建立客户端模式的\
  \ SSL 连接。\n\n\n\n\n\n当 `Description` 字段设置为 `From hostname and port` 时，服务器的主机名和端口号将显示在模块主页的图标下方。然而，您可以选择第二个选项并输入一个替代描述以进行显示，例如\
  \ `Corporate Web Server`。\n\n在此模块中定义的服务器可以进行分组，以便在 `Cluster` 类别模块中更于添加。在 `Member\
  \ of server group` 字段中，您可以选择以下选项之一：\n\n- **None**：您正在添加的系统将不属于任何组。\n- **Existing\
  \ group**：如果已经定义了一些组，则该服务器将位于此选项旁菜单中选中的组中。如果不存在任何组，则此选项甚至不会出现。\n- **New group**：服务器将被添加到您在相邻文本框中输入名称的新组中。\n\
  \n一旦某个组中的所有服务器都被删除或更改到另一个组，该组将不再存在。\n\n`Link` 类型字段可能是表单上最重要的字段，因为它决定了新服务器是否可以用于\
  \ `Cluster` 模块和 `System and Server Status` 模块。它还决定了图标是普通链接还是隧道。您的选项有：\n\n- **Normal\
  \ link to server**：无法对其他服务器进行 `RPC` 调用，且模块主页上的图标将只是普通的 Web 链接。如果系统正在运行其他 Web 服务器指定的端口，您应该选择此选项。\n\
  - **Login via Webmin with username**：如果您想使用 `Webmin` 的 `RPC` 功能来控制此服务器（例如通过 `Cluster`\
  \ 类别模块），则必须选择此选项。如果选中，您必须在相邻的字段中输入远程主机上 `Webmin` 用户名和密码。用户应该是 `root` 或 `admin`，因为默认情况下，其他\
  \ `Webmin` 用户未经特定授权不允许接收 `RPC` 调用。`RPC` 可在服务器上运行任何命令或修改任何文件，因此不能将访问权限授予不受信任的 `Webmin`\
  \ 用户。如果选择此模式，主页上的服务器图标将是一个隧道，谁点击它的人将自动以指定用户的身份登录远程服务器。\n- **Login when icon is clicked\
  \ on**：如果选择此选项，则服务器无法用于 `RPC`，但其图标仍然是到远程主机的隧道。第一次点击时，它将提示用户输入远程系统的用户名和密码，这些信息将存储在用户浏览器的\
  \ `cookie` 中。如果您希望各种用户能够利用隧道功能，但仍以他们自己的身份登录远程系统，则此选项非常方便用。\n\n如果上述选择了 `Login via\
  \ Webmin with username`，则 `Make fast RPC calls?` 字段将决定是使用新的快速 RPC 协议还是旧的慢协议。您可以选择\
  \ `Yes` 强制使用快速模式，选择 `No` 强制使用慢模式，或选择 `Decide automatically` 让 `Webmin` 仅在可用时使用快速模式。如果选择了自动选项，且无法连接或登录服务器，在稍后点击\
  \ `Create` 按钮时将显示错误消息。\n\n`0.89` 之前的 `Webmin` 版本不支持快速协议，但现在大多数系统都应该已升级到该版本以上。除非防火墙阻止了其所使用的直接\
  \ TCP 连接，否则您通常希望一直使用较快的模式。请参阅第 53.6 节“How RPC Works”以获取有关两种模式之间差异的更多信息。\n\n最后，点击\
  \ `Create` 按钮添加此新服务器。只要表单中没有错误，您将返回模块主页，该页应包含一个新的图标。\n\n不是以 `Normal link to server`\
  \ 模式创建的服务器图标实际上是到此主服务器上某个程序的链接，该程序将为您连接到远程系统。如果您的主服务器可以从 Internet 访问但内部主机不能，那么这实际上非常有用。例如，如果您只有一个\
  \ Internet IP 地址并正在使用 `NAT`。当您通过点击主系统上此模块中的这些图标来访问这些内部服务器时，您的浏览器实际上只连接到主服务器，然后由主服务器将请求隧道传输到选定的从机。\n\
  \n在具有多个用户的 `Webmin` 系统上，您应该小心向不受信任的用户授予此模块的访问权限。任何可以点击 `Login via Webmin with username`\
  \ 模式服务器图标的人，都将以该服务器指定的用户身份连接到远程系统，而不是自己。这可能允许他在远程主机上以 `root` 权限执行某些在主系统上无法执行的操作。\n\
  \n第 53.7 节“Module Access Control”解释了如何控制特定用户可以使用哪些服务器图标，以便将不受信任的人限制在安全的 `Normal\
  \ link to server` 或 `Login when icon is clicked on` 模式中。\n\n### 53.3 编辑或删除 Webmin\
  \ 服务器\n\n一旦服务器被添加到此模块，您就可以编辑它的所有细节甚至将其完全删除。要编辑或删除服务器，请按照以下步骤操作：\n\n1. 在主页上，点击您想要更改的服务器名称附近的\
  \ `edit` 链接。这将弹出一个与添加服务器几乎完全相同的编辑表单。\n2. 所有字段都可以编辑，并具有与第 53.2 节“Adding a Webmin\
  \ Server”中解释的相同的选项和含义。唯一的例外是 `Make fast RPC calls?` 字段，如果模块已经确定了远程服务器支持的 RPC 模式，则该字段将没有\
  \ `Decide automatically` 选择。\n3. 点击 `Save` 按钮激活新设置。或者，如果您想从模块中移除此服务器，请点击 `Delete`。任何使用此服务器的其他模块（例如\
  \ `Cluster` 类别中的模块）将自动从它们的列表中移除它。\n\n### 53.4 使用服务器隧道\n\n当您在一种隧道模式下点击 `Webmin` 服务器的图标时，您将通过此主系统连接到它。远程主机的用户界面与正常登录几乎完全相同，只是每个页面都会包含一个特殊的\
  \ `Webmin Servers` 链接。点击后，这将带您回到主系统上的 `Webmin Servers Index` 模块，这比在浏览器中点击几百次后按钮方便得多。\n\
  \n为了使隧道工作，主服务器必须分析并修改由您登录的远程主机返回的 HTML。目前这对于 `Webmin` 服务器运行良好，但如果您正在隧道到某些使用此模块不支持的\
  \ HTML 的其他 Web 应用程序或网站，可能会失败。这些症状包括指向主服务器上不存在的页面的链接以及未正常加载的图像。点击 `Login when icon\
  \ is clicked on` 模式的服务器图标最初将显示一个输入远程系统用户名和密码的登录表单。即使远程主机未在所选端口上实际运行 `Webmin`，它也会出现，但它可以用于登录任何使用标准\
  \ HTTP 身份验证的 Web 服务器。登录后，您的用户名和密码将被记住，直到您退出浏览器（从而丢弃 `cookie`）或点击模块主页上服务器图标下方出现的\
  \ `logout` 链接。\n\n### 53.5 广播和扫描服务器\n\n如果您的网络上有大量的 `Webmin` 服务器，将它们一个一个添加到此模块可能会很厌味。但是有一种更好的方法。主系统可以在您的本地局域网上广播其他\
  \ `Webmin` 服务器，或向特定网络内的主机发送请求以探测服务器。发现的任何服务器都将自动添加到此模块中，尽管仅以 `Normal link to server`\
  \ 模式。主系统没有方法自动确定远程系统的登录和密码，如果这可能的话，将会是一个巨大的安全漏洞！\n\n\n\n\n\n要查找其他 Webmin 服务器，请遵循以下步骤：\n\
  \n如果您只想搜索本地局域网（LAN），请点击模块首页底部的 `Broadcast for servers`（广播服务器）按钮。\n\n要搜索另一个网络，请在点击\
  \ `Scan for servers`（扫描服务器）按钮右侧的字段中输入其地址。这必须是一个 C 类网络，输入格式如 `192.168.1.0`。\n\n将显示一个列出找到的服务器\
  \ URL 的页面。新服务器会在 URL 之前显示 `Found new server`（发现新服务器），已经在主页上的服务器将显示 `Found known\
  \ server`（发现已知服务器），而来自主系统本身的响应将显示 `Found this server`（发现此服务器）。\n\n进程完成后，您可以返回主页，此时主页将包含每个新发现的服务器的额外图标。可以编辑它们以切换到\
  \ `Login via Webmin with username mode`（通过用户名模式通过 Webmin 登录），以便用于 RPC。\n\n自 0.75\
  \ 版本以来的所有 Webmin 版本都在 UDP 端口 `10000` 上监听由本模块发送的广播和扫描包，并回复其主机名、端口号和 SSL 模式。如果防火墙阻止了此端口或出于安全原因关闭了\
  \ UDP 监听，将无法找到服务器。\n\n### 53.6 RPC 如何工作\n\nRPC 是一种一个 Webmin 系统可以用它控制另一个系统的协议。RPC\
  \ 请求通常是对某个模块库中函数的调用，并包含该函数的参数。然而，还有其他类型的 RPC 请求，用于在服务器之间传输数据、检查模块是否可用、获取模块配置以及执行一段\
  \ Perl 代码。本节解释了其工作原理的原理细节，如果您不是程序员且没有遇到 RPC 连接的任何问题，可以跳过此节。\n\n当您设置 `System and\
  \ Server Status`（系统和服务器状态）模块从远程系统获取状态信息时，会向该系统相同模块中的函数发出 RPC 调用，以确定服务是启动还是关闭。当在\
  \ `Cluster Users and Groups`（集群用户和组）模块中添加用户时，还会进行多次 RPC 调用，将其添加到密码文件、创建其主目录并将文件复制到其中。第\
  \ 56 章解释了如何在您自己的模块中使用 RPC 及其其局限性。\n\n如前文所述，RPC 有两种不同的模式：快速模式和慢速模式。慢速模式最简单，因为它为每个\
  \ RPC 函数调用、文件传输或信息请求都使用从主机到从机的 HTTP 请求。所有参数、数据和返回值都包含在该请求及其响应中，且不会建立其他 TCP 连接。这种模式的优势是它可以穿过防火墙和代理工作，只要允许向端口\
  \ `10000` 发送 HTTP 请求即可。\n\n除了慢之外，这种模式还有一个很大的负面影响：HTTP 是无状态协议，但 Webmin RPC 调用不是无状态的。一个函数调用可能会设置一个全局变量，下一个函数调用依赖于它。这意味着对于每个打开\
  \ RPC 会话的主机，必须在远程系统中启动一个保持状态的后台进程。然而，从机系统无法自动检测主机 CGI 程序何时结束并关闭后台进程，因为它们之间不存在直接连接！\n\
  \nWebmin 的解决方案是让进程在主机发出特殊的 RPC 调用后或在空闲 30 秒后退出。如果主机 CGI 程序没有调用 `remote_finished`\
  \ 函数，远程进程将挂起并消耗内存，直到超时。如果由于某种原因，同一主机的 RPC 调用之间通过超过了 30 秒，后台进程将退出，未来的 RPC 调用将失败。\n\
  \n较新的快速 RPC 协议仅使用一个初始 HTTP 请求在远程系统上启动后台进程，解决了这些问题。主服务器随后对该进程建立 TCP 连接（该进程监听一个空闲端口），并通过该连接发送\
  \ RPC 请求。当主机程序退出时，该连接将自动断开，远程后台进程将退出。不需要特殊的函数调用或超时。\n\n快速 RPC 模式在与远程系统传输大文件方面有更好的支持。慢速模式尝试在\
  \ HTTP 请求内部编码文件，如果文件过大可能会失败。较新模式则通过单独的 TCP 连接进行未编码传输，这速度更快且可靠得多。`Cluster Software\
  \ Packages`（集群软件包）和 `Cluster Webmin Configuration`（集群 Webmin 配置）模块在慢速模式下安装大型包可能会失败。\n\
  \n快速模式唯一的问题是某些防火墙可能会阻止 TCP 连接，该连接通常建立比远程主机基础 Webmin 端口高一或二的端口上，例如 `10001` 或 `10002`。如果使用\
  \ RPC 传输数据可能会建立多个连接，因此两台服务器之间网络上的任何防火墙都必须配置为允许从主机到远程主机在 `10000` 到 `10100` 范围内的端口连接。\n\
  \n### 53.7 模块访问控制\n\n如果您的系统中有多个 Webmin 用户，您可能希望让其他人可以使用此模块，而不必赋予他们访问所有服务器图标或添加服务器的能力。如果您希望其他人只能看到不在\
  \ `Login via Webmin with username mode` 中的服务器图标，这将非常有用，从而将该模块转变为您网络上其他系统的索引。\n\n\
  第一步如第 52 章所述，将此模块分配给用户。然后，通过遵循以下步骤限制其只能查看和使用某些服务器的隧道：\n\n1. 在 `Webmin Users` 模块点击用户或组名称旁的\
  \ `Webmin Servers Index`（Webmin 服务器索引），打开访问控制表。\n2. 将 `Can edit module configuration?`（可以编辑模块配置？）字段更改为\
  \ `No`（否），使其无法更改其他人的用户界面。\n3. 在 `Can use servers`（可以使用服务器）字段中选择 `Selected`（已选），并从列表中选择您想要使其可见的服务器。\n\
  4. 将 `Can edit servers?`（可以编辑服务器？）和 `Can find servers?`（可以查找服务器？）字段更改为 `No`（否）。\n\
  5. 点击 `Save`（保存）按钮激活新限制。\n\n在此模块中对用户隐藏服务器不会阻止他在使用 RPC 的其他模块中使用。\n\n### 53.8 配置 Webmin\
  \ 服务器索引模块\n\n该模块有几个设置，控制其用户界面的显示以及如何进行服务器扫描。您可以通过点击首页上的 `Module Config`（模块配置）链接来编辑它们，这将打开一个包含表\
  \ 53.1 所示字段的表单。\n\n#### 表 53.1 模块配置选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| Resolve\
  \ found server addresses（解析找到的服务器地址） | 选择 Yes 时，模块会将扫描或广播找到的任何服务器 IP 地址转换为主机名。只有当您的网络反向解析缓慢或损坏时，才需要选择\
  \ No。 |\n| Time to wait for scan responses（等待扫描响应的时间） | 此字段设置模块等待发送以查找其他 Webmin\
  \ 服务器的包响应的秒数。如果您正在扫描远程网络，可能需要从默认的 5 秒增加。 |\n| Show servers as（显示服务器的方式） | 当选择 Table（表格）时，主页上的服务器将作为表格中的行列出，这比默认的\
  \ Icons（图标）模式更节省空间。每个服务器还会显示更多细节。 |\n| Sort servers by（按什么排序服务器） | 此字段控制主页上服务器的排序方式。选项有：IP\
  \ Address（IP 地址）根据其主机名解析的 IP 地址排序。Hostname（主机名）根据服务器的主机名排序。Description（描述）根据服务器图标下方的文本排序。OS（操作系统）根据您为它们选择的操作系统排序。Order\
  \ created（创建顺序）简单按它们添加到此模块的顺序列出。 |\n\n\n\n\n\n| 显示服务器状态 | 如果选择“是”，服务器的编辑表单将包含一个新的“服务器状态”字段，该字段显示其运行的\
  \ Webmin 版本，或者在无法联系或登录系统时显示错误消息。此字段仅在“通过用户名通过 Webmin 登录”模式下显示。 |\n| MSC 集群组目录 |\
  \ 此字段可用于指定包含额外服务器组的目录，格式采用 MSC Software 聚类工具使用的格式。 |\n\n### 53.9 总结\n\n本章解释了 Webmin\
  \ 服务器索引的用途，以及你如何使用它添加服务器以便于链接、创建隧道登录或进行 RPC 调用。它还解释了什么是 RPC，以及其他模块如何使用它来实现从单个界面管理多个\
  \ Webmin 服务器。\n\n## 第 54 章：登录 Webmin\n\n本章解释了 Webmin 如何记录日志、记录了哪些内容，以及如何搜索和查看这些日志。\n\
  \n### 54.1 日志简介\n\n当启用日志记录时，Webmin 将记录使用它执行的每一个对系统产生某种影响的操作，例如创建用户或更改 Apache 设置。对于不会实际更改系统任何内容的页面（例如仅显示图标、列出用户或显示某些对象的当前设置的页面），将不会向操作日志写入任何内容。这方面与\
  \ Webmin 写入 `/var/webmin/miniserv.log` 的独立 CLF 日志文件不同，后者会记录每一个访问过的页面和加载的图像。\n\n\
  在 Webmin 中执行的大多数操作都会更改配置文件、运行命令或执行 SQL 语句。当启用这些文件更改的记录时，每个操作的细节将包含在操作日志中，这样你可以清楚地看到当你要求创建\
  \ UNIX 用户或删除 DNS 区域时 Webmin 做了什么。如果你是系统管理的新手，或者想查看操作是如何实现的，这对于理解背后到底发生了什么非常有帮助。然而，并非所有模块都执行操作日志，特别是那些旧模块或由第三方开发者编写的模块。\n\
  \n如第 51.4 节“设置日志记录”所述，可以在 Webmin 配置模块中开启日志记录。基本操作日志默认启用，但未启用文件更改的记录。为了从 Webmin 操作日志模块中获得最大的收益，也应该记录文件更改。尽管这将略微减慢程序速度，并消耗更多的磁盘空间来记录更改。\n\
  \n某些类型的操作即使启用了此功能，也永远不会记录任何相关的的文件更改。此类操作可能通过网络连接完成所有工作，或者修改的文件非常大，以至于生成新旧内容之间的差异是不现实的。或者，该模块可能根本没有实现文件更改日志。\n\
  \n记录操作的实际文件称为 `/var/webmin/webmin.log`。它的格式是 Webmin 特有的，但它以简单的文本格式在单独行中记录每个操作的细节。如果启用了文件更改日志，则使用\
  \ `/var/webmin/diffs` 目录存储包含更改细节和所用命令的文件。此目录中的每个文件命名与操作 ID 匹配，并包含以 diff 格式对某一个文件所做的更改。\n\
  \n如果你在系统的 `/var/webmin` 中寻找文件但没有找到，请检查 `/var/log/webmin`。由其他 Linux 发行版供应商创建的一些软件包版本使用此备用目录，以更好地符合标准的\
  \ Linux 日志文件布局。\n\n### 54.2 Webmin 操作日志模块\n\n这个简单的模块专门存在用于查看由 Webmin 创建的操作日志。它对于查找特定用户在做什么，或者谁在某个模块中执行了什么操作非常有用。在具有多个管理员的系统中，追踪是谁弄坏了特定服务器的配置通常很困难，但此模块使得这变得相对容易。\n\
  \n可以在主菜单的 Webmin 类别下找到该模块，点击其图标将弹出图 54.1 所示的搜索页面。在查看特定操作的细节之前，必须使用搜索表单找到它。\n\n####\
  \ 图 54.1. Webmin 操作日志模块。\n\n![](img/54fig01.jpg)\n\n### 54.3 显示日志\n\n模块主页上的表单允许你使用三种不同的搜索标准查找操作。只有符合所有三个标准的的操作会被显示，而不是符合其中任一标准的的操作。你可以根据执行操作的\
  \ Webmin 用户、执行操作的模块，以及操作发生的日期和时间来查找操作。\n\n要显示日志文件，请遵循以下步骤：\n\n1. 在表单的第一部分，如果你只想显示特定用户的操作，请选择`按用户`（By\
  \ user）并从相邻的菜单中选择该用户。\n2. 若要从搜索中排除某些用户的操作，请改用`排除任何用户`（By any user except）选项。\n3.\
  \ 若要在搜索中包含所有用户，请选择`按任何用户`（By any user）。\n4. 在第二部分，选择`在模块中`（In module）并从菜单中选择，将搜索限制在特定模块中执行的操作。仅将列出当前安装的模块。\n\
  5. 若要搜索所有模块的操作，请选择`在任何模块中`（In any module）。\n6. 最后一部分决定操作必须落在哪个日期范围内才能包含在结果中。如果选择了`之间`（Between），你可以使用旁边的字段选择或输入一个或两个日期。如果省略了第一个日期，则将包含直到第二个日期的所有所有操作。同样，如果缺少第二个日期，则从第一个日期开始的所有操作都将符合条件。\n\
  7. 如果选择了`仅限今天`（For today only），则结果中将仅包含在当前本地时间天内发生的操作。\n8. 如果选择了`任何时间`（At any time），将忽略操作发生的日期。\n\
  \n点击`搜索`（Search）按钮显示符合所选标准的操作页面。如果你的 Webmin 日志很大，显示这可能需要几秒钟。如果找到了任何项，结果页面将为每个操作提供一个简短描述（例如`创建用户\
  \ fred`），它所属的模块、负责的 Webmin 用户、他连接的客户端系统，以及发生的日期和时间。\n\n点击“操作”列中的描述以进入显示该操作更多细节的页面。如果在操作发生时启用了文件更改日志，则该操作对任何文件所做的更改也将被显示，以及任何执行的命令或运行的\
  \ SQL 语句。只有来自`MySQL`和`PostgreSQL`模块的操作将包含用于创建表或修改列等内容的 SQL 语句。\n\n当 Webmin 处于会话验证模式时，此表单将显示`会话\
  \ ID`（Session ID）字段。点击 ID 将列出用户在单个浏览器实例中从登录到注销期间执行的所有操作。\n\n通过将搜索表单上的选项设置为默认值，可以显示系统中记录的每一个操作。然而，生成这可能需要很长时间，并且产生一个冗长的\
  \ HTML 页面。\n\n### 54.4 总结\n\n读完本章后，你应该理解 Webmin 日志记录系统是如何工作的，以及根据当前配置每个操作记录了哪些信息。你还应该如何使用\
  \ Webmin 操作日志模块来搜索和查看记录事件的细节。\n\n\n\n\nWebmin 的设计旨在在不更改任何现有代码的情况下轻松地添加新模块。模块可以被类比为\
  \ Netscape 或 Photoshop 插件。它可以由 Webmin 开发人员以外的人编写，并根据开发者选择的任何许可进行分发。\n\n模块应该编写用于管理某个服务或服务器，例如\
  \ UNIX 密码文件或 Apache Web 服务器。某些复杂的系统功能甚至可以拆分为多个模块。例如，磁盘分区、磁盘挂载和磁盘配配额管理是标准 Webmin\
  \ 分发版中的三个独立模块。\n\n理论上讲，模块可以用任何语言编写。然而，为了利用 Webmin 的 Perl API，应该使用 `5.002` 或更高版本。模块应完全用\
  \ Perl 编写，不包含 C 函数或外部二进制程序。其目标是让模块在不同的 UNIX 系统和 CPU 类型之间具有尽可能的移植性。\n\n用其他语言编写的模块将无法使用\
  \ Webmin 最新版本包含的默认主题进行显示。该主题用自己的函数替换了标准的 Perl 头文件函数，该函数会在每个页面顶部显示分类图标。出于这个原因，强烈建议使用\
  \ Perl。\n\n在简单的情况下，模块实际上只是 Webmin Web 服务器运行的 CGI 程序目录。然而，必须遵循某些规则，以确保它们能与 Webmin\
  \ API、主菜单和访问控制系统配合。尽管你可以直接将任何现有的 CGI 脚本放入模块目录，但这并不是一个好主意。\n\n### 55.2 需要的文件\n\n\
  每个模块在 Webmin 根目录下都有自己的目录，其中必须存储模块所有的 CGI 程序和配置文件。例如，如果 Webmin 根目录为 `/usr/local/webmin-1.090`，名为\
  \ `foobar` 的模块将安装在 `/usr/local/webmin-1.090/foobar` 中。\n\n为了让模块在 Webmin 主菜单上显示，它至少包含以下文件（只有\
  \ `module.info` 是强制性的）：\n\n- `images/icon.gif`: 在主菜单上显示的该模块的图标。图标应为 48x48 像素，并使用与主菜单上其他图标相同的颜色方案。\n\
  - `module.info`: 此文件包含有关模块及其运行的操作系统的信息。文件中的每行都采用 `name=value` 格式。必需的名称及其对应值为：\n\
  \    - `name`: 该模块的短名称，例如 `FooAdmin`。\n    - `desc`: 模块的较长描述，例如 `Foo Web Server`。这是显示在主菜单图标下方的文本。\n\
  \    - `os_support`: 该模块支持的操作系统列表，用空格分隔。只有当运行 Webmin 的操作系统在列表中，或者该文件中根本没有 `os_support`\
  \ 行时，该模块才会显示在主菜单上。除非你的模块配置了仅存在于少数操作系统上的特定服务（如 XFree86），否则应该省略此行，而不是尝试列出所有 Webmin\
  \ 支持的系统。在此行中使用的实际操作系统代码可以在 Webmin 根目录下的 `os_list.txt` 文件的第三列中看到，并且它们与第 55.4 节“模块配置”中解释的可以附加在文件名名称后的代码相同。要指定特定操作系统的特定版本，请在斜杠后的\
  \ OS 名称后添加它。例如，`module.info` 文件可能包含：\n```\nos_support=redhat-linux open-linux suse-linux/8.1\n\
  ```\n如果你的模块支持所有的 Linux 发行版，你可以在此行中使用 OS 代码 `-linux`。\n    - `depends`: 该模块依赖的其他模块列表，用空格分隔。如果模块\
  \ `foo` 依赖于模块 `bar`，那么当 `foo` 仍然安装时，Webmin 将阻止删除 `bar`。如果 `bar` 尚未安装，Webmin 也将阻止安装\
  \ `foo`。该列表还可以包含模块所依赖的 Webmin 版本（例如 `0.75`）。在这种情况下，将不允许旧版本的 Webmin 安装此模块。\n    -\
  \ `category`: 此值决定了你的模块归类在 Webmin 主页的哪个标签页下。支持的值有 `webmin`、`system`、`servers`、`net`\
  \ 和 `hardware`。如果你的 `module.info` 文件没有分类行，它将出现在 Others（其他）分类下。\n    - `lang/en`:\
  \ 该模块使用的文本字符串，如第 56.3 节“国际化”所解释的。\n\n主菜单上的每个图标都是指向模块目录的链接。因此，你必须有一个 `index.cgi`\
  \ 或 `index.html` 文件，以便在用户点击图标时显示。典型的模块包含许多链接到 `index.cgi` 的 `.cgi` 程序，每个程序执行某些功能，例如显示表单或保存表单输入。\n\
  \n当你第一次创建一个新模块时，它不在任何 Webmin 用户的 ACL（访问控制列表）中，你也无法在主菜单看到它。你必须先删除 `/etc/webmin/module.infos.cache`\
  \ 文件以清除已知模块的缓存。然后，为了让你的模块可见，编辑 `/etc/webmin/webmin.acl` 文件，或使用 Webmin 用户模块授予自己访问权限。\n\
  \n## 55.3 模块 CGI 程序\n\nWebmin Web 服务器将扩展名为 cgicgi` 文件视为 CGI 程序，就像大多数其他 Web 服务器一样。你模块中的所有表单、菜单和其他页面将由\
  \ CGI 程序生成，因此编写模块需要具备 CGI 编程和 HTML 的基本概念。\n\n所有 CGI 程序都以 root 权限运行，这对于它们编辑配置文件通常是必要的。在某些情况下，你的代码可能会通过切换到另一个用户来放弃这些权限。例如，如果针对某些\
  \ Webmin 用户的访问控制设置指定了这一点。\n\n假设你的模块正在用 Perl 编写，你应该从编写一个 Perl 脚本开始，该脚本包含你的模块中 CGI\
  \ 程序使用的函数。该脚本通常命名为 `lib.pl` 或 `foobar-lib.pl`。此类脚本的最小示例可能如下：\n\n```perl\n# foobar-lib.pl\n\
  # 用于管理 foobar 用户列表常用函数\n\ndo '../web-lib.pl';\n&init_config();\n\n# list_users()\n\
  # 返回所有 foobar 用户的列表\nsub list_users\n{\n...\n}\n```\n\n此示例中的三个重要行是：\n\n1. `do '../web-lib.pl';`:\
  \ Webmin 根目录下的 `web-lib.pl` 文件包含了许多对开发 Webmin 模块非常有用的函数。所有 CGI 程序都应该间接或直接引用此模块。你应该使用\
  \ `do` 而不是 `require`，因为后者语句不会重新读取已经在同一个 Perl 程序中读取过的文件。如果你的模块是从其他带有 `foreign_require`\
  \ 函数的模块调用的，这会导致问题。\n2. `&init_config();`: 此函数（定义在 `web-lib.pl` 中）初始化了以下全局变量：\n \
  \   - `%config`: 包含此模块的当前配置。这通常用于存储用户可编辑的选项和特定于系统的信息。\n    - `%gconfig`: 包含全局 Webmin\
  \ 配置。更多信息请见后续描述。\n    - `$module_name`: 此模块的名称，即模块所在目录的名称。\n    - `$module_config_directory`:\
  \ 存储模块配置文件的目录。如果你的模块由于某些原因创建了持久文件或程序（例如打印驱动程序脚本），它们应该在该目录中或其子目录下。\n    - `$tb`:\
  \ 表格头的背景颜色。\n    - `$cb`: 表格身体的背景颜色。\n    - `$scriptname`: 当前正在运行的 CGI 程序名称，相对于其所在目录的路径（例如\
  \ `save_foo.cgi`）。\n    - `$remote_user`: 当前用户登录 Webmin 的用户名。\n\n\n\n\n\n`base_remote_user`\
  \ 当前生效权限的用户名。大多数情况下，这与 `$remote_user` 相同，但如果你在 Webmin“用户”模块中设置了“配置 UNIX 用户身份验证”选项，它将被设置为使用该权限的用户名。\n\
  \n`$current_theme` 当前用户正在生效的主题名称。\n\n`$root_directory` Webmin 安装的根目录，例如 `/usr/libexec/webmin`。\n\
  \n`$module_root_directory` 当前模块的根目录，例如 `/usr/libexec/webmin/modulename`。\n\n`%module_info`\
  \ 来自 `module.info` 文件的关于当前模块的信息。\n\n`$current_lang` 当前使用的语言的短代码，例如 `en` 或 `de`。\n\
  \n`%current_lang_info` 包含当前语言信息的哈希表，其键如 `desc`（表示语言名称）和 `titles`（指示是否可以使用图形化标题）。主要对主题开发者非常有用。\n\
  \n## list_users 函数\n\n这是一个在该模块中各种 CGI 程序可能用到的函数示例。某些模块库文件可能还会包含包含特定于当前操作系统或配置的函数的另一个文件。`proc`\
  \ 模块中的 `proc-lib.pl` 文件就是此类。\n\n同一模块中名为 `list.cgi` 的 CGI 程序可能如下：\n\n```perl\n#!/usr/bin/perl\n\
  # list.cgi\n# 显示 foobar 用户列表\n\nrequire './foobar-lib.pl'\n&header($text{'list_title'},\
  \ \"\");\nprint \"<hr>\\n\";\n\nprint \"<table border>\\n\";\nprint \"<tr $tb>\\\
  n\";\nprint \"<td><b>$text{'list_user'}</b></td>\\n\";\nprint \"<td><b>$text{'list_real'}</b></td>\\\
  n\";\nprint \"<tr>\\n\";\n\n@users = &list_users();\n\nforeach $u (@users) {\n \
  \       print \"<tr $cb>\\n\":\n        print \"<td><a href='edit.cgi?user=\",\n\
  \              &urlize($u->{'user'}),\"'>$u->{'user'}</a></td>\\n\";\n        print\
  \ \"<td>$u->{'real'}</td>\\n\";\n        print \"<tr>\\n\";\n        }\n\nprint\
  \ \"</table>\\n\";\nprint \"<hr>\\n\";\n&footer(\"\", $text{'index_return'});\n\
  ```\n\n此示例中的重要行是：\n\n`#!/usr/bin/perl`\n\n所有 CGI 程序都必须以 `#!` 行开头，该行包含你系统上 Perl 解释器的路径。这应该与\
  \ Webmin 自身使用的路径相同，该路径可以在 `/etc/webmin/perl-path` 文件中找到。\n\n`require './foobar-lib.pl';`\n\
  \nCGI 程序应该通过类似这样的一行来包含模块的库，以便调用 `init_config` 并使库中定义的函数可用。\n\n`&header($text{'list_title'},\
  \ \"\");`\n\n任何要产生 HTML 输出的 CGI 程序都应该调用 `header` 函数来生成页面标题。在这种情况下，实际标题来自 `lang`\
  \ 目录下的一个文件，该文件已被读取到 `%text` 中。按照传统，在 header 之后还会直接生成一条水平线，如示例所示。只有后续将要调用 `redirect`\
  \ 的程序不应调用 `header`，或不通过 `print` 语句产生任何 HTML。\n\n以 `print \"<table border>\\n\";`\
  \ 开头的五行\n\n这些行输出 CGI 将要生成的表格头的 HTML。\n\n`@users = &list_users();`\n\n这一行是对 `foobar-lib.pl`\
  \ 中定义的 `list_users` 函数的调用，该函数可能返回一个用户数组。\n\n以 `foreach $u (@users) {` 开头的七行\n\n\
  此循环创建表格行，每行包含指向模块中另一个 CGI 程序的链接。你应该注意使用 `urlize` 函数，它将用户名转换为适用于 URL 参数的形式。\n\n`print\
  \ \"</table>\\n\";`\n\n这些行产生表格结束的 HTML 和传统的最后水平线。\n\n`&footer(\"\", $text{'index_return'});`\n\
  \n每个调用了 `header` 的 CGI 程序都必须调用 `footer`，它会生成正确结束页面所需的 HTML。\n\n该 CGI 程序在 `lang/en`\
  \ 文件中的对应部分可能如下：\n\n```\nlist_title=Foobar 用户列表\nlist_user=用户名\nlist_real=真实姓名\n\
  ```\n\n所有使用国际化的模块都必须包含一个 `lang/en` 文件，并且也可以包含 `lang` 中其他语言的其他文件。当然，并不要求你必须实际使用 Webmin\
  \ 的国际化功能。你也可以直接将硬编码的文本字符串放入代码中。\n\n### 55.4 模块配置\n\n几乎所有模块有一组配置参数，通过 `init_config`\
  \ 函数设置在 `%config` 数组供模块 CGI 程序使用。当安装 Webmin 或模块时，会将一个适用于所选操作系统的配置文件从模块目录复制到该模块的\
  \ Webmin 配置目录，通常类似于 `/etc/webmin/foobar/config`。\n\n`%gconfig` 关联数组包含全局配置选项，通常来自文件\
  \ `/etc/webmin/config`。一些实用的条目包括：\n\n`os_type` 在 `setup.sh` 中选择的或在安装时自动选择的操作系统类型，例如\
  \ `solaris` 或 `redhat-linux`。\n\n`os_version` 操作系统版本。\n\n`path` 路径。\n\n`display_mode`\
  \ 显示模式。\n\n`password_file` 密码文件。\n\n`file_user` 用户所属的文件。\n\n\n\n\n11 这种类型的参数不允许用户输入任何内容，而是在此处配置表单中插入一个包含描述的章节标题行。\n\
  \n12 用于输入密码的字段，且不会实际显示当前值。\n\n13 与类型 2 类似，但显示一个用于选择多个选项的列表框，而不是一组复选框。\n\n并不是每个可配置参数都需要\
  \ `config.info` 中的条目，只有用户可能想要编辑的参数需要。\n\n当安装模块时（无论是作为 Webmin 发行版的一部分还是单独安装），会将适用于所用操作系统的配置文件从模块目录复制到配置目录（通常在\
  \ `/etc/webmin` 下）。为了决定使用哪个基础配置文件，Webmin 会使用在安装时运行 `setup.sh` 选择的操作系统名称和版本来查找以下文件：\n\
  \n```\nconfig-osname-osversion\nconfig-osname\nconfig\n```\n\n其中 `osname` 是类似于 `redhat-linux`\
  \ 或 `solaris` 的内容，而 `osversion` 是类似于 `2.6` 或 `5.0` 的内容。一个典型的模块可能具有以下配置文件：\n\n```\n\
  config-redhat-linux\nconfig-redhat-linux-5.0\nconfig-slackware-linux evenconfig-debian-linux\n\
  config-solaris\n```\n\nWebmin 将每个 Linux 发行版视为不同的操作系统，因为每个发行版在 Apache 配置、crontab\
  \ 文件和启动脚本等项目上的位置不同。Linux 的操作系统版本号应该是发行版本（例如 `4.1` 或 `5.0`），而不是内核版本。\n\n在 Linux 系统上，如果不存在针对已安装\
  \ Linux 发行版的特定文件，将使用文件 `config-*-linux`。如果你为所有 Linux 变体创建设置而无需为每个变体单独定义文件，这将非常有用。然而，在大多数\
  \ shell 中实际创建此类文件可能会有点麻烦，因为 `*` 是通配符。你只需要在它前面加一个反斜杠进行转义即可。\n\n### 55.5 外观与感受\n\n\
  所有 Webmin 模块都应该具有相同的配色方案、外观和感受，如以下规则所示：\n\n所有页面都可以在任何支持图像、表格和表单的浏览器上查看。除非没有其他选择，否则不应使用框架、DHTML、Javascript\
  \ 或 Java 等浏览器功能。应该能够从 Netscape `1.1` 或 Pocket IE 等浏览器上使用 Webmin。\n\n所有生成 HTML 输出的\
  \ CGI 程序都应该调用 `header` 函数。这确保了根据正在使用的主题生成标准的页面标题。唯一的例外是不需要任何标题的 CGI，例如用于弹出选择窗口的\
  \ CGI。\n\n`header` 函数根据所选主题和配色方案创建为生成的页面设置背景颜色、文本颜色和链接颜色的 HTML 标签。`init_config`\
  \ 函数设置全局变量 `$tb` 和 `$cb`，它们应分别用作表头和正行的背景颜色，例如所示：\n\n```\nprint \"<table border width=100%>\\\
  n\";\nprint \"<tr $tb> <td><b>Foo</b></td> <td><b>Bar</b></td> </tr>\\n\";\nprint\
  \ \"<tr $cb> <td>some value</td> <td>another value</td> </tr>\\n\";\n```\n\n尽量避免包含大量输入字段的\
  \ HTML 表单。某些浏览器（特别是 UNIX 上的 Netscape）在渲染此类页面时会变慢。\n\n你的模块的主页（通常是 `index.cgi`）应该将\
  \ `header` 函数的 `config` 和 `noindex` 参数设置为 1，假设该模块确实有一个 `config.info` 文件。这确保了主页上会出现“模块配置”链接，而不会出现“模块索引”链接。\n\
  \n模块中的其他页面应该调用 `header`，并将 `title` 参数设置为你想要显示的标题，并将 `image` 参数设置为空字符串。这确保了显示常规标题，并出现一个返回主页的“模块配置”链接。\n\
  \n### 55.6 设计目标\n\n一个典型的 Webmin 模块是为了配置某些 UNIX 服务而写的，例如 Apache、Squid 或 NFS 导出。大多数\
  \ UNIX 服务器通常通过编辑特定的文本文件进行配置，该文件可能具有复杂的格式。任何修改配置文件的 Webmin 模块都能够解析此类配置文件中所有可能的选项，即使并非所有选项都呈现给用户。\n\
  \n任何模块都不应损坏服务配置文件或删除它不理解的选项。模块应该能够解析任何有效的配置，而不需要特殊的注释或特殊的格式。如果你的模块无法处理文件中的某些选项，应该对其原样保留。\n\
  \nWebmin 模块的设计应该是易于初学者使用的，但仍然允许用户执行几乎所有通过直接编辑配置文件可以完成的操作。然而，在某些情况下，可能会存在极少数用户需要编辑的配置选项，或者不适合通过\
  \ GUI 编辑的选项。这类设置应该排除在你的 Webmin 模块之外，因为它们的存在会扰乱用户界面。\n\n### 55.7 在线帮助\n\nWebmin `0.63`\
  \ 及更高版本支持上下文相关帮助。`hlink` 函数生成一个指向 CGI 程序的 HTML 链接，该程序处理并显示给定的帮助页面。帮助页面存储在模块目录下的\
  \ `help` 子目录中，英文页面简单地命名为 `page.html`。因此，对 `hlink` 的调用将输出一个指向显示帮助页面 `help/name.html`\
  \ 的链接。\n\n```\nprint &hlink(\"Enter username:\", \"name\"),\n      \"<input name=username\
  \ size=20><p>\\n\";\n```\n\n如果设置了 `header` 函数的 `help` 参数，标题中将包含一个标记为“帮助”的指向指定帮助面的链接。如果你创建了特定的文档来解释整个页面的通用功能，而不是（或除了）单独记录字段，这将非常有用。关于\
  \ HTML 帮助文件选择的相同规则同样适用。\n\n尽管 Webmin 模块中的在线帮助不是强制性的（甚至不常见），但向用户提供有关字段真实含义或页面目的的额外信息可能是很有用的。在许多情况下，输入并不是自言自明的，需要额外的文档，那么为什么不从页面本身提供它呢？\n\
  \n正如第 56.3 节“国际化”所解释，Webmin 模块可以通过使用 `lang` 子目录下的备翻译文件来支持多种语言。帮助页面也可以通过在 `help`\
  \ 子目录下创建命名为 `page.*language.html` 的文件存在多种语言。如果存在这样的文件，它将优先于 `page.html`（后者假设为英文）。例如，要为现有\
  \ `name.html` 页面添加德语版本，你需要创建 `name.de.html`。\n\n### 55.8 模块打包\n\nWebmin 配置模块允许用户向其现有设置添加新模块。模块必须封装为可选压缩的\
  \ UNIX TAR 文件，其中包含一个或多个模块。TAR 文件中的每个模块必须将其所有文件放在一个子目录下。例如，一个模块 TAR 文件可能如下：\n\n\n\
  \n\n\n```\ndrwxrwxr-x 3001/10       0 Aug 12 21:53 1998 dfsadmin/\ndrwxrwxr-x 3001/10\
  \       0 Nov  7 01:10 1997 dfsadmin/images/\n-rw-rw-r-- 3001/10     245 Aug  1\
  \ 23:41 1998 dfsadmin/images/icon.gif\n-rw-rw-r-- 3001/10    1438 Aug  1 23:41 1998\
  \ dfsadmin/images/dfsadmin.gif\n-rw-rw-r-- 3001/10    1541 Aug  1 23:41 1998 dfsadmin/images/create_share.gif\n\
  -rw-rw-r-- 3001/10    1265 Aug  1 23:41 1998 dfsadmin/images/edit_share.gif\ndrwxrwxr-x\
  \ 3001/10       0 May 16 18:32 1997 dfsadmin/test/\n-rw-r--r-- 3001/10     493 May\
  \ 16 18:32 1997 dfsadmin/test/dfstab\n-rw-rw-r-- 3001/10    2774 Jul 29 22:22 1998\
  \ dfsadmin/dfs-lib.pl\n-rw-rw-r-- 3001/10      49 Aug 12 21:53 1998 dfsadmin/module.info\n\
  -rwxr-xr-x 3001/10    1596 Mar 31 15:45 1998 dfsadmin/index.cgi\n-rw-rw-r-- 3001/10\
  \     199 Mar  5 19:30 1998 dfsadmin/help.html\n-rw-rw-r-- 3001/10     175 Mar \
  \ 5 19:30 1998 dfsadmin/config.info\n-rw-r--r-- 3001/10     140 Mar  5 19:30 1998\
  \ dfsadmin/config-solaris\n-rwxr-xr-x 3001/10     142 Mar  5 19:30 1998 dfsadmin/delete_share.cgi\n\
  -rwxr-xr-x 3001/10    4842 Mar  5 19:30 1998 dfsadmin/edit_share.cgi\n-rwxr-xr-x\
  \ 3001/10    3000 Mar  5 19:30 1998 dfsadmin/save_share.cgi\n-rwxr-xr-x 3001/10\
  \     573 Jun  8 15:02 1998 dfsadmin/restart_sharing.cgi\n```\n\nWebmin 模块的标准扩展名是\
  \ `.wbm`，但可以使用任何文件名。如果对模块进行压缩，则可以使用 `.wbm.gz` 或 `.wbm.Z` 扩展。\n\nWebmin 模块也可以封装为\
  \ RPM，适用于安装在已经安装了 Webmin 本身 RPM 版本的服务器上。你可以从 `[www.webmin.com/makemodulerpm.pl](http://www.webmin.com/makemodulerpm.pl)`\
  \ 下载名为 `makemodulerpm.pl` 的脚本，它可以通过自动创建规格文件（spec file）将模块目录打包成 RPM 包。\n\n# 55.9\
  \ 总结与进更多\n\n本章中的信息和示例应该是你开始编写自己的模块所需了解的所有知识。第 56 章解释了模块开发中一些更高级的可能性，例如日志记录、锁定和访问控制。第\
  \ 60 章列出了模块编写者在 `web-lib.pl` 中可以使用的所有函数，这些函数可以使你的模块外观和感觉与标准模块相似，简化编辑配置文件的过程等。\n\n\
  关于模块开发的最佳信息来源是 Webmin 本身的源代码。查看它以了解标准模块是如何编写的，并阅读第 57 章，该章节将带你了解计划 Cron 任务模块。\n\n\
  有关创建主题（themes）的信息（主题在许多方面与模块相似），请阅读第 58 章和第 59 章。这些章节分别涵盖了主题创建的基础知识和默认 MSC 主题的实现。\n\
  \n# 第 56 章 高级模块开发\n\n本章接第 55 章，解释了模块开发中一些更高级的部分，如访问控制、日志记录以及与用户和群组模块的集成。\n\n## 56.1\
  \ 模块访问控制\n\nWebmin 0.72 及以上版本支持一种标准方法来限制用户可以访问模块 own 功能。例如，Apache 模块允许将 Webmin 用户限制为管理选定的虚拟服务器，而\
  \ BIND 模块允许用户仅限于编辑某些域的记录。\n\n这种详细的访问控制与控制哪些用户可以访问哪些模块的第一级 ACL（访问控制列表）是分开的。只要你的模块调用了\
  \ `init_config`，Webmin API 将自动阻止没有访问整个模块的用户。\n\n模块访问控制选项在 Webmin 用户模块中设置，通过点击用户名称旁边的模块名称来实现。可用选项是由模块自身的代码生成的（但“是否可以编辑模块配置？”选项除外，该选项始终存在）。当用户点击保存时，表单参数也会由被配置模块的代码进行解析，然后保存到\
  \ Webmin 配置目录。\n\n想要使用访问控制的模块必须在其目录中包含一个名为 `acl_security.pl` 的文件。该文件必须包含两个 Perl\
  \ 函数：\n\n`acl_security_form(acl)` 此函数接收一个包含该用户当前 ACL 选项的哈希引用，并且输出用于编辑这些 ACL 选项的表单输入的\
  \ HTML。由于 HTML 将位于 4 列表格中，你必须在输入元素周围生成相应的 `<tr>` 和 `<td>` 标签。\n\n`acl_security_save(acl,\
  \ inputs)` 此函数必须根据 `acl_security_form` 创建的表单为给定的哈希引用填充值。表单输入可以通过 `ReadParse` 生成的全局哈希\
  \ `%in` 获得，或者通过函数的第二个参数获取。\n\n由于这些函数是在模块的上下文中调用的，`acl_security.pl` 文件可以 `require`\
  \ 模块使用的公共文件。这允许你访问标准的 Webmin 函数，并提供更有意义的输入。例如，在设置 Apache 模块的 ACL 选项时，会显示一组虚拟服务器列表供用户选择。\n\
  \n```\ndo 'foo-lib.pl';\n\nsub acl_security_form\n{\nprint \"<tr><td><b>可以编辑用户？</b></td>\\\
  n\";\nprintf \"<td><input type=radio name=edit value=1 %s> Yes\\n\",\n       $_0->{'edit'}\
  \ ? 'checked': '';\nprintf \"<td><input type=radio name=edit value=0 %s> No</td></tr>\\\
  n\",\n       $_0->{'edit'} ? '': 'checked';\n}\n\nsub acl_security_save\n{\n$_0->{'edit'}\
  \ = $in{'edit'};\n}\n```\n\n如果用户尚未为模块设置任何 ACL 选项，将使用默认选项。这些选项读取模块目录中的 `defaultacl`\
  \ 文件，该文件每行包含一个 `name=value` 对。\n\n为了实际执行所选的 ACL 选项，模块程序必须使用 `get_module_acl` 函数获取当前用户的\
  \ ACL，然后验证操作是否允许。当不带参数调用时，该函数将返回包含当前用户设置的选项哈希，这通常是你需要的。例如：\n\n```perl\n#!/usr/local/bin/perl\n\
  require 'foo-lib.pl';\n%access = &get_module_acl();\n$access{'create'} ||\n    \
  \  &error(\"您不允许创建新用户\");\n```\n\n在设计某些用户具有有限访问权的模块时，请记住用户可以输入任何 URL，而不仅仅是你链接的。例如，在显示表单的程序中进行\
  \ ACL 检查是不够的。处理表单的程序也应该进行相同的检查。CGI 参数也永远不应该信任，即使是用户通常无法输入的隐藏参数。\n\n## 56.2 用户更新通知\n\
  \n从 0.72 版本开始，可以让用户和群组模块在 UNIX 用户添加、更新或删除时通知其他模块。如果你的模块处理与用户相关的附加信息，这将非常有用。例如，磁盘配额模块在创建新用户时设置默认配额，Samba\
  \ Windows 文件共享模块保持 Samba 密码文件与 UNIX 用户列表同步。\n\n为了在用户添加、更新或删除时通知你的模块，你必须在模块目录中创建一个名为\
  \ `useradmin_update.pl` 的 Perl 脚本。该文件必须包含三个函数：\n\n`useradmin_create_user(user)`\
  \ 此函数在创建新的 UNIX 用户时调用。`user` 参数是一个包含新用户详情的哈希，下文将详细介绍。\n\n`useradmin_modify_user(user,\
  \ olduser)` 此函数在现有 UNIX 用户以任何方式被修改时调用。`user` 参数是包含用户新详情的哈希，而 `olduser` 包含用户在修改前的详情。\n\
  \n\n\n\n\n`useradmin_delete_user(user)` 此函数在删除 UNIX 用户时被调用。与其他函数一样，`user` 哈希表包含了用户的详细信息。\n\
  \n传递给这三个函数中的每个哈希引用具有表 56.1 所示的键。\n\n如果系统启用了影子密码（shadow passwords），可能还有其他键，但依赖这些键并不是好主意。\n\
  \n当你的函数被调用时，它们将处于你的模块的上下文中。这意味着你的 `useradmin_update.pl` 脚本可以引入其他 CGI 程序使用的公共函数文件。这些函数可以执行你需要的更新其他配置文件的任何操作，但不应在\
  \ `STDOUT` 上产生任何输出，或执行时间过长。一个部分的 `useradmin_update.pl` 示例如下：\n\n```\ndo 'foo-lib.pl';\n\
  \nsub useradmin_create_user\n{\nlocal $lref = &read_file_lines($users_file);\npush(@$lref,\
  \ \"$_[0]->{'user'}:$_[0]->{'pass'}\");\n&flush_file_lines();\n}\n```\n\n### 56.3\
  \ 国际化\n\nWebmin 0.75 及以上版本为模块编写者提供了根据用户选择语言生成不同文本和消息的函数。每个希望使用此功能的模块都应该有一个名为 `lang`\
  \ 的子目录，其中包含每个受支持语言的翻译文件。翻译文件的每一行都以 `message_code`=`Message in this language.` 的格式定义该语言中的消息。\n\
  \n#### 表 56.1. 传递给 `Usermin_update.pl` 函数的哈希键\n\n| key | Description |\n| :--- |\
  \ :--- |\n| user | 新用户或修改用户的登录名 |\n| uid | 用户的 UNIX UID |\n| gid | 用户主组的 UNIX GID\
  \ |\n| pass | 用户密码，使用 `crypt` 函数加密 |\n| plainpass | 用户的明文密码。这仅在 `passmode` 键等于 3\
  \ 时可用。 |\n| passmode | 该数字取决于在创建用户或编辑用户表单中对“密码”字段的选择。0 - 未为此用户设置密码，通常意味着不需要密码即可登录\
  \ 1 - 不允许此用户登录 2 - 仅此用户的加密密码可用 3 - `plainpass` 键中有一个新的或初始明文密码 4 - 用户密码未更改。仅在调用 `useradmin_modify_user`\
  \ 时可能。 |\n| real | 用户的真实姓名 |\n| home | 用户的家目录 |\n| shell | 用户的登录 shell |\n\nWebmin\
  \ 的默认语言是英语（代码 `en`），因此每个模块至少应该有一个名为 `lang/en` 的文件。如果缺少任何其他语言的消息，将改用英语消息。检查 `lang_list.txt`\
  \ 文件可以查看当前支持的所有语言及其代码。要更改当前语言，请进入 Webmin 配置模块并点击语言图标。\n\n当你的模块调用 `init_config` 函数时，相应翻译文件中的所有消息都将读入\
  \ `%text` 哈希表。因此，与其生成如下所示的硬编码文本：\n\n```\nprint \"Click here to start the server:<p>\\\
  n\";\n```\n\n你的模块应该像这样使用 `%text` 哈希表：\n\n```\nprint $text{'startmsg'},\"<p>\\n\"\
  ;\n```\n\n顶层 `lang` 目录对应文件中的消息也包含在 `%text` 中。因此，每个模块都可以使用保存、删除和创建等几个有用的消息。\n\n在某些情况下，你可能想在消息中包含变量文本。由于变量的位置取决于所使用的语言，消息字符串可以包含如\
  \ `$1`、`$2` 或 `$3` 等占位符。应使用 `text` 函数将这些占位符替换为实际值，例如：\n\n```\nprint &text('servercount',\
  \ $count),\"<p>\\n\";\n```\n\n你模块的 `module.info` 文件也可以通过为每个语言添加 `desc_*code`=`module\
  \ description` 的行来支持多种语言，其中 `code` 是语言代码。你还可以为每个语言设置一个独立的 `config.info.*code` 文件以及每个语言的帮助文件，如\
  \ `intro.*code.html`。在所有情况下，如果用户选择的语言没有翻译，将使用默认的英语。\n\n### 56.4 文件锁定\n\nWebmin 0.81\
  \ 版本引入了几个新的常用文件锁定函数，以防止多个程序同时向其写入。模块编写人员应利用这些函数，以防止在两个用户同时使用同一个模块时发生文件的损坏或覆盖。\n\n\
  锁定通过 `lock_file` 函数完成，该函数接受文件名作为参数，并通过创建一个同名但带有 `.lock` 后缀的文件获取该文件的排他锁。`unlock_file`\
  \ 函数也会移除给定的参数的文件的锁。由于 `.lock` 文件存储了锁定文件的进程 PID，因此任何 CGI 程序持有的锁都会在退出时自动释放。然而，建议在退出之前通过调用\
  \ `unlock_file` 或 `unlock_all_files` 正确释放锁。\n\n以下代码显示了如何使用锁定函数：\n\n```\n&lock_file(\"\
  /etc/something.conf\");\nopen(CONF, \">>/etc/something.conf\");\nprint CONF \"some\
  \ new directive\\n\";\nclose(CONF);\n&unlock_file(\"/etc/something.conf\");\n```\n\
  \n锁定应该在 CGI 程序中尽快进行，理想情况下是在读取要更改的文件之前，并且一定要在写入之前。文件在创建和删除期间可以也应该被锁定，目录和符号链接在创建或删除之前也应如此。虽然这对于防止文件损坏并非真正必要，但正如下面所解释，这使得程序执行的文件更改日志更加完整。\n\
  \n许多其他程序也为了相同的目的使用 `.lock` 文件，但大多数程序没有将它们的进程 ID 存入文件中。如果 `lock_file` 函数遇到这样的锁，它将等待该锁被完全移除后才获取自己的锁，因为无法判断原始进程是否仍在运行。\n\
  \n### 56.5 操作日志\n\nWebmin 0.81 及以上版本支持 CGI 程序对用户执行的操作进行详细日志记录，以便稍后在 Webmin 操作日志模块中查看。虽然之前的版本会将\
  \ HTTP 日志文件写入 `/var/webmin/miniserv.log`，但这并不包含确切判断每个 Webmin 用户在做什么的信息。为了改进这一点，Webmin\
  \ 现在将详细信息记录到文件 `/var/webmin/webmin.log`，并可选记录到 `/var/webmin/diffs` 目录下的文件中。请注意，如果在\
  \ Webmin 配置模块中未启用日志，该文件将不会记录任何内容。\n\nCGI 程序在成功完成所有处理和文件更新后，应调用 `webmin_log` 函数。该函数取的参数为：\n\
  \n* `action`: 程序执行的操作。通常是类似 save 或 delete 的内容。\n* `type`: 程序影响的对象的类型。通常是类似 user\
  \ 或 group，但如果不合适则可以留空。\n* `object`: 受影响对象的名称，例如 `jcameron` 或 `root` 或 `www.foobar.com`。\n\
  * `parameters`: 指向包含程序想要记录的附加信息的哈希引用。通常传递 `%in` 是很有用的。\n\n所有这些参数都可以包含你想要的任何信息，因为它们只是被记录到操作日志文件中，不会被\
  \ `webmin_log` 以任何方式解释。例如，一个模块可能会这样调用该函数：\n\n```\n&lock_file(\"/etc/foo.users\"\
  );\nopen(USERS, \">>/etc/foo.users\");\nprint USERS \"$in{'username'} $in{'password'}\\\
  n\";\nclose(USERS);\n&unlock_file(\"/etc/foo.users\");\n&webmin_log(\"create\",\
  \ \"user\", $in{'username'}, %in);\n```\n\n\n\n\n由于原始日志文件不于理解，Webmin 还提供了将详细的操作日志转换为人类可读格式的支持。Webmin\
  \ 操作日志（Actions Log）模块利用每个模块子目录下的 `log_parser.pl` 文件中的 Perl 函数，将该模块的日志记录转换为可读的消息。\n\
  \n该文件必须包含 `parse_webmin_log` 函数，该函数会为该模块的每条日志记录调用一次。它将带有以下参数被调用：\n\n* `user`: 运行生成日志记录程序的\
  \ Webmin 用户。\n* `script`: 生成此日志的 CGI 脚本的文件名，不包含目录。\n* `action`: 传递给 `webmin_log`\
  \ 作为 action 参数的任何内容。\n* `type`: 传递给 `webmin_log` 作为 type 参数的任何内容。\n* `object`: 传递给\
  \ `webmin_log` 作为 object 参数的任何内容。\n* `parameters`: 指向哈希表（hash）的引用，与传递给 `webmin_log`\
  \ 的哈希相同。\n* `long`: 如果非零，则表示调用此函数是为了为“操作详情”（Action Details）页面创建描述，因此可以返回比普通更长的消息。你可以根据需要忽略它。\n\
  \n该函数应根据传递的参数返回一个文本字符串，将它们转换为用户可读的描述。例如，你的 `log_parser.pl` 文件可能如下：\n\n```perl\n\
  require 'foo-lib.pl';\n\nsub parse_webmin_log\n{\nlocal ($user, $script, $action,\
  \ $type, $object, $params, $long) = @_;\nif ($action eq 'create') {\n        return\
  \ &text('log_create', $user);\n        }\nelsif ($action eq 'delete') {\n      \
  \  return &text('log_delete', $user);\n        }\n}\n```\n\n由于 `log_parser.pl` 文件的读取和执行方式与\
  \ Webmin 用户模块处理 `acl_security.pl` 文件的方式类似，因此它可以像任何模块 CGI 程序一样引入该模块自己的函数库。这意味着可以使用\
  \ `text` 函数和 `%text` 哈希来访问模块的已翻译文本字符串，如上例所示。\n\nWebmin 还可以被配置为记录每个 CGI 程序在调用 `webmin_log`\
  \ 之前具体执行了哪些文件更改。在 Webmin 配置模块的“日志”（Logging）下，有一个名为“Log changes made to files by\
  \ each action”的复选框，启用后将使 `webmin_log` 函数使用 `diff` 命令查找对每个程序锁定的文件进行的更改。\n\n当启用文件更改日志后，操作日志模块中的操作详情页面将显示所选操作的所有文件更新、创建和删除的差异（diffs）。如果对目录和符号链接进行了锁定，它也将显示它们的创建和修改。\n\
  \n除了记录其文件更改外，程序还可以使用常用的 `system_logged`、`kill_logged` 和 `rename_logged` 函数，这些函数的参数与\
  \ Perl 的 `system`、`kill` 和 `rename` 函数相同，但还会记录事件以便在操作详情页面查看。还有一个 `backquote_logged`\
  \ 函数，其工作方式类似于 Perl 反引号运算符（backquote operator）（它接收命令并执行它，返回输出），但也会记录该命令。如果使用了这些函数，必须在调用\
  \ `webmin_log` 之前调用它们，日志才能被实际记录，例如所示：\n\n```perl\nif ($pid) {\n        &kill_logged('TERM',\
  \ $pid);\n        }\nelse {\n        &system_logged(\"/etc/init.d/foo stop\");\n\
  \        }\n&webmin_log(\"stop\");\n```\n\n### 56.6 安装前和安装后脚本\n\nWebmin 0.990 及以上版本允许模块包含\
  \ Perl 脚本，这些脚本会在模块安装后和卸载前运行。如果你的模块包含一个名为 `postinstall.pl` 的文件，则该文件中的 Perl 函数 `module_install`\
  \ 将在模块安装完成后被调用。由于它在模块目录中执行，它可以以如下方式使用常用函数库：\n\n```perl\nrequire 'yourmodule-lib.pl';\n\
  \nsub module_install\n{\nsystem(\"cp $module_root_directory/somefile $config_directory/somefile\"\
  )\n        if (!-r \"$config_directory/somefile\");\n}\n```\n\n当从 Webmin 配置模块或集群式\
  \ Webmin 服务器模块安装模块时，该函数会被调用。然而，如果使用了 `install-module.pl` 脚本或安装 RPM 格式的模块，则不会进行调用。\n\
  \n如果你的模块包含一个名为 `uninstall.pl` 的文件，则该文件中的 Perl 函数 `module_uninstall` 也会在模块被删除之前被调用。这可能发生在使用\
  \ Webmin 用户或集群式 Webmin 服务器模块删除模块时，或者在卸载整个 Webmin 时。`module_uninstall` 函数应该清理任何在模块卸载后将不再工作的配置，例如引用模块中脚本的\
  \ Cron 任务。\n\n### 56.7 其他模块中的函数\n\n标准 Webmin 模块包含了大量有用函数，用于解析和操作 Apache、BIND、UNIX\
  \ 用户等的配置文件。如果你的模块也需要以某种方式配置这些服务器，那么利用标准模块中的现有函数是有意义的。\n\n由于标准模块通常已经配置了了诸如 `httpd.conf`\
  \ 和 `squid.conf` 等文件的正确路径，因此当你调用这些函数来读取和写入配置文件时，它们将使用这些路径。你还可以访问另一个模块的实际 `%config`\
  \ 设置，以便你的模块知道使用哪些命令来应用更改或启动 Apache 或 Squid 等服务器。\n\n当你首次使用 `foreign_require` 函数加载其他模块的库时，它实际上是在单独的\
  \ Perl 模块命名空间中执行的。你模块的所有 CGI 程序及其库将位于主命名空间中，但其他外部模块的函数将被放在与 Webmin 模块同名的命名空间中。这意味着你可以使用类似\
  \ `&useradmin::list_users()` 的代码调用这些函数，并访问类似 `$useradmin::config{'passwd_file}`\
  \ 的全局变量。这种 Perl 命名空间分离确保了同名的函数和全局变量可以同时存在于你的模块和外部模块中而不会产生冲突。然而，某些内容是所有模块共享的，例如 `get_system_hostname`、`load_language`、`read_file_cached`\
  \ 和 `get_all_module_infos` 使用的缓存，因此使用外部加载新模块的库不会太慢。\n\n发现其他模块中可用函数的唯一方法是阅读它们的 CGI\
  \ 程序和库的源代码。遗憾的是，目前除了源代码中的注释外，没有关于函数功能的文档。你还会发现并不是其他模块的每个功能都能通过其函数访问。例如，Apache 模块没有用于应用当前配置的函数。相反，这是通过\
  \ `restart.cgi` 脚本直接运行相应的命令来实现。\n\n对其他人来说，最有用的模块可能是“运行进程”（Running Processes），因为它包含了几个在后台启动进程的函数。许多标准模块都使用了它们，这就是为什么除非你想破坏其他几个\
  \ Webmin 模块，否则永远不应该卸载“运行进程”。\n\n调用 `&foreign_require(\"proc\", \"proc-lib.pl\")`\
  \ 后可用的函数有：\n\n* `proc::safe_process_exec(command, uid, gid, handle, input, fixtags,\
  \ bsmode)`：以给定的 UNIX uid 和 gid 执行指定的命令，将其将其写入 Perl 文件句柄（通常是 STDOUT）。当在执行会 fork 自己的子进程的程序时，这非常有用，因为当使用管道打开函数调用运行时，Perl\
  \ 通常无法检测到其输出的结束。例如，许多服务器有像 `/etc/init.d/httpd` 的启动脚本，它们具有这种问题的行为。\n\n\n\n\n如果提供了输入参数，则在运行时它将作为输入传递给该命令。如果\
  \ `fixtags` 参数设置为 `1`，则命令的所有输出都将进行 HTML 字符转义，以便在浏览器中正常显示。如果设置了 `bsmode` 参数，命令输出的任何退格符或回车字符分别被解释为删除最后一个输出字符或清空当前行。如果程序通常使用这些字符来显示递增计数器（如\
  \ `mkfs` 和 `cdrecord`），这将会非常有用。\n\n`proc::safe_process_exec_logged(command, uid,\
  \ gid, handle, input, fixtags, bsmode)` 此函数的行为与 `safe_process_exec` 相同，但会记录执行的命令，以便在调用\
  \ `webmin_log` 时进行记录。\n\n`proc::pty_process_exec(command, [uid, gid])` 在新的 PTY 中以指定的\
  \ UNIX `uid` 和 `gid` 身份（或正确的用户身份，通常是 root）执行指定的命令。许多程序（如 `passwd`）期望通过当前 TTY 与用户交互，因此在通过\
  \ `open` 函数运行后，输入不能简单地通过管道传递给它们。然而，你可以此函数返回的文件句柄对此类程序进行读写，就像你正在提供用户输入并查看通常发送给用户的输出一样。\n\
  \n`pty_process_exec` 实际上同时返回一个文件句柄和启动进程的 PID，因此你可以在需要时杀死它。可以使用标准的 `wait_for` 函数与命令进行交互，如下例所示：\n\
  \n```\n&foreign_require(\"proc\", \"proc-lib.pl\");\n($fh, $pid) = &proc::pty_process_exec(\"\
  passwd $username\");\nwhile(1) {\n    $rv = &wait_for($fh, \"password:\");\n   \
  \ if ($rv == 0) {\n        &sysprint($fh, $password);\n        }\n    else {\n \
  \       last;\n        }\n    }\nclose($fh);\n```\n\n`proc::pty_process_exec_logged(command,\
  \ [uid, gid])` 与 `pty_process_exec` 相似，但会记录命令以便稍后调用 `webmin_log` 时记录。\n\n`proc::list_processes([pid])`\
  \ 返回当前系统中运行的所有进程列表，或者如果提供了 `pid` 参数，则返回单个进程的详情。返回数组的每个元素都是指向哈希的引用，其中包含表 56.2 所示的键。\n\
  \n`proc::find_process(name)` 搜索命令或参数匹配给定 `name` 的进程，并返回这些匹配项的详情数组。每个元素都是一个与 `list_processes`\
  \ 函数具有相同成员的哈希引用。\n\n### 56.8 远程过程调用 (RPC)\n\nWebmin 0.82 及以上版本有多个在远程 Webmin 服务器上执行代码的常用函数。它们被某些标准模块（如\
  \ Cluster 类中的模块）使用，用于从单个接口控制多个服务器，并且可能在你自己的模块中也有用。这些函数的名称都以 `remote_` 开头，允许你调用函数、评估\
  \ Perl 代码以及在运行 Webmin 的其他系统之间传输数据。\n\n在 `master` 服务器对远程主机进行 RPC 调用之前，它必须在主系统上的 Webmin\
  \ Servers Index 模块中注册。`Link` 类型的字段必须设置为 \"Login via Webmin\"，并输入用户名和密码。指定的用户应当是\
  \ root 或 admin，因为默认情况下其他用户不允许接受 RPC 调用。\n\nRPC 通常用于调用远程系统其他模块中的函数或调用通用函数。这是通过 `remote_foreign_call`\
  \ 函数实现的，但在使用它之前，必须调用 `remote_foreign_require` 来加载要调用的模块的库。这与使用 `foreign_` 函数调用其他本地模块中的函数非常相似，正如第\
  \ 56.7 节“其他模块中的函数”所解释的那样。\n\n一段用于在远程系统上编辑用户的代码看起来可能如下所示：\n\n```\n$server = \"www.example.com\"\
  ;\n$user = \"joe\";\n&remote_foreign_require($server, \"useradmin\", \"user-lib.pl\"\
  );\n@users = &remote_foreign_call($server, \"useradmin\", \"list_users\");\n($joe)\
  \ = grep { $_->{'user'} eq $user } @users;\nif ($joe) {\n    $joe->{'real'} = \"\
  Joe Bloggs\";\n    &remote_foreign_call($server, \"useradmin\", \"modify_user\"\
  , $joe, $joe);\n    }\n```\n\n##### 表 56.2. 每个进程信息哈希中的键\n\n| pid | 进程 ID |\n| :---\
  \ | :--- |\n| ppid | 其父进程的 ID |\n| user | 所有此进程的 UNIX 用户名 |\n| cpu | 进程当前使用的 CPU\
  \ 时间百分比 |\n| size | 进程正在使用的内存量 |\n| nice | 其当前的 nice 级别 |\n| time | 进程实际使用 CPU 的时长\
  \ |\n| args | 进程的命令及任何参数 |\n\n当然，你需要熟悉其他模块中的可用函数，并确保你想要调用的模块已安装且版本正确。\n\n传递给远程函数的所有参数都将被转换为序列化文本形式以传输到远程服务器，任何返回值也会以序列化形式传回。虽然使用了常用函数\
  \ `serialize_variable` 和 `unserialize_variable`，但该过程对调用者和远程函数来说都是隐藏的。它们只看到原始格式的标量和引用。然而，需要注意的是循环引用。尝试发送一个包含指向其自身链接的结构（例如双向链表）将由于\
  \ `serialize_variable` 函数的局限性而失败。此外，尽量避免使用极大的参数（例如超过 1 MB 的字符串），因为序列化可能会使其变得庞大。\n\
  \n如果是指向哈希、数组或标量的引用，而这些内容通常由函数填充，那么它们将无法正确传输。例如，`read_file` 函数通常用文件内容填充其第二个参数所引用的哈希。这在被远程调用时将不起作用，因为所有参数以及它们引用的任何内容都会被*复制*到另一个系统。\n\
  \n`remote_eval` 函数可在远程系统上执行任意块 Perl 代码，允许你执行调用远程函数无法实现的操作。它是调用原生 Perl 函数（如 `unlink`）来读写任意格式文件、设置全局变量以及正确调用设置参数的函数的唯一方法。Perl\
  \ 代码评估后的结果将由此函数返回。此示例显示了 `remote_eval` 的用法：\n\n```\n$data = &remote_eval($server,\
  \ \"useradmin\",\n\"rename('/etc/foo', '/etc/bar');\\n\".\n\"local \\%data;\\n\"\
  .\n\"&read_file('/etc/bar', \\\\%data);\\n\".\n\"return \\\\%data;\\n\");\n&write_file('/etc/foo',\
  \ $data);\n```\n\n如你所见，在构建 Perl 代码字符串时，必须使用正确的引号以确保任何变量符号（如 $, %, 和 @）以及反引号 ` 字符都被转义。`remote_eval`\
  \ 的第二个 `module` 参数可以设置为 `undef`，这表示代码将在全局 Webmin 上文中执行，而不是某个特定模块的上下文。\n\n`remote_read`\
  \ 和 `remote_write` 函数可在主系统和远程系统之间传输整个文件的内容。它们比读取文件并编码以供 `remote_foreign_call` 或\
  \ `remote_eval` 函数使用快得多，因为文件是通过 TCP 连接以未编码传输的。\n\n如果你的模块执行 RPC 调用，你可能希望用户从菜单中选择一个要调用或被调用的系统。所有可用系统的名称列表可以通过\
  \ Webmin Servers Index 模块通过如下代码获取：\n\n```\n&foreign_require(\"servers\", \"servers-lib.pl\"\
  );\n@allservers = &servers::list_servers();\n@rpcservers = map { $_->{'host'} }\
  \ grep { $_->{'user'} } @allservers;\n```\n\n\n\n此外，所有的 `remote_` 函数都接受将 `undef`\
  \ 作为 `server` 参数。这表示应该使用本地系统，该系统无需在 Webmin 服务器索引模块中定义。这就是所有集群（Cluster）类模块如何在它们的待管理主机列表中包含“此服务器”选项的方法。\n\
  \n## 56.9 创建 Usermin 模块\n\nUsermin 的架构与 Webmin 非常相似，因此它的模块设计与 Webmin 模块几乎相同。主要区别在于，Usermin\
  \ 设计用于让服务器上的任何 UNIX 用户使用，以执行他们可以在命令行中完成的任务。编写第三方 Usermin 模块时应考虑到此点。\n\n默认情况下，模块的\
  \ CGI 程序是以 root 身份运行的，就像在 Webmin 中一样。这是很有的，因为某些任务（如更改密码）只能以 root 身份执行。然而，大多数 Usermin\
  \ 模块不需要超级用户权限，因此应该在调用 `init_config` 之后立即调用标准的 `switch_to_remote_user` 函数，将权限降低到登录用户的权限。\n\
  \nUsermin 模块可以拥有全局配置变量，这些变量最初从模块目录下的 `config` 或 `config-*ostype` 文件设置，并可以在 `%config`\
  \ 中可用。然而，这些变量永远无法由用户编辑。它们只能在 Webmin 的 Usermin 配置模块中设置。\n\n然而，它支持每个用户的配置选项，但使用了不同的机制。当调用标准的\
  \ `create_user_config_dirs` 函数时，全局 `%userconfig` 哈希表将填充来自以下来源的值，后面的来源将覆盖前面的来源：\n\
  \n- 模块目录下的 `defaultuconfig` 文件：这应该包含该模块所有用户的默认选项，如果用户或系统管理员没有进行其他设置，将使用它们。\n- `/etc/webmin/*modulename*/defaultuconfig`\
  \ 文件：这包含了该系统上模块的默认值，由系统管理员通过 Webmin 配置模块中 Usermin 模块配置页面的第二种形式进行设置。\n- `~username*//.usermin/*modulename*/config`\
  \ 文件：这包含了用户自己选择的选项。\n\n模块目录中的 `uconfig.info` 文件定义了系统级和用户级配置变量的编辑器。该文件的格式与 Webmin\
  \ 和 Usermin 全局配置使用的 `config.info` 文件完全相同，正如本文其他地方解释的那样。\n\n如果你创建了自己的 Usermin 模块，它应该以与\
  \ Webmin 模块完全相同打包（作为 `.tar` 或 `.tar.gz` 文件）。`module.info` 文件必须包含 `usermin=1` 行，以便它无法在\
  \ Webmin 中安装（在其中将无法正常工作）。\n\n### 56.10 总结\n\n本章是第 55 章的延续，解释了如何利用 Webmin 模块开发者可用的一些高级功能。它涵盖了访问控制、国际化、日志以及使用\
  \ RPC 调用运行 Webmin 的其他服务器上的函数。它还记录了运行进程（Running Processes）模块中的某些函数，这些函数可以被想要启动或管理进程的其他模块使用。\n\
  \n## 57 章定时 Cron 任务模块\n\n本章带领模块编写者进入一个标准的 Webmin 模块内部，解释他们应该复制其设计的哪些部分。\n\n### 57.1\
  \ 模块设计和 CGI 程序\n\n正如第 10 章所示，该模块允许用户为系统上的所有 UNIX 用户查看、编辑和创建 Cron 任务。它通过读取多个不同的文件获取任务列表，例如\
  \ `/var/spool/cron` 目录下的文件、`/etc/cron.d` 中的文件以及 `/etc/crontab` 中的文件。具体路径取决于 Webmin\
  \ 运行的操作系统，因为每个 UNIX 变体似乎都有自己的 Cron 实现方式。\n\n除了编辑任务外，该模块还可以用于执行已定义的任务并查看它们的输出。用户还可以编辑控制哪些用户访问\
  \ Cron 的文件，通常命名为 `/etc/cron.allow` 和 `/etc/cron.deny`。\n\n构成该模块的 CGI 程序有：\n\n- `index.cgi`：显示当前\
  \ Webmin 用户允许访问的任务列表，每个任务都是指向由 `edit_cron.cgi` 创建的编辑页的链接，并带有标识编辑任务索引的参数。实际列表来自 `cron-lib.pl`\
  \ 中的 `list_cron_jobs` 函数。\n- `edit_cron.cgi`：根据 `idx` 和 `new` 参数，生成用于编辑现有任务或创建新任务的表单\
  \ HTML。同样，正在编辑的任务的详情来自 `idx`。\n- `list_cron_jobs`：在生成的页面底部有提交到 `save_cron.cgi` 或\
  \ `delete_cron.cgi` 的按钮。\n- `save_cron.cgi`：调用 `ReadParse` 获取来自 `edit_cron.cgi`\
  \ 的表单输入并对其进行验证，以确保所有必需字段都已填写。如果是，则调用 `cron-lib.pl` 中的函数创建新任务或更新现有任务，然后调用重定向使用户浏览器返回\
  \ `index.cgi`。然而，如果检测到错误，则会调用标准的错误函数。在更改任务运行的用户时，此程序需要删除并重新创建任务，以便使其进入正确的文件，而不是仅仅在原处更改。\n\
  - `delete_cron.cgi`：当点击编辑表单上的“删除”按钮时运行。仅调用 `cron-lib.pl` 中的函数来移除由 `idx` 参数指定的任务，然后将浏览器重定向到\
  \ `index.cgi`。\n- `exec_cron.cgi`：此 CGI 使用运行进程模块中的 `safe_process_exec` 函数，以任务所有者的身份运行指定\
  \ Cron 任务的命令并显示输出。它还会删除任何特定于 Webmin 的环境变量，以便 Cron 任务运行的程序不会产生混淆，认为它们被当作 CGI 程序调用，而事实并非如此。\n\
  - `edit_allow.cgi`：仅显示一个表单，用于输入允许使用 Cron 的用户列表或不允许使用的用户列表。当前设置通过调用 `cron-lib.pl`\
  \ 中的函数获取。\n- `save_allow.cgi`：将 `edit_allow.cgi` 创建的表单输入保存回原始文件，再次通过调用模块库中的函数实现。\n\
  \n该模块遵循许多其他模块常用的设计：单个页面列出待编辑的对象，每个对象都是一个指向编辑表单的链接。你的模块在适当的情况下应使用相同的布局，而不是显示一个巨大的表格来同时编辑多个对象。模仿该模块使用多个\
  \ CGI 程序也是一个好主意，而不是尝试在一个脚本中输出所有内容。在所有标准模块中，一个独立的程序生成每个页面，如果页面是表单，则会被提交给另一个程序。这使得每个程序都更简单易于理解，而不是将表单生成和处理代码放在单个脚本中。所有的表单处理\
  \ `save_CGIs` 都使用重定向函数使用户浏览器返回模块首页，而不是返回编辑表单。\n\n### 57.2 cron-lib.pl 库脚本\n\n该模块的实际工作由\
  \ `cron-lib.pl` 中的函数完成，这些函数实际上读取并写入不同格式的各种 Cron 任务文件。这是 Webmin 模块应该编写的方式，因为它清晰地将用户界面与配置文件管理分离离开。这防止了代码不必要的重复，并且在出现特定的新\
  \ Cron 文件时易于添加支持。\n\nCGI 程序调用的库中函数有：\n\n\n\n\n`list_cron_jobs()` 返回一个哈希引用数组，每个哈希包含一个特定\
  \ Cron 任务的详情。这些信息实际上是从几个不同的文件中读取的，每个任务哈希在 `file` 键中包含来源的文件名，`line` 键包含在该文件中的位置，`type`\
  \ 键则包含其格式。这在用用 `change_cron_job` 保存任务时会用到，以便将其以正确的格式放回原处。许多其他 Webmin 模块也会在它们从配置文件创建的哈希中存储此类信息，这样它们就知道需要更新文件的哪个部分。\n\
  \n`create_cron_job(job)` 接收一个包含 Cron 任务详情的哈希引用，其键名（keys）与 `list_cron_jobs()` 返回的键相同，然后将其转换为格式正确的行，并附加到用户\
  \ Cron 任务文件的临时副本中。使用 `copy_crontab` 函数来激活它，具体方法见下文说明。\n\n`change_cron_job(job)`\
  \ 接收一个由 `list_cron_jobs()` 返回的哈希引用，但更新了某些细节，并将其转换为格式正确的文本行。如果它是用户的个人 Cron 任务，则必须在任务文件的副本中更新该行。否则，可以直接更新其来源的原始文件。\n\
  \n`delete_cron_job(job)` 通过从原始文件中删除对应行来删除作为参数传递的任务。如果是用户的个人 Cron 任务，则会在其文件的临时副本中进行，而不是直接更新原始源。\n\
  \n`list_allowed` 和 `list_denied` 分别返回允许或不允许访问 Cron 的用户数组。这些函数主要由 `edit_allow.cgi`\
  \ 使用，仅读取 `/etc/cron.allow` 和 `/etc/cron.deny` 的内容。然而，`save_cron.cgi` 也使用它们来检查你为创建\
  \ Cron 任务的用户是否可以使用它，因为如果不是，`crontab` 命令通常会失败。\n\n`save_allowed(user, …)` 和 `save_denied(user,\
  \ …)` 这些函数将作为参数给的用户列表分别写入 `/etc/cron.allow` 或 `/etc/cron.deny` 文件。它们仅供 `save_allow.cgi`\
  \ 使用。\n\n`can_edit_user(access, user)` 此函数用于根据传递的参数的哈希引用和用户名，检查当前 Webmin 用户是否有权访问特定\
  \ UNIX 用户的 Cron 任务。该引用假设是 `get_module_acl` 的返回值，其中包含了在 Webmin 用户模块中做的设置。大多数 CGI\
  \ 程序都使用它来限制显示，并防止访问未经授权用户的任务尝试。如果你的模块具有可以限制用户可访问对象的访问控制功能，那么这样的函数可以防止检查 ACL 设置的代码重复。需要注意的是，它在\
  \ `edit_cron.cgi` 和 `save_cron.cgi` 中都会被调用，以阻止那些试图直接调用保存程序而不是通过表单的“狡猾用户”。\n\n`show_times_input(job)`\
  \ 此代码为表单中用于编辑 Cron 任务运行时间的部分打印 HTML。它曾存在于 `edit_cron.cgi` 中，但后来被移动到了库中，以便其他设置 Cron\
  \ 任务的模块（如文件系统备份）可以在其用户界面中使用相同的输入。\n\n`parse_times_input(job, in)` 此函数解析由 `show_times_input()`\
  \ 创建的表单输入。同样，其他模块以及 `save_cron.cgi` 也会使用它。\n\n你可能会奇怪，为什么上述某些函数更新的是临时文件，而不是直接编辑包含用户\
  \ Cron 任务的 `/var/spool/cron` 文件。原因是必须使用 `crontab` 命令来安装修改后的文件，Cron 守护进程才能注意到变化并生效。这是通过\
  \ `copy_crontab` 函数实现的，它会调用操作系统相应的 `crontab` 命令。通常，当用户运行 `crontab` 时，它会启动类似 `vi`\
  \ 的编辑器让用户编辑文件的临时副本，然后将其移回 `/var/spool/cron`。\n\n然而，此模块将 `EDITOR` 环境变量设置为 `cron_editor.pl`\
  \ 脚本，该脚本仅模块创建的临时文件覆盖传递给 `crontab` 用于编辑的文件。当该文件存在时，模块所做的更改将被正确安装，临时文件可以删除。\n\n对于\
  \ `/etc/crontab` 或 `/etc/cron.d` 中的 Cron 来说是不必要的，因为守护进程会自动检测。\n\n### 57.3 模块配置设置\n\
  \n此模块演示了如何用相同的代码支持操作系统上的各种 Cron 文件位置、格式和程序。如果你查看其目录，会看到许多以 `config-` 开头的文件，例如 `config-solaris`\
  \ 和 `config-redhat-linux`。每个文件指定了特定操作系统要读取的文件和使用的命令。`cron-lib.pl` 中的代码在列出和更新任务时多次引用\
  \ `%config`，当然，它被 `/etc/webmin/cron/config` 的内容所填充。该文件反过来来自 Webmin 安装时选择的模块目录中相应的\
  \ `config-` 文件。\n\n如果你的模块管理的某些服务在操作系统之间略有不同，那么这种使用不同配置的方法是有意义的。这在为像 Apache 之类的服务器编写模块时也很有用，因为默认配置和程序文件路径会根据操作系统或\
  \ Linux 发行版而不同。\n\n此模块中的 `config.info` 文件定义了用于编辑配置文件中取决于操作系统的选项以及仅与模块用户界面相关的输入。有时，让用户编辑此类设置（如用户个人\
  \ Cron 任务文件的位置）毫无意义，因为它们很大程度上是由所使用的操作系统决定的。出于如此，你可能认为从 `config.info` 中移除这些字段是一个好主意，这样用户就不会破坏模块的配置。但在定时\
  \ Cron 任务（Scheduled Cron Jobs）模块中，所有的配置设置都可以编辑，以防用户将操作系统自带的 Cron 版本升级到完全不同的包。\n\n\
  ### 57.4 lang 国际化目录\n\n多亏了 Webmin 用户的慷慨贡献，此模块的 `lang` 子目录包含几种不同语言的文件。正如第 56.3 节“国际化”所示，Webmin\
  \ 配置模块中语言表单的设置决定了在调用 `init_config()` 时将哪种语言加载到 `%text` 哈希中。\n\n\n\n\n此模块的任何 CGI\
  \ 程序或其他脚本中均没有硬编码的文本字符串。相反，它使用了对当前语言适当消息的引用，例如 `$text{'index_create'}` 或 `&text('exec_cmd')`。如果你的模块将来可能翻译成其他语言，那么在它的\
  \ CGI 程序中也应该这样做。尽管将消息放在单独的文件中稍费精力，但从长远来看是值得的。\n\n## 57.5 `acl_security.pl` 访问控制脚本\n\
  \n如第 52 节所述，可以使用 Webmin 用户模块为特定用户和模块配置详细的访问控制设置。编辑这些设置的实际表单由模块目录下的 `acl_security.pl`\
  \ 脚本生成，该脚本在第 56.1 节“模块访问控制”中有介绍。由于此模块允许管理员定义 Webmin 用户可以编辑哪些 UNIX 用户的 Cron 任务，因此它也包含这样一个脚本。\n\
  \n你可以通过编辑器打开该文件看到，它包含了所需的 `acl_security_form` 和 `acl_security_save` 函数。第一个函数在 4\
  \ 列表格中打印表单输入内容的 HTML，其当前设置基于作为参数传递的哈希引用的内容。第二个函数检查 `%in` 中的值，并使用它们填充其参数中的哈希引用，该引用在\
  \ Webmin 用户模块退出时被保存回 `/etc/webmin/cron/*username*.acl`。\n\n此模块的 ACL 设置允许管理员通过几种不同的方式选择允许的\
  \ UNIX 用户。他可以授予所有用户访问权限，也可以仅授予与当前 Webmin 用户名称匹配的用户权限、特定用户列表权限、具有某些主组的用户权限，或 UID\
  \ 在某些范围内的用户权限。许多其他模块也有类似的选项来指定某种类型的允许用户。如果你的模块处理某种与 UNIX 用户相关的配置，它的 `acl_security.pl`\
  \ 脚本也应该有类似的输入。\n\n在许多系统（如用于虚拟托管的系统）上，单个子管理员可能负责许多 UNIX 账户，可能是那些具有特定主组或 UID 在固定范围内的账户。这种访问控制使得能够安全地赋予此类子管理员一个\
  \ Webmin 登录权限，使其仅能管理“属于”他的 UNIX 用户。\n\n此模块中的所有 CGI 程序都使用 `get_module_acl` 标准函数来获取当前\
  \ Webmin 用户的访问控制设置。返回值通常存储在 `%access` 哈希中，通过查询该哈希来确定 Webmin 用户是否可以访问特定 UNIX 用户的\
  \ Cron 任务。这主要通过调用 `can_edit_user`（上文已介绍）并在拒绝访问时调用 `error` 来完成。\n\n你模块中的代码也应该这样做，并且每个\
  \ CGI 程序都应该检查以确保其没有被不当访问。你可能想要进行的的一个更改是将对 `get_module_acl` 的调用放在你模块的库脚本中，这样 `%access`\
  \ 哈希就可以全局供每个 CGI 程序使用，而不是让每个程序都显式地调用它。\n\n在创建一个可以配置为允许此类限制访问的模块时，你必须非常小心防止用户以任何方式逃避限制。这意味着要遵循编写\
  \ CGI 脚本的所有常规规则，例如不要将用户输入直接传递给系统或 `open` 函数。由于具有完全 root 权限的用户通常访问 Webmin 模块，因此安全性非常重要。\n\
  \n## 57.6 `log_parser.pl` 报告脚本\n\n与所有良好的 Webmin 模块一样，这个模块使用 `webmin_log` 来捕获操作。如第\
  \ 56.5 节“操作日志”所述，这些信息随后会被写入日志文件。日志的另一个方面是将记录的参数转换为人类可读的形式，这是由 `log_parser.pl` 脚本完成的。如果你查看此模块的代码，你会发现它只是使用参数来决定传递给\
  \ text。注意，使用 `html_escape` 函数来移除 Cron 命令中的任何特殊字符，否则这些字符可能会导致无效的 HTML。所有这些都使用 `lock_file`\
  \ 和 `unlock_file` 函数来保护关键文件。\n\n## 57.7 `useradmin_update.pl` 用户同步脚本\n\n如第 56.2\
  \ 节“用户更新通知”所述，其他 Webmin 模块可以选择在“用户和组”模块中创建、修改或删除用户时接收通知。定时 Cron 任务模块拥有一个 `useradmin_update.pl`\
  \ 脚本，以便它可以检测用户的重命名和删除，并分别更新它们的 Cron 任务文件。\n\n\n\n\n那几个使用 `useradmin_update.pl` 脚本的模块其执行的任务可能与本模块中的任务有所不同。请查看\
  \ samba 目录中的脚本，作为如何同步单独的密码文件的示例。如果你的模块脚本执行了类似的操作，它应该在某处包含一个选项（可能在模块配置页面），用于开启或关闭同步。任何此类选项默认都应是关闭的，这样当用户管理\
  \ UNIX 用户时，其他配置文件就不会被意外更新。为了避免第一个问题，`useradmin_delete_user` 函数会删除任何被删除的 UNIX 用户的个人\
  \ Cron 任务文件。`useradmin_modify_user` 函数会检查用户是否已重命名，如果是，则同时重命名该用户的个人 Cron 文件以及其他文件中任何任务。对用户的任何其他更改都将被忽略，因为它们与本模块无关。\n\
  \n### 57.8 总结\n\n本章解释了计划 Cron 任务（Scheduled Cron Jobs）模块的工作原理，因此任何想要编写自己模块的人都可以复制相同的设计风格。它涵盖了每个模块\
  \ CGI 程序的用途、可配置选项，以及访问控制、日志解析和用户同步脚本。它还涵盖了模块库中的函数，这些函数可以被需要创建或管理自己的 Cron 任务的其他模块调用。\n\
  \n## 58. 创建 Webmin 主题\n\n本章解释了主题的工作原理，并引导你完成为 Webmin 创建自己的主题的过程。它涵盖了如图像替换等基本功能，以及编写备用头部函数等高级能力。\n\
  \n### 58.1 主题简介\n\nWebmin 0.83 及以上版本支持主题，主题是备用用户界面、图形和配色方案的集合。用户可以通过进入 Webmin 配置（Webmin\
  \ Configuration）并点击 Webmin 主题（Webmin Themes）来选择想要的主题。可以安装多个主题，但一个 Webmin 用户同一时间只能激活一个主题。如果没有激活的主题，则将使用默认颜色和布局。\n\
  \n与模块一样，主题是 Webmin 根目录下的一个目录，包含某些文件。最重要的是 `theme.info` 文件，它与 `module.info` 文件具有相同的\
  \ `name=value` 格式，每行一个。唯一要求的名称及其对应值是：\n\n`desc` 此主题的描述，例如 `My Webmin Theme`。这是显示在主题选择菜单中的文本。\n\
  \n主题还可以包含一个配置文件，同样采用 `name=value` 格式。该文件中定义的值控制标准头部函数和页脚函数的行为。支持的名称及其值如下：\n\n`cs_page`\
  \ RRGGBB 格式的六位十六进制字符串，用于 Webmin 页面的背景颜色。\n\n`cs_link` RRGGBB 格式的六位十六进制字符串，用于 Webmin\
  \ 页面上已访问和未访问链接的颜色。\n\n`cs_text` RRGGBB 格式的六位十六进制字符串，用于普通文本的颜色。\n\n`bgimage` 相对 URL（如\
  \ `/images/background.gif`），用于显示在所有页面上的背景图像。\n\n`noindex` 如果设置为 1，头部函数生成的 HTML 将不包含\
  \ Webmin 索引（Index）链接。如果使用另一个框架作为主索引，这非常有用。\n\n`brand` 用于显示在主索引页右上角的图像或文本的 HTML。\n\
  \n`brand_url` 品牌图像链接到的 URL。这两个选项通常结合使用，在自定义版本的 Webmin 中创建一个链接到其主页的公司图标。\n\n`headhtml`\
  \ 将包含在每个 Webmin 页面 `<head>` 区域内部的 HTML。\n\n`headinclude` 你的主题目录中的一个文件名，其内容将包含在每个页面的\
  \ `<head>` 区域内部。\n\n`inbody` 将包含在 `<body>` 标签本身的文本。\n\n`prebody` 将包含在每个页面 `<body>`\
  \ 区域顶部的 HTML。HTML 中将进行以下替换：\n\n`%HOSTNAME%` 将替换为系统主机名。\n\n`%VERSION%` 将替换为 Webmin\
  \ 版本。\n\n`%USER%` 将替换为当前用户的登录名。\n\n`%OS%` 将替换为操作系统名称和版本。\n\n`texttitles` 如果设置为 1，所有页面上的标题将作为\
  \ HTML 文本显示，而不是使用字母字体。\n\n`postbody` 将包含在每个页面 `<body>` 区域底部的 HTML。使用与 prebody 相同的替换。\n\
  \n`tb` 将包含在表头行 `<tr>` 标签内部的文本。\n\n`cb` 将包含在表头下方表格行 `<tr>` 标签内部的文本。\n\n`functions`\
  \ 你的主题目录中的一个文件名，其中包含用于覆盖默认头部、页脚和错误函数的 Perl 函数。更多细节请参阅第 58.3 节“主题函数（Theme Functions）”。\n\
  \n`noicons` 如果设置为 1，`generate_icon` 和 `icons_table` 函数将仅名称而非图标。如果你的主题是为纯文本或低带宽使用设计的，这非常有用。\n\
  \n如果你的主题使用 `functions` 选项来创建自己的头部函数替代品，那么这些选项中的许多将无法自动工作。它们通常由标准头部函数检查并实现，因此，如果你定义了自己的函数，它将需要检查\
  \ `%tconfig` 全局哈希表，并以相同的方式解释其中包含的值，如果你仍然希望这些值在主题的配置文件中是可配置的。\n\n当你创建一个主题并想将其分发给他人时，它应该被打包。就像模块一样，主题被打包为主题目录的可选压缩\
  \ tar 文件，通常带有 `.wbt` 扩展名。然后它们可以通过 Webmin 配置模块中的 Webmin 主题页面进行安装。\n\n与模块一样，主题也可以打包为\
  \ RPM，适用于安装在已经安装了 RPM 版本的 Webmin 的服务器上。你可以从 [www.webmin.com/makemodulerpm.pl](http://www.webmin.com/makemodulerpm.pl)\
  \ 下载名为 `makemodulerpm.pl` 的脚本，它可以通过自动创建 spec 文件将主题目录打包成 RPM。\n\n### 58.2 覆盖图像和程序\n\
  \n除了更改默认颜色外，主题还可以用于选择性地覆盖 Webmin 使用的任何图标或 CGI 程序。当选择一个主题时，它的目录将成为 Webmin Web 服务器的“叠加”（overlay）根目录。因此，如果你的主题子目录包含一个名为\
  \ `images/newlogo.gif` 的文件，它将替换主菜单上的标志，因为服务器会在查找顶层目录下的 `images/newlogo.gif` 之前先查找主题目录。\n\
  \n通过这种方式，任何模块图标都可以被覆盖，用于页面顶部标题的图像也是如此。例如，如果你的主题目录包含一个名为 `useradmin/images/icon.gif`\
  \ 的文件，它将作为主菜单上用户和组（Users and Groups）模块的图标。由于这种“替换”并没有真正更改原始图像，用户可以轻松地切换主题或返回默认主题。\n\
  \nCGI 程序也可以完全相同的方式进行覆盖。这可以通过在你的主题目录中放置自定义的 `index.cgi` 脚本来实现，例如更改主菜单的显示方式。然而，这种能力应该谨慎使用，因为对真实\
  \ CGI 的更改可能会由于其行为与被替换的程序不同而破坏你的自定义脚本。还需要注意，当执行主题 CGI 时，它将位于真实目录而非主题子目录。这意味着自定义的顶层\
  \ `index.cgi` 脚本将需要 `./web-lib.pl` 而不是 `../web-lib.pl`，就像真实的 `index.cgi` 一样。\n\n\
  如果你的主题确实替换了现有脚本，请务必仔细阅读它，以确保你的替代方案实现了相同的功能。在替换顶层 `index.cgi` 程序时，需要注意的事项包括：\n\n\n\
  \n\n`get_available_module_infos` 函数可以用于获取当前 Webmin 用户可用的模块列表，供生成任何图标表格使用。\n\n如果\
  \ `$gconfig{'gotoone'}` 设置为 `1` 且用户只有一个模块，你的 `index.cgi` 应该直接将浏览器重定向到该模块，而不是显示菜单。用户可以在\
  \ Webmin 配置（Webmin Configuration）模块的“首页选项”（Index Page Options）页面设置此项。\n\n如果设置了 `$gconfig{'nohostname'}`，则不应显示主机名或操作系统信息。这也可以在“首页选项”页面设置。\n\
  \n当全局变量 `$gconfig{'nofeedbackcc'}` 设置为 `2` 时，不显示反馈链接。这在 Webmin 配置模块的“用户界面”（User\
  \ Interface）页面进行配置。\n\n如果你的菜单程序通常会对模块进行分类，那么当设置变量 `$gconfig{'notabs'}` 时，应该关闭分类，以便所有模块出现在单个页面上。同样，这在“首页选项”页面设置。\n\
  \n如果你的程序在表格中排列模块图标，并且设置了变量 `$gconfig{'nocols'}`，则应将其用作显示的列数。\n\n如果设置了 `$gconfig{'deftab'}`\
  \ 且你的程序对模块进行分类，应使用它来决定默认打开哪个类别。\n\n`$config_directory/webmin.catnames` 中的条应用于获取用户定义的类别以及标准类别设置的不同名称。这可以在\
  \ Webmin 配置模块的“编辑类别”（Edit Categories）页面完成。\n\n如果你的程序显示注销链接，则只有在以下两个环境变量均未定义时它才应该出现。这两个变量都表示使用了某种形式的身份验证，使得注销变得不可能或无关。\n\
  \n`$ENV{'SSL_USER'}` 表示当前用户使用 SSL 客户端身份验证登录。\n\n`$ENV{'LOCAL_USER'}` 表示用户从本地连接，且其\
  \ UNIX 用户名与其 Webmin 登录匹配。\n\n如果设置了变量 `$main::session_id`，则 Webmin 处于会话（或 cookie）认证模式。你应该生成一个指向\
  \ `/session_login.cgi?logout=1` 的链接，标记为“注销”（Logout）或类似的内容。\n\n然而，如果未设置该变量，则 Webmin\
  \ 正在使用 HTTP 认证。相反，你的代码应该创建一个指向 `/switch_user.cgi` 的链接，标记为“切换用户”（Switch User），因为上面的普通注销链接将无法工作。\n\
  \n并非强制实现上述所有建议。但是，这会让你的主题行为更像 Webmin 自带的主题。\n\n### 58.3 主题函数（Theme Functions\n\n\
  在 Webmin 0.92 及以上版本中，可以通过在配置文件中添加类似 `functions=theme.pl` 的行，并在主题目录中创建一个 `theme.pl`\
  \ 脚本来覆盖某些常用的 HTML 生成函数。该脚本应包含以下一个或多个函数：\n\n`theme_header`：此函数将代替标准的头部（header）函数被调用，参数相同。它必须正确处理所有参数，并输出你想要用于页面标题等的任何\
  \ HTML。\n\n`theme_footer`：此函数将代替标准的页脚（footer）函数被调用，参数相同。如果你的 `theme_header` 函数为了布局目的打开了一个\
  \ HTML 表格，则此函数必须将其关闭，以确保 HTML 结构完整。\n\n`theme_error`：此函数将代替标准的错误函数被调用，参数相同。\n\n\
  这些函数赋予了你很大的权限，可以创建显著改变 Webmin 布局的主题。然而，为了让它们正常工作，处理所有传入参数的方式必须与标准函数完全相同。\n\n由于接收的参数较多且可以利用其他全局变量，`theme_header`\
  \ 函数是最复杂的。在编写它时，请考虑以下因素：\n\n- 所有参数都应该以与真实头部函数相同的方式进行检查和解释。\n- 你的函数不需要调用 `PrintHeader`，因为这会在调用它之前自动完成。它直接开始生成\
  \ HTML 即可。\n- 生成的 HTML 应该是有效且完整的。这意味着以 `<html>` 开始，紧接着是包含 `<title>` 的 `<head>` 部分，然后是\
  \ `<body>` 部分的开始。\n\n如果变量 `$gconfig{'sysinfo'}` 设置为 `0`，则在浏览器的状态栏中显示当前用户、主机名、操作系统和\
  \ Webmin 版本的信息。这可以通过生成如下 HTML 实现：\n\n```\n<script> \ndefaultStatus = \"fred logged\
  \ into Webmin 1.060 on www.example.com\";\n</script>\n```\n\n如果 `$gconfig{'sysinfo'}`\
  \ 设置为 `1`，则这些信息应附加到 `<title>` HTML 标签的页面标题中。如果 `$gconfig{'sysinfo'}` 设置为 `2`，则信息应显示在页面本身的标题下方的某个位置。如果设置为\
  \ `3`，则主机和登录详情不出现在任何地方。\n\n在所有情况下，都可以使用函数 `get_webmin_version` 获取 Webmin 版本，使用 `get_system_hostname`\
  \ 获取当前主机名。\n\n你的代码生成的 `<body>` 标签可能包含 `bgcolor=`、`link=` 和 `text=` 参数，其中包含全局变量 `$gconfig{'cs_page'}`、$gconfig{'cs_link'}`\
  \ 和 `$gconfig{'cs_text'}` 的值（如果已设置）。这确保了使用了用户在 Webmin 配置模块的用户界面页面设置的颜色偏好。不过，如果你的主题仅在特定配色下好看，可以忽略它们。\n\
  \n如果每个页面都包含“注销”或“切换用户”链接，那么如果设置了以下任何环境变量，它就不应显示：\n\n`$ENV{'SSL_USER'}`：当前用户使用 SSL\
  \ 客户端身份验证登录。\n\n`$ENV{'LOCAL_USER'}`：用户从本地连接，且其 UNIX 用户名与其 Webmin 登录匹配。\n\n`$ENV{'ANONYMOUS_USER'}`：此页面是在没有任何身份验证的情况下访问的。\n\
  \n如果设置了变量 `$ENV{'HTTP_WEBMIN_SERVERS'}`，你的页面头部应包含指向该变量中 URL 的链接，标记为“Webmin 服务器”（Webmin\
  \ Servers）。这是在 Webmin 服务器模块通过隧道连接时设置的，该 URL 指向源系统上的该模块。这为用户提供了返回服务器列表的方便。\n\n如果你的主题生成的标题是由图像组成的，当\
  \ `$gconfig{'texttitles'}` 设置为 `1` 时，应使用纯文本。Webmin 配置模块的用户界面页面上的设置控制此项。\n\n除非你的头部与默认设置非常相似，否则也应该定义\
  \ `theme_footer` 函数。它必须产生与 `theme_header` 输出匹配的闭合 HTML，随后是 `</body>` 和 `</html>`\
  \ 标签。请确保也解释并显示可以提供页脚函数的多个“返回”（return）链接。\n\n某些主题通过在头部函数中输出未闭合的 `<table>` 标签将所有页面内容放入表格中。如果全局变量\
  \ `$theme_no_table` 被设置，则应关闭此项，因为这意味着 CGI 程序将缓慢地产生逐步输出。许多浏览器在表格完全输出之前不会显示其内容。\n\n\
  同样，当设置 `$theme_no_table` 时，你的 `theme_footer` 函数不应产生闭合的 `</table>` 标签。\n\n显示 Webmin\
  \ 登录表单的特殊 CGI 程序 `session_login.cgi` 也会调用 `theme_header`。此时浏览器尚未登录 Webmin，因此无法访问你的头部中引用的任何图像。因此，当调用时前两个参数设置为\
  \ `undef` 时（在此情况下正是如此），你的函数不应产生任何 `<img>` 标签。或者它们应该始终指向特殊的 `/unauthenticated` URL\
  \ 路径，即使是未登录的客户端也始终允许访问。\n\n阅读 `web-lib.pl` 中的头部函数以及 `mscstyle3/theme.pl` 中的 `theme_header`\
  \ 函数，应该让你对各种参数和全局变量应该如何处理有一个良好的了解。\n\n### 58.4 总结\n\n\n\n\n阅读完本章（并阅读第 55 和 56 章）后，你能够创建主题来更改\
  \ Webmin 的外观和感受。你应该理解主题如何覆盖标准图形和 CGI 程序，以及它如何替换标准的页眉和页脚函数以完全改变每个页的外观。你现在也应该知道良好的主题必须遵循的要求，以便其行为与标准主题一致。\n\
  \n## 第 59 章：MSC 主题内部\n\n本章解释了 Webmin 默认主题的工作原理，该主题利用了主题开发者可以几乎所有功能。\n\n### 59.1\
  \ 主题设计与图形\n\n这个新主题从 0.92 版本开始一直是 Webmin 的默认主题，尽管旧的“经典”Webmin 外观和感受仍然可用。它使用了几乎所有与主题相关的功能，例如交替图形、CGI\
  \ 程序替换以及替换标准页眉和页脚函数的库。由于这些原因，如果你计划编写自己的主题，这是一个非常值得研究的对象。\n\n包含该主题的 `mscstyle3` 目录包含大多数标准模块的子目录，每个子目录都包含一个\
  \ `images/icons.gif` 文件。这些文件会覆盖 Webmin 主菜单上出现的对应标准模块图标。不存在其他覆盖图像（例如模块内部的图标），这意味着原始图像仍在使用中。\n\
  \n主题目录还包含一个 `images` 子目录，主题本身使用的所有图像都位于其中。显示在每个页面上的标题是由许多图像组成的，例如类别图标、类别标题字母、阴影背景和注销按钮。因为它们是特定于主题的，所以大多数图像在顶层\
  \ images 目录下没有对应的真实图像可以进行覆盖。\n\n像所有主题要求一样，这个主题也包含一个 `theme.info` 文件，其中包含其描述，该描述将出现在\
  \ Webmin 配置模块的“主题”页面上。它还包含一个 `config` 文件，该文件告诉 Webmin API 读取 `theme.pl` 并使用其中包含的函数来替换标准的页眉和页脚函数。它还包含几行以\
  \ `cs_` 开头的，用于设置表格背景和标题颜色。与其他较简单的主题不同，`config` 文件不需要指定任何交替页面文本或背景颜色，因为这些可以通过其 `theme_header`\
  \ 函数直接设置。\n\n### 59.2 index.cgi 程序\n\n由于此主题执行的大部分图形自定义都发生在 `theme.pl` 脚本中，其替换的 `index.cgi`\
  \ 程序与 Webmin 顶层目录的标准 `index.cgi` 区别不大。最大的区别在于它不输出任何特殊的索引页面标题或图像。相反，它仅通过 `get_available_module_infos`\
  \ 获取当前用户的可用模块列表，并使用它来构建当前类别下的图标表格。由于主题的 `theme_header` 函数也调用了此函数，列表可能已经存在全局变量 `@msc_modules`\
  \ 中。主题 CGI 程序在“原始”目录中执行，而不是它们实际所在的目录，因此 MSC 主题中的 `index.cgi` 程序可以使用 `require './web-lib.pl';`\
  \ 这一行。\n\n通过替换 `index.cgi` 就可以创建一个完全不同的主题，而不需要主题函数文件。标准的 Caldera 主题有一个 `index.cgi`\
  \ 脚本，它实际上会生成一个框架集（frame set），其中顶帧显示类别和模块，底显示模块内部的实际页面。主题可以包含不覆盖任何真实程序的 CGI 程序，这些程序仅作为主题用户界面的一部分使用。例如\
  \ Caldera 主题用于渲染顶帧的 `index_top.cgi` 程序。同样，此类程序在相应的真实目录中运行，而不是主题的子目录。\n\nMSC 主题的\
  \ `index.cgi` 和 `theme.pl` 脚本都利用 `%text` 和 `text` 函数来获取显示给用户的消息，而不是将它们硬编码到 Perl\
  \ 代码中。所有消息都来自 Webmin 顶层 `lang` 目录中相应的文件。如果你正在创建覆盖任何 CGI 程序或函数的自定义主题，也应该采取相同的方法，以利用\
  \ Webmin 已经包含的许多语言的现有翻译。\n\n### 59.3 theme_header 函数\n\n`mscstyle3` 目录下 `theme.pl`\
  \ 中的 `theme_header` 函数有效地替换了几乎所有 Webmin CGI 程序都会调用的标准页眉函数。与标准页眉不同，它为大多数页面顶部的模块类别图标列表生成\
  \ HTML，允许用户轻松地切换到不同的类别。它还输出了指向 `www.webmin.com` 的链接、注销和反馈按钮，以及“模块索引”和“模块配置”等标准链接。最后，生成的\
  \ HTML 将页面的其余部分放在几乎每个页面上看到的白色表格框内。\n\n类别表格通过调用 `get_available_module_infos` 生成，检查哪些类别实际存在，读取\
  \ `/etc/webmin/webmin.catnames` 文件以获取替代名称，然后为每个类别显示由字母图像组成的图标和名称。该主题拥有所有标准类别的图像，还有一个特殊的问号图像，用于发现非标准或用户定义的类别时。仅生成一个标准类别的固定表格是不可行的，因为用户可能仅某些某些类别中的模块。\n\
  \n由于类别标题可能是使用标准英语字母之外字符的不同语言，此主题包含了 ASCII 码在 32 到 255 之间的每个字母图像。任何其他使用字母图像的主题都应该这样做，以便在非英语语言中运行。对于某些语言（如中文和俄语），由于字符数以千计，为每个字符创建图像是不可能的。MSC\
  \ 主题检查全局变量 `$current_lang_info->{'titles'}`，如果没有设置，则生成纯文本类别标签。\n\n当 Webmin 处于会话验证模式（通过检查\
  \ `$main::session_id` 变量确定）时，每个页面的右上角都会添加注销图像按钮。然而，如果使用普通的 HTTP 身份验证，这将一个切换用户的按钮替换，该按钮链接到不同的\
  \ CGI 程序。旧的 Webmin 主题仅在主菜单上有这些链接。代码正确地检查了 `$ENV{'SSL_USER'}`、`$ENV{'LOCAL_USER'}`\
  \ 和 `$ENV{'ANONYMOUS_USER'}` 环境变量，其中任何一个被设置都表示不应出现注销或切换按钮。\n\n每个页面右上角还有一个反馈按钮，除非\
  \ `$ENV{'ANONYMOUS_USER'}` 被设置或全局或每用户配置指示不允许反馈。它链接到 `feedback_form.cgi` 并将当前模块名作为参数，这样发送到它的任何反馈都会自动与当前模块关联。如果你正在编写自己的主题，这是一个很好的主意。\n\
  \n在类别图标行下方有几个用于“模块索引”和“模块配置”等链接的小标签。`theme_header` 函数检查其参数和 `$ENV` 变量来确定显示哪些内容，就像标准页眉函数做的那样。最大的区别是永远不会产生\
  \ Webmin 索引链接，因为不需要。用户只需点击任何页面顶部的相应图标即可返回模块类别。\n\n在任何标签下方都是页面标题，它作为第一个参数传递给 `theme_header`\
  \ 函数。MSC 主题仅使用文本在页面主体上方的一个小标签中将其放置，这与旧 Webmin 主题将标题渲染为一系列字母图像不同。\n\n\n\n\n最后，主题通过产生\
  \ HTML 表格开始标签，将 CGI 在头部之后输出的页面内容放入一个大框中。如果设置了全局变量 `$theme_no_table` 则不执行此操作。相反，内容将仅作为页面主体的一部分。缓慢生成渐进式输出的\
  \ CGI 程序应该设置此变量，而具有自己的自定义 `theme_header` 函数的主题在适当的情况下应该遵循该设置。当然，如果你的主题没有使用这种表格进行布局，则可以忽略该变量。\n\
  \n### 59.4 `theme_footer` 函数\n\n此函数要简单得多，与 `web-lib.pl` 中的标准页脚函数没有太大区别。它只是打印 HTML\
  \ 以关闭由 `theme_header` 启动的表格（除非设置了 `$theme_no_table`），随后按照参数指定的输出返回上一页的链接。最后，生成所需的\
  \ `</body>` 和 `</html>` 标签以正确结束页面。\n\n在在你自己的主题中重写页脚函数时，请确保它能正确处理所有参数，因为可以提供多对返回链接和标题。如果你的主题主菜单对模块进行了分类，则应任何指向\
  \ `/` 的链接都替换为类似 `/?cat=$module_info{'category'}` 的链接，以便当使用此类链接返回主菜单时，能够显示当前模块的分类。大多数主题会在每个返回链接旁边放置箭头，但这不是强制要求的。你的主题仅可以使用文本链接、表单按钮或任何你能想到的东西。\n\
  \n如果传递页脚函数的最后一个参数为非零，它将不会产生页面结束的 HTML，而是只生成返回链接。MSC 主题的 `theme_footer` 函数会检查这一点（如果参数数量为奇数并执行正确的操作。你的主题也应该这样做，因为某些\
  \ Webmin 程序依赖这种行为来获取正确的布局。\n\n### 59.5 总结\n\n本章带你了解了 MSC 主题的内部工作，它利用了主题开发者可以使用的所有功能。阅读后，你应该能理解此主题如何创建每个页面顶部的分类图标，以及它如何在改变\
  \ Webmin 外观的同时，保留旧经典主题中提供的所有功能。\n\n## 第 60 章 Webmin API\n\n本章列出了 Webmin 模块可使用的所有函数，并解释了每个函数的参数和用途。\n\
  \n### 60.1 API 函数\n\n`web-lib.pl` 文件包含许多用于生成 HTML、解析文件以及 Webmin 模块需要执行的所有其他函数。Webmin\
  \ 1.060 中可用的函数按字母顺序列如下。每个函数的可能参数也显示在下方，其中可选参数括在 `[]` 中。参数列表中的文本 `...` 表示前一个参数可以重复任意次数。\n\
  \n`acl_filename()` 返回存储用户及其模块列表的文件名。仅供内部使用。\n\n`additional_log(*type, object, data)`\
  \ 当使用文件更改日志时，此函数为当前操作向日志中添加一个条目。如果 Webmin 没有自动为你执行此操作，则此函数非常有用，例如，当你的代码通过管道打开的语句运行了命令时。你可以这样使用它：\n\
  \n```\nopen(PIPE, \"somecommand |\");\n&additional_log(\"exec\", undef, \"somecommand\"\
  );\n```\n\n该函数的参数为：\n\n* `type`: 必须是 `exec`（用于记录运行的命令）、`modify`（用于文件更改）或 `sql`（用于已执行的\
  \ SQL 语句）之一。\n* `object`: 用于文件更改日志的修改文件的完整路径，否则为 `undef`。\n* `data`: 修改文件或已执行的 SQL\
  \ 语句的 shell 命令运行结果、diff 输出。\n\n`available_usermods(*allmods, usermods)` 给定一个所有模块和访问控制信息的列表，此函数返回当前\
  \ Usermin 用户有权访问的模块列表。这主要供 Usermin 主菜单和主题内部使用。`allmods` 必须是对 `get_all_module_infos`\
  \ 返回的模块详情数组的引用，而 `usermods` 必须是对 `list_usermods` 返回的数组的引用。\n\n`backquote_logged(*command)`\
  \ 此函数类似于 Perl 反引号（``````）运算符，因为它执行给定的命令并返回其输出，但它还会记录执行的命令以便稍后由 `webmin_log` 记录。\n\
  \n`check_ipaddress(*string)` 如果给定字符串是有效的 IP 地址，则返回 1，否则返回 0。\n\n`check_os_support(*moduleinfo)`\
  \ 确定 `moduleinfo` 中详细信息的模块是否在该系统上支持。这必须是一个哈希引用。\n\n`clean_environment()` 删除 `%ENV`\
  \ 全局变量中设置的所有条目，从 `HTTP_` 开始。这应该在你的 CGI 脚本开始之前调用。\n\n`close_http_connection(*handle)`\
  \ 关闭 `make_http_connection` 创建的 HTTP 会话。\n\n`complete_http_download(*handle, destfile*,\
  \ [*error*], [*callback*])` 此函数由 `http_download` 内部使用，不应直接调用。\n\n`copydata(*in,\
  \ out)` 从 `in` 文件句柄读取数据并写入 `out` 直到没有更多可读。\n\n`create_user_config_dirs()` 在 Usermin\
  \ 中，模块无法在其目录中存储持久数据，因为只有 root 用户可写。如果你的代码想按用户存储设置，则应该调用此函数，该函数会将 `$user_config_directory`\
  \ 设置为 `~currentuser*/modename` 并确保该目录存在。\n\n模块目录中的默认 `uconfig` 文件（`/etc/webmin`\
  \ 中的 `uconfig` 和用户模块目录中的 `config`）将按该顺序读取到 `%userconfig` 中。更多信息请参阅第 56.9 节“创建 Usermin\
  \ 模块”。\n\n`date_chooser_button(*dayfield, monthfield, yearfield*, [*formno])` 返回按钮的\
  \ HTML，点击该按钮允许用户选择日期。`dayfield` 参数必须是放置日的文本输入框名称，`monthfield` 是月份选择框的名称，`yearfield`\
  \ 是年份输入框的名称。如果给出了 `formno`，它是当前页面上包含这些输入的表单编号。\n\n`disk_usage_kb(*directory)` 返回给定\
  \ `directory` 及其所有文件使用的千字节数。\n\n`encode_base64(*string)` 返回以 base64 格式编码的给定 `string`，在每行末尾带有换行符（即使只产生一行）。\n\
  \n`error(*message)` 此函数通常由处理表单输入的 CGI 程序使用，通过显示 `message` 参数并退出来通知用户无效输入或某些处理错误。它假设已先调用了\
  \ `error_setup` 来设置错误消息的第一部分，该参数将附加在该部分之后。示例演示了这一点。\n\n```\n&error_setup(\"Failed\
  \ to save user\");\nif (!$in{'name'}) { &error(\"Missing username\"); }\nif ($in{'name'}\
  \ =~ /a/) { &error(\"'$in{'name'}' is not a valid username\"); }\n```\n\n\n\n\n\
  `error_setup(*message*)` 任何调用错误的代码都应该先调用此函数，以指定将 `message` 参数置于所有后续显示的错误信息之前。\n\n\
  `fast_wait_for(*handle, string*, ...)` 此函数的工作原理与 `wait_for` 相似，但它匹配的是精确字符串而不是正则表达式。\n\
  \n`file_chooser_button(*field, type, form*)` 返回一个 Javascript 按钮的 HTML，允许用户在服务器上选择文件或目录。参数为：\n\
  \n* `field` - 放置存放所选文件名的 HTML 字段名称。\n* `type` - 0 表示文件选择器，1 表示目录选择器。\n* `form` -\
  \ 通常情况下，包含该字段的表单编号，为 0。\n\n`filter_javascript(*html*)` 给定一个整个网页的 `html`，此函数会尝试剥离或禁用所有\
  \ Javascript 并返回结果。如果你的模块显示了来自不可信源的 HTML（例如邮件消息或服务器上的文件），则应该对该 HTML 调用此函数，以消除恶意\
  \ Javascript 带来的潜在安全风险，这些恶意脚本可能会捕获当前 Webmin 登录的会话密钥。\n\n`find_byname(*name*)` 给定一个\
  \ `name`，搜索匹配该名称的进程并返回它们的 PID。如果没有找到，则返回一个空列表。\n\n`flush_file_lines()` 通过调用 `read_file_lines`\
  \ 函数，将请求的任何文件的行数组写回磁盘。每行末尾都会添加一个新的换行符。\n\n`flush_webmin_caches()` 清除 `web-lib.pl`\
  \ 使用的所有内存和磁盘缓存。此函数实际上仅供内部使用。\n\n`footer(*link, text*, [*link, text*], ..., [*noendbody*])`\
  \ 此函数输出一个指向左侧的小箭头和一个带有文本“返回 `text`”的链接。任何调用了 header 的 CGI 程序都必须在结束时调用此函数，以正确完成页面的\
  \ HTML 输出。\n\n在 Webmin 0.92 及以上版本中，你可以指定多个链接和文本参数，让函数生成多个页脚链接，如下：\n\n```perl\n&footer(\"\
  \", \"module index\", \"list.cgi\", \"users list\");\n```\n\n如果 `noendbody` 参数设置为\
  \ 1，footer 函数将不会产生 `</body>` 和 `</html>` 标签来正确结束页面。如果你的程序需要在正常页脚之后输出某些内容，则可以使用它。但是，你必须自己打印这些标签，以确保\
  \ HTML 页面完整完成。\n\n`foreign_call(*module, function*, [*arg*], ...)` 这调用另一个模块中的函数并返回结果。`module`\
  \ 参数必须是模块名，`function` 必须是在该模块中调用的函数名，任何剩余参数必须是传递给该函数的参数。例如：\n\n```perl\n&foreign_require(\"\
  proc\", \"proc-lib.pl\");\n@procs = &foreign_call(\"proc\", \"list_processes\");\n\
  &foreign_call(\"proc\", \"renice_proc\", $pid, -10);\n```\n\n示例调用 proc 模块获取进程列表，然后更改某些进程的优先级。\n\
  \n在 Webmin 0.960 及以上版本中，你可以使用标准的 Perl 语法调用其他模块中的函数，例如：\n\n```perl\n&foreign_require(\"\
  proc\", \"proc-lib.pl\");\n@procs = &proc::list_processes();\n&proc::renice_proc($pid,\
  \ -10);\n```\n\n`foreign_check(*module*)` 检查其他 `module` 是否存在以及是否受当前操作系统支持。如果是，返回\
  \ `1`，否则返回 `0`。你应该在调用 `foreign_call` 访问其他模块的函数之前调用此函数。\n\n`foreign_config(*module*)`\
  \ 返回一个包含指定其他 `module` 配置选项的哈希表，类似于 `init_config` 为该模块设置的 `%config` 哈希表。\n\n`foreign_require(*module,\
  \ file*)` 在使用 `foreign_call` 调用另一个模块的函数之前，你必须使用此函数引入适当的库。`module` 参数是你想要调用函数的模块名，而\
  \ `file` 参数是该模块目录下库文件的名称。\n\n`ftp_command(*command, expected*, [*error*])` 此函数由\
  \ `ftp_download` 函数用于向已连接的 FTP 服务器发送命令。你的模块代码永远不应调用此函数。\n\n`ftp_download(*host,\
  \ file, destination,* [*error*], [*callback*])` 与某些 `host` 建立 FTP 连接并请求下载 `file`。该文件的内容将存储在给定的\
  \ `destination` 文件中。如果配置了 FTP 代理，下载将通过代理进行。可选的 `error` 和 `callback` 参数仅在 Webmin\
  \ 0.93 及以上版本中支持，其行为与早前说明的 `http_download` 函数完全相同。\n\n`generate_icon(*image, title,\
  \ link,* [*href*], [*width*], [*height*])` 输出一个带有给定 `image` 且下方带有 `title` 的图标 HTML，并作为指向\
  \ `link` 参数中相对或绝对 URL 的超链接（如果已设置）。如果提供了 `href` 参数，它将包含在 `<a href=>` 标签中，以便你可以将链接指向不同的帧。除非给出了\
  \ `width` 和 `height` 参数，否则图标的大小将设置为 48 x 48。\n\n`get_all_module_infos(*cachemode*)`\
  \ 返回一个哈希引用列表，每个引用都包含一个已安装模块的详情，格式与标准 `get_module_info` 函数返回的格式相同。为了避免从每个模块读取一个文件，此函数通常将模块详情缓存在\
  \ `/etc/webmin/module.infos.cache` 文件中，该文件的读取速度快得多。\n\n`cachemode` 参数设置为 0 时，对已知模块进行正常缓存。如果设置为\
  \ 1，则完全不使用缓存。如果设置为 2，则会读取任何现有缓存但不进行写入。\n\n`get_available_module_infos(*cachemode*)`\
  \ 这与 `get_all_module_infos` 类似，但仅返回当前 Webmin 或 Usermin 用户可用的模块，而不是系统上的每一个模块。`cachemode`\
  \ 参数被传递给 `get_all_module_infos`，因此含义完全相同。\n\n`get_miniserv_config(*hashref*)` 在\
  \ `hashref` Perl 哈希引用参数中填充来自 Webmin 内置 Web 服务器 `miniserv.pl` 的配置。这通常从 `/etc/webmin/miniserv.conf`\
  \ 读取。相反的函数是 `put_miniserv_config`，用于写入新配置。\n\n`get_module_acl([user], [*module*])`\
  \ 返回一个包含给定 `user` 和 `module` 的 ACL 的哈希表。如果没有指定用户，则使用当前用户。如果没有指定模块，则调用模块即为 `user`。有关模块\
  \ ACL 的更多信息，请参见第 56.1 节“模块访问控制”。\n\n`get_module_info(*module, noclone*)` 返回一个包含给定\
  \ `module` 信息的哈希表，键为 `desc`、`os_support` 和 `dir`。如果 `noclone` 参数设置为 1，请求克隆信息时将返回底层模块的详情而不是克隆的详情。\n\
  \n`get_system_hostname()` 返回运行 Webmin 的系统的主机名。它比标准的 hostname 函数更可靠，因为它尝试了多种不同的方法。\n\
  \n`get_theme_info(*theme*)` 这与 `get_module_info` 类似，但从 `theme.info` 文件返回 `theme`\
  \ 的详情。\n\n`get_webmin_version()` 返回运行此模块的 Webmin 版本。\n\n`group_chooser_button(*field,\
  \ multiple, form*)` 类似于 `user_chooser_button` 函数，但用于选择组。\n\n`has_command(*command*)`\
  \ 在 Webmin 的 PATH 中搜索给定的 `command`。找到则返回 1，未找到则返回 0。如果指定了绝对路径，函数将检查其是否存在以及是否具有执行权限。\n\
  \n`header(*title, image*, [*help*], [*config*], [*noindex*], [*noroot*], [*text*],\
  \ [*header*], [*body*], [*below*])` header 函数被几乎所有程序用于输出 HTTP Header 行 (Content-type:\
  \ text/html)、HTML 标题、背景和标题图像。传递给此函数的参数为：\n\n* `title` - 页面的 HTML 标题。也用作标题图像的 ALT\
  \ 文本。\n\n\n\n\n\n`image`: 显示在页面顶部的图像 URL，而不是 `title` 中的文本。这应该始终设置为空字符串。\n\n`help`:\
  \ 如果定义了此参数，则会在标题左侧添加一个帮助（Help）链接，链接到指定的帮助页面。\n\n`config`: 如果此参数不为零，则会在标题左侧添加一个模块配置（Module\
  \ Config）链接。该链接指向一个 CGI 程序，允许用户根据 `config.info` 定义编辑此模块的配置。更多信息请参见第 55.4 节“模块配置”。\n\
  \n`noindex`: 默认情况下，头部函数会在标题图像左侧添加一个模块索引（Module Index）链接，指向该模块的索引。如果给出此参数且不为零，则不显示此链接。\n\
  \n`noroot`: 默认情况下会在标题图像左侧添加一个指向 Webmin 主菜单的 Webmin 链接。如果给出此参数，将抑制该链接的添加。\n\n`text`:\
  \ 显示在标题图像右侧的 HTML。只要适应有限的区域，可以是任何你喜欢的内容。\n\n`header`: 显示在页面 `<head>` 部分的 HTML。\n\
  \n`body`: 要包含在 `<body>` 标签中的额外 HTML 标签。\n\n`below`: 显示在头部下方的 HTML。这通常用于模块的主页，以显示该模块正在配置的服务器版本。\n\
  \n如果使用的主题定义了自身的 `theme_header` 函数，则上述所有参数都将传递给该函数。这意味着它们的解释可能完全不同，并且根据所使用的主题，提供的标题和其他信息可能会被放置在意想不到的位置。\n\
  \n如果此函数由 Usermin 模块调用，并且设置了 `config` 参数，你的代码必须预先调用了 `create_user_config_dirs` 来设置\
  \ `~/.usermin/*modulename` 目录。此时，头部中不会包含模块配置链接，而是包含一个名为“偏好”（Preferences）的链接，允许用户编辑他们自己的该模块个人设置。可以更改的实际设置由模块目录下的\
  \ `uconfig.info` 文件决定，其格式与 `config.info` 相同。\n\n某些主题具有自定义的头部函数，会将标题后的所有 HTML 输出放在一个表格中。遗憾的是，某些浏览器在生成\
  \ HTML 结束标签之前不会显示表格内容。这意味着，如果你的 CGI 程序正在产生某些渐进输出（例如日志文件的新内容），或者运行时间很长，那么在完成之前用户将什么也看不到。为了避免这种情况，应在调用\
  \ `header` 之前将全局变量 `$theme_no_table` 设置为 1，表示页面内容不应放在 HTML 表格中。\n\n`help_file(*module,\
  \ page*)`: 返回包含指定 `module` 中指定帮助 `page` 的 HTML 的文件完整路径。如果存在用户选择语言的文件，则优先使用而非英语。此函数主要供内部使用。\n\
  \n`help_search_link(*terms, section,* ...*)`: 返回一个指向系统文档模块链接的 HTML，用于搜索给定的 `terms`。`terms`\
  \ 之后的 `section` 参数决定了搜索哪些文档，每个参数可以是以下内容之一：\n\n- `man`: 手册页\n- `doc`: 软件包文档\n- `kernel`:\
  \ 内核文档\n- `howto`: HOWTO 文档\n- `kde`: KDE 文档\n- `perl`: Perl 模块文档\n- `help`: Webmin\
  \ 帮助\n- `google`: Google 搜索引擎\n\n此函数的返回值可以作为第 7 个参数传递给模块主页上的 `header` 函数，从而创建一个指向手册页或\
  \ README 文件中额外信息的链接。例如：\n\n```\n&header(\"The Foo Module\", undef, undef, 1, 1,\
  \ undef,\n&help_search_link(\"foo\", \"man\", \"doc\", \"google\"));\nhlink(text,\
  \ page)\n```\n\n`hlink(text, page)`: 返回一个指向帮助页链接的 HTML。`text` 参数是链接的文本，`page` 是帮助页的名称。更多信息请参见第\
  \ 55.7 节“在线帮助”。\n\n`html_escape(*string*)`: 给定一个文本 `string`，它将字符 `<`、`>` 和 `&` 分别转换为\
  \ `&lt;`、`&gt;` 和 `&amp;` 等。当来自可能包含 HTML 字符的特定源的文本要包含在模块生成的页面时，应使用它，以确保文本按预期方式显示，并使潜在的恶意\
  \ HTML 代码（可能包含 Javascript）中和。\n\n`http_download(*host, port, page, destination,*\
  \ [*error], [*callback*])`: 对 Web 服务器 `host` 和 `port` 建立 HTTP 连接并请求 `page`。该页面的内容随后存储在\
  \ `destination` 文件中。如果用户配置了 Webmin 使用代理服务器，则 HTTP 请求将通过该代理进行。\n\n可选的 `error` 和 `callback`\
  \ 函数仅在 Webmin 0.93 及以上版本中支持。如果提供了 `error`，它是一个标量的引用，如果下载失败，将被设置为错误消息，而不是简单地调用标准错误函数。\n\
  \n`callback` 参数可以是指向函数的引用，该函数将在下载过程的各个阶段被回调。当被调用时，第一个参数表示状态，第二个参数表示特定的附加信息。可能的的状态码有：\n\
  \n- `1`: 已连接服务器。如果请求的 URL 是重定向，第二个参数为 1；如果是普通文件，则为 0。\n- `2`: 下载开始。如果已知正在下载的文件大小，第二个参数为该大小。\n\
  - `3`: 已接收某些数据。第二个参数是目前已接收的数据量。每接收 1kb（或更少）数据就会调用一次。\n- `4`: 下载完成。URL 已完全下载。不提供第二个参数。\n\
  - `5`: 已重定向到新 URL。第二个参数是请求被重定向到的新 URL。\n\n如果你只想以某些 Webmin 模块代码的方式显示下载进度，可以将标准函数\
  \ `progress_callback` 作为第 6 个参数传递给 `http_download`。但是，你必须将全局变量 `$progress_callback_url`\
  \ 设置为正在下载文件的 URL 或名称，以便用于进度消息。\n\n`include(*file*)`: 将给定 `file` 的内容复制到标准输出（STDOUT）。\n\
  \n`icons_table(*links, titles, icons,* [*columns], [*href], [*width], [*height*])`:\
  \ Webmin 主页和许多模块使用图标网格，每个图标链接到不同的选项、域、共享或相关内容。此函数根据给定的参数列表生成图标网格。`links` 是 URL 数组的引用，`titles`\
  \ 是显示在图标下方消息数组的引用，`icons` 是图像 URL 数组的引用。\n\n如果给了 `columns` 参数，它指定了每行显示的图标数量。默认每行包含四个图标。`href`、`width`\
  \ 和 `height` 参数的含义与 `generate_icon` 函数完全相同，该函数实际上是调用后者来创建每个图标的。\n\n`indexof(*value,\
  \ array*)`: 返回 `array`（由其余参数组成）中某个 `value` 的索引，如果没有找到则返回 -1。\n\n`init_config()`:\
  \ 初始化全局配置变量。更多信息请参见第 55.3 节“模块 CGI 程序”。请注意，在 0.73 版本之前，`init_config` 函数必须将模块名称作为参数传递。从\
  \ 0.73 版本开始，模块名会自动计算。\n\n`is_under_directory(*directory, file*)`: 如果给定的 `file` 在指定的\
  \ `directory` 下，返回 1，否则返回 0。两者都必须是绝对路径。如果文件实际上是软链接，则其目标必须在目录下，函数才会返回 1。这对于限制用户允许编辑文件的目录的模块非常有用。\n\
  \n\n\n\n`kill_byname(*name, signal*)` 给定名称，该函数搜索匹配该 `name` 的进程并使用指定的 `signal` 杀死它们。\n\
  \n`kill_byname_logged(*name, signal*)` 类似于 `kill_byname` 函数，但还会记录执行的命令，以供 `webmin_log`\
  \ 后记录日志。\n\n`kill_logged(*signal, pid*, ...)` 此函数与 Perl 的 kill 语句完全相同，但还会记录信号和 PID\
  \ 以供 `webmin_log` 后记录日志。\n\n`list_languages()` 返回一个哈希引用列表，每个引用包含所支持的语言的详细信息。此函数通常仅供内部使用。\n\
  \n`list_usermods()` 返回一个数组，其中包含关于哪些 Usermin 用户可以访问某些模块的信息。仅供内部使用。\n\n`load_language(*module*)`\
  \ 返回一个包含某些 `module` 翻译内容的哈希表，类似于 `init_config` 为该模块设置的 `%text` 哈希表。\n\n`load_theme_library()`\
  \ 如果当前主题存在 `theme.pl` 文件且尚未被加载，则读取该文件。这是另一个仅供内部使用的函数，模块编写者不应调用它。\n\n`lock_file(*file*)`\
  \ 此函数在必要时获取给定 `file` 的排他锁，如果锁被另一个程序占用，则会等待锁被释放。锁定是通过创建一个包含进程 PID 的 `.lock` 文件实现的，这保证了锁不会被死进程永久占用。可以在文件、目录和符号链接上创建锁，并且应该在创建、修改或删除这些内容之前锁定。\n\
  \n`make_date(*time_t*)` 给定一个 UNIX `time_t` 值（自 1970 年以来的秒数），返回 dd/mm/yyyy hh:mm\
  \ 格式的日期时间字符串。\n\n`make_http_connection(*host, port, ssl, method, page*)` 这是一个建立\
  \ HTTP 连接的通用函数，可能使用 SSL。如果你在 Webmin 中配置了代理服务器，该函数将尝试通过代理连接到指定的 `host` 和 `port`（如果设置了\
  \ `ssl` 标志，则使用 SSL 模式）。然后它将使用指定的 `method` 和 `page` 发起 HTTP 请求，如果没有遇到错误，则返回会话句柄引用。如果连接过程中发生任何错误，将返回标量错误字符串。\n\
  \n返回的会话句柄应配合 `read_http_connection` 和 `write_http_connection` 函数使用，以发送额外的头部并读取响应头部和正文。完成后，应使用句柄调用\
  \ `close_http_connection` 函数。\n\n`no_proxy(*host*)` 如果 Webmin 直接连接到指定的 `host` 发送\
  \ HTTP 请求，则返回 1。如果使用代理，则返回 0。这主要供各种 HTTP 相关函数内部使用。\n\n`open_socket(*host, port,\
  \ handle,* [*error*])` 此函数尝试使用给定的 Perl 文件 `handle` 打开指定的 `host` 和 `port` 的 TCP 连接。该函数返回后，调用者可以对句柄进行读写以与远程系统通信，并在完成后调用\
  \ `close`。如果无法连接，将调用错误函数并传递解释错误原因的消息，除非此函数的 `error` 参数被设置为标量引用。如果是这样，错误消息将放在该变量中，函数返回\
  \ 0（而不是通常的返回值 1）。\n\n`other_groups(*user*)` 返回 UNIX `user` 所属的次级组列表。\n\n`PrintHeader([*charset*])`\
  \ 输出所有生成 HTML 的 CGI 程序必须生成的 Content-type: text/html 头部（可能还有其他）。如果提供了 `charset` 参数，它将指定\
  \ HTML 的字符集。此函数通常不直接调用。相反，`header` 函数将根据用户的语言使用正确的字符集为你完成操作。\n\n`progress_callback(*action,\
  \ details*)` 此函数存在是为了传递给 `http_download`，以便打印下载进度报告。在你的代码中直接调用它没有意义。\n\n`put_miniserv_config(*hashref*)`\
  \ 将来自哈希引用参数 `hashref` 的配置写入 Webmin 内置 Web 服务器使用的配置文件中。然而，你需要调用 `restart_miniserv`\
  \ 才能使更改生效。\n\n`ReadParse()` 此函数获取传递给程序程序的任何 CGI 参数（来自表单输入或 URL 中 `?` 之后），并将它们放置在\
  \ `%in` 关联数组中。如果一个 CGI 参数有多个值（例如来自允许多选的列表），则这些值将用空字符（Perl 中的 `\\0`）分隔。\n\n`ReadParseMime()`\
  \ 在编写处理 `enctype=multipart/form-data` 表单输入的 CGI 程序时，必须调用此函数而非 `ReadParse` 来填充 `%in`\
  \ 数组。对于任何使用文件上传输入的表单，你必须添加 `enctype` 标签。\n\n`read_acl([*hashref1*], [*hashref2*])`\
  \ 此函数获取 Webmin 用户有权访问的列表，并将其存储在两个参数引用的哈希表中。`hashref1` 将填充为双键哈希，其中第一个键是用户名，第二个键是模块名。`hashref2`\
  \ 将填充为用户名，每个用户名指向该用户拥有的模块数组。例如：\n\n```\n&read_acl(\\%hash1, \\%hash2);\nprint \"\
  User $remote_user has access to Users and Groups<br>\\n\"\nif ($hash1{$remote_user,'useradmin'});\n\
  print \"User $remote_user has access to \",\njoin(\" \", @{$hash2{$remote_user}}),\"\
  <br>\\n\";\n```\n\n`read_env_file(file, hash)` 将格式为 `key`=*value* 或 `key`=\"*value*\"\
  ` 的 `/bin/sh` 变量赋值 `file` 读取到给定的哈希引用中。\n\n`read_file(file, hash)` 将格式为 `key`=*value*\
  \ 的 `file` 读取到给定的哈希引用中。\n\n`read_file_cached(*file, hash*)` 类似于标准的 `read_file` 函数，但它保留了读取文件的缓存以避免重复读取。这目前主要供内部使用。\n\
  \n`read_file_lines(*file*)` 返回一个数组引用，其中包含给定 `file` 中的行，并删除了所有换行符。调用者随后可以使用 `push`\
  \ 和 `splice` 等函数通过添加、删除或更改行来修改此数组。然后可以调用 `flush_file_lines` 将更改写回文件。\n\n`read_http_connection(*handle*,\
  \ [*amount*])` 从 `make_http_connection` 返回的会话 `handle` 读取单行，或者如果提供了 `amount` 参数，则读取指定的字节数。\n\
  \n`redirect(*url*)` 给定相对或绝对的 `url`，此函数输出一个 HTTP 头部将浏览器重定向到该 URL。如果如果在 `header` 之后调用，此函数将不起作用，反之亦然。\n\
  \n`remote_error_setup(*handler*)` 当其中一个 `remote_` 函数遇到错误（例如远程 Webmin 服务器宕机）时，通常会调用标准错误函数，这将导致你的\
  \ CGI 程序退出。如果你使用此函数注册了一个备用错误 `handler`，则将调用它，并且远程函数将返回其返回值。\n\n`remote_eval(*server,\
  \ module, code*)` 在远程 Webmin `server` 上的给定 `module` 上下文中执行特定的 Perl `code`。如果你想执行通过调用\
  \ `remote_foreign_call` 无法实现的操作，这可能非常有用。然而，在使用此函数之前，必须先对相同的服务器和模块调用 `remote_foreign_require`。\n\
  \n`remote_finished()` 任何使用过其他 `remote_` 函数的 CGI 在完成调用后都应调用此函数，以清理与远程服务器的连接。这并非绝对必要，因为连接在无活动\
  \ 30 秒后将超时。使用快速 RPC 时，也永远不需要调用它，因为远程会会在你的 CGI 结束时立即退出。\n\n\n\n\n\n`remote_foreign_call(*server,\
  \ module, function, [*arg*],...)` 此函数调用另一个 `server` 上某个 `module` 中的 `function` 并返回结果。在尝试使用此函数之前，你必须已经对同一个\
  \ `server` 和 `module` 调用了 `remote_foreign_require`。`function` 参数是远程模块中要调用的函数名称，其后的\
  \ `arg` 参数是之后传递给该函数的参数。例如：\n\n```\n&remote_foreign_require(\"www.blah.com\", \"\
  apache\", \"apache-lib.pl\");\n@servers = &remote_foreign_call(\"www.blah.com\"\
  , \"apache\", \"get_config\");\n```\n\n如示例所示，`remote_foreign_call` 函数返回远程服务器函数返回的所有内容。\n\
  \n`remote_foreign_check(*server, module*)` 此函数检查远程 Webmin `server` 上是否存在并是否支持某个\
  \ `module`。如果是，则返回 1，否则返回 0。如果不确定，你应该在调用 `remote_foreign_call` 访问其他服务器上其他模块的函数之前调用此函数。\n\
  \n`remote_foreign_config(*server, module*)` 此函数与 `foreign_config` 类似，但用于从远程 `server`\
  \ 获取 `module` 配置。然而与 `foreign_config` 不同，它返回的是一个哈希引用（hash reference）而不是哈希（hash）。\n\
  \n`remote_foreign_require(*server, module, file*)` 在使用 `remote_foreign_call` 调用另一个服务器上模块的函数之前，你必须使用此函数引入相应的库。`server`\
  \ 参数是远程 Webmin 服务器的主机名，`module` 参数是你想要从中调用函数的模块名称，`file` 参数是该模块目录下的库文件名。\n\n`remote_write(*server,\
  \ localfile*, [*remotefile*])` 如果在进行远程函数调用时，需要向远程 `server` 传输大量数据，则应该使用此函数，而不是通过\
  \ `remote_foreign_call` 传递标量（scalar）。`localfile` 参数是调用该函数的服务器上的一个文件，`remotefile`\
  \ 参数是远程服务器上的文件名，`localfile` 的内容将复制到该文件中。如果省略了 `remotefile`，则将选择一个随机的临时文件名并由函数返回。\n\
  \n`remote_read(*server, localfile, remotefile*)` 这是 `remote_write` 的相反操作，它将数据从远程\
  \ Webmin 服务器上的文件复制到本地文件。\n\n`remote_rpc_call(*server, command*)` 此内部函数由所有其他远程函数使用，用于实际与指定的\
  \ `server` 打开连接并发送 `command` 结构以告诉它执行什么。你不应该直接调用它。\n\n`rename_logged(old, new)`\
  \ 此函数类似于 Perl 的 `rename` 函数重命名文件，但还会记录该事件以便稍后由 `webmin_log` 记录。虽然你可以在重命名之前锁定 `old`\
  \ 和 `new` 文件，但这会产生两个且相当无用的文件差异。\n\n`replace_file_line(*file, line, [*newline*],...)`\
  \ 此函数从 `file` 中删除一行 `line`，并用 `newline` 参数中的零或多个新行替换它。这是通过将整个文件读取到内存并写入修改后的版本来实现的。\n\
  \n`reset_environment()` 将环境恢复到上一次调用 `clean_environment` 之前的状态。\n\n`resolve_links(*file*)`\
  \ 给定一个路径中可能包含符号链接的 `file` 名称，此函数返回其所指的实际文件名。与 Perl 的 `readlink` 函数不同，它还会解析路径上目录中的符号链接。\n\
  \n`restart_miniserv()` 重启 Webmin 内置 Web 服务器，强制其重新加载配置。此函数主要由 Webmin 配置模块使用，对普通模块编码员来说可能用处不大。\n\
  \n`same_file(*file1, file2*)` 如果通过比较 inode 号，发现 `file1` 和 `file2` 指向同一个实际文件，则返回\
  \ 1。\n\n`save_module_acl(*acl*, [*user*], [*module*])` 保存给定的模块 ACL 哈希。如果没有指定 `user`，则使用当前用户。如果未指定\
  \ `module`，则使用调用者的模块。有关模块 ACL 的更多详细信息，请参阅第 56.1 节“模块访问控制”。\n\n`seed_random()` 为\
  \ Perl 随机数生成器种子，以便对 `rand` 的调用返回真正的随机结果。如果可用 `/dev/urandom`，则使用它，否则使用当前时间和进程 ID。\n\
  \n`serialise_variable(*variable*)` 将给定的 Perl 标量或引用 `variable` 转换为字符串。此函数主要用于各种与\
  \ RPC 相关的远程函数编码参数和返回值，但你可能会发现它对于持久化存储 Perl 对象有用。`unserialise_variable` 函数实现相反。\n\
  \n`switch_to_remote_user()` 此函数应仅由 Usermin 模块中的代码调用，它会将当前进程的 UID 和 GID 切换为与当前 Usermin\
  \ 登录匹配的 UNIX 用户。如果你的 Usermin 模块可以使用普通用户权限运行（大多数模块都可以），你应该在模块库的 `init_config` 之后调用此函数。\n\
  \n除了切换 UID 之外，此函数还将全局变量 `@remote_user_info` 设置为该 UNIX 用户的详细信息。\n\n`sysprint(*handle,\
  \ value, ...)` 调用 Perl 的 `syswrite` 函数向 `handle` 输出 `value`。\n\n`system_logged(*command*)`\
  \ 此函数与 system 语句相同，但会记录执行的 `command` 以供稍后由 `webmin_log` 记录。\n\n`tempname()` 返回 `/tmp`\
  \ 下一个可作为临时文件。该路径始终对 root 可写，但对世界可读。\n\n`terror(*string*)` 它是错误函数和 `%text` 数组的组合。调用\
  \ `&terror('foo')` 等同于 `&error($text{'foo'})`。此函数之所以存在，是为了在国际化（internationalized）模块中调用错误更方便。\n\
  \n`text(*message*, [*parameter*],...)` 此函数在相应的语言文件中查找给定的 `message`，用剩余的 `parameter`\
  \ 替换 `$1`、`$2` 等并返回结果。更多信息请参见第 56 章“国际化”。\n\n`to_ipaddress(*hostname*)` 给定一个 `hostname`，此函数返回表示该主机的字符串\
  \ `10.254.1.100`，如果未找到则返回 `undef`。如果参数已经是 IP 地址，则原样返回。\n\n`trunc(*string, length*)`\
  \ 此函数截断由空格分隔的 `string`，使其小于或等于给定的 `length`，而不会切断单词的一部分。它对于固定宽度的输出输出。\n\n`unique(*value,\
  \ ...)` 接收一组 `value` 并返回一个去重后的数组。\n\n`unix_group_input(*field, group*)` 返回一个名为 `field`\
  \ 的文本框，用于输入组名，旁边有一个按钮，可以弹出一个选择组的窗口。`group` 参数设置字段的初始值。\n\n`unix_user_input(*field,\
  \ user*)` 返回一个名为 `field` 的文本框，用于输入用户名，旁边有一个按钮，可以弹出一个选择用户的窗口。`user` 参数设置字段的初始值。\n\
  \n`unlock_all_files()` 此函数通过多次调用 `unlock_file` 释放当前程序持的所有锁。\n\n`unlock_file(*file*)`\
  \ 释放由 `lock_file` 获取的 `file` 锁。如果启用了文件更改日志，则在调用此函数时会对新旧文件内容进行差异比较。该比较使用标准的 `diff`\
  \ 命令完成。\n\n\n\n\n\n`unserialise_variable(*string*)` 将由 `serialise_variable` 创建的\
  \ `string` 转换回 Perl 标量或某种类型的引用。\n\n`un_urlize(*string*)` 此函数解码给定 `string` 中的特殊 URL\
  \ 转义序列，并返回原始文本。例如，`hello%20world%21` 将被转换为 `hello world!`。\n\n`urlize(*string*)`\
  \ 将任意 `string` 转换为适用于 URL 的格式。例如，`don't jump!` 将被转换为 `don%27t%20jump%21`。\n\n`user_chooser_button(*field,\
  \ multiple, form*)` 此函数返回一个 Javascript 按钮的 HTML，该按钮允许 Webmin 用户从服务器上的用户中选择一个或多个用户。参数如下：\n\
  \n* `field` 将所选用户或多个用户的 HTML 文件名。\n* `multiple` 0 表示选择单个用户，1 表示选择多个用户。\n* `form`\
  \ 包含字段的表单编号，通常为 0。\n\n`wait_for(*filehandle, regexp, ...*)` 给定一个 Perl `filehandle`\
  \ 和 `regexp` 参数中的正则表达式列表，此函数会从文件句柄读取内容，直到其中一个表达式匹配。然后它将返回正则表达式的索引，并将 `@matches`\
  \ 全局数组填充为匹配表达式中任何括号部分的值。如果在读取输入时发生错误（可能是因为没有更多内容读），则返回 -1。这对于与通常需要用户输入的程序或服务器进行交互非常有用，如下例：\n\
  \n```\n&open_socket(\"somehost\", 23, TELNET);\nselect(TELNET);\n$| = 1;\nselect(STDOUT);\n\
  while(1) {\n  my $rv = &wait_for(TELNET, \"login:\", \"password:\", \">\");\n  if\
  \ ($rv == 0) {\n    print TELNET \"fred\\n\";\n  }\n  elsif ($rv == 1) {\n    print\
  \ TELNET \"mypassword\\n\";\n  }\n  elsif ($rv == 2) {\n    print TELNET \"ls -la\\\
  n\";\n    close(TELNET);\n    break;\n  }\n  else {\n    &error(\"Telnet failed!\"\
  );\n  }\n}\n```\n\n`webmin_log(*action, type, object, params*)` 如第 56 章的“操作日志”部分所述，此函数将标识调用程序所执行操作的给定参数写入详细日志文件。\n\
  \n`write_env_file(*file, hash, export*)` 此函数将 `hash` 引用的内容按 `/bin/sh` 变量赋值格式写入指定的\
  \ `file`。如果 `export` 参数为非零，则每个变量赋值前都会带有 `export`。\n\n`write_file(*file, hash*)`\
  \ 将 `hash` 引用的内容按 `key`=*value` 格式写入指定的 `file`。该内容可以通过 `read_file` 函数读取。\n\n`write_http_connection(*handle*,\
  \ [*data*],...)` 此函数将给定的 `data` 字符串写入 HTTP 会话 `handle`。\n\n### 60.2 总结\n\n本章记录了供\
  \ Perl 编写的 Webmin 模块使用的 `web-lib.pl` 中所有标准函数的参数和用途。第 55 至 59 章更详细解释了这些函数最重要的部分，以及编写良好的模块应当如何使用它们。\n\
