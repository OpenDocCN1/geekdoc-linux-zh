  \ 文件子目录的基础目录。这些子目录的包括 `cf`、`domain`、`feature`、`mailer` 和 `ostype` 等。如果您是从源码编译的 `Sendmail`，则源码中将包含\
  \ `M4` 配置文件，您应该将此字段指向它们的基础目录。使用您实际安装的 `Sendmail` 版本附带的文件非常重要，这样才能正确生成主配置文件。 |\n\
