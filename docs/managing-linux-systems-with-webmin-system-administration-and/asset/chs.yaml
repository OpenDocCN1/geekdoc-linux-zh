  \ `Sendmail`，主文件将是 `M4` 基础目录下 `cf` 目录下的 `generic-*.mc` 文件之一。具体哪个取决于您的操作系统，例如，如果您正在运行\
  \ `Linux`，则应使用 `generic-linux.mc`。当然，如果您已经手动创建了自己的主 `M4` 配置文件并从其生成了 `sendmail.cf`\
  \ 文件，则必须在此处输入其路径。 |\n| **sendmail pid 文件的完整路径** | 此字段必须包含 `Sendmail` 进程进程写入其进程 ID\
