  \ 别名。这可以防止创建因别名重定向所有邮件到另一个地址而无法接收邮件的用户。 |\n| 只删除用户拥有的文件？ | 在删除用户时将此选项设置为 `Yes`，用户家目录中不属于该用户的文件将不会删除。\
