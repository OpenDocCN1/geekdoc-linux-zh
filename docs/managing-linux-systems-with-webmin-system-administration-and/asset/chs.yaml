  | 通过什么显示用户和组 | 默认情况下，用户和组在模块主页上表格显示，每个用户或组占一行。然而，如果你将此选项更改为 `Name only`，则只显示每个用户的用户名，如果有大量用户，这将节省大量屏幕空间。更改为\
  \ `Primary group categorized` 也按用户名显示用户，但按其主组进行分类。 |\n| 隐藏明文密码？ | 在编辑或创建用户时将此项设置为\
  \ `Yes`，“普通”密码字段将只显示星号而不是你输入的实际密码。如果你担心在创建用户时有人在背后窥视，这非常有用。 |\n| 从此处获取用户和组信息 | 尽管模块直接读取和编辑系统用户、组和密码文件，但在某些情况下，系统上的用户和组可能来自其他源（例如\
  \ NIS）。在显示用户的主组或某个组的成员时，Webmin 默认使用 `getpw` 系列系统调用来获取用户和组列表，而不是直接读取用户和组文件。这通常是正确的做法，但在某些情况下它可能无法正常工作或速度非常慢。只有当你确定希望模块永远不要使用\
  \ `getpw` 函数时，才将此选项改为 `Files`。 |\n| 为新用户生成密码？ | 如果在创建新用户时将此选项设置为 `Yes`，Webmin 将默认为你生成一个随机密码。\
  \ |\n| 显示办公室和电话详情？ | 通常情况下，用户的“真实姓名”字段只包含其姓名。然而，它也可以包含额外信息，如办公室位置、家庭电话和工作电话。这些额外字段由\
  \ `finger` 命令显示，并由系统通过逗号存储在 `/etc/passwd` 文件的真实姓名字段中。如果你能够单独编辑这些额外信息，请将此选项设置为 `Yes`。如果你的系统中的用户名包含像\
  \ `Cameron, Jamie` 这样的逗号，它将无法正常工作。 |\n| 从此处显示用户邮箱 | 此选项控制当点击用户编辑页面上的“读取邮件”按钮时使用哪个模块。你应该根据你正在使用的邮件系统确保设置适当，因为\
  \ `Sendmail` 和 `Qmail` 使用的用户邮件邮箱的位置和文件格式不同。 |\n\n\n\n\n\n| 密码最小长度 | 如果设置了此项，你将无法创建或编辑明文密码短于此长度的用户。此选项以及下方的三个选项也会影响“更改密码”和“用户及用户组”模块。如果你想将用户管理权限委派给他人，且不信任其密码质量，这些选项将非常有用。\
  \ |\n| 防止使用字典单词作为密码？ | 如果设置了此项，将不允许使用与字典中任何单词完全匹配的密码。 |\n| 用于检查密码的 Perl 正则表达式 |\
  \ 如果设置了此项，密码必须匹配此 Perl 正则表达式。例如，你可以在此选项输入 `[0-9]*` 来强制所有密码包含至少一个数字。 |\n| 防止密码包含用户名\
  \ | 当此选项设置为“是”时，将不允许使用完全匹配或包含该用户名的密码。 |\n\n“系统配置”标题下的其他选项控制着 Webmin 用于读取和写入用户及用户组信息的文件。由于这些选项是根据你使用的操作系统类型自动设置的，除非你清楚自己在做什么，否则不应更改它们。\n\
  \n### 4.13 执行前和执行后命令\n\n如第 4.12 节“配置用户和用户组模块”所述，你可以指定在模块执行任何操作之前和之后运行 Shell 命令。由于这些命令在每次添加、修改或删除用户或组时都会被调用，因此它们需要某种方式来准确说明正在执行什么操作。它们可以使用在命令运行之前设置的环境变量。可用的环境变量见表\
  \ 4.3。\n\n例如，如果你想在创建用户时发送电子邮件，可以将“在执行更改后运行命令”选项设置为：\n\n```bash\n[ \"$USERADMIN_ACTION\"\
  \ = \"CREATE_USER\" ] && echo \"Added user $USERADMIN_USER ($USERADMIN_REAL)\" |\
  \ mail s \"Added new user\" you@yourdomain.com\n```\n\n### 4.14 模块访问控制\n\n可以授予 Webmin\
  \ 用户或用户组访问“用户和用户组”模块中部分特征的权限。这最常见的用途是允许子管理员仅编辑系统中选定的用户和用户组的权限，并仅能以有限的方式更改其属性。例如，在虚拟主机环境中，你可能希望赋予\
  \ Webmin 用户创建和编辑最多 10 个 UID 在特定范围内的用户的能力，且主目录位于固定目录下。这些权限让该用户无法获得 root 权限，也不会影响不属于他的用户。\n\
  \n#### 表 4.3. 执行前和执行后命令的环境变量\n\n| 变量 |  |\n| :--- | :--- |\n| `USERADMIN_ACTION`\
  \ | 表示正在执行的操作。可能的值有：<br>CREATE_USER, MODIFY_USER, DELETE_USER, CREATE_GROUP, MODIFY_GROUP,\
  \ DELETE_GROUP |\n| `USERADMIN_USER` | 被创建、修改或删除的用户的用户名。执行用户组操作时时不设置。 |\n| `USERADMIN_UID`\
  \ | 被创建、修改或删除的用户的 ID。 |\n| `USERADMIN_GID` | 用户的用户组 ID。 |\n| `SERADMIN_REAL` | 用户的真实姓名，包括任何办公和电话信息。\
  \ |\n| `USERADMIN_SHELL` | 用户的 Shell。 |\n| `USERADMIN_HOME` | 用户的主目录。 |\n| `USERADMIN_PASS`\
  \ | 用户的明文密码（如果可用）。 |\n| `USERADMIN_SECONDARY` | 用户所属的所有次要组列表，用逗号分隔。 |\n| `USERADMIN_GROUP`\
  \ | 被添加、修改或删除的组名。执行用户操作时时不设置。 |\n\n第 52 节更详细地解释了如何创建额外的 Webmin 用户并编辑它们的模块访问控制。以下步骤仅涵盖了授予“用户和用户组”模块特定限制访问权限的流程：\n\
  \n1. 在 Webmin 用户模块中，点击要编辑的用户名称旁边的 `用户和用户组`。这将带你进入图 52.3 所示的访问控制表。\n2. 将 `可以编辑模块配置?`\
  \ 字段改为 `否`。\n3. `可以编辑的 UNIX 用户` 字段控制可以被该 Webmin 用户更改的用户。你通常会将其设置为 `UID 在范围内的用户`，并在旁边的字段中输入最大和最小\
  \ UID，例如 `5000` 和 `5010`。\n4. 若要允许添加新的 UNIX 用户，将 `可以创建新用户吗?` 字段设置为 `是`。\n5. 将 `可以查看批量表单?`\
  \ 选项设置为 `否`。这将防止 Webmin 用户通过批脚本创建和编辑用户，这通常是没必要的。然而，允许此操作并不会赋予用户任何额外权限，也不会产生安全风险。\n\
  6. 对于 `新用户和修改用户的 UID` 字段，输入与步骤 4 相同的 UID。\n7. 取消勾选 `多个用户可以具有相同的 UID` 选项，但保留勾选 `现有用户的\
  \ UID 可以被更改` 选项。由于可能导致的问题，通常不应允许不受信赖的子管理员创建多个具有相同 UID 的用户。\n8. 当防止 UID 冲突时， Webmin\
  \ 用户将无法创建超过其允许 UID 范围数量的 UNIX 用户。\n9. 在 `新用户或修改用户的允许用户组` 字段中，你通常会选择 `仅组` 选项，并输入允许用户作为主要或次要成员的组名。通常你只会输入一个如\
  \ `users` 的组。将此字段设置为 `所有组` 是非常糟糕的，因为它允许创建组成组的用户。`GID 在范围内的组` 选项在允许 Webmin 用户在 GID\
  \ 范围内创建多个组时非常有用。\n10. 若要限制分配给新用户的 Shell，将 `新或修改用户的允许 Shell` 设置为 `列出`，并在下方的文本框中输入它们的路径。这对于允许创建始终使用\
  \ `/bin/false` 的仅限邮件用户非常有用。\n11. 将 `主目录必须位于` 字段设置为仅供该 Webmin 用户使用的目录。将其设置为 `/home`\
  \ 是一个糟糕的想法，因为这将允许子管理员重命名或删除属于 `/home` 的其他用户的目录。相反，应输入类似 `/home/*admin*` 的内容。\n12.\
  \ 若要强制每个用户的主目录基于其用户名（例如 `/home/admin/**`），请勾选 `主目录与用户名相同` 框。\n13. 为了防止 Webmin 用户取消表单底部的某些选项，请取消选择相应的\
  \ `保存时允许` 选项。任何未选中的选项实际上将始终开启。\n14. 假设你只想让 Webmin 用户创建和编辑 UNIX 用户，将 `可以编辑的 UNIX\
  \ 组` 字段设置为 `无组`。\n15. 如果你想限制用户查看最近登录，请更改 `显示登录方式` 字段。任何通过 telnet 或 SSH 登录的用户都可以运行\
  \ `last` 命令，因此将此选项设置为 `无用户` 通常不会让你的系统更安全。\n16. 最后，点击 `保存`。你将返回模块的主页，新的访问控制限制将立即生效。\n\
  \n在授予 Webmin 用户访问某些 UNIX 用户的权限时要小心，因为错误可能会允许他编辑 root 用户或创建一个与 root 等效的新用户。还有许多其他如\
  \ `bin`、`uucp` 和 `httpd` 的用户，它们拥有重要的系统文件或用于运行服务器和守护进程。\n\n\n\n\n通常，`Disk Quotas\
  \ and Scheduled Cron Jobs` 模块中的访问控制被设置为：允许编辑与在该模块中可以编辑和创建的相同 UNIX 用户的配额和 Cron 任务。所有模块都支持\
  \ `UID` 范围和主组访问控制选项，可以使用相同的方式进行设置。\n\n也可以使用 `Users and Groups` 访问控制表单允许用户编辑或创建选定的\
  \ UNIX 组，尽管这通常并不那么有用。授予不受信任的用户编辑系统上所有组的权限是一个坏主意，因为他会让自己成为 `root` 或 `bin` 组的成员，从而能够读写关键文件。\n\
  \n### 4.15 其他操作系统\n\n不同的操作系统存储用户信息的方式与 Linux 不同。这是由于用于存储用户信息的的文件和文件格式不同。例如，某些系统没有\
  \ `/etc/shadow` 文件，这意味着不存在密码更改和过期时间的信息。下面的列表解释了其他支持的操作系统与 Linux 之间的主要差异：\n\n**FreeBSD、OpenBSD\
  \ 和 NetBSD** 这些操作系统都使用 `/etc/master.passwd` 文件来存储用户信息，该文件结合了 `/etc/passwd` 和 `/etc/shadow`\
  \ 中的某些字段。在编辑或创建用户时，你可以输入一个 `Password` 更改时间（即下次必须更改密码的日期和时间）以及一个 `Account` 过期时间（在该时间之后无法使用账户）。每个用户还可以有一个\
  \ `Login` 类，它结合 `/etc/login.conf` 文件来确定内存、CPU 和其他限制。\n\n**Sun Solaris 和 SCO UnixWare**\
  \ 这两个操作系统使用与 Linux 相同的文件和格式，因此具有所有相同的选项。\n\n**HP/UX、SGI Irix 和 Compaq Tru64/OSF1**\
  \ 由于这些系统默认都不使用 `/etc/shadow` 文件，因此在编辑或创建用户时，无法使用任何与密码和账户过期相关的选项。\n\n**Apple MacOS\
  \ X OSX** 根本不在文件中存储用户和组信息，相反，它使用一个名为 `NetInfo` 的网络数据库，Webmin 通过 `nidump` 和 `niutil`\
  \ 命令对其进行操作。然而，该数据库存储的信息与 BSD 的 `master.passwd` 文件相同，因此在编辑或创建用户时，提供的字段与 FreeBSD 相同。\n\
  \n**IBM AIX** AIX 使用 `/etc/passwd` 和 `/etc/security/passwd` 文件来存储用户信息。因此，在 AIX 上编辑或创建用户时，有一些其他操作系统上不存在的选项。`Expiry`\
  \ 日期字段可以设置账户后无法使用的日期和时间。`Minimum weeks` 和 `Maximum weeks` 字段与 Linux 上的 `Maximum\
  \ days` 和 `Minimum days` 字段非常相似，但处理的是周而不是天。`Warning days` 字段含义与 Linux 完全相同，处理的是天而不是周。独特的\
  \ `Account flags` 字段设置了特殊选项，其含义在表单上另有解释。\n\n**SCO OpenServer** OpenServer 使用 `/etc/passwd`\
  \ 和 `/etc/shadow` 文件，但影子文件存储的信息与 Linux 略有不同。这意味着在编辑用户时，`Expiry date` 字段被一个选项取代，该选项用于控制用户在下次登录时是否提示输入密码，且\
  \ `Warning days` 和 `Inactive days` 字段不可用。\n\n上述未列出的少数操作系统无法使用 `Users and Groups`\
  \ 模块，因为 Webmin 目前还不它们的文件格式。\n\n### 4.16 总结\n上述未列出的少数操作系统无法使用 `Users and Groups`\
  \ 模块，因为 Webmin 目前还不它们的文件格式。\n\n## 5 磁盘和文件系统\n\n如果不涵盖虚拟内存，任何关于文件系统的解释都是不完整的。\n\n\
  ### 5.1 文件系统\n\n#### 5.1. 文件系统简介\n在 UNIX 系统中，一切皆文件。\n\n\n\n\n\n“磁盘和网络文件系统”模块位于“系统”类别下，允许你配置哪些文件系统挂载到你的计算机上、从哪里挂载以及设置了哪些选项。该模块的主页（如图\
  \ 5.1 所示）列出了所有已挂载或可挂载的文件系统。\n\n##### 图 5.1 现有文件系统列表。\n\n![](img/05fig01.jpg)\n\n\
  对于每个文件系统，将显示以下信息：\n\n- **挂载为 (Mounted As)**：该文件系统的挂载点目录，或显示“虚拟内存”（Virtual Memory）。\n\
  - **类型 (Type)**：文件系统类型的描述，后跟实际的短类型名称。\n- **位置 (Location)**：挂载该文件系统的磁盘、文件服务器或其他位置。对于\
  \ `nfs` 挂载，此列将以 `servername:remotedirectory` 的形式存在。对于 `smbfs` 挂载，类似于 `\\\\servername\\\
  sharename`。\n- **在使用？In use?)**：是或否，取决于该文件系统当前是否挂载。对于大多数文件系统，你可以点击此字段立即进行挂载或卸挂载。\n\
  - **永久 (Permanent)**：是或否，取决于该文件系统是否被永久记录，以便在启动时挂载。\n\n### 5.3 挂载 NFS 网络文件系统\n\n\
  在从另一个 UNIX 服务器挂载文件系统之前，该服务器必须配置为使用 `NFS` 导出你想挂载的目录。有关如何使用 Webmin 导出目录的详情，请参阅第 6\
  \ 章。\n\n假设你想挂载的目录已正确导出，你可以按照以下步骤将其挂载到你的系统中：\n\n1. 在磁盘和网络文件系统模块的主页，从文件系统类型的下拉框中选择`Network\
  \ Filesystem`网络文件系统），并点击`Add mount`添加挂载）按钮。将出现表单，如图 5.2 所示。\n\n##### 图 5.2 挂载网络文件系统。\n\
  \n![](img/05fig02.jpg)\n\n2. 在 `Mounted As`（挂载为）字段中，输入你想挂载文件系统的目录。该目录应该是不存在或空的，因为一旦挂载文件系统，其目前包含的任何文件将被隐藏。\n\
  \n3. 如果你想让文件系统在启动时挂载，请为`Save Mount`（保存挂载）选项选择`Save and mount at boot`保存并在启动时挂载。如果你希望将其永久记录但在启动时不挂载，请选择`Save`保存。如果只是临时挂载，请选择`Don't\
  \ save`不保存。\n\n4. 对于`Mount now?`（现在挂载吗？）选项，如果你想立即挂载文件系统，请选择`Mount`挂载；如果你只想将其记录以便以后在启动时挂载，请选择`Don't\
  \ mount`不挂载。将`Save and mount`选项设置为`Don't save`且将`Mount now?`选项设置为`Don't mount`是没有意义的，因为什么操作都不会执行！\n\
  \n5. 在 `NFS Hostname`（NFS 主机）字段中，输入导出你所需目录的文件服务器的名称或 IP 地址。你也可以点击字段旁边的按钮弹出本地网络上的\
  \ `NFS` 服务器列表。\n\n6. 在 `NFS Directory`（NFS 目录）字段中，输入文件服务器上导出的目录。如果你已经输入了 NFS 服务器的主机名，点击字段旁边的按钮将弹出该服务器导出的目录列表。\n\
  \n7. 修改表单底部部分你想要启用的任何选项。一些最实用的如下：\n\n    - **只读？(Read-only?)**：如果设置为`Yes`，则该文件系统上的文件不能被修改、重命名或删除。\n\
  \    - **在后台重试挂载？Retry mounts in background?)**：当 `NFS` 文件系统在启动时挂载时，如果服务器宕机或无法访问，系统通常会一直尝试连接服务器，这可能会导致启动过程无法正常完成。将此选项设置为`Yes`可以通过耗时过长后在后台重试挂载来防止此问题。\n\
  \    - **超时时返回错误？Return error on timeouts?)**：`NFS` 文件系统在面对服务器故障时的正常行为是持续尝试读取或写入请求，直到服务器恢复且操作成功。这意味着如果服务器宕机长时间，任何访问从服务器挂载的文件的尝试都会卡住。将此选项设置为`Yes`会改变这种行为，使你的系统最终放弃耗时过长的操作。\n\
  \n8. 要挂载和/或记录文件系统，点击页面底部的`Create`（创建）按钮。如果一切顺利，你将返回文件系统列表，否则将显示解释错误原因的信息。\n\n一旦\
  \ `NFS` 文件系统成功挂载，系统上的所有用户和程序都能够访问挂载点目录下的文件服务器上的文件。\n\n### 5.4 挂载 SMBFS Windows 文件系统\n\
  \n`smbfs` 是 Windows 系统用于相互共享文件的协议。如果你在 Windows 系统上有想在 Linux 系统上访问的文件，你必须先使用 Windows\
  \ 用户界面共享目录并为其分配共享名称。\n\n完成此后，按照以下步骤在你的 UNIX 系统上挂载该共享：\n\n1. 在磁盘和网络文件系统模块的主页，从文件系统类型的下拉框中选择`Windows\
  \ Networking Filesystem`Windows 网络文件系统），并点击`Add mount`添加挂载）按钮。将出现表单，如图 5.3 所示。\n\
  \n##### 图 5.3 挂载 Windows 网络文件系统。\n\n![](img/05fig03.jpg)\n\n2. 在 `Mounted As`（挂载为）字段中，输入你想挂载文件系统的目录。该目录应该是不存在或空的，因为一旦挂载文件系统，其目前包含的任何文件将被隐藏。\n\
  \n3. 如果你想让文件系统在启动时挂载，请为`Save Mount`（保存挂载）选项选择`Save and mount at boot`保存并在启动时挂载。如果你希望将其永久记录但在启动时不挂载，请选择`Save`保存。如果只是临时挂载，请选择`Don't\
  \ save`不保存。\n\n4. 对于`Mount now?`（现在挂载吗？）选项，如果你想立即挂载文件系统，请选择`Mount`挂载；如果你只想将其记录以便以后在启动时挂载，请选择`Don't\
  \ mount`不挂载。\n\n5. 在 `Server Name`（服务器名称）字段中，输入 Windows 服务器的主机名或 IP 地址。字段旁边的按钮将根据模块配置中设置的域或工作组主，弹出网络上的\
  \ Windows 服务器列表。\n\n6. 在 `Share Name`（共享名称）字段中，输入共享名称。这将类似于 `movies` 的内容，而不是 Windows\
  \ 服务器上的完整路径（如 `c:\\files\\movies`）。如果你已经输入了服务器名称，点击字段旁边的按钮将弹出可用共享列表。\n\n7. 如果 Windows\
  \ 服务器访问文件共享需要用户名和密码，请填写`Login Name`（登录名称）和`Login Password`（登录密码）字段。如果不需要身份验证，这些字段可以为空。由于\
  \ Windows 网络没有 UNIX 用户的概念，当文件系统挂载时，文件服务器上的所有文件将属于单个 UNIX 用户和组。该用户默认为 root，但你可以通过填写`User\
  \ files are owned by`（文件所有者为）和`Group files are owned by`（文件所属组为）字段来更改它。\n\n\n\n\n\
  点击页面底部的 `Create` 按钮来挂载和/记录文件系统。如果一切顺利，你将返回文件系统列表；否则将显示错误说明发生了什么问题。\n\nWindows 网络文件系统也可以通过\
  \ UNIX 服务器使用 `Samba` 导出，如第 43 节所述。这意味着你可以使用 Windows 文件共享协议在两个 UNIX 服务器之间共享文件。然而，正如你可能到的，这通常不是一个好主意，因为挂载服务器将无法获取权限和所有权信息。\n\
  \n### 5.5 挂载本地 ext2 或 ext3 硬盘文件系统\n\n在从本地硬盘挂载新文件系统之前，必须对分区并使用正确的文件系统类型进行格式化。有关如何操作的详细信息，请参见第\
  \ 8 章。如果有选择，应该使用 `ext3`（Webmin 称为新 Linux 原生文件系统）而不是 `ext2`（Linux 原生文件系统），因为它支持日志功能。有关\
  \ `ext3` 优势的更多细节，请参见第 5.13 节“文件系统类型比较”。\n\n要挂载本地文件系统，请按照以下步骤操作：\n\n1. 在磁盘和网络文件系统模块的主页，从文件系统类型下拉框中选择\
  \ `Linux Native Filesystem` 或 `New Linux Native Filesystem`，并点击 `Add mount` 按钮。将弹输入挂载点、源和选项的表。\n\
  2. 在 `Mounted As` 字段中，输入你想挂载文件系统的目录。该目录应该不存在或为空，因为一旦挂载文件系统，其当前包含的任何文件都将被隐藏。\n3.\
  \ 如果你想让文件系统在启动时挂载，在 `Save Mount` 选项中选择 `Save and mount at boot`。如果你希望将其永久记录但在启动时不挂载，请选择\
  \ `Save`。如果只是临时挂载，请选择 `Don't save`。\n4. 对于 `Mount now?` 选项，如果你想立即挂载文件系统，请选择 `Mount`；如果你只想将其记录以便以后在启动时挂载，请选择\
  \ `Don't mount`。\n5. 如果存在 `Check filesystem at boot?` 选项，它控制在启动挂载前是否使用 `fsck` 命令对文件系统进行验证。如果你的系统崩溃或掉电，当时挂载的任何\
  \ `ext2` 或 `ufs` 文件系统在挂载前都需要进行检查。通常将此选项设置为 `Check second` 为好。\n6. 对于 `Linux Native\
  \ Filesystem` 字段，点击 `Disk` 选项并选择已为你的新文件系统格式化的分区。所有的 IDE 和 SCSI 磁盘将出现在菜单中。\n7. 如果你系统上的任何分区带有标签，你可以通过选择\
  \ `Partition labeled` 选项并选择你想要的一个来挂载。标签将在第 8 章进一步解释。\n8. 如果你的系统配置了任何 RAID 设备（如第\
  \ 8 章中所述），你可以选择 `RAID device` 选项并从菜单中选择你想挂载的设备。\n9. 如果你正在使用 `LVM`（逻辑卷管理，见第 8 章），`LVM\
  \ logical volume` 选项旁边将出现所有可用逻辑卷列表供你选择。\n10. 你也可以点击 `Other device` 选项并输入你文件系统的设备文件路径，例如\
  \ `/dev/hda2`。\n11. 修改表单底部部分你任何想要启用的选项。最实用的包括：\n    - `Read-only?`: 如果设置为 `Yes`，此文件系统上的文件将无法修改、重命名或删除。\n\
  \    - `Use quotas?`: 如果你想在此文件系统上强制磁盘配额，必须启用此选项。大多数文件系统类型将提供用户配额、组配额或两者都有。要完成激活和配置配额的过程，请参见第\
  \ 7 章。\n12. 点击页面底部的 `Create` 按钮来挂载和/记录文件系统。如果一切顺利，你将返回文件系统列表；否则将显示错误说明发生了什么问题。\n\
  \n### 5.6 挂载本地 Windows 硬盘文件系统\n\n如果你的系统的某个硬盘上有 Windows 分区，你可以使用 Webmin 挂载它，以便 UNIX\
  \ 用户和程序可以轻松访问所有文件。Windows 95、98 和 ME 默认使用旧的 `vfat` 格式，Webmin 称为 Windows 95 文件系统。然而，Windows\
  \ NT、2000 和 XP 使用更先进的 `ntfs` 文件系统格式（称为 Windows NT 文件系统），只有少数 Linux 发行版支持它。\n\n1.\
  \ 在磁盘和网络文件系统模块的主页，从文件系统类型下拉框中选择 `Windows 95 Filesystem` 或 `Windows NT Filesystem`，并点击\
  \ `Add mount` 按钮。将出现输入挂载点、源和选项的表。\n2. 在 `Mounted As` 字段中，输入你想挂载文件系统的目录。该目录应该不存在或为空，因为一旦挂载文件系统，其当前包含的任何文件都将被隐藏。\n\
  3. 如果你想让文件系统在启动时挂载，在 `Save Mount` 选项中选择 `Save and mount at boot`。如果你希望将其永久记录但在启动时不挂载，请选择\
  \ `Save`。如果只是临时挂载，请选择 `Don't save`。\n4. 对于 `Mount now?` 选项，如果你想立即挂载文件系统，请选择 `Mount`；如果你只想将其记录以便以后在启动时挂载，请选择\
  \ `Don't mount`。\n5. 对于 `Windows 95 Filesystem` 或 `Windows NT Filesystem` 字段，点击\
  \ `Disk` 选项并选择已为你的新文件系统格式化的分区。所有的 IDE 和 SCSI 磁盘、RAID 设备和 LVM 逻辑卷将出现在列表中。\n6. 你也可以点击\
  \ `Other device` 选项并输入你文件系统的设备文件路径，例如 `/dev/hda2`。\n7. 选择任何你想启用的选项。实用的包括：\n    -\
  \ `User files are owned by`: 由于 `vfat` 文件系统格式没有用户和组的概念，挂载文件系统中的所有文件默认将属于 `root`。要更改此项，请为该选项输入不同的\
  \ UNIX 用户名。\n    - `Group files are owned by`: 与上一个选项一样，它控制挂载文件系统中所有文件的组所有权。\n \
  \   - `File permissions mask`: 你希望挂载文件系统中的文件拥有的 UNIX 权限的八进制二进制反反。例如，输入 `007` 将使文件对用户和组可读可写，但对其他人完全无法访问。Windows\
  \ NT 文件系统不提供此选项。\n8. 点击页面底部的 `Create` 按钮来挂载和/记录文件系统。如果一切顺利，你将返回文件系统列表；否则将显示错误说明发生了什么问题。\n\
  \n由于 Windows 95 文件系统没有文件所有权的概念，且 Windows NT 文件系统具有 Linux 不支持的所有权信息，因此，更改更改挂载文件系统中文件的用户、组或权限是不可能的。\n\
  \n### 5.7 添加虚拟内存\n\n如引言所述，当运行在系统上的进程需要的比物理安装更多的内存时，就会使用虚拟内存。因为并不是所有进程都同时运行，不活跃的进程可以安全地交换到虚拟内存中，并在需要运行时重新换回。然而，由于磁盘比\
  \ RAM 慢得多，如果系统上的进程消耗了太多内存，持续的换入换出（称为抖动）将导致系统运行缓慢。\n\n现有本地文件系统中的文件以及整个分区都可以用于虚拟内存。使用分区几乎总是更快，但如果硬盘上没有可用分区，则缺乏灵活性。系统可以拥有多个虚拟内存文件或分区，因此如果虚拟内存不足，可以轻松添加。\n\
  \n添加额外的虚拟内存的步骤如下：\n\n\n\n\n在“磁盘和网络文件系统”（Disk and Network Filesystems）模块的主页上，从文件系统类型下拉框中选择`虚拟内存，并点击`添加挂载（Add\
  \ mount）按钮。将出现一个输入源和其他选项的表单。\n\n如果您希望在启动时添加虚拟内存，请在`保存挂载（Save Mount）选项中选择`启动时保存并挂载`。否则，如果这只是一个临时添加，请选择`不保存（Don't\
  \ save）。\n\n对于`立即挂载？（Mount now?）选项，如果您希望立即添加虚拟内存，请选择`挂载（Mount），如果您只想将其记录以便以后启动时添加，请选择`不挂载（Don't\
  \ mount）。\n\n如果你想将整个分区作为虚拟内存，请在`交换文件（Swap File）选项中选择`磁盘，并在列表中选择该分区。否则，选择`交换文件`并输入您想要作为虚拟内存的路径。如果您输入了一个已存在的文件路径，该文件将在添加虚拟内存时被覆盖。\n\
  \n点击页面底部的`创建（Create）按钮。如果您正在添加尚未存在的交换文件，系统将提示您输入文件大小，Webmin 将为您创建它。如果一切顺利，浏览器将返回主页的文件系统列表。\n\
  \n一旦添加了新的虚拟内存，系统的可用内存应该会增加分区或交换文件的大小。使用`运行进程`Running Processes）模块（见第 11 章）中的内存显示来查看可用的实际和虚拟内存。\n\
  \n### 5.8 自动挂载文件系统\n\n在通过 Linux 访问任何文件系统上的文件之前，必须先显式挂载。这对于启动时挂载的硬硬盘来说没问题，但对于 CD-ROM、软磁盘和\
  \ Zip 磁盘等可移动媒体来说并不方便。在读写文件之前必须挂载软磁盘，完成后后再卸载它，这并不符合用户习惯，特别是与 Windows 等其他操作系统相比。\n\
  \n幸运的是，有一种解决方案：自动挂载文件系统（automounter）。该系统不包含任何自己的文件，但在需要时会自动创建临时目录并挂载文件系统。挂载在 `/auto`\
  \ 的自动挂载文件系统通常配置为：当用户尝试`cd` 进入该目录时，立即在 `/auto/floppy` 挂载软磁盘。当软磁盘的文件系统不再被使用时，它将自动卸载，以便安全地弹出软磁盘。\n\
  \n可以在 Webmin 中创建、查看和编辑自动挂载文件系统。每个文件系统都有一个配置文件，指定了它将挂载哪些设备以及挂载在这些设备的哪些子目录上。然而，无法在\
  \ Webmin 内部编辑这些配置文件，您只能选择使用哪一个。大多数现代 Linux 发行版默认设置了位于 `/auto` 或 `/media` 的自动挂载文件系统，并配置允许访问软磁盘和\
  \ CD-ROM 驱动器。\n\n自动挂载的另一个常见用途是提供对 NFS 服务器的便捷访问。通常会在 `/net` 目录上设置自动挂载，以便访问 `/net/*hostname*`\
  \ 目录会将 `hostname` 导出的所有目录挂载到该目录下。这都是通过另一个自动挂载配置文件完成的。\n\n### 5.9 编辑或删除现有文件系统\n\n\
  挂载文件系统后，您可以随时返回更改挂载目录、源和选项。即使是作为操作系统安装过程的一部分的大部分文件系统也可以编辑。但是，某些特殊文件系统类型如 `proc`\
  \ 和 `devfs` 无法通过 Webmin 进行编辑，因为更改它们可能会破坏您的系统。\n\n唯一的限制是，正在使用的文件系统无法立即编辑。如果任何用户或进程正在访问文件系统上的任何文件或位于任何目录，它就会被视为忙碌，无法通过\
  \ Webmin 卸载并重新挂载以进行更改。由于根文件系统始终处于使用状态，因此对其进行立即更改是不可能的。幸运的是，有一种替代方法，仅更改文件系统的永久记录，以便在系统重启时应用新选项。\n\
  \n编辑文件系统遵循的步骤如下：\n\n1. 从主页的文件系统列表中，点击`挂载为（Mounted as）`列中的挂载点目录。将出现一个包含当前设置的表单，如图\
  \ 5.4 所示。\n\n##### 图 5.4. 编辑现有文件系统。\n\n![](img/05fig04.jpg)\n\n2. 更改任何设置，包括`挂载为（Mounted\
  \ As）`目录、挂载文件系统的设备或服务器或挂载选项。\n\n3. 如果您想在卸载文件系统的同时保留其记录以便以后挂载，请将`立即挂载？（Mount now?）`选项更改为`卸载（Unmount）`。但如果您想挂载已永久记录的文件系统，请将该选项改为`挂载（Mount）`。\n\
  \n4. 点击`保存（Save）`按钮使您的更改生效。如果一切顺利，浏览器将返回主页的文件系统列表。\n\n如果您正在更改一个忙碌的已挂载文件系统，将获得将更改应用于永久列表的选项。如果您尝试在\
  \ Linux 原生文件系统上启用配额，将选项应用于永久列表通常就足够了。\n\n要完全删除文件系统，只需编辑它并将`保存挂载？（Save Mount?）`选项设置为`不保存（Don't\
  \ save）`，并将`立即挂载？（Mount Now?）`选项设置为`卸载（Unmount）`。假设它未被使用，它将被卸载并从已记录的文件系统列表中删除，且不再出现在模块主页的列表中。\n\
  \n## 5.10 列出文件系统用户\n\n如果文件系统忙忙而无法卸载或编辑，您可能想要杀死正在使用它的进程。\n\n要找到哪些进程正在使用文件系统，请遵循以下步骤：\n\
  \n1. 从主页的文件系统列表中，点击`挂载为（Mounted as）`列中的挂载点目录。将出现图 5.4 所示的表单。\n\n2. 点击页面右下角的`列出用户（List\
  \ Users）`按钮。这将显示所有正在文件系统中的读取、写入或位于任何文件或目录中的进程列表。\n\n3. 要杀死它们，点击页面底部的`杀死进程（Kill Processes）`按钮。现在您应该可以返回磁盘和网络文件系统模块并成功卸载了。\n\
  \n### 5.11 模块访问控制\n\n可以为 Webmin 用户提供此模块的有限访问权限，使其只能编辑某些文件系统的设置，或仅允许挂载和卸载。允许不可信的用户挂载任何文件系统是一个坏主意，因为他可以通过挂载包含\
  \ setuid-root 程序的 NFS 或软磁盘文件系统来获得对您系统的完全控制。然而，给予某仅挂载和卸载某些文件系统的权限（其选项设置为防止使用 setuid\
  \ 程序）是相当安全的。如果您的系统有软磁盘或 CD-ROM 驱动器且您没有使用自动挂载，这可能会很有用。\n\n一旦授予用户访问模块的权限（如第 52 章所述），您可以按照以下步骤将其限制为仅挂载或卸载选定的文件系统：\n\
  \n1. 在 Webmin 用户模块中，点击用户名旁边的`磁盘和网络文件系统（Disk and Network Filesystems）`打开访问控制表单。\n\
  \n2. 将`可以编辑模块配置？（Can edit module configuration?）`字段改为`否`，停止他配置模块使用不同的 fstab 文件或挂载命令。\n\
  \n3. 在`可以编辑的文件系统（Filesystems that can be edited）`字段中，选择`下列表目录（Under listed directories）`并在相邻文本框中输入挂载点列表。例如，您可以输入\
  \ `*/mnt/floppy /mnt/cdrom*`。也可以输入类似 `*/mnt*` 的目录以允许访问其所有文件系统。\n\n4. 将`可以添加新文件系统？（Can\
  \ add new filesystems?）`字段改为`否`。\n\n5. 将`仅允许挂载和卸载？（Only allow mounting and unmounting?）`字段改为`是`，这样用户实际上无法编辑文件系统详情。\n\
  \n6. 点击`保存（Save）`按钮激活新的限制。\n\n\n\n\n\n在 Linux 系统上，`Allow users to mount this filesystem?`\
  \ 字段可允许使用命令行挂载和卸载程序。其他工具（如 Gnome 挂载面板小组件和 Usermin）也使用了此功能，这可能是赋予普通用户挂载和卸载权限的更好方式。\n\
  \n### 5.12 配置磁盘和网络文件系统模块\n\n与其他模块一样，此模块也有几个可以更改的选项。要查看这些选项，请点击主页左角的 `Module Config`\
  \ 链接。这将带您进入标准配置编辑页面，在 `Configurable options` 标题下可以使用表 5.1 所示的选项。\n\n### 表 5.1 模块配置选项\n\
  \n| 请求浏览列表的服务器 | 挂载 `smbfs` 文件系统时，`Server` 字段旁边的按钮将弹出网络上 Windows 服务器的列表。此列表从此选项指定的服务器获取，该服务器应该是域或工作组主节点。\
  \ |\n| 显示长文件系统类型名称 | 如果此选项设置为 `No`，主页将仅显示短文件系统类型名称（如 `EXT2`）。默认情况下，它设置为 `Yes` 并显示长文件系统类型（如\
  \ Linux Native Filesystem）。 |\n\n配置页面上的其他选项不应更改，因为它们是由 Webmin 根据您的操作系统类型自动设置的。\n\
  \n### 5.13 文件系统类型比较\n\n与其他操作系统不同，Linux 支持多种不同类型的文件系统，它们完全支持 UNIX 文件权限和所有权信息。最初，`ext2`\
  \ 是唯一的选择，但新的内核版本和发行版增加了对 `ext3`、`reiserfs` 和 `xfs` 的支持。列表解释了这些替代文件系统类型的优点。\n\n**新型\
  \ Linux 原生文件系统 (ext3)** 与 `ext2` 非常相似，但支持日志记录。这意味着如果您的系统崩溃或掉电而没有机会正常卸载文件系统，就不需要像\
  \ `ext2` 那样对整个 `ext3` 文件系统进行长时间的 `fsck` 检查。\n\n由于 `ext3` 文件系统与 `ext2` 非常相似，它们在磁盘上的存储格式几乎完全相同。这意味着通过通过创建一个特殊的日志文件，将现有文件系统转换为\
  \ `ext3` 相对简单。\n\n**ReiserFS 文件系统 (reiserfs)** `ReiserFS` 是一个全新的文件系统，设计旨在比 `ext2`\
  \ 更快更高效。它像 `ext3` 一样支持日志记录，并且处理大量小文件比其他文件系统好得多。然而，它可能没有 `ext3` 或 `xfs` 那么成熟，并且不支持配额。\n\
  \n**SGI 文件系统 (xfs)** `XFS` 最初由 SGI 为其 IRIX 操作系统开发，如果你在 IRIX 上运行 Webmin，你也可以挂载 `xfs`\
  \ 文件系统。它支持日志记录，并包含对 `ACLs`（访问控制列表）和文件属性列表的原生支持。特别是 `ACL` 支持非常有用，因为它允许您以普通 UNIX 用户/组权限无法实现的方式授予文件访问权限。`XFS`\
  \ 在 IRIX 上已经使用了多年，因此它应该是相当成熟可靠的。\n\n**IBM 日志文件系统 (jfs)** `JFS` 最初由 IBM 开发用于其 `AIX`\
  \ 和 `OS/2` 操作系统，但最近已移植到 Linux。它支持日志记录和大型（64 位）文件大小，但目前不支持配额或 `ACLs`。由于 `JFS` 在 IBM\
  \ 操作系统上已使用多年，它应该是相当成熟的。但在 Linux 上它还很新，因此测试可能不够充分。\n\n要查看您的系统支持这些哪些文件系统类型，请进入 `Partitions\
  \ on Local Disks` 模块（第 8 章介绍）并选择一个类型为 Linux 的未使用分区。页面底部有一个表单，您可以使用它在分区上按系统可用的类型之一创建新文件系统。大多数新的\
  \ Linux 发行版将支持 `ext3`，某些将支持 `reiserfs`，但只有少数包含对 `xfs` 的支持。\n\nLinux 还支持几种旧的文件系统类型，如\
  \ `ext`、`xiafs` 和 `minix`。除非您有一个使用其中一种格式格式化的旧磁盘，否则您永远不需要使用它们。\n\n### 5.14 其他操作系统\n\
  \n磁盘和网络文件系统模块除了 Linux 外还支持几种其他操作系统，界面基本相同。主要区别在于每个操作系统支持的文件系统类型，以及用于硬盘 UNIX 文件系统的类型。只有\
  \ Linux、Solaris 和 Irix 在其他系统上添加硬盘文件系统时会显示可用分区的下拉菜单，在其他系统中，您必须手动输入 `IDE` 或 `SCSI`\
  \ 控制器和驱动器编号。\n\n可以使用该模块的操作系统以及它们与 Linux 之间的主要差异是：\n\n**Sun Solaris** Solaris 使用\
  \ `ufs`（Webmin 称为 Solaris UNIX FileSystem）作为本地硬盘的标准文件系统类型。它具有许多与 Linux 上 `ext2`\
  \ 相同的选项，但不支持组配额，只支持用户配额。支持添加虚拟内存，方式与 Linux 完全相同。\n\nSolaris 上的 `NFS` 文件系统类型与 Linux\
  \ 类似，但支持从多个 `NFS` 服务器挂载以防其中一个宕机。在 `Multiple NFS Servers` 字段中输入服务器时，必须用逗号分隔，如 `host1:/path,host2:/path,host3:/path`。只有在安装了\
  \ `rumba` 程序的情况下，Solaris 系统才能挂载 Windows 网络文件系统。然而，它们只能临时挂载，不能记录在启动时挂载。\n\n只有 Solaris\
  \ 支持的一种有趣文件系统类型是 RAM Disk (`tmpfs`)。这种类型文件系统中的文件不存储在磁盘的任何地方，因此当系统重启或文件系统卸载时将丢失。默认情况下，Solaris\
  \ 将 `tmpfs` 用于 `/tmp` 目录。\n\n**FreeBSD** FreeBSD 也使用 `ufs` 作为其标准本地硬盘文件系统类型，尽管 Webmin\
  \ 称为 FreeBSD UNIXFileSystem。它具有与 Linux 大多数相同的选项，并支持用户和组配额。FreeBSD 也支持虚拟内存，但问题是一旦添加，不重启就无法删除。`NFS`\
  \ 的支持选项与 Linux 类似，但不支持 Windows 网络文件系统。\n\n**OpenBSD** OpenBSD 使用 `ffs` 文件系统类型用于本地硬盘，Webmin\
  \ 称为 OpenBSDFileSystem。与 FreeBSD 一样，它支持虚拟内存和 `NFS`，但不支持 Windows 网络文件系统。\n\n**HP/UX**\
  \ HP 的 UNIX 变体使用 `hfs` (HP UNIXFileSystem) 作为标准本地硬盘文件系统类型，但也支持更优的、带日志的 `vxfs`（Webmin\
  \ 称为 HP Journaled UNIXFileSystem）。两者都有磁盘配额选项，但仅针对用户。支持虚拟内存并可以随时添加和删除，但如果永久记录，则在启动时始终挂载。`NFS`\
  \ 也可用，选项与 Linux 类似，但没有 Windows 网络文件系统类型。\n\n**SGI Irix** 较版本的 Irix 使用 `xfs` (SGIFileSystem)\
  \ 作为标准硬盘文件系统类型，支持与 Linux 上 `xfs` 相同的所有选项，包括用户配额、`ACLs` 和文件属性。`efs` (旧 SGIFileSystem)\
  \ 类型也可用，但只有当您有已格式化为该类型的旧分区或运行旧版本的 Irix 时才应使用。Irix 支持与 Linux 选项类似的 `NFS`，但不支持 Windows\
  \ 网络。AppleTalk 和 Netware 文件系统可以使用命令行工具挂载，但尚无法在 Webmin 内部挂载或编辑。\n\n该操作系统也有标准的虚拟内存支持，但特殊之处在于，第一块硬盘上的第一个交换分区始终使用特殊的\
  \ `/dev/swap` 设备文件自动添加为虚拟内存。\n\n\n\n\n\nSCO UNIXWare 和 UNIXWare 的文件系统支持与 Solaris\
  \ 非常相似，但也增加了对基于磁盘的 `vxfs`（Veritas 文件系统）类型的支持。\n\n如果您的操作系统不在上述列表中，则“磁盘和网络文件系统”模块不支持它。在某些情况下，这是因为代码尚未编写，例如\
  \ `AIX` 或 `Tru64/OSF1`。相比之下，MacOS X 在启动时挂载所有硬盘分区，并在用户通过 GUI 请求时自动挂载网络文件系统。因此，它不需要用于管理文件系统的\
  \ Webmin 模块。\n\n### 5.15 总结\n\n与其他操作系统不同，Linux 及其其他 UNIX 变体不会自动让硬盘和可移动介质上的文件变得可用。本章解释了什么是文件系统和分区，以及如何挂载它们以访问其中包含的数据。它还涵盖了网络上两个或多个系统之间文件共享的客户端部分。\n\
  \n## 第 6 章 NFS 文件共享\n\n本章解释了如何通过建立 NFS 服务器将文件导出到其他 UNIX 系统。\n\n### 6.1 使用 NFS 进行文件共享简介\n\
  \nNFS 是网络上 UNIX 系统之间共享文件最常用的协议。NFS 服务器将其本地硬盘上的目录导出到 NFS 客户端，客户端挂载这些目录以便像访问任何其他目录一样访问它们。与其他文件共享协议（如\
  \ Windows 网络、Netware 和 AppleShare）不同，NFS 的设计是为了支持具有多个用户的客户端系统。这意味着客户端永远不会登录到服务器，而服务器几乎完全信任客户端来验证用户。缺点是，NFS\
  \ 不是与不可完全信任的客户端系统共享文件的良好协议。\n\nNFS 不使用用户名和密码进行验证，而是使用客户端的 IP 地址。只有信任的客户端才被允许挂载服务器的目录，这样它就不会受到网络上任何客户端未经授权访问文件的影响。通过限制客户端上特定\
  \ UNIX 用户的访问，或将来自客户端的所有请求视为单个用户，可以获得额外的安全性。\n\n在 Linux 上，`/etc/exports` 文件包含由 NFS\
  \ 导出的目录列表以及将其导出的客户端列表。通常，该文件在启动时由在后台运行的服务 NFS 请求的 `nfsd` 和 `mountd` 程序读取。当您使用 Webmin\
  \ 更改或创建导出项时，导出文件将直接被更新。\n\n本章仅涵盖使用 NFS 从服务器共享目录。有关如何在客户端上挂载 NFS 导出目录的详细信息，请参见第 5\
  \ 章。如果您想与 Windows 客户端共享文件，应该阅读第 43 章（涵盖 Samba），因为 Windows 并不广泛支持 NFS。\n\n### 6.2\
  \ NFS Exports 模块\n\n在 Linux 上，NFS 服务器配置使用 NFS Exports 模块完成，该模块可以在“网络”类别下找到。进入模块后，主页将显示导出目录以及允许访问它们的客户端列表，如图\
  \ 6.1 所示。\n\n#### 图 6.1. NFS Exports 模块。\n\n![](img/06fig01.jpg)\n\n大多数 Linux 发行版都默认安装了\
  \ NFS 文件共享所需的程序。然而，如果 Webmin 检测到您的系统缺少这些程序，在您进入模块时将显示错误消息。如果发生这种情况，您将需要从发行版的 CD\
  \ 或网站上安装 `nfs-server` 或 `nfs` 软件包。\n\n### 6.3 导出目录\n\n只有本地文件系统上的目录才能通过 NFS 导出，因此无法重新导出从另一个\
  \ NFS 服务器挂载的文件。同样无法从非 UNIX 文件系统（如 `vfat`、`ntfs` 或 `iso9660`）导出目录。如果导出的目录下有挂载点，则这些挂载点下的文件将无法被\
  \ NFS 客户端访问。因此，如果您导出根目录 `/` 且在 `/home` 下挂载了单独的文件系统，您将需要也导出 `/home`，客户端需要挂载它才能看到下面的文件。\n\
  \n导出目录的步骤如下：\n\n1. 点击模块主页上的“添加新导出链接 (Add a new export)”。这将带您进入输入导出详细信息的表单，如图 6.2\
  \ 所示。\n\n#### 图 6.2. 新 NFS 导出表单。\n\n![](img/06fig02.jpg)\n\n2. 在`导出目录 (Directory\
  \ to export)`字段中输入您想要共享的目录。\n\n3. 除非您想让导出项不可用，否则确保`活动?(Active?)` 选项设置为 `Yes`。\n\n\
  4. `导出到 (Export to)` 选项允许您选择哪些客户端将拥有该目录。可能的选择包括：\n   - **所有人 (Everyone)**：任何通过网络连接到您系统的系统都可以挂载该目录。选择此选项时要非常小心，因为它可能允许互联网上的任何人访问您的文件。\n\
  \   - **主机 (Host(s))**：仅允许指定的单个主机或 IP 地址。您也可以在此选项中输入通配符主机名（如 `.foo.com`），以便允许来自域的所有主机。然而，如果您想向多个特定的客户端主机导出目录，唯一的解决方案是为同一目录创建多个导出项，每个导出在该字段中具有不同的主机名。\n\
  \   - **WebNFS 客户端**：NFS 是一种很少用于通过互联网访问 NFS 导出的协议。除非您知道自己在做什么，否则不要使用此选项，因为它可能允许任何人访问您的文件。\n\
  \   - **网络组 (Netgroup)**：网络组是在 NIS 服务器上定义的主机列表。遗憾的是，您的系统必须是 NIS 客户端此功能才有用。\n   -\
  \ **网络和子网掩码 (Network and Netmask)**：允许指定网络上的所有主机连接。要允许 IP 地址为 `192.168.1.0` 到 `192.168.1.255`\
  \ 的所有主机，您需要在网络字段中输入 `192.168.1.0`，在子网掩码字段中输入 `255.255.255.0`。\n\n5. 如果您防止客户端在导出的目录中修改或创建文件，将`访问模式\
  \ (Access mode)` 选项设置为 `只读 (Read only)`。\n\n6. 如果仅导出到信任的系统，将`信任远程用户 (Trust remote\
  \ users)` 选项设置为 `Everyone`。\n\n7. 然而，如果您想确保客户端仅具有单个 UNIX 用户的权限，将`信任远程用户`设置为 `Nobody`，并分别将用户及其主组输入到`将不信任的用户视为\
  \ (Treat untrusted users as)` 和`将不信任的组视为 (Treat untrusted groups as)` 字段中。对于导出给单用户使用的客户端工作站，这非常有用。\n\
  \n8. 点击`创建 (Create)` 按钮保存导出项。如果您在任何字段中犯了错误，将显示解释性错误消息。否则，浏览器将返回导出列表。\n\n9. 点击`应用更改\
  \ (Apply Changes)` 按钮使您的新导出项生效。\n\n允许的客户端现在应该挂载导出的目录。如果不能，请检查系统错误日志，查看来自 NFS 服务器进程的\
  \ get，以解释为什么客户端被拒绝。\n\n### 6.4 编辑或删除 NFS 导出项\n\n可以通过以下步骤随时编辑任何现有 NFS 导出项的所有信息：\n\
  \n1. 在模块主页上，点击`导出到 (Exported to)` 列下您想要编辑的客户端。如果一个目录被多次导出到不同的客户端，则每个每个导出项都必须单独编辑。\n\
  \n2. 在导出编辑表单上（与图 6.2 几乎相同），更改包括要共享的目录在内的任何选项。\n\n3. 如果您想删除该导出项，点击页面右下角的`删除 (Delete)`\
  \ 按钮。否则，点击`保存 (Save)` 保存您的更改。无论何种情况，您的浏览器都会返回模块主页。\n\n4. 点击`应用更改 (Apply Changes)`\
  \ 按钮使更改生效。\n\n### 6.5 Solaris 上的 NFS\n\n\n\n\n在 Solaris 上，NFS 导出由独立的 NFS Shares\
  \ 模块管理。由于 Solaris 使用不同的文件（`/etc/dfs/dfstab`）和文件格式来存储导出，该模块的用户界面与 Linux 模块不同。图 6.3\
  \ 显示了 NFS Shares 模块的主页。如你所见，导出是按目录配置的，而不是按客户端。\n\n#### 图 6.3. Solaris NFS Shares\
  \ 模块。\n\n![](img/06fig03.jpg)\n\n在 Solaris 上添加新的 NFS 导出，请按照以下步骤操作：\n\n1. 点击 `sharing\
  \ a new directory` 链接，这将带您进入输入新导出详情的表单。\n2. 在 `Directory` 字段中输入想要共享的目录。\n3. 在 `Read-only\
  \ access` 和 `Read-write access` 字段中填写您想要授予访问权限的客户端主机名。如名称所示，`Read-only` 字段中的主机将无法在服务器上写入或修改文件。\n\
  4. 除了主机名，您还可以使用格式为 `*@192.168.1*` 或 `*@192.168.1/24*` 的网络、NIS 网络组，甚至是 DNS 域名如 *.foo.com`（开前的点表示整个域名）。\n\
  5. 默认情况下，客户端上的 root 用户对服务器上的文件只有有限的访问权限。要给某些客户端的 root 提供完全的文件访问权限，请在 `Root access`\
  \ 字段中输入其主机名、网络、网络组或域名。\n6. 点击页面底部的 `Save` 按钮创建导出。除非您在表单上出了错误，否则您将返回导出目录列表。\n7. 点击\
  \ `Apply Changes` 按钮使您的新导出生效。\n\n可以通过只需点击模块主页上的目录来编辑现有的 NFS 导出。将出现与创建导出时相同的表单，允许您更改任何选项。如果您想删除导出，请点击页面底部的\
  \ `Delete` 按钮。在进行任何更改后，务必再次点击 `Apply Changes` 以使更改生效。\n\n### 6.6 BSD、MacOS X 和 OpenServer\
  \ 上的 NFS\n\nFreeBSD、NetBSD、OpenBSD、OS X 和 OpenServer 都使用 `/etc/exports` 文件来存储 NFS\
  \ 导出，但其格式在不同的操作系统中是不同的。这意味着它们使用不同的 NFS Exports 模块，该模块有其独特的用户界面，如图 6.4 所示。导出是按目录配置的，而不是按客户端，您可以同时为多个目录指定选项和允许的客户端。\n\
  \n#### 图 6.4. BSD NFS Exports 模块。\n\n![](img/06fig04.jpg)\n\n在这些操作系统之一上添加新的 NFS\
  \ 导出，请按照以下步骤操作：\n\n1. 点击模块主页上的 `Add a new export` 链接。将出现输入新 NFS 导出详情的表单。\n2. 在 `Directories\
  \ to export` 字段中输入您想要共享的目录。请注意，同一文件系统上的多个目录不能单独导出到同一个客户端。\n3. 如果您允许客户端挂载子目录，请选择\
  \ `Export subdirectories?` 选项。但如果启用了此项，`Directories to export` 字段只能输入一个目录，且其必须是文件系统的根目录。\n\
  4. 要给所有客户端只读访问权限，将 `Read only?` 选项设置为 `Yes`。\n5. 要限制访问到单个主机或主机列表，请在 `Clients` 选项中选择\
  \ `Hosts / netgroups`，并在字段中输入您想要的主机、IP 地址或网络组。\n6. 要限制访问到整个网络，选择 `Network` 选项并在相应的字段中输入整个网络地址（如\
  \ `192.168.1.0`）和子网掩码（如 `255.255.255.0`）。\n7. 点击 `Save` 按钮创建导出，将返回主页上的导出列表。\n8.\
  \ 点击 `Apply Changes` 按钮使您的新导出生效。\n\n可以通过只需点击模块主页上的目录来编辑现有的 NFS 导出。将出现与创建导出时相同的表单，允许您更改任何选项，或点击\
  \ `Delete` 按钮将其删除。在进行任何更改后，务必再次点击 `Apply Changes` 以使更改生效。\n\n### 6.7 Irix 上的 NFS\n\
  \nIrix 有其独特的 `/etc/exports` 文件格式，与 BSD 类似但并不完全相同。因此，它也有自己的特殊版本的 NFS Exports 模块，用户界面略有不同。模块的主页列出了正在导出的目录及其导出的主机，布局与图\
  \ 6.4 所示的 BSD NFS Exports 模块非常相似。\n\n在 Irix 上添加新的 NFS 导出，请按照以下步骤操作：\n\n1. 点击主页上的\
  \ `Add a new NFS export` 链接，这将带您进入输入新导出详情的表单。\n2. 在 `Directory to export` 字段中输入目录。\n\
  3. 在 `Export to hosts/netgroups` 字段中输入想要授予访问权限的客户端的主机、IP 地址和网络组。如果此字段为空，将允许任何主机挂载导出的目录。\n\
  4. 为了防止所有客户端修改导出文件，将 `Read-only?` 选项设置为 `Yes`。\n5. 如果您想给某些客户端读写访问权限，给其他客户端只读权限，请在\
  \ `Read/write access` 字段中输入读写客户端的主机或 IP 地址。\n6. 默认情况下，客户端上的 root 用户对服务器上的文件只有有限的访问权限。要给某些客户端的\
  \ root 提供完全的文件访问权限，请在 `Root file access` 字段中输入其主机名或 IP 地址。\n7. 点击 `Save` 按钮创建导出，只要表单没有错误，您将返回主页上的导出列表。\n\
  8. 点击 `Apply Changes` 按钮使您的新导出生效。\n\n可以通过点击模块主页上的其目录来编辑或删除现有的 NFS 导出。如果您进行了任何更改，必须点击\
  \ `Apply Changes` 按钮使之生效。\n\n### 6.8 总结\n\n在本章中，解释了 NFS 文件共享协议，并记录了从一个系统向其他系统共享文件的步骤。您现在应该已经了如何从运行任何支持的\
  \ UNIX 变体的系统将数据导出到任何可以挂载 NFS 文件系统的客户端。您还应该理解使用 NFS 共享文件的安全性影响，并知道通常不应将其用于与不可信任的客户端共享文件。\n\
  \n## 第 7 章 磁盘配额\n\n在本章中，解释了如何使用磁盘配额来限制单个用户可以消耗的空间量。\n\n### 7.1 磁盘配额简介\n\n在有多个用户的系统中，通常需要限制每个用户可以占用的磁盘空间。配额是\
  \ UNIX 系统用于限制每个用户（可能还有每个组）可以拥有的磁盘空间和文件数量的机制。每个文件都计入其所有者的配额，如果使用了组配额，该文件也会计入其组所有者的配额。一旦用户超过了他的配额，他将无法创建或增大任何文件，直到某些文件被删除。\n\
  \n配额是按文件系统设置的，因此您可以对系统上的不同目录设置不同的配额。然而，这意味着如果两个目录都在同一个文件系统上，那么它们必须共享相同的配额。只有本地硬盘上的如\
  \ `ext2`、`ext3` 和 `xfs` 等 UNIX 文件系统支持配额，但如果您的系统通过 NFS 挂载了启用了配额的远程目录，这些配额将在服务器上执行。\n\
  \n\n\n\n每个用户或组都有两个配额：一个针对块（blocks），另一个针对文件（files）。块配额控制用户可以使用多少磁盘空间，它是以磁盘块为单位指定的，通常每个块的大小为\
  \ 1 kB。文件配额控制用户可以创建多少个独立文件，这是非常必要的，因为 UNIX 文件系统通常对同时存在的文件数量设有限制。如果没有文件配额，用户可能会创建数百万个空文件，直到达到文件系统的限制，从而阻止其他用户创建任何文件。\n\
  \n块配额和文件配额都有所谓的“软限制”（soft limits）和“硬限制”（hard limits）。软限制是用户被警告已接近超出配额的界点，但仍允许其继续使用磁盘空间。硬限制是永远无法超过的块数或文件数，任何尝试超过硬限制的操作都会导致错误。这两种限制都是可选的，因此你可以只设置硬限制，而不向用户发出其接近配额的警告；或者只设置软限制，仅对违反配额的用户发出警告，而不是实际上对其进行强制执行。\n\
  \n在 shell 提示符下，可以使用 `repquota` 和 `quota` 命令查看配额，并使用 `edquota` 命令编辑配额。每个文件系统挂载目录下的\
  \ `aquota.user` 和 `aquota.group` 文件包含了每个用户或组分配的磁盘空间以及当前使用情况的实际记录。Webmin 在显示和设置配额时，会调用配额命令并解析其输出。它不会使用系统调用或尝试直接编辑配额文件。\n\
  \n### 7.2 磁盘配额模块\n\nWebmin 的磁盘配额模块位于“系统”（System）类别下。进入该模块后，系统会显示所有可以启用或已启用配额的文件系统列表，以及它们当前的激活状态，以及是否为用户、组或两者都配置了配额。示例见图\
  \ 7.1。\n\n#### 图 7.1 磁盘配额模块。\n\n![](img/07fig01.jpg)\n\n在大多数从未使用过配额的系统上，你的文件系统都不会列出。这是因为必须按照第\
  \ 5 章所述，在“磁盘和网络文件系统”（Disk and Network Filesystems）模块中启用配额。\n\n如果系统没有安装配额操作命令，Webmin\
  \ 会在模块的主页显示错误消息，你将无法激活或编辑任何配额。所有的 Linux 发行版在其 CD 或网站上都应该包含配配命令的软件包。\n\n### 7.3 为文件系统启用配额\n\
  \n如果模块主页上文件系统的“状态”（Status）列显示“用户配额激活”（User Quotas Active）或“组配额激活”（Group Quotas Active），则配额已经启用。如果没有，请按照以下步骤为\
  \ ext2 或 ext3 文件系统配置并开启配额：\n\n1. 如果文件系统已出现在模块主页的列表中，说明配额已经配置过，你可以直接跳到第 5 步。\n2.\
  \ 进入“磁盘和网络文件系统”模块，点击你想启用配额的文件系统。\n3. 将“使用配额？”（Use Quotas?）选项更改为“仅限用户”、“仅限组”或“用户和组”，取决于你想强制执行哪种类型的配额。\n\
  4. 点击“保存”（Save）按钮。如果出现错误说文件系统正在使用中，只需点击“应用到永久列表”（Apply to Permanent List）按钮。通常不需要重启即可启用配额，并在系统下次重启时自动重新启用。然而，如果下一步失败，你需要重启系统来激活它们，这在某些较新的\
  \ Linux 版本上是必要的。\n5. 回到磁盘配额模块，你的文件系统现在应该是可见的。点击“启用配额”（Enable Quotas）链接立即激活配额。\n\n\
  假设一切顺利，浏览器将在短暂延迟后返回配额列表，“状态”列将变为“用户配额激活”。\n\n对于 xfs 文件系统，步骤稍有不同。你必须先在“磁盘和网络文件系统”模块中启用用户和/组配额，然后重启或卸载并重新挂载文件系统。配额将在挂载时自动激活，因此无需在磁盘配额模块中启用它们。\n\
  \n### 7.4 为文件系统禁用配额\n\n要永久禁用 ext2 或 ext3 文件系统的配额，请遵循以下步骤：\n\n1. 在模块主页上，点击文件系统“操作”（Action）列下的“禁用配额”（Disable\
  \ Quotas）。\n2. 为了防止配额在启动时被重新激活，进入“磁盘和网络文件系统”模块并从列表中点击该文件系统。\n3. 将“使用配额？”（Use Quotas?）选项更改为“否”（No）。\n\
  4. 点击“保存”（Save）按钮。如果出现错误说文件系统正在使用中，只需点击“应用到永久列表”（Apply to Permanent List）按钮。\n\n\
  对于 xfs 文件系统，第 1 步是不必要的（也是可能的），因为配额只有在文件系统挂载时才会启用。但在第 4 步保存文件系统的配额设置时，必须干净卸载并重新挂载才能生效。\n\
  \n### 7.5 为用户或组设置配额\n\n在当前启用正确类型配额的文件系统中，可以随时设置或更改用户或组的配额。默认情况下，任何尚未设置配额的用户或组都没有限制，因此可以使用文件系统上的所有磁盘空间。\n\
  \n要为用户设置配额，请遵循以下步骤：\n\n1. 从模块主页的文件系统列表中，点击你想编辑配额的挂载点。这将带你进入一个列出文件系统上所有用户配额的页面，如图\
  \ 7.2 所示。\n\n#### 图 7.2 用户及其配额列表。\n\n![](img/07fig02.jpg)\n\n2. 点击“用户”（User）列下你想编辑的用户名称，或在“编辑配额对象”（Edit\
  \ Quota For）字段中输入用户名并按按钮。这都会带你进入一个包含用户当前配额设置以及已用块和文件的表单，如图 7.3 所示。\n\n#### 图 7.3\
  \ 用户配额表单。\n\n![](img/07fig03.jpg)\n\n3. 将“软块限制”（Soft Block Limit）和“硬块限制”（Hard Block\
  \ Limit）字段设置为你想限制用户的块数，或选择“无限制”（Unlimited）以不实施任何限制。在大多数文件系统中，每个块的大小为 1 kB，但并不总是如此。\n\
  4. 将“软文件限制”（Soft File Limit）和“硬文件限制”（Hard File Limit）字段设置为你想限制用户拥有的文件数量。\n5. 点击“更新”（Update）按钮。新的配额设置将立即生效。\n\
  \n设置组配额的步骤几乎相同。如果文件系统同时启用了用户和组配额，模块主页上每个文件系统将有两个链接：一个针对用户，一个针对组。\n\n### 7.6 将配额复制到多个用户\n\
  \n如果你系统中有大量用户，并希望他们都拥有相同的配额，那么比逐个设置每个用户有一个更简单的解决方案。相反，你可以为一个用户设置所需的配额，然后将其设置复制到任意数量的其他用户中。唯一的缺点是配额会在所有文件系统上复制，而不仅仅是单个。\n\
  \n这种复制配额的步骤如下：\n\n1. 为单个*源*用户设置配额，详见第 7.5 节“为用户或组设置配额”。\n2. 在模块主页上，在“编辑用户配额”（Edit\
  \ User Quotas）页面中输入*源*用户的用户名并按按钮。\n\n\n\n\n\n在显示所有文件系统用户配额的页面上，点击`Copy Quotas`复制配额）按钮。这将引导您进入表单，选择将配额设置复制到哪些用户。\n\
  \n通过选择表单上的一个选项来决定将配额复制到哪些`target`用户：\n\n- **系统上的所有用户**：系统上的每一个用户都具有相同的配额设置。执行此操作后，您可能希望将`root`的配额恢复为无限制。\n\
  - **所选用户**：仅对此选项旁边字段中输入的用户设置配额。\n- **所选组的成员**：对此选项旁边字段中输入的组的所有主要和次要成员都将设置配额。\n\n\
  点击`Copy`复制按钮，将`source`用户在所有文件系统上的配额复制到所有`target`用户。如果你正在使用组配额，也可以将一个组的设置复制到多个其他组。然而，选择复制到哪些组的选项略有不同：`Selected\
  \ users`选项被`Selected groups`（所选组）替换，而`Members of selected groups`选项被`Groups containing\
  \ users`（包含用户的组）替换。后者将复制到所有包含输入用户之一作为成员的组。\n\n### 7.7 设置宽限期\n\n当用户超过其软限制或文件限制时，他仍可以在一定期限内（即宽限期）使用直到达到硬限制的磁盘空间。每个文件系统上的块配额和文件配额都有独立的期限。一旦期限过期，就等同于他达到了硬限制。如果超过的是块配额，则无法再使用更多磁盘空间；如果超过的是文件配额，则无法再创建文件。组配额也可以设置宽限期，如果一个文件系统同时启用了用户和组配额，则它们各各自独立的期限。\n\
  \n要为特定文件系统上的所有用户设置宽限期，请遵循以下步骤：\n\n1. 从模块主页的文件系统列表中点击挂载点。这将引导您进入所有用户及其配额的列表，如图 7.2\
  \ 所示。\n2. 点击`Edit Grace Times`编辑宽限期按钮，这将打开编辑期限的表单。\n3. 对于块和文件配额，选择选择和单位。完成后，点击`Update`按钮保存设置并使宽限期立即生效。\n\
  \n在文件系统上编辑组宽限期的过程几乎完全相同。如果文件系统同时启用了用户和组配额，模块的主页上每个文件系统将有两个链接，一个针对用户，一个针对组。\n\n###\
  \ 7.8 为新用户设置默认配额\n\n如果文件系统启用了用户配额，您可以配置为使用 Webmin 的`Users and Groups`模块创建的新的 UNIX\
  \ 用户分配块和文件配额。正如第 4 章介绍的，每当添加一个用户时，其他模块都会收到通知，以便它们执行额外的操作。在`Disk Quotas`模块中，该操作可以是为该用户在多个文件系统上设置初始配额。\n\
  \n要为特定文件系统上的新用户设置默认配额，请遵循以下步骤：\n\n1. 在模块主页上，点击您想要设置默认值的文件系统的挂载点。这将引导您进入用户及其配额的列表，如图\
  \ 7.2 所示。\n2. 在页面最底部有一个表单，您可以在其中设置默认的硬/软块和文件配额。填写完成后，点击`Apply`按钮。\n\n在`Users and\
  \ Groups`模块中创建的 UNIX 组也可以在组配额页面上设置相同的选项。\n\n### 7.9 其他操作系统\n\n由于磁盘配额在所有 UNIX 版本中的工作方式非常相似，该模块在所有支持的操作系统上看起来几乎完全相同。最大的区别是某些\
  \ UNIX 变体不支持组配额。某些（如 Solaris）在在此模块中激活之前，需要在`Disk and Network Filesystems`模块中启用配额。如果文件系统有配额选项，它将决定配额在启动时是否启用。\n\
  \n### 7.10 配置磁盘配额模块\n\n`Disk Quotas`模块只有几个可以更改以配置其用户界面的选项。要编辑它们，点击主页上的`Module Config`链接，这将引导您进入标准的配置编辑页。`Configurable\
  \ options`标题下的可用设置显示在表 7.1 中。\n\n#### 表 7.11 模块配置选项\n\n| 显示的用户或组的最大数量 | 当您点击模块主页上的文件系统时，将显示具有配额的用户或组的完整列表。然而，如果用户数量超过了此选项的值，则将显示一个输入用户名的文本框，用于查看和设置其配额。\
  \ |\n| 按[blank] 排序用户和组 | 通常情况下，文件系统上具有配额的用户列表按磁盘使用情况排序，但通过更改此选项，您可以让它们按用户名排序，或仅按`repquota`命令使用的顺序显示。\
  \ |\n\n配置页面上的其他选项不应更改，因为它们是 Webmin 根据您的操作系统类型自动设置的。\n\n### 7.11 模块访问控制\n\n正如第 52\
  \ 章所述，可以允许 Webmin 用户仅访问模块的部分功能。在`Disk Quotas`模块中，您可以限制哪些用户和组可以编辑配额，以及在哪些文件系统上可以编辑这些配额。如果您的组织中有人被允许编辑部分或所有配额，但不能执行任何其他管理任务，这就会非常有用。\n\
  \n假设您已经创建了一个具有模块访问权限的用户，设置此权限的步骤如下：\n\n1. 在 Webmin`Users`模块中，点击您想要限制的用户旁边的`Disk\
  \ Quotas`。\n2. 将`Can edit module configuration?`字段设置为`No`，这样用户无法更改用于设置和获取配额的命令。\n\
  3. 要限制可以分配配额的文件系统，将`Filesystems this user can edit`字段更改为`Selected`，并从下列表中选择。\n4.\
  \ 将`Can enable and disable quotas?`字段设置为`No`，除非该用户负责允许文件系统上的所有用户和组配额，否则他将能够关闭他不被允许编辑的用户配额。\n\
  5. 将`Can configure quotas for new users?`字段设置为`No`，这样他就无法更改分配给`Users and Groups`模块中创建的用户的配额。只有当\
  \ Webmin 用户被允许编辑文件系统上的所有配额时，才应将其设置为`Yes`。\n6. 如果您希望此 Webmin 用户更改宽限期，将`Can edit user\
  \ grace times?`和`Can edit group grace times?`字段设置为`No`。\n7. 为了防止用户发放海量磁盘配额，将`Maximum\
  \ grantable block quota`和`Maximum grantable file quota`字段分别设置为可以授予任何单个用户的最大块和文件数。然而，没有任何能阻止他向多个用户授予配额并使其总和超过这些限制。\n\
  \n\n\n\n\n为了限制可以编辑配额的 UNIX 用户，请将 `Users this user can edit quotas for`（此用户可以编辑配额的用户）字段从\
  \ `All users`（所有用户）更改其他选项之一。最有用的是 `Users with UID in range`（UID 在范围内的用户），它将限制访问\
  \ UID 位于相邻字段中输入的最小和最大值之间的用户。允许编辑 root 用户的配额通常不是好主意，因为设置得太低可能会防止系统创建重要的 `PID`、邮件和锁文件。你可以通过选择\
  \ `All except users`（除用户以外的所有用户）并在相邻字段中输入 `root` 来防止这一点，假设你想允许编辑其他所有用户。要停止 Webmin\
  \ 用户编辑任何用户配额，请选择 `Only users`（仅用户）选项并在相邻字段中留空。\n\n同样，你可以通过更改 `Groups this user can\
  \ edit quotas for`（此用户可以编辑配额的组）字段来限制可以编辑配额的组。自然，这只对启用了组配额的文件系统有效。\n\n完成后，点击`Save`\
  \ 按钮立即应用限制。\n\n### 7.12 总结\n\n读完本章后，你应该理解磁盘配额的用处，以及如何在任何 UNIX 系统上启用它们。你还应该知道块配额和文件配额之间的区别、配额与文件系统之间的关系，以及这对包含用户数据的多个文件系统的服务器产生的影响。最后，用户配额和组配额之间的差异及其应该是清晰的。\n\
  \n## 第 8 章：分区、RAID 和 LVM\n\n本章解释了硬盘如何分区，以及如何在这些分区上创建文件系统。它还涵盖了使用 RAID 和 LVM 将多个分区合并为一个大型文件系统的方法。\n\
  \n### 8.1 硬盘分区简介\n\nLinux 以及 PC 硬件上其他操作系统所使用的所有硬盘都被划分为一个或多个不重叠的区域，称为分区。有时整个硬盘会被一个分区占用，但通常你的系统在主磁盘上至少有两个分区：一个用于根文件系统，另一个用于虚拟内存（也称为交换空间）。正如第\
  \ 5 章所解释的，每个分区都可以用于单个文件系统或用于虚拟内存。\n\n每个分区都有一个类型，用于标识其存储的数据类型。有 Linux 文件系统类型、Linux\
  \ 交换空间类型、Windows 文件系统类型等更多类型。几乎每种运行在 PC 硬件上的操作系统都有其自身文件系统的专用分区类型。然而，在你的系统上添加新分区时，你极少使用除专门针对\
  \ Linux 类型以外的类型。\n\n在 PC 系统上，每个硬盘只能包含四个主分区。由于这通常是不够的，四个分区中的一个可以是一个特殊的扩展分区，它可以包含无限数量的逻辑分区。如果你使用扩展分区，那么你的硬盘可以包含的分区数量实际上没有限制。\n\
  \n每个硬盘被划分为等大小的磁道，它们代表磁盘表面的同心圆。较大的硬盘通常有更多的磁道，但由于驱动器几何结构的不同，情况并不总是如此。每个分区都有起始和结束磁道，并占据它们之间磁盘的所有空间。\n\
  \n在更改或格式化系统上的任何现有分区时要非常小心。因为它们包含文件系统数据，删除或修改其中一个可能会删除你的所有文件或导致系统无法启动。Webmin 试图防止这种情况，但只需几次鼠标点击仍然可能造成巨大的损害！通常，你只在向系统添加新硬盘时才需要创建或编辑分区。\n\
  \n### 8.2 本地磁盘分区模块\n\nWebmin 中所有的磁盘分区管理都是通过 `Partitions on Local Disks`（本地磁盘分区）模块完成的，它可以在\
  \ `Hardware`（硬件）类别下找到。进入该模块时，将显示一个显示系统中所有硬盘和分区的页面，如图 8.1 所示。\n\n##### 图 8.1 本地磁盘分区模块。\n\
  \n![](img/08fig01.jpg)\n\n所有的 IDE 和 SCSI 磁盘都会显示出来，以及它们的制造商和型号。如果你的系统有该模块支持的硬件 RAID\
  \ 控制器，将显示 RAID 设备，而不是构成它们的实际底层硬盘。用于软件 RAID 的磁盘和分区将被显示，但它们合并后的逻辑或虚拟驱动器将不会显示。\n\n\
  对于每个磁盘，其上的所有分区都将列出，显示它们的类型、起始和结束磁道以及当前挂载点或其他用途。如果分区包含文件系统，还将显示可用磁盘空间量。如果分区正被用于软件\
  \ RAID，将显示它所属的 RAID 设备。同样，如果分区是 LVM 卷组的一部分，将在 `Use`（用途）列下显示组名。\n\n### 8.3 添加和格式化新分区\n\
  \n如果你刚刚向系统添加了新硬盘并想在 Linux 中使用它，你必须首先对其进行分区，然后将分区格式化为你选择的文件系统类型。此过程的步骤如下：\n\n1. 在\
  \ `Partitions on Local Disks` 模块的主页找到你的新硬盘。它可能还没有任何分区，但制造商可能已经对其设置了一个大分区。\n2. 假设尚无分区，点击新硬盘旁边的\
  \ `Add primary partition`（添加主分区）链接。这将带你进入图 8.2 所示的创建表，以输入新分区的详情。\n\n##### 图 8.2\
  \ 分区创建表。\n\n![](img/08fig02.jpg)\n\n3. 如果新分区占据了整个硬盘，则 `Extent`（范围）字段可以保持不变，因为它们总是自动填充以覆盖磁盘上剩余的所有空空间。然而，如果你想创建多个分区，请调整范围使其仅占用磁盘的一部分。\n\
  4. 如果此分区用于 `ext2`、`ext3`、`reiserfs` 或 `xfs` 文件系统，将 `Type`（类型）字段设置为 `Linux`。\n5.\
  \ 如果它是用于虚拟内存，将 `Type` 设置为 `Linux swap`。\n6. 如果它是用于软件 RAID，将 `Type` 设置为 `Linux raid`。\n\
  7. 如果它是用于 LVM，将 `Type` 设置为 `Linux LVM`。\n8. 如果你正在为其他操作系统创建文件系统，请将 `Type` 字段设置为适用于该操作系统的任何类型。\n\
  9. 点击 `Create`（创建）按钮添加分区。假设没有检测到错误，你将返回模块主页的磁盘和分区列表，该列表现在应该包含新分区。\n\n如果要在新分区上创建\
  \ Linux 文件系统，你必须遵循第 8.4 节“创建新文件系统”中的步骤。虚拟内存分区可以在 `Disk and Network Filesystems`（磁盘和网络文件系统）模块中立即添加。用于\
  \ RAID 的分区也可以在 `Linux RAID` 模块中立即使用，但在创建 RAID 设备之前，你必须已创建组成该 RAID 设备的所有分区。作为 LVM\
  \ 卷组一部分的分可以使用 `Logical Volume Management`（逻辑卷管理）模块立即添加。\n\n### 8.4 创建新文件系统\n\n在新创建的分区用于存储文件之前，必须先在上面创建一个文件系统。文件系统也可以在以前使用过的分区上创建，可能是由另一个操作系统创建的。然而，在使用新文件系统格式化分区时要非常小心，因为它以前包含的任何文件将永远丢失。\n\
  \n创建新文件系统的步骤为：\n\n- 在模块的主页上，点击你想要重新格式化的分区编号。这将带你进入如图 8.3 所示的分区编辑表。\n\n##### 图 8.3\
  \ 分区编辑表。\n\n![](img/08fig03.jpg)\n\n\n\n\n\n页面底部有一个标记为 `Create Filesystem`（创建文件系统）的按钮，旁边有一个支持的文件系统类型菜单。请参阅第\
  \ 5.13 节“文件系统类型比较”了解每种类型的优缺点。做出选择后，点击按钮，它将带您进入一个选择新文件系统的的表。\n\n根据所选文件系统的类型，会有不同的创建选项。对于\
  \ `ext2` 或 `ext3` 文件系统，你可能想要更改的只有 `Reserved blocks`（保留块），它决定了为 root 用户独占保留的磁盘空间大小。默认值为\
  \ 5%，我认为这相当浪费。\n\n点击 `Create Filesystem` 按钮来格式化分区。将显示一个显示新文件系统创建进的页面，对于大硬盘来说，这可能需要一些时间。\n\
  \n假设格式化成功，你现在可以使用 `Disk and Network Filesystems`（磁盘和网络文件系统）模块来挂载新文件系统。\n\n### 8.5\
  \ 分区标签\n\n标签是 Linux 较新版本的一个功能，允许在 `/etc/fstab` 文件中通过短名称而非 IDE 或 SCSI 设备文件（如 `/dev/hdb3`）来标识分区。如果你将\
  \ IDE 驱动器从一个控制器更改到另一个、更改 SCSI 驱动器的 ID，甚至添加一个 ID 比现有驱动器小的 SCSI 驱动器，设备文件可能会发生。这些变化中的任何一个都可能导致分区在启动时无法挂载，可能导致你的系统无法启动。然而，可以通过标签名称引用分区，即使设备文件发生了也不会改变。\n\
  \n某些较新的 Linux 发行版默认对你在安装时创建的文件系统使用标签。如果你在这样的系统上使用 `Disk and Network Filesystems`\
  \ 模块，这些文件系统的 `Location`（位置）列将类似于 `Partition labeled /home` 的内容。\n\n只有带有 `ext2`、`ext3`\
  \ 或 `xfs` 文件系统的分区才能被标记，因为标签存储在文件系统中而不是分区表中。要为现有文件系统标记，请遵循以下步骤：\n\n1. 在模块的主页上，点击你想标记的分区编号。这将带你进入分区编辑表单，如图\
  \ 8.3 所示。\n2. 假设分区当前未被使用，你可以在 `Partition label`（分区标签）字段中输入新标签。它的长度最多为 16 个字符，例如\
  \ `/home` 或 `root`。\n3. 输入标签后，点击 `Save`（保存）按钮。它将被存储在文件系统中，浏览器将返回模块的主页。\n\n此时，可以像第\
  \ 5 章解释的那样，使用 `Disk and Network Filesystems` 模块通过标签名称挂载已标记的文件系统。\n\n## 8.6 删除或更改分区\n\
  \n一旦创建分区，就无法使用 Webmin 更改其在硬盘上的大小或位置。你唯一能做的就是更改其类型或删除它。然而，如果分区上的文件系统列在 `Disk and\
  \ Network Filesystems` 模块列表中（即它目前已挂载或被记录为启动时挂载），则这两种操作都是可能的。\n\n更改分区的类型不会以任何方式损害其上的数据。然而，它可能会无法被某些操作系统或为了某些目的使用。\n\
  \n更改其类型的步骤为：\n\n1. 在模块的主页上，点击你想更改的分区编号。这将带你进入分区编辑表单。\n2. 只要分区未被使用，你就可以从 `Type`（类型）字段中选择新类型并点击\
  \ `Save`（保存）按钮。\n3. 一旦更改，浏览器将返回磁盘和分区的列表。\n\n删除分区应该只在你确定想要丢失其上的所有数据时才进行。然而，这是 Webmin\
  \ 中对分区表进行某些更改的唯一方法，例如用两个小分区替换为一个较大的分区。如果你确定要继续删除，请使用以下流程：\n\n1. 在模块的主页上，点击你想删除的分区编号，这将带你进入分区编辑表单。\n\
  2. 点击 `Delete`（删除）按钮，该按钮仅在分区未被使用时才会显示。这将带你进入一个确认删除的页面。\n3. 如果你真的确定要继续，点击 `Delete\
  \ Now`（立即删除）按钮。一旦任务完成，你将返回模块的主页。\n\n理论上，可以通过创建一个具有相同大小和区（extents）的新分区来恢复已删除的分区。\n\
  \n## 8.7 模块访问控制\n\n惊讶的是，可以限制 Webmin 用户对 `Partitions on Local Disks`（本地磁盘上的分区）模块中某些磁盘的访问权限。如果你的系统有一个可移动的驱动器（如\
  \ Zip 或 Jaz 驱动器），而你想允许用户使用 Webmin 对其进行分区，同时防止他们重新格式化主硬盘，这将是非常有用的。\n\n一旦授予用户对模块的权限，限制其可以访问磁盘的过程包括以下步骤：\n\
  \n1. 在 `Webmin Users` 模块中，点击用户名旁边的 `Partitions on Local Disks`。这将弹出模块访问控制表。\n2.\
  \ 将 `Disks this user can partition and format`（此用户可以分区和格式化的磁盘）字段更改为 `Selected`（已选择），并从下方列表中选择用户允许分区并创建文件系统的磁盘。\n\
  3. 要停止用户在主页看到他们无法管理的磁盘，将 `Can view non-editable disks?`（可以查看不可编辑的磁盘？）选项更改为 `No`（否）。\n\
  4. 最后，点击 `Save`（保存）按钮激活访问控制限制。\n\n仅仅能够分区和格式化磁盘并不特别有用，除非它还可以被挂载。`Disk and Network\
  \ Filesystems` 模块不支持访问控制限制，因为赋予用户挂载文件系统的权限将打开多个安全漏洞。一个更好的解决方案是设置一个自动挂载文件系统，这样可移动设备只需进入一个特殊的挂载点目录即可挂载。\n\
  \n### 8.8 其他操作系统\n\nSolaris 是另一个具有管理磁盘和分区的模块的操作系统，但 Linux 和 Solaris 之间存在几点差异：\n\n\
  - 每个 Solaris 磁盘恰好有 8 个分区，其中某些如果未被使用则可能没有区（extent）。分区永远不需要创建或删除，也没有扩展分区或逻辑分区。\n-\
  \ 在编辑 Solaris 分区时，可以在不需要删除和重建分区的情况下更改其区（extents）。然而，这几乎肯定会导致分区上数据的丢失。\n- 每个分区都有一个类型，指示其用途。`root`\
  \ 类型通常用于根目录文件系统，`swap` 类型用于虚拟内存，`usr` 类型用于其他文件系统，而 `unassigned` 类型用于空分区。\n- 每个分区有两个标记：`Mountable`（可挂载）和\
  \ `Writable`（可写），分别指示它们是否可以被挂载或写入。\n- Solaris 分区上支持的文件系统只有 `ufs`，即原生的 UNIX 文件系统类型。\n\
  - Solaris 不支持分区标记。\n- 在编辑模块访问控制时，没有 `Can view non-editable disks?` 选项。\n- 下文解释的\
  \ `RAID` 和 `LVM` 模块在 Solaris 或任何其他操作系统上均不可用。\n\n### 8.9 RAID 简介\n\nRAID（全称 Redundant\
  \ Array of Inexpensive Disks）是一种将不同磁盘上的多个分区组合成一个大虚拟设备的方法，也称为 RAID 阵。它具有以下几个优势：\n\
  \n- 你可以创建一个与所有现有硬盘一样大的单个文件系统，而不需要在不同的挂载点目录中单独挂载每一个硬盘。\n- 在大多数情况下，向 RAID 设备读取和写入数据比访问单个磁盘更快，因为被读取或写入的数据分布在多个驱动器上。\n\
  \n\n\n\n通过正确的配置，RAID 设备上的数据即使在任何一个故障的情况下也能生存。这是通过将冗余信息分散到所有驱动器来实现，代价是某些磁盘空间。\n\n\
  不同类型的 RAID 配置被称为 `levels`。Linux 支持的级别有：\n\n- **拼接或线性模式 (Concatenated or Linear)**：在此模式下，RAID\
  \ 阵列中的所有分区按尾部连接组合成一个大的虚拟设备。写入设备的数据将填满第一块磁盘，然后进入第二块磁盘，依此类推。线性模式通常不会加快数据访问速度，因为被读取或写入的文件块可能在同一块磁盘上相邻。\n\
  \n- **RAID 0 或条带模式 (RAID 0 or Striped)**：与线性模式一样，条带模式中的多个分区也被组合成一个大设备。然而，写入阵列的数据将均匀分布在所有磁盘上，因此读取或写入单个大文件的速度快得多。理想情况下，如果你在条带\
  \ RAID 阵列中有 5 块磁盘，访问数据的速度将快 5 倍。这种模式唯一的问题是无法很好地处理大小不同的磁盘，磁盘上大于其他部分的空间仍然会被使用，但仅以其正常速度运行。\n\
  \n- **RAID 1 或镜像模式 (RAID 1 or Mirrored)**：在镜像模式下，阵列中的每个分区包含完全相同的数据。这意味着在发生磁盘故障时，即使只有一个磁盘存，你的数据也是安全的。缺点是，在正常情况下大多数磁盘都被浪费了，阵列的可用空间仅相当于最小分区的大小。从镜像阵列读取的速度与从条带阵列读取一样，但由于需要同时向所有磁盘写入所有数据，写入速度将与最慢磁盘一样。\n\
  \n- **RAID 4 或奇偶模式 (RAID 4 or Parity)**：奇偶模式很少使用，因为它相比 RAID 5 没有真正的优势。它提供了单磁盘故障保护，并增加了读取速度，但不增加写入速度。RAID\
  \ 4 阵列可以承受任何一个磁盘的丢失，因为它专门用一个磁盘来存储奇偶信息，当其中一个磁盘故障时，可以使用它可以重构其他磁盘上的数据。由于对阵列的所有写入导致对此磁盘的写入，它会成为减慢整个阵列的瓶颈。\n\
  \n- **RAID 5 或冗余模式 (RAID 5 or Redundant)**：这是最有用的 RAID 模式，因为它提供了磁盘故障保护，增加了读/写速度，并将多个分区组合成一个大的虚拟设备。RAID\
  \ 5 阵列可以承受任何一个磁盘的丢失而不丢失所有数据，但代价是牺牲所有磁盘上的某些空间来存储冗余信息。它比线性模式快，但由于需要维护冗余性，没有条带模式那么快。\n\
  \n本章仅涵盖 Linux 上的 RAID 配置软件。如果你的系统有单独 RAID 控制器卡或外部阵列，你将需要特殊软件进行设置。硬件控制器上的虚拟 RAID\
  \ 设备将出现在 `Partitions on Local Disks` 模块中进行分区，就像真实的硬盘一样。它们在 Linux RAID 模块中不可见也无法配置。\n\
  \n### 8.10 Linux RAID 模块\n\n该模块允许你在 Linux 系统上创建、格式化和删除 RAID 阵列。与其他硬盘相关的模块一样，它可以在“Hardware”（硬件）类别下找到它。当你进入该模块时，主页将显示现有\
  \ RAID 设备（如果有），如图 8.4 所示。\n\n##### 图 8.4. Linux RAID 模块。\n\n![](img/08fig04.jpg)\n\
  \n如果 Webmin 检测到系统中缺少设置 RAID 使用的命令，模块的主页上将显示错误消息。然而，大多数 Linux 发行版的 CD 或网站上都应该有一个包含\
  \ RAID 命令的包。如果你的 Linux 内核在编译时没有启用 RAID 支持，将显示不同的错误。在这种情况下，你可能需要重新编译开启 RAID 支持的内核。\n\
  \n假设所有必要的包已安装，添加新的 RAID 设备相对简单。要遵循的步骤如下：\n\n1. 在 `Partitions on Local Disks` 模块中，在你在你想要用于\
  \ RAID 的每块磁盘上创建一个分区。也可以使用现有分区，只要它们不包含你不想被覆盖的数据。部分用于其他用途的磁盘也可以为 RAID 使用添加新分区，尽管这可能会抵消部分性能益处。\n\
  2. 每一个将成为 RAID 阵列一部分的分区，其类型都应设置为 `Linux raid`。除非你使用的是线性模式，否则所有分区的都应相同，以免浪费较大分区上的空间。\n\
  3. 此时，可能需要重启系统。某些 Linux 内核只能在启动时检测新分区。如果你不重启且分区未被检测到，则 RAID 设备的创建将失败。\n4. 在模块的主页上，选择你想使用的\
  \ RAID 级别并点击 `Create RAID device of level` 按钮。这将引导你进入表单，用于选择作为阵列一部分的分和其他选项（假设 Webmin\
  \ 检测到系统中至少有一个未使用的分区）。\n5. `Partitions in RAID` 选项将列出当前未使用的硬盘分区，以便可能包含你的 RAID 设备中。它还会列出任何其他未使用的\
  \ RAID 设备，允许你在理论上创建一个包含其他阵列的阵列。选择所有你想包含在新的 RAID 设备中的分区。\n6. 如果所选区的任何一个之前被用于其他用途，应将\
  \ `Force initialization of RAID?` 选项设置为 `Yes`。否则，如果在任何分区上检测到文件系统，新阵列的创建将失败。\n7.\
  \ 点击 `Create` 按钮设置新阵列。如果成功，将返回模块主页，现在它应该包含你的新 RAID 设备。\n8. 如果你想在新设备上创建文件系统以便进行挂载，请点击它的图标进入设备状态页。如果\
  \ RAID 设备将用于虚拟内存、作为 LVM 卷组的一部分或另一个 RAID 阵列的一部分，则没有必要。\n9. 从页面底部的菜单中选择你想创建的文件系统类型，并点击\
  \ `Create filesystem of type` 按钮。\n10. 如第 8.4 节“创建新文件系统”所示，为新文件系统选择任何选项。完成后，点击 `Create`\
  \ 按钮。将显示新文件系统创建进度的页面，对于大型阵列这可能需要一些时间。\n11. 假设格式化成功，你现在可以使用 `Disk and Network Filesystems`\
  \ 模块挂载新文件系统。\n\n未使用的现有 RAID 设备可以通过点击模块主页上的图标并按 `Delete` 按钮来删除或禁用。删除设备会导致存储在上面的任何数据永久丢失。\n\
  \n### 8.11 LVM 简介\n\nLVM（逻辑卷管理器）是一个强大的 Linux 功能，它在系统上的物理分区和存储其数据的文件系统之间添加了抽象层。由\
  \ LVM 管理的分区被称为 `physical volumes`（物理卷），它们组合形成 `volume groups`（卷组）。从每个卷组可以创建 `logical\
  \ volumes`（逻辑卷），文件系统实际上存储在。每个卷组的大小是其所有物理卷的大小之和。此空间可以分配给尽可能多的容得下的逻辑卷，因此它可以包含许多小的逻辑卷，或一个跨越多个物理卷（以及分区）的巨大逻辑卷。\n\
  \n\n\n\n乍看之下，LVM 并不比 RAID 强大，因为 RAID 也可以将多个分区合并成一个大文件系统。然而，它赋予了你更大的自由，可以将磁盘划分为单独的文件系统，这些系统可以占用部分磁盘、多个磁盘或它们之间的任何任意组合。唯一的缺点是\
  \ LVM 不像 RAID 1 级和 5 级那样支持冗余。\n\nLVM 最用的特性是能够调整逻辑卷及其内部文件系统的大小，最高可达到卷组中的可用空间总量。可以向现有的卷组添加额外的物理卷（例如新安装的硬盘分区），从而增加可用空间量。例如，如果你的系统有两个硬盘，它们的分区组合成一个卷组，你可能在逻辑卷上拥有一个等于两块硬盘总和的文件系统。如果你开始遇到磁盘空间耗尽并想要扩展文件系统，可以安装一个新硬盘，将其添加到卷组，然后扩大逻辑卷以利用所有新的空闲空间！这比将新硬盘挂载到现有文件系统下的某个子目录下要方便得多。\n\
  \n##### 图 8.5. 逻辑卷管理器概述。\n\n![](img/08fig05.gif)\n\n物理卷也可以从 LVM 卷组中移除，只要组内有足够的可用空间来存储原本在物理卷上的数据。这意味着理论上，你可以从系统中移除一块较小的硬盘并将其替换为更大的硬盘，而无需手动移动文件。\n\
  \n## 8.12 逻辑卷管理模块\n\nWebmin 的逻辑卷管理器模块允许你执行几乎所有可以使用命令行 LVM 工具完成的任务。当你从“硬件”（Hardware）类别进入该模块时，主页面会显示所有现有的卷组及其物理和逻辑卷，如图\
  \ 8.6 所示。\n\n##### 图 8.6. 逻辑卷管理模块。\n\n![](img/08fig06.jpg)\n\n由于该模块依赖于 `vgcreate`\
  \ 等 LVM 工具，如果找不到这些工具，主页面将显示错误消息。然而，如果你运行的是较新版本的 Linux，你的发行版光盘或网站上应该是这些这些。它还会通过查找\
  \ `/proc/lvm` 目录来检查内核是否支持 LVM。如果缺少支持，你需要使用命令 `modprobe lvm-mod` 加载 `lvm-mod` 内核模块，或者重新编译带有\
  \ LVM 支持的内核。\n\n## 8.13 创建新卷组\n\n假设你至少有一个空闲分区供 LVM 使用，设置新卷组非常简单。要遵循的步骤如下：\n\n1.\
  \ 在“本地磁盘上的分区”（Partitions on Local disks）模块中，将你想要包含在卷组中的任何分区类型更改为 `Linux LVM`。尝试使用其他类型的分区都会失败。\n\
  2. 回到“逻辑卷管理器”（Logical Volume Manager）模块，点击“添加卷组”（Add a new volume group）链接，这将引导你进入卷组创建表。\n\
  3. 在“卷组名称”（Volume group name）字段中为你的新卷组输入名称。该名称应该短且不包含空格，例如 `data_vg`。\n4. 使用“初始物理设备”（Initial\
  \ physical device）字段选择要包含在卷组中的初始分区。只有 Webmin 确定未被使用的分区或 RAID 设备才会出现在列表中。你也可以通过选择“其他”（Other）选项并在旁边的字段中输入设备文件名来指定分区。\n\
  5. 如果“其他”是唯一的可用选项，说明 Webmin 未检测到任何可供 LVM 使用的分区。\n6. 请注意，你选择的分区或设备上的任何数据将永久丢失，即使该卷组实际上未被使用。\n\
  7. 点击“创建”（Create）按钮。如果一切顺利，你将返回模块的主页，并且你的卷组及其初始物理卷将显示出来。\n\n要向你的新卷组添加更多物理卷，请参见第\
  \ 8.14 节“添加和移除物理卷”。\n\n## 8.14 添加和移除物理卷\n\n一旦使用初始物理卷创建了卷组，你可以随时向其添加新的分区或 RAID 设备。这将增加卷组中的可用空间，并允许你创建更多逻辑卷或扩展现有卷。要添加物理卷，请遵循以下步骤：\n\
  \n1. 如果你正在添加磁盘分区，使用“本地磁盘上的分区”（Partitions on Local Disks）模块将其类型更改为 `Linux LVM`。\n\
  2. 在“逻辑卷管理”（Logical Volume Management）模块的主页上，在相应的卷组部分点击“向组添加物理卷”（Add a physical\
  \ volume to the group）。这将带你选择要添加的分区或 RAID 设备的页面。\n3. 从“磁盘设备”（Disk device）字段列表中选择你想要添加的或者选择“其他”（Other）选项并手动输入设备文件。只有\
  \ Webmin 认为未在别处使用的分区可供选择。\n4. 请注意，你选择的分区或设备上的任何数据将永久丢失。\n5.点击“添加到卷组”（Add to volume\
  \ group）按钮添加物理卷。如果成功，你将返回模块的主页。\n\n同样可以从卷组中移除物理卷，只要组内有足够的可用空间来存储之前在物理卷上的所有数据。执行此操作的步骤为：\n\
  \n1. 在主页上，点击你要移除的物理卷图标。\n2.点击“从卷组中移除”（Remove from volume group）按钮。假设移除是可能的，由于数据移动到其他物理卷，可能会出现延迟。\n\
  3. 一旦移除完成且浏览器返回卷组列表，你就可以立即将该分区用于其他用途。它可以被格式化为文件系统并挂载、包含在 RAID 组中，甚至添加到另一个卷组。\n\n\
  ## 8.15 创建和删除逻辑卷\n\n只要卷组还有一些可用空间，你就可以随时向其添加逻辑卷。逻辑卷的可以是任何大小，但大小将始终向上取整为卷组使用的分配块大小的倍数（默认为\
  \ 4 MB）。你可以通过点击模块主页上的卷组图标查看当前块大小、已分配块数和总块数。\n\n添加新逻辑卷的步骤如下：\n\n1. 在卷组列表中，点击你想添加卷的卷组旁边的“创建新逻辑卷”（Create\
  \ a new logical volume）链接。\n2. 在“卷名称”（Volume name）字段中为你的新逻辑卷输入名称。该名称应该短且不包含空格，例如\
  \ `data_lv`。\n3. 对于“卷大小”（Volume size）字段，输入分配给此卷的千字节数。你输入的任何内容将向上取整到下方显示的最近分配块大小。\n\
  4. 默认，该字段将设置为卷组中的可用空间总量。\n5. 如果“分配方法”（Allocation method）选项设置为“连续”（Contiguous），则为此逻辑卷保留的所有空间将位于磁盘上的一个大块中。这可以加快数据访问，但如果你添加和删除逻辑卷导致卷组碎片化，它就会缺乏活性。因此，通常最好将选项设置为“非连续”（Non-contiguous）。\n\
  6. “卷条带”（Volume striping）选项控制逻辑卷数据在磁盘上的布局方式。“禁用”（Disabled）选项类似于 RAID 中的线性模式，而“跨卷条带”（Stripe\
  \ across）选项则类似于条带模式。更详细的解释请参阅第 8.9 节“RAID 简介”。\n\n当所有字段都设置得你满意后，点击“创建”（Create）按钮。只要所有字段都正确填写且卷组中有足够的可用空间，浏览器将返回模块主页，你应该能看到你逻辑卷的新图标。\n\
  \n\n\n\n\n假设你想将新的逻辑卷挂载到某处，你首先需要在上面创建一个文件系统。为此，点击该模块主页上的相应图标，这将带你进入逻辑卷编辑页面。\n\n从页面底部的菜单选择你想要创建的文件系统类型，并点击\
  \ `Create filesystem of type` 按钮。\n\n按照第 8.4 节“创建新文件系统”中的说明，为新文件系统选择任何选项。完成后，点击\
  \ `Create` 按钮。将显示一个新文件系统创建进度的页面，对于大卷，这可能需要一些时间。\n\n假设格式化成功，你现在可以使用 `Disk and Network\
  \ Filesystems` 模块来挂载新的文件系统。\n\n可以从卷组中删除现有的逻辑卷以释放空间或减小卷组的大小。在删除逻辑卷之前，必须在 `Disk and\
  \ Network Filesystems` 模块中将其卸载。删除删除时，其中包含的任何数据将永久丢失。\n\n要删除逻辑卷，请遵循以下步骤：\n\n1. 点击模块主页上的图标，这将带你进入逻辑卷编辑表单。\n\
  2. 点击 `Delete` 按钮。这将弹出一个页面，询问你是否确定要删除它。\n3. 点击 `Delete Now` 确认。一旦它从卷组中移除，你的浏览器将返回模块主页。释放的空间可以立即重新用于另一个逻辑卷。\n\
  \n### 8.16 调整逻辑卷大小\n\n`LVM` 最强大的功能之一是能够扩大或缩小现有的逻辑卷，即使它们包含文件系统。然而，Webmin 目前仅支持调整\
  \ `ext2`、`ext3`、`reiserfs` 和 `jfs` 文件系统的大小，使用其他文件系统类型（如 `xfs`）格式化的逻辑卷在不丢失数据的情况下无法调整大小。在调整逻辑卷大小之前，你必须先卸载，之后再挂载，因为没有办法调整正在使用的文件系统的大小。\n\
  \n正如预期的那样，逻辑卷的只能通过其卷组中的可用空间量来扩大。在缩减包含支持的文件系统的逻辑卷时，其大小不能缩小到小于文件系统中文件所占的空间。目前，`jfs`\
  \ 文件系统完全无法缩小，只能扩大。\n\n调整逻辑卷大小遵循的步骤为：\n\n1. 在 `Disk and Network Filesystems` 模块中，确保逻辑卷已卸载。\n\
  2. 在 `Logical Volume Management` 模块的主页上，点击其图标。这将带你进入卷编辑表。\n3. 在 `Volume size` 字段中以\
  \ `kB` 输入新大小。除非你计划重新创建文件系统，否则增加不能超过卷组中的可用空间，也不能缩小到小于文件系统中文件所占的空间。\n4. 点击 `Save`\
  \ 按钮。当调整包含 `ext2`、`ext3`、`reiserfs` 或 `jfs` 文件系统的卷时，只要没有遇到问题，你将返回模块主页。\n\n然而，如果文件系统无法缩小到其文件所占空间以下，将出现一个错误页面，提供无论如何调整大小的选项。点击\
  \ `Resize Logical Volume` 按钮将强制调整大小，但卷上的任何文件将丢失，你需要重新创建文件系统。\n\n如果你正在调整包含其他类型文件系统（如\
  \ `xfs`）的逻辑卷，或者内容对 Webmin 未知的逻辑卷，将出现一个要求你确认调整大小的页面。如果你点击 `Resize Logical Volume`\
  \ 继续，卷上的任何文件系统将丢失并需要重新创建。\n\n如果文件系统成功调整大小，你可以在 `Disk and Network Filesystems` 模块中重新挂载它。否则，你需要按照第\
  \ 8.15 节“创建和删除逻辑卷”中的说明重新创建它。\n\n### 8.17 创建快照\n\n快照是一种特殊的逻辑卷，实际上是另一个卷的临时只读副本。当创建快照时，它似乎包含了源卷中所有数据的副本，因此如果源卷发生变化，快照将保持不变。为了节省磁盘空间，快照实际上只存储自创建以来原始逻辑卷上发生变化的数据。这使得即使卷组可用空间少于\
  \ 100 MB，也可能为 100 MB 的卷创建一个快照副本。\n\n快照对于在某个时间点快速冻结文件系统以便对其进行安全备份非常有有用处。快照甚至可以充当备份本身，如果原始卷上的文件出现问题，你可以恢复到它。唯一的缺点是，只有在源逻辑卷卸载时才能安全地创建快照，因为挂载的文件系统将处于有效的复制状态。\n\
  \n要创建快照，请遵循以下步骤：\n\n1. 在 `Disk and Network Filesystems` 模块中，如有必要，卸载原始逻辑卷上的文件系统。\n\
  2. 回到 `Logical Volume Management` 模块，点击与原始卷相同卷组中的 `Create a new snapshot` 链接。\n\
  3. 在快照创建表单上，在 `Volume name` 字段输入一个不带空格的短名称，例如 `data_snap`。\n4. 对于 `Volume size`，输入分配给此快照的磁盘空间（单位\
  \ `kB`），用于存储快照创建后原始逻辑卷的变化。如果空间太小且对逻辑卷进行了过多更改，在读取快照文件系统中的文件时将开始出现 I/O 错误。\n5. 对于\
  \ `Snapshot of logical volume` 字段，选择你想要制作副本的逻辑卷。\n6. 点击 `Create` 按钮创建快照并返回主页。你的新快照图标将出现在该卷组的其他逻辑卷中。\n\
  7. 在 `Disk and Network Filesystems` 模块中，重新挂载原始逻辑卷上的文件系统。你也可以在这里单独挂载快照上的文件系统。\n\n\
  一旦创建，可以按照调整普通逻辑卷的方式调整快照的大小。然而，这不会调整快照上的文件系统，而是改变了用于存储快照与原始卷组之间差异的可用空间。快照也可以被删除，前提是其上的文件系统已卸载。快照中的任何数据将丢失，但由于它只是另一个卷的副本，这可能并不重要。\n\
  \n### 8.18 总结\n\n本章涵盖了 Linux 系统用于存储文件系统的三种底层设备。最简单的是普通磁盘分区，它们只是硬盘的一个部分。RAID 设备更为复杂，因为它将多个分区组合成单个巨大的虚拟分区。`LVM`\
  \ 是所有设备中最复杂、最强大的，可用于创建跨多个分区的卷，并且这些卷包含可以随着空间增加而扩展的文件系统。当这些设备类型用文件系统进行初始化并挂载到某个目录时，它们对用户来说看起来都是相同的。\n\
  \n读完本章后，你应该能理解它们在简单性、可靠性和灵活性方面的区别。你应该能够根据你拥有的硬盘数量和数据重要性，为自己的系统选择最佳的一种。\n\n## 第 9\
  \ 章 启动与关机\n\n本章解释了在启动时启动服务器和服务的方法，并告诉你如何使用 Webmin 在启动时运行你自己的命令。\n\n### 9.1 Linux\
  \ 启动过程简介\n\n\n\n\n\nPC 启动时发生的第一件事是从 ROM 加载 BIOS。`BIOS`（基本输入输出系统）会执行内存和其他硬件检查，然后从系统硬盘之一的第一个部分（称为主引导记录或\
  \ `MBR`）中加载一小段代码。这段代码被称为 `boot loader`（启动引导加载程序），负责向用户显示操作系统列表并加载其中一个。Linux 提供了多种可用的启动引导加载程序，如\
  \ `LILO` 和 `GRUB`，但它们的作用基本上是相同的。\n\n一旦内核加载完成，它会挂载根文件系统并运行 `init` 程序，该程序负责管理启动过程的其余部分。它读取\
  \ `/etc/inittab` 文件并执行其中指定的命令，其中最重要的一条是开始启动脚本的执行。每个脚本都负责一项任务，例如初始化网络接口、启动 Web 服务器或挂载其他文件系统。这些脚本的执行顺序是固定的，因为某些后期的脚本依赖于之前的脚本。例如，在启用网络接口之前，无法挂载网络文件系统。\n\
  \n在关机时，还会运行一系列脚本来关闭服务器并卸载文件系统。这些脚本也有固定的顺序，以确保最后才停用网络和其他基础服务。如果请求且硬件支持，关机过程的最后一步将是由内核关闭系统电源。\n\
  \n当 Linux 系统启动时，会根据其启动时的 `runlevel`（运行级别）执行不同的脚本。运行级别可以由启动引导加载程序或 `/etc/inittab`\
  \ 文件设置。\n\n常用的运行级别有：\n\n- **5 图形模式**：所有服务器和服务程序都将启动，并启动 X 在控制台上显示图形登录提示。\n- **3\
  \ 多用户模式**：所有服务器和服务程序都将启动，但控制台上仅提供普通的文本登录。\n- **2 不带 NFS 的多用户模式**：几乎所有服务器和服务程序都将启动，但不会挂载\
  \ NFS 文件系统。\n- **1 单用户模式**：仅完成最基本的系统初始化，并在控制台上打开一个 root shell。如果某些启动脚本失败导致系统无法启动，此运行级别非常有用。\n\
  \n有关如何更改启动运行级别，请参阅第 9.9 节“SysV Init 配置模块”。\n\n`/etc/rc.d/init.d` 通常用于存储实际的启动 shell\
  \ 脚本。每个运行级别下启动或停止的脚本由 `/etc/rc.d/rc*X*.d` 目录中的符号链接决定，其中 `X` 是运行级别数字。每个符号链接的名称类似于\
  \ `S*YY*scriptname`，其中 `YY` 是脚本在启动过程中的启动顺序，数字越小，脚本启动得越早。因此，`/etc/rc.d/rc5.d/S10network`\
  \ 会在运行级别 5 中于 `/etc/rc.d/rc5.d/S80sendmail` 之前运行。\n\n并不是所有的 Linux 发行版使用这些目录作为启动脚本。某些使用\
  \ `/etc/init.d` 存放实际脚本文件，而另一些（如旧版本的 SuSE）则将所有内容放在 `/sbin` 目录。幸运的是，`/etc/rc.d` 似乎正在成为较新发行版的标准基础目录。当然，如果你正在使用\
  \ Webmin，就不必担心这些任何目录的位置，因为它始终知道它们在哪里。\n\n### 9.2 启动和关机模块\n\n此模块允许你创建和编辑在启动和关机时运行的脚本，模块将这些脚本称为\
  \ `actions`（操作）。你可以在 Webmin 的系统类别下找到它，进入后后，主页面将显示所有可用操作的列表、它们是否在启动时启动以及每个操作的简要描述。示例见图\
  \ 9.1。\n\n#### 图 9.1. 启动和关机模块。\n\n![](img/09fig01.jpg)\n\n每个 Linux 发行版都有自己的一套标准操作脚本，因此在一个系统上，脚本\
  \ `httpd` 可能会启动 Apache Web 服务器，但在另一个系统上，它可能被称为 `apache`。然而，你应该能够通过其描述很好地了解每个脚本的作用。\n\
  \n### 9.3 配置在启动时启动的操作\n\n如果你系统上的某些服务器（如 Apache 或 `Squid`）当前没有在启动时启动，你可以使用此模块来更改此设置。在大多数\
  \ Linux 发行版中，随发行版自带的每个服务器都有它们自己的启动操作脚本，但并非所有脚本都是默认启用的。要配置操作在启动时启动，需要遵循的步骤如下：\n\n\
  1. 在模块的主页面上，点击你想要启的操作名称。这将带你进入操作编辑页面，如图 9.2 所示。\n\n#### 图 9.2. 操作编辑表。\n\n![](img/09fig02.jpg)\n\
  \n2. 将 `Start at boot time?`（启动时启动？）选项从 `No` 更改为 `Yes`。\n3. 点击 `Save`（保存）按钮，浏览器将返回主页的操作列表。\n\
  \n如果你有一个当前在启动时运行但你想禁用的服务器，只需按照相同的步骤操作，并将 `Start at boot time?` 选项设置为 `No` 即可。\n\n\
  ### 9.4 启动和停止操作\n\n尽管操作脚本通常在启动时并在关机时停止，但你可以使用 Webmin 随时启动或停止它们。许多操作脚本还可以执行额外功能，例如显示服务器状态或重新加载其配置。要启动或停止操作，请执行以下操作：\n\
  \n1. 在模块的主页面上，点击操作名称。这将带你进入图 9.2 所示的操作表单。\n2. 页面底部有一行按钮，每个按钮用于运行操作脚本以执行某些功能。根据脚本的不同，可能会有不同的按钮，但最常见的包括：\n\
  \n   - `Start Now`（立即启动）：启动服务器或服务。在某些 Linux 版本上，如果操作已经启动且服务器正在运行，此将无所作用。\n   - `Stop\
  \ Now`（立即停止）：停止服务器或服务。在某些 Linux 版本中，除非操作已经启动，否则将什么都不做。\n   - `Restart Now`（立即重启）：停止并重启服务器。在许多情况下，如果操作尚未启动，此将无所作用。\n\
  \   - `Reload Now`（立即重载）：可用时，此功能告诉由操作启动的服务器重新读取其配置文件。\n   - `Show Status`（显示状态）：仅显示消息告知服务器是否正在运行，如果正在运行，其\
  \ `PID` 是什么。\n\n在点击你想要执行的功能按钮后，将出现一个显示操作脚本输出的页面。这应该会指示操作是否执行成功。\n\n### 9.5 添加新操作\n\
  \n如果你有一个想要在启动时运行的命令，创建一个新的操作脚本是设置它的最佳方法。像 Apache 或 `Qmail` 这样经过手动编译和安装的服务器没有操作，因此你需要创建一个运行启动服务器所需的任何命令的操作。\n\
  \n要创建你自己的操作，请遵循以下步骤：\n\n1. 在模块的主页面上，点击现有操作列表上方或下方的 `Create a new bootup and shutdown\
  \ action` 。这将带你进入图 9.3 所示的表单，用于输入新操作脚本的代码。\n\n#### 图 9.3. 操作创建表单。\n\n![](img/09fig03.jpg)\n\
  \n2. 在 `Name`（名称）字段中，为操作输入短名称，例如 `qmail`。每个操作必须有一个唯一的名称。\n3. 在 `Description`（描述）字段中，输入几行文本描述你的操作，可以是\
  \ `Start the Qmail mail server`。这将显示在模块主页的描述列。\n4. `Bootup commands`（启动命令）字段必须填写你希望在操作启动启动时运行的\
  \ shell 命令。例如，如果你想启动 Qmail，可能会输入 `/var/qmail/rc*`。\n\n\n\n\n`Shutdown commands`（停止命令）字段应填写您希望在动作停止时运行的命令。例如，要停止\
  \ Qmail，您可能输入 `killall 9 qmail-send`。\n\n假设您希望动作在系统启动时运行，请将 `Start at boot time?`（启动时启动？）选项设置为\
  \ `Yes`（是）。\n\n最后，点击 `Create`（创建）按钮保存新动作。Webmin 将 `/etc/rc.d/init.d` 目录下创建一个脚本，将您输入的命令与标准外壳程序相结合，以创建一个有效的动作脚本。您的动作将被设置为在当前运行级别运行，顺序号为\
  \ `99`，以便其在最后执行。如果您想精确控制动作在哪些运行级别以及以什么顺序运行，请参阅第 9.7 节“配置启动和停止模块”中的`Allow selection\
  \ of individual runlevels（允许选择单个运行级别）选项。\n\n创建动作后，您可以通过以下过程编辑启动和停止命令：\n\n在模块的主页上，点击您的动作名称。这将带您进入图\
  \ 9.2 所示的动作编辑表。\n\n在 `Action script`（动作脚本）文本框中，寻找类似 `'start')` 的行。启动时运行的命令将紧随其后，直到仅包含\
  \ `;;` 的那一行。根据您的意愿编辑它们，但请保持周围代码不变。\n\n同样，在动作停止时运行的命令位于 `'stop')` 和 `;;` 之间。除非您知道自己在做什么，否则更改脚本的任何其他部分都是一个坏主意。\n\
  \n点击 `Save`（保存）按钮应用您的更改。\n\n您可以使用 Webmin 编辑任何现有的动作脚本，而不仅仅是您创建的。编辑它们时要小心，因为它们的格式可能与\
  \ Webmin 创建的脚本完全不同。\n\n## 9.6 重启或关闭您的系统\n\nLinux 系统应始终使用适当的命令进行重启或关闭，而不是简单地关闭电源或按下重位键。否则，您可能会丢失本地硬盘上的数据，并且如果使用非日志文件系统，则无疑必须在启动时等待通过\
  \ `fsck` 进行漫长的文件系统检查。\n\n要重启系统，只需执行以下操作：\n\n在启动和停止模块主页的底部，点击 `Reboot System`（重启系统）按钮。这将带您进入一个确认页面，询问您是否真的想重启。\n\
  \n点击确认页面上的 `Reboot System`（重启系统）按钮。关闭过程将立即开始，如果您在控制台登录，你的会话将被注销。在所有停止脚本运行之后，系统将如引言中所解释的那样再次启动。\n\
  \n关闭过程几乎完全相同，只需使用页面底部的 `Shutdown System`（关闭系统）按钮即可。\n\n## 9.7 配置启动和停止模块\n\n与大多数模块一样，启动和停止模块可以通过点击主页上的\
  \ `Module Config`（模块配置）链接进行配置。这将带您进入标准的配置编辑页面，在该页面上，表 9.1 中的设置位于 `Configurable options（可配置选项）`\
  \ 标题标题下。\n\n不应更改配置页面上的任何其他选项，因为它们是由 Webmin 根据您的操作系统类型自动设置的。\n\n### 9.8 其他操作系统\n\n\
  许多其他 UNIX 操作系统（但并非所有）都使用 Linux 所使用的系统启动脚本系统。即使是那些使用该系统的系统，在实现上也有细微差异，并且几乎所有系统使用不同的目录来存储实际脚本和链接。\n\
  \nSun Solaris、HP/UX、SCO UnixWare、SCO OpenServer、CompaTru64/OSF1 和 SGI Irix 这些操作系统都使用与\
  \ Linux 非常相似的动作脚本，但存储在不同的目录中。由于自带的脚本没有描述，模块的主页默认将只显示动作名称。\n\n### 表 9.1 模块配置选项\n\n\
  | Allow selection of individual runlevels（允许选择单个运行级别） | 在编辑或创建动作时设置为 `Yes`，您将能够为每个运行级别中的动作输入精确的顺序号。由于这相当复杂，此选项默认设置为\
  \ `No`，以便 Webmin 在创建或编辑动作时仅显示单个 `Start at boot?（启动时启动？）` 。 |\n| Display actions\
  \ with descriptions（显示带描述的动作） | 如果此选项设置为 `Yes` 并显示所有运行级别，主页将准确显示每个动作在哪些运行级别启动，以及相应的描述。如果设置为\
  \ `Yes`，每个动作将仅显示它是否在启动时启动以及其描述。这是大多数系统的默认设置。如果设置为 `No`，主页将仅显示动作名称表格，不带描述或启动信息。如果您有许多动作或您的操作系统在动作脚本中不包含描述，则此非常有用。\
  \ |\n| Show boot order of actions?（显示动作启动顺序？） | 如果选择 `Yes`，主页将包含当前运行级别或某些其他运行级别中每个动作的启动顺序。默认的\
  \ `No` 选项隐藏此信息。 |\n| Show current status of actions（显示动作当前状态） | 在某些 Linux 发行版中，标准动作脚本可以报告服务器的状态。此选项允许\
  \ Webmin 在多个位置显示此状态。如果设置为 `No`，除非您在编辑动作时点击 Status 按钮，否则不会显示状态。如果设置为 `On action only（仅动作页面）`，在编辑动作时显示状态。如果设置为\
  \ `On index and action pages（索引和动作页面）`，主页将显示动作的状态。这提供了大量信息，但可能很慢。 | Sort actions\
  \ by（按...排序动作） | 选择 `Boot order（启动顺序）`，主页上的动作将按照它们在当前运行级别中启动的顺序排列。默认的 `Name（名称）`\
  \ 按名称排序。 |\n\n**FreeBSD、NetBSD 和 OpenBSD**：BSD 家族操作系统完全不使用动作脚本，而是依靠启动时运行的一组固定脚本。这些脚本之一（etc/rc.local）允许系统管理员添加启动时运行的自定义命令。\n\
  \n在任何这些操作系统上，模块的主页仅显示一个编辑 `rc.local` 文件的表，位于 `Reboot System` 和 `Shutdown System`\
  \ 按钮上方。要添加任何要在启动时运行的命令，只需将其输入文本框并点击 `Save` 按钮。\n\n**IBM AIX**：AIX 与 BSD 操作系统相似，因为它没有动作脚本。相反，可以编辑\
  \ `/etc/rc` 文件来添加启动时运行的额外命令，可以使用模块主页上的表。\n\n**Apple MacOS X**：Apple 的 UNIX 版本存储启动时动作的文件集与其他任何支持的操作系统完全不同。独立的动作脚本仍然存在，但此模块中查看和编辑这些内容的界面完全不同。\n\
  \n如果您的操作系统不在列表中，则启动和停止模块完全不支持它，因此模块图标不会出现在 Webmin 中。\n\n## 9.9 SysV Init 配置模块\n\n\
  正如本章引言所述，系统用于确定启动时运行哪些命令的最早读取文件是 `/etc/inittab`。它由 `init` 程序读取，该程序是 Linux 内核加载完成后运行的第一个进程，并一直运行到系统关闭。`inittab`\
  \ 文件指定了启动到哪个运行级别、启动所有动作脚本的命令、开始显示文本和图形登录提示的进程，以及在发生意外断电时运行的命令。\n\n\n\n\nSysV Init\
  \ Configuration 模块位于 Webmin 的 System（系统）类别下，可用于编辑这些命令中的任何一个。然而，由于这些命令对于确保系统正常启动至关重要，除非你非常清楚自己在做什么，否则编辑它们并不是一个好主意。你可能想要更改的是启动运行级别（bootup\
  \ runlevel），这样系统在不需要时就不会显示多余图形登录提示。\n\n要更改初始运行级别，请遵循以下步骤：\n\n1. 进入 `SysV Init Configuration`\
  \ 模块。主页面将显示命令列表以及执行它们的运行级别和情况，如图 9.4 所示。\n\n##### 图 9.4. SysV Init Configuration\
  \ 模块。\n\n![](img/09fig04.jpg)\n\n2. 点击 `Action`（操作）为 After system boot（系统启动后）的行的\
  \ `ID` 列条目。这将带你进入编辑 `inittab` 文件条目的表单。\n\n3. 对于 `Bootup runlevel`（启动运行级别）选项，取消当前选中的级别并选择新级别。确保你恰好选择了一个级别，例如\
  \ `3`（用于文本登录模式）或 `5`（用于图形登录模式）。详情请本章引言中关于每个运行级别的解释。\n\n4. 点击 `Save`（保存）按钮将你的更改写入\
  \ `inittab` 文件。浏览器将返回模块的主页面。\n\n如果你愿意，现在可以使用 `Bootup and Shutdown` 模块重启系统。\n\n该模块也适用于\
  \ Solaris、HP/UX、UnixWare、OpenServer、AIX 和 Irix 操作系统。它的基本结构和目的在所有系统中都是相同的，但实际的默认命令会有显著差异。然而，之前更改启动运行级别的说明适用于所有操作系统。\n\
  \n### 9.10 总结\n\n本章涵盖了 Linux 及许多其他 UNIX 变体中使用的启动脚本，并展示了如何使用 Webmin 管理它们。它还解释了这些脚本配合\
  \ BIOS、引导程序和 init 程序在整个 Linux 启动过程中的位置。最后，它涵盖了运行级别以及使用 `SysV Init Configuration`\
  \ 模块选择系统启动运行级别的方法。\n\n## 第 10 章定时命令\n\n在本章中，你将学习 UNIX Cron 和 `At`set，它们用于按定期计划或在未来的某个时间执行一次命令。\n\
  \n### 10.1 Cron 任务简介\n\n`Cron job` 是 UNIX 术语，指由 `cron` 守护进程定期调度运行的命令。每个任务都属于一个 UNIX\
  \ 用户，并以该用户的权限运行。每个任务都有一组运行的分钟、小时、天、月份和星期几，这使得调度具有极大的灵活性。例如，一个任务可以每 10 分钟运行一次，或者在每天凌晨\
  \ 3 点运行，或者在 1、2、3 月每周一至周五下午 5 点运行。\n\n`Cron jobs` 对于执行常规系统任务非常有用，例如清理日志文件、同步系统时间、备份文件等。大多数\
  \ Linux 发行版在操作系统安装过程中都会默认设置几个 `Cron jobs`，用于执行如删除不需要的内核模块、更新 `locate` 命令使用的数据库以及轮转日志文件等。\n\
  \n实际的 `Cron job` 配置文件存储在不同的位置，取决于它们是 Linux 发行版包含的软件包的一部分，还是由用户创建的。`/var/spool/cron`\
  \ 目录用于用户手动创建的任务，每个 UNIX 用户对应一个文件。`/etc/crontab` 文件和 `/etc/cron.d` 目录下的文件包含属于软件包的任务，例如你发行版自带的任务。\n\
  \n### 10.2 定时 Cron 任务模块\n\n编辑 `Cron jobs` 的 Webmin 模块位于 System 类别下。进入后，主页面显示系统上所有现有任务的表格，如图\
  \ 10.1 所示。对于每个操作，列出了所有者、活动状态和命令。如果任务的命令过长，将被截断显示在页面上。\n\n##### 图 10.1. 定时 Cron 任务模块。\n\
  \n![](img/10fig01.jpg)\n\n### 10.3 创建新的 Cron 任务\n\n使用 Webmin，你可以轻松创建一个新的 `Cron job`，它将以系统上任何\
  \ 用户 身份执行。要实现这一点，请遵循以下步骤：\n\n1. 在模块主页面，点击现有任务列表上下方的 `Create a new scheduled cron\
  \ job` 链接。这将带你进入如图 10.2 所示的任务创建表单。\n\n##### 图 10.2. Cron 任务创建表单。\n\n![](img/10fig02.jpg)\n\
  \n2. 在 `Execute cron job as`（以...身份执行 cron 任务）字段中，输入你希望任务执行的 UNIX 用户名。任务执行的命令将在用户的家目录中运行，并拥有其完整权限。\n\
  \n3. 如果不想实际执行此新任务，可以将 `Active?`（是否活动？）字段设置为 `No`。这对于创建稍后启的任务很有用。\n\n4. 在 `Command`（命令）字段中，输入你想让\
  \ `Cron job` 运行的 shell 命令。就像在 shell 提示符一样，可以使用分号（`;`）分隔多个命令，并可以使用所有标准的 shell 操作符，如\
  \ `>`, `<` 和 `&&`。\n\n5. 默认情况下，命令的任何输出将发送给 `Cron job` 的所有者。如果你不希望这样做，请确保将输出重定向到文件或\
  \ `/dev/null`。\n\n6. 你输入 `Input to command`（命令输入）字段的任何内容都将在命令运行时作为输入提供。例如，如果你的命令是\
  \ `mail foo@bar.com`，输入该字段的任何内容都将发送到该邮箱地址。\n\n7. 在 `When to execute`（执行时间）部分，选择你希望执行命令的时间和日期。对于\
  \ `Minutes`、`Hours`、`Days`、`Months` 和 `Weekdays` 每个选项，你可以选择多个时间或日期，或选择 `All`（全部）选项。\n\
  \n例如，要让任务在每（ `Monday` 和 `Friday` 上午 `3:15` 执行，你应该将 `Minutes` 选项改为 `Selected` 并选择\
  \ `15`，将 `Hours` 选项改为 `Selected` 并选择 `3`，将 `Weekdays` 选项改为 `Selected` 并选择 `Monday`\
  \ 和 `Friday`。`Days` 和 `Months` 选项保持为 `All`。\n\n8. 点击 `Create`（创建）按钮添加新的 `Cron job`。假设选择没有错误，你将返回模块主页面，新任务将出现在其所有者旁边。\n\
  \n### 10.4 编辑 Cron 任务\n\n现有的 `Cron jobs`（包括用户通过 Webmin 创建或随操作系统包含的任务）可以使用此模块进行编辑和重新调度。但在编辑作为发行版一部分的任务时要小心，因为某些任务执行着重要操作，例如截断\
  \ Web 服务器、邮件和登录日志文件，以防止它们占用所有的磁盘空间。\n\n要编辑现有任务，请遵循以下步骤：\n\n1. 在模块主页面，点击你想编辑的任务的命令。这将带你进入模块编辑表单，与图\
  \ 10.2 类似。\n\n2. 更改任务的任何细节，包括用户、命令、活动状态以及执行时间和日期。\n\n3. 完成后，点击 `Save`（保存）按钮，你将返回模块主页面。\n\
  \n可以通过以下步骤删除现有的 `Cron jobs`，但点击 `Delete`（删除）而不是 `Save`。你还可以通过编辑页面上的 `Run Now`（立即运行）按钮强制立即执行任务，这将执行命令并显示其产生的任何输出。\n\
  \n### 10.5 控制用户对 Cron 的访问\n\n`Scheduled Cron Jobs` 模块还可以用于控制 UNIX 用户通过命令行对 `crontab`\
  \ 命令的访问。如果你允许不受信任的用户登录你的系统，并希望防止其中某些设置 `Cron jobs` 在他们未登录时运行命令并占用 CPU 时间，这将非常有用。通常默认情况下，所有用户都有创建\
  \ `Cron jobs` 的权限，但你可以通过以下步骤进行更改：\n\n\n\n\n\n在模块主页底部，点击`Control user access to cron\
  \ jobs（控制用户访问 cron 任务）`链接。这将进入一个输入可以使用或不允许使用 Cron 用户用户的表。\n\n要授予所有用户权限，请选择`Allow\
  \ all users（允许所有用户）`。\n\n要仅授予某些用户权限，请选择`Allow only listed users（仅允许列出的用户）并在文本框中输入他们的用户名。\n\
  \n要授予除少数用户外所有用户的权限，请选择`Deny only listed users（仅拒绝列出的用户）并在文本框中输入你想拒绝访问的用户名。\n\n完成后，点击`Save（保存）`。\n\
  \n如果用户被拒绝访问 Cron 权限，你将无法再次使用该模块创建、编辑或删除属于他的任务。然而，现有的任务可能会继续执行！\n\n### 10.6 模块访问控制选项\n\
  \n如第 52 章所述，可以使用`Webmin Users`模块控制 Webmin 用户可以编辑哪些 UNIX 用户的 Cron 任务。要设置此项，你必须先授予用户该模块的权限，然后按照以下步骤操作：\n\
  \n在`Webmin Users`模块中，点击你想要限制的用户名称旁边的`Scheduled Cron Jobs（计划 Cron 任务）`。\n\n将`Can\
  \ edit module configuration?（可以编辑模块配置？）`字段改为`No`，这样用户就无法编辑 Webmin 调用创建和编辑任务的命令。\n\
  \n将`Can edit cron jobs for（可以编辑用户的 cron 任务）`字段从`All users（所有用户）`切换到其他选项之一。最常用`Users\
  \ with UID in range（UID 在范围内的用户）`，它允许你在相邻字段中输入最小最大 UID。\n\n永远不要允许不受信任的用户访问`root`或`bin`等系统用户的\
  \ Cron 任务，因为这将显然赋予他对你系统的完全访问，并破坏任何其他 Webmin 访问控制。\n\n将`Can control user access to\
  \ cron?（可以控制用户访问 cron？）`字段设置为`No`，这样 Webmin 用户无法停止其控制范围之外的用户使用 Cron。\n\n点击页面底部的`Save（保存）`按钮使访问控制生效。\n\
  \n### 10.7 配置计划 Cron 任务模块\n\n通过点击主页上的`Module Config（模块配置）`链接可以查看的大多数模块设置默认都匹配已安装的操作系统，很少需要更改。然而，有一个字段会影响模块的用户界面，如表\
  \ 10.1 所示。\n\n#### 表 10.1. 模块配置选项\n\n| Maximum command length to display（显示的最大命令长度）\
  \ | 此字段决定每个 Cron 任务命令的多少字符将显示在模块主页上。你可以选择`Unlimited（无限制）`来显示所有内容（这可能会导致换行），或输入最大字符数。默认值为\
  \ 80。 |\n\n### 10.8 其他操作系统\n\nCron 几乎在所有的 UNIX 系统上可用，且功能非常相似。这意味着该模块在所有操作系统上的外观几乎相同，只有几处细微差异。在某些系统上，创建或编辑任务时没有提供`Input\
  \ to command（命令输入）`字段。在另一些系统上，在控制哪些用户访问 Cron 时，默认的`Allow all users（允许所有用户）`选项会被`Allow\
  \ all users except root（允许 root 外的所有用户）`或`Deny all users（拒绝所有用户）`取代。\n\n在内部，其他操作系统使用不同的目录存储\
  \ Cron 任务，例如， Solaris 使用 `/var/spool/cron/crontabs` 而不是 Linux 上的 `/var/spool/cron`。大多数其他系统也没有\
  \ `/etc/crontab` 文件或 `/etc/cron.d` 目录。然而，在使用 Webmin 时，你不需要担心这些差异，因为它知道其他 UNIX 变体使用的路径，并且无论任务存储在哪个文件中，都使用相同的界面显示所有\
  \ Cron 任务。\n\n### 10.9 计划命令模块\n\n`At` 任务（Webmin 称为`Scheduled Commands（计划命令）`）与 Cron\
  \ 任务类似，但它们不是按计划重复执行，而是在指定的日期和时间运行一次。与 Cron 任务不同，它们可以配置在特定目录执行而不是用户的家目录执行。计划命令还会跟踪创建时设置的环境变量，并在执行时为命令提供这些变量。\n\
  \n通常，使用 `at` 命令创建 `At` 任务，使用 `atq` 命令列出任务，并使用 `atrm` 命令删除任务。在 Linux 上，使用 `/var/spool/at`\
  \ 目录存储任务，每个文件一个任务。在后台一直运行的守护进程 `atd` 会检查这些文件并在适当的时间运行它们。如果 `At` 守护进程没有运行，则没有命令将执行，如果它没有配置在`Bootup\
  \ and Shutdown（启动和关闭）`模块中启动，可能会出现这种情况。任务运行后，由于不再需要，会被自动删除。\n\n用于创建和删除 `At` 任务的 Webmin\
  \ 模块称为`Scheduled Commands（计划命令）`，可以在`System（系统）`分类下找到。进入后主页将显示等待运行的命令列表（如果有）以及添加新命令的表单。图\
  \ 10.3 显示了一个示例。\n\n#### 图 10.3. 计划命令模块。\n\n![](img/10fig03.jpg)\n\n主页上显示的任何命令都可以通过点击其`Job\
  \ ID`查看详细信息。这将带你进入一个页面，显示将执行的完整 shell 脚本，包括所有的环境变量。对于此页面，你可以通过点击`Cancel this command（取消此命令）`按钮在命令运行之前取消它。\n\
  \n### 10.10 创建新计划命令\n\n可以通过以下步骤创建一个按指定时间和以指定用户执行的新命令：\n\n在模块主页的`New scheduled command（新建计划命令）`表单中，在`Run\
  \ as user（以用户身份运行）`字段中输入你想让命令运行的用户名。\n\n在`Run on date（运行日期）`和`Run at time（运行时间）`字段中填写命令运行的日期和时间。\n\
  \n将`Run in directory（在目录中运行）`字段设置为你想让命令运行的任何目录。\n\n在`Commands to execute（要执行的命令）`文本框中输入任意数量的\
  \ shell 命令，每行一个。\n\n完成后，点击`Create（创建）`。页面将刷新，你的新命令将出现在页面顶部的列表中。\n\n从 Webmin 内部创建的计划将将\
  \ Webmin 自身设置的环境变量，这些与所有者在 shell 提示符创建命令时设置的变量不同。\n\n### 10.11 总结\n\nCron 和 `At`\
  \ 是 UNIX 系统用于调度未来任务的两个服务。本章解释了它们如何工作、它们之间的区别，以及如何使用 Webmin 进行配置。它还涵盖了使用 Webmin 访问控制功能限制访问这些服务的模块，以及这种访问控制的局限性。\n\
  \n## 第 11 章 进程管理\n\n本章介绍了如何使用 Webmin 管理系统中运行的进程。\n\n### 11.1 进程简介\n\nLinux 系统上运行的每个程序、服务器或命令都是进程。在任何时候，系统中都有几十个进程在运行，有些是你正在交互的图形程序，有些是你在\
  \ shell 提示符启动的命令，有些是后台运行的服务器，有些是执行系统任务的任务。每当你在 shell 提示符输入 `ls` 或 `vi` 命令时，就会创建一个新进程，并在任务完成后退出。\n\
  \n\n\n\n\n### 11.2 运行进程模块\n\n此模块可用于查看、杀死、重新调整优先级以及运行系统上的进程。当你首次从“系统”（System）类别进入该模块时，主页面将显示进程树，如图\
  \ 11.1 所示。\n\n#### 图 11.1 运行进程模块的树形显示。\n\n![](img/11fig01.jpg)\n\n该模块有多种不同的查看系统上所有进程的方法，可以通过主页面顶部的\
  \ `Display` 链接进行选择。它们是：\n\n**PID**: 在此显示模式下，每个进程都在其父进程下方缩进显示，形成系统上所有运行进程的树状。树的顶部是\
  \ `init` 命令，它由 `kernel` 在启动时启动，因此没有父进程。\n\n**User**: 这种模式按所有者对进程进行分组。对于有许多用户的系统，这种模式非常有用，可以一眼看出每个用户正在运行什么。\n\
  \n**Memory**: 在此模式下，进程按其使用的内存量进行排序，使用内存最多的显示在页面顶部。进程的内存使用情况并不总是反映其实际使用的内存量，因为进程经常相互共享内存。\n\
  \n此外，进程列表上方会显示系统实际和虚拟内存总量和可用量。\n\n**CPU**: 此显示模式按当前的 CPU 使用率对进程进行排序，占用最大的用户排在最前面。有时，生成页面的\
  \ `Webmin` 命令会出现在列表顶部，但可以安全地忽略。\n\n系统负载平均值显示在页面顶部，让你了解系统在过去 1、5 和 10 分钟的忙程度。平均值为\
  \ 0 表示完全没有活动，1 表示 CPU 被完全利用，任何大于 1 的值都意味着想要运行的进程多于系统可提供的 CPU 时间。\n\n`Search` 和 `Run`\
  \ 选项分别用于搜索进程和运行新进程。更多细节请参阅后续章节。\n\n### 11.3 查看、杀死或重新调整进程优先级\n\n你可以通过点击主页面任何显示模式中的\
  \ `Process ID`（进程 ID）列项，查看任何运行进程的完整详细信息。这将带你进入信息页面，如图 11.2 所示。\n\n#### 图 11.2 进程的详细信息。\n\
  \n![](img/11fig02.jpg)\n\n该页面显示有关该进程的所有可用信息，包括其完整命令行、父命令以及任何子进程。你可以通过点击父命令进入父进程的信息页面，或通过点击任何子进程的进程\
  \ ID 进入其页面。通过点击 `Files` 和 `Connections` 按钮，可以查看进程已打开的文件列表和当前正在使用的网络连接。\n\n可以通过点击\
  \ `Terminate Process`（终止进程）按钮使用 `TERM` 信号停止进程。由于某些命令可能会忽略此信号，如果终止失败，可以使用 `Kill Process`（杀死进程）按钮发送\
  \ `KILL` 信号。除非进程挂在 `kernel` 系统调用内部，否则杀死它保证会成功。\n\n可以通过在按下 `Send Signal`（发送信号）按钮旁边的列表中选择信号类型来发送其他信号。一些更有实用的信号包括：\n\
  \n**HUP**: 对于许多服务器进程，此信号将导致它们重新读取配置文件。\n\n**STOP**: 挂起进程直到接收到 `CONT` 信号。\n\n**CONT**:\
  \ 恢复被 `STOP` 信号挂起的进程。\n\n该信息页面还可以用于更改运行进程的 `nice` 级，赋予其更高或更低的优先级。要更改进程的优先级，请从 `Nice\
  \ level` 列表中选择新级别，然后点击 `Change` 按钮。级别越低优先级越高，因此 nice 级为 10 的进程将获得比级别 5 的进程更多的 CPU\
  \ 时间。\n\n在有多个用户的系统上，占用大量 CPU 时间的长运行进程应该被赋予更高的 `nice level`，以免它们减慢与用户交互的进程。或者，你可以通过赋予进程较低的\
  \ `nice level` 来牺牲其他进程以加速某个进程。在设置极低级别（如 20）时应小心，因为所有其他进程都可能由于缺少 CPU 时间而导致系统无响应。\n\
  \n### 11.4 搜索进程\n\n如果你的系统上运行了大量进程，并想要找到一个或多个进程进行杀死或查看，运行进程模块的搜索功能让这变得简单。要查找进程，请遵循以下步骤：\n\
  \n在模块的主页面上，点击 `Search` 显示模式链接。这将带你进入如图 11.3 所示的搜索表单。\n\n#### 图 11.3 进程搜索表单。\n\n\
  ![](img/11fig03.jpg)\n\n表单显示了用于查找进程的不同标准，你可以通过选择旁边的单选按钮来选择其中之一。标准如下：\n\n- **Owned\
  \ by**: 查找由你在该选项旁输入的用户名所拥有的进程。\n- **Matching**: 查找命令或参数包含你在该选项旁输入的文本的进程。\n- **Using\
  \ more than**: 查找使用 CPU 时间超过指定百分比的进程。\n- **Using filesystem**: 查找当前目录位于所选文件系统上或正在访问该系统上任何文件的进程。如果因为文件系统正忙而无法卸载它，则此非常有用。\n\
  - **Using file**: 查找打开了输入文件进行读写的进程。如果你输入一个目录，将找到任何将其作为当前目录的进程。\n- **Using port**:\
  \ 查找使用所选协议在输入端口上发送、接收或监听网络流量的进程。如果你知道服务器监听的端口号并想找到该服务器进程，这非常有用。\n\n要从结果中过滤 Webmin\
  \ 搜索进程，请选择 `Ignore search processes` 。在按 CPU 使用率搜索时这非常有用，因为 Webmin 进程会消耗大量的 CPU\
  \ 时间。\n\n选择标准后，点击 `Search` 按钮。任何匹配的进程将显示在表单下方。\n\n如果你想查看进程的附加信息、更改其优先级或单独对其发送信号，请点击结果中的\
  \ `Process ID`。\n\n要杀死所有进程，点击 `Terminate Processes` 或 `Kill Processes` 按钮。你也可以通过从\
  \ `Send Signal` 按钮旁边的列表中选择任何信号到所有进程。将显示一个页面，列出每个进程 ID 以及是否成功发送信号或将其杀死。\n\n### 11.5\
  \ 运行进程\n\n该模块还可以用于运行简单命令，既可以在前台运行显示输出，也可以作为守护进程在后台运行。如果你只想运行命令而无需通过 telnet 或 SSH\
  \ 登录（或者防火墙阻止了 telnet 或 SSH 登录），这非常有用。要遵循的步骤如下：\n\n在模块的主页面上，点击显示模式选项旁 `Run` 链接。这将带你进入启动新进程的表单。\n\
  \n在 `Command to run` 字段中输入你想运行的命令。可以使用 运算符和特殊字符如 `;`、`>`、`&`。\n\n如果命令运行需要长时间，你可以将\
  \ `Run mode` 选项设置为 `Run in background`，让 Webmin 自动将其放入后台运行。然而，如果你想查看命令的输出，请将该选项设置为\
  \ `Wait until complete`。\n\n在 `Input to command` 字段中输入任何你想提供给命令的输入。\n\n点击 `Run`\
  \ 按钮运行。如果选择了 `Wait until complete` 选项，命令的任何输出都将显示。\n\n### 11.6 模块访问控制选项\n\n\n\n\n\
  默认情况下，任何访问此模块的 Webmin 用户都可以管理系统上运行的所有进程，就像以 root 身份登录一样。然而，通过 `Webmin Users` 模块，你可以限制用户的访问权限，使其只能杀死或重新调整（re-nice）属于特定\
  \ UNIX 用户的进程优先级。你还可以将用户限制为只读模式，允许其仅查看进程，而不能以任何方式更改它们或启动新进程。\n\n你应该先阅读第 52 章，以了解更多关于模块访问控制以及如何授予用户访问\
  \ `Running Processes` 模块的权限。完成这些后，编辑 Webmin 用户访问此模块权限的步骤如下：\n\n1. 在 `Webmin Users`\
  \ 模块中，点击要限制的用户或组名称旁边的 `Running Processes`。\n2. 将 `Can edit module configuration?`（可以编辑模块配置吗？）字段改为\
  \ `No`。\n3. 若要仅让 Webmin 用户访问特定 UNIX 用户拥有的进程，请在 `Manage processes as user`（以用户身份管理进程）字段输入用户名。如果\
  \ UNIX 用户和 Webmin 用户同名，可以选择 `Current Webmin user`（当前 Webmin 用户）。这在为组设置访问控制时非常有用，你可能希望组中的每个成员只能管理自己的进程。\n\
  4. 若要将用户设置为只读模式，将 `Can kill and re-nice processes?`（可以杀死和重新调整进程吗？）和 `Can run commands?`（可以运行命令吗？）字段设置为\
  \ `No`。如果这样做了，在步骤 3 中输入什么用户名并不重要，因为无法进行任何进程管理。\n5. 点击 `Save`（保存）按钮激活你的更改。\n\n为了限制\
  \ Webmin 用户可以管理的进程，模块代码只需切换到以步骤 3 中指定的 UNIX 用户身份运行。由于 UNIX 用户无法杀死或重新调整其不拥有的任何进程优先级，这种用户切换会导致操作系统自动对\
  \ Webmin 执行进程访问控制。\n\n### 11.7 其他操作系统\n\n由于进程在所有版本的 UNIX 中都具有几乎相同的属性，因此模块在所有支持的操作系统上看起来几乎完全相同。唯一的细微区别在于：\n\
  \n- 在查看进程的详细信息时，其他操作系统可能会提供不同的信息。`nice` 级的范围也可能不同，但较低的级别仍然意味着更高的优先级，反之亦然。\n- 在搜索进程时，可能无法使用\
  \ `Using filesystem`（使用系统）、`Using file`（使用文件）或 `Using port`（使用端口）标准。这些选项取决于 `fuser`\
  \ 和 `lsof` 命令，而这些命令并不是所有系统默认可用或安装的。\n\n### 11.8 总结\n\n阅读本章后，你应该对进程以及它们在 UNIX 系统上的重要性有良好的理解。你还应该理解如何使用\
  \ Webmin 查看系统上运行的进程，搜索符合某些标准的进程，并杀死、信号或重新调整其中一个或多个进程的优先级。最后，你应该知道如何配置模块来限制某些 Webmin\
  \ 用户的权限（如果你的系统有需要）。\n\n## 第 12 章 软件软件包\n\n本章介绍了如何使用软件包在系统上安装和管理软件。它概述了各种 UNIX 软件包格式之间的区别，例如\
  \ `RPM`、`DPKG` 和 `Solaris`。\n\n### 12.1 软件包简介\n\n所有的 Linux 系统都使用某种软件软件包系统来简化安装和删除程序的流程。软件包是命令、配置文件、帮助文档（man\
  \ pages）、共享库以及与 `Apache` 或 `Sendmail` 等单一程序相关的文件的集合，并被组合成单个软件包文件。当安装时，软件包系统会提取所有组件文件并将它们放置在系统上的正确位置。由于系统知道每个文件来自哪个软件包，因此当你想要删除一个软件包时，它确切知道要删除哪些文件。\n\
  \n在几乎所有的 Linux 版本中，软件包通常包含编译后的程序，这些程序只会在编译时对应的 CPU 架构上运行。由于 Linux 支持许多不同的 CPU 类型（例如\
  \ `x86`、`Alpha` 和 `IA64`），某些程序拥有针对几种不同 CPU 编译的软件包。软件包只能安装在具有正确 CPU 架构的系统上，除非它是架构无关的，在这种情况下，它将安装在任何系统类型上。使用\
  \ `Perl`（如 `Webmin`）等语言编写的程序，或仅包含文档的软件包通常是与 CPU 无关的。\n\n当安装 Linux 发行版时，放置在硬盘上的几乎每个文件都是该发行版软件包之一的成员。这使得删除默认安装的不需要的软件或从发行版\
  \ CD 或网站添加额外的软件变得简单。\n\n由于某些程序依赖其他程序才能运行，软件包也可能具有依赖关系。除非你先安装了另一个软件包，否则某些软件包可能无法安装；如果其他软件包依赖于它们，某些软件包可能无法删除。这种依赖系统保护用户免安装因缺少共享库或命令而无法运行的软件。\n\
  \n由于软件包系统确切知道每个软件包包含哪些文件，它可以利用这些信息在安装后验证文件。所有软件包系统还会跟踪每个文件的 `MD5` 校验和，因此对软件包中文件的任何手动修改都可以被检测到。这对于检测未经授权的修改非常有用，例如攻击者破解了你的系统并将\
  \ `ls` 和 `find` 等重要命令替换为修改过的版本。遗憾的是，Linux 上有多个软件包系统。最常见的是 `RPM`，它代表红帽软件包管理器（Red\
  \ Hat Package Manager）。它被 Red Hat、`Caldera`、`SuSE`、`Mandrarake`、`MSC` 以及其他 Linux\
  \ 发行版使用。它运行良好，且 `RPM` 格式提供的软件比任何其他软件包系统都多。`RPM` 软件包的安装、查询和删除是通过 `rpm` shell 命令完成的。\n\
  \n`RPM` 的竞争对手是 Debian 的 `DPKG` 软件包格式。它在许多方面技术上更优，特别是在依赖关系方面，但只有 Debian 和其他少数发行版在使用它。`dpkg`\
  \ 和 `deselect` 命令用于 shell 提示符管理 Debian 软件包。\n\n另一个软件包系统是 Gentoo 的 `Emerge`，它仅在 Gentoo\
  \ Linux 上可用。`Emerge`与其他软件包系统最大的区别是，几乎所有的软件包都包含源代码，源代码在安装软件包时进行编译。所有的 Gentoo 软件包安装和管理都是使用\
  \ `emerge` 命令完成的。\n\n尽管这些软件包系统在内部不同并使用不兼容的文件格式，但它们提供的功能基本相同。它们都允许将与同一程序的多个文件组合成一个软件包文件以便于安装和删除，并且都支持依赖关系。遗憾的是，一旦你选择了\
  \ Linux 发行版，想要更改到另一个软件包系统非常困难，因此你只能使用该发行版使用的系统。\n\n在大多数使用 `RPM` 的发行版中，软件包要么从发行版\
  \ CD 安装，要么从互联网上的各种站点下载。然而，Debian Linux 了一个名为 `apt-get` 的命令，它可以从发行版维护者运行的仓库自动下载并安装软件包。如果软件包依赖于系统中尚未安装的其他软件包，它们也将被自动下载并安装。由于仓库中的所有软件包都由同一批人员创建和维护，它们之间的不兼容性降低了，依赖关系也更容易解决。仓库还包含了几乎你可能想要安装的每一个免费软件的软件包，因此无需在互联网上搜索你软件包。\n\
  \n\n\n\n\nDebian 存储库也可用于将系统上的所有软件包更新到最新版本。由于软件包的新版本发布频繁（特别是当使用不稳定或测试版 Debian 版本时），更新是确保你运行所有内容最新版本的一种简单方法。不过，如果你的互联网连接较慢，可能会花费很长时间，因为每次更新可能需要下载许多新软件包。\n\
  \nGentoo Linux 的 `Emerge` 系统也拥有一个存储库，可以使用 `emerge` 命令从其中下载并安装软件包。像 Debian 的 `apt-get`\
  \ 一样，它会自动下载并安装满足依赖所需的软件包。\n\nRed Hat 系统也可以访问作为红帽网络（Red Hat Network）一部分的软件包库。这允许在红帽官方网站上选择更新的软件包，并在多个系统上自动或根据请求安装。与\
  \ Debian 和 Gentoo 存储库不同，它通常不用于安装新软件包。\n\n### 12.2 软件包模块\n\n软件包模块为安装、搜索和删除软件包提供了一个统一的界面，而不取决于实际使用的软件包系统。你可以在“系统”（System）类别下找到它的图标，点击它将带你进入图\
  \ 12.1 所示的主页。\n\n### 图 12.1 软件包模块主页。\n\n![](img/12fig01.jpg)\n\n根据你的 Linux 发行版，页面看起来可能略有不同，可能会看到额外的从存储库安装的按钮和字段。然而，查找软件包的顶部部分、安装软件包的中间部分以及识别文件的底部部分始终存在。\n\
  \n### 12.3 安装新软件包\n\n在使用此模块安装新程序之前，你必须先找到一个格式正确的软件包文件。对于像 Red Hat 这样基于 RPM 的发行版，最好的查找地点是发行版\
  \ CD 或 [rpmfind.net](http://rpmfind.net/default.htm)网站。如果你使用的是 Debian Linux，最好尝试从\
  \ APT 存储库安装，因为它包含了几乎所有的可用软件包。无论哪，安装软件包的步骤都是相似的：\n\n在模块的主页上，滚动到“安装新软件包”（Install a\
  \ New Package）表单，该表单用于选择软件包并启动安装过程。\n\n如果软件包文件位于运行 Webmin 的系统上，选择“本地文件”（From local\
  \ file）选项并输入软件包文件的完整路径。如果你的系统使用 RPM 软件包，你也可以输入包含多个 `*.rpm` 文件的目录或使用通配符如 `*/tmp/*.rpm`。这可以一次安装多个软件包。\n\
  \n如果软件包位于运行浏览器的计算机上，选择“已上传的文件”（From uploaded file）选项并点击“浏览”（Browse）按钮选择软件包文件。如果你在\
  \ Webmin 系统的控制台上运行浏览器，此选项与上一个没有区别。\n\n如果软件包位于某个网站上，选择“来自 ftp 或 http URL”（From ftp\
  \ or http URL）选项，并将 URL 输入或粘贴到旁边的文本框中。Webmin 在开始安装前为你完成下载。如果你的系统使用 RPM 软件包且你安装了\
  \ `rpmfind` 命令，可以点击 URL 字段旁边的“搜索 rpmfind.net”按钮，弹出一个窗口用于在 [rpmfind.net/](http://rpmfind.net/default.htm)\
  \ 上搜索 RPM 数据库。\n\n如果运行 Debian Linux，你可以选择“来自 APT 的软件包”（Package from APT）选项并在旁边的文本框中输入软件包名称。如果你不知道它的确切名称，点击“搜索\
  \ APT”（Search APT）按钮来查找包名。\n\n如果运行 Red Hat Linux，可以使用“来自红帽网络的软件包”（Package from Red\
  \ Hat Network）选项来安装你可下载的软件包之一。可以使用“搜索 RHN”（Search RHN）按钮显示所有可用的软件包。\n\n如果你运行 Gentoo\
  \ Linux，可以使用“来自 Portage 存储库”（From Portage repository）选项和“搜索”（Search）按钮从存储库安装。事实上，极少数\
  \ Gentoo 软件包可以在存储库之外找到。\n\n一旦输入了软件包源，点击“安装”（Install）按钮。\n\n如果你选择从存储库（如 APT、红帽网络或\
  \ Portage）安装，下载和安装过程将立即开始。Webmin 将显示来自 `install` 命令的输出，如果成功，它将列出已安装的软件包列表。完成安装过程不需要其他步骤。\n\
  \n如果选择了任何其他安装源，系统将在需要时下载软件包，并显示安装选项表单。\n\n可用的安装选项取决于你的软件包系统，但对于升级或安装没有依赖问题的软件包，默认设置可以正常工作。基于\
  \ RPM 的系统有几个选项，其中最用的是：\n\n`忽略依赖关系?` (Ignore dependencies?) 如果软件包由于你明知是错误的依赖错误而安装失败，请将此选项设置为\
  \ `Yes`。如果你打算稍后安装软件包来解决依赖问题，这也会很有用。\n\n`用旧版本替换新版本?` (Replace new version with old?)\
  \ 如果你想将软件包降级到旧版本，必须将此选项设置为 `Yes`。\n\n`覆盖文件?` (Overwrite files?) 如果软件包由于与另一个软件包的文件冲突而无法安装，请启用此选项。\n\
  \n选择完安装选项后，点击“安装”（Install）按钮。如果一切顺利，将显示一个显示新软件包详情及其包含的所有文件的页面。然而，如果安装失败，将显示一条解释原因的错误消息。在这种种情况下，你可以使用浏览器的后退按钮返回安装选项表单，并尝试不同的选择。\n\
  \n### 12.4 查找和删除软件包\n\n一个典型的 Linux 系统有数百个已安装的软件包，其中大部分是在发行版安装过程中添加的。由于软件包非常多，很难通过浏览找到你想要删除或查看详情的包。要查找一个或多个软件包，请以下步骤操作：\n\
  \n在模块的主页上，在“搜索软件包”（Search For Package）字段中输入关键词。这将匹配所有软件包的名称和描述，因此你可以输入 `apache`\
  \ 来查找所有与 Apache 相关的包。\n\n点击“搜索软件包”（Search For Package）按钮，它将显示所有匹配的软件包列表、如果只找到一个则带你进入该软件包的详情，或者如果没有找到则显示错误消息。如果出现了列表，点击其中一个软件包名称查看其完整详情。\n\
  \n软件包详情页（如图 12.2 所示）将显示所有可用信息，包括完整描述。如果你想查看它包含的所有文件，点击“列出文件”（List Files）按钮。这将带你进入显示每个文件的路径、类型、所有者和组以及验证状态的页面。状态特别有用，因为它允许你查看文件自安装以来是否被手动修改过。\n\
  \n也可以通过点击主页上的“软件包树”（Package Tree）按钮手动浏览软件包。在大多数操作系统中，每个软件包都属于某个类，例如“开发”或“管理/网络”。软件包树页面使用这些类信息以层级结构显示所有已安装的软件包，类似于目录树。你可以通过点击文件夹图标打开类，直到到达软件包级别。点击软件包图标将带你进入上述步骤中相同的详情页。\n\
  \n\n\n\n如果你知道某个命令或文件的名称并想找到它所属的软件包，可以使用主页上的“识别文件”（Identify a File）表单。在“搜索”（Search\
  \ For）字段中输入完整路径（例如 `/etc/rc.d/init.d/httpd`）或命令（例如 `apachectl`），然后点击按钮。如果软件包系统已知该文件或命令，将显示其相关信息以及它所属的软件包列表。点击包名称之一将带你进入到上述描述的信息页面。\n\
  \n一旦通过搜索或浏览树形结构找到了软件包，你可以按照以下步骤将其从系统中删除：\n\n在软件包详情页上，点击`卸载`（Uninstall）按钮。这将带你进入一个确认页面，显示该包中的文件数量以及它们占用的磁盘空间。\n\
  \n如果使用 `RPM` 软件包系统，可以将“忽略依赖关系？”（Ignore dependencies?）选项设置为`Yes`（是），即使某些其他软件包依赖于要删除的包，也可以强制卸载。\n\
  \n点击“删除”（Delete）按钮移除该软件包。如果发生错误，将显示错误消息。如果成功，浏览器将返回模块主页，或者如果你是通过搜索找到包的，则返回搜索结果列表。\n\
  \n### 12.5 在 Debian Linux 上更新\n\n如果你运行的是 Debian Linux，在模块主页底部有一个标题为“升级所有软件包”（Upgrade\
  \ All Packages）的表单。该表单有三个选项，分别是：\n\n`同步软件包列表`（Resynchronize package list）：如果此选项设置为`Yes`，将查询\
  \ Debian 软件包存储库以获取可用下载的最新列表。这应该在任何升级之前执行，以便你的系统在从 `APT` 存储库安装软件包时知道从哪些 URL 下载。\n\
  \n用于同步软件包列表的实际命令是 `apt-get update`。\n\n`执行发行版升级`（Perform distribution upgrade）：当此选项设置为`Yes`时，提交表单后，你的\
  \ Debian 系统将升级到最新的发行版版本。默认选择 `No` 时，它仅进行更新，使所有已安装的软件包都是最新版本。除非你有快速的网络连接并真的想升级，否则建议将此选项设置为`No`。\n\
  \n当选择 `Yes` 时，将运行命令 `apt-get upgrade-dist`。对于 `No`，将改用 `apt-get upgrade`。\n\n`仅显示哪些软件包将被升级`（Only\
  \ show which packages would be upgraded）：如果设置为`Yes`，提交表单时不会实际安装任何内容，而是显示一个将更新或安装的软件包列表。如果你想在实际执行更新之前确切看到会发生什么，这非常有用。\n\
  \n做出选择后，点击“立即升级”（Upgrade Now）按钮。Webmin 将运行相应的 `apt-get` 命令并显示其输出，以便查看哪些软件包被下载和更新。\n\
  \n### 12.6 在 Red Hat Linux 上更新\n\nRed Hat 为其 Linux 发行版的用户提供了一种名为“红帽网络”（Red Hat Network）的服务。其功能之一允许在你系统上自动安装更新的\
  \ `RPM` 软件包，以修复发行版提供的软件包中的错误或安全漏洞。如果你运行的是 Red Hat Linux，主页底部有一个标题为“红帽网络选项”（Red Hat\
  \ Network Options）的表单，可以使用它来配置更新软件包的自动安装。在使用之前，你必须已经在 `Red Hat Network` 注册并注册了运行\
  \ Webmin 的系统。\n\n该表单实际上有两个用途：更改定期检查新软件包的更新守护进程设置，以及强制立即更新。表单上的字段有：\n\n`自动检查更新？`（Automatically\
  \ check for updates?）：如果此选项设置为`Yes`，检查更新的 `rhnsd` 守护进程将被配置为启动时启动。点击“保存并应用”（Save\
  \ and Apply）按钮时，如果尚未运行，也会立即启动。设置为 `No` 将停止守护进程并防止其在启动时启动。\n\n`检查间隔`（Checking interval）：启用自动更新守护进程时，检查新软件包的分钟数由此选项决定。\n\
  \n`下载代理服务器 URL`（Proxy server URL for downloading）：如果你的系统无法直接连接 Red Hat 网站，你需要将此选项设置为网络代理服务器的\
  \ URL。格式必须如下：`http://proxy.company.com:8000/`。\n\n`跳过匹配的`（Skip packages matching）：此选项用于输入你不希望自动更新的软件包名称模式列表。默认情况下，它防止内核更新自动安装。\n\
  \n“保存并应用”（Save and Apply）按钮将保存你的设置并在需要启动或停止 `rhnsd` 守护进程。“保存并检查”（Save and Check\
  \ Now）按钮将执行相同的操作，还会运行 `up2date u` 命令立即检查并下载新软件包。该命令的所有输出都将显示，以便你可以看到哪些软件包正在更新。\n\
  \n### 12.7 其他操作系统\n\nLinux 不是唯一使用软件包来简化软件安装和卸载的 UNIX 版本。下面列出的操作系统也可以使用“软件包”（Software\
  \ Packages）模块，其用户界面几乎完全相同。然而，每个系统都有自己的软件包格式，这些格式与 Linux 或任何其他 UNIX 变体不兼容。\n\n每个\
  \ UNIX 软件包系统与 `RPM` 之间的差异说明如下：\n\n#### Sun Solaris, SCO OpenServer 和 SCO UNIXWare\n\
  \n所有这些操作系统都使用相同的 `System V` 软件包格式，但其中一个系统的包无法安装到其他任何一个系统中。\n\n软件包文件通常命名为 `something.pkg`\
  \ 或 `something.pkg.gz`。如果软件包文件被压缩，Webmin 将自动将其解压缩。\n\n文件可以包含多个软件包，使用 Webmin 时所有包都将被安装。\n\
  \n`System V` 软件包没有软件包存储库或搜索服务。\n\n`/usr/bin` 等目录在多个系统软件包之间共享。\n\n#### FreeBSD, NetBSD\
  \ 和 OpenBSD\n\n软件包文件的名称如 `something.tgz`，实际上它们是特殊格式的 `tar` 文件。\n\nWebmin 不支持任何 BSD\
  \ 软件包的存储库。\n\n#### HP/UX\n\nHP/UX 使用其独特的 `Depot` 软件包格式。\n\n软件包文件通常命名为 `something.depot`\
  \ 或 `something.depot.gz`。如果软件包被压缩，Webmin 将自动为你解压缩。\n\nWebmin 不支持任何 HP/UX 软件包的存储库。\n\
  \n### 12.8 总结\n\n软件包管理是 Linux 以及支持它的其他 UNIX 变体实用功能之一。本章解释了什么是软件包、存在哪些软件包管理系统以及你如何使用\
  \ Webmin 在系统中安装和管理软件包。它还涵盖了与其他软件包相关的服务，例如自动更新和存储库。\n\n## 第 13 章 系统日志\n\n在本章中，解释了控制日志写入位置的\
  \ UNIX `syslog` 服务，并记录了配置它的 Webmin 模块。\n\n### 13.1 日志简介\n\n许多 Linux 服务器和守护进程会为错误、警告、请求和诊断信息生成日志消息。大多数情况下，这些日志不会直接写入文件，而是传递给\
  \ UNIX 日志程序 `syslog`，由它决定如何处理每条日志消息。日志可以写入文件、发送到另一个服务器、通过管道传递给另一个程序，甚至广播给所有登录系统的用户。可以使用上述每种方法记录来自不同服务器的不同类型消息。\n\
  \n\n\n\n通常，日志被写入 `/var/log/` 目录下的文件中。在大多数 Linux 发行版中，`/var/log/messages` 文件包含通用信息、错误和警告消息；`/var/log/mail`\
  \ 文件记录入站和出邮件；而 `/var/log/secure` 则记录成功和失败的登录。然而，你的系统可能具有完全不同的 syslog 配置，因此使用不同的日志文件。\n\
  \n发送到 `syslog` 的每条日志消息都有三个属性：其来源程序、一个 `facility`（设施）和一个 `priority`（优先级）。`facility`\
  \ 对消息进行分类，指示其来自系统的哪个部分。在 Linux 上识别的设施见表 13.1。\n\n与每条消息关联的 `priority`（优先级）或日志级别指示了其严重性。许多服务器生成的低优先级消息只包含诊断或调试信息，这些信息可以安全地忽略。然而，高优先级的消息表示服务器或可能的整个系统出现了严重问题。Linux\
  \ 上识别的优先级（按从轻到重的排序）见表 13.2。\n\n### 表 13.1. 系统日志设施及其来源\n\n| auth or authpriv | 所有与成功或失败身份验证尝试相关的消息将使用此设施。\
  \ |\n| cron | 用于来自 Cron 和 At 守护的日志消息。 |\n| daemon | 用于来自其他守护的消息，例如 NFS、NIS 和 DHCP\
  \ 服务器。 |\n| kern | 用于来自内核的错误、警告和信息性日志消息。 |\n| lpr | 用于来自打印服务器和打印命令的消息。 |\n| mail\
  \ | 用于邮件传输日志以及来自 Sendmail 或 Postfix 的错误消息。 |\n| news | 用于来自 INN 等新闻服务器的消息。 |\n|\
  \ syslog | 用于 syslog 守护进程本身生成的日志消息。 |\n| user | 用于通用用户级消息。不经常使用。 |\n| uucp | 用于来自\
  \ UUCP（UNIX 到 UNIX 复制）服务器程序的消息，这些程序几乎不再使用。 |\n| local0 to local7 | 这些设施保留供本地使用，例如可以配置为使用不同设施的服务器。\
  \ |\n\n### 表 13.2. 系统日志优先级及其含义\n\n| debug | 仅包含调试信息，可以安全地忽略。 |\n| info | 信息消息，表示发生了某些情况，但并不严重。\
  \ |\n| notice | 表示正常但重要的事件。 |\n| warning | 关于某些潜在问题的警告。 |\n| err | 错误消息，表示某些操作失败了。\
  \ |\n| crit | 表示某种关键问题。 |\n| alert | 必须立即检查的极其严重的问题。 |\n| emerg | 表示即将发生或实际系统故障。\
  \ |\n\n`/etc/syslog.conf` 文件包含 syslog 配置，控制哪些消息被记录到哪些文件和目标。Webmin 直接读取并修改此文件以更改你的系统日志设置，并从\
  \ `/var/log` 中的文件读取以显示日志消息。\n\n并不是所有程序生成的所有日志都受 `syslog` 控制。例如，Apache Web 服务器直接写入日志文件，记录它收到的每一个\
  \ HTTP 请求。Squid 和 Qmail 等其他程序也有自己的私有日志文件，这些文件不受 `syslog` 控制，因此无法使用“系统日志”Webmin 模块进行配置。其中某些服务器可以配置为通过\
  \ `syslog` 记录日志，但这绝不是默认设置，而且对于像 Apache 这样产生大量日志消息的程序来说这通常是一个坏主意。有关在这些服务器中配置日志的更多信息，请参阅第\
  \ 29、38 和 44 章。\n\n### 13.2 系统日志模块\n\n如果你想查看系统上的日志文件并配置日志消息的记录位置，“ “系统”类别下的“系统日志”模块就是你要去的地方。该模块的主页列出了\
  \ `syslog` 当前正在记录的所有文件和其他目标，如图 13.1 所示。对于每个日志目标，都会显示其活动状态以及记录到该处的设施和优先级。\n\n####\
  \ 图 13.1. 系统日志模块。\n\n![](img/13fig01.jpg)\n\n即使你不想更改现有的日志设置，也可以通过点击 `View` 链接使用该模块查看日志文件。这将带你进入一个显示文件最后\
  \ 20 行的页面，底部有一个 `Refresh` 按钮用于刷新页面或增加显示的行数。你还可以通过 `Only show lines with text` 字段将显示限制为仅某些特定类型的日志消息。只有写入普通文件的日志可以查看，而发送到另一个服务器、用户、命名管道或设备文件的日志无法被\
  \ Webmin 读取。\n\n### 13.3 添加新日志文件\n\n由于写入到每个日志目标的消息对其他目标没有影响，因此你可以添加一个新的日志文件，而不影响任何现有的文件。如果你想查看某些目前未被记录的信息，或者如果你想将特定设施或优先级的消息分离到与当前记录位置不同的文件中，这将非常有用。\n\
  \n要添加新的日志文件或目标，请遵循以下步骤：\n\n在“系统日志”模块的主页，点击现有日志文件列表上方或下方的 `Add a new system log`\
  \ 链接。这将带你进入图 13.2 所示的表单，输入新日志目标的详情。\n\n#### 图 13.2. 新日志目标表单。\n\n![](img/13fig02.jpg)\n\
  \n在 `Log to` 字段中选择五个选项之一，控制消息写入到哪里。\n\n- **File**: 如果选择此选项，必须在文本框中输入写入日志的文件名。日志将追加到文件中，如果文件不存在则会创建。为了确保\
  \ `syslog` 在添加每行后都将其写入磁盘，请选择 `Sync after message?` 选项。除非你正在减少系统的磁盘活动（例如在笔记本电脑上），否则选择此选项是明智的。可以创建多个写入同一个文件的日志，而无必担心其中一个的消息会覆盖另一个。\n\
  \n- **Named pipe**: 命名管道是一种特殊文件，由一个程序写入并通过另一个程序读取。如果你想将日志消息写入管道，请先创建它，然后在选项旁边的字段中输入其路径。\n\
  \n- **Syslog server on**: 此选项用于将系统的部分或全部日志消息传递到另一个服务器，假设该服务器也运行 syslog。如果选中，必须在选项旁边的字段中输入远程服务器的主机名或\
  \ IP 地址。与本地日志相比，写入远程服务器的日志对于入侵系统的攻击者是安全的。\n\n- **Local user**: 如果选择此选项，日志消息将广播给选项文本框中列出的任何用户。用户必须通过\
  \ SSH、telnet 或控制台登录才能接收日志消息。\n\n- **All logged-in users**: 与上一个选项类似，但消息将发送给所有登录用户。为了避免骚扰他人，此选项应仅用于记录严重的错误。\n\
  \n`Logging active?` 字段决定此日志是否启用。如果设置为 No，`syslog.conf` 中的该日志条目将被注释掉，消息不会发送到选定的目标。\n\
  \n`Message types to log` 部分控制哪些消息被写入日志目标。它由两部分组成：设施和优先级。只有当消息同时匹配所选的设施和优先级时，它才会被记录。\n\
  \n对于设施，你可以从菜单中选择单个设施，选择 `All` 选项以包含所有设施，或者在 `Many` 文本字段中输入以空格分隔的设施列表。\n\n\n\n\n\n\
  对于优先级（Priorities），你可以选择 `None` 以表示不记录所选设施的消息，选择 `All` 以记录任何优先级的消息，或者从菜单中选择范围选项（`At\
  \ or above` 高于或、`Exactly` 恰好、`Below` 低于 `All except` 排除所有），并从最后一个菜单中选择一个优先级。最后一个选项将根据你的范围类型和优先级选择，将记录限制为一个或多个优先级的消息。\n\
  \n在创建新日志时，你只能选择一组设施和一个优先级范围。然而，在保存后，如果你重新编辑该日志，可以添加额外的行来指定设施和优先级，以便记录多种类型的消息。你甚至可以在优先级选项项下使用\
  \ `None` 选项来排除之前行中已包含的某些设施。\n\n在表单上完成选择后，点击 `Create` 按钮。只要没有错误，你将返回模块的主页。\n\n点击\
  \ `Apply Changes` 按钮使你的新日志目标变为激活。\n\n### 13.4 编辑或删除日志文件\n\n可以使用 Webmin 对模块主页显示的任何现有日志进行编辑或删除。然而，在更改系统默认配置中包含的路径时应加小心，因为重要的消息可能不再被记录。即使更改写入日志的文件名可能会导致问题，因为许多\
  \ Linux 发行版包含了自动截断标准日志文件的软件，以防止它们占用过多磁盘空间。\n\n要更改日志，请遵循以下步骤：\n\n在模块主页上，点击你要编辑的日志目标。这将进入编辑表单，该表单与图\
  \ 13.2 显示的创建表单几乎相同。\n\n更改任何现有设置，例如目标类型、`log file` 或 `active status`。你也可以通过添加或编辑\
  \ `Message types to log`（要记录的消息类型）部分中的行来更改记录哪些设施和优先级。始终会有一个空行用于选择新的设施和新的优先级范围，正如第\
  \ 13.3 节“添加新日志文件”所解释的那样。\n\n完成后，点击 `Save` 按钮。只要你在表单中没有犯错，浏览器将返回到模块主页。\n\n点击 `Apply\
  \ Changes` 按钮使你的更改生效。\n\n要删除日志，请遵循以下步骤：\n\n在模块主页上，点击你要删除的日志目标。\n\n点击页面底部的 `Delete`\
  \ 按钮。这将停止向该目标写入日志，但它不会删除任何已经写入的日志文件，如果你需要，可以手动删除。\n\n回到主页后，点击 `Apply Changes` 按钮使更改生效。\n\
  \n### 13.5 模块访问控制\n\n可以对系统日志模块进行限制，使得 Webmin 用户只能将其查看日志文件，而不能创建和编辑它们。正如第 52 节所述，你必须先创建或编辑一个具有模块访问权限的用户。完成后，按照以下步骤将其限制为仅查看日志文件：\n\
  \n在 Webmin 用户模块中，点击要限制的用户名称旁边的 `System Logs`。\n\n将 `Can edit module configuration?`（可以编辑模块配置？）选项更改为\
  \ `No`，这样他就无法重新配置模块以使用虚假的 `syslog.conf` 文件。\n\n将 `Can only view logs?`（仅可以查看日志？）字段改为\
  \ `Yes`。设置此项后，用户在模块主页上唯一能的操作就是点击日志条目旁边的 `View` 链接。\n\n要限制用户可以查看的日志文件，在 `Can view\
  \ and configure log files`（可以查看和配置日志文件）字段中选择 `Only listed files and those under\
  \ listed directories`（仅列出的文件和列出目录下的文件），并在相邻文本框中输入文件名列表。如果系统上的某些日志包含敏感或安全信息，这将非常有用。\n\
  \n点击 `Save` 按钮使更改生效。\n\n### 13.6 其他操作系统\n\n几乎所有的 UNIX 版本都使用 `syslog` 来控制日志写入的目标，因此系统日志模块在大多数操作系统上可用。它在所有系统中具有类似的功能，因此用户界面通常是相同的。然而，下面解释了一些差异：\n\
  \n#### Sun Solaris, Apple MacOS X, HP/UX, SCO UNIXWare, SCO OpenServer 和 IBM AIX\n\
  \n在 Solaris 上，第一次使用该模块时，Webmin 可能会询问你是否要从 M4 格式转换 `syslog.conf`。除非你进行了使用 M4 宏的手动更改，否则这样做是安全的。\n\
  \n不支持写入命名管道（named pipes）。\n\n没有每次写入日志文件后进行同步的选项。\n\n在选择写入日志的消息优先级时，没有 `At or above`、`Exactly`、`Below`\
  \ 和 `All except` 范围类型。相反，所有优先级高于或等于你所选级的消息都将被记录。\n\n#### FreeBSD, OpenBSD 和 NetBSD\n\
  \n在 FreeBSD 上，不支持写入命名管道。\n\n在 OpenBSD 和 NetBSD 上，日志可以直接发送到命令的输入，而不是命名管道。\n\n没有每次写入日志文件后进行同步的选项。\n\
  \n在选择写入日志的消息优先级时，`At or above`、`Exactly`、`Below` 和 `All except` 范围类型被 `>=`, `=`,\
  \ `<`, 和 `<>` 取代，它们具有相似含义。\n\n每个日志目标都可以与一个程序关联，通过可选的 `Only for program` 字段设置。如果设置，则只有来自输入的服务器或守护进程的日志会被写入此日志文件。\n\
  \n#### SGI Irix\n\n不支持写入命名管道。相反，日志可以直接发送到命令的输入。\n\n没有每次写入日志文件后进行同步的选项。\n\n日志可以写入\
  \ UNIX 域套接字文件。\n\n在选择写入日志的消息优先级时，没有 `At or above`、`Exactly`、`Below` 和 `All except`\
  \ 范围类型。相反，所有优先级高于或等于你所选级的消息都将被记录。\n\n如果你的操作系统不在上述列表中，则系统日志模块不支持它。\n\n### 13.7 总结\n\
  \nUNIX 系统上的日志文件包含丰富的有用信息，例如收到的电子邮件详细信息、用户尝试和成功登录的记录、内核的硬件错误报告等。本章解释了如何配置用于各种类型消息的文件和其他目标，以及如何通过\
  \ Webmin 查看这些文件。系统管理工作的一个重要部分是密切关注指示严重错误或潜在安全违规的日志消息。\n\n## 第 14 章. 文件系统备份\n\n本章解释了如何使用\
  \ Webmin 的文件系统备份模块，使用 `dump` 命令备份和恢复文件。\n\n### 14.1 使用 Dump 备份简介\n\n备份 UNIX 系统有许多种方法，你可以直接将文件复制到另一个目录，使用\
  \ `tar` 命令创建归档文件或写入磁带设备，或者使用 `dump` 系列命令。虽然复制或使用 `tar` 更简单，但只有 `dump` 可以保留所有类型的文件（如命名管道和符号链接）以及文件信息（如\
  \ ACL 和属性）。它能做到这一点是因为它对底层文件系统的了解比其他备份程序更深奥。\n\n`dump` 程序的另一个独特优势是它支持备份级别。如果你定期备份同一个目录，就不需要每次将所有文件写入备份设备，而是可以选择只保存自上次低级别备份以来发生更改的文件。例如，你可以每周进行一次全备份（级别\
  \ 0），每天进行一次快得多的备份（级别 9）。唯一的缺点是，如果需要恢复数据，则需要读取每周备份以及本周为止的所有每日备份。\n\n\n\n\n使用 `dump`\
  \ 进行备份存在其他备份工具不具备的问题。它写入文件或磁带设备的数据没有经过压缩，尽管对于大多数磁带驱动器这不是问题，因为它们会自动压缩数据。另一个问题是它无法备份通过\
  \ `NFS` 从另一台服务器挂载的文件，因为它不像 `tar` 和 `cp` 命令那样从磁盘读取。\n\n## 14.2 文件系统备份模块\n\n该模块允许你对本地文件系统上的目录进行备份，可以是按需或按固定计划。对于正在备份的文件系统类型使用相应的命令，例如对\
  \ `xfs` 文件系统使用 `xfsdump`，对 `ext2` 或 `ext3` 使用 `dump`。该模块还支持恢复备份，可以恢复到原始位置或不同的路径。\n\
  \n当你从系统（System）类别进入该模块时，主页将显示你当前配置的所有备份，如图 14.1 所示。当然，如果你是第一次使用该模块，将没有可显示的内容。\n\n\
  #### 图 14.1。文件系统备份模块主页。\n\n![](img/14fig01.jpg)\n\n如果 Webmin 检测到你的系统中没有安装任何必要的备份命令，主页上将显示错误消息。所有\
  \ Linux 发行版都应该在其 CD 或网站上包含一个带有 `dump` 程序的包。\n\n### 14.3 添加新备份\n\n如果你想备份某个目录（无论是偶尔还是按定期计划），你首先需要添加一个新的备份配置。这指定了要备份的目录、要使用的选项以及计划运行的时间。创建新配置要遵循的步骤如下：\n\
  \n在模块的主页上，在“添加目录备份”（Add a new backup of directory）按钮旁字段中输入要备份的目录路径。当你点击按钮时，Webmin\
  \ 将确定该目录的文件系统类型（`ext2`、`ext3` 或 `xfs`），并显示带有该文件系统类型选项的备份创建表单。图 14.2 显示 `ext2` 或\
  \ `ext3` 备份的表单。\n\n#### 图 14.2。新备份配置表单。\n\n![](img/14fig02.jpg)\n\n你输入的路径将出现在“备份目录”（Directory\
  \ to backup）字段中。如果你愿意，仍然可以更改，只要输入的新目录仍在相同的文件系统上即可。\n\n如果备份到本地文件，将“备份到”（Backup to）字段设置为“文件或磁带设备”（File\
  \ or tape device）选项，并在旁边的文本字段中输入你想将备份写入的文件。\n\n备份到磁带驱动器与写入文件类似，但不需要在“文件或磁带设备”字段中输入文件名，而必须输入磁带机的设备文件。例如，`/dev/st0`\
  \ 将是你系统中第一台 SCSI 磁带机的设备文件。\n\n如果备份到另一台服务器，你必须在“备份到”（Backup to）字段中选择“主机”（Host）选项，并在远程服务器上输入主机名、远程用户名以及文件或设备名称。服务器必须在其“互联网服务”（Internet\
  \ Services）模块中启用 shell 服务，如第 15 章所述。还必须为目标用户设置适当的 `.rhosts` 文件，以便 `dump` 命令在连接时无需提供密码。\n\
  \n如果你的备份被写入到本地文件，且你不希望它超过特定大小，请将“跨多个文件分割？”（Split across multiple files?）选项设置为“是”，并在“磁带大小”（Tape\
  \ size）字段中输入以字节为单位的最大值。如果备份以后要保存到多张 CD 或 Zip 盘，这将非常有用。\n\n如果你正如引言所示在不同级别进行多次备份，请将“Dump\
  \ 级别”（Dump level）字段更改为全量备份（Full backup）以外的其他值。然而，如果你希望每个备份都包含源目录中的所有文件，请保持级别 0 不变。\n\
  \n如果你正在备份到磁带，最好将“磁带大小”字段设置为你的磁带可以容纳的字节数。否则，`dump` 命令可能会低估可以写入的数据量并导致备份无法完成。\n\n\
  可以使用 `chattr` 命令标记文件在备份时跳过，如果目录中包含你不想保存的巨大且无用文件，这将非常有用。但是，在执行级别 0 备份时，除非“始终排除标记的文件？”（Always\
  \ exclude marked files?）字段设置为“是”，否则这些文件将被包含在内。\n\n如果你熟悉操作系统使用的 `dump` 命令，可以使用“额外的命令行参数”（Extra\
  \ command-line parameters）字段输入传递给程序的额外选项，例如 `A /tmp/archive`。否则，请留空。\n\n为了在执行 `dump`\
  \ 命令之前之后运行命令，请填写“备份前运行的命令”（Command to run before backup）和“备份后运行的命令”（Command to run\
  \ after backup）字段。这些命令将在通过计划或通过 Webmin 手动进行备份时以 root 身份运行。它们对于加载和卸载磁带，或在保存之前将文件复制到备份目录非常有用。\n\
  \n如果你希望按计划运行备份，将“启用计划备份？”（Scheduled backup enabled?）选项设置为“启用”，并从页面底部的列表中选择运行的时间和日期。选择日期的用户界面与第\
  \ 10 章介绍的“计划 Cron ”（Scheduled Cron Jobs）模块使用的完全相同。\n\n要将计划备份的状态报告通过电子邮件发送，请在“电子邮件计划输出”（Email\
  \ scheduled output）字段中输入你的电子邮件地址。\n\n默认情况下，备份邮件的主题将类似于 `Dump of /etc`。如果你在多个系统上使用此模块，你可能希望自定义主题行，以便邮件来源的主机和备份的数据更加明显。要这样做，请取消勾选“邮件主题”（Email\
  \ message subject）字段的“默认”（Default）选项，并在旁边的文本字段中输入新的主题。\n\n最后，点击“创建”（Create）按钮保存新备份配置的详细信息。如果表单没有错误，你将返回模块的主页。\n\
  \n或者，你可以通过点击“创建并立即备份”（Create and Backup Now）立即开始备份。这将带你进入显示进度的页面，如第 14.4 节“制作备份”所示。\n\
  \n除了 `ext2` 和 `ext3` 之外，另一种具有类似备份命令的文件系统类型是 `xfs`。由于其 `xfsdump` 命令选项略有不同，新备份表单上的字段与上述描述不完全相同。一个重要的区别是，“备份目录”必须是文件系统的挂载点，而不仅仅是其中的任何目录。\n\
  \n## 制作备份\n\n一旦你创建了出现在模块主页上的备份配置，就可以使用 Webmin 随时手动执行它。要这样做，要遵循的步骤如下：\n\n从模块主页的配置列表中点击你想备份的目录。这将带你进入显示备份配置所有详细信息的表单。\n\
  \n点击页面底部的“立即备份”（Backup Now）按钮。Webmin 将执行相应的 `dump` 命令，并在写入备份文件或磁带设备时显示其输出。备份之前或之后运行的任何命令的输出也将显示。\n\
  \n如果一切顺利，页面底部将显示“备份完成”（backup complete）消息。然而，如果出现问题，将显示“备份失败”（backup failed），检查\
  \ `dump` 命令的输出以查看具体问题所在。\n\n文件系统备份模块的一个局限是它无法创建跨多个磁带的备份。通常 `dump` 命令会在需要时提示用户加载新磁带，但在从\
  \ Webmin 运行时这是是不可能的。\n\n### 14.5 编辑或删除备份\n\n模块主页上显示的备份配置可以随时进行编辑。要更改其中一个，请执行以下操作：\n\
  \n\n\n\n点击您想要更改的备份配置目录。这将进入编辑表单，该表单与图 14.2 所示的创建表单相似。\n\n您可以更改任何选项，包括备份目录、目的地或计划。不过，您无法将目录更改为不同类型文件系统的路径，因为该系统可能有不同的选项，或者根本不受支持。\n\
  \n点击 `Save` 按钮记录您的更改，或点击 `Save and Backup Now` 立即使用新选项开始备份。\n\n要删除现有的备份配置，请遵循以下步骤：\n\
  \n- 在主页上，点击您想要删除的备份配置目录，这将带您进入编辑界面。\n- 点击页面底部的 `Delete` 按钮。备份配置将被立即删除，您将返回模块的主页。不过，该配置创建的实际备份文件不会受到影响。\n\
  \n### 14.6 恢复备份\n\n使用 Webmin（或手动运行 `dump` 命令）制作的备份也可以使用此模块进行恢复。如果您创建了不同级别的备份，必须按照级别递增的顺序进行恢复，从完整备份（级别\
  \ 0）开始。备份可以恢复到任何目录，而不仅仅是原始保存的目录。但是，如果恢复目录的文件系统不支持 ACL 和属性等文件信息，这些信息将会丢失。\n\n恢复备份的步骤如下：\n\
  \n- 在“文件系统备份”模块的主页上，使用 `Restore backup of filesystem type` 按钮旁边的列表选择备份的文件系统类型。由于恢复不同类型的文件系统有不同的程序，因此恢复选项将根据您选择的类型而异。\n\
  - 点击 `Restore backup of filesystem type` 按钮，这将带您进入恢复选项页面。图 14.3 显示了恢复 `ext2` 或 `ext3`\
  \ 文件系统备份的页面。\n\n### 图 14.3 备份恢复表单。\n\n![](img/14fig03.jpg)\n\n如果从本地文件恢复，将 `Restore\
  \ from file or device` 字段设置为 `File` 或 `tape device` 选项，并在旁边的文本字段中输入您想要从备份读取的文件。\n\
  \n从磁带驱动器恢复与从文件读取类似，但不需要在 `File or tape device` 字段中输入文件名，必须输入磁带驱动器的设备文件：例如：`/dev/st0`。\n\
  \n如果从另一个服务器恢复，您必须选择 `Host` 选项，并在远程服务器上输入主机名、远程用户名以及文件或设备名称。如第 14.3 节“添加新备份”所述，服务器必须正确配置以允许远程访问。\n\
  \n默认情况下，备份中的所有内容都将恢复。如果只想提取某些文件，将 `Files to restore` 选项设置为 `Listed files`，并在旁边的字段中输入您想要恢复的文件路径。要恢复多个文件，文件名之间必须用空格分隔。\n\
  \n由于备份中使用的路径有时相对于其原始所在文件系统的挂载点，因此使用 `Only show files in backup?` 选项查看正确的文件通常是一个好主意。\n\
  \n在 `Restore to directory` 字段中，输入您想要保存恢复文件的基目录。\n\n如果原始备份跨越多个文件，请将 `Backup is split\
  \ across multiple files?` 选项设置为 `Yes`。\n\n如果您只想查看备份内容而不提取任何文件，请将 `Only show files\
  \ in backup?` 选项设置为 `Yes`。\n\n如果您熟悉在操作系统上使用的 `restore` 命令，可以使用 `Extra command-line\
  \ parameters` 字段输入传递给程序的额外选项，例如 `A /tmp/archive`。否则，请留空。\n\n当您准备好恢复时，点击 `Restore\
  \ Backup Now` 按钮。如果是实际提取文件，将显示一个显示相应 `restore` 命令输出的页面。如果您选择仅查看备份中的文件，页面将显示由 `restore`\
  \ 命令产生的列表。\n\n当从 `xfs` 文件系统恢复备份时，恢复表单上提供不同的选项。不存在 `Files to restore` 选项，因此备份中的所有文件都将被提取。但是，有一个\
  \ `Overwrite existing files` 选项，可以设置为 `Never` 以保护现有文件，或设置为 `Unless newer than backup`\
  \ 以保护自备份创建以来修改过的文件。\n\n使用 Webmin 的一个问题是它无法处理跨越多个磁带的备份。通常，`restore` 命令会提示用户弹出第一盘磁带并插入第二盘，但当它由\
  \ Webmin 运行时，这将是不可能的。\n\n## 14.7 配置文件系统备份模块\n\n点击此模块主页左上角的 `Module Config` 链接将出一个设置控制其行为选项的表单。可用设置及其含义见表\
  \ 14.1。\n\n### 表 14.1 模块配置选项\n\n| 是否对备份目的地进行 strftime 替换？ | 如果在此字段中选择 `Yes`，则备份目标路径将把任何以\
  \ `%` 开头的特殊代码替换为当前时间和日期组件。例如，`%m` 将替换为月份数字，`%d` 为日期，`%y` 为年份。这些与标准 UNIX `strftime`\
  \ 函数使用的相同替换。如果您希望备份每天写入不同的文件，而不是每次都覆盖同一个文件，则此选项非常有用。默认选项为 `No`，这将关闭此行为。 |\n| 通过\
  \ SMTP 服务器发送邮件 | 当选择选择 `Local sendmail` 可执行文件时，计划备份的输出将通过运行系统上的 `sendmail` 命令发送，该路径取自\
  \ `Sendmail` 模块。然而，您可以告诉模块通过向其他其他主机建立 SMTP 连接来发送电子邮件，如果您的系统完全没有运行邮件服务器，或者运行了其他 Sendmail，则可能是有必要的。只需选择第二个单选按钮并在文本框中输入主机名即可。\
  \ |\n\n### 14.8 其他操作系统\n\n许多 UNIX 操作系统拥有与 Linux 类似的 dump 和 restore 命令，其中几个系统受此 Webmin\
  \ 模块的支持。然而，可用选项略有不同，因此不同系统的备份和恢复表单与 Linux 的并不完全相同。\n\n目前支持的系统及其差异如下：\n\n**Sun Solaris**:\
  \ 在 Solaris 上，可以使用 `ufsdump` 和 `ufsrestore` 命令对 `ufs` 文件系统进行备份和恢复。创建备份时，没有 `Split\
  \ across multiple files?` 和 `Dump label` 字段，相反，有 `Verify data after backup?` 和 `Eject\
  \ tape after backup?` 选项，其含义显而易见。Solaris 还支持一次性备份多个目录，方法是在 `Directory to backup`\
  \ 字段中输入多个用空格分隔的路径。在 Solaris 上进行恢复的选项与 Linux 上基本相同。\n\n**FreeBSD 和 Apple MacOS X**:\
  \ 由于 MacOS X 的 BSD 渊源，这两个操作系统在 Webmin 中具有几乎完全相同的 dump 命令和可用选项。在制作备份时，没有 `Split across\
  \ multiple files?` 和 `Dump label` 字段，但有 `Tape size` 选项。可以备份的文件系统类型是 `ufs`，且备份必须是整个文件系统的，而不仅仅是任何目录。遗憾的是，在\
  \ MacOS X 上几乎所有的文件系统都是 Apple 原生的 `hfs` 格式。恢复时，唯一的区别是多了一个 `Just test backup?` 选项，设置该项后会导致\
  \ restore 命令执行除写入磁盘以外的所有操作。\n\n\n\n\n\nSGI Irix：在 Irix 上，唯一可以使用 Webmin 进行备份的文件系统类型是\
  \ `xfs`，尽管旧的 `efs` 文件系统有一个 `dump` 命令。与 Linux 上的 `xfs` 文件系统一样，只能备份整个文件系统，而不能备份任意目录。`Tape\
  \ size`（带大小）选项不可用，但你可以通过 `Maximum file size to include`（要包含的最大文件大小）选项来限制包含的文件的大小，并通过\
  \ `Include file attributes?`（包含文件属性？）选项关闭属性的备份。\n\n在 Irix 上恢复备份时，没有选项可以指定提取哪些文件，相反，备份中的所有内容都将被恢复。不过，有一个\
  \ `Overwrite existing files?`（覆盖现有文件？）选项，可以保护现有文件或比备份文件更新的现有文件不被覆盖。\n\n由于使用 `dump`\
  \ 系列命令制作备份具有底层特性，在一个操作系统上创建的备份将无法在任何其他操作系统上恢复。\n\n### # 14.9 总结\n\n读完本章后，你应该能够使用\
  \ Webmin 为系统本地硬盘硬盘上的数据创建备份，并在需要时恢复这些备份。你还应该理解本节介绍模块模块使用的 `dump` 备份格式与 `tar` 和 `cpio`\
  \ 等命令创建的格式之间的区别。在运行重要服务器或托管关键数据的系统中，适当的备份至关重要，Webmin 可以帮助你创建备份。\n\n## # 第 15 章 网络服务\n\
  \n本章涵盖了超级服务器 `inetd` 和 `xinetd`，它们负责在需要时启动用于 `telnet` 和 `FTP` 等协议的服务器。\n\n### #\
  \ 15.1 网络服务简介\n\n电子邮件、代理和 Web 服务等频繁使用的网络服务由持续运行的服务器进程处理，这些进程有自己复杂的配置文件和 Webmin 模块。然而，还有诸如\
  \ `telnet`、`finger` 和 `POP3` 等服务，它们不需要任何配置，也不需要自己的持久服务器进程。相反，它们的服务器在需要时由 `inetd`\
  \ 或 `xinetd` 等超级服务器运行，这些超级服务器在多个端口上监听网络连接。只有在接收到连接时，它才会启动相应的进程与客户端通信，并在连接关闭时退出。这通过限制同时运行的进程数量来节省内存，但会使处理新连接的速度略慢。\n\
  \n每个服务都有一个类似 `telnet` 或 `pop3` 的短名、类似 `23` 或 `110` 的端口号以及类似 `TCP` 或 `UDP` 的协议。`/etc/services`\
  \ 文件列出了系统已知的所有服务名称及其对应的端口号，其中只有少数可能有超级服务器或其他服务器在监听。\n\n最常用的超级服务器是 `inetd`，几乎被所有的\
  \ Linux 发行版和 UNIX 变体使用。所有的服务器设置都存储在配置文件 `/etc/inetd.conf` 中。除了响应 `TCP` 和 `UDP` 连接启动服务器外，还可以类似的方式处理\
  \ `RPC`（远程过程调用）函数调用。`inetd` 的一个主要缺点是无法根据客户端 IP 地址拒绝连接。然而，可以通过使用中间 `TCP-wrappers`\
  \ 服务器程序来克服这一点，该程序有自己的 IP 访问控制配置文件。\n\n另一个日益流行且功能更多的超级服务器是 `xinetd`，它使用 `/etc/xinetd.conf`\
  \ 配置文件，有时 `/etc/xinetd.d` 目录下的其他文件。与 `inetd` 一样，它可以响应 `TCP` 和 `UDP` 连接启动服务器进程，但不支持\
  \ `RCP`。它的主要优势是内置支持在不需要单独配置程序的情况下将连接限制到某些客户端 IP 地址。它还可以通过建立自己的客户端连接并来回数据，将某些端口上的输入连接重定向到另一个主机和端口。\n\
  \n由于 `inetd` 和 `xinetd` 有完全不同的配置文件和文件格式，因此它们都有各自的 Webmin 模块进行配置。大多数 Linux 发行版会带有其中之一，但在某些情况下，两者都可以被安装并和平共存。唯一的限制是它们不能同时在同一个端口上监听。\n\
  \n### # 15.2 网络服务与协议模块\n\n该模块处理 `inetd` 的配置，可以在 Webmin 的“Networking（网络）”类别下找到它。如果图标不可见，说明\
  \ Webmin 已经检测到它未安装。这可能是因为你的发行版正改用 `xinetd`，在这种情况下，你应该跳到第 15.8 节“扩展网络服务模块”。如果两个模块都不可见，请检查你的发行版\
  \ CD 或网站是否有 `inetd` 或 `xinetd` 包。\n\n该模块的主页（如图 15.1 所示）显示了两个表格，一个用于响应 `TCP` 或 `UDP`\
  \ 连接的网络服务，另一个用于 `RCP 程序`。在网络服务部分，在某些情况下会显示所有服务的名称和协议，同一个服务可能被识别为多个协议。每个服务可以处于三种状态之一，由显示其名称的字体指示：\n\
  \n- Enabled（**粗体**）：表示已为此服务分配了服务器程序，且其目前处于激活状态。\n- Disabled（***粗体斜体***）：表示已分配了服务器程序，但未激活状态。这对应于\
  \ `inetd.conf` 文件中注释掉的条目。\n- Unassigned（普通字体）：表示未为此服务分配服务器程序，意味着它没有相应的 `inetd.conf`\
  \ 条目。\n\n##### 图 15.1. 网络服务与协议模块的主页。\n\n####![](img/15fig01.jpg)\n\n如果模块配置选项 `Show\
  \ services with no program（显示无程序的服务）` 被设置为 `No（否）`，未分配状态的服务将不会显示。由于系统知道的服务数量巨大，这是某些操作系统的默认设置。\n\
  \n大多数 Linux 发行版默认将几乎所有服务都处于禁用状态。这限制了系统允许连接的必要服务数量，从而减少了攻击者利用某个服务器程序中安全漏洞的机会。\n\n\
  由于每个服务只显示类似 `telnet` 或 `chargen` 的短名，对于缺乏经验的管理员来说，它们每个服务的作用并不明显。一些较常用的服务及其用途见表 15.1。\n\
  \n对于 `TCP` 和 `UDP` 协议，`daytime`、`echo` 和 `chargen` 服务在启用时由 `inetd` 内部处理，而不是通过单独服务器程序。\n\
  \n##### 表 15.1 常用服务及其用途\n\n| 服务名称 | 协议 | 用途 |\n| --- | --- | --- |\n| `telnet` |\
  \ `TCP` | 使用 `telnet` 命令进行远程登录。由于 `telnet` 连接未加密，通过它的任何用户名或密码理论上都可以被攻击者捕获。在现代系统中，通常使用更安全的\
  \ `SSH` 协议。 |\n| `pop3` | `TCP` | 使用几乎邮件客户端程序（如 `Outlook`、`Eudora` 或 `Netscape`）检索邮件。如果你希望用户能够从你的系统获取邮件，则应启用此协议。\
  \ |\n| `imap` | `TCP` | 一种优的邮件检索协议，支持文件夹和服务器端邮件存储。然而，支持它的邮件客户端较少。 |\n| `finger`\
  \ | `TCP` | 使用 `finger` 命令进行远程用户查询。 |\n| `ntalk` | `TCP` | 使用 `UNIX` `talk` 程序进行人与人的聊天。\
  \ |\n| `ftp` | `TCP` | 使用 `FTP` 客户端进行文件上传或下载。有多种不同的 FTP 服务器可用，最常用 `wu-ftpd` 和 `proftpd`。由于它们有许多单独配置的选项，每个程序都有各自的\
  \ Webmin 模块，如第 40 章和第 41 章所示。 |\n\n\n\n\n\n| 服务 | 协议 | 说明 |\n| :--- | :--- | :---\
  \ |\n| shell | TCP | 使用 `rsh` 命令进行身份验证远程登录。由于 shell 协议仅通过客户端 IP 地址验证用户，因此不被认为是安全的；`ssh`\
  \ 是一个更好的替代方案。然而，你可能需要为文件系统备份（Filesystem Backup）模块的远程备份启用它。 |\n| login | TCP | 使用\
  \ `rlogin` 命令进行远程登录。由于其可以配置为仅通过客户端地址验证用户，因此被认为是不安全的且很少被使用。 |\n| exec | TCP | 使用\
  \ `rexec` 程序进行远程命令执行。由于 `ssh` 的优越性，在现代系统中很少使用。 |\n| daytime | TCP | 连接后，以人类可读的格式显示服务器时间。\
  \ |\n| daytime | UDP |类似于 TCP daytime 服务，但通过 UDP 数据包返回人类可读的时间。 |\n| time | TCP |\
  \ 建立连接，以 4 字节二进制数显示系统时间。 |\n| time | UDP |  TCP time 服务，但通过 UDP 数据包返回二进制时间。 |\n\
  | echo | TCP | 传回接收到的任何数据。 |\n| echo | UDP | 传回接收到的任何数据包。 |\n| chargen | TCP | 只要客户端连接，就会产生包含可打印\
  \ ASCII 字符的无限数据流。 |\n| chargen | UDP |类似于 TCP chargen 服务，但对从客户端接收的每个包返回一个包含 ASCII\
  \ 字符的 UDP 数据包。 |\n\n### 15.3 启用互联网服务\n\n如果你想允许用户使用 POP3 协议从你的系统获取邮件，或通过 `telnet`\
  \ 登录，如果相应的互联网服务尚未启用，则必须开启它。要执行此操作，请遵循以下步骤：\n\n在模块的主页上，点击 Internet Services 表中你想启用的服务名称。这将带你进入图\
  \ 15.2 所示的页面以编辑其详情。\n\n#### 图 15.2. 编辑互联网服务。\n\n![](img/15fig02.jpg)\n\n如果你的系统中没有显示未分配的服务，你可以在\
  \ `Edit service` 按钮旁的字段中输入服务名称并选择协议。点击该按钮将带你进入编辑表单（前提是服务名称被系统识别）。\n\n除非你想重命名服务或更改它监听的端口，否则服务名称（Service\
  \ name）、端口号（Port number）、协议（Protocol）和别名（Aliases）字段应保持不变。对于不是你自己创建的服务，更改这些字段中的任何一个都不是好主，因为可能会阻止系统上的程序连接到其他服务器。\n\
  \n要在 Server 程序部分启用服务，请选择 `Program enabled`（启用程序）选项。如果之前选择了 `Program disabled`（禁用程序），该部分的所有其他设置应该是正确的，不需要更改。\n\
  \n然而，如果之前选择了 `No program assigned`（未分配程序），你需要选择一个服务器程序和一个供服务器运行的用户。选择 `Program`\
  \ 字段中的 `Command` 选项，并在旁边的字段中输入服务器程序的完整路径，例如 FTP 服务器的 `/usr/sbin/in.ftpd`。在 `Args`\
  \ 字段中，再次输入服务器命令以及任何所需的参数，例如 `in.ftpd l a`。尽管程序路径在 `Command` 字段中，但程序名称也必须出现在 `Args`\
  \ 字段中。\n\n你需要在 `Execute as User` 字段中输入服务器程序运行所需的用户名。对于几乎所有服务器，这将是 `root`。除非服务器运行和执行非常快，否则必须设置\
  \ `Wait Mode` 选项之一，选择 `Don't wait`（不等待）。\n\n如 `daytime`、`echo`、`chargen` 和 `discard`\
  \ 等服务由 `inetd` 内部处理。如果你启用其中之一，只需选择 `Internal to inetd`。不需要输入程序或参数，服务器执行的用户也无关。\n\
  \n完成后，点击 `Save`（保存）按钮。只要没有错误且所选服务器程序确实存在，浏览器将返回主页的服务列表。\n\n点击页面底部的 `Apply Changes`（应用更改）按钮使更改生效。\n\
  \n在某些情况下，你将无法启用服务，因为相应的服务器程序尚未安装。如果是这种情况，请使用 `Software Packages` 模块从你的 Linux 发版\
  \ CD 或网站安装它。\n\n如果你想禁用服务，只需遵循相同的步骤，但选择 `Program disabled` 选项。这比选择 `No program assigned`\
  \ 好，因为很容易再次开启服务，而无需重新输入服务器程序的详情。\n\n### 15.4 创建自己的互联网服务\n\n在某些情况下，你可能想为系统添加一个监听未分配给其他任何内容的端口的新服务器。你可能想在某些非标准端口上运行\
  \ `telnet` 服务器，或者使用像 `nc` 的程序将系统中一个端口的流量重定向到另一个服务器。如果你只是想尝试开启如 `ftp` 或 `imap` 等标准服务，本节的说明不适用于你——请参见第\
  \ 15.3 节“启用互联网服务”。\n\n创建新服务的遵循步骤如下：\n\n在模块的主页上，点击 `Create a new internet service`\
  \ 链接。这将带你进入服务创建表单，该单与图 15.2 中的编辑表单类似。\n\n在 `Service Name` 字段中为你的服务填写唯一名称。\n\n在 `Port\
  \ Number` 字段中输入你想让服务关联的端口号。\n\n从 `Protocol` 列表中选择协议。这几乎总是 `TCP`，但在某些情况下你可能需要使用 `UDP`。\n\
  \n在 `Aliases` 字段中输入你希望引用的任何替代名称。\n\n假设你想让此服务关联一个服务器程序，请在 `Server Program` 部分选择 `Program\
  \ enabled` 选项。否则，创建的只是服务名称与端口号之间的关联。\n\n对于 `Program` 字段，选择 `Command` 选项并在旁边的字段中输入服务器程序的完整路径——例如\
  \ `/usr/local/bin/someserver`。在 `Args` 字段中，输入程序名称以及运行它所需的任何命令行参数，例如 `someserver\
  \ foo`。\n\n再举一个例子，如果你想创建一个服务，向任何通过 `telnet` 连接的人显示系统上运行的所有进程，你可以将 `Command` 设置为\
  \ `/bin/ps`并将 `Args` 设置为 `ps auxwww`。（虽然从安全角度来看，这是一个坏主意。）\n\n如果服务器程序运行时间超过一秒，或者它接受任何输入，将\
  \ `Wait mode` 字段设置为 `Don't wait`。否则 `inetd` 将停止处理新的网络连接，直到程序完成。这种 `Wait until complete`（等待直到完成）模式的唯一优点是略微减少内存占用。\n\
  \n在 `Execute as User` 字段中输入服务器程序应运行的 UNIX 用户名。这通常是 `root`，也可以是任何人。\n\n要限制 `inetd`\
  \ 接受你服务的连接速率，在 `Max per Minute` 字段中输入一个数字。如果超过限制，后续连接将被拒绝，直到下一分钟。\n\n默认情况下，服务器程序运行的组是\
  \ `Execute as User` 字段中设置的用户的主组。要更改此项，在 `Execute as Group` 字段中输入组名。\n\n点击 `Create`\
  \ 按钮创建你的服务。只要表单没有错误，你将返回主页的服务列表。\n\n点击 `Apply Changes` 按钮使服务生效。\n\n一旦创建了服务，你可以在系统的\
  \ shell 提示符上运行 `telnet localhost *portnumber` 来测试它。你可以随时通过点击主页上的服务名称来编辑服务，并在点击 `Save`\
  \ 或 `Delete`（如果你想删除它）之前更改任何选项。在进行任何修改后，必须使用 `Apply Changes` 按钮使它们生效。\n\n### 15.5\
  \ 创建和编辑 RPC 程序\n\n\n\n\nRPC 是一种协议和数据格式，是 NFS 和 NIS 等其他协议的基础。RPC 客户端向 RPC 服务器发起函数调用，传递参数并获取结果。对于客户端或服务器而言，发起远程过程调用并不比调用普通库函数困难，这使得编写使用\
  \ RPC 的程序比从头创建自己的协议要容易得多。\n\n一个 RPC 程序是一组由服务器处理的函数。每个程序都有一个唯一的编号，类似于 Internet 服务的端口。程序不与特定协议关联，因为它们通常可以通过\
  \ UDP 或 TCP 接受连接和函数调用。它们也没有固定的端口，因为端口是在需要时动态分配的。\n\n处理大量流量的 RPC 服务器（如 NIS 和 NFS\
  \ 服务器）拥有一直运行的自己的进程。然而，某些只需要偶尔运行的服务器可以像不常使用的 Internet 服务一样，仅在需要时才由 `inetd` 执行。一些常用的\
  \ RPC 程序包括：\n\n### 常用 RPC 程序\n\n在某些系统上，这些 RPC 程序可能由并非从 `inetd` 运行的服务器处理，而是作为独立进程运行。在这种情况下，启动和关闭模块（在第\
  \ 9 章中解释）就是激活或停用它们的地方。由于常用 RPC 程序数量较少且用途有限，许多 Linux 发行版默认不会在 `inetd` 配置中启用或禁用任何程序。然而，在\
  \ Solaris 等其他操作系统上情况并非如此。\n\n#### 表 15.2 常用 RPC 程序及其用途\n\n| 程序名称 | 用途 |\n| --- |\
  \ --- |\n| `rquotad` | 远程磁盘配额检索。如果系统正在通过 NFS 导出带有配额的文件系统，客户端上的 `quota` 命令可以使用此程序来显示\
  \ NFS 挂载文件系统上已用和可用的块及文件。 |\n| `rusersd` | 请求登录到系统的用户列表。可以使用 `rusers` 命令显示登录到一个或多个服务器上的用户。\
  \ |\n| `walld` | 向服务器上的用户广播消息。就像向本地用户发送消息的 `wall` 命令一样，`rwall` 命令通过调用此 RPC 程序向另一个系统上的用户发送消息。\
  \ |\n\n如果您想使用一个当前未启用的 RPC 协议，可以使用此模块将其开启。当然，必须先安装相应的 RPC 服务器程序，并且您系统上的 `inetd` 必须支持\
  \ RPC 程序。如果是这样，请遵循以下步骤：\n\n在模块的主页上，点击 RPC 程序表中的程序名称。这将引导您进入图 15.3 所示的程序编辑表。\n\n\
  #### 图 15.3 RPC 程序编辑表。\n\n![](img/15fig03.jpg)\n\n在“服务器程序”（Server Program）部分，选择“启用程序”（Program\
  \ enabled）选项。如果之前选择了“禁用程序”（Program disabled），则该部分的所有其他设置应该是正确的，不需要更改。然而，如果勾选了“未分配程序”（No\
  \ program assigned），您需要填写其他几个字段。\n\n`RPC Versions`RPC 版本）字段应设置为服务器程序支持的版本范围，例如 `1-3`。\n\
  \n`Socket Type`套接类型）字段应设置为 Datagram（数据报），`Protocol`协议）字段应仅设置为 `udp` 选项。\n\n对于“服务器程序”（Server\
  \ Program）字段，输入 RPC 程序的完整路径，例如 `/usr/sbin/rpc.rusersd`。对于“命令”（Command）字段，输入程序名称和任何参数，例如\
  \ `rpc.rusersd a`。\n\n对于“等待模式”（Wait Mode），选择“不等待”（Don't wait）。\n\n对于“以用户身份执行”（Execute\
  \ as User）字段，输入您希望服务器程序运行身份的用户名，通常为 `root`。\n\n完成后，点击`Save`保存）按钮。只要您的输入没有错误，您将返回模块的主页，此时\
  \ RPC 程序应显示为已启用。\n\n点击`Apply Changes`应用更改）按钮使程序激活。\n\n### 15.6 配置 Internet 服务和协议模块\n\
  \n要访问 Internet 服务模块的可配置选项，请点击其主页左上角的 `Module Config`模块配置）链接。这将引导您进入标准配置表，您可以在其中更改表\
  \ 15.3 所示的选项。\n\n#### 表 15.3 模块配置选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 显示无程序的服务 (Show\
  \ services with no program) | 如果设置为 Yes，主页将仅显示分配了启用或禁用服务器程序的 Internet 服务。在大多数发行版中默认是\
  \ No，但某些发行版的已知服务非常多，必须开启此选项来限制服务列表的大小。 |\n| 按...排序服务和程序 (Sort services and programs\
  \ by) | 控制主页上 Internet 和 RPC 服务的顺序。如果选择 Name（名称），将按服务名称排序。如果选择 Assignment（分配），则所有分配了启用服务器程序的将列在前面，然后是分配了禁用程序的，最后是未分配的。如果选择\
  \ Order in file（文件中的顺序），则服务将按照它们在 `/etc/services` 中存储的顺序显示，通常是按端口号排序。 |\n\n“系统配置”（System\
  \ configuration）下的其余模块配置选项由 Webmin 根据您的操作系统类型自动设置，因此不应进行更改。\n\n### 15.7 其他操作系统\n\
  \n几乎所有版本的 UNIX 都包含 `inetd` 作为标准，并以与 Linux 相同的方式启动不经常运行的服务器程序。然而，它的配置文件格式和功能在其他操作系统上略有不同，这意味着模块的用户界面将不会完全相同。主页始终会显示\
  \ Internet 和 RPC 服务的列表，但在编辑或创建服务时，将根据您运行的 UNIX 变体提供不同的字段和选项：\n\n#### Sun Solaris\n\
  \n编辑 Internet 服务时，`Max Per Minute`（每分钟最大）和 `Execute as Group`（以组执行）字段不可用。\n\nSolaris\
  \ 8 及以上版本支持 IPv6 TCP 和 UDP 协议，以及 Linux 使用的标准 IPv4。\n\n许多 RPC 服务默认处于禁用状态，用于 NFS 配额和锁定等功能。\n\
  \n#### FreeBSD\n\nRPC 服务不能分配程序。您能做的只是编辑服务名称和程序编号。\n\n在编辑或创建服务时，您可以使用 `Max Child\
  \ Processes`（最大子进程）字段控制同时可运行的服务器程序数量。\n\n此外，在编辑时，您可以使用 `Execute as Login Class`（以登录类执行）字段设置服务器程序运行的登录类。\n\
  \n#### NetBSD\n\n与 FreeBSD 一样，在编辑或创建服务时可以使用 `Max Child Processes` 和 `Execute as\
  \ Login Class` 字段。\n\n与 Solaris 一样，Internet 服务可以使用 IPv6 TCP 和 UDP 协议。\n\n#### OpenBSD,\
  \ Compaq Tru64/OSF1, IBM AIX, SCO OpenServer, 和 SCO UnixWare\n\n与 Solaris 一样，`Max\
  \ Per Minute` 和 `Execute as Group` 字段不可用。\n\n#### SGI Irix\n\n编辑服务时，`Max Per Minute`\
  \ 和 `Execute as Group` 字段不可用。\n\n在服务器程序`Command`字段下方有一个名为 `Command may not exist?`（命令可能不存在？）的复选框。如果勾选此项，它将告诉\
  \ `inetd` 如果服务器程序未安装则忽略该服务。默认情况下，对于许多默认未安装的 Irix 软件包相关的服务是开启的。\n\n#### HP/UX\n\n\
  在 HP/UX 上，模块的选项与 Linux 上完全相同。\n\n#### Apple MacOS X\n\n与 Solaris 一样，`Max Per Minute`\
  \ 和 `Execute as Group` 字段不可用。\n\nRPC 服务不能像 FreeBSD 一样分配程序。\n\n服务名称和端口不是存储在 `/etc/services`\
  \ 文件中，而是存储在 NetInfo 表中。Webmin 通过导出并重新加载此表来读取和编辑服务。\n\n### 15.8 扩展 Internet 服务模块\n\
  \n\n\n\n\n此模块允许你配置 `xinetd`，这是一个超级服务器，其目的与 `inetd` 类似，但具有若干额外功能。与“互联网服务和协议”模块一样，此模块也可以在“网络”类别下找到。但是，只有当\
  \ Webmin 检测到已安装 `xinetd` 时，它的图标才会显示，它是通过查找 `/etc/xinetd.conf` 文件来检测的。如果你手动编译并安装了，可能需要创建一个指向\
  \ `xinetd.conf` 真实位置的符号链接。\n\n主页列出了所有分配了服务器程序的服务及其端口号、协议、程序和活动状态——示例参见图 15.4。与“互联网服务”模块不同，没有程序的服务将永远不会显示。\n\
  \n#### 图 15.4 扩展的互联网服务模块。\n\n![](img/15fig04.jpg)\n\n在使用 `xinetd` 的 Linux 发行版中，大多数服务器程序包都包含一个文件，该文件会将适当的服务添加到主页显示的列表中。这些服务默认通常是禁用的，以防服务在安装时立即被意外启用。\n\
  \n如果你在其他安装了 `xinetd` 的操作系统上使用，用户界面与 Linux 上完全相同。然而，服务器程序包在安装时可能不会设置服务。\n\n### 15.9\
  \ 启用或编辑扩展互联网服务\n\n如果你想允许用户使用 POP3 协议从你的系统获取邮件，或通过 `telnet` 登录，则必须在此模块中开启相应的服务（假设它已列在主页上）。如果没有，你将需要先从你的发行版网站或光盘安装相应的软件包，这应该会该服务添加一个条目。如果没有，请参见第\
  \ 15.10 节“创建扩展互联网服务”。\n\n现有服务也可以通过其他方式进行更改，例如限制允许的客户端 IP 地址或并发连接数。编辑服务的步骤如下：\n\n\
  1.  在“扩展互联网服务”模块的主页上，点击你想要编辑的服务名称。这将带你进入图 15.5 所示的表单。\n\n#### 图 15.5 编辑扩展的互联网服务。\n\
  \n![](img/15fig05.jpg)\n\n2.  `Service`（服务）名称、`Socket type`（套接字类型）和 `Protocol`（协议）选项应应保持不变。只有在你明确自己在做什么时，才应更改\
  \ `Port`（端口）字段。\n\n3.  要启用服务，将 `Service enabled?`（是否启用服务？）字段设置为 `Yes`。或者如果它已经启用而你想关闭它，请选择\
  \ `No`。\n\n4.  如果你希望服务仅通过你服务器上的单个 IP 地址访问，请将其输入 `Bind to address`（绑定到地址）字段中。如果你在系统上有多个虚拟\
  \ IP 接口，并希望不同的服务器监听不同的地址，这将非常有用。\n\n5.  `Server program options`（服务器程序选项）下的绝大多数字段都可以保持不变，除非你想限制服务给系统带来的负载。如果是这样，你可以将\
  \ `Max concurrent servers`（最大并发服务器）字段设置为允许同时运行的服务器进程的最大数。`Maximum connections per\
  \ second`（每秒最大连接数）和 `Delay if maximum is reached`（达到最大值时的延迟）字段可以用来限制客户端连接的速率，以及超过该速率时服务被禁用的时间。\n\
  \n6.  要控制允许客户端连接的地址，请使用 `Service access control`（服务访问控制）部分中的字段。如果 `Allow access\
  \ from`（允许访问来源）设置为 `Only listed hosts`（仅列出的主机），则仅允许输入的 IP 地址（如 `192.168.1.55`）、主机（如\
  \ `server.foo.com`）和网络（如 `192.168.1.0/24`）。如果 `Deny access from`（拒绝访问来源）设置为 `Only\
  \ listed hosts`，则输入的主机、IP 地址和网络将被阻止连接。\n\n7.  如果客户端同时匹配两个列表中的条目，将使用最具体的条目来决定允许还是拒绝访问。例如，如果\
  \ `192.168.1.10` 被允许而 `192.168.1.0/24` 被拒绝，那么 IP 地址为 `192.168.1.10` 的客户端将能够连接。\n\
  \n8.  如果你想限制使用服务，，填写 `Allow access at times`（允许访问的时间段）字段。它必须符合 `HH:MM-HH:MM` 格式，例如\
  \ `9:00-17:00` 以允许在正常工作时间内访问。\n\n9.  完成更改后，点击 `Save`（保存）按钮。只要你没有犯任何错误，浏览器将返回模块主页。\n\
  \n10. 点击 `Apply Changes`（应用更改）按钮使你的修改生效。\n\n11. 如果你想完全删除一个服务，可以点击编辑表单上的 `Delete`（删除）按钮。然而，通常最好禁用它，以便以后以后重新开启。\n\
  \n### 15.10 创建扩展互联网服务\n\n如果你想启用主页列表中不存在的协议，或将从特定端口的流量重定向到另一个主机，则你需要使用此模块创建一个新服务。必须先安装该服务的适当服务器程序，除非你在设置重定向。步骤如下：\n\
  \n1.  点击主页列表上方或下方的 `Create a new internet service`（创建新的互联网服务）。这将带你进入创建表单，类似于图 15.5。\n\
  \n2.  如果该服务用于 `telnet` 或 `finger` 等标准协议，请在 `Service name`（服务名称）字段中输入其名称。`Port`（端口）号可以保持为\
  \ `Standard`（标准）。\n\n3.  否则，在 `Service name` 字段中输入唯一名称，并将 `Port` 号设置为你希望服务监听的端口。\n\
  \n4.  如果你希望服务仅通过你服务器上的单个 IP 地址访问，请将其输入 `Bind to address`（绑定到地址）字段中。如果你在系统上有多个虚拟\
  \ IP 接口，并希望不同的服务器监听不同的地址，这将非常有用。\n\n5.  将 `Protocol`（协议）字段设置为服务要使用的协议，通常为 `TCP`。对于\
  \ `TCP` 协议服务，`Socket type`（套接字类型）字段应设置为 `Stream`，对于 `UDP` 服务则设置为 `Datagram`。\n\n\
  6.  如果你的服务将使用服务器程序，请将 `Service handled by`（服务处理程序）选项设置为 `Server program`（服务器程序），并在旁边的字段中输入其命令和任何参数，例如\
  \ `/usr/sbin/in.telnetd a*`。\n\n7.  如果服务只是将流量重定向到另一个主机，选择 `Redirect to host`（重定向到主机）选项并在相应的字段中输入目标主机名和端口。如果你的防火墙或网关主机正在运行\
  \ `xinetd`，重定向对于将内部网络系统的服务开放给互联网其他部分非常有用。\n\n8.  在 `Run as user`（以用户运行）字段中，输入服务器程序将运行的\
  \ UNIX 用户名。重定向服务是不需要的。\n\n9.  除非服务器程序总是运行得很快，否则将 `Wait until complete`（等待直到完成）字段设置为\
  \ `No`。如果你将其设置为 `Yes`，`xinetd` 将在程序完成之前不再处理任何连接。\n\n10. 要限制客户端连接的速率，请按照第 15.9 节“启用或编辑扩展互联网服务”所述设置\
  \ `Max concurrent servers` 和 `Maximum connections per second` 字段。\n\n11. 要限制客户端连接的地址或允许连接的时间，请如上列表所示设置\
  \ `Service access control` 下的字段。\n\n12. 完成后，点击 `Create`（创建）按钮。如果表单无错误，你将返回主页，新服务现在应该会列在那里。\n\
  \n13. 点击 `Apply Changes`（应用更改）按钮使服务生效。\n\n14. 一旦创建了服务，你可以在系统的 shell 提示符上运行 `telnet\
  \ localhost *portnumber` 来进行测试。你可以按照第 15.9 节“启用或编辑扩展互联网服务”中的指令，随时编辑或删除你的服务。\n\n\
  ### 15.11 编辑默认选项\n\n有几个全局选项适用于 `xinetd` 处理的所有服务，用于日志记录和 IP 访问控制。要编辑这些选项，步骤如下：\n\n\
  \n\n\n点击模块主页面底部的`Edit Defaults`按钮，这将带您进入选项表单。\n\n要限制客户端连接到任何服务的地址，请填写 `Allow access\
  \ from`（允许从...访问）和 `Deny access from`（拒绝从...访问）字段。正如第 15.9 节“启用或编辑扩展互联网服务”所示，接受的输入与服务表中同名字段相同。\n\
  \n单个服务配置的任何 IP 访问控制将覆盖你在表单中输入的默认设置。\n\n要让 `xinetd` 记录到 `syslog`，请将 `Xinetd logging\
  \ mode` 字段设置为 `Log to syslog facility`，并选择其应使用的设施和优先级。第 13 章详细解释了如何根据所选的优先级和设施来配置\
  \ `xinetd` 消息写入的日志文件。通常情况下，这是默认且最佳的。\n\n如果你想让 `xinetd` 直接记录到文件，请选择 `Log to file`\
  \ 选项并在相邻字段中输入日志文件路径。为了在文件过大时记录警告信息，请在 `Soft file limit` 字段中输入字节为单位的文件大小。要设置一个永远不会超过的文件大小限制，请填写\
  \ `Hard file limit` 字段。如果设置了软限制但未设置硬限制，它将默认为比软限制多 1%。如果两个都没有设置，日志文件将无限增长，可能导致攻击者通过向\
  \ `xinetd` 发起数百万次连接耗尽你所有的磁盘空间。\n\n要完全关闭记录，请将 `Xinetd logging mode` 字段设置为 `Disable\
  \ logging`。\n\n要控制记录哪些事件，请从 `On successful connection log`（连接成功记录）和 `On failed connection\
  \ log`（连接失败记录）字段中选择相应的选项。\n\n完成后，点击`Save`按钮。只要输入无误，你将返回到模块主页面。\n\n点击`Apply Changes`按钮使新默认设置生效。\n\
  \n### 15.12 总结\n\n本章解释了两种常用的 UNIX 超服务器程序 `inetd` 和 `xinetd` 的用途以及它们之间的区别。阅读本书后，你应该知道如何启用由这两个任一程序启动的标准服务，以及必要时如何创建和编辑你自己的服务。其他几个章节提到了本章涵盖的模块，特别是关于\
  \ `FTP`、`CVS` 和 `SSL` 隧道服务器的章节。\n\n## 第 16 章 网络配置\n\n本章解释了如何设置系统的 IP 地址、主机名、DNS\
  \ 服务器和其他网络设置。它涵盖了 Linux 和其他 UNIX 变体。\n\n### 16.1 Linux 网络简介\n\nLinux 系统可以通过多种不同的方式连接到网络或互联网，例如通过以太网网卡、令牌环卡或通过拨号调制解调器的\
  \ `PPP`（点对点协议）连接。如果你的系统从未连接到网络，那么本章不适合你。但是，如果你确实需要设置网络连接（特别是到局域网），请继续阅读。\n\n系统中每个可用于联网的以太网网卡、`PPP`\
  \ 连接、无线网卡或其他设备被称为 `interface`（接口）。接口通常与硬件（如网卡）关联，但也可以动态创建（如 `PPP` 连接）。要使用 `interface`，它必须首先分配一个\
  \ IP 地址，该地址可以是固定的（从系统中的配置文件中设置），也可以由服务器动态分配。公司或家庭网络中桌面式 PC 的以太网接口通常具有固定地址，而连接到 ISP\
  \ 的 `PPP` 连接接口将由另一端的服务器动态分配地址。\n\n`PPP` 接口的配置方式与以太网和其他固定硬件接口非常不同。在激活之前，必须使用调制解调器拨打特定号码的\
  \ ISP，并使用用户名和密码登录。只有在登录成功后，`PPP` 接口才会由 ISP 的接入服务器分配 IP 地址。系统中的其他网络设置（如 `DNS` 服务器地址和默认网关）也将由\
  \ ISP 分配。然而，以太网接口可以随时设置 IP 地址并开始工作，通过以太网连接的系统通常使用固定的 `DNS` 服务器和网关地址。\n\n有时以太网接口的地址也是动态分配的。如果是这样配置，当\
  \ `interface` 在启动时激活时，系统将使用 `DHCP`（动态主机配置协议）广播地址请求。这将由 `DHCP` 服务器的响应，提供 IP 地址以及可能可能的默认网关和\
  \ `DNS` 服务器地址。`DHCP` 经常用于具有频繁连接和断开系统（如笔记本电脑）的大网络，以避免手动为每个系统配置固定 IP 地址。\n\n一种始终可特殊网络接口是环回接口（loopback\
  \ interface）。它始终具有 IP 地址 `127.0.0.1`，映射到主机名 `localhost`。此接口无法与其他系统通信，只能与你自己的系统通信，例如运行\
  \ `telnet localhost` 命令将调出你系统的登录提示（假设 `telnet` 服务器处于激活状态）。\n\n每个 `interface` 都有一个名称，如\
  \ `eth1` 或 `ppp0`。所有以太网接口以 `eth` 开头，`PPP` 接口以 `ppp` 开头，环回接口以 `lo` 开头，令牌环以 `tr` 开头。数字告诉你该\
  \ `interface` 相关的是哪种网卡；如果你的系统有两个以太网卡，第一个是 `eth0`，第二个是 `eth1`。\n\n如果你的系统连接到比小型家庭局网更大的网络，网络上的其中一台计算机将是网关。这是一个服务器（更有可能是路由器），它知道如何将流量路由到其他网络或互联网，可能通过\
  \ `PPP` 链路、宽带连接或其他网卡。要让你的系统与那些其他网络通信，必须配置网关的 IP 地址。\n\nIP 网络上的所有通信都使用像 `192.168.1.10`\
  \ 或 `210.23.128.117` 这样的 IP 地址。由于这类地址对于普通人来说并不容易记忆，它们也可以关联名称，如 `server.foo.com`。每当系统需要为主机名查询\
  \ IP 地址（或反之）时，它会查询 `DNS` 服务器，服务器将通过其自身的记录或通过查询网络或互联网上的其他 `DNS` 服务器提供所需信息。要使你的系统能够查询\
  \ `DNS` 服务器，需要配置附近服务器的 IP 地址或地址以及一个附加到任何主机名的默认域名。\n\n不过，并不是所有的 IP 地址都从 `DNS` 服务器查询，有些存储在你系统的\
  \ `/etc/hosts` 文件中，以便在网络未激活时也能找到它们。通常，`localhost` 和你系统主机的 IP 地址将存储在该文件中，因为它们很少更改。\n\
  \n正如预期的那样，可以在 Webmin 的 Networking 分类下找到网络配置模块。主页面显示四个配置类每一个图标：`Network Interfaces`（网络接口）、`Routing\
  \ and Gateways`（路由和网关）、`DNS Client`（DNS 客户端）和 `Host Addresses`（主机地址）。模块中的所有可编辑表单和选项都在这四个类别之一。\n\
  \n该模块主要设计用于具有永久网络连接的系统（如以太网或令牌环卡）配置网络。如果你的系统只有拨号 `PPP` 连接到互联网，那么它对你可能意义不大。相反，你应该使用\
  \ Webmin 的 `PPP Dialup Client` 模块，它允许你为拨号连接设置电话号码、用户名和密码。\n\n\n\n此模块中的表单允许您将系统配置为\
  \ DNS 和 DHCP 客户端。如果您想在自己的网络上运行自己的 DNS 服务器，请参阅第 30 章。要学习如何设置自己的 DHCP 服务器，请参阅第 32\
  \ 章。\n\n## 16.2 查看和编辑网络接口\n\n要查看系统当前激活的接口，请点击模块主页上的 `Network Interfaces`（网络接口）图标。这将带您进入图\
  \ 16.1 所示的页面，该页面分分类列出了系统接口。`Interfaces Active Now`（当前激活接口）下方是当前启用并分配了 IP 地址的接口。所有的回环（loopback）、以太网和\
  \ `PPP` 接口都将显示，尽管并非所有的都能使用 Webmin 进行编辑。底部 `Interfaces Activated at Boot Time`（启动时激活的接口）下方是配置为启动时激活的接口。这两个列表并不一定相同，因为某些类型的接口（如\
  \ `PPP`）在启动时不会激活，因此不会出现在第二个列表中。\n\n### 图 16.1. 网络接口页面。\n\n![](img/16fig01.jpg)\n\
  \n更改接口 IP 地址、激活状态或其他详细信息的步骤如下：\n\n如果接口同时显示在 `Interfaces Active Now` 和 `Interfaces\
  \ Activated at Boot Time` 下（大多数可编辑的接口都是如此），请点击下部列表中的名称。这将带您进入编辑设置的表单，如图 16.2 所示。\n\
  \n### 图 16.2. 接口编辑表单。\n\n![](img/16fig02.jpg)\n\n要分配不同的地址，请将其输入到 `IP Address`（IP\
  \ 地址）字段中。或者，如果您希望地址由网络上的 DHCP 服务器动态分配，请选择 `From DHCP` 选项。\n\n如有必要，更改 `Netmask`（子掩码）字段。如果更改了子掩码或\
  \ `IP address`，您还需要根据新的子掩码和 `IP` 设置 `Broadcast address`（广播地址）字段。\n\n在编辑激活接口时，`MTU`\
  \ 和 `Hardware address`（硬件地址）字段将可用。除非您非常清楚自己在做什么，否则应该保持 `MTU` 不变，因为更改可能会降低网络性能或使您的系统断开网络。只有在您想为网卡提供不同的\
  \ `Ethernet address`（以太网地址）时才更改硬件地址，这通常是不需要的。\n\n如果编辑启动时接口，请确保 `Activate at boot?`（启动时激活？）字段设置为\
  \ `Yes`（是），以便接口在系统启动时被建立。\n\n如果编辑激活接口，请确保 `Status`（状态）字段设置为 `Up`（开启），以便立即使用。\n\n\
  完成启动时接口的编辑后，点击 `Save and Apply`（保存并应用）按钮保存您的更改以便启动时使用，并使其立即生效。\n\n如果您正在编辑激活接口，只需点击\
  \ `Save`（保存）即可激活您的更改。\n\n在更改系统的任何 `IP addresses` 后，请务必更新与它们相关的任何主机地址条目。有关如何执行此操作的详细信息，请查看\
  \ 16.6 节“编辑主机地址”。您可能还需要更新 `DNS server`（DNS 服务器）中的记录。\n\n可以通过点击编辑表单上的 `Delete`（删除）按钮来关闭激活接口。同样，可以通过点击表单上的\
  \ `Delete` 按钮移除启动时接口（例如，如果您移除了网卡），这样它在启动时就不会被激活。\n\n### 16.3 添加网络接口\n\n如果您的系统刚刚安装了网卡，或者您正在为现有接口添加额外的虚拟\
  \ IP 地址，可能会出现两种想要添加新网络接口的情况。在后一种情况下，新的虚拟接口并不与其独立的网卡关联，而是向现有的 `Ethernet card` 添加了额外的\
  \ IP 地址。虚拟地址通常用于托管多个网站的系统，以便每个站点都可以有自己的 IP 地址。\n\n在配置新网卡的接口之前，您必须确保它被 `Linux kernel`\
  \ 识别并加载了相应的 `kernel module`（内核模块）。Webmin 目前不支持此操作，但大多数发行版都包含一个用于加载内核模块的图形化工具，或者\
  \ `/etc` 中有一个指定加载哪些模块的配置文件。一旦接口被识别，配置它的步骤如下：\n\n在模块主页上，点击 `Interfaces Activate at\
  \ Boot Time` 下方的 `Add a new interface`（添加新接口）链接。这将带您进入创建表单，该表单与图 16.2 中的编辑表单类似。\n\
  \n在 `Name`（名称）字段输入接口名称（例如 `eth1` 或 `tr0`）。这必须与 `kernel`（内核）分配的任何名称对应。\n\n在 `IP Address`\
  \ 字段中，输入地址或选择 `From DHCP` 选项进行动态分配。\n\n在 `Netmask` 字段中输入接口所在网络的子掩码，例如 `255.255.255.0`。\n\
  \n根据地址和子掩码设置 `Broadcast`（广播）字段。例如，如果 IP 为 `10.1.2.3` 且子掩码为 `255.0.0.0`，则广播地址将为 `10.255.255.255`。\n\
  \n如果您希望接口在启动时激活，请将 `Activate at boot?` 字段设置为 `Yes`。\n\n最后，点击 `Create`（创建）按钮。假设输入没有错误，您将返回接口列表。\n\
  \n要让接口现在激活，请从 `Interfaces Activate at Boot Time` 列表点击其名称。然后在编辑表单上，点击 `Save and Apply`\
  \ 按钮。如果在激活期间发生任何错误（例如内核未识别接口），Webmin 将显示错误消息。\n\n虚拟接口为现有的真实接口添加额外的 IP 地址。虚拟接口的名称如\
  \ `eth0:1`，其中 `eth0` 是真实接口的名称，`1` 是虚拟编号。添加虚拟接口的步骤如下：\n\n在模块主页上，在 `Interfaces Activate\
  \ at Boot Time` 下点击您想要添加虚拟地址的真实接口。\n\n在编辑表单上，点击 `Add virtual interface`（添加虚拟接口）链接。这将带您进入创建表单，类似于图\
  \ 16.2。\n\n在 `Name` 字段中为虚拟接口输入一个数字。该数字不能被同一块真实网卡上的任何现有虚拟接口使用。\n\n在 `IP Address`\
  \ 字段中填充您想要分配给虚拟接口的地址。\n\n`Netmask` 和 `Broadcast` 字段应设置为与真实接口相同的地址。只有当虚拟接口位于不同的 IP\
  \ 网络且该网络与真实接口的网络共享局域网时，它们才会不同。\n\n假设您希望在启动时创建虚拟接口，请将 `Activate at boot?` 字段设置为 `Yes`。\n\
  \n点击 `Create` 按钮。只要输入没有错误，您将返回接口列表。您的新虚拟接口将出现在 `Interfaces Activate at Boot Time`\
  \ 部分的真实父接口下方。\n\n要立即激活虚拟接口，点击其名称，然后在编辑表单上点击 `Save and Apply` 按钮。\n\n### 16.4 配置路由\n\
  \n如引言所示，任何连接到大型网络的系统都需要知道默认网关的地址。在某些情况下，系统本身可能也是一个网关，可能在局域网与拨号或宽带连接之间转发数据。在这种情况下，必须配置它转发指向某些其他地址的入站数据包。\n\
  \n在某些情况下，发往某些网络的流量可能必须通过另一个路由器而不是默认网关发送。或者，如果多个 IP 网络共享同一个局域网，发往其中任何网络的流量必须使用正确的接口发送。如果您的网络存在上述一种情况，则需要配置静态或本地路由，以便系统知道向何处发送目标数据包。\n\
  \n更改系统使用的默认网关或启用数据包转发的步骤如下：\n\n\n\n\n在“网络配置”模块的主页，点击“路由和网关”图标。这将引导您进入配置路由的表单，遗憾的是，由于底层配置文件的差异，每个\
  \ Linux 发行版的表单略有不同。\n\n将默认网关的 IP 地址输入到`Default router`字段。\n\n在 Red Hat Linux 8 及更高版本中，此字段以及下一步中提到的字段将被默认路由器和接口的表格取代。这可以用于为每个接口定义不同的网关，如果您的系统并不总是使用同一个网关，这将非常有用。但在大多数情况下，您只需在`Interface`下方的菜单中选择`Any`，并在`Gateway`方的字段中输入路由器的\
  \ IP 地址。\n\n在`Default route device`字段中输入用于访问默认网关的网络接口名称。在某些 Linux 发行版中，此字段是可选的，这意味着系统会自动计算。在其他一些发行版中，`Default\
  \ router`输入框旁边有一个`Gateway`字段。\n\n要启用路由，请将`Act as router?`字段设置为`Yes`。\n\n在 Red Hat、Mandrake、MSC\
  \ 和 Turbo Linux 上，您可以使用`Static routes table`设置静态路由。对于每条静态路由，您必须输入包含以下信息的一行：\n\n\
  - 在`Interface`列中，输入用于访问路由器的接口，例如`eth0`。\n- 在`Network`列中，输入远程网络的地址，例如`192.168.5.0`。\n\
  - 在`Netmask`列中，输入网络的子掩码，例如`255.255.255.0`。\n- 在`Gateway`列中，输入已知如何将数据转发到网络的路由器的 IP\
  \ 地址，例如`192.168.4.1`。\n\n在相同的发行版上，您可以使用`Local routes table`设置到连接的 LAN 上的额外 IP 网络的路由。对于每条路由，您必须输入包含以下详细信息的一行：\n\
  \n- 在`Interface`列中，输入 LAN 连接的接口名称，例如`eth1`。\n- 在`Network`列中，输入额外 IP 网络的地址，例如`192.168.3.0`。\n\
  \n完成后，点击`Save`按钮。任何更改都不会立即激活，而是在您的系统下次启动时生效。在某些 Linux 发行版中，模块的主页底部有一个标记为`Apply Configuration`的按钮，点击它将立即激活路由设置。它还会让任何启动时的网络接口立即变为激活，因此当从另一个系统的\
  \ Web 浏览器中使用它时要小心，如果网络配置错误，您的网络连接可能会中断。\n\n如果您的系统主网络连接是通过 PPP 拨号，那么默认网关将在连接时自动分配，并在断开时移除。因此，无需使用此表单进行设置。\n\
  \n### 16.5 更改主机名或 DNS 客户端设置\n\n每个 UNIX 系统都有主机名，它显示在登录提示、系统日志、发出的电子邮件以及每个 Webmin\
  \ 页面上。通常，主机名与系统 IP 地址的 DNS 名称相同或是的一部分，但不必如此，特别是当系统未连接到网络或仅通过拨号偶尔连接时。然而，对于永久连接的系统，主机名应该是主机的完全限定\
  \ DNS 名称（如`server1.foo.com`），或只是第一部分（如`server1`）。其他任何内容都可能导致混淆并可能引发网络问题。\n\n在首次设置\
  \ Linux 系统时，您可以在发行版的安装过程中选择主机名。然而，它可以随时更改，可以使用 Webmin、发行版提供的 GUI 工具或`hostname` 命令进行更改。若要在\
  \ Webmin 中进行更改，需要遵循的步骤如下：\n\n在“网络配置”模块的主页，点击`DNS Client`图标。这将引导您进入图 16.3 所示的编辑主机名和\
  \ DNS 选项的表单。\n\n#### 图 16.3 DNS 客户端和主机名表单。\n\n![](img/16fig03.jpg)\n\n在`Hostname`字段中输入新的主机名（由字母、数字、下划线和点组成）。\n\
  \n点击`Save`按钮立即更改。您的浏览器将返回到模块的主页。\n\n按照第 16.6 节“编辑主机地址”中的说明，将旧主机名的地址更改为新地址。\n\n如果您正在运行\
  \ DNS 服务器，不要忘记在该处也更新您的系统条目。\n\n正如本章引言所述，为了查找主机名和 IP 地址，您的系统几乎需要知道网络上 DNS 服务器的地址。\n\
  \n要更改系统的 DNS 设置，请遵循以下步骤：\n\n- 点击模块主页上的`DNS Client`图标，这将引导您进入图 16.3 所示的表单。\n- 在`DNS\
  \ servers`字段中输入最多三个服务器的地址。如果第一个不可用，系统将尝试第二个，最后是第三个。大多数网络至少有一个主、备用 DNS 服务器，以在其中一个故障时增加可靠性。\n\
  - `Resolution order`字段可以控制系统在解析主机名和 IP 地址时的查找位置。通常默认设置是合理的，`Hosts`（`/etc/hosts`\
  \ 文件）列在前面，DNS 列在后面。然而，如果您使用 NIS 进行主机名解析，则需要确保确保在顺序中的某处选择了它。\n- 在`Search domains`字段中，输入您希望系统自动附加到解析主机名上的任何域名。例如，如果列出了`foo.com`且您运行了命令`telnet\
  \ server1`，则将查找`server1.foo.com`的 IP 地址。\n- 完成后，点击`Save`按钮。任何更改将立即在系统上运行的所有程序中生效。\n\
  \n如果您的系统唯一网络连接是通过拨号，DNS 服务器可能会根据您的 PPP 配置由 ISP 自动分配。\n\n### 16.6 编辑主机地址\n\n主机地址是\
  \ IP 地址与一个或多个主机名之间的映射，存储在系统的`/etc/hosts`文件中。由于它们存储在本地，即使在无法访问 DNS 服务器时，也可以在任何时候进行查找。在只有少数几个系统的小型网络中，您可以选择完全不运行\
  \ DNS 服务器，而是在每个系统的`hosts`文件里保留每个系统的地址。事实上，这在 DNS 开发出现之前的互联网早期就是这样做的。\n\n要查看系统上的地址，请点击模块主页上的`Host\
  \ Addresses`图标。始终会有一个`localhost`的条目，可能还会有一个针对您的系统主机名的条目。如果您的系统 IP 地址或主机名发生了更改，主机地址列表可能不会反映该更改，这可能会导致问题。要更改主机地址，需要遵循的步骤如下：\n\
  \n- 点击列表中的其 IP 地址，这将引导您进入编辑表单。\n- 在`IP Address`字段中输入新地址。\n- 在`Hostnames`字段中输入任何主机名。输入任何主机名的短形式和长形式始终是一个好主意，例如`server1.foo.com`和`server1`，这样两者都可以被使用。\n\
  - 点击`Save`按钮，如果表单中没有错误，您的浏览器将返回主机和地址列表。\n\n您可以通过点击链接上方或下方的`Add a new host address`链接添加额外的主机地址，并填写相同的表单。对于同一个主机名关联两个不同的\
  \ IP 地址，或者同一个 IP 地址在列表中出现两次，没有任何限制。\n\n### 16.7 模块访问控制\n\n\n\n\n如第 52 章所述，可以限制特定\
  \ Webmin 用户或组可以访问的此模块功能。例如，你可能希望允许用户仅编辑主机地址列表，或者只能查看设置而不能进行编辑。要实现这一点，请创建或编辑具有该模块访问权限的\
  \ Webmin 用户，然后按照以下步骤操作：\n\n在 Webmin Users（用户）模块中，点击你想要限制的用户或组旁边的 `Network Configuration`（网络配置）。这将打开模块访问控制表。\n\
  \n将 `Can edit module configuration?`（可以编辑模块配置？）字段更改为 `No`，这样用户无法配置该模块来编辑 `/etc/hosts`\
  \ 以外的主机地址文件。\n\n`Can edit network interfaces?`（可以编辑网络接口？）字段决定了用户可以看到并编辑哪些接口。将其设置为\
  \ `Yes` 允许编辑所有接口，而选择 `No` 则完全无法访问 `Network Interfaces`（网络接口）页面。\n\n如果选择 `View only`（只读），所有接口将可见，但用户将无法更改它们的任何属性。如果选择\
  \ `Only interfaces`（仅接口），则只有在侧侧字段中输入名称（用空格分隔）的接口是可以编辑的。其他所有接口仅可见。\n\n如果 `Can edit\
  \ routing and gateways?`（可以编辑路由和网关？）字段设置为 `Yes`，用户将能够正常地设置默认路由器和静态路由。如果选择 `No`，将无法访问\
  \ `Routing and Gateways`（路由和网关）页面；如果选择 `View only`，则可以看到当前设置但无法更改。\n\n同样，`Can edit\
  \ DNS client settings?`（可以编辑 DNS 客户端设置？）和 `Can edit host addresses?`（可以编辑主机地址？）字段设置为\
  \ `Yes`、`View only` 和 `No`，分别控制对 `DNS Client`（DNS 客户端）和 `Host Addresses`（主机地址）页面的访问。\n\
  \n完成选择后，点击 `Save`（保存）按钮以立即激活新的限制。\n\n赋予不受信任的用户编辑此模块中任何网络配置的权限要非常小心，因为他们可能会通过更改路由、主机地址或接口设置来获取\
  \ root 权限或扰乱其他用户。\n\n### 16.8 其他操作系统\n\n`Network Configuration`模块在其他几个操作系统上也可用，其选项与\
  \ Linux 相当相似。由于其他版本的 UNIX 网络配置文件支持的功能不同，在某些部分用户界面非常不同。支持的系统以及它们与 Linux 之间的差异如下：\n\
  \n#### Sun Solaris 和 SCO UnixWare\n\n在编辑启动网络接口时，唯一可以更改的是 IP 地址。\n\n`loopback` 接口的启动设置完全无法编辑。这两个操作系统始终在启动时通过\
  \ IP 地址 `127.0.0.1` 启用它。\n\n在 `routing and gateways` 页面上，可以输入多个默认路由器。但是不需要指定默认路由设备，因为它是始终自动计算的。\n\
  \n#### FreeBSD 和 NetBSD\n\n没有使用 `DHCP` 在启动时为接口自动分配地址的选项。\n\n在 `routing and gateways`页面上，没有默认路由设备字段。但是，有一个额外的\
  \ `Start route discovery daemon?`（启动路由发现守护进程？）选项。\n\n活动接口的硬件地址无法更改。\n\n在创建虚拟接口时，网络掩码必须输入为\
  \ `255.255.255.255`。\n\n#### OpenBSD\n\n在 `routing and gateways`页面上，没有默认路由设备字段。但是，有一个额外的\
  \ `Start route discovery daemon?`（启动路由发现守护进程？）选项。\n\n活动接口的硬件地址无法更改。\n\n#### Mac\
  \ OS X\n\n在 `routing and gateways`页面上，仅显示设置默认路由器以及当此系统作为路由器运行时控制它的选项。\n\n在 `DNS\
  \ client` 页面上，不会出现解析顺序列表，因为系统总是首先检查 `hosts` 文件，然后是 DNS。\n\n### 16.9 总结\n\n本章解释了如何在你的\
  \ Linux 或 UNIX 系统上执行基础网络配置。阅读后，你应该应该知道如何为网络接口指定 IP 地址、定义路由并选择 ` DNS server`。除非你的系统只有一个到互联网的拨号连接，否则如果你想将机器连接到网络，这里提供的信息是非常重要的。\n\
  \n## 第 17 章 网络信息服务\n\nNIS 是一种用于在多个系统之间共享用户、组和其他信息的协议。本章解释了 NIS 如何工作，以及如何使用 Webmin\
  \ 将你的系统设置为客户端或服务器。\n\n### 17.1 NIS 简介\n\nNIS 最初由 Sun Microsystems 开发，但现在已用于 Linux\
  \ 和许多其他 UNIX 操作系统。它的原始名称是 `YP`（黄页），这就是为什么许多 NIS 命令以 `yp` 开头。\n\n在拥有许多系统的网络上，用户可能被允许登录其中任何一个系统。通常，为了避免在每个系统上单独创建和更新用户，可以使用\
  \ NIS 将用户和组的主列表分发到所有主机。尽管分配用户和组信息是 NIS 最常用的用途，但它也可以用于共享主机名和 IP 地址、自动挂载映射、Internet\
  \ 服务和网络组（netgroups）。\n\nNIS 服务器是存储用户、组和其他信息表的系统。客户端系统连接到服务器并查询其存储的信息，通常通过查找用户名、主机名等。通常，服务器系统也是它自己的一个客户端，这样它就可以访问自己表中的用户和其他数据。\n\
  \n每个服务器负责一个 NIS 域，每个客户端都是该域的成员。一个域有一个短名称，如 `marketing` 或 `foo.com`，这与网络的 DNS 域并不相同。当在客户端系统上启动\
  \ NIS 时，它可以向网络广播查找其域的任何服务器，或者连接到特定的服务器 IP 地址。单个网络可能有针对不同域的多个 NIS 服务器，每个服务器提供不同的表。\n\
  \n为了减少 NIS 服务器的负载，网络可能包含多个拥有相同表副本的服务器。一个是主服务器（master），其他是从服务器（slaves），从服务器仅每当信息更改时就从主服务器接收信息。客户端随后连接到主服务器或从服务器并查询相同的表。\n\
  \n最近，开发了旧 NIS 协议的一个新版本，称为 `NIS+`。它解决了原始协议的许多问题，最大的问题是缺乏安全性。然而，它的配置更复杂，且没有广泛可用。由于这些原因，Webmin\
  \ 仅支持 NIS 客户端和服务器的配置。\n\n`/var/yp/Makefile` 通常是 NIS 服务器的主要配置文件，也是一个从源文件生成二进制格式表数据的\
  \ make 脚本。服务器还会读取 `/var/yp/securenets` 和 `/etc/ypserv.conf` 文件来控制哪些客户端允许连接，以及它们可以查询哪些表。当你配置\
  \ NIS 时，Webmin 会直接更新所有这些文件以及表源文件。主要的 NIS 服务器程序称为 `ypserv`，但也可以运行其他如 `yppasswd`（处理来自客户端的密码更改请求）和\
  \ `ypfrd`（向从服务器发送表）程序。\n\n在客户端系统上，`/etc/yp.conf` 文件存储了域名和 NIS 服务器 IP 地址。关于要为哪些服务查询\
  \ NIS 信息存储在 `/etc/nsswitch.conf` 中。所有客户端都运行 `ypbind` 程序，该程序将本地程序对用户、组和其他信息的查询传递给\
  \ NIS 服务器。\n\n\n\nNIS 客户端和服务器 Webmin 模块允许你将系统配置为 NIS 客户端和/或服务器。当你从“网络”（Networking）类别进入时，主页面仅会显示五个图标，代表客户端和服务器配置的不同区域。如果\
  \ Webmin 发现你的系统中缺少 NIS 客户端程序，主页面将显示错误消息；发生这种情况，请检查你的 Linux 发行版光盘或网站，查找类似 `ypbind`\
  \ 的包。\n\n该模块不支持所有版本的 Linux。在编写本文时，只有 Red Hat、Mandrake、OpenLinux、Debian、SuSE、UnitedLinux\
  \ 和 MSC.Linux 可以它。由于每个发行版使用的 NIS 配置文件略有不同，不同发行版之间的用户界面和默认设置可能存在某些差异，特别是在客户端服务和 NIS\
  \ 服务器页面上。\n\n### 17.2 成为 NIS 客户端\n\n要将你的系统配置为 NIS 客户端，网络中必须已经运行着一个 NIS 服务器。如果没有，请参阅第\
  \ 17.3 节“设置 NIS 主服务器”获取如何启动服务器的信息。假设已经运行了 NIS 服务器且你知道其 NIS 域名，成为客户端的步骤如下：\n\n在模块的主页上，点击`NIS\
  \ Client（NIS 客户端）图标。这将带你进入输入域名和 NIS 服务器 IP 地址的表单。\n\n在`NIS domain（NIS 域）字段中，输入你的网络的\
  \ NIS 域名。\n\n如果你不知道 NIS 服务器的 IP 地址，将`NIS servers（NIS 服务器）选项设置为`Find by broadcast（通过广播查找）。这仅在服务器与你的系统处于同一局域网（LAN）时才有效；否则广播无法到达它。\n\
  \n如果你知道 NIS 服务器的地址，选择`Listed below（列出如下）选项，并将所有主服务器和从服务器地址输入到文本框中。输入的越多越好，因为在启用\
  \ NIS 时，你的系统将尝试逐一查询每一个。但是，最好先输入最近的服务器，以免总是查询距离较远且速度较慢的服务器。\n\n点击`Save and Apply（保存并应用）按钮以保存并立即激活设置。如果你的系统无法连接到\
  \ NIS 域的服务器，将显示错误消息；否则浏览器将返回模块主页。\n\n现在你已经连接到 NIS 服务器，你必须配置系统以便实际向其查询用户、组和其他信息。要执行此操作，点击`Client\
  \ Services（客户端服务）图标，这将带你进入图 17.1 所示的表单。\n\n### 图 17.1. NIS 客户端服务表单。\n\n![](img/17fig01.jpg)\n\
  \n客户端服务表单的每一行都控制你的系统在查找特定服务时查询的内容。对于每项，你可以选择多个源，系统将按顺序检查直到找到匹配项。可用的源有：\n\n- **Files（文件）**：本地配置文件，例如\
  \ `/etc/passwd` 或 `/etc/hosts`。\n- **NIS**：你的系统当前连接的此 NIS 服务器。\n- **NIS+**：你的系统连接的\
  \ NIS+ 服务器。Webmin 不支持配置 NIS+。\n- **NIS and Files（NIS 和文件）**：此选项仅适用于 UNIX 用户和 UNIX\
  \ 组服务。如果选中，`/etc/passwd` 和 `/etc/group` 中以 `+` 开头的特殊行可以指示应包含某些或全部 NIS 用户。这实际上比仅选择\
  \ NIS 源更灵活，因为可以使用特殊的 `+` 行来仅引入部分用户和组，或更改已包含项的属性。\n- **DNS**：此选项仅对 Host addresses（主机地址）源有意义。它告诉系统在查找主机名时查询\
  \ DNS 服务器，这几乎是你一直想要做的。\n\n通常，你应该将想要使用 NIS 的每个服务（如 UNIX 用户和 UNIX 组）设置为`Files（文件）`和\
  \ `NIS`。其他所有内容应保留为仅`Files（文件）`，或者对于主机地址设为 `Files` 和 `DNS`。你的系统将首先查找本地系统配置文件（如 `/etc/passwd`），然后查询\
  \ NIS 服务器。\n\n完成后，点击`Save（保存）`按钮。你的更改将立即在所有程序中生效，任何 NIS 用户都应该像本地用户一样可以登录。\n\n一旦你使用\
  \ Webmin 将你的系统设为 NIS 客户端，它将在启动时尝试连接到服务器。连接失败可能导致系统在启动过程中间挂起，等待服务器可用。如果你的系统连接期间服务器宕机，任何查询用户信息的程序也可能会挂起。\n\
  \n要停止你的系统作为 NIS 客户端，需要遵循的步骤如下：\n\n1. 在模块的主页上，点击`NIS Client（NIS 客户端）`图标进入客户端选项页面。\n\
  2. 将`NIS domain（NIS 域）`字段设置为`None（无/禁用 NIS）`.\n3. 点击`Save and Apply（保存并应用）`按钮。系统将不再使用\
  \ NIS 查找任何信息，且在启动时不连接。任何配置为使用 NIS 的服务将改为仅使用本地文件。\n\n### 17.3 设置 NIS 主服务器\n\n在你的系统成为\
  \ NIS 之前，必须首先安装适当的服务器程序；如果没有，点击`NIS Server（NIS 服务器）`图标将显示错误消息。检查你的 Linux 发行版光盘或网站是否有\
  \ `ypserv` 或 `nis-server` 包。\n\n设置 NIS 服务器的第一步是确定域名。通常这将与你的互联网域相同（例如 `foo.com`），允许由字母、数字和点组成。确定后，遵循以下步骤：\n\
  \n1. 在模块的主页上，点击`NIS Server（NIS 服务器）`图标。这将带你进入启用服务器并配置其他选项的表单，如图 17.2 所示。大多数 Linux\
  \ 发行版看起来相同，但在 Caldera 的 OpenLinux 上选项会少得多。\n\n### 图 17.2. NIS 服务器配置表单。\n\n![](img/17fig02.jpg)\n\
  \n- 将`Enable server?（启用 NIS 服务器?）`选项设置为`Yes（是）`。保存表单后，服务器进程将立即并在每次重启时启动。\n- 在`Serve\
  \ domain（提供的 NIS 域）`字段中输入指定的域名。这比选择`Same as client（与客户端）`选项更好，即使它们相同。\n- 将`Server\
  \ type（服务器类型）`设置为`Master server（主服务器）`。要设置从服务器，请参见第 17.6 节“设置 NIS 从服务器”。\n- 如果 NIS\
  \ 客户端无法在 DNS 中查找主机和地址，开启`Lookup missing hosts in DNS?（在 DNS 中查找缺失的主机?）`选项让主服务器代为查询。只有非常老的操作系统需要这个。\n\
  - 在`NIS tables to serve（提供的 NIS 表）`字段中，选择你想向客户端提供的所有表。一些常用的表及其内容包括：\n    - `passwd`：存储在\
  \ `/etc/passwd` 文件中的 UNIX 用户。通常包含密码，而不是存储在独立的 shadow 表中。\n    - `group`：通常位于 `/etc/group`\
  \ 文件中的 UNIX 组。\n    - `hosts`：位于 `/etc/hosts` 文件中的主机和 IP 地址。虽然 NIS 可用于存储和查找主机名及地址，但通常设置\
  \ DNS 服务器更好。\n    - `shadow`：额外的用户信息，包括密码。如果选择了此表和 `passwd`，取决于你的 NIS Makefile 配置，你可能编辑扩展的用户信息，例如过期和警告日期。\n\
  \    - `netgrp`：网络组，即主机组。这些在通过 NFS 导出目录时可以使用，如第 6 章所述。\n- 如果你的网络将拥有从服务器，建议将`Push\
  \ updates to slaves?（向从服务器推送到更新?）``选项设置为`Yes（是）`。这样每当对 NIS 表进行更改时，所有从服务器都会立即收到通知以保持同步。\n\
  \n\n\n\n将任何从服务器的 IP 地址（用空格分隔）输入到 `Slave servers` 字段中。\n\n在 `Master NIS files` 部分，你可以选择哪些文件将作为\
  \ NIS 表的源。通常默认情况下，将使用 `/etc` 下的普通用户、组、主机和其他配置文件，例如 `/etc/passwd`、`/etc/group` 和\
  \ `/etc/hosts`。然而，这并不是一个好主意，相反，你应该将服务器使用的表文件更改为 `/var/yp` 目录下的类似文件名，例如 `/var/yp/passwd`\
  \ 和 `/var/yp/group`。一旦服务器运行，它可以被配置为自身的客户端之一，从而通过 NIS 访问这些文件中的任何记录，而不是在本地访问。\n\n\
  完成后，点击 `Save and Apply` 按钮。NIS 服务器将在你的系统上启动，并配置为将来在开机时启动。\n\n现在服务器正在运行，你可以通过将其他系统配置为所选域的\
  \ NIS 客户端来测试它。你可以随时通过重复相同的步骤来更改表单上的服务器设置，这些设置将立即生效。\n\n要关闭你的 NIS 服务器，请遵循以下步骤：\n\n\
  1. 确保任何客户端不再将你的系统作为服务器，可以通过完全在它们上关闭 NIS，或者让它们使用不同的服务器。\n2. 在模块的主页上，点击 `NIS Server`\
  \ 图标进入服务器选项表单。\n3. 将 `Enable NIS server?` 字段设置为 `No`。\n4. 点击 `Save and Apply` 按钮。你系统上的服务器进程将被关闭，并防止它们在将来的开机时启动。\n\
  \n### 17.4 编辑 NIS 表\n\n一旦你的系统作为 NIS 主服务器运行，你就可以使用此 Webmin 模块编辑它所提供的表中的记录。要查看可编辑的表，点击\
  \ `NIS Tables` 图标，这将带你进入一个包含所有表菜单并显示其中一个内容的页面。可以通过从列表中选择其中一个并点击 `Edit NIS table`\
  \ 按钮来显示其他表。\n\n对于大多数表类型，Webmin 将解析其文件内容并将其作为表格显示在页面上，每行一条记录。你可以通过点击第一列中的名称来编辑任何记录，或通过点击\
  \ `Add a new record` 链接添加新记录。然而，某些表的格式是 Webmin 未知的，因此它们将作为原始文本显示在文本框中。如果你知道正确的格式，可以手动编辑表并使用\
  \ `Save and Apply` 按钮保存。如果你更喜欢处理原始文本，也可以点击 `Edit table manually` 链接将任何表切换到手动模式。\n\
  \n每个记录中存在的字段以及编辑它们的表单对于每种类型的表都是不同的。下面的说明解释了如何在几个常用表中添加、删除和修改记录。一个共同点是，任何更改都会导致 NIS\
  \ 表从更改的源文件自动重新构建，并在配置了相应设置的情况下推送到从属服务器上。\n\n要为 NIS 客户端创建一个新的 UNIX 用户，请遵循以下步骤：\n\n\
  1. 从菜单中选择 `UNIX users` 表并点击 `Edit NIS table` 按钮。\n2. 点击现有用户表上方或下方的 `Add a new record`\
  \ 链接，这将带你进入用户创建表单。\n3. 在 `Username` 字段中输入用户名，并在 `User ID` 字段中输入新用户 ID 号。与 `Users\
  \ and Groups` 模块不同，`ID` 不会自动为你选择，因此请确保它是唯一的。\n4. 在 `Real name` 字段中输入用户的全名。\n5. 在\
  \ `Home directory` 字段中输入主目录。与 `Users and Groups` 模块不同，这不会为你创建，文件也不会被复制进去。\n6. 从\
  \ `Shell` 菜单中选择 shell，或选择 `Other` 选项并在下方字段中输入 shell 程序的路径。\n7. 在 `Password` 字段处选择\
  \ `Normal` 密码选项，并在旁边的文本字段中输入新用户的密码。\n8. 在 `Primary group ID` 字段中输入用户组的数字 ID。\n9.\
  \ 如果启用了 shadow NIS 表，你可以设置可选的 `Expiry date`、`Minimum days`、`Maximum days`、`Warning\
  \ days` 和 `Inactive days` 字段。这些字段含义与第 4 章涵盖的 `Users and Groups` 模块中的相同。\n10. 完成后，点击\
  \ `Create` 按钮将新用户添加到表中。\n\n可以通过点击表中的名称来编辑现有的 UNIX 用户，这将带你进入一个具有上述上述相同字段的编辑表单。更改任何字段并点击\
  \ `Save` 按钮，或者点击表单底部的 `Delete` 按钮来删除用户。删除用户时，用户的主目录不会受到影响，因此你可能需要手动删除它。\n\n要在 NIS\
  \ 中创建一个新的 UNIX 组，过程如下：\n\n1. 从菜单中选择 `UNIX groups` 表并点击 `Edit NIS table` 按钮。\n2.\
  \ 点击现有组表上方或下方的 `Add a new record` 链接，这将带你进入用户创建表单。\n3. 在 `Group name` 字段中输入新组名称，并在\
  \ `Group ID` 字段中输入数字 ID。确保 `ID` 未被任何其他现有组使用。\n4. `Password` 字段可以留空，因为组密码几乎从不使用。\n\
  5. 在 `Group members` 字段中填充组组成员的用户名，每行一个。\n6. 完成后，点击 `Create` 按钮将新组添加到表中。\n\n与用户一样，你可以随时点击表中的名称来编辑组，这将带你进入编辑表单。进行你需要的任何更改并点击\
  \ `Save` 按钮保存，或使用 `Delete` 按钮删除该组。请注意，系统不会检查该组是否为任何现有用户的主组。\n\n正如编辑用户和组的说明所示，编辑任何支持的表的过程非常相似。目前，你可以使用\
  \ Webmin 中的表编辑 `UNIX users`、`UNIX groups`、`Host addresses`、`Networks`、`Services`、`Protocols`、`Netgroups`、`Ethernet\
  \ addresses`、`RPC programs`、`Netmasks` 和 `Aliases`。所有其他表必须手动编辑。\n\n### 17.5 安全你的\
  \ NIS 服务器\n\n默认情况下，NIS 服务器允许任何客户端连接并查询表，只要客户端知道域名。如果你的系统连接到互联网，攻击者可能会猜测 NIS 域并请求所有\
  \ NIS 用户列表。即使它们的密码是以加密格式存储的，仍然可能通过对密码加密进行暴力攻击发现明显的或字典密码。\n\n因此，将连接到服务器的客户端地址限制为确实是客户端的\
  \ UNIX 系统是明智的。要进行设置，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `Server Security` 图标，这将带你进入图 17.3\
  \ 所示的表单。\n\n##### 图 17.3. 服务器安全表单。\n\n![](img/17fig03.jpg)\n\n`Allowed clients`\
  \ 表控制哪些客户端允许连接。你可以修改任何现有条目，或使用底部的空行添加新条目。要添加多行，你必须逐个添加，每次添加后保存并打开表单。\n\n- 要授予单个主机访问权限，在\
  \ `Netmask` 列下选择 `Single host`，并在 `Network/host address` 下输入其 IP 地址。\n- 要授予整个 IP\
  \ 网络访问权限，选择 `Netmask` 并在相邻字段中输入子网掩码（如 `255.255.255.0`），在 `Network/host address`\
  \ 列下输入网络地址。\n- 要授予所有客户端访问权限，只需在 `Netmask` 列下选择 `Any host` 选项。\n\n完成后，点击 `Save and\
  \ Apply` 按钮。新的限制将立即生效，你将被返回模块的主页。\n\n\n\n\n仅允许你自己网络上的客户端连接并拒绝所有其他连接，这是一个好主意。更安全的替代方案是仅允许那些你已知是\
  \ NIS 客户端的系统，假设它们具有固定的 IP 地址且不经常更改。\n\n即使你将访问限制在受信任的客户端系统上，通过 `SSH` 或 `telnet` 登录这些系统的用户可能仍然能够获取所有\
  \ NIS 用户及其加密密码的列表。为了防止这种情况，可以配置服务器，仅允许使用受信任端口的客户端访问表中的某些表或字段。因为在 UNIX 系统上，只有 `root`\
  \ 用户可以创建端口号低于 1024 的 TCP 或 `UDP` 套接字，因此这些低端口被认为是受信任的，且对于普通用户是安全的。\n\n还可以防止某些客户端访问某些\
  \ NIS 表，但仍允许它们访问其他表。例如，你可能希望让所有客户端系统访问 `Hosts` 地址表，但只让极少数受信任的系统拥有访问 `UNIX users`\
  \ 表的权限。\n\n要限制对服务器上访问的访问，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `Server Security`（服务器安全）图标进入进入\
  \ 17.3 图所示的表单。\n2. `Client map restrictions`（客户端映射限制）表控制哪些客户端系统可以访问哪些 NIS 表以及这些系统上的谁可以访问它们。每行都指定了一个适用于某些或所有客户端的规则，可以允许访问、完全阻止访问或过滤查询的表。这些字段及其含义如下：\n\
  \    - **Hosts**：此限制所适用的 IP 地址或部分 IP 地址（如 `*192.168.1.*`）。输入 `*` 将使该限制适用于所有客户端。\n\
  \    - **NIS tables**：选择 `All`（全部）选项以使限制适用于所有表，或者输入单个表名。在内部，NIS 服务器会在表名后附加类似 `.byname`\
  \ 或 `.byuid` 的内容，以指示它们是根据什么索引的。你输入的表名必须使用此内部名称，例如 `passwd.byuid` 或 `hosts.byaddr`。\n\
  \    - **Restriction**：此字段控制当客户端请求匹配时服务器执行的操作。选择 `None`（无）允许请求，选择 `Deny access`（拒绝访问）完全阻止，或选择\
  \ `Trusted port`（受信任端口）在客户端使用不受信任端口时进行阻止。\n    - **Mangle field**：如果使用 `Trusted\
  \ port` 限制，你可以使用此选项从客户端处仅隐藏请求表中的单个字段。选择 `None` 将完全阻止对表的访问，但输入字段编号将导致其内容被替换为 `x`。此选项唯一的实际用途是隐藏\
  \ `passwd.byname`、`passwd.byuid` 或 `shadow.byname` 表中的密码，这些密码位于第 2 字段。\n3. 使用表格底部的空行添加新限制。要添加多个限制，你将需要多次保存并重新打开表单。\n\
  4. 当客户端请求一个表时，NIS 服务器将找到表中匹配的第一行并使用定义的限制。由于由于这个原因，你必须确保你添加的任何新行都位于授予所有客户端和表访问权限的行之前（该行通常默认存在）。\n\
  5. 完成后，点击 `Save and Apply`（保存并应用）按钮。浏览器将返回模块主页，任何限制的更改将立即生效。\n\n`Client map restrictions`\
  \ 表最有用的用法是为 `passwd.byname` 表中的所有客户端添加一行，将限制设置为 `Trusted port`并将 `Mangle field`\
  \ 选项设置为 `2`。然后为 `passwd.byuid` 表添加另一行，所有其他选项相同。这将防止非 root 用户查看加密密码，同时仍允许以 `root`\
  \ 运行的程序（例如 `telnet` 或 `SSH` 服务器）访问。\n\n如果你正在使用单独的 `shadow` 表存储密码和过期信息，则限制应该在 `shadow.byname`\
  \ 表上。在许多 Linux 发行版中，默认存在此类限制。\n\n### 17.6 设置 NIS 从用服务器\n\n从用 NIS 服务器的使用方法与辅助 DNS\
  \ 服务器类似，它们保留了主服务器持有的表副本，当主服务器故障或响应缓慢时，客户端可以使用它们。如果你在一个具有通过慢速链路连接的多个局域网的型型网络上使用 NIS，那么在每个局域网上放置一个从用服务器可能也有意义，这样客户端就可以使用它代替主服务器。\n\
  \n在 `OpenLinux` 上，无法使用 Webmin 设置从用服务器，因为该发行版使用了独特的 NIS 配置文件。在所有其他版本的 Linux 上，将系统设置为从用服务器的步骤如下：\n\
  \n1. 在模块的主页上，点击 `NIS Server` 图标。这将带你进入 17.2 图所示的服务器配置表单。\n2. 将 `Enable NIS server?`（启用\
  \ NIS 服务器？）设置为 `Yes`（是）。\n3. 在 `NIS domain`字段中输入主服务器的域名。\n4. 将 `Server type`（服务器类型）更改为\
  \ `Slave of server`（从服务器），并在相邻字段输入主服务器的 IP 地址。不需要触摸其他字段，因为它们都与运行主服务器有关。\n5. 点击 `Save\
  \ and Apply` 按钮。服务器应立即启动，并配置为启动时启动。\n\n确保主服务器已经在服务器配置表单的 `Slave servers`字段中输入了此从用服务器的地址。它还应该启用\
  \ `Push updates to slave servers?`（向从用服务器推送更新？）选项，这样对表的任何更改将立即发送到从用服务器。如果没有，你可以使用\
  \ `yppush` 命令将 NIS 表的内容发送到某些或所有从用服务器。\n\n### 17.7 配置 NIS 客户端和服务器模块\n\n该模块有几个配置选项，可以通过点击主页左上角的\
  \ `Module Config`（模块配置）链接来更改。表 17.1 显示了你可以安全更改的选项。\n\n模块页面上的其他选项根据你的操作系统自动设置的，通常不需要更改。\n\
  \n### 17.8 Solaris 上的 NIS\n\nWebmin 允许你配置 NIS 的唯一另一个操作系统是 Sun 的 Solaris。在 Solaris\
  \ 上，NIS Client 和 Client Services 页面与 Linux 上的相同，工作方式相同。然而，NIS Server 和 Server Security\
  \ 表单略有不同：\n\n#### 表 17.1 模块配置选项\n\n- **Maximum number of records to display**（显示记录的最大数）：如果\
  \ NIS 表中的记录数超过此数字，则 NIS Tables 页面将显示所有记录。相反，它将显示一个根据字段和搜索查找记录的搜索表。\n- **Automatically\
  \ rebuild NIS maps?**（自动重建 NIS 映射？）：通常，每当你在表文件中添加、更新或删除记录时，都会运行 NIS Makefile 来重建所有表。由于这在具有许多记录或从用服务器的系统上可能很慢，将此选项设置为\
  \ `No` 将关闭自动重建。相反，你可以通过点击 NIS Tables 页面上标记为 Rebuild NIS tables 的按钮来随时强制进行构建。\n\n\
  在 NIS Server 页面上，你输入的任何域名也将用于 NIS 客户端。这是 Solaris 的局限性，不像 Linux，系统可以作为一个域的服务器和另一个域的客户端。\n\
  \n在服务器页面上，你不能直接指定单个表文件的路径。相反，`NIS source files directory` 和 `NIS password source\
  \ files directory` 字段控制它们存储的目录，通常为 `/var/yp`。\n\nServer Security 页面上没有 `Client map\
  \ restrictions` 表，因此无法控制客户端可以请求哪些表和字段。然而，你仍然可以使用 `Allow clients` 表完全允许或拒绝某些主机和网络。\n\
  \nSolaris 系统标准包含对 NIS+ 的客户端和服务器支持。然而，由于 Webmin 不支持该协议，尝试使用此模块重新配置已运行作为 NIS+ 客户端或服务器的系统将无法运行，甚至可能对其配置产生问题。\n\
  \n### 17.9 总结\n\n\n\n\n\nNIS 是 UNIX 系统之间共享用户、组及其他信息的标准方法，本章已经解释了如何使用 Webmin 进行设置和配置。完成此部分后，你应该知道如何让你的系统成为网络上现有\
  \ NIS 服务器的客户端。你还应该理解如何运行自己的主 NIS 服务器来为其他客户端提供服务，以及如何设置一个从服务器作为主服务器的备份。\n\n# 第 18\
  \ 章. PPP 服务器配置\n\n本章涵盖了将一个连接了调制解调器的 Linux 系统设置为拨号服务器的过程，以便其他计算机可以拨入该系统并访问已连接的网络。\n\
  \n### 18.1 Linux 上的 PPP 简介\n\n任何连接了调制解调器的 Linux 系统都可以配置为允许其他计算机拨入，并启动 PPP 会话，从而让它们获得对系统及其所连接的任何网络的\
  \ TCP/IP 访问权限。这使得它可以像一个微型 ISP，事实上，一些小型 ISP 正在使用带有多个串口网卡的 Linux 系统作为接入服务器进行运行。\n\n\
  有两个不同的程序负责拨号服务的不同部分。第一个是 `mgetty`，它通过串口与连接的调制解调器通信，并指令其接听电话。一旦服务器和客户端调制解调器连接，`mgetty`\
  \ 会显示文本登录提示符，并等待用户名或 PPP 会话的启动。客户端可以使用文本模式登录并获取 UNIX shell 提示符，而无需启动 PPP 会话，但这在现在很少这样做。一旦客户端断开连接或注销，`mgetty`\
  \ 会挂断调制解调器并等待新连接。\n\n由于大多数客户端在连接后会立即启动 PPP 会话，因此 `mgetty` 通常配置为在检测到 PPP 连接时运行独立的\
  \ `pppd` 程序。这会在服务器上创建一个 `ppp` 网络接口，验证客户端身份，分配 IP 地址，并开始使用 PPP 协议发送和接收数据。分配的 IP 地址和其他配置选项通常是按串口设置的，这样你就可以拥有多个调制解调器并支持多个具有不同地址的并发客户端。\n\
  \nPPP 拨号服务器模块允许你设置 `mgetty` 和 `ppd`，以便客户端拨入并启动 PPP 会话。当你从“网络”(Networking)类别进入它时，主页面仅显示四个图标，图标下方是实际的可配置选项。\n\
  \n目前，PPP 拨号服务器模块仅可用于 Linux 和 Solaris 系统，尽管 `mgetty` 在某些其他 UNIX 版本上可用。如果它配置的两个程序都没有安装，主页面将显示错误信息；然而，所有\
  \ Linux 发行版的 CD 或网站上都包含了 `pppd` 和 `mgetty` 的包。如果只安装了 `mgetty`，你可以使用“串口配置”和“来电显示访问”功能。反之，如果只安装了\
  \ `pppd`，你只能访问“PPP 选项”和“PPP 账户”页面。\n\n当你使用该模块设置 `mgetty` 在串口上接听时，`/etc/inittab`\
  \ 文件将添加一个条目，以便 `init` 在启动时运行 `mgetty` 进程并在需要时重新运行。你可以在“SysV Init 配置”模块（第 9 章介绍）中看到此条目，但除非你知道自己在做什么，否则不应在那里进行编辑。\n\
  \n尽管本章是针对 Linux 设计的，但该模块在 Solaris 上的行为几乎相同。唯一的区别是串口设备文件的名称，Linux 上的第一个串口是 `/dev/ttyS0`，而\
  \ Solaris 则会使用 `/dev/term/a`。\n\n### 18.2 配置 PPP 服务器\n\n在设置系统允许客户端通过 PPP 连接之前，它必须在串口上连接了调制解调器，或者通过空调制线（null-modem\
  \ cable）连接到另一台机器。也可以模拟串口的内部调制解调器，但不建议这样做，因为它们没有易可见的 LED 来指示调制解调器是否连接、传输等。只要内核识别，USB\
  \ 调制解调器应该可以工作，但它们可能会使用特殊的设备文件。需要特殊驱动程序运行（通常称为 Winmodems）调制解调器完全无法使用，除非有适用于 Linux\
  \ 的驱动。\n\n自然，任何调制解调器必须连接到电话线。由于你的系统将被配置为在几响后接听电话，否则电话线不应用于其他用途，否则语音用户的电话会被调制解调器接听，这并不友好。\n\
  \n一旦所有硬件准备就绪，将你的系统设置为 PPP 服务器的步骤如下：\n\n1. 在模块的主页上，点击“串口配置”(Serial Port Configuration)图标。这将带你进入列出任何已配置\
  \ PPP 或语音邮箱端口的页面。\n2. 点击“添加新串口”(Add a new serial port)链接，这将弹出图 18.1 所示的端口配置表。\n\n\
  #### 图 18.1. 串口配置表。\n\n![](img/18fig01.jpg)\n\n3. 将 `Serial`设备设置为你的调制解调器或空调制线连接的端口。串口\
  \ 1 对应设备文件 `/dev/ttyS0`，依此类推。对于不以 `/dev/ttyS` 开头的串口设备上的调制解调器（如 USB 调制解调器），选择“其他设备选项”并在菜单旁边的文本字段中输入完整的设备文件路径。\n\
  4. 将 `Type`选项设置为“直接连接”（用于通过空调制线连接的系统）或“调制解调器”（Modem，用于真实的拨号调制解调器）。\n5. `Port speed`端口速度）字段应设置为调制解调器或空调制连接使用的波特率。这必须是标准速度之一，例如\
  \ 57600 或 33600。\n6. 在 `Answer after`响铃后）字段中，输入你希望 `mgetty` 在接听电话前等待的响铃次数。如果你的调制解调器所在的电话线也用于接收语音通话，你可以将其设置为较大的值（如\
  \ 20），以便留出足够的时间在调制解调器之前接听电话。\n7. 自然，此选项对于空调制连接没有意义。\n8. 点击“创建”(Create)按钮。`/etc/inittab`\
  \ 文件将添加一个新条目，你将被返回串口列表。\n9. 点击“应用配置”(Apply Configuration)在新的端口上激活 `mgetty`。现在，拨入调制解调器所在线路的电话应该在配置的响铃次数后接听。\n\
  \n如果你只关心文本客户端，则不需要进行任何其他操作——它们将能够拨号、在登录提示处身份验证并执行 shell 命令。\n\n要设置 PPP，点击主页上的“PPP\
  \ 选项”(PPP Options)图标。这将带你进入图 18.2 所示的表单，你可以在那里设置适用于所有 PPP 连接的选项。\n\n#### 图 18.2.\
  \ PPP 配置表。\n\n![](img/18fig02.jpg)\n\n除非让客户端使用文本模式登录并手动启动 `pppd` 命令，否则最好将“在串口上自动检测\
  \ PPP 连接？”(Automatically detect PPP connections on serial ports?)选项设置为“是”。启用此项后，`mgetty`\
  \ 在等待登录提示时会检测到客户端想要启动 PPP 会话，并自动运行 `pppd`。\n\n在 `PPP IP Address`字段中，输入你希望服务器端连接使用的\
  \ IP 地址（`Local IP`）以及客户端连接端的地址（`Remote IP`）。通常这些地址不在你的本地局域网上，而是在不同的子网上。网络上的其他系统应配置为将客户端地址的流量路由到你的系统，以便它们能够通信。\n\
  \n如果没有指定地址，则 PPP 服务器将使用客户端提供的任何地址。这在通过空调制线连接两台机器时可能是合理的，但对于大多数拨号客户端来说不起作用。\n\n\n\
  \n\n\n通过开启 `Create proxy ARP entry?` 选项，可以为客户端分配局域网（LAN）范围内的 IP 地址。如果启用此项，请在 `Remote\
  \ IP` 字段输入一个未使用的 LAN IP 地址，并在 `Local IP` 字段输入系统当前的以太网 IP。\n\n将 `Control lines mode`\
  \ 字段设置为 `Local` 以进行空调制连接，或者如果串口上连接了真实的调制调器，则设置为 `Modem`。\n\n除非您正在设置空调制连接，否则应强制客户端进行身份验证，以防止潜在的攻击者连接。要启用身份验证，请将\
  \ `Require authentication?` 字段设置为 Yes。若要在空调制中使用完全关闭，请将该字段设置为 `No`。\n\n要设置客户端身份验证的用户名和密码，请参见第\
  \ 18.3 节“管理 PPP ”。\n\n要断开长时间空闲的客户端，请在 `Idle time before disconnect` 字段输入秒数。\n\n\
  将网络中任何 DNS 服务器的 IP 地址输入 `DNS servers for clients` 字段。Windows 等客户端操作系统会自动使用它们，这简化了它们的配置。\n\
  \n最后，点击 `Save` 按钮。客户端现在应该能够拨号、建立 PPP 会话并访问您的系统和网络。\n\n如果您的系统将有多个 PPP 客户端同时连接，您需要为每个串口设置不同的选项。特别是，每个客户端必须具有不同的远程\
  \ IP 地址，尽管本地地址可以重用。\n\n为每个串口设置不同 PPP 选项的步骤如下：\n\n1. 在模块的主页上，点击 `PPP Options` 图标。将\
  \ `PPP IP Addresses` 字段改回 `From client`，并将您想要按端口设置的任何其他选项也改回它们的默认值。\n2. 返回主页，点击\
  \ `Serial Port Configuration`，然后点击您想要设置选项的串口对应的 `Port PPP Config` 下的 `Edit` 链接。这将带您进入每个端口的选项页面，该页面与图\
  \ 18.2 所示的全局 PPP 选项表非常相似。\n3. 输入您希望分配在此端口连接的 PPP 客户端的远程和本地 IP 地址，并更改全局 PPP 选项页面未设置的任何选项。\n\
  4. 完成后，点击 `Save` 按钮。从现在起，连接到配置端口的客户端将使用新选项。\n\n停止系统充当 PPP 服务器的最简单方法是直接删除调制调器的串口配置条目。如果您连接了多个调制调器，可以使用以下步骤禁用其中一个而不影响其他：\n\
  \n1. 在主页上，点击 `Serial Port Configuration`，然后点击连接调制调器的端口设备名称。\n2. 在端口选项页面上，点击右下角的\
  \ `Delete` 按钮。相应的条目将从 `/etc/inittab` 文件中删除，您将返回到已启用端口的列表。\n3. 点击 `Apply Configuration`\
  \ 按钮使更改生效。从现在起，您的系统将不再响应入入电话，也不会与通过空调制线连接的另一台计算机进行通信。\n\n### 18.3 管理 PPP 账户\n\n\
  如果您启用了对系统的拨号访问，应通过开启 PPP Options 页面上的 `Require authentication?` 选项来强制所有客户端进行身份验证。即使您认为服务器不需要验证客户端（因为只有您才知道调制调器所在线路的电话），但启用它仍然是一个好主意，以防有人偶然发现号码，或者尝试拨打数百个电话寻找不安全服务器的“拨号器”发现它。\n\
  \n一旦启用身份验证，可以按照以下步骤添加允许登录的新账户：\n\n1. 在模块的主页上，点击 `PPP Accounts` 图标。这将带您进入列出所有现有账户的页面，包括为拨向其他服务器而创建的账户。\n\
  2. 点击 `Create a new PPP account` 链接，这将带您进入图 18.3 所示的账户创建表。\n\n##### 图 18.3. 创建新的\
  \ PPP 账户。\n\n![](img/18fig03.jpg)\n\n- 在 `Username` 字段输入登录名称，并确保没有选中 `Any` 选项。\n\
  - 确保 `Server` 字段设置为 `Any`。如果您将其设置为其他内容，则只有当客户端的主机名与您输入的匹配时，用户名才会被接受。\n- 在 `Password`\
  \ 字段中选择 `Set` 选项，并在旁边的文本框为账户输入密码。也可以通过选择 `From file` 选项并在文本框输入文件名，让 PPP 服务器从单独的文件读取密码。或者可以通过选择\
  \ `None` 来消除提供密码的需求，但从安全角度来看，这不是一个好主意。\n- 假设所有客户端都分配了 IP 地址，将 `Valid Addresses`\
  \ 字段设置为 `Allow any`。然而，如果 PPP Options 页面未指定地址，您可能希望选择 `Allow listed` 并在下方的文本框输入允许的地址。\n\
  - 最后，点击 `Save` 按钮将创建新的 PPP 账户。连接的客户端可以立即使用。\n\n要编辑现有的 PPP 账户，只需从账户列表中点击其用户名。这将带您进入账户编辑表，该表与图\
  \ 18.3 所示的创建表几乎相同。更改用户名、密码或任何其他选项，并点击 `Save` 按钮保存更改并使其立即生效。或者点击编辑表上的 `Delete` 按钮来删除该账户。\n\
  \n默认情况下，Webmin 将新用户添加到 `/etc/ppp/pap-secrets` 文件中。PPP 服务器仅在执行 PAP 身份验证（默认使用）时会读取此文件。如果您手动配置系统使用更安全的\
  \ CHAP 协议来验证客户端，则需要配置 Webmin 来编辑 `chap-secrets` 文件。这可以通过点击主页左上角的 `Module Config`\
  \ 链接并将 `PAP secrets file` 字段更改为 `/etc/ppp/chap-secrets` 来。\n\n### 18.4 通过主叫 ID 限制访问\n\
  \n如果您的电话线启用了主叫 ID 且您的调制调器支持它，可以配置 mgetty 根据电话号码拦截某些拨号者。默认允许任何拨号者连接，但您可以通过以下步骤更改为仅允许少数号码：\n\
  \n1. 在模块的主页上，点击 `Caller ID Access` 图标。这将带您进入列出受限号码的表，如果您尚未添加任何号码，该表可能是空的。\n2. 点击\
  \ `Add a new caller ID number` 链接，这将带您进入输入新号码的表。\n3. 将 `Phone number` 选项设置为 `Numbers\
  \ starting with`，并在旁边的字段中输入您想要允许的部分或完整电话号码。如果您输入类似 `555` 的内容，任何以 `555` 开头的电话号码（如\
  \ `555-1234`）都将被允许。\n4. 将 `Action` 字段设置为 `Allow`。\n5. 点击 `Create` 按钮，这将保存号码并返回到允许和拒绝的号码列表。\n\
  \n要添加另一个允许的号码，请重复步骤 2 到 5。\n\n最后，再次点击 `Add a new caller ID number`，并在创建表中将 `Phone\
  \ number` 设置为 `All numbers`并将 `Action` 设置为 `Deny`。\n\n点击 `Create` 按钮将此最终拒绝条目添加到列表中。从现在起，只有您显式允许的电话号码才能连接。\n\
  \n\n\n\n由于系统按顺序检查列表中的每个条目，并在找到匹配项时停止，因此任何拒绝（或允许）所有调用者的条目必须出现在列表的底部，否则其其后的条目将永远不会被处理。如果你在将来想允许一个新的电话号码，你必须先添加它，然后使用\
  \ `Move` 列中的箭头将其移动到拒绝所有人的最后一个条目之上。\n\n由于某些客户端可能不提供主叫 ID 信息，可以使用 `Phone number` 字段的\
  \ `Unknown` 选项来匹配它们的来电。然而，允许所有未知来电者并不是阻止已知攻击者的好方法，因为他们可能只需在电话线路上禁用发送主叫 ID 信息的功能。\n\
  \n主叫 ID 限制绝不应该是你拨入服务器的唯一安全形式，因为电话号码是由电信公司提供的，因此并非完全受你控制。还应该启用 `PPP` 身份验证，以便强制所有客户端登录。\n\
  \n### 18.5 模块访问控制\n\n与其他模块一样，该模块有可以在 `Webmin Users` 模块中设置的选项，以控制哪些功能可用。这些选项对于禁用在特定系统上无用的模块部分非常有用，例如，你可能希望某个用户只能看到\
  \ `PPP Accounts` 页面。\n\n要编辑此模块中某个用户或组的访问控制选项，请遵循以下步骤：\n\n在 `Webmin Users` 模块中，点击已授予该模块权限的用户旁的\
  \ `PPP Dialin Server`。\n\n对于 `Available pages` 字段，取消勾选模块主页上你不希望用户访问的图标。如果取消勾选了 `PPP\
  \ Options`，用户将无法编辑适用于单个串口的选项。\n\n如果用户仅被授予了单个页面的访问权限，将 `Go direct to one page?` 字段设置为\
  \ `Yes` 将导致浏览器在进入模块时直接跳转到该页面。\n\n点击 `Save` 按钮使访问控制设置生效。\n\n### 18.6 总结\n\n读完本章后，你将能够将任何连接了调制调器的\
  \ Linux 系统设置为拨入服务器，`PPP` 客户端可以连接到该服务器。你应该理解这样做的安全性影响，以及如何将访问限制在仅信任的系统。你还应该知道这种拨号连接如何与你的网络其他部分配合，以及如何从网络其他部分访问它。\n\
  \n## 第 19 章 防火墙配置\n\n如果你的系统连接到互联网，应该使用防火墙进行保护以防止未经的访问。本章涵盖了使用 `Webmin` 和 `IPtables`\
  \ 设置和配置防火墙的过程。\n\n### 19.1 IPtables 防火墙简介\n\n防火墙是一种保护自身以及网络上其他主机免受不可信任网络（如互联网）攻击攻击的系统。它可以根据各种标准（如源地址、目的地址、端口和协议）阻止数据包和连接。通常防火墙也是路由器，在安全的本地局域网和不可信任的互联网之间转发数据包；然而，系统也可以仅保护自身。\n\
  \n防火墙系统还可以配置为将多个主机隐藏在单个 IP 地址之后，这一过程被称为 `NAT`（网络地址翻译）。通常，隐藏的主机位于使用私有 IP 网络（如 `192.168.0.0`）的内部局域网，防火墙拥有唯一的互联网\
  \ IP 地址。`NAT` 允许这些内部主机与互联网上的其他通信，即使它们没有真实的公共 IP 地址。\n\n多年来，Linux 内核包含了不同的防火墙实现，例如\
  \ `IPfwadm` 和 `IPchains`。2.4 系列内核包含了 `IPtables` 防火墙，它比之前的版本更强大且灵活。所有使用 2.4 内核的 Linux\
  \ 发行版都启用了 `IPtables` 支持，并包含了配置所需的命令。本章和 `Linux Firewall` 模块仅涵盖使用 `IPtables` 设置防火墙，而不包含任何旧的实现（如\
  \ `IPchains` 或 `IPfwadm`）。\n\n所有的 IP 网络流量都会被分成数据包，数据包是带有源、目和协议信息的数据块。即使是下载大文件之类的连续数据流，在发送时也会被分成数据包，并在目的地处重组。由于\
  \ `IPtables` 防火墙工作在 IP 层，它的所有规则和链都是对单个数据包进行评估和操作的，而不是 TCP 连接或 HTTP 请求。\n\n`IPtables`\
  \ 防火墙由三种不同的对象组成：表（tables）、链（chains）和规则（rules）。三个表中的每个表包含两个三个标准链，可能包含许多用户定义的自定义链。每个链包含零或多个规则，这些规则应用于防火墙接收或发出的数据包，以决定它们的命运。这三个表及其标准链为：\n\
  \n- **数据包过滤 (filter)**：此表中的 `INPUT`、`OUTPUT` 和 `FORWARD` 数据包链分别适用于防火墙接收、发送或转发的数据包。如果防火墙系统充当路由器，则只有\
  \ `FORWARD` 链适用于被路由的数据包。目标为系统自身的网络流量由 `INPUT` 链处理，本地进程发送的流量由 `OUTPUT` 链处理。\n\n对于作为普通路由器且不进行任何伪装的系统，或者只需要防火墙保护自身的系统，这是唯一需要添加规则的表。\n\
  \n- **网络地址翻译 (nat)**：此表仅用于启动新连接的数据包。由于其 `PREROUTING` 链中的规则在数据包被系统接收用于路由时立即应用，`POSTROUTING`\
  \ 链则用于路由后即将离开的数据包。`OUTPUT` 链规则应用于本地生成的数据包以便在路由之前进行修改。\n\n通常向此表添加规则以设置伪装、透明代理或其他其他形式的地址翻译。\n\
  \n- **数据包修改 (mangle)**：此表仅用于特殊的数据包修改。它包含两个链：用于在路由前修改数据包的 `PREROUTING` 和用于修改本地生成数据包的\
  \ `OUTPUT`。\n\n此表在典型的防火墙配置中很少使用。\n\n当网络数据包被链处理时，链中的每条规则按顺序执行。每条规则都有一组条件来决定规则是否匹配，以及在匹配时采取的动作。此动作可能是立即接受数据包、立即丢弃它、执行某些修改或继续执行。如果到达链的末尾，将采取其默认动作，通常是允许数据包通过。\n\
  \n图 19.1 显示了数据包通过的表和链以及检查它们的顺序。从网络进入的数据包从图顶部进入，并被 `PREROUTING` 链处理。此时，将做出决策——目标为本地系统的数据包进入左侧，而转发到其他其他地的数据包进入右侧分支。进入左侧的数据包在交付给本地进程（如服务器）之前由\
  \ `incoming packets` 链处理。转发的数据在发送到目的地之前，由 `Forwarded packets` 和 `After routing`\
  \ 链处理。\n\n##### 图 19.1.IPtables 概述\n\n![](img/19fig01.gif)\n\n防火墙还可以影响由本地系统进程发送的数据包。这些数据包在通过适当的网络接口传输到目的地之前，会经过三个\
  \ `Output` 链和 `After routing` 链的检查。这意味着 `IPtables` 防火墙可以限制本地进程可以连接的地址以及它们可以使用的协议。\n\
  \n\n\n\n\n### 19.2 Linux 防火墙模块\n\n此模块用于在启用了 `IPtables` 的 Linux 系统上设置防火墙，或编辑现有防火墙的任何部分。它将防火墙配置存储在由\
  \ `iptables-save` 和 `iptables-restore` 命令创建并读取的保存文件中，而不是包含对 `iptables` 命令调用的 shell\
  \ 脚本中。Red Hat、Debian 和 Gentoo Linux 都使用此类保存文件作为标准，Webmin 能够识别并与其配合工作。\n\n如果您使用 shell\
  \ 脚本手动创建了防火墙，并想从现在开始使用此模块对其进行编辑，则它必须转换为 `IPtables` 保存文件，Webmin 才能对其进行编辑。幸运的是，该模块可以自动为您完成这一操作，您只需要停止自定义脚本在启动时运行，并告诉该模块创建它自己的防火墙设置脚本即可。\n\
  \n这也适用于由 YaST 或 fBuilder 等工具创建的防火墙，这些工具会写出 `iptables` 命令的 shell 脚本。除非该工具也能编辑 `IPtables`\
  \ 保存文件（例如 `knetfilter`），否则不应与 Webmin 的 Linux 防火墙模块一起使用，否则它们可能会覆盖对方的设置。\n\n当您从“网络”（Networking）类别进入该模块时，主页面通常会在第一个表格中显示所有包含（通常是数据包过滤）的链和规则，如图\
  \ 19.2 所示。然而，如果 Webmin 检测到未安装 `iptables` 或 `iptables-save` 命令，则将显示错误消息，请检查您的发行版\
  \ CD 或网站，以查找包含这些命令的包。\n\n##### 图 19.2。Linux 防火墙模块。\n\n![](img/19fig02.jpg)\n\n如果这是您第一次使用该模块且系统中尚未设置防火墙，主页面将显示一个简化初始防火墙创建的表单。将显示三个选项，选择一个并点击\
  \ `Setup Firewall` 按钮进行设置。如有必要，Webmin 还会显示 `在启动时启用防火墙？` 复选框，如果选中，将创建一个启动脚本，以便防火墙在启动时被启用。\n\
  \n防火墙设置选项为：\n\n- **允许所有流量**：如果选择此项，防火墙将创建为“空”并允许所有流量通过。\n- **在外部接口上进行网络地址转换**：防火墙将设置为\
  \ `NAT`，使得内部局域网上的主机可以通过具有单个公共 IP 地址的主机访问互联网。您必须从此选项旁边的列表中选择连接到互联网的网络接口，例如 `ppp0`。\n\
  - **在外部接口上阻止所有入站连接**：如果选择此项，防火墙将阻止所有进入所选网络接口的流量，已建立的连接、DNS 回复和无害的 ICMP 包除外。您选择的应该是连接到互联网的接口，例如\
  \ `ppp0`。\n- **在外部接口上阻止 SSH 和 IDENT 以外的所有流量**：与上一个选项类似，但也允许 `SSH` 和 `IDENT` 协议流量。\n\
  - **在接口上阻止 SSH、IDENT、ping 和高端口以外的所有流量**：与上选项类似，但也允许 ICMP ping 和到 1024 以上端口的连接。\n\
  \n如果该模块首次被使用，且 Webmin 检测到系统中已存在防火墙，将显示其规则，并提示您将其转换为保存文件，以便可以使用模块对其进行编辑。如果您点击 `Save\
  \ Firewall Rules` 按钮执行此操作，所有现有的表、链和规则将被安全地记录。如有必要，还会显示一个 `在启动时启用防火墙？` 复选框，如果选中，Webmin\
  \ 将创建一个启动脚本以在启动时激活保存的防火墙规则。\n\n如果您选择转换现有的手动创建的防火墙配置，请务必禁用任何在启动时设置它的现有脚本。否则，旧脚本和\
  \ Webmin 创建的脚本都会运行，可能会导致在此模块中设置的规则被旧的手动配置抵消。\n\n### 19.3 允许和拒绝网络流量\n\n为了限制防火墙接受或转发的连接和数据包类型，您需要创建额外的防火墙规则。这些规则的最佳位置是数据包过滤表，位于\
  \ `Incoming packets`（入站包）或 `Forwarded packets`（转发包）链链中。如果您的防火墙充当路由器，且您想保护其连接的安全网络上的系统，而不是防火墙本身，则应使用\
  \ `Forwarded packets` 链。然而，如果您想同时保护防火墙以及其路由到的其他系统，则应在 `Incoming packets` 链中添加规则。\n\
  \n还可以限制系统发送的数据，这些数据可能来自本地进程或从其他主机转发。为此，您可以向 `Outgoing packets` 链中添加规则。如果需要，这对于限制本地用户可以连接的地址和端口非常有用。\n\
  \n要创建一个新规则来阻止流量，步骤如下：\n\n1. 在模块的主页上，从 `Show IPtable` 按钮旁边的列表中选择 `Packet filtering`，然后点击它切换到过滤表。\n\
  2. 要添加适用于所有入站流量的规则，请点击 `Incoming packets` 部分的 `Add Rule` 按钮。如果您只想限制转发流量，请点击 `Forwarded\
  \ packets` 下方的按钮。\n3. 无论哪种方式，您都将被引导至规则创建表，如图 19.3 所示。\n\n##### 图 19.3。规则创建表单。\n\n\
  ![](img/19fig03.jpg)\n\n4. 将 `Action` 改为 `Drop`，这样匹配规则的数据将被直接丢弃。\n5. 如果需要，在 `Rule\
  \ comment` 字段中输入此规则的简短说明。\n6. 在 `Condition details` 部分，选择决定哪些数据包将被匹配并丢弃的条件。只有匹配所有未设置为\
  \ `<Ignore>` 条件的数据包才会被丢弃。\n\n阻止某些类型流量的条件示例：\n\n- **阻止到特定 TCP 端口的所有连接**：将 `Network\
  \ protocol` 字段设置为 `Equals` 并选择 `TCP`。要阻止端口，必须选择协议。将 `Destination TCP` 或 `UDP port`\
  \ 设置为 `Equals`，并在旁边的 `Port(s)` 字段输入端口号。您可以通过在 `Port(s)` 字段输入逗号分隔的数字列表来阻止多个端口，或通过选择\
  \ `Port range` 并输入起始结束端口来阻止整个范围。\n- **阻止来自特定地址的所有流量**：将 `Source address` 或网络设置为\
  \ `Equals`，并输入要阻止的 IP 地址。您也可以通过输入类似 `130.194.164.0/24` 的网络/前缀对来阻止整个网络。将 `Connection\
  \ state` 设置为 `Does not equal` 并选择 `Existing connection`。这将允许您的系统连接到被阻止的地址，反之亦然。\n\
  - **阻止到特定地址的流量**：将 `Destination address` 或网络设置为 `Equals`，并输入要阻止的 IP 地址或网络。由于这也会阻止被屏蔽的系统连接到您的系统，建议将\
  \ `Connection state` 设置为 `Does not equal` 并从菜单中选择 `Existing connection`。\n\n在所有情况下，将\
  \ `Incoming interface` 设置为连接到互联网的网络接口（例如 `ppp0`）通常是明智的，这样限制就不会适用于来自本地局域网的连接。\n\n\
  完成条件选择后，点击 `Create` 按钮。只要输入无误，您将返回模块主页，新规则将列在其中。\n\n要使新规则生效，点击页面底部的 `Apply Configuration`\
  \ 按钮。\n\n\n\n\n\n每个链中的规则按照从上到下的顺序进行评估，所采取的操作取决于第一个匹配的规则。如果没有规则匹配，则将执行该链的默认操作，通常是接受数据包。你可以利用这种评估顺序创建一个规则：先允许单个\
  \ IP 地址，紧接着创建一个拒绝整个网络的规则。最终效果将是网络内除一个主机外，所有主机都将被拒绝访问。\n\n由于规则的顺序非常重要，你有时可能想在现有链的中间添加规则。要这样做，请使用模块主页上链\
  \ `Add` 列下方的箭头按钮，在现有规则之前或之后创建一个新规则。\n\n下面列出了最常见的操作及其含义。并非所有操作在所有链和表中可用。\n\n- **Do\
  \ nothing (什么都不做)**：如果匹配到具有此操作的规则，将不执行任何操作，并继续处理下一条规则。\n- **Accept (接受)**：匹配的数据包将被立即接受，链中不再进行后续处理。但其他表中的规则仍可能影响该数据包。\n\
  - **Drop (丢弃)**：匹配的数据包将被静默丢弃，就像从未接收过一样。此链或任何其他链都将不再进行后续处理。\n- **Userspace (用户空间)**：数据包将传递给普通的用户空间进程。此操作很少使用。\n\
  - **Exit chain (退出链)**：立即跳转到该链的末尾并转而执行其默认操作。如果在用户定义的链中使用此操作，处理将返回到调用它的规则。\n- **Masquerade\
  \ (伪装)**：匹配的数据包的源地址将被更改，使其像是来自防火墙系统，且链中不再处理后续规则。选择此操作时，你可以使用 `Source ports for masquerading`\
  \ 字段来控制防火墙用于伪装连接的端口。更多信息请参阅第 19.7 节“设置网络地址转换”。`Masquerade` 仅在网络地址转换表的 `Packets after\
  \ routing` 链中可用。\n- **Source NAT (源 NAT)**：与 `Masquerade` 类似，但更适用于具有固定互联网 IP 地址的系统。如果选中，你可以使用\
  \ `IPs and ports for SNAT` 字段来控制用于 NAT 的地址和端口，详见第 19.7 节“设置网络地址转换”。此选项仅在网络地址转换表的\
  \ `Packets after routing` 链中可用。\n- **Destination NAT (目标 NAT)**：匹配的数据包将根据 `IPs and\
  \ ports for DNAT` 字段修改其目标地址和端口。这是透明代理的基础，要了解更多信息，请参阅第 19.8 节“设置透明代理”。此操作仅在网络地址转换表的\
  \ `Packets before routing` 和 `Output` 链中可用。\n- **Redirect (重定向)**：此操作将所有匹配的数据包重定向到防火墙上的一个或多个端口，由\
  \ `Target ports for redirect` 字段指定。它也可以用于透明代理，尽管 `Destination NAT` 更灵活。`redirect`\
  \ 操作仅在网络地址转换表的 `Packets before routing` 和 `Output` 链中可用。\n\n你还可以为操作选择 `Run chain\
  \ (运行链)` 选项，这将数据包传递到相邻字段输入的用户定义链或自定义目标。有关用户定义链的更多信息，请参阅第 19.6 节“创建你自己的链”。某些可用目标包括\
  \ `LOG`（将数据包记录到 syslog）、`MIRROR`（将数据包反射回发送者）和 `MARK`（为后续条件标记数据包）。\n\n对于每个条件，可以选择\
  \ `<Ignored> (忽略)`、`Equals (等于)` 和 `Does not equal (不等于)`。第一个意味着在检查数据包是否匹配规则时完全不使用该条件。第二个意味着数据包必须匹配该条件才能匹配整个规则，第三个意味着数据包**不匹配**该条件时规则才会执行。例如，如果\
  \ `Incoming interface (入站接口)` 条件被设置为 `Does not equal` 并选择了 `eth0`，则该规则将仅匹配来自主以太网卡以外的任何接口的数据包。\n\
  \n由于几乎所有网络协议都涉及双向流量，尝试使用 `Source address (源地址)` 或网络条件仅阻塞某些地址的入站流量，也会阻塞到该地址的连接，因为作为连接部分的回复包将被丢弃。同样，如果使用\
  \ `Destination TCP` 或 `UDP port` 条件阻塞特定端口的入站数据，万在极少数情况下你系统发起的连接的随机源端口匹配了被阻塞的端口，其任何回复都将被丢弃。由于这些原因，在创建拒绝规则时，通常将\
  \ `Connection state (连接状态)` 条件设置为 `Does not equal` 并从相邻菜单中选择 `Existing connection\
  \ (现有连接)` 是一个好主意。这将使 `IPtables` 跟踪服务器发出的连接而不阻塞它们。\n\n如你所见，有很多不同的可用条件可以组合以创建相当复杂的规则。要了解更多关于每个可用条件的作用，请参阅第\
  \ 19.10 节“防火墙规则条件”。由于条件非常多，Webmin 允许你创建与现有规则几乎相同的新规则。要这样做，请点击现有规则进行编辑，并使用页面底部的 `Clone\
  \ rule (克隆规则)` 按钮进入规则创建表，所有条件和操作都将根据原始规则设置。\n\n### 19.4 更改链的默认操作\n\n不匹配链中任何规则的数据包将使用默认操作处理，通常是接受数据包。在模块主页上，`Set\
  \ default action to (设置默认操作为)` 按钮显示了每个链的默认操作。要更改它，步骤如下：\n\n1. 从 `Set default action\
  \ to` 旁边的菜单中选择新操作。仅 `Accept`、`Drop`、`Userspace` 和 `Exit chain` 操作可用，其含义请参阅第 19.3\
  \ 节“允许和拒绝网络流量”。通常只有 `Allow` 和 `Drop` 作为默认操作才有意义。\n2. 点击 `Set default action to`\
  \ 按钮保存新默认设置。\n3. 如果改为 `Drop`，请添加所需的额外防火墙规则，以便你的系统仍然访问其他服务器并提供重要服务。\n4. 完成后，点击 `Apply\
  \ Configuration (应用配置)` 按钮使新默认生效。\n\n仅将入站数据包的默认操作更改为 `Drop` 是完全切断系统网络简单方法，并可能使其无法使用。在此之前，请确保你允许了至少以下类型的流量：\n\
  \n- **All established connections (所有已建立连接)**：创建一个 `Allow` 规则，将 `Connection state`\
  \ 设置为 `Equals` 并选择 `Existing connection`。\n- **Connections related to those that\
  \ are established, such as FTP data connections (与已建立连接相关的连接，如 FTP 数据连接)**：创建一个\
  \ `Allow` 规则，将 `Connection state` 设置为 `Equals` 并选择 `Related connection`。\n- **All\
  \ traffic on the loopback interface (环回接口上的所有流量)**：创建一个 `Allow` 规则，将 `Incoming interface`\
  \ 设置为 `Equals` 并选择 `lo`。\n- **Traffic from your system to itself on its primary\
  \ network interfaces (你的系统通过其主网络接口到自身的流量)**：为每个接口创建一个 `Allow` 规则，将 `Source address`\
  \ 或网络以及 `Destination address` 或网络都设置为接口 IP 地址。\n- **Safe ICMP types (安全的 ICMP 类型)**：创建四个\
  \ `Allow` 规则，将 `ICMP packet type` 设置为 `Equals` 并选择 `echo-reply`、`destination-unreachable`、`source-quench`\
  \ 和 `time-exceeded`。\n\n将转发数据包的默认操作更改为 `Drop` 不会引起很多问题，它等同于完全关闭转发。将出站数据包的默认操作更改为\
  \ `Drop` 是一个坏主意，因为它将切断所有网络访问，在大多数情况下可能毫无意义。\n\n\n\n\nWebmin 可用于编辑任何手动创建、通过其他程序或使用此模块创建现有防火墙规则。尽管该模块不支持所有可用的\
  \ `IPtables` 条件和动作选项，但你仍然可以使用它安全地编辑包含未知选项的规则。只有 Webmin 已知的规则可以被更改，其他规则将保持不变。\n\n\
  要编辑规则，请遵循以下步骤：\n\n- 在模块的主页上，在点击 `Showing IPtable` 按钮旁边的列表中选择规则所在的表。\n- 在该规则所属链（chain）的表中，点击你想要更改的规则动作（action）。这将带你进入编辑表单，该表单与图\
  \ 19.3 所示的创建表单相同。\n- 修改动作或任何条件，然后点击 `Save` 按钮返回链和规则列表。若要完全删除规则，请点击 `Delete` 按钮。\n\
  - 要使更改生效，点击 `Apply Configuration`。\n\n可以使用主页上 `Move` 列下的箭头在规则链内向上或向下移动规则。由于防火墙按顺序评估规则，因此更改它们的顺序可能会影响哪些流量被允许或拒绝。每当你创建一个新规则时，它都会被添加到其链的末尾，因此可能需要将其移动到正确的位置以达到所需效果。\n\
  \n### 19.6 创建你自己的链\n\n除了标准链外，你还可以创建自定义的规则链。区别在于，只有当标准链中的某个规则的动作被显式设置为跳转（jump）到自定义链时，该自定义链才会被执行。当自定义链执行完成（或匹配到具有\
  \ `Exit` 链动作的规则）时，评估将返回到调用链。这意味着自定义链可以用于定义多个标准链共享的规则，而不是在多个处重复相同的规则。在某种意义上，自定义链类似于编程语言中的子程序。\n\
  \n要创建你自己的链，请遵循以下步骤：\n\n- 在模块的主页上，在 `Showing IPtable` 旁边的菜单中选择你希望链所在的表，并点击按钮。自定义链只能从同一表中的其他链调用。\n\
  - 在 `Add a new chain named` 按钮旁边的文本框中输入新链的名称，然后点击按钮创建它。链名称必须是唯一的，通常仅由小写字母和数字组成。\n\
  - 一旦创建了新链，它将出现在页面底部。你可以使用其 `Add rule` 按钮向其附加规则，就像处理普通链一样。\n\n自定义链没有默认策略，因此在主页上没有\
  \ `Set default action` 按钮。如果链的执行到达末尾，控制将始终返回给调用者。不过可以使用规则表下方的 `Delete chain` 按钮删除自定义链。\n\
  \n自定义链可以包含跳转到其他自定义链的规则。然而，链不能跳转到自身，你也不能通过跳转到另一个会跳回第一个链的链来创建循环。即使这是可能的，也是一个非常糟糕的主意！\n\
  \n### 19.7 设置网络地址翻译\n\n如果你在家里或办公室中有多个通过局域网（LAN）连接的系统且只有一个互联网 IP 地址，可以使用网络地址翻译（NAT）让所有这些系统获得几乎完整的互联网访问。NAT\
  \ 将内部局域网上所有系统的地址隐藏在单一互联网地址之后，根据需要来转换地址和端口。这允许所有内部系统连接到互联网上的任何主机，例如 Web 服务器、DNS 服务器、POP3\
  \ 服务器等。唯一的局限性是内部系统无法接收来自其他互联网主机的连接，这可能会导致某些协议（如网络电话和网络游戏）失败。\n\n由于此局限性，内部系统受到来自互联网其他主机的大多数攻击的保护，就像你屏蔽了从外部接口进入的所有转发数据包一样。NAT\
  \ 还让 IP 地址分配变得更容易，因为不需要担心为那些并不不需要地址的内部主机分配的真实互联网地址会耗尽。由于这些原因，即使从网络角度来看并非完全必要，在你的组织中设置\
  \ NAT 可能也是意义的。\n\nNAT 通过修改由内部主机发送并通过防火墙的数据包的源地址和端口来工作。源地址始终被更改为防火墙系统的外部 IP 地址，源端口更改为随机选择的未用端口。当回复包返回时，将使用其目的端口来确定数据包应该转发到的原始内部客户端\
  \ IP 地址和端口。\n\n要设置 NAT，你真正需要一个具有两个接口的系统：一个用于内部局域网，另一个通过拨号、ISDN、ADSL 或电缆调制解调器连接到互联网。一旦拥有这些，请遵循以下步骤：\n\
  \n- 在内部局域网上，每个系统的以太网接口都应分配一个私有 IP 网络地址，例如 `192.168.0.0`，包括网关系统。\n- 将所有内部系统上的默认路由器设置为网关系统的\
  \ LAN IP 地址。\n- 确保网关在 `Network Configuration` 模块下的 `Routing and Gateways` 中启用了 IP\
  \ 转发。有关如何执行此操作的更多信息请参见第 16 章。\n- 在网关系统 Linux 防火墙模块的主页上，从 `Showing IPtable` 按钮旁列表中选择\
  \ `Network address translation`。然后点击按钮显示 `NAT` 表中的链。\n- 点击 `Packets after routing`\
  \ 部分中的 `Add rule` 按钮，这将带你进入规则创建表单。\n- 将 `Action` 设置为 `Masquerade`。\n- 要控制防火墙将使用哪些端口进行伪装连接，将\
  \ `Source ports for masquerading` 选项设置为 `Port range`，并在旁边的字段中输入起始结束端口号。通常只需选择 `Any`\
  \ 让防火墙使用任何可用端口即可。\n- 将 `Outgoing interface` 条件更改为 `Equals`，并从旁边的列表中选择外部网络接口，例如 `ppp0`。\n\
  - 点击页面底部的 `Save` 按钮返回链和规则列表。\n- 点击 `Apply Configuration` 使新规则（以及 NAT）生效。\n\n可以将\
  \ NAT 与数据包过滤表（Packet filtering）中的其他防火墙规则结合，以阻止到防火墙主机本身的连接。你也可以在 `Packets after routing`\
  \ 链之前添加拒绝规则，以停止某些内部主机访问互联网，或限制它们可以连接的端口。\n\n上述指令适用于任何具有单一互联网 IP 地址的网关系统的网络。然而，如果你的网关地址是静态的，最好在第\
  \ 6 步中选择 `Source NAT` 而不是 `Masquerade`。当使用伪装技术时，如果外部网络接口掉线，由防火墙转发的任何连接将丢失，即使它重新启动并具有相同的\
  \ IP 地址。如果外部接口具有动态分配的地址，这并不重要，因为连接本就会丢失。但在使用静态 IP 地址时，连接即使在短暂的网络中断也可能保持。\n\n要使用它，在第\
  \ 6 步中将 `Action` 设置为 `Source NAT`。然后将 `SNAT` 的 IP 和端口设置为 `IP range`，并将你的系统静态外部 IP\
  \ 地址输入旁边的字段中。NAT 设置过程的所有其他步骤均相同。\n\n### 19.8 设置透明代理\n\n\n\n\n\n许多网络使用诸如 `Squid`\
  \ 所示的代理服务器来缓存经常访问的网站，从而减少网络浏览器客户端消耗带宽。通常情况下，每个客户端都必须配置为使用代理服务器，而不是直接连接到网站。在具有许多客户端系统的大网络上，或者在由许多不同用户拥有的\
  \ ISP 网络中，这种单独的配置非常困难。由于每个浏览器都有自己的代理服务器设置，情况会变得更加糟糕，因为如果用户安装了新浏览器，它可能会默认为不使用任何代理。\n\
  \n幸运的是，有一种解决方案：透明代理（transparent proxying）。如果所有客户端系统都通过运行 `IPtables` 防火墙的网关访问互联网，可以将其配置为将指向端口\
  \ `80`（大多数网站使用）的连接重定向到另一个系统上的代理服务器。这意味着客户端不需要配置为访问代理，因为它们发出的任何 HTTP 请求都会在它们不知情的情况下被透明地发送到代理服务器。\n\
  \n要设置透明代理，需要遵循以下步骤：\n\n1.  在网关系统的 Linux 防火墙模块主页上，从 `Showing IPtable` 按钮旁列表中选择 `Network\
  \ address translation`（网络地址转换），然后点击该按钮。\n2.  在 `Packets before routing`（路由前数据）部分，点击\
  \ `Add rule`（添加规则）进入规则创建表。添加的规则将由防火墙系统转发的端口 `80` 的所有流量重定向到代理服务器。\n3.  将要执行的 `Action`（动作）设置为\
  \ `Destination NAT`。\n4.  在 `IPs and ports for DNAT`字段中，选择 `IP range`（IP 范围），并在相邻字段输入代理服务器系统的地址。如果代理运行在同一系统上，输入其以太网\
  \ IP 地址（而不是 `127.0.0.1`）。\n5.  在 `Port range`（端口范围）旁字段输入代理服务器运行的端口，例如 `8080`。\n\
  6.  将 `Incoming interface`（入接口）设置为 `Equals`（等于）并选择内部局域网接口，例如 `eth0`。\n7.  将 `Network\
  \ protocol`（网络协议）设置为 `Equals` 并选择 `TCP`。\n8.  如果代理位于内部局域网的另一个系统上，请确保其在端口 `80` 上的连接也不会被防火墙代理！要做到这一点，将\
  \ `Source address or network condition`（源地址或网络条件）设置为 `Does not equal`（不等于），并在相邻字段输入代理服务器的\
  \ IP 地址。\n9.  如果代理位于不同的局域网或就是防火墙系统，则不需要。\n10. 将 `Destination TCP or UDP port`（目标\
  \ TCP 或 UDP 端口）设置为 `Equals` 并在 `Port(s)`字段中输入 `80`。\n11. 点击 `Create`（创建）按钮保存规则并返回模块主页。\n\
  12. 点击 `Packets after routing`（路由后数据）下的 `Add rule` 再次调出规则创建表。此规则将数据包从代理向另一个方向转发回客户端。如果你的防火墙系统也运行代理服务器，则不需要此规则，你可以直接跳到第\
  \ 16 步。\n13. 对于要执行的 `Action`，选择 `Source NAT`。\n14. 在 `IPs and ports for SNAT`字段中选择\
  \ `IP range` 并在相邻字段输入防火墙服务器的局域网 IP 地址。\n15. 将 `Destination address or network`（目标地址或网络）设置为\
  \ `Equals` 并在相邻字段输入代理服务器的 IP 地址。\n16. 将 `Network protocol` 设置为 `Equals` 并选择 `TCP`。\n\
  17. 点击 `Create` 按钮添加新规则。\n18. 回到主页，点击 `Apply Configuration`（应用配置）按钮。现在，你的防火墙转发的所有端口\
  \ 80 数据包将发送到代理服务器。\n\n假设你在代理系统上运行了 `Squid` 代理服务器（版本 2.4 或更高版本），你可以使用 `Webmin` 来配置它。否则，你需要手动设置它以接受透明代理连接，阅读此步骤之后的内容没有意义。\n\
  \n在代理系统上，进入 `Squid Proxy Server`模块并点击 `Miscellaneous Options`（杂项选项）。\n\n1.  将 `HTTP\
  \ Accel Host`字段设置为 `Virtual`（虚拟），并将 `HTTP Accel Port` 设置为 `80`。\n2.  将 `HTTP Accel\
  \ With Proxy` 和 `HTTP Accel Uses Host Header` 字段均设置为 `Yes`。\n3.  最后，点击 `Save`（保存）返回\
  \ `Squid` 模块的主页，点击页面顶部的 `Apply Changes` 链接激活新配置。\n\n从现在起，你的防火墙转发的任何端口 80 的 HTTP\
  \ 请求都将发送到代理服务器进行处理。可以通过在 `Packets after routing` 链中创建掩码规则（masquerade rule），与传统的\
  \ NAT 安全地使用透明代理，如第 19.7 节“设置网络地址转换”所示。\n\n### 19.9 设置端口转发\n\n在使用 `NAT` 将内部系统隐藏在互联网的网络上，外部主机无法直接连接到内部网络上的主机。这对于安全非常有益，但如果你有一些想要向外部世界提供的内部服务，这可能会很困恼。例如，你的邮件服务器系统可能不是防火墙主机，这通常会导致它无法从互联网访问。幸运的是，解决此问题的方案是端口转发（port\
  \ forwarding）。\n\n这允许你将指向防火墙系统某些端口的所有连接重定向到内部网络中不同的主机和端口。对于邮件服务器，在端口 `25` 上接收的所有数据可能被发送到实际主机上的相同端口。\n\
  \n要设置端口转发，请遵循以下步骤：\n\n1.  在网关系统的 Linux 防火墙模块主页上，从 `Showing IPtable` 按钮旁列表中选择 `Network\
  \ address translation`，然后点击按钮。\n2.  在 `Packets before routing` 部分，点击 `Add rule`\
  \ 进入规则创建表。添加的规则将由防火墙接收的所有外部流量重定向到内部地址。\n3.  将要执行的 `Action`设置为 `Destination NAT`。\n\
  4.  在 `IPs and ports for DNAT`字段中，选择 `IP range` 并向相邻字段输入主机的地址，如 `192.168.1.10`。在`Port\
  \ range`中输入应发送到内部主机的端口，例如 SMTP 的 `25`、POP3 的 `110` 或 HTTP 的 `80`。\n5.  将 `Network\
  \ protocol`设置为 `Equals` 并选择 `TCP`。\n6.  在 `Destination TCP or UDP port`字段中选择 `Equals`\
  \ 并在相邻字段输入需要转发的端口。这通常与第 4 步中输入的端口相同。\n7.  点击 `Save` 按钮创建规则并返回主页，然后点击 `Apply Configuration`\
  \ 按钮。\n\n这种方法的唯一问题是是从内部网络到防火墙系统的连接不会转发到另一个主机。\n\n### 19.10 防火墙规则条件\n\n在创建防火墙规则时，你可以选择许多不同的条件来控制规则匹配的数据包。只有在匹配所有条件时，规则动作才会执行。每个条件都可以通过规则创建表旁边的菜单选择三种状态：\n\
  \n- `Ignore`（忽略）：在判断规则是否匹配时，完全忽略该条件。\n- `Equals`（等于）：只有当数据包与所选的地址、端口或接口匹配时，规则才会匹配。\n\
  - `Does not equal`（不等于）：只有当数据包不匹配所选的内容时，规则才会匹配。\n\n可用的条件及其匹配内容见表 19.1。注意，某些条件在所有表和链中可用。\n\
  \n记住每个条件都是基于数据包应用的，并且单个 TCP 连接可能涉及双向的多个数据包。\n\n#### 表 19.1. 防火墙条件\n\n| 条件 | 匹配 |\n\
  | --- | --- |\n| 源地址或网络 | 数据包的 IP 地址、主机或网络。在输入网络时，可以使用网络/前缀表示法（如 `192.168.0.0/16`）或网络/掩码表示法（如\
  \ `192.168.0.0/255.255.0.0`）。 |\n\n\n\n\n\n| 目的地址或网络 | 数据包将去往 IP 地址、主机或网络。与源地址一样，你可以使用\
  \ `network/prefix` 和 `network/netmask` 记法。 |\n| 入站接口 | 数据包进入防火墙服务器的网络接口。更多详细信息请参阅第\
  \ 16 章中关于接口类型和名称的讨论。 |\n| 出站接口 | 防火墙服务器发送数据包的网络接口。 |\n| 分片 | 当一个 IP 数据包对于其所发送的物理网络过大时，它会被分成多个分片。如果选择了\
  \ `Is fragmented`（已分片），规则将仅适用于第一个分片之后的。如果选择了 `Is not fragmented`（未分片），规则仅适用于第一个分片或完全未分片的数据。由于第一个分片之后的碎片不包含任何协议或端口信息，因此具有协议、端口、`TCP`、状态或服务类型条件的规则将永远无法匹配分片。\
  \ |\n| 网络协议 | 数据包所载数据的网络协议。`HTTP`、`FTP`、`telnet`、`SSH`、`SMTP`、`POP3` 等许多其他高层协议使用\
  \ `TCP`。`DNS`、`NFS` 和 `NIS` 协议使用 `UDP`。`ping` 和 `traceroute` 等命令使用 `ICMP`。 |\n|\
  \ 源 TCP 或 UDP 端口 | `TCP` 连接或 `UDP` 数据包来源端口。对于客户端发送到服务器的数据包，源端口通常是随机分配的，因此对防火墙没有用。但对于从服务器发回客户端的数据包，源端口与客户端连接的端口相同。如果选择了\
  \ `Port(s)` 选项，你可以在相邻字段中输入一个或多个端口，并用逗号分隔。如果选择了 `Port range`（端口范围），你必须输入起始和结束数字以涵盖其之间的所有端口。此条件仅在你的\
  \ `Network protocol` 设置为 `TCP` 或 `UDP` 时才能使用。 |\n| 目的 TCP 或 UDP 端口 | `TCP` 连接或 `UDP`\
  \ 数据包去往的端口。你不需要输入端口号，而是可以输入 `/etc/services` 文件中与端口关联的名称，例如 `telnet` 或 `http`。与 `Source\
  \ TCP or UDP port`（源端口）条件类似，可以输入端口列表或范围，且 `Network protocol` 必须设置为 `TCP` 或 `UDP`。\
  \ |\n| 源和目的端口 | 要使此类类型的条件匹配，源端口和目的端口都必须位于相邻字段中输入的逗号分隔的端口名称或数字列表中。这个条件对我似乎并不有用。 |\n\
  | TCP 选项号已设置 | 如果输入的 `TCP` 选项号已设置，则匹配。 |\n| TCP 标志已设置 | `TCP` 数据包上设置的标志。第二行的选择决定了防火墙将查看哪些标志，而第一行的选择指示特定标志是否必须设置。此条件可以用于检测现有连接部分的\
  \ `TCP` 数据包。然而，`Connection state`（连接状态）条件是实现功能的更优且更简单的方法。要使用此条件，`Network protocol`\
  \ 必须设置为 `TCP`。 |\n| ICMP 数据包类型 | 对于 `ICMP` 数据包，如果数据包类型与旁边菜单中选择的任何类型匹配，则匹配。某些类型（如\
  \ `echo-request` 和 `echo-reply`）由 `ping` 命令发送，而另一些类型用于低级网络流量控制。由于 `ICMP` 数据包通常是无害且有时重要的，因此没有必要拦截它们。正如预期的，要使用此条件，`Network\
  \ protocol` 必须设置为 `ICMP`。 |\n| 以太网地址 | 数据包发送者的 MAC 地址（通常是以太网）。如果数据包在从原始主机发送后由另一个路由器转发，则其\
  \ MAC 地址将是路由器的地址。`Ethernet` 地址的格式必须像 `ifconfig` 命令显示的 `00:D0:B7:1D:FB:AA`。 |\n|\
  \ 数据包流率 | 匹配低于输入速率的数据包（如果选择了 `Below`）或高于输入速率的数据包（如果选择了 `Above`）。此条件不能用于限制主机可以发送的流量大小，相反，它适用于通过\
  \ `LOG` 目标仅记录匹配某些规则的一部分数据包。 |\n| 数据包突发速率 | 要匹配的最大初始数据包数量。每当未达到 `Packet flow rate`\
  \ 时，该数字就会重新充一个，直到达到输入的数字为止。 |\n| 连接状态 | 根据数据包的连接状态和从菜单中选择的选项匹配数据包。你可以选择多个选项来匹配具有任何所选状态的数据包。可用选项和它们匹配的数据包是：`New\
  \ connection`（新连接）匹配属于新 `TCP` 连接的数据包。`Existing connection`（现有连接）属于已建立连接的数据包。`Related\
  \ connection`（相关连接）与已建立连接相关的连接，例如 `FTP` 数据连接。`Not part of any connection`（不属于任何连接）完全不符合任何新现有连接的数据包。\
  \ |\n| 服务类型 | 匹配其 `IP` 服务类型与此条件旁边菜单中选择的类型相同的数据包。 |\n| 发送 unix 用户 | 由所选 `UNIX` 用户拥有的本地进程发送的数据包。此条件（以及下面的三个条件）仅在\
  \ `Outgoing`（出站）数据包链中才有意义。 |\n| 发送 unix 组 | 由所选 `UNIX` 组拥有的本地进程发送的数据包。 |\n| 发送进程\
  \ ID | 由具有指定 `PID` 的本地进程发送的数据包。 |\n| 发送进程组 | 由具有指定进程组 ID 的本地进程发送的数据包。 |\n| 额外参数\
  \ | 此字段可用于通过通过模块用户界面设置的规则额外参数，例如 `log-level warn`。只有在你熟悉 `iptables` 命令时才应使用它。 |\n\
  \n### 19.11 配置 Linux 防火墙模块\n\n此模块有多个可配置设置，可以通过点击主页上的 Module Config 链接访问。如表 19.2\
  \ 所示。\n\n### 19.12 总结\n\n任何直接连接到互联网的系统都可能受到黑客和其他恶意人员的攻击。在阅读本章后，你应该知道如何限制系统接受的流量类型，这将使攻击者入侵变得困难。你还应该知道如何将其配置为掩装网关，以保护内部局域网上的主机，同时允许它们访问互联网。最后，如果需要，你应该知道如何在你的网络上设置透明代理并配置端口转发。\n\
  \n##### 表 19.2. 模块配置选项\n\n| 直接编辑防火墙规则而不是保存到文件？ | 通常，此字段设置为 No（否），这告诉模块在保存文件中编辑防火墙规则，可以通过点击“Apply\
  \ Configuration”（应用配置）按钮来应用。选择 Yes（是）会将模块切换到不同的模式，在该模式下，所有更改都直接应用于激活的防火墙规则。此模式下的用户界面类似，但主页上的\
  \ apply（应用）、revert（还原）和 boot-time（启动时）按钮不再显示，因为它们没有意义。如果你系统上的其他程序（例如 `PortSentry`）也在编辑规则，那么直接更新防火墙规则是有意义的。然而，系统重启时，所有规则将丢失，除非你手动创建一个脚本使用\
  \ `iptables-save` 命令在关闭时保存它们，并在启动时使用 `iptables-restore` 恢复它们。 |\n| 用于编辑 IPtables\
  \ 保存文件 | 此字段用于指定模块读取和更新 IPtables 规则的备用文件。只有当系统使用某些自定义保存文件（可能由另一个防火墙工具创建）时，才更改它。\
  \ |\n| 显示注释？ | 此字段决定是否在模块的主页上与条件和操作一起显示每个规则的注释。 |\n\n\n\n\n\n| 显示条件？ | 此字段决定每个规则的条件是否显示在模块的主页上。\
  \ |\n\n## 第 20 章：设置日期和时间\n\n本章解释了如何在您的服务器上设置系统时钟和硬件时钟。\n\n### 20.1 系统时间模块\n\n所有\
  \ UNIX 系统都通过内部时钟来跟踪当前时间，即使系统关机时也是如此。Linux 系统实际上有两个时钟：一个在系统运行时由内核维护，另一个是始终运行的独立硬件时钟。内核的系统时间是在内核加载时根据硬件时间设置的，因此它们应该是同步的。然而，如果其中一个时钟比另一个慢，在运行长时间的系统上，硬件时间和系统时间可能会不同步。\n\
  \n所有 UNIX 系统内部将时间存储为自 GMT 1970 年 1 月 1 日以来的秒数。为了显示，该时间会根据系统配置的时区转换为人类可读的本地时间（local\
  \ time）。所有 Linux 发行版都允许你在安装时选择时区，并包含一个以后更改时区的工具。但是，Webmin 并不支持选择时区。\n\n可以使用 `date`\
  \ 和 `hwclock` 命令分别显示和设置系统时间和硬件时间。只有 root 用户可以更改系统时间，且只有 root 可以使用 `hwclock` 命令显示硬件时间。\n\
  \n你可以使用“硬件”（Hardware）类别下的“系统时间”模块同时调整系统时间和硬件时间。该模块只有一个页面，如图 20.1 所示。页面上的两个时间每五秒更新一次，因此即使页面在浏览器中显示很长时间，它们也能保持正确。\n\
  \n#### 图 20.1。系统时间模块。\n\n![](img/20fig01.jpg)\n\n### 20.2 修改系统时间\n\n使用此 Webmin 模块可以随时将系统时间提前或向后推。通常情况下这是非常安全的，但巨大的变化可能会让某些程序困惑，因为这些程序没有预期当前时间回拨或大幅跳转。\n\
  \n更改系统时间的步骤如下：\n\n1. 在模块的主页上，在“系统时间”部分选择新的日、月、年、时、分和秒。\n2. 点击字段下方的 `Apply`（应用）按钮。将设置新的日期和时间，页面将重新显示。\n\
  \n还可以点击 `Set system time to hardware time`（将系统时间设置为硬件时间）按钮强制将系统时间设置为当前硬件时间。无论哪种方式，任何更改都会立即对系统上运行的所有程序可见，例如桌面时钟、syslog\
  \ 和邮件客户端。\n\n### 20.3 修改硬件时间\n\n由于硬件时间仅在系统启动时由内核读取，因此对其进行更改不会对正在运行的程序产生任何影响。请按照以下步骤进行更改：\n\
  \n1. 在模块的主页上，在“硬件时间”部分选择新的日、月、年、时、分和秒。\n2. 点击字段下方的 `Apply`（应用）按钮。将设置新的日期和时间，页面将重新显示。\n\
  \n你还可以点击 `Set hardware time to system time`（将硬件设置为系统时间）将硬件时间与系统时间同步。对于长时间未重启的系统，这样做是一个好主意，防止时间偏移过大。\n\
  \n### 20.4 与另一服务器同步时间\n\n系统时间模块还可以根据另一个服务器的系统时间来设置系统或硬件时间。另一台服务器必须运行 NTP（网络时间协议）服务器，或者在\
  \ `inetd` 中启用了时间协议（如第 15 章所述）。要让你的系统使用 NTP 进行同步，你必须安装 `ntpdate` NTP 客户端程序。\n\n同步时间的步骤如下：\n\
  \n1. 在“时间服务器”部分的 `Host/Address` 字段输入另一台服务器的主机名或 IP 地址。选择附近的服务器总是更好的，这样可以尽量减少网络延迟的影响。\n\
  2. 点击 `Sync system time`（同步系统时间）或 `Sync system time/Sync hardware time`（同步系统时间/同步硬件时间）按钮，分别设置系统时间或同时设置系统时间和硬件时间。如果无法连接服务器或不支持\
  \ NTP 或时间协议，将显示错误消息。否则，时间将被设置且页面将重新显示。\n\n### 20.5 模块访问控制\n\n与许多其他模块一样，可以限制 Webmin\
  \ 用户或组在系统时间模块中可以的操作。然而，由于模块功能有限，可用的限制非常基础，并不能真正提高供不可信用户使用的时的安全性。\n\n一旦按照第 52 章所述授予\
  \ Webmin 用户对模块的访问权限，你可以按照以下步骤限制其操作：\n\n1. 在 Webmin 用户模块中，点击你想要限制的用户或组名称旁边的 `System\
  \ Time`。\n2. 将 `Can edit module configuration?`（可以编辑模块配置？）字段更改为 `No`，这样用户无法更改特定特定的设置。\n\
  3. 要停止用户更改系统时间，将 `User can edit system time`（用户可以编辑系统时间）字段设置为 `No`。\n4. 要防止用户更改硬件时间，将\
  \ `User can edit hardware time`（用户可以编辑硬件时间）字段设置为 `No`。\n5. 完成后，点击底部的 `Save`（保存）按钮使新限制生效。\n\
  \n### 20.6 其他操作系统\n\nLinux 是系统时间模块支持的唯一具有独立硬件系统时间的操作系统。Solaris、Irix、HP/UX 和 OpenServer\
  \ 只有一个系统时间，其设置方法与 Linux 上完全相同。FreeBSD、NetBSD 和 MacOS X 同样仅支持系统时间，也可以以相同的方式设置，但只能精确到分钟。其他操作系统无法使用此模块。\n\
  \n### 20.7 总结\n\n你现在应该知道如何手动调整 Linux 或 UNIX 系统上的两个时钟了。你现在应该牢牢掌握将系统时钟与其他服务器同步的过程。\n\
  \n## 第 21 章：引导加载程序配置\n\n本章涵盖了 Linux 启动过程以及 LILO 和 GRUB 引导加载程序。它解释了如何在启动时运行不同的操作系统或加载不同的内核。\n\
  \n### 21.1 引导加载程序简介\n\n当运行在 PC 硬件上的 Linux 系统启动时，第一个运行的代码是从 ROM 载入的 `BIOS`（基本输入输出系统）。在它完成系统内存测试并发现了哪些硬件后，它会尝试将控制权交给操作系统引导加载程序以继续启动过程。引导加载程序是一个微型程序，可能会提示用户选择要运行哪种\
  \ OS，然后从硬盘、软盘或其他源加载操作系统的其余部分。\n\n在正常系统上，引导加载程序由 `BIOS` 从主硬盘的第一个块加载，该块被称为主引导记录或 `MBR`。然而，`BIOS`（取决于其配置）可能会首先检查软驱或\
  \ CD-ROM 是否有加载程序，以便系统从可移动式磁盘启动。这通常只在安装新的操作系统以供日常使用时进行，几乎所有系统都从硬盘启动。\n\n\n\n\n其他操作系统（如\
  \ Windows、FreeBSD 和 Solaris）有它们自己的引导加载程序，它们的功能与 `LILO` 或 `GRUB` 基本上相同，但设计目标转变为加载另一个操作系统的内核。Webmin\
  \ 不支持配置任何非 Linux 的引导加载程序，因此如果你运行的是其他版本的 UNIX，可以跳过本章。\n\n在 Linux 系统上，引导加载程序的主要职责是加载内核。一旦内核加载到内存并将控制权移交给它，引导加载程序的工作就完成了。随后，内核会挂载根文件系统、初始化驱动程序，并最终运行\
  \ `init` 程序以继续如第 9 节所示的启动过程。\n\n在安装了多个操作系统的系统中，引导加载程序还可以启动加载完全不同的操作系统进程。它是通过从分区或其他硬盘的第一个块加载另一个操作系统的引导加载程序，然后将控制权交给它来实现的。另一个操作系统的加载方式就像由\
  \ BIOS 直接运行其引导加载程序完全一样。能够在启动时决定加载哪种操作系统，使得在同一系统上安装两个或多个操作系统（例如 Windows 和 Linux）变得非常实用。\n\
  \n`LILO` 和 `GRUB` 都可以配置为在加载时显示启动选项菜单，允许用户选择要加载的特定内核或另一个操作系统。当您安装了新内核并希望拥有进入新内核和旧内核的选项时，能够从几个不同的内核中进行选择将特别有用。甚至可以设置多个启动选项，它们都加载相同的内核版本，但带有不同的命令行选项。\n\
  \n所有 Linux 发行版都会在安装时提供自动设置引导加载程序的选项。你通常可以选择也启动其他已安装的操作系统，例如，如果你在一个已经在不同分区安装了 Windows\
  \ 的系统上添加 Linux。如果此默认配置对你有效，在手动或通过 Webmin 更改 `LILO` 或 `GRUB` 配置时请务必非常小心。一个小错误就可能导致系统无法启动，并需要使用救援盘进行恢复。\n\
  \n`LILO` 的配置存储在 `/etc/lilo.conf` 文件中。然而，引导加载程序本身实际上并不读取此文件，而是从一个单独的映射文件中读取，该文件在每次运行\
  \ `lilo` 命令时都会从 `lilo.conf` 构建生成。该映射文件包含了内核文件在磁盘上的实际块位置，允许 `LILO` 能够加载内核而无需理解其挂载所在的文件系统格式。每当\
  \ `lilo.conf` 发生更改或内核重新编译或安装时，必须重新运行 `lilo` 命令以更新映射文件，以便引导加载程序知道在磁盘何处查找。\n\n`LILO`\
  \ 的一个主要局限性是在具有旧版 BIOS 的系统中，它只能启动硬盘前 8 GB 以内的内核。随着超过 100 GB 的驱动器变得常见，除非磁盘分区得当，否则这可能会成为一个严重的问题。通常，存储内核的\
  \ `/boot` 目录是从位于磁盘开头的独立分区挂载的，而根目录则从占据剩余空间的分区挂载。\n\n`GRUB` 通常使用配置文件 `/boot/grub/menu.lst`，但与\
  \ `LILO` 不同，它理解 `ext2`、`ext3` 和 `vfat` 文件系统的格式，并且可以在不需要块映射的情况下读取 `menu.lst` 和内核文件。出于这个原因，并且由于\
  \ `GRUB` 可以加载存储在硬盘任何位置的内核，它通常被认为是更优的引导加载程序，并正在现代 Linux 发行版中逐渐取代 `LILO`。\n\n## 21.2\
  \ Linux 启动配置模块\n\n此模块允许你配置最常见的 Linux 引导加载程序 `LILO`。它可以在硬件（Hardware）类别下找到，进入后，主页将显示如图\
  \ 21.1 所示的图标表格。每个图标代表一个启动菜单选项，可以是 Linux 内核，也可以另一个操作系统。\n\n##### 图 21.1. Linux 启动配置模块。\n\
  \n![](img/21fig01.jpg)\n\n如果 Webmin 检测到你没有安装 `LILO`，主页将显示相应的错误信息。如果是如此这种情况，你的发行版可能将\
  \ `GRUB` 设置为其引导加载程序，请参见第 21.6 节“GRUB 引导加载程序模块”。\n\n某些 Linux 系统同时安装了 `GRUB` 和 `LILO`，尽管在任何时刻只有一个可以作为引导加载程序使用。如果你的系统使用\
  \ `GRUB`，可能你不应该使用此模块，尽管它能够正常工作。每当点击主页上的应用配置（Apply Configuration）按钮时，`LILO` 将被安装到全局选项中配置的磁盘或分区上，可能会覆盖\
  \ `GRUB`。\n\n## 21.3 使用 LILO 启动新内核\n\n如果你刚刚编译了一个新内核并希望能够使用它，你需要添加一个新的 `LILO` 启动内核项。要执行此操作，请遵循以下步骤：\n\
  \n编译内核后，将其压缩内核镜像文件（通常位于源码目录的 `arch/i386/bzImage` 下）复制到 `/boot` 目录。通常应将其重命名为 `vmlinuz-*xx.yy.zz`，其中\
  \ `xx.yy.zz` 是内核版本号。\n\n在 Linux 启动配置模块的主页上，点击创建新启动内核（Create a new boot kernel）链接进入内核创建表单。\n\
  \n在名称（Name）字段中为新内核输入一个唯一名称，例如 `linux-xx.yy.zz`。你输入的任何内容将出现在启动时的 `LILO` 菜单中。\n\n\
  在启动内核（Kernel to boot）字段中，输入复制到 `/boot` 目录的内核文件的完整路径。\n\n要向内核传递额外选项，将内核选项（Kernel\
  \ options）字段设置为添加选项（Add options），并将其输入右侧的文本框中。大多数情况下不需要额外选项。\n\n将启动设备（Boot device）字段设置为设备（Device），并从旁边的菜单中选择包含系统根文件系统的分区。\n\
  \n如果系统上的根目录是从未编译进内核的设备挂载的（例如 SCSI 磁盘或硬件 RAID 控制器），你需要创建一个初始 RAM 磁盘，访问根文件系统所需的内核模块。检查是否有必要的最简单方法是查看其他启动内核配置。要在\
  \ `/boot` 目录下为内核版本 `xx.yy.zz` 创建初始 RAM 文件，你需要运行类似下面的命令：\n\n```\nmkinitrd /boot/initrd-*xx.yy.zz\
  \ xx.yy.zz\n```\n\n然后将初始磁盘文件（Initial ramdisk file）选项设置为新创建的文件路径。\n\n点击创建（Create）按钮创建新的\
  \ `LILO` 启动内核并返回模块主页。现在应该可以看到该内核的图标。\n\n点击页面底部的应用配置（Apply Configuration），使 `LILO`\
  \ 重新安装到硬盘并将新内核加入其映射文件。系统将显示 `lilo` 命令的输出和遇到的任何错误，以便你查看安装是否成功。\n\n要使用新内核，你需要重启。根据\
  \ `LILO` 的配置，它会在启动时显示选项菜单，或者提示你输入选项名称。无论如何，选择你的新内核以使其加载并启动。务必观察内核在启动时显示的调试输出和错误信息，以便在发生故障时能够诊断问题。如果出现问题，你可能需要重启并选择旧内核选项，然后使用\
  \ Webmin 修复 `LILO` 配置。\n\n\n\n\n可以通过点击主页上的图标来编辑现有的引导内核，这将引导进入编辑表单。可以编辑任何字段并点击 `Save`\
  \ 按钮保存更改，也可以点击 `Delete` 移除内核。在编辑任何并非您创建的内核配置时，请务必小心，错误可能会导致系统无法启动。\n\n## 21.4 使用\
  \ LILO 启动另一个操作系统\n\n如果您的系统在不同的分区或硬盘上安装了多个操作系统，您可以使用 `LILO` 来选择启动时加载哪一个。要添加一个可以在启动时选择的新操作系统，请遵循以下步骤：\n\
  \n在 Linux Boot Loader 模块的主页上，点击 `Create a new boot partition`（创建新引导分区）链接打开分区创建表单。\n\
  \n在 `Name` 字段中为新启动项输入一个唯一名称，例如 `windows98`。您插入任何内容都将出现在启动时的 `LILO` 菜单中。\n\n从 `Partition\
  \ to boot`（要引导的分）菜单中选择您想要启动的操作系统所在的分区。所选分区必须安装了适当的引导程序或引导扇。例如，Windows 默认就会，但 FreeBSD\
  \ 等其他操作系统可能需要单独安装引导程序。\n\n将 `Pass` 分区表中的 `OS` 字段设置为 `Yes`，并选择操作系统分区所在的驱动器。\n\n点击\
  \ `Create`（创建）按钮，如果您在表单上没有输入任何错误，将返回模块的主页。\n\n点击页面底部的 `Apply Configuration`（应用配置），让\
  \ `LILO` 重新安装到硬盘上，并在其映射文件中包含新的启动项。系统将显示一个包含 `lilo` 命令输出以及可能遇到的任何错误的页面，以便您可以查看安装是否成功。\n\
  \n现在您应该可以重启并从 `LILO` 菜单中选择新的操作系统。\n\n一旦您创建了新的操作系统启动项，可以随时通过点击模块主页上的图标对其进行编辑或删除。如果您进行了任何更改，请记住点击\
  \ `Apply Configuration`，以便这些更改在启动时生效。\n\n## 21.5 编辑全局 LILO 选项\n\n`LILO` 有几个适用于所有可引导内核和操作系统的配置选项。编辑它们的步骤如下：\n\
  \n点击模块主页上的 `Global Options`（全局选项）进入全局选项配置表单。\n\n要更改安装 `LILO` 的驱动器或分区，请从 `Write boot\
  \ loader`（写入引导程序）菜单中选择。通常情况下，如果 `LILO` 已经在启动时正确运行，您不需要更改此项。\n\n通常 `LILO` 会给予用户选择启动时加载的内核或操作系统的机会。要禁用此功能，将\
  \ `Display LILO prompt?`（显示 LILO 提示？）选项设置为 `No`。要给用户选择操作系统的机会，将其设置为 `Yes`。\n\n要更改在没有其他选择时启动自动加载的内核或操作系统，请调整\
  \ `Default kernel/partition`（默认内核/分区）字段。\n\n要调整 `LILO` 在加载默认内核之前等待用户输入的时间，在 `Time\
  \ to wait at LILO prompt`（在 LILO 提示等待的时间）字段中输入新时间。\n\n要防止不受信任的用户启动系统，在 `Default\
  \ boot password`（默认启动密码）字段中输入密码。除非启动项的 `Password needed for` 字段设置为 `Booting kernels\
  \ with extra options`，否则在输入密码之前，它将无法加载。\n\n在带有现代 BIOS 的系统中，`LILO` 可以配置为加载硬盘上任意位置的内核。要启用此功能，将\
  \ `Allow booting from beyond 1024 cylinders?`（允许从 1024 柱体之外启动？）字段设置为 `Yes`。\n\n\
  点击 `Save`（保存）按钮保存全局选项的更改并返回模块主页。\n\n点击 `Apply Configuration`，以便 `LILO` 在下次启动时使用新选项。如果更改了要安装\
  \ `LILO` 的磁盘或分区，它现在将写入新位置。\n\n### 21.6 GRUB 引导程序模块\n\n如名所示，此模块允许您设置 `GRUB`。与 `LILO`\
  \ 模块一样，您从 Hardware（硬件）类别进入它，主页显示一个图标列表，每个图标对应一个启动选项。图 21.2 显示了一个示例。\n\n### 图 21.2.\
  \ GRUB 引导程序模块。\n\n![](img/21fig02.jpg)\n\n只有当 Webmin 检测到系统上安装了 `GRUB` 时，模块图标才会出现。如果不可见，或者在进入模块时显示错误，则说明未安装\
  \ `GRUB`。如果是这样，可能正在使用 `LILO`，您应该使用 Linux Boot Loader 模块。\n\n`GRUB` 的一个特点是它在内部通过\
  \ BIOS 磁盘编号引用所有硬盘。BIOS 识别的第一台驱动器是 `hd0`，而 `hd0,0` 是该驱动器上的第一个分区。在仅有 IDE 硬盘的系统中，这种编号非常简单：BIOS\
  \ 磁盘 0 是主盘，即 Linux 上的 `/dev/hda`；磁盘 2（被 `GRUB` 称为 `hd1`）是主从盘，依此类推。但在在带有 SCSI 和 IDE\
  \ 驱动的系统中，情况会变得复杂。在 BIOS 排序中，IDE 磁盘通常在 SCSI 之前，但在某些系统上这种顺序可能会反过来。幸运的是，最近版本的 Webmin\
  \ 中的 `GRUB` 模块可以自动检测 Linux 设备文件与 BIOS 磁盘编号之间的关系。\n\n## 21.7 使用 GRUB 启动新的 Linux 内核或\
  \ BSD\n\n如果您刚刚编译了一个新内核并希望使用它，将需要添加一个新的 `GRUB` 启动项。\n\n如果您在系统中同时安装了 Linux 和 FreeBSD、NetBSD\
  \ 或 OpenBSD，并希望在启动时选择其中之一，则应遵循类似的过程。要进行此设置，请遵循以下步骤：\n\n编译 Linux 内核后，将其内核镜像文件（通常位于\
  \ `arch/i86/bzImage` 下）拷贝到 `/boot` 目录。它通常应重命名为 `vmlinuz-*xx.yy`，其中 `xx.yy` 是内核版本。\n\
  \n在 `GRUB` Boot Loader 模块的主页上，点击 `Add a new boot option`（添加新启动项）链接进入选项创建表单。\n\n\
  在 `Option title` 字段中为新内核输入一个唯一名称，例如 `linux-xx.yy`。您插入任何内容都将出现在启动时的 `GRUB` 菜单中。\n\
  \n将 `Boot image partition`（引导镜像分区）字段设置为 `Selected`，并从列表中包含内核的分区。如果分区没有出现在菜单中，您需要选择\
  \ `Other` 并在旁边的字段中按照 `GRUB` 使用的 `hdX,Y` 格式输入磁盘和分区。例如，`hd2,1` 是第 3 个硬盘上的第二个分区。\n\n\
  对于 `Operating system to boot`（要启动的操作系统），选择 `Linux kernel` 并在旁边的字段中输入内核压缩镜像文件的路径。要向内核传递额外参数，请在下方的\
  \ `Kernel options`（内核选项）字段中输入它们。对于 FreeBSD，您也必须选择 `Linux kernel` 并在字段中输入 `/boot/loader`。不允许额外的内核参数。对于\
  \ NetBSD 或 OpenBSD，选择 `Linux kernel` 并输入以下内容：\n\n```\ntype=netbsd /netbsd-elf\n\
  ```\n\n如果您的系统根目录是从未编译进 Linux 内核的设备加载（例如 SCSI 磁盘或硬件 RAID 控制器），您将需要创建一个包含访问根文件所需的内核模块的初始内存磁盘。确定是否需要它的简单方法是查看其他现有的引导内核配置。要在\
  \ `/boot` 目录下为内核版本 `xx.yy` 创建内存磁盘文件，您将需要运行类似命令：\n\n```\nmkinitrd /boot/initrd-*xx.yy\
  \ xx.yy\n```\n\n并将 `Initial ramdisk file`（初始内存磁盘文件）字段设置为新创建的文件路径。\n\n最后，点击 `Create`（创建）按钮。只要输入没有检测到任何错误，您将返回模块主页，主页现在将包含一个新内核的额外图标。\n\
  \n\n\n\n要启动新内核，您需要重启系统。当 `GRUB` 在启动时加载时，它将显示一个可用启动选项菜单，您可以从中选择新添加的内核。请务必留意内核在启动过程中显示的调试输出和错误信息，以便在出现问题时可以进行诊断。如果出现问题，您可能需要重启并选择旧内核选项，然后使用\
  \ `Webmin` 修复 `GRUB` 配置。\n\n一旦您创建了新的内核启动选项，可以通过点击模块主页上的图标对其进行编辑。在编辑表单上，可以编辑任何字段并通过点击\
  \ `Save` 按钮保存更改，也可以通过点击 `Delete` 移除内核。在编辑任何并非您亲自创建的内核配置时，请务必倍小心，因为失误可能会导致系统无法启动。\n\
  \n### 21.8 使用 GRUB 启动另一个操作系统\n\n如果您的系统在不同的硬盘或分区上安装了另一个操作系统，您可以配置 `GRUB`，使其在启动时可以选择并启动它，而不是\
  \ Linux。如果您想启动 `FreeBSD`、`NetBSD` 或 `OpenBSD`，请改阅第 21.7 节“使用 GRUB 启动新的 Linux 内核或\
  \ BSD”，对于 `Windows`、`UNIXWare` 或任何操作系统，请按照以下步骤操作：\n\n在模块主页上，点击 `Add a new boot option`\
  \ 以弹出启动选项创建表单。\n\n在 `Option title` 字段中输入唯一名称，例如 `windows`。\n\n将 `Boot image partition`\
  \ 字段设置为 `Selected`，并从旁边的列表中选择包含另一个操作系统的分区。如果分区未出现在菜单中，您将需要选择 `Other` 并在旁边的字段中按照\
  \ `GRUB` 使用的 `hdX,Y` 格式输入磁盘和分区。\n\n将 `Operating system` 更改为 `Other OS`。\n\n通常情况下，`GRUB`\
  \ 将直接运行所选分区第一个扇区的启动加载程序。如果（例如）操作系统通常将其加载程序写入主引导记录，那么那里可能并不总有启动加载程序。\n\n如果另一个操作系统是\
  \ `Windows`，选择 `From chainloader file` 并在旁边的字段中输入 `+1`。您还必须勾选 `Make root partition\
  \ action?` 选项。\n\n启动 `SCO UNIXWare` 时，您还需要选择 `From chainloader file` 并在旁边的字段中输入\
  \ `force +1`。必须同样选择 `Make root partition action?` 选项。\n\n点击 `Create` 按钮添加新操作系统。您的浏览器将返回模块主页，该页面现在将包含您新启动选项的图标。\n\
  \n要启动另一个操作系统，请重启系统并在启动时从 `GRUB` 菜单中选择它。\n\n与 Linux 内核的启动选项一样，您可以通过点击模块主页上的图标来编辑或删除另一个操作系统的选项。任何更改将立即生效，并在系统下次重启时使用。\n\
  \n### 21.9 编辑全局 GRUB 选项\n\n`GRUB` 具有几个适用于所有可启动内核和操作系统的选项。要编辑这些全局选项，请按照以下步骤操作：\n\n\
  在模块主页上点击 `Edit Global Options` 按钮，这将带您进入选项表单。\n\n要控制当用户在配置的时间限制未从 `GRUB` 菜单选择时自动启动哪个内核，请更改\
  \ `Default boot option` 字段。如果选择的选项无法加载，`GRUB` 将回退到 `Fallback boot option` 字段中选中的任何内容。\n\
  \n要更改 `GRUB` 在使用默认选项之前等待用户选择启动选项的时间，请编辑 `Timeout before using default` 字段。\n\n`GRUB`\
  \ 启动菜单允许用户执行更改内核参数和读取 Linux 文件系统上任意文件等操作。为了防止这种情况，请在 `Boot password` 字段中输入密码。这将限制用户仅使用可用启动选项，除非输入密码。此外，在\
  \ `Password locked?` 字段中已设置的启动选项也将无法被选择。\n\n完成后，点击 `Save` 按钮，您将返回模块主页。\n\n### 21.10\
  \ 安装 GRUB\n\n如果您一直使用 `LILO` 启动加载程序并想要切换到 `GRUB`，您需要将其安装在 `LILO` 当前正在使用的同一个主引导记录或分区上。这只需要执行一次，与\
  \ `LILO` 不同，后者每次更改配置时实际上都需要重新安装。\n\n按照以下步骤安装 `GRUB`：\n\n在模块主页上，点击 `Edit Global Options`\
  \ 按钮。\n\n从 `Install GRUB on disk/partiton` 菜单中选择您想要安装 `GRUB` 的磁盘或分区。这通常是您系统上的第一块硬盘。\n\
  \n点击 `Save` 按钮返回模块主页。\n\n点击 `Install GRUB` 按钮将其写入第 2 步中选择的驱动器或分区。\n\n按照第 21.7 节“使用\
  \ GRUB 启动新的 Linux 内核或 BSD”中的说明创建任何必要的内核启动选项，以便您的系统从现在开始启动到 Linux。如果您在此之前重启，将无法再次启动\
  \ Linux！\n\n### 21.11 配置 GRUB 启动加载器模块\n\n此模块只有一个您可能想要更改的配置设置。其余部分与 `GRUB` 及其配置文件在系统上的位置有关，通常不需要修改。可以通过点击主页上的\
  \ `Module Config` 链接编辑该设置，如表 21.1 所示。\n\n### 21.12 总结\n\n本章解释了 Linux 系统上启动加载程序的用途，并展示了如何设置和配置两种最常见的加载程序\
  \ `LILO` 和 `GRUB`。阅读后，您应该知道如何添加在启动时启动不同操作系统的选项，或使用不同的 Linux 内核。由于错误可能会导致系统无法启动，您还应该理解重新配置启动加载器所涉及的风险。\n\
  \n##### 表 21.1. 模块配置选项\n\n| 设备名称映射文件 | 当选择 Get from GRUB 时，模块将使用命令 `grub -device-map`\
  \ 来获取 BIOS 磁盘编号列表及其关联 Linux 设备文件。这工作得非常完美，但在某些系统上可能会非常慢。另一种方案是让模块读取包含磁盘映射的文件，该文件通常位于\
  \ `/boot/grub/device.map`。这种方法更快，但如果您的系统添加了新硬盘，取决于您的 Linux 发行版更新该文件的频率，它可能不会被添加到文件中。这意味着新磁盘可能不会在此模块的菜单中。\
  \ |\n\n## 第 22 章 打印机管理\n\n本章向您展示如何使用 `Webmin` 在系统中设置打印机和打印机驱动程序。它涵盖了使用的许多不同的打印系统，如\
  \ `CUPS`、`LPRng` 和 `Solaris print server`。\n\n### 22.1 Linux 打印简介\n\n与其他操作系统一样，Linux\
  \ 可以直接打印到连接的打印机，也可以间接打印到网络上另一个系统的打印机。任何想要打印的程序都会运行类似 `lpr` 的命令将作业提交给打印服务器守护进程，该进程会将作业添加到指定打印机的队列中。当打印机就绪时，守护进程打开相应的并行端口或\
  \ USB 设备文件并为其发送打印作业数据。如果打印机连接到网络上的另一个系统，守护进程将使用相应的协议进行连接并发送作业以便队列和打印。\n\n几乎所有 Linux\
  \ 程序以两种格式之一提交打印作业：纯文本或 PostScript。由于大多数消费级打印机不支持 PostScript，打印服务器守护进程必须将提交的 PostScript\
  \ 转换为打印机识别的格式。这是通过使用驱动程序或脚本完成的，大多数驱动程序基于免费提供的 `ghostscript` PostScript 渲染程序。\n\n\
  \n\n\n\n几乎每一个不同的打印机制造商（即使是同一制造商的不同型号）都有其接受打印任务的特定数据格式。所有制造商都会随其打印机提供 Windows 驱动程序，但极少数会包含\
  \ Linux 驱动程序。这意味着编写驱动程序的工作必须由自由软件爱好者完成，而他们并不总是能跟上具有新数据格式的新打印机的发布速度。某些较新的打印机型号可能在发布一段时间后才会在\
  \ Linux 上支持，而某些无法获取驱动信息的型号可能永远无法被支持。\n\nLinux 有多个不同的打印系统包，例如 `LPR`、`LPRng` 和 `CUPS`。它们本质上都执行相同的任务，但功能不同，配置方式也不同。大多数现代\
  \ Linux 发行版都包含 `LPRng` 或 `CUPS`，但某些旧版本可能只包含 `LPR`。\n\n还有几个不同的打印机驱动包，其中许多是由 Linux\
  \ 发行版供应商创建的。它们的目的都是将 postscript 转换为打印机接受的数据格式，但具有不同的配置文件和功能。最好的是 `CUPS` 驱动，因为它们是专为\
  \ `CUPS` 打印服务器设计并与之良好集成的。\n\n## 22.2 打印机管理模块\n\n无论你的系统中安装了哪种打印服务器，都可以使用 Webmin 的打印机管理模块进行配置。该模块尝试在忽略所使用的打印系统和驱动程序的情况下提供相似的用户界面，同时允许你使用它们的所有功能。默认情况下，该模块假设你正在使用\
  \ Linux 发行版标准安装的驱动程序和打印守护进程包。如果你安装了不同的打印服务器（例如优的 `CUPS`），则你需要告诉 Webmin 你正在使用哪种打印系统。详情请参见第\
  \ 22.6 节“配置打印机管理模块”。\n\n本章中的所有指令都是针对 `CUPS` 打印系统和驱动编写的，且所有的截图都取自使用 `CUPS` 的系统。这是因为我认为它是\
  \ Linux 上最好的最好的打印系统，而且它是许多现代 Linux 发行版的默认打印系统。\n\n当你从“硬件（Hardware）”类别进入该模块时，主页面将列出系统上安装的所有打印机，如图\
  \ 22.1 所示。在 Red Hat Linux 7.0 及以上版本中，将仅显示使用 Webmin 创建的打印机。通过其他程序（如 Red Hat 的 `printconf`\
  \ 工具）添加的打印机将不会列出，因为无法使用此模块进行编辑。\n\n### 图 22.1. 打印机管理模块。\n\n![](img/22fig01.jpg)\n\
  \n当打印服务器守护进程运行时，主页面底部有一个标记为`Stop Scheduler（停止调度）`的按钮。如果点击，守护进程将停止，导致所有打印停止。要重新启动，点击在相应位置出现的`Start\
  \ Scheduler（启动调度）`按钮。\n\n如果 Webmin 检测到当前配置的打印系统未安装，主页面将显示一条错误消息。这表明你的服务器上尚未安装打印软件，或者在模块配置页面选择了错误的系统。\n\
  \n### 22.3 添加新打印机\n\n如果你刚刚将打印机连接到系统，或者想访问连接到局域网上另一个系统的打印机，在你的 Linux 系统上的任何程序对其打印之前，你必须将其添加到打印守护进程的配置中。请按照以下步骤操作：\n\
  \n点击模块主页面上的`Add a new printer（添加新打印机）`链接。这将进入图 22.2 所示的打印机创建表（截图取自使用 `CUPS` 打印系统的系统，因此你的\
  \ Linux 机器上的界面可能不同）。\n\n### 图 22.2. 打印机创建表。\n\n![](img/22fig02.jpg)\n\n在`Name（名称）`字段中为新打印机输入唯一名称（例如\
  \ `epson` 或 `hp_laser`）。这将在使用 `lpr` 命令或从其他程序打印时指定打印机的名称。\n\n在`Description（描述）`字段中输入简短描述，例如`Office\
  \ Epson Stylus 740`。\n\n如果你希望每个打印作业之前都包含一个包含正在打印的文件名和打印用户名的横幅页，请将`Print banner?（打印横幅页？）`字段设置为\
  \ Yes。除非打印机被大型组织中的许多人使用，否则通常是浪费纸。\n\n要使此打印机成为 `lpr` 命令行未指定打印机名称时的默认打印机，将`Default\
  \ printer?（默认打印机？）`选项设置为 Yes。此选项并非所有打印系统都可用。\n\n使用某些打印系统时，可以使用`Max print job size（最大打印作业大小）`字段控制可以提交到打印机的作业最大尺寸。对于你个人机器上的打印机，这应设置为`Unlimited（无限）`，但在有许多用户的网络上，输入较小的\
  \ KB 块数值可能是合理的。\n\n如果你的系统使用 `Linux` 或 `LPRng` 打印系统，可以在`Alternate printer names（备用打印机名称）`字段中为打印机输入多个用空格分隔的别名。要使打印机成为默认，可以将\
  \ `lp` 作为别名之一。\n\n如果打印机直接连接到你的系统，在`Print Destination（打印目标）`部分选择`Local device（本地设备）`选项，并从旁边的菜单中选择它所在的并行或\
  \ USB 。\n\n如果设备不在列表中，请选择`Local file（本地文件）`并在字段中输入设备路径，例如`/dev/ttyS5`。你也可以输入要打印的文件名，只要它已存在且打印守护进程可写。\n\
  \n如果打印机连接到网络上的另一个系统（或直接连接到网络本身），你必须选择一种协议进行打印。\n\n对于连接到 UNIX 系统的打印机，选择`Remote Unix\
  \ server（远程 Unix 服务器）`并在旁边的字段中输入服务器的主机和该服务器上打印机的名称。对于大多数 UNIX 系统，`Type（类型）`可以设置为`BSD`，但如果远程服务器运行`CUPS`，你可以选择`IPP`。\n\
  \n对于 Windows 系统上的打印机，选择`Remote Windows server（远程 Windows 服务器）`并在相应的字段中输入主机名和打印机名称。如果服务器要求客户端在打印前登录，请在`User（用户）`和`Password（密码）`字段中填写\
  \ Windows 系统的有效登录。如果你的网络上有多个工作组，你可能还需要填写`Workgroup（工作组）`字段。\n\n对于某些可以直接插入网络的打印机，你必须选择`Direct\
  \ TCP connection（直接 TCP 连接）`选项并在旁边的字段中输入主机名和端口号。\n\n如果你的系统中安装了`hpnp`命令，将可以使用`Remote\
  \ HPNP server（远程 HPNP 服务器）`选项，以便到使用该协议的 HP 网络打印机。如果选中，必须在旁边的字段中输入主机名和端口号。\n\n要让\
  \ Webmin 检查是否可以使用所选协议访问远程打印机，请勾选`Check if remote server is up?（检查远程服务器是否在线？）`复选框。\n\
  \n如果打印机支持 PostScript，在`Printer Driver（打印机驱动程序）`部分选择`None（无）`选项。打印到远程 UNIX 服务器时也应选择此选项，因为从\
  \ PostScript 到正确数据格式的转换将在服务器上完成。\n\n对于不支持 PostScript 且直接连接到系统或通过`Direct TCP connection`或`Remote\
  \ Windows server`选项访问的打印机，你必须选择打印机驱动程序（在下一步中解释）。\n\n\n\n\n\n如果您的打印机未使用 PostScript\
  \ 并且需要驱动程序，请选择 `CUPS` 驱动选项。在使用其他打印系统时，此选项可能标记为 `Webmin driver`、`Redhat driver` 或\
  \ `COAS driver`。无论如何，其旁边将有一个打印机型号列表，您可以从中选择打印机的品牌和型号。\n\n如果列表中没有该型号，请尝试选择具有相同制造商且型号最的条目（例如，如果您有一个\
  \ `FooTronic 810`，但只出现了 `FooTronic` 的 `800` 和 `1000` 型，请选择型号 `800`）。\n\n在打印系统中，打印机型号列表下可能还有其他选项，如\
  \ `DPI` 和纸张大小。选择适合您打印机的选项。\n\n最后，点击 `Create` 按钮。如果发生错误（例如无法连接远程打印服务器或无法创建打印机），将显示错误消息。否则，您将返回模块主页，该页面现在将列出您的新打印机。\n\
  \n如果您正在使用 `CUPS` 打印系统并为打印机设置了驱动程序，请点击列表上的新打印机名称进入打印机编辑表。在底部，打印机型号列表下方，有一组额外的字段用于配置纸张大小、打印质量和纸张类型等。由于这些字段取决于所选打印机的类型，因此它们不会显示在打印机创建表上。将纸张大小、`DPI`\
  \ 等设置为适合系统的设置。默认设置通常会产生快速的低质量输出，因此如果您想在光纸上使用打印机的照片级模式，则需要更改它们。当完成对打印机特定选项的更改后，点击页面底部的\
  \ `Save` 按钮。\n\n现在可以使用 `lpr` 命令或任何支持打印的程序对新创建的打印机进行打印。\n\n### 22.4 编辑现有打印机\n\n使用\
  \ `Webmin` 或其他工具创建的任何打印机都可以 `Printer Administration` 模块进行编辑。您还可以临时禁用打印机，使其不再接受作业或将作业发送到打印机。要执行此操作，请按照以下步骤进行：\n\
  \n点击模块主页上的打印机名称。这将进入编辑表，与图 22.2 所示的创建表类似。\n\n要防止用户向打印机提交新作业，请将 `Accepting requests?`\
  \ 字段设置为 `No`。您可以在 `Why not` 字段中输入打印机不可用的原因，该原因将显示给尝试使用 `lpr` 命令的用户。然而，某些打印系统可能无法使用此字段。\n\
  \n要停止打印机打印或向远程服务器发送作业，请将 `Printing enabled?` 字段设置为 `No`。如果打印机将要离线维护，这将非常有用，因为当该字段再次设为\
  \ `Yes` 时，队列仍将接受待打印作业。您还可以在 `Why not` 字段中输入原因，该原因将在使用 `lpq` 命令显示打印队列时显示。\n\n页面上的所有其他字段都可以像第\
  \ 22.3 节“添加新打印机”所说明的那样更改。唯一的例外是打印机名称，打印机创建后无法修改。\n\n当完成对打印机详细信息的更改后，点击 `Save` 按钮。更改将立即生效，并将返回模块主页。\n\
  \n也可以通过点击编辑表上的 `Delete` 按钮删除现有打印机。打印机队列中的任何作业也将被删除。\n\n### 22.5 管理打印作业\n\n当作业提交到打印机时，它会被放置在打印机队列中。只有当作业成功打印或发送到远程服务器后，它才会被移除。在具有许多用户或打印机较的系统上，如果提交作业的速度于打印速度，队列可能会变得很大。\n\
  \n可以使用此 `Webmin` 模块列出打印机队列中的作业、查看其内容或删除它们。要管理这些任务，请完成以下步骤：\n\n在模块主页上，点击您想要管理的打印机的\
  \ `Jobs` 列下的 `list` 链接。这将带您进入一个列出所有正在打印或等待打印的作业的页面。\n\n要查看打印作业的内容，请点击其大小。由于大多数作业是以\
  \ `PostScript` 格式提交的，您的浏览器必须具有可以处理该格式的插件或辅助程序。\n\n这对于远程打印机或某些打印系统是不可能的。\n\n要删除打印作业，请点击第一列中的\
  \ ID。要移除队列中的所有作业，请点击 `Cancel all print jobs` 按钮。\n\n打印作业页面还可以用于向打印机提交测试页面，以便在 `Webmin`\
  \ 内部验证其运行正常。要执行此操作，请按照以下步骤进行：\n\n在模块主页上，点击您想要打印测试页面的打印机的 `Jobs` 列下的 `list` 链接。\n\
  \n点击 `Print Test Page` 按钮。\n\n选择 `Black and white Postscript page`、`Colour Postscript\
  \ page` 或 `Plain ASCII text` 选项使用 `Webmin` 的内置测试页之一。或者，选择 `Any uploaded file` 并使用旁边的字段选择系统上的文件进行打印。\n\
  \n点击 `Print page` 按钮将所选页面提交到打印机。将显示一个显示 `lpr` 命令输出的网页，以便您可以查看是否发生任何错误。\n\n### 22.6\
  \ 配置打印机管理模块\n\n像许多 `Webmin` 模块一样，`Printer Administration` 有多个选项，可以通过点击主页上的 `Module\
  \ Config` 链接进行配置。您可以安全地更改的选项列在配置页的 `Configurable options` 下，如表 22.1 所示：\n\n#####\
  \ 表 22.1. 模块配置选项\n\n| 显示启用和接受状态而不是驱动程序？ | 如果此选项设置为 `Yes`，模块主页将显示每台打印机当前是否正在打印以及是否接受新作业。如果设置为\
  \ `No`（默认值），则将显示每个打印机的驱动程序。 |\n| 刷新打印队列之前等待的秒数 | 如果没有选择 `Don't refresh`，那么如果打印作业页面在您的浏览器中显示，它将被定期刷新。此选项输入的数字是每次刷新之间的秒数。\
  \ |\n| 按什么对打印机排序 | 如果选择 `Name`，则模块主页上的打印机列表将按名称排序。否则，如果选择了 `Order in system`（默认值），它们最可能按创建顺序显示。\
  \ |\n| 在主页上显示 | 正常情况下，模块主页包含关于每台打印机的大量信息，例如其目标、驱动程序和描述。在某些拥有大量打印机的系统上，这可能会非常慢，特别是在\
  \ Solaris 上。如果为此选项选择了 `Just printer names`，则主页上将仅显示每台打印机的名称，从而加快速度并减小页面大小。 |\n|\
  \ 在主页上显示队列中的作业数？ | 此字段可在模块主页上显示每台打印机队列的大小。然而，如果您有大量打印机，可能会导致页面显示变慢。 |\n\n如果您升级了系统上的打印服务器守护进程，将需要更改\
  \ `System configuration` 下的其他模块配置选项，以便其由 `Webmin` 管理。最常见的升级是 `CUPS`，它可以安装在几乎任何 Linux\
  \ 或 UNIX 系统上，并作为许多发行版的可选包可用。如果您升级到 `CUPS`，请按照以下步骤更改模块配置：\n\n点击模块主页上的 `Module Config`\
  \ 链接进入配置表。\n\n在 `Printer configuration style` 和 `Printer driver style` 菜单中均选择 `CUPS`。\n\
  \n\n\n\n将 `Printers` 文件字段更改为 `None`，因为在使用 `CUPS` 时 Webmin 不需要该项。\n\n将包含接口程序的 `Directory`\
  \ 设置为可以找到所有 `CUPS` 的 `.ppd` 驱动文件的基础目录。这通常是 `/usr/share/cups/model*`，但可能取决于安装方式而有所不同。\n\
  \n将启动调度器的 `Command` 设置为启动 `cupsd` 所需的初始化脚本命令，例如 `/etc/init.d/cups start`。如果没有此类初始化脚本，请将其保持为\
  \ `Determined by printer style`（由打印机类型决定）。\n\n同样，将停止调度器的 `Command` 设置为停止 `cupsd`\
  \ 的初始化脚本命令，例如 `/etc/init.d/cups stop`。\n\n确保更改更改后运行的 `Command` 应设置为 `None`。\n\n\
  点击 Save（保存）按钮返回模块主页。现在你应该能够使用 CUPS 创建和编辑打印机了。\n\n另一个你可能想要升级的流行打印系统是 `LPRng`，特别是如果你运行的是带有糟糕打印服务器守护进程的\
  \ UNIX 变体系统。如果是这样，必须按照以下步骤重新配置模块：\n\n点击模块主页上的 Module Config（模块配置）链接进入配置表单。\n\n将\
  \ `Printer configuration style`（打印机配置样式）设置为 `LPRng`。\n\n将 `Printer driver style`（打印机驱动样式）设置为\
  \ `Webmin`。确保系统中已安装 `ghostscript`，因为 Webmin 使用它为非 PostScript 打印机创建驱动。\n\n将 `Printers`\
  \ 文件设置为 `/etc/printcap`。\n\n将包含接口程序的 `Directory` 更改为 `None`。\n\n将 `smbclient` 和\
  \ `gs` 命令的完整路径分别输入 `Path to smbclient` 和 `Path to ghostscript` 字段。\n\n如果 `ghostscript`\
  \ 是手动编译安装的，你可能需要将 `Ghostscript font directories` 和 `Ghostscript library directories`\
  \ 选项设置为包含 PostScript 字体文件的冒号分隔目录列表。这些选项分别用于设置 `GS_FONTPATH` 和 `GS_LIB` 环境变量。\n\n\
  将所有剩余选项设置为其默认值。\n\n最后，点击 Save（保存）按钮返回模块主页。\n\n### 22.7 模块访问控制\n\n赋予用户查看打印队列和删除作业的权限，但不允许创建或编辑打印机，通常很有用。一旦你创建了具有打印机配置模块访问权限的用户或编辑了现有用户赋予其权限，就可以使用\
  \ Webmin 用户模块来实现。第 52 章详细解释了如何操作。\n\n一旦存在拥有模块权限的用户，你可以按照以下步骤限制他可以管理的打印机以及他对这些打印机可以的操作：\n\
  \n在 Webmin 用户模块中，点击用户或组名称旁边的 `Printer Administration`（打印机管理）。\n\n将 `Can edit module\
  \ configuration?`（可以编辑模块配置？）字段设置为 `No`，这样用户无法更改打印系统或配置文件的路径。\n\n你可以通过更改 `Printers\
  \ this user can configure`（此用户可以配置的打印机）字段为 `Selected`（已选）并从列表中选择，来限制用户可以编辑目标、驱动和其他属性的打印机。不过不会阻止他管理这些打印机上的作业，因为步骤\
  \ 4 中的选项控制了该项。\n\n要防止用户管理任何打印机，选择 `Selected`，但不要从列表中选择任何打印机。请注意，能够编辑或创建打印机的用户可以通过指定自己的驱动程序（该程序通常以\
  \ root 权限运行）或让打印机写入系统文件（如 `/etc/passswd`）来获取 root 权限。\n\n限制用户管理打印作业的打印机，将 `Can cancel\
  \ print jobs?`（可以取消打印作业？）字段改为 `Only on selected printers`（仅限所选打印机）并从下方列表中选择。或者，选择\
  \ `No` 以阻止他取消或查看任何打印机上的作业内容。\n\n可以使用 `Manage print jobs owned by`（管理所有者为）字段进一步限制可以管理的作业。默认情况下，任何用户在允许的打印机上提交的作业都可以取消。如果选择了此字段中的最后一个选项并在相邻字段输入用户名，则只有该用户的所有作业可以管理。\n\
  \n你还可以选择 `Current Webmin user`（当前 Webmin 用户）选项，这将用户限制为与 Webmin 用户同名的 UNIX 用户提交的作业。\n\
  \n防止 Webmin 用户创建新打印机，将 `Can add new printers?`（可以添加新打印机？）选项设置为 `No`。如果不允许他编辑现有打印机，则应这样做。\n\
  \n由于没有理由需要用户停止或重启计划打印进程，将 `Can stop or start scheduler?`（可以停止或启动调度器？）字段设置为 `No`。\n\
  \n要隐藏主页上用户不允许编辑或管理作业的打印机，将 `Show non-configurable printers?`（显示不可配置的打印机？）选项设置为 `No`。\n\
  \n要阻止用户通过 Webmin 打印页面，将 `Can print test pages?`（可以测试页？）选项设置为 `No`。\n\n最后，点击 Save（保存）按钮激活你的新限制。\n\
  \n### 22.8 其他操作系统\n\n除了 Linux 之外，打印机配置模块适用于其他几个 UNIX 操作系统。由于每个系统都有独特的打印系统，该模块的用户界面略有不同，就像\
  \ `CUPS` 和 `LPRng` 等 Linux 打印系统之间存在差异一样。\n\n支持的操作系统及其差异：\n\n**Sun Solaris 和 SCO\
  \ UnixWare**: Solaris 和 Unixware 的打印系统与 CUPS 非常相似，因此打印机配置模块的用户界面几乎相同。一个区别是在创建打印机的表单上增加了\
  \ `Driver accepts`（驱动接受）字段，它告诉打印系统驱动程序可以处理的数据格式。在大多数情况下，你应该选择 `postscript`，或者如果你希望所有数据直接传递到打印机而不经过过滤，请选择\
  \ `other` 并在旁边的字段中输入 `binary`。\n\n另一个独特的功能是可以使用创建表单上的 `Access control`（访问控制）字段控制哪些用户可以使用每个打印机。这些\
  \ UNIX 变体中缺失的是 `Direct TCP connection destination type`（直接 TCP 连接目标类型）。\n\n**HP/UX\
  \ 和 SGI Irix**: 这些操作系统上的打印系统缺少 Linux 上的许多选项，例如 `Description`（描述）字段和 `Banner`（横幅）选项。一旦创建打印机，无法更改目标或驱动。不支持通过直接\
  \ TCP 连接打印。\n\n**FreeBSD, NetBSD, OpenBSD 和 Apple MacOS X**: 这些操作系统上的打印系统与 Linux\
  \ 上的 `LPRng` 非常相似。因此，你无法指定默认打印机或输入打印机不可或离线的原因。但是，可以指定最大打印作业大小并为打印机输入替代名称。\n\n由于列出的操作系统都不包含打印机驱动程序，Webmin\
  \ 必须使用 `ghostscript` 包自行创建。如果模块检测到未安装 `gs` 命令，则在创建或编辑打印机时无法选择驱动程序。同样，为了向 Windows\
  \ 服务器打印，必须安装 Samba `smbclient` 程序并在模块配置页面设置其路径。\n\n对于所有列出的操作系统，模块默认将使用它们的标准打印系统。因此，如果你安装了不同的包（如\
  \ `CUPS` 或 `LPRng`），则需要更改模块配置以便 Webmin 能够正确配置。详情请参见第 22.6 节“配置打印机管理模块”。\n\n### 22.9\
  \ 总结\n\n本章解释了如何使用 Webmin 配置你的 Linux 系统以打印到本地连接的打印机或连接到某种打印服务器的打印机。完成后，你应该理解 UNIX\
  \ 打印的工作原理、驱动程序如何设置，以及各种可用打印系统之间的差异。你还应该知道如何限制模块的访问，以便某些 Webmin 用户只能管理特定的打印机或作业。\n\
  \n## 第 23 章。语音邮箱服务器配置\n\n\n\n\n\n如果你的系统连接了带有语音功能的调制解调器，请阅读本章以学习如何使用 `vgetty` 程序将其设置为答录机。\n\
  \n## 23.1 语音信箱服务器模块\n\n如果你的 Linux 系统连接了支持语音录制和回放的调制解调器，可以使用 `Voicemail Server` 模块将你的计算机变为强大的答录机。并非所有的调制解调器都支持语音，因此在尝试使用此模块之前，请检查用户手册确保你的设备支持。某些需要特殊驱动程序（通常称为\
  \ `Winmodems`）的调制解调器在 Linux 上无法使用，因此无法与此模块配合。然而，几乎所有连接到串口的现代外部调制解调器都能正常工作。模拟串口的内部调制解调器也可以。\n\
  \n作为答录机运行的 Linux 系统比传统机器灵活得多。你可以存储的消息数量仅限于硬盘空间，可以从网络上的任何主机查看和收听消息，并且在接收消息时可以采取操作（例如将其通过电子邮件发送到地址）。像任何答录机一样，你的系统可以配置为在响铃次数后接听，这样你就有机会在答录系统介入之前接听电话。\n\
  \n实现这一切的底层软件称为 `vgetty`，它是第 18 章“PPP 服务器配置”中 `mgetty` 调制解调器控制程序的修改版本。并不是所有的 Linux\
  \ 发行版都包含它，但你可以从 [`rpmfind.net/](http://rpmfind.net/default.htm) 或开发者网站 [`alpha.greenie.net/mgetty/](http://alpha.greenie.net/mgetty/default.htm)\
  \ 下载。Webmin 会向 `/etc/inittab` 文件添加条目，以便 `vgetty` 在启动时启动并在相应的串口串口。这与第 18 章中解释的设置\
  \ `mgetty` 的方法完全相同。\n\n在 Webmin 的 `Hardware`（硬件）类别下可以找到 `Voicemail Server` 模块，进入后，主页面仅显示四个图标。如果模块检测到未安装\
  \ `vgetty`，主页面将显示错误消息，告诉在使用该模块之前需要安装它。所有的实际配置表单和页面都可以通过点击相应的图标进入。\n\n## 23.2 将系统配置为答录机\n\
  \n假设你已将调制解调器连接到系统的串口并插入电话线，且它支持语音录制和回放，你可以按照以下步骤将系统设置为答录机：\n\n在 `Voice Server` 模块的主页上，点击\
  \ `Serial Port Configuration`（串口配置）图标。这将带你进入列出所有已配置 PPP 或语音信箱端口的页面。\n\n点击 `Add a\
  \ new serial port`（添加新串口）链接，将弹出图 23.1 所示的端口配置表单。\n\n### 图 23.1 串口配置表单。\n\n![](img/23fig01.jpg)\n\
  \n将 `Serial device`（串口设备）设置为你的调制解调器或空调制线连接的端口。串口 1 对应设备文件 `/dev/ttyS0`，依此类推。对于不以\
  \ `/dev/ttyS` 开头的串口设备调制（如 USB 调制解调器），选择 `Other device`（其他设备）并在菜单旁的文本字段中输入完整的设备文件路径。\n\
  \n如果 `Rings before answering`（接听前的响铃次数）字段可见，你可以取消勾选 `Global default`（全局默认），并输入系统在接听电话前等待的响铃次数。然而，这仅适用于此串口上的调调器。如果字段不可见或你想在所有调制解调器上使用相同设置，可以在步骤\
  \ 6 中代替设置响铃次数。\n\n如果 `Answer mode`（接听模式）字段可见，将其保持为 `Global default` 即可。\n\n点击页面底部的\
  \ `Create`（创建）按钮返回串口列表。\n\n返回模块主页并点击 `Voice Server Options`（语音信箱服务器选项）图标。这将带你进入图\
  \ 23.2 所示的表单。\n\n### 图 23.2 语音信箱服务器选项表单。\n\n![](img/23fig02.jpg)\n\n在 `Rings before\
  \ answering` 字段中输入服务器接听电话前等待的响铃次数，除非在步骤 2 中已设置。如果你有多个调制解调器并想为每个设置不同的响铃次数，请勾选 `Can\
  \ be set for each serial port`（可以为每个串口设置）框。\n\n在 `Answer mode` 字段中，确保至少有一个菜单设置为\
  \ `Voice`（语音）。如果此电话线仅用于接听语音通话，你应该将第一个菜单设置为 `Voice` 并留空另外两个。\n\n要限制在你的系统中留下的消息长度，请更改\
  \ `Maximum message length`（最大消息长度）字段。输入过高的数字会导致所有磁盘空间被极长消息占用。\n\n要防止保存极短的消息，请更改\
  \ `Minimum message length`（最小消息长度）字段。如果拨叫者在该字段指定的时间通过之前挂断，录制的消息将不会保存到文件中。\n\n`Silence\
  \ threshold level`（静音阈值水平）决定了 `vgetty` 将录制音频视为静音的音量百分。如果 `Remove silence from end\
  \ of messages?`（删除消息末尾静音？）字段设置为 `Yes`，则消息末尾任何低于阈值的音频将被截断。\n\n要设置录制消息和调制解调器播放问候信息的音量水平，请分别设置\
  \ `Recording volume level`（录音音量水平）和 `Playback volume level`（回放音量水平）。都可以设置为 `Default`（默认）或音量百分比。然而，并非所有的调制解调器都支持回放和录制音量配置。\n\
  \n要将新录制的消息通过电子邮件发送给你，将 `After recording message` 字段更改 `Email in WAV format to`（以\
  \ WAV 格式邮件到），并在相邻字段中输入你的地址。你也可以选择 `Run command on message file`（在消息文件上运行命令）并在字段中输入程序路径。每当录制消息时，程序将以\
  \ RMD 格式的消息文件作为第一个命令行参数运行。\n\n点击 `Save`（保存）按钮记录你的新配置并返回模块主页。\n\n点击 `Apply Configuration`（应用配置）按钮通知\
  \ `vgetty` 和 `init` 使用新配置。你现在可以尝试拨打你的电话来测试电话是否接听以及是否录了消息。由于尚未设置问候信息，当系统准备好录制时你只会听到嘟嘟声。\n\
  \n有几种错误在 `vgetty` 尝试与你的调制解调器通信并接听电话之前无法检测。幸运的是，详细日志会写入文件 `/var/log/vgetty.*ttyname*`，以便你可以看到哪里出了问题。如果你的调制解调器在第一个串口上，日志文件将是\
  \ `/var/log/vgetty.ttyS0`。以 root 身份登录并对其使用 `tail f` 命令在来电时进行监控，这样你可以看到发生了什么。\n\n\
  如果你的调制解调器不支持语音回放和录制，一旦点击 `Apply Configuration` 按钮，日志中就会写入相应的错误消息。如果发生这种情况，除了购买新的调制解调器外你别无他法。另一个常见问题是无法播放问候信息，由于你的调制解调器不支持相同的波特率或压缩格式。参见第\
  \ 23.4 节“设置问候信息”有关如何解决此问题的详情。\n\n## 23.3 收听录制的消息\n\n每次收到消息时，它都会 RMD 格式写入 `/var/spool/voice/incoming`\
  \ 目录下的文件。幸运的是，这些文件可以使用 `vgetty` 自带的 `rmdtopvf` 和 `pvftowav` 命令轻松转换为更有用的格式（如 WAV）。当你使用\
  \ Webmin 收听消息时，它会自动为你完成转换。\n\n要查看和管理录制的消息，请按照以下步骤操作：\n\n\n\n\n\n在模块的主页上，点击 `Received\
  \ Messages`（接收的消息）图标。这将带您进入一个列出所有可用记录消息及其大小和音频格式的页面。最近记录的消息显示在表格顶部。\n\n要听消息，只需点击\
  \ `Received at`（接收时间）列下的日期和时间。`Webmin` 将其转换为 `WAV` 格式，如果您的浏览器已配置播放此格式的音频文件，您应该立即听到。\n\
  \n要删除消息，勾选表格中每条消息左侧的框，并点击 `Delete selected messages`（删除所选消息）按钮。\n\n即使邮件已发送到某些地址或接收时对其运行了程序，它仍然显示在此页面上。\n\
  \n### 23.4 设置欢迎消息\n\n当您的系统接听时，它可以播放一段欢迎消息，让拨号者知道他们找到了谁。消息结束后，`vgetty` 还会播放一个短促的哔哔声，让拨号者知道何时开始说话。但是，默认情况下没有欢迎消息，因此拨号者只会听到提示声。由于这不太友好，您可以使用\
  \ `Webmin` 设置一个或多个消息，在接听电话时播放。如果设置了多个消息，`vgetty` 将为每次通话随机选择其中一个。\n\n要添加欢迎消息，请遵循以下步骤：\n\
  \n在模块的主页上，点击 `Greeting Messages`（欢迎消息）图标。这将带您进入列出所有现有消息（如果有）的页面。\n\n使用其他程序（例如 Windows\
  \ 录音器应用程序）记录 `WAV` 格式的消息。确保采样率与 `Received Messages` 页面上显示的记录消息的速率相同。如果不是，您的调制调器可能无法播放它。\n\
  \n回到 `Webmin`，使用 `Upload message`（上传消息）字段选择 `WAV` 文件。从旁边的菜单中，选择与记录消息相同的音频格式和位数。再次强调，所选格式必须正确，您的调制调器才能播放消息。\n\
  \n点击 `Upload message` 按钮，将文件转换为 `RMD` 格式并添加到欢迎消息列表中。\n\n可以通过点击列表中的文件名来听现有的欢迎消息，这将导致\
  \ `Webmin` 在将选定的音频文件发送到您的浏览器之前将其转换回 `WAV` 格式。如果您不再想使用某些欢迎消息，只需选择它们旁边的复选框并点击 `Delete\
  \ selected messages` 按钮。\n\n还有另一种创建欢迎消息的方法，可以避免任何格式或采样率问题，并且不需要连接连接声卡或麦克风。可以通过以下步骤将现有的记录消息转换为欢迎消息：\n\
  \n拨打自己的自动应答机，并将欢迎消息作为录音留下。\n\n在模块的主页上，点击 `Received Messages` 图标并在列表中找到新录音。\n\n选择其旁边的复选框并点击\
  \ `Convert selected to greetings`（将所选转换为欢迎消息）按钮。这将从列表中移除该消息并将其添加到 `Greeting Messages`\
  \ 页面的列表中。\n\n这样转换消息唯一的问题是它们的音频质量可能较差，或者开头和结尾有静音或电话声。\n\n### 23.5 总结\n\n本章解释了连接了合适调制器的任何\
  \ Linux 系统如何转换为简单的语音邮箱或应答机。它还涵盖了消息的播放、欢迎消息的记录以及自动电子邮件通知的配置。\n\n## 第 24 章 远程 Shell\
  \ 登录\n\n本章解释了通过 `Webmin` 让远程 shell 登录您系统的各种方法。\n\n### 24.1 SSH/Telnet 登录模块\n\n如果您的系统运行着\
  \ `SSH` 或 `telnet` 服务器（大多数系统默认都如此），您可以使用 `Webmin` 内置的 `SSH` 和 `telnet` 客户端模块进行普通的\
  \ shell 登录。当您使用它登录时，连接来自运行 Web 浏览器的客户端，就像您运行了普通的 `telnet` 客户端程序一样，因为该模块使用了 Java\
  \ applet。这意味着如果有防火墙阻止从客户端对 `telnet` 或 `SSH` 的访问，此 `Webmin` 模块将无法绕过它。\n\n要使用该模块，点击\
  \ Webmin 中 `Others`（其他）类别下的对应图标。主页仅包含一个 Java applet，它默认将与运行 `Webmin` 的服务器建立 `telnet`\
  \ 连接。如果您的浏览器不支持 Java，将显示错误消息。如果 applet 加载并能够连接，它应该显示登录提示，只需点击 applet 并输入您的用户名和密码即可登录。图\
  \ 24.1 显示了一个示例。\n\n##### 图 24.1。SSH/Telnet 登录模块。\n\n![](img/24fig01.jpg)\n\n并不是所有的\
  \ Linux 版本都默认运行 `telnet` 服务器。许多新发行版包含 `SSH` 服务器，这意味着 applet 将无法建立 `telnet` 连接。如果发生这种情况，您需要按照第\
  \ 24.2 节“配置 SSH/Telnet 登录模块”进行进行重新配置。\n\n### 24.2 配置 SSH/Telnet 登录模块\n\n该模块有多个控制用户界面和连接的配置选项。要编辑它们，点击主页左上角的\
  \ `Module Config`（模块配置）链接。可编辑选项见表 24.1。\n\n##### 表 24.1 模块配置选项\n\n| 连接主机名 (Hostname\
  \ to connect to) | 通常此字段设置为 `Automatic`（自动），这告诉 `SSH/telnet` applet 连接到加载它的 `Webmin`\
  \ 服务器。您可以输入不同的主机名或 IP 地址以登录不同的系统，但由于 Java applet 连接位置的限制，这通常不起。 |\n| 连接端口 (Port\
  \ to connect to) | 当此字段设置为 `Default`（默认）时，applet 将连接到 `telnet` 的 `23` 端口或 `SSH`\
  \ 的 `22` 端口。这些是那些服务器的标准端口，因此此字段几乎可以保持不变。然而，如果它们在您的系统中已被更改，则必须更改此模块配置选项，以便 applet\
  \ 可以连接。 |\n| 连接类型 (Connection type) | 要让 applet 建立 `SSH` 连接，请选择 `Secure Shell`。如果要继续使用\
  \ `telnet`，请选择 `Telnet`。如果选择了 `SSH` 模式，您的系统必须运行支持协议版本 1 的 `SSH` 服务器，因为 applet 不支持\
  \ 2。 |\n| Applet 大小 (Applet size) | 此字段有三个选项：`80x24 characters` applet 的 own 将为宽\
  \ 80 个字符高 24 行，与标准的 `telnet` 或 shell 窗口相同。`Maximum`（最大）applet 将占据浏览器中的所有可用空间。`Custom\
  \ size`（自定义大小）由下一个字段输入的值决定。如果启 `Separate window mode`（独立窗口模式）选项，此字段无效。 |\n| 自定义宽\
  \ x 高 (Custom width x height) | 如果 `Applet size` 字段设置为 `Custom size`，您必须在此字段中输入由\
  \ `x` 分隔的宽度和高度，例如 `640x480`。 |\n| 字体大小 (Font size in points) | applet 使用的字体大小。如果从\
  \ `Default`（默认）11 磅设置更改，applet 中将容纳更多或更少的行列。 |\n| 独立窗口模式 (Separate window mode)\
  \ | 如果设置为 `Yes`，模块页面上将只有一个标记为 `Connect`（连接）的按钮。只有在点击时，才会打开一个独立的窗口通过 `SSH` 或 `telnet`\
  \ 登录。窗口打开后可以手动调整大小。 |\n| 测试 telnet 或 SSH 服务器 (Test telnet or SSH server) | 通常此字段设置为\
  \ `Yes`，这会导致 `Webmin` 检查系统中是否真的运行了 `SSH` 或 `telnet` 服务器。由于防火墙可能会阻止系统连接自身，此测试有时会错误失败，您可以设置为\
  \ `No` 来禁用测试。 |\n\n### 24.3 命令 Shell 模块\n\n\n\n\n\nSSH/Telnet 登录模块的一个问题是，如果存在某种防火墙阻止了系统的\
  \ telnet 或 SSH 连接，它将无法连接。尽管 Webmin 的其他部分可以通过 HTTP 连接正常工作，但该 Applet 使用的端口可能不可用。虽然在\
  \ Webmin 中可以完成几乎所有在命令行中完成的操作，但有时拥有一个用于执行 UNIX 命令的 shell 提示符是有用的。\n\n为了绕过阻止 SSH 或\
  \ telnet 连接的防火墙限制，你可以使用 `Others`（其他）类别下的 `Command Shell`（命令行 shell）模块。它允许你在 `Execute`（执行）命令按钮旁字段中输入\
  \ shell 命令，这些命令会在点击按钮或按下回车键时运行。命令的所有输出都显示在页面顶部的 `Command history`（命令历史）部分。\n\n你可以通过从\
  \ `Execute previous command`（执行上一个命令）按钮旁的菜单中选择旧命令，然后点击它来重新运行。如果命令历史变得太大，可以使用 `Clear\
  \ history`（清除历史）按钮将其清除。这不会影响以前运行命令的菜单。\n\n该模块最大的局限是无法运行如 `vi`、`passwd` 和 `telnet`\
  \ 这样的交互式命令。一旦命令开始，不支持向命令提供输入，因此你仅限于 `cp`、`ls` 和 `rm` 等非交互式程序。\n\n### 24.4 Shell\
  \ In A Box 模块\n\n该模块结合了 SSH/Telnet 登录和 Command Shell 的优点，它允许你创建一个通过 HTTP 连接隧道传输的完全交互式登录，从而避免任何防火墙限制。它没有作为标准\
  \ Webmin 模块之一包含，但你可以从 [`www.webmin.com/download/modules/shellinabox.wbm.gz`](http://www.webmin.com/download/modules/shellinabox.wbm.gz)\
  \ 下载它。有关如何安装，请参见第 51 章。\n\n进入该模块后，其主页面完全被一个 Java Applet 占据。要启动登录过程，点击右下角的 `Connect`（连接）按钮。窗口顶部将出现正常的登录提示符，允许你输入用户名和密码进行登录并获取\
  \ shell 提示符。完成后，只需点击 `Disconnect`（断开连接）按钮即可。\n\n该模块最大的缺点是它使用了编译后的 Linux x86 代码，因此无法在其他\
  \ UNIX 系统或非 PC 硬件上运行。由于其发出的 HTTP 请求频率很高，它还会消耗服务器大量的 CPU 时间。\n\n### 24.5 总结\n\n本简单章节解释了如何使用\
  \ Webmin 通过 SSH 或 telnet 登录你的系统，即使你没有这些协议之一的普通客户端。它还提到了从 Web 界面执行简单命令模块，以及在 SSH\
  \ 或 telnet 连接被阻塞时远程登录。\n\n## 第 25 章运行自定义命令\n\n本章介绍了 Webmin 的 Custom Commands（自定义命令）模块，该模块可用于创建运行常用\
  \ shell 命令的按钮。\n\n### 25.1 自定义命令模块\n\n大多数系统管理员喜欢创建 shell 脚本来执行常见任务，例如备份数据库或添加某种新用户。由于每个系统和组织都不同，总会有某些任务是\
  \ Webmin 这样的通用工具无法像简单的自定义脚本那样轻松完成的。遗憾的是，命令行运行的脚本对于没有经验的用户来说很容易使用。\n\nCustom Commands\
  \ 模块允许为 shell 脚本和命令创建简单的 Web 界面，以便在 Webmin 中点击按钮即可运行。它还允许为每个命令定义不同类型的参数，这些参数可以由用户输入并替换到\
  \ shell 命令中。这可以根据用户在运行前所做的选择，为运行的脚本提供额外的参数或输入。\n\n该模块的另一个功能是定义文件编辑器，以便通过频繁更改的文件可以通过\
  \ Webmin 的 Web 界面进行编辑。你还可以定义在文件编辑之前之后运行的命令，以便在编辑之前对其进行验证、复制或备份。\n\n该模块最有用的功能可能是其对访问控制的支持。你可以授予其他\
  \ Webmin 用户使用部分或全部命令和编辑器的权限，而仅给你和其他信任的管理员创建和编辑命令的权限。这意味着其他用户只能执行你允许他们执行的脚本并编辑文件，但具有完全的\
  \ root 权限。\n\n与其他大多数模块不同，此模块不单独服务器或服务的配置，因此在所有可以运行 Webmin 的 UNIX 版本上，它具有完全相同的用户界面和功能。\n\
  \n当你从 `Others` 类别进入模块时，其主页面会显示所有现有自定义命令和文件编辑器及其参数。图 25.1 显示了一个系统示例，该系统定义了一个文件编辑器和八个命令，其中两个带有参数。然而，如果你还没有使用过该模块，页面将是空的。\n\
  \n#### 图 25.1. 自定义命令模块。\n\n![](img/25fig01.jpg)\n\n你只需点击主页面上的任何按钮即可运行显示的任何命令。然而，如果命令有参数字段或选项，你必须在运行之前填写这些内容或做出相应选择。点击按钮后，你将进入一个显示命令所有输出的页面，你可以查看它是成功还是失败了。\n\
  \n要使用文件编辑器，只需点击主页面上的对应按钮。这将带你进入一个显示当前文件内容的编辑表单，你可以随意更改。完成后，点击文本框下方的 `Save`（保存）按钮以写入新的文件内容。\n\
  \n### 25.2 创建新命令\n\n要创建一个可以使用模块主页面上的按钮运行的新命令，请遵循以下步骤：\n\n点击现有按钮上方或下方的 `Create a\
  \ new custom command`（创建新自定义命令）链接。这将弹出如图 25.2 所示的创建表单。\n\n#### 图 25.2. 创建新的自定义命令。\n\
  \n![](img/25fig02.jpg)\n\n在 `Description`（描述）字段中为你的命令输入简短描述。你输入的任何文本将显示在主页面命令按钮上。你还可以在下方较大的文本框中输入额外文本（包括\
  \ HTML 标签），显示在按钮下方。\n\n在 `Command`（命令）字段中，输入你想执行的 shell 脚本或命令。支持所有标准 shell 元字符，如\
  \ `|`、`&`、`<` 和 `>`。输入多个命令时，用 `;` 或 `&&` 分隔。\n\n如果你的命令有参数（见第 10 步），它们在命令运行时将转换为环境变量。因此，如果你有一个名为\
  \ `foo` 的参数，命令字符串中所有 `$foo` 出现的地方将被替换为用户在该参数输入的任何内容。例如，允许用户查看系统上任何用户的 finger 命令可能像\
  \ `finger $user`。\n\n默认情况下，命令将在该模块的 Webmin 目录下运行。要更改此，取消勾选 `Run in directory`（在目录运行）字段中的\
  \ `Default`，并在旁边的文本框中输入不同的路径。\n\n在 `Run as user`（以用户运行）字段中，输入应以此身份运行命令的 UNIX 用户。你可以选择\
  \ `Webmin user`，这将使其以运行该命令的 Webmin 用户同名的 UNIX 用户身份运行。\n\n当执行命令时，它通常无法访问 UNIX 用户通过\
  \ telnet 或 SSH 登录时拥有的环境变量。然而，如果你检查了 `Use user's environment`（使用用户环境）选项，那么用户在 `.profile`、`.cshrc`\
  \ 和其他登录文件中设置的所有变量都将可用。Webmin 使用 `su` 运行命令，这会切换到该用户，执行其 shell 然后执行命令。\n\n\n\n\n如果你的命令产生的\
  \ HTML 输出在运行时显示在浏览器中，请将 `Command outputs HTML?`（命令是否输出 HTML？）字段设置为 `Yes`。否则，Webmin\
  \ 将转义输出中的所有 HTML 标签，对于生成普通文本的命令来说这是正确的做法。\n\n要控制新命令在模块主页上的位置，请为 `Ordering on main\
  \ page`（在主页排序）选项输入一个数字。命令按数字排序，数字越大越靠前。如果选择 `Default`（默认），则排序数字视为零。\n\n如果你没有为自定义命令设置排序数字，它们将按照创建的顺序显示。\n\
  \n为了防止用户在点击按钮时看到正在运行的实际 Shell 命令，请将 `Hide command when executing?`（执行时隐藏命令？）字段设置为\
  \ `Yes`。如果你的命令包含密码或其他你想向用户隐藏的敏感信息，这是一个好主意。\n\n要让命令出现在 Usermin 的自定义命令模块中，请将 `Available\
  \ in Usermin?`（在 Usermin 中可用？）字段设置为 `Yes`。有关如何安装和配置 Usermin 的更多信息，请参阅第 47 章。\n\n\
  如果你希望命令具有用户可以在主页设置的参数，你需要填写 `Command parameters`（命令参数）部分。表 25.1 中的每一行定义一个参数，对于每个参数必须输入以下信息：\n\
  \n- **Name**（名称）：该参数的简短唯一名称，可用于 `Command` 字段（前缀加 `$` 以指示应替换用户输入的值）。名称应仅由字母、数字和下划线（`_`）组成。\n\
  - **Description**（描述）：在模块主页上标记参数的文本。它可以包含包括 HTML 标签在内的任何字符，但长度不宜长。\n- **Type**（类型）：此菜单控制参数在模块主页上的显示方式以及允许的输入。最常见的选择是\
  \ `Text`（文本），但所有可用选项及其含义见第 25.3 节“参数类型”。\n- **Quote parameter?**（参数加引号？）：如果设置为 `Yes`，用户输入的值在替换之前将用引号（`\"\
  \ \"`）括起来。\n\n在创建新命令时，仅提供一个输入单个参数的空行。要添加更多参数，你需要在保存后重新编辑该命令。\n\n最后，当你完成新命令详情的输入后，点击\
  \ `Create` 按钮。只要表单没有错误，你将返回模块主页，新命令按钮在那里应该是可见的。\n\n一旦创建了命令，你可以通过点击模块主页下方的 `Edit\
  \ command`（编辑命令）链接对其进行编辑。上述所有字段都可以更改，并添加额外的参数。修改完成后，点击页面底部的 `Save` 按钮。若要删除命令，请点击右下角的\
  \ `Delete` 按钮。\n\n### 25.3 参数类型\n\n对于命令中的每个参数，你可以在 `Type` 列下的菜单中选择一种类型。可用选项及其含义如表\
  \ 25.1 所示。\n\n#### 表 25.1. 自定义命令参数类型\n\n| Type | Description |\n| :--- | :--- |\n\
  | **Text** | 参数是一个文本字段，可以输入任何字符串。 |\n| **User** | 参数是一个小型文本字段，旁边有一个用户选择按钮。只有有效的\
  \ UNIX 用户可以从弹出用户窗口中输入或选择。 |\n| **UID** | 与 `User` 选项类似，但输入的用户名将转换为 `UID`，以便在运行时替换到命令中。\
  \ |\n| **Group** | 参数是一个小型文本字段，旁边有一个组选择按钮。只有有效的 UNIX 组可以输入或选择。 |\n| **GID** | 与\
  \ `Group` 选项类似，但输入的组名将转换为 `GID`，以便在运行时替换到命令中。 |\n| **File** | 带有文件选择器按钮的文本字段。不会进行验证来检查输入的是实际文件还是有效的文件名。\
  \ |\n| **Directory** | 与 `File` 选项类似，但选择按钮会弹出一个目录选择器。 |\n| **Option..** | 参数显示为一对单选按钮，标记为\
  \ `Yes` 和 `No`。如果选择 `Yes`，命令创建表单上类型菜单旁字段中输入的文本将替换到命令字符串中。如果选择 `No`，则替换空字符串。这种类型对于可选的\
  \ Shell 命令参数非常有用，例如在 `rm $force /some/directory` 这样的命令中。在此示例中，`force` 参数将使用 `Option`\
  \ 类型，并在类型菜单旁文本字段中输入 `f`。 |\n| **Password** | 与 `Text` 类型类似，但使用 HTML 密码字段来隐藏用户输入的文本。\
  \ |\n| **Menu..** | 如果选择此类型，参数将显示为下拉菜单，其中的选项从类型菜单旁字段中输入的文件读取。文件中的每一行定义一个菜单项。如果行中包含逗号，逗号后的文本是用户在菜单中看到的内容，而逗号之前的文本是命令执行时设置给参数的实际值。示例文件可能包含以下行：\
  \ ||```\njcameron,Jamie Cameron\nemily,Emily Cameron\n```\n在模块主页上显示的菜单将包含 Jamie\
  \ Cameron 和 Emily Cameron 选项，但传递给命令的实际参数将是 `jcameron` 或 `emily`。 |\n| **Upload**\
  \ | 此类型显示一个文件上传输入，用户可以使用它选择其 PC 上的文件。运行命令时，文件将被上传到服务器并放置在临时文件中。该文件的完整路径将作为命令运行时的参数，因此可以将其复制到某些目录、转换为不同的格式或你喜欢的任何操作。当命令完成后，临时文件将被删除。\
  \ |\n| **Text box** | 此类型的参数显示为文本框，可以输入任何内容。但是，在参数传递给你的命令之前，任何换行符都会替换为空格。 |\n\n\
  ### 25.4 创建新文件编辑器\n\n要在模块主页上添加一个编辑文件的新按钮，请按照以下步骤操作：\n\n1. 点击现有按钮上方或下方的 `Create a\
  \ new file editor` 链接。这将弹出图 25.3 所示的编辑器创建表。\n\n##### 图 25.3. 创建新的文件编辑器。\n\n![](EBPS/Images/25fig03.jpg\n\
  \n2. 在 `Description` 字段输入要编辑文件的简短描述。你输入的任何文本将显示在编辑器按钮上。你还可以在下方较大的文本框输入附加文本（包括 HTML\
  \ 标签），显示在按钮下方。\n\n3. 在 `File to edit` 字段输入要编辑的文件的全路径。该文件并不一定存在。\n\n4. 若要在保存时更改文件所有者，请将\
  \ `File ownership` 字段设置为 `User`，并在相邻字段中输入 UNIX 用户名和组名。这对于编辑尚未创建的文件特别有用，可以确保新创建的文件所有权正确。\n\
  \n5. 如果你将字段设置为 `Leave as is`（保持不变），则保存时不会更改文件所有权。新创建的文件将由 `root` 所有。\n\n6. 若要在保存时更改文件的访问权限，请将\
  \ `File permissions` 字段设置为 `Set to octal`，并在相邻字段中输入权限（如 `700` 或 `664`）。如果你选择 `Leave\
  \ as is`，保存时不会更改文件权限。新创建文件的权限取决于 Webmin 进程的 `umask`。\n\n7. 若要在用户保存文件之前运行某个命令，请填写\
  \ `Command to run before saving` 字段。这可能用于制作备份副本、从 `RCS` 检出文件或任何你能想到的操作。 |\n\n\n\n\
  同样，若要在文件保存后立即运行某个命令，请填写 `Command to run after saving`（保存后运行的命令）字段。这对于验证文件内容、将其复制到另一个系统或将其回\
  \ RCS 非常有用。\n\n要控制新编辑器按钮在模块主页上的位置，请为 `Ordering on main page`（主页排序）选项输入数字。命令和编辑器的排序方式是数字大的靠前。如果选择\
  \ `Default`（默认），则假设顺序数字为零。\n\n如果你没有为任何文件编辑器设置顺序数字，它们将按照创建顺序显示。\n\n若要让编辑器出现在 Usermin\
  \ 的 `Custom Commands`（自定义命令）模块中，请将 `Available in Usermin?`（可用于 Usermin？）字段改为 `Yes`。有关如何安装和配置\
  \ Usermin 的更多信息，请参阅第 47 章。\n\n最后，点击 `Save`（保存）按钮。如果表单没有错误，这将返回模块主页，那里将包含一个新编辑器的按钮。\n\
  \n创建编辑器后，可以通过点击模块主页上的 `Edit file editor`（编辑文件编辑器）链接对其进行编辑。完成修改后，点击页面底部的 `Save`（保存）按钮。若要删除编辑器，请点击右下角的\
  \ `Delete`（删除）按钮。\n\n### 25.5 模块访问控制\n\n`Custom Commands` 模块中的访问控制选项旨在允许 Webmin\
  \ 管理员赋予其他用户运行选定命令的权限，但不允许他们编辑或创建命令。从安全角度来看，赋予不受信任的用户创建自己的自定义命令的权限是没有意义的，因为这将允许他们以\
  \ root 身份运行任何命令，从而破坏整个系统的安全。同样，你可以限制 Webmin 用户可以使用的文件编辑器，并防止其创建新编辑器。\n\n一旦你创建了具有\
  \ `Custom Commands` 模块权限的用户或组（如第 52 章所述），限制其访问权限的步骤如下：\n\n在 `Webmin Users` 模块中，点击你想要授予权限的用户或组旁边的\
  \ `Custom Commands`。这将弹出该模块的访问控制表单。\n\n将 `Can edit module configuration?`（可以编辑模块配置？）字段改为\
  \ `No`（否）。\n\n除非你想让用户运行所有命令并使用所有编辑器，否则将 `Commands this user can run`（此用户可以运行的命令）字段设置为\
  \ `Selected`（已选），并从提供的列表中选择允许其使用的命令。你也可以选择 `All except selected`（除已选外的全部），并从列表中选择不允许用户使用的命令。所有其他命令均可用。\n\
  \n将 `Can create and edit commands?`（可以创建和编辑命令？）字段改为 `No`（否）。\n\n点击 `Save`（保存）按钮。访问控制设置将激活，你将返回\
  \ `Webmin Users` 模块的主页。\n\n如果你想向大量用户授予选定自定义命令和编辑器的访问权限，更好的解决方案可能是安装 Usermin，它允许任何\
  \ UNIX 用户登录。任何 `Available in Usermin?`（可用于 Usermin？）字段设置为 `Yes` 的命令将在 Usermin 的\
  \ `Custom Commands` 模块中可见，且其工作方式完全相同。有关 Usermin 以及如何配置它以限制哪些 UNIX 用户可以运行自定义命令的更多信息，请参阅第\
  \ 47 章。\n\n### 25.6 配置自定义命令模块\n\n该模块有几个配置选项（如表 25.2 所示），你可以通过点击其主页上的 `Module Config`（模块配置）链接来进行编辑。\n\
  \n#### 表 25.2 模块配置选项\n\n| 主页显示 | 当此选项设置为 `All commands and parameters`（所有命令和参数）时，模块主页的行为将如本章所述。每个命令、编辑器及其参数都将显示。然而，如果选择了\
  \ `Links to commands`（命令链接），页面将仅显示命令及其描述的表格。要实际设置参数并运行命令，你必须先点击它进入单独的页面。如果你有大量带有许多参数的命令，并希望保持模块主页的大小，这种模式非常有用。\
  \ |\n| 文件编辑器窗口宽度 | 此字段可更改文件编辑器所使用的文本框的宽度。 |\n| 文件编辑器窗口高度 | 此字段可更改文件编辑器文本框的高度。 |\n\
  | 文件编辑器换行模式 | 此选项控制换行模式，影响超过文件编辑器文本框宽度的行。默认的 `Soft`（软换行）会导致行在显示时折行，但在实际保存时不会。`Hard`（硬换行）选项也会保存的文件中折行。`Off`（关闭）选项将完全关闭换行。\
  \ |\n\n### 25.7 总结\n\n读完本章后，你应该能够创建自己的自定义命令和编辑器。你还将理解如何限制对这些命令和编辑器的访问，以便特定的 UNIX\
  \ 用户可以通过 Web 界面运行它们。\n\n## 第 26 章 Webmin 文件管理器\n\n本章文档了文件管理器模块及其功能，例如复制和粘贴、ACL 和\
  \ EXT 编辑。\n\n### 26.1 文件管理器\n\n在 Webmin 的 `Others`（其他）类别下有一个与其他模块完全不同的模块。它不是配置某些服务器或服务，而是允许用户通过\
  \ Java applet 查看和操作文件。用户界面类似于旧版 Windows 资源管理器：左侧是目录树，右侧是当前目录下的文件列表。顶部工具栏上有一排按钮，用于对文件执行各种操作。图\
  \ 26.1 显示了一个示例。\n\n##### 图 26.1. 文件管理器\n\n![](img/26fig01.jpg)\n\n与其他模块不同，此模块只有一个页面，完全被\
  \ Java applet 占据。要返回 Webmin 主菜单，你必须点击左上角的索引箭头。\n\n文件管理器模块的用户界面在所有 UNIX 版本上几乎完全相同。唯一的区别是，某些\
  \ `EXT`、`ACL` 和 `Attr` 按钮（在第 26.10 节“编辑文件 ACL”中描述）在某些操作系统上可能不存在。这是因为那些 UNIX 变体的文件系统不支持这些按钮允许配置的扩展属性。\n\
  \n### 26.2 导航目录和查看文件\n\n当你首次加载文件管理器时，右侧面板将显示系统根目录的内容。要进入另一个目录，只需双击列表中的该项。要返回上级目录，请双击当前目录列表顶部的\
  \ `..` 链接。\n\n你也可以通过点击左侧面板树中的目录来查看该目录的内容。双击将在树中打开该目录，使其下方的任何子目录都出现。每当你使用右侧面板进入目录时，它也会在左侧的树中同步打开。同样，当双击\
  \ `..` 链接返回父目录时，树中的旧目录将关闭。\n\n你还可以通过在右侧目录列表方的文本框中输入路径来跳转到系统上的任何目录。假设该路径确实存在，Webmin\
  \ 将在树中打开所有父目录，并在右侧列表中显示其内容。\n\n\n\n\n为了加快用户界面的速度，文件管理器会缓存您在使用时查看的所有目录内容。这意味着，如果服务器上创建、修改或删除了文件，在您点击工具栏上的\
  \ `Refresh` 按钮之前，这些更改不会反映在目录列表中。\n\n您可以通过双击右侧面板中的任意文件来显示您的系统上该文件的内容。这将打开一个独立的浏览器窗口，并由浏览器显示文件的内容。因此，浏览器支持的任何文件类型都可以使用文件管理器查看。\n\
  \n如果您想从 Webmin 系统下载文件到运行浏览器的宿主机，请在双击文件时同时按住 `shift` 键。浏览器应该提示您保存文件，而不是打开窗口显示内容。您也可以通过从右侧面板中选择文件并点击文件管理器窗口顶部工具栏上的\
  \ `Save` 按钮来强制下载。\n\n### 26.3 操作文件\n\n文件管理器模块允许您像任何其他文件管理器一样重命名、移动和复制文件。要选择要操作的文件，只需点击右侧面板中的它即可。要选择多个文件，可以在点击时按住\
  \ `control` 键，或按住 `shift` 键选择整个范围。\n\n要将文件移动到不同的目录，请选择一个或多个文件并点击工具栏上的 `Cut` 按钮。然后导航到目标位置并点击\
  \ `Paste` 按钮。如果存在同名文件，Webmin 将提示您重命名粘贴的文件以避免冲突。如果您选择不重命名，目标目录中的同名文件将被覆盖。\n\n要复制文件，请在右侧面板中选择它们并点击\
  \ `Copy` 按钮。然后转到您想要复制到的目录并点击 `Paste`。与移动文件一样，系统会提示您重命名任何与目标目录中已存在冲突的文件。通过在不同的目录中粘贴，可以创建同一个文件的多个副本。要在同一目录中创建文件的副本，只需选择它，点击\
  \ `Copy` 然后点击 `Paste`，并输入新文件名。\n\n您可以通过选择一个或多个文件和目录并点击工具栏上的 `Delete` 按钮来删除它们。在实际删除之前，将显示一个列出所有选中文件的确认窗口。当点击窗口中的\
  \ `Delete` 按钮时，所有选定的文件、目录及其内容将被永久删除。\n\n可以通过在右侧面板中选择单个文件并点击工具栏上的 `Rename` 按钮来重命名单个文件。这将弹出一个窗口，其中包含当前文件名和一个输入新名称的文本框。如果新名称与相同目录中的现有文件相同，在点击窗口中的\
  \ `Rename` 按钮时，它将被覆盖。\n\n### 26.4 创建和编辑文件\n\n文件管理器模块提供了两种创建新文件的方法：您可以从头开始创建一个文本文件，也可以从运行\
  \ Web 浏览器的宿主机上传数据。要创建一个新的空白文本文件，点击 `Delete` 按钮右侧工具栏上的 `New document` 按钮。这将弹出一个窗口，您可以在其中输入文件的完整路径及其内容。编辑完成后，点击文件创建窗口底部的\
  \ `Save` 按钮。\n\n要从运行浏览器的 PC 上传文件，点击工具栏上的 `Upload` 按钮。这将打开一个带有两个字段的小型浏览器窗口。`File\
  \ to upload` 字段用于选择 PC 上的文件，而 `Upload to directory` 字段用于输入将文件上传到的目录。当两个字段都填写完毕后，点击\
  \ `Upload` 按钮将文件发送到您的 Webmin 服务器。上传完成后，目录列表将更新以显示新文件。\n\n由于许多人在 Windows 操作系统上运行浏览器，而\
  \ Windows 使用的文本文件格式与 UNIX 不同，因此上传窗口中有一个将上传的文件转换为正确格式的选项。只有在从 Windows 系统上传文本文件时，才将\
  \ `Convert DOS newlines?` 字段设置为 `Yes`。在上传二进制文件时启用转换会导致文件损坏。\n\n文件管理器还可以用于编辑系统上的现有文本文件。要执行此操作，请在右侧面板中选择文件并点击工具栏上的\
  \ `Edit` 按钮。将显示一个其当前内容的窗口，允许您按所愿编辑文件。完成后，点击 `Save` 按钮将其写回服务器。请勿尝试编辑和保存非文本文件，因为它们的内容将损坏。\n\
  \n任何现有文件都可以通过在右侧面板中选择它并点击工具栏上的 `Rename` 按钮来重命名。这将弹出一个显示当前文件名并提示新名称的窗口。输入新名称后点击窗口中的\
  \ `Rename` 按钮即可更改。\n\n### 26.5 编辑文件权限\n\nUNIX 文件系统上的每个文件或目录都由单个用户和组所有，并有一组决定谁可以访问它的权限。通常这些权限通过\
  \ `chown` 和 `chmod` 命令更改，但您也可以在文件管理器中编辑它们。要执行此操作，请从右侧面板中选择单个文件并点击工具栏上的 `Info` 按钮。这将显示图\
  \ 26.2 所示的权限窗口。\n\n#### 图 26.2 文件权限窗口。\n\n![](img/26fig02.jpg)\n\n窗口的 `File` 部分显示其完整路径、大小、类型和最后修改日期。`Permissions`\
  \ 部分包含复选框，用于控制哪些用户可以读取、写入和执行文件。这些权限与您可以在命令行使用 `chmod` 命令更改的权限相同。当它们被选中或取消选中时，通常用于\
  \ `chmod` 的八进制权限将在下方的 `Octal` 字段中。\n\n要更改文件的所有者，请在窗口 `Ownership` 部分的 `User` 和 `Group`\
  \ 字段中输入新的用户和组名或 ID。对于可执行文件，您还可以使用 `Execute as user` 和 `Execute as group` 字段控制程序以哪个用户运行。由于这些选项对应于\
  \ `chmod` 权限，更改它们也将更新 `Octal` 字段。\n\n编辑目录时，可用的复选框略有不同。执行权限被 `list` 取替，增加了一个 `Only\
  \ owners can edit files` 框，并且 `Execute as` 复选框被 `Files inherit group` 取替。这些都对应于任何系统管理员应该熟悉的标准\
  \ UNIX 文件权限。\n\n如果更改目录的权限和所有权，您还可以选择更改包含的任何子目录和文件的这些属性。`Apply changes to` 菜单决定权限应用于哪些文件和目录，共有三个选项：\n\
  \n- **This directory only**：所选的所有权和权限将仅应用于选定的目录。\n- **This directory and its files**：所有权和权限将应用于所选目录及其包含的所有文件。子目录及其文件将不受影响。\n\
  - **This directory and all subdirectories**：所有权和权限将应用于所选目录及其包含的所有文件和子目录。\n\n如果点击\
  \ `Info` 按钮时选中的文件实际上是符号链接，窗口将包含一个额外的 `Link to` 字段，如果您想编辑链接目标，可以更改它。更改权限和所有权字段是没有意义的，因为在\
  \ UNIX 系统上无法对符号链接编辑。\n\n### 26.6 创建链接和目录\n\n可以通过遵循以下简单步骤使用文件管理器在当前目录下创建新的符号链接：\n\
  \n\n\n\n导航到您想要创建链接的目录，并点击工具栏上的 `New link` 按钮。\n\n在弹出的窗口中，在 `Link from` 字段中输入新链接文件的路径。\n\
  \n在 `Link to` 字段中输入您想要链接指向的现有文件或目录的路径。\n\n点击 `Create` 按钮即可在服务器上创建它并将其添加到目录列表中。\n\
  \n也可以通过以下步骤创建新目录：\n\n导航到您希望显示新子目录的父目录，并点击工具栏上的 `New directory` 按钮。\n\n在 `New directory`\
  \ 字段中输入该目录的完整路径。\n\n点击 `Create` 按钮进行创建。\n\n### 26.7 查找文件\n\n可以使用文件管理器在您的系统中搜索符合特定标准的文件或目录。如果您知道一个文件的名称但不知道它所在的目录，或者想查找由特定用户所有或大于特定大小的文件，这将会非常有用。请按照以下步骤搜索文件：\n\
  \n点击工具栏上的 `Find` 图标，这将打开搜索窗口。\n\n在 `Search directory` 字段中，输入您要查找的文件所处的目录。若要搜索整个系统，只需输入\
  \ `*/*`。但在具有大型文件系统的服务器上，这可能需要很长时间。\n\n若要按文件名搜索，在 `For files matching` 字段中输入模式。可以是类似于\
  \ `.txt*` 或 `*foo?.c`的内容。如果该字段为空，文件名将不会包含在搜索标准中。\n\n要查找特定用户所有的文件，在 `Owned by user`\
  \ 字段中输入用户名或 ID。\n\n同样，要查找组所有的文件，在 `Owned by group` 字段中输入其组名或 ID。\n\n要将搜索限制为普通文件、目录或其他类型的文件，请从\
  \ `File type` 字段中进行选择。\n\n如果您想查找大于特定大小的文件，将 `File size` 字段更改为 `More than`，并在相邻字段中以字节为单位输入最小大小。要查找小于特定大小的文件，选择\
  \ `Less than` 并在对应的字段中输入最大大小。\n\n为了防止检查挂载在搜索目录下的文件系统，将 `Search past mounts` 选项设置为\
  \ `No`。如果您希望避免搜索 NFS 文件系统，这将非常有用，因为 NFS 比从本地磁盘挂载的文件慢得多。\n\n最后，点击 `Search Now` 按钮。搜索完成后，所有符合所有所选标准的文件和目录将在窗口的\
  \ `Search results` 标签下显示。您可以双击其中一个，让文件管理器自动导航到包含该文件的目录并在右侧面板中选中它。\n\n要进行另一次搜索，点击返回\
  \ `Search criteria` 标签并按照之前的步骤操作。\n\n在后台，文件管理器的搜索功能使用 UNIX `find` 命令来定位符合您输入的标准的文件。所有可用选项都对应\
  \ `find` 的命令行选项，例如 `name`、`-user` 和 `group`。\n\n### 26.8 编辑 EXT 文件属性\n\n几种 UNIX\
  \ 文件系统类型支持除普通 `chmod` 和 `chown` 命令设置之外的特殊文件属性。在 Linux 的 `ext2` 和 `ext3` 文件系统上，每个文件都有几个特殊选项，通常使用\
  \ `chattr` 命令设置。假设您的系统至少有一个此类类型的文件系统，您可以按照以下步骤更改其包含的文件的 EXT 属性：\n\n在右侧面板中选择您想要修改的文件，并点击工具栏上的\
  \ `EXT` 按钮。这将弹出一个显示当前设置属性的窗口（假设该文件位于 `ext2` 或 `ext3` 文件系统上）。\n\n为了防止文件每次被读取时都更新最后访问时间，请开启\
  \ `Do not update access times` 选项。这可以防止频繁读取的文件产生大量无用的磁盘写入。\n\n为了阻止进程修改文件内容，请勾选 `Can\
  \ only append to file` 选项。这对于想要防止被截断或覆盖的日志文件非常有用。\n\n要让内核自动且透明地压缩文件内容，请开启 `Compress\
  \ data on disk` 选项。只有当您的内核支持透明文件压缩时，此选项才会生效。\n\n要防止 `dump` 备份命令（在第 14 章中解释）读取文件，请开启\
  \ `Do not backup with dump` 选项。\n\n要防止文件被修改或删除，请勾选 `Do not allow modification` 选项。\n\
  \n要让内核在删除文件时覆盖包含该文件的磁盘块，请开启 `Zero blocks when deleting` 属性。\n\n要强制将对文件的任何写入立即写入磁盘，请开启\
  \ `Always sync after writing` 选项。通常情况下，内核会在最方便的时候缓冲数据以写入磁盘。\n\n要让内核在删除文件时保存该文件的内容，请开启\
  \ `Save contents for undeletion` 选项。\n\n最后，点击 `Save` 按钮将更改应用到文件。\n\n由于之前的所有属性都可以在\
  \ shell 提示符下使用 `chattr` 命令更改，因此将文件设置为不可更改或仅允许追加模式无法对具有系统 root 权限的人员提供任何保护。\n\n###\
  \ 26.9 编辑 XFS 文件属性\n\n在 Linux 和 IRIX `xfs` 文件系统上，文件具有完全不同的属性。每个文件或目录都可以有无限数量的属性，每个属性仅是文本名称和值之间的映射。通常使用\
  \ `attr` 命令来编辑属性，但也可以按照以下步骤使用文件管理器：\n\n在右侧面板中选择您想要修改的文件，并点击工具栏上的 `Attrs` 按钮。这将弹出一个列出现有属性的窗口，除非文件所在的文件系统不支持它们。\n\
  \n要创建新属性，点击窗口底部的 `Add Attribute` 按钮。这将打开另一个窗口，用于输入可能包含多行的名称和值。\n\n在新属性窗口中点击 `Save`\
  \ 按钮将其添加到列表。\n\n要编辑任何现有属性，只需双击它。这将弹出一个与创建新属性时类似的窗口，但多了一个 `Delete` 按钮。\n\n当您完成对文件的属性创建和编辑后，点击列表下方的\
  \ `Save` 按钮。只有这样，它们才会实际应用到服务器上的文件。\n\n属性通常用于存储文件的元数据，例如描述、字符集或图标。请查看 `attr` 命令的手页，以获取更多关于属性用途的信息。\n\
  \n### 26.10 编辑文件 ACL\n\n标准的 UNIX 文件权限和所有权是控制谁可以访问文件的简单方法，但不灵活灵活。许多操作系统提供的另一种更优替代方案是\
  \ POSIX ACL。POSIX 是一种适用于许多 UNIX 系统的标准，ACL 代表访问控制列表（Access Control List）。通过为文件设置\
  \ ACL，除了标准的所有者和组之外，还可以向额外的用户或组授予权限。编辑目录的 ACL 时，还可以为该目录下新创建的文件设置默认值。\n\nIrish 和 Linux\
  \  `xfs` 文件系统类型支持 ACL，Solaris  `ufs` 文件系统也是如此。如果您安装了正确的内核补丁，Linux  `ext2` 和 `ext3`\
  \ 文件系统也可以支持 ACL。幸运的是，它们在所有操作系统上的实现方式几乎完全相同，因此 Webmin 中编辑它们的用户界面是相同的。\n\n\n\n访问控制列表（ACL）包含至少四个条目，每个条目向用户或组授予某些权限。每个条目授予的权限与\
  \ `chmod` 命令设置的读取、写入和执行/列出权限相同。文件的默认 ACL 包含其所有者用户、所有者组和其他 UNIX 用户的条目。这些与 `chmod`\
  \ 以及文件管理器中的信息（Info）窗口授予用户、组和其他人员的权限完全相同。\n\n所有 ACL 中出现的一个特殊条目是 `mask`（掩码），它定义了可以授予组所有者和任何其他用户（文件所有者除外）的最大权限。由于\
  \ `mask` 限制了其他条目可以授予的权限，你通常需要更改它以实现 ACL 的预期效果。每个 ACL 中必须存在且仅存在 `mask` 条目。\n\n最常用的\
  \ ACL 条目是授予除所有者之外的 UNIX 用户权限的条目。同样，也可以定义向另一个组授予权限的条目。此类条目的创建数量没有限制。\n\n目录的 ACL 可以包含几个特殊的默认条目，它们决定了在目录中创建的任何文件的初始\
  \ ACL。可以创建默认用户、组和掩码条目，且默认用户和组可以适用于特定用户或文件所有者。在大多数操作系统上，如果你创建了任何默认项，必须至少创建默认用户所有者、默认组所有者和默认掩码条目。\n\
  \n在 shell 提示符下，Linux 和 Solaris 使用 `getfacl` 和 `setfacl` 命令分别查看和更改 ACL。在 Irix 上，使用\
  \ `ls D` 命令显示 ACL，使用 `chacl` 命令设置 ACL。每当使用文件管理器查看或更改文件的 ACL 时，Webmin 会在服务器上调用这些命令。\n\
  \n### 若要编辑文件或目录的 ACL，请遵循以下步骤：\n\n1.  从文件管理器右侧面板的列表中选择该文件，并点击工具栏上的 ACL 按钮。这将弹出一个列出所有现有\
  \ ACL 条目的窗口，如图 26.3 所示。\n\n##### 图 26.3. ACL 窗口。\n\n![](img/26fig03.jpg)\n\n2. \
  \ 要添加新条目，在点击 `Add ACL of type` 按钮之前，先从其旁边的菜单中选择其类型。这将弹出另一个窗口，用于输入该条目适用的用户或组，以及授予它们的权限。一个\
  \ ACL 只能有一个 `mask` 或默认掩码条目，因此如果在已存在的情况下选择其中之一，将会显示错误消息。\n\n3.  对于用户或组 ACL 条目，你必须在\
  \ `Apply to` 字段中填写授予权限的用户或组名称。对于默认用户或默认组条目，`Apply to` 字段可以设置为 `File owner`（文件所有者）选项，也可以输入用户或组的名称。在前的情况下，权限将适用于目录中创建的任何新文件的所有者或组；在后者情况下，它们将授予所输入的用户或组。对于\
  \ `mask` ACL 条目，没有选择适用对象的字段。\n\n4.  在 `Permissions`（权限）字段中，勾选你想要授予该用户或组的权限。这些权限的含义与第\
  \ 26.5 节“编辑文件权限” 窗口中通过 `chmod` 命令设置的权限相同。\n\n5.  点击 `Save`（保存）按钮，将新的 ACL 条目添加到 ACL\
  \ 窗口的列表中。然而，它尚未保存到服务器上。\n\n6.  要编辑现有的 ACL 条目，只需双击列表中的该行。你可以更改其适用的用户或组（如果有）以及权限，但不能更改类型。点击\
  \ `Save` 按钮保留更改，或点击 `Delete` 按钮从列表中删除条目。并不是所有类型的 ACL 条目都可以删除，只有授予特定用户或组权限的或目录的各种默认类型可以删除。\n\
  \n7.  最后，点击 ACL 窗口底部的 `Save` 按钮，将 ACL 应用到服务器上的文件。由于并不是所有的条目组合在所有操作系统上都是有效的，如果你的\
  \ ACL 在某些方面错误，可能会显示错误消息。如果发生这种情况，请修复问题，或使用 `Cancel`（取消）按钮丢弃你的更改。\n\n### 26.11 共享目录\n\
  \n如果你的系统中安装了 Samba（在第 43 章中介绍），可以使用文件管理器将目录共享给 Windows 客户端。此外，如果你正在运行 Linux 或 Solaris，可以使用文件管理器通过\
  \ NFS 导出目录（如第 6 节所述）。在共享目录时，与专门为配置 Samba 和 NFS 设计的模块相比，文件管理器提供的选项很少。然而，它提供了一个简单得多的界面。\n\
  \n假设 Samba 已在你的系统上安装并运行正常，应使用以下步骤与 Windows 客户端共享目录：\n\n1.  在右侧面板中选择你想要共享的目录，并点击工具栏上的\
  \ `Sharing`（共享）按钮。这将弹出一个带有两个标签的窗口，标记为 `Windows NFS`。\n2.  在第一个标签下，开启 `Windows file\
  \ sharing enabled`（启用 Windows 文件共享）选项。\n3.  在 `Comment`（注释）字段中为该目录输入简短描述。\n4.  除非你想临时禁用共享，否则请确保\
  \ `Currently active?`（当前活动？）字段设置为 `Yes`（是）。\n5.  若要停止客户端向目录写入，请将 `Writable`（可写）字段更改为\
  \ `No`（否）。否则，将其设置为 `Yes`。\n6.  要允许客户端无需登录即可访问此共享，请将 `Guest`（访客）选项设置为 `Yes`。如果你将其设置为\
  \ `Only`（仅限），即使客户端登录了服务器，它们在该共享中也将被视为访客。如果你选择 `No`，客户端在不登录的情况下将无法访问它。\n7.  点击 `Save`\
  \ 按钮使你的新共享生效。在服务器上，Samba 配置文件中将添加一个条目。从现在起，当该目录出现在文件管理器时，其图标将带有一个字母 `S`，表示它是已共享的。\n\
  \n同样地，已经通过 Samba 共享的目录可以使用文件管理器进行修改。在 Webmin 中手动设置的任何选项都不会因为在该模块中编辑共享而受到影响，尽管在 `Windows`\
  \ 标签下仅可见其中少数几个选项。要关闭向 Windows 客户端的目录共享，只需选择 `Windows file sharing disabled`（禁用 Windows\
  \ 文件共享）选项并点击 `Save`。这将导致整个共享从 Samba 配置中被删除，包括所有选项。\n\n如果你正在运行 Linux 且系统中安装了 NFS\
  \ 服务器软件，可以按照以下步骤向 UNIX 客户端导出目录：\n\n1.  在右侧面板中选择你想要共享的目录，并点击工具栏上的 `Sharing` 按钮。在弹出的窗口中，选择\
  \ `NFS` 标签。\n2.  开启 `NFS file sharing enabled`（启用 NFS 文件共享）选项。\n3.  NFS 导出选项部分包含一个共享目录的主机表格，以及适用于这些主机的选项。在首次设置共享时，仅可用空行，因此如果你想添加多个行，必须保存导出并重新编辑。\n\
  4.  在 `Hosts` 列下的字段中输入你想要导出目录的主机名、IP 地址或 `netgroup`。\n5.  通过 `Options` 列下的菜单，你可以控制是否允许客户端写入目录，以及服务器如何处理客户端\
  \ UNIX 用户。第 6 节将更详细地解释这些菜单选项的含义。\n6.  点击 `Save` 按钮将导出设置写回服务器并自动重启 NFS 服务器。允许的 UNIX\
  \ 客户端将立即能够访问目录。\n7.  若要向目录添加另一个主机，请再次点击工具栏上的 `Sharing` 按钮并重复步骤 3 至 5。\n\n\n\n在 Solaris\
  \ 上，由于该操作系统提供的选项不同，通过 NFS 共享目录的步骤略有不同。步骤如下：\n\n在右侧窗格中选择您想要共享的目录，点击工具栏上的 `Sharing`\
  \ 按钮。在弹出的窗口中，选择 `NFS` 选项卡。\n\n启用 `NFS file sharing enabled` 选项。\n\n如果您愿意，可以在 `Description`\
  \ 字段中为此导出项输入简短描述。\n\n若要给某些主机该目录的只读访问权限，请将 `Read-only hosts` 字段更改为 `Listed`，并在下方字段中输入它们的主机名、IP\
  \ 地址或网络组（netgroups），并用空格隔开。您可以在网络地址前加上 `@` 来指定整个网络，例如 `@*192.168.1*`。\n\n若要给所有主机只读访问权限，请选择\
  \ `All` 选项。这意味着任何通过网络连接到您的系统都能够挂载该目录并读取其中的文件。\n\n若要给主机该目录的读写访问权限，请将 `Read-write\
  \ hosts` 字段更改为 `Listed`，并在下方的字段中输入它们的主机名、IP 地址、网络组或网络。\n\n选择 `All`，任何可以连接到您的系统都将读取和写入目录中的文件，从安全角度来看，这可能是一个坏主意。\n\
  \n默认情况下，即使是具有读或写权限的主机也无法以 root 用户身份访问文件。要授予某些主机此权限，请将 `Root access hosts` 字段更改为\
  \ `Listed`，并在下方字段中输入它们的主机名、地址、网络组或网络。有关 NFS 中 root 访问的细节，请参阅第 6 章。\n\n最后，点击 `Save`\
  \ 按钮保存新的 NFS 导出项使其生效。\n\n在 Linux 和 Solaris 上，一旦目录通过 NFS 共享，它在文件管理器右侧窗格中的图标将会被标记为字母\
  \ `S`。手动共享或通过 Webmin 的 NFS 模块共享的目录也会有类似的指示，您可以通过选择它们并点击 `Sharing` 按钮来编辑它们的设置。文件管理器不可配置的任何\
  \ NFS 选项将不受影响。\n\n在共享窗口中，您可以通过选择 `NFS file sharing disabled` 选项并点击 `Save` 按钮来关闭目录的\
  \ NFS 导出。该目录在 NFS 配置文件中的所有条目将被删除，并重启 NFS 服务器以使更改立即生效。\n\n### 26.12 模块访问控制\n\n与其他模块一样，文件管理器可以在\
  \ Webmin Users 模块（见第 52 章）中进行配置，以限制用户对它的访问权限。具体而言，您可以将 Webmin 用户限制在特定目录，并允许其以非 root\
  \ UNIX 用户的权限访问文件。目录限制功能特别强大，可以赋予用户在该目录内的 root 权限，但防止其查看或接触该目录之外的任何文件。\n\n一旦您创建了具有模块访问权限的\
  \ Webmin 用户，限制其访问权限的步骤如下：\n\n在 Webmin Users 模块中，点击要编辑访问控制限制的用户或组名称旁边的 `File Manager`。\n\
  \n若要更改访问文件时使用的 UNIX 用户，请在 `Access files on server as` 字段中输入新名称。或者，您也可以选择 `Same as\
  \ Webmin login` 选项，在这种情况下，Webmin 用户将拥有同名 UNIX 用户相同的权限。\n\n任何以非 root 权限使用该模块的人都无法使用其文件共享功能，因为这会留下一个巨大的安全漏洞。没有\
  \ Samba 或 NFS 模块访问权限的 Webmin 用户也无法配置文件共享。\n\n`Umask for new files` 字段控制新创建的文件和目录设置的权限。它包含一个八进制数字，该数字是用于\
  \ `chmod` 命令设置权限的数字的二进制反反。例如，`022` 的 `umask` 将赋予新文件 `755` 权限，而 `077` 的 `umask` 将赋予\
  \ `700` 权限。\n\n为了防止用户创建或编辑符号链接，并强制所有链接显示为它们指向的文件，请将 `Always follow symlink?` 字段更改为\
  \ `Yes`。在限制用户访问目录时应这样做，以便其无法创建指向目录之外文件的链接，然后在文件管理器中编辑或查看它们。\n\n要停止 Webmin 用户编辑或更改任何文件，将\
  \ `Read-only mode?` 字段设置为 `Yes`。\n\n若要将其限制在某些目录，请将它们输入 `Only allow access to directories`\
  \ 文本框。默认情况下，此字段包含根目录，如果让限制生效，您必须将其移除。当用户打开文件管理器时，看起来除了允许的目录以外，其他目录似乎不存在。然而，每个目录的完整路径仍然可见。\n\
  \n要自动包含同名 UNIX 用户的家目录，请勾选 `Include home directory of Webmin user` 选项。让文件管理器自动导航到第一个可访问目录，请勾选\
  \ `Open first allowed directory?` 选项。\n\n最后，点击 `Save` 按钮激活新的限制。\n\n如果您想让大量用户访问文件管理器，可能是安装\
  \ Usermin（见第 47 章）。它包含一个相同的文件管理器，该管理器始终以登录 Usermin 的 UNIX 用户身份运行，并可以限制在用户的家目录。\n\
  \n### 26.13 总结\n\n尽管如果您在 Linux 或或其他操作系统上用过类似的程序，Webmin 文件管理器应该是相当直观的，但它确实包含一些您可能从未见过的额外功能。阅读本章后，您应该能够在系统中导航，并执行编辑、复制和删除文件等基本操作。\n\
  \n## 第 27 章 Perl 模块\n\n本章介绍了如何使用 Webmin 在系统中安装新的 Perl 模块，以及如何查看或删除已安装的模块。\n\n###\
  \ 27.1 Perl 模块简介\n\nPerl 编程语言的许多函数位于单独的模块中，这些模块仅在 Perl 脚本需要它们时才加载。Perl 的标准发行版包含许多模块，但还有更多可以单独安装的模块。模块存在于各种用途，例如连接数据库、创建图像、使用网络协议和解析数据格式。\n\
  \n所有 Perl 模块都有短名称，如 `GD` 或 `Net::Telnet`。所有那些由双冒号分隔的多部分名称的模块都是相关模块家族的一部分，这些模块通常打包在一起。模块以\
  \ `tar.gz` 文件分发，在安装之前需要进行提取和编译。通常，单个分发文件将包含必须一起安装的多个模块。\n\nPerl 模块的最佳来源是 CPAN（综合\
  \ Perl 归档网络），位于 `www.cpan.org/`。它拥有几乎所有可用第三方模块的海量数据库，并且易于搜索。如果您知道所需的模块名称，Webmin\
  \ 可以直接从 CPAN 为您安装 Perl 模块。\n\n由于 Webmin 本身是用 Perl 编写的，它可以利用一些可选模块。例如，若要在 SSL 模式下运行\
  \ Webmin（如第 2 章所述），有必要安装 `Net::SSleay` 模块。要可靠地连接并管理 MySQL 和 PostgreSQL 数据库，您需要分别安装\
  \ `DBD::mysql` 和 `DBD:Pg` 模块。\n\n### 27.2 Webmin 中的 Perl 模块\n\n\n\n\n\n在 Webmin\
  \ 的“其他”（Others）类别下，有一个名为 `Perl Modules` 的模块，用于查看、安装和删除系统中的 Perl 模块。进入该模块后，主页面会列出所有当前安装的模块，如图\
  \ 27.1 所示。对于每个模块，系统都会显示其名称、简要描述、安装日期和子模块数量。“子模块”是 Webmin 的一个术语，指的是与主模块一起包含在 `tar.gz`\
  \ 文件中的 Perl 模块。\n\n### 图 27.1.Perl Modules 主页。\n\n![](img/27fig01.jpg)\n\n由于 Perl\
  \ 在所有 UNIX 版本上的行为相同，因此该 Webmin 模块在所有操作系统上具有相同的用户界面和功能。在非 Linux 系统上可能会遇到的唯一问题是缺少\
  \ C 编译器，这在安装 Perl 模块时通常是需要的。所有的 Linux 版本都包含 `gcc` 编译器作为标准，但许多商业 UNIX 变体并不带有免费的 C\
  \ 编译器。\n\n### 27.3 安装 Perl 模块\n\n如果你需要为 Webmin 安装新的 Perl 模块，或者为开发自己的脚本安装模块，可以使用此\
  \ Webmin 模块轻松地完成。安装 Perl 模块的步骤如下：\n\n模块主面的底部是安装表单。它提供了四种从 `tar.gz` 分发文件格式安装模块的源类型，但最常用且有用的是\
  \ `From CPAN`。只需选择它并在相邻的文本字段中输入模块名称（例如 `Net::Telnet`）。\n\n如果模块文件已存在于你的系统中，可以选择 `From\
  \ local file` 选项，并在旁边的字段中输入 `tar.gz` 文件的路径。或者，如果该文件位于你运行浏览器的系统中，请点击 `From uploaded\
  \ file` 并使用 `Browse` 按钮选择该文件。\n\n可以安装模块的最后一种源是另一个服务器上的 URL。要让 Webmin 为你下载，请选择 `From\
  \ ftp or http URL` 选项并在旁边的字段中输入该 URL。\n\n如果选择了 `From CPAN` 选项且这不是你首次从该源安装的模块，则模块名称字段旁边的\
  \ `Refresh module list from CPAN` 复选框将可见。如果勾选此框，Webmin 将再次从 CPAN 网站下载完整的模块列表以及找到它们的\
  \ URL。否则，它将使用上次下载的本地列表缓存。\n\n应定期下载模块列表，以确保本地副本保持更新。出于此原因，该框将默认每 30 天勾选一次，或者取决于你在\
  \ Webmin 模块配置中设置的任何周期。\n\n选择源后，点击 `Install` 按钮。这将带你进入一个页面，显示下载的 CPAN 模块列表的进度，如果有显示模块文件本身的进度。如果在\
  \ CPAN 上找不到该 Perl 模块，或者选择的 `tar.gz` 文件似乎格式不正确，将显示相应的错误信息。\n\n然而，如果模块文件已下载并成功验证，将显示类似于图\
  \ 27.2 所示的安装选项表。\n\n### 图 27.2. 模块安装选项表。\n\n![](img/27fig02.jpg)\n\n`Install` 动作字段决定了\
  \ Webmin 将执行模块安装过程的哪些步骤。可用选项有：\n\n- **Make only**（仅编译）：文件将被提取，使用命令 `perl Makefile.PL`\
  \ 生成 `Makefile`，然后运行 `make` 命令来构建它包含的模块。不会发生实际的安装。\n- **Make and test**（编译并测试）：与\
  \ `Make only` 模式类似，但编译后的模块还将使用 `make test` 命令进行测试。几乎所有的 Perl 模块都包含测试代码，以验证它们已正确编译。\n\
  - **Make and install**（编译并安装）：模块文件将被提取，构建其包含的模块，然后运行 `make install` 命令将编译后的文件复制到系统上相应的\
  \ Perl 目录。一旦安装完成，模块即可被其他 Perl 脚本和程序（如 Webmin）使用。\n- **Make, test, and install**（编译、测试并安装）：与\
  \ `Make and install` 模式类似，但在安装之前会在编译后的模块上运行 `make test` 命令，以验证它们是否构建正确。这是默认模式，但对于某些模块，如果测试阶段容易发生错误失败，这种模式可能是不恰的。\n\
  \n对于某些 Perl 模块，可能需要向 `perl Makefile.PL` 命令传递额外的参数才能使其正确构建。如果是这样，你可以将它们输入 `Makefile.PL\
  \ arguments` 字段。例如，`Net::SSLeay` 模块需要提供 OpenSSL 目录的路径作为参数，如果它尚未安装在标准目录中。但通常情况下，你不需要填写此字段。\n\
  \n某些 Perl 模块在运行 `perl Makefile.PL` 之前需要设置某些环境变量。如果你尝试安装的模块有此类情况，请在 `Makefile.PL\
  \ environment variables` 表中填写需要设置的名称和值。普通模块不需要任何特殊变量。\n\n要让 Webmin 执行第 4 步选择的编译和安装步骤，请点击表单底部的\
  \ `Continue with install` 按钮。这将带你进入一个页面，显示构建模块时运行的每个命令以及产生的任何输出或错误信息。只有在一切成功后，才会显示类似\
  \ `Make, test, and install of Net::Telnet success` 的消息。\n\n如果出现问题，请检查错误信息。许多 Perl\
  \ 模块提供了 C 库的接口并要求安装该库的包含文件。在许多 Linux 发行版中，这些文件位于不同的包中。例如，`Net::SSLeay` 使用 OpenSSL\
  \ 库，其包含文件在 `openssl-devel` 包中。请参考第 12 章“软件包”了解如何安装。\n\n### 27.4 查看和删除 Perl 模块\n\n\
  此 Webmin 模块的主页显示了系统中安装的所有可以找到 `.packlist` 文件的非核心 Perl 模块。遗憾的是，某些模块不会创建 `.packlist`\
  \ 文件，特别是从 RPM 包安装的模块。像这样的模块仍然可以在 Perl 脚本中使用，但无法通过 Webmin 查看或卸载。\n\n大多数 Perl 模块都包含供程序员在脚本中使用它们的\
  \ API 文档。要查看模块的文档，请遵循以下步骤：\n\n在主页上，点击模块列下的模块名称。这将带你进入一个页面，显示由 `perldoc` 命令生成的完整文档。并不是所有模块都有文档，因此在某些情况下将不会显示内容。\n\
  \n如果模块有子模块，它们也将列出来。每个子模块都可以点击其名称查看额外的文档。\n\n只要模块具有格式正确的 `.packlist` 文件，就可以使用 Webmin\
  \ 删除系统中的 Perl 模块。删除模块的过程如下：\n\n在主页上，点击模块名称进入文档页面。\n\n如果存在 `Uninstall module and\
  \ submodules` 按钮，点击它。如果没有显示该按钮，则 Webmin 无法删除此 Perl 模块。\n\n\n\n\n点击按钮后，将显示一个列出所有待删除文件的页面。要继续卸载，请点击确认页底部的\
  \ `Uninstall now` 按钮。该模块的所有文件都将被删除，您将返回到主页。\n\n正如第 27.3 节“安装 Perl 模块”提到的，某些 Perl\
  \ 模块是通过 RPM 包安装的。要删除其中一个模块，请改用 `Software Packages` 模块的删除功能。\n\n## 27.5 配置 Perl Modules\
  \ 模块\n\n此 Webmin 模块有一个您可能想要更改的配置选项，以及另外两个只有在您使用不同于常规 CPAN 网站的存储库进行 Perl 模块时才需要修改的选项。表\
  \ 27.1 列出的所有选项都可以通过点击主页面左上角的 `Module Config` 链接找到。\n\n### 27.6 总结\n\n本章解释了什么是 Perl\
  \ 模块以及如何使用 Webmin 为您的系统安装新模块。它还涵盖了查看现有模块的文档和其他信息的方法，并解释了如何删除不再需要的模块。\n\n### 表 27.1\
  \ 模块配置选项\n\n| 刷新 CPAN 模块列表前的天数 | 此字段决定了 Webmin 在建议再次下载 CPAN 模块列表之前等待的天数，正如第 27.3\
  \ 节“安装 Perl 模块”所述。偶尔刷新是一个好主意，因为当新版本的 Perl 模块发布时，其中包含的 URL 可能会过期。 |\n| CPAN perl\
  \ 模块列表 | 这些字段决定了 Webmin 从哪里下载 CPAN 模块列表，以及从哪里下载实际模块文件。默认设置可以完美运行，但由于全球有许多 CPAN 镜像站点，您可能希望将其更改为更靠近您的站点。如果是这样，`CPAN\
  \ perl modules list` 字段必须设置为镜像服务器上 `02packages.details.txt.gz` 文件的 URL。 |\n| CPAN\
  \ 模块基础 URL | `CPAN modules base URL` 字段必须包含一个目录的 URL，该目录下的模块文件按作者分类，目录通常以 `authors/id`\
  \ 结尾。 |\n\n## 第 28 章 使用 Webmin 进行状态监控\n\n本章介绍了 Webmin 的 `System and Server Status`\
  \ 模块，该模块可用于检查和报告系统宕机、服务器故障、网络中断和其他问题。\n\n### 28.1 System and Server Status 模块\n\n\
  此模块允许您监控运行在系统上的各种服务器和守护进程的状态，这样您就可以轻松地看到哪些运行正常，哪些已宕机。它还可以配置为按定期计划检查服务器状态，并在发生故障时向您发送电子邮件或运行命令。如果您的系统运行着其他人员依赖的关键服务器（例如\
  \ Web 服务器或 `DNS` 服务器），这将会非常有用。\n\n该模块还可以监控运行在其他主机上的服务器。这可以通过两种方式实现：通过对服务器运行的端口建立\
  \ `TCP` 或 `HTTP` 连接，或者与远程主机上的 `Webmin` 服务器通信并请求其检查服务器状态。后一种方法更强大，因为它可以监控磁盘空间以及不接受任何网络连接的守护进程等内容。\n\
  \n使用该模块监控您想要查看的每个服务器或服务都必须定义一个 `monitor`。每个监控器都有一个类型，指示它应该检查什么种类型的服务器，例如 `Apache`\
  \ 或 `BIND`。监控器还有额外的参数，其中某些特定于类型。该模块允许您创建许多不同类型的监控器，用于检查 `Sendmail` 或 `Squid` 是否正在运行、监控过量的网络流量或磁盘空间短缺，或者\
  \ ping 或连接某些主机。\n\n监控器可以运行在您使用该模块的系统上，也可以运行在运行 `Webmin` 的另一个服务器上。后者，必须在第 53 章介绍的\
  \ `Webmin Servers Index` 模块中定义该服务器。您还可以使用远程 `TCP`、`HTTP` 和 `ping` 监控类型检查未安装 `Webmin`\
  \ 的另一个系统。\n\n许多监控器使用其他 `Webmin` 模块来查找它们所检查的服务器和守护进程的位置。因此，其他模块必须正确配置并正常运行，相关的监控器才能正常工作。例如，如果您在与\
  \ Linux 发行版标准不同的目录下编译并安装了 `Apache`，则 `Apache` Web 服务器的模块配置将必须调整以使用正确的路径。否则，此模块将不知道去哪里查找\
  \ `Apache PID` 文件。\n\n当您从 Webmin 菜单的 `Others` 类别进入 `System and Server Status` 模块时，其主页将显示所有已配置监控器的表格。默认会定义几个常用服务器和服务的监控器，但您可以根据意愿对其进行编辑、删除或添加。图\
  \ 28.1 显示了模块主页的一个示例。\n\n### 图 28.1 System and Server Status 模块。\n\n![](img/28fig01.jpg)\n\
  \n对于每个监控器，都会显示描述、其运行的 `Webmin` 服务器以及其当前状态。监控器处于以下三种状态之一：\n\n- **Up**: 意味着被监控的服务器或服务运行正常。主页上的绿色勾钩表示此状态。\n\
  - **Down**: 意味着被监控的服务器已宕机。模块主页上的红色“X”表示此状态。\n- **Webmin down**: 意味着远程系统上的 `Webmin`\
  \ 已宕机，因此监控无法运行。模块主页上的红色“W”表示。\n- **Timed out**: 意味着监控器在 60 秒内没有返回结果，可能是因为它运行了一个永远不会完成的命令。主页上的红色时钟符号表示。\n\
  - **Not installed**: 意味着被监控的服务器未安装在您的系统中。此状态用带划线的黑色圆圈表示。\n\n默认情况下，每当您查看模块主页时都会查询每个监控器的状态。由于这可能花费很长时间，如果您有很多监控器或正在检查远程主机上的服务器状态，则有一个模块配置选项可以显示上一次计划检查的状态。\n\
  \n### 28.2 添加新监控器\n\n要让 `Webmin` 检查新服务器或服务的状态，您必须在此模块中添加额外的监控器。在执行此操作之前，您必须决定监控器的类型，该类型由您希望其检查的服务类型决定。请参阅第\
  \ 28.3 节“监控类型”获取所有可用类型列表及其用途和可选参数。\n\n一旦选定类型，可以按照以下步骤添加监控器：\n\n从模块主页上 `Add monitor\
  \ of type` 按钮旁菜单中选择类型。当您点击该按钮时，浏览器将显示添加新监控器的表单，如图 28.2 所示。\n\n### 图 28.2 添加一个新的\
  \ HTTP 监控器。\n\n![](img/28fig02.jpg)\n\n在 `Description` 字段中填写此监控器的简短描述，例如 `Office\
  \ web server`。这将出现在主页和任何状态电子邮件中。\n\n要让监控器在另一个 `Webmin` 服务器上执行，请从 `Run on host` 菜单中选择它。如果您在\
  \ `Webmin Servers` 模块（第 53 章介绍）中定义任何服务器，则不会出现菜单。\n\n如果您已启用计划监控并希望此服务被其定期检查，请确保 `Check\
  \ on schedule?` 字段设置为 `Yes`。如果设置为 `No`，则将关闭此特定监控器的计划检查。\n\n其他其他以 `Yes` 开头的选项允许您控制在监控器恢复或宕机时发送电子邮件。这些选项对应于\
  \ `Send email when` 字段的选项，如第 28.4 节“设置计划监控”所述。\n\n\n\n当计划的检查确定监控器已离线时，在 `If monitor\
  \ goes down, run command`（监控掉线时运行命令）字段中输入命令。这可以用于尝试重启被监控的服务器，或通过电子邮件以外的方法通知系统管理员。\n\
  \n你还可以在 `In monitor comes up, run command`（监控恢复时运行命令）字段中填入 shell 命令，以便在计划的检查确定服务已恢复时执行这些命令。\n\
  \n如果 `Run on host` 字段设置为另一个 Webmin 服务器，你可以选择在上述两个步骤中的启动和离线命令是在此系统还是远程服务器上运行。这由 `Run\
  \ commands on` 字段控制。\n\n如果监控器在本地运行，并检查配置在另一个 Webmin 模块中的服务器（且该模块存在多个克隆），则 `Module\
  \ to monitor`（要监控的模块）字段将出现在表单。此菜单用于选择监控器应该从哪个克隆中获取配置。例如，如果你在系统中安装了两个版本的 Apache，并设置了两个\
  \ Apache Webserver 模块来配置它们，你就可以在创建 Apache Webserver 监控器时选择要检查哪一个。\n\n有关模块克隆如何工作的更多信息，请参见第\
  \ 51 章。\n\n根据创建的监控器类型，此表单上可能有几个可以设置的额外选项。详情请参阅第 28.3 节“监控类型”。\n\n完成后，点击 `Create`（创建）按钮，即可创建监控器并将其添加到主页面。其状态应会立即显示。\n\
  \n可以通过点击主页面上的描述来编辑现有的监控器。编辑时，可以使用上述描述的所有相同字段，此外 true 一个 `Current status`（当前状态）字段，该字段指示服务是运行还是离线。对于某些监控器类型，在服务运行时会显示额外信息，例如被检查服务器的启动时间。\n\
  \n完成监控器编辑后，点击页面底部的 `Save`（保存）按钮以记录你的更改。要删除监控器，请使用 `Delete`（删除）按钮。无论何种方式，更改将立即生效。\n\
  \n### 28.3 监控类型\n\n系统和服务器状态（System and Server Status）允许你使用不同的监控类型监控许多不同的服务器和守护进程。所有类型都会执行某种检查，并根据检查是否通过返回成功或失败。在某些情况下，监控器可以返回第三个结果，指示被检查的服务器未安装，或其尝试执行的检查是不可能的。\n\
  \n可用类型、用途和额外参数如表 28.1 所示：\n\n### 表 28.1. 监控类型及其选项\n\n| 监控器 | 描述 | 参数 |\n| --- |\
  \ --- | --- |\n| Apache Web server | 通过查看 PID 文件确定 Apache 是否正在运行，使用 Apache Webserver\
  \ 模块中设置的配置。 | 无 |\n| BIND 4 DNS Server | 通过查看 PID 文件检查 BIND 版本 4 是否正在运行，使用 BIND\
  \ 4 DNS Server 模块中设置的路径。 | 无 |\n| BIND DNS Server | 通过查看 PID 文件检查 BIND 版本 8 或 9\
  \ 是否正在运行，使用 BIND DNS Server 模块的配置。 | 无 |\n| Check File (检查文件) | 可以配置为确保某些文件存在、不存在，或其大小小于或大于特定的字节数。此监控器对于检测变得过大的日志文件、丢失的关键文件或其他程序创建的指示文件非常有用。\
  \ | `File to check`：监控器应检查是否存在或大小的文件完整路径。`Test to perform`：如果选择 `File must exist`，如果文件不存在则监控器将失败。如果选择\
  \ `File must not exist`，如果文件存在则监控器将失败。如果选择 `File must be bigger than`，如果文件小于或等于该选项旁输入的大小，则监控器将失败。如果选择\
  \ `File must be smaller than`，如果文件大于或等于输入的大小，则监控器将失败。 |\n| Check Process (检查进程)\
  \ | 检查匹配模式的进程是否正在运行。这对于确保服务器和守护进程正在运行或检测可疑进程有用。 | `Command to check for`：用于搜索运行进程列表的\
  \ Perl 正则表达式，例如 `*httpd` 或 `nfsd`。`Fail if process is`：决定监控器是检查命令是否正在运行，还是反其而之确保它没有运行。\
  \ |\n| Configuration Engine Daemon (配置引擎守护进程) | 检查 CFengine 守护进程是否正在运行。 | 无 |\n\
  | DHCP Server | 通过查看 PID 文件检查 ISC DHCP 服务器是否正在运行，该文件来自 DHCP Server 模块的配置。 | 无 |\n\
  | Disk Space (磁盘空间) | 确保文件系统至少有一定数量的可用磁盘空间。此类监控器可用于磁盘空间即将耗尽的预警。 | `Filesystem to\
  \ check`：对于此参数，你必须从菜单中选择要检查大小的文件系统。或者你可以选择 `Other` 选项并在相邻文本框中输入挂载点。`Minimum free\
  \ space (in kB)`：如果文件系统的可用磁盘空间少于为此参数输入的千字节数，则监控器将失败。 |\n| Execute Command (执行命令)\
  \ | 执行任意 shell 命令并检查其退出状态。这是最灵活的监控器，因为你可以用它运行自定义脚本，执行任何内置监控类型无法执行的检查。 | `Command\
  \ to check exit status of`：监控器将以 root 身份运行的 shell 命令或命令组，并根据其退出状态检查成功失败。可以使用所有常用的\
  \ shell 元字符，如 `;`、`&&` 和 `|`。 |\n| Extended Internet Server (扩展互联网服务器) | 通过查看 PID\
  \ 文件检查 xinetd Extended Internet Server 是否正在运行。 | 无 |\n| File Change (文件更改) | 确定文件自上次运行监控器以来是否发生了变化。对于检测关键文件或记录严重错误信息的日志文件的变化有用。\
  \ | `File to monitor`：将检查其最后修改时间的文件或目录的完整路径。如果自上次查询监控以来时间发生了变化，监控器将报告失败。 |\n| Free\
  \ Memory (可用内存) | 确保系统上的可用空内存不少于特定数量。 | `Minimum free memory (in kB)`：如果可用内存少于为此参数输入的千字节数，则监控器将失败。在\
  \ Linux 上，可用内存定义为空闲 RAM、空闲交换以及用于缓冲区和缓存的内存的总和。 |\n| Hostsentry Daemon (Hostsentry\
  \ 守护进程) | 检查系统上 Hostsentry 守护进程。 | 无 |\n| Internet and RPC Server (互联网和 RPC 服务器)\
  \ | 通过查看 PID 文件检查 inetd Internet 服务器是否正在运行。 | 无 |\n| Jabber IM Server (Jabber IM\
  \ 服务器) | 通过查看 PID 文件检查 Jabber 即时消息服务器是否正在运行。 | 无 |\n| Load Average (平均负载) | 监控系统平均负载，并检查其是否超过某些限制。\
  \ | `Load average to check`：如第 11 章所述，所有 UNIX 系统都会跟踪过去 1、5 和 15 分钟的平均系统负载。此参数控制监控器将检查哪个平均值。`Maximum\
  \ load average`：超过此平均值的监控器将失败。在单 CPU 上，平均值 1.0 意味着系统完全满载。 |\n| MON Service Monitor\
  \ (MON 服务监控器) | 通过查看 PID 文件检查 MON 是否正在运行，该文件来自 MON Service Monitor 模块的配置。 | 无 |\n\
  | MySQL Database Server (MySQL 数据库服务器) | 通过尝试连接检查 MySQL 是否正在运行，使用 MySQL Database\
  \ Server 模块中设置的用户名和密码。 | 无 |\n\n\n\n\n\n| 监控名称 | 描述 | 参数 |\n| :--- | :--- | :---\
  \ |\n| NFS 服务器 | 检查系统上是否存在 `nfsd` 进程，该进程的存在表示 NFS 服务器正在运行。 | 无 |\n| 网络流量 | 此种监控类型检查通过网络接口的字节数，如果数据速率超过某些限制，则失败。由于速率仅自上次检查以来通过的字节数除以检查以来的秒数，因此此类类型的监控必须每隔几分钟定期运行一次。这对于警报来自您的系统或针对您的系统的拒绝服务攻击非常有用。\
  \ | 监控接口：将检查是否存在过量流量的网络接口。最大字节/秒：监控报告失败的数据速率阈值。监控方向：此参数决定入站流量、出站流量还是双向流量被计入数据速率。\
  \ |\n| Portsentry 守护进程 | 通过查看其 PID 文件来检查 `Postsentry` 是否正在运行，该文件取自 Security Sentries\
  \ 模块的配置。 | 无 |\n| Postfix 服务器 | 通过查看其 PID 文件来检查 `Postfix` 是否正在运行，该文件的位置取自 Postfix\
  \ 配置模块。 | 无 |\n| PostgreSQL 数据库服务器 | 通过尝试使用 PostgreSQL 数据库服务器模块设置的用户名和密码进行测试连接，以检查\
  \ `PostgreSQL` 是否正在运行。 | 无 |\n| ProFTPD 服务器 | 检查 ProFTPD PID 文件以查看服务器进程是否运行。当 FTP\
  \ 服务器以独立模式运行时才能使用此监控，而不能通过 `inetd` 或 `xinetd` 等超级服务器运行。 | 无 |\n| QMail 服务器 | 通过查找\
  \ `qmail-send` 进程来检查 `Qmail` 是否正在运行。 | 无 |\n| 远程 HTTP 服务 | 连接到运行在某些主机上的 HTTP 服务器并请求页面。如果出现问题，监控将失败。此类型用于测试未安装\
  \ Webmin 的系统上运行的 Web 服务器，或检查关键页面是否可用。 | 请求的 URL：监控在运行时要下载的 HTTP 或 HTTPS URL。不支持\
  \ FTP URL。连接超时：监控等待连接并请求页面的秒数。如果过程耗时超过此时间，将报告失败。默认为 10 秒。登录身份为：如果 URL 受密码保护，可以使用此参数指定登录时使用的用户名和密码。\
  \ |\n| 远程 Ping | 发送并监听 ICMP 数据包以确定某些主机是在线还是离线。这对于测试网络连接和服务器可用性非常有用。 | 要 ping 的主机：要检查的系统\
  \ IP 地址或主机名。如果主机未响应 ICMP 回显请求数据包，监控将失败。等待响应时间：监控等待 ICMP 回显应答的秒数。 |\n| 远程 TCP 服务\
  \ | 尝试对主机和端口建立 TCP 连接，以确保监听该端口的服务器正在运行。如果连接成功，将立即关闭。 | 要连接的主机：监控应打开 TCP 连接的系统 IP\
  \ 地址或主机名。要连接的端口：主机上应建立连接的 TCP 端口。连接超时：监控放弃并报告失败之前等待 TCP 连接成功的秒数。默认为 10 秒。 |\n| Samba\
  \ 服务器 | 检查 `smbd` 和 `nmbd` Samba 服务器进程是否都在运行，除非它们被配置为从 `inetd` 或 `xinetd` 运行。 |\
  \ 无 |\n| Sendmail 服务器 | 通过查看其 PID 文件来检查 `Sendmail` 服务器是否运行，该文件取自 Sendmail Mail 服务器模块的配置。\
  \ | 无 |\n| Squid 代理服务器 | 通过查看其 PID 文件来检查 `Squid` 服务器是否运行，该文件取自 Squid 代理服务器的配置。 |\
  \ 无 |\n| Usermin Web 服务器 | 通过查看其 PID 文件来检查 `Usermin` HTTP 服务器是否运行，该文件的位置取自 Usermin\
  \ 配置模块。 | 无 |\n| Webmin Web 服务器 | 检查 `Webmin` 自身是否正在运行。此监控类型仅在定期运行时才真正有用。 | 无 |\n\
  \n并非所有的监控在所有操作系统上都可用。由于它们使用了 `/proc` 中的 Linux 特有文件，“可用内存”（Free Memory）和“网络流量”（Network\
  \ Traffic）监控仅在该操作系统上可用。“平均负载”（Load Average）类型只能用于支持运行进程模块的系统，“磁盘空间”（Disk Space）监控仅在移植了磁盘和网络文件系统模块的系统上有效。\n\
  \n此外，许多监控依赖于其他 Webmin 模块。例如，如果从您的 Webmin 安装中删除了 Apache Web 服务器模块，您将无法使用 Apache Web\
  \ 服务器监控类型。如果您尝试添加依赖于未安装或在您的操作系统上无法运行模块的新监控，点击“创建”按钮时将显示错误消息。\n\n### 28.4 设置计划监控\n\
  \n您可以使用此模块配置的监控在定期运行时最有用处，这样当受监控的服务器或守护进程宕机时，您可以通过电子邮件自动收到通知。启用计划检查后，您所有的监控将按照周期性间隔运行，就像您访问该模块主页时运行的所有监控一样。\n\
  \n设置计划监控需要遵循的步骤如下：\n\n1. 点击模块主页监控表格下方的“计划监控”（Scheduled Monitoring）按钮。这将引导您进入图 28.3\
  \ 所示的表单。\n\n##### 图 28.3 计划监控配置表单。\n\n![](img/28fig03.jpg)\n\n2. 将“启用计划监控？”（Scheduled\
  \ monitoring enabled?）字段改为“是”（Yes）。\n\n3. “每隔”（Check every）字段控制计划检查的运行时间。第一个字段允许您设置周期，例如每隔\
  \ `1 hour` 或 `5 minutes`，第二部分控制其在该周期内的第几小时或几分钟。例如，要让监控在每天凌晨 3:00 检查，您将“每隔”字段设置为\
  \ `1 days`，并将偏移字段设置为 `3`。\n\n4. 若要将检查限制在一天中的特定小时，请从“在此期间运行监控”（Run monitor during\
  \ hours）列表中取消勾选您不想让其运行的小时段。如果计划检查每天只运行一次，则此没有意义。\n\n5. 同样，若要将检查限制在每周的特定几天，请从“在这些运行监控”（Run\
  \ monitor on days）列表中取消勾选您不想让其运行的日期。。\n\n6. “何时发送电子邮件”（Send email when）字段决定哪些事件会触发计划检查发送电子邮件消息。\n\
  \n   - 选择“服务状态更改时”（When a service changes status），将在服务宕机或恢复时发送电子邮件。\n   - 选择“服务宕机时”（When\
  \ a service goes down），仅在服务宕机时发送电子邮件。\n   - 选择“服务宕机期间”（Any time service is down），只要服务处于宕机状态，每次检查都会发送电子邮件，直到服务恢复。\n\
  \n您可以在监控创建表单的“计划检查”（Check on schedule）字段针对单个监控覆盖此字段。\n\n7. 若要在服务宕机时接收电子邮件，请在“邮件状态报告到”（Email\
  \ status report to）字段中输入您的地址。如果留空为“无”（Nobody），则不发送电子邮件。\n\n8. 若要设置状态电子邮件的源地址，请更改“邮件发送地址”（From:\
  \ address for email）字段。默认值为 `webmin@*yourhostname*`\n\n9. 默认情况下，任何状态电子邮件将通过运行系统上的\
  \ `sendmail` 程序发送。若要通过另一个系统上的 SMTP 服务器发送，请将“通过发送邮件”（Send mail via）字段改为“SMTP 服务器”，并在旁边的字段中输入邮件服务器的主机。\n\
  \n10. 如果您希望为每个宕机的监控接收一个电子邮件，请将“每个服务发送一个电子邮件？”（Send one email per service?）字段改为“是”（Yes）。否则，单次检查中确认的所有失败的服务将在一封邮件中报告。\n\
  \n\n\n\n\n如果你已经在模块配置中设置并运行了寻呼机（pager）命令，可以在页面状态报告的编号字段中输入寻呼机号码。它将接收通过电子邮件发送的短版本消息。\n\
  \n点击页面底部的“保存”按钮启用计划监控。Webmin 将自动设置一个 `Cron` 任务，按照选定的计划运行脚本。\n\n一旦启用计划监控，你就应该开始接收电子邮件消息，以便在服务宕机和恢复时通知。然而，如果在首次启用计划检查时服务处于宕机状态，而你选择仅在服务宕机或恢复时通知，那么你将不会接收有关该事件的消息。\n\
  \n要修改任何计划监控选项，只需重复上述步骤即可。若要完全关闭它，请将 `Scheduled monitoring enabled?` 字段更改为 `No` 并点击“保存”。如果你想更改监控计划，最好在该模块中进行，而不是在第\
  \ 10 章介绍的 `Scheduled Cron Jobs` 模块中进行。\n\n### 28.5 模块访问控制\n\n你可以授予 Webmin 用户仅查看已配置监控器当前状态的权限，而不允许创建或编辑它们。这可以在第\
  \ 52 章介绍的 Webmin 用户模块中完成。一旦你创建了可以访问该模块的用户，按照以下步骤赋予其只读权限：\n\n在 Webmin 用户模块中，点击要限制的用户或组名称旁边的\
  \ `System and Server Status`。\n\n将 `Can edit module configuration?` 选项更改为 `No`，以防止其更改显示选项。\n\
  \n将 `Can create and edit monitors?` 字段设置为 `No`，使其只能查看现有监控器的状态。\n\n将 `Can change\
  \ scheduled monitoring?` 字段设置为 `No`。\n\n点击“保存”按钮使模块访问控制限制生效。\n\n## 28.6 配置系统和服务器状态模块\n\
  \n该模块有多个配置选项，主要与主页面的显示方式有关。这些选项可以通过点击主页上的 `Module Config` 链接进行编辑，具体如表 28.2 所示。\n\
  \n### 表 28.2. 模块配置选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| 列表中显示的状态 | 默认情况下，此字段设置为\
  \ `Current status`，这将导致主页查询并显示所有配置模块的当前状态。然而，如果你将其更改为 `From last scheduled check`，则将显示上次运行计划检查时每个监控器的状态。此选项将使主页加载速度快得多，特别是当你有大量监控器时。但是，如果你没有启用计划监控，此选项就没有意义了。\
  \ |\n| 向寻呼机发送消息的命令 | 当计划检查需要向寻呼机号码发送消息时，它将带有两个参数调用此命令。第一个是发送消息的号码，第二个是实际的消息文本。免费提供的\
  \ `yaps` 与这些参数配合得很好。 |\n| 页面刷新的间隔时间 | 当取消勾选 `Don't refresh` 并输入一个数字时，查看该模块主页的任何浏览器将定期重新加载主页。刷新之间的时间为输入的秒数。\
  \ |\n| 监控器的排序方式 | 此字段控制监控器在模块主页上的顺序。`Order` 创建选项将按照它们添加的顺序显示它们。`Description` 选项将根据其描述进行排序。`Host`\
  \ 选项将根据每个监控器运行的远程 Webmin 服务器进行排序。 |\n\n### 28.7 总结\n\n完成本章后，你应该已经了如何使用 Webmin 的系统和服务器状态模块来轻松地监控一个或多个系统上的各种服务器和服务。你应该知道如何添加和编辑监控器，如何设置计划检查，以及如何通过电子邮件、寻呼机或短信配置宕机通知。如果你正在寻找更高级的监控工具，可以尝试\
  \ `MON`，它可以使用 `MON Service Monitor` 模块进行配置。\n\n## 第 29 章 Apache Web 服务器配置\n\n本章解释了如何使用\
  \ Webmin 配置 Apache Web 服务器。它涵盖了虚拟主机、IP 访问控制、密码限制等内容。\n\n### 29.1 Apache 简介\n\nApache\
  \ 是互联网上最流行的 HTTP 服务器，因为它具有零成本、广泛可用且功能强大。所有的 Linux 发行版都将其作为标准包包含，并且可以安装在 Webmin 支持的所有其他\
  \ UNIX 变体上或为其编译。然而，它在文本文件中定义了大量的选项指令，因此对于缺乏经验的管理员来说设置起来可能困难。\n\n自首次引入以来，Apache 发布了许多版本。从\
  \ 1.0 开始到现在的 1.3 和 2.0 系列，每个版本都包含了更多的功能和选项。尽管内部实现发生了巨大变化，但基础 Web 服务器功能和配置布局一直保持不变。\n\
  \nApache 采用模块化设计，每个模块负责其整体功能集的某部分。几乎每个 Apache 安装版本都包含几个标准模块，还有许多可选模块或必须单独下载的模块。模块可以被编译到\
  \ Web 服务器的可执行文件中，也可以在运行时从共享库中动态加载。这种模块化架构可以通过避免加载对特定系统没有任何有用功能的模块来节省内存。\n\nApache\
  \ 从多个文本文件中获取配置，每个文件都包含一系列指令，通常每行一个。每个指令都有一个名称和一个或多个值，并设置一个选项，例如日志文件的路径或某些文件的 MIME\
  \ 类型。Apache 识别的指令取决于所使用的模块。大多数模块都会添加对若干指令的支持，以配置它们提供的功能。\n\n通常，你可能希望在单个服务器上托管多个网站。Apache\
  \ 可以配置为根据浏览器请求的网站使用不同的配置。这些网站中的每一个被称为虚拟主机（virtual host），并在配置文件用特殊的 `<Virtualhost>`\
  \ 部分进行定义。该虚拟主机部分内的所有指令仅适用于匹配其 IP 地址或主机名的请求。\n\n同样，可以在配置文件中定义 `<Directory>` 和 `<Files>`\
  \ 部分，以包含仅适用于特定目录或匹配特定模式的文件的指令。这些通常被用于拒绝访问系统上的某些文件、对其进行密码保护，或控制它们向客户端显示的方式。\n\n另一种创建仅适用于单个目录的指令的方法是将它们放在名为\
  \ `.htaccess` 的特殊配置文件中，该文件位于目录本身中。这些文件通常由普通用户创建，这样他们不需要对主配置文件的完全访问权限即可配置自己的网站。这对于托管多个网站且每个网站由不同\
  \ UNIX 用户拥有的系统非常有用，而不是对于仅有一个由服务器所有者设置的网站的系统那么有用。\n\n### 29.2 Apache Web 服务器模块\n\n\
  这是最复杂且最强大的 Webmin 模块之一，因为它允许你配置 Apache 的几乎每一个功能。它可以确定系统上安装的 Apache 版本及其所使用的模块，并相应地调整用户界面，以便你只需编辑\
  \ Web 服务器理解的指令。然而，对于所有 Apache 版本，界面通常是相同的。\n\n\n\n\n由于指令非常多，且模块尝试允许对所有指令进行配置，因此将指令分为不同的类别，例如“进程与限制\
  \ (Processes and Limits)”、“网络与地址 (Networking and Addresses)”以及“CGI 程序 (CGI Programs)”。这些类别由图标表示，当你在模块中打开虚拟服务器、目录或选项文件时就会出现。在任何情况下，你都可以点击图标查看并编辑每个类别下的设置。\n\
  \nApache 拥有大量的标准模块，以及更多由他人开发的独立模块。Webmin 不支持编辑这些大多数非标准模块中的指令，例如 `mod_perl` 和 `mod_php`。然而，它会安全地忽略任何它不理解的配置文件指令，因此你手动对不支持的模块所做的任何设置都不会受到损害。\n\
  \n在 Webmin 主菜单的 `Servers`（服务器）类别下可以找到 Apache Web 服务器模块。当你第一次进入它时，主页面将显示所有它知道如何配置的\
  \ Apache 模块列表，并选中你系统中可用的模块。图 29.1 显示了此示例。\n\n##### 图 29.1. 选择可用的 Apache 模块。\n\n\
  ![](img/29fig01.jpg)\n\n在大多数情况下，默认选择对你的系统是正确的，你只需点击 `Configure`（配置）按钮即可开始使用该模块。然而，如果你有一个复杂的\
  \ Apache 配置文件导致 Webmin 无法正确解析以找到动态加载的模块，那么默认选择可能是错误的。如果是这样，你需要更改它们，以便模块不会尝试设置你的系统中不支持的指令。\n\
  \n一旦提交了模块配置表单，主页面将如图 29.2 所示重新显示。从现在起，每当你进入该模块时，除非 Webmin 检测到系统中安装了新版本的 Apache，否则该页面都会立即显示。\n\
  \n##### 图 29.2. Apache Web 服务器模块主页面。\n\n![](img/29fig02.jpg)\n\n主页顶部是各种全局选项类别的图标，以及一些额外功能。下方是所有当前虚拟服务器的列表，随后是添加新虚拟主机的表单。如果你系统中存在非常大量的虚拟服务器（默认超过\
  \ 100 个），则会显示一个用于查找服务器的搜索表单。第一个服务器始终是特殊的 `Default Server`（默认服务器），它包含了适用于所有其他虚拟服务器的指令，并处理其他服务器不处理的请求。\n\
  \n自然，如果你系统中没有安装 Apache，Apache 模块将无法工作。如果是如此，主页面将显示错误消息，而不是模块配置表单或虚拟服务器列表。所有的 Linux\
  \ 发行版都在其 CD-ROM 或网站上包含了它的软件包，因此在继续之前，请使用 `Software Packages`（软件包）模块（第 12 节介绍）从那里安装。\n\
  \n由于该模块假设 Apache 可执行文件和配置文件位于你发行版软件包使用的位置，如果你手动编译并安装了它，它会报告相同的软件未安装的错误。如果是这样，点击\
  \ `Module Config`（模块配置）链接并将路径调整为系统的正确位置。第 29.22 节“配置 Apache Web 服务器模块”中的指令详细详细解释了如何操作。\n\
  \n在默认不包含 Apache 的 UNIX 版本上，Webmin 假设它将从 [www.apache.org](http://www.apache.org/default.htm)\
  \ 的标准源码发行版安装。如果你通过操作系统提供的可选包安装了 Web 服务器，那么主页面将抱怨它未安装，你需要调整模块的配置。\n\n由于 Apache 配置文件的复杂性和强大性，该模块的用户界面非常复杂，拥有大量的页面、表单和子页面。然而，界面中存在在模块许多页面上重复的元素，例如：\n\
  \n**类别图标**：当你点击虚拟服务器、目录或选项文件的图标时，页面顶部会显示一个带有如 `MIME Types` 和 `CGI Programs` 等名称的图标表格。在每个图标的下方是用于配置与图标标签相关的选项的字段和表格。这种常用的布局将海量的可编辑\
  \ Apache 选项划分为类别，因为字段太多，无法在单个页面上显示。出现的具体图标及其下方的字段取决于 Web 服务器配置的不同部分。但基本布局始终是相同的。\n\
  \n**表格字段**：在许多表单中，某些字段使用表格来输入多个值（例如 MIME 类型）。每个表格的行数没有限制，但 Webmin 每次只显示一个空行。这减小了表单的，但意味着你每次只能添加一行。要添加多于一行，你需要保存表单然后重新进入它，这会在你刚刚填写的行下方显示一个新行。\n\
  \n### 2929.3 启动和停止 Apache\n\n在浏览器连接到你系统上的 Apache Web 服务器之前，必须启动 Apache 的服务器进程。你可以通过查看模块中任何页面的顶部来检查它是否正在运行。如果出现\
  \ `Apply Changes`（应用更改）和 `Stop Apache`（停止 Apache）链接，说明当前处于激活状态。如果只出现 `Start Apache`（启动\
  \ Apache）链接，说明它尚未运行。\n\n要启动它，点击 `Start Apache` 链接。如果一切顺利，你所在的页面将重新显示，顶部的链接应该改变以指示它现在正在运行。否则，将出现错误消息说明出了什么问题。最可能的原因是配置文件中的错误。\n\
  \n在 Web 服务器运行时，点击模块任一页面上的 `Stop Apache` 链接即可停止 Web 服务器。在 Webmin 无法停止服务器的极少数情况下，将显示错误消息页面。如果成功停止，相同的页面将重新显示，顶部的链接将更改以显示它不再运行。\n\
  \n当 Apache 处于激活状态时，每个页面顶部都有一个 `Apply Changes` 链接，用于指示 Web 服务器重新加载当前配置。在你在此模块中进行任何更改（`.htaccess`\
  \ 文件中的更改除外）后，必须点击此链接使其生效。与其他在主页上有应用按钮的其它 Webmin 模块不同，此模块的每个页面上都有该按钮，因此你不需要每次做出更改都返回索引页。\n\
  \n### 29.4 编辑你 Web 服务器上的页面\n\n本节解释了如何找到并编辑系统上当客户端连接到你的 Apache Web 服务器时显示的文件。如果你已经知道如何这样做，请随时跳过此节并移动到第\
  \ 29.5 节“创建新的虚拟主机”。\n\n\n\n\n\n当从软件包或源码首次安装 Apache 时，其初始配置通常不会设置任何虚拟服务器。相反，仅存在默认服务器，为任何连接到\
  \ 80 端口的客户端提供页面。你可以通过运行 浏览器并访问 URL `http://yourhostname/` 来查看默认页面；如果你在 Webmin 所在的同一系统上运行浏览器，则访问\
  \ `http://localhost/`。出现的页面可能只是由 Apache 或你的 Linux 发行版所提供的默认页面。\n\nApache 提供文件服务的文档根目录将显示在模块主页的“默认服务器”图标旁边。例如，在\
  \ Red Hat Linux 上，该目录默认为 `/home/httpd/html`。你可以通过以 root 身份登录或使用 Webmin 的文件管理器模块来编辑此目录中的文件。你所做的任何更改将立即反映在网站上。\n\
  \n如果你的系统仅托管单个静态网站，可能没有必要配置 Apache 的其他方面。你只需要将 HTML、图像和其他文件上传或复制到该目录及其子目录，即可创建你想要的站点。最重要的文件是\
  \ `index.html`，当浏览器未请求特定页面时，Apache 都会提供该文件。因为大多数人会先访问 `http://yourserver/`，所以 `index.html`\
  \ 页面将他们看到的第一个页面。\n\n为了方便编辑，你可能希望将文档根目录及其所有文件的所有权更改为非 root 用户。但是，你必须确保这些文件对于运行 Apache\
  \ 服务器进程的用户仍然是可读，该用户通常命名为 `httpd`。实现此操作最简单的方法是将所有文件和目录设置为所有人可读和所有人可执行。\n\n### 29.5\
  \ 创建新的虚拟主机\n\n如果你想在系统上托管多个网站，那么你将为每个网站创建一个 Apache 虚拟主机。在添加站点之前，必须先在 DNS 中注册其地址，这可以在你系统上的\
  \ DNS 服务器上，也可以在另一个主机上。如果站点的文件所有者与文档根目录所有者不同的 UNIX 用户，则必须先创建该用户。\n\n添加虚拟服务器的整个过程如下：\n\
  \n1. 确定一个将在新网站 URL 中使用的主机名，例如 `www.example.com`。\n2. 决定你的新站点是基于 IP 的还是基于域名的。基于域名的站点除了旧版浏览器外，可以良好地工作，因此目前来看是最佳选择。基于\
  \ IP 的站点适用于任何浏览器，但需要向你的系统添加独立的 IP 地址。由于 IP 地址通常稀缺，只有当你需要为该域名设置虚拟 FTP 或 POP3 服务器时，这种方法才有意义。\n\
  3. 如果你的站点是基于 IP 的，使用网络配置模块（第 16 章介绍）向系统的外部网络接口添加新的虚拟 IP 地址。确保它在启动时激活并处于活动状态。如果你的系统只有一个由\
  \ ISP 分配的静态 IP 地址，那么添加的任何额外虚拟 IP 都无法工作。在这种情况下，你必须使用基于域名的虚拟服务器，或者请求 ISP 为你分配多个地址。\n\
  4. 如果 `example.com` 域名已存在于 DNS 服务器，请使用系统的外部 IP 地址为 `www.example.com` 添加记录（基于域名站点），或使用上一步选择的地址（基于\
  \ IP 站点）。\n5. 如果域名不存在，你需要将其添加到 DNS 服务器并向 Network Solutions 之类的注册处注册。无论如何，第 30 章都详细介绍了如何添加记录和域名。\n\
  6. 如果站点属于不同的用户，请在第 4 章介绍的用户和组模块中为他添加 UNIX 用户账户。如果站点由不同的人管理，让每个站点的文件由单独的用户所有比由单个用户所有要好得多。\n\
  7. 当创建用户账户时，确保它有一个有效的主目录，例如 `/home/example`。然后在下面创建一个名为 `www` 的子目录，并确保它由新用户所有。可以通过在\
  \ `/etc/skel` 或系统存储用户默认文件的任何地方创建 `www` 子目录来自动完成。\n8. 如果站点将使用标准的 HTTP 端口 80（这通常是你想要的），则可以直接跳到第\
  \ 8 步。否则，点击 Apache Web 服务器模块主页上的“网络和地址”图标，打开图 29.3 所示的表单。\n\n### 图 29.3 全局网络和地址页面。\n\
  \n![](img/29fig03.jpg)\n\n在“监听地址和端口”表格的空行中，在“地址”列选择 `All`，并在“端口”列取消勾选 `Default`。然后在相邻字段输入你网站的\
  \ TCP 端口，并点击页面底部的保存按钮。\n\n在模块的主页上，滚动到现有虚拟主机列表下方的“创建虚拟服务器”表单。\n\n如果你正在设置基于 IP 的虚拟服务器，你应该在第\
  \ 3 步添加的“特定地址”字段中输入虚拟 IP 地址。设置基于域名的虚拟服务器，请输入系统的外部 IP 地址。如果你的 Apache 服务器已配置为接受任何\
  \ IP 地址上的基于域名连接，你可以为此字段选择 `Any` 地址选项。更多细节见后续说明。\n\n如果你的新虚拟服务器使用 80 外的端口并且是该端口上的唯一服务器，你也可以选择\
  \ `Any` 地址选项，以便处理进入该端口的所有请求。\n\n如果你正在设置基于 IP 的虚拟服务器，取消勾选“添加域名地址”选框。对于基于域名的服务器，应保持启用。\n\
  \n如果新的虚拟主机使用非标准端口，选择“端口”字段的最后一个选项，并在相邻字段输入数字。\n\n在“文档根”字段中，输入包含此网站文件的目录完整路径。例如，这可能是\
  \ `/home/example/www`。\n\n在“服务器名称”字段中，输入客户端用于引用此网站的主机名，例如 `www.example.com`。如果这是一个可以通过多个不同\
  \ URL 访问的基于域名服务器，你可以输入多个名称，例如 `web.example.com` 和 `example.com`。\n\n除非你的系统上有一个包含所有虚拟主机的独立文件，否则将“向文件添加虚拟服务器”字段设置为\
  \ `Standard httpd.conf file`。否则，你可以选择“Selected file”并在相邻字段输入路径。确保所选文件确实被 Apache\
  \ 使用（例如通过 `httpd.conf` 中的 `Include` 指令），否则虚拟服务器将无效且不会显示在 Webmin 中。\n\n如果你始终使用同一个独立文件来存储虚拟主机，第\
  \ 29.22 节“配置 Apache Web 服务器模块”中解释的“向文件添加虚拟服务器”字段可能会有用。当设置此配置字段时，“向文件添加虚拟服务器”字段将包含在所选文件中创建虚拟主机选项。\n\
  \n要让 Webmin 从另一个虚拟服务器复制所有指令到你正在创建的服务器，请从“从指令复制”菜单中选择。如果你的所有主机都有类似的配置，这将非常有用。\n\n\
  填写完表单后，点击“创建”按钮。新的虚拟服务器将添加到 Apache 配置文件以及主页上的服务器列表中。\n\n点击新虚拟服务器的图标，这将带你进入它的选项页面，如图\
  \ 29.4 所示。\n\n### 图 29.4 虚拟服务器选项页面。\n\n![](img/29fig04.jpg)\n\n\n\n\n\n滚动到“按目录选项”（Per-Directory\
  \ Options）下的表单，在`Path`字段中输入你在第 11 步中选择的文档根目录。确保`Type`被设置为`Directory`（目录），并将`Regexp?`字段设置为`Exact\
  \ match`（精确匹配）。\n\n点击`Create`（创建）按钮为该目录的配置文件添加一个新章节。这对于授予客户端浏览目录包含文件的权限是必要的，因为默认的\
  \ Apache 目录配置会拒绝访问。\n\n点击虚拟服务器选项页面上新添加的目录图标。这将带你进入图 29.5 所示的目录选项页面。\n\n##### 图 29.5\
  \ 目录选项页面。\n\n![](img/29fig05.jpg)\n\n点击`Document Options（文档选项）图标，并在出现的表单下方将`Directory\
  \ options（目录选项）字段更改为`Selected（已选）。在`Set for directory（设置到目录）列下，将`Generate directory\
  \ indexes（生成目录索引）的项目更改为`Yes`。然后点击页面底部的`Save（保存）按钮。\n\n要使所有更改生效，请点击任何页面顶部的`Apply\
  \ Changes（应用更改）按钮。\n\n你或虚拟服务器的所有者现在可以向文档根目录添加文件了。你可以通过在浏览器中打开 URL（例如 `www.example.com/*`）来进行测试，确保一切运行正常。\n\
  \n当 Apache 接收到 HTTP 请求时，它必须首先确定请求是针对哪个虚拟服务器的。它会首先查找`hostname`与客户端请求的主机匹配、且地址和端口与客户端连接的相同的基于名的虚拟服务器。如果没有找到，则将使用该地址和端口定义的第一个虚拟服务器；如果没有，则请求将由默认服务器处理。\n\
  \n基于名的虚拟服务器只能用于全局`Networking and Addresses（网络与地址）`页面上`Addresses for name virtual\
  \ servers（基于名的虚拟服务器的地址）`字段列出的地址。如果你按照上述说明操作，创建新的虚拟服务器时会自动会自动添加到此列表中。如果你系统上的所有虚拟服务器都是基于名的，你可以打开此页面，选择`Include\
  \ all addresses（包含所有地址）`选项并点击`Save`，这样 Apache 就会在任何 IP 地址上处理此类请求。如果你的系统具有动态分配的 IP\
  \ 地址且你想提供多个虚拟主机，这样做也是合理的。\n\n一旦创建了虚拟服务器，你可以按照以下步骤编辑其设置或删除它：\n\n- 在模块主页上，点击虚拟服务器图标。这将带你进入图\
  \ 29.4 所示的服务器选项页面。\n- 滚动到页面底部的`Virtual Server Details（虚拟服务器详情）`表单。\n- 将`Address（地址）`、`Port（端口）`和其他字段更改为所需的值并点击`Save`按钮。这些字段与虚拟服务器创建表上的含义相同。但是，如果更改了基于名虚拟服务器的地址，你可能还需要全局`Networking\
  \ and Addresses`页面进行更改。\n- 如果你想删除虚拟服务器及其包含的所有配置指令，请点击`Delete Virtual Server（删除虚拟服务器）`按钮。\n\
  - 回到模块主页，点击`Apply Changes（应用更改）`链接使新设置生效。\n\n你无法更改默认服务器的设置，也无法删除。\n\n### 29.6 设置按目录选项\n\
  \nApache 允许你针对某些虚拟服务器或单个虚拟服务器指定不同的选项。包括目录，你实际上可以设置适用于 Apache 服务器上三类对象的选项：\n\n- **Directory（目录）**：选项适用于指定的目录及其其中的所有文件或其包含的子目录。\n\
  - **Files（文件）**：选项适用于任何目录中具有指定名称的文件。\n- **Location（位置）**：选项适用于路径以指定位置开头的 URL 请求的文件或目录。例如，在\
  \ URL `www.example.com/foo` 中，路径为 `/foo`。\n\n每当 Apache 处理请求时，它都会按照固定顺序检查适用于请求的选项。目录章节和\
  \ `.htaccess` 选项按顺序读取，以便首先检查最具体的目录。随后是文件，然后是位置章节。接着读取请求所指向的虚拟服务器（如果有）的选项，最后是来自默认服务器的选项。\n\
  \n这意味着为目录设置的选项将覆盖高层级目录或其所属的虚拟服务器中设置的相同选项。要为目录、文件或 URL 位置设置选项，请遵循以下步骤：\n\n尽管你将要设置的选项适用于目录，但它们必须定义在其中一个虚拟服务器或默认服务器下。如果它们位于虚拟主机下，则将仅适用于针对该服务器的可选目录或\
  \ URL 位置的文件请求。然而，如果它们位于默认服务器下，针对任何虚拟主机的目录文件请求都将受到影响。\n\n- 在模块主页上，点击`Default Server（默认服务器）`图标或你想要限制目录选项的虚拟服务器图标。对于目录，通常将它们的选项放在默认服务器下是最简单的，因为每个虚拟主机通常有自己独立的文档根目录。然而，URL\
  \ 位置选项应该放在与其相关的虚拟服务器下，因为相同的 URL 路径在多个虚拟主机上可能以不同的用途。文件选项也是如此。\n- 在出现的服务器选项页面（如图 29.4\
  \ 所示），滚动到`Create Per-Directory, Files, or Location Options（创建按目录、文件或位置选项）`表单。\n\
  - 从`Type（类型）`菜单中选择之前描述的选项之一。\n- 如果是为目录设置选项，将其输入`Path`字段，例如 `*/home/example/www/images.*`。你也可以输入通配符路径，例如\
  \ `*/home/example/w**`，这将导致选项适用于所有匹配的目录。\n- 如果是为 URL 位置设置选项，将主机名之后的 URL 部分输入`Path`字段中，例如\
  \ `/images*`。你还可以在 URL 中使用 `*` 和 `?` 等 shell 通配符字符。如果为文件设置选项，将文件名输入`Path`字段，例如 `secret.html`。再次，文件名中可以使用通配符字符，例如\
  \ `secret.*`。\n- 如果你想在目录、文件名或 URL 位置中使用复杂的正则表达式，请将`Regexp?`字段设置为`Match（匹配）`。这将允许你在路径中使用\
  \ `[`、`]`、`+`、`.` 和 `*` 等 Perl 正则表达式字符。\n\n点击`Create`按钮向 Apache 配置添加新的目录章节。虚拟服务器选项页面将再次显示，但会有一个该目录的新图标。\n\
  \n现在你已经为目录、URL 位置或文件名创建了新图标，可以设置适用于它的选项。最常见的目录更改之一是配置当浏览器通过如 `www.example.com/images/`\
  \ 这样的 URL 请求目录时如何列出文件。默认情况下，如果目录中存在 `index.html` 文件，则将显示它。如果没有，将显示列出其中包含的所有文件的页面。\n\
  \n如果你想更改索引文件的名称、目录列表的样式或任何与索引相关的设置，请遵循以下步骤：\n\n- 在虚拟服务器选项页面上点击你要配置的目录图标。这将带你进入图\
  \ 29.5 所示的目录选项页面。\n- 点击`Directory Indexing（目录索引）`图标调出一个设置索引和列表选项的表单。\n\n要更改目录列表的外观，将下方的`Directory\
  \ index options（目录索引选项）`字段设置为`Selected（已选），并更改提供框中的字段。默认将生成一个非常简单的文件列表，但你可以通过设置以下选项来增强它：\n\
  \n\n\n\n\n显示花样的目录索引。如果启用，文件列表将包含它们的图标、大小和修改日期。\n\n将 HTML 标题作为描述。如果启用，HTML 文件的描述将从其\
  \ `<title>` 标签中获取。\n\n图标高度。此选项允许你更改目录列表中包含的图标高度。如果设置为 `Default`，则将使用标准 Apacheset\
  \ 的高度。\n\n图标宽度。与上一个选项类似，此选项允许你指定目录列表中图标的宽度。\n\n允许用户排序列。启用此项后，用户将能够点击列标题对文件列表进行排序（前提是标题正在显示）。\n\
  \n显示文件描述。如果启用，目录列表将包含每个文件的描述，取自其 MIME 类型或 HTML 标题。\n\n输出 HTML 标签。启用后，目录列表将包含每个 HTML\
  \ 页面应该开始的 `<html>` 和 `<head>` 标签。只有当你提供了自己的头部和页脚文件时，才需要关闭它。\n\n显示最后修改时间。如果启用，目录列表将包含每个文件的最后修改日期。\n\
  \n显示文件大小。如果启用，列表将包含每个文件的大小。\n\n链接中包含图标。如果启用此选项，列表中的图标将是文件本身的链接。否则，仅文件名是链接。\n\n文件名宽度。此选项控制目录列表中文件名列的长度。你可以输入字符数或输入\
  \ `*` 使该列的大小调整为最长文件名的长度。\n\n描述宽度。此选项控制目录列表中描述列的长度（如果有）。你可以输入字符数或输入 `*` 使该列的大小调整为最长描述的长度。\n\
  \n优先显示目录。如果启用，列表将显示任何目录在任何文件之上，无论其他文件如何。\n\n可用的选项取决于你系统中安装的 Apache 版本。上述列出的选项适用于\
  \ `1.3.19` 版本，但如果你有更新的发布版本，可能会有更多选项。\n\n如果你希望 Apache 在浏览器请求目录时返回除默认文件（通常为 `index.html`）以外的文件，请在\
  \ `Directory index files` 字段中输入文件名列表。可以输入多个文件名，并将使用找到的第一个。如果没有找到任何索引文件，将向浏览器返回一个使用第\
  \ 3 步中所选选项的目录列表。\n\n若要让 Web 服务器在生成目录文件列表时忽略某些文件，请在 `Files to ignore in directory\
  \ index` 字段中输入它们的文件。你可以在正则表达式中使用 Shell 通配符，例如 `*.doc*`。\n\n若要在目录列表开头插入一个 HTML 文件，请在\
  \ `Directory index header file` 字段中输入其文件名（相对于目录）。\n\n同样，若要在目录列表末尾添加文件名，请在 `Directory\
  \ index footer file` 字段中输入其名称。\n\n若要控制目录的默认排序，请取消勾选 `Sort directory index` 字段中的\
  \ `Default`，并旁边的两个菜单中选择排序的顺序和列。\n\n你可以通过填写 `Directory index descriptions` 表格为文件设置描述。在表格的空行中，在\
  \ `Description` 列中输入描述文件的简短信息，并在 `Filenames` 列中输入文件名列表或通配符名称。\n\n由于一次只显示一个空行，如果你想输入多个描述，则在添加每个描述后都需要重新访问此页面。\n\
  \n最后，点击页面底部的 `Save` 按钮存储你的更改并返回目录选项页面。要激活这些更改，请点击 Apache 模块任意位置的 `Apply Changes`\
  \ 链接。\n\n这些选项大部分都可以通过点击 `Virtual Server Options` 页面上的 `Directory Indexing` 图标为整个虚拟服务器设置。在这种情况下，除非被目录或\
  \ URL 路径选项覆盖，否则它们将适用于请求虚拟主机的所有文件。\n\n在目录选项页面上，还有许多图标可以点击以设置仅适用于该目录、URL 路径或文件名的选项。其中某些将在本章的后续章节中解释，例如第\
  \ 29.7 节“创建别名和重定向”和第 29.13 节“目录保护”。\n\n你可以使用 `Directory Options` 页面底部的 `Options\
  \ apply to` 表单更改设置适用的目录、文件名或 URL 路径。它具有与本节开头描述的创建表完全相同的字段。如果你进行了任何更改，请点击 `Save`\
  \ 按钮更新 Apache 配置，然后点击 `Apply Changes` 链接使其生效。你也可以点击 `Delete` 目录配置及其所有选项。\n\n###\
  \ 29.7 创建别名和重定向\n\n通常，URL 中的路径与 Web 服务器返回的文件之间存在直接关系。例如，如果浏览器请求 `www.example.com/images/foo.gif`\
  \ 且 `www.example.com` 的文档根目录为 `/home/example/www`，则 Web 服务器将读取文件 `/home/example/www/images/foo.gif`\
  \ 并将其返回给客户端。\n\n然而，可以使用 Apache 所称为 `aliases` 来更改此。别名将特定的 URL 路径映射到文件或目录，该目录并不一定位于文档根目录下。在前面的示例中，`/images`\
  \ URL 路径实际上可能是目录 `/www/images` 的别名，这将导致读取文件 `/www/images/foo.gif`。\n\n别名可以在全局定义或在虚拟服务器中定义。要创建一个别名，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击你想要创建别名的虚拟服务器图标。如果你希望它适用于所有虚拟服务器（或你没有虚拟服务器），请点击 `Default Server`\
  \ 图标。\n2. 在随后出现的虚拟服务器选项页面（如图 29.4 所示）上，点击 `Aliases and Redirects` 图标。这将带你进入图 29.6\
  \ 所示的页面。\n\n##### 图 29.6 别名和重定向表单。\n\n![](img/29fig06.jpg)\n\n在 `Document directory\
  \ aliases` 表格的空行中填写 URL 路径（位于 `From` 下）以及它应该映射到的文件或目录（位于 `To` 下）。如果你正在编辑默认服务器，该表中可能已经有若干属于标准\
  \ Apache 配置的条目。\n\n表格中始终恰好有一行空行。如果你需要添加多个别名，则需要在填写该行并保存后重新访问此页面。\n\n点击 `Save` 按钮将你的新别名存储在\
  \ Apache 配置中。浏览器将返回虚拟服务器选项页面。\n\n要使别名生效，请点击页面顶部的 `Apply Changes` 链接。\n\n现有的别名可以通过更改\
  \ `Document directory aliases` 表格中的条目并点击 `Save` 来编辑。不过，你不应更改默认服务器中 `/icons` 的别名，因为\
  \ Apache 在生成目录列表图标时会使用它。如果你想删除别名，只需删除表格中两个字段的内容即可。\n\n还可以创建使用 Perl 正则表达式的别名以匹配更复杂的\
  \ URL 路径。这些必须输入到 `Aliases and Redirects` 表单上的 `Regexp document directory aliases`\
  \ 表格中，该表与上述的 `Document directory aliases` 表具有相同的列。区别在于可以在 `From` 字段中输入任何正则表达式，例如\
  \ `^/images/(.*)\\.gif$`。`To` 字段可以接受引用表达式中括号内部分的字符串，例如 `/images/$1.jpg`。这将任何对 GIF\
  \ 文件的请求转换为对同名 JPEG 请求。\n\n\n\n重定向（Redirects）与别名（aliases）类似，但目的和工作原理不同。每当客户端请求已重定向的\
  \ URL 路径时，Apache 会告诉它去另一个 URL（可能在另一个服务器上）。例如，你可能会将所有到 `www.example.com/webmin/*`\
  \ 的请求重定向到 `www.webmin.com/`。与别名的行为不同，如果浏览器请求像 `/webmin/foo.gif` 这样的页面，它不会被重定向到 `www.webmin.com/foo.gif`，而是直接访问\
  \ `www.webmin.com/` URL。\n\n重定向是通过 Web 服务器向浏览器发送特殊的 `302` 状态码来实现的，这告诉浏览器去往新位置。新\
  \ URL 本身也可以是一个重定向，你甚至可以创建一个重定向循环，这并不是一个好主意。\n\n要在你的服务器上设置重定向，请遵循以下步骤：\n\n1. 在模块主页上，点击你要创建重定向的虚拟服务器图标。如果你希望将其应用于所有虚拟服务器，请点击默认服务器（Default\
  \ Server）图标。\n2. 在出现的虚拟服务器选项页面上，点击别名与重定向（Aliases and Redirects）图标进入图 29.6 页面。\n\
  3. 在 URL 重定向表的空行中，在 `From` 列输入你服务器上的 URL 路径，例如 `/webmin`。在 `To` 列输入请求应重定向到的 URL，例如\
  \ `www.webmin.com/`。\n4. `Status` 字段可选的，但如果你想更改此重定向使用的 HTTP 状态码，可以填写。默认是 `302`，表示临时重定向。你可以使用\
  \ `301` 告诉浏览器是永久性的，或使用 `303` 告诉它们已被替换。\n5. 表格中总有一个空行。如果你需要添加多个重定向，需要在填写该行并保存后返回此页面。\n\
  6. 点击 `Save` 按钮将你的新重定向存储在 Apache 配置中。浏览器将返回虚拟服务器选项页面。\n7. 要使重定向生效，点击页面顶部的应用更改（Apply\
  \ Changes）链接。\n\n与别名一样，可以通过更改 URL 重定向表中的条目并点击 `Save` 来编辑现有的重定向。要删除重定向，只需删除表中的所有字段内容。\n\
  \n你还可以创建正则表达式重定向，其行为与 `regexp` 别名类似，使用同一页面上的 Regexp URL 重定向表。在 `From` 列下你可以输入 URL\
  \ 路径表达式，如 `^/webmin/(.*)$`，在 `To` 列下你可以输入引用路径部分的 URL，例如 `http://www.webmin.com/$1`。在这个示例中，对\
  \ `/webmin` 下页面的请求将重定向到 `www.webmin.com` 相同的文件。\n\n在别名与重定向页面上还有两个标记为永久 URL 重定向（Permanent\
  \ URL redirects）和临时 URL 重定向（Temporary URL redirects）的表格。第一个的行为与普通重定向相同，但状态码始终设置为\
  \ `301`，表示永久重定向。第二个也像普通重定向一样，但始终使用 `302` 状态码（临时重定向）。如果未指定，普通重定向默认使用 `302`，因此此选项其实没用。\n\
  \n重定向也可以在目录、URL 位置、文件名和 `.htaccess` 文件的选项中定义。编辑这些任一项的选项时（见章节 29.6“设置目录选项”），与设置虚拟服务器别名时可以使用相同的图标和表格。当然，目录中的重定向只有在被重定向的\
  \ URL 路径实际上指向其包含的文件或子目录时才有意义。URL 位置中的重定向也是如此，重定向路径必须以位置路径开头。\n\n如果你系统上的 Apache 在编译时或动态加载了代理模块（见章节\
  \ 29.18“将 Apache 配置为代理服务器”），虚拟服务器选项页下的别名与重定向表单会出现标记为本地到远程 URL（Map locale to remote\
  \ URLs）和远程 Location 到本地（Map remote Location: headers to local）的表格。这些允许你指定一个 URL\
  \ 路径，请求时会导致 Apache 本身从另一个网站请求页面并返回给浏览器。尽管用户访问的 URL 在你的服务器上，浏览器只连接到你的系统，但内容实际上是从别加载的。\n\
  \n要设置此 URL 映射，请遵循以下步骤：\n\n1. 在模块主页上，点击你要创建映射的虚拟服务器图标。如果你希望将其应用于所有虚拟服务器，请点击默认服务器图标。\n\
  2. 在出现的虚拟服务器选项页面上，点击别名与重定向图标进入图 29.6 所示页面。\n3. 在 `Map locale to remote URLs` 表格的空行中，在第一个字段输入你服务器上的\
  \ URL 路径（如 `/webmin`），在第二个字段输入你希望请求页面的完整 URL（如 `http://www.webmin.com/*`）。\n4. 在\
  \ `Map remote Location: headers to local` 表格的空行中，在第一个字段输入相同的完整远程 URL，在第二个字段输入你服务器上的\
  \ URL 路径。第二个表格控制远程服务器发布的重定向转换，几乎总是应该设置。如果没有设置，每当远程服务器发布重定向时，浏览器将直接连接到它，而不是你的服务器。\n\
  5. 点击 `Save` 按钮将你的新映射存储在 Apache 配置中。浏览器将返回虚拟服务器选项页面。\n6. 要使映射生效，点击页面顶部的应用更改（Apply\
  \ Changes）链接。\n\n你可以通过访问系统上映射的 URL 路径来测试。你应该能看到从远程服务器请求的页面。不过这个过程并不是完全透明的，因为它没有以任何方式转换\
  \ HTML 文件。如果在上一个示例中，远程服务器包含一个带有如 `<a href=\"/foo.html\">` 链接的 HTML 页面，点击它将把浏览器带到系统上的\
  \ `/foo.html`，而不是像你预期的那样。\n\n\n\n\n选择取决于你，但后一种选项更简单用，因为你可以在同一个目录下自由地混合 CGI 脚本、HTML\
  \ 和图像文件。要进行设置，请按照以下步骤操作：\n\n1. 在模块主页上，点击你想要设置 CGI 程序的虚拟服务器图标。如果你想在所有服务器上使用它们，请点击\
  \ `Default Server`（默认服务器）图标。\n2. 点击你想要启用 CGI 程序的目录图标。通常，每个虚拟服务器都会有一个其文档根目录的选项图标，但如果没有，你可以按照之前第\
  \ 29.6 节“设置每个目录选项”中的步骤创建一个。如果你只想允许在网站的特定子目录下运行 CGI 程序，你也可以为该子目录创建一个新的目录图标。\n3. 在目录选项页面，点击`Document\
  \ Options`（文档选项）图标，并将下方的`Directory options`（目录选项）字段从`Default`(默认）更改为`Selected`(选中）。然后，将`Execute\
  \ CGI programs`(执行 CGI 程序）和`Generate directory indexes`(生成目录索引）行设置为`Yes`(是），并点击页面底部的`Save`(保存）按钮。这告诉\
  \ Apache 该目录可以执行 CGI 程序。\n4. 回到目录选项页面，点击`MIME Types`(MIME 类型)图标。在内容处理器表中，从`Handler`(处理器)列下的第一个空白菜单中选择`cgi-script`，并在旁边的`Extensions`(扩展名)列字段中输入`*.cgi`。然后点击表单底部的`Save`(保存)按钮。这告诉\
  \ Apache 将目录中所有以 .cgi 结尾的文件视为 CGI 程序。\n5. 最后，点击任何页面上的`Apply Changes`(应用更改)链接。现在你应该可以在所选目录中创建一个带有\
  \ .cgi 扩展的文件，并在 浏览器中进行测试。\n\n这种方法的替代方案是指定一个目录，该目录下的所有文件都被视为 CGI 程序。这种方法的优点是你可以为它们命名任何你喜欢的，而不需要强制使用\
  \ `.cgi` 扩展名。你还可以对此目录设置权限，以限制谁允许创建 CGI 程序，同时允许其他人编辑普通的 HTML 页面。\n\n要为 CGI 脚本设置目录，请使用以下步骤：\n\
  \n1. 在模块主页上，点击你想要设置 CGI 目录的虚拟服务器图标。如果你想为所有服务器设置，请点击`Default Server`（默认服务器）图标。\n\
  2. 点击`CGI Programs`(CGI 程序)图标打开设置各种 CGI 选项的页面。\n3. `CGI directory aliases`(CGI 目录别名)表的工作方式与第\
  \ 29.8 节“运行 CGI 程序”中描述的目录别名表非常相似。除了将 URL 路径映射到服务器上的目录外，它还告诉 Apache 通过该路径访问的任何文件都应被视为\
  \ CGI 程序。\n4. 在表格的第一空行中，在`From`字段中输入类似`*/cgi-bin/*`的 URL 路径，并在`To`字段中输入类似`*/home/example/cgi-bin/*`的目录。\n\
  5. 点击页面底部的`Save`按钮返回虚拟服务器选项页面。然后点击`Apply Changes`(应用更改)使 CGI 目录生效。\n\n现在你应该可以在目录中创建\
  \ CGI 程序并在浏览器中测试它们了。在某些 Linux 发行版中，Apache 的默认配置已经提供了一个位于 URL 路径`*/cgi-bin/*`的 CGI\
  \ 目录，映射到类似`*/home/httpd/cgi-bin/*`的目录。如果这对你足够了，就不需要遵循这些步骤。相反，你只需将 CGI 程序放在该目录中。\n\
  \n所有 CGI 程序通常以运行 Web 服务器的 UNIX 用户身份执行，该用户通常名为 `httpd` 或 `apache`。在具有多个无法完全信任的用户的系统中，这并不是件好事，因为一个用户的\
  \ CGI 程序能做的任何事情，其他人也可以做。例如，如果一个用户编写了一个编辑特定文件的 CGI 程序，他必须让该文件对 `httpd` 用户可写，这意味着其他人的\
  \ CGI 程序也可以向该文件写入内容。\n\n幸运的是，有一个解决方案。Apache 附带了一个名为 `sueexec` 的可选程序，可以作为另一个 UNIX\
  \ 用户身份运行 CGI 程序，而不是作为 Web 服务器用户。通常，每个虚拟服务器下的 CGI 程序将以拥有该服务器文件的 UNIX 用户身份运行。要进行此项设置，你可以按照以下步骤操作：\n\
  \n1. 确保你的系统中存在 `suexec` 程序，并且它具有 `setuid-root` 权限。Apache 通常期望在 `/usr/sbin` 或 `/usr/local/apache/sbin`\
  \ 中找到它，大多数 Linux 发行版将其作为 Apache 包的标准部分包含在内。但某些发行版默认没有设置 setuid，因此你可能需要运行 `chmod\
  \ 6711 /usr/sbin/suexec` 来使其生效。\n2. 在模块主页上，点击你希望以不同用户运行 CGI 程序的虚拟服务器图标。这将带你进入图 29.4\
  \ 所示的页面。\n3. 在虚拟服务器选项页面上点击`User and Group`(用户和组)图标。\n4. 对于`Run as UNIX user`(以 UNIX\
  \ 用户运行)字段，选择`User name`(用户名)并在旁边的字段中输入拥有虚拟服务器的用户名。\n5. 同样，对于`Run as UNIX group`(以\
  \ UNIX 组运行)，选择`Group name 一个组名)并输入上一步中指定的用户的主组。\n6. 点击`Save`按钮返回虚拟服务器的选项页面。\n7.\
  \ 要首次激活 `sueexec`，你需要停止并重启 Apache。使用页面顶部的`Stop Apache`链接停止它，然后使用`Start Apache`链接重新启动它。\n\
  \n要检查 `sueexec` 是否实际运行，请检查 Apache 错误日志文件，查看在 Web 服务器重启时记录的包含 `suEXEC mechanism enabled`\
  \ 的行。\n\n由于它可以作为系统上的任何用户执行命令，`sueexec` 具有许多安全限制以防止普通用户滥用。它只会运行由步骤 4 和 5 指定的用户和组拥有的\
  \ CGI 程序，并且仅当这些程序对任何其他用户不可写或不在另一个用户可写的目录运行时。用户和组的 ID 必须高于编译到程序中的最小值，以防止运行系统用户（如\
  \ `root` 或 `bin`）拥有的程序。最后，该程序必须位于编译到 `sueexec` 中的目录下，而不是文件系统中的其他地方。\n\n如果你有大量的虚拟服务器并希望在它们的目录中启用\
  \ CGI 程序执行，最后这项限制可能会非常困扰。默认允许目录通常是 Apache 的标准 CGI 目录，例如 `/home/httpd/cgi-bin`。要更改此设置，你需要重新编译\
  \ `sueexec` 并指定不同的目录，例如 `/home`。\n\n\n\n\nCGI 程序最大的问题是，Web 服务器在每次收到请求时必须启动一个新进程。如果\
  \ CGI 是用 `Perl` 或 `PHP` 编写的，该进程还需要加载该语言的解释器，而解释器本身可能是一个巨大的程序。结果是，处理一个 CGI 页面的请求比处理静态\
  \ HTML 或图像文件的请求慢得多，并且会对服务器系统产生更大的负载。\n\n出于这个原因，开发者开发了一些可选模块，允许 Web 服务器使用作为 Apache\
  \ 进程一部分解释器来运行 Perl 和 PHP 脚本。这些模块被称为 `mod_perl` 和 `mod_php`，并包含在许多 Linux 发行版的 Apache\
  \ 软件包中。然而，本章将不再涉及安装和配置。\n\n## 29.9 设置服务器端包含\n\n服务器端包含（Server-side includes）允许你创建简单的动态网页，而无需像使用\
  \ `Perl` 等语言编写整个 CGI 程序那样复杂。当启用此功能时，Apache 提供的某些 HTML 文件将检查是否以 `<!--` 开头的特殊标签。每个标签的内容将被替换为根据标签参数生成的动态文本，生成的页面将发送到\
  \ 浏览器。\n\n服务器端包含最常用的是将一个 HTML 页面的内容包含另一个页面中。如果你有一个公共页眉或页脚，希望在多个页面之间共享而不重复编写，这就会非常有用。当页面\
  \ HTML 中出现类似 `<!--include file=\"something.html\" -->` 的特殊标签时，它会被替换为 `something.html`\
  \ 文件的内容。\n\n服务器端包含还可以访问和设置环境变量、根据变量条件显示 HTML、运行 CGI 程序或 shell 命令并将输出包含在页面中。本节将不涵盖可用标签及其用途。有关标签的更多信息，请阅读\
  \ Apache 网站上的文档或关于 HTML 的书籍。\n\n通常情况下，允许不受信任的用户创建包含服务器端包含标签的 HTML 页面是完全安全的，因为它们无法用于执行如编辑服务器上的文件等潜在的危险操作。例外是\
  \ `<!--#exec -->` 标签，它可以运行任意 shell 命令并将其输出包含在网页中。由于命令是以运行 Apache 的 UNIX 用户（通常为 `httpd`）身份运行的，一个不允许创建\
  \ CGI 程序的用户可能可以使用这种标签来读取或修改他通常无法访问的文件。因此，可以配置 Apache 或不启用带风险的 `exec` 标签的服务器端包含。\n\
  \n由于检查 HTML 文件中的服务器端包含标签非常消耗 CPU，因此它们通常只对扩展名为 `.shtml` 的文件激活。这样，你可以将静态 HTML 放在 `.html`\
  \ 文件中，将动态内容放在 `.shtml` 文件中，这样服务器就不必在不存在标签的文件中浪费时间查找。如果你需要，也可以检查所有 `.html` 文件的服务器端包含。\n\
  \n要为虚拟服务器开启包含，请遵循以下步骤：\n\n1. 在模块主页上，点击你想要启用服务器端包含的虚拟服务器图标。或者，点击默认服务器（Default Server）图标以为所有虚拟主机启用。\n\
  2. 点击你想要启用服务器端包含的目录图标。通常，每个虚拟服务器都有其文档根目录的选项图标。如果没有，你可以按照第 29.6 节“设置每目录选项”中的步骤创建一个。\n\
  3. 如果你只想在网站的子目录下启用服务器端包含，也可以为该目录创建一个新的目录图标。\n4. 在目录选项页面上，点击文档选项（Document Options）图标，并将目录选项字段从\
  \ `Default` 更改为下方的 `Selected`。如果你想在不带 `exec` 标签的情况下启用服务器端包含，请将服务器端包含（Server-side\
  \ includes）行更改为 `Yes`。如果你也想启用潜在风险的 `exec` 标签，请将服务器端包含和 `execs` 行都更改为 `Yes`。无论何种，启用后点击页面底部的保存按钮。\n\
  5. 点击目录选项页面上的 MIME 类型图标。\n6. 如果你想对所有 HTML 文件启用包含，找到内容处理程序（Content handlers）表，并在\
  \ Handler 列下的第一个空菜单中选择 `server-parsed`。在扩展（Extensions）列旁边的字段中输入 `*.html`。这告诉 Apache\
  \ 以 `.html` 结尾的文件应该被检查是否有服务器端包含标签。\n7. 如果你只想对 `.shtml` 文件启用包含，请在 Extensions 列下输入\
  \ `.*shtml` 而不是 `*.html`。在 Extra MIME types 表中，在 Type 列下的第一个空字段中输入 `text/html`，并在旁边的\
  \ Extensions 字段中输入 `*.shtml`。这告诉 Apache `.shtml` 文件应该被检查是否有服务器端包含标签，并且它们确实包含 HTML。\n\
  8. 最后，点击 MIME Types 页面底部的保存按钮，然后返回目录选项页面点击应用更改（Apply Changes）链接。\n\n一旦启用了服务器端包含，你就可以在选目录中创建一个带有特殊标签的\
  \ `.html` 或 `.shtml` 文件来测试它们。然后，在 浏览器中打开该页面查看结果。如果由于某些原因服务器端包含没有正确启用，则什么都不会显示，因为\
  \ `<!--` 标签表示 HTML 注释。然而，如果标签被替换为“处理此指令时发生错误”的消息，则表示包含已激活，但标签参数存在错误。如果发生此类错误，更多细节将写入\
  \ Apache 错误日志文件（在第 29.8 节“运行 CGI 程序”中描述）。\n\n另一种方法是指示 Apache 对某些 HTML 文件执行服务器端包含处理。通过遵循以下步骤，可以配置\
  \ Web 服务器，使任何设置了 UNIX 执行权限的 `.html` 文件都经过包含处理（你可以使用 `chmod +x file.html` 等命令设置此权限）：\n\
  \n1. 遵循上述指令的第 1 到第 3 步，为某些目录启用服务器端包含。\n2. 在目录选项页面上，点击 CGI 程序图标。\n3. 在出现的页面上，将 `Process\
  \ includes on files with execute bit?`（对带有执行位的文件处理包含？）字段更改为 `Yes`。你也可以将其设置为 `Yes`\
  \ 并设置最后修改日期，以便 Apache 读取每个处理过的 HTML 文件的修改时间，并用其来设置 `Last-Modified` HTTP 标头。\n4.\
  \ 点击 CGI 程序页面底部的保存按钮，然后点击任何页面上的应用更改链接。\n\n你现在应该可以为目录中的 HTML 文件设置执行权限，Apache 在请求这些文件时会解析它们以查找服务器端包含标签。这允许你有选择性地开启包含处理，同时避免了仅仅因为文件现在包含包含标签就必须重命名文件（并破坏链接）的问题。\n\
  \n### 29.10 配置日志\n\n默认情况下，Apache 完成处理的每个请求都会以标准格式写入日志文件。对于每个请求，都会记录客户端 IP 地址、网站用户名、日期、时间、URL\
  \ 路径、状态码和传输的字节数。在 Apache 默认配置中，只有一个日志文件用于所有虚拟主机。然而，你可以重新配置 Web 服务器，为不同的虚拟主机使用不同的文件，甚至为每个请求记录额外信息。\n\
  \n\n\n\nApache 也有一个用于记录错误信息的日志文件，这些信息会在浏览器请求不存在的页面、HTTP 连接被终止或发生其他意外情况时生成。正如第 29.8\
  \ 节“运行 CGI 程序”所解释，该日志文件还包含 CGI 程序的错误输出以及服务器端包含指令的失败消息。\n\n要查看系统上 Apache 正在哪些日志文件并对其进行更改，请遵循以下步骤：\n\
  \n1. 在 Apache Web 服务器模块的主页上，点击 `Default Server` 图标。这将带你进入默认服务器选项页面，类似于图 29.4 所示的页面。\n\
  2. 点击 `Log Files` 图标，弹出图 29.7 所示的日志文件配置表。\n\n##### 图 29.7 默认服务器日志文件配置表。\n\n![](img/29fig07.jpg)\n\
  \n`Error log` 字段控制 CGI 和 Web 服务器错误信息的写入位置。通常会选择 `File` 选项，并在旁边的字段中显示应写入错误信息的文件路径。\n\
  \n如果你希望将消息发送到 `syslog`（第 13 章将介绍），可以选择 `System Log` 选项。所有消息将使用 `local7` 设施。\n\n\
  另一个可用选项是 `Program`，选择后将导致 Apache 运行在该字段中输入的命令，并将错误日志消息作为输入传递给它。这对于在报告错误时对其进行你自己的过滤或分析非常有用。\n\
  \n`Named log format` 表列出了可以用于下一步中定义的日志文件的预定义格式。每个格式都有一个用于引用它的 `Nickname`（别名），以及一个指定每个请求写入日志的字段的\
  \ `Format`（格式）字符串。当写入日志行时，格式字符串中的每个 `%` 字段都会被请求的详细信息替换，例如客户端地址、HTTP 状态码或虚拟服务器名称。关于可用\
  \ `%` 字段的更多详情，请参阅 Apache 在线文档。\n\n默认 Apache 配置中已经定义了如 `common` 和 `combined` 等几种标准格式。要创建自己的日志格式，请填写表格底部的空行。每个格式必须有一个唯一的\
  \ `nickname`。\n\n`Access log files` 表指定了用于记录 Apache Web 服务器处理的实际请求的文件。可以指定多个文件，并且每个文件的格式都可以独立从上一步说明的格式中进行选择。所有请求都将写入所有列出的日志文件。\n\
  \n表格的每行定义了一个日志文件。在 `Format` 列下，你可以选择该文件的格式，或选择 `Default` 选项使用标准的 Apache 日志文件格式。在\
  \ `Write to` 列下，你可以选择日志是写入到文件还是程序的输入。该文件或程序的路径必须输入到 `File` 或 `program` 列的字段中。\n\n\
  如果你想添加额外的日志文件，请填写表格底部空行的字段。\n\n如果你对日志配置进行了任何更改，请点击页面底部的 `Save` 按钮，然后点击 `Apply Changes`\
  \ 链接。\n\nApache 还允许你为每个虚拟服务器定义不同的日志文件，这样对系统中各种虚拟主机的请求就不会全部混合在一个文件中。默认情况下，所有请求都写入单个访问日志文件，且没有任何识别处理它们的虚拟服务器的字段。要更改此并让虚拟服务器写入自己的独立日志文件，请使用以下流程：\n\
  \n1. 在模块的主页上，点击你想要配置新日志文件的虚拟服务器图标。\n2. 点击 `Log Files` 图标，这将带你进入一个与图 29.7 相似的页面。\n\
  3. 如果你想让此虚拟服务器拥有自己的独立错误日志文件，将 `Error log` 字段从 `Default` 更改为其他选项之一。\n4. 要添加一个仅适用于此虚拟服务器的日志格式，请填写\
  \ `Named log formats` 表中的空行。然而，通常在默认服务器中定义所有日志格式会更好，这样它们可以在任何虚拟主机中使用。\n5. 为此虚拟服务器的独立日志文件在\
  \ `Access log files` 表中添加一行。一旦定义，对虚拟主机的请求将只写入该文件，而不是默认服务器 `Log Files` 页面上的访问列表。\n\
  6. 完成后，点击页面底部的 `Save` 按钮，将你的新日志文件设置写入 Apache 配置。然后回到虚拟服务器选项页面，点击顶部的 `Apply Changes`\
  \ 链接使其生效。\n\n如果你有多个虚拟服务器并想识别每个请求发送到了哪一个，另一种解决方案是更改默认访问日志文件的格式，在每行日志中包含虚拟服务器主机名。要设置此项，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击 `Default Server` 图标，然后点击默认服务器选项页面上的 `Log Files` 图标。\n2. 在 `Named\
  \ log formats` 表中找到 `common` 格式行，并更改其 `Format` 字段使其内容为：\n\n```\n%h %l %u %t \"%r\"\
  \ %>s %b %{Host}i \"%{Referer}i\" \"%{User-Agent}i\"\n```\n额外的字段将告诉 Apache 在每行日志中为每个请求包含虚拟服务器主机名、引荐页\
  \ URL 和浏览器名称。\n3. 在 `Access log files` 表中找到你服务器的主日志文件行，并确保 `Format` 字段被设置为 `common`，而不是\
  \ `Default` 或其他命名格式。\n4. 点击 `Save` 按钮，然后点击 `Apply Changes` 链接。从现在起写入日志文件的条目都将包含这些额外信息。\n\
  \n### 29.11 设置自定义错误消息\n\n当浏览器尝试访问不存在的页面、受密码保护的目录或运行故障的 CGI 程序时，Apache 会返回其内置错误消息之一。由于这些错误消息页面并不总是那么友好或美观，你可以配置\
  \ Web 服务器使用你自己的页面。这可以设置成适用于所有虚拟服务器、单个服务器或仅一个目录。要遵循的步骤是：\n\n1. 在模块的主页上，点击虚拟服务器图标或\
  \ `Default Server` 图标（如果你想定义适用于所有服务器的自定义错误消息）。\n2. 如果你只想为特定的目录、URL 路径或文件名显示自定义消息，请点击服务器页面上的对应图标。如果尚未存在目录的图标，你将按照第\
  \ 29.6 节“设置目录选项”的步骤定义一个。\n3. 在目录或虚拟服务器选项页面点击 `Error Handling` 图标。\n\n你可以在 `Custom\
  \ error responses` 表中输入错误代码及其对应的自定义消息。目录或服务器的任何现有错误消息将列出，随后是一个空行。要添加新代码，请先在 `Error\
  \ code` 字段中输入 HTTP 错误码。一些常见的代码及其原因有：\n\n- `404`: 请求的页面不存在。\n- `403`: 拒绝访问页面。\n-\
  \ `401`: 浏览器在访问页面前必须登录。\n- `500`: CGI 程序失败，或发生了其他内部错误。\n\n如果你只想更改 Apache 在发生错误时显示的消息，请选择\
  \ `Response` 列下的 `Show message`，并在 `URL or message` 下的字段中输入你的新消息文本。\n\n另一方面，如果你想改为显示另一个页的内容，请选择\
  \ `Goto URL` 并在 `URL or message` 字段中输入 URL 页面（如 `/errors/500.html*`）或完整 URL（如 `http://www.error.com/505.html*`）。在后的情况下，当所选代码发生错误时，浏览器将重定向到该\
  \ URL。\n\n\n\n点击页面底部的 `Save` 按钮。如果你想添加另一个自定义错误消息，请再次点击 `Error Handing` 图标，并在表格中填写新的空白行。\n\
  \n在任何页面上点击 `Apply Changes` 按钮可使新的自定义错误消息生效。\n\n某些网络浏览器（例如默认配置下的 `IE`）不会显示由 Web 服务器发送的错误消息文本。相反，只会显示错误代码数字和由浏览器生成的更友好的消息。\n\
  \n### 29.12 添加和编辑 MIME 类型\n\nMIME 类型是 Apache、邮件客户端以及许多其他程序用于指示文件和其他数据类型的方法。一个 MIME\
  \ 类型由两个用斜杠隔开的单词组成，例如 `text/html`、`image/gif` 或 `video/mpeg`。正如这些示例所示，第一个单词是类型的通用类别，而第二个单词是实际的类型名称。\n\
  \nWeb 服务器向浏览器发送的每个响应都带有一个类型，以便浏览器知道如何显示它。当请求普通文件时，Web 服务器通常通过查看文件扩展名来确定类型，例如 `.gif`\
  \ 或 `.html`。CGI 程序在生成任何其他内容之前，必须向 Web 服务器提供其类型，然后由其转发到浏览器。这允许 CGI 程序生成 HTML、纯文本、图像或任何类型的数据，无论\
  \ CGI 脚本本身的文件名是什么。\n\n浏览器从不尝试通过查看 URL 中的文件名扩展名来确定页面类型。相反，它们始终依赖于 Web 服务器发送的 MIME\
  \ 类型。Apache 从一个适用于所有虚拟服务器的配置文件获取其全局 MIME 类型列表及其关联的扩展名。要编辑并向此类型列表添加类型，请遵循以下步骤：\n\n\
  在模块主页上，点击 `Global Configuration` 部分的 `MIME Types` 图标。这将带你进入一个页面，列出 Apache 目前已知的所有类型以及文件名扩展名。你几乎可能需要的每个类型应该已经列出了。\n\
  \n点击列表上方或下方的 `Add a new MIME type` 链接来创建一个新类型。\n\n在出现表单的 MIME type 字段中输入如 `text/foo`\
  \ 的类型名称。允许定义两次相同的类型，只要每个条目关联的扩展扩展名不同。\n\n在 `Extensions` 文本框中输入你想与此类型关联的所有文件名扩展名，例如\
  \ `.foo` 和 `.fo`。确保没有其他 MIME 类型使用相同的扩展名。\n\n点击表单下方的 `Save` 按钮。浏览器将返回类型列表，其中将你的新条目。\n\
  \n在任何页面上点击 `Apply Changes` 链接使新类型生效。\n\n你可以通过点击列表中的名称来编辑或删除现有的全局 MIME 类型，这将弹出类型编辑表。修改\
  \ MIME 类型或 `Extensions` 字段并点击 `Save`，或者按 `Delete` 按钮将其完全删除。无论何种方式，之后都必须使用 `Apply\
  \ Changes` 链接使更改生效。\n\nMIME 类型也可以在 Apache 配置中按虚拟服务器或按目录级别定义。如果你想覆盖特定目录中某些扩展名的类型，或者创建一个只有一个虚拟服务器需要的类型，这将非常有用。执行此操作，请遵循以下步骤：\n\
  \n在模块主页上，点击你想定义 MIME 类型的虚拟服务器图标。\n\n如果你只想让该类型用于特定目录、URL 路径或文件的请求，请点击服务器选项页面上的对应图标。如果尚不存在目录图标，你需要按照本章第\
  \ 29.6 节“Setting Per-Directory Options”中的步骤定义一个。\n\n在目录或虚拟服务器选项页面上，点击 `MIME Types`\
  \ 图标。\n\n`Extra MIME types` 表格用于输入仅适用于此虚拟服务器或目录的类型。在 `Type` 列下的第一个空白字段中输入如 `text/foo`\
  \ 的类型。在相邻的 `Extensions` 字段中，输入一个或多个文件名扩展名，例如 `.foo`。\n\n点击页面底部的 `Save` 按钮。如果你想添加多个类型，将需要再次点击\
  \ `MIME Types` 图标，以便表格中出现新的空白字段。\n\n完成后，使用任何页面顶部的 `Apply Changes` 链接使新的类型映射生效。\n\
  \n在 MIME 类型页面上，有一个标记为 `Default MIME type` 的有用字段。如果设置了该字段，Apache 无法识别类型的任何文件都将被处理为此字段中输入的内容。通常，它被设置为默认，但你可能可能将其更改为其他内容。\n\
  \n### 29.13 目录密码保护\n\nHTTP 协议有一种标准方法，用于指示目录或站点在访问之前需要用户名和密码。密码保护对于保护仅允许某些人访问的目录，或者设置一个使用\
  \ CGI 程序向用户显示不同内容的网站可能很有用。要保护目录，请遵循以下步骤：\n\n在模块主页上，点击你想启用密码保护的虚拟服务器图标。\n\n点击你想保护的目录、URL\
  \ 位置或文件名图标。如果尚不存在，请按照本章前面的第 29.6 节“Setting Per-Directory Options”中的步骤创建它。\n\n点击\
  \ `Access Control` 图标，这将带你进入图 29.8 所示所示页面。\n\n##### 图 29.8 访问控制表。\n\n![](img/29fig08.jpg)\n\
  \n在 `Authentication realm name` 字段中，取消选择 `Default` 并为受保护目录输入描述，例如 `Private files`。当用户尝试登录时将在浏览器中显示。\n\
  \n将 `Authentication` 类型更改为 `Basic`。`Digest` 类型更安全，但许多浏览器不支持它。\n\n将 `Restrict access\
  \ by` 字段更改为 `All valid users`。这告诉 Apache 允许第 7 步设置的密码文件的任何用户登录。\n\n你可以通过选择 `Only\
  \ these users` 选项并在相邻的文本字段中输入允许的用户名来将访问限制为部分用户。你也可以选择 `Only these groups` 并在字段中输入你想允许的组名。如果在此页面上为多个目录输入了相同的身份验证文件，这些选项将非常有用。\n\
  \n在 `Text file authentication` 框中，在 `User text file` 旁边的文本字段中输入用于存储用户名和密码的文件完整路径。该身份验证文件必须每个用户包含一行，格式为\
  \ `username`:`encrypted-password`。密码使用标准的 UNIX 加密，就像 `/etc/shadow` 文件中的一样。\n\n该文件并不一定已经存在，因为当你按照后续步骤中的说明添加用户时，它将被创建。但是，它不应该放在你的\
  \ Web 服务器的文档根目录下，因为这可能允许攻击者下载它、破解密码并登录你的网站。\n\n\n\n\n如果你想对用户进行分组以实施进一步限制（如第 6 步所示），请在\
  \ `Group` 文本字段中输入组文件的完整路径。该文件必须每组包含一行，格式为 `groupname: username1 username2 等`。\n\n\
  该文件不需要预先存在，因为它会在稍后的步骤中添加组时被创建。如果你只是想设置简单的用户名和密码认证，那么这一步是不必要的。\n\n点击页面底部的 `Save`\
  \ 按钮，你将返回到目录选项页面。\n\n如果用户和组文件已经存在，或者你计划手动编辑它们，可以跳到`第 21 步`。否则，再次点击 `Access Control`\
  \ 图标重新显示表单。\n\n### 管理用户\n\n点击 `User` 文本旁旁 `Edit users` 链接。这将打开一个页面，列出文件中当前记录的所有\
  \ Web 服务器用户（如果有的话）。\n\n要创建一个新用户，点击列表上方或下方的 `Add a new user` 链接。\n\n在用户创建表单上，在 `Username`\
  \ 字段输入登录名。\n\n在 `Password` 字段中，选择 `Plain text` 并在旁边的字段中输入用户密码。\n\n点击 `Save` 按钮以添加用户并重新显示用户列表。\n\
  \n你可以通过点击列表中的名称来编辑现有用户，更改其详情并点击 `Save` 按钮。要删除用户，请点击用户编辑表单上的 `Delete` 按钮。\n\n完成用户创建后，使用\
  \ `Return to access control` 链接返回访问控制表单。\n\n### 管理组\n\n如果你也在使用组文件，点击 `Group` 文本旁边的\
  \ `Edit groups` 链接，以显示现有组及其成员的列表。\n\n要创建一个新组，点击 `Add a new group` 链接，并在出现的创建表单中填写\
  \ `Group name` 和 `Members` 字段，然后点击 `Save`。成员必须以空格分隔的用户名列表形式输入。\n\n你可以通过点击列表中的名称来编辑和删除现有组，就像操作用户一样。\n\
  \n完成组创建后，遵循 `Return to access control` 链接返回访问控制表单。\n\n### 激活\n\n最后，点击任何页面上的 `Apply\
  \ Changes` 链接以激活目录的密码保护。你可以通过尝试访问受保护的页面并以你创建的用户之一登录来进行测试。\n\n将来，你可以通过直接编辑文本文件或遵循此列表中的相关步骤来添加和编辑用户及组。不过，更改用户或组列表后不需要使用\
  \ `Apply Changes` 链接，因为 Apache 在每次请求时都会重新读取文件。\n\n### 性能考虑\n\n上述列表中的指令说明了如何创建存储用户和组的文本文件，但如果你的网站有大量用户，文本文件不是存储它们的最佳方法。因为\
  \ Apache 每次请求都会重新读取用户文件，文件越大，Web 服务器查找用户并生成响应所需的时间越长。在编辑或删除用户时，修改文件的程序必须读取整个文件并重新写，如果文件很大，这需要一些时间。如果多个进程同时尝试操作同一个用户文件，会增加文件损坏的概率。\n\
  \n解决方案是使用 `DBM` 文件来存储用户和组。这些是二进制格式的数据库文件，通过键（如用户名）索引，并可以安全地原地编辑。它们唯一的缺点是无法通过 `cat`\
  \ 和 `vi` 等处理纯文本的 UNIX 程序查看或更改。\n\n从 `DBM` 文件设置认证的过程与上述列表步骤几乎相同。唯一的区别是必须将用户和组文件名输入\
  \ `DBM file` 认证框中的 `User DBM file` 和 `Group DBM file` 字段。`User` 文本文件和 `Group` 文本字段必须保留为\
  \ `Default`。遗憾的是，Webmin 不允许像处理文本文件那样编辑 `DBM` 文件中的用户或组。相反，你需要编写 Perl 脚本或使用像 `makemap`\
  \ 的程序在命令行创建它们。\n\n### 同步\n\nApache 用户和密码文件与系统的 UNIX 用户列表完全分离。然而，此模块可以配置为在 `Users\
  \ and Groups` 模块中创建、编辑或删除同名用户时，在密码文件中添加、更新或删除该用户。这是通过该模块的同步功能实现的，第 4 章有更详细的介绍。\n\
  \n如果你希望允许系统的某些 UNIX 用户访问特定的 Web 目录，并希望他们的用户名和密码在更改时保持同步，那么同步将非常有用。要设置 Apache 文本认证文件与由\
  \ `Users and Groups` 模块管理的 UNIX 用户之间的同步，请遵循以下步骤：\n\n1. 在模块主页上，点击受保护目录所在的虚拟服务器图标，然后点击目录图标。\n\
  2. 点击 `Access Control` 图标，然后点击 `User` 文本字段旁边的 `Edit users` 链接。\n3. 用户列表下方是设置此用户文件同步的表单。`Add\
  \ a user when a UNIX user is added`（添加 UNIX 用户时添加用户）、`Change the user when a UNIX\
  \ user is changed`（更改 UNIX 用户时更改用户）和 `Delete the user when a UNIX user is deleted`（删除\
  \ UNIX 用户时删除用户）复选框是非常自而易见的。你通常会勾选所有三个，如果只想手动在此文件中添加新用户，可能只选最后两个。\n4. 选择所需的选项后，点击\
  \ `Save` 按钮。从现在在 `Users and Groups` 模块中进行的任何更改都会更新此用户列表。\n\n每个 Apache 用户文本文件都有独立的同步选项。由于它们与文件名关联，如果重命名，选项将重置为默认值。只有在\
  \ Webmin 的 `Users and Groups` 或 `Change Passwords` 模块中的更改才会同步到 Apache 用户文件中。如果用户使用命令行\
  \ `passwd` 程序更改密码，其 Web 密码不会同步。\n\n### 禁用认证\n\n如果你想关闭目录的认证以便任何浏览器都能访问，则无需删除整个 `Directory\
  \ Configuration` 图标。相反，你只需遵循以下步骤：\n\n1. 在模块主页上，点击受保护目录所在的虚拟服务器图标，然后点击目录图标。\n2. 点击\
  \ `Access Control` 图标进入图 29.8 所示的页面。\n3. 将 `Authentication realm name`、`Authentication\
  \ type`、`Restrict access by login`、`User text file` 和 `Group text file` 字段全部改回 `Default`。如果你使用的是\
  \ `DBM` 文件而不是文本，也将 `User DBM file` 和 `Group DBM file` 字段改为 `Default`。\n4. 点击 `Save`\
  \ 按钮，然后点击目录页面上的 `Apply Changes` 链接。\n\n### 29.14 按地址限制访问\n\nApache 还可以配置为限制某些客户端系统访问目录、URL\
  \ 位置或文件名。Web 服务器知道连接到它的浏览器的 IP 地址，并可以使用该地址确定浏览器是否允许请求某些页面。\n\n在某些情况下，Web 服务器无法客户端的真实\
  \ IP 地址。如果客户端通过代理服务器或执行 NAT 的防火墙访问 Web，则请求源的 IP 地址将是代理或防火墙系统。有一种获取真实地址的方法，但通常这不是问题，因为来自代理或防火墙的所有客户端从访问控制的角度来看通常被视为同等。\n\
  \n\n\n\nApache 通过检查客户端 IP 地址和主机名是否与规则列表匹配来决定是否允许其访问。规则分为两类：允许访问的规则和拒绝访问的规则。根据配置，Web\
  \ 服务器会先在拒绝规则之前检查所有允许规则，或者反之亦然。第一个匹配的规则将决定客户端是否被拒绝，且不再检查后续的规则。\n\n大多数设置 IP 访问控制的人都希望允许某些地址和网络访问，并拒绝其他人。例如，您可能希望允许公司局域网（LAN）上的主机访问内网，但防止互联网上的其他用户访问。要设置此类访问控制，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击您想要启用 IP 访问控制的虚拟服务器图标。\n2. 点击您想要限制访问的目录、URL 位置或文件名图标。如果尚尚存在，请按照本章前面的第\
  \ 29.6 节“设置每个目录选项”中的步骤创建它。\n3. 点击 `Access Control` 图标，这将带您进入图 29.8 所示的页面。\n4. 滚动到\
  \ `Restrict access` 表格，并将 `Access checking order` 字段更改为 `Allow then deny`。这告诉 Apache，任何未被访问控制规则明确允许的请求都将被拒绝，且所有允许访问的规则应在拒绝规则之前检查。\n\
  5. 如果选择了备用选项 `Deny then allow`，则不匹配任何规则的请求将被允许，且拒绝规则将在允许规则之前检查。\n6. `Mutual failure`\
  \ 选项的效果与 `Allow then deny` 相同，不应使用。\n\n起初，此表仅包含一个空行，用于输入第一条访问控制规则。由于您只想允许某些客户端并阻止其余客户端，请从\
  \ `Action` 列的菜单中选择 `Allow`。\n\n`Condition` 列下的菜单和字段决定了将进行何种检查以判断客户端是否被允许。以下是可用的条件类型：\n\
  \n- **All requests（所有请求）：** 如果选择，所有客户端请求将执行所选的操作。\n- **Request from host（来自主机的请求）：**\
  \ 如果选择，只有主机名与字段中文本相同或以该文本结尾的客户端才会执行该操作。Apache 通过对客户端的 IP 地址进行反向 DNS 查询来获取主机名，这并不总是有效。\n\
  - **Request from IP（来自 IP 的请求）：** 如果客户端的 IP 地址与菜单旁边字段中输入的完全相同，将执行所选的操作。\n- **Request\
  \ from partial IP（来自部分 IP 的请求）：** 如果选择，IP 地址以字段中输入的部分 IP 开头的客户端将执行所选的操作。例如，您可以输入\
  \ `192.168*` 来匹配该网络上的所有客户端。\n- **Request from net/netmask（来自网络/子掩码的请求）：** 如果客户端的\
  \ IP 地址在输入的网络地址和子掩码指定的范围内，将执行所选的操作。网络规范的示例为 `192.168.1.0/255.255.255.0`。\n- **Request\
  \ from net/CIDR（来自网络/CIDR 的请求）：** 如果客户端的 IP 地址在输入的网络地址和前缀位指定的范围内，将执行所选的操作。`192.168.1.128/25`\
  \ 是此类网络规范的示例。\n- **If variable is set（如果设置变量）：** 如果选择此选项，只有当相邻字段中输入的环境变量已设置时，才会执行所选的操作。Apache\
  \ 提供了多种根据请求头和浏览器类型设置变量的方法，这些方法过于复杂，在此不再介绍。\n\n点击表单底部的 `Save` 按钮，如果选择没有错误，您将返回目录选项页面。要允许多个客户端\
  \ IP 地址或网络，请再次点击 `Access Control` 图标，并在 `Restrict access` 表格中填充另一个空行。您可以通过添加许多允许和拒绝规则来构建复杂的访问控制规则集。\n\
  \n完成后，使用任何页面上的 `Apply Changes` 链接使限制生效。\n\n对于同一个目录，可以结合 IP 地址限制和用户名/密码访问控制。这可以通过两种方式实现：对客户端检查任何\
  \ IP 限制，然后强制输入密码；或者仅在他们未通过 IP 限制时才提示密码。\n\nApache 使用的模式由访问控制表上的 `Clients must satisfy`\
  \ 字段决定。如果您将其设置为 `All access controls`，则必须同时通过密码和 IP 检查。然而，如果选择 `Any access control`，则只有在\
  \ IP 检查失败时才会提示密码。这对于允许内部网络中的所有人以及具有有效用户名和密码的互联网用户访问某个目录非常有用。\n\n### 29.15 编码、字符集和语言\n\
  \n正如第 29.12 节“添加和编辑 MIME 类型”所解释，Apache 尝试为发送浏览器的每个文件确定 MIME 类型。除了类型之外，文件还可以具有编码，通常用于指示它们是如何压缩的。编码由文件扩展名决定（例如\
  \ gzipped 数据的 `.gz`），浏览器可以在显示文件之前对其进行解压缩。\n\n例如，这将允许创建一个名为 `foo.html.gz` 的文件，其中包含压缩的\
  \ HTML 数据，并被 Web 服务器识别为此类。对于大文件，以压缩格式发送可以节省带宽并缩短下载时间。遗憾的是，并不是浏览器都支持常见的 `.gz` 和 `.Z`\
  \ 格式，因此此功能并不总是有用。在本书编写时，Mozilla 和 Netscape 支持压缩编码，但 IE 不支持。\n\n编码可以全局定义、按虚拟服务器定义，或仅针对单个目录或\
  \ URL 位置定义。然而，它们通常是全局定义的，可以通过以下步骤查看和编辑：\n\n- 点击 Apache Webserver 模块主页上的 `Default\
  \ Server` 图标。\n- 点击 `MIME Types` 图标，滚动到 `Content encodings` 表格。表格中的每行定义两个编码，并且始终有一对空字段用于添加新编码。通常已经存在\
  \ `x-compress` 和 `x-gzip` 编码的条目，因为它们包含在 Apache 默认配置中。\n- 要添加新编码，请在 `Content encoding`\
  \ 列下的第一个空字段中输入其名称。在相邻字段中，输入用空格分隔的文件扩展名列表，这些扩展名用于该格式的文件。\n- 要更改现有编码的名称或扩展名，只需编辑表格中的对应字段。例如，您可以通过将它们输入到现有字段中来为编码添加额外的扩展名。\n\
  - 如果您想删除编码，只需清除 `Content encoding` 和 `Extensions` 字段下的内容。\n\n编辑完编码后，点击页面底部的 `Save`\
  \ 按钮，然后点击 `Apply Changes` 链接。\n\nApache 在确定文件的 MIME 类型、编码、语言和字符集时会考虑所有的扩展名，且不考虑顺序。这意味着名为\
  \ `foo.html.gz` 和 `foo.gz.html` 的文件都被识别为 gzip 压缩的 HTML 数据。\n\nApache 向向请求文件的浏览器提供的另一个信息是文件中文本使用的字符集。如果您的所有网页都是英文，或者像马来语这样不使用非英语字母的语言，那么您不需要关心这一点。然而，如果您正在使用标准\
  \ ASCII 字符集之外的字符创建其他 HTML 页面，那么向浏览器指示每个页面使用的字符集是有用的且通常是必要的。\n\n\n\n德语和法语等语言使用特殊字符，例如\
  \ `ö`，这些字符由大于 128 的字节表示。中文和俄语等语言的字符非常多，每个字符必须用两个字节来表示，并使用如 `Big5` 和 `KOI8` 等特殊字符集。对于这些语言，告知浏览器每个页面的字符集至关重要，这样它才能解码包含的文本并使用正确的字体显示字符。\n\
  \n与编码类似，Apache 通过查看文件名扩展名来确定每个文件的字符集。例如，名为 `foo.html.Big5` 的文件将被识别为 `HTML` 文件，其文本使用中文\
  \ `Big5` 格式编码。一个文件可以同时拥有字符集和编码，例如 `foo.html.Big5.gz`，且扩展名出现的顺序并不重要。\n\n字符集可以进行全局定义，也可以针对单个虚拟服务器和目录进行定义。要查看和编辑全局字符集列表，请按照以下步骤操作：\n\
  \n1. 在 Apache Web 服务器模块的主页上，点击 `Default Server`（默认服务器）图标。\n2. 点击 `Languages`（语言）图标并向下滚动到\
  \ `Extra character sets`（额外字符集）表格。表格中的每行定义两个字符集，并且至少有一对空字段用于添加新字符集。在默认的 Apache 配置中，已经定义了几个常用的字符集。\n\
  3. 如果你需要添加新的字符集，请在 `Charset`（字符集）列下的第一个空字段输入其标准 ISO 名称，并在相邻的 `Extensions`（扩展名）字段输入与其相关的文件名扩展名。许多常用字符集已默认定义，因此你可能可以直接为文件使用已识别的扩展名之一。多个扩展名之间必须用空格分隔。\n\
  4. 你只需可以通过编辑表格中的字段来更改现有字符集的名称或扩展名。通常情况下，重命名默认集合不是好主意，因为它们使用了浏览器识别的标准名称。然而，添加扩展名是完全安全的。\n\
  5. 要删除字符集，只需清除包含其名称及其关联扩展名的字段即可。\n6. 完成编辑后，点击 `Save`（保存）按钮。如果你用完了 `Extra character\
  \ sets` 表格中的所有空白字段并想添加更多，请再次点击 `Languages` 图标。否则，使用 `Apply Changes`（应用更改）链接使更改生效。\n\
  \n由于大多数常用的字符集已在 Apache 配置中默认定义，通常没有必要添加新的。相反，你只需要找到相关的扩展名并将它们用于你的文件名即可。\n\nApache\
  \ 还可以通过查看文件名扩展名来识别 `HTML` 或文本文件编写的语言。起初，文件的语言和编码之间似乎没有区别，但情况并非总是如此。例如，`ISO-8859-2`\
  \ 字符集用于许多不同的欧洲语言，而中文可以用 `Big5` 和 `GB` 字符集表示。\n\n遗憾的是，很少有浏览器会实际使用文件编写的语言。不过，某些浏览器可以配置为请求用户选择的语言的页面，而\
  \ Apache 可以被设置为使用此信息来识别要返回正确的文件。当目录选项页面上的 `Generate Multiviews`（生成多视图）选项开启时，就会发生这种情况。\n\
  \n当该选项处于激活状态时，请求如 `*/documents/foo` 这样实际并不存在的页面将导致 Apache 扫描 `/documents` 目录下的所有以\
  \ `foo` 开头的文件，识别它们的类型和语言，并返回与客户端指定语言最匹配的一个。如果你希望同一个页面的多个不同语言版本，但又都通过相同的 URL 访问，那么这将非常有用。\n\
  \n要查看和编辑 Apache 识别的语言和文件扩展名，请按照以下步骤操作：\n\n1. 点击 Apache Web 服务器模块主页上的 `Default Server`\
  \ 图标。\n2. 点击 `Languages` 图标并找到 `Content languages`（内容语言）表格。表格中的每行定义两种语言，并且至少有一对空字段用于添加新语言。默认\
  \ Apache 配置包含了几个常用的语言。\n3. 要添加新语言，请在 `Language` 列下的第一个空字段输入其 ISO 代码，并在 `Extensions`\
  \ 列下输入该语言文件的扩展名列表（扩展名之间用空格分隔）。\n4. 可以仅通过更改表格中的代码和扩展名来编辑现有语言，或通过清除其字段来删除它们。不更改现有默认语言的标准代码是明智的。\n\
  5. 完成语言编辑后，点击页面底部的 `Save` 按钮。如果在添加新语言时用尽了空白字段，请再次点击 `Languages` 图标返回表格。否则，使用 `Apply\
  \ Changes` 链接激活你的新设置。\n\n与编码和字符集一样，Apache 在确定文件类型和语言时并不在意文件名中扩展名的顺序。因此，`foo.html.de`\
  \ 和 `foo.de.html` 文件都会被识别为德语编写的 `HTML` 文档。\n\n## 29.16 编辑 .htaccess 文件\n\n如引言所示，可以通过在目录中创建一个名为\
  \ `.htaccess` 的文件为目录设置 Apache 选项。这些文件通常由普通用户创建，他们没有权限编辑主 Web 服务器配置文件，但希望更改 Apache\
  \ 在访问其目录时的行为。正如本章其他部分所的，`.htaccess` 文件可用于设置按目录配置的几乎所有选项。\n\n其中一个文件中的选项适用于其目录及其任何子目录中的所有文件。然而，这些选项可以被目录树中更低处的此类文件覆盖。主\
  \ Apache 配置中的按目录选项将被相同目录 `.htaccess` 文件中的选项覆盖，但子目录的目录选项将覆盖父目录 `.htaccess` 文件中的选项！\n\
  \nWebmin 也可以用于创建和编辑 `.htaccess` 文件。如果系统中已经存在某些手动创建的文件，则在你在使用 Webmin 编辑它们之前，必须先让\
  \ Webmin 发现它们。若要让 Webmin 搜索系统上的现有文件，请按照以下步骤操作：\n\n1. 在模块的主页上，点击 `Per-Directory Options\
  \ Files`（按目录选项文件）图标（这是 Webmin 对 .htaccess 文件的命名）。\n2. 在出现的页面上，有一个标记为 `Find Options\
  \ Files`（查找选项文件）的按钮，旁边有两个选项。如果选择了 `Automatically`（自动），Webmin 将在每个虚拟服务器的文档根目录查找选项文件。如果选择了\
  \ `From directory`，你可以输入一个将被搜索的目录。\n3. 如果你系统上的网站由于使用了 `aliases` 或用户 Web 目录导致页面位于文档根目录之外，则后一个选项非常有用。\n\
  4. 点击按钮让模块搜索选定的目录及其任何子目录。该页面将重新显示，但顶部会显示一个所有 `.htaccess` 文件的表格（假设找到了一些文件）。\n\n要编辑文件中设置的选项，只需从\
  \ `Per-Directory Options Files` 列表中点击其路径。这将打开一个与图 29.5 所示的目录选项页类似的页面。你可以点击图标来编辑重定向、用户名和密码访问控制、IP\
  \ 地址限制、MIME 类型和自定义错误消息。之前章节中适用于目录的指令也可以在此遵循。唯一的区别是，在做出更改后不需要使用 `Apply Changes` 链接，因为\
  \ Apache 始终会在每次请求时重新读取它遇到的 `.htaccess` 文件。\n\n\n\n您也可以通过在 `Create Options File`\
  \ 按钮旁边的字段中输入要创建的目录路径来创建一个新的 `.htaccess` 文件。点击该按钮后，将创建一个空文件，并将其所有权设置为默认服务器的“用户和组”页面上配置的用户和组。该文件将（添加到\
  \ Webmin 的已知选项文件列表中，您的浏览器将重定向到该页面的选项文件。\n\n要删除按目录的选项文件，请在列表中点击其名称，然后在出现的页面顶部点击 `Delete\
  \ File` 链接。一旦文件被删除，Apache 将停止使用其为所在目录所定义的任何选项。\n\n本章稍后的第 29.6 节“设置按目录选项”解释了如何设置仅适用于特定名称文件的选项，无论这些文件位于哪个目录中。同样可能的是，一个\
  \ `.htaccess` 文件也可以包含仅适用于其所在目录中部分文件的选项。这对于某些操作非常有用，例如拒绝 `/usr/local/src` 目录下所有匹配模式为\
  \ `*.c` 的文件的访问，而这种操作仅通过按目录或按文件设置选项是无法实现的。\n\n要设置此类选项，请遵循以下步骤：\n\n在模块的主页上，点击 `Per-Directory\
  \ Options Files` 图标。然后，点击您希望应用选项的目录下的 `.htaccess` 文件。如果该文件不存在，请按照之前的说明使用 `Create\
  \ Options File` 按钮来创建它。\n\n滚动到 `Create Per-File Options` 表单，在 `Path` 字段中输入文件名或模式。模式只能使用如\
  \ `*` 和 `?` 等 shell 通配符字符，除非您将 `Regexp?` 字段更改为 `Match regexp`，在这种情况下，可以使用如 `|`、`[`、`]`\
  \ 和 `+` 等字符的 Perl 正则表达式。\n\n当您点击 `Create` 按钮时，将重新显示相同页面，但会出现您刚刚输入的文件名或名称模式的额外图标。\n\
  \n点击新图标，这将打开另一个包含不同类别选项的页面，这些选项可以适用于与指定文件名或模式匹配的文件。此页面与图 29.5 所示的目录选项页面非常相似，它链接到的页面也大部分相同。\n\
  \n您也可以在此页面上遵循本章其他部分关于创建重定向、自定义错误消息或 IP 访问控制的说明，以便为目录中的匹配文件设置相同的选项。唯一的区别是无需点击 `Apply\
  \ Changes` 链接即可使新设置生效。\n\n您可以通过编辑 `Options apply to` 表单中的 `Path` 字段并点击 `Save` 来更改保存选项的文件名或模式。您也可以通过点击同一表单中的\
  \ `Delete` 按钮完全删除它们，从而改用目录的选项。\n\n在一个有许多由不可信任用户运行的虚拟网站的系统中，您可能希望限制这些用户允许在 `.htaccess`\
  \ 文件中输入的指令。如果您启用了用户 Web 目录，这也会很有用（第 29.17 节“设置用户 Web 目录”对此说明）。用户可以通过向选项文件中放入正确的指令为其目录启用\
  \ CGI 脚本，这可能会给您的服务器带来安全风险。\n\n您可以按目录限制 `.htaccess` 文件中可以指令。要执行此操作，请遵循以下步骤：\n\n在\
  \ Apache Webserver 模块的主页上，点击目录所在的虚拟服务器图标。\n\n点击您想要限制 `.htaccess` 文件的目录图标；如果目录尚不存在，请按照第\
  \ 29.6 节“设置按目录选项”中的说明创建它。\n\n点击 `Document Options` 图标。\n\n在 `Options file can override`\
  \ 字段中，选择 `Selected below` 单选按钮。然后，取消提供的表格中您不希望用户包含在 `.htaccess` 文件中的指令类别。可用类别有：\n\
  \n- **Authentication options**：取消此选项以防止使用与密码身份验证相关的指令。\n- **MIME types and encodings**：取消此选项以防止为文件设置\
  \ MIME 类型、字符集、编码和语言。这将停止将具有特定扩展名的文件指示为 CGI 程序。\n- **Indexing and index files**：此选项控制用于目录索引的指令的使用。\n\
  - **Hostname access control**：取消此选项以停止使用 IP 访问控制指令。\n- **Directory options**：此选项控制用于设置目录选项的指令，例如是否进行索引以及是否启用了\
  \ CGI 程序。\n\n点击 `Save` 按钮，然后点击 `Apply Changes` 链接。\n\n每当用户尝试使用其未允许使用的指令时，当请求包含 `.htaccess`\
  \ 文件的目录文件时，Apache 将显示错误消息。它不会简单地忽略被禁止的指令。\n\n### 29.17 设置用户 Web 目录\n\n在拥有有许多 UNIX\
  \ 用户的系统中，您可能希望允许每个用户创建自己的一组 Web 页面。与其在某些文档根目录下为每个用户创建一个子目录，不如在每个用户的家目录下指定一个子目录作为\
  \ Web 文件的位置。通常，此子目录被称为 `public_html`，其内容通过类似 `http://www.example.com/*~username*/*.`\
  \ 的 URL 可用。\n\nURL 中特殊的 `~username` 路径会被 Apache 转换为名为 `username` 的用户家目录下的目录（无论使用哪个文档根目录）。用户可以通过向选项文件中放入正确的指令为其目录启用\
  \ CGI 脚本。也可以让用户的实际家目录中的文件可用，使得 `~username` 实际上映射到用户的家目录而不是子目录。然而，这是一个坏主意，因为它会让访问网站的任何人都可以用户的所有文件。\n\
  \n要启用 Apache 的用户 目录功能以便可以使用 `~username` URL 路径，请遵循以下步骤：\n\n在模块的主页上，点击您想要激活用户目录的虚拟服务器图标。要为所有虚拟服务器激活，请点击\
  \ `Default Server` 图标。\n\n点击 `Document Options` 图标。\n\n在 `User WWW directory` 字段中，取消\
  \ `Default` 选项并在旁边的字段中输入 `public_html`。或者，如果您想为用户 页面使用不同的子目录，请输入其名称。要通过 `~username`\
  \ URL 路径使用用户的整个家目录，请在字段中输入 `.`。\n\n许多系统中，此选项在默认 Apache 配置中已设置为 `public_html`，这意味着用户目录已启用。\n\
  \n如果选择了 `All users accessible` 选项，Apache 将允许访问任何用户目录中的页面。\n\n要配置 Web 服务器仅允许访问属于某些用户的页面，选择\
  \ `Only users` 选项并在旁边的字段中输入名称（用空格分隔）。如果只有一小部分固定的 UNIX 用户被允许发布 Web 页面，这将非常有用。\n\n\
  要阻止少数用户的 Web 页面并允许其他用户，选择 `All users except` 选项并在其字段中输入被阻止用户的名称。这对于保护属于 root 等重要系统用户的文件非常有用。\n\
  \n点击页面底部的 `Save` 按钮，然后使用 `Apply Changes` 链接激活新设置。尝试在用户的家目录下创建一个 `public_html` 子目录，在其中放入\
  \ HTML 文件，并查看它们是否可以通过 `~username/filename.html` URL 路径访问。\n\n\n\n\n通过在“User WWW\
  \ directory”字段中输入以 `/` 开头的值，可以将 `~username` URL 路径映射到用户主目录之外的目录。例如，如果你输入 `/www`\
  \ 浏览器请求 `~jcameron/foo.html`，那么 Apache 返回的文件将是 `/www/jcameron/foo.html`。如果你输入 `/home/*/public_html`，那么返回的文件将是\
  \ `/home/jcameron/public_html/foo.html`，即使用户 `jcameron` 的主目录并不在 `/home/jcameron`。正如示例所示，用户网络目录中任何出现的\
  \ `~` 都会被用户名。\n\n同样，你可以在目录字段中输入一个 URL，Apache 将使用该 URL 生成一个 URL，在请求用户网络目录时重定向浏览器。例如，如果你输入\
  \ `http://home.example.com/users/*` 浏览器请求 URL 路径 `~jcameron/foo.html`，它将会被重定向到 `http://home.example.com/users/jcameron/foo.html`。如果你想将用户网络目录托管到单独的服务器，同时允许主服务器上的\
  \ URL 访问它们，这种方法非常有用。\n\n尽管上述操作足以启用用户网络目录，但还有一些你可能想要执行的操作。正如前面的第 29.16 节“编辑 .htaccess\
  \ 文件”所解释，你可能希望限制用户可以在其 `.htaccess` 文件中放置指令类型，以便他们无法执行 CGI 程序或使用服务器端包含。你还可以更改适用于用户网络目录的默认目录索引和文档选项。完成这两个任务，请遵循以下步骤：\n\
  \n1. 在模块主页上，点击启用用户网络目录的虚拟服务器（或默认服务器）的图标。\n2. 假设你的所有用户的主目录都在 `/home` 下，且 Web 子目录命名为\
  \ `public_html`，在页面底部的创建每个目录、文件或位置选项表单的 `Path` 字段中输入 `/home/*/public_html`。\n3.\
  \ 将 `Type` 字段设置为 `Directory`，并将 `Regexp?` 字段设置为 `Exact match`（精确匹配）。\n4. 点击 `Create`\
  \ 按钮创建一组适用于用户网络目录的新选项，然后点击其新创建的图标。这将打开图 29.5 所示的文档选项页面。\n5. 点击 `Document Options`\
  \ 图标。\n6. 将下方的 `Directory` 选项字段更改为 `Selected`，并将你想应用于用户网络目录的选项设置为 `Yes`。建议开启 `Generate\
  \ directory indexes` 和 `safe` 以启用 `Server-side includes`，但不要开启 `Execute CGI programs`\
  \ 或 `Server-side includes and execs`。\n7. `Follow symbolic links`（跟踪符号链接）选项也是相对安全的，但它允许用户通过创建链接，通过\
  \ Web 访问其 `public_html` 子目录之外的文件。\n8. 为了防止用户在 `.htaccess` 文件中覆盖这些设置，将下方的 `Options\
  \ file can override` 字段更改为 `Selected`，取消勾选 `MIME types`、`odings` 和 `Directory options`\
  \ 复选框。其他选项控制的内容没有安全风险，因此可以安全地保持勾选。\n9. 点击 `Save` 按钮，然后点击 `Apply Changes` 链接以保存并激活限制。\n\
  \n如果你想为用户网络目录开启服务器端包含、设置某些自定义 MIME 类型或 IP 访问控制，可以按照该目录相应章节中的说明进行操作。由于在禁用了执行外部程序的情况下，服务器端包含是非常安全的，因此可以如第\
  \ 29.9 节“设置服务器端包含”所解释，通过为 `.html` 或 `.shtml` 文件设置正确的内容处理器为用户安全地启用。\n\n### 29.18\
  \ 配置 Apache 作为代理服务器\n\nHTTP 代理服务器是一种接收浏览器的网页请求、从其服务器检索请求的页面并返回给浏览器的服务器。它们通常用于不允许客户端直接连接到\
  \ Web 服务器的网络中，以便执行对谁可以访问网络以及可以查看哪些网站的限制。代理还可以缓存经常访问的页面，因此如果许多客户端访问同一个网站，其页面只需要下载一次。这加快了访问速度并减少了带宽。\n\
  \nApache 不是 UNIX 系统上最好的代理服务器，`Squid`（第 44 节介绍）拥有这一殊誉。`Squid` 具有更多的配置选项，效率更高，并且可以处理更大的缓存。然而，如果你要在已经在运行\
  \ Apache 的系统中设置代理，那么使用现有的 Web 服务器作为代理可能比安装和运行单独的 `Squid` 节点进程更有意义。\n\nApache 的代理支持仅在\
  \ `mod_proxy` 模块已编译进 Web 服务器或可动态加载时才可用。你可以通过点击主页上的 `Re-Configure Known Modules`\
  \ 图标查看该模块是否可用。如果勾选了 `mod_proxy`，则你的服务器就可以用作代理。如果是这样，你可以跳过处理加载代理模块的下一段。\n\n在某些 Linux\
  \ 发行版中，代理模块包含在 Apache 包中，但默认不加载。如果你的系统情况如此，可以按照以下步骤启用它：\n\n1. 在 Apache Webserver\
  \ 模块的主页上，点击 `Edit Config Files` 图标。这将打开一个显示主配置文件 `httpd.conf` 内容的页面。\n2. 寻找以 `LoadModule\
  \ proxy_module` 开头的行，该行目前开头被 `#` 注释了。如果没有此类行，则代理模块可能根本没有安装，因此无法使用。\n3. 删除行开头的 `#`，然后点击页面底部的\
  \ `Save` 按钮。\n4. 点击任何页面上的 `Stop Apache` 链接关闭 Apache，然后点击 `Start Apache` 链接重新启动它。这对于\
  \ Web 服务器加载已启用的代理模块是必要的。\n5. 在模块主页上，点击 `Re-Configure Known Modules` 图标，然后点击页面底部的\
  \ `Save` 按钮。这告诉 Webmin 重新分析 Apache 配置，以便检测到 `mod_proxy` 模块现在可用。\n\n如果 Apache 是在系统上从源码编译的，那么你需要启用\
  \ `mod_proxy` 并重新编译它以使用代理功能。如果你这样做了，Webmin 将检测到安装了新版本的 Apache 可执行文件，并在你下次访问模块主页时重新显示图\
  \ 29.1 所示的表单。代理模块将自动被选中，因此你只需点击 `Configure` 按钮告诉 Webmin 代理功能现已可用。\n\n一旦启用了 `mod_proxy`，你可以按照以下步骤将系统设为代理服务器：\n\
  \n1. 在模块主页上，点击你想用代理的虚拟服务器图标。这必须是一个基于 IP 的虚拟服务器或默认服务器，因为无法仅对基于名称的虚拟服务器开启代理。然而，无论你选择哪种服务器，其正常操作都不会受到影响。\n\
  2. 点击虚拟服务器选项页面上可见的 `Proxying` 图标。如果图标不存在，则 Webmin 未检测到代理模块。\n3. 将 `Act as proxy\
  \ server?` 字段更改为 `Yes`。\n4. 默认情况下，Apache 在充当代理服务器时不会缓存通过它请求的任何页面。要更改此设置，创建一个 Web\
  \ 服务器用户（通常为 `httpd`）可写入的目录，并将其输入 `Cache directory` 字段中。\n5. 要限制缓存的数据量，在 `Cache size`\
  \ 字段中输入一个千字节数。如果留设置为 `Default`（默认），Apache 将仅缓存 5 Kb 的页面。\n\n\n\n\n要关闭特定网站的缓存，请在`Domains\
  \ not to cache`（不缓存域名）字段中输入用空格分隔的主机和域名列表。这对于避免缓存频繁变化的站点有用。\n\n要停止代理用户访问某些域名，请在`Block\
  \ requests to domains`（阻止访问域名）字段中输入用空格分隔的完整或部分主机列表。例如，要拒绝访问`foo.com`域下的所有站点，只需输入\
  \ `foo.com`。\n\n如果你在网络上有另一个代理服务器，并希望将所有请求传递到该代理，请在`Requests to pass to another proxy`（传递到另一个代理）表格下的空白字段中输入其\
  \ URL（例如 `http://proxy.example.com:8080/*`），并保持选中 `All`（全部）选项。你也可以通过选择 `Matching`（匹配）选项并在相邻字段中输入部分\
  \ URL 或 URL 类型（如 `http://www.foo.com/*` 或 `ftp`）来仅传递少数请求。\n\n与 Apache 模块中的其他表格一样，此表一次只显示一个空白行。如果你想设置多个其他代理来转发不同的请求，你需要在保存后重新编辑此页面并填写下一个空白行。例如，你可能想将所有的\
  \ FTP 请求转发到一个代理，但将所有其他类型的请求转发到另一个。\n\n要排除某些请求不传递给其他代理（例如，如果它们位于你的本地网络），你可以填写`Don't\
  \ pass requests to another proxy`（不传递到另一个代理）表格。在每个空白行中，你可以选择以下类型之一：\n\n- **IP address**（IP\
  \ 地址）：如果选择此类型，你必须在相邻字段中输入完整的 IP 地址。任何指向此 IP 的 Web 服务器的请求将不会传递到另一个代理。\n- **Hostname**（主机名）：选择此类型时，任何指向相邻字段输入的主机的\
  \ Web 服务器请求都不会传递。\n- **Domain**（域名）：指向菜单旁字段输入域名内网站的任何请求将直接检索而不会传递。\n- **IP network**（IP\
  \ 网络）：任何指向指定 IP 网络（以部分 IP 地址输入，如 `192.168`）中网站的请求将不会传递到另一个代理。\n- **Network/bits**（网络/位数）：任何指向\
  \ IP 网络（以地址/前缀格式输入到相邻字段，如 `192.168.1.0/24`）中网站的请求将不会传递。\n\n要添加多行，你需要保存表单并再次编辑它，以便显示新的空白行。\n\
  \n表单上的大多数其他选项控制缓存目录的布局以及页面缓存的时间。在大多数情况下，默认设置可以正常工作，因此你只需将它们设置为 `Default`（默认）即可。\n\
  \n完成后，点击`Save`（保存）按钮用代理设置更新 Apache 配置文件，然后点击 `Apply Changes`（应用更改）链接使其生效。\n\n现在，可以通过配置\
  \ 浏览器使用你的 Apache 服务器作为代理并访问某些网页来尝试你的设置。Apache 处理的所有代理请求都将以通常格式写入虚拟服务器的访问日志文件中，但记录的是完整的\
  \ URL 而不仅仅是页面。\n\n你有时可能需要限制谁可以访问代理，可以通过客户端 IP 地址或用户名和密码来实现这种限制。这可以通过遵循第 29.14 节“按客户端地址限制访问”和第\
  \ 29.13 节“对目录进行密码保护”中的指令，并替换特殊目录 `proxy:*` 来。如果你设置了客户端地址访问控制，只有允许地址的主机才能使用你的服务器作为代理。然而，它们仍然可以访问普通网页，因为针对特殊\
  \ `proxy:*` 目录的 IP 地址限制仅适用于代理请求。\n\n如果你为你的代理服务器设置了用户名和密码验证，那么任何尝试使用它的浏览器都将被强制先登录。此登录是针对代理服务器的，而不是通过它访问的任何网站。如果用户使用代理访问受密码保护的网站，他必须单独登录该网站。\n\
  \n你还可能通过为如 `proxy:http` 或 `proxy:http://www.example.com/` 等特殊目录创建限制，设置仅适用于通过代理访问的某些协议或站点的\
  \ IP 或密码限制。只有起始 `proxy:` 之后文本的 URL 请求才会受到此类限制。这些限制对于阻止或限制对某些站点的访问，或防止代理被用于请求 `http`\
  \ 或 `ftp` 等某些协议有用。\n\n### 29.19 设置 SSL\n\nSSL 是一种在如互联网等不安全网络上建立安全、经过验证连接的协议。它加密网络流量，使攻击者无法监听网络并捕获密码和信用卡号等敏感信息。它允许服务器向客户端验证身份，以便\
  \ Web 浏览器可以确定它正在连接到它认为的网站。它还允许客户端向服务器验证身份，可用数字证书代替用户名和密码。\n\nSSL 协议可用于加密通常通过未加密的\
  \ TCP 连接传输的任何类型的数据。然而，在本章中，我们只关心网页请求和响应的加密，这是通过 SSL 加密 HTTP 协议数据来实现。结果是一个名为 `HTTPS`\
  \ 的新协议，所有希望安全运行的网站都在使用。几乎每个浏览器都支持 HTTPS 协议，并在检索以 `https://` 而不是普通 `http://` 开头的\
  \ URL 使用它。普通的 HTTP 协议使用 TCP 端口 80，而 HTTPS 协议使用端口 443。\n\n你可以按虚拟服务器配置 Apache 使用 HTTPS，或为所有服务器使用它。然而，这取决于是否编译了或提供了动态加载的\
  \ `mod_ssl` Apache 模块，而情况并非总是如此。第 29.18 节“将 Apache 配置为代理服务器”说明了如何检查并可能启用 `mod_proxy`\
  \ 模块，你也可以对 `mod_ssl` 遵循相同的指令。大多数现代 Linux 发行版在其 Apache 软件包中作为标准包含了 SSL 支持。\n\nSSL\
  \ 协议的核心是数字证书，它用于身份验证和加密。服务器通常将其证书发送给客户端以证明其身份，以便客户端知道其与网站的连接没有被攻击者重定向。由适当证书机构（如\
  \ Verisign 或 Thawte）颁发的证书是不可能伪造的，因为它们由该机构的主证书签名。所有 Web 浏览器都包含一个可以用于验证签名的机构列表，从而确保网站证书的真实性。\n\
  \n这种证书验证方法的缺点是，你不能简单地为你的网站生成一个会被 Web 浏览器毫无意见接受的证书。你可以创建一个 Apache 乐意使用的自签名证书，但任何以\
  \ SSL 模式连接到该 Web 服务器的浏览器都会向用户显示警告信息，因为该证书不是由认可机构签署的。自签名证书对于加密 HTTPS 流量是可以，但如果你希望浏览器能够验证你的站点，你需要一个由适当机构签署的*真实*证书，而这是需要钱的。\n\
  \n\n\n\n\n在 Apache 中启用 SSL 之前，你必须拥有一个证书。出于测试目的，获取证书最简单的方法是生成自己的自签名证书，你可以按照接下来的说明来完成。若要从受认可的机构生成真实证书，请遵循本节末尾的步骤。创建证书需要使用\
  \ `openssl` 命令，该命令包含在大多数现代 Linux 发行版中，并并可以从 [www.openssl.org/](http://www.openssl.org/default.htm)\
  \ 免费下载。如果你系统上的 Apache 已经包含了 `mod_ssl` 模块，那么 `openssl` 可能已经安装，或者存在于你的发行版 CD 或网站上。\n\
  \n## 生成自己的自签名证书\n\n要生成自己的自签名证书，请使用以下步骤：\n\n1. 以 root 身份登录你的系统。\n2. 到你想存储证书文件的目录，例如\
  \ `/usr/local/apache/conf` 或 `/etc/httpd`。\n3. 运行命令 `openssl req -newkey rsa:512\
  \ -x509 -nodes -out cert.pem - keyout key.pem`。\n\n该命令将按顺序询问以下问题以获取新密钥的属性。如需留空任何请求字段，只需输入一个句号。\n\
  \n- **Country name**（国家名称）：你的 Web 服务器所在国家的两位代码，例如 `AU` 或 `US`。\n- **State or Province\
  \ Name**（州或省份）：你的服务器所在的州，例如 `California`。\n- **Locality Name**（地区名称）：你的服务器所在的城市，例如\
  \ `San Francisco`。\n- **Organization Name**（组织名称）：你的公司或组织名称，例如 `Example Corporation`。\n\
  - **Organizational Unit Name**（部门名称）：你公司内的部门名称，例如 `Engineering`。\n- **Common Name**（通用名称）：URL\
  \ 中使用的 Web 服务器主机名。例如，如果浏览器通常通过 `http://www.example.com/` 访问服务器，那么你应该在该问题中输入 `www.example.com`。遗憾的是，你只能输入一个主机名，如果你的\
  \ Web 服务器通过多个名称访问（例如 `www.example.com` 和 `example.com`），则只有一个会与证书匹配。然而，主机名可以包含通配符\
  \ `*`，因此你可以输入 `.example.com` 甚至只是 `*`。\n- **Email Address**（电子邮件地址）：该 Web 服务器管理员的电子邮件地址，例如\
  \ `jcameron@example.com`。\n\n当回答所有问题后，当前目录下将创建 `cert.pem` 和 `key.pem` 文件。它们分别是你网站的证书及其私钥。\n\
  \n由于必须保持私钥安全以确保到服务器 SSL 连接的安全性，请将其所有权更改为运行 Apache 的用户，使用类似 `chown httpd key.pem`\
  \ 的命令。然后使用命令 `chmod 600 key.pem` 设置权限，以便其他用户无法读取它。\n\n## 为 Web 服务器配置 SSL\n\n现在已经创建了证书和私钥，你准备好配置\
  \ Web 服务器使用 SSL 了。此此的最佳方法是创建一个新的虚拟服务器，处理所有指向端口 `443`（HTTPS 端口）的 SSL 模式请求。这样，你系统上的任何现有虚拟服务器都不会受到影响。请严格按照以下步骤操作：\n\
  \n1. 在 Apache Webserver 模块的主页面，点击“Networking and Addresses”（网络与地址）图标。\n2. 在“Listen\
  \ on addresses and ports”表格末尾的空白行中，在 `Address` 列下选择 `All` 并在 `Port` 列下输入 `443`。然后点击页面底部的保存按钮。\n\
  3. 回到主页面，滚动到“create a new virtual server”表单。\n4. 将 `Address` 字段设置为 `Any`，`Port`\
  \ 字段设置为 `443`。\n5. 如果你希望浏览器在 SSL 模式连接时看到的页面与进行普通 HTTP 连接时看到的页面相同，请在 `Document Root`\
  \ 字段中输入默认服务器的文档根目录。否则，你可以输入不同的目录，以便客户端在 HTTPS 请求时看到不同的页面。\n6. 在 `Server Name` 字段中，输入你在创建\
  \ SSL 证书时为 `Common Name` 指定的相同主机名。\n7. 点击 `Create` 按钮将新虚拟服务器添加到你的 Apache 配置中。模块主页面将添加该服务器的图标。\n\
  8. 点击新服务器的图标进入虚拟服务器选项页面。应该可以看到一个标记为 `SSL Options` 的图标。如果没有，说明你的 Apache Web 服务器没有\
  \ `mod_ssl` 模块，或者 Webmin 尚未检测到它。\n9. 点击 `SSL Options` 图标，弹出图 29.9 所示页面。\n\n#####\
  \ 图 29.9. SSL 选项页面。\n\n![](img/29fig09.jpg)\n\n将 `Enable SSL?` 字段更改为 `Yes`。这告诉 Apache\
  \ 虚拟服务器将所有连接视为 HTTPS。\n\n- 在 `Certificate/private key file` 字段中，取消勾选 `Default` 并输入之前创建的\
  \ `cert.pem` 文件的完整路径。\n- 在 `Private key file` 字段中，输入 `key.pem` 文件的完整路径。如果你只有一个同时包含证书和私钥的文件，可以保持此字段为\
  \ `Default` 并将其路径输入上方的字段中。\n\n点击保存按钮，然后返回虚拟服务器选项页面点击 Apply Changes（应用更改）链接。\n\n\
  除非在应用配置时报告错误，否则你的 Web 服务器现在应该在端口 `443` 上以 SSL 模式运行。使用 浏览器访问 `https://www.example.com/`\
  \ 或你网站的任意 URL 进行测试。注意，URL 中不需要指定端口 `443`，因为它像端口 `80` 是 HTTP 的默认端口一样，被默认用于 HTTPS。\n\
  \n## 从 CA 请求证书\n\n如果你想使用 Apache 托管运行在 SSL 模式运行的真实互联网网站，你需要请求由受认可的机构签署的证书。要做到这一点，你必须生成证书签名请求\
  \ (CSR)，并将其发送给该机构进行验证，同时附上你的网站名称、公司名称和其他细节，证明你确实拥有该网站和域名。在验证你的详细信息后，CA 将签名证书并回传供你的\
  \ Web 服务器使用。\n\n要生成 CSR，请遵循以下步骤：\n\n1. 以 root 身份登录你的系统。\n2. 到你想存储证书文件的目录，例如 `/usr/local/apache/conf`\
  \ 或 `/etc/httpd`。\n3. 运行命令 `openssl genrsa -out key.pem 1024`。这将仅创建一个私钥文件 `key.pem`。\n\
  4. 确保该文件仅供 Web 服务器用户读取，使用类似 `chown httpd key.pem` 和 `chmod 600 key.pem` 的命令。\n5.\
  \ 运行命令 `openssl req -new -key key.pem -out csr.pem` 生成 CSR。\n\n\n\n\n国家名称：你的 Web\
  \ 服务器所在国家的双字母代码，例如 `AU` 或 `US`。\n\n州或省名称：你的服务器所在的州名称，例如 `California`。\n\n地名：你的服务器所在的城市，例如\
  \ `San Francisco`。\n\n组织名称：你的公司或组织名称，例如 `Example Corporation`。\n\n组织单位名称：你公司内部部门名称，例如\
  \ `Engineering`。\n\n通用名称：在 URL 中使用的 Web 服务器的主机名。例如，如果浏览器通常通过 `http://www.example.com/`\
  \ 访问服务器，那么在此问题中你应输入 `www.example.com`。由 CA 签名的证书的主机名通常不能使用通配符。\n\n电子邮件地址：该 Web 服务器管理员的电子邮件地址，例如\
  \ `jcameron@example.com`。\n\n回答所有问题后，当前目录下将创建 `csr.pem` 文件。这是你的证书签名请求，应应将其发送给证书颁发机构进行签名。\n\
  \n在验证你的信息并收取费用后，机构将向你返回已签名的证书。它应该是一个以以下行开头的文本文件\n\n```\n-----BEGIN CERTIFICATE-----\n\
  ```\n\n将其与私钥放在同一个目录中，命名为 `cert.pem`。\n\n如果你覆盖了现有的自签名私钥和证书文件，最好停止并重启 Apache 以强制使用新文件。现在，你应该能够以\
  \ SSL 模式连接到你的 Web 服务器，且浏览器中不会显示任何警告。\n\n## 29.20 查看和编辑指令\n\n可以使用 Apache Web 服务器模块手动查看和编辑指令，而不是通过模块的表单和页面进行编辑的常用方法。只有在你熟悉配置文件格式时才建议进行手动编辑，因为不会进行任何检查来确保你输入了有效的指令或参数。然而，通过这种方式配置\
  \ Web 服务器通常更快，特别是如果你是一个经验丰富的 Apache 管理员。\n\n在每个虚拟服务器、目录、URL 对应位置、文件名和 `.htaccess`\
  \ 文件的选项页面上，都有一个标记为“显示指令”（Show Directives）的图标。点击后，它将显示该虚拟服务器或目录内的所有指令，如图 29.10 所示。模块知道如何编辑的任何指令都将链接到相应的编辑表单，这些表单可以通过点击虚拟服务器或目录选项页面上的另一个图标来访问。每个指令旁边都是它所在的文件名以及在该文件中的行号，以便如果你愿意，可以使用\
  \ `vi` 或 `emacs` 等其他程序手动编辑它。\n\n### 图 29.10. 查看目录的指令。\n\n![](img/29fig10.jpg)\n\n\
  列表下方标记为“手动编辑指令”（Manually edit directives）和“编辑 Apache 指令”（Edit Apache directive）的按钮。第一个将带你进入下一段描述的编辑表单。第二个将带你进入从旁边菜单中选定的指令的编辑表单，该表单将来自上一页图标链接的表单之一。如果你知道想要使用的\
  \ Apache 指令名称，但不知道在 Webmin 的何处可以编辑，这可能会非常有用。\n\n要直接编辑虚拟服务器或目录中的指令文本，你可以点击每个选项页面上“显示指令”旁边的“编辑指令”图标。这将显示一个文本框，其中包含该服务器或目录\
  \ Apache 配置文件中出现的确切文本，包括任何注释和缩进。点击“保存”（Save）按钮时，你所做的任何更改将写回文件，而不进行任何验证。要使更改生效，你需要点击模块任何页面上的“应用更改”（Apply\
  \ Changes）链接。\n\n还可以使用模块主页上的“编辑配置文件”（Edit Config Files）图标一次编辑整个 Apache 配置文件。选择后，主配置文件（通常为\
  \ `httpd.conf`）的完整内容将显示在文本框中。上方是选择另一个要编辑文件的菜单，以及一个标记为“编辑文件中指令”（Edit Directives in\
  \ File）的按钮，这将切换到选择文件的内容。你的 Apache Web 服务器可能使用 Webmin 通常对你隐藏的多个文件。只有在该页面，你才能看到模块检测到的所有文件都在被使用，无论是通过默认（例如\
  \ `httpd.conf`、`srm.conf` 或 `access.conf`）还是通过默认配置文件中的 `Include` 指令。\n\n此页面是你可以查看并手动编辑适用于所有虚拟服务器的唯一地方，这些服务器通常在模块的“默认服务器”图标下可编辑。由于这些默认指令通常跨越多个文件，因此默认服务器的选项页面没有出现“显示指令”或“编辑指令”图标。\n\
  \n如果你更改了文本框中的任何指令，点击下方的“保存”按钮以重写配置文件。不会进行任何验证，因此请对你的更改小心。对 `<Directory>` 或 `</IfModule>`\
  \ 等容器指令的错误可能会导致 Webmin 无法解析文件的部分或全部内容。如往常一样，你需要返回模块主页点击“应用更改”链接以使更改生效。\n\n## 29.21\
  \ 模块访问控制\n\n如第 52 章所解释，你可以使用 Webmin 用户模块赋予用户对某些模块的有限访问权限。在 Apache Web 服务器模块的情况下，可以限制\
  \ Webmin 用户或组，使其只能编辑可用虚拟服务器的子集。这在虚拟托管环境中非常有用，在那种环境中，你希望赋予人们编辑自己服务器设置的权利，而不是属于其他人的设置。\n\
  \n还可以限制用户允许编辑的模块页面，因为某些页面允许设置可能被用于破坏系统安全性的指令。例如，你不希望用户能够更改运行其虚拟服务器上 CGI 程序的用户和用户组。\n\
  \n要为用户设置 Apache 模块，使其只能编辑几个虚拟服务器，请按照以下步骤操作：\n\n1. 在 Webmin 用户模块中，点击已授予模块访问权限的用户旁边的“Apache\
  \ Web 服务器”。\n2. 将“可以编辑模块配置?（Can edit module configuration?）”字段改为“否（No）”，以便他无法更改模块用于\
  \ Web 服务器配置文件的路径。\n3. 对于“此用户可以编辑的虚拟服务器（Virtual servers this user can edit）”字段，选择“已选（Selected）”选项，从提供的列表中选择他被允许管理的服务器。允许不受信任的用户编辑默认服务器通常是一个坏主意，因为它的配置影响所有其他虚拟服务器。\n\
  4. 将“可以编辑全局选项?（Can edit global options?）”字段改为“否（No）”，以便他无法更改 Apache 监听的端口和地址。\n\
  5. 将“可以创建虚拟服务器?（Can create virtual servers?）”字段改为“否（No）”，以便不允许添加新的虚拟主机。\n6. 为了阻止他更改运行\
  \ CGI 程序的用户和用户组，将“可以更改虚拟服务器用户?（Can change virtual server users?）”字段设置为“否（No）”。只有在你安装了\
  \ `suexec` 时这真正重要，正如第 29.8 节“运行 CGI 程序”所解释。\n7. 除非你想让他能够更改虚拟服务器接受请求的地址和端口，否则将“可以更改虚拟服务器地址?（Can\
  \ change virtual server addresses?）”字段设置为“否（No）”。如果更改了它们，可能会干扰其他虚拟服务器。\n8. 如果“可以将日志管道到程序?（Can\
  \ pipe logs to programs?）”字段设置为“是（Yes）”，他将能够配置虚拟服务器将日志记录到以 Apache 通常运行的用户（通常是 `httpd`）身份运行的命令。这可能是你的系统上的一个安全风险，因此通常将此字段设置为“否（No）”是一个好主意。\n\
  \n\n\n将 `Can start and stop Apache?` 字段更改为 `No`。他将能够应用更改，但无法关闭整个 Web 服务器。\n\n`Limit\
  \ files to directory` 字段控制他可以配置服务器将日志文件写入到何处。允许将其写入任何地方可能会允许他覆盖文件，因此最好将此项设置为其家目录或文档根目录下的某个路径，例如\
  \ `/home/jcameron/logs*`。\n\n`Directive types available` 字段决定了虚拟服务器选项页面上显示哪些图标，从而决定了他被允许编辑哪些类型的指令。如果你选择\
  \ `All`，则所有图标都将可见，以及用于手动编辑配置文件的 `Show Directives` 和 `Edit Directives` 图标。如果你改为选择\
  \ `Selected`，则只显示从列表中选出的页面，而不会显示手动编辑图标。\n\n通常情况下拒绝对用户、组和日志文件页面的访问是一个好主意，而且始终防止缺乏经验的用户手动编辑配置文件是明智的。`httpd.conf`\
  \ 文件中的错误可能会导致整个 Web 服务器在下次重启时停止工作。\n\n最后，点击页面底部的 `Save` 按钮。限制将立即应用于该用户或组。\n\n你应该意识到，这些限制无法阻止真正恶意的用户对你的\
  \ Apache 配置造成问题。完全可能利用表单向配置文件引入故意的语法错误，这可能会干扰 Web 服务器的正常运行。幸运的是，你始终可以使用第 54 章介绍的\
  \ `Webmin Actions Log` 模块来跟踪谁做了什么。\n\n## 29.22 配置 Apache Web 服务器模块\n\n与其他模块一样，此模块也有几个选项，可以通过点击主页上的\
  \ `Module Config` 链接进行更改。在 `System configuration` 下列出的选项与系统上 Apache 配置文件和程序的位置有关，默认情况下，这些路径将将设置为与你操作系统附带的\
  \ Apache 软件包相匹配。如果你的 `UNIX` 版本没有带 Apache，则该模块将假设 Web 服务器已从源码发行版编译并安装，并将将使用源码安装时的文件路径。\n\
  \n表 29.1 列出了你可以安全更改的两种配置选项（第一部分），以及与文件位置相关且通常不需要编辑的选项（第二部分）。\n\n### 表 29.1. 模块配置选项\n\
  \n| 以何种显示虚拟服务器 | 当此字段设置为 `Icons` 时，模块主页上的所有虚拟服务器将以图标形式显示。然而，当改为 `List` 时，它们将以表格形式显示。当你有很多虚拟服务器时，后者更有意义，因为它占用的页面空间更小。\
  \ |\n| 虚拟服务器排序 | 此字段控制主页上虚拟服务器的顺序，但无论选择哪种选项，默认服务器始终会出现在第一个。可用选项及其含义为：`Order in config\
  \ files` 服务器按照它们在 Apache 文件中列出的顺序出现，这通常是它们被添加的顺序。`Server name` 虚拟服务器根据其主主机名排序。`IP\
  \ address` 服务器根据其监听的 IP 地址排序。只有在你有大量基于 IP 的虚拟主机时，此选项才真正有意义。 |\n| 显示服务器的最大数量 | 如果虚拟服务器的数量超过此字段中设置的数量，则模块主页将显示一个搜索表单。在拥有数千个服务器的系统中，这可以保持页面大小在可范围内；不过，如果你觉得默认的最大值太低或太高，也可以对其进行更改。\
  \ |\n| 添加虚拟服务器的文件 | 默认情况下，所有新的虚拟服务器都将添加到主 Apache 配置文件（通常是 `httpd.conf`）。然而，如果你将所有服务器放在系统上的一个单独文件中，则此字段应设置为该文件的完整路径。自然地，必须配置\
  \ Apache 读取该指定文件，例如通过主配置文件中的 `Include` 指令。此字段仅控制虚拟服务器创建表单中 `Add virtual server to\
  \ file` 字段的默认设置，该表单见于第 29.5 节“创建新的虚拟主机”。如果你愿意，在填写表单时仍然可以选择将服务器添加到不同的文件中。 |\n| 在应用更改前测试配置文件？\
  \ | 当此字段设置为 `Yes` 时，模块将在点击 `Apply Changes` 链接实际应用配置之前，使用 `apachectl configtest`\
  \ 命令测试你的 Apache 配置。此项默认开启，以便如果你的配置无效，会在 Apache 接收到重新读取信号之前检测出来（这会导致 Web 服务器停止）。如果由于某种原因测试在你的系统上总是失败，你可能需要将此选项设置为\
  \ `No`。只要你的配置文件从未出现任何语法错误，这就不会产生负面影响。 |\n| 手动更改后测试配置文件？ | 当启用此选项时，模块将在任何手动更改后测试\
  \ Apache 配置，如果检测到错误，将恢复到旧设置。如果你不熟悉配置文件的格式，此选项可以保护你免于出错。 |\n| 其他更改后测试配置文件？ | 此选项告诉模块在提交任何表单后测试\
  \ Apache 配置，以确保错误的输入没有导致配置文件以某种方式失效。这对于那些由不可信或缺乏经验的用户管理自己的 Apache 虚拟主机系统最有用。 |\n\
  | 显示 Apache 指令名称 | 默认情况下，此字段设置为 `No`。然而，如果你将其更改为 `Yes`，则允许编辑指令的模块页面上，每个字段设置的 Apache\
  \ 指令名称将显示在其标签旁边。此外，该名称将链接到 `Base directory for Apache documentation` 模块配置字段中设置位置的相应指令的\
  \ Apache 文档。此选项对于了解每个字段的实际作用以及学习 Apache 配置中实际使用的指令非常有用。模块表单中的某些字段和表格实际上设置了多种类型的指令。在这种情况下，所有指令都将列出来，每个指令都有其指向对应文档的链接。\
  \ |\n| Apache 文档基础目录 | 此字段控制当启用 `Show Apache directive names` 选项时，链接到的 Apache 文档的位置。当选择\
  \ Apache 网站时，链接将指向 `httpd.apache.org` 上的官方文档页面。这可以正常工作，但如果你有本地本地副本或没有互联网访问，这可能不是最佳选择。另一种方案是输入可以找到\
  \ Apache 模块 HTML 文件的基础 URL。例如，如果你输入了 `http://www.example.com/docs/`，那么 Webmin 将生成类似\
  \ `http://www.example.com/docs/mod_cgi.html#scriptlog` 的链接。 |\n| Apache 服务器根目录 |\
  \ 这是所有 Apache 配置文件所在的目录。如果你是从源码安装的，则它应设置为 `/usr/local/apache`。如果在下面的某些字段中没有显式设置，Webmin\
  \ 将使用此目录来查找 `httpd.conf` 等配置文件。 |\n| httpd 可执行文件路径 | 在此字段中，必须输入 `httpd` 服务器程序的完整路径，例如\
  \ `/usr/local/apache/sbin/httpd`。Webmin 执行此程序以确定你正在运行哪个版本的 Apache 以及其中编译了哪些模块。 |\n\
  \n\n\n\n\n| Apache version | 通常情况下，此字段设置为“自动”（Work out automatically），这会导致 Webmin\
  \ 带有 `v` 标志运行 `httpd` 以获取 Apache 版本号。然而，有一些经过特殊修改的 服务器版本不会按照模块期望的格式报告版本，这会导致您尝试使用该模块时显示错误消息。如果您的系统上发生此类情况，您可能需要在此字段中输入正确的版本号。必须以\
  \ Apache 版本号的标准格式输入，例如 `1.3.19` 或 `2.0.43`。 |\n| Path to the apachectl command |\
  \ 此字段必须包含 `apachectl` 命令的完整路径，例如 `/usr/local/apache/bin/apachectl`。Webmin 使用它来启动和停止\
  \ Apache、测试配置以及应用更改。较旧版本的 Web 服务器不包含此命令，因此如果您的系统中没有该命令，可以选择“无”（None）选项。这将导致 Webmin\
  \ 使用 `TERM` 和 `HUP` 信号来停止服务器并应用更改，并直接运行 `httpd` 命令来启动它或测试配置。 |\n| Command to start\
  \ apache | 如果此字段设置为“自动”（Automatic）以外的任何内容，模块将在点击“启动 Apache”（Start Apache）链接时运行指定的命令。许多包含\
  \ Apache 软件包的操作系统都带有用于启动和停止 Web 服务器的启动脚本。在这些系统中，此字段将被设置为类似 `/etc/init.d/apache start`\
  \ 的内容，以便使用启动脚本。如果选择“自动”（Automatic），Webmin 将使用 `apachectl` 命令启动 Apache，或直接运行 `httpd`\
  \ 服务器程序。如果您是从源码编译并安装的 Apache，最好是选择“自动”（Automatic）选项，这样模块就不会尝试使用不存在或不起的启动脚本。 |\n\
  | Command to stop apache | 此字段与上一个字段类似，但它决定了点击“停止 Apache”（Stop Apache）链接时用于关闭 Web\
  \ 服务器的命令。与启动命令一样，如果您从源码安装了 Apache，也应将其设置为“自动”（Automatic）。 |\n| Path to httpd.conf\
  \ | 这三个字段分别控制 Webmin 在何处查找 `httpd.conf`、`srm.conf` 和 `access.conf` 。当设置为“自动”（Automatic）时，模块将在服务器根目录下的\
  \ `etc` 和 `conf` 子目录中查找，这在大多数情况下是正确的路径。然而，如果文件位于其他地方（如某些 Linux 发行版的默认位置所示），则这些字段需要设置为配置文件的正确完整路径。\
  \ |\n| Path to srm.conf | |\n| Path to access.conf | |\n| Path to mime.types | 与上述字段类似，此字段控制模块在何处查找\
  \ `mime.types` 文件，该文件包含全局 MIME 类型和扩展名的列表。如果其中一个配置文件存在 `TypesConfig` 指令，则将使用指定的路径。如果为此字段输入了路径，则将使用它。否则，如果字段设置为“自动”（Automatic），则\
  \ Webmin 将尝试在服务器根目录下的 `etc` 和 `conf` 子目录中定位 `mime.types` 文件。 |\n\n### 29.23 总结\n\
  \n本章介绍了 Apache Web 服务器，并解释了如何使用 Webmin 来配置它以执行各种常见任务。阅读本章后，您应该知道什么是虚拟主机以及如何创建它们、如何为不同的目录设置不同的选项、如何重定向请求、如何设置身份验证等。由于\
  \ Webmin 的 Apache 模块有大量的配置设置，因此仅涵盖了与常见操作相关的内容。\n\n## 第 30 章 DNS 服务器配置\n\n在本章中，将解释\
  \ DNS 协议和 BIND DNS 服务器，以及用于创建和管理 DNS 区域的 Webmin 模块。\n\n### 3.1 简介\n\nDNS 是一种用于将如\
  \ `www.example.com` 等主机名转换为如 `192.168.1.10` 等 IP 地址反亦然的协议。在 IP 层，互联网上的所有主机都通过 IP\
  \ 地址相互引用，而不是用户输入到网络浏览器和 telnet 客户端等程序中的主机名。这意味着系统在通信之前需要一种方法来查找与主机名关联的 IP 地址。虽然有多种实现方法（例如读取\
  \ `/etc/hosts` 文件或查询 NIS 服务器），但 DNS 是最常用的。\n\n除了查找主机名的 IP 地址外，DNS 协议还可以用于查找与 IP\
  \ 地址关联的主机名。这通常用于查找连接到服务器（如 Web 服务器或 SSH 守护进程）的客户端主机名。DNS 还可以用于查找域的邮件服务器地址以及关于主机的附加信息，如其位置、操作系统或所有者。然而，到目前为止最常见的应用是将主机名转换为\
  \ IP 地址。\n\n大多数系统使用 DNS 协议向服务器发送请求，由服务器完成大部分主机名解析为 IP 地址的工作。普通系统仅作为 DNS 客户端，永远不需要回答来自服务器或其他客户端的请求。几乎所有的公司、组织和\
  \ ISP 已经在其网络上拥有一个或多个 DNS 服务器，其他主机都可以使用。如果您的公司已经有了 DNS 服务器，则没有必要阅读本章。相反，请参阅第 19 章，有关如何将您的\
  \ Linux 系统配置为 DNS 客户端的信息。\n\n域名系统被划分为区域（也称为域），每个区域都有一个如 `example.com` 或 `foo.com.au`\
  \ 的名称。区域按层级排列，这意味着 `foo.com.au` 区域是 `com.au` 区域的一部分，而该区域又是 `au` 域的一部分。层级的顶端是 `.`\
  \ 根区域，整个 DNS 系统都依赖于它。\n\n对于每个区域，至少有一个 DNS 服务器主要负责提供有关该区域的信息。可能还会有几个辅助或从用服务器，它们拥有主服务器信息的副本，并在主服务器不可用时作为备份。单个\
  \ DNS 服务器可能托管多个区域，有时甚至不托管任何区域。服务器通常负责提供其所托管区域的信息，并在 DNS 客户端请求时查找其他区域中的信息。\n\n为了让由服务器托管的区域对不直接查询该服务器的\
  \ DNS 客户端可用，它必须在父区域中注册。最常见的父域如 `.com`、`.net`、`.com.au` 由对在其下注册区域收费的公司管理。这意味着您不能简单地设置一个托管如\
  \ `example.com` 域的 DNS 服务器并期望它对互联网的其他部分可见。您还必须付费向为 `.com` 域添加子域的公司之一进行注册。\n\n每个区域包含多个\
  \ DNS 记录，每条记录都有名称、类型和值。最常见的记录类型是地址或 `A` 记录，它将主机名与 IP 地址关联。其他类型包括 `NS` 或名称服务器记录，它指定了区域或子域的\
  \ DNS 服务器；以及 `MX` 或邮件服务器记录类型，它定义了应该接收该区域邮件的主机。\n\n每个区域都应该至少有一个辅助服务器，以防主服务器由于某种原因宕机或无法访问。辅助服务器还可以分担主服务器的负载，因为在该域查找记录的其他服务器将随机选择一个服务器进行查询，而不是总是首先询问主服务器。事实上，其他系统无法得知哪个是特定区域的主服务器，哪些是从服务器。\n\
  \n\n\n\n\n从继服务器可以通过区域传输（zone transfer）一次性请求某个区域内所有记录的副本。这通常在一个区域首次被添加到从继 DNS 服务器上时进行，并且当它检测到该区域发生变化或其内部记录已过期时定期执行。主服务器也可以配置为在区域发生变化时通知从继服务器，以便它们能够立即执行区域传输，从而确保它们的数据始终是最新的。\n\
  \n每个区域都有一个序列号（serial number），它简单来说就是一个计数器，每当区域内的任何记录发生更改时，必须对其递增。从继服务器使用序列号来判断区域是否发生了变化，从而决定是否需要进行传输。大多数情况下，只要序列号递增，它的具体数值并不重要。然而，某些域名权威要求它采用特定的基于日期的格式，例如\
  \ `YYYYMMDDnn`。\n\n通常情况下，单个服务器要么完全托管主区域，要么完全托管从继区域。但事实并非如此——一个 DNS 服务器可以是某些区域的主服务器，同时另一些区域的从继服务器。一个区域可以拥有的服务器数量没有上限，尽管很少有区域的服务器超过三个。重要的\
  \ `.com` 和根域名有 13 台服务器，因为它们对互联网运行至关重要且被频繁访问。通常情况下，只要它们都能保持同步，一个域名拥有的从继服务器越多越好。\n\
  \n当服务器接收到客户端查询记录的请求时，它首先检查该记录是否位于它托管的某一个区域中。如果是，它可以立即向客户端提供答案。然而，如果记录不在托管的区域中，则服务器必须查询其他服务器来查找它。它首先查询负责根区域的其中一台服务器，该服务器将返回另一个\
  \ DNS 服务器的地址。然后它再查询该服务器，该服务器可能会提供答案，或者提供另一个 DNS 服务器的地址以继续查询。这个过程会一直持续，直到找到负责该域名的服务器并从中获取答案。如果客户端请求的记录实际上不存在，查询过程中的某一个服务器将说明这一点，搜索也将结束。\n\
  \n例如，假设一个 DNS 客户端向服务器查询 `www.webmin.com` 的 IP 地址。服务器查找该地址将遵循的步骤如下：\n\n1. 询问一个根服务器（例如\
  \ `a.root-servers.net` (`198.41.0.4`)）获取 `www.webmin.com` 的地址。该服务器将返回一个 `.com` 域的服务器列表，其中之一是\
  \ `a.gtld-servers.net` (`192.5.6.30`)。\n2. 询问 `.com` 服务器获取 `www.webmin.com` 的地址。返回是一个服务器列表，其中之一是\
  \ `au.webmin.com` (`203.89.239.235`)，它是 `webmin.com` 域的主服务器。\n3. 询问 `webmin.com`\
  \ 服务器获取 `www.webmin.com` 的地址。返回将是 `216.136.171.204`，这是正确的 IP 地址。\n\n得到的 IP 地址将返回给客户端，并带上一个\
  \ `TTL`（生存时间），以便客户端知道它可以缓存该地址多久。\n\n如你所见，通过上述步骤中的简单过程，DNS 服务器可以找到互联网上任何主机的地址。它无法发现的唯一地址是根服务器的地址。相反，这些地址是在服务器程序启动时从文件中读取的。由于根服务器的地址极少更改，因此\
  \ DNS 服务器将它们存储在固定文件中是安全的。\n\n如果每个 DNS 请求都完全遵循上述步骤，那么当世界上任何地方的客户端想要查询 IP 地址时，都必须查询根服务器。尽管有这些服务器，但对于全球任何地方的客户端查询\
  \ IP 地址的需求，每次都查询根服务器是不现实的。尽管如此，由于根服务器的地址极少更改，DNS 服务器将它们存储在固定文件中是安全的。\n\n\n\n\n\n\
  由于 BIND 几乎适用于所有的 UNIX 系统，并且无论操作系统如何其工作方式都是相同的，因此章中的指令不仅适用于 Linux，也适用于其他版本的 UNIX。大多数版本的\
  \ UNIX 和 Linux 都包含 `BIND` 8 版本或 9 版本作为标准包，因此很少需要安装它。如果模块找不到 DNS 服务器，主页上将显示错误消息。如果发生这种情况，请检查您的操作系统光盘或网站以获取\
  \ `BIND` 软件包，或从 [www.isc.org/](http://www.isc.org/default.htm) 下载并编译源码。\n\n`BIND`\
  \ 的主配置文件是 `/etc/named.conf`，它包含了服务器托管的所有区域（zones）以及适用于所有区域的全局配置设置。每个区域的记录存储在单独的文件中，通常位于\
  \ `/var/named` 目录。此 Webmin 模块始终直接更新所有这些文件，而不是与运行中的 `BIND` 进程通信。这意味着如果您正在运行其他通过与\
  \ `BIND` 通信来动态更新区域的程序（例如 DHCP 服务器），则不应使用此模块，因为它可能会干扰这些更改。然而，很少有系统激活了这种动态更新。\n\n\
  `BIND` 9 版本具有版本 8 不具备的一些功能。此 Webmin 模块支持的最功能是视图（views）。视图是一个仅对某些 DNS 客户端可见的区域集合。通常，所有客户端都能看到相同的区域，但在\
  \ `BIND` 9 中，您可以限制某些域的可见性，仅针对通过 IP 地址识别的特定客户端。这对于创建仅对内部网络系统可见的区域非常有用，即使您的 DNS 服务器连接到互联网。\n\
  \n如果您从未在系统中设置过 `BIND`，当您第一次进入该模块时，主页将显示一个设置 DNS 服务器的表单，如图 30.1 所示。只有当 Webmin 检测到名为\
  \ `named.conf` 的配置文件不存在，或者指定的区域文件目录不存在时，才会显示此表单。如果您确定您的 `BIND` 配置有效且 DNS 服务器已经在运行，请勿点击\
  \ `Create`（创建）按钮，因为您的 `named.conf` 文件将被覆盖。相反，请点击 `Module Config` 并检查所有路径对于您的系统都是正确的。\n\
  \n##### 图 30.1. BIND 设置表单。\n\n![](img/30fig01.jpg)\n\n如果您是第一次设置 `BIND`，设置表单为您提供三个选择：\n\
  \n1.  **仅为内部非互联网使用设置名称服务器**：如果您选择此选项，您的 DNS 服务器将被配置为仅能解析其托管的区域中的记录。这对于完全没有互联网连接的私有网络有用。\n\
  2.  **设置为互联网名称服务器并下载根服务器信息**：这是最实用的选项。它将您的 DNS 服务器配置为能够托管区域并在互联网上查找记录。正如引言介绍，为了查询其他互联网域，需要一个根区域服务器列表。当选择此选项时，Webmin\
  \ 将通过 `FTP` 连接到 `rs.internic.net` 并下载一个包含服务器名称和 IP 地址的文件，将其包含在 `BIND` 配置中。\n3. \
  \ **设置为互联网名称服务器，但使用 Webmin 的旧版根服务器信息**：此选项与上一个选项相同，但不下载根区域文件。相反，它将使用 Webmin 自带的文件副本，该文件可能不是是最新的。然而，如果由于某些原因您的系统无法连接到\
  \ `rs.internic.net` 的 `FTP` 服务器，这是您的最佳选择。\n\n根据您选择的选项，将创建一个基础的 `named.conf` 文件，并将根区域添加到其中。模块的主页将重新显示，以便您可以添加更多区域或进一步配置服务器。\n\
  \n当 `BIND` 在您的系统中设置好后，主页将如图 30.2 所示。顶部是一个用于设置适用于整个 DNS 服务器的全局选项的图标表。下方是服务器托管的每个区域的图标，如果您运行的是\
  \ `BIND` 9 版本，随后将是视图的图标。最底部是应用当前 DNS 配置或启动 `BIND` 服务器的按钮。\n\n##### 图 30.2. BIND\
  \ DNS 服务器模块主页。\n\n![](img/30fig02.jpg)\n\n如果您刚刚第一次设置了 `BIND`，可能只有一个区域图标，即根区域。某些包含\
  \ `BIND` 软件包的 Linux 发行版带有一个基础配置文件，其中定义了如 `localdomain` 和 `127.0.0` 等区域，这些区域用于解析\
  \ localhost 和 `127.0.0.l` 回环主机名和 IP 地址。\n\n### 30.3 创建新的主区域\n\n主区域（master zone）是您的\
  \ DNS 服务器作为信息权威来源的区域。单个区域可以由多个服务器托管，但只能有一个主服务器，其余都是从服务器（slaves）。如果您想向服务器的配置中添加新的主区域，请遵循以下步骤：\n\
  \n1.  为新区域确定一个名称，例如 `example.com` 或 `internal`。如果这将是一个对世界上每人都可见的互联网域，则该域名必须尚未被任何其他人员注册。然而，在您的\
  \ DNS 服务器设置好以托管它之前，您通常无法自行注册它。\n2.  在模块的主页上，点击现有区域表下方的 `Create a new master zone`（创建新主区域）链接。这会将您带到如图\
  \ 30.3 所示的页面，在何处输入新区域的详细信息。\n\n##### 图 30.3. 新主区域的创建表单。\n\n![](img/30fig03.jpg)\n\
  \n如果是像 `example.com` 或 `foo.com.au` 这样的正向区域（forward zone），将 `Zone type`（区域类型）字段设置为\
  \ `Forward`。然而，如果是从 IP 地址查找主机名的反向区域（reverse zone），请将该字段设置为 `Reverse`。\n\n在 `Domain\
  \ name / Network` 字段中，输入不带尾部点的区域名称。对于反向区域，只需输入网络地址，如 `192.168.1.*`。在创建域时，Webmin\
  \ 会自动为您转换为 `in-addr.arpa` 格式。\n\n`Records file`（记录文件）字段控制包含区域记录的配置文件存储位置。将其设置为 `Automatic`（自动），文件名将根据模块配置和\
  \ `named.conf` 文件中的目录设置自动确定。这通常是最佳选项，因为它将记录文件创建在与任何现有区域相同的目录，例如 `/var/named`。\n\n\
  然而，如果您取消选择 `Automatic` 选项并输入文件名，则区域的所有记录都将写入该文件。如果您输入一个现有文件的名称，它将在创建域时被覆盖。\n\n在\
  \ `Master server`（主服务器）字段中，输入该区域主 DNS 服务器的完整域名。这必须是系统的规范名称，例如 `server.example.com`，而不是像\
  \ `server` 这样的短名称。此服务器（以及后续 5 个字段的值）将用于创建新区域的 SOA 记录。\n\n在 `Email address`（电子邮件地址）字段中，输入负责该区域的人员地址。您可以在地址中使用\
  \ `@` 符号，Webmin 将将其转换为点以包含在 SOA 记录中。\n\n`Refresh time`（刷新时间）字段决定从服务器应多频繁向此主服务器检查区域更新。默认值是合理的，但对于很少更改的区域，您可能想增加它，或者对于频繁更新的区域减少它。\n\
  \n`Transfer retry time`（传输重试时间）字段决定了级服务器在区域传输失败后应等待多久再再次尝试。\n\n`Expiry time`（过期时间）字段控制该区域的从级\
  \ DNS 服务器在从主服务器重新传输之前缓存记录的最长时间。\n\n`Default time-to-live`（默认生存时间）字段决定区域中未显式设置记录的\
  \ TTL。\n\n\n\n\n\n点击页面底部的“创建”（Create）按钮。只要表单填写正确且该区域在你的服务器上不存在，你将会被带到一个用于为区域添加新记录的页面。\n\
  \n返回模块主页，此时主页将包含一个你新区域的图标，然后点击底部的“应用更改”（Apply Changes）按钮将其激活。\n\n新创建的区域将仅包含一条记录（除非你设置了模板）。要添加更多记录，请遵循第\
  \ 30.4 节“添加和编辑记录”中的说明。一旦你在你的域名中设置了基础记录，就可以向管理父域的机构（如 .com 或 .com.au）进行注册。某些域名机构可能不允许你注册至少包含两个服务器（一个主服务器和一个从服务器）并且在区域内为这些服务器设置名称服务器记录的区域。\n\
  \n### 30.4 添加和编辑记录\n\nBIND DNS 服务器模块最有用的功能是能够在你的服务器托管的主区域中添加、编辑和删除记录的能力。例如，如果你想在你的域名\
  \ `example.com` 中设置一个 Web 服务器，你需要为 `www.example.com` 添加一个带有服务器 IP 地址的地址（Address）记录。要添加此类新记录，遵循的步骤如下：\n\
  \n在模块主页上，点击你想要添加的区域的图标。这将打开图 30.4 所示的页面，页面顶部是一个图标表，每个图标对应一种记录类型。\n\n#### 图 30.4.\
  \ 主区域编辑页面。\n\n![](img/30fig04.jpg)\n\n点击你想要添加的记录类型图标。最常见的类型是地址（Address），它将 IP 地址与主机名关联起来。请参第\
  \ 30.5 节“记录类型”获取所有支持的记录类型的完整列表。\n\n点击图标将带你进入一个列出该类型所有现有记录的页面。列表上方是输入新记录的表单。\n\n\
  在 `Name`（名称）字段中，输入相对于区域名称的新记录名称。例如，如果你想添加记录 `www.example.com`，你只需要输入 `www` 即可。你也可以输入完整的记录名称，只要它末尾有一个点以表示它不是相对于区域的。不要只输入\
  \ `www.example.com`，因为它会被转换为 `www.example.com.example.com`，这可能不是你想要的。\n\n如果此记录的更改频率高于区域内的其他记录，请将\
  \ `Time-To-Live`（生存时间）字段从“默认”（Default）更改为更改之间的估计时间。这决定了 DNS 客户端和其他服务器缓存该记录的时间。\n\
  \n如果你正在添加地址记录，请将主机的完整 IP 地址输入 `Address`（地址）字段。请参阅第 348 页的表 30.1，以了解添加其他类型记录时出现的字段描述及其含义。\n\
  \n`Update reverse?`（更新反向？）字段仅在添加地址记录时出现。它控制在反向区域中自动创建一个对应的记录，该记录将主机名与 IP 地址关联。自然地，只有当你输入的\
  \ IP 位于你的系统作为主反向 DNS 服务器的网络内时，才能执行此操作。这可以保持正向和反向区域的同步，这非常有用。\n\n如果选择了“是”（Yes），只要反向区域中不存在相同\
  \ IP 地址的反向地址记录，就会添加一个反向地址记录。通常，许多主机名具有相同的 IP，例如用于基于名称的虚拟托管的主机。在这种情况下，如果已经存在反向映射，你不希望更改它。\n\
  \n`Yes (and replace existing)`（是（并替换现有））选项与 `Yes` 作用相同，但如果该 IP 地址已存在反向记录，它将更新为新的主机名。如果你知道有一条想要替换的现有记录，这会非常有用。\n\
  \n如果选择了“否”（No），即使可行，也不会创建反向地址。\n\n当你填写完表单后，点击底部的“创建”（Create）按钮。只要填写正确，记录就会被添加到表单下方的列表中。在写入区域的记录文件时，Webmin\
  \ 将使用记录名称的完整规范格式，例如 `www.example.com.`，即使你只输入了 `www`。\n\n要激活新记录以便 DNS 客户端和其他服务器可以进行查询，你需要点击模块主页上的“应用更改”（Apply\
  \ Changes）按钮。如果你计划添加或编辑多条记录，通常最好在完成所有更改后再点击应用按钮。\n\n如果可用可用，你也可以使用图 30.4 所示的主区域页面底部的“应用更改”（Apply\
  \ Changes）按钮。这使用 `ndc` 命令告诉 BIND 仅重新读取该区域的文件，对于托管了大量域名的系统来说，这种方法要快得多。\n\n虽然上面的说明侧重于添加地址记录，但向正向区域添加其他类型记录的过程几乎完全相同。`Update\
  \ reverse?` 字段不存在，且 `Address` 字段被一个或多个不同的字段所取代。第 30.5 节“记录类型”详细解释了 Webmin 已知的每种记录类型的可用字段。\n\
  \n在反向区域中添加反向地址记录时，表单非常不同。`Address` 字段出现在 `Hostname`（主机名）之前，且主机名必须始终以末尾带点的规范形式输入，例如\
  \ `www.example.com.`。`Update reverse?` 字段被 `Update forward?`（更新正向？）取代，它控制在正向区域中创建记录。然而，没有覆盖现有正向记录的选项。如果已存在相同的记录，即使选择了“是”，也不会触动。\n\
  \n每当使用 Webmin 向区域添加或更新记录时，其序列号都会自动增加。这同样适用于添加地址记录时自动更新的反向区域。这意味着当你应用更改时，其他 DNS 服务器可以通过对比新序列号与其缓存的旧序列号来检测区域是否发生了变化。\n\
  \n编辑区域中的现有记录，遵循的步骤如下：\n\n在模块主页上，点击你想要编辑的区域图标，这将带你进入图 30.4 所示的页面。\n\n点击你想要更改的记录类型图标，这将显示列出该类型所有记录的页面。或者，你可以点击“所有记录类型”（All\
  \ Record Types）图标，这将列出区域内无类型的每一个记录。\n\n点击你想要编辑的记录名称。浏览器将显示一个与添加记录相似的表单，但字段已填充了现有地址的详细信息。\n\
  \n要重命名记录，请编辑 `Name` 字段的内容。它最初显示为末尾带点的规范形式，但如果你愿意，可以将其更改为相对于域名的名称。\n\n调整 `Time-To-Live`（生存时间）字段，如果你希望此记录具有不同的\
  \ TTL，或将其设置为“默认”（Default）使其与区域内的其他记录一致。\n\n如果这是地址记录，请更改 `Address` 字段中的 IP。对于其他记录类型，字段与记录创建表单上的相同，含义也相同。\n\
  \n对于地址记录，会显示 `Update reverse?` 字段。选择“是”（Yes）将导致反向区域中对应记录的名称和地址更改，以匹配此正向记录。如果你更改了\
  \ IP 导致反向地址不再同一网络，它将从旧的反向区域中删除并添加到到新的反向区域中（如果该区域由你的服务器托管）。\n\n\n\n\n\n对于反向地址（Reverse\
  \ Address）记录，将显示 `Update forward?`（更新正向？）字段。如果选择了`Yes`，其正向区域中对应的地址记录将发生更改，以匹配你在表单上所做的任何更改。\n\
  \n点击`Save`按钮更新区域文件中的记录并返回记录类型列表。\n\n要激活更改，请点击模块主页上的`Apply Changes`（应用更改）按钮。\n\n\
  要从区域中删除记录，请点击编辑表单上的`Delete`按钮，而不是`Save`。对于地址记录，如果 `Update reverse?`（更新反向？）字段被设置为\
  \ `Yes`，则相应的反向地址记录也将被删除。除此之外，无论什么种类型的记录，删除记录的过程都是相同的。删除反向地址记录时情况也是如此：只要 `Update\
  \ forward?` 字段设置为`Yes`，匹配的地址记录也将删除。\n\n区域中的记录列表最初根据模块配置进行排序，这通常意味着记录将按照添加的顺序显示。要更改此设置，你可以点击`Name`（名称）、`Address`（地址）或\
  \ `Real Name`（真实名称）等列标题按该列进行排序。但这种排序是临时的，如果你返回主页并重新打开区域，排序将丢失。要永久更改，请参见第 30.17 节“配置\
  \ BIND DNS 服务器模块”中的`Order to display records in field`（字段显示顺序）。\n\n### 30.5 记录类型\n\
  \nWebmin 不支持 BIND 支持的所有记录类型，仅支持最常用的类型。下面的列表涵盖了所有支持类型，并解释了它们的用途以及在 Webmin 中添加或编辑该类型记录时可用的字段。每个类型名称旁边是\
  \ BIND 自身在记录文件中识别该类型时使用的短代码。\n\n### 地址 (A)\n地址记录（Address records）将 IP 地址与主机名关联。任何你想通过\
  \ HTTP、telnet 或其他协议通过主机名连接的系统都必须有一个地址记录，以便客户端可以查找其 IP。单个主机名可以有多个地址记录，这通常是为了将网站的负载分散到多个服务器上。创建多个具有不同名称但相同\
  \ IP 的此类类型记录也是有效的，例如设置基于名称的 Apache 虚拟服务器。\n\n在创建或编辑地址记录时，会显示 `Address`字段用于输入与主机名关联的\
  \ IP。还会出现一个标记为 `Update reverse?`的字段，它控制在相应的反向区域中自动创建和修改反向地址记录。详情请参见第 30.4 节“添加和编辑记录”。\n\
  \n### 名称服务器 (NS)\n此类记录定义了负责某个区域的名称服务器。每个区域都必须有一个针对自身的 Name Server 记录，并可以有额外的记录来指定负责子域的\
  \ DNS 服务器。如果你为一个区域设置了备用 DNS 服务器，请确保在主服务器上为该区域添加 Name Server 记录。在这种情况下，记录的名称将是区域的规范名称，例如\
  \ `example.com`。\n\n在创建或编辑此类类型记录时，将显示一个标记为 `Name Server`的字段。此处必须填写负责该区域的 DNS 服务器的\
  \ IP 地址或主机名。如果你输入主机名，它必须已经在你服务器上某个区域中通过地址记录设置了 IP 地址。\n\n### 名称别名 (CNAME)\n此类记录为现有的地址记录或反向地址记录创建一个额外的名称。当\
  \ DNS 客户端请求此类类型记录的 IP 地址时，它将获得名称别名所指向的记录的 IP。如果你有一个主机需要通过几个不同的名称进行访问（例如执行基于名称的虚拟托管的\
  \ Web 服务器），这种记录非常有用。虽然也可以通过创建多个地址记录来实现此点，但只创建一个地址记录和多个名称别名更加灵活，因为如果主机的 IP 地址发生变化，这样更新起来更容易。\n\
  \n编辑和创建名称别名记录的表单包含一个标记为 `Real Name`的字段。此处必须填写别名所指向的记录的规范名称（例如 `webserver.example.com`），或者相对于该名称别名记录所在区域的短名称。\n\
  \n### 邮件服务器 (MX)\n邮件服务器记录（Mail Server records）告诉 Sendmail 和 Qmail 等邮件投递程序在向域或主机投递邮件时应联系哪个系统。如果没有此类记录，发送到域的邮件将投递到区域自身的地址记录中指定\
  \ IP 的系统。这并不总是如人意的，因为你可能希望该 IP 是 Web 服务器的地址，以便网络浏览器能够连接到 `example.`。邮件服务器记录可以通过仅将发往\
  \ `example.*` 的邮件发送到另一个主机来解决这个问题。\n\n每个邮件服务器记录都有一个优先级，它告诉邮件投递程序应该尝试哪个邮件服务器。优先级最低的记录应该指向实际接收和存储电子邮件的系统，而优先级较高的记录通常指向将中继邮件的系统。投递程序将顺序尝试每个服务器，从最低优先级开始，因此如果主邮件服务器宕机，邮件仍将发送到中继服务器，中继服务器可以保存邮件直到主服务器恢复。\n\
  \n在添加或编辑邮件服务器记录时，会显示两个额外字段。第一个标记为 `Mail Server`，必须填写可以接收 `Name` 字段中输入的域邮件的系统规范或相对主机名。第二个标记为\
  \ `Priority`，必须用于指定此特定邮件服务器的数值优先级。通常，主邮件服务器使用优先级 `5`，备用中继服务器使用 `10`。如果你的域只有一个邮件服务器，则在此字段中输入什么数字并不重要。两台服务器可能具有相同的优先级，在这种情况下，将随机选择其中一个。\n\
  \n邮件服务器记录可以在名称中使用通配符，这向邮件投递程序指示特定的邮件服务器负责该域中的所有主机。例如，名为 `*.example.com` 的记录将匹配 `pc1.example.com`\
  \ 和区域内的任何其他主机。如果你想强制本应直接投递到域内工作站的邮件通过中央邮件服务器进行，这种方法非常有用。不过，正如第 30.17 节“配置 BIND DNS\
  \ 服务器模块”所说明，除非`Allow wildcards`模块配置选项设置为`Yes`，否则 Webmin 不允许你使用通配符。\n\n### 主机信息 (HINFO)\n\
  此类 HINFO 记录用于记录特定主机的硬件和操作系统信息。例如，你可以创建一个记录，说明 `server1.example.com` 是一个运行 Linux\
  \ 的 x86 PC。然而，它们极少被使用，实际上被认为存在安全风险，因为它们向潜在攻击者泄露了可能用于接管服务器的信息。\n\n在创建或编辑主机信息记录时，会显示\
  \ `Hardware`和 `Operating System`字段用于输入主机的架构和操作系统类型。你输入的值不能包含任何空格。通常，它们在硬件类型和操作系统字符串中的空格会被\
  \ `_` 字符替换。\n\n\n\n\n### 文本 (TXT)\n`Text` 记录将某种类型的任意消息与一个名称关联。虽然它们几乎很少被使用，但对于为主机添加注释可能非常有用。不过请注意，任何此类注释互联网上任何可以查询你域名内记录的人都可见，因此不应包含敏感信息。\n\
  \n在输入或编辑 `Text` 记录时，会显示 `Message` 字段。你可以输入任何喜欢的文本，包括空格。\n\n### 熟知服务 (WKS)\n这种类型的记录将主机名、端口和协议与一个名称关联。它可以被看作邮件服务器（Mail\
  \ Server）记录的通用变体，告知客户端哪个主机为某些域或主机名提供特定的服务。然而，几乎没有程序实际上会查找 `WKS` 记录，因此在实践中它们几乎毫无用处。\n\
  \n在添加或编辑这些记录之一时，可以使用 `Address`、`Protocol` 和 `Services` 字段。第一个用于输入主机的 IP 地址，该主机为\
  \ `Name` 字段中输入的主机或域提供服务。第二个用于选择服务所使用的网络协议，即 `TCP` 或 `UDP`。最后一个用于输入该主机提供的服务的端口列表或名称（来自\
  \ `/etc/services` 文件）。\n\n### 负责人 (RP)\n这种类型的记录用于指定负责特定主机的个人或组。这些记录中的每个记录都关联有两个值：一个电子邮件地址和一个包含人员名称的\
  \ `Text` 记录名称。`Responsible Person` 记录很少见，且不被任何邮件投递程序或互联网客户端使用。\n\n在编辑或添加这些记录之一时，显示的\
  \ `Email Address` 字段用于输入 `Name` 字段中输入的主机对应的负责人的完整地址（例如 `jcameron@example.com`）。`Text\
  \ Record Name` 字段用于输入包含该人员真实名的 `Text` 记录的相对名称或规范名称。\n\n### 位置 (LOC)\n`Location`\
  \ 记录用于指定主机在纬度和经度上的物理位置。它们几乎从未出现，因此不被许多程序使用。然而，对于那些在许多国家拥有主机的大型组织来说，它们可能是很有用的。\n\n\
  在添加或编辑 `Location` 记录时，会显示 `Latitude` 和 `Longitude` 字段，用于输入 `Name` 字段中主机所在的位置。其格式必须类似于\
  \ `42 21 43.528 N 71 05 06.284 W 12.00m 30.00m 10000.00m 10.00m`。\n\n### 服务地址 (SRV)\n\
  这种类型的记录用于将域名、服务名和协议与特定主机关联。它们允许你指定客户端为特定的服务和主机名应该联系哪个服务器，而不是仅仅连接到主机。在某种意义上，它们类似于邮件服务器记录，但灵活得多。例如，你可以指定\
  \ `example.com` 的 `POP3` 服务器为 `mail.example.com`，但 Web 服务器为 `www.example.com`。在编写本文时，`SRV`\
  \ 记录主要用于 Windows 客户端系统。\n\n在添加或编辑 `Service Address` 记录时，`Protocol` 和 `Service name`\
  \ 字段显示在 `Name` 文本框附近。对于协议，你必须从菜单中选择 `TCP` 或 `UDP`。对于服务名，你必须从 `/etc/services` 文件输入一个已知名称，例如\
  \ `pop3` 或 `telnet`。要查找 `SRV` 记录，客户端会将服务名、协议和名称组合以得到类似 `_telnet._tcp.example.com`\
  \ 的记录名称。Webmin 在编辑或添加 `Service Address` 记录时会自动为你完成此操作，但你可以在列出此类记录的页面上看到组合后的名称。Webmin\
  \ 还会自动在服务和协议之前添加 `_s`，但在显示或编辑 `SRV` 记录时会隐藏它们。这意味着在创建或编辑此类类型的记录时，无需手动输入它们。\n\n`Priority`\
  \ 字段必须用于输入此服务器的数值优先级，这与邮件服务器记录中的优先级含义相同。`Weight` 字段必须包含该特定服务器的权重，或者如果只有一个相同名称、协议和服务名的的记录，则设为零。较高的权重告诉客户端比低权重服务器更频繁地尝试此服务器。\n\
  \n`Port` 字段必须包含客户端连接到服务器的端口号，该端口并不一定得是该服务的标准端口。在 `Server` 字段中，你必须输入实际提供服务且客户端实际连接的系统主机名或\
  \ IP 地址。\n\n### 公钥 (KEY)\n这种类型的记录存储主机的密钥信息，用于 IPsec VPN。由于它们很少被使用，且 Webmin 的 IPsec\
  \ 模块未在书中介绍，因此此处未解释这种记录类型的细节。\n\nWebmin 支持反向区域的记录类型有：\n\n### 反向地址 (PTR)\n反向地址记录在反向区域将主机名与\
  \ IP 地址关联。为了让 DNS 客户端能够从你网络中的 IP 地址查找主机名，你需要为每个主机创建一个这种类型的记录。然而，大多数情况下，这是由 Webmin\
  \ 在添加和编辑 `Address` 记录时自动完成的。如果你创建了自身的 `Reverse Address` 记录，请确保它们与匹配的 `Address` 记录同步。\n\
  \n在添加或编辑此类记录记录时，会显示 `Address` 和 `Hostname` 字段。第一个用于输入完整的 IP 地址，例如 `192.168.1.10`。Webmin\
  \ 将自动将其转换为 DNS 系统内部用于反向地址的 `in-addr.arpa` 格式。第二个字段用于输入规范形式的主机名，例如 `pc1.example.com.`。*请务必始终在末尾加上点号，否则主机名将相对于反向区域，这绝对不是你想要的。*\n\
  \n### 名称服务器 (NS)\n反向区域中的 `Name Server` 记录的作用与正向域中的记录相同，它们告诉其他 DNS 服务器负责该区域或子域的服务器的\
  \ IP 地址或主机名。这意味着必须为该区域的每个主或备用 DNS 服务器添加一个。\n\n在添加或编辑此类记录时出现的 `Zone Name` 字段用于输入服务器负责的区域名称，这通常是包含该记录的区域。然而，与反向地址记录不同，此字段不会被自动转换为\
  \ `in-addr.arpa` 格式。相反，你必须以完全限定的形式输入它，例如为 `192.168.1` 网络定义名称服务器时应输入 `1.168.192.in-addr.arpa.`。在\
  \ `Name Server` 字段中，你必须输入 DNS 服务器的 IP 地址或规范形式主机名，例如 `ns1.example.com.`。\n\n### 别名\
  \ (CNAME)\n这种类型的记录在反向区域中的行为与正向域完全相同。然而，你必须在 `Name` 和 `Real Name` 字段中使用 `in-addr.arpa`\
  \ 格式的反向名称，因为 Webmin 不会为你转换。\n\n`Name Alias` 字段在反向区域中对于部分子网委托最为有用，见第 30.14 节“设置部分反向委托”。\n\
  \n### 30.6 编辑主区域\n你可以使用 Webmin 编辑许多适用于整个主区域的设置，例如过期和重试时间以及允许查询它的客户端。这些设置实际上适用于区域中的所有记录，尽管某些设置（如\
  \ `TTL`）可以按记录进行覆盖。\n\nWebmin 使用“区域参数”（zone parameters）来指代存储在域 SOA 记录中的所有信息，包括主名称服务器、管理员电子邮件以及重试和过期时间。所有这些内容在创建区域时已设置，但你可以按照以下步骤随时进行编辑：\n\
  \n在模块的主页上，点击要编辑的区域图标。这将带你进入图 30.4 所示的表单。\n\n\n\n\n\n点击“区域参数”图标，将打开用于编辑参数的表单。\n\n\
  `Master server（主服务器）字段仅在 DNS 服务器的 Internet 主机名发生更改时才需要编辑。输入完全限定的主机名，并在末尾加上点。\n\n\
  要更改区域负责人的地址，请编辑`Email address（电子邮件地址）字段。其中包含的任何 `@` 符号将被自动转换为点，用于 `SOA` 记录，符合 `BIND`\
  \ 的要求。\n\n`Refresh time（刷新时间）、`Transfer retry time（传输重试时间）、`Expiry time（过期时间）和`Default\
  \ time-to-live（默认生存时间）字段的含义均与第 30.3 节“创建主区域”中解释的相同。如果您的区域记录在未来经常发生变化，您可能想要缩短某些时间。然而，即使新时间短得多，在旧的刷新或过期时间之前，辅助服务器和\
  \ DNS 客户端可能无法检测到任何更改。这是因为它们会等待旧时间过期后才会再次向主服务器检查以发现新时间。\n\n完成后，点击页面底部的`Save（保存）按钮，然后点击模块主页上的`Apply\
  \ Changes（应用更改）`按钮。表单保存时，`SOA` 记录中的序列号将自动增加，以便辅助服务器知道区域已更改。\n\n还有另一组您可以为主区域编辑的选项，它们存储在区域部分的\
  \ `named.conf` 文件中。这些选项控制哪些服务器和客户端被允许查询区域中的记录、执行区域传输以及通过网络更新记录。这些选项中最用的是指定该区域的从用\
  \ DNS 服务器列表，当发生更改时应通知这些服务器，以便它们能够执行区域区域传输并保持同步。\n\n要编辑这些主区域选项，需要遵循的步骤是：\n\n1. 在模块主页上，点击您想要编辑的区域图标。这将带您进入图\
  \ 30.4 所示的表单。\n2. 点击`Edit Zone Options（编辑区域选项）`图标，将打开显示现有设置的表单。\n3. `Check names?（检查名称？）字段决定了\
  \ `BIND` 在读取文件时对该区域记录执行的检查级别。可用选项有：\n    - **Warn（警告）**：如果发现无效记录，错误将写入系统日志文件，但会继续处理其他记录。\n\
  \    - **Fail（失败）**：无效记录会导致整个区域被拒绝，但其他区域仍将正常处理。\n    - **Ignore（忽略）**：完全不进行检查。\n\
  \    - **Default（默认）**：使用`Zone Defaults（区域默认）`页面的全局默认值。如果没有设置，将使用编译到 `BIND` 中的默认值。默认是在遇到无效记录时失败。\n\
  \n要在区域记录更改时通知辅助服务器，请将`Notify slaves of changes?（通知从服务器更改？）字段设置为`Yes`。`BIND` 会通过查看区域的`Name\
  \ Server（名称服务器）`记录以及`Also notify slaves（也通知从服务器）`字段中的 IP 地址列表来确定哪些哪些服务器。如果您的区域有辅助服务器，应应开启此选项。\n\
  \n要允许某些系统动态更新区域中的记录，请在`Allow updates from（允许来自）`字段中填充 IP 地址列表、IP 网络（如 `*192.168.1.0/24`）和\
  \ `BIND` ACL 名称。只有匹配的主机才能使用 `nsupdate` 等命令修改记录，如果列表为空，将完全不允许更新。在同时也使用 Webmin 编辑记录的区域中允许动态更新时应小心，因为动态进行的更新极有可能被此模块中的更改覆盖，反之亦然。\n\
  \n默认情况下，所有 DNS 客户端和服务器都可以查找区域中的记录。对于仅在内部网络使用的区域，这可能不是您想要的，因为它可能会向潜在攻击者泄露敏感信息。要限制查询，请在`Allow\
  \ queries from（允许来自）`字段中填充 IP 地址列表、IP 网络和 `BIND` ACL 名称。如果字段为空，则由全局`Zone Defaults`页面上的同名字段决定哪些客户端被被允许。\n\
  \n要限制允许对此域名所有记录执行区域传输的客户端和服务器，请填充`Allow transfers from（允许来自）`字段。通常您只想允许辅助服务器执行传输，特别是当您的区域很大或包含您希望向攻击者隐藏的记录时。在字段中输入\
  \ IP 地址列表、IP 网络和 ACL 名称，将传输限制为仅匹配的客户端。如果为空，将应用`Zone Defaults`页上的`Allow transfers\
  \ from`字段。\n\n要指定在区域更改时通知的额外从服务器，请在`Also notify slaves（也通知从服务器）`字段中填充 IP 地址列表。`BIND`\
  \ 通常使用其`Name Server`记录中该区域的所有辅助服务器地址，但这可能并不总是完整的。\n\n完成后，点击页面底部的`Save（保存）`按钮用您的更改更新\
  \ `BIND` 配置文件。您需要使用模块主页上的`Apply Changes（应用更改）`按钮使其生效。\n\n如果不再需要主区域，可以使用此 Webmin\
  \ 模块完全删除它及其包含的所有记录。执行此操作，遵循的步骤是：\n\n1. 在模块主页上，点击您想要编辑的区域图标。\n2. 点击页面底部的`Delete Zone（删除区域）`按钮。\n\
  3. 在删除正向区域时，`Delete reverse records in other zones?（删除其他区域中的反向记录？）字段控制是否也应该删除托管反向区域中所有地址记录的匹配`Reverse\
  \ Address（反向地址）`记录。设置为`Yes`通常是安全的，因为只有具有完全相同 IP 地址和主机名的记录会被删除。\n4. 同样，在删除反向区域时，`Delete\
  \ forward records in other zones?（删除其他区域的正向记录？）`字段决定是否也删除匹配的正向记录。\n5. 一旦您做了选择并确定要继续删除，点击`Delete（删除）`按钮。`named.conf`中的区域条目将被移除，其记录文件将被删除。\n\
  \n您可以将主区域转换为同名的从用区域，而无需删除并重新创建。如果新服务器接管某些域的主服务器角色，或者主服务器和辅助服务器正在切换角色，这可能非常有用。第 30.8\
  \ 节“编辑从用区域”解释了如何执行将从用区域转换为主区域的反向操作，这在这种情况下可能有用。\n\n要转换区域，遵循的步骤是：\n\n1. 在模块主页上，点击您想要编辑的区域图标，然后点击`Edit\
  \ Zone Options（编辑区域选项）`图标。\n2. 当您点击`Convert to slave zone（转换为从用区域）`按钮时，`named.conf`中的区域条目将立即更新转换为从用区域。浏览器将返回模块主页。\n\
  \n通常，每个从用区域都有一个可以使用来执行区域传输的主服务器 IP 地址列表。对于转换后的区域，除非设置了`Default master server(s)\
  \ for slave zones（从用区域默认主服务器）`模块配置选项，否则该列表最初为空。请按照第 30.8 节“编辑从用区域”的说明正确设置主服务器地址。\n\
  \n要激活更改，点击模块主页上的`Apply Changes（应用更改）`按钮。\n\n### 30.7 创建新的从用区域\n\n从用或辅助区域是您的 DNS\
  \ 服务器从该区域的主服务器获取记录列表的区域。通常，辅助服务器用于减轻主服务器的负载，或在主服务器宕机时备份。对于重要的区域（例如公司的 Internet 域），您应该始终至少有一个辅助服务器，这样即使主服务器宕机，网站仍然可以访问且电子邮件仍然可以投递。\n\
  \n\n\n\n域的辅助 DNS 服务器通常不应与主服务器位于同一个网络中，这样该网络的故障就不会导致两者同时失效。许多 ISP（互联网服务提供商）和托管公司会在它们自己的\
  \ DNS 服务器上免费为客户的域名托管从区域。如果你的 ISP 提供此类服务，并且你想为互联网域名设置辅助服务器，那么你应该利用它。如果是这样，本节的大部分内容可以跳过。但是，如果你想为内部域添加从服务器，或者你有一个具有许多互联网连接的大型公司网络，那么下面的说明解释了如何设置它：\n\
  \n在 BIND DNS 服务器模块的主页上，点击现有区域列表上方或下方的`Create a new slave zone`（新建从区域）链接。这将显示图 30.5\
  \ 所示所示的表，用于输入新域的详细信息。\n\n##### 图 30.5. 从区域创建表。\n\n![](img/30fig05.jpg)\n\n对于如 `example.com`\
  \ 的正向区域，将 `Zone type`（区域类型）字段设置为 `Forward`，并在 `Domain name / Network` 字段中输入区域名称。对于将网络\
  \ IP 地址映射到主机名的反向区域，选择 `Reverse` 选项并在 `Domain name / Network` 字段中输入网络地址（如 `192.168.1`）。\n\
  \n`Records file`（记录文件）字段决定 BIND 是否在文件中保留该区域记录的缓存，如果是，该文件位于何处。如果选择 `None`（无），DNS\
  \ 服务器从主服务器传输的记录将仅保留在内存中，并在服务器重启时丢失。这应该在主服务器和从服务器之间有良好的网络连接时才选择，因为这将增加服务器必须执行的区域传输次数。\n\
  \n如果你选择 `Automatic`（自动），Webmin 将在 `named.conf` 文件指定的区域文件目录（通常为 `/var/named`）中生成文件名。每当服务器执行区域传输时，所有记录将以标准格式写入此文件。\n\
  \n如果选择最后一个选项，你可以在旁边的字段中输入存储记录文件的完整路径。如果你想分离主区域和从区域的记录文件，这会非常有用。\n\n在 `Master servers`（主服务器）字段中，输入主\
  \ DNS 服务器以及该区域任何其他辅助服务器的 IP 地址。BIND 在执行区域传输时会按顺序尝试这些服务器，因此主服务器应该位于列表的第一位。你必须至少输入一个地址，以便你的服务器知道从哪里获取记录。\n\
  \n点击 `Create`（创建）按钮将新的从区域添加到服务器的配置中。你的浏览器将重定向到编辑区域选项的页面。\n\n返回模块主页，点击主页上的 `Apply\
  \ Changes`（应用更改）按钮使添加生效。\n\n在主服务器上，为该区域添加带有辅助服务器 IP 地址的新名称服务器（NS）记录。在 Webmin 中遵循第\
  \ 30.4 节“添加和编辑记录”中的指令即可完成。\n\n配置主 DNS 服务器通知此从服务器关于区域内记录的任何更改。第 30.6 节“编辑主区域”中的步骤解释了如何操作。\n\
  \n如果是互联网域，请通知父域注册商新的辅助服务器。大多数注册商提供在线表单来编辑域名的名称服务器列表，你可以在其中添加辅助 IP。这是为了让互联网上的其他主机知道在主服务器故障时使用从服务器。\n\
  \n另一种与从区域密切相关的区域类型是存根区域（stub zone）。它们像从区域，但只包含从主服务器传输的名称服务器记录，而不是所有记录。存根区域很少被使用，但对于确保其子域区域中的名称服务器记录与子域本身使用的记录相同可能很有用。创建一个它的步骤与上述几乎相同，但在第\
  \ 1 步中你必须使用主页上的 `Create a new stub zone`（新建存根区域）链接。\n\n### 30.8 编辑从区域\n\n创建从区域后，仍然可以编辑适用于它的若干选项。自然，没有办法添加或编辑区域内的实际记录，但你仍然可以更改主服务器列表、记录文件以及允许查询的客户端。要更改这些设置，需要遵循的步骤如下：\n\
  \n在模块主页上，点击你要编辑的从区域图标。你的浏览器将显示图 30.6 所示的表。\n\n##### 图 30.6. 从区域编辑表。\n\n![](img/30fig06.jpg)\n\
  \n滚动到页面底部的 `Zone Options`（区域选项）表。要要编辑此区域的其他主服务器和从服务器列表，请更改 `Master servers` 字段中的\
  \ IP 地址。如果添加了新的辅助服务器，应将其添加到所有其他辅助服务器的列表中，以便它们从那里进行区域传输。如果主服务器的 IP 地址发生更改，必须用新地址更新列表。\n\
  \n要更改服务器在放弃区域传输之前等待的时间，取消选择 `Maximum transfer time`（最大传输时间）字段的 `Default`，并在旁边的文本框中输入分钟数。\n\
  \n如果 `Records file` 字段设置为 `None`，从主服务器传输到此区域的记录将仅保留在内存中。然而，如果输入文件名，记录将以标准格式写入该文件。这是最佳选项，因为它最地减少了区域传输，并允许你像下文所示在辅助服务器上查看记录。\n\
  \n要让此 DNS 服务器在区域更改时通知其他，将 `Notify slaves of changes?`（通知从服务器更改？）字段更改为 `Yes`。只有当有其他从此服务器执行区域传输的辅助服务器时，这才有用，它们可能无法接收来自主服务器的更新通知。\n\
  \n要通知的 DNS 服务器取决于该区域的名称服务器记录以及 `Also notify slaves`（也通知从服务器）字段的内容。\n\n默认情况下，所有 DNS\
  \ 客户端和服务器都能够查找区域中的记录。要更改此项，请在 `Allow queries from`（允许从...查询）字段中填写 IP 地址、IP 网络和 BIND\
  \ ACL 名称列表。如果该字段留空，由全局 `Zone Defaults`（区域默认）页面上的同名字段决定允许哪些客户端。\n\n要限制允许执行域所有记录区域传输的客户端和服务器，请在\
  \ `Allow transfers from`（允许从...传输）字段中填写 IP 地址、IP 网络和 ACL 名称列表。如果留空，则应用 `Zone Defaults`\
  \ 页面上的 `Allow transfers from` 字段。\n\n表上的其他字段如 `Check names?`（检查名称？）和 `Allow updates\
  \ from?`（允许从...更新？）并不真正用于从区域，因此可以保持不变。\n\n完成更改后，点击 `Save`（保存）按钮。只要输入没有语法错误，你将返回模块主页。点击那里的\
  \ `Apply Changes` 按钮使修改生效。请注意，即使主服务器发生了更改，这也不会总是强制重新传输区域。对于使用记录文件的从区域，BIND 只有在区域过期或接收到更改时才会进行传输。\n\
  \n在编辑使用记录文件的从区域时，可以在 Webmin 中浏览记录。点击从区域图标后显示的页面顶部有一个记录类型表，这与主区域表单上显示的表相同。点击每个类型都可以列出区域中该类型记录的名称和值（辅助服务器已知）。当然，编辑或添加这些记录是不可能的，因为任何更改必须在域记录权威来源的主服务器上进行。\n\
  \n\n\n要停止您的系统作为某个区域的从服务器（slave server），您需要将其从 `BIND` 配置中删除。这通常是一个安全的操作，因为该区域中的所有记录都已从主服务器复制，并且可以轻松替换。然而，您应该更新区域中的名称服务器（Name\
  \ Server）记录，并通知父域名注册商，您的系统不再是该区域的从服务器，这样其他 DNS 服务器就不会浪费时间来查询它。\n\n要删除从区域，需要遵循的步骤是：\n\
  \n1. 在模块主页上，点击您想要编辑的从区域图标。这将带您进入图 30.6 所示的表单。\n2. 点击页面右下角的 `Delete`（删除）按钮，这将显示确认表单。\n\
  3. 如果确定要删除该区域，点击 `Delete` 按钮。\n4. 浏览器返回模块主页后，点击 `Apply Changes`（应用更改）使删除生效。\n5.\
  \ 在主服务器上，从区域中移除此从服务器的名称服务器（`NS`）记录。\n6. 如果是互联网域名，请通知父区域注册商已移除此从服务器。如果不这样做，当其他 DNS\
  \ 服务器尝试查询此服务器获取域名记录而它无法提供答案时，可能会导致问题。\n\n您对从区域可以执行的最后操作将其转换为主区域。这仅对于使用记录文件的区域是可能的，这样\
  \ `Webmin` 以后就可以查看并编辑该文件。如果您执行了此类转换，请确保原始主服务器已变为从服务器，或者停止托管该区域，因为同一个域名不能由两个主服务器提供。\n\
  \n转换区域的步骤是：\n\n1. 点击模块主页上的对应图标。\n2. 滚动到从区域页面底部，点击 `Convert to master zone`（转换为主区域）按钮。这将立即更新\
  \ `named.conf` 文件以更改区域的类型，但不会进行任何其他更改。\n3. 要使转换生效，点击模块主页上的 `Apply Changes` 按钮。\n\
  \n现在，您可以按照第 30.4 节“添加和编辑记录”中的说明，像处理任何普通主区域一样编辑域名中的记录了。\n\n### 30.9 创建和编辑正向区域（Forward\
  \ Zone）\n\n正向区域是指您的 `DNS` 服务器仅代表任何请求者将查询转发到另一个服务器的区域。如果该区域实际上由客户端无法访问的另一个服务器托管，那么它们将非常有用。可以设置\
  \ `BIND` 将对任何非托管区域的所有请求转发到另一个服务器，如下文第 30.12 节“配置转发和传输”所示。正向区域条目执行相同的操作，但仅针对单个域名。\n\
  \n要设置正向区域，需要遵循的步骤是：\n\n1. 在模块主页上，点击现有域名图标列表上方的 `Create a new forward zone`（创建新正向区域）链接。这将带您进入区域创建表单。\n\
  2. 将 `Zone type`（区域类型）字段设置为 `Forward`（正向）或 `Reverse`（反向），就像创建主区域一样。\n3. 对于正向区域，在\
  \ `Domain name / Network` 字段中输入其完整名称（结尾不带点）。对于反向区域，在字段中输入其网络（如 `192.168.1`）。`Webmin`\
  \ 在添加区域时会自动将其转换为 `in-addr.arpa` 格式。\n4. 在 `Master servers`（主服务器）字段中，输入可以查询查找区域内记录的\
  \ `DNS` 服务器的 IP 地址列表。这些必须是该域名的主、从或正向主机。\n5. 如果没有输入任何地址，`BIND` 将对区域中的记录执行正常查找，而不是将请求转发到另一个服务器。这可以用于覆盖单个区域“转发和传输”页面上的全局转发设置。\n\
  6. 点击 `Create`（创建）按钮，将区域添加到 `BIND` 配置文件中。您的浏览器将跳转到编辑新域名选项的页面。\n7. 返回模块主页，并点击 `Apply\
  \ Changes` 按钮使其生效。\n\n创建正向区域后，您可以按照以下步骤删除它或编辑其拥有的少量设置：\n\n1. 点击模块主页上该区域的图标，这将带您的浏览器进入编辑其选项的小型表单。\n\
  2. 要更改请求被转发到的 `DNS` 服务器列表，请编辑 `Master servers` 字段中的 IP 地址。如果没有输入任何地址，将直接查找此域名的记录。\n\
  3. 如果 `Try other servers?`（尝试其他服务器？？）字段被设置为 `Yes`（是），当 `BIND` 无法连接到列出的任何服务器时，它将对该区域的请求尝试常规直接查找。\n\
  4. 点击 `Save`（保存）按钮存储更改，然后在主页上点击 `Apply Changes` 激活它们。\n5. 或者要删除正向区域，点击 `Delete`（删除），然后在确认页面上再次点击\
  \ `Delete`。\n\n### 30.10 创建根区域（Root Zone）\n\n如引言所述，根区域是包含您的 `DNS` 服务器需要包含互联网根服务器信息的区域。没有它，就无法解析您的服务器托管之外的其他域名中的记录。幸运的是，您的\
  \ `BIND` 配置中几乎总是已经存在一个根区域，它由 `Webmin` 创建或作为默认设置的一部分包含。\n\n如果您在首次设置模块时选择了仅供内部非互联网使用的选项，但现在已将系统连接到互联网，那么您可能需要创建一个根区域。当配置了视图（views）时，如第\
  \ 30.15 节“使用 BIND 视图”所示，添加第二个根区域也是有。\n\n`Webmin` 只有在不存在根区域或存在不包含根区域视图的情况下允许您创建根区域，因为拥有两个区域没有意义。要添加根区域，需要遵循的步骤是：\n\
  \n1. 在模块主页上，点击 `Create a root zone`（创建根区域）图标。\n2. 在 `Store root servers in file`（在文件中存储根服务器）字段中输入用于根区域的文件名。如果已存在，该字段将包含其路径。否则，您应该输入类似\
  \ `/var/named/db.cache` 的内容。\n3. `Get root servers from`（从此处获取根服务器）字段控制 `Webmin`\
  \ 从哪里复制文件。选项有：\n   - `Download from root FTP server`（从根 FTP 服务器下载）：这是最佳选项，因为它告诉模块连接\
  \ `rs.internic.net` 并下载最新版本的文件。但如果您的系统无法执行 FTP 下载，此方法可能无效。\n   - `Use Webmin's older\
  \ root server information`（使用 Webmin 旧的根服务器信息）：如果第一种不起，则应使用此选项。如果选中，模块将使用 Webmin\
  \ 自带的根区域文件副本，这可以使用，但可能不是最新的。\n   - `Existing root servers in file`（文件中现有的根服务器）：如果第\
  \ 2 步输入的文件已存在，则应选择此选项。如果您正在向视图添加根区域，且另一个视图中已存在一个，则将默认选中它，以便在两个区域之间共享文件。\n4. 点击 `Create`（创建）按钮添加区域并返回模块主页。然后点击\
  \ `Apply Changes`使其生效。\n\n一旦添加了根区域，主页上将出现一个代表它的图标。您可以通过点击图标并点击 `Delete` 按钮来删除它；但如上所述，这可能会导致无法解析非托管互联网域中的记录。\n\
  \n### 30.11 编辑区域默认值\n\n如果您添加了许多包含相似记录的区域，那么在创建每个区域后手动添加这些记录将耗大量精力。例如，在 Web 托管公司，您所有的域名可能都包含一个指向\
  \ Web 服务器 IP 地址的 `www` 记录，以及一个将邮件定向到中央服务器的邮件服务器记录。幸运的是，`Webmin` 允许您创建一个 le 到所有新域名的记录列表，称为区域模板。\n\
  \n\n\n一个模板由一个或多个记录组成，每个记录都有一个名称、类型和值。对于 `Address` 记录，该值可以选项（option），表示它可以在创建区域时由用户输入。如果新网域中的某个记录（如\
  \ `www`）没有固定地址，而你希望在添加区域时能够方便地设置它，那么这就会非常有用。模板只能在创建正向区域时使用，因为它们对于反向区域没有太大意义。\n\n\
  你还可以编辑新区域的默认过期（expiry）、刷新（refresh）、TTL 和重试（retry）时间。Webmin 的初始默认值是合理的，但可能并不适用于你的网络。更改这些默认值并设置模板记录，请遵循以下步骤：\n\
  \n在模块主页上，点击 `Zone Defaults` 图标。页面顶部标记为 `Defaults for new master zones` 的表单包含了所有需要编辑的字段。\n\
  \n如果你想更改新区域的默认时间，请编辑 `Refresh`、`Transfer retry time`、`Expiry time` 和 `Default time-to-live`\
  \ 字段。此处做的更改不会影响现有的主区域。\n\n如果你所有的新网域都由同一个人管理，请在 `Default address` 字段中输入其地址。这将节省你每次在创建主区域时输入的时间。\n\
  \n在 `Template records` 表格中，会出现两个输入新记录的空白行。要添加两个以上的记录，你需要保存此页面并重新编辑。现有的记录可以通过清除其名称字段来删除。\n\
  \n在 `Record name` 列下，必须输入相对于区域的记录名称，例如 `www` 或 `ftp`。要为区域本身创建一个记录（例如网域的 Mail Server\
  \ 记录），只需输入点。\n\n在 `Type` 列下，从列表中选择记录的类型。关于每个用途的更多信息，请参见第 30.5 “Record Types”。\n\n\
  正如名称所示，`Value` 列下的字段用于输入新记录的值。对于 `Address` 类型，在创建新区域时可以选择 `From form` 选项并输入地址，这适用于所有选择了此选项的模板记录。对于\
  \ Mail Server 记录，必须输入用空格分隔的优先级和服务器名称，例如 `5 mail.example.com.`。其他类型记录的值应在添加到区域时以相同的格式输入。\n\
  \n如果你熟悉 `BIND` 使用的记录格式，可以创建自己的记录文件以包含在新区域中。如果在 `Additional template file` 字段输入了文件名，其内容将添加到\
  \ Webmin 为新区域创建的区域文件中。\n\n完成添加记录后，点击页面底部的 `Save` 按钮。更改将适用于以后创建的任何主区域。\n\n现在你已经创建了模板，可以为每个新主区域选择是否使用它。在创建表单（参见第\
  \ 30.3 “Creating a New Master Zone”）中，有一个标记为 `Use zone template?` 的字段，如果有模板记录，则默认设置为\
  \ `Yes`。旁边是一个名为 `IP address for template records` 的字段，用于为选择了 `From form` 选项的记录指定\
  \ IP（如果你选择了使用模板且有记录未指定 IP 地址）。\n\n`Zone Defaults` 页面还包含几个适用于所有现有区域的选项，但可以根据第 30.6\
  \ “Editing a Master Zone”按区域进行设置或覆盖。你可以控制哪些客户端允许查询服务器以及对各种类型的记录进行何种检查。限制允许的客户端特别有用，可以阻止非内部客户端使用你的\
  \ DNS 服务器。然而，你应该确保你的服务器托管的互联网区域是对所有人可见的，以便互联网上的其他 DNS 服务器可以查询它们。\n\n更改这些全局选项，请遵循以下步骤：\n\
  \n在模块主页上，点击 `Zone Defaults` 图标，并滚动到 `Default zone settings` 部分。\n\n要控制哪些主机允许查询你的\
  \ DNS 服务器，将 `Allow queries from` 字段更改为 `Listed`，并在下方文本框输入 IP 地址、IP 网络（如 `192.168.1.0/24`）和\
  \ ACL 名称列表。不匹配列表中任何客户端将被拒绝，除非它们请求的是具有独立设置允许允许的区域记录。\n\n要控制哪些主机允许从你的服务器执行区域传输，将 `Allow\
  \ transfers from` 字段更改为 `Listed`，并在下方文本框填充 IP 地址、IP 网络和 ACL 名称列表。只有作为该服务器托管区域从区的服务器才真正需要能够执行传输，因此通常输入它们的\
  \ IP 地址是明智的。如果你限制了查询，则必须填写此字段，以便无法查找记录的主机无法执行传输。\n\n`Check names in master zones?`\
  \ 和 `Check names in slave zones?` 字段分别控制主区域和从区域所有区域文件中记录的检查。每个字段的可用选项为：\n\n- **Warn**:\
  \ 如果发现无效记录，错误将写入系统日志文件，但其他记录的将将继续。\n- **Fail**: 无效记录会导致整个区域被拒绝，但其他区域将仍正常处理。\n- **Ignore**:\
  \ 完全不进行任何检查。\n- **Default**: 使用默认检查级别，即 `Fail`。\n\n要让 `BIND` 检查从其他 DNS 服务器接收的响应，将\
  \ `Check names in responses?` 字段设置为 `Warn` 或 `Fail`。默认值是直接将潜在错误的响应传递给客户端。\n\n`Notify\
  \ slaves of changes?` 字段决定当此服务器托管的主区域发生变化时，`BIND` 是否向所有从区发送通知。要开启此项，选择 `Yes`。否则，选择\
  \ `No` 或 `Default`。启用通知是一个好主意，因为可以确保从服务器与主服务器同步。\n\n完成后，点击页面底部的 `Save` 按钮更新 `BIND`\
  \ 配置文件，然后点击模块主页上的 `Apply Changes` 按钮使更改生效。新设置将适用于所有未在其选项页面上显式覆盖它们的区域。\n\n### 30.12\
  \ 配置转发和传输\n\n`BIND` 可以配置为将它不是主或从区的区域的所有请求转发到另一个 DNS 服务器。这样做时，它本身就像一个 DNS 客户端，接收真实客户端的请求并将其发送到另一个或多个服务器进行解析，而不是执行联系根区域服务器并查找正确服务器的正常过程。如果你的\
  \ DNS 服务器无法访问互联网，但能与具有完全网络访问权限的 DNS 服务器通信，这将非常有用。例如，它可能位于仅允许到一组特定目的地的防火墙内部网络。\n\n\
  要设置转发，请遵循以下步骤：\n\n在模块主页上，点击 `Forwarding and Transfers` 图标。\n\n在出现的表单中，在 `Servers\
  \ to forward queries to` 字段中填写应发送请求的 DNS 服务器 IP 地址。`BIND` 将按顺序尝试，直到其中一个返回肯定或否定响应。\n\
  \n如果列表为空，服务器将恢复通过联系根服务器等查找记录的正常方法。\n\n\n\n\n如果您希望服务器在无法联系任何转发服务器时尝试直接解析客户端查询，请在\
  \ `forwarder` 字段无响应时，将 `Lookup` 直接设置为 `Yes`。这仅在您的服务器实际上具备查询能力时才有用。\n\n点击页面底部的 `Save`\
  \ 按钮，然后返回主页面并点击 `Apply Changes` 以使新设置生效。假设转发列表已填写，您的服务器现在会将所有客户端查询发送到列出的服务器。\n\n\
  该表单还包含用于配置 `BIND` 在执行区域传输时行为的字段。您可以控制它等待传输完成的时间、用于传输的协议以及同时可以激活的数量。要编辑这些设置，请遵循以下步骤：\n\
  \n- 在模块主页上，点击 `Forwarding and Transfers` 图标。\n- 默认情况下，`BIND` 会等待 120 分钟（2 小时）让从主服务器的区域传输完成。要更改此设置，请在\
  \ `Maximum zone transfer time` 字段中输入不同的分钟数。也可以基于每个从服务器区域进行设置或覆盖。\n- `8.1` 之前的 `BIND`\
  \ 版本仅支持一次传输单个区域。因为从同一个主服务器传输许多区域时速度可能很慢，可以将 `Zone transfer format` 字段设置为 `Many`，以使用新格式将多个域名组合到同一次传输中。如果选择\
  \ `One at a time` 或 `Default`，则每个区域将单独传输。除非您确定所有从服务器都在运行 `BIND 8.1` 或更高版本，否则这是最佳选择。\n\
  - 默认情况下，您的域名不会从同一个主服务器执行超过 2 个并发区域传输。要增加此限制，请将 `Maximum concurrent zone transfers`\
  \ 字段更改为更高的值。这可以加快大量域名的传输过程，但以增加主服务器负载为代价。\n- 完成更改后点击 `Save` 按钮，然后在主页面上点击 `Apply\
  \ Changes` 激活它们。新设置将适用于后续的所有区域传输。\n\n### 30.13 编辑访问控制列表\n\n访问控制列表（或 `ACL`）是一组 IP\
  \ 地址、IP 网络或其他 `ACL` 的列表，它们被分组在单一名称下。随后可以使用该 `ACL` 名称来指定允许查询、更新或从区域执行区域传输的客户端列表。这可以减少您的\
  \ `BIND` 配置中的重复内容，并使其更加清晰。例如，`ACL` `corpnet` 可能匹配 IP 网络 `192.168.1.0/24`、`192.168.2.0/24`\
  \ 和 `1.2.3.0/24`，它们都是您公司网络的一部分。在配置谁可以查询区域时，只需输入 `corpnet` 而不是那组网络地址列表。\n\n要在 Webmin\
  \ 中查看和编辑 `ACLs`，遵循以下步骤：\n\n- 在模块主页上，点击 `Access Control Lists` 图标。这将带您进入一个列出现有 `ACLs`\
  \ 的页面，并允许添加一个。如果您想添加多个 `ACL`，则需要保存表单并重新编辑它，以强制显示新的空行。\n- 要添加新的 `ACL`，找到表格底部的空行，并在\
  \ `ACL Name` 列中输入仅由字母和数字组成的短名称。然后在 `Matching addresses, networks, and ACLs` 下方的字段中输入该新\
  \ `ACL` 将包含的 IP 地址、IP 网络和其他 `ACL 名称` 列表。\n- IP 地址必须以标准格式输入（如 `192.168.1.1`），但不允许主机名。IP\
  \ 网络必须以网络/前缀格式输入（如 `192.168.1.0/24` 或 `192.168.1/24`）。您也可以在任何地址、网络或 `ACL 名称` 前加上\
  \ `!` 来取反。例如，条目 `!192.168.1.0/24` 将匹配 `192.168.1` 网络之外的所有主机。\n- 可以通过更改表格中的字段来编辑列表中的现有项，并通过清空包含名称的字段来删除\
  \ `ACLs`。\n\n完成添加和编辑 `ACLs` 后，点击 `Save` 按钮。要激活更改，返回主页面并点击 `Apply Changes`。`ACL`\
  \ 创建后，可以用于查询，并对以下内容的传输和更新限制：\n\n`corpnet`\n`192.168.1.0/24`\n`192.168.2.0/24`\n\
  `1.2.3.0/24`\n`192.168.1.1`\n`192.168.1.0/24`\n`192.168.1/24`\n`!192.168.1.0/24`\n\
  `192.168.1`\n\n### 30.14 设置部分反向委托\n\n部分反向委托是将网络子集传输到另一个服务器的方法。然而，许多组织的网络比 C 类网络小。幸运的是，`BIND`\
  \ 很好地处理反向委托并自动将特殊区域转换为 `in-addr.arpa`。示例 `100-110.1.168.192.in-addr.arpa` 显示了方法。在托管\
  \ C 类区域的服务器和委托其子部分的服务器上遵循的准确步骤如下：\n\n- 确定要委托的地址范围，例如 `192.168.1.100` 到 `192.168.1.110`。通常，子区域名称基于所委托的地址范围，但只要它在父网络域下，就不不必如此。\n\
  - 在托管 C 类区域的服务器上，为 `192.168.1.100-110` 添加 `Name Server` 记录，并将服务器设置为子区域 DNS 服务器的\
  \ IP 地址或名称。\n- 对于范围内的每个地址，在反向区域中添加名为 `101.1.168.192.in-addr.arpa.` 的 `Name Alias`\
  \ 记录，其 `Real Name` 设置为 `101.100-110.1.168.192.in-addr.arpa*`。\n\n创建所有 `Name Alias`\
  \ 记录后，在该服务器上需要的操作都已完成，您可以点击 `Apply Changes`。\n\n在子网络的 DNS 服务器上，为反向网络 `192.168.1.100-110`\
  \ 创建一个新的主区域。Webmin 会自动为您将其转换为正确的 `in-addr.arpa` 格式。\n\n\n\n\n对于 `192.168.1.100-110.101`\
  \ 这样的 IP 地址，像往常为新区域添加反向地址记录。仅为单个 IP `192.168.1.101` 添加记录将不起作用。\n\n创建反向记录后，点击 `Apply\
  \ Changes`（应用更改）按钮使其生效。现在你应该能够在服务器上使用如 `nslookup` 的命令对父级网络区域进行查询了。\n\n上述说明可用于从单个\
  \ C 类网络将多个范围委托给几个不同的 DNS 服务器。范围的大小没有数量限制，也不要求它们遵循标准的网络分块边界；然而，由于路由原因，大多数 IP 分配都是以\
  \ 2 的幂次方大小的块完成的（例如 4, 8, 16 等），这意味着任何子区域范围的大小将是相同的。\n\n在使用 `Webmin` 时，使用反向地址委托时存在唯一的问题是：当地址记录创建并更新时，反向地址记录不会自动创建和更新。这意味着你必须像上述步骤那样，在子区域服务器上手动创建所有此类记录。\n\
  \n设置部分反向委托的一个不便之处是必须在父级网络区域服务器上创建许多类似的名称别名（Name Alias）记录。幸运的是，有更简单的替代记录生成器。生成器是一种特殊的\
  \ `BIND` 配置项，它使用递计数器创建多个相似的记录。此模块允许你按照以下步骤创建和编辑生成器：\n\n- 在模块的主页上，点击你要在其中创建记录的反向区域图标。这通常是一个\
  \ C 类网络域名，该域名将有一范围地址被委托给其他某些服务器。\n- 点击 `Record Generators`（记录生成器）图标。这会带你进入一个页面，该页面包含一个显示已存在生成器的表格，并有一行用于添加新生成器的空行。\n\
  - 在空行中，从列为 `Type`（类型）列下方的菜单中选择 `CNAME`。\n- 在 `Range`（范围）列下，在头两个字段中输入地址范围的起始和结束数字，例如\
  \ `100` 和 `110`。第三个字段用于输入每一步之间的间隔，应留空。如果你输入 `2`，则范围将变为 `100, 102, 104` 等以此此类推。\n\
  - 在 `Address pattern`（地址模式）字段中，输入 `$`（单个美元符号）。当创建记录时，`$` 将替换为每条记录的数字，反而解析为范围内的 IP\
  \ 地址。\n- 你也可以在 `Hostname pattern`（主机名模式）字段中输入 `$.1.168.192.in-addr.arpa.`，这会让情况更直观，但输入起来较长。\n\
  - 同样，`$` 将替换为每条记录的数字，这将解析为类似 `101.100-110\\.1.168.192.in-addr.arpa.` 的内容。\n- 如果需要，可以在\
  \ `Comment`（注释）字段中输入描述该生成器用途的注释。\n- 点击 `Save` 模块主页并点击 `Apply Changes`。\n\n生成器可以替代本节第一部分指令要求创建的名称别名记录，因此不再需要它们了。请注意，自动生成的替换内容无法通过普通方式查看或编辑，只能通过\
  \ `Record Generators` 页面进行。\n\n### 30.15 使用 BIND 视图\n\n`BIND` 版本 9 引入了视图（views）的概念，视图是某些\
  \ DNS 客户端可见的区域组。视图可用于从互联网中隐藏内部区域、以两种不同的方式展示同一个区域，或停止非本地客户端通过你的服务器解析非托管的域名。每个视图都有一个唯一的名称，以及一个匹配的\
  \ IP 地址和 IP 网络列表，这决定了它对哪些客户端和服务器可见。\n\n当模块检测到你正在运行 `BIND 9` 时，模块中可以使用一些附加功能。你可以创建视图、将区域从一个视图移动到另一个视图，并选择在哪个视图中创建区域。在首页上，每个当前视图都由\
  \ `Existing Client Views`（现有客户端视图）标题下的一个图标表示，每个区域图标都有一个标签指示它所在的视图。\n\n如果存在任何视图，则每个区域必须位于一个视图中。如果没有定义视图，Webmin\
  \ 将允许在视图之外创建区域，因为 `BIND` 不支持此操作。这包括根区域，根区域必须对客户端可用，以便对非本服务器托管域名的 DNS 记录请求能够成功。因此，将根区域放在一个所有客户端可见的视图中通常是有意义的。\n\
  \n向你的 `BIND` 配置中添加新视图的步骤如下：\n\n- 在模块的主页上，点击 `Existing Client Views` 部分中的 `Create\
  \ a new view`（创建新视图）链接。这将带你进入一个输入详情表单。\n- 在 `View name`（视图名称）字段中为视图输入一个短的字母数字名称（例如\
  \ `internal` 或 `everyone`）。每个视图必须有一个唯一的名称。\n- 将 `DNS records class` 字段设置为 `Default`。\n\
  - 如果此视图中的区域对所有人可见，将 `Apply this view to clients`（将此视图应用到客户端）字段设置为 `All clients`（所有客户端）。否则，选择\
  \ `Selected addresses, networks, and ACLs`（选定的地址、网络和 ACL），并在下面的文本框中输入 IP 地址、IP 网络和\
  \ `BIND` ACL 名称列表。只有匹配列表中的项的客户端才能访问该视图。\n- 点击表单底部的 `Create`（创建）按钮。你将返回主页，主页将包含该新视图的图标。\n\
  - 将你希望在此视图中的任何区域移动进去。可以通过点击区域图标，然后点击 `Edit Options`（编辑选项），然后从 `Move to view`（移动到视图）旁边的菜单中选择新视图。\n\
  - 如果这是你的第一个视图，必须将现有区域移动到其中，BIND 才会接受。\n- 完成区域移动后，点击主页上的 `Apply Changes` 按钮。\n\n\
  一旦创建了视图，可以通过点击主页上的图标并更新 `Apply this view to clients` 字段来更改匹配的地址和网络列表。然后点击 `Save`\
  \ 按钮，以及 `Apply Changes` 使新列表生效。\n\n可以通过同一表单上的 `Delete`（删除）按钮删除视图。这将打开确认页面，允许你选择对其包含的区域（如果有）如何处理。可用选项有：\n\
  \n- **Delete totally**（彻底删除）：删除视图中的所有区域及其记录文件。\n- **Move out of views**（移出视图）：将视图中的区域移到顶层。由于上述原因，只有在删除最后一个视图时才使用此选项。\n\
  - **Move to view**（移动到视图）：将区域移动到另一个现有的视图。\n\n当你的系统中定义了一个或多个视图时，你可以在添加新区域时选择使用哪一个。这是通过主、从、正向和根区域创建表单上的\
  \ `Create in view` 字段实现的，允许你从菜单中选择视图。自然地，没有在视图之外创建区域的选项，因为 `BIND` 不允许这样做。\n\n视图的一个常见用途是向内部网络之外的客户端隐藏内部区域。这是向潜在攻击者隐藏你的网络结构及其宿主机的一种良好方法。设置设置的步骤如下：\n\
  \n- 创建一个名为 `internal` 的新视图，匹配内部局域网的客户端。\n- 创建第二个名为 `everyone` 的视图，匹配所有客户端。\n- 将任何仅供内部使用的区域移动到\
  \ `internal` 视图中。互联网域名（如 `example.com`）的区域不能放在此视图中，否则会导致它们对世界其他地方无法访问。\n- 将所有其他区域（包括根区域）移动到\
  \ `everyone` 视图。\n\n\n\n\n将根区域（root zone）移动到 `internal` 视图，这将防止服务器为非本地客户端查找需要连接根服务器的记录。\n\
  \n将所有其他区域移动到 `everyone` 视图。\n\n### 30.16 模块访问控制\n\n与其他模块一样，BIND DNS Server 模块允许你控制哪些功能对特定的\
  \ Webmin 用户或组是可选。这对于赋予人员仅管理其所属区域记录（而不允许他人区域的记录）的权限非常有用。尽管这通常需要对记录文件具有 root 权限，但通过\
  \ Webmin，可以将这些权限授予普通用户，而无需赋予他们 root 登录那样的权限。\n\n一旦你按照第 52 节所述创建了具有该模块访问权限的用户，限制其仅访问某些特定区域的步骤如下：\n\
  \n1. 在 Webmin 用户模块中，点击用户名称旁边的 `BIND DNS Server`。这将打开访问控制选项页面。\n2. 将 `Can edit module\
  \ configuration?`（可以编辑模块配置吗？）字段更改为 `No`，这样用户就不会更改模块用于 `named.conf` 以及其他文件的路径。\n\
  3. 对于 `Domains this user can edit`（此用户可以编辑的域）字段，选择 `Selected zones`（选定的区域），并从右列表中选择你希望让他访问的区域。如果你希望他能够编辑大部分区域，最好选择\
  \ `All except selected`（除选中外的全部），并仅选择你不允许让他管理记录的区域。如果你的 DNS 服务器使用了视图（views），可以使用\
  \ `Zones in view`（视图中的区域）选项来允许或拒绝访问视图中的所有区域。\n4. 将 `Can create master zones?`（可以创建主区域吗？）、Can\
  \ create slave/stub zones?`（可以创建从/存根区域吗？）、Can create forward zones?`（可以创建转发区域吗？）以及\
  \ `Can edit global options?`（可以编辑全局选项吗？）字段更改为 `No`。\n5. 如果你希望用户未访问区域的反向地址记录（Reverse\
  \ Address records）能够通过其访问区域中的地址记录更改而更新，请将 `Can update reverse addresses in any domain?`（可以更新任何域中的反向地址吗？）字段设置为\
  \ `Yes`。尽管从安全角度来看，这可能不是一个好主意，因为他将能够更改系统上几乎任何现有的反向地址记录。出于这个考虑，我建议此字段设置为 `No`。\n6.\
  \ 为了防止用户使用相同的 IP 创建多个一个地址记录，请将 `Can multiple addresses have the same IP?`（多个地址可以具有相同的\
  \ IP 吗？）字段设置为 `No`。虽然创建多个记录并无害，但你可能希望将其设置为 `No` 以防止用户多次分配相同的 IP。\n7. 将 `Read-only\
  \ access mode?`（只读访问模式？）字段设置为 `No`。如果更改为 `Yes`，用户将能够使用该模块查看区域和记录，而不能更改任何内容。这对于创建一种不同的受限用户可能有用，即一种可以看到所有设置但不能编辑的用户。\n\
  8. 将 `Can apply changes?`（可以应用更改吗？）字段设置为 `Yes`，以便他可以使用 `Apply Changes` 按钮使其新增的内容和修改生效。\n\
  9. 除非你允许用户手动编辑其记录文件，否则将 `Can edit records file?`（可以编辑记录文件吗？）字段更改为 `No`。大多数不可信的用户并不聪明足以进行手动编辑。\n\
  10. `Can edit zone parameters?`（可以编辑区域参数吗？）字段决定了用户是否能为其域查看并使用 `Edit Zone Parameters`\
  \ 图标。将其设置为 `Yes` 是相当安全的，因为用户只会通过将参数设置为愚蠢的值来损害他自己的区域。\n11. 同样，`Can edit zone options?`（可以编辑区域选项吗？）字段决定了\
  \ `Edit Zone Options` 图标是否可见。你应该将其设置为 `No`，因为用户可能会通过不当使用区域选项表单在 `named.conf` 中创建语法错误。\n\
  12. 除非你允许用户删除自己的域，否则将 `Can delete zones?`（可以删除区域吗？）字段设置为 `No`。用户如果想删除区域，应该联系主管理员。\n\
  13. `Can edit record generators?`（可以编辑记录生成器吗？）字段可以保持为 `Yes`，因为它仅仅允许一次性创建多个记录。然而，某些用户可能会对此功能感到困惑，因此将该字段更改为\
  \ `No` 可能是一个好主意。\n14. `Can lookup WHOIS information?`（可以查询 WHOIS 信息吗？）和 `Can search\
  \ for free IP numbers?`（可以搜索免费 IP 号吗？）字段也可以保持为 `Yes`，因为这些功能只是向用户显示信息。\n15. 将 `Can\
  \ create and edit views?`（可以创建和编辑视图吗？）字段更改为 `No`，以便用户无法管理 BIND 9 视图。如果允许用户创建区域，你可以使用\
  \ `Views this user can edit`（此用户可以编辑的视图）并添加区域的字段来限制他可以创建区域的范围。\n16. `Can create\
  \ slave zones on remote servers?`（可以在远程服务器上创建从区域吗？）应该设置为 `No`，但这并不重要，因为用户反正不会被允许创建主区域或从区域。\n\
  17. 最后，点击 `Save`（保存）按钮使用户的新限制生效。\n\n### 30.17 配置 BIND DNS Server 模块\n\nBIND 模块有几个选项可以通过点击主页上的\
  \ `Module Config` 链接进行设置。在 `System configuration control`（系统配置控制）下列出的是 Webmin 在你的系统中查找\
  \ BIND 配置文件、PID 文件和程序的地方，它们初始设置为与你的操作系统自带的 BIND 软件包匹配。通常，除非你自己编译并安装了 DNS 服务器软件，否则不需要更改它们。\n\
  \n表 30.1 列出了你可以安全更改的配置选项（在前三个部分）以及与文件位置相关的、通常不需要编辑的选项（在第四部分）。大多数选项只需要那些自定义了 BIND\
  \ 设置或运行大型名称服务器的人进行更改。对于普通网站，默认值就可以良好工作，不需要调整模块配置。\n\n### 30.18 BIND 4 DNS 服务器模块\n\
  \n尽管 BIND 版本 8 已经发布多年，但版本 4 仍被许多人使用，并且甚至在最新的 HP/UX 以及可能的其他操作系统的发布版本中也作为标准包含在内。幸运的是，有一个支持\
  \ BIND 4 的 Webmin 模块，它是在版本 8 发布很久以前编写的。事实上，它是第一个编写的模块，也是整个软件包中其余部分的灵感来源。\n\n####\
  \ 表 30.1 模块配置选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| Chroot directory to run BIND\
  \ under（运行 BIND 的 chroot 目录） | 出于安全考虑，有些人喜欢使用 `chroot` 命令将 BIND 限制在单个目录中运行。如果你正在这样做，除非此选项设置为服务器所限制的目录（例如\
  \ `/home/bind`），否则 Webmin 将对你的配置文件感到困惑。该模块将把所有配置和记录文件路径视为相对于该目录的路径，就像 BIND 这样做。如果你不知道\
  \ `chroot` 是什么或没有使用它，请将此选项设置为 `Default`（默认）。 |\n| User to start BIND as（用于启动 BIND\
  \ 的用户） | 当此字段设置为 `Default` 时，模块将以 `root` 身份启动 BIND。然而，你可以输入不同的用户名（例如 `named`），让它以该\
  \ UNIX 用户身份运行。这可以防止系统被发现 DNS 服务器程序中漏洞的攻击者接管。确保所有区域文件对该用户都是可读的。下方记录的 `Owner for zone\
  \ files`（区域文件的所有者）选项可以帮助。 |\n| Group to start BIND as（用于启动 BIND 的组） | 如果为此字段选择 `Default`，BIND\
  \ 运行的 UNIX 组由 `User to start BIND as` 字段中设置的主组决定。如果你输入一个组名，DNS 服务器将以该组运行。但是，如果上一个字段设置为\
  \ `Default`，那么无论你选择什么都没有区别，因为 BIND 将始终以 `root` 用户和 root 的主组运行。 |\n| Add new zones\
  \ to file（将新区域添加到文件） | 通常情况下，Webmin 将所有新区域添加到 `named.conf` 文件中。如果这不是你系统中的做法，你可以为此字段输入不同的文件名。然而，为了让\
  \ BIND 和 Webmin 识别新区域，`named.conf` 必须包含一个 `include` 指令来读取此文件。 |\n\n\n\n\n\n| 显示区域方式\
  \ | 如果选择了 `Icons`（图标），模块主页将每个每个区域显示为一个图标。然而，如果你选择 `List`（列表），区域将以表格形式显示，这占用的空间更小且更易于阅读。如果你托管了大量域名，这种做法很有意义。\
  \ |\n| 记录的排序方式 | 此字段控制在查看域名中某些类型的记录列表时所使用的默认排序方法。可用选项及其含义如下： |\n| 按名称 | 记录按名称排序；对于\
  \ `Reverse Address`（反向解析）记录，则按 `IP 地址` 排序。`IP` 排序是按照正确的方式进行的，而不是简单的按字母顺序。 |\n| 按值\
  \ | 记录按其取值部分排序。对于 `Address`（地址）记录，这意味着按 `IP 地址` 排序；所有其他类型均按字母顺序排序。 |\n| 按 IP 地址和反向地址\
  \ | 记录按 `IP` 排序，其他类型按 `value` 排序。 |\n| 按添加顺序 | 不进行任何排序；记录将按照它们被添加到文件的顺序显示。 |\n|\
  \ **显示区域的最大数量** | 如果你的服务器托管的区域数量超过此字段设置的数量，它们将不会显示在模块主页上。相反，将显示一个简单的搜索表单用于查找名称包含输入内容的域名。\
  \ |\n| **更新反向解析** | 此字段决定 `Address` 记录创建和编辑表单上 `Update reverse?`（更新反向？）选项的默认设置。通常默认设置为\
  \ `On`（开启），但如果你很少希望 `Webmin` 自动更新反向解析记录，你应该将其默认改为 `Off`（关闭）。此选项也会以相同的方式影响创建和编辑 `Reverse\
  \ Address` 表单上的 `Update forward?` 字段。 |\n| **反向区域必须存在？** | 通常情况下，在不是由此服务器托管的反向区域中添加带有\
  \ `IP address` 的 `Address` 记录没有问题，即使 `Update reverse?` 设置为 `Yes`。但有时你可能希望 `Webmin`\
  \ 在这种情况下生成错误信息，这样你就能知道输入的 `IP address` 是错误的。将此字段设置为 `Yes` 将开启此行为。 |\n| **支持 IPv6\
  \ 地址 DNS** | 如果此字段设置为 `Yes`，模块将允许创建和编辑新类型 `IPv6 Address` 的记录。因为它们只有在你运行 `IPv6` 网络时才有用，所以此选项默认关闭的。在编辑或添加\
  \ `IPv6 Address` 记录时，相应的反向地址记录也将被更新和创建。然而，它们将位于特殊的 `ip6.int` 区域，而不是 `in-addr.arpa`。\
  \ |\n\n### 配置选项\n\n#### 允许为记录注释\n当此字段设置为 `Yes` 时，添加和编辑记录的表单将显示一个额外的 `Comment`（注释）字段。这允许你为记录输入注释，注释将显示在记录列表中。这些对于为主机添加仅对自己可见的额外说明非常有用。\n\
  \n#### 支持 IPv6 地址 DNS（续上）\n如果此字段设置为 `Yes`，模块将允许创建和编辑新类型 `IPv6 Address` 的记录。因为它们只有在你运行\
  \ `IPv6` 网络时才有用，所以此选项默认关闭的。在编辑或添加 `IPv6 Address` 记录时，相应的反向地址记录也将被更新和创建。然而，它们将位于特殊的\
  \ `ip6.int` 区域，而不是 `in-addr.arpa`。\n\n#### 允许为记录注释（续上）\n当此字段设置为 `Yes` 时，添加和编辑记录的表单将显示一个额外的\
  \ `Comment`（注释）字段。这允许你为记录输入注释，注释将显示在记录列表中。这些对于为主机添加仅对自己可见的额外说明非常有用。\n\n#### 允许通配符（不推荐）\n\
  通常，`Webmin` 不在文件名中使用 `*`。如果你因为喜欢使用类似 `example.com.db` 的不同命名格式而更改了此字段，请确保新值包含字符串\
  \ `ZONE`。\n\n#### 允许长主机名\n当此字段设置为 `Yes` 时，`Webmin` 允许长达 255 个字符的主机名。\n\n#### 允许记录中使用下划线？\n\
  通常，`BIND` 不允许在文件名中使用 `_`。如果此字段设置为 `Yes`，则是允许的。\n\n#### 将记录转换为规范形式？\n当此字段设置为 `Yes`\
  \ 时，`Webmin` 将名称转换为规范形式。\n\n#### 按视图分类区域？\n默认情况下，`BIND` 9 将区域显示在其对应的视图（view）下。如果此字段设置为\
  \ `Yes`，区域将按视图进行分类。\n\n#### 序列号样式\n当选择 `Running` 时，`Webmin` 会生成一个从当前 UNIX 时间开始并加\
  \ 1 的序列号。选择 `Date` 则将强制序列号格式为 `YYYYMMDDnn`。\n\n#### 在区域文件顶部添加 $ttl\n如果此字段选择 `Yes`，`Webmin`\
  \ 将在所有新记录文件的顶部添加一行 `$TTL`。\n\n#### 主区域文件目录\n当选择 `Default` 时，`Webmin` 将根据 `named.conf`\
  \ 文件中的 `directory` 行来确定将新区域文件存放在哪个目录中。\n\n#### 从用/存根区域文件目录\n与上一个字段一样，此字段允许你指定一个与默认不同的目录用于新的区域记录文件。\n\
  \n#### 正向区域文件命名格式\n此字段决定 `Webmin` 用于新记录文件的命名格式。文件名中出现的 `ZONE` 将被替换为新正向域名的名称。\n\n\
  #### 反向区域文件命名格式\n此字段的作用与上一个相同，但它用于反向区域文件名而不是正向。\n\n#### 区域文件所有者（用户:组）\n此字段控制新创建记录文件的所有权。它必须以\
  \ `user:group` 格式输入，例如 `named:daemon`。\n\n\n\n\n\n| 区域文件的权限（八进制） | 与上一个字段类似，此字段控制新记录文件的\
  \ UNIX 权限。你必须输入一个类似于 `chmod` 命令所使用的 3 位八进制数字，例如 `755`。 |\n| 从区的默认主服务器（s） | 在添加从区时，输入到此字段的\
  \ IP 地址将默认列在“主服务器服务器（Master servers）”文本框中，并在将其从主区域转换为从区时，它们会被添加到区域配置中。如果你创建了许多从同一主服务器获取记录的从区，这将非常有用。\
  \ |\n| 默认远程从服务器 | 此字段决定了在添加主区域时，默认将从区添加到哪一个 Webmin 服务器上。它仅在运行模块的集群功能时使用，而本章未涵盖这些功能。\
  \ |\n| 自动更新序列号 | 通常此字段被设置为“是”，这会导致模块在区域内的每条记录发生更改时自动更新该区域的序列号。要关闭此行为，请将该字段改为“否”，但是，除非你有某种独立的机制来更新序列号（例如每天运行一次的脚本），否则会导致从服务器和其他\
  \ DNS 服务器的缓存问题。 |\n| 反向 IPv6 地址的域名 | 此字段仅在你使用该模块管理 IPv6 地址和反向地址记录时相关。它决定了使用哪个根域名来处理反向地址，是旧的\
  \ `ip6.int` 还是新的 `ip6.arpa`。如果你的系统中已经存在任何此类区域，你需要在此处做出正确选择，以便模块能够正常运行。 |\n| named.conf\
  \ 文件的完整路径 | 此字段决定了模块在何处查找主 BIND 配置文件 `named.conf`。只有在你自己编译并安装 DNS 服务器软件，并选择使用不同的位置作为配置文件（例如\
  \ `/usr/local/etc/named.conf`）时，你才需要更改它。 |\n| named 可执行文件的完整路径 | 如果你将 BIND 服务器程序安装在非\
  \ Webmin 预期的默认位置，则你需要更改此字段。如果服务器是手动编译并安装的，可能会出现这种情况。 |\n| whois 命令的完整路径 | 模块使用 `whois`\
  \ 命令在用户点击“查找 WHOIS 信息”图标时显示有关域名的所有权信息。此字段必须包含系统上该命令的路径，例如 `/usr/local/bin/whois`。\
  \ |\n| 重新加载区域的命令 | 点击主区域选项页面上的“应用更改”按钮时，将使用此字段设置的命令来信号 BIND 重新读取区域记录文件。默认使用 `nd`\
  \ 命令，它通过套接文件与 BIND 通信。然而，你可能希望使用 `rndc`，它可以通过网络连接通信。 |\n| 默认 PID 文件位置 | 为了确定 BIND\
  \ 是否正在运行，模块会寻找包含其进程 ID 的 PID 文件。通常此文件的路径指定在 `named.conf` 中，但如果没有指定，代码将使用此字段中的路径。如果你自己编译并安装了服务器，可能需要将其更改为\
  \ `/usr/local/var/named.pid` 等其他内容。 |\n| 启动 BIND 的命令 | 如果 Webmin 检测到 BIND 未运行，模块主页上将显示一个按钮以便启动它。如果选择“默认”，将直接运行\
  \ `named` 可执行文件，但也可以使用替代命令。在某些操作系统上，此字段默认设置为启动脚本，如 `/etc/init.d/named start`。如果你自己编译并安装了\
  \ BIND，你应该将其改回“默认”，因为该脚本即使存在，也可能无法正常工作。 |\n\nBIND 4 缺乏版本 8 的许多功能，例如控制谁可以查询和传输记录的区域选项、生成器、正向区域、存根区域、更改以及许多全局选项。然而，它仍然可以执行托管正向和反向主、从区域的基本任务。\n\
  \n版本 4 使用 `/etc/named.boot` 作为其主配置文件，其格式与版本 8 和 9 完全不同。尽管如此，区域记录文件仍然采用相同的格式，这使得在必要时可以容易地升级到最新版本的\
  \ BIND。支持的记录类型是相同的，但位置（Location）和 IPv6 地址类型除外。\n\n由于 BIND 4 如今很少见，只有当你的系统中存在 `named.boot`\
  \ 文件时，它的图标才会出现在“服务器（Servers）”类别下。进入后后，主页仅显示一个区域图标表格、一个设置新区域默认值的表单以及一个用于启动服务器或应用更改的按钮。\n\
  \n添加主区域的表单与 BIND DNS 服务器模块中的几乎相同，区别在于不支持区域模板。从区的创建表单也是相同的，只是多了一个很少使用的服务器端口（Server\
  \ port）字段。在主区域中编辑记录的过程相同，反向区域的自动更新按正常方式工作。不过，你永远无法查看从区中的记录。\n\n来自 SOA 记录的主区域参数可以使用区域记录类型列表下方的表单进行编辑，这与\
  \ BIND 8 模块中“区域参数”页面上的表单完全相同。这些你可以为主区域编辑的唯一参数，因为 BIND 版本 4 不支持任何其他关联选项。在编辑从区时，只能更改主服务器列表和记录文件名。\n\
  \n删除主区域或从区的过程在 BIND 4 DNS 服务器模块中是相同的，并且支持删除其他区域中的反向或正向记录。然而，你无法查看或删除根区域，尽管它存在于配置文件中，但模块从不显示它的图标。\n\
  \n### 30.19 总结\n\n本章介绍了域名命名系统（DNS），并解释了 DNS 客户端和服务器的角色。它还介绍了流行的 BIND 服务器，并描述了如何使用\
  \ Webmin 来配置它。本章涵盖了各种类型域的创建、主域内记录的管理，以及高级 DNS 功能的使用（如记录生成器和部分反向委托）。阅读完后，你应该掌握了设置系统作为\
  \ DNS 服务器所需的所有知识。\n\n## 第 31 章 CVS 服务器配置\n\n如果你已经在系统中拥有 CVS 仓库，本章将解释如何通过设置网络可访问的\
  \ CVS 服务器来使其对其他主机可用。\n\n### 31.1 CVS 简介\n\nCVS 代表并发版本系统（Concurrent Versions System），是一组程序，允许多个开发者在同一份源代码上工作而互不干扰。本章假设你已经熟悉\
  \ CVS 的工作原理，并想知道如何设置一个允许通过网络访问仓库的服务器。服务器允许人们将代码检出到个人计算机上处理，然后通过网络重新提交。\n\n实际上有几种方法可以使仓库网络可访问，例如通过\
  \ SSH 或 RSH。Webmin 支持的方法是从像 inetd 或 xinetd 这样的超级服务器以 pserver 模式运行 CVS。并没有一个像 Apache\
  \ 或 NFS 守护进程那样始终在后台运行的实际独立 CVS 服务器进程。相反，只有当客户端 CVS 程序连接到它时，由 inetd 才会运行 CVS 程序。\n\
  \n为了控制谁可以访问文件，CVS 服务器使用用户名和密码身份验证。提供的登录信息可以与系统 UNIX 用户列表或单独的用户名和密码文件进行比对。可以赋予用户仓库的完全读写权限，或只读权限以防止他们提交文件。\n\
  \n### 31.2 CVS 服务器模块\n\n\n\n\n\n此模块可以在 Webmin 的“服务器”（Servers）类别下找到。进入该模块后，主页将显示如图\
  \ 31.1 所示的图标列表。几乎所有配置服务器的实际表单和页面都可以点击图标进入。\n\n### 图 31.1.CVS 服务器模块。\n\n![](img/31fig01.jpg)\n\
  \n如果系统中未找到 CVS 仓库，主页将显示一条错误消息。默认情况下，Webmin 在 `/usr/local/cvsroot` 中查找，但在大多数系统中这不太可能是正确的。要更改路径，请点击\
  \ `Module Config`（模块配置）并更新 CVS root directory（CVS 根目录）字段。\n\n如果系统中未找到 `cvs` 命令，或者无法确定其版本号，模块的主页也可能显示错误消息。如果命令不在\
  \ Webmin 的搜索路径中，您需要调整模块配置页面上的 `Path to CVS executable`（C 可执行文件路径）字段。\n\n### 31.3\
  \ 设置 CVS 服务器\n\n如果系统中尚未设置 CVS 服务器，模块主页底部将显示一个标记为 `Setup CVS Server`（设置 CVS 服务器）的按钮。点击后，将在\
  \ `inetd` 或 `xinetd` 配置（第 15 章介绍）中添加条目，以便在标准 端口 2401 上运行服务器程序 `cvs pserver`。当前的\
  \ CVS 根目录将作为参数传递给此命令，因此在点击按钮之前确保其设置正确。现在客户端应该能够连接到仓库了，如第 31.4 节“使用 CVS 服务器”所示。\n\
  \n服务器始终设置为作为名为 `cvspserver` 的服务运行，以 root 运行且没有 IP 访问控制限制。如果您使用 `xinetd`，可以使用 `Extended\
  \ Internet Services`（扩展互联网服务）模块限制对服务的访问。由于大多数仓库只需要允许公司网络上的 CVS 客户端访问，这通常是一个好主意。如果您使用\
  \ `inetd`，也可以通过 TCP wrappers 控制对服务的访问，但必须手动进行。\n\n当服务器激活状态时，该按钮将被标记为 `Deactivate\
  \ CVS Server`（禁用 CVS 服务器）的按钮取代。如果点击，`inetd` 或 `xinetd` 配置中的相应条目将被禁用，客户端将无法再次连接。要重新启用，请点击主页上出现的\
  \ `Activate CVS Server`（激活 CVS 服务器）按钮。\n\n如果您同时安装了 `xinetd` 和 `inetd`，则在首次设置服务器时使用前者。在设置、激活或禁用服务器时，模块将自动通知\
  \ `inetd` 或 `xinetd` 重新读取其配置文件，因此无需在相应的模块中点击 `Apply Changes`（应用更改）按钮。\n\n### 31.4\
  \ 使用 CVS 服务器\n\n一旦服务器运行，CVS 客户端可以使用类似 `:pserver:username@hostname:repository*` 的仓库路径连接。自然地，`username`\
  \ 必须替换为 CVS 服务器接受的用户名，`hostname` 替换为您的系统主机名，`repository` 替换为正确的仓库目录。\n\n要检出一个目录，您可以运行如下命令：\n\
  \n```\nCVSROOT=:pserver:jcameron@fudu.webmin.com:/usr/local/cvsroot evenexport CVSROOT\n\
  cvs login\ncvs checkout path/to/directory\n```\n\n`cvs login` 命令仅在服务器对用户名需要密码时运行。它将提示您输入密码，该密码将永久存储在文件\
  \ `~/.cvspass` 中，供以后其他 CVS 命令使用。每当运行 `cvs` 命令更新、检出、提交或任何方式访问仓库时，它都会连接到 `CVSROOT`\
  \ 环境变量指定的服务器，并使用变量中的用户名和指定的密码登录。\n\n### 31.5 添加和编辑用户\n\nCVS 服务器要求所有客户端在对仓库执行任何操作之前提供有效的用户名和密码。用户将针对仅供服务器使用的帐户列表，以及可选地针对来自\
  \ `/etc/passwd` 和 `/etc/shadow` 文件的标准 UNIX 用户数据库进行验证。仅使用服务器用户列表进行验证是最佳选项，因为它让您对谁被允许连接有更多控制。有关开启或关闭\
  \ UNIX 认证的更多信息，请参见第 31.7 节“配置 CVS 服务器”中 `Check users against system password file?`（针对系统密码文件检查用户？）字段的文档。\n\
  \n对于每个 CVS 用户，您可以指定一个 UNIX 用户名，其权限将用于所有文件访问。如果仓库中的所有文件都由用户用户，这将非常有用，在这种情况下，所有 CVS\
  \ 访问应以该用户的身份进行。这避免了确保仓库中的文件权限设置正确以便人们编辑和读取彼此的文件的问题。\n\n要向 CVS 用户列表添加新登录用户，请遵循以下步骤：\n\
  \n在模块主页上，点击 `CVS Users` 图标。这将带您进入包含所有现有用户表格的页面，如图 31.2 所示。\n\n### 图 31.2.CVS 用户列表。\n\
  \n![](img/31fig02.jpg)\n\n点击表格上方的 `Add a new CVS user`（添加新 CVS 用户）链接进入用户创建表单。\n\n\
  在 `Login username` 字段中为用户输入唯一名称。必须已经存在同名的 UNIX 用户。如果没有，则必须设置 `Access files as UNIX\
  \ user` 字段。\n\n`Login password` 字段用于输入用户密码。可用选项有：\n\n- `None required`（不需要）：如果选择此项，当客户端以此用户身份连接时，CVS\
  \ 服务器将接受任何密码或不需要密码。\n- `Copy from UNIX`（从 UNIX 复制）：如果选择，用户的密码初始设置为与同名 UNIX 用户的密码。\n\
  - `Set to`（设置为）：如果选择，您必须在旁边的字段中为用户输入密码。\n\n`Access files as UNIX user`（以 UNIX 用户访问文件）字段控制当此\
  \ CVS 用户连接时 CVS 服务器切换到哪个 UNIX 用户。如果选择 `Same as username`，将使用同名的 UNIX 用户。然而，如果选择另一个选项，则必须在相邻字段中输入\
  \ UNIX 用户名以作为替代身份访问文件。\n\n点击 `Create`（创建）按钮将用户添加到服务器列表中。您将返回用户表格，表格中应包含您的新条目。如果您选择以不同的\
  \ UNIX 用户访问文件，该名称将显示在 CVS 登录名旁括号中。\n\n一旦创建了用户，可以通过点击 CVS 用户页面上表格中的其名称来编辑它。编辑表单与用于创建用户的表单相同，区别是\
  \ `Login password` 字段中的 `Copy from UNIX` 选项替换为 `Leave unchanged`（保持不变），如果您不更改密码，则必须选择此项。完成用户编辑后，点击\
  \ `Save`（保存）按钮。或者若要删除用户，请点击编辑表单上的 `Delete`（删除）。\n\n此页面还可以用于设置 CVS 用户列表与 UNIX 用户数据库之间的同步。这对于保持密码同步或在删除相应的\
  \ UNIX 用户时删除 CVS 用户很有用。第 4 章更详细地解释了 Webmin 中用户同步的工作原理，但请按照以下步骤为此模块进行设置：\n\n在主页上，点击\
  \ `CVS Users` 图标，然后滚动到现有用户列表下方的表单。\n\n为了在 Webmin 中为每个 UNIX 用户创建一个新的 CVS 用户，请勾选 `Add\
  \ a new CVS user when a UNIX user is added` 复选框。下方是一个标记 `Access files as UNIX user`\
  \ 的字段，可以使用它为自动创建的 CVS 用户设置 UNIX 访问用户。\n\n当所有用户都作为单个 UNIX 用户访问仓库文件时，此选项最有用。否则，您可以直接允许所有\
  \ UNIX 用户登录您的 CVS 服务器。\n\n要在更新相应的 UNIX 用户时更改 CVS 用户的密码或用户名，请勾选 `Update a CVS user\
  \ when the matching UNIX user is modified` 复选框。\n\n\n\n\n\n当同名的 UNIX 用户被删除时同步删除相应的\
  \ CVS 用户，请勾选 `Delete a CVS user when the matching UNIX user is deleted` 复选框。\n\n\
  点击 `Save` 按钮保存新的同步设置。从现在起，这些设置将应用于 `Users and Groups` 模块中创建、编辑和删除的用户。\n\n### 31.6\
  \ 限制用户访问\n\n本节解释了如何配置 CVS 服务器以限制哪些用户被允许写入存储库。如果你想让互联网上的任何人都能访问你的源代码，此功能非常有用。例如，当你在托管一个开源项目时。你可以为世界上任何人创建一个没有密码但只有只读权限的用户以供其登录，而开发者则使用受密码保护且具有完全读写权限的账户登录。\n\
  \n要限制对服务器的写入访问，请按照以下步骤操作：\n\n在模块的主页上，点击 `User Access Control` 图标。这将带你进入列出当前具有读写权限用户的表单。\n\
  \n若要仅给少数用户提供只读权限而给其他用户提供读写权限，请选择 `Listed users are read-only` 单选按钮。然后，在提供的左侧文本框中输入那些不应能写入存储库的用户名称。在右侧，应选择\
  \ `All users can write` 。\n\n或者，若要给少数用户提供读写权限而给其他人提供只读权限，请选择 `Only listed users\
  \ can write`。然后，在右侧文本框中输入那些能够写入 CVS 存储库的用户名称。在左侧，应选择 `No read-only users`。\n\n在两个框中都输入用户名没有太大意义，因为任何同时出现在两个列表的用户都将获得只读权限。\n\
  \n点击 `Save` 按钮使你的更改立即生效并返回模块主页。\n\n### 31.7 配置 CVS 服务器\n\n针对 CVS 服务器可以设置几个与身份验证和日志相关的选项。在大多数情况下，默认设置可以正常工作，但你可以通过以下步骤来更改它们：\n\
  \n在模块的主页上，点击 `Server Configuration` 图标进入编辑服务器选项的表单。\n\n要允许任何 UNIX 用户登录服务器，请将 `Check\
  \ users against system password file?` 字段设置为 `Yes`。如果选择了 `No`，则只有在 CVS 用户页面上定义的用户才能访问存储库。\n\
  \n`Event types to log in history` 字段控制记录到 `CVSROOT/history` 文件中的客户端活动类型。你可以选择 `All\
  \ types` 记录所有内容，或选择 `Selected types` 记录下方勾选的事件类型。\n\n要更改 CVS 存放锁文件的目录，请编辑 `Lock\
  \ files directory` 字段。如果你有无法写入存储库的只读用户，则这是必要的，因为当选择 `Default` 时，锁文件将在存储库内部创建。\n\n\
  点击 `Save` 按钮让服务器开始使用新设置。\n\n### 31.8 浏览存储库\n\nCVS Server 模块的一个方便功能是查看存储库中的文件和目录。你可以通过点击模块主页上的\
  \ `Browse Repository` 图标来实现，这将带你进入列出存储库根目录内容的页面。点击文件名可以查看文件的修改列表，点击 `Rev` 列下的数字可以显示最新提交的版本。\n\
  \n可以通过点击列标题（如 `Age` 或 `Author`）来对列表进行排序。在列表下方有一个标记为 `Show only files with tag` 的菜单，用于限制列表为标记了所选名称的文件。标签通常用于标识项目的分支、版本或来自特定来源的代码。\n\
  \n### 31.9 配置 CVS 服务器模块\n\n此模块有几个设置可以通过点击主页上的 `Module Config` 链接进行更改。你可以安全编辑的内容显示在表\
  \ 31.1 中。\n\n#### 表 31.1 模块配置选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| CVS root directory\
  \ | 必须设置为包含 CVS 存储库的目录。模块将检查是否存在 `CVSROOT` 子目录，如果未找到，将在主页上显示错误。目前还没有指定多个根目录的方法，尽管\
  \ CVS 服务器可以手动配置以支持它们。 |\n| Repository browser header file | 此字段可用于指定一个包含 HTML 的文件，并将显示在存储库浏览器的每个页面顶部。默认文件\
  \ `header.html` 包含有关浏览器脚本作者的信息。你可能希望输入其他文件的完整路径，也许包含有关你 CVS 服务器上文件的信息。 |\n| Character\
  \ set for repository file | 正常情况下，Webmin 根据当前选择的语言为每个页面选择字符集。此信息会发送到浏览器，浏览器使用它来确定页面文本的编码以及显示它的字体。然而，在浏览存储库时这可能并不合适，因为你的源代码可能仅使用\
  \ `us-ascii` 或 `iso-8859-1` 字符集。当 Webmin 使用不同的语言时如果页面显示不正常，可以使用此字段指定在浏览器页面上使用的替代字符集。大多数人只需将其设置为\
  \ `From Webmin language`。 |\n\n### 31.10 总结\n\n如果你的系统托管了 CVS 存储库，可以使用本章中的指令使其中包含的文件对其他主机可用。阅读后，你理应理解如何创建和编辑\
  \ CVS 用户，如何限制某些用户的操作，以及如何浏览存储库中包含的文件。\n\n## 第 32 章 DHCP 服务器配置\n\n本章将介绍什么是 DHCP，以及如何使用\
  \ Webmin 在你的网络上设置 DHCP 服务器，以便其他系统能够自动获取 IP 地址。\n\n### 32.1 动态主机配置协议简介\n\nDHCP 是一种允许主机在局域网上请求并分配\
  \ IP 地址的协议。它用于简化 IP 分配过程，因为单个服务器可以管理多个客户端的地址。对于笔记本电脑等在多个网络之间移动的系统也非常有用，因为它们不需要为连接的每个\
  \ LAN 重新配置。\n\nDHCP 通常用于以太网网络，尽管它也可以用于任何支持广播流量的局域网，如 `802.11b` 和 `Tolken Ring`。它不用于拨号连接的地址分配，`PPP`\
  \ 协议有自己的方法告知客户端其 IP 地址。由于路由器通常不转发广播，因此 DHCP 服务器只能为单个 LAN 主机分配地址，除非你配置了可以转发 DHCP\
  \ 数据包的路由器。\n\nDHCP 服务器除了 IP 地址外，还可以向客户端提供其他信息。可以发送 DNS 服务器的地址和网络网关，以及 `DNS domain`、`NIS\
  \ server`、`NIS domain`、`static routes` 等更多信息。DNS 和路由信息允许客户端完全集成到所连接的网络中，而无需任何手动配置。\n\
  \n当服务器向客户端分配 IP 时，客户端将获得该地址一段时间的租约，在此期间其他客户端都不会被分配相同的地址。当租约过期后，客户端必须再次联系服务器。通常它将获得与之前相同的\
  \ IP 地址，租约将延长相同的时间。如果客户端在租约到期时未联系服务器，服务器假设客户端已关闭，并将该地址标记为可分配给其他主机。\n\n\n\n\n\n大多数操作系统都包含支持配置网络接口使用\
  \ `DHCP` 来获取其 IP 地址的功能。第 16 章解释了如何在 Linux 系统上进行设置，配置 Windows 和 MacOS 客户端同样使用它也相对简单。`DHCP`\
  \ 已经成为 IP 网络上地址分配的标准协议，取代了某些 UNIX 操作系统使用的旧版 BOOTP 协议。\n\n### ISC DHCP 服务器\n\nUNIX\
  \ 系统最常用的 DHCP 服务器是 ISC 服务器，它发布了多个版本。最新的是版本 3，但版本 2 仍在在使用。版本 1 使用的配置文件格式与后续版本非常不同，现在已不再常见。`ISC`\
  \ DHCP 服务器支持广泛的选项，并可以配置为不同的客户端、网络和地址范围执行不同的行为。\n\nISC 服务器可用于为主机分配固定地址或特定范围的地址。每个主机都通过其\
  \ MAC 地址识别，在以太网 LAN 中，MAC 地址就是主机以太网卡的地址。静态 IP 地址和其他选项可以与特定的硬件关联，这允许您为某些系统固定地址，同时对其他系统使用动态分配。\n\
  \n服务器的配置文件包含四种类型的条目，这些条目包含不同客户端的选项：\n\n- **Subnet（子网）**：子网是一个整个 IP 网络，例如 `192.168.1.0`。此类条目用于在网络内为客户端在特定范围内动态分配地址。\n\
  - **Shared network（共享网络）**：共享网络是共享相同物理网络的子网组。\n- **Host（主机）**：这是一个通过 MAC 地址识别的单个客户端主机，并分配了固定\
  \ IP 地址。\n- **Group（组）**：这是一组主机，可以为它们设置相同的选项。\n\n服务器配置中的条目按层级排列，这决定了哪些客户端选项和其他设置适用于特定客户端。高级条目中的选项会被层级结构中较低的条目覆盖，这允许管理员在避免重复配置信息的同时，仍为特定主机设置单独的选项。图\
  \ 32.1 显示了可以在其他类型下定义哪些种的条目。\n\n#### 图 32.1. DHCP 服务器配置层级。\n\n![](img/32fig01.gif)\n\
  \nISC DHCP 服务器的主配置文件名为 `dhcpd.conf`，通常可以在 `/etc` 目录下找到。主文件可以包含其他配置文件，但在大多数系统中只使用\
  \ `dhcpd.conf`。服务器使用的另一个文件是 `dhcpd.leases`，它包含了所有已授予的租约并始终更新。每当服务器启动时，它都会重新读取此文件以查找当前活跃租约。这意味着如果服务器停止并重启，租约信息没有丢失风险，而重启对于服务器重新读取主配置文件是必要的。\n\
  \n当您通过 Webmin DHCP 服务器模块管理子网、主机、组和租约时，直接更新配置和租约文件。为了激活当前配置，它会杀死服务器进程并重新运行它，因为没有办法信号服务器重新读取其配置文件。\n\
  \n### DHCP 服务器模块\n\n此模块可用于将您的系统设置为 DHCP 服务器，以便您的局域网上的客户端可以自动分配 IP 地址、DNS 服务器和其他信息。如果您的网络上已经有一个服务器，再设置一个将是一个坏主意，因为它们可能会相互干扰。如果您只是想配置您的系统通过\
  \ DHCP 获取自己的 IP 地址，则无需设置服务器。相反，请参见第 16.3 节“添加网络接口”。\n\n可以在 Webmin 的“服务器（Servers）”类别下找到\
  \ DHCP 服务器模块。点击其图标将带您进入主页，主页列出了所有现子网、共享网络、主机和组配置。图 32.2 显示了一个示例。然而，如果您是第一次使用该模块，且没有手动配置服务器，那么该页面可能几乎是空的。\n\
  \n#### 图 32.2. DHCP 服务器模块。\n\n![](img/32fig02.jpg)\n\n页面底部有用于编辑全局设置和显示当前动态地址租约的按钮。下方是“启动服务器（Start\
  \ Server）”或“应用更改（Apply Changes）”按钮，如果服务器未运行，则启动服务器；如果它正在运行，则重启它以强制重新加载配置。然而，在定义至少一个有效子网之前，您无法启动服务器。\n\
  \n如果您的系统中没有安装 ISC DHCP 服务器，主页将显示一条错误消息，通知您找不到 `dhcpd` 程序。所有 Linux 发行版在其 CD 或网站上都包含一个\
  \ DHCP 服务器包，您在在使用该模块之前需要安装它。请确保您添加的包名为 `dhcpd` 或 `dhcp-server`，因为通常有一个单独的 DHCP 客户端程序包。\n\
  \n如果服务器已安装但位置不在模块预期的位置，也会出现相同的错误。这可能发生在您从源代码自行编译并安装它，而不是使用发行版的标准包。如果是这样，您将需要调整第\
  \ 32.11 节“配置 DHCP 服务器模块”中解释的一些路径。\n\n由于此模块仅支持 ISC DHCP 服务器版本 2 和 3 的配置，如果检测到安装了版本\
  \ 1 的服务器，主页也将显示错误消息。遗憾的是，这个旧版本使用完全不同的配置文件格式，因此无法由模块管理。某些操作系统（如 Solaris）默认包含此旧版本，但可以被最新版本替换。\n\
  \n除了 Linux，ISC DHCP 服务器还适用于其他几个 UNIX 系统。由于它在所有系统上的工作方式相同，此模块的行为也是相同的。唯一的区别在于它用于服务器配置文件和程序的默认路径。\n\
  \n在某些操作系统和 Linux 发行版中，DHCP 服务器包包含一个定义了多个主机和子网的示例配置文件。这些对您的网络可能没有太大帮助，并且由于它们与实际网络接口不匹配，可能会阻止服务器正常工作。出于此原因，最好在设置自己的配置之前简单地删除它们。\n\
  \n一旦在服务器配置中添加了几个条目，主页将在“子网和共享网络（Subnets and Shared Networks）”标题下显示图标网络表格。每个图标代表一个子网（下方显示其网络地址）或一个共享网络（显示其名称）。默认情况下，子网首先列出，然后是共享网络，两个列表按照它们在配置文件中出现的顺序排列。如果您有复杂的\
  \ DHCP 配置，可以通过点击“显示网络和子网（Display nets and subnets）”旁边的以下链接之一来更改：\n\n- **分配（Assignment）**：默认排序模式。子网显示在共享网络之前，两者都按照它们在配置文件中出现的顺序列出。\n\
  - **文件结构（File structure）**：子网列在它们所属的共享网络之后，共享网络按其在配置文件中的顺序排序。\n- **名称/IP 地址（Name/IP\
  \ address）**：子网按 IP 地址排序列出，随后是按名称排序的共享网络。\n\n页面底部部分是带有“主机和主机组（Hosts and Host Groups）”标题的图标表格。每个主机或主机组都有一个图标，在其下方显示名称或成员数量。由于许多服务器有大量主机，您可以通过点击“显示主机和组（Display\
  \ hosts and groups）”旁边的以下链接之一来控制它们的显示顺序：\n\n\n\n\n\n分配主机（Assignment Hosts）列在组之前，且两者都按照它们在配置文件中出现的顺序排列。\n\
  \n文件结构（File structure）主机列在其所属的组之后，这些组按照它们在配置文件中的顺序进行排序。\n\n名称主机（Name Hosts）按名称排序列，随后是按照在配置文件中出现的顺序的组。\n\
  \n硬件地址主机（Hardware address Hosts）按 MAC 地址排序列，随后是所有组。\n\nIP 地址主机（IP address Hosts）按固定\
  \ IP 地址排序列，随后是所有组。\n\n模块将记住排序模式的更改，因此从现在起，你每次访问主页时都将使用这些设置。\n\n### 32.4 添加和编辑子网\n\
  \n在最简单的 DHCP 服务器配置中，你只需要一个子网条目即可为单个局域网（LAN）上的客户端分配特定范围内的 IP 地址。服务器允许你执行更多操作，但对于许多网络来说，这已经足够了。当然，除非你想为某些主机分配固定地址，或者在同一个局域网上运行多个\
  \ IP 网络。\n\n要添加新的子网条目，请遵循以下步骤：\n\n在模块的主页上，点击 `Subnets and Shared Networks` 部分中的\
  \ `Add a new subnet` 链接。这将带你进入图 32.3 所示的页面。\n\n#### 图 32.3 子网创建表。\n\n![](img/32fig03.jpg)\n\
  \n在 `Network address` 字段中，输入本地局域网的地址，例如 `192.168.1.0`。这必须是你的系统直接连接的网络。\n\n在 `Netmask`\
  \ 字段中，输入本地局域网的掩码，例如 `255.255.255.0`。找到正确网络地址和网络掩码的最佳方法是使用 `Network Configuration`\
  \ 模块查看你的 `Ethernet` 接口设置。\n\n`Address ranges` 部分实际上是一个输入多个范围的表格，但一次只显示一个空行。在第一个字段中，输入分配给客户端的\
  \ IP 范围的起始地址，例如 `192.168.1.100`。在第二个字段中，输入范围的结束地址，例如 `192.168.1.150`。两个地址都必须在网络范围内，且第一个地址必须小于第二个地址。\n\
  \n要添加多个一个范围，你需要在保存后重新编辑此子网，以便在表中出现新的空行。服务器将始终从第一个范围的开始一直到结束分配地址，然后继续到第二个及任何随后的范围。由于每个客户端必须有一个唯一的\
  \ IP，请确保你的范围足够大，以支持任何时刻可能连接到网络的所有客户端主机。\n\n如果你想让此子网成为共享网络（shared network）的一部分（详见第\
  \ 32.8 节“添加和编辑共享网络”），请从 `Shared network` 菜单中选择它。否则，选择 `<None>` 以在任何共享网络之外创建子网。\n\
  \n要设置此网络上客户端的租期长度，请将 `Default lease time` 从 `Default` 改为秒数（在旁边的字段中输入该数字）。这将未显式请求租期的主机租期长度。\n\
  \n你还应该设置 `Maximum lease time` 字段，以便客户端无法请求超过指定秒数的租期。如果不设置，则租期长度将没有上限。\n\n除非你局域网上的客户端系统将从另一个服务器进行网络启动，否则\
  \ `Boot filename` 和 `Boot file server` 字段可以留为 `Default`。只有无盘工作站需要这样操作。\n\n`Server\
  \ name` 字段用于输入你 DHCP 服务器系统的网络主机名。通常这可以留为 `Default`，在这种情况下，服务器将自动计算。\n\n点击页面底部的 `Create`\
  \ 按钮。服务器配置将添加一个子网的新条目，然后你将返回到模块的主页。\n\n点击该子网的新图标，这将带你进入一个与创建页面几乎相同的编辑表单。\n\n点击 `Edit\
  \ Client Options` 按钮进入列出发送给客户端信息的页面，如图 32.4 所示。所有字段都有一个 `Default` 单选按钮，如果选中它，通常表示不会向客户端发送与该选项相关的信息。\n\
  \n#### 图 32.4 子网客户端选项页面。\n\n![](img/32fig04.jpg)\n\n在 `Default routers` 字段中填充你网络上默认网关的\
  \ IP 地址，例如 `192.168.1.1`。这将用于由 DHCP 分配地址的客户端，与网络外的系统进行通信。\n\n在 `Subnet mask` 字段中填充你的网络掩码，例如\
  \ `255.255.255.0`。\n\n在 `Broadcast address` 字段中输入你的网络广播地址，例如 `192.168.1.255`。\n\n\
  在 `Domain name` 字段中填充 DNS 域名，例如 `example.com`，客户端应将其附加到部分主机名之后。\n\n在 `DNS servers`\
  \ 字段中，输入客户端可以使用 DNS 服务器 IP 地址列表，例如 `192.168.1.104 1.2.3.4`。\n\n如果你正在运行 `NIS`（第 17\
  \ 节介绍）并希望客户端在启动时连接到 `NIS` 服务器，请在 `NIS domain` 字段填充你的 `NIS domain` 名称，并在 `NIS servers`\
  \ 字段填充你的 `NIS` 主服务器或从服务器的 IP 地址。只有当客户端主机能够从 DHCP 获取其 `NIS` 设置时这才有用。\n\n如果你有 Windows\
  \ 客户端并且正在运行 `Samba` 或 `Windows` 服务器，请在 `NetBIOS name servers` 字段填充可以为客户端进行 `NetBIOS`\
  \ 名称解析的系统 IP 地址。任何运行 `Samba` 的 `UNIX` 系统都能胜任此角色。\n\n点击页面底部的 `Save` 按钮返回子网表单。\n\n\
  如果这是第一个子网，你需要确保服务器已配置为你的系统使用正确的网络接口。返回模块主页，点击页面底部的 `Edit Network Interface` 按钮。\n\
  \n然后，从 `Listen on interfaces` 列表中选择新子网的接口并点击 `Save`。如果你有多个网络接口并为每个接口创建了子网配置，则必须选择所有接口服务器才能正常工作。\n\
  \n如果你运行的是第 3 版的 `ISC DHCP server`（主页所示）且这是你的第一个子网，你可能在启动服务器之前需要设置 `DDNS update style`。即使你没有使用\
  \ `DDNS`，某些版本也要求配置文件中存在该条目。点击主页上的 `Edit Client Options` 按钮并滚动到 `Dynamic DNS update\
  \ style` 字段。选择 `None` 并点击 `Save` 返回模块索引。\n\n回到主页，点击 `Start Server` 或 `Apply Changes`\
  \ 按钮。如果发生错误，将显示 DHCP 服务器生成的错误信息。\n\n\n\n\n可以使用编辑表单上的 `Delete` 按钮删除子网。它所包含的任何主机、组或地址池都将被一同删除，因此请小心。删除后，使用网络接口页面取消选择该子网的接口。如果不这样做，在点击\
  \ `Apply Changes` 时 DHCP 服务器将显示错误信息，必须执行此操作才能使删除生效。\n\n如果子网包含任何主机或组，点击 `Delete`\
  \ 时将显示确认页面，列出所有将被删除的组和主机。只有点击 `Yes` 按钮后，子网（及其包含的所有内容）才会被实际删除。\n\n在共享网络内部创建子网另一种方法是点击共享网络页面上的\
  \ `Add a new subnet` 连接。这将显示与图 32.3 相同的子网创建表单，但没有 `Shared network` 字段。相反，共享网络显示在页面顶部标题下方。其余创建过程完全相同。\n\
  \n对于您想要分配地址的每个 IP 网络，必须创建一个子网配置条目。通常，对于每个通过以太网、令牌环网或 802.11b 网卡连接到系统的 LAN，都会有一个条目。如果两个\
  \ IP 网络实际上位于同一个 LAN 上，那么它们的子网都必须位于一个共享网络内部，如第 32.8 节“添加和编辑共享网络”所解释。\n\n您还必须确保连接到\
  \ DHCP 服务器分配地址的网络的每个网络接口都已在网络接口页面被选中。如果不是，在服务器启动或应用更改时将报告错误。对于大多数系统管理员来说，这不是一个大问题，因为他们的组织通常只有一个\
  \ LAN。\n\n### 32.5 查看和删除租约（Leases）\n\n每当 DHCP 服务器向客户端提供动态地址时，它都会在租约文件中记录有关分配的信息。分配给特定主机的固定地址（在第\
  \ 32.8 节“添加和编辑共享网络”中介绍）不会触发租约的，因为它们被认为是永久性的。可以使用可以使用模块查看所有当前租约或过期的租约，并删除存在的租约。删除租约告诉服务器该\
  \ IP 地址不再被使用，可以分配给其他客户端。这应该只在客户端确实不再使用该地址时进行，例如当它在持有长时间租约时崩溃了。\n\n要查看和删除租约，请遵循以下步骤：\n\
  \n- 在模块的主页面上，点击 `List Active Leases` 按钮。这将显示一个所有当前活动租约的表格，显示每个租约的 IP 地址、客户端名称和开始时间。\n\
  - 要显示已过期的租约，点击页面底部的 `List all active and expired leases` 按钮。\n- 要删除租约，点击列表中的 IP\
  \ 地址。DHCP 服务器将自动停止并重启以使删除生效。\n\n通过点击子网编辑表单上的 `List Leases` 按钮，也可以查看单个子网的客户端租约。如果您的系统连接了多个网络且有大量客户端，并且想限制租约显示的大小，这种方法将非常有用。\n\
  \n### 32.6 编辑全局客户端选项\n\n第 32.8 节“添加和编辑共享网络”解释了如何设置提供给子网中所有客户端的选项（例如 DNS 和网关 IP 地址）。然而，如果您有多个网络或许多固定主机，设置适用于服务器所有客户端的选项可能会更方便。如果您愿意，这些选项仍然可以针对单个子网、主机和组进行覆盖。\n\
  \n要编辑全局客户端选项，请遵循以下步骤：\n\n- 点击模块主页面底部附近的 `Edit Client Options`。这将引导您进入一个与图 32.4 显示的表单。\n\
  - 根据第 32.4 节“添加和编辑子网”中步骤 11 到 18 的说明更改任何字段。\n- 表单底部有用于设置所有客户端的默认和最大租约时间的字段，以及其他一些选项。这些字段与子网创建页面上同名的字段具有相同的含义。\n\
  - 点击 `Save` 按钮更新 DHCP 服务器配置文件并返回模块主页面。\n- 点击 `Apply Changes` 按钮使您的新设置生效。\n\n为子网指定的客户端选项将覆盖全局定义的选项，而这些选项又会被子网内主机的选项覆盖。\n\
  \n### 32.7 添加和编辑固定主机\n\n如果您想固定分配给特定主机的 IP 地址，将需要向 DHCP 服务器配置添加一个主机条目。这还允许您设置仅适用于该主机的客户端选项，例如\
  \ DNS 服务器地址或默认路由器。\n\n服务器通过主机的 MAC（介质访问控制）地址识别主机，在以太网 LAN 上，该地址是客户端网卡的以太网地址。通常此地址是固定的，但少数网卡允许更改它。在\
  \ Linux 系统上，您可以通过 root 身份运行 `ifconfig eth0` 命令并查找由冒号分隔的 6 字节十六进制字符串来找到 MAC 地址，例如\
  \ `00:D0:B7:1D:FB:A1`。在 Windows 上，`winipcfg` 程序可以提供信息，尽管是用连字符而不是冒号显示的。其他操作系统有它们寻找以太网地址的方法。\n\
  \n一旦知道主机的 MAC 地址，可以按照以下方式添加到 DHCP 服务器配置中：\n\n- 在模块主页面上，点击 Hosts and Groups 部分的 `Add\
  \ a new host` 连接。这将显示图 32.5 所示的主机创建表单。\n\n##### 图 32.5 创建新主机。(EBPS/Images/32fig05.jpg)\n\
  \n- 在 `Host name` 字段中输入名称。这应与客户端配置的主机名或在网络上的完全域名匹配。然而，这不是强制性的。\n- 从 `Hardware address`\
  \ 字段的菜单中选择主机所在的网络类型（例如以太网）。在旁边的文本框输入主机的 MAC 地址，格式为冒号分隔的 6 个十六进制字节，例如 `00:D0:B7:1D:FB:A1`。\n\
  - 在 `Fixed IP address` 字段中输入应分配给此客户端的 IP 地址。\n- 如果您希望此主机从子网继承客户端选项，从 `Host assigned\
  \ to` 字段的菜单中选择 `Subnet`。附近的列表将填充所有子网的名称，允许您选择主机应所在的子网。然而，固定 IP 地址必须位于子网网络内部，客户端必须连接到其\
  \ LAN。\n- 也可以通过从菜单中选择 `Shared Network` 或 `Group` 并从右列表中选择相应的项，在共享网络或组内创建主机。\n- 如果此主机需要从服务器网络启动，在\
  \ `Boot file server` 字段中输入该服务器名称。您还可以在 `Boot filename` 字段填写相应启动文件（可通过 TFTP 下载）的路径。\n\
  \n通常，网络启动用于 X Terminal 和无盘工作站等简单客户端。为了使其工作，您必须设置一个包含客户端正确启动文件的 TFTP 服务器，这在本章中未介绍。\n\
  \n- 点击表单底部的 `Create` 按钮，您将返回模块主页面，页面现在将包含一个新主机的图标。\n\n要编辑分配给此主机的客户端选项，点击其图标进入编辑页面，然后点击\
  \ `Edit Client Options`。如果主机是已设置这些选项的子网的成员，或者如第 32.6 节“编辑全局客户端选项”所解释的已进行全局定义，则并非总是必要的。\n\
  \n\n\n\n按照第 32.4 节“添加和编辑子网”中的说明，像填写子网一样填写表单。\n\n点击`Save`按钮返回主机表单。\n\n返回主页，并点击`Apply\
  \ Changes`按钮。从现在起，该主机将被分配您选择的 IP 地址和选项。它将不再出现在租约列表中，因为其 IP 分配是永久的。\n\n一旦创建了主机，您可以通过点击模块主页上的图标来更改其固定\
  \ IP 地址、MAC 地址和其他选项，这将带您进入主机编辑表单。修改后，点击`Save` 更新服务器配置，然后点击`Apply Changes` 使其生效。您还可以通过编辑页面上的`Delete`按钮删除主机。从那时起，客户端系统将从其子网的其中一个范围接收动态分配的地址，而不是固定地址。\n\
  \n您也可以通过点击子网、共享网络或组编辑页面上的`Add a new host`链接来创建主机。如果通过这种方式进行，创建表单上将不再显示`Host assigned\
  \ to`（分配给主机）字段。相反，页面顶部将显示将将其添加的父级。添加主过程中的所有其他步骤都是相同的。\n\n如果您有大量主机并希望它们都使用相同的客户端选项，则它们应该被放在组或共享网络中。请参见第\
  \ 32.9 节“添加和编辑组”获取有关组管理的更多信息。DHCP 服务器配置允许您定义多个级别的组，这可以实现相当复杂的配置。如果您网络上有多个固定地址主机，它们绝对应该位于子网或组下，以避免设置重复。\n\
  \n### 32.8 添加和编辑共享网络\n\n共享网络是共享相同物理局域网（LAN）的子网组。如果您在同一个物理网络上有多个 IP 网络，所有这些网络的 DHCP\
  \ 服务器配置项必须放在共享网络内部。这样做可能会导致服务器行为异常或在启动时报告错误消息。相反，您不能将不共享相同 LAN 的子网放在同一个共享网络中。\n\n\
  共享网络包含单个子网也是可能的，尽管这并没有实现任何实际。但是，它对于分组配置项可能有用，因为共享网络也可以包含主机和组，并拥有适用于所有成员的客户端选项。\n\
  \n要创建共享网络，请按照以下步骤操作：\n\n1. 在模块主页上，点击`Subnets and Shared Networks`下的`Add a new shared\
  \ network`链接。\n2. 在`Network name`字段中输入网络的简短名称，例如`homelan`。这仅在主页上显示共享网络时使用。\n3. 要设置此共享网络下所有子网客户端的租约长度，请填写`Default\
  \ lease time`（默认租约时间）和`Maximum lease time`（最大租约时间）字段。它们的含义与子网创建表单相同，见第 32.4 节“添加和编辑子网”。\n\
  4. 在`Subnets in this shared network`字段中，选择您想要移动到此共享网络的现有子网。将列出所有现有子网，包括其他共享网络中的。您至少选择一个子网，因为共享网络不能为空。\n\
  5. 点击页面底部的`Create`按钮。您的新共享网络将被添加到服务器配置中，模块主页上将出现它的图标。\n6. 如果您想设置适用于共享网络中所有子网的客户端选项，点击其图标，然后点击`Edit\
  \ Client Options`。设置您想要的任何字段，然后点击`Save`返回共享网络表单。\n7. 点击`Apply Changes`按钮使其生效。\n\n\
  一旦创建了共享网络，就可以使用子网表单上的`Shared network`字段在其中创建子网将其移动过去。也可以通过选择`<None>`选项将子网移出任何共享网络。\n\
  \n一旦创建了共享网络，可以通过点击其图标、更改字段并点击`Save`按钮对其进行重命名或编辑。它也可以通过`Delete`按钮完全删除。尝试删除包含子网、主机或组的共享网络将弹出一个确认页面，询问您是否真的要继续。如果您点击`Yes`，共享网络包含的所有配置项也将被删除。照常，在修改或删除之后，您必须点击主页上的`Apply\
  \ Changes`按钮来激活新设置。\n\n### 32.9 添加和编辑组\n\n与子网、主机和共享网络不同，DHCP 服务器配置中的组实际上并没有影响服务器的行为。相反，它们仅用于定义适用于多个主机的选项。尽管有其他方法可以实现这一点（例如将主机放在子网下），但使用组为您提供了额外的灵活性。\n\
  \n组可以在子网和共享网络下定义，但不能定义其他组。组通常没有名称。相反，在 Webmin 中通过它们包含的主机数量来识别。较新版本的 DHCP 服务器支持组名称且\
  \ Webmin 将显示它们，但该模块尚未支持设置组名称。\n\n要创建一个新的主机组，请按照以下步骤操作：\n\n1. 在模块主页上，点击`Hosts and\
  \ Host Groups`下的`Add a new host group`链接进入组创建表单。\n2. 从`Hosts in this group`列表中选择任何想要作为此组成员的现有主机。\n\
  3. 如果您希望此组位于子网下，在`Group assigned to`字段的菜单中选择`Subnet`并选择旁边列表中的子网。组中的所有主机必须具有位于子网网络内的固定\
  \ IP 地址。\n4. 同样，可以通过从菜单中选择`Shared Network`并从列表中选择网络在共享网络内部创建一个组。两种情况下，组都会从其父级子网或共享网络继承客户端选项和其他设置（如租约长度）。\n\
  5. 如果组中的主机需要从服务器进行网络启动，请在 Boot file server`字段中输入该服务器的名称。您必须在`Boot filename`字段中填写启动服务器上适当启动文件的路径（可通过\
  \ TFTP 下载）。\n6.点击`Create`按钮。您将返回模块主页，该主页现在将包含新组的图标。\n7. 点击组图标显示其编辑表单，然后点击`Edit Client\
  \ Options`。这将带您进入图 32.4 所示的页面，设置发送给组内客户端主机的选项。\n8. 按照第 32.4 节“添加和编辑子网”的步骤 10 到 18\
  \ 设置任何选项，如`DNS`或 NIS 服务器。\n9. 点击页面底部的`Save`按钮保存选项并返回组表单。\n10. 返回模块主页并点击`Apply Changes`使您的新组生效。\n\
  \n一旦创建了组，就可以使用主机表单上的`Host assigned to`字段将新或现有主机移动到。任何添加到组的主机都会从组继承客户端选项和网络启动设置，除非被主机自身的设置覆盖。\n\
  \n照常，可以通过点击模块主页上的组图标、进行修改并点击`Save`来编辑组。您还可以通过编辑页面上的`Delete`按钮删除组。但是，如果它包含任何主机，在实际删除组及其主机之前，将要求您确认删除。\n\
  \n\n\n\n\n通过点击其中一个图标进入页面并点击 `Add a new host group` 链接，也可以在子网或共享网络下创建一个组。显示的组创建表单不再有\
  \ `Group assigned to` 字段。相反，要添加的子网或共享网络的名称将显示在页面顶部。除了这一不同外，仍然可以按照之前的说明进行操作。\n\n\
  ### 32.10 模块访问控制\n\n如第 52 章所示，可以使用 `Webmin Users` 模块来限制用户或组对特定模块可以执行的操作。对于此模块，你可以精确控制用户可以编辑哪些主机、组、子网和共享网络。这对于授予子管理员仅设置服务器配置中少数几个主机选项的权限，同时防止其更改子网和其他主机非常有用。\n\
  \n一旦用户被赋予该模块的访问权限，请按照以下步骤限制其仅编辑某些主机：\n\n1. 在 `Webmin Users` 模块中，点击用户名旁边的 `DHCP Server`。这将弹出模块访问控制表单。\n\
  2. 将 `Can edit module configuration?` 字段更改为 `No`，这样他就无法编辑配置文件路径以及模块使用的命令。\n3. 将\
  \ `Can apply changes?` 留为 `Yes`，以便他可以激活所做的任何更改。\n4. 将 `Can edit global options?`\
  \ 更改为 `No`，这样他就无法更改适用于所有客户端的选项。\n5. `Can view leases?` 可以安全地保持为 `Yes`，但 `Can remove\
  \ leases?` 应设置为 `No`。\n6. `Uniq host names?`、`Uniq subnet IP addresses?` 和 `Uniq\
  \ shared-net names?` 字段应更改为 `Yes`，以防止创建冲突的主机、子网和共享网络。\n\n`Use security level` 字段决定用户允许访问层次结构中的哪些配置项。可用选项及其含义如下：\n\
  \n- **Level 0**：用户将拥有其被授予的所有条目的。\n- **Level 1**：只要用户可以访问其所有的子级，就可以访问已授予的条目。\n- **Level\
  \ 2**：只要用户可以访问所有的父级和祖先条目，就可以访问已授予的条目。\n- **Level 3**：类似于 2 和 3 的组合。通常，为了简单起见，你应该将此选项留为\
  \ `level 0`。\n\n假设你正在限制用户仅编辑某些主机，请取消选择 `Access groups` 和 `Access shared nets` 字段中的所有三个选项。这将停止用户查看和编辑任何组或共享网络。\n\
  \n要停止用户创建主机和子网，请在 `Access hosts` 和 `Access subnets` 字段中取消选择 `create`。\n\n将 `Enable\
  \ per-subnet ACLs?` 和 `Enable per-host ACLs?` 字段更改为 `Yes`。这允许你从提供的 `Per-object ACLs`\
  \ 部分精确选择用户可以访问哪些主机和子网。\n\n如果第一个字段设置为 `No`，则 `Access subnets` 选框将决定用户是否可以查看和编辑所有子网。同样，如果\
  \ `Enable per-host ACLs?` 字段设置为 `No`，则 `Access hosts` 选框将控制所有主机的查看和编辑。\n\n在 `Per-object\
  \ ACLs` 部分，为用户应该能够配置的主机和子网选择 `read/write`，对对其部分设置为不允许。选择 `read only` 将允许他查看主机或子网，而无法进行更改。\n\
  \n最后，点击页面底部的 `Save` 按钮使新限制生效。\n\n`DHCP Server` 模块访问控制页的另一个常见用途是限制用户仅查看和取消租约。这可以通过将\
  \ `Can view leases?` 和 `Can remove leases?` 字段设置为 `Yes`，并将其他所有设置为 `No` 来实现。用户还应该被拒绝访问所有主机、子网等，或者可能被授予只读权限。\n\
  \n### 32.11 配置 DHCP 服务器模块\n\n和其他大多数模块一样，`DHCP Server` 模块有几个可以通过点击主页上的 `Module Config`\
  \ 链接设置的选项。它们分为两组：`Configurable options` 下的控制模块的用户界面，而 `System configuration` 下的告诉模块去哪里查找服务器的配置文件和程序。由于后一组选项是\
  \ Webmin 根据你的操作系统或 Linux 发行版自动设置的，除非你自己编译并安装了 DHCP 服务器，否则你不需要更改它们。\n\n表 32.1 涵盖了用户界面和\
  \ DHCP 服务器路径选项。\n\n#### 表 32.1. 模块配置选项\n\n| 字段 | 描述 |\n| :--- | :--- |\n| Sort leases\
  \ by | 此字段控制租约列表的排序方式。可用选项有：**Order in file**：租约按照它们在租约文件中出现的顺序显示，通常意味着它们按照被授予的顺序出现。**IP\
  \ address**：租约按分配给客户端的 IP 地址排序。**Hostname**：租约按客户端主机名排序，主机名与其 IP 地址不一定相关。主机名由客户端本身确定，并在获取租约时报告给服务器。\
  \ |\n| Display subnets and hosts as | 当选择 `Icons` 时（默认如此），主页上的所有子网、共享网络、主机和组都将以图标形式显示。选择\
  \ `List` 则将显示更改为文本表格，包含更多信息且占用的空间更小。 |\n| Icons in row | 使用图标显示模式时，此字段决定子网和主机表每行中出现的图标数量。\
  \ |\n| Display lease times in | 当此字段选择 `Local time` 时，租约表中的时间将按服务器系统的时区显示。将其更改为\
  \ `GMT` 将强制使用 GMT 作为时区，这在管理不同国家的服务器时可能更有意义。 |\n| Show IP addresses for hosts? |\
  \ 当此字段设置为 `Yes` 时，每个主机的固定 IP 地址将与其主机名一起显示在模块主页的图标下方。 |\n| Show MAC addresses for\
  \ hosts? | 选择 `Yes` 时，每个主机的以太网地址将显示在主页图标下方。可以同时显示 IP 和 MAC 地址。 |\n| DHCP server\
  \ config file | 此字段必须设置为 DHCP 服务器配置文件 `dhcpd.conf` 的完整路径。只有当你手动编译并安装了服务器，而不是使用操作系统自带的版本时，你才需要更改它。\
  \ |\n| DHCP server executable | 此字段必须包含 DHCP 服务器程序的完整路径，通常称为 `dhcpd`。在启动或重启服务器时，Webmin\
  \ 会带有针对配置文件、租约文件和接口的适当命令行运行此命令。 |\n| Command to start DHCP server | 如果此字段未设置为 `Run\
  \ server executable`，则在点击 `Start Server` 按钮时，模块将使用此命令。在某些 Linux 发行版中，它被设置为一个启动脚本，通常用于在启动时启动服务器。然而，如果你自己编译并安装了\
  \ DHCP 服务器，你应该将其改回 `Run server executable`。 |\n| Command to apply configuration\
  \ | 当此字段设置为 `Kill and restart` 时，在点击 `Apply Changes` 按钮时，Webmin 将杀死 DHCP 服务器进程并重新运行它。如果你自己编译了服务器，应选择此选项。只有在提供可以重启服务器的启动脚本的\
  \ Linux 发行版上，默认才会设置为不同的值，例如 `/etc/init.d/dhcpd restart`。 |\n| Path to DHCP server\
  \ PID file | 此字段必须设置为 DHCP 服务器 PID 文件的完整路径，例如 `/var/run/dhcpd.pid`。模块使用 PID 文件来判断服务器正在运行，并在点击\
  \ Apply Changes 时重启它。 |\n\n\n\n\n\n| DHCP 服务器租约文件 | 此配置字段应设置为 DHCP 服务器存储租约的文件的全路径路径。您应该始终确保指定的路径与\
  \ `dhcpd` 服务器可执行文件中编译的默认路径一致，否则列出租约的页面将为空或不完整。 |\n| 接口文件类型 | 此字段决定了当您更改服务器监听的网络接口时，模块将更新哪一个文件。不同的\
  \ Linux 发行版都有它们自己的特殊文件，这些文件由`启动 DHCP 服务器的命令`字段指定的启动脚本读取。只有在您自己编译并安装了服务器时，才应该更改此选项。如果是这样，将其设置为\
  \ `Webmin`，这将告诉模块仅在其自身的配置文件中保留接口列表。 |\n\n### 32.12 总结\n\n本章介绍了 DHCP 协议和用于 UNIX 系统的常用\
  \ ISC DHCP 服务器。它解释了如何使用 Webmin 配置服务器，以便为网络上的客户端自动分配动态或固定 IP 地址，以及如何设置适用于单个主机、主机组或整个子网的选项。虽然本章没有涵盖该模块的所有功能，但在读完本章后，您应该已经具备足够的知识来为典型网络设置\
  \ DHCP 服务器。\n\n## 第 33 章 使用 Fetchmail 下载电子邮件\n\n本章解释了如何配置 Fetchmail 程序从另一个服务器下载电子邮件并将其投送到您系统上的地址。\n\
  \n### 33.1 Fetchmail 简介\n\nFetchmail 是一个相对简单的程序，它使用 `POP3` 或 `IMAP` 协议从另一个服务器下载电子邮件，并将其投送到您系统的邮箱中。如果您想运行自己的邮件服务器但由于某些原因无法直接接收邮件，那么它就非常有用。解决方案是让\
  \ Fetchmail 定期使用 `POP3` 等协议下载邮件，然后连接到系统上的 SMTP 服务器，使其像直接发送一样进行投递。\n\n如果您的系统通过拨号连接互联网且仅偶尔在线，通常无法直接接收邮件。如果您没有固定\
  \ IP 地址，情况也是如此。在这种情况下，仍然可以通过将发为您域的邮件发送到 ISP 的邮箱中，并使用 Fetchmail 定期将其传输到您的系统，从而运行自己的电子邮件域和服务器。\n\
  \n即使您没有自己的互联网域名，Fetchmail 仍然可以用于从 ISP 域名下的电子邮件账户下载邮件。许多邮件客户端如 `pine`、`elm` 和 `Usermin`\
  \ 直接读取 `/var/mail` 中的 UNIX 邮件文件，而不是通过 `POP3` 或 `IMAP` 协议下载消息。要使用这些程序，必须将电子邮件下载到您的系统并投递给本地用户。\n\
  \nFetchmail 可以从不同服务器上的多个邮箱下载电子邮件，并投递到您系统上的不同地址。如果一个域名内所有地址的邮件已合并到一个邮箱中，Fetchmail\
  \ 通常将其分离并投递给系统上正确的用户。这可能是 Fetchmail 最实用的功能，但遗憾的是它并不是 100% 可靠的。\n\nFetchmail 程序可以使用\
  \ `POP2`、`POP3` 和 `IMAP` 协议检索邮件，其中任何一个都会被几乎邮件服务器支持。它还可以使用 `SMTP` 协议的 `ETRN` 模式强制邮件服务器将所有等待投递的队列消息送到您的系统。遗憾的是，它不支持从专有的电子邮件系统（如\
  \ `Exchange` 或 `Lotus Notes`）或基于 Web 的电子邮件服务（如 `Hotmail`）检索邮件，除非这些服务也支持标准协议之一。\n\
  \n为了进行定期检查，Fetchmail 通常作为后台守护进程运行，并定期连接到所有邮件服务器。它也可以在您指定的日期和时间通过 `Cron` 任务运行，甚至可以从命令行或其他脚本手动启动。\n\
  \nFetchmail 通常由个人用户而非系统管理员运行，每个用户在自己的主目录下都有一个独立的 `.fetchmailrc` 配置文件。由于运行它不需要 root\
  \ 权限，因此每个用户可以在多用户 UNIX 系统上安全地配置 Fetchmail，从他自己的远程邮箱下载邮件。这意味着每个用户可能都有一个正在运行的独立 Fetchmail\
  \ 守护进程，并使用自己的配置。\n\n也可以使用单个配置文件，并且 Fetchmail 可以以 root 身份运行，为系统上的所有用户下载电子邮件。如果您是该\
  \ Linux 设备的唯一用户，或者您正在为整个域名下载邮件并分发给本地用户，那么这种选项更有意义。通常，`/etc/fetchmailrc` 被用全局配置文件。\n\
  \n事实上，Fetchmail 可以同时在个人用户配置和全局文件中运行。然而，配置它的 Webmin 模块期望您使用其中一种模式。\n\n### 33.2 Fetchmail\
  \ 邮件检索模块\n\n用于管理 Fetchmail 的 Webmin 模块可以在“服务器 (Servers)”类别下找到。当第一次点击其图标时，主页将显示系统上所有用户的\
  \ Fetchmail 配置。对于每个在主目录下有 `.fetchmailrc` 的用户，将显示用户的用户名及其文件中的所有服务器，以及连接到每个服务器使用的协议和登录登录的用户。图\
  \ 33.1 显示了一个示例。\n\n##### 图 33.1. Fetchmail 模块主页。\n\n![](img/33fig01.jpg)\n\n如果 Webmin\
  \ 找不到 `fetchmail` 程序，主页将显示错误消息。这可能是因为未安装它，或者可能是模块查找的位置不对。大多数 Linux 发行版都带有 Fetchmail\
  \ 软件包，请检查光盘或网站并使用“软件包”模块（第 12 章介绍）进行安装。\n\n如果您只想管理系统上的单个 Fetchmail 配置文件，现在是切换模块到该模式的时候了。除非您想管理系统上所有用户的配置，否则这是最佳选择。它允许您设置一个守护进程来定期检查并下载电子邮件到本地邮箱，这是大多数管理员使用\
  \ Fetchmail 的目的。\n\n要将模块更改为使用单文件，请遵循以下步骤：\n\n点击主页左上角的 `Module Config（模块配置）`链接。\n\
  \n在 `Fetchmail config file to edit（要编辑的 Fetchmail 配置文件）`字段中，选择第二个单选按钮，并在旁边的字段中输入配置文件路径。如果您已经有一个\
  \ Fetchmail 配置文件，那么自然应该输入其路径；否则，使用 `/etc/fetchmailrc` 即可。\n\n点击表单底部的 `Save（保存）`按钮更新模块配置并返回主页。\n\
  \n在单配置文件模式下，主页上的文件名下方将仅显示来自该文件的服务器。下方是一个用于启动 Fetchmail 守护进程的表单，以便定期检查列出的服务器和账户，本章稍后部分将进行详细说明。\n\
  \n由于该模块不支持为个人用户启动 Fetchmail 守护进程，如果您使用它来管理多个个人配置文件，则将需要为每个用户的配置创建一个 `Cron` 任务或启动一个守护进程。最简单的方法是使用\
  \ `Scheduled Cron Jobs（计划的 Cron 任务）`模块（第 10 章介绍），为每个用户创建一个任务，按照您选择的计划运行 `fetchmail`\
  \ 命令。取决于您收到的邮件量，每 30 分钟一次通常足够了。默认情况下，`fetchmail` 程序将使用运行它的用户目录下的 `~/.fetchmailrc`\
  \ 文件。\n\n\n\n\n另一个可以供用户用于管理自己的 Fetchmail 配置甚至启动自己的进程的包是 Usermin，它与 Webmin 紧密相关。更多细节请参阅第\
  \ 47 章。\n\n由于 `Fetchmail` 可用于 UNIX（且在所有版本中的工作方式基本相同），此模块的行为也一样。唯一的区别是，用于在当特定网络接口关闭时关闭检查的\
  \ `Check` 条件字段在 Linux 和 FreeBSD 以外的操作系统上将不起作用，至少在当前的 `Fetchmail` 版本中如此。尽管该字段始终出现，但不应在其他版本的\
  \ UNIX 上使用它。\n\n### 33.3 添加新的邮件服务器进行检查\n\n在 `Fetchmail` 为你从邮件服务器下载电子邮件之前，必须在它的配置中添加该条目。请按照以下步骤操作：\n\
  \n在模块的主页上，点击现有服务器列表下方的 `Add a new server`（添加新服务器）链接。如果您正在管理多个用户的配置，必须使用您想要添加服务器的用户列表区域中的链接。\n\
  \n也可以使用 `Add Fetchmail server for user`（为用户添加 Fetchmail 服务器）按钮，将服务器推送到相邻字段中输入的用户中。如果该用户尚未定义任何服务器，则必须使用此方法。\n\
  \n无论您使用哪个链接或按钮，都会显示图 33.2 所示表单用于输入新服务器的详情。\n\n#### 图 33.2 服务器创建表。\n\n![](img/33fig02.jpg)\n\
  \n在 `Server name`（服务器名称）字段中，为此邮件服务器条目输入一个唯一名称。通常，这将是它的实际主机名，例如 `mail.yourisp.com`。\n\
  \n如果您希望按计划检查此服务器，请确保 `Polling enabled?`（启用轮询？）字段设置为 `Yes`。否则，它只会在从 `Webmin` 手动运行或通过命令行链接运行时才会被检查。\n\
  \n`Mail server to contact`（要联系的邮件服务器）字段在您需要连接到同一主机上的多个端口或协议时非常有用。由于 `Server name`\
  \ 必须是唯一的，您可以通过为服务器名称输入不同的值（例如 `mail.yourisp.com-1` 和 `mail.yourisp.com-2`），并在此字段中输入服务器的实际主机名，为同一个实际邮件服务器创建两个条目。\n\
  \n然而，这种情况相当罕见，因此您通常只需将此字段设置为 `Same as server name`（与服务器名称相同）。\n\n从 `Protocol`（协议）菜单选择为此服务器使用的邮件检索协议。最常用的是\
  \ `POP3` 和 `IMAP`。您的 ISP 或邮件服务器管理员将告诉您使用哪一个。\n\n如果邮件服务器对所选协议使用非标准端口，则 `Default`（默认）选项对\
  \ `Server port`（服务器端口）字段无效。相反，您必须输入正确的端口号，例如 `1110`。\n\n`Check condition`（检查条件）字段可用于在网络接口关闭时防止定期检查此服务器。如果您有一个偶尔活跃的拨拨号连接，并希望在未活动时避免无用地尝试连接邮件服务器，那么这很有用。\n\
  \n如果选择 `Always check`（始终检查），`Fetchmail` 将始终尝试连接。但是，如果选择了 `Only if interface is up`（仅当接口开启时），如果相邻字段中的网络接口关闭，则不会建立连接。您用于拨号的主\
  \ PPP 接口通常命名为 `ppp0`。请参阅 `Network Configuration`（网络配置）模块（第 16 章介绍）获取活动接口列表。\n\n\
  为了执行检查，您必须输入接口名称以及网络和子掩码，以指定接口的有效本地地址范围。如果您拨号连接到几个不同的 ISP，但只想在连接到特定 ISP 时让 `Fetchmail`\
  \ 检查邮件，这可能很有用。大多数 ISP 为所有客户分配特定 C 类或 B 类网络范围内的地址，例如 `203.51.0.0/255.255.0.0`。\n\n\
  要允许 `Fetchmail` 只要接口开启就检查（无论其 IP 地址是什么），只需在网络和子掩码字段中都输入 `0.0.0.0`。这涵盖了所有可能的地址。\n\
  \n在 `Mail server user details`（邮件服务器用户详情）部分，在 `Remote user`（远程用户）字段中输入连接邮件服务器所需的登录名。\n\
  \n在 `Remote password`（远程密码）字段中输入用户的正确密码。\n\n`Local user(s)`（本地用户）字段用于输入检索到的消息的电子邮件地址。这通常是一个本地用户名，如\
  \ `jcameron`，但也可以是另一个服务器上的地址，如 `jcameron@example.com`。\n\n也可以输入多个用户名，在这种情况下，`Fetchmail`\
  \ 将尝试确定每条下载的消息属于这些名称中的哪一个。有多个地址的邮件转发到 ISP 邮件服务器上的同一个邮箱箱，并希望拆分检索到的消息以投递到正确的本地邮箱，那么这很有用。如果\
  \ `Fetchmail` 遇到收件人不在列表中的消息，它将其退回发送者。\n\n最后的备选方案是在 `Local user(s)` 字段中仅输入 `***`，这告诉\
  \ `Fetchmail` 将每条消息投递给系统中与消息目标地址用户名部分相同的本地用户。\n\n如果您希望 `Fetchmail` 在下载消息后从邮件服务器删除消息，请将\
  \ `Leave messages on server?`（在服务器上保留消息？）字段设置为 `No`。除非使用其他邮件客户端访问邮箱箱，否则这是最佳选项，因为可以防止每条消息的额外副本存储在您的\
  \ ISP 服务器上，而该服务器可能对邮件文件大小有限制。\n\n选择 `Yes` 会使 `Fetchmail` 跟踪已接收的消息，并仅下载邮箱中的新消息。实际上，它是将远程邮箱同步到本地邮箱，但在服务器上删除的消息不会在本地删除。\n\
  \n如果您在远程服务器上保留消息，则 `Always fetch all messages?` 字段应设置为 `No`。否则，将其设置为 `Yes` 以确保邮箱中的所有消息都被下载。\n\
  \n`Command to run before connecting`（连接前运行的命令）字段可以输入 `Fetchmail` 在连接到邮件服务器之前执行的\
  \ shell 命令。此功能最常见的用途之一是运行命令设置 SSH 隧道，以便访问无法直接连接的服务器。尽管这可能非常复杂，此处未介绍。通常此字段可以留空。\n\
  \n同样，`Command to run after disconnecting`（断开连接后运行的命令）字段用于输入 `Fetchmail` 从远程邮件服务器注销后执行的\
  \ shell 命令。通常用于杀死由之前的启动的 SSH 进程。\n\n最后，点击 `Create`（创建）按钮保存新服务器。以后当 `Fetchmail` 运行定期检查时都会使用它。\n\
  \n一旦您创建了新服务器条目，它将列在模块的主页上。要编辑它，只需点击 `Server to poll`（轮询服务器）列中的服务器名称，这将在浏览器中打开编辑表单。更改任何字段并点击\
  \ `Save`（保存）以更新 `Fetchmail` 配置文件。\n\n可以通过点击编辑表单上的 `Delete`（删除）按钮删除服务器。然而，通常做法是将\
  \ `Polling enabled?` 字段改为 `No`，这实际上禁用了该服务器。\n\n如 33.4 节“下载电子邮件”所述，除非您显式告诉它检查该服务器，否则它不会连接。\n\
  \n可以让 `Fetchmail` 检查同一服务器上的多个邮箱箱，并将额外邮箱箱的邮件投递给不同的用户。这可以通过为同一服务器创建多个配置条目来实现，但有一种更简单更好的方法，使用以下步骤：\n\
  \n在模块的主页上，点击您想要添加额外检查邮箱的服务器名称。\n\n点击 `Add another user`（添加另一个用户）按钮。编辑表单将重新显示，但在底部多出一个空的\
  \ `Mail server user details`（邮件服务器用户详情）部分。\n\n\n\n\n在新的章节中填写 Remote user（远程用户）、Remote\
  \ password（远程密码）、Local user(s）（本地用户）等字段，具体按照第 33.2 节“Fetchmail 邮件检索模块”中的步骤进行说明。\n\
  \n点击 Save（保存）按钮。你将返回模块的主页，服务器旁边将显示新的远程用户名和本地用户名。\n\n尽管从单个邮箱中提取多个用户的邮件的能力是 Fetchmail\
  \ 最实用的功能之一，但该功能并非 100% 可靠。程序无法在所有情况下都准确判断邮件被发送到了哪个地址。通常，`To:` 或 `Cc:` 邮件头部会包含目标地址，但对于接收来自邮件列表的消息，情况并非如此；相反，`To:`\
  \ 头部包含列表的地址。Fetchmail 会尝试检查其他邮件头部以查找消息的真实目标地址，但这些头部并不总是可用的。\n\n当邮件消息通过 `SMTP` 协议直接投递到服务器时，源系统会通知目标服务器邮件的真实目标地址。遗憾的是，该地址并不在实际消息中，而是作为服务器之间\
  \ `SMTP` 会话的一部分被指定的。当邮件被投递到邮箱时，此信息就会丢失，且无法准确恢复。\n\n只有当 Fetchmail 从邮箱下载邮件并将其投递给单个接收者时，才能保证其执行正确的操作。在这种情况下，它永远不需要检查每条消息的目标地址，因为所有消息都被发送到同一个本地邮箱。\n\
  \n### 33.4 下载邮件\n\n一旦你创建了至少一个服务器条目，就可以使用此模块让 Fetchmail 连接到服务器并下载消息。该模块可以从配置文件中的所有服务器检索邮件，也可以仅从单个服务器检索。\n\
  \n要检查所有服务器，请遵循以下步骤：\n\n1. 在模块的主页上，点击服务器表格下方的 `Check all servers`（检查所有服务器）。如果你正在管理多个用户的配置，此链接将出现在每个用户的表格下方。\n\
  2. 系统将显示一个包含 `fetchmail` 命令输出的页面，以便你可以看到 Fetchmail 下载消息时，你的系统与远程邮件服务器之间的 `POP3`\
  \ 或 `IMAP` 协议交换。如果发生错误（如连接失败或密码错误），你将在输出中看到它。\n3. 下载的消息将被投递到服务器配置条目中指定的本地地址。默认情况下，邮件将通过与你系统上的邮件服务器建立\
  \ `SMTP` 连接来发送。用于投递邮件的实际 `SMTP` 协议命令将显示在生成的页面上，你可以查看是否发生了任何错误。\n\n如果你的系统上没有运行邮件服务器，或者它无法访问指定本地地址的邮件，投递可能会失败。如果发生这种情况，Fetchmail\
  \ 将尝试向发送者发回退信。\n\n也可以检查单个服务器的邮件，即使是 `Polling enabled?`（启用轮询？）字段设置为 `No` 的服务器。要这样做，请使用以下流程：\n\
  \n1. 在模块的帮助页面上，点击服务器名称以弹出编辑表单。\n2. 点击页面底部的 `Check this server`（检查此服务器）按钮。\n3. 将显示一个\
  \ Fetchmail 在下载和投递消息时的输出页面，如前所述。\n\n### 33.5 运行 Fetchmail 守护进程\n\n如果你使用该模块管理单个 Fetchmail\
  \ 配置文件，可以启动后台进程来定期检查该文件中的服务器和邮箱。\n\n要执行此操作，请遵循以下步骤：\n\n1. 主页底部有一个标记为 `Start Fetchmail\
  \ Daemon`（启动 Fetchmail 守护进程）的按钮。旁边的描述中有一个文本字段，用于输入守护进程在每次检查之间等待的秒数。短时间（如 60 秒）意味着你会更快收到邮件，但由于检查频繁，代价是消耗更多的带宽和\
  \ CPU 时间。\n2. 输入检查周期后，点击 `Start Fetchmail Daemon` 按钮启动后台 `fetchmail` 进程。页面将重新显示，但按钮现在标记为\
  \ `Stop Fetchmail Daemon`（停止 Fetchmail 守护进程）。\n3. 如名所示，你可以随时点击新的 `Stop` 按钮来杀死运行中的守护进程进程。当模块检测到它不再运行时，`Start`\
  \ 按钮将再次出现。\n\n如果你的系统重启，Fetchmail 守护进程自然会停止。要让它在启动时自动启动，你需要按照第 9 节的说明创建一个启动操作。该操作必须运行\
  \ `fetchmail d *interval* f *configfile*`。\n\n### 33.6 编辑全局设置\n\nFetchmail 模块还可以编辑适用于配置文件中所有服务器的选项。这对于在网络接口不可用时停止连接任何服务器或定义默认值非常有用。要编辑这些全局选项，请遵循以下步骤：\n\
  \n1. 在模块的主页上，点击服务器表格下方的 `Edit default settings`（编辑默认设置）。如果该模块用于管理多个用户的配置，此链接将出现在每个用户的表格下方。无论如何，你的浏览器都将显示一个编辑全局选项的页面。\n\
  2. 为所有服务器设置默认协议，从 `Protocol`（协议）菜单中选择一个。常见的是 `POP3` 和 `IMAP`，如果选择了 `Default`（默认）选项，则使用前者。当服务器编辑表单上的\
  \ `Protocol` 字段设置为 `Default` 时，将使用此处选择协议。\n3. 为 Fetchmail 连接定义默认端口，填写 `Server port`（服务器端口）字段。最好将其设置为\
  \ `Default`，在这种情况下，程序将为所选协议使用相应的端口。只有当服务器表单上的 `Server port` 字段设置为 `Default` 时，此处输入的值才有效；否则，它将被你为该服务器输入的任何内容覆盖。\n\
  4. `Check condition`（检查条件）字段可用于在特定接口不可用或没有正确 IP 地址时防止 Fetchmail 连接到任何服务器。第 33.3\
  \ 节“添加新的待检查服务器”中的说明解释了该字段如何工作。\n\n点击 Save（保存）按钮使新的全局设置生效。\n\n### 33.7 模块访问控制\n\n\
  如第 52 节所说明，可以限制 Webmin 用户对其获得权限的模块的操作。对于 Fetchmail 模块，你可以限制该用户编辑 Fetchmail 配置的 UNIX\
  \ 用户。一旦创建了用户，可以通过以下步骤进一步限制访问：\n\n1. 在 Webmin 用户模块中，点击用户名称旁的 `Fetchmail Mail Retrieval`（Fetchmail\
  \ 邮件检索）。这将弹出模块访问控制表单。\n2. 将 `Can edit module configuration?`（可以编辑模块配置？）更改为 `No`，以停止\
  \ Webmin 用户切换到单文件模式或更改 Fetchmail 程序的路径。\n3. `Can edit fetchmail config for`（可以编辑哪些\
  \ 用户的配置）字段决定了该 Webmin 用户可以为哪些 UNIX 用户编辑 Fetchmail 服务器。\n\n\n\n\n\n- **当前 Webmin\
  \ 用户**：只有用户名与 Webmin 用户相同的 UNIX 用户可以被编辑。此选项对于允许用户编辑自己的 Fetchmail 设置非常有用，尽管 Usermin\
  \ 程序是更好的替代方案。\n\n- **仅用户**：可以编辑输入到此选项旁文本框中的用户进行配置。\n\n- **除用户外的所有用户**：可以编辑相邻文本框中输入的用户以外的所有用户进行\
  \ Fetchmail 设置。\n\n点击 `Save` 按钮以使新的模块限制生效。\n\n这种访问控制只有在模块已配置为允许编辑单个 `.fetchmailrc`\
  \ 文件时才有用。在单配置文件模式下，不适用任何限制。\n\n### 33.8 配置 Fetchmail 邮件检索模块\n\n与其他模块一样，此模块有几个选项可以通过点击主页上的\
  \ `Module Config` 链接进行编辑。这些选项如表 33.1 所示。\n\n### 33.9 总结\n\n完成本章后，你应该理解 Fetchmail\
  \ 的作用，以及如何在你的系统上设置它以从其他服务器下载邮件到本地用户。你应该熟悉可以为每个远程服务器和邮箱设置的各种选项，并理解该模块的单文件模式和所有用户模式之间的区别。\n\
  \n##### 表 33.1. 模块配置选项\n\n| 要编辑的 Fetchmail 配置文件 | 如本章前面的介绍，该模块可以管理单个 Fetchmail 配置文件，也可以管理属于所有\
  \ UNIX 用户的文件。当此字段设置为 `All users' .fetchmailrc` files` 时，每个用户的 `.fetchmailrc` 文件内容将显示在主页上供编辑。选择另一个选项则告诉模块编辑在其旁文本框中输入路径的单配置文件。\
  \ |\n| 运行 fetchmail 守护进程的用户 | 正常情况下，`Start Fetchmail Daemon` 按钮以 root 身份运行后台检查进程。要让它以不同的\
  \ UNIX 用户身份运行，请在此字段中输入其他用户名。通常不需要让守护进程以 root 身份运行，因为它不需要特殊权限。以如 `nobody` 这样的非特权用户运行可以减少\
  \ Fetchmail 中的安全漏洞导致攻击者接管你系统的概率。 |\n| 邮件投递命令 | 当此字段设置为 `Use SMTP`（默认即如此）时，Fetchmail\
  \ 将通过与运行相同系统上的邮件服务器建立 SMTP 连接来投递下载的邮件。另一种方法是输入一个可以接受邮件消息作为投递输入的命令，例如 `/usr/sbin/sendmail\
  \ -oem -f %F %T*`。如果你没有一直运行接收 SMTP 连接的邮件服务器，此选项将非常有用。 |\n| fetchmail 程序的路径 | 此字段必须包含\
  \ Fetchmail 可执行文件的完整路径（例如 `/usr/local/bin/fetchmail`），或者如果它在 Webmin 的程序搜索路径中，只需包含\
  \ `fetchmail`。只有当你将程序安装在不在搜索路径的目录中时，才需要更改它。 |\n| fetchmail 守护进程 PID 文件路径 | 此字段必须包含\
  \ Fetchmail 在守护进程模式启动时创建的 PID 文件位置。默认始终为 `/var/run/fetchmail.pid`，如果你从源码编译或安装了使用不同\
  \ PID 文件路径的包，则可能不正确。 |\n\n## 第 34 章。管理 Majordomo 邮件列表\n\n本章记录了如何使用 Webmin 和免费提供的\
  \ Majordomo 列表管理程序在你的系统上设置邮件列表的过程。\n\n### 34.1 邮件列表和 Majordomo 简介\n\n邮件列表提供了一种通过电子邮件促进小组讨论或向多个电子邮件地址广播消息的方法。从本质上讲，邮件列表就是一个电子邮件地址，它将发送给它的所有邮件转发到成员地址列表。通常，消息会经过修改，使回复返回到列表地址而不是原始发送者，这使得成员可以轻松地通过电子邮件参与小组讨论。\n\
  \nMajordomo 是 Linux 和 UNIX 系统最流行的邮件列表管理程序。除了将邮件从列表地址转发给成员外，它还处理订阅和取消订阅、审核和消息过滤。它可以为消息添加页眉和页脚，发送包含过去几天列表邮件的定期摘要，创建列表消息的归档，等更多功能。\n\
  \n由于它是用 Perl 编写的，Majordomo 将运行在几乎所有版本的 UNIX 上，并在所有支持的操作系统上表现相同。它只需要你安装了一个可以将消息转发到程序或地址文件中的邮件服务器，`Sendmail`\
  \ 和 `Postfix` 都可以做到。有关在你的系统上设置 `Sendmail` 的更多信息，请参见第 37 章。\n\n邮件列表用户通常通过向你系统上的特殊\
  \ Majordomo 地址（例如 `Majordomo@example.com`）发送邮件来订阅。事实上，有几种类型的命令可以通过简单将它们包含在消息正文中发送到该地址。最常用的命令及其参数是：\n\
  \n`subscribe list address` 将 `address` 添加到指定的 `list` 中。实际上可以省略地址，在这种情况下，将使用命令邮件的\
  \ `From:` 地址。如果此列表对新订阅需要确认，订阅者将收到一封确认消息，他们在被添加之前必须回答该消息。\n\n`unsubscribe list address`\
  \ 从指定的 `list` 中移除 `address`。如果未提供地址，则将使用命令邮件的发送者。\n\n`lists` 返回服务器上所有邮件列表的列表及其描述。某些列表可能对某些地址隐藏。\n\
  \n`who list` 返回指定 `list` 的订阅者列表。对此命令的访问通常仅限于订阅者。\n\n`info list` 返回指定 `list` 的信息文本，这通常是关于该列表用途以及谁可以加入的描述。\n\
  \n`intro list` 返回指定 `list` 的欢迎消息，订阅者在加入时收到该消息。\n\n`index list` 返回与指定的 `list` 相关的可下载文件列表，可以通过\
  \ `get` 命令检索。\n\n`get list file` 返回与指定的 `list` 相关的可下载文件的内容。\n\n例如，要将自己添加到邮件列表，你只需向\
  \ `Majordomo@example.com` 发送邮件，内容包含 `subscribe example-list yourname@example.com`\
  \ 行。单条消息可以包含多个命令，每行一个。Majordomo 收到消息后，它将处理命令并返回一封响应邮件，其中包含每个命令成功或失败的信息以及它们产生的任何信息。\n\
  \n当然，在任何这些命令在你的系统上生效之前，你必须设置 Majordomo 并至少创建一个邮件列表。。第 34.2 节“Majordomo 列表管理器模块”解释了如何操作。\n\
  \n### 34.2 Majordomo 列表管理器模块\n\n此模块允许你在系统上设置和管理多个 Majordomo 邮件列表。它设计用于与 `Sendmail\
  \ Configuration` 模块接口，以设置 Majordomo 运行所需的邮件别名，但也适用于任何使用 `/etc/aliases` 文件的邮件服务器。如果你没有使用\
  \ Sendmail，请参见第 34.3 节“使用其他邮件服务器”有关如何配置该模块与你的服务器配合工作的细节。如果 Webmin 检测到未安装 Sendmail，主页上将显示错误消息，通知你无法找到其配置文件。\n\
  \n与其他邮件相关的模块一样，可以在 Webmin 的 `Servers` 类别下找到此模块。当你进入时，主页会显示一个图标表格，你系统上的每个邮件列表对应一个图标。图\
  \ 34.1 显示了一个示例。\n\n##### 图 34.1. Majordomo 模块主页。\n\n\n\n\n\n![](img/34fig01.jpg)\n\
  \n为了让 Majordomo 运行，你需要定义 `Majordomo` 和 `Majordomo-owner` 邮件别名，并将消息分别转发给 Majordomo\
  \ 程序和列表管理员。如果该模块检测到这些别名不存在（通常是因为你从未设置过 Majordomo 或之前未使用过该模块），主页上将显示标记为 `Owner email\
  \ address`（所有者电子邮件地址）的字段。\n\n你必须在此字段中输入主邮件列表管理员（通常是你自己）的地址，并点击 `Setup Aliases`（设置别名）按钮。系统将创建必要的别名，随后主页将重新显示，且不再显示该按钮和字段。在完成操作之前，Majordomo\
  \ 将无法正常工作，用户无法订阅或取消订阅、获取现有邮件列表的信息等。\n\n自然地，如果模块在你的系统中完全找不到 Majordomo，主页将显示错误消息，而不是上述的任何图标或字段。如果你确定它确实已安装，请参阅第\
  \ 34.16 节“配置 Majordomo 列表管理器模块”，了解如何调整模块用于查找配置文件和程序的路径说明。\n\n只有少数操作系统和 Linux 版本标准标带了\
  \ Majordomo，例如 OpenLinux、SuSE Linux、MSC.Linux、Debian Linux 和 AIX。如果你正在运行这些系统，请检查你的操作系统\
  \ CD 或网站是否有 Majordomo 软件包，并使用 `Software Packages` 模块进行安装。所有其他操作系统的用户将需要从 [www.greatcircle.com/majordomo/](http://www.greatcircle.com/majordomo/default.htm)\
  \ 下载、编译并安装源代码。该模块假设你在拥有该包的系统上使用软件包，在没有的系统中使用源代码。如果你在有包可用的情况下安装了源码，或者使用了我未知的包，你将需要在模块配置页面上调整路径。\n\
  \n如果你已经是 Majordomo 的资深用户，模块应该能够找到并显示你所有的现有列表及其设置。然而，这取决于 `majordomo.cf` 是否与原始格式差异过大，以便其被正确解析。如果你对该文件进行了大量修改，模块可能找不到你的部分或全部列表。\n\
  \n它无法很好地处理多个虚拟邮件域。某些系统为每个域都有一个 Majordomo 配置文件，可能还有多个别名文件。在这种情况下使用该模块的办法是为每个域克隆一次（如第\
  \ 51 章所述），并配置每个克隆使用不同的 `majordomo.cf` 文件。\n\n### 34.3 使用其他邮件服务器\n\n默认情况下，此模块假设你正在使用\
  \ Sendmail 邮件服务器。然而，许多人更喜欢 Postfix 或 Qmail 等替代方案，因为它们具有更优的格式、可靠性和设计。幸运的是，该模块可以任何使用与\
  \ Sendmail 的 `/etc/aliases` 相同格式的别名文件的邮件服务器配合工作。\n\n你只需要告诉模块别名文件的位置，而不是让它读取 Sendmail\
  \ 配置并自动查找。要执行此操作，请遵循以下步骤：\n\n1. 在模块主页上，点击 `Module Config`（模块配置）链接。这将打开模块配置表单。\n\
  2. 对于 Sendmail 风格的别名文件字段，取消勾选 `Get from sendmail.cf` 选项，并输入邮件服务器别名文件的完整路径。这通常类似于\
  \ `/etc/aliases` 或 `/etc/postfix/aliases`。\n3. 点击 `Save`（保存）按钮返回主页。任何关于 Webmin 无法找到\
  \ `sendmail.cf` 文件的错误消息都会消失。\n4. 点击页面底部的 `Edit Majordomo Options`（编辑 Majordomo 选项）按钮，并在\
  \ `Sendmail command path`（Sendmail 命令路径）字段中填写路径。这通常是 `/usr/sbin/sendmail` 或 `/usr/lib/qmail/sendmail`。\n\
  5. 点击 `Save`（保存）返回主页。该模块现在将可以使用 `sendmail` 命令发送给列表成员。\n\n并不是所有邮件服务器都带有别名文件，因此模块无法与它们配合。Qmail\
  \ 需要 `/var/qmail/aliases` 目录下的文件，Majordomo 使用它来发送邮件。*给列表成员邮件附加 `Forwarded mail footer`\
  \ 字段的页脚。在 `Description`（描述）字段中，输入一个该列表的简短描述，当用户向 Majordomo 发送 `lists` 命令时，该描述将显示在列表名称旁。*\n\
  \n### 34.4 创建邮件列表\n\n一旦 Majordomo 模块设置好，你就可以通过它创建列表。要创建列表，请遵循以下步骤：\n\n1. 在模块主页上，点击现有列表图标下方的\
  \ `Add a new list`（添加新列表）链接。这将带你进入列表创建界面，如图 34.2 所示。\n\n#### 图 34.2 创建列表\n\n![](img/34fig02.jpg)\n\
  \n2. 在 `List name`（列表名称）字段输入选择名称。\n3. 在 `List maintainer's address`（列表管理员地址）字段填写负责此列表的电子邮件地址。他们将收到订阅和取消订阅的通知以及投递失败的邮件。\n\
  4. `Maintenance password`（维护密码）字段中的密码可供管理员通过电子邮件更改列表配置。确保此密码不会落入他人手中，因为它授予了完全控制权。\n\
  5. 你通常不需要通过电子邮件配置列表，因为此 Webmin 模块提供了更友好的界面。\n6. 在 `Introductory message`（介绍信息）字段中的文字将在新成员订阅时发送给他们。你应该输入列表说明、投稿指南以及新订阅者可能需要的其他信息。\n\
  7. 为发送给列表的每封邮件附加页脚，请填写 `Forwarded mail footer`（转发邮件页脚）字段。页脚通常包含列表名称和取消订阅的信息。\n8.\
  \ 如果你想让此列表经过审核，将 `Moderated list?`（审核列表？）字段改为 `Yes`。审核列表是指消息在发送给列表成员之前必须经过批准的列表。\n\
  9. 如果审核员与管理员相同，将 `Moderator's address`（审核员地址）设置为 `Same as maintainer`；否则在相邻的文本字段中输入电子邮件地址。该地址将收到发送给列表的每封邮件副本。\n\
  10. 如果你想让 Majordomo 将此列表的消息存储在存档文件中，从 `Archive mailing list?`（存档邮件列表？）菜单中选择 `No`以外的任何选项。存档是列表目录下按年、月或天存储邮件的文件集合。\n\
  11. 最后，点击 `Create`（创建）按钮让模块创建列表及其所需的所有 Sendmail 别名。你将被返回主页，主页现在应该包含你新列表的图标。\n\n\
  一旦创建完成，人们就可以订阅新列表并向其发送邮件。然而，你可能在宣布其存在之前对其设置进行更多自定义。接下来的章节将解释如何操作。\n\n\n\n\n尽管人们可以自行订阅和退出邮件列表，但你也可以使用此\
  \ Webmin 模块来管理成员列表。要直接编辑成员列表，请遵循以下步骤：\n\n在模块的主页上，点击邮件列表图标。这将带你进入一个包含各种类别列表选项图标的页面。\n\
  \n点击 `List Members` 图标进入图 34.3 所示的成员管理页面。\n\n##### 图 34.3. 管理邮件列表成员。\n\n![](img/34fig03.jpg)\n\
  \n在出现的页面上，可以在文本框中添加、删除或编辑成员列表。你通过编辑此列表添加的任何新订阅者将不会收到欢迎邮件或确认消息。\n\n点击 `Save` 按钮使新成员列表生效。\n\
  \n该页面也可用于让人们订阅列表。只需在 `Subscribe address to list` 字段中输入地址并点击 `Add` 按钮即可。当通过这种方式添加成员时，他将收到通常欢迎消息，就像他通过通过向\
  \ `Majordomo@yourdomain.com` 发送邮件进行正常订阅一样。在内部，该模块通过向 `Majordomo` 发送伪造邮件来以正确的方式进行订阅，而不是直接更新包含列表的文件。\n\
  \n可以通过在 `Remove address from list` 字段中输入地址并点击 `Remove` 来从列表中删除该地址。对于订阅者来说，这种方法与直接从成员文本框中删除其地址没有区别。然而，在内部，取消订阅是通过向\
  \ `Majordomo` 发送伪造邮件完成的，告诉它从成员文件中删除该地址，而不是由 Webmin 直接更新该文件。\n\n### 34.6 编辑列表信息、头部和页脚\n\
  \n列表创建后，你仍然可以编辑创建表单上选择的描述、欢迎消息和页脚。要执行此操作，请遵循以下步骤：\n\n在模块的主页上，点击列表图标。\n\n点击 `Messages\
  \ and Description` 图标打开一个编辑描述、欢迎和信息消息的页面。\n\n要更改对用户向 `Majordomo` 地址发送 `lists` 命令响应时显示的描述，请编辑\
  \ `List description` 字段。\n\n`Informative message` 字段包含在响应 `info listname` 命令时返回的文本，可能还会发送给新订阅者。将其更改为你任何想要的内容。\n\
  \n欢迎消息通常与信息消息相同。要更改此内容，为 `Introductory message` 字段选择 `As entered below`，并在文本框中填写要发送给新订阅者的消息。\n\
  \n点击 `Save` 返回列表图标页面，然后点击 `Headers and Footers` 图标。\n\n要在所有列表消息的顶部添加头部，请填写 `Resent\
  \ email header` 字段。大多数列表不使用头部，页脚对读者来说较不烦扰。\n\n要编辑附加在列表消息底部的页脚，请更改 `Resent email\
  \ footer` 字段。\n\n如果你希望每条列表消息都添加额外的邮件头部，请填充 `Extra SMTP headers for resent mail`\
  \ 字段。这些必须符合标准的邮件头部格式，例如：\n\n```\nSubject: blah\nX-Mailing-List: example-list@example.com\n\
  ```\n\n新头部不能覆盖转发消息中的头部，它们只能在其基础上添加。如果你想更改主题或回复地址，请参见第 34.8 节“编辑转发邮件选项”。\n\n点击表单底部的\
  \ `Save` 按钮。所有新的列表信息、头部和页脚设置将立即生效。\n\n### 34.7 编辑订阅选项\n\n默认情况下，`Majordomo` 允许任何人订阅新创建的列表，并向新成员发送确认消息以确保他们确实想订阅。这些功能防止人们被他人违背意愿地订阅，但在具有信任用户的小型公司邮件列表中可能会令人厌烦。\n\
  \n要更改这些和其他订阅选项，请遵循以下选项：\n\n点击模块主页上列表的图标，然后点击 `Subscription and Moderation`。\n\n\
  `Subscribe policy` 字段控制谁可以订阅列表。选项有：\n\n- **Anyone can subscribe themselves**：选择此项时，只有当来源地址相同时才能（通过向\
  \ `Majordomo` 发送邮件）将地址添加到列表。然而，此安全功能可以通过伪造消息的源地址轻易破解，并且对于想要使用特殊地址进行订阅的人来说可能会产生干扰。\n\
  - **Anyone can subscribe anyone**：当选择此选项时，任何添加到列表的地址都将被接受。\n- **Maintainer approval\
  \ required**：此选项告诉 `Majordomo` 将所有订阅请求转发给列表管理员进行审批。如果你想控制谁可以加入列表，而不是允许任何人注册，则应使用此选项。\n\
  \n`Unsubscribe policy` 字段控制谁可以从列表中移除。其选项与 `Subscribe policy` 字段相同。\n\n要让 `Majordomo`\
  \ 向新地址发送确认订阅的消息，请将 `Require subscribe confirmation?` 字段设置为 `Yes`。在地址实际添加到列表之前，必须回复此确认消息，以表示该人员确实想订阅。除非你运行的是非常小的内部邮件列表，否则我建议始终开启此功能。\n\
  \n如果你希望将欢迎消息（创建列表时输入的）发送给所有新成员，请将 `Sent introductory message?` 字段设置为 `Yes`。\n\n\
  `Add only raw addresses to list?` 字段决定 `Majordomo` 在成员列表中存储完整地址（如 `Jamie Cameron\
  \ <jcameron@webmin.com>`）还是仅原始地址（如 `jcameron@webmin.com`）。除非你想看到与订阅者地址关联的真实，否则此字段应设置为\
  \ `Yes`。\n\n如果你希望列表管理员收到所有订阅和取消订阅请求的副本，请将 `Forward subscribe/unsubscribe requests\
  \ to maintainer?` 字段设置为 `Yes`。然而，并不意味着管理员必须批准请求。\n\n`Maintenance password` 字段中指定的密码必须包含在所有通过邮件批准订阅或更改列表配置的邮件中。它应该只提供给管理员，因为知道它的人都可以编辑列表的任何设置。\n\
  \n要要求向列表的每条消息都要审核员批准，请将 `Moderated list?` 字段设置为 `Yes`。\n\n`Moderator's address`\
  \ 字段控制向哪里发送批准列表的请求。你可以设置为 `Maintainer`（在这种情况下将使用 `Approval email address` 字段中的地址）或输入不同的内容。\n\
  \n`Moderation password` 字段用于输入密码，该密码必须包含在所有批准列表帖的邮件中。它应该仅由审核员（如果有）和你自己知道，否则订阅者可能会批准自己的帖子！\n\
  \n要更改列表所有者的地址（即向哪个邮箱发送 `listname`-owner`），请编辑 `Owner's email address` 字段。如果向订阅者的邮件无法递送，者将收到退信。\n\
  \n要更改管理员地址，请编辑 `Approval email address` 字段。所有订阅和取消订阅的通知和请求将发送给此人。\n\n最后，点击 `Save`。新设置将立即生效。\n\
  \n当列表启用确认时，任何向 `Majordomo` 地址发送 `subscribe` 命令的人都将收到一封邮件，要求他们返回一个特殊的 `auth command`。这个额外的步骤确保了被添加到列表的人确实想加入，因为\
  \ `auth command` 包含一个 `Majordomo` 与订阅地址关联的随机数。\n\n\n\n\n当启用审核或订阅/取消订阅审批时，额外的消息将发送到管理员或维护者的地址。有关如何处理这些邮件的更多信息，请参见第\
  \ 34.10 节“审核和维护邮件列表”。\n\n## 34.8 编辑转发邮件的选项\n\n当一封邮件消息被发送到列表时，Majordomo 不仅仅是原封不动地将其转发给订阅者。相反，它会根据列表配置修改头部并可能修改内容。最常见的修改是添加\
  \ `Reply-To:` 头部，这样成员的回复将发送到列表，而不是原始发送者。这通常是群组讨论列表所希望的。\n\nMajordomo 可以对列表消息执行的其他修改包括在主题行中添加某些文本以及更改优先级。要配置这些更改，请遵循以下步骤：\n\
  \n- 在模块的主页上，点击列表图标，然后点击 `Email Options`。\n- 若要向列表邮件中添加 `Reply-To:` 头部，请在 `resent\
  \ email` 字段的 `Reply-To:` 地址中输入列表的电子邮件地址（例如 `example-list@example.com`）。选择 `None`\
  \ 选项将导致读者的回复默认发送给每条消息的原始发送者。\n- 若要设置转发消息的发送者地址，请在 email 字段中填写 `Sender:` 地址。这应该是\
  \ `owner-*listname`，它会被转发到实际所有者的地址。来自订阅者返回的任何退信邮件将发送到此地址。\n- `resent email` 的 `Hostname`\
  \ 应该设置为您系统的邮件域，例如 `example.com`。保留 `Default` 选项将告诉 Majordomo 自动计算域名，它可能无法正确执行。\n\
  - 若要在每条列表消息的主题前添加特定文本，请将其输入 `resent email` 字段的 `Subject:` 前缀中。通常会添加括号中的列表名称，例如 `[example-list]`。\n\
  - 要更改列表消息的优先级，请从 `Resent email priority` 菜单中选择一个。传统上，邮件列表使用 `Bulk` 优先级，某些程序依赖此来识别列表邮件。\n\
  - 每封邮件消息都有多个 `Received` 头部，每个头部都由消息通过的邮件服务器添加。若要让 Majordomo 从转发的消息中剥除这些头部，请将 `resent\
  \ email` 字段中的 `Remove Received:` 头部更改为 `Yes`。您可能想这样做隐藏向列表发布的人的 IP 地址和其他细节。\n- 要限制发送到列表的消息大小，请填写\
  \ `Maximum allowable message size` 字段。在拥有许多成员的列表中，阻止人们发送大消息是明智的，因为转发会给您的系统和网络带来负载。`40,000`\
  \ 字节的限制对于大多数人发送到邮件列表的文本邮件已经足够了。\n\n完成编辑邮件转发选项后，点击 `Save`。只要表单没有错误，您将返回到列表选项图标页面。\n\
  \n尽管添加 `Reply-To:` 头部对大多数用户来说很方便，但有些人认为这是一个坏主意。因为几乎所有的邮件客户端都有“回复全部：”按钮用于向原始发送者和所有接收者发送邮件，因此不需要普通的\
  \ `Reply:` 按钮将邮件发送到列表。事实上，拥有 `Reply-To:` 头部让读者难以只回复给原始发送者而不是回复给整个列表。\n\n## 34.9\
  \ 编辑列表访问控制\n\nMajordomo 可以配置为限制谁可以获取列表信息、谁可以向其发帖以及他们发送的消息内容。通常，您可能希望限制发帖为列表成员或有限的人群，而不是允许世界上任何知道列表地址的人向其成员发送邮件。然而，这些发帖者限制并非完全有效，因为任何人都可以轻易伪造他们的\
  \ `From:` 地址。\n\n要控制对列表的访问，请遵循以下步骤：\n\n- 在模块的主页上，点击列表图标进入选项分类图标页面。\n- 点击 `Access\
  \ Control` 显示用于编辑信息和发帖限制的表单。\n- 页面上的前六字段可以用于限制对 `get`、`index`、`info`、`intro`、`which`\
  \ 和 `who` Majordomo 命令的访问（介绍介绍介绍）。您可能想这样做向某些或所有人隐藏列表详情。特别是，成员列表不应让潜在的攻击者可用。\n\n\
  名为 `Access to get command` 等字段具有以下选项：\n\n- `Anyone`：任何可以向 Majordomo 地址发送邮件的人都可以使用该命令。\n\
  - `List members`：该命令仅对列表成员可用，通过发送给 Majordomo 消息的 `From:` 地址识别。\n- `Nobody`：没有任何人可以使用此列表的任何命令。\n\
  \nMajordomo `lists` 命令通常返回您系统上所有邮件列表的信息。然而，`Include this list in response to lists`\
  \ 字段可用于限制查看此特定列表的发送者，如果您想从随意的查询中隐藏它，这将非常有用。可选范围有：\n\n- `Everyone`：任何可以向 Majordomo\
  \ 发送邮件的人都能看到此列表。\n- `Addresses matching regexps`：只有地址匹配相邻文本框中输入的一个 Perl 正则表达式之一的发送者才能看到此列表。\n\
  - `Addresses not matching regexps`：只有地址不匹配输入的正则表达式之一的发送者才能看到此列表。\n\n要将发帖限制为仅列表成员，将\
  \ `Who can post to the list?` 字段更改为 `List members`。这非常有意义，因为它保护了您的列表免受某些方式获得其地址的垃圾邮件发送者的侵害。\n\
  \n如果允许少数人发帖，创建一个包含他们电子邮件地址的文件，并将路径输入 `Addresses in file` 字段。此选项对于公告列表很有用，订阅者只接收信息而不能发帖。\n\
  \n要阻止包含某些单词的发帖，请使用 `Taboo body regexps` 字段。所有被禁的单词或句子必须每行输入一个，开头和结尾带有 `/`，例如 `/smeg/`。\n\
  \n也可以通过填写 `Taboo header regexps` 字段来阻止头部匹配某些正则表达式的邮件。例如，您可以输入 `*/Subject:.**/` 来阻止所有主题行中包含\
  \ *money* 单词的发帖。\n\n在该页面上完成操作后，点击 `Save` 按钮。新的限制将立即生效。\n\n## 34.10 审核和维护邮件列表\n\n\
  如果您的邮件列表需要维护者审批才能订阅或取消订阅，您将不得不处理当有人想要加入或离开列表时 Majordomo 发送的消息。这些邮件的主题行类似于 `SUBSCRIBE\
  \ example-list foo@bar.com` 或 `UNSUBSCRIBE example-list foo@bar.com`。要批准订阅，您必须向您系统上的\
  \ Majordomo 地址发送邮件，包含 `approve *password subscribe *list address` 这一行。\n\n在此命令中，`password`\
  \ 必须是在订阅和审核页面上为列表设置的维护密码，`list` 必须要添加订阅者的列表名称，`address` 必须是他的电子邮件地址。事实上，可以随时使用此命令将某人添加到列表，即使他们没有请求加入。\n\
  \n同样，要批准列表成员的取消订阅，您必须向 Majordomo 地址发送命令 `approve *password subscribe *list address`。\n\
  \n如果您是邮件列表的审核员，每当有人尝试向列表发帖时，您都会收到一封主题类似于 `BOUNCE: foo@bar.com: Approval required`\
  \ 的消息。消息正文将发送到列表地址的原始邮件，您应该阅读它以确保它是适合发布的。\n\n\n\n\n\n遗憾的是，批准消息的唯一方法是将整个邮件保存到文件中，并对其运行\
  \ `approve` 命令。例如，如果消息被保存到 `/tmp/email`，你将运行 `approve /tmp/email` 将其发送到列表。此外，你必须在你的\
  \ UNIX 家目录下创建一个名为 `.majordomo` 的文件，其中包含列表名称、其管理员密码以及 Majordomo 电子邮件地址。`.majordomo`\
  \ 文件的格式必须如下：\n\n```\nfirst-listname        first-password        Majordomo@whatever.com\n\
  second-listname       second-password       Majordomo@example.com\n```\n\nWebmin\
  \ 的未来版本希望能够简化批准流程。\n\n## 34.11 删除邮件列表\n\n如果某个列表不再被需要，你可以使用此模块轻松地删除它以及所有关联的文件和别名。成员列表、配置文件和任何存档文件都将被永久删除。要删除列表，请按照以下步骤操作：\n\
  \n1. 在模块的主页上，点击列表图标。\n2. 点击选项分类图标表格下方的 `Delete List` 按钮。将显示一个确认页面，显示 Webmin 在删除列表时将删除的文件和\
  \ Sendmail 别名。由于别名包含了任何以列表名称开头或结尾的别名，请确保没有你自己的无关别名被包含。\n3. 如需继续，点击 `Delete List`\
  \ 按钮。一旦删除完成，你将返回模块的主页。\n\n## 34.12 创建摘要列表\n\n摘要列表（Digest mailing list）是在发送给订阅者之前，将另一个列表的多个消息合并为单封邮件。摘要始终与普通列表关联，并有自己的订阅者，这些者只接收摘要格式的帖子。摘要从不审核，也不会由订阅者发布；相反，帖子发送到原始列表。\n\
  \n合并到单个摘要邮件中的消息数量可以通过其大小或时间段来确定。可以配置 Majordomo 在达到特定大小或在自第一条消息添加起经过若干天数后发送新摘要。它永远不会向摘要订阅者发送空邮件。\n\
  \n添加摘要列表的过程与添加普通列表相似，如第 34.4 节“创建邮件列表”所介绍的。要添加摘要列表，请遵循以下说明：\n\n1. 在模块的主页上，点击 `Add\
  \ a new digest list` 链接。这将带你进入列表创建表单，该表类似于图 34.2 所示。\n2. 在 `List name` 字段中为列表输入名称，例如\
  \ `example-digest`。传统上，摘要列表的名称与原始列表相同，但在名称后加上 `digest`。\n3. 从 `Make digest of list`\
  \ 菜单中选择你想以摘要形式发送的原始列表名称。虽然可以创建摘要的摘要，但在实践中这并没有用。\n4. 在 `List maintainer's address`\
  \ 字段中输入负责此列表的人员地址。\n5. 在 `Maintenance password` 字段中为管理员输入一个密码。\n6. 在 `Description`\
  \ 字段中输入此摘要的简短描述，当用户向 Majordomo 发送 `lists` 命令时，该描述将显示在其名称旁边。\n7. 在 `Introductory\
  \ message` 字段中填充消息，该消息将在所有新列表成员订阅时发送给他们。\n8. 填充 `Digest mail footer` 字段，以便在发送的每个摘要末尾添加页脚。\n\
  9. 要按定期计划发送摘要，在 `Send digest when` 字段中选择 `Oldest message is for`，并在相邻字段中输入摘要之间的天数。这假设消息正在定期发布到列表中。因为\
  \ Majordomo 仅在添加消息时检查摘要的年龄，在实践中，间隔时间可能大于指定的天数。\n10. 要在摘要达到特定大小时发送摘要邮件，选择 `Messages\
  \ total` 选项，并在相邻字段中输入摘要必须达到的最小行数。一旦超过此限制，摘要将发送给订阅者。\n11. 最后，点击 `Create` 让 Webmin\
  \ 创建新的摘要列表以及它所需的所有 Sendmail 别名。原始列表的别名也将更新以支持摘要。\n\n一旦添加了摘要列表，主页上就会该列表的图标。和普通列表一样，你可以点击它，然后点击分类图标来编辑成员列表并更改如订阅策略、页脚、`Reply-To:`\
  \ 以及 `digest@example.com` 等设置。\n\n## 34.13 编辑摘要选项\n\n创建摘要列表后，你仍然可以编辑特定摘要的选项，例如时间段或消息大小。要执行此操作，请按照以下步骤操作：\n\
  \n1. 在主页上点击你的列表图标，然后点击 `Digest Options`。\n2. 要更改用于摘要消息的主题行，编辑 `Digest title` 字段。默认情况下，这将设置为在创建表单中提供的任何内容。\n\
  3. 要定期发送摘要，在 `Oldest message age before sending` 字段中输入一个天数。如果选择了 `Unlimited` 选项，Majordomo\
  \ 在决定发送时将不考虑年龄。\n4. 要在摘要达到特定大小时发送，在 `Max digest size before sending` 字段中输入最小行数。选择\
  \ `Unlimited` 则意味着摘要永远不会通过大小发送。\n5. 每条摘要消息都有卷号（volume）和期号（issue），这些包含在主题行中。如果你愿意，可以在\
  \ `Current volume` 字段中显示当前卷，每年增加一个，并同时将期号重置为 1。\n6. `Current issue number` 字段中设置的数量会在\
  \ Majordomo 每次发送摘要时自动递增。你应该只在更改卷号时才更改此。\n7. 完成编辑摘要选项后，点击页面底部的 `Save` 按钮。任何新设置将立即生效。\n\
  \n## 34.14 编辑全局 Majordomo 选项\n\n有几个与电子邮件域和邮件程序相关的选项影响所有邮件列表，以及主 `Majordomo` 电子邮件地址。通常，你不需要调整它们，但如果需要，请按照以下步骤操作：\n\
  \n1. 在模块的主页上，点击 `Edit Majordomo Options` 按钮调出全局选项表单。\n2. `Mail server hostname`\
  \ 字段必须包含服务器的默认电子邮件域名，例如 `example.com`。可以通过邮件选项页面上的 `Hostname for resent email` 字段按列表进行覆盖，但在这里全局设置更为简单。\n\
  3. 此处输入的值设置了 Majordomo 变量 `$whereami`，它可以在随后的字段中使用。\n4. 要更改 Majordomo 命令必须发送的地址，编辑\
  \ `Majordomo master address` 字段。然而，很少需要更改，而且你必须更新实际的 Majordomo 电子邮件别名才能使其正常工作。\n\
  5. 要更改 Majordomo 管理员的地址，编辑 `Majordomo owner's address` 字段。这通常被设置为转发邮件到实际所有者地址的别名，可以更改该别名而不是此字段。\n\
  \n\n\n\n\n若要让 Majordomo 使用不同的程序发送电子邮件，请编辑 `Sendmail` 命令路径字段。你输入的任何内容都必须能够接受 `sendmail`\
  \ 命令相同的参数；然而，其他邮件服务器软件包提供的该命令的替代品大多数都能正常工作。\n\n点击 `Save` 按钮使新设置生效。\n\n### 34.15\
  \ 模块访问控制\n\n如第 52 节所述，可以赋予 Webmin 用户对某个模块的有限访问权限。授予此模块访问权限的人员可以限制为仅管理某些特定的邮件列表，并防止他们创建新列表或编辑全局的\
  \ Majordomo 选项。这允许你赋予用户编辑其所属列表的权限，而无需赋予其 root 权限（超级用户权限）或对其他邮件列表的控制权。\n\n一旦用户被授予了该模块的访问权限，请按照以下步骤限制其访问权限：\n\
  \n在 Webmin `Users` 模块中，点击用户名旁边的 `Majordomo List Manager`。这将带你进入模块访问控制表。\n\n将 `Can\
  \ edit module configuration?` 字段更改为 `No`，这样他就无法编辑 `Majordomo` 命令的路径。\n\n在 `Mailing\
  \ lists this user can manage` 字段中，选择 `Selected` 选项，并在下方框中选择他应该能够配置的列表。或者，选择 `All\
  \ lists` 让他管理所有邮件列表。\n\n将 `Can edit global options?` 和 `Can create new mailing lists?`\
  \ 字段更改为 `No`。\n\n如果 `Can edit list membership?` 字段设置为 `No`，则用户将不允许直接编辑成员列表，或在 Webmin\
  \ 内部对人员进行订阅和取消订阅。从安全角度来看，这并没有太大作用，因为用户仍然可以通过向带有列表密码的 Majordomo 地址发送邮件，来订阅他们想要订阅的任何人。\n\
  \n点击 `Save` 使限制条件生效。\n\n### 34.16 配置 Majordomo List Manager 模块\n\n`Majordomo` 模块的可配置选项分为两组：一组是控制模块操作和可以安全编辑的用户界面选项，另一组是与配置文件和程序路径相关的选项。当你点击主页上的\
  \ `Module Config` 链接时，第一组选项显示在 `Configurable options` 下，第二组显示在 `System configuration`\
  \ 下。\n\n除非你没有使用针对操作系统标准的 Majordomo 软件包，或者你正在运行除 `Sendmail` 以外的邮件服务器，否则后组字段通常不需要更改。所有配置字段的名称和含义均见表\
  \ 34.1。\n\n### 34.17 总结\n\n本章解释了什么是邮件列表，并介绍了可用于在系统上运行邮件列表的 `Majordomo` 软件包。它解释了如何设置列表、如何编辑适用于它的各种选项，以及如何对人员进行订阅和取消订阅。它还描述了如何要求列表审核，以及如果你是审核员，如何批准或拒绝消息。\n\
  \n#### 表 34.1. 模块配置选项\n\n| | |\n||||\n| 使用随机数作为列表别名 | 当你创建一个名为 `example` 的列表时，模块通常会添加一个名为\
  \ `example-list` 的邮件别名，它将邮件直接发送到列表成员文件。尽管此别名不应由 Majordomo 本身以外的任何人发送，但不法分子可能会向其发送邮件以绕过通常的审核和内容检查。为了防止这种情况，将此配置字段设置为\
  \ `Yes`。从现在起，新列表将对此特殊别名使用随机名称，试图绕过列表限制的人无法猜到。如果你不在乎或只是想为邮件列表别名使用一致的名称，请将其设置为 `No`。\
  \ |\n| 按什么排序邮件列表 | 当此字段设置为 `Name` 时，模块主页上的邮件列表图标将按名称排序。如果选择默认的 `Order create`，则它们将按照添加的顺序显示。如果你的系统中有大量列表，按名称排序会让列表的查找变得容易得多。\
  \ |\n| majordomo 文件的权限 | 此字段控制模块创建的所有新文件的权限。如果你选择 `User writable`，它们将被设置为模式 `644`。如果你选择\
  \ `User and group writable`，则将使用模式 `664`。有时，如果别名包含文件对于其所有者以外的任何人都是可写的，`Sendmail`\
  \ 就会失败，在这种情况下你必须选择 `User writable` 选项。 |\n| majordomo 配置文件的完整路径 | 此字段必须包含 `majordomo.cf`\
  \ 文件的完整路径，例如 `/usr/local/majordomo/majordomo.cf`。这是主配置文件，包含了列表文件的位置和其他全局设置。只有当你将\
  \ Majordomo 安装在与 Webmin 预期的目录时，才需要更改它。 |\n| 包含 majordomo 程序的目录 | 此字段必须设置为包含 `majordomo.pl`、`resend`\
  \ 和 `majordomo_version.pl` 等程序的目录。 |\n| majordomo 包装器的路径 | 如果 `setuid-root` 程序包装器与所有其他\
  \ Majordomo 程序位于同一目录，可以将此字段设置为 `In programs directory`。然而，如果它安装在其他地方，你必须输入程序的完整路径，例如\
  \ `/usr/bin/wrapper`。 |\n| Sendmail 别名文件 | 当选择 `Get from sendmail.cf` 时，模块将读取 `Sendmail`\
  \ 配置以查找邮件别名文件的位置。但如果你运行的是 `Postfix` 或 `Qmail` 等其他邮件服务器，这将无法工作。相反，你必须在此字段中输入服务器别名文件的路径。更多细节请参见第\
  \ 34.3 节“使用其他邮件服务器”。 |\n| 包含 sendmail 安全程序的目录 | 在某些系统中，`Sendmail` 使用 `SMRSH` 程序来限制从别名运行的程序所处的目录。由于\
  \ Majordomo 完全由别名程序驱动，模块在创建邮件列表时需要从此目录创建一个指向真实程序位置的链接。如果你在系统上使用 `SMRSH`，则此字段必须设置为受限制的目录，通常为\
  \ `/etc/smrsh`。 |\n\n## 第 35 章. MySQL 数据库\n\n本章将介绍 MySQL 数据库以及管理它的 Webmin 模块，并提供创建数据库、表和用户的指令。\n\
  \n### 35.1 MySQL 简介\n\nMySQL 是一个免费、易于使用的数据库服务器，支持多个数据库和表，并允许客户端使用 SQL 对其进行查询。对于需要使用简单数据库存储信息的应用程序程序员来说，它是最有用的。Perl、C、Java\
  \ 和 PHP 等流行语言都有访问 MySQL 数据库的 API。\n\nMySQL 服务器可以托管多个数据库，每个数据库可以包含多个表。表反又包含字段，每个字段都有类型和大小。表包含记录，每条记录通常包含关于某些对象的信息，如人员、产品或购买记录。字段可以被视为表中的列，而实际的数据记录则是行。\n\
  \nSQL（结构化查询语言）是一种用于从数据库中提取数据或更新数据的语言。几乎所有的数据库都使用 SQL，且其语法在 Oracle、PostgreSQL 和 MySQL\
  \ 等所有不同的软件包中通常是相同的。然而，本章不涵盖 SQL 语法，因为它太复杂了。有许多其他书籍专门研究它。\n\n\n\n\n与其他数据库相比，`MySQL`\
  \ 缺少一些功能。它不支持大多数表类型的事务处理，这意味着每条 SQL 命令都会立即执行且无法撤销。它无法执行某些复杂的 SQL 命令，特别是涉及嵌套查询的命令。像\
  \ `PostgreSQL` 和 `Oracle` 这样的数据库支持事务和更复杂的 SQL，并且能更有效地处理超大表。第 36 章解释了如何使用 `PostgreSQL`，但\
  \ `Oracle`（由于是昂贵的商业产品）未在本书介绍范围内。\n\n`MySQL` 软件包几乎包含在所有的 Linux 发行版中，并且可以在大多数 UNIX\
  \ 变体上编译。它在所有系统上的行为都是相同的，例外是某些版本的 `UNIX` 由于其文件系统支持更大的文件，因此支持更大的表空间尺寸。在标准的 `ext2`\
  \ 或 `ext3` Linux 文件系统上，表的大小不能超过 4 GB。然而，Webmin `MySQL` 模块在所有操作系统上的行为将完全相同。\n\n`MySQL`\
  \ 分为两部分：管理包含表和记录的实际文件的服务器，以及与服务器通信的客户端程序。标准的 `mysql` 客户端程序允许用户执行 SQL 命令并显示结果，而 `mysqladmin`\
  \ 程序用于执行基础管理任务，`mysqldump` 程序用于制作备份。其他查询数据库的应用程序（如 Webmin 本身）也是客户端。\n\n实际存储表的文件位于类似\
  \ `/var/lib/mysql` 或 `/usr/local/mysql/var` 目录下的子目录下。这些文件不会被 `MySQL` 服务器以外的任何程序读写，除非服务器进程已关闭，否则不应为了备份而对其复制。\n\
  \n### 35.2 MySQL 数据库服务器模块\n\n此模块允许你通过简单的网络界面创建数据库、表和字段，编辑记录并管理 `MySQL` 用户。你可以在 Servers（服务器）类别下找到它的图标，点击它后，模块的主页将显示现有数据库的图标列表，如图\
  \ 35.1 所示（假设 `MySQL` 已安装并运行）。\n\n#### 图 35.1. MySQL 数据库服务器模块主页。\n\n![](img/35fig01.jpg)\n\
  \n如果 `MySQL` 服务器进程未运行，主页上将显示 `MySQL is not running on your system` 消息。要启动它，只需点击页面底部的\
  \ Start MySQL Server 按钮。如果你将来以后要使用该数据库，请使用 Bootup and Shutdown 模块（见第 9 章）让它在启动时运行。在\
  \ Linux 系统上，`MySQL` 软件包可能包含一个你可以轻松启用的 `mysql` 动作。\n\n如果数据库服务器正在运行，但 Webmin 不知正确的登录密码，主页将显示\
  \ MySQL 登录表单。你应该在 Login 字段中输入管理员用户名（通常为 `root`），并在 Password 字段中输入相应的密码。虽然可以输入任何\
  \ `MySQL` 用户名和密码，但非 root 用户无法执行创建数据库和表等任务，因此该模块也无法执行。\n\n默认情况下，该模块配置为使用你发行版 `MySQL`\
  \ 软件包默认使用的用户名和密码登录。只有当你手动或通过 Webmin 更改它时，才会出现 MySQL 登录页面。\n\n如果你的系统中完全没有安装数据库服务器，主页将显示类似\
  \ `The MySQL client program /usr/bin/mysql was not found on your system` 的错误消息。检查你的发行版\
  \ CD 或网站获取所有相关的 `MySQL` 软件包，并使用 Software Packages 模块安装它们。通常有多个包，名称类似于 `mysql`、`mysql-client`、`mysql-server`\
  \ 和 `mysql-devel`。每个 Linux 发行版似乎使用不同的包组合，因此确保安装所有它们。\n\n在 FreeBSD 和 NetBSD 上，该模块要求已安装对应操作系统的\
  \ `MySQL` 软件包。在其他 UNIX 变体上，它假设你已经从源码编译并安装了 `MySQL`，源码可以在 [www.mysql.com/](http://www.mysql.com/default.htm)\
  \ 获取。\n\n即使你已经安装了 `mysql` 程序，如果模块仍然报错找不到它，你需要调整它使用的路径。这在你从源码安装而不是使用 Linux 发行版自带的包时可能会发生。详情请参阅第\
  \ 35.14 节“Configuring the MySQL Database Server Module”。\n\n`MySQL` 模块使用 SQL 命令来执行创建表、添加字段和编辑记录等操作。Webmin\
  \ 必须连接到数据库服务器才能执行这些命令，可以通过两种方式实现：它可以带有正确的参数运行 `mysql` 命令并解析其输出，或者使用 Perl `DBI` 库直接连接。\n\
  \n前者方法始终可用，因为只要数据库服务器存在，`mysql` 命令就会被安装。然而，它并不完全可靠，因为某些类型的表数据产生的输出并不总是可以解析。出于此原因，你应该安装\
  \ `DBI` 和 `DBD::mysql` Perl 模块。如果缺少任何一个，主页底部将显示一条消息，提示你点击链接安装一个或两个。这将带你进入 Perl Modules\
  \ 模块（见第 27 章）中的一个页面，在那里为你下载并安装 `DBI` 和/或 `DBD::mysql`。\n\n### 35.3 创建新数据库\n\n首次安装\
  \ `MySQL` 时，会创建一个名为 `mysql` 的数据库，其中包含身份验证和访问控制相关的表。如果你想存储自己的数据，最好创建一个自己的数据库并向其中添加表，而不是动动\
  \ `mysql` 数据库。\n\n要执行此操作，请遵循以下步骤：\n\n1. 在模块的主页上，点击现有数据库图标上方或下方的 Create a new database\
  \ 链接。这将带你进入输入新数据库详情的表单。\n2. 在 Database name 字段中为新数据库输入名称。名称应只包含字母和数字，不能有空格。\n3.\
  \ 可以使用表单为新数据库创建一个初始表。不过，正如第 35.4 节“Creating a New Table”所解释的那样，你也可以在创建后轻松地添加。\n\
  4. 点击表单底部的 Create 按钮创建数据库。你将返回到模块的主页，主页现在将包含一个新的数据库图标。\n\n### 35.4 创建新表\n\n可以随时将表添加到新创建或现有数据库中。每个表都有一个或多个字段，每个字段都有一个类型（如整数、小数或文本）和大小。字段还可以建立索引，以加速根据该列列值查找记录的\
  \ SQL 查询。\n\n要向数据库添加新表，请遵循以下步骤：\n\n1. 在模块的主页上，点击数据库图标。这将带你进入如图 35.2 所示的数据库编辑页，其中包含每个现有表的图标和执行各种操作的按钮。\n\
  \n#### 图 35.2. 数据库编辑页。\n\n![](img/35fig02.jpg)\n\n2. 在 Create a new table 按钮旁的 Fields\
  \ 框中输入你的新表所需的字段数量，然后点击该按钮。这将弹出输入新表详情及其初始字段的表单。\n3. 在 Table name 字段中为此表输入名称。它应由字母、数字和\
  \ `_` 字符组成，并且在此数据库内是唯一的。\n4. 若要从现有表复制字段，请从 Copy fields from table 菜单中选择它。你在下方 Initial\
  \ fields 表中输入的任何额外字段都将添加在复制字段之后。\n5. Table type 菜单可用于此表选择不同的存储类型。最常用的类型有：\n\n\n\n\
  \n# 表类型\n\nMyISAM 这是适用于 `MySQL` 3.23 及以上版本的标准表类型。在支持大文件的操作系统上，此类大小的表可达约 2,000,000,000\
  \ GB。表文件独立于操作系统，键长度可达 500 字节，单个表内可使用 32 个键列。\n\nISAM 这是一个旧的标准 `MySQL` 表类型，现在已被 `MyISAM`\
  \ 取替。`ISAM` 表文件大小只能为 4 GB，键长度只能为 256 字节，表最多可以有 16 个键列。\n\nHeap `Heap` 表中的数据仅存储在内存中。这使得它们非常快，但仅适用于临时数据，因为如果关闭\
  \ `MySQL`，表的内容将会丢失。\n\n如果您选择 `Default`（默认）选项，或者所选类型不受系统上的 `MySQL` 支持，则将使用 `MyISAM`\
  \ 类型。\n\n# 初始字段区域\n\n`Initial`（初始）字段区域用于输入新表将包含的实际字段详细信息。您填写的每行都根据您在以下每个标题下输入的值定义单个字段：\n\
  \n### 字段名称\n您应该为此字段选择一个唯一的名称，名称应由字母、数字和 `_` 字符组成。选择与 SQL 保留字（如 `select`、`update`\
  \ 或 `index`）相同的名称不是好主意。\n\n### 数据类型\n您必须从此菜单中选择此字段数据的类型。最常见的是 `varchar`（用于变长文本字符串）和\
  \ `int`（整数）。请参见第 35.6 节“字段类型”获取完整的支持类型列表。\n\n### 类型宽度\n这指的是存储在该字段中的数据的大小。其含义取决于具体类型。例如，对于\
  \ `varchar` 字段，宽度是最大文本长度；但对于 `int` 字段，它是最大小数位数。再次强调，第 35.6 节“字段类型”更详细地涵盖了宽度。\n\n\
  如果您留空此文本框，将使用默认宽度。许多类型（如 `blob`、`text` 和 `date`）具有固定大小，因此不应输入宽度。\n\n### 主键？\n如果勾选此框，则该字段将成为表主键的一部分。`MySQL`\
  \ 会对键字段进行索引，以便在 `where` 子句中引用表中所有主键的 SQL 语句运行得更快。然而，两个记录的主键字段不能具有相同的值。\n\n按照传统，表的第一个字段是键。通常并不是所有类型都可以这样使用，主键字段通常是\
  \ `int` 或 `varchar`。所有表都应该有一个主键，以便在 `Webmin` 中对其数据进行编辑。\n\n### 自动递增？\n如果数值字段勾选了此选项，每当添加记录时，`MySQL`\
  \ 都会自动插入一个比表中最大值大 1 的数字（除非记录创建语句显式指定了值）。这对于自动生成 ID 很有用，并且通常为主键字段启用。\n\n输入所有字段后，点击表单底部的\
  \ `Create`（创建）按钮。由于某些原因无法创建表，将显示来自 `MySQL` 的 SQL 错误消息。这可能发生在字段名称无效或类型宽度对于该类型没有意义的情况下。如果发生这种情况，请使用浏览器的“后”按钮返回表单并修复问题。\n\
  \n表成功创建后，您将返回数据库编辑页面，该页面现在将包含一个新的新表图标。\n\n### 35.5 添加和编辑字段\n\n可以向表中添加新字段，并对现有字段进行更改或删除。添加字段对现有数据没有风险，但更改类型或大小可能会有风险，删除字段会导致其包含的数据丢失。\n\
  \n要添加新字段，请按照以下步骤操作：\n\n1. 在模块主页上，点击包含该表的数据库图标，然后点击表图标。这将显示图 35.3 所示的页面，其中列出了所有现有字段的名称、类型和其他细节。\n\
  \n##### 图 35.3. 表编辑页面。\n\n![](img/35fig03.jpg)\n\n2. 在点击 `Add field of type`（添加类型字段）按钮之前，从旁边的菜单中为新字段选择类型。参见第\
  \ 35.6 节“字段类型”获取类型列表及其用途。\n\n3. 在出现的字段添加表单上，在 `Field name`（字段名称）文本框中为此字段输入唯一名称。同一表的两个字段名称不能相同，只能使用字母、数字和\
  \ `_`。\n\n4. 如果您正在添加 `char` 或 `varchar` 字段，必须在 `Type width`（类型宽度）文本框中输入最大字符数。\n\n\
  5. 如果添加 `float`、`double` 或 `decimal` 字段，必须在 `Width` 和 `decimals` 文本框中输入两个数字。第一个是值可以包含的总数字位数，第二个是小数点右侧位数。对于负数，负号计作一个数字，因此\
  \ `Width` 和 `decimals` 设置为 5 和 2 的字段可以存储 99.99 到 99.99 之间的数字。\n\n6. 对于 `date`、`datetime`、`time`、`blob`\
  \ 和 `text` 字段，没有任何宽度输入，因为这些类型具有固定或无限的大小。\n\n7. 对于 `enum` 和 `set` 字段，必须在 `Enumerated\
  \ values`（枚举值）文本框中输入可能值的列表。\n\n8. 对于所有其他字段类型（如 `int`），`Type width` 可以设置为 `Default`（默认）以便字段使用所选类型的默认大小，也可以输入宽度。对于\
  \ `int` 字段，这是值可以包含的最大数字位数。\n\n对于整数类型（如 `int` 和 `smallint`），`Type options`（类型选项）单选按钮允许您选择此字段中的值应该是保留零（`Fill\
  \ with zeros` 选项）还是无符号（`Unsigned` 选项）。如果选择 `None`（无），值将是有符号且不会添加额外的零。\n\n对于 `float`、`double`\
  \ 和 `decimal` 字段，同样显示 `Type options`，但没有 `Unsigned` 选项。这些字段始终是有符号的。\n\n对于 `char`\
  \ 和 `varchar` 字段，`Type options` 有两个选择：`Case sensitive`（大小敏感）和 `Case insensitive`（大小不敏感）。如果选择\
  \ `insensitive`，匹配此字段值的 SQL 查询将忽略大小写。\n\n要防止向此字段插入 SQL `NULL` 值，将 `Allow null?`（允许为空？）改为\
  \ `No`。如果每个记录都有此字段的值且该字段必须作为主键的一部分，则必须这样做。\n\n要在向表记录且未指定此字段值时插入默认值，请填写 `Default\
  \ value`（默认值）文本框。自然地，该值必须符合字段的类型。\n\n如果您的表已某些行，在添加新字段时，这些行的字段值将设置为您在此处输入的内容。\n\n\
  将 `Part of primary key?`（主键的一部分？）选择改为 `Yes`，如果该字段将作为表的键。多个字段可以是键的一部分，在这种情况下，键是所有字段的组合。\n\
  \n最后，点击 `Create`。如果您的输入没有错误，字段将添加到表中，您将返回到图 35.4 所示的表编辑页面。\n\n##### 图 35.4. MySQL\
  \ 用户列表。\n\n![](img/35fig04.jpg)\n\n可以通过下一组步骤来编辑新创建或现有字段。然而，更改字段类型或减小其大小，如果旧值与新类型兼容，可能会导致数据丢失。例如，将\
  \ `varchar` 转换为 `int` 会导致所有非数值丢失；然而，将 `int` 转换为 `varchar` 只要新大小足够通常是。\n\n1. 在模块主页上，点击包含该表的数据库图标，然后点击表图标。\n\
  \n2. 点击要修改的字段的名称进入字段编辑表单。\n\n3. 要重命名字段，请编辑 `Field name` 文本框。\n\n\n\n\n要更改字段类型，请从数据类型（Data\
  \ type）菜单中选择一个新类型。如上所述，此操作应谨慎进行。\n\n根据当前类型，将显示不同的输入项来编辑其大小。这些输入与前面的字段创建说明中第 4 步所解释的相同。\n\
  \n增加字段的大小不会损坏其包含的任何数据，但如果缩小大小，超过新长度的值将被截断。\n\n`Type`（类型）选项、`Allow nulls?`（允许为空？）、`Default\
  \ value`（默认值）和 `Part of primary key?`（是否作为主键的一部分？）输入的含义在此与字段创建步骤中的含义相同。如果您想对现有字段调整这些选项，请进行更改。\n\
  \n完成后，点击表单底部的 `Save`（保存）按钮。字段将立即更新，其包含的任何数据将根据情况被修改或截断。\n\n可以通过点击字段编辑表上的 `Delete`（删除）按钮而不是\
  \ `Save` 来删除现有字段。其包含的任何数据将立即永久删除。当然，您不能删除表中的最后一个字段。\n\n### 35.6 字段类型\n\nMySQL 支持与其他\
  \ SQL 数据库大多数相同的字段类型。表 35.1 列出了 Webmin 已知的所有类型，并对每种类型进行了简短描述。\n\n较版本的 MySQL 可能会引入更多类型，但在编写此时，这些是\
  \ Webmin 中新建或修改字段可以使用的唯一类型。尽管如此，您仍然能够编辑不支持的类型字段中的数据。\n\n### 35.7 查看和编辑表内容\n\nMySQL\
  \ 模块允许您查看任何数据库中任何表的内容。具有主键的表可以修改或删除记录，并添加新记录。\n\n#### 表 35.1. MySQL 字段类型及其用途\n\n\
  | 类型 | 描述 |\n| --- | --- |\n| `int` | 存储单个整数，可以是带符号或无符号的。`int` 字段最多可以存储 `2³¹` 到\
  \ `+2³¹` 范围内的数字，但可以在添加字段时指定最大数字位数来进一步限制。 |\n| `tinyint` | 类似于 `int`，但只能存储 128 到\
  \ `+127` 范围内的数字。 |\n| `smallint` | 类似于 `int`，但只能存储大约 `32768` 到 `+32767` 范围内的数字。\
  \ |\n| `mediumint` | 类似于 `int`，但只能存储大约 `2²³` 到 `+2²³` 范围内的数字。 |\n| `bigint` | `bigint`\
  \ 类似于 `int`，但支持大得多的范围 `2⁶³` 到 `+2⁶³`。 |\n| `float` | 存储非整数，使用可能不精确的浮点格式。当添加此类类型的字段时，您必须指定内部存储它时使用的字节数，这将更改\
  \ `float` 字段可以支持的精度位数。默认情况下，`float` 占用 4 字节。如果插入的数字多于 `float` 能表示的，它将被舍入到最近的支持值。由于由于原因，不应使用此类类型的字段存储必须精确记录的数字（例如金额）。相反，应使用\
  \ `decimal` 字段（具有特定的小数精度）。您还必须指定 `float` 字段存储和显示的小数后位数。如果插入了具有更多小数位的值，它将被舍入。 |\n\
  | `double` | `double` 字段类似于 `float`，区别在于它使用 8 字节进行内部存储，因此可以存储具有更多数字的值。 |\n| `decimal`\
  \ | 此类型的字段可以存储具有特定小数精度的非整数。添加时，您必须输入要存储的总位数和数点右侧位数。任何使用更多数字的插入值都将被截断或舍入。由于 `decimal`\
  \ 字段内部以字符串形式存储，在数学 SQL 表达式中使用它们的速度不如使用 `float` 或 `double` 快。然而，它们具有保证的已知精度。 |\n\
  | `date` | `date` 字段存储日、月、年。年份始终采用 4 位格式，如果您尝试插入带有 2 位年份的日期，MySQL 将通过增加 1900 或 2000\
  \ 将其转换为 4 位，取决于年份在 1970 年之前还是之后。可以存储 1000 年到 9999 年之间的任何有效日期。在显示或插入时，日期始终使用 `YYYY-MM-DD`\
  \ 格式，例如 `1970-01-24`。 |\n| `datetime` | 与 `date` 字段类似，这种类型还存储时间。对于插入或显示，`datetime`\
  \ 字段必须始终使用 `YYYY-MM-DD HH:MM:SS` 格式。 |\n| `timestamp` | 此类型的字段通常用于存储记录最后修改的日期和时间。除非显式指定值，否则\
  \ MySQL 在每次插入或更新记录时会将任何 `timestamp` 字段更新为当前时间。内部，`timestamp` 字段使用 `UNIX` 时间格式，这意味着它们被限于\
  \ 1970 年到 2037 年。显示时，始终使用 `YYYYMMDDHHMMSS` 格式。 |\n| `time` | `time` 字段仅存储不带日期的时间。显示和更新始终使用\
  \ `HH:MM:SS` 格式。由于它们也可以表示流逝的时间，因此小时范围可以从 838 到 `+838`。 |\n| `year` | 这种字段用于存储 4\
  \ 位年份，但仅限于 1901 到 2155 范围。 |\n| `char` | 此类型存储长到指定长度的字符字符串。内部，`char` 字段中的任何值都会在右侧填充空格，在显示时会被移除。这意味着如果您添加大小为\
  \ 100 的 `char` 字段，每行将占用 100 字节。此类类型字段的最大大小为 255。 |\n| `varchar` | 存储变长字符字符串，最多到添加字段时指定的最大值。内部使用的字节数取决于插入的数据量，而不是固定为指定的大小。与\
  \ `char` 类似，最大大小为 255 个字符。在几乎所有情况下，`varchar` 是比 `char` 更好的字段类型，应用于所有短文本字符串。 |\n\
  | `blob` | `blob`（二进制大对象）可以存储最多 `2¹⁶` 字节的任何数据。内部使用的字节数与插入的数据量成正比。 |\n| `text` |\
  \ 此类型类似于 `blob`，但用于存储文本。两者之间最大的区别是，text 字段是不区分大小写进行排序和比较的，而 blob 字段是区分大小写的。 |\n\
  | `tinyblob` | 类似于 `blob`，但只能存储 256 字节的数据。 |\n| `tinytext` | 类似于 `text` 字段，但只能存储\
  \ 256 字节的文本。 |\n| `mediumblob` | 类似于 `blob`，但可以存储更多数据——确切说是 `2²⁴` 字节。 |\n| `mediumtext`\
  \ | 类似于 `text` 字段，但可以存储 `2²⁴` 字节的文本。 |\n| `longblob` | 一种更大的 blob，可以包含高达 `2³²` 字节的数据。\
  \ |\n| `longtext` | 更大的 text 字段，可以包含高达 `2³²` 字节。 |\n| `enum` | `enum` 字段存储单个文本值，该值必须是添加或修改字段时指定的列表的成员。允许最多\
  \ 65535 个不同的可能值。 |\n| `set` | `set` 类型类似于 `enum`，但此类类型的字段可以从允许列表中存储 0 到 64 个不同的值，而不是单个值。\
  \ |\n\n遗憾的是，没有方法在没有键的情况下编辑表的内容，因为模块需要某种方法识别特定记录。然而，数据库中的所有表都应该有一个键。\n\n要查看表的内容，请遵循以下步骤：\n\
  \n1. 在主页上，点击包含该表的数据库图标，然后点击表本身的图标。\n2. 在表编辑表单上，点击底部的 `View Data` 按钮。这将带您进入显示表中前\
  \ 20 行的页面。\n\n\n\n如果表格包含的行数超过了单页可显示的行范围，顶部将显示可见范围的起始和结束位置以及总行数。旁边有左右箭头，用于移动到下一组或上一组\
  \ 20 条记录。\n\n对于大型表格，页面底部还会显示一个搜索表。要使用该表，请从第一个菜单中选择字段名，从第二个菜单中选择比较类型，并在最后一个文本框中输入要搜索的值。点击\
  \ `Search` 按钮后，仅显示匹配所选字段的行。要切换回查看所有记录，点击现在表格上方出现的 `Reset search` 链接。\n\n`contains`\
  \ 比较类型查找字段包含所输入文本的记录，而 `matches` 类型则查找字段值匹配 SQL 模式（如 `like` 子句中使用的模式）的记录。在这种模式中，`%`\
  \ 匹配任何字符字符串，`_` 匹配任何单个字符，就像 shell 提示符中的 `*` 和 `?` 一样。\n\n在查看大型表格时，页面底部还会显示一个标记为\
  \ `Jump to` 的按钮。如果在相邻字段中输入数字并点击按钮，显示将立即跳转到该行。\n\n如果表格具有主键，也可以使用此页面编辑、删除或添加记录。必须先使用每行右侧的复选框或\
  \ `Select all` 和 `Invert selection` 链接来选择要编辑的记录。点击 `Edit selected rows` 按钮后，页面将重新显示并将所有所选记录的值显示在文本框中。进行您需要的任何更改并点击页面底部的\
  \ `Save` 按钮更新数据库。如果您想停止编辑而不保存修改，请按 `Cancel`。\n\n要删除记录，请使用相同的复选框和选择链接选中它们，并点击 `Delete\
  \ selected rows` 按钮。所选记录将立即从数据库中删除，不再进行确认。\n\n要添加新记录，点击表格下方的 `Add row` 按钮。将出现额外的行，其中包含空文本框供您输入新详情。点击\
  \ `Save` 将将新记录添加到表格中并移动显示，以便您看到新行。如果您改变了主意不再添加记录，也可以点击 `Cancel`。\n\n记录通常在表格相应列的文本字段中进行编辑或添加。然而，如果您正在编辑一个包含\
  \ blob 或文本字段的表格，或者启用了 `Use vertical row adding interface module` 配置选项，则将使用不同的布局。字段的文本框将列在表格内部或下方的单独框中，右侧带有字段名标签。对于文本或\
  \ blob 字段，将显示文本框，以便您在必要时输入多行文本。\n\n### 35.8 删除表格和数据库\n\n从数据库中移除表格时，其包含的所有记录和字段将丢失。您可以移除任何表格，但删除\
  \ `mysql` 数据库中的表是一个坏主意，因为它们包含了重要的 MySQL 访问控制信息。\n\n要删除表格，请按照以下步骤操作：\n\n1. 在模块主页上，点击要移除表格的数据库图标，然后点击表本身的图标。\n\
  2. 点击字段列表下方的 `Drop Table` 按钮。这将带您进入确认页面，询问您是否确定，并告诉您将删除多少条记录。\n3. 如需继续，再次点击 `Drop\
  \ Table` 按钮。一旦删除完成，您将返回数据库中剩余表格列表。\n\n也可以删除整个数据库及其其中所有的表格和记录。任何数据库都可以被移除，但删除 `mysql`\
  \ 数据库是一个非常糟糕的主意。如往常，除非您已进行备份，否则无法撤销删除。\n\n假设您确实想删除数据库，请按照以下步骤操作：\n\n1. 在主页上，点击您想要移除的数据库图标。\n\
  2. 点击表格列表下方的 `Drop Database` 按钮。将显示确认页面，告诉您如果继续操作将丢失多少个表和记录。\n3. 要继续删除，点击 `Drop\
  \ Database` 按钮，完成后您将返回模块主页。\n\n或者，您也可以通过点击 `Just delete all tables` 来移除所有表格及其记录。数据库本身将保持为空。\n\
  \n### 35.9 执行 SQL 命令\n\nMySQL 模块还提供了一个简单的接口，用于在数据库上运行 SQL 命令并显示其输出。要使用它，请遵循以下说明：\n\
  \n1. 在主页上，点击您想要运行命令的数据库图标。\n2. 表图标列表下方的 `Execute SQL` 按钮。这将带您进入一个输入 SQL 命令、运行命令文件以及向数据库加载数据的页面。\n\
  3. 在页面顶部的文本框中输入任意 SQL 命令并点击 `Execute` 按钮。如果您的 SQL 语法错误或命令无法执行，将显示来自 MySQL 的错误信息。否则，将显示\
  \ SQL 的结果表（如果有的话）。只有 `SELECT` 语句产生结果；`UPDATE`、`INSERT` 和其他修改记录的命令不会产生。\n\n查看完结果后，使用\
  \ `Return to Execute SQL` 表单返回表单。\n\n每个成功执行的命令都会添加到数据库的历史记录中。您可以通过留空文本框并从下方的菜单中选择它，然后点击\
  \ `Execute` 来重新运行之前的 SQL 命令。\n\n要清除命令历史，请点击 `Clear History` 按钮。如果历史中充满了您不需要重用的旧语句，这会非常有用。\n\
  \n同一页面也可以用于从文本文件运行多个命令并显示其输出。由于该过程与恢复备份完全相同，因此在第 35.10 节“备份和恢复数据库”的恢复部分进行了说明。\n\n\
  ### 35.10 备份和恢复数据库\n\n如果您的某个数据库包含重要信息，应该定期进行备份，以防磁盘故障或 SQL 错误导致数据丢失。在执行某些潜在风险的操作之前（例如更改字段类型或运行修改大量记录的复杂\
  \ SQL 语句），创建备份也是一个好主意。\n\n要使用该模块进行备份，请按照以下步骤操作：\n\n1. 在主页上，点击您想要备份的数据库图标。\n2. 点击表格列表下方的\
  \ `Backup Database` 按钮。这将带您进入输入备份目标和选项的表单。\n3. 在 `Backup to file` 字段中，输入写入备份的文件完整路径，例如\
  \ `/tmp/backup.sql`。如果文件已存在，将被覆盖。\n4. 要将备份限制为某些记录，取消勾选 `Only backup rows matching\
  \ where clause` 字段的 `All rows` 选项，并在相邻字段中输入 SQL `WHERE` 子句，例如 `foo = \"bar\"`。这仅在子句对数据库中的所有表有效时起作用，因此所有表都需要一个\
  \ `foo` 字段。\n5. 如果 `Add drop table statements to backup?` 字段设置为 `Yes`，则备份将包含 SQL\
  \ 语句，在恢复时删除同名的现有表。这意味着如果您在另一个系统上恢复它，这些表中的数据将与备份中的新数据替换。如果选择 `No`，恢复的数据将添加到任何已存在的数据中。\n\
  \n最佳选择实际上取决于您尝试做什么。对于普通备份，您应该选择 `Yes`，以便在恢复备份时移除任何损坏或冲突的数据。然而，如果您正将记录传输到另一个系统或数据库，则应选择\
  \ `No`，以免丢失目标表中的现有记录。\n\n\n\n要开始备份，点击表单底部的 `Backup Now` 按钮，将显示一个显示成功或失败的页面。\n\n\
  事实上，MySQL 备份文件只是 SQL `CREATE TABLE` 和 `INSERT` 语句的列表，运行这些语句时，会将数据库恢复到备份时的状态。虽然这比使用压缩率更高的二进制格式占用更多的磁盘空间，但它允许你根据意愿轻松查看和修改文件。这意味着由于文件仅包含\
  \ ASCII 文本，因此备份文件可以在具有不同架构的系统上使用。\n\n如果你有一个用于重要生产目的的数据库，应该定期进行备份，例如每天一次。你不需要每天都遵循前面的说明，而是可以使用\
  \ `Scheduled Cron Jobs` 模块（第 10 节介绍）来创建一个为你自动执行备份的任务。要确定要运行什么命令，请先按照前面的说明进行备份，然后访问\
  \ `Webmin Actions Log` 模块（第 54 节介绍）查看它使用的命令。\n\n一旦创建了备份文件，它可以在同一系统或运行 `MySQL` 的另一个服务器上进行恢复。取决于备份时\
  \ `Add drop table to backup?` 字段的设置，任何与备份文件中表名同名的现有表的内容可能会被删除。因此，通常情况下，只有当表不存在或包含你想要覆盖的过时或无效数据时才进行恢复。\n\
  \n由于备份文件只是 SQL 语句的列表，恢复过程仅涉及运行文件中的所有命令。这意味着你也可以使用相同的步骤来执行你自己的命令文件：\n\n1. 在模块的主页上，点击要恢复备份的数据库图标。\n\
  2. 点击 `Execute SQL` 按钮，并向下滚动到 `Select SQL commands file to execute on database`\
  \ 部分。\n3. 如果备份文件位于运行 `MySQL` 和 `Webmin` 的系统上，选择 `From local file` 选项并在相邻的文本框中输入文件的完整路径。\n\
  4. 如果备份位于运行浏览器的 PC 上，选择 `From uploaded file` 并使用 `Browse` 按钮选择备份文件。\n5. 点击 `Execute`\
  \ 按钮恢复备份或执行文件中的 SQL 命令。随着执行的进行，将显示一个列出 `MySQL` 所有输出的页面。通常情况下，除非发生错误或文件包含 `SELECT`\
  \ 语句，否则将没有任何输出。\n\n### 35.11 管理 MySQL 用户\n\n你的 `MySQL` 数据库服务器要求所有客户端在执行 SQL 命令之前，必须使用用户名和密码进行身份验证。它有自己的用户、密码和权限表，当客户端尝试登录时会查询这些表，而不是\
  \ UNIX 用户文件 `/etc/passwd` 和 `/etc/shadow`。可以为每个用户定义详细权限，以限制其使用的 SQL 语句类型、可以连接的客户端主机以及可以修改的数据库、表和字段。\n\
  \n通常在首次安装 `MySQL` 后，只有 `root` 用户能够登录。该用户具有访问所有数据库和表并执行所有操作的权限，因此通常用于管理目的。如果你想编写一个使用数据库的应用程序，最好为该目的创建另一个用户，并设置应用程序以此用户的身份登录。\n\
  \n标准的 `MySQL` 安装还会创建一个没有密码的 `Anonymous` 用户，该用户对以 `test` 开头的数据库具有访问权限。此特殊用户用于任何未找到其他匹配用户的登录尝试。本章稍后部分将详细解释匿名用户。\n\
  \n要添加用户，请遵循以下步骤：\n\n1. 在模块的主页上，点击 `User Permissions` 图标。这将带你 cu 进入一个列出现有用户的页面，如图\
  \ 35.4 所示。\n2. 点击表格上方或下方的 `Create a new user` 链接进入用户创建表单。\n3. 在 `Username` 字段中，选择第二个单选按钮并为该用户输入名称。尽管可以创建多个同名条目（后文介绍），但此新条目应该是唯一的。\n\
  4. 假设你想让用户拥有密码，将 `Password` 字段更改为 `Set to` 并在相邻字段中输入密码。如果你选择 `None`，则不需要提供密码，使用密码登录的尝试将被拒绝。\n\
  5. 要允许此用户仅从特定主机登录，选择 `Hosts` 字段中的第二个单选按钮并在文本框中输入主机名。主机名必须与客户端 IP 地址的反向查询返回的主机相同，这通常是一个像\
  \ `pc.example.com` 这样的完整主机名，而不是简单的 `server`。你也可以输入 IP 地址或主机名/IP 地址 SQL 模式如 `%.example.com`。要允许用户仅从运行数据库服务器的同一系统连接，请输入\
  \ `localhost` 作为主机。\n6. 如果选择了 `Any`，该用户将能够从任何主机连接。创建指定了主机的用户时要小心。如果他尝试从其他地方连接，且存在具有匹配主机的\
  \ `Anonymous` 用户，他将作为 `Anonymous` 用户的身份登录！\n7. 在 `Permissions` 列表中选择你允许用户执行的操作条目。对于应用程序用户，能够选择\
  \ `select`、`insert`、`update` 和 `delete` 记录通常足够了。绝不应给予不受信任的用户 `Drop tables` 之外的权限，因为这将允许他破坏数据库、访问任意文件或增强自己的权限。\n\
  8. 如果用户没有任何权限，他将无法连接，除非已为特定的数据库或主机授予了权限（如第 35.12 节“管理数据库、主机、表和字段权限”所述）。\n9. 要创建用户，点击页面底部的\
  \ `Save` 按钮。新的 `MySQL` 登录账户将立即可用，并具有根据第 6 步中指定的权限访问所有数据库和表的权限。有关如何限制用户仅访问某些数据库或表的信息，请参见第\
  \ 35.12 节“管理数据库、主机、表和字段权限”。\n\n当客户端尝试登录时，`MySQL` 会在用户列表中搜索第一个匹配的用户和主机。服务器总是先检查特定主机名的条目，然后是允许任何主机的条目，最后是针对特定用户的\
  \ `Anonymous` 用户条目。这意味着，一个用户即使在用户列表中具有更高的权限，最终也可能获得 `Anonymous` 权限。由于这可能会引起混乱，除非完全理解其影响，否则我删除所有\
  \ `Anonymous` 用户条目。\n\n为同一用户创建多个条目是可能的且有用的，只要它们具有不同的主机。例如，如果你想允许用户 `fred` 仅从 `server.example.com`\
  \ 和 `www.foo.com` 客户端登录，你需要创建两个 `fred` 的条目，并设置不同的 `Host` 字段。然而，它们应该具有相同的密码和权限，除非你想根据用户连接的主机要求不同的密码或授予不同的权限。\n\
  \n可以通过点击列表中的名称来编辑新旧现有用户，这会弹出一个与创建用户时使用的表单几乎相同的编辑表单。唯一的区别是 `Password` 字段有一个 `Don't\
  \ change` 选项，如果用户有密码，则选中该选项，这告诉 Webmin 在保存用户时保持密码不变。进行更改后，点击表底部的 `Save` 按钮更新数据库中的用户。或者，点击\
  \ `Delete` 按钮将其删除。如果同一个用户有多个条目，在更改密码或权限时，你必须逐一更新它们。\n\n\n\n除非你已经创建了另一个完全权限的管理员用户，否则不应删除\
  \ `root` 用户。因为此 Webmin 模块通常以 `root` 本身身份登录，修改或删除此用户可能会迫使你重新登录 MySQL，正如本章开头该模块介绍部分解释的那样。通过删除\
  \ `root` 用户或移除其权限，可能会让你失去对数据库的访问权限，这只能使用 `mysqladmin` 等命令行程序来修复。\n\n与许多其他模块一样，MySQL\
  \ 数据库服务器模块可以配置为：当相应的 UNIX 用户发生相同变化时，自动创建、更新或删除 MySQL 用户。如果你允许系统上的某些 UNIX 用户访问数据库，并希望保持他们的密码和用户名同步，此功能将非常有用。\n\
  \n要设置同步，请按照以下步骤操作：\n\n在模块主页上，点击 `User Permissions`（用户权限）图标。向下滚动到现有 MySQL 用户列表下表单。\n\
  \n如果你想为每个新的 UNIX 用户创建一个新的 MySQL 用户，请勾选 `Add a new MySQL user when a UNIX user is\
  \ added`（添加 UNIX 用户时添加新的 MySQL 用户）框。然后，从右侧列表中选择应授予该用户的权限。当自动添加 MySQL 用户时，它将被允许从任何主机登录。\n\
  \n如果你希望在匹配的 UNIX 用户发生相同变化时重命名 MySQL 用户或更改其密码，请勾选 `Update a MySQL user when the matching\
  \ UNIX user is modified`（修改匹配 UNIX 用户时更新 MySQL 用户）框。如果同一用户存在多个条目，它们都将受到影响。\n\n要在删除同名\
  \ UNIX 用户的同时删除 MySQL 用户，请勾选 `Delete a MySQL user when the matching UNIX user is\
  \ deleted`（删除匹配 UNIX 用户时删除 MySQL 用户）框。如果同一用户存在多个条目，它们都将被删除。\n\n点击 `Save`（保存）按钮使新的同步设置生效。\n\
  \n### 35.12 管理数据库、主机、表和字段权限\n\n按照第 35.11 节“管理 MySQL 用户”中的指令创建的用户将以相同的权限访问服务器上的所有数据库。然而，通过以下步骤，可以允许用户仅访问特定的数据库：\n\
  \n确保该用户在用户权限页面上没有任何权限。他在该处设置的任何权限将适用于所有数据库，这并不是你想要的。\n\n在模块主页上，点击 `Database Permissions`（数据库权限）图标。这将列出一个用户列表及其对特定数据库拥有的权限。\n\
  \n点击列表上方或下方的 `Create new database permissions`（创建新数据库权限）链接。\n\n在出现的表单中，`Databases`\
  \ 字段控制他将访问哪些数据库。你可以选择 `Any`（任意）单选按钮授予所有数据库的权限，选择第二个单选按钮授予访问菜单中选定的数据库，或选择最后一个按钮授予访问与相邻字段中输入的\
  \ SQL 模式匹配的数据库。\n\n通常，第二个选项是你想要选择的，以便授予单个数据库的访问权限。如果用户应该访问多个数据库，则你需要添加多个数据库权限条目。\n\
  \n在 `Username`（用户名）字段中，选择第二个单选按钮并输入应授予访问权限的 MySQL 用户名称。\n\n`Hosts`（主机）字段允许你选择用户从哪些客户端主机连接到数据库。通常你应该选择\
  \ `Any`，允许他从任何地方访问，除非如第 35.11 节“管理 MySQL 用户”所解释的，用户本身被阻止从某些主机连接。\n\n从 `Permissions`（权限）列表中，选择用户对所选数据库应拥有的权限。这些权限将添加到用户权限页面上为该用户设置的任何权限中。\n\
  \n点击 `Save` 按钮添加并激活新权限。你将返回数据库权限列表。\n\n你可以通过点击列表中的数据库名称来编辑数据库权限。这将带你进入一个与创建表单相同的编辑表单，其中可以更改数据库、`username`、`hosts`\
  \ 或权限。`Save` 按钮将保存并激活任何更改，而 `Delete` 按钮将移除数据库的权限。\n\n当首次安装 MySQL 时，将自动创建 `test`\
  \ 和 `test_%` 数据库中 `Anonymous` 用户的数据库权限。假设 `Anonymous` 用户存在于用户权限页面，这些权限将允许任何连接到 MySQL\
  \ 的人访问这些数据库中的记录。除非你正在使用匿名登录，否则这些数据库权限可以安全地删除。\n\nMySQL 还允许对从某些客户端主机连接的所有用户授予数据库权限。如果你想增加特定客户端系统（例如连接到你数据库服务器的\
  \ Web 服务器）的权限，这会非常有用。\n\n要添加主机权限，请按照以下步骤操作：\n\n在模块主页上，点击 `Host Permissions`（主机权限）图标。这将带你进入列出已授予客户端主机的现有权限页面（如果有）。安装\
  \ MySQL 时，最初不会定义此类权限。\n\n点击 `Create new host permissions`（创建新主机权限）以调出添加新主机权限条目的表单。\n\
  \n如果权限适用于所有数据库，请在 `Databases` 字段中选择 `Any` 单选按钮。\n\n如果仅针对特定数据库，请选择第二个单选按钮并从相邻菜单中选择一个数据库。\n\
  \n如果你想授予名称与 SQL 模式匹配的数据库权限，请选择最后一个单选按钮并在相邻文本字段中输入该模式。\n\n在 `Hosts` 字段中，选择第二个单选按钮并在相邻字段中输入主机名、IP\
  \ 地址或主机名/IP 模式（如 `*%.example.com` 或 `192.168.1.%*`）。选择 `Any` 按钮并不特别有用。\n\n从 `Permissions`\
  \ 菜单中选择将授予所有从指定主机连接到所选数据库的用户权限。这些权限将添加到在用户权限或数据库权限上授予的任何其他权限中。\n\n点击 `Save` 按钮激活新的主机权限。\n\
  \n如往常，你可以通过点击列表中的数据库名称、编辑字段并点击 Save 来编辑主机权限条目。你也可以使用 `Delete` 按钮将其删除。\n\nMySQL 还支持向从某些主机连接的用户授予特定表和字段的权限。Webmin\
  \ 允许通过点击主页上的 `Table Permissions`（表权限）和 `Field Permissions`（字段权限）图标来设置这些。但由于它们非常复杂且很少使用，本章未涵盖。\n\
  \n### 35.13 模块访问控制\n\n通常，拥有 MySQL 数据库服务器模块访问权的 Webmin 用户可以管理所有数据库并使用模块的所有功能。然而正如第\
  \ 52 节所示，可以限制用户对模块的操作。在这种情况下，你可以仅授予某些数据库的访问权限，控制备份写入的目录，并限制数据库的创建和删除。如果服务器上的不同数据库属于不同，你想给他们每个人提供一个\
  \ Webmin 登录以仅管理属于他们自己的数据库，这将非常有用。\n\n要设置此类模块访问控制，请遵循以下指令：\n\n在 Webmin 用户模块中，点击拥有该模块的用户或组名称旁边的\
  \ `MySQL Database Server`。\n\n在访问控制表单上，将 `Can edit module configuration?`（可以编辑模块配置？）字段更改为\
  \ `No`（否）。这对防止用户更改模块用于访问数据库的程序是必要的。\n\n在 `Databases this user can manage`（此用户可以管理的数据库）字段中，选择\
  \ `Selected`（已选）选项。然后，从下方列表中选择他应该访问的数据库。\n\n\n\n\n将 `Can create new databases?`\
  \ 字段更改为 `No`。没有理由让这种类型的受限用户能够添加新数据库。\n\n除非你想让用户能够删除自己的数据库，否则将 `Can drop databases?`\
  \ 字段更改为 `No`。尽管将其设置为 `Yes` 也是安全的，因为他只能删除你授予其访问权限数据库。\n\n将 `Can stop and start MySQL\
  \ server?` 字段更改为 `No`。\n\n如果你想让此 Webmin 用户能够控制 MySQL 用户对其数据库的访问，请将 `Can edit permissions?`\
  \ 字段更改为 `Only for managed databases`。这将允许他访问数据库、主机、表和字段权限页面，但将其限制为查看和编辑其被授予访问权的数据库条目。\n\
  \n要完全拒绝访问 MySQL 权限管理，请选择 `No`。选择 `Yes` 是一个坏主意，因为它将允许该用户创建可以访问服务器上所有数据库的 MySQL 用户。\n\
  \n如果 `Can edit table data?` 字段设置为 `No`，则用户将无法创建表、编辑字段、运行 SQL 命令或进行备份。相反，他将只能使用该模块的记录查看和编辑功能。\n\
  \n当 `Login to MySQL as` 字段设置为 `Username from Module Config` 时，该用户执行的所有数据库操作将以模块配置中设置的\
  \ MySQL 用户（通常为 `root`）身份进行。然而，你可能希望 Webmin 用户以较低权限的 MySQL 用户身份登录，作为额外的安全预防措施。这样，即使用户找到了绕过模块限制的方法，他仍然无法以\
  \ `root` 身份执行 SQL 命令。\n\n要使用不同的登录方式，请选择 `Username` 并在相邻字段中输入有效的 MySQL 登录名和密码。然而，此备用用户必须拥有模块所需所有操作的权限，例如创建表以及可能授予权限。\n\
  \n通常，Webmin 以 root UNIX 用户身份运行 `mysqldump` 命令进行备份，并允许在系统的任何位置创建备份文件。由于这可能导致重要文件被覆盖，你应该将\
  \ `Backup file directory` 字段更改为用于创建备份的安全目录，例如 `/home/someuser/backup`。\n\n更好的是，将\
  \ `Write backup as UNIX user` 字段更改为 `root` 以外的用户，例如 Webmin 用户的 UNIX 登录名。`mysqldump`\
  \ 命令将改为以该用户运行，从而防止其被用于覆盖文件。\n\n最后，要使新的访问限制生效，请点击 `Save`。\n\n如果你想通过网络界面让大量用户访问 MySQL，为每个用户配置\
  \ Webmin 模块的另一种替代方案是安装 Usermin。它有一个具有相同界面的 MySQL 模块，并且轻松配置以限制哪些数据库可见。更多信息请参见第 47\
  \ 章。\n\n### 35.14 配置 MySQL 数据库模块\n\n与其他许多模块一样，此模块有几个选项可以通过点击主页左上角的 `Module Config`\
  \ 链接来设置。`Configurable option` 下列出的字段与模块的用户界面及其连接数据库的方法有关，而 `System configuration`\
  \ 下的字段则定义了 MySQL 程序和文件的路径。\n\n除非你将数据库服务器安装在操作系统默认目录以外的目录，否则第二部分的字段通常不需要更改。这可能发生在你从源代码安装\
  \ MySQL 而不是使用 Linux 发行版提供的软件包时，或者在你安装了两个版本的 MySQL 并且正在配置模块的克隆版本（在第 51 章介绍）来管理第二个安装时。\n\
  \n如果你在系统中安装了多个版本的 MySQL，你应该为每个服务器克隆一次此模块。然后可以自定义最后三个配置选项以连接每个 MySQL 安装，这些安装可能在不同的端口监听或使用不同的\
  \ socket 文件。\n\n所有模块配置字段的名称和目的列于表 35.2。\n\n#### 表 35.2. 模块配置选项\n\n| 字段 |  |\n| :---\
  \ | :--- |\n| Administration login | 此字段包含模块登录 MySQL 执行所有操作的用户名。它通常由模块主页上的 MySQL\
  \ 登录表单设置，如果 Webmin 在你第一次使用该模块时无法登录，就会该表单。之后通常不需要更改。如果你更改了此字段，请确保新用户对所有数据库具有完全访问权限，否则模块某些部分将无法工作。你可能还需要更改\
  \ Administration password 字段以匹配新的用户名。 |\n| Administration password | 这是 Webmin 登录数据库时使用的密码。与\
  \ Administration login 字段一样，这通常由 MySQL 登录表单设置。 |\n| Number of rows to display per\
  \ page | 在查看和编辑表中的记录时，模块限制了同时显示的记录数量，以防止页面变得过大。要增加或减少每页显示的数量，请更改此字段。 |\n| Show databases\
  \ and tables as | 通常，模块主页上的数据库和数据库编辑页面上的表以图标形式显示。如果将此字段更改为 `List`，它们将以表格形式显示。由于表格占据屏幕空间较小，如果你的\
  \ MySQL 服务器中有大量的数据库或表，这种模式将非常有用。 |\n| Use vertical row editing interface | 如果此字段设置为\
  \ `Yes`，则将使用另一种界面来编辑和添加记录，如第 35.7 节“查看和编辑表内容”所示。 |\n| Show blob and text fields\
  \ as | 当此字段设置为 `Links to download` 时，表查看页面中的 blob 或文本字段将不会显示实际内容。相反，将显示一个指向单独页面的链接，用于查看或下载每个页的内容。如果你的\
  \ MySQL 数据库包含大型二进制对象（如 GIF 或 PDF 文件），这些内容在 HTML 表格中显示没有意义，这将非常有用。 |\n| Use DBI to\
  \ connect if available? | 当此字段设置为 `Yes`（默认如此），只要安装了相应的 Perl 模块，模块将使用 Perl DBI 接口连接到数据库服务器。只有在\
  \ DBI 不可用时，才会使用 `mysql` 命令连接，因为该命令的输出并不总是能可靠地解析。将此字段更改为 `No` 告诉模块始终使用 `mysql` 命令，即使可以使用\
  \ DBI。这只有在你系统上的 DBI 模块出现问题时才需要。 |\n| Path to mysqlshow command | 此字段必须包含 `mysqlshow`\
  \ 命令的完整路径，例如 `/usr/local/mysql/bin/mysql`。模块使用它获取用于主页和数据库编辑页面上的数据库和表列表。 |\n| Path\
  \ to mysqladmin command | 此字段必须包含 `mysqladmin` 命令的完整路径，模块使用它来检查数据库服务器进程正在运行。 |\n\
  | Path to mysql command | 此字段必须包含 `mysql` 命令的完整路径，在未安装 Perl DBI 模块时用它执行 SQL 命令。\
  \ |\n| Path to mysqldump command | 此字段必须包含 `mysqldump` 命令的完整路径，模块使用它对数据库进行备份。 |\n\
  | Path to mysqlimport command | 此字段必须包含 `mysqlimport` 命令的完整路径，模块使用它从文本文件中导入记录。然而，本章未涵盖此功能。\
  \ |\n\n\n\n\n\n| 启动 MySQL 服务器的命令 | 此字段必须包含启动 MySQL 数据库服务器的命令完整路径，例如 `/usr/local/mysql/bin/safe_mysqld`。在许多\
  \ Linux 发行版中，它默认设置为在启动时启动服务器的脚本，例如 `/etc/init.d/mysql start`。然而，如果您自己安装了 MySQL，应该将其更改为使用\
  \ `safe_mysqld` 命令。 |\n| 停止 MySQL 服务器的命令 | 当此字段设置为 `Automatic`（自动）时，当点击主页上的“停止 MySQL\
  \ 服务器”按钮时，该模块将使用 `mysqladmin` 命令关闭数据库服务器。否则，将运行输入的命令来关闭它。在包含可以停止数据库的脚本的 Linux 发行版中，此字段默认设置为该脚本，例如\
  \ `/etc/init.d/mysql stop`。然而，如果您手动编译并安装了 MySQL，则应该选择 `Automatic` 选项。 |\n| MySQL\
  \ 共享库目录路径 | 从源码发行安装 MySQL 时，`mysql`、`mysqlshow` 和其他程序将使用同样安装的共享库。为了让 Webmin 能够运行它们，它必须设置环境变量\
  \ `LD_LIBRARY_PATH` 以包含这些库的目录，例如 `/usr/local/mysql/lib`。通常情况下，如果设置不正确，模块的主页将显示错误消息，警告您共享库问题。由于\
  \ Webmin 假设共享库位于包含 `mysql` 程序目录的上一级 `lib` 目录，因此此字段通常不需要设置。大多数时候，只有当您的 MySQL 命令依赖于\
  \ `/usr/local/lib` 等非标准目录中的其他库时才有必要设置。 |\n| 要连接的 MySQL 主机 | 当此字段设置为 `localhost`\
  \ 时，该模块将连接到同一系统上的 MySQL 服务器。输入主机名将告诉它连接到该主机上的服务器，这实际上可能是一个完全不同的系统。虽然模块大部分功能在这种情况下可以正常工作，但启动和停止数据库服务器将无法进行。\
  \ |\n| 要连接的 MySQL 端口 | 此字段仅在连接到另一个主机时使用。它定义了连接到数据库服务器的 TCP 端口。如果选择了 `Default`（默认），将使用标准的\
  \ MySQL 端口，这通常是正确的做法。 |\n| MySQL socket 文件 | 此字段仅在要连接的 MySQL 主机设置为 `localhost` 时使用。它指定了用于与数据库服务器通信的\
  \ UNIX socket 文件，MySQL 客户端使用它而不是建立 TCP 连接。如果选择了 `Default`，将使用编译到 `mysql` 程序或 `DBI`\
  \ 模块中的默认 socket 文件路径。 |\n\n### 35.15 总结\n\n读完本章后，你应该理解 MySQL 数据库服务器可以做什么，以及它与其他类似的数据库包相比如何。你将能够使用\
  \ Webmin 在系统中创建存储在 MySQL 中的数据库和表，并查看和编辑这些表包含的数据记录。你还应该理解如何管理 MySQL 用户，以及如何使用权限系统授予特定用户访问某些数据库、表和字段。\n\
  \n## 第 36 章 PostgreSQL 数据库\n\n本章涵盖了 PostgreSQL 数据库服务器，并解释了如何使用 Webmin 管理表、用户、组和数据。\n\
  \n### 36.1 PostgreSQL 简介\n\n与 MySQL 类似，PostgreSQL 是免费的数据库服务器，支持多个数据库和表，并允许客户端使用\
  \ SQL 进行查询。对于编写需要使用数据库存储信息的程序的程序员来说，它是最有用的。perl、C、Java 和 PHP 等流行语言都有访问 PostgreSQL\
  \ 数据库的 API。\n\n一个 PostgreSQL 服务器可以托管多个数据库，每个数据库可以包含多个表。表反过来包含字段，每个字段都有类型和大小。表包含记录，每条记录通常包含有关某些对象的信息，如人员、产品或购买记录。字段可以被视为表中的列，而实际的数据记录则是行。某些字段还可以包含多个值，例如数组。\n\
  \nSQL（结构化查询语言的缩写）是一种用于从数据库中提取数据或更新数据库数据的语言。几乎所有数据库都使用 SQL，且其语法在所有不同的数据库包（如 Oracle、PostgreSQL\
  \ 和 MySQL）中通常是相同的。然而，本章并不涵盖其语法。\n\nPostgreSQL 具有许多其他免费数据库（如 MySQL）不具备的功能，例如事务、数组字段、视图和触发器。它并不完全像\
  \ Oracle 这样昂贵的商业数据库那样强大，但已经非常接近了。因为它可以使用多个文件来存储每个表，因此它们的大小不受系统最大文件大小的限制；相反，单个表可以包含多达\
  \ 16 TB 的数据。\n\nPostgreSQL 包随许多 Linux 发行版一起提供，可以在几乎所有的 UNIX 变体上编译和安装。它在所有操作系统上的操作都是相同的，因此用于管理它的\
  \ Webmin 模块也是如此。\n\nPostgreSQL 由一个读取和写入实际数据库文件的服务器进程，以及一组与服务器通信的客户端程序组成。最常用的客户端是\
  \ `psql` 命令，它允许用户执行 SQL 查询并查看结果。没有任何客户端直接访问数据库文件，这一操作完全留给服务器处理。\n\n所有的 PostgreSQL\
  \ 数据库文件都存储在如 `/var/lib/pgsql` 或 `/usr/local/pgsql` 的目录下。还有一些影响服务器和客户端操作的文本配置文件。最的是\
  \ `pg_hba.conf`，它列出了允许连接到服务器的客户端主机。这是 Webmin 直接编辑的文件。所有其他数据库配置都通过连接到数据库服务器（直接连接或通过\
  \ `psql` 命令）完成。\n\n### 36.2 PostgreSQL 数据库服务器模块\n\n该模块允许管理员管理 PostgreSQL 服务器中的数据库、表、字段和记录。在许多方面，它与第\
  \ 35 章介绍的 MySQL 模块非常相似。当你从 Webmin 的“服务器”（Servers）类别中点击它的图标时，主页将显示系统上现有数据库的列表，如图\
  \ 36.1 所示。\n\n##### 图 36.1. PostgreSQL 模块主页。\n\n![](img/36fig01.jpg)\n\n如果 Webmin\
  \ 检测到未安装 PostgreSQL、尚未初始化或无法连接，主页将不会像图 36.1 所示显示。相反，将显示某种错误消息。最常见的错误将在接下来的几段中介绍。\n\
  \n如果出现“PostgreSQL 未在你的系统上运行”的消息，你需要在使用此模块管理它之前启动数据库服务器。只需点击底部的“启动 PostgreSQL 服务器”按钮即可。如果你希望从现在开始在启动时启动它，请使用“启动和关闭”模块（第\
  \ 9 章介绍）创建一个新动作来启动它。在大多数 Linux 发行版中，PostgreSQL 包包含一个名为 `postgres` 或 `postgresql`\
  \ 的启动动作脚本，但该脚本默认是不启用的。\n\n\n\n\n\n如果 PostgreSQL 是通过 Webmin 运行的，Webmin 将不知道连接它所需的管理员用户名和密码，此时主页面将显示\
  \ PostgreSQL 登录表单。你必须为数据库服务器输入有效的登录信息，通常是针对对所有数据库和功能具有完全访问权限的 `postgres` 用户。以其他权限较低的用户登录最初可能可行，但你将无法使用该模块的所有功能。有时，PostgreSQL\
  \ 设置为通过 UNIX 用户名而不是独立的登录名和密码来验证用户（即 ident 身份验证模式）。如果你的系统是此类情况，你需要勾选表单上的 `Connect\
  \ as same Unix user?`（以相同的 Unix 用户连接？）框。\n\n如果出现类似 `The PostgreSQL host configuration\
  \ file hba.conf was not found` 的错误消息，要么是模块配置错误，要么你的服务器尚未进行初始化。许多 Linux 系统的发行版版本在使用之前需要进行初始化，通常通过运行\
  \ `initdb` 命令完成。如果模块知道如何在你的系统上执行此操作，将显示一个 `Initialize Database`（初始化数据库）按钮，你可以点击它首次设置服务器。\n\
  \n错误消息 `The PostgreSQL client program psql was not found on your system` 表示系统中完全没有安装\
  \ PostgreSQL，或者它位于与 Webmin 预期不同的目录。在 Linux 和 FreeBSD 系统上，模块假设你已经安装了发行版自带的数据库软件包，而在其他操作系统上，它假设已从源码标准安装到\
  \ `/usr/local/pgsql`。如果你已经安装了它但仍然出现错误消息，你需要阅读第 36.17 节“配置 PostgreSQL 数据库服务器模块”，获取有关如何调整模块使用的路径的详情。\n\
  \n如果你正在运行 Linux 且未安装 PostgreSQL，请使用 Software Packages（软件包）模块（见第 12 节）从发行版 CD 或网站安装所有以\
  \ `postgres` 开头的包。通常会有多个包，例如 `postgresql`、`postgresql-server` 和 `postgresql-devel`。对于其他操作系统，请访问\
  \ [www.postgresql.org/](http://www.postgresql.org/default.htm) 下载源码发行版，然后进行编译和安装。\n\
  \nPostgreSQL 模块使用 SQL 命令来执行创建表、添加字段和编辑记录等操作。为了执行这些命令，Webmin 必须连接到数据库服务器，可以通过两种方式之一实现：它可以带有正确的参数运行\
  \ `psql` 命令并解析其输出，或者使用 Perl 的 `DBI` 库直接连接。\n\n前者方法始终可用，因为在安装数据库服务器时，`psql` 命令总是会被安装。然而，它并不是完全可靠，因为某些类型的表数据产生的输出并不总是可以解析。因此，你应该安装\
  \ `DBI` 和 `DBD::Pg` Perl 模块。如果缺少其中任何，主页面底部将显示一条消息，提示你通过点击链接安装一个或两个。这将带你进入 Perl Modules\
  \ 模块（见第 27 节）中的一个页面，在该页面将为你下载并安装 `DBI` 和/或 `DBD::Pg`。\n\n### 36.3 创建新数据库\n\n当首次安装\
  \ PostgreSQL 时，通常会创建一个名为 `template1` 的数据库。因为它是用作任何新数据库的模板，你应该创建一个自己的数据库，其中包含应用程序存储数据的表。要执行此操作，请遵循以下步骤：\n\
  \n在模块主页上，点击现有数据库图标上方的 `Create a new database`（创建新数据库）链接。\n\n在 `Database name`（数据库名称）字段中为其输入一个唯一名称。名称应仅包含字母、数字和\
  \ `_` 字符。\n\n当 `Database file path`（数据库文件路径）字段设置为 `Default`（默认）时，实际包含数据库数据的文件将在默认目录下创建。在\
  \ Linux 系统上，这通常是 `/var/lib/pgsql/data`；在其他操作系统上，可能是 `/usr/local/pgsql/var`。\n\n\
  要作为运行数据库的 UNIX 用户（通常是 `postgres`）使用不同的目录，请先使用 `mkdir` 命令创建，然后将目录名作为参数运行 `initlocation`。然后选择\
  \ `Database file path` 字段的单选按钮，并在相邻的文本框中输入目录。\n\n遗憾的是，除非 PostgreSQL 在编译时支持绝对数据目录路径，否则在点击\
  \ `Create` 按钮会发生错误。默认情况下，此功能未启用。\n\n点击 `Create` 按钮。数据库将被添加，你将返回模块主页，主页应包含它的新图标。\n\
  \n如果你的服务器上存在名为 `template1` 的数据库，其中包含的任何表或其他对象将复制到新创建的数据库中。如果你想添加许多结构相似的数据库，这将非常有用。\n\
  \n### 36.4 创建新表\n\n可以随时向现有数据库添加表。每个表都有一个或多个字段，每个字段都有类型、大小和其他属性。要添加表，请遵循以下步骤：\n\n\
  在主页上，点击你想要添加表的数据库图标。这将带你进入图 36.2 所示的数据库编辑页面，该页面上有每个现有表的图标。\n\n##### 这里的 36.2. 数据库编辑页面。\n\
  \n![](img/36fig02.jpg)\n\n在 `Create a new table` 按钮旁的 `Fields`（字段）文本框中输入你希望新表拥有的字段数量，然后点击按钮。这将弹出一个表单输入新详情及其初始字段。\n\
  \n为表选择一个名称并将其输入 `Table name`（表名称）字段。该名称在数据库内必须是唯一的，且应仅使用字母、数字和 `_` 字符。\n\n`Initial\
  \ fields`（初始字段）表的每行都定义了一个将添加到新表中的字段。所添加的字段类型取决于你在以下列的每行中输入的内容：\n\n- **Field name**（字段名）：此字段的名称，在表内必须是唯一的，应仅由字母、数字和\
  \ `_` 组成。如果留空，则该行不会添加字段。\n- **Data type**（数据类型）：从此菜单中选择的决定了在该字段中可以存储的数据类型。常见类型有用于变长度文本字符串的\
  \ `varchar`、用于整数的 `int4` 和用于小数的 `float4`。更多详情请参见第 36.7 节“字段类型”。\n- **Type width**（类型宽度）：此字段可以留空，情况下将使用所选类型的默认大小。否则，你必须输入一个数字，表示字段可以存储的字符数（对于\
  \ `char` 或 `varchar` 字段）或位数（对于数值字段）。某些类型（如 `blob` 和 `date`）也不允许指定类型。再次参见第 36.7 节“字段类型”获取每种类型大小含义的信息。\n\
  - **Field options**（字段选项）：如果勾选了 `Array?`（数组？），该字段将是一个能够存储多个值的数组。如果勾选了 `Allow nulls?`（允许为空？），数据库将允许在该字段中插入\
  \ `NULL` 值。如果勾选了 `Primary key?`（主键？），该字段将成为表的主键的一部分。所有表都应该有一个键，通常是第一个字段且类型为 `int`\
  \ 或 `varchar`。当勾选 `Unique?`（唯一？）时，PostgreSQL 将防止多个记录具有该字段的相同值。主键字段也是自动唯一的。\n\n当你完成字段输入后，点击页面底部的\
  \ `Create` 按钮。表将添加到数据库中，你将返回列出现表的页面。\n\n### 36.5 添加和编辑字段\n\n\n\n\n可以向表中添加新字段，也可以更改现有字段的名称。不过，除非删除并重新添加，否则无法更改字段的大小类型。当字段被创建时，它在表中现有的行中初始始终包含\
  \ `NULL` 值。\n\n要添加字段，请按照以下步骤操作：\n\n在模块的主页上，点击包含该表的数据库图标。然后点击表本身的图标。这将带你进入一个列出现有字段名称、类型和大小的页面，如图\
  \ 36.3 所示。\n\n##### 图 36.3 表编辑页面。\n\n![](img/36fig03.jpg)\n\n从 `Add field of type`\
  \ 按钮旁的菜单中为新字段选择一种类型。点击后，浏览器将显示字段创建表单，以输入其余细节。\n\n为此字段选择一个名称，该名称仅由字母、数字和 `_` 字符组成，并将其输入\
  \ `Field name` 文本框。同一表中不能两个字段具有相同的名称。\n\n对于 `char` 或 `varchar` 字段，在 `Type width`\
  \ 文本框中输入它可以容纳的最大字符数。对于数值字段，你必须输入两个用逗号分隔的数字，例如 `10,2`。第一个是该字段可以存储的数字最大位数，第二个是小数点右侧位数。\n\
  \n对于其他字段类型，`Type width` 文本框完全不会出现。\n\n如果你希望此字段能够存储相同类型的多个值，请为 `Array field?` 选项选择\
  \ `Yes`。\n\n点击 `Create` 将字段添加到表中，前提是你的输入没有错误。\n\n字段创建后，你只能更改其名称，这在 `MySQL` 中可以修改其类型或大小。然而，这意味着对它包含的数据没有风险。要重命名表中的字段，请按照以下步骤操作：\n\
  \n在模块的主页上，点击包含该表的数据库图标，然后点击表图标。这将带你进入表的字段列表，示例如图 36.3 所示。\n\n点击你想更改的字段名称。\n\n在编辑表单上，用新名称更新\
  \ `Field name` 文本框。自然地，这必须遵循与创建字段时相同的命名规则。\n\n点击 `Save` 按钮在数据库中应用更改。\n\n### 36.6\
  \ 删除字段\n\n与 `MySQL` 不同，`PostgreSQL` 数据库服务器没有内置的用于从表中删除字段的 SQL 命令。然而，可以通过创建一个缺少该字段的新临时表、删除旧表并将临时表重命名为原始名称来执行删除字段的操作。这种方法可行，且\
  \ `Webmin` 可以自动为你完成所有操作；但是在此过程中，某些信息（如索引和默认字段值）将会丢失。不过表中的实际数据（已删除字段中的数据外）是安全的。\n\
  \n如果你的表不包含任何索引或带有默认值的字段，你可以按照以下步骤直接删除字段：\n\n在模块的主页上点击包含该表的数据库图标，然后点击表图标本身。\n\n在表编辑表单上，点击现有字段列表下方的\
  \ `Drop Field` 按钮。这将你进入一个列出表中所有字段的页面，每个字段在 `Drop This One` 下方都有一个单选按钮。\n\n选择你想从表中删除的字段单选按钮。\n\
  \n勾选表单底部的 `Select box to confirm…` 复选框。\n\n点击 `Drop Field` 按钮删除所选字段。一旦其被删除，相同的页面将重新显示，你可以根据需要再次删除另一个。\n\
  \n### 36.7 字段类型\n\n`PostgreSQL` 拥有大量的字段类型，所有类型都由 `Webmin` 支持。然而，并非所有类型对普通数据库都特别有用。常用的类型列于表\
  \ 36.1。\n\n`PostgreSQL` 有几种用于存储几何对象的类型，如 `point`、`path`、`box` 和 `circle`，以及用于网络信息的类型如\
  \ `inet`、`cidr` 和 `macaddr`。所有这些类型的字段都可以使用此模块创建和编辑，尽管它们在上方没有说明。然而，其他数据库（如 `Oracle`\
  \ 或 `MySQL`）不支持这些类型，因此如果你希望你的程序独立于数据库，那么避免它们可能是明智的。\n\n##### 表 36.1 PostgreSQL 字段类型\n\
  \n| 类型 | 说明 |\n| --- | --- |\n| `char` | 固定长度的文本字符串，必要时向右填充空格。此类类型的字段必须有宽度，决定了它们可以存储的字符数。此宽度不能超过\
  \ 254 个字符。要存储更大的字符串，请使用 `text` 字段。 |\n| `varchar` | 与 `char` 类型类似，但文本不填充空格。这是存储短字符串的最佳类型。\
  \ |\n| `int2` | 2 字节整数，可以存储 `2¹⁵` 到 `+2¹⁵` 范围内的数字（约 32,000）。 |\n| `int4` | 4 字节整数，可以存储从\
  \ `2³¹` 到 `+2³¹` 的值（约 20 亿）。 |\n| `int8` | 8 字节整数，可以存储 `2⁶³` 到 `+2⁶³` 范围内的数字。 |\n\
  | `float4` | 可以包含小数的数字，例如 `12.34`。由于此类类型在内部使用 4 字节浮点格式，许多位数的数字无法精确存储，并将舍入到最接近的数字。出于此原因，`float4`\
  \ 和 `float8` 字段不应用于必须始终准确的值，例如货币金额。应使用 `numeric` 类型。 |\n| `float8` | 与 `float4`\
  \ 类型类似，但使用 8 字节存储，因此可以处理具有更多有效位的值。 |\n| `numeric` | 此类型的字段可以精确存储多到最大位数的小数。在添加 `numeric`\
  \ 字段时，你必须指定两个用逗号分隔的数字宽度。第一个是它可以存储的有效数字总数，第二个是小数点右侧位数。 |\n| `date` | 存储年、月、日。`PostgreSQL`\
  \ 始终以 `YYYY-MM-DD` 格式显示日期，也应以此格式输入。 |\n| `time` | 存储小时、分、秒。时间始终以 `HH:MM:SS` 格式显示。\
  \ |\n| `timestamp` | 存储年、月、日、时、分、秒和时区偏移。`timestamp` 字段中的值始终以 `YYYY-MM-DD HH:MM:SS+ZZ`\
  \ 格式显示，也应以此格式输入。 |\n| `text` | 此类型的字段可以存储无限量的文本。无法也不需要指定最大尺寸。 |\n\n### 36.8 查看和编辑表内容\n\
  \n`PostgreSQL` 模块允许你查看和编辑任何数据库中任何表的内容，即使是没有主键的表。与 `MySQL` 模块不同，可以使用特殊的 `oid` 列识别要编辑的特定行，该列包含每条记录的唯一标识符。\n\
  \n要查看表的内容，请按照以下步骤操作：\n\n在主页上，点击包含该表的数据库图标，然后点击表图标。\n\n在表编辑表单上，点击底部的 `View Data`\
  \ 按钮。这将带你进入包含表中前 20 行的页面。\n\n如果表的行数多于页面显示的数量，可见范围的开始和结束以及总行数将显示在顶部。旁边有左右箭头，用于移动到上一组或一组\
  \ 20 条记录。\n\n与 `MySQL` 模块不同，在此页面上没有搜索记录或跳转到特定行号的方法。\n\n\n\n此页面也可用于编辑、删除或添加记录。编辑的记录必须首先使用每行右侧的复选框，或者“全选”和“反转选择”链接进行选择。点击`Edit\
  \ selected rows`（编辑选行）按钮后，页面将重新显示并将所有已选的值填充在文本框中。进行您所需的更改，并点击底部的`Save`（保存）按钮更新数据库。如果您想停止编辑而不保存修改，请点击`Cancel`（取消）。\n\
  \n要删除记录，使用相同的复选框和选择链接选中它们，并点击`Delete selected rows`（删除选行）按钮。所选记录将立即从数据库中移除，无需进一步确认。\n\
  \n要添加新记录，点击表格下方的`Add row`（添加行）按钮。将出现一行，其中包含空文本框供您输入新详情。点击`Save`将将新记录添加到表格中，并移动显示位置以便您看到新行。如果您改变了主意不再添加记录，也可以点击`Cancel`。\n\
  \n### 36.9 删除表和数据库\n\n此模块还包含从数据库中删除表，或删除整个数据库及其所有内容的按钮。当表被移除时，其包含的所有记录和字段将丢失。\n\n\
  要删除表，请按照以下步骤操作：\n\n在模块的主页上，点击您想要从中删除表的数据库图标，然后点击表本身的图标。\n\n点击字段列表下方的`Drop Table`（删除表）按钮。这将带您进入一个确认页面，询问您是否确定，并告诉您将删除多少条记录。\n\
  \n如需继续，再次点击`Drop Table`按钮。一旦删除，您将返回数据库中剩余表的列表。\n\n也可以删除整个数据库以及其中所有的表和记录。任何数据库都可以被删除，但删除`template1`\
  \ 是一个坏主意，因为该模块在检索其他数据库列表时连接到它，并假设它始终存在。一常一样，除非您已进行备份，否则无法撤销删除。\n\n假设您确实想删除数据库，请按照以下步骤操作：\n\
  \n在主页上，点击您想要删除的数据库图标。\n\n点击表列表下方的`Drop Database`（删除数据库）按钮。将显示确认页面，告诉您如果继续操作将丢失多少个表和记录。\n\
  \n要继续删除，点击`Drop Database`按钮，完成后您将返回模块主页。\n\n如果您将模块配置中的`Initial PostgreSQL database`（初始\
  \ PostgreSQL 数据库）字段改为其他不会被删除的数据库，就可以移除`template1`数据库。\n\n### 36.10 执行 SQL 命令\n\n\
  PostgreSQL 模块还提供了一个简单的接口用于在数据库上运行 SQL 命令并显示其输出。使用方法步骤如下：\n\n在主页上，点击您想要运行命令的数据库图标。\n\
  \n点击表图标列表下方的`Execute SQL`（执行 SQL）按钮。这将带您进入一个页面，用于输入 SQL 命令、运行命令文件以及向数据库加载数据。\n\n\
  在页面顶部的文本框中输入任意 SQL 命令并点击`Execute`（执行）按钮。如果您的 SQL 语法有误或命令无法执行，将显示来自`PosygreSQL`的错误信息。否则，将显示\
  \ SQL 结果表（如果有）。只有`SELECT`语句会产生结果；`UPDATE`、`INSERT`和其他修改记录的命令则不会。\n\n与 MySQL 模块不同，这里没有命令历史，也不支持从文件运行多个\
  \ SQL 语句。\n\n### 36.11 备份和恢复数据库\n\n如果您的某个数据库包含重要信息，应该定期进行备份，以防磁盘故障或 SQL 错误导致数据丢失。在执行某些潜在风险的操作之前（例如运行修改大量记录的复杂\
  \ SQL 语句），创建备份也是一个好主意。\n\n由于`pg_dump`和`pg_restore`命令参数的变化，该模块仅允许您在使用 PostgreSQL\
  \ 7.2 及以上版本时创建和恢复备份。如果您使用的是旧版本，后续步骤中说明的按钮将不可见。\n\n使用该模块制作备份，请完成以下步骤：\n\n在主页上，点击您想要备份的数据库图标。\n\
  \n点击表列表下方的`Backup`（备份）按钮。这将带您进入输入备份目标和选项的表单。\n\n在`Backup file path`（备份文件路径）字段中，输入备份文件的完整路径，例如`/tmp/backup.tar`。该文件不能已存在。如果存在，点击`Backup`按钮将报错。\n\
  \n从`Backup file format`（备份文件格式）菜单中选择应创建的文件类型。可用选项有：\n\n- **Plain SQL text**（纯 SQL\
  \ 文本）：文件将包含一系列 SQL 命令，用于重建数据库中的表并重新填充数据。这种格式的方便之处在于备份文件可以手动编辑，但您无法在 SQL 备份中包含大型对象（如\
  \ blobs）或从中进行选择性恢复。\n- **Tar archive**（Tar 存档）：备份文件将是一个标准的 UNIX `tar` 文件，包含指定表结构和内容的各种文件。支持大型对象并可以选择性恢复。\n\
  - **Custom archive**（自定义存档）：文件将采用 PostgreSQL 的自定义备份格式，该格式经过压缩，并在恢复时支持大型对象、数据排除和重新排序。\n\
  \n要执行备份，点击表单底部的`Backup`按钮。如果一切顺利，您将被重定向到表列表；否则将显示一个显示运行的备份命令及其错误输出的页面。\n\n如果您有一个用于重要生产目的的数据库，应该定期备份，例如每天一次。您不需要每天都遵循上述说明，可以使用`Scheduled\
  \ Cron Jobs`（计划 Cron 任务）模块（第 10 章）创建一个自动为您执行备份的任务。要确定运行什么命令，请先使用上述说明制作一次备份，然后访问`Webmin\
  \ Actions Log`（Webmin 操作日志）模块（第 54 章）查看它使用的命令。\n\n一旦创建了备份文件，可以在同一系统或运行 PostgreSQL\
  \ 的其他服务器上进行恢复。恢复备份的步骤如下：\n\n在模块的主页上，点击要恢复备份的数据库图标。\n\n点击表列表下方的`Restore`（恢复）按钮调出选择备份文件的表单。\n\
  \n在`Backup file path`字段中，输入包含 PostgreSQL 备份数据的完整路径。该文件可以是备份表单上提供的任何格式。\n\n通常，恢复过程将尝试在恢复数据到表中之前重建表。为了避免这种情况，将`Only\
  \ restore data, not tables?`（仅恢复数据不恢复表？）字段改为`Yes`。这仅在备份中的所有表已存在时才有效。表当前包含的所有数据将与恢复的记录合并。\n\
  \n通常，如果备份中的表已存在于数据库中，恢复过程将失败。若要在恢复前删除现有表，请将`Delete tables before restoring?`（恢复前删除表？）字段改为`Yes`。将此字段和上一个字段都设置为`Yes`是没有意义的。\n\
  \n点击`Restore`按钮从备份文件中重新加载数据和表。如果发生错误，将显示来自`pg_restore`命令输出的错误信息；否则，您将返回数据库的表列表。\n\
  \n### 36.12 管理 PostgreSQL 用户\n\n\n\n\n\n正如你所预期的，PostgreSQL 数据库服务器不会允许任何人连接并开始操作数据。相反，它通过要求客户端发送用户名和密码来验证身份，并将其与自身的内部用户列表进行比对。此数据库用户列表与\
  \ `/etc/passwd` 文件中的 UNIX 用户列表是完全独立的。\n\n默认情况下，只存在 `postgres` 用户，他将拥有所有数据库和表的完全访问权限。如果你正在编写使用数据库的应用程序，应该为该应用程序创建一个新用户用于登录。如果有多人使用\
  \ `psql` 命令或其他客户端程序访问你的数据库，每个人都应该有自己的登录名和密码。\n\n如需添加新用户，请遵循以下步骤：\n\n在模块的主页上，点击 `PostgreSQL\
  \ Users` 图标。这将带你现有用户及其权限列表，如图 36.4 所示。\n\n##### 图 36.4 现有的 PostgreSQL 用户。\n\n![](img/36fig04.jpg)\n\
  \n点击列表上方或下方的 `Create a new user` 链接，弹出用户创建表单。\n\n在 `Username` 字段中输入一个唯一的用户名，且仅由字母、数字和\
  \ `_` 字符组成。\n\n要为此用户设置密码，选择 `Password` 字段中的第二个单选按钮，并在旁边的文本框中输入密码。如果选择 `None`，除非服务器已配置为允许无密码连接（如第\
  \ 36.14 节“限制客户端访问”所示），否则该用户将无法登录。\n\n如果你希望此用户能够创建自己的数据库，将 `Can create databases?`\
  \ 字段更改为 `No`。只有主管理用户（`postgres`）实际上需要具备此能力。\n\n要赋予此用户编辑和创建 PostgreSQL 用户的权限，将 `Can\
  \ create users?` 字段更改为 `Yes`。同样，这通常应该保持为 `No`。\n\n`Valid until` 字段控制该用户可以使用多长时间。如果选择了\
  \ `Forever`，则将没有过期日期；但如果选择了第二个选项并在文本字段中输入 `YYYY-MM-DD` 格式的日期，则该账户在该日期之后将无法使用。\n\n\
  点击 `Create` 按钮将新账户添加到 PostgreSQL 的用户列表中。人员或程序将能够立即以该用户身份登录。\n\n通常情况下，数据库服务器默认允许任何本地用户登录而无需提供密码。要更改此设置，请参见第\
  \ 36.14 节“限制客户端访问”。\n\n要精确配置此新用户可以访问哪些表和视图，请遵循第 36.15 节“编辑对象权限”中的说明。\n\n用户创建后，可以通过点击图\
  \ 36.4 所示用户列表中的其名称进行编辑。这将带你进入编辑表单，该表单与用户创建表单几乎相同，但无法更改用户名。完成修改密码、过期日期和其他字段后，点击 `Save`\
  \ 按钮使更改生效。\n\n也可以通过点击编辑页面上的 `Delete` 按钮删除用户。请小心不要移除 `postgres` 用户，因为此 Webmin 模块通常使用它登录\
  \ PostgreSQL。事实上，如果你设置了过期日期或剥夺了用户创建数据库或其他用户的能力，即使是编辑该用户也可能导致问题。\n\n与其他许多模块一样，此模块可以配置为在分别添加、修改或删除\
  \ UNIX 用户时，自动创建、更新或删除 PostgreSQL 用户。如果你允许系统上的某些 UNIX 用户访问数据库并希望保持他们的密码同步，这将将非常有用。\n\
  \n要设置同步，请遵循以下步骤：\n\n在模块的主页上，点击 `PostgreSQL Users` 图标，并滚动到现有账户列表下方的表单。\n\n如果你希望为每个新的\
  \ UNIX 用户创建一个 PostgreSQL 用户，请勾选 `Add a new PostgreSQL user when a UNIX user is added`\
  \ 框。然而，自动创建的用户将没有任何特定的对象权限。\n\n如果你希望在匹配的 UNIX 用户发生相同变化时更改 PostgreSQL 密码，请勾选 `Update\
  \ a PostgreSQL user when the matching UNIX user is modified` 框。\n\n要在删除同名 UNIX 用户的同时删除\
  \ PostgreSQL 用户，请勾选 `Delete a PostgreSQL user when the matching UNIX user is deleted`\
  \ 框。\n\n点击 `Save` 按钮使新的同步设置生效。\n\n### 36.13 管理 PostgreSQL 组\n\nPostgreSQL 维护自己的内部组列表，每个组可以包含零或多个用户。组在分配对象权限时最有用，因为允许你同时向许多用户授予表或视图的访问权限。除此之外，它们在访问控制或身份验证中不起任何作用。\n\
  \n要创建一个组，请完成以下步骤：\n\n在模块的主页上，点击 `PostgreSQL Groups` 图标。你的浏览器将显示现有组及其成员（如果有）的表格。当首次安装\
  \ PostgreSQL 时，没有定义任何组。\n\n点击 `Create a new group` 链接进入组创建表单。\n\n在 `Group name`\
  \ 字段中输入由字母、数字和 `_` 字符组成的名称。其他组或用户不能具有相同的名称。\n\n保持 `Group ID` 字段不变，因为 Webmin 会自动选择\
  \ ID。\n\n从 `Members` 列表中选择将成为此组成员的用户。在大多数浏览器中，你可以通过 `Ctrl-Click` 选择多个用户名，或通过 `Shift-Click`\
  \ 选择整个范围。\n\n点击 `Create` 添加该组。现在可以像第 36.15 节“编辑对象权限”所解释的那样向其分配对象权限。\n\n与用户一样，你创建的组可以通过点击\
  \ PostgreSQL Groups 页面列表中的其名称进行编辑，在编辑表单上更改名称或成员列表并点击 `Save`。也可以通过点击同一表单上的 `Delete`\
  \ 按钮删除它。\n\n### 36.14 限制客户端访问\n\n默认的 PostgreSQL 配置通常允许任何用户从同一系统连接到数据库服务器而无需登录，但会阻止所有远程访问。如果你允许客户端从其他系统连接（例如，如果你正在设置一个将从独立的\
  \ Web 服务器访问的数据库服务器），则需要配置 PostgreSQL 以允许此操作。\n\n要授予另一个主机访问权限，请遵循以下说明：\n\n在模块的主页上，点击\
  \ `Allowed Hosts` 图标。你将被列出一个允许连接的主机、客户端可以访问的数据库以及使用的身份验证模式的页面。通常初始允许本地连接和来自 `127.0.0.1`\
  \ 的连接。\n\n点击列表上方或下方的 `Create a new allowed host` 链接弹出主机创建表单。\n\n在 `Host address`\
  \ 字段中选择 `Single host` 并在相邻字段中输入远程客户端系统的 IP 或主机名。你也可以选择 `Network` 并在对应的字段中输入网络地址（如\
  \ `*192.168.1.0`）和子网掩码（如 `255.255.255.0`）以允许整个局域网。\n\n要让指定的主机或网络访问服务器上的所有数据库，将 `Database`\
  \ 字段设置为 `All databases`。否则，从菜单中选择其中一个。\n\n如果你希望授予客户端访问两个数据库，你需要添加两个主机条目，每个条目在 `Database`\
  \ 菜单中选择不同的选项。\n\n在 `Authentication mode` 字段中，选择 `Plaintext password`。`No authentication\
  \ required` 选项允许允许系统上的用户连接，但无需提供有效的密码。显然，这并不安全。\n\n点击 `Create` 按钮添加新的允许主机条目。\n\n\
  \n\n\n\n如果你的系统有多个用户，且每个用户在 PostgreSQL 数据库中都有属于自己的数据，那么你不应该允许他们在没有密码的情况下登录数据库服务器。默认情况下，`PostgreSQL`\
  \ 正好允许这样做，但这并不安全！幸运的是，这可以很容易修复。不过，存在一个将 Webmin 本身锁定在数据库之外的风险，因为它通常设置为无密码以 `postgres`\
  \ 用户身份登录。\n\n按照以下指令重新配置模块，以使用密码登录并强制本地用户也执行相同的操作：\n\n1. 在模块的主页上，点击 `PostgreSQL Users`\
  \ 图标，然后点击 `postgres` 用户以打开编辑表单。\n2. 选择 `Password` 字段的第二个单选按钮，并在相邻的文本框中输入一个良好的安全密码。点击\
  \ `Save`。\n3. 返回模块主页，点击 `Module Config` 链接。\n4. 在 `Administration` 密码字段中，选择 `Set\
  \ to` 文本框中输入你选择的密码。点击表单底部的 `Save`。\n5. 点击 `Allowed Hosts` 图标，然后点击 `Host address`\
  \ 列中的 `Local connection`。将 `Authentication mode` 字段更改为 `Plaintext password`，并点击\
  \ `Save` 按钮。浏览器返回允许主机列表后，点击 `127.0.0.1` 并进行相同的更改。\n6. 返回模块主页。如果一切顺利，你仍然能够看到并管理数据库，且所有用户在连接时都需要密码。\n\
  \n当客户端连接到数据库服务器时，`PostgreSQL` 会按照 `Allowed Hosts` 页面上的主机条目进行检查。一旦发现匹配客户端地址和请求数据库的条目，将使用该条目的身份验证模式。你可以利用此功能在阻止某些主机的同时允许所有其他主机，方法是创建一个\
  \ `Host address` 字段设置为你想阻止的 IP、且 `Authentication mode` 设置为 `Reject connection` 的主机条目。该条目必须出现在列表中任何允许相同客户端的更宽范围的条目之前。\n\
  \n由于新的允许主机条目总是被添加到列表末尾，该页面具有一个移动功能。可以点击列表 `Move` 列下的向上和向下箭头，分别将条目向上或向下向下移动一个位置。\n\
  \n### 36.15 编辑对象权限\n\n每个 `PostgreSQL` 对象（表、视图、索引或序列）都有一个所有者，即创建它的用户。默认情况下，只有所有者可以从对象中选择数据或更新记录，如果你的服务器有多个需要访问相同表的用户，这并没那么用。幸运的是，通过遵循以下步骤可以向其他用户或组授予数据库对象的访问：\n\
  \n1. 在模块的主页上，点击 `Granted Privileges` 图标。假设你的数据库中确实有一些表，这将会打开一个列出所有现有对象及其当前权限的页面。\n\
  2. 点击你想授予权限的对象名称，这将带你进入其权限的编辑表单。\n3. 点击页面底部的 `Save` 按钮使新权限生效。\n\n`Grant privileges\
  \ to table` 列出了所有已授予访问权限的用户和组，随后是一行用于添加新用户或组的空行。然而，在大多数情况下，它只包含那一个空行。\n\n在 `User`\
  \ 列中，从菜单中选择要授予权限的用户或组名称，或选择 `Everyone` 以向所有 `PostgreSQL` 用户授予权限。\n\n在 `Privileges`\
  \ 列中，勾选应授予所选用户或组的权利框框。可用选项及其含义如下：\n\n- `SELECT`：勾选后，用户将能够使用 `SQL SELECT` 查询查看此表或视图中的记录。\n\
  - `UPDATE`：选择后，此选项赋予用户更新表中现有记录的能力。\n- `INSERT`：此选项赋予用户使用 `SQL INSERT` 语句向表中添加新记录的权利。\n\
  - `DELETE`：勾选后，用户将能够从表中删除现有记录。\n- `RULE`：允许用户在表或视图上创建规则。规则是一段 `SQL` 代码，通过执行该代码来转换在表中插入、更新或删除的数据。\n\
  - `REFERENCES`：允许用户创建一个引用此表作为外键的字段。\n- `TRIGGER`：勾选后，用户将能够为此表创建触发器。\n\n由于表一次只显示一个空行，如果你想向多个一个用户授予访问权限，则需要保存并重新编辑对象权限。如果需要给多个用户赋予相同的权限，更好的做法是将他们放入一个组中并向该组授予权限。\n\
  \n与 `MySQL` 不同，没有方法可以允许用户访问整个数据库，或仅访问表中的某个字段。所有权限仅在表级别上授予。\n\n### 36.16 模块访问控制\n\
  \n正如第 52 章所解释的，创建一个仅访问某些模块部分功能的 Webmin 用户是。在 `PostgreSQL Database Server` 模块的情况下，你可以限制用户管理特定数据库中的表和字段，并防止他编辑用户、组或已授予权限。如果你的服务器上不同的人拥有不同的数据库，并且你想给他们每个人提供一个\
  \ Webmin 登录以仅管理属于他们的数据库，这将非常有用。\n\n一旦用户获得了模块访问权限，你可以按照以下步骤将其限制访问某些数据库：\n\n1. 在 `Webmin\
  \ Users` 模块中，点击访问该模块的用户或组旁旁的 `PostgreSQL Database Server`。\n2. 在访问控制表单上，将 `Can edit\
  \ module configuration?` 字段更改为 `No`。这是为了防止用户更改模块用于访问数据库的程序。\n3. 在 `Databases this\
  \ user can manage` 字段中，选择 `Selected` 选项。然后从列表中选择他应该拥有权限的数据库。\n4. 将 `Can create new\
  \ databases?` 字段更改为 `No`。没有理由让这种受限制的用户能够添加新数据库。\n5. 除非你想让用户能够删除自己的数据库，否则将 `Can drop\
  \ databases?` 字段更改为 `No`。尽管将其设置为 `Yes` 是无害的因为因为只能删除你授予过他权限的数据库。\n6. 将 `Can stop\
  \ and start PostgreSQL server?` 字段更改为 `No`。\n7. 将 `Can edit users, groups, hosts\
  \ and grants?` 字段更改为 `No`，这样他就无法创建一个具有访问所有数据库权限的新 PostgreSQL 用户。\n8. 将 `Can create\
  \ backups?` 字段设置为 `No`，因为赋予用户制作备份的权利可能会允许他覆盖你系统上的文件。\n9. `Can restore backups?`\
  \ 字段可以安全地设置为 `Yes`，因为允许用户从备份文件将数据重新加载到他的数据库中没有危险。\n10. 最后，为了使新的访问控制限制生效，点击 `Save`。\n\
  \n### 36.17 配置 PostgreSQL 数据库服务器模块\n\n与大多数其他模块一样，此模块有几个选项，可以通过点击主页左上角的 `Module Config`\
  \ 链接来设置它们。列在 `Configurable option` 下的字段与其与数据库的连接和用户界面有关，而 `System configuration`\
  \ 下的字段定义了 `PostgreSQL` 程序和文件的路径。\n\n除非你将数据库服务器安装在与操作系统默认路径不同的目录中，否则第二部分的字段通常不需要更改。这可能发生在你从源代码而不是使用\
  \ Linux 发行版提供的包安装 `PostgreSQL` 时，或者你安装了两个 `PostgreSQL` 副本并正在配置模块的克隆（第 51 章涵盖）来管理第二个安装。\n\
  \n所有模块配置字段的名称和目的列在表 36.2 中。\n\n##### 表 36.2. 模块配置选项\n\n\n\n\n\n| 管理员登录 | 此字段包含模块登录\
  \ PostgreSQL 时所使用的用户名，以执行其所有操作。它通常由模块主页上的 `PostgreSQL Login` 表单设置，如果 Webmin 在您第一次使用该模块时无法登录，就会显示该表单。之后通常不需要更改此字段。如果您更改了此字段，请确保新用户对所有表和功能具有完全访问权限，否则模块部分部分将无法运行。您可能还需要更改\
  \ `Administration password` 字段以匹配新的用户名。 |\n| 管理员密码 | Webmin 登录数据库服务器时使用的密码。与 `Administration\
  \ login` 字段类似，通常由 `PostgreSQL Login` 表单设置此项。 |\n| 用于连接数据库的 UNIX 用户 | 当选择 `Same as\
  \ Administration login`（与管理员登录相同）时，模块将以与 `Administration login` 字段中数据库用户同名的 `UNIX`\
  \ 用户身份连接数据库。如果您的服务器被配置为仅执行 `ident` 身份验证，则这样做是必要的，某些 Redhat 和 Debian Linux 发行版就是如此情况。如果选择了\
  \ `root`，则所有数据库连接将以 `root` `UNIX` 用户身份进行。这是默认设置，当服务器配置为通过用户名和密码验证客户端时，应使用此设置。 |\n\
  | 每页显示的行数 | 在查看和编辑表格中的记录时，模块会限制一次显示的记录数量，以防止页面变得过大。要增加或减少每页显示的数量，请更改此字段。 |\n| 如果可用，则使用\
  \ DBI 连接 | 当此字段设置为 `Yes`（默认如此）时，只要安装了适当的 `Perl` 模块，模块将使用 `Perl DBI` 接口连接到数据库服务器。只有在\
  \ `DBI` 不可用时，它才会使用 `psql` 命令连接，因为该命令的输出并不总是能够可靠地解析。将此字段更改为 `No` 会告诉模块始终使用 `psql`\
  \ 命令，即使可以使用 `DBI`。只有当您的系统上的 `DBI` 模块出现问题时，才需要这样做。 |\n| psql 命令路径 | 此字段必须包含 `psql`\
  \ 命令的完整路径，在未安装 `Perl DBI` 模块时将使用它来执行 SQL 命令。 |\n| PostgreSQL 共享库路径 | 当从源码发行版安装 PostgreSQL\
  \ 时，`psql` 程序会使用同样安装的共享库。为了让 Webmin 能够运行这些库，它必须将环境变量 `LD_LIBRARY_PATH` 设置为包含这些库的目录，例如\
  \ `/usr/local/pgsql/lib*`。如果设置不正确，模块主页将显示错误消息，警告您存在共享库问题。由于 Webmin 假设共享库位于包含 `psql`\
  \ 程序目录的上级 `lib` 目录，因此此字段通常不需要设置。大多数情况下，只有当您的 `PostgreSQL` 命令依赖于 `/usr/local/lib`\
  \ 等非标准目录中的其他库时，才有必要设置。 |\n| 初始 PostgreSQL 数据库 | 因为 PostgreSQL 在连接时始终要求客户端指定数据库，此字段必须包含一个始终存在的数据库名称，供\
  \ Webmin 自身在连接时使用。默认的 `template1` 数据库可以正常工作，除非您决定删除它。 |\n| 启动 PostgreSQL 命令 | 当点击模块主页上的\
  \ `Start PostgreSQL Server` 按钮，将运行此配置字段中的命令。它必须包含一个有效的 shell 命令，以正确的用户身份启动数据库服务器。在大多数带有数据库包的\
  \ Linux 系统上，它默认被设置为使用类似 `/etc/init.d/postgresql start` 的启动脚本。然而，如果您手动安装了 PostgreSQL，你需要将其更改为类似\
  \ `su postgres -c \"/usr/local/pgsql/bin/postmaster -i -S -D/usr/local/pgsql/var\"\
  ` 的命令。此命令以用户 `postgres` 的身份使用正确的参数运行 `postmaster` 数据库服务器进程。 |\n| 停止 PostgreSQL 命令\
  \ | 此字段控制点击主页上的 `Stop PostgreSQL Server` 按钮时发生的情况。如果选择 `Kill process`，模块将直接杀死运行中的\
  \ `postmaster` 服务器进程。但如果选择了第二个选项，将运行相邻文本字段中输入的 shell 命令。在包含 `PostgreSQL` 包且具有停止服务器停止脚本的\
  \ Linux 系统上，这是默认设置，例如 `/etc/init.d/postgresql stop`。如果您自己编译并安装了 PostgreSQL，应选择 `Kill\
  \ process` 选项，因为不存在此类停止命令或脚本。 |\n| 初始化 PostgreSQL 命令 | 此字段指定了模块在点击主页上的 `Initialize\
  \ Database` 按钮时运行的命令。由于这仅在找不到 `pg_hba.conf` 文件时显示，因此该命令通常只运行一次。它必须设置为某个可以首次初始化并创建\
  \ `pg_hba.conf` 文件的脚本或程序。在带有 `PostgreSQL` 包的 Linux 发行版上，默认设置为运行类似 `/etc/init.d/postgresql\
  \ start` 的启动脚本，该脚本运行正确的 `initdb` 初始化命令。如果选择了 `None` 选项，即使数据库需要初始化，也不会显示 `Initialize\
  \ Database` 按钮。如果您自己编译安装了 PostgreSQL，这是最安全的选项，因为安装过程应该为您设置好数据库和配置文件。 |\n| postmaster\
  \ PID 文件路径 | 此字段必须包含 `postmaster` 进程创建的 PID 文件的完整路径，例如 `/usr/local/pgsql/var/postmaster.pid`。\
  \ |\n| 访问配置文件路径 | 此字段必须填写 pg_hba.conf 文件的完整路径，该文件包含访问限制，见 36.14“限制客户端访问”。如果设置不正确，模块将假设\
  \ PostgreSQL 尚未初始化并在主页显示错误消息。 |\n| 连接的 PostgreSQL 主机 | 当此字段设置为 `localhost` 时，模块将连接到本地系统的\
  \ PostgreSQL 服务器以查看和管理数据库。然而，也可以输入不同的主机名，在这种情况下，模块将连接到该主机上的服务器。模块并非所有功能都适用于远程服务器，`Allowed\
  \ Hosts` 页面以及 `Start` 和 `Stop` 按钮就是例子。 |\n| PostgreSQL 连接端口 | 如果数据库服务器运行在非标准端口，可以使用此字段让模块连接到默认以外的端口。\
  \ |\n| pg_dump 命令路径 | 此字段必须包含 pg_dump 命令的完整路径，用于备份数据库。 |\n| pg_restore 命令路径 | 此字段必须包含\
  \ pg_restore 命令的完整路径，用于将备份内容加载到数据库。 |\n| 默认备份仓库目录 | 此字段设置备份表单中 `Backup file path`\
  \ 字段的默认值。如果您所有的备份都存放在同一个目录，这将非常有用。 |\n\n### 36.18 总结\n\n本章介绍了 `PostgreSQL` 数据库服务器，并解释了它的功能和局限性。展示了如何使用\
  \ Webmin 管理系统上的 PostgreSQL 服务器。阅读后，您应该了解如何创建数据库、创建表和字段、编辑表数据、管理用户、组和权限，以及创建和恢复备份。\n\
  \n## 第 37 章：配置 Sendmail\n\n在本章中，将对电子邮件进行基础介绍，随后描述 `Sendmail` 邮件服务器以及配置它的 Webmin\
  \ 模块。\n\n### 37.1 电子邮件简介\n\n\n\n\n\n当你使用类似 Outlook 或 Evolution 的邮件客户端程序发送电子邮件时，该程序只需将消息传递给邮件服务器以递送到目的地。该服务器（也称为\
  \ `MTA` 或邮件传输代理）会为目标地址定位正确的系统，连接到该系统上的 `MTA` 并传输消息。当另一个服务器接收到邮件时，它会检查该邮件是否确实是发往该系统的，如果是，它就会将其存储在本地邮件文件中。\n\
  \n稍后，当目标用户检查其电子邮件时，将由 Elm、Pine 或 Usermin 等程序或 `POP3` 服务器读取文件。像 Evolution 和 Outlook\
  \ 这样的邮件客户端通常运行在与邮件服务器不同的系统上，并使用 `POP3` 协议下载消息进行本地存储。一旦通过这种方式获取了电子邮件，投递过程就完成了，用户就可以阅读消息。\n\
  \n邮件传输代理使用 `SMTP`（简单邮件传输协议）在互联网上相互发送电子邮件。客户端也使用 `SMTP` 将邮件发送到服务器进行后续投递。极少数的 `MTAs`\
  \ 实现用于检索邮件的 `POP3` 协议。相反，它们将邮件写入文件，然后由独立的 `POP3` 服务器程序读取。第 15 章解释了如何在你的系统上启用 `POP3`\
  \ 服务器，第 33 章更详细地解释了该协议。\n\n客户端联系以发送消息的邮件服务器通常位于其局域网、客户端系统连接的 ISP 处，甚至在同一台系统中。理想情况下，这第一个\
  \ `MTA` 将直接联系目标服务器，但情况并非总是如此。目标 `MTA` 可能会宕机或无法访问，在这种情况下，电子邮件将发送到备用服务器。`SMTP` 转发规则或每个用户的邮件转发设置可能会导致邮件消息在最终投递到信箱文件之前发送到其他服务器。\n\
  \n如果你想让你的系统能够接收电子邮件，你就需要运行一个 `MTA` 程序。这只是第一步。要运行如 `example.com` 这样的自定义邮件域名，以便发往\
  \ `foo@example.com` 的邮件投递到你系统上的信箱 `foo`，需要一些网络和 DNS 配置。通常，你的系统需要一个固定的 IP 地址和到互联网的永久连接。这意味着在偶尔通过拨号连接的系统上运行适当的邮件服务器是不现实的。\n\
  \n为了让互联网上的其他服务器知道将邮件发送到你的系统，必须创建适当的 DNS 记录。通常，为像 `example.com` 的域名定义一个 `MX`（邮件服务器）记录，其值为你的系统的主机名，例如\
  \ `server.example.com`。这告诉其他 `MTAs` 连接到你的系统以递送 `example.com` 域名的电子邮件。如果你为该域名运行自己的\
  \ DNS 服务器，第 30 章详细解释了如何创建 `MX` 记录。否则，你必须告诉托管该域名的人（例如你的 ISP）添加正确的记录。\n\n事实上，任何系统都可以接收发往其完整互联网主机名的电子邮箱地址，例如\
  \ `jcameron@linuxbox.example.com`。只要没有匹配 `linuxbox.example.com` 的 `MX` 记录，其他邮件服务器将对主机名进行正常的\
  \ `A`（地址）记录查找并直接连接到该系统。\n\n有时，即使你有动态分配的 IP 地址或瞬时互联网连接，运行邮件服务器也是意义的。`Fetchmail` 程序（第\
  \ 33 章介绍）可以使用 `POP3` 协议下载电子邮件并将其投递到你系统上的本地信箱，这需要运行一个 `MTA`。这个本地邮件服务器可能永远不会接受来自互联网另一个系统的直接\
  \ `SMTP` 连接，但它仍然可以将你系统上的程序发送的邮件投递到本地信箱。\n\n有时，运行一个仅处理本地客户端程序发送的出的邮件、而不处理传入消息的邮件服务器是有用的（甚至是必要的）。与其配置邮件客户端使用远程\
  \ `MTA`（例如你 ISP 处的那个），你可以告诉它们使用你自己系统的邮件服务器。它将接受本地客户端的消息并尝试将其投递到最终目的地，或者将它们放入队列稍后投递。某些发送电子邮件的程序只能使用本地邮件服务器，它们通过运行\
  \ `sendmail` 程序与之连接。\n\n几乎所有的 ISP 和公司都运行自己的邮件服务器。如果你乐于使用你组织或 ISP 域名的电子邮件地址，就没有必要运行自己的。相反，你只需配置你的\
  \ Linux 邮件客户端（如 KMail 或 Evolution），从另一个服务器下载邮件并通过该服务器发送邮件。对于大多数只有一个电子邮件地址且不需要托管自己邮件域名的用户来说，没有必要设置邮件服务器。\n\
  \n### 37.2 Sendmail 配置模块\n\n`sendmail` 是目前互联网上最流行的 `MTA`，自它首次开发以来一直如此。它作为标准配置包含在几乎所有\
  \ UNIX 系统的变体中，并在所有系统上的工作原理相同。它在路由和处理电子邮件方面具有许多有用功能，例如别名（aliases）、域名路由和允许用户创建的转发文件。\n\
  \n`sendmail` 在 UNIX 用户和信箱之间有一有一一的映射关系。每个用户都有自己的邮件文件，通常位于 `/var/mail` 或 `/var/spool/mail`\
  \ 目录下。每当消息投递给一个用户时，它就会被追加到该目录下与用户同名的文件中，例如 `/var/mail/jcameron`。`sendmail` 并没有“邮件用户”的概念。如果你想创建一个新信箱，你需要像第\
  \ 4 章解释的那样添加一个新的 UNIX 用户。\n\n`sendmail` 有两种不同的方式接受邮件，要么通过 `SMTP` 连接，要么通过另一个程序调用\
  \ `sendmail` 命令并将邮件作为输入。。无论是哪种方式，消息都会被投递到本地信箱或另一个系统。正如你预期的那样，如果 `Sendmail` 服务器进程没有运行，则无法通过\
  \ `SMTP` 向你的系统发送电子邮件。任何队列中的邮件也将无法被投递。\n\n`sendmail` 的主配置文件相应命名为 `sendmail.cf`，位于\
  \ `/etc` 或 `/etc/mail` 目录下。对于本地域名、邮件转发别名、地址映射以及本章后面讨论的其他功能，还有单独的文本和 DBM 格式文件。几乎所有的额外文件实际上都是\
  \ DBM 数据库格式，但它们是由系统管理员（以及 Webmin）可以编辑的相应文本文件生成的。不过 `sendmail` 只读取 DBM 文件并在接收每条消息时重新检查它们，以便对任何数据库文件的更改都能立即生效。要要使用\
  \ Webmin 设置 Sendmail，你需要访问 Sendmail 配置模块，它可以在 Servers 类型下找到。假设你已经安装了该服务器，该模块的主页将如图\
  \ 37.1 所示。\n\n##### 图 37.1 Sendmail 配置模块。\n\n![](img/37fig01.jpg)\n\n如果模块在系统上找不到\
  \ Sendmail 服务器程序或主配置文件，将显示相应的错误信息。检查你的 Linux 发行版 CD 或网站获取 `sendmail` 软件包，并使用软件软件包模块（第\
  \ 12 章介绍）进行安装。如果有其他以 `sendmail-` 开头的软件包（如 `sendmail-cf` 或 `sendmail-docs`），也一并安装。\n\
  \n\n\n\n\n在极少数情况下，如果你安装了 Sendmail 或将其配置文件放置在不同于该模块预期的位置，也可能发生此错误。默认情况下，它假设你将使用操作系统自带的软件包，但这些包通常已经过时了。由于这个原因，你可能在不同的目录下编译并安装了最新版本。如果是这样，请参阅第\
  \ 37.15 节“配置 Sendmail 配置模块”，获取如何更改程序和配置文件路径的说明。\n\n多年来，Sendmail 经历了许多不同的版本，在此期间，它的主配置文件（通常位于\
  \ `/etc/sendmail.cf`）发生了变化。如果你运行的是非常旧的版本或使用旧的配置文件，该模块的主页将显示错误消息，指示文件格式不受支持。版本 7\
  \ 之前的配置会触发此错误，但幸运的是，这些配置在现代 UNIX 系统上很少见。\n\n如果主页上没有出现错误消息，将显示图 37.1 所示的图标表。点击每个图标可以访问\
  \ Sendmail 的功能之一，例如邮件别名、域名路由或邮件队列。本章的其余部分解释了如何使用每个图标下的页面和表单。在每个图标名称（如地址映射）旁边，括号中列出了它所控制的\
  \ Sendmail 配置功能的内部名称，例如 `virtuser`。这些名称对于想要了解模块中的图标与实际配置文件及指令之间关系的资深管理员来说大部分非常有用。\n\
  \n点击某些图标时，可能会显示诸如“你的 Sendmail 配置未启用地址映射（`virtuser`）功能”之类的消息。在许多操作系统上，主 Sendmail\
  \ 配置文件默认并没有激活所有可用功能。若要使所选图标的页面可用，请按照第 37.11 节“使用 M4 添加 Sendmail 功能”中的说明操作。\n\n如果\
  \ Sendmail 服务器进程正在运行，主页底部将出现标记为“停止 Sendmail”的按钮。正如名称所示，点击此按钮将关闭服务器，使你的系统不再接受 SMTP\
  \ 连接且不再扫描邮件队列。当 Sendmail 未运行时，将取之出现一个“启动 Sendmail”按钮，可用于启动服务器进程。\n\n如果你希望 Sendmail\
  \ 一直运行，请使用启动和关闭模块（第 9 章介绍）使其在系统启动时启动服务器进程。大多数软件包将包含一个可以启用的操作脚本，甚至可能默认启用。如果你的系统中没有，你需要创建一个在启动时运行命令\
  \ `/usr/sbin/sendmail -bd -q30m` 的操作。\n\n### 37.3 编辑本地域名和域名伪装\n\n当 Sendmail 通过 SMTP\
  \ 连接接收邮件消息时，它需要确定是应该投递到本地还是转发到另一个服务器。这是通过查看邮件的 `To:` 地址（特别是 `@` 之后的域名部分）来实现的。将域名与本地域名列表进行比较，如果找到匹配项，则邮件将投递到\
  \ `To:` 地址中 `@` 符号左侧用户的信箱。如果不存在此类用户，则会生成退信邮件并发送回原始发件者。\n\n如果域名不是本地的，Sendmail 将查找该域名的邮件服务器并尝试连接它以传输消息。这通常是同一网络上的客户端连接并发送邮件时发生的情况。然而，如果\
  \ Sendmail 尝试连接回自身，就会出现问题，这在 DNS 显示它是某个不在本地域名列表中的域名的邮件服务器时可能会发生。如果发生这种情况，将向发件者发送退信，其中包含类似“邮件循环回到这里”的文本。\n\
  \n默认情况下，此本地域名列表仅包含你系统的完整主机名，例如 `server.example.com`。如果你正在设置服务器以接收来自特定域名（如 `example.com`）的互联网邮件，则需要将其添加到列表中。请按照以下步骤操作：\n\
  \n1. 在模块的主页上，点击“本地域名”图标。将显示一个包含文本框的页面，框内列出了所有当前的本地域名。\n2. 在列表中添加任意数量的域名或主机名，每行一个。服务器接受多个域名的邮件是非常可能的，特别是当它被用于虚拟托管时。正如引言所示，只有当每个域名存在适当\
  \ MX DNS 记录时，邮件最初才会发送到你的系统。\n3. 点击页面底部的保存按钮以使其生效。\n\nSendmail 总是接受 `To:` 地址不包含域名而仅包含用户名的本地投递邮件消息。这些邮件通常由运行在系统本身上的程序发送，例如\
  \ Cron 守护进程或 `mail` 命令。\n\n本地域名列表的另一面是域名伪装。此 Sendmail 功能允许你在未指定域名（例如通过 `mail` 命令）时设置添加到从你的系统发出的邮件中的域名。它还可以让\
  \ Sendmail 修改通过 SMTP 接收的邮件（如邮件客户端发送的邮件）的 `From:` 地址域名。\n\n设置域名伪装，请按照以下步骤操作：\n\n\
  1. 在模块的主页上点击“域名伪装”图标。\n2. 在“伪装域名”字段中填入应附加到缺失域名的输出 `From:` 地址的域名，例如 `example.com`。如果该字段为空，Sendmail\
  \ 将不进行域名修改。\n3. 若要让 Sendmail 重写来自其他域邮件的 `From:` 地址，请填写“要伪装的域名”字段。如果某些通过你的服务器发送消息的邮件客户端坚持使用错误的域名，这可能非常有用。\n\
  4. 点击保存按钮使伪装生效。\n\n在大多数邮件服务器上，你不需要费心配置伪装，因为所有邮件都是客户端程序使用 SMTP 发送的。所有邮件客户端都允许用户指定完整的\
  \ `From:` 地址，其中应包含正确的域名。\n\n### 37.4 管理邮件别名\n\n邮件别名指定了你的服务器接收的特定信箱的邮件应该转发到不同的目标。该目标可以是另一个电子邮件地址、地址文件、本地文件，甚至是程序的输入。它们对于设置实际上向真实人物发送邮件的伪信箱非常有用，例如\
  \ `sales@example.com` 或 `webmaster@example.com`。别名可以与 UNIX 用户同名，在这种情况下它将拦截所有给该用户的邮件并将其转发到不同的目标。\n\
  \n在大多数操作系统上，Sendmail 默认为 `bin`、`nobody` 和 `uucp` 等系统用户定义了几个别名，所有别名都将邮件转发给 `root`。还有一个\
  \ `postmaster` 别名，每个邮件服务器必须具备，并且应该转发给负责邮件服务器的人。通常，这也是 `root` 用户。\n\n若要使用 Webmin\
  \ 创建自己的邮件别名，请按照以下步骤操作：\n\n1. 在模块的主页上，点击“邮件别名”图标。你将进入一个列出所有现有别名及其目标的页面，顶部有一个添加新别名的表单。图\
  \ 37.2 显示了一个示例。\n\n#### 图 37.2. 邮件别名列表。\n\n![](img/37fig02.jpg)\n\n\n\n\n\n在“创建别名”（Create\
  \ Alias）表单的“地址”（Address）字段中，输入该别名的用户或邮箱名称（@ 符号侧的部分）。如果您的服务器托管了多个域名，别名将转发发送到这些域名中任一名称的电子邮件。例如，如果您的服务器接收\
  \ `foo.com` 和 `bar.com` 的邮件，那么名为 `sales` 的别名将把邮件转发到 `sales@foo.com` 和 `sales@bar.com`。\n\
  \n如果您希望能够在多个域名上以不同的方式转发相同的邮箱名称，请参阅第 37.6 节“管理虚拟地址映射”。\n\n假设您确实想让 `Sendmail` 使用此别名，请将“启用？”（Enabled?）字段设置为\
  \ `Yes`。将其改为 `No` 将导致该别名被忽略。在编辑别名时，可以使用此字段临时禁用它，而不是完全删除。\n\n“别名至”（Alias to）字段决定发送到此别名的邮件将发送到何处。菜单中提供以下选项：\n\
  \n- `<None>`：对收到的邮件不进行任何操作。在创建新别名时选择此选项没有意义。\n- `Email address`（邮箱地址）：邮件将转发到相邻字段中输入的用户或地址。注意不要通过再次将邮件发送回别名的\
  \ `' ` 地址来设置转发循环！如果您创建的别名与 UNIX 用户同名，且确实希望将邮件也投递到该用户的信箱以及其他目的地，请在此字段中输入在用户名前加反斜杠的用户名（例如\
  \ `\\jcameron`）。反斜杠会告诉 `Sendmail` 跳过别名检查。\n- `Addresses in file`（文件中的地址）：发送到别名的邮件将发送到相邻文本字段中输入的文件路径的文本文件中所有地址。每个地址必须单独占一行。此选项对于创建简单的邮件列表非常有用，且\
  \ `Majordomo` 列表管理器使用了此类类型的别名（见第 34 节）。\n- `Write to file`（写入文件）：别名收到的邮件完整文本（包括所有标头）将附加到文本框中输入路径的文件中。\n\
  - `Feed to program`（馈送至程序）：将运行在文本框中输入路径和参数的程序，并将别名收到的邮件完整文本（包括所有标头）作为输入馈给它。这种别名对于想要对邮件进行进行自定义处理或过滤的程序员来说最有用。该程序通常以\
  \ UNIX 用户守护进程身份运行，而不是 root 或与别名同名的用户运行。\n- `Autoreply from file`（从文件自动回复）：当邮件发送到别名时，相邻文本框指定的指定内容将返回给原始发送者。有关使用此类别名的更多信息，请参阅第\
  \ 37.12 节“创建自动回复别名”。\n- `Apply filter file`（应用过滤器文件）：发送到别名的邮件将根据文本框中输入的过滤器文件中的规则进行处理，根据邮件内容转发到不同的目的地。详情请参见第\
  \ 37.13 节“创建过滤别名”。别名可以有多个目的地。要添加多个一个目的地，您需要在保存后重新编辑此别名，并在“别名至”表格底部填充选择了 `<None>`\
  \ 的行。\n\n点击 `Save`（保存）将别名添加到列表中并立即激活。\n\n按照 `Webmin` 的惯常做法，您可以通过点击“邮件别名”（Mail Aliases）页面列表上的名称来编辑现有别名。这将弹出一个包含与创建表单相同字段的编辑表单，底部有\
  \ `Save`（保存）和 `Delete`（删除）按钮。第一个将根据您做的任何更改更新别名，而第二个将将其永久删除。\n\n如果 UNIX 用户在其主目录下有一个名为\
  \ `.forward` 的文件，则通常投递到其邮件文件的邮件将发送到 `.forward` 文件中列出的地址。在许多方面，这些文件等同于由个人用户而非由系统管理员创建的别名。`.forward`\
  \ 文件甚至可以包含告诉 `Sendmail` 将邮件发送到另一个文件中地址列表、将其作为输入馈送给程序或将其附加到文件的条目。\n\n此模块不支持编辑 `.forward`\
  \ 文件。然而，`Usermin`（见第 47 节）允许普通用户使用与本节描述几乎完全相同的 Web 界面编辑他们自己的转发文件。\n\n### 37.5 配置中继\n\
  \n在互联网发展的早期，邮件服务器可以安全地将邮件投递到本地域名，并将所有其他邮件转发到另一个 MTA，无论其来源如何。今天，允许您的服务器转发其收到的任何邮件等异于邀请垃圾邮件发送者将您的系统作为中继。一个配置良好的服务器应该只接受来自信任客户端主机（如公司网络或家庭局域网）的非本地域名邮件。发送到本地域名的邮件是安全的，可以从任何地方接受。\n\
  \n出于此原因，现代 Linux 发行版带的 `Sendmail` 包默认配置为防止服务器接受除同一系统以外任何地方非本地邮件。如果您为公司或家庭局域网设置邮件服务器，将遵循以下步骤允许其他主机也中继邮件。如果您系统上的\
  \ `Sendmail` 是一个开放中继（即从任何地方接受非本地邮件的中继），发送数百万封垃圾邮件的人可以利用它来掩盖踪迹。即使您为一家极小的公司运行小型邮件服务器，您认为没有垃圾邮件发送者会知道，让您的系统开放中继仍然是一个非常糟糕的主意。\n\
  \n在模块主页上，点击 `Relay Domains`（中继域名）图标调出输入中继网络和域名的表单。\n\n在“允许中继的域名”（Domains to which\
  \ relaying is allowed）字段中，添加您想要允许客户端中继的网络地址。输入时不应带有任何末尾零，例如 `192.168.1`。可以输入多个网络，也可以输入特定的\
  \ IP 地址。\n\n您还可以输入像 `foo.com` 这样的域名，`Sendmail` 将允许对其进行中继。任何指向指定域的收到的邮件（无论来源如何）将投递到相应的服务器。如果您的系统是其他无法通过互联网直接访问的域的邮件网关，这可能非常有用，正如第\
  \ 37.7 节“配置域名路由”所解释。\n\n点击 `Save`（保存）按钮激活新的中继域名列表。\n\n`Sendmail` 中继限制的一个副作用是，当您从不受信的网络连接时，没有方法将您的系统用作发送邮件的服务器。事实上，这正是其意义所在。如果您拨接入许多不同的\
  \ ISP 且不想为每个 ISP 重新配置您的邮件客户端以使用不同的发送邮件服务器，这有时会令人困恼。在理想的世界里，无论您从何处连接，都可以使用自己的邮件服务器发送外邮件，但在完全不关闭中继限制的情况下，这通常是不可能的。\n\
  \n曾尝试通过在 SMTP 协议中添加扩展以支持身份验证来解决这个问题，以便使用用户名和密码登录的客户端被允许中继。遗憾的是，这些扩展尚未被邮件客户端或 `Sendmail`\
  \ 广泛支持，且此 `Webmin` 模块尚未支持配置它们。\n\n另一种解决方案是信任在 SMTP 之前建立 POP3 连接的客户端，大多数邮件客户端程序都是这样做。然而，这需要\
  \ POP3 服务器与 `Sendmail` 之间的协作，它们通常是无关的程序。在编写期间，`Webmin` 也不支持配置 `Sendmail` 和 POP3\
  \ 服务器来实现此操作。\n\n### 37.6 管理虚拟地址映射\n\n\n\n\n地址映射（Address mappings）与别名（aliases）相似，但它们仅适用于发送到特定用户和域名的邮件，而不是像别名那样适用于任何域名的用户。另一个区别是，地址映射只能将邮件转发到单一地址，而无法到程序、文件或地址列表。然而，这种局限性可以通过结合地址映射和别名来克服。\n\
  \n你可以使用地址映射将发送到 `sales@foo.com` 和 `sales@bar.com` 的邮件发送到不同的最终目的地，即使你的服务器托管了这两个域名。如果你为不同的客户管理大量的邮件域名，这一点就尤为有用，因为许多客户希望在自己的域名中拥有相似的地址（例如\
  \ `sales`）。\n\n地址映射还可以用于将所有发送到特定域名的邮件重定向到另一个域名的相同用户，这样发送到 `bob@foo.com` 和 `fred@foo.com`\
  \ 的邮件将分别发送到 `bob@bar.com` 和 `fred@bar.com`。更好的是，你可以让所有发送到某个域名内任何地址的邮件都发送到另一个单一地址，这对于第\
  \ 33 章中介绍的 POP3 邮件客户端 `Fetchmail` 很有用。\n\n### 创建新的地址映射，请遵循以下步骤：\n\n在模块的主页上，点击 `Address\
  \ Mappings` 图标。将将列所有现有映射的页面，顶部有一个标记为 `Create Mapping` 的表单用于添加新映射。\n\n如果你想为发送到单一地址的邮件创建映射，请在\
  \ `Mail for` 字段中选择 `Address`，并在相邻的文本框中输入该地址。与别名不同，它必须完整输入，如 `fred@example.com`。\n\
  \n如果你正在为所有发送到某个域的邮件创建映射，请选择 `Domain` 选项，并在旁边的文本字段中输入完整的域名或主机名，例如 `example.com`。\n\
  \n无论哪种方式，地址中的域名或输入的域名都必须出现在 `Sendmail` 的本地域名列表中，该列表在本章之前的“Editing Local Domains”节中解释过。\n\
  \n如果映射的终点目标是单一地址，请在 `Send to` 字段中选择 `Address`，并在旁边的文本框中填入完整地址（如 `jcameron@foo.com`）或邮箱名称（如仅\
  \ `jcameron`）。\n\n如果在 `Mail for` 字段中选择了 `Domain`，则允许在此字段中也选择 `Domain` 选项。如果是这样，你必须在相邻的文本框中输入域名（如\
  \ `foo.com`），所有发送到原始域名的邮件将转发到该域名。\n\n如果你希望向发送者返回特定的错误信息，可以选择 `Send to` 字段中的最后一个\
  \ `Return error` 选项。如果选中，必须从旁边的菜单中选择错误类型，并在文本框中输入更详细的错误信息。此选项对于发送退信邮件（解释为什么特定地址或整个域名已无法访问）非常有用。\n\
  \n点击 `Create` 按钮将地址映射添加到下方表单下方显示的列表中。它将立即生效。\n\n与别名一样，你可以通过点击列表中的地址来编辑或删除现有映射。这将弹出一个与创建映射时相同的表单，但在底部有\
  \ `Save` 和 `Delete` 按钮。\n\n如果针对某个域名和该域名下的某个地址都存在映射，`Sendmail` 将对发送到该特定地址的邮件使用后者，对发送到该域内任何其他邮箱的邮件使用前者。实际上，更具体的地址映射优先级高于更通用的映射。它们在\
  \ `Address Mappings` 页面列表中的顺序完全无关。\n\n如果你想创建一个将邮件转发到程序、文件或地址列表的映射，你还需要创建一个别名。地址映射将把邮件发送到别名，然后由别名将其转发到真实目的地。别名应分配一个与地址映射相关的名称，例如，为虚拟地址\
  \ `jcameron@webmin.com` 的映射使用 `jcameron-example-com` 作为别名。\n\n在拥有许多域名和用户的系统中，很有可能两个人想在不同的域名中拥有相同的邮箱名称，例如\
  \ `bob@foo.com` 和 `bob@bar.com`。由于 `Sendmail` 最终只将邮件递送到 UNIX 用户的邮件文件，而两个 UNIX 用户不能同名，这可能会成为问题。通常的解决方案是创建名为如\
  \ `bob-foo` 和 `bob-bar` 的用户，并设置相应的地址映射将邮件转发给他们。唯一的缺点是用户需要登录。\n\n### 37.7 配置域名路由\n\
  \n`Sendmail` 的域名路由（domain routing）功能可将所有发送到特定域的邮件转发到不同的服务器。如果你需要在无法使用 DNS 信息的网络中设置\
  \ Sendmail，这最有用。要添加新的新的域名路由规则，请遵循以下步骤：\n\n在模块的主页上，点击 `Domain Routing` 图标。将显示列出现有路由（如果有）的页面，上方是添加新路由的表单。\n\
  \n要将发送到特定域或主机的邮件路由到别处，请在 `Mail for` 字段中选择 `Host` 并在相邻字段输入主机名。或者，如果你想路由域名内所有主机的邮件，请选择\
  \ `Domain` 并在其字段中输入域名。针对 `example.com` 的此类路由不会影响发送到域名内地址的邮件（如 `jcameron@example.com`），只会影响发送到域名下主机的邮件（如\
  \ `jcameron@foo.com`）。通常，这并不是你想要的。\n\n你输入的任何域名或主机名必须在 `Sendmail` 允许中继的列表中，如第 37.5\
  \ 节“Configuring Relaying”所示。\n\n从 `Delivery` 菜单中选择 `SMTP`。此字段告诉 `Sendmail` 在路由该域邮件时使用何种协议。其他大多数选项都是没用的，因为它们涉及几乎不再使用的\
  \ UUCP。\n\n在 `Send to` 字段中，输入应转发邮件的系统主机名。应勾选 `Ignore MX for SMTP` 框，这样 `Sendmail`\
  \ 总是直接递送到此主机，而不是尝试其他 DNS 查找。\n\n点击 `Create` 按钮添加并激活新的域名路由。你应该进行测试以确保它确实有效，因为小的错误（例如选择了\
  \ `Domain` 而不是 `Host`）可能会导致路由无法工作。\n\n与模块中的其他页面一样，可以通过点击 `Domain Routing` 页面列表上的域名名来编辑或删除现有路由规则。但是，没有像别名那样临时禁用规则的方法。\n\
  \n### 37.8 编辑全局 Sendmail 选项\n\n全局选项控制诸如最大消息大小、重试天数、负载平均限制以及输出邮件服务器。以下步骤解释了如何编辑一些最实用的选项：\n\
  \n在模块的主页上，点击 `Sendmail Options` 图标。将显示编辑全局选项的表单（如图 37.3 所示）。\n\n##### 图 37.3. Sendmail\
  \ 选项页面。\n\n![](img/37fig03.jpg)\n\n\n\n\n当“通过主机发送外邮件”（Send outgoing mail via host）字段设置为`Deliver\
  \ directly`直接交付）时，`Sendmail` 将为非本地消息查找正确的邮件服务器并连接它发送电子邮件。然而，如果您选择了第二个选项并在文本框中输入主机名，则除本地用户的消息外，所有消息将发送到该主机。这通常是您的\
  \ ISP（互联网服务商）或公司网络上的中央邮件服务器。\n\n如果某个地址存在域名路由规则，其优先级将高于在此字段中设置的任何服务器。\n\n## 递送模式\n\
  递送模式（Delivery mode）字段控制 `Sendmail` 处理传入消息。可用选项有：\n\n- **后台或默认 (Background or Default)**：在此模式下，电子邮件将立即从客户端接收，然后由单独的后台进程递送到目的地。这通常是您需要的。\n\
  - **仅入队或延迟 (Queue only or Deferred)**：当选择其中一种模式时，`Sendmail` 将简单地将传入的消息添加到其邮件队列中。只有在显式刷新队列时，它们才会发送到目的地。如果您的系统并非总是连接到互联网，或者您想显式控制服务器发送消息的时间，这会非常有用。当在这任一模式下接收消息时，`Sendmail`\
  \ 不会对源或目的地址进行验证，如果您的系统断开网络连接，这会导致问题。\n- **交互式 (Interactive)**：此模式与 `Background`\
  \ 类似，不同之处是电子邮件是由从客户端接收它的同一个进程递送的。这意味着客户端必须等待 `Sendmail` 将其消息传输到下一个或目标服务器，这可能需要一些时间。不过，它减少了\
  \ `Sendmail` 需要启动的进程数量。\n\n## 连接选项\nSMTP 端口选项（SMTP port options）字段可用于设置 `Sendmail`\
  \ 监听 SMTP 连接的 TCP 端口。可以输入的实际值可能非常复杂，但如果您希望您的系统接受来自标准 SMTP 端口任何地方的连接，您只需输入 `Name=MTA`。在某些操作系统上，这不是默认设置，`Sendmail`\
  \ 将仅接受来自 `localhost` 的连接。\n\n“发送邮件的最大平均负载”（Max load average for sending）字段可用于设置一个平均负载值，超过该值后\
  \ `Sendmail` 将不再发送消息。正如第 11 章所示，平均负载是对某一时刻系统上运行进程数量的粗略估计。此选项和下一个选项对于限制 `Sendmail`\
  \ 在您的系统上消耗 CPU 时间很有用，尽管后者更有用。\n\n如果选择了 `Default`（默认），无论平均负载如何，服务器将继续处理邮件队列并发送消息。\n\
  \n要设置一个 `Sendmail` 将不再接受新消息的平均负载值，请在“接收邮件的最大平均负载”（Max load average for receiving）字段中输入一个值。当达到此层级时，服务器将关闭\
  \ SMTP 端口，直到负载降回该以下。通常，您输入的任何内容都应低于为“发送邮件的最大平均负载”设置的限制，以便即使在负载很高时，邮件队列仍被处理。\n\n\
  当选择 `Default` 时，`Sendmail` 无论平均负载如何都会接受新连接。\n\n“放弃前时间”（Time before giving up）字段指定了\
  \ `Sendmail` 在尝试向无法联系的远程服务器发送电子邮件时，向发送者返回退信邮件之前所尝试的时间。您输入的值必须是一个数字，后跟 `d`（天）或 `h`（小时）。只有当您的系统可能断开互联网连接超过\
  \ 5 天且您不希望队列中的消息被退回时，才应更改此项。\n\n“发送前警告时间”（Time before sending warning）字段指定了 `Sendmail`\
  \ 在向原始发送者发送警告之前在队列中保留消息的时间。如果您的系统是某些域名的备邮件服务器或经常断开网络，则应将其增加到与上一个字段相同的时间。\n\n要更改\
  \ `Sendmail` 发送致命或双重退信消息的地址，请在“错误消息发送”（Send error messages to）字段中输入新地址。选择 `Postmaster`\
  \ 时，这些消息将发送到 `Postmaster` 邮箱，这通常是 `root` 的别名。\n\n要限制 `Sendmail` 为队列消息消耗的磁盘空间，请填写“最小空闲磁盘空间”（Min\
  \ free disk space）字段。如果空闲块数降到此水平以下，将不再接收新的传入消息。块的准确大小取决于所用文件系统的类型，但它们的大小通常为 `1 kB`\
  \ 或 `512 bytes`。\n\n要停止通过您的邮件服务器发送大型消息，请填写“最大消息大小”（Max message size）字段。任何大于输入字节数的电子邮件在接收时都会被拒绝。如果您有缓慢的网络连接和不可信的客户端用户，此选项可以节省带宽。\n\
  \n最后，点击 `Save and Apply`（保存并应用）保存新的全局选项。`Webmin` 将自动为您重启 `Sendmail` 以激活这些选项。\n\n\
  ### 37.9 查看邮件队列\n当 `Sendmail` 接收消息时，它会被放入邮件队列。如果它可以立即发送到目的地，它将立即从队列中移除。然而，如果发送时发生某些临时错误，它将留在队列中以便稍后处理。`Sendmail`\
  \ 服务器进程定期检查队列中的消息，并以越来越长的间隔重试每一个。最后，在消息在队列中留存过长（通常为 5 天）后，它将被移除并向原始发送者发送退信邮件。\n\n\
  队列中长时间留存大部分消息是因为目标邮件服务器宕机或无法访问。另一个常见原因是远程 `MTA` 报告的临时错误，例如磁盘空间不足。`Webmin` 允许您按照以下步骤查看队列中的消息甚至删除它们：\n\
  \n1. 在模块的主页上，点击 `Mail Queue`（邮件队列）图标进入列出队列消息详情页面。队列中的电子邮件数量显示在图标下方，让您可以一目了然。\n2.\
  \ 所有队列消息的 `ID`、`sender`（发送者）、`destination`（目的地）、`subject`（主题）和 `size`（大小）显示在邮件队列页的表格中。最后一列是当前状态，指示\
  \ `Sendmail` 目前尝试对消息的操作。当 `Sendmail` 尝试连接远程服务器时，将显示 `Sending`（发送中），当连接失败时，将显示 `Deferred`（延迟）以及原因。\n\
  3. 如果队列包含超过 20 条消息，则仅显示前 20 条。要查看其余消息，请使用列表上方左右箭头按钮。\n4. 要查看电子邮件的实际内容，点击队列中的 `ID`。所有标头、正文和任何附件都将显示。要查看附件，只需点击其图标。要从队列中删除此消息，点击页面底部的\
  \ `Delete`（删除）按钮。\n5. 要从队列中删除多条消息，首先使用 ID 旁边的复选框以及队列列表上的 `Select all`（全选）和 `Invert\
  \ selection`（反选）链接来选择它们。然后，点击 `Delete selected messages`（删除所选消息）按钮移除您选择的消息。要覆盖所选邮件的任何锁定，先勾选\
  \ `Even if locked`（即使已锁定）框。\n6. 点击 `Delete` 按钮后，将显示一个列出每个所消息的 `ID` 和删除结果的页面。如果消息不在队列中或处于锁定状态，删除可能会失败。\n\
  \n\n\n尽管 `Sendmail` 会自动重试队列中的消息，但你仍然可以使用 Webmin 强制其立即尝试交付所有队列中的消息。如果你使用的是拨号上网连接，并在断开期间排队了多封电子邮件，这就会非常有用。刷新队列的步骤如下：\n\
  \n在模块主页上，点击 `Mail Queue`（邮件队列）图标进入队列消息列表。\n\n只要队列不为空，页面底部就会显示标记为 `Flush Mail Queue`（刷新邮件队列）的按钮。点击它开始立即处理所有等待中的消息。\n\
  \n将显示一个显示 `Sendmail` 在尝试交付队列邮件时的输出内容的页面。如果你有一个包含指向宕机远程服务器消息的大队列，可能需要很长时间才能完全显示。\n\
  \n### 37.10 读取用户的电子邮件\n\n如引言所述，`Sendmail` 将用户收到的消息存储在 `/var/mail` 或 `/var/spool/mail`\
  \ 目录下的文件中。这些文件由 `POP3` 服务器、如 `pine` 或 `elm` 等命令行邮件客户端，或如 `Usermin` 等 Web 邮件客户端读取并清空。然而，此\
  \ Webmin 模块也可以作为一个简单的邮件客户端，允许你作为系统管理员读取任何用户的电子邮件。\n\n此功能对于删除用户邮箱中的大型邮件非常有用，否则通过慢速拨号\
  \ `POP3` 连接下载这些邮件将花费很长时间。它还允许你读取如 `root` 等系统用户的电子邮件，而无需 `telnet` 登录或运行单独的邮件客户端。更具争议的是，在多用户系统中，通过读取他们的个人电子邮件（假设他们尚未通过\
  \ `POP3` 下载并删除它们），你甚至可以侵犯他人的隐私。\n\n以下步骤显示了如何检查用户邮箱的内容：\n\n在模块主页上，点击 `User Mailboxes`（用户邮箱）图标。将显示一个列出系统中所有用户及其邮箱大小的页面，除非你的用户超过\
  \ 200 个。在这种情况下，将出现一个用于输入用户名的的小表单。\n\n要查看实际消息，点击 `From`（发件人）列中的发送者姓名。将出现显示重要表头、正文和附件的页面。点击附件图标进行查看，前提是你的浏览器或外部程序支持该数据类型。\n\
  \n要仅从用户邮箱中删除这封邮件，点击页面底部的 `Delete`（删除）按钮。如果邮箱非常大（超过 10 MB）或包含大量消息，这可能需要相当长，因为 Webmin\
  \ 需要重写整个邮件文件。\n\n点击用户名称打开其邮箱中的消息列表，如图 37.4 所示。默认情况下，先显示最新的消息，尽管它们实际上位于邮件文件的末尾。\n\
  \n#### 图 37.4. 用户邮箱的内容。\n\n![](img/37fig04.jpg)\n\n如果邮箱包含超过 20 封电子邮件，则仅显示前 20 封。要翻阅其余邮件，使用列表上方的左右箭头按钮。\n\
  \n要删除多条消息，首先在邮件列表页面使用复选框以及 `Select all`（全选）和 `Invert selection`（反向选择）链接选择它们。然后，点击列表上方或下方的\
  \ `Delete` 按钮。再次强调，大型邮箱可能需要一段时间。\n\n要在用户邮箱中搜索符合某些标准的消息，使用列表下方的 `Find messages where`（查找消息条件）表单。可以从菜单中选择以下类型的搜索：\n\
  \n- `From: matches`、`Subject: matches`、`To: matches` 或 `Cc: matches`：查找 `From`、`Subject`、`To`\
  \ 或 `Cc` 字段包含相邻文本框中输入文本的消息。比较不区分大小写，但不能使用正则表达式字符。\n- `Date: matches`：查找发送日期表头包含输入文本的消息。此表头不会转换为本地格式，因此你输入的任何内容必须与发送者使用的日期格式匹配。\n\
  - `Body matches`：查找正文包含输入文本的消息。正文包括所有以未编码形式的附件，而不仅仅是你在阅读邮件时显示的文本。\n- `Size is greater\
  \ than`：查找总大小大于相邻字段中输入的字节数的消息。\n\n对于上述每种搜索类型，也提供反向类型，例如 `From: doesn't match`（不匹配）或\
  \ `Size is less than`（小于）。在选择好搜索类型并输入匹配文本后，点击 `Search`（搜索）按钮。将显示一个列出所有匹配消息的页面，你可以像普通邮件列表一样查看邮件内容，或选择部分或全部邮件进行删除。\n\
  \n该模块的邮件读取部分实际上允许你编写新消息并对现有消息进行回复或转发。事实上，它可以被作为一个全功能的电子邮件客户端使用，尽管它不是执行此工作的最佳程序。发送消息的默认\
  \ `From` 地址根据邮箱用户的用户名和系统主机名确定，但可以在模块的访问控制页面上按 Webmin 用户进行更改。甚至可以创建 Webmin 用户，让他们仅使用此模块读取他们自己的邮箱，并仅从自己的地址发送电子邮件。\n\
  \n默认情况下，该模块假设每个用户的邮件将存储在 `/var/mail` 或 `/var/spool/mail` 目录中以用户命名的文件中。可以配置 `Sendmail`\
  \ 使用不同的文件路径，例如每个用户主目录下的 `mbox` 文件。如果你的系统情况是这样，你需要重新配置模块，正如第 37.15 节“配置 Sendmail\
  \ 配置模块”中所解释的那样。否则，所有邮箱都将显示为空，因为 Webmin 正在向错误的位置查找它们。\n\n### 37.11 使用 M4 添加 Sendmail\
  \ 特性\n\n主要的 Sendmail 配置文件 `sendmail.cf` 极其复杂，几乎无法手动编辑。幸运的是，它通常由一系列 `M4` 宏文件构建，这些文件要简单得多，并且可以使用此模块或通过手动编辑进行修改。对于以前没听说过的人来说，`M4`\
  \ 是一个解析文本文件并展开其中宏的程序。这些宏可以包含其他文本文件、定义变量和函数，或根据某些条件排除文本。`M4` 与 C 语言语言使用的预处理器（处理 `#include`\
  \ 和 `#define` 语句）非常相似。幸运的是，此模块为你隐藏了大部分复杂的细节。\n\n通常，你的操作系统自带的默认 Sendmail 配置未启用某些功能，例如地址映射或域名路由。Webmin\
  \ 可以检测到这一点，如果你尝试使用某个在主配置文件未启用的 Sendmail 特性的模块页面，将显示错误消息。要开启缺失的功能，必须在主 M4 配置文件中添加条目，并从中重建\
  \ `sendmail.cf`。然后 Sendmail 就能使用它，而此模块也能对其进行配置。\n\n在管理你的 Sendmail M4 配置之前，此模块必须知道在哪里找到\
  \ M4 文件。要检查它是否具有正确的路径并在不是的情况下设置，请遵循以下步骤：\n\n在模块主页上，点击 `Sendmail M4 Configuration`\
  \ 图标。\n\n如果显示类似 `The Sendmail M4 configuration file /etc/sendmail.mc was not found`（未找到\
  \ Sendmail M4 配置文件 /etc/sendmail.mc）或 `The locations of the Sendmail M4 base directory\
  \ and M4 config files have not been set`（尚未设置 Sendmail M4 目录和 M4 配置文件的位置）的错误消息，则模块找不到\
  \ M4 文件。如果显示的是文件的条目列表，则说明一切配置正常，你可以跳过其余的步骤。\n\n\n\n如果你正在运行 Linux，请检查你的发行版 CD 或网站，以确保所有名称以\
  \ `sendmail` 开头的包都已安装。有时 `M4` 文件位于一个名为类似于 `sendmail-cf` 的独立包中。如果你确实找到并安装了此类包，请返回第\
  \ 1 步并再次检查该模块是否已找到配置文件。\n\n如果你是从源码包编译并安装的 Sendmail，则 `M4` 文件将位于源代码的 `cf` 子目录下。点击模块主页上的\
  \ `Module Config`（模块配置）链接，将 `Sendmail M4 base directory`（Sendmail M4 基础目录）字段设置为\
  \ `*/path/to/source*/cf`，并将 `Full path to M4 config file`（M4 配置文件的完整路径）设置为 `*/path/to/source*/cf/cf`\
  \ 目录下的相应的通用文件。对于后一个字段，您选择的文件取决于您的操作系统，例如，在 Linux 上您将输入 `generic-linux.mc`，而在 Solaris\
  \ 上您应该输入 `generic-solaris2.mc`。不应选择目录下的 `.cf` 文件，因为它们是完全构建的 Sendmail 主配置，而不是 `M4`\
  \ 宏文件。有关这些字段的更多信息，请参见第 37.15 节“配置 Sendmail 配置模块”。\n\n如果你使用的是随 UNIX 版本附带的 Sendmail\
  \ 包，并且在系统中找不到任何 `M4` 文件，则无法使用模块的此功能。遗憾的是，在某些操作系统上确实如此。\n\n一旦 `Sendmail M4 Configuration`（Sendmail\
  \ M4 配置）页面显示了主 `M4` 文件的内容，你就可以它来添加新功能，例如地址映射或域名路由。事实上，该页面可以修改文件中的任何 `M4` 宏，但除非你是经验丰富的\
  \ Sendmail 管理员，否则最好遵循这些说明说明来添加功能：\n\n- 从页面底部 `Add new entry of type`（添加新类型项）按钮旁边的菜单中，选择\
  \ `Feature`（功能），然后点击按钮进入功能创建表单。\n- 从 `Feature` 菜单中选择你想要添加的项目。最常用的功能旁边带有括号括出的名称，这些名称与其在模块主页上的图标对应。\n\
  - 在 `Parameters`（参数）字段中，输入 `hash o`，后跟用于该功能的文本和 `DBM` 文件的路径。例如，如果添加 `virtusertable`\
  \ 功能，你应该输入 `hash o /etc/mail/virtusertable`（假设你的系统有 `/etc/mail` 目录）。\n- 通过 `SSH`、`telnet`\
  \ 或控制台以 root 身份登录系统，并使用类似 `touch /etc/mail/virtusertable` 的命令创建一个空文本文件。当然，如果它已经存在，则不需要。\n\
  - 点击 `Create`（创建）按钮更新 `M4` 文件并返回上一个页面。\n- 在 `M4` 文件内容列表的最底部，点击 `Rebuild Sendmail\
  \ Configuration`（重构 Sendmail 配置）按钮。将显示一个显示对你的 `sendmail.cf` 文件将进行的精确更改的确认页面。通常，这些更改将限于新功能的指令。如果确认表单显示将更改大量行，那么很可能是正在编辑的\
  \ `M4` 文件最初并非用于构建你当前的 `sendmail.cf` 文件，因此将来不应使用它。\n- 要继续使用新构建的 Sendmail 配置，点击 `Yes,\
  \ replace it now`（是，现在替换）按钮。你的 `sendmail.cf` 文件将得到更新，服务器进程将重启以立即激活它。\n\n返回模块主页，点击你刚刚开启的功能图标。你将能够再次添加和编辑地址映射或你添加支持的任何内容。\n\
  \n正如你通过查看现有的 `M4` 文件条目所示，编辑或向其添加内容可能仍然相当复杂。由于由于原因，本书没有涵盖你可以添加的所有可能功能或其他宏类型。然而，对于大多数人来说，默认值就可以运行得很好。你最多可能只需要像上面说明的那样添加一两个功能。如果你想学习更多关于编辑\
  \ `M4` 配置的知识，你应该买一本关于 Sendmail 管理的书。\n\n使用 `M4` 页面重构 Sendmail 配置的一个问题是，直接对 `sendmail.cf`\
  \ 进行的任何更改将被覆盖。遗憾的是，模块的 `Sendmail Options`（Sendmail 选项）页面恰好就是这样做，因此如果你按照上述说明添加新功能，在该页面上做的任何更改都将丢失！唯一的解决方案是编辑\
  \ `M4` 文件中与 `Sendmail Options` 页面上对应的条目。例如，`Send outgoing mail via host`（通过主机发送外发邮件）字段是由\
  \ `SMART_HOST` 定义设置的。\n\n### 37.12 创建自动回复别名\n\nSendmail 配置模块允许你轻松创建一个别名，向向其发送电子邮件的任何人触发自动回复。当你这样做时，Webmin\
  \ 会创建一个从别名运行的简单脚本，并将发送给它的邮件内容作为输入，就像使用 `Feed to program`（交给程序）别名类型一样。\n\n要设置自动回复别名，请按照以下步骤操作：\n\
  \n1. 在模块主页上，点击 `Mail Aliases`（邮件别名）图标。\n2. 在 `Create Alias`（创建别名）表单中为别名输入名称，并在类型菜单中选择\
  \ `Autoreply from file`（文件自动回复）。如果你想对发送给用户的任何消息设置自动回复（例如，在他休假期间），该名称可以是现有 UNIX 用户名。\n\
  3. 在类型菜单旁边的字段中，输入包含自动回复消息的文件路径，例如 `*/home/someuser/autoreply.txt`。该文件不需要已经存在。\n\
  4. 点击 `Create`（创建）按钮添加别名，然后点击列表中的该名称再次进行编辑。\n5. 按照自动回复文件名字段旁 `Edit`（编辑）链接。这将打开一个带有大型文本框的页面，用于输入回复消息的内容。\n\
  6. 输入你想回给发送者的文本后，点击页面底部的 `Save`（保存）。自动回复现在已完全激活。\n\n回复文本可以包含几个以 `$` 开头的特殊宏，例如 `$SUBJECT`、`$TO`、`$FROM`、`$DATE`\
  \ 和 `$BODY`。在发送回复时，这些将被替换为原始消息的主题、目的地址、发送者地址、日期或正文。在使用 `$BODY` 宏要小心，因为它将被替换为回复的邮件的完整未编码内容。\n\
  \n你还可以通过在回复文本开头以标准头部格式格式添加或覆盖回复消息使用的头部。例如，为了设置自动回复的主题，你可以在文本框顶部输入 `Subject: This\
  \ is an automatic reply`，然后留空一行。\n\nWebmin 自动回复脚本的一个问题是无法可靠地确定发送回复时使用的 `From:` 地址。这通常从原始消息的\
  \ `To:` 地址获取，但在回复发送给多个人的消息时，是不可能的。尽管代码尝试自动找到正确的地址，但有时会获取错误的地址，并发送一个看起来来自错误人员的自动回复。由于原因，你应该通过在回复文本顶部包含类似\
  \ `From: Jamie Cameron <jcameron@example.com>` 的头部行来设置正确的地址。\n\n### 37.13 创建过滤器别名\n\
  \n\n\n\n\nSendmail 别名通常无论内容如何，都会将邮件消息转发到其目的地。然而，你可以使用此 Webmin 模块创建一个别名，根据发送给它的邮件标头或正文，将其转发到不同的地址或文件。当你创建这样的别名时，该模块在内部会创建一个脚本，将邮件内容作为输入传递给别名，就像使用\
  \ `Feed to program` 别名类型时指定的指定的命令一样。\n\n过滤器由一系列规则组成，每条规则包含一个条件和一个操作。条件指定了要检查的标头以及要检查其是否包含在该标头中的文本，而操作则指定了转发到的地址或追加消息的文件。当过滤器接收到消息时，它将按照顺序对规则进行检查，直到找到匹配的规则并执行其操作。列表末尾有一个默认操作，它决定了将不符合任何条件的邮件转发到何处。\n\
  \n与 `Procmail` 和 `SpamAssassin` 等邮件过滤或分类程序相比，Webmin 的过滤器在功能和灵活性方面较为局限。然而，它们很容易创建，且不需要额外的软件。要创建一个过滤器，需要遵循以下步骤：\n\
  \n1. 在模块的主页上，点击 `Mail Aliases`（邮件别名）图标。\n2. 在 `Create Alias`（创建别名）表单中，为别名输入名称并在类型菜单中选择\
  \ `Apply filter file`（应用过滤器文件）。如果你想在投送之前过滤他的邮件，别名可以是现有 UNIX 用户的用户名。\n3. 在类型菜单旁边的字段中，输入包含过滤器规则的文件路径，例如\
  \ `/home/someuser/filter.rules`。由于文件格式相当复杂，除非是按照这些相同步骤创建的，否则你不应输入任何现有文件的名称。\n4.\
  \ 点击 `Create`（创建）按钮添加别名，然后点击列表中的名称再次编辑。\n5. 遵循过滤器规则文件字段旁边的 `Edit`（编辑）链接。这将带你进入图\
  \ 37.5 所示的表单，该表单包含一个用于输入新规则的空行表格和一个用于输入默认操作地址的文本字段。\n\n##### 图 37.5 过滤器创建表单。\n\n\
  ![](img/37fig05.jpg)\n\n6. 在第一行中，从 `If the` 旁边的菜单中选择你想要过滤的标头。要检查整个未解码的邮件正文，请从列表中选择\
  \ `body`。\n7. 如果在标头或正文中发现某些文本则执行该操作，请从第二个菜单中选择 `matches`。如果仅在未发现某些文本时执行操作，请选择 `doesn't\
  \ match`。\n8. 在此菜单旁边的字段中，输入过滤器应检查标头或正文的文本。比较将始终不区分大小写，并且可以使用 Perl 正则表达式字符如 `[`、``.\
  \ `、`+` 和 `*`。\n9. 在 `then forward to`（则转发到）字段中，输入符合你指定条件的消息发送到的邮件地址或邮箱名称。也可以输入绝对文件路径（如\
  \ `/home/someuser/mail/somefolder`），将邮件追加到该路径。这可以是另一个用户的邮件文件或邮件文件夹，但它必须对运行 Sendmail\
  \ 的 UNIX 用户守护进程是可写的。\n10. 要输入另一条规则，请通过重复步骤 6 中的说明来填充第二个空行。系统只显示五个空行，但你可以通过保存并重新编辑过滤器文件来创建五条以上的规则。\n\
  11. 在表格底部的 `Otherwise forward to`（否则转发到）字段中，输入地址或文件名，不符合任何规则的消息将发送到或追加到该处。如果此处留空，未匹配的邮件将被丢弃！\n\
  12. 最后，点击 `Save`（保存）按钮以激活新的过滤器规则。为了确保它们确实有效，你应该向别名发送几条文本消息，并检查它们是否正确投递。\n\n要通过单条规则或默认操作将邮件转发到多个地址，只需将它们用逗号隔开输入其中一个\
  \ `forward to` 字段中。你也可以输入另一个别名的名称作为目的地，该别名随后可以将消息发送到多个文件、地址和/或程序。\n\n在创建与 UNIX 用户同名的过滤器别名时，指定将匹配某些规则的消息投递到用户的普通邮箱箱通常是有用的。然而，仅将用户的名称作为目的地将是一个巨大的错误，因为这将触发通过过滤器的无限循环！相反，你应该在用户名面前加一个反斜杠，例如\
  \ `\\jcameron`。与别名一样，这告诉 Sendmail 忽略此邮箱箱的任何别名。\n\n由于通常很难确定过滤器别名在做什么以及为什么这样做，过滤器脚本会在规则文件相同的目录中创建一个日志文件。日志的名称与过滤器文件相同，但添加了\
  \ `.log` 后缀。别名接收并由过滤器投递到某些目的地的每条消息都会在日志中添加一行，包含日期、时间、发送者、目的地和匹配的规则。不过，只有当目录或日志本身对守护进程用户可写时，才会创建日志文件。\n\
  \n### 37.14 Sendmail 模块访问控制\n\n`Sendmail Configuration`（Sendmail 配置）模块可能拥有 Webmin\
  \ 中任何模块中最强大的访问控制功能。可以使用它们来限制 Webmin 用户可以编辑的别名和虚拟地址，或将其限制为仅读取某些 UNIX 用户的邮箱。这些功能在虚拟托管环境中最为有用，在这些环境中客户拥有邮件域名和用户账户。在这种系统中，你可以为每个客户创建一个\
  \ Webmin 用户，其只能管理自己的域名和用户账户。\n\n一旦你创建了拥有模块访问的 Webmin 用户（如第 52 章所述），请按照以下步骤限制他的操作：\n\
  \n1. 在 `Webmin Users` 模块中，点击用户名称旁边的 `Sendmail Configuration`。\n2. 将 `Can edit module\
  \ configuration?` 字段改为 `No`，以便他无法修改 Sendmail 程序和文件。\n3. 将第二部分中的所有 `Yes/No` 字段设置为\
  \ `No`，这将阻止用户看到模块的图标。\n4. 从 `Can manage mail queue?` 菜单中选择 `No`，或者如果你只想让模块用户查看队列内容，则选择\
  \ `View only`。选择 `Yes` 将是一个坏主意，因为这将允许他删除属于其他域的队列邮件。\n5. 对于 `Address mappings this\
  \ user can edit` 字段，选择 `Matching` 并在旁边的文本字段中输入允许的映射源的 Perl 正则表达式。例如，为了让他他在 foo.com\
  \ 和 example.com 域名创建并编辑映射，你应该输入 `(@foo.com|@bar.com)$`。\n6. 选择 `Address mapping\
  \ types this user can edit` 字段中的所有复选框是安全的。\n7. 在 `Aliases this user can edit` 字段中，选择\
  \ `Matching` 并输入仅允许修改或创建以客户域名开头的别名的正则表达式。例如，如果用户拥有 foo.com 和 example.com 域名，你应该输入\
  \ `^(foo|example)-` 将其限制为如 `foo-jcameron` 或 `example-fred` 的别名。这种命名约定确保用户不会相互干扰别名。要限制用户可以创建映射的数量，选择\
  \ `Maximum number of address mappings` 字段中的第二个单选按钮，并在旁边的框中输入数字。这对于防止单个客户创建超过其支付费用数量的地址映射非常有用。\n\
  \n\n\n\n\n在 `Alias types`（别名类型）此用户编辑字段中，取消勾选不允许 `Webmin` 用户创建的别名类型。应拒绝访问的候选类型包括\
  \ `Write to file`（写入文件）、`Feed to program`（交给程序）、`Autoreply`（自动回复）和 `Filter file`（过滤文件），因为它们使用了\
  \ `Sendmail` 守护进程权限，因此可能存在安全风险。\n\n要限制客户创建别名的数量，请选择 `Maximum number of aliases`（别最大数量）字段中的第二个单选按钮，并在旁框中输入最大值。\n\
  \n阻止 `Webmin` 用户创建运行程序、附加文件或使用特定目录之外文件的别名，可以在 `Limit files and program to directory`（限制文件和程序到目录）字段中输入。遗憾的是，可以通过巧妙使用符号链接绕过此限制，因此这不是一个非常强大的安全措施。\n\
  \n在 `Outgoing addresses`（发送地址）此用户编辑字段中，选择 `Matching`（匹配）并输入与 `Address mappings`（地址映射）用户编辑字段中相同的正则表达式。这将限制用户仅重写其所属域的地址。要完全防止编辑发送地址，请选择\
  \ `None`。在大多数情况下，`Sendmail` 管理员根本不需要编辑它们。\n\n在 `Users whose mail can be read`（可以读取其邮件的用户）字段中，选择最后五个选项之一，将客户限制为仅所属的\
  \ `UNIX` 用户。如果他已被授予 `Users`（用户）和 `Groups`（组）模块的有限权限，那么您应该允许他读取在该模块中可以创建和编辑相同用户的电子邮件。\n\
  \n表单上的其余字段保持默认设置。只有当您将该模块配置为 Web 邮件读取界面时，它们才真正有用。虽然这是可能的，但有更好的替代方案，例如 `Usermin`（见第\
  \ 47 节）。\n\n点击 `Save`（保存）按钮使用户限制生效。\n\n尽管配置此模块可以将用户限制在某些域名，但与 `Plesk` 或 `Cpanel`\
  \ 等产品相比，该模块的界面并不友好。这些是基于 Web 的虚拟服务器管理界面，从底层开始就是为此目的设计的，而 `Webmin` 的设计是为了允许管理系统上的所有内容。\n\
  \n### 37.15 配置 Sendmail 配置模块\n\n主页上的 `Module Config`（模块配置）链接将带您进入许多其他模块中表单，用于编辑适用于模块本身运行的设置。`Configurable\
  \ options`（可配置选项）下的列表与其用户界面有关，而 `System configuration`（系统配置）下的列表定义了 `Sendmail` 程序和文件的路径。\n\
  \n后一组中的设置通常不需要更改。默认情况下，它们被设置为与您的操作系统提供的 `Sendmail` 软件包相匹配。然而，如果您自己从源码编译并安装了 `MTA`，那么这些设置可能是错误的。\n\
  \n可用的模块配置选项如表 37.1 所示。\n\n##### 表 37.1. 模块配置选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n\
