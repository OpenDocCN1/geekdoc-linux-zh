- "# 使用 Webmin 管理 Linux 系统：系统管理与模块开发 (Bruce Perens 开源系列)\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n\n\n对于 Webmin 能够实现的系统管理功能，我感到非常满意（实际上是印象极其深刻）。它既全面又方便，我做过的几乎任何管理工作都涵盖其中，还有一些我一直犹豫于探索的领域。\n\
  \n-Karel Baloun，Looksmart, Ltd. 高级软件工程师\n\nWebmin 为您提供了一个简单、基于浏览器的解决方案，用于处理几乎任何日常\
  \ Linux/UNIX 管理任务。现在，为每个初级到中级的系统管理员都有了一份权威的 Webmin 指南。该书由 Webmin 的主要开发者编写，《Managing\
  \ Linux Systems with Webmin` 对 Webmin 的最新版本提供了权威的、逐步的涵盖，从从基础安装到集中管理多台服务器。内容包括：\n\
  \n\nJamie Cameron 将带您您完成 50 多项核心 Webmin 任务——提供您所需的全部背景知识、逐步操作说明、大量的屏幕截图以及正在修改的底层配置文件的列表。无论您是\
  \ Linux/UNIX 系统管理的新手，还是仅仅想寻找命令行的替代方案，《Managing Linux Systems with Webmin` 都将是一本不可或缺的资源。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n## 第 1 章 Webmin 简介\n\n本章解释了 Webmin 是什么、编写它的原因，以及你可以从这本书中获得什么。\n\n\
  ### 1.1 什么是 Webmin？\n\nWebmin 是一个简化 Linux 或 UNIX 系统管理过程的程序。通常，您需要手动编辑配置文件并运行命令来创建账户、设置\
  \ Web 服务器或管理邮件转发。Webmin 现在允许您通过易于使用的 Web 界面执行这些任务，并自动为您更新所有所需的配置文件。这使得管理系统的工作变得简单得多。\n\
  \n您可以使用 Webmin 执行的一些操作包括：\n\n- 在系统中创建、编辑和删除 UNIX 登录账户\n- 使用 `NFS` 协议将文件和目录导出到其他系统\n\
  - 设置磁盘配额以控制用户文件占用的空间\n- 安装、查看和删除 `RPM` 及其他格式的软件包\n- 更改系统的 IP 地址、`DNS` 设置和路由配置\n\
  - 设置防火墙以保护您的计算机或允许内部局域网主机访问互联网\n- 为 `Apache` Web 服务器创建并配置虚拟网站\n- 管理 `MySQL` 或 `PostgreSQL`\
  \ 数据库服务器中的表和字段\n- 通过配置 `Samba` 与 Windows 系统共享文件\n\n这些只是可用功能的一部分。Webmin 允许您使用简单的\
  \ Web 界面配置 UNIX 系统上几乎所有的常见和服务和流行的服务器。它能防止您在直接编辑配置文件时经常发生的语法错误和其他错误，并在潜在的危险操作之前向您发出警告。\n\
  \n由于 Webmin 通过网络浏览器访问，因此您可以从任何通过网络连接到您的系统登录它。在本地运行和远程运行完全没有区别，而且在网络上使用比其他图形配置程序方便得多。\n\
  \nWebmin 具有所谓的“模块化”（`modular`）设计。这意味着它的每个功能都包含在一个模块中，通常这些模块可以从程序的其余部分独立地安装或删除。每个模块负责管理某些服务或服务器，例如\
  \ UNIX 用户、`Apache` Web 服务器或软件包。\n\n如果您到为止一直都在手动配置系统，Webmin 将识别任何现有的设置。它始终读取系统上的标准配置文件并直接更新它们，而不是使用自己的独立数据库。这意味着您可以自由地混合\
  \ Webmin、手动配置以及以相同方式的其他程序或脚本。\n\n尽管这本书是为 Linux 用户编写，但 Webmin 也可以用于许多其他 UNIX 变体，例如\
  \ `Solaris`、`FreeBSD` 和 `HP/UX`。它最大的优势之一是理解所有这些操作系统之间的差异，并根据您的操作系统调整调整用户界面和行为的方式。这意味着它通常可以隐藏每个\
  \ UNIX 变体之间的底层差异，无论您使用哪种系统，都能提供相似或相同的界面。\n\nWebmin 本身并不特别有用，因为它仅仅是一个配置工具，因此您必须安装了程序才能对其进行配置。例如，`Apache`\
  \ 模块需要安装实际的 `Apache` Web 服务器。幸运的是，Webmin 管理的所有服务和服务都已包含在大多数 Linux 发行版的标准配置中，或者可以免费下载和安装。\n\
  \n### 1.2 谁应该使用 Webmin？\n\n\n\n\nWebmin 是专为那些具有某些 Linux 经验但不熟悉系统管理复杂细节的人编写的。尽管它让创建\
  \ UNIX 用户或管理 Squid 代理服务器的过程变得简单，但你必须首先对什么是 UNIX 账户以及 Squid 的作用有所了解。普通的 Webmin 用户可能是在自己的家庭\
  \ Linux 系统或公司网络上运行该的人士。\n\n该程序假设你熟悉基本的 TCP/IP 网络概念，例如 IP 地址、`DNS` 服务器和主机名。它还假设用户理解\
  \ UNIX 文件系统的布局、用户和组的定义，以及用户文件所在的位置。如果你使用 Webmin 管理如 `Apache` 或 `Sendmail` 这样的服务器，你应该先了解它们可以做什么，以及你想要完成何种类型的配置。\n\
  \nWebmin 本身以全 UNIX root 权限运行，这意味着它可以编辑系统上的任何文件并在你的系统上运行任何命令。这意味着，如果你在使用程序时犯错，特别是当你正在配置某些你不理解的内容时，极有可能删除系统上的所有文件或导致系统无法启动。尽管\
  \ Webmin 在执行某些潜在危险的操作之前通常会警告你，但仍然有很大的空间造成破坏。\n\n尽管 Webmin 可以在没有连接互联网的系统上使用，但如果你的\
  \ Linux 系统处于网络中，它确实会受益。如果已连接，它可以为你下载新的软件软件包、Perl 模块，甚至是新版本的 Webmin。永久的高速连接是最好的，但即使拨号连接对于大多数用途也足够。\n\
  \n由于 Webmin 以 root 权限运行，你必须能够以 `root` 身份登录系统以安装和启动它。这意味着它不能用于只有普通 UNIX 账户的系统上，例如与他人共享的虚拟\
  \ Web 服务器。不过，你可能可以让你的系统管理员为你安装并配置它。\n\n如果你已经是一个经验 UNIX 系统管理员，Webmin 可能感觉不是适合你的工具，因为使用它通常比直接编辑配置文件和运行命令要慢。然而，即使是专家也能从它的自动语法检查和它能自动执行的操作中受益。\n\
  \n它还可以给不同的人提供不同级别的 Webmin 访问权限，这样经验丰富的管理员就可以它安全地将责任委托给技能较低的下属。例如，你可能希望某人只能管理 `BIND\
  \ DNS` 服务器而不能做其他事情，同时让你拥有对系统和 Webmin 所有功能的完全访问权限。\n\n### 1.3 它是如何以及为什么要开发的？\n\n\
  Webmin 程序由我——本书的作者 Jamie Cameron 设计并创建。我在 1997 年开始开发它，并在那年的 10 月发布了第一个版本（`0.1`）。从那时起，它的用户界面、功能和外观发生了巨大的变化，几乎所有的代码都经过了重写。然而，基于\
  \ Web 管理工具的基本理念从第一次发布以来一直是一致的。\n\n当我开始编写它时，我是一个运行 `DNS` 服务器的系统的管理员，当时花费大量时间更新服务器的配置文件，以添加用户请求的新主机记录。给他们\
  \ `root` 密码并不是一个选择，因为他们没有经验来正确地编辑区域文件并重启服务器。解决方案是一个简单的 Web 界面，它可以显示现有的 `DNS` 记录并允许他们进行编辑、创建和删除。这样就可以安全地授予用户访问该界面以进行他们更改。\n\
  \n不过，`DNS` 管理只是开始。一旦我看到了通过 Web 界面简化 UNIX 系统配置的可能性，我就开始向程序中添加其他功能并将它们放入模块中。接下来是用于\
  \ UNIX 用户、`Samba`、挂载文件系统、`NFS` 和 `Cron` 任务的模块。我想起了 Webmin 这个名字，让任何人都可以下载，并在几个邮件列表上公布了它。初始反馈很好，所以我继续写下去。\n\
  \n多年来，该程序经历了三种不同的用户界面，增长到 83 个模块，增加了对非英语语言的支持，提供了高级访问控制，包含了更多操作系统，并提供了许多其他功能。Linux\
  \ 发行版公司 `Caldera` 和 `MSC.Linux` 为项目提供了资金支持，许多用户贡献了代码补丁、模块、翻译和建议。除了标准模块外，还有 100 多个模块由他人编写，一旦你安装了程序，就可以将它们添加到你系统上的\
  \ Webmin 中。\n\n### 1.4 这本书是关于什么的？\n\n这本书解释了如何安装 Webmin，如何使用它几乎所有的模块，以及如何编写你自己的模块。本书的重点是\
  \ Webmin 软件包附带的标准模块，而不是其他人编写的模块。然而，这 83 个标准模块并不是全部都涵盖，因为某些对普通管理员来说并不是很有用。\n\n虽然这本书主要是为\
  \ Linux 用户编写的，但该程序在其他操作系统上的行为几乎完全相同。每个章节在“其他操作系统”部分也列出了 Linux 与其他 UNIX 变体之间的差异。这意味着如果你在\
  \ `FreeBSD`、`Solaris`、`MacOS X` 或其他类型的 UNIX 上运行 Webmin，它仍然非常有用。\n\n书中的每个章节涵盖了使用\
  \ Webmin 管理特定服务或服务器，例如 `NFS` 导出、`Sendmail` 或 `ProFTPD` FTP 服务器。大多数章节只讨论一个模块，但有些章节涵盖了两个三个具有相似或相关目的的模块。每个章节基本上都是独立的，因此如果你只想知道如何配置一个服务器，就不需要按顺序阅读整本书。然而，第\
  \ 2 章、第 3 章以及可能的第 52 章应该先读，因为它们分别解释了如何安装 Webmin、如何加固它以及如何限制用户对模块可以执行的操作。\n\n每个章节被分为若干节，大部分章节解释了如何执行特定任务。一个章节通常包含对任务的介绍，解释你为什么可能想做它，然后列出在\
  \ Webmin 用户界面中执行该任务的步骤。\n\n第 55 到 60 章涵盖了开发你自己的 Webmin 模块和主题，因此它们的风格有所不同。普通用户不需要阅读它们，但如果你对目前不可用的模块有想法，它们提供了实现该模块所需的所有信息。\n\
  \n### 1.5 谁应该读这本书？\n\n任何想要使用 Webmin 管理其 Linux 或 UNIX 系统的人都应该读这本书。它是为具有基础 UNIX 命令和概念知识的读者编写的，即那些安装了\
  \ Linux 并使用了一段时间的人。\n\n每个章节都从对要配置的服务进行介绍，以便读者对 `DNS` 协议的用途或防火墙的工作原理有一定的了解。尽管如此，一个完全的新手在理解它是如何运行的以及想让它做什么之前，不应该尝试建立服务器。最好的学习方法是在其他系统上作为用户使用该服务。例如，如果你以前在其他网络上用过代理服务器，那么你将拥有所需的背景知识，来通过这本书在你自己的系统上设置\
  \ `Squid` 代理。\n\n\n\n另一方面，开发章节是为那些已经了解如何在 UNIX 系统上编写 Perl 脚本和 CGI 程序的人编写的。这意味着这些章节比书的其他部分更复杂，并假设读者具备某些编程和手动系统管理方面的知识。然而，如果你只想学习如何*使用*\
  \ Webmin 而不是如何扩展它，就可以跳过这些章节。\n\n### 1.6 本书使用的规范\n\n本书使用了以下特殊文本样式：\n\n**粗体用于在 Webmin\
  \ 本身中出现的文本，例如错误信息、图标名称、按钮和字段标签。**\n\n**等宽字体** 此样式用于 shell 命令名、UNIX 用户、目录和文件名称。也用于配置文件、程序代码和\
  \ API 函数中的文本。\n\n*斜体* 用于表示用户输入 Webmin 的示例输入、示例命令或目录。同样在第 60 节“Webmin API”中用于函数的参数名称。\n\
  \n### 1.7 致谢\n\n本书的写成，如果没有 Jill Harry 和 Prentice Hall 其他人的支持、Robert Kern 提出的建议、我妻子\
  \ Foong Ching 的持续支持，以及多年来 Webmin 邮件列表所有成员提供的想法和建议，就无法出版了。\n\n## 第 2 章：安装 Webmin\n\
  \n本章解释了如何为你的操作系统下载相应的 Webmin 软件包，如何安装它，以及首次登录后你会看到什么。\n\n### 2.1 为你的系统下载 Webmin\n\
  \n始终可以从 [www.webmin.com/](http://www.webmin.com/default.htm) 下载最新版本的 Webmin。编写时，最新版本是\
  \ 1.100 版本，但新版本发布频繁。不过，下所有的指令都将使用 1.100 版本作为文件名。如果你下载了后续版本，所有文件名和路径中的版本号将会更改。\n\n\
  某些 Linux 发行版（如 Mandrake 和 Caldera）包含 Webmin 作为标准功能，因此你的系统中可能已经安装了。然而，它们包含的版本可能不是可下载的最新官方版本。如果你对已有的版本满意，可以跳过本章。\n\
  \n其他 Linux 发行版（如 Debian 和 Gentoo）将 Webmin 作为可以自动下载和安装的包。在 Debian 上，命令 `apt-get install\
  \ webmin` 将安装 Debian APT 仓库中提供的最新版本。然而，这有时会比最新的官方发布后几个版本，因此你可能想从 [www.webmin.com/](http://www.webmin.com/default.htm)\
  \ 下载。在 Gentoo Linux 上，命令 `emerge webmin` 将从 Gentoo Portage 仓库安装最新版本，这应该与最新的官方发布版本一致。\n\
  \n如果你是从旧版本的 Webmin 升级，其过程与首次安装完全相同。你对 Webmin 身配置或对 Apache 或 Sendmail 等其他服务器所做的任何更改在升级过程中都不会受到影响。\n\
  \n虽然 Webmin 支持多种 UNIX 变体，但并没有涵盖所有的变体。由于它处理的是在不同 UNIX 操作系统之间位置和格式均不同的系统配置文件，因此它被设计为根据其运行的操作系统类型表现出不同的行为。要查看支持的操作系统完整列表，请访问网页\
  \ [www.webmin.com/support.html](http://www.webmin.com/support.html)。如果你的操作系统不在列表中，你将无法使用\
  \ Webmin。\n\n在为你的系统下载 Webmin 进行安装之前，你必须选择一种包格式进行下载。可用的格式有：\n\n**RPM** 如果你运行 Red\
  \ Hat、SuSE、Mandrake、Caldera、MSC 或任何支持 RPM 软件包格式的 Linux 发行版，那么 RPM 包是你的最佳选择。\n\n\
  **tar.gz** `tar.gz` 格式版本的 Webmin 可以在任何操作系统上运行，但安装起来比 RPM 和 Solaris 包稍微复杂一点。\n\n\
  **Solaris 包** 如果你在 Sparc 或 x86 上运行 Solaris，那么这种包格式就适合你。\n\n关于安装你所选包类型的说明，请参阅下文 2.2\
  \ 节“安装 RPM 包”。\n\n### 2.2 安装 RPM 包\n\n在每个 Webmin 网站页面的右上角都有一个 RPM 包的链接。在 [www.webmin.com/download.html](http://www.webmin.com/download.html)\
  \ 页面也可以找到链接。一旦下载完成，你的 Linux 系统上应该有一个名为类似于 `webmin-1.1.100-1.noarch.rpm` 的文件。要进行安装，请以\
  \ root 身份运行以下命令：\n\n```\nrpm U webmin-1.1.100-1.noarch.rpm\n```\n\n只有在你没有安装 Perl\
  \ 或者 Webmin 无法识别你的操作系统时，RPM 安装才会会失败。如果发生这种情况且你的 Linux 发行版在支持的操作系统列表中，你应该安装 `tar.gz`\
  \ 版本。因为所有 Linux 发行版都略有不同，Webmin 安装过程必须准确识别你正在运行的发行版和版本，例如 *Red Hat 7.3*。如果包含发行版名称的文件（如\
  \ `/etc/issue`）之一被修改过，这可能会失败。\n\n假设 RPM 安装成功完成，你将立即登录 Webmin。打开网络浏览器，如果你在安装 Webmin\
  \ 的同一 Linux 系统上运行浏览器，请访问 URL `http://localhost:10000/`；如果浏览器在另一台 PC 上运行，请访问 `http://your-systems-hostname:10000/`。无论哪种方式，都会出现一个提示输入用户名和密码的\
  \ Web 表单，如图所示。\n\n##### 图 2.1. Webmin 登录页面。\n\n![](img/02fig01.jpg)\n\n你应该能够使用与\
  \ Linux 系统 root UNIX 用户相同的密码登录 root root。如果你使用命令行 `passwd` 命令或“用户和组”模块更改了密码，你的 Webmin\
  \ 密码也会随之更改。\n\n如果系统中已经安装了 OpenSSL 库和 Net::SSLeay Perl 模块，Webmin 将自动以 SSL 模式启动。这意味着你应该使用以\
  \ `https://` 开头的 URL 而不是 `http://` 来连接。尝试使用非 SSL URL 连接只会带出一个带有 `https://` URL 链接的页面，你应该点击该链接进行登录。\n\
  \n### 2.3 安装 tar.gz 包\n\n在每个 Webmin 网站页面的右上角都有 `tar.gz` 包的链接。在 [www.webmin.com/download.html](http://www.webmin.com/download.html)\
  \ 页面也可以找到链接。一旦下载完成，你的系统中应该有一个名为类似于 `webmin-1.1.100.tar.gz` 的文件。要安装该包，请按照以下步骤操作：\n\
  \n1. 以 root 身份登录系统。\n2. 选择一个安装 Webmin 的目录。这通常是 `/usr/local`，也可以是 `/opt` 或你喜欢的任何位置。为了简单起见，下面的指令将使用\
  \ `/usr/local`。\n3. 将 `webmin-1.1.100.tar.gz` 文件复制到 `/usr/local` 目录。\n4. 运行以下命令解压并提取\
  \ `tar.gz` 文件，然后运行以下设置脚本：\n\n```\ncd /usr/local\ngunzip webmin-1.1.100.tar.gz\n\
  tar xf webmin-1.1.100\ncd webmin-1.1.100\n./setup.sh\n```\n\n运行 `setup.sh` 脚本后，你会被询问一系列控制安装过程的问题。问题及其含义如下：\n\
  \nConfig file directory [/etc/webmin] 这是 Webmin 存储其所有配置文件的目录。最好直接按回车键接受默认的 /etc/webmin。如果该目录从你升级的旧版本\
  \ Webmin 中已经存在，那么这将是唯一被问到的问题。\n\n\n\n\n\n日志文件目录 [/var/webmin`] 这是存储 Webmin 日志和进程\
  \ ID 文件的目录。此项也直接按回车键即可接受 `/var/webmin` 默认值。\n\nPerl 的完整路径 这是系统上 Perl 可执行文件的位置。如果它位于\
  \ `/usr/bin/perl` 或 `/usr/local/bin/perl`，你只需按回车键接受默认值。否则，你必须输入 Perl 解释器的完整路径。\n\
  \n操作系统 只有在 Webmin 无法自动识别你的操作系统时才会询问此问题。你必须输入列表中显示的操作系统名称旁边的数字。\n\n版本 与上面的问题类似，只有在\
  \ Webmin 无法识别你的操作系统时才会询问此问题。同样，你必须输入显示的版本号旁边的数字。\n\nWeb 服务器端口（默认 10000） 这是 Webmin\
  \ 监听的 HTTP 端口。除非你在 `10000` 端口上运行了其他网络服务器，否则最好保持默认设置。\n\n登录名称（默认 admin） 这正在询问你将用于登录\
  \ Webmin 的用户名。`admin` 是传统的用户名，但可以使用任何名称。\n\n登录密码 这是必须与用户名一起输入的密码。你必须输入两次，以验证你没有不小心出错。\n\
  \n使用 SSL (y/n) 只有在你已按照第 3 章说明安装了 OpenSSL 和 Net::SSLeay 库时才会询问此问题。如果你输入 `y`，Webmin\
  \ 将从开始使用 SSL。但如果你现在输入 `n`，以后仍然可以开启它。\n\n开机启动 Webmin (y/n) 此问题控制 Webmin 是否会在系统启动时自动启动，这意味着你不需要在每次重启后都手动重新启动它。如果你想让它在开机时启动，只需输入\
  \ `y`。否则输入 `n`。\n\n回答所有问题后，安装过程将结束，并将出现显示可用于登录的 URL 的消息。如果你不再需要，现在可以删除旧的 `webmin-1.1.100.tar`\
  \ 文件。但是，请删除解压 tar 文件时创建的 `/usr/local/webmin-1.1.100` 目录。它包含了 Webmin 所需的所有脚本。\n\n\
  软件包安装完成后，你可以打开网络浏览器。如果你在安装 Webmin 的同一 Linux 系统上运行浏览器，请访问 URL `http://localhost:10000/`；如果浏览器在另一台\
  \ PC 上运行，请访问 `http://your-systems-hostname:10000/`。无论何种情况，都会出现如图 2.1 所示提示用户名和密码的网络表单。使用你之前回答“登录名称”和“登录密码”问题时选择的用户名和密码登录。\n\
  \n如果你对 SSL 问题回答了是，你应该使用以 `https://` 开头的 URL 而不是 `http://`。如果 Webmin 在 SSL 模式下检测到非\
  \ SSL 连接，它将显示一个带有正确 URL 链接的页面。\n\n### 2.4 安装 Solaris 软件包\n\nSolaris 版本的 Webmin 可以在\
  \ [www.webmin.com/download.html](http://www.webmin.com/download.html) 下载。下载完成后，你的\
  \ Solaris 系统上应该有一个类似于 `webmin-1.1.100-1.pkg.gz` 的文件。要安装，请以 root 身份运行以下命令：\n\n```\n\
  gunzip webmin-1.1.100.pkg.gz\npkgadd  d webmin-1.1.100.pkg.gz WSwebmin\n```\n\n\
  Solaris 软件包仅在你已经安装了 Webmin，或者在 `/usr/local/bin/perl` 下没有 Perl 可执行文件时才可能失败。如果你在系统的其他地方安装了\
  \ Perl，你应该创建一个从 `/usr/local/bin/perl` 到真实位置的符号链接。\n\n假设 Solaris 软件包安装成功，你将能够立即登录\
  \ Webmin。打开网络浏览器，如果你在安装 Webmin 的同一 Linux 系统上运行浏览器，请访问 URL `http://localhost:10000/`；如果浏览器在另一台\
  \ PC 上运行，请访问 `http://your-systems-hostname:10000/`。无论何种情况，都会出现如图 2.1 所示提示用户名和密码的网络表单。\n\
  \n你应该能够以 root 身份登录，并使用与 Solaris 系统上 root UNIX 用户相同的密码。然而，如果你日后更改了 UNIX root 密码，Webmin\
  \ 的 root 用户将不会改变。这是因为软件包安装只是复制了 `/etc/shadow` 文件中的当前密码。\n\n### 2.5 Webmin 用户界面\n\
  \n假设安装过程和登录成功，你的浏览器应该显示选中了 Webmin 类的 Webmin 主菜单，如图 2.2 所示。你可以通过点击页面顶部的图标（如系统、服务器或其他）来切换到其他类别。每个模块都属于一个类别，页面主体部分将出现所选类别中每个模块的图标列表。要进入某个模块，只需点击其图标。\n\
  \n### 图 2.2. Webmin 类别中的模块。\n\n![](img/02fig02.jpg)\n\n要退出 Webmin，只需点击每个页面右上角出现的“Logout”（注销）链接。要向作者（也就是我）发送反馈，请点击注销按钮旁边的“Feedback”（反馈）链接。若要访问\
  \ [www.webmin.com/](http://www.webmin.com/default.htm)，点击任何页面左上角的 Webmin 标志。\n\n\
  如果你使用的是不同的主题，用户界面在屏幕上的显示会有不同，如图 2.2 所示。某些随 Linux 发行版提供的 Webmin 版本默认使用不同的主题，例如 Mandrake\
  \ 和 Caldera。然而，主菜单仍会显示类别和模块，只是使用不同大小的图标和不同的布局。书中的所有截图都是使用默认主题捕捉的，因此你可能现在想切换到它（如何更改当前主题见第\
  \ 5 章）。\n\n所有 Webmin 模块都有通用的布局和用户界面，以便导航。当你从主菜单点击模块图标时，将显示该模块的主页。例如，图 2.3 显示了磁盘配额（Disk\
  \ Quotas）模块的主页。\n\n### 图 2.3. 磁盘配额模块首页。\n\n![](img/02fig03.jpg)\n\n顶部是出现在每个 Webmin\
  \ 上的类别图标，方便你快速切换到另一个模块。下方是帮助、模块配置和搜索文档链接。并非每个模块都会显示这些链接，但当它们出现时具有共同用途：\n\n**帮助**\
  \ 此链接将弹出一个窗口，包含模块概述以及主页上的可用选项。\n\n**模块配置** 此链接将显示包含当前模块可配置选项的表单。参考图 2.4 的磁盘配额模块可用选项示例。每个模块都有自己的选项，但都使用相似的界面进行编辑。在大多数情况下，正常使用模块时不需要更改这些配置选项中的。\n\
  \n### 图 2.4. 磁盘配额模块的配置页面。\n\n![](img/02fig04.jpg)\n\n**搜索文档** 此链接将显示与该模块正在配置的服务器或程序相关的\
  \ UNIX 手册页、软件包文档、HOWTO 文件和网站。这对于查找有关 Webmin 使用的底层配置文件和命令的额外信息。\n\n\n\n\n\n每个模块第一页之后的其他页面也具有共同的布局。图\
  \ 2.5 显示磁盘配额（Disk Quotas）模块的示例页面。类别图标列表下方有一个标记为 Module Index（模块索引）的链接，它将始终带您返回模块的主页。几乎每个模块每个页面都能找到它。旁边是另一个\
  \ Help（帮助）链接，它会弹出一个显示当前页面信息的窗口。并非所有页面都有在线帮助，因此此链接不会一直出现。最后，在页面底部有一个以 Return to（返回到）开头的链接，它会将您带回模块层级中的上一层。\n\
  \n##### 图 2.5. 磁盘配额模块的示例页面。\n\n![](img/02fig05.jpg)\n\n### 2.6 卸载 Webmin\n\n如果由于某种无法想象的原因，您想从系统中移除\
  \ Webmin，只需以 `root` 身份登录并运行命令：\n\n```\n/etc/webmin/uninstall.sh\n```\n\n此命令将询问您是否确定要卸载，如果确定，它将删除\
  \ Webmin 脚本和配置目录。这意味着您对 Webmin 本身做的任何配置（例如更改 IP 访问控制、切换主题或创建新的 Webmin 用户）将会丢失。然而，对其他服务器（如\
  \ `Apache` 或 `Sendmail`）的配置不会产生，即使这些配置是使用 Webmin 完成的。\n\n### 2.7 总结\n\n读完本章后，您应该理解如何在服务器上首次安装\
  \ Webmin，或者将现有安装升级到最新版本。您还应该了解三种软件包格式之间的区别，以及哪种适用于您的操作系统。由于整本书都是关于 Webmin 的，在阅读之前绝对应该先安装它！\n\
  \n## 第 3 章 加固您的 Webmin 服务器\n\n本章涵盖了在系统安装 Webmin 后，为其添加额外安全防护的必要步骤。它解释了 IP 地址限制以及\
  \ `SSL` 的使用。\n\n### 3.1 网络安全\n\n除非您在从不连接到任何网络的系统上运行 Webmin，否则限制允许哪些客户端网络地址登录是一个明智之举。因为\
  \ Webmin 如此强大，任何成功登录的人都对您的系统拥有完全控制权，就像他们拥有 root shell 权限一样。尽管登录时始终需要用户名和密码，但增加额外的安全层总是好的，以防攻击者猜到（或以某种方式发现）您的密码。IP\
  \ 访问控制还可以保护您免受 Webmin 未来可能出现的任何漏洞，这些漏洞可能会允许攻击者无需密码登录——某些旧版本就有此类问题。\n\n要限制 Webmin\
  \ 接受连接的 IP 地址和网络，请按照以下步骤操作：\n\n1. 在 Webmin 类别中，点击 `Webmin Configuration（Webmin 配置）模块的图标。\n\
  2. 点击 `IP Access Control（IP 访问控制）图标。将显示图 3.1 所示所示表单用于限制客户端 IP 地址。\n\n##### 图 3.1.\
  \ IP 访问控制表。\n\n![](img/03fig01.jpg)\n\n选择 `Only allow from listed addresses（仅允许来自列出的地址），并在文本框中输入您允许访问的客户端系统的\
  \ IP 地址或主机名。如果您允许来自整个 IP 网络的访问，请输入网络地址并将最后一个字节设置为 `0`。例如，如果您想允许 IP 地址从 `192.168.1.0`\
  \ 到 `192.168.0.255` 的所有客户端，则应输入 `192.168.1.0`。\n\n网络也可以以标准的网络/子掩码格式输入，如 `192.168.1.0/255.255.255.0`。您还可以通过输入通配符主机名（如\
  \ `.foo.com`）授予整个域名访问，前提是该域名已设置反向 IP 地址解析。\n\n完成后，点击 `Save（保存）` 按钮应用更改。如果限制将阻止当前运行浏览器的客户端系统登录，Webmin\
  \ 将向您警告，以免您意外把自己锁在外面！\n\n### 3.2 SSL 加密\n\n如果您通过不受信赖的网络（如互联网）访问您的 Webmin 服务器，您应该意识到，默认情况下，攻击者可以通过监听网络流量来捕获您的登录名和密码。如果您使用由不完全信任的人员共享非交换以太网网络（例如办公室或大学中的网络），这将尤为容易。\n\
  \n幸运的是，有一个相对容易设置的解决方案：切换 Webmin 使用 `SSL`，这样您的浏览器和服务器之间的所有网络流量都将被加密。如果安装了 `OpenSSL`\
  \ 库和 `Net::SSLeay` Perl 模块，Webmin 的 RPM 软件包默认将以 SSL 模式运行。然而，大多数系统并不满足这些要求，因此您需要按照以下步骤启用\
  \ `SSL`：\n\n1. 如果尚未安装 `OpenSSL` 库，请安装它。大多数最新的 Linux 发行版都会将其作为标准包含，但您可能需要从发行版的 CD\
  \ 中安装。如果存在 `openssl` 和 `openssl-devel` 的独立包，请确保两者都已安装。如果您的操作系统没有带 `OpenSSL`，您可以从\
  \ [`www.openssl.org/](http://www.openssl.org/default.htm) 下载。\n2. 如果尚未安装 `Net::SSLeay`\
  \ Perl 模块。如果您的系统已连接互联网，最简单的方法是进入 Webmin 的 `Perl Modules` 模块（在 `Others` 类别下），在 `From\
  \ CPAN` 字段输入 `Net::SSLeay` 并点击 `Install` 按钮。\n3. Perl 模块下载完成后，点击 `Continue with\
  \ install（继续安装）` 让 Webmin 自动编译并安装它。\n\n一旦两者都安装完成，进入 `Webmin Configuration` 模块并点击\
  \ `SSL Encryption（SSL 加密）`。将显示图 3.2 所示的表单。\n\n##### 图 3.2. SSL 激活表。\n\n![](img/03fig02.jpg)\n\
  \n在页面顶部，将 `Enable SSL if available?（可用时启用 SSL？）`选项改为 `Yes` 并点击 `Save`。如果一切顺利，Webmin\
  \ 将切换到 SSL 模式，您的浏览器将安全地连接到它。\n\n如果您是第一次以 SSL 模式连接 Webmin，浏览器将显示证书无效的警告。目前，您可以忽略此警告并选择接受证书。更多详情，请参见第\
  \ 3.3 节“请求有效的 SSL 证书”。\n\n从现在起，登录 Webmin 时必须使用以 `https://` 开头的 URL，而不是简单的 `http://`。一旦进入\
  \ SSL 模式，它将不再接受不安全的连接。\n\n返回 `SSL Encryption` 页面并到第二个表单。如果显示以 `Because you are currently\
  \ using the default Webmin SSL key…（由于您目前正在使用默认 Webmin SSL 密钥……）` 开头的警告，您应该继续遵循这些步骤来创建自己的\
  \ SSL 证书和密钥。然而，如果没有出现该警告，则在安装时已创建了私钥，无需继续阅读。\n\n如果您的系统始终使用 URL 中的相同主机名访问，请将其输入 `Server\
  \ name in URL（URL 中的服务器名称）` 字段，例如 `www.example.com`。这将使生成的证书与该主机名关联。否则选择 `Any hostname（任何主机名）`\
  \ 以允许证书适用于任何 URL 主机。这更方便，但安全性略低。\n\n在 `Email address（电子邮件）` 字段中，输入您的电子邮件地址，例如 `joe@example.com`。\n\
  \n如果适用，在 `Department（部门）` 字段中填写系统所属组织的部门或小组名称，例如 `Network Engineering`。如果不适用（例如在家庭系统上），可以留空。\n\
  \n在 `Organization（组织）` 字段中，输入拥有系统的公司或组织名称，例如 `Foo Corporation`。再次，如果没有意义，可以留空。\n\
  \n在 `State（州）` 字段中，输入您的系统所在的州名称，例如 `California`。\n\n\n\n\n在“国家代码”（Country code）字段中，输入系统所在国家的两个字母代码，例如\
  \ `US`。\n\n保持“写入文件”（Write key to file）字段不变，并将“立即使用新密钥”（Use new key immediately）字段设置为“是”（Yes）。\n\
  \n点击“立即创建”（Create Now）按钮生成新的密钥和证书，将其写入 `/etc/webmin/miniserv.pem` 并立即激活它们。您的浏览器可能会再次提示您接受新证书。\n\
  \n旧版本的 Webmin 仅使用包含在包中的固定 SSL 密钥。然而，这对于安全保护网络流量是完全没用的，因为任何拥有该密钥副本的人都可以解密据称受 SSL\
  \ 保护的数据！出于这个原因，最近的 Webmin 版本在安装时尽可能创建一个新的私密钥，如果使用的是旧的固定 SSL 密钥，则会向您发出警告。\n\n###\
  \ 3.3 申请有效的 SSL 证书\n\n如果您想使用有效的 SSL 证书但尚未为您的主机准备证书，可以使用 `openssl` 命令和证书颁发机构（CA）生成一个。有效证书是所有浏览器都能识别的证书，因为它是由受认可的机构签名的。按照第\
  \ 3.2 节“SSL 加密”中的步骤由 Webmin 自己创建的证书不符合此标准，当它们连接到 Webmin 服务器时，所有浏览器都会触发警告。\n\n遗憾的是，证书颁发机构会对签名和验证主机所有者是否与证书中的公司详情匹配收费。出于这个原因，大多数人不会在\
  \ Webmin 中尝试使用签名证书，因为一旦您第一次在浏览器中接受了未签名的证书，安全性上就没有真正的优势。\n\n然而，如果您确实想获得真实的有效证书，请遵循以下步骤：\n\
  \n在 shell 提示符处运行 `openssl genrsa -out key.pem 1024` 命令。这将创建 `key.pem` 文件，它是您的私密钥。\n\
  \n运行 `openssl req -new -key key.pem -out req.pem` 命令。当询问“通用名称”（common name）时，务必输入在\
  \ URL 中使用的服务器完整主机，例如 `www.yourserver.com`。这将创建 `req.pem` 文件，即证书签名请求 (CSR)。\n\n通过证书颁发机构使用的任何方法将\
  \ CSR 发送给他们。他们应该会返回一个以 `BEGIN CERTIFICATE` 开头的文件，该文件可以放入 `cert.pem` 文件中。\n\n在 Webmin\
  \ 中，进入“Webmin 配置”（Webmin Configuration）模块并点击“SSL 加密”（SSL Encryption）。\n\n在 SSL 加密表单（如图\
  \ 3.2 所示）中，将 `key.pem`文件的路径输入“私密钥文件”（Private key file）字段，并将 `cert.pem` 文件输入“证书文件”（Certificate\
  \ file）字段。\n\n点击“保存”（Save）按钮切换到新证书。\n\n从现在起，您的浏览器在 SSL 模式下连接到 Webmin 时应不再显示警告。\n\
  \n### 3.4 总结\n\n保护 Webmin 服务器以防止未经授权的访问至关重要，因为互联网上有许多潜在的攻击者他们想利用它来接管您的系统。本章介绍了尽可能执行的两种类型的安全配置（IP\
  \ 访问控制和 SSL）。由于某些版本的 Webmin 存在可远程利用的安全漏洞，建议一旦发布最新版本就立即升级，以确保您的系统安全。\n\n## 第 4 章\
  \ 用户和组\n\n本章介绍“用户和组”（Users and Groups）模块，该模块允许您创建和管理 UNIX 用户账户和 UNIX 组。\n\n### 4.1\
  \ UNIX 用户和组简介\n\n在 Linux 和其他 UNIX 操作系统上，用户是通过 `SSH`、`telnet`、`FTP` 或控制台登录系统的人。用户还可以接收电子邮件并在服务器的本地文件系统中拥有文件。每个用户都有一个登录名、一个密码和一个存储其所有文件的主目录。用户还有几个额外属性，如真实姓名、shell（用户登录时运行的程序）和过期日期。\n\
  \n每个用户都是至少一个组的成员，这被称为“主组”（primary group）。此外，用户可以是无限多个“次要组”（secondary groups）的成员。组组成关系可用于控制用户读取和编辑文件。例如，如果两个用户正在合作同一个项目，您可能会将他们放在同一个组，这样他们都可以编辑其他用户无法访问的特定文件。\n\
  \n每个系统在安装时都会创建几个如 `root` 和 `nobody` 这样的标准用户账户，尽管大多数此类账户（`root` 除外）不能用于登录。如果您的服务器将由多个人使用，您需要为每个人创建一个额外的用户账户，以保持他们的文件和电子邮件分开。即使您是使用这台机器的唯一，最好也自己创建一个用户账户用于登录，而不是使用\
  \ `root` 账户。\n\n取决于您的操作系统，用户和组信息将存储在 `/etc` 目录下的文件中。在现代版本的 Linux 中，`/etc/passwd`\
  \ 和 `/etc/shadow` 用于存储用户详情，`/etc/group` 用于组详情。“用户和组”模块通过直接编辑这些文件工作，而不是调用任何外部程序或函数。这意味着如果您正在使用\
  \ `NIS` 或将用户存储在 `LDAP` 服务器中，则此模块不适用于您。\n\n### 4.2 用户和组模块\n\n位于“系统”（System）类别下的 Webmin\
  \ “用户和组”模块（如图 4.1 所示）可用于创建、编辑和删除系统上所有的 UNIX 用户和组。在使用此模块编辑如 `root` 和 `daemon` 等现有系统用户时，您应该始终小心，因为更改或删除它们可能会导致您的系统无法运行。某些用户的主目录被设置为\
  \ `/`（根目录）。删除此类用户将导致系统上的所有文件被删除。\n\n##### 图 4.1 用户和组图标。\n\n除了管理系统上的 UNIX 用户外，该模块还可能影响其他模块中的用户设置。例如，`Samba`\
  \ 有自己的用户和密码列表，应该与 UNIX 列表同步。Webmin 可以使用创建、编辑和删除用户表单上的“其他模块”选项为您处理这些。但是，您必须在想要更新的每个其他模块中启用此功能。该模块还有类似方式同步\
  \ UNIX 组的选项，例如 `Samba` 组。然而，由于此功能仅适用于仍在开发中的 `Samba3.0`，因此本章未涵盖。\n\n一旦进入模块，主页将在一个表中列出系统中当前存在的所有用户（图\
  \ 4.2），并在另一个表中列出所有组（图 4.3）。如果用户或组太多，无法在表格中合理显示，则会显示一个允许您搜索用户或组的小表单。\n\n##### 图 4.2\
  \ 现有用户列表。\n\n##### 图 4.3 现有组列表。\n\n### 4.3 创建新用户\n\n要创建新的 UNIX 用户，请完成以下步骤：\n\n点击现有用户表上方或下方的“创建新用户”（Create\
  \ a new user）链接。将一个输入新用户详情的表单，如图 4.4 所示。\n\n##### 图 4.4 用户创建表单。\n\n此时，您必须为新用户决定一个用户名，该名称应该是简单的且不含空格，例如\
  \ `jcameron` 或 `jamie`，且未被任何其他用户使用。如果您的服务器正在接收电子邮件，用户名决定了用户电子邮件地址中 `@` 左侧的部分。在“用户名”（Username）字段中输入您的选择。\n\
  \n\n\n`User ID` 字段通常应该保持不变，因为它是由 Webmin 为你计算好的。如果你将其设置为与另一个用户相同的用户 ID，他们将能够访问彼此的文件。这通常不是一个好主意。\n\
  \n在 `Real name`（姓名）字段中，你应该输入用户的全名，例如 `Jamie Cameron`。\n\n每个用户都有一个家目录，用户在其中存储个人文档和偏好文件。在\
  \ `Home directory`（家目录）字段中，你应该输入一个尚不存在目录，例如 `/home/jcameron`。当用户创建时，该目录将被创建并将所有权授予新用户。\n\
  \n如果你系统上的 Webmin 为家目录提供了 `Automatic`（自动）选项，最好坚持使用该选项。\n\n用户的 shell（外壳）是一个当用户进行某种文本模式登录（例如通过\
  \ `SSH`）或在控制台图形登录后打开 shell 提示符运行时的程序。shell 负责运行你输入的命令（如 `ls` 和 `cat`）、在登录和注销时运行脚本，并为命令编辑提供界面。像\
  \ `bash` 和 `tcsh` 这样的 shell 对用户来说更容易使用，因为它们允许使用上下箭头滚动之前的命令，并允许 tab 键自动补全命令和文件名。\n\
  \n在某些情况下，你可能不想让用户能够进行 shell 登录，例如用户仅被允许读取和发送电子邮件。在这种情况下，他的 shell 应该设置为 `/bin/false`，这是一个不做任何操作并立即退出的程序。\n\
  \n你可以从 `Shell` 字段的列表中选择你想要用户拥有的 shell。如果你的选择不在列表中，请选择 `Other`（其他）选项并在下方字段中输入 shell\
  \ 的路径。\n\n对于 `Password`（密码）字段，你有四个选择：\n\n-   **No password required**（不需要密码）：用户无需输入任何密码即可登录。\n\
  -   **No login allowed**（不允许登录）：用户永远无法登录。\n-   **Normal password**（普通密码）：你可以输入用户的密码。\n\
  -   **Pre-encrypted password**（预加密密码）：你必须输入一个已经加密的密码，例如从另一个系统的 `/etc/shadow` 文件获取的密码。\n\
  \n通常你可能想要使用 `Normal password` 选项。请注意，在许多操作系统上，密码的前八个字符实际上会被使用。\n\n在大多数系统中，`Password\
  \ options`（密码选项）标题下将可用一组输入。其中第一个是 `Expiry date`（过期日期），如果你希望用户在特定日期后无法登录，请填写此字段。\n\
  \n`Minimum days`（最小天数）字段是在用户创建或上次更改密码后，用户在再次更改密码之前必须等待的天数。留空则允许用户在任何想要时更改。\n\n`Maximum\
  \ days`（最大天数）字段是在用户创建或上次更改密码后，密码将过期并需要更改的天数。设置了此选项的用户将被强制定期更改密码，这对系统安全有益。留空以防止密码永不过期。\n\
  \n`Warning days`（警告天数）字段是在密码过期日期之前的天数，用户在登录时将收到密码即将过期的警告。如果留空，用户在尝试登录并强制选择新密码之前，将不知道其账户已过期。\n\
  \n`Inactive days`（非活动天数）字段是在密码过期后若干天内，如果用户没有选择新密码，整个账户将被禁用。如果留空，账户将永远不会过期。\n\n对于\
  \ `Primary group`（主组），可以选择一个已存在的组，或输入一个 Webmin 将为你创建的新组名称。\n\n如果你想让用户成为多个组的成员，请从\
  \ `Secondary group`（附加组）列表中选择一些组。\n\n如果你想创建用户的家目录，请选择 `Create home directory?`（创建家目录？）选项。如果该目录尚不存在，你应该选择此项以及\
  \ `Copy files to home directory?`（将文件复制到家目录？），以便用户获得一组基本的偏好文件，如 `.profile` 和 `Desktop`。\n\
  \n要在你配置了此类操作的其他模块中创建用户，请选择 `Create user in other modules?`（在其他模块中创建用户？）。可以设置 `Samba`\
  \ 模块在其列表中自动创建用户，设置 `MySQL` 模块创建新的数据库用户等。\n\n点击 `Create`（创建）按钮创建用户。稍后，你将返回现有用户列表，其中应包含你新创建的用户。\n\
  \n一旦点击 `Create` 按钮，新用户将能够通过 `SSH`、`telnet` 或你设置的任何服务登录。\n\n### 4.4 编辑现有用户\n\n你可以通过以下步骤更改系统上已存在的任何用户的详细信息：\n\
  \n从现有列表中点击你想要编辑的用户。将出现包含该用户所有详细信息的表单，如图 4.5 所示。\n\n##### 图 4.5. 用户编辑表单。\n\n```\n\
  ![](OEBPS/Images/04fig05.jpg\n```\n\n更改你想要修改的任何详细信息，包括用户名。字段的含义与第 4.3 节“创建新用户”中的描述相同。\n\
  \n如果你修改了 `User ID` 或更改了 `Primary group`，由用户拥有的文件可能需要更新以使用新 ID。页面底部标记为 `Change user\
  \ ID on files?`（在文件上更改用户 ID？）和 `Change group ID on files?`（在文件上更改组 ID？）的选项控制哪些目录将被将被搜索具有旧\
  \ ID 的文件。\n\n如果你更改了用户的家目录，可以让 Webmin 将其重命名为新路径。然而，如果新家目录已经存在，这并不总是是你所想要的。`Move home\
  \ directory if changed?`（如果更改则移动家目录？）选项决定了是否移动。\n\n要在设置了此项的其他模块中更新用户，请选择 `Modify\
  \ user in other modules?`（在其他模块中修改用户？）。如果你正在更改用户名，这将重命名用户的 `Sendmail` 邮件文件和 `Cron\
  \ jobs`。\n\n点击 `Save`（保存）按钮让 Webmin 更新用户。完成后，你将返回用户和组的列表。\n\n### 4.5 删除用户\n\n在删除用户时应始终小心，因为用户家目录中的重要文件可能会丢失。通常，删除系统首次安装时创建的任何用户都不是一个好主意，特别是\
  \ `root`！即使是你创建的普通用户，也可以通过编辑用户并将密码选项设置为 `No login allowed`（不允许登录）来禁用。\n\n如果你仍然想继续删除用户，请遵循以下步骤：\n\
  \n从现有列表中点击你想要编辑的用户。将出现包含该用户详细信息的表单，如图 4.5 所示。\n\n点击页面底部的 `Delete`（删除）按钮。这将弹出一个请求确认删除的表单，并带有删除用户或及其家目录的按钮。将显示用户家目录占用的磁盘空间。\n\
  \n如果你希望在设置了删除的其他模块中删除用户，请选择 `Delete user in other modules?`（在其他模块中删除用户？）。属于用户的 `Cron\
  \ jobs` 将被删除，其 `Sendmail` 邮件文件也将被删除。\n\n点击 `Delete User`（删除用户）或 `Delete User and\
  \ Home Directory`（删除用户和家目录）按钮删除用户。在执行期间将显示删除进的页面。\n\n### 4.6 创建新组\n\n可以通过以下步骤添加新的\
  \ UNIX 组：\n\n点击现有组列表顶部或底部的 `Create a new group`（创建新组）链接。将输入组详细信息的表单，如图 4.6 所示。\n\
  \n##### 图 4.6. 组创建表单。\n\n```\n![](OEBPS/Images/04fig06.jpg\n```\n\n为新组选择一个名称并将其输入\
  \ `Group name`（组名）字段。该名称不能被任何其他组使用，并且应该短且不包含空格。\n\n\n\n\nGroup ID 字段应保持原样，因为它由 Webmin\
  \ 自动确定。如果由于某种原因您更改了它，请确保它与任何现有组的 ID 不同。\n\n`Password` 字段可以忽略，因为组密码从不被使用。\n\n在 `Members`\
  \ 字段中，输入您想要包含在此组中的任何现有用户名称。您可以使用字段左侧的按钮弹出一个显示所有现有用户的选择窗口。\n\n点击 `Create` 按钮让 Webmin\
  \ 创建新组。完成后，您将返回到用户和组列表。\n\n一旦创建了新组，您就可以编辑用户，将其设置为他们的主组或其次要组之一。\n\n### 4.7 编辑现有的组\n\
  \n您通常不需要编辑现有的组，因为可以通过直接编辑用户来向组中添加或删除用户。但是，如果您想编辑某个组，请按照以下步骤操作：\n\n从现有组列表中点击您想要编辑的组名称。这将显示如图\
  \ 4.7 所示的组编辑表单。\n\n##### 图 4.7 组编辑表单。\n\n![](img/04fig07.jpg)\n\n更改任何详细信息，如组 ID\
  \ 或成员列表。无法更改现有组的名称。\n\n如果您正在更改组 ID，属于该组的文件可能需要更新以使用新 ID。使用 `Change group ID on files?`\
  \ 选项来控制哪些目录将用于搜索需要更新的文件。\n\n点击 `Save` 按钮使更改生效。完成后，您将返回到用户和组列表。\n\n### 4.8 删除组\n\n\
  您可以随时安全地删除组，但只有在没有用户选择该组作为其主组时，Webmin 才会允许您这样做。要删除，请按照以下步骤操作：\n\n从现有组列表中点击您想要删除的组名称。这将显示如图\
  \ 4.7 所示的组编辑表单。\n\n点击页面底部的 `Delete` 按钮。将出现询问您是否确定要删除该组的页面。\n\n点击 `Delete Group`\
  \ 按钮确认删除。将显示删除进的页面。\n\n### 4.9 查看最近和当前登录\n\n所有 UNIX 系统都会跟踪用户通过 `SSH`、`telnet` 或在控制台进行的最近登录。某些系统还会跟踪\
  \ `FTP` 登录。您可以按照以下步骤显示包含日期、时间和源地址的最近用户登录情况：\n\n在用户和组列表下方，在 `Display logins by` 字段中输入您想要跟踪的用户，并点击按钮。如果您想查看所有用户的登录情况，只需留空该字段。\n\
  \n将显示一个列出用户或或用户最近登录的页面。列表可能无法涵盖自系统首次安装以来的所有登录，因为许多操作系统会自动定期截断日志文件以节省磁盘空间。\n\n还可以通过点击用户和组列表下方的\
  \ `Logged In Users` 按钮显示当前登录的用户列表。如果用户在控制台以图形界面登录，他可能会被列出多次，对应他打开的每个 shell 窗口一次。\n\
  \n### 4.10 读取用户邮件\n\n在编辑用户时，可以通过点击页面底部的 `Read Email` 按钮查看用户邮箱中的邮件。这将直接带您进入 `Sendmail`、`Qmail`\
  \ 或 `Postfix` 模块的邮箱查看页面，取决于您在模块配置的 `Display user email` 选项中选择了哪一个。有关使用邮件界面的更多文档，请参阅第\
  \ 37 章。\n\n### 4.11 从批量文件创建用户\n\n有时您可能想一次性创建大量用户，而无需反复填写用户创建表单。您通常会在某种包含用户名、密码和真实名的文本文件中拥有这些用户的详情。幸运的是，Webmin\
  \ 有一个功能可以自动为您完成此任务。\n\n如果您点击现有用户列表上方或方的 `Create, modify and delete users from batch\
  \ file` 链接，将出现一个表单，允许您上传包含要创建用户详情的文件，如图 4.8 所示。您的文件必须每个要创建的用户包含一行文本，且每行的格式必须与批量文件页面显示的格式匹配。\n\
  \n##### 图 4.8 批量文件执行表单。\n\n#### ![04fig08](img/04fig08.jpg)\n\n确切的文件格式取决于系统存储的关于每个用户的信息，但在大多数系统中，每行必须遵循以下格式：\n\
  \n`create:*username:passwd:uid:gid:realname:homedir:shell:min:max:warn:inactive:expire*`\n\
  \n创建一个由 Webmin 自动分配用户 ID 的用户的示例行如下：\n\n```\ncreate:jcameron:mysecret::3001:Jamie\
  \ Cameron:/home/jcameron:/bin/bash:::::\n```\n\n如您所示，该行由一系列字段组成，每个字段由冒号 (:) 分隔。在创建用户时，第一个字段必须是\
  \ `create` 字段。其他字段的含义见表 4.1。\n\n一旦您创建了包含要创建用户详情的文件，使用 `Upload batch file` 或 `Local\
  \ batch file` 字段选择它，并点击 `Execute batch` 按钮。将显示一个每个创建的用户以及遇到的任何错误的页面。最常见的错误是其中某行缺少字段，每行都必须恰好具有数量数量字段，即使某个字段为空，旁边的冒号分隔符也必须包含。\n\
  \n##### 表 4.1 批量文件字段及其含义\n\n| 字段 | 说明 |\n| :--- | :--- |\n| `username` | 用户的登录名。此字段留空。\
  \ |\n| `passwd` | 用户的密码。如果此字段留空，则用户不需要密码。如果它只包含字母 x，则用户将被锁定且不允许登录。 |\n| `uid` |\
  \ 新用户的用户 ID。这应该留空，以便 Webmin 自动分配一个。 |\n| `gid` | 用户主组的 ID。这不能是组名，且不能留空。如果输入了多个 GID，则用户将作为次要成员添加到第一个之后列出的所有组中。\
  \ |\n| `realname` | 用户的真实姓名。不是强制的，但不应留空。 |\n| `homedir` | 创建的并将所有权分配给用户的目录。如果模块已配置为自动分配主目录，则可以将其留空。\
  \ |\n| `shell` | 用户的登录 shell。此字段不能留空。 |\n| `min` | 用户创建或最后一次更改密码后，用户在再次更改之前必须等待的天数。可以留空以允许用户随心更改。\
  \ |\n| `max` | 用户创建或最后一次更改密码后，密码过期并必须再次更改的天数。如果留空，密码将永不过期。 |\n| `warn` | 过期日期之前的多少天，用户在登录时将收到密码即将过期的警告。如果留空，用户在过期前将不知道密码已过期。\
  \ |\n| `inactive` | 密码过期后多少天，如果用户未选择新密码，整个账户将被禁用。如果留空，账户将永不过期。 |\n| `expire` | 该账户将过期的日期。遗憾的是，您必须输入自\
  \ 1970 年 1 月 1 日以来的天数！ |\n\n### 4.12 配置用户和组模块\n\n与其他 Webmin 模块一样，“用户和组”有几个选项可以通过点击用户和组列表上方的\
  \ `Module Config` 链接进行配置，如图 4.9 所示。您可以安全更改的选项及其含义见表 4.2。\n\n##### 图 4.9 用户和组的配置选项。\n\
  \n\n\n\n\n![04fig09](img/04fig09.jpg)\n\n### 表 4.2. 模块配置选项\n\n| 选项 | 描述 |\n| :---\
