  \ ID？ | 此选项仅在在上一个选项启用时生效。如果在为用户创建新组时将此项设置为 `Yes`，Webmin 将确保他们的 `UID` 和 `GID` 相同。这在实际上不会产生任何区别，但某些管理员喜欢这样做。\
