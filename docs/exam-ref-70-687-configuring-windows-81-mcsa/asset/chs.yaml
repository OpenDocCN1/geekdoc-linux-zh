- "# Exam Ref 70-687 配置 Windows 8.1 (MCSA) 考试参考\n\n\n\n\n\n\n\n## 引言\n\n配置 Windows\
  \ 8.1 考试 (70-687) 分七组目标。本书包含七章，详细阐述了这些目标是什么，以及你可以预计在考试中看到的内容。虽然大多数认证书籍侧重于如何执行与考试目标相关的任务，但本书涵盖了你所需的通用、高级知识，这些知识将帮助回答关于“为什么”以及“何时”实际执行这些任务的问题。\n\
  \n我们假设你已经在相关行业工作了一段时间，并具备支持 Windows 8.1 所需通用知识；我们假设你觉得自己已经准备好参加考试了。因此，在书中，只有当我们认为某些步骤你可能没有做过或可能会感到困惑时，我们才会提供操作步骤和演示。例如，我们包含了展示如何设置虚拟机并在其上安装操作系统的步骤，以及引导你配置\
  \ VPM Reconnect 选项的步骤，但我们不会提供安装设备驱动程序或配置 Windows 更新的步骤。我们还会包含你可能没认为自己需要学习甚至知道的内容；我们将提供考试技巧，包括命令行工具、参数以及用于执行任务的\
  \ PowerShell 命令，并提供一些我们认为对你的工作和考试都有益的互联网资源链接。\n\n本书涵盖了每一项考试目标，但并没有涵盖每一道考试题。只有微软考试团队可以访问考试题目本身，而且微软定期向考试中添加新题，因此涵盖特定的题目是不可能的。你应该将本书视为你相关的实战经验和其他学习材料的补充。如果你在书中遇到一个你不认为自己完全掌握的主题，请使用文中提供的链接查找更多信息，并花时间研究和学习该主题。MSDN、TechNet\
  \ 以及博客和论坛上都有优质信息。\n\n## 微软认证\n\n微软认证通过证明你对当前微软产品和技术的广泛技能和经验的掌握，使你脱颖而出。考试和相应的认证旨在验证你在对本地和云端设计、开发，或实施和支持使用微软产品和技术的解决方案时，对关键胜任能力的掌握程度。认证为个人、雇主和组织带来了各种益处。\n\
  \n### 更多信息：所有微软认证\n\n欲获取有关微软认证的信息（包括可用认证的完整列表），请访问 `http://www.microsoft.com/learning/en/us/certification/cert-default.aspx`。\n\
