  \n\n\n\n\n在本章中，你将学习与考试相关的系统和数据恢复选项。这些任务中的大部分是通过使用向导完成的，因此不需要过多的指令。尽管如此，这些内容包含在考试范围之内，因此在本文此处要求时，你需要完成所有的向导操作。你可能已经熟悉了其中的许多目标，包括但不限于执行设备驱动程序回滚、配置\
  \ `System Restore` 以及从 `SkyDrive`（现已重命名为 `OneDrive`）恢复文件。\n\n**本章目标：**\n\n* 目标 7.1:\
  \ 配置系统恢复\n* 目标 7.2: 配置文件恢复\n\n## 目标 7.1: 配置系统恢复\n\n正如你可能想到的，系统恢复涉及从系统故障中恢复。系统故障可能由不稳定的设备驱动程序和硬盘故障，或者由带有\
  \ Bug 或受损的第三方软件引起。有时，解决这些问题只需如回滚设备驱动程序或使用 `System Restore` 返回到更稳定的日期即可。当这些方法无效时，你可以让\
  \ Windows 自动修复。正如你在这里将学到的，还有其他可用恢复功能，包括安全模式和启动日志以及其他熟悉的恢复选项。你还可以使用创建的恢复驱动器来解决启动问题。\n\
  \n**本目标涵盖了如何：**\n\n* 执行驱动程序回滚\n* 配置恢复驱动器\n* 配置 `System Restore` 并创建还原点\n* 执行刷新或还原\n\
  \n### 执行驱动程序回滚\n\n只有在为某个硬件安装了新版本的设备驱动程序后，`Device Manager` 中才会出现执行设备驱动程序回滚的选项。如果设备只有一个驱动程序且从未更新过，则该选项将不可用。当新安装或升级的设备驱动程序引起问题时，你需要使用此功能。设备驱动程序回滚只能回滚到之前安装的驱动程序，无法回滚到上一个驱动程序之前或任何之前的驱动程序。\n\
  \n要找到回滚驱动程序的选项，打开 `Device Manager`，双击问题设备，点击 `Driver` 选项卡，然后点击 `Roll Back Driver`，如图图\
  \ 7-1 所示，执行该任务。\n\n![使用 Device Manager 将驱动程序回滚到上一个版本。](img/httpatomoreillycomsourcemspimages1989115.png.jpg)\n\
  图 7-1. 使用 Device Manager 将驱动程序回滚到上一个版本。\n\n### 配置恢复驱动器\n\n恢复驱动器可以帮助你解决计算机问题，即使在计算机无法启动的情况下也能从中恢复。你可以使用专门为此目的提供的向导来创建恢复驱动器。如果你的计算机还有恢复分区，你也可以复制该分区，以便在需要时使用它来刷新或还原你的计算机。要开始，在开始屏幕上输入\
  \ `Recovery Drive` 并点击结果中的 `Create A Recovery Drive`。\n\n### 考试提示\n\n如果你的计算机没有恢复分区，则在创建恢复驱动器时，复制恢复分区的选项将不可用。发生这种情况时，恢复驱动器将仅包含恢复工具和启动映像，而不包含你可以用于刷新或重置计算机的恢复映像。\n\
  \n在运行恢复驱动器向导期间，系统会提示你是否要包含制造商创建的任何可用恢复分区。系统还会提示你选择一个驱动器来保存信息。在物理机（相对于虚拟机）上，你必须选择一个至少能容纳\
  \ 512 MB 数据的 USB 驱动器，但你也可以使用 CD 或 DVD。无论你选择什么，它必须是可格式化的（因为当你将其配置为恢复驱动器时，驱动器上的所有内容都将被擦除）。向导将准备好驱动器、格式化驱动器并复制实用。\n\
  \n### 考试提示\n\n如果你的计算机预带 Windows 8 且你升级到了 Windows 8.1，那么你在 Windows 8 运行期间创建的任何恢复驱动器都将包含\
  \ Windows 8。请确保在升级时创建一个新的恢复驱动器。\n\n#### 使用 Windows RE\n\nWindows 恢复环境（`RE`）可以帮助你修复无法启动的操作系统。Windows\
  \ `RE` 基于 Windows 预安装环境（`Windows PE`），并提供故障排除和诊断工具。这些包括自动修复选项、按按钮重置（后文详述）和系统映像恢复。默认情况下，Windows\
  \ `RE` 预装在运行 Windows 8.1 和 Windows Server 2012 R2 的机器上。\n\n你可以从启动选项菜单访问 Windows\
  \ `RE` 工具，你可以通过多种方式启动它，包括使用恢复媒体启动计算机。你还可以使用 `PC Settings` 中的 `Update And Recovery`\
  \ 选项卡，特别是 `Recovery` 选项卡，可以在其中找到重启计算机的选项（在 `Advanced Startup` 下，点击 `Restart Now`）。参见图\
  \ 7-2。此外，如果计算机遇到以下任何情况，Windows `RE` 将自动打开：\n\n* 触摸设备上的 `BitLocker` 错误\n* 连续两次尝试启动\
  \ Windows \n* 在启动完成后两分钟内发生两次意外关机\n\n![在高级启动下点击立即重启以重启计算机并访问 Windows RE 选项。](img/httpatomoreillycomsourcemspimages198917.png.jpg)\n\
  图 7-2. 在高级启动下点击立即重启以重启计算机并访问 Windows RE 选项。\n\n### 考试提示\n\n如果你的计算机带有 Windows 8 且你升级到了\
  \ Windows 8.1，任何你在 Windows 8 期间创建的恢复驱动器都将包含 Windows 8。（但在 Windows Server 2012 中可以通过启动期间按\
  \ `F8` 键访问 LKGC）。\n\n#### 使用其他恢复工具\n\n你可以使用 `msconfig.exe` 及其 `Boot` 选项卡来选择在重启时进入安全模式。其他选项包括但不限于\
  \ `No GUI Boot` 和 `Boot Log`。确保你了解如何使用 `System Configuration` 工具禁用服务、更改启动类型、配置启动选项等。系统配置工具如图图\
  \ 7-3 所示。（记住，如果你点击 `Startup` 选项卡，你看不到选择与 Windows 一起启动应用程序的选项；你只能看到转到任务管理器执行该任务的选项。）\n\
  \n### 更多信息：了解 Windows RE 环境\n\n确保你了解 RE 中的可用选项以及如何访问它们。在此获取更多信息：[`technet.microsoft.com/en-us/library/hh825173.aspx`](http://technet.microsoft.com/en-us/library/hh825173.aspx)。要学习如何执行任务，包括向\
  \ Windows RE 启动菜单添加自定义工具以及部署 Windows RE，请参考本文：[`technet.microsoft.com/en-us/library/hh824896.aspx`](http://technet.microsoft.com/en-us/library/hh824896.aspx)。\n\
  \n### 执行刷新或还原**\n\n\n\n\n你可以使用系统还原将计算机恢复到之前的稳定时间点。系统还原会保留还原点，如果启用了该功能，还原点将自动创建。在尝试更具破坏性的解决方案（例如将计算机还原到其出厂设置）之前，你应该先尝试使用系统还原。你可以在开始屏幕上输入`创建还原点`并点击搜索结果来访问系统还原。在“系统属性”对话框中，点击`创建`以创建新的还原点。点击`配置`以查看配置选项。非\
  \ NTFS 驱动器上将无法使用系统还原。\n\n### 考试提示\n\n你可以使用一些 Windows PowerShell 常用命令（cmdlets）来管理系统还原，这些命令本身中通常会包含“ComputerRestore”。在考试之前，请复习如\
  \ `Enable-ComputerRestore`、`Disable-ComputerRestore`、`Get-ComputerRestorePoint`\
  \ 等 cmdlet。你可以在此处找到这些以及其他 cmdlet：*[`technet.microsoft.com/en-us/library/hh849785.aspx`](http://technet.microsoft.com/en-us/library/hh849785.aspx)*。此外，你可能会看到有关控制系统还原的命令行工具的问题。请确保复习了\
  \ `Vssadmin`，其中 `VSS` 代表卷影复制（Volume Shadow Copy），它用于管理还原点。\n\n如图 7-4 所示，你可以选择开启或关闭系统保护（系统还原），并更改你想要用于保留还原点的磁盘空间大小。当你考虑执行某些你认为可能危及机器的操作时（例如安装未经测试的设备驱动程序），你也可以手动创建自己的还原点。当你使用从启动选项中可用的系统还原时，你可以选择所需的还原点。\n\
  \n![在系统属性对话框中配置系统还原属性。](img/9atomoreillycomsourcemspimages1989121.png.jpg)图 7-4.\
  \ 在系统属性对话框中配置系统还原属性。\n\n### 考试提示\n\n确保你了解如何创建系统映像备份。这是控制面板>“所有控制面板项”下“文件历史”窗口中的一个选项。系统映像是运行\
  \ 运行所需的驱动器副本，如果需要，它还可以包含额外的驱动器。如果你的硬盘故障，可以使用此系统映像来恢复计算机。但是，使用映像时，你无法选择要恢复的文件。它是全有或全无的。\n\
  \n### 执行刷新或重置\n\n当计算机损坏严重到系统还原无法解决问题时，回滚具有破坏性的设备驱动程序既无效也没有必要，而且在你已经尝试了 Windows RE（恢复环境）中提供的其他可用选项（包括尝试自动修复、进入安全模式等）后，你可能需要刷新（按按钮刷新）或重置（recycle）你的计算机。（“重置”是“重置电脑”的新说法，尽管界面选项仍将该过程称为重置你的\
  \ PC。）当然，在 Active Directory 目录服务域中，你可能只需使用域相关的工具推发系统映像，但在独立工作站和小型组织的情况下，刷新和重置通常可以解决问题。\n\
  \n### 考试提示\n\n如果你想在刷新期间保留设置和传统应用程序，你需要使用一个名为 `Recimg.exe` 的工具，在安装应用程序并进行自定义后捕获计算机的映像。这样，如果以后以后需要执行刷新，就会使用该映像并保留你的设置和应用程序。\n\
  \n你可以在 PC 设置的“更新和恢复”下找到这两个工具。这两个工具以及进入“高级启动”模式的选项都是可用的，还有使用“高级启动”的选项。这些选项在之前的图 7-2\
  \ 中显示。这三个选项定义在这里：\n\n*   **不影响文件的刷新电脑**。选择此选项可以删除第三方程序、Internet Explorer 加项、打印机和扫描仪软件等。你不会丢失任何个人文件。这解决了大多数问题。\n\
  *   **删除所有内容并重新安装 Windows**。当你想要重置 PC 或完全重新开始时，选择此选项。这将计算机还原为出厂设置并删除所有个人数据。\n* \
  \  **高级启动**。此选项既不是刷新也不是重置；相反，它会将计算机重启到 Windows RE 环境，你可以从设备或磁盘启动计算机、更改固件设置、更改 Windows\
  \ 启动设置，或从系统映像还原 Windows。\n\n### 考试提示\n\n确保你了解在 PC 设置>更新和恢复>“恢复”选项卡下使用“高级启动”重启 PC\
  \ 时会发生什么。有很多选项，微软在这里列出了其中一些：*[`windows.microsoft.com/en-us/windows-8/windows-startup-settings-including-safe-mode`](http://windows.microsoft.com/en-us/windows-8/windows-startup-settings-including-safe-mode)*。此处可以找到有关\
  \ Windows RE 故障排除功能的更详细描述：*[`technet.microsoft.com/en-us/library/hh824837.aspx`](http://technet.microsoft.com/en-us/library/hh824837.aspx)*。你将被要求这些功能。\n\
  \n### 思考实验：故障排除启动问题\n\n在这个思考实验中，应用你对本目标学到的知识。你可以在章节末尾的“答案”部分找到这些问题的答案。\n\n你支持拥有八台计算机的小型企业。你接到电话说其中一台计算机无法启动。用户有大量的程序和数据。数据已备份在外部驱动器上且组织良好，因此数据恢复不是问题。用户拥有恢复磁盘。请就你将如何解决问题回答以下问题。\n\
  \n1.  在尝试其他选项之前，你会选择按按钮重置吗？为什么或为什么？\n2.  你会插入并使用恢复磁盘启动吗？为什么或为什么？\n3.  你会选择 PC 设置中的重置选项将计算机还原为出厂设置吗？为什么或为什么？\n\
  \n### 目标总结\n\n* 如果怀疑新安装或更新的设备驱动程序导致问题，可以在设备管理器中回滚驱动程序。* 你可以创建并使用恢复驱动器来恢复启动问题。Windows\
  \ RE 提供了许多恢复选项，包括但不限于自动修复、系统还原以及刷新和重置。* 刷新计算机时，个人文件不受影响，但会删除第三方应用程序和 Internet Explorer\
  \ 加项。当你重置计算机时，将其还原为出厂设置。\n\n### 目标复习\n\n回答以下问题以测试你对本目标信息的掌握情况。你可以在章节末尾的“答案”部分找到这些问题的答案以及每个答案选项正确或错误的解释。\n\
