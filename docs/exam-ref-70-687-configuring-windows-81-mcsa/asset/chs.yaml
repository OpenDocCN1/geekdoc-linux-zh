  4. **正确答案：** C\n    1. **错误：** 因为文件每小时备份一次，所以你不太可能在一天内丢失过多你无法快速恢复的数据。\n    2. **错误：**\
  \ 离线缓存的大小为 5%，对于大多数用户来说足够大，且不会引起缓存问题。\n    3. **正确：** 你用于保存 `File History` 数据的驱动器最终会变满，因为\
  \ `Keep Saved Versions` 的默认设置是永久 (Forever)。\n    4. **错误：** `File History` 创建的事件日志永远不会大到引起任何问题。虽然你可能会看到警告和错误，但你会通过\
