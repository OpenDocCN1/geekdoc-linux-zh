  \ 目标 7.2: 思想实验\n\n1. `File History` 可以满足所有用户的所有需求，并在 Windows 8 和 Windows 8.1 中可用`Windows\
  \ 7 File Recovery` 不适用于 Windows 8.1 用户。`File History` 保留文件的旧版本并可以配置为每天运行。这比将数据保存到外部驱动器更好，因为你可以将数据存储在公司服务器上进行保护，并在需要时使用。\n\
