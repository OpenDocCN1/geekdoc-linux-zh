  \ 打开`PC 设置`(PC Settings)，导航到`账户`(Accounts)，`其他账户`(Other Accounts)，选择该标准用户账户并点击`禁用分配访问`(Disable\
  \ Assigned Access)。在提示时输入你的管理员帐户和密码。<br>2. 重启电脑并按`F12`进入启动选项。选择禁用`分配访问`(Assigned\
  \ Access)。<br>3. 按五次`Windows 键`让计算机重启。<br>4. 打开`PC 设置`(PC Settings)，打开`账户`(Accounts)，并点击`禁用分配访问`(Disable\
  \ Assigned Access)。按四次`Windows 键`重启。 | |\n\n## 目标 2.4: 配置桌面版 Internet Explorer 11\
  \ 和 Internet Explorer\n\nWindows 8 和 Windows 8.1 为`Internet Explorer`（`IE`）11 提供了选项。开始屏幕上有一个应用程序，桌面上有一个`Internet\
  \ Explorer`。前者像其他应用程序一样，经过精简，并带有你可以使用的“化身功能”（charms）来配置设置和偏好等。后者则是你已经熟悉的传统的 `IE\
  \ 11` 应用程序，带有你可以选择显示的菜单，并可以访问所有 `IE` 设置，包括隐私和安全。你在开始屏幕上找到的应用使用整个屏幕，不包含菜单栏或命令，针对触摸进行了优化，在平板电脑和笔记本电脑用户中很受欢迎。桌面上的\
  \ `IE 11` 通常用于该应用程序无法满足终端用户需求，或者用户更喜欢 `IE` 的传统外观和感受时。两者是同一个应用程序，但具有不同的界面。因此，你在其中一个中做的更改将应用于另一个。\n\
  \n在本节中，你将不会学习如何使用这些应用程序。你也不会过多学习在桌面 `IE` 的各种菜单和工具栏中找到终端用户设置。你将不会学习应用程序“化身功能”中的可用内容。你需要探索这些功能并熟悉它们，但我将利用这里的页面来讨论考试中的目标；即如何使用`兼容性视图\
  \ 1Compatibility View)，配置安全和隐私，以及配置`下载管理器 1Download Manager)。\n\n**本目标涵盖了如何：**\n\
  \n* 配置`兼容性视图 1Compatibility View)并探索`组策略 1Group Policy)设置\n* 配置安全和隐私设置\n* 管理加载项、工具栏、扩展程序、搜索提供程序等\n\
  * 配置`下载管理器 1Download Manager)\n\n### 配置兼容性视图并探索组策略设置\n\n用于创建网站的技术不断变化，就像与计算有关的所有事物一样。多年来的转型让一些网站（以及网站管理员）落后于时代。旧的网站（无论是互联网还是内网）如果仍使用旧技术配置，在像\
  \ `IE 11` 较新的网络浏览器中打开查看时，往往无法正常显示。因此，`IE 11` 提供了`兼容性视图 1Compatibility View)。启用后，浏览器将以`兼容性视图`模式显示所选页面，网页即可正常查看。\n\
  \n终端用户可以通过点击桌面 `IE 11` 地址栏中的`兼容性视图`图标来快速为网页启用`兼容性视图`模式。如果该网站在微软的不兼容网站列表中，终端用户将可以使用此按钮。用户也可以手动将网站添加到自己的个人列表中。图\
  \ 2-18 显示了`兼容性视图`图标的样子以及`兼容性视图设置 1Compatibility View Settings)对话框。要手动添加网站，请在`添加此网站\
  \ 1Add This Website)文本框中输入网站名称，点击`添加 1Add)，然后点击`关闭`(Close)。\n\n![使用兼容性视图。](img/imageatomillycomsourcemsp198867.png)图\
  \ 2-18. 使用兼容性视图。\n\n在较大的组织中，你可能希望使用`组策略 1Group Policies)来控制`兼容性视图 1Compatibility\
  \ View)的情况。你可以在`组策略管理编辑器 1Group Policy Management Editor)中通过`计算机配置 1Computer Configuration)、`策略\
  \ 1Policies)、`管理模板 1Administrative Templates)、`Windows 组件 1Windows Components)、`Internet\
  \ Explorer`、`兼容性视图 1Compatibility View)找到这些选项。确保你熟悉所有这些选项。\n\n表 2-2 列出了 IE11 的可用组策略设置。\n\
