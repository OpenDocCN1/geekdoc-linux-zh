  \ |\n1.  你现在每次想访问计算机并输入密钥时都要插入该驱动器。\n2.  如果你丢失了 `startup key`，你将不得不使用 `recovery\
  \ key` 解锁驱动器。这是一个 48 位数字，可以用许多方式存储，包括存储在 `USB drive` 上。\n3.  计算机必须具有兼容的 `TPM` 芯片。\n\
