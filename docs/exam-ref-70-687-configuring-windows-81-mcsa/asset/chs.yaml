  \ `WinRS`。\n4. **正确**。你可以在 Windows PowerShell 会话中使用 `WinRS`。\n\n# 第 4 章：配置对资源的访问\n\
  \n用户需要访问资源，包括但不限于文件、文件夹、网络共享和打印机。你的工作（起至少在某些时候）是让这些用户访问他们需要的内容，而仅此而已。只有这样，你才能确保资源的安全，并让数据留在正确的人手中。本目标涵盖了这方面的各个方面，从配置共享资源到配置文件和文件夹（以及打印机）访问，再到针对工作组和域的身份验证和授权配置。\n\
  \n**本章目标：**\n\n* 目标 4.1：配置共享资源\n* 目标 4.2：配置文件和文件夹访问\n* 目标 4.3：配置身份验证和授权\n\n## 目标\
  \ 4.1：配置共享资源\n\n本节包含多个目标，它们都与如何在本地网络上共享和管理资源有关。在这里，你将学习家庭组（homegroups）、文件夹权限、库、共享打印机甚至是\
  \ SkyDrive。关于共享，这里讨论了三种共享方式：家庭组共享、文件夹共享和公共文件夹共享。文件夹共享也可以用于域网络，尽管你的处理方式与简单地在小型本地网络上共享几个文件夹并让用户随心所欲地管理略有不同。（在\
  \ Active Directory 服务域中，网络管理员通过其在网络上管理的各种服务器来管理身份验证、授权和所有共享方面。）SkyDrive 也可以被视为共享工具，尽管用户可能仅用它与自己共享数据，以便从任何地方访问自己的文件。\n\
  \n**本目标涵盖了如何：**\n\n* 配置家庭组设置\n* 配置共享文件夹权限\n* 配置文件库\n* 配置共享打印机\n* 设置并配置 SkyDrive\n\
  \n### 备注\n\nSkyDrive 的名称正在更改为 OneDrive，在未来的某个时刻，考试也会发生术语变化。\n\n### 配置家庭组设置\n\n家庭组让家庭用户在其私有的本地网络上轻松地他人共享文档、打印机和媒体。这是最简单的共享类型，但对共享数据可以设置的权限和限制是有限的。默认情况下，所有加入家庭组的用户（每个网络只能有一个家庭组）对已共享的内容具有只读访问。不过，用户可以重新配置此项，根据需要允许读取和写入访问。\n\
  \n在选择家庭组时，用户可以执行以下操作：\n\n* 从 Windows 提供的提示创建或加入家庭组，前提是网络已配置为“专用”。\n* 从“网络和共享中心”创建或加入家庭组，前提是想要加入的计算机基于\
  \ Windows 7 或 Windows 8。\n* 通过适用的家庭组向导创建或加入家庭组。Windows 将生成一个其他用户加入时所需的随机密码。\n* 从他们的原始位置和默认库中共享文件。\n\
  * 为他们共享的数据授予只读或读取/写入访问。\n* 将访问限制仅限于那些在他们的计算机上也拥有帐户和密码的网络用户。\n* 为所有网络用户配置相同的权限，或为个人用户设置不同的权限。\n\
  \n### 考试提示\n\n家庭组无法创建或启用的原因有很多，其中之一是网络上的某个特定计算机未启用 `IPv6`。\n\n虽然我们可以花几页的内容向你介绍如何创建和加入家庭组，但它是通过向导完成的，这并不是真正必要的。然而，你应该在自己的本地网络上创建一个家庭组来查看其操作方法，并让其他计算机加入，以便你熟悉这一过程。注意，用户可能已经加入了家庭组，因为\
  \ Windows 在设置期间会自动检测现有的家庭组。图 4-1 显示了一台连接到专用网络并已加入家庭组的计算机。\n\n![从网络和共享中心创建、加入或查看家庭组状态。](img/httpatomoreillycomsourcemspimages1988941.png.jpg)图\
  \ 4-1。从网络和共享中心创建、加入或查看家庭组状态。\n\n一旦配置了家庭组，用户就可以从文件管理器的“共享”选项卡（以及其他地方）与家庭组共享数据。注意所选文件夹的“停止共享”选项，如图\
  \ 4-2 所示，以及允许整个家庭组查看或编辑所选数据的选项。在这里有允许整个家庭组查看或编辑所选数据的选项，你可以看到特定用户 `Ballew@hotmail.com`\
  \ 也有一个选项。\n\n![在文件管理器中，使用共享选项卡选择如何与家庭组共享数据。](img/httpatomoreillycomsourcemspimages1988943.png.jpg)图\
  \ 4-2。在文件管理器中，使用共享选项卡选择如何与家庭组共享数据。\n\n如果你不想与家庭组中的所有人共享数据，可以选择仅与特定人员共享。你还可以为你选择的人设置不同的权限。这是一种非常简单的数据共享方式，适用于小型家庭但不适用于许多地方。要这样做，请遵循以下步骤：\n\
  \n1. 打开文件管理器并选择任何文件夹。\n2. 右键点击文件夹，从快捷菜单中指向“共享”，然后点击“特定人员”。\n3. 在“文件共享”窗口中，点击“家庭组”并点击“删除”。查看图\
  \ 4-3\n\n![从共享列表中移除家庭组以与特定人员进行共享。](img/httpatomoreillycomsourspimages1988945.png.jpg)图\
  \ 4-3。从共享列表中移除家庭组以与特定人员进行共享。\n\n4. 点击“添加”选项左侧的箭头，选择要添加的人。然后点击“添加”完成任务。\n5. 完成此后，点击你刚刚添加的人旁边的箭头，选择“读取”或“读取/写入”。\n\
  6. 根据需要重复此操作以添加其他网络用户。\n\n### 配置共享文件夹权限\n\n这里讨论了两种文件夹共享选项：公共文件夹共享和我们所说的*任意*文件夹共享。任意文件夹共享是两者中更复杂的，并且比公共文件夹共享提供更多选项。你也可以从命令行、微软管理控制台\
  \ (MMC) 以及 Windows PowerShell 进行共享。\n\n### 公共文件夹共享\n\n\n\n\n\n正如你可能猜到的那样，公共文件夹共享涉及公共文件夹。这里有几个公共文件夹，包括公共文档、公共音乐、公共图片和公共视频，你也可以创建自己的公共文件夹。要使用这种共享方式，你必须将要共享的数据移动到相应的公共文件夹中。（你可以复制它，但这会让文档版本控制复杂化并在计算机上创建重复文件。）优点是，这是一种让需要的用户能够访问数据的非常简单的方法，至少在你移动了共享数据之后是。缺点是，你对配置的共享级别的控制非常有限。\n\
  \n如果通过这种方式启用了公共文件夹共享，计算机上每个拥有用户账户和密码的人都可以访问公共文件夹。你可以从`网络和共享中心`、`更改高级共享设置`以及`所有网络`选项对公共共享进行更改。这里有两个选项：\n\
  \n*   开启共享，以便任何具有网络访问权限的人都可以读取和写入公共文件夹中的文件，或关闭公共文件夹共享（登录到此电脑的人仍然可以访问这些文件夹）。\n* \
  \  开启密码保护的共享或关闭密码保护的共享。前者配置为：用户必须在计算机上拥有用户账户和密码才能访问共享文件、打印机和公共文件夹。后者允许没有账户和密码的人访问。如果需要，你还可以为私有或公共配置文件开启文件和打印机共享。\n\
  \n### 更多信息：共享权限\n\n请理解，在这些章节中我们指的是共享权限。共有三种：读取、更改和完全控制。然而，你还可以配置新技术文件系统（NTFS）权限，你将在目标\
  \ 4.2：配置文件和文件夹访问中学习这些。如果对特定用户同时应用了共享权限和 NTFS 权限，将计算两者的限制最少的权限，然后比较这两个结果。最终应用于共享的权限是两者中限制较严格的那个。然而，`拒绝`\
  \ 总是覆盖 `允许`。\n\n### 任何文件夹共享\n\n任何文件夹共享的选项比你目前为止看到的其他类型要多得多。任何文件夹共享允许用户执行以下操作：\n\n\
  *   除了原始位置外，从任何位置共享文件\n*   为单个用户设置不同的权限\n*   在域网络中保护数据\n*   在本地网络中保护数据，其要求的安全性比家庭组或公共文件夹选项提供的更高\n\
  \n要开始，你必须首先选择或创建一个要共享的文件夹。然后，你可以右键点击文件夹，点击`属性`，并点击`共享`选项卡以显示图 4-4 所示的`属性`对话框。需要注意的是，如果你点击属性对话框中点击`共享`，将获得之前在家庭组中看到的共享选项（图\
  \ 4-3）。那并不是任何文件夹共享的威力所在。相反，点击`高级共享`以访问`高级共享`对话框，该对话框也如图 4-4 所示。\n\n### 更多信息：共享特征\n\
  \n共享权限具有以下特征：\n\n*   它们仅适用于通过网络获取资源访问的用户。它们不适用于本地登录的用户。在这些情况下，要保护资源，你必须使用 `NTFS`\
  \ 设置权限。\n*   它们是在 FAT 和 FAT32 卷上保护网络资源的唯一方法，因为在这些卷上无法可用的 NTFS 权限。\n*   它们指定了允许通过网络访问共享资源或文件夹的最大用户数。\n\
  *   当同时应用共享权限和 NTFS 权限时，会比较两组权限的累积权限并应用限制较严格的权限。\n\n![通过任何文件夹共享，你对共享内容以及与谁共享具有完全控制权。](img/httpatomoreillycomsourcemspimages1988947.png.jpg)图\
  \ 4-4。通过任何文件夹共享，你对共享内容以及与谁共享具有完全控制权。\n\n现在你有几个选项。首先，勾选`共享此文件夹`复选框，默认为 20 个同时在线用户。接下来，点击`权限`。现在你就可以访问图\
  \ 4-5 所示的高级共享选项。你在这里可能想做的是从列表中删除`Everyone`（已经在图 4-5 中这样做过了），然后添加你希望其访问的特定用户或组（我也这样做了）。默认权限是`读取`，但你可以为所选的用户或组添加`更改`或`完全控制`。你也可以选择拒绝访问，尽管这通常不是限制共享的常用方法。\n\
  \n![删除 Everyone 组并添加特定用户或组并为他们应用权限。](img/httpatomoreillycomsourcemspimages198849.png.jpg)图\
  \ 4-5。删除 Everyone 组并添加特定用户或组并为他们应用权限。\n\n### 考试提示\n\n无论对组或用户应用了什么共享权限，无论拥有何种权限组合，`拒绝`总是意味着拒绝。你可能会在考试中看到一个很长的问题，提供了关于用户的大量信息、他所属的组等，并且对于他拥有权限的共享，可能有一个`拒绝`\
  \ 权限。如果他被拒绝访问，那就是这样了。\n\n表 4-1 显示了共享权限及其局限性。\n\n表 4-1。共享权限及其局限性\n\n| 共享权限 | 局限性\
  \ |\n| --- | --- |\n| 读取 | 显示文件夹名称；显示文件名、数据和属性；执行程序文件；访问文件夹内的其他文件夹 |\n| 更改 | 执行所有读取操作；在文件夹中创建和添加文件；更改和追加文件数据；更改文件属性；删除文件夹和文件\
  \ |\n| 完全控制 | 执行所有更改权限；更改文件权限；获取文件所有权 |\n\n### 其他共享方式\n\n\n\n\n你不必使用现有的终端用户工具来创建和管理共享。你可以通过在\
  \ MMC 内部使用“共享文件夹”便插程序以及使用 Windows PowerShell，在命令行处进行共享。虽然你可能不会选择使用这些工具进行共享，但考试中可能会遇到关于它们的问题。\n\
  \n## 从命令行共享\n\n你可以在命令提示符下共享文件夹。你使用的命令是 `net share`，通常形式为 `net share [ShareName]`（显示共享信息）以及\
  \ `net share [ShareName=Drive:Path]`（指定要共享的目录的路径）。你还可以添加这些参数：\n\n* `/users: number`。此参数设置可同时访问共享资源的最大人数。\n\
  * `/unlimited`。此参数设置可同时访问共享资源的用户数不受限制。\n* `/remark: “text”`。此参数为资源添加描述性注释。将文本包含在引号中。\n\
  * `/cache:automatic`。此参数启用具有自动重新整合功能的离线客户端缓存。\n* `/cache:manual`。此参数启用具有手动重新整合功能的离线客户端缓存。\n\
  * `/cache:no`。此参数建议客户端离线缓存是不恰的。\n* `/delete`。此参数停止共享共享资源。\n* `net help command`。此参数显示指定命令的帮助信息。\n\
  \n### 考试提示\n\n要创建一个对浏览网络的用户不可见的共享，请在共享名称后添加美元符号（`$`）（例如 `CTest$`、`DShare$` 等）。\n\
  \n## 使用 MMC 共享\n\n要使用 MMC 进行共享，请添加“共享文件夹”便插程序。点击左窗格中的“共享”节点，在中间区域右键点击并点击“新建共享”，如图\
  \ 4-6 所示，以启动创建共享文件夹向导。你还可以使用控制查看会和打开文件。\n\n![使用 MMC 创建和管理共享。](img/httpatomoreillycomsourcemspimages1988951.png.jpg)图\
  \ 4-6. 使用 MMC 创建和管理共享。\n\n## 使用 Windows PowerShell 共享\n\n你可以使用 Windows PowerShell\
  \ 创建管理共享。你可能会用到的命令是 `New-SmbShare`，随后是共享名称和要共享文件夹的路径。（SMB 代表服务器消息块）。还有其他使用 Windows\
  \ PowerShell 管理共享的命令：\n\n* `Get-SmbShare`。使用此命令列出计算机上已存在的共享。参见图 4-7。\n* `Set-SmbShare`。使用此命令修改共享。\n\
  * `Remove-SmbShare`。使用此命令删除共享。\n* `Grant-SmbShareAccess`。使用此命令为共享设置权限。\n\n![使用 Windows\
  \ PowerShell 查看共享。](img/httpatomoreillycomsourcemspimages1988953.png.jpg)图 4-7.\
  \ 使用 Windows PowerShell 查看共享。\n\n### 考试提示\n\n考试中极可能会遇到涉及 `SmbShare` 命令的内容。\n\n##\
  \ 配置文件库\n\nWindows 8.1 自带有一套库结构，包括桌面、文档、下载、音乐、图片和视频的库。你保存到相关文件夹的任何内容在同名的库中都可用。这意味着，如果你将文件保存到“文档”文件夹，你就可以在“文档”库中访问它。不过，库本身并不持有文件；它只记录文件存储的位置。默认情况下，库仅提供对相关个人文件夹数据的访问。库不提供对相关“公共”文件夹或任何其他文件夹的访问，尽管你可以根据需要添加它们。（注意，Windows\
  \ 7 中的库提供了对“公共”文件夹的访问。）关于库，需要了解的更多只有如何创建自己的库以及向现有库添加文件夹。\n\n### 注意：在文件资源管理器中显示库\n\
  \n要显示或隐藏文件资源管理器导航格中的“库”选项，请点击任何可用窗口中的“视图”选项卡，点击“导航格”，并在生成的列表中点击“显示库”。\n\n要创建你自己的库，请按照以下步骤操作：\n\
