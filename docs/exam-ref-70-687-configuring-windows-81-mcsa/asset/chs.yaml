  \ from VHD`、`BranchCache` 和 `Client Hyper-V`。哪个版本支持所有这些功能？\n1. `Windows 8.1 RT`\n\
  2. `Windows 8.1`\n3. `Windows 8.1 Professional`\n4. `Windows 8.1 Enterprise` |\n\
  \n| **问:** 4. 你的客户想在他组织的所有计算机上安装 `Windows 8.1 Professional`。他想执行原地升级以尽地减少安装对员工的影响。以下哪些将不支持此升级；换句话说，哪些需要清洁安装？（请选择所有适用项。）\n\
  1. `Windows 7 Home Premium`\n2. `Windows 7 Enterprise`\n3. `Windows 7 Ultimate`\n\
  4. `Windows 7 Professional`（批量许可） |\n\n## 目标 1.2：安装 Windows 8.1\n\n有许多方法安装 8.1，也有许多需要考虑的情况。有升级，包括从\
  \ `Windows 7` 和 `Windows 8` 的原地升级，以及来自旧版本操作系统的有限升级。\n\n还有清洁安装，即在安装操作系统之前格式化硬盘。如果你需要在包含需要的数据计算机上进行清洁安装，你需要在开始之前备份数据。你可以选择将用户数据迁移出设备，执行清洁安装，然后将数据传回。在类似的情况下，你可以将数据从旧计算机迁移到新计算机。（迁移选项在目标\
  \ 1.3 中详细介绍）。\n\n在企业级，安装是自动化和定制的。从一台机器一台手动执行升级将极其耗时。虽然你在这里不会学习如何执行自动化安装或创建自定义的 `Windows\
  \ 8.1` 镜像（这个主题可以写好章节），但你将对其有一个高层次的理解。你可能会接受与自动化相关的通用知识测试。\n\n**本目标涵盖了如何：**\n\n*\
  \   执行手动安装和升级\n*   安装额外的 Windows 功能\n*   安装 Windows To Go 和到 VHD\n*   探索自定义 Windows\
  \ 8.1 安装\n\n\n\n\n大多数手动执行的安装程序都能顺利完成，无论是全新安装还是升级。向导程序会引导你完成必要的任务，并在你选择时允许你配置自己的磁盘和分区；计算机在需要时会自动重启，无需你手动操作；一旦过程完成，系统会提示你完成各种设置任务，以通过设置、账户信息、可用网络，甚至是启动屏幕颜色等选项对计算机进行个性化定制。但是，无论你选择哪种选项（全新安装或升级），在开始之前都应该始终备份用户数据。\n\
  \n## 更多信息：Windows 轻松传输 (Windows Easy Transfer)\n\nWindows Easy 传输 (`WET`) 在目标 1.3:\
  \ 迁移和配置用户数据 中概述，它是一种可以在重新安装计算机之前将用户配置文件信息、数据和设置迁移出的工具。你可以再次使用 `WET` 将数据写回。你还可以使用\
  \ `WET` 将数据从旧电脑传输到新电脑。因为它具有图形化界面并由向导引导，它是家庭用户和小企业的流行工具。在执行全新安装之前，考虑使用 `WET`。同样，用户状态迁移工具\
  \ (`USMT`) 也在目标 1.3: 迁移和配置用户数据 中被讨论。这种命令行迁移工具供大型机构使用。\n\n## 执行全新安装\n\n全新安装是在新计算机上安装\
  \ Windows `8.1` 的简单方法，或者是在你愿意擦除该分区上所有数据（格式化）的计算机或磁盘分区上安装。在备份完用户数据（如果适用）后，有两种启动方式：如果计算机上没有操作系统，你可以提供启动盘；如果计算机已有系统，你可以从\
  \ Windows `8.1` 安装文件启动计算机。在安装过程中，你可能会选择自定义安装选项，在该情况下，如果存在多个选项，你将选择在哪个分区上安装 Windows，或者根据情况创建和删除分区。\n\
  \n### 注意：单个分区和多引导系统\n\n你可以通过`磁盘管理` (Disk Management) 首先缩小分区，然后在其上创建一个新的简单卷，从而在仅有一个分区的计算机上创建多引导系统。然后，在\
  \ Windows `8.1` 的正常安装期间，使用`自定义安装`选项选择此分区。\n\n这些是在已安装操作系统的计算机上全新安装操作系统的步骤（在本章中你将看到一些相关的屏幕）。这是最简单的安装场景（将将\
  \ Windows `8` 计算机升级到 Windows `8.1` 除外）。\n\n1.  打开计算机，并将 Windows `8.1` 安装介质插入 DVD\
  \ 驱动器或 USB 端口。\n2.  如果出现提示，选择从 DVD 或 USB 驱动器（或其他可用介质）启动。如果计算机没有提供此选项，你必须重启计算机并按特定键（如\
  \ `F12` 或 `F2`）显示此提示。你选择的键由制造商指定。\n3.  选择你的语言、时区以及键盘或输入法，并点击`下一步`。\n4.  点击`立即安装`。\n\
  5.  勾选`我接受许可条款`复框并点击下一步。\n6.  选择`自定义：仅安装 Windows（高级）`。\n7.  从提供的列表中选择要安装 Windows\
  \ 的分区。如果需要且必要，点击`驱动器选项（高级）`来添加或删除现有分区。\n8.  等待安装完成。\n9.  完成设置过程以执行以下操作：\n    1.\
  \  同意许可条款。\n    2.  配置默认设置。\n    3.  登录你的账户。\n    4.  选择验证账户的方法。\n    5.  选择使用 `SkyDrive`（或不使用）。注意，`SkyDrive`\
  \ 名称将更改为 `OneDrive`，在某个时间点考试也会进行相应的术语变更。\n\n### 注意：自定义安装提供更多选项\n\n当你选择使用自定义安装安装\
  \ Windows 时，会看到“您想将 Windows 安装在何处？”选项。从那里，你可以选择可用分区，或点击`驱动器选项（高级）`来删除、格式化并创建新分区。\n\
  \n## 从 Windows 7 升级\n\n要将运行 Windows `7` 的计算机升级到兼容且可升级的 Windows `8.1` 版本，请执行以下步骤（取决于你安装的版本，你采取的步骤可能与这些略有）。这些是将\
  \ Windows `7` 旗舰版升级到 Windows `8.1` 企业版的步骤。\n\n1.  将 Windows `8.1` 安装盘插入 DVD 驱动器。\n\
  2.  点击`运行 Setup.exe` (图 1-5))。\n    ![运行 setup.exe 开始升级过程。](img/httpatomoreillycomsourcemspimages1988801.png.jpg)图\
  \ 1-5. 运行 `setup.exe` 开始升级过程。\n3.  在用户账户控制框中点击`是`。\n4.  选择`在线并安装更新（推荐）`按钮并点击`下一步`。\n\
  5.  勾选`我接受许可条款`复框并点击`接受`。\n6.  确认要保留的项目项目无误，并点击`下一步`。\n7.  点击`安装`。\n8.  安装完成后，完成设置过程。\n\
  \nWindows `8.1` 的设置过程需要你执行以下操作：\n*   同意许可条款。\n*   配置默认设置。\n*   登录你的账户。\n*   选择验证账户的方法。\n\
  *   选择使用 `SkyDrive`（或不使用）。\n\n安装和设置完成后，你将看到 Windows `8.1` 启动屏幕，如图 1-6 所示。\n![Windows\
  \ 8.1 启动屏幕。](img/httpatomoreillycomsourcemspimages1988803.png.jpg)图 1-6. Windows\
  \ 8.1 启动屏幕。\n\n## 从 Windows 8 升级\n\n要将 Windows `8` 升级到 Windows `8.1，前提是用户拥有零售版或\
  \ OEM 激活版的 Windows `8`。如果计算机是通过批量许可激活的，则在那里不会提供该更新。\n\n### 注意：Windows 8 到 Windows\
  \ 8.1 的升级选项\n\nWindows `8.1` 升级可以通过 Windows Store 或介质获得。注意，当你从 Windows Store 升级\
  \ Windows `8.1` 时，无法更改版本。从介质升级到不同版本的 Windows `8.1` 是支持的。但是，你可以在本章稍后介绍的那样，将 Windows\
  \ `8.1` 升级到 Windows `8.1` 专业版。\n\n从 Windows Store 安装 Windows `8.1`，请遵循以下步骤：\n\n\
  1.  在启动屏幕上，点击 Store。\n2.  点击更新 Windows `8.1` 的选项。\n3.  点击`下载`（见图 1-7)）。\n    ![从\
  \ Windows Store 下载 Windows 8.1。](img/httpatomoreillycomsourcemspimages1988805.png.jpg)图\
  \ 1-7. 从 Windows Store 下载 Windows `8.1`。\n4.  出现提示时，点击`立即重启`。\n5.  按照提示完成设置。\n\n\
  ### 考试技巧\n\n\n\n\n有时，你会被要求识别组策略（Group Policy）中特定设置的路径。组策略允许网络管理员向用户组分配特定权限以保护资源等（你将在本本书的多个章节中学习组策略）。这里有一个你可能会看到的示例：如果你想防止用户在任何情况下从\
  \ Windows 商店更新到 Windows 8.1 的选项，可以设置位于 `Computer\\Administrative Templates\\Windows\
  \ Components\\Store` 下的组策略 `Turn Off The Offer To Upgrade To The Latest Version\
  \ Of Windows`（关闭升级到最新版本的提示）。在尝试考试之前，请确保你熟悉组策略和常用的设置。有关此以及其他关于 Windows 8.1 常见问题的更多信息，请参考\
  \ `[`technet.microsoft.com/en-us/windows/jj721676.aspx`](http://technet.microsoft.com/en-us/windows/jj721676.aspx)`\
  \ 中的文章。\n\n## 从之前的 Windows 版本进行迁移\n\n你之前已经了解到，可以将 Windows XP 和 Windows Vista 机器升级到\
  \ Windows 8.1。执行安装的步骤与本目标中所述的相同。然而，你还了解到升级过程中并不是所有内容都会传输。如果你将 Windows XP 升级到 Windows\
  \ 8.1，只有用户的个人文件会被迁移。应用程序必须重新安装，Windows 设置必须重新创建。如果你将 Windows Vista 升级到 Windows 8.1，仅保留用户的个人文件和\
  \ Windows 设置，而应用程序必须重新安装。\n\n因此，在升级任何安装了 Windows XP 或 Windows Vista 的机器之前，你应该仔细且有规律地备份其上的数据。我之所以说仔细且有规律，是因为如果一台电脑那么老，用户数据可能无处不在，包括根驱动器、`Program\
  \ Files` 文件夹以及普通备份通常不会包含的其他地方。完成后，你就可以执行安装升级。\n\n然而，升级通常不是更好的选择。清洁安装可提供更可靠的结果。因此，如果有任何方法可以清洁安装而不是升级，你就应该选择它。在这种情况下，有几种迁移方案供选择。\n\
  \n### 在独立工作站上使用 Windows 易传输向导\n\n由于在执行清洁安装之前备份所有用户设置和配置文件信息是非常困难甚至是不可能的，最好的办法是使用迁移工具。迁移工具允许你备份文件、文件夹、Windows\
  \ 设置、配置文件设置等，然后在你在机器上安装 Windows 8.1 后，可以将该备份应用于重新填充机器。知道迁移选项的存在也使得你和你的客户更有可能选择执行清洁安装，这在处理较旧机器时始终是一个更好的选择。\n\
  \n要了解有关迁移选项，请参考本章中的 `Objective 1.3: Migrate and configure user data`。对于需要升级电脑数量有限的家庭用户和企业，请考虑\
  \ `Windows Easy Transfer Wizard`。对于规模较大的组织，请考虑 `User State Migration Tool`（用户状态迁移工具）。\n\
  \n### 在企业中实现安装自动化\n\n你还可以自动化安装。这是企业为数百或数千台工作站安装升级的方法。要实现自动化安装，你需要与微软签署 Windows 8.1\
  \ 批量许可协议。然后，首先你需要创建一个安装镜像并选择一种部署该镜像的方法。你可能有多个镜像，例如，一个镜像用于销售部门的所有计算机，另一个镜像用于库存部门的计算机，依此类推。你需要\
  \ `Microsoft Deployment Toolkit (MDT)`、`Windows Assessment and Deployment Kit (ADK)`、一个用于存放安装文件的服务器（作为共享），以及可以在部署期间启动计算机的介质，或者一个配置了\
  \ `Windows Deployment Services (WDS)` 角色的服务器（以及用于升级的 PC 上可以引导到安装镜像的网卡）。如果你准备好了所有这些，微软建议如果你的企业有\
  \ 200 到 500 台计算机，使用 `Lite-Touch, High-Volume Deployment strategy`（轻接触、大量部署策略）；如果你的企业有\
  \ 500 台或更多机器，则建议 `Zero-Touch, High-Volume Deployment strategy`（零接触、大量部署策略）。\n\n\
  关于镜像，镜像是一个自定义安装文件，可以包含设备驱动程序、应用程序、桌面背景特定设置等。镜像分为精简镜像（thin images）和厚镜像（thick images）。`thin\
  \ image`很少或没有自定义，大多数设备驱动程序、应用程序和更新都是在每台客户端计算机上使用其他方法安装的。`thick image` 应用程序、设备驱动程序和更新等，比精简镜像需要更多的规划、网络带宽和其他资源。微软在大多数情况下建议使用精简镜像，因为它可以减少安装时间、维护时间、存储需求和成本等。对于经验网络管理员来说，使用\
  \ `MDT` 配合 `Lite-Touch, High-Volume Deployment strategy` 使用精简镜像是非常直接的。更多信息请访问 `[`technet.microsoft.com/en-us/windows/dn282138`](http://technet.microsoft.com/en-us/windows/dn282138)`。\n\
  \n### 考试技巧\n\n在以前考试的考试版本以及与 Windows 7 相关的考试中，自动化安装是 `Objective 1` 的重要部分。然而，目标已经发生了很大变化，我们认为它们的权重可能没有以前那么大（如果还会涉及的话）。但是，你应该了解自动化安装的大体情况，以备不之需。\n\
  \n## 安装额外的 Windows 特性\n\n安装完成后，你可能需要或想要安装额外的 Windows 特性。有两个区域可以操作。你可以从 `Control\
  \ Panel` 安装 Windows 功能（这在技术上是开启而不是安装），你可以从微软购买额外的功能。你还可以为 Windows 8.1 配置额外的语言。\n\
  \n### 安装额外功能\n\n启用额外功能的一个地方是 `Control Panel`。如果你是 Windows 8.1 新手，可以点击屏幕左下角的 `Start`\
  \ 按钮快速进入。进入控制面板后，在“类别”（Category）视图下，点击 `Programs`，然后选择如图 1-8 所示的“启用或关闭 Windows 功能”。\n\
  \n![Turn Windows features on or off.](img/httpatomoreillycomsourcemspimages1988807.png)图\
  \ 1-8。\n\n你还可以为 Windows 8.1 添加它未包含的新功能。如果你已安装了 Windows 8.1，可以添加 `Windows 8.1 Pro\
  \ Pack`，这将让你获得 Windows 8.1 Pro 和 Media Center 的所有功能。如果你已经有了 Windows 8.1 Pro，只需添加\
  \ Media Center。要开始，在启动屏幕输入 **add features** 并在结果中点击 `Add features To Windows 8.1`（参见图\
  \ 1-9）。你也可以使用 Internet Explorer 访问 `[`windows.microsoft.com/en-US/windows-8/feature-packs`](http://windows.microsoft.com/en-US/windows-8/feature-packs)`。\n\
  \n![Add features to Windows 8.1.](img/httpatomoreillycomsourcemspimages1988809.png)图\
  \ 1-9。\n\n\n\n\n\n在点击 `Yes` 绕过“用户账户控制”框后，你将可以选择在线购买密钥或输入你已拥有的产品密钥。无论选择哪种，请按照提示购买并安装新功能。一旦安装完成（计算机将在安装期间重启），你将看到这些新功能。\n\
  \n## 为 Windows 配置其他语言\n\nWindows 8.1 包含对其他语言的支持。通过添加语言，你可以更改在 Windows、应用程序和网页上用于阅读和编写的语言。添加语言涉及五个步骤，每个步骤在本文的章节中都有概述。\n\
  \n### 添加语言\n\n要添加语言（使用你应当熟悉的 Windows 8.1 悬浮窗），请按照以下步骤操作：\n\n1.  将光标置于屏幕右下方或右上方，点击\
  \ `Settings`，然后点击 `Change PC Settings`。\n\n2.  点击 `Time And Language`，点击 `Region\
  \ And Language`，然后点击 `Add A Language`。\n\n3.  从列表中选择语言。如果出现另一个列表，点击所需的选项（参见图 1-10）。\n\
  \n    ![Sometimes a language has several options.](img/httpatomoreillycomsourcemspimages1988811.png.jpg)图\
  \ 1-10 某些语言有多个选项。\n\n### 下载并安装语言包\n\n为了在 Windows 和应用程序中使用你偏好的语言，你可能需要下载相应的语言包。要下载语言包，请按照以下步骤操作：\n\
  \n1.  从上一步继续，在右侧窗中点击你想要使用的语言。\n\n2.  某些语言（如 `English (United Kingdom)`）下方有 `Language\
  \ Pack Available`。如果是这样，点击 `Options`。\n\n3.  点击 `Download`。（这可能需要一些时间。）\n\n### 更改\
  \ Windows 显示语言\n\n要更改显示语言，请按照以下步骤操作：\n\n1.  从上一步继续，如果适用，返回到 `PC Settings` 中的 `Time\
  \ And Language`、`Region And Language` 部分。\n\n2.  点击要设为主要语言的语言。\n\n3.  点击 `Set As\
  \ Primary`。如果该语言可以作为你的 Windows 显示语言，你将在语言下方看到 `Will Be Display Language After Next\
  \ Sign-In`。\n\n4.  注销并重新登录以完成。\n\n### 切换键盘\n\n当你添加一种语言时，你可以用该语言输入。在此之前，你必须在键盘或输入法之间切换。最简单的方法是按\
  \ `Windows key + Spacebar`。你也可以通过任务栏上的语言缩写进行切换（参见图 1-11）。注意，任务栏显示的日期时间格式取决于所选语言的设置。\n\
  \n    ![Switch languages by using the taskbar.](img/httpatomoreillycomsourcemspimages1988813.png.jpg)图\
  \ 1-11 使用任务栏切换语言。\n\n### 为语言添加键盘布局\n\n最后，你需要为你的语言添加一种键盘布局，并可能将其设置为默认键盘。要为语言添加键盘布局，请按照以下步骤操作：\n\
  \n1.  打开 `Control Panel`，在 `Small Icons` 或 `Large Icons` 视图下，点击 `Language`。\n\n\
  2.  点击 `Advanced Settings`。\n\n3.  在 `Override For Default Input Method` 下，选择你想要作为默认键盘的键盘布局，然后点击\
  \ `Save`。\n\n## 安装为 Windows To Go 和到 VHD\n\n这里还有两种安装 Windows 8.1 的方法可供讨论。你可以将其作为\
  \ `Windows To Go` 进行安装，也可以将 Windows 8.1 安装到 `VHD` 中。你需要在任一实例中能够激活操作系统，因此在开始之前，请确保你拥有正确的激活代码（或批量许可）。\n\
  \n### 考试提示\n\n有时，你会被要求选择在命令提示符中执行某任务的正确语法。你可能在本文或其他你读过的其他书中从未见过或听过该命令。除了尝试背诵所有可用语法外，实际上没有办法可以为这类问题做准备，但这仍然是一个重要的提示。以下是一个你可能会看到的示例：可以使用什么命令来检查计算机的激活状态？答案是\
  \ `slmgr.vbs /dlv`。该缩写代表 (Windows) Server License Manager Script，`dlv` 代表 Display\
  \ License information (Verbose)，显示许可证信息（详细）。如果你从未听过某个命令，可以尝试猜命令中的字母可能代表什么，这样你可能得出一个合理的推断。\n\
  \n### 安装为 Windows To Go\n\n你可以给用户一个包含 Windows 8.1 企业版副本的 `Windows To Go` USB 闪盘。只要计算机可以配置为从\
  \ USB 闪盘启动，他们就可以使用此 USB 盘在自己的计算机之外运行 Windows。\n\nWindows To Go 有一些独特之处：\n\n*   你只能从基于\
  \ Windows 8 的企业版计算机创建 `Windows To Go` 驱动器。\n*   用于启动该驱动器的计算机必须符合 Windows 7 认证要求，但不必运行\
  \ Windows 7。\n*   `Windows To Go` 驱动器可以包含与企业工作站相同的镜像，并可以使用相同的方法进行管理。\n*   `Windows\
  \ To Go` 并不是桌面替代操作系统。\n\n要创建 Windows To Go 驱动器，你需要使用 `Windows To Go Creator`。你将拥有一个\
  \ `.wim` 文件，它可能位于网络共享、DVD 或 USB 驱动器上。`.wim` 文件包含可以挂载到 Windows 操作系统中的磁盘镜像。简单来说，是一种安装文件。这些文件允许用户在\
  \ Windows To Go 驱动器在内的多个平台上使用磁盘镜像。\n\n要创建 Windows To Go USB 闪盘，请按照以下步骤操作：\n\n1.\
  \  使用你的管理员凭据登录基于 Windows 8 的计算机。\n2.  插入 Windows To Go 认证的 USB 闪盘。\n3.  按 `Windows\
  \ key + W` 打开 `Search Settings`，输入 `Windows To Go,` 然后按 `Enter`。\n4.  如果出现“用户账户控制”对话框，点击\
  \ `Yes`。\n5.  在 `Choose The Drive You Want To Use` 页面，选择代表之前插入的 USB 驱动器，然后点击 `Next`。\n\
  6.  在 `Choose A Windows 8 Image` 页面，点击 `Add Search Location` 并定位 `.wim` 文件。\n7.\
  \  点击 `Select Folder` 然后点击 `Next`。\n8.  如果需要，勾选 `Use BitLocker With My Windows To\
  \ Go Workspace` 复选框并输入所需的密码和密码提示。\n9.  点击 `Create`。注意驱动器上的所有数据将被删除。\n10. 等待过程完成，这可能需要\
  \ 30 分钟。\n\n\n\n\n\nVHD 包含硬盘的全部内容，并存储在一个便携文件文件中，网络管理员可以使用它将整个虚拟机（VM）从一台主机计算机传输到另一台。VHD\
  \ 的功能与物理机上的硬盘工作原理完全相同。VHD 也可以长期存在于计算机上，而没有任何迁移的意图。在这种情况下，单台计算机（即使只有一个分区）也可以托管多个\
  \ VHD，所有这些 VHD 同时运行不同的操作系统，这使得网络管理员可以使用单台计算机轻松地在各种操作系统上进行软件测试。此类类型的 VHD 是在具有父操作系统的计算机上创建的，这意味着在托管\
  \ VHD 的计算机上安装了操作系统。`native-boot`（原生引导）VHD 是一种在没有父操作系统的情况下创建并运行的 VHD。Windows 8.1\
  \ 支持对这类类型的 VHD 进行原生引导。\n\n通常，VHD 用于在各种情况下测试应用程序和硬件，但使用它们的原因还有许多其他理由。在需要频繁重新安装操作系统的环境下，VHD\
  \ 非常有用，这不仅适用于测试环境，也适用于公共自助终端、学校计算机实验室、公共图书馆以及任何其他向游客开放或容易受到攻击的计算机。在人员流动率高的公司中，它们也有用，因为计算机可以很容易重新配置。当你需要重新安装\
  \ VHD 时，只需将主 VHD 复制回去，VHD 就会如新的一样。你可以使用 `DiskPart` 或 `磁盘管理控制台` 创建 VHD。\n\n在本组步骤中，你将使用\
  \ `磁盘管理控制台` 将 Windows 8.1 安装到 VHD 中。如果你有现有的 VHD，可以使用它，也可以在这里创建一个新的 VHD。在开始之前，你需要找到你的\
  \ Windows 8.1 安装媒体。你准备安装 VHD 的计算机也必须安装了 Windows ADK。你可以从 `http://www.microsoft.com/en-us/download/details.aspx?id=39982`\
  \ 下载 ADK。\n\n要创建 VHD 并在上面安装 Windows 8.1，请按照以下步骤操作：\n\n1.  在文件资源管理器中，右键点击`此电脑`，然后点击`管理`。\n\
  2.  在左窗格中，点击`磁盘管理`。\n3.  右键点击`磁盘管理` 并点击`创建 VHD`。查看图 1-12。\n    ![创建新的 VHD。](img/httpatomoreillycomsourcemspimages1988815.png.jpg)图\
  \ 1-12. 创建新的 VHD。\n4.  在`位置`框中，输入你想要创建的 VHD 的位置和名称。\n5.  在`虚拟硬盘大小`框中，选择`GB` 以避免计算错误，并在框中输入一个数字。查看图\
  \ 1-13。\n\n    ![配置新的 VHD。](img/httpatomoreillycomsourcemspimages1988817.png.jpg)图\
  \ 1-13. 配置新的 VHD。\n6.  在`虚拟硬盘格式`下，在阅读提供的信息后，选择 `VHD` 或 `VHDX`。\n7.  选择`固定大小`（推荐）或`动态扩展`。\n\
  8.  点击`确定`。\n9.  等待 VHD 创建。\n10. 右键点击新磁盘并点击`初始化磁盘`，如图图 1-14 所示。\n    ![初始化新磁盘。](img/httpatomoreillycomsourcemspimages1988819.png.jpg)图\
  \ 1-14. 初始化新磁盘。\n11. 选择 `MBR` 或 `GPT`，注意 `GPT` 不被所有旧版本的 Windows 识别，并点击`确定`。\n12.\
  \ 在`未分配`空间附近右键点击新磁盘并点击`新建简单卷`，如图图 1-15 所示。\n    ![在新磁盘上创建新的简单卷。](img/httpatomoreillycomsourcemspimages1988821.png.jpg)图\
  \ 1-15. 在新磁盘上创建新的简单卷。\n13. 点击四次`下`以接受新卷的默认设置，然后点击`完成`。\n14. 记住分配给新磁盘的驱动器号（我的是 `F`）。\n\
  15. 在你的计算机上找到 Windows ADK。最好的方法是打开文件资源管理器并搜索 `Windows ADK`。\n16. 右键点击`部署和映像工具环境`的快捷方式并点击`以管理员身份运行`。\n\
  17. 在命令提示符处，输入以下命令（如图图 1-16](#ch01.html_apply_the_image_to_the_new_vhd \"图 1-16.\
  \ 将映像应用到新的 VHD.\")所示），并按回车：\n    ```\n    Dism /apply-image /imagefile:<path to.wim>\
  \ /index:1 /ApplyDir:F:\\\n    ```\n    ![将映像应用到新的 VHD。](img/httpatomoreillycomsourcemspimages198823.png.jpg)图\
  \ 1-16. 将映像应用到新的 VHD。\n18. 完成后，在命令提示符处输入以下命令：\n    ```\n    bcdboot F:\\windows\n\
  \    ```\n19. 在任何时候，右键点击 VHD 并点击`分离`（如果需要）。\n\n### 考试提示\n确保你熟悉 ADK 中的工具。部署和服务管理\
  \ (DISM) 是你可以用于应用、捕获、删除和导出映像的工具。这个新的命令行工具取代了 `ImageX`，所以如果你在答案中看到该命令，它可能是干扰项。参考此处文章了解更多关于\
  \ DISM 的信息：[`www.microsoft.com/en-US/library/hh8258.aspx`](http://www.microsoft.com/en-US/library/hh8258.aspx)。\n\
  \n### 自定义 Windows 8.1 安装\n网络管理员经常创建自定义 Windows 8.1 安装文件，以便包含设备驱动程序、软件、更新、自定义壁纸和屏幕保护。你可以添加这些内容以减少安装后必须执行的工作。创建自定义安装涉及许多步骤，这里提供了一个高层概述。\n\
  \n要创建自定义安装，你需要下载并安装 Windows ADK。ADK 包含了你执行所需任务的工具。你还需要一台参考计算机，你将其设置以代表组织中的典型计算机。你还需要一台测试计算机来测试从参考计算机创建的安装映像、一个用于创建\
  \ Windows PE 磁盘的空 USB 盘或 CD，以及一个用于创建安装文件所需的外部存储设备。\n\n准备完成后，你需要执行：\n\n*   在网络上创建一个共享以存放安装文件和其他与\
  \ Windows 8.1 部署相关的文件。\n*   创建参考计算机……（使用 `Sysprep /generalize` 唯一标识。你可能会添加其他命令行选项如\
  \ `/oobe`）。\n*   为映像准备参考计算机……（使用 `Copype.cmd` 创建 Windows PE 启动磁盘，并带有正确的命令行选项如 `c:\\\
  winpe`）。\n*   使用 `Oscdimg.exe` 将 Windows PE 文件封装成扇区映像文件。\n\n\n\n\n\n**4. 捕捉参考计算机的映像，生成映像文件。**\
  \ 使用此文件，你可以根据需要安装任意数量的工作站并将映像应用到所有工作站，从而实现统一化。你将使用这些命令：\n\n* `DISM` 配合命令行选项（包括 `/capture-image`）来捕捉计算机硬盘的映像。\n\
  * `Net use` 配合命令行选项（例如类似 `z: \\\\server\\share`）来指定存储文件的网络共享位置。\n\n**5. 创建答案文件以部分自动化安装，或创建无人值答案文件以完全自动化安装过程中提出的问题回答。**\
  \ 你将使用的工具包括 `Windows System Image Manager`（`SIM`；在 `Windows ADK` 中可用），用于选择映像并创建和应用答案文件。\n\
  \n**6. 使用 `Windows PE` 磁盘或计算机可以从服务器下载的启动映像来启动目标计算机。**\n\n**7. 应用参考计算机映像以创建你的复制工作站。**\
  \ 这包括复制和应用所需的映像等操作。\n\n## 思考实验：在家庭办公室升级计算机\n\n在思考实验中，请运用你学到的相关目标知识。你可以在本章末的“答案”部分找到这些问题的解答。\n\
  \n一名家庭用户在家里维护办公室。他的五台计算机包括：一台运行 `Windows 7`，一台运行带有 `SP1` 的 `Windows Vista`，一台运行\
  \ `SP3` 的 `Windows XP` 以及两台运行 `Windows 8`。他喜欢 `Windows 8` 并希望将这台计算机升级到 `Windows\
  \ 8.1`，为了连续性，他还想将其他计算机也升级到 `Windows 8.1`。他没有域，不是特别精通电脑，并且不想在五台计算机升级到 `Windows 8.1`\
  \ 后需要重新配置其中任何一台。你运行了硬件和软件兼容性测试，决定除 `Windows XP` 以外的所有设备都可以成功升级。`Windows XP` 机器有一长串兼容性问题，包括硬盘满和显适配器不兼容。\n\
  \n回答以下关于升级过程的问题：\n\n1. 哪些计算机只需要你备份数据并执行更新？\n2. 在需要迁移的计算机上，你会使用 `Windows Easy Transfer`\
  \ 还是 `User State Migration Tool`？为什么？\n3. 你应该如何处理那台 `Windows XP` 机器？\n\n### 目标总结\n\
  \n* 你可以升级 `Windows XP`、`Windows Vista` 和 `Windows 7` 计算机，但在 `Windows XP` 和 `Windows\
  \ Vista` 的情况下你无法保留所有内容。\n* 你可以从`控制面板` 和微软安装额外功能。`Windows Media Center` 和 `Windows\
  \ 8.1 Pro Pack` 是后者提供的选项。\n* 你可以更改 Windows 在应用程序、窗口和其他区域使用的语言，并配置匹配的键盘。\n* 你可以将\
  \ `Windows 8.1` 安装为 `Windows To Go` 并放入 `VHD`。\n\n### 目标回顾\n\n回答以下问题以测试你对该目标信息的掌握程度。你可以在本章末的“答案”部分找到这些问题的答案以及对每个选项正确或错误的解释。\n\
  \n| **问:** | 1. 如果你选择将 `Windows 7` 计算机升级到 `Windows 8.1`，可以保留哪些类型的数据和文件？如果选择将 `Windows\
  \ XP` 计算机升级到 `Windows 8.1`，可以保留哪些类型的数据和文件？ <br>1. 文件、设置、应用程序；文件和设置<br>2. 文件、设置、应用程序；文件<br>3.\
  \ 文件、应用程序；无<br>4. 文件、设置；个人文件 | |\n\n| **问:** | 2. 下列哪些是执行 `Windows 8.1`清洁安装的有效方法？（选择所有适用项）\
  \ <br>1. 启动到 `Windows To Go` USB 盘<br>2. 从安装 DVD 运行 `Install.exe`<br>3. 使用可访问且兼容的映像文件<br>4.\
  \ 从共享且可访问的网络文件夹运行 `Setup.exe` | |\n\n| **问:** | 3. 关于 `Windows To Go`，以下哪项是正确的？（选择所有适用项）\
  \ <br>1. `Windows To Go` 驱动器只能从 `Windows 8.1 Enterprise` 创建。<br>2. 使用 `Windows To\
  \ Go` 时，默认启用休眠和睡眠。<br>3. 你可以在任何 32 GB 或更大的 USB 盘上安装 `Windows To Go`。<br>4. `Windows\
  \ To Go` 默认阻止对本地驱动器的访问。 | |\n\n| **问:** | 4. 你可以使用以下哪些工具创建新的 `VHD`？（选择所有适用项） <br>1.\
  \ `Windows PE`<br>2. `DiskPart`<br>3. `磁盘管理`<br>4. `SysPrep` | |\n\n## 目标 1.3: 迁移并配置用户数据\n\
  \n在执行任何类型的安装任务之前，用户拥有你需要备份的数据。他们拥有的的不止数据；还有他们计算机独特的设置，包括桌面壁纸、应用程序设置和偏好、计算机睡眠的配置，甚至还有任务栏外观或`通知区域`中显示哪些内容的设置。如果你正在升级\
  \ `Windows 7` 或 `Windows 8` 计算机，你可以保留所有这些设置以及用户的个人文件，但这种安装只是许多场景之一。正如你已经学到的，从 `Windows\
  \ XP` 或 `Windows Vista` 到 `Windows 8.1` 没有直接升级路径。此外，你无法使用普通的备份工具有效地备份和恢复所有这些设置和数据。为了成功升级这些操作系统同时维护用户数据，你需要使用数据迁移工具。\n\
  \n在本节中，你将学习两种迁移工具。第一个是 `Windows Easy Transfer` (`WET`)，这是一个最适用于家庭用户、小型办公室用户以及工作站数量有限的地方迁移数据的工具。第二个是\
  \ `User State Migration Tool`（属于 `MDT` 部分）。该工具最适用于在大型企业中迁移数据的资深管理员。你还将学习文件夹重定向和各种类型的配置文件，这两者对大型组织都非常重要。在学习迁移选项后，你将学习如何更改文件的默认存储位置以及各种类型的配置文件。\n\
  \n**本目标涵盖了如何：**\n\n* 使用 `Windows Easy Transfer` 迁移数据\n* 探索 `User State Migration\
  \ Tool`\n* 配置文件夹重定向\n* 配置配置文件\n\n### 重要提示：备份、备份、备份！\n\n在任何迁移或安装之前，务必备份数据。事情可能会且确实会出错，防患于未然。\n\
  \n### 使用 Windows Easy Transfer\n\n在需要迁移数据时，需要考虑两种场景。第一种是用户想要将一台当前运行 `Windows XP`\
  \ 或 `Windows Vista` 的单机升级到 `Windows 8.1`。这种类型的迁移被称为“擦除加载”（wipe-and-load），因为这就是你所做的；你把数据从硬盘迁移并存储在其他地方，然后格式化（擦除）硬盘并安装（加载）新的操作系统。对于擦除加载迁移，你需要一个临时存储数据的地方，直到可以将其迁回。这通常是一个网络驱动器或外部硬盘。\n\
  \n另一种迁移场景是用户获取了新计算机并并将数据从旧计算机迁移到新计算机。这被称为“并排迁移”（side-by-side migration），因为这就是你拥有的；有一台带有数据的旧计算机放在（物理上或虚拟上）你想传输数据的新计算机旁。。你可以直接连接这些计算机以传输数据。通常这涉及使用\
  \ `Windows Easy Transfer` 线缆连接这两个设备。然而，你也可以通过这种方法通过网络将文件、设置、账户等迁移到另一台计算机。\n\n\n\n\
  你可以通过 Windows 传输向导（Windows Easy Transfer Wizard）实现迁移，可以从旧电脑开始，也可以在适用的情况下从新电脑开始。如果你有一台已经运行\
  \ Windows 8.1 的新电脑，你可以在启动屏幕上输入 `migwiz` 来开始。不过，系统会提示你转到旧电脑并在那里运行 `WET`，所以从何处开始其实并不重要。如果你只有一台电脑，有几种启动\
  \ Windows 传输的选项：\n\n*   在 Windows Vista 中，点击“开始”->“所有程序”->“辅助程序”->“系统工具”，然后点击“Windows\
  \ 传输”。点击“下一步”继续。\n*   在 Windows XP 中，找到“入门指南”文件夹并点击“传输您的文件”。\n*   或者，你也可以在下处的物理安装介质上找到\
  \ `WET`，路径为：`E:\\support\\migwiz`（假设 `E` 是你的 DVD 刻驱器器符）。\n\n无论你选择哪种方案，一旦启动了 Windows\
  \ 传输，你就可以开始迁移过程。向导将引导你完成整个迁移流程。这里有很多场景，因为关于数据保存位置、保存内容以及是从旧电脑开始、新电脑开始还是升级单台电脑，都有各种选项。我不会在这里涵盖每个场景，而是将列出你在按照向导提示操作时将遵循的通用流程。记住，你需要一个空间来存储收集的文件，直到你能够传输它们或建立好用于传输的网环境。\n\
  \nWindows 传输向导会要求提供以下信息：\n\n*   你将如何执行传输（直接连接到另一台电脑、使用外部硬盘或通过网络）。\n*   这台电脑是旧电脑还是新电脑。\n\
  *   如果你通过网络传输文件，你需要记录下给出的代码，以便在提示时在 `host PC` 上输入。\n*   传输什么。你可以接受默认值（`defaults`），也可以选择自定义想要传输的用户账户和文件的部分。如果你选择默认值，你将传输几乎与用户相关的所有内容。\n\
  \n### 重要：仅传输你需要的内容\n\n如果有大量数据需要移动，迁移可能会花费大量时间。与其传输所有内容，不如仔细选择要传输的文件。你可能不想传输下载的电影、播客、有声书或其他可能不需要的大文件。\n\
  \n### 探索用户状态迁移工具\n\n`USMT` 是一个可以编写脚本的命令行工具，你可以用它将用户数据从之前的 Windows 版本迁移到 Windows\
  \ 8.1。通过使用 `USMT`，你可以复制选定的用户数据（排除任何不需要迁移的数据），然后在电脑纯净安装 Windows 8.1 后，将数据传回电脑。你也可以将数据传输到一台全新的或新安装的\
  \ Windows 8.1 电脑。这与使用 Windows 传输类似。然而，尽管 `USMT` 具有与 `WET` 相同的基本功能，但 `USMT` 是命令行工具而\
  \ `WET` 是图形化的。这在大型组织中并不是劣，因为管理员可以使用 `USMT` 将 `USMT` 任务整合到脚本中，这更适用于域、企业和自动化部署。（脚本、任务序列、答案文件等可以帮助自动化部署。）包含在\
  \ `USMT` 中的两个两个工具是 `ScanState` 和 `LoadState`，它们都是命令行工具。\n\n当你使用 `USMT` 时，还会使用 Windows\
  \ 预安装环境（`Windows PE`）。你需要了解一点 `Windows PE` 才能理解 `USMT` 的工作原理，所以让我们从这里开始。\n\n###\
  \ 考试提示\n\n`Windows PE` 和 `USMT` 包含在 `Windows ADK` 中；你可能需要了解这一点以便根据给定场景选择正确的解决方案。此外，你可能会在考试中看到一个关于\
  \ `ScanState`、`LoadState` 及其相关参数的题目。要了解这两个命令可用的参数，请参考 [`http://technet.microsoft.com/en-us/library/hh825256.aspx](http://technet.microsoft.com/en-us/library/hh825256.aspx)\
  \ 提供的 `USMT 技术参考` 表。\n\n### 探索 Windows PE\n\n启动过程多年年来发生了变化。当 `Windows ME` 淘汰时，`MS-DOS`\
  \ 也随之淘汰。Windows 8、Windows 7 和 Windows Vista 不再在安装和启动的任何部分依赖 `MS-DOS`。为了取代它，Windows\
  \ 使用 `Windows PE`。`Windows PE` 是一个精简操作系统，你可以用它为 Windows 安装准备电脑，它可以启动没有操作系统（或存在其他问题）的电脑。在部署\
  \ Windows 8.1 时，可以使用 `Windows PE` 进行分区和格式化硬盘、将磁盘镜像复制到电脑，并从网络共享启动 `Windows Setup`。你可以使用\
  \ `ADK` 中的工具创建 `Windows PE` 磁盘。关于 `USMT`，你使用自定义的 `Windows PE` 引导盘启动源电脑（持有要迁移文件的电脑），并使用磁盘上的可用工具收集你想要迁移的数据。\n\
  \n### 考试提示\n\n`Windows PE` 可以帮助你将自定义的 Windows 8.1 镜像部署到电脑。它还可以帮助你创建磁盘分区和格式化硬盘，但重要的是，它可以帮助从网络共享启动安装。还有一种名为\
  \ Windows 恢复环境（`Windows RE`）的东西。`Windows RE` 构建自 `Windows PE`，这是合理的。两者都协助安装（以及恢复）。`Windows\
  \ PE` 相比 `MS-DOS` 提供了以下改进和优势（当你阅读此列表时，请考虑这些项目对自动化和自定义操作系统部署的重要性）：\n\n*   原生 32 位支持（MS-DOS\
  \ 是 16 位的操作系统）。\n*   原生 32 位和 64 位驱动支持，与完整的 Windows 安装相同。\n*   内部网络支持。\n*   内部 NTFS\
  \ 支持。\n*   脚本语言支持，适用于 Win32 应用程序接口（`API`）、Windows 管理规范（`WMI`）、Windows 数据组件（`DAC`）、HTML\
  \ （`HTAs`）以及 Windows Script。管理员可以编写比 MS-DOS 批处理更健壮的脚本。\n*   多种启动选项，包括 CD、DVD、USB\
  \ 设备、硬盘磁盘、网络共享和 Windows 部署服务（`WDS`）服务器。\n*   支持离线会话和镜像维护。\n*   包含 Hyper-V 驱动程序（显示驱动除外），这允许\
  \ `Windows PE` 在虚拟机中运行。支持存储、鼠标集成网络适配器。\n\n### 考试提示\n\n除了 `Windows PE` 和 `USMT`，`ADK`\
  \ 中还包含其他你可能听过但在此处不会讨论的工具：应用程序兼容性工具包（`ACT`）、各种部署工具包括 `DISM` 命令行工具、`DISM` PowerShell\
  \ cmdlet、`DISM` API、Windows 系统映像（`Windows SIM`）和 `OSCDIMG`。`ADK` 还包括卷激活工具（`VAMT`）、Windows\
  \ 性能工具包（`WPT`）、Windows 评估工具和 Windows 评估服务。确保你熟悉这些工具。概述可在 [`http://msdn.microsoft.com/en-us/library/hh825486.aspx](http://msdn.microsoft.com/en-us/library/hh825486.aspx)\
  \ 获取。\n\n`Windows PE` 有各种限制，但不限于以下内容：`Windows PE` 在 72 小时后重启，因此不能作为长期操作系统使用；它确实支持\
  \ `TCP/IP` 和 `NetBIOS over TCP/IP`，但不支持其他方法，例如互联网数据包交换/顺序数据包交换（`IPX/SPX`）网络协议；`Windows\
  \ PE` 不支持通过 Windows 安装程序（`.msi` 文件）封装的应用程序；而且它不支持跨平台场景，例如在 32 位电脑上安装 64 位 Windows\
  \ 镜像（等）。\n\n\n\n\n## 更多信息：Windows PE\n\n访问 *[www.msdn.com](http://www.msdn.com)*\
  \ 并在搜索框中输入 **什么是 Windows PE?** 以查找相关的技术信息。\n\n### 探索 USMT\n\nUSMT 提供了高度可定制的用户配置文件迁移体验。如前所述，USMT\
  \ 包含两个独特的命令行工具：`ScanState.exe` 和 `LoadState.exe`。您可以使用这些工具从宿主计算机上收集并恢复用户数据。另一个命令行工具\
  \ `UsmtUtils` 可用于继续操作之前验证您收集的数据是否损坏。USMT 还包含一组三个可自定义的 `.xml` 文件——`MigApp.xml`、`MigDocs.xml`\
  \ 和 `MigUser.xml`——您可以使用这些文件来定制迁移。您可以创建自己的 `.xml` 文件来支持您的迁移需求。您将将使用 `Config.xml`\
  \ 文件来进一步定制迁移，并从迁移中排除特定文件。\n\n以下是您在 ADK 中配合 USMT 一起使用的工具说明：\n\n* `ScanState.exe`。使用此工具指定要从源计算机迁移哪些数据（并将其迁移到迁移存储库）。您可以选择文件、设置和账户信息等。\n\
  * `UsmtUtils`。使用此工具验证迁移存储库数据是否损坏、从迁移存储库中提取压缩文件、删除由于共享锁无法删除的硬链接存储库，并为您的迁移确定加密选项。\n\
  * `LoadState.exe`。使用此工具将您通过 `ScanState.exe` 导出的数据导入目标计算机。\n* `MigUser.xml`。使用此文件详细说明要迁移哪些用户账户。\n\
  * `MigDocs.xml`。使用此文件详细说明要迁移的文档和文件。\n* `Custom.xml`。使用此文件创建一个自定义文件以迁移额外的文件和数据，或修改默认的迁移行为。\n\
  * `Config.xml`。使用此文件从迁移中排除某些项。您可以使用 `ScanState.exe` 命令配合 `/genconfig` 选项创建此文件。\n\
  \n在非常高的层面，迁移涉及的过程包括但不限于决定迁移什么内容。您可能需要迁移账户信息、应用程序设置、操作系统设置、个人文件和文件夹以及注册表键。您还需要确定在哪里存储从每台计算机收集的数据（这被称为迁移存储库）。您还将修改或创建\
  \ XML 文件来修改迁移行为并排除您不想传输的文件。您可能还会使用 MDT 将迁移任务整合到名为任务序列（task sequence）的安装脚本中；任务序列可用于在极少或无交互的情况下执行整个迁移、安装和数据恢复。\n\
  \n无论您在规划阶段决定了什么，当您准备好执行迁移时，您将使用以下命令以及相应的参数来执行迁移（这是一个层级概述）：\n\n1. 在技术人员计算机上安装 Windows\
  \ ADK。\n2. 修改 `Config.xml` 文件以包含用户组成员。\n3. 如果需要，创建一个可选的 `Offline.xml` 文件，以包含如果目标计算机上存在额外驱动器如何处理它们的信息。\n\
  4. 将自定义的 USMT 文件和工具拷贝到 USB 闪存器（或网络共享）。\n5. 如果适用，挂起 BitLocker 并使用 Windows PE 启动源计算机。启动到共享更为复杂，但确实可行。\n\
  6. 在源计算机上使用 `ScanState` 命令收集文件和设置并将其保存到迁移存储库。\n7. 在目标计算机上安装 Windows 8.1 和其他应用程序。\n\
  8. 将 USMT 文件拷贝到目标计算机，然后运行 `LoadState` 命令将保存的文件和设置应用到新计算机。\n\n### 考试提示\n\n您将被验证某些命令行选项的特定\
  \ `ScanState` 和 `LoadState` 语法。这些语法通常很晦涩，或者至少看起来如此。请在 *[`technet.microsoft.com/en-us/library/hh825093.aspx`](http://technet.microsoft.com/en-us/library/hh825093.aspx)*\
  \ 查看 `ScanState` 语法，并在 *[`technet.microsoft.com/en-us/library/cc766226(v=WS.10).aspx`](http://technet.microsoft.com/en-us/library/cc766226(v=WS.10).aspx)*\
  \ 查看 `LoadState` 语法。\n\n## 配置文件夹位置\n\n在域中，用户通常不会将文件存储在工作站上。相反，他们将文件存储在文件服务器上。这提供了极大的安全性，因为文件和文件夹可以定期备份，访问可以进行全局控制并仅限于需要的人员，并且用户在离开工作站时可以几乎从任何计算机访问数据。此外，计算机可以快速重新映像，因为用户数据和配置文件信息存储在工作站之外；不需要进行完全迁移。此外，如果用户丢失了笔记本电脑，存储在文件服务器上的数据不会随之丢失；数据在中央服务器上是安全的。通常，这种配置会配合其他技术使用，例如\
  \ BitLocker、漫游用户配置文件、离线文件，甚至与通过各种形式的安全连接从互联网访问域服务器数据相关的技术。在企业中，重定向数据保存位置涉及将工作站连接到\
  \ Active Directory 域并创建组策略。\n\n在 Windows 8.1 工作站上，您可以配置类似的内容。要在 Windows 8.1 上配置文件夹位置，请遵循以下步骤：\n\
  \n1. 打开文件资源管理器并找到要重定向到新位置的文件夹。\n2. 右键点击文件夹并选择“属性”。\n3. 点击“位置”选项卡，如图 17 所示。\n4. 点击“移动”。\n\
  5. 在“选择目标”对话框中，导航到要使用的文件夹。\n6. 点击“选择文件夹”。\n7. 注意属性对话框中的新位置。\n8. 点击“确定”。\n\n![配置默认文件夹保存数据的新位置。](img/httpatomoreillycomsourspimages198825.png.jpg)图\
  \ 17. Configure a new location for saving data in default folders.\n\n9. 当提示“是否要将旧位置中的所有文件移动到新位置？”时，如图\
  \ 18 所示，点击“是”、“否”或“取消”（视情况而定）。\n10. 如果适用，再次点击“确定”以关闭属性对话框。\n\n\n\n\n用户配置文件由用户的个人文件夹、库数据、用户特定注册表设置、桌面背景、Internet\
  \ Explorer 收藏夹以及各种应用程序设置和计算机配置等组成。用户首次登录计算机时（无论是单台计算机、工作组中的计算机还是域中的计算机），系统会自动配置用户配置文件，并且在用户每次登录时都会重新加载。传统的配置文件有三种类型：本地（Local）、漫游（Roaming）和强制（Mandatory）。但在\
  \ Windows 8 和 Windows 8.1 中，出现了一种新型配置文件。让我们先来看这种。\n\n## 探索和配置 Microsoft 账户配置文件\n\
  \n从 Windows 8 开始，鼓励用户使用 Microsoft 创建并登录他们基于 Windows 8 的新计算机。这种 Microsoft 账户实际上是一种新型受限用户配置文件。应用时，用户配置的一部分将存储在（同步到）云端并保存在那里。当用户使用相同账户登录到同一台计算机或任何其他计算机时，只要有\
  \ Internet 连接以获取最新的保存配置，配置文件就会自动下载并应用。这意味着用户配置的很大一部分会随计算机移动。\n\n同步到云端并包含在配置文件中的某些项目包括开始屏幕背景颜色、屏幕磁贴和磁贴布局；锁屏和账户图片；桌面主题、任务栏设置、Web\
  \ 浏览器收藏、打开的标签页和历史记录；语言偏好；易访问设置等。使用 Windows Store、SkyDrive、日历和其他基于 Windows 8 的功能也需要\
  \ Microsoft 账户。图 1-19 显示了一些可以同步的设置。\n\n![使用 Microsoft 账户时，无论用户登录到哪台计算机，用户配置的一部分都是可用。](img/httpatomoreillycomsourcemspimages1988829.png.jpg)图\
  \ 1-19。使用 Microsoft 账户时，无论用户登录到哪台计算机，用户配置的一部分都是可用。\n\n您的客户可能不想将所有内容都同步到云端。要更改使用\
  \ Microsoft 账户同步到云端的内容，请遵循以下步骤：\n\n1. 打开 PC 设置。\n2. 在 PC 设置主界面上，点击 `SkyDrive`。\n\
  3. 点击 `Sync settings`（同步设置）。\n4. 根据需要移动滑块以配置要同步的内容。\n\n## 理解本地用户配置文件\n\n本地用户配置文件是应用到单台计算机的配置文件。该配置文件定义了计算机中的用户，包括文件夹保存在哪里以及应用了哪些设置。如果您有多个用户访问单台计算机，且他们都有自己的用户账户，那么每个用户都有他们自己的配置文件。\n\
  \n典型用户拥有以下文件夹来存放数据：\n\n* AppData\n* Contacts\n* Desktop\n* Downloads\n* Favorites\n\
  * Links\n* My Documents\n* My Music\n* My Pictures\n* My Videos\n* Saved Games\n\
  * Searches\n\n关于本地用户配置文件没有更多需要了解的。更改将在用户下次登录时生效。\n\n## 配置漫游用户配置文件\n\n漫游用户配置文件是存储在服务器上的用户配置副本。因此，无论用户登录到哪台计算机，配置文件都可用。漫游用户配置文件默认禁用。在工作场所，特别是在\
  \ Active Directory（活动目录）中，您必须启用漫游配置文件（参见图 1-20）。\n\n![配置漫游配置文件。](img/httpatomoreillycomsourcemspimages198831.png.jpg)图\
  \ 1-20。配置漫游配置文件。\n\n### 考试提示\n\n由于用户必须访问配置文件，请确保您频繁备份。以下是漫游用户配置文件的应用方式：\n\n1. 用户首次登录时，配置文件从服务器复制到本地驱动器。\n\
  2. 当用户注销时，更改将复制回服务器。\n3. 会话期间进行的任何更改都将保存到网络。\n4. 在下次登录时，仅从服务器复制配置文件中发生变化的部分。\n\n\
  ## 理解强制配置文件\n\n强制用户配置文件是用户无法更改的漫游配置文件。使用强制配置文件，尽管用户可以在会话期间进行更改（例如更改桌面），但更改不会被保存。该配置文件是只读的。用户下次登录时，原始配置文件将重新应用。网络管理员可以创建一个强制配置文件并将其应用于多个用户。要创建强制配置文件，您必须找到包含漫游配置文件的文件夹。然后您必须将该文件的名称从\
  \ `Ntuser.dat` 改为 `Ntuser.man`。\n\n## 思考实验：处理 BYOD\n\n在这一思考实验中，应用您在本目标中学学的知识。您可以在本文末尾的“答案”部分找到这些问题的答案。\n\
  \n您是一个 2012 Active Directory 域的网管理员。所有 20 台客户端计算机都运行 Windows 8 专业版。您的其中一名用户购买了自己的电脑并带到公司工作，它也运行\
  \ Windows 8 专业版。您批准了这台计算机并将其加入域。但出现了一些问题：\n\n1. 登录域后，该用户无法访问其个人数据。您应该做什么？\n2. 您希望用户通常保存到“文档”文件夹的数据改为保存到网络上的共享文件夹。您应该做什么？\n\
  3. 用户希望她的本地用户配置文件随她在计算机之间移动。您应该做什么？\n\n## 目标复\n\n回答以下问题以测试您对本目标信息的掌握情况。这些问题的答案以及每个候选项正确或错误的解释，可以在本文末尾的“答案”部分找到。\n\
  \n**1. 三个家庭成员共享一台计算机。他们的所有文档都保存在同一个“文档”文件夹中，图片、视频和音乐也是如此。他们的所有数据混合在一起，这导致了问题。您确定他们都在使用同一个用户配置文件。为了解决这个问题，您首先应该做什么？**\n\
  1. 为每个默认文件夹配置新的文件夹位置。\n2. 为每个用户配置漫游用户配置文件。\n3. 为每个用户账户设置密码。\n4. 为每个用户创建一个用户账户。\n\
  \n**2. 运行 Windows 易传输向导时，您必须处理哪些内容？（选择所有适用项）**\n\n\n\n\n\n1. 你将如何进行传输（直接链接到另一台计算机、外部硬盘或通过网络传输）\n\
  2. 你想要包含哪些类型的任务序列\n3. 这台电脑是旧电脑还是新电脑\n4. 你想传输什么\n5. 本地用户配置文件存储在何处\n\n**问:** 3. 当分配了强制用户配置的用户更改桌面背景和屏幕保护程序时，会发生什么？\n\
  \n1. 当用户注销时，更改将保存到用户配置文件，因为更改个性化选项是可以接受的。\n2. 用户无法进行此类更改，因此问题本身是无效的。\n3. 用户注销时，更改不会保存到用户配置文件中。\n\
  4. `Ntuser.man` 文件被重命名为 `Ntuser.dat`。\n\n**问:** 4. 在哪里配置文件夹位置？\n\n1. 默认文件夹属性对话框的“位置”选项卡\n\
  2. 默认文件夹属性对话框的“共享”选项卡\n3. 在 PC 设置中，SkyDrive 的“同步设置”选项卡上\n4. 从文件资源管理器选择映射网络驱动器\n\n\
  ## 本章总结\n\n- Windows 8.1 有四个版本：Windows RT、Windows 8.1、Windows 8.1 专业版和 Windows 8.1\
  \ 企业版。每个版本都有其自己的功能。\n- 了解哪些功能是 Windows 8.1 专业版和 Windows 8.1 企业版共有的非常重要，这样你可以为企业客户选择合适的操作系统。\n\
  - 你可以进行升级，但保留用户文件、Windows 设置和应用程序的原位升级只能从 Windows 7 和 Windows 8 执行。\n- 存在各种工具来帮助企业规划、测试和部署\
  \ Windows 8.1，包括但不限于 Windows 部署工具包 (Windows ADK)、微软部署工具包 (MDT) 和应用程序兼容工具包 (ACT)。\n\
  - 当应用程序与 Windows 8.1 不兼容时，你可以尝试使用程序兼容模式来强制兼容。\n- 你可以使用包括 Windows ADK 在内的各种工具在大型企业中实现安装自动化。你将使用\
  \ `Sysprep`、`DISM`、`ScanState` 和 `LoadState` 等工具。\n- 答文件可以回答安装过程中提出的问题，而无需用户输入。\n\
  - Windows To Go 让用户通过 USB 闪存随身携带 Windows。\n- 你可以在 VHD 上安装 Windows 8.1。Windows 8.1\
  \ 支持启动到原生 VHD。\n- 你可以使用 Windows 迁移和用户状态迁移工具 (USMT) 迁移用户数据。前者适用于少量计算机；后者更适用于大型组织。\n\
  - 你可以使用文件夹位置更改数据的默认保存位置。\n- 用户配置文件定义了计算机的用户，共有三种用户配置文件：本地、漫游和强制。微软账户提供了一种新类型的受限用户配置文件。\n\
  \n## 答案\n\n本节包含本章思维实验的解决方案以及客观复习习题的答案。\n\n### 目标 1.1：思维实验\n\n1. 你会建议使用 Windows 8.1\
  \ 专业版，因为它可以加入域。Windows 8.1 无法加入。由于批量许可要求，Windows 企业版不是一个选项。Windows RT 预装在平板电脑和类似设备上，而不是工作站上，所以你无法选择它。你会选择\
  \ 32 位，因为你知道所有计算机都支持它，而且你可以从 Windows Vista 升级（尽管你必须安装服务包 1 及其应用程序）。如果你选择 64 位，你将需要更多的测试，并且可能还需要硬件升级，这会增加成本。\n\
  2. 你将首先开始设置测试机来代表网络上的所有计算机。如果有五个不同的计算机制造商，你至少需要五台测试机。在执行测试升级之前，你需要为 Windows Vista\
  \ 安装服务包 1。你还需要测试数据库程序，如果该程序证明有问题的，你可能需要尝试在程序兼容模式下运行它，或者如果它尚未托管在服务器上，则将其托管在服务器上。根据这些测试，在发布升级之前可能需要更多的规划。\n\
  3. 因为有来自五个不同计算机制造商的计算机，全新安装可能是最好的。你至少可以减少由隐藏恶意软件、不必要的临时文件和数据碎片引起的问题，并最大限度地减少从桌面设置、个人文件、不必要文件等带来的差异。通常情况下，只要可行，无论什么情况下全新安装都是最好的。\n\
  \n### 目标 1.1：复习\n\n1. **正确答案：** C 和 D\n    - **错误：** Windows Vista SP1 在升级期间可以保留个人文件和\
  \ Windows 设置。没有 SP1 的 Windows Vista 无法升级。\n    - **错误：** Windows XP SP3 在升级期间只能保留个人文件。\n\
  \    - **正确：** Windows 7 家庭高级版可以保留个人文件、Windows 设置和应用程序。\n    - **正确：** Windows 8\
  \ 可以保留个人文件、Windows 设置和应用程序。\n2. **正确答案：** A、C 和 D\n    - **正确：** 硬盘必须至少有 20 GB 的可用磁盘空间。它只有\
  \ 16 GB。\n    - **错误：** 处理器兼容频率为 1 GHz。\n    - **正确：** 屏幕分辨率至少为 1024 x 768。需要升级某些内容才能使其兼容。\n\
  \    - **正确：** 安装 64 位操作系统需要需要 2 GB 内存。\n3. **正确答案：** D\n    - **错误：** Windows 8.1\
  \ 支持所有功能的版本是 Windows 8.1 企业版。\n    - **错误：** Windows 8.1 支持所有功能的版本是 Windows 8.1\
  \ 企业版。\n    - **错误：** Windows 8.1 支持所有功能的版本是 Windows 8.1 企业版。\n    - **正确：** Windows\
  \ 8.1 支持所有功能的版本是 Windows 8.1 企业版。\n4. **正确答案：** B 和 D\n    - **错误：** Windows 7 家庭高级版可以升级到\
  \ Windows 8.1 专业版。\n    - **正确：** Windows 7 企业版无法升级到 Windows 8.1 专业版。（但它可以升级到 Windows\
  \ 8.1 企业版。）\n    - **错误：** Windows 7 旗舰版可以升级到 Windows 8.1 专业版。\n    - **正确：** Windows\
  \ 7 专业版（批量许可）无法升级到 Windows 8.1 专业版。\n\n### 目标 1.2：思维实验\n\n1. 你会选择 Windows 7 和 Windows\
  \ 8。\n2. 因为只有五台计算机，最好使用 WET。USMT 适用于需要进行大规模自动化部署的管理员，而这种情况并非如此。\n3. 在这样一台老旧计算机上尝试升级硬盘和显卡是不明智的。最好的选择是从计算机中复制数据并保存到需要的地方。这可以是在其他计算机上、外部硬盘或\
  \ CD 和 DVD 上。你仍然可以使用这台 Windows XP 机器，直到它不再运行为止。\n\n### 目标 1.2：复习\n\n1. **正确答案：**\
  \ B\n    - **错误：** Windows XP 升级时无法保留文件和设置，只能保留文件。\n    - **正确：** Windows 7 升级到\
  \ Windows 8.1 时可以保留文件、Windows 设置和应用程序。从 Windows XP 升级到 Windows 8.1 时，只能保存个人文件。\n\
  \    - **错误：** Windows 7 升级到 Windows 8.1 时可以保留文件、Windows 设置和应用程序。从 Windows XP 升级到\
  \ Windows 8.1 时，只能保存个人文件。\n\n\n\n\n\n4. **错误：** Windows 7 可以升级到 Windows 8.1，同时保留文件、设置和应用程序。当从\
  \ Windows XP 升级到 Windows 8.1 时，只能保存个人文件。\n\n2. **正确答案：** C 和 D\n\n1. **错误：** 你无法从\
  \ Windows To Go 驱动器在 Windows 8.1 上执行安装。Windows To Go 是在 USB 驱动器上的 Windows，具有移动性。\n\
  2. **错误：** 正确的文件名是 `Setup.exe`，而不是 `Install.exe`。\n3. **正确：** 这是安装 Windows 8.1 的有效方法。\n\
  4. **正确：** 这是安装 Windows 8.1 的有效方法。\n\n3. **正确答案：** A 和 D\n\n1. **正确：** Windows To\
  \ Go 驱动器只能使用 Windows 8 或 Windows 8.1 企业版创建。\n2. **错误：** 使用 Windows To Go 时，默认禁用休眠和睡眠。\n\
  3. **错误：** USB 驱动器必须兼容 Windows To Go。\n4. **正确：** 出于安全考虑，Windows To Go 默认阻止对本地驱动器的访问。\n\
  \n4. **正确答案：** B 和 C\n\n1. **错误：** Windows PE 用于使用精简版操作系统启动计算机，通常用于安装或修复操作系统。\n\
  2. **正确：** `DiskPart` 是用于创建 VHD 的有效命令行工具。\n3. **正确：** `Disk Management`（磁盘管理）是用于创建\
  \ VHD 的有效图形化工具。\n4. **错误：** `SysPrep` 是在提取参考计算机镜像之前使用的工具，用于删除如激活 ID 等个性化信息。\n\n\
  ### 目标 1.3：思维实验\n\n1. 使用 WET 将用户的本地配置文件传输到其域配置文件。\n2. 配置文件夹位置。\n3. 配置漫游用户配置文件。\n\
  \n### 目标 1.3：复习\n\n1. **正确答案：** D\n\n1. **错误：** 为默认保存文件夹选择不同的位置，只会更改它们的保存位置。你无法为一个文件夹配置三个不同的地方。\n\
  2. **错误：** 漫游用户配置文件用于域。这并不能解决问题。\n3. **错误：** 如果你为每个用户创建账户，你就可以为这些账户设置密码来保护它们。\n\
  4. **正确：** 你需要为每个用户创建一个账户。当每个用户首次登录时，将创建一个用户配置文件。然后，每个用户都将拥有自己的安全空间来保存个人文件，文件不会混合在一起。（你还需要将现有文件移动到正确的文件夹中。）\n\
  \n2. **正确答案：** A、C 和 D\n\n1. **正确：** 你必须在迁移之前说明你将如何存储和传输数据。\n2. **错误：** 任务序列（Task\
  \ sequences）是 USMT 的一部分，此处不适用。\n3. **正确：** 因为你可以从旧计算机也可以从新计算机开始，所以这是一个必须回答的有效问题。\n\
  4. **正确：** 你必须说明你想传输什么内容。\n5. **错误：** 用户配置文件会自动包含，不需要手动列出。\n\n3. **正确答案：** C\n\n\
  1. **错误：** 强制用户配置文件不允许对配置文件的执行的任何更改被保存。\n2. **错误：** 用户可以在会话期间进行更改，但这些更改不会保存到强制用户配置文件中。\n\
  3. **正确：** 这是正确的行为。\n4. **错误：** 这种情况不会发生。这两个术语指的是如何使漫游用户配置文件变为强制，但它们并不是双向的。\n\n\
  4. **正确答案：** A\n\n1. **正确：** 这是正确的选项页和对话框。\n2. **错误：** 位置是在文件夹的 `Properties` 对话框的\
  \ `Location` 标签页上配置的。\n3. **错误：** 位置是在文件夹的 `Properties` 对话框的 `Location` 标签页上配置的。\n\
  4. **错误：** 位置是在文件夹的 `Properties` 对话框的 `Location` 标签页上配置的。\n\n# 第二章 配置硬件和应用程序\n\n\
  在目标 1“安装并升级到 Windows 8.1”之后，安排目标 2“配置硬件和应用程序”是非常合适的。无论部署规模大小，这可能都是你在安装 Windows 8.1\
  \ 之后立即要要做的事情。\n\n在本章中，你将学习各种各种方法来安装和管理设备及其驱动程序，并控制对它们的访问。你还将学习如何管理用户对 Windows Store\
  \ 的访问。在执行这些操作的同时，你将探索一些组策略，包括专门为 Windows 8 和 Windows 8.1 创建的新选项和设置。你还将发现如何结合组策略来管理、控制和保护\
  \ Internet Explorer 11。最后，你将学习如何配置 Hyper-V（技术上称为客户端 Hyper-V），它允许你在一台计算机上运行多个虚拟机。\n\
  \n**本章学习目标：**\n\n* [目标 2.1: 配置设备和设备驱动程序]\n* [目标 2.2: 安装和配置桌面应用和 Windows Store 应用]\n\
  * [目标 2.3: 控制对本地硬件和应用程序的访问]\n* [目标 2.4: 配置 Internet Explorer 11 和桌面版 Internet Explorer]\n\
  * [目标 2.5: 配置 Hyper-V]\n\n## 目标 2.1: 配置设备和设备驱动程序\n\n设备驱动程序和计算机硬件是密不可分的。每个都需要对方才能正常工作。很久以前，大多数设备都带有自己的设备磁盘，用于安装相应的驱动程序，但现在驱动程序的安装通常是自动的。在大多数情况下，所需的设备驱动程序位于\
  \ Windows 8.1 驱动程序存储（计算机本身）或 Windows Update（互联网），并且从那里获取的驱动程序运行良好。然而，偶尔也会出现问题。这发生在没有兼容的\
  \ Windows 8.1 设备驱动程序、已安装的驱动程序运行不正常，或驱动程序未通过微软硬件认证计划批准（因此未签名）的情况下。\n\n**本目标涵盖了如何：**\n\
  \n* 使用设备管理器安装和管理驱动程序\n* 配置设备\n* 使用 `Sigverif.exe` 管理未签名驱动程序\n* 使用 `Pnputil.exe`\
  \ 管理驱动程序存储\n* 创建驱动更新策略\n\n### 使用设备管理器安装和管理驱动程序\n\n你使用设备管理器来查看、安装、卸载、禁用和其他管理硬件设备。你可以从多个地方访问设备管理器，包括右键点击单击按钮并在生成的列表中点击“设备管理器”。你也可以在计算机管理控制台的系统工具节点下找到它。默认情况下，列表按图\
  \ 2-1 所示的各种设备类型组织，但还有其他的查看和排序选项。\n\n\n\n\n你可以展开 `Device Manager` 中的任何节点，以查看与所选设备族相关的已安装设备。在图\
  \ 2-2 中，你可以看到`Monitors`显示器条项仅列出一项，而`Network Adapters`网络适配器则有多个项。你可以右键点击任何项并选择`Properties`属性，来查看其驱动程序等信息。对于像即插显示器这样的简单设备，你可能只看到四个选项卡（常规、驱动程序、详细信息和事件），但对于网络适配器等更复杂的设备，可能会看到更多，这些设备也在这图\
  \ 2-2 中显示。\n\n![展开任何节点，右键点击所需的设备，并点击属性访问属性对话框。](img/httpatomoreillycomsourcemspimages1988835.png.jpg)图\
  \ 2-2。展开任何节点，右键点击所需的设备，并点击属性访问属性对话框。\n\n此外，`Device Manager`提供了四个菜单，你可以使用它们来处理任何已安装的设备：\n\
  \n*   `File`文件。你的配置文件包含存储你对控制台更改信息的文件。你可以从此菜单的`Options`删除这些文件。\n*   `Action`操作。此菜单允许你访问多个命令，包括`更新驱动程序`、`禁用``卸载``扫描硬件更改``添加旧硬件``属性`和`帮助`。\n\
  *   `View`查看。此菜单允许你更改在`Device Manager`中查看设备的方式。你可以按类型或连接查看设备，或按类型或连接查看资源。你还可以选择显示隐藏设备并自定义控制台。\n\
  *   `Help`帮助。此菜单提供访问来自 TechCenter 网站在内的各种位置帮助主题的权限。\n\n### 考试提示\n\n如果你遇到一种场景，即你在\
  \ `Device Manager` 中更改了设备驱动程序、添加了硬件、更新了驱动程序或执行了相关任务，但没有看到更改，你应该点击`Action`，然后点击`扫描硬件更改`。你也可以按\
  \ `F5` 键刷新屏幕。\n\n需要注意的是，`Action`菜单中提供的几乎所有选项在设备的`Properties`属性对话框中，或在右键点击项时出现的选项中也可用。例如，`更新驱动程序`、`禁用`和`卸载`在`驱动程序`选项卡上均可用。\n\
  \n当你需要访问按类型设备列表之外的其他选项时，可以更改`Device Manager`的默认视图。你通过`View`菜单访问这些视图。其中一个选项是`显示隐藏设备`。在某些时候，你可能需要查看隐藏设备来排除某些晦疑故障。\n\
  \n除此之外，你还可以选择以其他方式更改视图：\n\n*   `按连接查看设备`。此视图在查看连接到虚拟机的设备内容时非常有用，它是根据计算机中各种设备的连接方式进行组织。。你可以通过右键点击（或双击）来查看这些设备的`Properties`属性对话框。你可能会在这里找到有用的信息，例如设备何时配置的、驱动程序何时安装并启动的等。\n\
  *   `按类型查看资源`。使用此选项按它们与其他类型系统资源的连接方式来查看资源：`直接内存访问 (DMA)`、`输入/输出 (IO)`、`中断请求 (IRQ)`和`内存`。只有经验丰富的系统管理员才在此处更改，因为失误可能会导致系统无法运行。在执行任何操作之前，考虑搜索`Device\
  \ Manager`发现的冲突。\n*   `按连接查看资源`。当你想通过`DMA`、`IO`、`IRQ`和`内存`查看设备硬件资源以诊断和修复问题时，此视图非常有用。在执行任何操作之前，考虑搜索`Device\
  \ Manager`发现的冲突。\n\n如果你由于认为资源之间存在某种冲突而需要排除硬件故障，最好按照以下步骤查看`Device Manager`是否知道任何冲突：\n\
  \n1.  在`Device Manager`中，选择所需的视图，即`按类型查看资源`或`按连接查看资源`。\n2.  双击怀疑的设备。\n3.  点击`资源`选项卡。\n\
  4.  检查`冲突设备列表`中的条目。参见图 2-3\n5.  点击`确定`关闭。\n\n![让设备管理器确定冲突。](img/httpatomoreillycomsourcemspimages1988837.png.jpg)图\
  \ 2-3。让设备管理器确定冲突。\n\n尽管驱动程序还有很多需要学习，包括管理未签名驱动程序、在启动时禁用驱动程序签名、管理`驱动程序存储`中的驱动程序，甚至配置定义由谁可以安装什么类型驱动程序的`组策略`，但我们这里没有足够的空间进行详细介绍。然而，这里的内容足够让你入门，我们建议你利用`TechNet`上的资源以及互联网上其他可靠的资源继续学习。\n\
  \n### 考试提示\n\n与其他软件安装一样，你不能为 64 位资源使用 32 位驱动程序。你无法使用 64 位驱动程序与 32 位资源进行通信。\n\n###\
  \ 安装和卸载\n\n当驱动程序没有自动安装或由`Windows Update`提供时，有多种方法可以安装。其中一种是响应`Action Center`的提示。虽然这是驱动问题的终端用户解决方案，但不一定是网络管理员解决方案，但在与家庭用户交互时仍然是一个选项。`Action\
  \ Center`可以自动发现问题并搜索解决方案，当发现解决方案时，它会提供给你。\n\n安装驱动程序的另一种方法是从制造商网站下载，然后双击包含驱动程序的执行文件。你必须手动执行；没有自动化任务为你执行。\n\
  \n### 考试提示\n\n更新的驱动程序不会通过计费连接下载。考试中可能会出现基于此场景的问题。要预料有时一个简单的答案（如“用户位于计费连接”）可能会通过包含大量不必要信息的复杂场景提出来。\n\
  \n最后，你可以使用`Device Manager`。由于设备可能已经安装了驱动程序，即使它工作不正常，大多数情况下也会选择更新驱动程序。开始之前，在`Device\
  \ Manager`中定位设备（尝试`查看 > 按类型查看`）并双击设备。在`驱动程序`选项卡上，点击`更新驱动程序`。在`更新驱动程序软件`对话框中，选择定位驱动程序的方法。如果是你下载并保存到计算机上的，点击`浏览我的计算机查找驱动程序`。否则，点击`自动搜索更新的驱动程序`，它将在所有通常的地方自动查找。如果你认为从`Windows\
  \ Update`可以获得驱动程序，后者是一个很好的选择。\n\n\n\n一旦你找到了驱动程序，就可以对其进行安装。如果一切顺利，驱动程序将会被更新。然而，有时\
  \ Windows 会对你的请求返回一条消息，说明已安装最佳驱动程序（或找不到驱动程序），从而导致意之外的复杂情况。如果 Windows 认为最佳驱动程序已安装，或者你仍然想安装自己的驱动程序，可以从`设备管理器`中的`属性`对话框中，选择卸载驱动程序，并确保勾选了图\
  \ 2-4 所示“删除设备的驱动程序软件”复选框（否则，Windows 将继续重新安装它）。\n\n### 重要：手动卸载有问题的设备驱动程序\n\n有时，即使你告诉\
  \ Windows 删除设备软件，你在`设备管理器`中选择扫描新硬件时，该软件仍会继续重新安装自己。当发生这种情况时，你必须使用 `Pnputil.exe` 命令行工具手动删除驱动程序（本节稍后会详细介绍），并配合\
  \ `-f` 和 `-d` 选项。\n\n![如有必要，删除现有的驱动程序文件以防止 Windows 再次尝试更新驱动程序。](img/httpatomoreillycomsourcemspimages1988839.png.jpg)图\
  \ 2-4。如有必要，删除现有的驱动程序文件以防止 Windows 再次尝试更新驱动程序。\n\n### 现实世界：安装旧硬件\n\n在许多组织中，遗留硬件在完成工作方面仍然起着非常重要的作用。它可能是一个旧打印机、一个红外设备，甚至是一个调制解调器。这些硬件可能无法自动检测。`设备管理器`中有一个选项可以帮助你安装此类设备。要这样做，请插入你拥有的设备任何安装介质，然后按照以下步骤操作：\n\
  \n1. 打开`设备管理器`。在`操作`选项卡上，点击“添加旧设备硬件”。\n2. 在“欢迎”页面上点击“下一步”，然后选择以下选项之一：\n    * `搜索并自动安装这些硬件`（推荐）\n\
  \    * `从列表手动选择要安装的硬件`\n3. 按照后续提示进行操作。这可能涉及为打印机选择端口、从列表中选择设备或做出其他选择。\n\n安装完成后，你可以在`设备管理器`中管理该设备。\n\
  \n### 禁用和回滚\n\n你用于禁用和排故障驱动程序的方法与更新它们的方法类似。在设备`属性`对话框的`驱动程序`选项卡上有一个“禁用”选项。当你禁用设备时，你将其关闭。这与卸载设备不同。当设备关闭时，Windows\
  \ 无法使用它也不会尝试重新激活它。相反，如果你卸载了显卡或音频驱动程序，在大多数情况下，Windows 会重启时重新安装该设备。你可能想禁用设备以确定特定设备是否导致了系统冲突或问题。此外，你还可以禁用运行异常或不再需要的设备以释放系统资源。\n\
  \n某些情况下，在旧驱动程序上安装新驱动程序引起的问题比解决的问题多。在这种情况下，你可以回滚驱动程序。不过，“回滚驱动程序”按钮仅在你安装了第二个驱动程序后才可用；否则它是灰色的。\n\
  \n### 考试提示\n\n重要的是要理解设备驱动程序回滚功能只能回滚到之前安装的驱动程序。因此，如果你安装了驱动程序 A，然后安装驱动程序 B，接着安装驱动程序\
  \ C，那么当你回滚驱动程序 C 时，它只会回滚到驱动程序 B（而不是原始驱动程序 A）。\n\n### 配置设备\n\n安装适当的驱动程序后，你现在可以配置已安装的设备了。就像\
  \ Windows 8.1 中的几乎任何任务一样，有多种方法可以实现此操作。我想在这里介绍两种：`设备和打印机`和`设备阶段`。虽然两者都是消费者和最终用户工具，但对网络管理员可能很有用。\n\
  \n### 使用设备和打印机\n\n`设备和打印机`可以通过`控制面板`或通过`开始`屏幕搜索访问，它提供了一个查看连接设备的地方，包括打印机、鼠标、多媒体设备、传真机等。你可以立即判断某个设备是否存在已知问题，因为它的上方会有一个感叹号。你可以右键点击列出的任何设备来配置设备偏好、创建快捷方式、对设备进行故障排除并查看设备的`属性`。\n\
  \n根据快捷菜单中点击的内容，你可以为所选设备配置各种设置和偏好。例如，如果你点击任何已安装打印机的`打印机属性`，你可以访问的不仅仅是选择是否要双面打印或打印测试页。你还可以配置以下内容（以及其他内容）：\n\
  \n* `共享`。使用此选项选择是否共享打印机并在客户端计算机上渲染打印作业。你也可以选择为需要这些驱动程序的其他工作站提供额外的驱动程序。\n* `端口`。使用此选项添加、删除和配置打印机连接的端口。你还可以在此处启用打印机池和双向支持。\n\
  * `安全`。使用此选项选择允许或拒绝访问打印机的组或用户。\n\n这是访问设备属性并配置这些设备的快速方法，但`设备和打印机`真正的闪光之处在于它能够轻松地添加无线打印机和其他无线设备（甚至是蓝牙设备）。你无法在`设备管理器`中执行操作。一旦找到这些设备，将显示`Internet\
  \ 协议 (IP)`或`介质访问控制 (MAC)`地址（或唯一标识符）。\n\n使用`设备和打印机`窗口添加设备，请按照以下步骤操作：\n\n1. 使用任何方法打开`设备和打印机`。\n\
  2. 点击“添加设备”。\n3. 在列表中选择设备并点击“下一步”。参见图 2-5\n![使用设备和打印机窗口添加有线、网络和无线设备。](img/httpatomoreillycomsourcemspimages198841.png.jpg)图\
  \ 2-5。使用设备和打印机窗口添加有线、网络和无线设备。\n4. 等待驱动程序安装并完成设置。新设备将出现在`设备和打印机`窗口中。\n5. 在`设备和打印机`窗口中，右键点击新设备访问配置选项。你可以点击`属性`查看设备的唯一标识和其他数据。\n\
  \n### 考试提示\n\n不要让自己错失考试上简单的题目！你可能会被问及如何在工作站上以最小努力安装无线打印机，因此请确保你理解`设备和打印机`窗口的功能。\n\
  \n### 使用设备阶段\n\n有时你可以通过双击`设备和打印机`窗口中的设备在`设备阶段`中访问它。然而，根据我的经验，`设备阶段`打开已安装设备的频率越来越低。双击打印机通常打开打印队列，而不是`设备阶段`。双击蓝牙耳机会打开其`属性`对话框。只有极少数情况下设备才会打开`设备阶段`，但为了涵盖，图\
  \ 2-6 显示了无线鼠标的设备阶段。你可以看到有下载软件、查找解决方案甚至注册鼠标的选项。尽管如此，此功能似乎正在逐渐消失。\n\n\n\n\n\n![Device\
  \ Stage 提供了另一种访问设备属性的方法。](img/httpatomoreillycomsourcemspimages1988843.png.jpg)\n\
  图 2-6。Device Stage 提供了另一种访问设备属性的方法。\n\n如果设备驱动程序被不实实的编程人员植入了隐藏的恶意软件，可能会损坏计算机。因此，有一项技术会对驱动程序进行测试、批准并签名，以验证它们是安全的，并且在测试和批准过程完成后未被更改。一旦通过批准，驱动程序将由批准的机构（通常是信任的组织或发布者）进行数字签名。该签名使用加密算法创建并附加到设备驱动程序中。这确保了你在获取驱动程序时它是真实且安全的，因为算法经过过验证。\n\
  \n未签名的驱动程序可能会导致各种计算机问题，特别是那些难以诊断的问题。你可以使用命令行工具 `Sigverif.exe` 检查计算机上是否安装了未签名的驱动程序。要执行此检查，请按照以下步骤操作：\n\
  \n1. 右键点击“开始”按钮并点击`命令提示符 (管理员)`。\n2. 在命令提示符处，输入 `sigverif.exe` 并按 Enter。\n3. 点击`开始`运行`文件签名验证`，然后查看结果。参见图\
  \ 2-7。\n4. 点击`关闭`（图中未显示）。\n\n![使用命令 Sigverif.exe 检查计算机上是否有任何未签名的驱动程序。](img/httpatomoreillycomsourcemspimages1988845.png.jpg)\n\
  图 2-7。使用命令 `Sigverif.exe` 查看计算机上是否有任何未签名的驱动程序。\n\n如果你发现未签名的驱动程序，你可能可以查看这些驱动程序的路径，以确定它们保存在何处，以及它们可能是为哪个设备安装的或被引用的。这可能帮助你发现是哪个设备导致了难以诊断的系统问题。\n\
  \n### 更多信息：了解更多关于数字签名\n\n关于数字签名和已签名驱动程序的更多信息，请参阅 MSDN 文章：`[http://msdn.microsoft.com/en-us/library/windows/hardware/ff543743(v=vs.85).aspx]`。\n\
  \n那么，未签名的驱动程序是如何进入系统的？大多数情况下，它们要么是由计算机制造商安装的，要么是由终端用户安装的。如果 Windows 怀疑驱动程序被篡改过或知道驱动程序未签名，用户将收到提示，在许多情况下，可以选择仍然安装它。\n\
  \n以下是针对未签名驱动程序提供的三个消息：\n\n*   **此无法验证此驱动程序的发布者**：要么没有数字签名，要么签名未经过信任机构（授权签名的组织或发布者）验证。如果你必须安装该驱动程序，请确保它来自设备制造商并从制造商的网站下载。\n\
  *   **此驱动程序已更改**：驱动程序已通过信任机构验证，但之后已被更改。受保护的校验和（存储在设备中的、取决于内容的值）与预期不符。它可能被故意更改以包含恶意软件，也可能被制造商更改。如果你必须安装该驱动程序，请确保它来自设备制造商并从制造商的网站下载。\n\
  *   **Windows 无法安装此驱动程序**：Windows 8.1 64 位操作系统不会安装自验证以来已更改的设备驱动程序，或完全未验证的驱动程序。可以绕过这些数字签名要求，但你必须在`高级模式`下重启计算机。\n\
  \n如果没有办法解决无法安装未签名驱动程序的问题，你可以禁用数字签名，重启计算机，并使用`PC 设置`中的`更新和恢复`选项卡下的`恢复选项`强制安装它。如图图\
  \ 2-8 所示，在`高级启动`下，点击`立即重启`。\n\n![要禁用驱动签名，你必须在高级模式下重启计算机。](img/httpatomoreillycomsourcemspimages1988847.png.jpg)\n\
  图 2-8。要禁用驱动签名，你必须在高级模式下重启计算机。\n\n在图 2-8 所示显示的屏幕上点击`立即重启`后，按照以下步骤操作：\n\n1. 点击`疑难解答`。\n\
  2. 点击`高级选项`。\n3. 点击`启动设置`。\n4. 点击`重启`。\n5. 计算机重启进入启动菜单后，按键盘上的`7`。（计算机将重启。）\n\n现在你可以根据需要安装未签名的驱动程序了。完成后，正常重启机器。\n\
  \n### 考试提示\n\nWindows 8.1 64 位操作系统默认阻止安装未签名的驱动程序。这可能是某个大问题所需的答案，例如关于在域内设备安装的场景，且对组策略未进行任何更改等。\n\
  \n### 使用 Pnputil.exe 管理驱动程序存储\n\nWindows 8.1 包含一个驱动程序存储（Driver Store），用于存放经过测试和批准并已数字签名的设备驱动程序。驱动程序存储可以通过\
  \ Windows Update 和其他方式更新。当你连接设备时，Windows 首先在此处查找。如果找不到，它会搜索 Windows Update。这种方法在大多数情况下都有效，但有时\
  \ Windows 会安装它认为最好的驱动，且无法通过设备管理器或其他方法卸载、更新或成功删除驱动文件。\n\n如果你知道某个设备存在这种情况，可以在连接设备之前手动安装驱动程序。为此，你需要在提升权限的命令提示符中使用\
  \ `pnutil.exe` 命令。你还可以使用该命令管理驱动程序存储，包括添加、删除和列出驱动包。驱动包包含安装驱动所需的所有数据，包括但不限于：\n\n*\
  \   驱动文件：通常是扩展名为 `.sys` 的动态链接库 (DLL)。\n*   安装文件：这些文件具有 `.inf` 扩展，包含安装信息。\n*   驱动目录文件：与安装文件一起包含，包含与数字签名相关的信息。\
  \ `.cat` 文件。\n*   其他文件：可能是图标、设备属性页，甚至是安装向导相关的项。\n\n`pnputil.exe` 命令的语法是输入 `pnputil.exe\
  \ –a <驱动程序路径> <drivername>.inf`。以下是需要考虑的一些参数：\n\n*   -a 指定驱动程序 `.inf` 文件的路径\n* \
  \  -d 删除特定的 `.inf` 文件\n*   -f 强制删除特定的 `.inf` 文件\n\n如果你想查看 DriverStore 文件夹，导航到 `C:\\\
  Windows\\System32\\DriverStore\\FileRepository`。\n\n### 重要：更新新驱动程序的选择\n\n\n\n\n\n\
  关于更新驱动程序，有两种流派的观点。你要么追求最新、最强大的，要么想要维持现状（如果没坏，就不要修它）。然而，在现实世界中，你并不总是能决定如何处理某个驱动程序。有时，驱动程序是作为\
  \ `Windows Update` 的一部分安装的，你可能并不知道自己选择了安装它。如果发生了这种情况，你将需要使用 `Device Manager` 回滚驱动程序，然后打开\
  \ `Windows Update`，找到有问题的更新并将其卸载。然后，你应该隐藏该更新，以防止它在下次检查时再次被安装。通用步骤如下（在在 `Device Manager`\
  \ 中回滚了驱动程序之后）：\n\n1. 打开 `Windows Update`。\n2. 点击`查看更新历史`。\n3. 点击`已安装更新`。\n4. 选择该更新并点击`卸载`。点击`卸载`进行确认，然后在弹出提示时点击`关闭`。\n\
  5. 返回 `Windows Update`（双击后退箭头）并找到你刚刚卸载的更新。\n6. 取消选择该更新。\n7. 右键点击该更新并选择`隐藏更新`（参见图\
  \ 2-9)）。\n\n![隐藏你不想安装的更新。](img/httpatomoreillycomsourcemspimages1988849.png.jpg)图\
  \ 2-9. 隐藏你不想安装的更新。\n\n## 创建驱动程序更新策略\n\n在与大量用户和计算机协作时，让用户自行负责安装驱动程序更新是不安全的。作为网络管理员，你需要通过创建驱动程序策略来控制驱动程序更新的情况。你可能会实施一种驱动程序策略，在某些设备出现故障之前，不允许任何人安装任何设备驱动程序。你的驱动程序策略也可能完全相反，理由是由于驱动程序通常能解决问题、提供新功能，甚至提高设备性能，因此所有更新（在经过测试后）都应该安装。但通常情况下，这并非非黑即白的。你会测试并安装某些更新，而对另一些更新则不担心。\n\
  \n无论你如何决定，都应该建立一个测试实验室（即使很小），在部署设备驱动程序之前对其尝试。此外，为了保险起见，你应该选择在驱动程序发布几周后才安装，这样如果存在任何问题，可以由制造商来解决。你还应该针对未签名驱动程序或在安装期间出现提示的驱动程序制定规则。\n\
  \n你还可以应用 `Group Policy` 来管理用户在驱动程序安装方面可以的操作。在这里你将体验到一个可以更改的项：默认情况下，只有 `Administrators`\
  \ 组的成员被允许在系统上安装新的设备驱动程序。如果你在 `Group Policy` 中启用此项，那么 `Users` 组的成员就可以为你指定的设备设置类安装新驱动程序。如果你禁用它（或不进行配置），则只有\
  \ `Administrators` 组的成员才可以在系统上安装新的设备驱动程序。除了你在这里看到的`驱动程序安装`节点外，还有其他设置可以探索，正如你将在接下来的步骤中看到的那样。\n\
  \n要了解如何应用组策略来控制本地计算机上的驱动程序安装，请按照以下步骤操作：\n\n1. 打开`本地组策略编辑器`。如果你不熟悉此功能，可以在开始屏幕输入 `gpedit.msc`\
  \ 并点击结果列表中的第一个 `gpedit` 条目。\n2. 展开以下节点：`计算机配置`、`管理模板`、`系统`和`驱动程序安装`。\n3. 双击`允许非管理员为这些设备设置类安装驱动程序`（参见图\
  \ 2-10)）。\n\n![探索与驱动程序和设备安装相关的组策略。](img/httpatomoreillycomsourcemspimages1988851.png.jpg)图\
  \ 2-10. 探索与驱动程序和设备安装相关的组策略。\n\n你可以使用此组策略和设置在本地计算机和域中限制或启用访问。\n\n### 实验：在测试实验室中使用驱动程序\n\
  \n在思考实验中，应用你对本目标所学的知识。你可以在本书末尾的“答案”部分找到这些问题的答案。\n\n你是一个属于 `Active Directory` 域的大型网络管理员。在将任何设备驱动程序部署到组织内的计算机之前，你会对硬件和软件进行大量的测试。请回答关于测试实验室的问题：\n\
  \n1. 你应该配置什么，以便测试实验室的员工能够在 64 位测试机上安装未签名的驱动程序？\n2. 你如何访问这些配置选项？\n3. 实验室可以使用什么命令行工具来管理\
  \ `Driver Store`？哪些命令行参数允许你从 `Driver Store` 中永久删除特定驱动程序？\n\n### 目标总结\n\n* 设备需要设备驱动程序才能正常工作。设备驱动程序可以是签名的或未签名的，32\
  \ 位或 64 位。\n* `Device Manager` 允许你轻松地安装、更新、禁用（设备）和回滚驱动程序。\n* 未签名驱动程序通常会引起问题，`Sigverif.exe`\
  \ 命令可以帮助你找到这些问题的来源。\n* `Pnputil.exe` 可以帮助你管理 `Driver Store` 中的驱动程序。\n* 你配置驱动程序策略以应用于工作组或域，以确定如何进行安装。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对本目标的掌握。你可以在本书末尾的“答案”部分找到这些问题的答案以及每个答案对错误的解释。\n\n| **问:**\
  \ | 1. 驱动程序经过数字签名意味着什么？（选择所有适用项）\n1. 制造商对驱动程序进行了大量测试，并确认其是安全的。\n2. 驱动程序经过微软测试，被批准为安全且未被更改过。\n\
  3. 驱动程序是 32 位驱动程序。\n4. 驱动程序在由权威签名后未被更改。 |\n| **问:** | 2. 连接设备时是如何自动安装驱动程序的？（选择所有适用项）\n\
  1. Windows 从 `Windows Update` 安装驱动程序。\n2. 如果在 `Driver Store` 中找到，Windows 将安装它。\n\
  3. Windows 从制造商网站下载驱动程序并运行下载的可执行文件。\n4. `Device Manager` 从 `Driver Store` 安装程序。\
  \ |\n| **问:** | 3. 你的计算机运行 Windows 8.1 的 64 位版本，你的摄像机制造商只提供了 32 位驱动程序磁盘。当你首次连接时，Windows\
  \ 没有自动安装驱动程序。你可以做什么？（选择所有适用项）\n1. 访问制造商网站并希望存在 64 位驱动程序。如果有，则手动下载并安装。\n2. 以高级模式重启计算机并禁用驱动签名。当计算机重启时，使用\
  \ `Device Manager` 手动安装驱动程序。\n3. 使用 `Device Manager` 浏览到驱动程序并启动安装。\n4. 等待制造商创建兼容的设备驱动程序并由微软进行测试。密切关注操作中心和\
  \ `Windows Update` 通知，以了解何时可用。 |\n\n\n\n\n\n\n**Q:** 4. 你正在尝试诊断客户计算机上的性能问题。在与用户交流最近发生了什么变化（如果有的话）后，你发现他最近购买并安装了一台新扫描仪，并安装了驱动程序。他记得出现过某个包含警告的提示，但不记得具体内容。你首先会尝试什么？\n\
  \n1. 在`Device Manager`设备管理器）中，找到扫描仪使用的资源并查看是否存在冲突。如果发现冲突，重新分配冲突资源以便扫描仪能够正常运行。\n\
  2. 在高级模式下重启电脑并禁用驱动签名。这将允许问题的驱动程序无限制地运行。\n3. 在提升权限的命令提示符中运行`Sigverif.exe`。\n4. 在`Device\
  \ Manager`设备管理器）中，找到扫描仪并回滚驱动程序。\n\n**Q:** 5. 你可以在哪里轻松为工作组中的客户安装无线打印机？\n\n1. 在`Device\
  \ Manager`设备管理器）中。\n2. 你不需要；Windows 将自动检测并安装打印机。\n3. 在`Device Stage`设备阶段）中。\n4.\
  \ 在`Devices And Printers`设备和打印机）窗口中。\n\n## 目标 2.2：安装和配置桌面应用和 Windows Store 应用在本目标中，你将学习如何安装和配置桌面应用程序以及\
  \ Windows Store 应用程序。对于大多数终端用户，安装涉及运行桌面应用的安装程序或从 Windows Store 获取应用程序。你也可以从互联网下载并安装桌面应用程序，甚至从网络共享安装。安装过程没有太大变化，除了从\
  \ Windows Store 获取应用程序的过程外。然而，有时你需要从命令提示符安装应用程序，你将在这里学习如何使用`MSIExec`命令来实现。此外，你还将学习当存在多个应用程序来执行某项任务或查看数据时，如何配置默认程序和文件关联，以及如何管理用户对\
  \ Windows Store 的访问。\n\n### 本目标涵盖了：\n\n* 配置默认程序设置和文件关联\n* 安装和修复应用程序\n* 管理对 Windows\
  \ Store 的访问\n* 配置默认程序设置和文件关联\n\n当用户执行某些任务时，例如打开电子邮件附件（图片、PDF 文件、视频文件、电子表格等）、插入 DVD，甚至甚至点击文档或电子邮件消息中的超链接，会发生某些特定的情况。程序打开了，窗口打开了，网络浏览器打开了，等等。用户可能有多个可以打开单一数据类型的应用程序可用。例如，在电子邮件消息中点击链接会导致网络浏览器打开，但该网络浏览器可能是`Internet\
  \ Explorer 11`应用、桌面上的`Internet Explorer`，甚至是像`Google Chrome`或`Mozilla Firefox`这样的第三方应用程序。在某些情况下，发生的并不是用户想要的或预期的。此外，这可能不是你作为网络管理员想要的。\n\
  \n配置用户点击特定类型数据时打开何种应用程序的方法是配置默认程序。要开始，从`Control Panel`控制面板打开`Default Programs`窗口。当`Control\
  \ Panel`配置为显示大图标或小图标时，最容易访问。请参见图 2-11。\n\n![打开默认程序窗口以访问设置默认程序的选项。](img/httpatomoreillycomsourcemspimages1988853.png.jpg)图\
  \ 2-11. 打开默认程序窗口以访问设置默认程序的选项。\n\n### 考试小贴士\n\n某些应用程序会在不请求用户许可的情况下将自己命名为默认程序，或者至少将请求许可的提示隐藏在用户执行安装时可能不会注意的隐蔽位置。这在你第一次打开程序时也可能发生。你必须打开`Default\
  \ Programs`窗口将默认值改回你想要的内容。\n\n如你在图 2-11 所示，有四个选项：\n\n* **设置你的默认程序（Set Your Default\
  \ Programs）**：选择此选项使程序成为它可以打开的所有文件类型和协议的默认程序。这是配置默认程序及其文件关联最快的方法之一。\n* **将文件类型或协议与程序关联（Associate\
  \ A File Type Or Protocol With A Program）**：使用此选项选择单个特定的文件类型或协议（例如`.bmp`），用特定程序（例如`Microsoft\
  \ Paint`）打开它。在此例中，这不会导致所有图片文件都在指定的程序中打开，仅打开一种类型的图片文件（`.bmp`）。当你想要指定一种文件类型，而它具有其他你不想重新关联的类似文件类型时，这非常有帮助。\n\
  * **更改自动播放设置（Change AutoPlay Settings）**：选择此选项配置当将 CD 和 DVD 插入磁盘驱动器时会发生什么。你可以在这里更改用户在提示中选择“当插入特定类型介质时‘始终’执行某特定操作”时设置的设置。这还允许你设置应该始终发生什么，而不是提供提示让用户决定。\n\
  * **设置程序访问和计算机默认值（Set Program Access And Computer Defaults）**：使用此设置控制与用户将执行的特定活动（如发送电子邮件）相关的特定程序的访问，并指定桌面和其他位置提供哪些程序。\n\
  \n要配置这四个选项中的任何一个，只需点击你想要的内容，然后为其构建设置。\n\n要设置默认程序，请遵循以下步骤：\n\n1. 在`Default Programs`窗口中，点击`Set\
  \ Your Default Programs`。\n2. 选择要配置为默认的程序。你可以选择应用和桌面应用。\n3. 点击`Set This Program\
  \ As The Default`将其配置为所有文件类型的默认程序，并点击`OK`或继续第 4 步。\n4. 取消任何不想包含的文件类型的复选框，然后点击`Save`。\n\
  \n要将文件类型或协议与程序关联，请遵循以下步骤：\n\n1. 在`Default Programs`窗口中，点击`Associate A File Type\
  \ Or Protocol With A Program`。\n2. 在左窗格中选择文件类型或协议。\n3. 点击`Change Program`。\n4. 从列表中选择所需的程序，如果没有看到你要的内容，点击`More\
  \ Options`。\n\n要更改自动播放设置，请遵循以下步骤：\n\n1. 在`Default Programs`窗口中，点击`Change AutoPlay\
  \ Settings`。\n2. 使用下拉列表为种介质类型设置默认值。\n3. 点击`Save`。\n\n要设置程序访问和计算机默认值，请遵循以下步骤：\n\n\
  1. 在`Default Programs`窗口中，点击`Set Program Access And Computer Defaults`。\n2. 选择之一：\n\
  \    * `Microsoft Windows`：将所有 Microsoft Windows 应用配置为默认。如果你已将`Microsoft Outlook`等程序设置为默认值，则不会发生更改。点击`OK`。\n\
  \    * `Non-Microsoft Windows`：删除对所有 Microsoft 应用的访问，包括`Internet Explorer`、任何基于微软的电子邮件程序、`Windows\
  \ Media Center`、`Windows Media Player`等。点击`OK`。\n    * `Custom`：精确选择你想要用于[图 2-12]所示图\
  \ 2-12 的项。点击`OK`。\n\n\n\n\n\n\n有多种方法可以安装和修复应用程序。你可能已经熟悉传统的选项：插入应用程序 CD 或 DVD 并选择修复选项；从控制面板卸载应用程序然后使用其他方法重新安装；或者甚至可以直接在控制面板中选择该程序并点击“修复”。在这里，你将学习两种较少为人知的选项：使用\
  \ Windows 安装文件 (MSIExec) 和应用程序兼容性工具包 (ACT)。\n\n## Info：先尝试使用传统选项进行修复\n\n作为第一道防线，特别是在工作站上，当应用程序需要重新安装或修复时，你应该尝试更熟悉的选项。你可能已经熟悉的选项包括：运行\
  \ Windows 8.1 提供的程序兼容性疑解答；从 PC 设置中卸载、重新安装并自动更新 Windows Store 应用；甚至在程序完全无法运行时，使用控制面板卸载桌面应用程序。\n\
  \n## MSIExec\n\nMSIExec 为网络管理员提供了一种在命令行中使用 Windows 安装文件进行安装、修改和其他其他操作的方法。这涉及输入命令\
  \ `MSIExec` 以及相应的命令行选项。在开始之前，你需要了解几个术语：\n\n*   `Package`。指定 Windows 安装包文件的名称（和位置）。\n\
  *   `ProductCode`。指定 Windows 安装包文件的全局唯一标识符 (GUID)。\n*   `UpdatePackage`。指定要应用的更新。\n\
  \n如果你想安装产品，命令的语法为：`msiexec /i {Package | ProductCode}`。参数 `/i` 表示你想要安装（或配置）一个包。在实际使用中，命令可能如下：`msiexec\
  \ /i \\\\servername\\sharename\\windowsinstallerfilename.msi`。\n\n[表 2-1] 详细列出了\
  \ MSIExec 最常用的命令行参数。记住，你也可以使用 MSIExec 来修复安装。\n\n表 2-1. MSIExec 常用命令行参数\n\n| 参数 |\
  \ 额外命令 | 功能 |\n| --- | --- | --- |\n| /a | | 应用管理安装选项。 |\n| /f | 下面是你可以配合 `/f` 使用的额外命令，使用方式如下：`msiexec\
  \ /fpecms Example.msi` | 启用各种各种修复参数，使用方式如下：`msiexec /f [p][o][e][d][c][a][u][m][s][v]{Package\
  \ &#124; ProductCode}` |\n| | P | 仅在文件缺失时重新安装。 |\n| | O | 如果文件缺失或安装了旧版本则重新安装。 |\n\
  | | E | 如果文件缺失或安装了相同或更旧的版本则重新安装。 |\n| | D | 如果文件缺失或安装了不同版本则重新安装。 |\n| | C | 如果文件缺失或存储的校验和与计算值不符则重新安装。\
  \ |\n| | A | 强制重新安装所有文件。 |\n| | U | 重写所有需要的用户特定注册表项。 |\n| | m | 重写所有需要的计算机特定注册表项。\
  \ |\n| | s | 覆盖所有现有快捷方式。 |\n| | v | 从源运行并重新缓存本地包。 |\n| /x | | 卸载产品。 |\n| /j | 下面是你可以配合\
  \ `/j` 使用的命令，使用方式如下：`msiexec /j [{u &#124; m}] Package` | 发布产品。 |\n| | U | 向当前用户发布产品。\
  \ |\n| | M | 向计算机上的所有用户发布产品。 |\n| /p | | 应用更新。 |\n\n### 考试提示\n\n你极有可能被要求验证 MSIExec\
  \ 命令的正确语法，或者选择应该使用哪些命令和参数。务必学习表 2-1 中提供的所有命令行选项和参数。\n\n## 探索应用程序兼容性工具包\n\n应用程序兼容性工具包\
  \ (ACT) 帮助你确定组织中的应用程序、设备和计算机是否兼容 Windows 8.1。你可以用它从微软和软件供应商处获取兼容性信息（如果需要，还可以分享你学到的内容）。在大组织中，你可以使用\
  \ ACT 执行以下操作：\n\n*   对应用程序、设备和计算机进行清单，以便确切知道你想测试什么。\n*   测试组织内应用程序的兼容性。\n*   管理你在测试期间创建的数据。\n\
  *   分析可用的兼容性信息。\n*   对解决方案划分优先级并修复兼容性问题。\n\n### 考试提示\n\nACT 只测试桌面应用程序，因为来自 Windows\
  \ Store 的应用已确认兼容 Windows 8.1。\n\n如果你还记得第一章的内容，从微软免费下载的应用程序部署工具包中包含了 ACT。ACT 允许你发现哪些应用程序与\
  \ Windows 8.1 不兼容，并创建“垫片（shims）”来修复这些问题。\n\n## 管理 Windows Store 的访问\n\n默认情况下，所有用户都可以访问\
  \ Windows Store。你可能想更改此行为。有两种修改访问权限的方法：你可以配置使用户完全无法访问 Windows Store，或者通过允许他们获取特定应用来限制其使用。\n\
  \n### 使用组策略编辑器禁用访问\n\n要完全禁用访问，你将使用组策略编辑器。要限制仅访问部分 Windows Store 内容，你将使用 AppLocker。\n\
  \n你可以使用 ACT 验证应用程序、设备和计算机与新版本 Windows 操作系统的兼容性；使用标准用户分析 (SUA) 工具测试应用程序是否存在与用户账户控制\
  \ (UAC) 相关的问题；并使用 Internet Explorer 兼容性测试工具测试 Web 应用程序和网站的 Windows Internet Explorer\
  \ 发布和安全更新。\n\n### 考试提示\n\n要在单个客户端计算机上禁用更新，请遵循以下步骤：\n\n1.  从开始屏幕点击 Store 应用。\n2.\
  \  按下 Windows 键+I 打开设置界面。\n3.  点击“应用更新”。\n\n\n\n\n\n4.  将“自动更新我的应用”下方的滑块从“是”移动到“否”（参见图\
  \ 2-13）。\n\n![使用 Store 的设置禁用应用更新。](img/httpatomoreillycomsourcemspimages1988857.png.jpg)图\
  \ 2-13. 使用 Store 的设置禁用应用更新。\n\n如果你需要管理工作组或域中的一组计算机，则需要应用组策略。无论你使用**本地组策略**还是域服务器上的相关**组策略管理控制台（`GPMC`）**，组策略设置的位置都是相同的。本地组策略设置（在\
  \ `Gpedit.msc` 中）的路径是：计算机配置、管理模板、Windows 组件、商店。如果你启用`关闭 Win8 机器上的自动下载更新`此设置，更新将禁用更新。\n\
  \n### 使用组策略禁用访问\n\n你无法像禁用应用更新那样，从“设置”界面（Charm）中禁用对 Windows Store 的访问。要禁用访问，你必须使用相应的组策略编辑器。如果你的员工正在下载和安装游戏等内容，你可能需要这样做。为了满足公司的安全需求，你可能需要禁用访问。无论情况如何，要使用本地组策略编辑器禁用对\
  \ Windows Store 的访问，请遵循以下步骤：\n\n1.  在开始屏幕上，输入 `gpedit.msc` 并点击结果中的项。（你也可以使用桌面上的运行对话框。）\n\
  \n2.  在组策略编辑器中，展开以下节点：计算机、用户配置、管理模板、Windows 组件、商店。\n\n3.  双击`关闭商店应用程序`。\n\n4.  选择`启用`，如图\
  \ 2-14 所示。\n\n5.  点击`确定`。\n\n![在适当的组策略编辑器中关闭商店应用。](img/httpatomoreillycomsourcemspimages1988859.png.jpg)图\
  \ 2-14. 在适当的组策略编辑器中关闭商店应用。\n\n### 考试提示\n\n考试中会有问题问及如何使用各种基于文本的快捷键打开各种功能。例如，与其在工作站计算机的开始屏幕上搜索本地组策略编辑器，你可能需要知道也可以使用\
  \ Windows 键+R，并在打开的运行对话框中输入 `gpedit.msc`。因此，当你阅读此本书并执行任何任务时，请记住可能还有其他实现方法。\n\n以下是你可以在运行对话框或开始屏幕上输入的几个示例，用以打开一些常用的管理工具和计算机管理工具：文件签名验证工具\
  \ = `sigverif`；组策略编辑器 = `gpedit.msc`；本地安全策略 = `secpol.msc`；系统配置实用 = `msconfig`；任务管理器\
  \ = `taskmgr`；计算机管理 = `compht.msc`；事件查看器 = `eventvwr.msc`；性能监器 = `perfmon.msc`；磁盘管理\
  \ = `diskmgmt.msc`。要查找更多，请在网上搜索“Windows 8 命令列表”。\n\n### 考试提示\n\n用户从 Windows Store\
  \ 获取应用，但那并不是获取它们的唯一途径。在企业环境中，网络管理员经常使用一种名为“侧载”的技术（必须在组策略中启用）将他们创建的应用安装到组织的计算机上。虽然侧载不再被列为本次考试的目标之一，但可能会有一一两个问题漏掉进来。请寻找诸如\
  \ `import-module.appx` 以及其他以 `.appx` 文件格式结尾的命令。同样记住，这是一个 Windows PowerShell 命令。\n\
  \n### 思考实验：禁止对特定程序的访问\n\n在这一思考实验中，应用你对该目标中学到的知识。你可以在本章末的“答案”部分找到这些问题的答案。\n\n你是一家小公司的网络管理员，该公司有\
  \ 6 台机器运行 Windows 7，另外 4 台机器运行 Windows 8。共有 8 名员工。网络不属于 Active Directory 域。你发现普通员工在工作时在看\
  \ DVD。你想在员工使用的计算机上禁用对 Windows Media Center 和 Windows Media Player 的访问，同时在老板的计算机上保留这些程序的可用。你已经设置了限制以防止员工安装自己的媒体应用程序。请应用你在该目标中学到的知识来禁用对这些默认程序的访问。注意，你不想限制员工使用的网络浏览器，或对现有的应用程序配置做出其他强制性更改。\n\
  \n1.  可以实施这些限制吗？\n\n2.  如果可以，你在控制面板中打开哪个窗口来进行这些更改，该窗口中的哪个选项可以让你访问在员工使用的计算机上使这些程序不可用的选项？\n\
  \n3.  在进行这些更改时，你会选择哪种配置（Microsoft Windows、非 Microsoft 或自定义）？\n\n### 目标总结\n\n*  \
  \ 配置默认设置和文件关联，以配置特定文件类型的打开方式。\n*   从“设置程序访问和计算机默认值”窗口禁用对特定应用的访问。\n*   使用组策略限制或禁用对\
  \ Windows Store 的访问。\n*   在命令行中使用 `MSIExec` 安装和修复应用程序。\n*   探索应用程序兼容性工具包 (`ACT`)\
  \ 并知道它可以用于建立清单、测试应用程序兼容性以及处理不兼容的应用程序等。\n\n### 目标回顾\n\n回答以下问题以测试你对该目标的理解。你可以在章末的“答案”部分找到这些问题的答案以及每个答案正确或错误的解释。\n\
  \n**问题 1**：下列命令可用于修复缺失文件的安装并覆盖现有快捷方式？\n1.  `msiexec /fps {ProductCode}`\n2.  `msiexec\
  \ /i {ProductCode}`\n3.  `msiexec /fa {ProductCode}`\n4.  `msiexec /x {ProductCode}`\n\
  \n**问题 2**：如何在单台工作站上阻止 Store 应用自动更新？\n1.  使用本地安全策略配置该设置。\n2.  在控制面板、默认程序窗口下访问该功能进行设置。\n\
  3.  在提升权限的命令提示符中输入 `msiexec -f -d WindowsStore`。\n4.  打开 Store 应用，打开设置并点击应用更新访问该设置。\n\
  \n**问题 3**：用户从哪里获取启动应用？（选择所有适用）\n1.  从 Windows Store\n2.  通过侧载过程\n3.  通过命令行 `msiexec\
  \ -i -a <应用路径>` 安装到机器上\n4.  来自 `ACT`\n\n**问题 4**：用户抱怨每次插入 USB 驱动器时什么都没有发生。她希望自动在资源管理器中打开该驱动器。你使用默认程序中的哪个工具来解决这个问题？\n\
  1.  设置程序访问和计算机默认值\n2.  将文件类型或协议关联程序\n3.  设置你的默认程序\n4.  更改自动播放设置\n\n\n* 使用 `AppLocker`\
  \ 配置应用程序限制\n* 使用`软件限制策略` (Software Restriction Policies) 配置应用程序限制\n* 管理可移动设备的安装和访问\n\
  * 配置`分配访问` (Assigned Access)\n\n### 注意：配置 Store 应用\n\n要配置从 Store 获取的应用，请打开该应用并访问功能（charms）。点击\
  \ `Settings` 查看哪些可用选项。\n\n### 使用 AppLocker 配置应用程序限制\n\n如果不使用专为此目的设计的工具，要防止用户访问特定应用程序是困难的，甚至是不可能的。`AppLocker`（也称为应用程序控制策略）可以在这方面提供帮助。通过使用它，你可以通过创建带有所需限制的特定规则，来控制用户可以运行哪些应用程序和文件。\n\
  \n### 重要：何时可以应用 AppLocker 规则\n\n`AppLocker` 规则只能应用于运行 `Windows 7`、`Windows 8`、`Windows\
  \ Server 2008 R2` 和 `Windows Server 2012` 的计算机。如果你需要为其他操作系统创建规则，则必须使用较旧的技术`软件限制策略`，该策略将在下一节中详细介绍。\n\
  \n从高层次来看，在`组策略编辑器`中可用的 `AppLocker`组织分为四个名为`规则集`的区域，你可以在其中为工作组或企业中的各种类型的应用程序创建规则。你可以在左窗格中看到这四项，参见图\
  \ 2-15。默认情况下不存在规则。规则集（或容器）的四个区域是可执行文件（`.exe`, `.com`）、脚本（`.ps2`, `.bat`, `.js`,\
  \ `.cmd`, `.vbs`）、Windows 安装文件（`.msi`, `.mst`, `.msp`）和包应用（`.appx`）。`AppLocker`\
  \ 使用这些规则确定用户可以运行哪些应用程序。路径为`计算机配置，Windows 设置，安全设置，应用程序控制策略，AppLocker`。\n\n在决定使用哪个容器创建规则后（你的选择有`可执行文件规则`、`Windows\
  \ 安装程序规则`、`脚本规则`或`包应用规则`），你需要决定创建什么种类型的规则。有三种选择：\n\n* `发布者规则`。使用此选择为由软件发布者进行数字签名的应用程序创建规则。此类规则使用使用数字证书（发布者名称和产品名称）以及文件的属性（文件名和文件版本）。你可以创建规则适用于整个产品套件。\n\
  * `路径规则`。使用此选择根据文件或文件夹到特定应用程序的安装路径来创建规则。\n* `文件哈希值规则`。使用此选择根据 Windows 为每个文件加密计算的唯一文件哈希值来创建规则。如果发布者更新了文件，你必须创建一个新规则，因为该文件是唯一的，并且会随更新而更改。\n\
  \n如果你计划使用 `AppLocker`，请理解一旦启用并使用，`AppLocker` 将阻止所有可执行文件、安装包和脚本，除非另有说明。因此，你必须先创建默认规则，允许用户访问运行系统所需的文件。之后，你就可以开始配置你想要和不想要他们使用的内容。\n\
  \n### 更多信息：你可以管理的 AppLocker 文件类型\n\n在`Windows Server 2008 R2` 和 `Windows 7` 中，你可以管理四种文件：可执行文件（`.exe`）、Windows\
  \ 安装程序（`.msi` 和 `.msp`）、脚本（`.bat`, `.cmd`, `.js`, `.ps1` 和 `.vbs`）以及 DLL（`.dll`\
  \ 和 `.ocx`）。每种文件类型都在其自己的规则集中管理。在`Windows Server 2012` 和 `Windows 8` 中，你还可以管理 `.mst`\
  \ 和 `.appx` 文件。\n\n应用 `AppLocker`的一种方法是创建一个拒绝访问开始屏幕上的特定应用程序。如果你发现用户正在玩游戏、使用 `Skype`\
  \ 等，你可能想在机器上这样做。从高层次来说，你需要打开相应的`组策略编辑器`，创建一个`包应用规则`，选择为所有人自动生成规则，然后找到如 `Microsoft.BingTravel`\
  \ 的条目。使用向导选择拒绝该应用。你还需要在你想要应用限制的本地机器上启用并启动`应用程序标识服务` (Application Identity Service)。这是必要的，因为你可能会创建一组不允许访问\
  \ Windows 运行所需文件的规则。\n\n### 考试提示\n\n如果提出了一个关于为什么新的组策略没有应用到用户计算机上的问题，答案可能是用户需要重启计算机。你可以告诉用户这样做，或者你可以在`组策略`中配置强制重启，并设置允许通过的分钟。\n\
  \n### 使用软件限制策略配置应用程序限制\n\n在 `AppLocker` 不起作用的情况下，你必须使用`软件限制策略`创建规则。此功能已经存在很久了，因此它与\
  \ `Windows XP` 和 `Windows Vista` 兼容，如果你只想使用一种功能来管理组织中的所有计算机，也可以用于 `Windows 7` 和\
  \ `Windows 8` 计算机。但由于该功能较旧，它没有 `AppLocker` 高效。例如，它无法自动生成规则，这意味着你必须逐个手动配置规则。\n\n\
  与 `AppLocker`一样，你可以根据特定条件创建规则：\n\n* `证书规则`。使用此选项为由软件发布者数字签名的应用程序创建规则。此类规则使用数字证书（发布者名称和产品名称）以及文件的属性（文件名和文件版本）。\n\
  * `哈希值规则`。使用此选项根据 Windows 为每个文件加密计算的唯一文件哈希值创建规则。如果发布者更新了文件，你必须创建一个新规则，因为该文件是唯一的并且会随更新而更改。\n\
  * `网络区域规则`。使用此选择为通过 `Internet Explorer` 从 Internet 获取的 Windows 安装（`.msi`）包创建规则。你可以根据网站所在的区域配置规则。\n\
  * `路径规则`。使用此选项根据文件或文件夹到特定应用程序的安装路径创建规则。\n\n要创建`软件限制策略`你需要你需要`组策略编辑器`。导航到组策略对象并进入`计算机配置，Windows\
  \ 设置，安全设置，软件限制策略`。右键点击`软件限制策略`并点击`新建软件限制策略`。你现在可以创建自己的规则。\n\n点击`附加规则`开始。在`附加规则`窗格中右键点击并点击创建新规则所需的选项。你需要通过输入所需的组件手动配置规则，而不使用向导。参见图\
  \ 2-15。\n\n![使用软件限制策略手动创建规则.](http://atomoreillycomsourcemspimages1988861.png.jpg)图\
  \ 2-15. 使用软件限制策略手动创建规则。\n\n当你配置规则时，有三个设置：\n\n* `禁止`，防止配置的安装程序运行。\n* `基本用户`，允许所有不需要管理员批准的应用程序运行。如果它们需要批准，则它们必须匹配配置的规则。\n\
  * `不受限制`，允许匹配规则的应用程序运行。\n\n\n\n\n用户随身携带 USB 闪存盘是很常见的现象。我的钥匙扣上就有一个 USB 钥匙（真的，它的形状就像一把钥匙！）。使用便携式驱动器让用户能够随身携带数据，无需携带笔记本电脑、连接网络或域、将数据传输到平板电脑或手机，或访问云驱动器。遗憾的是，这也是病毒传播和敏感数据外泄（并可能丢失或被盗）的常见方式。在更糟糕的情况下，如果工作站被无人看管或未锁定，恶意用户可能会访问他人的计算机并在无人知情的情况下复制数据。除了\
  \ USB 驱动器外，用户还可以将数据拷贝到 CD、DVD 甚至内存卡。\n\n决定谁可以使用此类驱动器传输数据是一项艰巨的任务。某些员工需要这种能力，而另一些不需要。你必须进行仔细的统计，决定哪些员工属于这两组，然后相应地配置你的组策略。无论你如何决定，在`组策略编辑器`中都可以针对本地机器或域服务器上配置可移动存储设备访问的设置。\n\
  \n## 访问可移动存储设备策略\n\n要访问可移动存储访问策略，请按照以下步骤操作：\n\n1. 打开`组策略编辑器`（`gpedit.msc`）。\n2.\
  \ 导航到`计算机配置`、`管理模板`、`系统`、`可移动存储访问`。注意这些选项。参见图 2-16。\n   ![定位可移动存储访问。](img/httpatomoreillycomsourcemspimages1988863.png.jpg)图\
  \ 2-16. 定位可移动存储访问。\n3. 或者，若要为单个用户配置此项，请导航到`用户配置`、`管理模板`、`系统`、`可移动存储访问`。\n4. 双击设置进行配置。要启用该设置，点击`已启用`。\n\
  5. 点击`确定`。\n\n### 考试提示\n远程登录的用户对于可移动介质可以访问什么？仅允许从 USB 和 DVD 读取。\n\n现在花些时间打开图 2-16\
  \ 所示的屏幕，双击每个条目查看其提供了哪些功能。你需要能够命名这些策略，并并在启用它们时知道它们的作用。例如，设置`所有可移动存储设备类：拒绝所有访问`允许你阻止对所有类别的可移动存储设备的访问，且此策略的优先级高于所有单个类别的策略设置。同样，如果启用了`CD\
  \ 和 DVD：拒绝读取/写入/执行访问`，则会拒绝用户对计算机中 CD 或 DVD 驱动器的所有访问，或仅赋予用户你特定允许或拒绝的访问权限。\n\n## 配置分配访问\n\
  \n分配访问（Assigned Access）是 Windows 8.1 RT、Windows 8.1 专业版和 Windows 8.1 企业版提供的一新功能。简单来说，它是一种“设备锁定”技术。通过它，你可以使用`电脑设置`选择特定的用户配置文件并将应用程序分配给该配置。这通过在启动和用户身份验证后打开指定的应用程序，在设备上提供单一的\
  \ Windows 商店应用程序体验。你可以防止其他应用程序打开，并配置过滤器以防止登录的用户更改系统设置，甚至使用键盘上的特定键。\n\n### 考试提示\n\
  分配访问限制于一个用户和一个 Windows 商店应用。\n\n在用户只需要访问某项内容的情况下，你可以配置分配访问。也许它是一个供小学生使用的阅读程序。也许它是一个位于商场化妆品柜台的平板电脑。它甚至可以是制造商提供的特殊设备，仅用于执行一项功能，例如使用专为该功能设计的单个应用程序来管理幻幻足球球队。\n\
  \n要使用分配访问，你需要至少配置一个标准用户账户。你可以通过许多方法实现，最简单的方法是使用`电脑设置`。点击`账户`，如果账户不存在，则按照创建账户所需的流程进行操作。创建完成后，你将看到`为分配访问设置账户`选项。\n\
  \n然后执行以下操作（请参见图 2-17）：\n\n1. 选择要使用的账户。\n2. 选择一个应用程序。\n3. 重启计算机。\n4. 使用用户账户登录。\n\n\
  ![设置分配访问。](img/httpatomoreillycomsourcemspimages1988865.png.jpg)图 2-17. 设置分配访问。\n\
  \n当你重启计算机时，标准用户账户将是唯一的可用选项，你配置为单一可用应用程序的程序也将可用。\n\n### 重要：如何停止使用分配访问\n\n如果你想停止使用分配访问账户但仍希望它在你的电脑上可用，请快速按下五次`Windows`键。这将重启电脑并允许你使用不同的账户登录。要关闭分配访问，请以`管理员`身份登录，并在`电脑设置`、`账户`、`其他账户`中点击`为分配访问设置`。选择标准账户并点击`不使用分配访问`。\n\
  \n要针对大规模部署真正实现个性化的分配访问，你需要使用`Windows Embedded`和`锁定`功能。在使用时，你可以采用远程脚本和管理、手势自定义、键盘使用限制以及配置的系统通知限制等。这里有似乎无限的组合可以分配给用户。有关\
  \ Windows Embedded 的更多信息，请参考此文章：[`blogs.msdn.com/b/windows-embedded/archive/2013/10/16/windows-embedded-8-1-assigned-access-and-windows-embedded-lockdown.aspx`](http://blogs.msdn.com/b/windows-embedded/archive/2013/10/16/windows-embedded-8-1-assigned-access-and-windows-embedded-lockdown.aspx)。\n\
  \n### 思考实验：创建应用程序限制\n\n在思考实验中，应用你对本目标所学的知识。你可以在本文末的“答案”部分找到这些问题的答案。\n\n你需要为活动目录域中的一组用户创建应用程序限制。用户的工作站运行各种版本的\
  \ Windows Vista、Windows 7 和 Windows 8.1。然而，Windows Vista 机器很少，你可能很快会对它们进行升级。你希望尽可能创建自动规则来限制这些用户运行的程序类型。\n\
  \n1. 对于 Windows Vista 工作站，你应该使用哪些组策略？可以使用这种方法自动创建规则吗？\n2. 对于 Windows 7 和 Windows\
  \ 8 ，你应该使用哪种组策略？可以使用这种方法自动创建规则吗？\n3. 如果你需要限制访问 Windows 7 和 Windows 8 上提供的 .msi 文件应用程序，你应该创建什么类型的规则；具体来说，你应该在哪个容器中创建规则？\n\
  \n### 目标总结\n\n* 你使用 AppLocker 创建规则，可以限制员工访问和使用的应用程序。规则的可用容器包括可执行文件规则、Windows 安装规则、脚本规则和包应用程序规则。这些规则可以自动生成并应用于较新的\
  \ Windows 系统。\n\n* 你可以使用软件限制策略来限制旧版 Windows Vista 和 Windows XP 计算机上的应用程序，也可以将其应用于\
  \ Windows 7 和 Windows 8 计算机。规则分为证书、哈希值、网络区域和路径规则。\n\n\n\n\n\n*   你可能需要管理对可移动设备（如\
  \ CD、DVD 和 USB 闪存）的安装和访问。你可以在本地计算机或域控制器上的`组策略`(Group Policy）中进行此类配置。\n*   你可以使用`分配访问`(Assigned\
  \ Access）为一个用户和一个`Windows Store 应用`锁定计算机，以创建特定的用户体验。\n\n### 目标审查\n\n回答以下问题以测试你对本目标中信息的掌握情况。你可以在本章末尾的“答案”部分找到这些问题的答案以及每个备选项正确或错误的解释。\n\
  \n| **问:** | 1\\. 如果你需要根据应用程序的数字指纹来限制访问（即使文件名或位置发生变化），你应该在`软件限制策略 1Software Restriction\
  \ Policies）和`AppLocker`中创建什么类型的规则？<br>1. 证书规则<br>2. 路径规则<br>3. 脚本规则<br>4. 哈希或文件哈希规则\
  \ | |\n\n| **问:** | 2\\. 你应该配置以下哪种可移动存储访问策略，以防止所有选定用户写入 DVD，而不对其他可移动介质设置限制？<br>1.\
  \ CD 和 DVD：拒绝读取/写入/执行访问<br>2. CD 和 DVD：拒绝写入访问<br>3. 可移动磁盘：拒绝读取/写入/执行访问<br>4. 以上所有\
  \ | |\n\n| **问:** | 3\\. 你可以使用哪种技术为单个用户账户创建独特体验，并将该用户限制为仅使用一个 Windows Store 应用？<br>1.\
  \ AppLocker<br>2. 分配访问(Assigned Access)<br>3. 软件限制策略<br>4. 可执行规则 | |\n\n| **问:**\
