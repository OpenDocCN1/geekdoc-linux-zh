  \ 3. 你可以使用文件历史恢复已删除的 SkyDrive 文件。 | 4. 你可以在 Internet Explorer 中恢复 SkyDrive 文件的以前版本。\
  \ |\n| **问：** | 2. 关于文件历史，以下哪项是正确的？（可多选） | | 1 1. 你可以使用 USB 闪存盘或网络驱动器保存文件历史数据。 |\
  \ 2. 保存文件副本的默认设置是每两小时一次。 | 3. 离线缓存大小的默认设置是 5%。 | 4. 保留保存版本的默认时长是六个月。 |\n| **问：**\
