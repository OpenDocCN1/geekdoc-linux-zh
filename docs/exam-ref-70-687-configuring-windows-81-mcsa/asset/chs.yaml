  \n1. `C:\\Users\\<your user name>`\n2. `C:\\Program Files`\n3. `C:\\Windows`\n4.\
  \ `C:\\PerfLogs`\n5. `C:\\MyPersonalDiary`（你在 C 盘上创建的文件夹）\n\n## 目标 7.2：配置文件恢复\n\n\
  当文件和文件夹因损坏、数据丢失、计算机丢失等无法访问时，用户必须能够恢复它们。有很多方法可以实现这一点。家庭用户可能会选择运行简单的备份程序，将数据存储在外部驱动器上；大型企业可能会让用户将数据存储在数据服务器上，并安排员工负责备份和保护这些数据。介之间还有其他选项：使用\
  \ `SkyDrive` 和 `File History`（文件历史）。这是考试涵盖的两种备份选项。\n\n**此目标涵盖如何：**\n\n* 从 `SkyDrive`（即将重命名为\
  \ `OneDrive`）恢复文件\n* 配置 `File History`\n* 恢复文件和文件夹之前的版本\n\n### 注意\n`SkyDrive` 的名称将更改为\
  \ `OneDrive`，在某个时间考试也将进行相应的术语变更。\n\n### 从 SkyDrive 恢复文件\n\n`SkyDrive` 是用于保存文件的在线存储库。你可以从几乎任何连接到互联网的计算机或设备检索存储在那里的文件。你有几种方法可以从\
  \ `SkyDrive` 恢复丢失的文件。你可以从`回收站` 恢复文件，如果存在，你还可以恢复现有文件的以前版本。\n\n目前，你只能在网络浏览器中从 `SkyDrive`\
  \ 访问`回收站`，而不能从 `SkyDrive` 屏幕应用访问。如图 [7-5] 所示，顶部提供了“还原所有项目”和“清空回收站”选项。如果你不想还原所有内容（当点击“还原所有项目”或“清空回收站”时未选择任何内容，默认会发生这种情况），你可以选择想要管理的每个项目旁边的复选框。我们已根据删除日期对`回收站`中的数据进行了排序，但也有其他选项。\n\
  \n![在网络浏览器中使用 SkyDrive 可以访问回收站。](img/httpatomoreillycomsourcemspimages1989123.png.jpg)\
  \ 图 7-5. 在网络浏览器中使用 `SkyDrive` 可以访问 `回收站`。\n\n你还还可以访问 `SkyDrive` 窗口中文件的以前版本。只需右键点击要恢复的文件并点击“版本历史”；如图\
  \ [7-6] 所示。在弹出的窗口中，你会看到版本列表。要选择其中一个，只需在列表中点击它。\n\n![SkyDrive 保留了你可以访问的文件的以前版本。](img/httpatomoreillycomsourcemspimages1989125.png.jpg)\
  \ 图 7-6. `SkyDrive` 保留了你可以访问的文件的以前版本。\n\n### 更多信息：了解更多 SkyDrive\n\n你可以在 TechNet\
  \ 上学习更多关于 `SkyDrive` 的信息：`http://blogs.msdn.com/b/b8/archive/2012/04/23/the-next-chapter-for-skydrive-personal-cloud-storage-for-windows-available-anywhere.aspx`。确保搜索\
  \ `SkyDrive Recycle Bin` 和 `SkyDrive Previous Versions`，以便在新功能发布时保持最新。\n\n### 配置\
  \ File History\n\n`File History` 是 Windows 8.1 中用于备份数据的主要功能。替代方案 `Windows 7 File\
  \ Recovery` 已不再可用（它曾出现在 Windows 8 中）。`Windows Backup And Restore` 也不可用用。因此，了解 `File\
  \ History` 非常重要，包括如何设置它以及使用它恢复文件。尽管如此，它不应该是你唯一的备份方法；请确保你有一套完整的备份系统，其中可能包括系统映像和 `SkyDrive`\
  \ 的使用。\n\n你可以在开始屏幕上搜索并打开 `File History`。在 `File History` 窗口中，你会看到几个选项。[7-7] 显示了这一点。第一个警告说明此\
  \ PC 受 `Bitocker 驱动器加密` 保护，但第二个警告指出 File History 发现的文件使用加密文件系统 (EFS) 加密、位于网络位置或位于未使用\
  \ `NTFS` 的驱动器上，这些文件将不会被备份。\n\n![File History 是 Windows 8.1 中的主要备份手段。](img/httpatomoreillycomsourcemspimages1989127.png.jpg)\
  \ 图 7-7. `File History` 是 Windows 8.1 中的主要备份手段。\n\n左窗提供以下选项：\n\n* **还原个人文件**：需要时使用此选项恢复文件。你可以选择要还原的文件，并可以选择你的版本。\n\
  * **选择驱动器**：使用此选项选择驱动器或输入网络位置来保存你的 `File History` 数据。只有当检测到用于保存数据的外部驱动器时，`File History`\
  \ 才能启用。\n* **排除文件夹**：使用此选项查看或添加不想包含在 `File History` 中的文件夹。\n* **高级设置**\n    * 某些高级选项允许你配置保存文件副本的时间、离线缓存的大小以及保留保存文件的时间。知道如果你选择每天保存一次而不是每小时一次（默认值），你可能会发现自己无法还原想要还原的文件，因为它尚未被备份。请确保你查看了离线缓存大小（磁盘空间的\
  \ 5%）和保留保存版本时间（永久）的其他默认值。\n    * 你可以选择清理 `File History` 中保存的版本。你可以选择默认值（即删除一年前以前的文件），或选择其他选项，例如一个月前的、三个月前的等。\n\
  \    * 你向家庭组用户推荐你选择的用于 `File History` 数据的驱动器。\n    * 使用高级设置，你可以在`事件查看器`中打开 `File\
  \ History` 事件日志以排查 `File History` 问题。如果在考试中遇到关于这些日志的问题，请注意它们是 `FileHistory-Engine`\
  \ 和 `FileHistory-Core`。\n\n\n\n\n\n*   **恢复**。使用此选项访问高级恢复工具，包括创建恢复驱动、使用系统还原、配置系统还原，以及访问\
  \ PC 设置中的还原选项。\n*   **系统镜像备份**。使用此选项创建系统镜像备份。这是你计算机的映像，是 Windows 运行所用驱动器的副本。你应该创建一个系统镜像，以便在硬盘或计算机发生故障时恢复计算机。这是一个映像，不能用它选择特定的文件或文件夹。\n\
  \n### 考试要点\n\n有一个“组策略”（Group Policy）可以你为“文件历史”（File History）进行配置，即将其关闭。你可以在“计算机配置\\\
  管理模板\\Windows 组件\\文件历史”中找到它。\n\n### 考试要点\n\n你可以使用命令行工具 `FhManagew.exe` 来管理和清理文件历史备份。\n\
  \n尽管我们可以逐一向你介绍这些选项，但该过程本身非常直观易懂。当你打开文件历史时，系统会提示你（请见图 7-8*。\n\n### 还原文件和文件夹的以前版本\n\
  \n文件历史完成首次备份后，你可以点击文件历史窗口中的“还原个人文件”来恢复文件。图 7-8 显示了一个示例还原窗口。仔细观察你会发现选中的窗口是 399 个中的\
  \ 397 个，创建于 2014 年 1 月 17 日。然而，文件历史在这台计算机上已运行很长时间，这里可以的文件追溯到 399 个中的 1 个（在这种情况下大约是三个月前）。\n\
  \n![使用文件历史窗口恢复个人文件。](img/1atomoreillycomsourcemspimages1989129.png.jpg)图 7-8. 使用文件历史窗口恢复个人文件。\n\
  \n一旦你找到了想要还原的内容（使用后向箭头在窗口中移动），选择它们，然后右键点击并选择“还原（到原始位置）”或“还原到（特定位置）”。\n\n### 思考实验：创建策略\n\
  \n在思考实验中，应用你对本目标学到的知识。你可以在本章末尾的“答案”部分找到这些问题的解答。\n\n你被要求为一个规模较小但不断增长的组织的 50 台计算机创建备份策略。其中\
  \ 40 台是运行 Windows 8 的台式电脑；10 台是运行 Windows 8.1 的平板电脑。用户需要能够访问文件的旧版本，文件备份必须免受丢失或盗窃，并在需要时可用，且备份应每天完成。\n\
  \n1. 你建议使用什么种类型的备份策略？为什么？\n2. 你应该将备份存储在哪里？\n3. 你是否也应该创建一个系统镜像备份？\n\n### 目标总结\n\n\
  *   你可以使用 SkyDrive 的回收站恢复你从 SkyDrive 文件夹中删除的文件。\n*   SkyDrive 提供了“以前的版本”（Previous\
  \ Versions），你可以使用该工具访问工作文件的以前版本。\n*   文件历史是 Windows 8.1 中的一个备份选项，用于对文件进行自动备份，你对备份哪些内容以及需要时还原哪些内容具有完全控制权。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对本目标信息的掌握程度。你可以在本章末尾的“答案”部分找到这些问题的答案以及每个选项选项正确或错误的解释。\n\n\
