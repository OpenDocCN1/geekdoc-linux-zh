  \ `Windows Update` 保护计算机免受黑客和已知安全漏洞的侵害。如果更新意外导致了问题，你可以轻松地将其删除。你还可以使用 `Disk Management`\
  \ 管理磁盘卷，并使用 `Disk Defragmenter`、`Disk Cleanup` 和 `Check Disk` 等工具来保持驱动驱动器健康并高效运行。最后，你可以使用多种工具来监控性能，包括但不限于\
  \ `Task Manager`、`Performance Monitor` 和 `Event Viewer`。\n\n## 本章目标：\n\n* 目标 6.1：配置和管理更新\n\
  * 目标 6.2：管理本地存储\n* 目标 6.3：监控系统性能\n\n## 目标 6.1：配置和管理更新\n\nWindows 更新由微软提供，它是微软几十年来周复一日、年复一年努力保持其操作系统安全的持续尝试的一部分。这些更新通常提供新特性或功能，但大多数情况下，它们的推送是为了修复安全问题、应对新的安全威胁并提供新的设备驱动程序。这是任何公司维护计划中不可或缺的一部分，因为总有人试图侵入系统、释放病毒、隐藏恶意软件等。你需要受到保护。因此，你必须安装这些更新，最好的办法是为这些操作创建一个策略。\n\
  \n在不使用 `Active Directory` 基础结构而是使用小型点对点网络的小型组织中，大多数客户端计算机都配置为自动安装更新。这里通常没有策略，也没有人监督这一过程。在规模较大的组织中，即使是那些配置为工作组（而非\
  \ `Active Directory` 域）的组织，管理员通常也倾向于通过 `Local Group Policy` 为更新设置策略。在 `Active Directory`\
  \ 域中，通常有一个隔离的实验室在发布之前对更新进行测试，有时甚至有一个专门的服务器预缓存这些更新，以减少每个客户端直接从微软获取更新时所需的带宽。通过这种方法，更新在发布给客户端之前也可以进行测试。当然，域中也有用于\
  \ `Windows Update` 的 `Group Policies` 来帮助管理员管理它们。\n\n### 本目标涵盖了如何：\n\n* 更新 `Windows\
  \ Store` 应用\n* 配置更新设置\n* 管理更新历史\n* 回滚更新\n* 配置 `Windows Update` 策略\n\n### 更新 Windows\
  \ Store 应用\n\n除非你更改了默认配置或应用了 `Group Policies`，否则 `Windows Store` 应用会自动更新。这些更新安装通常是安全的，因为所有应用和应用更新都会先经过微软审核，并在经过彻底测试后通过\
  \ `Microsoft Store` 提供。然而，在某些情况下，你可能想要或需要禁用这些自动更新。\n\n### 注意：默认应用\n\n当你首次登录新的 `Windows\
  \ 8.1` 安装时，默认应用将会被更新。\n\n在单个工作站上，你可以按照以下步骤禁用自动应用更新：\n\n1. 在 `Start` 屏幕上，点击 `Store`。\n\
  2. 按 `Windows key+I` 打开 `Settings` 界面。\n3. 点击 `App Updates`。\n4. 将 `Automatically\
  \ Update My Apps` 滑块从 `Yes` 移动到 `No`。\n\n如果你选择禁用自动更新，则必须手动更新。请留意右上角来自 `Store` 的更新。\n\
  \n在继续之前，关于 `Windows Store` 和应用更新你还需要了解以下几点：\n\n* 在 `Computer Configuration`、`Administrative\
  \ Templates`、`Windows Components`、`Store` 中四个与 `Store`相关的 `Group Policy` 设置。参见图\
  \ 6-1。它们是：\n    * Turn Off Automatic Download Of Updates On Win8 Machines\n    *\
  \ Turn Off Automatic Download And Install Of Updates\n    * Turn Off The Offer To\
  \ Update To The Latest Version Of Windows\n    * Turn Off The Store Application\n\
  * 在 `User Computer Configuration`、`Administrative Templates`、`Windows Components`、`Store`\
  \ 中有两个与 `Store`相关的 `Group Policy` 设置。它们是：\n    * Turn Off The Offer To Update To\
  \ The Latest Version Of Windows\n    * Turn Off The Store Application\n* 网络管理员可以在\
  \ `Active Directory` 域中使用 `AppLocker` 控制如何从 `Windows Store` 安装更新。有关关于 `AppLocker`\
  \ 的更多信息，请参阅 TechNet 文章：*[`technet.microsoft.com/en-us/library/ee424367.aspx`](http://technet.microsoft.com/en-us/library/ee424367.aspx)*。\n\
  \n![可以为 Windows Store 配置组策略。](img/httpatomoreillycomsourcemspimages1989057.png.jpg)图\
  \ 6-1。可以为 Windows Store 配置组策略。\n\n### 更多信息：侧载（Sideloading）\n\n组织可以通过一种名为 `sideloading`\
  \ 的过程创建自己的应用。侧载允许公司创建自己的应用并跳过微软的审核流程。应用必须经过数字签名，并且想要提供应用的计算机必须配置允许安装（使用组策略 `Allow\
  \ Trusted To Install`）。\n\n考试可能会涉及有关侧载的内容，确保熟悉以下 Windows PowerShell 命令：\n\n* `Add-AppxPackage`:\
  \ 向用户账户添加已签名的应用包（.appx）\n* `Get-AppxPackage`: 获取用户配置文件中已安装的应用包列表（.appx）\n* `Remove-AppxPackage`:\
  \ 从用户账户删除应用包（.appx）\n\n此外，在具有权限的命令提示符可以使用这些命令：\n\n* `Slmgr /ipk <sideload key>`：添加侧载密钥\n\
  * `slmgr /ato`（跟随密钥）：激活侧载密钥\n\n```\nadd-appxpackage C:\\companyapp.appx –DependencyPath\
  \ C:\\winjs.appx\n```\n\n### 配置更新设置\n\n除非专门询问 `Store` 更新或固件更新，否则考试中任何关于更新的引用都是 Windows\
  \ Updates。这些是你控制面板中熟悉的多年来一直在使用的更新。\n\n你需要的设置可以在 `Control Panel`、`System And Security`、`Windows\
  \ Update` 窗口中访问。在这里你会找到 `Check For Updates`、`Change Settings`、`View Update History`、`Restore\
  \ Hidden Updates`、`Installed Updates` 以及 `Add Features To Windows 8.1` 等选项。你还会看到任何计划中的可用更新、可选更新以及接收更新的信息。图\
  \ 6-2 显示了此窗口。\n\n![在控制面板中配置 Windows 更新设置。](img/httpatomoreillycomsourcemspimages1989059.png.jpg)图\
  \ 6-2。在控制面板中配置 Windows 更新设置。\n\n### 注意：在哪里设置 Windows 更新\n\n你可以使用 `PC Settings`、`Update\
  \ And Recovery` 快速查看客户端是否配置为接收更新。你还可以查看更新历史并选择如何安装更新。然而，大多数网络管理员仍然倾向于使用 `Control\
  \ Panel` 中的 `Windows Update` 窗口，因为那里提供了所有选项，而不仅仅是用户可能访问的那些。\n\n\n\n\n要从控制面板配置更新设置，请遵循以下步骤：\n\
  \n1.  点击`系统和安全`（System And Security）并点击`Windows 更新`（Windows Update）。\n2.  在图 6-2\
  \ 所示的`Windows 更新`窗口中，点击`更改设置`。\n3.  使用`重要更新`下拉列表中的选项进行您的常用选择。参见图 6-3\n    ![获取和安装\
  \ Windows 更新的四种选项。](img/httpatomoreillycomsourcemspimages1989061.png.jpg)图 6-3.\
  \ 获取和安装 Windows 更新的四种选项。\n4.  点击显示的调度选项。默认项是`在维护期间自动安装更新`。参见图 6-3\n5.  如果需要，使用`每天运行维护任务`下拉列表选择不同的时间。默认为`凌晨\
  \ 3 点`。\n6.  如果需要，勾选`允许计划维护在计划时间唤醒我的计算机`复选框。\n7.  点击`确定`。\n8.  点击`确定`。\n9.  确保您熟悉第\
  \ 3 步步中的四种选项：\n    *   `自动安装更新（推荐）`\n    *   `下载更新但让我决定是否安装它们`\n    *   `检查更新但让我决定是否下载或安装它们`\n\
  \    *   `从不检查更新（不推荐）`\n\n### 考试提示\n\n*   当新设备连接到计算机时，`Windows 8.1` 会在计算机上搜索驱动程序。如果没有找到，它将会在`Windows\
  \ 更新`中查找。\n*   标准用户可以安装从`Windows 更新`下载的驱动程序，而无需`用户帐户控制 (UAC)`提示。\n*   `Windows 更新`窗口中可能提供未自动安装的可选更新，因此偶尔要检查是否有可用更新。\n\
  \n### Windows Server 更新服务 (WSUS)\n\n本节详细介绍了配置的`Windows 更新`是小型工作组和组织（通常规则是 50 个或更少的用户）的良好解决方案。如果您的组织规模较大，则应该安装并配置`Windows\
  \ Server Update Services (WSUS)`服务器。通过`WSUS`，更新会被下载到`WSUS`服务器，然后管理员可以在更新准备就绪后（可能是在测试之后）让它们可用。他们甚至可以将更新传递给大型组织中的其他`WSUS`服务器。这还节省了带宽，因为更新只需要从互联网下载一次。之后，它们就可以通过本地网络从服务器推送到客户端，或从服务器下载。\n\
  \n要使用`WSUS`，必须通过`组策略`将`Windows`客户端配置为使用`WSUS`服务器。您无法在控制面板中进行此更改。您寻找的策略是`指定内网 Microsoft\
  \ 更新服务位置`。它位于相应的`组策略编辑器`中：`计算机配置`、`管理模板`、`Windows 组件`、`Windows 更新`。这只是`Windows 更新`节点中可用众多策略中的之一。我们将在本节稍后学习这些内容。\n\
  \n### 管理更新历史\n\n在图 6-2 中，您看到了`Windows 更新`窗口任务窗格中的`查看更新历史`选项。您点击该选项以查看安装在计算机上的所有更新。它们默认按安装日期组织，但您可以点击选项卡栏上的任何选项卡以其他方式进行排序。您可以按`重要性`排序，这将按类型对更新进行组织。如果您仔细查看图\
  \ 6-4，您会发现有很多标记为`重要`的更新，只有少数几个标记为`推荐`的更新。\n\n![检查更新历史以查看安装了哪些类型的更新。](img/httpatomoreillycomsourcemspimages1989063.png.jpg)图\
  \ 6-4. 检查更新历史以查看安装了哪些类型的更新。\n\n### 考试提示\n\n确保您熟悉各种类型的更新、它们提供的内容以及为什么要使用它们：`重要`、`推荐`、`可选`、`安全`、`关键`和`服务包`。\n\
  \n您还可以按名称对更新进行排序。这样做时，您可以更容易地看到正在更新的是什么。您可能会看到许多`Windows Defender`的`定义`更新、`Windows\
  \ 8.1`操作系统的更新、`Windows 恶意软件删除工具`的更新、字典更新等。您还会看到针对各种项目（包括`Internet Explorer 11`）的`累积安全更新`。要了解更多关于任何更新的信息（包括任何知识库文章），请双击它，如图\
  \ 6-5 所示。（您也可以通过右键点击进行复制。）\n\n![双击即可了解任何更新的信息。](img/httpatomoreillycomsourcemspimages1989065.png.jpg)图\
  \ 6-5. 双击即可了解任何更新的信息。\n\n### 回滚更新\n\n当您回滚更新时，即是卸载它。逻辑上，它必须先安装。要访问已安装的更新，您需要打开`Windows\
  \ 更新`窗口并点击左上角的`已安装的`。找到要卸载的更新后，点击它并点击`卸载`。参见图 6-6\n\n![卸载更新](img/httpatomoreillycomsourcemspimages1989067.png.jpg)图\
  \ 6-6. 卸载更新\n\n如果您预先知道有一个不想安装的更新（且您没有`WSUS`服务器），您可能想临时更改`Windows 更新`中的设置，以便在有可用更新时提示您，同时对安装哪些内容保持控制。\n\
  \n要隐藏更新，请遵循以下步骤：\n\n1.  打开`Windows 更新`窗口。\n2.  点击可用更新的通知。图 6-7 显示有一个可用更新。\n3.  在弹出的`选择要的更新`窗格中找到更新，右键点击它并点击`隐藏更新`。\n\
  \n![在安装之前隐藏更新以防止其安装。](img/httpatomoreillycomsourcemspimages1989069.png.jpg)图 6-7.\
  \ 在安装之前隐藏更新以防止其安装\n\n如果您以后决定安装该更新，从`Windows 更新`窗口开始，点击`恢复隐藏的更新`。选择所需的更新并点击`恢复`。\n\
  \n### 配置 Windows 更新策略\n\n当您需要更多控制如何将`Windows 更新`应用到客户端计算机时，可以设置本地和域`组策略`。您可以在`组策略编辑器`中找到这些设置：`计算机配置`、`管理模板`、`Windows\
  \ 组件`、`Windows 更新`。有很多策略需要审查，由于它们并不总是直观易懂，我们将比之前的组策略设置更深入地介绍它们。\n\n\n\n\n\n请记住，当你启用特定的\
  \ `Group Policy`（组策略）设置时，你正在配置该策略准确执行其描述的操作。因此，如果策略设置以“不显示（Do not display......”开头，那么当你启用该设置时，无论其是什么将不会被显示。如果策略以“启用（Turn\
  \ on......开头，那么当你启用该策略时，该项将被启用。除非另有说明，禁用策略的结果等同于完全不配置。因此，除非设置存在特定问题，否则我们在这里只讨论启用时会发生的情况。设置显示在图\
  \ 6-8)。\n\n![本地组策略编辑器中的 Windows 更新策略。](img/httpatomoreillycomsourcemspimages1989071.png.jpg)图\
  \ 6-8.本地组策略编辑器中的 Windows 更新策略。\n\n### 在关闭 Windows 时不显示“更新并关机”选项\n\n启用后，即使用户在选择“关机”选项时有可用的更新待安装，`Install\
  \ Updates And Shut Down`（更新并关机）也不会出现在 `Shut Down Windows`（关闭 Windows）对话框的选项中。\n\n\
  ### 在关闭 Windows 时不将默认选项设置为“更新并关机”\n\n启用后，用户的最后一次关机选择将成为 `Shut Down Windows` 对话框中的默认选项，无论“你想让计算机做什么？”列表中是否存在\
  \ `Install Updates And Shut Down` 选项。\n\n### 启用 Windows 更新电源管理以自动唤醒系统安装计划更新\n\n\
  启用后，`Windows Update` 将唤醒处于休眠状态的系统（使用 `Windows Power Management` 电源管理功能）以安装更新。如果\
  \ `Windows Update` 唤醒了系统但发现其正使用电池供电，它将在两分钟后重新休眠，且不安装任何更新。\n\n### 在计划时间始终自动重启\n\n\
  启用后，在 `Windows Update` 安装重要更新后将立即启动重启计时器。它不会提前通知用户任何重启系统的计划。随后你将以分钟为单位设置自己的重启计时器。用户将被提示保存工作，但无论用户希望发生什么，重启都会发生。（如果启用了\
  \ `No Auto-Restart With Logged On Users For Scheduled Automatic Updates Installations`（计划自动更新安装时对于已登录用户不自动重启）策略，则此策略无效。这是“拒绝”始终覆盖其他设置的另一个实例。）\n\
  \n### 配置自动更新\n\n此设置用于配置 `Automatic Updates`（自动更新）的 `Group Policy`。启用后，你可以选择自动下载和安装设置，如果你选择了\
  \ `Auto Download And Schedule The Install`（自动下载并计划安装），你还可以选择在自动维护期间进行这些安装。你还可以配置计划安装的频率和安装时间。参见图\
  \ 6-9。\n\n![配置自动更新的选择比大多数策略更多。httpatomoreillycomsourcemspimages1989073.png.jpg)图\
  \ 6-9. 配置自动更新的选择比大多数策略更多。### 指定内部网 Microsoft 更新服务位置启用后，你可以指定网络上的一个服务器来存放 `Windows\
  \ Updates`。客户端将从该服务器获取更新。如本章前面提到的，这可能是一个 `WSUS` 服务器。较大的网络将使用 `System Center Configuration\
  \ Manager (SCCM)` 服务器。启用此策略时，你需要输入两个完全限定域名 (FQDNs)：* `Set The Intranet Update Service\
  \ For Detecting Updates`* `Set The Intranet Statistics Server`### 自动更新检测频率启用后，你可以指定\
  \ `Windows` 使用多少小时来决定检查可用更新之前等待多久。当你设置一个间隔（例如每 20 小时）时，该间隔实际上计算为该数字的 80%，以留出窗口。对于\
  \ 20 小时，窗口将变为 16 到 20 小时之间。`Windows` 将在此间隔内检查更新。### 不连接到任何 Windows 更新 Internet 位置启用后，客户端将不再尝试获取任何更新，即使来自公共\
  \ `Windows Update` 服务或 `Windows Store`。请注意，由于此策略禁用了这些功能，可能会导致 `Windows Store` 停止工作。###\
  \ 允许非管理员接收更新通知启用后，非管理员将接收更新通知。用户可以安装收到通知的更新。`Policy Settings` 窗口中提供了关于此设置的更多信息。请确保在时间允许的情况下进行审核。参见图\
  \ 6-10。![查看允许非管理员接收更新通知的设置。](img/httpatomoreillycomsourcemspimages1989075.png.jpg)图\
  \ 6-10. 查看允许非管理员接收更新通知的设置。\n\n### 开启软件通知\n\n启用后，当有特色软件更新可用时，用户的计算机上将显示通知消息。特色软件通知来自\
  \ `Microsoft` 更新服务。此功能应仅在松散管理的环境中使用。\n\n### 允许自动更新立即安装\n\n启用后，`Automatic Updates`\
  \ 将下载并准备就绪后立即安装。如果禁用了 `Configure Automatic Updates` 策略，则此策略无效。\n\n### 通过自动更新开启推荐更新\n\
  \n启用后，`Automatic Updates` 将安装推荐更新和重要更新。\n\n### 计划自动更新时对于已登录用户不自动重启\n\n启用后，如果用户已登录，`Automatic\
  \ Updates` 在计划安装期间将不会自动重启计算机。相反，用户将被提示重启计算机。如果禁用或未配置，计算机将通知用户并在五分钟后重启以完成安装。如果禁用了\
  \ `Configure Automatic Updates` 策略，则此设置无效。\n\n### 计划安装时再次提示重启\n\n启用后，在在上一个重启提示被推迟指定的分钟数后，将发生计划重启。如果未设置或禁用，默认间隔为\
  \ 10 分钟。如果禁用了 `Configure Automatic Updates` 策略，则此策略无效。该策略对 `Windows RT` 同样无效。\n\n\
  ### 计划安装延迟重启\n\n启用后，在安装完成后指定的分钟数后将发生计划重启。如果禁用或未配置，默认为 15 分钟。如果禁用了 `Configure Automatic\
  \ Updates` 策略，则此策略无效。\n\n### 重新安排自动更新计划安装\n\n启用后，之前未发生的计划安装将在计算机下次启动后指定的分钟数发生。禁用后，错过的计划安装将与下次计划安装一起进行。如果未配置，错过的计划安装将在计算机下次启动一分钟后发生。如果禁用了\
  \ `Configure Automatic Updates` 策略，则此策略无效。\n\n### 启用客户端目标\n\n启用后，你命指定的目标组将发送到 `内部网\
  \ Microsoft 更新服务器`。该服务器可以配置为按需要向指定的组部署更新。你可能会为所有笔记本电脑用户配置设置，例如，以便指定何时以及如何发送或下载更新。\n\
  \n\n\n\n\n# 允许来自内网 Microsoft 更新服务位置的签名更新\n\n当启用此项后，通过 Microsoft 更新服务器接收的非微软公司的自动更新，如果其使用来自“受信任发布者”证书存储区的证书进行签名，则将被接受。由微软签名的更新也将被安装。当禁用此项或未配置时，只有由微软签名的更新会被安装。\n\
  \n## 思考实验：如何在大型企业中管理 Windows 更新\n\n在这个思考实验中，请应用你从该目标中学到的知识。你可以在本文末尾的“答案”部分找到这些问题的解答。\n\
  \n你所在的机构在过去三年中增长得很大。你以前使用`本地组策略` 管理 Windows 更新，但那时你只有二十多台客户端计算机需要管理。现在你必须管理 65 台客户端计算机，这项任务耗费了太多时间。你希望以更智能的方式、更有效地管理更新。此外，你还希望在让客户端安装更新之前，先在一组配置相似的测试机上进行测试。\n\
  \n1. 你可以部署什么类型的服务器来帮助你管理大型组织中的 Windows 更新？\n2. 你必须启用哪个组策略，以便将客户端计算机指向此新服务器以获取更新？\n\
  3. 你可以在哪里找到此策略？\n\n### 目标总结\n\n* 保持`Windows 8.1` 操作系统尽可能地通过`Windows Store` 更新和`Windows\
  \ 更新`保持最新。\n* 应用`Windows 更新`后，你可以从`Windows 更新`窗口访问这些更新，并在它们引起问题时对其进行回滚。\n* 你可以配置`组策略`来管理组织内计算机如何以及以及何时进行更新。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对该目标信息的掌握情况。你可以在本文末尾的“答案”部分找到这些问题的答案，以及对每个选项正确或错误的解释。\n\n\
  | **问:** | 1\\. 是否可以从 `Windows Store` 中移除允许用户将其 `Windows 8` 计算机升级到 `Windows 8.1`\
  \ 的选项？如果是，如何操作？ |\n1. 不，无法在 `Windows Store` 中移除升级到 `Windows 8.1` 的提示。\\n2. 是的。在“商店”中，点击“设置”小功能，点击“应用更新”，并清除更新到\
  \ `Windows 8.1` 的选项。\\n3. 是的。你必须在此设置`组策略`：`计算机配置`、`管理模板`、`Windows 组件`、`商店`。\\n4.\
  \ 是的，但你必须使用 `AppLocker` 且计算机必须属于 `Active Directory` 域。 |\n| **问:** | 2\\. 关于 `Windows\
  \ 更新`，以下陈述中错误的是哪一个？ |\n1. `Windows 更新` 可以包含设备驱动程序。\\n2. 标准用户在没有 `UAC` 提示的情况下无法安装从\
  \ `Windows 更新` 下载的驱动程序。\\n3.即使你在 `Windows 更新` 的“更改设置”选项中选择了“自动安装更新（推荐）”，并不是所有更新都会被安装。\\\
  n4. 你可以使用`PC 设置`、`更新和恢复`来快速查看客户端机是否已配置为接收更新。 |\n| **问:** | 3\\. 你需要卸载一个导致几台特定客户端出现问题的\
  \ `Windows 更新`。你在“控制面板”中打开了`Windows 更新`。你在任务窗格中点击什么来定位该故障更新并卸载它？ |\n1. `更改设置`\\\
  n2. `查看更新历史`\\n3. `已安装的更新`\\n4. `查看更新历史`和`已安装的更新`都有效。 |\n| **问:** | 4\\. 当启用组策略设置`启用\
  \ Windows 更新电源管理自动唤醒系统安装计划更新`时会发生什么？ |\n1. 启用后，`Windows 更新`将唤醒系统以安装更新。如果`Windows\
  \ 更新`唤醒了系统但发现正在使用电池电源，它将在两分钟后进入休眠状态且不会安装任何更新。\\n2. 启用后，`Windows 更新`将唤醒系统以安装更新。如果`Windows\
  \ 更新`唤醒了系统但发现正在使用电池电源，它将安装更新并将计算机置回休眠模式。\\n3. 启用后，`Windows 更新`将唤醒系统以安装更新。如果正在使用电池电源，它将不会唤醒计算机。\\\
  n4. 启用后，`Windows 更新`将不会唤醒系统以安装更新。 |\n\n## 目标 6.2: 管理本地存储\n\n尽管（特别是考虑到`SkyDrive`（正在重命名为`OneDrive`）的整合以及所有关于域和文件服务器的讨论——似乎已经没有人本地存储任何东西了，但他们确实在存储。即使是依赖云或离线存储的用户，出于其他原因可能仍然使用本地机器或连接的驱动器进行备份。因此，理解如何管理本地存储仍然很重要。在此目标中，你将探索磁盘卷，学习文件系统碎片，并学习一项新功能`存储空间`。\n\
  \n**此目标涵盖了如何：**\n\n* 管理磁盘卷\n* 管理文件系统碎片\n* 管理`存储空间`\n\n### 管理磁盘卷\n\n此目标涉及如何管理现有的硬盘。它可能不会询问如何为使用准备原始磁盘。然而，你应该对此有所了解，至少是为了让你在工作和考试中看到的某些术语上感到从容。因此，在我们深入管理磁盘卷之前，我们将回顾（或向你介绍）一些与磁盘相关的术语。\n\
  \n#### 你需要的术语\n\n当你安装 `Windows 8.1` 时，安装程序会为你配置硬盘。这包括但不限于选择分区样式、磁盘类型、创建所需的卷或分区以及使用所需的文件系统格式化卷。完成这些并在操作系统运行后，你可以对安装期间选择的或自动应用的选项进行更改。\n\
  \n为了充分理解安装是如何实现的以及使用各种磁盘管理工具可以做什么，你需要熟悉以下术语：\n\n* **分区样式**：主引导记录 (`MBR`) 和 GUID\
  \ 全局分区表 (`GPT`)。`MBR` 是 x86 和 x64 位计算机的默认分区样式。`GPT` 可用于 x86 和 x64 位 `Windows 8`\
  \ 计算机，最早在 `Windows Vista` 中引入。在此之前只有 `MBR` 可用。\n\n    ### 提示\n\n    `MBR` 使用表指向磁盘上的位置。它支持最多\
  \ 2 TB 的分区；支持最多四个主分区或三个主分区加扩展分区。隐藏分区包含计算机运行的关键数据。`GPT` 在 `Windows 8.1` 中支持最多 128\
  \ 个主分区和 18 EB 的卷，且关键数据保存在非隐藏分区上。要使用 `GPT`，计算机必须支持扩展固件接口 (`EFI`) 引导。`GPT` 提供了冗余以提高安全可靠性。\n\
  \n* **分区类型**：主分区和扩展分区。这些用于基本磁盘。主分区类型作为独立磁盘运行，可以标记为活动分区，可以托管操作系统，并有自己的驱动器号。扩展分区无法托管操作系统，不能标记为活动分区，可以包含无限数量的逻辑分区。\n\
  \n    ### 提示\n\n    创建扩展分区时，格式化的是其内部的逻辑卷而不是扩展分区本身。逻辑卷可以分配驱动器号。\n\n\n\n\n\n# 卷类型\n\
  \n卷（与分区不同）用于动态磁盘。它们可以是简单、跨卷、条带卷、镜像或独立磁盘冗余阵列（RAID-5）。尽管如此，Windows 8.1 不支持 RAID-5。在多引导系统上无法使用动态磁盘或这里的任何选项。如果你想以这种方式配置基本磁盘，必须将磁盘转换为动态。系统可以为你完成转换。\n\
  \n- **简单 (Simple)**：单个磁盘，可以扩展以创建跨卷或条带卷。如果磁盘故障，磁盘上的数据将丢失。\n- **跨卷 (Spanned)**：由 2\
  \ 到 32 个动态磁盘组成，用于组合这些磁盘的空间。Windows 会填充第一个磁盘，然后写入下一个、再下一个，直到所有磁盘满。\n- **条带卷 (Striped)**：由\
  \ 2 到 32 个动态磁盘组成。数据以条带的形式写入每个磁盘，这会增加写入速度。当数据写入一个磁盘时，其他磁盘正准备接收数据。如果一个磁盘故障，该磁盘上的数据将丢失。\n\
  - **镜像 (Mirrored)**：两个大小完全相同的动态磁盘。数据同时写入两个磁盘以提供容错能力。如果一个磁盘故障，另一个磁盘包含镜像数据，因此数据不会丢失。\n\
  \n# 文件系统\n\nFAT, FAT32, exFat, NTFS。文件系统定义了驱动器的结构方式；首选 NTFS。\n\n### 考试贴士\n\n如果这里的任何术语对你来说都是新的（动态、基本、分区、卷、MBR、GPT），请确保你进行了自己的研究以熟悉它们。有关这些术语的更多信息，请参阅\
  \ MSDN 上的文章：`[`msdn.microsoft.com/en-us/library/windows/desktop/aa363785(v=vs.85).aspx`](http://msdn.microsoft.com/en-us/library/windows/desktop/aa363785(v=vs.85).aspx)`。\n\
  \n## 使用磁盘管理\n\n你已经在第 1 章 中学习了磁盘管理 Microsoft 管理控制台 (MMC) 及其相关的插槽，在那里你学习了如何使用它来创建虚拟硬盘\
  \ (VHD)。在这里，你将进一步探索此控制台，并发现管理现有磁盘的选项，包括查看磁盘列表和磁盘属性，以及创建、管理、缩小和扩展磁盘卷等操作。\n\n打开磁盘管理工具的一种方法是在“运行”对话框中输入\
  \ `compmgmt.msc`。你也可以右键点击开始按钮并点击“计算机管理”来访问。在导航窗中，点击“存储”下的“磁盘管理”。查看图 6-11。在这里你可以看到磁盘列表、状态、卷器号、文件系统类型等。\n\
  \n![磁盘管理控制台允许你查看和更改磁盘属性。](img/diskatomoreillycomsourspimages1989077.png.jpg)图 6-11。磁盘管理控制台允许你查看和更改磁盘属性。\n\
  \n要查看任何磁盘分区或卷的选项，请右键点击它。你将看到不同条目的不同选项。例如，如果你右键点击恢复分区，你只会看到一个选项：帮助。如果你右键点击主分区，你会看到其他选项，包括但不限于更改驱动器号和路径、扩展卷、缩小卷、删除卷、属性等，如图\
  \ 6-12 所示。如果你右键点击卷并点击属性，你将看到一个熟悉的属性对话框，其中包含对各种工具的访问，包括磁盘清理、检查磁盘、磁盘碎片整理程序，甚至在设置配额限制时设置磁盘配额和记录事件的选项。最后，如果你右键点击磁盘框（在图\
  \ 6-11 中标记为磁盘 0 基本 465.64 GB 联联），你将看到转换为动态磁盘和转换为 MBR 磁盘的选项。\n\n不过，在这里的操作是有限制的。例如，如果没有可用空间进行扩展，你就无法扩展分区。然而，你可以缩小现有卷（参见图\
  \ 6-12）并使用创建的空间执行额外任务。如果没有第二个磁盘，你就无法添加镜像。如果该卷是主卷，你就无法删除它，等等。尽管在大多数情况下，如果你选择执行某项任务，就可以完成。\n\
  \n![右键点击活动分区以查看缩小卷等选项。](img/diskatomoreillycomsourspimages1989079.png.jpg)图 6-12。右键点击活动分区以查看缩小卷等选项。\n\
  \n为了向你介绍一些操作，在本节中你将通过以下步骤缩小分区并创建新卷：\n\n1. 打开磁盘管理。\n2. 选择具有额外空间的磁盘。\n3. 右键点击磁盘并点击“缩小”。\n\
  4. 在缩小对话框中，输入要缩小的空间（MB）。\n5. 点击“缩小”。\n6. 注意新建的空间，注意它是未分配的。右键点击它并点击“新建简单卷”。参见图 6-13。\n\
  \n![在未分配空间上可以创建新卷。](img/diskatomoreillycomspimages1989081.png.jpg)图 6-13。在未分配空间上可以创建新卷。\n\
  \n7. 点击“下一步”启动简单卷向导。再次点击“下一步”接受卷大小默认值（你可以输入自己的大小）。\n8. 点击“下一步”接受分配的驱动器号或选择新字母。\n\
  9. 选择格式化卷的方式。NTFS 最佳。为卷输入新名称（默认认为新建卷）并点击“下一步”。参见图 6-14。\n\n![设置文件系统和卷标签。](img/diskatomoreillycomspimages1989083.png.jpg)图\
  \ 6-14。设置文件系统和卷标签。\n\n10. 点击“完成”。\n11. 注意磁盘列表中的新磁盘条目。然后，打开资源管理器，点击“此电脑”，并在那里查看新简单卷。\n\
  \n为了进一步探索，在磁盘管理中，右键点击新卷。注意现在可以使用“删除卷”，“格式化”也可用。你还可以将数据保存到此新卷，就像对待 USB 驱动器或外部备份设备一样。\n\
  \n## 使用 Diskpart\n\n磁盘管理控制台是处理磁盘的友好方式。然而，在那里的操作是有限的，至少与命令行工具（包括 `Diskpart.exe`）可以实现的相比。网络管理员在希望使用脚本和批处理文件自动化磁盘任务时使用此工具。\n\
  \n### 更多信息：或者，你可以使用 Windows PowerShell 命令\n\n\n\n\nDiskpart 是一个命令行工具，但你也可以使用 Windows\
  \ PowerShell 命令。请确保至少复习其中的几个命令，包括 `Format-Volume`、`New-Partition`、`Set-Disk` 和 `Set-Partition`。\n\
  \n`Diskpart` 有许多命令参数，如果你以前创建过可启动的 USB 驱动器，你可能对其中一些参数非常熟悉。如果你创建过，你可能会认出 `Create Partition`、`Select\
  \ Partition`、`Active`、`Format` 等命令。你可以在具有权限的命令提示符中输入 `Diskpart` 并按回车键来查看所有命令选项。当你看到\
  \ `DISKPART>` 提示符时，输入 `Help` 并按回车。请参图 6-15](\n\n![查看 Diskpart 命令行参数。](img/httpatomoreillycomsourcemspimages1989085.png.jpg)图\
  \ 6-15. 查看 Diskpart 命令行参数。\n\n虽然你需要熟悉所有的 `Diskpart` 参数，但这里有几个你应该特别关注的参数：\n\n* `Active`。将所选分区标记为活动分区。\n\
  * `Add`。向简单卷添加镜像。\n* `Assign`。为所选卷分配驱动器号。\n* `Convert`。在基本磁盘和动态磁盘之间转换。（从基本到动态转换可以在不丢失数据的情况下完成；反之则不然。）\n\
  * `Create`。创建卷、分区或虚拟磁盘。\n* `Exit`。退出 Diskpart。\n* `Extend`。扩展卷。\n* `Format`。格式化卷或分区。（你可以使用类似\
  \ `FORMAT FS=NTFS LABEL=”New Volume” QUICK COMPRESS` 的命令将 FAT 分区转换为 NTFS。）\n* `Shrink`。减小卷的大小。\n\
  \n#### 更多信息：Diskpart 参数\n\n若要复习所有的 `Diskpart` 命令行参数，请参阅文章 [`technet.microsoft.com/en-us/library/cc766465(v=WS.10).aspx`](http://technet.microsoft.com/en-us/library/cc766465(v=WS.10).aspx)。\n\
  \n### 考试提示\n\n这可能可能出现在考试中，但每位网络管理员都应该熟悉如何使用 Windows ADK、Windows PE 以及各种 `Diskpart`\
  \ 命令创建可启动的 USB 闪存器。复习这篇文章以学习如何：[`technet.microsoft.com/en-us/library/hh825109.aspx`](http://technet.microsoft.com/en-us/library/hh825109.aspx)。\n\
  \n#### 检查磁盘和磁盘清理\n\n检查磁盘（Check Disk）和磁盘清理（Disk Cleanup）两个工具通过不同的方式帮助你管理磁盘。检查磁盘将扫描物理磁盘，查找错误并自动修复（大多数情况下）。具体而言，检查磁盘会查找坏存储块。你可以选择扫描驱动器，如果发现错误，系统将提示你重启计算机让\
  \ Windows 修复它们。运行的命令行是 `Chkdsk`。你也可以从驱动器属性对话框的“工具”选项卡中访问此工具。\n\n磁盘清理也是一种磁盘管理工具，你可以通过删除临时文件、清空回收桶、删除下载的程序文件等来清理驱动器。你可以从驱动器属性对话框的“常规”选项卡中访问磁盘清理。请参图\
  \ 6-16](\n\n![磁盘管理工具位于驱动器的属性对话框中。](img/httpatomoreillycomsourcemspimages1989087.png.jpg)图\
  \ 6-16. 磁盘管理工具位于驱动器的属性对话框中。\n\n#### 管理文件系统碎片\n\n数据是以簇为单位顺序写入物理旋转磁盘的，方向是从外向向内。当磁盘是新的时，数据是连续写入的，但随着数据的添加和删除，某些区域会变成。数据也会写入这些空区域，最终导致数据变成碎片（存储在非连续的段或簇中）。当磁盘必须在多个处查找数据并提供给用户时，比数据存储在一起时需要更长时间。因此，保持磁盘碎片整理是最优的。\n\
  \n磁盘碎片整理工具会自动在后台运行，以保持你的驱动器无碎片，但你也可以随时手动运行它（不过请确保先进行完整备份）。与磁盘清理和检查磁盘一样，你可以从驱动器属性对话框的“工具”选项卡中访问磁盘碎片整理。当你点击“优化”时，你将看到图\
  \ 6-17](从那里，你可以分析任何驱动器或点击“优化”运行磁盘碎片整理。你还可以点击“更改设置”来选择方式和时间。\n\n![磁盘碎片整理默认每周运行，但你可以根据需要随时分析并运行自己的扫描。](img/httpatomoreillycomsourcemspimages1989089.png.jpg)图\
  \ 6-17. 磁盘碎片整理默认每周运行，但你可以根据需要随时分析并运行自己的扫描。\n\n#### 存储空间\n\nStorage Spaces 是 Windows\
  \ 8 新引入的功能，它通过组合多个磁盘的空闲空间来创建虚拟磁盘。在使用此功能之前，你必须按照以下步骤创建一个存储池：\n\n1. 连接要使用的磁盘。在设置之前，先格式化它们。\n\
  2. 打开控制面板，点击“系统和安全”，点击“存储空间”。\n3. 点击“新建池和存储空间”。\n4. 选择要使用的磁盘复选框并点击“创建池”。\n5. 在“创建存储空间”窗口中，进行其他配置，如池名称、冗余类型、容量等。点击“创建存储空间”。注意：\n\
  * 你不能将包含操作系统的磁盘作为存储空间的一部分。\n* 使用 ATA (SATA) 或串域 SCSI (SAS) 连接的磁盘是可以接受的。\n* 如果使用了\
  \ RAID 器，必须禁用 RAID 功能。\n* 可以使用 USB 闪存器，但建议使用 USB 3.0 驱动器。\n* 使用 USB 2.0 驱动器时，请直接插入电脑，不要使用\
  \ USB 集线器。\n* 存储空间有简单（无冗余）、镜像和校验。双路镜像在两个驱动器上镜像数据；三路镜像在三个驱动器上镜像数据。校验允许两个磁盘存储数据，第三个磁盘存储校验信息以实现冗余。当你从单个磁盘创建存储空间时，没有冗余。\n\
  * 你可以使用 Windows PowerShell 管理存储空间。复习常用的 PowerShell 命令，包括 `Set-PhysicalDisk`、`Repair-VirtualDisk`\
  \ 和 `Remove-PhysicalDisk`。\n* 在适当的情况下，你可以使用存储空间代替昂贵的存储区域网络 (SAN) 设备。\n* 如果你移动存储池，必须保持池在一起。\n\
  * 如果删除并尝试重新使用用作存储空间的磁盘，必须先对其进行格式化。\n\n要使用此功能，首先需要按照以下步骤创建一个存储池：\n\n\n\n\n在创建存储空间时，可以创建一个大于已安装驱动器容量的空间，以便使用名为“精配配置”（thin\
  \ provisioning）的功能。当你这样做时，如果需要更多空间，系统会提示你。\n\n## 思考实验：选择容错磁盘配置\n\n在这一思考实验中，请运用你在该目标中所学的知识。你可以在章末的“答案”部分找到这些问题的解答。\n\
  \n你的客户有一台运行 Windows 8.1 的电脑，安装了两个物理磁盘。它们被配置为基本磁盘（basic disks）。他希望使用这些磁盘来保护他的数据。最重要的是解决方案能够提供容错能力，但降低成本并让恢复尽可能快速、方便也同样重要。他不担心读写性能，因为电脑配备了充足的\
  \ RAM 和 CPU 资源。\n\n1. 在简单（simple）、条带（striped）、跨（spanned）、镜像（mirrored）或 RAID-5 磁盘中，你建议客户使用哪一种？\n\
  2. 用户是否需要安装额外的磁盘，或在该解决方案上花费费用？\n3. 为了实现你在问题 1 中选择的解决方案，关于这两块硬盘的大小，必须满足什么条件？\n4.\
  \ 当你实施你的计划时，这些基本磁盘会发生什么？\n\n### 目标总结\n\n* `Diskpart` 允许你从命令行管理磁盘。你可以使用该工具自动执行任务，并执行\
  \ `磁盘管理`（Disk Management）程序中无法执行的任务。\n* `磁盘清理`（Disk Cleanup）、`检查`（Check Disk）和`磁盘碎片整理`（Disk\
  \ Defragmenter）通过删除不需要的数据、修复坏扇区以及防止文件碎片来帮助维护磁盘。\n* `存储空间`（Storage Spaces）允许你使用各种类型的外部磁盘（包括\
  \ SATA 驱动器和 USB 闪存驱动器）创建存储池。\n\n### 目标回顾\n\n回答以下问题以测试你对该目标信息的掌握情况。你可以在章末的“答案”部分找到这些问题的答案以及对每个选项正确或错误的解释。\n\
  \n| **问：** | 1\\. 你有一台 Windows 8.1 电脑，配有一个 512 GB 的单固态硬盘。你还有两个容量为 4 TB 的外部驱动器。你如何为这两个额外驱动器配置\
  \ `存储空间`？ | 1. 创建一个 8 TB 三路镜像。2. 创建一个 4 TB 三路镜像。3. 创建一个 8 TB 三路校验。4. 创建一个 4 TB 两路镜像。5.\
  \ 以上均非。 |\n| **问：** | 2\\. 你有几个 USB 闪存驱动器，其中包含你需要删除的数据。你还想删除分区表以完全擦除驱动器。你应该使用哪种命令行实用程序？\
  \ | 1. `Diskpart` 2. `Fsutil` 3. `Format` 4. `Diskpart` 或 `Format` |\n| **问：** |\
  \ 3\\. 你怀疑电脑的硬盘出了问题，想要扫描磁盘、定位错误并修复它们。你使用哪种工具？ | 1. `Fsutil` 2. `Chkdsk` 3. `磁盘清理`\
  \ 4. `磁盘碎片整理` 5. `Diskpart` 6. `磁盘管理` 程序 |\n| **问：** | 4\\. 你需要通过提高数据写入速度来提升电脑性能。你添加了四块硬盘。你应该如何配置这些磁盘以缩短写入时间？\
  \ | 1. 配置为跨区卷的动态磁盘 2. 配置为条带卷的动态磁盘 3. 配置为镜像卷的基本磁盘 4. 配置为主分区卷的基本磁盘 5. 配置为镜像卷的动态磁盘\
  \ |\n\n## 目标 6.3：监控系统性能\n\n一旦电脑系统完成配置并受了保护，你就需要监控系统性能，以确保这些系统运行有效且高效。有很多可用工具可以帮助你。在本目标中，你将学习其中一些工具，特别是考试将涵盖的工具，包括`任务管理器`（Task\
  \ Manager）和`性能监视器`（Performance Monitor）。\n\n**本目标涵盖如何：**\n\n* 配置`任务管理器`\n* 监控系统资源\n\
  * 配置索引选项\n* 配置并分析事件日志\n* 配置事件订阅\n* 优化网络性能\n\n### 配置任务管理器\n\n`任务管理器` 是 Windows 8.1\
  \ 中最实用的工具之一。`任务管理器`允许你管理使用系统资源的进程（离散任务），并查看这些资源受这些活动进程的影响。由于其操作简单，终端用户可以使用它结束出现问题的进程、禁用不需要在启动时运行的程序、查看登录用户等。由于它是一个如此强大且功能丰富的工具，即使是最精练的网络管理员也可以用它快速监控、诊断和改进电脑性能。\n\
  \n由于运行进程对系统性能至关重要，`任务管理器`经过了重新设计，你可以看到进程树，它将相关的进程组合在一起。整个界面也变得更加用户友好。`任务管理器` 有七个标签卡。你需要知道如何使用这些标签卡中的每一个来提高性能，并在考试之前熟练掌握每个标签卡的功能。打开`任务管理器`\
  \ 有多种方法，但简单的方法是使用 `Ctrl+Shift+Esc` 组合键。现在在你自己的电脑上打开`任务管理器`，并在阅读本节其余内容时探索这些标签卡。\n\
  \n#### 进程标签卡\n\n进程标签卡显示所有运行中的进程，并以进程树的形式分组。带有树的进程旁边有一个向右的箭头。点击箭头查看相关进程。当你想要关闭它时，点击单个进程或进程树名称并点击`结束任务`。\n\
  \n你可以根据资源使用情况对进程进行排序。如图 6-18 所示，商店（Store）正在使用 53.5 MB 内存。如果你认为 Store 应用引起了问题，可以点击`结束任务`来终止并关闭它。另注意图\
  \ 6-18，在 Store 下方，Internet Explorer 正在使用 47.8 MB 内存，旁边有一个向右的箭头，显示它包含一个进程树。\n\n![使用进程标签卡选择并结束问题进程。](img/httpatomoreillycomsourspimages1989091.png.jpg)\
  \ 图 6-18。使用进程标签卡选择并结束问题进程。\n\n#### 性能标签卡\n\n性能标签卡显示 CPU、内存、磁盘、以太网、蓝牙和 Wi-Fi 使用的实时统计数据。图\
  \ 6-19 显示了选择了 Wi-Fi 的标签卡。在图表下方你可以看到适配器名称、服务集标识符 (SSID)、域名服务 (DNS) 名称、连接类型、IPv4 和\
  \ IPv6 地址以及信号强度。右键点击左侧的任何项目并点击`摘要视图`可以将窗口最小化并仅显示左窗。这样做可以让你监控使用情况，而不会占用过多桌面区域。\n\n\
  ![在性能标签卡查看实时统计数据。](img/httpatomoreillycomsourspimages1989093.png.jpg) 图 6-19。在性能标签卡查看实时统计数据。\n\
  \n#### 历史标签卡\n\n应用历史标签卡显示与应用（而非桌面应用）相关的使用情况。所有应用都显示在此处，即使它们当前没有在使用。你可以使用此标签卡来确定这些应用对系统造成的负载。这里的列包括\
  \ CPU 时间、网络、计费网络和磁贴更新。像进程标签卡一样，你可能会看到相关的树。例如，邮件、日历和人员应用旁边有一个向右的箭头。你可以双击此处的任何条目来打开或切换到该应用。\n\
  \n#### 启动标签卡\n\n\n\n\n\n启动选项卡显示了计算机启动时运行的应用程序。你可以选择此处列出的任何应用程序并禁用它，以防止其在 Windows\
  \ 启动时运行。一旦禁用，你可以返回此选项卡将其启用。你还可以查看由应用程序引起的启动影响，该影响可以被标记为“无”、“低”、“中”或“高”；其状态（已启用或已禁用）；以及更多信息。你还可以右键点击任何条目以打开其文件所在位置。\n\
  \n### 考试提示\n在之前的操作系统版本中，你可以在“运行”对话框中输入 `msconfig.exe` 来打开“系统配置”对话框（你仍然可以这样做），并从那里点击“启动”选项卡来配置\
  \ Windows 启动时运行哪些应用程序。如果你现在这样做，在系统配置对话框的“启动”选项卡上，你只会看到一个选项：打开任务管理器。\n\n### 用户选项卡\n\
  用户选项卡显示所有登录到计算机上的用户，包括远程登录的用户。你可以展开与任何用户相关的树（点击向右箭头）来查看该用户打开的进程。你可以选择这些进程中的任何一个并点击窗口底部的“结束任务”来终止它们，还可以点击该用户的名称并点击“断开连接”来断开用户。当你使用断开连接命令时，活动用户将收到提示。\n\
  \n### 详细信息选项卡\n详细信息选项卡显示了以前版本任务管理器进程选项卡显示的内容。你可以右键点击任何进程以结束任务、结束进程树、设置优先级、设置相关性、创建转储文件等。与其他选项卡一样，你可以点击任何类别名称来对列表进行排序。参见图\
  \ 6-20。\n\n![使用右键点击在详细信息选项卡上结束任务和进程。](img/httpatomoreillycomsourcemspimages1989095.png.jpg)图\
  \ 6-20. 使用右键点击在详细信息选项卡上结束任务和进程。\n\n### 服务选项卡\n服务选项卡显示所有启用的服务。与其他选项卡一样，你可以右键点击服务来执行任务。选项包括启动、停止、重启、打开服务、在线搜索和转到详细信息。\n\
  \n### 考试提示\n探索任务管理器每个选项卡的底部。记住在“性能”选项卡上有一个“打开资源监视器”选项，在“服务”选项卡上有一个“打开服务”选项。\n\n\
  ### 监控系统资源\n资源监视器是一个强大的工具，你可以用它查看比任务管理器提供的更多实时资源统计数据。你可以在任务管理器的性能选项卡上打开资源监视器，也可以通过许多其他方式（包括从开始屏幕搜索）。你也可以在“运行”对话框中输入\
  \ `resmon.exe` 直接启动它。一旦打开，你需要花时间查看每个选项卡。\n\n图 6-21 显示了资源监视器、概述选项卡、可用图表（任何选项卡可用）以及当你右键点击已挂起的进程时会发生什么。挂起的进程可能会导致问题，因此如果你看到它们，请注意。\n\
  \n在大多数情况下，你使用资源监视器来解决无法使用任务管理器和其他工具发现和解决的问题。例如，在“内存”选项卡上，你可以根据分配给进程的内存量对其进行排序。你可能会发现某个进程正在使用大量内存并存在问题。你可能甚至不需要运行该应用程序。从那里你可以右键点击结束进程，然后返回任务管理器的“启动”选项卡，停止其在\
  \ Windows 启动时运行，以防止未来发生该问题。这也减少了内存负载，从而提高计算机性能。正如你在图 6-21 所示，有四个图表：CPU、磁盘、网络和内存。这些也显示了实时信息。\n\
  \n![资源监视器让你查看硬件组件的实时图表。](img/httpatomoreillycomsourcemspimages1989097.png.jpg)图\
  \ 6-21. 资源监视器让你查看硬件组件的实时图表。\n\n### 更多信息：你应该熟悉的资源监视器术语\n当你探索每个选项卡时，你会看到许多关于资源监视器需要了解的术语，包括\
  \ `PID`（应用程序的进程 ID）和 `Commit`（应用程序提交的内存量）。这里没有足够的空间讨论所有术语，所以你必须自己完成这项任务。你可以从 TechNet\
  \ 上的文章学习资源监视器：*[`technet.microsoft.com/en-us/library/dd883276(WS.10).aspx`](http://technet.microsoft.com/en-us/library/dd883276(WS.10).aspx)*。\n\
  \n### 配置索引选项\nWindows 8.1 对计算机上的文件、文件夹、文档和其他数据进行索引，以便在需要时快速找到这些数据。默认情况下，某些区域会被索引，包括与用户和应用程序数据相关的数据。你可以从“索引选项”控制哪些内容被索引。如果你将文件存储在未进行索引的硬盘上，则需要这样做。你还可以根据需要添加或删除位置。在开始屏幕上输入\
  \ `Index` 并点击“索引选项”，即可查看如图 6-22 所示的索引选项对话框。\n\n![索引以减少检索数据的时间。](img/httpatomoreillycomsourcemspimages1989099.png.jpg)图\
  \ 6-22. 索引以减少检索数据的时间。\n\n#### 注意：不要索引所有内容\n虽然你可能认为索引整个硬盘会提高性能，但不会。索引的大小（如果包含程序和应用程序文件）将阻碍搜索。\n\
  \n当你点击图 6-22 中的“修改”时，你可以清楚地看到哪些内容正在索引，并可以点击“显示所有位置”查看任何默认隐藏的位置。从那里，你可以取消勾选认为不需要索引的项目的复选框。你还可以点击任何向右箭头来查看父文件夹可用的子文件夹，并从那里添加要索引的区域。图\
  \ 6-23 显示了此。\n\n![你可以选择要索引的内容。](img/httpatomoreillycomsourcemspimages1989101.png.jpg)图\
  \ 6-23. 你可以选择要索引的内容。\n\n最后，在“索引选项”对话框中，你可以点击“高级”。“高级选项”对话框有两个选项卡：“索引设置”和“文件类型”。索引设置”选项卡允许你添加或排除加密文件、将相似单词视为不同单词、删除并重建索引（如果索引损坏）以及更改索引位置。“文件类型”选项卡允许你排除任何想要的文件类型，那里可能列出了数百种类型。你可以选择不索引特定类型的文件，也可以添加\
  \ Windows 目前未列出的文件类型。某些程序创建专有的文件格式，你需要手动将它们添加到索引中。\n\n### 配置和分析事件日志\n\n\n\n\n\n\
  另一种管理和维护计算机性能的方法是使用 `Event Viewer`（事件查看器）分析 Windows 日志。这些日志包括应用程序、安全、安装、系统和转发事件。这些日志可以帮助你发现那些在其他地方难以诊断、甚至无法诊断的问题。\n\
  \n你可以通过多种方式启动 `Event Viewer`，包括从开始屏幕搜索它、将其作为单元插程序添加到 `MMC` 中，以及从管理工具窗口或计算机管理控制台打开它。你已经学习了如何在第\
  \ 4 节 中配置对象访问审核、在事件发生时设置警报等内容。因此，如果你从头到尾读完这本书，你已经对 `Event Viewer` 有了相当深入的了解。\n\n\
  你在这里将探索的每条日志都提供了关于发生事件及其重要性的信息。在查看日志时，你会看到以下层级的事件：\n\n* `Information`（信息）。标记为 `Information`\
  \ 的事件是正常事件，但记录这些日志是为了提供与组件或过程相关的更改信息。\n* `Error`（错误）。这些事件警告发生了问题，但该问题可能不会影响被调用组件的性能。不过，它可能会影响其他组件的性能。\n\
  * `Warning`（警告）。这些事件警告你可能需要处理的问题（除非日志条目中另有说明）。如果如果不解决，可能会导致后续问题。\n* `Critical`（严重）。这些事件警告组件发生了灾难性的故障或功能丢失。这些事件必须迅速处理。\n\
  * `Verbose`（详细）。这些事件仅提供与进度或成功相关的信息，并不暗示发生或可能发生任何问题。\n\n与你目前为止看到的其他列表（包括你之前在 `Task\
  \ Manager` 中查看的列表）一样，你可以通过点击日志顶部的任何类别标题（日期和时间、源、级别等）来对任何日志的条目进行排序。图 6-24 显示了应用程序日志。\n\
  \n![事件日志提供了关于事件的信息，包括发生了什么级别的事件。](img/httpatomoreillycomsourcemspimages1989103.png.jpg)图\
  \ 6-24. 事件日志提供了关于事件的信息，包括发生了什么级别的事件。\n\n确保你熟悉默认日志：\n\n* `Application`（应用程序）。此日志包含与计算机上安装的应用程序相关的条目。\n\
  * `Security`（安全）。此日志包含与安全事件相关的条目，包括由于审核事件导致的成功和失败。的事件通过本地计算机策略和组策略中的审核策略进行配置。\n\
  * `Setup`（安装）。此日志包含与系统安装和设置历史相关的条目。\n* `System`（系统）。此日志包含与操作系统相关的条目。条目可能与未按预期启动的服务或设备驱动程序的故障有关。\n\
  * `Forwarded Events`（转发事件）。此日志包含你使用订阅自行创建的事件。你将在本节稍后学习如何创建订阅。\n\n你可能希望探索 `Event\
  \ Viewer` 并确保你理解界面提供的可用功能、如何配置不同的视图、如何创建自定义视图、如何使用这些视图添加和删除列等。操作窗格提供了你需要的熟悉的工具，包括但不限于保存日志、清除日志、打开已保存日志以及向事件挂载任务。与本书的其他区域一样，这里涵盖的内容太多了，因此取决于你自己学习哪些可用功能。然而，为了完整起见，以下是创建仅显示\
  \ `System` 日志中创建 `Critical` 事件的自定义视图所需的步骤。\n\n要在 `Event Viewer` 中创建自定义视图，请遵循以下步骤：\n\
  \n1. 打开 `Event Viewer`。\n2. 点击 `Action` 菜单并点击 `Create Custom View`。\n3. 在 `Filter`\
  \ 选项卡上，对于 `Event Level` 选择 `Critical`（你也可以选择额外的条目）。\n4. 在 `Event Logs` 窗口中，从 `By\
  \ Log` 选项点击箭头，展开 `Windows Logs` 并勾选 `System` 复选框（你也可以选择额外的条目）。\n5. 点击列表外部以将其隐藏。\n\
  6. 可选地包含 `Keywords`、`User` 或 `Computer(s)` 的条目；点击 `OK`。查看图 6-25\n![创建自定义日志。](img/httpatomoreillycomsourcemspimages1989105.png.jpg)图\
  \ 6-25. 创建自定义日志。\n7. 为日志输入一个名称（可能是 `Critical System`）并点击 `OK`。\n8. 注意记录任何条目。\n\n\
  ### 配置事件订阅\n\n你可以使用 `Event Viewer` 进行对本地计算机上已记录事件的排序或创建自定义视图。当你将 `Event Viewer`\
  \ 单元插程序添加到 `MMC` 时，你还可以选择查看其他计算机的事件日志。不过，正如你可能经历过的，这些日志（无论是本地还是远程计算机上的）非常繁琐，因为它们包含了大量的条目。当你只想从其他计算机接收有关特定事件的信息时，你可以创建事件订阅。不过，首先需要了解几个术语：\n\
  \n* `Subscription`（订阅）。订阅是你配置的一组符合你命名的特定标准的事件。你配置订阅是为了从其他计算机接收事件。\n* `Source`（源）。源计算机是你想要从中获取事件的计算机。源计算机通常是你需要进行远程管理的计算机。\n\
  * `Collector`（收集者）。收集者是你想要查看事件的计算机。收集者通常是你订阅事件所在的计算机或网络工作站。\n\n你可以创建两种类型的订阅：\n\n\
  * `Collector initiated`（收集者发起）。你的收集者计算机配置为接收来自源计算机的事件。这用于较小的网络，因为必须手动配置。\n* `Source\
  \ computer initiated`（源计算机发起）。源计算机配置为将其事件发送到收集者计算机。这用于大型网络，因为你可以使用组策略进行配置。\n\n在配置任何订阅之前，你必须配置两个计算机以运行所需的服务。你不能直接远程管理计算机。你必须首先在源计算机上启用名为\
  \ `Windows Remote Management` 的服务。该服务允许远程管理计算机。你必须在收集者计算机上启用名为 `Windows Event Collector`\
  \ 的服务。该服务允许收集者计算机从远程计算机收集事件。\n\n在查看订阅的收集者计算机上，执行以下步骤：\n\n1. 打开命令行命令提示符。\n2. 输入 `wecutil\
  \ qc` 并按回车。\n3. 在提示时输入 `Y` 并按回车启动服务。\n注意记录：Windows Event Collector 服务配置成功。\n4. 关闭命令提示符窗口。\n\
  \n在收集事件的源计算机上，遵循以下步骤：\n\n1. 打开命令行命令提示符。\n2. 输入 `winrm quickconfig` 并按回车。\n3. 在提示时输入\
  \ `Y` 并按回车；在提示时重复此操作。\n注意记录：已启用 WinRM 防墙异常。\n4. 关闭命令提示符窗口。\n\n### 提示\n\n为了成功配置事件日志订阅，两个计算机的防火墙都必须配置为允许\
  \ TCP 端口 80 (HTTP) 或 TCP 端口 443 (HTTPS) 的流量。\n\n\n\n\n请记住，你可以创建两种类型的订阅：收集器启动的和源计算机启动的。按照以下步骤创建一个由源计算机启动的订阅：\n\
  \n1. 打开事件查看器（Event Viewer）。\n2. 右键点击 `Subscriptions`（订阅）节点并点击 `Create Subscription`（创建订阅）。\n\
  3.为订阅输入名称。\n4. 选择 `Source Computer-Initiated`（源计算机启动）并点击 `Select Computer Groups`（选择计算机组）。参见图\
  \ 6-26。\n   ![创建源计算机启动的订阅。](img/httpatomoreillycomsourcemspimages1989107.png.jpg)图\
  \ 6-26. 创建由源计算机启动的订阅。\n5. 根据情况点击 `Add Domain Computers`（添加域计算机）或 `Add Non-Domain\
  \ Computers`（添加非域计算机）。\n6. 输入计算机名称并点击 `OK`。你在这里需要的操作取决于第 5 步中的选择。\n7. 如果出现提示，请执行其他步骤，例如添加证书、输入凭据等。\n\
  8. 点击 `Select Events`（选择事件）（显示在图 6-26 中）。\n9. 在 `Event Level`（事件级别）中选择 `Critical`（关键），选择要监控的日志，添加关键词等，详细信息请参考早些在创建\
  \ `Custom Logs`（自定义日志）时介绍的内容。\n10. 点击 `OK` 再次点击 `OK`。\n\n在你完成创建源计算机启动的（source computer–initiated）订阅的过程后，你必须启用源计算机以转发其事件。该设置位于\
  \ `Group Policy`（组策略）中的：`Computer Configuration`（计算机配置）、`Policies`（策略）、`Administrative\
  \ Templates`（管理模板）、`Windows Components`（Windows 组件）、`Event Forwarding`（事件转发）。你将启用\
  \ `Configure Target Subscription Manager`（配置目标订阅管理器）并在那里输入相关信息。\n\n### 考试提示\n\n\
  管理计算机性能的工具比本章详细介绍的要多得多。在参加考试之前，你应该复习所有可用工具。访问其中一些工具的方法是打开 `Administrative Tools`（管理工具）。从那里，深入探索\
  \ `Resource Monitor`（资源监视器）和 `Performance Monitor`（性能监视器），以及 `System Configuration`（系统配置）和\
  \ `System Information`（系统信息）。此外，在启动屏幕搜索 `Reliability Monitor`（可靠性监器）并点击 `View Reliability\
  \ History`（查看可靠性历史）。这是你回顾计算机可靠性和问题历史的地方。最后，确保检查一下 `Windows Experience Index`（Windows\
  \ 体验索引）；你可以在控制面板的 `Performance Information And Tools`（性能信息和工具）窗口中找到它。\n\n### 优化网络性能\n\
  \n用户期望每天、每周、每年的网络运行时间都是 100%。这可能是你在性能方面面临的最大挑战之一，因为当网络中断时，所有人都会注意到，工作也会停滞。你必须不惜代价维护网络组件，以确保网络性能处于最佳状态。\n\
  \n有几点需要注意：\n\n* 启用 `Windows Update` 并确保定期检查可选更新。你可能会在那里发现驱动程序更新。\n* 检查 `Action Center`（操作中心）查看是否已找到已知问题的解决方案。\n\
  * 保持路由器、调制器以及任何其他可用硬件的固件和只读存储器（`ROM`）更新。\n* 如果使用 `Ethernet`（以太网），确保电缆完好且远离用户的椅子、桌子和其他可能损坏的地方。\n\
  * 对于 `Wi-Fi`，偶尔检查访问点的位置，以确保它们放置位置优化。\n* 将网络硬件远离任何可能干扰其信号的物体，包括发出无线信号的其他电子设备、墙壁和能量源。\n\
  * 当有更好的设备可用时（路由器、调制器、线缆、网卡等），请更新硬件。\n* 了解可以使用哪些工具来排除网络故障，并按从简单到复杂的顺序进行排序。在故障排除期间，从最简单的解决方案开始，按照你的列表逐一解决。\n\
  \n此外，在尝试任何涉及向导或工具的故障排除之前，请检查这些常见问题：\n\n* 损坏、松动或其它损坏的电缆\n* 不正常工作的网卡\n* 不正常工作的电源或电源插座\n\
  * 病毒\n* 失败的新设备驱动程序或糟糕的设备驱动程序\n* 配置不当的防火墙、安全、`Group Policy` 和其他设置\n* 意外（或预期）的数据流量激增，例如所有用户在早上\
  \ 8 点登录工作站时\n* 互联网服务提供商 (`ISP`) 的中断\n\n#### 基础故障排除工具\n\n你可能熟悉 Windows 中提供的最基础的故障排除工具。任务栏上有一个图标显示网络不可用。你可以右键点击任务栏上的网络图标以访问故障排除向导（点击\
  \ `Troubleshoot Problems`）或打开 `Network And Sharing Center`（网络和共享中心）。当你选择前者时，会打开\
  \ `Windows Network Diagnostics Wizard`（Windows 网络诊断向导），如果 Windows 没有自动检测到问题，它可以让你说明你遇到的问题类型（图\
  \ 6-27）。后者打开的中心，你可以在其中查看最基本的配置，包括计算机是否连接到 Internet、是否是家庭组的一部分、是否是公共或私有网络等。\n\n如果\
  \ `Windows Network Diagnostics Wizard` 没有解决你的问题，在转向更高级的工具之前，还有几个选项可以尝试。返回第 3 章，并复习允许重新配置网络连接（network\
  \ connectivity）的选项。\n\n![Windows 网络诊断向导让你说明你遇到的问题类型。](img/httpatomoreillycomsourspimages1989109.png.jpg)图\
  \ 6-27. Windows 网络诊断向导让你说明你遇到的问题类型。\n\n#### Performance Monitor\n\nPerformance Monitor（`perfmon.exe`）允许你查看计算机的当前性能。你看到的是快照，但你可以使用这些信息发现难以诊断的网络问题。例如，你可以监控与网络适配器和网络接口相关的特定性能数据。你还可以监控与物理接口相关的统计数据。你可以包括\
  \ `TCP/IP` 性能诊断。你可以通过添加你想要观察的计数器来创建自己的视图。\n\n要了解可以添加哪些计数器，请打开 `Performance Monitor`\
  \ 并按照以下步骤浏览内容：\n\n1. 在 `Run` 对话框中输入 `perfmon.exe` 并按回车。\n2. 在左窗格中，点击 `Performance\
  \ Monitor`。注意已配置的计数器：`%ProcessorTime`。\n3. 右键点击图表内部并点击 `Add Counters`。参见图 6-28。\n\
  \   ![选择要监控的统计数据的计数器。](img/httpatomoreillycomsourcemspimages1989111.png.jpg)图 6-28.\
  \ 选择要监控的统计数据的计数器。\n4. 虽然你可以浏览其他计算机，但请验证 `Select Counters From Computer` 窗口选择了 `Local\
  \ Computer`。\n5. 在 `Local Computer` 下，点击 `Network Interface` 旁的箭头。\n6. 点击 `Bytes\
  \ Total/sec`。参见图 6-29。\n7. 点击 `Add`。\n8. 如果需要，在 `Instances Of Selected Objects`\
  \ 下选择一个选项。\n\n\n\n\n9. 重复此操作以添加任何你想要查看的计数器。\n\n10. 完成后点击“确定”。\n\n![添加计数器以选择监控的统计数据。](img/Addatomoreillycomsourcemspimages1989113.png.jpg)\
  \ 图 6-29。添加计数器以选择监控的统计数据。\n\n11. 在图表中，点击任何线条即可查看其代表的内容；在图表下方的列表中，点击任何线条即可查看其在图表上的显示。\n\
  \n12. 取消选择任何计数器实例以将其从图表中隐藏。\n\n13. 在图表内部右键单击，可以配置属性、保存图像、删除所有计数器等操作。\n\n### 更多信息：性能监视器中的计数器\n\
  \n有关`Performance Monitor`（性能）中可用计数器的更多信息，请参阅此 TechNet 文章：`[`technet.microsoft.com/en-us/library/cc749249.aspx`](http://technet.microsoft.com/en-us/library/cc749249.aspx)`。\n\
  \n关于`Performance Monitor`你还有很多可以学习的内容，包括如何创建`Data Collector Sets`（数据收集集）。`Data Collector\
  \ Set`可用于监控整合到日志中的多个数据收集。你可以配置收集的数据，以便在达到阈值时让`Performance Monitor`生成警报。要需了解更多关于`Data\
  \ Collector Sets`的信息，请参阅此 TechNet 文章：`[`technet.microsoft.com/en-us/library/cc749337.aspx`](http://technet.microsoft.com/en-us/library/cc749337.aspx)`。此外，你还可以创建用户定义的报告并查看系统报告。你可以查看`Event\
  \ Trace Sessions`（事件跟踪会话）。`Event trace data`（事件跟踪数据）是从跟踪提供程序收集的，这些是操作系统或单个应用程序的组件，用于报告操作或事件。多个跟踪提供程序的输出可以组合成`trace\
  \ session`（跟踪会话）。\n\n如你所见，`Performance Monitor`的内容非常多，在这里无法详述。然而，互联网上有许多可用资源，特别是来自`TechNet`和`MSDN`。在参加考试之前，确保你熟悉此工具及其相关术语。\n\
  \n### 思考实验：远程监控计算机\n\n在这一思考实验中，应用你在本目标中学到的知识。你可以在本末尾的“答案”部分找到这些问题的答案。\n\n你注意到你小型业务网络上的某台计算机出现了性能问题。你怀疑这与你最近安装的一个桌面应用程序有关。你想远程监控这台计算机，专门寻找由于该应用程序引起的错误。回答以下问题以说明你将如何操作。\n\
  \n1. 你需要向`MMC`添加什么刻入组件（snap-in）来访问远程计算机上的此类错误？\n2. 你应该创建什么样的订阅来获取获取小型业务网络上的数据？\n\
  3. 你必须在源计算机上输入什么命令来启用`Windows Remote Management`（Windows 管理）？\n4. 你必须在收集计算机上输入什么命令来启用`Windows\
  \ Event Collector`（Windows 事件收集器）服务？\n5. 如果此事件订阅出现问题，防火墙中必须启用哪些端口以允许`TCP`、`HTTP`\
  \ 和/或`HTTPS` 流量？\n\n### 目标总结\n\n- 有许多方法可以使用如`Task Manager`（任务管理器）、`Reliability Manager`（可靠性监视器）、`Resource\
  \ Monitor`（资源监视器）和`Performance Monitor`（性能监视器）等工具来改进和排除性能故障。\n- 你可以使用 `Event Viewer`（事件查看器）刻入并在所有影响计算机上启用相关服务来远程管理计算机。\n\
  - 文件会被索引以便定位；你可以配置索引的工作方式并根据需要添加或删除文件类型和文件夹。\n\n## 目标复\n\n回答以下问题以测试你对本目标信息的掌握情况。你可以在本末尾的“答案”部分找到这些问题的答案以及每个选项之所以正确或错误的解释。\n\
  \n| **Q:** | 1\\. `Task Manager`的哪个选项卡对确定 CPU 是否过载最有帮助？ |\n1. 应用程序历史\n2. 性能\n3.\
  \ 启动\n4. 用户\n5. 服务 |\n| **Q:** | 2\\. 你使用一个应用程序，它以专有文件格式将文件保存在其根驱动器上创建的文件夹中。你想对这些文件进行索引。你应该如何操作？\
  \ |\n1. 无需这样做。所有文件类型默认都会进行索引。尽管如此你可以根据需要排除文件。\n2. 在`Indexing Options`（索引选项）对话框中，点击`Modify`。然后点击`File\
  \ Types`选项卡。在此处添加要索引的文件类型。\n3. 在`Indexing Options`对话框中，在`Index These Locations`（索引这些位置）窗口内右键单击。将根驱动器作为位置添加。\n\
  4. 在`Indexing Options`对话框中，点击`Advanced`。从那里点击`File Types`选项卡。在此处添加要索引的文件类型。 |\n\
  | **Q:** | 3\\. 在`Event Viewer`中，以下哪些 Windows 日志默认为空？（选择所有适用项。） |\n1. 应用程序\n2. 安全\n\
  3. 安装\n4. 系统\n5. 转发事件 |\n| **Q:** | 4\\. 在`Performance Monitor`中，在添加任何计数器之前，哪个计数器始终可用`Performance\
  \ Monitor`图表中？ |\n1. 默认不添加任何计数器。\n2. `Bytes Total/Sec`\n3. `% Processor Time`\n\
  4. `Current Bandwidth` |\n\n## 章节总结\n\n- 你必须努力通过`Windows Updates`使你的计算机处于最新状态。通过这样做，你拥有更多可用工具，包括应用组策略、回滚更新、配置设置等功能。\n\
  - 你可以使用`Disk Management`管理磁盘、卷和文件系统。当你需要`Disk Management`提供的更多选项时，可以使用`diskpart`，这是一个用于配置和管理的命令行实用。\n\
  - `Check Disk`、`Defragmenter`、`Action Center`、`Disk Cleanup`等工具可以在磁盘配置良好且健康后帮助维护磁盘。\n\
  - `Task Manager`对于终端用户和网络管理员来说是一个强大的工具，它可以结束进程、查看性能摘要、查看历史、查看登录用户及其使用的计算机资源等。\n\
  - 其他工具（包括`Performance Monitor`）可以在找不到传统和常见解决方案时帮助你排除网络故障。\n- `Storage Spaces`允许你使用各种外部磁盘（包括\
  \ SATA 驱动器和 USB 盘）创建存储池。\n\n## 答案\n\n此部分包含思考实验的解决方案以及本目标复习问题的答案。\n\n### 目标 6.1：思考实验\n\
  \n1. 一个 `WSUS` 服务器\n2. 指定`Intranet Update Service Location`（内部网络更新服务位置）\n3. `Computer\
  \ Configuration, Administrative Templates, Windows Components, Windows Update`\n\
  \n### 目标 6.1：复习\n\n1. **正确答案**: C\n   - **错误**：可以在`Windows Store`中移除升级到 Windows\
  \ 8.1 的提示。\n   - **错误**：你可以在`Store`的`Settings`中配置是否自动更新应用，但这不是移除`Store`中特定应用更新的地方。\n\
  \   - **正确**：你必须在此设置组策略来移除该选项：`Computer Configuration, Administrative Templates,\
  \ Windows Components, Store`。\n\n2. **正确答案**: B\n   - **错误**：`Windows Updates`可以包含驱动程序。\n\
  \   - **正确**：标准用户可以安装从`Windows Update`下载的驱动程序而无需 UAC 提示。\n   - **错误**：这是正确的：即使在`Windows\
  \ Update, Change Settings`选项中选择“自动安装更新（推荐）”，并非所有更新都会被安装。\n\n\n\n\n\n### 4. 错误\n\
  这是正确的：你可以使用 `PC 设置`，“更新和恢复”来快速查看客户端计算机是否配置为接收更新。\n\n### 3. 正确答案：C\n1. **错误**：`Change\
  \ Settings`更改设置允许你更改更改下载和安装更新的方式和时间。\n2. **错误**：`View Update History`查看更新历史允许你按类型、名称、日期和其他选项查看并排序更新，但没有提供卸载更新的方法。\n\
  3. **正确**：`Installed Updates`已安装的更新是你可以在此处卸载特定更新。\n4. **错误**：`View Update History`查看更新历史无法用于卸载不需要的更新。\n\
  \n### 4. 正确答案：A\n1. **正确**：启用后，`Windows Update` 将唤醒系统以安装更新。如果 `Windows Update` 唤醒系统但发现其正在使用电池电源，它将在两分钟后进入休眠状态且不会安装任何更新。\n\
  2. **错误**：启用后，`Windows Update` 将唤醒系统以安装更新。如果 `Windows Update` 唤醒系统但发现其正在使用电池电源，它将不会安装更新；而是将返回休眠模式。\n\
  3. **错误**：启用后，`Windows Update` 将唤醒系统以安装更新，即使其正在使用电池电源也是。\n4. **错误**：启用后，`Windows\
  \ Update` 将唤醒系统以安装更新。\n\n### 目标 6.2：思维实验\n1. 镜像（Mirrored）。简单卷不支持任何容错能力，条带卷或跨区卷也不支持。`Windows\
  \ 8.1` 不支持 `RAID-5`。剩下的就是镜像，它会将数据写入两次，每个磁盘各写一次。虽然这会导致性能影响，但客户端并不担心这一点。\n2. 不。\n\
  3. 它们的大小必须相同。\n4. 基本磁盘将用转换为动态磁盘。\n\n### 目标 6.2：复习\n1. **正确答案：D**\n1. **错误**：你无法创建一个\
  \ 8 TB 的三路镜像，因为你不能将安装有操作系统的磁盘作为存储空间的一部分。因此，你只有两个磁盘可用。\n2. **错误**：你无法创建一个三路镜像，因为你不能将安装有操作系统的磁盘作为存储空间的一部分。\n\
  3. **错误**：你无法创建一个三路奇校验，因为你不能将安装有操作系统的磁盘作为存储空间的一部分。\n4. **正确**：你可以创建一个 4 TB 的双路镜像。\n\
  5. **错误**：你可以创建一个比连接驱动器容量更大的双路镜像。\n\n2. **正确答案：A**\n1. **正确**：带有适当参数的 `Diskpart`\
  \ 可以完全擦除驱动器分区表。\n2. **错误**：`Fsutil` 无法用于从磁盘删除文件。\n3. **错误**：`Format` 允许你删除数据，但对磁盘卷和相关的分区表不做任何操作。\n\
  4. **错误**：`Format` 不是一个有效选项。`Format` 允许你删除数据，但对磁盘卷和相关的分区表不做任何操作。\n\n3. **正确答案：B**\n\
  1. **错误**：`Fsutil` 用于管理重解析点和卸载卷。\n2. **正确**：`Chkdsk` (检查磁盘) 扫描硬盘错误（包括坏的存储块）并尝试自动修复它们。\n\
  3. **错误**：`Disk Cleanup`（磁盘清理）允许用户安全地删除临时文件、下载的程序安装文件等以维护硬盘。\n4. **错误**：`Disk Defragmenter`（磁盘整理）在后台自动运行，用于将碎片的文件移动在一起，以便它们存储在连续的硬盘扇区上。\n\
  5. **错误**：`Diskpart` 用于创建启动 USB 驱动器、创建启动分区、管理驱动器以及擦除驱动器上的文件等。\n6. **错误**：`Disk Management`（磁盘管理）单元用于管理已安装的驱动器，并用于扩展和缩小卷等。\n\
  \n4. **正确答案：B**\n1. **错误**：配置为跨区卷（spanned volumes）的动态磁盘是一种解决方案，但数据是顺序写入磁盘的，这对于提高写入时间没有帮助。\n\
  2. **正确**：配置为条带卷（striped volumes）的动态磁盘将以条带形式向每个磁盘写入数据（一次一个磁盘），从而增加写入时间。\n3. **错误**：只有动态磁盘可以配置为镜像卷。然而，镜像卷实际上会减慢写入时间，因为数据被写入两次，每个磁盘各一次。\n\
  4. **错误**：配置为主卷（primary volumes）的基本磁盘只是普通磁盘。这并不会提高写入时间。\n5. **错误**：虽然动态磁盘可以配置为镜像卷，但这对提高写入时间没有帮助。事实上，数据必须写入两次，每个磁盘各一次，从而减慢了写入时间。\n\
