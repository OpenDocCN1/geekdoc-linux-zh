  \ |\n\n\n\n\n\n| 禁用数据执行保护 (DEP) | 管理模板、Windows 组件、Internet Explorer、安全功能 | 双击“禁用数据执行保护”，然后点击“启用”。\
  \ |\n\n### 配置安全和隐私设置\n\nIE 11 还提供了各种安全和隐私选项。你可以通过使用 `Tools` 按钮并点击 `Internet Explorer\
  \ Options` 来像任何终端用户一样访问相同的功能。有两个选项卡可供探索：`Security`（安全）和 `Privacy`（隐私）。这两个选项卡提供了与四个区域（`Internet`、`本地\
  \ Int 网`、`信任站点`、`受限制的站点`）相关的安全设置选项，以及你希望如何保护隐私（例如，从不允许网站要求你的物理位置、使用 `Pop-Up Blocker`\
  \ 等）。\n\n其他选项卡也提供了一些安全和隐私选项。例如，`General` 选项卡提供了每次退出 `IE 11\\` 时删除浏览历史的能力。`Content`\
  \ 选项卡让你管理 `AutoComplete` 设置，以及你希望如何在加密连接和身份识别中使用证书。你需要探索这些每个选项卡以查看哪些可用功能，并确保你了解如何进行更改。请注意，在这里所做的更改也会影响\
  \ `Start screen` 上的 `IE` 应用。你可以通过点击 `Tools` 按钮然后点击 `Internet Options` 来打开 `Internet\
  \ Options` 对话框。大多数情况下，你将通过 `Group Policy` 控制 `IE`。\n\n### 考试提示\n\n你可能会被问及旧网站如何配置其网页以始终在兼容模式下显示。他们通过在\
  \ HTML 文件中添加此标签来实现：`<meta http-equiv=“X-UA-Compatible” content=“IE=EmulateIE7”/>`。\n\
  \n有很多新的 `IE 11 Group Policy` 设置需要你熟悉。请确保你理解在启用、禁用或不配置各种策略时会发生什么。图 2-19 显示了 `Group\
  \ Policy` 中某些可以在 `Local Group Policy Editor` 中配置的选项。请特别注意这些选项：`Turn Off InPrivate\
  \ Filter` 和 `Turn Off InPrivate Browsing`。\n\n![为 Internet Explorer 11 配置本地组策略设置。](img/httpatomoreillycomsourcemspimages1988869.png.jpg)图\
  \ 2-19.为 Internet Explorer 11 配置本地组策略设置。\n\n除了 `Privacy` 节点，`Group Policy` 还有其他区域可以探索。例如，在左格中点击\
  \ `Internet Explorer`，在右侧你会看到包含 `Security Zones: Do Not Allow Users To Change Policies`\
  \ 和 `Disable Automatic Install Of Internet Explorer Components` 的选项。\n\n### 考试提示\n\
  \n我们认为对 `IE 11` 的 `Group Policy` 设置的测试不会太深，但你应该熟悉新添加的条目。其中某些项与安全和隐私设置直接相关。此列表可以在\
  \ TechNet 的 [`technet.microsoft.com/library/dn321453.aspx`](http://technet.microsoft.com/library/dn321453.aspx)\
  \ 获取。\n\n### 考试提示\n\n你可能会在考试中被问到 `InPrivate Browsing`。`InPrivate Browsing` 防止浏览器在会话期间收集任何数据，包括\
  \ cookies、跟踪、浏览历史、密码和用户名。像其他功能一样，你可以通过 `Group Policy` 控制 `InPrivate` 行为。\n\n## 管理加载项、工具栏、扩展、搜索提供者等\n\
  \n桌面上 `IE 11` 另一个可以探索的区域是 `Manage Add-Ons` 对话框，所示如图图 2-20 从那里，你可以查看以下信息以及每项在本地计算机上是如何配置的：\n\
  \n* **Toolbars And Extensions（工具栏和扩展）**：点击此选项查看向 `IE 11` 添加了哪些工具栏并根据需要禁用它们。这些工具有时来自\
  \ `Microsoft Corporation`，正如你在图 2-20 中所示，有时也来自第三方。这也是某些恶意软件出现的地方。点击任何条目以查看启用或禁用它的选项。\n\
  \n* **Search Providers（搜索提供者）**：使用此选项查看本地计算机上在使用哪些搜索提供者。你会看到 `Bing`，但可能还会看到其他提供者，如\
  \ `eBay`、`Ask.com`、`Amazon Search Suggestions` 等。你可以选择列表中的任何项目并删除它、将其设置为默认值，或禁用其建议。你还可以更改列表的顺序。选择并右键点击任何条目，以查看对话框本身未显示的附加选项。\n\
  \n* **Accelerators（加速器）**：选择此选项查看为本地机器配置的加速器。你可能会看到 `Map with Bing Maps`、`Translate\
  \ with Bing` 以及可能的其他。这些功能帮助用户通过单击完成任务（例如，使用 `Bing Maps` 获取某地点的路线）。点击任何条目以禁用、删除或将其设置为默认值。\n\
  \n* **Tracking Protection（跟踪保护）**：使用此选项获取在线 `Tracking List` 并使用它通过防止网站发送收集的关于访问网站的数据来增强你的隐私。\n\
  \n![管理加载项对话框让你启用和禁用用户添加的功能。](img/httpatomoreillycomsourcemspimages1988871.png.jpg)图\
  \ 2-20.管理加载项对话框让你启用和禁用用户添加的功能。\n\n### 考试提示\n\n目标 2（即本章涵盖的所有内容）占考试的 10% 到 15%。这意味着如果你的测试包含\
  \ 50 道题，将 5 到 8 道题来自本章内容。如果这些题目中的一个是关于 `Tracking Protection`、`InPrivate Browsing`\
  \ 或 `Internet Options` 对话框中可用 `Security` 级别的，错过它真是太可惜了！在考试前花时间熟悉 `IE` 的所有功能。\n\n\
  ### 更多信息：查看 IE 11 中的所有可用选项\n\n在 `IE 11` 桌面应用的 `Tools` 菜单上指向 `Safety` 并查看那里的选项。你可以删除浏览历史并报告不安全的网站等等。确保你理解每个项目的作用，包括\
  \ `SmartScreen` 过滤器。\n\n### 配置下载管理器\n\n`Download Manager` 是 `IE 11` 中的一项功能，用于跟踪你的下载和下载过程。你下载的文件名维护在列表中，可以随时访问。你可以从桌面上的\
  \ `IE` 通过 `Tools` 菜单打开 `Download Manager`；只需点击 `View Downloads`。一旦打开，注意 `Options`\
  \ 链接。这就是你配置 `Download Manager` 选项的地方，特别是默认存储下载的位置以及在下载完成时是否通知你。图 2-21 显示了 `Download\
  \ Manager`。\n\n![下载管理器跟踪从互联网下载的文件。](img/httpatomoreillycomsourcemspimages1988873.png.jpg)图\
  \ 2-21.下载管理器跟踪从互联网下载的文件。\n\n\n\n\n你也可以右键点击列表中的任何项目来删除下载、复制下载链接、转到下载网页、打开所在的文件夹、报告文件不安全，以及重新运行文件下载完成后执行的安全检查。你可以在\
  \ `Group Policy` 中管理 `Download Manager`。\n\n# 思考实验：管理公司内网网站的显示问题\n\n在思考实验中，请应用你关于此目标所学的知识。你可以在本章末尾的“答案”部分找到这些问题的答案。\n\
  \n你是一个使用活动目录域服务（Active Directory Domain Services）的大型组织的网络管理员。有两个域控制器、几台文件服务器和大约\
  \ 100 台客户端计算机。公司拥有一个创建于八年前的内网网站。你最近将工作站从 Windows Vista 升级到了 Windows 8.1，用户正在抱怨公司的内网网站显示不正常。\n\
  \n1. 你需要在工作站上配置什么功能，以便使用户能够正常查看内网网站？\n2. 你如何将此更改应用到网络上的 100 台工作站上？\n3. 在何处找到想要更改的设置？该设置的名称是什么？\n\
  \n### 目标总结\n\n* 使用 `Compatibility View`（性视图）模式使尚未符合新标准的旧版网站显示正常。\n* 使用 `Group Policy`（组策略）轻松地为整个组织或组配置\
  \ `Internet Explorer (IE) 11`。\n* 从 `Internet Options`对话框配置安全和隐私设置。有许多选项可以探索。\n\
  * 使用 `Manage Add-Ons` 对框管理加载项、工具栏、扩展、搜索提供程序等。\n* 使用 `Download Manager` 跟踪并管理你从互联网下载的文件。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对此目标信息的掌握情况。你可以在本章末尾的“答案”部分找到这些问题的答案，以及对每个选项正确或错误的解释。\n\n\
