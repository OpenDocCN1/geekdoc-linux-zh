  \ 你将无法访问当天工作的所有文件，因为备份不够充分。 | 2. 为文件配置的离线缓存大小太小，你很快就会耗尽缓存空间。 | 3. 你用于保存文件历史数据的驱动器最终会变满，你必须在日后处理出现的问题。\
  \ | 4. 文件历史创建的事件日志最终会导致计算机硬盘填满，你会被删除旧日志。 |\n\n## 章节总结\n\n*   Windows 恢复环境许多恢复选项，包括还原、重置、安全模式、命令提示符、自动启动修复、系统还原等。\n\
  *   你可以创建一个恢复驱动器来帮助解决未来的任何启动问题。\n*   设备驱动程序回滚、MSConfig、WBAdmin、VssAdmin、FhManageW、Enable-ComputerRestore\
  \ 以及 Recimg 是管理员用于诊断计算机和管理还原选项的工具。\n*   刷新和重置是用户快速恢复 PC 稳定的两种方法。刷新保留个人文件但删除第三方应用程序和加载项，而重置（或还原）则将计算机恢复到出厂标准。\n\
  *   SkyDrive 和文件历史都可以作为备份选项，创建系统镜像备份也是如此。最好的方法是结合这些选项。\n\n## 答案\n\n本部分包含了本章思考实验的解决方案以及目标回顾问题的答案。\n\
  \n### 目标 7.1: 思考实验\n\n1. 最好先尝试其他选项。用户安装了很多应用程序，如果你执行按按钮重置，将必须重新安装它们。此外，问题可能与引导配置数据有关，与安装的应用程序无关。\n\
  \n\n\n\n\n2. 你可以。你可以使用 `Recovery Disk` 启动计算机并访问恢复启动的选项。其中一个选项是选择 `Startup Repair`，让\
  \ Windows 可能导致计算机无法启动的问题。\n\n3. `Recycling` 将计算机恢复到出厂设置，因此考虑到这种情况，这是一个坏主意。\n\n###\
  \ 目标 7.1: 复习\n\n1. **正确答案：** C\n    1. **错误：** 你可以为内部硬件安装或回滚驱动程序。\n    2. **错误：**\
  \ 无法配置设备驱动程序使其无法回滚。\n    3. **正确：** 如果驱动程序已更新，则会提供回滚选项。因此，驱动程序没有更新，问题是由于其他原因引起的。\n\
  \    4. **错误：** 如果无法回滚驱动程序，那么卸载它也不会无法解决问题。Windows 可能会重新安装该驱动程序，问题将依然存在。\n\n2. **正确答案：**\
