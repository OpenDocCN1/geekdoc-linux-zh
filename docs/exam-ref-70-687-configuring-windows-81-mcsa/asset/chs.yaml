  \ 你可以使用这两种文件类型创建差异磁盘。\n\n\n\n\n在几乎所有的实例和场景中，使用计算机完成任务都涉及连接到某种网络，即使仅仅是为了访问互联网或将工作备份到个人\
  \ PC 以外的地点。在许多情况下，它是小型企业的本地局域网，且资源被配置为工作组（workgroup）。在家里，网络化计算机通常被配置为家庭组（homegroups）。这两种网络的目的通常是为了共享互联网连接以及文件、文件夹、打印机和其他资源。在这两种情况下，以及在几乎所有的场景中，用户都控制自己的数据并在本地管理资源。\n\
  \n在其他场景下，网络是企业的基础，配备了 `Active Directory` `domain-controllers`（域控制器），这些控制器可以集中验证用户身份并保护网络资源。这些较大的网络还可以包含额外的服务器，用于管理存储、电子邮件、传真、打印机等。将所有资源作为一个整体进行管理非常重要，这可以保持所有内容的安全性和可用性。\n\
  \n但是，无论你处理的是哪种网络，你必须精通的底层技能大部分是相同的。你需要能够配置 `IP` 和网络设置，并且需要知道如何配置和维护网络安全。有时，你还需要配置远程管理网络中工作站的方法。\n\
  \n### 本章目标：\n\n*   目标 3.1: 配置 IP 设置\n*   目标 3.2: 配置网络设置\n*   目标 3.3: 配置并维护网络安全\n\
  *   目标 3.4: 配置远程管理\n\n## 目标 3.1: 配置 IP 设置\n\n网络是计算机和其他资源的组。网络可以是公用的、私有的或域的，并且当你连接时，安全设置将应用到你的\
  \ Windows 8.1 计算机上。一旦连接，连接到网络的每个资源（计算机、网络打印机、服务器或其他主机）必须获取（或之前已分配）一个唯一地址，以定义其在该网络上的标识。这些地址是唯一的，你不能让同一个网络上的两个主机具有相同的地址。这使得地址寻址成为配置网络中非常重要的部分。\n\
  \n直接连接到互联网的主机也需要唯一地址，例如互联网服务提供商（ISP）中的服务器、拥有自己域名的实体（如 `[`www.microsoft.com`](http://www.microsoft.com)`）等。那些（虚拟地）位于路由器、调制解器或通过共享互联网连接（以供这些计算机访问）的网络之后的单个计算机并不直接连接，因此没有此项要求。在这些情况下，使用其他技术进行寻址，例如\
  \ `Network Address Translation`（`NAT` 网络地址转换）。\n\n由于计算机通过地址而非名称进行通信和定义，而且要求用户输入地址来访问主机将非常困难甚至可以说是不可能的，因此有一种技术允许用户通过输入计算机名称而不是地址来访问网站。这被称为解析地址，由\
  \ `Domain Name System`（`DNS` DNS 系统）处理。你将在本目标中学到所有这些内容，以及在出现连接性问题时如何解决它们。\n\n**本目标涵盖了：**\n\
  \n*   连接到网络\n*   配置网络位置\n*   配置名称解析\n*   解决连接性问题\n\n### 配置 IP 设置\n\n网络（甚至是互联网）上的每台计算机（主机）都必须有一个唯一的\
  \ `Internet Protocol`（`IP` 互联网协议）地址。当此地址配置为 `IPv4` 地址时，它是一个 32 位数字，格式为四组八字节。例如 `192.168.4.20`。`IP`\
  \ 地址（结合正确的子网掩码，如 `255.255.255.0`）定义了网络和主机。由于网络上的每个资源都必须有一个定义的地址，你需要知道如何配置这些地址。为资源获取地址有两种方法：你可以手动定义它，或者由\
  \ `Dynamic Host Configuration Protocol`（`DHCP` 动态主机配置协议）服务器分配。当无法通过这种方式分配地址时，Windows\
  \ 将使用称为 `Automatic Private IP Addressing`（`APIPA` 自动私有 IP 地址）的技术分配其自己的 `IP` 地址。\n\
  \n### 考试贴士\n\n确保你复习了 A 类、B 类和 C 类 `IP` 地址范围，并了解每类提供多少个网络和主机。也知道它们的默认子网掩码。此外，了解本地网络可用的私有地址（分别是\
  \ C 类的 `192.x.x.x`、B 类的 `172.x.x.x` 和 A 类的 `10.x.x.x`）。\n\n#### 探索本地局域网连接属性对话框\n\
  \n图 3-1 显示了 Wi-Fi 适配器的本地局域网连接属性对话框，你可以在此处配置网络。在“网络”选项卡上，你可以访问可用的网络选项，包括在此选中的 `TCP/IPv4`。\n\
  \n![可以使用本地局域网连接属性对话框配置网络。](img/atomillycomspimages19897.jpg)图 3-1.可以使用本地局域网连接属性对话框配置网络。\n\
  \n### 考试提示\n\n你可能会被问及如何在命令行配置 `IPv4` 或 `IPv6` 地址。执行此操作的命令是 `netsh`。确保你理解相关的选项。你可能会被要求选择为主机应用静态地址的正确命令。该命令看起来如下：\n\
  \n```\nnetsh interface ipv4 set address \"Ethernet\" static 192.168.5.12 255.255.255.0\
  \ 192.168.1.10\n```\n\n如果你希望地址来自 DHCP 服务器，命令看起来更像：\n\n```\nnetsh interface ipv4\
  \ set address name=\"Ethernet\" source=dhcp\n```\n\n在时间允许的情况下，探索图 3-1](#ch03.html_you_can_configure_networking_using_the_t\
  \ \"Figure 3-1. You can configure networking using the......\")所示的可用选项。在继续之前，确保你理解列出的术语：\n\
  \n*   `APIPA`：这是在找不到其他寻址机制时由 Windows 分配的链路本地（IP）地址。它允许主机在网段运行。路由器不转发此类地址的数据包。\n\
  *   `Default Gateway`（默认网关）：此硬件或软件设备允许主机连接到其他网络。该网络通常是互联网，也可以是企业域中的另一个网段。\n*   `DHCP`：`DHCP`\
  \ 是一种动态配置网络上主机 `IP` 地址的网络协议。`DHCP` 服务器分配这些地址。这些 IP 地址通常在指定的范围内有效，并在结束后必须续约。\n\n\
  \    ### 关于 DHCP 的更多信息\n\n    要了解更多关于 DHCP 的信息，请参考此文章。\n\n*   `DHCP Scope`（范围）：`DHCP`\
  \ 范围是可向子网（网络的一部分）主机提供的可能的 IP 地址连续范围。\n*   `DNS`：`DNS` 是一项允许用户输入想要连接的主机名称而非其 IP 地址的服务。`DNS`\
  \ 服务器解析名称。\n\n\n\n\n\n*   `IPv4`。这是一种 32 位的 IP 地址，由四个 8 位字节组成。它包含两个部分：网络 ID 和主机\
  \ ID。网络 ID 描述网络，而主机 ID 定义该网络上的特定设备。IPv4 地址可以是单播（Unicast）、广播（Broadcast）或多组播（Multicast）。请参见下文的子网掩码。\n\
  \n*   `Subnet mask`。这个 32 位的数字由四个 8 位字节组成，由一组连续的 1 后面跟一组连续的 0 组成，用于定义 IPv4 地址中哪部分是网络\
  \ ID，哪部分是主机 ID。1 表示网络，0 表示主机。默认子网掩码的格式如下：A 类地址为 255.0.0.0，B 类地址为 255.255.0.0，C 类地址为\
  \ 255.255.255.0。转换为二进制后，255.0.0.0 如下所示：11111111 00000000 00000000 00000000。\n\n\
  *   `IPv6`。可用的 IPv4 地址组合正在日益枯竭，因此需要更好的替代方案。IPv6 就是该方案。它不是 32 位空间，而是具有 16 位边界的 128\
  \ 位空间。这允许产生更多的地址。一个 IPv6 地址可能如下：21DA:D3:0:2F3B:2AA:FF:FE28:9C5A。\n\n### 考试提示\n\n\
  你可以从局域网连接属性对话框安装网络支持（微软网络客户端、QoS 调度程序、网络文件和打印机共享、TCP/IPv4、TCP/IPv6 等）。了解哪些是默认安装的以及如何安装其他。\n\
  \n#### 连接到网络\n\n当你第一次连接到本地网络时，系统会提示你从以下选项中选择：\n\n*   `否，不启用共享或连接到设备`。此选项用于公共网络和热点（图书馆、咖啡馆）。其他人无法看到或访问用户的计算机，用户也看不到其他访问该网络的计算机。\n\
  \n*   `是，启用共享并连接到设备`。此选项用于私有的、受信任的网络（家庭、工作）和家庭组。计算机位于受信任的路由器之后，不直接连接互联网。\n\n当你连接到活动目录域服务（Active\
  \ Directory Domain Services）域时，这两个选项不会出现。但当它们出现且你选择了一个选项时，系统会自动为网络发现、文件和打印机共享、防火墙状态、可以接受入站连接的应用程序等配置设置。（配置为私有或域的计算机已启用网络发现；公共网络未启用。）\n\
  \n如果由于某种原因，系统没有提示你连接到已知网络，你可以手动连接。要手动连接到网络，请按照以下步骤操作：\n\n1.  按下 `Windows 键+I` 打开设置界面。\n\
  2.  点击`网络` 图标。\n3.  从列表中选择网络并点击`连接`。\n4.  如果系统提示，输入密码或口令以加入网络。\n\n如果你需要连接到一个隐藏且不广播服务集标识符（SSID）的网络，请按照以下步骤操作：\n\
  \n1.  打开`网络和共享中心`。\n2.  点击`设置新建连接或网络`。\n3.  点击`手动连接到无线网络`。点击`下一步`。\n4.  输入网络名称（`SSID`）、安全类型、加密类型和安全密钥（如适用），根据需要启用其他选项（参见图\
  \ 3-2）。\n5.  点击`下一步`。连接应当建立。\n\n![手动连接到网络。](img/httpatomoreillycomsourcemspimages1988899.png.jpg)\n\
  图 3-2. 手动连接到网络。\n\n### 更多信息：连接工作场所\n\n网络共享向导引导你连接到隐藏网络的选项之一是`连接工作场所`。你可以选择此选项设置虚拟专用网络（VPN）。VPN\
  \ 在第 5 章 中有所介绍。\n\n#### 配置网络位置\n\n当你连接到局域网并选择共享或不共享时，Windows 会自动为网络位置配置设置。如果你在网络上加入了家庭组，设置也将适用于你。不过，当\
  \ Windows 无法确定位置类型时，它总是采取谨慎态度，有时你可能会发现位置配置不正确。\n\n要更改网络位置，如果该位置是家庭组，你可以运行`家庭组疑难解答`。这在家庭组中可能永远不会，但值得注意的是家庭组疑难解答是一个选项。如果位置是工作组中的本地网络，你可以按照如下步骤在\
  \ PC 设置中更改：\n\n1.  打开`PC 设置`。\n2.  点击`网络`。\n3.  从`连接`窗格中，点击要更改的网络。\n4.  将`查找设备和内容`设置为`关闭`。参见图\
  \ 3-3：\n\n### 注意：高级共享\n\n你可以通过网络和共享中心中的`更改高级共享设置`来配置高级共享。在那里，你可以为私有、来或所有网络更改设置。设置包括网络发现、文件和打印共享以及密码保护共享。\n\
  \n#### 配置解析\n\n计算机由其唯一的 IP 地址表示，你可以使用该地址与其进行通信。使用 IP 地址通信的一种方式是在命令行执行。例如，你可以输入类似\
  \ `ping 192.168.4.5` 的命令来排查与本地网络上主机的连接。DNS 使用可以使用名称而不是数字，这个过程被称为解析。DNS 服务器存储互联网计算机的名称和地址，它们维护的列表分布在世界各地的数千台服务器上。解析请求被转发到这些服务器之一，如果无法解析名称，它将传递给下一个。\n\
  \n你可以在连接属性对话框中配置主机使用特定的 DNS 服务器。对于要求使用特定 DNS 服务器的域，这是必要的。这在 VPN 或虚拟机中可能也是必要的。\n\n\
  #### 解决连接问题\n\n当主机无法访问网络时，该主机存在连接问题。问题可能仅限于该设备；可能是计算机的以太线已拔掉，或者无线功能已禁用。也许网络上存在 IP\
  \ 地址冲突，用户的 IP 地址需要释放并重新获取。通常使用网络和共享中心中的诊断工具可以发现问题并提供解决方案。但如果问题不是孤立，你就面临更大的问题。网络服务器、网关或其他必要的资源可能宕机，网络网段或物理骨干可能损坏，或者可能是由\
  \ ISP、云服务或其他不受你控制的技术引起的问题。\n\n\n\n\n\n要查看任何连接的状态，请打开“网络和共享中心”，然后点击“更改适配器设置”。双击代表已连接网络的图标并点击“详细信息”。在出的对话框中，你可以查看物理地址、DHCP\
  \ 信息和 IP 地址。你甚至可以看到 DNS 服务器、默认网关和 DHCP 服务器的 IP 地址，以及获取 DHCP 租约的时间和必须重新租约的时间。\n\n\
  ## 网络和共享中心\n\n网络和共享中心允许你查看活动网络的状态。如果出现问题，你可以点击`排除故障`来查看网络和共享中心是否可以解决该问题。有时，它可以通过释放并重新设置\
  \ IP 地址、重置适配器设置或发现简单的问题（例如以太网电缆未断开，然后你可以重新连接它）来解决问题。\n\n如果存在问题但无法自动解决，你可以从故障排除选项列表中进行选择，这些解决解决网站连接问题、访问共享文件夹、在家庭组中查找计算机或文件、查找并修复无线适配器问题，以及对入站连接进行故障排除。图\
  \ 3-4 显示了这一点。当你选择任何选项并启动故障排除程序时，它通常会找到问题并执行修复或提示你授权修复。它还可能要求你先执行某些操作，例如将以太网电缆插入计算机的以太网端口。\n\
  \n![使用网络和共享中心排除连接性问题。](img/httpatomoreillycomsourcemspimages198890.png.jpg)图 3-4.\
  \ 使用网络和共享中心排除连接性问题。\n\n## 操作中心故障排除工具\n\n如果网络和共享中心无法帮助你确定或解决问题，你可以检查操作中心。同样，你会看到一个故障排除选项。在这里，你可以排除与网络以及硬件、声音或系统和安全等其他内容相关的问题。然而，你可能会发现更有价值的内容。例如，网卡驱动程序可能需要更新。在大多数情况下，操作中心会提醒你这一点。你还可以检查网络防火墙、病毒防护、Internet\
  \ 安全设置、网络访问保护和用户的 Microsoft 账户等问题。有时你可以在这里解决奇特的连接性问题。\n\n## 命令行工具\n\n当网络和共享中心和操作中心无法帮助解决连接性问题时，可能是一个更复杂的问题。也许域（或网络网段）的网关处于离线状态。也许路由器故障了。也许\
  \ DNS 服务器不可用，或者在主机上的配置不正确。也许由于当前尚未解决的网络问题，计算机唯一的企业级 IP 地址已被更改为 APIPA 地址。当存在这类问题时，你可以使用命令行工具来解决它们。\n\
  \n以下是一些你可以使用的工具：\n\n* `Ping`。此工具用于验证到另一台 TCP/IP 计算机的 IP 级连通性。要实现这一点，它会向接收者发送 Internet\
  \ 控制消息协议 (ICMP) 回显请求消息。如果连接成功，将显示这些消息的接收情况以及往返时间。`Ping` 是用于故障排除连接性、可达性和名称解析的主要命令。\n\
  \n* `Ipconfig` 和 `Ipconfig /all`。这会显示所有当前的 TCP/IP 网络配置值。它还可以刷新 DHCP 和 DNS 设置。在不带\
  \ `/all` 参数的情况下使用 `Ipconfig`，会显示主机上安装的所有适配器的 IPv4 和 IPv6 地址、子网掩码和默认网关。常用参数有 `/release`、`/renew`\
  \ 和 `/flushdns`。\n\n* `Tracert`。此工具确定到目的地的路径，并显示数据包到达目的地每经过一个跳数的信息。一个*跳*是指通过一个路由器。你可以使用此信息查看传输在何处失败。\n\
  \n* `Netstat`。这显示活动 TCP 连接列表和计算机监听的端口。它还显示以太网统计数据、IP 路由表以及 IPv4 和 IPv6 统计数据。\n\n\
  * `Netsh`。这允许你在命令行中更改当前计算机的网络配置。\n\n* `Nslookup`。此工具显示了你可以用于诊断 DNS 问题的信息。\n\n###\
  \ 考试提示\n\n你应该在时间允许范围内尽可能多的命令行工具。你将在考试中看到这些工具，它们可能包括更晦涩的工具，如 `Icacls`、`Attrib`、`Cipher`、`Fsutil`、`Auditpol`\
  \ 等，以及相关的参数。（你可能还会看到第 2 章中概述的部署相关的命令，包括 `DISM`、`DiskPart`、`Fdisk`、`BCDboot` 等。）访问\
  \ TechNet 上的此页面以查看常用命令行工具及其用途列表：*[`technet.microsoft.com/en-us/library/cc754340.aspx#BKMK_a`](http://technet.microsoft.com/en-us/library/cc754340.aspx#BKMK_a)*。\n\
  \n## 思考实验：排除网络连接故障\n\n在这个思考实验中，应用你在此目标中学到的知识。你可以在本文末的“答案”部分找到这些问题的答案。\n\n你正在对一台新笔记本电脑进行连接故障排除，该电脑已加入本地小型企业网络，该网络已经包含了其他八台计算机。这八台计算机中有三台笔记本电脑一直连接得没有问题。新笔记本在通过以太网电缆直接插入路由器时可以连接，但无法通过无线连接。\n\
  \n回答与你如何排除此问题相关的问题：\n\n1. 你认为是什么导致了这个问题？\n2. 你认为网络和共享中心的故障排除程序可以解决这个问题吗？\n3. 如果\
  \ Internet 连接故障排除程序发现了问题但无法解决，你下一步该去哪里？\n\n### 目标总结\n\n* 当连接到本地网络时，你会选择网络类型，并且安全设置会自动配置。在加入域时不会收到提示。\n\
  * 连接到网络后，你的计算机将获得该网段的唯一 IP 地址。连接到网络的每个主机必须有一个 IP 地址。\n* 由 DNS 处理的名称解析允许用户输入如 [`www.microsoft.com`](http://www.microsoft.com)\
  \ 的友好名称而不是 IP 地址。\n* 当出现连接性问题时，你可以通过网络和共享中心、操作中心和各种命令行工具来排除故障。\n\n## 目标复\n\n回答以下问题以测试你对本目标信息的掌握。你可以在本文末的“答案”部分找到这些问题的答案以及对每个答案选项正确或错误的解释。\n\
  \n| **Q:** | 1\\. DNS 的目的是什么？\n\n1. 为本地网络或网络网段上的主机自动分配 IP 地址\n2. 在 IPv4 网络上传输 IPv6\
  \ 流量\n3. 将主机名解析为 IP 地址\n4. 当 DHCP 服务器无法提供 IP 地址时分配 APIPA 地址 |\n\n| **Q:** | 2\\\
  . 你如何为网络上的主机（如计算机或网络打印机）应用静态 IP 地址？（选择所有适用项。）\n\n1. 从主机适配器的属性对话框中\n2. 在操作中心的安全选项中\n\
  3. 在命令提示符中使用 `Netsh` 命令\n4. 从网络和共享中心的高级共享设置中 |\n\n\n\n\n\n**Q:** 3. 你需要访问特定网络适配器的信息，包括物理地址、DHCP\
  \ 配置、IPv4 和 IPv6 地址、适用子网掩码，以及 DNS 服务器、DHCP 服务器、默认网关的地址以及 DHCP 租约必须更新的时间。你会使用哪个命令行工具？\n\
  \n1. `Ipconfig`\n2. `Ipconfig /all`\n3. `Ping`\n4. `Tracert`\n\n**Q:** 4. 在 Windows\
  \ 8.1 中更改已配置的网络位置？\n\n1. 从主机适配器的属性对话框。\n2. 在操作中心的维护选项中。\n3. 从设置磁贴（Settings charm），右键点击网络，点击“忘记此网络”，然后重新连接。\n\
  4. 从 PC 设置、网络。\n\n## 目标 3.2: 配置网络设置\n\n你可以配置各种网络设置。你可以连接到无线和宽带网络，并管理以前连接过的无线网络列表。你可以配置位置感知打印，使用户自动打印到指定的本地打印机。你还可以配置网络适配器以重新配置默认设置并调整性能。\n\
  \n**本目标涵盖了：**\n\n* 连接到无线网络\n* 管理首选无线网络\n* 配置位置感知打印\n* 配置网络适配器\n\n### 连接到无线网络\n\n\
  当可用无线网络时，你可能会被提示加入它。对于移动设备尤为如此，尽管提示可能在你尝试连接互联网之前才出现。当你选择连接时，该过程通常只需只需输入密码（如果适用）。你在上一节中学习过，也可以通过提供的向导使用\
  \ `Set Up A New Connection Or Network` 选项连接网络。当你通过这种方式连接时，系统会提示输入网络名称 (`SSID`) 和密码，并选择相应的安全设置。还有另一种尚未讨论的方法，这是最简单的选项：从设置磁贴连接网络。\n\
  \n要从设置磁贴连接网络，请按照以下步骤操作：\n\n1. 按 `Windows key+I` 打开设置磁贴并点击网络图标。查看图 3-5 图 3-5. 点击网络图标以查看可用网络。\n\
  \n2. 点击所需的网络。你也可以在这里看到并连接到可用的 VPN 和宽带连接。\n3. 如果需要，点击自动连接。\n4. 点击连接。（你可能会被提示应用共享选项。）\n\
  5. 如果出现提示：\n    1. 输入密码并点击 `Next`。\n    2. 根据情况点击 `Yes` 或 `No` 并点击 `OK`。查看图 3-6\
  \ 图 3-6. 在某些情况下，你在实际连接之前可能会被提示选择某些选项。\n\n### 考试技巧\n\n你以前可以从设置磁贴中右键点击网络连接以及那里找到的网络列表并忘记某个网络。这让你在下次连接该网络时可以重新开始该网络的设置。现在你不能这样做了。如果你想忘记某个网络，请参考下一节中的说明,管理首选无线网络。\n\
  \n### 管理首选无线网络\n\nWindows 8.1 会跟踪你连接的所有网络并自动对它们进行排序。当你有多个连接选项时，Windows 8.1 按照此顺序决定连接类型：`Ethernet`、`Wi-Fi`，然后是移动宽带。明确来说，当所有所有都存在时，它选择\
  \ `Ethernet`。否则，它选择 `Wi-Fi`。如果两者都不可用，它将通过宽带连接（如果你已配置过，它将自动执行）。对于你以前连接过的无线网络，当同一时间有多个可用时，Windows\
  \ 8.1 会连接到你最后使用的那个。\n\n如果你自动连接到了网络但想选择另一个，请从网络列表中点击它。你可以通过点击桌面任务栏系统托中的网络图标或从设置磁贴中点击网络图标来访问此列表。查看图\
  \ 3-7\n\n   ![Switch networks from the Network list.](img/httpatomoreillycomsourcemspimages1988909.png.jpg)图\
  \ 3-7. 从网络列表切换网络。\n\n当你想要管理无线网络列表时，你不再有可以使用可能在 Windows 7 中用过的 `Wireless Profile\
  \ Manager` 的选项，也不有右键点击网络并选择忘记它的选项了。现在你必须使用 `Netsh` 命令删除网络配置文件。\n\n### 注意：忘记连接\n\n\
  在特定情况下，你可以从网络列表中忘记网络。尝试连接到一个以前连接过的网络，当连接失败时，选择忘记该网络。\n\n要在命令提示符下使用 `Netsh` 命令忘记网络，请按照以下步骤操作：\n\
  \n1. 输入 `netsh wlan show profiles`。记下要忘记的配置文件。查看图 3-8\n\n   ![Use the Netsh command\
  \ to find and forget a wireless profile.](img/httpatomoreillycomsourcemspimages1988911.png)图\
  \ 3-8. 使用 Netsh 命令查找并忘记无线配置文件。\n\n2. 输入 `netsh wlan delete profile name=<profile\
  \ name>`。（将 `<profile name>` 替换为配置文件的名称）。查看图 3-8\n\n3. 按 `Enter`。\n\n### 配置位置感知打印\n\
  \n用户变得越来越移动化，这意味着他们可能需要从各个位置访问打印机。这些打印机位于任何类型的网络上，包括家庭网络、办公室网络甚至是公司自助机网络。每次连接到新网络都要选择打印机会让用户感到苦恼，因此需要位置感知打印。通过位置感知打印，可以为每个打印位置设置默认打印机。这还可以防止用户意外打印到错误的打印机，如果打印数据是机密的，这将安全问题。\n\
  \n### 考试技巧\n\n位置感知打印使用 `Network Location Awareness` 服务和 `Network List` 服务来确定网络位置。前者收集并维护网络配置信息，后者识别计算机所连接的网络。如果此功能无法工作，请注意你需要检查这些服务是否正在运行。\n\
  \n要配置位置感知打印，请按照以下步骤操作：\n\n1. 打开 `Devices And Printers` 窗口。\n2. 在菜单栏上，点击 `Manage\
  \ Default Printers`。（如果在台式计算机上或未安装默认打印机，则不会看到此选项。）\n3. 选择 `更改网络时更改我的默认打印机`。\n\n\n\
  \n\n\n4. 在`Select Network`（选择网络）下拉列表中，选择一个网络进行配置，如图图 3-9 所示。\n\n![打开设备和打印机，选择打印机，并点击管理默认打印机以配置位置感知打印。](img/httpatomoreillycomsourcemspimages1988913.png.jpg)图\
  \ 3-9。打开设备和打印机，选择打印机，并点击管理默认打印机以配置位置感知打印。\n\n5. 从`Select Printer`（选择打印机）下拉列表中，选择要使用的打印机。\n\
  \n6. 点击`Add`（添加）。\n\n7. 要删除某项，在已添加的项目列表中选择该项并点击`Remove`（删除）。\n\n### 配置网络适配器\n\n\
  网络适配器是一个 `NIC`（网卡）。根据类型不同，它可以通过 `Ethernet`（以太网）、`Wi-Fi` 或两者传输数据。你可以通过点击左侧任务窗中的`Change\
  \ Adapter Settings`（更改适配器设置）从 `Network And Sharing Center`（网络和共享中心）访问可用适配器。从那里可以很容易看出正在使用哪个网络适配器。图\
  \ 3-10 显示`Wi-Fi` 适配器已连接。你可以右键点击某项以访问其可用选项。\n\n![网络连接窗口显示了可用适配器。](img/httpatomoreillycomsourcemspimages1988915.png.jpg)图\
  \ 3-10。网络连接窗口。\n\n当你在 `Network Connections` 窗口中右键点击适配器，可以执行以下任意操作：\n\n* 启用或禁用适配器。（这可以帮助你解决连接问题，或在不需要时防止无线适配器搜索网络。）\n\
  * 连接或断开与关联网络的连接。\n* 查看适配器或连接的状态。（你可以用此查看发送和接收的字节数、诊断连接问题、查看信号质量和速度，以及查看 SSID 等。）\n\
  * 诊断适配器或连接中的问题。（你可以用此运行自动化工具来协助诊断连接问题。）\n* 桥接两个或多个连接。（你必须选择两个未被 `Internet Connection\
  \ Sharing`（Internet 连接共享）使用的 `LAN` 或 `High Speed Internet` 连接。网络桥接是连接到多个网段的网络设备。）\n\
  * 创建适配器的快捷方式以便于访问。\n* 如果选项可用，则删除该项。\n* 重命名适配器。\n* 查看适配器的属性。（你会看到在本章早期部分学过的熟悉的 `Properties`（属性）对话框。从那里你可以查看适配器使用的连接类型，并安装或卸载协议、`Hyper-V\
  \ Extensible Virtual Switch`（Hyper-V 可扩展虚拟交换机）、`Microsoft LLDP Protocol Driver`\
  \ 等。当你选择一个选项时，可以查看更多属性。）\n\n探索你可以访问的计算机适配器的可用选项。确保在任何 `Wi-Fi Properties`（Wi-Fi 属性）对话框中点击`Configure`（配置）以查看高级选项。例如，你可以配置计算机关闭设备以节约，或允许设备唤醒计算机（在\
  \ `Power Management` 电源管理选项卡上）。你还可以查看事件（`Events` 事件卡）、查看适配器和驱动程序详细信息（`Details`、`Driver`\
  \ 和 `General` 选项），以及查看高级配置选项（`Advanced` 高级卡）。\n\n### 思考实验：根据客户需求选择最佳 Windows 8 版本\n\
  \n在这个思考实验中，应用你对本目标所学的知识。你可以在本书末尾的“Answers”（答案）部分找到这些问题的答案。\n\n你支持多个移动用户。他们每月连接到十几个无线网络，并定期向这些网络上的打印机打印文档。用户抱怨说，当处于这些网络的一部分时，他们必须手动选择打印机，有时他们会选错。这不仅令人厌恼，而且由于他们打印敏感文档，这对你的公司来说也是一个安全问题。\n\
  \n此外，用户连接了一些他们希望让笔记本忘记的无线网络。网络列表很长，他们希望你删除他们再也不会使用的网络条目（或连接质量很差的网络，例如他们过去在酒店或会议中心连接过的网络）。对于连接较差的网络，他们更倾向于默认使用宽带。\n\
  \n针对此场景，回答以下问题：\n\n1. 在用户的 Windows 8.1 笔记本电脑上启用什么功能，以便通过网络连接定义用户默认打印的打印机？该功能依赖于哪两个服务？\n\
  2. 当用户位于以前住过的酒店，且该用户也连接了酒店的免费 `Wi-Fi` 时，你必须做什么来忘记该网络，以便用户下次住在那里时能默认使用宽带？\n\n###\
  \ 目标总结\n\n* 连接到无线网络有多种方法，包括使用 `Control Panel`（控制面板）、桌面任务栏上的 `Network` 图标以及 `Settings`（设置）小功能中的网络图标。\n\
  * 用户之前连接过的网络有默认优先级：`Ethernet`（以太网）、`Wi-Fi` 和 `mobile broadband`（移动宽带）。当有两个或多个无线连接可用时，Windows\
  \ 默认使用最后一次。你可以使用 `Netsh` 命令管理网络。\n* 位置感知打印允许用户为连接的每个网络配置默认打印机。\n* 每个网络都有默认打印机。通过右键点击适配器可以访问网络连接的选项。\n\
  \n### 目标复习\n\n回答以下问题以测试你对本目标的掌握情况。关于每个答案的正确性或错误性的解释以及这些问题的答案，在本章末尾的“Answers”部分。\n\
  \n**Q: 1. 在用户的 Windows 8.1 笔记本电脑上启用什么功能，以便通过网络连接定义用户默认打印的打印机？该功能依赖于哪两个服务？**\n**Q:\
  \ 2. 当用户位于以前住过的酒店，且该用户也连接了酒店的免费 `Wi-Fi` 时，你必须做什么来忘记该网络，以便用户下次住在那里时能默认使用宽带？**\n\n\
  \n\n\n4. 打开`Network And Sharing Center`（网络和共享中心）并点击`Troubleshoot Problems`（疑解答）。点击`Network\
  \ Adapters`解决网络适配器问题，并在提示时进行连接。\n\n## 目标 3.3：配置和维护网络安全\n\n保护独立计算机的方法有很多种，但在此目标中你将接受测试的大多数选项都在防火墙设置中。当然，还有其他保护计算机的地方，包括但不限于：应用组策略、启用\
  \ Windows Defender 或其他反恶意软件、在连接时选择适当的网络类型，甚至要求复杂的密码。尽管如此，我们将重点关注将测试的内容，详见下文。\n\n\
  本目标涵盖了如何：\n\n* 配置网络发现 (Network Discovery)\n* 配置 Windows 防火墙\n* 配置带高级安全的 Windows\
  \ 防火墙\n* 配置连接安全规则 (IPsec)\n* 创建身份验证异常\n\n### 配置网络发现\n\n默认情况下，网络发现对于专用网络和域网络启用，而对于公用网络禁用。`Network\
  \ Discovery` 允许计算机定位网络上的其他计算机，并允许网络上的计算机也能看到它。当网络受信任时，这样做很好，但当网络不可信时，这不是主意。通过为各种网络类型预先配置这些以及其他设置，以及端口和协议的适用设置，网络管理员就不需要手动配置连接的每个方面了。有一个例外：即使\
  \ `Network Discovery` 被禁用，如果用户知道这些资源的名称和位置，Windows 8.1 计算机仍然可以网络资源（因为它们无法通过浏览被发现）。\n\
  \n更改 `Network Discovery` 的配置是可能的。你可以通过 `Network And Sharing Center` 按照以下程序操作：\n\n\
  1. 打开`Network And Sharing Center`。\n2. 在左窗格中，点击`Change Advanced Sharing Settings`（更改高级共享设置）。\n\
  3. 如果适用，点击要更改设置的网络类型旁边的向下箭头：专用 (Private) 或访客或公用 (Guest Or Public)。\n4. 对 `Network\
  \ Discovery` 设置进行所需的更改。注意其他选项。请参见图 3-11。\n5. 点击`Save Changes`（保存更改），图中未显示。\n\n![在网络和共享中心为网络类型启用和禁用网络发现。](img/httpatomoreillycomsourcemspimages1988917.png.jpg)图\
  \ 3-11. 在网络和共享中心为网络类型启用和禁用网络发现。\n\n### 配置 Windows 防火墙\n\n`Windows Firewall` 是 Windows\
  \ 8.1 自带的软件解决方案，它在计算机与其连接的网络之间创建一个虚拟屏障，旨在保护计算机免受意外入站流量（数据）的影响，并保护网络免受意外出站流量（数据）的影响。防火墙允许特定类型的数据进入和离开计算机并阻止其他数据，默认配置（但可以更改）。这种保护被称为过滤。过滤器通常基于\
  \ IP 地址、端口和协议。\n\n* **IP 地址**：每个直接连接到网络的计算机和网络资源都分配有 IP 地址。防火墙可以根据资源的 IP 地址（或地址范围）阻止或允许流量。\n\
  * **端口**：端口号用于标识运行在计算机上的应用程序。例如，端口 `21` 与文件传输协议 (FTP) 关联，端口 `25` 与简单邮件传输协议 (SMTP)\
  \ 关联，端口 `53` 与 DNS 关联，端口 `80` 与超文本传输协议 (HTTP) 关联，端口 `443` 与 HTTPS (HTTP Secure)\
  \ 关联。\n* **协议**：协议用于定义发送或接收的数据包类型。常见协议有 `TCP`、`Telnet`、`FTP`、`HTTP`、邮局协议 3 (POP3)、互联网消息访问协议\
  \ (IMAP)、`HTTPS` 和用户数据报协议 (`UDP`)。（在考试之前，你应该熟悉最常用的协议。）\n\n尽管防火墙已经配置了许多规则，但你仍然根据端口、协议、程序等创建自己的入站和出站规则，以配置防火墙以满足你的精确需求。你将在本章节后面的部分学习。\n\
  \n#### 监控 Windows 防火墙\n\n你可以在`Control Panel`（控制面板）中监控 `Windows Firewall` 的状态。在这里很容易判断防火墙是开启还是关闭、默认阻止哪些入站连接、当前活动网络是什么，以及当防火墙采取行动时目前如何通知你。所有信息在主窗口中可用。要对防火墙状态进行基本更改，在左窗格中点击`Turn\
  \ Windows Firewall On Or Off`（启用或关闭 Windows 防火墙）。从那里你可以更改专用网络和公用网络的设置。每种有两个选项：\n\
  \n* 启用 Windows 防火墙（这是默认选择）\n    * 阻止所有入站连接，包括允许应用列表中的连接\n    * 当 Windows 防火墙阻止新应用时通知我（这是默认选择的。）\n\
  * 关闭 Windows 防火墙（不推荐）\n\n然而，作为网络管理员，你最感兴趣的至少从这个窗口来看，是左窗格中的可用选项。具体来说，你将使用 `Allow\
  \ An App Or Feature Through Windows Firewall`（允许应用或功能通过 Windows 防火墙）和 `Advanced\
  \ Settings`（高级设置）选项。你将在下一节学习 `Advanced Settings`，但在这里我们讨论允许被默认阻止的应用程序通过防火墙。\n\n\
  #### 允许应用程序通过 Windows 防火墙\n\n由特定应用程序生成并产生的某些数据已允许通过 `Windows Firewall`。你可以通过点击 `Control\
  \ Panel` 中 `Windows Firewall` 窗口左窗格中的`Allow To Communicate Through Windows Firewall`（允许通过防火墙通信）来查看哪些应用程序被允许。当你滚动列表时，你会看到许多熟悉的应用程序，包括\
  \ Bing 食饮料、游戏、地图、音乐、Windows Media 播放器等。请参见图 3-12。（一旦你点击`Change Settings`并获得管理员批准，`Change\
  \ Settings` 将变为不可用，列表中的选项将可以编辑，如此处。）你还会注意到某些应用程序默认未启用，包括 Windows Media Player 网络共享服务（Internet）、远程管理、远程关机、连接到网络投影等。\n\
  \n![默认情况下，某些应用程序已允许通过防火墙。](img/httpatomoreillycomsourcemspimages1988919.png.jpg)图\
  \ 3-12. 默认情况下，某些应用程序已允许通过防火墙。\n\n要允许应用程序通过防火墙或阻止其通过，请在要配置的网络配置文件下勾选复选框。如图 3-12 所示，每种配置有两个选项：专用\
  \ (Private) 和公用 (Public)。如果你没有想要允许或阻止的应用程序，点击`Allow Another App`（允许其他应用程序）。你可以在\
  \ `Add An App` 对话框中选择所需的应用程序。\n\n### 带高级安全的 Windows 防火墙\n\n\n\n\n\n尽管你可以在 Windows\
  \ 防火墙主窗口中配置一些选项，但真正的威力在于“带有高级安全功能的 Windows 防火墙”，如图图 3-13 你可以通过多种方式打开此窗口，其中一种是在图\
  \ 3-13 所示的 Windows 防火墙窗口中点击`高级设置`。\n\n![Windows Firewall with Advanced offers more\
  \ options than Windows Firewall.](img/httpatomoreillycomsourcemspimages1988921.png.jpg)图\
  \ 3-13 带有高级安全功能的 Windows 防火墙提供了比 Windows 防墙更多的选项。\n\n一旦打开，你需要熟悉几个选项和术语。\n\n*   在左侧窗格中（注意，中间和右侧窗格中的项目会根据你在此处选择的内容发生变化）：\n\
  \n    *   `入站规则`(Inbound Rules)。列出所有配置的入站规则，允许你双击列表中的任何项并按需要对其重新配置。某些应用程序规则是预定义的，不能进行过多修改，但可以禁用它们。在时间允许的情况下探索其他选项卡。你也可以右键点击左侧窗格中的`入站规则`并创建自己的自定义规则。规则类型包括`程序`、`端口`、`预定义`和`自定义`，它们将在本节稍后详细介绍。\n\
  \n    *   `出站规则`(Outbound Rules)。提供与入站规则相同的相同的选项，但这些适用于传出的数据。你也可以右键点击左侧窗格中的`出站规则`并创建自己的自定义规则。规则类型包括`程序`、`端口`、`预定义`和`自定义`，它们将在本节稍后详细介绍。\n\
  \n    *   `连接安全规则`(Connection Security Rules)。你手动创建的连接安全规则将显示在这里。连接安全规则规定了计算机在发送任何数据之前必须如何身份验证。IP\
  \ 安全（`IPsec`）标准定义了数据在`TCP/IP` 网络上传输时如何确保安全，如果需要，你可以要求连接在计算机发送数据之前使用此类类型的身份验证。你将在下一节学习更多关于连接安全规则的知识。\n\
  \n    *   `监控`(Monitoring)。提供活动防火墙状态、状态、常规设置以及针对专用和公共配置类型的更多信息。\n\n*   在右侧窗格中（你看到的内容取决于你在左侧窗格中选择了什么）：\n\
  \n    *   `导入/导出/恢复/诊断/修复策略`(Import/Export/Restore/Diagnose/Repair Policies)。允许你管理为防火墙配置的设置。策略使用\
  \ `.wfw` 扩展名。\n\n    *   `新建规则`(New Rules)。允许你启动相应的`规则向导`创建新规则。你也可以从`操作`菜单执行此操作。\n\
  \n    *   `过滤`(Filter By)。允许通过`域配置文件`、`专用配置文件`或`公共配置文件`过滤规则。你也可以按状态过滤：`启用`或`禁用`。使用它可以将出的规则缩小到仅你想查看的规则。\n\
  \n    *   `查看`(View)。允许你自定义在“带有高级安全功能的 Windows 防火墙”窗口中间窗格中的查看方式和内容。\n\n当你选择创建自己的入站或出站规则时，可以从四种规则类型中选择。向导会引导你完成过程，该过程会根据你想创建的规则类型而变化。四种规则类型如下：\n\
  \n*   `程序`(Program)。程序规则为你选择的特定程序或符合设置的规则属性的所有程序设置防火墙行为。你无法控制应用，但可以配置文件格式为 `.exe`\
  \ 的传统程序。你无法更改通过`AppLocker`分发的项目。一旦选择了要创建规则的程序，你就可以允许连接、仅在连接安全且已使用`IPsec` 进行身份验证的情况下允许连接，或阻止连接。你还可以选择应用于规则的配置文件（域、专用、公共）并为规则命名。参见图\
  \ 3-14\n\n*   `端口`(Port)。端口规则为`TCP` 和 `UDP` 端口类型设置防火墙行为，并指定哪些端口被允许或阻止。你可以将规则应用于所有端口或仅应用于你指定的端口。与其他规则一样，你可以允许连接、仅在连接通过`IPsec`\
  \ 保护的情况下允许连接，或阻止连接。你还可以选择应用于规则的配置文件（域、专用、公共）并为规则命名。\n\n    ### 更多信息：连接与安全性\n\n \
  \   当你创建入站和出站规则，以及当你选择仅在通过`IPsec`身份验证连接以确保安全的情况下允许连接时，连接将使用`IPsec` 属性中的设置和`连接安全规则`节点中的适用规则来确保安全。下一节将介绍如何创建连接安全规则。\n\
  \n*   `预定义`(Predefined)。预定义规则为你从 Windows 已经预定义的规则列表中选择的程序或服务设置防火墙行为。\n\n*   `自定义`(Custom)。自定义规则是你从头开始创建的，定义了规则的每个方面。如果前三种规则类型不能提供你需要的规则，请使用此项。\n\
  \n    ![The Inbound Rule Wizard walks you through the creation process.](img/httpatomoreillycomsourcemspimages1988923.png.jpg)图\
  \ 3-14 入站规则向导引导你完成创建过程。\n\n 考试提示\n\n在 Windows 防火墙窗口内部运行时，你可以访问并配置规则，即使它们不是激活状态。这包括专用、公共和域配置文件。\n\
  \n 考试提示\n\n我们不是否会问到有关创建规则的问题。因此，你应该花几分钟运行向导几次，每次选择不同的规则类型以熟悉。\n\n还有其他区域可以探索。在左侧窗格中选择带有高级安全功能的\
  \ Windows 防火墙并使用中间窗格的`概述`部分，点击`Windows 防火墙属性`显示图 3-15 所示的对话框。从那里你可以更改防火墙和配置文件，即使你没有连接到要配置的网络类型。\n\
  \n![Settings for specific profiles.](img/httpatomoreillycomsourcemspimages1988925.png.jpg)图\
  \ 3-15 使用带有高级安全功能的 Windows 防火墙对话框为特定配置文件配置设置。\n\n在图 3-15 中，`域配置文件`选项卡被选中。如果你愿意，可以配置在连接到域网络时关闭防火墙。此外，你可以加强`公共`配置文件的设置并自定义`专用`配置文件的设置。最后，你可以在`IPsec\
  \ 设置`选项卡上自定义 `IPsec` 默认值、例外和隧道授权。确保探索此对话框的所有区域，并研究你不熟悉的术语。\n\n### 考试提示\n\n当 Windows\
  \ 8.1 与 Windows Server 2012 结合时，可以使用新的防火墙功能，包括：\n\n*   用于 `IPsec` 传输模式的互联网密钥交换协议版本\
  \ 2 (`IKEv2`)\n\n*   Windows 商店网络隔离\n\n*   用于 Windows 防火墙的 Windows PowerShell `cmdlets`\n\
  \n\n\n\n\n## 配置连接安全规则 (IPsec)\n\n你可以在“高级安全 Windows 防火墙”窗口中创建自己的连接安全规则。在创建规则时，你可以创建入站和出站规则，当你选择创建一个仅在连接通过\
  \ `IPsec` 加密的情况下允许连接的规则时，这些规则将使用你配置的设置。开始之前，在快捷方式列表中右键点击`连接安全规则`（位于`出站规则`下方），然后点击`新建规则`。请参图\
  \ 3-16]。\n\n![创建新的连接安全规则。](img/httpatomoreillycomsourcemspimages1988927.png.jpg)图\
  \ 3-16. 创建新的连接安全规则。\n\n创建规则涉及多个步骤，并有一个向导来引导你完成。出现的向导页面取决于你在前一页上所出的选择。例如，如果在选择规则类型的第一页选择了`隔离`，则会有四个额外的步骤需要完成：设置要求、选择身份验证方法、选择应用该规则的配置文件以及为规则命名。然而，如果你选择创建身份验证豁免规则，系统会提示你在继续之前添加你想要配置身份验证要求的远程计算机。\n\
  \n### 更多信息：使用 IPsec 的主要优势\n\n`IPsec` 用于在计算机之间安全地传输数据。使用 `IPsec` 安全信息的主要优势是，所有使用\
  \ `IP` 进行数据传输的程序和服务都能受到保护。\n\n由于规则类型和选项有许多组合，我们无法涵盖每种场景。但是，你应该熟悉这些选项和规则类型。\n\n*\
  \   `隔离`。使用此规则类型创建一个根据凭据（如域成员身份、计算机状态或健康状况或符合策略的情况等）限制连接的规则。你可以选择对入站和出站连接请求身份验证、要求入站身份验证并请求出站身份验证，或对所有连接要求身份验证。随后，选择要使用的身份验证类型。你可以从已配置的默认值中选择，或使用适当的\
  \ `Kerberos` 或高级身份验证方法。\n*   `身份验证豁免`。使用此规则类型创建规则，说明哪些类型的连接可以免于身份验证。你可以将规则应用于单个\
  \ `IP` 地址、子网、`IP` 地址范围，或预定义的计算机组（例如 `DHCP` 或 `DNS` 服务器等）。完成后，你可以选择应用该规则的配置文件（域、私有、公共）并为规则命名。\n\
  *   `服务器到服务器`。使用此规则类型创建适用于命名 `IP` 地址或所有 `IP` 地址的规则，以对入站和出站连接请求身份验证、要求入站身份验证并请求出站身份验证，或对所有连接要求身份验证。你还需要选择身份验证方法，这可能是来自证书颁发者的证书，或从网络访问保护颁发的健康证书。你可以此保护特定的计算机（服务器）之间相互交互。\n\
  *   `隧道`。使用此规则类型创建规则，通过 `IPsec` 中的隧道模式对两台计算机之间的连接进行身份验证，例如两台计算机之间的客户端到网关或网关到客户端。你可以选择豁免受\
  \ `IPsec` 保护的连接并选择身份验证要求。\n*   `自定义`。如果之前的选项没有满足你的需求，请使用此规则类型创建自定义规则。\n\n### 考试提示\n\
  \n连接安全规则规定了身份验证发生的方式和何时，但它们并不允许这些连接。要允许连接，你必须创建一个入站或出站规则。在创建入站或出站规则期间，你需要选择连接所需的条件，包括要求连接已通过\
  \ `IPsec` 身份验证。当你这样做时，连接将使用 `IPsec` 属性中的设置和`连接安全规则`节点中的规则进行安全保护。\n\n### 创建身份验证异常\n\
  \n当你配置规则仅在通信计算机之间的连接使用 `IPsec` 加密时允许流量时，你正在创建一个身份验证异常。在创建入站或出站规则时，你在`规则向导`的应用程序`操作`页面上配置此选项。当你在`操作`页面上选择`如果连接安全则允许连接`时，你正在配置规则使用\
  \ `IPsec` 属性中的设置和`连接安全规则`节点中的规则来允许连接。\n\n要创建一个适用于单个 `TCP` 端口（Telnet，端口 `23`）的入站规则为其创建一个身份验证异常，请按照以下步骤操作：\n\
  \n1.  在“高级安全 Windows 防火墙”中，选择并右键点击`入站规则`。\n2.  点击`新建规则`。\n3.  对于规则类型，点击`端口`然后点击`下页`。\n\
  4.  在`协议和端口`页面上，保持勾选 `TCP`，并在`特定本地端口`框中输入 `23`。点击`下一步`。\n5.  要执行的操作，选择`如果连接安全则允许连接`并点击`下一步`。\n\
  6.  要配置授权用户或授权异常，选择相应的复选框，点击`添加`并使用`选择用户或组`对话框添加相应的条目。\n7.  对授权计算机和异常重复第 6 步。点击`下一步`。\n\
  8.  选择规则应应用的配置文件。点击`下一步`。为规则命名。点击`完成`。\n\n### 重要：考试中将包含什么\n\n本书涵盖了目标列表中列出的目标。然而，微软关于该考试的页面明确指出：“请注意，题目可能涉及但不限于此处描述的主题。”这意味着你将看到一些我们未涵盖的问题，我们甚至无法预测那些内容是什么。然而，举例来说，你可能会看到关于不同\
  \ Wi-Fi 身份验证的问题，包括`临时密钥完整性协议 (TKIP)`、`高级加密系统 (AES)`以及各种`Wi-Fi 保护访问 (WPA)` 选项。同样，你可能会遇到需要了解特定扩展名的问题，例如\
  \ `.fw`，这是导出 Windows 防火墙策略时使用的文件类型。你可能还被要求了解`分支缓存`或`直接访问`。\n\n由于我们无法在书中涵盖所有内容，因此对此处提供之外的内容进行准备至关重要。要了解如何访问其他资源，请访问\
  \ [`www.microsoft.com/learning/en-us/exam-70-687.aspx`](http://www.microsoft.com/learning/en-us/exam-70-687.aspx)，并在`衡量技能`下点击`显示全部`。每个目标都有额外的准备资源。查看该列表并熟悉提供的选项。\n\
  \n### 思考实验：通过互联网配置媒体播放共享\n\n在思考实验中，应用你在该目标上学到的知识。你可以在章末的“答案”部分找到这些问题的答案。\n\n客户有一个包含数千个音乐文件的媒体库。他希望以这种方式共享这些媒体，以便他在办公室的另一台计算机通过互联网访问。他已经在两台计算机的`媒体播放器`上启用了相应的选项。然而，他无法让共享生效。\n\
  \n1.  为了让该客户允许媒体播放器通过互联网共享音乐文件，你需要防火墙做什么？\n2.  你将在`Windows 防火墙`还是`高级安全 Windows 防火墙`中执行所需的任务？\n\
  \n\n\n\n\n# 3. 执行此操作时需要以管理员身份登录吗？\n\n### 目标摘要\n\n* 在`Windows 防火墙`中，你可以查看专用网络和公共网络的设置，并对这些设置进行基本更改。你还可以在那里禁用防火墙。\n\
  * 你可以使用`网络和共享中心`（Network And Sharing Center）中的高级共享设置，更改可用公共和专用配置文件的网络发现配置方式。\n*\
  \ 在`Windows 防火墙`中，应用程序要么允许通过防火墙，要么不允许。你可以创建异常，配置特定应用程序通过防火墙。\n* `带高级安全的 Windows\
  \ 防火墙`（Windows Firewall with Advanced Security）为管理员提供了更多选项，包括配置他们自己的入站、出站和连接安全规则；配置身份验证异常；以及更改现有的防火墙设置。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对本目标信息的掌握情况。你可以在章节末尾的“答案”部分找到这些问题的答案以及每个每个候选项正确或错误的解释。\n\
  \n| **问：** | 1\\. 当你在`带高级安全的 Windows 防火墙`中创建入站或出站规则，并在`新建规则向导`的`操作`页面上选择“如果安全则允许连接”（Allow\
  \ The Connection If It Is Secure）选项时，在与连接计算机之间传输数据之前必须满足什么类型的身份验证要求？ | 1. 连接必须通过`IPsec`进行身份验证并使用空封装。2.\
  \ 连接可以受`IPsec`保护，但不是必须。3. 连接必须要求私密性并进行加密。4. 连接将使用`IPsec` 属性中的设置和`连接安全规则`节点中的规则进行保护。\
  \ | | |\n| **问：** | 2\\. 当你在`带高级安全的 Windows 防火墙`中创建`连接安全`规则时，你可以将隔离规则用于？（选择所有适用项）\
  \ | 1. 你可以根据域成员关系限制连接。2. 你可以根据计算机的健康状态限制连接。3. 你可以要求创建一个隧道。4. 你可以使用该规则根据 IP 地址范围来隔离子网。\
  \ | | |\n| **问：** | 3\\. 在何处禁用专用网络配置文件的“网络发现”？ | 1. 在`网络和共享中心`中，通过`适配器设置` 2. 在`Windows\
  \ 防火墙`中，通过`高级设置` 3. 在`网络和共享中心`中，通过`高级属性` 4. 在`带高级安全的 Windows 防火墙`中，通过`Windows 防火墙属性`对话框\
  \ | | |\n| **问：** | 4\\. 你可以在何处查看活动防火墙规则列表？ | 1. 在`网络和共享中心`中，通过`适配器设置` 2. 在`Windows\
  \ 防火墙`中，通过`高级设置` 3. 在`网络和共享中心`中，通过`高级属性` 4. 在`带高级安全的 Windows 防火墙`中，通过`监控`选项 | |\
  \ |\n\n## 目标 3.4: 配置远程管理\n\n通过远程管理工具和技术，网络管理员可以访问网络上的计算机，对其进行控制并在其上执行任务，而无需物理坐在计算机前。这通过减少维护问题计算机所需的往返次数节省了精力和金钱。用户也可以远程访问自己的计算机，以便在不物理坐在计算机前的情况下进行相关工作。\n\
  \n**本目标涵盖了如何：**\n\n* 配置和使用`远程协助`（Remote Assistance）和`远程桌面`（Remote Desktop）\n* 使用`MMC`\
  \ 进行远程修改\n* 探索`远程管理工具`（Remote Management Tools）并配置设置\n* 使用 `Windows PowerShell`\
  \ 进行远程修改\n\n### 配置和使用远程协助和远程桌面\n\n你和最终用户都可以采用两种技术来远程访问和管理计算机。`远程协助`就是其中之一，它允许技术人员控制计算机以进行故障排除和执行维护任务，而无需物理前往出现问题的机器。这使得技术人员能够在不离开家或办公室的情况下解决问题。用户必须在场授权此操作，且用户可以随时结束会话。此技术通常仅用于故障排除远程计算机，而不用于远程办公或访问文件或文件夹。\n\
  \n`远程桌面`是另一种远程选项。`远程桌面`允许用户从家里连接到他们的办公计算机，以便远程办公和远程访问文件和文件夹。一旦建立连接，远程计算机将被锁定，这样其他人就无法访问它。用户可以执行任何坐在计算机前时可以完成的操作（除了按下物理按钮或拾取打印任务之外），包括运行桌面程序以及访问文件和文件夹。在另一种情景下，网络管理员使用此技术来维护文件服务器、打印服务器、域控制器等，而无需物理前往机器。\n\
  \n`远程访问`和`远程桌面`是内置的、易于使用的工具。然而，在考试之前有几个设置需要注意。你需要知道如何在最终用户的计算机上启用或禁用这些功能；你需要理解在配置远程桌面会话时可用选项；你需要知道如何配置和进行远程协助会话。\n\
  \n#### 启用或禁用远程功能\n\n默认情况下，`Windows 8.1`计算机启用了`远程协助`连接并禁用了`远程桌面`连接。你可以在`系统属性`（System\
  \ Properties）对话框中更改这两项，见图 3-17。你可以通过多种方式打开此对话框。一种是在开始屏幕上输入`系统`并点击结果中的`系统`。在`系统`对话框中，点击左侧的`高级系统设置`或`远程设置`。你想配置的选项在`远程`选项卡上。（如果你计划通过`远程桌面`访问此计算机，请现在启用该选项。）\n\
  \n![使用系统属性对话框允许或拒绝远程协助和远程桌面会话。](img/httpatomoreillycomsourspimages1988929.png.jpg)图\
  \ 3-17. 使用系统属性对话框允许或拒绝远程协助和远程桌面会话。\n\n### 考试提示\n\n如果计算机处于睡眠或休眠模式，你无法通过`远程桌面`远程访问计算机。因此，如果问到为什么`远程桌面`会话无法启用（即使它以前可以使用），请考虑将此项作为一个答案选项。（你可能还想更改控制面板中的`电源选项`设置来解决这个问题。）\n\
  \n#### 探索远程桌面选项\n\n你和你的最终用户可以通过开始屏幕上输入`远程`并点击结果中的`远程桌面连接`来访问`远程桌面连接`对话框。当对话框打开时，点击`显示选项`以访问图\
  \ 3-18 所示的所有选项。\n\n![远程桌面连接对话框提供了多个选项。](img/httpatomoreillycomsourspimages1988931.png.jpg)图\
  \ 3-18. 远程桌面连接对话框提供了多个选项。\n\n可用的选项卡提供了你配置远程桌面连接所需的选项：\n\n* **通用**。使用此选项卡上的设置指定计算机名称以及可选的用户名以及保存连接设置。\n\
  \n\n\n\n\n- **显示**：使用此选项卡上的设置选择远程桌面的尺寸，默认设置为`Large`（大）。你还可以选择颜色深度。如果你的用户通过免费且快速的网络连接，这些设置是可以的。然而，对于通过计费宽带访问桌面的用户，你应该选择更节省带宽的设置。\n\
  - **本地资源**：使用此选项卡配置音频设置（例如禁用音频）、是否启用对打印机和`Clipboard`（剪贴板）的访问以及何时启用组合键等。\n- **程序**：使用此选项卡为连接建立时应启动的程序命名。\n\
  - **体验**：使用此选项卡上的设置配置网络如何以优化性能。默认情况下，Windows 会自动检测设置，但在计费连接的情况下，你可能想将其更改为特定设置，如低速。当你手动配置此设置时，可以配置你想要允许的选项，包括限于桌面背景和窗口动画。默认情况下，`Reconnect\
  \ If The Connection Is Dropped`（连接中断时重新连接）是启用的，但可以根据需要更改。\n- **高级**：使用此选项卡配置身份验证选项。身份验证用于验证用户正在连接到目标计算机。选项有`Warn\
  \ Me`（警告我）、`Connect And’t Warn Me`（连接且不警告）和`Do Not Connect`（不连接）。你还可以配置`Connect\
  \ From Anywhere`（从任何地方连接）设置，在此你可以指定用户必须连接到指定的桌面网关服务器。\n\n设置好所需的配置后，现在可以使用“常规”选项卡进行连接。不过，你需要知道要连接的计算机的名称，在域中这可能会有点复杂。正如你在图\
  \ 3-18 所示，该计算机名称看起来如下：`computername.domainname.com`。在局域网连接上，名称就是计算机名称。无论什么情况，你还需要需要登录所需的凭据。对于远程桌面来说，那就是用户名和密码。请注意，用户名必须是类似于`computername\\\
  username`的格式。你不能只输入用户名就连接。在活动会话期间断开连接，只需点击右上角的`X` 即可。\n\n### 配置和使用远程协助\n\n要使用远程协助，用户必须位于出现问题的计算机旁。远程协助会话必须由该用户发起，并且用户必须在连接之前批准。搜索启动屏幕以发起远程协助会话的关键字是`invite`，而不是`Remote\
  \ Assistance`。用户需要在结果从中访问`Invite Someone To Connect Your PC And Help You`（邀请他人连接您的电脑并帮助您）或`Offer\
  \ To Help Someone Else`（帮助他人）选项。用户也可以在控制面板中搜索`Invite`或`Remote Assistance`。然而，无论用户到达那里，都必须点击图\
  \ 3-19 所示 Windows 远程协助对话框中的`Invite Someone You Trust To Help You`（邀请您信任的人帮助您）。\n\
  \n![用户必须启动远程协助会话。](img/httpatomoreillycomsourcemspimages1988933.png.jpg) 图 3-19。用户必须启动远程协助会话。\n\
  \n用户随后有三个选项：\n1. `Save This Invitation As File`（将此邀请保存为文件）：用户保存文件并使用其选择的方法将该文件发送给帮助和支持团队。\n\
  2. `Use Email To Send An Invitation`（使用电子邮件发送邀请）：使用机器上的电子邮件客户端发送邀请，但无法使用任何形式的网页版电子邮件发送。\n\
  3. `Use Easy Connect`（使用快速连接）：如果帮助和支持团队启用，这是最简单的选项。因为考试目标之一是配置远程协助（我们已经做过了），包括`Easy\
  \ Connect`（我们还没有做过），我们在这里查看`Easy Connect` 选项。然而，你也应该理解另外两个选项的工作原理。\n\n当用户选择`Easy\
  \ Connect`时，会出现一个`Easy Connect` 密码。用户只需将该密码传递给帮助和支持团队。这可以通过电话、传真、电子邮件甚至短信完成。支持技术人员随后可以发送请求，用户随后接受该请求。这两项都显示在图\
  \ 3-20。一旦连接建立，“专家”就可以请求控制计算机以解决问题、培训用户或执行其他任务。\n\n![使用快速连接通过远程桌面快速方便地获取帮助。](img/httpatomoreillycomsourcemspimages1988935.png.jpg)\
  \ 图 3-20。使用快速连接通过远程桌面快速方便地获取帮助。\n\n### 使用 MMC 进行远程修改\n\n尽管 Windows 8.1 中提供的 Microsoft\
  \ 管理控制台（`MMCs`）默认都配置为管理本地资源，但你可以使用`Computer Management`或内置的`MMC`对远程机器进行修改。\n\n要查看如何连接到另一台计算机进行管理，打开`Computer\
  \ Management`；在左窗格中，右键点击`Computer Management (Local)`；并点击`Connect To Another Computer`（连接到其他计算机）。在出现的对话框中，验证选择了`Another\
  \ Computer`，输入要连接的计算机名称，并点击`OK`。等待连接建立。如果提示要在`高级防火墙策略`中启用某些内容或在`组策略`中启用设置，请执行。然后，点击左窗格中的所需项目，并在右窗格中进行所需的配置。参见图\
  \ 21.\n\n![使用计算机管理连接到另一台计算机。](img/httpatomoreillycomsourcemspimages1988937.png.jpg)\
  \ 图 21。使用计算机管理连接到另一台计算机。\n\n### 探索远程管理工具并配置设置\n\nWindows 远程管理（WinRM）是 Windows 8.1\
  \ 的服务，允许网络管理员使用 PowerShell 和 Windows Remote Shell（WinRS）在网络计算机上远程执行命令。你可能也需要熟悉与`WinRM\
  \ 服务`相关的组策略设置。\n\n#### 启用远程管理\n\n要使用远程管理工具，你必须从命令行提示符启用它们，或者在要管理的计算机上使用组策略。组策略设置位于：`计算机配置`、`策略`、`管理模板`、`Windows\
  \ 组件`、`Windows 远程管理 (WinRM)`、`WinRM 服务`容器。你需要为每个组对象启用此。不过从命令行启用要简单。\n\n要启用远程管理，请按照以下步骤操作：\n\
  \n1. 以管理员身份打开命令提示符。\n2. 输入`winrm quickconfig`并按回键。\n3. 当提示要进行这些更改时，输入`y`并按回车。\n\
  4. 当再次提示时，输入`y`并按回车。参见图 22。\n5. 关闭命令提示符窗口。\n\n```\nwinrm quickconfig\n```\n\n**考试提示**：如果\
  \ WinRM 命令不起作用，可能是因为网络类型设置为`Public`（公共）。网络类型必须是`Private`（私有）或`Domain`（域）。\n\n\n\n\
  \n\n![Enable Remote Management.](img/httpatomoreillycomsourcemspimages1988939.png.jpg)\n\
  图 3-22 启用远程管理。\n\n## 从命令提示符执行命令\n\n在启用 WinRM 后，可以在具有权限的命令提示符（或 Windows PowerShell\
  \ 会话）中使用 `WinRS` 命令来执行远程操作。以下是一些可用参数：\n\n* `-r:computer`：使用此参数指定要执行命令的计算机。你可以使用\
  \ NetBIOS 名称或完全限定域名 (FQDN)。\n* `[-u:user]`：使用此参数指定你用于在远程计算机上执行命令时使用的账户。该账户需要是远程计算机上的账户。\n\
  * `[-p:password]`：使用此参数指定与用户帐户名关联的密码。（如果你没有在此处输入，系统会提示你输入。）\n* `Command`：使用此参数指定要使用的命令以及任何其他关联的参数。\n\
  * 更简练的表达方式为：`winrs [/<parameter>[:<value>]] <command*>`。\n\n在使用 `WinRS` 时，除了输入计算机、用户和密码外，还有其他选项，尽管这些是最常用的。要查看更多命令和语法，请参考此页面：*[http://technet.microsoft.com/en-us/library/hh875630.aspx]*\n\
  \n## 使用 Windows PowerShell 远程进行修改\n\n你可以使用 Windows PowerShell v3 通过具有权限的 PowerShell\
  \ 会话远程管理另一台计算机。如果你在命令提示符中启用了 WinRM，Windows PowerShell 已准备好接收命令。要在远程计算机上执行 Windows\
  \ PowerShell 命令，你使用以下语法：`icm computer {command}`，其中 `computer` 是远程计算机名称 `command`\
  \ 是你想使用的 PowerShell 命令。`ICM` 是 `Invoke-Command` 的缩写。要查看更多关于 Windows PowerShell 会话中的语法，请输入\
  \ `Winrs /?` 和 `icm -?`。\n\n### ICM 语法\n\n有关 ICM 的信息，请参考 Technet 上的此页面：*[http://technet.microsoft.com/en-us/library/hh849719.aspx]*\n\
  \n## 访问相应的组策略设置\n\nWindows 远程外组策略设置位于域服务器的此处：`计算机配置`、`策略`、`管理模板`、`Windows 组件`、`远程外壳`。你需要为每个组策略对象配置任何所需的设置。你可以使用这些设置来更改\
  \ `WinRS` 的默认行为。你可能想要检查的设置包括`允许远程外壳`、`指定空闲超时`和`指定外壳超时`。这些在 Windows Server 2012 中可用。\n\
  \nWinRM 服务组策略设置位于域服务器的此处：`计算机配置`、`策略`、`管理模板`、`Windows 组件`、`远程管理 (WinRM)`、`WinRM\
  \ 服务`。你可能想要检查的设置包括`允许通过 WinRM 进行远程管理`、`允许基本身份验证`、`允许未加密流量`以及`启用 HTTP 监听器`。这些位于 Windows\
  \ 2012 中。\n\n## 思考实验：选择合适的管理工具\n\n在本次思考实验中，应用你从本目标中学到的知识。你有一个客户需要几项任务的帮助，包括配置她的\
  \ Windows 计算机直接启动到桌面、安装网络打印机以及在 Internet Explorer 中设置她喜爱的页面。你位于公司园区的另一端办公室里，距离那里大约分之一英里。你不想走过去。\n\
  \n请就此场景回答以下问题：\n\n1. 你应该使用远程协助、远程桌面还是远程管理？\n2. 用户需要坐在她的电脑前才能接收你的帮助吗？\n3. 在你帮助她之前，用户必须做什么？\n\
  \n### 目标总结\n\n* 远程协助可用于排除出现问题的计算机的故障，而无需物理访问它们。用户必须在场，发送邀请，并在你提供帮助时接受。\n* 远程桌面是一种允许终端用户在离开电脑时访问其桌面的技术。可以对其进行配置，使用户在情况需要时可以在家里或在旅途中工作。\n\
  * 可以从命令行和 Windows PowerShell 会话远程管理计算机。但必须先在每台计算机上启用远程管理。\n\n### 目标回顾\n\n回答以下问题，以测试你对本目标中信息的掌握情况。你可以在本章末尾的“答案”部分找到这些答案以及对每个选项正确或错误的解释。\n\
  \n| | |\n| :--- | :--- |\n| **Q: 1.**** | 你创建了一个 `MMC` 并添加了三个加载项（snap-ins）。每个加载项与其他完全相同，除了它们都已配置为管理不同的网络计算机。只有其中一个可以工作。你怀疑问题出在哪里？（选择所有适用项。）\
  \ |\n| | 1. 每个 `MMC` 只能使用一个加载项的实例。<br>2. Windows 防火墙阻止了另外两台客户端计算机的访问。<br>3. 客户端计算机未启用远程管理。<br>4.\
  \ 你在两个未允许访问的计算机上没有适当的凭据。 |\n| **Q: 2.**** | 使用什么命令从命令提示符启动 Windows 远程管理服务？ |\n|\
  \ | 1. `Winrs quickconfig`<br>2. `Winrm [computername] quickconfig`<br>3. `Winrm\
  \ quickconfig`<br>4. `Winrs startconfig` |\n| **Q: 3.**** | 你正在尝试使用远程桌面连接到你的办公室计算机。你现在家里。你无法连接。可能是什么是什么？（选择所有适用项。）\
  \ |\n| | 1. 你需要在你的办公室计算机上允许远程桌面连接。<br>2. 远程计算机处于睡眠或休眠状态。<br>3. 你输入的计算机名或密码错误。<br>4.\
  \ 你未配置远程桌面连接窗口中的选项，特别是位于“体验”选项卡上的选项。 |\n| **Q: 4.**** | 你如何使用 `WinRS` 命令远程管理计算机？（选择所有适用项。）\
  \ |\n| | 1. 你不能。你必须使用 `WinRM` 命令。<br>2. 通过组策略管理器。<br>3. 在具有权限的命令提示符中。<br>4. 在具有权限的\
  \ PowerShell 会话中。 |\n\n## 总结\n\n* 计算机必须具有唯一的 IP 地址才能在网络上通信；这些地址可以是静态的、由 `DHCP` 分配的或由\
  \ Windows 通过 `APIPA` 获取。\n* 位置感知允许根据用户当前连接的网络配置他们应该打印的打印机。\n* 你可以在网络适配器的属性对话框中更改\
  \ IP 地址和指定 DNS 服务器等。\n* 有多种网络管理工具可用，包括 `Netsh` 等命令行工具、网络和共享中心等图形工具，以及 `Ping` 和 `Tracert`\
  \ 等故障排除命令行工具。\n* Windows 防火墙和带安全的 Windows 防火墙允许你控制防火墙的所有方面。你可以允许应用程序通过防火墙，并创建自己的入站、出站和连接安全规则。\n\
  \n## 答案\n\n本节包含本章思考实验的解决方案和目标回顾问题的答案。\n\n### 目标 3.1: 思考实验\n\n1. 无线适配器可能出了问题。它可能没有启用，或者需要更新驱动程序才能工作。\n\
  \n\n\n\n\n2. 可能吧。“网络和共享中心”Internet 连接疑难解答程序可以发现 Wi-Fi 适配器已禁用，尽管它可能不知道原因。如果适配器功能正常，它可以在管理员批准后启用它。\n\
  \n3. 你可以尝试“操作中心”查看 Wi-Fi 适配器是否有新的驱动程序可用。如果没有，你可以尝试使用`设备管理器` 查找。你也可以参考制造商网站查找如何启用\
  \ Wi-Fi 适配器（如果那是问题所在）。\n\n### 目标 3.1：复习\n\n1. **正确答案**: C\n    1. **错误**。这由 `DHCP\
  \ server` 处理。\n    2. **错误**。有技术可以处理此，包括各种隧道选项，但这不是 `DNS` 的工作。\n    3. **正确**。`DNS`\
  \ 负责此项。\n    4. **错误**。`APIPA` 是 Windows 在没有可用 IP 地址时执行的分配 IP 地址的操作。\n\n2. **正确答案**:\
  \ A 和 C\n    1. **正确**。你可以从适配器的`属性`对话框中分配静态 IP 地址。\n    2. **错误**。你不能在这里分配 IP 地址，尽管你可以查看为`网络防火墙`、`Internet\
