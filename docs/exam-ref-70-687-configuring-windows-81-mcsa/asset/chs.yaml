  \ Teresa Horton。\n\n最后，我要感谢我的家人，包括 Cosmo、Jennifer、我父亲 Andrew，甚至还有小 Allie，感谢他们在我从事不规律时间工作、且有时在一天工作结束后很久仍沉浸在“作者脑海中”时保持耐心。我还要感谢我的文学代理人和代表，包括\
  \ Studio B 的 Stacey Barone、Katrina Bevin 和 Renee Midrack。\n\n## 错误与书籍支持\n\n我们已尽一切努力确保本书及其配套内容的准确性。自本书出版以来报告的任何错误均列在：\n\
  \n`http://aka.ms/ER687R2/errata`\n\n如果你发现了未列出的错误，可以通过同一页面向我们报告。\n\n如果你需要额外支持，请电子邮件至\
