  \ Twitter 上：`http://twitter.com/MicrosoftPress`。\n\n## 准备考试\n\n微软认证考试是建立简历并让世界了解你专业水平的极佳方式。认证考试验证了你的工作经验和产品知识。虽然工作经验无法替代，但通过学习和实际操作进行准备可以帮助你应对考试。我们建议你通过结合各种学习材料和课程来完善你的备考计划。例如，你可以使用《Exam\
  \ Ref》和另一本学习指南进行“在家”准备，并参加微软官方课程。\n\n# 第 1 章：安装并升级到 Windows 8.1\n\n部署一个新的操作系统，无论是为家庭用户的单台计算机，还是为小企业的十几台计算机，亦或是为大型企业的\
  \ 10,000 台计算机（配备无数笔记本电脑、平板电脑和其他移动设备），简而言之，这需要周密的计划、研究和测试。\n\n首先，你必须决定哪个版本的 Windows\
  \ 8.1 能满足客户的需求。这需要一些研究以及对每个版本功能的了解。接下来，你需要确定是否存在的硬件和软件兼容性问题，并决定当兼容性出现问题时的做法。你还需要根据场景选择全新安装还是升级，并且需要了解这些选项相对于已安装操作系统的限制。在此之后，你需要在安装新操作系统之前制定用户数据、账户、用户配置文件、Windows\
  \ 设置甚至应用程序的迁移。\n\n### 重要：你读过第 xvi 页吗？\n\n那里包含了通过考试所需的技能宝贵信息。\n\n**本章目标：**\n\n* \
  \  目标 1.1：评估硬件准备情况和兼容性\n\n\n\n\n\n*   目标 1.2: 安装 Windows 8.1\n*   目标 1.3: 迁移和配置用户数据\n\
  \n## 目标 1.1: 评估硬件就绪性和兼容性\n\nWindows 8.1 提供四个版本。其中 Windows RT 仅运行在 ARM 平台上，而另外三个版本可以安装在传统的\
  \ 32 位或 64 位计算平台上。此外，每个版本的安装都有最低要求。如果你决定采取升级路线，也留有多种不同的升级路径需要考虑。\n\n**本目标涵盖了以下内容：**\n\
  \n*   选择理想的 Windows 8.1 版本\n*   执行就绪测试\n*   选择安装选项（全新安装或升级）\n\n### 选择理想的 Windows\
  \ 8.1 版本\n\nWindows 8.1 有四个版本，每个版本都提供特定的功能。通过学习每个版本的基础知识，你可以缩小选择操作系统的范围：\n\n*  \
  \ `Windows RT`。此版本预装在运行于 ARM 处理器的平板电脑及类似设备上。你无法作为独立产品购买。它无法在 ARM 处理器以外的任何设备上运行，因此如果你正在寻找为典型的笔记本电脑或台式电脑安装的操作系统，则无需考虑它。此外，它可以运行\
  \ Windows 商店中的应用，但不能用于安装或运行通常从互联网、网络共享、CD 或 DVD 获取的传统 Windows x86/x64 应用程序。Windows\
  \ RT 设备配有特殊版本的 Microsoft Office 以完成需要的任务，但它们没有自带 Windows 媒体播放器，并有其他局限性。\n\n*   `Windows\
  \ 8.1`。此版本是 Windows 的流行零售版。它通常用于家庭用户，但也可能适用于某些家庭办公用户。此版本预装在大型零售商店出售的大多数 PC 上，你会在终端用户从家里带到工作的大多数设备上看到它。你可以购买此版本并将其安装在\
  \ x86/x64 平台上。该版本在企业环境中的主要局限性是无法加入域。因此，如果你的客户需要加入域，那么这并不是你要选择的版本。（不过，如果需要，可以很容易升级到\
  \ Windows 8.1 专业版。）\n\n*   `Windows 8.1 专业版 (Windows 8.1 Pro)`。此版本主要用于中小型企业（无论是否有域）以及大型企业。它提供了\
  \ Windows 8.1 或 Windows RT 中不具备的功能，例如 BitLocker（运行 Windows RT、Windows RT 8.1 或 Windows\
  \ 8.1 的计算机可以使用设备加密进行保护，它是 BitLocker 的自定义版本）和 BitLocker To Go、托管远程桌面连接的能力、客户端 Hyper-V\
  \ 以及虚拟硬盘 (VHD) 启动。如果你的客户需要这些功能的任何一个，而你没有（也不想）通过批量许可购买 Windows 8.1 企业版，这就是你要选择的版本。\n\
  \n    ### 更多信息：BitLocker\n\n要了解更多关于 BitLocker 的信息，请参考此 TechNet 文章：`[http://technet.microsoft.com/en-us/library/hh831507.aspx#BKMK_Overview]`。这里有很多你在考试可能会可能会信息，例如：BitLocker\
  \ 不支持动态磁盘；启动顺序必须设置为首先从硬盘启动，而不是 USB 或 CD 驱动器；以及 BitLocker 支持操作系统驱动器的多因素身份验证。\n\n\
  *   `Windows 8.1 企业版`。此版本仅通过微软批量许可计划提供。客户可以购买企业协议 (EA)、选择协议或开放许可。客户有权在购买每个 Windows\
  \ 8 许可时购买软件保障 (SA)。并非所有客户都会为 Windows 购买 SA，因此有时会在每个产品发布后付费。如果你加入了计划，你将获得 Windows\
  \ 8.1 专业版的所有功能，以及这些 Windows 8.1 企业版独有的功能：开始屏幕控制、Windows To Go 创建器、AppLocker、BranchCache、DirectAccess\
  \ 和虚拟桌面基础设施 (VDI) 增强。\n\n每个 Windows 8.1 版本对 CPU 插槽和 RAM 等都有最小和最大系统设置。用于安装 Windows\
  \ 8.1 的硬件必须满足这些要求。\n\n表 1-1 详细列出了 Windows 8.1 的最低系统要求。\n\n表 1-1. 常用资源的最低配置\n\n|\
  \ | 32 位 (x86) | 64 位 (x64) |\n| --- | --- | --- |\n| 处理器速度 | 1 吉赫兹 (GHz) 或更高 |\
  \ 1 GHz 或更高 |\n| 系统内存 (RAM) | 1 GB | 2 GB |\n| 可用硬盘空间 | 16 GB | 20 GB |\n| 显卡适配器\
  \ | 带有 WDM 驱动程序的 DirectX 9 适配器 | 带有 WDM 驱动程序的 DirectX 9 适配器 |\n| 安全启动 | 基于统一扩展接口\
  \ (UEFI) | 基于 UEFI |\n\n### 考试提示\n\n考试中的题目不会要求你背诵哪些功能包含在 Windows 8.1 的哪些版本中。你将被根据特定场景选择版本。成本可能是一个因素；已安装\
  \ CPU 或 RAM 的限制也可能是一个因素。不兼容的专有软件（可能是 32 位）或无法更新的应用程序可能会排除 64 位版本（甚至排除升级本身）。确保你清楚，如果考试题目中说明客户需要加入域、安装和运行桌面应用或使用客户端\
  \ Hyper-V，你需要选择哪个版本。\n\n\n\n\n\n| 分配访问 | 是 | 否 | 是 | 是 |\n| :--- | :--- | :--- |\
  \ :--- | :--- |\n| 客户端 Hyper-V | 否 | 否 | 是 | 是 |\n| 加入域 | 否 | 否 | 是 | 是 |\n| 组策略\
  \ | 否 | 否 | 是 | 是 |\n| 侧载 LOB 应用程序 | 单独销售 | 否 | 单独销售 | 是 |\n| Smart Screen 控制 |\
  \ 否 | 否 | 是 | 是 |\n| Windows To Go 创建器 | 否 | 否 | 否 | 是 |\n| AppLocker | 否 | 否 |\
  \ 否 | 是 |\n| BitLocker 和 BitLocker To Go | 否 | 否 | 是 | 是 |\n| BranchCache | 否 |\
  \ 否 | 否 | 是 |\n| DirectAccess | 否 | 否 | 否 | 是 |\n| 远程桌面主机 | 否 | 否 | 是 | 是 |\n| VDI\
  \ 增强功能 | 否 | 否 | 否 | 是 |\n\n目前还有其他未列出的要求；你需要 Internet 连接来访问 Windows 商店并联网，并且需要一个兼容的触摸设备来使用触摸功能。用户还需要\
  \ Microsoft 帐户来使用某些应用和 Windows 商店。\n\n### 注意：使用理想的操作系统进行考试复习\n\n在本书中，我假设你运行的是 Windows\
  \ 8.1 专业版或企业版。\n\n最后，所有版本都提供来自 Windows 商店的自动应用更新、Internet Explorer 11、3D 打印支持、生物识别注册、InstantGo、MiraCast\
  \ 无线显示支持、移动热点和 Wi-Fi 共享、Wi-Fi Direct 无线打印支持、设备注册、Exchange ActiveSync、Open MDM 支持、工作文件夹、工作场所加入、设备加密、家庭安全、支持自带设备\
  \ (BYOD) 的多因素身份验证、远程业务数据删除、可信启动、Windows SmartScreen、内置虚拟专用网络 (VPN) 客户端、远程桌面客户端等。在参加考试之前，请确保你熟悉整个功能列表。\n\
  \n### 执行就绪测试\n\n在你决定在特定的工作站或特定场景下安装哪种版本的 Windows 8.1 后，你需要验证计算机是否符合支持该版本的最低要求。一种方法是将要求与相关工作站上安装的硬件进行手动比较。\n\
  \n### 现实世界：最低要求是不够的\n\n如果你在满足或勉强超过表 1-1 所示 RAM 最低要求的计算机上安装 Windows 8.1，你可以预见到用户在使用计算机时会遇到问题。根据我的经验，计算机运行速度可能非常缓慢，以至于用户变得焦虑和沮丧。如果计算机在错误的时刻死机，用户很可能会拔掉机器重启（或者更糟）。\n\
  \n如果你在具有 16 GB、20 GB 甚至 40 GB 空闲硬盘空间的计算机上安装 Windows 8.1，在涉及不属于域的家庭和小型企业用户的情况下，你是在为你自己和你的终端用户制造麻烦。虽然你可以进行安装，但可以预计普通用户很快就会耗尽磁盘空间（如果他们将数据保存在那里的话）。\n\
  \n如果你在一台主要用于游戏的计算机上安装 Windows 8.1，你需要比 `DirectX 9` 更强的显卡适配器。许多新游戏需要 `DirectX 10`。你还需要更多的内存和更快的\
  \ CPU 才能让游戏正常运行且无卡顿。\n\n除了沮丧、硬盘全满以及运行某些游戏的问题外，还有其他最低要求无法满足需求的情况。例如，客户端 Hyper-V 需要一个具有二级地址翻译\
  \ (SLAT) 功能的 64 位系统，并在 Windows 8.1 专业版或企业版中需要额外的 2 GB 内存。这在基础的最低要求列表中并未提到。\n\n检查计算机硬件是否准备就绪有多种方法；如果你只有几台计算机需要评估，可以使用“系统信息”工具进行。你可以手动将其中列出的内容与要安装的\
  \ Windows 版本的最低要求列表进行比较。不过，这会很快变得繁琐，特别是当你有六个以上的工作站需要评估时。你可以在开始屏幕上输入 `msinfo32.exe`\
  \ 来访问系统信息窗口（参见图 1-1）。\n\n![使用系统信息工具。](img/httpatomoreillycomsourcemspimages1988793.png.jpg)图\
  \ 1-1. 使用系统信息工具。\n\n如果你更倾向于自动化评估计算机的任务，可以使用 Windows 升级助手，它比手动评估要用户友好得多。同样，这是对单台计算机的评估。你可以通过\
  \ *[`windows.microsoft.com/en-US/windows-8/upgrade-to-windows-8`](http://windows.microsoft.com/en-US/windows-8/upgrade-to-windows-8)*\
  \ 访问 Windows 8.1 升级助手。点击 Windows 8.1 升级助手链接。该网页所示于图 1-2。\n\n在任何情况下，你都应该在用户的单台计算机上运行\
  \ Windows 8.1 升级助手，在小型企业中尽可能在所有计算机上运行，并在代表你想要升级的企业机器上运行。这可以帮助你发现可能没有想到的问题（或以后需要测试的问题）。例如，笔记本电脑的屏幕分辨率可能不支持\
  \ Windows 8.1。这种冲突无疑会导致问题。你还可能发现你当前使用的软件必须更新才能与 8.1 兼容，或者你需要旧打印机和其他硬件的设备驱动程序。图 1-3\
  \ 显示了一个兼容性报告。\n\n![定位 Windows 8.1 升级助手。](img/httpatomoreillycomsourcemspimages1988795.png.jpg)图\
  \ 1-2. 定位 Windows 8.1 升级助手。![Windows 8.1 升级助手的结果可以帮助你判断兼容性。](img/httpatomoreillycomsourcemspimages1988797.png.jpg)图\
  \ 1-3. Windows 8.1 升级助手的结果可以帮助你判断兼容性。\n\n### 注意：使用企业工具评估域的就绪情况\n\n如果你正在评估属于域的企业级计算机组（可能是数百甚至几千台），你将希望使用一种能够将当前清单与你选择的新操作系统的要求进行比较的程序或应用程序。目前提供的任何选项（手动比较或\
  \ Windows 升级助手）都不适用于拥有大量计算机的企业。此外，你可能还会结合诸如应用程序兼容性工具包 (ACT) 等程序来确定软件的就绪情况。\n\n在你确定了安装哪个版本的\
  \ Windows 8.1 并评估了可用硬件后，你可能需要进行一些硬件升级。你可能需要用新计算机替换旧计算机。通常情况下，你可以重新利用旧计算机，并仅为需要的客户购买新机器，以帮助降低成本。\n\
  \n\n\n\n完成硬件评估后，你还需要执行几个步骤。其中最重要的步骤之一是验证客户端使用并依赖的软件是否在 `Windows 8.1` 上正常运行。你需要设置一台（或多台）测试机来确定这一点，如果软件无法正常工作，你可以尝试在“程序兼容性模式”下运行（请参见图\
  \ 1-4）。你可以从“控制面板”打开“程序兼容性疑难解答”，并按照提示来定义问题并尝试解决方案。在大多数情况下，解决方案是以该应用程序设计时运行的模式运行它（可能是\
  \ `Windows Vista` 或 `Windows XP`）。如果问题持续存在无法解决，你将不得不重新评估升级，或尝试其他选项，例如将应用程序托管在网络服务器或云端。（更好的选项是将过时的软件替换为长期兼容的软件，但这通常不是一件容易做的事。）\n\
  \n如果程序兼容性模式无法解决兼容性问题，你仍然还有选择。你可以使用`Microsoft Application Virtualization`软件（`MS App-V`），它允许应用程序从虚拟应用程序服务器流传输到任何客户端。它消除了对应用程序进行传统本地安装的需求，解决了与不兼容相关的问题。在单工作站上，`Client\
  \ Hyper-V` 可能更合适。然而，`Client Hyper-V` 仅可以在运行 64 位版本`Windows 8 专业版`或企业版的 64 位 PC 上运行。\n\
  \n最后，你可能会发现你无法承担升级费用，或者在升级之前必须将公司专用软件更新为兼容版本，或者你需要流传输应用程序或在虚拟机上运行，或者认为升级是必要的且将会成功。如果你决定升级是必要的，你必须选择以升级的方式安装操作系统，或者全新清洁安装操作系统。\n\
  \n![查找并运行程序兼容性疑难解答。](img/httpsatomoreillycomsourcemspimages1988799.png.jpg)图 1-4.\
  \ 查找并运行程序兼容性疑难解答。\n\n### 注意：升级不仅仅是安装操作系统\n\n如果你正在将公司内的所有计算机从例如 `Microsoft Windows\
  \ XP` 更新到 `Windows 8.1`，你需要担心的将远比硬件升级成本、为旧留外设寻找兼容驱动程序以及升级软件要多得多。你还需要考虑培训用户所需的成本、购买硬件和软件的费用，以及建立一套大量的帮助台基础设施（至少是一段时间），以便在用户需要时立即为他们提供帮助。\n\
  \n### 选择安装选项（清洁安装或升级）\n\n对于家庭或小微企业用户而言，是全新清洁安装操作系统还是对现有系统进行升级，这个问题通常取决于需要迁移多少数据。它还取决于用户是否拥有在执行清洁安装时重新安装应用程序所需的程序\
  \ ID 代码、计算机运行是否正常且高效，以及它是否没有恶意软件和病毒。正在升级的是哪种操作系统也很重要；你可以在 `Windows 7` 或 `Windows\
  \ 8` 计算机上进行就升级，这会保留用户的个人数据、应用程序和配置设置，这通常是家庭用户所希望的。\n\n### 考试技巧\n\n在许多（如果不是大多数）情况下，选择执行清洁安装是升级的更好的解决方案。如果你看到关于此的测试题，请仔细评估给出的信息。将数据从机器上迁移、执行清洁安装，然后将数据传回来可能会对你更有利。\n\
  \n对于不精通电脑的终端来说，升级一台健康的 `Windows 7` 计算机通常是首选，因为（除了操作系统本身发生的变化外）他们的设置、应用程序、打印机配置、网络设置、桌面背景、屏幕保护程序等在安装后都是完好无损的。执行就地升级时，用户不会被各种变化所轰炸，你不需要重新安装他们的应用程序、网络等。\n\
  \n### 注意：理解从 Windows 7 开始的升级路径\n\n在 `Windows 7` 版本中，对于升级到哪个 `Windows 8.1` 版本存在限制。你可以将\
  \ `Windows 7 家庭版`、`Windows 7 家庭基本版`和`Windows 7 家庭专业版`升级到 `Windows 8.1` 或 `Windows\
  \ 8.1 专业版`。你可以将 `Windows 7 专业版`和`Windows 7 终极版`升级到 `Windows 8.1 专业版`。只要有批量许可协议，还可以将\
  \ `Windows 7 专业版`和`Windows 7 企业版`更新到 `Windows 8.1 企业版`。\n\n对于家庭用户（或者对于任何用户）来说，升级并不总是选项。如果因为计算机过旧或不兼容而必须更换，或者计算机饱受无法清除的恶意软件、浏览器工具栏和不受欢迎的搜索引擎的困扰，则无法执行就地升级。通常情况下，最好进行清洁安装。对于运行\
  \ `Windows 7` 之前的任何兼容操作系统的计算机，无法执行真正的就地升级。表 1-3 概述了在进行任何类型的升级时哪些会被迁移，哪些不会。\n\n表\
  \ 1-3. Windows 8.1 的升级路径\n\n| 从...升级 | 你可以保留 |\n| --- | --- |\n| Windows 8 | Windows\
  \ Store 应用、桌面应用程序、个人文件、Windows 设置 |\n| Windows 7 | 应用程序、个人文件、Windows 设置 |\n| Windows\
  \ Vista SP1 | 个人文件、Windows 设置 |\n| Windows XP SP3 | 个人文件 |\n\n### 注意：理解从 Windows\
  \ 8 开始的升级路径\n\n在 `Windows 8` 版本中，对于就地升级到哪个 `Windows 8.1` 版本存在限制。你可以将 `Windows 8`\
  \ 升级到 `Windows 8.1`。你可以将 `Windows 8`、`Windows 8 专业版`和`带有媒体中心的 Windows 8 专业版`升级到\
  \ `Windows 8.1 专业版`。只要有批量许可，你可以从 `Windows 8 专业版`、`带有媒体中心的 Windows 8 专业版`、`Windows\
  \ 8 企业版`和`Windows 8.1 专业版`升级到 `Windows 8.1 企业版`。\n\n在大型企业中，升级或执行清洁安装的决定取决于目前列出的因素（可能还有其他因素，例如培训数千名员工、安装更新的硬件、更新专用等需要花费多少时间和金钱），但通常企业中的计算机会执行清洁安装。原因有很多，但确切知道每台机器上的内容可以帮助企业减少与培训、支持和升级相关的成本，这对于网络管理员来说一直是一大胜利。此外，网络管理员可以在安装之前测试\
  \ Windows 更新、应用程序更新和其他软件，并知道这对于所有受影响的计算机都是适当的测试。清洁安装还能清除计算机残留的问题或隐藏的恶意软件。\n\n\n\n\
  此外，在企业中，大多数用户将数据存储在网络服务器上，而这些服务器还维护着用户配置文件（包括但不限于配置设置和登录凭据），这使得数据迁移变得非常简单（且安全）。数据也存储在服务器上，因此你不需要太担心意外的数据丢失。此外，较大的域很可能已经配备了迁移用户数据、配置文件、设置等工具，利用这些工具将是一个加分项。无论原因何，当所有计算机几乎完全相同时，它们管理起来要容易得多。有很多适用于企业级的选项可以帮助你评估升级策略，其中许多将在本书的后续章节介绍。\n\
  \n### 思考实验：根据客户需求选择最合适的 Windows 8 版本\n\n在这一思考实验中，请运用你在本目标中学到的知识。你可以在本章末尾的“答案”部分找到这些问题的答案。\n\
  \n你被一家小公司聘请加入规划委员会，帮助其为 `Windows Vista` 工作站升级到 `Windows 8.1` 选择最佳方案。公司共有 25 台工作站，尽管它们运行的都是\
  \ 32 位的 `Windows Vista` 版本，但它们是在三年内购买的，且来自不同的计算机制造商。该公司运行一个专有的数据库应用程序来管理库存，该程序是专门为其需求定制的，并于六年前创建。每台工作站都是公司\
  \ `Active Directory` 域的一部分，网络上有一台 `Windows Server 2008 R2` 服务器。该公司没有 `Microsoft`\
  \ 批量许可协议。\n\n所有机器至少配备了 `1 GHz` 处理器和 `2 GB` 的 `RAM`，且每台机器至少有一个 `80 GB` 的硬盘。视频显卡支持\
  \ `DirectX 9` 的最低要求。所有计算机都位于一个大型仓库内。\n\n委员会希望在升级上花费尽可能少的钱。他们倾向于保留升级现有计算机的选项，但想知道这样做的后果，并可以重新考虑。此外，工作站用户需要访问\
  \ `Active Directory` 域支持和 `Storage Spaces`，少数用户需要 `Client Hyper-V`。\n\n请为你的经理回答以下问题：\n\
  \n1. 你应该安装哪个版本的 `Windows 8.1`，选择哪种平台选项，为什么？解释为什么你选择的版本是该公司的唯一适用选择。\n2. 详细说明你将从测试过程的何处开始以验证这\
  \ 25 台计算机的兼容性。\n3. 你会建议清洁安装而不是升级吗？为什么或为什么不？\n\n### 目标总结\n\n*   有四种 `Windows 8.1`\
  \ 版本：`Windows RT`、`Windows 8.1`、`Windows 8.1 Professional` 和 `Windows 8.1 Enterprise`。\n\
  *   每个 `Windows 8.1` 版本都有自己的一套功能。你根据所需的功能选择安装的版本。\n*   存在从 `Windows XP`、`Windows\
  \ Vista`、`Windows 7` 和 `Windows 8` 的升级路径，但你只能从 `Windows 7` 和 `Windows 8` 执行原地升级（以保持应用程序、个人文件和\
  \ Windows 设置完整）。在大多数情况下，可行，清洁安装是最好的。\n*   在大多数情况下，你可以使用 `Program Compatibility`\
  \ 模式强制旧的、不兼容的程序在 `Windows 8.1` 中运行。如有，你也可以选择 `App-V` 或 `Client Hyper-V`。\n\n## 目标复\n\
  \n回答以下问题以测试你对本目标信息的掌握程度。你可以在本章末尾的“答案”部分找到这些问题的答案以及每个备选答案正确或错误的解释。\n\n| **问:** 1.\
  \ 你需要对你小企业中的计算机进行原地升级。你有 9 台计算机需要更新到 `Windows 8.1`。这些计算机都运行不同版本的 `Windows`，有些带有服务包，有些没有。以下哪些操作系统可以在保留至少\
  \ Windows 设置和用户个人文件的情况下进行升级？（请选择所有适用项。）\n1. `Windows Vista`\n2. `Windows XP SP3`\n\
  3. `Windows 7 Home Premium`（带有或不带 `SP1`）\n4. `Windows 8` |\n\n| **问:** 2. 你想在一台具有以下硬件配置的笔记本电脑上安装\
