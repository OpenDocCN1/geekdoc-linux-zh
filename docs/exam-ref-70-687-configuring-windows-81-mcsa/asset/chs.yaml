  \ |\n\n## 目标 2.5：配置 Hyper-V\n\n使用 Windows 8 专业版和 Windows 8 企业版，你可以创建位于单台计算机单一操作系统内部的虚拟机。这些虚拟机可以运行自己的操作系统，你可以通过虚拟交换机对其进行隔离和安全保护。`Hypervisor`\
  \ 将这些子操作系统与父操作系统隔离。这使得网络管理员可以将多台机器合并为一台，从而节省金钱、电力消耗、资源和空间等。在 Windows 8.1 中，此技术被称为\
  \ `Client Hyper-V`，这是一个免费组件。\n\n要使用 Client Hyper-V，你需要以下条件：\n* Windows 8.1 专业版或企业版，64\
  \ 位\n* 支持二级地址翻译 (SLAT) 的处理器\n* 2 GB 内存（操作系统所需的 2 GB 之外）\n* BIOS 级硬件虚拟化支持\n\n**此目标涵盖了：**\n\
  \n* 创建并配置虚拟机\n* 创建和管理检查点\n* 创建并配置虚拟交换机\n* 创建并配置虚拟磁盘\n* 移动虚拟机\n\n### 创建并配置虚拟机\n\n\
  如果你有一台兼容的计算机，就可以创建并配置虚拟机。但是你必须首先安装 `Client Hyper-V`。你可以在 `Control Panel` 的 `Programs`\
  \ 下进行操作。点击 `Turn Windows Features On Or Off`，找到 `Hyper-V` 并选择所有相关项。请参见图 2-22。启用后，点击\
  \ OK 并重启计算机。\n\n### 重要：BIOS 必须支持虚拟化\n\n你可能需要进入 BIOS 来启用虚拟化。\n\n### 考试提示\n\n你可以在\
  \ PowerShell 中启用 Hyper-V：`Enable-WindowsOptionalFeature –FeatureName Microsoft-Hyper-V\
  \ –All`。\n\n![Install Hyper-V and its components.](img/httpatomoreillycomsourcemspimages1988875.png)\
  \ 图 22. 安装 Hyper-V 及其组件。\n\n### 注意：有时 Windows 功能对话框中不可用 Hyper-V\n\n如果你在 `Windows\
  \ Features` 对话框中看不到任何 `Hyper-V` 项，则计算机运行的是 Windows 8.1（非专业版或企业版）或者是 32 位的。如果你看到所有内容，但\
  \ `Hyper-V Platform` 不可用而其他一切正常，那么计算机的处理器不支持 SLAT。\n\n### 创建虚拟机\n\n你使用 `Hyper-V\
  \ Manager` (图 2-23) 来创建虚拟机。你可以从开始屏幕输入 **Hyper-V Manager** 并点击结果中的项打开此管理器。默认情况下，不存在虚拟机。`Hyper-V\
  \ Manager`窗口分为五个窗格：\n\n* Hyper-V Hosts 允许连接本地和远程 Hyper-V 主机计算机。\n* Virtual Machines\
  \ 列出所选 Hyper-V 主机上的虚拟机。\n* Actions 允许你配置主机网络和设置。\n* Checkpoints 允许你访问所选虚拟机的保存检查点（快照）。（检查点就像虚拟机的照片；它是当前设置和配置的时间点映像。）\n\
  * Details 允许你查看用于配置功能选项的可用选项卡。\n\n![Use the Hyper-V Manager to create and configure\
  \ a virtual machine.](img/httpatomoreillycomsourcemspimages1988877.png) 图 23. 使用\
  \ Hyper-V Manager 创建并配置虚拟机。\n\n要创建虚拟机，请按照以下步骤操作：\n\n1. 使用管理员凭据登录，打开 `Hyper-V Manager`，并在\
  \ Action 菜单中点击 `New>Virtual Machine`。\n2. 点击 Next 开始创建过程。\n\n\n\n\n\n3. 指定新虚拟机的名称和位置。目前最好保持默认位置，因此请点击“下一步”。查看图 2-24。\n\
  \n![按照向导程序创建虚拟机。在此窗口中对其命名。](img/httpatomoreillycomsourcemspimages1988879.png.jpg)图 2-24.\
  \ 按照向导程序创建虚拟机。在此窗口中对其命名。\n\n### 重要提示：对虚拟机进行更改\n\n在创建创建虚拟机之后，你无法更改应用于虚拟机的“生成”类型。\n\
  \n4. 选择最符合你需求的“生成”选项并点击“下一步”：\n\n*   `第 1 代`支持与之前的版本 Hyper-V 相同的虚拟硬件。你可以将其用于包括 Windows\
  \ Server 2008 和 Windows 7 在内的操作系统。\n*   `第 2 代`支持安全启动（Secure Boot）、SCSI 启动以及使用标准网络适配器的\
  \ PXE 启动。客户操作系统必须至少运行 Windows Server 2012 或 64 位的 Windows 8 或 Windows 8.1。\n\n5.\
  \ 输入所需的启动内存量，并选择是否为此类机使用动态内存。点击“下一步”。\n\n6. 在“配置网络”页面上，点击“下一步”。只有在你之前创建过网络交换机设置时，在此处才会看到选项。\n\
  \n7. 验证已选择“创建虚拟硬盘”选项且设置正确。点击“下一步”。查看图 2-25。\n\n![验证你已配置的设置。](img/httpatomoreillycomsourcemspimages1988881.png.jpg)图 2-25.\
  \ 验证你已配置的设置。\n\n8. 对于我们这里的此处的示例，保持勾选“稍后安装操作系统”并点击“下一步”（不过，你也可以选择现在安装操作系统）。\n\n9.\
  \ 点击“完成”（注意 Hyper-V 管理器底部面板中的新虚拟机）。\n\n10. 保持 Hyper-V 管理器打开。\n\n### 配置虚拟机\n\n一旦你创建了虚拟机，就可以对其进行配置；在此之前它并没有实际用途。这涉及安装操作系统并配置硬件设置以适应你当前的需求。在开始之前，找到操作系统光盘或磁盘映像。在本示例中，我们将\
  \ Windows 8 光盘插入 DVD 驱动器。\n\n要配置虚拟机，请遵循以下步骤：\n\n1. 在 Hyper-V 管理器中，在顶部中间的“虚拟机”面板中，点击要配置的虚拟机。查看图 2-26。\n\
  \n2. 点击`操作`并点击`设置`。\n\n![使用“操作”选项卡为你的新虚拟机配置设置。](img/httpatomoreillycomsourcemspimages1988883.png.jpg)图 2-26.\
  \ 使用“操作”选项卡为你的新虚拟机配置设置。\n\n3. 在“设置”窗口中，在`IDE 控制器 1`（在我们的场景中）下，点击`DVD 驱动器`。\n\n4.\
  \ 在我们的场景中，在`DVD 驱动器`面板中，点击`物理 CD/DVD 驱动器`，如果存在多个驱动器，请验证是否选择了正确的驱动器。查看图  2-27。\n\n\
  ### 注意：探索“设置”窗口中的所有选项\n\n确保你探索了图  2-27 中所示“设置”窗口右侧面板中的选项。点击每项以查看可用内容。它们通常是自显其明的：`BIOS`、`内存`、`处理器`等等。\n\
  \n![选择代表操作系统磁盘或映像所在选项。](img/httpatomoreillycomsourcemspimages1988885.png.jpg)图 2-27.\
  \ 选择代表操作系统磁盘或映像所在选项。\n\n5. 在“虚拟机”面板中，再次点击新建的虚拟机。\n\n6. 右键点击你选择的虚拟机，然后点击`启动`。\n\n\
  7. 再次右键点击虚拟机并点击`连接`。\n\n8. 如果设置没有启动，在虚拟机窗口内部，点击`操作`并点击`Ctrl+Alt+Del`。这将重启虚拟机并允许安装过程开始。你可以在图 \
  \ 2-28 中看到`操作`菜单，以及 Windows 8 安装过程的屏幕。\n\n![通过安装操作系统配置新虚拟机。](img/httpatomoreillycomsourcemspimages198887.png.jpg)图 \
  \ 2-28. 通过安装操作系统配置新虚拟机。\n\n### 重要提示：虚拟机需要生成类型\n\n如果你正在安装新的 8.1 机器，你需要一个生成类型。一旦安装完成，你就可以像处理任何操作系统一样处理该虚拟机。图 \
  \ 2-29 显示了一个运行中的已安装虚拟机的示例。\n\n![在计算机上运行的虚拟机。](img/httpatomoreillycomsourcemspimages198889.png.jpg)图 2-29.\
  \ 在计算机上运行的虚拟机。\n\n### 安装集成服务\n\nHyper-V 包含一个名为“集成服务”的软件包，用于改进物理计算机与虚拟机之间的集成。在大多数情况下，你应该在安装操作系统之后安装集成服务。这些服务安装完成后，所有集成服务都将启用。\n\
  \n### 考试提示\n\n集成服务只能使用 Hyper-V 管理器安装。它无法自动化或通过`PowerShell` 执行。\n\n要向新虚拟机上安装集成服务，请遵循以下步骤：\n\
  \n1. 在 Hyper-V 管理器中，右键点击虚拟机并点击`连接`。\n\n2. 在虚拟机连接的`操作`菜单上，点击`插入服务磁盘`。（如果看不到该菜单，请让虚拟机处于还原模式。）\n\
  \n3. 点击虚拟机右上角出现的通知，然后点击`安装集成服务`。\n\n4. 在用户帐户控制框中点击`是`。\n\n5. 如果看到提示“此计算机已运行当前版本的集成服务”，点击`确定`。否则，执行安装过程。\n\
  \nClient Hyper-V 通常是在不同平台和各种硬件部署场景下测试软件的完美工具。尽管它有一些局限性，但许多增强。回顾此处的所有信息，以验证你熟悉所有这些功能和限制：*[`technet.microsoft.com/en-us/library/hh85723.aspx`](http://technet.microsoft.com/en-us/library/hh85723.aspx)*\n\
  \n### 创建和管理检查点\n\n如果你在 Windows 8.1 使用它之前熟悉 Client Hyper-V，你可能知道*快照*这个术语。它已被新术语检查点取代。你手动创建一个检查点来保存虚拟机的状态。这保存了硬盘的所有内容，包括应用程序数据文件、设置、配置等。当你不再需要该检查点时，可以删除它（这些文件可能很大）。此外，检查点是可选的。要创建检查点，请遵循以下步骤：\n\
  \n1. 在 Hyper-V 管理器中，点击你刚刚创建并配置的虚拟机。\n\n2. 根据情况，点击`操作`并点击`启动`；然后点击`操作`并点击`连接`。\n\n\
  3. 右键点击虚拟机并点击`检查点`。查看图  2-30。\n\n\n\n\n\n![创建检查点。](img/httpatomoreillycomsourcemspimages1988891.png.jpg)图\
  \ 2-30。创建检查点。\n\n4. 在 `Checkpoints`（检查点）面板中，右键点击新的检查点并点击 `Rename`（重命名）。\n5. 为检查点适当命名（例如\
  \ `Day1AfterInstall`）。\n\n要测试检查点，请按照以下步骤操作：\n\n1. 在虚拟机内部进行更改。例如，更改桌面背景。\n2. 在 `Hyper-V\
  \ Manager` 中，在 `Virtual Machines`（虚拟机）面板中，右键点击 `VM` 并点击 `Revert`（还原）。\n3. 再次点击 `Revert`\
  \ 以验证。\n4. 返回运行中的 `VM`，注意更改已撤销。\n\n### 差异磁盘\n\n差分磁盘（differencing disk）是你创建的虚拟硬盘\
  \ (`VHD`)，用于隔离你对 `VHD` 或虚拟机操作系统所做的更改。你将这些更改存储在一个单独文件中。差异磁盘与另一个（已存在的）`VHD` 关联，并且可以是任何类型的虚拟磁盘。你在创建差异磁盘时选择该磁盘。这个\
  \ `VHD`称为 `parent disk`（父磁盘），而差异磁盘称为 `child disk`（子磁盘）。\n\n### 创建和配置虚拟交换机\n\n客户端\
  \ Hyper-V 提供了一个基于软件的二层网络交换机。这就是你创建的 `VMs` 连接到网络的原因。你可以使用交换机连接到物理外部网络，或连接到你在其他 `Hyper-V`\
  \ 主上配置的虚拟网络。交换机还为 `VM` 提供安全保护，因为它位于主机的物理网卡 (`NIC`) 和 `VM` 的虚拟 `NIC` 之间。此外，`Hyper-V\
  \ Virtual Switch` 已经针对各种隔离、安全和服务级别建立了策略，并可以防止恶意 `VM` 和外部虚拟机的攻击。交换机已安装。\n\n在创建交换机之前，你应该熟悉以下几个术语：\n\
  \n* `ARP/ND Poisoning (spoofing) protection`（ARP/ND 毒化保护）。使用它来防止试图从其他虚拟机窃取 IP 地址的恶意\
  \ `VM`。当涉及 `IPv6` 时，它还能防止邻居发现 (`ND`) 欺骗。它使用地址解析协议 (`ARP`) 实现此功能。\n* `DHCP Guard\
  \ Protection`（DHCP 保护保护）。它可以防止采用中间人攻击的恶意 `VM`，这些虚拟机在并非 DHCP 服务器时伪装服务器。\n* `Port\
  \ Access Control Lists (ACLs)`（端口访问控制列表）。这些列表过滤流量，以便你可以设置虚拟网络隔离场景。这些过滤器基于 MAC 地址和\
  \ IP 地址及范围。\n* `Trunk mode to a Virtual Machine`（到虚拟机的干模式）。使用它将 `VM` 设置为虚拟设备，以便将其从其他虚拟局域网的流量导向该\
  \ `VM`。\n* `Network traffic monitoring`（网络流量监控）。检查通过网络交换机的流量。\n* `Isolated (private)\
  \ VLAN`（隔离（私有）VLAN）。隔离多个虚拟局域网上的流量，以更好地创建隔离网络。\n\n你可以创建三种类型的虚拟交换机：\n\n* `External`（外部），让\
  \ `VM` 连接到计算机上的物理 `NIC` 以与外部网络通信，可能是为了连接互联网。如果需要，还可以配置为连接到主机计算机。在这种情况下，物理 `NIC`\
  \ 只能连接到一个网络。\n* `Internal`（内部），让 `VM` 与其他 `VMs` 以及主机计算机通信。\n* `Private`（私有），让 `VM`\
  \ 与其他 `VMs` 通信，但不与主机计算机通信。\n\n### 考试提示\n\n在考试中极可能会看到关于三种类型虚拟交换机的内容：`External`、`Internal`\
  \ 和 `Private`。此外，你应该知道，在 `Hyper-V Manager` 中执行几乎任何操作都需要使用 `Administrator`（管理员）账户登录。\n\
  \n要创建和配置虚拟交换机，请按照以下步骤操作：\n\n1. 在 `Hyper-V Manager` 中，点击 `Action`（操作）并点击 `Virtual\
  \ Switch Manager`（虚拟交换机管理器）。\n2. 在 `Virtual Switch Manager For` 窗口中，选择要创建的交换机类型。（我们点击\
  \ `External`）。\n3. 点击 `Create Virtual Switch`（创建虚拟交换机）。参见图 2-31]。\n\n![创建虚拟交换机。](img/httpatomoreillycomsourcemspimages1988893.png.jpg)图\
  \ 2-31。创建虚拟交换机。\n\n4. 从 `What Do You Want To Connect This Virtual Switch To`（你想将此虚拟交换机连接到什么）下的下拉列表中，选择要使用的外部网络（如果适用）。目前，确保你选择了基于以太网的解决方案。如果网络交换机将与特定的\
  \ `VLAN` 使用，还可以启用虚拟局域网识别。\n5. 点击 `OK`。\n6. 如果提示，点击 `Yes` 应用更改。\n\n创建交换机后，你可以对其进行测试。例如，如果你创建了外部交换机，可以轻松测试与互联网的连接性。你也可以从\
  \ `Hyper-V` 控制台右侧的 `Action` 面板打开 `Virtual Switch Manager` 重命名新交换机或对其进行记录。\n\n###\
  \ 重要：关于设备驱动程序\n\n如果你必须为主机的网络适配器安装设备驱动程序，你可能需要在 `VM` 上安装相同的驱动程序。\n\n在段落之前的步骤中，你被指示在选择连接的网络时选择基于以太网的解决方案。这是因为\
  \ `Hyper-V` 中的虚拟交换机是二层交换机，数据只能通过网络适配器发送和接收。\n\n### 更多信息：关于无线连接\n\n关于 Hyper-V 和无线连接，有一个详细的解释说明为什么你不能选择无线适配器连接到网络。如果你想了解更多关于这种情况以及解决方法，请参考以下文章：\n\
  \n* 将 Hyper-V 引入 Windows 8：[`blogs.msdn.com/b/b8/2011/09/07/bringing-hyper-v-to-windows.aspx`](http://blogs.msdn.com/b/b8/2011/09/07/bringing-hyper-v-to-windows.aspx)\n\
  * 在笔记本上运行 Hyper-V：[`social.technet.microsoft.com/wiki/contents/articles/185-hyper-v-to-run-a-laptop-en-us`](http://social.technet.microsoft.com/wiki/contents/articles/185-hyper-v-to-run-a-laptop-en-us)\n\
  * 配置虚拟网络：[`technet.microsoft.com/en-us/library/cc816585(v=WS.10).`](http://technet.microsoft.com/en-us/library/cc816585(v=WS.10).)\n\
  \n### 创建和配置虚拟磁盘\n\n虚拟机需要虚拟磁盘才能运行。`VHD` 是你可以在 USB 闪存器上传输的文件。`VHD` 位于主机上，包含 `VM` 使用的操作系统或数据。如果主机运行\
  \ Windows 7 或 Windows 8，你可以引导到 `VHD`。你在第 1 章 中学习了关于 `VHD` 的知识，特别是如何将 Windows 8.1\
  \ 安装到 `VHD` 中。你还学习了关于 `VHD` 技术的知识。如果你没有读过该部分，请现在阅读并返回此处。\n\n两种 VHD 格式之间有两个主要区别：VHD\
  \ 大小可达 2048 GB（约 2 TB），并且该技术已经存在很长时间。它甚至被用于旧版本的 Virtual PC 和最后版本的 Hyper-V。当你知道你将在旧版操作系统（特别是\
  \ Windows Server 2012 和 Windows 8 之前的任何版本）上运行 VHD 时，请使用这种格式。\n\n\n\n\n\n* `VHDX`\
  \ 的容量可以大得多，高达 64 TB。它不与 Windows Server 2012 或 Windows 8 之前创建的 Hyper-V 版本或操作系统兼容。当你确定将在兼容的机器上使用\
  \ `VHD` 时，请使用此格式。\n\n如果你可以使用 `VHDX` 格式，你将获得更大的文件空间以及这些旧版 `VHD` 格式不具备的这些功能：\n\n*\
  \ 在断电时防止数据损坏（因为更新会被有效地记录在日志）。\n* 提高在大扇区磁盘上的性能。\n* 为动态磁盘和差分磁盘提供更大的块大小以增强性能。\n* 自定义元数据，可用于记录有关文件的信息（例如操作系统版本等）。\n\
  * 使用“trim”技术来减小文件大小并访问使用空闲磁盘空间。（`Trim` 要求磁盘直接连接到虚拟机，且硬件必须兼容。）\n\n要从 `Hyper-V 管理器`\
  \ 创建 `VHD`，请在“操作”窗格中点击“新建”，然后点击“**硬盘”。按照向导操作，选择要使用的文件类型格式（`VHD`、`VHDX`）、大小（`固定`、`动态扩展`、`差分`）以及名称和位置，然后选择如何配置磁盘。如果你想应用在本节中创建的虚拟机，你需要在“名称”框中输入要使用的虚拟机名称。在出现提示时，创建一个新的空白\
  \ `VHD`。你现在可以将硬盘挂载到虚拟机、导出它、导入它、检查它等。\n\n### 移动虚拟机\n\n移动虚拟机简单的方法是关闭它，将其导出到新磁盘，然后将其导入到目标位置。你可能需要从生产环境导出虚拟机，在其他地方打开它（可能在带有\
  \ `Client Hyper-V` 的桌面上），执行任何所需的故障排除，然后将其导出回生产环境。\n\n要移动虚拟机，请按照以下步骤操作：\n\n1. 在 `Hyper-V\
  \ 管理器`中，右键点击要移动的虚拟机并点击“**关闭**”。再次点击“**关闭**”进行验证。\n2. 等待虚拟机状态显示为**关闭**”。然后右键点击虚拟机并点击“**导出**”。\n\
  3. 指定保存位置或点击“**浏览**”选择位置。如果收到错误，请保存到不同的位置或创建一个子文件夹。\n4. 点击“**导出**”。\n5. 如果需要，打开包含导出的虚拟机的文件夹，并记住子文件夹：`快照`、`虚拟硬盘`\
  \ 和 `虚拟机`。\n\n当你导入虚拟机时，你将通过一个类似的向导操作，该向导会提示你浏览到虚拟机、选择虚拟机等。完成这些操作后，系统会提示你选择导入类型。这里描述了三个选项：\n\
  \n* `**在位置注册虚拟机（使用虚拟机现有的唯一 ID）**`。如果你只需要在虚拟机当前存储的地方开始使用它，且不想移动或复制它，请选择此选项。\n* `**还原虚拟机（使用虚拟机现有的唯一\
  \ ID）**`。如果你的虚拟机文件存储在文件共享、可移动驱动器、网络驱动器等，并且你想移动它，请选择此选项。\n* `**复制虚拟机（为虚拟机创建新的唯一 ID）**`。如果你有一个虚拟机文件文件夹并想将其导入多次（可能你正将其作为新虚拟机的模板），请选择此选项并复制文件。\n\
  \n要导入虚拟机，请按照以下步骤操作：\n\n1. 要将虚拟机导入到另一个位置，请在目标计算机上打开 `Hyper-V`。\n2. 在“操作”窗格中，点击“**导入虚拟机**”。\n\
  3. 在“导入虚拟机向导”中点击“**下一步**”。\n4. 点击“**浏览**”来定位与导出过程相关的顶级文件夹。点击“**下一步**”。\n5. 选择要导入的虚拟机（参见图\
  \ 2-32）。\n   ![选择要导入的虚拟机。](img/httpatomoreillycomsourcemspimages1988895.png.jpg)\
  \ 图 2-32. 选择要导入的虚拟机。\n6. 阅读可用选项并选择如何注册虚拟机。（在这里还原虚拟机并使用现有的唯一 ID。）点击“**下一步**”。\n7.\
  \ 接受虚拟机文件的默认存储文件夹并点击“**下一步**”。如果收到错误，在默认存储位置内创建一个新文件夹来存放文件。\n8. 接受 `VHDs` 的默认存储文件夹并点击“**下一步**”。如果收到错误，在默认存储位置内创建一个新文件夹来存放\
  \ `VHD`。\n9. 点击“**完成**”。\n\n### 思考实验：为特定情况创建最有效的虚拟机\n\n在这个思考实验中，应用你关于该目标所学到的知识。你可以在本章末尾的“答案”部分找到这些问题的答案。\n\
  \n你需要使用运行 `Windows 8.1` 的计算机作为主机创建一个虚拟机，该虚拟机可以通过 USB 驱动器在计算机之间移动。你将仅在最新的操作系统上使用该虚拟机：`Windows\
  \ Server 2012` 和 `Windows 8`。虚拟机需要支持 `安全启动` 和 `PXE 启动`。回答以下问题：\n\n1. 当创建虚拟机时，你应该选择哪个`代代`选项？\n\
  2. 对于你将安装在虚拟机上的操作系统，你需要一个有效的`产品 ID` 吗？\n3. 你希望虚拟机能够与主机通信但不能与其他虚拟机通信。你应该配置什么类型的交换机？\n\
  4. 当配置 `VHD` 时，你应该使用什么格式？\n5. 要导出存储在 USB 驱动器上的虚拟机，你应该选择哪个选项？\n\n### 目标总结\n\n* 要使用\
  \ `Hyper-V`，主机计算机必须：\n    * 安装了 `Windows 8.1` 或企业版`。\n    * 具有`二级地址转换 (SLAT)` 处理器。\n\
  \    * 具有`BIOS 级虚拟化支持`。\n* 你创建虚拟机是为了节省资金、资源、空间、电力等。\n* 快照允许你对虚拟机进行拍摄。你可以随时恢复到快照。\n\
  * 虚拟交换机可以隔离多个虚拟机。\n* 虚拟机磁盘以 `VHD` 或 `VHDX` 格式保存。VHDX` 是较新的格式，适用于 `Windows Server\
  \ 2012`、`Windows 8` 和 `Windows 8.1`。\n\n### 目标回顾\n\n回答以下问题以测试你对目标信息的掌握。你可以在本章末尾的“答案”部分找到这些问题的答案。\n\
  \n**问题: 1。** 你正尝试在运行 `Windows 8.1 专业版` 的计算机上通过`控制面板`中的`启用或关闭 Windows 功能`安装 Hyper-V。然而，Hyper-V\
  \ 平台不可用且无法启用。原因是什么？\n* 计算机处理器不支持 `SLAT`。\n* 计算机运行的是 `Windows 8` 而不是 `8.1 专业版`。\n\
  * 计算机运行的是 `32 位`操作系统。\n* 你无法在此安装 `Hyper-V 平台`；你必须运行 Windows PowerShell 命令 `Enable-WindowsOptionalFeature\
  \ –FeatureName Microsoft-Hyper-V –All`。\n\n**问题: 2。** 在 `Hyper-V 管理器`的哪个窗格中配置主机网络和设置、导入虚拟机并创建虚拟机？\n\
  * `主机`\n* `快照`\n* `详细信息`\n* `操作`\n\n**问题: 3。** 你正在创建一个虚拟机，并需要它与 `Windows Server\
  \ 2012` 和 `Windows 8` 之前的操作系统后兼容。以下哪项描述了你需要创建的虚拟机类型？\n* `带有集成服务的第一代`\n* `第一代`\n\
  * `第二代`\n* `带有集成服务的第二代`\n\n**问题: 4。** 下列哪项*不是*虚拟交换机的类型？\n* `内部`\n* `外部`\n* `公共`\n\
  * `私有`\n\n\n\n\n\n| **问:** | 5\\. 为您的 VHD 文件使用 VHDX 格式（而不是 VHD 格式）有哪些优势？（选择所有适用项。）\
  \ |\n\n1. 在断电时防止数据损坏（因为更新被有效地记录了日志）\n2. 提高大扇区磁盘上的性能\n3. 为动态磁盘和差异磁盘提供更大的块大小以增强性能\n\
  4. 创建差异磁盘的能力\n\n## 章节总结\n\n-   你可以通过多种方式配置设备和设备驱动程序，包括但不限于使用“设备管理器”、“设备和打印机”窗口、“设备暂存（Device\
  \ Stage）”以及如 `Sigverif.exe` 和 `Pnputil.exe` 等命令行工具。\n-   要管理哪些应用程序打开以及计算机对 DVD、USB\
  \ 驱动器等如何做出响应，你可以使用“默认程序”窗口配置首选项。\n-   `MSIExec` 为网络管理员提供了一种在命令行安装、修改和对 Windows 安装文件执行其他操作的方法。应用程序兼容性工具包\
  \ (ACT) 可帮助你判断组织中的应用程序、设备和计算机是否与 Windows 8.1 兼容。\n-   你可以使用组策略控制对 Windows Store、应用程序、可拆卸硬件等的访问。\n\
  -   `AppLocker`、软件限制策略和分配访问可以帮助你进一步控制用户对软件和硬件的访问。\n-   你可以使用 Internet Explorer (IE)\
  \ 11 中的选项来控制用户访问、安全和保护以及管理下载，并可以使用组策略来管理用户组。\n-   Hyper-V 是一种虚拟化技术，你可以使用它在单台主机计算机上在其各自自己的空间内运行多个操作系统。这节省了金钱、时间、资源、电力消耗等。\n\
