  \ To Go` 设备可以是 `Secure Digital (SD)` 卡。\n4.  `BitLocker To Go` 设备可以是硬盘。\n5.  `BitLocker\
  \ To Go` 驱动器可以使用 `NTFS`、`FAT` 或 `FAT32` 文件系统。\n6.  以上所有项。 |\n\n## 章节总结\n\n*   用户必须能够安全地远程连接到你的组织。你可以考虑的选择有很多，包括\
  \ VPN、宽带、蜂窝等。\n*   你必须为你的网络基础设施和客户端选择最佳 VPN 验证方法。`IKEv2` 是 `Windows 8.1` 用户在 `Windows\
  \ Server 2012` 网络上的最佳选择。\n*   `VPN Reconnect` 在连接丢失时通过 `VPN` 自动重新连接。\n*   `Windows\
  \ 8.1` 支持热点并连接到他人创建的个人热点。\n*   `Sync Center`、`Offline Files` 和 `Work Folders` 允许用户在办公室以外工作，并在适当或配置的情况下在计算机和网络之间同步数据。\n\
  *   `Windows To Go` 是在 `USB flash drive` 上的 `Windows 8.1`。这为工作人员提供了额外的选项。\n*   `Wi-Fi\
  \ Direct` 允许在没有路由器或访问点等网络的情况下共享文件，目前通过第三方应用程序和命令行工具 `Netsh` 启用。\n*   `BitLocker`、`BitLocker\
  \ To Go` 以及各种验证选项（有或无 `TPM`）有助于在设备丢失、被盗或被攻击时保持安全。\n\n## 答案\n\n本节包含本章思考实验的解决方案以及目标回顾问题的答案。\n\
