  \ 你无法为内部硬件安装或回滚驱动程序。 2. 驱动程序已更新，但创建者配置的方式无法回滚。 3. 驱动程序未更新，问题由其他原因引起。 4. 如果回滚驱动程序的选项不可用，你需要选择卸载它。\
