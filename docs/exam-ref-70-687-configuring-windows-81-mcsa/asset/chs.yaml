  16. 双击新库，然后点击“包含文件夹”。\n17. 双击要添加的文件夹。\n18. 若要添加更多文件夹，点击“管理”选项卡。\n19. 点击“管理库”。\n\
  20. 点击“添加”并导航到要添加的文件夹。\n21. 选择文件夹并点击“确定”。\n22. 双击新库，然后点击“包含文件夹”。\n23. 双击要添加的文件夹。\n\
  24. 若要添加更多文件夹，点击“管理”选项卡。\n25. 点击“管理库”。\n26. 点击“添加”并导航到要添加的文件夹。\n27. 选择文件夹并点击“确定”。\n\
  28. 双击新库，然后点击“包含文件夹”。\n29. 双击要添加的文件夹。\n30. 若要添加更多文件夹，点击“管理”选项卡。\n31. 点击“管理库”。\n\
  32. 点击“添加”并导航到要添加的文件夹。\n33. 选择文件夹并点击“确定”。\n\n（注：原文在步骤部分存在逻辑重复，此处已根据逻辑进行了去重处理，以确保准确性和流畅性。）\n\
  \n1. 打开文件资源管理器，在“视图”选项卡上点击“导航格”。点击“显示库”。\n2. 在“库”窗格内部右键点击，点击“新建”，然后点击“库”。参见图 4-8。\n\
  ![创建一个新库。](img/httpatomoreillycomsourcemspimages1988955.png.jpg)图 4-8. 创建新库。\n3.\
  \ 为库命名并按回车键。\n4. 双击新库，然后点击“包含文件夹”。\n5. 双击要添加的文件夹。\n6. 若要添加更多文件夹，点击“管理”选项卡。\n7. 点击“管理库”。\n\
  8. 点击“添加”并导航到要添加的文件夹。\n9. 选择文件夹并点击“确定”。\n\n## 配置共享打印机\n\n如果你创建了家庭组，你的打印机已经共享了。打印机以及连接它的计算机都必须开启并准备就绪，但共享是自动完成的。如果不使用家庭组，你必须手动共享打印机。在某些情况下，你可能需要启用文件和打印共享，包括在公共网络上共享时。\n\
  \n在工作组或域设置中，基本相同。你找到打印机并访问其共享选项。你可以与网络上的混合类型计算机（包括 x86 平台和 x64 平台的 PC）共享打印机。你只需要确保相应的驱动程序可用，大多数情况下它们是可用的。不过，你可能需要管理员批准才能安装驱动程序，如果你认为驱动程序是个问题，请记住这一点。\n\
  \n### 添加打印机并配置共享\n\n你可以在 Windows 8.1 的控制面板中的“设备和打印机”窗口添加打印机。在那里，点击“添加打印机”并从列表中选择它。如果你需要的打印机不在列表中，可以手动添加它，如果你有一个连接到\
  \ LPT 端口的旧打印机，或者需要使用 TCP/IP 地址或主机名添加打印机，你可能需要这样做。你可以从此窗口连接无线打印机，如果需要，也可以使用手动选项添加无线打印机。你还可以使用此选项输入打印机路径来手动找到它。参见图\
  \ 4-9。\n\n\n\n\n要手动共享打印机，请在`设备和打印机`窗口中右键点击该设备，然后点击`打印机属性`。从那里，使用`共享`选项卡来共享打印机并配置其他选项。如果计算机是\
  \ `Active Directory` 域的成员，你将看到`在目录中列表`复选框。选择此复选框将在 `Active Directory` 数据库中创建一个新的打印机对象。这将允许域用户通过搜索目录来查找打印机。在此对话框中，你也可以根据需要选择添加驱动程序。\n\
  \n其他选项卡提供了其他选项，包括配置计算机何时可用以及哪些类型的用户具有`打印` 权限的选项：`打印`、`管理此打印机`、`管理文档`和`特殊权限`。在图 4-10\
  \ 中，你可以看到`Everyone` 组具有打印权限。然而，如果你在`组或用户名称`列表中点击`管理员`，你将看到该组的`打印`、`管理此打印机`和`管理文档`均被设置为`允许`。表\
  \ 4-2 解释了这些选项。在继续之前，请确保你已熟悉 Windows 8.1 中提供的所有图形化选项。\n\n### 注意：如何分配权限\n\n在 `Active\
  \ Directory` 域中分配权限时，你是在为域用户、组和其他对象分配权限。在独立式计算机上，你选择应该接收权限的本地用户帐户和组账户。\n\n![使用打印机的属性对话框来共享打印机并配置共享选项。](img/httpatomoreillycomsourcemspimages1988959.png.jpg)图\
  \ 4-10。使用打印机的属性对话框来共享打印机并配置共享选项。\n\n### 考试技巧\n\n近场通信（`NFC`）是一种基于无线电的通信技术（基于射频识别\
  \ [`RFID]` 标准），它允许用户与兼容对象一起完成任务，主要用于完成简短的交易，而无需物理连接到设备或网络。在打印机的情况下，如果两者之间存在兼容技术且设备间的距离可以接受，`NFC`\
  \ 允许移动设备将打印作业提交给打印机。\n\n### 了解常用的打印术语\n\n除了对用户友好的选项外，你还需要了解关于打印机的几个术语以及大多数用户并不直观的功能。\n\
  \n*   `打印设备`。这是实际的硬件，即打印机。\n*   `打印机`。这是计算机与打印设备通信的软件接口。它可能是 `LPT`、`COM`、`USB`、`IEEE`、`1394`、`IrDA`、`蓝牙`、`TCP/IP`\
  \ 端口或其他。\n*   `打印服务器`。这是一个接收打印作业并将其路由到打印设备的计算机。\n*   `打印机控制语言 (PCL)`。打印机需要打印驱动程序才能工作。驱动程序接收命令并将其转换为打印机理解的内容。这被称为\
  \ `PCL`。`PostScript` 是 `PCL` 的一个示例。\n*   `密码保护的共享`。就像你可以为文件和文件夹配置密码保护共享一样，你也可以为打印机配置它。\n\
  *   `打印机优先级`。这是一个选项，通过它可以让你组织中的用户在其他用户之前获得打印优先级，即使打印作业仍在队列中。\n*   `打印机池`。使用此功能连接多个打印设备，以便打印作业可以自动发送到当前未空闲的打印机。你可以在`控制面板`中、打印机的`属性`对话框的`端口`选项卡上通过点击`启用打印池`来实现。\n\
  \n### 设置并配置 SkyDrive\n\nSkyDrive 允许用户几乎无缝地从他们的 Windows 8.1 计算机向云端存储数据。`SkyDrive`\
  \ 是开始屏幕上的一个应用程序，也是`资源管理器导航`选项卡上的一个选项。当数据存储在 `SkyDrive` 中时，用户可以从任何连接互联网的设备访问该数据。用户还可以与其他共享他们存储在那里的任何部分，允许他们读取或读取并编辑数据。用户需要\
  \ `Microsoft 帐户`以及相应的应用程序或浏览器来访问数据。在没有连接时，用户也可以在本地访问文件。\n\n### 考试技巧\n\nSkyDrive\
  \ 是用户可以访问以保存数据和管理其存储在那里的数据存储区域。当 `SkyDrive` 是任何场景的答案时要小心，因为它不会为用户做很多其他事情。例如，你无法从\
  \ `SkyDrive` 共享、同步或访问应用程序；同步应用程序是 `Microsoft 帐户`工作的一部分，与 `SkyDrive` 无关。\n\n用户可以通过多种方式访问\
  \ `SkyDrive`：\n\n*   `使用 Web 浏览器`。访问 `[`skydrive.com`](http://skydrive.com)` 并登录以访问、上传、共享以及其他管理文件和文件夹。你还在这里创建和编辑文档、演示文稿、笔记本等。\n\
  *   `使用 Windows 中的 SkyDrive 应用程序`。从开始屏幕打开 `SkyDrive` 应用程序以访问、上传、打开和管理文件，并创建新文件夹。\n\
  *   `在智能手机上使用 SkyDrive 应用程序`。允许允许查看和打开文件、查看最近访问的文件、查看和访问共享文件以及上传文件。用户还可以创建新文件夹并配置照片的一些设置。\n\
  *   `通过桌面应用程序`。这种方法允许用户从 `Microsoft Office 2013` 等应用程序访问 `SkyDrive`。参见图 4-11。![从桌面应用程序保存到\
  \ SkyDrive](img/httpatomoreillycomsourcemspimages1988961.png.jpg)图 4-11。从桌面应用程序保存到\
  \ SkyDrive。\n\n设置 `SkyDrive` 只需要使用 `Microsoft 帐户` 登录 Windows 8.1 计算机。其余会自动完成。不过，有一些立即查看的配置选项。你可以在\
  \ `SkyDrive` 应用程序内部的`设置`（点击`选项`）配置离线访问选项。参见图 4-12。如果有可用的 `SkyDrive` 空间，这可能是你想要配置的内容。\n\
  \n![SkyDrive 应用程序提供了访问所有文件的选项](img/httpatomoreillycomsourcemspimages1988963.png.jpg)图\
  \ 4-12。SkyDrive 应用程序提供了访问所有文件的选项。\n\n配置选项可以在 `PC 设置` 和 `SkyDrive` 网站上可用。图 4-13 显示了\
  \ `PC 设置` 中的可用内容。有四个选项卡。在`文件存储`选项卡上，你可以购买更多存储并配置你的文档默认保存到 `SkyDrive`。你可以看到我在 `SkyDrive`\
  \ 上巨大的空间。这并不常见。在时间允许的情况下，确保探索这里所有的设置和选项。\n\n### 考试技巧\n\n了解哪些可以保存到 `SkyDrive`。你可以保存\
  \ Windows 设置、应用程序设置以及凭据，但你无法保存 Xbox 音乐购买、应用程序甚至整个文件夹（例如你的`文档`或`图片`文件夹）。你必须逐个上传文件，尽管你可以上传压缩文件夹。\n\
  \n\n\n\n最后，你可以在 SkyDrive 网站上配置 SkyDrive 设置。一旦登录 `http://skydrive.com](http://skydrive.com)`，就可以点击右上角的“工具”图标并点击“选项”。参见图\
  \ 4-14。注意左侧的选项：\n\n*   `Manage Storage`（管理存储）。这允许用户查看可用存储空间并购买更多。\n*   `Upgrade`（升级）。使用此设置查看存储计划并选择一种。\n\
  *   `Office File Formats`（Office 文件格式）。允许用户为 Office 文档选择默认格式：Microsoft Office Open\
  \ XML 格式（`.docx`, `.pptx`, `.xlsx`）或 OpenDocumentFormat（`.odt`, `.odp`, `.ods`）。\n\
  *   `People Tagging`（人员标记）。使用此选项指定人们在 SkyDrive 上如何对你进行标记（你的朋友或仅你自己），并配置谁可以添加人员标记（可以查看你相册的朋友或不允许任何人添加人员标记）。\n\
  *   `Device Settings`（设备设置）。使用此选项查看你的所有设备以及这些设备最后备份的日期。\n\n![在 SkyDrive 网站上配置设置。](img/httpatomoreillycomsourcemspimages1988967.png.jpg)图\
  \ 4-14.在 SkyDrive 网站上配置设置。\n\n###更多信息：学习如何设置 Microsoft 账户\n\n参考本章后面的目标 4.3：配置身份验证和授权了解更多关于设置\
  \ Microsoft 账户的信息。\n\n### 思考实验：有效地配置共享\n\n在这个思考实验中，应用你在这个目标中学到的知识。你可以在章节末尾的“答案”部分找到这些问题的答案。\n\
  \n你的客户需要与他小型企业工作组中的其他人员共享文件和文件夹。他希望为特定用户设置权限，以便他们在需要时访问敏感数据，但他希望确保这些数据不会被任何未点名的人访问。他在桌面上创建了几个文件夹（账户、发票和销售信息），还有其他不属于任何默认库的文件夹（人力资源、税务信息）。\n\
  \n1.  你会建议哪种类型的共享？为什么？\n2.  在为此处列出的文件夹分配权限时，你应该对默认赋予读取访问权限的 `Everyone` 组做什么？\n3.\
  \  默认情况下，有多少用户可以同时访问共享文件夹中的数据？\n4.  如果你希望用户能够读取和编辑文件夹中的内容，但你不希望他们获取文件夹中文件的所有权或更改文件权限，你应该分配什么共享权限？\n\
  \n### 目标总结\n\n*   共享权限包括读取、更改和完全控制，可用于保护工作组和配置了 FAT32 文件系统的计算机上的数据。\n*   家庭组（Homegroups）、公共文件夹共享和任何文件夹共享是在私有网络上共享数据的三个方式。\n\
  *   你可以通过创建家庭组来自动共享打印机，或者通过其他类型的共享场景手动配置它们。\n*   SkyDrive 允许用户将数据保存到云端并在几乎任何地方访问它。\n\
  \n### 目标回顾\n\n回答以下问题以测试你对该目标信息的掌握情况。你可以在章节末尾的“答案”部分找到这些问题的答案以及对每个选项为何正确或错误的解释。\n\
  \n| 关于家庭组，以下哪项是正确的？（选择所有适用） |\n| :--- | :--- |\n| 1. 有向导可以进行设置，并会自动生成家庭组密码。 |\n\
  | | 2. 可以配置共享以允许所有家庭组用户具有读取或读取/写入访问权限，但你无法为特定用户配置特定权限。 |\n| | 3. 用户可以共享他们的默认库。 |\n\
  | | 4. Windows XP 计算机和用户可以加入家庭组。 |\n| | 5. 可以为公共网络创建家庭组。 |\n| 如果你想共享位于桌面桌面上的文件和文件夹，并为选定的用户设置权限并排除参与过公共网络的计算机上的其他用户，你会选择哪种共享选项？\
  \ |\n| | 1. 任何文件夹共享 |\n| | 2. 公共文件夹共享 |\n| | 3. 家庭组共享 |\n| | 4. 以上所有 |\n| 你已经共享了一台打印机，并需要用户能够打印并控制自己的打印作业。你需要如何配置共享权限？\
  \ |\n| | 1. 选择“管理此打印机”的共享权限。 |\n| | 2. 选择“管理文档”的共享权限。 |\n| | 3. 同时选择“管理此打印机”和“管理文档”。\
  \ |\n| | 4. 什么都不做；这些权限已默认配置好。 |\n| 关于 SkyDrive，你在哪里配置离线访问你保存在那里的所有文件的选项，以便在用户没有互联网访问权限的情况下可以使用这些文件？\
  \ |\n| | 1. 从 `http://skydrive.com](http://skydrive.com)` 的“工具”，“选项”中 |\n| | 2.\
  \ 从 SkyDrive 应用，从“选项”下的“设置”小窗 |\n| | 3. 从 PC 设置，从“同步设置” |\n| | 4. 从资源管理器，在导航窗格中右键点击\
  \ SkyDrive 并选择“属性” |\n\n## 目标 4.2：配置文件和文件夹访问\n\n你已经在目标 4.1：配置共享资源中学习了共享权限。这些权限在操作系统配置为\
  \ FAT 或 FAT32 时或任何你在计算机上共享文件夹时应用。只有三种共享权限：读取、更改和完全控制，它们位于资源属性的“共享”选项卡上。这些共享选项提供的控制有限，但也提供了一些。共享权限帮助你通过网络管理用户访问资源，但在本地登录时不提供安全性。\n\
  \n由于 NTFS 权限比共享权限健壮得多，当文件系统为 NTFS 时，管理员会充分利用它。他们通常将 Everyone 的共享权限设置为完全控制，并根据需要配置\
  \ NTFS 权限。你在资源属性的“安全”选项卡上配置 NTFS。记住，当两种类型的权限都存在时，限制较多的那种会被应用于资源，因此只要配置了 NTFS，共享权限赋予无限访问也没关系。还有分配配额、加密和审核对象的能力。这些功能在\
  \ FAT 或 FAT32 驱动器上不可用。\n\n**本目标涵盖如何：**\n\n*   配置 NTFS 权限\n*   配置磁盘配额\n*   使用 EFS\
  \ 加密文件和文件夹\n*   配置对象审核\n\n### 配置 NTFS 权限\n\n关于 NTFS 权限、Windows 权限架构、基本权限与高级权限的区别以及权限如何继承等，有很多需要学习，这里没有足够的空间讨论所有内容。然而，我们将尝试涵盖你考试所需的最重要的事实，以及如何应用\
  \ NTFS 权限来保护资源。\n\n### 考试提示\n\n确保你阅读并学习 Microsoft 认证页面上列出的附加资源，以便熟悉测试目标。导航到此页面并点击“显示全部”获取该附加资源列表。\n\
  \n\n\n\n\n共有四种权限。你已经了解了其中两种：共享（Share）和 NTFS。另外两种是注册表权限和活动目录权限。你可能永远不会分配过这两种类型，但它们确实存在。所有这些权限都是独立的，可以根据需要进行组合。\n\
  \n## 权限术语和规则\n\n任何受保护的元素或资源都有一个访问控制列表 (`ACL`)。这基本上是一个应用于它的权限列表。所应用的单个权限是访问控制条目 (`ACEs`)。每个\
  \ `ACE` 至少包含一个安全主体（security principal）。安全主体是指被赋予权限的用户、组或计算机，以及为其（它们）配置的权限。这意味着权限是存储在受保护的资源上的，而不是存储在授予访问权限的用户、组或计算机中。这就是为什么你可以在元素的`Properties`对话框的\
  \ `Security` 选项卡上配置权限（参见图 4-15）。如果你在 `Test Properties` 对话框中点击 `Edit`，你将获得右侧所示的 `Permissions\
  \ For` 对话框的访问。在那里你可以添加或删除用户、组等，并为这些新条目应用相应的 NTFS 权限。\n\n![从元素的属性和权限（Permissions\
  \ For）对话框配置 NTFS 权限。](img/httpatomoreillycomsourcemspimages1988969.png.jpg)图 4-15.\
  \ 从元素的属性和权限（Permissions For）对话框配置 NTFS 权限。\n\n你可以使用图 4-15 中所示的基本权限为共享资源创建非常特定的访问选项。你可以授予单个用户对资源的\
  \ `Full Control`（完全控制），同时授予 `Users` 组中的所有用户 `Read`（读取）权限。你可以配置为特定个人或这些人无法访问资源，或者让整个组（如\
  \ `HomeUsers`）在使用资源时读取、写入、列出文件夹内容以及读取和执行，但不能对其进行修改或获取所有权。场景几乎是无尽的。\n\n如果用户从多个地方配置了资源权限，则所授予的权限是累积的。例如，如果\
  \ Bob 是 `Users` 组的成员且 `Users` 组只有 NTFS 权限 `Read`，但 Bob 也是 `Sales` 组的成员且 `Sales`\
  \ 组拥有 NTFS 权限 `Modify`，那么 Bob 同时拥有 `Read` 和 `Modify` 权限。记住，共享权限是累积的，NTFS 权限也是累积的，如果两者都存在，则应用这些结果中限制性更大的。但\
  \ `Deny`（拒绝）意味着拒绝；如果从任何地方给用户分配了 `Deny`，该用户将无法访问该资源。\n\n### 考试提示\n\n允许（Allow）权限是累积的。拒绝（Deny）权限覆盖允许（Allow）权限。显式（Explicit）权限优先于继承（inherited）权限。\n\
  \n### 基本和高级权限\n\n基本权限是高级权限的组合。你可以在任何 NTFS 资源 `Properties` 对话框的 `Security` 选项卡上看到基本权限，如之前所示的图\
  \ 4-15。有六种基本权限：\n\n*   `Full Control`：修改、获取所有权、删除项目，并执行后续权限列出的所有其他操作\n*   `Modify`：删除文件夹、修改文件、删除文件，并执行\
  \ `Write` 和 `Read & Execute` 的其他操作。\n*   `Read & Execute`：浏览文件夹、运行应用程序，并执行 `Read`\
  \ 和 `List Folder Contents` 的操作。\n*   `List Folder Contents`：查看文件夹中文件和子文件夹的。\n* \
  \  `Read`：查看文件和子文件夹、读取文件内容，并查看文件或文件夹的所有权、权限和属性。\n*   `Write`：在文件夹内创建新文件和子文件夹、修改文件夹属性、查看文件夹或文件的所有权和权限、修改文件属性并覆盖文件。\n\
  \n有 14 种高级权限，你可以通过导航到任何 NTFS 资源的 `Advanced Security Settings For` 对话框来查看这些权限。你应该了解这些高级权限的名称、如何找到它们以及它们如何保护元素。从此对话框，你还可以查看已分配的权限（包括共享权限），并从同名选项卡查看计算出的有效访问。要打开此对话框并查看这些设置和选项，请遵循以下步骤：\n\
  \n1.  右键点击任何共享文件夹并点击 `Properties`。\n2.  点击 `Security` 选项卡。\n3.  点击 `Advanced`。\n\
  4.  点击任何权限条目（可能是 `Administrators`）并点击 `View`。参见图 4-16。（注意 `Disable Inheritance`（禁用继承）按钮。在阅读下一节时记住这个位置。）\n\
  \n![高级安全设置对话框提供了安全主体及其分配的访问列表。](img/httpatomoreillycomsourcemspimages1988971.png.jpg)图\
  \ 4-16. 高级安全设置对话框提供了安全主体及其分配的访问。\n\n5.  在生成的 `Permissions For` 对话框中，你可以查看分配给该组的基本权限。\n\
  6.  点击 `Show Advanced`。显示分配的权限列表，如图 4-17 所示。\n\n![在权限条目对话框中查看权限。](img/httpatomoreillycomsourcemspimages1988973.png.jpg)图\
  \ 4-17. 在权限条目对话框中查看权限。\n\n    注意图 4-17 你无法编辑为 `Administrators` 列出的权限。然而，如果你在 `Properties`\
  \ 对话框中创建了自己的条目（例如 `Users` 组、`Sales` 组等），你就可以编辑此处显示的高级权限。\n\n### 继承\n\n权限通常从文件夹层次结构的顶部向下运行，因此如果你为一组用户向文件夹授予了\
  \ NTFS `Read` 权限，然后在那里创建了一个子文件夹，相同的权限将适用于该组的该文件夹。如果不是这样工作的，分配权限将几乎是不可能的。\n\n某些时候你可能需要关闭文件夹或其他元素的继承。如图\
  \ 4-16 所示，`Disable Inheritance` 是一个选项。如果你不想禁用继承但需要拒绝某些特定个人或组的访问，可以分配相应的 `Deny` 权限。\n\
  \n### 考试提示\n\n当继承引起问题时，你可以分配冲突的显式权限。例如，如果整个 `Sales` 组被拒绝访问文件夹，但 `Sales` 组的某个成员应该能够访问它（可能是\
  \ CFO），你可以显式地为该特定用户账户分配对资源的 `Full Control` `Allow` 权限。此类显式权限会覆盖继承权限，从而轻松地解决问题。\n\
  \n\n\n\n\n## 移动、复制与权限继承\n\n有时你需要复制或移动受 NTFS 保护的元素。当你这样做时，取决于具体情况，权限有时会被保留，有时则不会。在大多数情况下，资源会继承分配给父文件夹的\
  \ NTFS 权限。\n\n以下是继承以及移动和复制的工作原理：\n\n* 如果你在同一个 NTFS 卷上将 NTFS 文件或文件夹从一个位置复制到另一个位置，资源将继承其新父文件夹的权限。\n\
  * 如果你在不同的 NTFS 卷之间将 NTFS 文件或文件夹从一个位置复制到另一个位置，资源将继承其新父文件夹的权限。\n* 如果你在同一个 NTFS 卷上将\
  \ NTFS 文件或文件夹从一个位置移动到另一个位置，现有权限将随之移动。\n* 如果你在不同的 NTFS 卷之间将 NTFS 文件或文件夹进行移动，它们将继承新卷上新父文件夹的权限。\n\
  * 如果你将 NTFS 文件或文件夹复制或移动到 FAT 或 FAT32 驱动器，它们将丢失所有 NTFS 权限，因为这些文件系统不支持这些权限。\n\n###\
  \ Icacls.exe\n\n`icacls.exe` 命令允许你从提升权限的命令行配置基本和高级权限。你可以在 TechNet 上查看所有 `icacls.exe`\
  \ 参数，地址为 `http://technet.microsoft.com/en-us/library/cc753525.aspx`。你应该准备好基于此内容的考试题，因此回顾一下是个好主意。\n\
  \n### 考试提示\n\n如果你被锁定在某个元素之外，可以从提升权限的命令提示符重置其权限。导航到文件夹并使用命令 `icacls.exe <file name>/reset`\
  \ 以及所需的其他参数（例如使用 `/C` 忽略错误）。\n\n简单而言，`icacls.exe` 命令的用法如下：`icacls.exe <file name*>\
  \ /grant` 或 `icacls.exe <file name*> /deny`，带有多种但不限于下的参数：\n\n* `F` 表示完全访问\n* `M`\
  \ 表示修改\n* `RX` 表示读取和执行\n* `R` 表示只读\n* `W` 表示写入\n* `MA` 表示最大允许\n* `T` 在 `<file name*>`\
  \ 内部的所有文件和子文件夹上执行该命令\n* `C` 即使发生错误也继续\n\n## 资源所有权\n\n可能会将所有人锁定在资源之外。当这种情况发生时，该资源被称为“孤立”。如果最初创建它的用户不再能够提供访问（可能是对于机密文件或文件夹），该资源也可能孤立。要访问该资源，作为管理员你需要获取它的所有权。要执行操作，在之前显示的图\
  \ 4-16 高级安全设置对话框中，点击 `更改`。然后你就可以自己（作为管理员）获取资源的所有权。\n\n## 配置磁盘配额\n\n用户会根据你的允许尽可能多地使用服务器和存储空间。除非强制他们，否则某些用户可能不会删除任何内容。作为网络管理员，你必须能够管理此，并通过配置磁盘配额来实现。\n\
  \n一旦启用了磁盘配额（只能在 NTFS 卷上启用，不能在 FAT 卷上启用），你还可以配置用户达到这些限制时发生的情况。你可能想给他们警告，也可能想让他们在保存更多数据之前删除数据。按如下方式配置\
  \ NTFS 磁盘配额：\n\n1. 在文件资源管理器中，导航到要使用磁盘配额保护的卷。\n2. 右键点击卷并点击 `属性`。\n3. 点击 `配额` 选项卡；点击\
  \ `显示配额设置`。查看图 4-18。\n4. 选择 `启用配额管理` 复选框。\n5. 根据需要配置选项，包括：\n    1. 禁止超过配额限制的用户使用磁盘空间\n\
  \    2. 限制磁盘空间为\n    3. 用户超过配额限制时记录事件\n    4. 用户超过警告级别时记录事件\n6. 点击 `确定` 并再次点击 `确定`\
  \ 应用。\n\n![设置配额限制和所需操作。](img/httpatomoreillycomsourcemspimages1988975.png.jpg)图\
  \ 4-18. 设置配额限制和所需操作。\n\n### 考试提示\n\n命令行工具 `Fsutil.exe` 也可以用于设置配额限制。使用 `quota` 和\
  \ `enforce` 参数指定要应用配额的驱动器。\n\n### 使用 EFS 加密文件和文件夹\n\n当其他安全措施失效时，加密可以保护数据免受未经的访问。很多时候，失败是因为有人获得了机器的物理访问权限，并且有知识和时间研究如何访问其上的数据。这种类型的泄露有许多方式。然而，通过加密文件系统\
  \ (EFS)，加密过程中生成的公钥和私钥确保了只有加密文件的用户才能对其解密。从技术上讲，只有当用户的个人加密证书可用时才能解密加密数据，该证书是使用私钥生成的。其他用户无法访问此密钥，试图访问它的人也无法。\n\
  \n### 考试提示\n\n数据加密时生成的公钥和私钥是 Windows 公钥基础设施 (PKI) 的基础。有关 PKI 的更多信息，请参考 TechNet。此外，EFS\
  \ 使用高级加密标准 (AES)，它使用 256 位密钥并可用于非系统卷。\n\n以下是关于 EFS 的更多信息：\n\n* 加密和解密在静默中完成任务，过程对用户是不可见的。在关闭文件时进行加密，在打开文件时进行解密。\n\
  * EFS 只能在 NTFS 卷上使用，不支持任何形式的 FAT。\n* EFS 密钥未分配给计算机，而是分配给特定用户。这意味着如果另一个用户使用自己的账户登录计算机，无法访问另一个用户的数据。\n\
  * 即使黑客坐在电脑前访问受保护的文件，也会收到拒绝访问的消息。\n* 你不能同时使用 EFS 和压缩。你必须二选其一。\n* 文件或文件夹加密后，它在文件资源管理器中将显示为绿色。\n\
  \n要加密文件夹，右键点击文件夹然后点击 `属性`。在属性对话框的“常规”选项卡中，点击 `高级`。选择“加密内容以保护数据”复选框，如图 4-19 所示。以后可以使用同一个高级属性对话框取消加密。\n\
  \n![在高级属性对话框中对项目进行加密。](img/httpatomoreillycomsourcemspimages1988977.png.jpg)图 4-19.\
  \ 在高级属性对话框中对项目进行加密。\n\n在你执行首次加密后，系统会提示你备份文件加密证书和密钥。这可以防止在原始证书和密钥（在加密时生成）丢失或损坏时，永久失去对加密文件的访问。如果你错过了提示，可以按照接下来给出的步骤进行备份，但可能每次登录时系统都将提示你备份密钥。你可以使用证书管理器\
  \ MMC 手动备份你的个人证书（你应该将 EFS 恢复密钥存储在远离计算机的安全位置）。\n\n\n\n\n\n1. 使用 `Windows key+R` 打开运行对话框。\n\
  2. 输入 `certmgr.msc` 并按回车。\n3. 在 `Certmgr` 窗口中，展开`个性`并点击`证书`。查看图 4-20。\n4. 选择所有证书。\n\
  5. 右键点击选中的证书，点击`所有任务`，然后点击`导出`。\n6. 按照证书导出向导进行操作，在提示时确保选择`是`、`导出私钥`，并在提示时输入复杂的密码。\n\
  \n![导出所有选定的证书并按照弹出的向导操作以完成过程。](img/httpatomoreillycomsourcemspimages1988979.png.jpg)图\
  \ 4-20. 导出所有选定的证书并按照弹出的向导操作以完成过程。\n\n你也可以通过导入你的 EFS 证书备份来使用 `CertMgr` 恢复你的 EFS 加密文件。与导出证书一样，这是通过向导完成的。要开始，选择`个性`文件夹，点击`操作`，然后点击`所有任务`。从那里，选择`导入`。按照提示导入所需的数据。\n\
  \n你也可以使用命令行管理加密。使用 `Cipher.exe` 执行加密和解密任务。你可能会在考试中看到此命令。有关 `Cipher` 的更多信息，请参考 TechNet\
  \ 上的此页面：[`technet.microsoft.com/en-us/library/cc771346.aspx`](http://technet.microsoft.com/en-us/library/cc771346.aspx)。以下是\
  \ `Cipher` 最常用的几个参数：\n\n* `/d`。使用此参数解密指定的文件和目录。\n* `/s:<Directory>`。使用此参数对指定目录中的所有子目录执行指定的操作。\n\
  * `/c`。使用此参数显示加密文件的信息。\n* `/u`。使用此参数查找本地驱动器上的所有加密文件。\n* `/?`。添加此参数显示帮助。\n\n### 更多信息：BitLocker\
  \ 和 BitLocker To Go\n\n有关其他安全类型的信息（包括 BitLocker 和 BitLocker To Go），请参考第 5 章，特别是目标\
  \ 5.3：配置移动设备的安全性。BitLocker 加密整个磁盘；这与 EFS 是不同种类的保护。\n\n### 配置对象访问审核\n\n网络管理员经常审核事件以查看发生了哪些事件，其目的通常是为了维护特定对象（例如安全文件夹）的安全性。它也可以是一个文件、打印机或从计算机可用的几乎任何其他资源。它甚至可以小到一个注册表项。大多数情况下，这种类型的对象访问审核是为了查看尝试访问某个对象的次数，以及这些尝试失败了多少次。所有审核事件都会在被捕获时显示在`事件查看器`中。\n\
  \n管理员也可以审核特定事件，例如成功或失败的登录尝试。这不是对象访问审核，但值得提一下，因为该选项是你在此处探索的审核策略选项的一部分。此外，由于非目标用户执行了成功登录，可能会在不应该访问对象时正在访问对象。（查看真实示例以获取更多关于这种情况如何发生的信息。）\n\
  \n在以下的一系列步骤中，你将启用审核成功登录事件的选项。在本文第二组步骤中，你还启用了对指定对象的失败审核。\n\n要启用成功登录审核和对象审核，请按照以下步骤操作：\n\
  \n1. 打开运行框并输入 `gpedit.msc`。按回车。\n2. 导航到`计算机配置`、`Windows 设置`、`安全设置`。\n3. 展开`本地策略`并点击`审核策略`。\n\
  4. 双击任何策略以启用其审核。图 4-21 显示已选择`审核账户登录事件`。\n5. 选择`成功`或`失败`复选框并点击`确定`。\n\n   ![审核本地计算机的成功登录。](img/httpatomoreillycomsourcemspimages1988981.png.jpg)图\
  \ 4-21. 审核本地计算机的成功登录。\n6. 双击`审核对象访问`。\n7. 在`审核对象访问属性`对话框中，选择`失败`复选框。\n8. 点击`确定`。\n\
  \n在没有任何其他配置的情况下，成功登录尝试将显示在`事件查看器`中。然而，要查看对象访问事件，你必须指定想要监控的对象。你可以在对象的`属性`对话框的`安全`选项卡上启用审核。在`安全`选项卡上，点击`高级`。这会打开你之前使用的`高级安全设置`对话框，你曾从中禁用权限继承、查看权限以及在应用多个权限时学习有效访问权限。要启用审核，点击`审核`选项卡并点击`继续`。从那里，你可以添加要审核的对象。查看图\
  \ 4-22\n\n![在高级安全设置对话框中添加对象。](img/httpatomoreillycomsourcemspimages1988983.png.jpg)图\
  \ 4-22. 在高级安全设置对话框中添加对象。\n\n在`高级安全设置`对话框中，点击`添加`。在弹出的窗口中，点击`选择主体`并输入要审核的用户或组的名称。（作为一个示例，你可能会选择`用户`。）选择审核选项，例如`成功`。最后，选择审核适用的选项（例如`仅文件夹`）并配置基本权限。查看图\
  \ 4-23。点击`确定`并关闭打开的对话框。*（注：此处原文链接文本似乎略有错误，应为 Entry 对话框）\n\n![在审核实体对话框中配置审核。](img/httpatomoreillycomsourcemspimages1988985.png.jpg)图\
  \ 4-23. 在审核实体对话框中配置审核。\n\n### 注意：警惕审核泛滥\n\n如果你审核了太多的文件夹、子目录和其他对象，在几天内就会产生成千上万个事件。请谨慎审核对象的数量！\n\
  \n要查看审核事件，打开`事件查看器`。因为事件将记录在`安全`日志中，请导航到`Windows 日志`然后`安全`。你将在那里看到列出的事件。双击任何事件获取更多信息。查看图\
  \ 4-24。（你必须触发该事件，它才会出现在安全日志中。）\n\n![事件属性对话框显示了审核事件的时间戳。](img/httpatomoreillycomsourcemspimages1988987.png.jpg)图\
  \ 4-24. 事件属性对话框显示了审核事件的时间戳。\n\n### 注意：如果你在事件查看器中没有看到任何事件怎么办\n\n如果在配置审核后在`事件查看器`中没有看到任何事件，请确保你已为每个资源定义了组和想要审核的内容。\n\
  \n### 考试提示\n\n\n\n\n\n如果你被问及如何为审核事件设置警报，操作流程如下：在`事件查看器`中，右键点击该事件并点击`将任务附加在此事件`。使用向导选择任务并应用操作。你可以选择发送电子邮件、启动程序或显示消息。发送电子邮件和显示消息已弃用，但仍是可选选项。（弃用意味着该功能仍然可用，但不再被视为理想的选项，Microsoft\
  \ 可能会在未来的更新或新的产品、版本中删除该功能。）\n\n## 现实世界：审核与夜班\n\n大约五年前，我的一位朋友在一家公司工作，那里有一支清洁小组在晚上进入办公室清洁、倒垃圾、擦拭架子灰尘并吸地。起初，工作是可以接受的，五个人的清洁小组看起来非常有责任感。然而，随着时间的推移，工作变得马虎。她知道清洁小组是准时到达的，并且停留了所需的时间，因为外面的安保人员证实了这一点。\n\
  \n她开始怀疑，如果清洁小组没有在工作，那么他们在夜班期间到底在做什么。她开始审核各种事件，包括主办公室计算机的登录事件。她怀疑员工已经发现了如何登录办公室的计算机，并且花时间看在线视频、玩游戏等，而不是在工作。她是正确的；审核显示，在夜间时段，主办公室的一台计算机确实出现过成功的登录事件。清洁小组发现了贴在键盘托盘下方的用户名和密码，并在无人的夜间使用该计算机。问题很快得到了解决，该员工接受了教育，清洁小组被解雇了。\n\
  \n## 思考实验：应用磁盘配额\n\n在这一思考实验中，请运用你在本目标中学到的知识。你可以在本章末尾“答案”部分找到这些问题的解答。\n\n你有几位用户在文件服务器上存储了大量数据，并垄断了那里的可用存储。你想应用磁盘配额，将这些用户限制在合理的存储限制范围内。访问文件服务器的所有其他用户几乎不占用空间，因此你不担心限制他们的使用。你想确保这些有问题的用户永远不会超过他们允许的存储空间；你对发送警告或以任何其他方式管理问题不感兴趣。他们已被多次告知删除不必要的文件，但尚未尚未这样做。\n\
  \n1. 你去哪里启用磁盘配额？\n2. 除了`启用配额管理`，你还应该配置另外哪两个选项，以确保用户永远不会超过他们的配额限制？\n3. 这些设置会影响在为你配置了磁盘配额的卷上存储数据的其他用户吗？\n\
  \n### 目标总结\n\n*   NTFS 权限是分配资源权限的最安全、灵活的方法。通过使用它们，你可以锁定任何对象以有效控制访问。\n*   NTFS 继承是\
  \ NTFS 控制的核心，并是默认启用的。\n*   磁盘配额允许你轻松管理用户可以访问多少存储空间，以及当他们达到或超过限制时会发生什么。\n*   `EFS`\
  \ 允许用户加密文件和文件夹，加密和解密过程对用户来说是无缝的。`EFS` 文件在`文件资源管理器`中以绿色显示。\n*   审核对象访问允许你通过你配置的方式记录成功和失败来监控对象。\n\
  \n### 目标审查\n\n回答以下问题以测试你对本目标信息的掌握。你可以在本章末尾的“答案”部分找到这些问题的答案，以及对每个选项为何正确或错误的解释。\n\n\
  | **Q:** | 1\\. ________________ (A(n)) 是被赋予 NTFS 权限以及为其（它们）配置了权限的用户、组或计算机。\n1.\
  \ 安全主体\n2. 访问控制条目\n3. 访问控制列表\n4. 元素、对象或资源 |\n| **Q:** | 2\\. 在对象的`高级安全设置中的`对话框中，你可以执行哪些任务？（选择所有适用项。）\n\
  1. 添加新主体、允许或拒绝访问并设置基本权限\n2. 查看分配给该对象的共享和 NTFS 权限\n3. 为该对象启用审核\n4. 在应用了多个权限时查看用户的有效访问权限\
  \ |\n| **Q:** | 3\\. 你可以使用哪种命令行工具来加密文件和文件夹？\n1. `Set-Acl`\n2. `Icacls.exe`\n3. `Cipher.exe`\n\
  4. 你无法从命令行配置加密。 |\n| **Q:** | 4\\. 如果黑客获取了机器的物理访问权限，攻破了操作系统以访问已加密的文件和文件夹，并尝试将这些文件和文件夹拷贝到\
  \ USB 驱动器，会发生什么？\n1. 黑客将能够复制文件，因为加密无法防止将数据复制到 USB 驱动器。\n2. 只要启用了并应用了加密，黑客就无法通过这种方式获取任何数据。\n\
  3. 黑客只有在从每个相关文件和文件夹中删除加密属性后才能复制文件。\n4. 黑客将收到“拒绝访问”的消息。 |\n\n## 目标 4.3：配置身份验证和授权\n\
  \n身份验证是登录计算机、访问工作组或网络计算机或登录域的过程，可以使用 Microsoft 帐户、本地用户账户、域帐户、个人识别码 (PIN)、密码、虚拟或物理智能卡或生物识别等实现。授权是在完成身份验证后发生的事情；它使用经过验证的用户能够访问数据并执行他们需要的任务。\n\
  \n在本目标中，你将学习用户身份验证的各种方式，以及如何配置用户权限、管理凭据以及配置用户帐户控制 (`UAC`) 行为。\n\n**本目标涵盖如何：**\n\n\
  *   设置和配置 Microsoft 帐户\n*   在工作组和域中配置身份验证\n*   配置虚拟智能卡和生物识别\n*   配置用户权限\n*   管理凭据和证书\n\
  *   配置用户帐户控制行为\n\n### 设置和配置 Microsoft 帐户\n\nMicrosoft 帐户（以前称为 Windows Live ID）是运行\
  \ Windows 8 的计算机的新型登录方式。此类帐户允许用户将特定设置同步到云端，以便在可以使用相同 Microsoft 帐户登录的其他计算机上访问这些设置。通过\
  \ Microsoft 帐户，用户还可以访问他们自己的云空间，称为 `SkyDrive`。Windows 8.1 带有一个 `SkyDrive` 应用，并且可以通过兼容的应用程序、各种网页浏览器和`文件资源管理器`访问\
  \ `SkyDrive`。\n\n用户在首次设置 Windows 8 计算机时，系统会提示他们设置 Microsoft 帐户。他们可以选择这样做，也可以拒绝并转而创建本地账户。如果计算机在设置期间无法访问互联网，用户也可能创建本地账户（因为没有互联网连接的情况下，他们将无法创建或确认\
  \ Microsoft 帐户）。还可以创建子帐户。即使用户开始时使用的是本地账户，他们通常也会选择稍后创建 Microsoft 帐户，因为当用户使用本地账户登录时，许多应用程序是无法使用的。此外，没有\
  \ Microsoft 帐户，用户无法从 Store 获取应用程序。\n\n\n\n\n一旦创建了微软账户，用户在后续会话中不需要连接 Internet 即可登录。账户信息会保存到本地。如果没有\
  \ Internet 连接，最后保存的设置也将生效，因为它们也已缓存在本地。\n\n### 考试提示\n\n在安全策略（本地或域）中使用此设置来阻止使用微软账户：`Block\
  \ Microsoft Accounts`（阻止微软账户）。该设置位于此处：`Security Settings, Local Policies, Security\
  \ Options`（安全设置、本地策略、安全选项）。\n\n你可以从 PC 设置将本地账户切换到微软账户。你也可以在那里创建新用户，并让他们以后使用自己的微软账户登录以完成账户创建。向导会引导你完成整个过程。要开始，在\
  \ PC 设置中点击`Accounts`（账户）。你在`Your Account`选项卡上从本地账户切换到微软账户，见图 4-25。你可以通过点击`Add An\
  \ Account` 使用`Other Accounts` 选项创建其他用户，同样见图 4-25。一旦创建了账户，以后可以返回此处根据需要更改账户类型。（控制面板仍然创建账户的选项。）\n\
  \n![在 PC 设置中轻松添加账户。](img/httpatomoreillycomsourcemspimages1988989.png.jpg)图 4-25.\
  \ 在 PC 设置中轻松添加账户。\n\n如果微软账户没有通过组策略限制，则可以在域中使用。如果在你的工作场所可行，一旦连接，你将看到与家里主电脑（或另一个办公室）上相同的桌面背景、应用设置、浏览器历史等。你通过\
  \ PC 设置中的`Users`进行更改。到达那里后，点击`Connect Your Microsoft Account`（连接你的微软账户）并完成设置过程。\n\
  \n### 考试提示\n\n运行 Windows 8 的计算机有多种登录方式，除了输入微软账户名或本地账户名和密码。你还可以创建四位 PIN 或图片密码。你可以在\
  \ PC 设置、`Accounts`和`Sign-in Options`（登录选项）中设置这些内容。在参加考试之前，确保你了解如何操作；你可能会在这方面接受测试。记住图片密码有三种手势：点击、画圈和画线。\n\
  \n### 在工作组和域中配置身份验证\n\n保护计算机时最薄弱的环节通常是应用到用户账户的密码。密码可能不存在、太短、太简单或太容易预测。在某些情况下，用户可能根本从不更改密码。通常，用户还会为多个用户\
  \ ID 创建并使用同一个密码。这是一个次要薄弱环节。如果黑客找到了用户在线银行账户的密码，她会尝试在其他尝试相同密码，包括用户的计算机。为了保护工作组和域中的身份验证，管理员可以创建本地策略和组策略，定义密码应如何创建、多久可以或必须更改一次，以及用户在尝试特定次数登录失败后会发生什么。\n\
  \n在本节中，我们查看适用于独立计算机或工作组中计算机的本地安全策略中提供的密码和账户策略，但相同的策略也存在于域的组策略管理控制台中。\n\n### 密码策略\n\
  \n由于用户可能不会因为你的要求就每 30 天更改一次密码，或仅使用复杂密码，管理员可以通过组策略强制用户遵守密码策略。共有六项可以配置的策略。要查看这些策略，打开本地安全策略\
  \ MMC。你可以通过运行对话框输入`secpol.msc`执行此操作。展开`Account Policies`（账户策略）并点击`Password Policy`（密码策略）。默认未配置任何策略，但你可以通过双击策略进行更改来设置。见图\
  \ 4-26。\n\n![创建密码策略。](img/httpatomoreillycomsourcemspimages1988991.png.jpg)图 4-26.\
  \ 创建密码策略。\n\n如果你不确定启用某项特定策略的作用，点击`Explain`（说明）选项卡，同样见图 4-26。在那并在你可以读到关于该策略的相当详长的描述，其中包含了默认设置、可用参数和最佳实践等。简而言之，这六项策略定义如下：\n\
  \n*   `Enforce Password History`（强制密码历史）：当你想要要求用户创建以前未使用过的唯一密码时，配置此项。例如，如果你将设置设置为\
  \ 5，则用户在创建五个不同的新密码之前，无法重新使用他们最喜爱的那个密码。\n*   `Maximum Password Age`（最大密码有效期）：当你想要用户在特定天数后更改密码时，配置此项。\n\
  *   `Minimum Password Age`（最小密码有效期）：当你想要用户在更改新密码之前必须保留新密码特定时间时，配置此项。这很重要，因为如果你没有设置它，但设置了`Enforce\
  \ Password History`，用户只需一个接一个地循环使用所需的密码，直到他们可以重新使用他们最喜欢的那个。\n*   `Minimum Password\
  \ Length`（最小密码长度）：使用此设置要求密码具有特定长度或更长。在安全性、客户满意度和合规性之间存在微妙界限。尽管你可能认为 14 个字符的密码是最安全的选项，但请注意，如果你要求那么长的密码，用户可能会将其打印出来放在桌子上。\n\
  *   `Password Must Meet Complexity Requirements`（密码必须符合性性）：使用此设置要求用户创建符合复杂标准的密码。启用此项时，密码不能包含用户账户名或全名的部分，长度至少为六个字符，并且必须包含四类字符中的三类：大写字母、小写字母、数字和特殊字符（`!`、`$`、`#`）。\n\
  *   `Store Passwords Using Reversible Encryption`（使用可逆加密存储密码）：配置此项以便操作系统使用可逆加密存储密码。尽管听起来是个好主意，但事实并非如此。启用此时，操作系统实际上以明文存储密码。如果你通过远程访问或\
  \ Internet 身份服务（IAS）使用握手验证协议（CHAP），则选择此项。在 Internet 信息服务（IIS）中使用摘要验证时也需要。\n\n####\
  \ 账户锁定策略\n\n如果黑客有足够的时间和信息，他可能会破解用户的密码并访问计算机。这可以通过专门设计的程序手动完成。你可以配置账户锁定策略来防止这种情况。与密码策略一样，对独立和工作组计算机配置本地安全策略，对\
  \ Active Directory 域网络使用组策略管理控制台。图 4-27 显示了本地安全策略 MMC。\n\n有三项需要考虑的账户锁定策略，在大多数情况下，它们必须一起配置：\n\
  \n\n\n\n\n- `Account Lockout Duration`（账户锁定时间）。如果你配置了账户锁定阈值，并且达到了该阈值，此设置定义了用户被锁定计算机的时间（以分钟）。通常设置为\
  \ 5 到 15 分钟即可。\n- `Account Lockout Threshold`（账户锁定阈值）。你必须配置此项才能使用其他选项。此设置定义了用户在被锁定之前可以尝试登录计算机的次数。\n\
  - `Reset Account Counter After`（重置帐户计数器）。此设置定义了失败登录尝试后必须经过的分钟数，失败登录计数器才会归零。如果定义了账户锁定阈值，此值必须小于或等于其中设置的分钟数。\n\
  \n## 配置虚拟智能卡和生物识别\n\n用户名和密码在保护计算机免受未经授权的访问方面本质是脆弱的。用户通常是问题所在，因为用户可能会自愿将密码交给他人、被欺骗，或者将密码留在桌面上或抽屉里。智能卡可以提供更好的安全性，特别是当它与用户名和密码（或\
  \ PIN）结合作为多因素身份验证策略的一部分时（尽管用户也可能自愿将卡片和 PIN 交给同事，以便同事访问其工作站）。另一个可用选项是：生物识别。这可以是指纹、眼部扫描等。\n\
  \n### 智能卡和虚拟智能卡\n\n实体智能卡通常看起来像信用卡，用户被要求随身携带。智能卡包含一个芯片，其中存储了用户的验证信息，包括个人证书。当用户想要访问计算机（或收银机、自助终端、药房等）时，会将智能卡插入读卡器。有时用户会将智能卡安全地放在钱包或提包里，但更多时候会将智能卡挂在挂绳或智能卡套上（然后将其挂在腰带或衣物上）。通常，用户知道智能卡何时丢失；相比之下，用户并不知道密码何时被泄露。\n\
  \n### 考试提示\n\nWindows 8 支持个人身份验证 (PIV) 标准。这使得 Windows 8.1 能够从 Windows Update 获取\
  \ PIV 智能卡所需的驱动程序。如果无法使用 Windows Update，操作系统也包含自带的微驱动程序。\n\n## 更多信息：有可用策略来管理智能卡\n\
  \n在组织中使用实体智能卡时，你可以在组策略管理台中配置一些设置。你可以配置这些设置以要求使用智能卡，并指定在计算机会话期间移除智能卡时 Windows 8 应如何响应。你可以在计算机配置、策略、Windows\
  \ 设置、安全设置、本地策略、安全选项中查看这些设置。\n\n虚拟智能卡模拟实体智能卡的功能，但它们并不是实体卡。相反，它们是虚拟的，并使用许多新电脑上提供的信任平台模块\
  \ (TPM) 芯片提供安全性。这消除了对读卡器的需求。要使用虚拟智能卡，你必须有一台运行 Windows 8.1 的个人电脑，安装了功能完全的 TPM，并配置了支持使用虚拟智能卡的网络。\n\
  \n对于使用此类虚拟智能卡的组织员工来说，它仅仅是一个在计算机上始终可用的智能卡。在登录时，它显示为一个用户帐户，下方是使用普通密码或 PIN 登录的选项。如果用户需要使用多一台计算机，则必须为该计算机颁发新的虚拟智能卡。如果多个用户共享一台计算机，会有多个虚拟智能卡，每人一个。\n\
  \n### 更多信息：了解虚拟智能卡技术\n\n有关更多信息，请参阅了解和评估虚拟智能卡 `[`www.microsoft.com/en-us/download/details.aspx?displaylang=en&id=29076`](http://www.microsoft.com/en-us/download/details.aspx?displaylang=en&id=29076)`。\n\
  \n在登录时，Windows 8.1 会检测是否安装了智能卡读器，以及上次使用计算机时是否使用它登录。如果没有安装智能卡且用户选择了智能卡登录图标，系统会提示用户连接智能卡。此外，智能卡服务仅在需要时运行。智能卡服务\
  \ (`scardsvr`) 在用户连接智能卡读器时自动启动，并在用户移除智能卡读器且没有其他智能卡读器连接到计算机时自动停止。\n\n如果有所需的技术和凭据，请按照以下步骤配置\
  \ Windows 8.1 虚拟智能卡：\n\n1. 打开一个具有管理员权限的命令提示符。\n2. 输入 `tpm.msc`。\n3. 验证是否找到兼容的 TPM\
  \ 且其版本至少为 1.2 或更高。如果你收到错误但确定有可用的模块，请在继续之前在系统 BIOS 中启用它。\n4. 关闭 TPM 管理控制台。\n5. 在命令提示符处输入\
  \ `TpmVscMgr create /name MyVSC /pin default /adminkey random /generate` 并按回车。在创建虚拟智能卡时如果想提供自定义\
  \ PIN 值，请使用 `/pin prompt`。\n\n## 使用生物识别\n\nWindows 8.1 包含一个名为 Windows 生物识别框架 (Windows\
  \ Biometric Framework) 的组件。这使得可以使用指纹等物理特征来识别用户，而无需像 Windows 7（及更早版本）中那样费周章。尽管如此，将其与次要验证方法配合使用，因为扫描仪可能会故障，从理论上讲，生物识别方法可能会被泄露。例如，我能够用我猫的脸而不是我的脸解锁我配置了使用人脸识别的智能手机。这是厂商的问题，也可能是你的问题。\n\
  \n要使用该服务，需要确保生物识别服务在服务控制台中正在运行。你还需要安装生物识别硬件，通常是某种扫描仪。设备管理器支持此类设备，Windows Update\
  \ 也是如此；组策略中有可用设置来管理它们（参见图 4-28)），并且控制面板中有生物识别设备项，允许用户控制生物识别设备的可用性并指定它们是否可以登录本地计算机或域。你甚至可以使用生物识别设备授予用户账户控制\
  \ (UAC) 提升。\n\n![配置组策略以生物识别。](img/figatomoreillycomsourspimages1988995.png.jpg)图\
  \ 4-28. 配置组策略以生物识别。\n\n你可以在组策略编辑器计算机配置、管理模板、Windows 组件、生物识别中找到与生物识别相关的组策略。你从中可以选择以下选项：\n\
  \n- 允许使用生物识别\n- 允许使用生物识别登录\n- 允许域用户使用生物识别登录\n- 指定快速用户切换事件的超时\n\n### 更多信息：了解生物识别\n\
  \n有关生物识别的更多信息，请参考 TechNet 上的本文：`[`technet.microsoft.com/en-us/library/dn308564.aspx`](http://technet.microsoft.com/en-us/library/dn308564.aspx)`。\n\
  \n### 本地安全设置\n\n\n\n\n\n在 Windows 8 的考试中，有一个额外的项目：目标 4.2：配置文件和文件夹访问——**本地安全设置**。该条目在\
  \ Windows 8.1 考试更新中被移除了。然而，之前测试的一些项目仍然非常重要（而且你可能会在本次考试中看到它们的残余）。请确保你理解如何配置本地安全策略（我们已经在本书的多个章节中介绍过），以及如何配置安全启动（Secure\
  \ Boot）并充分利用统一可扩展性固件接口（UEFI）。要明确，使用安全启动不需要 `TPM` 芯片，但 BitLocker 则需要（这将在第 5 章 中讨论）。要使用安全启动，计算机必须使用\
  \ GUID 分区表结构。此外，请查看 SmartScreen 过滤器；此安全增强功能可以保护你的计算机（以及你）防止无意运行恶意软件。\n\n### 配置用户权利\n\
  \n用户权限允许用户执行与计算机相关的任务，例如更改系统时间或时区、关闭计算机以及获取文件所有权等。Windows 8.1 中可用的组已预配置了用户权利，包括用户（Users）、管理员（Administrators）、来客（Guests）、家庭用户（HomeUsers）、Hyper-V\
  \ 管理员等。（你可以在计算机管理控制的“系统工具”、“本地用户和组”、“组”下查看所有组）。\n\n你可以通过安全策略控制台配置用户权利和权限。你也可以通过查看特定策略“安全设置”窗格中的条目来了解用户权利是如何分配的。图\
  \ 4-29 显示了选择了`更改系统时间`的本地安全策略控制台。请注意，默认情况下只有 `LOCAL SERVICE` 和 `Administrators` 组可以执行此项任务。\n\
  \n![从安全设置\\本地策略\\用户权利评估查看默认值。](img/httpatomoreillycomsourcemspimages1988997.png.jpg)图\
  \ 4-29.从安全设置\\本地策略\\用户权利评估查看默认值。\n\n你可以向“用户权利分配”窗格中的任何条目添加（或删除）用户或组。要这样做，请双击条目进行更改（我们将选择`拒绝从网络访问此计算机`），点击“添加用户或组”，然后使用“选择用户或组”对话框完成添加。参见图\
  \ 4-30。然而，在执行之前，请记住管理员通常会先将用户添加到组，然后再进行操作。对于用户权利，管理员的传统做法是将拥有相应权利的用户添加到已分配这些权利的组中，或者向他们创建的组分配用户权利，然后在必要时将用户添加到这些组中。\n\
  \n![在本地安全策略中配置用户权利分配。](img/httpatomoreillycomsourcemspimages1988999.png.jpg)图 4-30.在本地安全策略中配置用户权利分配。\n\
  \n### 考试提示\n\n用户权利和用户权限是两个不同的概念。用户权利提供用户执行某项操作的能力。权限提供用户访问某项内容的能力。用户权利分配给用户和组。权限应用于文件和文件夹等对象。用户权利可以随用户移动。权限被分配给用户且通常是固定的。\n\
  \n## 管理凭据和证书\n\n凭据和证书以不同的方式帮助保护计算机。凭据是用户名和密码；证书则验证特定内容的安全性，例如加密文件或 Internet 下载内容。\n\
  \n### 凭据\n\n凭据是用户名和密码。Windows 8.1 带有`凭据管理器`（Credential Manager）来帮助管理和维护它们。`凭据管理器`保存了用户在使用自己的计算机访问本地网络上的服务器和资源（`Windows\
  \ 凭据`）时输入的凭据，并可用于备份和恢复它们。尽管，用户在提示时必须选择“记住我的凭据”选框，否则凭据将不会保存。`凭据管理器`还提供了“凭据锁”（Credential\
  \ Locker），它保存了与网站和 Windows 关联的用户名和密码（`网络凭据`）。它将所有这些内容保在一个名为“Windows 库”（Windows Vault）的区域中。\n\
  \n### 更多信息：凭据如何保存\n\n凭据保存在计算机用户配置文件下的加密文件夹中。支持此功能的应用程序（如 Web 浏览器和 Windows 8 应用）可以在登录过程中自动向其他计算机和网站提供正确的凭据。\n\
  \n如果用户名或密码在自上次保存以来发生了更改且访问失败，系统会提示用户输入新凭据。当成功访问资源或网站时，`凭据管理器`和`凭据锁`将覆盖原有内容。\n\n\
  只要用户使用其 Microsoft 登录，当他们在工作组或家庭组中从一台计算机移动到另一台时，保存的用户名和密码就会随用户移动。出于安全考虑，此功能在域中未启用。你可以从控制面板打开`凭据管理器。图\
  \ 4-31 显示了`凭据管理器`。\n\n![打开凭据管理器和 Windows 凭据。](img/httpatomoreillycomsourcemspimages1989001.png.jpg)图\
  \ 431.打开凭据管理器和 Windows 凭据。\n\n关于`凭据管理器`还有以下几点需要了解：\n\n*   Windows Store 应用可以编程使用`凭据锁`。\n\
  *   凭据漫游需要 Microsoft 账户进行同步。\n*   凭据漫游在非域计算机上默认启用，在域计算机上禁用。\n*   `凭据锁`通过使用 Web 身份验证代理的\
  \ Windows Store 应用，支持对 Twitter 和 LinkedIn 等服务的无缝登录。\n\n### 考试提示\n\n要在命令行中存储凭据，请使用命令行工具\
  \ `cmdkey /add`。\n\n注意图 4-31，存在备份和恢复凭据的选项，但这些选项仅在选择`Windows 凭据`时可用。当你点击“备份凭据”时，系统会先提示你浏览到保存凭据的位置，命名文件（扩展名为\
  \ `.crd`），然后按 `Ctrl+Alt+Del` 在安全桌面上继续备份过程。在此处你为该文件创建一个密码，以便只有你才能访问。\n\n### 考试提示\n\
  \n必须理解的是，你无法从`凭据管理器`内部备份在 Web 浏览器中保存的凭据。这些凭据作为你的 Microsoft 账户的一部分并与账户同步。（这些凭据确实会漫游，前提是你使用了创建它们时的\
  \ Microsoft 账户进行登录。）\n\n### 证书\n\n\n\n\n\n网站使用证书来验证站点是否符合特定的安全要求。你从互联网下载的可执行文件通常也有证书，以显示它们自创建以来未被篡改过。如果这些文件是由你可以信任的有效在线实体提供的，那么它们通常来自经过验证的证书颁发机构。Windows\
  \ 8 创建了自己的证书，包括本章早些讨论的用于 `EFS` 的自签名证书。虽然证书的使用对终端用户是不可见的，但你可能想要管理它们，特别是对它们进行备份。例如，你可能想迁移它们，或者只是为备份和恢复提供多一个工具。\n\
  \n执行此特定备份任务的唯一地方是 `Certificate Manager`（证书管理器）MMC。你可以在运行对话框或开始屏幕上通过输入 `certmgr.msc`\
  \ 来打开它。你可以在图 4-32 中看到。这里有很多条目，每个条目代表特定类型的证书。个人证书（Personal Certificates）和信任的发布者（Trusted\
  \ Publishers）是其中两个。图 4-32 显示展开了信任的根证书颁发机构并选择了证书。仔细观察，你可能会识别某些名称：VeriSign、Go Daddy、Microsoft\
  \ 和 Equifax。\n\n![The Certificate Manager MMC offers a listing of all the certificates\
  \ available on the computer.](img/httpatomoreillycomsourcemspimages1989003.png.jpg)图\
  \ 4-32.证书管理器 MMC 提供了计算机上所有可用证书的列表。\n\n要备份单个证书，右键点击要备份的证书，点击“所有任务”，然后点击“导出”。按照向导操作选择要使用的格式。这是备份证书并使图\
  \ 4-33 所示选项变得唯一方法。如果你选择了多个证书，你将必须选择个人信息交换（Personal Information Exchange）或 Microsoft\
  \ 序列化证书存储（Microsoft Serialized Certificate Store）。\n\n![Select certificates to back\
  \ up one at a time to access to the three options shown here.](img/httpatomoreillycomsourcemspimages1989005.png.jpg)图\
  \ 4-33.逐个选择备份证书以访问此处显示的三个选项。\n\n### 更多信息：支持的文件格式\n\n证书导入和导出操作支持四种文件格式：\n\n* 个人信息交换\
  \ (PKCS #12)\n    个人信息交换格式（`PFX`，称为 `PKCS #12`）支持证书、私钥以及证书路径中所有证书的安全存储。`PKCS #12`\
  \ 格式是唯一可用于导出证书及其私钥的文件格式。\n\n*   加密消息语法标准 (PKCS #7)\n    `PKCS #7` 格式支持证书以及证书路径中所有证书的存储。\n\
  \n*   DER 编码二进制 X.509\n    区分编码规则（`DER`）格式支持存储单个证书。此格式不支持存储私钥或证书路径。\n\n*   Base-64\
  \ 编码 X.509\n    `Base-64` 格式支持存储单个证书。此格式不支持存储私钥或证书路径。\n\n### 配置用户账户控制行为\n\n你可能熟悉在执行任务需要特权权限时出现的账户控制（`UAC`）提示。当以标准用户身份登录时，用户必须在\
  \ `UAC` 对话框中同时输入管理员用户名和密码，并点击“是”才能继续。当以管理员身份登录时，用户必须点击“是”或“否”以继续。当这些提示出现时，它们会显示在安全桌面上。在输入正确的凭据或答案，或取消该任务尝试之前，任何操作都不会发生。安全桌面可以在用户决定如何操作时，防止后台发生任何情况。\n\
  \n### 注意：关于令牌（Tokens）的一切\n\n尽管微软建议用户使用标准账户执行日常计算任务，但大多数人并没有遵循这一建议。由于如此，管理员账户被赋予两个令牌（一个用于标准用户，一个用于管理员用户）。令牌定义了用户登录时的访问级别。默认情况下，大多数时间使用标准用户令牌。当尝试特定活动时，管理员仍会收到提示。\n\
  \n你可能知道如何使用控制面板中相应的滑块来更改 `UAC` 级别。你可以通过点击“更改用户账户控制设置”从操作中心访问。\n\n### 考试技巧\n\n如果你被问及如何配置计算机以便在执行特定任务时需要特权权限，请注意答案可能与\
  \ `UAC` 设置有关。\n\n不过，`UAC` 的内容远不止于此。一个选项可以使用本地安全策略来专门定义 `UAC` 的配置方式。选项太多，无法在此列出，但你可以在本地安全策略窗口的“本地策略”下的“安全选项”中查看它们。双击任何用户账户控制策略选项并点击“说明”选项卡以了解它。图\
  \ 4-34 显示了此，并选择了“用户账户控制：标准用户的行为”。\n\n![Change options for the various UAC policies\
  \ to suit your environment needs.](img/httpatomoreillycomsourcemspimages1989007.png.jpg)图\
  \ 4-34.更改各种 UAC 策略的选项以适应你的环境。\n\n关于 Windows 8 中 `UAC` 提示的更多要点。提升提示的颜色编码如下：\n\n*\
  \ 红色背景带红色盾图标。应用程序被组策略阻止或来自被阻止的发布者。\n* 蓝色背景带蓝色金色盾图标。应用程序是 Windows Server 2012 管理应用程序，例如控制面板项。\n\
  * 蓝色背景带蓝色盾图标。应用程序使用 Authenticode 签名并被本地信任。\n* 黄色背景带黄色盾图标。应用程序未签名或已签名但尚未被本地信任。\n\n\
