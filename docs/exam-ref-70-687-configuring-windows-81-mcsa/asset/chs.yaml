  \ 它打开了证书管理器控制台。\n    4. **错误：** 它打开了服务控制台。\n\n## 第 5 章：配置远程访问与移动\n\n办公的人比以往任何时候都多。他们在家里、酒店房间、飞机上以及公司分机构工作。这些用户需要能够通过安全的虚拟专用网络（VPN）连接到自己的桌面和公司网络，并且在连接丢失时需要重新连接。他们还需要使用自己的宽带连接进行连接，无论运营商或连接类型如何。最后，他们需要通过互联网以各种方式工作，包括从飞机上通过酒店\
  \ Wi-Fi。\n\n尽管如此，他们的移动设备也需要保护，以防被盗或破坏。你需要能够配置 `BitLocker` 和 `BitLocker To Go`，并配置适当的启动和恢复密钥来实现这一点。这些用户还需要你为使用离线文件和同步设置组策略，并教他们如何针对任何情况使用最相关的电源策略来配置配置机器。不过，还有更多内容，包括理解\
  \ Windows To Go 并在适用时将其作为选项。\n\n**本章目标：**\n\n* 目标 5.1：配置远程连接\n* 目标 5.2：配置移动性选项\n\
  * 目标 5.3：配置移动设备安全\n\n## 目标 5.1：配置远程连接\n\n我们之前讨论过两种远程连接选项：远程协助和远程桌面。要回顾这些内容，请参阅第\
  \ 3 章，特别是目标 3.4：配置远程管理。我们在这里再次涉及某些内容，但不会深入探讨。本目标的重点是各种场景下的远程认证、远程桌面技术以及你可以使用的连接类型，包括\
  \ VPN 和宽带。\n\n**本目标涵盖了如何：**\n\n* 配置远程认证\n* 配置远程桌面设置\n* 配置 VPN 连接和验证\n* 启用 VPN 重连\n\
  * 配置宽带热点\n\n### 配置远程认证\n\n在考试中，你会遇到许多需要了解哪些协议不适用于特定连接类型的题目。这些协议用于配置和完成远程认证，从而验证想要连接的用户确实是你想要连接的人。在继续之前，请确保你熟悉以下协议。\n\
  \n#### VPN 协议\n\nWindows 8.1 支持许多协议，这里列出的是用于 VPN 的（大致从旧到新、从不安全到安全排序）：\n\n* `点对点协议\
  \ (PPP)`：当使用拨号连接连接客户端到服务器时，会使用专用链路，并在整个会话期间保持该连接。该链路被称为点对点协议 (PPP)，是一种非常安全的连接，因为它是拨号连接，很难被黑入。PPP\
  \ 也可以用于越互联网 VPN。这比拨号连接的安全性低，因为黑客更容易获取在互联网上传输的数据。\n\n\n\n\n*   `Point-to-Point Tunneling\
  \ Protocol (PPTP)`。这是所有 VPN 协议中安全性最低的。PPTP 不需要使用证书来确保安全。尽管如此，它是比 PPP 更好的选择，因为数据包通过隧道技术进行封装，在传输过程中得到了更好的保护。PPTP\
  \ 仅支持微软挑战握手认证协议第 1 版本和第 2 版本（`MS-CHAP v1` 和 `MS-CHAP v2`）、可扩展认证协议 (`EAP`）以及保护的可扩展认证协议\
  \ (`PEAP`）。\n\n*   `Layer 2 Tunneling Protocol (L2TP)`。该协议使用 IP 安全扩展 (`IPsec`）进行加密和封装。它使用数据加密标准\
  \ (`DES`) 或三重 DES (`3DES`）进行加密，密钥从 IPsec 互联网密钥交换 (`IKE`）获取。L2TP/IPsec 使用预共享密钥或证书，并提供数据完整性检查。L2TP/IPsec\
  \ 支持 Windows XP、Windows Vista、Windows 7、Windows 8、Windows 8.1、Windows Server 2003\
  \ 和 Windows Server 2008。\n\n*   `Secure Socket Tunneling Protocol (SSTP)`。该协议通过安全套层\
  \ (`SSL`) 协议封装 PPP 流量，并使用证书进行认证。认证涉及可扩展认证协议-传输层安全 (`EAP-TLS`) 并提供完整性检查。SSTP 支持 Windows\
  \ Vista、Windows 7、Windows 8、Windows 8.1、Windows Server 2008 R2 和 Windows Server\
  \ 2012。\n\n*   `Internet Key Exchange, Version 2 (IKEv2)`。该协议支持 IPv6 和 VPN 重连，并支持使用\
  \ `EAP`、`PEAP`、`EAP-MSCHAPv3` 和智能卡进行认证。它不支持密码认证协议 (`PAP`) 和 `CHAP` 作为认证方法。当用户从一种连接切换到另一种连接时（例如从无线切换到有线）以及在许多其他场景下，IKEv2\
  \ 非常有用。Windows 8.1 客户端在连接远程服务器时会尝试使用此协议。IKEv2 支持 Windows 7、Windows 8、Windows 8.1、Windows\
  \ Server 2008 R2 和 Windows Server 2012。\n\n## 认证协议\n\n客户端在访问网络资源之前必须经过认证。以下是最常见的认证协议：\n\
  \n*   `PAP`。该协议安全性最低，使用明文密码。它在无法协商其他认证方法时作为最后手段使用。它在基于 Windows 8 的客户端上默认不启用，且不被认为是安全的。\n\
  \n*   `CHAP`。该协议在客户端和服务器之间使用三路握手，并使用密钥进行加密。这最适用于旧版连接，比 `PAP` 更好，但倾向于使用其他方法。\n\n\
  *   `MS-CHAP v2`。该协议使用双向相互认证，比 `CHAP` 更强。尽管如此，仍然存在更好的协议，包括 `EAP`。\n\n*   `EAP-MS-CHAPv2`。该协议使用\
  \ `EAP` 进行认证。`EAP` 提供了最且最灵活的安全选项。通过它，可以使用密码以外的其他方式协商认证，包括证书和智能卡。这是基于 Windows 8 的机器上新连接的默认选择。\n\
  \n你可以从 VPN 连接的“属性”对话框中探索这些协议和认证选项。示例参见图 5-1。\n\n![从 VPN 连接的属性对话框中探索协议和认证选项。](img/httpatomoreillycomsourcemspimages1989009.png.jpg)图\
  \ 5-1. 从 VPN 连接的属性对话框中探索协议和认证选项。\n\n### 更多信息：了解远程协助和 Netsh\n\n远程协助位于第 3 章中。`Netsh`\
  \ 也包含在内。请参考第 3 章以了解更多关于这两项技术的知识。\n\n### 提示\n\nIKEv2 支持 VPN 重连。`PPP`、`PPTP`、`SSTP`\
  \ 和 `L2TP` 不支持。`EAP` 支持智能卡。其他认证协议不支持。如果你想使用预共享密钥，必须选择 `L2TP/IPsec`。`DES`、`3DES`\
  \ 和 `IKE` 用于 `L2TP`。\n\n### 配置远程桌面设置\n\n你已经在第 3 章中学习了如何使用远程桌面，还学习了如何在远程桌面连接对话框及其中的可用选项卡（常规、显示、程序、体验、高级）中做出配置选择。在这里你将学习更多关于远程桌面的技术方面。\n\
  \n远程桌面协议 (`RDP`) 是用于在员工离开桌面时连接到其桌面的协议，例如当他们在家里或酒店时。此外，网络管理员还使用远程桌面远程管理计算机和服务器，通常是从同一栋楼内或附近另一公司的计算机进行的。用户可以从几乎任何类型的计算机连接到远程桌面，包括运行\
  \ Windows XP、Windows Vista、Windows 7、Windows 8、Windows 8.1 或 Windows RT 的计算机。主机计算机必须运行\
  \ Windows XP 专业版、Windows Vista 企业版、Windows Vista 终极版、Windows Vista 商业版、Windows 7\
  \ 终极版、Windows 7 企业版、Windows 7 专业版、Windows 8 专业版、Windows 8 企业版、Windows 8.1 专业版、Windows\
  \ 8.1 企业版。\n\n你可以在命令提示符中输入 `mstsc.exe` 来打开远程桌面对话框。你可以在图 5-2 中看到两者。\n\n![使用命令行工具\
  \ mstsc.exe 打开远程桌面。](img/httpatomoreillycomsourcemspimages1989011.png.jpg)图 5-2.\
  \ 使用命令行工具 mstsc.exe 打开远程桌面。\n\n在使用远程桌面时，可以使用 `mstsc.exe` 的参数有：\n\n*   `<connection\
  \ file>`\n*   `/edit <connection file>`编辑指定的 `.rdp` 文件。\n*   `/v:<Server[:<Port>]`指定远程计算机以及可选的连接端口号。\n\
  *   `/admin`连接到管理服务器的会话。\n*   `/f`以全屏模式启动远程连接。\n*   `/w:<Width>`指定远程桌面窗口的宽度。\n*\
  \   `/h:<Height>`指定远程桌面窗口的高度。\n*   `/public`以公共模式运行远程桌面。在公共模式下，不会缓存密码和位图。\n*   `/span`将远程桌面的宽度和高度与本地虚拟桌面匹配，必要时跨越多个显示器。\n\
  \n### 配置 VPN 连接和认证\n\n你可以在网络和共享中心通过点击“设置新建连接或网络”来创建 VPN。在弹出的对话框中，选择“连接到工作”并点击“下一步”。在那里你可以选择如何创建\
  \ VPN：使用我的 Internet 连接 (VPN) 或直接拨号。参见图 5-3。\n\n![在网络和共享中心中创建 VPN 连接。](img/httpatomoreillycomsourcemspimages1989013.png.jpg)图\
  \ 5-3. 在网络和共享中心创建 VPN 连接。\n\n### 注意：VPN 的工作原理\n\n\n\n\nVPN 建立起使用加密隧道传输数据的安全连接。这些连接通常用于从一个公司站点到另一个站点的连接，或者从员工的家里到办公室的连接。它们分别称为站点到站点连接和远程访问连接。VPN\
  \ 可以通过 Wi-Fi 和宽带连接，但由于两者都存在可靠性问题，最好将其与下一节讨论的 VPN 重连功能（VPN Reconnect）结合使用。\n\n在生成的对话框中，你需要执行以下操作：\n\
  \n*   输入 Internet 地址名称，例如 `Contoso.com`，或 `IPv4` 或 `IPv6` 地址，例如 `157.54.0.1` 或 `3ffe:1234::1111`。\n\
  *   为连接（或目标）输入一个名称。\n*   选择：\n    *   使用智能卡。\n    *   记住凭据。\n    *   允许其他人使用该连接。\n\
  \n你将在 `Networks`（网络）窗中看到该连接，如图 5-4 所示。要激活连接，点击它并输入所需的凭据。连接将建立。\n\n![VPN 连接出现在网络窗格中。](img/httpatomoreillycomsourcemspimages1989015.png.jpg)图\
  \ 5-4. VPN 连接出现在网络窗格中。\n\n现在，你可以通过控制面板中的 `Network Connections`（网络连接）窗口使用 `Properties`（属性）对话框配置\
  \ VPN 的属性。这些选项允许你执行包括但不限于以下任务：\n\n*   在 `General`（通用）选项卡上，更改主机名\n*   在 `Options`（选项）选项卡上，选择记住凭据或配置协议设置\n\
  *   在 `Security`（安全）选项卡上，更改 VPN 类型选项（自动、`PPTP`、`L2TP`、`SSTP`、`IKEv2`）；数据加密选项（无、`options`、需要、最大强度）；使用\
  \ `EAP`；允许其他协议\n*   在 `Networking`（网络）选项卡上，更改或重新配置 `TCP/IP` 设置和其他\n*   在 `Sharing`（共享）选项卡上，允许其他网络用户通过此计算机的\
  \ Internet 连接连接；选择家庭网络连接类型\n\n### 启用 VPN 重连\n\n当用户使用 VPN 连接到远程站点且连接丢失时，用户必须重新连接。这对于用户来说是一种困扰，因为这会分散他们的注意力并浪费时间。此外，由于通过宽带和免费\
  \ Wi-Fi 在旅途中、地铁、隧道和火车上工作的情况已非常普遍，服务中断可能会频繁发生。如果可能，最好为你的远程用户使用并配置 VPN 重连。\n\n要启用\
  \ VPN 重连——请记住，此功能仅在使用 `IKEv2` 作为 VPN 协议时可用——请遵循以下步骤：\n\n1.  打开 `Network Connections`\
  \ 窗口并找到要配置的 VPN 连接。\n2.  右键点击连接并点击 `Properties`（属性）。\n3.  在 `Properties` 对话框中，点击\
  \ `Security`（安全）选项卡。\n4.  点击 `Advanced Settings`（高级设置）。\n5.  在 `Advanced Properties`（高级属性）对话框中，点击\
  \ `IKEv2` 选项卡。参见图 5-5。\n6.  配置 `Network Outage Time`（网络中断时间）设置并点击 `OK`。\n7.  再次点击\
  \ `OK` 关闭 `VPN Connection Properties` 对话框。\n\n![为 VPN 重连配置网络断开时间设置。](img/httpatomoreillycomsourcemspimages1989017.png.jpg)图\
  \ 5-5. 为 VPN 重连配置网络中断时间设置。\n\n### 考试提示\n\n你可能会在考试中看到其他远程技术和术语的引用，尽管这里列出的内容未被明确列为目标。但在学习时，最好是广泛学习，因此请确保你至少熟悉以下术语和功能：\n\
  \n*   `BranchCache`。分布式和托管缓存模式通过公司站点之间缓存频繁访问的数据来减少网络带宽占用。\n*   `Network Access Protection\
  \ (NAP)`。帮助防止潜在危险的本地或远程客户端连接到网络。\n*   `DirectAccess`。使用户只要有 Internet 访问权限即可自动连接到公司网络。\n\
  \n### 配置宽带热点\n\n某些用户拥有移动设备，让他们可以在传统选项不可用时连接 Internet。传统选项包括免费的个人的 `Mi-Fi` 网络、`VPNs`、工作组和域网网络、来自\
  \ ISP 的宽带连接以及通过 `Ethernet` 连接到网络。当这些选项不可用时，用户可以选择内置或个人的蜂窝或计费宽带连接选项，或者使用他人的共享 Internet\
  \ 连接。\n\nWindows 8.1 内置了对这些新连接模式的支持。例如，任何 Windows 8.1 用户只要拥有所需的凭据，就可以连接到提供的共享个人热点。连接通过用于连接所有其他网络的传统\
  \ `Networks` 窗格建立。用户也可以使用该窗格断开连接。图 5-6 显示了 `Networks` 窗格，其中已连接的网络是共享个人热点。注意，用户还可以选择显示计费连接的使用情况（来自\
  \ `PC Settings`）。\n\n![使用网络窗格连接到共享个人热点。](img/httpatomoreillycomsourcemspimages1989019.png.jpg)图\
  \ 5-6. 使用网络窗格连接到共享个人热点。\n\n要配置 `Networks` 窗格显示估计用量，请导航到 `PC Settings`、`Network`、`Connections`\
  \ 并选择该连接。参见图 5-7。某些移动设备（包括支持长期演进 LTE 的设备）自带移动宽带技术。Windows 8.1 也支持这一点，用户可以与其他共享连接。这与通过手机共享相似，但是由平板电脑提供的。用户连接自己的设备。共享后，用户还可以更改\
  \ `SSID`、更改 `Wi-Fi` 网络密码并查看有多少人在共享。共享的人必须购买支持热点的流量计划此功能才能工作。\n\n![配置共享连接设置。](img/httpatomoreillycomsourcemspimages1989021.png.jpg)图\
  \ 5-7. 配置共享连接设置。\n\n### 更多信息：了解更多 Windows 8.1 中的宽带功能\n\n参考此文章获取更多有关 Windows 8.1\
  \ 宽带新增的功能：`http://msdn.microsoft.com/en-us/library/windows/hardware/dn247045.aspx`\n\
  \n 思考实验：选择理想的 VPN 协议\n\n在思考实验中，请应用你在本目标中学到的知识。你可以在本文末的“答案”部分找到这些问题的解答。\n\n你需要为一组客户端选择\
  \ VPN 协议，这些工作站全部运行 Windows 7 或更高版本，域控制器均为 Windows Server 2012。你不需要支持 `PAP` 和 `CHAP`\
  \ 等其他身份验证方法。你需要允许用户配置 VPN 重连。\n\n1.  你应该选择哪种协议？\n2.  用户可以使用 `EAP` 验证和智能卡连接吗？\n3.\
  \  如果一台 Windows Server 2012 机器故障并被旧的闲置 Windows Server 2008 R2 机器替换，是否需要更改协议和验证设置？\n\
  \n### 目标总结\n\n\n\n\n*   用户需要通过各种方式远程访问工作场所，包括通过 VPN、宽带、远程桌面、个人热点等。\n*   有许多类型的 VPN\
  \ 和身份验证协议，每种协议都提供不同级别的功能和安全性。您应该为您的网络基础设施使用安全性最高的协议。\n*   `VPN Reconnect`（VPN 重连）通过在连接丢失时自动重新连接，让远程用户更容易保持连接。\n\
  *   `Windows 8.1` 支持宽带共享和 Internet 共享，让用户在传统方法不可用时上网。\n\n## 目标复习\n\n回答以下问题以测试你对本目标中信息的掌握情况。你可以在本章末的“答案”部分找到这些问题的答案以及每个备选项正确或错误的解释。\n\
  \n| **问:** | 1\\. 下列协议中哪一个支持预共享密钥进行身份验证？ |\n| --- | --- |\n| 1. | PPP |\n| 2. |\
  \ SSTP |\n| 3. | L2TP |\n| 4. | EAP |\n| 5. | RDP |\n\n| **问:** | 2\\. 下列哪些项可以托管远程桌面会话：（选择所有适用项）\
  \ |\n| --- | --- |\n| 1. | Windows XP Pro |\n| 2. | Windows Vista Enterprise |\n\
  | 3. | Windows 7 Enterprise |\n| 4. | Windows RT |\n| 5. | 以上所有 |\n\n| **问:** |\
  \ 3\\. 你使用哪种命令启动远程桌面连接并以全屏模式启动连接？ |\n| --- | --- |\n| 1. | `rdp.exe /f` |\n| 2.\
  \ | `mstsc.exe mode=f` |\n| 3. | `rdp.exe /full` |\n| 4. | `mstsc.exe /f` |\n\n\
  | **问:** | 4\\. 一位用户抱怨，在使用宽带连接通过 VPN 连接到公司网络服务器时经常断开连接，每次发生这种情况她都必须花大量时间重新连接。`VPN\
  \ Reconnect` 的问题在哪里？ |\n| --- | --- |\n| 1. | 你无法通过宽带连接到 VPN。 |\n| 2. | `VPN Reconnect`\
  \ 默认禁用，你没有启用它。 |\n| 3. | 使用的 VPN 协议不是 IKEv2。 |\n| 4. | 使用的 VPN 协议不是 L2TP。 |\n\n\
  | **问:** | 5\\. 用户有一部手机并将其配置为个人热点，但系统没有提示他选择并自动从他的 `Windows 8.1` 电脑连接。他必须做什么才能连接？\
  \ |\n| --- | --- |\n| 1. | `Windows 8.1` 不支持连接到个人热点。 |\n| 2. | 他必须从“网络”格中选择连接。 |\n\
  | 3. | 此功能默认未启用；用户必须在控制面板的网络连接中启用它。 |\n| 4. | 计算机必须运行 `Windows 8.1` 专业版才能使用此功能。\
  \ |\n\n## 目标 5.2：配置移动选项\n\n一旦用户连接到网络并在其通过身份验证（使用你选择的任何协议或连接方法），你作为网络管理员的任务就发生了变化。现在，你必须确保用户在连接网络时和未连接网络时都能有效工作。这涉及配置同步文件夹、工作文件夹、离线文件策略、电源策略等。当用户无法或不想随身携带移动设备时，你也可以选择\
  \ `Windows To Go`。`Windows To Go` 基本上是 USB 上的 Windows，但有一些限制。你将在本节中学习这些以及更多内容。\n\
  \n**本目标涵盖如何：**\n\n*   配置离线文件策略\n*   配置电源策略\n*   配置同步选项\n*   配置 Wi-Fi Direct\n* \
  \  配置 `Windows To Go`\n\n### 配置离线文件策略\n\n用户在离开办公室时，可以使用许多技术连接到他们的桌面计算机和网络文件服务器，包括在本章第一部分详细介绍的\
  \ VPN 和蜂窝网络连接。然而，有时无法建立连接，但这并没有阻止用户访问他们的工作文件和工作文件夹。你可以允许离线访问，以便你的用户在这种情况下可以访问其数据。你需要开始配置\
  \ `Offline Files`（离线文件），然后创建策略来管理它。\n\n### 注意：如何同步文件夹\n\n要将 `Windows 8.1` 计算机与网络文件夹同步，你可以使用\
  \ `File Explorer` 浏览到该文件夹，右键点击文件夹名称并选择“始终离线”。`Windows 8.1` 将完成其余工作，并将所选文件夹的内容复制到本地硬盘。同样，管理员可以防止用户保存文件的离线副本。管理员使用\
  \ `Advanced Sharing`（高级共享）对话框并点击 `Caching`（缓存）打开 `Offline Settings`（离线设置）对话框。在在那里可以配置特定的设置。\n\
  \n启用并配置 `Offline Files` 后，当用户在线时，可以从网络服务器访问文件。当用户必须离线工作时，将从计算机可用的 `Offline Files`\
  \ 文件夹检索文件。计算机在以下情况下切换到 `Offline Mode`（离线模式）：\n\n*   启用了新的 `Always Offline`（始终离线）模式。此功能通过允许用户在可用连接的情况下始终离线工作，提供了更快的文件访问并使用了更少的带宽。\n\
  *   配置并启用了 `Cost-Aware Synchronization`（感知成本的同步）。\n\n\n\n\n探索组策略中“离线文件”选项提供的每个可用项，包括限于“配置低速链路速度”、“注销前同步所有离线文件”、“登录时同步所有离线文件”以及“启用透明缓存”。\n\
  \n## 配置电源策略\n\n你可以从`控制面板`、`硬件和声音`、`电源选项`中切换电源计划。从那里你还可以配置这些选项：\n\n* 要求从唤醒时输入密码\n\
  * 选择电源按钮的作用\n* 选择关闭盖子的作用\n* 创建电源计划\n* 选择关闭显示器的时间\n* 更改计算机睡眠的时间\n\n如果你对这些功能还不熟悉，请现在花些时间探索一下。请确保通过使用`电源选项`窗口任务窗格中的`创建电源计划`选项来创建你自己的个性化电源计划，因为你可能会在考试中遇到关于这的内容。你可能被要求说明在三个默认计划（`平衡`、`高性能`、`节电`）中每一个，在用电池运行或接通电源的情况下，计算机进入睡眠或关闭显示器之前需要经过多少分钟。\n\
  \n此外（你可以自己探索），你将需要知道如何监控电池使用情况（从`任务栏`的通知区域和从`移动中心`），以及如何使用`移动中心`更改常见的移动性设置，如电源计划类型、显示亮度等。`控制面板`、指向`电源选项`的链接以及`移动中心`如图\
  \ 5-9。\n\n![检查控制面板中与电源选项相关的内容。](img/httpatomoreillycomsourcemspimages1989025.png.jpg)图\
  \ 5-9. 检查控制面板中与电源选项相关的内容。\n\n除了这些管理电源的终端用户工具外，还有其他你将面临测试的电源相关项目，包括如何使用命令行工具`Powercfg.exe`来查看和导出电源计划，以及使用`组策略`配置电源策略。由于这些内容不常见且可能不太熟悉，我们将使用这些页面来涵盖这些概念。\n\
  \n### 使用 powercfg.exe\n\n`Powercfg.exe`是一个命令行工具，你可以用它来配置`控制面板`或`组策略`中不可提供的设置。在这里你可以做的事情之一是将电源管理计划导出到文件，然后将其导入另一台计算机。要使用此命令获取可用电源计划的列表，在命令提示符处输入`powercfg.exe\
  \ –list`。如果你还没有创建任何自定义计划，你只会看到 Windows 8.1 自带的三个默认计划，如图图 5-10 所示。选择要导出的计划并记下`GUID`值。要导出策略，输入`powercfg.exe\
  \ –export power.pow GUID`（其中此处为要导出的计划的`GUID`值）。\n\n![从命令行查看电源策略。](img/httpatomoreillycomsourcemspimages1989027.png.jpg)图\
  \ 5-10. 从命令行查看电源策略。\n\n还有其他你可以配合`Powercfg.exe`使用的的参数，它们列在此处：*[`technet.microsoft.com/en-us/library/cc748940(v=WS.10).aspx`](http://technet.microsoft.com/en-us/library/cc748940(v=WS.10).aspx)*。你应该检查这些内容，以便熟悉所提供的所有功能。这里有你现在可能想尝试的几个，只需获得对命令的感觉：\n\
  \n* –changename\n* –delete\n* –setactive\n* –deviceenablewake 和 –devicedisablewake\n\
  \n### 创建电源策略\n\n与几乎所有其他内容一样，你可以使用`组策略`来设置与可用电源计划相关的策略。使用`组策略管理编辑器`导航到`计算机配置`、`策略`、`管理模板`、`系统`、`电源管理`。当你在左窗格中展开`电源管理`时，你可以看到额外的容器：`按钮设置`、`硬盘设置`、`通知设置`、`睡眠设置`以及`视频和显示设置`。在右窗格你可以看到两个选项：`指定自定义电源计划`和`选择活动电源计划`。使用`本地组策略编辑器`从\
  \ Windows 8.1 的可用选项如图图 5-11 所示。与任何其他`组策略`一样，双击该策略以访问配置它的选项。\n\n![可以为电源管理配置组策略。](img/httpatomoreillycomsourcemspimages1989029.png.jpg)图\
  \ 5-11. 可以为电源管理配置组策略。\n\n当你点击`电源管理`下的五个节点之一时，会出现更多选项。你可以在这里控制电源选项的每个方面。例如，在`睡眠设置`节点中，你可以配置、启用和禁用以下（以及更多）：\n\
  \n* 指定系统睡眠超时（接通电源）\n* 指定系统睡眠超时（使用电池）\n* 计算机唤醒时需要密码（接通电源）\n* 计算机唤醒时需要密码（使用电池）\n*\
  \ 接通电源时允许进入待机状态（S3）\n* 使用电池时允许进入待机状态（S3）\n\n在继续之前，请确保探索`电源管理`下的所有节点节点。\n\n## 配置同步选项\n\
  \n此目标重点在于配置同步选项，而不是创建同步关系。然而，你应该知道如何创建同步关系，所以我们简要介绍这一点。完成后，你将学习如何在`同步中心`配置同步选项，包括何时发生同步以及在什么情况下。\n\
  \n你也可以从`电脑设置`配置`同步设置`，但它与同步离线文件无关。然而，因为它与一般的同步有关，我们为了起见提到了它。这种同步是用户使用其账户登录到多台计算机时发生的。\n\
  \n你还将学习 Windows 8.1 的一项新功能，`工作文件夹`。在域中实施`工作文件夹`有几个步骤，包括在活动 Directory 域文件服务器上安装`工作文件夹`、为这些工作文件夹创建安全组，以及为数据创建同步共享。虽然这超出了本书的范围，但我们在这里介绍了该概念，并且`工作文件夹`是\
  \ Windows 8.1`控制面板`中的一个选项。在那里，用户可以选择设置工作文件夹（如果你已经在公司网络上设置并配置了它）。\n\n### 同步中心和配置同步选项\n\
  \n为了练习`同步中心`并配置选项，你必须在运行 Windows 8.1 的计算机上创建一个同步关系。要执行此操作，导航到另一台计算机或文件服务器上的共享，右键点击该共享并点击`始终离线可用`。在此之后，在同一台\
  \ Windows 8.1 计算机上打开`同步中心`。你可以在开始屏幕上输入`同步中心`。你应该能看到如图图 5-12 所示。在继续之前，注意左侧的选项；一旦同步完成，可以使用这些选项来管理同步。其中一个选项`管理离线文件`允许你查看`离线文件`对话框，你可以在其中禁用离线文件、查看离线文件、检查磁盘使用情况、加密你的文件等。\n\
  \n\n\n\n在同步中心（Sync Center）中，一旦可用同步关系，你就可以选择同步所有内容（图 5-12 所示），或者你可以选择离线文件（Offline\
  \ Files）文件夹，点击“计划”（未显示），并按照提供的向导进行操作以配置同步设置。有两个选项：\n\n-   在指定时间；例如，每周一的上午 11 点或每天凌晨\
  \ 2 点。\n-   当事件发生时；例如，每当你登录计算机时。\n\n根据你的选择，你可以选择更多调度选项，例如仅在计算机空闲特定时间段后进行同步，或者当计算机运行在外部电源（而非使用电池供电）时进行同步。图\
  \ 5-13 显示了安排同步时间的选项以及可选的调度选项。\n\n![你可以非常具体的指定如何以及何时同步文件。](img/httpatomoreillycomsourcemspimages1989033.png.jpg)图\
  \ 5-13。你可以非常具体的指定如何以及何时同步文件。\n\n图 5-14 显示了当选择选择触发同步以与特定事件重合时会出现的选项。再次，还有额外的调度选项可以配置（如果你点击“更多选项”），以及可以从中进行选择的各种事件，包括“当我登录我的计算机时”。\n\
  \n![配置在满足触发条件时发生同步。](img/httpatomoreillycomsourcemspimages1989035.png.jpg)图 5-14。配置在满足触发条件时发生同步。\n\
  \n### 考试提示\n\n用户可以随时通过点击 Windows 移动性中心（Windows Mobility Center）中同步中心框内的“同步”按钮来强制进行同步。\n\
  \n### 在 PC 设置中配置同步选项\n\n当你创建并登录微软账户时，你可以将与开始屏幕、桌面、网络浏览器、某些密码、语言偏好等相关的设置同步到云端服务器。无论你选择同步什么，都将应用到以后使用该账户登录的任何计算机上。你可以在\
  \ PC 设置中，从 SkyDrive 和“同步设置”来配置要同步的内容。这些选项在图 5-15 所示。确保你熟悉这里可以同步的内容；你可能会在这方面接受测试。\n\
  \n### 注意\n\nSkyDrive 的名称将更改为 OneDrive，在某个时间点考试也将进行相应的术语变更。\n\n![使用 PC 设置配置在使用微软账户登录的计算机上同步哪些设置。](img/httpatomoreillycomsourcemspimages1989037.png.jpg)图\
  \ 5-15。使用 PC 设置配置在使用微软账户登录的计算机上同步哪些设置。\n\n### 工作文件夹（Work Folders）\n\n工作文件夹是 Windows\
  \ 8.1 中的一项新功能。工作文件夹允许用户将其位于公司域或数据中心中的用户文件夹中的数据同步到设备，并反之。这是自动完成的，并且是文件系统的一部分。在此功能引入之前，用户必须加入域，或者至少在同步发生前输入域凭据。现在，用户可以在设备上保留工作文件的本地副本，并在后台自动进行同步回公司文件服务器。\n\
  \n针对工作文件夹有可用的组策略，作为管理员你应该注意这些策略。有两个需要考虑的：\n\n-   从“用户配置”、“策略”、“管理模板”、“Windows 组件”、“工作文件夹”中，你可以指定工作文件夹设置。\n\
  -   从“计算机配置”、“策略”、“管理模板”、“Windows 组件”、“工作文件夹”中，你可以强制为所有用户自动设置工作文件夹。\n\n终端用户还可以在他们的\
  \ Windows 8.1 计算机上通过“控制面板”、“工作文件夹”配置一个选项。要进入此选项，请打开“控制面板”，将视图切换为“大图标”或“小图标”，然后点击“工作文件夹”。工作文件夹窗口出现，并有“设置工作文件夹”可供配置。参见图\
  \ 5-16。\n\n![用户可以从控制面板设置自己的工作文件夹。](img/httpatomoreillycomsourcemspimages1989039.png.jpg)图\
  \ 5-16。用户可以从控制面板设置自己的工作文件夹。\n\n为了让用户设置自己的工作文件夹，你必须已经设置好了他们访问以执行设置任务所需的工作文件夹基础设施。关于该过程的极佳指南可以在*[`blogs.technet.com/b/canitpro/archive/2013/11/13/step-by-step-creating-work-folders-test-in-windows-2012.aspx`](http://blogs.technet.com/b/canitpro/archive/2013/11/13/step-by-step-creating-work-folders-test-in-windows-2012.aspx)*获取。\n\
  \n一旦基础设施就绪，用户在设置工作文件夹时需要：\n\n1. 输入公司电子邮件地址。\n2. 等待向导搜索工作文件夹。\n3. 接受（或更改）保存文件的位置。\n\
  4. 阅读并接受安全策略。\n5. 完成后，工作文件夹将作为文件夹出现在“此电脑”中。\n6. 用户可以在任何设备上访问工作文件夹，并且由工作文件夹保持同步。\n\
  \n### 注意：工作文件夹要求\n\n使用工作文件夹时，客户端和服务器必须运行相同的版本才能正常工作。例如，如果服务器运行 Windows Server 2012\
  \ R2，则客户端必须运行 Windows 8.1。\n\n### 更多信息：关于工作文件夹\n\n要了解更多关于工作文件夹的信息，请参考 TechNet 上的文章*[`technet.microsoft.com/en-us/library/dn26597.aspx`](http://technet.microsoft.com/en-us/library/dn26597.aspx)*。\n\
  \n\n\n\n\n你将结合 `Netsh`、`wlan` 以及所需的参数来连接 Wi-Fi Direct。以下是在具有提升权限的命令提示符中使用 `Netsh\
  \ wlan` 时可以使用的一些可用参数：\n\n*   `Connect`：此参数用于连接到无线网络。你必须使用 `connect name=` 输入配置文件名称，并使用\
  \ `SSID=` 输入 SSID。\n*   `Export hostednetworkprofile`：此参数将无线局域网（WLAN）配置文件保存为可扩展标记语言（XML）文件。\n\
  *   `Refresh hostednetwork`：此参数刷新托管网络设置。\n*   `Set`：此参数用于设置配置信息。你必须添加如 `SSID`、配置文件名称等标签。\n\
  *   `Show all`：此参数显示当前可见的所有网络的信息。图 5-17 展了了运行此命令的部分结果。\n*   `Start hostednetwork`：此参数用于启动托管网络。\n\
  *   `Stop hostednetwork`：此参数用于停止托管网络。\n\n![使用 Netsh wlan 命令和适当的参数配置 Wi-Fi Direct。](img/httpatomoreillycomsourcemspimages1989041.png.jpg)图\
  \ 5-17. 使用 Netsh wlan 命令和适当的参数配置 Wi-Fi Direct。\n\n### 更多信息：搜索 Wi-Fi Direct 应用\n\n\
  由于 Wi-Fi Direct 仍处于起步阶段，关于如何使用它的信息并不多。不过，新的应用程序不断出现，它们可以为你完成繁重的工作。在商店中搜索 Wi-Fi Direct\
  \ 以查看可用内容。\n\n### 配置 Windows To Go\n\nWindows To Go 是一项新功能，允许用户从 USB 闪盘上运行 Windows\
  \ 8.1。他们可以在任何可以从 USB 驱动器启动的计算机上使用它。这就像在口袋里有一个虚拟 PC。然而，它确实具有局限性和特定要求。\n\n### 考试提示\n\
  \nWindows 8.1 的一项新功能是运行 Windows 8.1 的 Windows To Go 镜像能够从包含内置智能卡的驱动器启动。这类驱动器是复合驱动器，一个设备中同时包含质存储驱动器和智能卡。\n\
  \n*   主机 PC 必须符合 Windows 7 认证，但它可以运行任何操作系统。这些要求可以在此处查看：[`msdn.microsoft.com/en-us/library/windows/hardware/dn423132`](http://msdn.microsoft.com/en-us/library/windows/hardware/dn423132)。它们包括但不限于\
  \ USB 启动兼容性、1 吉 GHz (GHz) 或更快的处理器、2 GB 或更多内存、带有 Windows 显示驱动程序模型 (WDDM) 1.2 或更高驱动程序的\
  \ DirectX 9 图形设备，以及可用的 USB 2.0 或更高端口。\n*   Windows To Go 并不是为了取代桌面、笔记本电脑或平板等移动设备。它旨在支持短期的替代性工作场所场景。\n\
  *   Windows To Go 仅对参加微软软件保障计划的企业级客户可用。\n*   内部磁盘处于离线状态，以确保不会从 Windows To Go 设备访问数据。同样，如果向运行中的系统插入\
  \ Windows To Go 驱动器，默认情况下文件资源管理器不会列出该 Windows To Go 驱动器。\n*   无法使用受信任平台模块 (TPM)，因为\
  \ TPM 绑定到特定的计算机，而 Windows To Go 驱动器与多台计算机关联。\n*   Windows To Go 默认禁用休眠，尽管可以在组策略设置中进行更改。\n\
  *   Windows 恢复环境可用，刷新或重置也不可用。如果 Windows To Go 出现问题，应重新映像驱动器。\n*   除了 BIOS 中的 USB\
  \ 启动支持外，Windows To Go 驱动器上的 Windows 8.1 镜像必须处理器架构和固件类型兼容（32 位主机使用 32 位 Windows To\
  \ Go，在统一可扩展固件接口 [UEFI] BIOS 上使用 64 位 Windows To Go，以及在 64 位传统的 Legacy BIOS 上使用 32\
  \ 位 Windows To Go）。\n\nWindows To Go 还具有以下功能：\n\n*   商店应用可以在 Windows To Go 驱动器上的多个\
  \ PC 之间漫游。\n*   Windows To Go 将检测主机计算机上的所有硬件并安装必要的驱动程序。当在同一台计算机上再次使用 Windows To\
  \ Go 工作区时，它将识别出已使用过并自动加载正确的驱动程序集。\n*   管理员可以使用在企业中部署 Windows 的相同部署工具创建 Windows To\
  \ Go 驱动器，即 `DiskPart` 和部署映像和服务管理 (`DISM`) 工具。在创建映像时，确保包含你需要的所有内容，例如设备驱动程序、同步工具以及如果在公司网络之外使用的远程连接选项。\n\
  *   Windows To Go 最好在经过认证的 Windows To Go USB 驱动器上配置。驱动器必须是 USB 3.0 的，尽管它们可以在主机的\
  \ USB 2.0 端口中使用。\n\n### 考试提示\n\n确保你想要从 Windows To Go 使用的应用程序支持漫游。某些应用程序绑定到计算机硬件，因此无法在多个主机计算机上使用。\n\
  \nWindows To Go 还有一些组策略设置。你可以在 `计算机配置、管理模板、Windows 组件、移动操作系统` 中找到这些设置。图 5-18 显示了\
  \ `本地组策略编辑器` 中的内容。你可以启用或禁用这些设置来管理休眠选项和睡眠状态。要了解更多关于这些设置的信息，双击选项以查看帮助窗口中的相关信息。`允许启动\
  \ Windows Go 工作区时休眠 (S4)` 的帮助信息提供了：`指定从 Windows Go 工作区启动时是否可以使用休眠状态 (S4)`。它进一步解释说如果启用，计算机可以休眠；如果禁用，计算机无法休眠。\n\
  \n![Windows To Go 设置列在移动操作系统。](img/httpatomoreillycomsourcemspimages1989043.png.jpg)图\
  \ 5-18. Windows To Go 设置列在移动操作系统。\n\n在主机端，用户可以在开始屏幕搜索 **Windows To Go** 并点击更改 Windows\
  \ To Go 启动选项。从那里可以启用主机从 Windows To Go 工作区启动。注意图 5-19 对话框中的 Windows To Go 要求。\n\n\
  ![配置主机从 Windows To Go 工作区启动。](img/httpatomoreillycomsourcemspimages1989045.png.jpg)图\
  \ 5-19. 配置主机从 Windows To Go 工作区启动。\n\n要启动 Windows To Go 工作区，请插入 USB 驱动器并执行以下操作之一：\n\
  \n*   如果计算机已配置为从 USB 驱动器和 Windows To Go 工作区启动，用户只需重启或开启计算机。\n*   如果计算机未启用 USB 启动，用户可以重启计算机，按下所需的按键组合访问启动菜单（可能是\
  \ F12 或 F2），并在列表中选择 USB 驱动器。\n\n\n\n\n\n*   如果计算机已启动且操作系统可用，用户可以使用 PC 设置中的“高级启动”选项使用设备重启。你可以在“PC\
  \ 设置”>“更新和恢复”>“恢复”中找到该选项，如图图 5-20 所示。\n\n![PC 设置中的高级启动允许用户在计算机开启且可用时启动到 USB 驱动器。](img/httpatomoreillycomsourcemspimages1989047.png)图\
  \ 5-20. PC 设置中的高级启动允许用户在计算机开启且可用时启动到 USB 驱动器。\n\n## 更多信息：了解更多关于 Windows To Go 的信息\n\
  \n如需欲了解更多关于 Windows To Go 的信息，包括 Windows 安装与 Windows To Go 之间的差异、Windows To Go 如何进行漫游、如何为\
  \ Windows To Go 部署做准备以及硬件考虑因素，请参考 TechNet 上的本文：`[http://technet.microsoft.com/en-us/library/hh831833.aspx#BKMK_newblue]`。如需了解有关\
  \ Windows To Go 的最佳实践，请参考此处的：`[http://technet.microsoft.com/en-us/library/jj592681.aspx]`。\n\
  \n## 使用创建 Windows To Go 工作空间向导创建工作空间\n\n要在 USB 驱动器上创建 Windows To Go 工作空间，你必须通过“创建\
  \ Windows To Go 工作空间向导”。TechNet 上有一个视频展示了此操作的所有步骤（尽管它是在 Windows 8 机器上运行而非 Windows\
  \ 8.1），地址为 `[http://technet.microsoft.com/en-us/windows/dn127075.aspx]`。此处概述了基本步骤。\n\
  \n1. 在运行 Windows 8.1 企业版的计算机上挂载 Windows 8.1 安装文件或映像。\n2. 将经过认证的 Windows To Go 3.0\
  \ USB 闪盘插入可用的 USB 端口并启动“创建 Windows To Go 工作空间向导”。\n3. 按照向导执行以下操作：\n    1. 选择要使用的\
  \ USB 闪盘\n    2. 选择要使用的映像\n    3. 选择是否使用 `BitLocker` 和密码保护并加密驱动器，这是一个好主意，因为 USB\
  \ 驱动器很容易丢失或被盗\n    4. 选择是否现在立即启动到新的 Windows To Go 工作空间\n\n## 使用 Windows PowerShell\
  \ 创建工作空间\n\n你可以使用 `Windows PowerShell` 创建 Windows To Go 工作空间。虽然向导更容易使用，但如果你想自动化或自定义此过程，或者想同时创建多个工作空间，你将需要使用\
  \ `Windows PowerShell`。执行这些任务所需的脚本相当复杂，包含了为闪盘准备系统分区和 Windows 分区，并分配驱动器号。你必须使用可用的\
  \ `DISM` 工具应用映像。你可以使用 `bcdboot` 命令为 UEFI 和 BIOS 安装相应的启动文件。虽然其中涉及许多步骤，但在企业环境中是值得付出的。你可以在此处查看\
  \ Windows PowerShell 脚本示例：`[http://technet.microsoft.com/en-us/library/jj721578.aspx]`。\n\
  \n## 思考实验：如何最佳配置离线文件\n\n在这个思考实验中，请运用你对此目标所学的知识。你可以在本章末尾的“答案”部分找到这些问题的答案。\n\n你有一组用户，无论他们身在何都需要访问公司文件服务器存储的文件。你已经配置了`离线文件`来允许此操作。它运行良好，但当用户在使用计费连接或通过蜂窝网络漫游时，费用很高。你想减少——或者最好是消除——这些费用。所有用户都在运行\
  \ Windows 8.1。\n\n1. 你应该在`组策略`中启用`离线文件`的哪些功能，以帮助用户在使用具有使用限制的计费连接或在其他运营商的网络上漫游时，避免同步产生高昂的数据流量费用？\n\
  2. 你应该在`组策略`中启用`离线文件`的哪些功能，以便提供快速访问文件的同时，通过让用户在有连接的情况下离线工作来限制使用的带宽？\n3. 你还希望用户在连接非常慢且不在计费网络上时离线工作。你已经在`组策略`中为此配置了阈值。当达到此阈值时，用户需要做什么吗？\n\
  4. 如果你的服务器运行的是 Windows Server 2008 R2，你是否可以配置`离线文件`和这些设置？\n\n### 目标总结\n\n* `离线文件`和`工作文件夹`允许用户在未连接到网络时也能处理其个人文件。管理员可以通过`组策略`控制行为。\n\
  * 电源计划帮助用户管理电池寿命。管理员可以使用`Powercfg.exe`和`组策略`管理这些计划。\n* `Wi-Fi Direct` 允许用户在没有中继网络设备的情况下共享文件。目前，你只能使用`Netsh`创建连接。\n\
  * Windows To Go 允许用户使用包含操作系统的 USB 闪盘。\n\n## 目标复\n\n回答以下问题以测试你对该目标的掌握情况。你可以在此处找到答案以及每个选项正确或错误的解释。\n\
  \n**Q:1. 如何启用离线模式？**\n1. 使用`组策略`启用`透明缓存`。\n2. 使用`组策略`将延迟设置为 `1` 毫秒。\n3. 使用`组策略`将延迟设置为\
  \ `0` 毫秒。\n4. 打开`同步中心`并点击`离线文件`。\n\n**Q:2. 你需要导出在选项窗口中创建的电源计划。使用哪两个命令来实现？（选择所有项）**\n\
  1. `powercfg.exe –list`\n2. `powercfg.exe –export power.pow GUID (此处为计划的 GUID)`\n\
  3. `powercrg.exe –show all`\n4. `powercfg.exe –export GUID (此处为计划的 GUID)`\n\n**Q:3.\
  \ 用户在同步中心配置同步选项之前首先需要做什么？**\n1. 在`同步中心`中，点击`离线文件`然后点击`计划`来配置何时同步文件。\n2. 在`同步中心`中，点击`新建同步关系`并在右窗格中点击`新建同步关系`。\n\
  3. 在`同步中心`中，点击`管理离线文件`并在“常规”选项卡上点击`启用离线文件`。\n4. 导航到另一计算机或文件服务器上的共享，右键点击该共享并点击`始终离线`。\n\
  \n**Q:4. 管理员在何处强制用户设置工作文件夹？**\n1. `计算机配置\\策略\\管理模板\\Windows 组件\\工作文件夹`\n2. `用户配置\\\
  策略\\管理模板\\Windows 组件\\工作场所加入`\n3. `用户配置\\策略\\软件设置\\Windows 组件\\工作文件夹`\n4. `用户配置\\\
  策略\\管理模板\\共享文件夹`\n\n**Q:5. 以下哪项是 Windows To Go 的局限？**\n1. Windows To Go 仅适用于参加微软软件保证计划的企业客户。\n\
  2. 无法使用`TPM`，因为它绑定特定的计算机，而 Windows To Go 驱动器在多台计算机上使用。\n\n\n\n\n3. Windows 恢复环境可用，刷新或重置功能也不可用。如果\
  \ Windows To Go 有问题，则应该重新映像。\n4. 以上所有。\n\n## 目标 5.3：为移动设备配置安全性\n\n你可以防止在移动设备（或硬盘）丢失或被盗时数据不被访问。你也可以使用相同的技术来防止启动攻击，例如根内核程序（rootkits）。不过，还有其他方法可以保护设备，例如使用组策略、防止应用程序获取用户位置、加密数据、使用\
  \ VPN 等。在这里，你将只学习 BitLocker 和 BitLocker To Go 以及如何管理启动密钥。\n\n**本目标涵盖了如何操作：**\n\n\
  * 配置 BitLocker\n* 配置 BitLocker To Go\n* 配置启动密钥存储\n\n### 配置 BitLocker\n\n`BitLocker\
  \ 驱动器加密` 允许你加密整个硬盘和磁盘分区，包括 Windows 操作系统驱动器、用户文件和系统文件。这不是 EFS。`EFS` 加密用户文件；而 `BitLocker\
  \ 驱动器加密` 保护整个磁盘。你可以使用 `BitLocker` 保护运行 Windows 8.1 专业版、Windows 8.1 企业版和 Windows\
  \ Server 2012 的 32 位和 64 位计算机。在具有 `TPM` 版本 1.2 或 2.0 的计算机上，`BitLocker` 还可以确保只有在计算机的启动组件未被破坏（更改）且磁盘仍安装在原始计算机中，数据才能被访问。\n\
  \n### 考试提示\n\n你可以在部署操作系统之前启用 `BitLocker`。当你这样做时，可以选择仅加密已使用的磁盘空间或加密整个驱动器。\n\n当使用\
  \ `BitLocker` 时，你可以要求用户在想要使用驱动器时输入密码来解锁驱动器。然而，在具有兼容 `TPM` 的计算机上，也可以要求多因素身份验证——例如通过添加智能卡或带有启动密钥的\
  \ USB 驱动器。`BitLocker` 也可以通过 `Group Policy` 进行管理。例如，你可以要求在计算机用于存储数据之前启用 `BitLocker`。\n\
  \n### 考试提示\n\n运行 `BitLocker` 需要两个分区，因为启动前的身份验证和系统完整性确认必须在与加密驱动器单独的分区上进行。\n\n你需要在\
  \ `TechNet` 上尽可能多地阅读关于 `BitLocker` 的内容，因为这里没有空间讨论一切。这里只列出了最基础的信息。参考 `[http://technet.microsoft.com/en-us/library/hh831507.aspx#BKMK_Overview]`\
  \ 了解更多以下信息：\n\n* **硬件和软件的要求**。这包括 `TPM` 版本、`BIOS` 配置、固件要求、驱动器大小等。\n\n* **如何判断你的计算机是否具有\
  \ TPM**。管理员可能会选择在`运行`对话框中输入 `TPM.msc` 并按回车。用户可能会选择访问`控制面板`、`所有项目`，打开 `BitLocker\
  \ 驱动器加密` 并查看是否可以打开 `BitLocker`。如果没有找到 `TPM`，你将需要设置所需的组策略：`在启动时需要额外的身份验证 (Require\
  \ Additional Authentication At Startup)`，它位于`计算机配置`、`管理模板`、`Windows 组件`、`BitLocker\
  \ 驱动器加密`、`操作系统驱动器`。你必须启用此项，然后勾选`允许没有兼容 TPM 的使用 BitLocker (Allow BitLocker Without\
  \ A Compatible TPM)` 框。查看图 5-21。\n\n    ![如果计算机没有兼容的 TPM，选择在组策略中要求额外的身份验证。](img/0atomoreillycomsourcemspimages1989049.png.jpg)图\
  \ 5-21. 如果计算机没有兼容的 TPM，选择在在组策略中要求额外的身份验证。\n\n    #### 考试提示\n\n    只有当 `BIOS` 或 `UEFI`\
  \ 固件具有在启动环境中从 USB 闪存器读取的能力，你才能在没有兼容 `TPM` 的操作系统驱动器上启用 `BitLocker`。这是因为 `BitLocker`\
  \ 需要一个启动密钥。但是，如果你这样做，你将无法利用启动前的系统完整性验证或多因素身份验证。\n\n* **配置 BitLocker 需要哪些凭据**。只有管理员可以管理固定数据驱动器，但标准用户可以管理可移动数据驱动器（后者可以在\
  \ `组策略` 中禁用）。标准用户还可以更改他们通过 `BitLocker` 访问的操作系统驱动器上的 `PIN` 或密码。\n\n* **如何在企业中自动化\
  \ BitLocker 部署**。一种方法是使用命令行工具 `Manage-bde.exe`。你在工作中可能使用的 `Manage-bde` 命令行工具将在本节后面的部分详细介绍。还有其他方法，包括使用\
  \ `Windows 管理规范 (WMI)` 和 `Windows PowerShell` 脚本。\n\n* **BitLocker 可能在恢复模式启动的原因**。包括禁用\
  \ `TPM`、更改 `TPM` 固件、更改主引导记录等。\n\n* **如何管理恢复密钥**。恢复密钥让你在 `BitLocker` 不允许访问时访问计算机。有许多方法存储这些固定驱动器的密钥，包括将它们保存到文件夹或你的\
  \ `Microsoft 账户`中。\n\n#### 从控制面板配置 BitLocker\n\n在配置 `BitLocker` 之前，还有几点需要知道。第一次启用\
  \ `BitLocker` 时，将提示创建一个启动密钥。这是用于加密和解密驱动器的。启动密钥可以存储在 USB 驱动器或 `TPM` 中。如果你选择 USB，则每次访问计算机时都需要插入该\
  \ USB 驱动器。如果使用了兼容的 `TPM`，密钥检索是自动的。你也可以选择 `PIN`。这只有在启用 `BitLocker` 后才能创建。如果你丢失了启动密钥，将需要使用恢复密钥解锁驱动器。这是一个\
  \ 48 位数字，可以存储在多种位置，包括 USB 驱动器。\n\n使用 `BitLocker` 加密数据的五种身份验证方法，由 `TPM`、启动 `PIN`\
  \ 和启动密钥的各种组合组成。以下是这些选项的摘要：\n\n* **TPM + 启动 PIN + 启动密钥** 最安全，但需要三次身份验证。加密密钥存储在 `TPM`\
  \ 上上，但管理员必须输入 `PIN` 并插入启动密钥（位于 USB 驱动器）。\n\n* **TPM + 启动密钥**。加密密钥存储在 `TPM` 上，管理员必须插入包含启动密钥的\
  \ USB 闪存器。\n\n* **TPM + 启动 PIN**。加密密钥存储在 `TPM` 上，管理员必须输入 `PIN`。\n\n* **仅启动密钥**。管理员必须插入带有启动密钥的\
  \ USB 闪存器。计算机不需要具有 `TPM` 芯片。`BIOS` 必须在操作系统加载之前支持访问 USB 闪存器。\n\n* **仅 TPM**。加密密钥存储在\
  \ `TPM` 上，不需要管理员登录。`TPM` 要求启动环境未被修改或破坏。\n\n此外，包含操作系统的驱动器 必须有两个分区：系统分区和操作系统分区，这两个分区都必须格式化为\
  \ `NTFS`。\n\n要在 Windows 8.1 计算机上配置 `BitLocker` 并加密操作系统驱动器，请按照以下步骤操作：\n\n1. 打开`控制面板`，将视图更改为`小图标`或`大图标`，并点击\
  \ `BitLocker 驱动器加密`。\n\n\n\n\n2. 点击“启用 BitLocker”。如果收到未找到可用 TPM 芯片的错误提示，请启用所需的组策略设置。参见上文的图\
  \ 5-20。\n\n3. 选择在启动时如何解锁你的驱动器；在本例中，我们将选择`输入密码`。参见图 5-22。\n\n![在固定驱动器上启用 BitLocker。](img/httpatomoreillycomsourcemspimages1989051.png.jpg)图\
  \ 5-22. 在固定驱动器上启用 BitLocker。\n\n4. 输入密码，再次输入以确认，然后点击“下一步”。\n\n5. 选择保存密码的方式；我们将选择`保存到你的\
  \ Microsoft 账户`。点击“下一步”。在此情况下，你可以在继续后续操作之前再次执行此步骤以进行二次备份。）\n\n6. 选择加密已用空间或整个驱动器。点击“下一步”。\n\
  \n7. 保持勾选`运行 BitLocker 系统检查`并点击“继续”。\n\n8. 点击“立即重启”。如果出现提示，请执行任何最终任务（例如从驱动器插槽中移除\
  \ CD 或 DVD），如果有必要，再次点击“立即重启”。\n\n9. 启动时，输入或提供启动密钥。\n\n10. 注意桌面任务栏中的弹出通知，它显示加密正在进行。这需要一些时间才能完成。\n\
  \n返回控制面板并查看 BitLocker 窗口。请注意，从那里你可以执行其他任务，包括备份恢复密钥、更改密码、删除密码以及关闭 BitLocker。你可以通过选项旁边的图标判断哪些操作需要管理员批准。参见图\
  \ 5-23。\n\n![一旦启用了 BitLocker，你就可以对其进行配置。](img/httpatomoreillycomsourcemspimages1989053.png.jpg)图\
  \ 5-23. 一旦启用了 BitLocker，你就可以对其进行配置。\n\n### 考试提示\n\n我们不确定在考试中会看到多少关于 BitLocker 和\
  \ BitLocker To Go 可用组策略设置的问题。然而，有患胜于无然。请确保至少在组策略编辑器控制台中扫描此处的可用选项：计算机配置、管理模板、Windows\
  \ 组件、BitLocker 驱动器加密。这里有三个文件夹（固定数据驱动器、操作系统驱动器和可移动数据驱动器），当选择 BitLocker 驱动器加密容器时，还会发现几个独立选项。\n\
  \n### 使用 Manage-BDE 配置 BitLocker\n\n你不一定需要使用控制面板来管理 BitLocker 驱动器加密。你可以从命令行进行操作。你可以使用的几个命令可以开启或关闭\
  \ BitLocker、指定解锁机制、更新恢复方法以及解锁受 BitLocker 保护的数据驱动器。这些命令中的许多用于大型企业，不适用于本目标；但是，在使用\
  \ `Manage-BDE` 命令时可能会使用几个参数，包括但不限于以下：\n\n* `–status`。使用此参数提供有关连接驱动器的信息，包括它们的 BitLocker\
  \ 状态、大小、BitLocker 版本、密钥保护器、锁定状态等。\n* `--on`。此参数加密驱动器并启用 BitLocker，跟在 `--on` 参数后的如\
  \ `C` 等驱动器号使用。\n* `--off`。此参数解密并关闭 BitLocker，跟在 `--off` 参数后的如 `C` 等驱动器号使用。\n* `--pause`\
  \ 和 `–resume`。使用 `–pause` 配合驱动器号暂停加密；使用 `–resume` 配合驱动器号恢复加密。\n* `--lock` 和 `–unlock`。使用这些参数锁定和解锁驱动器，配合驱动器号。\n\
  * `--changepin`。此参数更改 BitLocker 保护驱动器的 PIN 码。\n* `--recoverypassword`。使用此参数添加数字密码保护器。\n\
  * `--recoverykey`。此参数为恢复添加外部密钥保护器。\n* `--password`。使用此参数添加密码密钥保护器。\n\n### 考试提示\n\
  \n参考 TechNet 上的此文章以查看所有可用参数：*[`technet.microsoft.com/en-us/library/dd875513(v=WS.10).aspx`](http://technet.microsoft.com/en-us/library/dd875513(v=WS.10).aspx)*。你也可以在命令提示符中输入\
  \ `manage-bde /?` 在自己的电脑上查看列表。\n\n### 配置 BitLocker To Go\n\nBitLocker To Go 允许你使用\
  \ BitLocker 驱动器加密保护可移动 USB 设备。这些设备可以是闪存器、数字存储 (SD) 卡或格式化为 NTFS、FAT、FAT32 或 exFat\
  \ 的移动硬盘。\n\n创建 BitLocker To Go 的过程与加密固定磁盘的过程相似。只需插入 USB，打开控制面板并进入 BitLocker 窗口。在“可移动数据驱动器\
  \ – BitLocker To Go”（参见图 5-24）下完成设置过程。\n\n![在控制面板的 BitLocker 窗口中配置 BitLocker To\
  \ Go。](img/httpatomoreillycomsourcemspimages1989055.png.jpg)图 5-24. 在控制面板的 BitLocker\
  \ 窗口中配置 BitLocker To Go。\n\n如前面的考试提示所示，你应该熟悉 BitLocker 和 BitLocker To Go 的可用组策略设置。你可以在组策略编辑器的计算机配置、管理模板、Windows\
  \ 组件、BitLocker 驱动器加密中找到它们。BitLocker To Go 选项位于可移动数据驱动器。下面简要列出了这八项：\n\n* `Control\
  \ Use Of BitLocker On Removable Drives`。此选项定义用户是否可以在可移动驱动器上添加或删除 BitLocker 加密。\n\
  * `Configure Use Of Smart Cards On Removable Drives`。此选项定义访问加密驱动器是否需要智能卡。\n* `Deny\
  \ Write Access To Removable Drives Not Protected By BitLocker`。此设置阻止向未加密的可移动驱动器写入数据。\n\
  * `Configure Use Of Hardware-Based Encryption For Removable Data Drives`。此选项定义了在不支持硬件加密的计算机上是否可以使用\
  \ BitLocker 软件加密。\n* `Enforce Drive Encryption Type Of Removable Drives`。此选项定义了可移动驱动器必须使用的特定加密类型：全加密或仅可用空间加密。（此选项在\
  \ Windows 8.1 中引入，因此考试中可能会出现。）\n* `Allow Access To BitLocker-Protected Removable\
  \ Data Drives From Earlier Versions Of Windows`。此设置定义了 FAT 格式的可移动 BitLocker 驱动器是否可以从旧版本的\
  \ Windows 访问。\n* `Configure Use Of Passwords For Removable Data Drives`。此设置定义了可移动驱动器是否受密码保护。\n\
  * `Choose How BitLocker-Protected Removable Drives Can Be Recovered`。此选项定义可以使用恢复代理（DRA）访问可移动\
  \ BitLocker 驱动器上的数据。DRA 是管理员授权恢复组织内 BitLocker 驱动器的用户账户。默认情况下，域管理员是 DRA。\n\n### 配置启动密钥存储\n\
  \n\n\n\n\n本目标涵盖了如何配置启动密钥存储。然而，为了理解什么是启动密钥，你必须先了解它不是什么。有几个密钥管理术语需要处理：\n\n*   `TPM\
  \ owner password`（TPM 所有者密码）。在配合 `BitLocker 驱动器加密` 使用它之前，你必须初始化 `TPM`。当你执行此操作时，会创建一个仅与\
  \ `TPM` 关联的 `TPM 所有者密码`。当你需要启用或禁用 `TPM` 或重置 `TPM` 锁定时，你需要提供 `TPM 所有者密码`。\n*   `recovery\
  \ password and recovery key`（恢复密码和恢复密钥）。当你第一次设置 `BitLocker` 时，系统会提示你配置访问被拒绝时如何访问受\
  \ `BitLocker` 保护的驱动器。这涉及创建一个 `recovery key`。如果 `TPM` 无法验证启动组件，你将需要 `recovery key`，但大多数情况下，访问\
  \ `BitLocker` 驱动器的失败是因为最终用户忘记了 PIN 或密码。\n*   `password`（密码）。密码用于保护固定、可移动和操作系统驱动器。它也可以用于没有\
  \ `TPM` 的操作系统驱动器。密码可以由 8 到 255 个字符组成，如“配置对操作系统驱动器使用密码”、“配置对移动数据驱动器使用密码”和“配置对固定数据驱动器使用密码”组策略设置指定的。\n\
  *   `PIN and enhanced PIN`（PIN 和增强型 PIN）。如果你使用 `TPM`，可以为 `BitLocker` 配置一个 `PIN`，用户必须输入该\
  \ PIN 才能访问计算机。`PIN` 可以由 4 到 20 位数字组成，如“配置启动所需的最小 PIN 长度”组策略设置指定的。“增强型 PIN”除了数字集外还使用全键盘字符集，以允许更多可能的\
  \ PIN 组合。在向驱动器添加 `PIN` 之前，你必须启用“允许启动使用增强型 PIN”组策略设置。\n*   `startup key`（启动密钥）。你使用存储在\
  \ `USB flash drive`（USB 闪存驱动）上的启动密钥，无论是否有 `TPM`。每次计算机启动时必须插入 `USB flash drive`。`USB\
  \ flash drive` 必须使用 `NTFS`、`FAT` 或 `FAT32` 文件系统格式化。\n\n现在你已经知道什么是启动密钥了，可以将计算机的启动密钥保存在\
  \ `USB flash drive` 上。右键点击受 `BitLocker` 保护的驱动器开始操作，然后按照提示操作。\n\n### 考试贴士\n\n`BitLocker\
  \ Network Unlock`（BitLocker 网络解锁）使得在域中管理启用 `BitLocker` 的 `TPM + PIN` 工作站和服务器变得更容易。`Network\
  \ Unlock` 允许连接域的计算机重启时跳过 `PIN` 输入提示。计算机将使用 `Windows Deployment Services` 服务器提供的信任密钥作为其次要验证方法自动解锁。\n\
  \n### 思考实验：选择 BitLocker 选项\n\n在这个思考实验中，应用你从本目标中学到的知识。你可以在本章末的“答案”部分找到这些问题的答案。\n\n\
  一个客户想在她的笔记本电脑上启用 `BitLocker`，并打电话让你帮你设置。她希望在计算机被盗或硬盘被拆卸时保护计算机上的数据。你需要找出是否有兼容的 `TPM`\
  \ 芯片，如果没有，则配置计算机以便 `BitLocker` 能够有效使用。\n\n1.  在 `Run`（运行）框中输入什么可以查看计算机上是否有兼容的 `TPM`？\n\
  2.  如果没有找到 `TPM`，你需要在计算机的 `Local Group Policy`（本地组策略）中更改哪项策略？\n3.  如果没有找到 `TPM`，关于\
  \ `BIOS` 或 `UEFI` 固件必须满足什么条件？\n4.  如果找到了 `TPM`，启动期间应用的最安全的验证选项是什么？\n\n### 目标总结\n\
  \n*   `BitLocker` 和 `BitLocker To Go` 可保护移动设备和移动驱动器免受盗窃、丢失或黑客攻击。\n*   你需要仔细管理 `startup\
  \ keys`、`recovery keys` 以及与 `BitLocker 驱动器加密` 相关的项目，以便在驱动器被破解或用户忘记 PIN 或密码时你能够重新进入驱动器。\n\
  *   命令行工具 `Manage-bde` 结合相应的参数，允许你从命令行管理 `BitLocker`。\n\n### 目标回顾\n\n回答以下问题以测试你对本目标信息的掌握情况。你可以在本章末的“答案”部分找到这些问题的答案以及每个选项选项正确或错误的解释。\n\
