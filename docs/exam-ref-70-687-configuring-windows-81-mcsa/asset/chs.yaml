  3. **错误**：这不是将硬盘区域添加到索引的方法。此外，索引整个根驱动器并不是好主意。\n4. **正确**：在 `Indexing Options`（索引选项）对话框中，点击\
  \ `Advanced`。从那里点击 `File Types`（文件类型）选项卡。在那里添加要索引的文件类型。\n\n3. **正确答案：E**\n1. **错误**：`Application`\
