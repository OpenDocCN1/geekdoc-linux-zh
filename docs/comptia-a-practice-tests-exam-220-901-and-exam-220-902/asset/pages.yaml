  md: 'usually make the customer feel better, as you are giving them an option in
    choosing a solution.


    +   **87**. C. When formatting a hard drive, you can usually choose between a
    quick format or a full format. With a quick format, a new file table is created
    on the hard disk, but files are not fully overwritten or erased from the hard
    disk. Someone with data recovery software could easily access the data. A full
    format removes old files, creates a new file allocation table, and scans the hard
    drive for bad sectors.


    +   **88**. B. When synchronizing with a desktop, both the iOS and the desktop
    authenticate each other. This two-way authentication is called *mutual authentication*,
    and it lets multiple services on the iOS device communicate with the appropriate
    services on the desktop.


    +   **89**. C, D. Social engineering is a process in which an attacker attempts
    to acquire information about your network and system by social means, such as
    talking to people in the organization. When this is done via email or instant
    messaging, it’s called *phishing*. Phishing attempts that appear to come from
    a trusted source are called *spear phishing*. Another form of social engineering
    is known as *shoulder surfing*, and it involves nothing more than watching someone
    when they enter their sensitive data.


    +   **90**. A, C. If an OS update fails, it could be a configuration issue or
