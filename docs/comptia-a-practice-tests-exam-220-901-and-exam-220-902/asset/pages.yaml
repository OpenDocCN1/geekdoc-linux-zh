  md: '# 5.4 Demonstrate proper communication techniques and professionalism


    +   * Use proper language – avoid jargon, acronyms and slang when applicable

    +   * Maintain a positive attitude/project confidence

    +   * Actively listen (taking notes) and avoid interrupting the customer

    +   * Be culturally sensitive: use appropriate professional titles, when applicable

    +   * Be on time (if late contact the customer)

    +   * Avoid distractions: personal calls; texting/social media sites; talking
    to co-workers while interacting with customers; personal interruptions

    +   * Dealing with difficult customer or situation: do not argue with customers
    and/or be defensive; avoid dismissing customer problems; avoid being judgmental;
    clarify customer statements (ask open-ended questions to narrow the scope of the
    problem, restate the issue or question to verify understanding); do not disclose
    experiences via social media outlets

    +   * Set and meet expectations/timeline and communicate status with the customer:
    offer different repair/replacement options if applicable; provide proper documentation
    on the services provided; follow up with customer/user at a later date to verify
    satisfaction

    +   * Deal appropriately with customers confidential and private materials: located
    on a computer, desktop, printer, etc.


    # 5.5 Given a scenario, explain the troubleshooting theory


    +   * Always consider corporate policies, procedures and impacts before implementing
    changes.

    +   * Identify the problem: question the user and identify user changes to computer
    and perform backups before making changes

    +   * Establish a theory of probable cause (question the obvious): if necessary,
    conduct external or internal research based on symptoms'
