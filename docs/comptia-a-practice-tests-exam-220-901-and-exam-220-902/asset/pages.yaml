  md: '# # Acknowledgments


    Writing a book about the A+ exam is never an easy feat. There are dozens of people
    involved in the process. I will try to name as many as I can, but I apologize
    in advance if I forgot anyone.


    Thanks to Kenyon Brown, who had the wonderful idea for this book and was kind
    enough to ask me to be involved. I also owe a great deal of thanks to Emmett Dulaney
    and Toby Skandier, my partners on the Sybex *A+ Complete Study Guide*, for their
    hard work and dedication. Troy McMillan was the technical editor, and I appreciate
    him telling me when I’m wrong. Kelly Talbot kept the project running smoothly,
    and the copyeditor, proofreader, indexer, compositor, and entire team at Sybex
    were invaluable. Without their great contributions, this book would not have been
    possible.


    On a personal level, I need to thank my wonderful wife, Kara, for her love and
    unconditional support. I am truly blessed! I also need to thank my girls for their
    understanding—things have been a bit crazy lately. Finally, I need to thank my
    late grandpa Joe. He taught me about computers and so much more, and his lessons
    will always be a part of me.'
