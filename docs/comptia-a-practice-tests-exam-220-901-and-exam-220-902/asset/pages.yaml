  md: 'order to continue. Rather than opening a standard command prompt, choose Start
    \u25b8 All Programs \u25b8 Accessories; then right-click Command Prompt and choose
    Run As Administrator. The UAC will prompt you to continue, and then you can run
    SFC without a problem.


    +   82. C. The Windows Event Viewer utility provides information about what''s
    been going on with the whole system to help you troubleshoot problems. Event Viewer
    shows warnings, error messages, and records of things that have happened successfully.
    It''s found in all current versions of Windows. The three most commonly referenced
    logs are Security (which includes information about logins), System, and Application.


    +   83. A. The user needs at least Read & Execute access to be able to run programs,
    and Write will allow him to make changes to files. Neither will allow him to delete
    files. Modify and Full Control will allow everything he needs as well, but Modify
    allows him to delete files (or the folder), and Full Control also gives him the
    ability to take ownership and assign permissions to others.


    +   84. D. A community cloud is created when multiple organizations with common
    interests combine to create a cloud. In a sense, it''s like a public cloud with
    better security. The clients know who the other clients are and, in theory, can
    trust them more than they could trust random people on the Internet. The economies
    of scale and flexibility won''t be as great as with a public cloud, but that''s
    the trade-off for better security.


    +   85. A. Windows 7 incorporates Windows Firewall, which can be used to stop
    incoming and outgoing network traffic. Traffic is allowed or denied by specific
    rules that are part of an access control list (ACL). By default, Windows Firewall
    blocks incoming traffic. By creating exceptions, you can configure what incoming
    traffic you want to allow through.


    +   86. B. Set and meet—or exceed—expectations and communicate timelines and status.
    Customers want to know what is going on. In addition, offering different repair
    or replacement options will'
