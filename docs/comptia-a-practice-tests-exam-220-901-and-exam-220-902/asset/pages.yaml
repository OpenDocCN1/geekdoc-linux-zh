- pgno: 12
  md: '# Introduction


    If you''re picking up this book, there''s a good chance that you want to pass
    the CompTIA A+ exam. It means that you''re likely either an IT professional looking
    for certifications or someone who has a bit of computer knowledge and wants to
    start an IT career. The A+ exam was the first certification test I passed, and
    the knowledge I gained from studying for it still helps me more than 20 years
    later, even though much has changed.


    While I''m confident that if you can answer all the questions in this book, you
    can pass the exam, I encourage you to go beyond memorizing questions and answers.
    One reason is that the questions on the actual exams will be different than the
    ones written for this book. Another (better) reason is that life isn''t a multiple-choice
    exam. When you''re in the field and trying to fix a computer, you won''t have
    the answers given to you—you need to have a solid base of knowledge to work from.


    CompTIA A+ Practice Tests, combined with the Sybex CompTIA A+ Complete Study Guide
    (both the Standard and Deluxe Editions), will help give you the foundation you
    need to pass the exams. Study them well, and they will also give you the tools
    you need to navigate a myriad of technical topics and make you more valuable to
    prospective employers.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# What Is A+ Certification?


    The A+ certification program was developed by the Computing Technology Industry
    Association (CompTIA) to provide an industry-wide means of certifying the competency
    of computer service technicians. The A+ certification is granted to those who
    have attained the level of knowledge and troubleshooting skills that are needed
    to provide capable support in the field of personal computers and mobile devices.
    It is similar to other certifications in the computer industry, such as the Cisco
    Certified Network Associate (CCNA) program and the Microsoft certification programs.
    The theory behind these certifications is that if you need to have service performed
    on any of their products, you would prefer to use a technician who has been certified
    in one of the appropriate certification programs rather than just the first “expert”
    that pops up in a Google search. The difference with A+ is that it’s an industry-wide
    certification and vendor agnostic. That means by passing it, you’re capable of
    handling different issues regardless of software or hardware vendor.


    Everyone must take and pass two exams: 220-901 and 220-902. You don’t have to
    take the 220-901 exam and the 220-902 exam at the same time, but the A+ certification
    isn’t awarded until you’ve passed both tests.


    Tests are administered by CompTIA’s global testing partner, Pearson VUE. For more
    information on taking the exam, visit the CompTIA website at [www.comptia.org](http://www.comptia.org).
    You can also visit Pearson VUE at [www.pearsonvue.com](http://www.pearsonvue.com).'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Who Should Buy This Book?


    If you want to pass the A+ exam, this book is definitely for you. The nature of
    this book is an exam prep book. If you’re an experienced computer professional,
    a book like this may be all you need to pass the exam.


    However, a book of exam questions isn’t designed to give you all the background
    you need to truly understand the basics of personal computers and mobile devices.
    If you’re newer to the industry, I encourage you to buy a study guide as well,
    such as the Sybex CompTIA A+ Complete Study Guide. The study guide will provide
    more depth and context to help you acquire the skills and knowledge you need to
    be successful. This book then becomes a great companion as you prepare to take
    the exam.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# How to Use This Book and the Interactive Online Learning Environment and
    Test Bank


    This book includes 1,200 practice test questions, which will help you get ready
    to pass the A+ exam. The interactive online learning environment that accompanies
    the CompTIA A+ Practice Tests provides a robust test bank to help you prepare
    for the certification exams and increase your chances of passing them the first
    time! By using this test bank, you can identify weak areas up front and then develop
    a solid studying strategy using each of these testing features.


    The test bank also offers two practice exams. Take these practice exams just as
    if you were taking the actual exam (without any reference material). When you’ve
    finished the first exam, move on to the next one to solidify your test-taking
    skills. If you get more than 90 percent of the answers correct, you’re ready to
    take the certification exams.


    > NOTE You can access the Sybex interactive online test bank at http://www.wiley.com/go/Sybextestprep.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Tips for Taking the A+ Exams


    Here are some general tips for taking your exams successfully:


    +   Bring two forms of ID with you. One must be a photo ID, such as a driver''s
    license. The other can be a major credit card or a passport. Both forms must include
    a signature.


    +   Arrive early at the exam center so you can relax and review your study materials,
    particularly tables and lists of exam-related information.


    +   Read the questions carefully. Don''t be tempted to jump to an early conclusion.
    Make sure you know exactly what the question is asking.


    +   Don''t leave any unanswered questions. Unanswered questions are scored against
    you.


    +   There will be questions with multiple correct responses. When there is more
    than one correct answer, a message at the bottom of the screen will prompt you
    to either “Choose two” or “Choose all that apply.” Be sure to read the messages
    displayed to know how many correct answers you must choose.


    +   When answering multiple-choice questions you''re not sure about, use a process
    of elimination to get rid of the obviously incorrect answers first. Doing so will
    improve your odds if you need to make an educated guess.


    +   On form-based tests (nonadaptive), because the hard questions will eat up
    the most time, save them for last. You can move forward and backward through the
    exam.


    +   For the latest pricing on the exams and updates to the registration procedures,
    visit CompTIA''s website at www.comptia.org.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Exam Objectives


    CompTIA goes to great lengths to ensure that its certification programs accurately
    reflect the IT industry’s best practices. The company does this by establishing
    Cornerstone Committees for each of its exam programs. Each committee comprises
    a small group of IT professionals, training providers, and publishers who are
    responsible for establishing the exam’s baseline competency level and who determine
    the appropriate target audience level.


    Once these factors are determined, CompTIA shares this information with a group
    of hand-selected subject-matter experts (SMEs). These folks are the true brainpower
    behind the certification program. They review the committee’s findings, refine
    them, and shape them into the objectives you see before you. CompTIA calls this
    process a Job Task Analysis (JTA).


    Finally, CompTIA conducts a survey to ensure that the objectives and weightings
    truly reflect the job requirements. Only then can the SMEs go to work writing
    the hundreds of questions needed for the exam. And, in many cases, they have to
    go back to the drawing board for further refinements before the exam is ready
    to go live in its final state. So, rest assured, the content you’re about to learn
    will serve you long after you take the exam.'
  merge: -1
  img_proc: true
