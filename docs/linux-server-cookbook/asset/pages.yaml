- pgno: 280
  md: "and used services during the last decades. Another popular solution is **dnsmasq**,\
    \ which is a lightweight DNS, TFTP, and DHCP server.\n\nThe installation of ISC-DHCPd\
    \ on distributions based on DEB packages requires to install the package **isc-dhcp-server**\
    \ and **isc-dhcp-client** (for the client utilities). On distributions based on\
    \ RPM packages, the names are **dhcp-server** and **dhcp-client**. The main configuration\
    \ for the service is the file /etc/dhcp/dhcpd.conf for IPv4 and /etc/dhcp/dhcpd6.conf\
    \ for IPv6. The files contain global configurations, subnet definitions, host\
    \ configurations, and other configurations, such as classes, pools, and **shared-network**\
    \ declarations that are not covered in this book. The global configuration are\
    \ lines ending with a semicolon and defines different options, as observed in\
    \ the following excerpt from the default configuration:\n\n```\n`# option definitions\
    \ common to all supported networks...\noption domain-name \"example.org\";\noption\
    \ domain-name-servers ns1.example.org, ns2.example.org;\ndefault-lease-time 600;\n\
    max-lease-time 7200;`\n```\n\nFor the subnet definition, it will indicate the\
    \ subnet and the netmask, and the specific configuration for that subnet, between\
    \ curly brackets ({}). In the following example for the subnet **192.168.100.0/24**,\
    \ 25 IP addresses would be available, the DNS server would be **1.1.1.1**, and\
    \ the gateway **192.168.100.1**, among other options:\n\n```\n`subnet 192.168.100.0\
    \ netmask 255.255.255.0 {\n    range 192.168.100.25 192.168.100.50;\n    option\
    \ domain-name-servers 1.1.1.1;\n    option domain-name \"mycompany.com\";\n  \
    \  option subnet-mask 255.255.255.0;\n    option routers 192.168.100.1;\n    option\
    \ broadcast-address 192.168.100.254;\n    default-lease-time 600;\n    max-lease-time\
    \ 7200;\n}`\n```\n\nIt is possible to specify specific parameters for one client.\
    \ For that, the keyword **host** is used, followed by a label and the options\
    \ desired, as the following excerpt shows:\n\n```\n`host rhelysystem {\n    hardware\
    \ ethernet 52:54:00:57:d0:9f;\n    fixed-address 192.168.100.222;\n}`\n```"
