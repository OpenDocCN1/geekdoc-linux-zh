    via 192.168.122.11 dev enp1s0 |

    | Ubuntu’s netplan configuration | network: | ethernets: | enp1s0: | dhcp4: true
    | routes: | - to: 192.168.10.0/24 | via: 192.168.122.10 | - to: 192.168.11.0/24
    | via: 192.168.122.11 | version: 2 |

