    # Command apt-get, apt-cache, and apt-file


    These three commands work with the repositories configured in the file /etc/apt/sources.list
    or in the files configured inside /etc/apt/sources.list.d/. A repository file
    contains a list of repositories, and each repository specifies if it is for binary
    packages (deb) or for the source (deb-src), as well as the address of the repository,
    the distribution version, and the type of the software in this repository; (main
    for free software, restricted for non-free software. The context of the word free
    where is related to open source and not about cost). An example of repositories
    entries are shown for a Ubuntu Server with the codename for the distribution called
    jammy:


    ```

    deb http://es.archive.ubuntu.com/ubuntu jammy main restricted

    deb http://es.archive.ubuntu.com/ubuntu jammy-updates main restricted

    ```


    The command apt-get is used to install, update or remove software using a software
