    There are two types of processes on Linux:


    +   * **Foreground  processes:** this process interacts with the user who invoked
    it. This process would interact using the *standard input*, *standard output*,
    or *standard error*. Meantime the process running the *shell* used would not accept
    other commands.

    +   * **Background  processes:** this process does not interact with the user
    and usually are executed by the system. As the user is possible to run a background
    process, the *shell* will allow the user to execute other commands.


    A process running is accepting signal interruptions. The common ones are shown
    in *Table 5.21*:


