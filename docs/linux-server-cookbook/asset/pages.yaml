  md: "```\nagonzalez@ansible:~/playbooks$ ansible-playbook playbook2.yaml --start-at-task\
    \ \"5\nhow a message\" --extra-vars firstname=John\n\nPLAY [Variable examples]\n\
    ===================================================================\n\nTASK [Show\
    \ a message]\n===================================================================\n\
    ok: [localhost] => {\n    \"msg\": \"Your name is John\"\n}\n\nPLAY RECAP\n===================================================================\n\
    localhost                  : ok=1    changed=0    unreachable=0    failed=0\n\
    sk\nipped=0    rescued=0    ignored=0\n```\n\n*Figure 12.25: Output example using\
    \ extra variables*\n\n# Variable precedence\n\nAs described previously, a *variable*\
    \ can be defined in many different places. If a variable is defined in different\
    \ places, *Ansible* will use the definition with higher-order precedence. When\
    \ writing a *Playbook* it is important to define the name of the variables correctly,\
    \ to avoid accidentally variable overriding. For example, a variable named **port**\
    \ is a bad option. If we are defining the port for one application, then it is\
    \ recommended to prefix it with the name of the application, such as **httpd_port**.\
    \ The following list shows the order of precedence from least to greatest (the\
    \ last listed variables override all other variables):\n\n+   1. Command line\
    \ values (for example, `-u my_user`, these are not variables)\n\n+   2. Role defaults\
    \ (defined in `role/defaults/main.yml`)\n\n+   3. Inventory file group vars\n\n\
    +       a. inventory **group_vars/all**\n\n+       b. inventory **group_vars/\\\
