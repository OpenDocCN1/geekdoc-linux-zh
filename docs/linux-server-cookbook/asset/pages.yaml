- pgno: 249
  md: '# Firewall configuration on Linux


    One of the common tasks performed during the installation is to configure the
    Firewall. The considerations to have a secured firewall configuration are as follows:


    +   - Block by default; if there is not a specific rule, then the connection should
    be rejected.

    +   - Open only the ports needed for the services and specify the protocol for
    those ports.

    +   - Limit the connection from specific IPv4 or Ipv6 addresses.

    +   - Apply the rules to specific network interfaces in the system.

    +   - Limit the rate of the connections to avoid attacks.

    +   - Automate firewall rules with an automation solution (for example, Ansible).


    # Firewalld


    Firewalld provides a dynamically managed firewall with zones that define the trust
    level of network connections or interfaces. A big benefit of the usage of firewalld,
    is the possibility to perform changes in the rules without having to restart the
    service. It uses **Desktop Bus (D-Bus)** as a message bus system, a simple way
    for applications to talk to each other. Firewalld has different support for several
    backends. *Figure 8.2* illustrates the structure:'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_250_0.png)


    *Figure 8.2: Firewalld structure. Source: firewalld*


    The command `firewall-cmd` communicates with the service `firewalld` to operate
    with rules and zones. The service will use the backend defined, by default `nft`,
    to configure the rules indicated.


    The default configuration file for `firewalld` is located on `/etc/firewalld/firewalld.conf`.
    The following code contains an example of the default configuration values:'
  merge: -1
  img_proc: true
- pgno: 251
  md: '```

    DefaultZone=public

    CleanuponExit=yes

    CleanupModulesOnExit=no

    Lockdown=no

    Ipv6_rpfilter=yes

    IndividualCalls=no

    LogDenied=off

    FirewallBackend=nftables

    FlushAllOnReload=yes

    RFC3964_Ipv4=yes

    ```


    It is possible to check the status of the *firewalld* service using the option
    `--state` or by using the command **systemctl**. *Figure 8.3* illustrates running
    these two options:


    ![](img/863afa537de4eed7deb11978bfbfa90e_251_0.png)


    By default, **firewalld** has some predefined zones for different purposes. *Table
    8.1* shows the zone name and the description:


    | Zone | Description |

    | :--- | :--- |

    | drop | Any incoming network packets are dropped, and there is no reply. Only
    outgoing network connections are possible. |

    | block | Any incoming network connections are rejected with an icmp-host-prohibited
    message for IPv4 and icmp6-adm-prohibited for IPv6. Only network connections initiated
    within this system are possible. |

    | public | For use in public areas. You do not trust the other computers on networks
    to not harm your computer. Only selected incoming connections are accepted. |'
