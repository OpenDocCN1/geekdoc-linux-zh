    # ### Conclusion


    In this chapter, we understood how to review the resources. It is important to
    avoid disruptions in the system. Linux provides both high- and low-level tools
    to obtain information about the resources to be able to predict future issues.
    Limiting the resources that regular users can consume is a required task to avoid
    full disk or overload of CPU or memory.


    # ### Key facts


    +   * Multiple commands are available to obtain information about the resource
    usage.

    +   * CPU load is represented in three average intervals: 1, 5 and 15 minutes.

    +   * It is possible to set quotas on Linux for user and groups.

    +   * Linux offers the possibility to limit the resources that a user or group
    can consume.


