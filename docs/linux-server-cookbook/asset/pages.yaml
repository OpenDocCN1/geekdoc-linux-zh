    # ## Terraform


    **Terraform** is an open-source automation tool for *Infrastructure-as-code* created
    by *HashiCorp*. With this solution, it is possible to create, modify, and delete
    infrastructures in a fast and predictable way. Using **Terraform**, it is also
    possible to automate multiple **Cloud Providers**, traditional infrastructures,
    and different services such as *Kubernetes*.


    The biggest advantage of **Terraform** is that it makes it easy for provisioning
    the update and the deprovisioning of the infrastructure defined. **Terraform**
    relies on plugins called providers to interact with cloud providers, SaaS providers,
    and other APIs. Each provider adds a set of resource types and/or data sources
    that **Terraform** can manage.


    *Figure 15.4* features a Terraform diagram:


    ![](img/863afa537de4eed7deb11978bfbfa90e_536_0.png)


    Some of the providers officially maintained and supported by *HashiCorp* are as
    follows:


    +   - **Amazon Web Services (AWS)**: Lifecycle management of **AWS** resources,
    including *EC2, Lambda, EKS, ECS, VPC, S3, RDS, DynamoDB*, and more.


    +   - **Microsoft Azure**: Lifecycle management using the *Azure Resource Manager
    APIs*. It is maintained by the *Azure* team at *Microsoft* and the **Terraform**
    team at *HashiCorp*.


    +   - **Google Cloud Platform (GCP)**: Lifecycle management of *GCP* resources,
    including *Compute Engine, Cloud Storage, Cloud SQL*,'
  merge: -1
  img_proc: true
- pgno: 537
  md: '*GKE, Cloud Functions*, and more. This provider is collaboratively maintained
    by the *Google Terraform Team* at *Google* and the **Terraform** team at **HashiCorp**


    +   *   **Kubernetes**: Management of all **Kubernetes** resources, including
    *Deployments, Services, Custom Resources (CRs and CRDs), Policies, Quotas*, and
    more.


    +   *   **VMware vSphere**: Lifecycle management of *VMware vSphere* resources,
    including *Virtual Machines, ESXi Hosts, Datastores, vSwitches*, and more.


    Partners also are offering providers for **Terraform**, which are well documented
    and supported. Some provider examples are as follows:


    +   *   **Alibaba Cloud**: Used to interact with the many resources supported
    by *Alibaba Cloud*.


    +   *   **Cloudflare**: Used to interact with resources supported by *Cloudflare*.


    +   *   **OVH**: Used to interact with the many resources supported by *OVHcloud*.


    +   *   **VMC**: Used to configure hybrid cloud infrastructure using the resources
    supported by *VMware Cloud on AWS*.


    The community is as well sharing and collaborating with the big number of providers
    available. The portal **Registry Terraform** ([https://registry.terraform.io/browse/provider](https://registry.terraform.io/browse/provider))
    offers a complete list of them.


    **Terraform** can be installed and used in several **Linux distributions** and
    operating systems. Once it is installed, there are three stages to performing
    the provisioning of the desired infrastructure:


    +   *   **Write**: This stage includes defining the resources desired in one or
    multiple cloud providers or services.


    +   *   **Plan**: The tool will create a plan describing the infrastructure, defining
    what will be created, updated, or deleted in the target platform.


    +   *   **Apply**: When the plan tasks are approved, this stage will perform the
    needed changes in the platform.'
  merge: -1
  img_proc: true
