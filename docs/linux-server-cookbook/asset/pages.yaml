    The Transport layer relies on IP addresses and ports to initiate a connection,
    for which specifying the destination IP and the destination port is needed. A
    random port in the local system will be assigned for the communication. A service
    will be listening for new connections in an IP and in a defined port. The port
    ranges in Linux (different than the ones suggested by the **Internet Assigned
    Numbers Authority)** are defined in *table 7.1*:


    | Range | Description |

    | :--- | :--- |

    | 0-1023 | *System ports* (well-known ports). Only services/applications executed
    by system users can listen to these ports. |

    | 1024-32767 | Unprivileged port for the rest of the services |

    | 32768-60999 | Dynamic and/or Private ports. Also known as ephemeral ports. |


    Table 7.1: Port ranges description


    The file `/etc/services` contain a list of the known services and the port assigned.
