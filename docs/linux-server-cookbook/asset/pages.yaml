    # ## Understanding the system load and load average


    System load is a measure of the amount of computational work that a computer system
    performs. The load average represents the system load over a period of time. A
    processor with a load of 140% indicates it is running overload by 40%, just as
    a processor with a load of 30% is idling for 70% of the time for the period observed.
    The CPU load is represented by a decimal number, such as 1.40 to indicate 140%
    and 0.30 to indicate 30%.


    A common analogy to understand the CPU Load in Linux is related to the traffic.
    A single-core CPU is like a single lane in a road. Having more cores and CPUs
    would be like having more lanes, such that the load would be distributed among
    them comfortably. This is illustrated in *figure 6.5*:


    ![](img/863afa537de4eed7deb11978bfbfa90e_188_0.png)


    *Figure 6.5: Analogy with processors, load, and traffic*'
  merge: -1
  img_proc: true
