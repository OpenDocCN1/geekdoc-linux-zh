    In the previous example, the random port 49153 in the host on the protoclo $IPv4$
    and $IPv6$ will redirect the request to port $80$ of the Container named mywebserver2
    that is just created. Using the command curl, it is possible to test it, as shown
    in figure 13.19:


    ```

    root@ubuntu:~# curl 192.168.122.43:49153

    <html><body><h1>It works!</h1></body></html>

    ```


    Figure 13.19: Example accessing the container


    Along with the option --publish (-p), the port in the host that will be used for
    the redirection, is also needed to be specified. Three formats are available,
    as shown in table 13.1:


    | Format | Description |

    | --- |

    | host_port:container_port | Redirects the port host_port to container_port. All
    IPs available in the server will listen in the host_port. |

    | IP:port_host:port_container | Similar to the previous format, but specifying
    only one IP, which will listen to the port host_port. |

    | IP:port_container | In this format, the same port will be used in the container
    and in the host. For example, if the container exposes port 8080, the same port
    will be used in the host. |


    Table 13.1: Formats to be used with the --publish (-p) option


    Figure 13.20 shows how to run a Container and listen in port 8080 in the host,
    and redirect the request to port 80 in the container.


