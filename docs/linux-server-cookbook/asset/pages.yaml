    # Linux directory structure


    Linux distributions have a common layout directory structure, where each directory
    has a specific purpose. The main directory is called root and is referred to with
    a slash (/). The rest of the directories appear under this directory. Figure 5.1
    shows the standard Filesystem Hierarchy Standard (FHS):


    ![](img/863afa537de4eed7deb11978bfbfa90e_146_0.png)


    As is possible to observe in the previous image, the directories start with a
    slash (/) and, afterward, the name of the directory, for example, /bin/. If a
    directory is part of another directory, the separation is using a slash (/) again.
    For example, the directory /usr/share/ indicates the directory share/ is under
    the directory usr/, which is also under the root directory (/. Directories are
    represented by ending with a slash (/. It is possible to refer to the directory
    without specifying the last slash, but it is usually a good practice so that there
    is no confusion between file names.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Modern distributions are applying some changes to the standard *FHS* to ease
    the directory structure and also adding new directories for new features:


    +   - Directory **/bin/** is a link to directory **/usr/bin/** and does not contain
    different content anymore.

    +   - Directory **/lib/** is a link to directory **/usr/lib/**.

    +   - Directories **/lib32/** (for 32-bit libraries) and **/lib64/** (for 64-bit
    libraries) are linked to directories **/usr/lib32/** and **/usr/lib64/**.

    +   - Directory **/sbin/** is a link to directory **/usr/sbin/**

    +   - A new directory called **/sys/** contains information about devices, drivers,
    and kernel features.

    +   - A new directory called **/run/** contains a temporary filesystem associated
    with the memory available where run-time available data are stored. This directory
    is cleared during the boot process.


    # Directories storing applications


    There are two main directories where applications are stored when we install software
    using a package (*deb* or *rpm*). These directories are as follows:


    +   - **/usr/bin/** (linked to **/bin/**): It contains regular software which
    any user in the system can execute them. Some commands were reviewed previously,
    such as **mkdir** or **groups** are stored here.

    +   - **/usr/sbin/** (linked to **/sbin/**): It contains software used by administrators
    in the system. Some commands were reviewed previously, such as **useradd** or
    **groupadd**.


    Another directory that can contain software installed without using a Linux distribution
    package is **/usr/local/bin/**.


    # Directories storing user files


    Regular users would have their own directory inside the directory **/home/**.
    It is accessible only by the user or by an administrator and is isolated from
    the rest of the users. For example, the user *agonzalez* will have as default
    home directory **/home/agonzalez/**. An exception to the **/home/** directory
    is for the home directory for the *root* user. This administrator user has as
    home directory labeled'
