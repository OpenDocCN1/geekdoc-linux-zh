    \ high availability of the services offered. The projects used to provide a reliable\
    \ service are as follows:\n\n+   - **Pacemaker**: A popular *High Availability*\
    \ resource manager for *Linux*. It is responsible for ensuring that some of the\
    \ services configured are available on the controller nodes. The services can\
    \ be configured in active-passive or active-active. If it detects that some of\
    \ the applications or nodes are not responding, it is responsible for promoting\
    \ a node as active. The resources managed by *Pacemaker* are as follows:\n\n+\
    \      - *Gala*:\t A Multi-Master cluster for *MySQL/MariaDB* using synchronous\
    \ replication.\n+      - *Haprox*:\t It is responsible for performing load balancing\
    \ for the services offered by **OpenStack**.\n+      - *RabbitMQ, Qpid, or ZeroMQ*:\t\
    \ The message queue service to coordinate operations and status information among\
    \ services.\n+      - *Virtual IPs*:\t IP addresses associated with an application\
    \ and move with the application when the application is moved from one server\
    \ to another server. It allows a client to always call the same IP address instead\
    \ of guessing where the application is running.\n\n+   - **Memcached**: Used to\
