    The default port used by the **MariaDB server** is 3306 on protocol **Transmssion
    Control Protocol (TCP)** . The service will be listening in the interfaces matching
    the **bind-address** specified or in all interfaces if the specified IP is 0.0.0.0.
    The package includes the following three commands to start the service:


    +   *   **mariadbd**: The main service used by the service **mariadb.service**
    .

    +   *   **mariadbd-multi**: In systems running server *database services* , it
    is required to use this command instead the default one.

    +   *   **mariadbd-safe**: Used to start the service without *systemd* . This
    approach is needed to start troubleshooting or performing a recovery of a failed
    database server.


    It is possible to use the option --print-defaults for the command **mariadbd**
    (or **mysqld**) to show on the screen the options read from the configuration
    files, as is shown in figure 11.10:


    ```

