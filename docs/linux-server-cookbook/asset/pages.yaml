    # Commands grep


    Command grep is a powerful tool with different possibilities to match text using
    regular expressions. GREP stands for G lobal S earch , a R egular E xpression
    and P rint . This command, by default, uses basic regular expressions (BRE), but
    by using option -E is possible to use the advanced expressions (ERE) and the option
    -P for the Perl expressions (PRE), which is not covered in this book.


    The syntax for the command grep is the following: grep [options] pattern file(s).
    Table 5.17 shows the popular options available:


    | Option | Description |

    | :--- | :--- |

    | -F, --fixed-strings | Interpret the pattern as a fixed string and not as a regular
    expression. |

    | -e pattern, --regexp=pattern | Option to specify pattern and repeat this option
    to match several patterns. |

    | -f file, --file=file | Obtain patterns from the file specified. |

    | -i, --ignore-case | Ignore case distinctions in patterns. |

    | -v, --invert-match | Invert the sense of matching, showing the non-matching
    lines. |

    | -w, --word-regexp | Ensure the pattern matches with whole words. |

    | -c, --count | Does not show the output and instead shows how many coincidences
    were found for each file. |

    | -r, --recursive | Read all files under the directories specified. |

    | -R, --dereference-recursive | Same as -r, --recursive, but if directories are
    symbolic, links will follow them too. |


    Table 5.17: Popular options for the command grep


