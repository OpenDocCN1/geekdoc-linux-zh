- pgno: 516
  md: '# Cloud Service.


    # Advantages


    The use of a **Cloud Provider** has several advantages compared to running services
    on an *On-Premise* infrastructure. The main reasons for a migration to a **Cloud**
    are the following:


    +   - **Service Level Agreement (SLA):** Most of the **Cloud Providers** guarantee
    that the services are available 99.99% of the time when different availability
    zones are in use.


    +   - **Services catalog:** In a **Cloud Provider**, it is possible to run *Virtual
    Machines*, *Containers*, and they also have a *Load Balancer* or a *Backup Solution*,
    among hundreds of other options, together in the same portal. A cloud provider
    also enables more services immediately.


    +   - **Infrastructure:** The end user is not required to maintain the infrastructure
    anymore, including the physical components (servers, routers, cables, among others)
    and the virtual components (routing, networking, storage, and so on).


    +   - **Flexibility:** It is possible to dynamically change the resources allocated,
    depending on the needs of the services offered.


    +   - **Scalability:** More compute power, more storage, or more services can
    be added manually or automatically on demand.


    +   - **Accessibility:** **Cloud Providers** offer access to different services
    through the **Internet**, which allows them to offer a service directly to the
    end users.


    +   - **Security:** The solutions offered by the **Cloud Providers** are secure,
    and they offer alternatives to increasing security, such as encryption for the
    storage, private network, and firewall.


    As with every solution, there are some problems associated with the use of a **Cloud
    Provider**, especially a public one. Some of them are the following:


    +   - **Cost:** Even though one of the main reasons for using a **Public Cloud**
    is to reduce the cost, the wrong planning, bad implementation of workflows, and
    bad modernization can cause the cost to run the'
  merge: -1
  img_proc: true
- pgno: 517
  md: 'services, which further increases the cost in a **Public Cloud**. It is important
    in migration to define the needs, plan the possible costs and monitor the usage
    of the services.


    +   - **Vendor lock-in**: Migration to a **Public Cloud** means adapting and using
    the services offered by the provider. This can reduce the possibilities in the
    future of the need to go to another solution more suitable for the company.

    +   - **Less control**: Although having the infrastructure managed by the provider
    is an advantage, it can be a disadvantage as well if you are not able to control
    the different elements involved in a service offered.

    +   - **Support**: The support offered by **Cloud Providers** cannot meet the
    needs of some companies, especially in the new implementations of the services,
    as it requires more time than desired.


