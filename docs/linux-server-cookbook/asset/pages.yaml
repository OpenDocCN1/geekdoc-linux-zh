    using different gateways. Moreover, a Linux system can be configured as a router
    for other systems in the same network.


    As described previously, using the command `ip` with the argument `route` lists
    the routes configured in the system. It is possible to define static routers using
    network files, netplan or NetworkManager. Table 7.4 shows the content configuration
    or the commands to define the routes:


