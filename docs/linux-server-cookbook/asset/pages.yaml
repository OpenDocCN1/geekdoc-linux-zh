- pgno: 479
  md: '# Conclusion


    These days, **Containers** have become the main technology in the IT industry.
    It is important for System Administrators, Developers, and *DevOps* to have deep
    knowledge about the technology behind it and how to work with it. **Docker** and
    **Podman** help end user to run contains, create images, and perform **Continuous
    Integration**. Architecture that requires multiple contains, microservices, and
    advanced features would require to have knowledge about **Kubernetes**, and if
    a *Platform-as-a-Service* is required, they will be required to choose a solution
    based on **Kubernetes**, such as **Red Hat OpenShift Container Platform**.


    **Continuous Integration** and **Continuous Delivery** are the main approaches
    to accelerate the software development process, reduce bugs, and help the collaboration
    between developers in the same team. Different open-source tools are available
    and combined with cloud-based solutions, and it is the decision of the team to
    choose the proper one for their own needs.


    # Key facts


    +   - **Containers** are not a new technology, but **Docker** popularized them.

    +   - **Docker** is not a technology itself, but it is a high-level suite to run
    **Containers**.

    +   - **Docker** is a client-service architecture; **Podman** does not require
    a server to run the containers.

    +   - It is possible to have an internal (private) **Image Registry** to store
    the images generated.

    +   - Different tools are available to perform **Continuous Integration**, and
    **Jenkins** is one of the most used.


