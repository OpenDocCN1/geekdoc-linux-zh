- pgno: 427
  md: "```\n```\n|   ├── main.yml\n|   ├── templates\n|   ├── tests\n|   |   ├── inventory\n\
    |   |   └── test.yml\n|   └── vars\n|       └── main.yml\n```\n```\n\nThe `main.yml`\
    \ (or `main.yaml`) for each directory will be included automatically when a role\
    \ is included or imported. The meaning of each directory is as follows:\n\n+ \
    \  - **tasks/main.yml:** The main list of tasks that the role executes.\n+   -\
    \ **handlers/main.yml:** List of tasks used as handlers.\n+   - **defaults/main.yml:**\
    \ Default variables for the role. These variables have the lowest priority of\
    \ any variables available and can be easily overridden by any other variable,\
    \ including inventory variables.\n+   - **vars/main.yml:** Other variables for\
    \ the role.\n+   - **files/main.yml:** Files that the role deploys.\n+   - **meta/main.yml:**\
    \ Metadata for the role, including role dependencies.\n\nFrom a `Play`, it is\
    \ possible to include a list of roles using the expression `roles` at the `Play`\
    \ level. The following code shows an example:\n\n```\n```\n---\n- hosts: webservers\n\
