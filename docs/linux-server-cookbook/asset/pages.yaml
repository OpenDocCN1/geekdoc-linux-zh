  md: 'developed internally. There are different alternatives to running a private
    **Image Registry**; the popular and easiest way is using the **Image** provided
    by **Docker**. The name and the version of the image is **registry:2**. To expose
    it outside the system, it is required to use an SSL certificate to accept connections
    from remote sources. The following code was used to generate a self-signed certificate:


    ```

    ```

    openssl  req   -newkey rsa:4096 -nodes -sha256 -keyout certs/domain.key \ -addext  "subjectAltName
    = DNS:registry.example.com" \ -x509 -days 365 -out certs/domain.crt \ -subj "/C=ES/ST=Madrid/L=Madrid/O=example/OU=com/CN=registry.example.com"

    ```

    ```


    The image registry was executed using **docker** with the argument **run**, using
    the image **registry:2**. The environment variables specify where the certificates
    are.


    ```

    ```

    docker run -d --restart=always --name registry -v "$(pwd)"/certs:/certs \ -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/domain.crt
    \ -e REGISTRY_HTTP_TLS_KEY=/certs/domain.key \ -p 5000:5000 registry:2

    ```

    ```


    To publish an **Image** to a dedicated **Image Registry**, it is required to specify
    the DNS name of the server or the IP, followed by the port where the service is
    running. [Figure 13.47](#) shows how to tag and publish the image:


    ![](img/863afa537de4eed7deb11978bfbfa90e_462_0.png)


    *Figure 13.47: Example pushing an image to a local registry*


    Non-official repositories should be added in the file */etc/docker/daemon.json*.
    The daemon needs to be restarted to get the new configuration. After that, it
    is possible to publish and pull images from the registries configured.


