  md: "# # Playbooks\n\nA **Playbook** contains a list of *Plays* to perform. A *Play*\
    \ defines the hosts to be administrated and a list of *Tasks* to perform on them.\
    \ A **Playbook** contains at least one *Play*. A *Play* contains at least one\
    \ *Task* and the optionality to connect to the systems and variables needed.\n\
    \nThe format for the **Playbook** is *YAML*. The following example shows a simple\
    \ **Playbook** containing a *Play*.\n\n```\n```\n---\n\n- name: Configure Linux\
    \ systems\n  hosts: linux\n  tasks:\n    - name: Copy resolv.conf file\n     \
    \ ansible.builtin.copy:\n        src: /etc/resolv.conf\n        dest: /etc/resolv.conf\n\
    ...\n```\n```\n\nIn the previous *Playbook*, example is defined as follows:\n\n\
    +   - A single **Play** is defined with the name “**Configure Linux Systems**”.\n\
    +   The option `name` is not required but recommended.\n+   \n+   - The *Play*’s\
    \ `tasks` will be executed in the hosts within the group **linux**.\n+   The option\
    \ `hosts` is mandatory.\n+   \n+   - The *Play* contains only one `task`:\n+ \
    \  \n+     - The **Task** has the name `Copy resolv.conf file`. It is a good practice\
    \ to specify the names for the tasks.\n+     - The `module` used is `ansible.builtin.copy`.\
    \ This `module` copies a file from the control node (where **Ansible** is executed)\
    \ to the remote hosts. The field copied in `/etc/resolv.conf`\n+       - Latest\
    \ versions of **Ansible** prefixes core modules with `ansible.builtin`. It is\
    \ possible to omit it, but it is still"
  merge: -1
  img_proc: true
- pgno: 406
  md: "recommended to use it when other **collections** (described as follows) are\
    \ used.\n\nAs described previously, a **Playbook** can contain more than one *Play*.\
    \ The following example code shows two *Plays*, one to configure systems in group\
    \ **linux** and another **Play** to configure systems on the **windows** group.\n\
    \n---\n- name: Configure Linux systems\nhosts: linux\nbecome: True\ntasks:\n \
    \ - name: Copy resolv.conf file\n    ansible.builtin.copy:\n    src: /etc/resolv.conf\n\
    \    dest: /etc/resolv.conf\n- name: Configure Windows systems\nhosts: windows\n\
    tasks:\n  - name: Install 7-Zip\n    chocolatey.chocolatey.win_chocolatey:\n \
    \   name: 7zip\n---\n\n*A Play* can define connection parameters and variables\
    \ to be used in the tasks. The order to define the options, such as **become**,\
    \ **vars**, or **remote_user** in the following example, can be in the order desired\
    \ by the user.\n\n---\n- name: Configure Linux systems\nhosts: linux\nbecome:\
    \ True\nremote_user: agonzalez\nvars:\n  environment: development\ntasks:"
