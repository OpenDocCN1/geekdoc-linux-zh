  md: "# Facts and magic variables\n\nWhen *Ansible* is connecting to a **host**,\
    \ it gathers information about it by default. The information is called **facts**.\
    \ A special variable called **ansible_facts** is filled with information about\
    \ the remote system, such as the operating system, the distribution, the IP addresses,\
    \ system resource information, and so on. It is possible to use the module **debug**\
    \ to print the information about the **ansible_facts** variable. The following\
    \ code shows the example (truncated, only some values are shown) output for a\
    \ *Ubuntu* system:\n\n```\nTASK [debug]\n*********************************************************************\n\
    ****\nok: [ubuntu] => {\n  \"ansible_facts\": {\n    \"all_ipv4_addresses\": [\n\
    \      \"192.168.122.43\",\n      \"192.168.100.1\"\n    ],\n    \"all_ipv6_addresses\"\
    : [\n      \"fe80::5054:ff:fe1a:9cc4\",\n      \"fe80::5054:ff:fe8f:d41a\"\n \
    \   ],\n    \"architecture\": \"x86_64\",\n    \"discovered_interpreter_python\"\
    : \"/usr/bin/python3\",\n    \"distribution\": \"Ubuntu\",\n    \"distribution_major_version\"\
    : \"22\",\n    \"distribution_release\": \"jammy\",\n    \"distribution_version\"\
    : \"22.04\",\n    \"dns\": {\n      \"nameservers\": [\n        \"8.8.8.8\"\n\
    \      ]\n    },\n    \"kernel\": \"5.15.0-50-generic\",\n```"
