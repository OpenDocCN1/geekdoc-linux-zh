  md: '| Option | Description |

    | :--- | :--- |

    | -e, -execute=name | Execute the statement and quit. |

    | -h, -host=name | Connect to the host specified instead of using a Unix Socket.
    |

    | --max-allowed-packet=num | The maximum packet length to send to or receive from
    the server. The default is 16 MB and the maximum 1 GB. Useful to use when importing
    big files. |

    | -p, -password[=name] | Password to use when connecting to server. |

    | -P, -port=num | Port used to use for connection instead of 3306. |

    | --print-defaults | Output a list of the options for the client. |

    | -u, -user=name | User for login if not the current user. |

    | -v, -verbose | Show more information. |

    | -V, -version | Output version information and exit. |


    Table 11.5: Common options available for the command mariadb (mysql)


    The client can work in two different modes:


    +   * **Interactive:** After connecting to the database server, the user can write
    several statements to operate with the server and will exit the client by writing
    the command QUIT.

    +   * **One shot:** The client will read one or more statements from the standard
    input, and it will execute them to the server and exit the client execution.


    The client allows an argument to specify the database to be used. If it is not
    specified, the connection to the server will be without using a database, and
    the user will need to specify manually (using the statement USE) the database
    to operate with it. A user can switch between databases.


    Figure 11.17 shows how running the client from the database server with a root
    user is not needed, and neither is to specify a username and password.


