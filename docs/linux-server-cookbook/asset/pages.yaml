    in the market, including **Red Hat Enterprise Linux**, **Ubuntu**, or **Debian**.

    +       - An **Amazon Machine Image (AMI)** contains the operating system to be
    used to run the EC2 instance.

    +       - Running an EC2 instance requires to specify a **Security Group**, which
    is the definition of the *Firewall* rules.'
