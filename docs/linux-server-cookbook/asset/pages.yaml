    In many services that will be executed inside a platform with **Containers**,
    we will want to expose the service externally. The command **docker** with the
    argument **run** allows two options to externally expose a *container*:


    +   - **--publish-all** (-P): Publish all exposed ports to random ports.

    +   - **--publish** (-p): Manually specifies a list of the ports to be exposed
    to the *host*.


    With the first option, **Docker** will review the ports configured in the image
    to be exposed, and it will assign a random port to it. In the following example
    shown in figure 13.18, a new **container** using the image **httpd** is executed
    with the option **--publish-all**.'
