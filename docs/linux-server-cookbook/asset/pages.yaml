    # Image registry


    Docker allows to create custom images and publish them in a private or public
    Image Registry. An Image can be stored locally in order to be published to the
    registry. An Image has a name and a tag. The tag helps to specify a version of
    an application or base system, such as httpd:2.4 or ubuntu:22.04. The tag can
    also specify a string to specify name-based version ubuntu:jammy or ubuntu:latest
    (to always use the latest image available for Ubuntu). In creating an image, the
    user can specify the tag desired without any restraint.


    To generate an image, there are the following two main options:


    +   - Convert a container to an image: This generation is a manual task and requires
    to configure a Container. This is the less recommended option. The following two
    options are available using docker client:

    +     - Using export and import arguments as described previously.

    +     - Using argument commit and tag. Figure 13.39 shows an example:

    +       ```text

    +       root@ubuntu:~# docker commit mywebserver3

    +       sha256:619992f21a8ebcdd a4ce f9ee2d6e20b0139092268f39cf9f19dd393e83f20d4d

    +       root@ubuntu:~# docker tag 619992f21a8e imagewebserver3:0.1

    +       root@ubuntu:~# docker images | head -2

    +       REPOSITORY TAG IMAGE ID CREATED SIZE

    +       imagewebserver3 0.1 619992f21a8e 20 seconds ago 145MB

    +       ```

    +     - Figure 13.39: Example of using the argument commit

    +   - Using a template: A file usually named Dockerfile is used as a reference
    for the argument build for the command docker.


    An example of a Dockerfile is as follows:


    ```

    ```

    FROM ubuntu:latest

    RUN apt-get update && apt-get install -y apache2

    RUN echo "Image generated" > /var/www/html/index.html

    COPY test.html /var/www/html/test.html

    EXPOSE 80

    CMD /usr/sbin/apache2ctl -D FOREGROUND

    ```

    ```


    The instructions used in the previous example are as follows:


    +   - FROM: Indicates the base image to be configured. A valid Dockerfile must
    start with this instruction.'
