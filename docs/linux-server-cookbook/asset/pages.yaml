    An output of one command can be the input for another command, and this is called
    a *pipeline*. This means the *standard output* from one command can be redirected
    to be the *standard input* of another command and this command to the next one,
    and so on. The two commands are executed in parallel; the second command will
    wait till the first command finishes sending the standard output. The character
    used for *pipelines* is the vertical bar (known as a *pipe* in Linux): `command1
    | command2` or more than two, `command1 | command2 | command3 | commandN`. The
    following illustration shows how the standard input and output streams communicate
    between processes using the pipeline. Please refer to the following figure:'
