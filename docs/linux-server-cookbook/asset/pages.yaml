    # Virtual Machines


    By having a network ready to be used, a *flavor* defined, and an *image* with
    the desired operating system, it is possible to run a *Virtual Machine*. The computing
    service is called **nova**. The security group can be the *default* one in the
    project where it is going to be created or specify a custom one created in the
    cluster. Optionally, it is possible to specify the public key to be used. The
    arguments *server create* are used for the creation. *Figure 16.19* shows an example
    of the creation:


    ```

    ```

    [stack@Client ~]$ openstack server create myfirstvm --network overlay_network
    \

    > --flavor m1.small --image debian10 \

    > --key-name mykey --security-group allowssh --wait

    ```

    ```


    ![](img/863afa537de4eed7deb11978bfbfa90e_577_1.png)


    Using the option *--wait*, the command will create the *Virtual Machine* or show
    the reason why it was not possible to be created. The output includes the *IP
    address* assigned and other useful information. *Table 16.10* shows the output
    example for the previous command:


    | Field | Value |

    | :--- | :--- |

    | OS-DCF:diskConfig | MANUAL |

    | OS-EXT-SRV-ATTR:instance_name | instance-00000004 |

    | OS-EXT-STS:power_state | Running |

