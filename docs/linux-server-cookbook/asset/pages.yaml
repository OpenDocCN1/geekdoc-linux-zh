    # Red Hat Enterprise Linux


    Red Hat Enterprise Linux is the world''s leading enterprise Linux platform, widely
    used in data center infrastructures, virtualization, and containers. As described
    previously, RHEL is a commercial open-source Linux distribution developed and
    supported by Red Hat for the commercial market.


    RHEL uses **RPM Package Manager (RPM)** for package management, and this system
    is used in many distributions, such as CentOS, Fedora, Oracle Linux, AlmaLinux,
    or Rocky Linux.


    Installation images for Red Hat Enterprise Linux are available on the website:
    [https://access.redhat.com/downloads/](https://access.redhat.com/downloads/).
    A subscription is required to access the repositories, with the option to request
    a no-cost Red Hat Developer subscription if the purpose is for development or
    a 60-day trial is available to try RHEL before buying the subscription.


    RHEL offers three images for the installation:


    +   *   **Binary DVD:** It includes all required packages without the need for
    any additional repository. Useful when there is no internet access.

    +   *   **Boot ISO:** This image has the basic packages for the installation but
    requires an active network connection to access additional package repositories.

    +   *   **KVM Guest Image:** Used for KVM/QEMU hypervisor, such as Red Hat OpenStack
    (or community OpenStack) or Red Hat Virtualization (or oVirt project).


