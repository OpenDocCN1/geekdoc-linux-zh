    # ## Command chmod


    This command is used to change the permission for files and directories. It allows
    us to specify the permissions using the symbolic or the octal representation.
    As described previously about permissions, the symbolic representation has the
    following syntax: **u=permission,g=permission,o=permission**, and the octal representation
    can contain three digits or four digits in case there is a need to specify special
    permission.


    The command *chmod* can be used to replace current permissions using the character
    equal ( =) or manipulate current permission by adding more rights using the character
    (+) or removing permissions using the character minus (-). The command *chmod*
    allows to add permission using the character plus (+) or delete permissions (-)
    instead of the symbol equal (=). As well, *chmod* allows to specify only the permission
    to be modified and not all the components. And it is possible to use the letter
    “*a*” to set, add or remove permission for all the components.'
