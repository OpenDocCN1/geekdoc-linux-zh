    # Conclusion


    Security is a key part when a server is configured. This chapter has covered the
    main security elements in Linux distribution. Firewall is one of the main protections,
    and it is important to keep the rules updated. The solutions firewalld and ufw
    were covered, and different examples were described. Modern systems offer different
    services, and it is important to protect them to avoid unauthorized access. Different
    recommendations were described, and tools to monitor the traffic were explained
    in this chapter.


    # Key facts


    +   - Install and configure a firewall on Linux is a simple task.

    +   - A Linux system can act as a gateway for other systems.

