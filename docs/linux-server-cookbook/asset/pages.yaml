  md: 'the network connection. Some security recommendations related to services are
    the following:


    +   - Disable services that are not needed. Some services are enabled during installation,
    and they are recommended to monitor which services are running in the system and
    disable the ones that are not needed.

    +   - Configure services to listen to a specific interface. Applications are usually
    listening in all interfaces available, which can lead to security threads due
    to the firewall accepting all communications through one of the interfaces.

    +   - Turn off IPv6 if it is not in use. Some networks are not using IPv6, and
    in such cases, it is recommended not to use it on services to avoid undesired
    access.

    +   - Enable logging and auditing. It is important to enable logging and auditing
    for the services where users will connect and operate. A central logging service
    is recommended to be able to create reports and alert notifications.

    +   - Use an **Intrusion Detection System (IDS)**. This service detects possible
    intrusions to the system.

    +   - Using Security Models. Software like SELinux and AppArmor protects the system
    mitigating unauthorized accesses and attacks.


