  md: '# CHAPTER 4


    # User Administration and Software Management


    # Introduction


    After learning how to use the *Linux terminal* to perform different tasks, this
    chapter will discuss how to administrate users. The different commands used to
    create, modify, and delete users will also be explored. Other important topics
    described in this chapter will be how to operate with groups, how to assign it
    to users, and the difference between primary and secondary groups.


    The second part of this chapter is focused on software management. As described
    in the *Linux Installation* chapter, the two popular package managers are *RPM*
    and *DEB*. *RPM* is used by Red Hat Enterprise Linux and derivatives distributions
    such as SUSE or CentOS, whereas *DEB* is used by Debian and derivatives distributions
    such as Ubuntu Server. This chapter will delve deep into these package managers,
    including the commands to operate with them.


    The last part is related to services and an overview of how they are working on
    Linux, as well as how to operate with them, such as to enable/disable, start,
    stop, or restart them.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - Introduction to users and groups

    +   - Best practices for user accounts

    +   - Commands to administrate users

    +   - Commands to administrate groups

    +   - Introduction to RPM and DEB package formats

    +   - Commands to operate with RPM packages

    +   - Commands to operate with DEB packages

    +   - Introduction to services


    # Introduction to users and groups'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'During the installation of a Linux distribution, an administrative user named
    root is created. A new user is also recommended to be created using sudo for security
    reasons to login and to perform administrative tasks.


    Linux-based cloud images for different distributions also include a default user.
    This user has no password set, and the only possibility to connect with it is
    using a private SSH key. This will be covered in the network and security chapter.
    The typical login for cloud images are cloud-user (for most of the RPM-based distributions),
    ec2-user (for Linux systems in Amazon Web Services), or specific for distribution
    (centos for CentOS system, or ubuntu for Ubuntu Server).


    Users in Linux are not only reserved for human logins but there are also system
    users associated usually with services or applications. Linux users are identified
    by a numerical ID (uid): predefined users created during the installation will
    use a range between 0 and 99, whereas system users created using installing services
    and applications will use a range between 100 and 999. Regular users will have
    a bigger range, from 1,000 to 6,000. The uid 0 is reserved for the root user.


    Linux also has a list of groups, and the users are a member of them. A user is
    always associated with a primary group and, optionally, with multiple secondary
    groups. These groups help to associate permissions to files and applications with
    several users. Same as with the users, there exist system groups created during
    the installation of the Linux distribution or when a new service or application
    is installed. Groups are also identified by a numerical ID (gid), with the same
    range as for the users: 0–99 for predefined groups created during installation,
    100–999 for the system groups created during the installation of services and
    applications, and 1,000–6,000 for the regular ones. The root user has their own
    group called root with the guid 0.


    Administrators are able to create, administrate, and also delete users and groups
    with available system tools. Linux stores the information for users, passwords,
    groups, and passwords for groups in files. The four main files for keeping the
    information are as follows:


    +   /etc/passwd: Contains the list of the users locally available in the system.
    This file contains separated by colons (":") the following fields:

    +   - username: The user login with a maximum length of 32 characters.

    +   - password: It will contain the letter "x" indicating that it is stored in
    /etc/shadow. It is also possible to store the password encrypted in this file,
    although it is highly not recommended.

    +   - user id (uid): A unique numerical id associated with the user.

    +   - group id(gid): A numerical id, as primary group referencing a group in the
    file /etc/group.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   - **User information:** Nowadays, this field contains the full name of
    the user. Historically, these fields contained the name, location, phone number,
    and office number, and they were separated by commas.


    +   - **Home directory:** Full path where the user will have the main directory
    for his data.


    +   - **Shell:** Full path to the shell to be used. System users will use `/sbin/nologin`,
    `/usr/sbin/nologin` or `/bin/false` to avoid them from logging in as regular users.
    Normal users usually use `/bin/bash`, `/bin/sh`, or other popular alternatives
    such as `/bin/zsh`.


    +   - `/etc/shadow`: This file contains the password information and the expiration
    data for the local users in the system. This file should be protected and made
    unable to be read by non-administrative users. It contains nine fields separated
    by colons (`:`):


    +   - **username:** A user existing in /etc/passwd


    +   - **encrypted password:** A password that is usually automatically filled
    by command *passwd*.


    +   - **date of last password change:** This field has three possible values:


    +      - Empty means the user has no expiring date.


    +      - A 0 value means the user would have to change the password after she
    logins.


    +      - An integer expressed as the number of days since January 1, 1970, 00:00
    UTC, indicates when the password was changed for the last time.


    +   - **minimum password age:** The minimum number of days the user will have
    to wait before they are allowed to change the password again. An empty field and
    value 0 mean that there is a minimum password changing time required.


    +   - **maximum password age:** The maximum number of days after which the user
    will have to change their password. The user should be asked to change the password
    the next time they will log in. An empty field means that there is no maximum
    password age, no password warning period, and no password inactivity period.


    +   - **password warning period:** The number of days before a password is going
    to expire, during which the user should be warned. An empty field and value 0
    mean that there is no password warning period.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "+   * **password inactivity period**: The number of days after a password has\
    \ expired during which the password should still be accepted.\n+      * **account\
    \ expiration date**: The date of expiration of the account, expressed as the number\
    \ of days since January 1, 1970, 00:00 UTC.\n+      * **reserved field**: This\
    \ field is not used currently.\n\n+   * **/etc/group**: This file defines the\
    \ groups of the system. It contains the following fields separated by colon (\"\
    :\"): \n+      * **group name**: The name of the group\n+      * **password**:\
    \ An \"x\" indicating the password is stored in file **/etc/gshadow** or empty\
