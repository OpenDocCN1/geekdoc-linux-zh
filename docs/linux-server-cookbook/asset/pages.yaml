    # Multi cloud management


    One of the biggest disadvantages of using only one **Cloud Provider** is being
    locked into the services and the costs from one vendor. The concept of **Multi
    Cloud Management** is that it is a set of tools and procedures that lets us have
    more than one **Cloud Provider** and deploy different services depending on the
    needs, such as cost or availability. The services to be distributed can be simple
    ones, such as an application running in a *Virtual Machine*, or a complex one,
    such as a *Kubernetes cluster*.

    These days, more companies are moving to use more than one **Cloud Provider**
    for the following reasons:'
  merge: -1
  img_proc: true
- pgno: 528
  md: "+   * **Reducing costs:** Prices of running services on the Cloud can be very\
    \ different from one to another. If the company has decided on one provider for\
    \ its main services, it can reduce costs for some other services using a different\
    \ provider.\n\n+   * **Services available:** Most of the providers are offering\
    \ the same services, but specific ones can be a reason to choose another provider\
    \ that is different from the main one.\n\n+   * **Availability:** Most of the\
    \ providers are available in a big number of regions, but specific zones to offer\
    \ service to users in a country or region can be a reason to deploy a service\
    \ in a different provider.\n\nThe tools for **Multi Cloud Management** can be\
    \ grouped into three different categories:\n\n+   * **Infrastructure Automation\
    \ Tools:** These tools can be used to deploy a service or application in multiple\
    \ **Cloud Providers**. Some examples are as follows:\n+   \t* **Terraform:** Described\
    \ later on in this chapter, Terraform is used to connect and deploy services in\
    \ multiple providers.\n+   \t* **Ansible:** Allows to perform different operations\
    \ in different providers in an easy way.\n\n+   * **Management Tools:** The tools\
    \ in this category are responsible for managing multiple clouds from only one\
    \ application or portal. Some examples are as follows:\n+   \t* **Embotics:**\
    \ A solution to help modern infrastructure and operations teams decrease the challenges\
    \ of hybrid and multi-cloud management.\n+   \t* **Kymdrl Multicloud Management\
    \ Platform:** Simplifies management of multi cloud IT architectures with comprehensive\
    \ functionality and integration.\n+   \t* **Red Hat Advanced Cluster Management:**\
    \ Helps to administrate different Kubermetes installations in different clouds\
    \ from one dashboard."
  merge: -1
  img_proc: true
- pgno: 529
  md: "+   Cloud Provider Solutions: Some providers offer services to interoperate\
    \ with different providers.\n+   * **Google Anthos**: Consistent development and\
    \ operations experience for hybrid and multi cloud environments.\n+   * **Azure\
    \ Arc**: A bridge that extends the Azure platform to help you build applications\
    \ and services with the flexibility to run across data centers, at the edge, and\
    \ in multi cloud environments.\n\n# ## Infrastructure as code\n\nWith the adoption\
    \ of the **Cloud**, new needs appeared regarding the deploying of new infrastructure\
    \ in a fast and flexible way. There are the following two approaches for deployment:\n\
    \n+   * **Declarative**: This approach describes **what** to do, without a specific\
    \ control flow, to have the desired *Infrastructure*. This approach was the most\
    \ used before specific tools to deploy infrastructures appeared. It includes using\
    \ specific tools for the platform to be managed, such as:\n+   \t* **AWS Command\
    \ Line Interface (AWS)**: The tool to interact with the AWS Services from a command\
    \ line. Using the command **aws**, it is possible to create different services,\
    \ such as a VPC, EC2 Instance, or Load Balancer, among others.\n+   \t* **Google\
    \ Cloud CLI (gcloud)**: A set of tools to create and manage resources on the Google\
    \ Cloud Platform.\n+   \t* **Azure Command-Line Interface (CLI)**: A set of commands\
    \ used to create and manage Azure resources.\n+   \t* **Alibaba Cloud CLI**: Includes\
    \ the *aliyun* command to interact with and thus manage your Alibaba Cloud resources.\n\
    +   \t* **Openstack CLI**: OpenStackClient project provides a unified command-line\
    \ client, which enables access to the project API through the easy-to-use command\
    \ **openstack**.\n+   * **Imperative**: In this approach, it describes **how**\
    \ the target *Infrastructure* should be. The tool used will read the definition\
    \ desired, and it will"
  merge: -1
  img_proc: true
- pgno: 530
  md: "ensure that the final state is the proper one. This approach has several advantages\
    \ compared to the declarative one, and they are as follows:\n\n+   * **Idempotent**:\
    \ The process can be executed several times; if only the resources status is not\
    \ the same as the definition, it will be modified.\n+   * **Flexibility**: The\
    \ definition can be updated depending on new needs, and the target environment\
    \ will be updated.\n+   * **Removal**: The deletion of the defined infrastructure\
    \ is a straight action because this tool is responsible for the proper removal.\n\
    \nMost of the popular *Automation Tools* offer the possibility to operate with\
    \ the **Cloud Providers** using the **Imperative** approach. For example, **Ansible**\
    \ can use the modules to find a proper *AMI* image, define an *SSH* key, and create\
    \ an *EC2 Instance*. **Ansible** will use the specific library to communicate\
    \ with *AWS*'s API, called *boto3*. The following example shows a *Playbook* to\
    \ create different resources on *AWS*:\n\n```\n- name: Create an EC2 Instance\
    \ using Ubuntu Server image\n  hosts: localhost # API calls are from the system\
    \ who Ansible\n  is executed\n  gather_facts: False\n  tasks:\n  - name: Create\
    \ a VPC to be used by instances\n    amazon.aws.ec2_vpc_net:\n      name: net_iac_example\n\
    \      cidr_block: 10.10.0.0/16\n      register: r_net_vpc\n  - name: Create a\
    \ Subnet to be used by instances\n    amazon.aws.ec2_vpc_subnet:\n      vpc_id:\
    \ \"{{ r_net_vpc.vpc.id }}\"\n      cidr: 10.10.0.0/24\n      register: r_subnet_vpc\n\
    \  - name: Create a Key using the public one in the system\n    amazon.aws.ec2_key:\n\
    \      name: iac_key\n```"
  merge: -1
  img_proc: true
- pgno: 531
  md: "```\nkey_material: \"{{ lookup('file', '~/.ssh/id_rsa.pub') }}\" \nregister:\
    \ r_keypair \n- name: Get Ubuntu 22.04 AMIs \namazon.aws.ec2_ami_info: \nfilters:\
    \ \nname: \"ubuntu/images/hvm-ssd/ubuntu-jammy-22.04*\" \nregister: r_images \n\
    - name: Create an instance with a public IP address \namazon.aws.ec2_instance:\
    \ \nname: \"ubuntu01\" \nkey_name: \"iac_key\" \ninstance_type: t2.nano \nsecurity_group:\
    \ default \nnetwork: \nassign_public_ip: true \nimage_id: \"{{ r_images.images[-1].image_id\
    \ }}\" # Latest available \nvpc_subnet_id: \"{{ r_subnet_vpc.subnet.id }}\" \n\
    tags: \nEnvironment: Testing\n```\n\nThis Playbook can be executed several times,\
    \ and it will ensure that all the resources are created with the defined parameters.\
    \ One of the disadvantages of using Ansible, as well as the step-by-step other\
    \ automation tools, is the removal process. Another Playbook with the reverse\
    \ order needs to be created because, in the previous example, it was not possible\
    \ to remove a VPC before removing the server and the subnet. The following example\
    \ shows the correct order for the deletion:\n\n```\n- name: Unprovision an Infrastructure\
    \ \nhosts: localhost # API calls are from the system who Ansible is executed \n\
    gather_facts: False \ntasks: \n- name: Get instance to be removed \namazon.aws.ec2_instance:\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 532
  md: "```\nfilters:\n\"tag:Name\": \"ubuntu01\"\nregister: r_instance\n- name: Remove\
    \ existing instance\namazon.aws.ec2_instance:\n  state: absent\n  instance_ids:\n\
    - \"{{ r_instance.instances[0].instance_id }}\"\n- name: Remove existing Key\n\
    amazon.aws.ec2_key:\n  name: iac_key\n  state: absent\n- name: Get VPC to be removed\n\
    amazon.aws.ec2_vpc_net_info:\n  filters:\n\"tag:Name\": \"net_iac_example\"\n\
    register: r_vpc_net\n- name: Remove existing Subnet\namazon.aws.ec2_vpc_subnet:\n\
    \  cidr: 10.10.0.0/24\nvpc_id: \"{{ r_vpc_net.vpcs[0].id }}\"\n  state: absent\n\
    - name: Remove existing VPC\namazon.aws.ec2_vpc_net:\n  name: net_iac_example\n\
    \  cidr_block: 10.10.0.0/16\n  state: absent\n```\n\n**Cloud Providers** offer\
    \ an *Infrastructure as a Code* orchestration template system. By writing a definition\
    \ based on the template provided, it is possible to create resources and manage\
    \ them. The biggest advantage is the creation of resources based on the templates,\
    \ and this is automatically managed by **the Cloud Provider** instead of the tool.\
    \ The orchestration system is also responsible for resolving the dependencies,\
    \ and in case there is a removal request, it will perform it in the correct order.\
    \ The biggest disadvantage is"
  merge: -1
  img_proc: true
- pgno: 533
  md: "the syntax, which is usually more complex than simply using an Automation Tool,\
    \ and it varies from one Cloud to another. The options available for the common\
    \ providers are as follows:\n\n+   - **AWS CloudFormation**: Creating a template\
    \ that describes all the AWS resources wanted (such as Amazon EC2 instances or\
    \ Amazon RDS DB instances), CloudFormation takes care of provisioning and configuring\
    \ those resources from the definition.\n\n+   - **Google Cloud Deployment Manager**:\
    \ An infrastructure deployment service that automates the creation and management\
    \ of Google Cloud resources. It also writes flexible templates and configuration\
    \ files and uses them to create deployments that have a variety of Google Cloud\
    \ services.\n\n+   - **Azure Resource Manager**: The deployment and management\
    \ service for Azure. It provides a management layer that enables the creation,\
    \ updating, and deleting of resources in an Azure account.\n\n+   - **Alibaba's\
    \ Resource Orchestration Service (ROS)**: The ROS template syntax defines cloud\
    \ computing resources and resource dependencies in a template.\n\nAn example of\
    \ an AWS orchestration template based on Ansible's Playbook is as follows:\n\n\
    ```\n```\nParameters:\n    ParamInstanceType :\n        Description: A flavor\
    \ to be used for the instance\n        Default: t2.nano\n        Type: String\n\
    \    ParamKeyValue:\n        Description: SSH Public Key value\n        Default:\
    \ none\n        Type: String\nResources:\n    NetIac:\n        Type: AWS::EC2::VPC\n\
    \        Properties:\n```\n```"
  merge: -1
  img_proc: true
- pgno: 534
  md: "```\nCidrBlock: 10.10.0.0/16\nEnableDnsSupport: 'true'\nEnableDnsHostnames:\
    \ 'true'\nTags:\n    - Key: Name\n    Value: net_iac_example\nSubnetIac:\n   \
    \ Type: AWS::EC2::Subnet\n    Properties:\n        VpcId: !Ref NetIac\n      \
    \  CidrBlock: 10.10.0.0/24\nUserKey:\n    Type: AWS::EC2::KeyPair\n    Properties:\n\
    \        KeyName: UserKey\n        PublicKeyMaterial: !Ref ParamKeyValue\nUbuntu01:\n\
    \    Type: \"AWS::EC2::Instance\"\n    Properties:\n        ImageId: \"ami-043a52c87b956fc71\"\
    \n        InstanceType: !Ref ParamInstanceType\n        KeyName: !Ref UserKey\n\
    \        NetworkInterfaces:\n            - AssociatePublicIpAddress: \"true\"\n\
    \            DeviceIndex: \"0\"\n            SubnetId: !Ref SubnetIac\n      \
    \      Tags:\n                - Key: Name\n            Value: ubuntu01\n```\n\n\
    Once the *Orchestration Template* is created, the *Automation Tools* can use the\
    \ *API* of the *Cloud Provider* to start the orchestration. The following example\
    \ shows how **Ansible** uses the module **amazon.aws.cloudformation** for that\
    \ purpose:\n\n- *name*: Create resources using Cloudformations"
  merge: -1
  img_proc: true
- pgno: 535
  md: "```\nhosts: localhost\ngather_facts: False\ntasks:\n  - name: Create a Cloudformation\
    \ Stack\n    amazon.aws.cloudformation:\n      stack_name: \"ansible-cloudformation\"\
    \n      state: \"present\"\n      template: \"cloudformation.yaml\"\n      template_parameters:\n\
    \        ParamKeyValue: \"{{ lookup('file', '~/.ssh/id_rsa.pub') }}\"\n```\n\n\
    In this case, AWS Cloudformation Service is responsible for performing the operations\
    \ required that are defined in the template, ensuring that the dependencies and\
    \ the syntax are correct. When the operation is completed, the resources are available\
    \ to the provider. *Figure 15.3* shows an example on AWS of the resources created\
    \ with the previous template.\n\n![](img/863afa537de4eed7deb11978bfbfa90e_535_0.png)\n\
    \n*Figure 15.3: AWS Cloudformation dashboard*\n\nThe resources can be deleted\
    \ as a unique resources, deleting the *Stack* created. On **Ansible**, it is only\
    \ required to change the *state* parameter from *present* to *absent*. The examples\
    \ shown during this section are demonstrative only, and some resources are missing,\
    \ such as a security group and *Internet Gateway* to provide external connectivity.\n\
    \nIn the next section of this chapter, **Terraform** is described, and it will\
    \ be observed how it improves the general *Automation Tools* related to the *Infrastructure\
    \ as Code*. **Terraform** does not require to use of *Orchestration*"
  merge: -1
