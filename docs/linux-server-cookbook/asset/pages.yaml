  md: "On Red Hat Enterprise Linux, the content of default `named.conf` includes options\
    \ and references to the default *zones*:\n\n```\n```\noptions {\n    listen-on\
    \ port 53 { 127.0.0.1; };\n    listen-on-v6 port 53 { ::1; };\n    directory \
    \   \"/var/named\";\n    (...) ... omitted ...\n    allow-query      { localhost;\
    \ };\n    (...) ... omitted ...\n};\nlogging {\n    channel default_debug {\n\
    \        file \"data/named.run\";\n        severity dynamic;\n    };\n};\nzone\
    \ \".\" IN {\n    type hint;\n    file \"named.ca\";\n};\ninclude \"/etc/named.rfc1912.zones\"\
    ;\ninclude \"/etc/named.root.key\";\n```\n```\n\nOptions in *Bind* 9 define different\
    \ options such as in which *IP address* the *DNS service* will listen for queries\
    \ (**listen-on** and **listen-on-v6**), the main directory to keep data (**directory**),\
    \ who is allowed to use the service (**allow-query**), and define the *upstream\
    \ servers* (*forwarders*). It is possible to define the *forwarders* section to\
    \ indicate the upstream *DNS servers* to forward the request if the domain is\
    \ not one of managed by the service.\n\n```\n```\n    forwarders {\n        1.1.1.1;\n\
    \        1.0.0.1;\n    };\n```\n```\n\nA *zone* refers to the domain definition\
    \ and, by default, includes reference to the *root nameservers* and local configuration.\
    \ An administrator will generate a new file with the definition and include it\
    \ in the configuration. A *zone* definition example is the following:\n\n```\n\
    ```\nzone \"example.com\" {\n    type master;\n```\n```"
