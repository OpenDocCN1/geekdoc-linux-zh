  md: 'The *public-key cryptography*, also known as *asymmetric cryptography*, is
    a system that uses a pair of keys: the *public key*, which is the key to be distributed
    to be allowed to access the systems, and the *private key*, which should not be
    shared and kept secure in the system initiating the connection. The steps in an
    **SSH connection** using the pair keys are as follows:


    +   1. The client initiates the connection to the remote host.

    +   2. The client sends the *public key* id to the *SSH server*.

    +   3. The remote host checks in the `authorized_hosts` file of the user trying
    to connect if that key is accepted.

    +   4. If the key is accepted, a message (*challenge string*) is encrypted with
    the *public key*.

    +   5. The client decrypts the message received from the remote and sends it back
    to the remote host.

    +   6. If the remote hosts ensure the message is correct, the connection is accepted.


    The command to generate a pair of keys is called `ssh-keygen`. This command generates,
    by default, the files `~/.ssh/id_rsa` and `~/.ssh/id_rsa.pub`. It is possible
    to use the option `-t` to specify another type (*ecdsa*, *ed25519*, among others).
    With the option `-f`, it is possible to specify the path for the pair key to be
    generated. *Figure 9.21* shows the output of a key generation:'
