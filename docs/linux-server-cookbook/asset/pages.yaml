    and the default options in Ubuntu servers are shown as follows:


    ```

    listen=NO

    listen_ipv6=YES

    anonymous_enable=NO

    local_enable=YES

    dirmessage_enable=YES

    use_localtime=YES

    xferlog_enable=YES

    ```'
