    # ## Security Groups


    A Security Group is a set of firewall rules applied to Virtual Machines. By default,
    OpenStack only allows egress traffic. When a project is created, a security group
    is created and associated as a default. Administrators and users can add rules
    to the security group or create a new one and add the rules to them. Figure 16.17
    shows an example to allow connecting to port 22 (SSH):'
