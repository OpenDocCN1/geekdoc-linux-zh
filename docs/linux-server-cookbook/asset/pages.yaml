  md: '# CHAPTER 6


    **Monitoring System Resources**


    # **Introduction**


    This chapter covers how to monitor the system resources in a Linux system. It
    will introduce how the CPU and memory work in modern systems and the common tools
    available to check the status with the objective to do troubleshooting in case
    of issues or overload.


    Other important resources to monitor to avoid downtimes in applications is the
    disk usage and the available space. Different tools will be described to check
    the current status and to detect the physical state of the disks.


    Monitoring the networking became one of the most important tasks in Linux systems,
    especially with the introduction of complex networking in the systems to provide
    connectivity for virtual machines and containers.


    The last part of the chapter focuses on disk quotas and resource limits and helping
    to protect the system when it is accessible by regular users to avoid the resources
    getting exhausted.


    # **Structure**


    In this chapter, we will discuss the following topics:


    +   - Monitoring CPU resources

    +   - Monitoring memory resources

    +   - Monitoring disk usage and available space

    +   - Monitoring network resources

    +   - Quotas and limits


    # **Monitoring CPU resources**


    A **Central Processing Unit (CPU)**, a processor, executes instructions received
    from the system. In modern systems, there are three important concepts that are
    needed to understand, to be able to monitor and interpret the data received from
    the tools:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   - CPU Socket (CPU slot): is a mount on a computer *motherboard* that accepts
    a CPU chip.


    +   - CPU Core: a separate processing unit that reads and executes instructions.
    In modern systems, a *CPU* contains several cores.


    +   - CPU Thread: A *thread* is a queue for an operating system instruction. Modern
    systems enable *hyper-threading* enabling two threads.


    For example, if a system has two sockets, with four cores for each CPU, and has
    enabled the *hyper-threading*, it would have available eight cores and 16 threads.
    It is capable of running eight operating system instructions per cycle but would
    be able to have a *queue* of up to 16 tasks per cycle.


    An advanced concept for physical servers is named **Non-Uniform Memory Access
    (NUMA)**. This architecture divides the memory into local and remote memory relative
    to the processors. CPU accessing the local memory assigned has better performance
    than accessing the remote access using an *interconnect*. *Figure 6.1* shows a
    representation of a node with two NUMA with one CPU socket and four cores each:


    ![](img/863afa537de4eed7deb11978bfbfa90e_186_0.png)


    # Obtaining CPU(s) information


    The command `lscpu` described in *Chapter 3, Using the Command Line Interface*,
    shows the important information related to the CPU socket, core, threads, and
    NUMA. *Figure 6.2* shows a node with two CPU sockets and eight cores per socket.'
  merge: -1
  img_proc: true
