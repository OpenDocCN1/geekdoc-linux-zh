    The syntax for the commands `dnf` and `yum` is: `yum [options] action [args]`.
    The popular actions are shown in `table 4.19`:


    | Action | Description |

    |---|---|

    | autoremove | Remove all the packages installed as dependencies but are not needed
    anymore. |

    | check-update | Check if there is an available update for the installed packages
    in the system. |

    | distro-sync | Perform the operations needed to update the distribution to the
    latest version available. |

    | download | Download the package(s) specified in the current directory. |

    | downgrade | Downgrades the specified packages to the previously highest version
    available. |

    | info | Shows information about the package indicated. |

    | install | Installs the package(s) indicated and all the dependencies needed.
    It is possible as well to specify a .rpm file located in the local system or in
    a Web server. Groups can be installed by specifying the character at (@) as a
    prefix. |

    | list | Shows all the packages installed and the available in software repositories
    enabled in the system. |

    | makecache | Downloads and caches metadata for the enabled repositories in the
    system |

    | provides | Finds the package providing the file or directory indicated as an
    argument. |

    | reinstall | Reinstall the specified package(s). |'
