    Profiles are simple text files located in /etc/apparmor.d/. It refers to a full
    path replacing the slashes (/) with dots (.). For example, the file /etc/apparmor.d/usr.bin.tcpdump
    references to the command /usr/bin/tcpdump.


    The log for AppArmor is located inside of the file /var/log/dmesg, which is accessible
    directly or through the command dmesg. The profile /etc/apparmor.d/usr.bin.tcpdump
    defines some deny rules:


    ```

    # for -F and -w

    audit deny @{{HOME}}/*.\* mrwkl,

    audit deny @{{HOME}}/*.\* rw,

    audit deny @{{HOME}}/*/*/* mrwkl,

    audit deny @{{HOME}}/bin/ rw,

    audit deny @{{HOME}}/bin/** mrwkl,

    ```


