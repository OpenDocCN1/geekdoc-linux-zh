    consumed. **Cloud Providers** have evolved during the last decades from a simple
    offering of **Compute services** and **Storage Services** to more than hundreds
    of services. A **Cloud Provider** is responsible for all the infrastructure, including
    storage, networking, computing, and security. Some of the categorized services
    offered these days are the following (categories offered by Amazon Web Services):


