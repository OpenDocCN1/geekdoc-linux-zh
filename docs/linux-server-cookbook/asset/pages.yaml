    # Quotas and limits


    One of the goals of a Linux system administrator is to protect the system, and
    that requires to set limits and quotas. So the system resources are not exhausted.
    Linux has two general ways to limit resources consumption by users:


    +   - **Quotas**: Limits the disk space for users and groups. This can be used
    to limit the space a user can consume or limit the total number of files he can
    own.

    +   - **Limits**: Possibility to limit different resources to the user, such as
    the number of open files, number of processes, or the memory used.


    # Quotas


    Disk quotas are applied to a filesystem and to users and/or groups. A filesystem
    needs to be configured to track the files and the size that each user and group
    is consuming. It is possible to limit the total size and the number of files for
    a user or group, having two limits:


    +   1. **Soft limit**: Indicates the limit when a grace period would be in place.
    For example, if the *soft limit* is 1 GB and the *grace period* is two days, the
    user would be able to be over that limit for two days. After the *grace period*,
    the'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'user will not be able to add more files till they delete the files to be below
    the limit.


    +   2. **Hard limit:** The user will not be able, in any case, to have more than
    the limit specified.


    Before quotas are used in a system, the user or the group quotas have to be enabled
    in the filesystem, which is required to be configured for quotas. This is not
    enabled by default. For that, it is needed to open the file `/etc/fstab` and,
    in the fourth column, add the words `usrquota` and/or `grpquota`, as is shown
    in figure 6.50:


    ```

    # /etc/fstab: static file system information.

    #

    # Use ''blkid'' to print the universally unique identifier for a

    # device; this may be used with UUID= as a more robust way to name devices

    # that works even if disks are added and removed. See fstab(5).

    #

    # <file system> <mount point>   <type>  <options>       <dump>  <pass>

