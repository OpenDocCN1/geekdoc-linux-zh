    # Security models


    A security model provides a mechanism for supporting access security policies.
    Red Hat Enterprise Linux and derivatives distributions use *SELinux* and Debian,
    and derivatives use *AppArmor* software. Both solutions are integrated into the
    *Linux Kernel* to increase the security of the system.


    **SELinux (Security Enhanced Linux)** defines access controls for the applications,
    processes, and files on a system. Using security policies, the rules define what
    can be accessible and what cannot. For example, *SELinux* rules can define which
    directories can be used by an application or which ports can be used for listening
    connections.


    *SELinux* has three states, as follows:


    +   •  *enforcing* to protect and ensure that the rules are followed.

    +   •  *permissive* will show warnings but allow the actions.

    +   •  *disabled* to not use policies in the system. The main configuration to
    define the state is */etc/selinux/config*.


    The command **getenforce** shows the current state, and the command **setenforce**
    changes between states. The command **sestatus** provides more information. *Figure
    8.22* shows the output of the commands:


    ```

    [root@rhel ~]# getenforce

    Permissive

    [root@rhel ~]# setenforce Enforcing

    [root@rhel ~]# sestatus

    SELinux status:                 enabled

    SELinuxfs mount:               /sys/fs/selinux

    SELinux root directory:        /etc/selinux

    Loaded policy name:            targeted

    Current mode:                  enforcing

    Mode from config file:         enforcing

    Policy MLS status:             enabled

    Policy deny_unknown status:    allowed

    Memory protection checking:    actual (secure)

    Max kernel policy version:     33

    ```'
