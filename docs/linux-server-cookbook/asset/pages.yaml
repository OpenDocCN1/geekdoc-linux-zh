    # ## Best practices for user accounts


    For human user accounts, it is recomended that the account is protected with strong
    passwords and expiration rules are applied. When possible, it is also recommended
    to disable the password login (for example, in SSH) and instead use only SSH private/public
    keys for login.


    It is important to keep a list of the users required for each system and remove
    the non-required users for the system to avoid password breaches or vulnerabilites,
    which can affect our infrastructure. Another important thing to keep track of
    is the user and group belonging to mapping, thus, ensuring the user does not belong
    to a group of which he should not be a part of.


    Automating the creation and maintenance of the users with tools like *Ansible*
    will help administrators to keep the systems secure and easy to maintain.'
