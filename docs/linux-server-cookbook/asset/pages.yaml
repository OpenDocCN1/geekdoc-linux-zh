    # ### FTP server and client


    The **File Transfer Protocol (FTP)** is a historical protocol published for the
    first time in 1971. It is used to share files to end users mainly. Nowadays, the
    popularity of FTP is low, and it is mainly used to distribute software publicly.
    The'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'protocol FTP separates the control (login and commands) and the data (transfer
    files) connections. The protocol uses port 21/tcp for the control communication
    and port 20/tcp for the data transmission. It is possible to protect the protocol
    using SSL/TLS, which is commonly named FTPS, which uses 989/tcp, and 990/tcp ports.


    The FTP protocol can work in two different modes:


    +   - Active mode: The client connects to port 21/tcp and indicates which local
    port is used for the data transfer. The servers send the data to the port specified.
    This can be an issue when a firewall is involved because that communication usually
    is not allowed.


    +   - Passive mode: This mode is used to avoid firewall issues. The client sends
    a signal called PASV, and the server answers with an IP and a port to start the
    data communication.


    Figure 10.14 shows the differences between the two modes:'
  merge: -1
  img_proc: true
