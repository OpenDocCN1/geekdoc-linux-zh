    # Container runtimes


    As described previously, **Docker** and **Podman** are solutions to run containers
    on different platforms. Underneath, they are using a **Container Runtime** for
    that purpose. They are also responsible for network attachments, low-level storage,
    image transfer, and execution supervision.


    There are different options available as follows:


    +   * **runc**: A CLI tool for spawning and running containers on Linux, according
    to the OCI specification. This is the default one used by **Docker**.

    +   * **crun**: A fast and low-memory footprint *OCI Container Runtime* fully
    written in C. This is the default one used by **Podman**.

    +   * **Mirantis Container Runtime (MCR)**: Formerly called *Docker Engine—Enterprise*,
    it is a runtime supported by the company **Mirantis** after buying **Docker Enterprise**.


    A **Container Runtime Interface (CRI)** is a plugin that allows **Kubernetes**
    to use a wide variety of **Container Runtimes**. The two main popular ones are
    as follows:


    +   * **containerd**: This runtime is available as a daemon for Linux and Windows,
    which can manage the complete container life cycle of its host system.

    +   * **CRI-O**: A lightweight container runtime for **Kubernetes**.


    # Kubernetes


    If **Docker** revolutionized the IT industry easing the container adoption and
    the modernization of the applications, **Kubernetes** went further and put the
    industry upside down in the way of working, deploying applications, and how the
    application modernization should be. **Kubernetes** offered container orchestration,
    whereas **Docker** tried with the project **Docker Swarm**. However, the limitations
    and the lack of functionalities converted **Kubernetes** into the perfect container
    orchestration solution.'
  merge: -1
  img_proc: true
- pgno: 466
  md: '**Kubernetes** provides you with a framework to run distributed systems resiliently.
    It takes care of scaling and failover for your application, provides deployment
    patterns, and more. Kubernetes provides the following:


    +   - **Service discovery and load balancing**: Can expose a container using the
    DNS name or using their own IP address.


    +   - **Storage orchestration**: Allows you to automatically mount a storage system
    of your choice, such as local storage, public cloud providers, and more.


    +   - **Automated rollouts and rollbacks**: It is possible to describe the desired
    state for your deployed containers using **Kubernetes**, and it can change the
    actual state to the desired state at a controlled rate.


    +   - **Automatic container distribution**: **Kubernetes** consists of a cluster
    of nodes that it can use to run containerized tasks. Each container defines how
    much CPU and memory (RAM) it needs. **Kubernetes** can fit containers onto your
    nodes to make the best use of your resources.


    +   - **Self-healing**: **Kubernetes** restarts containers that fail, replaces
    containers, kills containers that do not respond to your user-defined health check,
    and does not advertise them to clients until they are ready to serve.


    +   - **Secret and configuration management** Kubernetes let you store and manage
    sensitive information, such as passwords, *OAuth tokens*, and *SSH keys*. You
    can deploy and update secrets and application configuration without rebuilding
    your container images and without exposing secrets in your stack configuration.


    **Kubernetes** is a perfect platform for many use cases and enterprises of all
    sizes. But **Kubernetes** is not a **Platform-as-a-Service (PaaS)**, which includes
    all that is needed for the developers to build and run applications on it. In
    the market, *PaaS* solutions-based **Kubernetes** appeared, and it is distributed
    as *Kubernetes distributions*. The popular solutions are as follows:


    +   - **Red Hat OpenShift Container Platform**: A full-stack automated operations
    and self-service provisioning for developers lets teams work together more efficiently
    to move ideas from development to production. The community-supported sibling
    project is named *OKD*.


    +   - **Red Hat OpenShift Dedicated**: A managed Red Hat OpenShift offering on
    **Amazon Web Services (AWS)** and **Google Cloud**. Reduces operational complexity
    and focuses on building and scaling applications that add more value to your business
    with this turnkey application platform.


    +   - **VMware Tanzu**: Provides a streamlined, self-service developer experience
    for any Kubernetes that fits a development team’s preferred practices and workflows
    while automating the toil of infrastructure, packaging, and security.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '+   - **Rancher**: A management tool to deploy and run clusters anywhere and
    on any provider.


    +   - **Google Container Engine (GKE)**: A managed, production-ready environment
    for running containerized applications.


    +   - **Amazon Elastic Kubernetes Service (EKS)**: A managed service and certified
    Kubernetes conformant to run Kubernetes on AWS and on on-premises.


    +   - **Mirantis Kubernetes Engine**: Offers a fast way to deploy cloud-native
    applications at scale in any environment.


    +   - **Canonical Kubernetes**: This is built on Ubuntu and combines security
    with optimal price performance.


    # ## Introduction to continuous integration/delivery


    With the new work methodology introduced with the use of containers and new agile
    principles, two new concepts also appeared for the software life cycle:


    +   - **Continuous Delivery (CD)**: Automates the entire software release process.
    The idea behind CD is that any time the developers commit the changes to the version
    control solution, the software is built and tested in the proper target. If the
    workflow is completed correctly, the new version is ready to be released. This
    approach reduces the time to go to production, reduces costs, and reduces the
    risk of releasing software with bugs or not working properly. *Figure 13.52* shows
    the workflow example:


