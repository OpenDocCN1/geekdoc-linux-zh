    # Monitoring memory resources


    **Random-access memory (RAM)**, is a limited and usually expensive resource in
    physical systems. Understanding how system and applications are using memory is
    a required knowledge, to be able to administrate systems and avoid issues running
    critical applications.


    Linux systems include memory management which is responsible to provide dynamic
    allocated portions of the memory to processes and to release that portion'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'when the application finishes. Memory management provides the following:


    +   * Option to offer more memory than the physical availability. For example,
    using *swap*, which uses the disk space to increase the memory space available.

    +   * Each process has assigned a virtual address space and is isolated from other
    processes.

    +   * Memory mapping, where the content of a file is linked to a virtual address
    of the process.

    +   * Fair allocation of the memory for processes.

    +   * Shared virtual memory between processes, for example, for libraries in use.


    The command *free* explained in [Chapter 3, Using the Command Line Interface](#),
    is the main tool to see the current status of the system. The file used to obtain
