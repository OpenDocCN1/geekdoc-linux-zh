- pgno: 246
  md: '# CHAPTER 8


    # Security.


    # Introduction


    Offering a service to end users leads to possible security risks, such as data
    leaks or unauthorized access. Though Linux is the most secure operating system,
    it is necessary to avoid unwanted access to the service or to the system itself.
    To protect a system, there are two main important points: keep the system updated
    to avoid attacks on the software in the system, and protect who has access to
    the system through the network.


    This chapter is focused on network security using a firewall and limiting access
    to different services using configuration. Linux also provides different tools
    to avoid the execution of unwanted software and checks if the system is compromised.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - Security introduction

    +   - Firewall configuration on Linux

    +   - Services security

    +   - Network monitoring


    # Security introduction


    One of the main tasks of Linux system administrators is to keep the system updated
    and protected from unwanted access to the system itself or applications. [Chapter
    4, User Administration and Software Management] describes how to create users
    and groups and how, by using permissions, it is possible to limit access to files
    and directories. It is important to protect the system by checking the files using
    special permissions, to avoid unwanted permission escalation. The process of protecting
    a system from a default installation is called *hardening*.


    Security networking uses this knowledge to protect the system from remote access,
    either from a user or system in the same network or an attacker from'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'outside of the network through the internet. The main security related to networking
    is to use a Firewall on the Linux system. Even though the network would be protected
    by a network firewall, it is important to protect the systems with their own firewall
    to create double protection.


    Historically, firewall configuration in Linux was a complicated task that required
    knowledge about $iptables$, a tool to maintain filter rules in the Linux kernel.
    Modern distributions include high-level tools to manage firewall rules, helping
    administrators and regular users to main firewall rules in an easy way.


    Depending on the Linux distribution used, the default firewall tool will be different.
    Red Hat Enterprise Linux and derivatives, such as CentOS Stream or Rocky Linux,
    rely on the $Firewalld$ project as firewall management. Ubuntu distribution uses
    an $Uncomplicated\ Firewall\ (ufw)$ as the default configuration tool to ease
    firewall configuration.


    The default backend for the firewall solutions in modern distributions is $nftables$,
    which replaces the traditional $iptables$. It is possible to use the command $nft$
    to manage or list the rules configured in the system.


    The following schematic $figure\ \underline{8.1}$ shows packet flows through Linux
    networking:


    ![](img/863afa537de4eed7deb11978bfbfa90e_247_0.png)


    Linux services implement their own security configuration. For example, the service
    $SSH$ allows to configure to not allow login with the administrator user $root$
    or only allows the connection using $SSH\ public/private\ keys$. Another example
    is'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'NFS Server, which limits the exported directories to specific IPs/Network ranges
    and with the possibility to enable authentication.


    Another protection solution offered by the Linux distributions is called *mandatory
    access control* policies. This security is a proactive approach that helps to
    protect the system against both known and unknown vulnerabilities. These policies
    enforce what the application and the user can do, such as access to directories,
    the ports they can use, or the operations they can do. For example, it protects
    a Web server to access a directory that is not the default or denies the connection
    from the Web server to a remote location.


    Red Hat Enterprise Linux and derivatives offer **Security-Enhanced Linux (SELinux)**
    for supporting **Access Control Security Policies**. Debian and Ubuntu rely on
    *AppArmor* solution as **Mandatory Access Control (MAC)**.


    Other security-related management examples on Linux for *hardening* include the
    following:


    +   - Disk encryption: Using **Linux Unified Key Setup (LUKS)** for hard drive
    encryption.

    +   - Secure user access: Includes **Pluggable Authentication Modules (PAM)**
    configuration, the configuration of user *limits*, the configuration of *sudo*,
    and user auditing, among others.

    +   - Restrict file-system permissions: It is possible to restrict which directories
    can contain executables and what directories should be read-only.


    Linux distributions offer the possibility to comply with three popular security
    certifications, which usually are required for companies in the public sector
    or companies working with sensible data:


    +   - **Federal Information Processing Standards Publications (FIPS)**: Issued
    by the **National Institute of Standards and Technology (NIST)**, the *FIPS 140-2*
    specifies the security requirements for cryptographic modules.

    +   - **Center for Internet Security (CIS)**: It publishes benchmarks related
    to services. They offer **Extensible Configuration Checklist Description Format
    (XCCDF)** format benchmarks, which can be used by different tools.

    +   - **Security Technical Implementation Guides (STIG)**: Developed by the **Information
    System Agency (DISA)** for the **US Department of Defense (DoD)**, STIG consists
    of security controls, including configuration settings to hardening Linux distributions.'
