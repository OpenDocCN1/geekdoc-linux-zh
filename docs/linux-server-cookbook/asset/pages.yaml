    # Directories storing data for users


    As observed in figure 5.1, the directory /usr/ contains data and applications
    oriented to users. Directories /usr/lib/, /usr/lib32/, /usr/lib64/, /usr/bin/,
    and /usr/sbin/ were described previously. Other important directories under /usr/
    are shown in table 5.4:


    | Directory | Contains |

    | :--- | :--- |

    | include/ | Files required for software compilation from source code. |

    | local/ | The same structure as /usr but for software not installed using Linux
    distribution packages. |

    | libexec/ | Internal applications are executable by other programs but not for
    regular users. |

    | src/ | Source code for applications or for the Linux kernel. |

    | share/ | Data for applications that are independent of system architecture.
    Data such as documentation, fonts, public global certificates, icons, applications
    plugins, and so on. |


    # Table 5.4: Other directories inside directory /usr/


    # Directories storing system data information and boot files


    As everything in Linux is represented as a file, Linux distributions have some
    special directories containing information about devices, hardware, and process
    information. The kernel core and the boot file containing drivers are stored in
    a special directory too. These directories are shown in table 5.5:


    | Directory | Contains |

    | :--- | :--- |

    | /boot/ | Kernel and booting files, including configuration files for the boot
    loader (for example, grub). |

    | /dev/ | List of files referencing available devices in the system, such as disk
    devices (/dev/sda for a primary disk) or virtual devices like /dev/random to generate
    random data. Standard input, output, and error are reflected here as /dev/stdin,
    /dev/stdout, and /dev/stderr. |

    | /proc/ | Process and kernel information. Each process has an associated directory
    inside with information about the execution. Other files contain information about
    the system, such as /proc/cpuinfo, having details about the system CPUs. |

    | /sys/ | Devices, drivers, and kernel features. For example, the subdirectory
    /sys/class/net/ contains information about the network devices. |'
