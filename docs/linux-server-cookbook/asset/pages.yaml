- pgno: 27
  md: '# CHAPTER 1

    Introduction to Linux


    # Introduction


    On August 25, 2021, Linux celebrated 30 years since Linus Torvalds posted a message
    about the new operating system he had designed. The IT sector experienced enormous
    advances and changes during these three decades. Linux became and consolidated
    the most important operating system in the industry.


    In this chapter, we will describe why Linux is essential for companies, its latest
    features, and the cases in which it is used.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - The Magnitude of Linux

    +   - Linux on key sectors of the IT industry

    +     - Software

