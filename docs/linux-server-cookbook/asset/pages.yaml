    # # Persistent storage


    By default, the *Virtual Machines* have ephemeral storage for the root disk. This
    is a common behavior working in a **Cloud**, and the persistent data are usually
    in a separate disk. The project **cinder** allows for creating volumes and attaching
    them to the *Virtual Machine*. The argument **volume create** is used to create
    a *volume* to be used later with the argument **server volume add**. *Figure 16.24*
    shows an example:'
  merge: -1
  img_proc: true
