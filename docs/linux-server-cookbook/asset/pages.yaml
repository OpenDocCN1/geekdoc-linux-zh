- pgno: 366
  md: '# # CHAPTER 12

    ## Automation


    # ## Introduction


    The complexity of IT infrastructures in the last decades increased with the growth
    of the adoption of technology in our lives. In the past, the number of systems
    was reduced to physical systems, and it was a dedicated team responsible for managing
    the operating systems and the applications running on the system. With the adoption
    of virtualization and the cloud, the number of systems and elements that needed
    to be managed also increased. Having a dedicated team to configure the systems
    and the applications manually became an impossible task.


    Automation started to be an indispensable technology to reduce human intervention
    and to configure and maintain systems and devices. Automation is now an important
    part of most companies to deploy systems, configure them, and deploy applications,
    among other different functionalities. To keep systems homogeneous, ensuring the
    managed systems have the correct configuration, and performing updates to the
    system are other advantages of using automation.


    This chapter covers the different automation options, from traditional *scripting*
    to perform simple automation to more advanced tools such as *Ansible*.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   - Introduction to IT automation

    +   - Automation with shell scripting

    +   - Automation with Python

    +   - Automation with Ansible'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# # Introduction to IT automation


    IT automation simplifies operations, thereby reducing human intervention and improving
    the speed and agility of the different tasks performed in the infrastructure managed.
    IT automation is not reduced only to operating systems but also to any element
    in the infrastructure that can be configured. Some examples of the elements that
    can be configured using automation are as follows:


    +   - Infrastructure elements: Linux, Windows, Virtualization solutions, and so
    on.

    +   - Network devices.

    +   - Security systems.

    +   - Applications and services.

    +   - Clouds resources.


    IT automation is not limited to deploy elements but is able to perform all the
    life-cycle needed for the device. This life cycle usually includes provisioning,
    configuration, scale-up and scale-down, and de-provisioning. The advantages involved
    in using IT automation are as follows:


    +   - **Cost saving:** Reducing human intervention entails the professionals to
    reduce the time performing repetitive tasks and the possibility to focus on other
    tasks.

    +   - **Time-saving:** IT Automation reduces time in all the life-cycles parts.

    +   - **Flexibility:** Having the infrastructure automated gives the flexibility
    to manipulate the current state infrastructure, such as scaling up or down the
    infrastructure or updating an application to a newer version.

    +   - **Reducing error:** Human intervention can cause unexpected downtime and
    miss configurations in the infrastructure, which will affect the infrastructure.
    IT automation reduces the possibilities of possible issues.

    +   - **Improve security:** A good automation implementation reduces the possibility
    of breaches, and it can help to implement automatic fixes to the infrastructure.'
  merge: -1
  img_proc: true
- pgno: 368
  md: "Some important principles when IT automation is used are as follows:\n\n+ \
    \  * **Make it simple**: Automation tasks should solve a specific need and not\
    \ a general one. Complex automation tasks lead to less flexibility and a higher\
    \ probability of needing human intervention.\n+   * **Idempotent**: Ensures if\
    \ one system is already configured, running the same automation process will not\
    \ cause any modification and downtime to the system.\n+   * **Imperative versus\
    \ declarative**: Imperative model focuses on performing tasks to obtain the desired\
    \ result, and on the other hand, the declarative model defines the desired state.\
    \ For example:\n+   \t* **Imperative model**: Running a command to create a virtual\
    \ machine with specific options.\n+   \t* **Declarative model**: Using an automation\
    \ tool that reads the desired virtual machine definition and the state of the\
    \ same. It ensures that it exists and that the state is desired. Otherwise, it\
    \ will perform the needed actions to obtain the expected definition.\n+   * **Mutable\
    \ versus immutable**: Traditional infrastructures were more mutable after creation\
    \ than modern ones. Updating operating system, libraries, and applications were\
    \ a common task for system administrators. Modern systems, especially using virtual\
    \ machines and containers, are more likely to be destroyed and deployed with the\
    \ new versions of the distribution or the application running on it. Modern infrastructures\
    \ are considered as immutable infrastructures.\n+   * **Do not repeat yourself**:\
    \ One of the most important principles is to be able to reuse part of the automation\
    \ definitions. Automation tools allow to create reusable part of codes and use\
    \ it on different projects.\n\nInside the IT infrastructure are different categories\
    \ depending on the purpose of the tasks to perform. Automation evolved over the\
    \ years from simple local tasks through multiple managed systems to reach the\
    \ current status, which includes the following:\n\n+   * **Configuration management**:\
    \ This automation ensures the managed devices have the proper configuration and\
    \ applies the modification"
  merge: -1
  img_proc: true
- pgno: 369
  md: 'needed, ensuring that it will not cause any interruption. This automation ensures
    if it detects any issue during the new configuration, a possibility to revert
    the changes will be there.


    +   - **Resource provisioning:** Provisioning resources can involve to create
    new systems, such as virtual machines, virtual networks, or storage. The adoption
    of virtualization and containers converted this automation as essential.


    +   - **Orchestration:** Modern infrastructures require multiple elements to be
    configured in parallel before reaching the desired status. Orchestration is responsible
    for coordinating and configuring the desired status inside the infrastructure.


    +   - **Infrastructure as code:** A declarative definition of the desired infrastructure,
    where the automation tool will ensure to complete of all the needed tasks to accomplish
    the objective. Adoption of the Cloud popularized the tools using this approach.


    Simple automation tools can be performed using shell scripting (also known as
    *bash scripting*) or using some popular programming language tool, such as *Python*.
    Linux offers multiple open-source, available tools for IT automation with different
    purposes:


    +   - **Ansible:** The most popular general automation tool nowadays. Based on
    *playbooks* with *YAML* definition, it allows to automate of multiple elements,
    such as Linux and Windows systems, network devices, cloud infrastructures, and
    much more. One of the biggest advantages compared with other solutions is that
    it does not require an *agent* and uses protocols such as *SSH* and *WinRM* to
    administrate the systems.


    +   - **Terraform:** One of the commonly used automation tools for *Infrastructure
    as Code*. It allows to create immutable infrastructure in different cloud and
    virtualization platforms.


    +   - **Chef:** A configuration management and infrastructure automation tool
    based by default on an architecture server-client.


    +   - **Puppet:** Configuration management with a declarative language to describe
    the desired system configuration, which requires a basic knowledge of programming.'
  merge: -1
  img_proc: true
