  md: '# Network monitoring


    Network monitoring consists in observe the traffic flow constantly or during a
    period to detect issues. It can also be used to detect attacks or to perform troubleshooting
    related to the network configuration in the system. This section will focus on
    the popular tools tcpdump and wireshark.


    The command **tcpdump** is a powerful command-line packet analyzer with the possibility
    to save the captured data to a file or read the data from a file. It allows to
    read in a specific interface or in all interfaces in the system. The command can
    be executed with options and arguments, and it will show the traffic generated
    in the first network interface. The arguments in the command **tcpdump** are to
    specify filters, for example, only capture packets originated from a specific
    IP. The common options are explained in the following table:


    | Option | Description |

    |---|---|

    | -A | Print each packet (minus its link level header) in ASCII. |

    | -c count | Exit after receiving count packets. |

    | --count | Print only on stderr the packet count when reading capture file(s)
    instead of parsing/printing the packets. |

    | -D, --list-interfaces | Print the list of the network interfaces available on
    the system and on which tcpdump can capture packets. |

    | -e | Print the link-level header on each dump line. Useful to debug protocol
    information. |

    | -i interface<br>-i interface=interface | Uses the interface specified or with
    word any for all of them. |

    | -n | Do not convert addresses to names. |

    | -r file | Read packets from a file. |

    | -w file | Write the raw packets to file rather than printing them out. |

    | -v | Verbose output |


    *Table 8.4: Common options for the command tcpdump*


    The following figures show different examples using the command **tcpdump**.


    +   - List all the interfaces usable in the system, as shown in *figure 8.29*:'
