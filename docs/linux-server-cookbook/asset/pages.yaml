  md: '# Directories storing libraries


    Linux applications use libraries to be able to operate and perform different

    operations. These libraries can be available already in the system or can be

    installed libraries, which are automatically installed as dependencies when new

    software is installed in the system. Some libraries are a virtual library provided
    by

    the Linux Kernel. The directories keeping libraries are as follows:


    +   • /usr/lib/, /usr/lib64/, and /usr/lib32/ (directories linked to /lib/, /lib64/,
    and /lib32/: It is globally accessible for all the applications in the system.


    +   • /usr/local/lib/, /usr/local/lib64/, and /usr/local/lib32/: Contains libraries
    for the software installed that does not use Linux distribution packages.


    It is important to mention that the purpose of the directory /var/lib is not to

    contain libraries but some variable state information for applications.


    # Directories storing variable data


    The top directory containing data, which is not static, is /var/. The standard

    directories inside are shown in table 5.3:


    | Directory | Contains |

    | --- | --- |

    | backups/ | The copies of Backup applications are stored here |

    | cache/ | Temporary files for different applications. |

    | crash/ | If one application crash generates a file in this directory. |

    | lib/ | Variable state information for applications. |

    | local/ | Variable data for applications installed outside of the regular Linux
    distribution packages. |

    | lock/ | Lock files indicating the application is using some resource. |

    | log/ | Log files and directories inside. |

    | mail/ | Mail local files for users |

    | opt/ | Optional files |

    | run/ | A link to /run/ directory |

    | spool/ | Contain files which should be treated later, such as print jobs. |

    | tmp/ | Temporary directory |'
