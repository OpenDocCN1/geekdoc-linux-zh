- pgno: 413
  md: "+   7. Play option `vars_prompt`  \n+   8. Play option `vars_files`  \n+  \
    \ 9. Role vars (defined in `role/vars/main.yml`)  \n+   10. Block vars (only for\
    \ tasks in the block)  \n+   11. Task vars (only for the task)  \n+   12. Task\
    \ `include_vars`  \n+   13. `set_facts` / registered vars  \n+   14. role (and\
    \ `include_role`) params  \n+   15. include params  \n+   16. extra vars (for\
    \ example, -e “`user=my_user`”) (always win precedence)\n\n# ## Handlers\n\nA\
    \ **handler** is a task that will be executed only if another task is triggering\
    \ it. One of the most common use cases is to define a **handler** to restart a\
    \ service. This task will be only triggered if a configuration file is modified.\
    \  \nTo define a **handler**, a task or several tasks will be defined inside the\
    \ section **handlers**. The task to trigger the action will use the special keyword\
    \ named **notify**. A task can notify several **handler tasks**. The following\
    \ code shows an example:\n\n```\n```\n- name: Configure the httpd service\n  hosts:\
    \ rhel\n  gather_facts: False\n  become: True\n  tasks:\n    - name: Copy the\
    \ httpd.conf file\n      ansible.builtin.copy:\n      src: httpd.conf\n      dest:\
    \ /etc/httpd/conf/httpd.conf\n      notify:\n      - Restart httpd\nhandlers:\n\
    \  - name: Restart httpd\n```\n```"
  merge: -1
  img_proc: true
