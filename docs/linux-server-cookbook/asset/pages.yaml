    The option `listen` indicates that if the service will be executed in standalone
    mode (YES) or using `systemd` (NO). The option `local_enable` indicates if the
    local users can log in, and the option `anonymous_enable` specifies if guest users
    can connect to the service.


    One of the features of the FTP servers is that users, when connecting to the service
    can access the files in their home directory. They can download, create directories
    or upload files to the server.


    The most popular client in a Linux system to access the FTP service is the software
    `lftp`. This client allows to perform the normal tasks for FTP but also allows
    access to other protocols such as **Hypertex Transfer Protocol (HTTP)**, **Hypertex
    Transfer Protocol Secure (HTTPS)**, **File transferred over Shell protocol (FISH)**,
    and **Secure File Transfer Protocol (SFTP)**. It also supports the BitTorrent
    protocol. The argument required is to specify the destination; if the destination
    is an IP address, it will, by default, use FTP as a protocol. For other protocols,
    it is required to specify the method, such as `ftps://` or `http://`. The options
    for authentication are `-u` to specify the username and optionally the username
    and the password separated by a comma (,). `Figure 10.15` shows an example:


