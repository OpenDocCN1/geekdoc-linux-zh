  md: "# **UPDATE statement**\n\nThis statement is used to update rows existing in\
    \ a table, the syntax as shown:\n\n```\n    UPDATE <target_table>\n    SET <col_name>\
    \ = <value> [ , <col_name> = <value> , ... ]\n    [ FROM <additional_tables> ]\n\
    \    [ WHERE <condition> ]\n```\n\nThe following example will update the field\
    \ **phone** for the user with the name *Alberto* in the field *name*. As this\
    \ field is not *unique*, this operation can update several records if the name\
    \ is duplicated.\n\n```\n    UPDATE students SET phone = \"657225520\" WHERE name\
    \ = \"Alberto\";\n```\n\n# **DELETE statement**\n\nThis statement is used to remove\
    \ rows from an existing table. The syntax is as follows:\n\n```\n    DELETE FROM\
    \ <table_name>\n    [ WHERE <condition> ]\n```\n\nIn most of the cases, it is\
    \ important to use the clause **WHERE** to limit the records to be removed. If\
    \ it is not specified, all the records will be removed. The following example\
    \ removes the student with the associated *id* to the number 1.\n\n```\n    DELETE\
    \ FROM students WHERE id = 1;\n```\n\n# **GRANT statement**\n\nAssign privileges\
    \ to user accounts and roles. Syntax is complex and depends of the database system\
    \ used, the basic syntax is as follows:\n\n```\n    GRANT privilege\n    ON object_type\n\
    \    TO user_or_role;\n```\n\nFor example, to provide full access to the user\
    \ *agonzalez* when it is connecting from localhost to the previous database created\
    \ called the *school*, the following syntax will perform the action:\n\n```\n\
    \    GRANT ALL_PRIVILEGES ON school.* TO 'agonzalez@'localhost';\n```\n\n# **REVOKE\
    \ statement**"
