  md: '+   • Redis or MongoDB: These NoSQL are used for the Telemetry Service.


    The Controller nodes are usually three to guarantee the correct functionality
    of the system and provide high availability to the services. The number of Compute
    nodes depends on the resources for each of them and the needs of the end users.
    There are the following five main use cases for OpenStack these days:


    +   • Telco Companies: These companies require a big performance and high bandwidth
    to offer telecommunication services to customers. OpenStack provides different
    options to increase performance, such as Real Time Kernel and Huge Pages. For
    data path networking, it is possible to use SRIOV or DPKD, among other solutions.


    +   • Service Providers: These kinds of companies need the flexibility to create,
    scale, and delete services. OpenStack is a good solution to reduce operational
    costs.


    +   • Development: Having a Private Cloud helps developers speed up the process
    and perform the testing.


    +   • Artificial Intelligence and Machine Learning (AI/ML): These technologies
    require access to special hardware to perform operations, such as a Graphical
    Process Unit (GPU). OpenStack is a perfect platform to run Virtual Machines to
    use virtual GPUs (vGPUS).


    +   • Edge Computing: The current trend is to decentralize the infrastructure
    to have nodes to perform tasks in a different location. OpenStack allows it to
    be installed and contain Edge nodes.


    # Running virtual machines on OpenStack


    To operate with OpenStack, it is required to have the address to perform the authentication,
    a valid username, the password, and the project to be used. The authentication
    is performed against Keystone, which uses port 5000/tcp or 1300/tcp (TLS protected)
    to accept the requests. It is possible to specify the authentication data to the
    OpenStack command line client in the following three different ways:


    +   • Using the file c clouds . yaml, which can include different configurations
    for multiple installations. The environment variable OS_CLOUD or the option –os-cloud
    is used to specify the authentication to be used. This file can be located in
    the following directories, with the first having more priority:'
