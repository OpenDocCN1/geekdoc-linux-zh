    # ## Automation with shell scripting


    A *shell script* is a program executed by the *Linux shell*. As the most popular
    *shell* historically is *bash*, it is also called *bash script*. The *script*
    contains different operations to be performed, such as running commands, setting
    variables, and showing text on the screen. Furthermore, the *script* can contain
    conditions and loops.


    *Shell scripting* is the action of writing *shell scripts*. These scripts help
    to reduce repetitive tasks in the systems, and it helps to create logic during
    the execution. The *file* containing the operations usually has a ".sh" file extension.
    The *scripts* require to have execution permission to be executed or can be evoked
    through the commands *sh*, *bash*, or another *shell* command (*zsh*, *csh*, or
    *ash*).


    A *shell script* can call to commands available in the system or to *builtin functions*
    provided by the *shell*. The following code shows a simple example using the *builtin
    function* called *read* and the Linux command *echo*.


    ```

    #!/bin/sh

    read  -p "What is your name? " NAME

    echo  "Your name is: $NAME"

    ```


    The first line is called *shebang*, and it indicates which executable will interpret
    the code defined in the file. The second line asks the user to input data and
    sets the value in the variable named *NAME*. The third line shows the text on
    the screen as well as the value of the variable. *Figure 12.1* shows the execution
    and the output:'
  merge: -1
  img_proc: true
