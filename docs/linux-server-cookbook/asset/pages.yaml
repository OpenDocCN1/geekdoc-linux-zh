    are using the *system logging* service in the system to store the *logs* on it.
    The service more popular on Linux for that purpose is **syslog-ng**.


    The modern infrastructure uses a centralized log aggregation service, where the
    systems are streaming the system and service logs to that service. Popular log
    collectors are *logstash* and *fluentd* projects. Using a centralized logging
    system eases the log filtering and creation of alerts for all the Linux systems
    and services in the network. Projects *Grafana* and *Kibana* are popular solutions
    for the visualization of logs.


    # Intrusion detection system


    Linux provides several popular options for *Intrusion Detection Systems*, such
    as detecting files integrity, connection attacks, or unauthorized access to the
    system. Some of these options are as follows:


    +   - **Tripwire**: Detects unauthorized filesystem changes.

    +   - **Fail2ban**: Protects a Linux system from brute-force attacks. It works
    by reading logs and configuring the firewall to block IPs trying attacks.

    +   - **Snort**: A **Network Intrusion Detection System** inspects all inbound
    and outbound network activity and identifies suspicious patterns which can indicate
    attacks.


