    # Directories storing configurations


    The main directory to store configuration globally in the system is /etc/, which
    contains configuration for system tools, services, and stores as described earlier.
    This directory contains configuration files and subdirectories containing configurations.
    Some file configuration examples are shown in *table 5.1*:


    | File(s) | Description |

    | :--- | :--- |

    | **passw****d, group** | Contains a user list and group information |

    | **resolv.****conf** | Contains DNS resolution configuration |

    | **hosts** | Contains a map list between DNS names and IPs |

    | **fstab** | Contains the filesystems and mountpoint configuration |

    | **sud****os** | Contain the definition of administrator commands, which regular
    users can execute. |


    *Table 5.1: Files examples inside /etc/ directory*


    Some directories configuration examples are shown in *table 5.2*:


    | Directory | Contains |

    | :--- | :--- |

    | **defaul****t/** | Some default configurations for applications |

    | **system****d/** | Definition and configuration for **system****d** |

    | **ssl/** | Public and private SSL certificates and configuration. |

    | **securit****y/** | Security configuration related to system and users. |


    *Table 5.2: Directories examples inside /etc/ directory*


    Some applications executed by regular users use a directory named .c****o****nf****ig**
    (directories starting with a dot [.] in Linux are hidden) in their home directory
    to store configuration for the different applications. Other applications use
    their own directory to store the configuration.


    +   * Chromium browser will store the configuration and temporary files under
    /<home>/<username>/.config/chromium/

    +   * SSH tools will store the configuration under /home/<username>/.ssh/ directory.'
