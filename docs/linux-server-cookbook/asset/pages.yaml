- pgno: 553
  md: '# ## CHAPTER 16


    ### Infrastructure as a Service


    # #### Introduction


    This chapter will detail what **Infrastructure as a Service (IaaS)** is and its
    different usages. This type of *Cloud* offers compute, storage, and network resources
    (among other resources) on demand. Users will access a platform to request the
    virtual resources needed.


    The previous chapter explained the common services offered by the popular *Public
    Clouds* and introduced **OpenStack** as a *Private Cloud* solution. This chapter
    will deepen on the options available for the *Private Cloud* and the term *Hybrid
    Cloud*.


    This chapter will describe how to operate an **OpenStack** platform, explaining
    all the elements required to run *Virtual Machines* and access them.


    # #### Structure


    In this chapter, we will discuss the following topics:


    +   - Infrastructure as a Service

    +   - Private Cloud

    +   - Hybrid Cloud

    +   - OpenStack as an IaaS

    +   - Running virtual machines on OpenStack


    # #### Infrastructure as a Service


    The concept of *Infrastructure as a Service* consists of converting the resources
    on a traditional on-premise data center to an infrastructure based on the *Cloud*
    model. In this model, the resources are virtualized and offered to the users to
    be consumed. Some of the important characteristics offered by this service are
    as follows:


    +   - A self-service API to perform new requests, query, or manipulate resources.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '+   - A Web-based self-service portal to ease operations.

    +   - High availability services to provide the best uptime possible.

    +   - Replication of the data stored to avoid data loss.

    +   - Physical resource optimization to provide the best performance on virtual
    resources offered.

    +   - Security of the data with secret management and encryption of the data.


    The primary components virtualized to be offered to the consumers are as follows:


    +   - **Computing resources:** Run *Virtual Machines* in a controlled environment.

    +   - **Networking resources:** Networks, subnets, switches, firewall, and routers
    can be used as virtual elements.

    +   - **Storage resources:** Disks, file systems, or object containers can be
    consumed.


    In an *Infrastructure as a Service*, the provider is the one responsible for managing
    the underlay physical resources, and the user is only responsible for managing
    the virtual components and the configuration for the virtual resources consumed,
    such as the operating system for a virtual machine created or the application
    running on it. Figure 16.1 features an Infrastructure as a Service diagram:


    ![](img/863afa537de4eed7deb11978bfbfa90e_554_0.png)'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# ## Private Cloud


    In a *Private Cloud*, the resources are only shared via the internet or private
    network to a specific user or organizations. Companies can decide on a *Private
    Cloud* for one of the following reasons:


    +   - **Privacy:** Some enterprises require the data and the resources to be under
    their own responsibility.


    +   - **Cost control:** The cost of a *Public Cloud* can be increased if it is
    not controlled or estimated properly. Having a *Private Cloud*, the costs are
    fixed and not related to the usage.


    +   - **Multicloud:** As described in the previous chapter, it is possible to
    have a *Private Cloud* to perform development and test and, for production, to
    use a *Public* one.


    A *Private Cloud* requires a dedicated team or teams responsible for managing
    the infrastructure (such as servers, physical network devices, data center, and
    so on), the platform providing the services, and the support for the services
    offered. The team or teams are also responsible for scaling up the infrastructure
    when needed to provide more resources to end users.


    The underlay infrastructure in a *Private Cloud* has to ensure the following considerations:


    +   - The system resources, such as memory and CPU, should be sufficient for the
    requirements of the tenants using the platform.

    +     - *Overcommitment* is a technique used to provide more resources (memory
    or CPU) than the available ones. In most of the cases, a *Virtual Machine* is
    not using all the resources dedicated to them.


    +   - The traffic between the different networks should be isolated for security
    while avoiding bottleneck. For example, the storage network should not affect
    the *Virtual Machines* traffic.


    +   - Infrastructure should operate in a *High Availability* mode. This reduces
    the **single point of failure (SPoF)** having redundant devices, such as power
    supply, Ethernet cards, switch, and so on.


    A *Private Cloud* is a complex environment that requires a good architecture design
    and a maintenance plan to avoid unexpected downtime and degradation of the services
    offered. Different Open-Source enterprise-ready projects are available for building
    a *Private Cloud*; some popular examples are as follows:'
  merge: -1
  img_proc: true
- pgno: 556
  md: '+   * **OpenStack**: A *Cloud Computing* solution for providing multiple services
    to end users.

    +   * **Ceph**: A software-defined storage solution to provide block, file, and
    object storage.

    +   * **Open Virtual Network (OVN)**: A software-defined network solution on top
    of *Open vSwitch* (a distributed virtual multilayer switch implementation).


    *Public Clouds* offers the possibility of having a *Private Cloud* on-premise
    integrated with the *Public Cloud*. The options and descriptions are as follows:


    +   * **Azure Stack**: A portfolio of products that extend *Azure services* and
    capabilities to customer’s environments of choice—from the *datacenter* to *edge
    locations*. The hardware needs to be certified by *Azure*.

    +   * **AWS Outposts**: It is possible to run *AWS services* locally and connect
    to a broad range of services available in the local *AWS Region*. The hardware
    needs to be bought directly from *AWS*.

    +   * **Google Anthos**: It allows building and managing modern applications on
    *Google Cloud*, existing on-premises environments, or public cloud environments.
    It enables consistency between on-premises and cloud environments.

    +   * **Alibaba Cloud Apsara Stack**: A full-stack cloud solution designed for
    enterprise-level customers that require a highly capable and flexible *Hybrid
    cloud* solution. Hardware needs to be certified by *Alibaba Cloud*.


    # Hybrid Cloud


    The term *Hybrid Cloud* refers to the combination of computing, storage, networking,
    and services between different environments. It is usually the combination between
    a *Private Cloud* and a *Public Cloud*. As described in the previous chapter,
    one of the reasons to work with multiple *Clouds* is for avoiding vendor lock-in
    as well as reducing costs. Modern applications require an environment to be developed
    and tested because it is difficult for a developer to use a local system.

    *Private Cloud* in a *Hybrid* environment can be used for that purpose: for developing
    new applications and testing them. **Continuous Integration (CI)** and **Continuous
    Delivery (CD)** can be used for the development process. The release'
  merge: -1
  img_proc: true
- pgno: 557
  md: 'of the applications can be performed on the *Public Cloud* when the tests and
    the required approvals are performed.

    The *Public Cloud Providers* offer the possibility of communicating between both
    environments through a secure and private connection. *Figure 16.2* features a
    Hybride Cloud diagram:


    ![](img/863afa537de4eed7deb11978bfbfa90e_557_0.png)


    # ## OpenStack as an IaaS


    In the previous chapter, an introduction to **OpenStack** was described, including
    a list of the core components and other useful ones. This section will cover the
    architecture of **OpenStack**, its main use cases, and its advantages compared
    to a *Public Cloud*.

    In an **OpenStack** cluster, there are two main types of nodes providing computing
    services:


    +   * **Controller nodes**: They are servers running the database, queue services,
    load balancers, and **OpenStack** services accessible via *API*. These nodes include
    networking and storage services.'
  merge: -1
  img_proc: true
- pgno: 558
  md: '+   * **Compute nodes:** They run *Virtual Machines*, and they are responsible
    for the correct functioning.


    Other types can be part of the cluster depending on the use case and the needs,
    for example:


    +   * **Block storage nodes:** Nodes responsible for the storage, called *Volumes*,
    to be used by the *Virtual Machines*.

    +   * **Object storage nodes:** Nodes responsible for the objects; it stores the
    *images* to be used by *Virtual Machines* and other unstructured data.


    *Figure 16.3* represents an architecture example for **OpenStack**. It includes
    the core (controllers and compute) nodes and optional ones (Block and Object storage).
    Please refer to the following figure:'
  merge: -1
  img_proc: true
- pgno: 559
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_559_0.png)


    Figure 16.3: OpenStack architecture


    The Networking configuration on OpenStack can be simple for development or proof
    of concept clusters or complex when the cluster is for production purposes. There
    are the following six main networks required in a production-ready installation
    when network isolation is used:


    +   - Control Plane (also known as Provisioning): Used in development or installations
    without network isolation as the only one network. In a production-ready environment,
    this network is used for provisioning and management.'
  merge: -1
  img_proc: true
- pgno: 560
  md: '+   - **Internal API:** Communication to the *Services API* between the services.
    For example, the **nova** service (responsible for computing) communicates with
    the **neutron** service (responsible for networking) using this network.


    +   - **Tenant:** Used by the *Virtual Machines* in the east-west traffic (communication
    between *Virtual Machines*) and the north-south traffic (from or to outside the
    *cluster*).


    +   - **Storage:** Traffic generated from and to the systems providing the storage
    to **OpenStack**.


    +   - **Storage Management:** Traffic used internally between the systems involved
    in the *Storage* systems.


    +   - **External:** Used to provide external access from outside the cluster.
    The *Network* is used to provide an external address to be used for *API*, *Web
    access*, and access to the instances running on **OpenStack**.


    An additional network called **Management** can be configured to access the cluster
    nodes to be administrated, usually only accessible by the teams who administrate
    the cluster. *Figure 16.4* shows a network layout for **OpenStack**:'
  merge: -1
  img_proc: true
