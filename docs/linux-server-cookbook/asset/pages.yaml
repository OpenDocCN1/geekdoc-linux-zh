    | write | w | 2 |

    | execution | x | 1 |


    Table 5.7: Permission presentation in symbol and octal


    When assigning permissions in symbol representation, the owner is represented
    with the character $u$, the group owner with the character $g$, and other users
    with the letter $o$. The permission $u=rwx$, $g=rw$, $o=r$ indicates:


    +   - The user owner is able to read (r), write (w), and execute (x) the file.

    +   - The group members associated to the file would be able to read and write
    the file but not execute it.

    +   - Other users can read the file but not write or execute it.


    The permission $u=rwx$, $g=rx$, $o=$ indicates:


    +   - The user owner is able to access the directory (x), able to read the content
    (r), and create new files (w).

    +   - The group members associated with the directory would be able to access
    to a directory (x) and able to read the content of the directory (r) but do not
    write new files.

    +   - Other members are not going to be able to access the directory as they don’t
    have execution permission (x).


    The octal representation is the sum of the permissions desired to assign. For
    example, for permission, $read$ and $write$ is indicated with the number 6 (4+2).
    The first digit is for the user owner, the second for the group owner, and the
    last one for others. The representations shown before as character representations
    and other examples are illustrated in table 5.8:


    | Symbol representation | Conversion | Octal representation |

    |---|---|---|

    | u=rwx,g=rw,o=r | u=4+2+1,g=4+2,o=4 | 764 |

    | u=rwx,g=rx,o= | u=4+2+1,g=4+1,o=0 | 750 |

    | u=rwx,g=rwx,o=rx | u=4+2+1,g=4+2+1,o=4+1 | 775 |

    | u=rw,g=rw,o=r | u=4+2,g=4+2,o=4 | 664 |


    Table 5.8: Permission conversion examples


