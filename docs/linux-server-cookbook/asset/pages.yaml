  md: "# Templates\n\nA template is a dynamic file that includes variables and different\
    \ statements: conditions, loops, and so on. These templates use the language Jinja2,\
    \ which eases the definition of the templates, and YAML is easy to read. Table\
    \ 12.11 shows the available popular syntax to be used in a Jinja2 template file:\n\
    \n| **Type** | **Syntax** | **Example** |\n| :--- | :--- | :--- |\n| Variables\
    \ | `{{ variable }}` | `{{ ansible_fqdn }}` |\n| Condition | `{% if expression\
    \ %}`<br>`statements`<br>`{% elif %}`<br>`statements`<br>`{% else %}`<br>`statements`<br>`{%\
    \ endif %}` | `{% if purpose == \"production\" %}`<br>`ALERT: This is a production\
    \ system.`<br>`{% else %}`<br>`This is NOT a production system.`<br>`{% endif\
    \ %}` |\n| Loop | `{% for variable in list %}`<br>`statements`<br>`{% endfor %}`\
    \ | `allowed_users:`<br>`{% for user in userlist %}`<br>`- {{ user }}`<br>`{%\
    \ endfor %}` |\n| Comment | `{# text #}` | `{# This a comment #}` |\n\n*Table\
    \ 12.11: Jinja2 template syntax*\n\nThe module **template** processes the template\
    \ where the Ansible tool is executed (such as ansible-playbook), and the processed\
    \ file is transferred to the administrated host. The following template shows\
    \ how to fill the file /etc/hosts with the hosts in the Inventory.\n\n```\n```\n\
    127.0.0.1 localhost localhost.localdomain localhost4\n::1           localhost\
    \ localhost.localdomain localhost6\n{% for host in play_hosts %}\n{{ hostvars[host]['ansible_default_ipv4']['address']\
    \ }} {{ host }}\n{% endfor %}\n```\n```\n\nThe example task to process the template\
    \ is as follows:\n\n```\n```\n- name: Fill /etc/hosts\n  ansible.builtin.template:\n\
    \  src: hosts.j2\n```\n```"
  merge: -1
  img_proc: true
- pgno: 423
  md: "dest: /etc/hosts\n\n# Blocks\n\nAnsible allows to group several tasks in a\
    \ Block. This allows to specify a different parameter such as become, become_user\
    \ or user. The expression used to define a Block is block, and it contains a list\
    \ of tasks. The following code shows a Play example using a block:\n\n```\n- name:\
    \ Block example\n  hosts: linux\n  become: True\n  tasks:\n    - name: Install\
    \ and configure Ubuntu systems\n      when: ansible_distribution == \"Ubuntu\"\
    \n      block:\n        - name: Install required packages\n          ansible.builtin.apt:\n\
    \            name: \"{{ item }}\"\n          loop:\n            - apache2\n  \
    \          - php\n            - php-mysql\n        - name: Generate index.html\
    \ file\n          ansible.builtin.copy:\n            content: \"Hello to {{ ansible_hostname\
    \ }}\"\n            dest: /var/www/html/index.html\n```\n\n# List of popular modules\n\
    \nAnsible brings a big number of the core modules to perform a wide variety of\
    \ tasks in the managed hosts. The following list shows some of the modules inside\
    \ the ansible.builtin collection:\n\n+   - add_host: Add a host (and alternatively\
    \ a group) to the ansible-playbook in-memory inventory.\n+   - apt: Manages apt-packages."
  merge: -1
