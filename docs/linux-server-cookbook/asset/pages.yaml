  md: '# CHAPTER 3


    # Using the Command Line Interface


    # Introduction


    To administrate a Linux server either locally or remotely, it is fundamental to
    have knowledge about the **Command Line Interface (CLI)**. This text-based interface
    is used to perform different tasks in a Linux distribution, from simple tasks,
    such as to create a directory, to advanced ones, such as configuring network and
    storage. A user is connecting to a Linux console, indicating the command to perform
    the task desired with the options and arguments required for the action.


    In this chapter, the different terminals available to run commands will be described,
    as well as the possible configurations and commands to identify the system components
    and system information. This chapter will also explore how the commands will show
    the output to the display, how to redirect that output, and also the method to
    use it as input for another application.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - Linux console and prompt

    +   - Use of basic first CLI commands

    +   - CLI commands to identify resources

    +   - CLI commands to list elements

    +   - Explanation of standard streams and pipes

    +   - CLI commands for data stream


    # Linux console and the prompt'
  merge: -1
  img_proc: true
