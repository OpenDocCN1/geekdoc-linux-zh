    \ it is marked as *skipped*.\n+   • The value *rescued* is for the use of error\
    \ handling, and *ignored* is used when unreachable hosts are marked as ignored.\n\
    \nWhen a *Playbook* is executed, the first task is to gather the *facts*. The\
