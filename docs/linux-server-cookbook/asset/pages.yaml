    \ the primary was not possible.\n+     - How long a secondary will still consider\
    \ the zone valid if communication with the primary is not possible.\n+     - If\
    \ a client queries for a record that does not exist, specify how the client will\
    \ receive the same message before to check again.\n\n+   - The *name* server (NS\
