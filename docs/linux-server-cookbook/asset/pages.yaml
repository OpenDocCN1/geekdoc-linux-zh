- pgno: 481
  md: '# # CHAPTER 14


    # ## Backup and Restore


    # ### Introduction


    Backup is the process of creating a copy of the data in a certain time with the
    objective of being able to recover it in the future. Restore is the process of
    recovering the data from a Backup, going back to an old version of the data, or
    reinstating a missing one. Backup requires a good definition, as well as planning
    and regular tasks to ensure the integrity of the copies.


    This chapter covers the different strategies available for the Backup and how
    it affects Restore. The storage media where Backup can be stored is discussed,
    as well as the different locations to protect the copies from possible disasters.
    Backup Solutions includes different features to optimize the process, reducing
    the size stored with compression and removing duplicates, among other features.
    Two popular software are detailed in this chapter are Bacula and Relax and Recover
    (ReaR).


    # ### Structure


    In this chapter, we will discuss the following topics:


    +   * Introduction to backup and restore

    +   * Storage media for backups

    +   * Backup types

    +   * Backup sources

    +   * Backup strategies

    +   * Backup solution features

    +   * Bacula

    +   * Relax-and-recover (ReaR)


    # ### Introduction to backup and restore'
  merge: -1
  img_proc: true
- pgno: 482
  md: 'The **Backup** process, and with it the **Restore** process, has evolved along
    with the big transformation in the **IT sector**. Big enterprises have dedicated
    teams to configure the target environment and the clients and are responsible
    for the planning as well. Good **Backup** planning is essential to avoid data
    loss, accelerate the recovery time, and perform tasks periodically to ensure the
    **Restore** is viable.


    A **Backup** strategy requires to define of the following factors:


    +   - **The data to be included**: This is an important decision to take for many
    reasons, such as the size that the **Backup** will need, as well as the **Restore**
    time needed. For example, a **Backup** can include all the files from a system
    or only the files needed to reinstate after the system is reinstalled with a fresh
    *Operating System* installation.


    +   - **The frequency**: It is important to define how often the **Backup** is
    going to be performed. The planning should include per environment frequency to
    be daily, weekly, monthly, or another specified period.


    +   - **Backup method to use**: There are several methods to make copies, which
    are going to be explored in this chapter. This includes a **Full**, **Differential**,
    or **Incremental Backup**, among others.


    +   - **The window-time for backups**: A **Backup** can be a long-time process,
    especially for **Full** ones, and can consume resources and network bandwidth.
    Deciding the window time to perform is one factor to be included in the planning.


    +   - **Backup storage media**: A Backup usually generates several copies to protect
    against disaster scenarios. Different media can be used to store, such as *Tape*,
    *Shared Storage*, or *Cloud Storage*.


    +   - **Retention**: **Backup** planning should define the retention of the data,
    and after that period, the copies would be removed to save space in the storage
    media.


    For the **Restore**, the important factors in defining the recovery are as follows:


    +   - **How Restore will be performed**: A **Backup** can include all the data
    required to restore a system or only those required for a service offered.'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'It is important to define if the recovery process will be performed in the
    same system, if possible, or in a new one.


    +   * **How fast a Restore needs to be:** Recovering data from a **Backup** can
    take longer, depending on the strategies used. The planning should thus include
    what is an acceptable time to reinstate files and services from a copy.


    +   * **Restore procedures:** Each system, service, or element included in the
    **Backup** should have a **Restore** procedure associated in case of data loss.


    +   * **Restore test plan:** A **Backup** without regular recovery testing cannot
    ensure that the **Restore** procedures are the proper ones.


    The overall **Recovery** goals are defined with two terms as follows:


    +   * **Recovery Time Objective (RTO):** the maximum duration of time to restore
    a disruption of the service in order to avoid unacceptable consequences. For example,
    for a non-critical environment, it can be hours or days, and for critical environments,
    it can be specified in minutes.


    +   * **Recovery point objective (RPO):** the maximum targeted period during which
    the data is lost due to an incident.


    *Figure 14.1* shows a diagram representing the terms **RTO/RPO**:'
  merge: -1
  img_proc: true
- pgno: 484
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_484_0.png)


    Figure 14.1: Terms RPO/RTO represented. Source: Wikipedia.


    It is important to remark that a Distributed Storage Solution (such as Ceph),
    High Availability systems, or Mirroring Technologies (such as RAID) are not Backup
    solutions, and they do not replace a proper strategy to protect the data. These
    days, with the adoption of Containers and the Cloud, the strategy to ensure the
    data is protected has evolved. Different concepts covered throughout this book,
    such as Automation, Micro Services, Infrastructure as Code, and DevOps, have helped
    the requirement to be included in a Backup, which is the only data used by the
    service consumer. Recreating environments is a fast and easy task on modern infrastructures,
    but the importance of Backup and Restore for the data is still really important.


    The Restore task might be needed in the following cases:


    +   * Quick restore from a local copy: For example, if the automation is deploying
    a new configuration for a service and it is not valid, it is possible to restore
    the previous version.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '+   * **Restore files from a Backup solution**: Data loss can be caused by
    human mistakes, application misbehavior, external attacks, or hardware dame (such
    as disk problems).

    +   * **Restore full system**: That can include restoring a Virtual Machine or
    a Physical system. Modern **Backup** solutions allow performing a copy of a running
    system and the possibility of restoring it in the same system or in a new one.


    # Storage media for Backups


    First, enterprise **Backups** were stored on physical tapes, where individual
    files were included in the copy. The **Restore** process is required to find the
    proper tape where the data to be recovered is located and then copy it from there
    to the system. More modern solutions were based on *Tape Libraries* (also known
    as *Tape Robot*), which included several tapes, and they automatically mount the
    desired tape to perform a **Backup** or **Restore**. **Virtual Tape Library**
    (VTL) simulates a *Tape Library* having the back-end of a regular storage system,
    such as a hard drive. One of the biggest advantages of the usage of tapes, even
    these days, is the possibility of storing them easily off-site (in a different
    location where the original data is).


    The popularity of tapes as storage media for **Backups** was present until the
    first decade of the 21st century. The reduction of the cost of hard drives and
    the introduction of **Cloud Storage**, along with different work methodologies,
    such as **DevOps**, reduced the use of tapes in enterprises. **Network Storage**
    solutions such as *NFS*, *iSCSI*, and *NAS* are used to store data from **Backups**.
    Nonetheless, it is important to keep a copy in a different location (such as a
    different *Data Center*) from the original data.


    Modern environments use **Object Storage** to store data, including **Backup**
    data. Public clouds offer affordable storage to store *Objects*. An **Object Storage
    System** places the unstructured data as opposite to regular file systems. The
    *Object* (file) to be stored cannot be modified but can only be replaced with
    a version. Some available options are as follows:


    +   * **Amazon Web Services (AWS)** offers a cheap solution called **Amazon S3
    Glacier** for archiving and backup.

    +   * **Microsoft Azure** offers the service **Azure Archive Storage**.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '+   * **Google Cloud** offers **Cloud Storage** solution for archives and backups.

    +   * Private cloud **OpenStack** offers the solution, **Swift**.

    +   * Software-defined storage solution **Ceph** has a component called **Rados
    Gateway (RGW)** to offer an **Object Storage** service.


    # Backup types


    There are the following three main types of **Backup**:


    +   * **Full Backup**: It contains all the data to be copied. This type does not
    mean that the whole system will be copied; rather, it means that all the data
    specified to be copied will be included in the **Backup** performed. The main
    advantage and disadvantage are as follows:

    +     * **Advantage**: Recover time is fast because all the data is included.

    +     * **Disadvantage**: The space needed is big, and each **Backup** performed
    requires all the space. For example, if the data to be saved is 1 TB, and it is
    needed to have 30 different **Backups**, the total size will be 30 TB.

    +   * **Incremental Backup**: Only transfer the data changed from the previous
    **Backup** performed and the current time. This procedure reduces the space needed.
    The main advantage and disadvantage are as follows:

    +     * **Advantage**: The required space and the time to perform the **Incremental
    Backup** is reduced considerably.

    +     * **Disadvantage**: The **Restore** requires more time because it is required
    to go through several **Backup** performed.

    +   * **Differential Backup**: This method transfers only the difference between
    the previous **Full Backup** and the moment where the **Backup** is being performed.
    The main advantage and disadvantage are as follows:

    +     * **Advantage**: The **Restore** process requires less references than the
    **Incremental** one; it only requires the **Full Backup** and the specific **Differential
    Backup**.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '+   - **Disadvantage:** The size of the copy is bigger than in an **Incremental**
    one.


    **Table 14.1** shows an example of the schedule for a **Backup** where the **Full
    Backup** is performed on Sunday when it would generally not impact the service
    or end users. For the rest of the days, the **Incremental Backup** is used.


    | Day | Backup type | Backup size | Total Backup size |

    | :--- | :--- | :--- | :--- |

    | Sunday | Full Backup | 1 TB | 1 TB |

    | Monday | Incremental Backup | 20 GB | 1.02 TB |

    | Tuesday | Incremental Backup | 100 GB | 1.12 TB |

    | Wednesday | Incremental Backup | 200 GB | 1.32 TB |

    | Thursday | Incremental Backup | 500 GB | 1.82 TB |

    | Friday | Incremental Backup | 80 GB | 1.90 TB |

    | Saturday | Incremental Backup | 100 GB | 2 TB |

    | Friday | Full Backup | 2 TB | 4 TB |


    **Table 14.1: Full and incremental Backup example**


    To restore data (for example, all the content of a directory) from a backup performed
    on Wednesday, the backup is needed from Sunday (**The Full Backup**), Monday (**Incremental**),
    Tuesday (**Incremental**), and Wednesday (**Incremental**).


    **Table 14.2** shows the same example using **Differential Backup** instead.


    | Day | Backup type | Backup size | Total Backup size |

    | :--- | :--- | :--- | :--- |

    | Sunday | Full Backup | 1 TB | 1 TB |

    | Monday | Differential Backup | 20 GB | 1.02 TB |

    | Tuesday | Differential Backup | 120 GB (100+20) | 1.14 TB |

    | Wednesday | Differential Backup | 320 GB (200+120) | 1.46 TB |

    | Thursday | Differential Backup | 820 GB (500+320) | 2.28 TB |

    | Friday | Differential Backup | 900 GB (820 + 80) | 3.18 TB |

    | Saturday | Differential Backup | 1 TB (900 + 100) | 4.18 TB |'
  merge: -1
  img_proc: true
- pgno: 488
  md: '| Friday | Full Backup | 2 TB | 6.18 TB |


    Table 14.2: Full and differential Backup example


    It is possible to observe how the total **Backup** size required using **Different
    Backup** is bigger than with the **Incremental Backup**. The advantage of this
    method is that restoring a file from Wednesday’s **Backup** requires only a copy
    of the Sunday’s (**Full Backup**) and Wednesday’s one (**Different Backup**).


    # Backup sources


    As described previously, **Backup** is the process of copy data being protected.
    Depending on the data to be saved, there are different strategies and storage
    media. Some examples of elements that can be backed up are as follows:


    +   - **Static files**: These are the common elements to be included. These files
    are usually not modified often, and only new files are copied. For example, the
    copy can include files used by applications or end users.

    +   - **Dynamic files**: These files are being modified often, such as log files
    or automatically generated files (such as an exported *database*).

    +   - **Block devices**: The **Backup** can include the whole data in a device,
    such as a full disk or partition.

    +   - **Virtual Machine**: It is possible to make a **Backup** of the full **Virtual
    Machine** in two different ways:

    +     \- Using the *hypervisor*, which can create a *snapshot* (a copy of the
    data in a specific time) and export it to a regular file to be included in the
    copy.

    +     \- Installing the **Backup client** to perform a full copy of the data inside.

    +   - **Containers**: They have not copied themselves, only the data associated
    with them (such as *Volumes*).

    +   - **Databases**: A backup of a database can be done in two main ways:'
  merge: -1
  img_proc: true
- pgno: 489
  md: '+   * Exporting the content and the database structure to regular files to
    be included in the **Backup**.

    +     * Copying the associated files directly, thus, ensuring that the data would
    not be corrupted on the copy. This can approach have the following two options:

    +       * **Hot Backup**: The **Database** is still running while the backup is
    being performed.

    +       * **Cold Backup**: The **Database** is stopped earlier to perform the
    file-based copy.


    # Backup strategies


    Deciding a **Backup strategy** is essential to protect the data saved in the case
    of data loss as well as any possible disaster event. Different strategies are
    available to mitigate disaster situations, and they are as follows:


    +   * **3-2-1 Rule**: This strategy consists of having three copies, of which
    two of them are located on the same site but using different media, where the
    **Backup** is performed to speed up possible recovery of the data. The third copy
    is **off-site** (different location) to have a safe copy in case of a disaster
    situation.

    +   * **Remote Backup**: Performing the **Backup** to a remote service which usually
    is not managed by the owners of the original place. For example, using a service
    **Backup as a Service** or an *Object Storage solution*.

    +   * **Site-to-Site Backup**: This strategy always copies the data to a location
    off-site under the current location. Both sites are managed the same owners.

    +   * **Disaster Recovery** is the practice of having a second location, different
    from the main one, where the services are usually ready to be promoted as a primary.
    This method requires to have configured the replication between the sites. The
    biggest advantages of the implementation of **Disaster Recovery Site(s)** are
    as follows:

    +     * Reduce downtime, and the secondary site is able to resume the service
    quickly.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '+   - Data loss is reduced to the last replication, usually in seconds or minutes.


    +   - Possibility to go back to the main site when the incident is resolved.


    # ## Backup solution features


    **Backup solutions** include different features to improve performance, reduce
    the size needed and increase the security of the data stored. Some of the popular
    features are as follows:


    +   - **File locking:** The solution should be able to make a copy even when the
    file is in use, such as log files or databases data.


    +   - **Data expiration:** Out-of-date data can be automatically deleted after
    the retention period is over. This feature reduces the space needed in the storage
    media.


    +   - **Compression:** Compression can be done by the **Backup Solution** or directly
    applied to the storage media, such as built-in compression in a *Tape*.


    +   - **Deduplication:** One of the most advanced features of **Backup Solution**
    is avoiding the duplication of data in the storage media. If several systems have
    the same data, such as using the same operating system, only one copy of the data
    would be stored in the storage media.


    +   - **Duplication:** The copies can be distributed in different locations; the
    **Backup Solution** is responsible, after receiving the data from the client,
    for distributing it properly to different locations, ensuring they are not in
    the same location.


    +   - **Encryption:** Another advanced feature is to encrypt the data saved in
    a **Backup**. *Encryption* requires more resources, and it slows the copy and
    the restore. However, for some environments, it is a requirement.


    +   - **Multiplexing:** A **Backup Solution** is responsible for receiving data
    from multiple sources and storing them properly.


    +   - **Staging:** For some storage media, intermediate storage is first used
    to store the media. Usually, making a copy to a *Tape* requires having a disk,
    which is used temporarily, before sending all the data to the *Tape*.'
