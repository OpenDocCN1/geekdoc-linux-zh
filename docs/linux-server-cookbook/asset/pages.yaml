- pgno: 49
  md: "+   - **Link aggregation:** Allows to combine multiple Ethernet interfaces\
    \ into a single logical link to work in parallel in active-passive mode or in\
    \ active-active to sum the available throughput. In Linux, the terms used for\
    \ link aggregation for the interfaces are bonding or teaming.\n+   \t○ Redundancy\
    \ for high availability can be configured as a round-robin or as an active backup.\n\
    +   \t○ To sum up the throughput, a Link Aggregation Control Protocol (LACP, 802.1AX,\
    \ or 802.3ad) is required to be used and configured in the system and in the switches\
    \ where the network interfaces are connected.\n\n+   - **Volume Manager:** Linux\
    \ distributions use the LVM tool for volume manager, which stands for Logical\
    \ Volume Management. Using LVM provides flexibility and more advanced features\
    \ than traditional partitioning. Installers usually offer to encrypt the data\
    \ inside the disk using Linux Unified Key Setup (LUKS).\n\n+   - **Data redundancy:**\
    \ Technology to spread the data across several disks having multiple copies of\
    \ the same information stored in more than one place at a time. RAID stands for\
    \ Redundant Array of Independent Disks, which is usually implemented at the hardware\
    \ level. However, Linux provides the possibility to reconfigure this using software.\
    \ Depending on the required level of redundancy and performance, different RAID\
    \ levels are available where popular ones are as follows:\n+   \t○ **RAID-1 or\
    \ mirror mode:** Two or more disks are combined into one volume, and all the blocks\
    \ are copied to all the disks. All the disks except one can fail, and the data\
    \ would still be accessible.\n+   \t○ **RAID-5:** The most popular and useful\
    \ RAID mode, this requires three or more disks. The data will be distributed between\
    \ the disks, but they will not be mirrored. Even if one disk fails, the data will\
    \ be available. The data of the failed disk can be recalculated using the parity\
    \ method.\n+   \t○ **RAID-6:** An extension of RAID-5, where many disks are used\
    \ (requiring to have at least four). At this level, two disks can fail, and the\
    \ data would still be accessible."
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Spare disks are an important part of storage redundancy, especially for RAID-5
    and RAID6. These disks are not used to distribute the data, but there are on standby
    to be filled if one of the active disks has failed.


    # Debian GNU/Linux


    Debian GNU/Linux is one of the most popular distributions for Linux servers due
    to the stability offered. The distribution is a result of a volunteer effort to
    create a free and high-quality distribution with a suite of applications.


    Debian was the first Linux distribution to include package management, named dpkg
    (Debian Package), for easy installation, update, and removal. It was the first
    distribution as well to be able to be upgraded without requiring a re-installation.


    To obtain the images for the installation, navigate to the following website where
    the different options are available https://www.debian.org/distrib/. Installation
    method options are the following:


    +   - A small installation image: This installation requires an Internet connection
    to be completed. It is also called Network Install.


    +   - A complete installation image: It contains more packages, and it makes the
    installation faster without the dependence on an Internet connection. There are
    options with DVD and CD images.


    +   - A live CD: It is possible to boot a Debian system from a CD, DVD, or USB
    without installation. This image will boot in memory the Linux distribution, and
    it can be tested without performing any changes in the disk. After testing it,
    the live CD would allow us to perform the installation on the disk.


    +   - Cloud images: Debian, like other Linux distributions, offers images with
    preinstalled versions to run in the private or public cloud. For example, QCOW2/RAW
    images for OpenStack, AMI images for Amazon EC2 or using AWS Marketplace, and
    Microsoft Azure images on the Azure Marketplace.'
  merge: -1
  img_proc: true
