  md: 'By having multiple CPUs available, the tasks are going to be distributed between
    different CPUs, and the load would be related to the number of CPUs. A system
    load of 3.00 having four processors indicates that it is using 66.67% of the available
    CPU resources.


    # ## Command uptime and file /etc/loadavg


    This command, described in Chapter 3, Using the Command Line Interface, to see
