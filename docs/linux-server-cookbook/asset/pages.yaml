    # Basic network configuration


    Network configuration in a Linux system, as other configurations are defined in
    plain text files. Historically, configuring those files was not a simple task
    and led to misconfiguration, thus causing downtimes. Recent versions of the distributions
    include high-level commands to manage the networking, helping system administrators
    to configure basic or advanced configurations. These solutions ensure that the
    syntax and the configuration are correct.


    Red Hat distribution and derivatives, such as CentOS Stream or Rocky Linux, are
    using *NetworkManager* system daemon to manage the network devices and connections.
    Ubuntu distribution uses *Netplan* and *Systemd-networkd* to perform configuration
    based on *YAML* files.


    # Network configuration on Red Hat-based systems'
