  md: '# CHAPTER 7


    # Netwokr Configuration


    # Introduction


    Networking is one of the core parts of enterprises. It involves multiple elements,
    such as servers, switches, routers, and cables. Understanding how the traffic
    flows and the possible configurations in Linux is important to provide a service
    in an efficient way to reduce costs, bottlenecks, and downtimes.


    Linux servers allow simple configurations and advanced ones. This chapter will
    cover how to configure. Networking in different Linux distributions and advanced
    features such as aggregation, bridges, and Virtual LANs.


    # Structure


    In this chapter, the following topics will be discussed:


    +   - Network introduction

    +   - Basic network configuration

    +   - Routing

    +   - Advanced network configuration


    # Network introduction


    Modern systems depend on networks for most of the tasks, such as installing new
    software, updating the system, or offering services locally or remotely. Linux,
    as the most secure operating system, has different abstraction layers between
    the hardware, Kernel space, and user space. *Figure 7.1* features the various
    Linux operating system layers:'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_219_0.png)


    ![](img/863afa537de4eed7deb11978bfbfa90e_219_1.png)


    As a Linux administrator, it is important to understand the basic concepts of
    Networking, from how the traffic is managed by the physical devices to how the
    data is presented to the end user. The **Open Systems Interconnection Model**
    (*Open Systems Interconnection Model*) describes the universal standard communication.
    This model defines the following seven abstraction layers:


    +   - **Physical layer (Layer 1):** Responsible for the transmission and reception
    of the data in a device, such as an Ethernet device in a system, a cable, or a
    port in a Router.

    +   - **Data link layer (Layer 2):** Provides data transfer between different
    nodes. For example, a communication between two servers in the same local network.

    +   - **Network layer (Layer 3):** Transfers data from (or to) one node from a
    network to a different network. This requires a node to route the traffic between
    different Layer 2 (data link).

    +   - **Transport layer (Layer 4):** Data transmission using protocols, such as
    UDP or TCP.

    +   - **Session layer (Layer 5):** Maintains and synchronizes connection between
    two nodes.

    +   - **Presentation layer (Layer 6):** Formats and translates the data to be
    used, such as data encryption/decryption or compression/decompression.

    +   - **Application layer (Layer 7):** The application where the user interacts.


    [Figure 7.2](#) illustrates the traffic flow through the different layers in the
    OSI Model:'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_220_0.png)


    Figure 7.2: OSI Model layer traffic flow. Source: Wikipedia


    Networking evolved in the last decades, from communication to the adoption of
    new technologies. First communications were mainly between physical servers, through
    switches and routers. The traffic dominant was a *north-south* data flow, where
    the systems were communicating with devices outside the local network.


    Migration of the services to virtual machines, with the popularity of virtualization,
    introduced new challenges related to communication, thus, increasing the traffic
    *east-west*, which indicates the communication between different services inside
    of the same network.


    Adoption of the containers increased the traffic between the systems, and advanced
    network configuration and advanced network implementations, such as Software Defined
    Networks and *tunnel protocols*, are knowledge required nowadays when a server
    is configured.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Another important transformation is part of large enterprises moving to a new
    network architecture called Spine Leaf, which increases the efficiency of the
    traffic and reduces the possible bottlenecks caused by the traditional architecture.
    Figure 7.3 shows the difference between the traditional architecture, which has
    three layers (access, aggregation, and core) with limitations of the parallel
    traffic, and the new architecture, with a mesh connection with high bandwidth
    and low- latency features:


    ![](img/863afa537de4eed7deb11978bfbfa90e_221_0.png)


    *Figure 7.3: Traditional and spine leaf architectures. Source: Aruba Networks*


    Another important change in the last few years was the introduction of IPv6, the
    most recent version of the Internet Protocol. This new version uses 128-bit addresses
    instead of the 32-bit ones on IPv4. The use of IPv6 is still limited in local
    networks, but the adoption of ISP and large enterprises are a reality.


