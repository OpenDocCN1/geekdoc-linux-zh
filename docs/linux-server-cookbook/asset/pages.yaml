    # ## Bacula


    This is one of the best open-source **Backup** products available. This solution
    includes community and commercial support, being a perfect option for small and
    enterprise companies. Some of the benefits of using **Bacula** are as follows:


    +   * GUI and CLI interface.

    +   * A wide variety of possible backup levels and techniques, including **full**,
    **differential**, and **incremental**.

    +   * Ability to both backup and restore entire systems or single singles easily.

    +   * **Clout backup** support for AWS S3.

    +   * The capability of using snapshots on Linux/Unix systems. Snapshots can be
    automatically created and used to backup files.

    +   * Use either the command line and/or GUI to execute and control your backup
    process.

    +   * Use *partition backup* for your Linux data storage to keep precise images
    of these disks for easy management and recovery.

    +   * Tape backup is fully supported and allows it to work with a variety of different
    tape drives, autoloaders, and autochangers. *VTL* support is also included.

    +   * Deduplication developed by themselves.


    # ## Bacula installation


    The **Bacula** installation requires to use a *database* to store configuration
    and all the needed information about the clients and the copies. The available
    options are **MariaDB** (MySQL) and **PostgreSQL**. When the *Database* is available,
    the installer configures whatever is needed to use it. The instructions included
    are for a system using *Ubuntu 22.04* (at the time of writing this book, **Bacula**
    was still not available on the official repository in Ubuntu) are as follows:'
