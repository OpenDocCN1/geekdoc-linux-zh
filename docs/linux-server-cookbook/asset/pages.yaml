    # Installation methods


    Linux distributions include several different installation methods depending on
    the target and the requirements. Some examples of those targets are as follows:


    +   - A local server where access to the physical bare-metal node is possible.

    +   - A remote server without physical access.

    +   - A bunch of physical servers, local or remote, with or without physical access,
    where manual installation would not be possible because of the number of servers.

    +   - A virtual machine.


    The common installation methods depending on the needs, are as follows:


    +   - **Full installation DVD or USB:** The image used for the installation contains
    all the requirements for a normal installation, and access to the network is optional.

    +   - **Minimal installation using DVD, CD, or USB:** The image contains the minimum
    files necessary to start the installation, and the rest of the process requires
    access to the internet to download the required packages or access to a repository
    in the local network.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   • **PXE server:** A preboot execution environment allows the installation
    of Linux during the boot process of the physical server or Virtual Machine. This
    process requires a server or device configured with a PXE Server, DHCP service,
    TFTP service with the installation files, and a syslinux bootloaders. Another
    alternative for modern servers is using iPXE, where the TFTP server can be replaced
    with a Web server containing the installation files.


    +   • **Systemor cloud image-based installations:** These images have a preinstalled
    distribution and are ready to be used. These images are generally used on cloud
    platforms and virtualization platforms. These images can be reconfigured for either
    the user’s needs or the system can be customized in the first boot.


    Installation methods include the following methods when the installation is loaded:


    +   - **Graphical User Interface (GUI)** based installation.


    +   - Text-based installation.


    +   - Advanced installations, including automatic installations without user interaction.


    # Common installation steps


    The installation process is similar for all the Linux distributions except for
    specific configurations related to them. Common installation steps are the following:


    +   1. Download the installation media and write to a CD/DVD/USB or boot it from
    the network.


    +   2. Boot the system with the media.


    +   3. Specify the interface type of the installation: **Graphical User Interface
    (GUI)** or **Text Based Interface (TUI)** installation.


    +   4. Select a language for the installer. The language specified will be used
    during the installation and will be configured in some cases as the primary language
    after installation.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   5. Clock and Time Zone configuration. Indicating the location of the clock
    and the time zone will be adjusted for the installation and for the system after
    it.


    +   6. Keyboard configuration. In this step, the layout for the keyboard to be
    used during and after the installation is configured.


    +   7. Network configuration. This step includes the hostname and domain to be
    used for the system. Interface network configuration can be customized to be automatic
    (DHCP) or static IP configuration.


    +   8. Storage configuration. in this step, the disk target is selected, and the
    partition layout is configured, indicating if a full disk will be used or a partition
    layout will be used.


    +   9. Specify the root password and create a new user. After installation, it
    is highly recommended to use a non-administration user, and this step includes
    the creation of one user and setting a secure password.


    +   10. Specify the repositories and indicate the software to be installed. At
    this point, the repositories (remote or local) are specified, and the software
    is to be installed depending on the purpose of the system, for example, Desktop
    environment, Web server, and SSH server software.


    +   11. Start the installation. During this stage, the disk is partitioned, and
    the core software and the additional software are installed. Next, the networking
    is configured, and the user specified is created.


    +   12. Complete the installation. The last step is used to complete the installation
    and configuring the boot loader. After the installation is completed, the system
    should be rebooted to boot from the installed distribution.


    Three installations with the steps to perform a basic installation will be described
    in this chapter: Debian, Ubuntu Server, and Red Hat Enterprise Linux. Other popular
    distributions will be just described, and the available versions will be explained.


    # Advanced installation steps


    During installation, there are three common advanced installation steps:'
