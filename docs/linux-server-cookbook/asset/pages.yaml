    # Conclusion


    *Hybrid Cloud* is a trending architecture to combine a *Private Cloud* with a
    *Public Cloud*. Many reasons are behind this, such as reducing costs and flexibility.
    This chapter covered what is *Infrastructure as Service* is and detailed **OpenStack**
    as a *Cloud* solution.


    # Key facts


    +   - **Infrastructure as a Service** allows converting on-premise infrastructure
    to a **Cloud**-ready infrastructure.

    +   - **Private Cloud** can be combined with a **Public Cloud** to operate together.
    This combination is called **Hybrid Cloud**.

    +   - **OpenStack** is the most important open-source project to build a **Cloud**.


    # Questions


    1. What is the name for computing on **OpenStack**?


    a. glance'
