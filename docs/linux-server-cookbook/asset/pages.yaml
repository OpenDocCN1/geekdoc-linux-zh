    a container. Using **docker run**, it is possible to specify the command to be
    used instead of the default one. With the option **-\--name**, it is possible
    to specify a custom name. Figure 13.7 shows an example using the image *debian*
    and setting the name of the container to *mydeb*.


    ![](img/863afa537de4eed7deb11978bfbfa90e_445_0.png)


    Figure 13.7: Running a container with a custom name and command


    The argument *ps* for the command **docker** allows the option *-l* to list the
    information about the last container executed, as is shown in figure 13.8:


    ![](img/863afa537de4eed7deb11978bfbfa90e_445_1.png)


    Figure 13.8: Example output for the argument ps with the option -l


    It is possible to interact with a container after creating it. This is useful
    for troubleshooting. The options used for this purpose are as follows:


    +   * **-tty (-t)**: Allocate a pseudo-TTY

    +   * **-interactive (-i)**: Keeps **standard input (STDIN)** open.


    Figure 13.9 shows how to execute a new container and operate inside a shell console:


    ![](img/863afa537de4eed7deb11978bfbfa90e_445_2.png)


    Figure 13.9: Example using the options -ti with the argument run


    The *hostname* of the pod is assigned to the auto-generated ID for the pod. It
    is possible to specify the *hostname* for the pod with the option **-\--hostname
    (-h)**. Exiting a container by writing the command *exit* in the shell, the *container*
    will be stopped after the session is closed. To disconnect from the *container*
    without stopping it, it is required to press the combination *Ctrl-L-P* followed
    by *Ctrl-Q*.'
