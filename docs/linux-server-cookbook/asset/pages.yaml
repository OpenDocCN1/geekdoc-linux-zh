  md: "+   • subversion: Deploys a subversion repository.\n\n+   • systemd: Manage\
    \ systemd units.\n\n+   • sysvinit: Manage SysV services.\n\n+   • tempfile: Creates\
    \ temporary files and directories.\n\n+   • template: Template a file out to a\
    \ target host.\n\n+   • unarchive: Unpacks an archive after (optionally) copying\
    \ it from the  \n+   local machine.\n\n+   • uri: Interacts with Web services.\n\
    \n+   • user: Manage user accounts.\n\n+   • validate_argument_spec: Validate\
    \ role argument specs.\n\n+   • wait_for: Waits for a condition before continuing.\n\
    \n+   • wait_for_connection: Waits until the remote system is  \n+   reachable/usable.\n\
    \n+   • yum: Manages packages with the yum package manager.\n\n+   • yum_repository:\
    \ Add or remove YUM repositories.\n\n# # Roles\n\n*Roles* organize *Tasks*, *Variables*,\
    \ *Handlers*, *Templates*, and static files in a  \ndirectory. This structure\
    \ can be reused in different projects. The directory  \ncontaining *Roles* is,\
    \ by default, called *roles*. Inside, there is a folder with the  \nname of the\
    \ role. The *Role* directory structure is as follows:\n\n```\nroles/role_name/\n\
    ├── defaults\n│   └── main.yml\n├── files\n├── handlers\n│   └── main.yml\n├──\
    \ meta\n│   └── main.yml\n├── README.md\n└── tasks\n```"
  merge: -1
