  md: '# CHAPTER 2


    # Linux Installation


    # Introduction


    Installation of a Linux distribution is an easy task, requiring a little amount
    of time for the process. The number of actively maintained distributions is more
    than 300, each of them with the same main components (Linux kernel and general
    system and system libraries) but with different purposes and specific system tools.
    The difference between distributions is often related to package managers, desktop
    environments, and system services, like firewalls and network services.


    Popular Linux distributions can be installed on different architectures and devices.
    Other distributions are available and optimized to be used in specific environments,
    for example, Raspberry Pi Linux OS (For Raspberry PI devices) or OpenWrt (for
    routers).


    The popular website distrowatch.com contains a list of active distributions with
    useful information about the current version, the architecture supported, the
    default software included, and much more useful information.


    This chapter will be focused on the installation of popular distributions, especially
    because of the support for enterprises. It covers the installation methods available,
    the steps of the installation, the advanced options, and the differences between
    those distributions.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - Linux Support Levels

    +   - Installation Methods

    +   - Common Installation Steps

    +   - Advanced Installation Steps

    +   - Debian GNU/Linux'
