    *Table 9.2* describe some of the popular options available to be configured in
    the file sshd_config:


    | **SSH Option** | **Description** |

    |---|---|

    | AllowTcpForwarding | Specifies whether TCP forwarding is permitted. Options
    are *yes* (default), *no*, and *local*. |

    | AllowUsers | List of accepted user names, separated by user spaces |

    | AuthenticationMethods | Specifies the allowed authentication methods. |

    | Ciphers | Specifies the ciphers allowed. Multiple ciphers must be comma-separated.
    |

    | DenyGroups | List of denied group names, separated by spaces. |

    | DenyUsers | List of denied user names, separated by spaces. |

    | DisableForwarding | Disables all forwarding features, including X11, ssh-agent(1),
    TCP, and StreamLocal. |

    | ListenAddress | Specifies the local addresses that should listen on. |

    | PasswordAuthentication | Specifies whether password authentication is allowed.
    The default is *yes*. |

    | PermitRootLogin | Specifies whether the root can log in. The argument must be
    *yes*, *prohibit-password*, *forced-commands-only*, or *no*. The default is prohibit-password.
    |

    | Port | Specifies the port number listens on. The default is 22. |

    | Subsystem | Configures an external subsystem (for example, *file transfer daemon*).
    |

    | UseDNS | Specifies whether should resolve the client IP to a hostname. |

    | UsePAM | Enables the *Pluggable Authentication Module* interface. |

    | X11Forwarding | Specifies whether X11 forwarding is permitted. The argument
    must be *yes* or *no*. The default is *no*. |


    *Table 9.2: SSH client options and descriptions*


    During the installation of the SSH server, it generates private and public keys,
    which are located inside of the directory /etc/ssh/. These keys use different
    cryptography algorithms. The name of the files have the format ssh_host_ALGORITHM_key
    and ssh_host_ALGORITHM_key.pub:


    +   *   **ECDA:** stands for **Elliptic Curve Digital Signature Algorithm**, which
    uses elliptic-curve cryptography.

    +   *   **Ed255190:** EDSA stands for **Edwards-curve Digital Signature Algorithm**,
    and Ed25519 is a signature scheme using SHA-512 and Curve25519.'
