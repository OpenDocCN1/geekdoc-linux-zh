    # DNS service and clients


    The Domain Name System (DNS) is a service to convert domain names to IP addresses
    and vice versa. The structure is based on a hierarchy, where the top level contains
    the root nameservers. Currently, these root nameservers are 13 servers geolocated
    in different parts of the world. These servers have the syntax letter.root-servers.org,
    where the letter currently is going from the letters a to m. The first query to
    the root nameservers is to obtain the servers for the top-level domain (TLD),
    responsible for the second level in the hierarchy. These servers are associated
    with the top-level domain, such as .com, .net, and .org, the country code TLDs
    (for example, .in, .es, and .jp), and new TLDs (for example, .tech and .space).
    These top-level domain servers would provide the domain servers for the domain
    specified. These domains are responsible to provide the answer for the domain
    or subdomain queried. DNS can contain complex configurations indicating other
    nameservers for subdomains. Figure 9.7 shows the hierarchy with two domain examples:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_283_0.png)


    Figure 9.7: DNS hierarchy example


    The query uses the UDP protocol, and the destination port is 53. A DNS service
    can act in different modes:


    +   * **Authoritative:** It is responsible for a domain or several domains and
    answers queries related to them only.


    +   * **Forwarding:** The DNS service is not responsible for any domain, and all
    the requests are forwarded to an **upstream** DNS server.


    +   * **Cache:** Similar to **forwarding** but keeping a cache for the client
    requests. This is a popular configuration to avoid multiple requests to upstream
    servers.


    It is possible to combine the different modes, such that the **Authoritative**
    and **Cache** mode, in the same server. This DNS Service will answer for the domains
    for which it is responsible. For the rest of the domains, it will forward the
    request to the **upstream** DNS server configured, caching the client requests.


    New technologies and modern software depend on DNS for the correct functioning.
    Correct internal and external resolving is required for the software to communicate
    between services and to pull required software and artifacts from repositories,
    such as container images.


    The DNS records configured inside a DNS server are of different types, as can
    be seen in *table 9.1*:'
  merge: -1
  img_proc: true
- pgno: 284
  md: '| Record Type | Description |

    |---|---|

    | A | Resolves a hostname to an IP |

    | AAAA | Resolves a hostname to an IP, for IPv6. |

    | CNAME | Specifies an alias for a hostmae |

    | PTR | Resolves an IP to a hostname |

    | NS | Specifies the name servers for a domain or subdomain. |

    | MX | Specifies the mail servers for a domain or subdomain. |

    | SRV | Specifies host and ports for a specific service. |

    | TXT | Specify a text record for a hostname. Used for checking the owner of the
    domain and different domain configurations. |

    | SOA | Stands for “start of authority”, and provides admin information for the
    domain and information about the last update and refreshing times. |


    *Table 9.1: DNS record types*


    The records *A* and *AAAA* allow to use the asterisk (*) to create a wildcard
    record. For example, creating a wildcard record `*.dev.example.com` pointing to
    the IP `192.168.122.22`, the DNS server will answer for all the hostnames with
    that subdomain to that IP. In that example, the hostname `web.dev.example.com`
    or `something.dev.example.com` resolves to the same IP.


    # ## Linux DNS servers and client


    The current popular software for the DNS Service is *Bind 9*, which is provided
    by **Internet Systems Consortium** (ISC). The initial release for *Bind* was in
    1986, but it is updated on a regular basis. As described previously, a popular
    and lightweight alternative is *dnsmasq*.


    For the installation of Bind 9 (also known commonly as *named*) in Ubuntu-based
    systems, the package is called **bind9** for the server and **bind9-utils** for
    the client tools. On Red Hat Enterprise Linux and derivatives, the package is
    called **bind** for the DNS server and **bind-utils** for the client tools. Once
    the package is installed, the service name is called **named**, and the main configuration
    is `/etc/bind/named.conf` for the package **bind9** and `/etc/named.conf` for
    the package **bind**. In Ubuntu, the default **named.conf** includes other files
    for options and *zones* definition:


    ```

    include "/etc/bind/named.conf.options";

    include "/etc/bind/named.conf.local";

    include "/etc/bind/named.conf.default-zones";

    ```'
  merge: -1
  img_proc: true
