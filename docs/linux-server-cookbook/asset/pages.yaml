    collation-server              = utf8mb4_general_ci

    [embedded]

    [mariadb]

    [mariadb-10.6]

    ```


    Table 11.2 shows the option groups available in the configuration files and the
    description:


    | Group | Description |

    |---|---|

    | [client-server] | Options read by all MariaDB client and the MariaDB Server.
    |

    | [server] | Options read by MariaDB Server. |

    | [mysqld] | Options read by mysqld, which includes both MariaDB Server and MySQL
    Server. |

    | [mysqld-X.Y] | Options read by a specific version of mysqld, which includes
    both MariaDB Server and MySQL Server. |'
