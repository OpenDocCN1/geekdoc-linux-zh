- pgno: 434
  md: '# # CHAPTER 13

    ## Containers and CI/CD


    # ## Introduction


    Containers is one of the most popular technologies at the present time. Companies
    around the world started modernization of the applications and infrastructure
    to adapt them to the cloud and to the more agile ways to work. The popularity
    of the project Docker helped to make Linux containers a trend, which many companies
    adopted as a standard to deploy new applications. New open-source solutions to
    run containers got popularity as alternatives to Docker, where Podman is one of
    the most popular and used solutions. Kubernetes as orchestration and advanced
    solution got popularity in the market, where Kubernetes Distributions provided
    another layer to help developers and end users build and run the software.


    Modernization of applications brought new practices to develop, test, and release
    software to production. This includes the following:


    +   - **Continuous Integration (CI):** The practice of automating the integration
    of code changes from multiple contributors into a single software project.

    +   - **Continuous Delivery (CD):** The practice where the code changes are automatically
    prepared for a release to production.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   - Introduction to containers and images

    +   - Docker

    +   - Image Registry

    +   - Podman

    +   - Container runtimes

    +   - Kubernetes

    +   - Introduction to continuous integration/delivery

    +   - Jenkins, GitLab CI/CD, and GitHub Actions


    # ## Introduction to containers and images'
  merge: -1
  img_proc: true
- pgno: 435
  md: '**Containers** are not something new. They have historically used to isolate
    resources at the user level and application level. On **Linux**, the first approach
    to isolate system components before the containers was called *chroot* (also known
    as *jail*). It was used to isolate applications and users between them, but with
    the limitation of it being unable to isolate physical resources (memory, CPU,
    or devices). The first implementations of *chroot* started in the 80s decade.


    Since the year 2000, new implementations to isolate resources appeared, not only
    on Linux systems but on *UNIX systems* (*BSD systems, Solaris,* and *AIX*) and
    *Windows*. *Virtualoze* was a pioneer company in developing software to isolate
    resources at the operating system level. The solution was called the same name
    as the company, and it was proprietary software. In the year 2005, the company
    released, with an open-source license, the software *OpenVZ*. This software is
    still popular and used by different companies, especially those that offer **Virtual
    Private Servers (VPS)** at low cost.


    Between 2000 and 2005, the technology advanced in the resource isolation level
    on *UNIX systems*. *FreeBSD* (a *UNIX operating system*) implemented *“*FreeBSD
    jail*”, similar to *chroot*, but able to isolate resources. In the year 2001,
    *Linux-Vserver* appeared as a free alternative to *Virtuose*, and this solution
    is considered the predecessor to the current *Containers* technology. In the year
    2004, one of the best solutions to isolate resources appeared—*Solaris zones*.
    The *zones* were considered one of the best resource isolations till **Docker**
    appeared. Until the appearance of **Docker** in the year 2013, resource isolation
    was worth mentioning the following:


    +   -   **Workload partitions (WPARs)** for the operating system *IBM AIX* in
    the year 2007.

    +   -   HP-UX *Containers* for the operating system called *HP-UX* also in the
    year 2007.

    +   -   *Linux Containers (LXC)* in the year 2008.


    In the first years of **Docker** (2013 and 2014), it was using *LXC* to run *Containers*.
    From version 0.9, it started to use its own library (libcontainer) to handle the
    *Containers*.


    # Containers versus virtualization


    In the beginning, the popularity of the **Containers** led to questions about
    how it was different from traditional **Virtualization**. The **Virtualization**
    technology consists of adding an abstraction layer for the physical resources,
    with the objective of improving the use of the resources. With the introduction
    of **Virtualization**, it is possible to create several different emulated environments
    (**Virtual Machines**) for different resources. Thanks to **Virtualization**,
    it is possible to run **Virtual Machines** with different operating systems and
    with isolated resources (CPU, Memory, and Devices) inside of the same physical
    system. That allowed the companies to reduce costs by grouping'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'services running in different physical systems in only one system, migrating
    the services to **Virtual Machines**. There are different types of **Virtualization**,
    but the two most used nowadays are as follows:


    +   * **Full Virtualization:** The Virtual Machine does not have direct access
    to the physical resources, and they require to have an upper layer to access them.
    Some software examples are as follows:

    +       * *Oracle VirtualBox*

    +       * *QEMU*

    +       * *Hyper-V*

    +       * *VMware ESXi*


    +   * **OS-Level Virtualization:** This is where **Containers** are located. It
    is the *Operating System*, and not the *hardware*, that is responsible for isolating
    the resources and providing the tools to create, manipulate or manage the state
    of the **Containers** (term used instead **Virtual Machine**).


    Refer to [figure 13.1](#figure-13-1) to see the difference between hardware and
    OS-Level Virtualization:


    ![](img/863afa537de4eed7deb11978bfbfa90e_436_0.png)


    *Figure 13.1: Different between hardware and OS-level Virtualization*


    # ## Container content


    A **Container** contains everything that is needed to execute one or multiple
    applications. A **Container** does not have a full *guest operating system* as
    a **Virtual Machine** does. The size of a **Container** is smaller and includes
    only the following:


    +   * **Operating System libraries:** Only the libraries required to run the applications
    would be included. For example, an *SSL* library, in the case of a Web server'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'application, requires a secure connection.


    +   * **Operating system tools**: This can contain some tools needed for the application
    or to perform troubleshooting.


    +   * **Runtime**: Some software is needed to execute the application inside the
    container. For example:

    +     * Interpreters: To run applications such as Python, PHP, or Perl.

    +     * Binaries for compiled languages, such as Java or Go.


    +   * **Application files**: These are similar to the files that need to be interpreted,
    the binaries to run applications, configuration files, or any file needed for
    the application to be executed inside the Container.


    A **Container** can execute several applications inside, but it is recommended
    to separate applications into several applications. The concept of *Microservices*
    consists in running small independent services which can be managed individually.
    That is part of the modernization to avoid having *Monolithic* architectures.
    Some reasons to separate services in different containers are as follows:


    +   * Monitor applications individually.

    +   * Limit resources accessible from the applications.

    +   * Able to restart applications without affecting others.

    +   * Scale up/down specific applications (services).


    # Images


    As described previously, a *Container* contains everything that is needed to execute
    an application. An *Image* is a base to run *Containers* and to create a child
    image. The image has different layers (the *Kernel*, the minimal required files
    for the *operating system*, the libraries, and the customization). A *Base Image*
    is used to generate other images. *Figure 13.2* features the base image.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_438_0.png)


    *Figure 13.2:* Base image. *Source:* Docker


    After new software and files are added to the *Base Image*, a new *Image* is generated
    with the modifications. *Figure 13.3* shows the different layers applied to a
    *Base Image* based on *Debian*, configured to have a Web server installed and
    ready to be used.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_439_0.png)


    The layers represented in figure 13.3 are as follows:


    +   - Base Image with Debian

    +   - Adding configuration to the Base Image

    +   - Installing Apache in the previous layer


    A Container based on this generated Image will be based on the Debian base image
    and will have configuration added. Apache is also installed. Any Image can be
    used by several containers at the same time. An Image has a history track and
    version control, and this helps show what changes were made in each layer. It
    is possible to go back to a previous version of it.


    Cloud Providers, such as AWS or Google Cloud, offer the possibility to run containers
    on their platform. This is an ideal solution for customers who do not want to
    maintain a platform and want to modernize their applications.


    Image registry'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'An **Image** can be generated locally and stored in the system where the **container**
    will be executed. But the purpose of **Images** is to be used by **Containers**
    in different environments and systems. An **Image Registry** is a repository to
    store the **Images** to be used. This **Registry** can be a public one or a private
    one inside the infrastructure where it will be used.


    When a **Container** is created, it refers to an **Image**, and if it is not downloaded
    previously, it will be automatically pulled from the **Image Registry**. Some
    popular public repositories are as follows:


    +   - **Docker Hub**: The most popular repository. When **Docker** became popular,
    it was the main repository for public images to be used.


    +   - **Quay**: A open-source repository with the possibility to deploy as on-promise.


    An **Image Registry** enables users to build, organize, distribute and deploy
    containers. *Figure 13.4* shows an example workflow where the developer builds
    an **Image** and publishes it to an **Image Registry**. After the automatic tests
    are passed, they can be released to production to be used by the end users.


    ![](img/863afa537de4eed7deb11978bfbfa90e_440_0.png)


    # Docker


    The project **Docker** was a revolution in the IT Industry because it made it
    easier to implement **Containers**. Traditionally, **Virtualization** was a fresh
    air of change for the companies to reduce costs and complexity in their infrastructures.
    However, it did not solve all the problems related to the development of the applications
    and the systems that were deployed. The introduction of the **Containers** in
    the development life-cycle helped *Developers* to be able to perform their tasks
    without the need for the creation of specific environments. Using the solution
    provided by **Docker**, they were able to use'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'their own workstation or a server provided by the *IT team* to run their own
    applications inside **Containers** and generate **Images** that would be promoted
    to a different environment (such as *testing, pre-production, or production*.)


    The popularity and implementation of **Containers** also helped the developers
    be able to isolate their applications and create *Microservices*, as described
    previously. This made the development team more flexible and less dependent on
    the infrastructure team. A new role named *DevOps* appeared with the implementation
    of **Containers** and new practices focused on the *Cloud*.


    **Docker** is based on a *Daemon* running, which will monitor the status of the
    *Containers* running in the system. This further allows it to start or stop the
    containers, among other tasks. **Docker** is available on Linux, Windows, and
    Mac systems. **Docker** has two main products:


    +   * **Docker engine**: is an open-source containerization technology for building
    and containerizing your applications.

    +   * **Docker desktop**: is an application for MacOS and Windows machines for
    the building and sharing of containerized applications and microservices.


    The steps for **Docker Engine** installation in different Linux distributions
    are detailed in the following link: [https://docs.docker.com/engine/install/](https://docs.docker.com/engine/install/).
    After the installation, a service called *docker.service* is available in the
    system to start, stop, or obtain status. When the **Docker Daemon** is started,
    it is possible to use the command *docker* to perform different tasks with containers
    and images.


