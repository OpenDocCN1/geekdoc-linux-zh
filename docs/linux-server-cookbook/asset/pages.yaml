    A table can define which column or columns are going to be used as *Primary Key*.
    This *Primary Key* is going to be used to define a unique value between the rows.
    This key can be a column with data that will be unique (for example, the ID card
    of a student table), or it can be a column that will autogenerate a unique value.
    Only one primary key can be defined in a table. *Figure 11.2* features an example
