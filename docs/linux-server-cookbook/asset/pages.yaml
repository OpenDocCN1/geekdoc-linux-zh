    # ## Ansible configuration


    Certain settings in **Ansible** are adjustable using a configuration file named
    **ansible.cfg**. The file can be generated using the command **ansible-config**
    with the argument `init`. It is possible to use the option `--disabled` to include
    all the options available. The option `-t all` includes all the options for the
    **plugins**. The configuration file contains different sections, and some examples
    are as follows:


    +   - [`defaults`]: Default options for **Ansible** tools.

    +   - [`privilege_escalation`]: Options for the privilege escalation, such as
    `sudo`.

    +   - [`persistent_connection`]: Options for *SSH* persistent connection.

    +   - [`colors`]: Defines the colors used for the different statuses (changed,
    error, and so on).

    +   - [`galaxy`]: Options for the public repository **Ansible Galaxy**.

    +   - [`inventory`]: Options for the inventory files and **plugins**.

    +   - [`jinja2`]: Options for the template system named **Jinja2**.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   * **[ssh_connection]:** Options for *SSH*.

    +   * **[tags]:** Options for the **tags on Ansible**.


    *Ansible* will try to locate the `ansible.cfg` file in the following order:


    +   * `ANSIBLE_CONFIG` environment variable pointing to the location of the `ansible.cfg`

    +   * Current directory

    +   * The file `~/.ansible.cfg`

    +   * `/etc/ansible/ansible.cfg`


    Some of the popular options in the configuration and the default values are defined
    in *table 12.6*:


    | Option | Default value | Description |

    | :--- | :--- | :--- |

    | [defaults] | | |

    | inventory | /etc/ansible/hosts | Default inventory source |

    | forks | 5 | The maximum number of forks used to execute tasks. |

    | host_key_checking | True | Check the host key of the target hosts. |

    | timeout | 10 | Default timeout for connection plugins to use |

    | [privilege_escalation] | | |

    | become | False | Toggles the use of privilege escalation |

    | become_method | sudo | Privilege escalation method to use when “become” is enabled.
    |

    | become_user | root | The user your remote user *becomes*. |

    | become_ask_pass | False | Toggle to prompt for privilege escalation password.
    |

    | [ssh_connection] | | |

    | ssh_args | -C -o ControlMaster=auto -o ControlPersist=60s | Arguments to pass
    to all SSH CLI tools. |

    | control_path_dir | ~/.ansible/cp | Directory to be used for *ControlPath*. |'
