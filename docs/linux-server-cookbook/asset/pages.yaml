    \ can contain a range of hosts; the following example will define five Web servers\
    \ in one line:\n\n```\nweb0[1:5].example.com\n```\n\n# AD-HOC actions\n\nAnsible\
    \ brings the command ansible to check connectivity to the nodes or to perform\
    \ simple tasks. This task is not saved in any file and does not need any file\
    \ to read the task to be performed. The syntax is as follows:\n\n```\nansible\
    \ [options] servers|groups|all|ungrouped -m module [-a arguments]\n```\n\nThe\
    \ module used to check connectivity is named ping. If the connectivity is correct,\
    \ it will show the word \"pong\", and the task will be marked as SUCCESS. If the\
    \ connection fails, it will be marked as UNREACHABLE. Figure 12.17 shows the two\
    \ scenarios:\n\n```\nagonzalez@ubuntu:~$ ansible -i /etc/ansible/hosts -m ping\
    \ rhel\nrhel | SUCCESS => {\n  \"ansible_facts\": {\n    \"discovered_interpreter_python\"\
    : \"/usr/bin/python3\"\n  },\n  \"changed\": false,\n  \"ping\": \"pong\"\n}\n\
    agonzalez@ubuntu:~$ ansible -i /etc/ansible/hosts -m ping web01.example.com\n\
    web01.example.com | UNREACHABLE! => {\n  \"changed\": false,\n  \"msg\": \"Failed\
    \ to connect to the host via ssh: ssh: Could not resolve host name web01.example.com:\
    \ Temporary failure in name resolution\",\n  \"unreachable\": true\n}\n```\n\n\
    ![](img/863afa537de4eed7deb11978bfbfa90e_399_0.png)\n\nOther common modules to\
    \ be used in the ad-hoc mode are as follows:\n\n+   - command: Execute a command\
    \ in the managed nodes.\n+   - shell: Execute a command in the managed node but\
    \ using the shell configuration."
