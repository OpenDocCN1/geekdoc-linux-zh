  md: '# ## Include and import


    Working with a single *Playbook* can contain many lines related to the variable
    definition, tasks, and handlers. *Ansible* allows to split of the file and includes
    them in the main file, using *tasks* or *Play* options. The possible statements
    to perform are described in *table 12.8*:


    | Statement | Description |

    | :--- | :--- |

    | `include_vars` | A task inside the tasks section. Include a YAML file with the
    variables. Example: | | | |

    | | `tasks:` | | | |

    | | `#include_vars: variables_httpd.yaml` | | | |

    | `vars_files` | At *Playbook* level is possible to define the files containing
    variables needed for the *Playbook*. Example: | | | |

    | | `- name: My playbook` | | | |

    | | `#hosts: webservers` | | | |

    | | `#vars_files:` | | | |

    | | `#variables_httpd.yaml` | | | |

    | `import_playbook` | At *Playbook* level is possible to include external *Playbooks*.
    Example: | | | |

    | | `#import_playbook: configure_httpd.yaml` | | | |

    | | `#import_playbook: configure_mariadb.yaml` | | | |

    | `include_tasks` `import_tasks` | A task inside tasks section. It includes (or
    import) a list of tasks defined in a file. It is possible to pass variables to
    the tasks. Example: | | | |

    | | `tasks:` | | | |

    | | `#include_tasks: install_httpd.yaml` | | | |

    | | `#import_tasks: configure_httpd.yaml` | | | |

    | | `#vars:` | | | |

    | | `#httpd_port: 443` | | | |

    | | It is possible to include tasks in the handlers section. | | | |

    | `include_role` `import_role` | It includes a *role* (described as follows) inside
    the *tasks* section. Example: | | | |

    | | `#import_role:` | | | |

    | | `#name: httpd` | | | |

    | | `#include_role:` | | | |

    | | `#name: httpd` | | | |


    *Table 12.8*: Including files for variables, tasks, and roles syntax and examples.


    *Import* statements are pre-processed at the time playbooks are parsed; the **include**
    ones are processed during the execution of the playbook.'
  merge: -1
  img_proc: true
