    A *Primary Key* cannot be blank and needs to be unique in the table. Other columns
    in the table can be optionally defined as *Unique Key* or as *Foreign Key*:


    +   - **Unique Key:** This does not allow to have duplicated values in the column.
    For example, a phone number should be unique in a table of students. A table can
    have several *Unique Keys*. Refer to *figure 11.3*:


