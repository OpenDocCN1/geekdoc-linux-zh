    The protocol SSH allows to forward remote and local ports that are useful to access
    internal services from outside. Option -L is used to map a local port to an IP
    and port from the remote network using the SSH tunnel. Option -R is less used,
    and its functionality is to expose an IP and port from the local network to the
    remote server connected with SSH. *Figure 9.19* shows the traffic flow using an
    SSH port forwarding:


    ![](img/863afa537de4eed7deb11978bfbfa90e_297_0.png)


    With SSH as well, it is possible to forward the graphical applications using the
    **X11 forwarding** mechanism. Using option -X in the *SSH client*, it is possible
    to execute applications in the remote server showing the graphical interface in
    the client node. Refer to *figure 9.20* for an example:


