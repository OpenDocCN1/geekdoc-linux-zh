    # Introduction to services


    A Linux service (or sometimes called **daemon**) is an application or set of applications
    that are running in the background performing some tasks or waiting for some event.
    Some services can execute some applications, and when it finishes, the service
    is stopped. An example is a service to configure the network in the system. Other
    services are running constantly, waiting to offer some resource; for example,
    an **SSH** service is waiting for users to connect and offer the possibility to
    login to the server.


    Most Linux distributions use the service manager called **systemd**, which is
    a replacement for the historical and popular **SysV init** daemon. When a Linux
    distribution is booted, the first process executed is **systemd**, and it will
    be responsible for starting the rest of the services enabled in the system to
    be started on boot.


    **Systemd** is a full suite of applications aiming to unify the service configuration
    and the behavior across different *Linux distributions*. The main command to manage
    services'
  merge: -1
  img_proc: true
