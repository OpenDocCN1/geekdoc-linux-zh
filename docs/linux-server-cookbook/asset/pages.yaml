    # NFS service and client


    Network File System (NFS) is a distributed file system protocol developed in 1984
    by Sun Microsystems. The modern version of the protocol is version 4, referenced
    as NFSv4, replacing the previous version 2 (NFSv2) and version 3 (NFSv3). NFS
    is the most popular protocol for sharing data with clients in a Linux system.
    Other storage solutions, such as Network Attached Storage and Storage systems,
    allow the sharing of available storage using the NFS protocol. The NFS server
    can be seen in figure 10.1:


    ![](img/863afa537de4eed7deb11978bfbfa90e_305_0.png)


    The NFS implementation in Linux includes several services required to provide
    authentication and access to the shared data to the clients. Table 10.1 shows
    the required services and the ports used:


    | Service | Description |

    | :--- | :--- |

    | nfsd | The NFS server, which services the requests from the clients. It uses
    the port 2049/udp or 2049/tcp. |

    | rpcbind | The server that covers Remote Procedure Call (RPC) program numbers
    into universal addresses. Clients connect to rpcbind to determine the |'
  merge: -1
  img_proc: true
- pgno: 306
  md: '| | address where the requests should be sent. This service uses 111/udp or
    111/tcp. This is not required on NFSv4. | | | | rpc.mountd | Used for version
    2 and version 3 to implement the directory mounting from a client. Version 4 uses
    only nfsd. | | | | rpc.nfsd | Provides an ancillary service needed to satisfy
    the NFS requests by the clients. | | | | locked | It implements the Network Lock
    Manager (NLM) protocol, used by NFSv3, to lock files in the server. | | | | rpc.statd
    | It implements the Network Status Monitor (NSM) protocol, which notifies the
    clients when the server is restarted. | | | | rpc.idmapd | It provides to NFSv4
    server and client a map between names, local user ids, and group ids. |


    Table 10.1: NFS services and description


    The modern **NFSv4** is updated regularly with new versions and new features.
    For example, version 4.1 includes **Parallel NFS (pNFS)**, and version 4.2 includes
    *server-side clone and copy* features. It is important to take into consideration
    that some clients only accept specific versions (3,4) or minor versions (4.0,
    4.1) of the NFS protocol.


    # NFS server


    The package on the **Advanced Packet Tool (APT)** repositories, including the
    NFS server, is called **nfs-server**. On systems using RPM Package Manager, the
    server and the client is included inside the package named **nfs-utils**. In both
    systems, the main service on **systemd**, after installation, is named **nfs-server**.


    The main file to configure the service is `/etc/nfs.conf`, where it is possible
    to configure different values such as the IP protocol to be used (*tcp* and/or
    *udp*) or the NFS versions to be enabled (2, 3, 4, 4.0, 4.1 and 4.2). The following
    excerpt shows the parameters specific for the *nfsd* service, which by default
    are commented as follows:


    ```

    [nfsd]

    # debug=0

    # threads=8

    # host=

    # port=0

    # grace-time=90

    # lease-time=90

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: '```

    # udp=n

    # tcp=y

    # vers2=n

    # vers3=y

    # vers4=y

    # vers4.0=y

    # vers4.1=y

    # vers4.2=y

    # rdma=n

    # rdma-port=20049

    ```


    By default, the NFS service will be listening on **2049**/*tcp*, and it will support
    versions 3, 4, and all the subversions. The file */lib/systemd/system/nfs-server.service*
    defines the services related to the NFS service as shown in the following code
    block:


    ```

    [Unit]

    Description=NFS server and services

    DefaultDependencies=no

    Requires=network.target proc-fs-nfsd.mount

    Requires=nfs-mountd.service

    Wants=rpcbind.socket network-online.target

    Wants=rpc-statd.service nfs-idmapd.service

    Wants=rpc-statd-notify.service

    Wants=nfsdclt.service

    After=network-online.target local-fs.target

    After=proc-fs-nfsd.mount rpcbind.socket nfs-mountd.service

    After=nfs-idmapd.service rpc-statd.service

    After=nfsdclt.service

    Before=rpc-statd-notify.service

    # GSS services dependencies and ordering

    Wants=auth-rpcgss-module.service

    After=rpc-gssd.service gssproxy.service rpc-svcgssd.service

    [Service]

    Type=oneshot

    RemainAfterExit=yes

    ExecStartPre=-/usr/sbin/exportfs -r

    ExecStart=/usr/sbin/rpc.nfsd

    ```'
