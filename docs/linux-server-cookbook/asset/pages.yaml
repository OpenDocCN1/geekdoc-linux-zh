    # ## Variables\n\n*Ansible* uses variables to manage differences between the hosts.\
    \ For example, it is possible to perform a task only when the distribution is\
    \ a specific one but skips it if it is a different one. It is possible to define\
    \ variables directly in a Playbook, Inventory, or a file and include it or specify\
    \ variables as options running `ansible-playbook`. Some examples of variable use\
    \ cases are as follows:\n\n+   Define the port for an application, for example,\
    \ a variable to define the port 443 for a Web server in production or 8443 for\
    \ development.\n\n+   Specify the user to be used. For example, the user www-data\
    \ for Ubuntu and apache for CentOS systems.\n\n+   Specify the configuration file.\
    \ For example, /etc/apache2/apache2.conf for Ubuntu and /etc/httpd/conf/httpd.conf\
    \ on CentOS.\n\nWhen a variable is part of a string or template, it is needed\
    \ to wrap it between double curly brackets:\n\n```\n```\n{{ variable }}\n```\n\
    ```\n\nThe module debug on Ansible allows the display of the value of a variable\
    \ using the argument var or showing a message on the screen with the argument\
    \ msg. This module is useful to ensure the proper value for the variable is set.\
    \ The following code shows an example:\n\n```\n```yaml\n- name: Variable examples\n\
    hosts: localhost\ngather_facts: False\nvars:\n  firstname: Alberto\ntasks:\n -\
    \ name: Show variable name\n```\n```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "```\n```ansible\nansible.builtin.debug:\n  var: firstname\n- name: Show a message\n\
    \  ansible.builtin.debug:\n    msg: \"Your name is {{ firstname }}\"\n```\n```\n\
    \nIn the previous example, there are some considerations to be taken into account:\n\
    \n+   - In Ansible, it is not mandatory to start with a triple dash and end with\
    \ triple dots.\n+   - The host `localhost` is always available, and the connection\
    \ will be local (not SSH).\n+   - It does not gather the *facts*.\n+   - A variable\
    \ `firstname` is defined and is shown in two tasks.\n\nThe output of the execution\
    \ of the previous *Playbook* is shown in *figure 12.24*.\n\n```\n```text\nPLAY\
    \ [Variable examples] ********************\nTASK [Show variable name] ************\n\
    ok: [localhost] => {\n  \"firstname\": \"Alberto\"\n}\nTASK [Show a message] ********\n\
    ok: [localhost] => {\n  \"msg\": \"Your name is Alberto\"\n}\nPLAY RECAP ********************\n\
    localhost : ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n\
    ```\n```\n\n![](img/863afa537de4eed7deb11978bfbfa90e_411_0.png)\n\nA variable\
    \ defined in a *Playbook* can be overwritten using the argument **--extra-vars**\
    \ (-e). The following example in *figure 12.25* shows the usage of the option\
    \ **--start-at-task** and how to override the value of the variable *firstname*."
