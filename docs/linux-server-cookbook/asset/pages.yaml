    # NoSQL databases


    A **NoSQL** (also known as **non-only-SQL** or **non-relation**) database stores
    the data differently than relational tables. These databases are called *non-tabular
    databases* and contain a variety of types based on their data model. The popular
    data structure are as follows:


    +   * **key-value pair:** The simplest type, each object is assigned to a unique
    key. To obtain the value, it is needed to specify the key.

    +   * **wide column:** It uses tables, rows, and columns, but the names and format
    of the columns can vary from row to row.

    +   * **graph:** Uses a graph structure for semantic queries with *nodes, edges*,
    and properties to represent and store data.

    +   * **document:** It stores the data in *JSON* or *XML* format.


    NoSQL databases are getting popular for applications generation big quantities
    of data due to their performance being better than relational databases. Applications
    used in big data and real-time Web (such as analytics) are some of the main use
    cases for NoSQL databases. Its unique features are as follows:


    +   * **Flexible schemas:** They do not require to have the same set of fields
    and the data type for a field.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '+   - **Horizontal scaling:** Adding nodes to share the load is a simple task
    in *NoSQL*.


    +   - **Fast queries:** Querying a *NoSQL* is faster than a relational database.


    +   - **Ease of use for developers:** For developers, it is easier to use *NoSQL*
    to store structured or unstructured data.


    Some of the popular open-source database *NoSQL* solutions available are as follows:


    +   - **MongoDB**: A document database with the scalability and flexibility that
    you want with the querying and indexing that you need.


    +   - **Apache Cassandra**: A database designed to store data for applications
    that require fast read and write performance.


    +   - **Apache CouchDB**: A document database that collects and stores data in
    JSON-based document formats.


    +   - **Apache Hbase**: A distributed big data store.


    +   - **Redis**: An in-memory key-value data structure store that can be used
    as a database, cache, or message broker.


    +   - **Neo4j**: A graph database management system.


    # ## MongoDB databases


    MongoDB is one of the most popular NoSQL databases used on Linux systems. MongoDB
    has the following three different editions:


    +   - **Community Server**: It is free and available for Windows, Linux, and macOS.


    +   - **Enterprise Server**: It is free and available for Windows, Linux, and
    macOS.


    +   - **Atlas**: It is available as an on-demand fully managed service. MongoDB
    Atlas runs on AWS, Microsoft Azure, and Google Cloud Platform.


