  md: '+   * **Consistency**: The database must be consistent before and after the
    transaction.


    +   * **Isolation**: Multiple transactions occur independently without interference.


    +   * **Durability**: Guarantees that once the transaction has been committed,
    it will be available even in the case of a system failure.


    The four main actions against databases are: **create**, **read**, **update**,
    and **delete**, and these operations are called **CRUD** operations.


    # Structured Query Language (SQL)


    This declarative language is used to manage data held in an RDBMS. It can be used
    to create, manipulate and query data. Although SQL has standards defined, the
    implementation between different vendors is not necessarily following them.


    A statement performs an operating against the database engine. The statements
    are ending with a semicolon (;). The SQL statements are categorized into five
    categories:


    +   * **Data Definition Language (DDL)**: Used to define the database schema.
    It is possible to create, modify, or delete one object of the database. For example,
    a database or a table. The main statements available are as follows:


    +   ○ **CREATE**: Used to create a new object. After the keyword, CREATE follows
    the object to be created (for example, **DATABASE** or **TABLE**) and the name
    desired.


    +   ○ **DROP**: Removes an existing object inside of the database system.


    +   ○ **ALTER**: Modifies an existing object inside of the database system.


    +   ○ **TRUNCATE**: Deletes all the objects of the table specified.


    +   ○ **RENAME**: Renames an existing object inside of the database system.


    +   * **Data Query Language (DQL)**: Used to query the data within the database
    system. The statement used to query data is **SELECT**.


    +   * **Data Manipulation Language (DML)**: Used to manipulate the data inside
    a table. The main statements available are as follows:


    +   ○ **INSERT**: Used to insert data inside a table.


    +   ○ **UPDATE**: Used to modify data inside a table.


    +   ○ **DELETE**: Used to delete records inside a table.'
  merge: -1
  img_proc: true
- pgno: 334
