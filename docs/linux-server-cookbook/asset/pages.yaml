    --socket=/run/mysqld/mysqld.sock --pid-file=/run/mysqld/mysqld.pid --basedir=/usr

    --bind-address=127.0.0.1 --expire_logs_days=10 --character-set-server=utf8mb4
    --co

    llation-server=utf8mb4_general_ci

    ```


    Figure 11.10: Output example command mariadbd


    The service **mariadbd** (or **mysqld**) is executed under the user **mysql**
    and the group **mysql** . When the service is started, the logs are redirected
    to **journald** or the file /var/log/mariadb/mariadb.log, depending on the configuration
    previously'
