  md: "The Linux command line is known as well as the *terminal*, *console*, or *shell*.\
    \ There are ways to access the command line as follows:\n\n+   Using the internal\
    \ Linux console provided by the Linux kernel, accessible locally in the system.\
    \ The name for the software providing the login is called getty and modern distributions\
    \ include a default alternative named agetty.\n+   \n+   Using a terminal provided\
    \ by the graphical environment of the system, where the commands will be executed\
    \ in the system where it is running. Some examples are GNOME Terminal, Konsole,\
    \ or Terminator.\n+   \n+   A remote terminal connecting from another console,\
    \ usually using the protocol SSH.\n\nWhen the system is booted and not installed\
    \ with a graphical interface, a Linux terminal will appear to introduce the username\
    \ and the password. Traditionally, there were six available consoles to be used,\
    \ with the keyboard combinations Ctrl+Alt+F1 through Ctrl+Alt+F6. This behavior\
    \ is configurable, and some distributions use Ctrl+Alt+F2 through Ctrl+Alt+F7.\n\
    \nWhen the system is installed, and a graphical interface enabled, the server\
    \ will show that interface as default. Using the combination Ctrl+Alt+F1 through\
    \ Ctrl+Alt+F6, as described previously, will show the native Linux console, whereas\
    \ Ctrl+Alt+F7 will return to the graphical interface. Some distributions use Ctrl+Alt+F1\
    \ for the same purpose.\n\nOn Linux, there are the following two main software\
    \ terminals:\n\n+   **TeleTYpewriter (tty):** enables direct interaction with\
    \ the operating system, handling the input from the keyboard and the output using\
    \ the screen.\n+   \n+   **Pseudo-tty (pty):** A pseudo terminal behaves like\
    \ a regular TTY using two pseudo-device endpoints. Using the graphical interface\
    \ or connecting to a remote system, this pseudo terminal is used.\n\nWhen the\
    \ login is completed, or a terminal from a graphical environment is used, an input\
    \ field to write commands appears, indicating the system is ready to accept tasks.\
