    Another important topic related to routing, especially for enterprises, is dynamic
    routing. This type of routing adjusts in real time; the path used for transmitting
    IP packets depends on different conditions, such as the shortest path or best
    availability. Protocols such as **Border Gateway Protocol (BGP)** and **Open Shortest
    Path First (OSPF)** are some popular examples of dynamic routing.


    # ## Advanced network configuration


    There are three important advanced network configurations required nowadays for
    managing Linux systems:


    +   * Systems offering services to end users require special network configuration
    to avoid bottlenecks and reduce the possibility to have network downtimes. This
    involves knowledge of configuring Link Aggregation (bonding).

    +   * Systems running Virtual Machines using virtualization technology require
    to configure network bridges to provide connectivity and traffic isolation. Linux
    provides tools to create denominated *Linux bridges* or the use of *virtual* switches
    using some tools such as *Open vSwitch*.

    +   * Managing multiple networks inside of a network requires knowledge related
    to *Virtual LANs (VLANs)* and configuring the Linux system to access to those
    networks.


    # ### Link aggregation (bonding)


    Bonding refers to aggregate multiple network connections in one. The purpose is
    to have a high-availability connection, allowing one of the connections to fail
    without causing any downtime. Using a protocol named *LACP (802.3ad)* allows not
    only to have a high availability aggregation but also makes it possible to aggregate
    the traffic bandwidth available. This protocol requires having switches supporting
    this protocol and configuring the ports connected to the system.'
  merge: -1
  img_proc: true
