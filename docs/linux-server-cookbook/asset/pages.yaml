    # OpenStack


    The cloud solution **OpenStack** is an open-source platform usually deployed to
    have a **Private Cloud** in an *on-premise* environment. This mature solution
    started in the year 2010 and is used by thousands of companies in different sectors.
    It is possible to integrate with the infrastructure existing, such as storage
    or networking available.


    The services offered by **OpenStack** are similar to the most used ones in a **Public
    Cloud** solution. The core services on OpenStack are described in the following
    list:'
  merge: -1
  img_proc: true
- pgno: 526
  md: '+   - **Nova:** Provides a way to provision compute instances (also known as
    *virtual servers*).


    +   - **Neutron:** Handles the creation and management of virtual networking infrastructure,
    including networks, switches, subnets, and routers for devices managed by *OpenStack*.


    +   - **Keystone:** Provides API client authentication and multi-tenant authorization.


    +   - **Horizon:** Provides a Web-based user interface to *OpenStack* services,
    including *Nova, Swift, Keystone*, and so on.


    +   - **Cinder (Block Storage Service):** The service for providing volumes to
    *Nova* virtual machines.


    +   - **Glance (Image Service):** The service where users can upload and discover
    images to be used for *Virtual Machines*.


    +   - **Swift (Object Storage Service):** A highly available, distributed, and
    eventually consistent object/blob store.


    +   - **Ironic:** Service to provision *bare metal* (as opposed to virtual) machines.


    +   - **Heat:** Service to orchestrate composite cloud applications using a declarative
    template format.


    Refer to *figure 15.2* to see the OpenStack components:


    ![](img/863afa537de4eed7deb11978bfbfa90e_526_0.png)


    Other useful services are also available optionally on OpenStack:


    +   - **Octavia:** It brings network load balancing to OpenStack.'
  merge: -1
  img_proc: true
