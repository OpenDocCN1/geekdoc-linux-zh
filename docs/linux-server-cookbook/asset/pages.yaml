  md: '# Automation with Ansible


    Ansible is the most popular tool for automation due to the ease of use and the
    lack of need to install agents in the systems managed. Ansible is able to manage
    not only operating systems but applications, network devices, infrastructures,
    and much more. Some of the advantages of this solution are as follows:


    +   - Support for most of the Linux distributions.


    +   - Able to manage Windows systems.


    +   - Simple to learn and use.


    +   - Does not require any agent on the managed devices.


    +     - This leads to greater security because it is not needed to manage the
    agent versions or server services.


    +     - It uses a common protocol such as Secure Sockets Shell (SSH) or WinRM
    (for Windows nodes), not requiring opening extra ports, and with the possibility
    to use standard authentication methods.


    +   - A big number of companies collaborating in the project and creating content
    to manage different systems.


    Working with Ansible requires you to know some terminology. Table 12.3 introduces
    some of the important terms and provides a description:


    | Term | Description |

    |---|---|

    | Playbook | List of Plays to perform in the nodes indicated. |

    | Play | List of Tasks to perform in the specified nodes in the Playbook. |

    | Inventory | List, static or dynamic, of the nodes to administrate and the information
    required for each of them (remote IP, username, password, and so on) |

    | Host | A remote machine to manage it. It can be a Linux system, a Windows system,
    or a network device, among multiple options available. |

    | Task | A definition of an Action to perform. |

    | Action | The action to be performed in a Host |

    | Module | Unit of work that Ansible ships out to remote machines. These modules
    are usually written in Python language. |'
  merge: -1
  img_proc: true
- pgno: 391
  md: '| Arguments | Values needed for the Module. |

    | Template | A dynamic file is usually used for configuration files, where variables
    will be evaluated. |

    | Facts | Data discovered about remote Hosts. |

    | Variable | Values specified statically or dynamically to be used in Playbooks
    and Templates. |

    | Roles | A group of tasks, files, and templates that can be reused in different
    projects. |

    | Collections | A new packaging format for bundling and distributing Ansible content,
    including roles, modules, and more. |

    | Conditions | Check to be performed to know if a Task needs to be performed.
    |


    Table 12.3: Ansible Glossary


    Ansible is not installed by default on Linux distributions. As described previously,
    Ansible does not use agents or a service; the only installation required is the
    tool in a Linux system which will be used as a control node. The only requirement
    is to have version Python 3.8 or newer for the latest Ansible versions. This control
    node which has the Ansible tools installed requires to have communication to the
    nodes managed or to the jump hosts used to perform the intermediate connection.


    It is possible to install Ansible using the Linux distribution’s package manager
    or using Python’s package manager (pip). The following instructions are used for
    the installation in an Ubuntu system:


    ```

    apt-add-repository ppa:ansible/ansible

    ```


    ```

    apt install -y ansible-core ansible

    ```


    After installation Ansible is able to run the command ansible with the option
    --version to display the version installed, as shown in the following figure 12.13:'
