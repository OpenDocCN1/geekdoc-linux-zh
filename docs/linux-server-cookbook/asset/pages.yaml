- pgno: 569
  md: '# **Networking architecture**


    The *Networking* part of **OpenStack** is a complex element. The service offering
    the networking functionality is called **neutron**. This is due to the need for
    the isolation of the projects and the networks for the tenants. There are the
    following two types of networks:


    +   - **Overlay Networks**: These virtual networks are internal to **OpenStack**,
    and the traffic is encapsulated through the *tenant* network. The two most common
    encapsulation types are as follows:


    +   - **Virtual Extensible LAN (VXLAN)**: An encapsulation protocol that provides
    data center connectivity using tunneling, stretching Layer 2 connections over
    an underlying Layer 3 network.

    +   - **Generic Network Virtualization Encapsulation (GENEVE)**: The encapsulation
    protocol used on OVN. It promises to address the perceived limitations of the
    earlier specifications and support all of the capabilities of VXLAN.


    To access to an *Overlay Network*, it is required to perform a **Network Address
    Translation (NAT)** from a physical network (the *external* or *public* network)
    to this network. On **OpenStack**, the *IP addresses* used for this purpose are
    called **Floating IPs**.


    +   - **Provider Networks**: These are physical networks attached to the nodes
    in the cluster. *Virtual Machines* can be attached directly to these networks,
    similar to other *Virtualization Platforms*, allowing access directly to them.


    *Figure 16.10* shows the complexity, and in this case, using VXLAN tunnels, of
    the *Network* architecture on **OpenStack**.'
  merge: -1
  img_proc: true
