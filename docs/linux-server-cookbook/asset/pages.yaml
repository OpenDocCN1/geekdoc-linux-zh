- pgno: 539
  md: "```\nwget -0- https://apt.releases.hashicorp.com/gpg | gpg --dearmor\n| sudo\
    \ tee /usr/share/keyrings/hashicorp-archive-keyring.gpg\necho \"deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]\
    \ https://apt.releases.hashicorp.com $(lsb_release -cs) main\" | sudo tee /etc/apt/sources.list.d/hashicorp.list\n\
    sudo apt update && sudo apt install terraform\n```\n\n# Running a simple Web server\
    \ on AWS\n\nThe definition on Terraform is plain text files with an ending .tf.\
    \ For the simplicity of this example, all the definitions are in the same file\
    \ instead of being distributed in several ones (the recommended way). An existing\
    \ VPC named iac-vpc is already configured on AWS. The content of the file main.tf\
    \ is as follows:\n\n```\ndata \"aws_ami\" \"ubuntu\" {\n  most_recent = true\n\
    \  filter {\n    name   = \"name\"\n    values = [\"ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*\"\
    ]\n  }\n  owners = [\"099720109477\"] # Canonical\n}\n\ndata \"aws_vpc\" \"iac-vpc\"\
    \ {\n  cidr_block = \"10.0.0.0/16\"\n  tags = {\n    Name = \"iac-vpc\"\n  }\n\
    }\n\ndata \"aws_subnet\" \"iac-subnet\" {\n  vpc_id     = data.aws_vpc.iac-vpc.id\n\
    \  cidr_block = \"10.0.0.0/20\"\n}\n\ndata \"aws_security_group\" \"allow_http\"\
    \ {\n  vpc_id     = data.aws_vpc.iac-vpc.id\n```"
  merge: -1
  img_proc: true
- pgno: 540
  md: "```\ntags = {\n    Name = \"allow_http\"\n  }\n}\nresource \"aws_instance\"\
