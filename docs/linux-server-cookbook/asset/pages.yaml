    To stop a container, the argument used is, stop. Docker will wait 10 seconds till
    the application is stopped. If it is not stopped in that period, the Container
    will be forcefully stopped. It is possible to override that waiting time using
    the option --time (-t), followed by the number of seconds. Figure 13.13 shows
    how to stop the previous container:


    ```

    root@ubuntu:~# docker stop 0875fc67319c4db3b

    0875fc67319c4db3b


    Figure 13.13: Example use of the argument stop

    ```


    Using the argument ps with option -l, as indicated previously, it is possible
    to set the exit code for the container after being stopped. Figure 13.14 shows
    the output example:


    ```

    root@ubuntu:~# docker ps -l

    CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES

    0875fc67319c debian "/bin/sh -c ''while t... 5 minutes ago Exited (137) ab

    out a minute ago blisssful_wing


    Figure 13.14: Example exit code for a container

    ```


    When the exit code is greater than 128, it means that it was unexpectedly stopped.
    In the previous example, the code 137 means it was stopped forcefully (137-129
    = 9) with a signal SIGKILL (9). It is important to remember that the IP assigned
    to the container will be released when it is stopped and can be reused by another
    one.


    The argument start for the command docker allows restarting a stopped Container.
    When it is started, a new IP address from the available ones will be assigned.


    # Exposing containers


    By default, a Container is only internally accessible from the host (where the
    Docker Daemon is) where it is running. When Docker is installed, a private network
    called bridge is created and used by default. The subnet configured by default
    is 172.17.0.0/16. Figure 13.15 shows how to run a container using the image httpd,
    which contains a default installation of Apache2.'
