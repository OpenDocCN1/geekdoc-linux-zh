    The previous example shows just some of the options available in the **ansible_facts**
    variable. The variable includes more information about the system, such as detailed
    information about the ethernet network cards, disks, and mount points.


    Ansible has some magic variables which cannot be set directly by the user, and
    **Ansible** will override the value based on the configuration or the facts obtained.
    For the variables defined in the **ansible_facts**, it will be prefixed by **ansible_**.
    For example, the **os_family** key from **ansible_facts** will be accessible through
    the magic variable **ansible_os_family**.


    # Conditionals


    It is possible to condition the execution of one task-based using the expression
    **when**. The condition indicated can be if a variable has a specific value or
    any comparison desired. In the following task example, the task will be executed
    only if the **ansible_distribution** variable is equal to Ubuntu.


    ```

    - name: Conditionals example

    hosts: linux

    become: True

    tasks:

    - name: Install apache2 package

    ansible.builtin.apt:

    name: apache2

    when: ansible_distribution == "Ubuntu"

    ```


    If the condition is evaluated as false, then the task will be skipped for the
    specific *host*. Figure 12.28 shows the output example:'
  merge: -1
  img_proc: true
