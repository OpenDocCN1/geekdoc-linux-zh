    # Other popular distributions


    Other popular distributions for servers are the following:


    +   * **Oracle Linux (OL):** A derivative version of Red Hat Enterprise Linux,
    commercially supported and maintained by Oracle Company.


    +   * **Gentoo:** A popular distribution due to the software being compiled for
    the system to be used and is not based on pre-compiled binaries software as other
    distributions.


    +   * **Arch Linux:** A rolling-release distribution without major releases, all
    the new versions of the software or kernel will be available, and the installer
    images are updated and released every two months.


    # Conclusion


    Linux is one of the most customizable operating systems to be installed and provides
    a big number of distributions from the community and from companies with professional
    support.


    Installation does not require expert knowledge allowing beginners to have a secure
    and efficient system. Expert users can use advanced features during the installation
    to have a production-ready server after the installation.


    The decision of Linux distribution includes different considerations to be taken,
