- pgno: 199
  md: '# ## Out of memory management


    When an application is executed in Linux, it reserves memory space but usually
    is not using all of it. That allows Linux to be able to execute more applications
    than the memory available, expecting that the memory used for the application
    is going to be less than the available. Linux includes a manager to detect when
    the system is using more memory than it should and automatically kills non-critical
    processes which are using memory.


    Each process has a *score* associated; a higher score indicates it is more likely
    to be killed. The score for a process is stored on `/proc/<pid>/oom_score` file.


    # ## Monitoring disk usage and available space


    Storage is one of the Input/Output elements which can cause a bottleneck in the
    system due to many operations performed in the same storage device or related
    to physical issues. Linux provides tools to check usage and available space, the
    disk statistics for input/output operations, and to check the physical status
    of the storage devices


    Command `lshw` can be used to list the physical storage components in the system,
    such as *RAID* controllers or *SATA* controllers. Figure 6.28 shows an example
    of physical server information:


    ```

    [root@server ~]# lshw -c storage -short

    H/W path Device Class Description

    /==========================================

    /0/100/11.4 storage C610/X99 series chipset 5SATA Contro

    /0/100/14/0/e/2 storage Mass storage device

    /0/100/1f.2 storage C610/X99 series chipset 4-port SATA

    /0/100/1f.5 storage C610/X99 series chipset 2-port SATA

    /0/2/0 scsi1 storage MegaRAID SAS-3 3108 [Invader]

    /0/8f scsi0 storage

    ```


    *Figure 6.28: Output example for the command lshw*


    The same command can be used to list the storage attached to the server, such
    as physical disks (can be virtual disks configured as *RAID*) or virtual disks
    (*emulated disks*, for example, for remote CD/Floppy). Figure 6.29 shows an example
    of the same server illustrated before:


    ```

    [root@server ~]# lshw -c disk -short

    H/W path Device Class Description

    /==========================================

    /0/2/0/2.0.0 /dev/sda disk 799GB MR9361-8i

    /0/8f/0.0.0 /dev/sdb disk 1474KB Virtual Floppy

    ```'
