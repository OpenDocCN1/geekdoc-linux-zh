    # Regular expressions


    Regular expressions are patterns used to match character combinations in strings.
    These expressions can be simple ones or advanced ones using a complex patterns.
    This section will focus on simple expressions to filter content inside files.
    There are three types of regular expressions: basic (*BRE*), extended (*ERE*),
    and *Perl (PCRE)*. Only the first two are going to be covered as an example. Some
    of the special characters for the *basic* type are shown in *table 5.15*:


    | Special character | Description |

    | :-- | :-- |

    | . (dot) | Matches any element |

    | ^ (circumflex) | Matches the beginning of the sequence. |

    | $ (dollar) | Matches the end of the sequence. |


    ![](img/863afa537de4eed7deb11978bfbfa90e_166_1.png)


    For the *advanced* type, it is possible to match repetitions of characters and
    conditions. These types of special characters are shown in *table 5.16*:


    | Special character | Description |

    | :-- | :-- |

    | * (asterisk) | Zero or more repetitions |

    | + (plus) | One or more repetitions |

    | ? (question mark) | Zero or one repetition |

    | [m] | Exactly m repetitions |

    | [m,n] | Between m and n repetitions |

    | \| (bar) | Matches the left or the right expression. |'
  merge: -1
