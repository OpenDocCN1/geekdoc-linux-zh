    +   **case/esac statement:** It evaluates an expression, and it matches different
    patterns defined. If one pattern matches, the statements defined will be executed.
    The syntax is the following:

    +   ```

    +   case EXPRESSION in

    +   PATTERN_1)

    +   STATEMENTS

    +   ;;

    +   PATTERN_2)

    +   STATEMENTS

    +   ;;

    +   *)

    +   STATEMENTS

    +   ;;

    +   esac

    +   ```


    The `expression` to be evaluated as a condition is based on the available expressions
    for the `builtin function` named `test`. The expression can be wrapped using square
    brackets ([ and ]) or after the word `test`. The following code shows an equivalent
    example with both syntaxes:


    ```

    if [ $# -ne 1 ]; then

    echo "Number of arguments should be one"

    fi

    if test $# -ne 1; then

    echo "Number of arguments should be one"

    fi

    ```


    The `expressions` are used to check and make comparisons. In the previous code,
    the check `-ne` stands for *not equal*. The most used checks and comparisons available
    and their respective descriptions are shown in *table 12.2*:


    | Check | Description |

    | :--- | :--- |

    | -n STRING | The length of *STRING* is nonzero |'
