    +       - Self-support: Access to Red Hat Products and access to the knowledge
    base and tools from the Customer Portal.

    +       - Standard: Access to support of engineers during business hours.

    +       - Premium: Access to support engineers 24 × 7 for high-severity issues.


    +   - **Canonical** offers commercial support for *Ubuntu Server* with two options:

    +       - Ubuntu Advantage for Applications: Security and support for open-source
    database, logging, monitoring, and aggregation services (LMA), server, and cloud-native
    applications.

    +       - Ubuntu Advantage for Infrastructure: Security and IaaS support for open-source
