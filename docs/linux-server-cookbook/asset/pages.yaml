  md: "Dynamic Host Configuration Protocol (DHCP) is a protocol to automatically assigns\
    \ Internet Protocol (IP) addresses to the devices in the network. Chapter 7, Network\
    \ Configuration, introduced the different layers of networking. The first layer,\
    \ called the physical layer, is responsible for the transmission and reception\
    \ of the data in a device. There are no IP addresses present in this layer to\
    \ send the data between the nodes. Thus, it is based on the physical address.\
    \ When a device without a static IP configured is booting, it asks the network\
    \ to obtain an IP address. For this request, it sends a query using User Datagram\
    \ Protocol (UDP) to port 67 as a destination and port number 68 as the client,\
    \ and it waits for an answer. This can be seen in figure 9.1:\n\n![](img/863afa537de4eed7deb11978bfbfa90e_275_0.png)\n\
    \nThis request, called discover, is sent to all the devices in the network, expecting\
    \ to reach a DHCP server, as observed in the preceding figure 9.1. As there are\
    \ no IPs in this layer, the packet will be sent to the special address FF:FF:FF:FF:FF,\
    \ and the node will specify its own MAC address for which it wants the IP address.\
    \ In the ethernet packet, the special IP 0.0.0.0 would be included as the source\
    \ IP and the broadcast IP 255.255.255.255 as a destination. The following excerpt\
    \ from tcpdump's output shows an example:\n\n```\n```text\n16:28:34.690916 52:54:00:1a:9c:c4\
    \ > ff:ff:ff:ff:ff:ff, ethertype IPv4\n(0x0800), length 342: (tos 0x10, ttl 128,\
    \ id 0, offset 0, flags [none],\nproto UDP (17), length 328)\n  0.0.0.0.68 > 255.255.255.67:\
    \ [udp sum ok] BOOTP/DHCP, Request from\n52:54:00:1a:9c:c4, length 300, xid 0x746de14f,\
    \ Flags [none] (0x0000)\n    Client-Ethernet-Address 52:54:00:1a:9c:c4\n    Vendor-rfc1048\
    \ Extensions\n      Magic Cookie 0x63825363\n      DHCP-Message (53), length 1:\
    \ Discover\n      Hostname (12), length 6: \"ubuntu\"\n```\n```\n\nThe DHCP service\
    \ will be listening in the network, waiting for requests. When a discover request\
    \ is received, it will check if there is any IP available from the range"
