    # ## Conclusion


    In this chapter, we understood how the core network services are working, and
    the software associated needed for the daily tasks of system administrators. This
    chapter covered three of the most important services: *DHCP*, which is required
    for the servers when they booting; *DNS*, which is required for servers and applications;
    and *SSH*, which is required for the system administrators to administrate remote
    systems.


    Knowing where the configurations are located, and the different options available
    will allow the administrator to protect the system and provide high-quality service.
    This chapter also described other popular services in Linux and the associated
    software.


