    # The magnitude of Linux


    Nowadays, it is impossible to understand our lives without a device connected
    to the internet: a phone, a tablet, or a personal computer,'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'accessing a Web server or using an application to read one’s e-mails, look
    up something in a search engine (like Google), or shop for a product you need.


    The most common operating system for phones and tablets is Android, a Linux variant.
    Popular services used by people on a daily basis, such as mail servers or Web
    servers, are all most probably running in systems with a Linux distribution. Other
    devices providing Internet access to those services are usually running Linux
    too.


    Linux is also used by a large number of professional developers, IT professionals,
    and regular users as their main operating system. Linux is currently the third
    most popular operating system for the desktop.


    Linux began as a personal project by Linus Torvalds in the year 1991. The development
    was done on MINIX, a Unix-like operating system. The year after, the X Window
    System was ported to Linux, helping to gain importance. The timeline for the more
    important releases are the following:


    +   - The first stable version was released in the year 1994.

    +   - The version 2.0 was released in the year 1996.

    +   - The version 2.2 was released in the year 1999, 2.4 in the year 2001, and
    2.6 in 2003.

    +   - The version 3.0 was published the year 2011.

    +   - The version 4.0 in the year 2015, 5.0 in the year 2019, and version 6.0
    in 2022.


    Some other important events related to Linux during history are as follows:


    +   - Debian started in the year 1993.

    +   - Red Hat Linux was released in the year 1994

    +   - Ubuntu was released in the year 2004.

    +   - Android version 1.0 was released in the year 2008.

    +   - All the Top500 list of fastest supercomputers run Linux from the year 2017.


    # Linux on key sectors of the IT industry'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Linux is a well-known platform for running applications and services in enterprise
    environments. But Linux is not limited to servers; it is a key part of the Information
    Technology industry and its general areas, such as:


    +   • Software

    +   • Devices and Infrastructure

    +   • Information Technology and Business Services

    +   • Emerging Technologies

    +   • Telecommunications Services.


    # ## Software


    This area includes developing software for business or customer markets, such
    as internet applications, system software, databases, management, home entertainment,
    and so on. Historically speaking, there was a gap between developers and the system
    administrators, as well as between the developers and the environment where the
    applications are executed.


    Modern development methodologies are based on the balance and relationship between
    the system administrators and the programmers. The concept of **DevOps** is a
    set of practices that combines software development (**Dev**) with IT Operations
    (**Ops**). It aims to improve the system development life cycle and provides continuous
    delivery with high software quality.


    **DevOps** methodology is based on multiple tools, called *toolchains*, and is
    deployed by Linux in different stages. Some of these tools will be covered in
    this book. The following figure illustrates this:'
  merge: -1
  img_proc: true
- pgno: 30
  md: "![](img/863afa537de4eed7deb11978bfbfa90e_30_0.png)\n\n+   - **Plan:** This\
    \ stage is the definition of the activities required.\n+   \t- *Jira* is one of\
    \ the most popular tools for this stage that can be executed on Linux. Some open-source\
    \ alternatives are *Taiga* and *Kanboard*.\n+   - **Create:** This stage includes\
    \ the coding, building, and integration with the source repository as well as\
    \ the continuous integration.\n+   \t- Some popular tools are as follows:\n+ \
    \  \t\t- For coding, Integrated Development Environments (*IDEs*): *Vim, Emacs*,\
    \ and *Visual Studio Code*.\n+   \t\t- For repository and packaging: JFrog Artifactory,\
    \ Sonatype Nexus, Gitlab.\n+   \t\t- For building and continuous integration:\
    \ *Maven, Jenkins*, and *Gitlab CI*.\n+   - **Verify:** This stage ensures the\
    \ quality of the software. Different tests are performed during this stage related\
    \ to security, integration, and performance."
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   ○ Some popular tools are as follows:

    +   ▪ Testing tools: Selenium, Appium, Cypress, and JMeter.

    +   ▪ Bug tracking: Bugzilla, Redmine, and Mantis BT.

    +   ▪ Code review: Gerrit, Gitlab, and ReviewBoard.

    +   ▪ Security: OWASP ZAP, OSSEC, and SonarQube.


    +   - **Package:** After the verification stage, the release is ready to be deployed
    in a system with similar characteristics than production; this environment is
    called stage or preproduction.

    +   ○ Popular tools include Docker and other tools described in the Create stage.


    +   - **Releasing:** This is one of the most important stages of DevOps methodology,
    and it includes the orchestration and the deployment of the software to production.

    +   ○ Container platforms: Docker and Kubernetes.

    +   ○ Popular continuous development tools: goCD and ArgoCD.


    +   - **Configuring:** This stage includes infrastructure configuration and management
    and infrastructure as code tools.

    +   ○ Popular tools examples: Ansible, Puppet, and Terraform.


    +   - **Monitoring:** This stage examines the performance monitoring and end-user
    experience for the applications.

    +   ○ Popular tools examples: Prometheus and Grafana, Elastic Search, Zabbix,
    and Nagios.


    Companies are using Linux for developing and run software due to the reliability,
    customization, and performance offered by this system. Linux offers a secure environment
    to run critical and customer-facing applications.


    # Devices and infrastructures


    Linux is not only limited to physical servers or virtual machines. Rather, it
    is present in every device type available, some examples of which are as follows:'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   * Tiny computers like the popular Raspberry PI

    +   * Tablets, Chromebooks, and E-readers

    +   * Televisions and streaming devices

    +   * Routers and other network devices

    +   * Supercomputers: the top 500 of which are using Linux


    Enterprise infrastructure has undergone a great transformation during the last
    two decades. Devices for storage and networking, for example, were previously
    closed proprietary platforms in a monolithic implementation but have now moved
    to a modular, open implementation, virtualized, or containerized environment.
    The term *Software-defined Infrastructure* is the result of the transformation
    for compute, storage, and network resources. Linux played a key part in this transformation
    in deploying the services with the same, if not better, efficiency.


    **Software-defined compute (SDC):** Also known as virtualization, it is when a
    compute function is virtualized and is abstracted from the hardware that is running
    it. A popular solution for virtualization is *KVM*.


    +   * **Software-defined network (SDN):** A network architecture that makes the
    management of the network more flexible and easier, SDN centralizes the management
    by abstracting the control plane from the data plane. Controllers, the core element
    of SDN architecture, are run in a Linux system. Some popular solutions are *OpenvSwitch*,
    *OVN*, and *OpenDayLight*.

    +   * **Software-defined storage (SDS):** An architecture to offer dynamic storage
    to the endpoints, independent of the underlying hardware available. Some popular
    solutions are *Ceph* and *FreeNAS*.


    # Information technology and business services


    IT services include providers offering services and integration, such as consulting
    and information management. This area also includes data processing and outsourcing
    services, including automation services.


    # Business services'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Business services offered by IT companies have been transitioning from an implementation
    and maintenance stage to offering services and integration solutions. The concept
    of “as-a-service” is currently one of the most important ones in business services,
    especially with the adoption of cloud computing. There are three popular types
    offered “as-a-service”, where Linux is a key component:


    +   - **Software as a Service (SaaS)**: This service offers applications where
    everything behind is managed by the provider. This includes everything related
    to storage, network, virtualization, server, operating system, and runtime. In
    this category, popular Web services for e-commerce, document sharing, and editing,
    or online editors are also included.


    +   - **Platform as a Service (PaaS)**: This service offers the possibility of
    running your own applications on a platform fully managed by the provider. In
    this scenario, only the application and data is managed by the customer. The environment
    to build, test, and run applications are offered for that purpose. Some examples
    are OpenShift, Heroku, and PaaS, offered by cloud providers such as AWS Elastic
    Beanstalk, Google App Engine, or WindowsAzure.


    +   - **Infrastructure as a Service (IaaS)**: This service offers the infrastructure
    required by the customer to provide solutions to end users. Networking, storage,
    servers, virtualization (if needed), operating system, and the rest of the elements
    needed to offer the solutions are managed by the administrator of the IaaS (the
    client who requested it). Popular private IaaS includes OpenStack, and popular
    public solutions include DigitalOcean, Rackspace, and services offered by public
    clouds such as AWS, Google Cloud, IBM Cloud, and Microsoft Azure, among others.


    The following figure compares the three popular types, indicating the elements
    managed by the customer as well as the elements managed by the service provider:'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/863afa537de4eed7deb11978bfbfa90e_34_0.png)


    *Figure 1.2: Differences between On-Site, IaaS, PaaS, and SaaS. Source: Red Hat*


    # ## Automation services


    Automation and integration services are key parts in the implementation of solutions.
    With automation solutions, companies can design and implement processes to reduce
    human interventions, including application release, providing new services, or
    scaling existing ones. Popular automation tools such as *Ansible* and *Terraform*
    are widely used to facilitate the orchestration and integration of new services.


    # ## Emerging technologies'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Access to technology and digital services for most of the world’s population
    was the biggest success of the *Digital Revolution*, also known as the *Third
    Industrial Revolution*. The IT sector is evolving and changing frequently with
    new technologies and innovations, and currently, we are part of the *Imagination
    Age (Fourth Industrial Revolution, Industry 4.0)*, where the trend is automation
    and data exchange. Some of the top emerging technologies are as follows:


    +   - **Artificial Intelligence (AI), Machine Learning (ML), and Deep Learning:**
    Artificial Intelligence is a sub-field of computer science that explores how machines
    can imitate human intelligence. Machine Learning is the science to learn from
    seen data and then create models to make predictions from data. Deep Learning
    is a subset of machine learning where artificial neural networks learn from large
    amounts of data. Open-source tools and libraries for AI/ML are available; some
    examples are *TensorFlow, Keras, Scikit, and PyTorch*.


    +   - **Big Data:** It is a term to describe large or complex volumes of data
    that can be structured or unstructured. Nowadays, the term technology is the software
    utilities designed for analyzing, processing, and extracting information from
    the data. *Apache Hadoop* and *Apache Spark* are two of the most popular solutions
    in this category.


    +   - **Augmented reality (AR) and Virtual Reality (VR):** Augmented reality is
    a real-time experience interacting with objects that reside in the real world
    but are virtually enhanced by computer-generated perceptual information. Virtual
    reality is an experience of an artificial environment provided by a computer.
    Some open-source options are *ARToolKit+, ARCore, and AR.js*.


    +   - **Internet of the Things (IoT):** This technology refers to the connection
    of physical objects embedded with sensors and software that transmit and receive
    data from the internet. That includes cars, home appliances (*smart homes*), cameras,
    and other common devices. Many Linux distributions are available for IoT: *Ubuntu
    Core, Raspberry Pi OS*, and *Yocto project* (to create custom embedded Linux-based
    systems).


    +   - **Edge computing:** This technology is the distribution of computing topology
    closer to the source of the data. This is a key part of the'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Internet of Things and the 5G connections (described in the next section).
    For the *Infrastructure-as-a-Service* and *Hybrid Cloud*, multiple solutions running
    on *Linux* to provide edge computing: *OpenStack* for virtualization and *Kubernetes*
    for containers, are the most popular.


    # Telecommunications services


    This area includes communication equipment and services related to telecommunications.
    This industry experienced a big transformation during the last few decades. Evolution
    from *2G* (*second generation*) mobile networks infrastructure based on *Global
    System for Mobile* (GSM), starting in 1991 and used for primarily for calls and
    SMS, to *third generation* (*3G*) based on network architecture named *Universal
    Mobile Telecommunications System* (UMTS), starting in 2001 and having internet
    access, has taken place. Most recently, in 2009, the *fourth generation* (*4G*)
    of mobile infrastructure came out, which puts forth a huge difference related
    to the data rate available for mobile devices today, allowing high bandwidth access
    to multimedia content, video and voice calls using technology *Long-Term Evolution*
    (LTE) standard broadband communication.


    The first implementations of telecommunications services were on closed proprietary
    platforms using hardware-driven means. This was forcing companies to pay for license
    and hardware from one vendor while also having a monolithic infrastructure. Migration
    to a modular, using interchangeable systems and multi-vendor platforms, opened
    opportunities for *Linux* and Open Source. Recent migration of different telecommunication
    infrastructures to virtualized infrastructure, as well as the virtualization of
    *network functions*, positioned *Linux* as the main player as an operating system
    for that transformation.


    In 2019, a new broadband technology standard generation, that is, *5G*, has come
    forth that provides better speed transmissions and new features to users, and
    for emerging technologies described previously, like the Internet of Things (*IoT*)
    and *Augmented* *Really* (*AR*). These new features include low latency that is
    needed for the sensors and embedded device, as well as better availability and
    coverage. The fifth generation implementation is based on cloud services, where
    a transformation takes place from virtualized'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'network functions to containerized network functions. In this transformation,
    Linux and open-source technologies are a key part of the implementation.


    # Latest features in Linux


    Linux has been evolving and implementing new features based on the needs from
    the new emerging technologies and the sector requirements. The Linux kernel is
    the core of the operating system, providing an interface between the applications
    and hardware, and it provides multiple functionalities. Linux distribution releases
    include recent versions of the kernel and updated versions of different tools.
    Some popular latest features in Linux include the following:


    +   - **Live patching**: allows keeping the Linux server updated to the latest
    kernel version without the requirement of rebooting the system, which was previously
    needed. This feature has been around for many years, but the latest version of
    distributions includes mature tools for this. Some of the implementations for
    this feature are Ksplice, Kpatch, Livepatch, and KernelCare.

    +   - **ExFAT support**: latest versions of Linux Kernel supports the popular
    Windows filesystem for flash memories.

    +   - **Control Groups (v2)**: A mechanism to limit and isolate resources (CPU,
    memory, and disk I/O, for example) of a process or collection of processes. Software
    such as Docker, systemd, and libvirt uses this mechanism.

    +   - **Nftables**: This low-level firewall solution has become the default in
    many distributions replacing the popular iptables. This software provides filtering
    and classification of network packets.

    +   - **eBPF**: is a technology that can run sandboxed programs in the Linux kernel
    without changing the kernel source code or loading a kernel module.


    # Linux versus other operating systems


    One of the main questions that customers using other operating systems, mainly
    Microsoft Windows, have is regarding the reason why Linux should'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'be used and about the complexity related to its installation and maintenance.
    The biggest advantages to using Linux compared to other operating systems for
    servers, desktops, or devices are as follows:


    +   - **Open Source**: The source code for Linux kernel, libraries, and applications
    are available for everyone to review, collaborate, and create new content to share
    with others.


    +   - **Free**: Download and installation of Linux is for free, with the possibility
    to have support from the most advanced companies in the IT sector.


    +   - **Easy to install and maintain**: Installation of any popular Linux distribution
    is an easy task that can be performed by regular users or advanced administrators.
    Maintenance of a Linux system requires less effort than, for example, a Microsoft
    Windows Server due to less complexity to perform tasks such as updating software
    or updating the Linux distribution.


    +   - **Software installation**: Installing software on Linux is easier than on
    other operating systems, thanks to the package manager and utilities around them.
    Repositories contain the software available, and the utilities to install packages
    resolve the required dependencies when we perform a software installation.


    +   - **Mature, stable, and secure**: In more than 30 years of its existence,
    Linux has demonstrated that it is the most mature and secure operating system
    available. From small companies to the biggest corporations, all are strongly
    committed to using Linux to run critical applications on top of it.


    +   - **Commodity hardware**: The requirements to run Linux compared to other
    operating systems do not require having the latest hardware. Linux can be run
    in old systems with less power resources, on new systems embedded with limited
    resources, or in virtual machines without the need to allocate a big quantity
    of memory or CPU cores.


    +   - **Customisation**: Linux, compared to other operating systems, is the one
    with more options to customize to the desire of the regular user or to the system
    administration. Everything in Linux is possible to be configured to the requirements
    needed.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Promising future of Linux


    As was described, Linux is currently a key factor in all the IT sectors and will
    continue being the operating system for most of the solutions in emerging technologies,
    as companies rely on open source and in the features offered by Linux. In the
    near future, containers will go on being used to deploy new services; new architectures
    like ARM will be more available in the market, and the use of public and clouds
    will continue growing since companies are in an ongoing migration from on-premise
    infrastructure to a cloud one. Distributions that are generally available are
    as follows:


    +   - **Architectures**: Linux Kernel is available for most of the architectures;
    some examples: *ARM/ARM64, IA-64, MIPS, PowerPC, RISC-V*, and *x86*.


    +   - **Cloud image ready**: Most of the Linux distributions offers cloud image
    ready to be launched in public (*AWS, Azure, and Google Cloud*) and private clouds
    (*OpenStack*).


    +   - **Container images**: Linux distributions are offering official images to
    run containers, using, for example, *Docker* or *Kubernetes*.


    # Conclusion


    Linux has been the most important operating system in the IT sector for the last
    few decades, as well as the present. The future will bring new innovations in
    emerging technologies, and Linux will be an integral, if not the main, part of
    most of those implementations. Regular desktop users are getting more comfortable
    using Linux distributions as the main operating system, and developers have decided
    to move to Linux from other operating systems.


    # Key facts


    +   - Linux is the most popular operating system in the world.


    +   - Linux works in most of the architectures available.


    +   - Linux is available on all the popular clouds.


    +   - Most of the emerging technologies are using Linux.'
  merge: -1
  img_proc: true
