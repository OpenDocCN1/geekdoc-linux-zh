  md: '# *Preface*


    Ansible is a powerful open source automation language. Uniquely, it''s also a
    deployment and orchestration tool. While Ansible provides more productive drop-in
    replacements for many core capabilities in other automation solutions, it also
    seeks to solve other major unsolved IT challenges.


    Ansible is an open-source automation tool, or platform, used for IT tasks such
    as configuration management, application deployment, service orchestration, and
    infrastructure provisioning. Automation is crucial these days, with IT environments
    that are complex and often need to scale quickly for system, network and cloud
    administrators and developers to keep up if they had to do everything manually.
    Automation simplifies complex infrastructure tasks, not just making developers''
    jobs more manageable but allowing them to focus attention on other tasks that
    add value to an organization. In other words, it frees up time and increases efficiency.
    And Ansible, as noted above, is rapidly rising to the top in the world of automation
    tools.


    When I start learning Ansible and gone through couple of books I have noticed
    that I have to toggle here and there to clear Ansible concepts. Therefore, I thought
    to come up with a book which covers all aspects of infrastructure administration.
    This book begin with Ansible basics so anyone with no automation experience can
    start from there. Once basics are cleared each chapter is specifically designed
    for respective technology. Over the course of 7 chapters in this book, you will
    learn the following:'
  merge: -1
  pgno: 8
