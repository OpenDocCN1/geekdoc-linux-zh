    - Notification modules\n- Packaging modules\n- Remote management modules\n- Source\
    \ control modules\n- Storage modules\n- System modules\n- Utilities modules\n\
    - Web infrastructure modules\n- Windows modules\n\nLet's discuss some important\
    \ Ansible categorization of modules, which are as follows:\n\n## **System**\n\
    System modules are actions to be performed at a system level, such as modifying\
    \ the users and groups on the system, modifying IP tables, and firewall configurations,\
    \ working with logical volume groups, mounting operations, or working with services.\
    \ For example, starting, stopping, or restarting services in a system.\n\n## **Command**\n\
    Command modules are used to execute the commands or scripts on a host. These could\
    \ be simple commands using the command module or an interactive execution. You\
    \ could also run a script on the host using the script module.\n\n## **File**\n\
    File modules help in working with files. For example, using the ACL module to\
    \ set and retrieve the ACL information on files, use the archive and unarchive\
    \ modules to compress and unpack files, and use find to search and replace the\
    \ modules to modify the contents of an existing file.\n\n## **Database**\nDatabase\
    \ modules help in working with the databases, such as MongoDB, MSSQL, MySQL, or\
    \ PostgreSQL, to add or remove the databases or modify database configurations,\
    \ and so on.\n\n## **Cloud**\nCloud modules have a vast collection of modules\
    \ for the various cloud providers like Amazon, Azure, Docker, Google, OpenStack,\
    \ and VMware being just a few of them. There are a number of modules available\
    \ for each of these that allow you to perform various tasks such as creating and\
    \ destroying instances, performing configuration changes, networking and security\
    \ and managing containers, data centers, clusters, social networking, VSAN, and\
    \ a lot more.\n\n## **Windows**\nWindows modules will help you use Ansible in\
    \ a Windows environment. Some of them are **Win_copy** to copy files, and **Win_command**\
    \ to execute the command on the Windows machine. And there are a bunch of other\
    \ modules available to work with the files on Windows. Create an IIS website,\
    \ install a software using the MSI installer, making changes to the registry using\
    \ Regedit, and manage services and users in Windows. These are just a few modules\
    \ in a few categories. There are a lot more and a comprehensive list can be found\
    \ at **docs.ansible.com** along with detailed instructions on each of them. Let's\
    \ look at a few of these modules in detail to understand how you can use them.\n\
    \n## *Command*\nThis is default module, if you don't specifically mention any\
    \ module, this module will be used. It will work only when you have Python installed\
    \ on manage nodes. The command module takes the command name followed by a list\
    \ of space-delimited arguments. These arguments are commands which will be executed\
    \ on all the nodes. The command(s) will not be processed through the shell, so\
    \ variables like **$HOME** and operations like **&** will not work.\n\n## *Shell*\n\
    This will work only when you have Python installed on manage nodes. It is almost\
    \ exactly like the command module but runs the command through a shell on the\
    \ remote node. Therefore, variables like $HOME and operations like **&** will\
    \ work.\n\n## **RAW**\nThis module is doing the same thing as Shell and command\
    \ modules, but the key point is, it doesn't require Python on the remote machine.\
    \ This is useful and should only be done in a few cases. A common case is installing\
    \ Python on a system without Python installed by default. Another is managing\
    \ any devices such as routers and switches that do not have any Python installed.\
    \ Arguments given to RAW are run directly through the configured remote shell.\n\
    \n## PING\nThis is a trivial test module; this module always returns ping on successful\
    \ contact. It does not make sense in playbooks, but it is useful to verify the\
    \ ability to login and that a usable Python is configured. This is **NOT ICMP**\
    \ ping, this is just a trivial test Ansible module that requires Python on the\
    \ remote-node.\n\n## Copy\nThe copy module copies a file from the local or remote\
    \ machine to a location on the remote machine.\n\n## *File*\nThis sets attributes\
    \ of files, symlinks, or directories. Alternatively, it is used to remove files,\
    \ symlinks, or directories.\n\n## YUM/APT\nThis installs, upgrade, downgrades,\
    \ removes, and lists packages, and groups with the respective Linux package manager.\
    \ This is just the tip of the iceberg; we have thousands of such modules available\
    \ for specific purpose like cloud, system, storage, monitoring, database, and\
    \ network administration. We will cover them in the later chapters.\n\n## Basic\
    \ understanding of YAML\nThis is the last theoretical concept that we have in\
    \ Ansible. I am planning to cover all the theory in this chapter. In the following\
    \ chapters, it will be all hands-on. Understanding YAML is essential in writing\
    \ the Ansible playbooks. Ansible playbooks are the text/configuration files that\
    \ are written in a particular format called YAML. Therefore, we will spend some\
    \ time to understand the YAML syntax before jumping to the Ansible playbooks.\
    \ All the YAML files can optionally begin with --- and end with ---. This is part\
    \ of the YAML format and indicates the start and end of a document. The following\
    \ are the YAML components:\n\nThe following is the YAML sample list format:\n\
    ``` yaml\n---\n# A list of fruits\n- Apple\n- Orange\n- Banana\n- Mango\n...\n\
    ```\n\nThe following is the YAML sample dictionary format:\n``` yaml\n# An employee\
    \ record\nmartin:\n  name: Waqas Irtaza\n  job: Engineer\n  skill: Automation\n\
    ```\n\nA dictionary is represented in a simple **key: value** form (the colon\
    \ must be followed by a space). Proper spacing is essential, otherwise we will\
    \ get a syntax error depicted as follows:\n\n## **Correct Syntax**\n``` yaml\n\
    # An employee record\nUser:\n  name: Waqas Irtaza\n  job: Engineer\n  skill: Automation\n\
    ```\n\n## **Incorrect Syntax**\n``` yaml\n# An employee record\nUser:\nname: Waqas\
    \ Irtaza\njob: Engineer\nskill: Automation\n```\n\nA dictionary is unordered and\
    \ a list is ordered; see the following example to understand the main difference\
    \ between lists and dictionaries.\n\n## **Dictionary**\nThe following example\
    \ shows the YAML dictionary comparison:\n``` yaml\n# An employee record\nuser:\n\
    \  name: Waqas Irtaza\n  skill: Automation\n  job: Engineer\n```\n\n``` yaml\n\
    # An employee record\nuser:\nname: Waqas Irtaza\nskill: Automation\njob: Engineer\n\
    ```\n\n## **List**\nThe following example shows the YAML list comparison:\n```\
    \ yaml\n---\n# A list of fruits\n- Apple\n- Orange\n- Banana\n- Mango\n...\n```\n\
    \n``` yaml\n---\n# A list of fruits\n- Apple\n- Banana\n- Orange\n- Mango\n...\n\
    ```\n\nMore complicated data structures are possible, such as lists of dictionaries,\
    \ dictionaries whose values are lists or a mix of both. The following is an example\
    \ to understand the complicated data structures:\n``` yaml\n# Employee records\n\
    - Waqas:\n    name: Waqas Irtaza\n    job: Engineer\n    skills:\n      - python\n\
    \      - Ansible\n  - John:\n    name: John Smith\n    job: Developer\n    skills:\n\
    \      - lisp\n      - fortran\n```\n\nDictionaries and lists can also be represented\
    \ in an abbreviated form:\n``` yaml\n# Directory\nuser: {name: Waqas Irtaza, job:\
    \ Engineer, skill: Ansible}\n```\n\n``` yaml\n# List/Array\n['Apple', 'Orange',\
    \ 'banana', 'Mango']\n```\n\nFor strings in YAML, we don't have to put them in\
    \ double quotes, unless they have special characters. That's all you really need\
    \ to know about YAML to start writing the Ansible playbooks. We will be using\
    \ this YAML format in the following chapters.\n\n## Conclusion\nIn this chapter,\
    \ we covered the theory of Ansible. Ansible is the simplest way to automate the\
    \ IT infrastructure. It uses the SSH port for management, which is a default industry\
    \ standard for the IT infrastructure administration. Zero configuration on managed\
    \ nodes is a unique feature in Ansible. We discussed the Ansible components and\
    \ how they come together. We also discussed the option to install Ansible, configure\
    \ the managed nodes, and test the installation. Ansible provides a diverse range\
    \ of options to configure the managed nodes and we discussed all of them in detail.\
    \ An Ansible inventory is a file, which stores the host or managed nodes in details.\
    \ The Ansible modules are the code, written for specific tasks and infrastructure.\
    \ Ansible already has thousands of modules available and ready to be used. The\
    \ Ansible modules are written for specific networking devices, cloud platforms,\
    \ and almost all the major aspects of IT. The Ansible scripts are written in YAML,\
    \ which is a human-readable data-serialization language. It is commonly used for\
    \ the configuration files. The important components of YAML are list and dictionary.\
    \ Dictionary is unordered and list is ordered. In the next chapter, we will understand\
    \ and practice the Ansible ad-hoc mode and write useful automation scripts for\
    \ the day-to-day activities. We will cover the basics of the Ansible playbooks\
    \ and see the different programming options like the conditional statements, variables,\
    \ loops, and much more."
  mdcn: "\n- 消息模块\n- 监控模块\n- 网络工具模块\n- 网络模块\n- 通知模块\n- 打包模块\n- 远程管理模块\n- 源代码管理模块\n\
    - 存储模块\n- 系统模块\n- 实用工具模块\n- Web基础设施模块\n- Windows模块\n让我们来讨论一些Ansible模块的重要分类，如下所示：\n\
    ## **系统**\n系统模块是需要在系统层面执行的操作，例如修改系统中的用户和组、修改IP表与防火墙配置、处理逻辑卷组、挂载操作，或是处理服务。例如启动、停止或重启系统中的服务。\n\
    ## **命令**\n命令模块用于在主机上执行命令或脚本。这些可以是使用command模块执行的简单命令，或是交互式执行。你也可以使用script模块在主机上运行脚本。\n\
    ## **文件**\n文件模块可辅助处理文件。例如，使用ACL模块设置和获取文件的ACL信息，使用archive和unarchive模块压缩和解压文件，使用find模块搜索文件，使用replace模块修改现有文件的内容。\n\
    ## **数据库**\n数据库模块可辅助处理各类数据库，例如MongoDB、MSSQL、MySQL或PostgreSQL，支持添加或删除数据库、修改数据库配置等操作。\n\
    ## **云**\n云模块为各类云服务商提供了海量的模块集合，仅亚马逊、Azure、Docker、谷歌、OpenStack和VMware就是其中的一部分。针对这些云服务商都有大量可用模块，支持你执行各类任务，例如创建和销毁实例、执行配置变更、网络与安全管理、管理容器、数据中心、集群、社交网络、VSAN等，还有更多功能。\n\
    ## **Windows**\nWindows模块可帮助你在Windows环境中使用Ansible。其中一些模块包括：用于复制文件的**Win_copy**，以及在Windows机器上执行命令的**Win_command**。还有大量其他模块可用于处理Windows上的文件，例如创建IIS网站、使用MSI安装程序安装软件、通过注册表编辑器修改注册表、管理Windows中的服务和用户。这些只是几个分类下的部分模块，还有更多模块，你可以在**docs.ansible.com**上找到完整的列表以及每个模块的详细说明。接下来我们详细了解一下其中一些模块，学习如何使用它们。\n\
    ## *命令*\n这是默认模块，如果你没有特别指定任何模块，就会使用这个模块。它仅在被管理节点上安装了Python时才能工作。command模块接收命令名称，后跟一个以空格分隔的参数列表。这些参数将在所有节点上执行的命令。命令不会通过shell处理，因此像**$HOME**这样的变量和像**&**这样的操作将无法使用。\n\
    ## *Shell*\n它同样仅在被管理节点安装了Python时才能工作。它和command模块几乎完全一致，但会在远程节点上通过shell运行命令。因此，像$HOME这样的变量和像**&**这样的操作可以正常使用。\n\
    ## **RAW**\n该模块和Shell、command模块功能相同，但关键点是它不需要远程机器上安装Python。这个模块仅在少数场景下适用且非常有用。常见的场景是在默认未安装Python的系统上安装Python，另一个场景是管理未安装Python的设备，例如路由器和交换机。传递给RAW的参数会直接通过配置好的远程shell运行。\n\
    ## PING\n这是一个简单的测试模块，成功连通时会始终返回ping响应。它在playbook中没有实际用途，但可用于验证登录能力以及已配置的Python可用性。**这不是ICMP\
    \ ping**，只是一个简单的Ansible测试模块，需要在远程节点上安装Python。\n## Copy\ncopy模块用于将文件从本地或远程机器复制到远程机器上的指定位置。\n\
    ## *文件*\n该模块用于设置文件、符号链接或目录的属性，也可用于删除文件、符号链接或目录。\n## YUM/APT\n该模块可使用对应Linux的包管理器执行安装、升级、降级、移除以及列出软件包和软件包组的操作。这只是冰山一角，我们还有数千个此类模块，可用于特定场景，例如云、系统、存储、监控、数据库和网络管理。我们将在后续章节中介绍这些模块。\n\
    ## YAML基础认知\n这是Ansible中最后一个理论概念。我计划在本章讲解完所有理论，后续章节将全部是实操。理解YAML是编写Ansible playbook的必要前提。Ansible\
    \ playbook是使用YAML格式编写的文本/配置文件。因此，在接触Ansible playbook之前，我们会花一些时间了解YAML语法。所有YAML文件都可以选择以---开头、以---结尾，这是YAML格式的一部分，用于标记文档的启止。以下为YAML的组成部分。以下是YAML列表格式的示例：\n\
    ```yaml\n---\n# A list of fruits\n- Apple\n- Orange\n- Banana\n- Mango\n...\n\
    ```\n以下是YAML字典格式的示例：\n```yaml\n# An employee record\nmartin:\n  name: Waqas Irtaza\n\
    \  job: Engineer\n  skill: Automation\n```\n字典以简单的**键: 值**形式表示（冒号后必须跟一个空格）。正确的缩进至关重要，否则会出现如下所示的语法错误：\n\
    ## **正确语法**\n```yaml\n# An employee record\nUser:\n  name: Waqas Irtaza\n  job:\
    \ Engineer\n  skill: Automation\n```\n## **错误语法**\n```yaml\n# An employee record\n\
    User:\nname: Waqas Irtaza\njob: Engineer\nskill: Automation\n```\n字典是无序的，列表是有序的，请参考以下示例了解列表和字典的主要区别。\n\
    ## **字典**\n以下示例展示了YAML字典的对比：\n```yaml\n# An employee record\nuser:\n  name: Waqas\
    \ Irtaza\n  skill: Automation\n  job: Engineer\n```\n```yaml\n# An employee record\n\
    user:\n  name: Waqas Irtaza\n  job: Engineer\n  skill: Automation\n```\n## **列表**\n\
    以下示例展示了YAML列表的对比：\n```yaml\n---\n# A list of fruits\n- Apple\n- Orange\n- Banana\n\
    - Mango\n...\n```\n```yaml\n---\n# A list of fruits\n- Apple\n- Banana\n- Orange\n\
    - Mango\n...\n```\n更复杂的数据结构也是可行的，例如字典列表、值为列表的字典，或是两者的混合。以下示例帮助你了解复杂数据结构：\n```yaml\n\
    # Employee records\n- Waqas:\n    name: Waqas Irtaza\n    job: Engineer\n    skills:\n\
    \      - python\n      - Ansible\n- John:\n    name: John Smith\n    job: Developer\n\
    \    skills:\n      - lisp\n      - fortran\n```\n字典和列表也可以用缩写形式表示：\n```yaml\n\
    # Directory\nuser: {name: Waqas Irtaza, job: Engineer, skill: Ansible}\n```\n\
    ```yaml\n# List/Array\n['Apple', 'Orange', 'banana', 'Mango']\n```\n对于YAML中的字符串，除非包含特殊字符，否则无需用双引号包裹。以上就是编写Ansible\
    \ playbook所需了解的YAML全部内容。我们将在后续章节中使用此YAML格式。\n## 总结\n本章我们讲解了Ansible的理论知识。Ansible是自动化IT基础设施的最简单方式，它使用SSH端口进行管理，这是IT基础设施管理的默认行业标准。被管理节点零配置是Ansible的独有特性。我们讨论了Ansible的组件以及它们如何协同工作，还介绍了Ansible的安装选项、被管理节点的配置方法以及安装测试方法。Ansible提供了多种配置被管理节点的选项，我们已对所有选项进行了详细讲解。Ansible清单是一个文件，用于存储被管理节点的详细信息。Ansible模块是为特定任务和基础设施编写的代码，Ansible已经提供了数千个现成可用的模块。Ansible模块针对特定网络设备、云平台以及IT的几乎所有主要领域而编写。Ansible脚本使用YAML编写，YAML是一种人类可读的数据序列化语言，通常用于配置文件。YAML的重要组件是列表和字典，其中字典是无序的，列表是有序的。下一章中，我们将学习并实践Ansible即席模式，编写适用于日常活动的高效自动化脚本，我们将学习Ansible\
    \ playbook的基础知识，了解条件语句、变量、循环等不同的编程选项，以及更多内容。\n"
