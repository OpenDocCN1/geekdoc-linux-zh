    My name is Waqas Irtaza and I am located in Dubai UAE\n[ansible@cent_node_02 ~]$\n\
    ```\nThis is just a basic example to walk you through variables. We will be using\
    \ them quite frequently.\n\n### **Built-in variables**\nIf you remember, we skipped\
    \ the Gathering Facts section from the first Ansible playbook output. Let's discuss\
    \ it here. Before Ansible executes a command on hosts, it gathers a lot of useful\
    \ information about the host and saves it in built-in variables. We can use these\
    \ variables in our playbook to make it more versatile.\nTo get a full list of\
    \ all built-in variables, we can use the following ad-hoc command, which we covered\
    \ in the ad-hoc mode section:\n```shell\nansible -i inventory cen_node_01 -m setup\n\
    ```\nThe output is very large, so it is not included here. We can use filters\
    \ to get specific information. For example, if we want to check the host's operating\
    \ system, we use the following command:\n```shell\nansible -i inventory cen_node_01\
    \ -m setup -a \"filter=*family*\"\n```\nAdditionally, if we need IP address details,\
    \ we use the following filter:\n```shell\nansible -i inventory cen_node_01 -m\
    \ setup -a \"filter=*ip*\"\n```\n\nI hope the concept is clear. Similarly, we\
    \ can retrieve a lot of important host information, such as:\n- CPU type\n- Operating\
    \ system\n- RAM\n- IP address\n- CPU cores\n- Network interfaces\n\nWe can use\
    \ these variables in our playbooks to make intelligent decisions. For example,\
    \ if we are using the **yum** module in our playbook, we know that the **yum**\
    \ command does not work on Ubuntu machines. So we can write a conditional statement\
    \ that checks the built-in variable for the operating system, and then executes\
    \ the commands only on CentOS machines. We will see this example in the conditional\
    \ statements section.\nBuilt-in variables are used in playbooks in the same way\
    \ as user-defined variables. I recommend that you run the preceding setup command\
    \ and experiment with the different variables.\n\n## *Ansible output*\nAnsible\
    \ has a dedicated module for handling output, called `register`. It helps us store\
    \ the output of a task in a variable. Once the output is stored in a variable,\
    \ we can display it directly or modify it as required. The output is formatted\
    \ in JSON, which is slightly different from YAML.\n\n#### Example Playbook\nThe\
    \ following is an example playbook:\n```yaml\n---\n- hosts: centos\n  tasks:\n\
    \    - name: Execute whoami command\n      shell: whoami\n      register: whoami_output\n\
    \    - name: Display the output\n      debug:\n        var: whoami_output.stdout_lines\n\
    ```\n\n#### Output\n```shell\nTASK [Display the output] *************************************************************************\n\
    ok: [cen_node_02] => {\n    \"whoami_output.stdout_lines\": [\n        \"admin1\"\
    \n    ]\n}\nok: [cen_node_01] => {\n    \"whoami_output.stdout_lines\": [\n  \
    \      \"ansible\"\n    ]\n}\n```\nThe output variable `whoami_output` contains\
    \ the full JSON output of the task, but as you can see, we are accessing `stdout_lines`\
    \ which holds the desired standard output. We can also access `stderr_lines` if\
    \ we need to capture error messages.\nThe `debug` module prints statements during\
    \ playbook execution and is useful for debugging variables or expressions without\
    \ halting the playbook. It has three main parameters:\n- `msg`: The custom message\
    \ to print.\n- `var`: The variable name to display; when using this parameter,\
