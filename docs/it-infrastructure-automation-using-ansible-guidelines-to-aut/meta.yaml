  md: '# Ansible dynamic inventory


    We have already discussed about the Ansible inventory file, which has the host
    details available; such an inventory is called the static inventory. However,
    if Ansible has to cover all the IT domains, then the static inventory is not realistic
    in the production environments. In the real world, infrastructure keeps changing
    rapidly. We also add new nodes and remove the unwanted nodes. This is very common,
    especially for the cloud and container environments, where the nodes are added
    and removed based on usage. Therefore, Ansible came up with a concept called **dynamic**
    which fetches the list of nodes from the infrastructure environments in real time.


    In the modern IT environment, the sources of host nodes can be AWS, Azure, OpenStack,
    containers, and LDAP systems. These systems have their list of nodes and Ansible
    integrates with such external dynamic inventory.


    In Ansible, we have the two following ways to connect to the external dynamic
    inventories:


    +   - **Via** This is the older way which ensures backward compatibility.

    - **Ansible** Ansible recommends this over the scripts for dynamic inventory,
    since the plugins are updated with the Ansible core code.'
  merge: -1
