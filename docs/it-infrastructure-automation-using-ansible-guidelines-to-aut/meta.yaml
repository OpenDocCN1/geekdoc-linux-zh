  md: '# **Conclusion**


    In this chapter, we discussed the Ansible ad-hoc and Ansible playbooks. The Ad-hoc
    commands can run individually to perform quick functions. These commands are not
    required to be used frequently; for example, if we have to reboot the list of
    servers, we will be using the ad-hoc commands, since in production, we rarely
    reboot servers. The biggest benefit of the ad-hoc command is its simplicity and
    power which it provides the user. We have discussed a couple of use cases for
    the ad-hoc mode.


    The Ansible playbooks offer a repeatable, re-usable, simple configuration management,
    and multi-machine deployment system, one that is well-suited to deploying complex
    applications. Ansible plays are written in YAML. YAML stands for **Yet Another
    Markup Language** allows Ansible to use the conditional statements, loops, and
    many other programmable features which simplify the automation process.


    In the next chapter, we will focus on the advanced concepts of Ansible and the
    best practices for writing the Ansible playbooks.'
