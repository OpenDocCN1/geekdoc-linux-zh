  - "[PAGE 112]\n\n# *Conditional statements in Ansible*\n\nConditional statements\
    \ in Ansible looks quite different. However, functionality wise, it is the same\
    \ as in any other programming language. The first part of conditional statements\
    \ is just a normal task, the second part is a condition; the task will only execute\
    \ when the condition is true. Moreover, we use the special word **When** to check\
    \ the condition. The following is a sample of the conditional statement:\n\n+\
    \   **Task:**\n- Name: Any description (Optional)\nModule: module parameters\n\
    When: Condition\n\nLet's understand it with a practical example.\n\n# **Playbook**\n\
    \nThe following is the Ansible playbook:\n\n```\n---\n- hosts: all\n  become:\
    \ yes\n  tasks:\n```"
- md: "### Install apache2 on Debian hosts (ignore CentOS hosts)\n```yaml\n- name:\
    \ Install apache2 on Debian/Ubuntu machines\n  apt:\n    name: apache2\n    state:\
    \ latest\n  when: ansible_os_family == \"Debian\"\n  register: apt_output\n\n\
    - name: Display the console output\n  debug:\n    var: apt_output\n```\n\n###\
    \ Install httpd on CentOS hosts (ignore Ubuntu hosts)\n```yaml\n- name: Install\
    \ httpd on CentOS machines\n  yum:\n    name: httpd\n    state: latest\n  when:\
    \ ansible_os_family == \"RedHat\"\n  register: yum_output\n\n- name: Display the\
    \ console output\n  debug:\n    var: yum_output\n```\n\nWe can use sudo, which\
    \ will allow us to become the root user since the installation requires **sudo**\
    \ access. Moreover, we can also check multiple conditions as stated in the following\
    \ example:\n\n```yaml\n- name: \"Shut down CentOS 6 systems\"\n  command: /sbin/shutdown\
    \ -t now\n  when:\n    - ansible_facts['distribution'] == \"CentOS\"\n    - ansible_facts['distribution_major_version']\
    \ == \"6\"\n```\n\n## Loops in Ansible\n\nThe concept of loops is also the same\
    \ in Ansible as in any other programming language. Loops are used to minimize\
    \ repetitive code and repeat it based on predefined conditions or logic. Any network\
    \ or system administrative task, when executed for N number of servers, can be\
    \ simplified with Ansible loops.\n\nIn Ansible, we have two options for creating\
    \ loops: the `loop` parameter and the following `with_*` loops:\n- with_list\n\
    - with_items\n- with_indexed_items\n- with_flattened\n- with_together\n- with_dict\n\
    - with_sequence\n\n### with_subelements\n### with_nested/with_cartesian\n### with_random_choice\n\
    \nThe `loop` function was added in Ansible 2.5 and later versions. Although the\
    \ Ansible documentation recommends using `loop` and there is an official document\
    \ with examples of replacing `with_*` loops with `loop`, I found `with_*` loops\
    \ extremely simple and will be focusing on them for looping in this guide. We\
    \ will take some examples to give you an idea of how these loops work.\n\n###\
    \ Install listed software on Ubuntu machines\nThe following playbook will install\
    \ the list of software on Ubuntu machines:\n```yaml\n---\n- hosts: ubuntu\n  become:\
    \ yes\n  tasks:\n    - name: Install listed packages on ubuntu machines\n    \
    \  apt:\n        name: \"{{ item }}\"\n        state: latest\n      with_items:\n\
    \        - nano\n        - vim\n        - python\n        - wget\n```\n\n### Display\
    \ content of two files\nThe following playbook will display the content of two\
    \ files:\n```yaml\n---\n- hosts: ubuntu\n  become: yes\n  tasks:\n    - name:\
    \ Display content of files\n      debug:\n        msg: \"{{ item }}\"\n      with_file:\n\
    \        - ip.txt\n        - host.txt\n```\n\n### Print a sequence from 0 to 10\n\
    The following playbook will print the sequence from 0 to 10:\n```yaml\n---\n-\
    \ hosts: ubuntu\n  become: yes\n  tasks:\n    - name: Display sequence from 0\
    \ to 10\n      debug:\n        msg: \"{{ item }}\"\n      with_sequence: start=0\
    \ end=10\n```\n\n#### Compare loop and with_sequence\nLet's take the following\
    \ example to compare `loop` and `with_sequence`:\n\nExample using `with_sequence`:\n\
    ```yaml\n---\n- hosts: ubuntu\n  tasks:\n    - name: with sequence\n      debug:\n\
    \        msg: \"{{ item }}\"\n      with_sequence: start=0 end=4\n```\n\nExample\
    \ using `loop`:\n```yaml\n---\n- hosts: ubuntu\n  tasks:\n    - name: with_sequence\
    \ -> loop\n      debug:\n        msg: \"{{ item }}\"\n      loop: \"{{ range(0,\
    \ 5) | list }}\"\n```\n\nBoth the preceding loops do the same thing. An important\
    \ point to note is that when using the `range` function in loops, the upper limit\
    \ should be one greater than the desired final value, and the `list` filter is\
    \ used to convert the integer range to a list, which is required for the `loop`\
    \ parameter.\n\n## Ansible Handlers\n\nHandlers are just like the normal tasks\
    \ in an Ansible playbook, but they will run only when called by another task that\
    \ contains a **notify** directive. A Handler is useful for the secondary actions\
    \ that might be required after running a task, such as starting a service after\
    \ the installation or configuration change.\n\nThe following example will show\
    \ how the Ansible handlers are used:\n```yaml\n---\n- hosts: ubu_node_01\n  become:\
    \ true\n  tasks:\n    - name: Install Package\n      apt:\n        name: apache2\n\
    \        state: present\n      notify:\n        - Start apache2\n  handlers:\n\
    \    - name: Start apache2\n      service:\n        name: apache2\n        state:\
    \ started\n```\n\n### Tasks\nSuppose we have four tasks, out of them, two are\
    \ calling a handler as depicted in the sample:\n- Task1 (Handler_name)\n- Task2\n\
    - Task3 (Handler_name)\n- Task4 (Handler)\n- Handler_name\n\nHowever, the handler\
    \ will only run once. This is the key feature which makes it different from a\
    \ standard task. Moreover, a handler will only be executed if the task made a\
    \ change on the node. Otherwise, the handler will not run. In the preceding example,\
    \ the handler will only run if **Task1** or **Task3** has made a change on the\
    \ nodes. It is a very useful feature; suppose we are installing **apache2** on\
    \ a host and then restarting the service – if a host already has **apache2** installed,\
    \ restarting the service might affect the current service.\n\n## Ansible Error\
    \ Handling\n\nAnsible normally has default settings which make sure to check the\
    \ return codes of the commands and modules; if an Ansible playbook fails, Ansible\
    \ exits the playbook with an error. Ansible provides several ways to change this\
    \ default behaviour; let's discuss them in the following section.\n\n### Ignoring\
    \ Failed Commands\nGenerally, the Ansible behaviour is to stop executing any more\
    \ steps or commands on a host that has a task failed, which makes sense. For example,\
    \ we have written a playbook which installs Apache and then starts the service.\
    \ If the installation fails, it does not make any sense to run a command, which\
    \ will try to start the service. In this case, both the commands are dependent.\
    \ However, if the commands are independent and we want to keep going, then we\
    \ have to add the following highlighted command in our playbook, which will change\
    \ the Ansible default behaviour and execute all the tasks for the particular host,\
    \ even if some tasks get failed:\n\n```yaml\n- name: If fails, this command will\
    \ not be counted as a failure\n  command: /bin/false\n  ignore_errors: yes\n```\n\
    \n### Resetting Unreachable Hosts\nThe default Ansible behavior is to set the\
    \ host unreachable; if the host did not respond on time, and the Ansible timeout\
    \ is breached – which can happen because of several issues, for example network\
    \ or server utilization was high and host could not respond on time – then Ansible\
    \ will remove the host from the active host. The Ansible tasks will be executed\
    \ on the active host only; in case we suspect there will be a false positive for\
    \ the unreachable hosts, and we want to change the Ansible behavior to auto recover\
    \ the unreachable host, then we have to use **clear_host_errors** in playbook.\n\
    \n### Controlling What Defines Failure\nIn Ansible, we have the options to set\
    \ a criterion which defines what *failure* means in each playbook task using the\
    \ keyword **failed_when**. A list of multiple **failed_when** conditions are joined\
    \ like a conditional statement, meaning the task only fails when all the conditions\
    \ are met.\n\n## Ansible Vault\n\nThe Ansible Vault encrypts the variables and\
    \ files, so we can protect the sensitive content, such as passwords or keys, rather\
    \ than leaving it visible as plaintext in playbooks. To use the Ansible Vault,\
    \ we need one or more passwords to encrypt and decrypt the content. Since it is\
    \ common to store the Ansible configurations in the version control, we need a\
    \ way to store the secrets securely. The Ansible Vault is the answer to this.\
    \ Ansible Vault can encrypt anything inside a YAML file, using a password of your\
    \ choice. A typical use of the Ansible Vault is to encrypt the variable files\
    \ or playbooks. Vault can encrypt any YAML file. Let's see how to use the Ansible\
    \ Vault.\n\nTo create an encrypted file, the following command will be used:\n\
    ```bash\n$ ansible-vault create learn_ansible.yaml\nNew Vault password:\nConfirm\
    \ New Vault password:\n$\n```\n\nOnce we enter the password, it will"
  mdcn: "\n### 在 Debian 主机上安装 apache2（忽略 CentOS 主机）\n```yaml\n- name: Install apache2\
    \ on Debian/Ubuntu machines\n  apt:\n    name: apache2\n    state: latest\n  when:\
    \ ansible_os_family == \"Debian\"\n  register: apt_output\n- name: Display the\
    \ console output\n  debug:\n    var: apt_output\n```\n\n### 在 CentOS 主机上安装 httpd（忽略\
    \ Ubuntu 主机）\n```yaml\n- name: Install httpd on CentOS machines\n  yum:\n    name:\
    \ httpd\n    state: latest\n  when: ansible_os_family == \"RedHat\"\n  register:\
    \ yum_output\n- name: Display the console output\n  debug:\n    var: yum_output\n\
    ```\n\n我们可以使用 sudo，因为安装过程需要**sudo**权限，使用 sudo 可以让我们获得 root 用户身份。此外，我们还可以像下面示例中那样检查多个条件：\n\
    ```yaml\n- name: \"Shut down CentOS 6 systems\"\n  command: /sbin/shutdown -t\
    \ now\n  when:\n    - ansible_facts['distribution'] == \"CentOS\"\n    - ansible_facts['distribution_major_version']\
    \ == \"6\"\n```\n\n## Ansible 中的循环\n循环的概念在 Ansible 中和在其他编程语言中是一致的。循环用于最小化重复代码，基于预定义的条件或逻辑重复执行代码。任何网络或系统管理任务，当需要在\
    \ N 台服务器上执行时，都可以通过 Ansible 循环简化。在 Ansible 中，我们有两种创建循环的方式：`loop` 参数和下面的 `with_*`\
    \ 循环：\n- with_list\n- with_items\n- with_indexed_items\n- with_flattened\n- with_together\n\
    - with_dict\n- with_sequence\n\n### with_subelements\n### with_nested/with_cartesian\n\
    ### with_random_choice\n\n`loop` 函数是在 Ansible 2.5 及更高版本中添加的。虽然 Ansible 官方文档推荐使用\
    \ `loop`，并且有官方文档给出了将 `with_*` 循环替换为 `loop` 的示例，但我发现 `with_*` 循环非常简单，因此本指南将重点介绍这类循环的用法。我们会举一些示例，帮助你了解这些循环的工作原理。\n\
    \n### 在 Ubuntu 主机上安装指定软件\n下面的 playbook 将会在 Ubuntu 主机上安装指定的软件列表：\n```yaml\n---\n\
    - hosts: ubuntu\n  become: yes\n  tasks:\n    - name: Install listed packages\
    \ on ubuntu machines\n      apt:\n        name: \"{{ item }}\"\n        state:\
    \ latest\n      with_items:\n        - nano\n        - vim\n        - python\n\
    \        - wget\n```\n\n### 显示两个文件的内容\n下面的 playbook 将会显示两个文件的内容：\n```yaml\n---\n\
    - hosts: ubuntu\n  become: yes\n  tasks:\n    - name: Display content of files\n\
    \      debug:\n        msg: \"{{ item }}\"\n      with_file:\n        - ip.txt\n\
    \        - host.txt\n```\n\n### 打印 0 到 10 的序列\n下面的 playbook 将会打印 0 到 10 的序列：\n\
    ```yaml\n---\n- hosts: ubuntu\n  become: yes\n  tasks:\n    - name: Display sequence\
    \ from 0 to 10\n      debug:\n        msg: \"{{ item }}\"\n      with_sequence:\
    \ start=0 end=10\n```\n\n#### 对比 `loop` 和 `with_sequence`\n我们通过下面的示例来对比 `loop`\
    \ 和 `with_sequence` 的用法：\n\n使用 `with_sequence` 的示例：\n```yaml\n---\n- hosts: ubuntu\n\
    \  tasks:\n    - name: with sequence\n      debug:\n        msg: \"{{ item }}\"\
    \n      with_sequence: start=0 end=4\n```\n\n使用 `loop` 的示例：\n```yaml\n---\n- hosts:\
    \ ubuntu\n  tasks:\n    - name: with_sequence -> loop\n      debug:\n        msg:\
    \ \"{{ item }}\"\n      loop: \"{{ range(0, 5) | list }}\"\n```\n\n上述两种循环实现的功能完全相同。需要注意的一点是，在循环中使用\
    \ `range` 函数时，上限值要比预期的最终值大 1，同时需要使用 `list` 过滤器将整数范围转换为列表，这是 `loop` 参数所要求的。\n\n\
    ## Ansible 处理器（Handlers）\n处理器的作用类似于 Ansible playbook 中的普通任务，但它们只会在被包含 **notify**\
    \ 指令的其他任务调用时才会运行。处理器适用于执行任务后可能需要执行的次要操作，比如安装或配置变更后启动服务。下面的示例展示了 Ansible 处理器的用法：\n\
    ```yaml\n---\n- hosts: ubu_node_01\n  become: true\n  tasks:\n    - name: Install\
    \ Package\n      apt:\n        name: apache2\n        state: present\n      notify:\n\
    \        - Start apache2\n  handlers:\n    - name: Start apache2\n      service:\n\
    \        name: apache2\n        state: started\n```\n\n### 任务\n假设我们有 4 个任务，其中\
    \ 2 个任务会调用处理器，如示例所示：\n- Task1 (Handler_name)\n- Task2\n- Task3 (Handler_name)\n\
    - Task4 (Handler)\n- Handler_name\n\n不过处理器只会运行一次，这是它与普通任务的核心区别。此外，只有当任务在节点上产生了变更时，处理器才会执行，否则不会运行。在上面的示例中，只有当\
    \ **Task1** 或 **Task3** 在节点上产生了变更时，处理器才会运行。这是一个非常实用的功能：假设我们要在一台主机上安装**apache2**然后重启服务，如果主机上已经安装了**apache2**，重启服务可能会影响正在运行的服务。\n\
    \n## Ansible 错误处理\nAnsible 通常有默认的配置，会检查命令和模块的返回码；如果 Ansible playbook 执行失败，Ansible\
    \ 会报错并终止 playbook 运行。Ansible 提供了多种方式可以修改这一默认行为，我们将在下一节中讨论这些方法。\n\n### 忽略执行失败的命令\n\
    通常情况下，Ansible 的默认行为是在某台主机的任务执行失败后，停止在该主机上执行后续的步骤或命令，这是合理的。例如，我们编写了一个 playbook，先安装\
    \ Apache 再启动服务，如果安装步骤失败了，再执行启动服务的命令就没有意义了，这种情况下两个命令是存在依赖关系的。但如果命令之间相互独立，我们希望继续执行后续任务，就需要在\
    \ playbook 中添加下面高亮的命令，该命令会修改 Ansible 的默认行为，即使部分任务执行失败，也会继续执行该主机的所有任务：\n```yaml\n\
    - name: If fails, this command will not be counted as a failure\n  command: /bin/false\n\
    \  ignore_errors: yes\n```\n\n### 重置不可达主机\nAnsible 的默认行为是将无响应的主机标记为不可达；如果主机未在规定时间内响应，超出了\
    \ Ansible 的超时时间（可能是由多种问题导致的，例如网络拥塞、服务器负载过高导致主机无法及时响应），Ansible 就会将该主机从活跃主机列表中移除，Ansible\
    \ 任务只会对活跃主机执行。如果我们怀疑不可达主机存在误判，希望修改 Ansible 的行为以自动恢复不可达主机，就需要在 playbook 中使用 **clear_host_errors**\
    \ 参数。\n\n### 自定义失败判定规则\n在 Ansible 中，我们可以通过 **failed_when** 关键字为每个 playbook 任务设置判定标准，定义该任务下的\
    \ *failure*（失败）具体指什么。多个 **failed_when** 条件会以类似条件语句的逻辑组合，即只有所有条件都满足时，任务才会被判定为失败。\n\
    \n## Ansible Vault\nAnsible Vault 会对变量和文件进行加密，我们可以用它保护密码、密钥等敏感内容，避免这些内容以明文形式直接写在\
    \ playbook 中。使用 Ansible Vault 需要设置一个或多个密码，用于对内容进行加密和解密。由于通常我们会把 Ansible 配置存入版本控制系统，因此需要一种安全存储密钥的方式，Ansible\
    \ Vault 正是解决这个问题的工具。Ansible Vault 可以使用自定义密码加密 YAML 文件内的任意内容，常见的用途是加密变量文件或 playbook，它可以加密任意\
    \ YAML 文件。接下来我们看看如何使用 Ansible Vault。创建加密文件需要使用以下命令：\n```bash\n$ ansible-vault\
    \ create learn_ansible.yaml\nNew Vault password: \nConfirm New Vault password:\
    \ \n$\n```\n输入密码后，它就会\n"
