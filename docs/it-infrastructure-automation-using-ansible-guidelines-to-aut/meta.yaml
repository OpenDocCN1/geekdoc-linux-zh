    \ name: Waqas Irtaza\njob: Engineer\nskill: Automation\n```\n\nA dictionary is\
    \ unordered and a list is ordered; see the following example to understand the\
    \ main difference between lists and directories.\n\n# **Dictionary**\n\nThe following\
    \ example shows the YAML dictionary comparison:\n\n```\n# An employee record\n\
    user:\n```\n\n```\n# An employee record\nuser:\n```"
