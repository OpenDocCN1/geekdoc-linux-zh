    In this example, Ansible block option will upgrade the database. If upgrade script
    executed properly, the **rescue** block will be ignored and the **always** block
    will be executed.


    In case upgrade script failed, the **rescue** block will be executed, which will
    revert all the database changes; once it''s done, the **always** block will restart
    the database. So, either **block** or rescue will be executed at any time, but
    the **always** block will execute in any case.'
