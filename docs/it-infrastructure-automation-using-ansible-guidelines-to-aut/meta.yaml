- img_proc: true
  md: '# Ansible_filters


    When writing playbooks in Ansible, we need data manipulation, processing, and
    formatting, since the output of one task may be used as the input for another
    task. For example, if we are writing a playbook for the network and the first
    task is to check the default route, then use the Ansible filters to get the service
    provider''s IP address; once we have the IP address, we will use the **ping**
    module to check the reachability.


    We have a set of filters, the Jinja2 template filters, and the custom filters.
    Filters in Anible are from Jinja2, so the input data is transformed inside a template
    expression. Also, templating happens on the Ansible control node, not the managed
    nodes. So, the filters get executed on the Ansible control node. This is helpful,
    as in this way, the amount of data which needs to be transferred to the remote
    hosts is lesser.


    Ansible has a rich set of filters powered by Jinja2 templating. We input some
    data into these templates and the Jinja2 template engine process that data and
    provide the formatted output. Filtering is very useful in debugging. The following
    are a list of built-in filters shipped by Jinja2:


