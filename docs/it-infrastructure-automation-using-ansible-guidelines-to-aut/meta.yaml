    \ PHP for RedHat/CentOS/Fedora/Debian/Ubuntu. |\n| geerlingguy.pimpylog | Pimp\
    \ my Log installation for Linux |\n| geerlingguy.varnish | Varnish for Linux.\
    \ |\n| leifmadsen.kibana-4 | Kibana 4 for Linux |\n| monsieurbiz.geerlingguy_php\
    \ | PHP for RedHat/CentOS/Fedora/Debian/Ubuntu. |\n| Oefenweb.nginx | Set up (the\
