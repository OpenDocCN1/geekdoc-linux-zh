- md: "## **Figure 1.1:** *Ansible key components*\n\nTo understand better, the following\
    \ is the definition of each Ansible component:\n\n### Ansible Control\nAnsible\
    \ Control Node is any machine which has Ansible installed. It must be a Linux\
    \ machine; it can't be any Windows machine. This is the one machine where the\
    \ installation is required.\n\n### Ansible Managed\nAnsible Managed Nodes are\
    \ servers or any IT devices, which we want to manage through Ansible. Ansible\
    \ Managed Nodes are also called managed hosts. Ansible installation is not required\
    \ on hosts.\n\n### Inventory\nInventory is a list of hosts. We can organize the\
    \ hosts by nesting, and creating groups for scaling. Static and dynamic inventories\
    \ are available, which we will discuss later.\n\n### Playbook\nA Playbook is an\
    \ ordered list of saved tasks, which can run repeatedly. Playbooks give a programmable\
    \ flavor to Ansible by allowing variable, loops, and conditional statements. Playbooks\
    \ are written in YAML format.\n\n## Lab setup\n\nAnsible installation is extremely\
    \ simple; just a couple of commands and you have a fully functional Ansible control\
    \ node. However, our goal is not just to install Ansible, but to understand the\
    \ infrastructure requirement and have a fully functional lab to follow along the\
    \ practical examples. Let’s prepare the lab by following these processes.\n\n\
    ## *Infrastructure preparation for Ansible*\n\nWe will be setting up an entire\
    \ lab environment on our laptop from scratch. For this, we will use a virtualization\
    \ tool called **Oracle VirtualBox** since it is open source and works with all\
    \ the flavors of operating systems like Windows, Linux, and OSX. We will first\
    \ install the Oracle VirtualBox on our laptop and then install the CentOS or Ubuntu\
    \ operating systems; I have created one Ansible control node on Ubuntu and four\
    \ managed nodes, two on CentOS and two on Ubuntu. The following screenshot shows\
    \ the VMs on VirtualBox:\n\n![](img/30dec63bea641411c2be69f8d282b813_34_0.png)\n\
