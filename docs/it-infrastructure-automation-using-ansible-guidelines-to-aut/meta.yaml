  md: '# *Ansible ad-hoc mode*


    The Ansible ad-hoc mode is a command-line tool to automate single tasks. The Ansible
    ad-hoc mode is quick and easy, but it is not reusable, since each time you have
    to provide the desired parameter. We can automate thousands of servers with just
    a single ad-hoc command, which demonstrates the power of Ansible. The practical
    use of Ansible ad-hoc mode includes managing users, file copying, rebooting servers,
    installing or removing packages, and many more. All the Ansible modules can be
    used in the ad-hoc mode, however the default module is command.


    The following is a sample ad-hoc command:


    ```

    $ ansible [pattern] -i inventory-file -m [module] -a "[module options]"

    ```


    Let us discuss all the inputs for a better understanding.'
