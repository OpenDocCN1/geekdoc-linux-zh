- md: "Next, we will create the directory structure for your own role, but by default\
    \ it will use the Ansible Galaxy API. We should specify the username and role\
    \ name as the argument. However, if you want to work offline, use the following\
    \ parameter:\n```shell\n$ ansible-galaxy init myuser:My_role_name\n```\n```shell\n\
    $ ansible-galaxy init --offline myuser:My_role_name\n```\nNow, once role is either\
    \ downloaded or created; we need to know how to use the role in a playbook. We\
    \ will create the following playbook and add the role in it:\n```yaml\n---\n-\
    \ name: How to use role\n  hosts: cen_node_01\n  roles:\n    - geerlingguy.nginx\n\
    ```\n\n## Ansible optimization\nIn this module, we will cover the topics of optimizing\
    \ the Ansible, which will enhance the processing speed and result in a better\
    \ overall performance of Ansible. The following are some key Ansible optimizing\
    \ parameters.\n\n## Host patterns\nHost patterns are about what you are addressing\
    \ in a playbook or the Ansible ad-hoc while running it. The simplest host pattern\
    \ is just a name of the host, an IP address may also be used as long as they are\
    \ available in the inventory. We can also use groups in our lab environment –\
    \ CentOS and Ubuntu are the two groups. We also have the default groups available;\
    \ we don’t have to mention them in the inventory, Ansible automatically knows\
    \ all the hosts in the inventory file. We also have `all` which refers to all\
    \ the hosts that are not part of any group in the inventory. We can use `*` but\
    \ don’t forget to use single quotes. A single quote is recommended in all cases\
    \ to ensure that the shell doesn’t interpret special characters. Refer to the\
    \ following example:\n```shell\nAnsible '*.example.com' -i inventory --list-hosts\n\
    ```\nThe preceding example means all the hosts in the inventory which have the\
    \ domain name. Moreover, a comma-separated list of hosts is also allowed. The\
    \ following example clarifies one more important concept, which is that we can\
    \ list different items like host, group, and IP address in our logic:\n```shell\n\
    Ansible 'cen_node_01.example.com,10.0.0.21' -i inventory --list-hosts\n```\n\n\
    Ampersand (`&`) can be used as a logical operator, which means the host matches\
    \ both the items. This makes sense when we talk about groups. For example, we\
    \ have two groups, one is the database group and the other is the web group. We\
    \ need the hosts that are common in both the groups, then `&` will be used. Exclamation\
    \ point (`!`) can be used as the not logic, which means we can specifically exclude\
    \ a host by putting this operator:\n```shell\nAnsible 'centos,!cen_node_01' -i\
    \ inventory --list-hosts\n```\nSo, in this example from the CentOS group, all\
    \ the members will be included except `cen_node_01`.\n\n## Configuring delegation\n\
    Sometimes, Ansible's scope goes beyond the managed hosts, so we have to configure\
    \ the hosts that are not available in the inventory. Think of the monitoring environment,\
    \ where the remote hosts need to be added in the environment or a DNS server that\
    \ needs to be modified after adding a server to the configuration. We can run\
    \ the tasks directly on the hosts involved, but that will be slow. Fact-gathering\
    \ needs to happen for all the hosts involved. Delegation can happen to the different\
    \ types of hosts like the local machines, hosts outside the play, or hosts within\
    \ or out of the inventory. Let's take the following example to see how we can\
    \ use delegations:\n```yaml\n---\n- name: Understand Delegation\n  hosts: cen_node_01\n\
    \  tasks:\n    - name: Get PS information from remote host\n      command: ps\n\
    \      register: remote_ps\n      changed_when: false\n    - name: Get PS information\
    \ from local host\n      command: ps\n      delegate_to: localhost\n      register:\
    \ local_ps\n      changed_when: false\n    - name: Print the output for remote\
    \ PS\n      debug:\n        msg: \"{{ remote_ps.stdout }}\"\n    - name: Print\
    \ the output for local PS\n      debug:\n        msg: \"{{ local_ps.stdout }}\"\
    \n```\nSince localhost is not part of our inventory file, we will use the Ansible\
    \ delegation to run a command on it. The delegate module will run on a host specified\
    \ by `delegate_to` in case you want to run the delegate command on the Ansible\
    \ master. We did it in the preceding example; we can also use `local_action` which\
    \ is a shortcut for `delegate_to: localhost`. However, this shortcut is only applicable\
    \ for the Ansible control node. Addressing hosts that are in the inventory is\
    \ straightforward, just use the IP address or the host name. To address hosts\
    \ outside the inventory, use the `add_host` module. An important point to note\
    \ is, don't forget to configure the `delegate_to` hosts with a user account, `sudo`\
    \ credentials, and SSH keys, because Ansible can only help when it is authenticated\
    \ on the server.\n\n## Delegation host outside of inventory\nIn this case, we\
    \ will see how to address a host which is not available in the inventory. However,\
    \ as we discussed in the previous section, we will be requiring credentials. When\
    \ accessing a host outside of the inventory, a temporary entry in the inventory\
    \ must be created. Ansible will use the same connection type and the details used\
    \ for the managed host to connect to the delegating hosts. To understand better,\
    \ I have removed the **ubu_node_01** from the inventory and applied the following\
    \ playbook:\n```yaml\n---\n- name: Testing Add host\n  hosts: localhost\n  tasks:\n\
    \    # Task-1\n    - name: Add another host\n      add_host:\n        name: add_ubuntu\n\
    \        ansible_host: ubu_node_01\n        ansible_user: ansible\n    # Task-2\n\
    \    - name: Check where the command is running\n      command: hostname\n   \
    \   delegate_to: add_ubuntu\n      register: output1\n    # Task-3\n    - name:\
    \ Check how facts are handled\n      command: echo \"This is {{ inventory_hostname\
    \ }}\"\n      delegate_to: add_ubuntu\n      register: output2\n    - name: Print\
    \ output from remote host\n      debug:\n        msg: \"{{ output1.stdout }}\"\
    \n    - name: Print output from delegated host\n      debug:\n        msg: \"\
    {{ output2.stdout }}\"\n```\nThe following are the explanations for each task:\
    \ In Task-1, we will add a host which is not available in the inventory. We will\
    \ execute the commands of the newly added host and register them in a variable.\
    \ This is the trickiest part; we suspect that the Ansible built-in variables will\
    \ provide the details of the newly added host, but actually it is not true. Facts\
    \ gathering only works for the localhost host, not for the added host. So, we\
    \ will get the details of localhost when we print the output of the variable,\
    \ not the delegated host. The default behaviour regarding facts is that facts\
    \ are gathered on the host where the playbook is running and not on the delegated\
    \ hosts, which is super confusing. However, we can use `delegate_facts: true`\
    \ to gather facts from the `delegate_to` host.\n\n## Parallelism in Ansible\n\
    Running the tasks in parallel will make Ansible faster. Ansible can run tasks\
    \ in parallel on all the hosts. By default, tasks run on five hosts at once. This\
    \ is because of the default configuration option, which is `forks=5` in `/etc/ansible/ansible.cfg`\
    \ or wherever you put the Ansible configuration file. However, if we change the\
    \ value of forks to any other number, that many Ansible hosts will run in parallel.\
    \ If we want to override the Ansible configuration file, then we can use the `--forks`\
    \ option with the playbook or ad-hoc mode. We also have the `serial` keyword in\
    \ a playbook to reduce the number of parallel tasks to a value that is lower than\
    \ what is specified in the `forks` option.\n\n## Asynchronous tasks\nNormally,\
    \ Ansible waits for the completion of the tasks before starting the next task.\
    \ However, we can use the `async` keyword in a task to run it in the background.\
    \ For example, `async: 3600` tells Ansible to give the task an hour to complete.\
    \ This is the maximum amount of time permitted for a task. We also have the `poll:\
    \ 10` option which indicates that Ansible will poll every 10 seconds to see if\
    \ the command has been completed. Using `async` allows the next task to be started\
    \ as it will make the overall playbook more efficient. It is recommended for the\
    \ backup job, updating packages, or downloading large files.\n\n## Ansible wait_for\n\
    It can be used in a task to check if a certain condition was met. It may be useful\
    \ to verify if the server restart was successful. Use `poll: 0` in a task to tell\
    \ Ansible not to wait for completion of this task, but to move on to the next\
    \ task. Add `ignore_errors` as well, to prevent an error condition arising, and\
    \ have this task fail."
  mdcn: "\n接下来，我们将创建你自定义角色的目录结构，但默认会调用Ansible Galaxy API。我们需要将用户名和角色名称作为参数传入。不过如果你想离线操作，请使用以下参数：\n\
    ```shell\n$ ansible-galaxy init myuser:My_role_name\n```\n```shell\n$ ansible-galaxy\
    \ init --offline myuser:My_role_name\n```\n现在，无论是下载还是创建完成角色后，我们都需要了解如何在playbook中使用该角色。我们将创建以下playbook并在其中添加角色：\n\
    ```yaml\n---\n- name: How to use role\n  hosts: cen_node_01\n  roles:\n    - geerlingguy.nginx\n\
    ```\n\n## Ansible 性能优化\n在本模块中，我们将讲解Ansible优化的相关内容，这些优化能够提升Ansible的处理速度，改善其整体运行性能。以下是Ansible优化的几个关键参数。\n\
    \n## 主机模式\n主机模式是指你在运行playbook或Ansible临时命令时指定的目标主机。最简形式的主机模式就是主机名，只要主机已加入清单，也可以直接使用IP地址。在我们的实验环境中还可以使用主机组，目前有两个分组：CentOS组和Ubuntu组。Ansible还有内置的默认主机组，无需在清单文件中额外声明，Ansible会自动识别清单文件中的所有主机。此外，`all`\
    \ 指代清单中不属于任何主机组的所有主机。可以使用 `*` 通配符，但不要忘记用单引号包裹。建议所有场景都使用单引号，避免shell误解析特殊字符。示例如下：\n\
    ```shell\nAnsible '*.example.com' -i inventory --list-hosts\n```\n上述示例会匹配清单中所有带该域名的主机。此外，还支持使用逗号分隔的主机列表。下面的示例会进一步说明一个重要概念：我们可以在匹配逻辑中同时列出不同类型的目标，比如主机、主机组和IP地址：\n\
    ```shell\nAnsible 'cen_node_01.example.com,10.0.0.21' -i inventory --list-hosts\n\
    ```\n与号（`&`）可作为逻辑运算符使用，表示同时匹配所有指定的项。在涉及主机组时这个运算符非常实用。举例来说，如果我们有两个主机组，分别是数据库组和Web组，需要筛选出两个组的公共主机，就可以使用\
    \ `&` 运算符。感叹号（`!`）可作为「非」逻辑运算符，表示排除指定的主机，例如：\n```shell\nAnsible 'centos,!cen_node_01'\
    \ -i inventory --list-hosts\n```\n在这个示例中，会匹配CentOS组中的所有主机，但排除`cen_node_01`。\n\n\
    ## 配置委托\n有时候Ansible的操作范围会超出被管理主机的范畴，此时就需要配置清单中不存在的主机。比如在监控场景中，需要给新增服务器添加远程监控节点，或者在配置DNS服务器时需要修改记录，这些主机不一定都在Ansible清单中。我们可以直接在目标主机上执行任务，但这种方式效率很低，且需要对所有涉及的主机执行信息采集。委托功能可作用于不同类型的主机，包括本地主机、play外的主机，以及清单内或清单外的主机。我们通过下面的示例来看如何使用委托功能：\n\
    ```yaml\n---\n- name: Understand Delegation\n  hosts: cen_node_01\n  tasks:\n\
    \    - name: Get PS information from remote host\n      command: ps\n      register:\
    \ remote_ps\n      changed_when: false\n    - name: Get PS information from local\
    \ host\n      command: ps\n      delegate_to: localhost\n      register: local_ps\n\
    \      changed_when: false\n    - name: Print the output for remote PS\n     \
    \ debug:\n        msg: \"{{ remote_ps.stdout }}\"\n    - name: Print the output\
    \ for local PS\n      debug:\n        msg: \"{{ local_ps.stdout }}\"\n```\n由于localhost不在我们的清单文件中，因此我们会使用Ansible的委托功能在其上执行命令。如果你希望在Ansible主节点执行委托命令，委托模块会运行在`delegate_to`指定的主机上。前面的示例已经演示了这个用法；也可以使用`local_action`，它是`delegate_to:\
    \ localhost`的简写形式，但这个简写仅适用于Ansible控制节点。指定清单内存在的主机很简单，直接使用IP地址或主机名即可。如果要指定清单外的主机，需要使用`add_host`模块。需要注意的一点是：不要忘记给`delegate_to`指定的主机配置好用户账号、sudo权限和SSH密钥，因为Ansible只能在目标服务器完成身份验证后才能正常工作。\n\
    \n## 清单外主机的委托\n在本场景中，我们将讲解如何处理清单中不存在的主机。不过正如上一节提到的，完成这类操作需要配置认证凭证。访问清单外的主机时，需要在清单中创建临时条目。Ansible会使用和被管理主机相同的连接类型、连接信息来连接委托主机。为了便于理解，我已将清单中的**ubu_node_01**移除，并执行了以下playbook：\n\
    ```yaml\n---\n- name: Testing Add host\n  hosts: localhost\n  tasks:\n    # Task-1\n\
    \    - name: Add another host\n      add_host:\n        name: add_ubuntu\n   \
    \     ansible_host: ubu_node_01\n        ansible_user: ansible\n    # Task-2\n\
    \    - name: Check where the command is running\n      command: hostname\n   \
    \   delegate_to: add_ubuntu\n      register: output1\n    # Task-3\n    - name:\
    \ Check how facts are handled\n      command: echo \"This is {{ inventory_hostname\
    \ }}\"\n      delegate_to: add_ubuntu\n      register: output2\n    - name: Print\
    \ output from remote host\n      debug:\n        msg: \"{{ output1.stdout }}\"\
    \n    - name: Print output from delegated host\n      debug:\n        msg: \"\
    {{ output2.stdout }}\"\n```\n以下是各任务的说明：\n在Task-1中，我们会添加一个清单中不存在的主机，并在该主机上执行任务后将结果注册到变量中。这一步是最容易出问题的部分：我们可能会认为Ansible内置变量会提供新添加主机相关的信息，但实际情况并非如此。信息采集功能仅对localhost生效，不会对动态添加的主机执行采集。因此我们打印变量输出时，得到的会是localhost的信息，而非委托主机的信息。Ansible关于信息采集的默认行为是仅在运行playbook的主机上采集信息，不会对委托主机采集，这一点非常容易让人困惑。不过我们可以通过`delegate_facts:\
    \ true`参数，为`delegate_to`指定的主机采集信息。\n\n## Ansible并行执行\n并行执行任务可以提升Ansible的运行速度。Ansible支持在所有主机上并行执行任务，默认会同时给5台主机执行任务。这是因为Ansible的默认配置中`forks`参数值为5，配置路径通常为`/etc/ansible/ansible.cfg`，或者是你存放Ansible配置文件的其他路径。如果我们修改`forks`参数的值为其他数值，Ansible就会同时对应数量的主机并行执行任务。如果我们希望覆盖Ansible配置文件中的设置，可以在执行playbook或临时命令时使用`--forks`参数。此外playbook中还有`serial`关键字，可以将并行任务的数量限制为低于`forks`参数指定的值。\n\
    \n## 异步任务\n默认情况下，Ansible会等待当前任务执行完成后才会启动下一个任务。但我们可以通过在任务中添加`async`关键字，让任务在后台运行。例如`async:\
    \ 3600`表示给该任务最多1小时的执行时间，这是单个任务允许的最长执行时长。此外还有`poll: 10`参数，表示Ansible会每隔10秒轮询一次，检查任务是否执行完成。使用`async`可以让Ansible不用等待任务完成就执行下一个任务，从而提升整体playbook的执行效率。该功能适合用于备份任务、包更新、大文件下载等场景。\n\
    \n## Ansible wait_for 模块\n该模块可用于在任务中检查指定条件是否满足，常用来验证服务器重启是否成功。在任务中设置`poll: 0`可以通知Ansible无需等待该任务执行完成，直接执行下一个任务。同时添加`ignore_errors`参数，可以避免任务失败时报错中断流程。\n"
