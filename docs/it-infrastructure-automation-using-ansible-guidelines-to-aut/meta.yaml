  md: '# *Managed node setup*


    Ansible has a range of options when it comes to manage nodes; we can leverage
    Ansible even without configuring the manage nodes. All we need is an SSH connection
    to the remote machine and a privileged user. This is a distinctive option in Ansible
    in comparison to the other automation tools, which require client software installation
    on all manage nodes.


    For example, you have an infrastructure consisting of thousands of managed servers;
    installing the client software itself becomes a huge task. Moreover, if you are
    managing the networking devices, it will not let you install any client software.


    The Ansible manage node setup has several options which makes Ansible a unique
    automation tool, which can automate almost any IT equipment with SSH access.


    The following sections talk about the available options for managing node setup.


    # **PASSWORD LESS LOGIN**


    This is a very useful option available in the Linux operating systems. It allows
    the administrators to login on the remote servers without typing the passwords.
    Suppose if we are administrating thousands of servers, each time when you login,'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'you have to type the password, which is time consuming and hectic as well.
    In order to setup a password less login, we have to complete the following steps:


    Create the SSH key on the Ansible control node with the following command, just
    press *Enter* on each input, which means, select the default options and the SSH
    key will be created:


    ```

    $ ssh-keygen

    ```


    Copy this SSH key on all the manage nodes with the following commands:


    ```

    $ ssh-copy-id ansible@cen_node_01

    $ ssh-copy-id admin1@cen_node_02

    $ ssh-copy-id ansible@ubu_node_01

    ```


    When you execute the preceding command, the system will require the password one
    last time. If the preceding command executes without any error, a password less
    login is established, which can be verified with the following commands:


    ```

    $ ssh cen_node_01 hostname

    $ ssh cen_node_02 hostname

    $ ssh ubu_node_01 hostname

    $ ssh ubu_node_02 hostname

    ```


    **We purposely excluded the ubu_node_02 to see the error. We will be fixing it
    later when we discuss the inventory file.**'
  merge: -1
