  md: '# *Dealing with errors*


    The Ansible default behavior is to stop the execution when the task has failed.
    We have already discussed in the previous chapter that we can use **ignore_errors:
    yes** and it will ignore the error and the playbook with continue running. When
    we are dealing with handlers, if a play fails, no handler will be executed. To
    overcome this issue, we can use **force_handler: yes** in a playbook. There is
    another interesting option called **failed_when** to define when to consider a
    specific command failed. This is useful for the commands that are producing a
    specific output. Let''s see the following sample for our understanding:


    ```

    tasks:

    -shell: /usr/local/bin/mkusr.sh

    register: mkusr_result

    failed_when: "''password missing'' in mkusr_result.stdout"

    ```


    In the preceding example, the task is considered as failed only if the password
    missing is found in the registered variable.


    If a module thinks it has changed the state of the affected machine, it will report
    the status as If this is not the desired option and you want to tweak this parameter,
    then the **changed_when=false** option will do it.'
  merge: -1
  pgno: 156
- img_proc: true
  md: "# *Blocks*\n\nBlocks are used to logically group tasks. Blocks are useful for\
    \ error handling and **when** statements. One statement can be applied to the\
    \ block, so that it affects all the tasks in the block.\n\nThe following example\
    \ will explain how to use blocks in playbooks:\n\n```\n--\n- name: Understand\
    \ Blocks\n  hosts: all\n  tasks:\n    - name: Installing Apache\n      block:\n\
    \        - package:\n            name: \"{{item}}\"\n            state: installed\n\
    \          with_items:\n            - httpd\n            - elinks\n          \
    \  - mod_ssl\n        - service:\n            name: httpd\n            state:\
    \ started\n            enable: true\n          when: ansible_distribution == 'CentOS'\n\
    ```\n\n# **Output**"
