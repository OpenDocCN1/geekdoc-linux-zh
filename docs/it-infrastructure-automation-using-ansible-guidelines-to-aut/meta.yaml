  mdcn: "\n## Ansible 角色\nAnsible 角色提供了一种从外部文件加载变量、任务和handler的统一方式。角色的作用是让playbook的规模易于管理。角色使用特定的目录结构，用于存放默认任务、handler、模板和变量。一个角色通常对应一种服务类型，例如我们有适用于Docker、Web服务或数据库服务的角色。针对特定的服务器组，可以创建对应的playbook来引入一个或多个角色。为了管控预期执行逻辑，角色中会设置默认变量，这些变量可以在playbook层面被覆盖。为了让角色使用更便捷，可以从Ansible\
    \ Galaxy下载社区共享的角色。角色的定义存放在项目目录下创建的专属角色目录中。\n## 角色的目录结构\n以下是角色中的重要文件夹，我们来逐一了解这些文件夹的内容：\n\
    ```shell\n$ tree .\n.\n├── test-role-1\n│   ├── defaults\n│   │   └── main.yml\n\
    │   ├── files\n│   ├── handlers\n│   │   └── main.yml\n│   ├── meta\n│   │   └──\
    \ main.yml\n│   ├── README.md\n│   ├── tasks\n│   │   └── main.yml\n│   ├── templates\n\
    │   ├── tests\n│   │   ├── inventory\n│   │   └── test.yml\n│   └── vars\n│  \
    \     └── main.yml\n9 directories, 8 files\n$\n```\n### 默认变量\n该文件夹包含一个存储变量默认值的**main.yml**文件。\n\
    ### 静态文件\n该文件夹存放角色任务中引用的静态文件。\n### 处理程序\n该文件夹包含一个存放handler定义的**main.yml**文件。\n\
    ### 元数据\n该文件夹包含一个存储角色相关信息的**main.yml**文件，信息包括作者、许可证、平台和依赖项。\n### 任务\n该文件夹包含一个存放任务定义的**main.yml**文件。\n\
    ### 变量\n该文件夹包含一个存放角色变量定义的**main.yml**文件。\n创建角色时，我们首先需要搭建角色目录结构，无需手动创建，可以使用默认随Ansible安装的**ansible-galaxy**命令来完成。以下命令可以创建角色的目录结构：\n\
    ```shell\n$ ansible-galaxy init test-role-1\n```\n执行上述命令后，就会创建一个名为**test-role-1**的新文件夹，我们来看看该文件夹的内容：\n\
    ```shell\n$ tree .\n.\n└── test-role-1\n    ├── defaults\n    │   └── main.yml\n\
    \    ├── files\n    ├── handlers\n    │   └── main.yml\n    ├── meta\n    │  \
    \ └── main.yml\n    ├── README.md\n    ├── tasks\n    │   └── main.yml\n    ├──\
    \ templates\n    ├── tests\n    │   ├── inventory\n    │   └── test.yml\n    └──\
    \ vars\n        └── main.yml\n9 directories, 8 files\n$\n```\n角色结构化目录创建完成后，我们就可以定义角色内容，然后在playbook中使用这些角色。每个角色都有专属目录，对应的子目录存放在`~/roles`路径下，而非特定项目目录中。因此，如果某个子目录没有使用到，可以留空。\n\
    ## *角色变量*\n角色变量在**vars/main.yml**中定义，优先级较高，无法被清单变量覆盖。默认变量可在**defaults/main.yml**中定义，优先级最低。因此，只有当希望变量在其他位置被覆盖时，才需要使用默认变量。\n\
    ## *定义角色依赖*\n角色可能存在依赖关系，例如某个角色可能会引入其他角色。依赖关系在角色的**meta/main.yml**中定义：\n```yaml\n\
    ---\ndependencies:\n  - {role: apache, port: 80}\n  - {role: mariadb, dbname:\
    \ addresses, admin_user: Rony}\n```\n## 角色的执行顺序\n通常情况下，角色中的任务会在使用它的playbook的任务之前执行，但我们有两种方式可以调整执行顺序，具体如下：\n\
    **pre_tasks**会在角色应用前执行，**post_tasks**会在所有角色执行完成后运行。以下是一个示例playbook，展示了如何实现上述概念：\n\
    ```yaml\n---\n- hosts: cen_node_01\n  pre_tasks:\n    - debug:\n        msg: 'Starting'\n\
    \  roles:\n    - role1\n    - role2\n    - role3\n  tasks:\n    - debug:\n   \
    \     msg: Execute After roles'\n  post_tasks:\n    - debug:\n        msg: 'Last\
    \ Task'\n```\n## *Ansible Galaxy*\nAnsible Galaxy是获取和发布Ansible角色的社区平台，其官网地址如下：[Ansible\
    \ Galaxy官网](https://galaxy.ansible.com/)\n作为一个社区平台，这里提供了大量可直接下载使用的角色，也可以关注仍处于开发阶段的角色。接下来我们访问该网站，了解如何使用Ansible\
    \ Galaxy。以下是从官网截取的截图：\n![](img/30dec63bea641411c2be69f8d282b813_173_0.png)\n**图\
    \ 3.1：***Ansible Galaxy*\n我们可以进入搜索页查找任意角色，例如我搜索了**nginx**，得到了多个结果，其中排名第一的结果来自geerlingguy。选择角色时，角色的评分、下载量和最后导入时间是关键参考因素。如果我们对该角色的统计信息满意，想要使用它，只需点击**nginx**，就会显示以下页面：\n\
    ![](img/30dec63bea641411c2be69f8d282b813_174_0.png)\n**图 3.2：***Ansible Galaxy\
    \ geerlingguy Nginx 角色*\n我们只需要复制安装命令，在Ansible控制节点上运行即可。以下是我们执行命令后得到的输出：\n```shell\n\
    $ ansible-galaxy install geerlingguy.nginx\n- downloading role 'nginx', owned\
    \ by geerlingguy\n- downloading role from https://github.com/geerlingguy/ansible-role-nginx/archive/2.8.0.tar.gz\n\
    + - extracting geerlingguy.nginx to /home/ansible/.ansible/roles/geerlingguy.nginx\n\
    + - geerlingguy.nginx (2.8.0) was installed successfully\n$\n```\n从输出可以看出，该角色已经安装在指定路径下，我们可以进入该目录查看角色的内容，以下是文件夹的输出结果：\n\
    ```shell\n$ tree .\n├── defaults\n│   └── main.yml\n├── handlers\n│   └── main.yml\n\
    ├── LICENSE\n├── meta\n│   └── main.yml\n├── molecule\n│   └── default\n│    \
    \   ├── converge.yml\n│       └── molecule.yml\n├── README.md\n├── tasks\n│  \
    \ ├── main.yml\n│   ├── setup-Archlinux.yml\n│   ├── setup-Debian.yml\n│   ├──\
    \ setup-FreeBSD.yml\n│   ├── setup-OpenBSD.yml\n│   └── setup-RedHat.yml\n├──\
    \ setup-Ubuntu.yml\n├── vhosts.yml\n├── templates\n│   ├── nginx.conf.j2\n│  \
    \ ├─ nginx.repo.j2\n│   └── vhost.j2\n└── vars\n    ├── Archlinux.yml\n    ├──\
    \ Debian.yml\n    ├── FreeBSD.yml\n    ├── OpenBSD.yml\n    └── RedHat.yml\n8\
    \ directories, 23 files\n$\n```\n现在我们就可以在playbook中使用这个角色了。\n## Galaxy 命令行工具\n\
    `ansible-galaxy search`命令用于搜索角色，为`ansible-galaxy search`提供的参数会在角色描述中匹配搜索。我们可以使用`--platform`和**--galaxy-tags**等选项来缩小搜索结果范围。我们来看以下搜索示例：\n\
    ```shell\n$ ansible-galaxy search 'install nginx' --author 'geerlingguy'\n```\n\
    找到16个匹配的角色：\n| 名称 | 描述 |\n|-------|-------------|\n| chaos_jetzt.freescout_helpdesk\
    \ | 安装并配置Freescout帮助台系统。 |\n| geerlingguy.certbot | 安装并配置Certbot（用于Let's Encrypt）。\
    \ |\n| geerlingguy.collectd-signalfx | 适用于Linux的SignalFx Collectd安装工具。 |\n| geerlingguy.drupal\
    \ | 在服务器上部署或安装Drupal。 |\n| geerlingguy.fathom | Fathom网站分析工具 |\n| geerlingguy.gitlab\
    \ | GitLab Git Web界面 |\n| geerlingguy.munin | 适用于RedHat/CentOS或Debian/Ubuntu的Munin监控服务端。\
    \ |\n| geerlingguy.nginx | 适用于Linux、FreeBSD和OpenBSD的Nginx安装工具。 |\n| geerlingguy.php\
    \ | 适用于RedHat/CentOS/Fedora/Debian/Ubuntu的PHP环境。 |\n| geerlingguy.pimpylog | 适用于Linux的Pimp\
    \ my Log安装工具 |\n| geerlingguy.varnish | 适用于Linux的Varnish工具。 |\n| leifmadsen.kibana-4\
    \ | 适用于Linux的Kibana 4 |\n| monsieurbiz.geerlingguy_php | 适用于RedHat/CentOS/Fedora/Debian/Ubuntu的PHP环境。\
    \ |\n| Oefenweb.nginx | 在类Debian系统中搭建（最新版本的）NGINX |\n| sarathkgit.nginx_geerlingguy\
    \ | 适用于Linux、FreeBSD和OpenBSD的Nginx安装工具。 |\n| ubzyhd.nginx | 用于安装NGINX并应用基础安全加固设置的Ansible角色。\
    \ |\n```\n$\n```\n获取到角色名称后，可以使用以下命令查看角色信息并安装角色：\n```shell\n$ ansible-galaxy info\
    \ geerlingguy.nginx\n$ ansible-galaxy install geerlingguy.nginx\n```\nAnsible\
    \ Galaxy还提供了其他非常实用的命令，具体如下：要从Ansible控制节点移除角色，使用以下命令：\n```shell\n$ ansible-galaxy\
    \ remove geerlingguy.nginx\n```\n"
