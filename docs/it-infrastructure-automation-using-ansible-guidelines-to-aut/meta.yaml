- img_proc: true
  md: '# Ansible logging


    By default, Ansible doesn''t log anything, because it has sufficient information
    written in We can see the error messages directly on the Anible console. However,
    if we need the logs to be saved in a file, then we can specify the **log_path**
    in the default section of **ansible.cfg** to force the writing logs in files.
    We can also set the **$ANSIBLE_LOG_PATH** variable to enforce the logging in a
    file. An important point to note is that only the root user can log to so we should
    consider the log files in the local playbook directory, or provide the write permission
    on **/var/logs** for your automation user. A recommended option is to save the
    logs in the local directory, so that you don''t have to modify the system default
    settings. Once we applied these logging parameters, the error messages which were
    written on STDOUT will be written to the log file. We also need to configure the
    **logrotate** on the Ansible logs. The following example will demonstrate the
    creation of log file. We have added the following highlighted line in the **ansible.cfg**
    file''s default section:


    ```

    [defaults]

    log_path= errorlogs

    ```


    We did not specify the full path, so Ansible took the relative path, which means
    it will create the log file to the place where the Ansible playbook is executed.
    Once it''s done you can run any previously created playbook, and a new log file
    will be created.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# **Ansible common errors**


    Understanding the common errors will help troubleshooting the playbooks. For example,
    if there is a connectivity issue like the server is unreachable or wrong credentials,
    these are not actually a playbook error. A playbook error can be a syntax error,
    extra spaces, or things like that. We can use the **ansible-playbook --syntax-check
    playbook_name.yml** command to check if the playbook has any issue. If your playbook
    has many tasks, then **--syntax-check** will produce a high volume of messages.
    To avoid this, we can add **--step** to execute the tasks one by one. In this
    way, troubleshooting will become easy.


    The Ansible playbook''s output messages also give a good hint during troubleshooting.
    For example, the play header will show us which play is currently executed, and
    the task header will show which task is creating an error. So, automatically,
    when the error comes, we know which playbook lines have the error. Moreover, we
    can increase the log detail by adding **-v** or **-vv** or **-vvv** or **-vvvv**
    which add the following verbosity levels:


    +   - **-v** option mean verbosity in output data.

    - **-vv** mean verbosity in input and output data.

    - **-vvv** also includes information about connection to manage host.'
