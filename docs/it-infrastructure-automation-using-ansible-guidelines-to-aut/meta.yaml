    ## Dedicated to

    ### NAZMA AND ZIMAL

    *My wife and daughter, for letting me sacrifice family time in pursuit of my passion*


    ## About the Author

    **Waqas Irtaza** is an experienced IT professional, who has been working across
    infrastructure domains for the past 11 years. He started his career with system
    administration, then moved to network, wireless and cloud administration. Later
    in his career he started using his diverse experience in infrastructure automation.
    He is certified by almost all technology leaders: Cisco, Microsoft, AWS, PMI,
    EC-Council and Linux Foundation. He started his automation journey with small
    Python and shell scripts, and later went on to write complex scripts to automate
    the day-to-day repetitive work across IT infrastructures. Ansible was a pleasant
    surprise for him, since complex IT tasks can be managed with simple Ansible playbooks.
    This simplicity and diversity of Ansible encouraged him to write this book. Outside
    work, Waqas likes cycling and horse riding in addition to helping, coaching, and
    mentoring young people in taking up their careers in technology.


    ## About the Reviewer

    **Sumit Jaiswal** has 10 years of industry experience in the development domain
    with core development technologies like Python, C++, and C#. He is currently working
    as a Senior Software Engineer under the Ansible automation team and working on
    developing content for the networking and security domain. He is an enthusiast
    of open-source projects.


    ## Acknowledgement

    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my wife and daughter, Nazma and Zimal for putting up with me while I
    was spending many weekends and evenings on writing—I could have never completed
    this book without their support. This book wouldn''t have happened if I hadn''t
    had the support from my Line Manager Mr. John Daniel and Manager of the Technology
    Command Centre Mr. Manoj Panicker. My gratitude goes to my team Technology Command
    Centre (TCC) at The Emirates Group, especially Mr. Ahmed Humayun Zaheer, for providing
    valuable insights and expert opinions. Finally, I would like to thank BPB Publications
    for giving me this opportunity to write my first book for them.


    ## Preface

    Ansible is a powerful open source automation language. Uniquely, it is also a
    deployment and orchestration tool. While Ansible provides more productive drop-in
    replacements for many core capabilities in other automation solutions, it also
    seeks to solve other major unsolved IT challenges. Ansible is an open-source automation
    tool, or platform, used for IT tasks such as configuration management, application
    deployment, service orchestration, and infrastructure provisioning. Automation
    is crucial these days, with IT environments that are complex and often need to
    scale quickly for system, network and cloud administrators and developers to keep
    up if they had to do everything manually. Automation simplifies complex infrastructure
    tasks, not just making developers'' jobs more manageable but allowing them to
    focus attention on other tasks that add value to an organization. In other words,
    it frees up time and increases efficiency. And Ansible, as noted above, is rapidly
    rising to the top in the world of automation tools.


    When I started learning Ansible and had gone through a couple of books, I noticed
    that I had to toggle here and there to clear Ansible concepts. Therefore, I thought
    to come up with a book which covers all aspects of infrastructure administration.
    This book begins with Ansible basics so anyone with no automation experience can
    start from there. Once basics are cleared, each chapter is specifically designed
    for its respective technology. Over the course of 7 chapters in this book, you
    will learn the following:


    - Chapter 1: Lab setup and introduction to Ansible and core concepts

    - Chapter 2: Understand Ansible Ad-Hoc and playbook with examples. This chapter
    also covers the core concepts and practical implementations.

    - Chapter 3: This chapter covers the advanced Ansible concepts which will help
    readers write professional playbooks.

    - Chapter 4: A key chapter for network administration. This chapter will discuss
    one-liner Ad-Hoc commands which are handy for network administrators. Later this
    chapter discusses advanced Ansible concepts specifically for network administration.

    - Chapter 5: A key chapter for system administration which covers both Linux and
    Windows Infrastructure automation.

    - Chapter 6: A key chapter for DevOps and cloud administrators. It covers Ansible
    automation for the public and private clouds in addition to Docker and Kubernetes.

    - Chapter 7: The final chapter that discusses recommendations and best practices
    for Ansible.


