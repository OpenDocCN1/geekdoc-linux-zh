    # <u>Ansible error handling</u>


    Ansible normally has defaults settings which make sure to check the return codes
    of the commands and modules; if Ansible playbook fails, Anible exits the playbook
    with an error. Anible provides several ways to change this default behaviour;
    let''s discuss them in the following section.'
  - "[PAGE 124]\n\n# **Ignoring failed commands**\n\nGenerally, the Ansible behaviour\
    \ is to stop executing any more steps or commands on a host that has a task failed,\
    \ which makes sense. For example, we have written a playbook which installs Apache\
    \ and then starts the service. If the installation fails, it does not make any\
    \ sense to run a command, which will try to start the service. In this case, both\
    \ the commands are dependent. However, if the commands are independent and we\
    \ want to keep going, then we have to add the following highlighted command in\
    \ our playbook, which will change the Ansible default behaviour and execute all\
    \ the tasks for the particular host, even if some tasks get failed:\n\n```\n-\
    \ name: If fails, this command will not be counted as a failure\n  command: /bin/false\n\
    \  ignore_errors: yes\n```"
  - '[PAGE 125]


    # **Resetting_unreachable_hosts**


    The default Ansible behavior is to set the host unreachable; if the host did not
    respond on time, and the Ansible timeout is breached – which can happen because
    of several issues, for example network or server utilization was high and host
    could not respond on time – then Ansible will remove the host from the active
    host.


    The Ansible tasks will be executed on the active host only; in case we suspect
    there will be a false positive for the unreachable hosts, and we want to change
    the Ansible behavior to auto recover the unreachable host, then we have to use
    **clear_host_errors** in playbook.'
