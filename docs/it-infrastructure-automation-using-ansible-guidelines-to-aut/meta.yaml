    # Ansible ad-hoc commands for troubleshooting


    We can use the Ansible ad-hoc commands to perform quick tests before running the
    playbooks on the managed nodes. The following are a few of the examples:


    Check if specific package is installed:


    ```

    $ ansible cen_node_01 -i inventory -m yum -a " name=httpd

    state=present"

    ```


    Check if manage host has the required disk size available:


    ```

    $ ansible cen_node_01 -i inventory -a "df -h"

    ```


    Check managed host RAM and swap utilization:


    ```

    ansible cen_node_01 -i inventory -a "free -h"

    ```


    Check if specific user is available:


    ```

    $ ansible cen_node_01 -i inventory -m user -a ''name=ansible''

    ```


    Check if the SSH connection is properly established with managed

    host:'
  - '[PAGE 199]


    # Ansible file lookup


    In this section, we will be talking about lookups. So far, we''ve been storing
    the credentials for our target servers inside the inventory file or the **var_host**
    folders. *What if there are too many servers or this information is already available
    elsewhere?* Let''s say, we have the credentials of the servers stored in a CSV
    file in a host name and password format – the first column being the host name
    and the second column being the password. To read the contents of the file, while
    the Ansible playbook is running and to get the password associated to a host,
    we can use the **lookup** plugin. The following is how we use the **lookup** plugin:


    ```

    {{lookup(''csvfile'', ''cen_node_03 file=tmp/my_servers.csv delimiter='','')}}

    ```


    For example, in this case, the first argument that we passed to the **lookup**
    plugin is the type of the file which happens to be **csv** file in this case.
    There are a number of other options available that we''ll see in a bit. Then comes
    the value to lookup. For example, here we''d like to lookup the information about
    the server followed by the file we are looking at. For example, in this case,
    the file is stored under the **tmp** directory and is called `my_servers.csv`,
    and finally, the delimiter which happens to be comma in this case, because it''s
    a CSV file. If you have a file which uses another separator maybe like a semicolon
    or something, then you could specify that here. So, this same lookup plugin for
    the CSV file supports multiple other character''s separated file formats as well.
    In this'
  - '[PAGE 200]


    case, this whole function or plugin is going to return the password from the CSV
    file.


    There are a couple of lookup plugins available, such as the following:


    +   - CSV file lookup

    - INI file lookup

    - Credstash lookup

    - DNS lookup

    - MongoDB lookup


    The information about this can be seen in the Ansible documentation page under
    the *Special topics and lockups* playbook.'
  - '[PAGE 201]


    # Ansible template


    Ansible has a very useful module template, it provides the ability to use the
    templates in which, we can make use of the Ansible variables, conditions to generate
    the specific data formats, and eventually provide a custom template for each manage
    host. Afterwards, this template will be transferred to manage hosts. We can also
    create a specific template for Windows by using the **win_template** module. The
    template concept is quite frequently used in the DevOps world. However, it is
    also applicable for the networking devices which have the configuration files
    in the HTTP or XML formats.


    The template data is generated, based on the **Jinja2** templates. The Jinja2
    template is a modern-day templating language for the Python developers; since
    Ansible itself is written in Python so we can leverage the Jinja2 templating benefits
    here. Jinja2 templates are used to create the HTML, XML, or other mark-up formats
    that returned to the user via an HTTP request.


    In futuristic technologies, we have less requirement for static data and more
    for the dynamic data being requested from the end users. Therefore, Jinja2 templating
    is being used. The templates are processed by the Jinja2 templating engine. Also,
    the way these templates are formatted is an important aspect.'
- md: "To use the template, we have to set at least the following two parameters:\n\
    - `src`: This is the source path for the template file with relative or absolute\
    \ path.\n- `dest`: The destination path, where you want to copy the template on\
    \ the managed hosts. Moreover, if the directory path is given, then a file with\
    \ the same name as the template will be created.\n\nWe also have the optional\
    \ parameters, let's discuss them for a better understanding:\n- `mode`: This option\
    \ is used to set the permission for the destination file.\n- `group`: This option\
    \ is used to change the group of the file on remote hosts.\n- `owner`: This option\
    \ is used to change the owner of the file on remote hosts.\n- `force`: By default,\
    \ this option is set to `yes`, which means if there is an already existing file\
    \ on the destination, then the target file will be overwritten. However, if we\
    \ explicitly set this option to `no`, then it will not replace the existing file.\n\
    - `backup`: If the template file already exists and you want it to have a backup,\
    \ then use this parameter and set to `yes`. By doing this, every time a new file\
    \ with the same name is pushed from the controller node, then the older file on\
    \ the remote hosts will be renamed with the name with date and time.\n- `newline_sequence`:\
    \ We can also enforce the new-line sequence. To specify the newline sequence to\
    \ use for templating files, the acceptable values are `\\n` and `\\r\\n`.\n\n\
    Let's take a couple of the following examples to understand how the template works\
    \ in Ansible.\n\n## Example 1\nIn this example, we will transfer a plain text\
    \ template to managed nodes:\n\n### Playbook\nThe following is the playbook used\
    \ for this example:\n```yaml\n---\n- name: Template Example 1\n  hosts: centos\n\
    \  tasks:\n    - name: understand Ansible Template\n      template:\n        src:\
    \ template01.j2\n        dest: /tmp/template-01.txt\n```\n\n### Ansible output\n\
    The following is the output from the Ansible playbook:\n```bash\n$ ansible-playbook\
    \ template_example01.yml -i inventory\n```\n```\nPLAY [Template Example 1] ************************************************************************\n\
    TASK [Gathering Facts] ************************************************************************\n\
    ok: [cen_node_02]\nok: [cen_node_01]\n\nTASK [understand Ansible Template] ************************************************************************\n\
    ok: [cen_node_02]\nok: [cen_node_01]\n\nPLAY RECAP ************************************************************************\n\
    ```\n```\n******************\n*************\n```\n```\ncen_node_01 : ok=2 changed=0\
    \ unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\ncen_node_02 : ok=2 changed=0\
    \ unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n$\n```\n\n### Verification\n\
    If the Ansible playbook is executed properly, the template will be transferred\
    \ on the Ansible managed nodes. We are using the following commands to verify\
    \ the template creation:\n```bash\n$ ssh cen_node_01 \"cat /tmp/template-01.txt\"\
    \nThis is simple template file\n$ ssh cen_node_02 \"cat /tmp/template-01.txt\"\
    \nThis is simple template file\n$\n```\n\n### Explanation\nSo, we have a plain\
    \ text template file which we want to transfer to the managed nodes. Since the\
    \ template and the playbook, both are in the same folder, we have used the relative\
    \ path, otherwise we have to use the full path like **/home/ansible/download/**.\
    \ The rest of the example is straight-forward.\n\n## Example 2\nLet's add some\
    \ built-in variables or facts to understand how we can integrate them in our templates.\n\
    \n### Playbook\nThe following is the Ansible playbook used for this example:\n\
    ```yaml\n---\n- name: Template Example 2\n  hosts: centos\n  tasks:\n    - name:\
    \ understand Ansible Template with FACTS\n      template:\n        src: template02.j2\n\
    \        dest: /tmp/template-02.txt\n```\n\n### Jinja2 template file\nThe following\
    \ is the Jinja2 template file for this example:\n```\nServer Details for template\n\
    **Hostname:** {{ansible_hostname}}\nIP Address: {{ansible_all_ipv4_addresses}}\n\
    Operating system: {{ansible_distribution}}\n```\n\n### Playbook verification\n\
    We can open the destination files to verify if the template worked as per requirements:\n\
    ```bash\n$ ssh cen_node_01 \"cat /tmp/template-02.txt\"\nServer Details for template\n\
    Hostname : cent_node_01\nIP Address: ['10.0.2.15', '10.0.0.10']\nOperating system:\
    \ CentOS\n```\n```bash\n$ ssh cen_node_02 \"cat /tmp/template-02.txt\"\nServer\
    \ Details for template\nHostname : cent_node_02\nIP Address: ['10.0.2.15', '10.0.0.11']\n\
    Operating system: CentOS\n$\n```\n\n### Explanation\nThis is an important example,\
    \ which will explain how the dynamic data can be added in the template. So, here\
    \ we use the Ansible facts and when the playbook is executed, Ansible intelligently\
    \ replaces the facts with the respective managed host details. I hope the basic\
    \ idea of the template module is clear so far. We can also use our own variables\
    \ instead of facts, and Ansible will replace these variables with the values when\
    \ the playbook is executed.\n\n## Ansible dynamic inventory\nWe have already discussed\
    \ about the Ansible inventory file, which has the host details available; such\
    \ an inventory is called the static inventory. However, if Ansible has to cover\
    \ all the IT domains, then the static inventory is not realistic in the production\
    \ environments. In the real world, infrastructure keeps changing rapidly. We also\
    \ add new nodes and remove the unwanted nodes. This is very common, especially\
    \ for the cloud and container environments, where the nodes are added and removed\
    \ based on usage. Therefore, Ansible came up with a concept called **dynamic inventory**\
    \ which fetches the list of nodes from the infrastructure environments in real\
    \ time.\n\nIn the modern IT environment, the sources of host nodes can be AWS,\
    \ Azure, OpenStack, containers, and LDAP systems. These systems have their list\
    \ of nodes and Ansible integrates with such external dynamic inventory.\n\nIn\
    \ Ansible, we have the following two ways to connect to the external dynamic inventories:\n\
    - **Via scripts**: This is the older way which ensures backward compatibility.\n\
    - **Ansible plugins**: Ansible recommends this over the scripts for dynamic inventory,\
    \ since the plugins are updated with the Ansible core code.\n\nDynamic inventory\
    \ scripts are written in a programming language like Python, PHP, and so on. When\
    \ using the script, they get real time data from the target source environments,\
    \ like AWS, OpenStack, GCP, and so on. The Ansible community have already developed\
    \ such kind of scripts for the majority of platforms. If we have good programming\
    \ skills, we may write such scripts as well, but using scripts is not very well-documented\
    \ and not successful every time. Normally, we download the scripts for the source\
    \ environment and set the **env** variable as per the guidelines available with\
    \ the script. These scripts are maintained by the Ansible community. Mostly, the\
    \ scripts are written in Python and named as per the corresponding platform specifications.\
    \ Along with these Python scripts, there are the INI files as well, which are\
    \ needed to set the environment, but this is dependent on the script that we are\
    \ using.\n\nIn Ansible, we have a set of available inventory plugins. Similarly,\
    \ we can create our own plugins. Normally, the inventory returns the list of items\
    \ in the JSON format. Ansible provides a bunch of inventory plugins, using which\
    \ we can get the list of target hosts on which you will be running any task or\
    \ play. For example, we can use the following commands to get the list of available\
    \ Ansible plugins for our Ansible. These plugins will vary, depending on which\
    \ Ansible version we are using:\n```bash\n$ ansible-doc -t inventory -l\n```\n\
    ```\nadvanced_host_list    Parses a 'host list' with ranges\nauto            \
    \      Loads and executes an inventory plugin specified in a YAML config\naws_ec2\
    \               EC2 inventory source\n```\n\n| Inventory Source | Description\
    \ |\n|------------------|-------------|\n| aws_rds | RDS instance source |\n|\
    \ azure_rm | Azure Resource Manager inventory plugin |\n| cloudscale | cloudscale.ch\
    \ inventory source |\n| constructed | Based on existing inventory, uses Jinja2\
    \ to construct vars and groups |\n| docker_machine | Docker Machine inventory\
    \ source |\n| docker_swarm | Ansible dynamic inventory plugin for Docker Swarm\
    \ |\n| foreman | Foreman inventory source |\n| gcp_compute | Google Cloud Compute\
    \ Engine inventory source |\n| generator | Uses Jinja2 to construct hosts and\
    \ groups from patterns |\n| gitlab_runners | Ansible dynamic inventory plugin\
    \ for GitLab runners |\n| hcloud | Ansible dynamic inventory plugin for the Hetzner\
    \ Cloud |\n| host_list | Parses a 'host list' string |\n| ini | Uses an Ansible\
    \ INI file as inventory source |\n| k8s | Kubernetes (K8s) inventory source |\n\
    | kubevirt | KubeVirt inventory source |\n| linode | Ansible dynamic inventory\
    \ plugin for Linode |\n| netbox | NetBox inventory source |\n| nmap | Uses nmap\
    \ to find hosts to target |\n| online | Online inventory source |\n| openshift\
    \ | OpenShift inventory source |\n| openstack | OpenStack inventory source |\n\
    | scaleway | Scaleway inventory source |\n| script | Executes an inventory script\
    \ that returns JSON |"
  mdcn: "\n要使用此模板，我们至少需要设置以下两个参数：\n- `src`：模板文件的源路径，可以是相对路径或绝对路径。\n- `dest`：目标路径，即你想将模板复制到受管主机上的位置。此外，如果提供了目录路径，则会创建一个与模板同名的文件。\n\
    \n我们还有一些可选参数，下面来讨论它们以便更好地理解：\n- `mode`：此选项用于设置目标文件的权限。\n- `group`：此选项用于更改远程主机上文件的所属组。\n\
    - `owner`：此选项用于更改远程主机上文件的所有者。\n- `force`：默认情况下，此选项设置为 `yes`，这意味着如果目标路径已存在同名文件，则目标文件将被覆盖。但是，如果我们明确将此选项设置为\
    \ `no`，则不会替换现有文件。\n- `backup`：如果模板文件已存在且你希望对其进行备份，则使用此参数并将其设置为 `yes`。这样，每当控制器节点推送具有相同名称的新文件时，远程主机上的旧文件将被重命名，名称中包含日期和时间。\n\
    - `newline_sequence`：我们也可以强制指定换行符序列。要指定用于模板文件的换行符序列，可接受的值是 `\\n` 和 `\\r\\n`。\n\
    \n接下来，我们通过几个示例来理解 Ansible 中模板是如何工作的。\n\n## 示例 1\n在此示例中，我们将把一个纯文本模板传输到受管节点：\n\n\
    ### Playbook\n以下是此示例使用的 playbook：\n```yaml\n---\n- name: Template Example 1\n\
    \  hosts: centos\n  tasks:\n    - name: understand Ansible Template\n      template:\n\
    \        src: template01.j2\n        dest: /tmp/template-01.txt\n```\n\n### Ansible\
    \ 输出\n以下是 Ansible playbook 的执行输出：\n```bash\n$ ansible-playbook template_example01.yml\
    \ -i inventory\n```\n```\nPLAY [Template Example 1] ************************************************************************\n\
    TASK [Gathering Facts] ************************************************************************\n\
    ok: [cen_node_02]\nok: [cen_node_01]\n\nTASK [understand Ansible Template] ************************************************************************\n\
    ok: [cen_node_02]\nok: [cen_node_01]\n\nPLAY RECAP ************************************************************************\n\
    ```\n```\n******************\n*************\n```\n```\ncen_node_01 : ok=2 changed=0\
    \ unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\ncen_node_02 : ok=2 changed=0\
    \ unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n$\n```\n\n### 验证\n如果 Ansible\
    \ playbook 执行正确，模板将被传输到 Ansible 受管节点。我们使用以下命令来验证模板创建情况：\n```bash\n$ ssh cen_node_01\
    \ \"cat /tmp/template-01.txt\"\nThis is simple template file\n$ ssh cen_node_02\
    \ \"cat /tmp/template-01.txt\"\nThis is simple template file\n$\n```\n\n### 说明\n\
    因此，我们有一个纯文本模板文件，我们想将其传输到受管节点。由于模板和 playbook 在同一文件夹中，我们使用了相对路径，否则我们必须使用完整路径，如 **/home/ansible/download/**。示例的其余部分很直接。\n\
    \n## 示例 2\n让我们添加一些内置变量或事实（facts），以了解如何将它们集成到我们的模板中。\n\n### Playbook\n以下是此示例使用的\
    \ Ansible playbook：\n```yaml\n---\n- name: Template Example 2\n  hosts: centos\n\
    \  tasks:\n    - name: understand Ansible Template with FACTS\n      template:\n\
    \        src: template02.j2\n        dest: /tmp/template-02.txt\n```\n\n### Jinja2\
    \ 模板文件\n以下是此示例的 Jinja2 模板文件：\n```\nServer Details for template\n**Hostname:**\
    \ {{ansible_hostname}}\nIP Address: {{ansible_all_ipv4_addresses}}\nOperating\
    \ system: {{ansible_distribution}}\n```\n\n### Playbook 验证\n我们可以打开目标文件以验证模板是否按要求工作：\n\
    ```bash\n$ ssh cen_node_01 \"cat /tmp/template-02.txt\"\nServer Details for template\n\
    Hostname : cent_node_01\nIP Address: ['10.0.2.15', '10.0.0.10']\nOperating system:\
    \ CentOS\n```\n```bash\n$ ssh cen_node_02 \"cat /tmp/template-02.txt\"\nServer\
    \ Details for template\nHostname : cent_node_02\nIP Address: ['10.0.2.15', '10.0.0.11']\n\
    Operating system: CentOS\n$\n```\n\n### 说明\n这是一个重要的示例，它将解释如何将动态数据添加到模板中。因此，这里我们使用了\
    \ Ansible 事实（facts），当 playbook 执行时，Ansible 会智能地将这些事实替换为相应受管主机的详细信息。希望到目前为止模板模块的基本概念已经清晰。我们也可以使用自定义变量代替事实（facts），当\
    \ playbook 执行时，Ansible 将用实际值替换这些变量。\n\n## Ansible 动态清单\n我们已经讨论过 Ansible 清单文件，其中包含主机详细信息；这样的清单称为静态清单。然而，如果\
    \ Ansible 必须涵盖所有 IT 领域，那么静态清单在生产环境中是不现实的。在现实世界中，基础设施变化迅速。我们也会添加新节点并移除不需要的节点。这在云和容器环境中尤其常见，节点会根据使用情况被添加和移除。因此，Ansible\
    \ 提出了一个名为**动态清单**的概念，它可以从基础设施环境中实时获取节点列表。\n\n在现代 IT 环境中，主机节点的来源可以是 AWS、Azure、OpenStack、容器和\
    \ LDAP 系统。这些系统有自己的节点列表，Ansible 与这些外部动态清单集成。\n\n在 Ansible 中，我们有以下两种方式连接到外部动态清单：\n\
    - **通过脚本**：这是较早的方式，确保了向后兼容性。\n- **Ansible 插件**：Ansible 推荐使用插件而非脚本来实现动态清单，因为插件会随\
    \ Ansible 核心代码一起更新。\n\n动态清单脚本是用 Python、PHP 等编程语言编写的。使用脚本时，它们从目标源环境（如 AWS、OpenStack、GCP\
    \ 等）获取实时数据。Ansible 社区已经为大多数平台开发了此类脚本。如果我们有良好的编程技能，也可以编写这样的脚本，但使用脚本文档记录不够完善，且并非每次都成功。通常，我们下载适用于源环境的脚本，并根据脚本提供的指南设置\
    \ **env** 变量。这些脚本由 Ansible 社区维护。大多数脚本是用 Python 编写的，并按照相应的平台规范命名。除了这些 Python 脚本，还有\
    \ INI 文件，这些文件用于设置环境，但具体取决于我们使用的脚本。\n\n在 Ansible 中，我们有一组可用的清单插件。同样，我们可以创建自己的插件。通常，清单以\
    \ JSON 格式返回项目列表。Ansible 提供了一系列清单插件，使用这些插件我们可以获取运行任何任务或 play 的目标主机列表。例如，我们可以使用以下命令获取我们\
    \ Ansible 实例可用的 Ansible 插件列表。这些插件会因我们使用的 Ansible 版本而异：\n```bash\n$ ansible-doc\
    \ -t inventory -l\n```\n```\nadvanced_host_list    Parses a 'host list' with ranges\n\
    auto                  Loads and executes an inventory plugin specified in a YAML\
    \ config\naws_ec2               EC2 inventory source\n```\n\n| 清单源 | 描述 |\n|------------------|-------------|\n\
    | aws_rds | RDS 实例源 |\n| azure_rm | Azure 资源管理器清单插件 |\n| cloudscale | cloudscale.ch\
    \ 清单源 |\n| constructed | 基于现有清单，使用 Jinja2 构造变量和组 |\n| docker_machine | Docker\
    \ Machine 清单源 |\n| docker_swarm | 用于 Docker Swarm 的 Ansible 动态清单插件 |\n| foreman\
    \ | Foreman 清单源 |\n| gcp_compute | Google Cloud Compute Engine 清单源 |\n| generator\
    \ | 使用 Jinja2 从模式构造主机和组 |\n| gitlab_runners | 用于 GitLab 运行器的 Ansible 动态清单插件 |\n\
    | hcloud | 用于 Hetzner Cloud 的 Ansible 动态清单插件 |\n| host_list | 解析“主机列表”字符串 |\n\
    | ini | 使用 Ansible INI 文件作为清单源 |\n| k8s | Kubernetes (K8s) 清单源 |\n| kubevirt |\
    \ KubeVirt 清单源 |\n| linode | 用于 Linode 的 Ansible 动态清单插件 |\n| netbox | NetBox 清单源\
    \ |\n| nmap | 使用 nmap 查找目标主机 |\n| online | Online 清单源 |\n| openshift | OpenShift\
    \ 清单源 |\n| openstack | OpenStack 清单源 |\n| scaleway | Scaleway 清单源 |\n| script\
    \ | 执行返回 JSON 的清单脚本 |\n"
