  md: '# *Ansible configuration_file*


    When the Ansible command or playbook is executed, it looks for the **Ansible.cfg**
    file, which has the Ansible related parameters configured.


    Ansible looks for the configuration file in the following order:


    +   - **Priority** variable if set).

    - **Priority** the current directory).

    - **Priority** the home directory).

    - **Priority** /etc/ansible/ansible.cfg (default location)


    Ansible will process the preceding list and use the first file found, and all
    the others will be ignored. Ansible creates a default configuration file at the
    location when Ansible is installed.


    The recommendation is to keep a separate configuration file for each script or
    a group of scripts, otherwise Anible will use the default configuration file.
    Later, if someone modified the parameter of the default configuration file, all
    your scripts will be affected and it will become a huge troubleshooting task.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'We will discuss some basic parameters in the following section;

    the other parameters will be covered in the later chapters:


    **Inventory=** We can specify the inventory file directly from the

    configuration file, so we don’t have to provide it during the script

    execution.


    **Forks =** This represents the number of parallel connections that

    needs to be established. By default, its value is If we increase this

    value, the script processing time will be enhanced. However, it will

    generate more load on the Ansible server and network.


    **sudo_user =** Here we can change the **sudo** user to some other

    user with the admin rights, since the root user is not normally

    used for the day-to-day tasks.


    **gathering =** This option is used to collect more information about

    the host machine. This is a very useful feature; we will discuss it

    further in the later chapters.


    **timeout =** This is for the SSH timeout in seconds; for lab setup

    **10** seconds is OK, but for production, you must change this to

    **30** seconds or even **60** seconds. Otherwise, you might get the

    timeout messages on some hosts, which have high utilization.'
  merge: -1
