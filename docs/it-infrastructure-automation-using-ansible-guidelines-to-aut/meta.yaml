    # # Conclusion


    In this chapter, we covered the theory of Ansible. Ansible is the simplest way
    to automate the IT infrastructure. It uses the SSH port for management, which
    is a default industry standard for the IT infrastructure administration. Zero
    configuration on managed nodes is a unique feature in Ansible.


    We discussed the Ansible components and how they come together. We also discussed
    the option to install Ansible, configure the managed nodes, and test the installation.
    Ansible provides a diverse range of options to configure the managed nodes and
    we discussed all of them in detail. An Ansible inventory is a file, which stores
    the host or managed nodes in details. The Ansible modules are the code, written
    for specific tasks and infrastructure. Ansible already has thousands of modules
    available and ready to be used. The Ansible modules are written for specific networking
    devices, cloud platforms, and almost all the major aspects of IT. The Ansible
    scripts are written in YAML, which is a human-readable data-serialization language.
    It is commonly used for the configuration files. The important components of YAML
    are list and dictionary. Dictionary is unordered and list is ordered.


    In the next chapter, we will understand and practice the Ansible ad-hoc mode and
    write useful automation scripts for the day-to-day activities. We will cover the
    basics of the Ansible playbooks and see the different programming options like
    the conditional statements, variables, loops, and much more.'
- md: "## Multiple choice questions\n### What is Ansible?\n- An automation platform.\n\
    - A programming language.\n- A GUI interface for the programming language interpreter.\n\
    - A fictional device.\n\n### In which language is the Ansible engine written?\n\
    - Ruby.\n- DSL.\n- Python.\n- YAML.\n\n### What are the advantages of using Ansible?\n\
    - Agentless.\n- Very low overhead.\n- Good performance.\n- All of the above.\n\
    \n### What are the Ansible use cases?\n- Security and compliance policy integration.\n\
    - Automated workflow for continuous delivery.\n- Simplified orchestration.\n-\
    \ App deployment.\n- Configuration management.\n- Streamlined provisioning.\n\
    - All of the above.\n\n### Which default protocol does Ansible use for host management?\n\
    - SMTP.\n- HTTP.\n- Telnet.\n- SSH.\n\n### What is the name of the Ansible configuration\
    \ file?\n- host\n- inventory\n- ansible.cfg\n- ansible_config.cfg\n\n### What\
    \ is the priority sequence for the Ansible configuration file?\n- **ANSIBLE_CONFIG**\
    \ environmental variable\n- **ansible.cfg** in current directory\n- **ansible.cfg**\
    \ in user home directory\n- /etc/ansible/ansible.cfg\nOptions:\n- 1234\n- 3124\n\
    - 1324\n- 4321\n- None of the above\n\n## Multiple choice questions answers\n\
    - A\n- C\n- D\n- G\n- D\n- C\n- C\n\n## Points to remember\nAnsible itself is\
    \ written in Python, however, the Ansible playbooks are written in YAML. By default,\
    \ Ansible uses SSH for managing the hosts' machines. Location and priority of\
    \ the Ansible configuration file is extremely important. Command, shell, and raw\
    \ are all the modules used to execute commands on the remote hosts; however, command\
    \ doesn't support the environmental variables, and raw is used when the remote\
    \ machine doesn't have Python installed.\n\n## Key terms\nThe following are the\
    \ key terms that we have used and defined in this chapter:\n- **Ansible control**\
    \ A server, where Ansible is installed. It must be a Linux machine.\n- **Ansible\
    \ manage** Servers/devices managed through Ansible.\n- **Ansible inventory** List\
    \ of servers/devices.\n- **Ansible configuration** Modifying Ansible default parameters.\n\
    - **Ansible playbook** Pre-build scripts for specific tasks.\n\n## CHAPTER 2:\
    \ Ansible Basics\nBefore we start working with Ansible, let's recap what we learned\
    \ in the previous chapter. We discussed what makes Ansible a popular automation\
    \ tool. We also discussed the Ansible infrastructure requirements and components.\
    \ Moreover, Ansible installation and YAML syntax was discussed in detail.\n\n\
    In this chapter, we will introduce the real-world usage of Ansible. We will discuss\
    \ the Ansible nodes and when to use them. We will take the real-world tasks and\
    \ automate them with Ansible. After going through this chapter, you will be able\
    \ to automate the basic repetitive tasks with Ansible.\n\n### Structure\nIn this\
    \ chapter, we will cover the following topics:\n- Ansible ad-hoc mode\n- Examples\
    \ for ad-hoc mode\n- Ansible playbook\n- Ansible variables\n- Conditional statements\
    \ in Ansible\n- Loops in Ansible\n- Ansible handler\n- Ansible Vault\n\n### Objective\n\
    After studying this chapter, you should be able to do the following:\n- Use Ansible\
    \ ad-hoc mode for automation.\n- Write Ansible playbooks for automation.\n- Understand\
    \ Ansible user-defined and built-in variables and conditional statements.\n- Understand\
    \ and use different types of loops in Ansible.\n- Understand and use Ansible handler.\n\
    - Understand and use Ansible Vault.\n\n### Ansible ad-hoc mode\nThe Ansible ad-hoc\
    \ mode is a command-line tool to automate single tasks. The Ansible ad-hoc mode\
    \ is quick and easy, but it is not reusable, since each time you have to provide\
    \ the desired parameter. We can automate thousands of servers with just a single\
    \ ad-hoc command, which demonstrates the power of Ansible. The practical use of\
    \ Ansible ad-hoc mode includes managing users, file copying, rebooting servers,\
    \ installing or removing packages, and many more. All the Ansible modules can\
    \ be used in the ad-hoc mode, however the default module is command. The following\
    \ is a sample ad-hoc command:\n```\n$ ansible [pattern] -i inventory-file -m [module]\
    \ -a \"[module options]\"\n```\nLet us discuss all the inputs for a better understanding.\n\
    \n### Pattern\nPattern helps us in selecting the specific hosts or groups from\
    \ the inventory file. The following table lists the common patterns for targeting\
    \ the inventory hosts and groups:\n| groups: |\n|---------|\n| groups: |\n| groups:\
    \ |\n| groups: |\n| groups: |\n| groups: |\n| groups: |\n| groups: |\n| groups:\
    \ |\n| groups: |\n| groups: |\n| groups: |\n| groups: |\n| groups: |\n| groups:\
    \ |\n| groups: |\n\n*Table 2.1: Ansible Patterns*\n\nOnce you know the basic patterns,\
    \ you can combine them in any order. The following is an example to demonstrate\
    \ it:\n```\nwebservers:dbservers:&staging:!phoenix\n```\nWe use the wildcard patterns\
    \ to locate the host from the inventory file. All the hosts that match the wildcard\
    \ will be selected. The Wildcard pattern can be used for IP or FQDNs. The following\
    \ example demonstrates the power of using wildcards:\n```\n192.168.* *.example.com\
    \ *.com\n```\nWe can also mix the wildcard patterns and groups at the same time.\
    \ The following example will demonstrate it:\n```\nwebservers:dbservers:&staging:!phoenix\n\
    ```\nAt this point, one thing should be clear, and that is, if the pattern is\
    \ not matching any host in the inventory file, the following error will be displayed:\n\
    ```\n[WARNING]: No inventory was parsed, only implicit localhost is available\n\
    [WARNING]: Could not match supplied host pattern, ignoring: *.not_in_inventory.com\n\
    ```\n\n### Inventory\nWe have spent a decent amount of time in understanding all\
    \ about the Ansible inventory in the previous chapter. The `-i` option is used\
    \ to assign an inventory file for the Ansible ad-hoc mode. If we have defined\
    \ the inventory file path in the Ansible configuration file, then we don't have\
    \ to mention it here.\n\n### Modules\nWe have already discussed about modules\
    \ in the previous chapter. For the Ansible ad-hoc mode, the -m option is used\
    \ to provide the module name and -a is used to provide the module arguments. We\
    \ will be following a lot of examples which will clarify this point.\n\n### Examples\
    \ for ad-hoc mode\nIn this section, we will take several useful practical examples\
    \ to understand how useful the ad-hoc mode is. Most of the examples in this chapter\
    \ can be used in any production environment. Let's take a look at these examples.\n\
    \n#### CHECK HOST STATUS\nWe have already used the **ping** module in the previous\
    \ chapter. When this module is executed and host is up, we get the **PONG** message\
    \ in the output. The following is the output for the **ping** module:\n```\nansible@master:~/ansible/Chapter-02$\
    \ ansible cen_node_01 -i inventory -m ping\ncen_node_01 | SUCCESS => {\n    \"\
    ansible_facts\": {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\
    \n    },\n    \"changed\": false,\n    \"ping\": \"pong\"\n}\nansible@master:~/ansible/Chapter-02$\n\
    ```\nThis is a quick check to see if the host is up before executing the other\
    \ commands.\n\n#### REBOOTING SERVERS\nAs we discussed earlier, the **-m** option\
    \ is for selecting the module and **-a** is for the module parameter. However,\
    \ if we don't specifically mention any module, Ansible will use the **COMMAND**\
    \ module. At this point, we have the Ansible setup ready and the inventory file\
    \ has managed host details. To reboot all the servers in a specific group, for\
    \ example we will be using the following example:\n```\n$ ansible centos -i inventory\
    \ -a \"/sbin/reboot\"\n```\nAs per the Ansible configuration file, by default,\
    \ Ansible has five parallel connections. Which means, if we reboot ten servers,\
    \ Ansible will reboot five servers and then the other five servers. This is a\
    \ configurable parameter, we can either change it in the configuration file or\
    \ provide it via the command-line. For example, if we want to reboot **20** servers\
    \ in parallel, the following command will be used:\n```\n$ ansible centos -i inventory\
    \ -a \"/sbin/reboot\" -f 20\n```\nAnsible will by default run from the current\
    \ user account. To connect as a different user, for example, if the current user\
    \ doesn't have **sudo** access, we can use the following command:\n```\n$ ansible\
    \ centos -i inventory -a \"/sbin/reboot\" -f 10 -u username\n```"
  mdcn: "\n## 选择题\n### 什么是 Ansible？\n- 自动化平台\n- 编程语言\n- 编程语言解释器的图形界面\n- 虚构设备\n###\
    \ Ansible 引擎使用什么语言编写？\n- Ruby\n- DSL\n- Python\n- YAML\n### 使用 Ansible 的优势有哪些？\n\
    - 无代理\n- 极低开销\n- 高性能\n- 以上全部\n### Ansible 的使用场景有哪些？\n- 安全与合规策略集成\n- 持续交付自动化工作流\n\
    - 简化编排\n- 应用部署\n- 配置管理\n- 简化资源调配\n- 以上全部\n### Ansible 用于主机管理的默认协议是什么？\n- SMTP\n\
    - HTTP\n- Telnet\n- SSH\n### Ansible 配置文件的名称是什么？\n- host\n- inventory\n- ansible.cfg\n\
    - ansible_config.cfg\n### Ansible 配置文件的优先级顺序是什么？\n- **ANSIBLE_CONFIG** 环境变量\n\
    - 当前目录下的 **ansible.cfg**\n- 用户主目录下的 **ansible.cfg**\n- /etc/ansible/ansible.cfg\n\
    选项：\n- 1234\n- 3124\n- 1324\n- 4321\n- 以上都不是\n## 选择题答案\n- A\n- C\n- D\n- G\n-\
    \ D\n- C\n- C\n## 要点提示\nAnsible 本身使用 Python 编写，但 Ansible 剧本使用 YAML 编写。默认情况下，Ansible\
    \ 使用 SSH 管理主机。Ansible 配置文件的位置和优先级非常重要。command、shell 和 raw 都是用于在远程主机上执行命令的模块；不过\
    \ command 模块不支持环境变量，raw 模块用于远程主机未安装 Python 的场景。\n## 关键术语\n本章使用并定义了以下关键术语：\n- **Ansible\
    \ control**：即 Ansible 控制节点，指安装了 Ansible 的服务器，必须是 Linux 机器。\n- **Ansible manage**：即\
    \ Ansible 管理节点，指通过 Ansible 管理的服务器/设备。\n- **Ansible inventory**：即 Ansible 主机清单，指服务器/设备的列表。\n\
    - **Ansible configuration**：即 Ansible 配置，指修改 Ansible 的默认参数。\n- **Ansible playbook**：即\
    \ Ansible 剧本，指用于特定任务的预构建脚本。\n## 第2章：Ansible 基础\n在开始使用 Ansible 之前，我们先回顾一下上一章学习的内容。我们讨论了\
    \ Ansible 为何是流行的自动化工具，也讲解了 Ansible 的基础设施要求与组件，此外还详细介绍了 Ansible 安装和 YAML 语法。本章将介绍\
    \ Ansible 的实际使用场景，讲解 Ansible 节点及其适用时机，我们会拿实际任务用 Ansible 实现自动化。学完本章后，你将能够用 Ansible\
    \ 自动化处理基础重复性任务。\n### 本章结构\n本章将涵盖以下主题：\n- Ansible 即席模式\n- 即席模式示例\n- Ansible 剧本\n\
    - Ansible 变量\n- Ansible 中的条件语句\n- Ansible 中的循环\n- Ansible 处理器\n- Ansible Vault\n\
    ### 学习目标\n学完本章后，你将能够完成以下操作：\n- 使用 Ansible 即席模式实现自动化\n- 编写 Ansible 剧本实现自动化\n- 理解\
    \ Ansible 用户自定义变量、内置变量及条件语句\n- 理解并使用 Ansible 中不同类型的循环\n- 理解并使用 Ansible 处理器\n-\
    \ 理解并使用 Ansible Vault\n### Ansible 即席模式\nAnsible 即席模式是用于自动化单任务的命令行工具。它快速易用，但不可复用，因为每次使用时都需要提供所需的参数。仅需一条即席命令就能自动化管理数千台服务器，这体现了\
    \ Ansible 的强大能力。Ansible 即席模式的实际使用场景包括管理用户、复制文件、重启服务器、安装或卸载软件包等。所有 Ansible 模块都可以在即席模式下使用，默认模块为\
    \ command 模块。以下是一个即席命令示例：\n``` $ ansible [pattern] -i inventory-file -m [module]\
    \ -a \"[module options]\" ```\n下面我们介绍各个输入项，方便理解。\n### 模式\n模式可以帮助我们从清单文件中筛选特定的主机或组。下表列出了定位清单主机和组的常用模式：\n\
    | groups: | |---------| | groups: | | groups: | | groups: | | groups: | | groups:\
    \ | | groups: | | groups: | | groups: | | groups: | | groups: | | groups: | |\
    \ groups: | | groups: | | groups: | | groups: |\n*表2.1：Ansible 模式*\n掌握基础模式后，你可以按任意顺序组合它们。下面的示例演示了这一点：\n\
    ``` webservers:dbservers:&staging:!phoenix ```\n我们使用通配符模式从清单文件中定位主机，所有匹配通配符的主机都会被选中。通配符模式可用于\
    \ IP 或 FQDN。下面的示例演示了通配符的强大能力：\n``` 192.168.* *.example.com *.com ```\n我们还可以同时混合使用通配符模式和组。下面的示例将演示这一点：\n\
    ``` webservers:dbservers:&staging:!phoenix ```\n此时需要明确一点：如果模式无法匹配清单文件中的任何主机，将显示以下错误：\n\
    ``` [WARNING]: No inventory was parsed, only implicit localhost is available [WARNING]:\
    \ Could not match supplied host pattern, ignoring: *.not_in_inventory.com ```\n\
    ### 清单\n上一章我们已经花了大量时间了解 Ansible 清单的所有相关内容。`-i` 选项用于为 Ansible 即席模式指定清单文件。如果已经在\
    \ Ansible 配置文件中定义了清单文件路径，就无需在此处再次指定。\n### 模块\n上一章我们已经讨论过模块。对于 Ansible 即席模式，`-m`\
    \ 选项用于提供模块名称，`-a` 用于提供模块参数。我们后续会提供大量示例来明确这一点。\n### 即席模式示例\n本节我们将提供多个实用的示例，了解即席模式的强大用处。本章大部分示例可用于任何生产环境。我们来看看这些示例。\n\
    #### 检查主机状态\n上一章我们已经使用过 **ping** 模块。执行该模块时如果主机在线，输出中会返回 **PONG** 消息。以下是 **ping**\
    \ 模块的输出示例：\n``` ansible@master:~/ansible/Chapter-02$ ansible cen_node_01 -i inventory\
    \ -m ping\ncen_node_01 | SUCCESS => {\n    \"ansible_facts\": {\n        \"discovered_interpreter_python\"\
    : \"/usr/bin/python\"\n    },\n    \"changed\": false,\n    \"ping\": \"pong\"\
    \n}\nansible@master:~/ansible/Chapter-02$ ```\n这是在执行其他命令前检查主机是否在线的快速方式。\n####\
    \ 重启服务器\n如前所述，**-m** 选项用于选择模块，**-a** 用于指定模块参数。不过如果没有明确指定任何模块，Ansible 会使用 **COMMAND**\
    \ 模块。目前我们已经完成了 Ansible 环境的搭建，清单文件中包含了被管理主机的详细信息。要重启特定组中的所有服务器，例如我们可以使用以下命令：\n\
    ``` $ ansible centos -i inventory -a \"/sbin/reboot\" ```\n按照 Ansible 配置文件的默认设置，Ansible\
    \ 默认有 5 个并行连接。这意味着如果重启 10 台服务器，Ansible 会先重启 5 台，再重启另外 5 台。该参数可配置，我们既可以在配置文件中修改，也可以通过命令行提供。例如，如果要并行重启\
    \ **20** 台服务器，使用以下命令：\n``` $ ansible centos -i inventory -a \"/sbin/reboot\" -f\
    \ 20 ```\nAnsible 默认以当前用户账户运行。如果要连接为其他用户，例如当前用户没有 **sudo** 权限，可以使用以下命令：\n``` $\
    \ ansible centos -i inventory -a \"/sbin/reboot\" -f 10 -u username ```\n"
