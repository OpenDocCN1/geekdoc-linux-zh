    hands-on. Understating YAML is essential in writing the Ansible playbooks. Ansible
    playbooks are the text/configuration files that are written in a particular format
    called YAML. Therefore, we will spend some time to understand the YAML syntax
    before jumping to the Ansible playbooks.


    All the YAML files can optionally begin with --- and end with This is part of
    the YAML format and indicates the start and end of a document.


    The following are the YAML components:


    The following is the YAML sample list format:


    ```

    ---

    # A list of fruits

    - Apple

    - Orange

    - Banana

    - Mango

    ...

    ```


    The following is the YAML sample dictionary format:'
