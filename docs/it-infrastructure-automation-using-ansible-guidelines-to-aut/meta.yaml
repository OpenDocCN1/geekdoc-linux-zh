  md: '# MANAGE HOSTS WITH SSH CREDENTIAL


    This is the easy-to-use option since we don''t have to do any configuration on
    the manage nodes. This is particularly useful when we are writing playbooks for
    the networking devices like routers and switches.


    If we add the following section in the inventory file, Ansible will use these
    credentials to login to the manage nodes:


    ```

    [all:vars]

