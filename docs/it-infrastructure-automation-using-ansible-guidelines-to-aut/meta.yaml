    # *Role variables*


    The Role variables are defined in these variables have a high priority and cannot
    be overwritten by the inventory variables. The default variables can be defined
    in **defaults/main.yml** and have the lowest precedence. So, we can use the default
    variables only if we intend to have the variable overwritten somewhere else.'
