  md: '# *Managing files*


    Managing files is also a regular process, which most system administrators have
    to go through on a daily basis. Ansible does it beautifully, for example, if you
    have a file and you want to copy it on several servers, a single Ansible ad-hoc
    command will do the job. The following is an example which copies a file to all
    the [centos] machines:


    ```

    $ ansible centos -i inventory -m copy -a "src=/etc/hosts dest=/tmp/hosts"

    ```


    > *Can you feel the power of Ansible?* Suppose we have to copy some files on thousands
    of servers, a single command can do it in Ansible.


    The file module allows changing the ownership and permissions on files. Not only
    can we copy the file, we can also change the permission and the owner details
    on the file. This is very important. Suppose you are automating the file copy
    for some application, and the application users don''t have the administrative
    access, if we just copy the file, file owner will be the automation user, and
    the application will not be able to use the file. However, we can change the file
    permission and automate the complete process. The following commands will be used
    to change permission and owner details:'
  merge: -1
  pgno: 91
- img_proc: true
  md: '```

    $ ansible centos -i inventory -m copy -a "src=/etc/hosts

    dest=/tmp/hosts mode=622"

    ```


    ```

    $ ansible centos -i inventory -m copy -a "src=/etc/hosts

    dest=/tmp/hosts mode=622 owner=app_user group=app_user"

    ```


    File module is not yet over; a file module can also create directories, similar
    to


    ```

    $ ansible centos -i inventory -m copy -a "src=/var/application

    dest=/tmp/application mode=755 owner=app_user group=mapp_user

    state=directory "

    ```


    We can also recursively delete the files from the Ansible managed nodes by using
    the following command:


    ```

    $ ansible centos -i inventory -m copy -a "src=/tmp/application

    state=absent"

    ```'
  merge: -1
