  md: '# Ansible Vault


    The Ansible Vault encrypts the variables and files, so we can protect the sensitive
    content, such as passwords or keys, rather than leaving it visible as plaintext
    in playbooks. To use the Ansible Vault, we need one or more passwords to encrypt
    and decrypt the content.


    Since it is common to store the Ansible configurations in the version control,
    we need a way to store the secrets securely.


    The Ansible Vault is the answer to this. Ansible Vault can encrypt anything inside
    a YAML file, using a password of your choice. A typical use of the Ansible Vault
    is to encrypt the variable files or playbooks. Vault can encrypt any YAML file.
    Let''s see how to use the Ansible Vault.


