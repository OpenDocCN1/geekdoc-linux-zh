  md: '# **Ansible Inventory**


    Ansible works against multiple managed hosts in your infrastructure, at the same
    time, using a list or group of lists known as Once your inventory is defined,
    you can use the patterns to select the hosts or groups that you want Ansible to
    run against.


    The default inventory location is as follows:


    When running the scripts, we can provide our own inventory location. So, if we
    have multiple scripts on different nodes, we can differentiate them with their
    own inventory files.


    We can put the host IP address, hostname, or create groups including the hostname
    or IP address in the inventory file:


    **all** is a special default group which includes all the hosts from the inventory.
    Duplicating hosts in different groups is allowed. Nested grouping is allowed.
    Adding a range of hosts is also allowed, like the following:


    ```

    [db]

    db[01:50].example.com

    ```'
