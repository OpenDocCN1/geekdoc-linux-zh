    ```


    There is a catch; we have to type the password each time we are executing the
    playbook, which is not ideal. There is another option to run the playbook without
    having to type the password, but you have to save the vault password in a clear
    text file, which is still a security risk, since anyone read the file, and also
    modify and run your playbook. We can give that file read-only permission to the
    automation user, so that no one else can read the password. I know it''s not ideal
    but it can do the job easily. The following is the command to run the playbooks
    without requiring the password:


    ```

    $ ansible-playbook learn_ansible.yaml -i inventory --vault-password-file password.txt

    ```


