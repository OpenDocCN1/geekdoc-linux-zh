    - Important concepts about Ansible\n- Basic understanding of YAML\n\n### Objective\n\
    After studying this chapter, you should be able to do the following:\n- Understand\
    \ why Ansible is popular.\n- Install Ansible and set up your environment.\n- Understand\
    \ the Ansible components.\n- Understand the YAML syntax.\n\n### Introduction to\
    \ Ansible\nIf you are a Systems Administrator, Network Administrator, or just\
    \ anybody working in the IT, you were probably involved in doing a lot of repetitive\
    \ tasks in your environment, whether it was to configure thousands of routers\
    \ and switches, create new virtual machines, apply configurations, patch bulk\
    \ of servers, migrations, deploy applications, or even perform security and compliance\
    \ audits. All of these repetitive tasks involve execution of similar commands\
    \ on thousands of different devices, while maintaining the right sequence of events.\
    \ Smart people develop scripts to automate these tasks, but it requires coding\
    \ skills; regular IT administrators don't have the professional coding skills,\
    \ and an IT developer with good coding skills don't have the strong infrastructure\
    \ knowledge. Hence, there is a gap which Ansible leverages. Ansible is a powerful\
    \ IT automation tool that you can quickly learn. It's simple enough for everyone\
    \ in IT, yet powerful enough to automate even the most complex deployments.\n\n\
    The following are some products related to Ansible:\n- **Ansible**：An open-source\
    \ automation platform.\n- **Ansible Galaxy**：A website with a large catalogue\
    \ of community created roles.\n- **Ansible Tower**：A web application and REST\
    \ API solution for Ansible.\n\nThe main focus of the book is the Ansible core.\
    \ The following are some of the Ansible use cases:\n- Configuration management\n\
    - Deployment\n- Orchestration\n- Provisioning\n\nLet's explore the use cases with\
    \ examples. Imagine you have a number of servers in your environment that you\
    \ would like to patch and restart in a particular order. Some of them are application\
    \ servers and the others are database servers. So, first you would patch the servers,\
    \ and power down the application servers, followed by the database servers, then\
    \ power up the database servers, and once the database is online, then power up\
    \ the application servers. You could write an Ansible playbook to get this done\
    \ in a matter of minutes and simply invoke the Ansible playbook every time you\
    \ wish to perform this patching activity.\n\nSimilarly, if you have to enable\
    \ the port security on all the switches in the network, which is a repetitive\
    \ work across the network, and if this needs to be performed on thousands of switches,\
    \ a simple Ansible playbook can achieve this task. Let's take a look at a complex\
    \ example. Let's suppose, we are setting up a complex infrastructure that spans\
    \ across public and private cloud and hundreds of VMs. With Ansible, you could\
    \ provision the hosts on public clouds like Azure or AWS and provision private\
    \ cloud like OpenStack or in VMware based infrastructure and move onto configuring\
    \ the applications on those systems and set up communications between them. There\
    \ are a lot of built-in modules available in Ansible that support these kinds\
    \ of operations and many more. We will be exploring them in the following chapters.\
    \ The following block diagram will clarify the Ansible key components:"
