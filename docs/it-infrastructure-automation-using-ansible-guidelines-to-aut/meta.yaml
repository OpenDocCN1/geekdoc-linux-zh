  - "[PAGE 154]\n\n# Tags\n\nTags are also an import part of the complex playbooks.\
    \ Tags are used at a resource level to give a name to a specific resource. The\
    \ --tags are used with the Ansible playbook to run only the resources with a specific\
    \ tag. When a task file is included in a playbook, it can be tagged in the **include**\
    \ statement. When tagging a role or inclusion, the tag applies to everything in\
    \ the role or in the inclusion. To run a playbook with a specific tag, use the\
    \ command **Ansible-playbook --tags** This command will only run the resources\
    \ which matches the We can also use - - - **skip-tags** 'tagname' to exclude a\
    \ resource with a specific tag. We have a special tag named which can be used\
    \ to make sure that resource is always executed, unless specifically excluded\
    \ with - - - When the -- **- tag** option is used to run a playbook, it can take\
    \ up to three specific tags as an argument. **all** is another the default tag,\
    \ which will run all the tasks; it is the default behavior of Ansible. An alternative\
    \ of tags is creating multiple playbooks. If you want to create a single big playbook\
    \ and segregate it based on tags, then use tags, otherwise create multiple playbooks.\
    \ The following example will explain how to use the tags:\n\n```\n---\n- name:\
    \ Understand Ansible Tags\n  hosts: centos\n  tasks:\n\n  - name: Install network\
    \ Analysis Packages\n```"
