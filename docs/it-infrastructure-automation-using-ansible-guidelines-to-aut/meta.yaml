  - '[PAGE 153]


    # *Handler*


    Handler is also an important concept in task control. We have already discussed
    the handler in the previous chapter. However, I will just state its properties
    for a recap. A Handler is a conditional task that only runs after being called
    by another task. It has a globally unique name and is triggered after all the
    tasks in the playbook. A Handler can be triggered by one or more tasks in a playbook.
    The Handler properties are the same as any task. To trigger a handler, the playbook
    must have a notifying item, which will call the name of the handler. More than
    one handler can be called from a task. A Handler always runs in the order in which
    the handler section is written, not in the order in which they are called in the
    plays. A Handler cannot be included in the playbook; they must be part of the
    playbook. We haven''t discussed, *include* so far, but once we discuss, the **roles**
    and **include** statement later in this chapter, this point will be cleared.'
- md: "## Tags\nTags are also an important part of the complex playbooks. Tags are\
    \ used at a resource level to give a name to a specific resource. The --tags option\
    \ is used with the Ansible playbook to run only the resources with a specific\
    \ tag. When a task file is included in a playbook, it can be tagged in the **include**\
    \ statement. When tagging a role or inclusion, the tag applies to everything in\
    \ the role or in the inclusion.\n\nTo run a playbook with a specific tag, use\
    \ the command `ansible-playbook --tags <tagname>`. This command will only run\
    \ the resources which match the specified tag. We can also use **--skip-tags**\
    \ 'tagname' to exclude a resource with a specific tag. We have a special tag named\
    \ **always** which can be used to make sure that resource is always executed,\
    \ unless specifically excluded with --skip-tags.\n\nWhen the --tags option is\
    \ used to run a playbook, it can take up to three specific tags as an argument.\
    \ **all** is another default tag, which will run all the tasks; it is the default\
    \ behavior of Ansible. An alternative to tags is creating multiple playbooks.\
    \ If you want to create a single big playbook and segregate it based on tags,\
    \ then use tags; otherwise, create multiple playbooks.\n\nThe following example\
    \ will explain how to use the tags:\n```yaml\n---\n- name: Understand Ansible\
    \ Tags\n  hosts: centos\n  tasks:\n    - name: Install network Analysis Packages\n\
    \      package:\n        name: \"{{ item }}\"\n        state: installed\n    \
    \  with_items:\n        - nmap\n        - wireshark\n      tags:\n        - network_analysis\n\
    \n    - name: Install lamp packages\n      package:\n        name: \"{{ item }}\"\
    \n        state: installed\n      with_items:\n        - httpd\n        - mariadb-server\n\
    \      tags:\n        - lamp\n```\nIn this example, if we want only the network\
    \ analysis packages to be installed, then we have to use the following command:\n\
    ```bash\n$ ansible-playbook ansible_tags.yml -i inventory --tags network_analysis\n\
    ```\nSimilarly, if we want to install only the **lamp** packages, the following\
    \ command will be used:\n```bash\n$ ansible-playbook ansible_tags.yml -i inventory\
    \ --tags lamp\n```\n\n### Dealing with errors\nThe Ansible default behavior is\
    \ to stop the execution when the task has failed. We have already discussed in\
    \ the previous chapter that we can use **ignore_errors: yes** and it will ignore\
    \ the error and the playbook will continue running. When we are dealing with handlers,\
    \ if a play fails, no handler will be executed. To overcome this issue, we can\
    \ use **force_handler: yes** in a playbook.\n\nThere is another interesting option\
    \ called **failed_when** to define when to consider a specific command failed.\
    \ This is useful for the commands that are producing a specific output. Let's\
    \ see the following sample for our understanding:\n```yaml\ntasks:\n  - shell:\
    \ /usr/local/bin/mkusr.sh\n    register: mkusr_result\n    failed_when: \"'password\
    \ missing' in mkusr_result.stdout\"\n```\nIn the preceding example, the task is\
    \ considered as failed only if the \"password missing\" string is found in the\
    \ registered variable. If a module thinks it has changed the state of the affected\
    \ machine, it will report the status as **changed**. If this is not the desired\
    \ option and you want to tweak this parameter, then the **changed_when=false**\
    \ option will do it.\n\n### Blocks\nBlocks are used to logically group tasks.\
    \ Blocks are useful for error handling and **when** statements. One statement\
    \ can be applied to the block, so that it affects all the tasks in the block.\
    \ The following example will explain how to use blocks in playbooks:\n```yaml\n\
    ---\n- name: Understand Blocks\n  hosts: all\n  tasks:\n    - name: Installing\
    \ Apache\n      block:\n        - package:\n            name: \"{{ item }}\"\n\
    \            state: installed\n          with_items:\n            - httpd\n  \
    \          - elinks\n            - mod_ssl\n        - service:\n            name:\
    \ httpd\n            state: started\n            enable: true\n      when: ansible_distribution\
    \ == 'CentOS'\n```\n\n## Output\nThe following is part of the playbook output:\n\
    ```bash\nskipping: [ubu_node_o1] => (item=httpd)\nskipping: [ubu_node_o1] => (item=elinks)\n\
    skipping: [ubu_node_o1] => (item=mod_ssl)\nskipping: [ubu_node_o2] => (item=httpd)\n\
    skipping: [ubu_node_o2] => (item=elinks)\nskipping: [ubu_node_o2] => (item=mod_ssl)\n\
    changed: [cen_node_o2] => (item=httpd)\nchanged: [cen_node_o1] => (item=httpd)\n\
    changed: [cen_node_o2] => (item=elinks)\nchanged: [cen_node_o1] => (item=elinks)\n\
    changed: [cen_node_o2] => (item=mod_ssl)\nchanged: [cen_node_o1] => (item=mod_ssl)\n\
    ```\nIn the above example, we used the **when** statement at the block level,\
    \ which makes sure that installation only happens on CentOS hosts and skips the\
    \ Ubuntu machines. Blocks allow error handling; if a task fails, the task in the\
    \ rescue block can be executed for recovery. We also have an **always** task,\
    \ which will run regardless of success or failure of the task defined in blocks\
    \ or rescue.\n\nLet's take the following example to understand the **rescue**\
    \ and **always** keywords in blocks:\n```yaml\n---\n- name: Error handling in\
    \ Blocks\n  hosts: all\n  tasks:\n    - block:\n        - name: Upgrading Database\n\
    \          shell:\n            cmd: /opt/db_scripts/upgrade-database\n      rescue:\n\
    \        - name: Revert If Upgrade failure happens\n          shell:\n       \
    \     cmd: /opt/db_scripts/revert-database\n      always:\n        - name: Restart\
    \ the database\n          service:\n            name: mariadb\n            state:\
    \ restarted\n```\nIn this example, the Ansible block option will upgrade the database.\
    \ If the upgrade script executed properly, the **rescue** block will be ignored\
    \ and the **always** block will be executed. In case the upgrade script failed,\
    \ the **rescue** block will be executed, which will revert all the database changes;\
    \ once it's done, the **always** block will restart the database. So, either **block**\
    \ or rescue will be executed at any time, but the **always** block will execute\
    \ in any case.\n\n## Ansible file separation\nWe will now be talking about file\
    \ separation. So far, we've been defining the variables in the same inventory\
    \ file. However, this is not the best practice. It is better to define these in\
    \ a separate variable file. To do this, first create a **host_vars** directory\
    \ next to the playbook and then create a file with the same name as that of the\
    \ server, which, in this case, is **cen_node_o2.yml**. If you remember when we\
    \ deployed the lab in [*Chapter 1 Up and Running with*](Chapter 1 Up and Running\
    \ with), we can configure the credentials in the inventory file by using the Ansible\
    \ variables. We will move the variables and their values from the inventory file\
    \ into this new file. Remember to remove the `=` sign and change it to a colon\
    \ followed by a space; this is because this new file is in a YAML format.\n\n\
    When the Ansible playbook is executed, Ansible automatically reads the values\
    \ from this file, and associates them with the host. So, it's important to name\
    \ the file with the same name as that of the server, and also, it's important\
    \ to name the folder correctly because that's the folder that Ansible looks for\
    \ to find out whether there is a variable file for that particular server. For\
    \ the host variables, the folder must be named **host_vars** and the group variables\
    \ must be named **group_vars**; you could have a file for each group inside this\
    \ folder.\n\nThe following are the changes which we have made on our lab:\n```ini\n\
    # cat inventory\n[centos]\ncen_node_01\ncen_node_02\n\n[ubuntu]\nubu_node_01\n\
    ubu_node_02\n```\n```bash\n$ tree\n.\n├── ansible.cfg\n├── host_vars\n│   ├──\
    \ cen_node_02.yml\n│   └── ubu_node_02.yml\n└── inventory\n\n1 directory, 4 files\n\
    ```\n```yaml\n# cat host_vars/cen_node_02.yml\nansible_host: 10.0.0.11\nansible_user:\
    \ admin1\nansible_password: Pass321\n\n# cat host_vars/ubu_node_02.yml\nansible_host:\
    \ 10.0.0.21\nansible_user: admin1\nansible_password: Pass321\n$\n```\n\n## Ansible\
    \ Output\n```bash\n$ ansible all -i inventory -a \"whoami\"\n\ncen_node_01 | CHANGED\
    \ | rc=0 >> ansible\ncen_node_02 | CHANGED | rc=0 >> admin1\nubu_node_01 | CHANGED\
    \ | rc=0 >> ansible\nubu_node_02 | CHANGED | rc=0 >> admin1\n$\n```\n\n## Ansible\
    \ include statement\nLet's understand the **include** statement with an example;\
    \ suppose we have a playbook with two sets of tasks – one to install and configure\
    \ the database, and the other to install and configure the web server. *What if\
    \ we need to reuse these tasks in different playbooks where the requirement may\
    \ be to only install the database or to only install the web server?* So, we first\
    \ create two files under a folder, naming them **deploy_db.yml** and **deploy_web.yml**;\
    \ move the db tasks into the first one and the web tasks into the second one.\
    \ Once we're done, we can add the **include** statements under the task in our\
    \ playbook to include the task from these external files:"
  mdcn: "\n## 标签\n标签也是复杂剧本的重要组成部分。标签在资源层级使用，用于给特定资源命名。`--tags` 选项可配合 Ansible 剧本使用，仅运行带有特定标签的资源。当任务文件被包含到剧本中时，可以在\
    \ **包含** 语句中为其打标签。为角色或包含项打标签时，该标签会作用于角色或包含项的所有内容。要运行带有特定标签的剧本，请使用命令 `ansible-playbook\
    \ --tags <tagname>`。该命令仅会运行与指定标签匹配的资源。我们还可以使用 **--跳过标签** 'tagname' 来排除带有特定标签的资源。我们有一个名为\
    \ **始终执行** 的特殊标签，用于确保资源始终执行，除非通过 --跳过标签 明确排除。使用 --tags 选项运行剧本时，最多可以传入三个特定标签作为参数。**全部**\
    \ 是另一个默认标签，会运行所有任务；这也是 Ansible 的默认行为。标签的替代方案是创建多个剧本。如果你想创建单个大剧本并基于标签拆分，就使用标签；否则就创建多个剧本。下面的示例将说明如何使用标签：\n\
    ```yaml\n---\n- name: Understand Ansible Tags\n  hosts: centos\n  tasks:\n  -\
    \ name: Install network Analysis Packages\n    package:\n      name: \"{{ item\
    \ }}\"\n      state: installed\n    with_items:\n      - nmap\n      - wireshark\n\
    \    tags:\n      - network_analysis\n  - name: Install lamp packages\n    package:\n\
    \      name: \"{{ item }}\"\n      state: installed\n    with_items:\n      -\
    \ httpd\n      - mariadb-server\n    tags:\n      - lamp\n```\n在本示例中，如果我们只想安装网络分析工具包，就需要使用以下命令：\n\
    ```bash\n$ ansible-playbook ansible_tags.yml -i inventory --tags network_analysis\n\
    ```\n同理，如果我们只想安装 **LAMP** 工具包，需要使用以下命令：\n```bash\n$ ansible-playbook ansible_tags.yml\
    \ -i inventory --tags lamp\n```\n\n### 处理错误\nAnsible 的默认行为是任务失败时停止执行。我们已经在上一章讨论过，可以使用\
    \ **忽略错误: 是**，该选项会忽略错误，让剧本继续运行。处理处理器时，如果某个 play 失败，不会有任何处理器被执行。要解决这个问题，可以在剧本中使用\
    \ **强制处理器: 是**。还有一个有趣的选项叫 **失败时判断条件**，用于定义何时判定某个特定命令执行失败。该选项对会产生特定输出的命令非常有用。参考以下样本来理解：\n\
    ```yaml\ntasks:\n- shell: /usr/local/bin/mkusr.sh\n  register: mkusr_result\n\
    \  failed_when: \"'password missing' in mkusr_result.stdout\"\n```\n在上面的示例中，仅在注册变量中找到\
    \ \"password missing\" 字符串时，才会判定该任务执行失败。如果某个模块认为自己更改了目标机器的状态，就会将状态报告为 **已更改**。如果这不是你想要的效果，希望调整该参数，可以使用\
    \ **更改时判断条件=false** 选项实现。\n\n### 代码块\n代码块用于对任务进行逻辑分组，可用于错误处理和 **条件** 语句。可以对代码块应用一条语句，从而影响代码块内的所有任务。下面的示例将说明如何在剧本中使用代码块：\n\
    ```yaml\n---\n- name: Understand Blocks\n  hosts: all\n  tasks:\n  - name: Installing\
    \ Apache\n    block:\n    - package:\n        name: \"{{ item }}\"\n        state:\
    \ installed\n      with_items:\n        - httpd\n        - elinks\n        - mod_ssl\n\
    \    - service:\n        name: httpd\n        state: started\n        enable:\
    \ true\n    when: ansible_distribution == 'CentOS'\n```\n\n## 输出\n以下是部分剧本输出：\n\
    ```bash\nskipping: [ubu_node_o1] => (item=httpd)\nskipping: [ubu_node_o1] => (item=elinks)\n\
    skipping: [ubu_node_o1] => (item=mod_ssl)\nskipping: [ubu_node_o2] => (item=httpd)\n\
    skipping: [ubu_node_o2] => (item=elinks)\nskipping: [ubu_node_o2] => (item=mod_ssl)\n\
    changed: [cen_node_o2] => (item=httpd)\nchanged: [cen_node_o1] => (item=httpd)\n\
    changed: [cen_node_o2] => (item=elinks)\nchanged: [cen_node_o1] => (item=elinks)\n\
    changed: [cen_node_o2] => (item=mod_ssl)\nchanged: [cen_node_o1] => (item=mod_ssl)\n\
    ```\n在上面的示例中，我们在代码块层级使用了 **条件** 语句，确保仅在 CentOS 主机上执行安装，跳过 Ubuntu 主机。代码块支持错误处理；如果某个任务失败，就会执行\
    \ rescue 代码块中的任务进行恢复。我们还有 **始终执行** 任务，无论代码块或 rescue 块中定义的任务成功还是失败，该任务都会运行。参考以下示例，了解代码块中的\
    \ **恢复** 和 **始终执行** 关键字：\n```yaml\n---\n- name: Error handling in Blocks\n  hosts:\
    \ all\n  tasks:\n  - block:\n    - name: Upgrading Database\n      shell:\n  \
    \      cmd: /opt/db_scripts/upgrade-database\n    rescue:\n    - name: Revert\
    \ If Upgrade failure happens\n      shell:\n        cmd: /opt/db_scripts/revert-database\n\
    \    always:\n    - name: Restart the database\n      service:\n        name:\
    \ mariadb\n        state: restarted\n```\n在本示例中，Ansible 的 block 选项会升级数据库。如果升级脚本执行正常，就会跳过\
    \ **恢复** 块，执行 **始终执行** 块。如果升级脚本执行失败，就会执行 **恢复** 块，撤销所有数据库更改；执行完成后，**始终执行** 块会重启数据库。因此，任意时刻只会执行\
    \ **代码块** 或 **恢复** 块其中之一，但 **始终执行** 块无论如何都会执行。\n\n## Ansible 文件拆分\n接下来介绍文件拆分。到目前为止，我们一直在同一个清单文件中定义变量，但这并不是最佳实践。最好将这些变量定义在单独的变量文件中。要完成这一步，首先需要在剧本旁创建\
    \ **host_vars** 目录，然后创建一个与服务器同名的文件，本场景中该文件为 **cen_node_o2.yml**。如果你还记得我们在 [*第1章\
    \ 快速入门*](Chapter 1 Up and Running with) 中部署实验环境的内容，就可以通过 Ansible 变量在清单文件中配置凭据。我们会将变量及其值从清单文件移动到这个新文件中。注意要删除\
    \ `=` 符号，替换为冒号加一个空格；这是因为新文件采用 YAML 格式。执行 Ansible 剧本时，Ansible 会自动读取该文件中的值，并将其关联到对应主机。因此，文件和服务器同名非常重要，同时文件夹的命名也必须正确，因为\
    \ Ansible 会通过该文件夹查找特定主机是否有对应的变量文件。对于主机变量，文件夹必须命名为 **host_vars**，组变量文件夹必须命名为 **group_vars**；可以在该文件夹中为每个组创建一个单独的文件。以下是我们对实验环境做的修改：\n\
    ```ini\n# cat inventory\n[centos]\ncen_node_01\ncen_node_02\n\n[ubuntu]\nubu_node_01\n\
    ubu_node_02\n```\n```bash\n$ tree .\n├── ansible.cfg\n├── host_vars\n│   ├── cen_node_02.yml\n\
    │   └── ubu_node_02.yml\n└── inventory\n\n1 directory, 4 files\n```\n```yaml\n\
    # cat host_vars/cen_node_o2.yml\nansible_host: 10.0.0.11\nansible_user: admin1\n\
    ansible_password: Pass321\n# cat host_vars/ubu_node_o2.yml\nansible_host: 10.0.0.21\n\
    ansible_user: admin1\nansible_password: Pass321\n$\n```\n\n## Ansible 输出\n以下是部分剧本输出：\n\
    ```bash\n$ ansible all -i inventory -a \"whoami\"\ncen_node_01 | CHANGED | rc=0\
    \ >> ansible\ncen_node_02 | CHANGED | rc=0 >> admin1\nubu_node_01 | CHANGED |\
    \ rc=0 >> ansible\nubu_node_02 | CHANGED | rc=0 >> admin1\n$\n```\n\n## Ansible\
    \ 包含语句\n我们通过示例来理解 **包含** 语句：假设我们有一个剧本，包含两组任务——一组用于安装和配置数据库，另一组用于安装和配置 Web 服务器。*如果我们需要在不同剧本中复用这些任务，而需求可能是仅安装数据库或仅安装\
    \ Web 服务器，该怎么办？* 因此，我们首先在一个文件夹下创建两个文件，分别命名为 **deploy_db.yml** 和 **deploy_web.yml**；将数据库任务移动到第一个文件中，Web\
    \ 任务移动到第二个文件中。完成后，我们就可以在剧本的任务下添加 **包含** 语句，引入这些外部文件中的任务：\n"
