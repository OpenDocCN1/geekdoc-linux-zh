  md: '# *Managing_packages*


    Installing or unstalling packages can also be done with the Ansible ad-hoc. Ansible
    has several package management modules which can be used for managing packages.
    For the Debian and Red Hat operating systems, **yum** and **apt** are the most
    famous modules. The following is the syntax to install using both the modules:


    ```

    $ ansible centos -m yum -a "name=httpd state=present"

    $ ansible ubuntu -m apt -a "name=apache2 state=present"

    ```


    The inputs are the same for both the **yum** and the **apt** modules. Therefore,
    we will only use one of them in the following examples.


    We can also force Ansible to only install a specific version by using the following
    command:


    ```

    $ ansible centos -m yum -a "name= httpd-2.2.26 state=present"

    ```


    To ensure that a latest version of package is installed, we can use the following
    command:


    ```

    $ ansible centos -m yum -a "name=httpd state=latest"

    ```'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'We can also uninstall a package or ensure that a specific package is not installed
    on the Ansible managed nodes. The following command will do it:


    ```

    $ ansible centos -m yum -a "name=httpd state=absent"

    ```


    Ansible has modules for almost all the package managers. If you are using some
    legacy or outdated system whose Ansible module is not available, then the Ansible
    command module can be used to install the packages. Moreover, if you are good
    with Python, you can write your own package manager.'
