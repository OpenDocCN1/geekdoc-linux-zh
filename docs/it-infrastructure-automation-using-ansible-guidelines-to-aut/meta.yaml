    # REBOOTING SERVERS


    As we discussed earlier, the **-m** option is for selecting the module and **-a**
    is for the module parameter. However, if we don''t specifically mention any module,
    Ansible will use the **COMMAND** module. At this point, we have the Ansible setup
    ready and the inventory file has managed host details. To reboot all the servers
    in a specific group, for example we will be using the following example:


    ```

    $ ansible centos -i inventory -a "/sbin/reboot"

    ```


    As per the Ansible configuration file, by default, Ansible has five parallel connections.
    Which means, if we reboot ten servers, Ansible will reboot five servers and then
    the other five servers. This is a configurable parameter, we can either change
    it in the configuration file or provide it via the command-line. For example,
    if we want to reboot **20** servers in parallel, the following command will be
    used:


    ```

    $ ansible centos -i inventory -a "/sbin/reboot" -f 20

    ```


    **Ansible** will by default to run from current user account. To connect from
    a different user. For example, current user doesn''t have **sudo** access, we
    can use the following command:


    ```

    $ ansible centos -i inventory -a "/sbin/reboot" -f 10 -u username

    ```'
- md: "## Working with host environmental variable\n\nAs we know, only the administrator\
    \ has the rights to reboot any particular server, therefore, we will be requiring\
    \ privilege escalation to reboot the servers. For privilege escalation, the following\
    \ commands will be used:\n\n```\n$ ansible centos -i inventory -a \"/sbin/reboot\"\
    \ -f 10 -u username --become [--ask-become-pass]\n```\n\nIf you add **--ask-become-pass**\
    \ or Ansible prompts you for the password to use for privilege escalation.\n\n\
    So far, all our examples have used the default command module which doesn't support\
    \ the environment variable. We already discussed this in [Chapter 1: Up and Running\
    \ with](#).\n\nHere we have an example to elaborate it better. To use a different\
    \ module, pass **-m** for the module name. For example, to use the shell module,\
    \ the following command will be used:\n\n```\n$ ansible centos  -i inventory -m\
    \ shell -a 'echo $HOME'\ncen_node_01 | CHANGED | rc=0 >>\n/home/ansible\ncen_node_02\
    \ | CHANGED | rc=0 >>\n/home/admin1\nansible@master:~/ansible/Chapter-02$\n```\n\
    \n## Managing files\n\nManaging files is also a regular process, which most system\
    \ administrators have to go through on a daily basis. Ansible does it beautifully,\
    \ for example, if you have a file and you want to copy it on several servers,\
    \ a single Ansible ad-hoc command will do the job. The following is an example\
    \ which copies a file to all the [centos] machines:\n\n```\n$ ansible centos -i\
    \ inventory -m copy -a \"src=/etc/hosts dest=/tmp/hosts\"\n```\n\n> *Can you feel\
    \ the power of Ansible?* Suppose we have to copy some files on thousands of servers,\
    \ a single command can do it in Ansible.\n\nThe file module allows changing the\
    \ ownership and permissions on files. Not only can we copy the file, we can also\
    \ change the permission and the owner details on the file. This is very important.\
    \ Suppose you are automating the file copy for some application, and the application\
    \ users don't have the administrative access, if we just copy the file, file owner\
    \ will be the automation user, and the application will not be able to use the\
    \ file. However, we can change the file permission and automate the complete process.\
    \ The following commands will be used to change permission and owner details:\n\
    \n```\n$ ansible centos -i inventory -m copy -a \"src=/etc/hosts dest=/tmp/hosts\
    \ mode=622\"\n```\n\n```\n$ ansible centos -i inventory -m copy -a \"src=/etc/hosts\
    \ dest=/tmp/hosts mode=622 owner=app_user group=app_user\"\n```\n\nFile module\
    \ is not yet over; a file module can also create directories, similar to\n\n```\n\
    $ ansible centos -i inventory -m copy -a \"src=/var/application dest=/tmp/application\
    \ mode=755 owner=app_user group=mapp_user state=directory\"\n```\n\nWe can also\
    \ recursively delete the files from the Ansible managed nodes by using the following\
    \ command:\n\n```\n$ ansible centos -i inventory -m copy -a \"src=/tmp/application\
    \ state=absent\"\n```\n\n## Managing packages\n\nInstalling or uninstalling packages\
    \ can also be done with the Ansible ad-hoc. Ansible has several package management\
    \ modules which can be used for managing packages. For the Debian and Red Hat\
    \ operating systems, **yum** and **apt** are the most famous modules. The following\
    \ is the syntax to install using both the modules:\n\n```\n$ ansible centos -m\
    \ yum -a \"name=httpd state=present\"\n$ ansible ubuntu -m apt -a \"name=apache2\
    \ state=present\"\n```\n\nThe inputs are the same for both the **yum** and the\
    \ **apt** modules. Therefore, we will only use one of them in the following examples.\n\
    \nWe can also force Ansible to only install a specific version by using the following\
    \ command:\n\n```\n$ ansible centos -m yum -a \"name= httpd-2.2.26 state=present\"\
    \n```\n\nTo ensure that a latest version of package is installed, we can use the\
    \ following command:\n\n```\n$ ansible centos -m yum -a \"name=httpd state=latest\"\
    \n```\n\nWe can also uninstall a package or ensure that a specific package is\
    \ not installed on the Ansible managed nodes. The following command will do it:\n\
    \n```\n$ ansible centos -m yum -a \"name=httpd state=absent\"\n```\n\nAnsible\
    \ has modules for almost all the package managers. If you are using some legacy\
    \ or outdated system whose Ansible module is not available, then the Ansible command\
    \ module can be used to install the packages. Moreover, if you are good with Python,\
    \ you can write your own package manager.\n\n## Managing users and groups\n\n\
    The Ansible ad-hoc mode is also useful to create, remove, and manage the user\
    \ accounts. The following ad-hoc command will be used to create the user:\n\n\
    ```\n$ ansible centos -i inventory -m user -a \"name=alex password=password here\"\
    \n```\n\nSimilarly, we can remove a user by using the following command:\n\n```\n\
    $ ansible centos -i inventory -m user -a \"name=alex state=absent\"\n```\n\n##\
    \ Managing services\n\nWe can use the service module to start and stop the services\
    \ on the Ansible managed nodes. The following examples will start, stop, and restart\
    \ the HTTP service on the CentOS machines respectively:\n\n```\n$ ansible centos\
    \ -i inventory -m user -a \"name=httpd state=started\"\n```\n\n```\n$ ansible\
    \ centos -i inventory -m user -a \"name=httpd state=stopped\"\n```\n\n```\n$ ansible\
    \ centos -i inventory -m user -a \"name=httpd state=restarted\"\n```\n\n## Gathering\
    \ facts\n\nFact gathering is another useful feature of Ansible. It collects the\
    \ managed nodes' information and stores them in variables. This variable can be\
    \ used to write flexible and complex automation task. The following simple command\
    \ can be used to get all the variables on managed nodes:\n\n```\n$ ansible centos\
    \ -i inventory -m setup\n```\n\nThe preceding command will provide a lot of information,\
    \ but this information will be on Ansible console, which is not the right place\
    \ to go through such a large amount of data. So, we can use the following command\
    \ to store all the facts in a file:\n\n```\n$ ansible centos -i inventory -m setup\
    \ --tree /tmp/facts\n```\n\nThe beauty of the command is that it will create different\
    \ files for each managed host, name it with the hostname, and save it on the provided\
    \ directory.\n\nThe preceding command is helpful to understand the overall variables,\
    \ but when you are looking for specific variables, for example to display only\
    \ facts regarding memory, we can use the following command:\n\n```\n$ ansible\
    \ centos -i inventory -m setup -a 'filter=ansible_*_mb'\n```\n\nTo display only\
    \ the facts about certain interfaces, use the following command:\n\n```\n$ ansible\
    \ centos -i inventory -m setup -a 'filter=ansible_eth[0-2]'\n```\n\nWe will be\
    \ discussing the facts later in this chapter and use them in writing playbooks.\
    \ At this point, you should get an idea about the Ansible ad-hoc mode.\n\n## Ansible\
    \ playbooks\n\nThe Ansible ad-hoc mode is great for doing individual tasks; however,\
    \ people mostly prefer the playbook because it allows them to execute multiples\
    \ task, use variables, conditional statements, and much more. Normally, when we\
    \ automate some activity, it's not a single task but a series of tasks. The Ansible\
    \ playbook allows us to organise all those tasks in an easy-to-understand language\
    \ called YAML. We have already seen the basics of Ansible in the previous chapter.\
    \ Let's take a very simple task and try to understand how playbooks are written.\
    \ Let's execute two Linux commands **-a** and in the following example.\n\nThe\
    \ following is the example for the Ansible playbook:\n\n```\n---\n- hosts: centos\n\
    \  tasks:\n  - name: Execute uname\n    shell: uname -a>/tmp/ansible_output.txt\n\
    \n  - name: Execute Whoami\n    shell: whoami  >>/tmp/ansible_output.txt\n```\n\
    \n### Explanations\n\nLet's add the line number and understand how playbooks are\
    \ written. Let me repeat again, the number of spaces are extremely important in\
    \ the YAML format:\n\n```\n1 ---\n2\n3 - hosts: centos\n4   tasks:\n5     - name:\
    \ Execute a uname command on Linux\n6       shell: uname -a>/tmp/ansible_output.txt\n\
    7\n8     - name: Execute Whoami Command on Linux\n9       shell: whoami  >>/tmp/ansible_output.txt\n\
    ```\n\n### Important points\n\nThe following are the important points when writing\
    \ the Ansible playbooks; go through them a couple of times until you know them\
    \ all:\n\n- Playbook starts with three hyphens\n- Line 3 has one space after hyphen\
    \ and one space after colon\n- Line 4 has two spaces before tasks."
