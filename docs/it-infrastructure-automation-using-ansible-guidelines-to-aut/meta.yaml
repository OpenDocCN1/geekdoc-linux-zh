  - '[PAGE 97]


    # *Gathering facts*


    Fact gathering is another useful feature of Ansible. It collects the managed nodes''
    information and stores them in variables. This variable can be used to write flexible
    and complex automation task. The following simple command can be used to get all
    the variables on managed nodes:


    ```

    $ ansible centos -i inventory -m setup

    ```


    The preceding command will provide a lot of information, but this information
    will be on Ansible console, which is not the right place to go through such a
    large amount of data. So, we can use the following command to store all the facts
    in a file:


    ```

    $ ansible centos -i inventory -m setup --tree /tmp/facts

    ```


    The beauty of the command is that it will create different files for each managed
    host, name it with the hostname, and save it on the provided directory.


    The preceding command is helpful to understand the overall variables, but when
    you are looking for specific variables, for example to display only facts regarding
    memory, we can use the following command:'
  - '[PAGE 98]


    ```

    $ ansible centos -i inventory -m setup -a ''filter=ansible_*_mb''

    ```


    To display only the facts about certain interfaces, use the following command:


    ```

    $ ansible centos -i inventory -m setup -a ''filter=ansible_eth[0-2]''

    ```


    We will be discussing the facts later in this chapter and use them in writing
    playbooks. At this point, you should get an idea about the Ansible ad-hoc mode.'
