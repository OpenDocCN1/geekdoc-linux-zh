  md: "# Ansible_handler\n\nHandlers are just like the normal tasks in an Ansible\
    \ playbook, but it will run when called by another task that contains a **notify**\
    \ directive. A Handler is useful for the secondary actions that might be required\
    \ after running a task, such as starting a service after the installation or configuration\
    \ change. The following example will show how the Ansible handlers are used:\n\
    \n```\n---\n\n- hosts: ubu_node_01\n  become: true\n  tasks:\n  - name: Install\
    \ Package\n    apt: name=apache2 state=present\n    notify:\n    - Start apache2\n\
    \nhandlers:\n- name: Start apache2\n  service: name=apache2 state=started\n```\n\
    \nLet's see the following sample to understand the key features of handlers:\n\
    \n# Tasks"
