    \nAnsible is a simple open-source engine which automates the application deployment,\
    \ infrastructure service orchestration, cloud provisioning, and many other IT\
    \ tools. Ansible is completely agentless, which means that it works by connecting\
    \ your nodes through SSH. Most of the current technologies use SSH as a default\
    \ administration tool, whether it is a public or a private cloud platform, networking\
    \ equipment, or a locally hosted ESX, Windows, or Linux servers. Henceforth, Ansible\
    \ has a diverse scope. Moreover, if you want the other methods for a remote connection\
