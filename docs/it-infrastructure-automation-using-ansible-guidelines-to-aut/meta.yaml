    I have highlighted the most famous Ansible modules. Once we get the name of the
    module for our infrastructure, we can use the following command to get more details
    on the plugin:

    ```

    $ ansible-doc -t inventory <plugin_name>

    ```


    To use the Ansible plugin, we have to enable it, in where we have the **enable_plugins**
    parameter for this purpose. The following are the default list of enabled plugins
    that ships with Ansible:

    ```

    [inventory]

    enable_plugins = host_list, script, auto, yaml, ini, toml

    ```

    If the plugin is from a collection, then we need to use the fully qualified name:

    ```

    [inventory]

    enable_plugins = namespace.collection_name.inventory_plugin_name

    ```


    For example, if we want to enable **aws_ec2** plugin, then we have to add the
    following line in the inventory file:

    ```

    # demo.aws_ec2.yml

    plugin: amazon.aws.aws_ec2

    ```


    We will be using the dynamic inventory in the following chapters, when we discuss
    the cloud administration with Ansible.


    # Ansible Filters


    When writing playbooks in Ansible, we need data manipulation, processing, and
    formatting, since the output of one task may be used as the input for another
    task. For example, if we are writing a playbook for the network and the first
    task is to check the default route, then use the Ansible filters to get the service
    provider''s IP address; once we have the IP address, we will use the **ping**
    module to check the reachability. We have a set of filters, the Jinja2 template
    filters, and the custom filters. Filters in Ansible are from Jinja2, so the input
    data is transformed inside a template expression. Also, templating happens on
    the Ansible control node, not the managed nodes. So, the filters get executed
    on the Ansible control node. This is helpful, as in this way, the amount of data
    which needs to be transferred to the remote hosts is lesser. Ansible has a rich
    set of filters powered by Jinja2 templating. We input some data into these templates
    and the Jinja2 template engine processes that data and provide the formatted output.
    Filtering is very useful in debugging.


