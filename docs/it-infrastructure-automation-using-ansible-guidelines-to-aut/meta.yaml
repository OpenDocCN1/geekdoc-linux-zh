  - '[PAGE 188]


    # Parallelism in Ansible


    Running the tasks in parallel will make Ansible faster. Ansible can run tasks
    in parallel on all the hosts. By default, tasks run on five hosts at once. This
    is because of the default configuration option, which is `forks=5` in `/etc/ansible/ansible.cfg`
    or wherever you put the Ansible configuration file. However, if we change the
    value of forks to any other number, that much Ansible hosts will run in parallel.
    If we want to override the Ansible configuration file, then we can use the `--forks`
    option with the playbook or ad-hoc mode.


    We also have the `serial` keyword in a playbook to reduce the number of parallel
    tasks to a value that is lower than what is specified in the `forks` option.'
  - '[PAGE 189]


    # *Asynchronous tasks*


    Normally, Ansible waits for the completion of the tasks before starting the next
    task. However, we can use the **async** keyword in a task to run it in the background.
    For example, **async: 3600** tells Ansible to give the task an hour to complete.
    This is the maximum amount of time permitted for a task. We also have the **poll:
    10** option which indicates that Ansible will poll every **10** seconds to see
    if the command has been completed. Using **async** allows the next task to be
    started as it will make the overall playbook more efficient. It is recommended
    for the backup job, updating packages, or downloading large files.'
  - '[PAGE 190]


    # *Ansible wait_for*


    It can be used in a task to check if a certain condition was met. It may be useful
    to verify if the server restart was successful. Use **poll: 0** in a task to tell
    Ansible not to wait for completion of this task, but to move on to the next task.
    Add **ignore_errors** as well, to prevent an error condition arising, and have
    this task fail.'
- md: "## Ansible async_status\nFor a start and forget type of task, we can use the\
    \ module to see the current status of the task. This allows you to finish everything\
    \ in the playbook, and close the run when you get positive results from the task.\n\
    \n## *Troubleshooting Ansible*\nTroubleshooting Ansible is extremely important\
    \ since we need to know what's happening if things don't go as per the plan. The\
    \ following are the key topics when it comes to troubleshooting in Ansible.\n\n\
    ## Ansible logging\nBy default, Ansible doesn't log anything, because it has sufficient\
    \ information written in stdout. We can see the error messages directly on the\
    \ Ansible console. However, if we need the logs to be saved in a file, then we\
    \ can specify the **log_path** in the default section of **ansible.cfg** to force\
    \ writing logs to files. We can also set the **$ANSIBLE_LOG_PATH** variable to\
    \ enforce logging in a file.\n\nAn important point to note is that only the root\
    \ user can log to /var/log, so we should consider the log files in the local playbook\
    \ directory, or provide write permission on **/var/log** for your automation user.\
    \ A recommended option is to save the logs in the local directory, so that you\
    \ don't have to modify the system default settings. Once we apply these logging\
    \ parameters, the error messages which were written on STDOUT will be written\
    \ to the log file.\n\nWe also need to configure **logrotate** on the Ansible logs.\
    \ The following example will demonstrate the creation of a log file. We have added\
    \ the following highlighted line in the **ansible.cfg** file's default section:\n\
    ```ini\n[defaults]\nlog_path=errorlogs\n```\n\nWe did not specify the full path,\
    \ so Ansible took the relative path, which means it will create the log file in\
    \ the place where the Ansible playbook is executed. Once it's done you can run\
    \ any previously created playbook, and a new log file will be created.\n\n## **Ansible\
    \ common errors**\nUnderstanding the common errors will help troubleshooting the\
    \ playbooks. For example, if there is a connectivity issue like the server is\
    \ unreachable or wrong credentials, these are not actually a playbook error. A\
    \ playbook error can be a syntax error, extra spaces, or things like that.\n\n\
    We can use the **ansible-playbook --syntax-check playbook_name.yml** command to\
    \ check if the playbook has any issue. If your playbook has many tasks, then **--syntax-check**\
    \ will produce a high volume of messages. To avoid this, we can add **--step**\
    \ to execute the tasks one by one. In this way, troubleshooting will become easy.\n\
    \nThe Ansible playbook's output messages also give a good hint during troubleshooting.\
    \ For example, the play header will show us which play is currently executed,\
    \ and the task header will show which task is creating an error. So, automatically,\
    \ when the error comes, we know which playbook lines have the error.\n\nMoreover,\
    \ we can increase the log detail by adding **-v** or **-vv** or **-vvv** or **-vvvv**\
    \ which add the following verbosity levels:\n- **-v** option means verbosity in\
    \ output data.\n- **-vv** means verbosity in input and output data.\n- **-vvv**\
    \ also includes information about connection to managed host.\n- **-vvvv** includes\
    \ information about plugins, users, and scripts that have been executed.\n\nBy\
    \ adding each level we are getting more and more logs for troubleshooting.\n\n\
    ## Troubleshooting managed hosts\nThe `ansible-playbook --check playbook.yml`\
    \ command is used to perform the test without modifying anything on the targeted\
    \ hosts. However, the Ansible modules that we are using must offer support for\
    \ the check mode, because if the module doesn't support the check mode, nothing\
    \ will be shown.\n\nWe can also use **check_mode** to specify if a specific task\
    \ needs to be executed in the check mode or not. So, if the **check_mode: yes**\
    \ task will be executed during check mode, and if the **check_mode: no** task\
    \ will not be executed during check mode.\n\n## Ansible modules for troubleshooting\n\
    Some Ansible modules provide additional information about the host status; check\
    \ the following as examples:\nThe **uri** module can connect to a URL and check\
    \ for specific content. The **script** module supports execution of scripts on\
    \ managed nodes. The **stat** module can check if specific files are present on\
    \ the managed nodes. The **assert** module evaluates if given expressions are\
    \ true with an optional custom message.\n\n## Ansible ad-hoc commands for troubleshooting\n\
    We can use the Ansible ad-hoc commands to perform quick tests before running the\
    \ playbooks on the managed nodes. The following are a few examples:\n- Check if\
    \ specific package is installed:\n  ```bash\n  $ ansible cen_node_01 -i inventory\
    \ -m yum -a \"name=httpd state=present\"\n  ```\n- Check if managed host has the\
    \ required disk size available:\n  ```bash\n  $ ansible cen_node_01 -i inventory\
    \ -a \"df -h\"\n  ```\n- Check managed host RAM and swap utilization:\n  ```bash\n\
    \  $ ansible cen_node_01 -i inventory -a \"free -h\"\n  ```\n- Check if specific\
    \ user is available:\n  ```bash\n  $ ansible cen_node_01 -i inventory -m user\
    \ -a 'name=ansible'\n  ```\n- Check if the SSH connection is properly established\
    \ with managed host:\n\n## Ansible file lookup\nIn this section, we will be talking\
    \ about lookups. So far, we've been storing the credentials for our target servers\
    \ inside the inventory file or the **host_vars** folders.\n\n*What if there are\
    \ too many servers or this information is already available elsewhere?*\n\nLet's\
    \ say we have the credentials of the servers stored in a CSV file in a host name\
    \ and password format – the first column being the host name and the second column\
    \ being the password. To read the contents of the file while the Ansible playbook\
    \ is running, and to get the password associated with a host, we can use the **lookup**\
    \ plugin.\n\nThe following is how we use the **lookup** plugin:\n```jinja\n{{\
    \ lookup('csvfile', 'cen_node_03', file='tmp/my_servers.csv', delimiter=',') }}\n\
    ```\n\nFor example, in this case, the first argument that we passed to the **lookup**\
    \ plugin is the type of the file which happens to be a **csv** file in this case.\
    \ There are a number of other options available that we'll see in a bit. Then\
    \ comes the value to lookup. For example, here we'd like to lookup the information\
    \ about the server, followed by the file we are looking at. For example, in this\
    \ case, the file is stored under the **tmp** directory and is called `my_servers.csv`,\
    \ and finally, the delimiter which happens to be a comma in this case, because\
    \ it's a CSV file. If you have a file which uses another separator maybe like\
    \ a semicolon or something, then you could specify that here. So, this same lookup\
    \ plugin for the CSV file supports multiple other character-separated file formats\
    \ as well.\n\nIn this case, this whole function or plugin is going to return the\
    \ password from the CSV file.\n\nThere are a couple of lookup plugins available,\
    \ such as the following:\n- CSV file lookup\n- INI file lookup\n- Credstash lookup\n\
    - DNS lookup\n- MongoDB lookup\n\nThe information about this can be seen in the\
    \ Ansible documentation page under the *Special topics and lookups* section.\n\
    \n## Ansible template\nAnsible has a very useful module called template; it provides\
    \ the ability to use templates in which we can make use of Ansible variables and\
    \ conditions to generate specific data formats, and eventually provide a custom\
    \ template for each managed host. Afterwards, this template will be transferred\
    \ to managed hosts. We can also create a specific template for Windows by using\
    \ the **win_template** module.\n\nThe template concept is quite frequently used\
    \ in the DevOps world. However, it is also applicable for networking devices which\
    \ have configuration files in HTTP or XML formats. The template data is generated\
    \ based on **Jinja2** templates. The Jinja2 template is a modern templating language\
    \ for Python developers; since Ansible itself is written in Python, we can leverage\
    \ the Jinja2 templating benefits here.\n\nJinja2 templates are used to create\
    \ HTML, XML, or other mark-up formats that are returned to the user via an HTTP\
    \ request. In futuristic technologies, we have less requirement for static data\
    \ and more for dynamic data being requested from end users. Therefore, Jinja2\
    \ templating is being used. The templates are processed by the Jinja2 templating\
    \ engine. Also, the way these templates are formatted is an important aspect."
  mdcn: "\n## Ansible 异步状态检查\n对于启动后即可忘记执行的这类任务，我们可以使用该模块查看任务的当前状态。这使你能够完成剧本中的所有操作，并在任务返回成功结果时结束运行。\n\
    \n## *Ansible 故障排除*\nAnsible 故障排除极其重要，因为当事情未按计划进行时，我们需要了解发生了什么。以下是进行 Ansible 故障排除时的关键主题。\n\
    \n## Ansible 日志记录\n默认情况下，Ansible 不记录任何信息，因为它在标准输出中已包含足够信息。我们可以直接在 Ansible 控制台看到错误消息。但如果我们需要将日志保存到文件中，则可以在\
    \ **ansible.cfg** 文件的 `[defaults]` 部分指定 **log_path** 以强制将日志写入文件。我们也可以设置 **$ANSIBLE_LOG_PATH**\
    \ 环境变量来强制日志记录到文件。\n\n需要注意的一个重要点是，只有 root 用户才能向 /var/log 目录写入日志，因此我们应考虑使用本地剧本目录中的日志文件，或为你的自动化用户授予\
    \ **/var/log** 目录的写入权限。推荐的做法是将日志保存在本地目录中，这样就无需修改系统默认设置。一旦应用这些日志参数，原本输出到 STDOUT\
    \ 的错误消息将被写入日志文件。\n\n我们还需要在 Ansible 日志上配置 **logrotate**。以下示例将演示日志文件的创建。我们在 **ansible.cfg**\
    \ 文件的 `[defaults]` 部分添加了以下高亮行：\n```ini\n[defaults]\nlog_path=errorlogs\n```\n\n\
    我们没有指定完整路径，因此 Ansible 使用了相对路径，这意味着它将在执行 Ansible 剧本的位置创建日志文件。完成后，你可以运行任何先前创建的剧本，一个新的日志文件将被创建。\n\
    \n## **Ansible 常见错误**\n了解常见错误将有助于排查剧本问题。例如，如果是连接问题，如服务器不可达或凭证错误，这些实际上并非剧本错误。剧本错误可能是语法错误、多余空格或类似问题。\n\
    \n我们可以使用 **ansible-playbook --syntax-check playbook_name.yml** 命令检查剧本是否存在任何问题。如果你的剧本包含许多任务，那么\
    \ **--syntax-check** 会产生大量输出信息。为避免这种情况，我们可以添加 **--step** 来逐个执行任务。这样，故障排除将变得更加容易。\n\
    \nAnsible 剧本的输出信息在故障排除时也能提供很好的线索。例如，play 标题会显示当前正在执行哪个 play，而 task 标题则会显示是哪个任务产生了错误。因此，当错误出现时，我们能自动知道是剧本的哪几行出了问题。\n\
    \n此外，我们可以通过添加 **-v**、**-vv**、**-vvv** 或 **-vvvv** 来增加日志详细程度，它们分别对应以下详细级别：\n- **-v**\
    \ 选项表示输出数据的详细信息。\n- **-vv** 表示输入和输出数据的详细信息。\n- **-vvv** 还包括连接到受管主机的信息。\n- **-vvvv**\
    \ 则包括插件、用户以及已执行脚本的信息。\n\n通过增加每个级别，我们能获得越来越多的日志用于故障排除。\n\n## 受管主机故障排除\n`ansible-playbook\
    \ --check playbook.yml` 命令用于在不修改目标主机任何内容的情况下执行测试。然而，我们使用的 Ansible 模块必须支持检查模式，因为如果模块不支持检查模式，则不会显示任何内容。\n\
    \n我们也可以使用 **check_mode** 来指定特定任务是否需要在检查模式下执行。因此，如果设置了 **check_mode: yes**，任务将在检查模式下执行；如果设置了\
    \ **check_mode: no**，任务则不会在检查模式下执行。\n\n## 用于故障排除的 Ansible 模块\n一些 Ansible 模块提供了关于主机状态的额外信息；以下是一些示例：\n\
    **uri** 模块可以连接到一个 URL 并检查特定内容。**script** 模块支持在受管节点上执行脚本。**stat** 模块可以检查受管节点上是否存在特定文件。**assert**\
    \ 模块评估给定的表达式是否为真，并可附带自定义消息。\n\n## 用于故障排除的 Ansible 临时命令\n我们可以在对受管节点运行剧本之前使用 Ansible\
    \ 临时命令执行快速测试。以下是一些示例：\n- 检查是否安装了特定软件包：\n  ```bash\n  $ ansible cen_node_01 -i\
    \ inventory -m yum -a \"name=httpd state=present\"\n  ```\n- 检查受管主机是否有足够的可用磁盘空间：\n\
    \  ```bash\n  $ ansible cen_node_01 -i inventory -a \"df -h\"\n  ```\n- 检查受管主机的内存和交换空间使用情况：\n\
    \  ```bash\n  $ ansible cen_node_01 -i inventory -a \"free -h\"\n  ```\n- 检查特定用户是否存在：\n\
    \  ```bash\n  $ ansible cen_node_01 -i inventory -m user -a 'name=ansible'\n \
    \ ```\n- 检查与受管主机的 SSH 连接是否已正确建立：\n\n## Ansible 文件查询\n在本节中，我们将讨论查询（lookups）。到目前为止，我们将目标服务器的凭证存储在\
    \ inventory 文件或 **host_vars** 文件夹中。\n\n*如果服务器数量过多，或者这些信息已经存在于其他地方该怎么办呢？*\n\n假设我们将服务器的凭证存储在一个\
    \ CSV 文件中，格式为主机名和密码——第一列是主机名，第二列是密码。为了在 Ansible 剧本运行时读取文件内容并获取与主机关联的密码，我们可以使用\
    \ **lookup** 插件。\n\n以下是我们如何使用 **lookup** 插件：\n```jinja\n{{ lookup('csvfile', 'cen_node_03',\
    \ file='tmp/my_servers.csv', delimiter=',') }}\n```\n\n例如，在这个例子中，我们传递给 **lookup**\
    \ 插件的第一个参数是文件类型，在这里恰好是一个 **csv** 文件。还有许多其他可用选项，我们稍后会看到。然后是要查找的值。例如，这里我们想查找关于该服务器的信息，接着是我们正在查看的文件。例如，在这个例子中，文件存储在\
    \ **tmp** 目录下，名为 `my_servers.csv`，最后是分隔符，在这个例子中恰好是逗号，因为它是一个 CSV 文件。如果你的文件使用其他分隔符，比如分号之类的，那么你可以在此处指定。因此，这个用于\
    \ CSV 文件的相同查询插件也支持多种其他字符分隔的文件格式。\n\n在这种情况下，整个函数或插件将从 CSV 文件中返回密码。\n\n有多种查询插件可用，例如以下几种：\n\
    - CSV 文件查询\n- INI 文件查询\n- Credstash 查询\n- DNS 查询\n- MongoDB 查询\n\n有关这些信息的详情，可以在\
    \ Ansible 文档页面的 *Special topics and lookups* 部分查看。\n\n## Ansible 模板\nAnsible 有一个非常有用的模块叫做\
    \ template；它提供了使用模板的能力，在模板中我们可以利用 Ansible 变量和条件来生成特定的数据格式，并最终为每个受管主机提供一个自定义模板。之后，该模板将被传输到受管主机。我们也可以使用\
    \ **win_template** 模块为 Windows 创建特定模板。\n\n模板概念在 DevOps 领域被广泛使用。然而，它也适用于具有 HTTP\
    \ 或 XML 格式配置文件的网络设备。模板数据是基于 **Jinja2** 模板生成的。Jinja2 模板是一种面向 Python 开发者的现代模板语言；由于\
    \ Ansible 本身是用 Python 编写的，我们可以在此利用 Jinja2 模板化的优势。\n\nJinja2 模板用于创建 HTML、XML 或其他标记格式，这些格式通过\
    \ HTTP 请求返回给用户。在前沿技术中，我们对静态数据的需求减少，而对来自终端用户的动态数据请求增加。因此，Jinja2 模板化被广泛使用。模板由 Jinja2\
    \ 模板引擎处理。同样，这些模板的格式化方式也是一个重要方面。\n"
