    # **Ansible file separation**


    We will now be talking about file separation. So far, we''ve been defining the
    variables in the same inventory file. However, this is not the best practice.
    It is better to define these in a separate variable file. To do this, first create
    a **host_vars** directory next to the playbook and then create a file with the
    same name as that of the server, which, in this case, is **cen_node_o2.yml** and
    If you remember when we deployed the lab in [*Chapter 1 Up and Running with*](Chapter
    1 Up and Running with) we can configure the credentials in the inventory file
    by using the Ansible variables. We will move the variables and their values from
    the inventory file into this new file. Remember to remove the `=` sign and change
    it to a colon followed by a space; this is because this new file is in a YAML
    format.


    When the Ansible playbook is executed, Ansible automatically reads the values
    from this file, and associates them with the host. So, it''s important to name
    the file with the same name as that of the server, and also, it''s important to
    name the folder because that''s the folder that Ansible looks set to find out
    whether there is a variable file for that particular server. For the host variables,
    the folder must be named **host_vars** and the group variables must be named and
    you could have a file for each host inside this folder. The following are the
    changes which we have made on our lab:


    ```

    $ cat inventory

    [centos]

    cen_node_o1

    ```'
