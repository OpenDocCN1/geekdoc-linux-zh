- md: "## With_items\n\nIn this section, we will explore the `with_items` in Ansible.\
    \ It is used for looping in Ansible. Loops are used to repeat a task based on\
    \ different items. Loops avoid writing multiple tasks. `with_items` is a keyword\
    \ which will define a list of items that needs to be processed. It is used as\
    \ a label, listing the different items. To refer to the items, `{{ item }}` is\
    \ used. We also have a flexible option available to use the variables for a list\
    \ of items. It makes the Ansible playbook more diverse.\n\nWe have seen the examples\
    \ for the straight-forward examples in the previous chapter, so I will not explain\
    \ them here. However, the option for complex item is also available, so let's\
    \ understand the following example:\n\n```yaml\n- name: Manage Group Membership\
    \ for users\n  user:\n    name: \"{{ item.name }}\"\n    state: present\n    groups:\
    \ \"{{ item.group }}\"\n  with_items:\n    - { name: 'Rony', group: 'student'\
    \ }\n    - { name: 'Ali', group: 'teacher' }\n    - { name: 'John', group: 'teacher'\
    \ }\n```\n\nSo, in the preceding example, **{name: 'Rony', group: 'student'}**\
    \ is an item. However, in this example, an item is a dictionary, so we can refer\
    \ to the dictionary keys. When we refer to `{{ item.name }}` in the playbook,\
    \ it will iterate on the user names, which in our example are Rony, Ali and John.\
    \ Similarly, when we refer to `{{ item.group }}` in the playbook, it will iterate\
    \ on the user group names, which in our example are student, teacher and teacher.\n\
    \nLet's take another example, in which we will see the practical usage of `with_items`.\
    \ We want to uninstall two packages and delete the files associated with them.\
    \ The following is the example playbook:\n\n```yaml\n---\n- name: Clean-up the\
    \ FTP and Webserver content\n  hosts: centos\n  tasks:\n    - name: Uninstall\
    \ Packages\n      yum:\n        name: \"{{ item }}\"\n        state: absent\n\
    \      with_items:\n        - httpd\n        - vsftpd\n    - name: Delete FTP\
    \ and HTTP files\n      file:\n        path: \"{{ item }}\"\n        state: absent\n\
    \      with_items:\n        - /var/www/html/index.html\n        - /var/ftp/pub/README\n\
    \        - /tmp/www/http_backup.tar\n        - /tmp/ftp/ftp_backup.tar\n```\n\n\
    In the preceding example, we used two loops, one is to provide the list of packages,\
    \ which we need to delete, and the other will provide the file paths, which we\
    \ want to delete as part of cleanup. These sorts of playbooks are very easy to\
    \ expand and reuse. For example, if we have to add another package to be removed,\
    \ all we need to do is to add the package name to the corresponding `with_items`\
    \ list.\n\n### Nested loops (with_nested)\n\nA nested loop is a loop within a\
    \ loop. It is very common in programming languages, in which two lists are used,\
    \ and the task will run on the items in the first list, and combine with the items\
    \ in the second list. I know, theoretically it looks complex but actually it is\
    \ not. So, let's see the following example to understand the concept:\n\n```yaml\n\
    tasks:\n  - name: Add Users in Groups\n    user:\n      name: \"{{ item[0] }}\"\
    \n      state: present\n      groups: \"{{ item[1] }}\"\n    with_nested:\n  \
    \    - ['rony', 'ali', 'john']\n      - ['student', 'teacher', 'teacher']\n```\n\
    \nNested loop is actually a better version of `with_items`, especially when you\
    \ have to run multiple loops. Variables can be used in `with_nested` same as in\
    \ `with_items`.\n\n### When statement\n\nWe have already discussed the `when`\
    \ statement in *Chapter 2, Ansible Basics* when discussing the conditional statements.\
    \ Conditionals allow you to run Ansible tasks only when the required conditions\
    \ are met.\n\n### Registering_variables\n\nThe idea of registering the variables\
    \ is to store the output of a task in a variable. The result is multi-value, each\
    \ value is stored in a key. To access a specific value, we use the `variablename.key`\
    \ format. Let's take the following example to understand the concept:\n\n```yaml\n\
    ---\n- name: Understand Registering Variables\n  hosts: cen_node_01\n  tasks:\n\
    \    - name: Capture the output of who command in a variable\n      command: who\n\
    \      register: loggedin_users\n    - name: Check if ansible user is logged in\n\
    \      shell: echo \"Ansible user is logged in\"\n      when: loggedin_users.stdout.find('ansible')\
    \ != -1\n```\n\n#### Output\n\nThe following is the playbook output:\n\n```output\n\
    $ ansible-playbook register_variable.yml -i inventory -v\nUsing /home/ansible/ansible/Chapter-03/ansible.cfg\
    \ as config file\n\nPLAY [Understand Registering Variables] *********************************************************************\n\
    \nTASK [Gathering Facts]\nok: [cen_node_01]\n\nTASK [Capture the output of who\
    \ command in a variable]\nchanged: [cen_node_01] => {\"changed\": true, \"cmd\"\
    : [\"who\"], \"delta\": \"0:00:00.003309\", \"end\": \"2020-10-18 06:48:05.806548\"\
    , \"rc\": 0, \"start\": \"2020-10-18 06:48:05.803239\", \"stderr\": \"\", \"stderr_lines\"\
    : [], \"stdout\": \"ansible pts/0 2020-10-18 06:48 (master)\", \"stdout_lines\"\
    : [\"ansible pts/0 2020-10-18 06:48 (master)\"]}\n\nTASK [shell]\nchanged: [cen_node_01]\
    \ => {\"changed\": true, \"cmd\": \"echo \\\"Ansible user is logged in\\\"\",\
    \ \"delta\": \"0:00:00.003027\", \"end\": \"2020-10-18 06:48:06.106427\", \"rc\"\
    : 0, \"start\": \"2020-10-18 06:48:06.103400\", \"stderr\": \"\", \"stderr_lines\"\
    : [], \"stdout\": \"Ansible user is logged in\", \"stdout_lines\": [\"Ansible\
    \ user is logged in\"]}\n\nPLAY RECAP\ncen_node_01 : ok=3 changed=2 unreachable=0\
    \ failed=0 skipped=0 rescued=0 ignored=0\n$\n```\n\nThe first thing to note here\
    \ is that we have used the `-v` option when executing the playbook. It will provide\
    \ a verbose output and we can see the `stdout` output variable has the Linux `who`\
    \ command output. The increasing number of `v`s in the `-v` option increases the\
    \ level of verbose output that the user will get for the play run, for example\
    \ `-vv` and `-vvv` provide higher verbosity levels.\n\nIf we explore the playbook,\
    \ we have executed the Linux `who` command and saved the output in a variable\
    \ named `loggedin_users`. The actual output value is stored in `loggedin_users.stdout`.\
    \ Now, in the second task, we took this variable output and used the Ansible built-in\
    \ function `find()` and searched for the username `'ansible'`. Based on the `find()`\
    \ output, we can decide which action we want to perform next. In our playbook,\
    \ we only print 'Ansible user is logged in' but it can be any action.\n\nLet's\
    \ take another example which is more practical, and you may use it for the day-to-day\
    \ activities. The following is the playbook:\n\n```yaml\n---\n- name: Backup Linux\
    \ user home directories\n  hosts: all\n  tasks:\n    # TASK 1\n    - name: Create\
    \ a directory for backups\n      file:\n        path: /var/bkpspool\n        state:\
    \ directory\n    # TASK 2\n    - name: Retrieve the list of home directories\n\
    \      command: ls /home\n      register: home_dirs\n    # TASK 3\n    - name:\
    \ Add home directories in Backup folder\n      file:\n        path: /var/bkpspool/{{\
    \ item }}\n        src: /home/{{ item }}\n        state: link\n      with_items:\
    \ \"{{ home_dirs.stdout_lines }}\"\n```\n\nThe goal of the preceding playbook\
    \ is to create a backup folder, get the list of home directories, and back them\
    \ up in a backup folder. Let's discuss each task separately as follows:\n\n#####\
    \ TASK 1\nThis task is very simple. All we did was create a folder at the path\
    \ `/var/bkpspool`.\n\n##### TASK 2\nIn this task, we created a variable named\
    \ `home_dirs` and saved the `ls /home` command output in it. We know the output\
    \ of this command is the list of all directories in the `/home` folder.\n\n#####\
    \ TASK 3\nThis is the actual place where all the magic happens. We use the `home_dirs.stdout_lines`.\
    \ For each item, we are creating a symbolic link in the backup folder. An important\
    \ point to note is that `stdout` and `stdout_lines` both store the command output.\
    \ However, if we need the output line-by-line, then we use the `stdout_lines`\
    \ variable. If we need the output as a whole, then we will use `stdout`. In the\
    \ previous example, we needed the output in the line-by-line format, since we\
    \ needed to use `with_items` to iterate.\n\n### *Handler*\n\nHandler is also an\
    \ important concept in task control. We have already discussed the handler in\
    \ the previous chapter. However, I will just state its properties for a recap.\
    \ A Handler is a conditional task that only runs after being called by another\
    \ task. It has a globally unique name and is triggered after all the tasks in\
    \ the playbook. A Handler can be triggered by one or more tasks in a playbook.\
    \ The Handler properties are the same as any task. To trigger a handler, the playbook\
    \ must have a notifying item, which will call the name of the handler. More than\
    \ one handler can be called from a task. A Handler always runs in the order in\
    \ which the handler section is written, not in the order in which they are called\
    \ in the play. A Handler cannot be included via the *include* statement so far,\
    \ but once we cover the **roles** and *include* statement later in this chapter,\
    \ this point will be clarified."
  mdcn: "\n## with_items\n在本节中，我们将介绍Ansible中的`with_items`。它用于在Ansible中实现循环功能：循环可以基于不同的项目重复执行任务，避免编写多个重复任务。`with_items`是一个关键字，用于定义需要处理的项目列表，它会作为标签列出所有待处理的项目。引用项目时使用`{{\
    \ item }}`。此外Ansible还提供了灵活的变量配置选项，可为项目列表设置变量，让playbook的灵活性更强。前一章我们已经讲解过基础用法，因此此处不再赘述。不过Ansible也支持处理复杂项目的选项，接下来我们通过示例来理解：\n\
    ```yaml\n- name: Manage Group Membership for users\n  user:\n    name: \"{{ item.name\
    \ }}\"\n    state: present\n    groups: \"{{ item.group }}\"\n  with_items:\n\
    \    - { name: 'Rony', group: 'student' }\n    - { name: 'Ali', group: 'teacher'\
    \ }\n    - { name: 'John', group: 'teacher' }\n```\n因此，在前述示例中，**{姓名: 'Rony', 组:\
    \ 'student'}** 就是一个项目。不过在这个示例中，项目为字典类型，因此我们可以直接引用字典的键。当在playbook中引用`{{ item.name\
    \ }}`时，会对所有用户名执行遍历，本例中对应的用户名为Rony、Ali和John。类似地，当在playbook中引用`{{ item.group }}`时，会对所有用户组名称执行遍历，本例中对应的用户组为student、teacher和teacher。接下来我们再看另一个示例，了解`with_items`的实际应用场景：我们需要卸载两个软件包，并删除与它们关联的文件，以下是示例playbook：\n\
    ```yaml\n---\n- name: Clean-up the FTP and Webserver content\n  hosts: centos\n\
    \  tasks:\n    - name: Uninstall Packages\n      yum:\n        name: \"{{ item\
    \ }}\"\n        state: absent\n      with_items:\n        - httpd\n        - vsftpd\n\
    \n    - name: Delete FTP and HTTP files\n      file:\n        path: \"{{ item\
    \ }}\"\n        state: absent\n      with_items:\n        - /var/www/html/index.html\n\
    \        - /var/ftp/pub/README\n        - /tmp/www/http_backup.tar\n        -\
    \ /tmp/ftp/ftp_backup.tar\n```\n在前述示例中，我们使用了两个独立的循环：一个用于提供需要删除的软件包列表，另一个用于提供清理过程中需要删除的文件路径。这类playbook非常易于扩展和复用。例如，如果需要新增要删除的软件包，只需将软件包名称添加到对应的`with_items`列表中即可。\n\
    \n### 嵌套循环（with_nested）\n嵌套循环即循环中再嵌套循环，在编程语言中是非常常见的设计：通常配合两个列表使用，任务会在第一个列表的每个项目上执行，并与第二个列表的每个项目进行组合。从理论上看可能比较复杂，但实际使用起来非常简单。接下来我们通过以下示例理解这个概念：\n\
    ```yaml\ntasks:\n  - name: Add Users in Groups\n    user:\n      name: \"{{ item[0]\
    \ }}\"\n      state: present\n      groups: \"{{ item[1] }}\"\n    with_nested:\n\
    \      - ['rony', 'ali', 'john']\n      - ['student', 'teacher', 'teacher']\n\
    ```\n嵌套循环实际上是`with_items`的升级版本，尤其适合需要执行多个循环的场景。`with_nested`中的变量用法和`with_items`完全一致。\n\
    \n### when语句\n我们在*第2章 Ansible基础*中讲解条件语句时已经讲过`when`语句。条件语句允许你在满足指定条件时才执行对应的Ansible任务。\n\
    \n### 注册变量\n注册变量的核心思想是将任务的输出存储到变量中。任务输出是多值结果，每个值会存储在一个独立的键中。要访问特定值，我们使用`variablename.key`格式。接下来通过以下示例理解这个概念：\n\
    ```yaml\n---\n- name: Understand Registering Variables\n  hosts: cen_node_01\n\
    \  tasks:\n    - name: Capture the output of who command in a variable\n     \
    \ command: who\n      register: loggedin_users\n\n    - name: Check if ansible\
    \ user is logged in\n      shell: echo \"Ansible user is logged in\"\n      when:\
    \ loggedin_users.stdout.find('ansible') != -1\n```\n\n#### 输出\nplaybook的执行结果如下：\n\
    ```output\n$ ansible-playbook register_variable.yml -i inventory -v\nUsing /home/ansible/ansible/Chapter-03/ansible.cfg\
    \ as config file\nPLAY [Understand Registering Variables] *********************************************************************\n\
    TASK [Gathering Facts] ok: [cen_node_01]\nTASK [Capture the output of who command\
    \ in a variable] changed: [cen_node_01] => {\"changed\": true, \"cmd\": [\"who\"\
    ], \"delta\": \"0:00:00.003309\", \"end\": \"2020-10-18 06:48:05.806548\", \"\
    rc\": 0, \"start\": \"2020-10-18 06:48:05.803239\", \"stderr\": \"\", \"stderr_lines\"\
    : [], \"stdout\": \"ansible pts/0 2020-10-18 06:48 (master)\", \"stdout_lines\"\
    : [\"ansible pts/0 2020-10-18 06:48 (master)\"]}\nTASK [shell] changed: [cen_node_01]\
    \ => {\"changed\": true, \"cmd\": \"echo \\\"Ansible user is logged in\\\"\",\
    \ \"delta\": \"0:00:00.003027\", \"end\": \"2020-10-18 06:48:06.106427\", \"rc\"\
    : 0, \"start\": \"2020-10-18 06:48:06.103400\", \"stderr\": \"\", \"stderr_lines\"\
    : [], \"stdout\": \"Ansible user is logged in\", \"stdout_lines\": [\"Ansible\
    \ user is logged in\"]}\nPLAY RECAP\ncen_node_01                  : ok=3 changed=2\
    \ unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n$\n```\n首先要注意的是，我们执行playbook时使用了`-v`选项，该选项会输出详细执行信息，可以看到`stdout`输出变量保存了Linux\
    \ `who`命令的执行结果。`-v`选项中`v`的数量越多，playbook运行时的详细输出级别就越高，例如`-vv`和`-vvv`会提供更高级别的执行详情。查看这个playbook可知，我们执行了Linux\
    \ `who`命令，并将输出保存到了名为`loggedin_users`的变量中，实际的输出值存储在`loggedin_users.stdout`中。接下来第二个任务中，我们使用了该变量的输出，调用Ansible内置函数`find()`搜索用户名`'ansible'`。根据`find()`的输出结果，我们可以决定下一步要执行的操作。本例中的playbook仅打印了\"\
    Ansible user is logged in\"，但此处可以替换为任意需要的操作。接下来我们再看一个更实用的示例，可用于日常运维工作，以下是这个playbook：\n\
    ```yaml\n---\n- name: Backup Linux user home directories\n  hosts: all\n  tasks:\n\
    \    # TASK 1\n    - name: Create a directory for backups\n      file:\n     \
    \   path: /var/bkpspool\n        state: directory\n\n    # TASK 2\n    - name:\
    \ Retrieve the list of home directories\n      command: ls /home\n      register:\
    \ home_dirs\n\n    # TASK 3\n    - name: Add home directories in Backup folder\n\
    \      file:\n        path: /var/bkpspool/{{ item }}\n        src: /home/{{ item\
    \ }}\n        state: link\n      with_items: \"{{ home_dirs.stdout_lines }}\"\n\
    ```\n前述playbook的目标是创建备份文件夹、获取主目录列表，并将所有主目录备份到备份文件夹中。接下来我们逐一讨论每个任务：\n\n##### 任务1\n\
    这个任务非常简单，我们只是创建了路径为`/var/bkpspool`的文件夹。\n\n##### 任务2\n在这个任务中，我们创建了名为`home_dirs`的变量，并将`ls\
    \ /home`命令的输出保存到该变量中。该命令的输出是`/home`文件夹下的所有目录列表。\n\n##### 任务3\n这是实际执行核心操作的步骤。我们使用了`home_dirs.stdout_lines`变量，为每个项目在备份文件夹中创建一个符号链接。需要注意的一点是，`stdout`和`stdout_lines`都会存储命令输出，但如果你需要逐行获取输出，就使用`stdout_lines`变量；如果需要获取完整的输出内容，就使用`stdout`变量。前一个示例中我们需要逐行格式的输出，因为要使用`with_items`进行遍历。\n\
    \n### *处理器*\n*处理器*也是任务控制中的重要概念，前一章我们已经讲解过处理器的相关内容，此处仅梳理其属性作为回顾。处理器是一种条件任务，仅在被其他任务调用时才会运行。它拥有全局唯一的名称，会在playbook中所有任务执行完成后触发。playbook中的一个或多个任务都可以触发处理器。处理器的属性和普通任务完全一致。要触发处理器，playbook中必须包含通知项，用于调用处理器的名称。一个任务可以触发多个处理器。处理器的执行顺序严格按照处理器部分的编写顺序，而非playbook中调用它的顺序。目前为止处理器无法通过*include*语句引入，等我们后续在本章讲解**角色**和*include*语句时，会澄清这一点。\n"
