    localhost | SUCCESS => {\n    \"changed\": false,\n    \"ping\": \"pong\"\n}\n\
    ```\n\n**Figure 1.7:** *Output of ping module*\n\nThe following are the key Ansible\
    \ concepts which are essential to understand Ansible:\n- Ansible Inventory\n-\
    \ Ansible Configuration File\n- Ansible Modules\n\n## Ansible Inventory\nAnsible\
    \ works against multiple managed hosts in your infrastructure, at the same time,\
    \ using a list or group of lists known as inventory. Once your inventory is defined,\
    \ you can use patterns to select the hosts or groups that you want Ansible to\
    \ run against. The default inventory location is as follows:\nWhen running the\
    \ scripts, we can provide our own inventory location. So, if we have multiple\
    \ scripts on different nodes, we can differentiate them with their own inventory\
    \ files. We can put the host IP address, hostname, or create groups including\
    \ the hostname or IP address in the inventory file:\n**all** is a special default\
    \ group which includes all the hosts from the inventory. Duplicating hosts in\
    \ different groups is allowed. Nested grouping is allowed. Adding a range of hosts\
    \ is also allowed, like the following:\n\n``` \n[db]\ndb[01:50].example.com\n\
    ```\n\nThe preceding inventory means the group **db** has fifty hosts starting\
    \ from **db01.example.com** to **db50.example.com**. The same is valid for alphabet,\
    \ like the following:\n\n``` \n[db]\ndb-[a:f].example.com\n```\n\nThe preceding\
    \ inventory means the group **db** has six hosts starting from **db-a.example.com**\
    \ to **db-f.example.com**.\n\n### VARIABLES IN INVENTORIES\nTo change the default\
    \ HTTP port for the web server, we can use the following variables:\n\n``` \n\
    [atlanta]\nhost1 http_port=80 maxRequestsPerChild=808\nhost2 http_port=303 maxRequestsPerChild=909\n\
    ```\n\nIf we have to change the SSH specific configuration, the following variables\
    \ will be used:\n\n``` \nHost3.example.com:5309 #Change SSH user for specific\
    \ host\nhost1.example.com ansible_connection=ssh ansible_user=myuser ansible_pass=\"\
    PWD\"\n```\n\n``` \nhost2.example.com ansible_connection=ssh ansible_user=myotheruser\n\
    ```\n\nFor the lab setup, let's take the following sample inventories.\n\n###\
    \ SAMPLE INVENTORY FILE\nLet's take the sample files for the following two scenarios:\n\
    - One VM as control and four VMs as managed nodes.\n- Single VM as control and\
    \ managed node.\n\n### One VM as control and four VMs as managed nodes\nThe following\
    \ is the inventory file for our lab setup in which we have four managed nodes:\n\
    \n``` \n[centos]\ncen_node_01\ncen_node_02\n\n[ubuntu]\nubu_node_01\nubu_node_02\n\
    ansible_user=admin1\nansible_pass=Pass@123\n```\n\n> **We are using ansible_pass\
    \ for our learning purpose. In production, never save your password as clear text.\
    \ We will fix it in the later chapters. If you remember, we left out ubu_node_02\
    \ node without password-less login, we are fixing that here in inventory by providing\
    \ SSH credentials.**\n\n### SINGLE VM AS CONTROL AND MANAGED NODE\nIn case you\
    \ have a low specs laptop and you can't have multiple VMs, a single Linux VM can\
    \ be used as the Ansible control and managed node. If you are using a single VM,\
    \ then the following is the inventory file that you need:\n\n``` \nLocalhost ansible_connection=localhost\n\
    ```\n\n### Variable explanation\nThe following variable names are self-explanatory\
    \ which will help us in writing complicated scripts in the later chapters:\n-\
    \ The name of the host to connect to, if it's different from the alias you wish\
    \ to give to it.\n- The connection port number, if not the default for SSH.\n\
    - The user's name to use when connecting to the host.\n- The password to use to\
    \ authenticate to the host.\n- Equivalent to **ansible_sudo** or allows to force\
    \ privilege escalation.\n\nAfter using the preceding sample inventory in the current\
    \ directory, we will get the following output:\n\n``` \nansible@master:~/.ansible$\
    \ ansible -i inventory centos -m ping\ncen_node_01 | SUCCESS => {\n    \"ansible_facts\"\
    : {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\n    },\n\
    \    \"changed\": false,\n    \"ping\": \"pong\"\n}\ncen_node_02 | SUCCESS =>\
    \ {\n    \"ansible_facts\": {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\
    \n    },\n    \"changed\": false,\n    \"ping\": \"pong\"\n}\nansible@master:~/.ansible$\n\
    ```\n\n## Ansible Configuration File\nWhen the Ansible command or playbook is\
    \ executed, it looks for the **Ansible.cfg** file, which has the Ansible related\
    \ parameters configured. Ansible looks for the configuration file in the following\
    \ order:\n1. **Priority 1:** ANSIBLE_CONFIG environment variable if set.\n2. **Priority\
    \ 2:** ansible.cfg in the current directory.\n3. **Priority 3:** ansible.cfg in\
    \ the home directory.\n4. **Priority 4:** /etc/ansible/ansible.cfg (default location)\n\
    \nAnsible will process the preceding list and use the first file found, and all\
    \ the others will be ignored. Ansible creates a default configuration file at\
    \ the location when Ansible is installed. The recommendation is to keep a separate\
    \ configuration file for each script or a group of scripts, otherwise Ansible\
    \ will use the default configuration file. Later, if someone modified the parameter\
    \ of the default configuration file, all your scripts will be affected and it\
    \ will become a huge troubleshooting task.\n\nWe will discuss some basic parameters\
    \ in the following section; the other parameters will be covered in the later\
    \ chapters:\n- **Inventory=**: We can specify the inventory file directly from\
    \ the configuration file, so we don’t have to provide it during the script execution.\n\
    - **Forks =**: This represents the number of parallel connections that needs to\
    \ be established. By default, its value is 5. If we increase this value, the script\
    \ processing time will be enhanced. However, it will generate more load on the\
    \ Ansible server and network.\n- **sudo_user =**: Here we can change the **sudo**\
    \ user to some other user with the admin rights, since the root user is not normally\
    \ used for the day-to-day tasks.\n- **gathering =**: This option is used to collect\
    \ more information about the host machine. This is a very useful feature; we will\
    \ discuss it further in the later chapters.\n- **timeout =**: This is for the\
    \ SSH timeout in seconds; for lab setup 10 seconds is OK, but for production,\
    \ you must change this to 30 seconds or even 60 seconds. Otherwise, you might\
    \ get the timeout messages on some hosts, which have high utilization.\n\n## Ansible\
    \ modules\nIn this section, we will look at some ansible modules in a bit more\
    \ detail. This is required, so that we can practice developing some more meaningful\
    \ playbooks. Ansible modules are categorized into various groups based on their\
    \ functionality. As I said earlier, there are hundreds of Ansible modules available.\
    \ They are categorized into the following list:\n- Cloud modules\n- Clustering\
    \ modules\n- Command modules\n- Crypto modules\n- Database modules\n- File modules\n\
    - Identity modules\n- Inventory modules"
