  md: "```\n# An employee record\nmartin:\n  name: Waqas Irtaza\n  job: Engineer\n\
    \  skill: Automation\n```\n\nA dictionary is represented in a simple **key: value**\
    \ form (the colon must be followed by a space).\n\nProper spacing is essential,\
    \ otherwise we will get a syntax error depicted as follows:\n\n# **Correct Syntax**\n\
    \n```\n# An employee record\nUser:\n  name: Waqas Irtaza\n  job: Engineer\n  skill:\
