    Blocks allow error handling; if a task fails, the task in the rescue task can
    be executed for recovery. We also have an **always** task, which will run regardless
    of success or failure of the task defined in blocks or rescue. Let''s take the
    following example to understand the **rescue** and **always** keywords in blocks:


    ```

    ---

    - name: Error handling in Blocks

    hosts: all

    ```'
