  md: '# *Handler*


    Handler is also an important concept in task control. We have already discussed
    the handler in the previous chapter. However, I will just state its properties
    for a recap. A Handler is a conditional task that only runs after being called
    by another task. It has a globally unique name and is triggered after all the
    tasks in the playbook. A Handler can be triggered by one or more tasks in a playbook.
    The Handler properties are the same as any task. To trigger a handler, the playbook
    must have a notifying item, which will call the name of the handler. More than
    one handler can be called from a task. A Handler always runs in the order in which
    the handler section is written, not in the order in which they are called in the
    plays. A Handler cannot be included in the playbook; they must be part of the
    playbook. We haven''t discussed, *include* so far, but once we discuss, the **roles**
    and **include** statement later in this chapter, this point will be cleared.'
  merge: -1
  pgno: 153
- img_proc: true
  md: "# Tags\n\nTags are also an import part of the complex playbooks. Tags are used\
    \ at a resource level to give a name to a specific resource. The --tags are used\
    \ with the Ansible playbook to run only the resources with a specific tag. When\
    \ a task file is included in a playbook, it can be tagged in the **include** statement.\
    \ When tagging a role or inclusion, the tag applies to everything in the role\
    \ or in the inclusion. To run a playbook with a specific tag, use the command\
    \ **Ansible-playbook --tags** This command will only run the resources which matches\
    \ the We can also use - - - **skip-tags** 'tagname' to exclude a resource with\
    \ a specific tag. We have a special tag named which can be used to make sure that\
    \ resource is always executed, unless specifically excluded with - - - When the\
    \ -- **- tag** option is used to run a playbook, it can take up to three specific\
    \ tags as an argument. **all** is another the default tag, which will run all\
    \ the tasks; it is the default behavior of Ansible. An alternative of tags is\
    \ creating multiple playbooks. If you want to create a single big playbook and\
    \ segregate it based on tags, then use tags, otherwise create multiple playbooks.\
    \ The following example will explain how to use the tags:\n\n```\n---\n- name:\
    \ Understand Ansible Tags\n  hosts: centos\n  tasks:\n\n  - name: Install network\
    \ Analysis Packages\n```"
  merge: -1
