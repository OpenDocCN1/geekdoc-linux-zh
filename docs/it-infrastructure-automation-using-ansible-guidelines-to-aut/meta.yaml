  md: '# *Examples for ad-hoc mode*


    In this section, we will take several useful practical examples to understand
    how useful the ad-hoc mode is. Most of the examples in this chapter can be used
    in any production environment. Let''s take a look at these examples.


    # **CHECK HOST STATUS**


