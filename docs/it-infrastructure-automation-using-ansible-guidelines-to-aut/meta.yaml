    # Ansible dynamic inventory


    We have already discussed about the Ansible inventory file, which has the host
    details available; such an inventory is called the static inventory. However,
    if Ansible has to cover all the IT domains, then the static inventory is not realistic
    in the production environments. In the real world, infrastructure keeps changing
    rapidly. We also add new nodes and remove the unwanted nodes. This is very common,
    especially for the cloud and container environments, where the nodes are added
    and removed based on usage. Therefore, Ansible came up with a concept called **dynamic**
    which fetches the list of nodes from the infrastructure environments in real time.


    In the modern IT environment, the sources of host nodes can be AWS, Azure, OpenStack,
    containers, and LDAP systems. These systems have their list of nodes and Ansible
    integrates with such external dynamic inventory.


    In Ansible, we have the two following ways to connect to the external dynamic
    inventories:


    +   - **Via** This is the older way which ensures backward compatibility.

    - **Ansible** Ansible recommends this over the scripts for dynamic inventory,
    since the plugins are updated with the Ansible core code.'
  - '[PAGE 210]


    The Dynamic inventory scripts are written in a programming language like Python,
    PHP, and so on. When using the script, they get real time data from the target
    source environments, like AWS, OpenStack, GCP, and so on. The Ansible community
    have already developed such kind of scripts for the majority of platforms. If
    we have good programming skills, we may write such scripts as well, but using
    scripts is not very well-documented and not successful every time. Normally, we
    download the scripts for the source environment and set the **env** variable as
    per the guidelines available with script. These scripts are maintained by the
    Ansible community. Mostly, the scripts are written in Python and named as Along
    with these Python scripts, there are the INT files as well, which are needed to
    set the environment, but this is dependent on the script that we are using.


    In Ansible, we have a set of available inventory plugins. Similarly, we can create
    our own plugins. Normally, the inventory returns the list of items in the JSON
    format. Ansible provides a bunch of inventory plugins, using which we can use
    to get the list of target hosts on which you will be running any task or play.
    For example, we can use the following commands to get the list of available Ansible
    plugins for our Ansible. These plugins will vary, depending on which Ansible version
    we are using:


    ```

    $ ansible-doc -t inventory -l

    advanced_host_list  Parses a ''host list'' with ranges

    auto                Loads and executes an inventory plugin

    specified in a      YAML config

    aws_ec2             EC2 inventory source

    ```'
