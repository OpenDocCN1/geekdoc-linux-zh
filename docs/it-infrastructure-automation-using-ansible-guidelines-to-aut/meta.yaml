  md: '# CHAPTER 1


    # *Up and Running with Ansible*


    Ansible is a simple open-source engine which automates the application deployment,
    infrastructure service orchestration, cloud provisioning, and many other IT tools.
    Ansible is completely agentless, which means that it works by connecting your
    nodes through SSH. Most of the current technologies use SSH as a default administration
    tool, whether it is a public or a private cloud platform, networking equipment,
    or a locally hosted ESX, Windows, or Linux servers. Henceforth, Ansible has a
    diverse scope.


    Moreover, if you want the other methods for a remote connection like those options
    are also available. So, let''s begin our journey and start exploring what to expect
    from this chapter.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# *Structure*


    In this chapter, we will cover the following topics:


    +   - Introduction to Ansible

    - Lab setup

    - Important concepts about Ansible

    - Basic understanding of YAML'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Objective


    After studying this chapter, you should be able to do the following:


    +   - Understand why Ansible is popular.

    - Install Ansible and set up your environment.

    - Understand the Ansible components.

    - Understand the YAML syntax.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# *Introduction to Ansible*


    If you are a Systems Administrator, Network Administrator, or just anybody working
    in the IT, you were probably involved in doing a lot of repetitive tasks in your
    environment, whether it was to configure thousands of routers and switches, create
    new virtual machines, apply configurations, patch bulk of servers, migrations,
    deploy applications, or even perform security and compliance audits.


    All of these repetitive tasks involve execution of similar commands on thousands
    of different devices, while maintaining the right sequence of events. Smart people
    develop scripts to automate these tasks, but it requires coding skills; regular
    IT administrators don''t have the professional coding skills, and an IT developer
    with good coding skills don''t have the strong infrastructure knowledge. Hence,
    there is a gap which Ansible leverages.


    Ansible is a powerful IT automation tool that you can quickly learn. It''s simple
    enough for everyone in IT, yet powerful enough to automate even the most complex
    deployments.


    The following are some products related to Ansible:


    +   - **Ansible** An open-source automation platform.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# **Ansible** A website with a large catalogue of community created roles.


    # **Ansible** A web application and REST API solution for Ansible.


    The main focus of the book is the Ansible core. The following are some of the
    Ansible use cases:


    +   Configuration management

    Deployment

    Orchestration

    Provisioning


    Let''s explore the use cases with examples. Imagine you have a number of servers
    in your environment that you would like to patch and restart in a particular order.
    Some of them are application servers and the others are database servers. So,
    first you would patch the servers, and power down the application servers, followed
    by the database servers, then power up the database servers, and once the database
    is online, then power up the application servers. You could write an Ansible playbook
    to get this done in a matter of minutes and simply invoke the Ansible playbook
    every time you wish to perform this patching activity.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Similarly, if you have to enable the port security on all the switches in the
    network, which is a repetitive work across the network, and if this needs to be
    performed on thousands of switches, a simple Ansible playbook can achieve this
    task.


    Let''s take a look at a complex example. Let''s suppose, we are setting up a complex
    infrastructure that spans across public and private cloud and hundreds of VMs.
    With Ansible, you could provision the hosts on public clouds like Azure or AWS
    and provision private cloud like OpenStack or in VMware based infrastructure and
    move onto configuring the applications on those systems and set up communications
    between them. There are a lot of built-in modules available in Ansible that supports
    these kinds of operations and many more. We will be exploring them in the following
    chapters.


    The following block diagram will clarify the Ansible key components:'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/30dec63bea641411c2be69f8d282b813_31_0.png)


    # **Figure 1.1:** *Ansible key components*


    To understand better, the following is the definition of each Ansible component:


    **Ansible Control** Ansible Control Node is any machine which has Ansible installed.
    It must be a Linux machine; it can''t be any Windows machine. This is the one
    machine where the installation is required.


    **Ansible Managed** Ansible Managed Nodes are servers or any IT devices, which
    we want to manage through Ansible. Ansible Managed Nodes are also called managed
    hosts. Ansible installation is not required on hosts.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Inventory is a list of hosts. We can organize the hosts by nesting, and creating
    groups for scaling. Static and dynamic inventories are available, which we will
    discuss later.


    A Playbook is an ordered list of saved tasks, which can run repeatedly. Playbooks
    gives a programmable flavor to Ansible by allowing variable, loops, and conditional
    statements. Playbooks are written in YAML format.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Lab setup


    Ansible installation is extremely simple; just a couple of commands and you have
    a fully functional Ansible control node. However, our goal is not just to install
    Ansible, but to understand the infrastructure requirement and have a fully functional
    lab to follow along the practical examples. Let’s prepare the lab by following
    these processes.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# *Infrastructure preparation for Ansible*


    We will be setting up an entire lab environment on our laptop from scratch. For
    this, we will use a virtualization tool called **Oracle** since it is open source
    and works with all the flavors of operating systems like Windows, Linux, and OSX.
    We will first install the Oracle VirtualBox on our laptop and then install the
    CentOS or Ubuntu operating systems; I have created one Ansible control node on
    Ubuntu and four managed nodes, two on CentOS and two on Ubuntu. The following
    screenshot shows the VMs on VirtualBox:


    ![](img/30dec63bea641411c2be69f8d282b813_34_0.png)'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# **Figure 1.2:** VMs on VirtualBox


    Having four managed nodes is not required if you have a low specification laptop,
    a single Linux host can also be used as both the control node and the managed
    nodes.


