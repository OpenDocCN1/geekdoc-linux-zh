    # **Ansible include statement**


    Let''s understand the **include** statement with an example; suppose we have a
    playbook with two sets of tasks – one to install and configure the database, and
    the other to install and configure the web server. *What if we need to reuse these
    tasks in different playbooks where the requirement may be to only install the
    database or to only install the web server?* So, we first create two files under
    a folder called naming them **deploy_db.yml** and move the **db** tasks into the
    first one and the web tasks into the second one. Once we''re done, we can add
    the **include** statements under the task in our playbook to include the task
    from these external files:'
- md: "## Ansible roles\nThe Ansible roles provide a uniform way to load variables,\
    \ tasks, and handlers from the external files. The purpose of roles is to keep\
    \ the size of the playbooks manageable. Roles use a specific directory structure\
    \ with the location for default task, handlers, templates, and variables. A role\
    \ typically corresponds to the type of service, for example, we have a role for\
    \ docker, web service, or database service. For specific groups of servers, specific\
    \ playbooks may be created to include one or more roles. To manage what should\
    \ happen, the default variables are set in the roles, which can be overwritten\
    \ at the playbook level. To make working with the role easier, community roles\
    \ can be downloaded from the Ansible galaxy. Roles are defined in a role's directory,\
    \ which is created in the project directory.\n## Directory structure for role\n\
    The following are the important folders for roles. Let's see what these folders\
    \ contain, as follows:\n```shell\n$ tree .\n.\n├── test-role-1\n│   ├── defaults\n\
    │   │   └── main.yml\n│   ├── files\n│   ├── handlers\n│   │   └── main.yml\n\
    │   ├── meta\n│   │   └── main.yml\n│   ├── README.md\n│   ├── tasks\n│   │  \
    \ └── main.yml\n│   ├── templates\n│   ├── tests\n│   │   ├── inventory\n│   │\
    \   └── test.yml\n│   └── vars\n│       └── main.yml\n9 directories, 8 files\n\
    $\n```\n### defaults\nThis folder contains a **main.yml** file with default values\
    \ for variables.\n### files\nThis folder has static files that are referenced\
    \ by role's tasks.\n### handlers\nThis folder contains a **main.yml** with handler\
    \ definitions.\n### meta\nThis folder contains **main.yml** with information about\
    \ the roles, including author, license, platform, and dependencies.\n### tasks\n\
    This folder has a **main.yml** file with task definitions.\n### vars\nThis folder\
    \ has a **main.yml** file with role variable definitions.\nTo create roles, we\
    \ first create the role structure. We don't have to create structure manually.\
    \ We can use the **ansible-galaxy** command which is, by default, installed with\
    \ Ansible. The following command will create a role's directory structure:\n```shell\n\
    $ ansible-galaxy init test-role-1\n```\nOnce the preceding command is executed,\
    \ a new folder with a name of **test-role-1** will be created. Let's see the content\
    \ of the folder, as follows:\n```shell\n$ tree .\n.\n└── test-role-1\n    ├──\
    \ defaults\n    │   └── main.yml\n    ├── files\n    ├── handlers\n    │   └──\
    \ main.yml\n    ├── meta\n    │   └── main.yml\n    ├── README.md\n    ├── tasks\n\
    \    │   └── main.yml\n    ├── templates\n    ├── tests\n    │   ├── inventory\n\
    \    │   └── test.yml\n    └── vars\n        └── main.yml\n9 directories, 8 files\n\
    $\n```\nOnce the structured role's directory is created, we can define the role\
    \ content, and then use these roles in the playbook. Each role has its own directory\
    \ with specific subdirectories that exist in ~/roles and not in specific project\
    \ directories. So, if we are not using any specific subdirectory, we can keep\
    \ it empty.\n## *Role variables*\nRole variables are defined in **vars/main.yml**\
    \ and have a high priority and cannot be overwritten by the inventory variables.\
    \ The default variables can be defined in **defaults/main.yml** and have the lowest\
    \ precedence. So, we can use the default variables only if we intend to have the\
    \ variable overwritten somewhere else.\n## *Defining role dependencies*\nWe can\
    \ expect some dependencies of roles like roles may include other roles. Dependencies\
    \ are written in **meta/main.yml** within the role:\n```yaml\n---\ndependencies:\n\
    \  - {role: apache, port: 80}\n  - {role: mariadb, dbname: addresses, admin_user:\
    \ Rony}\n```\n## Order of execution in role\nNormally, the tasks in a role are\
    \ executed before the tasks of the playbook using them, but we have two solutions\
    \ to override it, which are as follows: **pre_tasks** are performed before the\
    \ roles are applied. **post_tasks** are performed after completing all roles.\n\
    The following is a sample playbook which gives an idea how to implement the preceding\
    \ discussed concepts:\n```yaml\n---\n- hosts: cen_node_01\n  pre_tasks:\n    -\
    \ debug:\n        msg: 'Starting'\n  roles:\n    - role1\n    - role2\n    - role3\n\
    \  tasks:\n    - debug:\n        msg: Execute After roles'\n  post_tasks:\n  \
    \  - debug:\n        msg: 'Last Task'\n```\n## *Ansible Galaxy*\nAnsible Galaxy\
    \ is the community resource for getting and publishing Ansible roles. The website\
    \ for the Ansible Galaxy is as follows: [https://galaxy.ansible.com/](https://galaxy.ansible.com/)\n\
    Since it is a community resource, many roles that are ready to use are available\
    \ for download. The roles that are still in development can also be followed.\
    \ Let's visit the site and see how we can utilize the Ansible Galaxy. The following\
