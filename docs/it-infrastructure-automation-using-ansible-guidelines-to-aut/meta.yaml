- img_proc: true
  md: 'Let''s discuss some important Ansible categorization of modules, which are
    as follows:


    # **System**


    System modules are actions to be performed at a system level, such as modifying
    the users and groups on the system, modifying IP tables, and firewall configurations,
    working with logical volume groups, mounting operations, or working with services.
    For example, starting, stopping, or restarting services in a system.


    # **Command**


    Command modules are used to execute the commands or scripts on a host. These could
    be simple commands using the command module or an interactive execution. You could
    also run a script on the host using the script module.


    # **File**


    File modules help in working with files. For example, using the ACL module to
    set and retrieve the ACL information on files, use the archive and unarchive modules
    to compress and unpack files, and use find to search and replace the modules to
    modify the contents of an existing file.


    # **Database**


    Database modules help in working with the databases, such as MongoDB, MSSQL, MySQL,
    or PostgreSQL, to add or remove the databases or modify database configurations,
    and so on.


    # **Cloud**


    Cloud modules have a vast collection of modules for the various cloud providers
    like Amazon, Azure, Docker, Google, OpenStack, and VMware being just a few of
    them. There are a'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'number of modules available for each of these that allow you to perform various
    tasks such as creating and destroying instances, performing configuration changes,
    networking and security and managing containers, data centers, clusters, social
    networking, VSAN, and a lot more.


    # Windows


    Windows modules will help you use Ansible in a Windows environment. Some of them
    are **Win_copy** to copy files, and **Win_command** to execute the command on
    the Windows machine. And there are a bunch of other modules available to work
    with the files on Windows. Create an IIS website, install a software using the
    MSI installer, making changes to the registry using Regedit, and manage services
    and users in Windows. These are just a few modules in a few categories.


    There are a lot more and a comprehensive list can be found at **docs.ansible.com**
    along with detailed instructions on each of them.


    Let''s look at a few of these modules in detail to understand how you can use
    them.'
  merge: -1
