    # Ansible 过滤器

    在 Ansible 中编写 playbook 时，我们需要对数据进行操作、处理和格式化，因为一个任务的输出可能作为下一个任务的输入。例如，如果我们正在编写网络场景的
    playbook，第一个任务是检查默认路由，随后使用 Ansible 过滤器获取服务提供商的 IP 地址；拿到 IP 地址后，我们会使用 **ping**
    模块检查网络可达性。


    Ansible 的过滤器分为多类，包括 Jinja2 模板过滤器和自定义过滤器。Ansible 的过滤器源自 Jinja2，因此输入数据会在模板表达式内部完成转换。此外，模板渲染过程发生在
    Ansible 控制节点上，而非被管理节点。因此，过滤器也会在 Ansible 控制节点上执行。这种方式非常实用，因为需要传输到远程主机的数据量会大幅减少。


    Ansible 拥有由 Jinja2 模板引擎驱动的丰富过滤器库。我们将数据输入这些模板，Jinja2 模板引擎会处理数据并输出格式化后的结果。过滤功能在调试过程中非常实用。


