    ## 处理主机环境变量

    众所周知，只有管理员拥有重启特定服务器的权限，因此我们需要进行权限提升才能重启服务器。

    进行权限提升时会用到以下命令：

    ``` $ ansible centos -i inventory -a "/sbin/reboot" -f 10 -u username --become
    [--ask-become-pass] ```

    如果你添加**--ask-become-pass**参数，Ansible就会提示你输入用于权限提升的密码。

    截至目前，我们所有的示例使用的都是默认的command模块，该模块不支持环境变量。我们已在[第一章：快速上手Ansible](#)中讨论过相关内容。这里我们举一个例子来更好地说明这一点。

    要使用其他模块，需要通过**-m**参数指定模块名称。例如，使用shell模块时，需要用以下命令：

    ``` $ ansible centos -i inventory -m shell -a ''echo $HOME'' cen_node_01 | CHANGED
    | rc=0 >> /home/ansible cen_node_02 | CHANGED | rc=0 >> /home/admin1 ansible@master:~/ansible/Chapter-02$
    ```

    ## 文件管理

    文件管理也是大多数系统管理员日常需要处理的常规工作。Ansible可以出色地完成这类任务：例如，如果你有一个文件需要复制到多台服务器上，只需一条Ansible
    ad-hoc（即席）命令就能完成。以下是将文件复制到所有[centos]主机的示例：

    ``` $ ansible centos -i inventory -m copy -a "src=/etc/hosts dest=/tmp/hosts"
    ```

    > *你能感受到Ansible的强大之处吗？*

    假设我们需要将文件复制到数千台服务器上，用Ansible只需一条命令就能完成。

    file（文件）模块允许修改文件的所有权和权限。我们不仅可以复制文件，还能修改文件的权限和Owner相关信息，这一点非常重要。假设你要为某个应用自动化执行文件复制操作，而应用用户没有管理员权限，如果我们仅复制文件，文件的Owner会是执行自动化的用户，该应用将无法使用这个文件。不过，我们可以修改文件权限，实现整个流程的自动化。

    修改权限和Owner信息的命令如下：

    ``` $ ansible centos -i inventory -m copy -a "src=/etc/hosts dest=/tmp/hosts mode=622"
    ```

    ``` $ ansible centos -i inventory -m copy -a "src=/etc/hosts dest=/tmp/hosts mode=622
    owner=app_user group=app_user" ```

    file模块的功能还不止于此，它还可以创建目录，示例如下：

    ``` $ ansible centos -i inventory -m copy -a "src=/var/application dest=/tmp/application
    mode=755 owner=app_user group=mapp_user state=directory" ```

    我们还可以通过以下命令从Ansible托管节点递归删除文件：

    ``` $ ansible centos -i inventory -m copy -a "src=/tmp/application state=absent"
    ```

    ## 包管理

    软件的安装和卸载也可以通过Ansible ad-hoc命令完成。Ansible提供了多个包管理模块，可用于管理软件包。对于Debian和Red Hat系列操作系统，**yum**和**apt**是最常用的模块。使用这两个模块安装软件的语法如下：

    ``` $ ansible centos -m yum -a "name=httpd state=present" $ ansible ubuntu -m
    apt -a "name=apache2 state=present" ```

    **yum**和**apt**模块的输入参数是相同的，因此后续示例中我们仅使用其中一个。

    我们还可以通过以下命令强制Ansible仅安装指定版本的软件包：

    ``` $ ansible centos -m yum -a "name= httpd-2.2.26 state=present" ```

    要确保安装最新版本的软件包，可以使用以下命令：

    ``` $ ansible centos -m yum -a "name=httpd state=latest" ```

    我们还可以卸载软件包，或确保指定的软件包未安装在Ansible托管节点上，具体命令如下：

    ``` $ ansible centos -m yum -a "name=httpd state=absent" ```

    几乎所有包管理器都有对应的Ansible模块。如果你使用的是较老或过时的系统，没有对应的Ansible模块，那么可以使用Ansible的command模块来安装软件包。此外，如果你熟悉Python，还可以自己编写对应的包管理模块。

    ## 用户与组管理

    Ansible ad-hoc模式也可用于创建、删除和管理用户账号，创建用户的ad-hoc命令如下：

    ``` $ ansible centos -i inventory -m user -a "name=alex password=password here"
    ```

    同理，我们可以通过以下命令删除用户：

    ``` $ ansible centos -i inventory -m user -a "name=alex state=absent" ```

    ## 服务管理

    我们可以使用service模块在Ansible托管节点上启动、停止服务。以下示例分别展示了在CentOS主机上启动、停止和重启HTTP服务的命令：

    ``` $ ansible centos -i inventory -m user -a "name=httpd state=started" ```

    ``` $ ansible centos -i inventory -m user -a "name=httpd state=stopped" ```

    ``` $ ansible centos -i inventory -m user -a "name=httpd state=restarted" ```

    ## 信息采集

    信息采集是Ansible的另一项实用功能，它可以收集托管节点的信息并存储为变量，这些变量可用于编写灵活、复杂的自动化任务。以下简单命令可用于获取托管节点上的所有变量：

    ``` $ ansible centos -i inventory -m setup ```

    上述命令会输出大量信息，但这些信息会显示在Ansible控制台中，并不适合查阅如此多的数据。因此，我们可以使用以下命令将所有采集到的信息存储到文件中：

    ``` $ ansible centos -i inventory -m setup --tree /tmp/facts ```

    该命令的巧妙之处在于，它会为每个托管主机创建独立的文件，以主机名命名，并保存到指定目录中。

    上述命令有助于了解整体变量信息，但当你需要查找特定变量时，例如仅显示内存相关的信息，可以使用以下命令：

    ``` $ ansible centos -i inventory -m setup -a ''filter=ansible_*_mb'' ```

    要仅显示特定网卡的相关信息，可以使用以下命令：

    ``` $ ansible centos -i inventory -m setup -a ''filter=ansible_eth[0-2]'' ```

    我们将在本章后续部分介绍信息采集的相关内容，并讲解如何在编写playbook时使用这些信息。至此，你应该已经了解了Ansible ad-hoc模式的基本用法。

    ## Ansible 播放清单

    Ansible ad-hoc模式适合执行单个任务，但大多数人更倾向于使用playbook，因为它支持执行多个任务、使用变量、条件语句等更多功能。通常情况下，我们自动化的某一项活动并非单个任务，而是一系列任务的集合。Ansible
    playbook允许我们使用一种名为YAML的易于理解的语言，组织所有这些任务。

    前一章我们已经了解了Ansible的基础知识，现在让我们通过一个非常简单的任务来了解playbook的编写方法。接下来我们执行两条Linux命令，示例如下：

    Ansible playbook示例如下：

    ``` --- - hosts: centos tasks: - name: Execute uname shell: uname -a>/tmp/ansible_output.txt
    - name: Execute Whoami shell: whoami >>/tmp/ansible_output.txt ```

    ### 说明

    我们为代码添加行号，方便理解playbook的编写方式。再次强调，空格数量在YAML格式中至关重要：

    ``` 1 --- 2 3 - hosts: centos 4 tasks: 5 - name: Execute a uname command on Linux
    6 shell: uname -a>/tmp/ansible_output.txt 7 8 - name: Execute Whoami Command on
    Linux 9 shell: whoami >>/tmp/ansible_output.txt ```

    ### 重要注意事项

    以下是编写Ansible playbook的重要注意事项，请反复阅读直至完全掌握：

    - playbook以三个连字符（---）开头

    - 第3行的连字符后有1个空格，冒号后有1个空格

    - 第4行的tasks前有2个空格

    '
