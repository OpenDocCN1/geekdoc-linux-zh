    \ (or higher) verbose flag is used.\n\nFor example, the same output can be generated\
    \ with the following playbook:\n```yaml\n---\n- hosts: centos\n  tasks:\n    -\
    \ name: Execute whoami command\n      shell: whoami\n      register: whoami_output\n\
    \    - name: Display the output\n      debug:\n        msg: \"{{ whoami_output.stdout_lines\
    \ }}\"\n```\n\n## *Conditional statements in Ansible*\nConditional statements\
    \ in Ansible look quite different from those in other programming languages, but\
    \ their functionality is identical. The first part of a conditional statement\
    \ is a normal task, and the second part is the condition; the task will only execute\
    \ when the condition evaluates to true. We use the special keyword **when** to\
    \ define the condition.\nThe structure of a conditional statement is as follows:\n\
    - **Task:**\n  - Name: Any description (optional)\n  - Module: module parameters\n\
    \  - `when`: Condition\nLet's understand this with a practical example.\nThe following\
    \ is an example Ansible playbook:\n```yaml\n---\n- hosts: all\n  become: yes\n\
    \  tasks:\n```"
