  md: '# Ansible roles


    The Ansible roles provide a uniform way to load variables, tasks, and handlers
    from the external files. The purpose of roles is to keep the size of the playbooks
    manageable. Roles use a specific directory structure with the location for default
    task, handlers, templates, and variables. A role typically corresponds to the
    type of service, for example, we have a role for docker, web service, or database
    service. For specific groups of servers, specific playbooks may be created to
    include one or more roles. To manage what should happen, the default variables
    are set in the roles, which can be overwritten at the playbook level. To make
    working with the role easier, community roles can be downloaded from the Ansible
    galaxy. Roles are defined in a role''s directory, which is created in the project
    directory.'
