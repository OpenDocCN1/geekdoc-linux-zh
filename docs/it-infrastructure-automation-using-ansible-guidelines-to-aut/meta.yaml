    + - geerlingguy.nginx (2.8.0) was installed successfully\n$\n```\nAs per the output,\
    \ the role has been created at the specified location, so we can go to this directory\
    \ and see the content of this role. The following is the output from the folder:\n\
    ```shell\n$ tree .\n├── defaults\n│   └── main.yml\n├── handlers\n│   └── main.yml\n\
    ├── LICENSE\n├── meta\n│   └── main.yml\n├── molecule\n│   └── default\n│    \
    \   ├── converge.yml\n│       └── molecule.yml\n├── README.md\n├── tasks\n│  \
    \ ├── main.yml\n│   ├── setup-Archlinux.yml\n│   ├── setup-Debian.yml\n│   ├──\
    \ setup-FreeBSD.yml\n│   ├── setup-OpenBSD.yml\n│   └── setup-RedHat.yml\n├──\
    \ setup-Ubuntu.yml\n├── vhosts.yml\n├── templates\n│   ├── nginx.conf.j2\n│  \
    \ ├─ nginx.repo.j2\n│   └── vhost.j2\n└── vars\n    ├── Archlinux.yml\n    ├──\
    \ Debian.yml\n    ├── FreeBSD.yml\n    ├── OpenBSD.yml\n    └── RedHat.yml\n8\
    \ directories, 23 files\n$\n```\nNow we can use this role in our playbook.\n##\
    \ Galaxy CLI tool\n`ansible-galaxy search` will search for roles. The argument\
    \ provided with **ansible-galaxy search** will search in the role description.\
    \ We can use options like `--platform` and **--galaxy-tags** to narrow down the\
    \ search results. Let's take the following example to search:\n```shell\n$ ansible-galaxy\
    \ search 'install nginx' --author 'geerlingguy'\n```\nFound 16 roles matching\
    \ your search:\n| Name | Description |\n|-------|-------------|\n| chaos_jetzt.freescout_helpdesk\
    \ | Install and configure the freescout helpdesk. |\n| geerlingguy.certbot | Installs\
    \ and configures Certbot (for Let's Encrypt). |\n| geerlingguy.collectd-signalfx\
    \ | SignalFx Collectd installation for Linux. |\n| geerlingguy.drupal | Deploy\
