    \ 资产清单\nAnsible会同时针对你基础设施中的多台被管节点执行操作，其操作对象是被称为资产清单（inventory）的列表或列表组。一旦你定义了资产清单，就可以通过匹配模式选择需要Ansible执行操作的节点或节点组。默认的资产清单存储位置如下：\n\
    运行脚本时，我们可以指定自定义的资产清单位置，因此如果不同节点上有多个脚本，我们可以为每个脚本配置专属的资产清单文件进行区分。在资产清单文件中，可以填写主机IP地址、主机名，或者创建包含主机名/IP地址的节点组：\n\
    **all**是特殊的默认组，包含资产清单中的所有主机。允许在不同组中重复添加主机，也允许创建嵌套组，还支持按范围添加主机，示例如下：\n``` [db]\n\
    db[01:50].example.com\n```\n上述资产清单表示**db**组包含50台主机，主机名从**db01.example.com**到**db50.example.com**。字母范围的规则同理，示例如下：\n\
    ``` [db]\ndb-[a:f].example.com\n```\n上述资产清单表示**db**组包含6台主机，主机名从**db-a.example.com**到**db-f.example.com**。\n\
    ### 资产清单中的变量\n如需修改web服务器的默认HTTP端口，可以使用以下变量：\n``` [atlanta]\nhost1 http_port=80\
    \ maxRequestsPerChild=808\nhost2 http_port=303 maxRequestsPerChild=909\n```\n\
    如果需要修改SSH专属配置，可以使用以下变量：\n``` Host3.example.com:5309 #Change SSH user for specific\
    \ host\nhost1.example.com ansible_connection=ssh ansible_user=myuser ansible_pass=\"\
    PWD\"\n```\n``` host2.example.com ansible_connection=ssh ansible_user=myotheruser\n\
    ```\n针对实验环境，我们采用以下示例资产清单。\n### 示例资产清单文件\n我们针对以下两种场景提供示例文件：\n- 1台作为主控节点，4台作为被管节点\n\
    - 单台VM同时作为主控节点和被管节点\n### 1台主控节点+4台被管节点的场景\n以下是我们实验环境的资产清单文件，其中包含4台被管节点：\n``` [centos]\n\
    cen_node_01\ncen_node_02\n\n[ubuntu]\nubu_node_01\nubu_node_02 ansible_user=admin1\
    \ ansible_pass=Pass@123\n```\n> **此处使用ansible_pass仅用于学习目的，生产环境中切勿以明文形式存储密码，后续章节我们会对此进行优化。如果你还记得，我们之前排除了未配置免密登录的ubu_node_02节点，此处我们在资产清单中提供SSH凭证来解决该问题。**\n\
    ### 单台VM同时作为主控节点和被管节点的场景\n如果你的笔记本配置较低，无法运行多台VM，可以使用单台Linux VM同时作为Ansible的主控节点和被管节点。若你采用单VM方案，需要使用如下资产清单文件：\n\
    ``` Localhost ansible_connection=localhost\n```\n### 变量说明\n以下变量名含义明确，后续章节编写复杂脚本时会用到：\n\
    - 要连接的主机名称，若该名称与你希望设置的别名不一致时使用\n- SSH连接端口号，当端口非默认值时使用\n- 连接主机时使用的用户名\n- 连接主机进行身份验证时使用的密码\n\
    - 等同于**ansible_sudo**，用于强制提权\n在当前目录中使用上述示例资产清单后，会得到如下输出：\n``` ansible@master:~/.ansible$\
    \ ansible -i inventory centos -m ping\ncen_node_01 | SUCCESS => {\n    \"ansible_facts\"\
    : {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\n    },\n\
    \    \"changed\": false,\n    \"ping\": \"pong\"\n}\ncen_node_02 | SUCCESS =>\
    \ {\n    \"ansible_facts\": {\n        \"discovered_interpreter_python\": \"/usr/bin/python\"\
    \n    },\n    \"changed\": false,\n    \"ping\": \"pong\"\n}\nansible@master:~/.ansible$\n\
    ```\n## Ansible配置文件\n执行Ansible命令或playbook时，Ansible会查找存储了相关参数的**Ansible.cfg**配置文件，查找顺序如下：\n\
    1. **优先级1：** 若设置了ANSIBLE_CONFIG环境变量，则读取该变量指向的文件\n2. **优先级2：** 当前目录下的ansible.cfg文件\n\
    3. **优先级3：** 用户主目录下的ansible.cfg文件\n4. **优先级4：** /etc/ansible/ansible.cfg（默认存储位置）\n\
    Ansible会按上述顺序查找，仅使用第一个找到的配置文件，其余会被忽略。安装Ansible时，会在默认位置生成配置文件。建议为每个脚本或一组脚本配置专属的配置文件，否则Ansible会使用默认配置文件。后续如果有人修改了默认配置文件的参数，你所有的脚本都会受影响，排查问题也会变成极其麻烦的任务。下一节我们会介绍一些基础参数，其余参数会在后续章节讲解：\n\
    - **Inventory=**：可以直接在配置文件中指定资产清单文件，无需在脚本执行时额外传入\n- **Forks=**：表示需要建立的并行连接数量，默认值为5。调大该值可以缩短脚本处理时间，但会给Ansible服务器和网络带来更大负载\n\
    - **sudo_user=**：由于日常任务通常不会使用root用户，此处可以将提权执行的**sudo**用户修改为其他拥有管理员权限的用户\n- **gathering=**：该选项用于收集主机的更多信息，是非常实用的功能，后续章节会详细介绍\n\
    - **timeout=**：该参数用于设置SSH超时时间（单位：秒），实验环境设置为10秒即可，生产环境需要调整为30秒甚至60秒。否则高负载主机上可能会收到超时提示\n\
    ## Ansible模块\n本节我们会详细介绍部分Ansible模块，这是为了后续能练习开发更有实际意义的Ansible剧本。Ansible模块按功能分为不同类别，如前所述，Ansible提供了数百个模块，主要分为以下几类：\n\
    - 云服务模块\n- 集群模块\n- 命令模块\n- 加密模块\n- 数据库模块\n- 文件模块\n- 身份认证模块\n- 资产清单模块\n"
