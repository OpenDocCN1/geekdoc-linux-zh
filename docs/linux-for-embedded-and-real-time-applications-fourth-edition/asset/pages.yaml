- pgno: 183
  md: '# Signals and Slots


    In GUI programming, when one widget changes, say by clicking on a button, we often
    want another widget to be notified. If a user clicks a Close button, we probably
    want the window’s `close()` function to be called.


    Older toolkits achieve this kind of communication using *callbacks*. A callback
    is a function that will be invoked when a processing function needs to notify
    you that some event has occurred. This is typically done by passing a pointer
    to the callback to the processing function.


    QT’s alternative to callbacks is signals and slots. A *signal* is emitted when
    a particular event occurs. QT’s widgets have many predefined signals, but you
    can always subclass widgets to add your own signals to them. A *slot* is a function
    that is called in response to a particular signal. Widgets have many predefined
    slots, but it is common practice to subclass widgets and add your own slots, so
    that you can handle the signals that you are interested in.


    Signals and slots are loosely coupled: a class that emits a signal neither knows
    nor cares which slots, if any, receive the signal. QT’s signals and slots mechanism
    ensures that if you connect a signal to a slot, the slot will be called with the
    signal’s parameters at the right time. Signals and slots can take any number of
    arguments of any type. They are completely type safe.


    All classes that inherit from `QObject` or one of its subclasses, `QWidget` for
    example, can contain signals and slots. An object emits a signal when its state
    changes in a way that may be interesting to other objects. This is all the object
    does to communicate. It does not know or care whether anything is receiving the
    signals it emits. This is true information encapsulation, and ensures that the
    object can be used as a software component.


    Slots can be used for receiving signals, but they are also normal member functions.
    Just as an object does not know if anything receives its signals, a slot does
    not know if it has any signals connected to it. This ensures that truly independent
    components can be created with QT.


    You can connect as many signals as you want to a single slot, and a signal can
    be connected to as many slots as you need. It is even possible to connect a signal
    directly to another signal. This will emit the second signal immediately, whenever
    the first is emitted. Fig. 11.1 illustrates this.'
