    # The “Sandbox”


    If your modifications to u-boot are architecture independent, there is a way to
    do your testing on your workstation. U-boot provides a target “board,” called
    the “sandbox,” in the spirit of the simulation environment we looked at in Chapter
    8, Debugging embedded software. The sandbox runs u-boot as a user space application
    that allows you to use Gnu DeBugger (GDB) to debug your modifications. To build
    the sandbox version you will probably need to install the package `openssl-devel`.


    By default, the sandbox requires something called `libSDL`, where SDL stands for
    Simple DirectMedia Layer. The u-boot documentation implies that this is necessary
    for display and keyboard support. The package is supposedly called `libSDL-1.2-dev`,
    which I could not find in the CentOS repos. You can build the sandbox without
    SDL support by adding `NO_SDL=1` to the make command.


    That is not the whole story, though. You have to edit `include/configs/sandbox.h`.
    Down around line 104 are these three lines:


    ```

    ```

    #define SANDBOX_NO_SDL

    #define CONFIG_SANDBOX_SDL

    #endif

    ```

    ```


    Comment those lines out. Now execute:


    ```

    ```bash

    make NO_SDL=1

    ```

    ```


    The build appears to succeed, but I got the following messages at the end:


    ```

    ```

    ./scripts/dtc-version.sh: line 17: dtc: command not found

    ./scripts/dtc-version.sh: line 18: dtc: command not found

