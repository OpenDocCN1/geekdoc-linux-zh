- pgno: 152
  md: 'Before an attribute object can be used, it must be initialized. Then, any of
    the attributes defined for that object may be set or retrieved with the appropriate
    functions. This must be done before the attribute object is used in a call to
    `pthread_create()`. If necessary, an attribute object can also be “destroyed”.
    Note that a single attribute object can be used in the creation of multiple threads.


    The only required attribute for thread objects is the “detach state”. This determines
    whether or not a thread can be joined when it terminates. The default detach state
    is `PTHREAD_CREATE_JOINABLE`, meaning that the thread can be joined on termination.
    The alternative is `PTHREAD_CREATE_DETACHED`, which means the thread cannot be
    joined.


    Joining is useful if you need the thread’s return value, or you want to make sure
    threads terminate in a specific order. Otherwise, it is better to create the thread
    detached. The resources of a joinable thread cannot be recovered until another
    thread joins it, whereas a detached thread’s resources can be recovered as soon
    as it terminates.


    There are also a number of optional scheduling policy attributes.


    # **Synchronization: Mutexes**


    As soon as we introduce a second independent thread of execution, we create the
    potential for resource conflicts. Consider the somewhat contrived example of two
    threads, each of which wants to print the message “I am Thread $n$” on a single
    shared printer, as shown in Fig. 9.1. In the absence of any kind of synchronizing
    mechanism, the result could be something like “Il a mm TaTasskk 12”.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_152_0.png)


    ```

    Code in Thread n

    `printf("I am thread %d\n", thread);`

    ```


    **Figure 9.1**

    Resource conflict.'
