- pgno: 196
  md: 'My experience has been that building a new kernel is a great confidence building
    exercise, especially if you are new to Linux.


    The remainder of this chapter details and explains the various steps required
    to configure and build an executable kernel image for our target board.


    # Getting Started


    # Where''s the Source Code? Upstream versus Downstream Kernels


    The mainline source code for the Linux kernel resides at www.kernel.org, where
    you can find the code for every version of the kernel back to Linus’ original
    release in 1991. The sources are available in both gzipped tar format (.tgz),
    the slightly smaller bzipped format (.bz2), and the newer xz format (.xz).


    kernel.org is where all kernel development takes place. Code stored here is referred
    to as the upstream kernel. Development at kernel.org is continuous, with a new
    version of the kernel appearing about every 6 weeks to 2 months. As of May 16,
    2017, the latest stable release is 4.11.1 released on May 14.


    It is perfectly OK to use an upstream kernel from kernel.org, provided it supports
    your hardware and the features of your environment. However, Linux distributors
    such as Red Hat and Ubuntu, as well as groups supporting embedded development
    such as BeagleBoard, take an upstream kernel and modify it for their particular
    purposes. The resulting kernel is referred to as a downstream kernel, which is
    generally distributed as a set of patches to a specific upstream kernel.


    The process is illustrated in Fig. 12.1, where the vertical arrow represents the
    ongoing development on the upstream kernel at kernel.org. At some point, the BeagleBoard
    developers decided on version 3.8.13, made the necessary modifications, and released
    their patch set, which we will be using shortly. Likewise, the Red Hat folks settled
    on 3.10.0 for Red Hat Enterprise Linux 7 (CentOS 7), and made their modifications
    to that upstream kernel.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_196_0.png)


    Upstream and downstream kernels.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Kernel Version Numbering


    Generally, Linux sources are installed as subdirectories of `/usr/src/kernels`.
    The subdirectories usually get names of the form:


    ```

    linux-<version_number>-<additional_features>

    ```


    `<version_number>` identifies the base version of the kernel as obtained from
    kernel.org, and looks something like this: 3.8.13. The first number is the "version,"
    in this case 3. Normally, this number increments only when truly major architectural
    changes are made to the kernel and its APIs. The version number was 2 from 1996
    until mid-2011, when Linus arbitrarily rolled the version to 3 in honor of the
    20th anniversary of Linux.


    The second number, 8, is used to identify releases where the kernel APIs may differ,
    but the differences are not enough to justify a full version change. New releases
    appear about every 2 to 3 months.


    The final number, 13 in this example, represents bug and security fixes that do
    not change the kernel APIs. Applications built to a specific release should, in
    principle, run on any security level.


    `<additional_features>` is a way of identifying patches made to an upstream kernel
    to support additional functionality. The `<additional_features>` field is also
    used by the kernel developers to identify developmental source trees known as
    *release candidates*. Starting from a stable kernel release, sufficiently stable
    new code is merged into the mainline to become the next release -rc1. So, for
    example, 3.8.13 would become 3.9-rc1. A period of 6 to 10 weeks of testing and
    patching ensues, with the -rc number being rolled about every week. When the new
    tree is deemed sufficiently stable, the -rcn is dropped and the process starts
    over again.


    Given that you may have multiple kernel source trees in your file system, the
    kernel you are currently working with is usually identified by a symbolic link
    in `/usr/src/kernels` called `linux`.


    # Additional Tools


    Before we actually install the kernel source tree, there are some additional tools
    we need to install in case they are not already on your system. You will, of course,
    need to execute these steps as root user.


    +   * `yum install qt-devel` — This is a graphical environment used by the kernel’s
    make xconfig script.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   * `yum install lzop` — A file compression program that the kernel scripts
    use.

    +   * `yum install sudo` — This is another way to become root user, as was discussed
    in Chapter 3, *Introducing Linux*. Some of the BeagleBoard scripts make use of
    `sudo`.


    You will need to edit the file `/etc/sudoers` (you are still root user, right?)
    to allow your normal user to `sudo`. Good practice says you should only edit `/etc/sudoers`
    with `visudo`, a special version of `vi` that checks the syntax of the file before
    saving, because editing the file wrong could mess up your system. For what it
    is worth, I’ve edited `/etc/sudoers` with `kwrite` and gotten away with it.


    Find the line that reads:


    ```

    root ALL=(ALL) ALL

    ```


    Copy that line and change `root` to your user name. Save the file.


    # *Getting and Installing the BeagleBone Kernel*


    Installing an upstream kernel involves little more than downloading and untarring
    the archive file for the desired version. Installing a downstream kernel is a
    little more complicated because, in addition to downloading the upstream source,
    we have to apply the appropriate patches.


    We will use the source code control tool `git` to get and patch the kernel. We
    will go into `git` in more detail in a later chapter. For now, just follow these
    commands:


    +   * Decide where you want to install the source tree. While the convention is
    `/usr/src/kernels`, there is nothing wrong with installing it under your home
    directory.

    +   * `cd` to the chosen directory.

    +   * `git clone git://github.com/beagleboard/kernel.git`

    +   * `cd kernel`

    +   * `git checkout 3.8`

    +   * `./patch.sh`


    This last step can take a *long* time depending on the speed of your processor,
    and the number of cores. When it is finished, you will have the directory structure
    shown in Fig. 12.2. The most important subdirectory for our purposes is `kernel/`,
    which holds the actual kernel source tree.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_199_0.png)


    Figure 12.2

    BeagleBone kernel structure.


    Finally, we need to get a power management firmware file from another source:


    +   * wget http://arago-project.org/git/projects/?p=am33x-cm3.git\;a=blob_plain\;f=bin/

    +   am335x-pm-firmware.bin\;hb=HEAD -O kernel/firmware/am335x-pm-firmware.bin


    # ### Patching the Kernel


    The mechanism for changing released source code in an orderly manner is the patch
    utility. The input to patch is a text file created by the diff utility that compares
    two files and reports any differences. So, when an Open Source programmer wants
    to distribute an upgrade to released source code, she does a diff between the
    modified code and the original code, redirecting the output of diff to a patch
    file. Something like this:


    ```

    diff -uNPR original_code new_code > file.patch

    ```


    The .patch extension is not required, but is the convention. See the diff man
    page to learn what the various options represent.


    Then, to apply the patch, copy the patch file to the directory containing the
    original code and execute:


    ```

    patch -p1 < file.patch

    ```


    Note that patch diff normally takes its input from stdin, so we have to redirect
    input to the file. The -p1 flag tells patch to remove one slash and everything
    before it from the names of files to be patched. This recognizes the usual situation
    that the root directory from which the patch was created is not the same as the
    directory in which we are applying it. Removing everything in the path before
    the first slash makes the directories relative.


    You could have diff create one gigantic patch file for the entire kernel source
    tree. The BeagleBone developers chose not to do that, opting instead to create
    individual patches for each file that is modified. This adds up to over a 1000
    files in the patches/ subdirectory. The motivation for this is that it is probably
    easier to distribute updates to individual files.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'To get a better feel for patch files, have a look at one or more of the files
    under the patches/ subdirectory. Try, for example, arm/0001-deb-pkg-Simplify-architecture-matching-for-cross-bui.patch.
    This happens to be a patch to a shell script.


    # The Kernel Source Tree


    Needless to say, the kernel encompasses a very large number of files—C sources,
    headers, makefiles, scripts, etc. The BeagleBone version 3.8.13 kernel has 48,683
    files, taking up 1.7 GB. So, not surprisingly, there is a standard directory structure
    to organize these files in a manageable fashion. Fig. 12.3 shows the kernel source
    tree starting at kernel/kernel/. The directories are as follows:


    .git — This hidden folder is not part of the kernel source, but rather has to
    do with git.


    Documentation — Pretty much self-explanatory. This is a collection of text files
    describing various aspects of the kernel, problems, “gotchas,” and so on. There
    are many subdirectories under Documentation/ for topics that require more extensive
    explanations. While the information here is generally useful, it also tends to
    be dated. That is, the documentation was initially written when a particular feature
    was added to the kernel, but it has not been kept up as the feature has evolved.


    arch — All architecture-dependent code is contained in subdirectories of arch.
    Each architecture supported by the kernel has a directory under arch/ with its
    own subdirectory structure. The executable kernel image will end up in arch/<architecture>/boot.
    An environment variable in the makefile, ARCH, points to the appropriate target
    architecture directory. arch/ is one of the two largest subtrees in the kernel,
    comprising just over 15,000 files.


    block — The block layer. This is the code that optimizes transfers with block
    storage devices.


    crypto — Code dealing with the cryptographic aspects of system security.


    drivers — Device driver code. Under drivers is a large number of subdirectories
    for various devices and classes of device. This is the other major kernel subtree,
    with over 14,000 files.


    firmware — Binary firmware files for devices that load firmware at boot time.
    Ultimately these files are to be moved to User Space, because they are, for the
    most part, proprietary and mixing them with the GPL’ed kernel code is “problematic.”


    fs — File systems. Under fs is a set of directories for each type of file system
    that Linux supports.


    include — Header files. The most important subdirectory of include/ is linux/,
    that contains headers for the kernel APIs.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '`init` — The basic initialization code.


    `ipc` — Code to support Unix System 5 Inter-Process Communication mechanisms such
    as semaphores, message passing, and shared memory.


    `kernel` — This is the heart of the matter. Most of the basic architecture-independent
    kernel code that does not fit in any other category is here. This includes things
    like the scheduler and basic interrupt handling.


    `lib` — Several utility functions that are collected into a library.


    `mm` — Memory management functions.


    `net` — Network support. Subdirectories under `net` contain code supporting various
    networking protocols.


    `samples` — Another relatively new addition, this has sample code showing how
    to manage some of the kernel''s internal data structures.


    `scripts` — Text files and shell scripts that support the configuration and build
    process.


    `security` — Offers alternative security models for the kernel


    `sound` — Support for sound cards and the Advanced Linux Sound Architecture.


    `tools` — A performance monitor for the kernel.


    `usr` — Mostly assembly code that sets up linker segments for an initial RAM disk.


    `virt` — A virtual environment for the kernel.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_201_0.png)


    # Figure 12.3


    The kernel source tree.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Kernel Makefile


    kernel/kernel contains a standard makefile, Makefile, with a very large number
    of make targets. By default, the kernel is built for the architecture on which
    the makefile is running, which in the vast majority of cases is some variant of
    the x86. In our case, we want to cross-compile the kernel for our ARM target board.


    As noted above, there is an environment variable, ARCH, that can be set to select
    the architecture to build for. This can be set on the command line that invokes
    make as in:


    ```

    make ARCH=arm

    ```


    Or, what I prefer to do, is edit the makefile to permanently set the value of
    ARCH. Open the makefile in kernel/kernel with your favorite editor,¹ and go to
    line 195, which initially reads:


    ```

    ARCH ?= $(SUBARCH)

    ```


    Change it to read:


    ```

    ARCH ?= arm

    ```


    The next line defines the variable CROSS_COMPILE. This identifies a cross-tool
    chain by specifying a prefix to be added to the tool name. Our ARM cross-tool
    chain is identified by the prefix arm-linux-. You can enter that here or, optionally,
    specify it as part of the configuration process. Save the file and exit from the
    editor.


    Now execute make help. You will see a very long list of make targets in several
    categories. Our specific interest at the moment is the category Architecture specific
    targets (arm): Under that is a large number of target names that end with “_defconfig.”
    These make default configuration files for various ARM-based boards. When building
    a new kernel, it is always good practice to start with a known good configuration.
    Interestingly, the BeagleBone is not among this list of default configurations.
    Execute this command:


    ```

    cp ../configs/beaglebone_arm/configs/beaglebone_defconfig

    ```


    Now execute make beaglebone_defconfig. You will likely see a number of “errors”
    about “recursive dependency detected!” According to the forum at beagleboard.org,
    these are innocuous. The default configuration file .config is created.


    # Configuring the Kernel: make config, menuconfig, xconfig


    The process of building a kernel begins by invoking one of the make targets that
    carry out the configuration process. make config starts a text-based script that
    sequentially steps you


    ¹ There is not much point in using Eclipse for configuring and building the kernel.
    We will not be editing any source files, and the kernel has its own graphical
    configuration tools.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'through each configuration option. For each option you have either three or
    four choices. The three choices are: "y" (yes), "n" (no), and "?" (ask for help).
    The default choice is shown in upper case.


    Some options have a fourth choice, "m", which means build this feature as a loadable
    kernel module rather than build it into the kernel image. Kernel modules are a
    way of dynamically extending the kernel, and are particularly useful for things
    like device drivers.


    Fig. 12.4 shows an excerpt from the make config dialog.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_203_0.png)


    # Figure 12.4

    Make config dialog.


    Most options include help text that is genuinely "helpful" (see Fig. 12.5).


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_203_1.png)


    # Figure 12.5

    Kernel configuration help text.'
  merge: -1
