- pgno: 60
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_60_0.png)


    +   * /sbin  Contains binaries of utilities essential for system administration
    such as booting, recovering, restoring, or repairing the system. These utilities
    are normally only used by the system administrator, and normal users should not
    need /sbin in their path.

    +   * /tmp  Temporary files.

    +   * /usr  Secondary hierarchy, see below.

    +   * /var  Variable data. Includes spool directories and files, administrative
    and logging data, and transient and temporary files. Basically, system-wide data
    that changes during the course of operation. There are a number of subdirectories
    under /var.


    # The /usr hierarchy


    /usr is a secondary hierarchy that contains user-oriented files. Fig. 3.11 shows
    the subdirectories under /usr. Several of these subdirectories mirror functionality
    at the root. Perhaps the most interesting subdirectory of /usr is /src for source
    code. This is where the Linux source is generally installed. You may in fact have
    sources for several Linux kernels installed in /src under subdirectories with
    names of the form:


    ```

    linux-<version number>-ext

    ```


    You would then have a logical link named linux pointing to the kernel version
    you are currently working with.


    # "Mounting" File Systems


    A major difference between Windows and Linux file systems has to do with how file
    structured devices, hard disks, floppy drives, CDROMs, etc., are mapped into the
    system''s directory or hierarchy structure. The Windows file system makes devices
    explicitly visible, identifying them with a letter-colon combination, as in "C:".
    Linux, on the other hand, emphasizes a unified file system in which physical devices
    are effectively rendered invisible.'
