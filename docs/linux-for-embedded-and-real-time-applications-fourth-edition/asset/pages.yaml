- pgno: 68
  md: "# ### Cross-Development Tools: the GNU Tool Chain\n\nNot only is the target\
    \ computer limited in resources, it may be a totally different processor architecture\
    \ from your (probably) x86-based development workstation. Thus, we need a cross-development\
    \ tool chain that runs on the PC but may have to generate code for a different\
    \ processor. We also need a tool that will help us debug code running on that\
    \ (possibly different) target.\n\n# #### Gnu Compiler Collection\n\nBy far the\
    \ most widely used compiler in the Linux world is GCC, the Gnu Compiler Collection.\
    \ It was originally called the Gnu C Compiler, but the name was changed to reflect\
    \ its support for more than just the C language. GCC has language front ends for\
    \ C, C++, Objective C, Fortran, Java, and Ada, as well as run-time libraries for\
    \ these languages.\n\nGCC also supports a wide range of target architectures in\
    \ addition to the x86. Supported targets include:\n\n+   - Alpha\n+   - ARM\n\
    +   - M68000\n+   - MIPS\n+   - PowerPC\n+   - SPARC\n+   among others. In fact,\
    \ the Wikipedia article on GCC lists 43 processors and processor families supported\
    \ by the Free Software Foundation version of GCC.\n\nGCC can run in a number of\
    \ operating environments, including Linux and other variants of Unix. There are\
    \ even versions that run under DOS and Windows.\n\nGCC can be built to run on\
    \ one architecture (a PC for example), while generating code for a different architecture\
    \ (an ARM perhaps). This is the essence of cross-development.\n\nGCC is an amalgam\
    \ of compiler, assembler, and linker. Individual language front ends translate\
    \ source code into an intermediate assembly language format that is then assembled\
    \ by a processor-specific assembler, and ultimately linked into an executable.\
    \ For a program consisting of a single C source file, the command to build an\
    \ executable can be as simple as:\n\n```\n```\n   gcc myprogram.c\n```\n```\n\n\
    By default this creates an executable called `a.out`. The `-o` option lets you\
    \ do the obvious thing and rename the executable thus:\n\n```\n```\n   gcc -o\
    \ myprogram myprogram.c\n```\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: 'If your project consists of multiple source files, the -c option tells GCC
    to compile only.


    ```

    gcc -c myprogram.c

    ```


    generates the relocatable object file *myprogram.o*. Later this can be linked
    with other .o files with another GCC command to produce an executable.


    Generally though, you will not be invoking GCC directly. You will use a *makefile*
    instead.


    # **Make**


    Real-world projects consist of anywhere from dozens to thousands of source files.
    These files have dependencies such that if you change one file, a header for example,
    another file, a C source, needs to be recompiled, and ultimately the whole project
    needs to be rebuilt. Keeping track of these dependencies, and determining what
    files need to be rebuilt at any given time, is the job of a powerful tool called
    the Make utility.


    In response to the shell command *make*, the Make utility takes its instructions
    from a file named *Makefile* or *makefile* in the current directory. This file
    consists of *dependency lines* that specify how a *target file* depends on one
    or more *prerequisite files*. If any of the prerequisite files are more recent
    than the target, *make* updates the target using one or more *construction commands*
    that follow the dependency line. The basic syntax is:


    ```

    target : prerequisite-list

    <tab> construction commands

    ```


    One common mistake to watch out for when writing makefiles is substituting spaces
    for the leading tab in the construction commands. It *must* be a tab.


    Do not let this simple example fool you. There is a great deal of complexity and
    subtlety in the *make* syntax, which looks something like the shell scripting
    language. The sample code that you will download later in the chapter has some
    simple examples of makefiles. In a later chapter, you will configure and build
    the Linux kernel, which has a huge, very involved makefile.


    Often the best way to create a makefile for a new project is to start with the
    one for an existing, similar project.


    # **Gnu DeBugger**


    GDB stands for the “Gnu DeBugger.” This is a powerful source-level debugging package
    that lets you see what is going on inside your program. You can step through the
    code, set breakpoints, examine and change variables, and so on. Like most Linux
    tools, GDB itself is command line driven, making it rather tedious to use. There
    are several graphical front ends'
