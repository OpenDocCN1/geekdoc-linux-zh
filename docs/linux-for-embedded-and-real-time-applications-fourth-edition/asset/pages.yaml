  md: 'the default workspace. In Chapter 5, Eclipse integrated development environment
    we created a managed project for the `record_sort` program.


    Typically though, you have already got a number of projects put together in the
    “conventional” way that you would like to bring into the Eclipse C Development
    Toolkit (CDT) environment. Most of the sample projects in the book already have
    makefiles. The role of a Makefile project, then, is to bring an existing makefile,
    and the files it builds, into the CDT environment.


    In the previous chapter you untarred `samples.tar.gz` into your home directory.
    Now move the resulting `samples/` directory to /home in your target file system.


    For our first project, we will use the program in /home/samples/src/led¹ of your
    target file system to illustrate some basic concepts and verify that CDT is functioning
    properly, and that we can execute a newly built program on the target. Then we
    will look at the `led` program in more detail.


    Start up Eclipse and select `File` -> `New` -> `C Project` to bring up the New
    Project wizard as we did in Chapter 5, Eclipse integrated development environment.
    Enter the project name, “led”, and uncheck the `Use default location` box. Now
    browse to home > samples > src > led, and select it by clicking OK. In the Project
    type: window expand `Makefile project`, and select `Empty Project`. Click `Finish`.
    The project wizard creates the project, which then appears in the Project Explorer
    window on the left.


    There is a very specific reason why the project was created under /home/samples
    rather than the default workspace. The final executable must be visible to the
    target board, so we have to locate it somewhere in the target’s Network File System
    (NFS)-mounted root file system. The alternative would be to create a workspace
    located in the root file system.


    The project should automatically build as part of the creation process. If not,
    right-click the led entry in the Project Explorer view, and select `Build Project`.
    OK, we have built the project, now how do we run it?


    # The Target Execution Environment


    Before proceeding, let us review our set up. The target board has a kernel booted
    from eMMC flash, and a root file system mounted over the network from the host
    workstation. `stdin`, `stdout`, and `stderr` on the target are connected to ttyO0,
    which in turn is physically connected to ttyS0 or ttyUSB0 on the host. We communicate
    with the shell running on the target through the terminal emulation program `minicom`
    Fig. 7.2.


    > ¹ From here on, /home/samples/ will be left off of path names when the usage
    is unambiguous.'
