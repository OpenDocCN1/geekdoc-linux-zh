  md: "`systemd/system/thermostat.service`. This is what causes the thermostat to\
    \ start at boot up. Reboot the board and the thermostat should start running as\
    \ soon as the kernel boots up. To restore the command shell operation, remove\
    \ the link `/etc/systemd/system/multi-user.wants/thermostat.service` that points\
    \ to `/lib/systemd/system/thermostat.service`.\n\n# ## User Space Initialization,\
    \ the “Old Way”\n\nAs of version 7.4, systemd was considered an “experimental”\
    \ feature of Debian. The System V initialization code is still there. Take a look\
    \ at `uEnvnet.txt`. Near the top, the variable `systemd` is defined to redirect\
    \ `init` to `systemd`. That variable is used at the end of the `netargs` definition.\
    \ To restore the System V initialization, simply remove the variable from the\
    \ `netargs` definition.\n\nThe `init` executable is typically `/sbin/init`, although\
    \ there are several alternative locations that the kernel will search. `init`\
    \ gets its instructions from the file `/etc/inittab`. Take a look at that file.\
    \ The comments at the top give a pretty good idea of what is going on. Each entry\
    \ has four fields separated by colons:\n\n```\n```xml\n<id>:<runlevel>:<action>:<process>\n\
    ```\n```\n\n+   * `id` \t try connected to the process. NULL if the process does\
    \ not use a console.\n+   * `runlevel` \t one or more of the seven run levels\
    \ that Linux can start up in. This line will be executed for the specified run\
    \ levels\n+   * `action` \t one of eight ways init will treat the process\n+ \
    \  * `process` \t program to run including arguments if any\n\nThe allowable actions\
    \ are:\n\n+   * `once` \t execute the process once\n+   * `wait` \t execute the\
    \ process once. Init waits until the process terminates\n+   * `askfirst` \t ask\
    \ the user if this process should be run\n+   * `sysinit` \t these processes are\
    \ executed once before anything else executes\n+   * `respawn` \t restart the\
    \ process whenever it terminates\n+   * `restart` \t like respawn\n+   * `shutdown`\
    \ \t execute these processes when the system is shutting down\n+   * `ctrlaltdel`\
    \ \t execute this when init receives a SIGINT signal, meaning the operator typed\
    \ CTRL-ALT-DEL.\n\nNote that the `sysinit` action in this case is to execute the\
    \ `rc5` script.\n\nProbably the easiest way to start up our application is from\
    \ within `inittab`. Find the line near the bottom that reads:\n\n```\n```bash\n\
    T0:23:respawn:/sbin/getty -L tty00 115200 vt102\n```\n```"
