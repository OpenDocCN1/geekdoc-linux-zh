  md: "Back to the program. Or or about line 37 in main(), GPIOp is declared to be\
    \ of type AM3358P_GPIO. The latter is a pointer to a structure declared in am3358_regs.h\
    \ that maps the registers for GPIO1 in the address space.\n\nAround line 42, the\
    \ program opens device /dev/mem. The mem device is a way of referencing memory\
    \ directly from a user space program. Three lines later, we call mmap() to map\
    \ the GPIO1 register section beginning at 0x4804C000 (GPIO1) into our process\
    \ context. Both read and write access to the mapped space are allowed, and it\
    \ is declared as shared, meaning that other processes can simultaneously map to\
    \ the same space. In your minicom window, do ls -l /dev/mem and note that it is\
    \ only writable by root. That is why you need to log into the BBB as root, in\
    \ order to run the led program.\n\nIf mmap() succeeds, it returns a pointer, a\
    \ virtual address, that represents the specified physical space in this process\
    \ context. Normally, we would have to configure the GPIO1 bits representing the\
    \ LEDs as outputs, but the system has already done that for us.\n\nAnother useful\
    \ program is devmem.c in the directory src/devmem/. It maps a specified region\
    \ of memory, and then lets you read and write locations in that region as bytes,\
    \ words, or long words. Have a look. The code is fairly self-explanatory.\n\n\
    # The Makefile\n\nIt is worth taking a look at the project’s makefile for a couple\
    \ of reasons. Open the makefile in the Eclipse editor (Listing 7.1). The first\
    \ thing to notice is the definition of CC. There are several related conventions\
    \ for unambiguously naming GNU tool chains. Shown here is the three-part convention\
    \ consisting of:\n\n<processor>-<operating system>-<tool>\n\n```\n#\n#\n# Makefile\
    \ for ARM/Linux user application\n#\nSHELL = /bin/sh\nCC = arm-linux-gcc\n\nall:\
    \ led\n\nled: led.c\n\t$$(CC)-L../..include -g-o $$@ $$<\n\nclean:\n\t_rm- _f*.o\n\
    \t_rm- _fled\n```\n\nListing 7.1\nMakefile for led project."
