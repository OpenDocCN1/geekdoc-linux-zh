  md: '# *Debugging embedded software*


    +   **Chapter Outline**

    +   **Remote Debugging With Eclipse** 121

    +       Remote Debug Launch Configuration 123

    +   **A Thermostat** 126

    +   **Host Workstation as Debug Environment** 127

    +       Advanced Breakpoint Features 129

