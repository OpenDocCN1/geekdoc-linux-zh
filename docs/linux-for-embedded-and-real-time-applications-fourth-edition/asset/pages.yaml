    The program reads the A/D, and prints the value on stdout. It takes a command
    line argument that is the number of seconds between readings. The default is two.


    This is a good time for me to make an observation about my sample programs. There
    is very little in the way of error or “sanity” checking in these examples. If
    you enter something incorrectly, chances are the program will crash. That is not
    much of a problem in this example, but can be a problem in later examples that
    require more extensive input.


    I feel that adding a lot of error checking code gets in the way of communicating
    the point the example is trying to make. Feel free to add some error checking
    logic if you like.


    Back in the program, the important point to note is that most of the details of
    dealing with the A/D converter and digital I/O are “hidden” behind APIs (Application
    Programming Interface) that present data in a form useful to the application.
    The application need not concern itself with the details of setting up the peripherals,
    it simply calls the appropriate “init” functions. Then it reads and writes data
    until the user terminates the program. Finally, it “closes” the peripheral devices.


    The file `trgrdive.c` implements the “device driver” APIs. The reason for naming
    it “trgrdive” will become apparent in the next chapter. There are two peripheral
    initialization functions: `initAD()` at line 19 and `initDigIO()` at line 54.


    `initDigIO()` opens `brightness` files for two of the user LEDs in `/sys/class/leds`.
    We will use these in the next chapter.


    `initAD()` is where you would normally expect to open a connection to the analog
    input file. But it turns out that the `open()` call triggers the A/D converter.
    I would have expected that to happen in `read()`, but it doesn’t. There appear
    to be mechanisms for triggering the A/D through `/sys`, but again it is not obvious.
    So, for now, `initAD()` is a dummy.


    Reading the A/D converter is handled by the generically named `readAD()` function
    at line 30. It opens the analog channel file, reads one sample, closes the file,
    and returns the binary value.


    Digital output is embodied in three functions: `setDigOut()`, `clearDigOut()`,
    and `writeDigOut()`. These functions simply write the appropriate text value,
    “0” or “1”, to the corresponding `brightness` file.


    `closeAD()` is a dummy. `closeDigIO()` just closes the two `brightness` files.'
