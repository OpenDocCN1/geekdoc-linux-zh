    # ### The Client


    Now look at `netclient.c netclient` determines at run time whether it is connecting
    to a server locally or across the network. We start by creating a socket and an
    address structure in the same manner as in the server. Then we *connect* to the
    server by calling *connect*(). The arguments are:


    +   * The socket descriptor.

    +   * A pointer to the *sockaddr* structure containing the address of the server
    we want to connect to.

    +   * The length of the *sockaddr* structure.


    When *connect*() returns, we are ready to transfer data. The client prompts for
    a text string, writes this string to the socket, and waits to read a response.
    The process terminates when the first character of the input string is “q.”


