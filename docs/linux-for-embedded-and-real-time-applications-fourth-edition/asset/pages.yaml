    the base contained in the descriptor. If the resulting address is greater than
    the limit specified in the descriptor, the processor signals a memory protection
    fault.


    A descriptor is an 8-byte object that tells us everything we need to know about
    a block of memory.


    +   *   Base Address[31:0]: Starting address for this block/segment.

    +   *   Limit[19:0]: Length of this segment. This may be either the length in
    bytes (up to 1 Mbyte), or the length in 4 Kbyte pages. The interpretation is defined
    by the Granularity bit.

    +   *   Type: A 4-bit field that defines the kind of memory that this segment
    describes S 0 = this descriptor describes a “System” segment. 1 = this descriptor
    describes a code ordta segment.

    +   *   DPL. Descriptor Privilege Level: A 2-bit field that defines the minimum
    privilege level required to access this segment.

    +   *   P  Present: 1 = the block of memory represented by this descriptor is
    present in memory. Used in paging.

    +   *   G  Granularity: 0 = Interpret Limit as bytes. 1 = Interpret Limit as 4
    Kbyte pages.


    Note that, with the Granularity bit set to 1, a single segment descriptor can
    represent the entire 4 Gbyte address space.


    Normal descriptors (S bit = 1) describe memory blocks representing data or code.
    The Type field is four bits, where the most significant bit distinguishes between
    Code and Data segments. Code segments are executable, data segments are not. A
    CS may or may not also be readable. A data segment may be writable. Any attempted
    access that falls outside the'
