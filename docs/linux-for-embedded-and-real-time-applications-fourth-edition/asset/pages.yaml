    # "Flat" Versus Segmented Memory Models


    Because a single descriptor can reference the full 4 Gbyte address space, it is
    possible to build your system by reference to a single descriptor. This is known
    as "flat" model addressing and is, in effect, a 32-bit equivalent of the addressing
    model found in most 8-bit microcontrollers, as well as the "tiny" memory model
    of DOS. All memory is equally accessible, and there is no protection.


    Linux actually does something similar. It uses separate descriptors for the operating
    system and each process so that protection is enforced, but it sets the base address
    of every descriptor to zero. Thus, the offset is the same as the virtual address.
    In effect, this does away with segmentation.


    # Paging


    Paging is the mechanism that allows each task to pretend that it owns a very large
    flat address space. That space is then broken down into 4 Kbyte pages. Only the
    pages currently being accessed are kept in main memory. The others reside on disk.


    As shown in Fig. 3.7, paging adds another level of indirection. The 32-bit linear
    address derived from the selector and offset is divided into three fields. The
    high-order 10 bits serve as an index into the Page Directory. The Page Directory
    Entry points to a Page Table. The next 10 bits in the linear address provide an
    index into that table. The Page Table Entry (PTE) provides the base address of
    a 4 Kbyte page in physical memory called a Page


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '*Frame*. The low order 12 bits of the original linear address supplies the
    offset into the page frame. Each task has its own Page Directory pointed to by
    processor control register CR3.


    At either stage of this lookup process, it may turn out that either the Page Table
    or the Page Frame is not present in physical memory. This causes a *Page Fault*,
    which in turn causes the operating system to find the corresponding page on disk
    and load it into an available page in memory. This in turn may require “swapping
    out” the page that currently occupies that memory.


    A further advantage to paging is that it allows multiple tasks or processes to
    easily share code and data by simply mapping the appropriate sections of their
    individual address spaces into the same physical pages.


    Paging is optional, you don’t have to use it, although Linux does. Paging is controlled
    by a bit in processor register CR0.


    Page Directory and Page Table entries are each 4 bytes long, so the Page Directory
    and Page Tables are a maximum of 4 Kbytes, which also happens to be the Page Frame
    size. The high-order 20 bits point to the base of a Page Table or Page Frame.
    Bits 9 to 11 are available to the operating system for its own use. Among other
    things, these could be used to indicate that a page is to be “locked” in memory,
    i.e., not swappable.


    Of the remaining control bits the most interesting are:


    +   - P  Present: 1 = this page is in memory. If this bit is 0, referencing this
    Page Directory or PTE causes a page fault. Note that when $P = 0$ the remainder
    of the entry is not relevant.

    +   - A  Accessed: 1 = this page has been read or written. Set by the processor
    but cleared by the OS. By periodically clearing the Accessed bits, the OS can
    determine which pages have not been referenced in a long time, and are therefore
    subject to being swapped out.

    +   - D  Dirty: 1 = this page has been written. Set by the processor but cleared
    by the OS. If a page has not been written to, there is no need to write it back
    to disk when it has to be swapped out.


    # **64-Bit Paging**


    The paging model thus far described is for 32-bit x86 processors. It is described
    as a 10-10-12 model, because the 32-bit linear address is divided into three fields
    of, respectively, 10 bits, 10 bits, and 12 bits. In a 64-bit machine, entries
    in the Page Directory and Page Table are 8 bytes, so a 4 KB page holds 512 entries,
    or 9 bits. Current 64-bit processors only implement 48 bits of physical addressing
    for a maximum of 256 TB of memory. Two more tiers of address translation are added
    to yield a 9-9-9-9-12 model.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The Linux Process Model


    OK, back to Linux. The basic structural element in Linux is a process consisting
    of executable code and a collection of resources like data, file descriptors,
    and so on. These resources are fully protected, such that one process cannot directly
    access the resources of another. In order for two processes to communicate with
    each other, they must use the interprocess communication mechanisms defined by
    Linux, such as shared memory regions or pipes.


    This is all well and good as it establishes a high degree of protection in the
    system. An errant process will most likely be detected by the system and thrown
    out before it can do any damage to other processes (see Fig. 3.8). But there is
    a price to be paid in terms of excessive overhead in creating processes and using
    the interprocess communication mechanisms.


    A thread on the other hand is code only. Threads only exist within the context
    of a process, and all threads in one process share its resources. Thus, all threads
    have equal access to data memory and file descriptors. This model is sometimes
    called lightweight multitasking, to distinguish it from the Unix/Linux process
    model.


    The advantage of lightweight tasking is that interthread communication is more
    efficient. The drawback, of course, is that any thread can clobber any other thread''s
    data. Historically, most real-time operating systems have been structured around
    the lightweight model. In recent years, of course, the cost of memory protection
    hardware has dropped


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_51_0.png)'
  merge: -1
  img_proc: true
