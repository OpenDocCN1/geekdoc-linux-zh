    # **“Real” Web Servers**


    While `webserve.c` is a useful introduction to HTTP processing, it is rather limited.
    Fortunately, the open source world includes a number of practical web servers
    that are suitable for embedded applications. The Resources section includes a
    link to a Wikipedia article that provides a very useful comparison of web servers.
    Many of these are specifically intended for embedded use, while others were developed
    as a proof-of-concept to see just how small one could make a web server.


    # **Apache**


    Apache is a full-featured, open source, web server that, as of July 2016, runs
    46% of the world’s active websites, and 43% of the top million websites.⁵ It also
    happens to be installed in our BBB root file system and running. If you point
    your web browser at your target board’s IP address, you will see a web page that
    talks about BoneScript.


