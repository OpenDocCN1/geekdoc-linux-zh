  md: 'favorite Linux distribution, I would recommend CentOS, at least while you''re
    working through the book.


    # SUSE


    SuSE was originally developed in Germany, with the initial release in 1994 making
    it the oldest existing commercial distribution. The name is a German acronym for
    Software und System Entwicklung (Software and Systems Development). The name was
    subsequently changed to SUSE, and is no longer considered an acronym.


    Novell acquired SUSE Linux AG in 2003, and in 2005 announced the openSUSE project
    to allow outside developers to participate. SUSE Linux is available in two forms:
    openSUSE, driven by the openSUSE project; and SUSE Linux Enterprise, a commercial
    version. Much like Fedora, openSUSE is on the “bleeding edge” of Linux development
    with an aggressive release schedule, while SUSE Linux Enterprise sticks to a more
    conservative schedule.


    # Hardware Requirements


    Having selected a distribution, you need something to run it on. Any modern PC
    will work just fine as a development host. Minimum requirements are: a Pentium
    class processor, 1 GB of RAM for graphical operation, and at least 20 Gbytes of
    disk for a “workstation” class Linux installation. Of course, more RAM and disk
    is always better.


    While you can “get by” with 20 GB of disk, later we’ll be building the Yocto project,
    which requires more like 50 GB. I do most of my Linux work on a “virtual” machine
    (more about that later) running under Windows 7 on an HP laptop. The virtual machine
    gets 1 GB of RAM and has a 65 GB disk. I currently run CentOS 7.


    You will need at least one asynchronous serial port. A USB-to-serial converter
    should work fine. You will also need a network interface. We’ll use a combination
    of serial and network ports to communicate with the target, as well as to debug
    target code.


    # Installation Scenarios


    The next decision then is how you want to install Linux. There are basically three
    installation scenarios.


    # Stand-Alone


    This is the obvious choice if you can dedicate a machine to Linux. You will let
    the installation process format the entire disk.'
