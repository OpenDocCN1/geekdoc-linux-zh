    > *Anonymous*


    Embedded computing covers an extremely wide range of hardware, from the (probably)
    8-bit processor that powers your automatic coffee maker, to the (perhaps multicore)
    32-bit or 64-bit processor in your cell phone or tablet, up to the massively parallel
    processing environment that runs the telecommunications network. In this chapter,
