    and service response time requirements of telecommunication networks. Today, carriers
    and service providers are embracing “open architecture” and moving to COTS (commercial
    off-the-shelf) hardware and software in an effort to drive down costs while still
    maintaining carrier class performance.


    Linux plays a major role in the move to open, standards-based network infrastructure.
    In 2002, the Open Source Development Lab (OSDL) set up a working group to define
    “Carrier Grade Linux” (CGL) in an effort to meet the higher availability, serviceability,
    and scalability requirements of the telecom industry. The objective of CGL is
    to achieve a level of reliability known as “five nines,” meaning the system is
    operational 99.999% of the time. That translates into no more than about 5 minutes
    of downtime in a year.


    # Open Source Licensing


    Most End User License Agreements for software are specifically designed to restrict
    what you are allowed to do with the software covered by the license. Typical restrictions
    prevent you from making copies or otherwise redistributing it. You are often admonished
    not to attempt to “reverse-engineer” the software.


    By contrast, an Open Source license is intended to guarantee your rights to use,
    modify, and copy the subject software as much as you like. Along with the rights
    comes an obligation. If you modify and subsequently distribute software covered
    by an Open Source license, you are obligated to make available the modified source
    code under the same terms. The changes become a “derivative work,” which is also
    subject to the terms of the license. This allows other users to understand the
    software better, and to make further changes if they wish.


    Open Source licenses are called “copyleft” licenses, a play on the word copyright
    intended to convey the idea of using copyright law as a way of enhancing access
    to intellectual property like software, rather than restricting it. Whereas copyright
    is normally used by an author to prevent others from reproducing, adapting, or
    distributing a work, copyleft'
