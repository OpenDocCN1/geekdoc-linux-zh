    to find out what is there.


    Finally, no discussion of getting help for Linux would be complete without mentioning
    Google. When you are puzzling over some strange behavior in Linux, Google is your
    friend. One of my common frustrations is error messages, because they rarely give
    you any insight into what really went wrong. So type a part of the error message
    into the Google search box. You''ll likely get back at least a dozen hits of forum
    posts that deal with the error, and chances are something there will be useful.


    With a good basic understanding of Linux, our next task is to configure the development
    workstation and install the software that will allow us to develop target applications.


    # Resources


    Sobell, Mark G., *A Practical Guide to Linux*. This book has been my bible and
    constant companion since I started climbing that steep Linux learning curve. It
    is an excellent beginner’s guide to Linux and Unix-like systems in general, although
    having been published in 1997 it is getting a bit dated and hard to find. It has
