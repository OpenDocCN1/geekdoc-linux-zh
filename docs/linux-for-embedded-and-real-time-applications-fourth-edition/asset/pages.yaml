  md: 'may seem like a lot, there are some problems that can benefit from running
    thousands of threads.


    The result of this new development effort is the Native Posix Threading Library,
    or NPTL, which is now the standard threading implementation in 2.6 and 3.x series
    kernels. It too treats each thread as a separately schedulable entity, but takes
    advantage of improvements in the kernel that were specifically intended to overcome
    the limitations in LinuxThreads. The `clone()` call was extended to optimize thread
    creation. There is no longer a limit on the number of threads per process, and
    the new Completely Fair Scheduler can handle thousands of threads without excessive
    overhead. A new synchronization mechanism, the Fast Mutex or “futex”, handles
    the noncontention case without a kernel call.


    In tests on an IA-32, NPTL is reportedly able to start 100,000 threads in two
    seconds. By comparison, this test under a kernel without NPTL would have taken
    around 15 minutes.


    # Upgrading the Thermostat


    We now have enough background to add a thread to our thermostat to monitor the
    serial port for changes to the parameters. We will use a very simple protocol
    to set parameters consisting of a letter followed by a space followed by a number.
    “s” represents the setpoint, “l” the limit, and “d” the deadband. So, to change
    the setpoint you would enter, for example:


    ```

    s 65<Enter>

    ```


    This sets the setpoint to 65 degrees.


    Copy `thermostat.c` that currently resides in `src/measure/` to `src/posix/`.
    Create a new Eclipse project called “posix”, located in the `home/samples/src/posix/`
    directory. Again, be sure it is a makefile project, and import the project settings
    with the include paths. Open `monitor.c`. The first thing to notice is `#include
    <pthread.h>`. This header file prototypes the Pthreads API. Note the declarations
    of `paramMutex` and `monitor`. The latter will become the handle for our monitor
    thread.


    Because the parameters, `setpoint`, `limit`, and `deadband`, are accessed independently
    by the two threads, the thermostat and monitor, we need a mutex to guarantee exclusive
    access to one thread or the other. In reality, this particular application probably
    does not absolutely require the mutex, because the shared resources are simple
    integers and access to them should be atomic. But it does serve to illustrate
    the point.


    Note, incidentally, that `setpoint`, `limit`, and `deadband` are declared `extern`
    in `thermostat.h`. It is assumed that these variables are allocated in `thermostat.c`.
    If you happened to use different names for your parameters, you will need to change
    them to match.'
