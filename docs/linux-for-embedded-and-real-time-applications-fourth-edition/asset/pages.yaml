    > *We are using Linux daily to UP our productivity – so UP yours!*

    > *Adopted from Pat Paulsen by Joe Sloan*


    A great many embedded devices today have GUIs, graphical user interfaces, some
    of them quite sophisticated. In this chapter we will explore one approach to developing
    graphical interfaces, the *QT* library, and associated tools.


    *QT* (pronounced “cute,” not “cutee”) is a cross-platform application framework
    used for developing applications that can run on a variety of platforms with little
    or no change to the underlying code base. While it is primarily aimed at developing
    graphical applications, it is also useful for developing command line tools and
    server consoles. QT is available in both an open source version licensed under
    LGPL 2.1, LGPL 3.0, and GPL 3.0, and a commercial version from the QT Company
    of Finland.


    # Getting and Installing QT


    The open source QT library is available from the CentOS 7 repositories. As root
    user, execute the following:


    ```

    ```bash

    yum install qt

    yum install qt-devel

    ```

    ```'
