- pgno: 80
  md: 'Integrated development environments (IDE) are a great tool for improving productivity.
    Desktop developers have been using them for years. Perhaps the most common example
    is Microsoft’s Visual Studio environment. In the past, a number of embedded tool
    vendors have built their own proprietary IDEs.


    In the Open Source world, the IDE of choice today is Eclipse, also known as the
    Eclipse Platform, and sometimes just the Platform. The project was started by
    Object Technology International, which was subsequently purchased by IBM. In late
    2001, IBM and several partners formed an association to promote and develop Eclipse
    as an Open Source project. It is now maintained by the Eclipse Foundation, a nonprofit
    consortium of software industry vendors. Several leading embedded Linux vendors
    such as Monta Vista, TimeSys, LinuxWorks, and Wind River Systems have embraced
    Eclipse as the basis for their future IDE development.


    I would go so far as to say that Eclipse is the most professional, well-run open
    source project out there. Every year for over 10 years, in the middle of June,
    the foundation publishes a major new release of the platform and most of the related
    projects, amounting to something like 20 to 30,000,000 lines of code. Up until
    2011, these releases were named after the moons of Jupiter in alphabetical order.
    The 2010 release was called Helios. The 2011 release broke with that tradition
    and was called Indigo.


    It should be noted that Eclipse is not confined to running under Linux. It runs
    just as well under various Windows operating systems.


    # Overview


    “Eclipse is a kind of universal tool platform—an open, extensible IDE for anything
    and nothing in particular. It provides a feature-rich development environment
    that allows the developer to efficiently create tools that integrate seamlessly
    into the Eclipse platform,” according to the platform’s own on-line overview.
    Technically, Eclipse itself is not an IDE, but is rather an open platform for
    developing IDEs and rich client applications.


    Fig. 5.1 shows the basic Eclipse workbench. It consists of several views including:


    +   - Navigator – shows the files in the user’s workspace;

    +   - Text Editor – shows the contents of a file;

    +   - Tasks – a list of “to dos”;

    +   - Outline – of the file being edited. The contents of the outline view are
    content-specific.


    Although Eclipse has a lot of built-in functionality, most of that functionality
    is very generic. It takes additional tools to extend the platform to work with
    new content types, to do new things with existing content types, and to focus
    the generic functionality on something specific.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_81_0.png)


    # **Figure 5.1**

    The Eclipse workbench.


    The Eclipse Platform is built on a mechanism for discovering, integrating, and
    running modules called *plug-ins*. A tool provider writes a tool as a separate
    plug-in that operates on files in the workspace and exposes its tool-specific
    UI in the workbench. When you launch Eclipse, it presents an IDE composed of the
    set of available plug-ins.


    The Eclipse platform is written primarily in Java, and in fact was originally
    designed as a Java development tool. Fig. 5.2 shows the platform’s major components
    and Application Programming Interfaces (APIs). The platform’s principal role is
    to provide tool developers with mechanisms to use, and rules to follow, for creating
    seamlessly integrated tools. These mechanisms are exposed via well-defined API
    interfaces, classes, and methods. The platform also provides useful building blocks
    and frameworks that facilitate developing new tools.


    Eclipse is designed and built to meet the following requirements:


    +   - Support the construction of a variety of tools for application development.

    +   - Support an unrestricted set of tool providers, including independent software
    vendors.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_82_0.png)


    **Figure 5.2**

    Eclipse plattform.


    +   - Support tools to manipulate arbitray conteng types such as HTML, Java, C,
    JSP, EJB, XML, and GIF.

    +   - Facilitate seamless integration of tools within and across different content
    types and tool providers.

    +   - Support both GUI and non-GUI-based application development environments.

    +   - Run on a wide range of operating systems, including Windows and Linux.

    +   - Capitalize on the popularity of the Java programming language for writing
    tools.


    # ### *Plug-ins*


    A *plug-in* is the smallest unit of Eclipse functionality that can be developed
    and delivered separately. A small tool is usually written as a single plug-in,
    whereas a complex tool may have its functionality split across several plug-ins.
    Except for a small kernel known as the Plattform Runtime, all of the Eclipse plattform’s
    functionality is located in plug-ins.


    Plug-ins are coded in Java. A typical plug-in consists of Java code in a JAR library,
    some read-only files, and other resources such as images, web templates, mesage
    catalogs, native code libraries, etc. Some plug-ins do not contain code at all.
    An example is a plug-in that contributes on-line help in the form of HTML pages.
    A single plug-in’s code libraries and read-only content are located together in
    a directory in the file system, or at a base URL on a server.


    Each plug-in’s configuration is described by a pair of files. The *manifest* file,
    `manifest.mf`, declares essential information about the plug-in, including the
    *name*, *version*, and dependencies to other plug-ins. The second optional file,
    `plugin.xml`, declares the plug-in’s'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'interconnections to other plug-ins. The interconnection model is simple: a
    plug-in declares any number of named *extension points*, and any number of *extensions*
    to one or more extension points in other plug-ins.


    The extension points can be extended by other plug-ins. For example, the workbench
    plug-in declares an extension point for user preferences. Any plug-in can contribute
    its own user preferences by defining extensions to this extension point.


    # **Workbench**


    The Eclipse *workbench* API, user interface (UI), and implementation are built
    from two toolkits:


    +   - Standard Widget Toolkit (SWT) – a widget set and graphics library integrated
    with the native window system, but with an OS-independent API.

    +   - JFace – a UI toolkit implemented using SWT that simplifies common UI programming
    tasks.


    Unlike SWT and JFace, which are both general purpose UI toolkits, the workbench
    provides the UI personality of the Eclipse Platform, and supplies the structures
    in which tools interact with the user. Because of this central and defining role,
    the workbench is synonymous with the Eclipse Platform UI as a whole, and with
    the main window you see when the Platform is running (see Fig. 5.1). The workbench
    API is dependent on the SWT API, and to a lesser extent on the JFace API.


    The Eclipse Platform UI paradigm is based on editors, views, and perspectives.
    From the user’s standpoint, a workbench window consists visually of views and
    editors. Perspectives manifest themselves in the selection and arrangements of
    editors and views visible on the screen.


    *Editors* allow you to open, edit, and save objects. They follow an open-save-close
    lifecycle, much like file system-based tools, but are more tightly integrated
    into the workbench. When active, an editor can contribute actions to the workbench
    menus and tool bar. The platform provides a standard editor for text resources;
    other plug-ins supply more specific editors.


    *Views* provide information about some object that you are working with. A view
    may assist an editor by providing information about the document being edited.
    For example, the standard content outline view shows a structured outline for
    the content of the active editor, if one is available. A view may augment other
    views by providing information about the currently selected object. For example,
    the standard properties view presents the properties of the object selected in
    another view. The platform provides several standard views; additional ones are
    supplied by other plug-ins.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'A workbench window can have several separate *perspectives*, only one of which
    is visible at any given moment. Each perspective has its own views and editors
    that are arranged (tiled, stacked, or detached) for presentation on the screen,
    although some may be hidden. Several different types of views and editors can
    be open at the same time within a perspective. A perspective controls initial
    view visibility, layout, and action visibility. You can quickly switch perspectives
    to work on a different task, and can easily rearrange and customize a perspective
    to better suit a particular task. The platform provides standard perspectives
    for general resource navigation, on-line help, and team support tasks. Other plug-ins
    provide additional perspectives.


    Plug-in tools may augment existing editors, views, and perspectives to:


    +   - Add new actions to an existing view’s local menu and tool bar.

    +   - Add new actions to the workbench menu and tool bar when an existing editor
    becomes active.

    +   - Add new actions to the pop-up content menu of an existing view or editor.

    +   - Add new views, action sets, and shortcuts to an existing perspective.


    # **Installation**


    There are two parts to Eclipse; Eclipse itself and the Java Runtime Engine (JRE).
    Download Eclipse from eclipse.org. There are several versions to choose from.
    Since we are interested in C development, get the Eclipse IDE for C/C++ Developers.


    You can put Eclipse wherever you like. I chose to install it in /usr/local. After
    untarring, you will find a new subdirectory called, not surprisingly, eclipse/.


    Since Eclipse is written primarily in Java, you’ll need a JRE to support it. Most
    contemporary Linux distributions install a JRE by default, but it may not be compatible
    with Eclipse. The version supplied with CentOS 7 works fine. If necessary, download
    the latest version from Oracle (formerly Sun Microsystems). The download is available
    either as a binary executable or an RPM package. Copy it wherever you like and
    execute it. /usr/local is a good place. You will be asked to read and accept the
    Binary Code License Agreement for the Java SE runtime environment (JRE) version
    6. You will need to add thebin/ directory of the newly-installed JRE to your PATH.


    That’s it! Eclipse is installed and ready to go. In a shell window, cd to the
    eclipse/ directory and execute ./eclipse. From anywhere else, enter the complete
    path to the eclipse executable. Or just double-click it in a K Desktop Environment
    file manager window.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Or better yet, create a script file named **eclipse** in directory `/usr/bin`.
    It contains the following:


    ```

    #!/bin/bash

    /usr/local/eclipse/eclipse &

    ```


    The first line identifies this file as a shell script. The second line executes
    Eclipse. The “&” says run this program in the background and return the shell
    prompt. Since `/usr/bin` is in your path, all you have to type is **eclipse**.


    # ## Using Eclipse


    Every time Eclipse starts up, it asks you to select a *workspace*, a place where
    your project files are held. The default is a directory called *workspace*/ under
    your home directory. Under *workspace*/ then are subdirectories for each project.
    Following the workspace dialog, if this is the first time you have executed Eclipse,
    you’ll see the Welcome screen. On subsequent runs, Eclipse opens directly in the
    workbench, but you can always access this window from the first item on the Help
    menu, Welcome.


    The Tutorial icon on the Welcome screen leads you to a very good, very thorough
    introduction to using Eclipse. If you are new to the Eclipse environment, I strongly
    suggest you go through it. There is no point in duplicating it here. Go ahead,
    I’ll wait.


    OK, now you have a pretty good understanding of generic Eclipse operation. It
    is time to get a little more specific, and apply what we have learned to C software
    development for embedded systems. Since you are running the CDT version of Eclipse,
    you will see the **C/C++** perspective initially.


    # ## The C Development Environment (CDT)


    Among the ongoing projects at Eclipse.org is the tools project. A subproject of
    that is the **C/C++ Development Tools (CDT)** project that has built a fully functional
    C and C++ IDE for the Eclipse platform. CDT under Linux is based on GNU tools
    and includes:


    +   - **C/C++** Editor with syntax coloring;

    +   - **C/C++** Debugger using GDB;

    +   - **C/C++** Launcher for external applications;

    +   - Parser;

    +   - Search Engine;

    +   - Content Assist Provider;

    +   - Makefile generator.'
  merge: -1
  img_proc: true
