- pgno: 109
  md: 'simply connect the board to your workstation through the USB cable, which supplies
    up to 500 mA of power for the board.


    The board''s USB slave port is a multifunction device that appears as:


    +   * Mass storage device that appears at boot under the normal path for removable
    devices (`/run/media/`your_user`> in CentOS 7)

    +   * Serial port. Device name is `/dev/ttyACM0`

    +   * Network device with IP address 192.168.7.2.


    Mount the board''s mass storage device, and scan through the START.htm page in
    Firefox. Among other things, it will instruct you to execute the script file mkudevrule.sh.
    This is necessary in order to utilize the board''s serial and network ports. It
    would probably be a good idea to reboot your workstation after this, to make sure
    that the changes have been implemented.


    Now fire up minicom. You should see a screen like Fig. 6.8. The board gives you
    a normal user password, or you can log in as root with no password. Try a few
    shell commands just to prove it really is a Linux shell. Execute uname-a to verify
    that you really are talking to a BeagleBoard.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_109_0.png)


    **Figure 6.8**

    BeagleBoard serial port.


    Finally, in another shell window, execute ssh -l debian@192.168.7.2. You will
    be asked for the same password as the minicom shell. Or, again, you can log in
    as root with no password.


    So, you have two options for getting shell access to the target board: the serial
    port, or SSH over the network. Both of these operate over the same USB interface.


    You will also want to connect your BBB to your network through the Ethernet port,
    so you can Dynamic Host Configuration Protocol (DHCP) an IP address.'
