    # **Try it out**


    It is interesting to see how many processes Linux spawns just by booting up. Reboot
    your system, open a command shell and execute:


    ```

    `ps -A | wc`

    ```


    The `ps` command lists the processes running on the system. The output of `ps`
    is one line per process. The `wc` command counts the number of lines, words, and
    characters passed to it. The number of lines is essentially the number of processes
    running. On my CentOS 7 system, there are 188 processes running.


    Now try:


    ```

    `ps -A | more`

    ```


    This command lets you see the output of `ps` one page at a time. Note that the
    information for the `ps` command comes from the `/proc` file system.


    Here''s another command that highlights the real-time nature of `/proc` data.
    Execute:


    ```

    `cat /proc/interrupts`

    ```


    The `interrupts` file lists all of the interrupt sources in the system, the number
    of times each interrupt has fired off since the system was booted, and the driver
    registered to the interrupt. Now execute the command again:


    ```

    `cat /proc/interrupts`

    ```


    You will see that many of the numbers have gone up, thus proving that the data
    is being generated dynamically.'
