- pgno: 90
  md: 'However, if you move the cursor out of the enclosed space, to copy and paste
    some text for example, the `Enter` key reverts to its normal behavior of starting
    a new line.


    In the case of an opening brace, the closing brace is positioned according to
    the currently selected coding style, and the cursor is properly indented.


    Finally, notice that as you type, appropriate entries appear in the Outline view
    identifying header files, functions, and, if we had any, global variables.


    # The Program


    Before moving on to building and running the project, let us take a closer look
    at what it actually does. `main()` itself is pretty straightforward. It is just
    a set of calls to functions declared in `sort_utils.c` that do the real work.


    The function `read_file()` reads in a data file assumed to be organized as one
    record per line, where a record is a text name and a numeric ID. It allocates
    memory for an array of records, and a separate allocation for each name field.


    There are two sort functions—one to sort on the name field, and the other to sort
    on the ID field. Both of these implement the shell sort algorithm, named after
    its inventor Donald Shell. Shell sort improves performance over the simpler insertion
    sort by comparing elements separated by a gap of several positions.


    After the record array is sorted, `write_sorted()` writes it to `stdout`. This,
    of course, could be redirected to a file.


    The final step is to return all of the allocated memory in the function `return_records()`.


    The program does virtually no “sanity checking” and, if you are so inclined, you
    might want to build some in. There is also very little in the way of error checking.


    # Building the Project


    Once you have completed and saved the `record_sort.c` file, the next step is to
    build the project. All files that are created in, or imported into, a project
    automatically become a part of it, and are built and linked into the final executable.


    In the Project Explorer view, select the top-level `record_sort` entry. Then execute
    `Project > Build Project` or right-click and select `Build Configurations > Build
    > All`. In the former case, the `Active Configuration` will be built. By default
    this is the Debug configuration. The Active Configuration can be changed by executing
    `Project > Build Configurations > Set Active`.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'In the latter case, both the Debug and Release configurations will be built.
    In either case, one or two new entries will show up under `record_sort` in the
    Project Explorer view. These entries represent subdirectories called `Debug` and
    `Release` that hold, respectively, the object and executable files for the corresponding
    build configurations. Each also contains a makefile and some Eclipse-specific
    files.


    Initially, the build will fail because some compile-time errors and warnings have
    been built into `sort_utils.c`. Open the Problems view, expand the Errors entry,
    and right-click on the item that says “`record_t` has no member named ‘id’.” Select
    Go To to open `sort_utils.c`, if it is not already open, and highlight the line
    that has the error. The correction should be fairly obvious.


    Eclipse CDT identifies build problems in several different ways. In the Project
    Explorer view, any project and source file that have problems are flagged with
    a red X icon for errors, or a yellow shield icon with a “!” to indicate a warning.
    When a source file with errors or warnings is opened in the Editor, the tab shows
    the same symbol. The Outline view then uses the same icons to show which functions
    in the file have either errors or warnings.


    The Editor window uses the same icons to identify the line on which each error
    or warning occurs. You can scroll through a source file and click on a line displaying
    either a warning or error icon, and the Problems view will jump to the corresponding
    entry. If you roll the cursor over a line that is identified as an error or warning,
    the corresponding error message pops up.


    Correct the problems and build the project again. Note, incidentally, that by
    default Eclipse does *not* automatically saved modified files before a build.
    You must manually save them. That behavior can be changed in Preferences. Save
    `sort_utils.c` and run the build again. This time it should succeed and you will
    see an executable file show up in the Debug tree in the Project Explorer view.


    Before moving on to debugging, you might want to turn on line number display in
    the editor, since we will be referring to line numbers as we go along. In the
    editor window, right-click in the vertical bar on the left side, called the marker
    bar. One of the options is Show Line Numbers. Click that. This is a global parameter.
    It applies to any files currently open in the editor, and any that are subsequently
    opened.


    # Debugging With CDT


    CDT integrates very nicely with the Gnu Debugger, GDB. Like most Unix tools, GDB
    itself is command line oriented. Eclipse provides a very nice graphical wrapper
    around the native interface, so you don’t have to remember all those commands.


    Before we can debug, we have to create a *debug launch configuration*. Execute
    Run > Debug Configurations ... Select C/C++ Application and click the New button
    in the upper left corner.'
  merge: -1
  img_proc: true
