    # # CentOS


    CentOS is an abbreviation for Community Enterprise Operating System. It is a free
    and open source version of RHEL. It is derived from the same open source code
    as RHEL, with Red Hat’s branding and logos changed.


    In January 2014, Red Hat announced that it would sponsor the CentOS project, “helping
    to establish a platform well-suited to the needs of open source developers that
    integrate technologies in and around the operating system.” As a result of these
    changes, ownership of CentOS trademarks was transferred to Red Hat, which now
    employs most of the CentOS head developers; however, they work as part of the
    Red Hat’s Open Source and Standards team, which operates separately from the RHEL
    team.


    The latest release is 7.2-1511, December 2015. As of release 7.0, CentOS only
    officially supports the x86-64 architecture. Unofficial ports are available for
    alternate architectures. Version 7 will have 10 years of support until 2024.


    In July 2010, CentOS overtook Debian to become the most popular Linux distribution
    for web servers, with almost 30% of all Linux web servers using it, according
    to w3techs.com. Debian subsequently regained the lead in January 2012.


    While just about everything in this book is “distribution-agnostic,” one area
    where distros tend to differ is in setup and configuration. We’ll confront that
    issue in Chapter 4, The host development environment, when we need to make some
    changes to networking. The descriptions there will emphasize CentOS. With that
    in mind, if you haven’t yet settled on a'
