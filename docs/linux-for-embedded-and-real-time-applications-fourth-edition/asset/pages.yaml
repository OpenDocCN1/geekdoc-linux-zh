    Sobell, Mark G., *A Practical Guide to Linux Commands, Editors, and Shell Programming*

    `tlp.org`— The Linux Documentation Project. As the name implies, this is the source
    for documentation on Linux. You will find how-to’s, in-depth guides, FAQs, man
    pages, even an on-line magazine, the *Linux Gazette*. The material is generally
    well-written and useful.'
