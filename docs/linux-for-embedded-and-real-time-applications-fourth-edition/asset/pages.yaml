- pgno: 136
  md: '# A Thermostat


    Let us move on to something a little more interesting, and potentially even useful.
    We will enhance the measure program by turning it into a “thermostat.” We will
    also take a look at using the host workstation as a preliminary testing environment.


    We will have our thermostat activate a “cooler” when the temperature rises above
    a given setpoint, and turn the cooler off when the temperature falls below the
    setpoint. In practice, real thermostats incorporate hysteresis that prevents the
    cooler from rapidly switching on and off when the temperature is right at the
    setpoint. This is implemented in the form of a “deadband,” such that the cooler
    turns on when the temperature rises above the setpoint + deadband, and does not
    turn off until the temperature drops below setpoint − deadband. Additionally,
    the program includes an “alarm” that flashes if the temperature exceeds a specified
    limit.


    Two of the LEDs will serve as the cooler and alarm respectively. These are defined
    in driver.h in the measure/ directory as COOLER and ALARM. The thermostat itself
    is fundamentally a simple state machine with three states based on indicated temperature:


    +   - Normal

    +   - High

    +   - Limit


    For each state, the action taken and next state are:


    Current state Normal

    Temperature above setpoint + deadband

    Turn on COOLER

    Next state = High

    Temperature above limit

    Turn on ALARM

    Next state = Limit

    Current state High

    Temperature below setpoint − deadband

    Turn off COOLER

    Next state = Normal

    Temperature above limit

    Turn on ALARM

    Next state = Limit

    Current state Limit

    Temperature below limit

    Turn off ALARM'
  merge: -1
  img_proc: true
- pgno: 137
  md: "Next state = High \nTemperature below setpoint - deadband \nTurn off COOLER\
    \ \nNext state = Normal\n\nThe state machine is just a big `switch()` statement\
    \ on the state variable.\n\nHere is your chance to do some real programming. Make\
    \ a copy of `measure.c`, and call it `thermostat.c`. Since `thermostat.c` is already\
    \ a prerequisite in measure's makefile, all you have to do to make it visible\
    \ to Eclipse is to right click on measure in the Project Explorer view and select\
    \ Refresh.\n\nImplement the state machine in `thermostat.c`. Declare the variables\
    \ `setpoint`, `limit`, and `deadband` as global integers. I suggest dividing the\
    \ value returned by `readAD()` by something in the range of 10 to 20, to get something\
    \ reasonable as a temperature and to make it easier to adjust the pot. Pick a\
    \ suitable `setpoint`, and a `limit` another few \"degrees\" above that. A `deadband`\
    \ of plus/minus one count is probably sufficient.\n\n# # Host Workstation as Debug\
    \ Environment\n\nAlthough remote GDB gives us a pretty good window into the behavior\
    \ of a program on the target, there are good reasons why it might be useful to\
    \ do initial debugging on your host development machine. To begin with, the host\
    \ is available as soon as a project starts, probably well before any real target\
    \ hardware is available or working. In many cases, it is easier to accurately\
    \ exercise limit conditions with a simulation than with the real hardware. The\
    \ host has a file system that can be used to create test scripts and document\
    \ test results.\n\nWhen you characterize the content of most embedded system software,\
    \ you will usually find that something like 5%, maybe 10%, of the code deals directly\
    \ with the hardware. The rest of the code is independent of the hardware, and\
    \ therefore should not need hardware to test it, provided that the code is properly\
    \ structured to isolate the hardware-dependent elements.\n\nThe idea here is to\
    \ build a simple simulation that stands in for the hardware I/O devices. You can\
    \ then exercise the application by providing stimulus through the keyboard, and\
    \ noting the output on the screen. In later stages of testing you may want to\
