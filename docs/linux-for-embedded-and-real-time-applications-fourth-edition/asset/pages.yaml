  md: '# Dual-Booting


    In many cases, though, you’ll probably want to install Linux on a machine that
    already runs some variant of Windows. There are a couple of approaches to that.
    This section describes dual-booting, the next one describes virtualization.


    In the dual-boot scenario, you select at boot time which operating system to boot.
    That OS takes full control of the machine. The Linux installation will replace
    the standard Windows boot loader with GRUB, the GRand Unified Bootloader. GRUB
    then offers the option of selecting the OS to boot, as shown in Fig. 2.1.


    While historically dual-booting has been the most popular installation scenario
    for average users, it is also the most complicated, because it requires reconfiguring
    your hard disk. The most common case is you already have a version of Windows
    installed on the machine, and you want to add Linux.


    At this point Windows probably occupies the entire disk, and so you have to make
    space available for Linux. Fundamentally, this requires reducing the size of the
    disk partition holding Windows so you can create unallocated space for Linux.
    Remember that you’ll need on the order of 20 GB of disk space for Linux, so your
    disk must have at least that


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_33_0.png)


    Figure 2.1  GRUB boot menu.'
