    There are also specialized debug ports built into some processor chips. These
    go by the names Joint Test Action Group and Background Debug Mode. These ports
    provide access to debug features such as hardware breakpoint registers. GDB back
    ends exist for these ports as well.


    # Getting and Installing the Software


    The recommended target board for the examples in the book is the BeagleBone Black,
    an open source, or as the website puts it, “community supported” project. The
    Resources section has links for ordering and other resources. Chapter 6, The hardware
