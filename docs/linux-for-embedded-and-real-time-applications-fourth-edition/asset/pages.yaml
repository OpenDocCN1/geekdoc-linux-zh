- pgno: 273
  md: '# # Appendix A: U-boot Commands


    Das u-boot supports an extensive command set. This section describes the most
    useful of those commands. Because u-boot is highly configurable, not all commands
    are necessarily in any given implementation. The behavior of some commands is
    also configuration-dependent, and may depend on environment variable values.


    All u-boot commands expect numbers to be entered in hexadecimal, with or without
    the leading 0x. In the following descriptions, arguments are bracketed by <> .
    Optional arguments are further bracketed by []. Command names can generally be
    abbreviated to the shortest unique string, shown in parentheses.


    # ## Information Commands


    `bdinfo (bdi)` — Displays information about the target board such as memory sizes
    and locations, clock frequencies, MAC address, etc. This information is available
    to the Linux kernel.


    `coninfo (conin)` — Displays information about the available console I/O devices.
    It shows the device name, flags, and the current usage.


    `iminfo <start addr> (imi)` — Displays header information for images such as Linux
    kernels or ramdisks. It lists the image name, type, and size, and verifies the
    CRC32 checksum. `iminfo` takes an argument that is the starting address of the
    image. The behavior of `iminfo` is influenced by the `verify` environment variable.


    `help [<command name>]` — Self-explanatory. Without an argument it prints a short
    description of all commands. With a command name argument it provides more detailed
    help.


    # ## Memory Commands


    By default, the memory commands operate on 32-bit integers. They can be made to
    operate on 16-bit words or 8-bit bytes by appending “w” (for 16 bits) or “b” (for
    8 bits) to the'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'command name. There is also a “.l” suffix to explicitly specify 32 bits. Example:
    `cmp w 1000 2000 20` compares 32 (20 hex) words at addresses 0x1000 and 0x2000.


    `base [offset>] {ba}` — Get or set a base address to be used as an offset for
    all other memory commands. With no argument it displays the current base, default
    is 0. A numeric argument becomes the new base. This is useful for repeated accesses
    to a specific section of memory.


    `crc32 <start addr> <length> [<store addr>] [crc]` — Computes and displays a 32-bit
    checksum over `<length>` bytes, starting at `<start addr>`. The optional third
    argument specifies a location to store the checksum.


    `cmp <addr1> <addr2> <count>` — Compares two regions of memory. `<count>` is the
    number of *data items* independent of the specified size, byte, word, or long.


    `cp <source> <dest> <count>` — Copies a range of memory to another location. `<count>`
    is the number of items copied.


    `md <addr> [<count>]` — Memory display. Displays a range of memory in both hex
    and ASCII. The optional `<count>` argument defaults to 64 items. `md` remembers
    the most recent `<addr>` and `<count>`, so that if it is entered without an address
    argument, it continues from where it left off.


    `mm <start addr>` — Modify memory with autoincrement. Displays the address and
    current contents of an item, and prompts for user input. A valid hexadecimal value
    replaces the current value and the command displays the next item. This continues
    as long as you enter valid hex values. To terminate the command, enter a non-hex
    value.


    `mtest <start addr> <end addr> [<pattern>]` — Simple read/write RAM test. This
    test modifies RAM and may crash the system if it touches areas used by u-boot,
    such as the stack or heap.


    `mw <addr> <value> [<count>]` — Writes `<value>` to a range of memory starting
    at `<addr>`. The optional `<count>` defaults to 1.


    `nm <addr>` — Modify memory at a constant address (no autoincrement). Interactively
    writes valid hex data to the same address. This is useful for accessing I/O device
    registers. Terminate the command with a non-hex input.


    `loop <addr> <count>` — Reads memory in a tight loop. This can be useful for scoping.
    This command **never terminates**! The only way out is to reset the board.


    # NAND Flash Memory Commands


    NAND flash is organized into arbitrary sized named *partitions*. All NAND commands
    are prefixed by the keyword `nand`. The BeagleBone Black u-boot implements the
    NAND commands, even though there is no NAND device installed.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'nand info—Show available NAND devices.


    mtdparts—List NAND partitions.


    nand erase[.clean] [ <offset> [<size> ] —Erase <size> bytes starting at <offset>.
    If <offset> not specified, erase entire chip.


    nand scrub—Really erase the entire chip, including bad blocks. Considered “unsafe.”


    nand createtbt—Create bad block table.


    nand bad—List bad blocks.


    nand read[.raw] <address> <offset> | <partition> <size> — Read <size> bytes from
    flash, either from numerical <offset> or <partition> name into RAM at <address>.
    The .raw modifier bypasses ECC to access the flash as is.


    nand write[.raw] <address> <offset> | <partition> <size> — Write <size> bytes
    from <address> in RAM to flash either at numerical <offset> or <partition> name.
    The .raw modifier bypasses ECC to access the flash as is.


    # # Execution Control Commands


    boot—Boot default, that is run bootcmd.


    bootd — Boot default, that is run bootcmd.


    bootm <addr> [<param>…]—Boots an image such as an operating system from memory.
    The image header, starting at <addr>, contains the necessary information about
    the operating system type, compression, if any, load, and entry point addresses.
    <param> is one or more optional parameters passed to the OS. The OS image is copied
    into RAM and uncompressed if necessary. Then control is transferred to the entry
    point address. For Linux, two optional parameters are recognized: the address
    of an initrd RAM disk image, and the image of a flattened device tree (FDT) blob.
    To boot a kernel with a FDT but no initrd, pass the second argument as “”,


    Note, incidentally, that images can be booted from RAM, having been downloaded,
    for example, with TFTP. In this case, be careful that the compressed image does
    not overlap the memory area used by the uncompressed image.


    bootz <addr> [ <initrd> ; <size> ] [ <fdt> ]—Boots a Linux zImage stored in memory
    at <addr>. <initrd> is the address of an initrd image of <size> bytes. <fdt> is
    the address of a flattened device tree blob. To boot a kernel with a FDT but no
    initrd, pass the second argument as “”,'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'go <addrr>[<param>...]—Transfers control to a “stand-alone” application starting
    at <addr> and passing the optional parameters. These are programs that do not
    require the complex environment of an operating system.


    # Download Commands


    Three commands are available to boot images over the network using TFTP. Two of
    them also obtain an IP address before executing the file download.


    bootp <load_addr>[<filename>]—Obtain an IP address using the bootp protocol, then
    download <filename> to <load_addr>. If <filename> is not given, the value of bootfile
    will be used.


    nfs <load_addr>[<filename>] [[hostIPAddr]:<filename>]—Boot an image over the network
    using the NFS protocol. If hostIPAddr is not given, the value of serverip is used.
    If <filename> is not given, the value of bootfile will be used.


    tftpboot <load_addr><filename> (tftp)—Just download the file. Assumes client already
    has an IP address, either statically assigned or obtained through DHCP.


    dhcp—Get an IP address using DHCP.


    It is also possible to download files using a serial line. The recommended terminal
    emulator for serial image download is kermit, as some users have reported problems
    using minicom for image download.


    load <offset>—Accept a binary image download to address <offset> over the serial
    port. Start this command in u-boot, then initiate the transmission on the host
    side.


    loads <offset>—Accept an S-record file download to address <offset> over the serial
    port.


    # Environment Variable Commands


    printenv [<name>...]—Prints the value of one or more environment variables. With
    no argument, printenv lists all environment variables. Otherwise, it lists the
    value(s) of the specified variable(s).


    setenv <name> [<value>]—With one argument, setenv removes the specified variable
    from u-boot’s environment and reclaims the storage. With two arguments it sets
    variable <name> to <value>. These changes take place in RAM only. Warning: use
    a space between <name> and <value>, not “ = ”. The latter will be interpreted
    literally with rather strange results.'
