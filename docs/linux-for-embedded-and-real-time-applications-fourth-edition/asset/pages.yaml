  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_156_0.png)


    # **Figure 9.3**

    Priority inversion scenario.


    **Fig. 9.4** is an execution timeline of this system. Assume Thread 2 is currently
    executing and pends on the mutex. The resource is free, so Thread 2 gets it. Next,
    an interrupt occurs that makes Thread 1 ready. Since Thread 1 has higher priority,
    it preempts Thread 2, and executes until it pends on the *resource* mutex.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_156_1.png)


    # **Figure 9.4**

    Execution timeline.


    Since the resource is held by Thread 2, Thread 1 blocks, and Thread 2 regains
    control. So far everything is working as we would expect. Even though Thread 1
    has higher priority, it simply has to wait until Thread 2 is finished with the
    resource.


    The problem arises if Thread 3 should become ready while Thread 2 has the resource
    locked. Thread 3 preempts Thread 2. This situation is called *priority inversion*,
    because a lower priority thread (Thread 3) is effectively preventing a higher
    priority thread (Thread 1) from executing.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'A common solution to this problem is to temporarily raise the priority of Thread
    2 to that of Thread 1 as soon as Thread 1 pends on the mutex. Now, Thread 2 cannot
    be preempted by anything of lower priority than Thread 1. This is called priority
    inheritance.


    Another approach, called priority ceiling, raises the priority of Thread 2 to
    a specified value higher than that of any task that may pend on the mutex as soon
    as Thread 2 gets the mutex. This is considered to be more efficient, because it
    eliminates unnecessary context switches. No thread needing the resource can preempt
    the thread currently holding it.


    Posix threads has optional attributes for setting a mutex’s protocol as either
    priority inheritance or priority ceiling, and for setting the priority ceiling
    value.


    # Communication: Condition Variables


    There are many situations where one thread needs to notify another thread about
    a change in status to a shared resource protected by a mutex. Consider the situation
    in Fig. 9.5, where two threads share access to a queue. Thread 1 reads the queue
    and Thread 2 writes it. Clearly, each thread requires exclusive access to the
    queue, and so we protect it with a mutex.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_157_0.png)


    Thread 1 will lock the mutex and then see if the queue has any data. If it does,
    Thread 1 reads the data, and unlocks the mutex. However, if the queue is empty,
    Thread 1 needs to block somewhere until Thread 2 writes some data. Thread 1 must
    unlock the mutex before blocking, or else Thread 2 would not be able to write.
    But there is a gap between the time Thread 1 unlocks the mutex and blocks. During
    that time, Thread 2 may execute and not recognize that anyone is blocking on the
    queue.


    The condition variable solves this problem by waiting (blocking) with the mutex
    locked. Internally, the conditional wait function unlocks the mutex, allowing
    Thread 2 to proceed. When the conditional wait returns, the mutex is again locked.'
