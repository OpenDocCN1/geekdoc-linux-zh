  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_45_0.png)


    # Figure 3.4


    Command shell window.


    +   *   Multitasking. The Linux scheduler implements true, preemptive multitasking,
    in the sense that a higher priority process made ready by the occurrence of an
    asynchronous event will preempt the currently running process. But while it is
    preemptible¹, there are relatively large latencies in the kernel that make it
    generally unsuitable for hard real-time applications, although that has improved
    substantially over the years and we’ll go into that later on. Additionally, the
    default scheduler implements a “fairness” policy that gives all processes a chance
    to run.


    +   *   Multiuser. Unix evolved as a time-sharing system that allowed multiple
    users to share an expensive (at that time anyway) computer. Thus, there are a
    number of features that support privacy and data protection. Linux preserves this
    heritage and puts it to good use in server environments.²


    ¹ Is it “preemptible” or “preemptable”? Word 2010’s spelling checker says they’re
    both wrong. The only online reference to this debate I could find is a thread
    on Yahoo Answers from 2008 that comes down on the side of preemptible. I think
    I’ll stick with that.


    ² Although my experience in the embedded space is that the protection features,
    particularly file permissions, can be a downright nuisance. Some programs, the
    Firefox browser is an example, don’t have the courtesy to tell you that you don’t
    have permission to write the file, they just sit there and do nothing.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "+   * Multiprocessing. Linux offers extensive support for true symmetric multiprocessing\
    \ where multiple processors are tightly coupled through a shared memory bus. This\
    \ has become particularly significant in the era of multicore processors.\n+ \
    \  \n+   * Protected memory. Each Linux process operates in its own private memory\
    \ space, and is not allowed to directly access the memory space of another process.\
    \ This prevents a wild pointer in one process from damaging the memory space of\
    \ another process. The errant access is trapped by the processor's memory protection\
    \ hardware, and the process is terminated with appropriate notification.\n+  \
    \ \n+   * Hierarchical file system. Yes, all modern operating systems—even DOS—have\
    \ hierarchical file systems. But the Linux/Unix model adds a couple of nice wrinkles\
    \ on top of what we are used to with traditional PC operating systems:\n+   \n\
    +   Links. A link is simply a file system entry that points to another file, rather\
    \ than being a file itself. Links can be a useful abstraction mechanism, and a\
    \ way to share files among multiple users. They also find extensive use in configuration\
    \ scenarios for selecting one of several optional files.\n+   \n+   Device-independent\
    \ I/O. Again, this is nothing new, but Linux takes the concept to its logical\
    \ conclusion by treating every peripheral device as an entry in the file system.\
    \ From an application's viewpoint, there is absolutely no difference between writing\
    \ to a file and writing to, say, a printer.\n\n# ## Protected Mode Architecture\n\
    \nBefore getting into the details of Linux, let's take a short detour into protected\
    \ mode architecture. The implementation of protected mode memory in contemporary\
    \ Intel processors first made its appearance in the 80386. It utilizes a full\
    \ 32-bit address for an addressable range of 4 GB. Access is controlled such that\
    \ a block of memory may be: Executable, Read only, or Read/Write. Current Intel\
    \ 64-bit processors implement a 48-bit address space.\n\nThe processor can operate\
    \ in one of four *Privilege Levels*. A program running at the highest privilege\
    \ level, level 0, can do anything it wants—execute I/O instructions, enable and\
    \ disable interrupts, modify descriptor tables. Lower privilege levels prevent\
    \ programs from performing operations that might be “dangerous.” A word processing\
    \ application probably should not be messing with interrupt flags, for example.\
    \ That’s the job of the operating system.\n\nSo application code typically runs\
    \ at the lowest level, while the operating system runs at the highest level. Device\
    \ drivers and other services may run at the intermediate levels. In practice,\
    \ however, Linux and most other operating systems for Intel processors only use\
    \ levels 0 and 3. In Linux, level 0 is called “Kernel Space” while level 3 is\
    \ called “User Space.”"
