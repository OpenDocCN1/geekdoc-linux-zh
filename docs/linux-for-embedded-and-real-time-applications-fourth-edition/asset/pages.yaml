    \                       }\n                        break;\n        }\n       \
    \ exit (0);\n}\n```\n```\n\n# **Listing 9.1**\n\nFork implementation of thermostat.\n\
    \nBut there is probably a more efficient implementation. Remember from Chapter\
    \ 3, Introducing linux that a Linux process can have multiple threads of execution,\
    \ and all of these threads share the process’s memory space. So how about we create\
    \ a thread that just sits on *stdin* waiting for a command? Specifically, in this\
    \ chapter, we will explore Posix threads.\n\nPosix, also written POSIX, is an\
    \ acronym that means Portable Operating System Interface, with an X thrown in\
    \ for good measure. POSIX represents a collection of standards defining various\
    \ aspects of a portable operating system based on UNIX. These standards are maintained\
    \ jointly by the Institute of Electrical and Electronic Engineers (IEEE) and the\
    \ International Standards Organization. The various documents have been pulled\
    \ together into a single standard in a collaborative effort between the IEEE and\
    \ The Open Group (see the Resources section)."
