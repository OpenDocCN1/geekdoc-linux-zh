- pgno: 182
  md: 'qt installs a large number of libraries in /usr/lib64 plus a subfolder, qt4/,
    under /usr/lib64. Among other things, qt-devel installs several executables in
    /usr/bin:


    ```

    ```c

    designer-qt4

    release-qt4

    moc-qt4

    uic-qt4

    linguist-qt4

    lupdate-qt4

    qmake-qt4

    ```

    ```


    Add /usr/lib64/qt4/bin to the front of your PATH in .bash_profile. Log out and
    log back in to make the new path effective.


    The version available from CentOS is 4.8.5. The latest version as of June 2017
    is 5.9. If you would like to play with that one, go to the download page listed
    in the resources section.


    # QT Basics


    QT is a collection of C++ classes that implement a wide range of graphical widgets.
    QT starts with the standard C++ object model, and then adds several significant
    features that support GUI programming:


    +   • A mechanism for seamless object communication called signals and slots.

    +   • Queryable and designable object properties.

    +   • Events and event filters.

    +   • Contextual string translation for internationalization.

    +   • Interval driven timers that integrate many tasks in an event-driven GUI.

    +   • Hierarchical and queryable object trees that organize object ownership.

    +   • Guarded pointers (QPointer) that are automatically set to 0 when the referenced
    object is destroyed, unlike normal C++ pointers that become dangling pointers
    when their objects are destroyed.

    +   • A dynamic cast that works across library boundaries.


    Many of these features are implemented with standard C++ techniques, based on
    inheritance from QObject. Others, like the object communication mechanism and
    the dynamic property system, require the Meta-Object System provided by QT''s
    own Meta-Object Compiler (moc). Collectively, these features are known as the
    QT Object Model.'
