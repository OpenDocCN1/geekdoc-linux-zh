- pgno: 10
  md: '# Preface


    Microsoft sells you Windows Linux gives you the whole house


    Unknown


    Much has happened in the Linux world since the third edition of this book was
    published in 2013, which of course is the motivation for a new edition. The kernel
    continues to evolve and improve. Open source hardware is proliferating with the
    likes of Arduino, BeagleBoard, and Raspberry PI, among others. Projects that aim
    to ease the embedded development process and improve productivity, such as Linaro
    and Yocto, have reached a level of maturity that makes them genuinely useful.


    Linux still hasn’t made much of a dent in the world of desktop computing, but
    it has achieved notable success in the embedded space where I work. A VDC Research
    study from March 2015 suggests that “open source, freely and/or publicly available”
    Linux will grow from a 56.2% share of embedded unit shipments in 2012 to 64.7%
    in 2017. The “Internet of Things” phenomenon is helping drive that growth.


    I began the preface to the first edition by confessing that I’ve never really
    liked Unix, considering it deliberately obscure and difficult to use. Initially,
    Linux did little to change that impression, and I still have something of a love/hate
    relationship with the thing.


    Linux is indeed complex and, unless you are already a Unix guru, the learning
    curve is quite steep. The information is out there on the web, but it is often
    neither easy to find nor readable. There are probably hundreds of books in print
    on Linux, covering every aspect from beginners’ guides to the internal workings
    of the kernel. By now there are even a number of books discussing Linux in the
    embedded and real-time space.


    I decided to climb the Linux learning curve partly because I saw it as an emerging
    market opportunity, and partly because I was intrigued by the Open Source development
    model. The idea of programmers all over the world contributing to the development
    of a highly sophisticated operating system just for the fun of it is truly mind-boggling.
    Having the complete source code not only allows you to modify it to your heart’s
    content, it allows you (in principle at least) to understand how the code works.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Open Source has the potential to be a major paradigm shift in how our society
    conducts business, because it demonstrates that cooperation can be as useful in
    developing solutions to problems as competition. And while I doubt that anyone
    is getting fabulously wealthy off of Linux, a number of companies have demonstrated
    that it is possible to build a viable business model around it.


    # ## Audience and Prerequisites


    My motivation for writing this book was to create the kind of book I wished I
    had had when I started out with Linux. With that in mind, the book is directed
    at two different audiences:


    +   -   The primary audience is embedded programmers who need an introduction
    to Linux in the embedded space. This is where I came from, and how I got into
    Linux, so it seems like a reasonable way to structure the book.

    +   -   The other audience is Linux programmers who need an introduction to the
    concepts of embedded and real-time programming.


    Consequently, each group will likely see some material that is review, although
    it may be presented with a fresh perspective.


    This book is not intended as a beginners’ guide. I assume that you have successfully
    installed a Linux system and have at least played around with it some. You know
    how to log in, you have experimented with some of the command utilities, and have
    probably fired up a GUI desktop. Nonetheless, Chapter 2, Installing Linux, takes
    you through the installation process, and Chapter 3, Introducing Linux is a cursory
    introduction to some of the features and characteristics of Linux that are of
    interest to embedded and real-time programmers.


    The book is loosely divided into three parts: Part I is largely introductory and
    sets the stage for Part II, which discusses application programming in a cross-development
    environment. Part III takes a more detailed look at some of the components and
    tools introduced earlier. It goes without saying that you cannot learn to program
    by reading a book. You have to do it. That is why this book is designed as a practical
    hands-on guide. You will be installing a number of open source software packages
    on your Linux workstation, and there is sample code available at the book’s website,
    https://www.elsevier.com/books-and-journals/book-companion/9780128112779.


    Embedded programming generally implies a target machine that is separate and distinct
    from the workstation development machine. The principal target environment we
    will be working with in this book is the BeagleBone Black, an ARM-based single
    board computer (SBC) introduced in Chapter 6, Eclipse integrated development environment.
    This is an'
