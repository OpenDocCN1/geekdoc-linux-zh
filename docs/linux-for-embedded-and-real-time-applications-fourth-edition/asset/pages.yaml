    int pthread_setcancelstate (int state, int *oldstate);

    int pthread_setcanceltype (int type, int *oldtype);

    void pthread_testcancel (void);

    ```

    ```


    A thread can cancel another thread by calling `pthread_cancel()`. `pthread_setcancelstate()`
    and `pthread_setcanceltype()` allow a thread to set its cancellation mode. Note
