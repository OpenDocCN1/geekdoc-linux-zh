  md: "```\n```text\n#include <unistd.h>\n#include \"measure.h\"\n\nint running =\
    \ 1;\nparams_t *p;  /*pointer to shared memory */\n\nint main(int argc, void **argv)\n\
    {\n        create shared memory space;\n        switch (fork())\n        {\n \
    \               case -1:\n                        printf (\"fork failed\\n\");\n\
