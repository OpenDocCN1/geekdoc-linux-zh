    # The Terminal Emulator, minicom


    minicom is a fairly simple Linux application that emulates a dumb RS-232 terminal
    through a serial port. This is what we will use to communicate with the target
    board.


    Recent Linux distributions tend not to install minicom by default. It is easy
    enough to install.


    As root user (again, either su or sudo) execute:


    ```

    yum install minicom        in CentOS

    apt-get install minicom    in Ubuntu or Debian

    ```


    Both of these commands do essentially the same thing. They go out on the Internet
    to find the specified package, resolve any dependencies, download the packages,
    and install them.


    Once minicom is installed, there are a number of configuration options that we
    need to change to facilitate communication with the target.


    > ² Although I have had my arm twisted to try vim and it''s not too bad.'
