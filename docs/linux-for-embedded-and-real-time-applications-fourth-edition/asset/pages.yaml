    The basic operations on a condition variable are *signal* and *wait*. Signal wakes
    up one of the threads waiting on the condition. The order in which threads wake
    up is a function of scheduling policy. A thread may also execute a *timed wait*,
    such that if the specified time interval expires before the condition is signaled,
    the wait returns with an error. A thread may also *broadcast* a condition. This
    wakes up all threads waiting on the condition.


    # Condition Variable Attributes


    Pthreads does not define any required attributes for condition variables, although
    there is at least one optional attribute.


    # Thread Termination and Cancellation


    A thread may be terminated either voluntarily or involuntarily. A thread terminates
    itself either by simply returning, or by calling `pthread_exit()`. In the latter
    case, all *cleanup handlers* that the thread registered by calls to `pthread_cleanup_push`()
    are called prior to termination.


    Most threads run in an infinite loop. As long as the system is powered up, the
    thread is running, doing its thing. Some threads start up, do their job, and finish.
    But there are also circumstances where it is useful to allow one thread to terminate
    another thread involuntarily. Perhaps the user presses a CANCEL button to stop
    a long search operation. Maybe the thread is part of a redundant numerical algorithm,
    and is no longer needed because another thread has solved the problem. The Pthreads
    cancellation mechanism provides for the orderly shutdown of threads that are no
    longer needed.


    But cancellation must be done with care. You do not just arbitrarily stop a thread
    at any point in its execution. Suppose it has a mutex locked. If you terminate
    a thread that has'
