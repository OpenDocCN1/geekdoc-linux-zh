- pgno: 231
  md: '# Hard vs. Soft links (Continued)


    The led3.c entry is once again pointing at a valid entry.


    The point of this exercise is that hard links are alternate names, or aliases
    if you will, for the same data. They all point to the same data blocks on the
    disk. That data cannot be deleted until the reference count goes to zero. By contrast,
    a soft or symbolic link points, not at data, but at a file name, which may or
    may not exist.


    # Using BusyBox


    The BusyBox executable is usually installed in the /bin directory, where most
    user-level command line utilities reside. Then, for example, in /bin we create
    the following symbolic link:


    ```bash

    ln -s busybox ls

    ```


    Now when you invoke ls from a shell, what really gets executed is BusyBox. The
    program figures out what it is supposed to do by looking at the first argument
    to main(), which is the name that invoked it, i.e., ls. A similar link is created
    for every command that BusyBox implements.


    You can also invoke BusyBox directly, passing a command name and its arguments
    as a command line, like this:


    ```bash

    busybox ls -l

    ```


    Executing busybox -help or just busybox by itself yields a help message including
    a list of the commands built into the current instance of BusyBox.


    # User Space Initialization


    We now have a useful thermostat application. The next thing we need to do is arrange
    for that application to start automatically when the system is powered up. Also,
    we probably do not need a console shell in the final product.


    Let us start by examining the initialization process from the moment power is
    turned on until the Linux kernel starts the first user space process. There are
    basically four steps in this process.


    # Stage 1 Boot Loader


    The AM335x Sitara has an extensive built-in boot ROM with several boot options.
    When power is applied and the reset pin is released, execution begins at the Reset
    exception'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'vector at 0x20000. This is a jump instruction into what TI calls the Public
    ROM Code. This code does some very low-level initialization of things like clocks
    and the watchdog timer. It then builds a list of bootable devices based on the
    state of the SYSBOOT pins. For each value of the SYSBOOT pins, the boot loader
    builds a list of four devices to test for a bootable image. Each device is checked
    in turn, to see if there is a bootable image. In the case of the BBB, there are
    two options determined by pushbutton S2. The default is:


    +   1.  *eMMC*. If the eMMC does not contain a bootable image, then . . .

    +   2.  *microSD card*. If there is no microSD card, or it does not have a bootable
    image. . .

    +   3.  *debug serial port*. If there is nothing there. . .

    +   4.  *USB port*.


    If S2 is pressed when power is applied, the order is:


    +   1.  *SPI0*. This will always fail on the BBB, so. . .

    +   2.  *microSD card*. If there is no microSD card, or it does not have a bootable
    image. . .

    +   3.  *USB port*.

    +   4.  *debug serial port*. If there is nothing there. . .


    Oddly enough, the mere presence of a microSD card causes my board to boot from
    the card. The BeagleBoard folks do not support booting over USB or serial ports.
    You have to go to TI for that.


    # Stage 2 MLO


    The Sitara SoC also contains 128 kb of on-board RAM, of which 109 kb is available
    to load a boot loader. This is where the second stage boot loader is loaded. On
    the BBB the second stage loader is an image file named MLO. Its job is to set
    up the chip selects for RAM and various off-chip peripherals, and then load the
    third stage loader, u-boot.


    # U-Boot


    The u-boot loader continues the initialization process by initializing the peripherals
    it needs, typically the serial port, network, and may be USB. Then, if the auto
    boot sequence is not interrupted, it will usually copy the kernel from Flash to
    RAM and start it executing.


    # Linux Kernel


    If the kernel is a compressed image, it uncompresses itself into the appropriate
    location in RAM. Then it initializes all of the kernel subsystems, such as memory
    management and drivers for all of the peripheral devices in the system. To some
    extent, this may duplicate the initialization done by U-boot, but of course the
    kernel has no idea what U-boot did, and'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'so must initialize the devices to suit its own requirements. During the initialization
    process the kernel spews out a large number of messages describing what it is
    doing. Next it mounts the root file system. Up to this point, the kernel has been
    running in kernel space. Finally it starts the init process, which makes the transition
    to user space.


    # Systemd


    The last thing the kernel boot does is start a process with PID 1. This then becomes
    the ultimate parent of every other process in the system. Not too long ago this
    was a fairly straightforward process involving an executable, /sbin/init, a configuration
    file, inittab, and a handful of scripts. This was the System V initialization
    mechanism.


    Now there is a “new improved” initialization mechanism called systemd encompassing
    something like 900 files. By now most major Linux distros have adopted systemd,
    but it has been a highly contentious issue since its introduction in 2011. Proponents
    insist that the System V init is too slow, because it starts processes serially,
    one at a time, whereas systemd parallelizes much of the activity. Opponents say
    “if it ain’t broke, don’t fix it.”


    systemd manages and acts on objects called units. There are many types of units,
    but the most common type is a service, represented by a file that ends in .service.
    Have a look in /lib/systemd/system for your target file system. You will see lots
    of .service files. As an example, open up bonescr ipt.service. The WorkingDirectory
    generally contains support files for the executable, which is identified by ExecStart.


    You manage systemd through the systemctl command. The most common commands that
    systemctl understands are:


    +   | start<unit> | Start the specified unit(s) |

    +   |---|---|

    +   | stop<unit> | Stop the specified unit(s) |

    +   | restart<unit> | Restart the specified unit(s). If not running they will
    be started |

    +   | reload<unit> | Ask specified unit(s) to reload their configuration files
    |

    +   | status<unit> | Display the status of the specified unit(s) |

    +   | enable<unit> | Create symlinks to allow unit(s) to be automatically started
    at boot |

    +   | disable<unit> | Remove the symlinks that cause the unit(s) to be started
    at boot |

    +   | daemon-reload | Reloads the systemd manager’s configuration. Run this any
    time you make a change to a systemd file. |


    As a first experiment with systemd, just enter the command by itself with no arguments.
    You will get a list of all the services that are available on the BBB. systemctl
    pipes its output to more (or less, I don’t know) so it is presented one page at
    a time. There are a lot of services available.'
