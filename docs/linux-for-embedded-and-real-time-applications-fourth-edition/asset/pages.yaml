- pgno: 100
  md: 'According to Wikipedia, over 50,000,000,000 ARM processors had been produced
    as of 2014.


    The basic idea behind RISC architecture is that a simpler instruction set requires
    fewer transistors, which in turn consume less power and take up less die space.
    The relative simplicity of the RISC architecture makes ARM processors suitable
    for low power applications. As a result, they have come to dominate the mobile
    and consumer electronics market. About 98% of all mobile phones use at least one
    ARM processor¹.


    ARM Holdings itself does not make chips. Rather, it licenses the architecture
    to a number of semiconductor manufacturers including Applied Micro, Atmel, Freescale,
    Marvell (formerly Intel), Nvidia, ST-Ericsson, Samsung, and Texas Instruments,
    among others.


    # Open Source Hardware


    Open source software has been around for at least 25 years. More recently, some
    groups have started developing open source hardware, generally small, single board
    computers based on ARM processor chips.


    # BeagleBoard


    The BeagleBoard is based on the TI (Texas Instruments) OMAP3530 system-on-a chip
    (SOC) that combines an ARM Cortex-A8 CPU with a TI TMS320C64x digital signal processor.
    It was initially developed by TI as an educational tool, and the design was released
    under the Creative Commons license. The original BeagleBoard was release in July
    of 2008 (Fig. 6.1).


    # Specifications (*Rev. C4*)


    +   • Processor: TI OMAP3530 at 720 MHz

    +     - ARM Cortex-A8

    +     - TMS320C64x + DSP

    +   • 256 MB RAM

    +   • 256 MB NAND flash

    +   • Peripheral connections:

    +     - DVI-D using HDMI connector, max. resolution 1280 × 1024

    +     - S-video

    +     - USB 2.0 HS OTG

    +     - RS-232'
