    \ system. Polling is tacky. What we need is an independent thread of execution\
    \ that patiently waits for a line of text on the console, parses the line, and\
    \ acts on it.\n\nWe could use **fork**() to create a new process. Listing 9.1\
    \ illustrates in pseudo code form a possible implementation. We start by creating\
    \ a shared memory space, and then **fork**() to create a new child process. The\
    \ child process monitors **stdin**, and posts the result of any valid command\
    \ to the appropriate entry in the shared memory region. The parent is the **thermostat**\
    \ program, as we’ve already seen it."
