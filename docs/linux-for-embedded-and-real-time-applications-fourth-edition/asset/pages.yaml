- pgno: 277
  md: 'Standard shell quoting rules apply when a value contains characters with special
    meaning to the command line parser, such as “$” for variable substitution and
    “;” for command separation. These characters are “escaped” with a back slash,
    “\”. Example:


    tenv netboot tftp 2100000 uImage: bootm


    saveenv—Writes the environment to persistent storage.


    run <name>[...]—Treats the value of environment variable <name> as one or more
    u-boot commands and executes them. If more than one variable is specified, they
    are executed in order.


    bootd (boot)—A synonym for run bootcmd to execute the default boot command.


    # ## Environment Variables


    The u-boot environment is kept in persistent storage and copied to RAM when u-boot
    starts. It stores environment variables used to configure the system. The environment
    is protected by a CRC32 checksum. This section lists some of the environment variables
    that u-boot recognizes.


    The variables shown here serve specific purposes in the context of u-boot and,
    for the most part, will not be used explicitly. When needed, u-boot environment
    variables are used explicitly in commands, much the same way that they are in
    shell scripts and makefiles, by enclosing them in ${}.


    autoload—If set to “no”, or any string beginning with “n”, the tftp and bootp
    commands will only get configuration information and not try to download an image
    using TFTP.


    autostart—If set to “yes”, an image loaded using the tftp, bootp, or tftp commands
    will be automatically started by internally calling the bootm command.


    baudrate—A decimal number that specifies the bit rate for the console serial port.
    Only a predefined list of baudrate settings is available. Following the setenv
    baudrate <n> command, u-boot expects to receive a newline character at the new
    rate before actually committing the new rate. If this fails, the board must be
    reset and reverts to the old baud rate.


    bootargs—The value of this variable is passed to the Linux kernel as boot arguments,
    i.e., the “command line.”


    bootcmd—Defines a command string that is automatically executed when the initial
    countdown is not interrupted, but only if the variable bootdelay is also defined
    with a non-negative value.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 276 Appendix A


    `bootdelay`—Wait this many seconds before executing the contents of the `bootcmd`
    variable. The delay can be interrupted by pressing any key before the `bootcmd`
    sequence starts.

    **Warning:** setting `bootdelay` to 0 executes `bootcmd` immediately, and effectively
    disables any interaction with u-boot. On the other hand, setting this variable
    to $-1$ disables auto boot.


    `bootfile`—Name of the default image to be loaded by any of the download commands.


    `ethaddr`—MAC address for the first or only Ethernet interface on the board, known
    to Linux as `eth0`. A MAC address is 48 bits, represented as six pairs of hex
    digits separated by dots.


    `eth1addr`, `eth2addr`—MAC addresses for the second and third Ethernet interfaces
    when present.


    `ipaddr`—Set an IP address on the target board for TFTP downloading.


    `loadaddr`—Default buffer address in RAM for commands like `tftpboot`, `loads`,
    and `bootm`. Note: it appears, but does not seem to be documented, that there
    is a default load address, 0x82000000, built into the code.


    `serverip`—IP address of the TFTP or NFS server used by the `tftpboot` and `nfs`
    commands.


    `serial#`—A string containing hardware identification such as type, serial number,
    etc. This variable can only be set once, often during manufacturing of the board.
    U-boot refuses to delete or overwrite this variable once it has been set.


    `verify`—If set to "n" or "no", disables the checksum calculation over the complete
    image in the `bootm` command to trade speed for safety in the boot process. The
    header checksum is still verified.


    The following environment variables can be automatically updated by the network
    boot commands (`bootp`, `dhcp`, or `tftp`) depending on the information provided
    by your boot server:


    +   * `bootfile`—See above

    +   * `dnsip`—IP address of your Domain Name Server

    +   * `gatewayip`—IP address of the Gateway (Router)

    +   * `hostname`—Target host name

    +   * `ipaddr`—See above

    +   * `netmask`—Subnet mask

    +   * `rootpath`—Path to the root filesystem on the NFS server

    +   * `serverip`—See above

    +   * `filesize`—Size in bytes, as a hex string, of the file downloaded using
    the last `bootp`, `nfs`, or `tftp` command.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# *Appendix B: Why Software Should Not Have Owners*


    Digital information technology contributes to the world by making it easier to
    copy and modify information. Computers promise to make this easier for all of
    us.


    Not everyone wants it to be easier. The system of copyright gives software programs
    “owners,” most of whom aim to withhold software’s potential benefit from the rest
    of the public. They would like to be the only ones who can copy and modify the
    software that we use.


    The copyright system grew up with printing—a technology for mass production copying.
    Copyright fitted in well with this technology, because it restricted only the
    mass producers of copies. It did not take freedom away from readers of books.
    An ordinary reader, who did not own a printing press, could copy books only with
    pen and ink, and few readers were sued for that.


    Digital technology is more flexible than the printing press: when information
    has a digital form, you can easily copy it to share it with others. This very
    flexibility makes a bad fit with a system like copyright. That is the reason for
    the increasingly nasty and draconian measures now used to enforce software copyright.
    Consider these four practices of the Software Publishers Association (SPA):


    +   - Massive propaganda saying it is wrong to disobey the owners to help your
    friend.

    +   - Solicitation for stool pigeons to inform on their coworkers and colleagues.

    +   - Raids (with police help) on offices and schools, in which people are told
    they must prove they are innocent of illegal copying.

    +   - Prosecution (by the US government, at the SPA’s request) of people such
    as MIT’s David LaMacchia, not for copying software (he is not accused of copying
    any), but merely for leaving copying facilities unguarded and failing to censor
    their use.


    All four practices resemble those used in the former Soviet Union, where every
    copying machine had a guard to prevent forbidden copying, and where individuals
    had to copy'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'information secretly and pass it from hand to hand as “samizdat.” There is,
    of course, a difference: the motive for information control in the Soviet Union
    was political; in the United States the motive is profit. But it is the actions
    that affect us, not the motive. Any attempt to block the sharing of information,
    no matter why, leads to the same methods and the same harshness.


    Owners make several kinds of arguments for giving them the power to control how
    we use information:


    +   - Name calling.

    +     - Owners use smear words such as “piracy” and “theft,” as well as expert
    terminology such as “intellectual property” and “damage,” to suggest a certain
    line of thinking to the public—a simplistic analogy between programs and physical
    objects.

    +     - Our ideas and intuitions about property for material objects are about
    whether it is right to take an object away from someone else. They do not directly
    apply to making a copy of something. But the owners ask us to apply them anyway.


    +   - Exaggeration.

    +     - Owners say that they suffer “harm” or “economic loss” when users copy
    programs themselves. But the copying has no direct effect on the owner, and it
    harms no one. The owner can lose only if the person who made the copy would otherwise
    have paid for one from the owner.

    +     - A little thought shows that most such people would not have bought copies.
    Yet the owners compute their “losses” as if each and every one would have bought
    a copy. That is exaggeration—to put it kindly.


    +   - The law.

    +     - Owners often describe the current state of the law, and the harsh penalties
    they can threaten us with. Implicit in this approach is the suggestion that today’s
    law reflects an unquestionable view of morality—yet at the same time, we are urged
    to regard these penalties as facts of nature that cannot be blamed on anyone.

    +     - This line of persuasion is not designed to stand up to critical thinking;
    it is intended to reinforce a habitual mental pathway.

    +     - It is elementary that laws do not decide right and wrong. Every American
    should know that, 40 years ago, it was against the law in many states for a black
    person to sit in the front of a bus; but only racists would say sitting there
    was wrong.


    +   - Natural rights.

    +     - Authors often claim a special connection with programs they have written,
    and go on to assert that, as a result, their desires and interests concerning
    the program simply outweigh those of anyone else—or even those of the whole rest
    of the world. (Typically companies, not authors, hold the copyrights on software,
    but we are expected to ignore this discrepancy.)'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'To those who propose this as an ethical axiom—the author is more important
    than you—I can only say that I, a notable software author myself, call it bunk.


    But people in general are only likely to feel any sympathy with the natural rights
    claims for two reasons.


    One reason is an overstretched analogy with material objects. When I cook spaghetti,
    I do object if someone else eats it, because then I cannot eat it. His action
    hurts me exactly as much as it benefits him; only one of us can eat the spaghetti,
    so the question is, which? The smallest distinction between us is enough to tip
    the ethical balance.


    But whether you run or change a program I wrote affects you directly and me only
    indirectly. Whether you give a copy to your friend affects you and your friend
    much more than it affects me. I shouldn''t have the power to tell you not to do
    these things. No one should.


    The second reason is that people have been told that natural rights for authors
    is the accepted and unquestioned tradition of our society.


    As a matter of history, the opposite is true. The idea of natural rights of authors
    was proposed and decisively rejected when the US Constitution was drawn up. That
    is why the Constitution only permits a system of copyright and does not require
    one; i.e., why it says that copyright must be temporary. It also states that the
    purpose of copyright is to promote progress—not to reward authors. Copyright does
    reward authors somewhat, and publishers more, but that is intended as a means
    of modifying their behavior.


    The real established tradition of our society is that copyright cuts into the
    natural rights of the public—and that this can only be justified for the public''s
    sake.


    +   * Economics.


    The final argument made for having owners of software is that this leads to production
    of more software.


    Unlike the others, this argument at least takes a legitimate approach to the subject.
    It is based on a valid goal—satisfying the users of software. And it is empirically
    clear that people will produce more of something if they are well paid for doing
    so.


    But the economic argument has a flaw: it is based on the assumption that the difference
    is only a matter of how much money we have to pay. It assumes that “production
    of software” is what we want, whether the software has owners or not.


    People readily accept this assumption because it accords with our experiences
    with material objects. Consider a sandwich, for instance. You might well be able
    to get an equivalent sandwich either free or for a price. If so, the amount you
    pay is the only difference. Whether or not you have to buy it, the sandwich has
    the same taste, the same nutritional value, and in either case you can only eat
    it once. Whether you get the sandwich from an owner or not cannot directly affect
    anything but the amount of money you have afterwards.


    This is true for any kind of material object—whether or not it has an owner does
    not directly affect what it is, or what you can do with it if you acquire it.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'But if a program has an owner, this very much affects what it is, and what
    you can do with a copy if you buy one. The difference is not just a matter of
    money. The system of owners of software encourages software owners to produce
    something—but not what society really needs. And it causes intangible ethical
    pollution that affects us all.


    What does society need? It needs information that is truly available to its citizens—e.g.,
    programs that people can read, fix, adapt, and improve, not just operate. But
    what software owners typically deliver is a black box that we cannot study or
    change.


    Society also needs freedom. When a program has an owner, the users lose freedom
    to control part of their own lives.


    And above all, society needs to encourage the spirit of voluntary cooperation
    in its citizens. When software owners tell us that helping our neighbors in a
    natural way is “piracy,” they pollute our society’s civic spirit.


    This is why we say that free software is a matter of freedom, not price.


    The economic argument for owners is erroneous, but the economic issue is real.
    Some people write useful software for the pleasure of writing it or for admiration
    and love; but if we want more software than those people write, we need to raise
    funds.


    For 10 years now, free software developers have tried various methods of finding
    funds, with some success. There is no need to make anyone rich; the median US
    family income, around $35k, proves to be enough incentive for many jobs that are
    less satisfying than programming.


    For years, until a fellowship made it unnecessary, I made a living from custom
    enhancements of the free software I had written. Each enhancement was added to
    the standard released version, and thus eventually became available to the general
    public. Clients paid me so that I would work on the enhancements they wanted,
    rather than on the features I would otherwise have considered highest priority.


    The Free Software Foundation (FSF), a tax-exempt charity for free software development,
    raises funds by selling GNU CD-ROMs, T-shirts, manuals, and deluxe distributions
    (all of which users are free to copy and change), as well as from donations. It
    now has a staff of five programmers, plus three employees who handle mail orders.


    Some free software developers make money by selling support services. Cygnus Support,
    with around 50 employees (when this article was written), estimates that about
    15% of its staff activity is free software development—a respectable percentage
    for a software company.


    Companies including Intel, Motorola, Texas Instruments, and Analog Devices have
    combined to fund the continued development of the free GNU compiler for the language
    C.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Meanwhile, the GNU compiler for the Ada language is being funded by the US
    Air Force, which believes this is the most cost-effective way to get a high quality
    compiler. (Air Force funding ended some time ago; the GNU Ada Compiler is now
    in service, and its maintenance is funded commercially.)


    All these examples are small; the free software movement is still small, and still
    young. But the example of listener-supported radio in this country (the United
    States) shows it is possible to support a large activity without forcing each
    user to pay.


    As a computer user today, you may find yourself using a proprietary program. If
    your friend asks to make a copy, it would be wrong to refuse. Cooperation is more
    important than copyright. But underground, closet cooperation does not make for
    a good society. A person should aspire to live an upright life openly with pride,
    and this means saying “No” to proprietary software.


    You deserve to be able to cooperate openly and freely with other people who use
    software. You deserve to be able to learn how the software works, and to teach
    your students with it. You deserve to be able to hire your favorite programmer
    to fix it when it breaks.


    You deserve free software.


    Copyright 1994 Richard Stallman Verbatim copying and distribution of this entire
    article is permitted in any medium, provided this notice is preserved.


    Updated: $Date: 2001/09/15 20:14:02 $ $Author: fsl $'
  merge: -1
