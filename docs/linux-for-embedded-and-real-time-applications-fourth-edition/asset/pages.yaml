  md: 'Linux directory, either by entering the command `ls -l` in a command shell
    window, or with the desktop file manager. Part of the entry for each file is a
    set of 10 flags and a pair of names that look something like this:


    ```

    ```plain

    -rw-r-r-- Andy physics

    ```

    ```


    In this example, Andy is the *owner* of the file, and the file belongs to a *group*
    of users called physics, perhaps the physics department at some university. Generally,
    but not always, the owner is the person who created the file.


    The first of the 10 flags identifies the file type. Ordinary files get a dash
    here. Directories are identified by “d,” links are “l,” and so on. We will see
    other entries for this flag when we get to device drivers later. The remaining
    nine flags divide into three groups of three flags each. The flags are the same
    for all groups, and represent respectively permission to read the file, “r;” write
    the file, “w;” or execute the file if it’s an executable, “x.” Write permission
    also allows the file to be deleted.


    The three groups then represent the permissions granted to different classes of
    users. The first group identifies the permissions granted the owner of the file,
    and virtually always allows reading and writing. The second flag group gives permissions
    to other members of the same group of users. In this case, the physics group has
    read access to the file but not write access. The final flag group gives permissions
    to the “world,” i.e., all users.


    The “x” permission is worth a second look. In Windows, a file with the extension
    `.exe` is *assumed* to be executable. In Linux, a binary executable is identified
    by the “x” permission, since we don’t have an explicit file extension to identify
    it. Furthermore, only those classes of users whose “x” permission is set are allowed
    to invoke execution of the file. So if I am logged in as an ordinary user, I am
    not allowed to invoke programs that might change the state of the overall system,
    such as changing the network address.


    Another interesting feature of “x” is that it also applies to shell scripts, which
    we will come to later in this chapter. For you DOS fans, a shell script is the
    same thing as a `.bat` file. It is a text file of commands to be executed as a
    program. But the shell won’t execute the script unless its “x” bit is set.


