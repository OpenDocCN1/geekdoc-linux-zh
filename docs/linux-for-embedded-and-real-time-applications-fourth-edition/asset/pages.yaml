    > **Buffer allocation policy**


    There are 3 ways BusyBox can handle buffer allocations:


    +   * Use malloc. This costs code size for the call to xmalloc.

    +   * Put them on stack. For some very small machines with limited stack space,
    this can be deadly. For most folks, this works just fine.

    +   * Put them in BSS. This works beautifully for computers with a real MMU (and
    OS support), but wastes runtime RAM for uClinux. This behavior was the only one
    available for BusyBox versions 0.48 and earlier.


    # Figure 14.1


    BusyBox xconfig menu.'
