- pgno: 47
  md: '# **Real Mode**


    To begin our discussion of protected mode programming in the x86, it''s useful
    to review how "real" address mode works.


    Back in the late 1970s, when Intel was designing the 8086, the designers faced
    the dilemma of how to access a megabyte of address space with only 16 bits. At
    the time a megabyte was considered an immense amount of memory. The solution they
    came up with, for better or worse, builds a 20-bit (1 megabyte) address out of
    two 16-bit quantities called the Segment and Offset. Shifting the segment address
    four bits to the left and adding it to the offset creates the 20-bit linear address
    (see Fig. 3.5).


    The x86 processors have four segment registers in real mode. Every reference to
    memory derives its segment value from one of these registers. By default, instruction
    execution is relative to the Code Segment (CS), most data references (MOV for
    example) are relative to the data segment (DS), and instructions that reference
    the stack are relative to the Stack Segment (SS). The Extra Segment is used in
    string move instructions, and can be used whenever an extra DS is needed. The
    default segment selection can be overridden with segment prefix instructions.


    A segment can be up to 64 Kbytes long, and is aligned on 16-byte boundaries. Programs
    less than 64 Kbytes are inherently position-independent, and can be easily relocated
    anywhere in the 1 Mbyte address space. Programs larger than 64 Kbytes, either
    in code or data, require multiple segments and must explicitly manipulate the
    segment registers.


    # **Protected Mode**


    Protected mode still makes use of the segment registers, but instead of providing
    a piece of the address directly, the value in the segment register (now called
    the *selector*) becomes an index into a table of *Segment Descriptors*. The segment
    descriptor fully describes a block of memory including, among other things, its
    base and limit (see Fig. 3.6). The linear address


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_47_0.png)


    **Figure 3.5**

    Real mode addressing.'
