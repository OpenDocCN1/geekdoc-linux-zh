    > *If debugging is the process of removing bugs, then programming must be the
    process of putting them in.*

    > *Edsger W. Dijkstra*


    In Chapter 5, Eclipse integrated development environment you saw how Eclipse integrates
    very nicely with the Gnu Debugger, GDB. In this chapter, we will look at additional
    features of GDB, and explore how to use GDB on our target board. We will also
    consider a simple approach to high-level simulation that can be useful in the
    early stages of development.


    # *Remote Debugging With Eclipse*


    In a typical desktop environment, the target program runs on the same machine
    as the debugger. But in our embedded environment, Eclipse with GDB runs on the
    host workstation and the program being debugged runs on the ARM target. You can
    think of GDB as having both a client and a server side, as illustrated in Fig.
    8.1. The client is the user interface, and the server is the actual interaction
    with the program under test. GDB implements a serial protocol that allows the
    server and client sides to be separated and communicate either over an RS-232
    link or Ethernet.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_132_0.png)


    Figure 8.1

    Client/server nature of GDB.


    There are two approaches to interfaci ng the target to the *gdb* serial protocol:


    +   - *gdb stubs*. A set of functions linked to the target program. *gdb stubs*
    is an RS-232-only solution.

    +   - *gdbserver*. This is a stand-alone program running on the target that, in
    turn, runs the program to be debugged. The advantage of *gdbserver* is that it
    is totally independent of the target program. In other words, the target builds
    the same regardless of remote debugging. Another advantage of *gdbserver* is that
    it runs over Ethernet. Finally, Eclipse uses *gdbserver*, so that is the best
    reason of all to use it.


    *gdbserver* is part of the ARM cross-tool chain in `/usr/local/arm-unknown-linux-gnueabi`.
    It’s also already in the BBB’s root file system at `/usr/bin`.


    To run the *measure* program under GDB, you would first `cd` to the `src/measure`
    directory and, as root user, execute:


    ```

    gdbserver :10000 measure

    ```


    The arguments to *gdbserver* are:


    +   - Network port number preceded by a colon. The normal format is “host:port,”
    where “host” is either a host name or an IP address in the form of a dotted quad,
    but *gdbserver* ignores the host portion. The port number is arbitrary, as long
    as it does not conflict with another port number in use. Generally, port numbers
    below 1024 are reserved for established network protocols such as HTTP (port 80),
    so it is best to pick a number above 1023. Port number 10,000 happens to be the
    default for the Eclipse debugger.

    +   - Target program name.'
  merge: -1
  img_proc: true
