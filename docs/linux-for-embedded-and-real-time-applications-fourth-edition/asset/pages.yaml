    # Legal Issues


    Considerable FUD³ has been generated about the legal implications of Open Source,
    particularly in light of SCO’s claims that the Linux kernel is “contaminated”
    with its proprietary Unix code. The SCO Group, formerly known as Santa Cruz Operations,
    acquired the rights to the Unix System V source code from Novell in 1996, although
    there is some dispute as to exactly what SCO bought from Novell. In any case,
    SCO asserted that IBM introduced pieces of SCO’s copyrighted, proprietary Unix
    code into the Linux kernel, and is demanding license fees from Linux users as
    a consequence.


    Ultimately, SCO’s case collapsed and the company filed for Chapter 11 bankruptcy
    in 2007. But all of a sudden there is serious money to be made by fighting over
    Open Source licensing issues. The upshot is that embedded developers need to be
    aware of license issues surrounding both Open Source and proprietary software.
    Of necessity, embedded software is often intimately tied to the operating system,
    and includes elements derived or acquired from other sources. While no one expects
    embedded engineers to be intellectual property attorneys, it is nevertheless essential
    to understand the license terms of the software you use and create, to be sure
    that all the elements “play nicely” together.


    And the issue cuts both ways. There are also efforts to identify violations of
    the GPL. The intent here is not the make money, but to defend the integrity of
    the GPL by putting pressure on violators to clean up their act. In particular,
    the GPL Violations Project has “outed” a dozen or so embedded Linux vendors who
    appear to have played fast and loose with the GPL terms. According to Harald Welte,
    founder of the GPL Violations Project, the most common offenders are networking
    devices such as routers, followed by set-top boxes and vehicle navigation systems.


    Open source licensing expert Bruce Perens has observed that embedded developers
    seem to have a mindset that “this is embedded, no one can change the source—so
    the GPL must not really apply to us.” It does.


