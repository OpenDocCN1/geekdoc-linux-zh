    > And then realize that nothing is perfect. GIT is just closer to perfect than
    any other SCM out there.

    > Linus Torvalds


    # Background


    Source Code Control, also known as Revision Control, refers to the practice of
    storing the source code files and other artifacts of a project, such as documentation,
    in a common repository so that multiple developers can work on the project simultaneously
    without interfering with each other. The source code control (SCC) software maintains
    a record of changes and supports multiple versions of a project simultaneously.
    It also allows you to go back and recreate previous versions if necessary.


    There are a number of SCC packages, both open source and proprietary, in widespread
