  md: 'Some domains, `PF_INET` for example, offer alternate communication mechanisms.
    `SOCK_STREAM` is a sequenced, reliable, connection-based, two-way byte stream.
    This is the basis for TCP, and is the default for `PF_INET` domain sockets. `SOCK_DGRAM`
    is a *datagram* service. It is used to send relatively small messages, with no
    guarantee that they will be delivered or that they won''t be reordered by the
    network. This is the basis of UDP. `SOCK_RAW` allows a process to access the IP
    protocol directly. This can be useful for implementing new protocols directly
    in User Space.


    The protocol is usually determined by the socket domain, and you do not have a
    choice. So, the protocol argument is usually zero.


    # ## A Simple Example


    # ### The Server


    Time to create another Eclipse project. You know the drill. Call it “network.”
    It is a makefile project, and this one is located in `home/samples/src/network`.
    Import the project settings with the include paths.


    Open the file `netserve.c` in the editor. First we create a `server_socket` that
    uses streams. Next, we need to bind this socket to a specific network address.
    That requires filling in a `sockaddr_in` structure, `server_addr`. The function
    `inet_aton()` takes a string containing a network address as its first argument,
    converts it to a binary number, and stores it in the location specified by the
    second argument, in this case the appropriate field of `server_addr`. `inet_aton()`
    returns zero if it succeeds. In this example, the network address is passed in
    through the compile-time symbol `SERVER` so that we can build the server to run
    either locally through the loopback device, or across the network.


    The port number is 16 bits, and is also passed in from the makefile through the
    compile-time symbol `PORT`. The function `htons()` is one of a small family of
    functions, macros actually, that solves the problem of transferring binary data
    between computer architectures with different byte ordering policies. The Internet
    has established a standard “network byte order;” which happens to be Big Endian.
    All binary data is expected to be in network byte order when it reaches the network.
    `htons()` translates a short (16 bit) integer from “host byte order,” whatever
    that happens to be, to network byte order. There is a companion function, `ntohs()`
    that translates back from network byte order to host order. Then there is a corresponding
    pair of functions that do the same translations on long (32 bit) integers.²


    Now we **bind** `server_socket` to `server_addr` with the `bind()` function. Finally,
    we create a queue for incoming connection requests with the `listen()` function.
    A queue length of one


