- pgno: 159
  md: 'locked a mutex, it can never be unlocked. The thread may have allocated one
    or more dynamic memory blocks. How does that memory get returned if the thread
    is terminated?


    Pthreads allows each thread to manage its own termination, such that the thread
    can free up and/or return any global resources before it actually terminates.
    So, when you cancel a thread you are usually not stopping it immediately, you
    are asking it to terminate itself as soon as it is safe or convenient.


    Pthreads supports three cancellation modes (Fig. 9.6) encoded as two bits called
    *cancellation state* and *cancellation type*. A thread may choose to disable cancellation
    because it is performing an operation that must be completed. The default mode
    is Deferred, meaning that cancellation can only occur at specific points, called
    *cancellation points*, where the program tests whether the thread has been requested
    to terminate. Most functions that can block for an unbounded time, such as waiting
    on a condition variable or reading or writing a file, are cancellation points,
    and are defined as such in the Posix specification.


    | Mode | State | Type | Meaning |

    | :--- | :--- | :--- | :--- |

    | Off | Disabled | N/A | Cancellation remains pending until enabled |

    | Deferred | Enabled | Deferred | Cancellation occurs at next cancellation point
    |

    | Asynchronous | Enabled | Asynchronous | Cancellation may occur at any time |


    # **Figure 9.6**


    Cancellation modes.


    While asynchronous cancellation mode might seem like a good idea, it is rarely
    safe to use. That is because, by definition, you do not know what state the thread
    is in when it gets the cancellation request. It may have just called `pthread_mutex_lock()`.
    Is the mutex locked? Don’t know. So while asynchronous cancellation mode is in
    effect, you cannot safely acquire any shared resources.


    ```

