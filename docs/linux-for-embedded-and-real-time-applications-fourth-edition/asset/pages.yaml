  md: '# Distributions


    Linux installation has improved substantially over the years, to the point that
    it is a reasonably straightforward, just about painless process. The easiest,
    and indeed the only sensible, way to install Linux is from a *distribution*, or
    “distro” for short. There are several hundred distributions floating around on
    the net, many of which address specific niches such as embedded.


    A distribution contains just about everything you would need in your Linux installation,
    including the kernel, utility programs, graphical desktop environments, development
    tools, games, media players, and on and on. Most, but not all, distributions make
    use of a *package manager*, software that combines the individual components into
    easily managed packages. Fedora and Red Hat distributions use *RPM*, the Red Hat
    Package Manager. Debian and its derivatives such as Ubuntu use *dpkg*. A package
    contains the software for the component, i.e., the executables, libraries, and
    so on, plus scripts for installing and uninstalling the component, and dependency
    information showing what other packages this one requires.


    A typical distro may incorporate several thousand packages. In fact, this becomes
    a marketing game among the various projects and distributors of Linux. “My distro
    has more packages than your distro.” Here are some of the more popular and user
    friendly distributions, any of which are suitable for embedded development. Web
    locations are given in the *Resources* section at the end of the chapter:


    # Linux Mint


    According to its website, “Linux Mint is the most popular desktop Linux distribution
    and the 3rd most widely used home operating system behind Microsoft Windows and
    Apple OS.” Well-known open source blogger Steven J Vaughan-Nichols claims in a
    July 2016 ZDNet article that Linux Mint is the “best of all Linux desktops.” “It’s
    not only the best Linux desktop, it’s the best desktop operating system—*period*.”
    [1] *techmint.com* claims that Mint was the most popular distribution in 2015.


    Mint is based on Debian and Ubuntu. The Mint team’s stated objective is “to produce
    a modern, elegant and comfortable operating system which is both powerful and
    easy to use.” It seems to be focused on the consumer desktop, with extensive support
    for multimedia. The latest release is 18 (Sarah), released in August 2016.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Debian GNU/Linux


    The Debian Project is an all-volunteer effort comprising around 1000 active developers
    around the world, supported entirely by donations. The website Distrowatch.com
    ranks Debian as second in terms of number of page hits per day. In first place
    is a distro called mint. Debian is one of the oldest distributions, having been
    first released in 1993.


    Debian is known for its “abundance of options.” The current stable release, 8.5
    (Jessie), has access to online repositories with over 40,000 packages supporting
    10 computer architectures, including the usual Intel/AMD 32- and 64-bit processors
    as well as ARM and IBM eServer zSeries mainframes. Debian claims to be one of
    the first distributions to use a robust package management system, which is different
    from RPM. Debian packages get the file extension .deb.


    Debian tends to have a longer and perhaps less consistent release cycle than many
    of the other popular distributions, typically taking 2 years between major releases.


    # Ubuntu


    According to its website, Ubuntu is an ancient African word meaning “humanity
    to others.” It also means “I am what I am because of who we all are.” It is a
    fork of the Debian code base first released in 2004 with the aim of creating an
    easy to use version of Linux. It is available in two versions, desktop and server.


    Each release has a version number consisting of the year and month of release,
    e.g., 16.04 was released in April of 2016. Releases are made on a predictable
    6 month schedule, with each fourth release getting long-term support (LTS). LTS
    releases have been supported for 3 years for the desktop version, and 5 years
    for the server version. With the pending release of version 12.04, desktop support
    will be extended to 5 years.


    Historically, Ubuntu, like most other Linux distros, supported both the GNOME
    and KDE graphical desktop environments. Release 11.04 in spring 2011 introduced
    a new desktop environment called Unity that is a “shell interface” for GNOME.
    The intention is to make more efficient use of space on the limited size screens
    of notebooks and tablets. Some users have criticized the new interface as “too
    different from and less capable than GNOME,” while others find the minimalist
    approach more appealing than the older paradigm.


    While Ubuntu emphasizes ease of use, the developers have made basic system configuration
    more difficult by eliminating many of the graphical dialogs that support setup
    and configuration in, e.g., Fedora. Furthermore, the root user account is “locked”
    so that it is not possible to directly log in as root. You must use the sudo command.
    This apparently'
