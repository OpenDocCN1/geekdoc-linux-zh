    # What About Wireless?


    Personally, I have not had any success configuring wireless network ports directly
    in Linux. But wireless ports do work fine in a virtual machine environment, because
    the VM manager virtualizes the network interface so that it looks like something
    else to the guest machine. VirtualBox, e.g., translates any physical network interface
    to an Intel 82540EM Gigabit interface.


    Having two interfaces can be very useful. You could, e.g., leave the wireless
    port attached to your network getting its IP address through DHCP, and reconfigure
    the Ethernet port as described above for exclusive connection to the target. For
    example, my network is 192.168.1. I plug the target board into a switch. The DHCP
    server in the router serves node addresses ranging from 100 to 199. The Windows
    host OS on my laptop gets its IP address from DHCP. The Linux guest has its address
    fixed by the procedure described here, and everything gets along fine.


    # Network File System


    We use NFS (Network File System) to mount the target board’s root file system⁴.
    The reason for doing that will become apparent when we start developing applications
    starting in Chapter 7, Accessing hardware. That means we have to “export” one
    or more directories on the workstation to make them visible on the network.


    > ⁴ Ubuntu distros tend to not have NFS installed by default. Execute sudo apt-get
    install nfs-kernel-server to install it.'
