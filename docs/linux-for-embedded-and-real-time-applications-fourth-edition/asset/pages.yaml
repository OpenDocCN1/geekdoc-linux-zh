- pgno: 12
  md: 'open source, widely available, relatively inexpensive device with capabilities
    typical of a real-world embedded product.


    # What''s New in this Edition


    +   The BeagleBone Black replaces the Mini2440 as the target single board computer.


    +   All of the software is downloaded from primary sources, no more DVD.


    +   We take a closer look at two approaches to making the Linux kernel real-time.


    # Personal Biases


    Like most computer users, for better or worse, I’ve spent years in front of a
    Windows screen and, truth be told, I still use Windows for my day-to-day computing.
    But before that I was perfectly at home with DOS, and even before that I hacked
    away at RT-11, RSX-11, and VMS. So it’s not like I do not understand command line
    programming. In fact, back in the pre-Windows 95 era, it was probably a couple
    of years before I finally added WIN to my `AUTOEXEC.BAT` file.


    Hardcore Unix programmers, on the other hand, think GUIs are for wimps. They proudly
    do everything from the command line. Say what you will, but I like GUIs. Yes,
    the command line still has its place, particularly for shell scripts and makefiles,
    but for moving around the file hierarchy and doing simple file operations like
    move, copy, delete, rename, etc., drag-and-drop beats the miserably obscure Unix
    shell commands hands down. I also refuse to touch text-based editors like `vi`
    and `emacs`, although recently I’ve come to tolerate `vim`. Sure they are powerful
    if you can remember all those obscure commands. Give me a WYSIWYG editor any day.


    My favorite GUI is the KDE desktop environment. It has all the necessary bells
    and whistles, including a very nice syntax coloring editor, not to mention a complete
    suite of office and personal productivity tools. KDE, an acronym for “K Desktop
    Environment” by the way, is included in most commercial Linux distributions. Clearly,
    you’re free to use whatever environment you are most comfortable with to work
    the book’s examples. But if you are new to Linux, I would recommend KDE and that
    is the environment I’ll be demonstrating as we proceed through the book.


    # Organization


    The book is organized around three major sections.


    Part I is Chapters 1, The embedded and real-time space through 6. It is an introduction
    and getting started guide. You will install Linux if you do not already have it.
    There is an'
