- pgno: 289
  md: '# LINUX FOR EMBEDDED AND REAL-TIME APPLICATIONS


    # Provides hands-on experience of embedded Linux, including graphical programming
    with QT plus new and updated content on projects like BusyBox and U-Boot


    This new edition of Linux for Embedded and Real-Time Applications provides a practical
    introduction both to the basics and to the latest developments in this rapidly
    evolving technology. Ideal for those new to using Linux in an embedded environment,
    it takes a hands-on approach and covers key concepts plus specific applications.


    +   * How to set up and use a cross-development environment

    +   * How to use simple simulation for initial application testing

    +   * About some of the many Linux components and tools

    +   * How to Configure and build the Linux kernel, BusyBox, and U-Boot bootloader

    +   * Why Linux is not real time and what you can do about it


    # Key Features:


    +   * Provides a hands-on introduction for engineers and software developers who
    need to get up to speed quickly on embedded Linux, its operation and capabilities

    +   * Covers the popular open source target boards, the BeagleBone and BeagleBone
    Black

    +   * Includes new and updated material that focuses on BusyBox, U-Boot bootloader,
    and graphical programming with QT


    # With This Book You Will Learn:


    # About the Author


    Doug Abbot is a computer consultant with over 30 years’ experience. He specializes
    in hardware and software for industrial and scientific data acquisition and embedded
    product applications. Doug is also a popular instructor and seminar leader, who
    takes classes on embedded Linux for University of California San Diego Extension,
    among others. He has taught the techniques of real-time programming and multitasking
    operating systems to hundreds of professional engineers.








