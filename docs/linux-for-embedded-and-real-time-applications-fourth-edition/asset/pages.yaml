  md: '# **Multiple Monitor Threads**


    As the net thermostat is currently built, only one client can be connected to
    it at a time. It is quite likely that in a real application, multiple clients
    might want to connect to the thermostat simultaneously. Remember from our discussion
    of sockets that the server process may choose to spawn a new process or thread
    in response to a connection request so it can immediately go back and listen for
    more requests.


    In our case, we can create a new monitor thread. That is the idea behind the `createServer()`
    function. It can be turned into a server thread whose job is to spawn a new monitor
    thread when a connection request comes along. So give it a try.


    Here, in broad terms, are the steps required to convert the net thermostat to
    service multiple clients:


    +   1. Copy `monitor.c` to `multimon.c` and work in that file.

    +   2. Recast `createServer()` as a thread function.

    +   3. In the `createThread()` function, change the arguments of the `pthread_create()`
    call to create the server thread instead of the monitor thread.

    +   4. Go down to the last four lines in `createServer()`, following the comment
    “Accept a connection.” Bracket these lines with an infinite while loop.

    +   5. Following the `printf()` statement, add a call to `pthread_create()` to
    create a monitor thread.

    +   6. Add a case "q": to the switch statement in the monitor thread. “q” says
    the client is terminating (quitting) the session. This means the monitor thread
    should exit.


    Now, here are the tricky parts. The `client_socket` will have to be passed to
    the newly-created monitor thread. Where does the thread object come from for each
    invocation of `pthread_create()`? A simple way might be to estimate the maximum
    number of clients that would ever want to access the thermostat, and then create
    an array of `pthread_ts` that big. The other, more general, approach is to use
    dynamic memory allocation, the `malloc()` function.


    But the biggest problem is how do you recover a `pthread_t` object when a monitor
    thread terminates? The monitor thread itself cannot return it, because the object
    is still in scope, that is, still being used. If we ignore the problem, the thermostat
    will eventually become unresponsive either because all elements of the `pthread_t`
    array have been used, or we run out of memory because nothing is being returned
    to the dynamic memory pool.


    Here are some thoughts. Associate a flag with each `pthread_t` object, whether
    it is allocated on a fixed array or dynamically allocated. The flag, which is
    part of a data structure that includes the `pthread_t`, indicates whether its
    associated `pthread_t` is free, in use, or “pending,” that is, able to be freed.
    The server thread sets this flag to the “in use” state'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'when creating the monitor. The structure should probably also include the socket
    number. It is this “meta” `pthread_t` object that gets allocated and passed to
    the monitor thread.


    Now the question is, when can the flag be set to the “free” state? Again, the
    monitor cannot do it, because the `pthread_t` object is still in use until the
    thread actually exits. Here is where the third state, PENDING, comes in.


    The monitor sets the flag to PENDING just before it terminates. Then we create
    a separate thread, call it “resource” if you will, that does the following:


    +   1. Wakes up periodically and checks for monitor threads that have set their
    flags to PENDING

    +   2. Joins the thread

    +   3. Marks the meta pthread object free

    +   4. Goes back to sleep


    Remember that when one thread joins another, the “joiner” (in this case resource)
    is blocked until the “joinee” (monitor) terminates. So, when resource continues
    from the `pthread_join()` call, the just-terminated monitor’s `pthread_t` object
    is guaranteed to be free. The semantics of `pthread_join()` are:


    ```

    ```c

    int pthread_join (pthread_t thread, void **ret_value)

    ```

    ```


    It is quite likely that by the time the resource thread wakes up, the monitor
    thread has already exited, in which case `pthread_join()` returns immediately
    with the error code `ESRCH`, meaning that `thread` does not exist.


    The `createThread()` function now needs to create the server thread and the resource
    thread. Likewise, `terminateThread()` needs to cancel and join both of those.
    And of course, any monitor threads that are running also need to be cancelled.
    That is, when the resource thread terminates, it needs to go through the list
    of meta pthreads checking for running monitors. Ah, but the resource thread doesn’t
    know it is being cancelled.


    Here is a good use for a cleanup handler. Write a cleanup handler that runs through
    the list of meta pthreads looking for any that are in the IN USE state. Cancel
    and join the corresponding thread. Call `pthread_cleanup_push()` just before the
    main loop in the resource thread. Add a call to `pthread_cleanup_pop()` just after
    the loop. It will never be called, but it closes the block opened by `pthread_cleanup_push()`.


    If you do not feel up to writing this yourself, you may have already noticed that
    there is an implementation of `multimon.c` in the `samples./working/` directory.


    There is a separate makefile called `Makefile.multi` to build the multiple client
    versions of `netthermo`. The build command for the Eclipse target is:


    ```

    ```

    make -f Makefile.multi

    ```

    ```'
