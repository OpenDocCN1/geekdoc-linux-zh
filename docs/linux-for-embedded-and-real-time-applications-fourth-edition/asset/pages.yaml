- pgno: 76
  md: 'Exported directories are specified in the file /etc/exports. The file probably
    exists, but is empty at this point. As root user, open it with an editor and add
    the following line:


    ```

    /home/<your_home_name>*(rw,no_root_squash,sync,no_subtree_check)

    ```


    Replace <your_home_name> with the name of your home directory. This makes your
    home directory visible on the network where other nodes can mount parts of it
    to their local file system. The “*” represents clients that are allowed to mount
    this directory. In this case, the directory is visible to any machine on the network.
    You can specify specific machines either by DNS name or IP address (as in machine1.intellimatrix.us,
    or 192.168.1.50, for example). You can also specify all the machines on a given
    network by giving the network and network mask as in 192.168.1.0/255.255.255.0.


    The options inside the parentheses describe how the client machines can access
    the directory. Options shown here are:


    +   * **rw:** Allow read and write access. Alternately, you can specify ro for
    read only.

    +   * **no_root_squash:** By default, a file request made by the root user on
    a client machine is treated on the server as if it came from user nobody. If no_root_squash
    is specified, the root user on the client has the same level of access as the
    server''s root user. This can have security implications, but is necessary in
    some circumstances.

    +   * **sync:** Normally, file writing is asynchronous, meaning that the client
    will be informed that a write is complete when NFS hands the request over to the
    file system, but before it actually reaches its final destination. The sync option
    waits until the operation really is complete.

    +   * **no_subtree_check:** If only part of a volume is exported, a routine called
    subtree checking verifies that a requested file is in the exported part. If the
    entire volume is exported, or you are not concerned about this check, disabling
    subtree checking will speed up transfers.


    NFS is somewhat picky about the format of this file. The last line must end with
    an end-of-line character, and no spaces are allowed inside the parentheses.


    With the exports file in place, we need to be sure that NFS is actually running.
    In CentOS, we do that with the systemctl shell command as shown in Fig. 4.3, which
    shows the result if the NFS server is running. The complete command is:


    ```

    systemctl status nfs-server

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_77_0.png)


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_77_1.png)


    # Figure 4.3

    Systemctl command.


    systemctl is the user interface to the systemd system and service manager. The
    arguments to systemctl are a command and the name of a service, which is represented
    by a script file in /usr/lib/systemd/system. If the NFS server is not running,
    you start it with this command:


    ```

    systemctl start nfs-server

    ```


    To stop it you would execute:


    ```

    systemctl stop nfs-server

    ```


    If, for example, you were to make changes to /etc/exports, you would want to restart
    NFS for the changes to take effect:


    ```

    systemctl restart nfs-server

    ```


    Look in /usr/lib/systemd/system to see that there is a script file named nfs-server.service.
    Have a look at the file to see how it works.


    # Trivial File Transfer Protocol


    The last item of business for this chapter is installing (if necessary) and enabling
    TFTP, the Trivial File Transfer Protocol. We will use that later when building
    a new Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'As the name implies, TFTP is a simple protocol for file transfer that can be
    implemented in a relatively small amount of memory. As such, it is useful for
    things like booting devices that have no local mass storage. It uses UDP datagrams,
    and thus provides its own simplified session and transport mechanisms. No authentication
    or encryption mechanisms are provided, so it probably should not be used in situations
    where security is a concern.


    The workstation will serve as our TFTP server, just as it provides the NFS server
    function. Some distributions do not install the TFTP server by default, and so
    you must install it yourself. Just as we did earlier with `minicom`, CentOS users
    can execute `yum install tftp-server`, while Ubuntu and Debian users can execute
    `apt-get install tftp-server`.


    TFTP is one of several network protocols managed by `xinetd`, the eXtended InterNET
    Daemon. `xinetd` features access control mechanisms such as TCP Wrapper ACLs,
    extensive logging capabilities, and the ability to make services available based
    on time. It can place limits on the number of servers that the system can start,
    and has deployable defense mechanisms to protect against port scanners, among
    other things.


    Once installed, TFTP needs to be enabled. We do that by editing the file `/etc/xinetd/tftp`.
    You will need to be root user to save any changes. Find the line that starts “disable
    =” and change “yes” to “no.”


    While you are in this file, also note the line that starts `server_args = .` The
    argument for this line is the default directory for TFTP transfers. Currently
    in CentOS it is `/var/lib/tftpboot`. Any files you want to download to the target
    board over TFTP need to be copied to this directory. But this directory is owned
    by root, and not writable by the world. So you need to make it writable by everyone
    by executing, as root user:


    ```

    ```bash

    chmod 777 /var/lib/tftpboot

    ```

    ```


    We now have almost everything we need on the host workstation for embedded development.
    In the next chapter we will take a detour into the open source Integrated Development
    Environment Eclipse that will make application development a lot more productive.
    After that, we will set up the target hardware.


