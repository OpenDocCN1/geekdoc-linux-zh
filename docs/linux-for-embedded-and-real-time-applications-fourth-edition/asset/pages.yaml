    We’ve already seen `git clone` and `git push`. `git fetch` retrieves updates from
    the remote repository. `git pull` does a fetch followed by a merge to integrate
    the updates into the current branch.


    # Branching and merging


    Perhaps git’s most outstanding feature is its branching model. Other VCSs support
    branching, but git does so in a particularly elegant way. In fact, some users
    call the branching model git’s “killer feature”.


    To understand how branching works, we need to step back and take a closer look
    at how git stores commits. Figure 16.6 shows the contents of a single commit.
    It consists of a commit


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_251_0.png)


    metadata object that contains the author, committer, and commit comment among
    other things, plus a pointer to a tree object that in turn points to *blobs* representing
    individual objects that have been changed in this commit. The tree and blobs constitute
    the *snapshot* that this commit represents.


    Figure 16.7 shows the situation after two more commits. Each subsequent commit
    object points to its *parent*, the commit from which it was created. This is how
    we can recreate the complete history of the project. There are two other objects
    in this diagram. Master is the name of the current *branch*, the one that you’re
    currently working in. Every project starts with a master branch. `HEAD` points
