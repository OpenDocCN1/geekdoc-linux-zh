- pgno: 65
  md: 'There are, in fact, several shell programs in common use. They all serve the
    same basic purpose, yet differ in details of syntax and features. The most popular
    are:


    +   1.  **BourneAGAIN Shell** — `bash`, `bash` is a “reincarnation” of the Bourne
    shell, `sh`, originally written by Stephen Bourne and distributed with Unix version
    7. It is the default on most Linux distributions, and you should probably use
    it unless you have good reason, or strong feelings, for using a different shell.


    +   2.  **Korn Shell** — `ksh`. Developed by David Korn at AT&T Bell Laboratories
    in the early 1980s. It features more advanced programming facilities than `bash`,
    but nevertheless maintains backward compatibility.


    +   3.  **Tenex C Shell** — `csh`. A successor to the C shell, `csh` that was
    itself a predecessor to the Bourne shell. Tenex was an operating system that inspired
    some of the features of `tcsh`.


    +   4.  **Z Shell** — `zsh`. Described as an extended Bourne shell with a large
    number of improvements, including some of the most useful features of `bash`,
    `ksh`, and `tcsh`.


    The subject of shell programming is worthy of a book in itself, and there are
    many. When I searched *Amazon.com* for “linux shell programming,” I got 248 hits.


    # # Getting Help


    The official documentation for a Unix/Linux system is a set of files called “man
    pages,” man being short for manual. man pages are accessed with the shell command
    `man` as in:


    ```

    man cp

    ```


    to get help on the shell copy command. Try it. Type `man man` at the shell prompt
    to learn more about the man command. man presents the page a screen at a time
    with a “:” prompt on the bottom line. To move to the next screen, type <Space>.
    To exit man before reaching the end of the page, type “q.” You can also page up
    and page down through the man page. Interestingly enough, you will not find that
    information in the man man page. The writing style in man pages is rather terse;
    they''re reference in nature, not tutorial. The information is typically limited
    to what the command does, what its arguments are, and what options it takes.


    To make it easier to find a specific topic, the man pages are organized into sections
    as follows:


    +   Section 1:    User Commands entered at the shell prompt.

    +   Section 2:    The kernel API functions.

    +   Section 3:    C library functions.

    +   Section 4:    Devices. Information on specific peripheral devices.'
  merge: -1
  img_proc: true
