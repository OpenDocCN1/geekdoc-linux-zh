    # The Fork() Function


    Linux starts life with one process, the `init` process, created at boot time.
    Every other process in the system is created by invoking `fork()`. The process
    calling `fork()` is termed the *parent*, and the newly-created process is termed
    the *child*. So every process has ancestors, and may have descendants depending
    on who created who.


    If you have grown up with multisking operating systems where tasks are created
    from functions by calling a task creation service, the fork process can seem downright
    bizarre. `fork()` creates a *copy of the parent process*—code, data, file descriptors,
    and any other resources the parent may currently hold. This could add up to megabytes
    of memory space to be copied. To avoid copying a lot of stuff that may be overwritten
    anyway, Linux employs a *copy-on-write* strategy.


    `fork()` begins by making a copy of the process data structure, and giving it
    a new process identifier (PID) for the child process. Then it makes a new copy
    of the Page Directory and Page Tables. Initially, the page table entries all point
    to the same physical pages as the parent process. All pages for both processes
    are set to read-only. When one of the processes tries to write, that causes a
    page fault, which in turn causes Linux to allocate a new page for that process
    and copy over the contents of the existing page.


    Since both processes are executing the same code, they both continue from the
    return from `fork()` (this is what is so bizarre!). In order to distinguish parent
    from child, `fork()` returns a function value of 0 to the child process, but returns
    the PID of the child to the parent process. Listing 3.1 is a trivial example of
    the fork call.


    # The Execve() Function


    Of course, what really happens 99% of the time is that the child process invokes
    a new program by calling `execve()` to load an executable image file from disk.
    Listing 3.2 shows in skeletal form a simple command line interpreter. It reads
    a line of text from `stdin`, parses it, and calls `fork()` to create a new process.
    The child then calls `execve()` to load a file and execute the command just entered.
    `execve()` overwrites the calling process’s code, data, and SSS.


    If this is a normal “foreground” command, the command interpreter must wait until
    the command completes. This is accomplished with `waitpid()` which blocks the
    calling process until the process matching the pid argument has completed. Note,
    by the way, that most multitasking operating systems do not have the ability to
    block one process or task pending the completion of another.'
