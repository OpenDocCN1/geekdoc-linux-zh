    # **Adding Source Code to the Project**


    There are basically two ways to add source code to a C project. You can of course
    create a new file in an Editor window, or you can *import existing files* into
    the project. Execute `File > Import...` to bring up the Import Select dialog.
    Expand the General category, and select File System. Click *Next*, then click
    *Browse*, and navigate to `samples/record_sort` and click *OK*.


    This brings up the Import dialog. Select all three files and click *Finish*. Those
    files now show up in the Project Explorer view. Note that there is no `record_sort.c`
    file. That is because you are going to type it in yourself, to get some practice
    with the CDT editor.


    Click the down arrow next to the New icon at the left end of the tool bar, and
    select *Source File* from the drop-down menu. Name it “record_sort.c.” An Editor
    window opens up with a preliminary header comment. The contents of `record_sort.c`
    are given in Fig. 5.5, but do not start typing until you read the next section.


    # **Content Assist**


    The CDT Editor has a number of features to make your coding life easier. These
    fall under the general heading of *Content Assist*. The basic idea of Content
    Assist is to reduce the number of keystrokes you must type, by predicting what
    you are likely to type based on the current context, scope, and prefix. Content
    Assist is invoked by typing `Ctrl + Space`, and it is also auto-activated when
    you type ".", "->", or ":" following a `struct` or `class` name.


    # **Code Templates**


    *Code Templates* are an element of Content Assist that provide starting points
    for frequently used sections of code. When you enter a letter combination followed
    by `Ctrl + Space`, a list of code templates that begin with that letter combination
    is displayed. Select one and it is automatically inserted into the file at the
    current cursor location.


    Try this: after entering the `#include` lines in Fig. 5.5, type “ma” `Ctrl + Space`.
    This brings up a template for the `main()` function. You can edit templates at
    `Window > Preferences > C/C++ > Editor > Templates`. Other aspects of Content
    Assist can also be customized under Preferences.'
