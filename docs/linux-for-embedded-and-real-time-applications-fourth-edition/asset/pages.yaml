- pgno: 206
  md: 'In its default display mode, xconfig displays a tree of configuration categories
    on the left. Selecting one of these brings up the set of options for that category
    in the upper right window. Selecting an option then displays help for that option
    in the lower right window. Fig. 12.7 starts with the general setup menu. Most
    of the options are presented as check boxes. Clicking on the box alternates between
    checked (selected) and unchecked (not selected). These are termed binary options.
    Options that may be built as kernel modules have a third value, a dot to indicate
    that the feature will be built as a module. These are tri-state options. An example
    of that is Bus support. Click the box next to PC Card (PCMCIA/ CardBus) support,
    and it changes to a dot. Click it again and it changes to a check mark. Click
    it again to leave the box unchecked.


    Some options have a set of allowable values other than yes or no, and are represented
    by radio buttons. Select Kernel features to see a couple of examples of this:
    Memory split and Preemption Model. Some options take numeric values. An example
    of a numeric option is back up under General setup, kernel log buffer size. It
    is not immediately obvious how you change a numeric value. Double-clicking the
    option opens a dialog box between the two right-hand windows.


    Options that are not available, because some other option was not selected, simply
    do not show up. Again, the PC Card option serves as an example. With the box unchecked,
    the upper right-hand window is empty. Now click the check box, and the appropriate
    options show up in the upper right.


    # Try it out


    The best way to get familiar with kernel configuration options is to fire up xconfig
    and see what is there. So . . .


    ```

    cd kernel/kernel

    make xconfig

    ```


    After a bit of program and file building, the menu shown in Fig. 13.7 will appear.
    Just browse through the submenus and their various subsubmenus to get a feel for
    the flexibility and richness of features in the Linux kernel. Read the help descriptions.


    Most of the critical configuration options should be set correctly in the default
    .config file, but there is one option that is not yet set. Under General setup
    is an option called Cross-compiler tool prefix. This is a string option that must
    be set to "arm-linux-" . Be sure that NFS client support and Root file system
    on NFS are selected under Network File Systems.


    The default configuration enables any number of options that you do not really
    need, at least not initially. The BeagleBone Black has no built-in wireless support,
    so Bluetooth and anything called "Wireless" can be safely removed.


    For the time being, leave the configuration menu up while you read the next section.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "make xconfig gives you additional flexibility in saving configurations. Instead\
    \ of always saving it to the standard `.config` file, you can save it to a named\
    \ file of your choice using the `File->Save As` option, and later load that file\
    \ using `File->Load` for further modification or to make it the new default configuration.\n\
    \n# Xconfig Options\n\nThe `xconfig` menu has several useful options in the **Option**\
    \ menu. **Show Name** adds a column to the upper right panel that displays the\
    \ name of each configuration variable. **Show Range** displays the range and current\
    \ value of binary and tri-state options. In my estimation, this is only marginally\
    \ useful. Another marginally useful option is **Show Data**. For binary and tri-state\
    \ options it pretty much duplicates **Show Range**. It can be helpful for numeric\
    \ and text options.\n\n**Show All Options** is largely self-explanatory. It displays\
    \ in gray all of the options that cannot be selected because some condition is\
    \ not satisfied. Suppose you are pretty sure some option exists, but you cannot\
    \ find it. Turn on **Show All Options**, then use `Edit -> Find` to search for\
    \ the name.\n\nThere are some options that you are simply not allowed to change.\
    \ These are preselected based on the architecture you are building for. These\
    \ options lack a “prompt” that lets you edit them. With **Show All Options** turned\
    \ on, you will find most of these options at the top of the menu. If you select\
    \ **Show Prompt Options**, you will only see those options that you can change,\
    \ provided the dependencies are met.\n\nWhen you are finished, close the xconfig\
    \ menu. You will be asked if you want to save or discard the changes.\n\n# .config\
    \ File\n\nIt is probably worth mentioning that true kernel hackers tend to prefer\
    \ `make menuconfig` over `make xconfig`. The end result of the configuration process,\
    \ whichever one you choose to use, is a file called `.config` containing all of\
    \ the configuration variables. Listing 12.1 is an excerpt. The first thing to\
    \ notice is the comment at the top:\n\n```\n    # Automatically generated file;\
    \ DO NOT EDIT\n```\n\nIt is considered “bad form” to manually edit files that\
    \ have been created by a tool. It is a high probability that you will mess something\
    \ up.2\n\n2 OK, I've manually edited configuration files. Everybody does it. Just\
    \ understand that in doing so, you are taking a risk."
