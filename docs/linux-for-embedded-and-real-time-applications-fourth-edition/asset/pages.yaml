    # Summary


    In my humble opinion, Eclipse is the most professionally executed Open Source
    project I’ve seen. It is well thought out, and meticulously implemented. While
    it has tremendous power and flexibility, the most common operations are relatively
    simple and intuitive. The documentation, while still reference in nature and not
    tutorial, is nevertheless readable, and for the most part accurate. Sadly, there
    are all too many Open Source projects for which that cannot be said.


