- pgno: 18
  md: '# 6  Chapter 1


    But Linux has several things going for it that earlier versions of Unix lack.
    It’s “free,”^{1} and you get the source code. There is a large and enthusiastic
    community of Linux developers and users. There’s a good chance that someone else
    either is working or has worked on the same problem you’re facing. It’s all out
    there on the web. The trick is finding it.


    # Open Source


    Linux has been developed under the philosophy of Open Source software, which grew
    out of the Free Software Movement pioneered by Richard Stallman who founded the
    Free Software Foundation (FSF) in 1985. Then in 1997, Eric Raymond published a
    paper, and later a book, titled The Cathedral and the Bazaar, in which he argued
    that there are two models of software development: the cathedral—essentially top-down,
    and the bazaar—bottom up. In the cathedral model, source code is released, if
    at all, only when the software itself is released. Code developed between releases
    is restricted to an exclusive group of software developers, the “master craftsmen”
    if you will. The bazaar model has code developed over the Internet in full view
    of the public. As Raymond puts it, “given enough eyeballs, all bugs are shallow.”
    That is, the more widely available the source code is for public testing, scrutiny,
    and experimentation, the more rapidly all forms of bugs will be discovered.


    Quite simply, Open Source is based on the notion that software should be freely
    available: to use, to modify, to copy. The idea has been around for some 20 years
    in the technical culture that built the Internet and the World Wide Web, and in
    recent years has spread to the commercial world.


    There are a number of misconceptions about the nature of Open Source software.
    Perhaps the best way to explain what it is, is to start by talking about what
    it is not.


    +   - Open Source is not shareware. A precondition for the use of shareware is
    that you pay the copyright holder a fee. Shareware is often distributed in a free
    form that is either time- or feature-limited. To get the full package, you have
    to pay. By contrast, Open Source code is freely available, and there is no obligation
    to pay for it.

    +   - Open Source is not Public Domain. Public domain code, by definition, is
    not copyrighted. Open Source code is copyrighted by its author, who has released
    it under the terms of an Open Source software license. The copyright owner thus
    gives you the right to use the code provided you adhere to the terms of the license.
    But if you don’t comply with the terms of the license, the copyright owner can
    demand that you stop using the code.


    ¹ Linux Torvalds once said “Software is like sex. It’s better when it’s free.”
    Guys, we all know sex is never free and neither is software. One way or another,
    you’re going to pay for it.

