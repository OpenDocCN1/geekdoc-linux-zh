  md: 'your commits to the project. So it’s important to configure your git package
    with accurate basic information.


    Git stores configuration information in three places:


    +   * `/etc/gitconfig` — System-wide parameters applicable to all users. Use `git
    config` `--system` to read or write these values.

    +   * `~/.gitconfig` — Parameters specific to each user. Use `git config` `--global`
    to access these.

    +   * `.git/config` — Project-specific parameters found in the repository you’re
    currently working with.


    Each level overwrites values in the previous level, so values in `.git/config`
    take precedence over those in `/etc/gitconfig`, for instance. These files are
    of course plain ASCII text so you can set the values by manually editing the file
    and inserting the correct syntax, but it’s generally easier to run the `git config`
    command.


    To get started, set your user information:


    ```

    $ git config --global user.name "Homer Simpson"

    $ git config --global user.email homer@thesimpsons.com

    ```


    These commands hint at the basic structure of the configuration files. All configuration
    variables are specified as `section.variable`. In the configuration file, the
    section name is enclosed in square brackets. The square brackets may also include
    a subsection name enclosed in quotes. That syntax becomes `section.subsection.variable`.


    To get a better feel for how all of this hangs together, execute `git config --list`,
    which lists all of the currently defined configuration variables. Then open `hello-world/.git/config`
    with an editor to see where those values came from.


    Git provides a help command, `git help`, which lists all of the commands. If you
    then execute `git help <command>`, you’ll get the man page for `<command>`. Execute
    `git help config` and you’ll eventually come to a list of configuration variables
    that git recognizes.


