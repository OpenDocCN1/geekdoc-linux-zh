  md: 'explicitly allows such adaption and redistribution provided the resulting work
    is released under the same license terms. Copyleft thus allows you to benefit
    from the work of others, but any modifications you make must be released under
    similar terms.


    Arguably, the best-known, and most widely used, Open Source license is the Gnu
    general public license (GPL) first released by the FSF in 1989. The Linux kernel
    is licensed under the GPL. But the GPL has a problem that makes it unworkable
    in many commercial situations. Software that makes use of, or relies upon, other
    software released under the GPL, even just linking to a library, is considered
    a "derivative work," and is therefore subject to the terms of the GPL and must
    be made available in source code form.


    To get around this, and thus promote the development of Open Source libraries,
    the FSF came up with the "Library GPL." The distinction is that a program linked
    to a library covered by the LGPL is not considered a derivative work, and so there
    is no requirement to distribute the source, although you must still make the source
    available to the library itself.


    Subsequently, the LGPL became known as the "Lesser GPL," because it offers less
    freedom to the user. So while the LGPL makes it possible to develop proprietary
    products using Open Source software, the FSF encourages developers to place their
    libraries under the GPL in the interest of maximizing openness.


    At the other end of the scale is the Berkeley Software Distribution (BSD) license,
    which predates the GPL by some 12 years. It "suggests," but does not require,
    that source code modifications be returned to the developer community, and it
    specifically allows derived products to use other licenses, including proprietary
    ones.


    Other licenses—and there are quite a few—fall somewhere between these two poles.
    The Mozilla Public License e.g., developed in 1998 when Netscape made its browser
    open-source, contains more requirements for derivative works than the BSD license,
    but fewer than the GPL or LGPL. The Open Source Initiative (OSI), a nonprofit
    group that certifies licenses meeting its definition of Open Source, lists 89
    certified licenses on its website as of October 2016.


    Most software released under the GPL, including the Linux kernel, is covered by
    version 2 of the license, which was released in 1991, coincidentally the same
    year that Linux was born. FSF released version 3 of the GPL in June of 2007. One
    of the motivations for version 3 was to address the problem of "tivoization,"
    a term coined by Richard Stallman. It turns out that Tivo will only run code with
    an authorized digital signature. So, even though Tivo makes the source code available
    in compliance with the GPL, modifications to that code won''t run.


    Stallman considers this circumventing the spirit of the GPL. Other developers,
    including Linus Torvalds, see digital signatures as a useful security tool, and
    wouldn''t want to ban'
