    # ### MicroC/OS


    MicroC/OS is a contraction of Micro-Controller Operating System. It was initially
    developed in 1991$^{4}$ by Jean Labrosse, who subsequently wrote a series of articles
    in Embedded Systems Programming magazine about it, as well as a book, $\u03b$c/OS
    The Real-Time Kernel. MicroC/OS is not an open source project, although it is
    free to use for noncommercial projects. Labrosse subsequently started a company,
    Micrium, Inc., to commercialize MicroC/OS.


    Like FreeRTOS, MicroC/OS itself is just the kernel, which ranges in size from
    6 KB to 24 KB depending on what features are enabled. Additional packages support
    various forms of networking, file systems, profiling, and tracing. Synchronization
    mechanisms include semaphores, mutexes, message queues, and event flags.


    Two versions are currently supported: MicroC/OS II and MicroC/OS III. They differ
    primarily in the scheduler implementation. MicroC/OS II uses a clever, very efficient
    scheduling algorithm that limits the number of tasks to 255, each of which has
    a unique priority in the range of 0 to 255. Because each task has a unique priority,
    there is no notion of round robin scheduling.


    MicroC/OS III, by contrast, allows an unlimited number of tasks, limited only
    by the memory of the target system, with an unlimited range of priorities. It
    also supports round robin scheduling among tasks of equal priority.


    A personal note. I first encountered MicroC/OS, at that time called $\u03b$c/OS,
    in Jean’s three-part series in Embedded Systems Programming. After downloading
    and playing around with it, I was so impressed I decided to use it as the basis
    for a class on real-time programming.


    > $^{4}$ Interestingly, the same year Linus released the first Linux kernel.'
