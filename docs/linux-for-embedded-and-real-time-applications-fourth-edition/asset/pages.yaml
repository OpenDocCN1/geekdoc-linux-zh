- pgno: 193
  md: '# A Graphical Thermostat


    You can probably guess where all of this is leading. Fig. 11.5 is a QT form for
    our thermostat. It has five widgets: an LCD number widget for displaying temperature,
    two LED widgets to indicate high temperature and alarm, and two corresponding
    label widgets.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_193_0.png)


    Your thermostat program will need to send a signal to the display slot of the
    LCD number widget. Interestingly, the LED widget, class KLed, is not documented
    in the QT documentation as it is really a part of KDE. Google "kled widget" to
    find the appropriate references.


    After you get the basic display working, try adding some input widgets to manage
    setpoint, limit, and deadband.


    This tour of graphical programming using QT concludes the second part of the book
    on embedded applications. In the next chapter, we will start an exploration of
    various components and tools to support embedded Linux development, starting with
    configuring and building the Linux kernel itself.


    # Resources


    qt.io – Home page for the QT company. There is a fair amount of documentation
    here, although I''m a little less than impressed with its organization. Of course
    YMMV.


    info.qt.io/download-qt-for-application-development – This is the page for downloading
    the latest open source version of QT. From here you can also get to the QT archives
    where you can get the source code to version 4.8.5.'
