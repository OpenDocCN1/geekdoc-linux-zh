- pgno: 150
  md: 'In general, Linux conforms to Posix. The command shell, utilities, and system
    interfaces have all been upgraded over the years to meet Posix requirements. But,
    in the context of multithreading, we are specifically interested here in the Posix
    Threads interface known as 1003.1c.


    The header file that prototypes the Pthreads Application Programming Interface
    (API) is `pthread.h`, and it resides in the usual directory for library header
    files, `/usr/include`, or in the case of our cross-tool chain, `/usr/local/arm-unknown-linux-gnueabi/arm-unknown-linux-gnueabi/sysroot/usr/include`.


    # ### Threads


    Real-time operating systems often refer to threads as tasks. They are pretty much
    the same thing. It is an independent thread of execution embodied in a function.
    The thread has its own stack, referred to as its *context*.


    ```

    ```

    int pthread_create (pthread_t *thread, pthread_attr_t *attr, void *(*) (start_routine)
    (void *), void *arg);


    void pthread_exit (void *retval);


    int pthread_join (pthread_t thread, void **thread_return);


    pthread_t pthread_self (void);


    int sched_yield (void);

    ```

    ```


    A thread is created by calling `pthread_create()` with the following arguments:


    +   - `pthread_t` — A **thread object** that represents or identifies the thread.
    `pthread_create()` initializes this as necessary.

    +   - Pointer to a thread *attribute* object. Often it is NULL. More on this later.

    +   - Pointer to the *start routine*. The start routine takes a single pointer
    to `void *` argument, and returns a pointer to void.

    +   - Argument to be passed to the start routine when it is called.


    A thread may terminate by calling `pthread_exit()`, or by simply returning from
    its start function. The argument to `pthread_exit()` is the start function''s
    return value.


    In much the same way that a parent process can wait for a child to complete by
    calling `waitpid()`, a thread can wait for another thread to complete by calling
    `pthread_join()`. The arguments to `pthread_join()` are the thread object of the
    thread to wait on, and a place to store the thread''s return value. The calling
    thread is blocked until the target thread terminates. There is no parent/child
    relationship among threads as there is with processes, so a thread can join any
    other thread.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'A thread can determine its own ID by calling `pthread_self()`. Finally, a thread
    can voluntarily yield the processor by calling `sched_yield()`.


    Note that most of the functions above return an int value. This reflects the Pthreads
    approach to error handling. Rather than reporting errors in the global variable
    `errno`, Pthreads functions report errors through their return value.


    # **Thread Attributes**


    POSIX provides an open-ended mechanism for extending the API through the use of
    *attribute objects*. For each type of Pthreads object there is a corresponding
    attribute object. This attribute object is effectively an extended argument list
    to the related object create or initialize function. A pointer to an attribute
    object is always the second argument to a create function. If this argument is
    NULL, the create function uses appropriate default values. This also has the effect
    of keeping the create functions relatively simple, by leaving out a lot of arguments
    that normally take default values.


    An important philosophical point is that all Pthreads objects are considered to
    be “opaque”. Most of them anyway. We will see an exception shortly. This means
    that you never directly access members of the object itself. All access is through
    API functions that get and set the member arguments of the object. This allows
    new arguments to be added to a Pthreads object type by simply defining a corresponding
    pair of get and set functions for the API. In simple implementations, the get
    and set functions may be nothing more than a pair of macros that access the corresponding
    member of the attribute data structure.


