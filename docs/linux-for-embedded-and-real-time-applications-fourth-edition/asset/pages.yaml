    # Cleanup Handlers


    When a thread is requested to terminate itself, there may be some things that
    need to be “cleaned up” before the thread can safely terminate. It may need to
    unlock a mutex, or return a dynamically allocated memory buffer, for example.
    That is the role of *cleanup handlers*. Every thread conceptually has a stack
    of active cleanup handlers. Handlers are pushed on the stack by `pthread_cleanup_push()`,
    and executed in reverse order when the thread is cancelled or calls `pthread_exit()`.
    A cleanup handler takes one `void *` argument.


    ```

    ```

    void pthread_cleanup_push (void (*routine)(void *), void *arg);

    void pthread_cleanup_pop (int execute);

    ```

    ```


    The most recently pushed cleanup handler can be popped off the stack with `pthread_cleanup_pop()`
    when it is no longer needed. Often, the functionality of a cleanup handler is
    needed whether or not the thread terminates. The execute argument specifies whether
    or not a handler is executed when it is popped. A nonzero value means execute.
    Note also that `pthread_cleanup_pop()` can only be called from the same function
    that called `pthread_cleanup_push()`. Aside from being good programming practice,
    this is necessary because `pthread_cleanup_push()` is a macro that, in many implementations,
    ends with an opening brace, “{“; introducing a block of code, `pthread_cleanup_pop()`
    then has the corresponding closing brace.


    *Listing 9.2* shows the read thread (the main function) of a typical queueing
    application with a cleanup handler added. We assume the default deferred cancellation
    mode. Note that `pthread_cleanup_pop()` is used to unlock the mutex, rather than
    the normal mutex unlock function.


    The reason we need a cleanup handler here is that `pthread_cond_wait()` is a cancellation
    point, and the mutex is locked when we call it. But it is really necessary to
    push and pop the cleanup handler on every pass through the while loop? It is if
    there is a cancellation point in the section called “do something with the data”
    where the mutex is unlocked. This thread can only invoke the cleanup handler if
    it has the mutex locked. If there are no cancellation points while the mutex is
    unlocked, then it is safe to move the push cleanup call outside the loop. In that
    case, we do not really need pop cleanup.


    We will have an opportunity to use a cleanup handler in the next chapter.'
