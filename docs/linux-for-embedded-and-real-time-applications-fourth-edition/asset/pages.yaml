    # ### The Shell


    One of the last things that happens as a Linux system boots up is to invoke the
    command interpreter program known as the shell. Its primary job is to parse commands
    you enter at the console, and execute the corresponding program. But the shell
    is much more than just a simple command interpreter. It incorporates a powerful,
    expressive interpreting programming language of its own. Through a combination
    of the shell script language and existing utility programs, it is quite possible
    to produce very sophisticated applications without ever writing a line of C code.
    In fact, this is the general philosophy of Unix programming. Start with a set
    of simple utility programs that do one thing and one thing well, and then link
    them together through the shell scripting language.


    The shell scripting language contains the usual set of programming constructs
    for looping, testing, functions, and so on. But perhaps the neatest trick in the
    shell bag is the concept of "pipes." This is a mechanism for streaming data from
    one program to another. The metaphor is perfect. One program dumps bytes into
    one end of the pipe, while a second program takes the bytes out the other end.


    Most Linux/Unix utility programs accept their input from a default device called
    "stdin." Likewise, they write output to a device called "stdout." Any error messages
    are written to "stderr." Normally, stdin is the keyboard, while stdout and stderr
    are the display. But we can just as easily think of stdin and stdout as two ends
    of a pipe.


    stdin and stdout can be redirected, so that we can send output to, for example,
    a file or take input from a file. In a shell window, try typing just the command
    cat with no arguments. cat8 is perhaps the simplest of all Unix utilities. All
    it does is copy stdin to stdout, line by line. When you enter the command with
    no arguments, it patiently waits at stdin for keyboard input. Enter a line of
    text, and it will send that line to stdout, the display. Type Ctrl-C to exit the
    program.


    Now try this:


    ```

    cat > textfile

    ```


    7 "Bricking" refers to messing up the configuration of a computer so badly that
    it no longer boots, thus rendering it the equivalent of a brick. The term is used
    a lot in the embedded space. A more apt term for desktop boxes might be "boat
    anchoring."


    8 Short for concatenate. Don’t you just love Unix command names?'
