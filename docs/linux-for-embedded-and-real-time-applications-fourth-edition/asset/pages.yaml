  md: 'scheduling policies must have a priority greater than 0. Thus, a process scheduled
    with SCHED_FIFO or SCHED_RR will preempt any running normal process when it becomes
    ready.


    A SCHED_FIFO process runs until it blocks or it yields. SCHED_RR is a minor variation
    on SCHED_FIFO that adds time slicing. If a SCHED_RR process exceeds its time slice
    it is placed at the back of its priority queue.


    cyclictest has options to lock memory (-m) and to give its threads a higher priority
    (-p n). On my system, running cyclictest with a priority of 90 and a load of 20
    kept the maximum latency down to about 12 milliseconds.


    Locking memory did not improve things, which probably means there is no swapping
    going on anyway.


    # ## Two Approaches


    OK, so Linux is not real-time. What do we do about it? Well, there are at least
    two very different approaches to giving Linux deterministic behavior.


    # ### Preemption Improvement


    One approach is to modify the Linux kernel itself to make it more responsive.
    This primarily involves introducing additional preemption points in the kernel
    to reduce latency. An easy way to do this is to make use of the “spinlock” macros
    that already exist in the kernel to support symmetric multi-processing (SMP).
    In an SMP environment spinlocks prevent multiple processors from simultaneously
    executing a critical section of code on shared memory. In a uni-processor environment
    the spinlocks simply lock out the scheduler.


    The preemption improvement strategy starts by turning the spinlocks into priority
    inheritance mutexes. This work of introducing preemption points in the kernel
    has been ongoing since late in the 2.4 series development. Mainline kernels these
    days implement three different preemption models, one of which is selected at
    build time as a configuration parameter:


    +   * **No Forced Preemption (Server):** This is the traditional Linux preemption
    model, intended to maximize throughput. This is the preferred model for server
    applications. System call returns and interrupts are the only preemption points.

    +   * **Voluntary Kernel Preemption (Desktop):** This option reduces the latency
    of the kernel by adding more “explicit preemption points” to the kernel code,
    at the cost of slightly lower throughput. In addition to explicit preemption points,
    system call returns and interrupt returns are still implicit preemption points.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '• Preemptible Kernel (Low-Latency Desktop): This option reduces the latency
    of the kernel even further by making all kernel code that is not executing in
    a critical section preemptible. An implicit preemption point is located after
    each preemption disable section.


    Note, by the way, that when we speak of kernel preemption, we are referring to
    process latency, not interrupt latency. With a standard uni-processor Linux kernel,
    interrupt latency is on the order of 10 microseconds or less, depending of course
    on processor speed. As noted above, maximum process latency for a standard kernel
    is in the tens of milliseconds. The preemption improvement strategy reduces that
    to one to two milliseconds.


    The advantage to the preemption improvement approach is that the real-time applications
    run in user space, just like any Linux application using the familiar Linux/POSIX
    APIs. Real-time processes are subject to the same memory protection rules as ordinary
    others. But it is still not hard real-time. Latency is reduced, but there are
    simply too many execution paths in the kernel to permit comprehensive analysis
    of determinism.


    Along with kernel preemption, the process scheduler has undergone several major
    overhauls over the years. The original scheduler, in use through the 2.4 series,
    exhibited what is called O(n) behavior, meaning that the time required to schedule
    the next process was proportional to the number of ready processes in the queue.
    That is, the scheduler traversed the entire queue to determine which process had
    the highest claim on the processor at this instant in time.


    So-called “big-O” notation is a way of representing the time complexity of algorithms
    as a function of the number of inputs. Many algorithms exhibit O(n) behavior,
    while others can be much worse, as in O(n2) or, really bad, O(n!). Most of the
    time, the best behavior is O (1), meaning that the execution time is constant
    with respect to the number of inputs. But, on the other hand, if the constant
    time is 3 hours, it might be better to look at an O(n) algorithm that may actually
    run faster for the most likely number of inputs.


    The scheduler introduced in the 2.6 series exhibited O(1) behavior meaning that
    the scheduling time is independent of the number of ready processes. Kernel version
    2.6.23 introduced the Completely Fair Scheduler (CFS), where the run queue is
    replaced by what is called a Red-Black Tree. It is an O(log n) algorithm. Choosing
    the next task to run is constant time, but inserting a preempted task back in
    the tree is log n. The CFS also features nanosecond timing granularity.


    We should take a quick look at another configuration option that surfaced in the
    2.6 kernel. You now have the option to turn off virtual memory. No more paging!
    This addresses the second major impediment to real-time behavior in Linux listed
    at the beginning of the chapter.


    Turning off virtual memory is fine, as long as you can anticipate the maximum
    amount of memory your system will require. In fact, in an embedded situation this
    is often possible.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'You know what applications will be running and how much memory they require.
    So just make sure that much RAM is available.


    The option to turn off virtual memory is called “Support for paging of anonymous
    memory” and shows up under “General setup” in the configuration menu.


    In parallel with all the work on preemption improvement and the scheduler, another
    project called the PREEMPT_RT Patch has been ongoing. The goal of this project
    is to implement true hard real-time behavior in the Linux kernel. The key point
    of the PREEMPT_RT patch is to minimize the amount of kernel code that is nonpreemptible,
    while also minimizing the amount of code that must be changed in order to provide
    this added preemptibility.


    Another significant feature of the PREEMPT_RT patch is how it handles interrupts.
    The upper, A, portion of Fig. 17.1 shows how interrupts are normally handled.
    When the interrupt occurs, the interrupt handler of necessity preempts the currently
    running task to do whatever is necessary to service the interrupt. The interrupted
    task is held off for as long as it takes. In a PREEMPT_RT kernel, all the interrupt
    handler does is wake up a corresponding interrupt kernel thread, as shown in the
    B part of Fig. 17.1. The kernel thread is scheduled by the scheduler. It is possible
    that the currently running task has higher priority than the interrupt thread,
    so it continues to run following the interrupt handler. In principle, this gives
    us better control over scheduling.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_265_0.png)


    We will look at the PREEMPT_RT patch in more detail later in the chapter.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# **Interrupt Abstraction**


    The improvements in the mainline kernel, while significant, still do not get us
    to deterministic, real-time performance. Even though the default scheduler is
    very good, it still attempts to be “fair.” There is also the problem of the block
    I/O system reordering and combining I/O requests in the interest of maximizing
    throughput. So we need to circumvent these issues, at least for the parts of the
    application that are truly real-time.


    It turns out that in a great many applications, only a small part of the system
    truly requires hard real-time determinism. Controlling a high-speed PID loop or
    moving a robot arm are examples of hard real-time requirements. But logging the
    temperature the PID loop is trying to maintain, or graphically displaying the
    current position of the robot arm, are generally not real-time requirements.


    The alternate, and some would say more expedient, approach to real-time performance
    in Linux relies on this distinction between what is real-time and what is not.
    The technique is to run Linux as the lowest priority task (the idle task if you
    will) under a small real-time kernel. The real-time functions are handled by higher
    priority tasks running under this kernel. The non real-time stuff, like graphics,
    file management, and networking, which Linux already does very well, is handled
    by Linux.


    This approach is called “Interrupt Abstraction,” because the real-time kernel
    takes over interrupt handling from Linux. The Linux kernel “thinks” it is disabling
    interrupts, but it really is not. The essence of interrupt abstraction is illustrated
    in Fig. 17.2. The real-time kernel effectively intercepts hardware interrupts
    before they get to the Linux kernel. Linux no longer has direct control over enabling
    and disabling interrupts. So when Linux says disable interrupts, the RT kernel
    simply clears an internal software interrupt enable flag, but


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_266_0.png)


    **Figure 17.2**

    RT Linux architecture.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'leaves interrupts enabled. When a hardware interrupt occurs, the RT kernel
    first determines to whom it is directed:


    +   RT Task: Schedule the task

    +   Linux: Check the software interrupt flag. If enabled, invoke the appropriate
    Linux interrupt handler. If disabled, note that the interrupt occurred and deliver
    it later when Linux re-enables interrupts.


    The Linux kernel is treated as the lowest priority, or idle, task under the RT
    kernel, and only runs when there are no real-time tasks ready to run.


    Of course, there will be times when the RT kernel has to disable hardware interrupts
    to manage its own critical sections, but these are of much shorter duration than
    the critical sections in Linux.


    The real-time tasks can run either as kernel space loadable modules, or as user
    space processes. User space RT tasks communicate with the RT kernel through a
    kernel space “buddy task.” Kernel space RT tasks will usually have some need to
    communicate with user-space processes for things like file access, network communication,
    or user interface. The RT kernel provides mechanisms like FIFOs and shared memory
    that support communication with user space processes.


    Being much smaller and simpler, the real-time OS is amenable to execution time
    analysis that provides reliable upper bounds on latency. And while this approach
    also involves modifying the kernel, the extent of the modifications is substantially
    less than the Preemption Improvement approach.


    The Interrupt Abstraction RTOS introduces its own API, and purists insist that
    this is not “true” Linux. But as the interrupt abstraction approach has evolved
    over the years, the two major implementations have both evolved “wrappers” around
    the native API for POSIX threads. This mitigates, to some extent, the objections
    of the purists.


    There are two major implementations of the Interrupt Abstraction approach:


    +   RTLinux: This is the original interrupt abstraction implementation. It was
    developed at the New Mexico Institute of Mining and Technology under the direction
    of Victor Yodaiken. Even though RTLinux was developed as open source, Victor subsequently
    received a patent on the idea of running one operating system on top of another
    and formed a company, FSM Labs, to commercialize a proprietary version that he
    subsequently sold to Wind River. The open source continued to exist for several
    years, but its website now redirects to Wind River.

    +   RTAI: This is an enhancement of RT Linux developed at the Dipartimento di
    Ingegneria Aerospaziale, Politecnico di Milano under the direction of Prof. Paolo
    Mantegazza. It is a very active open source project with many contributors.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# **A Third Way: Xenomai**


    Xenomai is another approach to interrupt abstraction that was, for a time, part
    of the RTAI project. It subsequently split off into an independent project. All
    real-time tasks in xenomai run in user space. Xenomai’s real-time core implements
    a native API that is suspiciously similar to RTAI. In addition, it offers “skins”
    that implement APIs for popular OSes such as Posix, VxWorks, and $\mu$ITRON, among
    others. What apparently drove the split between RTAI and xenomai is that the former
    seems obsessively focused on minimizing latency, while the latter aims for clean
    design, extensibility, and maintainability.


    Xenomai actually implements two different approaches to interrupt abstraction
    based on a *Real Time Driver Model (RTDM)* that specifies characteristics for
    device drivers operating with real-time constraints. The traditional dual kernel
    approach is illustrated in Fig. 17.3. The real-time kernel is called the Cobalt
    Core, and is represented in user space by `libcobalt`. Applications using Posix
    threads APIs talk directly to `libcobalt`. Applications using other RTOS APIs
    talk to their respective “skin,” which then talks to the coberrplate interface.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_268_0.png)


    The alternate, newer approach dispenses with the second kernel and has `glibc`
    talk directly to the native RTDM specification (Fig. 17.4). All scheduling is
    done by the standard Linux kernel. The performance is not as good as the dual
    kernel approach, but it is perceived to be simpler. In most cases, you would probably
    want to install the PREEMPT_RT patch in your kernel. The choice of single or dual
    kernel operation is made at build time.'
  merge: -1
  img_proc: true
