    /home/samples/src/adc-on.sh\n/home/samples/src/network/thermostat_t\n```\n\n**Listing\
    \ 14.1**  \nthermo.sh.\n\nMake a copy of bonescript.service, calling it thermostat.service.\
    \ Listing 14.2 shows the final version of thermostat.service with the changes\
