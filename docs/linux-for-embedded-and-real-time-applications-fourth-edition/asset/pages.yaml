    # Embedded Web Servers


    While programming directly at the sockets level is a good introduction to networking,
    and a good background to have in any case, most real-world network communication
    is done using higher level application protocols. **HTTP**, the protocol of the
    World Wide Web, has become the de facto standard for transferring information
    across networks. No big surprise there. After all, virtually every desktop computer
    in the world has a web browser. Information rendered in HTTP is accessible to
    any of these computers with no additional software.


    # Background on HTTP


    HTTP is a fairly simple synchronous request/response ASCII protocol over TCP/IP,
    as illustrated in Fig. 10.3. The client sends a request message consisting of
    a header and, possibly, a body separated by a blank line. The header includes
    what the client wants, along with some optional information about its capabilities.
    Each of the protocol elements shown in Fig. 10.3 is a line of text terminated
    by CR/LF. The single blank line at the end of the header tells the server to proceed.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_174_0.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'A typical request packet is shown in Listing 10.1. The first line starts with
    a method token, in this case GET, telling the server what “method” to use in fulfilling
    this request. This is followed by the “resource” that the method acts on, in this
    case a file name. The server replaces the “/” with the default file index.html.
    The remainder of the first line says the client supports HTTP version 1.1.


    ```

    GET / HTTP/1.1

    Host: 127.0.0.1

    User-Agent: Mozilla/5.0 (X11; U; Linux i586; en-US; rv:1.2.1) Gecko/20030225

    Accept: text/xml, application/xml, application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8

    Accept-Language: en-us, en;q=0.50

    Accept-Encoding: gzip, deflate, compress;q=0.9

    Accept-Charset: ISO-8859-1, utf-8;q=0.66, *;q=0.66

    Keep-Alive: 300

    Connection: keep-alive

    <blank line>

    ```


    # Listing 10.1


    The Host: header specifies to whom the request is directed, while the User-Agent:
    header identifies who the request is from. Next come several headers specifying
    what sorts of things this client understands in terms of media types, language,
    encoding, and character sets. The Accept: header line is actually much longer
    than shown here.


    The Keep-Alive: and Connection: headers are artifacts of HTTP version 1.0, and
    specify whether the connection is “persistent,” or is closed after a single request/response
    interaction. In version 1.1 persistent connections are the default. This example
    is just a small subset of the headers and parameters available. For our fairly
    simple embedded server, we can in fact ignore most of them.


    # A Web-Enabled Thermostat


    To make data available via HTTP, you need a web server. Creating a web server
    for an embedded device is not nearly as hard as you might think. That is because
    all the rendering, the hard part, is done by the client, the web browser. By and
    large, all the server has to do is deliver files.


    The network/ directory contains a simple example called webserve.c. Open it in
    Eclipse. It starts out quite similar to netserve.c, except that it listens on
    port 80, the one assigned to HTTP. Once the connection is established, the server
    reads a request message from the client and acts on it. For our rather limited
    purposes, we are only going to handle two methods: POST and GET.'
