- pgno: 122
  md: 'Note that Linux changes the way we have traditionally done embedded programming,
    as shown in Fig. 7.3. Embedded systems almost always comprise some combination
    of RAM and nonvolatile memory in the form of ROM, PROM, EPROM, or flash. The traditional
    way to build an embedded system is to create an executable image of your program,
    including all library functions statically linked, and perhaps a multitasking
    kernel. You then load or “burn” this image into one or more nonvolatile memory
    chips. When the system boots, the processor begins executing this image directly
    out of ROM.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_122_0.png)


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_122_1.png)


    Figure 7.3


    Two views of embedded programming.


    In the Linux view, programs are “files” that must be loaded into memory before
    executing. Therefore, we create a ROM “file system” containing file images of
    whatever programs the system needs to run. This may include various utilities
    and daemons for things like networking. These programs are then loaded into RAM
    by the boot initialization process, or as needed, and they execute from there.


    Generally, the C library is not statically linked to these image files, but is
    dynamically linked so that a single copy of the library can be shared by whatever
    programs are in memory at a given time.


    One of the advantages of the Linux approach is that we are not confined to loading
    program files from the ROM file system. As just demonstrated, we can just as easily
    load programs over a network for testing purposes.


    # The  $ led $  Program


    Let us take a closer look at the $ led $  program as a way of understanding how
    to access peripherals from user space in Linux. Open  $ led.c $  with the Ecllipse
    editor. You will probably want to turn on line numbers in the editor. Right-click
    in the marker  $ \bar{b} $  and select  $ Show Line Numbers $ .


    Note first of all the “??” symbols next to all of the  $ \#include $  directives.
    If you mouse over one of these, it says “Unresolved inclusion”. This means that
    Eclipse could not find the header files, and thus cannot itself resolve the symbols
    in the header files. The project will,'
