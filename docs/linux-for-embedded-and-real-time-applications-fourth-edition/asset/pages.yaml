    \n[Service]\nWorkingDirectory=/home/samples/src/network\nExecStart=/home/samples/src/network/thermo.sh\n\
    StandardOutput=tty\nSyslogIdentifier=thermo\n\n[Install]\nWantedBy=multi-user.target\n\
    ```\n\n**Listing 14.2**  \nthermostat.service.\n\nSave the file in /lib/systemd/system.\n\
    \nNow execute these systemctl commands:\n\n```\nsystemctl daemon-reload\nsystemctl\
    \ enable thermostat.service\nsystemctl start thermostat.service\n```\n\nsystemctl\
    \ daemon-reload causes systemd to pick up the fact that you added the thermostat.service.\
    \ The systemctl start command causes the thermostat to start running. The systemctl\
    \ enable command creates a link in /etc/systemd/system/multi-user.target pointing\
    \ to /lib/"
