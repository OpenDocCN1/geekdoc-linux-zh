  img_proc: true
- pgno: 61
  md: 'The mechanism that maps physical devices into the file system’s directory structure
    is called “mounting”$^{6}$ . Removable media devices such as the CD-ROM drive
    are the most visible manifestation of this feature. Before you can read a CD-ROM,
    you must mount the drive onto an existing node in the directory structure using
    the mount command as in:


    ```

    mount /media/cdrom

    ```


    This command works because the file /etc/fstab has information about what device
    is normally mounted at /media/cdrom and what type of file system, in this case
    iso9660 , the device contains.


    Like file permissions, mount can sometimes be a nuisance if all you want to do
    is read a couple files off a CD. But the real value of the mount paradigm is that
    it is not limited to physical devices directly attached to the computer, nor does
    it only understand native Linux file systems. As we will see later, we can mount
    parts of file systems on remote computers attached to a network to make their
    files accessible on the local machine. It is also possible to mount a device that
    contains a DOS FAT or VFAT file system. This is particularly useful if you build
    a “dual-boot” system that can boot up into either Windows or Linux. Files can
    be easily shared between the two systems. Or, if your embedded device has an SD
    or micro SD slot, or even USB, the ability to read VFAT file systems is extremely
    useful.


    # ## System Configuration


    The section above on the FHS mentioned the /etc directory. Here is one place where
    Unix systems really shine relative to Windows. OK, there may be many number of
    ways that Unix outschemes Windows. In any case, the /etc directory contains essentially
    all of the configuration information required by the kernel and applications in
    the form of plain text files. The syntax and semantics of these files is not always
    immediately obvious, but at least you can read them. The format of many of the
    kernel’s configuration files is documented in man pages (see section below on
    help).


    By contrast, Windows systems have made a point of hiding configuration information
    in a magical place called “the Registry” (cue ominous music). Mortal users are
    often cautioned to stay away from the Registry, because improper changes can render
    the system unbootable. In fact, the registry can only be changed by a special
    program, regedit , and it was only a few years ago that I finally figured out
    where the registry physically resides.


    If you have ever mustered up the courage to run regedit and actually look at the
    registry, you have no doubt noticed that the entries are rather obscure symbols,
    and the values are even more obscure numeric values. I submit that this was absolutely
    intentional on


    $^{6}$ The term probably harks back to the days of reel-to-reel tape drives onto
    which a reel of tape had to be physically “mounted.”'
  merge: -1
  img_proc: true
