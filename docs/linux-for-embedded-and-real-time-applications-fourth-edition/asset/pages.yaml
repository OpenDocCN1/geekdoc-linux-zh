- pgno: 17
  md: "people assume that real-time means really fast. Not true. Real-time simply\
    \ means *fast enough* in the context in which the system is operating. If we're\
    \ talking about the computer that runs your car's engine, that's fast! That guy\
    \ has to make decisions—about fuel flow, spark timing—every time the engine makes\
    \ a revolution.\n\nOn the other hand, consider a chemical refinery controlled\
    \ by one or more computers. The computer system is responsible for controlling\
    \ the process and detecting potentially destructive malfunctions. But chemical\
    \ processes have a time constant in the range of seconds-to-minutes at the very\
    \ least. So we would assume that the computer system should be able to respond\
    \ to any malfunction in sufficient time to avoid a catastrophe.\n\nBut suppose\
    \ the computer were in the midst of printing an extensive report about last week's\
    \ production, or running payroll when the malfunction occurred. How soon would\
    \ it be able to respond to the potential emergency?\n\nThe essence of real-time\
    \ computing is not only that the computer responds to its environment fast enough,\
    \ but that it responds *reliably* fast enough. The engine control computer must\
    \ be able to adjust fuel flow and spark timing every time the engine turns over.\
    \ If it's late, the engine doesn't perform right. The controller of a chemical\
    \ plant must be able to detect and respond to abnormal conditions in sufficient\
    \ time to avoid a catastrophe. If it doesn't, it has failed.\n\nI think this quote\
    \ says it best:\n\n> A real-time system is one in which the correctness of the\
    \ computations not only depends upon the logical correctness of the computation,\
    \ but also upon the time at which the result is produced. If the timing constraints\
    \ of the system are not met, system failure is said to have occurred.\n> \n> *Donald\
    \ Gillies in The Real-time Computing FAQ*\n\nSo, the art of real-time programming\
    \ is designing systems that reliably meet timing constraints in the midst of random\
    \ asynchronous events. Not surprisingly, this is easier said than done and there\
    \ is an extensive body of literature and development work devoted to the theory\
    \ of real-time systems.\n\n# How and Why Does Linux Fit in?\n\nLinux developed\
    \ as a general-purpose operating system in the model of Unix, whose basic architecture\
    \ it emulates. No one would suggest that Unix is suitable as an embedded or real-time\
    \ operating system. It's big, it's a resource hog, and its scheduler is based\
    \ on “fairness” rather than priority. In short, it's the exact antithesis of an\
    \ embedded operating system."
  merge: -1
