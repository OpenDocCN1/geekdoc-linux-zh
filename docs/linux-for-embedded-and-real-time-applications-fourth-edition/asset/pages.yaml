- pgno: 13
  md: 'introduction to Linux itself, for those not familiar with Unix/Linux systems.
    You will set up and connect the target board that will be used in Part 2 to investigate
    cross-platform application development. Finally, you will install and get familiar
    with various cross-development tools including Eclipse, the open source integrated
    development environment.


    Part 2, Chapter 7, Accessing hardware through Chapter 12, Configuring and building
    the Linux kernel, explores application programming in a cross-platform environment.
    We will look at accessing hardware from user space, debugging techniques, and
    high level simulation for preliminary debugging. We will introduce Posix threads,
    network programming, and Android, and we will briefly look at kernel level programming
    and device drivers.


    Part 3 goes on to look at various components and tools in the embedded Linux programmer’s
    toolkit. We will look at the u-boot boot loader, BusyBox, Buildroot, and OpenEmbedded,
    among others. Finally, we will wrap up with an exploration of real-time enhancements
    to Linux.


    OK, let’s get on with it. Join me for a thrill-packed, sometimes bumpy, but ultimately
    fun and rewarding, roller coater ride through the exciting world of embedded Linux.'
