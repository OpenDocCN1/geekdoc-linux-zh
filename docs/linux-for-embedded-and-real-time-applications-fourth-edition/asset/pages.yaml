- pgno: 118
  md: 'Now it is time to put all that together to build application programs in a
    cross-development environment.


    # ## ARM I/O Architecture


    Like most contemporary processor architectures, the **ARM** places peripheral
    devices in the same address space as memory. This means that peripherals can be
    accessed with any instructions that access memory. The program need not know or
    care whether it is accessing memory or a hardware device. This is in contrast
    to, e.g., the x86 architecture, where peripheral devices exist in a separate address
    space accessed by separate input/output instructions.


    In the case of the x86, not only is *I/O* in a separate address space, the *I/O*
    instructions can only be executed from Privilege Level 0, also known as “Kernel
    space”. This necessitates the use of Kernel space device drivers to access peripherals.
    The **ARM**, on the other hand, lets us access peripherals directly from a user
    application. That is not to say that accessing peripherals directly from an application
    is a good idea, but it is a useful place to start.


    The memory map in Table 7.1 shows in abbreviated fashion how the 32-bit address
    space of the **BBB**’s Sitara processor is allocated. Table 7.1 only shows the
    address areas that we are interested in. For more complete detail, download the
    *AM335x* and *AMIC110 Sitara Processors Technical Reference Manual* from Texas
    Instruments. See the Resources section for the web address.


    # **Table 7.1:** Sitara SoC memory map


    |Function|Start Address|End Address|Size|Usage|

    |:---:|:---:|:---:|:---:|:---:|

    |External RAM|0x8000_0000|0xBFFF_FFFF|1 GB||

    |MMC0|0x4806_0000|0x4806_FFFF|4 KB|Micro SD card|

    |MMC1|0x481D_8000|0x481D_8FFF|4 KB|eMMC (4 GB)|

    |GPIO0|0x44E0_7000|0x44E0_7FFF|4 KB||

    |GPIO1|0x44E0_C000|0x44E0_CFFF|4 KB||

    |GPIO2|0x481A_C000|0x481A_CFFF|4 KB||

    |GPIO3|0x481A_E000|0x481A_EFFF|4 KB||

    |ADC|0x44E0_D000|0x44E0_EFFF|8 KB||


    There are a couple of interesting things to note about this map. First, it seems
    that modern **ARM SoCs** tend to put peripheral registers “in the middle” of the
    address space, starting around 0x4400_0000 up to about 0x5700_0000. In my previous
    experience, peripheral registers usually occupy the top few pages of the address
    space. The address space is divided between two levels of interconnect busses
    called “L3” and “L4”. Memory and high speed peripherals are attached to L3, and
    lower speed peripherals are attached to L4. Much of the address space is marked
    as “Reserved”.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# LEDs


    The four user LEDs use bits 21 to 24 of GPIO1 based at address 0x4804C000. Fig.
    7.1 shows how the LEDs are mapped to bits in the GPIO1 data register.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_119_0.png)


    The Sitara’s GPIO ports are quite complex, with a large number of registers. Each
    of the 32 bits in a GPIO port can serve as input or output, an interrupt source,
    or a debounced keypad input. Data output bits may be directly written with 1 or
    0, or individually set or cleared by writing a 1 to the corresponding set or clear
    register. Table 7.2 lists some of the registers contained in each GPIO port. These
    are the ones that are most relevant to our example right now.


    **Table 7.2: GPIO register offsets**


    | Offset | Name | Description |

    |---|---|---|

    | 0x134 | GPIO_OE | Input or output, 1 = input, 0 = output |

    | 0x138 | GPIO_DATAIN | Input data register. Returns value of pins. Writing has
    no effect |

    | 0x13C | GPIO_DATAOUT | Output data register. Pins reflect what is written here
    |

    | 0x140 | GPIO_LEVELDETECT0 | Enables interrupt generation on low level (0) detect
    |

    | 0x144 | GPIO_LEVELDETECT1 | Enables interrupt generation on high level (1) detect
    |

    | 0x148 | GPIO_RISINGDETECT | Enables interrupt generation on rising edge, 0 to
    1 transition |

    | 0x14C | GPIO_FALLINGDETECT | Enables interrupt generation on falling edge, 1
    to 0 transition |

    | 0x150 | GPIO_DEBOUNCENABLE | Enables the debounce feature |

    | 0x154 | GPIO_DEBOUNCINGTIME | Sets the debounce time for any bits in this port
    that have debounce enabled. Time = value*31 usec |

    | 0x190 | GPIO_CLEARDATAOUT | Writing 1 clears data out bit to 0. Writing 0 has
    no effect |

    | 0x194 | GPIO_SETDATAOUT | Writing 1 sets data out bit to 1. Writing 0 has no
    effect |


