  md: '# # File Manager


    One of the first things I want to do with a new system is open a file manager
    so I can see what is on the system. Click the **Application Launcher** and select
    *Home*. The file manager initially displays the contents of your *home directory*,
    the place where you store all of your own files. Note that, by default, KDE uses
    a single click to activate items. You can change that to double click by selecting
    `Settings>System Settings` from the *Application Launcher*. Scroll down to `Hardware`
    and select `Input Devices>Mouse`.


    The default file manager in recent Red Hat-based releases is called *Dolphin*
    and, again, is not my cup of tea. I find the older file manager, *Konqueror*,
    to be easier to use and to provide a more useful presentation. You can change
    file managers by right-clicking on the *Application Launcher* and selecting `Edit
    Applications...`. In the KDE Menu Editor, select *Home* and enter the *Command*:
    shown in **Fig. 3.2**.


    **Fig. 3.3** shows Konqueror as I have it configured. Not surprisingly, that is
    not how it looks initially. To get the navigation panel on the left, click on
    the red “Root folder” icon on the far left. There are lots of options in Konqueror,
    so play around with it to get it exactly to your liking.


    You probably won’t see much in your home directory initially. That’s partly because
    many of the entries are “hidden,” that is not visible to the file manager. By
