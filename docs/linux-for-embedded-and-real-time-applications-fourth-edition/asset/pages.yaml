    Ubuntu was the third most popular distribution in 2015.


    # Red Hat Enterprise Linux


    Red Hat Enterprise Linux (RHEL) is specifically targeted at the commercial market,
    including mainframes. There are server versions for x86, x86-64, Itanium, PowerPC,
    and IBM System z, and desktop versions for x86 and x86-64. While RHEL derives
    many of its features from Fedora, it has a more conservative release schedule,
    with major releases appearing about every 2 years. As of late 2016, the latest
    stable release is 7.2.


    Even though RHEL is a commercial product, it is based entirely on Open Source
    code. Consequently, Red Hat makes the entire source code base available for download.
    Several groups have taken advantage of this to rebuild their own versions of RHEL.
    One of the best known of these is CentOS, said to be the 8th most popular distribution,
    as of late 2015. These rebuilds remove any reference to Red Hat’s trademarks,
    and point the update systems at non-Red Hat servers. Otherwise, they are functionally
    identical.


    While the rebuilds are free, they are of course not eligible for any kind of Red
    Hat support.


    # Fedora


    The Fedora Project was started in late 2003 when Red Hat discontinued its retail
    line of Linux distributions to focus on enterprise software. The original Fedora
    release was based on Red Hat Linux 9. Red Hat continues to sponsor the Fedora
    Project, which serves as a launching point for releases of RHEL.


