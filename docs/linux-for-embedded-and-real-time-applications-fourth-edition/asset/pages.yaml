    # Remote Debug Launch Configuration


    We will need a different debug launch configuration for remote debugging. With
    the measure project selected in the Project Explorer view, bring up the Debug
    Configuration dialog either from Run > Debug Configurations... , or click the
    down arrow next to the cute little bug icon and select Debug Configurations...
    Even though there is a category called C/C++ Remote Application, we are going
    to create this new configuration under C/C++ Application just like we did for
    record_sort.


    +   1. With C/C++ Application selected, click the New button. This brings up the
    Debug Configurations dialog, as we saw in Chapter 5, Eclipse integrated development
    environment, with the name and project entries filled out.


    +   2. We need to fill in the C/C++ Application entry. Click Search Project...
    That brings up a dialog listing all of the executables found in the project. Select
    measure and click OK.


    +   3. In the center of the dialog is an entry labeled Build (if required) before
    launching. I recommend selecting Disable auto build. There will be situations
    later on where auto build would try to build the all target and fail. The failure
    is innocuous, but it can be disconcerting. Note however that even if you disable
    auto build, Eclipse may still try to build the all target and output the following
    message:

    +      Errors exit in the active configuration of project "measure". Proceed with
    launch?

    +      Click Yes. The debug session will proceed correctly.


    +   4. At the bottom of the Main tab is an entry labeled Using GDB Debugger Services
    Framework (DSF) Create Process Launcher with a link labeled Select other... Click
    that link to bring up the dialog shown in Fig. 8.2.


    +   5. Check Use configuration specific settings, and select Legacy Create Process
    Launcher. Click OK.


    The issue here is how remote debug sessions are set up and controlled. DSF offers
    a more seamless, integrated “experience” that we will look at later in the chapter.
    For now, we will use the simpler approach offered by the Legacy Process Launcher.'
