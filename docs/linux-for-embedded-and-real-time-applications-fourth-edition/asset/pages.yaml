  md: '# **The Filesystem Hierarchy Standard**


    A Linux system typically contains a very large number of files. For example, a
    typical CentOS installation may contain upwards of 30,000 files occupying several
    GB of disk space. Clearly it is imperative that these files be organized in some
    consistent, coherent manner. That is the motivation behind the Filesystem Hierarchy
    Standard (FHS). The standard allows both users and software developers to “predict
    the location of installed files and directories”⁴. FHS is by no means specific
    to Linux. It applies to Unix-like operating systems in general.


    The directory structure of a Linux file system always begins at the *root*, identified
    as “/”. FHS specifies several directories and their contents directly subordinate
    to the root. This is illustrated in **Fig. 3.10**. The FHS starts by characterizing
    files along two independent axes:


    +   - Shareable versus nonshareable. A networked system may be able to mount certain
    directories through Network File System, such that multiple users can share executables.
    On the other hand, some information is unique to a specific computer, and is thus
    not shareable.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Static versus. variable. Many of the files in a Linux system are executables
    that do not change, they are static. But the files that users create or acquire,
    by downloading or e-mail for example, are variable. These two classes of files
    should be cleanly separated.


    Here is a description of the directories defined by FHS:


    +   - /bin Contains binary executables of commands used both by users and the
    system administrator. FHS specifies what files /bin must contain. These include,
    among other things, the command shell and basic file utilities. /bin files are
    static and shareable.

    +   - /boot contains everything required for the boot process except configuration
    files and the map installer. In addition to the kernel executable image, /boot
    contains data that is used before the kernel begins executing user-mode programs.
    /boot files are static and nonshareable.

    +   - /etc Contains host-specific configuration files and directories. With the
    exception of mtab, which contains dynamic information about file systems, /etc
    files are static. FHS identifies three optional subdirectories of /etc:

    +     - /opt Configuration files for add-on application packages contained in
    /opt.

    +     - /sgml Configuration files for SGML and XML

    +     - /X11 Configuration files for X windows.

    +     - In practice, most Linux distributions have many more subdirectories of
    /etc representing optional startup and configuration requirements.

    +   - /home (Optional) Contains user home directories. Each user has a subdirectory
    under home, with the same name as his/her user name. Although FHS calls this optional,
    in fact it is almost universal among Unix systems. The contents of subdirectories
    under /home is, of course, variable.

    +   - /lib Contains those shared library images needed to boot the system and
    run the commands in the root file system, i.e., the binaries in /bin and /sbin.
    In Linux systems /lib has a subdirectory, /modules, that contains kernel loadable
    modules.

    +   - /media Mount point for removable media. When a removable medium is auto-mounted,
    the mount point is usually the name of the volume.

    +   - /mnt Provides a convenient place to temporarily mount a file system.

    +   - /opt Contains optional add-in software packages. Each package has its own
    subdirectory under /opt.

    +   - /run Data relevant to running processes.

    +   - /root Home directory for the root user⁵. This is not a requirement of FHS,
    but is normally accepted practice and highly recommended.


    > ⁵ Note the potential for confusion here. The directory hierarchy has both a
    root, “/”, and a root directory, “/root”, the home directory for the root user.'
