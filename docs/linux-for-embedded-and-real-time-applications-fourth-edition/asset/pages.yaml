- pgno: 208
  md: 'The options that are not selected remain in the file but are “commented out.”
    The selected options get the appropriate value, “y” for features to be built into
    the kernel image, “m” for modules, a number or an element from a list. `.config`
    is included in the Makefile, where it controls what gets built and how. Early
    in the build process, `.config` is converted into a C header file, `include/linux/autoconf.h`,
    so that the configuration variables can be used to control conditional compilation.


    ```

    #

    # Automatically generated file; DO NOT EDIT.

    # Linux/arm 3.8.13 Kernel Configuration

    #

    CONFIG_ARM=y

    CONFIG_SYS_SUPPORTS_APM_EMULATION=y

    CONFIG_GENERIC_GPIO=y

    CONFIG_HAVE_PROC_CPU=y

    CONFIG_STACKTRACE_SUPPORT=y

    CONFIG_LOCKDEP_SUPPORT=y

    CONFIG_TRACE_IRQFLAGS_SUPPORT=y

    CONFIG_RWSEM_GENERIC_SPINLOCK=y

    CONFIG_ARCH_HAS_CPUFREQ=y

    CONFIG_GENERIC_HWEIGHT=y

    CONFIG_GENERIC_CALIBRATE_DELAY=y

    CONFIG_NEED_DMA_MAP_STATE=y

    CONFIG_VECTORS_BASE=0xffff0000

    CONFIG_ARM_PATCH_PHYS_VIRT=y

    CONFIG_GENERIC_BUG=y

    CONFIG_DEFCONFIG_LIST="lib/..modules/SUNAME_RELEASE/.config"

    CONFIG_HAVE_IRQ_WORK=y

    CONFIG_IRQ_WORK=y

    CONFIG_BUILDTIME_EXTABLE_SORT=y

    ```


    Listing 12.1

    Excerpt of `.config`.


    # A Problem


    It turns out that the kernel we just patched and configured will not build. The
    file `arch/arm/kernel/return_address.c` does not compile, because a function it
    contains is also defined as an inline in `arch/arm/include/asm/ftrace.h`. Internet
    research revealed that the problem was that the kernel would not build under gcc
    version 6, and the solution was to drop back to gcc version 4.9.


    So I built a gcc 4.9 tool chain, and had exactly the same problem. If you look
    at `ftrace.h` you can see the problem. There is a conditional based on a couple
    of configuration variables that ends up declaring the function `return_address()`
    as inline rather than a simple prototype. The real problem is that these configuration
    variables are controlled by `depends` and `selects`, and that makes it very difficult
    to change them using `make xconfig`.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "My solution then was to edit *ftrace.h* to eliminate the conditional entirely\
    \ by commenting it out, and just leave the function prototype. *Listing 12.2*\
    \ highlights my edits. The lines that are changed are emboldened.\n\n```\n// #if\
    \ defined(CONFIG_FRAME_POINTER) && !defined(CONFIG_ARM_UNWIND)\n\n/*\n * return_address\
    \ uses walk_stackframe to do it's work. If both\n * CONFIG_FRAME_POINTER= y and\
    \ CONFIG_ARM_UNWIND= y walk_stackframe uses unwind\n * information. For this to\
    \ work in the function tracer many functions would\n * have to be marked with\
    \ ____notrace. So for now just depend on\n * !CONFIG_ARM_UNWIND.\n */\n\nvoid\
    \ *return_address(unsigned int);\n\n// #else\n\n// static inline void *return_address(unsigned\
    \ int level)\n// {\n//      return NULL;\n// }\n\n// #endif\n```\n\n![](img/f03d6fa2c5faefc793771df52bbb2ef9_209_0.png)\n\
    \nI believe this is the first time I've had to edit a kernel source file in order\
    \ to get the kernel to build. I do not take this lightly, and neither should you.\
    \ Changing kernel code is not something you do on a whim, because there is a very\
    \ real possibility your changes will create some other problem down the road.\
    \ In this case it seems to work.\n\n# Building the Kernel\n\nThe actual process\
    \ of building the kernel varies a little depending on what you are building it\
    \ for. Our primary objective is to build a kernel for the target board, so I'll\
    \ describe that first. Then I'll describe the alternate process of building a\
    \ new kernel for your workstation if you are so inclined.\n\nThe first two steps\
    \ below can be executed as a normal user.\n\n+   make *clean*. Deletes all intermediate\
    \ files created by a previous build. This ensures that *everything* gets built\
    \ with the current configuration options. You will find that virtually all Linux\
    \ makefiles have a *clean* target. Strictly speaking, if you are building for\
    \ the first time, there are no intermediate files to clean up, so you do not have\
    \ to run *make clean*."
