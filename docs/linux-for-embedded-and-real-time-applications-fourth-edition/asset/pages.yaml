    # ### A Data Acquisition Example


    Let us move on to something a little more interesting. The Sitara SoC incorporates
    an 8-channel, 12-bit A/D converter. This can be configured as eight general purpose
    analog channels, or a mixture of resistive touchscreen inputs and general purpose
    analog. We will use channel 0 as the basis of a simple data acquisition example
    that will serve throughout the remainder of this section of the book.


    # ### Set Up the Hardware


    Time to get out the ole'' soldering iron. In the previous chapter, I suggested
    you purchase a prototyping cape and a pair of expansion headers. Now is the time
    to attach the expansion headers to the board. Then you will add a potentiometer
    (pot), as shown in the schematic of Fig. 7.5. I chose 10 kohms to minimize the
    current drawn.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_125_0.png)


    The analog inputs are limited to 1.8 volts, which is the value of the AD REF pin
    on P9. So connect the positive end of the pot to P9-32. Fig. 7.6 is a photo of
    my prototype cape.


    In order to plug a cape onto the BBB, you have to remove the debug serial port.
    Oddly, my USB serial port is no longer working, so I logged into the board using
    SSH. Log in as root:


    ```

    `ssh root@192.168.1.114`

    ```


    Substitute your board''s actual IP address.'
