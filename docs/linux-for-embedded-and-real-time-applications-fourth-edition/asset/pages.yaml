- pgno: 210
  md: 'make This is the heart of the matter. This builds the executable kernel image
    and all kernel modules. Not surprisingly, this takes a while. The resulting compressed
    kernel image is arch/$(ARCH)/boot/zimage.


    The following step requires root user privileges.


    make modules_install INSTALL_MOD_PATH=/export/rootfs. Copies the modules to $(INSTALL_MOD_PATH)/lib/modules/<kernel_version>
    where <kernel_version> is the string identifying the specific kernel you are building.
    Note that when building for the target board, you must explicitly specify the
    root file system. Otherwise, the modules will go into /lib/modules of your workstation''s
    file system. Strictly speaking, this step is not necessary in this case, because
    none of the modules are required to boot the kernel.


    That is it. Note, incidentally, that the build process is recursive. Every subdirectory
    in the kernel source tree has its own Makefile dealing with the source files in
    that directory. The top level Makefile recursively invokes all of the sub Makefiles.


    The process for building a kernel for your workstation differs in a couple of
    details. Do make modules_install without the INSTALL_MOD_PATH argument, and then
    execute this step, also as root:


    make install. This does several things. It copies the kernel executable, called
    vmlinuz for x86 builds, to /boot along with System.map, the linker map file. It
    adds a new entry to /boot/grub/grub.conf, so the GRand Unified Bootloader can
    offer the new kernel as a boot option. Finally, it creates an initial ramdisk,
    initrd, in /boot.


    # Workstation Digression


    Before we move on to loading and testing our new kernel, the last two items mentioned
    above deserve a passing explanation. Most workstation installations these days
    incorporate a boot loader called GRUB (GRand Unified Bootloader) to select the
    specific kernel or alternate operating system to boot. There is a very good reason
    for having the ability to boot multiple kernel images. Suppose you build a new
    kernel and it fails to boot properly. You can always go back and boot a known
    working image, and then try to figure out what went wrong in your new one. If
    you are curious, have a look at the file /boot/grub2/grub.cfg on your workstation.
    You will need to be root user to get into the grub2 directory.


    Most Linux kernels are set up to use initrd, which is short for initial ramdisk.
    An initial ramdisk is a very small Linux file system loaded into RAM by the boot
    loader and mounted as the kernel boots, before the main root file system is mounted.
    The usual reason for using initrd is that some kernel modules need to be loaded
    before mounting the root partition. Usually, these modules are required to support
    the file system used by the root partition, ext3 for example, or perhaps the controller
    that the hard drive is attached to, such as SCSI or RAID.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# ## Booting the New Kernel


    Now that we have a new kernel, how do we test it? We could, of course, load the
    new image into flash, either in addition to, or in place of, the kernel image
    presently there.


    The other alternative is to boot the new image over the network using TFTP. This
    is particularly advantageous in a development environment, because we can quickly
    test a new kernel image without the time-consuming process of burning flash.


    Move `arch/arm/boot/zImage` to `/var/lib/tftpboot`, or wherever else you chose
    as the TFTP directory. Probably the simplest way to accomplish this is with a
    minor change to `uEnv.txt`. Copy `uEnv.txt` to `uEnvnet.txt`, and open with an
    editor. Note the line near the bottom that starts out `netboot=`. This command
    loads the kernel image into memory over TFTP. This is the equivalent of `loadkernel`
    that is presently used to load the kernel image from eMMC flash. So, in the `uenvcmd`,
    just replace `loadkernel` with `netboot`.


    As we did back in Chapter 6, The hardware when bringing up the BBB, save `uEnvnet.txt`
    to the boot partition of the eMMC. Boot the board into the u-boot prompt, change
    `bootenv` to `uEnvnet.txt`, and execute `boot`. After the kernel boots, execute
    the command `uname -a` and note that the kernel image has a timestamp corresponding
    to when you built it.


    Congratulations! You can pat yourself on the back. You are now a Linux hacker.


    # ## Behind the Scenes: What''s Really Happening


    The information in this section is not essential to the process of building a
    kernel, and you are free to ignore it for now. But when you reach the point of
    developing device drivers or other kernel enhancements (or perhaps hacking the
    kernel itself), you will need to modify the files that control the configuration
    process.


    All the information in the configuration menus is provided by a set of text files
    named `Kconfig` that are scattered throughout the source tree. These are script
    files written in *Config Language*, which looks suspiciously like a shell scripting
    language but isn''t exactly. The main `Kconfig` file is located in `linux/arch/${ARCH}`,
    where `ARCH` is the variable in `Makefile` identifying the base architecture.


    Go to `kernel/arch/arm` and open `Kconfig`. Find the line that reads `menu "System
    Type"` down around line 249. Compare the structure of the file with the configuration
    menu starting at System Type, and the pattern should become fairly clear. Each
    configuration option is identified by the keyword `config` followed by the option''s
    symbolic name, for example `config_FHMLI`. Each of these gets turned into a `Makefile`
    variable, or macro, such as `CONFIG_FHMLI`. The `Makefiles` then use these variables
    to determine which components to include in the kernel and to pass `#define` symbols
    to the source code.'
  merge: -1
  img_proc: true
- pgno: 212
  md: "The option type is indicated by one of the following keywords:\n\n+   * `bool`\
    \ — The option has two values, “y” or “n.”\n+   * `tristate` — The option has\
    \ three values, “y,” “n,” and “m.”\n+   * `choice` — The option has one of the\
    \ listed values.\n+   * `int` — The option takes an integer value.\n\nThe type\
    \ keyword usually includes a `prompt`, which is the text displayed in the configuration\
    \ menu. Alternatively, the `prompt` keyword specifies the prompt. There are also\
    \ “hidden” options that have no displayable prompt. At the top of `Kconfig` is\
    \ a set of options that do not show up in the menu, because no prompt is specified.\
    \ These are the options you see when you select **Show All Options** in `xconfig`.\n\
    \nOther keywords within a configuration entry include `help` to specify the help\
    \ text, and `depends`, which means that this option is only valid, or visible,\
    \ if some other option that it depends on is selected. There is also `select`,\
    \ which says that if this option is selected, then of necessity some other option\
    \ must also be turned on.\n\nJust above the menu “*System Type*” line is the line:\n\
    \n```\nsource “kernel/Kconfig.freezer”\n```\n\nThe `source` keyword is how the\
    \ configuration menu is extended to incorporate additional, modular features.\
    \ It is effectively the same thing as `#include` in C. You will find `source`\
    \ lines scattered throughout the main `Kconfig` file.\n\nConfig Language is actually\
    \ much more extensive than this simple example would suggest. For more detail,\
    \ look at `linux/Documentation/kbuild/kconfig-language.txt`.\n\nIn the next chapter,\
    \ we will look at *integrated build environments*, open source projects that attempt\
    \ to do everything for you to build an embedded Linux system.\n\n# # Resources\n\
    \nFor more details on the process of configuring and building a kernel, look at\
    \ the files in `/usr/src/arm-linux/Documentation/kbuild`. Additionally, the following\
    \ HOW-TOs at `www.tldp.org` may be of interest:\n\n+   `Config-HOWTO`\n+   This\
    \ HOWTO is primarily concerned with how you configure your system once it is built.\n\
    +   \n+   `Kernel-HOWTO`\n+   Provides additional information on the topics covered\
    \ in this chapter.\n+   \n+   `www.linuxfromscratch.org/`\n+   — This is a project\
    \ that provides you with step-by-step instructions for building your own custom\
    \ Linux system, entirely from source code. There is a subproject that deals with\
    \ cross-building Linux for embedded environments.\n+   \n+   `lxr.linux.no`\n\
    +   — This is probably my favorite web resource for the Linux kernel. It is the\
    \ kernel source tree hyperlinked and cross-referenced. Virtually all versions\
    \ of the kernel are available. You can look up any symbol in the kernel, see where\
    \ it is declared, and where it is used. You can step through a hierarchy of function\
    \ calls to see what is really going on. It is just great."
  merge: -1
  img_proc: true
- pgno: 213
  md: "# CHAPTER 13\nIntegrated build environments\n\n# Chapter Outline\n\n+   * \
    \  The Problem 207\n+   *   Buildroot 208\n+   *   Open Embedded 210\n+      \
    \ *   OE Metadata 213\n+       *   Testing the New Image: Quick EMUlator 214\n\
    +       *   Personal Observations 214\n+   *   Yocto Project 214\n+       *  \
