  md: '# Advanced Breakpoint Features


    The `thermostat_s` program affords us an opportunity to explore some advanced
    features of breakpoints. Set a breakpoint at the top of the `switch()` statement
    for your state machine. Now go to the Breakpoints view in the upper right of the
    Debug perspective, and right-click the breakpoint entry you just created. Select
    Breakpoint Properties down at the bottom of the context menu. That brings up the
    rather blank looking dialog of Fig. 8.6.


    *Actions* can be attached to a breakpoint such that when it is hit, the attached
    actions are performed. C Development Toolkit offers five classes of predefined
    actions:


    +   * **Play Sound** — Play a selected sound file when the breakpoint is hit.
    Maybe the breakpoint only happens every half hour or so. You can go off and do
    something else,


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_139_0.png)


    **Figure 8.6**

    Breakpoint Properties.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'and when you hear the appropriate beep, you can go back and see what happened.
    Sound files can be `.wav`, `.mid`, `.au`, or `.aiff`.


    +   * **Log Message** — Output a message to the console. To see the message, you
    must select Log Action Messages in the Console view.

    +   * **Run External Tool** — Execute a program that has been configured in Eclipse
    as an external tool. For example, the program might be running on a remote device.
    You could configure the breakpoint to send an e-mail or SMS to your desktop. Programs
    are installed and configured from Run > External Tools > External Tools Configurations...
    .

    +   * **Resume** — Automatically resume the program after a specified delay. Again,
    if the program is running remotely, this is probably the only way to keep it running
    after a breakpoint.

    +   * **Reverse Debugging** — This one is new and not described in the Eclipse
    documentation. There are three possible values: Enable, Disable, and Toggle.


    Let’s create a sound action. In CentOS 7 most sound files, `.wav`, are found in
    subfolders of `/usr/share/`, Several are in `sounds/alosa`. Many others are under
    `kde4/apps/korganizer/sounds/`. Here is how we do it:


    +   1. In the **Actions** dialog, click **New**. Sound Action is selected by default.

    +   2. Give it a name. How about “beep”?

    +   3. Browse to one of the folders that contains `.wav` files, and pick one.
    To hear what it sounds like, click **Play Sound**.

    +   4. Click **OK**.


    The Beep action now shows up in the list of available actions. In a similar fashion,
    create a Log action. Have it print the message “Hit the breakpoint at the switch
    statement.”


    Select each of the entries in the Available actions list, and click **Attach**.
    They both now appear in the list of Actions for this breakpoint. Let the program
    run. You should hear the sound when it hits the breakpoint. In the Console view,
    find the Display Selected Console dropdown near the right hand end of the Console
    menu. Select Log Action Messages. To return to program output, select `[C/C++
    Application]thermostat_s`.


    Bring up the Breakpoint Properties dialog again. Select Common in the left-hand
    column to bring up the dialog in Fig. 8.7. This lists some basic information about
    the breakpoint, such as the file and line number where it is located, and its
    enabled status. It also offers us a couple ways of controlling the breakpoint.


    Condition lets us specify a Boolean expression that controls whether or not the
    breakpoint is taken. If the expression evaluates to true, the breakpoint is taken.
    Otherwise it is ignored. The expression can include any program variables. For
    example, we are only really interested in the breakpoint on the `switch()` statement
    when we expect the state to change.'
