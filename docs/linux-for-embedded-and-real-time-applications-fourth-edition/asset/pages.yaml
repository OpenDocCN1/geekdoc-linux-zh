    On the target board, run `gdbserver:10000 thermostat_t`. Then back in Eclipse,
    click **Debug**. You are now debugging the thermostat program on the target board.


    # ## Debugger Services Framework


    For all its capability, the remote debugging process that we have seen so far
    is a bit tedious. You have to manually start `gdbserver` through the `minicom`
    shell, and that is where the program console is. Wouldn’t it be nice to have `gdbserver`
    start up automatically when you click **Debug**? And have the program I/O show
    up in an Eclipse console view. That is what the DSF does for us.


    DSF is built on top of the Remote System Explorer (RSE), a collection of tools
    that allows you to work directly with resources such as files and folders on remote
    systems. RSE in turn uses SSH, the Secure Shell, to establish communication with
    remote systems.


    # ### Configuring Remote System Explorer


    Fire up Eclipse, and open the RSE perspective. You will find that the Project
    Explorer view on the left has been replaced by a view labeled Remote Systems,
    and the collection of views under the Editor has been replaced by something called
    Remote System Details. Right now, the only thing listed in Remote Systems is Local,
    your workstation. Expand that entry to reveal Local Files and Local Shells. Expand
    Local Files to browse the file system (Fig. 8.8).'
