    Throughout the book we will be installing software from different web sources.
    For now, navigate to the book’s home page at the Elsevier web site, as listed
    in the Resources section. Download the file EmbeddedLinux4.iso. A .iso file is
    an image of an optical disk, either a CD or DVD. The name derives from ISO$^{1}$
    9660, which is the standard for optical disk file systems.


    The file probably ended up in $HOME/Downloads. To access the .iso file, you will
    need to mount it as if it were in fact a disk.


    +   - As root user create a directory under /mnt named iso/.


    +   - mount -t iso9660 $HOME/Downloads/EmbeddedLinux4.iso /mnt/iso.


    # Install Cross-Tool Chain


    Cross-tool chains are available on the web. In particular, the Linaro project
    offers version 6.3 of an ARM GCC tool chain. But there is a problem. The kernel
    will not build in a version 6.x compiler. The recommended version is 4.9. I could
    not find any prebuilt copy of gcc 4.9, so I was forced to build my own using a
    tool named Crosstools-NG. I will save you the trouble of building the tool chain,
    but if you are interested, visit the Crosstools-NG website listed in the Resources
    section.'
