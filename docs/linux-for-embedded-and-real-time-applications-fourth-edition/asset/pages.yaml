- pgno: 214
  md: '+   * Root file system

    +   * Application program(s)


    Getting all of these pieces to “play together” nicely is a non-trivial exercise.
    Not to mention licensing issues. As we saw in Chapter 1, The embedded and real-time
    space, open source software is released under a variety of licenses with different
    provisions. It is important to be sure the various licensees also play well with
    one another.


    Where do all these pieces come from? Ultimately they come from various places
    around the Internet. That is all well and good, but how do you find them?


    The promise of integrated build environments is that they bring everything together
    in one place. Someone else has done the work of finding all these pieces on the
    net, and verifying that they all work together. One feature all of these projects
    have in common, however they are implemented, is that once you finish the configuration
    process, they all go out on the Internet and download the required sources and
    build the components you have specified. One consequence of this is that the initial
    build typically takes a long time. Subsequent modifications typically do not take
    very long, because only a small amount of code is being downloaded and rebuilt.
    Other features they all share: they use the same configuration tools as the kernel,
    and they have plug-ins for Eclipse.


    We will take a tour of three different projects. The websites for these projects
    are listed in the “Resources” section. Feel free to follow along, or not, on your
    own workstation as you choose.


    # Buildroot


    Buildroot is probably the simplest of the integrated build environments. It is
    a set of Makefiles, scripts, and patches that can build all the elements of an
    embedded Linux system as listed above, or any combination of them. Buildroot can
    automatically build the required cross-compilation tool chain, create a root file
    system, compile a Linux kernel image, and build a bootloader for the targeted
    embedded system, or it can perform any independent combination of these steps.


    Unlike the kernel, buildroot’s make help does not list the default configurations
    it can build. Instead there’s a make list-defconfigs target and indeed there is
    a default configuration for the BeagleBone. So execute make beaglebone_defconfig.
    Next, execute make xconfig. The menu is shown in Fig. 13.1.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/f03d6fa2c5faefc793771df52bbb2ef9_215_0.png)


    # **Figure 13.1**


    Buildroot xconfig menu.


    Buildroot offers the option of using an existing tool chain, rather than building
    a new one from source. Since we have a tool chain, that would seem like a sensible
    choice. In the Toolchain category, select Custom toolchain and Pre-installed toolchain.
    You can set the Toolchain path to, since the tool chain is in your PATH. Set the
    Toolchain prefix to arm-unknown-linux-gnueabi.


    The External toolchain gcc version is most likely 4.9.x. In the previous chapter
    we built kernel version 3.8.13, so you would expect to select 3.8.x for External
    toolchain kernel headers series. It turns out though, that pretty much everything
    earlier than 4.1.x is no longer supported and if you select it, the build fails.
    So, even though we already have a Linux kernel source tree, if you want to use
    Buildroot, you will have to select one of their kernels.


    Much of the rest of the Buildroot configuration has to do with selecting packages
    to install on the target. You will not need to select much here, because most
    utilities will be provided by Busybox, which we will go into in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Down at the bottom of the menu, you can select what kind of file system image(s)
    to generate and what compression, if any, to use. You can also configure the bootloader.
    We will go into u-boot in a later chapter. When you are done, save the configuration,
    and just run *make*. When the build is finished the kernel, bootloader, and file
    system images show up in *output/images*.


    # Open Embedded


    While Open Embedded, simply called OE for short, was probably the first attempt
    at a true integrated build environment, its original implementation, now called
    OpenEmbedded-Classic, has been substantially overhauled. The project began by
    merging the efforts of several projects aimed at supporting personal digital assistants
    running Linux including OpenZaurus, Familiar Linux, and OpenSIMPad.


    The current incarnation of OE, called OpenEmbedded-Core, or OE-Core for short,
    resulted from a merger with the Yocto Project that we will see a little later.
    Even though OE-Core remains an active project, much of the ongoing development
    is being done under the auspices of the Yocto Project. In particular, that is
    where the most current documentation resides.


    > WARNING: OE-Core takes a lot of disk space. The Yocto Project suggests that
    you need 50 GB of free space, which of course must all be in one partition. So,
    if you intend to actually build something with OE-Core or Yocto, be sure you have
    enough free space.


    OE-Core is based on a build tool called BitBake written in Python. BitBake''s
    operation can be represented graphically, as shown in Fig. 13.2. It interprets,
    or parses if you prefer, *recipes* and *configuration files* to determine what
    needs to be built and how. Then it *fetches* the necessary source code over the
    network. The output is a set of *packages* and file system *images*.


    ![](img/f03d6fa2c5faefc793771df52bbb2ef9_216_0.png)


    **Figure 13.2**

    BitBake operation.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'BitBake is now a sub-project of the Yocto Project.


    OE-Core itself then is a base layer of recipes, classes, and associated files
    that is meant to be common among many different OpenEmbedded-derived systems.


    There is a *Getting Started* guide in the documentation section of the OE web
    site. What follows is derived from that. Consult the guide for more details.


    The first step is to make sure you have all of the necessary packages installed.
    Here is a complete list of the packages required when installing under CentOS:


    +   - bzip2

    +   - chrpath

    +   - cpp

    +   - diffstat

    +   - diffutils

    +   - gawk

    +   - gcc

    +   - gcc-c++

    +   - git

    +   - glibc-devel

    +   - gzip

    +   - make

    +   - patch

    +   - perl

    +   - python

    +   - SDL-devel

    +   - tar

    +   - texinfo

    +   - unzip

    +   - wget

    +   - xterm


    The list for other distributions is similar. In reality, most of these were installed
    during the original CentOS installation. Here is the command for the packages
    I had to install (run as root of course):


    ```

    yum install texinfo chrpath SDL-devel

    ```


    It turns out that the version of python in the CentOS repo is too old for OE-Core.
    The upshot is you have to download and install python3. Go to the python web site,
    download the latest, and consult the README file for instructions on installation.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'To install OE-Core, execute these commands from your home directory:


    ```

    ```

    git clone git://git.openembedded.org/openembedded-core oe-core

    cd oe-core

    git clone git://git.openembedded.org/bitbake bitbake

    git checkout pyro

    cd bitbake

    git checkout 1.34

    cd..

    ```

    ```


    The first thing to notice is that OE-core is substantially larger than buildroot:
    about 123 MB vs 17 MB. The next step is to initialize the build environment by
    executing the `oe-init-build-env` script like this:


    ```

    `source oe-init-build-env [build_dir]`

    ```


    Normally, the shell spawns a new process every time it executes a command or script.
    The `source` command causes the script to be executed in the current shell environment.
    The optional argument is the subdirectory of `oe-core/` that holds all the files
    created during the build. The default is `build/`. This script creates a couple
    of configuration files with default values, creates and changes to the `build/`
    directory, and adds some entries to your `PATH` environment variable. Execute
    `echo $PATH`, and note three new entries at the beginning. If you intend to use
    `OE-Core` for real, you might want to add these to the `PATH` definition in your
    `~/.bash_profile` file. Otherwise, you will have to run the `oe-init-build-env`
    script every time you want to do something with OE-Core.


    One of the files just created is `build/conf/local.conf`. This provides general
    configuration for the images you build. Let us have a look. The file is well-commented,
    describing each variable. The first is the `MACHINE` for which to build images.
    All of the possibilities are listed as comments. There are several QEMU targets,
    as well as some specific hardware targets. The default is `qemux86`, the 32-bit
    Intel architecture running under QEMU, an open source multi-platform emulator.


    Next, some directories are specified. Default values are subdirectories of `TOPDIR`,
    the `build/` directory:


    +   *   `DL_DIR`—where downloaded source packages are stored

    +   *   `SSTATE_DIR`—where *shared state* files are stored. This speeds up subsequent
    builds

    +   *   `TMPDIR`—where build output is stored


    We can specify which package management format to use with the `PACKAGE_CLASSES`
    variable. Unless you are building for a "debian flavor" distro, you should probably
    select rpm.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Save `local.conf`, and we are ready to build a cross-tool chain and a set of
    images. OE-Core provides a set of predefined targets that we can use to build
    our own images. A couple of these were listed by `oe-init-build-env`. To see the
    complete set of image targets execute:


    ```

    ls .../meta/*-recipes*/images/* .bb

    ```


    Now to build the `core-image-minimal` image, we simply execute:


    ```

    bitbake core-image-minimal

    ```


    # OE Metadata


    While the image is “baking,” it is an opportunity to explore OE metadata. The
    `metadata` that drives BitBake consists of recipes and configuration files. Recipes
    get the file extension `*.bb`, and configuration files get the extension `.conf`.
    All of this metadata resides in the subdirectory `meta/`. Although it is not obvious
    from the layout of `meta/`, the recipes are divided into a hierarchy of four categories:


    +   * Image

    +   * Task

    +   * Package

    +   * Class


    The motivation for the hierarchical organization is that recipes in lower levels
    can be easily reused.


    Image is the top level of the hierarchy. An image recipe defines what goes into
    a specific root file system image. It lists the tasks that make up the image.
    Have a look at `meta/recipes-core/images/core-image-minial.bb`. It installs one
    task, `packagegroup-core-boot`, and possibly others defined in `CORE_IMAGE_EXTRA_INSTALL`.
    It also inherits a class called `core-image`. Class files get the extension `.bbclass`,
    and reside in `meta/classes/`.


    Task recipes typically represent aggregations of packages. In fact, many of them
    are named `packagegroup-*`. For example take a look at `packagegroup-core-boot.bb`.
    It claims to be “The minimal set of packages required to boot the system.” Among
    other things, it inherits a class called `packagegroup`.


    A package recipe manages the specific needs of an individual package. Package
    recipes typically have a version number appended to the name. `meta/recipes-core/sysvinit/sysvinit_2.88dsf.bb`
    is a typical example. It identifies where the package is found on the net, the
    license terms, the required files, and so on.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Class recipes have a peer-to-peer relationship with the other recipes, rather
    than a hierarchical one. They are used to factor out common recipe elements that
    can then be reused, through the inherit command. The most frequent use of classes
    is to inherit functions or portions of recipes for commonly used build tools like
    the GNU autotools. Have a look at `meta/classes/core-image.bbclass`. It in turn
    inherits `image.bbclass`.


    # *Testing the New Image: Quick EMUlator*


    How do we test our newly created image? OE-Core includes a tool called QEMU, which
    stands for Quick EMUlator. QEMU is an open source project that emulates several
    different machine architectures. The image we just built is for the x86 running
    under QEMU, and is named qemu-x86. So to test it, all we have to say is:


    ```

    runqemu qemu-x86

    ```


    # *Personal Observations*


    Personally, I do not care much for Open Embedded, or the Yocto Project that we
    will look at next. They are simply too big, too complex, too obscure. The learning
    curve is steeper than for Linux itself. To quote the introductory paper listed
    in Resources:


    > "[I]t has a considerable learning curve and the source of build errors may not
    be obvious. Development teams that are unfamiliar with OE should allow at least
    several weeks to attain moderate proficiency."


