    # **Applets**


    The 300-odd BusyBox applets are divided among several categories. These categories
    correspond closely to the BusyBox directory tree. In many cases, the BusyBox version
    of a utility omits some of the more obscure options. You might think of these
    as “lite” versions. Nevertheless, the options that are available will suffice
    for just about anything you need in your embedded system.


    In some cases, you can select the options you want for a command. For example,
    select the Coreutils category and scroll down to `ls`. You will find several selectable
    `ls` options. Presumably, the reason for doing this is to reduce the code size
    if that is important. It would be nice if help gave some indication of how much
    space could be saved with each option.


    Browse through the categories to get a feel for what is there. You will find that
    there is an awful lot of stuff enabled that you probably do not need, like the
    `vi` editor, for example.'
