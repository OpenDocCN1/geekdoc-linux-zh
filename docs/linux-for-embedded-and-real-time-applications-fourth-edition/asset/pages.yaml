  md: 'Next are the steps for importing the project settings into the measure project:


    +   1. Right-click the measure project entry in Project Explorer, and select Properties.

    +   2. Expand C/C++ General and select Paths and Symbols. Click the Import Settings…
    button.

    +   3. Browse to `home/samples/src/`, and select `includes.xml`. Click OK.

