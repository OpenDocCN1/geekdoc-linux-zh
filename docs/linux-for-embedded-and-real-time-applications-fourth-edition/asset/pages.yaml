  md: '# Node.js


    Node.js is not itself a web server, but it is claimed that you can use it to easily
    build web servers. Node.js is described as a server-side platform built on Google
    Chrome’s JavaScript Engine (hence the js). It is intended for easily building
    fast and scalable network applications written in JavaScript and using an event-driven,
    nonblocking I/O model.


    Node.js has been around since 2009, and is apparently fairly popular in the world
    of web programming. The BBB includes Node.js. However, since I know virtually
    nothing about JavaScript, I’m not going to try to describe it. The web page served
    up by the BBB describes a JavaScript library called BoneScript that, among other
    things, provides another way to access the hardware. The demos are probably a
    good place to start.


    We have pretty much wrapped up our tour of application-level programming. In the
    next chapter, we dive down into Kernel space, and have a look at the Linux kernel
    itself.


    # Resources


    *Linux Network Administrators’ Guide*, available from the Linux Documentation
    Project, www.ltnp.org. Not just for administrators, this is a quite complete and
    quite readable tutorial on a wide range of networking issues.


    Jones, M. Tim. *TCP/IP Application Layer Protocols for Embedded Systems*, Charles
    River Media. 2002. The idea of adding a <DATA> tag to HTML came from this book.
    It covers a wide range of application-level network protocols that can be useful
    in embedded scenarios.


    Coner, Douglas. *Internetworking with TCP/IP, Vols. 1, 2, and 3*, Prentice-Hall.
    This is the classic reference on TCP/IP. Volume 1 is currently up to its fifth
    edition dated 2005. Volume 2, coauthored with David L. Stevens, is at the third
    edition, 1998, and volume 3, also coauthored with Stevens, dates from 1997. Highly
    recommended if you want to understand the inner workings of the Internet.


    Internet protocols are embodied in a set of documents known as “RFCs,” Request
    for Comment. The RFCs are now maintained by a small group called the RFC Editor.
    The entire collection of RFCs, spanning the 30- plus year history of the Internet,
    is available from www.rfc-editor.org. In particular, HTTP is described in RFC
    2616, SMTP is described in RFC 821, and POP3 is described in RFC 1081.


    en.wikipedia.org/wiki/Comparison_of_web_server_software – This article features
    a pair of quite useful tables comparing more than a dozen small web server implementations.


    http.apache.org – Home page for the Apache web server.


    www.lighttpd.net – Home page for lighttpd.


    nodejs.org/en/ – Home page for node.js.'
