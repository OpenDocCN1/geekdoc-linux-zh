    # ## Wrap Up


    We’ve come to the end of our long journey through the wonderful world of embedded
    Linux. I hope you have found it worthwhile, maybe even fun. The adventure started
    with some introductory material on the nature of embedded and real-time, and an
    introduction to Linux. After installing Linux we configured our workstation to
    support a cross-development environment for developing applications for an ARM-based
    single board computer.


    Next, we explored Eclipse, the open source IDE and found, among other things,
    that it has a very slick graphical front end for GDB, the Gnu debugger. Then we
    set up our target board, the BeagleBone Black, and launched into application programming
    for said board, getting into Posix threads, networking, and graphics programming
    using QT.


    Then we looked at some of the components and tools that make up the embedded Linux
    ecosystem. We configured and built a Linux kernel. We reviewed the emerging trend
    of integrated build environments for embedded Linux that pretty much attempt to
    do everything for you. We looked at BusyBox, the “Swiss army knife of Linux,”
    and saw how Linux initializes with the goal of getting our application to start
    at boot time. We explored git, the source code control tool that has become pretty
    much a standard in the open source world. And finally, in this chapter, we evaluated
    why Linux is not considered real-time, and what we can do about that.


    By now you have probably come to realize that embedded Linux is a big topic. My
    objective with this book is to introduce you to at least some of the variety of
    issues you will encounter in getting into embedded Linux. We haven’t pursued any
    of them in great detail. I encourage you to explore those topics that catch your
    interest more thoroughly.


    You may have noticed that I have been fairly frank about the difficulties I encountered
    in developing the examples for this book. Some authors would be reluctant to admit
    to that, feeling that it would somehow diminish their credibility. I did it to
    make the point that this Linux stuff is *not easy*! In fact, it is downright difficult.
    After something like 15 years of mucking around with Linux, I still spend a fair
    amount of time on Google teasing out error messages or other bizarre behavior
    that initially makes no sense. Get used to it, guys. You are going to bump up
    against a lot of walls. In the end it is worth it. Linux really is a great tool
    for developing embedded devices.'
  merge: -1
  img_proc: true
