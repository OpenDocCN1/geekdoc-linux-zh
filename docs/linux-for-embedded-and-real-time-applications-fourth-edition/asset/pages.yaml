  md: "# **Posix threads**\n\nChapter Outline\n\n+      Threads  141\n+      Thread\
    \ Attributes  142\n+      Synchronization: Mutexes  143\n+      Mutex Attributes\
    \  145\n+      Problems With Solving the Resource Sharing Problem: Priority Inversion\
