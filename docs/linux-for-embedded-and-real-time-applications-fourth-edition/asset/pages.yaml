    # The ARM Architecture


    ARM is a 32-bit and 64-bit reduced instruction set computer (RISC) architecture
    developed by ARM Holdings, a British company originally known as Advanced RISC
    Machines. It is said to be the most widely deployed 32-bit architecture in terms
    of numbers produced.'
