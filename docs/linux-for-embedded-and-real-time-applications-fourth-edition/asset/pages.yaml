- pgno: 242
  md: 'Dtc refers to the Device Tree Compiler, which we will get to shortly. Nonetheless,
    the *u-boot* executable is there, and you can run it from a command shell. The
    device tree compiler is part of the Linux kernel source tree and again, there
    does not seem to be a corresponding package in the CentOS repos. A simple hack
    to solve this one is to copy `linux/scripts/dtc/dtc` to somewhere in your path
    such as `/usr/local/bin`.


    # *Device Trees*


    One of the biggest problems with porting an operating system such as Linux to
    a new platform is describing the hardware. That is because the hardware description
    is scattered over perhaps several dozen or so device drivers, the kernel, and
    the boot loader, just to name a few. The ultimate result is that these various
    pieces of software become unique to each platform, the number of configuration
    options grows, and every board requires a unique kernel image.


    There have been a number of approaches to addressing this problem. The notion
    of a “board support package” or BSP attempts to gather all of the hardware-dependent
    code in a few files in one place. It could be argued that the entire `arch/` subtree
    of the Linux kernel source tree is a **gigantic board support package**.


    Take a look at the `arch/arm/` subtree of the kernel. In there you will find a
    large number of directories of the form `mach-*` and `plat-*`, presumably short
    for “machine” and “platform,” respectively. Most of the files in these directories
    provide configuration information for a specific implementation of the ARM architecture.
    And of course, each implementation describes its configuration differently.


    Would not it be nice to have a single language that could be used to unambiguously
    describe the hardware of a computer system? That is the premise, and promise,
    of device trees.


    The peripheral devices in a system can be characterized along a number of dimensions.
    There are, for example, character vs block devices. There are memory mapped devices,
    and those that connect through an external bus such as I2C or USB. Then there
    are *platform* devices and *discoverable* devices.


    Discoverable devices are those that live on external busses, such as PCI and USB,
    that can tell the system what they are and how they are configured. That is, they
    can be “discovered” by the kernel. Having identified a device, it is a fairly
    simple matter to load the corresponding driver, which then interrogates the device
    to determine its precise configuration.


    Platform devices, on the other hand, lack any mechanism to identify themselves.
    System on Chip (SoC) implementations, such as the Sitara, are rife with these
    platform devices—'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'system clocks, interrupt controllers, GPIO, serial ports, to name a few. The
    device tree mechanism is particularly useful for managing platform devices.


    The device tree concept evolved in the PowerPC branch of the kernel, and that
    is where it seems to be used the most. In fact, it is now a requirement that all
    PowerPC platforms pass a device tree to the kernel at boot time. The text representation
    of a device tree is a file with the extension .dts. These .dts files are typically
    found in the kernel source tree at arch/${ARCH}/boot/dts.


    A device tree is a hierarchical data structure that describes the collection of
    devices and interconnecting busses of a computer system. It is organized as nodes
    that begin at a root represented by "/", just like the root file system. Every
    node has a name and consists of "properties" that are name-value pairs. It may
    also contain "child" nodes.


    Listing 15.1 is a sample device tree taken from the devicetree.org website. It
    does nothing beyond illustrating the structure. Here we have two nodes named node1
    and node2. node1 has two child nodes, and node2 has one child. Properties are
    represented by name = value. Values can be strings, lists of strings, one or more
    numeric values enclosed by square brackets, or one or more "cells" enclosed in
    angle brackets. The value can also be empty if the property conveys a Boolean
    value by its presence or absence.


    ```

    /{

    node1 {

    a-string-property = "A string";

    a-string-list-property = "first string", "second string";

    a-byte-data-property = [0x01 0x23 0x34 0x56];

    child-node1 {

    first-child-property;

    second-child-property = <1>;

    a-string-property = "Hello, world";

    };

    child-node2 {

    };

    };

    node2 {

    an-empty-property;

    a-cell-property = <1 2 3 4>; /* each number (cell) is a uint32 */

    child-node1 {

    };

    };


    ```


    **Listing 15.1**

    Sample device tree.


    The BBB uses a device tree to describe its hardware. The device tree source files
    (.dts) are found in linux/arch/arm/boot/dt/. The one for the BBB is am335x-boneblack.dts.
    This file does not define much, but it includes a couple of other files (note
    that included device tree files get the extension .dtSi). am33xx.dtsi defines
    quite a bit of the system. Note, in'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'particular, that pretty much every node has a *compatible* property. This is
    what links a node to the device driver that manages it.


    The device tree source code is compiled into a more compact form called a **device
    tree blob** (`.dtb`), also known as a **flattened device tree** (fdt). As mentioned
    above, the device tree compiler is actually part of the kernel source tree. The
    resulting `am335x-boneblack.dtb` is stored in the same flash partition as MLO
    and `u-boot.img`. The default u-boot environment has a variable, `loadfdt`, that
    loads the device tree blob into RAM. Then the `bootz` command that transfers control
    to the kernel has three address arguments: the address of the kernel, the address
    of the initial RAM disk, and the address of the device tree blob. As the kernel
    loads device drivers, the drivers interrogate the device tree to determine the
    specific properties of their respective devices.


    The device tree is visible from u-boot using the `fdt` commands. Type `help fdt`
    to see the commands. Among other things, you can list the fdt, create new nodes
    and properties, and change property values. Then once the kernel is booted, the
    device tree is visible at `/proc/device-tree`. This tree is read-only.


    # Putting the Application in eMMC Flash


    We are almost done. We have configured the kernel and the boot loader to our specific
    needs. We have set up systemd and/or the init process so that it boots directly
    into the thermostat application. At the end of the last chapter, we ended up with
    a file system that booted directly into our networked thermostat application.
    The final step then is to load that file system into eMMC flash on the target
    board, so that when the board powers up, the thermostat starts.


    The process is actually quite straightforward. You do still have the microSD card
    with the eMMC flasher image on it, the one we used back in Chapter 6, The hardware,
    right? Here are the steps then:


    +   - Insert the microSD card into your workstation

    +   - Mount both partitions, BEAGLEBONE and eMMC-Flasher

    +   - Copy any changes from your networked file system to the microSD eMMC-Flasher
    partition

    +   - Restore the original `uEnv.txt` to the BEAGLEBONE partition so the device
    boots from eMMC

    +   - If necessary, copy your new `u-boot.img` and kernel `zImage` files to the
    BEAGLEBONE partition

    +   - Insert the microSD card into your unpowered BBB and power up

    +   - The eMMC is flashed with your “production” file system

    +   - Power down, remove the microSD card, and power up. Your “product” is now
    running.'
  merge: -1
  img_proc: true
