    Table 14-1. A fast review of Mandrake graphical tools


    # 14.1. Create a boot disk


    If you did not create one at install time, this tool allows you to create a boot
    disk. This rescue disk allows you to perform some maintenance tasks on your system
    in case of failure.

    See the section “Using drakfloppy to create a boot disk” of the Reference manual
    to get more information on the use of this tool.


    # 14.2. Change your boot-up configuration


    This tool allows you to change two aspects of the boot process. The boot mode:
    text or graphical, and the System or login mode.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_227_0.png)


    Figure 14-3. Choosing the boot mode


    The main dialog is divided into three zones, each corresponding to a special configuration
    of the boot process:


    # 14.2.1. Configuration of the Boot Loader


    Clicking the Configure button of the first zone launches the boot loader setup.
    You will be presented two dialogs, the first enables you to switch from one boot
    loader to another, and to its physical location. The second allows you to manage
    the different entries available through boot loader.


    > Note: Unless you really know what you are doing, it is not recommended to change
    those settings as it may prevent you from booting your machine next time you try
    to power it on.


    # 14.2.2. Configure the boot mode


    In the upper part of the dialog, check the Launch Aurora at boot time box if you
    wish to have the graphical bootup screen instead of the usual text boot messages.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Chapter 14. Mandrake Control Center


    If you choose the graphical boot, you are then given different Aurora looks. A
    preview of each option is shown on the right.


    # 14.2.3. Configure the login mode


    Here, you can control the way people can log on to the machine. There are two
    aspects:


    +   1. Graphical interface: If you wish to have the X-Window (graphical display)
    system at boot time, check the box Launch the X-Window system at start. If you
    leave it unchecked you will be presented the text login.

    2. Autologin: If you are the only one to use your machine and nobody else has
    access to it, you may choose to be automatically logged in at boot time. If you
    check Yes, I want autologin, just choose the user to be automatically logged in
    in the first combo box, and the preferred Window manager in the second.


    # 14.3. Create a Boot Disk for a (semi-)Automated Installation


    This tool allows a system administrator to replicate an installation on many machines
    while not having to reconfigure all steps by hands for each machine.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_229_0.png)


    Figure 14-4. Choosing the steps to replay or not


    After a warning screen about what we are going to do, we get a list of most steps
    of the installation. To each step is associated a two entries menu choose:


    +   - replay: choose this if you want to reuse the choices you made during the
    manual installation for the automated installation.

    - manual: choose this if you prefer to manually reconfigure this step during the
    automated installation.


    When you have made your choice for each installation step, click the OK button.
    You will be asked to insert a blank floppy disk (all data will be erased).


    After clicking OK again, the boot floppy disk will be created with the following
    characteristics:


    +   - The installation method (from CD-ROM, via NFS, FTP, etc.) is the same as
    the one used during the install of the machine currently worked on,

    - All the steps marked as replay will be replayed with all choices made during
    the installation of the current machine,'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Chapter 14. Mandrake Control Center


    +   - All the steps marked as manual will have to be manually configured during
    the installation,

    - The partitioning and formatting steps will be always manual for security reasons.


    Then all you have to do is inserts the resulting floppy in the machine you want
    to replicate the installation on, turn it on, and configure the few remaining
    manual steps, saving you a lot of time.


    # 14.4. Change the Resolution of your Display


    # 14.4.1. X Configuration Simple Mode


    This little tool allows you to change the video resolution of your screen, if
    the one you configured at install time does not fit your needs. You get two choices
    on the window (figure 14-5): resolution (in pixels) and depth (number of colors)
    of your system. Simply choose the one you wish to use and click the OK button.


    | Choose the resolution and the color depth (Graphic card: RIVA128) |

    | 640x480 |

    | 800x600 |

    | 1024x768 |

    | 1280x1024 |

    | 65 thousand colors (16 bits) [ ] |

    | Ok | Cancel | Show all |


    Figure 14-5. Choosing a new video resolution


    Then a new dialog will ask you whether you wish to test the new choices or not(figure
    14-6). It is highly recommended that you do test, because if it doesn''t work
    it will be harder later to recover a working graphical environment.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Chapter 14. Mandrake Control Center


