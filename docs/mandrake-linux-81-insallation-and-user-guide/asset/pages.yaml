- pgno: 134
  md: '# Chapter 10. Using GNOME


    your daily work, you can separate your applications logically: in the first desktop,
    you could place your communication applications (Internet, chat, e-mail); in the
    second one, your favorite text editor. To surf through them, simply click on the
    one of the four desktops and your physical desktop (the one you are looking at
    right now) will change and show the applications you are using for each of them.


    **Note:** If you wish to add applets to your panel, you will find them in the
    Gnome menu→Applets and right-click on the desired applet. If you delete your pager
    by mistake, you will find it in Gnome menu→Applets→Utility: its name is the Desk
    Guide.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_134_0.png)


    The *GKB International Keyboard* enables you to choose many languages to switch
    your keyboard to. If you are trilingual, you can easily select, per example, French,
    English and Spanish as your main keyboard languages. The flag (Québec in our screen
    shot) represents the language you are currently using. Simply click on the icon
    to change your keyboard’s language. To add or modify it, right-click on the icon
    and choose Properties.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_134_1.png)


    Next is the Load Average icon, which indicates your processor’s load state. If
    you see it skyrocket and get green, yellow and gray, it means one or many of your
    applications is freaking out... We will see later how to fix this in the *Reference
    manual*.


    **Note:** If this icon is not on your panel, you may retrieve it in the Gnome
    menu→Panel→Add to panel→Applet→Monitors→CPU Load. Many CPU indicators exist: try
    them out!


    111'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Finally, the clock. You may change its properties by right-clicking on the
    icon and choosing Properties: you can change it to 12/24 hour and a couple of
    simple options. However, you may select another clock in the Gnome menu→Panel→Add
    to panel→Clocks. Some clocks even have a mail-check option.


    # 10.4. GNOME Menu


    The GNOME menu holds everything you need to fully utilize your new Mandrake Linux
    system. Let us start with the basics.


    First off, do not be surprised if you think you saw some of the utilities previously.
    In fact, we have already covered the Panel and Log-Out menu, the first items you
    should see are the Log out, Lock screen, and when you open your GNOME menu you
    should see the Log out, Lock screen and Panel sub-menus. The latter allows you
    to configure it, whether it be colors, location, size, etc. And if you choose
    the Global Preferences sub-menu, you will end up in the GNOME Control Control
    Center, where you can set the essential panel parameters. Surf through the different
    options to fully personalize them to your liking.'
  merge: -1
