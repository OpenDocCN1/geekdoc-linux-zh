- pgno: 215
  md: '# # Chapter 13. Securing Your Machine


    # ## 13.2. Advanced security configuration


    We are now presenting InteractiveBastille, a much more advanced tool, which allows
    even inexperienced people to make choices on a large number of security-related
    parameters. Running all the wizards available may take up to an hour if you do
    it carefully. But what is an hour compared to a break-in in your system?


    ![](img/44017b5ddbff38ec085831b3cde64d5d_215_0.png)


    > ### Figure 13-5. A typical InteractiveBastille screen


    To launch this tool, you need to run the command InteractiveBastille from a Terminal
    as root. It is part of the Bastille RPM package.


    This tool is made of 14 wizards, each one in particular of a particular security
    aspect. The screen, an example of which you can see in figure 13-5, is made of
    five parts:


    +   1. The menu has 16 entries: one for the title screen, 14 corresponding to
    the 14 wizards, and an End screen, where you can validate the choices made in
    all wizards and make them active on the machine.


    192'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter 13. Securing Your Machine


    2. The question asked.


    3. An explanatory text about the question, read it carefully-fore answering.


    4. The answer is either a simple Yes/No choice or a field to fill with values,
    as explained in the explanatory text.


    5. The navigation buttons:


    +   * Previous: will return to the previous screen of the current wizard,

    * Next: goes to the next question of the current wizard,

    * Explain Less/More: ask for more or less information.


    This then, the preferred way to proceed:


    +   1. Open each wizard in turn. You probably do not need to run them all, as
    the first question generally determines whether you need to run that wizard or
    not.

    2. At the End Screen answer Yes to make your changes effective.

    3. Test the main features of your machine, test that access is denied for unauthorized
    services. In a nutshell check that your new settings act as you expect them to
    act and that there are no annoying side effects.

    4. You may have to run the tool again until you get the desired result.


    # 13.3. Security Levels in Details


    Here we review the details of the three security levels: Lax, Moderate and Paranoid
    used in the security level settings either during the install or afterwards using
    BastilleChooser.'
  merge: -1
  img_proc: true
