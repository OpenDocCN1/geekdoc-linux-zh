  md: '# 9.2. KDE’s Internal Help


    ![](img/44017b5ddbff38ec085831b3cde64d5d_112_0.png)


    Figure 9-2. KDE’s Internal Help Window


    Click on the lifebuoy to get the KDE’s internal, on-line help. You can also launch
    it by accessing the K menu, then successively Documentation→Help. It is a complete
    help center, very helpful when you need information.


    The left side of the window holds the different available rubrics. In the example
    mentioned above, we clicked successfully on Application menu, then Office, and
    lastly KPresenter. The contents are shown on the right of the window. In the text,
    the words in red are hyperlinks. Simply click on one of them to move to another
    part of the document. Since it is easy to get lost using this


    process, the arrow allows to go back one or many steps.


    # 9.2.1. Unix’s Info and Manual Pages


    These two categories are not KDE-specific. They exist on practically every Unix-type
    systems. The manual pages (commonly'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 9. The Desktop According to KDE


    referred to as **man pages** are the historical and internal help pages provided
    with those systems almost immediately since they were conceived. They are an inexhaustible
    information source about system commands, their internal functions, configuration
    file formats.. Click on this rubric to browse the covered topics.


    The **info pages** hold almost the same thing, but their presentation is different.
    They were developed within the GNU project’s framework in order to compensate
    for some of the man pages weaknesses.


    # 9.3. Manipulating Virtual Desktops


    # 9.3.1. A Little Bit of Practice


    Normally, the internal help window is displayed by default in the first virtual
    desktop.


    Now click on the second virtual desktop’s button, then on the icon to launch the
    text editor. Reduce the window a bit (let’s say to a quarter of the screen), and
    place it in the lower right corner.


    When this is done, go to the third virtual desktop by clicking on the number 3
    button. Then, launch the *Konqueror* file manager by clicking on the icon. Notice
    that the screen seems to empty itself when you switch virtual desktop.


    The virtual desktop’s button bar takes the aspect shown above: each button is
    a tiny representation of each desktop’s contents. Click on the second desktop:
    you will find the text editor in its corner. Press on **Ctrl+F1**: you will go
    back to the first desktop, where the internal help window is waiting for you.


    # 9.3.2. Sticking or Transferring Windows'
