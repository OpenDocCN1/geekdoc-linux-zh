  md: '# Chapter 11. Everyday Applications


    go you!


    ![](img/44017b5ddbff38ec085831b3cde64d5d_183_0.png)


    Figure 11-40. Browsing the Web with Nautilus


    In order to view only the web page you typed, go in View→Hide Sidebar


    # 11.2.2.4.1. Searching for the Web


    Simply click on the Web Search button located in the tool bar and your defined
    web search engine''s page will automatically open. You can also access this feature
    by pressing on the Shift-Ctrl-F.


    # 11.3. General Internet Use


    If you feel your general knowledge of Internet is low, then this section is for
