  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_187_0.png)


    # 11.3.1.4. Addressing


    The Addressing sub-menu is very helpful since it allows your mail client to recognize
    a few essential assets of e-mail writing. If you tell the mail client to search
    in your address book when you type in a name, it will automatically give you a
    choice of users if more than one person has a similar name (i.e.: John Smith and
    John Woods). Your mail client will give you the choice between those two users
    when you start typing them and you want to finish your typing with the tab key.


