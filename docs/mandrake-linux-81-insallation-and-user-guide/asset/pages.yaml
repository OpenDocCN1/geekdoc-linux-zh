- pgno: 294
  md: '(http://www.iwillfollow.com/email.htm), also known as **Netiquette**, where
    some precious hints are available. If you have spare time, you may also consider
    reading the corresponding RFC (http://www.rfc-editor.org/js).


    **Note: IMPORTANT:** remember to always keep the first e-mail you receive from
    a mailing list since it normally tells you how to unsubscribe, if you wish to
    do so.


    +   - Respect the general rules applicable to e-mails: in particular, do not **send**
    HTML messages: text only.

    - Mailing lists usually have archives: check them out! Your question may have
    been debated just before you subscribed to the list.

    - God helps those who help themselves.


    # A.2.3. Newgroups


    Before asking for help on newsgroups, it is advisable to find out if your problem
    has already been covered (or solved) on *DejaNews* (http://groups.google.com/googlegroups/deja_ann.html),
    which has been acquired by Google. If nothing is relevant to your query, access
    this newsgroup entirely devoted to **Mandrake Linux** (news:alt.linux.mandrake).
    Or you may also join many other groups in the comp.os.linux.* “hierarchy”:


    +   - comp.os.linux.setup (news:comp.os.linux.setup): questions about Linux configuration
    (devices, configuration of applications) and resolution of miscellaneous problems.

    - comp.os.linux.misc (news:comp.os.linux.misc): whatever does not fit in any other
    group.

    - and others...


    Before posting to one of these groups, make sure you did your homework and read
    the available documentation on your specific issue. If you have not, you will
    most likely get the following answer: RTFM. And nothing more!'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# A.3. General Guidelines for Solving a Problem under Mandrake Linux


    Here are the different means available in your problem-solving quest. Try the
    first option and only then, if that did not work, try the second, and so on. As
    a last resort only, and only if nothing else has worked for you, start thinking
    about the possibility of... throwing your machine through the window :-)


    # A.3.1. RTFM


    "Read The F\***ing Manual!" (We could not resist, sorry!)


    "The manual" means that very manual and all the manuals and literature available
    on that subject. Our previous sections offer you good starting points. Only when
    all these resources have exhausted, you may start thinking you have indeed stumbled
    over a real problem.


    # A.3.2. Search the Internet


    The various Internet sites previously mentioned are other excellent starting points.
    They deal with general and very specific aspects of your potential problems. Finally,
    try a general search engine such as Google (http://www.google.com) or, as mentioned
    above, the Linux-specific (http://www.google.com/linux/) Google search engine.
    And do not hesitate to use the Advanced search (http://www.google.com/advanced_search)
    option.


    # A.3.3. Mailing Lists and Newsgroups Archives


    The previous searches may lead you to general answers which hide the results of
    your specific inquiry among many others. To refine your search, this is what you
    should do:'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'First, try to find a list which seems specifically linked to your

    problem, then perform a search in its archive pages.


    # Example


    You noticed a strange behavior while trying to use grub with a

    minix partition.


    A search using "grub mailing list" keywords in Google gives as a

    fourth result the link to an archive’s message of the GRUB mailing-

    list july 1999 (http://mail.gnu.org/pipermail/bug-grub/1999-July/

    003129.html). Once, you get the URL for the archive’s

    root: GRUB mailing list archive (http://www.mail-archive.com/

    bug-grub%40gnu.org/). It even suggests a search engine. Thus,

    searching for "Minix" will lead you directly to a patch.


    Note however that all archives do not propose an embedded

    search engine. However, you can easily use the field return re-

    sults from the site to limit your search to the specific site hosting the archive.


    For a newsgroup search, this reference, Dejanews (http://

    groups.google.com/googlegroups/deja_announcement.html)-

    which has been acquired by Google, holds the archives for an

    amazing number of newsgroup channels.


    # A.3.4. Questions to Mailing Lists and Newsgroups


    See the related section above: Mailing Lists, page 270 and Newsgroups, page 271.
    Reading How To Ask Questions The Smart Way

    (http://www.tuxedo.org/~esr/faqs/smart-questions.html) may

    be of great help.


    # A.3.5. Directly Contacting the Person in Charge


    Use this option as a very last resort and in really extreme situations – unless
    you want to offer your collaboration! Softwarendevelopers generally receive mountains
    of e-mails. Therefore,

    your anguished question on the use of the cd command will

    most likely... be ignored!'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Appendix A. Where to Get Documentation


    The addresses will be found either on the home page of a project''s site or in
