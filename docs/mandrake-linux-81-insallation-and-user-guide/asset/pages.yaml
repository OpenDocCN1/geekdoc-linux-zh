  md: '# ATM


    This is an acronym for Asynchronous Transfer Mode. An ATM network packages data
    into standard size blocks (53 bytes: 48 for the data and 5 for the header) which
    it can convey efficiently from point to point. ATM is a circuit switched packet
    network technology oriented towards high speed (multi-megabits) optical networks.


    # atomic


    a set of operations is said to be atomic when it executes all at once, and cannot
    be preempted.


    # background


    in shell context, a process is running in the background if you can type commands
    while said process is running.

    See Also: job, foreground.


    # backup


    is a means of saving your important data to a safe medium and location. Backups
    should be done regularly, especially with more critical information and configuration
    files (the prime directories to backup are /etc,/home and /usr/local). Traditionally,
    many people use tar with gzip or bzip2 to backup directories and files. You can
    use these tools or programs like dump and restore, along with many other free
    or commercial backup solutions.


    # batch


    is a processing mode where jobs are submitted to the processor, and then the processor
    executes them one after the other till it executes the last one and it''s ready
    for another list of processes.


    # beep


    is the little noise your computer''s speaker does to warn you of some ambiguous
    situation when you''re using command completion and, for example, there''s more
    than one possible choice for completion. There might be other programs that make
    beeps to let you know of some particular situation.


    # beta testing


    is the name given to the process of testing the beta version of a program. Programs
    usually released in alpha and beta states for testing prior to final release.'
