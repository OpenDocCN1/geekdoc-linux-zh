  md: '# Chapter 5. Installation with DrakX


    It is now time to specify which programs you wish to install on your system. There
    are thousands of packages available on Mandrake Linux, and you are not supposed
    to know them all by heart.


    If you are performing a standard installation from CDROM, you will first be asked
    to specify the CDs you currently have (in Expert mode only). Check the CD labels
    and highlight the boxes corresponding to the CDs you have available for installation.
    Click OK when you are ready to continue.


    Packages are sorted in groups corresponding to a particular use of your machine.
    The groups themselves are sorted into four sections:


    +   - Workstation: if you plan to use your machine as a workstation, select one
    or more of the corresponding groups.

    - Development: if the machine is to be used for programming, choose the desired
    group(s).

    - Server: finally, if the machine is intended to be a server, you will be able
    to select which of the most common services you wish to see installed on the machine.

    - Graphical Environment: this is where you will choose your preferred graphical
    environment. At least one must be selected if you want to have a graphical workstation!


    > Tip: Moving the mouse cursor over a group name will display a short explanatory
    text about that group.


    You can check the Individual package selection box, which is useful if you are
    familiar with the packages being offered or if you want to have total control
    over what will be installed.


    If you started the installation in "Update" mode, you can unselect all groups
    to avoid installing any new package. This is useful for repairing or updating
    an existing system.'
