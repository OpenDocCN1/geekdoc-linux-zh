- pgno: 233
  md: '# Chapter 14. Mandrake Control Center


    # Test again


    It is recommended that you make a final test of your configuration before closing
    xfdrake; this will ensure that you''ll have no problems when rebooting the graphical
    server.


    # 14.5. Configuring your hardware


    # 14.5.1. Introduction


    The harddrake project has been developed to simplify hardware configuration under
    GNU/Linux by providing an easy-to-use interface.


    harddrake is composed of two parts,


    +   1. A main tool called harddrake, used to configure hardware by launching

    2. a harddrake Wizard or external configuration tool(s) (which can be configured).


    # 14.5.2. harddrake


    # 14.5.2.1. Description


    When the last time you had to install a new sound card on your GNU/Linux system
    and just couldn''t quite get it to work? Sure you know which model it is and can
    even guess which driver supports it and may have some idea as to the IRQ DMA and
    I/O port it uses.


    Here comes harddrake.


    harddrake is a fully GUI-based tool that ties together many of the tools already
    included in a GNU/Linux distribution to automate and simplify the process of installing
    new hardware. Some items will be detected, others can be selected from a drop
    down list. The various I/O, IRQ and such X86 annoyance settings can be adjusted
    from within this interface.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Chapter 14. Mandrake Control Center


    On one hand, harddrake is used to display information. On the other hand, it can
    launch configuration tools as well. With an easy interface, you will be able to
    browse (hopefully) all the hardware your system consists of.


    harddrake uses the detect library, so if your new hardware isn’t detected, you
    only need to upgrade detect itself.


    # 14.5.2.2. Usage


    To launch harddrake, you can start it from:


    +   * Control Center: Just click on the HardDrake icon.

    * a terminal: Type harddrake, doing it this way you can pass parameters, as well.

    * GNOME and KDE: Go to the start panel. The harddrake entry is in the Configuration/System
    group.


    After a wait screen (indicating the detection process), you’ll see a window like
    figure 14-8.'
  merge: -1
  img_proc: true
