- pgno: 58
  md: '# Chapter 5. Installation with Drak


    If partitions are not defined, you will need to create them using the wizard.
    Depending on your hard drive configuration, several options are available:


    +   - Use free space: this option will simply lead to an automatic partitioning
    of your hard drive(s). You will not be prompted further.


    +   - Use existing partition: the wizard has detected one or more existing Linux
    partitions on your hard drive. If you want to use them, choose this option.


    +   - Use the free space on the Windows partition: if Microsoft Windows is installed
    on your hard drive and takes all the space available on it, you will have to create
    free space for Linux data. To do that, you can delete your Microsoft Windows partition
    and data (see "Erase entire disk" or "Expert mode" solutions) or resize your Microsoft
    Windows partition. Resizing can be performed without the loss of any data. This
    solution is recommended if you want to use both Mandrake Linux and Microsoft Windows
    on the same computer.


    Before choosing this option, please understand that after this procedure, the
    size of your Microsoft Windows partition will be smaller than at the present time.
    You will have less free space to store your data or to install new software.


    +   - Erase entire disk: if you want to delete all data and all partitions present
    on your hard drive and replace them with your new Mandrake Linux system, choose
    this option. Be careful with this solution because you will not be able to revert
    your choice after confirmation.


    > Warning

    If you choose this option, all data on your disk will be lost.


