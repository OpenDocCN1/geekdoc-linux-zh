- pgno: 160
  md: '# 11.2.1.5.1. Creating a File or a Directory


    Right-click on the right window’s background (while avoiding

    t icons): you get a menu which offers many functions. Choose

    Create from a template →Folder.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_160_0.png)


    Figure 11-16. Creating a New Directory


    In the displayed dialog box, type the name you want to give to

    the directory and hit the Enter key (or simply click OK, which

    amounts to the same thing).


    ![](img/44017b5ddbff38ec085831b3cde64d5d_160_1.png)


    The Create from the template menu also allows to create

    different file types. For example, create a text file by selecting

    Text file: like before, give it a name, for example text.txt. Once it

    is created, your file appears in the right side of your window and

    is represented with a pencil on a white sheet.


    > **Note:** It is not necessary to give a file extension (the group of letters

    follow the period) to your file. However, it is preferable to do

    sysematically since it is a way to identify the file’s type. Here, by

    convention, the extension of a text file is .txt.


    # 11.2.1.5.2. Opening a File


    If you click on the icon of the file you just created, Konqueror

    will recognize its type (a text file) and display it, that is: nothing.

    In fact, you simply created an empty file. This time, right-click

    on the icon and choose Open with.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_161_0.png)


    Figure 11-17. Opening a Text File


    Many applications adapted to modify this file type will then be proposed. Choose
    Advanced editors, which we already saw in KDE’s tool bar, “The Desktop According
    to KDE”, page 85


    Type a few lines in the displayed window, what you write is not


    important. Click on the icon to save what you just typed. If you do not do it,
    the editor will alert you when you try to quit it.


    Now go back in the Konqueror window and use this icon (or the F5 key) to refresh
    the display of the folder’s contents. Then, bring the mouse pointer over your
    text file’s icon. You will notice, in the information bar at the bottom of the
    window, that its size is not equal to zero anymore.


    Click on your file. This time the window is not empty. It holds what you just
    typed. To go back to the file list, simply click on the button on Konqueror’s
    tool bar.'
