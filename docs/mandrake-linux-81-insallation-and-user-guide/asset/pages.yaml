    # 14.4.2. X Configuration Expert Mode


    You can access a more advanced tool to modify the screen or video card in use.
    Simply click the Expert Mode button while in simple mode. You will be presented
    various screens, each corresponding to an aspect of the graphical configuration:


    Change server


    Depending on your video card,may first be asked which graphical server you wish
    to use. You may have the choice between various versions or 3D/2D accelerations
    depending on your graphical card. You may have to try various servers to find
    the one that best matches your hardware and needs. If your video card supports
    various displays (multi-head), you will also have that option available.


    Change resolution


