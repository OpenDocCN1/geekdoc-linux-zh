    Figure 12-5. Try the Internet Connection


    You can then test your Internet configuration to ensure it actually works. It
    is advisable to do so, so that you can correct possible errors right now.


    After the configuration is done, you can bring the Internet connection up and
    down by using the Connect/Disconnect buttons of the main dialog (figure 12-1).'
