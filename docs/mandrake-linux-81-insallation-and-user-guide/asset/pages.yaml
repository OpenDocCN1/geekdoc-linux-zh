    RpmDrake''s window. When launched from RpmDrake, RpmInst starts by giving you
    information about the needed dependencies: either a list or a short text telling
    you everything is fine. If there are dependencies, you''ll see only one package
    or a list, with information displayed in the same fashion as the bottom-right
    in RpmDrake.


    “But”, but you ask, “What is a dependency?” Some packages can not work if other
    packages are not installed. In our example, the emacs-complete package can not
    work if the emacs package is not installed. In this case, we say that emacs belongs
    to emacs-complete''s dependencies. This is what is displayed in the above window.
    This information is provided by urpmq, a commandline tool (you can find more information
    about urpmq in the associated man page: urpmq(8)).


    In some cases though, all the package''s dependencies you want to install are
    already installed. In those cases, you won''t even see this page, and start at
    the next page.


