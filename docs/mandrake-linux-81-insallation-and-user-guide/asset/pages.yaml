- pgno: 40
  md: '# Chapter 4. Disks and partitions


    If you are reading this chapter, it means that you have decided on an expert installation
    of Mandrake Linux, which will require you to understand partitioning. Or you are
    simply curious and that''s OK too. :)


    This section provides a complete description of the PC partitioning scheme. It
    is only useful if you intend to manually set the partitions of your hard drive.
    If you do not understand what we are talking about, you may safely ignore this
    section; the installer can do everything automagically for you.


    # 4.1. Structure of a hard disk


    Basically, a disk is physically divided into little sectors. A sequence of sectors
    can form a partition. Roughly speaking, you can create as many partitions as you
    wish; each of them is regarded as a single hard drive.


    # 4.1.1. Sectors


    To simplify, a hard disk is merely a sequence of sectors. A sector is the smallest
    data unit on a hard disk, and its size is typically 512 bytes. The sectors on
    a hard disk of ( n ) sectors are numbered from ( 0 ) to ( n-1).


    # 4.1.2. Partitions


    The use of multiple partitions enables you to create many virtual hard drives
    inside your real physical drive. This has many advantages.


    +   - Different operating systems use different disk structures (called file systems);
    this is the case for Windows and GNU/Linux. Having multiple partitions on a hard
    drives allows you to install various operating systems on the same physical drive.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Chapter 4. Disks and partitions


    +   - For performance reasons, a single operating system may prefer different
    drives with different file-systems on them because they are used for completely
    different things. It is the case for GNU/Linux which requires a second partition
    called “swap” and used for virtual memory.


    +   - Finally, it may prove very useful to separate the different parts of your
    OS into different partitions, even if they use the same file-system. In the most
    simple configuration, you can split your files into two partitions, one for your
    personal data, and another for programs. This allows you to update your OS, completely
    erasing the programs partition while keeping the data partition safe.


    +   - Physical errors on a hard disk are generally located at adjacent sectors
    and not scattered among the disk. Distributing your files into different partitions
    will limit data loss in case of hard disk physical damages.


    Normally the partition type specifies the file-system which the partition is supposed
    to contain. Each operating system recognizes some of the types, but not others.
    See the chapter about GNU/Linux file-systems in the Reference manual for more
    information.


    # 4.1.3. Define the structure of your disk


    # 4.1.3.1. The most simple


    Is where you have just two partitions: one for the swap space, the other for the
    files¹.


    > Tip: The rule of thumb for the swap partition size is to choose double of the
    size of your RAM memory. However for large memory configurations (>512 MB), this
    rule is not valid, and smaller sizes are preferred.


    ¹ the file-system used currently for GNU/Linux files is called ext2


    18'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 4.1.3.2. Another common scheme


    is, as we previously discussed, when you choose to separate da- from programs.
    To be even more efficient, one usually defines a third partition called the “root”
    and labelled as /. It will handle- le programs necessary to startup your system
    and the basic maintenance programs.

    So we could define four partitions:


    Swap


    A partition of type swap, which is roughly equivalent to twi- ce the memory size.


    Root: /


    It is the most important data partition. It not only contains the most important
    data and programs for the system, but will also act as a mount point for other
    partitions.

    The needs of the root partition in terms of size are very li-ted, 300MB is generally
    enough. However, if you plan to install commercial applications, that usually
    reside in /opt, you will need to increase that size. Another option is to crea-
    te a separate partition for /opt.


    Static data: /usr


    Most packages install most of their executables and data fi-les under /usr. The
    advantage of having it on a separate partition is that you can easily share with
    other machines over a network.

    The size depends on the packages you wish to install. It va-ries from 100MB for
    a lightweight installation to several GB for a full install. A compromise of one
    or two GB (depending on your disk size) generally suffices.


    Home directories: /home


    Here are kept the personal directories for all the users hos-ted on the machine.
    It also generally hosts the directories'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Chapter 4. Disks and partitions


    served by HTTP or FTP (respectively for web browsing and file transfers).


    Here the partition size depends on the number of users (or services) hosted and
    their needs.


    A variant to that solution is to not use a separate partition for the /usr files:
    /usr will simply be a directory inside the root / partition.


    # 4.1.3.3. Exotic configurations


    When setting-up your machine for specific uses such as a web server or a firewall,
    the needs are radically different than for a standard desktop machine. For example,
    a FTP server will probably need a big separate partition for /var/ftp, while the
    /usr will be relatively small. For such situations, you are encouraged to carefully
    think about your needs before even beginning the install.


    > Tip: If after a period of time using your system, you notice that you should
    chosen different sizes and partitions,it is possible to resize most partitions
    without the need to reinstall your system, it is even generally data-safe. See
    Managing your partitions, page 226.


    With a little bit of practice, you will even be able to move a crowded partition
    to another brand new hard drive. But that''s another story...


    # 4.2. Conventions for naming the disks and partitions


    GNU/Linux uses a logical method for naming partitions. First, when numbering the
    partitions, it ignores the file-system type of each partition that you may have.
    Second, it names the partitions according to the disk on which they are located.
    This is how the disks are named:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Chapter 4. Disks and partitions


    +   - the primary master slave IDE devices (whether they be hard disks, CD-ROM
    drives or anything else) are called /dev/hda and /dev/hdb respectively;

    - on the secondary interface, they are called /dev/hdc and /dev/hdd for the master
    and slave respectively;

    - if your computer contains other IDE interfaces (for example, the IDE interface
    present in some Sound-Blaster cards, the disks will then be called /dev/hde, /dev/hdf,
    etc.;

    - SCSI disks are called /dev/sda, /dev/sdb, etc., in the order of their appearance
    on the SCSI chain (depending on the increasing *IDs*). The SCSI CD-ROM drives
    are called /dev/scd0, /dev/scd1, always in the order of their appearance on the
    SCSI chain.


    The partitions are named after the disk on which they are found, in the following
    way (in the example, we have used the case of partitions on a primary master IDE
    disk):


    +   - the primary (or extended) partitions are named /dev/hda1 through /dev/hda4
    when present;

    - logical partitions, if any, are named /dev/hda5, /dev/hda6, etc. in their order
    of appearance in the table of logical partitions.


    So GNU/Linux will name the partitions as follows:


    | First primary partition |

    | /dev/hda1 |

    | Primary master IDE hard drive (/dev/hda) |


    | First primary partition | Second primary partition |

    | /dev/hdb1 | /dev/hdb2 |

    | Primary slave IDE hard drive (/dev/hdb) |


    Figure 4-1. First example of partition naming under GNU/Linux'
  merge: -1
  img_proc: true
- pgno: 45
