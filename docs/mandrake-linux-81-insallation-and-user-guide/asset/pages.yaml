  md: '# Chapter 9. The Desktop According to KDE


    ![](img/44017b5ddbff38ec085831b3cde64d5d_125_0.png)


    **Figure 9-14. Configuring the Wallpaper for the Background**


    The second tab, Wallpaper, allows to display an image on the background. This
    time, the Mode list controls the manner in which the image is displayed: tiled,
    if the image is too small for the screen; or scaled, to adjust it to the screen’s
