    # foreground


    in shell context, the process in the foreground is the one which is currently
    running. You have to wait for such a process to finish in order to be able to
    type commands again. *See Also*: job, background.


    # framebuffer


    projection of a video card''s RAM into the machine''s address space. This allows
    for applications to access the video RAM without the chore of having to talk to
    the card. All high-end graphical workstations use framebuffers, for example.


    # Frame Relay


    Frame Relay is a network technology ideally suited for carrying traffic that is
    of bursty or sporadic nature. Network costs are reduced by having many Frame Relay
    customer sharing the same network capacity and relying on them wanting to make
    use of the network at slightly different times.


    # full-screen


    This term is used to refer to applications that take up the whole visible area
