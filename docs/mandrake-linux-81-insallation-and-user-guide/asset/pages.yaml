    “Mandrake”, and “MandrakeSoft” are registered trademarks of MandrakeSoft S.A.;
    Linux is a registered trademark of Linus Torvalds. All other trademarks and copyrights
    are the property of their respective owners.


    # 2. About Mandrake Linux


    Mandrake Linux is a GNU/Linux distribution supported by MandrakeSoft S.A. MandrakeSoft
    was born in the Internet in 1998 with the main goal to provide an easy-to-use
    and friendly GNU/Linux system. The two pillars of MandrakeSoft are open-source
    and collaborative work.


    # 2.1. Contact Mandrake community


    Following are various Internet links pointing to you to various Mandrake Linux
    related sources. If you wish to know about the MandrakeSoft company, connect to
    its web site (http://www.mandrakesoft.com/). There is then the site for the Mandrake
    Linux distribution (http://www.mandrakux.com/) and all its derivatives.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Preface


    First of all MandrakeSoft is proud to present its new open help platform. MandrakeExpert
    (http://www.mandrakeexpert.com/) isn''t just another web site where people helps
    others with their computer problems in exchange for up-front fees, payable regardless
    of the quality of the service received. It offers a new experience based on trust
    and the pleasure of rewarding others for their contributions.


    In addition, MandrakeCampus (http://www.mandrakecampus.com/) provides the GNU/Linux
    community with open education and training courses on all software-related technologies
    and issues; and teachers, tutors, and learners with a place where they can share
    knowledge.


    There is a site for the “mandrakeholic” called Mandrake Forum (http://www.mandrakeforum.com/):
    a primary site for Mandrake Linux related tips, tricks, rumors, pre-announcements,
    semi-official news, and more. This is also the only interactive website hosted
    by MandrakeSoft, so if you have something to tell, other users, search no longer:
    this is a place to do it!


    In the philosophy of open-source, MandrakeSoft is offering many means of support
    (http://www.mandrakelinux.com/en/ffreesup.php3) for the Mandrake Linux distributions.
    You are invited in particular to participate in the various Mailing lists (http://www.mandrakelinux.com/en/flists.php3),
    where the Mandrake Linux community demonstrates its vivacity


    # 2.2. Support Mandrake


    By popular request, MandrakeSoft proposes that its happy customers make a donation
    (http://www.mandrakelinux.com/donations/) to support the forth-coming developments
    of the Mandrake Linux system. Your contribution will help MandrakeSoft provide
    its users with an ever better distribution, ever safer, easier, up-to-date, and
    with more supported languages.


    For the many talented, your skills will be very useful for one of the many tasks
    required in the making of a Mandrake Linux system:'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Preface


    +   - Packaging: a *GNU/Linux* system is mainly made of programs picked-up on
    the Internet. These programs have to be packaged so that they will hopefully work
    together.


    +   - Programming: there are many projects directly supported by **MandrakeSoft**:
    find the one that most appeals to you, and offer your help to the main developer.


    +   - Internationalization: translation of the web pages, programs and their respective
    documentation.


    +   - Documentation: last but not least, the book you are currently reading requires
    a lot of effort to stay updated with the rapid evolution of the system.


    Consult the contributors page (http://www.mandrakesoft.com/labs/) to learn more
    about the way you can contribute to the evolution of **Mandrake Linux**.


    # ## 2.3. Purchasing Mandrake Products


    For **Mandrake Linux** fans wishing to benefit from the ease of on-line purchasing,
    **MandrakeSoft** now sells its products world-wide from its MandrakeStore (http://www.mandrakestore.com/)
    e-commerce web site. You will find not only **Mandrake Linux** software — operating
    systems and network tools (firewall), but also special subscription offers, support
    and updates (MandraFreq), as well as other goodies related to **MandrakeSoft**.


    # ## 3. Authors and translators


    The following people contributed to the making of the **Mandrake Linux** manuals:


    +   - Yves Bailly


    +   - Camille Bégnis


    +   - Marco De Vitis


    +   - Francis Galiègue


