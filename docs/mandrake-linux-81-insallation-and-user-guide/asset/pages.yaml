- pgno: 276
  md: '# ## Chapter 15. Package Management


    Maybe you have already noticed that your system is made of a large number of small
    pieces, in the same way a house is made of bricks. Here, we do not call these
    pieces “bricks”, but packages. A package can then be seen as a box containing
    all the elements necessary to install and run a specific software.


    In this chapter, we will speak about package management, which includes the installation
    of new packages (i.e: adding software to your system), updating already installed
    packages when new releases or corrections appear, and also removing packages from
    your system. This management is eased through the use of a few tools. Nevertheless,
    these actions are not available to users, so you have to be the super-user to
    use the tools described below.


    # ### 15.1. The Main Tool: RpmDrake


    RpmDrake is the main package-management tool. You can launch it from the Control
    Center, by selecting Software Manager under the System tree node.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_276_0.png)


    Figure 15-1. First RpmDrake’s message


    When you launch it for the first time, a dialog box appears offering to configure
    a “source” for “security updates”. We’ll explain these concepts later, so for
    now simply answer NO to this question.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Chapter 15. Package Management


    # 15.1.1. The Main Window


    When launched, RpmDrake does some analyses and configuration checking, which can
    take some time. Finally you see the main window, showed in this figure:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_277_0.png)


    Figure 15-2. RpmDrake''s Main Window


    As you can see, RpmDrake''s main window is basically divided into three parts:


    +   1. On the left, a tree showing package names (sorted and grouped by categories)
    along with some other information; note that you can change the view to a flat,
    alphabetically ordered list, just by clicking on theFlat list tab.

    2. At the top-right, a box listing the packages you have selected (yes, you can
    select packages: more on that later).

    3. At the bottom-right, various information about the currently highlighted package,
    such as name, detailed description, file list, and so on.'
  merge: -1
  img_proc: true
