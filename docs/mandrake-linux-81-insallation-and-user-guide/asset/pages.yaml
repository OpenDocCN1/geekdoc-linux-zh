- pgno: 162
  md: '# 11.2.1.5.3. Renaming a File


    Renaming a file is very simple. Right-click on the icon and choose the Rename
    pop-up menu. Then, type the new name and validate with the Enter key.


    You can also select it and then press on the F2 key.


    Finally, the last possibility is to right-click on the file and to select Properties.
    You just need to change the file name in the appropriate field, at the top of
    the window.


    # 11.2.1.5.4. Copying, Moving or Linking Files


    ![](img/44017b5ddbff38ec085831b3cde64d5d_162_0.png)


    Figure 11-18. Choosing the Destination Folder


    Select the files or folders you wish to copy or move. Then, use the F7 (for copy)
    or F8 (to move) keys: a little window will appear, in which you can type the destination
    folder. The Choose button allows to choose the folder.


    Here is another method. Start by using the tree view on the left of the screen
    in order to see the destination folder. However, do not display its contents,
    just its name. Then, select the files or folders you wish to manipulate.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_163_0.png)


    Figure 11-19. Drag’n/Drop with Konqueror


    Now your mouse pointer is on one of the elements. Then, while leaving your finger
    pressed on the mouse button, drag your selection towards the destination folder,
    which should be visible on the left part of your window. The preceding image showed
    two files which are dragged towards the home directory’s tmp directory.


    When your mouse pointer is on the destination folder, the latter is highlighted.
    Release the button and once the pop-up menu appears, choose the operation you
    wish to do.


    > Note: Copy a file duplicates the contents in another folder. Move copies the
    file and deletes the original. Link a file creates in the destination folder an
    access point towards a file, which resembles a shortcut. If you delete the link,
    this does not imply that you delete the original file as well.


    Finally, you can also use the clipboard. To copy selected files, use Ctrl+C to
    place them in the clipboard. Then, place your mouse pointer in the destination
    folder and launch the copy process with Ctrl+V. To move files, use Ctrl+X instead
    of Ctrl+C.


    # 11.2.1.5.5. Deleting a File


    Sooner or later, you will want to remove files, either to gain disk space or simply
    to clean up your working environment. Simply select the files or directories you
    wish to delete, then right-click on one of them.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_164_0.png)


    Figure 11-20. Three Methods to Remove Files


    You can delete files and directories in three different ways: the secure, the
    classical and the real method. The secure method is named Move to trash: the files
    are not really removed. They are simply moved in the trash. Hence, you can recuperate
    them, until you empty the trash can... The trash can''s icon is on the desktop:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_164_1.png)


    Figure 11-21. The Trash Icon, Empty or Full


    Click on it to see the files it holds. A new Konqueror window will open. You can
    then retrieve files you placed in it. To do so, click on them and move them wherever
    you wish (whether on the desktop or in another Konqueror window). You can always
    recuperate stuff you placed in the trash can, until you empty it...


    To remove a file like it is generally done under Unixix, you must right-click
    on your file and choose Delete. You will have to confirm you really want to delete
    this file. If you answer yes, its name will be deleted and the space it took on
    your hard disk will be freed. However, it is still possible to recuperate part
    of the file, if you ask an expert.


    Last method, you can Shred your file. This means Konqueror will compress the disk
    space it took with random data, in order to make sure the content will not be
    reconstructed. The file is then completely deleted and there is no way of retrieving
    it.


    To do, select the file you wish to shred by clicking just below the file''s icon
    and by dragging your pointer upwards until your file is highlighted, hence selected.
    Then, access the Edit menu, then Shred.


    141'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Chapter 11. Everyday Applications


    # 11.2.1.5.6. Finding Files


    Konqueror offers a powerful tool to search for files according to different criteria.
    In the Tools menu, select Find file. The following block appears on top of the
    right side of the window:


    | Name/Location | Date Range | Advanced | |

    |---|---|---||

    | Named: | | | |

    | Look In: | /home/peter/test/ | | Browse...

    | Include subdirectories Case sensitive search |


    Figure 11-22. Finding Files with Konqueror


    You can use generic characters such as ? and * in the Search field. For example,
    to find all the files with .txt extensions, type *.txt. To find all files starting
    with the letter C, type C*.


    > Note: Keep in mind that Linux distinguishes uppercases from lowercases. For
    example, you could have a Courrier.txt file and a courrier.txt file: they are
    two different files. You will not find the latter if you look for C*.


    The other tabs allow to pinpoint a search. For example, you can take into account
    the last modification date, the file type, the presence of a certain text inside
    a file... Click on Find when you have your criteria.


    The result of the search is displayed in the lower part of the right side window.
    All common actions are possible: opening a file, copying or deleting it, etc.
    Click on Close to go back to the normal display.


    # 11.2.1.i.6. Modifying the Display


    Konqueror’s principal display options are grouped in the View menu.'
