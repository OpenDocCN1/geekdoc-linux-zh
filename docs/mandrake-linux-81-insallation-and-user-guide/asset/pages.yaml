- pgno: 114
  md: '# Chapter 9. The Desktop According to KDE


    In the internal help, choose any rubric. Then, click on the � thumbnail on the
    right of the title bar: it becomes ❐, and the virtual desktops'' buttons change
    aspect.


    Now go to the second virtual desktop: you will find exactly the same window. Change
    the displayed help section, then switch to the fourth desktop, for example. The
    displayed section is the one you just selected. It is one and only one window,
    not many windows.


    Click again on the thumbnail to unstick the window.


    However, it often happens that a window is in the way, this may be cumbersome.
    Naturally you can reduce its size, but here is another possibility. Click on the
    right button of the help window''s title bar and choose To Desktop→Desktop 1.


    The window disappears! But you did not close it. If you look at the buttons on
    the virtual desktop, you will see that its silhouette is now in the first desktop.
    Go in that desktop and without a doubt, you will find it. You transferred it.


    # 9.3.3. Number and Naming of Virtual Desktops


    According to your activities, you can estimate how many default virtual desktops
    you need. Right-click on the virtual desktop and choose Preferences in the contextual
    menu.'
