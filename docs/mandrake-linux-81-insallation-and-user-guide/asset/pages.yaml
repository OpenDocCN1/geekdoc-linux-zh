  md: '# Chapter 11. Everyday Applications


    Changing *Nautilus''’* theme can be fun, although the difference

    between each theme is the least, quite subtle. Try them

    out. You can also Add New Themes.


    Here is an example of the GNOME theme:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_180_0.png)


    Figure 11-9. GNOME Theme for Nautilus


    # 11.2.2.3.3. Windows and Desktops


    This is the window to tweak if you do not want *Nautilus* to

    draw your desktop. However, if you docheck the Use Nautilus

    to draw the desktop, you will lose all your desktop icons!


    By default, if you click on an icon (or on text, depending on the

    view you choose) in the left or right side of *Nautilus*, the file''s

    contents will be displayed in the same window. In the Windows

    Desktops window, you can modify this by clicking on Open

    each file or folder in a separate window. The same principle applies

    to the other options offered in this window.


    157'
