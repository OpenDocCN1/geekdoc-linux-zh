    block mode files

    files whose contents are buffered. All read/write operations for such files go
    through buffers, which allows for asynchronous writes on the underlying hardware,
    and for reads, not to read again what is already in a buffer.

    See Also: buffer, cache, character mode files.


    boot

    the procedure taking place when a computer is switched on, where peripherals are
    recognized one after the other, and where the operating system is loaded into
    memory.


    bootdisk

    a bootable floppy disk containing the code necessary to load the operating system
    from the hard disk (sometimes it is self-sufficient).


    bootloader

    is a program that starts the operating system. Many boot-loaders give you the
    opportunity to load more than one operating system by letting you choose between
    them at a boot menu. Bootloaders like grub are popular because of this feature
    and are very useful in dual-or multi-boot systems.


    buffer

    a small portion of memory with a fixed size, which can be associated with a block
    mode file, a system table, a process and so on. The coherency of all buffers is
    maintained by the buffer cache.

    See Also: buffer cache.


    buffer cache

    a crucial part of an operating system kernel, it is in charge of keeping all buffers
    up-to-date, shrinking the cache when needed, clearing unneeded buffers and more.

    See Also: buffer.


    bug\illogical or incoherent behavior of a program in a special case, or a behavior
    which does not follow the documentation'
