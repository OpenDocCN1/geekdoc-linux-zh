- pgno: 100
  md: '2. In the lower part of the screen is the “tool bar”. Each icon symbolizes
    an application (or program). Just move your mouse cursor on one of them and leave
    it there for a few seconds. A yellow help balloon will appear. It describes the
    icon’s function. The tool bar is retractable; click on the arrow target...


    ![](img/44017b5ddbff38ec085831b3cde64d5d_100_0.png)


    Figure 8-13. KDE and GNOME Retractable Tool Bar

    ... and the tool bar will automagically shrink. This makes you gain desktop space.
    Click again for it to reappear.


    3. The icons and the tool bar are not floating on the screen: they are “stuck”
    on something called the “desktop”, also called “background” or “root window”.
    In a sense, the desktop is everywhere you see or use lives. Bring your mouse cursor
    on the desktop (i.e. on “nothing”) and click on either one of your mouse buttons:
    a pull-down menu appears, giving access to several functions.


    Now we can start playing with all this stuff.'
