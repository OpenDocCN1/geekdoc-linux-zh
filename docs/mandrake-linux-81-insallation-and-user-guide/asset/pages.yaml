  md: '# Chapter 15. Package Management


    sizes of each sub-directories. On the other hand, the directory bin contains some
    files but no sub-directory: its depth size is the same as its size.


    Now we will select a package. Simply click in the little square box on the left
    of the package name: immediately, this package is added to the Selected box, located
    in the window''s top-right corner (actually, you can double-click anywhere on
    a line associated with a package and that package will be added to the Selected
    packages).


    You can select as many packages as you want. You may also simply browse through
    the packages, choosing on the way for later use. Notice that if you click on a
    package, its description is displayed in the block below the Selected box.


    Finally, let us talk a bit about the Find text field: as you may have guessed,
    this will look for a word through all the packages'' names. Simply type in a word,
    then click the Search button. Packages whose name contain the given word are displayed
    under the Search tree node in the tree view, or only listed packages in the Flat
    List view. Also note that if you want to use the plus sign ("+") in your search
    (as in "C++", instance), you have to prefix it with a backslash sign, for example:
    "C\+\"."


    > Note: For expert users, the Find field supports standard regexps (regular expressions),
    as defined in regexp(7).


    If you type another word and then click Search again, the result of your second
    inquiry replaces those of your first one. If you want to clear your search results,
    use the Reset button.


    # 15.1.2. Installable and Installed Packages


    Two kinds of RpmDrake packages exist: the Installables, which holds the not as
    yet installed packages and the upgradable ones, while the Installed RPMs are,
    you guessed it, already installed on your Mandrake Linux system but unfortunately,
    there are no upgrades available. Click on the according tab (just under the button
    bar) to switch between the two lists.'
