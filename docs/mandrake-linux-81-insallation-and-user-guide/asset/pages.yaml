    Figure 15-3. A package''s file list


    If you click on the first column''s label, the question mark ?, then RpmDrake
    will check if the files contained in the package already exists on your system.
    If so, they will be marked by a green mark ✓ If the files are not present, then
    they are marked by a red mark X.


    Let''s have a look at the Deep size column. You can see it shows only for directories.
    The size of a directory is defined as the sum of all the files'' sizes contained
    in it. If the directory does not contain any sub-directory, that''s enough. Now,
    if a directory contains one or more sub-directories, then the depth size is defined
    as the directory''s size, plus the depth size of each of its sub-directories.


    On the above example, the directory usr has a size of zero; it''s-because it doesn''t
    contain any files. But it contains sub-directories (bin and share): therefore
    its depth size is the sum of the depth


