    which gives you access to more resolutions and color depths.


    Test the configuration


    It is highly recommended that you do test, because if it doesn''t work it will
    be harder later to recover a working graphical environment.


    X at startup


    Answer No if you prefer to have a text login at boot time. Selecting Yes will
    launch the graphical login manager.'
  merge: -1
