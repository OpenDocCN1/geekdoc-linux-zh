- pgno: 101
  md: '# Chapter 8. Linux for Beginners


    # 8.3.2. Managing Windows and Desktops


    Click on the icon


    on the desktop (usually, at the left side of the screen). You can hear your hard
    drive spinning a bit, then something like this appears:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_101_0.png)


    Figure 8-14. KDE and GNOME File Managers


    You just launched a program (here, a file manager) which runs inside a window.


    The window is composed of several parts. On the top is the “title bar.” It shows
    the name or title of the program you launched and possibly, the document you are
    working on.


    It can be in two different states:


    active, which means you are currently using it, while inactive signifies the program
    is still running, but you are not currently interacting with it. Usually, the
    active title bar is full-colored, whereas the inactive title bar is shaded or
    grey.


    Just under the title bar is the “menu bar.” In our example, it says (from left
    to right) File, Edit, and so on. Click on File. A list of items appears, each
    of which gives you access to a program’s function. This list of items is called
    a “pull-down menu”.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Chapter 8. Linux for Beginners


    Also under the menu bar is the “icons bar”, also called the “application’s tool
    bar”. It is simply one or more rows of icons, each equivalent to an item in a
    pull-down menu: you can see them as a short-hand access to program features, which
    you would find somewhere in the menu bar.


    The “status bar” usually sits at the bottom of the window. There, the running
    program displays informations about what the program is doing. Not all programs
    offer this feature, but if the one you are using does, remember to check it if
    you are lost...


    We introduced the word desktop. Now, look at the tool bar at the bottom of the
    screen. You can see a group of four “buttons:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_102_0.png)


    Figure 8-15. Buttons for Virtual Desktops


    These buttons give you access to “virtual desktops” which allow you to open several
    windows and organize them as you wish. More on virtual desktop handling and usage
    in “The Desktop Accounting to KDE”, page 85 (for KDE) and “Using GNOME”, page
    105 (for GNOME).


    Sometimes you may find the window you opened is not where you want on your screen.
    You may move it to see another window, or for convenience.


    You can do this very simply with your mouse. Bring the cursor to your window’s
    title bar, then press and hold the left button. Just move the mouse (while still
    pressing the button). The window will simply follow the movement of your mouse.
    This is called “dragging” the window. When you reach a position that pleases you,
    just release the mouse button: you just fixed the window to a new position.


    You can also change the virtual desktop the window is in. This may be handy to
    logically organize your work by desktop.


    You will need to use your mouse again. With KDE, right-click on the window’s title
    bar and a pull-down menu appears with an item named Move to. Just point to this
    item and a list of your


    79'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Chapter 8. Linux for Beginners


