  md: '# Chapter 11. Everyday Applications


    # File Menu


    The simplest commands are contained in this menu such as Print, Close, Quit, etc.
    Note that the Close option terminates your mail client while the quit option closes
    all netscape browsers and clients alike. Use the Subscribe option if you wish
    to subscribe to existing mailing lists on the server(s) you are using.


    # Edit Menu


    Held in this menu are the Cut & Paste options plus a few handy sub-menus. The
    Preferences'' one is, to opinion, the most critical. This is where you set your
    mail server addresses, your identity, e-mail address, return e-mail address different
    from the one you are currently using, etc. You can also select your mailing lists
    servers.


