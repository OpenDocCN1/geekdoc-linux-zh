- pgno: 330
  md: '# Glossary


    desktop

    If you’re using the X Window System, the desktop is the place on the screen inside
    which you work and upon which your windows and icons are displayed. It is also
    called the background, and is usually filled with a simple color, a gradient color
    or even an image.

    See Also: virtual desktops.


    directory

    Part of the filesystem structure. Within a directory, files or other directories
    are stored. Sometimes there are subdirectories (or branches) within a directory.
    This is often referred to as a directory tree. If you want to see what’s inside
    another directory, you will either have to list it or change to. Files inside
    a directory are referred to as leaves while subdirectories are referred to as
    branches. Directories follow the same restrictions as files although the permissions
    mean different things. The special directories . and .. refer to the directory
    itself and to the parent directory respectively.


    discrete values

    are values that are non-continuous. That is, there’s some kind of “spacing” between
    two consecutive values.


    distribution

    is a term used to distinguish one GNU/Linux manufacturers product from another.
    A distribution is made up of the core Linux kernel and utilities, as well as installation
    programs, third-party programs, and sometimes proprietary software.


    DLCI

    The DLCI is the Data Link Connection Identifier and is used to identify a unique
    virtual point to point connection via a Frame Relay network. The DLCI’s are normally
    assigned by the Frame Relay network provider.


    echo

    is when the characters you type in a username entry field, for example, are shown
    “as is”, instead of showing “*” for each one you type.'
