  md: '# Chapter 11. Everyday Applications


    # 11.2.1.6.2. Using index.html


    If you browse frequently through files containing HTML, for example your distribution''s
    documentation, these files generally hold a file index.html. It is a very common
    name which gives you access to many files.


    Let''s take /usr/share/doc/mandrake/en/ as an example. If you do not activate
    the Use index.html, you will only get a list of files and directories contained
    in folder. If you activate the option, Konqueror displays the contents of index
    .html file, and you can easily browse through the documentation, as if you were
    on the web.


    # 11.2.1.6.3. Sort


    The usual file display order is alphabetical, with the directories shown first.
    You can choose to ignore or not the case, that is the difference between upper-
    and lowercase letters. If you ignore it, you will get a dictionary-like order.
    If you do not, then the upper-case letters will be displayed before. For example,
    a file starting with the letter Z will be displayed before one which starts with
    the letter a.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_169_0.png)


    If you use the list-display mode, you can click on the column''s titles to define
    on which file characteristic to sort (for example, the size) as well as the sort''s
    order (for example, descending order). This is what the header shows here: the
    arrow''s presence, on the right of the title, indicates that the element is taken
    into account in the sort action, and its upward direction signifies ascending
    order. Click again on the title to change direction or sorting order.


    # 11.2.1.6.4. Contents Preview


    Instead of file representation through icons, Konqueror can display a miniature
    preview of certain file types (if you use one of the two large-icon display types).
    The Preview sub-menu allows to select the file types you want to display in tiny
    aspect. Here is an example of preview displays:'
