    enhanced with a short text beneath it representing the icon’s title or name. Each
    icon allows you to open a window, within which a program will run, for instance,
    a game or a window displaying personal data. In our example, the icon shown above
    gives you access to a configuration tool created by MandrakeSoft.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_99_1.png)


    Figure 8-12. Access to Mandrake Control Center'
