- pgno: 288
  md: '# # Appendix A. Where to Get Documentation


    Apart from the manuals included with Mandrake Linux, documentation is available
    from many sources. The next few pages will offer you some suggestions which you
    might find useful.


    # ## A.1. The Documentation Included In Mandrake Linux


    # ### A.1.1. The Man Pages


    This is a primary source of information on a day-to-day basis. Each command corresponds
    to a manual page, or almost. Plus, certain configuration files, library functions
    for programmers and others, also possess their own manual pages.


    Their contents are arranged in different sections. References to these sections
    are made in the following manner: for example, open(2), fstat(5) will respectively
    refer to the open page in section 2 and the fstat page in section 5.


    To display a manual page, type man. Its syntax is as follows:


    ```

    man [options] [section] <manual page>

    ```


    Even for man itself, a command is available: man man. Manual pages are formatted,
    then displayed using the less pager by default.


    The names of the manual pages and their relevant sections appear at the top of
    each page. At the bottom are given references to other pages with related subjects
    (in general in the SEE ALSO section).


    You can start by consulting the pages related to the different commands covered
    in this manual: ls(1), chmod(1), etc.


    If you cannot find the right page - for example, you want to use the mknod function
    in one of your programs but you end up on the mknod command page -, make sure
    you spell out the section explicitly. In our example: mknod(2). If you forget
    the exact section, man -a mknod will read through all the sections looking for
    pages named mknod.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# A.1.2. Info Pages


    info pages complete the documentation included in the manual pages. The command
    for accessing info pages is info.


    The info pages have a tree structure, the top of which is called dir. From there,
    you can access all of its info pages.


    info may be called up in two ways: either by omitting argument, which will place
    you at the very top of the tree structure, or by adding a command or a package
    name, which will open the relevant info page, if it exists. For example:


    ```

    info emacs

    ```


    In the info pages:


    +   * Buffers:


    will indicate a link. Moving the cursor to this link (using the arrow keys) and
    pressing Enter will take you to the corresponding info page.


    You may use the following keyboard shortcuts:


    +   * u: for Up, takes you up one level;

    * n: for Next, brings you to the next info page on the same tree-structure level;

    * p: for Prev, takes you back to the previous info page.


    A great number of commands may be listed by typing: ?.


    # A.1.3. HOWTOs


    HOWTOs, published by the LDP (Linux Documentation Project), and available in many
    languages, will help you configuring many aspects of your system. As long as the
    proper packages is installed (the نحو-html-en package for the English edition),
    HOWTOs will provide you with an answer to a specific question or a solution to
    a problem on your hard disk. The documentation is located in the /usr/share/doc/HOWTO/HTML/en/
    directory. The are text files in their primary form, although they are also readable
    in HTML with a web browser, and printable with PostScript.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Appendix A. Where to Get Documentation


    The list is quite exhaustive. Get an idea of its length by consulting the index
    from the main menu: Documentation→HOWTO English. When met with a complex problem,
    start by reading the corresponding HOWTO (if it exists of course!). Not only will
    you be given a solution to your problem but you will also learn a great deal at
    the same time. Among others, examples of what is covered range from networking
    (NET-3-HOWTO), sound card configuration (Sound-HOWTO), the writing of media CD
    (CD-Writing-HOWTO) as well as NIS and NFS configuration.


    An important step is to check the modification dates of the HOWTO documents -
    i.e. the publication date located at the beginning of the document - to make sure
    they are up-to-date. Otherwise, their contents may be invalid. Watch out for old
    HOWTOs relating to hardware configuration especially, as Linux evolves very fast
    in that specific area. Remember also that, in the free software world, the term
    “old” carries even more weight than in IT in general: free software may be considered
    old after being around fifteen days!


    > Note: HOWTOs are available online on the LDP (http://linuxdoc.org/) site and
    likely to be slightly more up-to-date there. Have a look at the following as well:
    (classified by categories (http://linuxdoc.org/HOWTO/HOWTO-INDEX.html)); and FAQs
    (http://linuxdoc.org/docs.html#faq).


    # A.1.4. The /usr/share/doc Directory


    Some packages include their own documentation in one of /usr/share/doc subdirectories
    and named after the specific package.


    # A.2. Internet


    Internet information sources are widespread and web sites devoted to GNU/Linux
    and its use or configuration numerous. However, there are other places than web
    sites.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Appendix A. Where to Get Documentation


    Your preferred source of information should be the Mandrake Linux (http://mandrakelinux.com/)
    official Web site. In particular, check out the support (http://mandrakelinux.com/en/ffreesup.php3)
    section.


    # A.2.1. Web Sites Devoted to GNU/Linux


    # A.2.1.1. MUO


    MandrakeUser.org (MUO) is the Mandrake Linux users database. With over 200 pages
    and growing, it is arguably the largest collection of Mandrake Linux-related documentation
    on the web. Apart from the online version of our present wonderful handbook, that
    is... ::-)


    MUO collects submissions by Mandrake Linux users. It also features a discussion
    forum and a community newsletter. The articles are targeted towards beginners
    and semi-advanced users. They do not simply repeat what may be read somewhere
    else. Their aim is to be practical. In short, they do their job!


    Topics range from administrative issues, like the handling of the shell, to the
    tweaking of X’s performances, GNU/Linux’s graphical subsystem.


    It may be found at MUO (http://mandrakeuser.org/):


    > Note: If you are familiar with Mandrake Linux web sites, you probably know Mandrake
    Forum (http://mandrakeforum.com/). For those who are unaware of that site, it
    acts as a forum for Mandrake Linux users. There, you will find suggestions, questions
    as well as news related to Mandrake Linux and GNU/Linux. Please note these two
    platforms (MUO and Mandrake Forum) will be merged very soon.


    # A.2.1.2. Demos and Tutorials


    A specific section of the Mandrake Linux web site is devoted to numerous demos
    and tutorials (http://www.mandrakelinux.com/en/demos/). They discuss, among other
    topics, installation and graphical environments; many aspects of the configuration-'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Appendix A. Where to Get Documentation


    of your system such as network, packages maintenance, server configuration, etc.
    Some of the tutorials are also accessible from the installation CD in the tutorial
    directory.


    # A.2.1.3. Security Related Web Sites


    http://www.securityportal.com/ (http://www.securityportal.com/)


    This site is devoted to general security issues on the Internet and contains some
    very interesting articles covering many aspects of the topic. A weekly newsletter
    is also available.


    Another service (with a charge) is the customized sending of security threats.


    http://www.securityfocus.com/ (http://www.securityfocus.com/)


    A very well organized site which reviews current attacks, gives out vulnerability
    advisories for a remarkably great number of products, including Mandrake Linux’s.


    http://www.linuxsecurity.com/ (http://www.linuxsecurity.com/)


    This one is entirely devoted to Linux and includes news, advisories, newsletters,
    and many resources such as documentation, forums, tools, etc.


    http://linux.com/enhance/ (http://linux.com/enhance/)


    An excellent site regularly fed with articles on present security issues. This
    section of the Linux.com (http://www.linux.com/) also features articles about
    desktop issues, sound, etc.


    # A.2.1.4. Other Linux Web Sites


    Out of the multiple existing web sites, here are some of the most exhaustive:'
