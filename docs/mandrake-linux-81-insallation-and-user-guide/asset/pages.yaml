    \ full compatibility with the scheme described above, but this compatibility may\
    \ disappear in the future. Actually, each device is dynamically added to the system\
    \ as soon as it becomes available or needed.\n\nFor example, the first IDE hard\
    \ drive now becomes:\n\n```\n[root@localhost ~]# 11 /dev/hda\nlr-xr-xr-x 1 root\
    \ root 32 Sep 2 17:14 /dev/hda\n        -> ide/hda0/target0/lun0/disc\n```"
