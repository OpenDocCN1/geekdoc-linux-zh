    # 11.2.1.6.6. Splitting Windows


    Right-click on the bar at the bottom of the right-side window, the one which holds
    a big green button. You obtain this menu:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_171_0.png)


    Figure 11-30. Acting Upon Displays with Konqueror


    In this menu, choose Split View Top/Bottom. The window is split into two, each
    possessing its own information bar, each one is independent. Only one window can
