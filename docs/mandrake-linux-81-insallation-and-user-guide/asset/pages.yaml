    have keyboard shortcuts: Reply (Alt-R), New message (Alt-

    M), New browser (Alt-N), Cut (Ctrl-X), Copy (Ctrl-C) and Paste

    (Ctrl-V). Try these out and you will see how quickly you can

    go going about sending e-mails without your hands leaving the key-

    bord.


    The task bar located under the file menu, however, is pretty help-

    ful. There you will find all the major e-mail client functions such

