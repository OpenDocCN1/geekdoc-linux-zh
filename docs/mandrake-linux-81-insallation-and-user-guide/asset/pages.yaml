  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_188_0.png)


    Figure 11-44. Short-Cutting your Way through E-mails


    # 11.3.1.5. Messages


    This sub-menu enables personalization in regards with the look of your messages.
    When you reply to an e-mail, you may choose to quote (or not) automatically the
    original message. The best feature, however, is the Wrap Longlines: did you ever
    try to read an e-mail and had to browse horizontally with your mouse pointer?
    Not very exhilarating... This feature formats your e-mail with a maximum of 72
    characters per line.


