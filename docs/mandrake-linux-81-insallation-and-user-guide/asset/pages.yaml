  md: 'this only prevents fragmentation locally, some other link in the path may have
    a smaller MTU and the datagram will be fragmented there. Typical values are 1500
    bytes for an ethernet interface, or 576 bytes for a SLIP interface.


    # multitasking


    the ability for an operating system to share CPU time between several processes.
    At low level, this is also known as multiprocessing. Switching from one process
    to another requires all the current process context be saved and restored when
    this process is elected again. This operation is called context switch; therefore
    it’s fast enough so that a user has the illusion that the operating system runs
    several applications at the same time. There are two types of multitasking: preemptive\u2013multitasking
    is where the operating system is responsible for taking away the CPU and pass
    it to another process; cooperative multitasking is where the process itself gives
    back the CPU. The first variant is, obviously, the better choice because no program
    can consume the entire CPU time and block other processes. GNU/Linux does preemptive
    multitasking. The policy to select which process should be run, depending on several
    parameters, is called scheduling.


    # multiuser


    is used to describe an operating system that allows multiple users to log into
    and use the system at the exact same time, each being able to do their own work
    independent of other users. A multitasking operating system is required to provide
    multiuser support. GNU/Linux is both a multitasking and multiuser operating system,
    as any Unix system for that matter.


    # named pipe


    a Unix pipe which is linked, as opposed to pipes used in shells. See also pipe,
    link.


    a word commonly used in computing for a method to identify objects. You will often
    hear of "naming conventions" for files, functions in a program and so on.'
