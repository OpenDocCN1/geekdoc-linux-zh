    # 13.3.2. Server Configuration


    The server configurations include three security levels. They start with the following
    major servers turned off: DNS, Mail, web, FTP and DHCP. and then modify them,
    based on which of the five major server types the user asks for.


    # 13.3.2.1. Lax Security Level


    +   - No firewalling

    - Disables SUID status from dump/restore, cardctl, dosemu, news server programs

    - Enforces password aging

    - Password protects single user mode

    - Adds additional logging

    - Disables apmd, NFS, Samba, pcmcia, DHCP server, news server, routing daemons,
    NIS, SNMPD

    - Disables VRFY/EXPN data mining commands in sendmail

    - Deactivates named (dns)'
