- pgno: 181
  md: '# Chapter 11. Everyday Applications


    # 11.2.2.3.4. Icon & List View


    The features in this window are very useful. Here you can activate items with
    a single click (instead of the default double click), show hidden files (the ones
    that start with a period). You can view those in a Terminal using `ls -a` and
    backup files (the ones which end with a tilde). You can also list folders before
    files, which is very helpful when a directory holds many files.


    # 11.2.2.3.5. Icon Captions


    This window has only one function. Here you determine in what order information
    about files is shown. You find the typical size, date modified, type, etc.


    # 11.2.2.3.6. Sidebar Panels


    Here you define which tabs you want to see in your sidebar (which is the left
    side of the window). Click or click on the different options to see them appear
    or disappear. You may also choose to see only folders in your tree structure.
    Hence, you would see the folders in the sidebar and the contents in the right
    side of the window.


    # 11.2.2.3.7. Search


    Define your search options in this window. You can either choose to search "by
    file name only" or "by file name and properties". You can select your default
    search engine (Google (http://www.google.com)) by default.


    # 11.2.2.3.8. Navigation


    The Navigation window is where you determine your home page (your_account by default).
    You can also set your Proxy settings, if you use one. Finally, you can disregard
    bookmarks created by Nautilus by clicking on the Don''t include the built-in bookmarks
    in the Bookmarks menu.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 11.2.2.3.9. Speed Tradeoffs


    Here are located options concerning information displayed about icons. You can
    set Nautilus to show text in icons, to list the number of items in a folder, to
    display thumbnails for image files and even to preview sound files, which launches
    an audio player such as XMMS.


    # 11.2.2.3.10. News Panel


    Two options are offered here:


    +   * maximum items per site;

    * update minutes.


    The first one allows you to set the number of news which will be displayed in
    the sidebar''s news tab (default is six news). The second one lets you set the
    update frequency (default is five minutes).


    # 11.2.2.4. Browsing the Web


    Like Konqueror, Nautilus acts as a file manager and a web browser. Simply type
    a web address in the Location Bar and off'
