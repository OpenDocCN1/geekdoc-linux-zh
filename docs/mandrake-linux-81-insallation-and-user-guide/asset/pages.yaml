  md: '# Glossary


    # WAN


    Wide Area Network. This network, although similar to a LAN connects computers
    on a network that is not physically connected to the same wires and are separated
    by a greater distance.


    # account


    on a Unix system, the combination of a name, a personal directory, a password
    and a shell which allows a person to connect to this system.


    # alias


    mechanism used in a shell in order to make it substitute one string before executing
    the command. You can see all aliases defined in the current session by typing
    alias at the prompt.


    # arp


    Address Resolution Protocol. The Internet protocol used to dynamically map an
    Internet address to physical (hardware) addresses on local area networks. This
    is limited to networks that work support hardware broadcasting.


    # assembly language


    is the programming language that is closest to the computer, which is why it''s
    called a "low level" programming language. Assembly programs are written in terms
    of processor instructions so little or no translation is needed when generating
    executables. Its main disadvantage is that it is processor (or architecture) dependent.
    Writing complex programs is very time-consuming as well. So, assembly is the fastest
    programming language, but it isn''t portable between architectures.


    # ATAPI


    "AT Attachment Packet Interface") An extension to the ATA specification ("Advanced
    Technology Attachment", more commonly known as IDE, Integrated Drive Electronics)
    which provides additional commands to control CDROM drives and magnetic tape drives.
    IDE controllers equipped with this extension are also referred to as EIDE (Enhanced
    IDE) controllers.'
