- pgno: 26
  md: '# Chapter 2. WARNING – README


    This manual covers the installation in both Recommended and Expert mode. If you
    have Windows installed on your system, and have never installed GNU/Linux before,
    DrakX will have to resize your Windows partition (if any). This operation can
    be harmful to your data, therefore you must perform the following steps before
    proceeding:


    +   * You must run scandisk on your Windows partition; the resizing program can
    detect some obvious errors, but scandisk is better suited for this task;

    * For maximum data security, you should also run defrag on your partition. This
    further reduces the risk of data loss; this is not mandatory, but is highly recommended
    and doing so will make resizing much faster and easier;

    * The ultimate insurance against problems is to always back up your data!


    If neither scandisk nor defrag are installed within Windows, please refer to the
    Windows documentation for instructions on installing them.'
  merge: -1
