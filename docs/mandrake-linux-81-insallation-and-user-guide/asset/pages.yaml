  md: '# Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_236_0.png)


    Figure 14-9. harddrake - selected device


    If you select a device, you will get some useful information about it. In some
    cases you will see a configuration button, which will allow you to configure the
    selected device. In 14-9, we have expanded some parts of the tree and selected
    a device of one category. On the right you can see information about the selected
    card. If you press the Run Configuration tool button, the configuration tool associated
