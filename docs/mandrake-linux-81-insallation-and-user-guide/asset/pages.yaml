- pgno: 128
  md: '# Chapter 10. Using GNOME


    This chapter is dedicated to GNOME, another favorite graphical user interface.
    Although its features resemble a lot of KDE, the user interface is a bit different
    from what you might be accustomeded to. On the other hand, you will rapidly notice
    that it is much sexier than anything you previously used!


    # 10.1. Getting Help


    GNOME comes with a built-in


    ![](img/44017b5ddbff38ec085831b3cde64d5d_128_0.png)


    Help browser is very useful for new users. The intermediate (maybe experienced)
    user may also find this tool of use since it holds a good index of GNOME applets
    and programs. You will find it on your panel (the task bar at the bottom of your
    screen): it is easily recognizable since it is represented by an interrogation
    mark (?).


    As an example, you will find definitions for the clock, CD player and CPU applets
    in the GNOME Documents section. This is an excellent starting point and it will
    give you a good idea of what GNOME can do for you, as well as why and how you
    should/can utilize it. Feel free to frequently surf its pages: you will surely
    become a better user once you master this user-friendly browser-based tool.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Chapter 10. Using GNOME


    | File | Window | View | Settings | Help |

    |---|---|---|---|---||

    | Back | Forward | Reload | Index | History BMarks | Help |


    ![](img/44017b5ddbff38ec085831b3cde64d5d_129_0.png)


    G·N·O·M·E


    HELP INDEX

    GNOME User''s Guide

    Man Pages Info Pages GNOME Documents


    Figure 10-1. Help Center under GNOME


    Now that you are a bit more comfortable with your new environment, we will briefly
    describe the Help browser''s three main sections.


    GNOME User''s Guide


    Pretty self-explanatory, no? This section contains the complete GNOME User Guide.
    It is an essential tool for all GNOME users. Its ease of use and explicit definitions
    will surely help you better understand this GUI (Graphical User Interface).


    Man Pages


    Now, something a bit more complex... The Man Pages will answer almost every question
    you may have about programs, functions and administration utilities. They are
    targeted to intermediate and experienced users who master the evil command line.
    as an example, if you have a problem copying a file, simply type man "cp" stands
    for copy in a command line and it will return all the available options


    106'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Chapter 10. Using GNOME


    for that command. The GNOME Man Pages held in the Help browser are an exact replica
    of what you get when type man followed by a precise command (“cp” in our example).


    # Info Pages


    The more you explore the Help browser, the better a user you will become. The
    Info Pages holds a set of tutorials about GNU-based software and utilities. If
    you wish to master Emacs, a powerful editor, fear not! The Info Pages will help
    you learn more on this amazing software application.


    # GNOME Documents


    This section holds a series of fascinating user guides and tutorials. You did
    not find a free software equivalent to your usual spreadsheet? Browse the GNOME
    Documents and look for the numeric hyperlink. Those documents are the best way
    to quickly learn and feel comfortable with a GNU/Linux desktop.


    # 10.2. GNOME''s File Manager: Nautilus


    We strongly suggest that you use the command line to manage your files, since
    it allows for a much greater range of control over them. But if are are shaking
    at the idea of opening your Terminal, you may utilize the more user-friendly Nautilus.
    For more information about this program, please refer to the Nautilus File Manager,
    page 149.


    # 10.3. Setting up your Panel


    Now that you understand how the Help Browser and Nautilus File Manager work, we
    will describe the many features of the GNOME panel. It sits at the bottom of your
    screen and is very useful in order to manage your daily utilities and programs,
    as well as virtual desktops. Let us start with a couple of definitions. The GNOME
    panel is usually divided into two sections. On the left, you find the GNOME menu
    icon.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Chapter 10. Using GNOME


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_0.png)


    Figure 10-2. GNOME Panel


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_1.png)


    As you can see in the figure, essential applets and programs are included in the
    panel. Starting on the left-hand side is the GNOME menu, where all your applications
    (whether text editors, multimedia or games) lie.


    **Note:** If you wish to add programs or applets to your panel, simply go in the
    GNOME menu, select the desired application and right-click on it. A pop-up menu
    will show an Add this launcher to panel item. Release your mouse on that message
    and the program/applet will be added to your panel.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_2.png)


    Next to it is the Log-Out Applet. It allows you to log out of your session, either
    because you are leaving work, or to let other users utilize the computer, etc.
    Now, the word "session" may bewilder you. A session is the length of time contained
    between the moment you log in and log out. If you click on it, it will prompt
    you to save the changes you made to your session (or simply log out if you configure
    properly in the GNOME Control Center, which we will discuss later on) and a box
    holding all the computers'' users (root, your_user_name, etc.) will appear after
    the X server restarts.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Chapter 10. Using GNOME


    The next applet icon is called the Lock Screen. As you probably noticed, most
    GNOME application and applet names are extremely logical. This feature allows
    you to lock your screen when you are away from your computer, therefore avoiding
    unpleasant surprises or colleague pseudo hazing...


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_0.png)


    The two little screens next to the Lock Screen are Screen Shooters. They allow
    you to take snapshots of your screen. After clicking on the blue screen, two little
    screen appear. The one on the left allows to select a particular window, while
    the other grabs the entire screen. This applet is very useful for... user guides
    since it enables precise grasping of screen displays.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_1.png)


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_2.png)


    This is one of our favorites. It maximizes the space on your panel by reducing
    the size of applets/applications. You can include as many as you want (in our
    example: 5). In it, we inserted the Help browser, the GNOME Control Center, a
    GNOME-specific calculator called GNOME Calc, a Save your Session icon and finally,
    the not-so-evil command line also known as the GNOME terminal, which is a GNOME-specific
    Terminal


    +   1. We use this applet to avoid the annoying prompt when we log out. When you
    log out, a splash screen asks if you want to save the settings you may have changed
    during your session. You can simply click on Save or not if you do not wish to
    save your new settings, if any. You may also configure it in the GNOME Control
    Center.'
  merge: -1
  img_proc: true
