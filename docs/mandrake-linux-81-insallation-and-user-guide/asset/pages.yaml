  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_195_0.png)


    Figure 11-51. Netscape New Message


    As you can see, we are sending an e-mail to Queen Pingusa while Peter Pingus will
    receive a Blind Carbon Copy, which means Queen Pingusa will not know a copy was
    sent to Peter Pingus. This may be helpful if you want a copy of the e-mails to
    you. You can add as many Carbon Copy or Blind Carbon Copy recipients as you like/need.


    When writing an e-mail, use a self-explanatory title, for many Internet users
