    # ## 6.2. General Conventions


    # ### 6.2.1. Command Synopsis


    The example below shows you the symbols you will find when the writer describes
    the arguments of a command:


    ```

    command <literal argument> [-option={arg1,arg2,arg3}] [optional arg. ...]

    ```


    These convention are standard and you may find them at other places such as the
    man pages.


    The "< (less than) and "> (greater than) symbols denote a mandatory argument not
    to be copied verbatim, but to replace according to your years. For example, <filename>
    refers to the actual name of a file. foo.txt, you should type foo.txt, and not
    <foo.txt> or <filename>


    The square brackets "[]" denote optional arguments, which you may or not include
    in the command.


    The ellipsis "..." mean an arbitrary number of items can be included.


    The curly brackets "{}\" contain the arguments authorized at this specific place.
    One of them is to be placed here."'
