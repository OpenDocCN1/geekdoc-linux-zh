  md: '# Chapter 11. Everyday Applications


    in a folder, simply click the symbol on the left of each folder name. Hence, you
    can view your folder’s contents. If you click again, you only get a folder view,
    without the contents.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_158_0.png)


    You can also move around in the right side of your window. Simply click on the
    icons which represent the documents, like the one shown above.


    # 11.2.1.4. Selecting Files


    You only need to click to open a file or change directory. Then, how can you select
    one or many files? If, for some reason, files are already selected, click on Konqueror’s
    background (where there is nothing) to cancel all active selections. The Esc key
    also possesses the same virtues.


    To select only one file, click on its icon while pressing the Ctrl key.


    You can also select many files with the mouse. Click on the right window’s background
    then move the mouse while pressing and holding its button: a rectangle will be
    drawn and everything contained in it will be selected, as illustrated below.'
