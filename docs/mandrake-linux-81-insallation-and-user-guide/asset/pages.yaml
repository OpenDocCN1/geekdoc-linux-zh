- pgno: 184
  md: 'keep in mind that this section will reveal only basic stuff

    how to browse, write mails, etc.


    Note: Many web browsers and mail clients exist. For the purpose of

    book, we will speak about netscape, which is arguably the

    most used. All browsers and mail clients work in very

    similar fashions so, generally speaking, the information contained in

    this section applies to most web browsers and mail clients.


    # 11.3.1. Configuring your Mail Client


    To open netscape, access your GNOME or KDE menu and then go

    in the Networking→E-Mail→Netscape Messenger.


    Then, you need to configure your mail client and browser in or-

    der to go any further. For this, you need your user name, your

    password, your POP /IMAP server name, your SMTP server name-

    me and your NNTP server name. If you do not have this info, get

    it!


    # 11.3.1.1. Identity


    To configure your mail client, go in the Edit menu and select the

    Preferences sub-menu. There you will find a Mail & Newsgroups

    category. Select the first one, that is Identity. Fill in the blanks:

    your name, e-mail address (the two latter fields are mandatory),

    reply-to address, organization and signature file items. You can

    create a signature file which will identify you. To do so, open

    your favorite text editor and write what you want your fellow

    web surfers to know you as. Then Save the file as .signatu-

    re.txt and you are up and running.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_185_0.png)


    Figure 11-41. Your Identity


    **Note:** The following sections are all configured in the Edit→ Preferences sub-menu.
    We will not repeat this throughout it since it would perfectly redundant, don''t
    you think?


    # 11.3.1.2. Mail Servers


    In order to log on to the Internet, you must go through a mail server. For it
    to work properly, choose the Edit button and type in your server''s name (i.e.:
    Mandrakesoft.com). If you are using a POP mail server, you may only use one mail
    server and your mail will be held on your computer. On the other hand, if you
    use an IMAP mail server, you may utilize as many mail servers as you like while
    your mail is kept on the server. Finally, you write your user name in the appropriate
    field and you may enable the mail client for your password, although this is not
    secure. This information is provided by your ISP. The latter must also give you
    a SMTP mail server name for outgoing mail.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_186_0.png)


    Figure 11-42. Configuring your Mail Server


    # 11.3.1.3. Newsgroups Servers


    If you understood the latter paragraph, well, it''s about the same thing for this
    type of server. Your ISP provides you with a similar server name but for news
    this time. You may also subscribe to other newsgroups via the File→Subscribe menu.'
