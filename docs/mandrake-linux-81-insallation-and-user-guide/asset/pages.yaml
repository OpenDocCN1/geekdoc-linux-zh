    Figure 11-46. Send all those E-mails... Intelligently


    # 11.3.1.7. Formatting


    Now, some users prefer to receive e-mails in text mode, others in HTML. Which
    ever you like better does not really matter, but the recipient''s opinion is important...
    For instance, some users hate to receive HTML-based e-mails: they might simply
    delete it because it is too long to download. Others do not care, etc You know
    your e-mail partners better than we do, so make sure the format you use suits
    them.


