- pgno: 224
  md: '# Chapter 14. Mandrake Control Center


    Mandrake Control Center is the main configuration tool for your Mandrake Linux
    distribution. It enables the system administration to configure the hardware and
    services used for all users. The tools accessed through the Control Center greatly
    simplify the use of the system, notably by avoiding the evil command line. :)


    Not all tools accessible from Control Center are described in this chapter: notably
    "Package Management", page 253 and "Configuring Internet Connections", page 181.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_224_0.png)


    Figure 14-1. The Control Center icon


    > Note: Control Center is also available from the command line in text mode by
    running DrakConf or mcc.


    The following image shows the window that pops-up when you click on the Control
    Center icon on the desktop (figure 14-1).'
  merge: -1
  img_proc: true
