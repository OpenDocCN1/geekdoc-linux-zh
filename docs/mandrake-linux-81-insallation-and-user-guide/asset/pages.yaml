- pgno: 104
  md: '# Chapter 8. Linux for Beginners


    ![](img/44017b5ddbff38ec085831b3cde64d5d_104_0.png)


    Figure 8-17. Maximizing Windows for KDE and GNOME


    Now your window fits your screen! This operation is called “maximizing” a window.
    Click again on the same button to bring the window back to its original size.


    On the contrary, if you want to hide your window but keep the program running,
    click on this button.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_104_1.png)


    Figure 8-18. Minimizing Windows for KDE and GNOME


    The window seems to disappear. In fact, you resized it to its minimal possible
    size: the icon’s size. This is called “minimizing” a window. You cleared the screen-space
    it was using but the program is still running. You can still see it there on the
    “task bar”:


    | X Kandalf''s useful ... | file:/home/yves |


    | Gnome him: | home/yves |


    Figure 8-19. The Task Bar Under KDE and GNOME


    To view the window on your desktop once more, just click on the icon associated
    with it.


    In most cases, you do not want to maximize nor minimize the window. You just want
    some sort of “middle range” where you can adjust the window’s size according to
    your needs.


    81'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Chapter 8. Linux for Beginners


    You can achieve this with your mouse and the boundary borders of the window.


    Bring the mouse cursor to the right edge between the desktop and the running program.
    Your cursor will change to a double-arrow.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_105_0.png)


    Now act like you did when moving the window, pressing the left button and keeping
    it pressed while moving. The window resizes and its contents rearranges. When
    you are satisfied with the new size, just release the mouse button.


    We did using this thing with the right-hand border of the window. You can do the
    same thing with the bottom, top or left-hand borders. You can even do it with
    the window’s corners, in which case you can resize the window in two directions
    simultaneously.


    Note that not all windows can resize this way and usually, minimum and maximum
    (although rare) sizes are defined.


    As a final note about the buttons in the window’s title bar, con-sider this:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_105_1.png)


    Figure 8-20. Closing a Window for KDE and GNOME


    If you click on this button, you simply stop the running program; you terminate
    it, you quit it. This button is called the “close button-ton”.


    # 8.3.3. Personalizing Your Desktop


    A lot of things can be changed under both KDE and GNOME to suit your personal
    taste, like the background, the windows and background colors, the “themes”, the
    way windows and icons behave, etc.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Chapter 8. Linux for Beginners


    If you are under KDE, please refer to Desktop Personalization, page 92. If you
    are under GNOME please refer to "Using GNOME", page 105 for more information about
    how to customize your desktop.


    # 8.3.4. Accessing Programs


    You may be wondering how to access all the software you installed during the installation
    process. This is rather easy. On the left of the tool bar, you can see a big icon
    like this:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_106_0.png)


    Figure 8-21. Software Menu for KDE and GNOME


    Just click on this icon (slightly different whether you work with KDE or GNOME)
    and you will see a pull-up menu listing the programs you can run. They are organized
    by categories, so finding the program you are looking for is easy.


    We explore a few more items in the next chapter.'
  merge: -1
