- pgno: 154
  md: '# Chapter 11. Everyday Applications


    # 11.2. File Managers


    # 11.2.1. Konqueror: the File Manager


    To manipulate your personal files, KDE offers Konqueror. To launch it, click on
    the icon in the tool bar. You can also find it on the desktop.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_154_0.png)


    Figure 11-13. Konqueror: the File Manager under KDE


    The left side of the window shows your files in a tree structure, while the right
    side displays the current folder''s contents (when you launch Konqueror, the default
    folder is your home directory). Each file or sub-directory is represented by an
    icon. You can always set the folder''s full path in the URL line on top of the
    window.


    > Note: Small precision: in this book, we use indifferently the terms folder and
    directory. These two terms refer to the same thing, that is a file holder, even
    a... folder or directory holder.


    In the example mentioned above, you notice the recognized file types have specific
    icons associated to them. Hence, Mail and temp are folders.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Chapter 11. Everyday Applications


    Konqueror does not always recognize the file type. In that case, the file is represented
    with this icon.


    # 11.2.1.1. Folders on the Left of your Konqueror Window


    The folders on the left of your Konqueror window are:


    Home Directory


    The folder in which you organize your work. Each user possesses one and, normally,
    he he he can access it. This folder is designed on the desktop as Queen''s home.


    Root Folder


    This folder is at the base of the tree structure: all other folders are directly
    or indirectly held by the root folder. In principle, only the system administrator
    should manipulate that folder.


    History


    Here, you find the system folders and Internet sites you visit frequently (since
    Konqueror has “two faces”).


    Network


    If you are in a local network environment, the files shared by the other computers
    on the network should be displayed here.


    Bookmarks


    Here are listed the places you visit the most often, whether it be system folders
    or Internet sites.


    # 11.2.1.2. The Tool Bar


    Konqueror''s tool bar offers numerous features which are easy to access. Here
    they are, along with their associated icons.'
