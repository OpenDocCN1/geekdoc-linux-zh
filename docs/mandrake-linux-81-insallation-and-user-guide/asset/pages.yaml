- pgno: 67
  md: '# Chapter 5. Installation with DrakX


    self. That account where you should log in for routine use. Although it is very
    practical to log in as root everyday, it may also be very dangerous! The slightest
    mistake could mean that your system would not work any more. If you make a serious
    mistake as a regular user, you may only lose some information, but not the entire
    system.


    First, you have to enter your real name. This is not mandatory, of course - as
    you can actually enter whatever you want. DrakX will then take the first word
    you have entered in the box and bring it over to the User name. This is the name
    this particular user will use to log into the system. You can change it. You then
    will have to enter a password here. A non-privileged (regular) user''s password
    is not as crucial as that of root from a security point of view, but that is no
    reason to neglect it - after all, your files are at risk.


    If you click on Accept user, you can then add as many as you want. Add a user
    for each one of your friends: your father or your sister, for example. When you
    finish adding all the users you want, select Done.


    > Tip: Clicking the Advanced button allows you to change the default shell for
