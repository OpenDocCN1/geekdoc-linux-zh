    null, character the character or byte number 0, it is used to mark the end of
    a string.


    object code is the code generated by the compilation process to be linked with
    other object codes and libraries to form an executable file. Object code is machine
    readable. See Also: compilation, linkage.


    on the fly Something is said to be done "on the fly" when it''s done along with
    something else, without you noticing it or explicitly asking for it.


    open source is the name given to free source code of a program that is made available
    to development community and public at large. The theory behind this is that allowing
    source code to be used and modified by a broader group of programmers will ultimately
    produce a more useful product for everyone. Some popular open source programs
    include Apache, sendmail and GNU/Linux.


    operating system is the interface between the applications and the underlying
    hardware. The tasks for any operating system are primarily to manage all of the
    machine specific resources. A GNU/Linux system, this is done by the kernel and
    loadable modules. Other well-known operating systems include AmigaOS, macOS, FreeBSD,
    OS/2, Unix, Windows NT, and Windows 9x.


    owner in the context of users and their files, the owner of a file is the user
    who created that file.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Glossary


    # owner group


    in the context of groups and their files, the owner group of a file is the group
    to which the user who created that file belongs to.


    # pager


    program displaying a text file one screenful at a time, and making it easy to
    move back and forth and search for strings in this file. We advise you to use
    less.


    # password


    is a secret word or combination of words or letters that is used to secure something.
    Passwords are used in conjunction with user logins to multi-user operating systems,
    web sites, FTP sites, and so forth. Passwords should be hard-to-guess phrases
    or alphanumeric combinations, and should never be based on common dictionary words.
    Passwords ensure that other people cannot log into a computer or site with your
    account.


    # patch, to patch


    file holding a list of corrections to issue to a source code in order to add new
    features


    # path


    is an assignment for files and directories to the filesystem. The different layers
    of a path are separated by the "slash" or ''/'' character. There are two types
    of paths on GNU/Linux systems. The relative path is the position of a file or
    directory in relation to the current directory. The absolute path is the position
    of a file or directory in relation to the root directory.


    # pipe


    a special Unix file type. One program writes data into the pipe, and another program
    reads the data at the other end. Unix pipes are FIFOs, so the data is read at
    the other end in the order it was sent. Very widely used with the shell. See also
    named pipe.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Glossary


    # pixmap

    is an acronym for “pixel map”. It’s another way of referring to bitmapped images.


    # plugin


    add-on program used to display or play some multimedia content found on a web
    document. It can usually be easily downloaded if your browser is not yet able
    to display or play that kind of information.


    # porting


    a program is translating that program in such a way that it can be used in a system
    it was not originally intended for, or it can be used in “similar” systems. For
    example, to be able to run a Windows-native program under GNU/Linux (natively),
    it must first be ported to GNU/Linux.


    # precedence


    dictates the order of evaluation of operands in an expression. For example: If
    you have 4 + 3 * 2 you get 10 as the result, since the product has more precedence
    than the addition. If you want to evaluate the addition first, then you have add
    parenthesis like (4 + 3) * 2, and you get 14 as the result since the parenthesis
    have more precedence than the addition and the product, so the operations in parenthesis
    get evaluated first.


    # preprocessors


    are compilation directives that instruct the compiler to replace those directives
    for code in the programming language used in the source file. Examples of C’s
    preprocessors are #include, #define, etc.


    # process


    in the operating system context, a process is an instance of a program being executed
    along with its environment.


    # prompt


    in a shell, this is the string before the cursor. When you see it, you can type
    your commands.


    # protocol


    Protocols organize the communication between machines across a network, either
    using hardware or software. They define the format of transferred data, whether'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Glossary


    one machine controls another, etc. Many well-known protocols include HTTP, FTP,
    TCP, and UDP.


    # proxy


    a machine which sits between a network and the Internet, whose role is to speed
    up data transfers for the most widely used protocols (HTTP and FTP, for example).
    It maintains a cache of previous demands, which avoids the cost of asking for
    the file again if another machine asks for the same thing. Proxies are very useful
    on low bandwidth networks (such as modem connections). Sometimes the proxy is
    the only machine able to access outside the network.


    # pulldown menu


    it is a menu that is “rolled” with a button in some of its corners. When you press
    that button, the menu “unrolls” itself showing the full menu.


    # quota


    is a method for restricting disk usage and limits for users. Administrators can
    restrict the size of home directories by a user by setting quota limits on specific
    filesystems.


    # read-only mode


    is a file means that the file cannot be written to. You can read its contents
    but you can’t modify them.

    See Also: read-write mode.


    # read-write mode


    for a file, it means that the file can be written to. You can read its contents
    and modify them.

    See Also: read-only mode.


    # regular expression


    a powerful theoretical tool which is used to search and match text strings. It
    lets one specify patterns that must obey. Many Unix utilities use it: sed, awk,
    grep, perl among others.


    # root


    is the superuser of any Unix system. Typically root (aka the system administrator)
    is the person responsible for maintaining and supervising the Unix system. This
    person also has complete access to everything on the system.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Glossary


    # root directory


    This is the top level directory of a filesystem. This directory has no parent
    directory, thus ''..'' for root points back to itself. The root directory is written
    as ''/''.


    # root filesystem


    This is the top level filesystem. This is the filesystem where GNU/Linux mounts
    its root directory tree. It is necessary for the root filesystem to reside in
    a partition of its own, as it is the basis for the whole system. It holds the
    root directory.


    # route


    Is the path that your datagrams take through the network to reach their destination.
    Is the path between one machine and another in a network.


    # run level


    is a configuration of the system software that only allows certain selected processes
    to exist. Allowed processes are defined, for each runlevel, in the file /etc/inittab.
    There are eight defined runlevels: 0, 1, 2, 3, 4, 5, 6, S and switching among
    them can only be achieved by a privileged user by means of executing the commands
    init and telinit.


    # script


    shell scripts are sequences of commands to be executed as if they were entered
    in the console one after the other. shell scripts are Unix''s (somewhat) equivalent
    of DOS batch files.


    # security levels


    Mandrake Linux''s unique feature that allows you to set different levels of restrictions
    according to how secure you want to make your system. There are 6 predefined levels
    ranging from 0 to 5, where 5 is the tightest security. You can also define your
    own security level.


    # server


    program or computer that provides a feature or service and awaits the connections
    from clients to execute their orders or give them the information they ask. In
    the case of peer to peer systems such as slip or ppp the server is taken to be
    the end of the link that is called and the end calling is taken to be the client.
    It is one of the components of a client/server system.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Glossary


    shadow passwords

    a password management suite on Unix systems in which the file containing the encrypted
    passwords is not world-readable, whereas it is when using the normal password
    system. It also offers other features such as password aging.


    # shell


    the shell is the basic interface to the operating system kernel and is what provides
    the command line where users enter to run programs and system commands. All shells
    provide a scripting language which can be used to automate tasks or simplify often-used
    complex tasks. The shell scripts are similar to batch files from the DOS operating
    system, but are much more powerful. Some example shells are bash, sh, and tash.


    # single user


    is used to describe a state of an operating system, or even an operating system
    itself, that only allows a single user to log into and use the system at any time.


    # site dependent


    means the information used by programs like make and make to compile some source
    file depends on the site, the computer architecture, the computer’s installed
    libraries, and so on.


    # socket


    file type corresponding to any network connection.


    # soft links


    see “symbolic links”.


    # standard error


    the file descriptor number 2, opened by every process, used by convention to print
    error messages to the terminal screen by default.

    See Also: standard input, standard output.


    # standard input


    the file descriptor number 0, opened by every process, used by convention as the
    file descriptor from which the process receives data.

    See Also: standard error, standard output.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Glossary


    standard output

    the file descriptor number 1, opened by every process, used

    by convention as the file descriptor in which the process

    prints its output.

    See Also: standard error, standard input.


    streamer

    is a device that takes “streams” (not interrupted or divided

    in shorter chunks) of characters as its input. A typical strea-

    mer is a tape drive.


    switch

    Switches are used to change the behavior of programs, and

    are also called command-line options or arguments. To de-

    termine if a program has optional switches that can be used,

    read the man pages or try to pass the -help switch to the

    program (ie. program -help).


    symbolic links

    special files, containing nothing but a string that makes re-

    ference to another file. Any access to them is the same as ac-\ccessing the file
    whose name is the referenced string, which

    may may not exist, and the path to which can be given

    in a relative or an absolute way.


    target

    is the object of compilation, i.e. the binary file to be genera-

    ted by the compiler.


    telnet

    creates a connection to a remote host and allows you to log

    to the machine, provided you have an account. Telnet is

    the most widely-used method of remote logins, however

    there are better and more secure alternatives, ssh.


    theme-able

    a graphical application is theme-able if it is able to change

    a appearance in real time. Many window managers are

    theme-able as well.


    traverse

    for a directory on a Unix system, this means that the user is

    allowed to go through this directory, and possibly to direc-

    tories under it. This requires that the user has the execute

    permission on this directory.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Glossary


    # username


    is a name (or more generally a word) that identifies a user in a system. Each
    username is attached to a unique and single UID (user ID)

    See Also: login.


    # variables


    are strings that are used in Makefile files to be replaced by their value each
    time they appear. Usual they are set at the beginning of the Makefile. They are
    used to simplify Makefile and source files tree management.

    More generally, variables in programming, are words that refer to other entities
    (numbers, strings, tables, etc.) that are likely to vary while the program is
    executing.


    # verbose


    For commands, the verbose mode means that the command reports to standard (or
    possibly error) output all the actions it performs and the results of those actions.
    Sometimes, commands have a way to define the “verbosity level”, which means that
    the amount of information that the command will report can be controlled.


    # virtual console


    is the name given to what used to be called terminals. On GNU/Linux systems, you
    have what are virtual consoles which enable you to use one screen or monitor for
    many independently running sessions. By default, you have six virtual consoles
    which can be reached by pressing ALT-F1 through ALT-F6. There is a seventh virtual
    console by default, ALT-F7, which will permit you to reach a running Window System.
    In X, you can reach the text console by pressing CTRL-F1 through CTRL-ALT-F6.

    See Also: console.


    # virtual desktops


    In the Window System, the window manager may provide you several desktops. This
    handy feature allows you to organize your windows, avoiding the problem of having
    dozens of them stacked on top of each other. It works if you had several screens.
    You can switch from one virtual desktop to another in a manner that depends on
    the window manager you''re using.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# wildcard


    The ''*'' and ''?'' characters are used as wildcard characters and can represent
    anything. The ''*'' represents any number of characters, including no characters.
    The ''?'' represents exactly one character. Wildcards are often used in regular
    expressions.


    # window


    In networking, the window is the largest amount of data that the receiving end
    can accept at a given point in time.


    # window manager


    the program responsible for the “look and feel” of a graphical environment, dealing
    with window bars, frames, buttons, root menus, and some keyboard shortcuts. Without
    it, it would be hard or impossible to have virtual desktops, to resize windows
    on the fly, to move them around, ...'
  merge: -1
  img_proc: true
