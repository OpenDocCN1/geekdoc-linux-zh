    Figure 11-45. Make your Messages Look Good!


    # 11.3.1.6. Copies and Folders


    This feature allows you to send "blind-carbon copies" (or Blind Carbon Copy) to
    whoever you like. For instance, you might want to send yourself all the e-mails
    you send out instead of having them accumulate in your sent directory.'
