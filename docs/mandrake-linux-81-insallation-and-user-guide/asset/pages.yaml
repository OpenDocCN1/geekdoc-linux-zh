- pgno: 212
  md: '# Chapter 13. Securing Your Machine


    Mandrake Linux ships the Bastille security tools suite. It is a set of two tools
    — one for basic configuration, and one allowing complex settings, which should
    make your machine much more secure. It is highly recommended that you run one
    of those tools just after installing your machine, and even before connecting
    it to the network.


    # 13.1. Easy Configuration


    The BastilleChooser tool allows inexperienced users to easily secure their machine,
    while not imposing too many constraints on the daily use of the machine. The tool
    is a little wizard whose steps we are now going to describe. To launch it, you
    need to run the command BastilleChooser from a Terminal as root. It is part of
    the Bastille-Chooser RPM package.


    +   1. Introduction (figure 13-1): Click Next to go to first step, Cancel to abort
    the wizard.


    | Bastille Premade-Configuration Chooser |

    | This quick tool will run Bastille Linux on this machine using a pre-written
    configuration. If you have a desire to learn about and personalize your system
    security, along with 20-40 minutes of spare time, please press the Cancel button
    and run ''InteractiveBastille'' from the shell prompt |

    | Next | Cancel |


    **Figure 13-1. Introduction to the BastilleChooser wizard**


    +   2. You can see figure 13-2 the first step to using the wizard to select the
    level of security to be applied to your machine.'
  merge: -1
  img_proc: true
