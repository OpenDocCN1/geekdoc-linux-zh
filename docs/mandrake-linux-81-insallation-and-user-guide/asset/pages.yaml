  md: '# Glossary


    # editor


    is a term typically used for programs that edit text files (aka text editor).
    The most well-known GNU/Linux editors are GNU Emacs (Emacs) editor and the Unix
    editor Vi.


    # email


    stands for Electronic Mail. This is a way to send messages electronically between
    people on the same network. Similar to regular mail (aka snail mail), email needs
    a destination and sender address to be sent properly. The sender must have an
    address like "sender@senders.domain" and the recipient must have an address like
    "recipient@recipients.domain." Email is a fast method of communication and typically
    reaches anyone, regardless of where in the world they are located. In order to
    write email, you need an email client like pine or mut which are text-mode clients,
    or GUI clients like kmail.


    # environment


    is the execution context of a process. It includes all the information that the
    operating system needs to manage the process and what the processor needs to execute
    the process properly.

    See Also: process.


    # environment variables


    a part of a process'' environment. Environment variables are directly viewable
    from the shell.

    See Also: process.


    # escape


    in the shell context, is the action of surrounding some string between quotes
    to prevent the shell from interpreting that string. For example, when you need
    to use spaces in some command line and pipe the results to some other command
    you have to put the first command between quotes ("escape" the command) otherwise
    the shell will interpret it wrong and won''t work as expected.


    # filesystem


    scheme to store files on a physical media (hard drive, floppy) FAT, GNU/Linux''
    ext2fs, iso9660 (used by CD-ROMs) and so on. An example of a virtual filesystem
    is the /proc-filesystem.'
