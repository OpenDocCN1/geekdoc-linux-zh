  md: '# Chapter 12. Configuring Internet Connections


    ![](img/44017b5ddbff38ec085831b3cde64d5d_207_0.png)


    Figure 12-4. Always bring up the connection at boot time?


    You are then asked whether you want to automatically bring the Internet connection
    up at each boot time. Choose Yes only for flat rate Internet connections like
    DSL.'
