  - '[PAGE 150]


    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_150_0.png)


    Figure 11-8. Find your Files with StarOffice Explorer


    Insert Menu


    This menu holds very practical features such as Manual Break, Headers & Footers
    and the Indexes. The first one is often used when you prepare documents in which
    you want the sections to start at the top of a page, not halfway through. Note
    that Ctrl+Enter gives you the same result. The Headers & Footers option avoids
    repeating the same document title at the beginning or end of a document, which
    is, you will admit, tedious to say the least. When you are responsible for medium-to-large
    documents, you might want to index them and create a table of contents, which
    you can create through the index sub-menu.'
  - '[PAGE 151]


    # Chapter 11. Everyday Applications


    **Note:** To insert tables, files or infages, this is the menu. Alt+I and the
    t character pops up a dialog window in which you choose the number of table rows
    and columns you wish to insert.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_151_0.png)


    Figure 11-9. Create Tables for your Documents


    # Format Menu


    This menu contains essential formatting features, such as Character, Page and
    Paragraph. The first one applies font, style and size parameters, amongst others,
    to your document. Click on the different tabs and you will find font effects,
    hyperlinks and background features. In the Paragraph sub-menu, you determine background
    colors, indent and spacing, tabs. The Page sub-menu, as its name clearly states,
    allows general and more advanced page formatting.


    # Tools Menu


    A writer’s best friends reside in this menu: Spellcheck, Thesaurus and Options.
    When you select the Spellcheck option (or F7), you launch a corrector which indicates
    what words are badly spelled. Note that the language must properly be set before
    correcting a document. The changes, if necessary (i.e.: you want to correct an
    English document but the French dictionary is active: mission impossible). As
    for the Thesaurus option, it also pops a window from which you can select same-family
    words or even synonyms.'
  - '[PAGE 152]


    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_152_0.png)


    Figure 11-10. Spellchecking Documents


    The Options menu, however, is the most important personalization tool. There,
    you can set the correct paths for opening directories directly instead of having
    to browse your entire tree to find a file.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_152_1.png)


    Figure 11-11. StarOffice Options


    # Windows Menu


    This one lets you organize your document windows like you desire, either in cascade
    fashion, vertically or horizontally setting next to the other.


    129'
