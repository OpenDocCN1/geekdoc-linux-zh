    Figure 10-2. GNOME Panel


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_1.png)


    As you can see in the figure, essential applets and programs are included in the
    panel. Starting on the left-hand side is the GNOME menu, where all your applications
    (whether text editors, multimedia or games) lie.


    **Note:** If you wish to add programs or applets to your panel, simply go in the
    GNOME menu, select the desired application and right-click on it. A pop-up menu
    will show an Add this launcher to panel item. Release your mouse on that message
    and the program/applet will be added to your panel.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_2.png)


    Next to it is the Log-Out Applet. It allows you to log out of your session, either
    because you are leaving work, or to let other users utilize the computer, etc.
    Now, the word "session" may bewilder you. A session is the length of time contained
    between the moment you log in and log out. If you click on it, it will prompt
    you to save the changes you made to your session (or simply log out if you configure
    properly in the GNOME Control Center, which we will discuss later on) and a box
    holding all the computers'' users (root, your_user_name, etc.) will appear after
    the X server restarts.'
