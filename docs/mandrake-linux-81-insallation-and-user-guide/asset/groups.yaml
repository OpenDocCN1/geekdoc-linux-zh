    # # Chapter 3. Before setup


    # The BIOS (Basic Input/Output System) is used to boot up a computer. Specifically,
    it is used to find the device on which the operating system is located and start
    it up. It is also used for the initial configuration of the hardware.


    The appearance of *plug''n''play* and its widespread use means that all modern
    BIOS can initialize these devices, but you still have to ask it to do so. If your
    Windows 9x OS is initializing these devices instead of the BIOS, this will need
    to be changed for use GNU/Linux.


    Changing your BIOS settings is usually performed by holding the DEL key after
    the computer is switched on. Unfortunately, there are many types of BIOS, therefore
    you will have to look for the appropriate option for yourself. The option to look
    for is often called PNP OS installed (or Plug''n''Play OS installed). Set this
    option to No and the BIOS will then initialize any plug''n''play devices. This
    can help GNU/Linux recognize devices in your machine which it would otherwise
    be able to initialize.


    If your BIOS can boot from the CD-ROM and you want to perform a standard installation
    of Mandrake Linux, you can also set your BIOS to boot from the CD-ROM searching
    the hard disk. Look for Boot sequence in the BIOS features setup.


    > Note: If you want to use a printer connected to your machine: make sure that
    the parallel port mode is set to ECP+EPP (or least one of them) If it''s not set
    this way, you will still be able to print, but your printer will not be auto-detected
    so you will have to configure it by hand. Also make sure that the printer is powered-on
    and properly connected to your machine beforehand.


    # ## 3.2. Creating a “boot-disk”


    If you cannot boot from the CD-ROM, and if Windows is not installed on your computer,
    you will need to create a “boot-disk”.'
  - '[PAGE 29]


    # Chapter 3. Before setup


    The CD-ROM contains all of the image files and utility programs needed. You will
    also need to create a “boot-disk” if you wish to use a boot-loader other than
    LILO or grub . If Windows is installed on your computer, you will not need a boot-disk,
    so you may skip this step and go on to “Installation with DrakX”, page 23.


    The boot images are in the images directory on the CD-ROM. For this method of
    installation, the significant file is named cdrom.


    We use the image cdrom.img when you install the distribution from a CD-ROM. However,
    many other images are available to perform installs:


    +   * cdrom.img: to install from a local IDE or SCSI CD-ROM drive. This has to
    be used in case you cannot boot computer directly from the CD-ROM, by changing
    BIOS settings.

    * network.img: to install from a NFS, FTP, HTTP repository. The network configuration
    of the machine to be installed may be manual or automatic.

    * pcmia.img: if the installation media is reached through a PCMCIA card (network,
    CD-ROM, ...)

    * hd.img: use this image in the case where you were not able to perform the install
    from a CD-ROM. You just need to copy the content of the CD onto the hard drive
    (either on a FAT ext2fs or reiserfs partition), and with the floppy containing
    that

    * usnet.img: this image allows you to perform a network installation, but through
    a USB port.

    * other.img: this installation image provides less common drivers such as NET
    and SCSI drivers. Try this image if the others failed.


    # 3.2.1. Under Windows


    You need to use the program called rawwrite. This can be found on the CD-ROM dosutils
    directory (figure 3-1).'
