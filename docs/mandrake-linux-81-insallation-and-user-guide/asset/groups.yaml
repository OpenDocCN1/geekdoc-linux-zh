    ## 9.4. Desktop Personalization


    ### 9.4.1. Creating Icons


    To create an icon, simply click on the desktop’s background. A pull-down menu
    will appear, in which you must choose Create from a Template. Another menu will
    pull down in which will be listed the objects you can create on your desktop:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_116_0.png)


    Figure 9-4. Creation Menu Under KDE


    #### 9.4.1.1. Icons Pointing Towards a File or Folder


    As you can see, you can create directories, many types of files... In fact, it
    is not recommended to create files or directories on a desktop: it is much more
    preferable to create them in the normal manner, that is from an an appropriate
    program.


    You can create a desktop icon by pointing at a folder or a file and simply *dragging*
    the icon from the file manager onto the desktop. This technique is detailed in
    the *Copying, Moving or Linking Files*, page 139, dedicated to *Konqueror*, the
    file manager.


    #### 9.4.1.2. Icons Pointing Towards Applications


    We will now create an icon pointing towards an application. In the Create from
    a Template menu, choose Application. This dialog box appears:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_117_0.png)


    Figure 9-5. Creating an Application Under KDE


    | General | Permissions | Application |

    | :--- | :--- | :--- |

    | Command: | | Browse... |

    | Window Title: | | |

    | Run in terminal Options: | | |

    | Run as a user Username: | | |


