    Executable and Linking Format. This is the binary format used by most *GNU/Linux*
    distributions nowadays.


    # ext2


    short for the “Extended 2 filesystem”. *GNU/Linux* native filesystem and has all
    characteristics of any *Unix* filesystem: support for special files (character
    devices, symbolic links...), file permissions and ownership, and so on.'
