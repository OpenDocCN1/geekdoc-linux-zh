    # 第 15 章 包管理


    ![](img/44017b5ddbff38ec085831b3cde64d5d_283_0.png)


    图 15-6. 卸载软件包


    完成后，点击与你之前安装包时相同的按钮。RpmDrake 窗口将由另一个向导程序取代，它会提示你（至少）将移除另一个包，在我们的示例中是 emacs-pcomplete。这是很合理的：我们之前被告诉过，emacs
    是 emacs-pcomplete 运行所必需的。如果我们删除了 emacs，那么 emacs-pcomplete 将无法再次工作，因此我们也应该将其删除——以保持整个系统的的一致性。


    此时，如果你点击“下一步”（Next），软件包将从你的系统中移除。请注意，如果你最终想使用它们，仍然可以重新安装……只需点击“退出”（Quit）返回 RpmDrake。


    ## 15.4. 源管理


    源是包仓库，你可以在其中找到安装到你的 Mandrake Linux 上的软件包。它可以是你硬盘上的本地目录、CD-ROM，甚至是网络上的某个远程目录——例如，互联网。总有一个特殊定义的源：即你安装系统时的源。现在我们将探索源管理。


    ### 15.4.1. 添加源


    假设你发现了一个包含大量软件包的精彩 CD-ROM，或者网络上的一个目录。这显然是一个新的包源，你想在 RpmDrake 中使用它，不是吗？那么你必须点击“定义”（Define）来定义新源。在弹出窗口中，点击“新建”（New）来定义新源。你会看到以下对话框：


    | 源类型 | 可移除 |

    | :--- | :--- |

    | 新源名称： | |

    | 设备名称： | |

    | 挂载点： | /mnt/cdrom |


    图 15-7. 在 RpmDrake 中添加源


    在任何情况下，你都必须为你的源命名：：此名称将用于以后识别该源。你可以定义几种不同的类型，例如：


    - 可移除（Removable）。这是 CD-ROM、ZIP 等源的通用名称。你必须告诉 RpmDrake 适当的设备（即哪个驱动器）及其相应的挂载点。

    - 本地（Local）。如果你的计算机目录中包含软件包，你可以在此处“注册”它们。只需提供完整的绝对路径即可。

    - FTP 或 HTTP。这些类型用于远程仓库。在这两种情况下，你都必须根据类型提供完整的远程 URL，以 ftp:// 或 http:// 开头。还要提供
    mdlist 路径，它包含了对之前给定路径可用内容的简要描述。一个典型的例子是 `../base/mdlist`。这意味着你只能使用存在 mdlist 的“符合
    Mandrake 标准”的远程仓库。 如果不确定，请询问远程网站的管理员。唯一的区别是，你必须为 FTP 源提供用户名和密码。

    - 安全更新（Security Updates）。这描述了远程仓库（如 FTP 和 HTTP），你可以在其中找到与安全问题相关的软件包更新。你应该使用受信的镜像来进行：点击“更新列表”（Update
    lists）按钮将为你列出受信的镜像列表，尝试使用距离尽可能近的一个。请注意，如果镜像使用 FTP 协议，你可能需要提供用户名和密码。

    - 尝鲜（Cook）。这些软件包提供给想要密切关注软件演进的人：它们是最新的发布版本。所以，请清楚自己在做什么！这些软件包大多是开发类型，因此容易出现不稳定。这些仓库的工作原理与安全更新类似。


    ### 15.4.2. 更新源和软件包


    源中包含的软件包可能会发生变化，特别是如果它不是 CD-ROM：某些 RPM 文件可能会被删除或添加。为了保持内部数据库与各种源的实际状态同步，有必要更新它们（源）。你可以点击“重新加载列表”（Reload
    lists）按钮非常轻松地完成此操作。但注意，这可能需要很长时间：每个软件包都会被检查是否需要更新，并重新计算依赖关系以反映更改。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_285_0.png)


    现在假设某个源的内容发生了变化。通常意味着某些软件包被添加或更改了：当“旧”版本存在 Bug 或不安全时，或者仅仅因为有了新的、更好的发布版本时，软件包就会发生更改。由于缺乏可用的更新包，你的系统中可能仍安装了一些旧软件包。


    因此，在更新源之后，你有机会更新系统中已安装的某些软件包，并利用各种新发布版本：你可以在“可安装列表”（Installable list）中看到它们：它们以不同的颜色显示。只需选择并安装它们，无需多说，我们强烈建议你这样做……


    ## 15.5. 更新你的系统


    有一种简单的方法可以使用最新的可用软件发布版本更新你的整个系统：它就是 MandrakeUpdate。此工具将查询已知且受信的仓库，然后列出可用的新包。要启动
    MandrakeUpdate 向导，请点击 RpmDrake 工具栏上的按钮。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_286_0.png)


    请选择你想执行的更新类型：


    字体 错误修复（bugfixes）

    - 普通更新（normal updates）

    - 安全更新（security updates）


    图 15-8. MandrakeUpdate 中的更新类型


    首先，你需要在以下类型中选择你需要的类型：


    - 错误修复（bugfixes）。这些更新与软件的行为异常有关。如果你的某些工具工作不正常，选择此项，你可能会发现修复该问题的更新。

    - 普通更新（normal updates）。仅仅是软件包的新发布版本，带有新功能。

    - 安全更新（security updates）。这些更新与安全有关，即防止黑客未经授权访问你的系统。我们强烈建议始终检查这些更新，即使你并不终身生活在网络上。


    你随后会得到一个与 RpmDrake 窗口类似的窗口。可用的更新会被列出来，你只需要勾选你想要的。选择任何在下方熟悉的、带有三个标签页的框中显示了其信息的更新。当你选择了一些更新后，点击“下一步”（Next）：安装向导程序将启动。


    如果你感兴趣，可以在此页面查看 MandrakeUpdate 使用的镜像列表：http://www.mandrakux.com/mirrorsfull.list
    (http://www.mandrakux.com/mirrorsfull.list)。


    '
