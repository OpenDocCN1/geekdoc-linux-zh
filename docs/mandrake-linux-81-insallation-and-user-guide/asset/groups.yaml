    # Chapter 11. Everyday Applications


    ## 11.4. Multimedia Center


    If you cannot live without your MP3, this section is for you :-) Here we explore
    the wonderful world of multimedia, especially XMMS and the various multimedia
    tools available under your Mandrake Linux distribution.


    ### 11.4.1. Using XMMS


    First off, XMMS stands for "X Multimedia System". With it, you can play a variety
    of audio sources, such as regular music CDs and MP3s. And one of the hottest features
    of XMMS is you can change its "skin", that is the way it looks. Let us start with
    the basics.


    > Note: We assume that you have used a CD-ROM player before we will not describe
    the play, rewind, et c. keys.


    First, to launch XMMS, go in your KDE or GNOME menu and choose Multimedia+Sound→XMMS.
    You can also create a desktop link as previously described. For command-line aficionados,
    simply type xmms &`.


    The main menu you will certainly use is the Options one. To access it, right-click
    on the main window. On the same main window, you can select the EQ button which
    pops a little equalizer you can adjust to your liking. The PL button stands for
    "play list", that is the songs you wish to listen to.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_199_0.png)


    Figure 11-56. XMMS Main Window with Equalizer and Playlist


    Note: As you can see in the latter figure, we chose the Chaos skin (look at the
    title bar), but you may choose one of several skins by right-clicking on the main
    XMMS window and choosing Options+Skins and a pop-up window will appear (you can
    also access it with Alt-S). It includes all available skins (usually, the skins
    path is /home/your_user_name/.xmms/Skins). If you wish to download other skins,
    check out XMMS Site (http://www.xmms.org/).


    Now, to listen to music, you must add the files in your playlist. You can do this
    with several means: right-clicking on the play button pops up your files’ tree
    where you select the ones you crave to ear, either as files, directories or URLs.
    You can also access your files through the playlist by clicking the add button
    and choosing dir (directory) or URL. To delete files, simple, except you click
    on the sub button.


    If you select the misc button, you can sort your playlist as you like: precise
    choice of songs, etc. Speaking about playlists, you may want to save a series
    of songs particularly prefer. To do so, select the list button on the playlist
    and choose save or new if you want to listen to an already fixed playlist.


    As stated earlier, the Options menu is the most interesting one for daily use.
    In it, try a couple of features such as Sticky (Ctrl-S), which sticks your XMMS
    player in every desktop. Therefore, you can access it anywhere. If you feel the
    player is too small, you can double its size (Ctrl-D), you may choose Remaining
    or Elapsed Time, etc feel free to personalize the way you want, there are too
    many possibilities for us to go into detail.


    The preferences sub-menu of the Options menu is, however, the most important.
    In fact, if your preferences are not chosen, it will be impossible to listen to
    your music. First, check out that you selected the region.


    Finally, two keyboard shortcuts you will surely like: for a song or a selection
    of songs to repeat, simply click the r character while your mouse is on the main
    XMMS window. For song shuffling, simply click on s.


    ### 11.4.2. The Gimp


    First of all, if you never heard about GIMP, you probably wonder what it stands
    for: GNU Image Program. There you now. This is probably the most complex of the
    basic tools. A note of advice: many tutorials exist on the web (on the GIMP’s
    site at www.gimp.org (http://www.gimp.org/)) and the excellent Grokking The Gimp
    book written by Carey Bunk and published at New Riders. However, here are a few
    simple features.


    To start up, go in your KDE or GNOME menu and select Multimedia→Graphics→The GIMP.
    You can also create a desktop link as previously described (StarOffice, page 119).
    In a Terminal, just type gimp &`.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_201_0.png)


    Figure 11-57. THE Image Manipulator


    As you can see, the window is rather small, but do not be fooled by its size:
    you will be surprised of its powers! First, check out the main window. If you
    put your mouse cursor on each picture, a pop-up menu will tell you what you are
    pointing at. All your main options are contained in this window.


    Now you might wonder how to do simple operations such as Save or open the Layout
    window. Most of GIMP’s options are obtained by right-clicking on a dialog (or
    window).


    Note: If you use the GIF format for your images, you must first convert your images
    to indexed colors (see Image→Mode).


    Let us check out the layers. GIMP essentially works with numerous layers. So take
    any image and create a new layer. You can then change the colors as well as the
    overall look of the image.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_202_0.png)


    Figure 11-58. GIMP Layers


    Well, that''s all we are squeezing in for the moment. Be sure to check out those
    GIMP tutorials


    ## 12. Configuring Internet Connections


    Your Mandrake Linux system contains a tool which allows easy Internet configuration.
    It also helps you to connect to the Internet in a few different ways. To launch
    it, first open Control Center and click on Network & Internet, then on Connection.
    Here is a look at the main interface (figure 12-1):


    ![](img/44017b5ddbff38ec085831b3cde64d5d_204_0.png)


    Figure 12-1. Connecting to the Internet


    - Profile combo box: if your machine is likely to be connected to different environments
    (typically a laptop moving from modem connection at home from LAN at the office),
    you can choose here the correct profile.

    - Del profile: to suppress the selected profile.

    - New profile: to create a new connection profile. You will then have to configure
    it with the connection wizard.

    - Disconnect or Connect button: for non-permanent accesses, allows you to control
    the state of your connection.

    - Configure: launch the configuration wizard described below.

    - Expert Mode: non documented, allows to configure access without using the wizard.

    - OK: validates choices and exits the application.

    - Apply: validates choices without exiting the application.

    - Cancel: exits the application and discards all modifications.


    Here are some words about the Internet access configuration wizard. You will get
    a screen asking whether you wish to detect interfaces (say no if you notice any
    problem after clicking on yes), and then the list of available connection types.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_205_0.png)


    Figure 12-2. Choosing the Internet Connections to configure


    You will be then presented with a list of detected devices (figure 12-1) where
    you can check the box(es) corresponding to the connection types you wish to configure.
    Click then OK, and you will go to the configuration dialog.

