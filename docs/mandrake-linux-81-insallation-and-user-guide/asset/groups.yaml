    (http://www.iwillfollow.com/email.htm) 也称为**网络礼仪 (Netiquette)**，其中包含一些宝贵的提示。如果你有空闲，你也可以考虑阅读相应的
    RFC (http://www.rfc-editor.org/js)。


    **注意：重要：** 记住始终保留你从邮件列表收到的第一封邮件，因为那里通常会告诉你如何取消订阅（如果你想这样做的话）。


    - 遵守适用于电子邮件的通用规则：特别是，不要**发送** HTML 消息：仅限文本。

    - 邮件列表通常有存档：去查查吧！你的问题可能在你订阅该列表之前就已经被讨论过了。

    - 兵自救，者天助。


    ## A.2.3. 新新闻组 (Newgroups)


    在新闻组上寻求帮助之前，建议先确认你的问题是否已经在 *DejaNews* (http://groups.google.com/googlegroups/deja_ann.html)
    上被涵盖（或解决），该网站已被 Google 收购。如果没有与你的查询相关的内容，可以访问这个完全致力于 **Mandrake Linux** 的新闻组 (news:alt.linux.mandrake)。或者，你也可以加入
    comp.os.linux.* “层级”中的许多其他组：


    - comp.os.linux.setup (news:comp.os.linux.setup):关于 Linux 配置（设备、应用程序配置）以及各种杂问题的解决。

    - comp.os.linux.misc (news:comp.os.linux.misc):任何不适合其他任何组的内容。

    - 以及其他……


    在发布到这些组之一之前，请确保你已经做了功课，并阅读了关于你特定问题的可用文档。如果你还没有这样做，你很可能会得到以下答案：RTFM（去读那该死的手册）。仅此而已！


    ## A.3. 在 Mandrake Linux 下解决问题的通用指南


    以下是你在解决问题过程中可以使用的不同方法。尝试第一个选项，只有当它不起作用时再尝试第二种，以此此类推。仅作为最后的手段，并且只有在其他方法都对你无效时，才开始考虑……把你的机器从窗户扔出去的可能性
    :-)


    ### A.3.1. RTFM


    “去读那该死的手册！”（我们没忍住，抱歉！）


    “手册”指的是那本手册以及该主题上所有相关的手册和文献。我们之前的章节为你提供了良好的起点。只有当所有这些资源都耗尽时，你才可能开始认为你确实遇到了一个真正的问题。


    ### A.3.2. 搜索互联网


    之前提到的各种网站是其他极佳的起点。它们处理了你潜在问题的通用和非常具体的方面。最后，尝试使用通用搜索引擎，如 Google (http://www.google.com)
    或者如上面提到的针对 Linux 的特定 (http://www.google.com/linux/) Google 搜索引擎。不要犹豫使用高级搜索 (http://www.google.com/advanced_search)
    选项。


    ### A.3.3. 邮件列表和新闻组存档


    之前的搜索可能会引导你找到通用答案，这些答案在许多其他结果中隐藏了你特定查询的结果。为了精炼你的搜索，你应该这样做：


    首先，尝试找到一个似乎与你的问题专门相关的列表，然后在它的存档页面中进行搜索。


    #### 示例


    你在尝试配合 minix 分区使用 grub 时注意到了一种奇怪的行为。


    在 Google 中使用 "grub mailing list" 关键词搜索，第四个结果指向了 GRUB 邮件列表 1999 年 7 月的存档消息 (http://mail.gnu.org/pipermail/bug-grub/1999-July/003129.html)。一旦你获得了存档根目录的
    URL：GRUB 邮件列表存档 (http://www.mail-archive.com/bug-grub%40gnu.org/)。它甚至建议了一个搜索引擎。因此，搜索
    "Minix" 将直接带你找到补丁。


    但注意，并非所有的存档都提供内置搜索引擎。不过，你可以轻松地使用该站点的字段返回结果，将搜索限制在托管存档的特定站点。


    对于新闻组搜索，这个参考资料 Dejanews (http://groups.google.com/googlegroups/deja_announcement.html)——已被
    Google 收购——拥有数量惊人的新闻组频道存档。


    ### A.3.4. 向邮件列表和新闻组提问


    参见上文的相关章节：邮件列表（第 270 页）和新闻组（第 271 页）。阅读《如何聪明地提问》(http://www.tuxedo.org/~esr/faqs/smart-questions.html)
    可能会有很大帮助。


    ### A.3.5. 直接联系负责人


    将此选项作为最后的手段，并仅在非常极端的情况下使用——除非你想提供合作！软件开发人员通常会收到海量的邮件。因此，你关于使用 `cd` 命令的痛苦提问可能会……被忽略！


    ## 附录 A. 在哪里获取文档


    地址可以在项目网站的主页或软件文档中找到。


    目前到这里就了！但最后说一句：不要低估你的邻居或当地 LUG（Linux 用户小组）的能力。并且，先不要把电脑扔出去。如果你的问题还没有解决，它将会……


