    Mailing lists still remain very popular in spite of the multiplication of other
    means of communication. Almost every piece of GNU/Linux software has its own mailing
    list geared towards users, developers, announcers, etc.


    The Mandrake Linux project has its own support lists (http://www.mandrakelinux.com/en/flists.php3).


