    ### 11.3.1.3. 新闻组服务器


    如果你理解了最后一段话，那么对于这种服务器，原理是类似的。你的互联网服务提供商（ISP）为你提供了一个类似的服务器名称，这次是用于新闻的。你也可以通过“文件→订阅”菜单订阅其他新闻组。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_187_0.png)


    ### 11.3.1.4. 地址簿


    “地址簿”子菜单非常有帮助，因为它允许你的邮件客户端识别撰写电子邮件的几个基本要素。如果你在输入名称时让邮件客户端在你的地址录中搜索，当有超过一个个人有相似的名字时（例如：John
    Smith 和 John Woods），它会自动为你提供用户选择。当你开始输入这些名字并想用 Tab 键完成输入时，你的邮件客户端会在这两个用户之间为你提供选择。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_188_0.png)


    图 11-44. 快捷处理你的电子邮件


    ### 11.3.1.5. 消息


    此子菜单允许在消息的外观上进行个性化设置。当你回复电子邮件时，你可以选择自动（或不自动）引用原始消息。然而，最好的功能是“自动换行”：你是否曾经尝试过阅读一封电子邮件却必须用鼠标指针水平滚动？那感觉并不妙妙……此功能会将你的电子邮件格式化为每行最多
    72 个字符。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_189_0.png)


    图 11-45. 让你的消息看起来更漂亮！


    ### 11.3.1.6. 副本与文件夹


    此功能允许你向你喜欢的任何人发送“密抄”（Blind Carbon Copy）。例如，你可能想将你发出的所有电子邮件都发送给自己，而不是让它们堆积在已发送目录中。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_190_0.png)


    图 11-46. 智能地发送所有电子邮件……


    ### 11.3.1.7. 格式


    现在，有些用户倾向于接收文本模式的电子邮件，而另一些人则喜欢 HTML 格式。无论你更喜欢哪种并不真的重要，但收件人的意见很重要……例如，有些用户讨厌接收基于
    HTML 的电子邮件：他们可能会因为下载时间太长而直接将其删除。另一些人则不在乎，等等。你比我们更了解你的邮件伙伴，所以请确保你使用的格式适合他们。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_191_0.png)


    图 11-47. 尊重你的收件人


    ### 11.3.1.8. 回执


    此选项确保你的收件人确认已收到了你的消息。尽管如此，即使被要求，用户也可以选择不发送回执，但对于重要/机密文档，我们强烈建议使用此功能。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_192_0.png)


    图 11-48. 送达证明


    ### 11.3.1.9. 磁盘空间


    取决于你每天收到的电子邮件数量，你可能想限制在服务器上保留的消息数量。限制电子邮件的大小也很重要，以免你的文件夹里最后出现 5 兆字节的邮件……


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_193_0.png)


    图 11-49. 节省磁盘空间


    ### 11.3.2. 电子邮件


    如果你从未发送过电子邮件或参与过任何邮件列表，你在等什么呢？说真的，电子邮件允许信息的快速流动，并且现在存在于大多数业务中。即使在家里，人们与互联网的连接也越来越紧密，取决于你所在的国家，可以使用快速连接，如
    DSL。要打开你的 Netscape 邮件客户端，访问你的 GNOME 或 KDE 菜单，然后进入“网络→邮件→Netscape Messenger”。


    # 第 11 章 日常应用


    ![](img/44017b5ddbff38ec085831b3cde64d5d_194_0.png)


    图 11-50. Netscape 电子邮件客户端


    后一张图显示了一个典型的 Netscape 邮件客户端。左侧是目录列表，右侧显示电子邮件内容。由于客户端或网络浏览器中都没有许多键盘快捷键，你将不得不使用鼠标浏览菜单。然而，一些关键功能有快捷键：回复
    (Alt+R)、新消息 (Alt+M)、新浏览器 (Alt+N)、剪切 (Ctrl+X)、复制 (Ctrl+C) 和粘贴 (Ctrl+V)。尝试这些操作，你将发现不离开键盘可以多快地发送电子邮件。不过，位于文件菜单下方的栏非常有帮助。在那里找到所有主要的邮件客户端功能，如获取消息、新消息、回复等。


