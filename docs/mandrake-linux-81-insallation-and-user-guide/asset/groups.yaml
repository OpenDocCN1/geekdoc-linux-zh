    # Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_229_0.png)


    Figure 14-4. Choosing the steps to replay or not


    After a warning screen about what we are going to do, we get a list of most steps
    of the installation. To each step is associated a two-entry menu choose:


    - replay: choose this if you want to reuse the choices you made during the manual
    installation for the automated installation.

    - manual: choose this if you prefer to manually reconfigure this step during the
    automated installation.


    When you have made your choice for each installation step, click the OK button.
    You will be asked to insert a blank floppy disk (all data will be erased).


    After clicking OK again, the boot floppy disk will be created with the following
    characteristics:


    - The installation method (from CD-ROM, via NFS, FTP, etc.) is the same as the
    one used during the install of the machine currently worked on,

    - All the steps marked as replay will be replayed with all choices made during
    the installation of the current machine,

    - All the steps marked as manual will have to be manually configured during the
    installation,

    - The partitioning and formatting steps will be always manual for security reasons.


    Then all you have to do is insert the resulting floppy in the machine you want
    to replicate the installation on, turn it on, and configure the few remaining
    manual steps, saving you a lot of time.


    ## 14.4. Change the Resolution of your Display


    ### 14.4.1. X Configuration Simple Mode


    This little tool allows you to change the video resolution of your screen, if
    the one configured at install does not fit your needs. You get two choices on
    the window (figure 14-5): resolution (in pixels) and depth (number of colors)
    of your system. Simply choose the one you wish to use and click the OK button.


    | Choose the resolution and the color depth (Graphic card: RIVA128) |

    | :--- | :--- |

    | 640x480 | |

    | 800x600 | |

    | 1024x768 | |

    | 1280x1024 | |

    | 65536 colors (16 bits) | |

    | Ok | Cancel |

    | Show all | |


    Figure 14-5. Choosing a new resolution


    Then a new dialog will ask you whether you wish to test the new choices or not
    (figure 14-6). It is highly recommended that you test, because if it''t work it
    will be harder to recover a graphical environment.


    | I can set up your computer to automatically start X upon booting. |

    | :--- |

    | Would you like X to start when reboot? |

    | Yes | No |


    Figure 14-6. Test the new video


    The changes will be activated after you quit and restart.


    ### 14.4.2. X Configuration Expert Mode


    You can access a more advanced tool to modify the screen or video card in use.
    Simply click the Expert Mode button while in simple mode. You will be presented
    various screens, each corresponding to an aspect of graphical configuration:


    Depending on your video card, you may first be asked which graphical server you
    wish to use. You may have the choice between various versions or 3D/2D accelerations
    depending on your graphical card. If your video card supports various displays
    (multi-head), you will also have that option.


    Change resolution

    This is similar to the options given in Simple mode, apart from Show all button,
    which gives you access to more resolutions and color depths.


    Test the configuration

    It is highly recommended that you test, because if it''t work it will be harder
    to recover a graphical environment.


    X at startup

    Answer No if you prefer to have a text login at boot. Selecting Yes will launch
    the graphical manager.


    Should the graphical test work, you are presented a menu allowing to change more
    parameters, in order to find those which work:


    Change monitor

    This option displays a tree with all major monitor brands and models. First expand
    the branch corresponding to your monitor, then choose the model that you are using.


    Change video card

    Same principle as for monitors, choose your video card brand and model.


    Change resolution

    This choice simply presents resolution and color depth boxes.


    Show information

    This is a simple window summing up the current hardware:


    - Keyboard layout: fr

    - Mouse type: PS/2

    - Mouse device: psaux

    - Monitor: monitor1

    - Monitor HorizSync: 30-70

    - Monitor VertRefresh: 50-160

    - Graphic card: RIVA128

    - Graphic memory: 4096 kB

    - Color depth: 65536 colors (16 bits)

    - Resolution: 800x600

    - XFree86 server: SVGA

    - XFree86 driver: nv


    ![](img/44017b5ddbff38ec085831b3cde64d5d_232_0.png)


    Figure 14-7. The X information window


    ## Test again

    It is recommended that you make a final test of your configuration before closing
    hardrake; this will ensure that you''ll have no problems when rebooting the graphical
    server.


    ## 14.5. Configuring your hardware


    ### 14.5.1. Introduction

    The hardrake project has been developed to simplify hardware configuration under
    GNU/Linux by providing an easy-to-use interface.


    hardrake is composed of two parts:


    1. A main tool called hardrake, used to configure hardware by launching.

    2. A hardrake Wizard or external configuration tool(s) (which can be configured).


    ### 14.5.2. hardrake


    #### 14.5.2.1. Description

    When was the last time you had to install a new sound card on your GNU/Linux system
    and just couldn''t quite get it to work? Sure you know which model it is and can
    even guess which driver supports it and may have some idea as to the IRQ DMA and
    I/O port it uses.


    Here comes hardrake.


    hardrake is a fully GUI-based tool that ties together many of the tools already
    included in a GNU/Linux distribution to automate and simplify the process of installing
    new hardware. Some items will be detected, others can be selected from a dropdown
    list. The various I/O, IRQ and such X86 annoyance settings can be adjusted from
    within this interface.


    On one hand, hardrake is used to display information. On the other hand, it can
    launch configuration tools as well. With an easy interface, you will be able to
    browse (hopefully) all the hardware your system consists of.


    hardrake uses the detect library, so if your new hardware isn’t detected, you
    only need to upgrade detect itself.


    #### 14.5.2.2. Usage

    To launch hardrake, you can start it from:


    - Control Center: Just click on the Hardrake icon.

    - terminal: Type hardrake, doing it this way you can pass parameters as well.

    - GNOME and KDE: Go to the start panel. The hardrake entry is in Configuration/System
    group.


    After a wait screen (indicating the detection process), you’ll see a window like
    figure 14-8.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_235_0.png)


    Figure 14-8. hardrake main window


    On the left, you can see the device tree showing all categories.


    For some categories, you will notice a “[+]” symbol. By clicking on it, the subtree
    will be expanded and all detected hardware of this category will be listed. figure
    14-9 shows such a window.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_236_0.png)


    Figure 14-9. hardrake - selected device


    If you select a device, you will get some information about it. In some cases
    you will see a configuration button, which will allow you to configure the selected
    device. In 14-9, we have expanded some parts of the tree and selected a device
    of one category. On the right you can see information about the selected device.
    If you press the Run Configuration tool button, the configuration tool associated
    with this device appears and lets you configure this card.


    There is a special category called "Other Devices", which contains all currently
    unknown hardware in your system. There is information available on how to help
    us to add this unknown hardware to our database. By reporting the requested information,
    you can hope to see your hardware recognized in future versions!


    In figure 14-10, you can see a special case where the user is asked to report
    an ID to the hardrake team (mailto:hardrake@mandrakesoft.com). In most cases you
    will be asked to send the output of a "pnpdump".

    '
