    Click on it, then select Updates only: this time, you get a list of the packages
    installed on your machine but for which there exists a more up-to-date release
    of the sources (more later about sources and updates). Notice that these “updating
    packages” are displayed with a symbol on the left of their name. For example,
    the symbol shows updates that come from Cooker, the development version of Mandrake
    Linux.


    On the other hand, if you select Uninstalled only in the list instead of All or
    Updates only, you will see the packages that are not yet installed on your system.


    # 15.2. Let''s Install a Package


    Now that you are familiar with the global interface, we will install a package.
    We''ll choose a clear example, but it may be possible that this package is already
    installed on your system. If this is the case, it does not matter, just use another
    one to experiment. Of course, to experiment we must choose a package in the Installable
    packages list. So select this list if you have not done so yet.


    As an example, we''ll choose the emacs-pcomplete package. To find it more easily,
    use the Flat List, which is alphabetically ordered, or the search field. Once
    you have found it, select it by clicking in the square box next to its name. It
    appears in the Selected block on the right-hand side, and various information
    are given such as the package''s version and size.


    Now, to install it, simply click on the button labeled Install / Remove, on the
    left of the button bar at the top of the window. RpmDrake will then invoke RpmInst,
    the wizard which will guide you through the various steps for installing the package.


