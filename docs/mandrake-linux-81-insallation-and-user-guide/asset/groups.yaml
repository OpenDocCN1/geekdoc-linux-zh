    # # Chapter 8. Linux for Beginners


    # ## 8.1. Introduction


    This chapter is written for inexperienced beginners. If you know how to create
    an icon on the desktop, skip ahead to the next chapter. If not, read on :-)


    If we took for granted that all users know how to operate Windows, it would have
    been easier to write this chapter. Instead, we decided to write everything from
    scratch. Hence, any user, experienced or not (who barely knows how to move the
    mouse pointer across a screen), can launch programs, properly close them and shut
    down the computer. After reading this chapter, all subsequent ones will make much
    more sense to you.


    We assume that you are sitting in front of a running Linux computer which, when
    turned on, automatically displays the graphic login screen. The latter shows a
    little box in the middle of your screen and holds two fields tagged as login and
    password. This is what you should see if you previously followed the Installation
    Guide procedure.


    Given the large number of graphical interfaces available under GNU/Linux, it is
    impossible to document them all. We will discuss two of the most popular ones:
    KDE and GNOME.


    # ## 8.2. Beginning and Ending your Session


    It is important to understand the terms “to log in” and “to log out” since it
    is unlikely you will find these terms in a typical dictionary, though you might
    find them in a cyber dictionary. To log means the computer system you are trying
    utilize will recognize you as a user. After logging in, the system takes a number
    of actions in order to give you access to the system’s resources. By logging in,
    you start a-called “session”.


    To log out means you are telling the system you no longer need to use it. Therefore,
    the resources you were using are available for someone else.'
