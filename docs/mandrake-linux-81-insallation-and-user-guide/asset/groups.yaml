    their displays, the new window will also follow that display. Window splitting
    is also very practical to copy and move files from a folder to another: you can
    visualize the contents of many folders at a time, and move many files from a window
    to another.


    ### 11.2.2. Nautilus File Manager


    GNOME''s default file manager now is Nautilus. With it, you can manage your files
    and browse the web. It was originally developed by Eaz but it unfortunately ceased
    its operations.


    However, since it is an open-source project, many developers still maintain and
    enhance it.


    Note: Since Nautilus'' main features function in a similar manner to those of
    Konqueror, we will only describe functionalities specific to Nautilus. Please
    refer to the section about Konqueror above if you need more information.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_173_0.png)


    Figure 11-32. Nautilus’s Main Window


    ### 11.2.2.1. Exploring the Left Side of Nautilus


    The left part of the window gives you a few options. In fact, you can have a single
    folder showing where you are in your tree structure. It includes basic information
    such as the file type, the number of items it holds and the last access date.


    The other options are:


    - standard tree structure. You can access it through the Tree tab.

    - notes. It allows you to write notes directly in the yellow window. Click on
    the Notes tab to try it out.

    - history. This option allows to see a history of the folders visited. Hence,
    by clicking on the History tab, you will get something like this:

    - news. With this function, you can add news web sites such as Linux Today (http://linuxxtoday.com)
    and access them directly through hyperlinks.


    In our example, we added Linux Today (http://linuxxtoday.com) and Linux Weekly
    News (http://lwn.net). After this operation is over, you get a resume of these
    sites in your sidebar:

