    # Chapter 10. Using GNOME


    # Documentation


    Two items are located in this sub-menu: About Gnome and Help System (the latter
    we detailed earlier). The About Gnome sub-menu leads you to an interface which
    gives you three choices: GNOME News Site, GNOME Main Site and GNOME Developer''s
    Site.


    # Amusements


    Guess what? Linux holds a set of for games, such as GNOME Chess, Xgammon and KAsteroids,
    etc.


    # Configuration


    Wishing you could modify configuration parameters? Explore this sub-menu as you
    will find useful applications to better manage your Mandrake Linux system. Included
    are KDE, Boot & Init, GNOME, Hardware, Printing, Packaging and Networking sub-menus.
    Be careful what you do in the Configuration menu, you may damage your station.
    In doubt, please ask a qualified system administrator.


    # Networking


    If your main computer use is Internet-related, this is the section for you. Here
    you will find IRC, WWW, Chat, Mail, News, Remote access, Instant messaging and
    File transfer sub-menus. Remember: many programs exist for all of those items.
    Feel free to test a few clients before using default software as netscape. You
    may prefer the Konqueror browser for example or KMail as a mail client. This is
    one of GNU/Linux’s strong point: you have a wide array of software applications
    from which you can choose.


    # Terminals


    As stated, many command line (Terminal) exist. Once again, choose the one you
    feel most comfortable with.


    # Applications


    With the Office sub-menu, this is one you are more likely to explore in depth.
    The list of applications is pretty long. Let us quote a couple of interesting
    sub-menus such as Text Tools, Communications, Editors and Publishing.'
