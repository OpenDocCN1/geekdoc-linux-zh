    X (for Window System) which is the heart of the GNU environments (KDE, Gnome,
    AfterStep, WindowMaker...) bundled with Mandrake Linux rely. In this section,
    DrakX will try to configure X automatically.


    It is extremely rare for it to fail, unless the hardware is very old (or very
    new). If it succeeds, it will start X automatically with the best resolution possible
    depending on the size of the monitor. A window will then appear and ask you if
    you can see it.


    If you are doing an Expert install, you will enter the X configuration wizard.
    See the corresponding section of the manual for more information about this wizard.


    If you can see the message and answer Yes, then DrakX will proceed to the next
    step. If you cannot see the message, it simply means that the configuration was
    wrong and the test will automatically end after 10 seconds, restoring the screen.


