    from the main menu: Documentation→HOWTO English. When met with a complex problem,
    start by reading the corresponding HOWTO (if it exists of course!). Not only will
    you be given a solution to your problem but you will also learn a great deal at
    the same time. Among others, examples of what is covered range from networking
    (NET-3-HOWTO), sound card configuration (Sound-HOWTO), the writing of media CD
    (CD-Writing-HOWTO) as well as NIS and NFS configuration.


    An important step is to check the modification dates of the HOWTO documents -
    i.e. the publication date located at the beginning of the document - to make sure
    they are up-to-date. Otherwise, their contents may be invalid. Watch out for old
    HOWTOs relating to hardware configuration especially, as Linux evolves very fast
    in that specific area. Remember also that, in the free software world, the term
    “old” carries even more weight than in IT in general: free software may be considered
    old after being around fifteen days!


    > Note: HOWTOs are available online on the LDP (http://linuxdoc.org/) site and
    likely to be slightly more up-to-date there. Have a look at the following as well:
    (classified by categories (http://linuxdoc.org/HOWTO/HOWTO-INDEX.html)); and FAQs
    (http://linuxdoc.org/docs.html#faq).


    ## A.1.4. The /usr/share/doc Directory


    Some packages include their own documentation in one of /usr/share/doc subdirectories
    and named after the specific package.


