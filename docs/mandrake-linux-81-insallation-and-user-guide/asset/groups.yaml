  mdcn: '


    ## 术语表


    不是在正在编辑的文件中插入字符，而是执行针对该键的特定操作（除非克隆具有可重映射的命令，且你已自定义了配置）。你可以通过输入其中一个“返回插入模式”命令来退出：i,
    I, a, A, s, S, o, O, c, C, ...


    ## 编译 (compilation)


    是将人类可读的（嗯，经过某些训练后）且用某种编程语言（例如 C）编写的源代码翻译成机器可读的二进制文件的过程。


    ## 补全 (completion)


    shell 自动将子字符串扩展为文件名、用户名或其他内容的能力，只要存在匹配项。


    ## 压缩 (compression)


    是一种缩小文件或减少通过通信连接发送字符数量的方法。某些压缩程序包括 compress、zip、gzip 和 bzip2。


    ## 控制台 (console)


    是以前称为终端（terminals）的名称。它们曾是连接到大型中央主机的用户机器（屏幕加键盘）。在 PC 上，物理终端就是键盘和屏幕。

    另请参：虚拟控制台（virtual console）。


    ## Cookie (cookies)


    由远程 Web 服务器写入本地硬盘硬盘的临时文件。它允许服务器在用户再次连接时感知该用户的偏好。


    ## 数据报文 (datagram)


    数据报文是一个包含地址的数据和头部的离散数据包，它是 IP 网络上传输的基本单位。你可能还会听到它被称为“数据包”（packet）。


    ## 依赖 (dependencies)


    是指在完全编译一个程序之前，进入其他编译阶段前需要满足的编译阶段。


    ## 桌面 (desktop)


    如果你使用 X Window 系统，桌面就是屏幕上你工作的地方，你的窗口和图标就显示在上面。它也被称为背景，通常由单色、渐变色甚至图像填充。

    另请参阅：虚拟桌面（virtual desktops）。


    ## 目录 (directory)


    文件系统结构的一部分。在目录内存储着文件或其他目录。有时目录内还有子目录（或分支）。这通常被称为目录树。如果你想查看另一个目录内部的内容，你必须列出它，要么进入该目录。目录内部的文件被称为“叶子”（leaves），而子目录被称为“分支”（branches）。目录遵循与文件相同的限制，尽管权限的含义不同。特殊目录
    . 和 .. 分别指代目录本身和父目录。


    ## 离散值 (discrete values)


    是非连续的值。也就是说，在两个连续值之间存在某种“间距”。


    ## 发行版 (distribution)


    是一个用于区分不同 GNU/Linux 厂商产品的术语。一个发行版由核心 Linux 内核和工具组成，以及安装程序、第三方程序，有时还有专有软件。


    ## DLCI


    DLCI 是数据链路连接标识符（Data Link Connection Identifier），用于通过帧中继（Frame Relay）网络识别唯一的点对点连接。DLCI
    通常由帧中继供应商分配。


    ## 回显 (echo)


    是指你在用户名输入字段中输入的字符“原样”显示，而不是在你输入的每个字符处显示“*”。


    ## 编辑器 (editor)


    通常指用于编辑文本文件的程序的术语（也称为文本编辑器）。最著名的 GNU/Linux 编辑器是 GNU Emacs 编辑器和 Unix 编辑器 Vi。


    ## 电子邮件 (email)


    代表电子邮件（Electronic Mail）。这是在同一网络的人之间以电子方式发送消息的方法。类似于普通邮件（又称信信），电子邮件需要目的地址和发送者地址才能正确发送。发送者必须有一个类似“sender@senders.domain”的地址，接收者必须有一个类似“recipient@recipients.domain”的地址。电子邮件是一种快速通信方法，通常可以到达世界上任何地方的任何人。为了写邮件，你需要电子邮件客户端，如文本模式客户端
    pine 或 mut，或者像 kmail 这样的 GUI 客户端。


    ## 环境 (environment)


    是进程的执行上下文。它包含了操作系统管理进程所需的所有信息，以及处理器正确执行该进程所需的信息。

    另请参阅：进程（process）。


    ## 环境变量 (environment variables)


    进程环境的一部分。环境变量可以直接从 shell 中查看。

    另请参阅：进程（process）。


    ## 转义 (escape)


    在 shell 上下文中，是指用引号包裹某些字符串，以防止 shell 解析该字符串的操作。例如，当你需要在某些命令行中使用空格并将结果管道到某些其他命令时，你必须将第一个命令放在引号中（“转义”该命令），否则
    shell 将错误的解释它且无法按预期工作。


    ## 文件系统 (filesystem)


    在物理介质（硬盘、软磁盘）上存储文件的方案，如 FAT、GNU/Linux 的 ext2fs、iso9660（用于 CD-ROM）等。虚拟文件系统的例子是
    /proc 文件系统。


    ## 防火墙 (firewall)


    是一种机器或专用硬件，在本地网络拓扑结构中，它是连接外部网络的唯一连接点，它可以过滤或控制某些端口上的活动，或确保只有特定的接口可以访问它们。


    ## 标志 (flag)


    是一个指示器（通常是一个位），用于向程序信号某些条件。例如，文件系统有一个标志，指示它是否需要在备份中转储，因此当标志激活时，文件系统会被备份；当不激活时则不会。


    ## 焦点 (focus)


    窗口接收键盘事件（如按键、释放和鼠标点击）的状态，除非这些事件被窗口管理器捕获。


    ## 前台 (foreground)


    在 shell 上下文中，前台进程是当前运行的进程。


    ## 帧缓冲区 (framebuffer)


    将显存映射到机器地址空间的操作。这允许应用程序访问显存，而无需与显卡通信。所有图形工作站都使用帧缓冲区。


    ## 帧中继 (Frame Relay)


    帧中继是一种非常适合传输突发性或随机性流量的网络技术。通过让许多帧中继客户共享网络容量来降低网络成本，这取决于他们何时需要使用网络。


    ## 全屏 (full-screen)


    该术语用于描述占据整个显示区域的应用程序。


    ## 网关 (gateway)


    连接两个 IP 网络的链路。


    ## 通配符 (globbing)


    在 shell 中，通过配符模式匹配一组文件名的能力。

    另请参阅：配符模式。


    ## 通配符模式 (globbing pattern)


    由普通字符和特殊字符组成的字符串。特殊字符会被解析和扩展。


    ## 硬件地址 (hardware address)


    是在物理网络媒介访问层唯一标识主机的数字。这种地址的以太网地址和 AX.25 地址。


    ## 隐藏文件 (hidden file)


    是在不带选项执行 ls 命令时看不到的文件。隐藏文件名以 . 开头，用于存储用户对不同程序的个人偏好和配置。例如，bash 的命令历史保存在 .bash_history
    中，这是一个隐藏文件。


    ## 家目录 (home directory)


    通常缩写为 home，这是特定用户的个人目录名称。

    另请参阅：账户（account）。


    ## 主机 (host)


    指计算机，通常用于讨论连接到网络的计算机。


    ## 图标 (icon)


    是图形环境中代表的小图形（通常大小为 16×16、32×32、48×48，有时为 64×64 像素），代表文档、文件或程序。


    ## 索引节点 (inode)


    Unix 类文件系统中指向文件内容的索引点。inode 通过一个数字唯一标识，并包含关于它所引用的文件的元信息，如访问时间、类型、大小，但不包含其名称！


    '
