    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_143_0.png)


    Figure 11-1. The StarOffice Desktop


    As you can see in the StarOffice desktop image, it combines almost all the software
    pieces you might need in an every day work. However, for the purpose of this book,
    we will only talk about the text editor.'
