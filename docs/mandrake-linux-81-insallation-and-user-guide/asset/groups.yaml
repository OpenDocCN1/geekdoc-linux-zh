    # 10.4. GNOME Menu


    The GNOME menu holds everything you need to fully utilize your new Mandrake Linux
    system. Let us start with the basics.


    First off, do not be surprised if you think you saw some of the utilities previously.
    In fact, we have already covered the Panel and Log-Out menu, the first items you
    should see are the Log out, Lock screen, and when you open your GNOME menu you
    should see the Log out, Lock screen and Panel sub-menus. The latter allows you
    to configure it, whether it be colors, location, size, etc. And if you choose
    the Global Preferences sub-menu, you will end up in the GNOME Control Control
    Center, where you can set the essential panel parameters. Surf through the different
    options to fully personalize them to your liking.'
