    with the internationalization of this book. If you have ideas on how to improve
    the content, let us know - even advice on typos is welcomed!


    For any information about the Mandrake Linux documentation project, please contact
    the documentation administrator (mailto:documentation@mandrakesoft.com).


    # # 6. Conventions Used in this Book


    # ## 6.1 Typing Conventions


    In order to clearly differentiate special words from the text flow, the documentation
    team uses different renderings. The following table shows an example of each special
    word or group of words with its actual rendering and what this means.


    | Formatted Example | Meaning |

    | --- | --- |

    | *inode* | This formatting is used to stress a technical term explained in the
    *Glossary*. |

    | `ls -lta` | Indicates commands or arguments to a command. This formatting is
    applied to commands, options and file names. Also see the section about “Commands
    Synopsis, page VI”. |

    | `ls(1)` | Reference to a man page. To get the page in the *shell* (or command
    line), simply type `man 1 ls`. |

    | `$ ls *.pid` <br> `imwheel.pid` | The documentation team uses this formatting
    for text snapshots of what you may see on your screen. It includes computer interactions,
    program listings, etc. |

    | `localhost` | This is literal data that does not generally fit in any of the
    previously defined categories. For example, a key word taken from a configuration
