    # 第 14 章.Mandrake 控制中心


    ## 14.15. 管理系统上可用的字体


    此工具允许用户查看系统上可用的不同字体族、样式和大小。


    主窗口（图 14-34）甚至渲染了所有字体组合的视觉效果。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_265_0.png)


    图 14-34. drakfont 主窗口


    它允许你添加从互联网下载的字体，并通过删除字体来节省空间。但最有趣的功能可能是允许你在 Windows 安装中使用该机器上其他地方可用的字体。只需点击 `Get
    Windows fonts`（获取 Windows 字体），系统就会显示所有在你的 Windows 分区区上可用的字体列表。然后你可以选择安装这些字体中的部分或全部。


    **提示：** 要选择一组字体，请点击你想要选择的第一个字体，移动到最后一个字体，并在按住 Shift 键的同时点击它。要选择单个字体，请在按住 Ctrl
    键的同时点击要选择的项目。


    ## 14.16. 管理系统上的用户


    userdrake 是一个用于 Mandrake Linux 的高级实用程序，允许系统管理员轻松地向系统添加用户、删除其他用户、将用户进行分组，并以相同的方式管理组。


    我们这里只关注用户，组的管理非常相似。


    ### 14.16.1. 界面


    启动 userdrake 将显示主窗口（图 14-35），该窗口列出了系统当前定义的用户。你可以通过进入 View（查看）→View groups（查看组）从用户切换到组。


    | 文件（Fichier） | 操作（Actions） | 选项（Options） | 帮助（Aide） |

    | :--- | :--- | :--- | :--- |

    | 保存 (Enregistrer) | 添加 (Ajouter) 编辑 (Éditer) 删除 (Supprimer) | | |

    | 登录 (Login) | 标识 (Identifiant) | 标识 (Identifiant) | 目录 (Répertoire per) | 备注
    (Commentaire) | 解释器 (Interprète de) | 组 (Groupes) |

    | queen | 504 | 511 | /home/queen | Queen Ping | /bin/bash | xrq, usb, c |


    图 14-35. userdrake 中的用户列表


    窗口的布局是标准的，Add（添加）、Edit（编辑）和 Remove（删除）三个按钮也可以从 Action（操作）菜单访问。


    你可以进行任意数量的更改，对用户数据库的影响只有在点击 Save（保存）按钮后才会生效。你可以随时通过进入 File（文件）→Reload（重新加载）菜单项回到当前的用户数据库。


    ### 14.16.2. 让我们添加一个新用户


    我们在安装时创建了标准用户 Queen Pingusa，现在我们需要创建一个名为 Peter Pingus 的新用户，然后让他们都都成为 urppi 组的成员，这样他们就可以在没有
    root 密码的情况下安装包。


    点击 Add（添加）按钮，将弹出添加新用户的对话框（图 14-36）。唯一的必填字段是登录名（login），你也可以选择添加备注，通常这里是用户的全名。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_267_0.png)


    图 14-36. 在系统中添加新用户


    现在我们的列表中有两个用户，用鼠标同时选择他们（点击第一个，在不松开按钮的情况下将光标移动到第二个），然后点击 Edit（编辑）按钮。现在显示的对话框（图
    14-37）右侧显示可用组的列表，以及所选用户所属的组列表。在右侧寻找 urpmi 组，点击它使其高亮，然后点击两个列表之间的 Add（添加）按钮。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_268_0.png)


    图 14-37. 为用户分配组


    **注意：** userdrake 下的所有对话框在按钮上方都有一个简短消息。它通常显示“一切均正确”，但如果你选择了模糊的内容或不允许的内容，此消息将警告你。点击
    OK 后，你可以检查用户列表，确认最后一个字段包含组名 urppi。


    ## 14.16.3. 其他功能


    通过 View（查看）→Edit（编辑）（Ctrl-P）访问的参数对话框（图 14-38）允许你调整列表显示方式和某些选项。


    | 通用（General） | 用户视图（User view） | 组用户（Group user） |

    | :--- | :--- | :--- |

    | 不显示少于 500的用户 | | |

    | 默认 shell: | /usr/bin/bash | |

    | 默认主目录（Default home）: | /home | |


    图 14-38. userdrake 参数


    首先，UID 低于 500 的用户是系统使用的虚拟用户，对真实用户无效。你可以在这里选择在用户列表中显示或不显示它们。后面的 User（用户）选项卡（图 14-39）允许你选择在用户列表中显示的字段。只需取消勾选与感兴趣字段相关的复选框即可。Group（组）视图具有相同的目的。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_270_0.png)


    图 14-39. userdrake 用户视图


    **注意：** 当你选择多个用户并点击各个用户时，userdrake 的对话框按钮上方有一条小消息。如果你选择了模糊的内容或不允许的内容，此消息将警告你。点击
    OK 后，你可以检查用户列表，确认最后一个字段包含组名 urppi。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_271_0.png)


    图 14-40. 用户所属组


    ## 14.17. 设置日期时间


    通过 View（查看）→Edit（编辑）（Ctrl-P）访问的参数对话框（图 14-38）允许你调整列表显示方式和某些选项。


    此工具允许你根据你的时区设置日期。


    此工具允许你根据你的时区设置日期。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_272_0.png)


    图 14-41. 日期时间


    - 要更改年份，点击左侧的年份。

    - 要更改月份，点击左侧的月份。

    - 要更改日期，点击左侧的日期。

    - 要更改时区，点击右侧的时区。

    - 要更改小时、分钟，点击右侧的时钟。


    当你完成后，点击 OK 应用设置或点击 Cancel 取消。如果你想回到默认设置，点击 Reset（重置）。


    ## 14.18. 搜索日志文件


    此工具允许你在各种日志文件中搜索特定的条目或威胁。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_273_0.png)


    图 14-42. 浏览并搜索日志


    要在日志中搜索特定事件，步骤如下：


    1. 你可以首先填充匹配字段以包含特定单词；或者通过非匹配字段包含其他内容。

    2. 然后你需要选择要执行搜索的文件。

    3. 可选，你可以将搜索限制在特定日期。在这种情况下，勾选右侧日历中的所需日期并仅显示此日期。

    4. 设置完成后，点击搜索按钮，结果将出现在底部的文件区域。


    ## 14.19. 访问控制台


    此菜单项将打开一个 root 用户的控制台。你可以使用它发布任何命令，但要小心！这里对你执行的操作没有任何限制，可能会导致系统无法使用。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_274_0.png)


    图 14-43. 命令行界面


    ## 第 15 章. 包管理


    你可能已经注意到你的系统是由许多小部件组成的，就像房子是由砖块组成一样。在这里，我们不把这些称为“砖块”，而是“包”。包可以被看作包含安装和运行特定软件所需元素的盒子。


    这种管理通过使用几个工具变得简单。然而，这些操作对用户无效，因此你必须是超级用户才能使用描述的工具。


    ### 15.1. 主要工具：RpmDrake


    RpmDrake 是主要的包管理工具。你可以通过选择系统节点下的 Software Manager（软件管理器）来启动它。


