    # Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_237_0.png)


    Figure 14-10. harddrake - unknown device


    At the top of the window, there''s a menu providing four items. First, there''s
    the "File" menu with four actions. "Save report file" is used to write a system
    report to disc. "Load report file" is used to load the report file generated.
    "Reload" and "Exit" let the user restart and exit harddrake, respectively.


    The second item, the "Options" menu, is for configuring harddrake. The first menu
    entry, "Probing Options" allows for the disabling of some tests and for configuring
    actions associated with the Run Configuration Tool button and the "Tools" menu.
    So you can easily select your preferred configuration program for a category of
    hardware.


    # Chapter 14. Mandrake Control Center


    | Devices | Disabled | Configuration Tool |

    | --- | --- | --- |

    | CPU | no | None |

    | Memory | no | None |

    | Floppy Drives | no | None |

    | Disks | no | /usr/sbin/diskdrake |

    | CD-ROMs | no | None |

    | Tapes | no | None |

    | Network Device Cards | no | None |

    | Modem | no | None |

    | Videocards | no | None |

    | TV Cards | no | None |


    Figure 14-11. harddrake - probing options window


    The last menu, is the harddrake help.


    ## 14.5.3. harddrake Wizard


    ### 14.5.3.1. Introduction


    The harddrake Wizard is a generic configuration tool. It replaces the former configuration
    tools etherdrake and soundrake.


    ### 14.5.3.2. Usage


    As an example we will focus on the Sound-Wizard now. The Wizard, if available
    for a certain component class, is launched from harddrake by pressing the Run
    Configuration Tool button. After a few moments, a window like this figure 14-12
    should appear.


    215


    # Chapter 14. Mandrake Control Center


    ![](img/44017b5ddbff38ec085831b3cde64d5d_239_0.png)


    Figure 14-12. harddrake - Sound-Wizard


    You can change the current selection, but in most cases it is not a good idea,
    as the detected device is already highlighted. For an ISA card you need to specify
    the I/O and IRQ settings if the values proposed by default are not correct. After
    checking configuration, press the OK button to test the configuration. Three samples
    should be played (if MIDI is available and you have a sound-card supporting 16
    bit DMA channels). If you didn’t hear them without any error messages, it may
    be due to one of the following reasons:


    - Your speaker volume is too low.

    - A hardware problem, maybe your sound-card is damaged?

    - Your sound-card is installed incorrectly.


    An error message may occur because of the following problems:


    - Bad settings (I/O, IRQ, DMA ...).

    - Old sound modules from another configuration are still in memory. In this case,
    unload them by running “modprobe -r <module_name>” from a terminal.


    216


    If you heard proper sound samples, you can press OK to confirm the configuration.
    Check sound configuration by starting a program which uses sound (specifically
    from a non-root account). After these tests, you should reboot your system and
    check that the modules are loaded correctly at boot time.


    ## 14.5.4. Problems/Troubleshooting


    If your hardware isn''t recognized or your system freezes, contact the harddrake
    team (mailto:harddrake@mandrakesoft.com) and use the subject "[Detect].


    If you think it''s a bug related to harddrake (bugs with the user interface),
    contact the same email address but use "[harddrake]" as the subject.


    ## 14.5.5. Other information


    - The harddrake home page (http://www.linuxmandrake.com/harddrake/) (for news,
    updates, information ...)

    - http://www.linuxmandrake.com/harddrake/ (for new updates)

    - http://www.linuxmandrake.com/harddrake/ (for new updates)

    - http://www.linuxmandrake.com/harddrake/ (for new updates)

