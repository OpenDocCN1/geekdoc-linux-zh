    \  - 3. LILO with text menu: if you prefer LILO with its text interface.\n- Boot\
    \ device: in most cases, you will not change the default (/dev/hda), but if you\
    \ prefer, the boot loader can be installed on the second hard drive (/dev/hdb),\
    \ or even on a floppy disk (/dev/fd0).\n- Delay before booting the default image:\
    \ when rebooting the computer, this is the delay granted to the user to choose\
    \ another boot entry than the default one.\n\n> Beware that if you choose not\
    \ to install a boot loader (by selecting Cancel here), you must ensure that you\
    \ have a way to boot your Mandrake Linux system! Also be sure you know what you\
    \ do before changing any of the options.\n\nTip: Clicking the Advanced button\
    \ in this dialog will offer you advanced options, which are reserved to the expert\
    \ user.\n\nMandrake Linux installs its own boot loader, which will let you boot\
    \ either GNU/Linux or any other operating systems which you have on your system.\
    \ If there is another operating system installed on your machine, it will be automatically\
    \ added to the boot menu. Here, you can choose to fine-tune the existing options.\
    \ Double-clicking on an existing entry allows you to change its parameters or\
    \ remove it; Add creates a new entry; and Done goes to the next installation step.\n"
  mdcn: "\n\n## 第 5 章. 使用 DrakX 安装\n\n这是你日常使用时登录的账户。虽然每天以 root 身份登录非常方便，但也可能非常危险！极其微小的错误也可能导致你的系统无法运行。如果你作为普通用户犯了严重错误，你可能只会丢失一些信息，而不会丢失整个系统。\n\
    \n首先，你必须输入真实姓名。当然，这并不是强制性的——你实际上可以输入任何内容。DrakX 将提取你在输入框中输入的第一个单词，并将其作为用户名（User\
    \ name）。这是该用户登录系统时使用的名称。你可以更改它。然后，你需要在这里输入密码。从安全角度来看，非特权（普通）用户的密码没有 root 用户的密码那么至关重要，但这并不是忽视它的理由——毕竟，你的文件面临着风险。\n\
    \n如果你点击“接受用户（Accept user）”，就可以根据需要添加任意数量的用户。为你的每位朋友添加一个用户：例如，你的父亲或姐姐。当你添加完所有想要的用户后，选择“完成（Done）”。\n\
    \n> 提示：点击“高级（Advanced）”按钮允许更改更改用户的默认 shell（默认为 bash）。\n\n## 5.15. 配置你的网络\n\n注意：此步骤通常在推荐模式（Recommended\
    \ mode）下被忽略。\n\n## 第 5 章. 使用 DrakX 安装\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_68_0.png)\n\
    \n如果你希望将计算机连接到互联网或局域网，请选择正确的选项。在选择正确选项之前请开启设备，以便 DrakX 自动检测。\n\nMandrake Linux\
    \ 在安装时建议配置互联网连接。可用的连接包括：传统调制解调器、ISDN 调制解调器、ADSL 连接、电缆调制解调器，最后是简单的以太网连接。\n\n在这里我们不会详细介绍每个配置。只需确保你拥有来自互联网提供商或系统管理员的所有参数。\n\
    \n你可以咨询有关互联网连接的手手册章节详情，或者只需等待系统安装完成后使用那里描述的程序来配置连接。\n\n如果你想在安装后以后配置网络，或者已经完成了网络连接配置，请点击“取消（Cancel）”。\n\
    \n45\n\n## 5.16. 检查杂项参数\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_69_0.png)\n\
    \n这里列出了与你的机器相关的各种参数。根据你安装的硬件，你可能会看到看到以下条目：\n\n- 鼠标：检查当前的鼠标配置，必要时点击按钮进行更改。\n- 键盘：检查当前的键盘布局配置，必要时点击按钮进行更改。\n\
    - 时区：DrakX 默认根据你选择的语言猜测你的时区。但同样地，对于键盘的选择，你可能并不在所选语言对应的国家。因此，你可能需要点击“时区（Timezone）”按钮，以根据你所在的时区配置时钟。\n\
    - 打印机：点击“无打印机（No Printer）”按钮将打开打印机配置向导。\n- 声卡：如果系统中检测到声卡，将显示在这里。安装时无法进行修改。\n-\
    \ 电视卡：如果系统中检测到电视卡，将显示在这里。安装时无法进行修改。\n- ISDN 卡：如果系统上检测到 ISDN 卡，将显示在这里。你可以点击按钮更改与其相关的参数。\n\
    \n## 5.17. 在启动时选择可用服务\n\n注意：此步骤通常在推荐模式（Recommended mode）下被忽略。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_70_0.png)\n\
    \n现在可以选择希望在启动时启动的服务。\n\n这里是当前安装中所有可用的服务。请仔细检查，并取消勾选那些启动时并不总是需要的服务。\n\n你还可以创建一个快捷方式，通过\
    \ `at` 命令在设置时指定的时间运行计划命令，并在负载足够低时运行批处理命令。\n\n 提示：通过选择特定服务可以获取有关该服务的简短说明。然而，如果你不确定某个服务是否有用，保持默认行为更安全。\n\
    \n在此阶段，如果你打算将机器用作服务器，请务必小心：你可能不想启动任何你不需要的服务。请记住，如果在服务器上启用多个服务将可能是危险的。通常情况下，只选择你真正需要的服务。\n\
    \n## 5.18. 启动磁盘\n\n注意：此步骤通常在推荐模式（Recommended mode）下被忽略。\n\n![](img/44017b5ddbff38ec085831b3c664d5d_71_0.png)\n\
    \nMandrake Linux CDROM 内置了救援模式。你可以通过从 CDROM 启动访问它，在启动时按 F1 键并在提示处输入 rescue。如果你的计算机无法从\
    \ CDROM 启动，在至少两种情况下你应该回到此步骤寻求帮助：\n\n当安装引导程序时，DrakX 将重写你主磁盘的 MBR，以便你可以启动 Windows\
    \ 或 Linux。如果你需要重新安装 Windows，你必须确保不要将引导程序安装在软磁盘上。\n\n当你点击此步骤时，系统会要求你格式化磁盘。软磁盘必须为空或包含不需要的数据。\n\
    \n## 5.19. 安装引导程序\n\n注意：此步骤通常在推荐模式（Recommended mode）下被忽略。\n\n## 第 5 章. 使用 DrakX\
    \ 安装\n\n![](img/44017b5ddbff38ec085831bc664d5d_73_0.png)\n\nLILO 和 GRUB 是 GNU/Linux\
    \ 的引导程序。此阶段通常是自动化的。事实上，DrakX 会分析引导区并根据发现的情况采取行动：\n\n- 如果发现 Windows 引导区，它将其替换为\
    \ GRUB/LILO；\n- 如果发现 GRUB 或 LILO 引导区，它将其替换为新的；\n- 如果疑问，DrakX 将显示一个带有各种选项的对话框：\n\
    \n- 使用的引导程序：你有三种选择：\n  - 1. 图形菜单 LILO：如果你喜欢图形界面的 LILO。\n  - 2. GRUB：如果你喜欢 GRUB（文本菜单）。\n\
    \  - 3. 文本菜单 LILO：如果你喜欢文本界面的 LILO。\n- 启动设备：大多数情况下你不会更改默认 (/dev/hda)，但如果你需要，可以将引导程序安装在第二个硬盘\
    \ (/dev/hdb) 甚至软磁盘上。\n- 启动默认镜像之前的延迟：重启计算机时，这是授予用户选择默认项之外的其他项目的等待时间。\n\n> 注意，如果你选择不安装引导程序（在此选择“取消”），你必须确保你有办法启动\
    \ Mandrake Linux 系统！在更改任何选项之前，请确保你清楚自己在做什么。\n\n 提示：点击此对话框中的“高级（Advanced）”按钮将为你提供留给专家级用户的高级选项。\n\
    \nMandrake Linux 安装它自己的引导程序，该程序将允许启动 GNU/Linux 或你系统上的任何其他操作系统。如果你的机器上安装了另一个操作系统，它将自动添加到启动菜单中。在这里，你可以选择微调现有选项。双击现有条目允许你更改其参数或删除它；添加（Add）会创建一个新条目；完成（Done）将进入下一个安装步骤。\n\
    \n"
