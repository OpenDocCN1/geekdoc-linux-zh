    ## A.1.2. 信息页面 (Info Pages)


    info 页面完善了手册页中包含的文档。访问 info 页面的命令是 `info`。


    info 页面具有树形结构，其顶部被称为 `dir`。从那里，你可以访问所有的 info 页面。


    `info` 可以通过两种方式调用：要么省略参数（这将您置于树形结构的最顶端），要么添加命令或包名（如果该项存在，将打开相关的 info 页面）。例如：


    ```

    info emacs

    ```


    在 info 页面中：


    - * Buffers:


    将表示一个链接。将光标移动到此链接（使用方向键）并按回车将带您进入相应的 info 页面。


    你可以使用以下键盘快捷键：


    - * u: 代表 Up（向上），带您进入上一级；

    - * n: 代表 Next（下一个），带您进入同一树形结构层面的下一个 info 页面；

    - * p: 代表 Prev（上一个），带您回到上一个 info 页面。


    通过输入 `?` 可以列出大量的命令。


    ## A.1.3. HOWTOs


    HOWTOs 由 LDP（Linux 文档项目）发布，并提供多种语言，将帮助您配置系统的许多方面。只要安装了正确的包（英文版为 `ninfo-html-en`
    包），HOWTOs 就会为您提供特定问题的答案或针对您硬盘上的某个问题提供解决方案。文档位于 `/usr/share/doc/HOWTO/HTML/en/`
    目录下。它们的主要形式是文本文件，尽管也可以用网络浏览器读取 HTML，并用 PostScript 打印。


    ## 附录 A. 在哪里获取文档


    该列表非常详尽。可以通过咨询主菜单中的索引 `Documentation→HOWTO English` 来了解其长度。当遇到复杂问题时，可以从阅读相应的 HOWTO
    开始（当然，如果它存在的话！）。您不仅会获得解决方案，还能同时学到很多知识。其中，涵盖的内容示例包括网络配置（NET-3-HOWTO）、声卡配置（Sound-HOWTO）、媒体光盘的刻录（CD-Writing-HOWTO）以及
    NIS 和 NFS 配置。


    一个重要的步骤是检查 HOWTO 文档的修改日期——即位于文档开头的发布日期——以确保它们是最新的。否则，其内容可能是无效的。特别要小心与硬件配置相关的旧
    HOWTO，因为 Linux 在该特定领域进化非常快。请记住，在自由软件世界，“旧”一词的分量甚至比普通 IT 领域更有分量：自由软件在出现十五天后可能被认为是旧的！


    > 注意：HOWTOs 在 LDP 网站（http://linuxdoc.org/）上提供，那里的内容可能稍微新一些。请查看以下内容：按分类划分（http://linuxdoc.org/HOWTO/HOWTO-INDEX.html）以及以及常见问题解答（FAQs（http://linuxdoc.org/docs.html#faq））。


