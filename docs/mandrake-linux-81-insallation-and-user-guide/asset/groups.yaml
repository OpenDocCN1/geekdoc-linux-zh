    **注意：** 如果您是首次在刚安装的机器上登录，您将看到 Mandrake 首次向导。更多信息请参见第 57 页的 Mandrake 首次向导。


    ### 8.2.2. 关闭您的会话


    如果一切顺利，您现在进入工作环境。在本节中，我们不再详细描述各种组件，因为这将在后面的章节中进行。根据您之前选择的环境，您将看到以下屏幕之一：


