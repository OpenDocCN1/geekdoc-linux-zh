    # Glossary


    shadow passwords

    a password management suite on Unix systems in which the file containing the encrypted
    passwords is not world-readable, whereas it is when using the normal password
    system. It also offers other features such as password aging.


    # shell


    the shell is the basic interface to the operating system kernel and is what provides
    the command line where users enter to run programs and system commands. All shells
    provide a scripting language which can be used to automate tasks or simplify often-used
    complex tasks. The shell scripts are similar to batch files from the DOS operating
    system, but are much more powerful. Some example shells are bash, sh, and tash.


    # single user


    is used to describe a state of an operating system, or even an operating system
    itself, that only allows a single user to log into and use the system at any time.


    # site dependent


    means the information used by programs like make and make to compile some source
    file depends on the site, the computer architecture, the computer’s installed
    libraries, and so on.


    # socket


    file type corresponding to any network connection.


    # soft links


    see “symbolic links”.


    # standard error


    the file descriptor number 2, opened by every process, used by convention to print
    error messages to the terminal screen by default.

    See Also: standard input, standard output.


    # standard input


    the file descriptor number 0, opened by every process, used by convention as the
    file descriptor from which the process receives data.

    See Also: standard error, standard output.'
  - '[PAGE 346]


    # Glossary


    standard output

    the file descriptor number 1, opened by every process, used

    by convention as the file descriptor in which the process

    prints its output.

    See Also: standard error, standard input.


    streamer

    is a device that takes “streams” (not interrupted or divided

    in shorter chunks) of characters as its input. A typical strea-

    mer is a tape drive.


    switch

    Switches are used to change the behavior of programs, and

    are also called command-line options or arguments. To de-

    termine if a program has optional switches that can be used,

    read the man pages or try to pass the -help switch to the

    program (ie. program -help).


    symbolic links

    special files, containing nothing but a string that makes re-

    ference to another file. Any access to them is the same as ac-\ccessing the file
    whose name is the referenced string, which

    may may not exist, and the path to which can be given

    in a relative or an absolute way.


    target

    is the object of compilation, i.e. the binary file to be genera-

    ted by the compiler.


    telnet

    creates a connection to a remote host and allows you to log

    to the machine, provided you have an account. Telnet is

    the most widely-used method of remote logins, however

    there are better and more secure alternatives, ssh.


    theme-able

    a graphical application is theme-able if it is able to change

    a appearance in real time. Many window managers are

    theme-able as well.


    traverse

    for a directory on a Unix system, this means that the user is

    allowed to go through this directory, and possibly to direc-

    tories under it. This requires that the user has the execute

    permission on this directory.'
