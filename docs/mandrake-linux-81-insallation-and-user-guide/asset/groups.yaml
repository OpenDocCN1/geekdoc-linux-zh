    # Chapter 8. Linux for Beginners


    After clicking on the icon, the screen will shade and a little box will pop up
    with options. Simply ignore the messages and options for now and click the Yes
    button.


    # 8.2.3. Some Notes About Security


    It is important to assimilate a few security notions in regards with your Mandrake
    Linux box. Some of them might seem a little obvious to some people, but here they
    are:


    +   - Do not write down your password on any piece of paper (a post-it for example)
    that can be seen by anyone.

    - Always make sure your password is complex enough to keep people from guessing
    it, but simple enough for you to remember it :-) Try to use a mix of numbers and
    letters with mixed case for your passwords.


    > Tip: It is a good idea to think of a sentence you can remember easily. Then,
    take the first letters and/or numbers of every word in the sentence to form a
    password. For example, the sentence: “I was born on September 10th 1973” would
    make up the password: Iwbo101973 which is easy to remember (hey, it is your birth
    date after all...) and not so easy to guess.


    +   - When you do not want to use your computer anymore, it is better to close
    it completely. That is, do not just log out of it, but shut it down. This can
    be done using the Shutdown button in the login window. In a Terminal, "su" to
    root and then type shutdown now -h or halt.


    The list above is not extensive at all. There are many things you can think of
    in order to make your system more secure. A more detailed analysis of security
    under Mandrake Linux is done in msec – Mandrake Security tools of the Reference
    manual.'
