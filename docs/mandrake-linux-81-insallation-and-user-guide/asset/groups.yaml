    # Chapter 5. Installation with DrakX\n\n## 5.1. Introduction to the Mandrake Linux\
    \ Installer\n\nDrakX is Mandrake Linux's installation program. It possesses a\
    \ graphical user interface and is very easy to use. It allows you to go back at\
    \ any time to previous configuration steps, even choosing the type of installation\
    \ that you want (depending upon your skill level).\n\n> Warning\n> In order to\
    \ ensure the installation occurs in the best possible conditions, make sure to\
    \ plug in and power-on all the devices which will be used on your computer: printer,\
    \ modem, scanner, etc. Hence, DrakX will automatically detect and configure them.\n\
    \n![](img/44017b5ddbff38ec085831b3cde64d5d_46_0.png)\n\nFigure 5-1. Very First\
    \ Installation Welcome Screen\n\nWhen you begin the installation – either from\
    \ a CD-ROM or a floppy disk, you will first get a screen which offers help (figure\
    \ 5-1). Doing nothing will simply begin the installation in normal mode. Pressing\
    \ F1 opens a help screen (figure 5-2). Here are some useful options to choose\
    \ from:\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_47_0.png)\n\nFigure 5-2. Available\
    \ Installation Options\n\n- vgalo: if you tried a normal installation and could\
    \ not get the normal graphical screens as shown below, you may try the installation\
    \ in low resolution, simply by issuing vgalo at the prompt presented here.\n-\
    \ text: if your video card is really old, and graphical installation does not\
    \ work at all, you can always choose the text mode installation.\n- expert mode:\
    \ in some rare cases, hardware detection may freeze your computer. Should that\
    \ happen, use this mode to prevent it from happening. However, you will need to\
    \ provide hardware parameters by hand. expert is an option to the previous modes\
    \ (or linux, the common mode).\n- kernel options: you can pass these command-line\
    \ parameters to the installation kernel. It is particularly useful for machines\
    \ which the installation program cannot determine the amount of memory installed.\
    \ Then, you just need to specify it manually as an option to the installation\
    \ modes with mem=xxx. For example, to start the installation in normal mode with\
    \ a computer having 256 MB of memory, issue at the command line:\nboot: linux\
    \ mem=256M\n\nOn the left, you can see the various installation steps. Depending\
    \ on the installation's progress level, some stages may or may not be available.\
    \ If they are available, they will be highlighted when you move the mouse cursor\
    \ over them.\n\nThe buttons representing the various stages can also be of different\
    \ colors:\n\n- red: this installation phase has not yet been carried out;\n- orange:\
    \ the installation stage which is currently being processed;\n- green: this installation\
    \ stage has already been configured. However, nothing stops you from going back\
    \ to it if you need or want to.\n\nThis guide assumes that you are performing\
    \ a standard, step-by-step installation, as shown in the following screenshots.\n\
    \n## 5.2. Choosing your Language\n\nThe first step is to choose your preferred\
    \ language.\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_49_0.png)\n\nPlease choose\
    \ your preferred language for installation and system usage.\n\nClicking on the\
    \ Advanced button will allow you to select other languages to be installed on\
    \ your workstation. Selecting other languages will install the language-specific\
    \ files for system documentation and applications. For example, if you will host\
    \ users from Spain on your machine, select English as the main language in the\
    \ tree view and under the Advanced section click on the grey star corresponding\
    \ to Spanish|Spain.\n\nNote that multiple languages may be installed. Once you\
    \ have selected any additional locales click the OK button to continue.\n\n##\
    \ 5.3. License Terms of the Distribution\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_50_0.png)\n\
    \nBefore continuing you should read carefully the terms of the license, and if\
    \ you do not agree with all the terms, click the Refuse button which will immediately\
    \ terminate. To continue with the installation, click the Accept button.\n\n##\
    \ 5.4. Installation Class\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_51_0.png)\n\
    \nDrakX now needs to know if you want to perform a default (Recommended) installation\
    \ or if you want to greater control (Expert). Install will completely wipe the\
    \ old system. Select Upgrade if you are upgrading an existing system.\n\nDepending\
    \ on your knowledge of GNU/Linux, please choose one of the following to install:\n\
    \n- Recommended: choose this if you have never installed an operating system.\
