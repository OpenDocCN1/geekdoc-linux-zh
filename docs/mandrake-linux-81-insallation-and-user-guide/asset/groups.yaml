    # Chapter 14. Mandrake Control Center


    ## 14.15. Managing the fonts available on your system


    This tool allows one to review the different font families, styles, and sizes
    available on the system.


    The main window (figure 14-34) even renders a visual appearance of all font combinations.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_265_0.png)


    Figure 14-34. The drakfont main window


    It allows you to add fonts you have downloaded from the Internet, and to remove
    fonts in order to save space. But the most interesting feature is probably the
    one that allows you to use the fonts that are available elsewhere on your machine
    in your Windows installation. Simply click on Get Windows fonts, a list of all
    fonts available on your Windows partitions will be displayed. You may then choose
    to install some or all of these fonts.


    **Tip:** To select a range of fonts click on the first font you wish to select,
    move to the last to select and click on it while keeping the Shift key pressed.
    To select individual fonts, hold the Ctrl key down as you click on the selections.


    ## 14.16. Managing users on your system


    userdrake is an advanced utility for Mandrake Linux which allows the System Administrator
    to easily add users to the system, to remove others, arrange users in groups,
    and to manage groups in the same manner.


    We will focus on users only here, group management is very similar.


    ### 14.16.1. The interface


    Launching userdrake will display the main window (figure 14-35), which lists the
    users currently defined on the system. You can switch from users to groups going
    to View→View groups.


    | Fichier Actions | Options | Aide |

    | :--- | :--- | :--- | :--- |

    | Enregistrer | Ajouter Éditer Supprimer | | |

    | Login | Identifiant | Identifiant | Répertoire per | Commentaire | Interprète
    de | Groupes |

    | queen | 504 | 511 | /home/queen | Queen Ping | /bin/bash | xrq, usb, c |


    Figure 14-35. The users list in userdrake


    The topology of the window is standard, the three buttons Add, Edit and Remove
    are also accessible from the Action menu.


    You can make as many changes as you wish, the effect on your user database will
    be effective only after pressing the Save button. You can go back to the current
    users database at any time by going to File→Reload menu entry.


    ### 14.16.2. Let''s add a new user


    We created the standard user Queen Pingusa, at installation time, and now we need
    to create a new user called Peter Pingus, and then make them both members of the
    group urppi, so that they can install packages without having root password.


    Click on the Add button, the dialog to add a new user will pop-up (figure 14-36).
    The only field required is the login, you can also choose to add a comment, generally
    this is the full name of the user.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_267_0.png)


    Figure 14-36. Adding a new user in the system


    We have now two users in our list, select both of them with your mouse (clicking
    the first one, and move the cursor to the second without releasing the button),
    and click the Edit button. The dialog which displays now (figure 14-37), shows
    the list of available groups on the right, and the list of groups of which the
    selected users are members. look for the urpmi group on the right, highlight it
    by clicking on it and click the Add button between the two lists.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_268_0.png)


    Figure 14-37. Affect users to a group


    **Note:** All dialogs under userdrake have a little message just above the buttons.
    It generally says All is correct, but if you choose something ambiguous or which
    is not allowed, this message will warn you. After clicking OK, you can check on
    the users list, that the last field contain the group urppi.


    ## 14.16.3. Other features


    The parameters dialog (figure 14-38) accessible through View→Edit (Ctrl-P), allows
    you to tune the way lists are displayed and some options.


    | General | User view | Group user |

    | :--- | :--- | :--- |

    | Don''t show user with less than 500 | | |

    | Default shell: | /usr/bin/bash | |

    | Default home: | /home | |


    Figure 14-38. The userdrake parameters


    First of all, users whose UID is lower than 500 are virtual users used by the
    system and are not valid for real users. You can choose to display them or not
    in the users lists here. The following User tab (figure 14-39), allows you to
    select the fields to display in the users list. Simply deactivate the check box
    associated to fields are not interested in. The Group view has the same goal.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_270_0.png)


    Figure 14-39. The userdrake user view


    **Note:** When you select various users and click the Edit button, if the groups
    to which they belong are different, then the display will be slightly different
    (figure 14-40): in that case, only the user Peter Pingus is a member of the group,
    then the item appears in light grey in both lists.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_271_0.png)


    Figure 14-40. Groups are different for users


    ## 14.17. Adjust date and time


    This little tool allows you to setup the correct internal date for your system.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_272_0.png)


    Figure 14-41. Date and time


    You can set the date on the left and the time on the right:


    - To change the year, click the little arrows on each side of the year.

    - To change the month, click the little arrows on each side of the month.

    - This updates the month view where you can click on the current day to highlight
    it.

    - It is recommended to check the time zone settings are correct for your physical
    location. Click on the Time Zone button and select the correct place in the tree
    view.

    - To change the time you can then move the hour, minute and second hands of analog
    clock or change the numbers below.


    When you have finished, click OK to apply your settings or Cancel to close the
