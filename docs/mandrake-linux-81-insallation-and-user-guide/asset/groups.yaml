    the sidebar''s tab (default is six minutes). The second one lets you set the update
    frequency (default is five minutes).


    ## 11.2.2.4. Browsing the Web


    Like Konqueror, Nautilus acts as a file manager and a web browser. Simply type
    a web address in the Location Bar and go!


    ![](img/44017b5ddbff38ec085831b3cde64d5d_183_0.png)


    Figure 11-40. Browsing the Web with Nautilus


    In order to view only the web page you typed, go in View→Hide Sidebar.


    ### 11.2.2.4.1. Searching for the Web


    Simply click on the Web Search button located in the toolbar and your defined
    search engine''s page will automatically open. You can also access this feature
    by pressing on Shift-Ctrl-F.


    ## 11.3. General Internet Use


    If you feel your general knowledge of Internet is low, then this section is for
    you. Others may want to browse those pages but keep in mind that this section
    will reveal only basic stuff how to browse, write mails, etc.


    Note: Many web browsers and mail clients exist. For the purpose of this book,
    we will speak about netscape, which is arguably the most used. All browsers and
    mail clients work in very similar fashions so, generally speaking, the information
    contained in this section applies to most web browsers and mail clients.


    ## 11.3.1. Configuring your Mail Client


    To open netscape, access your GNOME or KDE menu and then go in Networking→E-Mail→Netscape
    Messenger.


    Then, you need to configure your mail client and browser in order to go any further.
    For this, you need your username, your password, your POP /IMAP server name, your
    SMTP server name and your NNTP server name. If you do not have this info, get
    it!


    ### 11.3.1.1. Identity


    To configure your mail client, go in the Edit menu and select the Preferences
    sub-menu. There you will find a Mail & Newsgroups category. Select the first one,
    that is Identity. Fill in the blanks: your name, e-mail address (the two latter
    fields are mandatory), reply-to address, organization and signature file items.
    You can create a signature file which will identify you. To do so, open your favorite
    text editor and write what you want your fellow web surfers to know you as. Then
    Save the file as .signature.txt and you are up and running.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_185_0.png)


    Figure 11-41. Your Identity


    **Note:** The following sections are all configured in the Edit→ Preferences sub-menu.
    We will not repeat this throughout it since it would perfectly redundant, don''t
    you think?


    ### 11.3.1.2. Mail Servers


    In order to log on to the Internet, you must go through a mail server. For it
    to work properly, choose the Edit button and type in your server''s name (i.e.:
    Mandrakesoft.com). If you are using a POP mail server, you may only use one mail
    server and your mail will be held on your computer. On the other hand, if you
    use an IMAP mail server, you may utilize as many mail servers as you like while
    your mail is kept on the server.

    '
