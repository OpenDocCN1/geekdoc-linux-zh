    # Glossary


    insert mode under $\sqrt{i}$ or one of its clones, it is the state of the program
    in which pressing a key will insert that character in the file being edited (except
    pathological cases like the completion of an abbreviation, right justify at the
    end of the line, ...). One gets out of it pressing the key Esc (or Ctrl-I).


    # Internet


    is a huge network that connects computers around the world.


    # IP address


    is a numeric address consisting of four parts which identifies your computer on
    the Internet. IP addresses are structured in a hierarchical manner, with top level
    and national domains, domains, subdomains and each machine''s personal address.
    An IP address would look something like 192.168.0.1. A machine''s personal address
    can be one of two types: static or dynamic. Static IP addresses addresses never
    change, but rather are permanent. Dynamic IP addresses mean your IP address will
    change with each new connection to the network. Dial-up and cable modem users
    typically have dynamic IP addresses while some DSL and other high-speed connections
    provide static IP addresses.


    # ISO 8859


    The ISO 8859 standard includes several 8-bit extensions to the ASCII character
    set (see ASCII). Especially important is ISO 8859-1, the "Latin Alphabet No. 1",
    which has become widely implemented and may already be seen as the facto ASCII
    replacement.


    ISO 8859-1 (figure 2) supports the following languages: Afrikaans, Basque, Catalan,
    Danish, Dutch, English, Faroese, Finnish, French, Galician, German, Icelandic,
    Irish, Italian, Norwegian, Portuguese, Scottish, Spanish, and Swedish.'
