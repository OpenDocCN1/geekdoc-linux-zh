    ## Chapter 10. Using GNOME


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_0.png)


    Figure 10-2. GNOME Panel


    As you can see in the figure, essential applets and programs are included in the
    panel. Starting on the left-hand side is the GNOME menu, where all your applications
    (whether text editors, multimedia or games) lie.


    **Note:** If you wish to add programs or applets to your panel, simply go in the
    GNOME menu, select the desired application and right-click on it. A pop-up menu
    will show an Add this launcher to panel item. Release your mouse on that message
    and the program/applet will be added to your panel.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_2.png)


    Next to it is the Log-Out Applet. It allows you to log out of your session, either
    because you are leaving work, or to let other users utilize the computer, etc.
    Now, the word "session" may bewilder you. A session is the length of time contained
    between the moment you log in and log out. If you click on it, it will prompt
    you to save the changes you made to your session (or simply log out if you configure
    properly in the GNOME Control Center, which we will discuss later on) and a box
    holding all the computers'' users (root, your_user_name, etc.) will appear after
    the X server restarts.


    ## Chapter 10. Using GNOME


    The next applet icon is called the Lock Screen. As you probably noticed, most
    GNOME application and applet names are extremely logical. This feature allows
    you to lock your screen when you are away from your computer, therefore avoiding
    unpleasant surprises or colleague pseudo hazing...


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_0.png)


    The two little screens next to the Lock Screen are Screen Shooters. They allow
    you to take snapshots of your screen. After clicking on the blue screen, two little
    screen appear. The one on the left allows to select a particular window, while
    the other grabs the entire screen. This applet is very useful for... user guides
    since it enables precise grasping of screen displays.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_1.png)


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_2.png)


    This is one of our favorites. It maximizes the space on your panel by reducing
    the size of applets/applications. You can include as many as you want (in our
    example: 5). In it, we inserted the Help browser, the GNOME Control Center, a
    GNOME-specific calculator called GNOME Calc, a Save your Session icon and finally,
    the not-so-evil command line also known as the GNOME terminal, which is a GNOME-specific
    Terminal.


    - 1. We use this applet to avoid the annoying prompt when we log out. When you
    log out, a splash screen asks if you want to save the settings you may have changed
    during your session. You can simply click on Save or not if you do not wish to
    save your new settings, if any. You may also configure it in the GNOME Control
    Center.


    **Note:** Many Terminals exist. If you explore the Terminal section in the GNOME
    menu, you will find many options for command lines, such as eterm, xterm, etc.


    ## GNOME Control Center


    This is the application to use in order to configure your graphical environment
    to your liking. Feel free to explore as it contains many options. Personalizing
    your theme, panel, background, appearance, default start-up applications, etc.:
    it''s all in there! Snoop around. If you get lost, refer to the Help browser.


