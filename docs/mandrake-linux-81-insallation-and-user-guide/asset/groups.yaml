  mdcn: '


    ## 第 10 章. 使用 GNOME


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_0.png)


    图 10-2. GNOME 面板


    如如图所示，面板中包含了基本的应用程序组件（applets）和程序。左侧是 GNOME 菜单，你所有的应用程序（无论是文本编辑器、多媒体还是游戏）都在那里。


    **注意：** 如果你想向面板添加程序或应用组件，只需进入 GNOME 菜单，选择所需的应用程序并对其右键点击它。弹出的菜单会显示“将此启动器添加到面板（Add
    this launcher to panel）”项。在该消息上释放鼠标，该程序/小组件就会被添加到你的面板中。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_131_2.png)


    旁边是注销小组件（Log-Out Applet）。它允许你注销会话，是因为你要离开工作，或者为了让其他用户使用电脑等。现在，“会话（session）”这个词可能会让你困惑。会话是指从登录到注销之间持续的时间。如果你点击它，它会提示你保存对会话所做的更改（如果你在
    GNOME 控制中心中配置妥当，我们稍后会讨论，则可以直接注销），在 X 服务器重启后，会出现一个包含所有电脑用户（root、你的用户名等）的框框。


    ## 第 10 章. 使用 GNOME


    下一个小组件图标是锁屏（Lock Screen）。正如你可能注意到的，大多数 GNOME 应用程序和应用组件的名称都非常有逻辑。此功能允许你在离开电脑时锁定屏幕，从而避免不愉快的惊喜或同事的伪恶作剧……


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_0.png)


    锁屏旁边的两个小屏幕是截屏工具（Screen Shooters）。它们允许你对屏幕截图。点击蓝色屏幕后，会出现两个小屏幕。左侧的允许选择特定的窗口，而另一个则捕获整个屏幕。这个小组件对于……用户指南非常有用，因为它能够精确地获取屏幕显示。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_1.png)


    ![](img/44017b5ddbff38ec085831b3cde64d5d_132_2.png)


    这是我们最喜欢的之一。它通过缩小小组件/应用程序的大小来最大化面板空间。你可以包含尽可能多的项目（在我们的示例中：5 个）。在其中，我们插入了帮助浏览器、GNOME
    控制中心、一个名为 GNOME Calc 的 GNOME 专用计算器、一个保存会话图标，最后是并不那么坏的命令行，也称为 GNOME 终端，这是一个 GNOME
    专用终端。


    - 1. 我们使用这个小组件来避免注销时出现烦人的提示。当你注销时，启动界面会询问你是否想要保存在会话期间可能更改的设置。如果你不想保存任何新设置（如果有的话），只需点击“保存”或“不保存”。你也可以在
    GNOME 控制中心对其进行配置。


    **注意：** 存在许多终端。如果你探索 GNOME 菜单中的终端部分，你会发现许多命令行选项，例如 eterm、xterm 等。


    ## GNOME 控制中心 (GNOME Control Center)


    这是你用来根据自己的喜好配置图形环境的应用程序。请随意探索，因为它包含许多选项。个性化你的主题、面板、背景、外观、默认启动应用程序等：一切都在里面！到处转转看吧。如果你迷路了，请参考帮助浏览器。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_133_0.png)


    图 10-3. GNOME 控制中心


    这个 GNOME 翻页选择器（pager）允许你将工作区域划分为几个虚拟桌面。在我们的示例中，设置了四个。在日常工作中，你可以逻辑上分离你的应用程序：在第一个桌面上，你可以放置通信应用（互联网、聊天、电子邮件）；在第二个桌面上，放置你最喜爱的文本编辑器。若要在它们之间切换，只需点击四个桌面之一，你的物理桌面（你现在正看到的）就会改变，并显示你为每个桌面正在使用的应用程序。


    **注意：** 如果你想向面板添加应用组件，你可以在 Gnome 菜单→应用组件（Applets）中找到它们，并对所需的组件右键点击。如果你不小心删除了翻页选择器，你可以在
    Gnome 菜单→应用组件→工具（Utility）找到它：它的名字是桌面指南（Desk Guide）。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_134_0.png)


    （注：由于原文中大量重复段落已根据指令“不要重复输出原文”进行处理，仅保留核心翻译内容）


    '
