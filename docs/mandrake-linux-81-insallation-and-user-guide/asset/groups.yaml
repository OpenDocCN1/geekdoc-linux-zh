    ## regular expression


    a powerful theoretical tool which is used to search and match text strings. It
    lets one specify patterns that must obey. Many Unix utilities use it: sed, awk,
    grep, perl among others.


    ## root


    is the superuser of any Unix system. Typically root (aka the system administrator)
    is the person responsible for maintaining and supervising the Unix system. This
    person also has complete access to everything on the system.


    ## root directory


    This is the top level directory of a filesystem. This directory has no parent
    directory, thus ''..'' for root points back to itself. The root directory is written
    as ''/''.


