    # Chapter 3. Before setup


    The BIOS (Basic Input/Output System) is used to boot up a computer. Specifically,
    it is used to find the device on which the operating system is located and start
    it up. It is also used for the initial configuration of the hardware.


    The appearance of *plug''n''play* and its widespread use means that all modern
    BIOS can initialize these devices, but you still have to ask it to do so. If your
    Windows 9x OS is initializing these devices instead of the BIOS, this will need
    to be changed for use GNU/Linux.


    Changing your BIOS settings is usually performed by holding the DEL key after
    the computer is switched on. Unfortunately, there are many types of BIOS, therefore
    you will have to look for the appropriate option for yourself. The option to look
    for is often called PNP OS installed (or Plug''n''Play OS installed). Set this
    option to No and the BIOS will then initialize any plug''n''play devices. This
    can help GNU/Linux recognize devices in your machine which it would otherwise
    be able to initialize.


    If your BIOS can boot from the CD-ROM and you want to perform a standard installation
    of Mandrake Linux, you can also set your BIOS to boot from the CD-ROM searching
    the hard disk. Look for Boot sequence in the BIOS features setup.


    > Note: If you want to use a printer connected to your machine: make sure that
    the parallel port mode is set to ECP+EPP (or least one of them) If it''s not set
    this way, you will still be able to print, but your printer will not be auto-detected
    so you will have to configure it by hand. Also make sure that the printer is powered-on
    and properly connected to your machine beforehand.


    ## 3.2. Creating a “boot-disk”


    If you cannot boot from the CD-ROM, and if Windows is not installed on your computer,
    you will need to create a “boot-disk”.


    The CD-ROM contains all of the image files and utility programs needed. You will
    also need to create a “boot-disk” if you wish to use a boot-loader other than
    LILO or grub. If Windows is installed on your computer, you will not need a boot-disk,
    so you may skip this step and go on to “Installation with DrakX”, page 23.


    The boot images are in the images directory on the CD-ROM. For this method of
    installation, the significant file is named cdrom.


    We use the image cdrom.img when you install the distribution from a CD-ROM. However,
    many other images are available to perform installs:


    - *cdrom.img*: to install from a local IDE or SCSI CD-ROM drive. This has to be
    used in case you cannot boot computer directly from the CD-ROM, by changing BIOS
    settings.

    - network.img: to install from a NFS, FTP, HTTP repository. The network configuration
    of the machine to be installed may be manual or automatic.

    - pcmia.img: if the installation media is reached through a PCMCIA card (network,
    CD-ROM, ...)

    - hd.img: use this image in the case where you were not able to perform the install
    from a CD-ROM. You just need to copy the content of the CD onto the hard drive
    (either on a FAT ext2fs or reiserfs partition), and with the floppy containing
    that

    - usnet.img: this image allows you to perform a network installation, but through
    a USB port.

    - other.img: this installation image provides less common drivers such as NET
    and SCSI drivers. Try this image if the others failed.


    ### 3.2.1. Under Windows


    You need to use the program called rawwrite. This can be found on the CD-ROM dosutils
    directory (figure 3-1).


    ![](img/44017b5ddbff38ec085831b3cde64d5d_30_0.png)


    Figure 3-1. The dosutils directory


    > Note: in this example, the CD-ROM drive is designated by the letter D:; you
    will naturally have to choose the letter designating the CD-ROM drive on your
    own machine.


    You may have noticed that there is a DOS version, rawwrite, of the same program.
    It is, in fact, the original version of the program: rawwrite is a graphical front-end
    to it.


    Start the program, as shown in figure 3-2.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_31_0.png)


    Figure 3-2. The rawwrite program


    Select the boot image to copy and the target device (here A: as illustrated in
    figure 3-3).


    ![](img/44017b5ddbff38ec085831b3cde64d5d_32_0.png)


    Figure 3-3. An example of using rawwrite


    Then, if you haven''t already done so, insert an empty disk into your chosen floppy
    drive and click on Write. When completed, click on Exit, you have a boot disk
    to install your Mandrake Linux distribution.


    ### 3.2.2. Under GNU/Linux


    If you already have GNU/Linux installed (another version, or on another machine,
    for example that of a friend who has lent you his Mandrake Linux CD), then carry
    out the following steps:


    1. mount the CD-ROM. Let us suppose that the mount point is /mnt/cdrom;

    2. log in as root;

    3. insert an empty disk into the drive and type:


    ```

    $ dd if=/mnt/cdrom/images/cdrom.img of=/dev/fd0

    ```


    Note: Replace /dev/fd0 /dev/fd1 if you are using the second floppy drive and,
    of course, the name of the image with the one you want. When completed, your boot
    disk is ready.


    ## 3.3. Supported hardware


    Mandrake Linux can handle a large number of hardware devices, and the list is
    far too long to be quoted in its entirety here. Nevertheless, some of the steps
    described in this chapter will help you to find out if your hardware is compatible
    and configure some the problematic devices.


    You may consult an up-to-date list of supported hardware on our web-site (http://www.mandrakelinux.com/en/hardware.php3)


    > Legal disclaimer: The Mandrake Linux Supported Hardware List contains information
    about hardware that have been tested and/or been reported to function properly.
    Due to the wide variety of system configurations, Mandrake cannot guarantee that
    a specific device will work on your system.


    ### 3.3.1. What''s not supported


    Some types of hardware cannot presently handled by GNU/Linux, either because the
    support is still in experimental stage, because nobody has written a driver for
    the devices, or because it has been decided for valid reasons that they cannot
    be supported. For example:


    - winmodems, also called controller-less modems or software modems. If your modem
    is a PCI modem, the root user look at the output of /proc/pci. This will tell
    you the I/O port and IRQ of the device. Then use the setserial command (for our
    example, I/O address is 0xb400 and IRQ is 10) as follows:


    ```

    /dev/tty3 port 0xb400 irq 10 16550

    ```


    Then see if you can query your modem using minicom or kppp. If it doesn’t work,
    you may have a software modem. If it does work, create the file /etc/rcerial and
    place the appropriate setserial command line in. A recent project is trying to
    make software modems work under GNU/Linux. If you happen to have this type of
    hardware in your machine, you may have a look at Lin-modems (http://linmodems.org/)
    and modems and win-modems (http://www.o2.net/~gromit/winmodem.html).


    - USB devices: support for USB is now extensive. Most peripherals are fully supported,
    you can get the list of supported hardware at Linux-USB device (http://www.qbik.ch/usb/devices/).


    ### 3.3.2. Collecting information on your hardware


    GNU/Linux hardware resources are now much better supported and, apart from the
    devices mentioned in the previous section, you can expect the rest of your hardware
    to work correctly.


    Some types of devices are still problematic with GNU/Linux, especially plug’n’play
    devices: but you can use Windows to discover their working configuration. If you
    intend to install Mandrake Linux while leaving a version of Windows on your machine,
    you can ignore this section at first, and then come back here if you experience
    problems under GNU/Linux.


    For this, boot under Windows, right-click on the My icon, choose Properties, select
    the tab Device Manager, then select View devices by connection (figure 3-4).


    ![](img/44017b5ddbff38ec085831b3cde64d5d_35_0.png)


    Figure 3-4. The Windows Device Manager


    If you have ISA devices, you can view them when you bring up the directory structure
    (figure 3-5).

