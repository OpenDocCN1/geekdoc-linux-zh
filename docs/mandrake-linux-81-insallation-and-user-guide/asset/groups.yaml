  - '[PAGE 337]


    # Glossary


    # launch


    is the action of invoking, or starting, a program.


    # library


    is a collection of procedures and functions in binary form to be used by programmers
    in their programs (as long as the library''s license allows them to do so). The
    program in charge of loading shared libraries at run time is called the dynamic
    linker.


    # link


    reference to an inode in a directory, therefore giving a (file) name to the inode.
    Examples of inodes which don''t have a link (and hence have no name): anonymous
    pipes (used by the shell), sockets (aka network connections), network devices
    and so on.


    # linkage


    last stage of the compile process, which consists in linking together all object
    files in order to produce an executable file, and matches unresolved symbols with
    dynamic libraries (unless a static linkage has been asked, in which case the code
    of these symbols will be included in the executable.


    # Linux


    is a Unix-like operating system which runs on a variety of different computers,
    and is free for anyone to use and modify. Linux (the kernel) was written by Linus
    Torvalds.


    # login


    connection name for a user on a Unix system, and the connection to connect.


    # lookup table


    is a table that puts in correspondanceance codes (or tags) and their meaning.
    It is often a data file used by a program to get further information about a particular
    item. For example, harddrake uses this table to know what a manufacturer''s product
    code means. This is one line from the table, giving information about item CTL0001


    ```

    CTL0001 sound    Creative Labs SB16 \

    HAS_OPL3|HAS_MPU401|HAS_DMA16|HAS_JOYSTICK

    ```'
  - '[PAGE 338]


    # loopback


    virtual network interface of a machine to itself, allowing the running programs
    not to have to take into account the special case where two network entities are
    in fact the same machine.


    # major


    number specific to the device class.


    # manual page


    a small document containing the definition of a command and its usage, to be consulted
    with the man command. The first thing one should (learn how to) read when hearing
    of a command he doesn’t know :-)


    # minor


    number identifying the specific device we are talking about.


    # mounted


    A device is mounted when it is attached to the GNU/Linux filesystem. When you
    mount a device you can browse its contents. This term is partly obsolete as with
    the “supermout” feature, users do not need any more to manually remove removable
    medias.

    See Also: mount point.


    # mount point


    is the directory where a partition or another device is attached to the GNU/Linux
    filesystem. For example, your CD-ROM is mounted in the /mnt/cdrom directory, from
    where you can explore the contents of any mounted CDs.


    # MTU


    The Maximum Segment Size (MSS) is the largest quantity of data that can be transmitted
    at one time. If you want to prevent local fragmentation MSS would equal MTU-IP
    header.


    # MTU


    The Maximum Transmission Unit (MTU) is a parameter that determines the largest
    datagram than can be transmitted by an IP interface without needing to be broken
    down into smaller units. The MTU should be larger than the largest datagram you
    wish to transmit unfragmented. Note,'
  - '[PAGE 339]


    this only prevents fragmentation locally, some other link in the path may have
    a smaller MTU and the datagram will be fragmented there. Typical values are 1500
    bytes for an ethernet interface, or 576 bytes for a SLIP interface.


    # multitasking


    the ability for an operating system to share CPU time between several processes.
    At low level, this is also known as multiprocessing. Switching from one process
    to another requires all the current process context be saved and restored when
    this process is elected again. This operation is called context switch; therefore
    it’s fast enough so that a user has the illusion that the operating system runs
    several applications at the same time. There are two types of multitasking: preemptive\u2013multitasking
    is where the operating system is responsible for taking away the CPU and pass
    it to another process; cooperative multitasking is where the process itself gives
    back the CPU. The first variant is, obviously, the better choice because no program
    can consume the entire CPU time and block other processes. GNU/Linux does preemptive
    multitasking. The policy to select which process should be run, depending on several
    parameters, is called scheduling.


    # multiuser


    is used to describe an operating system that allows multiple users to log into
    and use the system at the exact same time, each being able to do their own work
    independent of other users. A multitasking operating system is required to provide
    multiuser support. GNU/Linux is both a multitasking and multiuser operating system,
    as any Unix system for that matter.


    # named pipe


    a Unix pipe which is linked, as opposed to pipes used in shells. See also pipe,
    link.


    a word commonly used in computing for a method to identify objects. You will often
    hear of "naming conventions" for files, functions in a program and so on.'
