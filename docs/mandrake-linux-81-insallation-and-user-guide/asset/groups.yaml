    # 第 14 章 Mandrake 控制中心


    ![](img/44017b5ddbff38ec085831b3cde64d5d_229_0.png)


    图 14-4. 选择是否重放步骤


    在显示关于我们将要执行的操作警告屏幕后，我们会获得一个大部分安装步骤的列表。每个步骤都对应一个双选项菜单选择：


    - replay（重放）：如果你想在自动化安装中重用你在手动安装期间所做的选择，请选择此项。

    - manual（手动）：如果你喜欢在自动化安装期间手动重新配置此步骤，请选择此项。


    当你为每个安装步骤做出选择后，点击 OK 按钮。系统会提示你插入一张空白软盘（所有数据将被擦除）。


    再次点击 OK 后，将创建一个具有以下特征的启动软盘：


    - 安装方法（来自 CD-ROM、通过 NFS、FTP 等）与当前正在操作的机器安装时使用的相同；

    - 所有标记为 replay（replay）的步骤将按照当前机器安装期间所做的所有选择进行重放；

    - 所有标记为手动（manual）的步骤在安装期间必须手动配置；

    - 出于安全考虑，分区和格式化步骤将始终为手动操作。


    然后，你只需要将生成的软盘插入到你想要复制安装的机器中，打开电源，并配置少数剩余的手动步骤，这将为你节省大量时间。


    ## 14.4. 修改显示器分辨率


    ### 14.4.1. X 配置简单模式


    如果安装时配置的亮度不符合你的需求，这个小工具允许你更改屏幕的视频分辨率。你在窗口中（图 14-5）有两个选择：系统的分辨率（单位为像素）和深度（颜色数）。只需选择你想要使用的项并点击
    OK 按钮。


    | 选择分辨率和色彩深度（显卡：RIVA128） | |

    | :--- | :--- |

    | 640x480 | |

    | 800x600 | |

    | 1024x768 | |

    | 1280x1024 | |

    | 65536 色 (16 位) | |

    | 确定 | 取消 |

    | 显示全部 | |


    图 14-5. 选择新分辨率


    然后一个新的对话框将询问你是否想要测试新选择（图 14-6）。强烈建议进行测试，因为如果不起作用，恢复图形环境将变得困难。


    | 我可以设置你的计算机在启动时自动启动 X。 | |

    | :--- |

    | 你希望在重启时启动 X 吗？ |

    | 是 | 否 |


    图 14-6. 测试新视频


    更改将在退出并重启后激活。


    ### 14.4.2. X 配置专家模式


    你可以访问更高级的工具来修改正在使用的屏幕或显卡。只需在简单模式下点击“专家模式”按钮即可。你将看到多个屏幕，每个屏幕对应图形配置的一个方面：


    取决于你的显卡，你可能会先被询问想要使用哪种图形服务器。根据你的显卡，你可以在不同的版本或 3D/2D 加速之间选择。如果你的显卡支持多种显示（多头），你也将拥有该选项。


    更改分辨率

    这与简单模式下提供的选项相似，区别在于“显示全部”按钮，它可以让你访问更多的分辨率和色彩深度。


    测试配置

    强烈建议进行测试，因为如果不起作用，恢复图形环境将变得困难。


    启动时的 X

    如果你倾向于在启动时使用文本登录，请回答“否”。选择“是”将启动图形管理器。


    如果图形测试成功，你将看到一个允许更改更多参数的菜单，以便找到有效的参数：


    更改显示器

    此选项将显示一个包含所有主要显示器品牌和模型的树。首先展开对应于显示器的分支，然后选择你正在使用的型号。


    更改显卡

    与显示器的原理相同，选择你的显卡品牌和型号。


    更改分辨率

    此选项仅提供分辨率和色彩深度选择框。


    显示信息

    这是一个总结了当前硬件的简单窗口：


    - 键盘布局：fr

    - 鼠标类型：PS/2

    - 鼠标设备：psaux

    - 显示器：monitor1

    - 显示器水平同步：30-70

    - 显示器垂直刷新：50-160

    - 显卡：RIVA128

    - 显存：4096 kB

    - 色彩深度：65536 色 (16 位)

    - 分辨率：800x600

    - XFree86 服务器：SVGA

    - XFree86 驱动：nv


    ![](img/44017b5ddbff38ec085831b3cde64d5d_232_0.png)


    图 14-7. X 信息窗口


    ## 再次测试

    建议在关闭 hardrake 之前对你的配置进行最终测试；这将确保你在重启图形服务器时不会出现问题。


    ## 14.5. 配置你的硬件


    ### 14.5.1. 简介

    hardrake 项目旨在通过提供易用的界面来简化 GNU/Linux 下的硬件配置。


    hardrake 由两部分组成：


    1. 一个名为 hardrake 的主工具，用于配置硬件。

    2. 一个向导工具（可以外部调用）。


    ### 14.5.2. hardrake


    #### 14.5.2.1 描述

    你上一次在 GNU/Linux 系统上安装新声卡却无法让其工作是什么时候？hardrake 是一个基于图形界面的工具，它集成了许多 Linux 发行版中的工具，以自动化并简化硬件安装。在某些情况下，你会看到配置按钮，这将允许你配置选定的设备。


    一方面，hardrake 用于显示信息。另一方面，你可以在此界面内调整 I/O 和 IRQ 设置。hardrake 使用 detect 库，因此如果你的新硬件没有被检测到，你只需要升级
    detect 即可。


    #### 14.5.2.2 使用

    要启动 hardrake，你可以从以下地方启动：


    - 控制中心：点击 Hardrake 图标。

    - 终端：输入 `hardrake`，这样你可以传递参数。

    - GNOME 和 KDE：前往面板。hardrake 位于“配置/系统”组。


    在等待屏幕（指示检测过程）之后，你会看到一个像图 14-8 所示的窗口。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_235_0.png)


    图 14-8. hardrake 主窗口


    在左侧，你可以看到显示所有分类树。对于某些类别，你会注意到“[+]”符号。通过点击它，子树将展开，该类别下的所有检测到的硬件将列出来。图 14-9 显示了这样一个窗口。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_236_0.png)


    图 14-9. hardrake - 选中设备


    如果你选择一个设备，你将获得关于它的信息。在某些情况下，你会看到配置按钮，这将允许你配置选定的设备。在 14-9 中，我们展开了树的部分并选择了一个类别的设备。在右侧，你可以看到选定设备的信息。如果你按下“运行配置工具”按钮，与设备相关的配置工具将会出现并让你配置该卡。


    有一个特殊的类别称为“其他设备”，包含了系统中所有当前未知的硬件。有关如何帮助我们将这些未知硬件添加到数据库的相关信息。通过报告请求的信息，你可以希望在未来的版本中识别你的硬件！


    在图 14-10 中，你可以看到一个特殊情况，用户被要求向 hardrake 团队报告 ID（mailto:hardrake@mandrakesoft.com）。在大多数情况下，你会被要求发送“pnpdump”的输出。


    '
