    reads the data at the other end. Unix pipes are FIFOs, so the data is read at
    the other end in the order it was sent. Very widely used with the shell. See also
    named pipe.


    ## pixmap


    is an acronym for “pixel map”. It’s another way of referring to bitmapped images.


