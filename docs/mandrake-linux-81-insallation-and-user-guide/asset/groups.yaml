    ## Chapter 6. Connecting for the First Time with Mandrake Linux


    In this chapter, we will discuss the tasks one should perform just after a system
    is installed. In fact, those tasks should be regarded as part of the installation
    process.


    We assume that you are already logged in the system; either because you chose
    auto-login during the installation (Adding a User, page 43), or you manually logged
    in. If you do not know how to log in, please read Beginning and Ending your Session,
    page 65.


    ### 6.1. Mandrake First Time Wizard


    When a user logs into a newly installed Mandrake system for the first time, a
    one-time configuration wizard shows up. This wizard will help you to configure
    three points:


    - Desktop Theme.** This step enables you to choose both the visual appearance
    of your environment and the way you interact with it, so that it better fits your
    expectations.

    - Internet Configuration.** If you did not do it during the installation, the
    wizard seen at “Configuring Internet Connections”, page 181 will be launched to
    help you.

    - Mandrake Registration.** This wizard guides you in the process of registering
    yourself as a Mandrake user. This step requires you to provide personal information;
    please read carefully the “Mandrake Privacy Policy” before you are asked for the
    data.


    After you completed this step, you will receive a confirmation e-mail. See also
    next section: MandrakeOnline, page 57.


    ## Chapter 6. Connecting for the First Time with Mandrake Linux


    ### 6.2. MandrakeOnline Services


    MandraOnline is a new service brought to you by Mandrake-Soft. What is it? A subscription
    offer bringing you extra services in order to make your Mandrake Linux even easier
    to work with.


    This offer consists of three main features:


    - E-mail Alerts. According to the packages and their version installed on your
    machine, you will receive e-mail alerts about potential security threats and security
    updates. The solution brought directly to you in minimum time ensures maximum
    security for your system.

    - Rebates on MandrakeExpert (http://www.mandrakeexpert.com/). Subscribing to MandrakeOnline
    entitles you to rebates on the purchase of support incidents.

    - E-mail Alias. Finally you are given a cool e-mail alias of the form <YourName@mandrakeonline.net>,
    pointing to the e-mail address you provided at subscription time.


    Launch the MandrakeOnline wizard from the icon on the desktop to discover this
    service for a free trial period.


    This wizard first asks you if you already registered your account during the Mandrake
    First Time Wizard, page 57. If not, check the box and follow the subscription
    process. You will be asked to log in, using the information provided by the confirmation-mail
    received soon after the subscription is completed. When this is done, your machine''s
    configuration information is sent to our servers, after you agree of course.


    ### 6.3. Other Optional Configurations


    If your machine is meant always to be connected to the internet or even quite
