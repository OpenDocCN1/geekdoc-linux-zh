    # 第 5 章 使用 DrakX 进行安装\n\n## 5.1. Mandrake Linux 安装程序简介\n\nDrakX 是 Mandrake Linux\
    \ 的安装程序。它具有图形用户界面，非常易于使用。它允许你随时返回之前的配置步骤，甚至可以根据你的技能水平选择安装类型。\n\n> 警告\n> 为了确保安装在最好的条件下进行，请确保连接并开启计算机上将要使用的所有设备：打印机、调制解调器、扫描仪等。因此，DrakX\
    \ 将自动检测并配置它们。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_46_0.png)\n\n图 5-1.\
    \ 安装欢迎界面\n\n当你从 CD-ROM 或软磁盘开始安装时，首先会看到一个提供帮助的屏幕（图 5-1）。什么都不做将以普通模式开始安装。按 F1 打开帮助屏幕（图\
    \ 5-2）。这里是一些可供的选项：\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_47_0.png)\n\n图\
    \ 5-2. 可安装选项\n\n- vgalo：如果你尝试普通安装但无法获得下所示图形界面，只需在此处输入 vgalo 尝试低分辨率安装。\n- text：如果你的显卡非常老旧，图形安装完全无法工作，你始终可以选择文本模式。\n\
    - expert 模式：在某些情况下，硬件检测可能会导致计算机冻结。如果发生这种情况，请使用此模式防止其发生。然而，你需要手动提供硬件参数。expert 是针对之前模式（或普通模式）的选项。除非你清楚自己在做什么，否则不要选择此项。本手册将记录完整的专家类。如果你选择推荐类，请直接忽略此处显示的步骤。\n\
    - kernel 选项：你可以将这些命令行参数传递给内核。这对于安装程序无法确定内存量的机器特别有用。然后你只需要手动指定作为安装模式的选项，mem=xxx。例如，要在具有\
    \ 256 MB 内存的计算机上以普通模式启动安装，请输入：linux mem=256M\n\n在左侧，你可以看到各种安装步骤。根据安装进度，某些阶段可能可用。如果可用，当你将鼠标光标悬在它们上方时，它们会被亮。\n\
    \n表示各种阶段的按钮也可能是不同的颜色：\n\n- 红色：此安装阶段尚未执行；\n- 橙色：正在处理的安装阶段；\n- 绿色：此安装阶段已配置。然而，如果你需要或想返回，没有任何会阻止。\n\
    \n本指南假设你正在进行后续截图所示的标准逐步安装。\n\n## 5.2. 选择语言\n\n第一步是选择你的首选语言。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_49_0.png)\n\
    \n请为安装和系统使用选择你的首选语言。\n\n点击 Advanced 将允许你在工作站上安装其他语言。选择其他语言将为系统文档和应用程序安装特定语言的文件。例如，如果你的机器将托管来自西班牙的用户，请在树形视图中选择英语作为主语言，并在\
    \ Advanced 部分点击对应于西班牙的灰色星号。\n\n注意可能会安装多种语言。一旦选择了任何额外的区域，点击 OK 按钮继续。\n\n## 5.3.\
    \ 发行版许可条款\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_50_0.png)\n\n在继续之前，你应该仔细阅读许可条款，如果你不同意所有条款，点击\
    \ Refuse 按钮将立即终止。点击 Accept 按钮继续安装。\n\n## 5.4. 安装类型\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_51_0.png)\n\
    \nDrakX 现在需要知道你想执行默认（Recommended）安装，还是想要更多的控制（Expert）。Install 将完全清除旧系统。如果你正在升级现有系统，请选择\
    \ Upgrade。\n\n根据你对 GNU/Linux 的了解，请选择以下之一进行安装：\n\n- Recommended：如果你从未安装过操作系统，请选择此项。安装将非常简单，你只会被问几个问题。\n\
    - Expert：如果你拥有 GNU/Linux 知识，请选择此安装。专家模式将允许你进行高度自定义的安装。如果你没有良好的 GNU/Linux 知识，回答某些问题可能会困难，因此除非你清楚自己在做什么，否则不要选择此项。本手册将记录完整的专家类。如果你选择推荐类，只需忽略此处显示的步骤。\n\
    \n## 5.5. 磁盘检测与配置\n\n注意：此步骤在推荐模式下通常被忽略。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_52_0.png)\n\
    \nDrakX 正在检测计算机中的任何 IDE 设备。它还将扫描系统的一个或多个 PCI SCSI 卡。如果发现 SCSI 卡，DrakX 将自动安装相应的驱动程序。\n\
    \n由于硬件检测有时无法检测到硬件，DrakX 将询问你确认是否存在 SCSI 卡。如果你知道机器中安装了 SCSI 卡，请点击 Yes。你将看到一个供选择的\
    \ SCSI 卡列表。如果没有 SCSI 硬件，请点击 No。如果你不确定，可以通过选择 hardware info 并点击 OK 来检查机器检测到的硬件列表。检查硬件列表，然后点击\
    \ OK 按钮返回 SCSI 接口问题。\n\n如果你必须手动指定适配器，DrakX 将询问你是否想为其指定选项。你应该允许 DrakX 卡特定选项的硬件需要初始化。这通常运行得良好。\n\
    \n如果 DrakX 无法探测需要传递的选项，你将需要手动为驱动程序提供选项。请查看用户指南（第 3 章，“收集你的硬件信息”部分），获取有关从硬件文档、制造商网站（如果你可以访问互联网）或\
    \ Microsoft Windows（如果你在系统的 Windows 上使用过此硬件）检索所需参数的提示。\n\n## 5.6. 配置鼠标\n\n注意：此步骤在推荐模式下通常被忽略。\n\
    \n"
