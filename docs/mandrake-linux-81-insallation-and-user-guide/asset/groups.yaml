    ## 第 14 章 Mandrake 控制中心


    您的系统安全级别。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_257_0.png)


    图 14-27. 选择系统的安全级别


    您只需点击与所需安全级别对应的按钮即可，效果会立即生效。您应该非常仔细地阅读帮助文本，以便了解特定的安全级别对您和您的用户意味着什么。


    还有一个 libsafe 复选框。如果您当前配置的机器将作为互联网的服务器，请勾选此选项。该库可以防止“缓冲区溢出”类型的攻击。请参阅 libsafe 主页（http://www.research.availablealabs.com/project/libsafe/）获取更多信息。


    注意：根据您使用的安装模式（推荐模式或专家模式），您将看到不同的安全选项。


    ## 14.12. 配置基本防火墙


    此向导将引导您完成在机器上设置防火墙的过程。在安装好机器并在连接互联网之前运行它是一个好主意，这可以最大限度地减少机器被破解的风险。


    在控制中心中，点击“配置”（Configure）按钮启动向导。它由许多屏幕组成，每个屏幕都会提一个问题并带有相应的说明。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_258_0.png)


    使用按钮：


    - 取消（Cancel!）：中止防火墙安装，所有更改将被丢弃。

    - 上一步（Previous）：返回上一步并进行修改。

    - 下一步（Next ->）：验证当前选择并继续下一个问题。示例图 14-28 显示了通向关闭或打开本机器网络服务的屏幕。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_259_0.png)


    图 14-29. 接受选项并激活防火墙


    在完成所有步骤后，系统会询问您是否最终要激活防火墙。如果您想按照刚刚创建的配置运行防火墙，请勾选“保存并退出”（Save & Quit）框，然后点击“完成”（Finish）按钮。


    ## 14.13. 自定义菜单


    为了帮助您管理首选窗口管理器的主菜单，Mandrake Linux 了一个了一个菜单编辑器，确保来自所有桌面环境（如 KDE 或 GNOME）的菜单都是一致的。


    ![](img/44017b5ddbff38ec085831b3cde64d5d_260_0.png)


    图 14-30. 以系统或用户模式启动 mandrake


    menudrake 可以两种不同的模式启动：更改所有用户的菜单，或者自定义您自己的菜单。点击：


    - 系统菜单配置（System menu Configure）：如果您想对系统中所有用户可菜单进行更改，

    - 用户菜单配置（User menu Configure）：如果您想为单个用户自定义菜单。在这种情况下，您需要在点击“配置”按钮之前在组合框中选择用户。


    当您启动 menudrake 时，它会首先扫描并显示当前的菜单结构。主窗口（图 14-31）分为两部分：左侧是菜单本身，右侧是关于选中菜单项的表单。


    | 文件 (File) | 操作 (Action) | 视图 (View) | 上下文 (Context) | 帮助 (Help) |

    | --- | --- | --- | --- | --- |

    | 保存 (Save) | 添加目录 (Add directory) | 添加项目 (Add entry) | 删除 (Delete) | | |

    | 所有 (all) | 通用 (General) | 扩展 (Extended) | | |

    | 娱乐 (Amusement) | 标题 (Title) | | | |

    | 应用 (Applications) | 长标题 (Long title) | | | |

    | 配置 (Configuration) | 命令 (Command) | | | |

    | 文档 (Documentation) | | 在终端打开！(Open in a terminal!) | | |

    | 多媒体 (Multimedia) | 图标 (Icon:) | | | |

    | 网络 (Networking) | | | | |

    | 办公 (Office) | | | | |

    | 终端 (Terminals) | 可用应用程序 (Available Applications) | | | |


    图 14-31. mandrake 主窗口


    您可以点击树节点上的 + 号查看相关目录的内容，点击 - 隐藏它。


    > 警告

    > 您可能会在树结构中看到未出现在菜单中的条目。这些是不显示的空目录。


    ### 14.13.1. 添加新菜单项


    这种情况很少发生，因为所有 Mandrake Linux 图形应用程序都应该提供菜单项。然而，如果您想为您编译的包或控制台程序添加菜单项，可以使用此功能。让我们假设您想通过“应用”（Applications）+“监控”（Monitoring）下的菜单项来检查主目录的磁盘使用情况。


    选择“监控”目录，点击工具栏上的“添加项目”（Add entry）。会出现一个名为“Application 1”的项，您现在需要将其修改为所需内容。首先将标题更改为“主使用”（Home
    usage），这是菜单中显示的名称。然后，如果您愿意，输入一个更详细的“长菜单”（Long menu），它将出现在说明气泡中，让我们输入“显示您的主目录大小”。最后，您需要提供系统要执行的操作（命令/Command）：“du
    -shc”。不要忘记勾选“在终端打开”（Open in a terminal）框，因为 du 不是图形应用程序。


    如果您需要，还可以通过点击项目本身为您的条目选择图标。![](img/44017b5ddbff38ec085831b3cde64d5d_262_0.png)
    图 14-32. 使用 menudrake 添加新项目


    **提示：** 如果您认为把菜单弄乱了并希望回到之前的状态，可以进入文件→重新加载（File→Reload (**Ctrl+R**））。最后，点击保存（Save）即可激活更改，搞定！


    注意：根据您使用的窗口管理器，菜单的更改可能不会立即显示。在某些情况下，您可能需要注销并重新登录才能生效。


    ## 14.13.2. 高级功能


    ### 14.13.2.1. 关于上下文（Context）


    我们刚刚添加到菜单的条目现在可以在管理器中使用了。也可以通过切换上下文对特定菜单进行修改。例如，如果您想添加一个仅在 KDE 中可应用程序，只需从“所有”（all）切换到“kde”。所有适用于所选上下文的条目都会以蓝色显示在左侧的树结构中。


    ### 14.13.2.2. 移动和删除条目


    menudrake 条目支持拖放功能。这意味着您可以从目录中取出一个目，只需点击并释放鼠标按钮将其移动到另一个地方。同样，您可能注意到，每当您从菜单中删除应用程序时，它都会右下角的“可用应用程序”列表中。如果您想再次添加它们，只需再次拖入即可。


    ## 14.14. 配置启动服务


    | 服务和服务进程 (Services and daemons) | | | | 启动 (On Boot) | 停止 (Stop) |

    |---|---|---|---|---|---|

    | 启动 (Boot) | alsa | 停止 | info | [x] | |

    | 硬件 (Hardware) | anacron | 运行 | info | [x] | |

    | 网络与互联网 (Network & Internet) | aped | 运行 | info | [x] | |

    | 安全 (Security) | ald | 运行 | info | [x] | |

    | 系统 (System) | bartle-firewall | 停止 | info | [x] | |

    | 菜单 (Menus) | crond | 运行 | info | [x] | |

    | 服务 (Services) | gpos | 运行 | info | [x] | |

    | 计时 (Forits) | hardrake | 运行 | info | [x] | |

    | 日期与时间 (Date & Time) | khesader | 运行 | info | [x] | |

    | 软件管理器 (Software Manager) | kudzu | 运行 | info | [x] | |

    | | medusa-init | 停止 | info | [x] | |

    | | netlets | 运行 | info | [x] | |

    | | network | 运行 | info | [x] | |


    图 14-33. 选择系统启动时可的服务


    对于每个服务，以下是每列找到的项目列表：


    +   * 服务名称

    * 当前状态：运行或停止

    * 信息 (info)：点击该按钮获取有关该服务的解释性文本

    * 启动 (On Boot)：如果您希望该服务在启动时自动运行，请勾选此框²

    * 启动 (Start)：立即启动服务，如果已经在运行则将其重启（停止+启动）

    * 停止 (Stop)：立即停止服务


    ²通常在运行级别 3 和 5 中


