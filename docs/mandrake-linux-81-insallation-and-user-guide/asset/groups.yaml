    # Glossary


    # username


    is a name (or more generally a word) that identifies a user in a system. Each
    username is attached to a unique and single UID (user ID)

    See Also: login.


    # variables


    are strings that are used in Makefile files to be replaced by their value each
    time they appear. Usual they are set at the beginning of the Makefile. They are
    used to simplify Makefile and source files tree management.

    More generally, variables in programming, are words that refer to other entities
    (numbers, strings, tables, etc.) that are likely to vary while the program is
    executing.


    # verbose


    For commands, the verbose mode means that the command reports to standard (or
    possibly error) output all the actions it performs and the results of those actions.
    Sometimes, commands have a way to define the “verbosity level”, which means that
    the amount of information that the command will report can be controlled.


    # virtual console


    is the name given to what used to be called terminals. On GNU/Linux systems, you
    have what are virtual consoles which enable you to use one screen or monitor for
    many independently running sessions. By default, you have six virtual consoles
    which can be reached by pressing ALT-F1 through ALT-F6. There is a seventh virtual
    console by default, ALT-F7, which will permit you to reach a running Window System.
    In X, you can reach the text console by pressing CTRL-F1 through CTRL-ALT-F6.

    See Also: console.


    # virtual desktops


    In the Window System, the window manager may provide you several desktops. This
    handy feature allows you to organize your windows, avoiding the problem of having
    dozens of them stacked on top of each other. It works if you had several screens.
    You can switch from one virtual desktop to another in a manner that depends on
    the window manager you''re using.'
