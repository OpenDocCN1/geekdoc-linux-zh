    ## Chapter 14. Mandrake Control Center


    level of your system.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_257_0.png)


    Figure 14-27. Choosing the security level of your system


    You simply click on the button corresponding to the security level you need, the
    effect is immediate. You should very carefully read the help text so that you
    know what a specific security level involves for you and your users.


    There is also a libsafe check-box. Check this option if the machine you are currently
    configuring as a server for the Internet. This library can prevent attacks of
    type "Buffer Overflow". Consult the libsafe home page (http://www.research.availablealabs.com/project/libsafe/)
    for more information.


    Note: Depending on your installation mode (Recommended or Expert), you will be
    presented with different security options.


    ## 14.12. Configuring a Basic Firewall


    This wizard will guide you through the process of setting up a firewall on your
    machine. It is a good idea to run it just after installing your machine and before
    connecting to the Internet, it will minimize the risks of your machine being cracked.


    In Control Center, click the Configure button to launch the wizard. It is made
    of many screens, each screen asking a question with corresponding explanations.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_258_0.png)


    Use the button:


    - Cancel! to abort the firewall installation, all changes are discarded.

    - Previous to come back to previous step and change it.

    - Next -> to validate current choice and go on to next question. The example figure
    14-28 shows the screen leading to the closing or opening of the web service on
    this machine.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_259_0.png)


    Figure 14-29. Accept the options and activate the firewall


    After you have completed all steps, you are asked whether you wish to finally
    activate the firewall. Check the Save & Quit box and then the Finish button if
    you want to run the firewall with the configuration you just made.


    ## 14.13. Customize your Menus


    In order to help you manage the main menu of your preferred Window Manager, Mandrake
    Linux provides you with a menu-editor that ensures menus from all desktop environments
    (like KDE or GNOME) are coherent.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_260_0.png)


    Figure 14-30. Launch mandrake in System or User mode


    menudrake can be started in two different modes: either changing menus for all
    users, or customizing your own menus. Click on:


    - System menu Configure: if you want to make changes on the menu available for
    all users of the system,

    - User menu Configure: if you want to customize a menu for a single user. In that
    case you need to select the user in the combo box before clicking the Configure
    button.


    When you launch menudrake, it first scans your current menu structure and displays
    it. The main window (figure 14-31) is divided in two parts: the menu itself on
    the left, and on the right a form about the highlighted menu item.


    | File | Action | View | Context | Help |

    | --- | --- | --- | --- | --- |

    | Save | Add directory | Add entry | Delete | | |

    | all | General | Extended | | |

    | Amusement | Title | | | |

    | Applications | Long title | | | |

    | Configuration | Command | | | |

    | Documentation | | Open in a terminal! | | |

    | Multimedia | Icon: | | | |

    | Networking | | | | |

    | Office | | | | |

    | Terminals | Available Applications | | | |


    Figure 14-31. The mandrake main window


    You can click on the + signs of the tree to view the content of the related directory,
    - to hide it.


    > Warning

    > You may see in your tree entries that do not appear in your menu. These are
    empty directories which are not displayed.


    ### 14.13.1. Add a new menu entry


    This should seldom happen as all Mandrake Linux graphical applications should
    provide a menu entry. However, if you want to add a menu entry for a package you
    have compiled, or for a console mode program, you may use this function. Let us
    imagine you want to check your home directory disk usage through a menu entry
    in Applications+Monitoring.


    Select the Monitoring directory, and click on the Add entry on the tool bar. An
    entry called Application 1 appears, you need now to edit it to what you want.
    First change the title to say "Home usage", this is the name that will appear
    in the menu. Then enter a more detailed description Long menu if you wish to,
    it will appear on the explication balloon, let''s put "Displays the size of your
    home directory". Finally you need to provide the action to be executed by the
    system (Command): "du -shc". Do not forget to check the Open in a terminal box,
    as du is not a graphical application.


    If you wish, you can also choose an icon for your entry by clicking on the itself.
    ![](img/44017b5ddbff38ec085831b3cde64d5d_262_0.png) Figure 14-32. Adding a new
    entry with menudrake


    **Tip:** If you think you have made a mess of menus and wish to come back to the
    previous state, you can go to File→Reload (**Ctrl+R**). Finally, to activate your
    changes, click on Save, and voila!


    Note: Depending on the window manager you use, the changes on menu may not be
    shown immediately. In some cases, you may need to logout and login again for the
    changes to take effect.


    ## 14.13.2. Advanced features


    ### 14.13.2.1. About the Context


    The entry we just added to the menu is now available in managers. It is also possible
    to make modifications to a specific menu by switching context. For example, if
    you wish to add an application that should be available only in KDE, simply switch
    from all to kde. All entries that apply to the selected context appear in blue
    in tree structure on the left.


    ### 14.13.2.2. Moving and removing entries


    menudrake entries support the drag-and-drop feature. That means that you can take
    an entry from a directory and move it to another simply by clicking on it and
    releasing the mouse button. Similarly, you may have noticed that whenever you
    remove an application from the menu, it appears in the “Available applications
    list on the bottom right corner. If you ever wish to add them again, you simply
    have to drag them again.


