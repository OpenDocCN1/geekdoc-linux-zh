    # Chapter 5. Installation with DrakX


    # 5.13. Root Password


    ![](img/44017b5ddbff38ec085831b3cde64d5d_65_0.png)


    This is the most crucial decision point for the security of your GNU/Linux system:
    root is the system administrator and it is the only one authorized to make updates,
    add users, change the overall system configuration, and so on. In short, root
    can do everything! That is why you must choose a password that is difficult to
    guess - DrakX will tell you if it is too easy. As you can see, you can choose
    not to enter a password, but we strongly advise you against this if only for one
    reason: do not think that because you booted GNU/Linux that your other operating
    systems are safe from mistakes. Since root can overcome all limitations and partitions
    by carelessly accessing the partitions themselves, it is important for it to be
    difficult to root.


    The password should be a mixture of alphanumeric characters and at least 8 characters
    long. Never write down the password - it makes it too easy to compromise a system.


    However, please do not make the password too long or complicated because you must
    be able to remember it without too much effort.


    The password will not be displayed on screen as you type it in.'
