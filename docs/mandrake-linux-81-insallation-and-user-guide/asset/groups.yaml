    Norman Walsh''s stylesheets. Screenshots have been taken using xwd and GIMP and
    converted with convert (from the ImageMagick package). All this software is available
    on your Mandrake Linux distribution, and all parts of it are free software.


    # 5. Note From the Editor


    As you may notice while you go from one chapter to another, this book is a composite
    document from various authors. Even though much care has been taken in insuring
    the technical and vocabulary consistency, the style of each author is obviously
    pre-served.


    Some of the authors write in English even though it is not their native language.
    Therefore, you may notice strange sentence constructions; do not hesitate to let
    us know if something is not clear to you.


    In the open-source philosophy, contributors are much welcomeded! You may provide
    much help to this documentation project by different means. If you have a lot
