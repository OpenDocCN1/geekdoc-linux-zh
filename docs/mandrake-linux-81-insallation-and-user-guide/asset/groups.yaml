    \n图 8-9. GNOME 的注销图标\n\n# 第 8 章. Linux初学者\n\n点击图标后，屏幕会变暗，并弹出一个带有选项的小框。现在只需忽略这些消息和选项，直接点击“是”按钮。\n\
    \n## 8.2.3. 关于安全的一些注意事项\n\n对于你的 Mandrake Linux 设备，掌握一些安全概念是非常重要的。其中某些对某些人来说可能显而易见，但在这里列：\n\
    \n- 不要将密码写在任何任何人都能看到的纸上（例如便利签贴）。\n- 务必确保你的密码足够复杂，能让别人猜不到，但又简单到让你能记住 :-) 尝试在密码中使用数字和大小写字母的混合组合。\n\
    \n> 提示：想一个你容易记住的句子是个好主意。然后，取句子中每个单词的首字母和/或数字来组成密码。例如，句子：“I was born on September\
    \ 10th 1973”可以组成密码：Iwbo101973，这个密码很容易记住（嘿，毕竟这是你的生日...），而且不容易被猜到。\n\n- 当你不再想使用电脑时，最好完全关闭它。也就是说，不要只是注销，而是要关机。这可以通过登录窗口中的“关机”按钮完成。在终端中，使用\
    \ `su` 变为 root，然后输入 `shutdown now -h` 或 `halt`。\n\n上面的列表并不详尽。你可以考虑到很多方法来使你的系统更安全。关于\
    \ Mandrake Linux 安全性的更详细分析可以在参考手册的 `msec – Mandrake Security tools` 中。\n\n## 8.3.\
    \ 使用你的图形环境\n\n本章介绍了关于你电脑的一些基本概念和技能。在上述的登录过程中，你可以选择使用 KDE 或 GNOME。\n\n### 8.3.1.\
    \ 显示的元素\n\n屏幕上显示了许多我们现在要描述的元素。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_98_0.png)\n\
    \n图 8-10. KDE 桌面\n\n# 第 8 章. Linux初学者\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_99_0.png)\n\
    \n图 8-11. GNOME 桌面\n\n1. 屏幕左侧是“图标”，即是一些小图，通常下方会附有一段短文本，代表该图标的标题或名称。每个图标都允许你打开一个窗口，程序将在窗口内运行，例如一个游戏或一个显示个人数据的窗口。在我们的示例中，上方所示图标让你访问由\
    \ MandrakeSoft 创建的配置工具。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_99_1.png)\n\
    \n图 8-12. 进入配置\n\n2. 屏幕底部是“栏”。你可以看到，每个图标都代表一个程序。工具栏是可以收缩的。\n\n![](img/44017b5ddbff38ec085831b3cde64d5d_100_0.png)\n\
    \n图 8-13. 可收缩的工具栏\n\n3. 屏幕左侧是“图标”，即是一些小图，通常下方会附有一段短文本，代表该图标的标题或名称。每个图标都允许你打开一个窗口，程序将在窗口内运行，例如一个游戏或一个显示个人数据的窗口。在我们的示例中，上方所示图标让你访问由\
    \ MandrakeSoft 创建的配置工具。\n\n# 第 8 章. Linux初学者\n\n## 8.3.2. 管理窗口和桌面\n\n有时你可能会发现打开的窗口不在你屏幕上的理想位置。你可能需要移动它以查看另一个窗口，或者为了方便。\n\
    \n你可以用鼠标非常简单地完成这一点。将光标移到窗口的标题栏，然后按住左键。只需移动鼠标（同时保持按住）。窗口将简单地跟随鼠标的移动。这被称为“拖动”窗口。当你到达一个满意的位置时，松开鼠标键：你刚刚将窗口固定在了新位置。\n\
    \n你还可以更改窗口所属的虚拟桌面。这对于按桌面逻辑组织你的工作可能很有帮助。\n\n你需要再次使用鼠标。在 KDE 中，右键点击窗口标题栏，会出现一个下拉菜单，其中有一个名为“移动到”（Move\
    \ to）的选项。只需指向此项目，就会列出你的\n\n"
