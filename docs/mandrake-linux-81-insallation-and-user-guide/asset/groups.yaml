    emulation. DrakX will automatically know whether it is a PS/2, serial or USB mouse.


    If you wish to specify a different type of mouse select the appropriate type from
    the list provided.


    If you choose a mouse other than the default you will be presented with a mouse
    test screen. Use the buttons and wheel to verify that the settings are good. If
    the mouse is not working correctly press the space bar or RETURN to "Cancel" and
    choose again.


    ## 5.7. Configuring the Keyboard


    Note: This step is generally ignored for Recommended mode.


    - Choose your language

    - Select installation class

    - Partition disk

    - Configure clone

    - Choose your keyboard

    - Security

    - Edit metadata

    - Format partitions

    - Choose packages to install

    - Install grub

    - Set root password

    - Polkit agent

    - Configure networks

    - Finish

    - Create bootdisk

    - Install bootloader


    ![](img/44017b5ddbff38ec085831b3cde64d5d_55_0.png)


    Mandrake Linux

    Please, choose your keyboard layout

    US keyboard (international)

    Cancel  More

    Here is the full list of keyboards available:


    | English |

    | :--- |

    | French |

    | German (abm-out) |


    DrakX selects the right keyboard for you (depending on the language you have chosen)
    and you will not even see this step. However, you might not have a keyboard that
    corresponds exactly to your language: for example, if you are an English speaking
    Swiss person, you may still want your keyboard to be a Swiss keyboard. Or if you
    speak English but are located in Quebec, you may find yourself in the same situation.
    In both cases, you will have to go back to this installation step and select an
    appropriate keyboard from the list.


    Click on the More button to be presented with the complete list of supported keyboards.


    ## 5.8. Security Level


    This step is generally ignored for Recommended mode.


    - Choose installation level

    - Select installation class

    - Hardware detection

    - Configure mouse

    - Choose keyboard

    - Security

    - Setup hard partitions

    - Choose packages to install

    - Install password

    - Web & mail

    - Configure networking

    - Configure file system

    - Create bootloader

    - Configure it

    - Install


    ![](img/44017b5ddbff38ec085831b3cde64d5d_56_0.png)


    At this point, it is now time to choose the security level desired for the machine.
    As a rule of thumb, the more exposed the machine, and the more data stored in
    it is crucial, the higher the security level should be. However, a higher security
    level is generally obtained at the expenses of easiness of use. Refer to the MSEC
    chapter of the Reference Manual to get more information about the meaning of these
    levels.


    If you do not know what to choose, keep the default option.


    ## 5.9. Selecting the Mount Points


    - Choose where to install

    - Select installation media class

    - Hard drive detection

    - Configure network

    - Choose your keyboard

    - Setup text fields

    - Format partitions

    - Install environment

    - Set root password

    - Add a user

    - Configure networking

    - Timezone

    - Create bootloader

    - Install-


    The Mandrake Linux partitioning wizard found the following solutions:

    - Use existing partition

    - Erase entire disk

    - Custom partitioning


    At this point, you need to choose where to install your Mandrake Linux operating
    system on your hard drive. If it is empty or if an operating system uses all the
    space available on it, you need to partition it. Basically, partitioning a hard
    drive consists of logically dividing it to create space to install your new Mandrake
    Linux system.


    > Because the effects of the partitioning process are usually irreversible


    Because the effects of the partitioning process are usually irreversible, partitioning
    can be intimidating and stressful if you are an inexperienced user. Fortunately,
    there is a wizard which simplifies this process. Before beginning, please consult
    the manual and take your time.


    ## Chapter 5. Installation with Drak


    If partitions are not defined, you will need to create them using the wizard.
    Depending on your hard drive configuration, several options are available:


    - Use free space: this option will simply lead to an automatic partitioning of
    your hard drive(s). You will not be prompted further.

    - Use existing partition: the wizard has detected one or more existing Linux partitions
    on your hard drive. If you want to use them, choose this option.

    - Use the free space on the Windows partition: if Microsoft Windows is installed
    on your hard drive and takes all the space available on it, you will have to create
    free space for Linux data. To do that, you can delete your Windows partition and
    data (see "Erase entire disk" or "Expert mode" solutions) or resize your Windows
    partition. Resizing can be performed without the loss of any data. This solution
    is recommended if you want to use both Mandrake Linux and Microsoft Windows on
    the same computer.


    Before choosing this option, please understand that after this procedure, the
    size of your Microsoft Windows partition will be smaller than at the present time.
    You will have less free space to store your data or to install new software.


    - Erase entire disk: if you want to delete all data and all partitions present
    on your hard drive and replace them with your new Mandrake Linux system, choose
    this option. Be careful with this solution because you will not be able to revert
    your choice after confirmation.


    > Warning

    If you choose this option, all data on your disk will be lost.


    - Remove Windows: this will simply erase everything on the drive and begin fresh,
    partitioning everything from scratch. All data on your disk will be lost.


    If partitions have already been defined, either from a previous installation or
    from another tool, simply select those to install your Linux system.

