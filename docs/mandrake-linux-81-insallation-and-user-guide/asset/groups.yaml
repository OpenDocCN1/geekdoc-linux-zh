    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_144_0.png)


    # Figure 11-2. Writing Documents


    Let us go through the menu in order for you to grasp StarOffice''s capabilities.
    But first, to launch StarOffice, click on your KDE menu icon, choose the Office
    sub-menu StarOffice. You can also create a symbolic link on your desktop. To do
    so, right-click anywhere on your desktop and choose Create New—Link to Application.


    Note: For GNOME users, the method is very similar. Right-click anywhere on your
    desktop and choose New→Launcher, type in the Name, Comment, Command (full path)
    and make sure to choose the Application type. Then, select the appropriate Iconf.


