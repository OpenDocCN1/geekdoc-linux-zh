    # Chapter 15. Package Management


    ![](img/44017b5ddbff38ec085831b3cde64d5d_283_0.png)


    Figure 15-6. Uninstalling packages


    When this is done, click on the same button that you clicked to install a package.
    The RpmDrake window is replaced by another wizard, which tells you that (at least)
    another package will be removed, in our example emacs-pcomplete. This makes sense:
    we were told earlier that emacs was necessary for emacs-pcomplete to work. If
    we remove emacs, then emacs-pcomplete won''t work any more, so we should also
    remove it – to keep the whole system consistent.


    At this point, if you click the Next, the packages are removed from your system.
    Note that you can still install them again, if you wish to use them after all...
    Just click on Quit to get back to RpmDrake.


    ## 15.4. Sources management


    Sources are package repositories where you can find packages to install on your
    Mandrake Linux. It can be a local directory on your hard drive, a CD-ROM, or even
    a remote directory somewhere on the network - the Internet, for example. There
    is always a specially defined source: the one from which you installed the system.
    Now we will explore sources management.


    ### 15.4.1. Adding sources


    Imagine you find a wonderful CD-ROM with plenty of packages, or a directory on
    the web. This is clearly a new source of packages and you would like to use it
    with RpmDrake, isn''t you? Then you must define a new source by clicking Define.
    In the pop-up window, click on New to define a new source. You then see the following
    dialog:


    | Type of source | Removable |

    | :--- | :--- |

    | New source''s name: | |

    | Device name: | |

    | mount point: | /mnt/cdrom |


    Figure 15-7. Adding a source in RpmDrake


    In every case, you must give your source a name: this name will be used to identify
    source later. You can define several different types, such as:


    - Removable. This is a generic name for sources like CD-ROM, ZIP, and so on. You
    must tell RpmDrake the appropriate device (i.e. which drive) and its mount point.

    - Local. If your computer directories contain packages, you can “register” them
    here. Just give the full absolute path.

    - FTP or HTTP. These types are for remote repositories. In both cases, you must
    give the full remote URL, beginning with ftp:// or http:// according to the type.
    Also give the mdlist path, which contains a compact description of what is available
    with previously given path. A typical example would be ../base/mdlist. This means
    you can only use “Mandrake-compliant” remote repositories where where mdlist is
    present. If unsure, ask the remote site''s administrator. The only difference
    is that you must provide username and password for FTP sources.

    - Security Updates. This describes remote repositories (like FTP and HTTP) where
    you can find package updates in regard to security issues. You should use a trusted
    mirror for that: the Update lists button gives you a list of trusted mirrors,
    try to use one located as near as possible. Note you may have to give username
    and password if the mirror uses FTP protocol.

    - Cook. These packages are for those who want to closely follow the evolution
    of the software: they are the very latest releases. So know what you are doing!
    These packages are mostly of development type, therefore prone to instability.
    These repositories work similarly to security updates.


    ### 15.4.2. Updating sources and packages


    From time to time, the packages contained in a source may change, especially if
    it is not a CD-ROM: some RPM files may be deleted or added. To keep the internal
    database synchronized with the actual state of various sources, it is necessary
    to update them (the sources). You can achieve this operation very easily by clicking
    on the Reload lists button. But note that it can take a rather long time: each
    package is being checked to see if it needs to be updated, and the dependencies
    are recalculated to reflect the changes.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_285_0.png)


    Now suppose the content of a source has changed. Usually it means some packages
    were added or changed: a package is changed when the "old" release is buggy or
    insecure, or simply because there is a new and better release available. It is
    possible that some old packages were installed on your system due to a lack of
    available updated packages.


    So, after updating the source, you have the opportunity to update some packages
    installed on your system and take advantage of various new releases: you can see
    them in the Installable list: they appear in a different color. Simply select
    and install them, and there no need to say that we strongly suggest you to do
    this...


    ## 15.5. Updating your system


    There’s an easy way to update all your system with the latest available software
    release: it’s MandrakeUpdate. This tool will query known and trusted repositories,
    then list the available new packages. To launch the MandrakeUpdate wizard, click
    on the button in RpmDrake toolbar.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_286_0.png)


    Please choose which types of update you want to perform:


    - bugfixes

    - normal updates

    - security updates


    Figure 15-8. Updates types in MandrakeUpdate


    First, you need to choose which type of update you want, among:


    - bugfixes. These updates are related to misbehavior in software. Choose this
    if some of your tools don’t work properly, you may find an update which corrects
    the problem.

    - normal updates. Simply a new release of a software package, with new features.

    - security updates. These updates are related to security, i.e. to prevent crackers
    gaining unauthorized access to your system. You’re strongly advised to always
    check these, even if you don’t spend your life on a network.


    You then get a window much like RpmDrake’s one. Available updates are listed,
    you only have to check the ones you want. Select any that have information about
    it displayed in the new familiar, three-tab box at the bottom. When you have selected
    some updates, click Next: and the installation wizard will be launched.


    If you’re interested, you can see the list of mirrors used by MandrakeUpdate on
    this page: http://www.mandrakux.com/mirrorsfull.list (http://www.mandrakux.com/mirrorsfull.list).

    '
