    # Chapter 7. Introduction to the User Guide


    Welcome, and thank you for using Mandrake Linux! This User Guide will help you
    use your Mandrake Linux system on a daily basis. Here is a summary of each chapter
    of the User Guide.


    The first chapter, "Linux for Beginners", page 65, is aimed at those of you who
    have no or very little knowledge about GNU/Linux. It is really basic level information.
    If you have previously used a GNU/Linux system with a graphical interface, just
    ignore this chapter.


    The next chapter is dedicated to the use of KDE, the default graphical environment
    of Mandrake Linux. You will see that it is a powerful working environment, very
    intuitive and fully configurable. You will probably be amazed by what it can do.


    You will then encounter a chapter on GNOME, another favorite graphical interface.
    It will guide you through its numerous features, personalization and much more.


    Next is a chapter called "Everyday Applications", page 119 which describes key
    applications such as Internet work, StarOffice and GIMP.


    Reading further, you will find chapters dedicated to system configuration tools
    especially designed for you by Mandrake Linux. These tools are organized into
    four chapters: first, how to configure an Internet connection, then Bastille tools
    used to secure your machine. After that many little graphical tools all accessible
    from MandrakeSoft''s Control Center. Finally, we will explain how to manage your
    software packages.


    The next section is devoted to documentation. Apart from introducing you to the
    documentation available on your GNU/Linux system, we provide some useful links
    to Internet sites.


    Finally as appendices, you will find the texts of the GPL and the GFDL, which
    are the licenses for most GNU/Linux applications and for this manual respectively.
    At the end of the book, you will find an extensive glossary.


