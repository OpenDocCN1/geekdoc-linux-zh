  - '[PAGE 288]


    # # Appendix A. Where to Get Documentation


    Apart from the manuals included with Mandrake Linux, documentation is available
    from many sources. The next few pages will offer you some suggestions which you
    might find useful.


    # ## A.1. The Documentation Included In Mandrake Linux


    # ### A.1.1. The Man Pages


    This is a primary source of information on a day-to-day basis. Each command corresponds
    to a manual page, or almost. Plus, certain configuration files, library functions
    for programmers and others, also possess their own manual pages.


    Their contents are arranged in different sections. References to these sections
    are made in the following manner: for example, open(2), fstat(5) will respectively
    refer to the open page in section 2 and the fstat page in section 5.


    To display a manual page, type man. Its syntax is as follows:


    ```

    man [options] [section] <manual page>

    ```


    Even for man itself, a command is available: man man. Manual pages are formatted,
    then displayed using the less pager by default.


    The names of the manual pages and their relevant sections appear at the top of
    each page. At the bottom are given references to other pages with related subjects
    (in general in the SEE ALSO section).


    You can start by consulting the pages related to the different commands covered
    in this manual: ls(1), chmod(1), etc.


    If you cannot find the right page - for example, you want to use the mknod function
    in one of your programs but you end up on the mknod command page -, make sure
    you spell out the section explicitly. In our example: mknod(2). If you forget
    the exact section, man -a mknod will read through all the sections looking for
    pages named mknod.'
