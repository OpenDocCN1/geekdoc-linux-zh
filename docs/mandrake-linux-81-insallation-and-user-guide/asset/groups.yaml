  - '[PAGE 319]


    # Glossary


    at developing a free operating system (“free”) as in “free speech”). Currently,
    all tools are there, except... the kernel. The GNU project kernel, Hurd, is not
    rock solid yet. Linux borrows,among others, two things from GNU: its C compiler,
    gcc, and its license, the GPL.


    See Also: GPL.


    # GPL


    General Public License. The license of the GNU/Linux kernel, it goes the opposite
    way of all proprietary licenses in that it gives no restriction as to copying,
    modifying and redistributing the software, as long as the source code is made
    available. The only restriction, if one can call it, is that the persons to which
    you redistribute it must also benefit from the same rights.


    # GUI


    Graphical User Interface. Interface to a computer consisting of windows with menus,
    buttons, icons and so on. The vast majority prefer a GUI over a CLI (Command Line
    Interface) for ease of use, even though the latter is more versatile.


    # HTML


    HyperText Markup Language. The language used to create web documents.


    # HTTP


    HyperText Transfer Protocol. The protocol used to connect to websites and retrieve
    HTML documents or files.


    # IDE


    Integrated Drive Electronics. The most widely used bus on today''s PCs for hard
    disks. An IDE bus can contain up to two devices, and the speed of the bus is limited
    by the device on the bus has the slower command queue (and not the slower transfer
    rate!).


    See Also: ATAPI.


    # IP masquerading


    is when you use a firewall to hide your computer''s true IP address from the outside.
    Typically any outside network connections you make beyond the firewall will inherit
    the firewall''s IP address. This is useful in situations where you may have a
    fast Internet connection with only one IP address but wish to use more than one
    computer that have internal network IP addresses assigned.'
  - '[PAGE 320]


    # Glossary


    # IRC


    Internet Relay Chat. One of the few Internet standards for live speech. It allows
    for channel creation, private talks, and also file exchange. It is also designed
    to be able to make servers connect to each other, which is why several IRC networks
    exist today: Undernet, DALnet, Efnet to name a few.


    # IRC channels


    are the “places” inside IRC servers where you can chat with other people. Channels
    are created in IRC servers and users join those channels so they can communicate
    with each other. Messages written on an channel are only visible to people connected
    to that channel. Two or more users can create a “private” channel so they don’t
    get disturbed by other users. Channel names begin with a #.


    # ISA


    Industry Standard Architecture. The very first bus used on PCs, it is slowly being
    abandoned in favor of the PCI bus. Some hardware manufacturers still use it, though.
    It is still very common that SCSI cards supplied with scanners, CD writers, ...
    are ISA. Too bad.


    # ISDN


    Integrated Services Digital Network. A set of communication standards for allowing
    a single wire or optical fiber to carry voice, digital network services and video.
    It has been designed in order to eventually replace the current phone system,
    known as PSTN (Public Switched Telephone Network) or POTS (Plain Old Telephone
    Service). Technically ISDN is a circuit switched data network.


    # ISO


    International Standards Organization. A group of companies, consultants, universities
    and other sources which enumerate standards in various topics, including computing.
    The papers describing standards are numbered. The standard number is09660, for
    example, describes the filesystem used on CD-ROMs.


    # ISP


    Internet Service Provider. A company which sells Internet access to its customers,
    whether the access is over telephone lines or dedicated lines.'
  - '[PAGE 321]


    # Glossary


    # JPEG


    Joint Photographic Experts Group. Another very common image file format. JPEG
    is mostly suited for compressing real-world scenes, and does not work very well
    on non-realistic images.


    # LAN


    Local Area Network. Generic name given to a network of machines connected to the
    same physical wire.


    # LDP


    Linux Documentation Project. A nonprofit organization which maintains GNU/Linux
    documentation. Its mostly known documents are HOWTOs, but it also maintains FAQs,
    and even a few books.


    # MBR


    Master Boot Record. Name given to the first sector of a bootable hard drive. The
    MBR contains the code used to load the operating system into memory or a bootloader
    (such as LILO), and the partition table of that hard drive.


    # MIME


    Multipurpose Internet Mail Extensions. A string of type/subtype describing the
    contents of a file attached in an e-mail. This allows MIME-aware mail clients
    to define actions depending on the type of the file.


    # MPEG


    Moving Pictures Experts Group. An ISO committee which generates standards for
    video and audio compression. MPEG is also the name of their algorithms. Unfortunately,
    the license for this format is very restrictive, and as a consequence there are
    no Open Source MPEG players...


    # NCP


    NetWare Core Protocol. A protocol defined by Novell to access NetWare Net file
    and print services.


    # NFS


    NetworkFileSystem. A network filesystem created by Sun Microsystems in order to
    share files across a network in a transparent way.'
  - '[PAGE 322]


    # Glossary


    # NIC


    Network Interface Controller. An adapter installed in a computer provides a physical
    connection to a network, such as an Ethernet card.


    # NIS


    Network Information System. NIS was also known as "Yellow Pages", but British
    Telecom holds a copyright on this name. NIS is a protocol designed by Sun Microsystems
    in order to share common information across a NIS domain, which can gather a whole
    LAN; part of this LAN or several LANs. It can export password databases, service
    databases, groups information and more.


    # PAP


    Password Authentication Protocol. A protocol used by many ISPs to authenticate
    their clients. In this scheme, the client (you) sends an identifier/password pair
    to the server, which is not encrypted. See Also: CHAP.


    # PCI


    Peripheral Components Interconnect. A bus created by Intel and which is today
    the standard for PC architectures, but other architectures use it too. It is the
    successor of ISA, and it offers numerous services: device identification, configuration
    information, IRQ sharing, bus mastering and more.


    # PCMCIA


    Personal Computer Memory Card International Association. More and more commonly
    called "PC Card" for simplicity reasons, this is the standard for external cards
    attached to a laptop: modems, hard disks, memory cards, Ethernet cards, and more.
    The acronym is sometimes humorously expanded to People Cannot Memorize Computer
    Industry Acronyms...


    # PNG


    Portable Network Graphics. Image file format created mainly for web use, it has
    been designed as a patent-free replacement for GIF and also has some additional
    features.


    # PnP


    Plug''N''Play. First an add-on for ISA in order to add configuration information
    for devices, it has become a more'
