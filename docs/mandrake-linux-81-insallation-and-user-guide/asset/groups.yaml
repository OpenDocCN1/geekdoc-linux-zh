    served by HTTP or FTP (respectively for web browsing and file transfers).


    Here the partition size depends on the number of users (or services) hosted and
    their needs.


    A variant to that solution is to not use a separate partition for the /usr files:
    /usr will simply be a directory inside the root / partition.


    # 4.1.3.3. Exotic configurations


    When setting-up your machine for specific uses such as a web server or a firewall,
    the needs are radically different than for a standard desktop machine. For example,
    a FTP server will probably need a big separate partition for /var/ftp, while the
    /usr will be relatively small. For such situations, you are encouraged to carefully
    think about your needs before even beginning the install.


