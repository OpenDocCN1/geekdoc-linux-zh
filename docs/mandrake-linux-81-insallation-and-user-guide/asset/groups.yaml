    ## Chapter 15. Package Management


    ## 15.1.1. The Main Window


    When launched, RpmDrake does some analyses and configuration checking, which can
    take some time. Finally you see the main window, showed in this figure:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_277_0.png)


    Figure 15-2. RpmDrake''s Main Window


    As you can see, RpmDrake''s main window is basically divided into three parts:


    - 1. On the left, a tree showing package names (sorted and grouped by categories)
    along with some other information; note that you can change the view to a flat,
    alphabetically ordered list, just by clicking on the Flat list tab.

    - 2. At the top-right, a box listing the packages you have selected (yes, you
    can select packages: more on that later).

    - 3. At the bottom-right, various information about the currently highlighted
    package, such as name, detailed description, file list, and so on.


    Take a random package in a category (remember, you just have to click on the +
    sign to expand a tree branch), then click on its name. The bottom-right block
    displays general package information as well as the packager''s name. In the File
    list, you get a tree view of the files contained in the package, as shown below.


    | Brief Details Files | | |

    |---|---|---|

    | ? Name (8 files in 9 dirs) | Size | Deep size |

    | / | 0 | 93608 |

    | | usr | 0 | 93608 |

    | | bin | 210201 | 210201 |

    | | aclocal | 10765 | |

    | | automake | 199436 | |

    | | share | 0 | 725907 |

    | | aclocal | 21793 | 21793 |

    | | automake | 406940 | 406940 |

    | | doc | 0 | 261355 |

    | | automake-1.4 | 261355 | 261355 |

    | | info | 35819 | 35619 |

    | | automake.info-1.bz2 | 14045 | |

    | | automake.info-2.bz2 | 13706 | |

    | | automake.info-3.bz2 | 6702 |


    Figure 15-3. A package''s file list


    If you click on the first column''s label, the question mark ?, then RpmDrake
    will check if the files contained in the package already exists on your system.
    If so, they will be marked by a green mark ✓. If the files are not present, then
    they are marked by a red mark X.


    Let''s have a look at the Deep size column. You can see it shows only for directories.
    The size of a directory is defined as the sum of all the files'' sizes contained
    in it. If the directory does not contain any sub-directory, that''s enough. Now,
    if a directory contains one or more sub-directories, then the depth size is defined
    as the directory''s size, plus the depth size of each of its sub-directories.


    On the above example, the directory usr has a size of zero; it''s because it doesn''t
    contain any files. But it contains sub-directories (bin and share): therefore
    its depth size is the sum of the depth sizes of each sub-directories. On the other
    hand, the directory bin contains some files but no sub-directory: its depth size
    is the same as its size.


    Now we will select a package. Simply click in the little square box on the left
    of the package name: immediately, this package is added to the Selected box, located
    in the window''s top-right corner (actually, you can double-click anywhere on
    a line associated with a package and that package will be added to the Selected
    packages).


    You can select as many packages as you want. You may also simply browse through
    the packages, choosing on the way for later use. Notice that if you click on a
    package, its description is displayed in the block below the Selected box.


    Finally, let us talk a bit about the Find text field: as you may have guessed,
    this will look for a word through all the packages'' names. Simply type in a word,
    then click the Search button. Packages whose name contain the given word are displayed
    under the Search tree node in the tree view, or only listed packages in the Flat
    List view. Also note that if you want to use the plus sign ("+") in your search
    (as in "C++", instance), you have to prefix it with a backslash sign, for example:
    "C\+\+".


    > Note: For expert users, the Find field supports standard regexps (regular expressions),
    as defined in regexp(7).


    If you type another word and then click Search again, the result of your second
    inquiry replaces those of your first one. If you want to clear your search results,
    use the Reset button.


    ## 15.1.2. Installable and Installed Packages


    Two kinds of RpmDrake packages exist: the Installables, which holds the not as
    yet installed packages and the upgradable ones, while the Installed RPMs are,
    you guessed, the Installed RPMs.


    When you start RpmDrake, you see the installable packages, by default. Click the
    tab to switch between the two lists. If you want to install a package, then RpmDrake
    will show you what''s available. This is what is displayed in the bottom-right.


    In some cases though, all the package''s dependencies you want to install are
    already installed. In those cases, you won''t even see this page.


    ## 15.2. Installing Package


    If you want to install a package, then RpmDrake will show you what''s available.
    This is what is displayed in the bottom-right.


    In some cases though, all the package''s dependencies you want to install are
    already installed. In those cases, you won''t even see this page.


    If you want to install a package, then RpmDrake will show you what''s available.
