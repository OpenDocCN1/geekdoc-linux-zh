    let''s create an icon for *gview*, an image viewer. Type gview in the said field.
    For the moment, you also use the Browse... button to find the file you need. Type
    /usr/bin/gview. When you are finished, click on OK. The new icon appears on the
    desktop: click on it to launch the program associated with it.


    #### 9.4.1.3. Icon Linking to a Site


    Now, we will create an icon for Internet: choose Link to Location (URL) in the
    Create New menu. A dialog box will pop up and you will need to enter the web address.
    For example, we chose Linux Documentation Project site:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_119_0.png)


    Figure 9-7. Creating an Icon for a Web Site Under KDE


    Click on OK when you have entered the correct address. The icon will then appear
    on the desktop: click on it to launch the web browser which will display the corresponding
    page (of course, you need to be connected to the Internet in order to do so).


    #### 9.4.1.4. Deleting or Modifying Icons


    If you do not like the default image or name of the icon, you can change it (like
    you can change any icon''s parameters). Right click on the icon and choose Properties
    in the pull-down menu. You will get a window very similar to the one we saw when
    we created an icon pointing at an application.


    In the text field, enter the icon''s new name. The big button allows you to chose
    another icon. Click on it and you will get this window:


    ![](img/44017b5ddbff38ec085831b3cde64d5d_120_0.png)


    Figure 9-8. Choosing an Icon Under KDE


    The icons can come from different sources: use the pull-down list on the right
    to change your source. Then just click on one of the icons. On the other hand,
    if you choose Other Icons, you can choose any image for your icon’s graphic look:
    use the Browse button in order to do so.


    Like always, press on OK when you are done.


    ### 9.4.2. Changing Styles


    This time, we will use a module held by the KDE Control Center. Launch it by clicking
    on the tool bar. This program will allow you to access practically every configurable
    aspect of KDE.


    The parameters you can change are sorted by categories, which helps your research.
    Each name is pretty explicit. To start, you can use the LookNFeel category. You
    will be able to control the manner in which your graphical environment is drawn.
    Choose the Style module which will display this window:

