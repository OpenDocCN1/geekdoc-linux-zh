    ## preprocessors


    are compilation directives that instruct the compiler to replace those directives
    for code in the programming language used in the source file. Examples of C’s
    preprocessors are #include, #define, etc.


    ## process


    in the operating system context, a process is an instance of a program being executed
    along with its environment.


    ## prompt


    in a shell, this is the string before the cursor. When you see it, you can type
    your commands.


    ## protocol


    Protocols organize the communication between machines across a network, either
    using hardware or software. They define the format of transferred data, whether
    one machine controls another, etc. Many well-known protocols include HTTP, FTP,
    TCP, and UDP.


    ## proxy


    a machine which sits between a network and the Internet, whose role is to speed
    up data transfers for the most widely used protocols (HTTP and FTP, for example).
    It maintains a cache of previous demands, which avoids the cost of asking for
