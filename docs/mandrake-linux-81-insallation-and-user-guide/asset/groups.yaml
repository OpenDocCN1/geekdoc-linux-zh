    # Chapter 4. Disks and partitions


    If you are reading this chapter, it means that you have decided on an expert installation
    of Mandrake Linux, which will require you to understand partitioning. Or you are
    simply curious and that''s OK too. :)


    This section provides a complete description of the PC partitioning scheme. It
    is only useful if you intend to manually set the partitions of your hard drive.
    If you do not understand what we are talking about, you may safely ignore this
    section; the installer can do everything automagically for you.


    # 4.1. Structure of a hard disk


    Basically, a disk is physically divided into little sectors. A sequence of sectors
    can form a partition. Roughly speaking, you can create as many partitions as you
    wish; each of them is regarded as a single hard drive.


    # 4.1.1. Sectors


    To simplify, a hard disk is merely a sequence of sectors. A sector is the smallest
    data unit on a hard disk, and its size is typically 512 bytes. The sectors on
    a hard disk of ( n ) sectors are numbered from ( 0 ) to ( n-1).


    # 4.1.2. Partitions


    The use of multiple partitions enables you to create many virtual hard drives
    inside your real physical drive. This has many advantages.


    +   - Different operating systems use different disk structures (called file systems);
    this is the case for Windows and GNU/Linux. Having multiple partitions on a hard
    drives allows you to install various operating systems on the same physical drive.'
  - '[PAGE 41]


    # Chapter 4. Disks and partitions


    +   - For performance reasons, a single operating system may prefer different
    drives with different file-systems on them because they are used for completely
    different things. It is the case for GNU/Linux which requires a second partition
    called “swap” and used for virtual memory.


    +   - Finally, it may prove very useful to separate the different parts of your
    OS into different partitions, even if they use the same file-system. In the most
    simple configuration, you can split your files into two partitions, one for your
    personal data, and another for programs. This allows you to update your OS, completely
    erasing the programs partition while keeping the data partition safe.


    +   - Physical errors on a hard disk are generally located at adjacent sectors
    and not scattered among the disk. Distributing your files into different partitions
    will limit data loss in case of hard disk physical damages.


    Normally the partition type specifies the file-system which the partition is supposed
    to contain. Each operating system recognizes some of the types, but not others.
    See the chapter about GNU/Linux file-systems in the Reference manual for more
    information.


    # 4.1.3. Define the structure of your disk


    # 4.1.3.1. The most simple


    Is where you have just two partitions: one for the swap space, the other for the
    files¹.


    > Tip: The rule of thumb for the swap partition size is to choose double of the
    size of your RAM memory. However for large memory configurations (>512 MB), this
    rule is not valid, and smaller sizes are preferred.


    ¹ the file-system used currently for GNU/Linux files is called ext2


    18'
