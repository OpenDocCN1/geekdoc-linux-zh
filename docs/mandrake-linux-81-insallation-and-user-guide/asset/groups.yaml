    # Chapter 11. Everyday Applications


    Now that you have successfully installed your Mandrake Linux distribution, it
    is time to attack serious stuff: the tools you use everyday. In this chapter,
    we will cover basic stuff and applications, that is StarOffice, general Internet
    use and multimedia applications such as XMMS. If you feel you already master those
    applications, you may simply skip this chapter. Then again, you might learn a
    few tips.


    # ##11.1. StarOffice


    in binary form, therefore proprietary.


    StarOffice can be used for many purposes. It acts as a WY-SIWYG (What You See
    Is What You Get) text-editor, a spreadsheet, a presentation software, etc. And
    you can even retrieve your mail from it. Now that you know what StarOffice can
    do for you, let us describe its basic utilities and features.'
