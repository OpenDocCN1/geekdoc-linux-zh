    Go in that desktop and without a doubt, you will find it. You transferred it.


    ### 9.3.3. Number and Naming of Virtual Desktops


    According to your activities, you can estimate how many default virtual desktops
    you need. Right-click on the virtual desktop and choose Preferences in the contextual
    menu.


    | Number of Desktops: 6 |

    | :--- |

    | Desktop1: Main | Desktop9: |

    | Desktop2: Internet | Desktop10: |

    | Desktop3: Writing | Desktop11: |

    | Desktop4: Images | Desktop12: |

    | Desktop5: Desktop 5 | Desktop13: |

    | Desktop6: Desktop 6 | Desktop14: |

    | Desktop7: | Desktop15: |

    | Desktop8: | Desktop16: |


    Figure 9-3. Configuring Virtual Desktops Under KDE


    On the upper-right part of the window is a slider which allows you to define the
    number of virtual desktops. In the example, six have been set, but you can set
    up to 16 desktops (however, this does consume a lot of memory).


