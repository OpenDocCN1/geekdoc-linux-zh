    # Chapter 1. Introduction to the Installation Guide


    Welcome, and thank you for using Mandrake Linux! This book is divided into two
    parts: an Installation guide and a User Guide. The Installation guide will help
    you install and configure your Mandrake Linux distribution by describing the preparation,
    installation and post-installation procedures. Have fun \:-


    # 1.1. Welcome!


    The aim of this part is to help you install Mandrake Linux on your computer. The
    setup program used is the graphical setup program: DrakX. If, for one reason or
    another, you cannot or prefer to use the graphical installation, you will be able
    to use a text version; how to access it is explained at the beginning of the section
    "Installation with DrakX", page 23.


    You will first be given instructions for steps to take before proceeding to the
    installation, such as: finding information about your hardware, configuring your
    BIOS, and, if needed, creating a bootdisk.


    For those of you who want a customized installation, you will find help with partitioning
    issues. A whole section will be devoted to the concepts behind partitioning a
    hard disk with details on how to partition your disk for special uses. This should
    help you when you have to partition your hard drive, although DrakX is designed
    to handle this automatically.


    Then comes the long-awaited chapter about the installation itself.


    Finally, we will be introducing some post-installation procedures useful for full
    system configuration.'
