    # Chapter 14. Mandrake Control Center


    Finally, to activate your changes, click on the Save button, and voila, Congratulations!
    You can now test your work by going to the real menu and launching your new creation.


    **Note:** Depending on the window manager you currently use, the changes on your
    menu may not be shown immediately. In some cases, you may need to logout and login
    again for the changes to take effect.


    # 14.13.2. Advanced features


    # 14.13.2.1. About the Context menu


    The entry we just added to the menu is now available in all graphical managers''
    menus. It is also possible to make modifications to a specific menu by switching
    the Context you are working with. For example, if you wish to add an application
    that should be available only in the KDE menu, simply switch from context all
    to kde.


    All entries that apply to the selected context only appear in blue in the tree
    structure on the left.


    # 14.13.2.2. Moving and removing entries


    menudrake entries support the drag-and-drop feature. That means that you can take
    an entry from a directory and move it to another simply by clicking on the entry
    and dragging it to the new directory without releasing the mouse button.


    Similarly, you may have noticed that whenever you remove an application from the
    menu, it appears in the “arctic”: The Available applications list on the bottom
