- raw:
  - '[PAGE 340]


    # Glossary


    newsgroups discussion and news areas that can be accessed by a news or USENET
    client to read and write messages specific to the topic of the newsgroup. For
    example, the newsgroup alt.os.linux.mandrake is an alternate newsgroup (alt) dealing
    with the Operating System (os) GNU/Linux and specifically, Mandrake Linux (mandrake).
    Newsgroups are broken down in this fashion to make it easier to search for a particular
    topic.


    null, character the character or byte number 0, it is used to mark the end of
    a string.


    object code is the code generated by the compilation process to be linked with
    other object codes and libraries to form an executable file. Object code is machine
    readable. See Also: compilation, linkage.


    on the fly Something is said to be done "on the fly" when it''s done along with
    something else, without you noticing it or explicitly asking for it.


    open source is the name given to free source code of a program that is made available
    to development community and public at large. The theory behind this is that allowing
    source code to be used and modified by a broader group of programmers will ultimately
    produce a more useful product for everyone. Some popular open source programs
    include Apache, sendmail and GNU/Linux.


    operating system is the interface between the applications and the underlying
    hardware. The tasks for any operating system are primarily to manage all of the
    machine specific resources. A GNU/Linux system, this is done by the kernel and
    loadable modules. Other well-known operating systems include AmigaOS, macOS, FreeBSD,
    OS/2, Unix, Windows NT, and Windows 9x.


    owner in the context of users and their files, the owner of a file is the user
    who created that file.'
  - '[PAGE 341]


    # Glossary


    # owner group


    in the context of groups and their files, the owner group of a file is the group
    to which the user who created that file belongs to.


    # pager


    program displaying a text file one screenful at a time, and making it easy to
    move back and forth and search for strings in this file. We advise you to use
    less.


    # password


    is a secret word or combination of words or letters that is used to secure something.
    Passwords are used in conjunction with user logins to multi-user operating systems,
    web sites, FTP sites, and so forth. Passwords should be hard-to-guess phrases
    or alphanumeric combinations, and should never be based on common dictionary words.
    Passwords ensure that other people cannot log into a computer or site with your
