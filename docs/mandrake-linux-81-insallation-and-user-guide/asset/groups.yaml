    # Glossary


    # firewall


    a machine or a dedicated piece of hardware which, in the topology of a local network,
    is the unique connecting point to the outside network, and which filters, or controls
    the activity on some ports, or makes sure only some specific interfaces may have
    access to them.


    # flag


    is an indicator (usually a bit) which is used to signal some condition to a program.
    For example, a filesystem has, among others, a flag indicating if it has to be
    dumped in a backup, so when the flag is active the files system gets backed up,
    and when it''s inactive it doesn''t.


