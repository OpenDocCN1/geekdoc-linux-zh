    ## 第 15 章 软件包管理


    ## 15.1.1. 主窗口


    启动时，RpmDrake 会进行一些分析和配置检查，这可能需要一些时间。最后，你将看到如图所示的主窗口：


    ![](img/44017b5ddbff38ec085831b3cde64d5d_277_0.png)


    图 15-2. RpmDrake 主窗口


    如你所示，RpmDrake 的主窗口基本上分为三个部分：


    - 1. 左侧是一个显示软件包名称的树（按类别排序和分组）以及其他信息；注意，你只需点击“扁平列表”（Flat list）标签，即可将视图更改为扁平的、按字母排序的列表。

    - 2. 右上角有一个框，列出了你选择的软件包（是的，你可以选择软件包：稍后会详细介绍）。

    - 3. 右下角是关于当前高亮软件包的各种信息，如名称、详细描述、文件列表等。


    在某个类别中随机取一个软件包（记住，你只需点击 + 号展开树分支），然后点击它的名称。右下角的框显示普通软件包信息以及打包者的名称。在“文件列表”中，你将获得软件包包含的文件树状视图，如下所示。


    | 简要详情 文件 | | |

    |---|---|---|

    | ? 名称 (9 个目录中的 8 个文件) | 大小 | 深度 |

    | / | 0 | 93608 |

    | | usr | 0 | 93608 |

    | | bin | 210201 | 210201 |

    | | aclocal | 10765 | |

    | | automake | 199436 | |

    | | share | 0 | 725907 |

    | | aclocal | 21793 | 21793 |

    | | automake | 406940 | 406940 |

    | | doc | 0 | 261355 |

    | | automake-1.4 | 261355 | 261355 |

    | | info | 35819 | 35619 |

    | | automake.info-1.bz2 | 14045 | |

    | | automake.info-2.bz2 | 13706 | |

    | | automake.info-3.bz2 | 6702 |


    图 15-3. 软件包的文件列表


    如果你点击第一列的标签（即问号 ?），RpmDrake 将检查软件包中包含的文件是否已存在于你的系统上。如果是，它们将被用绿色标记 ✓ 标记。如果文件不存在，则将用红色标记
    X 标记。


    让我们来看一下“深度大小”（Deep size）列。你可以发现它只显示目录。目录的大小定义为其中包含的所有文件的大小之和。如果该目录不包含任何子目录，这就足够了。现在，如果一个目录包含一个或多个子目录，那么深度大小定义为该目录的大小加上其每个子目录的深度大小之和。


    在上面的示例中，`usr` 目录的大小为 0；因为它不包含任何文件。但它包含了子目录（bin 和 share）：因此，它的深度大小是每个子目录深度大小之和。另一方面，`bin`
    目录包含一些文件但没有子目录：它的深度大小与它的大小相同。


    现在我们将选择一个软件包。只需点击软件包名称左侧的小方框：该软件包会立即添加到“已选择”（Selected）框中，该框位于窗口的右上角（实际上，你可以双击与软件包相关的行任意位置，该软件包就会被添加到“已选择软件包”中）。


    你可以选择任意数量的软件包。你也可以只需浏览软件包并在过程中选择它们供以后使用。注意，如果你点击一个软件包，它的描述将显示在“已选择”框下方的框中。


    最后，让我们谈谈“查找”（Find）字段：正如你可能猜到的，它将在所有软件包名称中搜索单词。只需输入一个单词，然后点击“搜索”（Search）按钮。名称包含给定单词的软件包将显示在树视图的搜索树节点下，或者在“扁平列表”视图中列出已选择的软件包。还要注意，如果你想在搜索中使用加号（+，例如“C++”），你必须在前面加一个反斜杠，例如：“C\+\+”。


    > 注意：对于专家用户，“查找”字段支持 regexp(7) 中定义的标准正则表达式（regexps）。


    如果你输入另一个单词并再次点击“搜索”，你的第二次查询结果将替换第一次的结果。如果你想清除搜索结果，请使用“重置”（Reset）按钮。


    ## 15.1.2. 可安装软件包和已安装软件包


    存在两种 RpmDrake 软件包：可安装的（Installables），包含尚未安装的软件包和可升级的软件包；而已安装 RPM（Installed RPMs）正如你猜的，就是已安装的
    RPM。


    当你启动 RpmDrake 时，默认看到可安装软件包。点击标签可以在两个列表之间切换。如果你想安装一个软件包，RpmDrake 将向你显示可用内容。这就是显示在右下角的。


    但在某些情况下，你想要安装的所有软件包依赖项已经安装了。在这种情况下，你甚至看不到此页面。


    ## 15.3. 卸载软件包


    卸载意味着意味着从系统中删除。这对于获得磁盘空间很有用。当然，你只能删除已安装的：因此，在“已安装”列表中选择一个软件包。例如，让我们尝试卸载 emacs
    软件包，这样 emacs-complete 就可以工作了。


    '
