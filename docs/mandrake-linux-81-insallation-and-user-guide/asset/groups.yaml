    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_146_0.png)


    Figure 11-4. Linking Properties


    Note: A little comment about keyboard shortcuts... Many of us are still fascinated
    by this little two-or-three button thing called the mouse. Keyboard shortcuts
    allow to execute simple commands and apply them for specific meanings, hence leaving
    your hands on the keyboard and accelerating the rhythm at which you can make your
    work progress. As an example, Ctrl-0 opens a document, Ctrl-C copies a piece of
    document which you want to copy elsewhere, etc. Browse through the menus, you
    will see that shortcuts are set for most major functions,


    File Menu


    It enables simple commands such as Open, Close, Print, etc. This is probably the
    mostly used menu since it holds the utmost basic commands. It is also through
    this menu that you access the latest opened documents.'
  - '[PAGE 147]


    # Chapter 11. Everyday Applications


    Edit Menu


    Since it contains the famous Cut & Paste commands, it is also largely utilized.
    The very practical Find & Replace option is also found in this menu. Ctrl-H pops
    up this familiar window.


    ![](img/44017b5ddbff38ec085831b3cde64d5d_147_0.png)


    Figure 11-5. Finding and Replacing Words


    **Note:** Notice the little underscore under each menu item. This is another rapid
    way to access commands. For example, Alt-E (Edit Menu) and the **b** character
    is a shortcut for your address book.'
  - '[PAGE 148]


    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_148_0.png)


    Figure 11-6. Address Book


    The Zoom, Toolbars, Nonprinting character are within this handy menu. If you have
    the unfortunate bad luck of owning a 14” screen, you will surely appreciate the
    zoom option... By configuring your tool bar, if you are a mouse aficionado, remove
    the buttons you never use and replace them with more often-utilized ones. As for
    the Nonprinting character, it facilitates basic letter and document layout, in
    order to be very precise.


    125'
  - '[PAGE 149]


    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_149_0.png)


    Figure 11-7. Nonprinting Characters


    **Note:** By clicking on the on the little arrow next to the style-level window,
    you open a tree view of StarOffice-based utilities, as well as your complete computer
    tree structure. Therefore, you can access your files through the Explorer option,
    carefully selecting your /home/your_user_name directory or which ever directory
