    # Chapter 11. Everyday Applications


    ![](img/44017b5ddbff38ec085831b3cde64d5d_172_0.png)


    # Figure 11-31. Splitting the Konqueror Window


    It can be interesting to link many windows into one same folder. For example,
    it is the case for both the left and right tree structures. However, the window
    we created earlier is linked to no other window. To link it, click on the check
    box on the right of the information bar. You will see a little chain inside the
    check box. This links it to the other windows, and when those other windows change
    their displays, the new window will also follow that display. Window splitting
    is also very practical to copy and move files from a folder to another: you can
    visualize the contents of many folders at a time, and move many files from a window
    to another.


    # 11.2.2. Nautilus File Manager


    GNOME''s default file manager now is Nautilus. With it, you can manage your files
    and browse the web. It was originally developed by Eazel but it unfortunately
    ceased its operations.


