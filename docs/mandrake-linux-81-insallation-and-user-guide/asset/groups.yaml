  mdcn: '


    # 术语表


    在 $~$ 或其变体下进入插入模式，它是程序的一种状态，在此状态下按下按键会将该字符插入到正在编辑的文件中（某些特殊情况除外，如缩写完成、行尾右对齐等）。通过按下
    Esc 键（或 Ctrl-I）可以退出该模式。


    # 互联网


    是一个连接世界各地计算机的庞大网络。


    # IP 地址


    是一个由四个部分组成的数字地址，用于识别你在互联网上的计算机。IP 地址采用分层结构，包括顶层域名和国家域名、域名、子域名以及每台机器的个人地址。IP 地址看起来可能像
    192.168.0.1。机器的个人地址可以是两种类型之一：静态或动态。静态 IP 地址永远不会改变，而是永久的。动态 IP 地址意味着你的 IP 地址在每次连接到网络时都会发生变化。拨号上网和电缆调制解调器用户通常拥有动态
    IP 地址，而某些 DSL 和其他高速连接提供静态 IP 地址。


    # ISO 8859


    ISO 8859 标准包含了对 ASCII 字符集的几种 8 位扩展（参见 ASCII）。特别重要的是 ISO 8859-1，“拉丁字母第 1 号”，它已被广泛实施，并可能被视为事实上的
    ASCII 替代品。


    ISO 8859-1（图 2）支持以下语言：非洲利语、巴斯克语、加泰罗尼亚语、丹语、荷兰语、英语、法罗岛语、芬兰语、法语、加利西亚语、德语、冰兰语、爱尔兰语、意大利语、挪威语、葡萄语、苏格兰语、西班牙语和瑞典语。


