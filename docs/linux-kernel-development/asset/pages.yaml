    # Process State


    The state of the process descriptor describes the current condition of the process
    (see Figure 2.3). Each process on the system is in one of five different states.
    This state is represented by one of flags:


    +   * **TASK_RUNNING**—The process is runnable, it is either currently running
    or on a runqueue waiting to run (runqueues are discussed in Chapter 3, "Scheduling”).

    * **TASK_INTERRUPTIBLE**—The process is sleeping (that is, it is blocked) waiting
    for some condition. When this condition occurs, the kernel sets the process''s
    state to TASK_RUNNING. The process also becomes runnable if it receives a signal.

    * **TASK_UNINTERRUPTIBLE**—This state is identical to TASK_INTERRUPTIBLE except
    that it will not wake up and become runnable if it receives a signal. This is
    used in situations where the process must wait without interruption or the event
    is expected to occur quickly. The task will not respond to signals in this state,
    TASK_UNINTERRUPTIBLE is less used than TASK_INTERRUPTIBLE.

    * **TASK_ZOMBIE**—The task has terminated, but the parent has not yet called wait(4)
    system call. The task''s process descriptor must remain in case the parent wants
    to access it. If the parent call wait(4), the process descriptor is deallocated.

    * **TASK_STOPPED**—Process execution has stopped; the task is not running nor
    is it eligible to run. This occurs if the task receives the SIGSTOP, SIGTSTP,
    SIGTTIB, or SIGTTO signal or if it receives any signal while it is being debugged.


    > This is why you dreaded unkillable processes with state D in ps(1). Because
    the task will not respond to signals, you cannot send it a SIGTERM signal. Further,
    even if you could terminate the task, as the task is supposedly in the middle
    of an important operation it would not be wise as the task may hold a semaphore.'
