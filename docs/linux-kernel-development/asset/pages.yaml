  md: '# Linked Lists


    A a data structure that allows the storage and manipulation of a variable number
    of elements (often called nodes) of data. Unlike a static array, the elements
    in a linked list are dynamically created. This enables the creation of a variable
    number of elements that are unknown at compile time. Because the elements are
    created at different times, they do not necessarily occupy contiguous regions
    in memory. Therefore, the elements need to be linked together, so each element
    contains a pointer to the next element. As elements are added or removed from
    the list, the pointer to the next node is simply adjusted. Figure A.1 is a linked
    list.


    | ... | next | ... | next | ... | null |

    |---|---|---|---|---|---|


    **Figure A.1** singly linked list.


    In some linked lists, each element also contains a pointer to the previous element.
    These lists are doubly linked lists because they are linked both forward and backward.
    Linked lists, similar to the one in Figure A.1, that do not have a pointer to
    the previous element are called singly linked lists. Figure A.2 is a doubly linked
    list.


    | null | prev | ... | next | prev | prev | ... | next | null |

    |---|---|---|---|---|---|---|---|---|


    **Figure A.2** doubly linked list.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Circular Linked Lists


    Normally, because the last element in a linked list has no next element, it is
    usually set to a special value, usually NULL, to indicate it is the last element
    in the list. In some lists, the last element does not point to a special value.
    Instead, it points back to the first node. This linked list is called a circular
    linked list because the links follow a circle. Circular linked lists can come
    in both doubly and singly linked versions. In a circular doubly linked list, the
    first node''s ''previous'' pointer points to the last node. Figures A.3 and A.4
    are singly and doubly circular linked list, respectively.


    ![](img/10f4d9a57f7d19944d26b746133440df_318_0.png)


    Figure A.3 A circular singly linked list.


    ![](img/10f4d9a57f7d19944d26b746133440df_318_1.png)


    Figure A.4 A circular doubly linked list.


    The Linux kernel''s standard linked list implementation is a circular doubly linked
    list. Going with this type of linked list provides the greatest flexibility.


    # Moving Through a Linked List


    Movement through a linked list occurs linearly. You visit one element, follow
    the next pointer, and visit the next element. Rinse and repeat. This is the easiest
    method of moving through a linked list, and the one by which linked lists are
    best suited. Linked lists are usually not used when random access is an important
    goal. Instead, you use linked lists when iterating over the whole list is important
    and the dynamic addition and removal of elements is required.'
  merge: -1
