  md: "# Slab Allocator Interface\n\nA new cache is created via\n\n```\nkmem_cache_t\
    \ * kmem_cache_create(const char *name, size_t size,\n                       \
    \        size_t offset, unsigned long flags,\n                               void\
    \ (*ctor)(void), kmem_cache_t *,\n                               unsigned long\
    \ len,\n                               void (*dtor)(void), kmem_cache_t *,\n \
    \                              unsigned long);\n```\n\nThe first parameter is\
    \ a string telling the name of the cache. The second parameter is the size of\
    \ each element in the cache. The third parameter is the offset of the first object\
    \ within a slab. This is done to ensure proper alignment value. Normally, zero\
    \ is sufficient, which results in the standard alignment. The flags parameter\
    \ specifies optional settings controlling the behavior of the cache. It can be\
    \ zero, specifying no special behavior, or one or more of the following flags\
    \ OR'ed together:\n\n+   SLAB_REAP This flag instructs the slab layer to automatically\
    \ reap objects (that is, the memory backing unused objects) when memory is low.\
    \ Normally, you do not want to set this flag as your cache could prevent the system\
    \ from recovering enough memory to continue operation when memory is low.\n\n\
    +   SLAB_HWACALIGN This flag instructs the slab layer to align each object within\
    \ slab to a cache line. This prevents \"false sharing\" (two or more objects mapping\
    \ to the same cache line existing at different addresses in memory). This improves\
    \ performance, but comes at a cost of increased memory footprint because the stricter\
    \ alignment results in wasted slack space. How large the increase in memory consumption\
    \ depends on the size of the objects and how they align with respect to the system's\
    \ cache lines. For frequently used caches in performance critical code, setting\
    \ this option is a good idea; otherwise, think twice.\n\n+   SLAB_MUST_HWACALIGN\
    \ If debugging is enabled, might be infeasible to perform debugging and cache\
    \ align the objects. This flag forces the slab layer to cache align the objects.\
    \ Normally, this flag is not needed and the previous is sufficient. Specifying\
    \ this flag while slab debugging is enabled (it is disabled by default) might\
    \ result in a large increase in memory consumption. Only objects where cache alignment\
    \ is critical, such as the process descriptor, should set this flag.\n\n+   SLAB_CACHE_DMA\
    \ This flag instructs the slab layer to allocate each slab in DMA-able memory.\
    \ This is needed if the allocated object is used for DMA and must reside in ZONE_DMA.\
    \ Otherwise, you do not need this and you should not set it."
