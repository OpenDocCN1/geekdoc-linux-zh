  md: 'Some architectures have very stringent demands for the alignment of data. On
    some systems, RISC-based ones, a load of unaligned data in a processor trap (handled
    error). On other systems, accessing unaligned data works, but in degradation of
    performance. When writing portable code, alignment issues must be avoided and
    all types must be naturally aligned.


    # Avoiding Alignment Issues


    The compiler generally prevents alignment issues by naturally aligning all data
    types. In fact, alignment issues are normally not concerns of the kernel developers—the
    issues arise, however, when the programmer works too closely with pointers and
    accesses data outside of the environment anticipated by the compiler.


    Accessing unaligned data with a recast pointer of a larger-aligned address causes
    an alignment issue (whatever that might mean for a proper architecture). That,
    this is bad:


    ```

    char dog[10];nchar *p = &dog[1];

    unsigned long l = *(unsigned long *)p;

    ```


    This example tests the pointer to char as a pointer to an unsigned long which
    might result in loading the 32-bit unsigned long from an address that is not a
    multiple of four.


    If you are thinking, "when in the world would I do this?" you are probably right.
    Nevertheless, it has come up, and it will again, so be careful. The real-world
    examples might not be so obvious.


    # Alignment of Nonstandard Types


    As mentioned, the aligned address of a data type is a multiple of the size of
    that data type. Nonstandard (complex) C types have the following alignment rules:


    +   - The alignment of an array is the alignment of the type (and thus, each element
    is further aligned).

    - The alignment of a union is the alignment of the largest included type.

    - The alignment of a structure is the alignment of the largest included type.


    Structures also introduce padding, which introduces other issues.


