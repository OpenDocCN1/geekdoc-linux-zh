  md: '# The Implementation of Threads


    Threads are a popular modern programming abstraction. They provide multiple threads
    of execution within the same program in a shared memory address space. They can
    share open files and other resources. Threads allow for concurrent programming,
    and on multiple processors, true parallelism.


    Linux has a unique implementation of threads. To the Linux kernel, there is no
    concept of a thread. Linux implements all threads as standard processes. The kernel
    does not have any special scheduling semantics or data structures to represent
    threads. Instead, a thread is merely a process that shares resources. Each thread
    has a unique task_struct and appears to the kernel as a normal process (which
    shares resources, such as an address space, with other processes).


    This approach contrasts greatly with operating systems such as Microsoft Windows
    or San Solaris, which have explicit thread support for threads; the name "lightweight
    process" sums up the difference in philosophies between Linux and other systems.
    To these other systems, threads are a distinct entity, whereas Linux provides
    a manner of sharing resources between processes (which are already quite lightweight)¹².
    For example, assume we have a process that consists of four threads. On systems
    with explicit thread support, there might exist one process that turn points to
    the four different threads, such as an address space or open files. The threads
    then describe the resources they possess. Conversely, in Linux, there are simply
    four processes and four normal task_struct structures. The four processes are
    to share certain resources.


    Threads are created like normal tasks with the clone() system call is passed flags
    corresponding to specific resources to be shared:


    ```

    clone(CLONE_VM | CLONE_FILES | CLONE_SIGCHLD, 0);

    ```


    The previous code results in behavior identical to a normal fork(), except the
    address space, filesystem resources, file descriptors, and installed signal handlers
    are shared.


    In contrast, a fork() can be implemented as


    ```

    clone(SIGCHLD, 0);

    ```


    and vfork() as


    ```

    clone(CLONE_FORK | CLONE_VM | SIGCHLD, 0);

    ```


    The flags provided to clone() help specify the behavior of the new process and
    what resources the parent and child will share. Table 2.1 lists the flags and
    their effect.


    ¹² As an example, benchmark process creation time in Linux versus process (or
    even thread!) creation time in these other operating systems. The results are
    quite nice.'
