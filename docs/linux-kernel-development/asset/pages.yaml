  md: "# Design of the Slab Layer\n\nThe slab layer divides objects into groups caches,\
    \ each of which stores a different type of object. There is one cache per object\
    \ type. For example, one cache is for process (a free list of task_struct structures),\
    \ whereas another cache is for inode (struct inode). Interestingly, the kmalloc\
    \ sits on top of the slab layer using a family of general purpose caches.\n\n\
    The caches are divided into slabs (the name of this system). The slabs are composed\
    \ of one or more contiguous pages. Typically, slabs are composed of a single page.\
    \ Each slab may contain multiple objects.\n\nEach slab contains some objects,\
    \ which are the data structures being cached. Each slab is in one of three states:\
    \ full, partial, or empty. A full slab has no free (all objects in the slab are\
    \ allocated). A partial slab has some allocated objects and some free objects.\
    \ When part of the cache requests an object, the request is satisfied from a partial\
    \ slab, if not exists, an empty slab is created. A full slab can never satisfy\
    \ a request because it does not have free objects. This strategy prevents fragmentation.\n\
    \nLet's look at the inode as an example, which is the in-memory representation\
    \ of a disk inode (see Chapter 1). These structures are frequently created and\
    \ destroyed, so it makes sense to manage them via the slab allocator. Thus, struct\
    \ inode is allocated from the inode_cache cache (a naming convention). This cache\
    \ is made up of one or more slabs—probably a lot of slabs because each contains\
    \ as many inode objects as possible. When the kernel requests a new inode, the\
    \ cache returns a pointer to an already allocated, unless, from a partial slab\
    \ or if there is no partial slab, an empty slab. When the kernel is done using\
    \ the inode object, the slab allocator marks the object as free. Figure 10.1 diagrams\
    \ the relationship between caches, slabs, and objects.\n\nEach cache is represented\
    \ by a kmem_cache_s structure. This cache contains three lists, slabs_full, slabs_partial,\
    \ and slabs_empty. A slab descriptor, struct_slab, represents each slab:\n\n```\n\
    struct slab {\n    struct list_head list;      /* full, partial, or empty list\
    \ *\n    unsigned long colouroff;     /* offset for the slab coloring *\n    void\
    \ *smem;                  /* first object in the slab *\n    unsigned int inuse;\
    \         /* number of allocated objects *\n    void *free;                 /*\
    \ first free object, if any */\n};\n```\n\nSlab descriptors are allocated either\
    \ outside of the general cache or inside the slab itself, at the beginning. The\
    \ descriptor is stored inside the slab if the total size of the slab is sufficiently\
    \ small, or if internal slab space is sufficient to hold the descriptor."
