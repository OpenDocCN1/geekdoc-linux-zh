  md: "# # Linux Coding\n\nThe Linux Kernel, like any large software project, has\
    \ a defined coding style that stimulates the formatting, style, and layout of\
    \ your code. This is not because the Linux style is better (although it is) or\
    \ because your style is illegal (although it might be), but consistency of coding\
    \ style is crucial to productivity. Yet, it is often argued that coding style\
    \ is irrelevant because it does not affect the compiled object code. In a large\
    \ project, such as the kernel, in which many developers operate, consistency of\
    \ coding style is crucial. Inconsistency affects familiarity, leads to lack of\
    \ reading, and further expectations that code will continue to follow a given\
    \ style. This increases the number of developers who can read your code, and the\
    \ amount of code in which you can read. In an open-source project, the more eyes\
    \ the better.\n\nIt is not important what style is chosen as long as one is selected\
    \ and used exclusively. Frankly, Linus laid out the style we should use and most\
    \ code sticks to it. The majority of the style is covered in Linus's usual humor\
    \ in Documentation/CodingStyle.\n\n#  Indentation\n\nThe kernel style for indentation\
    \ is to use tabs that are eight characters in length. This does not mean its okay\
    \ to use eight spaces for indentation or four spaces for anything else. It means\
    \ each level of indentation is a tab from the previous, and a tab is eight characters.\
    \ For an unknown reason, this rule is one of the most commonly broken, despite\
    \ its very high impact on readability. Eight-character tabs make clearly identifying\
    \ indentation of different code blocks magnitudes easier after hours of hacking.\n\
    \nIf eight-character tabs seem too long, stop indenting so much. Why are your\
    \ functions nested five levels deep? Fix the code, not the indentation.\n\n# \
    \ Braces\n\nBrace placement is personal, and few technical reasons exist for one\
    \ convention over the other, but we have to agree on something. The accepted kernel\
    \ style is to put the opening brace on the first line, at the end of the statement.\
    \ The closing brace goes on a new line as the first character. Example:\n\n```\n\
    if (fox) {\n    dog();\n    cat();\n}\n```\n\nNote the closing brace is not on\
    \ a line by itself when the following token is a continuation of the same statement.\
    \ For example:\n\n```\nif (fox) {\n    ant();\n```"
