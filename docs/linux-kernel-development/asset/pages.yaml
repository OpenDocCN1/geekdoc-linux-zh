  md: '# Anatomy of a Block Device


    The smallest addressable unit of block device is known as a sector. Sectors come
    in powers of two, but 512 bytes is the common size. The sector size is a physical
    property of the device and the sector is the fundamental unit of all block devices—the
    device cannot access or operate on a unit smaller than the sector, although many
    devices can transfer multiple sectors at once. Most block devices have 512 bytes,
    other sizes are common (for example, CD-ROM discs have two kilobytes).


    Software has different goals, and therefore imposes its own smallest addressable
    unit which is the block. The block is an abstraction of the filesystem and is
    usually accessed in multiples of a block. Although the physical device itself
    is addressable at the sector-level, the kernel performs all disk operations in
    blocks. Furthermore, the kernel (like hardware with the device) needs the block
    to be a power-of-two. The kernel also requires that a block be no larger than
    the page size than the page size. Common block sizes are 512 bytes, one kilobyte,
    and four kilobytes.


    Sometimes people refer to sectors and blocks with different names. The smallest
    addressable unit to the device, are sometimes called ''hard sectors'' or ''device
    blocks''. Meanwhile, blocks, the smallest addressable unit to the filesystem,
    are sometimes referred to as ''filesystem blocks'' or ''I/O blocks''. This chapter
    refers to call the two notions ''sectors'' and ''blocks'', but you should keep
    these two terms in mind. Figure 12.1 is a diagram of the relationship between
    sectors and blocks.


    Other terminology, at least with respect to disks, is common—terms such as clusters,
    cylinders, and heads. These notions are specific only to certain block devices
    and, for the most, are invisible to user-space software—we will not cover them
    here. The reason the sector is important to the kernel is all device I/O must
    be done in sectors. In turn, the higher-level concept used by the kernel, is built
    on top of sectors.


    ¹ is an artificial constraint that could go away in the future. Forcing the block
    to remain equal to or smaller than the page size, simplifies the kernel.'
