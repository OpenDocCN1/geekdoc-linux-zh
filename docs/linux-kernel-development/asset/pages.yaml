    \    ret = do_munmap(mm, addr, len);\n    up_write(&mm->mmap_sem);\n    return\
    \ ret;\n}\n```\n\n# Page Tables\n\nAlthough applications operate on virtual memory,\
    \ that is mapped to physical addresses, processors operate directly on those physical\
    \ addresses. Consequently, when\nan application accesses a virtual memory, it\
    \ must first be converted to a physical address before the processor can resolve\
    \ the request. Performing this lookup\nis done via page tables. Page tables work\
    \ by splitting the virtual address into chunks. Each chunk is used as an index\
    \ in a table. The table points to another table or the associated physical page.\n\
    \nIn Linux, the page tables consist of three levels. The multiple levels allow\
    \ a sparsely populated address space, even on 64-bit machines. If the page tables\
    \ were implemented as a single static array, their size on 32-bit architectures\
    \ would be enormous. Linux uses three levels of page tables even on architectures\
    \ that do not\nsupport three levels in hardware; this is a sort of \"greatest\
    \ common denominator\" architectures– with a less complicated implementation simplify\
    \ the kernel page tables as needed.\n\nThe top-level page table is the page global\
    \ directory (PGD). The PGD consists of an array of pgd_t types. On most architectures,\
    \ the pgd_t type is an unsigned long. The entries in the PGD point to entries\
    \ in the second-directory, the PMD.\n\nThe second-level page table is the middle\
    \ directory (PMD). The PMD is an array of pmd_t types. The entries in the PMD\
    \ point to entries in the PTE.\n\nThe final level is called simply the page table\
    \ and consists of page table entries of type pte_t. Page table entries point to\
    \ physical page.\n\nIn most architectures, page table lookups are handled (at\
    \ least to some degree) by hardware. In normal operation, hardware can handle\
    \ much of the responsibility of\nusing the page tables. The kernel must set up,\
    \ however, in such a way that the hardware is happy and can do its thing. Figure\
    \ 13.1 draws the flow of the virtual\nto physical address lookup using page tables."
