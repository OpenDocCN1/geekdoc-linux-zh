    When no other code is concurrently writing to or reading from the list. Writing
    demands mutual exclusion. On the other hand, when the list is searched (read for),
    it is only important that nothing else is written to the list. Multiple concurrent
    readers are safe as long as there are no writers. The task list (discussed in
