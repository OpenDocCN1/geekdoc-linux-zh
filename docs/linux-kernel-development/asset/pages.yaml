  md: "Page 6\n\nto perform. For example, consider the interrupt handler for a network\
    \ device. On responding to the hardware, the interrupt handler needs to copy packets\
    \ from the hardware memory, process it, and push it down to the appropriate protocol\
    \ stack or abstraction. This can be a lot of work.\n\n# Top Halves Versus Bottom\
    \ Halves\n\nThese two goals—that an interrupt handler executes quickly, but additionally\
    \ perform a large amount of work—are in contrast. Because of these goals, the\
    \ processing of interrupts is split into two parts, the top half—it runs immediately\
    \ upon receiving the interrupt and performs the work that is time critical, such\
    \ as acknowledging the receipt or resetting the hardware. Work that can be performed\
