  md: '# The Process Address Space


    Chapter 10, "Memory Management," we looked at how the kernel manages physical
    memory. In addition to managing its own memory, the kernel also has to manage
    the process address space—the view of memory given to each user-space process
    on the system. Linux is a virtual operating system, and thus the resource of memory
    is virtualized among the processes on the system. To an individual process, the
    view is as if it has full access to the system''s physical memory. More importantly,
    the address space of even a single process can be much larger than physical memory.
    This chapter discusses how the kernel manages the process address space.


    The process address space consists of the linear address range presented to each
    process and, more importantly, the addresses within this space that the process
    is allowed to use. Each process has a flat 32 or 64-bit address space, with the
    size depending on the architecture. Normally, the address space is unique to each
    process. A memory address in one process''s space tells nothing of memory address
    in another process''s address space. Processes can share their addresses, however,
    through shared memory segments.


    A memory address is a given value within the address space, such as #001000. This
    particular value identifies a specific byte in a process''s 32-bit address space.
    The interesting part of the address space is the intervals of memory addresses,
    such as 08048000-0804c000, that the process has permission to access. These intervals
    of legal addresses are called memory areas. The process, through the kernel, can
    dynamically add and remove memory areas to its address space.


    The process can only access a memory address in a valid area. Furthermore, the
    area can be marked read-only or nonexecutable. If a process accesses a memory
    address not in


    > ¹ The term "flat" describes the fact that the address space exists in a single
    range (as an example, a 32-bit address space extends from the address zero to
    429496729). Some operating systems provide a segmented address space, with the
    address space not existing in a single linear range, but instead in segments.
    Modern virtual memory operating systems generally have flat address spaces.'
