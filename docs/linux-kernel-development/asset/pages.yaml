  md: "```\n/ buf now points to at least a 16*PAGE_SIZE bytes\n * of virtually contiguous\
    \ block of memory\n */\n```\n\nAfter you are done with the memory, make sure it\
    \ is freed using\n\n```\nvfree(buf);\n```\n\n# Slab Layer\n\nAllocating and freeing\
    \ data structures is one of the most common operations inside any kernel. To facilitate\
    \ frequent allocations and deallocations of data, programmers introduce free lists.\
    \ A free list contains a block of available, already allocated, data structures.\
    \ When code requires a new instance of a data structure, it can grab one of the\
    \ structures off the free list instead of allocating a sufficient amount of memory\
    \ and setting it up for the data. Later on, when the data structure is no longer\
    \ needed, it is returned to the free list instead. In this sense, the free list\
    \ acts as an object cache, a frequently used type of object.\n\nOne of the main\
    \ problems with free lists in the kernel is that there exists no global control.\
    \ When available memory is low, there is no way for the kernel to communicate\
    \ with every free list to have it shrink the sizes of its cache to free up memory.\
    \ In fact, the kernel has no understanding of the random free lists at all. To\
    \ remedy this, and to consolidate code, the Linux kernel provides the slab layer\
    \ (called the slab allocator) as a generic data structure-caching layer.\n\nThe\
    \ concept of a slab allocator was first implemented in Sun Microsystems'OS 5.4\
    \ operating system. The Linux data structure-caching layer shares the same name\
    \ and design.\n\nThe slab layer employs to leverage several tactics:\n\n+   *\
    \ Frequently used data structures tend to be allocated and freed often, so they\
    \ cache them.\n\n+   * Frequent allocation and deallocation can result in memory\
    \ fragmentation (the inability to find large contiguous chunks of available memory).\
    \ To prevent this, the cached free lists are arranged contiguously. Because free\
    \ data structures are returned to the free list, there is no resulting fragmentation.\n\
    \n+   * The free list provides performance during frequent allocation and deallocation,\
    \ as a free object can be immediately returned to the next allocation.\n\n+  \
    \ * If part of the cache is made per-processor (processor allocator, and unique\
    \ to each processor on the system), allocations and frees can be performed without\
    \ an SMP lock.\n\n+   * Stored objects can be colored to prevent multiple objects\
    \ from mapping to the same cache lines.\n\nThe slab layer in Linux was designed\
    \ and implemented with these premises in mind.\n\n> 5 And subsequently documented\
    \ in Bonwick, J. \"The Slab Allocator: An Object-Caching Kernel Memory Allocator\"\
    , USENIX, 1994."
