  md: '# Interrupt Control


    The Linux kernel implements a interfaces for manipulating the state of interrupts
    on a machine. These interfaces enable you to disable the system for the current
    processor or mask an interrupt line for the entire machine. These routines are
    all architecture-dependent and can be found in `<system.h>` and `<irq.h>`. See
    Table 5.1 for a complete list of the interfaces.


    Reasons to interrupt the system generally boil down to needing to provide synchronization.
    By disabling interrupts, you can guarantee that an interrupt handler will not
    run during your code. Moreover, interrupts also disable preemption. Nevertheless,
    disabling local interrupt does not provide any protection against concurrency
    from another processor, Because Linux uses multiple processors, the kernel more
    generally needs to use interrupts. The locks provide protection against concurrent
    access from another processor, whereas disabling interrupts provides protection
    against concurrent access to local interrupts. Therefore, the kernel control locks
    and interrupts together.


    # Disabling and Enabling Interrupts


    To disable interrupts locally for the current processor (and only the current
    processor) and later enable them:


    ```

    local_irq_disable();

    /* interrupts are disabled */

    local_irq_enable();

    ```


    These functions are usually implemented as a single assembly operation (of course,
    this depends on the architecture). Indeed, on x86, `local_irq_disable()` is a
    simple `cli` and `local_irq_enable()` is the assembly calls to `clear` and `set`
    the allow interrupt flag, respectively. In other words, they disable and enable
    interrupt delivery on the issuing processor.


    The `local_irq_disable()` routine is dangerous if interrupts were already disabled
    *prior* to its invocation. The corresponding call to `local_irq_enable()` unconditionally
    enables interrupts, despite the fact that they were off to begin with. Instead,
    a mechanism is needed to restore interrupts to a previous state. This is a common
    concern given code path in the kernel can be reached both with and without interrupts
    enabled, depending on the chain of which one does not. For example, imagine the
    previous code snippet is part of a larger function. This function is called by
    two other functions: one of which disables interrupts and one of which does not.
    Because it is becoming harder as the kernel grows to know all the code paths leading
    up to a function, it is much safer to save the state of the interrupt system before
    disabling it. Instead, when you are ready to enable them, you simply restore them
    to their original state:'
