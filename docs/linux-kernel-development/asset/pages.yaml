  md: 'barrier() C code prevents the compiler from optimizing loads or stores across
    the cache. The compiler knows not to rearrange stores or loads in ways that would
    change the effect of C code and existing data dependencies. It does not have knowledge,
    however, of events that can occur outside of the current context. For example,
    the compiler cannot know about interrupts that read the same data you are writing.
    For this reason, you might want to ensure a store is issued before a load, for
    example. The previous memory barriers also function as compiler barriers, but
    a compiler barrier is lighter in weight (it is practically free) than a memory
    barrier.


    Table 8.10 a full listing of the memory and compiler barrier methods provided
    by all architectures in the Linux kernel.


    | Barrier | Description |

    | --- | --- |

    | rmb() | Prevents loads being reordered across the barrier |

    | read_barrier_depends() | Prevents data-dependent loads being reordered across
    the barrier |

    | wmb() | Prevents load or stores being reordered across the barrier |

    | mb() | Prevents load or stores being reordered across the barrier |

    | smp_mb() | On SMP, provides a rmb() and on UP provides a barrier |

    | smp_read_barrier_depends() | On SMP, provides a read_barrier_depends() and on
    UP provides a barrier |

    | smp_wmb() | On SMP, provides a wmb() and on UP provides a barrier |

    | smp_nb() | On SMP, provides a nb() and on UP provides a barrier Prevents the
    compiler from optimizing stores or loads across the barrier |


    The actual effects of the barriers vary for each architecture. For example, if
    a machine does not perform out-of-order stores (for example, Intel x86 chips)
    do not then wmb() does nothing. You can use the appropriate memory barrier for
    the worst case (that is, the weakest ordering processor) and your code will compile
    optimally for your architecture.'
