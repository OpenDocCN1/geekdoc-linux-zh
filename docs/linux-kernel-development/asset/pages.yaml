  md: '# What Causes Concurrency Anyway?


    In userspace the need for synchronization stems from the fact that programs are
    scheduled preemptively by the will of the scheduler. A process can be preempted
    at any time and another process can be scheduled onto the processor, it is possible
    for a process to be involuntarily preempted in the middle of accessing a critical
    section. If the new process enters the same region (say, if there are two processes
    and they share the same memory), it can race. The same can also occur within a
    single program with signals, signals can occur asynchronously. This type of concurrency—where
    things do not actually happen at the same time, but interfere each other so that
    they might as well—is called *pseudo-concurrency*.


    If you have a multiprocessing machine, two processes can actually be executing
    in a critical region at the exact time. That is called *true concurrency*. Although
    the causes and semantics of true pseudo concurrency are different, both result
    in the same race conditions and require the same sort of protection.


    The kernel has similar causes of concurrency. They are


    +   - Kernel preemption—An interrupt can occur asynchronously at any time, interrupting
    the currently executing code.

    - Kernel preemption—Because the kernel is preemptive, one task in the kernel sleeps
    and invokes the scheduler, resulting in the running of a new process.

    - Multiprocessing—Two or more processors can be executing at the exact same time.


    It is important that kernel developers understand and prepare for these causes
    of concurrency. It is a bug if an interrupt occurs in the middle of code that
    is manipulating a resource and the interrupt handler accesses that resource. Likewise,
    a process can be preempted while it is accessing a shared resource, leading to
    race conditions if code in the kernel sleeps in the middle of a critical section.
    Finally, two processors should never be able to simultaneously access the shared
    data. With a clear picture of what data needs protection, it is not hard to provide
    locking to the world safe. The hard part is identifying these conditions and realizing
    that to prevent concurrency, you need some form of protection. Let us reiterate
    this point, it is quite important to understand the locking code that you design.
    For example, if you lock your code on the fly, then the hard part is identifying
    the actual shared data and the corresponding critical sections. This is why locking
    your code from the start, and not as an afterthought, is of paramount importance.
    It can be very hard to go in, in the fact, after the code has already been written,
    and identify what needs locking and retrofit locking into the existing code. The
    result is usually not pretty, either. The moral of this is to *always* design
    proper locking into your code from the beginning.'
