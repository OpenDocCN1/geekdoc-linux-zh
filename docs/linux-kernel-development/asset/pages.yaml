  md: 'Finally, a process exits the exit() system call. This function terminates the
    process and frees its resources. A parent process can inquire about the status
    of a terminated child, via the wait() system call that enables it to wait for
    the termination of a specific process. When a process exits, it enters into special
    zombie state that is used to represent terminated processes until the parent calls
    wait() or waitpid().


    Another name for a process is a task. The Linux kernel refers to processes as
    tasks. In this book, I will use these terms interchangeably, although I will try
    to denote the kernel representation of a running program as a task and the user-space
    representation as a process.


    # The Process Descriptor and Task Structure


    The kernel stores the processes in a circular doubly linked list the task list.
    Each element in the task list is a process descriptor of the type task_struct,
    which is defined in include/linux/sched.h. The process descriptor contains all
    the information about a specific process.


    The task_struct is a relatively large structure around 1.7 kilobytes on a 32-bit
    machine. This size is, quite small considering the structure contains all the
    information the kernel needs about a process. The process descriptor contains
    the data that describe the executing program—open files, the process''s address
    space, pending signals, the process''s state, and much more (see Figure 2.1).


    # Allocating the Process Descriptor


    The task_struct is allocated via the slab allocator to provide object reuse and
    caching (see Chapter 10, "Memory Management"). Prior to the 2.6 kernel series,
    the task_struct was stored at the end of the kernel stack of each process. This
    allowed architectures with few registers, such as x86, to calculate the location
    of the process descriptor via the stack pointer without using an extra register
    to store the location. With the process descriptor now dynamically created via
    the slab allocator, a new structure, thread_info, was created again and lives
    at the bottom of the stack (for stacks that grow down) or at the top of the stack
    (for stacks that grow up). See Figure 2.2.


    +   The kernel implements the wait() system call. Linux systems via the C Library,
    typically provide the wait(),waitpid(),wait3(), and wait4() functions. These functions
    return status about a terminated process, albeit with slightly different semantics.


    +   Some texts on operating system design call this the task array. Because the
    Linux implementation is a linked list and not a static array, it is called the
    task list.


    +   Register-invariant architectures were not the only reason for creating struct
    thread_info. The new structure also makes it easier to calculate offsets of its
    values in assembly code.'
