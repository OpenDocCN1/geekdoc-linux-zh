  md: '# A tickless OS?


    You might wonder if an operating system needs a fixed timer interrupt. Is it possible
    to design an OS without ticks? Yes, it is possible but it might not be pretty.


    There is no absolute need for a fixed timer interrupt. Instead, the kernel can
    use a dynamically programmed timer for each pending event. This quickly adds a
    lot of ticks, so a better idea is to have just one timer and program it to occur
    when the next earliest event is due. When that timer executes, a timer for the
    next event arrives. With this approach, there is no periodic timer interrupt and
    no jiffy value.


    Two issues need to be overcome with this approach. The first is to manage some
    concept of ticks, at least so the kernel can keep track of relative time. It is
    not too hard to solve. The second issue—how to overcome the overhead of managing
    all dynamic ticks, even with the optimized version—is a bit harder. The overhead
    and complexity is high enough that the Linux kernel does not take this approach.
    Nevertheless, people have tried and the results are interesting—search online
    if interested.


    # Jiffies


    The variable jiffies holds the number of ticks that have occurred since the system
    booted. On boot, the kernel initializes the variable to zero, and it is incremented
    by one after each timer interrupt. Thus, there are HZ jiffies in a second. The
    system uptime is thus jiffies/HZ seconds.


    The jiffies variable is declared in `<linux/jiffies.h>` as:


    ```

    extern long volatile jiffies;

    ```


    In the next section, we will look at its actual definition, which is a bit peculiar.
    For now, let''s look at some example kernel code. To convert seconds to jiffies:


    ```

    (seconds) * HZ;

    ```


    Likewise, to convert jiffies to seconds:


    ```

    (jiffies / HZ);

    ```


    The former is more common. For example, code often needs to set a value for some
    time in the future:


    ```

    unsigned long time_stamp = jiffies;      /* now */

    unsigned long next_tick = jiffies + 1;     /* one tick from now */

    unsigned long later = jiffies + 5*HZ;         /* five seconds from now */

    ```


    The latter is typically reserved for communicating with user-space, as the kernel
    itself rarely cares about any sort of absolute time.


    Note that jiffies is prototyped as unsigned long and storing it in anything else
    is incorrect.'
