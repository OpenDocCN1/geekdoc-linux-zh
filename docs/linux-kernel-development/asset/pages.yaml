  md: '# The new percpu Interface


    smp_processor_id() to get the current processor number, kernel perception is disabled—always
    the aforementioned methods to remain safe.


    The 2.6 introduced a new interface, known as percpu, for creating and manipulating
    per-CPU data. This interface generalizes the previous example. Creation and manipulation
    of per-cpu data is simplified with this new approach.


    The previously discussed method of creating and accessing per-cpu data is still
    valid and accepted. This new interface, however, grew out of the needs for a simpler
    and more powerful method for manipulating per-cpu data on large symmetrical multiprocessing
    computers.


    The header <linux/percpu.h> defines all the routines. You can find the actual
    definitions in mm/slab.c, and in <asm/percpu.h>.


    # Per-CPU Data at Compile-Time


    Defining a per-cpu variable at compile-time is quite like this:


    ```

    DEFINE_PER_CPU(type, name);

    ```


    This creates an instance of a variable of type, named name, for each processor
    on the system. If you need a declaration of the variable elsewhere, to avoid compile
    warnings, the following macro is your friend:


    ```

    DECLARE_PER_CPU(type, name);

    ```


    You can manipulate the variables with the get_cpu_var() and put_cpu_var() routines.
    A call to get_cpu_var() returns an l-value for the given current processor. It
    disables preemption, which put_cpu_var() correctly enables.


    ```

    get_cpu_var(name)++; /* increment name on this processor */

    put_cpu_var(); /* enable kernel preemption */

    ```


    You can obtain the value of another processor''s per-cpu data, too:


    ```

    per_cpu(name, name)++; /* increment name on the given processor */

    ```


    You need to be careful with this approach because per_cpu() neither disables kernel
    preemption nor provides any sort of locking mechanism. The lockless nature of
    per-cpu data only exists if the current processor is the only manipulator of data.
    If other processors touch other processor''s data, you need locks. Be careful.
    Chapter 7, "Kernel Synchronization," and Chapter 8, "Kernel Synchronization Methods,"
    discuss locking.


    Another subtle note, these compile-time per-cpu examples do not work for modules
    because the linker actually creates them in a unique executable section (for the
    curious, data.percpu). If you need to access per-cpu data from modules, or if
    you need to create such data dynamically, there is hope.'
  merge: -1
