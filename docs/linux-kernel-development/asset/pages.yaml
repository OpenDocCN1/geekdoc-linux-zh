  md: 'Semaphores were formalized by Edsger Dijkstra in 1968 in a generalized locking
    mechanism. A semaphore supports atomic operations, P() and V(), named after the
    Dutch Proberen, to test (literally), and the Dutch Verogen, to increment. Later
    systems called these methods down() and up respectively, and so Linux. The down()
    method is used to acquire a semaphore by decrementing the count by one. If it
