  md: 'The call to `resched(if, delay)` schedules a new process, but only if `need_resched`
    is set. Otherwise, this solution conditionally invokes the scheduler if there
    is some other task to run. Because this approach invokes the scheduler, you cannot
    make it from an interrupt handler—only process context. In fact, all these approaches
    are best used from process context, where interrupt handlers should execute as
    quickly as possible (and busy looping does not help the kernel''s scheduler).
    For more details, see the section on scheduling.


    A coder might wonder what guarantee is that the previous loop works. The C compiler
    is free to perform a get only once. Normally, no assurance is given that the `jiffies`
    in the conditional loop is reloaded on each iteration. We require, however, that
    `jiffies` be reada on each iteration. The `volatile` keyword instructs the compiler
    to reload the variable on each access from main memory and never allow as the
    value in `<linux/jiffies.h>` to guarantee that the loop completes as.


    # Small Delays


    Some kernels, code (usually users) requires very short (smaller than a clock tick)
    and rather precise delays. This is often to synchronize with hardware, which again
    usually lists minimum time for an activity to complete—often less than a millisecond.
    With a timer interrupt of 100 Hz, the clock tick is a large 10 milliseconds. Even
    it would be impossible to use `jiffies`-based delays, like the clock tick is still
    one millisecond. We clearly need another solution for smaller, more precise delays.


    Thankfully, the kernel provides two functions for microsecond and millisecond
    delays, both defined in `<linux/delay.h>`, which do not use `jiffies`:


    ```

    void udelay(unsigned long use);

    void mdelay(unsigned long msec);

    ```


    The former function delays execution by busy looping for the specified number
    of microseconds. The latter function delays execution for the specified number
    of milliseconds. Recall that one second equals 1000 milliseconds, which equals
    1000000 microseconds. Usage is trivial,


    ```

    udelay(150); /* delay for 150 μs */

    ```


    The `udelay()` function is implemented as a loop which knows how many iterations
    can be executed in a period of time. The `mdelay()` function is implemented in
    `udelay(). Because the kernel knows how many loops the processor can complete
    in a second (see the sidebar on BogoMIPS), the `udelay()` function simply scales
    that value to get the correct number of loop iterations for the given.'
