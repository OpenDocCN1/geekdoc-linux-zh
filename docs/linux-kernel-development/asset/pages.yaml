  pgno: 91
- img_proc: true
  md: 'Different devices are associated with unique interrupts by means of a unique
    value associated with each interrupt. Typically, interrupts from the keyboard
    are distinct interrupts from the hard drive. This enables the operating system
    to differentiate between interrupts and to know which device caused which interrupt.


    These interrupts are often called interrupt request (IRQ) lines. Typically, they
    are given a numeric value—for example, on a PC, IRQ zero is the keyboard interrupt.
    Not all interrupts are so defined; interrupts associated with the PCI bus, for
    example, are dynamically assigned. Other non-PC architectures have similar dynamic
    assignments for interrupts. The important notion is that a specific interrupt
    is associated with a specific device, and the kernel knows this.


    # Exceptions


    Exceptions are often delivered at the same time as interrupts. Unlike interrupts,
    they occur synchronously with respect to the processor clock. In fact, they are
    often called synchronous interrupts. Exceptions are produced by the processor
    while executing instructions in response to programming error (for example, divide
    by zero or abnormal conditions that must be handled by the kernel (for example,
    page fault). Because many processor architectures handle exceptions in a similar
    manner to interrupts, the kernel interface for handling them is similar. Much
    of the discussion of interrupts (asynchronous interrupts generated by hardware)
    in this chapter also pertains to exceptions (synchronous interrupts generated
    by the processor itself).


    # Interrupt Handlers


    The function that runs in response to a interrupt is called an interrupt handler
    or interrupt service routine (ISR). Each device that generates interrupts has
    an interrupt handler. For example, one device''s handles interrupts from the system
    timer, while another function interrupts generated by the keyboard. The interrupt
    handler for a device is part of the device''s driver—the kernel that manages the
    device.


    In Linux, interrupt handlers are normal C functions. They match a specific prototype,
    which enables the kernel to pass the handler information in a standard way, but
    otherwise they are ordinary functions. What differentiates interrupt handlers
    from other kernel functions is that the kernel invokes them in response to interrupts
    and they run in a special context, which we will discuss, called interrupt context.


    Because an interrupt can occur at any time, an interrupt handler in turn can be
    executed at any time. It is imperative that the handler run quickly, to resume
    execution of the interrupted code as soon as possible. Therefore, although it
    is important to the hardware that the interrupt is serviced immediately, it is
    important to the rest of the system that the interrupt handler execute in as short
    period as possible.


    In the very least, an interrupt handler''s job is to acknowledge the interrupt''s
    receipt to the hardware. Usually, however, interrupts often have a large amount
    of work'
