  md: '# The mapping is undeone


    ```

    void kunmapatomic(void *kvaddr, enum km_type type)

    ```


    This function does not block. In fact, many architectures it does not do anything
    except kernel preemption, because a temporary mapping is only valid until the
    next temporary mapping. Then, the kernel can use the kmap_atomic() mapping and
    kunmapatomic() does not need to do anything. The next atomic mapping will simply
    overwrite the previous one.


    If you continue physical pages, use one of the low-level page allocators or kmalloc().
    This is the standard manner of allocating memory from within the kernel, and most
    likely, you will allocate most of memory. Recall that the most common flags used
    for these functions are GFP_ATOMIC and to perform a high priority allocation that
    will not sleep. This is a requirement of interrupt handlers and other pieces of
    code that cannot sleep. Code that can sleep, such as process context code that
    does not hold a spin lock, use GFP_KERNEL. This flag specifies allocation that
    can be interrupted.


    If you want to allocate from high memory, use alloc_pages(). The alloc_pages()
    function returns a struct page, and not a pointer to a logical address. because
    high memory might not be mapped, the only way to access it might be via the corresponding
    struct page structure. To obtain an actual pointer, use kmap() to map the memory
    into the kernel''s logical address space.


    If you do not need physically contiguous pages—only virtually contiguous—use vmalloc()
    (although bear in mind the performance hit with vmalloc() over kmalloc()). The
    vmalloc() allocates memory that is virtually contiguous but not, per se, physically
    contiguous. This performs by mapping chunks of physical memory into a contiguous
    logical address space.


    If you are creating and destroying many large data structures, consider setting
    up a slab cache. The slab layer will maintain a per-processor object cache (a
    free list), which might greatly enhance object allocation and deallocation performance.
    Instead of frequently allocating and freeing memory, the slab layer will store
    a cache of already allocated objects. When you need a new chunk of memory to hold
    your data structure, the slab layer often does not need to allocate more memory
    and can simply return an object from the cache.


    # Which Allocation Method Should I Use?'
