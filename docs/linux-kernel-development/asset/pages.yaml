  md: "The calls might be nested—only the final call to local_bh_enable() enables\
    \ bottom halves. The functions accomplish this by maintaining a per-task counter\
    \ via the preempt_count (the same counter used by kernel preemption). When the\
    \ counter reaches zero, bottom half processing is possible. Because bottom halves\
    \ were disabled, local_bh_enable() also checks for pending bottom halves and executes\
    \ them.\n\nThe functions are unique to each supported architecture and are usually\
    \ written as complex maps in <asm/softirq.h>. The following are C representations\
    \ for the concept:\n\n```\n/*\n * disable bottom halves by incrementing the preempt_count\n\
    \ */\nvoid local_bh_disable(void)\n{\n    struct thread_info *t = current_thread_info();\n\
    \    t->preempt_count += SOFTIRQ_OFFSET;\n}\n\n/*\n * decrement the preempt_count\
    \ - this will 'automatically' enable\n * bottom halves if the counter returns\
    \ to zero\n *\n * optionally run any bottom halves that are pending\n */\n\nvoid\
    \ local_bh_enable(void)\n{\n    struct thread_info *t = current_thread_info();\n\
    \    t->preempt_count -= SOFTIRQ_OFFSET;\n\n    /*\n     * is preempt_count zero\
    \ and are there any bottom halves pending?\n     * if so, run them\n     */\n\
    \    if (unlikely(!(t->preempt_count && softirq_pending(smp_processor_id()))))\
    \ {\n        do_softirq();\n    }\nn\n```\n\n8 In fact, this counter is used by\
    \ both the interrupt and bottom half subsystems. Thus, in Linux, a single per-task\
    \ counter represents the atomicity of a task. This has proven very useful for\
    \ work such as sleeping-while-atomic bugs."
