    As discussed, memory areas are accessed via both the mmap and mm_rb fields of
    the descriptor. These two data structures independently point to all the memory
    area objects associated with the memory descriptor. In fact, both contain pointers
    to the very same vm_area_struct, merely linked in different ways.


    The first field, mmap, links together all the memory objects in a linked list.
    Each vm_area_struct structure is linked to the list via their vm_next field. The
    areas are sorted by ascended address. The first area is the vm_area_struct that
    mmap points to. The last structure points to NULL.


    The second field, mm_rb, links together all the memory objects in a red-black
    tree. The root of the red-tree is mm_rb and each vm_area_struct in this address
    space is linked to the tree via their mm_rb field.


    A red-black tree is a type of balanced binary tree. Each element in a red-black
    tree is a node. The initial node is called the root of the tree. Most nodes have
    two children: a left child and a right child. Some nodes have only one child,
    and the final nodes, leaves, have no children. For any node, the elements to the
    left are smaller in value, whereas the elements to the right are larger in value.
    Furthermore, each node is assigned a color (red or black, hence the name of this
    tree) according to two rules: The children of a red node are black and every path
    from a node to a leaf must contain the same number of black nodes. The root node
    is always red. Searching of, insertion, and deletion from the tree is O(log n)
    operation.


    The linked list is used when every node needs to be traversed. The red-black tree
    is used when locating a specific memory area in the address space. In this manner,
    the kernel uses the redundant data structures to provide optimal performance regardless
    of the operation performed on the memory areas.'
