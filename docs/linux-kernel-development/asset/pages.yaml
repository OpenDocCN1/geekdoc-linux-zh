  md: '# My BogoMIPS are Bigger than Yours!


    The BogoMIPS value has always been source of confusion and humor. The BogoMIPS
    calculation has very little to do with the performance of the processor and is
    merely used for the udelay() and mdelay() functions. It is a contraction of bogus
    (that is, fake) and MIPS (million of instructions per second). Everyone is familiar
    with a busy loop similar to this on a 1GHz Pentium 3.


    Detected 1004.942 MHz processor.


    Calibrating delay loop... 1990.65 BogoMIPS


    The BogoMIPS value is the number of busy loop iterations the processor can perform
    in a given period. BogoMIPS are a measurement of how fast a processor can do nothing!
    This value is stored in the loops_jiffy variable and is readable from /proc/cpuinfo.
    The delay loop functions use the loops_jiffy value to figure out (fairly) precisely)
    how many busy loop iterations they need to execute to provide the requisite delay.


    The kernel computes loops_jiffy on boot via calibrate_delay() in m/sec. As a general
    rule, try not to use udelay() for delays of one millisecond in duration. For longer
    durations, mdelay() works fine. Like the other busy waiting solutions to delaying
    execution, neither of these (especially mdelay(), is used for such long delays)
    should be used unless absolutely needed. Remember that it is risky to hold interrupts
    disabled, because system response and performance will be adversely affected.
    If you require precise delays, these calls are your best bet. Use of busy waiting
    functions only for a small amount of time, usually in the microsecond range.


    # schedule_timeout()


    more optimal method of delaying execution is to use schedule_timeout(). This will
    call your task to sleep until at least the specified time has elapsed. There is
    no guarantee that the sleep duration will be exactly the specified time — only
    that the duration is at least long as specified. When the specified time has elapsed,
    the task wakes up and places it back on the runqueue. Usage is easy:


    ```

    set_current_state(TASK_INTERRUPTABLE);

    schedule_timeout(s * HZ);

    ```


    The long parameter is the desired relative timeout, in jiffies. This example puts
    the task in interrupt sleep for s seconds. Because the task is marked TASK_INTERRUPTABLE,
    it wakes up prematurely if it receives a signal. If the code does not want to
    process signals, you can use TASK_UNINTERRUPTABLE instead. The task must call
    schedule_timeout() or the task will not go to sleep.'
