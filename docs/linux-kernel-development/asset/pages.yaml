  md: '# # Syscalls


    System calls (often called syscalls in Linux) are typically accessed via function
    call. They can define one or more arguments (inputs) and might result in one or
    more side effects², for example writing to a file or copying pointer. A return
    value of type long³ signifies success or error. Usually, not always, a negative
    return value of zero is usually (but not always) a sign of success. Unix system
    calls, or write a special error code into the global errno variable. This can
    be translated into human-readable errors by library functions such as perror().


    Finally, system calls, of course, have a defined behavior. The system call getpid()
    intends to return an integer that is the current process''s PID. The implementation
    of this syscall in the kernel is very simple:


    ```

    asmlinkage long sys_getpid(void)

    {\ return current->tgid;

    }

    ```


    Note that the definition says nothing about the implementation. The kernel must
    provide the intended behavior of the system call, but is free to do so with whatever
    implementation it chooses as long as the result is correct. Of course, this syscall
    is as simple as they come and there are not too many ways to implement it (certainly
    no simpler method exists)⁴.


    We can make a couple of observations about system calls even from this simple
    example. First, note the asmlinkage modifier on the function declaration. This
    is a bit of magic to tell the compiler to only on the stack for this function''s
    arguments. This is a required modifier for all system calls. Second, note that
    the getpid() system call is defined as sys_getpid() in the kernel. This is the
    naming convention taken with all system calls in Linux: system call bar() is implemented
    in the kernel as sys_bar().).


    # System Call Numbers


    In Linux, each system call is assigned a syscall number: This is a unique number
    that is used to refer a specific system call. When a user-space process executes
    a system call, the syscall number delineates which syscall was executed; the process
    does not refer to the syscall by name.


    > Note the might here. Although nearly all system calls have a side effect (that
    is, they result in some change of the system''s state), a few syscalls, such as
    getpid(), merely return some data from the kernel.


    ⁴ The use of type long is for compatibility with 64-bit architectures.


    ⁵ You might be wondering why does getpid() return TGid, the thread group ID? This
    is because, in normal processes, the TGID is equal to the PID. With threads, the
    TGID is the same for all threads in a thread group. This enables the threads to
    call getpid() and get the same PID.'
