    We will discuss specific kernel threads in more detail in later chapters.


    # Process Termination


    It is sad, but every process must terminate. When a process terminates, the kernel
    must release the resources owned by the process and notify the child''s parent
    of its unfortunate demate.


    Typically, process destruction occurs when the process calls the exit() system
    call, either explicitly when it is ready to terminate or implicitly on return
    from the main subroutine of any process (that is, the C compiler will place a
    call to exit() after main() returns). A process can terminate involuntarily. This
    occurs when the process receives a signal or exception it cannot handle or ignore.
    Regardless of how a process terminates, the bulk of the work is handled by do_exit(),
    which completes a number of chores:


    +   - Set the PF_EXIT flag in the flags member of the task_struct.

    - If BSD process accounting is enabled, call act_process() to write out accounting
    information.

    - Call exit_mm() to release the mm_struct held by this process. If no other process
    is using it (in other words, if it is not shared) then deallocate it.

    - Call sem_exit() if the process is queued waiting for an IPC semaphore, it is
    dequeued

    - Call exit_files(), exit_fs(), exit_namespace(), and exit_sigand() to decrement
    the usage count of objects related to file descriptors, filesystem data, process
    namespace, and signal handlers, respectively. If any usage counts reach zero,
    then the object is no longer in use by any process and it is removed

    - Set the task''s exit code, stored in the exit_code member of the task_struct,
    to the code provided by exit() or whatever mechanism forced the termination.

    - Call exit_notify() to send signals to the task''s parent, reunite any of the
    children to another thread in their thread group or the init process, and set
    the state to TASK_ZOMBIE.

    - Finally schedule() to switch to a new process (see Chapter 3). Because TASK_ZOMBIE
    tasks are never scheduled, this is the last code the task will ever execute.


    The code for do_exit() is defined in kernel/exit.c.'
