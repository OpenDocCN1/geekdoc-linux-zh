    # Type Flags


    The type flags specify the required action and zone modifiers to fulfill a particular
    type of transaction. Because of this, kernel code to use the correct type flag
    and not specify the modifier of flags it might. This is simpler and less error
    prone. Table 10.5 is a list of the type flags and Table 10.6 shows which modifiers
    are associated with each type.


    Table 10.5 Type Flags


    | Flag | Description |

    | --- | --- |

    | GFP_ATOMIC | The allocation is high-priority and must not sleep. This is the
    flag to use in interrupt handlers, bottom halves, and other situations where you
    cannot sleep. |

    | GFP_NOIO | This allocation might block, but will not initiate I/O. This is the
    flag to use in block I/O code when you cannot cause disk I/O. |

    | GFP_NOFS | This allocation might block, but will not initiate a filesystem operation.
    This is the flag to use in filesystem code when you cannot start another filesystem
    operation. |

    | GFP_KERNEL | This is a normal allocation and block. This is the flag to use
    in process context code when it is safe to sleep. |

    | GFP_USER | This is a normal allocation and might block. This flag is used to
    allocate memory for user-space processes. |

    | GFP_HIGHUSER | This is an allocation from ZONE_HIGHMEM and might block. This
    flag is used to allocate memory for user-space processes. |

    | GFP_DMA | This is an allocation from ZONE_DMA. Device drivers that need DMA-able
    memory use this flag, usually in combination with one of the above. |


    Table 10.6 Listing of the Modifiers Behind Each Type Flag


    | Flag | Modifiers |

