  md: '# Zones


    Because hardware limitations, the kernel cannot treat all pages as identical.
    Some pages, because of their physical address in memory, cannot be used for certain
    tasks. Because of this limitation, the kernel divides pages into different zones.
    The kernel uses the zones to group pages of similar properties. In particular,
    Linux has to deal with two shortcomings of respect to memory addressing:


    +   * Some devices are capable of performing DMA (direct memory access) only to
    certain addresses.

    * Some architectures are capable of physically addressing larger amounts of memory
    than they can virtually address. Consequently, memory is not permanently mapped
    into the kernel address space.


    Because of these constraints, there are three memory zones in Linux:


    +   * ZONE_DMA

    This zone contains pages that are capable of undergoing DMA.

    * ZONE_NORMAL

    This zone contains normal, regularly mapped, pages.

    * ZONE_HIGHMEM

    This zone contains "high memory," which are pages not permanently mapped into
    the kernel''s address space.


    The actual use and layout of the memory zones, ZONE_DMA is empty and ZONE_NORMAL
    is used for allocations regardless of their use. As a counterexample, on the x86
    architecture, ISA devices’t cannot perform DMA into the full 32-bit address space,
    because ISA devices can only access the first 16MB of physical memory. Consequently,
    ZONE_DMA on x86 consists of all memory in the range 0–16MB.


    ZONE_HIGHMEM works in the same regard. Whether an architecture can directly map
    varies. On x86, ZONE_HIGHMEM is all memory above the physical 896MB memory. On
    other architectures, ZONE_HIGHMEM is empty as all memory is directly mapped. The
    memory contained in ZONE_HIGHMEM is called high memory. The rest of the system''s
    memory is called low memory.


    > 1 Some broken PCI devices can only perform DMA into a 24-bit address space.
    But they are broken.


    > 2 This has nothing to do with high memory in DOS.'
