    ```\n\nBoth of these macros create a `struct tasklet` with the given name. When\
    \ the tasklet is scheduled, the given function `func` is executed and passes the\
    \ argument `data`. The difference between the two macros is the initial count.\
    \ The first macro creates the tasklet with a count of zero, and the second macro\
    \ sets count to one, and the tasklet is disabled. Here is an example:\n\n```\n\
    DECLARE_TASKLET(my_tasklet, my_tasklet_handler, dev);\n```\n\nThis is equivalent\
    \ to:\n\n```\nstruct tasklet_struct my_tasklet = { NULL, 0, ATOMIC_INIT(0),\n\
    \                tasklet_handler, dev };\n```\n\nThis creates a tasklet named\
    \ `my_tasklet` that is enabled with `tasklet_handler` as its handler. The value\
    \ of `dev` is passed to the handler when it is executed.\n\nTo initialize a tasklet\
    \ with an indirect reference (pointer) to a dynamically created\n\n```\nstruct\
    \ tasklet_struct t;\ntasklet_init(&t, tasklet_handler, dev); /* dynamically not\
