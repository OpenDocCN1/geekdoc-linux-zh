  md: '# The Robustness of printk()


    One property of printk() quickly taken for granted is its robustness. The printk()
    function is capable of just about anywhere in the kernel at anytime. It can be
    called from interrupt or process context. It can be called while holding a lock.
    It can be called simultaneously on multiple processors, yet it does not require
    the caller to hold a lock.


    It is a resilient function. This is important because the usefulness of printk()
    rests on the fact that it is always there and always works.


    # The Nonrobust of printk()


    A hole in robustness of printk() exists. It is unusable before a certain point
    in the kernel boot process, prior to console initialization. If the kernel is
    not initialized, where is the output supposed to go?


    This is normally not an issue, unless you are dealing with very issues early in
    the boot process (for example, in setup_arch()), which performs architecture-specific
    initialization. Debugging can be a challenge with the absence of any print method
    only compounds the problem.


    There is some hope, but not a lot. Hardcore architecture hackers use the hardware
    that does work (say, a serial port) to communicate with the outside world. Trust
    me, this is not for most people. Some supported architectures implement a simple
    solution, others (x86 included) have patches available that also save the day.


    The solution is a printk() variant that can output to the console very early in
    the boot process, early_printk(). The behavior is the same as printk(), which
    implemented. It will become your best friend, though, if it does.


    Unless you need to write to the console very early in the boot process, you can
    rely on printk() to always work.


    # Loglevels


    The major difference between printk() and printf() is the capability of the former
    to specify a loglevel. The kernel uses the loglevel to decide whether to print
    the message to the console. The kernel displays all messages with a loglevel below
    a specified value on the console.


    You specify a loglevel like this:


    ```

    printk(KERN_WARNING "This is a warning!\n");

    printk(KERN_DEBUG "This is a debug notice!\n");

    printk("I did not specify a loglevel!\n");

    ```


    The KERN_WARNING and KERN_DEBUG strings are simple defines found in <kernel.h>.
    They expand to a string as "<4>" or "<?" that is concatenated to the front of
    the printk() message. The kernel then decides messages to print on the console
    based on this specified loglevel and the current console loglevel,console_loglevel
    Table 15.1 is a full listing of the available loglevels.'
