  md: 'The frequently used flags and when you might need them. The vast majority of
    allocations in the kernel use the GFP_KERNEL flag. The allocation may sleep. Because
    the call block, can only be used from process context that can reschedule (that
    is, no locks are held and so on). As this flag does not make stipulations to how
    the kernel may be requested, the memory allocation has a high probability of succeeding.


    On the other end of the spectrum is the GFP_ATOMIC flag. This flag specifies memory
    allocation that cannot sleep, the allocation is very restrictive in the kernel
    it calls for. If sufficiently large chunk of memory is available, the kernel will
    not very likely to free memory it cannot put the caller to sleep. Conversely,
    the GFP_KERNEL allocation can put the caller to sleep to swap pages, flush dirty
    pages to disk, and so on. GFP_ATOMIC is unable to perform any of these actions,
    as it has a chance of sleeping when memory is low) compared to GFP_KERNEL. Nonetheless,
    the GFP_ATOMIC flag is the only option when the current code is able to sleep,
    with interrupt handlers and bottom halves.


    In between these flags are GFP_NOID and GFP_NOFS. These flags might block, but
    they may perform something from other operations. GFP_NOID allocation will not
    initiate any disk IO whatsoever to fulfill the request. On the other hand, GFP_NOFS
    might initiate disk IO which will not be interrupted. you might not want this
    if, for example, the allocation path in the filesystem code initiated without
    the GFP_NOFS flag. If the allocation resulted in more filesystem operations, the
    allocations might cause more filesystem operations, which would result in another
    allocation and, thus, more filesystem operations! This could continue indefinitely.
    Code such as this that invokes the allocator must ensure that the allocator does
    not execute, or else the allocation can create a deadlock. Surprisingly, the kernel
    uses these two flags in a handler of pages.


    The GFP_DMA flag is used to specify that the allocator must satisfy the request
    from ZONE_DMA. This flag is used by device drivers, which need DMA-able memory
    for their devices. You may combine this flag with the GFP_ATOMIC or GFP_KERNEL
    flag.


    In the vast majority of the code you write will use either GFP_KERNEL or GFP_ATOMIC.
    Table 10.7 is list of the common situations and the flags to use. Regardless of
    the allocation type, you must check for and handle failures.


    # Table 10.7 Which Flag to Use When


    | Situation | Solution |

    | --- | --- |

    | Process context, can sleep | Use GFP_KERNEL |

    | Process context, cannot sleep | Use GFP_ATOMIC, or perform your allocations
    with GFP_KERNEL at an earlier or later point when you sleep |

    | Interrupt handler | Use GFP_ATOMIC |'
