  md: '# # Removal of the Process Descriptor


    After_exit() completes, the process descriptor for the terminated process still
    exists but the process is unable to run. As this allows the system to obtain information
    about a child process after it has terminated, the acts of cleaning up a process
    and removing its process descriptor are separate. After the parent has obtained
    information on its child, the task_struct is deallocated.


    The wait() family of functions is implemented via a single (complicated) system
    call, wait(). The standard behavior is to suspension execution of the calling
    task until one of its children exit at which time the function returns with the
    PID of the exited child. Additionally, a pointer is provided to the function that
    on return holds the exit code of the terminated.


    When it is time to finally deactivate the process descriptor, release_task() is
    invoked. It does the following:


    +   - free_id() to decrement the usage count of the process''s user. Linux keeps
    a per-user cache of information related to how many processes and files a user
    has opened. If the usage count reaches zero, the user has no open processes or
    files, and the cache is destroyed.

    - unhash_process() to remove the process from the pidhash and remove it from the
    ptrace list.

    - task_privated(), repent it to its original parent and remove the process from
    the task list.

    - Finally, put_task_struct() to free the pages containing the process''s kernel
    stack and thread_info structure and deallocate the slab cache containing the task_struct.


    At this point, the process descriptor and all resources belonging to the process
    have been freed.


    # # The Dilemma of the Parentless Task


    If a parent exits before its children, some mechanism must exist to repent the
    child tasks to a new process or parentless terminated processes would forever
    remain zombies, wasting system memory. The solution, hinted upon previously, is
    to repent a task''s children on exit to enter another process in the current thread
    group, or if it fails, the init process. in do_exit(),notify_parent() is invoked,
    which calls forget_original_parent() to perform the repeating.'
  merge: -1
