    # The Anticipatory I/O Scheduler


    Although the Deadline I/O scheduler does a great job minimizing read latency,
    it does so at the expense of global throughput. Consider a system undergoing heavy
    write activity. Every time a read request is issued, the I/O scheduler quickly
    rushes to handle the read request. This results in the disk seeking to where the
    read is performed, and back. The preference toward read requests is a good thing,
    but the resulting jag of seeks (one to the location of the read request and back
    to the ongoing write) is detrimental to global disk throughput. The Anticipatory
    I/O scheduler aims to provide excellent read latency, but also provide excellent
    global throughput.


    First, the Anticipatory I/O scheduler starts with the Deadline I/O scheduler as
    its base. Therefore, it is not entirely different. The Anticipatory I/O scheduler
    implements three queues (plus the dispatch queue) and expirations for each request,
    just like the Deadline I/O scheduler. The major change is the addition of an anticipation
    heuristic.


    The Anticipatory I/O scheduler attempts to minimize the seek that accompanies
    read requests issued during other disk I/O activity. When a request is issued,
    is handled within its usual expiration period, as usual. After the request is
    submitted, however, the Anticipatory I/O scheduler does not immediately seek back
    and returning nothing for any other requests. Instead, it waits for a few milliseconds
    (the actual value is configurable; by default it is six milliseconds). In those
    few milliseconds, there is a good chance that the application will submit another
    read request.'
