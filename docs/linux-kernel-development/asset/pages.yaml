  md: 'threads adjusts dynamically depending on the amount of page writeback and congestion.
    If all existing pdfflush threads are busy writing data, a new thread is created.
    This ensures that a single device queue is not congested while other, less busy,
    device queues sit around needing data writeback. If the congestion diminishes,
    however, the number of pdfflush threads is scaled back to conserve memory.


    This is all well and good, but what if each pdfflush thread gets hung writing
    to the same, congested, queue? In that case, the performance of multiple pdfflush
    threads would not be improved over a single thread. The memory wasted, however,
    would be significantly greater. To mitigate this, the pdfflush threads employ
    avoidance. They actively try to writeback pages whose queues are not congested.
    As a result, the pdfflush threads spread out their work and refrain from merely
    hammering on the same page busy device. When the pdfflush threads are “busy”—and
    thus, a new thread is spawned—they are truly busy.


    Because of the improvements in page writeback, including the introduction of pdfflush,
    the 2.6 kernel is capable of keeping many more disks saturated than any earlier
    kernel. In the face of heavy activity, the pdfflush threads can maintain high
    throughput across multiple disks.'
