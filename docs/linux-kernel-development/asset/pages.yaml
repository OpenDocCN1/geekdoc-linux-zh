  md: "# Saving couple dereferences\n\nIf you happen to have the next and prev pointers\
    \ available, you can save couple cycles (specifically, the dereferences to the\
    \ pointers) by calling the internal functions directly. Every previously described\
    \ function does nothing except the next and prev pointers and call the internal\
    \ functions. internal functions generally have the same name as their wrappers,\
    \ which are prefixed by double underscores. For example, calling list_del(list)\
    \ can call list_del(prev, next). This is only useful if the next and previous\
    \ pointers are already dereferenced. Otherwise, you are just writing code. See\
    \ include/linux/list.h for the exact interfaces.\n\n# Traversing Linked Lists\n\
    \nNow you know how to create, initialize, and manage a linked list in the kernel.\
    \ This is all very well and good, but it is meaningless if you have no access\
    \ to your data! The lists are just containers that hold your important data: we\
    \ need a way to use the list to move around and access the actual structures that\
    \ contain our data. The kernel provides a nice set of interfaces for traversing\
    \ linked lists and referencing the data structures that contain them.\n\nNote\
    \ that, unlike list manipulation, iterating over a list with the list_for_each()\
    \ macro. The macro takes two parameters, both list_head structures. The first\
    \ is the next entry in the list, each list_head in the list you want to traverse.\
    \ On each iteration of the loop, the first parameter points to the next entry\
    \ in the list, each entry has been visited. Usage:\n\n```\nstruct list_head *p;\n\
    list_for_each(p, list) {\n    /* p points to an entry in the list */\n}\n```\n\
    \nWell, is that still enough? A pointer to the list is usually no good, what we\
    \ need a pointer to the structure that contains the list. For example, with our\
    \ previous my_struct example, we want a pointer to each my_struct, not a pointer\
    \ to the list member in the structure. The macro list_entry() is provided, which\
    \ returns the structure that contains a given list_head. It takes three parameters:\
    \ a pointer to the element, the type of structure that the list is embedded in\
    \ it, and the name of the list within that structure.\n\nExample:\n\n```\nstruct\
    \ list_head *p;\nstruct my_struct *my;\nlist_for_each(p, my->list) {\n```"
