  md: '# Barriers


    When dealing with synchronization between multiple processors or hardware devices,
    it is sometimes a requirement that memory-reads (loads) and memory-stores (stores)
    issue in the order specified in your program code. When talking to hardware, you
    often need to ensure a read occurs before another read or write. Additionally,
    on multiprocessing systems, it may be important to order your code issues them
    (usually to ensure subsequent reads see the data in the same order). Complicating
    these issues is the fact that the compiler and the processor reorder reads and
    writes—for performance reasons. Thankfully, all processors that reorder provide
    memory instructions to ensure ordering requirements. It is also possible to instruct
    the compiler not to reorder around a given point. These are called *barriers*.


    Basically, on some processors the code


    ```

    a = 1;

    b = 2;

    ```


    may store the new value in $b$ *before* they store the new value in $a$. A processor
    and the compiler, however, will never reorder writes as


    ```

    a = 1;

    b = a;

    ```


    because there is a data dependency between $a$ and $b$. Neither the compiler nor
    the processor, however, know about code in other contexts. Occasionally, it is
    important that writes are seen by other code and outside the world in the order
    you intend. This is often the case with hardware devices, but is also a commonality
    on multiprocessing machines.


    The `rmi()` method provides a read barrier. It ensures that no loads are reordered
    across the `rmi()` call. That is, the call will be reordered to after the call
    and no loads after the call will be reordered to the call.


    The `wmb()` method provides a write barrier. It functions in the same manner as
    `rmi()`, but with respect to stores instead of loads—it ensures that no stores
    are reordered across the barrier.


    The `mb()` call provides both a read barrier and a write barrier. No loads or
    stores will be reordered across a call to `mb()`. It is provided because a single
    instruction (often the same same instruction used by `rmi()`) can provide both
    the load and store barrier.


    A variant of `rmi()`, `read_barrier_depends()`, provides a read barrier, but *only*
    for loads that subsequent loads depend on. All reads prior to the barrier are
    guaranteed to complete before any reads after the barrier that depend on the prior
    to the barrier. Got


    > Although, Intel x86 processors do *not* ever reorder writes. That is, they do
    not do out-of-order stores. But other processors do.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Basically, it enforces a barrier, rmb (), but for certain reads--those that
    depend on each other. On some architectures, read_barrier_depends() is much quicker
    than rmb () because it is not needed and, thus, is a noop.


    Let''s consider an example using mb () and rmb (). The initial value of a is one
    and b is two.


    # Thread 1


    # Thread 2


    +   - a = 3;

    mb ();

    b = 4;


    +   - c = b;

    rmb ();

    d = a;


    Without using memory barriers, on some processors it is possible that c receives
    the new value of b, while d receives the old value of a. For example, c could
    equal four (what we expect), yet d could equal one (not we expect). Using the
    mb () ensured a and b were written in the intended order, while the rmb () and
    wmb () functions insure and d were read in the intended order.


    This sort of ordering occurs because processors dispatch and commit instructions
    out-of-order, to optimize their pipelines. What can end happening in the example
    above is that instructions associated with the load of c appear out of order.
    The rmb () and wmb () functions tell the processor to commit pending load or store
    instructions, respectively, before continuing.


    Let''s look at a similar example, but one in which we can use read_barrier_depends()
    instead of rmb (). In this example, initially a is one, b is two, and p is b.


    # Thread 1


    # Thread 2


    +   - a = 3;

    mb ();

    pp = &a;


    +   - pp = p;

    read_barrier_depends ();

    b = pp;


    Again, without memory barriers, it would be possible for b to be set to pp before
    pp was set to p. The read_barrier_depends(), however, provides a sufficient barrier
    because the load of pp *depends on the load of p. It would also be sufficient
    to use rmb () here, because the reads are data-dependent, we use the potentially
    faster read_barrier_depends(). Note in either case, the mb () is required to enforce
    the intended load/store ordering in the left thread.


    The macros sm_rmb(), sm_wmb(), sm_mb(), and sm_read_barrier() provide a useful
    optimization. On SMP kernels they are defined as the usual memory barriers, while
    UP kernels they are defined as a compiler barrier. You use these SMP variants
    when the ordering constraints are specific to SMP systems.'
