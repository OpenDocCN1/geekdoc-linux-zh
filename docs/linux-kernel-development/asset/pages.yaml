  md: '# bflush and kupated


    Prior to the 2.6, the job of the bflush threads were met by two other kernel threads,
    bflush and kupated.


    The bflush kernel thread performed background writeback of pages when memory was
    low. A set of thresholds were maintained, similar to bflush, and bflush was awakened
    via wakeup_wakeup() whenever free memory dropped below these thresholds.


    There are two differences between bflush and pdf. The first, which we look at
    in the next section, is that there is always one bflush daemon, while the number
    of pdf threads is dynamic. The second difference is that bflush was buffer-based;
    it wrote back buffers. Conversely, pdf is page-based; it writes back pages. The
    pages are a more general and common unit. This is beneficial as managing pages
    is easier than buffers, because the actual I/O is a unit and not a single buffer.


    Because bflush flushes buffers when memory is low or the number of buffers is
    large, the kupated thread was introduced to periodically write back pages. Each
    served an identical purpose to bflush_wb_kupated() function.


    Both the bflush and kupated threads and their functionality was replaced by the
    pdflush threads.


    # Congestion Avoidance: Why We Have Multiple Threads


    One of the flaws in the bflush solution was that bflush consisted of only one
    thread. This led to congestion during page writeback where the single bflush thread
    would block on a single congested device queue (the list while other device queues
    would remain relatively idle. If the system has multiple, and the associated processing
    power, the kernel should be able to keep each disk busy. Unfortunately, even with
    plenty of data needing writes—small number. If only a single thread performs page
    writeback, that single thread can easily spend a large portion of time waiting
    for a disk, because disk writeback is such a limiting quantity. To mitigate this,
    the kernel needs to multiply page writeback. In this manner, no single device
    queue can become a bottleneck.


    The 2.6 solves this problem by allowing multiple pdflush threads to exist. Each
    individually flushes dirty pages to disk, allowing different pdflush threads to
    concentrate on device queues.


    The number of threads changes throughout the uptime of a system, according to
    a simple algorithm. If all existing pdflush threads are busy for at one second,
    a new pdflush thread is created. The total number of threads cannot exceed MAX_PDFFLUSH_THREADS,
    which by default is eight. Conversely, if a pdflush thread was asleep for more
    than a second, it is terminated. The minimum number of threads is at least MIN_PDFFLUSH_THREADS,
    which by default is two. In this manner, the number of pdflush'
