  md: '# # Scheduling Work


    Now that the work is created, we can schedule it. To queue a work''s handler with
    the default *events*, simply call


    ```

    schedule_work(&work);

    ```


    The work is scheduled immediately and is run as the *events* worker thread when
    the processor wakes up.


    Sometimes, you do not want the work to execute immediately, but instead after
    some delay. In those cases, you can schedule work to execute at a given time in
    the future:


    ```

    schedule_delayed_work(&work, delay);

    ```


    In this case, the *work_struct* pointed to by *work* will not execute for at least
    *delay* timer ticks into the future. Using ticks as a unit of time is covered
    in Chapter 9.


    # # Flushing Work


    Queued work is executed when the worker thread wakes up. You need to ensure that
    a given batch of work has been completed before continuing. This is especially
    important for modules, which probably want to call this function before unloading.
    Other places in the kernel also need to make certain no work is pending, preventing
    race conditions.


    For these needs, there is a function to flush a given queue:


    ```

    void flush_scheduled_work(void);

    ```


    This function waits until all entries in the queue are executed before returning.
    While waiting for any work to execute, the function sleeps. Therefore, you can
    only call it from process context.


    Note that this function does not cancel any delayed work. That is, any work that
    was scheduled via *schedule_delayed_work()*, and whose delay is not up, is flushed
    via *flush_scheduled_work()*. To cancel delayed work, call


    ```

    int cancel_delayed_work(struct work_struct *work);

    ```


    # # Creating New Work Queues


    If the default queue is insufficient for your needs, you can create a new work
    queue and corresponding worker threads. Because this creates one worker thread
    per processor, you should only create unique work queues if your code needs the
    performance of a unique set of threads.


    You create a new work queue and the associated worker threads via a simple function:


    ```

    struct work_queue *create_workqueue(const char *name);

    ```


    The parameter *name* is used to name the kernel threads. For example, the default
    *events* queue is created via


    ```

    struct work_queue *kevent_twq = create_workqueue("events");

    ```'
