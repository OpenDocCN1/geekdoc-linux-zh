  md: "# # Memory Management\n\nMEMORY ALLOCATION INSIDE THE KERNEL is not as easy\
    \ as memory allocation outside the kernel. A lot of factors contribute to this.\
    \ Primarily, the kernel lacks the luxuries enjoyed by user-space. Unlike user-space,\
    \ the kernel is not always afforded the capability to easily allocate memory.\
    \ For example, often the kernel cannot sleep. Furthermore, the kernel cannot easily\
    \ deal with memory errors. Because of these limitations, the need for a lightweight\
    \ memory allocation scheme, getting hold of memory in the kernel is more complicated\
    \ than in user-space. This is not to say that memory allocations are difficult,\
    \ however, as we'll see.\n\nThis chapter discusses the methods used to obtain\
    \ memory inside the kernel. Before we delve into the actual allocation interfaces,\
    \ we need to look at how the kernel handles memory.\n\n# ## Pages\n\nThe kernel\
    \ treats physical pages as the basic unit of memory management. Although the processor's\
    \ smallest addressable unit is usually a word, the memory management unit (MMU),\
    \ the hardware that manages memory and performs virtual to address translations\
    \ typically deals in pages. Because of this, the MMU manages the system's page\
    \ tables with page-sized granularity (hence their name). In terms of virtual memory,\
    \ pages are the smallest unit that matters.\n\nAs we see in Chapter 16, \"Portability,\"\
    \ each architecture supports its own page size. Many architectures support multiple\
    \ page sizes. Most 32-bit architectures have 4KB pages, whereas most 64-bit architectures\
    \ have 8KB pages. This implies that on a machine with 4KB pages and 1GB of physical\
    \ memory, physical memory is divided into 262,144 distinct pages.\n\nThe kernel\
    \ represents every physical page on the system with a struct page page structure.\
    \ This structure is defined in `<linux/mm.h>`:\n\n```\n```\nstruct page {\n  \
    \  unsigned long flags;\n```\n```"
