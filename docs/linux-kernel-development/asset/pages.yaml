    Using work queues is easy. We will cover the default `events` queue first, and
    then we will look at creating new worker threads.


    # Creating Work


    The first step is actually creating some work to defer. To create the structure
    statically at run-time:


    ```

    DECLARE_WORK(name, void (*func)(void *), void *data);

    ```'
