    mechanisms are available for implementing a bottom half. Whereas in the previous
    chapter we looked at a simple way of implementing interrupt handlers, in this
    chapter we will look at multiple methods of implementing them. In fact, over the
    course of Linux''s history there have been many bottom half mechanisms. Confusingly,
