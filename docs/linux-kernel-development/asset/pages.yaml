    # Word Size and Data Types


    A word is the amount of data that a machine can process at one time. This fits
    into the document analysis includes characters (eight bits) and pages (many words)
    as other measurements of data. A word is some number of bits—most commonly, 16,
    32, or 64. When someone talks about the "n-bit" of a machine, they are generally
    talking about the machine''s word size. For example, when people say the Pentium
    is a 32-bit chip, they are referring to its word size, which is 32-bits, or four
    bytes.


    The size of a processor''s general-purpose registers is equal to its word size.
    Usually, the width of the components in a given architecture—for example, the
    bus—are at least wide as the word size. Typically, at least in the architectures
    Linux supports, the memory address space is equal to the word size. Consequently,
    the length of a pointer is equal to the word size. Additionally, the size of the
    C type is equal to the word size, whereas the size of the int type is sometimes
    less than that of the word size. For example, the Alpha has a 64-bit word size.
    Consequently, registers, pointers, and the long type are 64-bits in length. The
    int type, however, is 32-bits long. The Alpha can access and manipulate 64-bits,
    one word at a time.


    > 2 The actual addressable memory may be less than the word size. For example,
    a 64-bit architecture would have 64-bit pointers, only 48-bits may be usable and
    address. In addition, the total physical memory may be larger than the word size,
    thanks to things like Intel''s PAE.'
