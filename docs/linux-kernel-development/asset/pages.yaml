    # # Synchronization and Concurrency


    The kernel is prone to race conditions. Unlike a single-threaded user-space application,
    a number of properties the kernel allow for concurrent access of shared resources
    and thus require synchronization to prevent races.


    +   * The kernel supports multiprocessing. Therefore, without proper protection,
    kernel code executing on two or more processors can access the same resource.

    * Interrupts occur asynchronously with the currently executing code. Therefore,
    without proper protection, an interrupt can occur in the midst of accessing a
    shared resource and the interrupt handler access the same resource.

    * The Linux kernel is preemptive. Therefore, without protection, kernel can be
    preempted in favor of different code that accesses the same resource.


    For a thorough discussion of synchronization and concurrency, see Chapter 7, "Kernel
    Synchronization Introduction," and Chapter 8, "Kernel Synchronization Methods."


    # # Portability Is Important


    While user-space applications do not have to aim for portability, Linux is a portable
    operating system and should remain one. This means that architecture-independent
    C code must compile and run on a wide range of systems.


    A handful of rules—such as remain endian neutral, 64-bit clean, do not assume
    the word or page size, and so on—go a long way. Chapter 16, "Portability," is
    dedicated to the topic of portability.


