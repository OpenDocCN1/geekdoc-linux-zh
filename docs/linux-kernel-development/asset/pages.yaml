- img_proc: true
  md: "# Per-CPU Data at Run-Time\n\nThe kernel implements a dynamic allocator, similar\
    \ to kmalloc(), for creating perCPU data. This routine creates an instance of\
    \ the requested memory for each processor on the system. The prototypes are in\
    \ <linux/percpu.h>:\n\n```\nvoid *kmalloc_percpu(size_t size, int flags);\nvoid\
    \ kfree_percpu(const void *);\n```\n\nThe kmalloc_percpu() function allocates\
    \ an instance of the given size for every processor on the system. The flags parameters\
    \ work the way as flags for kmalloc(), as described in Chapter 10, \"Memory Management\
    \ and Addressing.\" See Table B.1.\n\n| Flags | Description |\n| --- | --- |\n\
    | GFP_ATOMIC | Allocate memory atomically; it will not sleep |\n| GFP_KERNEL |\
    \ Allocate normal kernel memory; it might sleep |\n| GFP_USER | Allocate memory\
    \ on behalf of the user; it might sleep |\n\nA corresponding call to kfree_percpu()\
    \ will free the data, on all processors.\n\nA call to kmalloc_percpu() returns\
    \ a pointer, which is used to indirectly reference the dynamically created per-CPU\
    \ data. The kernel provides two macros to make this easy:\n\n```\nget_cpu_ptr(ptr);\
    \    /* return a pointer to this processor's ptr */\nput_cpu_ptr(ptr);     /*\
    \ disable kernel preemption **/\n```\n\nThe get_cpu_ptr() macro returns a pointer\
    \ to the specific instance of the current processor's data. It also disables kernel\
    \ preemption, a call to put_cpu_ptr() then enables.\n\nLet's look at a full example\
    \ of these functions. Of course, this is a bit silly because you would normally\
    \ allocate the memory once (perhaps in some initialization function; percpu()),\
    \ use it in many places, and free it once (perhaps in some shutdown function).\
    \ Nevertheless, this example should make usage clear:\n\n```\npercpu_ptr;\nunsigned\
    \ long foo;\n\npercpu_ptr = kmalloc_percpu(sizeof(unsigned long), GFP_KERNEL);\n\
    if (!ptr)\n    /* error allocating memory */\n\nfoo = get_cpu_ptr(percpu_ptr);\
    \ .*/\n/* manipulate foo ./\nput_cpu_ptr(percpu_ptr);\n```"
  merge: -1
  pgno: 327
- img_proc: true
  md: "Finally, the function per_cpu_ptr(ptr) returns a processor's unique data:\n\
    \n \nAgain, it does not disable kernel preemption—if you touch another processor's\
    \ data—keep in mind that you probably need to implement locking.\n\n# Reasons\
    \ for Using Per-CPU Data\n\nThere are a couple benefits to using per-CPU data.\
    \ The first is the reduction in locking requirements. Depending on the semantics\
    \ of which processors access the CPU data, you might not need locking at all.\
    \ Keep in mind the \"only processor accesses this data\" is only a programming\
    \ convention. You need to ensure that the local processor only accesses its unique\
    \ data. Nothing stops you from cheating.\n\nSecond, per-CPU data greatly reduces\
    \ cache invalidation. This occurs as processors try to manipulate data held in\
    \ another processor's cache, that must flush or otherwise update in cache. Constant\
    \ cache invalidation is called thrashing the cache and wrecks on system performance.\
    \ With CPU data, processors only access their own data.\n\nConsequently, the use\
    \ of per-CPU data often removes (or at least minimizes) the need for locking.\
    \ The only safety requirement for their use is disabling kernel preemption, which\
    \ is much cheaper than locking and the interface does so automatically. Per-CPU\
    \ data can be safely used from either interrupt or process context. Note, however,\
    \ you cannot sleep in the middle of accessing per-CPU data (or you might end up\
    \ on a different processor).\n\nNo one is currently required to use the new per-CPU\
    \ interface. Doing things manually (with an array as originally discussed) is\
    \ fine, as long as you disable kernel preemption. The new interface, however,\
    \ is much easier to use and might gain additional optimizations in the future.\
    \ If you decide to use per-CPU data in your kernel code, consider the new interface.\
    \ One caveat against its use is that it is not backward compatible with earlier\
    \ kernels."
  merge: -1
