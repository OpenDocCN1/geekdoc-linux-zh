    \ *a_ops; /* operation table */\nstruct list_head      imap_shared;          \n\
    \    imap_shared;                         /* protects two lists above */\nspinlock_t\
    \               semaphore;            /* last modification */\nint           \
    \          gpf_map;              /* allocator flag for the page */\nstruct backing_page_info\
    \ *dev_info;     /* readahead information */\nstruct list_head      private_lock;\
    \         /* private address_space lock */\nstruct list_head      private_space;\
    \        /* private address_space list */\nstruct address_space *asmc_mapping;\
    \     /* associated buffers */\n```\n\nThe clean_pages, dirty_pages, and locked_pages\
    \ are doubly linked lists of clean, dirty, and locked pages, respectively, that\
    \ belong to this address_space. Together, these contain all the pages associated\
    \ with this address_space. There are a total of npages pages among the lists.\n\
    \nThe dirty_pages list all the page descriptors associated with this address_space\
    \ that are not locked, but are dirty. These pages have been updated, but not yet\
    \ written back to disk. That is, the copy of the page is never written on-disk-copy.\
    \ Eventually, the copy in the page cache needs to be written (synced) with the\
    \ copy on the disk. Note that it is never possible that the on-disk copy becomes\
    \ newer the cached copy because all I/O goes through the page cache.\n\nThe locked_pages\
    \ list contains all the page descriptors associated with this address_space that\
    \ are locked; the contents of these pages are currently being transferred from\
