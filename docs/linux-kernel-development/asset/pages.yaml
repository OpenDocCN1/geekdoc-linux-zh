    \ in the list and the `prev` pointer points to the previous element. If this is\
    \ the last element in the node, the `prev` pointer points to the first node. Likewise,\
    \ if this is the first element in the list, the `next` pointer points to the last\
    \ node. However, thanks to the kernel's elegant list implementation with no concept\
    \ of"
