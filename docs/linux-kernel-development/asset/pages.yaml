    # # The Load Balancer


    As discussed, the Linux scheduler implements separate runqueues and locking for
    each processor on a symmetrical multiprocessing system. That is, each processor
    maintains its own list of processes and operates the scheduler only on those tasks.
    The entire scheduling system is, in effect, unique to each processor. How, then,
    does the scheduler enforce any of global scheduling policy on multiprocessing
    systems? What if the runqueues become unbalanced, with five processes on one processor''s
    runqueue, but only one on another? The solution is the load balancer, which works
    to ensure that the runqueues are balanced. The load balancer compares the current
    processor''s runqueue to the other runqueues in the system. If there is an imbalance,
    it pulls processes from the busier runqueue to the current runqueue. Ideally,
    every runqueue will have the same number of processes. That is a lofty goal, but
    the load balancer comes close.'
