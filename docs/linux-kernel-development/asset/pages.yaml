  md: '# Binary Searching to Find the Culprit Change


    It is useful to know when a bug was introduced into the kernel source. If you
    know a bug occurred in version 2.4.18, but not 2.4.17, then you have a clear picture
    of the changes that caused the bug. The bug fix is often as simple as reverting
    or fixing the bad change.


    Many times, however, you do not know what version introduced the bug. You know
    the bug is in the current kernel, but it seemed to have been in the current kernel.
    It takes some investigative work, but with a little effort, you can find the offending
    change. With the change in hand, the bug fix is usually nearly.


    Next, you need a reliably reproducible problem. Preferably, a bug you can verify
    immediately after. Next, need a known-good kernel. You might already know this.
    For example, you know a couple months back the kernel worked, so grab a kernel
    from that period. If you are wrong, then an earlier release shouldn''t be too
    hard—unless the bug has existed forever—to find a kernel without the bug.


    Next, you need a known-bad kernel. To make things easier, start with the earliest
    kernel you know to have the bug.


    Now, begin a binary search from the known-bad kernel down to the known-good kernel.
    Let''s look at an example. Assume the known-good kernel is 2.4.11 and the earliest
    known-bad is in 2.4.20. Start by picking a kernel in the middle, such as 2.4.15.
    Test 2.4.15 for the bug. If 2.4.15 works, then you know the problem in a later
    kernel, so a kernel between 2.4.15 and 2.4.20—say, 2.4.17. On the other hand,
    if 2.4.15 does not work, then you know the problem is in an earlier kernel, so
    you need 2.4.13. Rinse and repeat.


    Eventually you should narrow the problem down to two kernels—one of which will
    have the bug and one of which will not. Then you have a clear picture of the changes
    that caused the bug.


    This approach beats looking at every kernel!


    # When All Fails: The Community


    Perhaps you have tried everything you. You have slaved the keyboard for countless
    hours—perhaps countless days—and the solution still escapes. If the bug is in
    the mainline Linux kernel, you can always elicit the help of the other developers
    in the kernel community.


    A brief, but complete, email sent to the kernel mailing list describing the bug
    and your findings might aid in discovery of a solution. After all, no one likes
    bugs.


    Chapter 17, "Patches, Hacking, and the Community," specifically addresses the
    community and its primary forum, the Linux Kernel Mailing List (LKML).'
