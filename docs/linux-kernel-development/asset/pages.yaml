    task list is protected by a reader-writer spin lock.


    When a data structure is split into reader-writer paths like this, it makes sense
    to use a locking mechanism that provides similar semantics. In Linux, reader-writer
    spin locks provide separate reader and writer variants of the lock. One or more
    readers can concurrently hold the reader lock. The writer lock, conversely, can
    be held by at most one with no concurrent readers. Usage is to spin locks. The
    reader-writer spin lock is


