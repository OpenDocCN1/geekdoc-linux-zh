    ```

    patch -pl < ../my-patch

    ```


    from the root of your source tree. In this example, the patch is named my_patch
    and is created one directory below the center. The -pl flag specifies to strip
    the first directory from your patch. This enables you to apply a patch regardless
    of the directory naming convention used by the patch.


    A useful utility is diffstat, which generates a histogram of a patch''s changes
    (line additions and removals). To generate the output on one of your patches,


    ```

    diffstat -pl my-patch

    ```


    It is often useful to include this when you post a patch to lkml. Because the
    patch (i) program ignores all lines until a diff is detected, you can include
    a short description of the patch itself itself.


    # # Submitting Patches


    Patches should be generated as described in the previous section. If the patch
    touches a specific driver or subsystem, the patch should be sent to the maintainer
    listed in MAINTAINER. Either way, the Kernel Mailing List at linux-kernel@vger.
    kernel.org should be carbon copied. The patch should only be sent to the kernel
    maintainer (for example, Linux) after extensive discussion, or if the patch is
    trivial and clearly correct.


    Typically, the subject line of the email containing the patch is of the form "[PATCH]
    brief description." The body of the email describes technical detail the changes
    your patch makes and the rationale behind them. Be as specific as possible. Somewhere
    in the email, note the kernel version that the patch was created against.


    Most developers will be able to read your patch inline with your email and optionally
    see the whole thing as a single file. Consequently, some evil email clients wrap
    lines or otherwise change formatting; this will break the patch directly inline
    in the email, at the end of your message. Be aware that if your client does this,
    see if it has an "Insert Inline" or similar feature. Otherwise, attaching the
    patch as plain text without encoding works, and may.


    If your patch is large or contains several logical changes, break the patch into
    chunks, with each chunk representing a logical change. For example, if you both
    introduce a new API and change a handful of drivers to use it, you can break that
    into two patches (the new API and the driver changeover) and two emails. If any
    chunk requires a previous patch, explicitly state that.'
