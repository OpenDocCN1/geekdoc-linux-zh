  md: '# 12


    # The Block I/O Layer


    Block devices are hardware devices distinguished by their random (that is, not
    necessarily sequential) access of fixed-size chunks of data, called blocks. The
    most common block device is a hard disk, but many block devices exist, such as
    floppy drives, CD-ROM drives, and flash memory. How are these all devices on which
    you mount a filesystem—this is how block devices are normally accessed.


    The other type of device is a character device. Character devices, or char devices,
    are accessed as a stream of sequential data, one byte after another. Example character
    devices are serial ports and keyboards. If the hardware device is accessed as
    a stream of data, it is implemented as a character device. On the other hand,
    if the device is accessed randomly (nonsequentially), it is a block device.


    Basically, the difference comes down to how you access the device randomly—in
    other words, whether the device can seek to one position from another. As an example
    consider the keyboard. Reading letters out of order, or reading any letter but
    the next one in the stream, makes little sense. The keyboard driver is thus a
    char device; there are no keystrokes, only the characters typed by the user into
    the keyboard. Reading from the keyboard returns a stream first with "a", then
    "b", and finally "c" when they are typed. A hard disk, however, is a block device
    because we should be able to seek to any block and then read the contents of that
    particular block; the blocks need not be consecutive. Therefore, the hard disk
    is accessed randomly, and not as a stream, and thus is a block device.


    Managing block devices in the kernel requires more care, preparation and work
    than managing character devices. This is because character devices have only one
    position—the current one—while block devices must be able to navigate back and
    forth between any location on the media. Indeed, the kernel does not have to provide
    an subsystem dedicated to the management of character devices, but block devices
    receive exactly that. Partly, such a subsystem is a necessity because of the complexity
    of block devices. A large reason, however, for such support is that block devices
    are quite'
