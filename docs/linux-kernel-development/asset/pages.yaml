    # # History of Porting Linux


    When Linux was first unleashed on Linux it was only on i386 machines. Although
    the operating system was rather generalized and well written, portability was
    not a major concern. In fact, Linux even suggested Linux would never run again
    without the 386 architecture! In 1993, however, work began on porting Linux to
    the Digital Alpha architecture. The Digital Alpha was a modern high-performance
    RISC-based architecture with 64-bit memory addressing. This is a stark contrast
    to Linux''s original 386. Nonetheless, the initial port of Linux to the Alpha
    took about a year and the Alpha became the first officially supported architecture
    after x86. This port was perhaps rather difficult because it had the unwelcome
    challenge of being the first. Instead of simply grafting onto the kernel support
    for the Alpha, pieces of the kernel were rewritten as needed with portability
    in mind''. Although this made for work overall, the result was much cleaner and
    future porting was much easier.


    > > This is a common occurrence in development. If something is to be done at
    all, it should be done right! Kernel developers are not averse to rewriting large
    amounts of code in the name of perfection.'
