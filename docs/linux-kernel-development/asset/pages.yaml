  md: '# What Needs Protecting?


    Identifying data specifically needs protection is vital. Any data that can be
    accessed concurrently may need protection, it is easier to identify what data
    does not need protection and work from. Otherwise, any data that is local to a
    particular thread of execution does not need protection, because only that thread
    can access the data. Furthermore, local automatic variables do not need any sort
    of locking, because they exist on the stack of the executing thread; if anyone
    else can see it, lock it.


    What does locking mean? Most kernel data structures do. A good rule of thumb is
    if another thread of execution can access the data, it needs some sort of locking;
    if anyone else can see it, lock it.


    # CONFIG options: SMP versus UP


    Because the Linux kernel is configurable at compile-time, it makes sense that
    you can tune the kernel specifically for a given machine. Most importantly, whether
    the kernel supports SMP is decided via the CONFIG_SMP option. Many locking issues
    on uniprocessor machines, when CONFIG_SMP is unset, unnecessary code is not compiled
    into the kernel. For example, this enables uniprocessor machines to forget the
    overhead of spin locks. The same applies to CONFIG_PREEMPT (the configure enabling
    kernel preemption). This was an excellent design decision—the kernel maintains
    one clean source base, and various locking mechanisms are used as needed. Different
    combinations of CONFIG_SMP and CONFIG_PREEMPT on different architectures result
    in varying the support.


    In your code, provide appropriate protection for all issues and scenarios will
    be covered.

    Whenever you write kernel code, should you ask yourself these questions:


    +   * Is the data global? Can a thread of execution other than the current access
    it?

    * Is the data shared between process context and interrupt context? Is it shared
    between two interrupt handlers?

    * If a process is preempted while accessing this data, can the newly scheduled
    process access the same data?

    * Can the current process sleep (block) on anything? If it does, what state does
    that leave any shared data?

    * What prevents the data from freed out from under me?


    > ³ We will also see that, barring a few exceptions, SMP-safe implies preempt-safe.'
