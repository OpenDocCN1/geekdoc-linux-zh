    # Real-Time


    Linux provides two real-time scheduling policies, SCHED_FIFO and SCHED_RR. The
    normal, real-time scheduling policy is SCHED_OTHER. SCHED_FIFO implements a simple
    first-in,first-out scheduling algorithm without timelines. A runnable SCHED_FIFO
    task will always be scheduled over any SCHED_OTHER tasks. When a SCHED_FIFO task
    becomes runnable, it will continue to run until it blocks or yields the processor;
    it has no timeline and can run indefinitely. Two or more SCHED_FIFO tasks at the
    same priority round robin. If a SCHED_RR is runnable, all tasks at a lower priority
    cannot run without timelines— it is a real-time round-robin scheduling algorithm.


    Both real-time scheduling policies implement static priorities. The kernel does
    not calculate priority values for real-time tasks. That is, SCHED_FIFO with timelines—
    it is a real-time task ensures that a process at a given priority will always
    preempt a process at a lower priority.


    The real-time scheduling policies in Linux promise soft real-time behavior. Real-time
    refers to the notion that the kernel tries to schedule applications within deadlines,
    but the kernel does not promise to always be to fulfill them. Conversely, hard
    real-time systems are guaranteed to meet any scheduling requirements within limits.
    Linux makes no guarantees on the ability to schedule real-time tasks.'
