  md: 'characteristics that affect an operating system but instead they are features
    of the Linux kernel that are indeed somewhat architecture-agnostic. They represent,
    however, important configuration options that you should always assume are available
    in your code. That is, always program for SMP/preempt/highnempt system and you
    will always be safe, in any configuration. In addition to follow the previous
    portability rules:


    +   * Always assume your code will run on an SMP system and use appropriate locking.

    * Always assume your code will run with kernel preemption enabled and use appropriate
    locking and kernel preemption statements.

    * Always assume your code will run on a system with high memory (nonpermanently
    mapped memory) and use kmap () as needed.


    # Portability Is Fun


    In short, writing portable, clean, proper code has two major implications:


    +   * Always code for the highest common factor: assume anything can happen and
    any potential constraint is in place.

    * Always assume only the lowest common denominator is available: do not assume
    any given kernel feature is available and only require the minimum architectural
    features.


    Writing portable code requires adherence to many issues: wordsize, data type size,
    alignment, page size, processor ordering, and so on. In the large majority of
    kernel programming, your primary concern is most likely only ensuring that data
    types are used correctly. Nonetheless, one day an archaic issue will arise—it
    is important to understand portability issues and always write clean, portable
    code inside the kernel.'
