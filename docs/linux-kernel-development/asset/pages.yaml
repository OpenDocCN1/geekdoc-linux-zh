  md: '# What Do I Lock?


    It is important that each lock is clearly associated with what it is locking.
    More importantly, it is important that you protect data and not code. Despite
    the examples in this chapter explaining the importance of protecting the critical
    sections, it is the actual data that needs protection and not the code. Locks
    that simply lock code are hard to maintain and prevent race conditions. Associate
    data with a specific lock. For example, `struct Foo is locked by foo_lock`. Always
    associate each piece of data with a lock. Whenever you access the data, make sure
    it is safe. Most likely this means obtaining the lock before accessing the data
    and releasing the lock when finished.


    If spin_lock_irq() and spin_unlock_irq() are enabled, there is no need to restore
    their previous state. You can unconditionally enable them on. In those cases,


    ```

    spin_lock_mr_lock = SPIN_LOCK_UNLOCKED;

    spin_lock_irq(lock);

    /* critical section ... */

    spin_unlock_irq(lock);

    ```


    It is increasingly hard to ensure that interrupts are always enabled in any given
    code path in the kernel. Because of this, use of `spin_lock_irq()` is not recommended.
    If you use it, you had better be positive that interrupts were originally off
    or will be upset when they find them on!


    # Debugging Spin Locks


    The configure option `CONFIG_DEBUG_SPINLOCK` enables a handful of debugging checks
    in the spin lock code. For example, with this option the spin lock code will check
    for the use of uninitialized spin locks and unlocking a lock that is not yet locked.
    When testing your code, you should always run with spin lock enabled.


    # Other Spin Lock Methods


    The method `spin_lock_init()` can be used to initialize a dynamically created
    spin lock (a `spinlock_t` that you do not have a direct reference to, just a pointer).


    The method `spin_try_lock()` attempts to obtain the given spin lock. If the lock
    is contended, instead of spinning and waiting for the lock to be released, the
    function immediately returns nonzero. If it succeeds obtaining the lock, it returns
    zero. Similarly, `spin_is_locked()` returns nonzero if the given lock is currently
    acquired. Otherwise, in neither case does this function actually obtain the lock.


    See Table 8.3 for a complete list of the standard spin lock methods.


    > Use of these two functions can lead to gross code. You should not frequently
    have to check the values of spin locks—your code should either acquire the lock
    itself or be called while the lock is already held. Some legitimates use it, however,
    so these interfaces are provided.'
