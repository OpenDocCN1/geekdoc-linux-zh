  md: '# Process Management


    THE PROCESS IS ONE OF THE FUNDAMENTAL abstractions in Unix operating systems¹.
    A process is a program (object stored on some media) in execution. It is, however,
    more than just the executing program (often called the text in Unix). Processes
    also include a data section containing global variables, a set of resources such
    as open files, an address space, and one or more threads of execution.


    Threads of execution, often shortened to threads, are the objects of activity
    within the process. Each thread includes a unique program counter, process stack,
    and set of processor registers. The kernel schedules individual threads, not processes.
    In traditional Unix systems, each process consists of one thread. In modern systems,
    however multithreaded programs are common. As you will later, Linux has a unique
    implementation of threads—it does not differentiate between threads and processes.


    Processes provide two virtualizations: a virtualized process and virtual memory.
    The process gives the illusion that it monopolizes the system, despite possibly
    sharing the processor amongst dozens of other processes. Chapter 3, "Scheduling,"
    discusses this virtualization. Virtual memory lets the process allocate and manage
    memory as if alone owned all the memory in the system. Virtual memory is covered
    in Chapter 10, "Memory Management and Storage." The virtual process is covered
    in Chapter 11.


    Note that a program itself is not a process: a process is an active program and
    related resources. Indeed, two or more processes can exist that are executing
    the same program. In fact, two or more processes can share various resources,
    such as open files or an address space. A process begins its life when, surprisingly,
    it is created. In Linux, this occurs by means of the fork() system call, which
    creates a new process by duplicating an existing one. The process that calls fork()
    is the parent, whereas the process is the child. The parent resumes execution,
    at the same place, where the call returns. Often, following a fork it is desirable
    to execute a new, different, program. The exec() - family of function calls is
    used to create a new address space and load a new program into.


    > ¹ The other fundamental abstraction is files.


    > ² In modern Linux kernels, fork() is actually implemented via the clone() system
    call, which is discussed in a following section.'
