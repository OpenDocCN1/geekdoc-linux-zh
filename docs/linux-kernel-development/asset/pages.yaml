    It might seem strange that there is a bug that cannot reproduce. In user-space
    programs, bugs are often a most straightforward—for example, doing foes makes
    me dump. The kernel is an entirely different beast. The interactions between the
    kernel, user-space, and hardware can be quite delicate. Race conditions might
    your head only once in millions of iterations. Poorly designed or miscoded code
    can result in acceptable performances on some systems, but terrible performances
    on others. It is very common for specific configuration, on random machine, under
    some workload, to trigger a bug otherwise unseen. The more information you have
    when tackling a bug, the better. Many times, if you can reliably reproduce the
    bug, you are more than halfway home.


    # Bugs in the Kernel are as varied as bugs in user-space applications. For a myriad
    of reasons and manifest themselves in just as many forms. Bugs range from clearly
    incorrect code (for example, not storing the right value in the right place) to
    synchronization errors (for example, not properly locking a shared variable).
    They manifest themselves as everything from poor performance to incorrect behavior.


    Often, it is a chain of events that leads to the error in the code to witnessed
    by the user. For example, a shared structure without a reference count might cause
    a race condition. Without proper protection, one process modifies it while another
    still wants to use it. Later, on the second process may attempt to access it.
    This might result in a NULL pointer difference, reading of garbage data, or nothing
    at all (if the data was not yet overwritten). The NULL pointer difference causes
    an oops while the garbage data leads to corruption (and then behavior or an oops).
    The user reports the oops or incorrect behavior. The kernel must then work backward
    and see that the data was accessed after it was freed, there was a race, and the
    fix is proper reference counting on the shared structure. It properly needs locking.


    Debugging the kernel might sound difficult, but in reality the kernel is unlike
    any other large software project. The kernel has unique issues, such as timing
    constraints and race conditions, which are a consequence of allowing multiple
    threads of execution inside the kernel. I assure you that with a little effort
    and understanding, you can debug kernel problems (and perhaps even enjoy the challenge).


    # printk ()


    The kernel print function, printk(), behaves almost identically to the C library
    printf() function. Indeed, throughout this book we have made use of any real differences.
    For most intentions, this is fine; printk() is simply the name of the kernel''s
    formatted print function. It has some differences, however.'
