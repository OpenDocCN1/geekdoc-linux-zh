  md: '# The Per-CPU Interface


    MODERN SMP-CAPABLE OPERATING SYSTEMS USE per-CPU data—that is unique to a given
    processor—extensively. Typically, per-CPU data is stored in an array. Each item
    in the array corresponds to a processor on the system. The current processor indexes
    this array, which is how the 2.4 kernel handles per-CPU data. Nothing is wrong
    with this approach, so 2.6 kernel code still uses it. You declare the data as


    Note, no lock is required because this data is unique to the current processor.
    As long as no processor touches this data except the current, no concurrency concerns
    exist, and the current processor can safely access the data without lock.


    Kernel preemption is the only concern with per-CPU data. Kernel preemption poses
    two problems, listed here:


    +   * If our code is preempted and reschedules on another processor, the cpu variable
    is no longer valid because it points to the wrong processor. (In general, code
    cannot sleep after obtaining the current processor.)

    * If any other task preempts our code, it can concurrently access my_percpu on
    the same processor, which is a race condition.


    Any fears are unwarranted, however, because the call get_cpu(), on top of returning
    the current processor number, also disables kernel preemption. The corresponding
    call to put_cpu() enables kernel preemption. Note, if you use a call to'
