  md: '# Unix Filesystems


    Historically, a filesystem is a hierarchical structure of data adhering to a specific
    structure. Filesystems contain files, directories, inodes, and associated control
    information. Typical operations performed on filesystems are creation, deletion,
    and mounting. Filesystems are mounted at a mount point in a global hierarchy''
    known as a namespace. This enables all mounted filesystems to appear as entries
    in a single tree²


    A file is an ordered string of bytes. The first byte marks the beginning of the
    file and the last byte marks the end of the file. Each file is assigned a human-readable
    name for identification by both the system and the user. File operations are read,
    write, and delete.


    Filesystems are laid out in directories. A directory is analogous to a folder
    and contains related files. Directories can also contain subdirectories; in this
    fashion, directories may be nested to form paths. Each component of a path is
    called a directory entry. An example path is `/home/woman/foo/`—the root directory
    `home` and `woman`, and the file `foo` are all entries, called dentries. In Linux,
    directories are actually normal files that list the files contained therein.


    Unix systems use the concept of a file free from any associated information about
    it (such as permissions, size, owner, creation time, and so on). This information
    is sometimes called file *metadata* (that is, data about data) and is stored in
    a separate data structure from the file, called the *inode*. Although these days
    the term *node* is much ubiquitous.


    All information is tied together with the filesystem''s control information, which
    is stored in the superblock. The superblock is a data structure containing information
    about the filesystem as a whole. Sometimes, the collective data is referred to
    as filesystem metadata. Filesystem metadata includes information about both the
    individual files and directories.


    Traditionally, Unix filesystems implement these notions as part of their physical
    on-disk layout. For example, file information is stored as an inode in a separate
    block on the disk, directories are stored centrally in a superblock, and so on.
    The Linux VFS is designed to work with filesystems that understand and implement
    such concepts. Non-Unix filesystems, such as FAT or NTFS, work in Linux, but their
    filesystem code must provide the appearance of these concepts. For example, even
    if a filesystem does not support the inode data structure in


    > ¹ Recently, Linux has made this hierarchy per-process, to give a unique namespace
    to each process. Although, by default, each process inherits its parent''s namespace
    and, there is seemingly one global namespace.


    > ² As opposed to at a given drive letter, like `C:\`'
