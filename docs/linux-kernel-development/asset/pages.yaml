    A final consideration in using Linux reader-writer spin locks is that they favor
    readers over writers. If the read lock is held and a writer is waiting for exclusive
    access, the readers that attempt to acquire the lock will continue to succeed.
    The spinning writer will not acquire the lock until all readers release the lock.
    Therefore, a sufficient number of readers can starve writers. This is important
    to keep in mind when designing your locking.


    Spin locks provide a quick and simple lock. The spinning behavior is optimal for
    short hold times and code that cannot sleep (interrupt handlers, for example).
    In cases where the time might be long or you potentially need to sleep while holding
    the lock, the semaphore is the solution.


    # Semaphores


    Semaphores in Linux are sleeping locks. When a task attempts to acquire a semaphore
    that is already held, the semaphore places the task onto a wait queue and puts
    the task to sleep. The processor is free to execute other code. When the processes''
