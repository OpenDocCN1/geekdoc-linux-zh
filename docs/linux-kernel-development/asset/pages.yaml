  md: 'During the 2.5 kernel series, the Linux kernel scheduler overhaul. A new scheduler,
    commonly called the O(1) scheduler of its algorithmic behavior, solved the complexities
    of the previous Linux scheduler and introduced new features and performance characteristics.
    In this section, we will discuss the fundamentals of scheduler design and how
    they apply to the O(1) scheduler and its goals, design, implementation, and related
    system calls.


    # Policy


    Policy is the behavior of the scheduler that determines what runs when. A scheduler''s
    policy often determines the overall feel of a system and is responsible for optimally
    utilizing processor time. Therefore, it is very important.


    # I/O-Bound Versus Processor-Bound Processes


    Processes can be classified as either I/O-bound or processor-bound. The former
    is characterized as a process that spends much of its time on submitting and waiting
    for I/O requests. Consequently, such a process is runnable, but only for short
    periods, because it will eventually block waiting on more I/O (this is any type
    of I/O, such as keyboard activity, and not just I/O). Conversely, processor-bound
    processes spend much of their executing time. They tend to run until they are
    preempted by I/O requests very often. The scheduler policy, therefore, does not
    dictate that the scheduler runs them often but to run them frequently for longer
    periods. Of course, these classifications are not mutually exclusive. The scheduler
    policy in Unix tends to explicitly favor I/O-bound processes.


    The scheduling policy in a system must attempt to satisfy two conflicting goals:
    fast process response time (low latency) and high process throughput. To satisfy
    these requirements, schedulers often employ complex algorithms to determine the
    most worthwhile process to run, while not compromising fairness to other, lower
    priority response, optimizes for response time (low latency), favoring interactive
    processes are I/O-bound. Linux, to provide good interactive response, optimizes
    for process response (low latency), favoring I/O-bound processes over processor-bound.
    As you will see, this is done in a way that does not neglect process priority


    # Process Priority


    A common type of scheduling algorithm is priority-based scheduling. The idea is
