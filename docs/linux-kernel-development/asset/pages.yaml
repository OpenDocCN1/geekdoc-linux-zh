    some heuristic that is capable of accurately reflecting whether a task is I/O-bound
    or processor-bound. The most indicative metric is how long the task sleeps. If
    a task spends most of its time sleeping it is I/O-bound. If a task spends more
    time running, it is not interactive. This extends to the extreme: a task that
    spends nearly all the time sleeping is completely I/O-bound, whereas a task that
    spends nearly all its runtime is completely processor-bound.


