  md: '# 17

    Patches, Hacking, and the Community


    The greatest benefits of Linux is the large community of users and developers
    that surround it. The community provides eyes to check your code and users to
    test and report issues. Additionally, the community ultimately decides what code
    is accepted into the kernel. Understanding how everything works is very important.


    # The Community


    If the Linux kernel had to exist somewhere physically, it would call the Linux
    Kernel Mailing List home. The Linux Kernel Mailing List (or, the regulars abbreviate,
    just lml) is the location of the majority of the discussions, debates, and fame
    over the kernel. New features are discussed and most code is posted to the list
    before any action is taken. The list sees upwards of 300 messages a day, so it
    is not for the faint of heart. Subscribing (or at least reading a digest or the
    archives) is recommended for anyone interested in serious kernel development.
    You can learn a lot simply by watching the wizards at work.


    You can subscribe by sending the message:


    ```

    subscribe linux-kernel@email.address>

    ```


    in plain text to. More information can be had at http://vger.kernel.org/ and a
    FAQ is available at http://www.tux.org/lkml/


    Numerous Web sites and other mailing lists pertain to the kernel specifically
    and Linux in general. An excellent resource for beginning kernel hackers is http://www.kernelnewbies.org/a
    site that, of all things, caters to those cutting their teeth on the kernel. Two
    other excellent sources of kernel information include http://www.lsn.net/, and
    http://www.kerneltraffic.org, Kernel Traffic, which includes a summary of the
    previous week''s lkml emails with insightful comment.'
