    Figure 13.1 Page tables.


    Each process has its own page tables (threads share them, course). The page field
    of the memory descriptor points to the process''s page global descriptor. Manipulating
    and traversing page tables requires the `page_table_lock`, which is located inside
    the associated memory descriptor.


    Page table data structures are quite architecture-dependent and thus defined in


    ```

    <asm/page.h>

    ```


    Because nearly every page in virtual memory must be resolved to its corresponding
    address in physical memory, the performance of the page tables is critical. To
    facilitate this, most processors implement a *translation lookaside buffer*, or
    simply the *TLB*, which acts as a hardware cache of virtual to physical mappings.
    When accessing a virtual address, the processor will first check if the mapping
    is cached in the TLB. If there is a hit, the physical address is immediately returned.
    Otherwise, if there is a miss, the page tables are consulted for the corresponding
    physical address.


    Nonetheless, page table management is itself a critical—and evolving—part of the
    kernel. Changes to this area in 2.6 include allocating parts of the page table
    out of high memory. Future possibilities include shared page tables with copy-on-write
    semantics. In that scheme, page tables would be shared between parent and child
    across a `fork()`. When the parent or the child attempted to modify a particular
    page table entry, a copy would be created and the two processes would no longer
    share that entry. Sharing page tables would remove the overhead of copying the
    page table entries on `fork()`.'
