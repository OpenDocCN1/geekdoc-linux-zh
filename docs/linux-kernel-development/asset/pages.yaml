  md: '# # Scheduling


    THE SCHEDULER IS THE COMPONENT OF THE KERNEL that selects process to run next.
    The scheduler (or scheduler, as it is sometimes called) can be viewed as the code
    that divides the finite resource of processor time between the runnable processes
    on system. The scheduler is the basis of a multitasking operating system such
    as Linux. By deciding what process can run, the scheduler is responsible for best
    utilizing the system and giving the impression that multiple processes are simultaneously
    executing.


    The idea behind the scheduler is simple. To best utilize processor time, assuming
    there are runnable processes, a process should always be running. If there are
    more processes than processors in a system, some processes will not always be
    running. These processes are waiting to run. Deciding what process runs next,
    given a set of runnable processes, is a fundamental decision the scheduler must
    make.


    Multitasking operating systems come in two flavors: cooperative multitasking and
    preemptive multitasking. In preemptive multitasking, the scheduler decides when
    a process is to running and a new process is to run. The time run before it is
    preempted is predetermined, and is called the timeslice. In effect, each process
    gets a slice of the processor''s time. Managing the timepiece enables the scheduler
    to make global scheduling decisions for the system. It prevents any process from
    monopolizing the system. As we will see, this is dynamically calculated in the
    Linux scheduler to provide some interesting benefits.


    Conversely, in cooperative multitasking, a process does not stop running until
    voluntary decides to do so. The act of a process voluntarily suspending itself
    is called yielding. The shortcomings of this approach are numerous: The scheduler
    cannot make global decisions regarding how long processes run, processes can monopolize
    the processor for large amounts, and a hung process that never yields can potentially
    bring down the entire system. Frankly, most operating systems designed in the
    last decade have provided preemptive multitasking, with Mac Os 9 and earlier being
    the most notable exceptions. Of course, Unix has been preemptively multitasked
    since the beginning.'
  merge: -1
