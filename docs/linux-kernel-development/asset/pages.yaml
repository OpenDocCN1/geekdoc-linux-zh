  md: "# Dentry Operations\n\nThe dentry_operations structure specifies the methods\
    \ that the VFS invokes on directory entries on a given filesystem.\n\nThe dentry_operations\
    \ is defined in <linux/dcache.h>:\n\n```\nstruct dentry_operations {\n    int\
    \ (*d_invalidate)(struct dentry *, int);\n    int (*d_hash)(struct dentry *, struct\
    \ qstr);\n    int (*d_compare)(struct dentry *, struct qstr *, struct qstr *);\n\
    \    int (*d_delete)(struct dentry *);\n    void (*d_release)(struct dentry *,\
    \ struct node *);\n    void (*d_put)(struct dentry *, struct inode *);\n};\n```\n\
    \nThe methods:\n\n+   * d_invalidate(struct dentry *dentry, int flags) This function\
    \ determines whether the given dentry is valid. The VFS calls this function whenever\
    \ it is preparing to use a dentry from the dcache. Most filesystems set this method\
    \ to NULL because their directory objects in the dcache are always valid.\n* d_hash(struct\
    \ dentry *dentry, struct qstr *name) This function creates a hash value from the\
    \ given dentry. The VFS calls this function whenever it adds a dentry to a hash\
    \ table.\n* d_compare(struct dentry *dentry, struct qstr *name1, struct qstr *name2)\
    \ This function is called by the VFS to compare two Components, name and name2.\
    \ Most filesystems leave this to the VFS default, which is a simple string comparison.\
    \ For some filesystems, such as FAT, a simple string is insufficient. The filesystem\
    \ requires the dcache_lock.\n* d_delete(struct dentry *dentry) This function is\
    \ called by the VFS when the specified dentry object's d_count reaches zero. It\
    \ requires the dcache_lock.\n* d_release(struct dentry *dentry) This function\
    \ is called by the VFS when the specified dentry is going to be freed. The default\
    \ function does nothing.\n* d_put(struct dentry *dentry, struct inode *inode)"
