  md: "# Rate Limiting Your Debugging\n\nOftentimes, you want to stick some debugging\
    \ checks (with some corresponding print statements) in an area to sniff out a\
    \ problem. In the kernel, however, functions are called multiple times per second.\
    \ If you stick a call to printk() in such a function, the system is overwhelmed\
    \ with debugging output and quickly grows.\n\nTwo simple tricks exist to prevent\
    \ the problem. The first is rate limiting, which is useful when you want to watch\
    \ the progression of an event, but even the event occurs rather often. To prevent\
    \ a deluge of debugging output, you only print your debug message (or whatever\
    \ you are doing) every few seconds. You might need the rate limiting to be larger\
    \ or smaller, depending on your needs.\n\n```\nstatic unsigned long prev_jiffy\
    \ = jiffies; /* rate limiting */\nif (time_after(jiffies, prev_jiffy + 2*HZ))\
    \ {\n    prev_jiffy = jiffies;\n    printk(KERN_ERR, \"blah blah blah\\n\");\n\
    }\n\n```\n\nIn this example, the debug message is printed at most every two seconds.\
    \ This prevents any flood of information on the console and makes the computer\
    \ usable.\n\nAnother story arises if you are looking for any occurrence of an\
    \ event. Unlike the previous example, you do not want to monitor the problem of\
    \ the kernel, but simply receive a notification when something happens. You only\
    \ want to receive this notice once or twice. This is an especially sticky problem\
    \ if after the event is triggered. The solution is not to rate limit the debugging,\
    \ but occurrence limit it:\n\n```\nstatic unsigned long limit = 0;\n\nif (limit\
    \ < 5) {\n    limit++;\n    printk(KERN_ERR,\"blah blah blah\\n\");\n}\n\n```\n\
    \nThis example caps the debugging output to five. After five such messages, the\
    \ conditional is always false.\n\nIn both examples, the variables are static and\
    \ local to the function, as shown. This enables the variable's values to persist\
    \ across functions calls.\n\nNeither of these examples is SMP- or preempt-safe,\
    \ although a quick switch to atomic operators will make them safe. Frankly, however,\
    \ this is just debugging code, so why go through the trouble?"
