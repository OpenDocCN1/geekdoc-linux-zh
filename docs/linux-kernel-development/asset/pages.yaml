  md: "ZONE_NORMAL tends to be whatever left over the previous zones claim their requisite\
    \ share. On x86, for example, ZONE_NORMAL is all physical memory from 16MB to\
    \ 896MB. Other (more fortunate) architectures, ZONE_NORMAL is all available memory.\
    \ Table 10.1 is a listing of each zone and its consumed spans on x86\n\n# Table\
    \ 10.1 Zones on x86\n\n| Zone | Description | Physical Memory |\n| --- | --- |\
    \ --- |\n| ZONE_DMA | DMA-able pages | < 16MB |\n| ZONE_NORMAL | Normally addressable\
    \ pages | 16-896MB |\n| ZONE_HIGHEM | Dynamically mapped pages | > 896MB |\n\n\
    Linux systems partition their memory into zones into a pool to satisfy such allocations.\
    \ For example, having a ZONE_DMA pool gives the capacity to satisfy memory allocations\
    \ needed for DMA. If much is needed, the kernel can simply pull the required number\
    \ of pages from ZONE_DMA. Note that the zones do not have any free resources;\
    \ they are logical groups used by the kernel to keep track of pages.\n\nAlthough\
    \ some allocations may require pages from a particular zone, the zones are not\
    \ hard requirements in both directions. While an allocation for DMA-able memory\
    \ must originate from ZONE_DMA, a normal allocation can come from ZONE_DMA or\
    \ ZONE_NORMAL. The kernel will prefer to satisfy normal allocations from the ZONE_NORMAL\
    \ for allocations that it needs. But if push comes (if memory should get low),\
    \ the kernel can dip its fingers in whatever is available and suitable.\n\nEach\
    \ zone is represented by struct zone, which is defined in <linux/mmzone.h>:\n\n\
    ```\nstruct zone {\n    spinlock_t lock;\n    unsigned long free_min;\n    unsigned\
    \ long pages_min;\n    unsigned long pages_low;\n    unsigned long pages_high;\n\
    \    struct list_head lru_list;\n    struct list_head active_list;\n    struct\
    \ list_head inactive_list;\n    atomic_t refill_counter;\n    unsigned long nr_active;\n\
    \    unsigned long nr_inactive;\n    unsigned long all_unclaimable;\n    unsigned\
    \ long pages_scanned;\n    unsigned long int;\n    struct free_area free_area[MAX_ORDER];\n\
    \    struct wait_queue_head wait_queue_head;\n    struct wait_table;\n    unsigned\
    \ long unsigned long;\n};\n```"
