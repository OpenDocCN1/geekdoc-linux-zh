  md: 'flexible, dynamically created bottom halves that are built on top of softis.
    Two different tasklets run concurrently on different processors, but two of the
    same type of tasklet cannot run simultaneously. Tasklets are useful when performance
    is critical, such as with networking. Softirqs require more care, because two
    of the same softirq can run at the same time. In addition, they must be registered
    at compile-time. Conversely, one can dynamically register tasklets.


    To confound this, some people refer to bottom halves as interrupts or softirqs.
    In other words, both the softirq and bottom halves are general softirqs. Ignore
    those people.


    While developing the 2.5 kernel, the BH interface was finally tossed to the curb
    as all BH users were converted to the other bottom half interfaces. Additionally,
    the task queue interface was replaced by the work queue interface. Work queues
    are a simple yet useful method of queuing work to later be performed in process
    context.


    Consequently, in 2.6 we have three bottom half mechanisms in the kernel: softirqs,
    tasklets, and work queues. The kernel used to use the BH and task queue interfaces,
    but today they are mere memories.


    # Kernel Timers


    Another mechanism for deferring work is kernel timers. Unlike the mechanisms discussed
    in the chapter far, timers defer work for a specified amount of time. That is,
    although the tools discussed in this chapter are useful to defer work to any time
    now, you use timers to defer work until at least a specific time has elapsed.


    # Bottom Half Confusion


    This is some confusing stuff, but really it is just naming issues. Let''s go over
    it.


    "Bottom half" is a generic operating system term referring to the deferred portion
    of interrupt processing. In Linux, this currently has meaning, too. The kernel''s
    mechanisms for deferring work are "bottom halves." Some people also confusingly
    call all bottom halves "softirqs," but they are just being annoying.


    "Bottom half" also refers to the original deferred work mechanism in Linux. This
    mechanism is also known as a "BH," so we call it by that name now and leave the
    former as a generic description. The BH mechanism was deprecated awhile back and
    fully removed in 2.5.


    Currently, there are three methods for deferring work: softirqs, tasklets, and
    work queues. Tasklets are built on softirqs and work queues are entirely different.
    Table 6.1 presents a history of bottom halves.'
