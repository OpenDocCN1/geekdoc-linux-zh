  md: '# Hardware Clocks and Timers


    Architectures provide two devices to help with time keeping—the system timer,
    which we have been discussing, and the real-time clock. The actual behavior and
    implementation of these devices varies between different machines, but the general
    purpose and design is the same for each.


    # Real-Time Clock


    The real-time clock (RTC) provides a nonvolatile device for storing the system
    time. The RTC continues to keep track of time even when the system is off, by
    way of a small battery included on the system board. On the PC architecture, the
    RTC and the CMOS are integrated and a single battery keeps the RTC running and
    the BIOS settings.


    On boot, the kernel reads the RTC and uses it to initialize the time, which is
    stored in the xtime variable. The kernel does not typically read the value again;
    however, some supported architectures, such as x86, periodically save the current
    time back to the RTC. Nevertheless, the real time clock''s primary importance
    is only during boot, when xtime is initialized.


    # System Timer


    The system timer serves a much more important (and frequent) role in the kernel''s
    timekeeping. The idea behind the system timer, regardless of architecture, is
    the same—to provide a mechanism for driving an interrupt at a periodic rate. Some
    architectures implement this an electronic clock that oscillates at a programmable
    frequency. Other systems use a decrementer—counter is set to some initial value
    and decrements at a fixed rate until the counter reaches zero. When the counter
    reaches zero, an interrupt is triggered. In any case, the effect is the same.


    On x86, the system timer is the programmable interrupt timer (PIT). The PIT exists
    on all PC machines and has been driving interrupts since the days of DOS. The
    kernel programs the PIT on boot to drive the system timer interrupt (interrupt
    zero) at Hz frequency. It is a simple device with limited functionality, but it
    gets the job done. Other x86 sources include the local APC timer and the time
    stamp counter (TSC).


    # The Timer Interrupt Handler


    Now that we have an understanding of Hz, jitter, and what the system timer''s
    role is, let''s look at the actual implementation of the timer interrupt handler.
    The timer interrupt is broken into two pieces: an architecture-dependent and an
    architecture-independent routine.


    The architecture-dependent routine is registered as the interrupt handler for
    the system timer and, runs when the timer interrupt hits. Its exact job depends
    on the architecture, of course, but most handlers perform at least the following
    work:'
