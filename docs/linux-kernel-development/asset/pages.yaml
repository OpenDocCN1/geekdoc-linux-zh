  md: '# Preface


    When I was approached about converting my experiences with the Linux kernel into
    a book, I was unsure how to proceed. I did not want to simply write yet yet another
    kernel book. Sure, there are not many books on the subject, but I still desired
    something to make my approach unique. What would place my book at the top of its
    subject? I thought about how my book could be special.


    I then realized I could offer quite a unique approach to the topic. My job is
    hacking the kernel. My hobby is hacking the kernel. My love is the kernel. Over
    the years, I have surely accumulated anecdotes and important tips. With my experiences,
    I could write a book on how to hack the kernel and not to hack the kernel. Prima,
    this is a book about the design and implementation of the Linux kernel. The book''s
    approach differs, in that the information is given with a slant towards learning
    how to get work done—and getting it.


    I hope that readers can walk this book with a better understanding of the rules
    (and unwritten) of the kernel. Readers from writing useful, correct, clean kernel
    code. Of course, you can read this book for fun, too.


    Whatever your intentions with Linux, I hope you enjoy this book.


    # Author''s Introduction


    Developing code in the kernel does not require genius, magic, or a bushy Unix-hacker
    beard. The kernel, although having interesting rules of its own, is not much different
    from any other big software project. There is much to learn as with any large
    project, but there is not too much sacred or confusing about the kernel than any
    other software endeavor.


    It is very important that you read the source. The open availability of the source
    code for the Linux system is a rarity that you must not take for granted. It is
    not sufficient only to read the source, however. You need to dig in and change
    some code. Find a bug and fix it. Improve the drivers for your hardware. An itch
    and scratch! By writing code will it all come together.


    # Audience


    This book targets software developers who are interested in understanding the
    Linux kernel. It is not a line-by-line commentary of the kernel source. It is
    a guide to developing drivers or a reference on the kernel API (as if there even
    a formal kernel API). Instead, the goal of this book is to provide enough information
    on the design and implementation of the Linux kernel that a sufficiently accomplished
    programmer can begin developing code in the kernel. Kernel development can be
    fun and rewarding, and I want to introduce the reader to that world as readily
    as possible. This book, however, in discussing both theory and application, should
    appeal to readers of either interest. I have'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'always of the mind that one needs to understand the theory to understand the
    implementation, although this book will explain the implementation sufficiently
    for your needs. however that your motivations for understanding the Linux kernel,
    this book will


    this, this book covers the use of kernel systems and their design and implementation.
    This is important, and ensures a moment''s discussion. A good example is Chapter
    6, "Bottom Halves and Deferring Work," which covers both. In that chapter, I discuss
    both the design and implementation of the kernel-bottom-halves (which a kernel
    developer might find interesting). In fact, I believe both parties should find
    such discussions relevant. The kernel developer, who is certainly interested in
    the inner workings of the kernel, will gain a better understanding of how the
    interfaces are actually used. At the same time, a device driver writer will benefit
    from a good understanding of the implementation beneath the interface.


    This is akin to learning some library APIs versus the actual implementation of
    the library. At first glance, an application programmer needs only to understand
    the API—it is often taught to treat interfaces as a black box, in fact. Likewise,
    a library developer is concerned only with the library''s design and implementation.
    I believe, however, both parties should invest time in learning the other. An
    application programmer who understands the underlying operating system can make
    use of it. Similarly, the library developer will grow out of touch with the reality
    and practicality of the applications that they use. Consequently, I discuss both
    the design and use of kernel subsystems, in the hope that this book is useful
    to either party, in the hope that the whole book is useful to both parties.


    I assume the reader knows C programming language and is familiar with Linux. Some
    experience operating system and other computer science concepts is beneficial,
    but I try to explain concepts as much as possible—if not, there are some excellent
    books on operating system design referenced in the bibliography.


    This book is appropriate for an undergraduate course introducing operating system
    design as the applied text, if an introductory book on theory accompanies it.
    it should fair well either in an advanced undergraduate course or in a graduate-level
    course without ancillary material. I encourage potential students to contact me;
    I am eager to help.


    # # Organization of Material


    This book is designed to be read from start to finish; that is, each chapter builds
    upon the previous as much as possible to provide a linear presentation of the
    material. That is not to say, however, that it is impossible to visit random chapters
    for reference. To the contrary, I have tried to make each chapter sufficiently-contained
    for one who is already familiar with the material, but is seeking reference on
    a specific topic.


    Chapter 1 introduces operating systems, kernels, Unix, and ultimately Linux itself.'
  merge: -1
  pgno: 24
- img_proc: true
  md: Someone who has previously read a book on Unix, Linux, or operating systems
    will find the material familiar. Chapter 2 covers the kernel abstraction of processes
    and how processes are created, destroyed, and otherwise managed. The point of
    the operating system is ultimately to allow the user to run programs, this is
    an important chapter. Chapter 3 covers scheduling multitasking operating systems
    such as Linux. The kernel is the scheduler for scheduling process execution. Chapter
    4 covers system calls, which are the standard mechanism used to interface with
    the kernel. The chapter discusses the philosophy of system calls, the design of
