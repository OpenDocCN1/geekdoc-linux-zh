    The kernel provides multiple tools to facilitate configuration. The simplest tool
    is a text-based command-line utility:


    ```

    make config

    ```


    This utility goes through each option, one by one, and asks the user to interactively
    select yes, no, or (for treats) module. Because this takes a long time, unless
    you are paid by the head, you should use ncurses-based graphical utility:


    ```

    make menuconfig

    ```


    Or, an X11-based graphical utility:


    ```

    make xconfig

    ```


    These utilities divide the various configuration options into categories, such
    as "Processor Features" and "Network Devices". You can move through the categories,
    view the kernel options, and of course change their values.


    The configuration options are stored in the root of the kernel source tree, in
    a file named .config. You may find it easier—most of the kernel developers do—to
    edit this file directly. It is quite easy to search for, and it changes the value
    of the configuration options. After making changes to your configuration file,
    or using an existing configuration file on a new kernel tree, you can validate
    and update the configuration:


    ```

    make oldconfig

    ```


    You should always run this before building a kernel, in fact. Once the kernel
    configuration is set, you can build it:


    ```

    make

    ```


    Unlike kernels before 2.6, you no longer need to run make before building the
    kernel—the dependency tree is maintained automatically. You also do not need to
    specify a specific build type, such as bzimage, as you did in old versions. The
    default Makefile rule will handle everything!


    A trick to minimize noise, but still see warnings and errors, is to redirect the
    output from make():


    ```

    make > some_other_file

    ```


    If you ever need to see the build output, you can read the file. But since the
    warnings and errors are displayed, you normally do not need to.


    Once the kernel is built, you need to install it. How it is installed is architecture
    and boot loader dependent—consult the directions for your boot loader where to
    copy the kernel image and how to add it to set up to boot. Always keep a known-safe
    kernel or two around in case your new kernel has problems!'
