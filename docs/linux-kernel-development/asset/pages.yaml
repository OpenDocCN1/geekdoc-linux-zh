  md: "# kfree()\n\nThe other end of kmalloc() is declared in <linux/slab.h>void kfree(const\
    \ void *ptr)\n\nkfree() will free a block of memory previously allocated with\
    \ kmalloc(). Calling this function on memory not allocated with kmalloc(), or\
    \ memory which has already been freed, will result in very bad things, such as\
    \ freeing memory belonging to another part of the kernel. Just like in user-space,\
    \ be careful to balance your allocations with your deallocations to prevent memory\
    \ leaks and other bugs. Note, calling kfree(NULL) is explicitly checked for safety.\n\
    \nLet's look at an example of allocating memory in an interrupt handler. In this\
    \ example, an interrupt handler wants to allocate a buffer to hold incoming data.\
    \ The preprocessor BUF_SIZE is the size in bytes of this desired buffer, which\
    \ is presumably larger than just a couple bytes.\n\n```\nchar *buf;\nbuf = kmalloc(BUF_SIZE,\
    \ GFP_ATOMIC);\nif (buf) {\n    /* allocating memory */\n Later, when we no longer\
    \ need the memory, do not forget to free it:\n kfree(buf);\n}\n```\n\n# vmalloc()\n\
    \nvmalloc() function works similar kmalloc(), except it allocates memory that\
    \ is virtually contiguous and not necessarily physically contiguous. This is how\
    \ a user-space allocation works: The pages returned by kmalloc() are contiguous\
    \ within the virtual address space of the processor, but there is no guarantee\
    \ that they are actually contiguous in physical RAM. kmalloc() function guarantees\
    \ that the pages are physically contiguous (and virtually contiguous). vmalloc()\
    \ function only ensures that the pages are contiguous within the virtual address\
    \ space. It does this by allocating potentially noncontiguous chunks of physical\
    \ memory and \"fixing up\" the page tables to map the memory into a contiguous\
    \ chunk of the logical address space."
