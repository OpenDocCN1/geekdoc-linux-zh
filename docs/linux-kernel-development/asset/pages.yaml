  md: '# schedule ()


    The act of picking the next task to run and switching to it is implemented via
    the schedule() function. This function is called explicitly by kernel code that
    wants to sleep and it is invoked whenever a task is to be preempted.


    The schedule() function is relatively simple for all much. The following code
    determines the highest priority task:


    ```

    struct task_struct *prev, *next;

    struct list_head *queue;

    struct prio_array *array;

    int idx;


    prev = current;

    array = rg->active;

    idx = find_first_bit(array->bitmap) + idx;

    queue = array->queue->task_struct->run_list;

    next = list_entry(queue->next, struct task_struct, run_list);

    ```


    First, the active priority array is searched to find the first set bit. This corresponds
    to the highest priority task that is runnable. Next, the scheduler selects the
    first task in the list at that priority. This is the highest priority runnable
    task on the system and the task the scheduler will run. See Figure 3.2.


    ![](img/10f4d9a57f7d19944d26b746133440df_66_0.png)


    > Figure 3.2 The Linux O(1) scheduler algorithm.


    If prev does not equal next, then a new task has been selected to run. The architecture-specific
    function context_switch() is called to switch from prev to next. We will discuss
    context switching in a subsequent section.'
