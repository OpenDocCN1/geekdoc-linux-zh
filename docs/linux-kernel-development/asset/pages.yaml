    # User Preemption


    User preemption occurs when the kernel is about to return to user-space, need_resched
    is set, and therefore, the scheduler is invoked. If the kernel is returning to
    user-space, it is in a safe quantum. In other words, if it is safe to continue
    executing the current task, is also safe to pick a new task to execute. Consequently,
    whenever the kernel is preparing to return to user-space, either from an interrupt
    or after a system call, the value of need_resched is checked. If it is set, the
    scheduler is invoked to select a new (more fit) process to execute. Both the paths
    for return from interrupt and return from system call are architecture-dependent
    and typically implemented in assembly in entry.S (which, aside from kernel entry
    code, also contains kernel ext code).


    In short, user preemption can occur


    +   * When returning to user-space from a system call

    * When returning to user-space from an interrupt handler


    # Kernel Preemption


    The Linux kernel, unlike most other Unix variants and many other operating systems,
    is a fully preemptive kernel. In non-preemptive kernels, kernel code runs until
    completion. That is, the scheduler is not capable of rescheduling a task while
    it is in the kernel—kernel code is scheduled cooperatively, not preemptively.
    Kernel code runs until it finishes (returns to user-space) or explicitly blocks.
    In the 2.6 kernel, however, the Linux kernel became preemptive; it is now possible
    to preempt a task at any point, so long as the kernel is in a state in which it
    is safe to reschedule.


    So when is it safe to reschedule? The kernel is capable of preempting a task running
    in the kernel so long as it does not hold a lock. That is, locks are used as markers
    of non-preemption. Because the kernel is SMP-safe, if a lock is not held, the
    current code is reentrant and capable of being preempted. When the counter is
    zero, the kernel is preemptible.


    The first change in supporting kernel preemption was the addition of a preempt_count,
    to each process''s thread_info structure. The counter begins at zero and increments
    for each lock that is acquired and decrements for each lock that is released.
    When the counter is zero, the kernel is preemptible.


