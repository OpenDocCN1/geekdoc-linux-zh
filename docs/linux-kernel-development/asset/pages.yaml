  md: '# Table 2.1 clone() Flags


    | Flag | Meaning |

    | --- | --- |

    | CLONE_CLEARTID | clear the TID |

    | CLONE_DETACHED | the parent does not want a SIGCHLD signal on exit |

    | CLONE_FILES | parent and child share files |

    | CLONE_FS | parent and child share filesystem information |

    | CLONE_IDLETASK | set PID to zero (which used only by the idle tasks) |

    | CLONE_NEWNS | create a new namespace for the child |

    | CLONE_PARENT | child is to have same parent as its parent |

    | CLONE_PTRACE | continue tracing back |

    | CLONE_SETTID | write the TID back to user-space |

    | CLONE_SETTLS | create a new TLS for the child |

    | CLONE_SIGHAND | parent and child share signal handlers |

    | CLONE_SYSVEM | parent and child share V SEM, semantics |

    | CLONE_THREAD | parent and child are in the same thread group |

    | CLONE_VFORK | vfork(4) was used and the parent will sleep until the child wakes
    it |

    | CLONE_VM | parent and child share address space |


    # # Kernel Threads


    It is useful for the kernel to perform some operations in the background. The
    kernel accomplishes this via kernel threads—standard processes that exist solely
    in kernel-space. The significant difference between kernel threads and normal
    processes is that kernel threads do not have an address space (in fact, their
    mm pointer is NULL). They operate only in kernel-space and do not switch into
    user-space. Kernel threads are, however, schedable and preemptable as normal processes.


    Linux delegates several tasks to kernel threads, most notably the pdflush and
    kswapd tasks. These threads are created on system boot by kernel threads. A kernel
    thread can only be created by another kernel thread. The interface for spawning
    a new thread from any existing one


    ```

    int kernel_thread(void (*fn)(), void *arg, unsigned long flags)

    ```


    The new task is created via the clone() system call with the specified flags argument.
    On return, the parent kernel thread exits with a pointer to the child''s task_struct.
    The child executes the function specified by fn with the given argument arg. A
    special clone flag, CLONE_KERNEL, specifies the usual flags for kernel thread:
    CLONE_FS, CLONE_FILES, CLONE_SIGHAND. Most kernel threads pass this for their
    flags parameter.


    Typically, a kernel thread continues executing its initial function forever (or
    at least until the system reboots, but with Linux you never know). The initial
    function usually'
