  md: "# Race Conditions\n\nTimers run asynchronously with respect to the currently\
    \ executing code, several potential race conditions exist. First, never do the\
    \ following as a substitute for a mere `_mod_timer()`, because this is unsafe\
    \ on multiprocessing machines:\n\nSecond, in all cases, you should use `del_timer_sync()`\
    \ otherwise you cannot assume the timer is not currently running, and that is\
    \ why you make the kernel in the first place! Imagine if after deleting the timer,\
    \ the code goes on to free or unknowingly manages resources by the timer handler.\
    \ The synchronized version is preferred.\n\n# The Timer Implementation\n\nThe\
    \ kernel executes timers in bottom half context, as a softir, after the timer\
    \ interrupt completes. The timer interrupt handler runs `update_process_times()`\
    \ which calls `run_local_timers()`:\n\n```\nvoid run_local_timers(void)\n{\n \
    \   raise_softirq(softirq);\n}\n```\n\nThe `TIMER_SOFTIRQ` is handled by `run_timer_softirq()`.\
    \ This function runs all the expired timers (if any) on the current processor.\\\
    Timers are stored in a linked list. However it would be unwieldy for the kernel\
    \ to constantly traverse the entire list looking for expired timers, or keep the\
    \ list sorted by expiration value, the insertion and deletion of timers would\
    \ then become very expensive. Instead, the kernel partitions timers into five\
    \ groups based on their expiration value. Timers move down the groups as their\
    \ expiration time draws closer. The partitioning ensures that, in most executions\
    \ of the softirq, the kernel has to do little work to find the expired timers.\
    \ Consequently, the timer management code is very efficient.\n\n# Delaying Execution\n\
    \nOften, kernel code (especially drivers) needs a way to delay execution for some\
    \ time without using a timer or a bottom half mechanism. This is usually to allow\
    \ hardware time to complete a given task. The time is typically quite short. For\
