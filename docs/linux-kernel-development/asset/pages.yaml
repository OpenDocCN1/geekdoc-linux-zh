    # Why Not Implement a System Call


    It is easy to implement a new system call, but in no way should encourage you
    to do so. Often, much more viable alternatives to providing a new system call
    are available. Let''s look at the pros, cons, and the alternatives.


    The pros of implementing a new interface as a syscall:


    +   * System calls are simple to implement and easy to use.

    * System call performance on Linux is blindingly fast.


    The cons:


    +   * You need a syscall number, which needs to be officially assigned to you
    during a developmental kernel.

    * After the system call is in a stable kernel, it is written in stone. The interface
    cannot change without breaking user-space applications.

    * Each architecture needs to separately register the system call and support it.

    * For simple exchanges of information, a system call is overkill.


    The alternatives:


    +   * Implement a device node and read() and write() to it. Use ioctl() to manipulate
    specific settings or retrieve specific information.

    * Certain interfaces, such as semaphores, can be represented as file descriptors
    and manipulated as such.

    * The current trend is to implement a simple RAM-based filesystem where files
    represent the specific interfaces. Linux, however, have tried to simply perform
    normal file I/O on the files to access the interface. Chapter 13, "Virtual Filesystems",
    provides more details.


    For many interfaces, system calls are the correct answer. Linux, however, has
    tried to avoid simply adding a system call to support each new abstraction that
    comes along. The result has been an incredibly clean system call layer with very
    few regrets or deprecations (interfaces no longer used or supported).


    The slow rate of addition of new system calls is a sign that Linux is a relatively
    stable and feature-complete operating system. Only a handful of system calls were
    added in total during the 2.3 and 2.5 kernel development series. The vast majority
    of these new calls were to provide performance enhancements.'
