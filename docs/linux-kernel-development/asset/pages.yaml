  md: 'a valid memory area, or if it accesses a valid area in an invalid manner, the
    kernel kills the process with the dreaded "Segmentation Fault" message.


    Memory areas contain sort of goodies, such as


    +   - A memory map of the executable file''s code, called the text section

    - A memory map of the executable file''s initialized global variables, called
    the data section

    - A memory map of the zero page (page consisting of all zeros, used for purposes
    such as this) containing uninitialized global variables, called the bss section

    - A memory map of the zero page used for the process''s-user stack (do not confuse
    this with the process''s kernel stack, which is separate and maintained by the
    kernel)

    - An additional text, data, and bss section for each shared library, such as the
    C library and dynamic linker, loaded into the process''s address space

    - Any memory mapped files

    - Any shared memory segments

    - Any anonymous memory mappings, such as those associated with malloc()


    All addresses in the process address space exist in exactly one area (memory areas
    do not overlap). As we see, there is a separate memory area for each chunk of
    memory in a running process: the stack, the object code, global variables, mapped
    file, and so on.


    # The Memory Descriptor


    The kernel represents a process''s address space with a data structure called
    the memory descriptor. This structure contains all of the information related
    to the process address space. The memory descriptor is represented by struct mm_struct
    and defined in <linux/sched.h>.


    Let''s look at the memory descriptor, with comments added each field:


    > The term "BSS" is historic and quite old. It stands for block started by symbol.
    Uninitialized variables are not stored in the executable object, because they
    do not have any associated value. But the C standard determines that uninitialized
    global variables are assigned certain default values (basically, all zeros), so
    the kernel loads the variables (without value) from the executable and maps the
    zero page over the area, thereby giving the variables the value zero, without
    having to save space in the object file with explicit initializations.


    > Newer versions of glibc implement mmap() and brk().


    > There is a tangled interdependency between the process descriptor, the memory
    descriptor, and their related functions. Consequently, struct mm_struct ends up
    in sched.h.'
