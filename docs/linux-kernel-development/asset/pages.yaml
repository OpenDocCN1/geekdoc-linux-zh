  md: '# Interrupts and Interrupt Handlers


    ONE OF THE MAJOR RESPONSIBILITIES OF the kernel is managing the hardware connected
    to the machine. As part of this work, the kernel needs to communicate with the
    machine''s individual devices. Given that processors are typically much faster
    than the hardware they talk to, it is not ideal for the kernel to issue a request
    and wait for a response from the potentially slow hardware. Instead, because the
    hardware is comparatively slow to respond, the kernel must be free to go off and
    deal with the hardware after it has actually completed its work. One solution
    to this is polling. Periodically, the kernel can check the status of the work
    and respond accordingly. This incurs overhead, regardless of whether the hardware
    is active because the polling occurs repeatedly at regular intervals. A better
    solution is to provide a mechanism for the hardware to signal the kernel when
    attention is needed. This solution is called interrupts.


    # Interrupts


    Interrupts allow hardware to communicate with the processor. For example, when
    you type, the keyboard controller (hardware device which controls the keyboard)
    issues an interrupt to alert the operating system to available key presses. Interrupts
    are special electrical signals sent from hardware devices to the processor. The
    processor receives the interrupt and signals the operating system so that the
    OS can process the new data. Hardware devices generate interrupts asynchronously
    with respect to the processor clock—they can occur at any time. In turn, the kernel
    can be interrupted at anytime to process interrupts.


    An interrupt is physically produced by electronic signals originating from the
    devices and directed into input pins of an interrupt controller. The interrupt
    controller, in turn, sends a signal to the processor. The processor detects this
    signal and interrupts its current execution to handle the interrupt. The processor
    can then notify the operating system that an interrupt has occurred, and the operating
    system can handle the interrupts appropriately.'
