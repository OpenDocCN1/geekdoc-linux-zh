  md: 'The load balancer is implemented in kernel/sched.c as load_balance(). It has
    two methods of invocation. It is called by schedule() whenever the current runqueue
    is empty: every 1 millisecond when the system is idle and every 200 milliseconds
    otherwise. On uniprocessor systems, load_balance() is never called, and is not
    even compiled into the kernel because there is only a single runqueue and thus,
    no balancing is needed.


    The load balancer is called by the current processor''s runqueue locked with interrupts
    disabled to protect the runqueues from concurrent access. In the case where schedule()
    calls load_balance(), its job is pretty clear, because the current runqueue is
    busy finding any process and pulling it into this runqueue is advantageous. The
    load balancer is called via timer, however, its job might be less apparent; it
    needs to resolve any imbalance between the runqueues to keep them about even.


    | Process 1 | Process 1 |

    | --- | --- |

    | Process 2 | Process 2 |

    | Process 3 | Process 3 |

    | Process 4 | Process 4 |

    | Process 5 | Process 5 |

    | load_balance() | Process 6 |

    | pull from one runqueue to another to relieve imbalances |

    | ... | ... |

    | Process 20 | Process 15 |


    Figure 3.4 The load balancer.


    The load_balance() function and related methods are large and complicated although
    the steps they perform are understandable:


    +   * First, load_balance() calls find_busiest_queue() to determine the busiest
    runqueue. In other words, this is the runqueue with the greatest number of processes
    in it. If there is no runqueue that has 25% or more processes than the current,
    find_busiest_queue() returns NULL and load_balance() returns. Otherwise, the busiest
    runqueue is returned.


    +   * Second, load_balance() decides which priority array on the busiest runqueue
    it wants to pull from. The expired array is preferred because those tasks have
    not run in a relatively long time, thus are most likely not in the processor''s
    cache (that is, they are not cache hot). If the expired priority array is empty,
    the active one is the only choice.'
