  md: 'The mys is important: when assigned, it cannot change, or else compiled syscalls
    break. Likewise, if a system is called, its system call

    not be recycled. Linux provides a "not implemented" system call, sys_ni_syscall(),
    which does nothing except returning -ENOSYS, the error corresponding

    to an invalid system call. This function is used to "plug the hole" in the rare
    event it is called.


    The kernel keeps a list of all registered system calls in the kernel table, stored
    in sys_call_table. It is architecture-dependent and typically defined in

    entry.S. This task validates each valid syscall to a unique number.


    # System Call Performance


    System calls in Linux are faster than in many other operating systems. This is
    partly because of Linux''s incredibly fast context switch times; entering and
    exiting the

    kernel is streamlined and simple affair. The other factor is the simplicity of
    the system call handler and the individual system calls themselves.


    # System Call Handler


    It is not possible for user-space applications to execute kernel code directly.
    They cannot simply make a function to call in the kernel-space because the

    kernel exists in a protected memory space. If applications could directly read
    and write to the kernel''s address space, system security would go out the window.


    Instead, user-space applications must somehow signal the kernel that they want
    to execute a system call and have the system switch to kernel mode, where the
    system

    call can be executed in kernel-space by behalf of the application.


    The mechanism to signal the system call is a software interrupt: Incur an exception
    and then the system switch to kernel mode and execute the exception handler. The

    exception handler, in this case, is actually the system call handler. The defined
    software interrupt on x86 is the int $0x80 instruction. It triggers a switch to
    kernel

    mode and the execution of exception vector 128, which is the system call handler.
    The aptly-named function system_call().It is

    architecture-dependent and typically implemented in assembly in entry.s.


    # Denoting the Correct System Call


    Simply entering kernel-space alone is not sufficient because there are multiple
    system calls, all of which enter the kernel in the same manner. Thus, the system
    call

    number must be passed into the kernel. On x86, storing the system call number
    in the eax register before issuing the software interrupt does this. The system
    call

    hand then reads the value from eax. Other architectures do something similar.


    > Much of the following description of the system call handler is based on the
    x86 version. Do not fret, they are all very similar.'
