  md: '# Scheduling Algorithm


    The Linux scheduler is defined in kernel/sched.c. The scheduler algorithm and
    supporting code went through a large rewrite early in the 2.5 kernel development
    series. The scheduler code is entirely new and unlike the scheduler previous.
    The new scheduler was designed to accomplish specific goals.


    +   * Implement fully O(1) scheduling. Every algorithm in the new scheduler completes
    in constant-time, regardless of the number of running processes or any other input.

    * Implement perfect SMP scalability. Each processor has its own locking and individual
    runqueue.

    * Implement improved fairness. Naturally attempt to group tasks to a specific
    CPU and continue to run them there. Only migrate tasks from one CPU to another
    to resolve imbalances in runqueue.

    * Provide good interactive performance. Even during considerable system load,
    the scheduler should react and schedule interactive tasks immediately.

    * Provide fairness. No process should find itself starved of timeslice for any
    reasonable amount of time. Likewise, no process should receive an unfairly high
    amount of timeslice.

    * Optimize for the common case of 1-2 runnable processes, yet scale well to multiple
    processors with many processes.


    The new scheduler accomplished these goals.


