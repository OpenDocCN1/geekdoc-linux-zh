  md: '# System Call Context


    As discussed in Chapter 2, "Process Management," the kernel is in process context
    during the execution of a system call. The current pointer points to the current
    task, which is the process that issued the system call.


    In process context, the kernel is capable of sleeping (if the system call blocks
    on an explicit call schedule()) and is fully preemptive. Two points are important.
    First, the ability to sleep many system calls can make use of the majority of
    the kernel''s functionality. As we see in Chapter 5, "Interrupts and Interrupt
    Handlers," the ability to sleep greatly simplifies kernel programming. The fact
    that process context is preemptive implies that, like user-space, the current
    task may be preempted by another task. Because the same system call call, care
    must be exercised to ensure that system calls are reentrant. Of course, this is
    the same concern that symmetric multiprocessing introduces. Protecting reentrancy
    is covered in Chapter 7, "Kernel Synchronization Introduction," and Chapter 8,
    "Kernel Synchronization Methods."


    When the system call returns, control continues in system_call(), which ultimately
    switches to user-space and continues the execution of the user process.


