  md: '# Bibliography and Reading List


    This bibliography is sorted by subject and contains some of the more interesting
    and useful books on subjects similar or complimentary to those in this book.


    All of these books have proved themselves quite useful over time. Some of them
    represent "sacred tomes" in their respective subjects, whereas others have simply
    found interesting, insightful, or entertaining in some capacity. I hope that they
    can assist you, as well.


    Note that the absolute best reference or "additional reading" to compliment the
    book is the kernel source. Working on Linux, we are all gifted with full and unrestricted
    access to the source code for an entire modern operating system. Do not take that
    for granted! Dive in!


    # Books on Operating System Design


    These books cover OS Design, as discussed in an undergraduate course. They all
    tackle the concepts, algorithms, problems, and solutions involved in designing
    a functional operating system.


    +   * Tanenbaum, Andrew. *Operating Systems: Design and Implementation.* Prentice
    Hall, 1997. A great introductory work on both the design and implementation of
    a Unix-like system, Minix.


    +   * Tanenbaum, Andrew. *Modern Operating Systems.* Prentice Hall, 2001. A strong
    overview of the standard operating system design issues plus discussion on many
    of the concepts used in today''s modern operating systems, such as Unix and Windows.


    +   * A. Silbersatz, P. Galvin, and G. Gagne. *Operating System Concepts.* John
    Wiley and Sons, 2001. Also known as the Dinosaur book, for the seemingly irrelevant
    dinosaurs on the cover. A great introduction to OS. The book has frequent revisions;
    any of them should do fine.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Books on Unix Kernels


    These books tackle the design and implementation of Unix kernels. The first three
    discuss a specific flavor of Unix, and the later two focus on issues common to
    all Unix variants.


    Bach, Maurice. The Design of the Unix Operating System. Prentice Hall, 1986. A
    good discussion on the design of System V Release 2.


    M. McCusick, K. Bostic, M. Karels, and J. Quarterman. The Design and Implementation
    of the 4.4BSD Operating System. Addison-Wesley, 1996. A good discussion on the
    design of the 4.4BSD system by the system designers.


    J. Mauro and R. McDougall. Solaris Internals: Core Kernel Architecture. Prentice
    Hall, 2000. An interesting discussion on the core subsystems and algorithms in
    the Solaris kernel.


    Vahalia, Utreh. Unix Internals: The New Frontiers. Prentice Hall, 1995. A superb
    book on very modern Unix features, such as thread management and kernel preemption.


    Schimmutt, Curt. Unix Systems for Modern Architectures: Symmetric Multiprocessing
    and Caching for Kernel Programmers. Addison-Wesley, 1994. A superb book on the
    perils of supporting a modern Unix on a modern architecture.


    # Books on Linux Kernels


    These books, like this one, discuss the Linux kernel.


    A. Rubin and J. Corbett. Linux Device Drivers. O''Reilly and Associates, 2001.
    An excellent discussion on how to write drivers for the 2.4 kernel.


    D. Bovet and M. Ceati. Understanding the Linux Kernel. O''Reilly and Associates,
    2002. A good discussion of the internal algorithms of the 2.4 Linux kernel. It
    focuses on the underlying design of the kernel.


    D. Moshergian and S. Eanian. IA-64 Linux Kernel: Design and Implementation. Prentice
    Hall, 2002. An excellent look at the Intel Itanium architecture and its port of
    the Linux 2.4 kernel.


    # Books on Other Kernels


    Understanding your enemies—competitors—never hurts. These books discuss the design
    and implementation of operating systems other than Linux. What we see what they
    got and what went wrong.


    M. Kogan and H. Deitel. The Design of OS/2. Addison-Wesley, 1996. An interesting
    look at OS/2 2.0.


    D. Solomon and M. Russinovich. Inside Windows 2000. Microsoft Press, 2000. An
    interesting look at a very non-Unix operating system.


    Richter, Jeff. Advanced Windows. Microsoft Press, 1997. A thorough discussion
    of low-level and systems programming in Windows.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Books on the Unix API


    In-depth discussions of the Unix system and its API are important not only for
    writing powerful user-space programs, but also understanding the responsibilities
    of the kernel.


    Stevens, W. Richard. *Advanced Programming in the UNIX Environment*. Addison-Wesley,
    1992. An excellent, if not definitive, discussion on the Unix system interface.


    Stevens, W. Richard. *Network Programming*, Volume 1. Prentice Hall, 1998. A classic
    text on the sockets API used by Unix systems.


    M. Johnson and E. Troan. *Linux Application Development*. Addison-Wesley, 1998.
    A general overview of the Linux system and Linux-specific interfaces.


    # Other Works


    A collection of other books not strictly related to operating systems, but undoubtedly
    affect them.


    Knuth, Donald. *The Art of Computer Programming*, Volume 1. Addison-Wesley, 1997.
    A priceless tour de force in the fundamental algorithms of computer science, including
    best- and worst-fit algorithms used in memory management.


    B. Kernigh and D. Ritchie, *The C Programming Language*. Prentice Hall, 1988.
    The definitive book on the C programming language.


    Hofstadler, Douglas. Gödel. Escher. *Bach: An Eternal Golden Braid*. Basic Books,
    1999. A profound and indispensable look at human thought that delves wildly into
    multiple subjects, including computer science.


    # Web Sites


    These Web sites provide up-to-date news and downloads related to Linux and our
    beloved kernel.


    http://www.kerneltraffic.org/ Kernel Traffic. An excellent summary of the previous
    week''s traffic on the Linux kernel mailing list (lkml). Highly recommended.


    http://www.lwn.net/ Linux News. A great news site with an excellent commentary
    on the week''s kernel happenings. Highly recommended.


    http://www.kernelnewbies.org/ Kernel Newbies. Kernel Newbies is a community project
    to provide information and help to aspiring kernel hackers.


    http://www.kernel.org/ Kernel.org. The official repository of the kernel source.
    It is also home to a large number of the core hacker patches.'
