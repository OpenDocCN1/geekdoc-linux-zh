  md: '# Spin Locks


    Although it might seem if every critical region was as simple as increasing a
    variable, reality is much coarser. In real life, critical regions can span multiple
    functions. For example, it is often the case that data must be removed from one
    structure, formatted and added to another. This entire operation must occur atomically;
    it not not possible for other code to read either structure before we are updating
    it. Because simple atomic operations are incapable of providing the protection,
    a more complex method of synchronization is needed—locks.


    The most common lock in the Linux kernel is the spin lock. A spin lock is a lock
    that can be held by one thread of execution. If a thread of execution attempts
    to acquire a spin lock while it is contended (already held), the thread will spin—waiting
    for the lock to become available. If the lock is not contended, it can immediately
    acquire the lock and continue. The spinning prevents more than one thread of execution
    from the critical region at any one time. The same lock can be used in multiple
    locations—so all access to a given data structure, can be protected and synchronized.


    The fact that a contended spin lock causes threads to spin (waiting processor)
    while waiting for the lock to become available is important. It is not behavior
    to hold a spin lock for a long time. In fact, this is the nature of the spin lock:
    a lightweight holder-lock that should be held for short durations. An alternative
    is to use a lock that puts the thread to sleep instead of spinning. This incurs
    a bit of overhead—mostly the two context switches to switch out and back into
    the blocking thread. Therefore, it is wise to hold spin locks as short as possible¹,
    less than the duration of two context switches. Because most of us have better
    things to do than measure context switches, just try to hold the lock as short
    as possible. The next section will use semaphores, which provide a lock that makes
    the wait thread sleep, instead of spin, when contended.


    Spin locks are architecture-dependent and implemented in assembly. The architecture-dependent
    code is defined in <asm/spinlock.h>. The actual use of a spin lock


    ```

    spinlock_t mr_lock = SPIN_LOCK_UNLOCKED;


    spin_lock(&mr_lock);

    /* critical region ... */

    spin_unlock(&mr_lock);

    ```


    This is especially important when the kernel is preemptive. The duration of locks
    held is coupled to the scheduling latency of the system.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'The lock can only be held simultaneously by most one thread of execution. Consequently,
    only one thread is allowed in the critical region at a time. This provides the
    needed protection from concurrency on multiprocessing. On UP machines, the locks
    compile away and do not exist. They simply act as markers to disable and enable
    kernel preemption. If kernel preemption is turned off, the locks compile entirely.


    # Warning: Spin Locks Are Not Recursive?


    Unlike spin locks in other operating systems, the Linux kernel''s spin locks are
    not recursive. If a lock is used and you attempt to acquire a lock already held,
    you will spin, waiting for yourself to release the lock. Because you are busy,
    you will never release the lock and you will deadlock.


    Spin locks can be used in interrupt handlers (semaphores, however, because they
    cannot sleep). If a lock is used in an interrupt handler, you must also disable
    interrupts (interrupt requests on the current processor) before taking the lock.
    Otherwise, it is possible for an interrupt handler to interrupt kernel code while
    the lock is held and attempt to acquire the lock. The interrupt handler spins,
    waiting for the lock to become available. The lock holder, however, will not run
    until the interrupt handler occurs on a different processor, and it spins on the
    same lock, it will not prevent the lock holder (which is on a different processor)
    from eventually releasing the lock.


    The kernel provides an interface that conveniently disables and acquires the lock.
    Usage is


    ```

    spinlock_t mrlock = SPIN_LOCK_UNLOCKED;

    unsigned long flags;


    spin_lock_irqsave(&mrlock, flags);

    /* critical region ... */

    spin_unlock_irqrestore(&mrlock, flags);

    ```


    spin_lock_irqsave() saves the current state of interrupts, disables them locally,
    and then obtains the given lock. Conversely, spin_unlock_irqrestore() unlocks
    the lock and returns interrupts to their previous state. This way, if they are
    initially disabled, your code will not erroneously enable them. Note that the
    flags variable is seemingly passed by value. This is because the lock routines
    are implemented partially as macros.


    On uniprocessor systems, the previous example must disable interrupts to prevent
    an interrupt handler from accessing the shared data, but the lock mechanism is
    compiled away. The lock and unlock disable and enable kernel preemption, respectively.'
