  md: '# Bottom Halves and Deferring Work


    IN THE PREVIOUS CHAPTER, WE LOOKED at interrupt handlers as the kernel mechanism
    for dealing with interrupts. Interrupt handlers are a useful—indeed, required—part
    of the kernel. Because of certain limitations, however, they form only the first
    half of the interrupt processing solution. The limitations include


    +   * Interrupt handlers run asynchronously and thus interrupt other potentially
    important code (even other interrupt handlers). Therefore, they need to run as
    quickly as possible.

    * Interrupt handlers run with the current interrupt level disabled at best, and
    at worst (if SA_INTERRUPT is set) with all interrupts disabled. Again, they need
    to run as quickly as possible.

    * Interrupt handlers do not run in process context, therefore, they cannot block.


    It should now be obvious that interrupt handlers are only a piece of the whole
    solution to managing hardware interrupts. We certainly need a quick, asynchronous
    handler for immediately responding to hardware and performing any time-critical
    actions. Interrupt handlers serve this function well, but other, less critical
    work, should be deferred to a later point when interrupts are enabled.


    Consequently, managing interrupts is divided into two parts, halves. The first
    part, interrupt handlers (top halves), are executed by the kernel asynchronously
    in immediate response to a hardware interrupt, as we discussed in the previous
    chapter. In this chapter, we look at the second part of managing interrupts, bottom
    halves.


    # Bottom Halves


    The job of bottom halves is to perform any interrupt-related work not performed
    by the interrupt handler itself. In an ideal world, this is nearly all the work
    we want'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'The interrupt handler to perform as little work (and in turn as fast) as possible.
    We want interrupt handlers to return as quickly as possible.


    Nonethless, the interrupt handler must perform some of the work. For example,
    the interrupt handler already needs to acknowledge the receipt of the interrupt
    with the hardware. It also needs to copy data to or from the hardware. This is
    timing-sensitive, so it makes sense to perform it in the interrupt handler.


    Almost else is fair game for performing in the bottom half. For example, if you
    copy data into the memory in the top half, it certainly makes sense to process
    it in the bottom half. Unfortunately, no hard and fast rules exist about what
    to perform—where—the decision is left up to the device author. Although no arrangement
    is wrong, an arrangement easily be suboptimal. Remember, the interrupt handlers
    run asynchronously, with at least the current interrupt disabled. Minimizing your
    disruption is important. So most rules about how to divide the work between the
    top and bottom half exist, but a couple useful tips might help:


    +   - If the work is time-sensitive, perform it in the interrupt handler.

    - If the work is related to the hardware itself itself.

    - If the work needs to ensure that another interrupt (particularly the same interrupt)
    does not interrupt it, perform it in the interrupt handler.

    - For everything else, perform the work in the bottom half.


    When writing your own device driver, looking at other interrupt handlers and their
    their corresponding bottom halves will help. When deciding to divide your interrupt
    processing work between the top and bottom half, ask yourself what has to be in
    the top half and what can be in the bottom half. Generally, the quicker the interrupt
    executes, the better.


    # Why Bottom Halves?


    It is crucial to understand why we defer work, and when exactly to defer it. You
    want to limit the amount of work you perform in an interrupt handler because interrupt
    handlers run with the current interrupt disabled. Worse, handlers that register
    with SA_INTERRUPT run with all local interrupts disabled (plus the local interrupt
    run asynchronously with respect to others—even other interrupt handlers)—and then
    it is clear that we should minimize how long interrupt handlers run. The solution
    is to defer some of the work later.


    But when is later? The important thing to realize is that later is simply not
    now. The point of a bottom half is not to work at some specified point in the
    future, but simply to defer work until any point in the system is less busy and
    interrupts are again enabled. Often, bottom halves run immediately after the interrupt
    returns. The key is that they run with all interrupts enabled.'
