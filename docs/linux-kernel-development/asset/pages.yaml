    # # Data Alignment


    Alignment refers to a piece of data''s location in memory. A variable is said
    to be naturally aligned if it exists at a memory address that is a multiple of
    its size. For example, a 32-bit type is naturally aligned if it is located in
    memory at an address that is a multiple of four (that is, its lowest two bits
    are zero). Thus, a data type with size 2 bytes must have an address with the n
    least significant bits set to zero.'
