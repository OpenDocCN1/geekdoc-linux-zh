  md: '# The Page Cache and Page Writeback


    THE LINUX KERNEL IMPLEMENTES ONE PRIMARY DISK CACHE, known as the page cache.
    The goal of this cache is to minimize disk I/O by storing in physical memory that
    would otherwise be accessed from disk. This chapter deals with the page cache.


    Disk caches are beneficial for two reasons. First, disk access is magnitudes slower
    than memory access. Accessing data from memory instead of the disk is much faster.
    Second, data accessed once will, with a high likelihood, be accessed again in
    the near future. This principle, that access to a particular piece of data tends
    to be clustered, is called temporal locality. Temporal locality ensures that data
    is cached on its first access, there is a high probability of a cache hit (access
    to data that is in the cache) in the near future.


    The page cache consists of physical pages in RAM. Each page in the cache corresponds
    multiple blocks on the disk. Whenever the kernel begins a I/O operation (a disk
    operation in page-size chunks, usually to a regular file), it checks if the requisite
    data is in the page cache. If it is, the kernel can forgo accessing the disk and
    use the data straight from the page cache.


    Individual disk caches can also tie into the page cache, by way of block I/O buffers.
    Recall from Chapter 12, "The Block I/O Layer," that a buffer is the in-memory
    representation of a single physical disk block. Buffers act as descriptors that
    map pages in memory to disk blocks; thus, the page cache also reduces disk access
    during block I/O operations by caching disk blocks and buffering I/O operations
    until later. This caching is often referred to as the "buffer cache," although
    in reality it is not a separate cache and is part of the page cache.


    Let us look at the sort of operations and data that end up in the page cache.
    The page cache is primarily populated by page I/O operations, such as `read()`
    and `write()`. I/O operations manipulate entire pages of data at a time; this
    entails operations on more than one disk block. Consequently, the page cache caches
    page-size chunks of files.'
  merge: -1
  pgno: 269
- img_proc: true
  md: "I/O operations manage a single block disk at a time. A common I/O operation\
    \ is reading and writing nodes. The kernel provides the `read()` function to perform\
    \ a low-level read of a single block from disk. Via buffers, disk blocks are mapped\
    \ to their associated memory pages and thus, cached in the page cache.\n\nWhen\
    \ you edit a file in a text editor, the data is read into memory from disk. As\
    \ you edit the file, more pages are read. When you complete the edit, the kernel\
    \ can use the pages from the page cache; it need not reread the file from disk.\
    \ Users want to read and manipulate the same pages repeatedly, the page cache\
    \ reduces the need for a large number of disk operations.\n\n# Page Cache\n\n\
    The page cache, as its name suggests, is a cache of pages. The pages operate reads\
    \ and writes of regular filesystem files, block device files, and memory-mapped\
    \ files. In this manner, the page cache contains entries from recently accessed\
    \ files. Prior to a page I/O operation, such as `read()`^1, the kernel checks\
    \ if the data resides in the page cache. If the data is in the page cache, the\
    \ kernel can quickly return the requested page.\n\n# The address_space Object\n\
    \nA physical page might be composed of multiple noncontiguous physical blocks^2.\
    \ Checking the page cache to see if data has been cached is rendered more difficult\
    \ because of the noncontiguous nature of the blocks that can up each page using\
    \ only a device number and block number, which would otherwise be the simplest\
    \ solution.\n\nFurthermore, the Linux page cache is quite general in what it can\
    \ cache. Indeed, the original page cache introduced in System V Release 4 cached\
    \ only filesystem data. The Linux page cache aims to cache any page-based object,\
    \ which includes many forms of files and memory mappings.\n\nTo remain generic,\
    \ the page cache uses the `address_space` structure to identify pages in the page\
    \ cache. This structure is defined in `<linux/fs.h>`:\n\n```\nstruct address_space\
    \ {\n    struct inode *\n    struct address *host;           /* owning node */\n\
    \    struct radix_tree_root page_tree; /* radix tree of all pages */\n};\n```\n\
    \n> ^1 As we see in Chapter 11, \"The Virtual Filesystem,\" it is not the read)\
    \ and `write()` system calls which perform the actual page I/O operation, but\
    \ the filesystem-specific methods specified by `file->f_op->read()` and `file->f_op->write()`.\n\
    \n> ^2 For example, a page file is 4KB on the x86 architecture while a disk on\
    \ most filesystems can be as small as 512 bytes. Therefore, 8 blocks fit in a\
    \ single page. The blocks need not be contiguous because the file themselves might\
    \ be laid out over the disk."
  merge: -1
  pgno: 270
- img_proc: true
