    Read operations are quite different. Normally, when an application is synchronous,
    the operation blocks until the request is fulfilled. That is, read requests occur
    synchronously with respect to the submitting application. Although system response
    is largely unaffected by write latency (the time required to commit a write request),
    read latency (the time required to commit a read request) is very important. Write
    latency has'
