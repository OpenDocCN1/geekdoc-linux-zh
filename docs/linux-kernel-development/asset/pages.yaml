  md: '# Portability


    LINUX is a portable operating system that supports a wide range of computer architectures.
    Portability refers to how easily—if at all—code can move from one system architecture
    to another. We all know that Linux is portable because it has already been ported
    to various systems. But this portability did not occur overnight—it required many
    design decisions along the way. Consequently, now it is easy (relatively speaking)
    to bring Linux up on a new system. This chapter discusses how to write portable
    code—the issues you need to keep in mind when writing kernel code or device drivers.


    Some operating systems are designed with portability as a primary feature. Little
    as code is machine-specific, Assembly is kept to a minimum and interfaces and
    features are sufficiently general and abstract that they work on a wide range
    of architectures. The obvious benefit is the relative ease with which a new architecture
    can be supported. Highly portable and simple operating systems are easy to port
    with just a few hundred lines of unique code. The downside is that machine-specific
    features cannot be exploited for a specific machine. With this design choice,
    optimal code is traded for portable code. Some examples of highly portable operating
    systems are Minix, NetBSD, and many research systems.


    On the opposite side are operating systems that trade all portability for highly
    customized code. As much as possible, code is written in assembly or otherwise
    designed for a specific architecture. Kernel features are designed around specific
    architectural features. Consequently, moving the operating system to a new architecture
    is tantamount to writing a kernel from scratch. With this design decision, portable
    code is traded for optimal code. Such systems are often harder to maintain than
    more portable systems. Example systems are DOS and Windows 9x. Now, these systems
    need to be hand-tune as much code as possible.


    Linux takes the middle road toward portability. As much as practical, interfaces
    and core code are architecture-independent C code. Where performance is critical,
    however, kernel features are tuned for each architecture. For example, fast-path
    and and'
