    # Submitting Bug Reports


    If you encounter a bug, the course of action is to write a patch, test it, and
    submit it as described in the following sections. Of course, you can also report
    the problem and get someone to fix it.


    The most important part of submitting a bug report is fully describing the problem.
    Describe the symptoms, any system output, and a fully decoded oops (if there is
    an oops). More importantly, if you can, provide steps to reproduce the problem,
    and a brief description of your hardware.


    Determining who to send the report to is the next step. The MAINTAINERS lists
    the individuals with each driver and subsystem—they should receive any issues
    related to the code they maintain. If you cannot find an interested party, send
    the report to the Linux Kernel Mailing List at linux-Kernel@v.kernel.org. Even
    if you do find a maintainer, copying the kernel mailing list never hurts.


    The files REPORTING-BUGS and Documentation/ops-tracing.txt provide more information.


    # Generating Patches


    All changes to the Linux kernel are distributed in the form of patches, which
    are the output of the GNU diff(1) program in a format that is readable by the
    patch(1) program. The simplest way to generate a patch is to have two source trees,
    one is the vanilla stock and another is the stock tree with simply linux. Then,
    to generate a patch of the two trees (which is what the source tarball extracts
    to, initially) and to name your modified tree


    ```

    diff -uN linux-x-y.z/ linux/ > my-patch

    ```


    from one directory below your trees. This is typically done somewhere in your
    home, and not /usr/src/linux, so you don''t need to be root. The -u flag specifies
    that the unified format should be used. Without this, the patch is not very readable
    by humans. The -r flag specifies to recursively diff all directories, and the
    -N flag specifies that new files in the modified tree should be included in the
    diff. Alternatively, if you need to diff only a single file, you can do'
