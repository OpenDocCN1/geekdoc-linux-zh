    # I/O Scheduler


    Simply sending requests to the block devices in the kernel issues them, as soon
    as it issues them, results in awful performance. One of the slowest operations
    in an entire computer is disk seeks. Each seek—positioning the disk''s head at
    the location of a specific block—takes many millisecondsiseconds. Minimizing seeks
    is absolutely crucial to the performance of the system.


    Therefore, the kernel does not issue I/O requests to the disk in the order they
    are received or as soon as they are received. Instead, it performs operations
    called merging and sorting to greatly improve the performance of the system as
    a whole. The subsystem of the kernel that performs these operations is called
    the I/O scheduler.


    The I/O scheduler divides the resource of disk IO among the pending block I/O
    requests in the system. It does this through the merging and sorting of pending
    requests in the request queue. The I/O scheduler is not to be confused with the
    process scheduler (see Chapter 3, "Scheduling”), which divides the resource of
    the processor among the processes on the system. The two subsystems are related
    but not the same. Both the process scheduler and the I/O scheduler virtualize
    the resource among multiple objects. In the case of the process scheduler, the
    processor is virtualized and shared among the processes on the system. This provides
    the illusion of multitasking and timesharing operating system, such as Unix. On
    the other hand, the I/O scheduler virtualizes block devices among multiple


