  md: 'Reader-writer semaphores, spin locks of the same nature, should not be used
    unless there is a clear separation between writer paths and read paths in your
    code. Using the reader-writer mechanism is also noteworthy if completion naturally
    splits along a reader-writer boundary.


    Knowing how to use a spin lock versus a semaphore is important to writing optimal
    code. In many cases, there is little choice. Only a spin lock can be used in interrupt
    context, where only a semaphore can be held while tasks. Table 8.6 reviews the
    requirements that dictate which lock to use.


    | Table 8.6 What Use: Spin Locks Versus Semaphores |

    | Requirement | Recommended Lock |

    | Low overhead locking | Spin lock is preferred |

    | Short hold time | Spin lock is preferred |

    | Long hold time | Semaphore is preferred |

    | Need to lock from interrupt context | Spin lock is required |

    | Need to sleep while holding lock | Semaphore is required |


    # Completion Variables


    Condition variables are easy to synchronize two tasks in the kernel, when one
    task needs to signal to the other that an event has occurred. One task waits on
    the completion variable while another task performs some work. When the other
    task has completed the work, it uses the completion variable to wake up any waiting
    tasks. It sounds like a semaphore, but...


    Completion variables are represented by the `struct completion` type, which is
    defined in `<linux/completion.h>`. A statically created completion is created
    and initialized via


    ```

    DECLARE_COMPLETION(my_comp);

    ```


    A dynamically created completion variable is initialized via `init_completion()`.


    On a given completion variable, the tasks that want to wait call `wait_for_completion()`.
    After the event has occurred, calling `complete()` signals all waiting tasks to
    wake up. Table 8.7 has a list of the completion variable methods.


    | Table 8.7 Completion Variables Methods |

    | Method | Description |

    | init_completion(struct completion *) | Initializes the given dynamically created
    completion variable |'
