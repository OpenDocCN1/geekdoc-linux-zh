  md: 'A在这 object can also be free, sitting in the slab cache, as discussed in the
    previous chapter. In that case, there is no valid reference to the在这 object in
    any VFS or filesystem cache.


    # # The Dentry Cache


    After the VFS goes through the trouble of resolving each element in a path name
    into a在这 object and arriving at the end of the path, it would be wasteful to throw
    away all that. Instead, the kernel caches dentry objects in the dentry cache,
    or, simply, the `dcache`.


    The dentry cache consists of three parts:


    +   - Lists of“used” dentries that are linked off their associated inode via the
    `i_dentry` field of the inode object. Given a given inode can have multiple links,
    there might be multiple dentry objects; a list is used.

    - A doubly linked“least recently used” list of unused and negative dentry objects.
    The list is insertion by time, such that entries towards the head of the list
    are newest. When the kernel must remove entries to reclaim memory, the entries
    are removed from the tail because those are the oldest and have the least chance
    of being used in the near future.

    - A hash and hashing function used to quickly resolve a given path into the associated
    dentry object.


    The hash table is represented by the `dentry_hashtable`. Each element is a pointer
    to a list of dentries that have the same value. The size of this array depends
    on the amount of RAM in the system.


    The actual hash value is determined by `d_hash()`. This enables filesystems to
    provide a unique hashing function.


    Hash table lookup is performed via `d_lookup()`. If a matching dentry is found
    in the dcache, it is returned. On failure, `NULL` is returned.


    As an example, assume you are editing a source file in your home directory `/home/dracula/src/foo.c`.
    Each time this file is accessed `/home/dracula/src/foo.c`, the VFS must follow
    each dentry to resolve the full path: `/home/dracula/src/foo.c`. To prevent this
    time-consuming operation this time (or any) path name, the VFS can first try to
    lookup the path name in the dentry cache. If the dentry is not in the dcache,
    the VFS must manually resolve it. Once completed, it will add the dentry objects
    to the dcache to speed up any future lookups.


    The dcache also provides the front end to an inode cache, the `icache`. Inode
    objects that are associated with dentry objects are not freed because the dentry
    maintains a positive usage counter over the inode. This enables dentry objects
    to pin inodes in memory. As long as the dentry is cached, the corresponding inodes
    are cached, consequently, when a path name lookup succeeds from cache, as in the
    previous example, the associated inodes are already cached in memory.'
