  md: '# Reader-Writer Semaphores


    Semaphores, like spin locks, also come in a reader-writer flavor. The situations
    where reader-writer semaphores are preferred over standard semaphores are the
    same as reader-writer spin locks versus standard spin locks.


    Reader-writer semaphores are represented by the `struct rw_semaphore` type, which
    is defined in `<linux/rwsem.h>`. Statically declared reader-writer semaphores
    are created


    ```

    static DECLARE_RWSEM(name);

    ```


    where name is the declared name of the new semaphore.


    Reader-writer semaphores that are dynamically created can be initialized by


    ```

    init_rwsem(struct rw_semaphore *sem)

    ```


    All reader-writer semaphores are mutes (that is, their usage count is one). Any
    number of readers can concurrently hold the read lock, so long as there are no
    writers. Conversely, a sole writer (with no readers) can acquire the variant of
    the lock. All reader-writer locks use uninterruptible sleep, so there is only
    one version of each down().`. For example:


    ```

    static DECLARE_RWSEM(mr_rwsem);

    ...

    down_read(4*mr_rwsem);

