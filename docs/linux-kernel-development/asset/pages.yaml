  md: "For the most part, hardware devices require physically contiguous allocations.\
    \ Hardware devices on the other side of the memory management unit and, do not\
    \ understand virtual addresses. Any regions of memory hardware do work with a\
    \ physically contiguous block and not a virtually contiguous one. Blocks of memory\
    \ used by software—for example, process-related buffers—are fine using memory\
    \ that is virtually contiguous. In your programming, you will know the difference.\
    \ All memory refers to the kernel as logically contiguous.\n\nDespite the fact\
    \ that contiguous memory is required in certain cases, most kernel code uses `kmalloc()`\
    \ and not `vmalloc()`. This is because the `vmalloc()` function, to make physically\
    \ contiguous pages in the virtual address space, must specially set up the page\
    \ tables. However, `vmalloc()` can allocate pages that are not necessarily physically\
    \ contiguous, which results in much larger TLB thrashing than using directly physical\
    \ memory. Because of these concerns, `vmalloc()` is used when absolutely necessary—to\
    \ vary large regions of memory. For example, when modules are dynamically inserted\
    \ into the kernel, they are loaded into memory created via `vmalloc()`.\n\nThe\
    \ `vmalloc()` function is declared in `<linux/vmalloc.h>` and defined in `mm/vmalloc.c`.\
    \ Usage is limited to user-space's `malloc()`:\n\n```\nvoid *vmalloc(unsigned\
    \ long size);\n```\n\nThe function returns a pointer to at least `size` bytes\
    \ of virtually contiguous memory. On error, the function returns NULL. The function\
    \ might sleep, and cannot be called from interrupt context or other situations\
    \ where blocking is not permissible.\n\nTo free an allocation obtained via `vmalloc()`,\
    \ use\n\n```\nvoid vfree(void *addr);\n```\n\nThis function frees the block of\
    \ memory adding `addr` that was previously allocated via `vmalloc()`. The function\
    \ can also sleep and, thus, cannot be called from interrupt context. It has no\
    \ return value.\n\nUsage of this function is:\n\n```\nchar *buf;\n = vmalloc(16\
    \ * PAGE_SIZE); /* get 16 pages */\nif (!buf)\n    /* error! failed to allocate\
    \ memory */\n```\n\n> 4 The TLB (translation lookaside buffer) is a hardware buffer\
    \ used by architectures to cache the mapping of virtual addresses to physical\
    \ addresses. This greatly improves the performance of the system, because most\
    \ memory access is done via virtual addressing."
