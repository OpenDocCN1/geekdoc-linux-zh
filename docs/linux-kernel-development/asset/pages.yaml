  md: '# Algorithmic Complexity


    OFTEN, IN COMPUTER SCIENCE AND RELATED DISCIPINES, it is useful to express the
    algorithmic complexity—or scalability—of algorithms as a meaningful value (as
    opposed to descriptive terms, like growth). Various methods for representing scalability
    exist. One common technique is to study the asymptotic behavior of the algorithm.
    This is the behavior of the algorithm as its inputs grow exceedingly large or
    approach infinity. Asymptotic behavior shows how well an algorithm scales as its
    inputs grow larger and larger. Studying an algorithm''s scalability—how it performs
    as the size of its input increases—enables us to model the algorithm against a
    benchmark and better understand its behavior.


    # Algorithms


    An algorithm is a series of instructions, possibly one or more inputs, and ultimately
    a result or output. For example, the steps to count the number of people in the
    room are algorithms, with the people being the input and the count being the output.
    In the Linux kernel, both page eviction and the process scheduler are examples
    of algorithms. Mathematically, an algorithm is like a function (or at least, we
    model it as one). For example, if we call the people counting algorithm $f$ and
    the number of people to count $x$, we can write:


    $y = f(x)$ people counting function


    Where $y$ is the time required to count the $x$ people:


    # Big-O Notation


    One useful asymptotic notation is the upper bound—a function whose behavior is
    always greater than the one we are studying. It is said that the upper bound grows
    faster than the function in question. A special notation, big-o (pronounced big
    oh) notation, is used to describe this growth. It is written $f(x)$ is $O(g(x))$
    and is read $f$ is big-oh of $g$. The formal mathematical definition is'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'If f(x) is O(g(x)), then

    ∃, x'' such that f(x) ≤ cg(x), ∀ x > x''


    In the English, to compare f(x) is always less than to compare g(x) multiplied
    by some arbitrary constant (at, it is less as the input x is

    larger than some value x''.


    Essentially, we are looking for a function whose behavior is as bad or worse than
    our algorithm. We can then look at the result of very large inputs to the function

    and obtain an understanding of the bound of our algorithm.


    # Big Theta Notation


    When people talk about big-oh notation they are more accurately referring to what
    Donald Knuth describes as big-theta notation. Technically, big-oh notation

    refs to an upper bound. For example, seven is an upper bound of six; so are 9,
    12, and 65. Subsequently, when people discuss function growth they talk about

    t least upper bound, or a function that models both the upper and lower bounds¹.
    Professor Knuth describes this big-theta notation and gives the following

    definitions:


    ```

    f(x) is big-theta of g(x), then

    g(x) is both an upper bound and a

    lower bound for f(x).

    ```


    Then, we can say f(x) is of order g(x). The order, or big-theta, of an algorithm
    is one of the most important mathematical tools for understanding algorithms

    in the kernel.


    Consequently, when people refer to big-oh notation they are more often talking
    about the least big-o, the big-theta. You really do not have to worry about this,

    unless you want to make Professor Knuth really happy.


    # Putting It All Together


    For example, consider again having to count the number of people in a room. Pretend
    you can count one per second. Then, if there are seven people in the

    room, it will take seven seconds to count them. Obviously, given: people will
    take n seconds to count everyone. Thus, we can say this algorithm is O(n). What
    if the

    task was to dance in front of everyone in the room? Because it would take the
    same amount of time to dance whether there were five or thousand people in the

    room, this task is O(1). See Table D.1 for other common complexities.


    > If curious, the lower bound is modeled by big-omega notation. The definition
    is as big-o, except g(x) is always less than or equal to f(x).'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Table D.1 Table of Time Complexity Values


    | O(g(x)) | Name |

    |---|---|n| 1 | constant (perfect scalability) |

    | log n | logarithmic |

    | n | linear |

    | n^2 | quadratic |

    | n^3 | cubic |

    | 2^n | exponential (evil) |

    | n! | factorial (pure evil) |


    What is the complexity of introducing everyone in the room to everyone else? What
    is a possible function that models this algorithm? If it took thirty seconds to
    introduce each person, how long would it take to introduce 10 people to each other?
    What about one hundred people to each other?


    # Perils of Time Complexity


    Obviously, it is wise to avoid complexities as O(n!) or O(n!). Likewise, it is
    usually an improvement to replace an O(n) with a functionally-equivalent O(1)
    algorithm. This is not the case, however, and a blind assumption should not be
    based solely on big-o notation. Recall that, given O(g(x)), there is a constant,
    c, multiplied by g(x). Therefore, it is possible an O(1) algorithm takes three
    hours to complete. Sure, it is always three hours, regardless of how large the
    input, but that can still be a long time compared to an O(n) algorithm with few
    inputs. The typical input size should always be taken into account when comparing
    algorithms. Do not optimize blindly for some random case!'
  merge: -1
