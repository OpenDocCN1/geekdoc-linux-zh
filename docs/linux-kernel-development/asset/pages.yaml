    # Processor Ordering


    Recall from Chapter 8, "Kernel Synchronization Methods," that architectures have
    varying degrees of processor ordering. Some have very strict ordering constraints
    where all loads and stores occur in the order prescribed by the code. Other chips
    have weak ordering and loads and stores are reordered as the processor sees fit.


    In your code, if you depend on data ordering, ensure the weakest ordered processor
    commits your load and stores in the right order by using the appropriate barriers,
    such as rmb() and wmb(). . Chapter 8, "Kernel Synchronization Methods," has more
    information.


    # SMP, Kernel Preemption, and High Memory


    It might seem incorrect to include symmetrical multiprocessing, kernel preemption,
    and high memory in a discussion of portability. After all, these are not machine'
  merge: -1
