  md: '# Kernel Synchronization Introduction


    IN A SHARED MEMORY APPLICATION, care must be taken to ensure that shared resources
    are protected from concurrent access. The kernel is no exception. Shared resources
    require protection from concurrent access because if multiple threads access it
    at the same time, the threads may overwrite each other''s changes or access data
    while it is in an inconsistent state. Concurrent access of shared data is a recipe
    for instability that often proves very hard to track down and debug—getting it
    right off the bat is important.


    Properly protecting shared resources can be tough. Years ago, before Linux supported
    symmetrical multiprocessing, preventing concurrent access of data was simple.
    Because only a single processor was supported, the only way data could have been
    accessed concurrently was if an interrupt occurred or if kernel explicitly rescheduled
    and allowed another task to run. Back then, life was simple.


    Those days are over. Symmetrical multiprocessing support was introduced in the
    2.0 kernel and has been continually enhanced since. Multiprocessing support implies
    that kernel code can simultaneously run on two or more processors. Consequently,
    without protection, code in the kernel, running on two processors, can simultaneously
    access shared data at exactly the same time. With the introduction of the 2.6
    kernel, the Linux kernel is preemptive. This implies that (again, in the absence
    of preemption) the scheduler can preempt kernel code at virtually any point, reschedule
    another task. Today, a number of scenarios allow for concurrency inside the kernel
    and they all require protection.


    > The term threads of execution implies any instance of executing code. For example,
    a task in the kernel, an interrupt handler, or a kernel thread. This chapter may
    shorten threads of execution to simply threads. Keep in mind that this term describes
    any executing code.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'This chapter discusses the issues of concurrency and synchronization, as they
    exist in an operating system kernel. The next chapter details the mechanisms and
    interfaces that handle these synchronization issues and prevent race conditions.


    # Critical Regions and Race Conditions


    Code paths that access and manipulate shared data are called critical regions.
    To prevent concurrent access during critical regions, the programmer (that you)
    must ensure that the code executes atomically—that is, the code completes without
    interruption if the entire critical region were indivisible. It is a bug if for
    two threads of execution to be simultaneously in the same critical region. When
    this actually occurs, we call it a race condition (named because the threads race
    to get it). Note how rare this could be hard to debug because they are not easily
    reproducible. Ensuring concurrency is prevented and that race conditions do not
    occur is called synchronization.


    To best identify race conditions, let''s look at just how ubiquitous critical
    regions are. For a first example, consider a very simple shared resource, a single
    global integer, and a very simple critical region, the operation of incrementing
    it:


    ```

    i++;

    ```


    This might translate into instructions to the computer''s processor that resemble:


    ```

    get the current value of i and copy it into a register

    add one to the value stored in the register

    write back to memory the new value of i

    ```


    Now, assume there are two threads of execution, both enter this critical region,
    and the initial value of i is seven. The desired outcome is similar to (each row
    represents a unit of time):


    | Thread 1 | Thread 2 |

    | --- | --- |

    | get i (7) | get i (8) |

    | - | - |

    | increment i (7 -> 8) | increment i (8 -> 9) |

    | write back i (8) | write back i (9) |'
  merge: -1
