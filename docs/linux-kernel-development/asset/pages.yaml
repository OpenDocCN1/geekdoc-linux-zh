  md: 'An operations object is contained within each of these primary objects. These
    objects describe the methods that the kernel invokes as primary objects.

    Specifically, we have:


    +   * The `super_operations` object, which contains the methods the kernel can
    invoke on a specific filesystem, as `read_inode()` and `sync_fs().

    * The `inode_operations` object, which contains the methods the kernel can invoke
    on a specific file, such as `create()` and `link().

    * The `dentry_operations` object, which contains the methods the kernel can invoke
    on a specific directory entry, such as `d_compare()` and `d_delete().

    * The `file` object, which contains the methods a process can invoke on one file,
    such as `read()` and `write().


    The operations objects are implemented as a structure of functions that operate
    on the parent object. With many methods, the objects can inherit a generic function
    if basically is sufficient. The specific instance of the particular filesystem
    in the pointers with its own filesystem-specific methods.


    Again, note that we mean structures—not explicit data types, such as those in
    C++ or Java. These structures, represent specific instances of an object, their
    associated data, and to operate on themselves. They are very much objects.


    # Other VFS Objects


    The VFS loves structures, and it is composed of a couple nature from the primary
    objects previously discussed. Each registered filesystem is represented by a `file_system_type`
    structure. This object describes the filesystem and its capabilities. Furthermore,
    each mount point is represented by the `vfsmount` structure. This structure contains
    information about the mount point, as its location and mount flags.


    Finally, three per-process structures describe the filesystem and files associated
    with a process. They are the `file_struct`, `fs_struct`, and `namespace` structures.


    The rest of this chapter concentrates on discussing these objects and the role
    they play in implementing the VFS layer.


    # The Superblock Object


    The superblock object is implemented by each filesystem, and is used to store
    information describing that specific filesystem. This object usually corresponds
    to the filesystem superblock or the filesystem control block, which is stored
    in a special sector on disk (hence the object''s name). Filesystems that are not
    disk-based (a virtual memory-based filesystem, such as `sysfs`, for example) generate
    the superblock on the fly and store it in memory.


    The superblock object is represented by `struct super_block` and defined in `<linux/fs.h>`.
    Here is what it looks like, with comments describing each.'
