    negative, the task waits on a queue and the processor moves on to something else.
    The function down() allows you to acquire a semaphore it. The up() method is used
    to release a semaphore upon completion of a critical region. This is called when
    one of the waiting tasks is awakened and allowed to acquire the semaphore.


