  md: '# Internal Representation of jiffies


    The actual representation of **jiffies** is strange. For 2.6, the variable type
    changed from an *unsigned long* to a u64. In other words, it is an unsigned 64-bit
    integer, even on 32-bit machines. The declaration for the full 64-bit count is
    in `<linux/jiffies.h>`:


    ```

    extern u64 jiffies_64;

    ```


    A 32-bit **jiffies** value, with a ticker counting 100 times per second, will
    overflow after 497 days, which is perfectly reasonable. HZ to 1000, however, will
    bring the overflow down to 49.7 days. Conversely, a 64-bit value will not overflow
    in anyone''s lifetime. In the next section, we will look at the potential problems
    with overflow (which undesirable, overflow count is a normal and expected occurrence).


    The transition from a 32-bit to a 64-bit value would normally require care. The
    kernel developers applied some smart thinking, however. Because existing code
    references the **jiffies** variable and most code only cares about the lower 32-bits,
    the original **jiffies** variable is still used. Using some magic linker scripts,
    the **jiffies** variable is overloaded onto the new **jiffies_64** variable. *Figure
    9.1* shows the layout of **jiffies** versus **jiffies_64**.


    ![](img/10f4d9a57f7d19944d26b746133440df_173_0.png)


    **Figure 9.1** Layout of **jiffies** versus **jiffies_64.**


    Code that accesses **jiffies** simply reads the lower 32-bits of **jiffies_64**.
    The function `get_jiffies_64()` can be used to read the full 64-bit value⁵. Such
    a need is rare, consequently, most code simply continues to read the lower 32-bits
    directly via the **jiffies** variable.


    > ⁵ A special function is needed because 32-bit architectures cannot atomically
    access both 32-words in a 64-bit value. The special function locks the jiffies
    count via the `xtime_lock` before reading.'
