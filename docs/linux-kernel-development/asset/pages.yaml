    is little-endian), the macro does nothing; they return the converted value.


    # # Time


    Never assume the frequency of the timer interrupt and the number of jiffies per
    second. Instead, always use HZ to scale your units correctly. This is very important
    because not only can the timer frequency differ among the various architectures,
    but it can also change on a given architecture from one kernel release to the
    next..


    For example, HZ is 1000 on the x86 platforms. That is, the timer interrupt occurs
    1000 times per second, or every millisecond. Before 2.6, however HZ was 100 on
    x86. On other architectures, the values differ: Alpha has HZ equal to 1024 and
    ARM has it equal to 100.


    Never compare jiffies to a number such as 1000 and assume that means the same
    thing. To scale appropriately, multiply or divide by HZ. For example:


    ```

    HZ                  /* one second */

    (2*HZ)               /* two seconds */

    (HZ/2)              /* half a second */

    (HZ/100)             /* 10 ms */

    (2*HZ/100)           /* 20 ms */

    ```


    HZ is defined in <asm/param.h>. This is discussed further in Chapter 9, "Timers
    and Time Management."


    # # Page Size


    When working with memory never assume the page size. It is a common mistake for6
    programmers to assume the page size is 4KB. Although this is true on x86 machines,
    other architectures have different page sizes. Some architectures support multiple
    page sizes, in fact! Table 16.4 lists each architecture''s valid page size(s).


    When working with pages of memory, use PAGE_SIZE as the size of a page, in bytes.
    value PAGE_SHIFT is the number of bits to shift an address to get its page'
