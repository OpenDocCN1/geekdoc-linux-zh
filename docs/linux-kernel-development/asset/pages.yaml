    Nonetheless, scalability is an important consideration. Designing your locking
    from the beginning to finish is well important. Coarse locking of major resources
    can easily become a bottleneck on small machines. There is a thin line between
    too coarse locking and too fine locking. Too coarse of locking results in poor
    scalability whereas too fine locking results in overhead if there is little lock
    contention. Both scenarios equate to performance. Start simple and grow in complexity
    only as needed. Simplicity is key.


    # Locking and Your Code


    Making your code SMP-safe is not something that can be added as an afterthought.
    Proper synchronization—locking that is free of deadlocks, scalable, and clean—requires
    design decisions from start through finish. Whenever you write kernel code, whether
    it is a new system call or a rewritten driver, protecting data from concurrent
    access needs to be a primary concern.


    Provide sufficient protection for every scenario—SMP, kernel preemption, and so
    on—rest assured the data will be safe on any given machine and configuration.
    The next chapter will discuss how to do this.'
