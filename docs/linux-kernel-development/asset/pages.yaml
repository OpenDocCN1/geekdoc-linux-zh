    # Getting Zeroed Pages


    If you need the page filled with zeros, use the function


    ```

    unsigned long get_zered_page(unsigned int gfp_mask)

    ```


    This function works as __get_free_page(), except that the allocated page is then
    filled with zeros. This is useful for user-space, as the random garbage in an
    allocated page is not random—it "randomly" contain sensitive data. All data must
    be zeroed or otherwise cleaned before returning to user-space, to ensure security
    is not compromised. Table 10.2 is a listing of all the low-level page allocation
    methods.


    Table 10.2 Low-Level Page Allocation Methods


    | Flag | Description |

    |---|---|

    | alloc_page(gfp_mask) | Allocate a single page and return a pointer to its page
    structure |

