    # Interrupt Context


    When executing an interrupt handler or bottom half, the kernel is in interrupt
    context. Recall that process context is the mode of operation of the kernel in
    it is executing on behalf of a process - for executing a system call or running
    a kernel thread. In process context, the current macro is points to the associated
    task_struct. If a process is coupled to the kernel context, it can sleep or otherwise
    invoke the scheduler.


    Interrupt context, on the other hand, is not associated with a process. The current
    macro is not relevant (although it points to the interrupted process). Without
    a backing process, interrupt context cannot sleep - how would it reschedule? Therefore,
    you cannot call functions from interrupt context. If a function sleeps, you cannot
    use it from your interrupt handler—this limits the functions you can call from
    an interrupt handler.


    Interrupt context is critical because the interrupt handler interrupted other
    code. Code should be quick and simple. Busy looping is discouraged. This is a
    very important point; always keep in mind that your interrupt handler interrupted
    other code (possibly even another interrupt handler on a different line!). Because
    of its asynchronous nature, it is imperative that all interrupt handlers are as
    quick and as simple as possible. As much as possible, work should be pushed out
    from the interrupt handler and performed in a bottom half, which runs at a more
    convenient time.


    Finally, the interrupt handler does not receive its own stack. Instead, it shares
    the kernel stack of the process interrupted. If no process is running, it uses
    the idle task''s stack. Because interrupt handlers share the stack, they must
    be frugal with what they allocate there. Of course, the kernel stack is limited
    with, so all kernel code should be cautious.


