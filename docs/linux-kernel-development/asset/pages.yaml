    to go through the cache. Consequently, the kernel attempts to satisfy all reads
    from the page cache. If this fails, the page is read from disk and added to the
    page cache. For write operations, the page cache acts as a staging area for the
    writes. Otherwise, written pages are added to the page cache.


    # Radix Tree


    Because the kernel must check for the existence of a page in the page cache before
    initiating any page IO, such a check must be quick. The overhead of searching
    and checking the page cache could nullify any benefits the cache might provide
    (at least if the cache hit is low—the overhead would have to be awful to cancel
    the benefit of retrieving the data from memory in loss of disk).


    As we saw in the previous section, the page cache is searched via the address_space
    object plus an offset value. Each address_space has a unique radix tree stored
    as page_tree. The radix tree allows quick searching for the page, given only the
    file offset. Page cache searching functions such as find_get_page() call radix_tree_lookup(),
    which performs a search on the tree for the given object.


    The radix tree code is available in generic form in lib/radix-tree.c. Users of
    the radix tree need to include <radix-tree.h>.


    # The Old Page Hash Table


    For the 2.6 kernel, the page cache was not searched via radix tree. Instead, a
    global hash was maintained over all the pages in the system. The hash returned
    a doubly linked list of entries, which hash to the same given value. If the desired
    page was in the cache, one of the items in the list was the corresponding page.
    Otherwise, the page was not in the cache and the hash function returned NULL.


    The global hash had four problems:


    +   * A single global lock protected the hash. Lock contention was quite high
    on even moderately sized machines, and performance suffered as a result.

    * The hash was larger than needed because it contained all of the pages in the
    page cache, whereas only pages pertaining to the current file were relevant.'
