    # No global cli()


    The kernel provides a method to disable interrupts on all processors in the system.
    Furthermore, if another processor called this method, it would have to wait until
    interrupts were enabled before continuing. This function was named cli() and the
    enabling call was named sti()—very x86 centric. These interfaces were removed
    during 2.5, and consequently all interrupt synchronization now use a combination
    of local interrupt control and spin locks (discussed in Chapter 8, "Kernel Synchronization
    Methods"). This means that code that previously only had to disable interrupts
    globally to ensure exclusive access to shared data needs to do a bit more work.


    Previously, driver writers could disable a cli() used in their interrupt handler
    anywhere else the shared data was accessed would provide mutual exclusion. The
    cli() would ensure that no other interrupt handlers (and thus their specific handler)
    would run. Furthermore, if another processor entered a cli() protected region,
    it would not continue until the original processor exited their cli() protected
    region and sti().


    Removing the global cli() has a bunch of advantages. First, it forces driver writers
    to implement real locking. A fine-grained lock with a specific purpose is faster
    than a global lock, which is effectively what cli() is. Second, it streamlined
    a lot of code and removed a bunch more. The resulting system is simpler to comprehend.


    # Disabling a Specific Interrupt Line


    In the previous section, we looked at functions that disable all interrupt deliver
    for an entire process. In some cases, it is useful to disable only a specific
    interrupt line for the entire state. This is called masking out an interrupt line.
    As an example, you might want to disable enabling of a device''s interrupts by
    manipulating its state.


    ```

    void disable_irq_unsigned(unsigned int irq);

    void disable_irq_nosync(unsigned int irq);

    ```'
