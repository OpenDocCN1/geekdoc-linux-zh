    \ do not even need the concept of a first and last node. If a linked list simply\
    \ contains a collection of unordered data, any element can be the head element.\
    \ To traverse the list, simply pick an element and follow the pointers until you\
    \ get back to the original element. This removes the need for a special head pointer.\
    \ Additionally, the routines for manipulating linked lists are simplified. Each\
    \ routine simply needs a pointer to a single element in the list—any element.\
    \ The kernel hackers are particularly proud of this implementation.\n\nLinked\
    \ lists in the kernel, as with any complex graph, are common. For example, the\
    \ kernel uses a linked list to store the task list (each process's `task_struct`\
    \ is an element in the linked list).\n\n# # The Linked-List Structure\n\nIn the\
    \ old days, there were multiple implementations of linked lists in the kernel.\
    \ A single, powerful linked list implementation was needed to remove duplicate\
    \ code. During the 2.1 kernel development series, the official kernel linked-list\
