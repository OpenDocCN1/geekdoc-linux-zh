    # # Jiffies Wraparound


    The jiffies variable, like any C integer, experiences overflow when its value
    is exceeded its maximum storage limit. For a 32-bit unsigned integer, the maximum
    value is 2^32 - 1. Thus, 4294967295 ticks can occur before the tick count overflows.
    When the tick count is equal to this maximum and is incremented, it wraps around
    to zero.


    Let''s look at an example of wraparound:


    ```

    unsigned long timeout = jiffies + /* timeout in 0.5s */

    /* do some work, then see if we took too long ... */

    if (timeout < jiffies)

    { /* we did not time out, good ... */

    }

    else

    { /* we timed out, error ... */

    n

    ```


    The intention of this code is to set a timeout for some time in the future—for
    one half second from now, to be precise. The code then proceeds to perform some
    work, potentially causing overflow issues and waiting for a response. When, if
    the whole order takes longer than the timeout, the code handles the error appropriately.


    Multiple overflow issues are here, but let''s study one of them: what happens
    if jiffies wrapped back to zero after setting timeout. Then, the first conditional
    number—larger than timeout—becomes larger. Because it overflowed its maximum value,
    however, it is now a very small value—perhaps only a handful of ticks over zero.
    Because of the wraparound, the result of the statement is swapped Who!


    ```

    Thankfully, the kernel provides macros for comparing tick counts that correctly
    handle wraparound in the tick count. They are in <linux/jiffies.h>:

    #define time_after(unknown, known) ((long)(unknown) - (long)(known) < 0)

    #define time_before(unknown, known) ((long)(known) - (long)(unknown) < 0)

    #define time_after_eq(unknown, known) ((long)(unknown) - (long)(known) >= 0)

    #define time_before_eq(unknown, known) ((long)(known) - (long)(unknown) >= 0)

    ```


    The unknown parameter is typically jiffies and the known parameter is the value
    you want to compare against.


    The time_after(unknown, known) macro returns true if unknown is after time known;otherwise,
    it returns false. The time_before(unknown, known) macro returns true if unknown
    is before time known;otherwise, it returns false. The final two macros perform
    identically to the first, except they return true if the parameters are equal.'
