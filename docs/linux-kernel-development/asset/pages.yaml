  md: '# About the Author


    Robert Love has used Linux since the early days and is active in the open source
    community. Currently, he is employed as a software engineer at MontaVista Software,
    where he hacks on the Linux kernel.


    His kernel projects include the process scheduler, the preemptive kernel, the
    VM, and multiprocessing enhancements. His other open source projects include schedutils
    and procps, both of which he maintains. He has given several talks on the kernel
    and he is a Contributing Editor for Linux Journal. He currently lives in Gainesville;
    Florida and enjoys photography and good food.'
  merge: -1
