    # The Ideal BZ Value


    The i386 architecture, since the initial version of Linux, has a timer interrupt
    frequency of 100 Hz. During the 2.5 development series, the frequency was raised
    to 1000 Hz and (as things) were controversial. Because so much of the system is
    dependent on the timer interrupt, changing its frequency has a reasonable impact
    on the system. Of course, there are costs to larger versus smaller HZ values.


    Increasing the tick rate means the timer interrupt runs more frequently.


    Consequently, the work performs more often. This has the following benefits:


    +   - The timer interrupt has a tick rate

    - The accuracy of timed events improve.


    The resolution increases by the factor that the tick rate increases. For example,
    the granularity of timers with HZ=100 is 10 milliseconds. In other words, all
    periodic events occur on the timer interrupts 10 millisecond boundary and no free
    *precision* is guaranteed. With HZ=1000, resolution is 1 millisecond—10x faster.
    Although kernel code can create timers with 1 millisecond resolution, there is
    no guarantee the precision with HZ=100 is sufficient to execute the time on anything
    better than 100 millisecond intervals.


    Likewise, accuracy improves in the same manner. The average timer is off by half
    the period of the timer interrupt misses might expire at any time, but are only
    executed on occurrences of the timer interrupt. For example, with HZ=100, the
    average event occurs +/- 5 millisecond off the desired time, on average. With
    HZ=1000, the average error drops to 0.5 millisecond—a 10% improvement.


    This higher resolution and greater accuracy provides multiple advantages:


    +   - Kernel timers execute with higher resolution and increased accuracy (this
    provides a large number of improvements, one of which is the following).

    - System calls, such as `poll()` and `select()`, which optionally employ a timeout
    value, execute with improved precision.


    Use precision here in the computer sense, not the scientific. Precision in science
    is a statistical measurement of repeatability. In computers, precision is the
    number of significant figures used to represent a value.'
