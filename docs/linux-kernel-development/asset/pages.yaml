  md: 'stack is 8KB. On most 64-bit architectures, the stack is 8KB. This is primarily
    for efficiency reasons. By giving each process a small, fixed kernel stack, memory
    consumption is not burdened with stack management.


    Each process receives its own kernel stack. The entire chain of a process executing
    inside the kernel must be capable of fitting on the stack. Interrupt handlers
    also use the stack of the process. This means that, at worst, the 8KB kernel stack
    needs to be shared by a maximum of a function- deep call and a couple of interrupt
    handlers. unbounded recursion is costly!


    In any given function, you must keep stack usage to a minimum. There is no hard
    and fast rule, but you should keep the sum of all local variables (also known
    as automatic variables or variables on the stack) in a particular function to
    a maximum of a hundred bytes. Performing a large static allocation on the stack,
    such as a large array or structure, is dangerous. Otherwise, stack overflows performed
    in the kernel just as in user-space. Stack overflows occur silently and unnoticed,
    corrupting the memory which exists at the tail end of the stack. First, this is
    the thread_info structure (recall from Chapter 2 that this structure is allocated
    at the end of each process''s kernel stack). By doing any, the kernel stack data
    might hurt. At best, the machine will crash when the stack overflows. At worst,
    the overflow will silently corrupt the kernel.


    Therefore, it is wise to use a dynamic allocation scheme, such as one of those
    discussed earlier in this chapter for any large allocations.


    # High Memory M


    By definition, pages high might not be permanently mapped into the kernel''s address
    space. Thus, pages obtained via alloc_pages() with ___HIGMEM flag may not have
    a logical address.


    On the x86 architecture, all physical memory beyond the 896MB mark is high memory
    and is not permanently or automatically mapped into the kernel''s address space,
    despite x86 processors being capable of physically addressing up to 4GB (64GB
    with PAE6) of physical RAM. Once allocated, these pages must be mapped into the
    kernel''s address space. On x86, pages in high memory are mapped somewhere between
    the 3 and 4GB mark.


    # Permanent Mappings


    To map a given page structure into the kernel''s address space, use


    ```

    void *knap(struct page *page)

    ```


    6PAE stands for Physical Address Extension. It is a feature of x86 processors
    that allow them to physically address 36-bits (64GB) of memory, despite having
    only a 32-bit virtual address space.'
