    # Excuse Me?


    The relationship between the different structures is admittedly bit convoluted.
    Figure 6.1 provides a graphical example, which should bring it all together.


    At the highest level, there are worker threads. There can be multiple types of
    worker threads. There is one worker thread per processor of a given type. Parts
    of the kernel can create worker threads needed. By default, there is the `events`
    worker thread. Each worker thread is represented by the `cpu_workqueue_struct`.
    Each `workqueue_struct` corresponds to one worker thread.


    For example, let''s assume that in addition to the generic `events` worker type,
    I also create a `falcon` worker type. Also, I have a four-processor computer.
    Then, there are four `events` threads (and thus four `cpu_workqueue_struct` structures)
    and four `falcon` threads (and thus four `cpu_workqueue_struct` structures). There
    is one `workqueue_struct` for the `events` type and for the `falcon` type.


    At the lowest level, there is work. Your driver creates work, which it wants to
    defer later. The `work_struct` represents this work. Among other things, this
    structure contains a pointer to a function that will handle the deferred work.
    The work is submitted to a `specific` worker thread. The worker thread wakes up
    and performs the queued work.


    Most drivers use the existing default worker threads, named `events`. They are
    easy and simple. Some more serious situations, demand their own owner worker threads.
    The XFS file system, for example, creates two types of worker threads.


