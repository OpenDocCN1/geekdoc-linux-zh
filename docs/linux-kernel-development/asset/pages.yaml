    # # Byte Order


    Byte order is the order of bytes within a word. Processors can either number bytes
    in a word such that the least significant bit is the first (left-most) or last
    (right-most) in the value. The byte ordering is called big-endian if the most
    significant byte is encoded first with the most bytes decreasing in significance.
    The byte ordering is called little-endian if the least significant byte is encoded
    first with the bytes growing in significance.


    Do not assume any byte ordering when writing kernel code (unless you are writing
    code for a specific architecture, of course). The Linux kernel supports machines
    of both byte orders—including machines that can select from either order upon—and
    generic code must be compatible with either.


    Figure 16.1 is an example of a big-endian byte ordering. Figure 16.2 is an example
    of a little-endian byte ordering.


    ![](img/10f4d9a57f7d19944d26b746133440df_302_0.png)


    **Figure 16.1** Big-endian byte ordering.


    The i386 architecture is little-endian. Most other architectures are big-endian.


    Let''s look at what this encoding means in practice. Consider the number 1027,
    stored as a four-byte integer in binary:


    ```

    00000000 00000000 00000100 00000011

    ```


    The internal storage in memory is different on big- versus little-endian, as shown
    in Table 16.3.'
