  md: '# Kernel Random Number Generator


    THE KERNEL IMPLEMENTS A STRONG RANDOM NUMBER GENERATOR that is theoretically capable
    of generating true random numbers. The random-number generator gathers environmental
    noise from device drivers into an entropy pool. The pool is accessible from within
    the kernel and from user processes as a source of data that is not only random
    but also non-deterministic to an outside attacker. Such numbers are of use in
    various applications, most notably cryptography.


    True random numbers differ from the pseudo-random numbers generated by functions
    such as those in the C library. Pseudo random numbers are created by a deterministic
    function. Although the function might generate some properties of a true random
    number, they are only statistically random. Pseudo random numbers are deterministic—knowing
    one number in the sequence provides information about the rest of the sequence.
    In fact, knowing the initial value of the sequence (known as the seed) usually
    determines the entire sequence. For applications that need truly random and nondeterministic
    numbers, such as cryptography, a pseudo-random number is usually unacceptable.


    As opposed to a pseudo-random number, a true random is produced independently
    of generating function. Furthermore, knowing some value in a sequence of truly
    random numbers does not allow an external party to deduce future values from the
    generator—the generator is deterministic.


    From physics, entropy is a measurement of disorder and randomness in a system.
    Entropy is measured in energy-per-unit (Joules/Kelvin). When Claude Shannon, the
    founder of information theory, looked for a term to represent randomness


    > ¹ Claude E. Shannon (April 30, 1916—February 24, 2001) was an engineer at Bell
    Labs whose most famous work, A Mathematical Theory of Communication, published
    in 1948, introduced the concept of information theory and Shannon entropy. Shannon
    also enjoyed riding his tricycle.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Page 304


    Shannon agreed, and today the term is sometimes called Shannon entropy. In insight,
    no one really understood what meant anyhow. However, some scientists find the
    dual calling so confusing, and simply prefer the term uncertainty when discussing
    information. Kernel hackers, on the other hand, think entropy sounds cool and
    encourage its use.


    In discussions of random-number generators, Shannon entropy is an important property.
    It is measured in bits per symbol; high entropy implies there is useful information
    (but lots of random) in a sequence of characters. The kernel maintains a pool
    that is fed from nondeterministic device events. To help users estimate the entropy
    in the pool, the kernel provides a measurement of the uncertainty of the data
    in the pool. The kernel feeds into the pool, the amount of random data is added.
    Furthermore, the kernel updates the estimate of entropy as data is removed from
    the pool. This measurement is called the entropy estimate. Optionally, the kernel
    can refine a request for a random number if the entropy estimate is zero.


    The kernel random-number generator was introduced in kernel version 1.330 and
    lives at drivers/char/random.c in the kernel source.


    # # Design and Implementation


    Computers are predictable devices. Indeed, it is hard to find randomness in whose
    behavior entirely programmed. The environment of the machine, however, is full
    of noise that is accessible and nondeterministic. Such sources include the movement
    of the mouse, the timing of various devices and user interaction with the computer.
    For example, between key presses, the movement of the mouse, between interrupts,
    and the time taken to complete a block I/O request are all random and not measurable
    by an outside attacker. Randomness from these values is taken and fed into the
    entropy pool. The pool grows to a certain limit, after which the amount of entropy
    is calculated and a tally is kept. This enables the kernel to keep track of the
    entropy in the pool. Figure C.1 is a diagram of the flow of entropy into and out
    of the pool.


    The kernel provides a set of interfaces to access the entropy pool, both from
    within the kernel and from user-space processes. When the interfaces are accessed,
    the kernel takes the SHA of the pool. SHA (Secure Hash Algorithm) is a measure


    > ² John von Neumann (December 28, 1903—February 8, 1957) was a member of the
    Institute for Advanced Study at Princeton. In his life, he gave the world numerous
    contributions to mathematics, economics, and computer science. Some of his most
    important contributions were game theory, the Neumann bottleneck.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'digest algorithm developed by the National Security Agency and a United States
    Federal standard by NIST (via FIPS 186). A digest that takes a variable-input
    (small or large) and produces a fixed-size hash (typically 128 or 160-bits) is
    a digest of the original. From the hash value, the input cannot be reconstructed.
    Furthermore, trivial manipulations to the input (for example, changing one character)
    result in a radically different hash value can have severe consequences, such
    as collisions. Other digest algorithms include MD5 and SHA. The SHA hash, not
    the contents of the pool, is returned to the user--the entries of the entropy
    pool are directly accessible. It is assumed to deny any information about the
    state of the pool from the SHA hash. Therefore, knowing some values from the pool
    does not lend any knowledge to past or future values. Nevertheless, the kernel
    can use the entropy estimate to refuse data if the pool has zero entropy. As entropy
    is read from the pool, the entropy estimate is decreased in response to how much
    information is known about the pool.


    ![](img/10f4d9a57f7d19944d26b746133440df_331_0.png)


    # Figure C.1 The flow of entropy into and out of the kernel entropy pool:


    When the estimate reaches zero, the kernel can still return random numbers. Theoretically,
    however, an attacker is capable of inferring future output given prior output.
    This requires that the attacker have nearly all the prior outputs from the entropy
    pool, and that the attacker successfully perform cryptanalysis on SHA. Because
    SHA is believed to be secure, this possibility is infeasible. To high security
    users who accept no risk, however, the entropy estimate ensures the strength of
    the random numbers. To the vast majority of users this assurance is not needed.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Why is this in the kernel?


    A criterion for a kernel feature in Linux is that they cannot also be easily implemented
    in user space. Tying things in the kernel because we is not acceptable. At first
    glance, a random-number generator and entropy pool need access to systems timings,
    such as interrupts and user input. But all they require live in the kernel. First,
    it is not possible for user space to access timings without forcing the kernel
    to various interfaces and to notify user of these events. If the data were exported,
    it would be nothing better than free. Second, the random-number generator must
    be secure. Because the system could run as root without various security measures,
    the kernel provides a much safer environment. Ultimately, the entropy pool makes
    use of the random data. It is neither practical nor for the kernel to have the
    obtain values from a user space agent. Therefore, the random-number generator
    lives in the kernel.


    # The Dilemma of System Startup


    When the kernel first boots, it completes a series of actions that are almost
    entirely predictable. Consequently, an attacker can infer much about the state
    of the entropy pool at boot. Where each boot is largely to the same contents on
    each boot. This reduces the accuracy of the entropy estimate, which has no way
    of knowing the entropy contributed during the boot sequence is less predictable
    than other times.


    To offset this problem, Linux systems save some information from the entropy pool
    across shutdowns. They do this by saving the contents of the entropy pool on each
    shutdown. When the system boots, the data is read and fed into the entropy pool.
    This effectively loads the previous contents of the pool into the current pool,
    without increasing entropy.


    Therefore, an attacker cannot predict the state of the entropy pool without knowing
    both the current state of the system and the previous state of the system.


    # Interfaces to Input Entropy


    The kernel exports a family of interfaces to facilitate feeding data into the
    entropy pool that are called by the appropriate kernel subsystems or drivers.
    They are


    ```

    void add_interrupt_randomness(int irq)

    void add_keyboard_randomness(unsigned char scancode)

    void add_mouse_randomness(u32 mouse_data)

    ```


    add_interrupt_randomness() is called by the interrupt whenever an interrupt is
    received whose handler was registered with SA_SAMPLE_RANDOM. The parameter irq
    is the interrupt number. The random-number generator uses the timing between interrupts
    as a source of noise. Note, not all devices are suitable for this; if the device
    generates interrupts deterministically (for example, the timer interrupt) or might
    be influenced by an outside attacker (for example, a network device) it should
    not feed the pool. An acceptable device is a hard disk, which generates interrupts
    at an unpredictable rate.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'randomness() uses the scancode and the timing between successive key presses
    to feed the pool. Interestingly, the entropy is smart enough to autoreturn (when
    the user hits a key down) both the scancode and timing interval are then, contributing
    little to entropy. The sole parameter is the scancode of the pressed key.


    ```

    mouse_randomness() uses the mouse position as the timing between interrupts to
    feed the pool. The parameter mouse_data is the hardware-reported position of the
    mouse.

    ```


    All of these routines added the data to the entropy pool, calculate an estimate
    of the entropy given, and increment the entropy estimate by amount.


    All these exports use the internal function timer_randomness() to feed the pool.
    The function calculates the timing between successive events of the same type
    and adds the delay to the pool. For example, the timing between two distinct interrupts
    is largely random—especially when measured precisely. The lower bits are electrical.
    After this feeds the pool, it calculates how much randomness was present in the
    data. It does this by calculating first, second, and third order deltas from the
    previous timing, along with the first and second order deltas. The greatest of
    these deltas, rounded down to 12 bits, is used as the entropy estimate.


    # Interfaces To Output


    The kernel exports one interface for obtaining random data from the kernel:


    ```

    void get_random_bytes(void *buf, int nbytes)

    ```


    This function returns random data in the buffer pointed to by buf. The function
    returns regardless of whether the entropy estimate is zero. This is less of a
    concern to the kernel than user space cryptography applications. The random data
    is suitable for a handful of kernel tasks, most notably networking, where it is
    used to seed the initial TCP sequence number in a connection.


    Kernel code can do the following with a word-size helping of randomness:


    ```

    unsigned long rand;

    get_random_bytes(&rand, sizeof(rand));

    ```


    For user-space processes, the kernel provides two character devices: /dev/random
    and /dev/urandom. The first, /dev/random is suitable when strong random numbers
    are desired, as in high-security cryptographic applications. It only returns up
    to the maximum number of bits of random data noted by the entropy estimate. When
    the entropy estimate reaches zero, /dev/random blocks and will not return the
    remaining data until the entropy estimate is sufficiently positive. Conversely,
    the device /dev/urandom does not have this feature but is generally just as secure.
    Both devices return numbers from the same pool.'
  merge: -1
  pgno: 333
