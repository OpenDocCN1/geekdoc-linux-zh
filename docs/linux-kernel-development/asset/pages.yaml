  md: 'Measurements, as resource usage or the system unit, are recorded with a finer
    resolution.


    +   * Process preemption occurs more accurately.


    Some of the most noticeable performance benefits come from the improved precision
    of `poll()` and `select()` timeouts. The improvement might be quite large; an
    application that makes heavy use of these systems could wait a great deal of time
    waiting for the timer interrupt, when in fact, the timer has actually expired.
    Remember, the error (that is wasted time) is half the period of the timer interrupt.


    Another benefit of a higher tick rate is the accuracy in process preemption, which
    results in decreased scheduling latency. Recall from Chapter 3, that the timer
    interrupt is responsible for decrementing the running process''s timeslice count.
    When the count reaches zero, need_resched is set and the kernel will run the scheduler
    as soon as possible. Now, assume a process is running and has 2 milliseconds of
    time remaining. In 2 milliseconds, the scheduler should preempt the next process
    and begin a new process. This, however, with a lower tick rate, a process that
    might not be in 2 milliseconds could be. In this case, the balance and fairness
    is preserved, because all tasks receive the same amount of scheduling—but that
    is not the case. The problems stem from the latency caused by the delayed preemption.
    Increasing the tick rate to 1000 Hz lowers the worst-case overhead to 1 millisecond,
    and the average-case overhead to just 0.5 milliseconds.


    Now, must we decide to increase the tick rate? It could be 1000 Hz (or even higher).
    Indeed, there is one large trade-off: a higher tick rate implies more interrupts,
    more time the processor spends executing the timer interrupt. This adds up to
    just less processor time available for other work, but also a more frequent periodic
    thrashing of the processor''s cache. The issue of the overhead''s impact is debatable.
    A move from HZ=100 to HZ=1000 brings with it a 10x greater overhead from the timer
    interrupt. However, how substantial is the overhead to begin? Ten times nothing
    is still nothing! The final agreement is that, at least on modern systems, HZ=1000
    does not create unacceptable overhead. Nevertheless, it is possible in 2.6 to
    compile the kernel with a different value for HZ^4.


