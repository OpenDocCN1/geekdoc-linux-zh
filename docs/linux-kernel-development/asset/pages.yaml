- img_proc: true
  md: 'As expected, seven incremented twice is nine. A possible outcome, however is


    # Thread 1


    ```

    get i (7)

    increment i (7 -> 8)

    write back i (8)

    ```


    # Thread 2


    ```

    get i (7)

    increment i (7 -> 8)

    write back i (8)

    ```


    If both threads of execution read the initial value of i before it is incremented,
    both increment and save the same value. As a result, the variable i contains the
    value eight when, in fact, should contain nine. This is one of the simplest examples
    of a critical region. Frankly, the solution is as simple—merely needs a way to
    perform these operations in one indivisible step. Most processors provide an instruction
    to atomically read, increment, and write back a single variable. Using such an
    instruction would alleviate the problem. The kernel provides a set of interfaces
    that we will discuss in the next chapter.


    # Locking


    Now, let''s consider a more complicated race condition that requires a more complicated
    solution. Assume we have a queue of requests that need to be served. How we implement
    the queue is irrelevant, assume it as a linked list, where each node represents
    the queue. One function adds a new request to the tail of the queue. Another function
    removes a request from the head of the queue and does something useful with the
    request. Various parts of the kernel invoke these two functions; requests are
    constantly being added, removed, and serviced.


    Manipulating the request queue certainly requires multiple instructions. If one
    thread attempts to read from the queue while another is in the middle of manipulating
    it, the reading thread will find the queue in an inconsistent state. It should
    be apparent the damage that can occur if access to the queue could occur concurrently.
    Often this causes corruption of data structures.


    The previous scenario, at least, might not have a clear solution. How can we prevent
    reading from the queue while another processor is updating it? Although it is
    feasible for a particular architecture to implement simple instructions, such
    as arithmetic and comparison atomically, it is ludicrous for architectures to
    provide instructions to support the indefinitely sized critical regions like the
    previous example. What is needed is a method of marking where a critical region
    begins and ends and preventing—or locking—access to it while another thread of
    execution is in the region.'
