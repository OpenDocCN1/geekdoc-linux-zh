    your default console loglevel where it is, and make all your debugging messages
    KERN_CRIT or so. Conversely, you can make the debugging messages KERN_DEBUG and
    change your console loglevel. Each has its price, and you, decide.


    # The Log Buffer


    Kernel messages are stored in a circular buffer of size LOG_BUF_LEN. This size
    is configurable at compile time via the CONFIG_LOG_BUF_SHIFT option. The default
    for a uniprocessor is 16KB. In other words, the kernel can simultaneously store
    16KB of kernel messages. If it is at this maximum and receives another message,
    it overwrites the oldest message. The log buffer is called circular because the
    reading and writing occurs in a circular pattern.


    Using a circular buffer has multiple advantages. It is easy to simultaneously
    write and read from a circular buffer, even interrupt context can easily use print().
    Furthermore, it makes log maintenance easy. If there are too many messages, new
    messages simply overwrite the older ones. There is a problem that results in the
    generation of many messages, the log simply overwrites itself in lieu of uncontrollably
    consuming'
