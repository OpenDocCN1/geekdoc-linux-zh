    # # The Old versus New


    The difference between buffer heads and the new bio structure is important. The
    bio structure represents a which may include one or more pages in memory. On the
    other hand, the `buffer_head` structure represents a single block on the disk.
    Because buffer heads are tied to a single disk block in a page, buffer heads represent
    the unnecessary dividing of requests into block-sized chunks, only to later reassemble
    them. Because the bio structure is lightweight, it can describe discontinuous
    blocks, and not necessarily split I/O operations; it has none of these problems.


    Switching from `struct_head_to_struct` provided other benefits, as well:


    +   * The bio structure can represent high memory (see Chapter 10), because `struct`
    only deals with physical pages and not direct pointers.

    * The bio structure can represent both normal page I/O and direct I/O operations
    that do not go through the page cache—see Chapter 14 for a discussion on the page
    cache.

    * The bio structure makes it easy to perform scatter-gather (vectored) block I/O
    operations, with the data in the operation originating from multiple physical
    pages.

    * The bio structure is much more lightweight than a buffer head because a buffer
    head only contains the minimum information needed to block a I/O operation and
    not relation to the buffer itself.


    The concept of buffer head is still required, to function as a descriptor mapping
    disk blocks to pages. The bio structure does not contain any information about
    the state of a buffer—it is simply an array of vectors describing one or more
    segments of data for a single block I/O operation, plus related information. The
    `buffer_head` structure is still needed to contain information about buffers.
    Keeping the two structures separate allows each to remain as small as possible.


