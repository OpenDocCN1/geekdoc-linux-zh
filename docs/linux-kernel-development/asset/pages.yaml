    # ### syslog and klogd


    On a standard Linux system, the user-space klogd daemon retrieves the kernel messages
    from the log buffer and feeds them into the system log file via syslog daemon.
    To read the log, the klogd program can read the /proc/kmsg file or the syslog()
    system call. By default, the /proc device sends messages to syslog daemon. In
    case, klogd blocks until a new kernel message is read. It wakes up, any new messages
    appear, and processes them. By default, it


    The syslog daemon appends all the messages it receives to a file, which is by
    /var/log/messages. It is configurable via /etc/syslog.conf.


    You can have the console loglevel when it loads by specifying the -c flag when
    starting.


    # A Note About printk() and Kernel Hacking


    When you first develop kernel code, you will most likely transpose printk() for
    printk(). It is only natural because you cannot deny years of experience using
    printk() in user-space programs. Hopefully, this mistake won''t last long the
    repeated linker errors will eventually grow rather annoying.


    Someday, you might find yourself accidentally using printk() instead of print()
    in your user-space code. When that day, you can say you are a true kernel hacker.


    # ### Oops


    An oops is what a kernel says to the user something bad happened. Because the
    kernel is the supervisor of the entire system, it cannot simply fix itself or
    when user-space goes astray, the kernel issues an oops. This involves printing
    an error message to the console, dumping the contents of the registers, and providing
    a back trace. A failure in the kernel is hard to manage, so the kernel must jump
    through many hoops to keep the oops and clean after itself. Often, the oops occurs
    in an interrupt context, so it is important to know what was being processed before
    the oops occurred. It might have held a lock or been in the middle of talking
    hardware. The kernel must get back out its current content and try to resume control
    of the system. In many cases, this is not possible. If the oops occurred in the
    idle task (pid zero) or the it task (pid one), the result is also a panic because
    the kernel cannot continue without these important processes. A panic results
    in an instant halt of the system. If the oops occurred in any other process, however,
    the kernel kills the process and tries to continue executing.


    An oops might occur for multiple reasons, including a memory access violation
    or an illegal instruction. As a kernel developer, you will often deal with (and
    undoubtedly cause) oops.'
