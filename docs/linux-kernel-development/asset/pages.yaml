  md: "# Structure Initializers\n\nStructures need to be initialized using labeled\
    \ identifiers. This is good because it prevents structure changes from resulting\
    \ in incorrect initialization. It also enables values to be omitted. Unfortunately,\
    \ C99 adopted a ugly format for labeled identifiers, and gcc is deprecating usage\
    \ of the previous GNU-style labeled identifier, which was rather ugly. Consequently,\
    \ kernel code needs to use the C99 labeled identifier format, however ugly it\
    \ is\n\n```\nstruct foo {\n    .a = INITIAL_A,\n    .b = INITIAL_B\n};\n```\n\n\
    where a and b are members of struct foo and INITIAL_A and INITIAL_B are their\
    \ initialized values, respectively. If a field is not set, it is set to its default\
    \ value per ANSI (for example, NULL, integers are zero, and floats are 0.0). For\
    \ example, if struct foo also has int c as a member, the previous statement would\
    \ initialize to zero.\n\nYes, it is. No, we do not have a choice.\n\n# Fixing\
    \ Code Up Post Fact\n\nIf a pile of code falls into your lap to even mildly resemble\
    \ the Linux kernel coding style, do not fret. A little elbow grease and the indent\
    \ utility will make everything perfect. The indent program, an excellent GNU utility\
    \ found on most Linux systems, formats source according to given rules. The default\
    \ settings are not too pretty. To get the utility to follow the Linux kernel style,\n\
    \n```\nindent -kr i18 -ts8 -sob180 -bs -psl <file>\n```\n\nThis instructs you\
    \ to format the code according to the kernel coding style. Alternatively, the\
    \ script scripts/Lindent automatically invokes indent with the desired options.\n\
    \n# Chain of Command\n\nKernel hackers are the developers who work on the kernel.\
    \ Some do it for pay, some as a hobby, but nearly all for fun. Kernel hackers\
    \ with many significant contributions are listed in the CREDITS file in the root\
    \ of the kernel source tree.\n\nMost parts of the kernel have an associated maintainer.\
    \ The maintainer is the individual or individuals who are in charge of specific\
    \ parts of the kernel. For example, each individual driver has an associated maintainer.\
    \ Each kernel subsystem—for example, networking—also has an associated maintainer.\
    \ The maintainer for a specific driver or subsystem is usually listed in the MAINTAINERS\
    \ file which is also located at the root of the kernel source tree."
