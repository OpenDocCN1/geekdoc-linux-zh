  md: 'The system_call() function checks the validity of the system call number by
    comparing it to NR_syscalls. If it is larger than or equal to NR_syscalls, the
    function returns -ENOSYS. Otherwise, the specified system call is invoked:


    ```

    call *sys_call_table[eax];

    ```


    Because each element in the system call table is 32-bits (four bytes), the kernel
    multiplies the system call number by four to arrive at its location in the system
    call table. See Figure 4.2.


    ![](img/10f4d9a57f7d19944d26b746133440df_83_0.png)


    Figure 4.2 Invoking the system call handler and executing a system call.


    # Parameter Passing


    In addition to system syscalls require that one or more parameters be passed to
    them. Somehow, user-space must relay the parameters to the kernel during the exception
    trap. The easiest way to do this is via the same means the syscall number is passed:
    The parameters are stored in registers. On x86, the registers ebx, ecx, esi, edi
    contain, in order, the first five arguments. In the unlikely case of six or more
    arguments, a single register is used to hold a pointer to user-space where all
    the parameters exist.


    The return value is sent to user-space also via register. On x86, it is written
    into the eax register.


    # System Call Implementation


    The actual implementation of a system call in Linux does not need to concern itself
    with the behavior of the system call handler. Adding a new system call to Linux
    is relatively easy. The hard work lies in designing and implementing the system
    call; registering it with the kernel is simple. Let''s look at the steps involved
    in writing a new system call for Linux.'
