  md: "# Comments\n\nCommenting your code is very important, but the commenting must\
    \ be done correctly. Generally, you want to describe what and why your code does\
    \ what it does, not how it is doing it. The how should be apparent from the code\
    \ itself. maybe you need to rethink what you write. Additionally, comments should\
    \ not include work for, modification date, or trivial notice. The general style\
    \ is generally acceptable at the top of the source file, however:\n\nThe kernel\
    \ uses C-style comments, even though gcc supports C++style comments, too. The\
    \ general style of a comment in the kernel reserves:\n\n```\n/*\n * get_foo()\
    \ - return the current value of foo\n * We need this to calculate the bar ratio.\
    \ This can sleep,\n * do not call while holding a lock.\n * */\n```\n\nComments\
    \ inside of functions are rare, and should be reserved for special needs, such\
    \ as documenting a bug or an important assignment. In comments, important notes\
    \ are often prefixed with \"FIXME\", and bugs are often prefixed with \"FIXME:\"\
    \ like so\n\n```\n/*\n * FIXME: We assume dog -- cat may not be in the future\n\
    \ * */\n```\n\nThe kernel has a facility for self-generating documentation. It\
    \ is based on GNOME-doc, slightly modified and renamed Kernel-doc. To create the\
    \ standalone documentation in HTML format, run:\n\n```\nmake htmldocs\n```\n\n\
