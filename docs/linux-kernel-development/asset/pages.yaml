  md: 'What happens if this function is called again on another processor?


    In short, nearly all global and shared data in the kernel comes some form of the
    synchronization methods discussed in the next chapter.


    # Deadlocks


    A deadlock is a condition involving one or more threads of execution and one or
    more resources, such that each thread is waiting for one of the resources, but
    all the resources are already held. The threads are all waiting for each other,
    but will never make any progress releasing the resources they already hold. None
    of the threads can continue, unless we have a deadlock.


    A good analogy is a four-way traffic stop. If each car at the stop decides to
    wait for the others before going, no car will ever go and we have a traffic deadlock.


    The simplest example of a deadlock is the self-deadlock: If a thread of execution
    attempts to acquire a lock it already holds, it will have to wait for the lock
    to be released. But it will never release the lock, because it is busy waiting
    for the lock, and the result is deadlock:


    ```

    acquire lock

    acquire lock, acquire

    wait for lock to become available

    ..

    ```


    Similarly, consider *n* threads and *n* locks. If each thread holds a lock the
    other wants, all threads will block waiting for their respective lock to become
    available. The most common example is with two threads and two locks, which is
    often called the *ABBA deadlock:*


    # Thread 1


    # Thread 2


    ```

    acquire lock A

    try to acquire lock B

    wait for lock B

    ```


    ```

    acquire lock B

    try to acquire lock A

    wait for lock A

    ```


    Each thread is waiting for the other and neither will ever release their original
    lock; therefore, neither will ever become available. This type of deadlock is
    also known as the *deadly embrace.*


    > ⁴ Some kernels prevent this type of deadlock by having recursive locks that
    lock a single thread of execution may acquire multiple times. Linux, thankfully,
    does not provide recursive locks. This is usually considered a good thing. Recursive
    locks might alleviate the self-deadlock problem, they very readily lead to sloppy
    locking semantics.'
