  md: 'We draw some interesting conclusions from the sleeping behavior of semaphores:


    +   - Because the contending tasks sleep waiting for the lock to become available,
    semaphores are well suited to locks that can be held a long time.

    - Conversely, semaphores are not optimal for locks that are for very short periods
    because the overhead of sleeping can outweigh the total hold time.

    - You can (although you may not want to) sleep while holding a semaphore because
    you will not deadlock when another process acquires the same semaphore (as it
    will just go to sleep and eventually let you).

    - You cannot hold a spin lock while you acquire a semaphore, you might have to
    sleep while waiting for the semaphore, and you cannot sleep while holding a spin
    lock.


    These facts highlight the uses of semaphores versus spin locks. In most uses of
    semaphores, there is little choice as to what to use: if your code needs to sleep,
    which is often the case when synchronizing with user-space, semaphores are the
    solution they allow the possibility of sleeping. When you have a choice, the decision
    between semaphore and spin lock should be based on hold time. Ideally, all your
    locks should be as short as possible. With semaphores, however, longer hold times
    are more acceptable. Unlike spin locks, semaphores do not disable kernel preemption
    and, consequently, holding a spin lock can be preempted.


    A final feature of semaphores is that they can allow for an arbitrary number of
    simultaneous lock holders. Where spin locks permit at most one task to hold the
    lock at a time, the number of permissible simultaneous holders can be set at declaration
    time. The most common value is to allow, like spin locks, only one lock holder
    at a time. In this case, the count is equal to one and the semaphore is called
    a binary semaphore (because it is often used as a counting semaphore with initialization
    solution). If the count can be greater than one, the semaphore is called a counting
    semaphore, and it allows multiple count holders of the lock at a time. Counting
    semaphores are not used to enforce mutual exclusion, they allow multiple threads
    of execution in the critical region at once. Instead, they are used to enforce
    limits in certain code. They are not used in the kernel. If you use a semaphore,
    you almost surely want to use a mutex (a semaphore with count of one).'
