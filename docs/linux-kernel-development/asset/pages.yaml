  md: '# BKL: The Big Kernel Lock


    Welcome to the redesigned kernel. The Big Kernel Lock (BKL) is a global spin lock
    which was created to ease the transition from Linux''s original SMP implementation
    to fine-grained locking. The BKL has some interesting properties:


    +   * You can sleep while holding the BKL. The task is unscheduled and reacquired
    when the task is rescheduled. Of course, this does not mean it is safe to sleep
    while holding the BKL, merely that you can and you will not deadlock.

    * The BKL is a recursive lock. A single process can acquire the lock multiple
    times and not deadlock, as it would with a spin lock.

    * You can only use the BKL in process context.

    * It is evil.


    These features helped ease the transition from kernel version 2.0 to 2.2. When
    SMP support was introduced in kernel version 2.0, only one could be in the kernel
    at a time (of course, now the kernel is quite finely threaded—we have come a long
    way). A goal of 2.2 was to allow multiple processors to execute in the kernel
    concurrently. The BKL was introduced to help the transition to finer grained locking.
    It was a great aid then, now it is a scalability burden.


    Use of the BKL is discouraged. In fact, new code should never introduce locking
    using the BKL. The lock is fairly well used in parts of the kernel, however. Therefore,
    understanding the BKL and its interfaces is important. The BKL behaves like a
    spin lock, with the additions discussed previously. The function `lock_kernel()`
    acquires the lock and the function `unlock_kernel()` releases the lock. A single
    thread of execution may acquire the lock recursively, but must then call `unlock_kernel()`
    an


    > Although it may not be as terrible as some make out to be - some people believe
    it to be the kernel incarnation of the devil.'
