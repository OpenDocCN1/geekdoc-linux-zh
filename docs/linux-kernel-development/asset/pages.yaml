  md: '# Debugging


    ONE OF THE DEFINING FACTORS THAT SETS kernel development apart from user-space
    development is the hardship associated with debugging. It is difficult, at least
    relative to user-space, to debug the kernel. To complicate the matter, a fault
    in the kernel could bring the whole system down—hard—


    Growing successful at debugging the kernel—and ultimately, becoming successful
    at kernel development as a whole—is largely a function of your experience and
    understanding of the operating system. Sure, looks and charm help, too—but to
    successfully debug kernel issues, you need to understand the kernel. We have to
    start somewhere, however, in this chapter we will look at approaches to debugging
    the kernel.


    # What You Need to Start


    So, you''re ready to start bug hunting? It might be a long and frustrating journey.
    Some bugs have perplexed the kernel development community for months. Frankly,
    for one of these evil bugs, there is a simple bug with an equally simple fix.
    With luck, all your bugs will remain simple and trivial. You will not know that,
    however, until you start investigating. For that, you need


    +   - A bug might sound silly, but you need a well-defined and specific bug. It
    helps if it is reliably reproducible, at least for someone, but unfortunately
    bugs are not always well-behaved or well-defined.

    - A kernel version the bug exists on (presumably in the latest kernel, or who
    cares?). Even better is if you know the kernel version where the bug first appeared.
    We will look at how to figure out if you do not know it.

    - Some good luck.


    If you cannot reproduce the bug, many of the following approaches worthless. It
    is rather crucial that you be able to duplicate the problem. If you cannot, fixing
    the bug is limited to conceptualizing the problem and finding a flaw in the code.
    This does often'
