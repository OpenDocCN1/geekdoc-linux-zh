    # # Assigning an Index


    You declare softirqs at compile-time via an enum in <linux/interrupt.h>. The kernel
    uses this, which starts at zero, as a relative priority. Softirqs with the lowest
    numerical priority execute before higher numerical priority.


    Table 6.2 Listing of Bottom Half Control Methods


    | Tasklet | Priority | Softirq Description |

    |---|---|--|

    | HI_SOFTIRQ | 0 | High priority tasklets |

    | TIMER_SOFTIRQ | 1 | Timer bottom half |

    | NET_TX_SOFTIRQ | 2 | Send network packets |

    | NET_RX_SOFTIRQ | 3 | Receive network packets |

    | SCSI_SOFTIRQ | 4 | SCSI bottom half |

    | TASKLET_SOFTIRQ | 5 | Tasklets |


    Creating a new softirq involves adding a new entry to this enum. When adding a
    softirq you might not want to add your entry to the end of the list, as you would
    otherwise. Instead, you need to insert the new entry depending on the priority
    you want to get it. Historically, HI_SOFTIRQ is the first and TASKLET_SOFTIRQ
    is the last entry. A new entry belongs somewhere after the network entries, but
    prior to TASKLET_SOFTIRQ.


    # # Register Your Handler


    Next, the softirq handler is registered at run-time via open_softirq(), which
    takes three parameters: the softirq''s index, its handler function, and a value
    for the data field. The networking subsystem, for example, registers its softirqs
    index like this:


    ```

    open_softirq(NET_TX_SOFTIRQ, net_tx_action, NULL);

    open_softirq(NET_RX_SOFTIRQ, net_rx_action, NULL);

    ```


    Softirq handlers run with interrupts enabled and cannot sleep. While a softirq
    runs, the current processor is disabled. Another processor, however, can execute
    softirqs. In fact, if a softirq is raised again while it is executing, another
    processor can run it simultaneously. This means that any shared data—global data
    used only within the softirq handler itself—needs locking (as discussed in the
    next chapters). This is an important point, and it is the reason tasklets are
    usually preferred. Simply preventing your softirqs from running concurrently is
    not ideal. If a softirq obtained a lock to prevent itself from running simultaneously,
    there would be little reason to use a softirq. Consequently, most softirq handlers
    resort to per-processor data (data unique to each processor and thus not requiring
    locking) or some other tricks to avoid locking and provide excellent scalability.'
