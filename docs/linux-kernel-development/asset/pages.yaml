    Processes have an initial priority that is called the `nice` value. This value
    ranges from -20 to 19 with a default of zero. Nineteen is the lowest and -20 is
    the highest priority that the user specifies. The scheduler, in turn, bases its
    decisions on the dynamic priority that is stored in `prio`. The dynamic priority
    is calculated as a function of the static priority and the task''s interactivity.


    The method `priority()` returns the dynamic priority of a task. The method begins
    with the task''s nice value and computes a bonus or penalty in the range -5 to
    +5 based on the interactivity of the task. For example, a highly interactive task
    with nice of ten can have a dynamic priority of five. Conversely, a mild process
    with nice value of ten can have a dynamic priority of 12. Tasks that are only
    interactive receive no bonus or penalty and their dynamic priority remains I/O-bound
    or processor-bound.


