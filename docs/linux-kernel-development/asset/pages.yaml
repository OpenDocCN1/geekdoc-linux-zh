  md: 'Page 42


    # Kernel Notification of Time


    Certainly, the concept of time is a bit obscure. Indeed, the kernel must work
    with the system''s hardware to comprehend and manage time. The hardware provides
    a system timer that the kernel uses to passage of time. This system timer works
    off an electronic source, such as a digital clock or the frequency of the processor.
    The system timer goes off (often called hitting or popping) at a programmed frequency,
    called the tick rate. When the system timer goes off, it issues an interrupt that
    the kernel handles via a special interrupt.


    Because the kernel knows the programmed tick rate, it knows the time between any
    two successive interrupts. This is called a tick and is equal to one-over-the-tick
    rate seconds. As youll see, the kernel keeps track of both wall time and system
    uptime. Wall time—the actual time of day—is most importance to user-space. A family
    of system calls provide the date and time of day to user-space. The system uptime—the
    relative time since the system booted—is useful to both the kernel and user-space.
    This is because lot of code must be aware of the passing of time. The difference
    between two readings—now and then—is a simple measure of relativity.


    The timer interrupt is very important to the management of the operating system.
    A large number of kernel functions live and die by the passing of time. Some of
    the work executed periodically by the timer interrupt includes:


    +   * Update the system timer

    * Update the time of day

    * On an SMP system, ensure that the scheduler runqueues are balanced, and if not,
    balance them (also discussed in Chapter 3, "Scheduling")

    * Check if the current process has exhausted its timeslice and, if so, cause a
    reschedule (also discussed in Chapter 3)

    * Run any dynamic timers that have expired

    * Update resource usage and processor statistics


    Some of this work occurs on every timer interrupt—that is, the work is carried
    out with the frequency of the tick rate. Other functions still execute periodically,
    but every n timer interrupts. That is, these functions occur at some fraction
    of the tick rate. In the section "The Timer Interrupt Handler," we will look at
    the timer handler itself.


    # The Tick Rate: HZ


    The frequency of the system (the tick rate) is programmed on system boot on a
    static preprocessor define, HZ. The value of HZ differs for each supported architecture.
    In fact, on some supported architectures, it even differs between machine types.'
