  md: "# Typedefs\n\nFor various reasons, the kernel developers have a certain hatred\
    \ for typedef that almost defies explanation. Their rationale is\n\n+   - typedef\
    \ hides the real type of data structures.\n- Because the type is hidden, code\
    \ is more prone to do bad things, such as a structure by value on the stack.\n\
    - typedef is just lazy.\n\nTo avoid ridicule, avoid typedef.\nOf course, there\
    \ are a few good uses of typedef hiding an architecture-specific implementation\
    \ of a variable or providing forward-compatibility when a type may change. Decide\
    \ carefully whether the typedef is truly needed or exists to reduce the number\
    \ of characters you need to type.\n\n# Using What Is Already Provided\n\nDo not\
    \ reinvent the wheel. The kernel provides string manipulation functions, correction\
    \ routines, and a linked list interface, so use them.\nDo not wrap interfaces\
    \ in generic interfaces. Often you see code that was obviously ported from one\
    \ operating system to Linux, and various kernel interfaces are wrapped in some\
    \ glue function. No one likes this, so just use the provided interfaces directly.\n\
    \n# No ifdefs in the Source\n\nPutting typedef preprocessor directives directly\
    \ in the C source is frowned upon. You should never do something like the following\
    \ in your functions:\n\n```\n#ifdef CONFIG_FOO\nfoo()\n#endif\n...\n```\n\nInstead,\
    \ define foo() to nothing if CONFIG_FOO is not set:\n\n```\n#ifdef CONFIG_FOO\n\
    static int foo(void)\n{\n    /* ... */\\n}\n#else\nstatic inline int foo(void)\
    \ { }\n#endif\n```\n\nThen, you can unconditionally call foo(). Let the compiler\
    \ do the work for you."
  merge: -1
  pgno: 311
