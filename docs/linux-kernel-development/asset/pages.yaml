  md: '# Foreword


    As the Linux kernel and the applications that use it become more widely used,
    we are seeing an increasing number of software developers who want to become involved
    in the development and maintenance of Linux. Some of these engineers are motivated
    purely by personal interest, some work for Linux communities, some for hardware
    manufacturers, and some are involved with in-house development projects.


    But all a common problem? The learning curve for the kernel is getting longer
    and steeper. The system is becoming increasingly complex, and it is very large.
    As the years pass, the current members of the kernel development team gain deeper
    and broader knowledge of the kernel''s internals, which widens the gap between
    them and neworkers.


    I believe that this declining accessibility of the Linux source base is already
    a problem for the quality of the kernel, and it will become more serious over
    time. Those who care for Linux clearly have an interest in increasing the number
    of developers who can contribute to the kernel.


    One approach to this problem is to keep the code clean: sensible interfaces, consistent
    layout, "do one thing, do it well," and so on. This is Linux Torvalds''s solution
    (The process of identifying divergences between the intent and the implementation
    is as debugging; to do this if the intent is not known).


    But even code commentary does not provide the broad-steep view of what major subsystems
    are intended to, and how they set about doing them.


    This, the starting point of understanding, is that the written words serve best.
    Robert Love''s contribution provides a means by which experienced developers can
    gain essential view of what services the kernel subsystems are supposed to provide,
    and how they set about providing them. This will be sufficient knowledge for many
    people: the users, the applications developers, those who want to evaluate the
    kernel design, and others.


    But the book is also a stepping store to asking kernel developers to the next
    stage, which is making alterations to the kernel to achieve some defined objective.
    The way to understand a part of the kernel is to make changes to it. Making a
    change forces the developer to a level of understanding that merely reading the
    code does not provide.


    The serious kernel developer will join the development mailing lists and interact
    with other developers. This is the primary means by which kernel contributors
    learn and stay abreast. Robert covers the mechanics and culture of this important
    part of kernel life well.'
  merge: -1
  pgno: 21
- img_proc: true
