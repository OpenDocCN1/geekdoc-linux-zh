    \ must always be obtained in the same order. This prevents the deadly embrace\
    \ deadlock. Document the lock ordering so others follow it.\n\n+   - Prevent starvation.\
    \ As does code always ensure safety? If foo does not occur, will bar wait forever?\n\
    \n+   - Do not acquire the same lock—design for simplicity.\n\nThe first point\
    \ is important, worth stressing. If two or more locks are acquired at the same\
    \ time, they must be acquired in the same order. Let's assume we have the cat,\
    \ dog, and fox locks that protect data structures of the same name. Now we have\
