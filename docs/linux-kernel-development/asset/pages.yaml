    If you do not specify a loglevel, it defaults to DEFAULT_MESSAGE, LOGLEVEL, which
    is currently KERN_WARNING. This value might change, so you should always specify
    a loglevel for you.


    The kernel defines the most important loglevel, KERN_EMERG, as "0" and it defines
    KERN_DEBUG, the least critical loglevel, as "7". For example, after the preprocessor
    is done, our previous example becomes:


    ```

    print("<4> is a warning!\n");

    print("<6> is a debug notice!\n");

    print("<c> did not specify a loglevel!\n");

    ```


    The avenue you take with print(<k>) loglevels is up to you. For example, normal
    messages you intend to keep around should have the appropriate loglevel. But the
