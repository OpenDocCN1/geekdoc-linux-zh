  md: '# # 11

    The Virtual Filesystem


    THE VIRTUAL FILESYSTEM (SOMETIMES CALLED the Virtual File Switch or simply the
    VFS) is the subsystem of the kernel that implements the filesystem interface provided
    to user-space programs. All filesystems rely on the VFS to allow them not to coexist,
    but also to operate. This enables you to use standard Unix system calls to read
    and write to different filesystems on different media, as shown in Figure 11.1.


    ![](img/10f4d9a57f7d19944d26b746133440df_211_0.png)


    Figure 11.1 The VFS in action: Using the cp (1) utility to move data from a hard
    disk mounted as ext3 to a removable disk mounted as ext2.


    # Common Filesystem Interface


    The VFS is the glue that enables system calls as open(), read(), and write() to
    work regardless of the filesystem or underlying physical medium. It might not
    sound impressive these days—we have long been taking such a feature for granted—but
    it is a'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'nontrivial feat for such generic systems to work across all supported filesystems
    and media. More so, the systems work between these different filesystems and media—we
    can copy or move from one filesystem to another using standard system calls. In
    older operating systems (DOS), this would never have worked; access to a native
    filesystem would require special tools. It is only because modern operating systems,
    Linux, included abstract access to the filesystems via a virtual interface is
    is generic and accessible people.


    # # Filesystem Abstraction Layer


    A generic interface for any filesystem is only feasible if the kernel itself implements
    an abstraction layer around its low-level filesystem interface. This abstraction
    layer enables Linux to support different filesystems, even if they differ greatly
    in supported features or behavior. This is possible because the VFS provides a
    common file model capable of representing any conceivable filesystem''s features
    and behavior. Of course, it is biased towards Unix-style filesystems which we
    will see as Unix-style in the proceedings. Regardless, wildly different filesystems
    are still supported in Linux.


    The abstraction layer works by defining the basic interfaces and data structures
    all filesystems support. The filesystems mold their view of concepts such as "how
    is open files" and "this is a directory is me" to match the expectations of the
    VFS. The actual interface hides the implementation details. However, each filesystem
    looks the same. They all support notions, such as files and directories, and they
    all support operations, such as create and delete file.


    The result is a general abstraction layer that enables the kernel to support many
    types of filesystems easily and cleanly. The filesystems are programmed to provide
    the abstracted interfaces and data structures the VFS expects; in turn, the kernel
    works easily with any filesystem and the user-space interface seamlessly works
    on any filesystem.


    In fact, the kernel needs to understand the underlying details of the filesystems,
    except the filesystems themselves. For example, consider a simple user-space program


    ```

    write(f, ibuf, len);

    ```


    This writes the bytes pointed to by ibuf into the current position in the filesystem
    represented by the file descriptor f. This system call is first handled by a generic
    sys_write() system call that determines the actual file writing method for the
    filesystem on which f resides. The generic write call then invokes this method,
    which is part of the filesystem implementation, to write the data to the media
    (or whatever this filesystem does on). Figure 11.2 shows the flow from user-space
    write() call through the data arriving on the physical media. We will look at
    how the VFS abstracts this abstraction and provides its interfaces throughout
    the rest of this chapter.'
