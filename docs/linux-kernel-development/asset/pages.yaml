  md: 'Preventing deadlocks is very important. The Linux kernel has some basic debugging
    facilities for detecting deadlock scenarios in a running kernel. These features
    are discussed in the next chapter.


    # Contention and Scalability


    The term lock contention, or simply contention, is used to describe a lock that
    is currently in use, but that another is trying to acquire. A lock that is highly
    contended has threads waiting to acquire it. A lock''s job is to serialize access
    to a resource, it comes as no surprise that locks can slow down the performance
    of a system. A highly contended lock can become a bottleneck in the system, quickly
    limiting its performance. Of course, the locks are also required to prevent deadlocks
    and to ensure data integrity.


    Scalability is a measurement of how well a system can be expanded. In expanding
    systems, we talk of scalability with large number of processors, large amounts
    of memory. We can discuss scalability in relation to any component of a computer
    to which we can attach a quantity. Ideally, doubling the number of processors
    should result in a doubling of the system''s processor performance. Of course,
    this is never the case.


    The scalability of Linux on a large number of processors has increased dramatically
    in the time since multiprocessing support was introduced in the 2.0 kernel. The
    early days of Linux multiprocessing were coarse-grained. Through 2.4, this limitation
    was removed as the locking mechanisms grew more fine-grained. Kernel locking became
    even finer grained.


    The granularity of locking is described the size or amount of data that a lock
    protects. A coarse lock protects a large amount of data—for example, an entire
    subsystem of data structures. A fine grained lock protects a small amount of data—say,
    a single element in a larger structure. In reality, most locks fall somewhere
    between these two extremes, protecting neither an entire subsystem, but perhaps
    a structure. Most locks started out coarse, and were made more fine-grained as
    contention proved to be a problem.


    One example of evolving to finer-grained locking is the scheduler runqueues, discussed
    in Chapter 3, "Scheduling." In 2.4 and prior kernels, the scheduler had a single
    runqueue (a runqueue is the list of manageable processes). In 2.6, the scheduler
    introduced per-processor runqueues with a unique lock. The locking evolved from
    a single global lock to separate locks for each.


    Generally, this scalability improvement is a very good thing, as it improves the
    performance of Linux on larger and more powerful systems. Rampant scalability
    "improvements" however, because smaller machines may not need such fine locking,
    can lead to a decrease in performance on smaller SMP and UP machines, but will
    nonetheless have to put up with the increased complexity and overhead. Consider
    an initial locking scheme would provide a single lock for the list. In time, this'
