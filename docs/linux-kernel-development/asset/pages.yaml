    and finally arriving at the physical media.


    # ## VFS Objects and Their Data Structures


    The VFS is object-oriented$^1$ A family of data structures represents the common
    file model. These data structures are akin to objects. Because the kernel is programmed
    strictly in C, without the benefit of a language directly supporting object-oriented
    paradigms, the data structures are represented as C structures. The structures
    contain both data and pointers to filesystem-implemented functions that operate
    on the data.


    The four primary object types of the VFS are


    +   * The superblock object, which represents a specific mounted filesystem.

    * The inode object, which represents a specific file.

    * The dentry object, which represents a specific directory entry.

    * The file object, which represents an open file associated with some process.


    Note, that the VFS treats dentries as normal files, there is not a specific directory
    object. Recall from earlier in this chapter that a dentry represents a component
    in a path, which might include a regular file. In other words, a dentry is not
    the same as a directory, but a directory is the same as a file. Got it?


    > $1$ People often miss this, or even deny it, but there are many examples of
    object-oriented programming in the kernel. Although the kernel developers may
    shun C++ and explicitly object-oriented languages, thinking in terms of objects
    is often useful. The VFS is a good example of how to do clean and efficient OOP
    in C, which is a language that lacks any OOP constructs.'
