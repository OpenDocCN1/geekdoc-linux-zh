  md: '# System Calls


    THE KKERNEL PROVIDES a SET OF INTERFACES for interacting with the processes running
    in user-space. These interfaces give access to hardware and other operating system
    resources. The interfaces act as the messenger between applications and the kernel,
    with the applications issuing various requests, and the kernel fulfilling them
    (or telling the application to go away). The fact that these interfaces exist,
    and that applications are not free to directly access whatever they please, is
    key to providing a stable system and avoiding a big mess.


    System calls provide a layer between the hardware and user-space processes. This
    layer serves three primary purposes. First, to provide an abstracted hardware
    interface for user-space. When reading or writing from a file, for example, applications
    need not concern themselves with the type of disk, media, or even the filesystem
    on which files are stored. Second, system calls provide a mechanism for user-space
    processes to access system resources, which the kernel can arbitrate based on
    permissions and other criteria. For example, this prevents applications from incorrectly
    using hardware, stealing another process''s resources, or doing harm to the system.
    Finally, a single common layer between user-space and the rest of the system allows
    for the virtual system afforded processes; without the kernel''s knowledge, it
    would be nearly impossible to implement multitasking and virtual memory. In Linux,
    system calls are the only means user-space has of interfacing with the kernel;
    they are the only legal entry points into it. Indeed, other interfaces, such as
    device files or /proc, are ultimately accessed via system calls. Interestingly,
    Linux implements far fewer system calls than most systems.


    This chapter addresses the role and implementation of system calls in Linux.


    > About 250 system calls are on x86 (each architecture is allowed to define unique
    system calls). Although not all operating systems publish their exact system calls,
    some operating systems are estimated to have over one thousand.'
