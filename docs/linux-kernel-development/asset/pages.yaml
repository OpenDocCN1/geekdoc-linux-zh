  md: "After setting the desired speed, the driver should wait at least the two microseconds\
    \ before continuing.\n\nThe kernel provides a number of solutions, depending on\
    \ the semantics of the delay. The solutions have different characteristics. Some\
    \ hog the processor while delaying, effectively preventing the accomplishment\
    \ of any real work. Other solutions do not hog the processor, offer no guarantee\
    \ that your code will resume in exactly the required time.\n\n# # Busy Looping\n\
    \nThe simplest solution to implement (although rarely the optimal solution) is\
    \ busy waiting or busy looping. This technique only works when the time you want\
    \ delay is some integer multiple of the tick rate or precision is not important.\n\
    \nThe idea is to spin in a loop until the desired number of clock ticks passes.\
    \ For example:\n\n```\nunsigned long delay = jiffies + 10;    /* ten ticks */\n\
    while (time_before(jiffies, delay)) {\n    }\n```\n\nThe loop will continue until\
    \ jiffies is larger than delay, which will occur after 10 clock ticks have passed.\
    \ On x86 with HZ equal to 1000, this is 10 milliseconds. Similarly,\n\n```\nunsigned\
    \ long delay = jiffies + 2*HZ;    /* two seconds */\nwhile (time_before(jiffies,\
    \ delay)) {\n    }\n```\n\nThis will spin until Z*HZ clock ticks has passed, which\
    \ is always two seconds regardless of the clock rate.\n\nThis approach is not\
    \ nice to the rest of the system. While your code waits, the processor is tied\
    \ spinning in a silly loop—no useful work is accomplished! In fact, you might\
    \ want to take this brain-dead approach, and it is shown here because it is a\
    \ clear and simple method for delaying execution. You might encounter it in someone\
    \ else's not-so-pretty code.\n\nA better solution would reschedule the processor\
    \ to accomplish other work while your code waits:\n\n```\nunsigned long delay\
    \ = jiffies + 5*HZ;\n```\n\n> * Actually, no approach guarantees that the delay\
    \ will be exactly for the requested time. Some extreme close, however - and they\
    \ all promise to wait as long as needed. Some just wait longer."
