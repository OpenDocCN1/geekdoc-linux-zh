    # Which Bottom Half Should I Use?


    The decision over which bottom half to use is important. In the 2.6 kernel, there
    are three choices: softirq, tasklets, and work queues. Tasklets are as soft as
    softirq, and therefore, both are important. The work queue mechanism is entirely
    different and built on kernel threads.


    Softirq, by design, provide the least serialization. Serialization handlers go
    through extra steps to ensure shared data is safe, as two or more sorts of the
    processor variables, softirqs make a good choice. They are certainly the fastest
    alternative for triggering critical and high-frequency events. Tasklets make more
    sense if the code is simple, and since tasklets of the same type might not run
    concurrently, they are easier to implement.


    If you deferred need to sleep to run in process, your only choice of the three
    is work queues. If process context is not a requirement -specifically, if you
    have no need to sleep-softirqs or tasklets are better suited. Work queues involve
    the highest overhead because they involve kernel threads and, therefore, context
    switching. This is not to say they are inefficient, but in light of thousands
    of interrupts hitting per second, as the networking subsystem might experience,
    other methods make more sense. For most situations, work queues are sufficient.


    In terms of use, work queues take the crown. Using the default events queue is
    child''s play. Next, come tasklets, which also have a simple interface. Coming
    in last are softirqs, which need to be created.


    Table 6.3 Bottom Half Comparison


    | Bottom Half | Context | Serialization |

    | --- | --- | --- |

    | Softirq | Interrupt | None |

    | Tasklet | Interrupt | Against the same tasklet |

    | Work queues | Process | None (scheduled as process context) |


    In short, normal drivers have two choices. First, do you need a schedable entity
    to perform your deferred work—do you need to sleep for any reason? Then work queues
    are your only option. Otherwise, tasklets are preferred. If scalability becomes
    a concern, then investigate softirqs.'
