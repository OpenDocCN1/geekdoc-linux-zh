  md: '# APIs, POSIX, and the C Library


    Typically, POSIX, applications are programmed against an Application Programming
    Interface (API), not directly to system calls. This is important, because no correlation
    is needed between the interface that applications make of and the actual interface
    provided by the kernel. An API defines a set of programming interfaces used by
    applications. These can be implemented as a system call, implemented using multiple
    system calls, or implemented without system calls at all. An API can exist on
    multiple systems and provide the same interface while the implementation of the
    API can differ greatly from system to system.


    One of the more popular programming interfaces in the world is based on the POSIX
    standard. POSIX is comprised of a series of standards from the IEEE that aim to
    provide a portable operating system roughly based on Unix. Linux is POSIX compliant.


    POSIX is an excellent example of the relationship between APIs and system calls.
    In most Unix systems, the POSIX-defined API calls have a strong correlation to
    the system calls. Indeed, the POSIX standard was created to resemble the interfaces
    provided by earlier Unix systems. On the other hand, systems that are far from
    Unix, such as Windows NT, are not POSIX-compatible.


    The system call interface in Linux, as with most Unix systems, is provided in
    part by the C library. The C library implements the main API on Unix systems,
    including all of the system calls. The C library is used by all C programs, and
    because of C''s nature, it is easily wrapped by other programming languages for
    use in their programs. The C library additionally provides the majority of the
    POSIX API.


    ![](img/10f4d9a57f7d19944d26b746133440df_80_0.png)


    From the programmer''s point of view, system calls are irrelevant; all the programmer
    is concerned with the API, the kernel is only concerned with the system calls;
    what library calls and applications make use of the system calls is not of the
    kernel''s concern. Nevertheless, it is important for the kernel to keep in mind
    the potential uses of a system call and keep the system call as general and flexible
    as possible.


    A common motto related to interfaces in Unix is "provide mechanism, not policy."
    In other words, Unix system calls exist to provide a specific function in a very
    abstract sense. The manner in which the function is used is not any of the kernel''s
    business.


    > ² IEEE (eye-triple-E) is the Institute of Electrical and Electronics Engineers.
    It is a nonprofit professional association involved in numerous technical areas
    and responsible for many important standards, such as POSIX. For more information,
    visit http://www.ieee.org.'
