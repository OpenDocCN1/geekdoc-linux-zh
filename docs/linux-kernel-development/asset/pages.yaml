    # Spin Locks and Bottom Halves


    As mentioned in Chapter 6, "Bottom Halves and Deferring Work," locking preaus
    must be taken when working with bottom halves. The function `spin_lock_bh()` obtains
    the given lock and disables all bottom halves. The function `spin_unlock_bh()`
    performs the inverse.


    Because a bottom half may preempt process context, if data is shared between a
    bottom half and process context, you must protect the data in process context
    with both a lock and the disabling of bottom halves. Likewise, an interrupt handler
    may preempt a bottom half, if data is shared between an interrupt handler and
    a bottom half, you must both obtain the appropriate lock and disable interrupts.


    Recall that two tasks of the same type do not run simultaneously. Thus, there
    is no need to protect data only within a single type of tasklet. If the data is
    shared between two different tasklets, however, you must obtain a normal spin
    lock before accessing the data in the bottom half. You do not need to disable
    bottom halves as they never preempt another tasklet on the same processor.


    With softirqs, regardless of whether it is the same softir type or not, if data
    is shared by softirqs it must be protected with a lock. Recall that softirqs,
    even two of the same type, may run simultaneously on multiple processors in the
    system. A softir will never preempt another softirq running on the same processor,
    however, so disabling bottom halves is not needed.


    # Reader-Writer Spin Locks


    Sometimes, lock usage can be clearly divided into readers and writers. For example,
    consider a list that is both updated and searched. When the list is updated (written
    to), it is'
