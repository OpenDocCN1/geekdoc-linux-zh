  md: '# Kernel Synchronization Methods


    THE PREVIOUS CHAPTER DISCUSSED THE SOURCES and solutions to race conditions. Frankly,
    the Linux kernel implements a large family of synchronization methods. This chapter
    discusses these methods and their interface, behavior, and use.


    # Atomic Operations


    Atomic operations provide instructions that execute atomically—without interruption.
    Just as the atom was originally thought to be an indivisible particle, atomic
    operators are indivisible instructions. For example, as discussed in the previous
    chapter, an atomic increment can read and increment a variable by one in a single
    indivisible and uninterruptible step. Instead of the race discussed in the previous
    chapter, the outcome is always similar to (assume i is initially seven):


    # Thread 1


    # Thread 2


    ```

    increment i (7 -> 8)

    ```


    ```

    increment i (8 -> 9)

    ```


    The resulting value, nine, is correct. It is never possible for the two atomic
    operations to occur on the same variable concurrently. Therefore, it is not possible
    for the increments to race.


    The kernel provides two sets of interfaces for atomic operations—one that operates
    on integers and another that operates on individual bits. These interfaces are
    implemented on every architecture that Linux supports. Most architectures either
    directly support simple atomic operations or provide an operation to lock the
    memory bus for a single operation (and thus ensure another operation cannot occur
    simultaneously). Architectures that cannot easily support primitive atomic operations,
    such as SPARC, however cope.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Atomic integer methods


    The atomic methods operate on a special data type, atomic_t. This special type
    is used, as opposed to having the functions work directly on the C int, for a
    couple of reasons. First, having the atomic functions accept only the atomic_t
    type ensures that the atomic operations are only used with these special types.
    Likewise, the data types are not passed to any other nonatomic functions. Indeed,
    what would good atomic operations be if they were used and other times not they?
    Next, use of atomic_t ensures the compiler does not (erroneously) optimize access
    to the value—it alias. Finally, use of atomic_t can hide any architecture-specific
    differences in its implementation.


    Being an integer, and 32-bit all the machines that Linux supports, must assume
    an atomic_t is no larger than 24 bits in size. This is because of the SPARC architecture,
    which has an odd implementation of atomic operations: A lock is embedded in the
    lower 8-bits of the 32-bit int (it looks like Figure 8.1). The lock is used to
    protect concurrent access to the atomic type, because the SPARC architecture lacks
    support at the instruction-level. Consequently, only 24-bits are usable on SPARC
    machines. Although code that assumes the full 32-bit range exists will work on
    other machines, can fail in strange and subtle ways on SPARC machines—and that
    is just rude.


    ![](img/10f4d9a57f7d19944d26b746133440df_144_0.png)


    The declarations needed to use the atomic integer operations are in <asm/atomic.h>.
    Some architectures provide additional methods which are unique to that architecture,
    but all provide at least a minimum of operations which are used throughout the
    kernel. When you write kernel code, you can ensure these operations are correctly
    implemented on all architectures.


    Defining an atomic_t is done in the usual manner. Optionally, you can set it to
    an initial value:


    ```

    atomic_t u;

    /* define u */

    atomic_t v = ATOMIC_INIT(0);

    /* define v and initialize it to zero * */

    ```'
