- img_proc: true
  md: 'A lock provides such a mechanism; it works much like a lock on a door. Imagine
    the room beyond the critical. Inside the room, only one thread of execution can
    be present at a given time. When a thread enters the room, it locks the door.
    Whenever it is finished sharing the shared data, it unlocks the door. If another
    thread reaches the door while it is locked, it must wait for the first to exit
    the room and unlock the door before it can enter.


    In the previous example, a single lock could be used to protect the queue. Whenever
    there was a new request to add to the queue, the thread would first obtain the
    lock. Then, it could safely add to the queue and quickly release the lock. When
    a thread wanted to remove a request from the queue, it would obtain the lock.
    Then, it could read the request and remove it from the queue. Finally, it would
    release the lock. Any other access to the queue would similarly need to obtain
    the lock. Because the lock can only be held by one thread at a time, only a single
    thread can manipulate the queue at a time. The lock prevents concurrency and protects
    the queue from race conditions.


    Any code that the queue would first need to obtain the relevant lock. If another
    thread of execution comes along, the lock will prevent concurrency:


    # Thread 1


    # Thread 2


    ```

    try to lock the queue

    succeeded: acquired lock

    access queue...

    unlock the queue

    ```


    ```

    try to lock the queue

    failed: waiting...

    waiting...

    waiting...

    succeeded: acquired lock

    access queue...

    unlock the queue

    ```


    Notice that locks are advisory and voluntary. Locks are entirely a programming
    construct that the programmer must take advantage of. Nothing prevents you from
    writing code that manipulates your fictional queue without the appropriate lock.
    Such a practice, of course, would eventually result in a race condition and corruption.


    Locks come in various shapes and sizes—Linux implements a handful of locking mechanisms.
    The most significant difference between the various mechanisms is the behavior
    when the lock is contended (already in use)—some locks simply busy wait, whereas
    others put the task to sleep until the lock becomes available. The next chapter
    discusses the behavior of the different locks in Linux and their interfaces.


    > ² That is, spin in a tight loop, waiting for the lock to become available.'
