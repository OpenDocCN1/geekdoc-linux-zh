  md: 'The my_timer.expires value specifies the timeout value, in absolute ticks.
    When the current jiffs count is equal to or greater my_timer.expires, the handler
    my_timer.function is run with the long argument of my_timer.data. As we see from
    the my_timer_list definition, the function must match this prototype:


    ```

    void my_timer_function(unsigned long data);

    ```


    The data parameters allow you to register multiple timers with the same handler,
    and differentiate them via the argument. If you do not need the argument, you
    can simply pass zero (or any other value).


    Finally, activate the timer:


    ```

    add_timer(my_timer);

    ```


    And, the timer is off and running! Note the significance of the expired value.
    The kernel runs the timer handler when the current tick count is equal to the
    specified expiration. The kernel guarantees to run no timer handler prior to the
    expiration; however, there may be a delay in running the timer. Typically, timers
    are far close to their expiration; however, they may be delayed until the next
    tick. Consequently, timers cannot be used to implement any sort of real-time processing.


    Sometimes you might need to modify the expiration of an already active timer.
    The kernel implements a function, mod_timer(), which changes the expiration of
    a given timer:


    ```

    mod_timer(my_timer, jiffs + new_delay);

    ```


    The mod_timer() can operate on timers that are initialized but not active, too.
    If the timer is inactive, mod_timer() will activate it. The function returns zero
    if the timer was inactive and one if the timer was active. In either case, upon
    return from mod_timer(), the timer is activated and set to the new expiration.


    If you need to deactivate a timer prior to its use, the del_timer() function:


    ```

    del_timer(my_timer);

    ```


    The function works on both active and inactive timers. If the timer is already
    inactive, the function returns zero; otherwise, the function returns one. Note
    you do not need to call this for timers that have expired because they are automatically
    deactivated.


    A potential race condition that must be guarded against exists when deleting timers.
    When del_timer() returns, it guarantees only that the timer is no longer active
    (that is, it will not be executed in the future). On a multiprocessing machine,
    however, the timer handler might be executing on another processor. To deactivate
    the timer and wait until a potentially executing handler for the timer exits,
    use del_timer_sync():


    ```

    del_timer_sync(my_timer);

    ```


    Unlike del_timer(), del_timer_sync() cannot be used from interrupt context.'
