    This system call is named mmap2() because it is the second variant of mmap().
    The original mmap() took an offset in bytes as the last parameter; the current
    mmap2() takes the offset in pages. This enables larger offsets to be mapped. The
    original mmap(), as specified by POSIX, is available from the C library as mmap()
    but is no longer implemented in the kernel proper; the new version is available
    as mmap2(). Both library calls use mmap2() system call, with the original mmap()
    converting the offset to bytes.


