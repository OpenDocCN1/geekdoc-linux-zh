  md: 'The first step implementing a system call is defining its purpose. What will
    it do? The syscall should have exactly one purpose. Multiplexing system calls
    (a single call that does different things depending on a flag) is discouraged
    in Linux. Look at ioctl() as an example of what not to do.


    What are the new system call'' arguments, return value, and error codes? The system
    call should have a clean and simple interface with the smallest number of arguments.
    The semantics and behavior of a system call are important; they must not change,
    because existing applications will come to rely on them.


    Designing the interface with eye to the future is important. Are you limiting
    the function? Design the system call to be as general as possible. Do not assume
    its use until tomorrow. The purpose of the system call will remain constant but
    its uses may change. Is the system call portable? Do not make assumptions about
    an architect''s workload or endurance. Chapter 16, "Portability," discusses these
    issues. Make sure your not making promises that will break the system call in
    the future. Remember the Unix motto: "provide mechanism, not policy."


    When you write a system call, it is important to realize the need for portability
    and robustness, not just today but in the future. The basic Unix system calls
    have survived this test of time; most of them are as useful and powerful as they
    were thirty years ago


