    Figure 5.1 The path an interrupt takes from hardware and on through the kernel.


    A device issues an interrupt by sending a electric signal over the bus to the
    interrupt controller. If the interrupt line is enabled (they can be masked out),
    the interrupt controller sends the interrupt to the processor. In many architectures,
    sending a signal to the processor over a special pin accomplishes this. Unless
    interrupts are disabled in the processor (which can also happen), the processor
    immediately stops what it is doing, disabling the interrupt systems, and jumps
    to a predefined location in memory and executes the code located there. This predefined
    point is set up by the kernel and is the entry point for interrupt handlers.


    The interrupt''s journey begins at a predefined entry point, just like system
    calls. For each interrupt line, the processor jumps to a unique location. This
    way, the kernel knows the IRQ number of the incoming interrupt. The initial entry
    point simply saves this value and stores the current register values (which belong
    to the interrupted task) on the stack; then, the kernel calls do_IRQ(). From here
    onward, the interrupt handling code is written in C—however, it is still architecture-dependent.


