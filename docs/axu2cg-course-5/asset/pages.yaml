    **Part 4****：****OpenCV+Qt Face Detection**


    **Part 4.1: OpenCV''s Cascade Classifier**


    The classifier is a device that judges whether a certain thing


    belongs to a certain classification. Cascade classifier: It can be


    understood as connecting N single-class classifiers in series. If a thing


    can belong to all the classifiers connected in this series, the final result


    is judged as yes, and if one item does not match, it is judged as no.


    For example, a human face has many attributes. We make each


    attribute into a classifier. If a model meets all the attributes of a human


    face defined by us, then we believe that this model is a human face.


    So what do these attributes refer to? For example, a human face


    needs to have two eyebrows, two eyes, a nose, a mouth, a roughly


    U-shaped chin or outline, and so on.


    The target detection of the cascade classifier based on Haar


    features is an effective target detection method proposed by Paul


    Viola and Michael Jones in the paper "Rapid Object Detection using a


    Boosted Cascade of Simple Features" in 2001. This is a method


    based on machine learning, in which a cascade function is trained


    from many positive and negative images. Then, it is used to detect


    objects in other images.


    We will perform face detection here. The algorithm first requires a


    large number of positive images (face images) and negative images


    (no face images) to train the classifier. Then we need to extract


    features from it.'
