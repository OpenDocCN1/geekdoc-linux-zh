    rectangles in the feature template, and the feature value of the


    template is defined as the sum of white rectangle pixels and minus


    black rectangle pixels. The Haar eigenvalue reflects the gray level


    changes of the image. For example, some features of the face can be


    simply described by rectangular features, such as: the eyes are darker


    than the cheeks, the sides of the nose are darker than the bridges of


    the nose, and the mouth is darker than the surroundings. However,


    the rectangular feature is only sensitive to some simple graphic


    structures, such as edges and line segments, so it can only describe


    structures with specific directions (horizontal, vertical, diagonal).


    By changing the size and position of the feature template, a large


    number of features can be listed in the image sub-window. The


    feature template in the above figure is called the "feature prototype";


    the feature that the feature prototype is expanded in the image


    sub-window (translation and expansion) is called the "rectangular


    feature"; the value of the rectangular feature is called the "feature


    value".'
