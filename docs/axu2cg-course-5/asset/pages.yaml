    3) Call msync


    If you need to write more data to the peripheral at one time, if you


    call O\_SYNC at this time, it will seriously affect the performance


    of the system. At this time, if we do not use O\_SYNC, but call


    msync after writing the data, this will improve Write performance.


    4) Read operation consistency problem


    If you need to read the data of the peripheral, because of the


    existence of the cache, the data fetched in the application is the


    data in the cache, not the latest state of the peripheral. At this


    time, the read may be an incorrect value.'
