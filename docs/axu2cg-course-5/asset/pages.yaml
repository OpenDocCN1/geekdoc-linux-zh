    the rectangle position and the rectangle size. Therefore, the change of


    category, size and position makes a small detection window contain a


    lot of rectangular features. For example, the number of rectangular


    features can reach 160,000 in a detection window with a size of 24\*24


    pixels. So there are two problems to be solved: (1) How to calculate so


    many features quickly? (2) Which rectangular features are the most


    effective for classifying the classifier?


    **Part 4.2: Integral Graph**


    In order to quickly calculate features, an integral map is


    introduced here, no matter how large the image is, it will reduce the


    calculation of a given pixel to operations involving only four pixels.


    Integral map is a fast algorithm that can find the sum of pixels in all


    areas of the image by traversing the image only once, which greatly


    improves the efficiency of image feature value calculation.


    The main idea of the integral graph is to store the sum of pixels in


    the rectangular area formed by the image from the starting point to


    each point as an element of an array in the memory. When the sum of


    pixels in a certain area is to be calculated, the elements of the array


    can be directly indexed. Recalculate the pixel sum of this area,


    thereby speeding up the calculation (this has a corresponding name,


    called the dynamic programming algorithm). The integral graph can


    use the same time (constant time) to calculate different features under


    multiple scales, thus greatly improving the detection speed.


    The integral graph is a matrix representation method that can


    describe global information. The way the integral map is constructed'
