    The Laplacce operator is a second-order differential operator in


    the n-dimensional Euclidean space. It is more appropriate when


    you only care about the position of the edge without considering


    the grayscale difference of the surrounding pixels. The response


    of Laplace operator to isolated pixels is stronger than the


    response to edges or lines, so it is only suitable for noise-free


    images. In the presence of noise, low-pass filtering is required


    before edge detection using the Laplacian operator. Therefore,


    the usual segmentation algorithm is to combine the Laplacian


    operator and the smoothing operator to generate a new template.


