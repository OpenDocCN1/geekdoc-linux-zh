    **Part 7: Linux Register Operation**


    **Part 7.1: Linux Memory Map**


    Memory mapping is to map a memory area of user space to


    kernel space. After the mapping is successful, the user''s modification


    of this memory area can be directly reflected in the kernel space.


    Similarly, the modification of this area by the kernel space can also


    directly reflect the user space. This is very efficient for transferring


    large amounts of data between kernel space and user space.


    For example, to read a file from the hard disk into the memory,


    the data must be copied through the file system, and the data copy


    operation is realized by the file system and the hardware driver. In


    theory, the efficiency of copying data is the same. But accessing files


    on the hard disk through memory mapping is more efficient than


    calling the read and write systems. Why?


    The reason is that read() is a system call in which data is copied.


    It first copies the content of the file from the hard disk to a buffer in the


    kernel space, and then copies the data to the user space. In this


    process, the data is actually copied twice. And mmap() is also a


    system call, there is no data copy in mmap(), and the real data copy is


    performed when the page fault is interrupted. Because mmap()


    directly maps the file to the user space, the interrupt handling function


    directly copies the file from the hard disk to the user space according


    to this mapping relationship, and only one data copy is performed.


    Therefore, the efficiency of memory mapping is higher than that of


    read/write.'
