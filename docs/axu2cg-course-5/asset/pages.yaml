    **Part 3.2: Edge Detection Introduction**


    Edge detection is a basic problem in image processing and


    computer vision. The purpose of edge detection is to identify points


    with


    obvious


    brightness


    changes


    in


    digital


    images.


    Significant


    changes in image attributes usually reflect important events and


    changes


    in


    attributes.


    These


    include


    discontinuities


    in


    depth,


    discontinuities in surface orientation, changes in material properties,


    and changes in scene lighting. Edge detection is a research field in


    image


    processing


    and


    computer


    vision,


    especially


    in


    feature


    extraction.


    Image edge information is mainly concentrated in high frequency


    bands. Generally speaking, image sharpening or edge detection is


    essentially high-frequency filtering. We know that the differential


    operation is to find the rate of change of the signal, which has the


    effect of strengthening the high frequency components. In the spatial


    calculation, the sharpening of the image is the calculation of the


    differential. Due to the discrete signal of the digital image, the


    differential operation becomes the calculation of the difference or


    gradient. There are a variety of edge detection (gradient) operators in


    image


    processing.


    Commonly


    used


    include


    ordinary


    first-order


    difference, Robert operator (cross-difference), Sobel operator, etc.,


    which are based on finding gradient strength. Laplace operator


    (second-order difference) is based on zero-crossing detection. By


    calculating the gradient and setting the threshold, the edge image is


    obtained.


    The general steps of edge detection are:


    1)** Filtering:** The edge detection algorithm is mainly based on the first


    and second derivatives of image intensity, but the derivatives are'
