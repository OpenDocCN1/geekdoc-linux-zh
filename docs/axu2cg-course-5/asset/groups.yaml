    4) Cap


    Caps describes the format of the data stream that can pass through the pad or
    currently pass through the pad. You can view the media types supported by the
    component through the gst-inspect-1.0 command.


    5) Bus


    Each pipeline contains a bus by default, and the application does not need to
    create another bus. The application program sets up a message processor on the
    bus. When the main loop is running, the bus will poll the message processor for
    new messages. When the messages are collected, the bus will call the corresponding
    callback function to complete the task


    6) Buffer


    The buffer contains the data stream in the created pipe. Usually a source component
    will create a new buffer, and at the same time the component will pass the data
    in the buffer to the next component. When using GStreamer''s underlying structure
    to create a media pipeline, you don''t need to process the buffers yourself, and
    the component will automatically process these buffers. The buffer zone is mainly
    composed of the following components:


    - Pointer to a block of memory

    - The size of the memory

    - Buffer timestamp

    - A reference count indicates the number of components used in the buffer. When
    there is no component to reference, this reference will be used to destroy the
    buffer


    7) Events


    Events include control information in the pipeline, such as search information
    and flow termination signals.


