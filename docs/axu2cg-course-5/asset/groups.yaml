    # Part 1: Building a Minimalist Working Environment


    ### Part 1.1: Introduction to the system environment


    This tutorial uses QtCreator as a development tool under ubuntu to cross-compile
    applications. Therefore, under ubuntu, we need to install cross-compilation tools
    and various library files that need to be used. These can be completed using the
    sdk.sh installation package. For the origin of the installation package, please
    refer to the tutorial in the petalinux chapter, which is not introduced here.


    ### Part 1.2: System and basic tool installation


    1) Under the win10 system, install the virtual machine software VMware.

    Refer to the tool installation "vmware installation.pdf"


    2) Use ubuntu-18.04.2-desktop-amd64.iso to create a linux system.

    Refer to the tool to install "ubuntu virtual machine creation.pdf"


    3) Install the necessary libraries under ubuntu

    `sudo apt-get install build-essential`

    Refer to the tool installation "ubuntu library installation.pdf"


    4) Install QtCreator under ubuntu

    Refer to the tool installation "Qt installation under linux.pdf"


    ### Part 1.3: Compilation environment installation


    1) Copy sdk.sh to the ubuntu system and open the terminal


    ![](img/1cbdc9e6f065399dc26b2b407e539434_5_0.png)[](img/1cbdc9e6f065399dc26b2b407e539434_5_1.png)

    ***Ultrascale+ Linux Application Development Tutorial***

    ***Amazon Store: https://www.amazon.com/alinx***

    **6 / 50**


    ![](img/1cbdc9e6f065399dc26b2b407e539434_5_2.png)


    2) Create a tools directory in the root directory and modify permissions:

    `sudo mkdir /tools`

    `sudo chmod 777 -R /tools`


    3) Run sdk.sh

    ![](img/1cbdc9e6f065399dc26b2b407e539434_5_3.png)


    4) Enter the installation directory, where the installation directory is set to
    "/tools/xilinx_sdk_tool", and press Enter

    ![](img/1cbdc9e6f065399dc26b2b407e539434_5_4.png)


    5) Enter "Y" to start the installation until the end


    ![](img/1cbdc9e6f065399dc26b2b407e539434_6_0.png)[](img/1cbdc9e6f065399dc26b2b407e539434_6_1.png)

