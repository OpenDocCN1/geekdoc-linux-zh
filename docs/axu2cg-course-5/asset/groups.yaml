    So how do we choose the best function from more 160,000? This can be achieved
    by the AdaBoost algorithm. We apply each feature to all training images. For each
    feature, it will find the best threshold, and divide face into two categories:
    positive and negative. Obviously, there will be correct or incorrect classifications.
    We choose features with the smallest error rate, which means that they are the
    features that classify human faces and non-face images most accurately. The process
    is not as simple as this. Each image has an equal weight at the beginning. After
    each classification, the weight of the misclassified image will increase. Then
    do the same process. Calculate the new error rate, there will be new weight. The
    process will continue until the required accuracy or error rate is reached or
    the required number of features is found


