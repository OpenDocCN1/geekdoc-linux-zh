    8) sobel edge detection


    This is a more commonly used edge detection method. The function of the Sobel
    operator integrates Gaussian smoothing and differential derivation. It is also
    called the first-order differential operator. The derivation operator is used
    to obtain the derivation in both horizontal and vertical directions. What is obtained
    is a gradient image of the image in the X direction and the Y direction. Disadvantages:
    Sensitive and easily affected. Gaussian blur (smoothing) is used to reduce noise,
    and the edge positioning accuracy is not high enough.


    cv:: sobel function parameters are as follows:


    | Type | Name | Description |

    | :--- | :--- | :--- |

    | InputArray | src | Input image |

    | OutputArray | dst | Output edge image |

    | int | ddepth | Output image depth |

    | int | dx | Order of derivative x. |

    | int | dy | Order of derivative y |

    | int | ksize = 3 | Sobel kernel size |

    | double | scale = 1 | Optional scale factor for calculated derivative value |

    | double | delta = 0 | Optional increment value to add to the result before storing
    the result in dst |

    | int | borderType = BORDER_DEFAULT | Pixel extrapolation |


    9) Laplacian edge detection


    The Laplace operator is a second-order differential operator in the n-dimensional
    Euclidean space. It is more appropriate when you only care about the position
    of the edge without considering the grayscale difference of the surrounding pixels.
    The response of Laplace operator to isolated pixels is stronger than the response
    to edges or lines, so it is only suitable for noise-free images. In the presence
    of noise, low-pass filtering is required before edge detection using the Laplacian
    operator. Therefore, the usual segmentation algorithm is to combine the Laplacian
    operator and the smoothing operator to generate a new template. Laplace operator,
    like Sobel operator, belongs to spatial sharpening filtering operation.


    cv:: Laplace function parameters are as follows:


    | Type | Name | Description |

    | :--- | :--- | :--- |

    | InputArray | src | Input image |

    | OutputArray | dst | Output edge image |

    | int | ddepth | Output image depth |

    | int | ksize = 1 | Used to calculate the size of the second derivative kernel
    |

    | double | scale = 1 | Optional scale factor used to calculate Laplace |

    | double | delta = 0 | Optional increment value to add to the result before storing
    the result in dst |

    | int | borderType = BORDER_DEFAULT | Pixel extrapolation |


    ## Part 4: OpenCV+Qt Face Detection


    ### Part 4.1: OpenCV''s Cascade Classifier


    The classifier is a device that judges whether a certain thing belongs to a certain
    classification. Cascade classifier: It can be understood as connecting N single-class
    classifiers in series. If a thing can belong to all the classifiers connected
    in this series, the final result is judged as yes, and if one item does not match,
    it is judged as no.


    For example, a human face has many attributes. We make each attribute into a classifier.
    If a model meets all the attributes of a human face defined by us, then we believe
    that this model is a human face. So what do these attributes refer to? For example,
    a human face needs to have two eyebrows, two eyes, a nose, a mouth, a roughly
    U-shaped chin or outline, and so on.


    The target detection of the cascade classifier based on Haar features is an effective
    target detection method proposed by Paul Viola and Michael Jones in the paper
    "Rapid Object Detection using a Boosted Cascade of Simple Features" in 2001. This
    is a method based on machine learning, in which a cascade function is trained
    from many positive and negative images. Then, it is used to detect objects in
    other images.


    We will perform face detection here. The algorithm first requires a large number
    of positive images (face images) and negative images (no face images) to train
    the classifier. Then we need to extract features from it.


    Haar features are divided into three categories: edge features, linear features,
    central features and diagonal features, which are combined into feature templates.


    There are white and black rectangles in the feature template, and the feature
    value of the template is defined as the sum of white rectangle pixels and minus
    black rectangle pixels. The Haar eigenvalue reflects the gray level changes of
    the image. For example, some features of the face can be simply described by rectangular
    features, such as: the eyes are darker than the cheeks, the sides of the nose
    are darker than the bridges of the nose, and the mouth is darker than the surroundings.
    However, the rectangular feature is only sensitive to some simple graphic structures,
    such as edges and line segments, so it can only describe structures with specific
    directions (horizontal, vertical, diagonal).


    By changing the size and position of the feature template, a large number of features
    can be listed in the image sub-window. The feature template in the above figure
    is called the "feature prototype"; the feature that the feature prototype is expanded
    in the image sub-window (translation and expansion) is called the "rectangular
    feature"; the value of the rectangular feature is called the "feature value".


    ### Part 4.2: Integral Graph


    In order to quickly calculate features, an integral map is introduced here, no
    matter how large the image is, it will reduce the calculation of a given pixel
    to operations involving four pixels. Integral map is a fast algorithm that can
    find the sum of pixels in all areas by traversing the image only once, which greatly
    improves the efficiency of image feature value calculation.


    The integral graph is a matrix representation method that can describe global
    information. The way the integral map is constructed

