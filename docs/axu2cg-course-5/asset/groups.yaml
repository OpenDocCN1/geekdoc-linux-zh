    **37 / 50**


    2) bin（容器）和 Pipeline（流水线）


    Bin 是可以包含元素的容器。Pipeline 是 Bin 的特殊子类。Pipeline 可以操作其内部包含的所有元素。如下所示


    ![](img/1cbdc9e6f065399dc26b2b407e539434_36_3.png)


    3) Pad（节点）


    Pad 等同于组件的接口，每个组件都通过此接口连接，以便数据流可以在这些组件之间传输。Pad 类别有：


    - always（始终）

    - sometimes（有时）

    - on request（按请求）


    4) Cap（类型）


    Caps 描述了可以通过 Pad 或当前通过 Pad 的数据流格式。你可以通过 `gst-inspect-1.0` 命令查看组件支持的媒体类型。


    5) Bus（总线）


    每个 pipeline 默认包含一个 bus，应用程序不需要创建另一个总线。应用程序在总线上设置了一个消息处理器。当主循环运行时，总线会轮询消息处理器以获取新消息。当收集到消息时，总线将调用相应的回调函数完成任务。


    6) Buffer（缓冲区）


    buffer 包含创建管道中的数据流。通常源组件会创建一个新的缓冲区，同时组件会将缓冲区中的数据传递给下一个组件。使用 GStreamer 的底层结构创建媒体流水线时，你不需要自己处理缓冲区，组件会自动处理这些缓冲区。缓冲区主要由以下部分组成：


    - 指向内存块的指针

    - 内存大小

    - Buffer 时间戳

    - 引用计数，表示使用缓冲区的组件数量。当没有组件引用它时，该引用将销毁缓冲区


    7) Events（事件）


    事件包括流水线中的控制信息，例如搜索信息和流终止信号。


    ## 第 5.3 部分：实验目标


    gstreamer 工具使用


    gstreamer 编程


    ## 第 5.4 部分：Gstreamer 工具


    ### 1 gst-inspect-1.0


    如果不带参数，它将列出所有可用的元素，即你可以使用的所有元素。如果带有文件名，它会将该文件作为 GStreamer 的插件并尝试打开它，然后列出所有内部元素。对于
    GStreamer 的某个元素，将列出该元素的所有信息。


    打印列表及其信息，例如：


    - 打印支持的插件列表：`gst-inspect-1.0 -a`

    - 打印插件 filesrc 信息：`gst-inspect-1.0 filesrc`


    Pad Templates（Pad模板）：此部分将列出所有类型的 Pad 及其 Caps。通过这些你可以确认是否可以连接到某个元素。


    ### 2 gst-discoverer


    此工具用于查看文件中包含的 Caps，这是一个 GstDiscoverer 对象包。它接受命令行传入的 URI，然后打印所有信息。这在查看媒体如何编码和复用非常有用，以便我们决定在流水线中放置哪个元素。


    ### 3 gst-launch-1.0


    此工具可以创建、初始化并运行一个流水线。它允许你在正式编写代码之前快速测试流水线以查看其运行情况。如果你需要查看流水线中元素生成的 Caps，请在 gst-launch
    中使用 -v 参数，如下：


    `gst-launch-1.0 -v v4l2src device=/dev/video0`


    如底图片所示，摄像头的默认视频格式为 YUY2，分辨率为 2592x1944


    ## 第 5.5 部分：gst-launch-1.0 摄像头显示


    ### 1) 确认你的 USB 摄像头支持的视频格式


    将 `tools/uvc_fmt` 拷贝到 FPGA 开发板上运行，可以扫描支持的分辨率


    ### 2) 控制


    在控制下，输入以下命令。需要根据显示器设置你的 USB 摄像头支持的分辨率：


    `gst-launch-1.0 -v v4l2src device=/dev/video0 ! video-x-raw,format=YUY2,width=1920,height=1080
    ! kmssink video-id=0 sink-overlay=0x000000 fullscreen=1`


    如底图片所示，摄像头的默认视频格式为 YUY2，分辨率为 2592x1944。注意：需要根据显示器设置你的 USB 摄像头支持的分辨率。


    ### 3) 运行后


    运行后可以看到图像非常流畅，但缺点是只能显示在单个屏幕上。


    ## 第 5.6 部分：编程


    本章中的程序用于实现上述场景，但如果我们想要更多效果，则需要通过编程来实现。


    1) gst_parse_launch


    此函数创建一个流水线，函数参数如下：


    - `const gchar *pipelinedescription`: 描述流水线

    - `GError **error`: 错误返回


    2) gst_bus_add_watch


    添加总线的回调函数以处理必要的消息。


    ## 第 5.7 部分：代码分析


    ## 第 6 部分：Qt+DRM+GStreamer 摄像头显示


    ## 第 6.1：DRM 简介


    DRM 全称为 Direct Rendering Manager（直接渲染管理器）。它的创建是为了解决多个程序协作使用显卡资源的问题。它为用户空间提供了一组用于输出管理的
    API。DRM 现在已经涵盖了以前由用户空间程序处理的功能，例如帧缓冲区管理和模式设置、内存共享对象和内存同步。其中一些扩展有特定名称，例如图形执行管理器
    GEM 或内核模式设置 KMS，它们属于 DRM 子系统。


    1) DRM Framebuffer（帧缓冲区）


    从开发者的角度来看，Framebuffer 是一块内存，向内存中写入特定格式的数据意味着向屏幕输出内容。因此，Framebuffer 是一个画布。例如，对于初始化为
    16 位颜色的 FrameBuffer，Framebuffer 中的两个字节代表屏幕上的一个点，从上到下、从左到右，屏幕位置与内存地址之间存在关系。


