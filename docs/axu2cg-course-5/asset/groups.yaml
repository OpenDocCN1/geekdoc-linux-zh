    ## 第二部分：远程调试的 Hello World


    ### 第 2.1 部分：GDB 简介


    GDB（GNU 项目调试器）允许你查看程序在执行时“内部”发生了什么，或者当程序崩溃时程序正在做什么。其主要功能如下：


    1) 启动程序，指定任何可能影响其行为的内容，例如环境变量、运行参数等。


    2) 在指定条件下停止程序


    3) 检查程序停止时发生了什么，例如寄存器状态、变量值等。


