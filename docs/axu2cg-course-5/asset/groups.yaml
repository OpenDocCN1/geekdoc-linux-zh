    有序线性关系。


    2) CRTC


    CRTC 的任务是从帧缓冲区（Framebuffer）中读取要显示的图像，并根据相应的格式将其输出到编码器（Encoder）。虽然 CRTC 的字面意思是“阴极射线显示管控制器”，但
    CRT 早已在普通显示设备中被淘汰。CRTC 在 DRI 中的主要功能如下：


    - 配置适用于显示器的分辨率（内核）并输出相应的时序（硬件逻辑）

    - 扫描帧缓冲区并将其发送到一个或多个显示设备


    3) Planes（平面/层）


    随着软件技术的不断更新，对硬件性能的要求越来越高。在满足正常功能需求的前提下，对功耗的要求变得越来越严苛。最初 GPU 可以处理所有图形任务，但由于其运行期间功耗较高，设计人员决定将一些简单任务交给显示器控制器（Display
    Controller）处理（如合成），让 GPU 专注于绘制（即渲染）这一主任务。减轻 GPU 的负担，从而达到降低功耗和提高性能的目的。因此，Plane（硬件层单元）应运而生。


    Plane 主要用于叠加和输出多个层。某些硬件支持层平移、缩放、裁剪、Alpha 通道等。


    4) Encoder（编码器）


    将特定格式的图像信号（如 RGB、YUV 等）编码为连接器需要输出的信号。以 HDMI 为例，帧/行同步/显示内容通过 TMDS 数据的串行线输出，然后根据
    HDMI 标准将并行序列编码为串行序列，这就是编码器的任务。


    5) Connector（接口）


    Connector 实际上是连接到显示器的物理接口。常见的有 VGA/HDMI/DVI/DP 等。可以通过接口读取显示支持的参数。


    ## 第 6.2 部分：实验介绍


    MPSoc 的 DP 输出支持层，上层（Primary）支持 Alpha 通道。本章实验使用 Qt 输出内容到 Primary 层，并使用 Gstreamer
    捕捉视频数据到后续层（Overlay）。最后，这两层由硬件进行混合并输出。工作框图如下：


    ## 第 6.3 部分：实验目标


    1) DRM 输出管理

    2) DRM 层管理

    3) Qt 和 GStreamer 分层显示


    ## 第 6.4 部分：运行程序


    1) 需要注意的是，本实验需要支持 1080 分辨的 USB摄像头（指裸流，例如上述的 YUYV422 格式）

    2) 实验操作效果


    你可以看到 Qt 界面叠加在视频上。


    ## 第 6.5 部分：代码分析


    1) 检查显示器是否连接

    在主函数中，调用 `init_drm` 判断初始化是否成功，返回 -2 表示没有支持的显示格式，说明未连接显示器。


    2) 设置显示器输出分辨率

    通过函数 `drmModeSetCrtc` 设置输出分辨率和刷新率。这里没有设置缓冲区，所以第三个...


    3) 设置显示器输出分辨率

    图形层的透明度

    图形层支持 Alpha 通道。这里 `it_alpha` 设置为 0。


    4) Qt 显示

    Gstreamer


    可以通过 `drmModeGetPlane` 获取 Plane 信息。从代码中可以看到，Plane 的属性设置如下：

    - type=dp

    - id=35

    - fullscreen=false

    - overlay=0

    - alpha=0


    5) Encoder

    Plane id 设置为 35。


    ## 第 7 部分：寄存器操作


    ### 第 7.1 部分：内存映射


    内存映射是将用户空间的一个区域映射到内核空间。映射成功后，对该区域的修改可以直接反映在内核空间。同样，对该区域的修改也可以直接反映在用户空间。


    ### 第 7.2 部分：实验介绍


    有时，某个外设的功能已经在裸机上通过验证。如果该外设不使用中断，此时我们可以使用 Linux 下映射寄存器的方法直接将裸机程序移植到 Linux。此示例移植了
    Vitis 下的 gpio 示例来驱动 ps_led，使 LED 每秒闪烁一次。其他操作的过程也类似。


    ### 第 7.3 部分：运行程序


    运行 `application_opt` 后，你可以看到 PS 的 LED 每秒闪闪一次。


    ### 第 7.4 部分：代码分析


    1) 关于 gpio 的寄存器地址，这里全部是从 Vitis 的 gpio 程序中复制的，我们以后的开发思路应该是：先使用 Vitis 的裸机程序进行验证。对于许多外设和
    FPGA 端的 IP，Vitis 会帮助我们生成良好的操作方法和操作地址，这样我们就不需要寻找对应关系。


    2) 打开 `/dev/mem` 时，使用 `O_SYNC` 选项。


    内存映射的效率高于调用 `read/write`。为什么？因为 `read()` 是系统调用，涉及数据拷贝。它首先将文件内容从硬盘拷贝到内核空间的缓冲区，然后将数据拷贝到用户空间。在这个过程中，数据实际上被拷贝了两次。而
    `mmap()` 也是一个系统调用，`mmap()` 中没有数据拷贝，真实的数据拷贝是在页异常中断被处理时执行的。因为 `mmap()` 直接将文件映射到用户空间，所以只执行一次数据拷贝。

