    calculation of characteristic value of rectangular feature is only related to
    the integral graph of the end point of characteristic rectangle, so no matter
    how scale of characteristic rectangle is transformed, time consumed for calculation
    of characteristic value is constant. In this way, as long as the image is traversed
    once, characteristic values of all sub-windows can be obtained.


