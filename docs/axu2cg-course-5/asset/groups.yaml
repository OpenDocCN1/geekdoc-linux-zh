    ## Part 2: Hello World with Remote Debugging


    ### Part 2.1: GDB Introduction


    GDB, the GNU Project debugger, allows you to see what is happening "internally"
    when a program is executed, or what a program is doing when it crashes. The main
    functions are as follows:


    1) Start the program, specify any content that may affect its behavior, such as
    environment variables, operating parameters, etc.


    2) Stop the program under specified conditions


    3) Check what happened when the program stopped, such as register status, variable
    value, etc.


    4) Manually modify various values in the running of the program, so that the program
    function can be verified more conveniently


    The GNU debugging tools under Linux are gdb and gdbserver. Among them, gdb and
    gdbserver can complete remote debugging of applications under Linux on the target
    board. gdbserver is a small application program that runs on the target board
    and can monitor the operation of the debugged process, and can communicate with
    gdb on the host computer through the network. Developers can input commands through
    gdb of the host computer to control the operation of the process on the target
    board and view the contents of memory and registers.


    ### Part 2.2: Qt Creator Introduction


    Qt Creator is a cross-platform integrated environment (IDE) that allows developers
    to create applications across desktop, mobile and embedded platforms. We usually
    call it Qt Creator. Qt Creator is a tool that helps us develop applications.


