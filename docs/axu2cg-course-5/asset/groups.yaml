    8) sobel边缘检测


    这是一种更常用的边缘检测方法。Sobel 算子集成了高斯平滑和微分求导，也被称为一阶微分算子。微分算子用于获取水平和垂直方向的导数。得到的是图像在 X 方向和
    Y 方向的梯度图。缺点：敏感且容易受影响。使用高斯模糊（平滑）可以减少噪声，但边缘定位精度不够。


    cv:: sobel 函数参数如下：


    | 类型 | 名称 | 描述 |

    | :--- | :--- | :--- |

    | InputArray | src | 输入图像 |

    | OutputArray | dst | 输出边缘图像 |

    | int | ddepth | 输出图像深度 |

    | int | dx | x 方向导数的阶数 |

    | int | dy | y 方向导数的阶数 |

    | int | ksize = 3 | Sobel 卷积核 |

    | double | scale = 1 | 计算导数值的可选缩放因子 |

    | double | delta = 0 | 在将结果存储到 dst 之前累加的可选增量 |

    | int | borderType = BORDER_DEFAULT | 像素外推类型 |


    9) Laplacian边缘检测


    Laplace 算子是 欧几里得空间中的二阶微分算子。当你只关心边缘位置而不考虑周围像素的灰度差异时，它更为合适。Laplace 算子对孤立像素的响应比对边缘或线的响应强，因此它只适用于无噪声图像。在存在噪声的情况下，在使用
    Laplacian 算子进行边缘检测之前需要低通滤波。因此，通常的分割算法是结合 Laplacian 算子和平滑算子来生成新模板。Laplace 算子与 Sobel
    算子一样属于空间锐化滤波操作。


    cv:: Laplace 函数参数如下：


    | 类型 | 名称 | 描述 |

    | :--- | :--- | :--- |

    | InputArray | src | 输入图像 |

    | OutputArray | dst | 输出边缘图像 |

    | int | ddepth | 输出图像深度 |

    | int | ksize = 1 | 用于计算二阶导数核的大小 |

    | double | scale = 1 | 用于计算 Laplace 的可选缩放因子 |

    | double | delta = 0 | 在将结果存储到 dst 之前累加的可选增量 |

    | int | borderType = BORDER_DEFAULT | 像素外推类型 |


    ## 第 4 部分：OpenCV+Qt 人脸检测


    ### 第 4.1 部分：OpenCV 级联分类器


    分类器是判断事物是否属于某一类别的设备。级联分类器：可以理解为将 N 个类分类器串联。如果一个符合串联的所有分类器，则最终结果判断为是；如果其中一项不匹配，则判断为否。


    例如，人脸有许多属性。我们将每个属性制成一个分类器。如果一个模型符合我们定义的人脸的所有属性，我们就认为这个模型是人脸。那么这些属性指的是什么呢？例如，人脸需要两条眉毛、只眼睛、一个鼻子、一个嘴巴、一个呈
    U 型的下巴或轮廓等。


    基于 Haar 特征的级联分类器目标检测是 Paul Viola 和 Michael Jones 在 2001 年的论文《使用增强级联简单特征的快速目标检测》中提出的一种有效目标检测方法。这是一种基于机器学习的方法，通过许多正样本和负样本图像训练级联函数，然后用它检测其他图像中的物体。


    我们在此处进行人脸检测。算法首先需要大量的正样本（人脸图像）和负样本（无人脸的图像）来训练分类器。然后我们需要从中提取特征。


    Haar 特征分为三类：边缘特征、线性特征、中心特征和对角特征，它们被组合成特征模板。


    特征模板中有白色和黑色矩形，模板的特征值定义为白色矩形像素之和减黑色矩形像素。Haar 特征值反映了图像的灰度变化。例如，人脸的某些特征可以用矩形特征简单地描述，如：眼睛比脸颊暗，鼻侧面比鼻梁暗，嘴巴比周围暗。然而，矩形特征只对某些简单的图形结构（如边缘和线段）敏感，因此只能描述特定方向（水平、垂直、对角线）的结构。


    通过改变特征模板的大小和位置，可以在图像子窗口中列出大量特征。上图中的特征模板被称为“特征原型”；在图像子窗口中扩展（平移和缩放）特征原型所得到的特征被称为“矩形特征”；矩形特征的值被称为“特征值”。


