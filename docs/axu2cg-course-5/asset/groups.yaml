    1) Use $s(i,j)$ to represent the cumulative sum in the row direction, and initialize
    $s(i,-1)=0$


    2) Use $ii(i,j)$ to represent an integral image, and initialize $ii(-1,i)=0$


    3) Scan the image line by line, recursively calculate the cumulative sum $s(i,j)$
