    ### 第 3.7 部分：代码分析


    1) **设置环境变量：** export DISPLAY=:0


    2) **启动桌面：** /etc/init.d/xserver-start


    3) **调整显示器分辨率：** 如果上述实验使用 4K 显示器，那么桌面上的图标会非常小。为了更好地显示效果，在应用程序中，通过系统调用将输出分辨率设置为
