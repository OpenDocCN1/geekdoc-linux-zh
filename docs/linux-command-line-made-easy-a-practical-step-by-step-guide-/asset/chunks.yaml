    Let us talk about the details we get from using `ls -l` command. We saw something
    similar to this.![](image_rsrc15V.jpg)Let us examine one file and see what it
    means.


    1. `drwxr-xx-x` – The first field indicates the file type and the access rights
    to that file. The first character in the first field indicates the file type,
    and the rest used to show access rights. Among various file types, a leading dash
    in the first character indicates a regular file while a `d` indicates a directory.
    The next three characters show the access rights of the file owner. The next three
    characters in the second field indicate the access rights for the filegroup members,
    while the last characters in the third field show access rights for everyone else.
    Note: Details about what that means are in the users, groups, and permissions
    chapter.

    2. `1` – The next is a number used to indicate the file’s number of hard disks.
    We shall discuss file links in upcoming chapters.

    3. `ubuntu` – The next field we see is the username of the owner of the file.
    Because my username is called `Ubuntu`, the owner is hence `Ubuntu`. Try listing
    `/usr` directory and see the difference.

    4. `ubuntu` – This field shows the group owner of the file. We will cover users
    and groups in later chapters.

    5. `4.0k` – This shows the size of files in a human readable format. If you do
    not use the `-h` argument, the size will appear shown in bytes.

    6. `Nov 2 11:15` – The next is the date and time of file modification.

    7. `.bashrc` – This indicated the name of the file.


    # Section 4 Understanding the Filesystem


    Now that we have learned how to explore and navigate the filesystem, we can move
    to the next part: understanding the organizational structure of the Linux filesystem.


    We will start by learning how to view file contents. Then we shall move to how
    Linux organizes everything, including where applications are stored, boot configuration,
    users’ directories, and more, and then finish off with symbolic and hard links.


    As you may recall from earlier chapters, we mentioned that Linux does not require
    file extension to determine files and filetypes. For example, where a normal document
    would have a file extension like `*.pdf`, `*.odt`, or `*.doc`, Linux does not
    require that.


    In this section, we will learn how to view the contents of file using the `file`
    command. To start, create a text file using the command:


    ```bash

    ubuntu@VSALEM:~$ echo “Hello world!”> myfile.txt

    ```


    At the moment, don’t worry about what the commands mean. Next, use the `file`
    command to see the file content.


    ```bash

    ubuntu@VSALEM:~$ file myfile.txt

    myfile.txt: ASCII text

    ```


    Linux then tells you that `myfile.txt` is an ASCII text file, which is true. It’s
    good to note that there are numerous filetypes. In Linux, you will often come
    across the phrase, “In Linux, everything is a file,” which is true. In Linux,
    even directories are types of files.


    ## The less command


    Let us take on another fun Linux command, the `less` command. The `less` command
    is a tool that allows you to view the contents of a file. Do not confuse this
    with the `file` command that shows the type of file.


    In Linux, many files are in raw ASCII text, such as source code files, bash scripts,
    configuration files, and much more. Using the `less` command allows us to view
    and examine what is in these files. In the next section, we will learn how to
    use various tools, including `vi` and `nano`, to edit files but for now, let us
    view what is in them.


    The general syntax for the `less` command is: `less <filename>`


    Using the `less` command, we can view the content of file and scroll up and down
    using up-down arrow keys. If the files’ contents are larger than a single page
    determined by the terminal window, we can use space to navigate to the next page.
    Once done with the file, we use the `Q` key to quit from the file.


    For example, use the `less` command to view a file used to store sources for install
    packages.


    ```bash

    ubuntu@VSALEM:~$ sudo less /etc/apt/sources.list

    ```


    The `less` command works very well when used in combination with keyboard commands.
    The following are some of the keyboard shortcuts to use while working with `less`.


    1. `Spacebar` – Used to scroll to the next page of a file.

    2. `Up Arrow` – used to scroll up one line.

    3. `Down Arrow` – Scrolls down one line at a time.

    4. `Q` – Quits the `less` commands.

    5. `H` – used to display the `less` help menu.

    6. `B` – used to scroll to the previous page.

    7. `G` – Scrolls to the end of the file.

    8. `/characters` – used to Search forward to the next occurrence of a string.


    The `less` command is an improvement of its predecessor command known as `less`.
    Try running the command:


    ```bash

    ubuntu@VSALEM:~$ whatis less

    less (1)             - opposite of more

    ```


    # The Linux Filesystem


    The Linux filesystem is probably the most important section of this book. Hence,
    the book will give you a deep understanding of the Linux filesystem, such as where
    the root directory is, tec. Once you understand the FS, you will be in a position
    to find more commands, read, write, execute files, and so much more. Understand
    this part, and you can work with any Linux distro like a master.


    In most cases, the layout of the Linux filesystem is the same across all Linux
    distribution. Although this is not always the case in all distributions, in most
    cases, the structure is similar and implemented by the Linux Filesystem Hierarchy
    Standard. [https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html](https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html)


    As we explore the filesystem and understand what lies beneath this incredible
    operating system, use your device to these directories practically, use the `file`
    command to examine a fil, and even use the `less` command to see what a certain
    file contains.


    ## Linux Directory Organization


    Here are the Directories found in Linux systems and what each directory is reserved
    to include:


    1. `/` – This is the root directory of a Linux system where everything starts.

    2. `/bin` – The bin directory stores or contains binaries required for the system
    to boot and run.

    3. `/boot` – boot directory contains the Linux kernel, RAM disk image, and the
    required bootloader. You will find files such as `/boot/grub/grub.conf` or `menu`
    on a system that uses grub as the bootloader .lst, Kernel images such as `/boot/vmlinuz`
    etc.

    4. `/dev` – Dev directory contains device nodes. This is a special kind of directory
    used by the kernel to store a list of devices it recognizes.

    5. `/etc` – etc is one of the most important directories in Linux systems. It
    contains a list of system-wide configuration files. `/etc` directory can also
    contain a collection of shell scripts used to launch services during system boot.
    Almost every file in the `/etc` directory is plain text. Common files found in
    this directory include `/etc/passwd` that has a list of user accounts, `/etc/resolv.conf`
    that has the DNS resolver configuration, `/etc/crontab` that has a list of startup
    operations.

    6. `/home` – The home directory has specific directories for each user to prevent
    users from tampering with other directories. However, this is not always the case,
    and you may find special cases where this does not happen.

    7. `/lib` – Lib folder contains a collection of shared library files used by the
    core Linux system. Think of dll directories in Windows.

    8. `/lost+found` – This directory contains all devices and partitions formatted
    in a Linux filesystem such as `ext4` or `ext3`. This directory’s purpose is to
    work in case of a partial recovery from a filesystem event. In most cases, unless
    something terrible happens to your system, this directory is usually empty.

    9. `/media` – We mentioned the media directory in earlier chapters. It is mainly
    used by modern systems to store mount points for removable devices mounted automatically.

    10. `/mnt` – the `/mnt` directory holds devices mounted manually.

    11. `/opt` – the `/opt` directory holds third party software installed on the
    system. If you are using commercial, you will most likely find it here.

    12. `/proc` – This is a special kind of directory and acts as a filesystem. It
    is not a real filesystem in the way files are stored in the disk. The `/proc`
    directory acts as a virtual filesystem maintained by the Linux kernel. It has
    files that allow a view of the kernel. Files stored in the `/proc` directory are
    readable. They give a picture of how the kernel manages the system. For example,
    to view the CPU information, you can use the command `less /proc/cpuinfo`.

    13. `/root` – This directory contains the files for the root user. It is the official
    root home directory.

    14. `/sbin` – The `/sbin` directory is used by the kernel to store system binaries.
    System binaries are critical programs used to carry out vital tasks on the system.
    Linux mainly reserves them for superuser accounts.

    15. `/tmp` – this directory stores temporary or transient files generated by various
    programs. This directory gets cleared upon reboot.

    16. `/usr` – This is another important directory in Linux. It contains programs
    and support files used by all users. This is one of the largest directories in
    the Linux system and contains thousands of files.

    17. `/usr/bin` – This one holds the executable programs that have been installed
    by your Linux distribution.

    18. `/usr/lib` – Contains shared libraries for programs stored in `/bin` directory.

    19. `/usr/local` – This directory contains programs not included by a Linux distribution
    by default but is available for system-wide use. For example, programs compiled
    by users get stored in this directory. Although this directory exists by default,
    it remains empty until privileged users add files to it.

    20. `/usr/sbin` – Used to store system admin programs.

    21. `/usr/share` – The `/share` directory contains shared data used by programs
    in `/bin` directory. You will find some configuration files here, themes, cursors,
    sound files, and more.

    22. `/usr/share/doc` – This directory stores documentation files for most packages
    installed in the system.

    23. `/var` – This directory stores data that constantly changes, such as databases,
    spool files, mail, and more. All other directories in Linux except `/tmp` and
    `/home` are static.

    24. `/var/log` – As the name suggests, the `/log` directory stores log files for
    various system operations. This directory requires constant monitoring as it contains
    critical files for the system. You may require superuser privileges to view log
    files.


    # Section 5: File and Directory Manipulation in Linux


    This section shall discuss the commands that allow us to work with Linux files
    and directories. File and directory operations are very common when working with
    computers, and thus, the commands in this section are essential. As we go through
    the chapter, you will discover that it is easier to move, rename, delete, and
    do file operation using a graphical file manager. However, if you want more control
    and flexibility over what you carry out, the command line provides that power.


    ## Creating Directories – mkdir


    The first command we are going to look at is the `mkdir` command. The `mkdir`
    command creates directories in the current or specified workspace. Here is how
    the `mkdir` command works:


    ```bash

    mkdir directoryName

    ```


    Although it may seem simple enough, the `mkdir` is pretty powerful. You can create
    more than one directory in a single command as:


    ```bash

    mkdir dir1 dir2 dir3 dir4 dir5…dir(n)

    ```


    Once the command gets executed, it creates all the directories passed above as:![](image_rsrc15W.jpg)


    ## Copying Files and Directories – cp Command


    The next command is the `cp` command used to copy files and directories from one
    location to another within a Linux filesystem. `cp` commands support two syntaxes:


    ```bash

    cp file1 file2 or dir1 dir2

    ```


    This syntax copies `file1` or `dir1` to `file2` or `dir2`. This comes in handy
    when working with single items or a single directory.


    The next syntax for the `cp` command is:![](image_rsrc15X.jpg)


    In this case, the `cp` command copies all the specified files from the current
    directory to the specified directory. The `cp` command has a wide selection of
    options that you can use to manipulate how and what the command does. Although
    we will not discuss all of them, here are options worth mentioning.


    1. `-a` or `--archive` – Using the `cp` command using the `--archive` option allows
    you to copy files and directories with all their respective attributes and permissions.
    Without the argument, the copy command uses the permissions of the user carrying
    out the copy command. For example, if the `ubuntu` user owned the copied file,
    and `root` performed the copy, `root` owns the file. Be careful with this.

    2. `-i` or `--interactive` – The interactive argument enables the `cp` command
    to prompt the user before overwriting a file. By default, `cp` will automatically
    and silently overwrite a file.

    3. `-v` or `--verbose` – As the name suggests, Verbose suggests shows informative
    messages as each file and directory gets copied.

    4. `-r` or `--recursive` – Allows the `cp` command to recursive copy files and
    directories. This command gets plenty of use and is an almost-must when copying
    directories.

    5. `-u` or `--update` – The update argument is very effective. It tells the command
    that update.


    ## Moving, Renaming Files and Directories – mv command


    The next command is the `mv` command, which allows us to move or rename files
    and directories. The general syntax is:


    ```bash

    mv file1 file2

    ```


    This syntax moves `file1` or `dir1` to `file2` or `dir2`. This comes in handy
    when working with single items or a single directory.


    The next syntax for the `mv` command is:


    ```bash

    mv file1 file2…dir(n) destination

    ```


    In this case, the `mv` command moves all the specified files from the current
    directory to the destination directory.


    ## Deleting Files and Directories – rm command


    Finally, we have the `rm` command. `rm` command deletes files and directories.
    The general syntax is:


    ```bash

    rm file2 or directory2

    ```


    Depending on how and where you use the command, the `rm` command can be very dangerous.
    Linux does not offer an undelete command, and once a delete action occurs using
    `rm`, it is gone! To delete a single file, use:


    ```bash

    rm file1

    ```


    To delete a directory and its contents, use the recursive flag:


    ```bash

    rm -r directory1

    ```


    The `rm` command also supports various arguments that include:


    1. `-f` or `--force` – This option helps ignore nonexistent files and arguments
    and never prompt

    2. `-i` or `--interactive` – Prompts the user before deleting any existing files.
    Cannot be used along with the `--force` argument.

