- fmt: "\nSince you now know the most important terms, let’s get started with our\
    \ first command in Linux. If you are using a virtual machine or dual boot, open\
    \ the Applications menu, and search for the terminal. For WSL users, launch the\
    \ Ubuntu application; you should drop into a shell immediately. Once in the shell,\
    \ you should see something like this:\n\n```\nubuntu@VSALEM:~$\n```\n\nWe call\
    \ that a shell prompt; it indicates that the shell is ready to access commands\
    \ and execute them. The shell prompt may vary depending on your distribution but\
    \ mainly includes your `username@machinename`, followed by a dollar sign `$`.\
    \ If you have a pound sign `#` rather than a dollar sign `$`, it means you are\
    \ running the shell session with superuser privileges. That means you have logged-in\
    \ in as a superuser or launched a terminal that includes root privileges.\n\n\
    If the terminal is ready and all things look good, let us try to enter some rubbish\
    \ text and see what happens.\n\n```\nubuntu@VSALEM:~$ dfsskdhd\n```\n\nSince the\
    \ command entered does not make any sense to the shell, it shall give you an error\
    \ and provide a prompt to enter another command.\n\n```\nubuntu@VSALEM:~$ dfsskdhddfsskdhd:\
    \ command not found\nubuntu@VSALEM:~$\n```\n\n## The Command Line History\nThe\
    \ shell gives us the ability to view all the commands we execute. We can view\
    \ this by pressing the up or down arrow key. This feature is called The command\
    \ Line History; it can store over 500 commands.\n\n## Simple Commands\nSince we\
    \ have verified that the terminal and shell are working, let us execute valid\
    \ commands. The first command we are going to type is `pwd`, used to print the\
    \ current working directory.\n\n```\nubuntu@VSALEM:~$ pwd\n/home/ubuntu\n```\n\
    \nThe command tells us that we are in the `/home/ubuntu` directory—we’ll learn\
    \ more about directories in upcoming chapters. Try another command such as `free`\
    \ to see the total amount of free memory in your system.\n\n```\nubuntu@VSALEM:~$\
    \ free\ntotal             used        free      shared buff/cache    available\n\
    Mem:             4127084      2684684      1213048      17720      229352    \
    \  1308668\nSwap:            12582912      164640      12418272\n```\n\nOnce done\
    \ with our terminal session, we can close it by terminating the terminal window\
    \ or using the shell prompt’s `exit` command.\n\n```\nubuntu@VSALEM:~$ exit\n\
    ```\n\n**NOTE**: Even when you are running a terminal session as a user, various\
    \ terminal sessions are always running in the background. These terminal sessions\
    \ are known as virtual consoles and are accessible by pressing `CTRL + ALT + F1`.\n\
    \n## Section 3: Navigating the Filesystem\nIn this chapter, we will learn how\
    \ to navigate the Linux filesystem using the command line. Navigating the filesystem\
    \ using the command line is an essential skill as most of the time, you will be\
    \ working with files.\n\nNow, before jumping directly into the terminal, let us\
    \ talk about Linux Filesystem. Linux and all other Unix-like Operating systems\
    \ use the hierarchical directory file structure. The hierarchical directory structure\
    \ is where directories and files have a tree-like filesystem or organizational\
    \ structure. Directories are also known as folders.\n\nThe first directory in\
    \ the hierarchical structure is called the root directory. The root directory\
    \ also contains subdirectories and other files within it. These subdirectories\
    \ also contain other directories and files and so on.\n\nYou can learn more about\
    \ HFS here:\n[https://en.wikipedia.org/wiki/Filesystem_Hierarchy_Standard](https://en.wikipedia.org/wiki/Filesystem_Hierarchy_Standard)\n\
    [https://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/Linux-Filesystem-Hierarchy.html](https://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/Linux-Filesystem-Hierarchy.html)\n\
    \nFor Windows-like systems, you will find each specific filesystem structure for\
    \ each storage device. In Linux, a single system contains a single filesystem\
    \ structure despite the number of storage devices connected. Each storage device\
    \ connected gets mounted on a certain point in the filesystem.\n\n### The Current\
    \ Working Directory\nThose used to working with the graphical system navigate\
    \ the directory easily as it’s just going up and down. However, the terminal does\
    \ not provide a graphical method to access files and directories, making navigating\
    \ the Linux Filesystem not easy. It’s a complex system, and without knowing where\
    \ we are or where we want to go, we can’t do much.\n\n**NOTE**: At each point\
    \ in the terminal, you are inside a specific directory. Some terminals may show\
    \ you which directory you are in at that moment.\n\nWe can view which directory\
    \ we are in by using the `pwd` command. Unless you navigate to a different location\
    \ in the file system once you launch a terminal session, your current directory\
    \ is your home directory. Each account in Linux is assigned their home directory\
    \ where that specific account is allowed to read, write and execute files in that\
    \ directory.\n\nA root user or users in `sudo` group can access all files and\
    \ directories within the filesystem.\n\n### Listing Files and Directories\nTo\
    \ list files and directories within the current working directory, we use the\
    \ `ls` command.\n\n```\nubuntu@VSALEM:~$ ls\nDesktop Documents Music Pictures\
    \ Public Templates Videos\n```\n\nThe `ls` command is an amazing command that\
    \ you can use to do more than list files and directories of the current directory.\
    \ We will discuss the `ls` command a bit more deeply in later sections.\n\n###\
    \ Moving Between Directories\nTo move between directories, i.e., from our current\
    \ directory within the filesystem to another location in the filesystem, we use\
    \ the `cd` command. The `cd` command is followed by the pathname of the directory\
    \ we want to navigate to. A pathname refers to the directories or subdirectories\
    \ we navigate to get to that directory. \n\nIf that sounds confusing, here’s a\
    \ simpler explanation: Consider an instance where we want to navigate to a directory\
    \ called music. To get there, first, we go to home, then the username, then Downloads,\
    \ and then music. The pathname is thus `/home/username/Downloads/Music`. Pathnames\
    \ can be provided in two ways, i.e., Relative and Absolute pathways. Let us discuss\
    \ the difference between these pathname styles:\n\n#### 1: Absolute Pathnames\n\
    Absolute pathnames are very common when working with Linux directories. They mainly\
    \ begin with the root directory (uppermost directory) and follow the tree (subdirectories)\
    \ branch by branch to the target location. An example of an absolute path is the\
    \ one shown above.\n\nLet us talk about where devices get mounted. In Linux, devices\
    \ are mounted under specific directories. For example, to see the root directory,\
    \ use `cd /`. To go back, use `cd`.\n\n#### 2: Relative Pathnames\nRelative pathnames\
    \ start from the current working directory. Unlike absolute pathnames, they do\
    \ not begin with the root `/`. They use special symbols to indicate positions:\n\
    - `.` represents the current directory.\n- `..` represents the parent directory.\n\
    \nFor example, to move to the `music` folder in the current directory, you would\
    \ use `cd music`. To go up one level, you use `cd ..`.\n"
