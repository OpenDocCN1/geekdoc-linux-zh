    `-l` 参数更改了文件和目录的列表格式，并提供了更详细的信息。例如：


    ![](img/image_rsrc15S.jpg)


    不要担心这些细节的具体含义，我们将在接后的章节中介绍它们，但从上面的输出中，我们获得了关于相同文件的更多详细信息。这引出了关于命令的一个基本概念。Linux
    中的大多数命令都使用我们所说的“参数”（arguments）。参数是用于修改命令行为的额外选项（如所示）。


    在某些情况下，选项（options）和参数可能意味着两种不同的意思。例如，一个管理无线设备的命令可能接受设备名称作为选项，并接受另一个参数来修改其操作。参数和选项的通用语法为：


    `command -option argument`


    大多数命令都有参数，包括一个以连字符（`-`）符号符号开头的单个字母，例如 `ls -l`。这些参数还可以使用单个连字符组合在一起，如下例所示：


    ![](img/image_rsrc15T.jpg)


    通过上述命令，`ls` 命令使用 `-al` 参数被修改，以特定的格式列出文件，并包含隐藏文件和目录。你还可以使用 `--reverse` 参数修改文件和目录的排序顺序。


    ![](img/image_rsrc15U.jpg)


    如你所示，文件列表顺序现在是反的，按字母降序排列。你还记得我们提到过一个命令如何占据一整章吗？`ls` 就是其中一个命令。在这里，我们不再深入探讨。请查看
    `ls` 手册以获取更多信息：[`man7.org/linux/man-pages/man1/ls.1.html`](https://man7.org/linux/man-pages/man1/ls.1.html)


    相反，我们将列出 `ls` 最常用的参数，包括：


    1. `-a` 或 `--all` – 该参数列出所有文件和目录，包括隐藏文件（以点开头的文件），这些文件在普通的 `ls` 命令下是不列出的。

    2. `-t` – `-t` 参数按修改日期对文件排序。

    3. `-d` 或 `--directory` – 该参数与 `-l` 参数结合使用，列出目录本身的详细信息而不是其内容。

    4. `-r` 或 `--reverse` – 如我们所见，`--reverse` 命令反序列出文件。在普通的 `ls` 命令中，文件和目录按字母升序显示。

    5. `-l` – 用于以长格式列出文件和目录。

    6. `-F` 或 `--classify` – 分类参数在文件或目录的末尾放置一个指示字符。例如，它会在目录后添加正斜杠（`/`）。

    7. `-h` 或 `--human-readable` – `-h` 参数与 `-l` 参数结合使用，以人类可读的格式显示文件和目录的大小。即以 KB、MB、GB
    等单位，而不是字节。

    8. `-S` – `-S` 参数按文件大小对文件和目录进行排序。

