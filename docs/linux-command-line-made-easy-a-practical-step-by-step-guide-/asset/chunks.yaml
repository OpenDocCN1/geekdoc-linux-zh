    start menu and launch the Disk management tool.On the partition you want to create
    some space, right-click and select Shrink Volume. Provide the amount of space
    to allocate to the partition; the recommendation is more than 10GB of storage.Once
    completed, reboot your machine and select your boot devices as the USB device
