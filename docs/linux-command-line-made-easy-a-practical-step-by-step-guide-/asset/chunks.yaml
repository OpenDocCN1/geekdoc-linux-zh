    also contains subdirectories and other files within it. These subdirectories also
    contain other directories and files and so on.You can learn more about HFS here:[https://en.wikipedia.org/wiki/Filesystem_Hierarchy_Standard](https://en.wikipedia.org/wiki/Filesystem_Hierarchy_Standard)[https://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/Linux-Filesystem-Hierarchy.html](https://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/Linux-Filesystem-Hierarchy.html)For
    Windows-like systems, you will find each specific filesystem structure for each
    storage device.In Linux, a single system contains a single filesystem structure
    despite the number of storage devices connected. Each storage device connected
    gets mounted on a certain point in the filesystem.The Current Working DirectoryThose
    used to working with the graphical system navigate the directory easily as it’s
    just going up and down.However, the terminal does not provide a graphical method
    to access files and directories, making navigating the Linux Filesystem not easy.
    It’s a complex system, and without knowing where we are or where we want to go,
    we can’t do much.NOTE: At each point in the terminal, you are inside a specific
    directory. Some terminals may show you which directory you are in at that moment.We
    can view which directory we are in by using the pwd command. Unless you navigate
    to a different location in the file system once you launch a terminal session,
    your current directory is your home directory. Each account in Linux is assigned
    their home directory where that specific account is allowed to read, write and
    execute files in that directory.A root user or users in sudo group can access
    all files and directories within the filesystem.Listing Files and DirectoriesTo
    list files and directories within the current working directory, we use the ls
    command.ubuntu@VSALEM:~$ lsDesktop Documents Music Pictures Public Templates VideosThe
    ls command is an amazing command that you can use to do more than list files and
    directories of the current directory. We will discuss the ls command a bit more
    deeply in later sections.Moving Between DirectoriesTo move between directories.
    i.e., from our current directory within the filesystem to another location in
    the filesystem, we use the cd command. The cd command is followed by the pathname
    of the directory we want to navigate to. A pathname refers to the directories
    or subdirectories we navigate to get to that directory.If that sounds confusing,
    here’s a simpler explanation:Consider an instance where we want to navigate to
    a directory called music. To get there, first, we go to home, then the username,
    then Downloads, and then music. The pathname is thus /home/username/Downloads/Music.Pathnames
    can be provided in two ways, i.e., Relative and Absolute pathways.Let us discuss
    the difference between these pathname styles:1: Absolute PathnamesAbsolute pathnames
    are very common when working with Linux directories. They mainly begin with the
    root directory (uppermost directory) and follow the tree (subdirectories) branch
    by branch to the target location.An example of an absolute path is the one shown
    above.Let us talk about where devices get mounted in Linux. The path to where
    devices get mounted by default is /media/username/<name of storage device>. That
    means that, from the root directory indicated by /, we go to the media directory,
    then username directory, and finally, the device name. If you want to see the
    top directory, cd into / to view all the files.![](image_rsrc15M.jpg)Depending
    on the distribution you are using, you may get additional or fewer directories
    than those shown above.You may notice that once we navigate to a specific directory,
    the shell prompt style changes appending the current path before the dollar sign.For
    example, change directory to /usr/share using the command cd /usr/shareubuntu@VSALEM:/$
    cd /usr/shareubuntu@VSALEM:/usr/share$2: Relative PathnamesRelative pathnames
    are the other type of pathnames in Linux. Unlike absolute pathnames where you
    start at the root directory, relative pathnames start at the current working directory. To
    achieve this, relative pathnames use special symbols to indicate relative positions
    in the filesystem. These symbols include the dot (.) and the dot dot (..)The dot
    symbol represents the current working directory while the dot dot symbol represents
    the working directory parent.Let us see how it works.In your terminal, navigate
    to /usr/share or any directory where you have read permission.ubuntu@VSALEM:~$
    cd /usr/share/ubuntu@VSALEM:/usr/share$ pwd/usr/shareSuppose we want to go to
    the parent directory of share, which is /usr? We can either use the absolute path
    and cd /usr or use the relative path by entering the command cd ..Now the question
    becomes, which should you use? The answer is the one that requires less typing.For
    example:Let us assume you are in your /home folder. To go to /usr/share we can
    go using cd /usr/share or cd ../../usr/shareNOTE: If you do not include the .
    (representing the current directory), the shell automatically includes itFor example:ubuntu@VSALEM:~$
    cd /usrubuntu@VSALEM:/usr$ cd shareubuntu@VSALEM:/usr/share$ cd ..ubuntu@VSALEM:/usr$
    cd ./shareubuntu@VSALEM:/usr/share$That means if the working directory is not
    specified, the shell automatically assumes.Tips and Notes about Linux FilesystemHere’re
    some tips and pointers on working with the Linux filesystem:1.    Use the cd command
    to go back to your home directory in an instance.2.    cd - - The cd command with
    the dash (-) argument takes you back to the previous working directory.3.    cd
    ~ - Changes to the directory of the username specified.4.    Filenames in Linux
    are case sensitive. Thus, Directory and directory are two different files.5.   
    Avoid using spaces while naming files and directories. Although Linux does support
    spaces, use underscores, dots or dashes because navigating directories with spaces
    is very hard. Here’s an example:ubuntu@VSALEM:~$ cd This\ directory\ has\ spaces/ubuntu@VSALEM:~$
    cd This.Dir.Has.Spaces/6.    Linux contains hidden files that start with a dot
    (.). To view hidden files and directories, use ls -a, which includes the hidden
    attribute.![](image_rsrc15N.jpg) Linux does not contain or recognize the concept
    of file extensions. However, that does not mean that if Linux does not, programs
    running in Linux don’t.ls Command Deep DiveAs you continue to work with Linux,
    you will realize that ls is probably one of the most used commands. That is perhaps
    for a good reason because it provides you with the ability to view files and directories,
    their attributes and permissions, and much more.In this subsection, we shall delve
    deeper into the ls command and its arguments and learn how to use them.Up to now,
    we have covered how to list files and directories within our current working directory.Apart
    from the current directory, we can specify which directory to list without moving
    into it.For example:![](image_rsrc15P.jpg)From the above command, we can see the
    contents of the /usr/share directory directly from the home directory.You can
    also list more than one directory using a single command, shown below:![](image_rsrc15R.jpg)The
    command above lists files and directories in both the home directory (~) and /usr
    directory.We can also pass some more arguments to the ls command to get more details
    about the files and directories.'
