    \ owner\n* `g` – group owner\n* `–` – Others or world\n* `a` – all; meaning the\
    \ combination of user, group and world\n\nIf no character is specified, all is\
    \ assumed, and changes apply to users, groups, and the world. The operation to\
    \ be carried out gets specified in three main characters, i.e., `+` (plus), `–`\
    \ (minus), and `=` (equals). The `+` indicates that you should add permission.\
    \ A `–` indicates permission should be removed, and `=` means that only the specified\
    \ permissions should apply with others removed. The permissions to be applied\
    \ get specified in three letters, `r` (read), `w` (write), and `x` (execute).\
    \ Here are some symbolic notation examples:\n\n1. `u+r` – Gives file owners read\
    \ permission\n2. `u+x` – Gives file owners execute permission\n3. `u-w` – Removes\
    \ write permissions for the file owner.\n4. `+x` – Adds the execute permission\
    \ for owner, group, and world.\n5. `u+x,go=rx` – Gives files owners execute permission.\
    \ It also sets read and execute group permissions—and others. Commas can separate\
    \ multiple specifications\n\n### Octal Notation\n\nOctal notation, as the name\
    \ suggests, uses octal values to indicate wanted permissions patterns. You can\
    \ learn more about Octal at `https://www.tutorialpoint.com/linux/file_permissions.html`\
    \ (https://www.tutorialpoint.com/linux/file_permissions.html) or `https://www.wikipedia.org/wiki/File_permissions`\
    \ (https://www.wikipedia.org/wiki/File_permissions).\n"
  raw: '*   u – file owner


    *   g – group owner


    *   – Others or world


    *   a – all; meaning the combination of user, group and world


    If no character is specified, all is assumed, and changes apply to users, groups,
    and the world.The operation to be carried out gets specified in three main characters,
    i.e., + (plus), – (minus), and = (equals). The plus indicates that you should
    add permission. A minus indicates permission should be removed, and equals means
    that only the specified permissions should apply with others removed.The permissions
    to be applied get specified in three letters, r (read), w (write), and x (execute).Here
    are some symbolic notation examples:


    1.  u+r – Gives file owners read permission


    2.  u+x – Gives file owners execute permission


    3.  u-w – Removes write permissions for the file owner.


    4.  +x – Adds the execute permission for owner, group, and world.


    5.  u+x,go=rx – Gives files owners execute permission. It also sets read and execute
    group permissions—and others. Commas can separate multiple specifications


    Octal NotationOctal notation, as the name suggests, uses octal values to indicate
    wanted permissions patterns. You can learn more about Octal (base 8) here:[https://www.tutorialspoint.com/octal-number-system](https://www.tutorialspoint.com/octal-number-system)[https://en.wikipedia.org/wiki/Octal#:~:text=The%20octal%20numeral%20system%2C%20or,for%20decimal%2074%20is%201001010](https://en.wikipedia.org/wiki/Octal#:~:text=The%20octal%20numeral%20system%2C%20or,for%20decimal%2074%20is%201001010)
    .Because every octal number digit represents three binary digits, this plots efficiently
    to the structure adopted when storing the file mode. The following are the octal
    representations and their meaning.


    *   0 – no read, write, or execute permission—represented as 000 in binary and
    --- as a symbolic file permission block.


    *   1 – Execute permission only—represented as 001 in binary and --x as a symbolic
    file permission.


    *   2 – Read permission only—represented as 010 in binary and -w- as a symbolic
    file permission.


    *   3 – Write and Execute permission—represent in binary notation as 011 and -wx
    as symbolic file permission.


    *   4 – Read permission only—represented as 100 in binary and r-- in symbolic.


    *   5 – Read and execute—represented in binary 101 and r-x in symbolic.


    *   6 – Read and Write permission—represented as 110 in binary and rw- in symbolic
    notation.


    *   7 – Read, write, and execute permissions. 111 in binary representation and
    rwx in symbolic.


    We can use three octal digits to set and define the file mode for various owners
    and the world. For example:ubuntu@VSALEM:~$ chmod 777 myfile.txtubuntu@VSALEM:~$
    ls -l myfile.txt-rwxrwxrwx 1 ubuntu ubuntu 0 Nov 3 09:30 myfile.txtBecause of
    passing the octal value 777, we could set read, write, and execute for all, i.e.,
    users, groups, and everyone.Set Default Permissions – umask commandThe umask command
    allows you to control the default permission assigned to a file upon creation.
    umask uses octal notation to represent a mask of the bit removed from a file mode’s
    attributes. For example:![](image_rsrc16J.jpg)We begin by cleaning any existing
    copies of the file using the rm -rf myfile.txt command.Next, we executed the umask
    command without any arguments to view the current value that corresponds to a
    value 0022 (you will often find 0002 too), which is an octal notation of our mask.Finally,
    we create a new instance of the file and look at the default permissions.Sudo
    and su UsersThe su and sudo commands are very useful while working with Linux.Let
    us start with su and discuss what it does.The su command starts a new shell session
    as another user. The general syntax for the command is:su [-[l]] [user]If you
    call the su command with the -l argument, the shell provides a login shell for
    the specified user. That means the user’s environment gets loaded, and the working
    directory changes to the user’s home dir. If the user to login to is not specified,
    it defaults to the superuser or root account. It is also possible to substitute
    the -l argument with –For example, to log in as root, we use the command:ubuntu@VSALEM:~$
    su -Password:root@VSALEM:~#The command above prompts for the root user account’s
    password, and if correct, we login as the superuser account, indicated by the
    pound sign and the username in the shell prompt. To exit from a shell session,
    we use the exit command.You can also run a single command as a superuser without
    having to log in as root. For example:![](image_rsrc16K.jpg)Another way to execute
    commands as another user is by using the sudo command. It is similar to su but
    provides a lot more functionalities.The superuser can configure sudo account,
    allowing another user to execute commands as other users (mostly the root user).Sudo
    makes it possible to restrict some users to certain commands. For example, a user
    working with networking and processes can operate under restriction to these commands,
    allowing him to do that specifically without interacting with other administrative
    commands.Unlike su where a user requires a root account to log in into the shell,
    sudo requires a user to provide an account’s password. However, the user should
    be in the group known as sudoers to run commands as sudo .Changing File Owners
    – chown commandTo change the owner of a file or directory, we use the chown command.
    Chown, however, requires superuser privileges either using su or sudo .The general
    syntax for the command is:chown [Option]... [Owner][:[Group]] FileExamples:![](image_rsrc16M.jpg)You
    may encounter systems that use the command chgrp to change the group of a file.Changing
    Users password – passwd commandThe last concept in this chapter and book is how
    to change your password and other users’ passwords using superuser privileges.To
    change or set a password for a specific user account, we use the command passwd
    .The general syntax for the command is:passwd [user ]To change the password for
    the current user, simply enter the command passwd without arguments, which will
    prompt you to enter a new password.Depending on the system, passwd may require
    you to use a strong password and reject passwords that are too weak or similar
    to previously set passwords. To change a password for another user, use the passwd
    command with sudo or su .Check manual pages for the command to learn more about
    the arguments available.ConclusionWhen it comes to mastering the Linux command
    line, the only secret is practicing, practicing, practicing some more, and learning
    hungrily.This is only a beginner’s guide, meaning we left many advanced concepts
    untouched—we have barely scratched the surface of what the Linux command line
    can do.Check out the /usr/bin directory to see for yourself.PS: I’d like your
    feedback. If you are happy with this book, please leave a review on Amazon.Please
    leave a review for this book on Amazon by visiting the page below:[https://amzn.to/2VMR5qr](https://amzn.to/2VMR5qr)'
