    * `u` – 文件所有者

    * `g` – 组所有者

    * `–` – 其他人或世界

    * `a` – 所有；意味着用户、组和世界的组合


    如果未指定字符，则默认为所有，且更改将适用于用户、组和世界。要执行的操作由三个主要字符指定，即 `+`（加号）、`–`（减号）和 `=`（等号）。`+` 表示您应该添加权限。`–`
    表示应该移除权限，而 `=` 表示只应用指定的权限，并移除其他权限。要应用的权限由三个字母指定，`r`（读）、`w`（写）和 `x`（执行）。这里是一些符号表示法的示例：


    1. `u+r` – 赋予文件所有者读取权限

    2. `u+x` – 赋予文件所有者执行权限

    3. `u-w` – 移除文件所有者的写 权限。

    4. `+x` – 为所有者、组和世界添加执行  权限。

    5. `u+x,go=rx` – 赋予文件所有者执行权限。它还设置了组和其他人的读取和执行 权限。逗号可以分隔多个指定。


    ### 八进制表示法


    八进制表示法顾其实名，使用八进制值表示所需的权限模式。您可以在 `https://www.tutorialpoint.com/linux/file_permissions.html`
    (https://www.tutorialpoint.com/linux/file_permissions.html) 或 `https://www.wikipedia.org/wiki/File_permissions`
    (https://www.wikipedia.org/wiki/File_permissions) 学习更多关于八进制的知识。


    要执行的操作由三个主要字符指定，即 `+`（加号）、`–`（减号）和 `=`（等号）。`+` 表示您应该添加权限。`–` 表示应该移除权限，而 `=` 表示只应用指定的权限，并移除其他权限。


    要应用的权限由三个字母指定，`r`（读）、`w`（写）和 `x`（执行）。这里是一些符号表示法的示例：


    1. `u+r` – 赋予文件所有者读取权限

    2. `u+x` – 赋予文件所有者执行权限

    3. `u-w` – 移除文件所有者的写 权限。

    4. `+x` – 为所有者、组和世界添加执行  权限。

    5. `u+x,go=rx` – 赋予文件所有者执行权限。它还设置了组和其他人的读取和执行 权限。逗号可以分隔多个指定。


    要执行的操作由三个主要字符指定，即 `+`（加号）、`–`（减号）和 `=`（等号）。`+` 表示您应该添加权限。`–` 表示应该移除权限，而 `=` 表示只应用指定的权限，并移除其他权限。


    `go=rx` – 赋予文件所有者执行权限。它还设置了组和其他人的读取和执行 权限。逗号可以分隔多个指定。


