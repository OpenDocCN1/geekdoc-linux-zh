- fmt: "\n![](image_rsrc154.jpg)\n\n# Linux Command Line Made Easy\nA Practical, Step\
    \ By Step Guide To Linux Commands For Beginners And Intermediates\nCraig Berg\n\
    \n## Introduction\nWelcome to the Linux Command Line Guide For Beginners, and\
    \ thank you for choosing this book as your pass to the Linux world. Please note\
    \ that this book is for beginners at Linux, not power users. Whether you are coming\
    \ from a version of Windows or OSx or giving Linux a try, this book will be invaluable\
    \ to you.\n\nHowever, while this book is indeed very beginner-friendly, it will\
    \ not take you from a novice to a Linux command Line master in one night. That’s\
    \ because the Linux Command Line is vast and challenging to master, especially\
    \ for beginners. Learning it requires a great deal of determination and effort\
    \ not because the Linux command line is complex or requires genius-level IQ, but\
    \ because it’s large and contains hundreds if not thousands of commands. \n\n\
    In all honesty, we can dedicate a single chapter to one command and all its arguments.\
    \ Nevertheless, the command line is a fundamental tool for Linux users. The command\
    \ line brings you every possible tool to work with in the ins and outs of your\
    \ operating system with just a keyboard. If you are skeptical about this, follow\
    \ the book, and you will realize real power.\n\nThe book has an efficient organizational\
    \ structure:\n\n1. The first chapter gives you the basics and must-know elements\
    \ of working with the Linux Command line.\n2. In the second chapter, we shall\
    \ look at Linux configuration and where config files of applications are stored,\
    \ and how to manage them.\n3. In the third chapter, we shall dive into the Linux\
    \ tools and common commands you will find yourself using most of the time as you\
    \ work with the command line.\n4. Finally, we will conclude with a discussion\
    \ on Linux permissions, groups, and more.\n\nIn simple terms, Linux and Linux\
    \ command line is amazing because it opens many opportunities for you. In this\
    \ beginners’ book, we do not assume you have any programming knowledge. That’s\
    \ why the book will walk you through every step. Read the book from start to finish\
    \ because its structure is a lot like a syllabus and less like a quick reference\
    \ guide. All you need is a computer and internet access for Linux installation—more\
    \ on that later. Once you have what you need, we can get started with the installation\
    \ and hands-on typing command lines, the fun part!\n\nPS: I’d like your feedback.\
    \ If you are happy with this book, please leave a review on Amazon. Please leave\
    \ a review for this book on Amazon by visiting the page below: [`https://amzn.to/2VMR5qr`]\n\
    \n## Table of Content\n- [Introduction](#\n- [Section 1](#\n    - [Linux Installation](#\n\
    \    - [Guide](#\n        - [How to Choose A Linux Distribution](#\n        -\
    \ [Installing Linux on Windows: Virtualization.](#\n        - [Installing Linux\
    \ on Windows: Dual Boot](#\n        - [Installing Linux on Windows: WSL](#\n \
    \       - [Installing Linux on Mac OSx: Virtual Machine](#\n- [Section 2](#\n\
    \    - [Linux Command, Terminal, and Shell](#\n    - [Linux Dictionary](#\n  \
    \  - [The Command Line History](#\n    - [Simple Commands](#\n- [Section 3](#\n\
    \    - [Navigating the Filesystem](#\n    - [The Current Working Directory](#\n\
    \    - [Tips and Notes about Linux Filesystem](#\n    - [`ls` Command Deep Dive](#\n\
    - [Section 4](#\n    - [Understanding the Filesystem](#\n    - [The `less` command](#\n\
    \    - [The Linux Filesystem](#\n- [Section 5](#\n    - [File and Directory Manipulation\
    \ in Linux](#\n    - [Creating Directories – `mkdir`](#\n    - [Copying Files\
    \ and Directories – `cp` Command](#\n    - [Moving, Renaming Files and Directories\
    \ – `mv` command](#\n    - [Deleting Files and Directories – `rm` Command](#\n\
    \    - [Wildcards](#\n    - [Soft and Hard Links](#\n- [Section 6](#\n    - [Commands\
    \ for Working With Commands](#\n    - [Commands: Simple definition](#\n    - [Identifying\
    \ Commands](#\n    - [Creating Custom Commands](#\n    - [Permissions](#\n   \
    \ - [Owners, Groups, and Others](#\n    - [Read, Write, and Execute File Permissions](#\n\
    \    - [Changing File Modes – `chmod` command](#\n    - [Set Default Permissions\
    \ – `umask` command](#\n    - [`Sudo` and `su` Users](#\n    - [Changing File\
    \ Owners – `chown` command](#\n    - [Changing Users password – `passwd` command](#\n\
    \    - [Conclusion](#\n\n## Section 1: Linux Installation\n### Guide\nThe first\
    \ thing we will do before diving into the command line is getting your system\
    \ setup. For Windows or PC users, you have three available options that allow\
    \ you to run Linux on any system running Microsoft office. We will cover each\
    \ option individually in the upcoming sections.\n\nThese available options for\
    \ PC users include:\n\n* Using Linux as Dual Boot with Windows,\n* Installing\
    \ Linux on a Virtualization software,\n* Windows subsystem for Linux (`WSL`) features\
    \ and finally\n* Using Live Media such as USB or DVDs.\n"
