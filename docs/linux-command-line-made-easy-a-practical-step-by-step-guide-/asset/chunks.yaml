    对于 Mac OS 用户，你可以使用与 Linux 双启动、使用虚拟化软件，或选择启动介质。让我们开始吧。


    # 如何选择 Linux 发行版


    本节介绍了如何选择合适的 Linux 发行版。Linux 发行版通常称为 `distro`，是基于原生 Linux 内核构建的 Linux 操作系统的不同“口味”，用于满足各种用例和偏好。


    由于所有发行版都是基于 Linux 的，它们往往非常相似，因此可以互换使用。例如，像 `Ubuntu` 这样的发行版因为其易于使用并且能够为用户抽象化小型配置任务而最受欢迎。而像
    `Arch Linux` 这样的发行版并不提供相同的功能，如果你想对系统拥有更多控制并对其进行调整以适应你的需求，它更合适。


    如果你是 Linux 初学者，请选择 `Debian` 类的发行版，如 `Ubuntu` 或 `Linux Mint`；本书也支持如 `Manjaro` 等
    `Arch` 发行版。请不要将此推荐意味着这些发行版是专为初学者设计的。本书推荐这些 `distros` 是因为它们为新用户提供了一个熟悉的环境。


    # 在 Windows 上安装 Linux：虚拟化


    我们将为 PC 用户探索的第一种方法是使用虚拟化软件。这是最简单的方法，因为它不需要你更改任何系统配置或设置。你只需要一个简单易用的软件。


    第一步是下载你 Linux 发行版的 `iso` 文件。对于本书，我们将选择 `Ubuntu 20.04.1`——这是编写本书时的当前版本。打开浏览器，导航到下面的资源链接，并下载
    `Ubuntu` `iso`。[`ubuntu.com/`](https://ubuntu.com/)


    接下来，我们需要获取虚拟化软件。我们将使用 `Oracle VirtualBox`，因为它容易安装和使用。你也可以选择其他工具，如 `VMware`、`KVM`
    或 `Hyper-V`。打开浏览器，导航到下面的资源链接，下载最新版本的 `VirtualBox`。[`www.virtualbox.org/`](https://www.virtualbox.org/)


    **注意**：你将必须启用虚拟化技术 (`VT-X`) 来运行任何虚拟化软件。请查看网页如何为你的特定设备启用虚拟化。


    一旦下载了 `VirtualBox` 安装程序，启动它并按照典型的 Windows 安装过程进行。确保在安装过程中选择所有的功能，如下所示![](img/image_rsrc155.jpg)


    在安装过程中，设置程序可能会提示你安装 `Oracle USB driver`。选择 `install`。(image_rsrc156.jpg)


    软件设置完成后，我们就可以开始安装 `Ubuntu` 或你的 Linux 发行版。在大多数情况下，你选择的发行版将提供安装指南。请检查你特定发行版的指南。


    一旦你启动 `VirtualBox`，你将得到一个与下面所示类似的窗口![](img/image_rsrc157.jpg)


    接下来，点击 `New`（新建），这将启动一个要求你提供操作系统基本详细信息的对话框。输入 `VirtualBox` 的名称——可以提供任何合适的名称。在这种情况下，我们将将其命名为
    `Ubuntu`。


    接下来，在你的文件系统中选择你想要存储虚拟机文件的位置。你可以保持默认设置。接下来，从下拉菜单中选择类型。如果你为流行的操作系统提供了名称，`VirtualBox`
    应该会检测到 `Type`（类型）和 `Version`（版本）。如果没有发生这种情况，请选择类型为 `Linux`，类型为 `Ubuntu_64`。对于所有
    `Debian` 派生版选择 `Debian`，对于基于 `Arch` 的 `distros` 选择 `Arch`![](img/etcher)!image_rsrc15F.jpg


    一旦获取了安装程序，安装并启动以开始过程。一旦你启动 `Balena`，你将得到一个与下面所示类似的窗口 image_rsrc15G.jpg


    在上面的窗口中，选择 `Flash from File`（从文件闪存）选项。这样做将提示你提供我们下载的 `Ubuntu` 镜像的位置。接下来，将闪存盘插入计算机；`BalenaEtcher`
    应该会自动检测到它。如果你连接了多个设备，从 `Target`（目标）菜单选择正确的设备。一旦选择，点击 `Flash`（闪存）开始刻录过程。**注意**：这将擦除你的
    USB 驱动器。备份重要数据！


    我们要做的下一步是创建一个分区。在你的 Windows 机器上，右键点击开始菜单启动 `Disk management`（磁盘管理）。在你想要创建空间的分区上，右键点击并选择
    `Shrink Volume`（压缩卷）。提供要分配的空间量；建议是 `10GB` 以上。


    完成后，重启机器并选择我们创建的 USB 作为启动设备。**注意**：查看网页如何为你的特定设备启用启动。这将引导你进入 `GRUB` 菜单以选择使用哪种选项。在第一个选项中选择
    `Ubuntu`——如下所示 image_rsrc15C.jpg (注：此处原文逻辑略有重复，已根据语境调整)


    (此处由于原文文本错乱，重新检查并根据原文逻辑顺序翻译)


    重新修正启动部分的逻辑翻译如下：

    在启动期间，`VirtualBox` 将提示你选择启动磁盘。选择我们配置的 `Ubuntu` `iso`![](img/image_rsrc15B.jpg)


    如果所有配置和设置运行正常，它应该使用来自 `iso` 的 `Ubuntu` 安装程序启动。一旦进入安装程序菜单，选择 `Install Ubuntu`（安装
    Ubuntu），因为我们正在虚拟机上运行。继续安装选项，如 `Language`（语言）和 `Keyboard Layout`（键盘布局）。接下来，你可以选择
    `Normal installation`（常规安装，预装了游戏和其他实用程序）或 `Minimal install`（最小化安装，仅包含基本系统实用程序）。由于我们将处理
    `terminal`，最好选择 `Minimal install` 选项。你可以在安装期间启用或禁用安装更新。


    在下一节中，选择 `erase disk`（擦除磁盘）并 `install Ubuntu`（安装 Ubuntu）。如果你想自定义磁盘分配，选择 `advanced
    options`（高级选项）。由于我们运行的是只影响虚拟磁盘的虚拟机，我们可以使用整个磁盘进行安装![](img/etcher)!image_rsrc15F.jpg


    一旦获取了安装程序，安装并启动以开始过程。一旦你启动 `Balena`，你将得到一个与下面所示类似的窗口 image_rsrc15G.jpg


    在上面的窗口中，选择 `Flash from File`（从文件闪存）选项。这样做将提示你提供我们下载的 `Ubuntu` 镜像的位置。接下来，将闪存盘插入计算机；`BalenaEtcher`
    应该会自动检测到它。如果你连接了多个设备，从 `Target`（目标）菜单选择正确的设备。一旦选择，点击 `Flash`（闪存）开始刻录过程。**注意**：这将擦除你的
    USB 驱动器。备份重要数据！


    我们要做的下一步是创建一个分区。在你的 Windows 机器上，右键点击开始菜单启动 `Disk management`（磁盘管理）。在你想要创建空间的分区上，右键点击并选择
    `Shrink Volume`（压缩卷）。提供要分配的空间量；建议是 `10GB` 以上。


    完成后，重启机器并选择我们创建的 USB 作为启动设备。**注意**：查看网页如何为你的特定设备启用启动。这将引导你进入 `GRUB` 菜单以选择使用哪种选项。在第一个选项中选择
