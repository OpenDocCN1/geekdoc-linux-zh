    For Mac OS users, you can use Dual Boot alongside Linux, use Virtualization software,
    or opt for live media. Let us get started.


    # How to Choose A Linux Distribution


    This section covers how to choose the right Linux distribution. A Linux distribution,
    commonly called a `distro`, is a different “flavor” of a Linux operating system
    built on top of the native Linux kernel to carry out various use-cases and preferences.


    Since all distributions are Linux-based, they tend to be quite similar, and therefore
    usable interchangeably. For example, a distribution like `Ubuntu` is the most
    popular due to its ease of use and the ability to abstract small configuration
    tasks for its users. A distribution such as `Arch Linux` does not offer the same
    features and is better suited if you want to have more control over the system
    and tweak it to suit your needs.


    If you are entirely new to Linux, opt for a `Debian` distro such as `Ubuntu` or
    `Linux Mint`, `Arch` distros such as `Manjaro` are also supported by this book.
    Please do not take this recommendation to mean that these distributions are beginner-geared.
    This book recommends these `distros` because they provide a familiar environment
    for new users.


    # Installing Linux on Windows: Virtualization


    The first method we will explore for PC users is using Virtualization Software.
    This is the easiest method as it does not require you to change any system configuration
    or settings. All you require is a piece of simple-to-use software.


    The first step is to download the `iso` file for your Linux distribution. For
    this book, we will opt for `Ubuntu 20.04.1`—the current version as of writing
    this book. Open the browser, navigate to the resource link below, and download
    the `Ubuntu` `iso`. [https://ubuntu.com/](https://ubuntu.com/)


    Next, we need to get virtualization software. We are going to use `Oracle VirtualBox`
    as it is easy to install and use. You can also choose other tools such as `VMware`,
    `KVM`, or `Hyper-V`. Open your browser, navigate to the resource link below, and
    download the latest version of `VirtualBox`. [https://www.virtualbox.org/](https://www.virtualbox.org/)


    **NOTE**: You will have to enable virtualization technology (`VT-X`) to run any
    virtualization software. Check the web on how to enable Virtualization for your
    specific device.


    Once you download the `VirtualBox` installer, launch it and go through the typical
    Windows installation process. Ensure to select all the features during the installation
    process as shown below.![](image_rsrc155.jpg)


    During the installation process, the setup may prompt you to install the `Oracle
    USB driver`. Select `install`.![](image_rsrc156.jpg)


    With the software setup, we can begin installing `Ubuntu` or your Linux distribution.
    In most cases, the distribution you choose will provide an installation guide.
    Check the guide for your specific distribution.


    Once you launch `VirtualBox`, you will get a window similar to the one shown below:![](image_rsrc157.jpg)


    Next, click on `New`, which will launch a box that requires you to provide basic
    details about your Operating system. Enter the name of the `VirtualBox`—feel free
    to provide any suitable name. In this case, we shall name it `Ubuntu`.


    Next, select the location in your filesystem where you want the virtual machine
    file stored. You can leave this as default. Next, choose the type from the dropdown
    menu. If you provide a name for popular Operating Systems, `VirtualBox` should
    detect the `Type` and `Version`. If this does not happen, select the type as `Linux`
    and type as `Ubuntu_64`. Select `Debian` for all `Debian` derivatives and `Arch`
    for `Arch`-based `distros`.![](image_rsrc158.jpg)


    Next, select `Expert mode`, which will provide you with more options. Select the
    amount of memory you want to allocate for your OS. We recommend above `4GB` unless
    you have less, in which case, you can allocate `1-2GB`.


    Next, select `create virtual disk now` and click on `create now`:![](image_rsrc159.jpg)


    Select the size and location storage for the virtual disk in the next windows—leave
    this as default. In hard disk file type, select `VirtualBox Disk image` and set
    as `dynamically allocated`. That ensures the size of the hard disk increases as
    the system needs more storage. Click on `create`.![](image_rsrc15A.jpg)


    That should create a virtual machine that should be available in the list of your
    virtual machines. Now click on the `Settings` icon to launch the virtual machine’s
    settings, then next, select the `System` option on the left side menu. That will
    give you all the settings on the virtual system of your virtual machine. Under
    `processor`, select the number of processors to allocate the machine.


    Next, go to `storage` settings and select the `Controller IDE`. Under attributes,
    click on the disk icon and select `Choose a disk file`. This will launch the file
    explorer. Navigate to your download folder and select the `Ubuntu` `iso` image
    we downloaded earlier. Click on `save` and go back to the main menu. Select the
    `start` option to boot up the virtual machine. During bootup, `VirtualBox` will
    prompt you to select the startup disk. Select the `Ubuntu` `iso` we configured.![](image_rsrc15B.jpg)


    That will boot you up in the `GRUB` menu to select which option to use. Select
    `Ubuntu` in the first option—as shown below.![](image_rsrc15C.jpg)


    If all configurations and settings are working properly, this should boot up using
    the `Ubuntu` installer from the `iso`. Once in the installer menu, select `Install
    Ubuntu` as we are running it on a virtual machine. Continue with the installation
    options such as `Language` and `Keyboard Layout`. Next, you can select either
    `Normal installation`, which comes prepackaged with games and other utilities,
    or `Minimal install`, which only contains basic system utilities. Since we will
    work with the `terminal`, it’s best to choose the `Minimal install` option. You
    can enable or disable to install updates during the installation.


    In the next section, select `erase disk`, and `install Ubuntu`. If you want to
    customize disk allocation, choose `advanced options`. As we are running a virtual
    machine that only affects the virtual disks, we can use the entire disk for the
    installation.![](image_rsrc15D.jpg)


    Select `install now`, which will prompt you to confirm changes to the disk. Go
    ahead and click `yes` and confirm. Confirm your location and click on `next`.
    In the next step, enter your details and set up your username and password, and
    click on `continue`.![](image_rsrc15E.jpg)


    Finally, click `install` to begin the installation process. Once the installation
    is complete, you should boot into `Ubuntu` and start working with Linux.


    # Installing Linux on Windows: Dual Boot


    Here, we are going to cover how to dual boot Windows alongside `Ubuntu`. For this
    method, you will require a USB flash drive and free space on your hard disk.


    The first step—as usual—is to download the `Ubuntu` `iso` from the official site.
    Next, we are going to download a tool to burn the `iso` on the flash drive. Open
    your browser, navigate to the resource page below, and download the `windows installer`.
    [https://balena.io/etcher](https://balena.io/etcher)![](image_rsrc15F.jpg)


    Once you have acquired the installer, install and launch to begin the process.
    Once you launch `Balena`, you will get a window that resembles the one shown below:![](image_rsrc15G.jpg)


    In the window above, select the `Flash from File` option. Doing this will prompt
    you to provide the location of the `Ubuntu` image we downloaded. Next, Insert
    your Flash disk into your computer; `BalenaEtcher` should automatically detect
    it. If you have more than one device connected, choose the correct from the `Target`
    menu. Once selected, click on `Flash` to begin the burning process.


    **NOTE**: This will wipe your USB drive. Backup important data!


    The next thing we are going to do is create a partition for our Linux installation.
    On your Windows machine, Right-click the start menu and launch the `Disk management`
    tool. On the partition you want to create some space, right-click and select `Shrink
    Volume`. Provide the amount of space to allocate to the partition; the recommendation
    is more than `10GB` of storage.


    Once completed, reboot your machine and select your boot devices as the USB device
    we created above. **NOTE**: Check the web on how to select a boot device for your
    specific machine.This will boot Ubuntu and take you to the installation window.
    Follow the process in the above section until you get to a point where the system
    prompts you to select the installation type. Select install Alongside window and
    click continue and complete the process.


    # Installing Linux on Windows: WSL


    In a recent version of Windows, Microsoft has introduced a feature that allows
    you to run Linux from within your system without a Hypervisor. However, this feature
    is only available in the most recent version of Windows 10. If you have earlier
    versions of Windows, consider using other methods to run Linux.


    For this to work, we need to enable the `WSL` feature. Open the start menu and
    search for “Turn Windows features on or Off.” This will launch the windows features
    window where we can turn on the `WSL` feature.![](image_rsrc15H.jpg)


    Click on `Ok to apply the changes. This process may require you to reboot your
    machine. Next, open Microsoft store and search for `Ubuntu`. Select `Ubuntu 20.04
    LTS` and click on `install`.![](image_rsrc15J.jpg)


    Once the `WSL` feature is enabled and `Ubuntu` installed, Launch the application
    to start the installation. Provide a Linux username and password to boot up the
    machine.![](image_rsrc15K.jpg)


    **NOTE**: `WSL` Installation does not provide a GUI interface, but since this
    guide is about working with the terminal, this should not be a problem.


    # Installing Linux on Mac OSx: Virtual Machine


    Because of this book’s scope, we shall not discuss a step-by-step process to install
    Linux on a Virtual Machine on Mac. Check the Linux installation process for Windows
    as they are similar.


    # Section 2: Linux Command, Terminal, and Shell


    Before we dive deep into executing Linux commands, let us first define a few common
    terms in Linux. Although these terms are basic, it’s good to get a good handle
    on their meaning and differences:


    ## Linux Dictionary


    The most common Linux terms you need to know are:

