    The `-l` argument changes the format which the files and directories are listed
    and provides more details. Example:


    ![](image_rsrc15S.jpg)


    Don’t worry about what the details mean as we will cover them in upcoming sections,
    but from the output above, we get a lot more details about the same files. That
    brings us to a fundamental concept about commands. Most commands in Linux uses
    what we call arguments. Arguments are additional options used to modify the behavior
    of a command. (Case in point).


    In some cases, options and arguments can mean two different things. For example,
    a command to manage wireless devices may take the device name as an option and
    another argument to modify its operations. The general syntax for arguments and
    options is:


    `command -option argument`


    Most commands have arguments, including a single letter preceded by a dash (`-`)
    symbol such as `ls -l`. These arguments can also be chained together using a single
    dash, as shown in the example below:


    ![](image_rsrc15T.jpg)


    With the above command, the `ls` command gets modified using `-al` argument to
    list files in a specific format and include hidden files and directories. You
    can also modify the sorting order of files and directories using the `--reverse`
    argument.


    ![](image_rsrc15U.jpg)


    As you can see, the file listings order is now in reverse, listing them in an
    alphabetical-descending order. Do you remember what we mentioned about how a single
    command can take up an entire chapter? The `ls` is one of those commands. Here,
    however, we shall not delve deep. Check out the `ls` manual to learn more: [https://man7.org/linux/man-pages/man1/ls.1.html](https://man7.org/linux/man-pages/man1/ls.1.html)


    Instead, we shall list some of the `ls` most common arguments, which include:


    1. `-a` or `--all` – This argument lists all files and directories, including
    hidden ones (beginning with a dot) not listed under a normal `ls` command.

    2. `-t` – the `-t` argument sorts files by the date of modification.

    3. `-d` or `--directory` - This argument in conjunction with `-l` argument lists
    details about the directory itself and not its contents.

    4. `-r` or `--reverse` – As we have seen, the `--reverse` command lists files
    in reverse order. In a normal `ls` command, files and directories get displayed
    in an alphabetical-ascending order.

    5. `-l` – Used to list files and directories in a long format.

    6. `-F` or `--classify` – The classify argument places a character indicator at
    the end of a file or directory. For example, it will append a forward slash (`/`)
    to a directory.

    7. `-h` or `--human-readable` – The `-h` argument, used in conjunction with the
    `-l` argument, shows the size of files and directories in a human-readable format.
    i.e., In kilobytes, megabytes, gigabytes, and so on instead of bytes.

    8. `-S` – the `-S` argument sorts the files and directories by their file size.

    '
