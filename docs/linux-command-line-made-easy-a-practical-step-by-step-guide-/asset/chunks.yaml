    因此，通配符为文件名创建自定义的筛选标准则提供了一种方便的方法。以下是一些通配符的用例示例及其对应的匹配项。


    1. `*` - 包括文件和目录在内的所有内容。

    2. `a*` - 任何以字母 a 开头的文件或目录。

    3. `a??` – 任何以字母 a 开头且后跟好两个字符的文件或目录。

    4. `Log.[0-9][0-9][0-9]` – 任何以单词 log 开头且后跟三个三个数字的文件或目录。

    5. `[[:upper:]]*` – 任何以大写字母开头的文件或目录。

    6. `a*.txt` – 任何以字符 a 开头、跟随任意字符但以 txt 字符结尾的文件或目录。

    7. `[abc]*` - 任何以字母 a、b 或 c 之一开头的文件或目录。

    8. `[![:lower:]]` – 任何不以小写字母开头的文件或目录。

    9. `*[[:digit:]txt]` – 任何以数字或 txt 字符结尾的文件或目录。


    通配符可以用于所有接受文件名的命令，如 `cp`、`mv`、`rm` 等。现在你可以知道为什么在 `/` 目录上执行 `sudo rm -rf *` 是一个糟糕的主意了。我们将在后续章节中学习更多关于
    `sudo` 的知识。


    # 软链接与硬链接


    在 Linux 中，你可能会遇到这样的目录：![](img/image_rsrc15Y.jpg)你会注意到列表中目录第一个字母是 `l` 而不是目录的普通字母
    `d`。它看起来还像包含了两个目录。这是 Linux 中的一种特殊文件，被称为软链接（soft link）、symlink 或符号链接（symbolic link）。Linux
    允许通过多个名称引用文件。


    从上面的命令中，我们可以看到如 `libx32` 这样的符号链接，它指向目录 `/usr/libx32`。因此，任何查找 `libx32` 目录的程序都会获取
    `/usr/libx32` 目录。


    ## 创建链接


    在 Linux 中创建符号链接，我们使用 `ln` 命令。通用语法为：

    `ln file link`

    上述语法创建一个硬链接。

    `ln -s item link`

    这为传递的 item 创建软链接。传递的 item 可以是目录也可以文件。


    ## 硬链接 vs 软链接


    硬链接和软链接之间没有显著区别。主要区别在于引用文件的方式。


    硬链接是 Linux 中创建链接的默认方式，而符号链接更现代，并且默认情况下，每个文件都有一个为文件提供名称的硬链接。


    创建硬链接后，该文件还会被创建一个额外的目录条目。以下是硬链接的主要特征：

    1. 它们不用于引用目录。

    2. 它们不能引用文件系统之外的文件。这意味着硬链接无法引用与其所在位置不同分区上的文件。


    硬链接与主文件是不可分的。与包含符号链接的目录列表相反，拥有硬链接的目录列表不会显示链接的任何特殊指示。一旦删除硬链接，链接就会被删除，但文件的主要内容不会被删除。这意味着在文件删除之前，空间不会被释放。


    符号链接是硬链接更更新、更改进的版本。它们的开发目标是帮助克服硬链接带来的一些局限性。基本上，符号链接的工作原理是执行一个包含指向引用目录或文件的文本指针的特殊文件。它们的工作方式类似于
    Windows 快捷方式。


    符号链接与其引用的主文件非常难以区分。符号链接在被删除后不会删除文件。然而，如果文件在链接删除之前被移除，符号链接就会损坏。你使用 `ls` 命令时会遇到用红色表示的损坏符号链接。


    **注意：** 仅这一节我们就涵盖了大量信息。可能需要一段时间时间来掌握（而不是背诵）这些命令及其参数，最好的学习方法是实践。多尝试这些命令直到你掌握它们。


    # 第 6 节：用于处理命令的命令


    到为止，我们讨论了大量的命令，每个命令都有更广泛的、与之不同或执行方式不同的选项。在本章中，我们将简化这些命令，甚至编写独特的命令。


    ## 命令：简单定义


    在讨论帮助我们处理其他命令的命令之前，让我们更好地了解一下命令。命令到底是什么？


    正如书开头提到的，命令是你在终端中输入并供 shell 执行的文本或字符。输入的命令引用 Linux 文件系统 (`fs`) 中的某些内容。例如，像 `ls`
    这样的命令是寻找文件和目录的代码集合——这个过程并不像听起来那么直接。因此，命令可以引用四种类型的内容：

    1. shell 函数 – shell 函数是合并到 Linux 环境中的小型 shell 脚本。

    2. 可执行程序 – 命令可以是编译后的二进制文件，如在 `/bin` 和 `/usr/bin` 目录找到的文件。程序员可以使用各种语言（如 C/C++、Python、Perl、Ruby
    等）编译这些二进制文件。

    3. 内置 shell 命令 – 这些是内置到 shell 中的命令——也称为 shell 内置（built-ins）。

    4. 别名（alias）—— 命令也可以是指命令的别名或替代名称。例如，你可以创建一个命令将 `free` 显示为 `fmem`。


    ## 识别命令


    识别命令是指用于识别其他命令是什么以及它们在系统中执行什么操作的命令。它们包括：


    ### 显示可执行位置 – `which` 命令

    在服务器上安装了多个版本的可执行程序的情况下，我们可以使用 `which` 命令来定位可执行文件，如下：![](img/image_rsrc15Z.jpg)

    `which` 只作用于可执行程序，不作用于内置 shell 命令。如果你对 `cd` 这样的命令运行 `which`，将得到一个错误：


    ### 显示命令类型 – `type` 命令

    `type` 命令显示 shell 将执行的命令类型。类型可以包括我们上面提到的那些。

    `type` 命令的工作方式如下：![](img/image_rsrc160.jpg)

    从上面的命令中我们可以看到 `cd` 命令是 shell 内置，`mkdir` 是位于 `/usr/bin/mkdir` 的可执行文件。像 `ls` 这样的命令实际上是带有
    `--color=auto` 参数的 `ls` 命令的别名。


    ## 显示命令帮助和文档


    一旦我们知道命令是什么及其位置，我们就可以存储在系统手册数据库中找到它的文档。


    `help` 命令帮助你查找命令接受的选项和参数。大多数情况下，`help` 命令只对 shell 内置命令有效。例如：![](img/image_rsrc161.jpg)

    尽管 `help` 命令提供了选项及其工作原理，但它绝不是教程。然而，当你想要学习更多关于命令的信息时，它是实用的。


    `help` 命令的另一种流行模式是使用 `--help` 语法作为参数。Linux 中的大多数可执行程序都提供此参数，允许你查找命令的用法。例如：![](img/image_rsrc162.jpg)![](img/image_rsrc163.jpg)![](img/image_rsrc164.jpg)

    并不是所有命令都支持 `--help` 参数。某些支持 `-h`，而其他使用手动页。不过，尝试一下看看是否有效。


    查找命令信息最常见的方法是使用手册（manual pages）。手册是针对各种命令的正式文档。手册页通常被称为 man pages，可以使用名为 `man`
    的特殊命令来访问。

    该命令的通用语法为：

    `man program`

    其中 `program` 代表你需要的文档的命令。虽然手册包含不同的格式和样式，但它们主要包含一个标题、命令语法的摘要以及命令作用的描述。它可能还包括命令选项的列表和描述。手册更像参考资料，而不是指南。

    手册使用 `less` 命令来浏览文档。尝试查看 `less` 命令的手页。![](img/image_rsrc165.jpg)


    # 手页的组织


    在处理命令时，手册是极的工具。它们存储在手册数据库中，按特定格式组织，涵盖可执行命令、用户命令、系统管理命令、文件格式等。

    以下是手册布局的提纲。

    1. `1` – 手册的第一部分包含用户命令的文档。

    2. `2` – 第二部分是内核系统调用编程接口。

    3. `3` – 第三部分包含 C 库的编程接口文档。

    4. `4` – 第四部分用于特殊文件。包括驱动程序和设备节点。

    5. `5` – 五用于文件格式文档。

    6. `6` – 第六部分用于游戏和其他娱乐，如壁纸和屏幕保护程序。

    7. `7` – 第七部分用于杂项

