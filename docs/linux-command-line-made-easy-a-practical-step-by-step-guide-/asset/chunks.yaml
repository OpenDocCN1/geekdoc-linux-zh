    from free to fmem .Identifying CommandsIdentifying commands are commands used
    to identify what other commands are and what actions they perform in the system.
    They include:Show executable location – which commandIn instances where there
    are multiple versions of an executable program installed on a server, we can use
    the which command to locate an executable file as follows:![](image_rsrc15Z.jpg)Which
    command only works on executable programs, not on built-in shell commands. If
    you run the which on a command like cd , you will get an error:Display command
    type – type commandThe type command displays the type of command the shell is
    going to execute. The types can include the ones we mentioned above.The type command
    works like this:![](image_rsrc160.jpg)From the commands above, we can see that
    the command cd is a shell built-in, mkdir is an executable located in /usr/bin/mkdir
    . A command like ls is really an alias for the ls command with --color=auto argument
    enabled.Displaying Commands Help and DocumentationOnce we know what a command
    is and its location, we can find its documentation stored in the system’s manual
    database.The help command helps you find out about the options and arguments the
    command accepts. In most cases, the help command only works on shell built-in
    commands. For example:![](image_rsrc161.jpg)Although the help command provides
    options and how they work, it is in no way a tutorial. However, it comes in handy
    when you want to learn more about a command.Another popular mode of the help command
    is using it as an argument using the --help syntax.Most executable programs in
    Linux provides this argument to allow you to find a command’s usage information.
    For example:![](image_rsrc162.jpg)![](image_rsrc163.jpg)![](image_rsrc164.jpg)Not
    all commands support the --help argument. Some support -h and others use manual
    pages. However, try it to find out if it works.The most common way to find information
    about commands is by using manual pages. Manual pages are formal pieces of documentation
    for various commands. Manual pages are commonly known as man pages and are accessible
    using a special command called man .The general syntax for the command is:man
    programWhere “program” represents the command that you need documentation for.
    Although manual pages contain different formats and styles, they mainly contain
    a title, a synopsis of the command’s syntax, and a description of what the command
    does. It may also include a listing and a description of the command’s options.
    Manual pages are sort of like a reference and not a guide.Manual pages use the
    less command to navigate the documentation. Try to view the manual pages for the
