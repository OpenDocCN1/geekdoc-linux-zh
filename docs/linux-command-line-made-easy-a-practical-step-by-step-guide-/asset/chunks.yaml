- fmt: '

    Wildcards, therefore, provide a convenient way to create customized selection
    criteria for filenames. Here are some examples of wildcard use cases and their
    corresponding matches.


    1. `*` - Everything including files and directories.

    2. `a*` - Any file or directory beginning with the letter a.

    3. `a??` – Any files or directories beginning with the letter a and followed by
    exactly two characters.

    4. `Log.[0-9][0-9][0-9]` – Any files or directories beginning with the word log
    followed by exactly three numerical values.

    5. `[[:upper:]]*` – Any files or directories beginning with an uppercase letter.

    6. `a*.txt` – Any files or directories beginning with the character a followed
    by any characters but ending with txt characters.

    7. `[abc]*` - Any files or directories beginning with either the letter a, b or
    c.

    8. `[![:lower:]]` – Any files or directories not beginning with a lowercase.

    9. `*[[:digit:]txt]` – Any files or directories ending with a digit or the characters
    txt.


    Wildcards can work with all of the commands that accept filenames such as `cp`,
    `mv`, `rm`, etc. Now you can see why the command `sudo rm -rf *` on the `/` directory
    is a terrible idea. We will learn more about `sudo` in upcoming chapters.


    # Soft and Hard Links


    In Linux, you will sometimes come across a directory that may look something like
    this: ![](image_rsrc15Y.jpg) You will notice that the directory first letter in
    the listing is an l instead of a regular letter d for directories. It also seems
    to contain two directories in one. That is a special kind of file in Linux known
    as a soft link, symlink or symbolic link . Linux allows file referencing by multiple
    names.


    From the command above, we see a symbolic link such `libx32` that points to the
    directory `/usr/libx32`. Hence, any program looking for the `libx32` directory
    will get the `/usr/libx32` directory.


    ## Creating Links


    To create symbolic links in Linux, we use the `ln` command. The general syntax
    is:

    `ln file link`

    The above syntax creates a hard link.

    `ln -s item link`

    That creates a soft link for the passed item. The passed item can be either a
    directory or a file.


    ## Hard links vs. Soft Links


    There is no significant difference between hard and soft links. The main difference
    is how the two reference the files.


    Hard links were the default ways of creating links in Linux, while symbolic links
    are more modern, and by default, every file has a hard link that provides a name
    for the file.


    With a hard link created, an additional directory entry for the file also gets
    created. Here are the main features of hard links:

    1. They are not used to reference directories.

    2. They cannot reference files outside their filesystems. This means a hard link
    cannot reference a file in another partition than it residential location.


    A hard link is indistinguishable from the main file. Contrary to a directory list
    holding a symbolic link, a directory list that has a hard link does not show any
    special indication of the link. Once a hard link gets removed, the link gets deleted,
    but the file’s main contents don’t get removed. This means that space doesn’t
    get deallocated until after file deletion.


    Symbolic links are the newer and more improved version of hard links. Their development
    aim was to help overcome some of the limitations that come with hard links. Basically,
    symbolic links work by executing a special file containing a text pointer to the
    referenced directory or file. They mainly work similarly to Windows shortcuts.


    A symbolic link and the main file referenced are very hard to distinguish. Symbolic
    links do not delete files once it gets deleted. However, if the file gets removed
    before the link gets removed, the symbolic link becomes broken. You will encounter
    broken symbolic links indicated by red using the `ls` command.


    **NOTE:** We have covered a lot of information in this section alone. It may take
    a while to master (not memorize) the commands and their arguments, and the best
    way to learn is to practice. Play around with the commands until you get them.


    # Section 6: Commands for Working With Commands


    Up to this point, we have discussed a wide range of commands, with each command
    having a wider range of options that are different or performed differently. In
    this chapter, we shall simplify these commands and even write unique commands.


    ## Commands: Simple definition


    Before we discuss commands that help us work with other commands, let’s understand
    commands a bit better. What is a command, really?


    As mentioned at the beginning of the book, commands are texts or characters you
    type in a terminal for the shell to execute. The typed commands reference something
    within the Linux `fs`. For example, a command like `ls` is a collection of code
    that finds files and directories—the process is not as direct as it sounds. Hence,
    a command can reference four types of things:

    1. A shell function – shell functions refer to small shell scripts merged in the
    Linux environment.

    2. An executable program – A command can be a compiled binary like files found
    in `/bin` and `/usr/bin` directories. Programmers can compile these binaries in
    various languages such as C/C++, Python, Perl, Ruby, etc.

    3. Built-in shell command – These are a type of commands built-in into the shell—also
    called shell built-ins.

    4. An alias – a command can also refer to an alias or an alternative name for
    a command. For example, you can create a command to show free memory from `free`
    to `fmem`.


    ## Identifying Commands


    Identifying commands are commands used to identify what other commands are and
    what actions they perform in the system. They include:


    ### Show executable location – `which` command

    In instances where there are multiple versions of an executable program installed
    on a server, we can use the `which` command to locate an executable file as follows:
    ![](image_rsrc15Z.jpg)

    `which` only works on executable programs, not on built-in shell commands. If
    you run the `which` on a command like `cd`, you will get an error:


    ### Display command type – `type` command

    The `type` command displays the type of command the shell is going to execute.
    The types can include the ones we mentioned above.

    The `type` command works like this: ![](image_rsrc160.jpg)

    From the commands above, we can see that the command `cd` is a shell built-in,
    `mkdir` is an executable located in `/usr/bin/mkdir`. A command like `ls` is really
    an alias for the `ls` command with `--color=auto` argument enabled.


    ## Displaying Commands Help and Documentation


    Once we know what a command is and its location, we can find its documentation
    stored in the system’s manual database.


    The `help` command helps you find out about the options and arguments the command
    accepts. In most cases, the `help` command only works on shell built-in commands.
    For example:![](image_rsrc161.jpg)

    Although the `help` command provides options and how they work, it is in no way
    a tutorial. However, it comes in handy when you want to learn more about a command.


    Another popular mode of the `help` command is using it as an argument using the
    `--help` syntax. Most executable programs in Linux provides this argument to allow
    you to find a command’s usage information. For example:![](image_rsrc162.jpg)![](image_rsrc163.jpg)![](image_rsrc164.jpg)

    Not all commands support the `--help` argument. Some support `-h` and others use
    manual pages. However, try it to find out if it works.


    The most common way to find information about commands is by using manual pages.
    Manual pages are formal pieces of documentation for various commands. Manual pages
    are commonly known as man pages and are accessible using a special command called
    `man`.

    The general syntax for the command is:

    `man program`

    Where `program` represents the command that you need documentation for. Although
    manual pages contain different formats and styles, they mainly contain a title,
    a synopsis of the command’s syntax, and a description of what the command does.
    It may also include a listing and a description of the command’s options. Manual
    pages are sort like a reference and not a guide.

    Manual pages use the `less` command to navigate the documentation. Try to view
    the manual pages for the `less` command.![](image_rsrc165.jpg)


    # Manual Pages Organization


    Manual pages are amazing tools when working with commands. They get stored in
    the manual database organized in a specific format covering executable commands,
    user commands, system administration commands, file formats, etc.

    Below is an outline of the layout of the manual pages.

    1. `1` – The first section of the manual pages contains documentation for user
    commands.

    2. `2` – The second section features kernel system calls programming interfaces.

    3. `3` – The third section contains C library’s programming interfaces documentation.

    4. `4` – The fourth section is for special files. This includes drivers and device
    nodes.

    5. `5` – Five is for file formats documentation.

    6. `6` – The sixth section is for games and other enjoyments such as wallpapers
    and screensavers.

    7. `7` – Seven is for miscellaneous

