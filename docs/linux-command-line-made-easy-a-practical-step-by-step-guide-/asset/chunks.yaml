    # Linux 命令行入门

    一本面向初学者和中级用户的 Linux 命令实操逐步指南

    Craig Berg


    ## 引言

    欢迎阅读《初学者 Linux 命令行指南》，感谢你选择这本书作为通往 Linux 世界的钥匙。请注意，本书是为 Linux 初学者编写，而非高级用户。无论你是从
    Windows 还是 OSX 版本转换，还是准备尝试 Linux，这本书对你来说都将价值连城。


    然而，尽管这本书确实非常适合初，但它不会让你在一夜之间从新手变成 Linux 命令行大师。这是因为 Linux 命令行非常庞大且极具挑战性，对初学者尤其是如此。学习它需要巨大的决心和努力，并不是因为
    Linux 命令行有多复杂或需要天才级别的 IQ，而是因为它规模宏大，包含了成百甚至上千条命令。


    坦诚地说，我们可以为每一个章节只讲解一个命令及其所有的参数。尽管如此，命令行是 Linux 用户的基础工具。命令行让你仅通过键盘就能在操作系统的方方面面使用所有可能的工具进行工作。如果你对此表示怀疑，请跟随本书阅读，你将发现真正的力量。


    本书的结构高效：


    1. 第一章将为你提供操作 Linux 命令行的基础和必须的元素。

    2. 第二章中，我们将查看 Linux 配置以及应用程序配置文件的存储位置，以及如何管理它们。

    3. 第三章中，我们将深入探讨你在操作命令行时最频繁使用的 Linux 工具和常用命令。

    4. 最后，我们将对 Linux 权限、组等内容进行讨论并结束。


    简单来说，Linux 和 Linux 命令行非常神奇，因为它们为你开启了许多机会。在这本初学者书中，我们并不假设你具备任何编程知识。这就是为什么本书将带你走每一步。请从头到尾阅读这本书，因为它的结构更像大纲而不是快速参考指南。你只需要一台电脑和网络连接来安装
    Linux——这一点稍后会介绍。一旦你准备好所需物品，我们就可以开始安装并上手输入命令行，这是最有趣的部分！


    备注：我想听取你的反馈。如果你对这本书满意，请在 Amazon 上留下评价。请访问下方页面为本书留评：[`https://amzn.to/2VMR5qr`]


    ## 目录

    - 引言 功能，最后

    * 使用 Live 介质（如 USB 或 DVD）。


