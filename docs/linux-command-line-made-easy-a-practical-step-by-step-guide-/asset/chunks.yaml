    for Ubuntu. Select Ubuntu 20.04 LTS and click on install.![](image_rsrc15J.jpg)Once
    the WSL feature is enabled and Ubuntu installed, Launch the application to start
    the installation. Provide a Linux username and password to boot up the machine.![](image_rsrc15K.jpg)NOTE:
    WSL Installation does not provide a GUI interface, but since this guide is about
    working with the terminal, this should not be a problem.Installing Linux on Mac
    OSx: Virtual MachineBecause of this book’s scope, we shall not discuss a step-by-step
