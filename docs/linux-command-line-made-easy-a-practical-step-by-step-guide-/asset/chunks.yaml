    有时，你可能需要在特定的文档章节中搜索以找到你寻找的内容。例如：


    ```

    ubuntu@VSALEM:/etc$ man 5 sudoers

    ```

    上面的命令显示了关于 `sudoers` 文件格式的文档。


    ### 显示简要描述 – whatis 命令

    `whatis` 命令是一个实用的命令。它会从手册页（man pages）显示匹配特定关键词的命令名称和单行描述。

    例如：

    ![](img/image_rsrc166.jpg)


    ### 显示相关命令 – Apropos

    手册页允许你根据传递的术语进行匹配搜索。使用 `apropos` 命令，你可以从手册页中搜索相似的命令。例如：

    ![](img/image_rsrc167.jpg)

    你也可以用 `man -k` 参数替换 `apropos` 命令。


    另一个你可以用来查找命令帮助和文档的常用命令是 `info` 命令。它是 `man` 命令的替代方案，但提供了超链接以以帮助导航到特定章节。

    `info` 程序读取 `info` 文件，这些文件像树结构一样被组织成独立的节点，每个节点包含一个主题。`info` 文件包含你可以用来从一个节点移动到另一个节点的超链接。超链接因为前面的星号而很容易识别。你可以通过将光标置于其上然后按下
    `ENTER` 键来激活它们。

    例如：

    ```

    ubuntu@VSALEM:~$ info ls

    ```

    到目前为止我们所有的命令都属于 `coreutils` 软件包或 `GNU Project`。要查找关于位置和文档的更多详情，请使用命令：

    ![](img/image_rsrc168.jpg)

    你在系统上安装的许多软件包都有存储在 `/usr/share/doc` 目录下的文档文件。大多数以纯文本格式存储，但有些是 HTML 格式，可以使用网络浏览器查看。

    某些文件具有 `.gz` 扩展名，表示使用 `gzip` 压缩程序压缩的文件。`gzip` 包有一个特殊的 `less` 版本称为 `zless`，它可以显示
    `gzip` 压缩的文本文件中包含的信息。

    ![](img/image_rsrc169.jpg)

    手册页可以作为广泛命令的极佳参考。然而，正如我们提到的，它们并不是教程。如果你想测试手册页有多疯狂，可以尝试查看 `bash` 的手册页。不过不要感到沮丧；继续学习：你将理解这一切的含义。


    ### 创建自定义命令

    本小节涵盖了如何使用 `alias` 命令创建命令。`alias` 命令允许你创建一个更好的名称来替换命令，或者用单个命令代表一系列命令。

    在我们开始之前，首要任务是为我们的命令找到一个合适的名称，并确保没有其他关键函数在使用它。

    ![](img/image_rsrc16A.jpg)

    遗憾的是，`info` 似乎被占用了，我们无法使用它。让我们尝试 `mshell`：

    ![](img/image_rsrc16B.jpg)

    那个是可以用的。我们使用 `alias` 命令，后面跟着我们要使用的命令或命令序列。

    例如，为了导航到 `/etc` 目录、读取 `passwd` 文件、返回家目录并最后列出目录，我们可以使用下面显示的 shell 技巧将所有命令合并为一行：

    ```

    cd /etc; less passwd; cd ~; ls -la;

    ```

    使用 `alias`，我们可以像下面所示创建一个单个命令：`alias` 命令的通用语法为：`alias name=''string''`

    注意下面命令的结构：

    ![](img/image_rsrc16C.jpg)

    紧接 `alias` 命令，我们传递想要替换的名称和命令字符串。一旦使用 `alias` 命令定义了命令，我们就可以任何地方使用它。

    我们可以使用 `type` 命令查看我们的别名。

    ```

    ubuntu@VSALEM:~$ type mshell

    mshell is aliased to `cd /etc; less passwd; cd ~; ls -la;`

    ```

    要删除别名命令，请使用下面的 `unalias` 命令。

    ```

    ubuntu@VSALEM:~$ unalias mshell

    ubuntu@VSALEM:~$ type mshell

    bash: type: mshell: not found

    ```

    诚然，我们避免了使用现有命令的别名，因为有时这样做是合适的。例如，`ls` 命令是 `ls --color-auto` 的别名。以下是环境中定义的一些别名，使用不带参数的
    `alias` 命令可以获取更多。

    ![](img/image_rsrc16D.jpg)


    ### 第 7 节 权限

    Linux 以及其他基于 Unix 的系统的最佳特性之一是它们是多任务和多用户的。这意味着多一个用户可以同时使用系统并运行多个进程。

    例如，连接到网络的系统可以有一个用户在物理上工作，另一些用户通过 `SSH` 远程工作。如 `X Window` 系统等功能允许远程用户运行 GUI 应用程序。

    这是构建在 Linux 内核深处的强大功能。然而，为了实现这一点，用户必须受到彼此的保护，防止用户干扰其他用户创建的文件。

    本章将介绍 Linux 如何实现如身份、文件权限、文件所有权、用户组等保护措施。


    #### 所有者、组和其他用户

    偶尔在探索 Linux 文件系统时，你会遇到某些在尝试读取时会输出“Permission Denied（拒绝访问）”错误的文件。此类文件的示例位于 `/etc/shadow`

    ![](img/image_rsrc16E.jpg)

    这种类型错误的主要原因是由于用户操作错误。这意味着，如果你以普通用户身份运行，你可能没有读取某些文件的权限。

    让我们讨论它是如何工作的：

    Linux 使用我们所谓的 Unix 安全模型，该模型描述用户可以拥有文件系统中的文件和目录。如果用户拥有特定的文件或目录，他/她对它们具有完全控制权。该用户可以属于一个由多个用户组成的组，所有用户都获得所有者授予的文件和目录的访问权限。

    除了为其所属的组提供访问权限外，用户或目录所有者还可以向世界或系统内的所有人授予访问权限。

    你可以通过 `id` 命令获取更多关于你的用户身份的信息。

    ```

    ubuntu@VSALEM:~$ id

    ```

    ![](img/image_rsrc16F.jpg)

    让我们分析输出并看看它的含义（并非全部！）

    当创建一个用户时，他/她会被分配分配一个称为 `uid` 或唯一 ID 的唯一值，然后映射到用户的用户名。系统为用户分配一个主组 ID，也称为 `gid`
    值。该组 ID 可能还属于其他组。

    取决于你运行 `id` 命令的系统，你将得到不同的结果。例如，像 Fedora 这样的系统从 500 开始编号账户。另一方面，Ubuntu 从 1000 开始。

    Ubuntu 中的单个用户可以属于更多组——如上所示——这是因为 Ubuntu 系统处理系统服务和设备权限的方式。

    `systemdevices and services.`

    这些信息源自 Linux 文本文件。Linux 中的帐户存储在 `/etc/passwd` 文件中，而组存储在 `/etc/groups` 文件中。在创建
    Linux 用户帐户或组时，这些文件中的每一个都会被修改。用于存储密码的 `/etc/shadow` 文件也会发生变化。`/etc/passwd` 和 `/etc/groups`

    ![](img/image_rsrc16G.jpg)


    #### 、写、执行文件权限

    Linux 中的访问权限由身份、文件权限、文件所有权、组等定义。

    ![](img/image_rsrc16H.jpg)

    正如在前面的章节中讨论，块中的第一个字母表示文件类型。A –（连字符）表示普通文件，`d` 表示目录，`l` 表示符号链接，`c` 表示字符特殊文件，`b`
    表示块设备。其余九块表示文件模式：

    1. `r` – 授予读取权限，允许用户和组打开并读取文件。如果应用到目录上，用户可以列出目录的内容。

    2. `w` – 允许写入文件或截断；然而，写入属性允许删除取决于父目录。当你设置执行属性时，写入属性允许创建、重命名目录。

    3. `x` – 使文件表示为可执行程序成为可能。为了让使用脚本语言编写的文件具有执行性，你还必须将它们设置为可读。在目录上，执行属性使得进入目录成为可能。


    以下是设置在文件和目录上的权限示例：

    1. `-rwx------` – 显示仅文件所有者具有读、写和执行权限的普通文件。其他人没有对该文件的读、写、执行权限。

    2. `-rw-------` – 也是一个普通文件，文件所有者具有读写权限，其他人没有。

    3. `-rw-r--r--` – 一个普通文件，文件所有者具有读写权限，所有组也可以读取该文件，全世界也可以读取。

    4. `-rwxr-xr-x` – 显示文件所有者具有读、写和执行权限，用户组具有执行和读取权限，其他人仅只有执行权限。

    5. `drwxrwx---` - 表示目录。所有者和用户组可以进入目录并在目录内创建、重命名和删除文件。

    6. `Lrwxrwxrwx` 带有占位权限的符号链接。占位权限意味着实际权限由所引的文件管理。


    更改文件模式 – chmod 命令

    要更改文件或目录的权限，我们使用 `chmod` 命令。更改文件权限仅对文件所有者和超级用户有效。`chmod` 支持两种指定权限的主要方式

    1. 八进制表示法

    2. 符号表示


    ### 符号表示

    让我们从文件权限的符号表示开始。符号表示有三个主要部分：受影响的对象、执行的操作以及权限设置。

    在受影响的对象上，使用了 `u`、`g`、`o` 和 `a` 等字母。

