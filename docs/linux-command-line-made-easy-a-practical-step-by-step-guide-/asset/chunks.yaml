    # 第 2 节：Linux 命令、终端和 Shell


    在深入执行 Linux 命令之前，让我们先定义 Linux 中的一些常见术语。虽然这些术语是基础的，但很好了解它们的含义和区别：


    ## Linux 词典


    你需要了解常用的 Linux 术语有：


    '
- fmt: '

    # 1. A command

    A `command` in Linux refers to a set of characters recognized by the kernel and
    used to perform various tasks.


    # 2. A Terminal

    `Terminal` refers to a graphical interface used to take the user’s command and
    bash it along to the `shell`. It usually includes a shell prompt with the format
    of `username@machinenane` and a cursor. Although you will find various terminal
    versions in different distros, they mainly carry out the same tasks.


    # 3. Shell

    The `shell` refers to the middleman between the user and the kernel. It allows
    you to enter commands and interprets them to the kernel. Linux includes various
    types of shells, such as `bash`, `zhs`, `fish`, `dash`, etc.

    '
