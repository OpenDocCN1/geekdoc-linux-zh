    Sometimes you may have to search in a specific documentation section to find the
    content you are looking for. For example:


    ```

    ubuntu@VSALEM:/etc$ man 5 sudoers

    ```

    The command above shows the documentation showing file formats for the `sudoers`
    file.


    ### Display Brief Description – whatis command

    The `whatis` command is a handy command. It displays the name of the command and
    one-line description from the man pages matching a specific keyword.

    For example:

    ![](image_rsrc166.jpg)


    ### Display Appropriate Commands – Apropos

    Manual pages allow you to search for a match based on the passed term. Using the
    command `apropos` , you can search a similar command from the manual pages. For
    example:

    ![](image_rsrc167.jpg)

    You can also substitute the `apropos` command with `man -k` argument.


    Another common command you can use to find command help and documentation is the
    `info` command. It is an alternative to the `man` command but provides hyperlinks
    to help navigate to specific sections.

    The `info` program reads `info` files, structured like trees into individual nodes,
    each encompassing a single topic. Info files have hyperlinks you can use to move
    from one node to the other. Hyperlinks are easy to identify because of their leading
    asterisk. You can activate them by placing the cursor on it, then hitting the
    `ENTER` key.

    For example:

    ```

    ubuntu@VSALEM:~$ info ls

    ```

    All the commands we have up to this point belong to the `coreutils` package or
    the `GNU Project`. To find more details about residence and documentation, use
    the command:

    ![](image_rsrc168.jpg)

    Many of the software packages you have installed on your system will have documentation
    files stored in the directory `/usr/share/doc`. Most get stored in plaintext format,
    but some are HTML and viewable with a web browser.

    Some files will have a `.gz` extension, indicating files compressed using the
    `gzip` compression program. The `gzip` package has a special less version called
    `zless` that displays the information contained in gzip-compressed text files.

    ![](image_rsrc169.jpg)

    Manual pages can be very good as references for a wide range of commands. However,
    as we mentioned, they are not tutorials. If you want to test how crazy manual
    pages are, try manual pages for `bash`. Do not get frustrated, though; keep learning:
    you will understand what it all means.


    ### Creating Custom Commands

    This subsection covers how to create commands using the `alias` command. The `alias`
    command allows you to come up with better names to substitute a command or a single
    command to represent a sequence of commands.

    Before we begin, the first task is to find out an appropriate name for our command
    and ensure no other critical function is using it.

    ![](image_rsrc16A.jpg)

    Unfortunately, `info` seems taken, and we cannot use it. Let us try `mshell` :

    ![](image_rsrc16B.jpg)

    That one is available to use. We use the `alias` command, followed by a command
    or a sequence of commands we want to use.

    For example, to navigate to the `/etc` directory, read the `passwd` file, navigate
    back home, and finally list the directories, we can combine all the commands in
    one line using a shell trick shown below:

    ```

    cd /etc; less passwd; cd ~; ls -la;

    ```

    Using `alias` , we can create a single command as shown below: The general syntax
    for the `alias` command is: `alias name=''string''`

    Pay attention to the structure of the command below:

    ![](image_rsrc16C.jpg)

    Immediately after the `alias` command, we pass the name and a string of commands
    we want to substitute. Once a command has been defined using the `alias` command,
    we can use it anywhere.

    We can see our alias using the `type` command.

    ```

    ubuntu@VSALEM:~$ type mshell

    mshell is aliased to `cd /etc; less passwd; cd ~; ls -la;`

    ```

    To remove an aliased command, use the `unalias` command as shown below.

    ```

    ubuntu@VSALEM:~$ unalias mshell

    ubuntu@VSALEM:~$ type mshell

    bash: type: mshell: not found

    ```

    Granted, we avoided using an alias of an existing command because sometimes it
    is appropriate to do so. For example, the command `ls` is an alias of `ls --color-auto`.
    The following are some of the aliases defined in the environment, use the `alias`
    command without arguments to find out more.

    ![](image_rsrc16D.jpg)


    ### Section 7 Permissions

    One of the best features of Linux and other Unix-based systems is that they are
    multitasking and multiuser. That means more than one user can use systems simultaneously
    and run more than one process.

    For example, a system attached to a network can have one user working on it physically
    and others working remotely like `SSH`. Features such as the `X Window` system
    allow remote users to run GUI applications remotely.

    That is an amazing functionality built deep in the Linux kernel. However, to implement
    this, users had to be protected from each other, preventing users from interfering
    with files created by other users.

    This chapter will look at how Linux implements protection measures like identity,
    file permissions, file ownership, groups, etc.


    #### Owners, Groups, and Others

    Once in a while, when exploring the Linux file system, you will encounter files
    that output the “Permission Denied” error when you try to read them. An example
    of such a file is found in `/etc/shadow`

    ![](image_rsrc16E.jpg)

    The main reason for this type of error results from user error. Meaning, if you
    are running as a regular user, you may not have permission to read some files.

    Let us discuss how this works:

    Linux uses what is we call the Unix Security model, which describes that a user
    can own files and directories within a File system. If a user owns a specific
    file or directory, he/she has full control over them. The user can then belong
    to a group that consists of more than one user, all given access to files and
    directories by their owners.

    Besides providing access to the groups they belong to, a user or directory owner
    can grant access rights to the world or everyone within the system.

    You can find more information about your user identity by using the command `id`.

    ```

    ubuntu@VSALEM:~$ id

    ```

    ![](image_rsrc16F.jpg)

    Let us dissect the output and see what it means (not all of it!)

    When a user gets created, he/she gets assigned a unique value referred to as a
    `uid` or unique id value, then mapped to the user’s username. The system assigns
    the user a primary group id, also called a `gid` value. The group id may also
    belong to other groups.

    Depending on the system you run the `id` command on, you will get different results.
    For example, a system like Fedora starts numbering accounts from 500. On the other
    hand, Ubuntu starts at 1000.

    A single user in Ubuntu can belong in more groups—shown above—because of how the
    Ubuntu system handles system services and device privileges.

    `systemdevices and services.`

    This information gets derived from Linux text files. Accounts in Linux get stored
    in `/etc/passwd` file, while groups get stored in `/etc/groups` file. Upon creation
    of a Linux user account or group, each of these files gets modified. A file such
    as `/etc/shadow`, used to store passwords, also gets changed. `/etc/passwd` and
    `/etc/groups`

    ![](image_rsrc16G.jpg)


    #### Read, Write, and Execute File Permissions

    Access rights in Linux are defined by identity, file permissions, file ownership,
    groups, etc.

    ![](image_rsrc16H.jpg)

    As discussed in previous chapters, the first letter in the block indicates the
    file type. A – (dash) represents regular files, `d` represents directories, `l`
    symbolic links, `c` represents character-special file, and `b` represents block
    devices. The rest nine blocks represent file modes:

    1. `r` – Grants read permission allowing the user and group to open and read a
    file. If applied on a directory, a user can list the directory’s contents.

    2. `w` – Permits file writing or truncating; however, the write attribute allows
    deletion depends on the parent directory. When you set the execute attribute,
    the write attribute allows the creation, renaming of directory.

    3. `x` – Makes it possible to represent a file as an executable program. To make
    files written using scripting languages executable, you must also set them as
    readable. On a directory, the execute attribute makes it possible to enter a directory.


    The following are examples of permission set on files and directories:

    1. `-rwx------` – Shows a regular file with read, write, and executable permissions
    for the file owner only. No one else has either read, write, execute permission
    to the file.

    2. `-rw-------` – Also a regular file with read and write for the file owner and
    no one else.

    3. `-rw-r--r--` – A regular file that has read and write for the file owner, the
    owner’s group may also read the file and the world can read the file too.

    4. `-rwxr-xr-x` – Shows regular file with read, write, and execute permissions
    for the file owner, execute and read for the user’s group and execute only for
    everyone else.

    5. `drwxrwx---` - Indicates a directory. The owner and user group members may
    enter the directory, and create, rename and delete files within the directory.

    6. `Lrwxrwxrwx` – A symbolic link with placeholder permissions. Placeholder permissions
    mean that the real permissions get managed by the actual file referenced by the
    symbolic link.


    Changing File Modes – chmod command

    To change the permissions of a file or directory, we use the `chmod` command.
    Changing file permissions is only possible for file owners and superuser accounts.
    `chmod` supports two main ways to specify the permission

    1. Octal notation

    2. Symbolic notation


    ### Symbolic Notation

    Let us start with the symbolic representation of file permissions. Symbolic notations
    have three main parts: who the changes will affect, the operation performed, and
    the permission set.

    On who the changes will affect, letters such as `u`, `g`, `o`, and `a` are used.

