    prompt you to select the startup disk. Select the Ubuntu iso we configured.![](image_rsrc15B.jpg)That
    will boot you up in the GRUB menu to select which option to use. Select Ubuntu
    in the first option—as shown below.![](image_rsrc15C.jpg)If all configurations
    and settings are working properly, this should boot up using the Ubuntu installer
    from the iso. Once in the installer menu, select Install Ubuntu as we are running
    it on a virtual machine.Continue with the installation options such as Language
    and Keyboard Layout. Next, you can select either Normal installation, which comes
    prepackaged with games and other utilities, or Minimal install, which only contains
    basic system utilities.Since we will work with the terminal, it’s best to choose
    the Minimal install option.You can enable or disable to install updates during
    the installation.In the next section, select erase disk, and install Ubuntu. If
    you want to customize disk allocation, choose advanced options.As we are running
    a virtual machine that only affects the virtual disks, we can use the entire disk
    for the installation.![](image_rsrc15D.jpg)Select install now, which will prompt
    you to confirm changes to the disk. Go ahead and click yes and confirm.Confirm
    your location and click on next. In the next step, enter your details and set
    up your username and password, and click on continue.![](image_rsrc15E.jpg)Finally,
    click “install” to begin the installation process. Once the installation is complete,
    you should boot into Ubuntu and start working with Linux.Installing Linux on Windows:
    Dual BootHere, we are going to cover how to dual boot Windows alongside Ubuntu.
    For this method, you will require a USB flash drive and free space on your hard
    disk.The first step—as usual—is to download the Ubuntu iso from the official site.
    Next, we are going to download a tool to burn the iso on the flash drive.Open
    your browser, navigate to the resource page below, and download the windows installer.[https://balena.io/etcher](https://balena.io/etcher)![](image_rsrc15F.jpg)Once
    you have acquired the installer, install and launch to begin the process. Once
    you launch Balena, you will get a window that resembles the one shown below:![](image_rsrc15G.jpg)In
