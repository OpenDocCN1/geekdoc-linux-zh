    7. `.bashrc` – 这表示文件名。


    # 第 4 节 理解文件系统


    现在我们已经学习了如何探索和导航文件系统，可以进入下一部分：理解 Linux 文件系统的组织结构。


    我们将从学习如何查看文件内容开始。然后，我们将学习 Linux 如何组织一切，包括应用程序的存储位置、启动配置、用户目录等，最后以符号链接和硬链接结束。


    正如你可能从之前的章节记得的，我们提到过 Linux 不需要文件扩展名来确定文件和文件类型。例如，普通文档会有像 `*.pdf`、`*.odt` 或 `*.doc`
    这样的扩展名，但 Linux 不需要。


    在这一节中，我们将学习如何使用 `file` 命令查看文件内容。首先，使用命令创建一个文本文件：


    ```bash

    ubuntu@VSALEM:~$ echo “Hello world!”> myfile.txt

    ```


    目前，不用担心这些命令的含义。接下来，使用 `file` 命令查看文件内容。


    ```bash

    ubuntu@VSALEM:~$ file myfile.txt

    myfile.txt: ASCII text

    ```


    Linux 随后告诉你 `myfile.txt` 是一个 ASCII 文本文件，这是正确的。值得注意的是，有许多文件类型。在 Linux 中，你经常会遇到一句话：“在
    Linux 中，万物皆文件”，这是正确的。在 Linux 中，甚至目录也是文件的一种类型。


    ## less 命令


    让我们来看看另一个有趣的 Linux 命令：`less` 命令。`less` 命令是一个允许你查看文件内容的工具。不要将其与显示文件类型的 `file` 命令混淆。


    在 Linux 中，许多文件是原始 ASCII 文本格式的，例如源代码文件、bash 脚本、配置文件等。使用 `less` 命令允许我们查看和检查这些文件中的内容。在下一节中，我们将学习如何使用各种工具（包括
    `vi` 和 `nano`）来编辑文件，但现在，让我们先看看它们里面有什么。


    `less` 命令的通用语法为：`less <filename>`


    使用 `less` 命令，我们可以查看文件内容并使用上下方向键上下滚动。如果文件内容大于终端窗口确定的单页，我们可以使用空格导航到下一页。完成文件查看后，我们使用
    `Q` 键退出文件。


    例如，使用 `less` 命令查看用于存储安装包源的文件。


    ```bash

    ubuntu@VSALEM:~$ sudo less /etc/apt/sources.list

    ```


    `less` 命令与键盘命令结合使用时效果非常好。以下是在操作 `less` 时使用的一些快捷键：


    1. `Spacebar`（空格键） – 用于滚动到文件的下一页。

    2. `Up Arrow`（向上箭头） – 用于向上滚动一行。

    3. `Down Arrow`（向下箭头） – 一次向下滚动一行。

    4. `Q` – 退出 `less` 命令。

    5. `H` – 用于显示 `less` 帮助菜单。

    6. `B` – 到上一页。

    7. `G` – 滚动到文件末尾。

    8. `/characters` – 用于向前搜索字符串的下一次出现处。


    `less` 命令是其前身命令 `more` 的改进版。尝试运行命令：


    ```bash

    ubuntu@VSALEM:~$ whatis less

    less (1)             - opposite of more

    ```


    # Linux 文件系统


    Linux 文件系统可能是本书最重要的部分。因此，本书将让你对 Linux 文件系统有深入的理解，例如根目录在哪里等。一旦你理解了文件系统（FS），你就能找到更多命令，读取、写入、执行文件以及更多内容。理解了这部分，你就可以像大师一样处理任何
    Linux 发行版。


    在大多数情况下，Linux 文件系统的布局在所有 Linux 发行版中都是相同的。虽然在所有发行版中并不如此，但在大多数情况下，其结构是相似的，并由《Linux
    文件系统层次结构标准》实现。[`refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html`](https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html)


    当我们探索文件系统并理解这个神奇操作系统背后的原理时，请使用你的设备实际操作这些目录，使用 `file` 命令检查文件，甚至使用 `less` 命令查看特定文件的内容。


    ## Linux 目录组织


    以下是 Linux 系统中的目录以及每个目录预留的内容：


    1. `/` – 这是 Linux 系统的根目录，一切从这里开始。

    2. `/bin` – bin 目录存储或包含系统启动和运行所需的二进制文件。

    3. `/boot` – boot 目录包含 Linux 内核、RAM 磁盘镜像和所需的加载程序。你会在其中找到如 `/boot/grub/grub.conf`
    或使用 grub 作为加载程序的系统的内核镜像，如 `/boot/vmlinuz` 等文件。

    4. `/dev` – Dev 目录包含设备节点。这是内核用于存储其识别的设备列表的目录。

    5. `/etc` – etc 是 Linux 系统最重要的目录之一。它包含系统级配置文件。`/etc` 目录还可以包含系统启动期间使用的 shell 脚本。`/etc`
    目录中的几乎每个文件都是纯文本。该目录中的常见文件包括 `/etc/passwd`（账户列表）、`/etc/resolv.conf`（DNS 解析器配置）、`/etc/crontab`（启动列表）。

    6. `/home` – 目录为每个用户提供特定目录。然而，并不总是如此，你可能会发现用户操作其他目录的特殊情况。

    7. `/lib` – Lib 文件夹包含 Linux 系统核心使用的共享库文件。将其视为 Windows 中的 dll 目录。

    8. `/lost+found` – 此目录包含在文件系统事件（如 `ext4` 或 `ext3` 格式的设备和分区）发生故障时部分恢复的文件。在大多数情况下，该目录是空的。

    9. `/media` – 我们在前面的章节中提到的 media 目录主要用于自动挂载的可移动设备的挂载点。

    10. `/mnt` – /mnt 目录用于手动挂载设备。

    11. `/opt` – /opt 目录存放安装在系统上的第三方软件。如果你在使用，可能会在这里找到。

    12. `/proc` – 这是一个特殊的目录并充当文件系统。它不是存储在磁盘上的真实文件系统，而是由内核维护的。`/proc` 目录中的文件是可读的，展示了内核如何管理系统。例如，查看
    CPU 信息可以使用 `less /proc/cpuinfo`。

    13. `/root` – 此目录是 root 用户的主目录。

    14. `/sbin` – /sbin 目录由内核存储系统二进制文件。这些系统二进制文件用于在系统上执行关键任务，主要为超级用户预留。

    15. `/tmp` – 此目录存储各种程序生成的临时或瞬时文件。该目录在重启时会被清空。

    16. `/usr` – 这是 Linux 中的另一个重要目录。它包含所有用户使用的程序和文件。它是 Linux 系统最大的目录之一，包含数千个文件。

    17. `/usr/bin` – 存放你的 Linux 发行版安装的可执行程序。

    18. `/usr/lib` – 包含 `/bin` 目录中程序使用的共享库。

    19. `/usr/local` – 此目录包含 Linux 发行版默认未包含但供系统级使用的编译程序。尽管该目录默认存在，但在特权用户将其添加文件之前它是空的。

    20. `/usr/sbin` – 用于存储系统管理程序。

    21. `/usr/share` – /share 目录包含 `/bin` 目录程序使用的共享数据。你在这里会找到配置文件、主题、声音文件等。

    22. `/usr/share/doc` – 此目录存储系统上安装的大多数软件包的文档文件。

    23. `/var` – 此目录存储不断变化的数据，如数据库、日志、邮件等。Linux 中除 `/tmp` 和 `/home` 之外的所有目录都是静态的。

    24. `/var/log` – 如名称所示，/log 目录存储各种操作的日志文件。该目录包含系统关键文件，需要持续监控。你可能需要超级权限来查看日志文件。


    # 第 5 节 Linux 中的文件和目录操作


    本节将讨论允许我们操作 Linux 文件和目录的命令。操作电脑时文件和目录非常常见，因此本节的命令至关重要。通过学习，你会发现使用图形化文件管理器进行移动、重命名、删除和文件操作更简单。然而，如果你对执行的操作有更多控制和灵活性，命令行提供了这种可能。


    ## 创建目录 – mkdir


    我们将查看第一个命令是 mkdir。它在当前或指定的工作空间创建目录。以下是 `mkdir` 命令的工作原理：


    ```bash

    mkdir directoryName

    ```


    尽管看起来足够简单，但 `mkdir` 非常强大。你可以在一个命令中创建多个目录：


    ```bash

    mkdir dir1 dir2 dir3 dir4 dir5…dir(n)

    ```


    一旦执行该命令，它将按如下方式创建所有传递的目录![](img/image_rsrc15W.jpg)


    ## 复制文件和目录 – cp 命令


    下一个命令是 cp 命令，用于在 Linux 文件系统内从一个位置复制文件和目录到另一个。cp 命令支持两种语法：


    ```bash

    cp file1 file2 or dir1 dir2

    ```


    此语法将 `file1` 或 `dir1` 复制到 `file2` 或 `dir2`。这在处理单个项目或单个目录时非常有用。


    `cp` 命令的另一种语法是：![](img/image_rsrc15X.jpg)


    在这种情况下，`cp` 命令将当前目录的所有指定文件复制到指定目录。`cp` 命令有许多选项，可以使用它们来操控命令执行的方式和内容。虽然我们不会讨论所有的选项，但这里有一些值得提及的选项：


    1. `-a` 或 `--archive` – 使用 `--archive` 选项使用 `cp` 命令允许你复制带有所有相应属性和权限的文件和目录。如果没有该参数，复制命令将使用执行命令的用户的权限。例如，如果
    `ubuntu` 用户拥有被复制的文件，而 `root` 执行了复制，则 `root` 拥有该文件。请注意这一点。

    2. `-i` 或 `--interactive` – 交互参数启用 `cp` 命令在覆盖文件之前提示用户。默认情况下，`cp` 将自动并静默地覆盖文件。

    3. `-v` 或 `--verbose` – 如名称所示，详细模式会在每个文件被复制时显示信息消息。

    4. `-r` 或 `--recursive` – 允许 `cp` 命令递归复制文件。该命令被频繁使用，且复制目录时是必须的。

    5. `-u` 或 `--update` – 更新参数非常有效。它告诉命令进行更新。


    ## 移动、重命名文件和目录 – mv 命令


    下一个命令是 mv 命令，它允许我们移动或重命名文件和目录。通用语法为：


    ```bash

    mv file1 file2

    ```


    此语法将 `file1` 或 `dir1` 移动到 `file2` 或 `dir2`。这在处理单个项目或单个目录时非常方便手。


    `mv` 命令的另一种语法是：


    ```bash

    mv file1 file2…dir(n) destination

    ```


    在这种情况下，`mv` 命令将当前目录的所有指定文件移动到目标目录。


    ## 删除文件和目录 – rm 命令


    最后我们来看 rm 命令。rm 命令删除文件和目录。通用语法为：


    ```bash

    rm file2 or directory2

    ```


    取决于你如何以及何处使用该命令，rm 命令可能非常危险。Linux 不提供撤销命令，一旦 `rm` 执行了删除操作，它就消失了！删除单个文件请使用：


    ```bash

    rm file1

    ```


    要删除目录及其内容，请使用递归标志：


    ```bash

    rm -r directory1

    ```

