  trans: '


    # 1. 命令 (command)

    Linux 中的 `command` 指的是内核识别的一组字符，用于执行各种任务。


    # 2. 终端 (Terminal)

    `Terminal` 指的是图形界面，用于接收用户的命令并将其传递给 `shell`。它通常包含一个格式为 `username@machinenane` 的
    shell 提示符光标。尽管你在不同的发行版中会发现各种版本的终端，但它们执行的任务主要是相同的。


    # 3. 壳 (Shell)

    `shell` 指的是用户和内核之间的中间人。它允许你输入命令并将其解释给内核。Linux 包含了多种类型的 shell，例如 `bash`、`zhs`、`fish`、`dash`
    等。

