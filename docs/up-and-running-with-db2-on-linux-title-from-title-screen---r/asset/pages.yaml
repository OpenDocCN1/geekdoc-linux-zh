    # # 7.3.3 Running db2top in the background


    The db2top background mode provides you with an automatic performance analysis
    or data collection for analysis using Microsoft Excel.


    # ## Analyzing the db2top data using Microsoft Excel


    You can run db2top in background and analyze the data later using Microsoft Excel.
    When using db2top with the -command option, db2top will display information in
    comma separated value (CSV) format.


    The db2top tool provides an Excel report tool called db2top Reports, which is
    a macro for you to build graphical reports. The db2top Reports is in the sample
    Excel file db2top.xls that is located in the samples directory after unzipping
    db2top-2.0-bin.


    To use db2top Reports, copy db2top.xls to a working directory on a Windows platform
    and double-click to open. Enable Macros. db2top Reports is presented for you to
    analyze db2top data; refer to Figure 7-33 on page 392.'
