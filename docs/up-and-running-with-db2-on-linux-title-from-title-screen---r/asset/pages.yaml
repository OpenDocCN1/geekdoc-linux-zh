    # ### Table partitioning and row compression


    DB2 offers numerous features and functions to support your enterprise databases.
    We describe two table-related features here for you to consider designing your
    tables.


    The table partitioning feature provides you with the capability to divide data
    across multiple storage objects called data partitions or ranges according to
    values in one or more table partitioning key columns of the table. With table
    partitioning, you are able to roll in and roll out of the data efficiently, detach
    or reattach a data partition for backup, restore, or reorganization, and potentially
    boost query performance through data partition elimination.


    When you design your database you might want to consider the table partitioning
    feature for large tables. For more details, refer to Database Partitioning, Table
    Partitioning, and MDC for DB2 9, SG24-7467.


    The major purpose of row compression is to save disk storage space. Additional
    advantages of row compression include possible disk I/O savings, increasing pool
    hit ratio, and decreasing backup image sizes. For details, refer to Information
    Center at:


    ```

    http://publib.boulder.ibm.com/infocenter/db2lu/v9r5/topic/com.ibm.db2.luw.admin.dbobjj.doc/doc/c0023489.html

    ```'
