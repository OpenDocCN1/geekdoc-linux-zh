    The data, while physically split, is used and managed as a logical work. Users
    can choose how to partition their data by declaring partitioning keys. Tables
    can be located in one or more database partitions. As a result, you can spread
    the workload across a partitioned database for large tables, while allowing smaller
    tables to be stored on one or more database partitions. Each database partition
    has local indexes on the data that it stores, resulting in increased performance
    for local data access.


    You are not restricted to having all tables divided across all database partitions
    in the database. DB2 supports partial declustering, which means that you can divide
    tables and their spaces across a subset of database partitions in the system.
    An alternative to consider when you want tables to be positioned on each database
    partition is to use materialized query tables and then replicate those tables.
    You can create a materialized query table containing the information that you
    need and then replicate it to each node.


    # Partitioning on SMP clusters


    In the simplest scenario, each physical machine in the cluster has a single database
    partition on it. In this type of configuration, each partition is a physical database
    partition and has access to all the resources in the machine. One partition per
    machine is typical for systems having one or two processors. When using SMP machines
    with several processors, it is possible to create more than one partition on the
    same system. A logical database partition differs from a physical partition in
    that it is not given control of an entire machine. Although the machine has shared
    resources, database partitions do not share all resources. Processors are shared
    but disks and memory are not. See Figure 1-10 on page 24.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_45_0.png)


    Figure 1-10 A partitioned database across a cluster of SMP machines


    There are advantages to using logical partitions on high-SMP systems in both clustered
    and non-clustered environments. Logical database partitions can provide better
    scalability. Multiple database managers running on multiple logical partitions
    can make full use of available resources than a single database manager can. The
    ability to have two or more partitions coexist on the same machine (regardless
    of the number of processors) allows for greater flexibility in designing high
    availability configurations and failover strategies. Upon failure, a database
    partition can be automatically moved and restarted on a second machine that already
    contains another partition of the same database.


