  md: '# Table 4-4 Migration options in Windows


    | Migrating from | Migration to | Migration methods summary |

    |---|---|--|

    | Version 8 DB2 Administration Client | DB2 9.5 Data Server Client | Install the
    DB2 9.5 Data Server Client, and choose the migrate action in the Work with Existing
    panel. The client instance is then automatically migrated for you. |

    | Version 8 DB2 Application Development Client | | Install a new copy of DB2 9.5
    Server Client, and then manually Version 9.1 or Version 8 instances. |

    | Version 9.1 DB2 8 DB2 Run-Time Client | DB2 9.5 Data Server Runtime | Install
    the Version 9.5 Data Server Runtime as a new copy. |

    | Version 8 DB2 Run-Time Client Lite | | Manually migrate your Version 9.1 or
    Version 8 client instance. |

    | Version 9.1 DB2 Runtime Client | |


    For Linux environments, the client migration process is the same for both DB2
    Version 9.5 clients. The process is:


    +   1. Verify that the client supported is described in “Considerations” on page
    184.

    2. Back up the client configuration.


    The two commands create two files in your current directory that contain the database
    manager configuration and information about the cataloged databases:


    ```

    db2 get dbm cfg > dbm_client.cfg

    db2cfexp cfg_profile backup

    ```


    +   3. Install the DB2 9.5 client.

    4. Migrate your client instance:


    ```

    $DB2HOME/bin/db2imgr instname

    ```


    In this command, **DB2HOME** is the location where the DB2 9.5 client is installed,
    and **instname** is the instance.


    Instead of migrating your existing client instance, you can create a new client
    instance using the following command:


    ```

    $DB2HOME/bin/db2icrt -s client instance

    ```


    Then, import the configuration that you collected in step 2.'
