    Data marts are highly specialized data warehouses. They are designed to run a
    well defined set of reports. The data is most denormalized and transformed into
    a CUBE or star schemas. Cubes and star schemas are data models designed to support
    the queries running on these systems. You have ETL (Export Transform Load) processes
    to transfer the data from the production system to the data marts on a regular
    basis by tools, such as WebSphere DataStage QualityStage. The availability of
    a data mart is usually lower than for the production systems.


    # 1.3.2 DB2 database objects


    In this section, we introduce DB2 objects and their relationships to each other.


    # Instances


    An instance (sometimes called a database manager) is DB2 code that manages data.
    It controls what can be done to the data and manages system resources assigned
    to it. Each instance is a complete environment. It contains all the database partitions
    defined for a given parallel database system. An instance has its own databases
    (which other instances cannot access directly), and all its database partitions
    share the same system directories. It also has security from other instances on
    the same machine (system), allowing, for example, both production and development
    environments to run on the same machine under separate DB2 instances without interfering
    with each other.


    ![](img/f11f73c917561aadc89cbf81db6d9105_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_36_0.png)


    Figure 1-3 DB2 database objects


    # Databases


    A relational database presents data as a collection of tables. A table consists
    of a defined number of columns and any number of rows. Each database includes
    a set of system catalog tables that describes the logical and physical structure
    of the data, a configuration file containing the parameter values allocated for
    the database, and a recovery log.


    # Database partition groups


    A database partition group is a set of one or more database partitions. Before
    creating tables for the database, you first need to create the database partition
    group where the table spaces will be stored and then create the table space where
    the tables will be stored. If a partition group is not specified, there is a default
    group where table spaces are allocated. In earlier versions of DB2, database partition
    groups were known as node groups. In a non-partitioned environment, all the data
    resides in a single partition; therefore, it is not necessary to worry about partition
    groups.


    # Table spaces


    A database is organized into parts called table spaces. A table space is a place
    to store tables. When creating a table, you can decide to have certain objects,'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'as indexes and large object (LOB) data, kept separately from the rest of the
    table data. A table space can also be spread over one or more physical storage
    devices.


    Table spaces reside in partition groups. Table space definitions and attributes
    are recorded in the database system catalog. Containers are assigned to table
    spaces. A container is an allocation of physical storage (as a file or a device).
    A table space can be either system-managed space (SMS) or database-managed space
    (DMS). For an SMS table space, each container is a directory in the file space
    of the operating system, and the operating system''s file manager controls the
    storage space. For a DMS table space, each container is either a fixed size pre-allocated
    file or a physical device, such as a disk, and the database manager controls the
    storage space.


    # Tables


    A relational database presents data as a collection of tables. A table consists
    of data logically arranged in columns and rows. All database and table data is
    assigned to table spaces. The data in the table is logically related, and relationships
    can be defined between tables. Data can be viewed and manipulated based on mathematical
    principles and operations called. Table data is accessed through Structured Query
    Language (SQL), a standardized language for defining and manipulating data in
    a relational database. A query is used in applications or by users to retrieve
    data from a database. The query uses SQL to create a statement in the form of:


    ```

    SELECT <data_name> FROM <table_name>

    ```


    # Buffer pools


    A buffer pool is the amount of main memory allocated to cache table and index
    data pages as they are read from disk or as they are modified. The purpose of
    the buffer pool is to improve system performance. Data can be accessed much faster
    from memory than disk; therefore, the fewer times the database manager needs to
    read or write to a disk (I/O), the better the performance.(You can create more
    than one buffer pool; although for most, only one buffer pool is sufficient.)
    The configuration of the buffer pool is the most important tuning area, because
    you can reduce the delay that is caused by I/O.


    # 1.4 Parallelism with DB2


    A system with a single processor and disk has limitations for the amount of data,
    users, and applications that it can handle. Parallel processing, which is key
    for enterprise workloads, involves spreading the load across several processors
    and disks, and, allows for large volumes of data and high transaction rates'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'to be processed. In many environments, the data volumes are growing at a phenomenal
    rate; therefore, a database management system needs to be able to easily scale
    to increased loads with the addition of more disks and CPUs.


    DB2 parallel technology enables highly scalable performance on large databases
    by breaking the processing into separate execution components that can run concurrently
    on multiple processors. Elapsed times for queries can be dramatically reduced
    by processing the individual queries in parallel. DB2 supports a scalable growth
    path to easily add more processing power to an existing system by either "scaling
    up" (SMP), "scaling out" (massively parallel processing (MPP)), or both.


    # 1.4.1 SMP environments


    In the post, complex enterprise workloads have typically run on high-end SMP (symmetric
    multiprocessor) machines. A large number of processors running within the same
    machine and connected with a high bandwidth bus can deliver excellent performance.
    Because DB2 for Linux shares much of its code with DB2 running on high-end UNIX
    systems, it inherits the ability to exploit SMP architectures. The DB2 capability
    to run on SMP systems is only restricted by today''s Linux SMP scalability. DB2
    can take advantage of multiple processors easily without setting up a clustered
    system. This is called intra-parallelism.


    ![](img/f11f73c917561aadc89cbf81db6d9105_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 1.4.2 Database clusters


    The driving force behind Linux clusters is that by distributing the load over
    low cost servers running an open source operating system, a larger task can be
    accomplished faster, more reliably, and much more economically. And if the load
    increases, the cluster can be extended for managing the additional demand without
    compromising on performance. DB2 was the first database on Linux to provide built-in
    capabilities for clusters. That is, DB2 can be deployed across a Linux cluster
    immediately without the need for additional clustering software. DB2 clusters
    on Linux are ideal for running demanding transactional applications and warehouses
    that involve large volumes of data while providing the following benefits:


    +   - Faster processing time

    - Very large databases

    - Excellent scalability

    - Increased availability

    - Reduced cost


    Combining the clustered approach with DB2 support for 64-bit Linux environments
    provides additional performance and scalability advantages.


    For the clustering feature of DB2, you have to set up a partitioned environment.
    This is called *inter-parallelism.*


    # Database clustering architectures


    There are two primary database clustering architectures: shared-disk and shared-nothing.
    *Shared-disk* is used by Oracle RAC. DB2 for Linux employs shared-nothing.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_40_0.png)


    # Shared-disk


    In a shared-disk environment, each database node has its own processors but shares
    the disks with other nodes. Therefore, all the processors can access all the disks
    in the cluster, which introduces additional overhead for coordinating resources
    and locks between nodes. For example, if Node 1 wants to access data on a certain
    disk that has been locked by another node in the cluster, Node 1 must wait for
    other nodes to complete their operations. While this works when there are few
    nodes in the cluster (for example, mainframe environments), the overhead for distributed
    lock management and cache coherence issues can severely limit scalability and
    introduce performance degradation for four or more nodes, making it impractical
    to exploit the economies of large clusters on Linux. Furthermore, this approach
    involves specialized hardware and software for shared disk and cache management,
    making it much more expensive than shared-nothing.


    # Shared-nothing


    As the name implies, partitions (nodes) in a shared-nothing environment do not
    share processors, memory, or disks with partitions on other machines. Each partition
    acts on its own subset of data. Because each partition has its own private resources,
    this approach does not involve unlimited contention with other servers, lending
    itself to virtually unlimited scalability. This is one reason DB2 for Linux can
    support up to 1,000 partitions. And because there is no coordination overhead
    for accessing resources, additional machines can easily be added to the cluster
    with linearly scalable performance, which implies, doubling of the data volume
    is matched by the doubling of the data resources,'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'the high performance of the database will be maintained at the same level.
    If one partition in a cluster fails, its resources can dynamically be transferred
    to another machine, ensuring high availability. Another benefit of the shared-nothing
    approach used by DB2 for Linux is that it does not require specialized hardware,
    making the solution much simpler, less expensive, and suitable for Linux-based
    "commodity" hardware.


    ![](img/f11f73c917561aadc89cbf81db6d9105_41_0.png)


    # 1.4.3 Partitioned database


    DB2 exploits the power of Linux clusters by employing database partitioning. In
    a partitioned environment, a database is distributed across multiple partitions,
    usually residing on different machines. Each partition is responsible for a portion
    of a database''s total data. A database partition is sometimes also called a node
    or database node. Because data is divided across database partitions, you can
    use the power of multiple processors on multiple physical nodes to satisfy requests
    for information. Data retrieval and update requests are decomposed automatically
    into sub-requests and executed in parallel among the applicable database partitions.


    As an illustration of the power of processing in a partitioned database system,
    assume that you have 100,000,000 records that you want to scan in a single-partition
    database. This scan requires a single database manager search 100,000,000 records.
    Now, suppose that these records are spread evenly over 20 database partitions;
    each partition only has to scan 5,000,000 records. If each database partition
    server scans in parallel with the same speed, the time required to the scan is
    approximately 20 times faster than a single-partition system handling the entire
    task.'
  merge: -1
