    we recommend that you create a separate DB2 home file system on one of the machines
    in the cluster to be used as the instance home directory. This file system is
    to be shared among all machines in the cluster via NFS (that is, NFS exported
    from the NFS server machine, and mounted on the remaining machines). In our setup,
    we created the file system /export/db2home with a mount point /db2home.


    +   - We also recommend that you create a separate file system for storing databases,
    there needs to be a separate database file system on each physical system that
    participates in the partitioned database. In our setup, we created a file system
    called /database with mount point /database.


    +   - For performance or availability reasons, we recommend that you avoid putting
    user data on the catalog node. When restoring the catalog node, the restore is
    faster when there is no data on this node.


    +   - We also recommend that you create separate partitions for the primary copy
    of DB2 logs, DB2 mirrored logs, and DB2 temporary table spaces (this design'
