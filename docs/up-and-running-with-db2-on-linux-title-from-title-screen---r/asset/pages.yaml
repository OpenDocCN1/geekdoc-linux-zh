    db2 "rollforward db itsodb stop"


    # Table rollforward recovery


    If the database is enabled for forward recovery, you have the option of backing
    up, restoring, and rolling forward table spaces instead of the entire database.
    You can perform table space rollforward recovery to the end of the logs or to
    a certain point in time. The point in time you specify must be greater or equal
    to the minimum recovery time for that table space. 6-22 shows how to determine
    that time.


