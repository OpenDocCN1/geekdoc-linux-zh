- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_234_0.png)


    Figure 5-14 Buttons to switch between recently used perspectives


    Here are several of the available perspectives:


    +   - Data

    This is the default perspective that you get if you enter the Data Studio. It
    allows you to manipulate your database, database objects, and data.


    +   - Debug

    You are asked to switch to this perspective if you start debugging a Java program.
    It supports you in debugging code.


    +   - J2EE

    Provides a layout that is more useful if you develop Java 2 Platform Enterprise
    Edition (J2EE) applications. You might use it if you create Web services that
    access your data.


    +   - Java

    This perspective is for developing Java applications.


    +   - Team Synchronizing

    This perspective offers you the tools for synchronizing your code with the code
    repository.


    # Views


    A view is a representation of a resource in a project. A resource can be a certain
    type of file or an object in the database. All views of a certain resource are
    synchronized between each other automatically, which means that if you change
    anything in one view, you can see the result immediately in all other views that
    represent the same resource.


    The sample perspective shown in Figure 5-13 on page 212 has the following views:


    +   - Data Project Explorer: This view lists the projects on which you are working
    in a hierarchical structure.


    +   - Database Explorer: This view shows the defined database connections. It
    shows the database objects of the related connection in a hierarchical structure.


    +   - Editor: Located in the center, the Editor is the main working pane. In our
    example, you see an Extensible Markup Language (XML) editor,'
