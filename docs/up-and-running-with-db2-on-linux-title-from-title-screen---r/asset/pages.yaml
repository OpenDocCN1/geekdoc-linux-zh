  md: '# PHP overview


    PHP is a scripting language that is most often embedded in HTML documents and
    executed on the server before output is sent to the Web browser. You can also
    use it as a command-line tool outside of the Web server environment.


    Learning PHP is easy, but developing and managing applications takes care. Fortunately,
    there is a large community of users and a myriad of libraries to make your job
    easier. In particular, the Zend Framework and CakePHP provide Web application
    foundations and database abstraction facilities, which ease migration to DB2 from
    another data server, such as MySQL™. The PEAR project also provides high quality
    components that are written in PHP and that are intended for reuse.


    > Tip: You can learn more about PHP at IBM developerWorks®. Refer to the Recommended
    PHP reading list at:

    http://www.ibm.com/developerworks/opensource/library/os-php-read/


    # PHP and DB2


    There are four extensions that you can use to write PHP applications with DB2.
    All of the PHP interfaces ultimately communicate with DB2 using the call level
    interface (CLI). The interfaces are PHP extensions, which are written in C and
    compiled with the DB2_* functions when you install PHP:


    +   - ibm_db2 provides the db2_* functions.

    - PDO_IBM provides the Product Delivery Option (PDO) object for CLI.

    - PDO_ODBC provides the PDO object for Open Database Connectivity (ODBC).

    - Unified ODBC provides the odbc_* functions.


    IBM recommends using ibm_db2 or PDO_IBM to get the best performance and features
    out of DB2. Which interface you choose is dependent on the type of application
    that you are writing and the version of PHP (4 or 5).


    Refer to chapter 4 of Developing PHP Applications for IBM Data Servers, SG24-7218,
    to learn more about choosing and installing a PHP extension for DB2.


    > Tip: The Zend Core for IBM provides all the DB2 interfaces for PHP in an easily
    installed and supported package:

    http://www.zend.com/en/products/core/for-ibm'
