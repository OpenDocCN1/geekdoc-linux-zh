  md: '# 1.3 DB2 environment


    This section describes the various DB2 application configurations on Linux. It
    also discusses the parallelism in SMP and clusters and describes DB2 architecture.


    # 1.3.1 Deployment topologies


    DB2 for Linux can be used with a wide range of applications, whether they are
    developed in-house or pre-packaged. The applications can be deployed with DB2
    using a number of configurations.


    # Single-tier


    In this configuration, the application and the database reside on the same system.
    In enterprise environments, it can be rare to see such a configuration, because
    remote access to a database server is typically required. Nonetheless, this is
    quite common for developing applications that can later be deployed transparently
    in a multi-tier DB2 environment without any changes.


    # Client/Server or two-tier


    The application and the database reside on separate systems. The machines where
    the application runs typically have a DB2 client installed, which communicates
    over the network to a database server. For the application, the physical location
    of the data is transparent. The application communicates with the DB2 client using
    a standard interface (for example, ODBC) and the DB2 client takes over the task
    of accessing the data over the network. In certain cases, such as browser or Java-based
    access, it is not necessary for the DB2 client to run on the same machine where
    the application executes.


    DB2 provides exceptional flexibility for mixing and matching client platforms
    in a heterogeneous environment. DB2 client and server code are available for a
    wide variety of platforms. For example, the application can execute on a Windows-based
    machine with DB2 client for Windows, which can then access a DB2 database on a
    Linux server. Likewise, the Linux machine can act as a client and access data
    from UNIX servers or mainframes.


    # Multi-tier


    In a multi-tier configuration, the application, DB2 client and the data source
    typically reside on separate systems. Examples of these configurations include,
    but are not limited to, the scenarios illustrated in Table 1-1 on page 12.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Table 1-1 Multi-tier configuration examples


    | Client | Middle-tier | Server |

    | --- | --- | --- |

    | Web-browser | Web server DB2 client | DB2 database server |

    | Application client | Application server DB2 client | DB2 database server 1 DB2
    database server 2 |

    | Application DB2 client | DB2 connect gateway | OS/390® AS/400® VM/MSE |

    | Application DB2 client | DB2 server | Secondary data sources (for example, mainframe
    DB2, non-DB2, and non-relational) |


    IBM recognizes that, in many cases, there can be a need for accessing data from
    a variety of distributed sources rather than one centralized database. The data
    sources can be from IBM, such as DB2 or Informix, or non-IBM databases, such as
    Oracle®, or even non-relational data, such as files or spreadsheets. As illustrated
    in the last scenario in Table 1-1, IBM offers the most comprehensive business
    integration solution by allowing federated access to a variety of distributed
    data sources.


    Figure 1-1 shows an example of the scalable three-tier architecture.


    ![](img/f11f73c917561aadc89cbf81db6d9105_33_0.png)


    Figure 1-1 Sample scalable three-tier architecture'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Tier 1 represents clients that connect to the application through an intranet
    or Internet. Tier 2 is the application hosted in an application server, such as
    WebSphere®. A load balancer and a proxy component distribute the requests equally
    to the various application servers. If the traffic increases, new application
    servers can be easily added in order to increase the throughput.


    Tier 3 consists of two partitioned database clusters. If the load on one database
    cluster increases, a partition can be added to the database cluster easily to
    adhere to the new load. The standby cluster is a copy of the running cluster.
    In case of an outage of the primary database cluster, the application requests
    will be transparently redirected to the standby cluster.


    In Chapter 8, "Application development" on page 425, you can see a more detailed
    description of how applications can be configured to implement the various tiers.


    # OLTP compared to the Decision Support System


    You can distinguish between Online Transaction Processing (OLTP) and Decision
    Support Systems (DSSs) based on the type of their workload. OLTP systems process
    the business-related transactions. DSS-based systems typically have large and
    long running reports. DB2 offers many features to tune both types of workload.
    Figure 1-2 shows an example architecture.


    ![](img/f11f73c917561aadc89cbf81db6d9105_34_0.png)


    Chapter 1. Introduction 13'
