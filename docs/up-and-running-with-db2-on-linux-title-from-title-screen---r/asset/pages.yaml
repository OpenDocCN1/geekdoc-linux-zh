    # Log space


    By default, DB2 sets the log path to the default database path during database
    creation. For example, our default database path is /database and our log path
    is:


    ```

    /database/db2inst1/NODE0000/SQL00001/SQLLOG0DIR/

    ```


    We recommend that you store both the primary copy of the logs and the mirror logs
    each on a physically separate disk, preferably a disk that is also on a different
    disk controller.


    Mirror logs are created using the MIRRORLOGPATH configuration parameter. Mirroring
    allows the database to write an identical copy of log files to a different path.


    > Note: Mirroring log files help protect a database from accidental deletion of
    an active log and data corruption that is caused by disk error. While this functionality
    increases the high availability of a system, mirroring can impact system performance,
    because all log data will be written to both the log path and the mirror log path.'
