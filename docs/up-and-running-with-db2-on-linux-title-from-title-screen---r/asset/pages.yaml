    # 6.4.2 Task Center and Scheduler


    After the DAS has started and the Tools Catalog is ready, you can start the Task
    Center within the DB2 Control Center or other tools where the Tools menu is available.
    You can use the Task Center to run tasks, either immediately or according to a
    schedule, and to notify people about the status of the completed tasks. The Task
    Center includes functionality from the Script Center in previous versions of DB2,
    plus additional functionality.'
  merge: -1
