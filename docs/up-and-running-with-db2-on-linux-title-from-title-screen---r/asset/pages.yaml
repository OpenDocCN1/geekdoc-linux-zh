  md: '# 6.3 Moving data using EXPORT, IMPORT, LOAD, and dbmove


    In this section, we discuss data movement using DB2 EXPORT, IMPORT, and LOAD commands.
    EXPORT allows you to export data from database tables into files with different
    file formats. IMPORT writes data into database tables from a source data file.
    LOAD provides the capability to move a large volume of data into the database
    tables quickly. We describe the usage of these utilities, as well as the considerations
    when using the load utility under a multiple database partition environment. The
    dbmove utility can be helpful if you work with many tables.


    # 6.3.1 Export data to files from database tables and views


    You can use the DB2 export utility to write data from a DB2 database to one or
    more files stored outside of the database. You can then import or load the exported
    data into another DB2 database using the DB2 import or DB2 load utility, respectively.
    Or, you can import the data into another application, such as a spreadsheet. You
    specify the data to be exported by supplying a SELECT statement or by providing
    hierarchical information for typed tables.


    Before invoking, you need to establish a connection to the database, explicitly
    or implicitly. You can invoke the export utility through the DB2 Command Line
    Processor (CLP), the DB2 Control Center, by calling the ADMIN_CMD stored procedure,
    or through an Application Programming Interface (API).


    # Export table data through the CLP


    Example 6-46 is a sample to export data from a table named ITEM, which is spread
    across two partitions by using the DB2 CLP.


    Example 6-46 Export all data from table ITEM


    ```

    db2inst1@mensas/db2backup/datame~ db2 export to item.ixf of if select *

    from item''

    SQL3104N The Export utility is beginning to export data to file "item.ixf".

    SQL3105N The Export utility has finished exporting "3000000" rows.

    ```


    Number of rows exported: 300000


    The data across both database partitions has been exported. You can export data
    for only one database partition, such as the data residing on the current database
    partition, as shown in Example 6-47 on page 304.


    ![](img/f11f73c917561aadc89cbf81db6d9105_324_0.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'Example 6-47 Export data for current database partition from table ITEM


    ```

    db2inst1@mensa:db2backup/datamove> db2 ''export to itempart0.del of del messages
    exppart0.msg select * from item where dbpartitionnum(itemid) = current dbpartitionnum''

    ```


    Number of rows exported: 150364


    We specified a messages file called exppart0.msg. The export utility writes error,
    warning, and informational messages into this file. For all interfaces except
    the CLP, you must specify the name of the messages file in advance with the MESSAGES
    parameter.


    If you want to export data in parallel across multiple database partitions, you
    can use the db2_all tool.


    # Export table data using the Control Center


    You can also use the DB2 Control Center to invokeing on a Linux platform. Expand
    the object tree in the Control Center until you find the Tables or the Views folder.
    Any existing tables or views are displayed in the contents pane on the right side
    of the panel. Right-click the table or view that you want, and a menu listing
    all of the activities for the table or view shows. Refer to Figure 6-29 on page
    305.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_326_0.png)


    Figure 6-29 Table context menu


    You can choose EX to open the export table notebook. Refer to Figure 6-30 on page
    306. You can choose the output format of export by the File Format options, or
    by input the SQL statement manually or by SQL Assist Wizard over the SELECT statement.
    In the Messages field, you can specify the messages file to be created for the
    error, warning, and informational messages associated with the EX operation. In
    addition, if you want to know the command that DB2 generated for this task, click
    Show Command. A pop-up panel appears showing the generated command. Furthermore,
    you can use the Schedule function that is provided by DB2 to schedule a time to
    run this export task by choosing the Schedule tab on the panel.


    Chapter 6. Administering databases 305'
