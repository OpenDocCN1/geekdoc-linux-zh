  md: '# 5.3.1 Terminology


    IBM Data Studio is an Eclipse-based application. It uses the same terminology
    as other Eclipse- based applications, such as workspace, perspectives, views,
    and so on.


    # Workspace


    A workspace is a logical collection of projects that you define. It contains all
    of the files of your current local working environment. When you start the Data
    Studio, it prompts you for a workspace location. This Welcome panel contains several
    links for learning the Data Studio. You can omit this prompt in the future by
    selecting the check box on that panel.


    You can use as many workspaces as you want. There is no direct relationship between
    them. You can use workspaces to organize projects for different applications or
    different versions of a project.


    > Note: You can always get back to the Welcome window by selecting Help → Welcome.


    If you want to share a workspace in your team, use the Team functions that are
    described in 5.3.2, “Team function” on page 216.


    A workspace is presented through the views that are laid out within a perspective.
    When you close the Welcome panel, a perspective that has information from the
    workspace is presented. Refer to Figure 5-13 on page 212.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_233_0.png)


    # # Perspectives


    A perspective is a collection of views and editors grouped into a particular layout.
    Perspectives reflect different roles or tasks within your workspace, for instance,
    the debug perspective, the data perspective, and the version control perspective.


    You can switch to a different perspective by selecting Window -> Open Perspective
    -> ... and then selecting one of perspectives in the submenus. You can also create
    your own perspectives or modify existing ones. Figure 5-13 shows the Data perspective.


    At the top right of the panel, you can see the recently used perspectives (Figure
    5-14 on page 213). Clicking one of the recently used perspectives switches to
    the related perspective.


    212 Up and Running with DB2 on Linux'
  merge: -1
