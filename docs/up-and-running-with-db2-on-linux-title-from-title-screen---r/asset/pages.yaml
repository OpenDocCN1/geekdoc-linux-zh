  md: '# Monitoring and troubleshooting DB2


    In this chapter, we discuss DB2 monitoring and troubleshooting features. We describe
    the following topics:


    +   - Health Monitor and Health Center

    - Memory Visualizer and Memory Tracker (db2mtrk)

    - IBM single system monitor view for DB2 (db2top)

    - Log files for troubleshooting

    - DB2 problem determination (PD)/problem source identification (PSI) tools

    - Linux system monitoring tools'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 7.1 Health Monitor and Health Center


    Health Monitor and Health Center are two DB2 features that can help you monitor
    the health of your DB2 systems. These tools add a management-by-exception capability
    to DB2 by alerting you to potential health issues. This enables you to address
    health issues before they become real problems that affect your system.


    # 7.1.1 Health indicator and Health Monitor


    Next, we explain the concepts of the health indicator and the Health Monitor.


    # Health indicator


    Prior to using the Health Monitor, you need to understand the concept of a health
    indicator. A health indicator is a measurement that gauges the been of an aspect
    of an object. The Health Monitor uses these indicators to evaluate specific aspects
    of database manager or database performance.


    DB2 comes with default settings for all health indicators. Using the Health Center,
    DB2 commands, or application programming interfaces (APIs), you can customize
    the settings of the health indicators and define who to notify and what script
    or task to run if an alert is issued. For example, you can customize the alarm
    and warning thresholds for the amount of space that is used in a table space.


    # Health Monitor


    The Health Monitor is a server-side tool that monitors the health of the instance
    and all active database objects when DB2 is started. The Health Monitor is enabled
    by default when an instance is created; you can deactivate it by using the database
    manager configuration parameter HEALTH_MON.

    The Health Monitor gathers information about the health of the system using interfaces
    that do not impose a performance penalty. It does not turn on any snapshot monitor
    switches to collect information. The Health Monitor automatically evaluates a
    set of health indicators, even without user interaction. If the Health Monitor
    discovers that a threshold has been exceeded (for instance, the available log
    space is insufficient), or if it detects an abnormal state for an object (for
    example, an instance is down), the Health Monitor raises an alert. There are three
    types of alerts: attention, warning, and alarm. Any time that an alert is raised,
    the Health Monitor might take any of the following actions to report it:


    +   Record the alert in the Journal (all alarm alerts are written to the Journal).'
  merge: -1
  pgno: 375
- img_proc: true
  md: '+   Send alert notifications through e-mail or a pager address to the person
    responsible for the system.


    +   Carry out one or more predefined actions (for example, running a task).


    You can DB2 commands or APIs to retrieve health information from the Health Monitor,
    allowing you to integrate DB2 Health Monitoring with existing system-wide monitoring
    solutions.


    # 7.1.2 Monitoring with the Health Center


    The Health Center provides the graphical interface to the Health Monitor. You
    use it to configure the Health Monitor, to define the threshold values for the
    desired health indicators and related activities when the threshold values are
    exceeded, for example, a notification to the database administrator (DBA) or the
    execution of a follow-up task. You can also use Health Center to view the rolled
    up alert state of your instances and database objects. Using the Health Monitor''s
    drill-down capability, you can access details about current alerts and obtain
    a list of recommended actions that describe how to resolve the alert.


    You can start the Health Center by selecting Health Center from the Tools menu
    within any DB2 GUI tools where Tools menu is available or by executing the command
    db2icm from the Command Line Processor (CLP).


    # Activating the Health Monitor


    The Health Monitor is activated by default, and if it is stopped for any reason,
    you can reactivate it using Health Center or using DB2 CLP commands.


    When the Health Monitor is stopped because the HEALTH_MON parameter in the database
    manager configuration (DBM Config) is OFF, the Health Monitor item will appear
    in the pop-up window when you right-click the instance name, as shown in Figure
    7-1 on page 356. Similarly, the Stop Health Monitor item will appear if HEALTH_MON
    is set to ON and the Health Monitor is started.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_377_0.png)


    Figure 7-1 Start Health Monitor for an instance using Health Center


    You can use DB2 CLP commands to activate the Health Monitor by updating the HEALTH_MON
    parameter for DBM and to view the current setting of the HEALTH_MON parameter
    as shown in Example 7-1.


    Example 7-1 Check If Health Monitor is enabled for the instance


    ```

    db2inst1@db2/db2inst> db2 get dbm cfg | grep -i health

    Monitor of instance and databases (HEALTH_MON) = OFF

    db2inst1@db2/db2inst> db2 update dbm cfg USING HEALTH_MON ON

    DB20000I The UPDATE DATABASE MANAGER CONFIGURATION command completed successfully.

    db2inst1@db2/db2inst> db2 get dbm cfg | grep -i health

    Monitor of instance and databases (HEALTH_MON) = ON

