  md: '# 8.5.2 Design Advisor


    The Design Advisor can help significantly improve the performance of your queries.
    It takes a set of SQL statements called a workload and suggests ways to improve
    the performance. The suggestions can include:


    +   - Creating new indexes

    - Creating materialized query tables (MQTs)

    - Clustering indexes

    - Converting to multidimensional clustering (MDC) tables

    - Redistributing tables

    - Deleting unused indexes and MQTs


    There are two ways to call the Design Advisor: from the command line by the command
    db2advis and from the Control Center.


    > Note: The Design Advisor is described in detail in Tuning Database Performance,
    SC23-5867, and in the Information Center by selecting Database fundamentals ->
    Performance tuning -> Tuning database performance -> Design Advisor.


    ![](img/f11f73c917561aadc89cbf81db6d9105_488_0.png)


