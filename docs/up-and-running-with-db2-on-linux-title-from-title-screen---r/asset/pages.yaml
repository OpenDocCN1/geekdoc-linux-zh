  md: '# Issuing commands to multiple database partitions


    In this appendix, we discuss commonly used DB2 commands in a multiple partition
    environment (MPE). These commands are useful when you need to collect information
    from multiple database partitions or machines or run specific commands against
    multiple partitions or machines. The commands that we discuss in this appendix
    include db2_ps, db2_a11, rah, db2_call1_stack, and so on.'
  merge: -1
  pgno: 514
- img_proc: true
  md: '# db2_all and rah


    In a multiple partition environment, you might want to issue commands to run more
    than one machine or partition in the instance, and you do not want to repeat the
    same commands on every machine or partition involved. For this purpose, you can
    use the **rah** command or the **db2_all** command.


    The **rah** command allows you to issue commands that you want to run on all machines
    across which the instance is spread. If you want the commands to run at the database
    partition level in the instance, you run the **db2_all** command.


    To run a command on all machines with **rah**, the general command syntax is:

    `rah [ commands ]`


    To run the commands on all of the database partitions that you specify, use the
    **db2_all** command. The general command syntax is:

    `db2_all [ commands ]`


    If the command that you want to use does not follow the **rah** or **db2_all**
    command, you will be prompted to enter a command by **rah** and **db2_all**. In
    general, if you specify the command that you want as a parameter on the command
    line, you must enclose the command in double quotation marks if it contains any
    of the following special characters:


    ```

    | & ; < ( ) { } [ ] unsubstituted $

    ```


    To obtain help information about the **db2_all** or **rah** syntax, type either:

    `db2_all "?`

    or


    There are certain command prefix sequences (in this context, a prefix sequence
    is one or more special characters) for **db2_all** and **rah** that can be used
    to control the command running mode, such as:


    +   - Running commands in sequence or in parallel on all involved machines or
    partitions

    - Running commands in the foreground or background

    - Whether to execute an environment setting script before executing specific commands


    Table A-1 on page 495 shows several commonly used command prefix sequences.'
  merge: -1
  pgno: 515
- img_proc: true
  md: "# Table A-1 Commonly used prefix sequences for db2_all and rah\n\n| Sequence\
    \ | Description |\n| --- | --- |\n| I | Runs the commands in sequence in the background.\
    \ |\n| I& | Runs the commands in sequence in the background and terminates the\
    \ command after all remote commands have completed. |\n| II | Runs the commands\
    \ in parallel in the background. |\n| II& or; | Runs the commands in parallel\
    \ in the background and terminates the command after all remote commands have\
    \ completed. |\n| < | The commands are sent to all of the machines for running,\
    \ except one. |\n| <<nnn | Commands are sent to all other database partitions\
    \ but not the database partition nnn for running. |\n| <<+nnn> | Commands are\
    \ sent to only database partition nnn for running. |\n| > | Substitutes occurrences\
    \ of <-> by the machine name. |\n| \" | Substitutes occurrences of () by the machine\
    \ index and substitutes of # by the node number. |\n\nExample A-1 shows how to\
    \ connect and list all of the table spaces on all database partitions.\n\nExample:\
    \ A-1 Using db2_all on a multiple partition environment\n\n```\ndb2inst1@gemini:~\
    \ db2_all \"db2 CONNECT TO itsdb;db2 LIST TABLESPACES\"\n```\n\nDatabase Connection\
    \ Information\n\n| Database server = DB2/LINUX8664 9.5.0 |\n| SQL authorization\
    \ ID = DB2IINST1 |\n| Local database alias = ITSDB0 |\n\nTablespaces for Current\
    \ Database\n\n| Tablespace ID = 1 |\n| Name = TEMPSPACE1 |\n| Type = System managed\
    \ space |\n| Contents = System Temporary data |\n| State = 0x0000 |\n| Detailed\
    \ explanation: \nNormal |\n\nAppendix A. Issuing commands to multiple database\
    \ partitions 495"
  merge: -1
