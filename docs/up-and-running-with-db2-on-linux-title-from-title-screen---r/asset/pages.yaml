  md: '# 2.3.4 Installing DB2 license files


    You must install a license key for each DB2 copy. Therefore, in a partitioned
    environment, you must install a license key on each machine participating in the
    partitioned database system. You install a license key by adding a DB2 license
    file using the db2licm command:


    +   1. Log in as root user or instance owner. For a non-root installation, log
    in as the instance owner.

    2. Enter the following command:

    ```db2licm -a <filename>```

    where filename is the filename that contains the valid license information.

    For example, if you want to install the license key with the ''DB2 Workgroup Server
    Edition Authorized Option'', enter the following command:

    ```db2licm -a db2wse_u_lic```


    On Linux, the DB2 license keys are located in the DB2DIR/license in a file called
    nodelink, where DB2DIR is the instance directory where the DB2 copy is installed.


    # 2.3.5 Installing DB2 documentation


    DB2 Version 9.5 provides the DB2 Information Center and PDF documentation on separate
    DVDs. These DVDs ship with your client and server DVDs:


    +   DB2 Information Center DVD

    The DB2 Information Center gives you access to all of the information you need
    to take full advantage of DB2 products. It is installed separately from other
    DB2 products from its own DVD, which means you can install DB2 Information Center
    immediately after installing DB2, or at a later time. You can install the DB2
    Information Center on a machine that does not have DB2 installed, such as your
    company''s internal web server, which will save space on individual machines.

    You can also access the DB2 Information Center from the IBM Web site at:

    `http://publib.bolder.ibm.com/infocenter/db2luw/9r5`


    +   PDF documentation

    Unlike the DB2 Information Center, you do not need to install the PDF documentation.
    This DVD provides PDF files that you can read directly from the DVD or copy onto
    your machine. For the latest information about DB2 database product documentation,
    refer to the Web site:

    `http://www-1.ibm.com/support/docview.wss?rs=71&uid=swg27009474`'
