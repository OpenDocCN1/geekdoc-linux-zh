    of the processes.

    - The pstree command can be used to display a tree of processes.

    - The netstat command is used for network file system (NFS)-specific statistics.


    In addition, pgrep and pkill commands are helpful when you want to look up or
    signal processes that are based on the name and attributes of the processes. And
    if you like to use monitoring tools with a graphical user interface,'
