    \ compilers\n\n| Linux version | Compiler version |\n| --- | --- |\n| Linux on\
    \ x86 (32-bit DB2 instances and compilers) | GNU/Linux gcc versions 3.3 and 3.4\
    \ Intel C Compiler Version 9.0 |\n| Linux on AMD64/EM64T (x86-64, x64) | GNU/Linux\
    \ gcc versions 3.3 and 3.4 Intel C Compiler Version 9.0 |\n| Linux on IFP (IA64)\
