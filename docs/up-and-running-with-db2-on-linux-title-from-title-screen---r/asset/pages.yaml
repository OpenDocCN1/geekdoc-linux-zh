    The Runtime Client is a lightweight, non-graphical client that provides the functionality
    required for your application to access DB2 servers. It provides application support
    to run applications that use embedded SQL, CLI, Java Database Connectivity (JDBC),
    SQLJ, ODBC, Object Linking and Embedding (OLE) DB, .NET, and Hypertext Preprocessor
