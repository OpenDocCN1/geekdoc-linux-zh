    # Editors


    Editors are associated with the type of the file that you edit. For instance,
    in Figure 5-13 on page 212, the XML editor is used to edit the XML file. For other
    file types, there are other editors available. If there is no editor for a particular
    type, the text editor is used. The editor toolbar (Figure 5-16) allows you to
    move around between annotations in your file.


    ![](img/f11f73c917561aadc89cbf81db6d9105_236_0.png)


    Figure 5-16 Editor tool bar


    # Projects


    Projects are used to organize your resources. For instance, a Java project contains
    the source files, built files, and meta information files for your Java application.
    A Data Project is related to a database connection and stores all of the information
    about this project. In the file system, a project is represented as a subdirectory
    in your workspace.'
