  md: '# Migration and fix packs


    When migrating DB2 from Version 8 or Version 9.1 to Version 9.5, there are several
    important steps to perform before and after installation to ensure a safe and
    successful migration.


    In this chapter, we describe DB2 server migration from Version 8.2 and Version
    9.1 to Version 9.5, as well as fix pack installation. We discuss:


    +   - Migration planning

    - Migrating multi-partitioned database

    - Migrating single-partitioned database

    - Post-migration tasks

    - Client and server compatibility

    - Fix pack installation


    For complete information about migrating a DB2 server and other components, such
    as clients and applications in your DB2 environment, refer to the DB2 Information
    Center at:


    ```

    http://publib.boulder.ibm.com/infocenter/db2luw/v9r5/index.jsp?topic=com.ibm.mdb2.luw.qb.ibm.doc/doc/0023662.html

    ```


    DB2 also provides migration tools and services from other databases, such as Oracle
    and Microsoft SQL Server®. For further information, refer to this Web site:


