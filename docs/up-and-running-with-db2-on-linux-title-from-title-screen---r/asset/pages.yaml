    The database is now enabled to take database backups in online mode, as to back
    up individual table spaces.


    # More parameters for log management


    With the setup we performed, the logs were archived automatically by the DB2 log
    manager (db2logmgr) to another file system called /db2archive. Depending on your
    company''s needs about log archiving, you might consider setting other configuration
    parameters.


    For log archiving, checking the following parameters:


    +   * LOGARCHMETH2  This parameter specifies a second location or method to archive
    the log files. This parameter can be set similar to LOGARCHMETH1, but it points
    to a different location, such as another file system or Tivoli Storage Manager.
    If both LOGARCHMETH1 and LOGARCHMETH2 are specified, each log file is archived
    twice, which means that you will have two copies of archived log files in two
    locations.'
