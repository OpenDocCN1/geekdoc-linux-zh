- img_proc: true
  md: '# 4.2.2 Install DB2 Version 9.5


    Install DB2 in all of the machines of the partitioned environment. We provide
    the installation details in Chapter 2, "Installation" on page 25.


    # 4.2.3 Migrating instances and databases


    All of the steps that we have performed up to now are to prepare for the instances
    and databases migration. The db2 imigr command is used to migrate the instances
    to the Version 9.5 format. The db2 migrate database command is used to migrate
    the databases.


    The db2migr command performs these tasks:


    +   - Checked databases to make sure they are ready for migration through db2ckmig.


    +   - Migrate your instance to a Version 9.5.


    +   - Update the system and local database directories to the Version 9.5.


    +   - Merge the prior 9.5 version DBM configuration settings presented in your
    environment with new Version 9.5 DBM configuration settings.


    In the rest of this section, we guide you through a procedure to complete the
    migration. The steps are:


    +   1. Log in the instance owner to the database partition server that owns the
    instance. The first entry of the db2node.cfg file shows the database partition
    server that owns the instance. Example 4-7 shows a db2nodes.cfg. In this example,
    mensa is the database partition server that owns the instance.


    > Example 4-7 Mensa as database partition server that owns the instance


    ```

    dfpus1@mensa:~ > /home/dfpus1/sqllib/db2nodes.cfg

    mensa 0

    1emini 0

    ```


    +   2. Stop the instance by running the db2stop force command.


    +   3. Log in as root and run the db2migr command to migrate your instance to
    Version 9.5. Use the following syntax:


    ```

    $DB2DIR/instance/db2migr [-u <fenced_user>] instance_name

    ```'
