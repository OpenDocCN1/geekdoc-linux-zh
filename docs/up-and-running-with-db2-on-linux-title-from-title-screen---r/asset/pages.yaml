    # 7.6.2 vmstat command


    You can use the vmstat command to report virtual memory statistics, as well as
    information about processes, paging, block I/O, and CPU activities. The vmstat
    command is contained in the procps package for the Linux platform.


    The first report that vmstat produces averages since the last startup. Additional
    reports give information about a sampling of length of delay. The process and
    memory reports are instantaneous in either case'
