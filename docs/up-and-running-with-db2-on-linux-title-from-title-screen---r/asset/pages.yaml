  md: '# Administering databases


    In this chapter, we provide information regarding important database maintenance
    tasks for DB2 on Linux platforms, such as database backup and recovery, table
    and index reorganization, and data movement via utilities, such as EXPORT, IMPORT,
    LOAD, and so on. We discuss these topics:


    +   - Database backup and recovery:

    - Considerations for choosing database and table space recovery methods

    - How to enable the automatic backup feature

    - Basic usage of the utilities (BACKUP, RESTORE, and ROLLFORWARD)

    - Table and index reorganization and statistics collection:

    - Automatic table maintenance feature

    - Table reorganization

    - Statistic collection

    - Package rebinding

    - Data movement using EXPORT, IMPORT, and LOAD

    - Job scheduling using the Task Center'
