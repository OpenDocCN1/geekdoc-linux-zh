    in DB2 to use this Java routine as shown in Example 8-23.


    Example 8-23 Create the UDF in DB2


    ```

    CREATE FUNCTION hello(VARCHAR(40)) RETURNS VARCHAR(60)

    FENCED

    EXTERNAL NAME ''HELLOJAR:hello.hello''

    NOT VARIANT NO SQL PARAMETER STYLE LANGUAGE java

    NOT EXTERNAL ACTION

    ```


    The external name refers to the file *HELLOJAR.jar*, which was registered by the
    call sqlj.install_jar. The first *hello* refers to the class name, and the second
    *hello* refers to the method name.


