- img_proc: true
  md: "# General table space considerations\n\nBy default, DB2 creates three table\
    \ spaces:\n\n+   * The catalog table space, which stores the catalog tables\n\
    * The user table space, which stores all table and index data\n* The temporary\
    \ table space, which is used for storing temporary data while\n  SQL statements\
    \ are being processed\n\nHowever, it makes sense to split the data into more table\
    \ spaces and to create\nyour own layout. Here are the main reasons for that:\n\
    \n+   * The caching of the data in the table spaces can be tuned by the related\
    \ buffer\n  pools. Buffer pools are caching areas and are assigned to one or more\
    \ table\n  spaces. Having different table spaces allows you to tune the caching\
    \ areas\n  separately for you. You can separate rarely used tables from heavily\
    \ used\n  tables.\n\nYou can also tune the I/O performance of a table space by\
    \ putting thencontainers of one table space on different physical disks.\n\n+\
    \   * You can perform backup at the table space level. Separate table spaces allow\n\
    \  you to implement backup strategies.\n\n+   * You can grant permission to create\
    \ objects to table spaces, which\n  allows you to implement more granular control.\n\
    \n+   * At the table creation, you can specify that data will go into one table\n\
    \  space, index data into another table space, and also long data into another\n\
    \  table space. We especially recommend that you put long data into a different\n\
    \  table space, because long data is not cached in the buffer pool and requires\n\
    \  file system caching. After you have defined the table spaces for a table, you\n\
    \  can change the table spaces only by recreating the table.\n\n+   * Storage\
    \ usage of a table is limited within the table space. If one in a\n  table space\
    \ takes up the entire disk space of the table space, in other\n  table spaces\
    \ are not affected.\n\nDefining table spaces requires more design, implementation,\
    \ and\nmaintenance work. How many table spaces must be defined and how the table\n\
    spaces are placed on the disks depends on the complexity and requirements of\n\
    the application."
  merge: -1
  pgno: 118
- img_proc: true
  md: '# SMS table spaces


    System Managed (SMS) table spaces are handled by the underlying operating system,
    which is Linux in our case. At the creation of the table space, you specify directory
    names as containers. Here are considerations for choosing SMS table space:


    +   - The disk is not allocated until it is used.


    +   - It is easy to increase the SMS table spaces. You only have to increase the
    underlying file system space. DB2 will use it automatically.


    +   - Because of the previous two reasons, it is a good practice to use an SMS
    table space for the temporary table space.


    +   - You cannot add or delete containers, which can be an issue if you want to
    enhance the parallel I/O performance by adding another container on a physical
    disk.


    +   - You might reach file system-related limits with the file size of the files
    created by the database in the SMS-managed file systems.


    +   - The table space is full if one of the containers is full.


    +   - Creating an SMS table space requires less initial work, because you do not
    have to redefine the container sizes.


    +   - You cannot split table, index, and long data into separate table spaces
    for tables that reside within an SMS table space.


    # DMS table spaces


    Database Managed (DMS) table spaces are managed by DB2. At the creation of the
    table space, you specify the container files or raw devices and their sizes. Although
    the size is defined at the table space, it can be extended or reduced later. DB2
    can also extend table spaces automatically, as described in “Automatic resizing
    of table spaces” on page 99. Considerations for choosing DMS table spaces include:


    +   - You can split index data and long data into separate table spaces that reside
    in DMS table spaces.


    +   - The size of a table space can be increased by adding or extending containers,
    using the ALTER TABLE SPACE statement. Existing data can be automatically rebalanced
    across the new set of containers to retain optimal I/O efficiency.


    +   - DMS table spaces require more administrative overhead. Work has to be performed
    on both Linux and DB2 levels when creating or extending DMS table spaces.


    +   - In general, a well-tuned set DMS table spaces will outperform SMS table
    spaces.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Automatic resizing of table spaces


    DMS table spaces can be created with the option AUTORESIZE YES in order to enable
    the automatic resizing feature. By default, this option is set to NO. You can
    turn this feature on and off after you have created the table space.


    Table spaces with this feature enabled will increase their size automatically
    up to the file system as the space is required. You can specify the initial size,
    and the increase size.


    # Raw devices


    You can create DMS table space containers on block devices directly. This approach
    offers superior performance but requires more administration.


    > Note: Prior to Version 9, direct disk access using a raw controller utility
    on Linux was used. This method is now deprecated, and its use is discouraged.
    The database manager will still allow you to use this method if the Linux operating
    system supports it; however, there will be a message in the db2diag.log indicating
    that its use is deprecated.


    DB2 allows you to create normal SMS and DMS table spaces in the file system with
    the option NO FILE SYSTEM CACHING. The term "normal" means that they are created
    in the file system and not as raw devices. This option, which is the same for
    raw devices, will bypass the double buffering caused by the file system and the
    buffer pools.


    However, device files still have a slight performance advantage over table spaces
    created with the NO FILE SYSTEM CACHING option, because device files do not have
    any file system administration overhead. Device files also offer slightly better
    availability, because they are not dependent on file system failures.


    Because long data bypass the buffer pools, we do not recommend placing long table
    spaces in raw devices. For the same reason, we do not recommend that you place
    the catalog table space on raw devices.


    Now, we demonstrate how to create a table space on a block device.


    In 3-4 on page 100, we use the fdisk command to create new disk partition on an
    empty disk with the name sdb1. We then create one extended disk partition called
    sdb1. After that, we create a logical disk partition called sdb5 within the extended
    disk partition sdb1. Note, under Linux, extended partitions are containers that
    can contain several logical disk partitions.'
