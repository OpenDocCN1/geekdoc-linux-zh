    # Changing the enforcement policy


    The default enforcement policy is Soft Stop. This means that all connections to
    DB2 databases are permitted to connect, even when the license policy is violated.
    When a violation occurs, a license violation message is written to db2diag.log.
    The Hard Stop enforcement policy does not permit any connections. To change the
    enforcement policy from Soft Stop, enter the following command:

    ```db2licim -e db2ese HARD```


    To change the enforcement policy from Hard Stop to Soft Stop, enter:

    ```db2licim -e db2ese SOFT```


    # Generating a compliance report


    To verify the compliance of DB2 features, you can generate a compliance report.
    It lists DB2 features out of your current product entitlement. Each DB2 feature
