  md: '# Full database restore with incremental backup


    The best way to restore an incremental backup image is to use the AUTO option.
    DB2 will collect the needed backup images, full and incremental, to restore the
    database:


    ```

    db2 restore db itsdb incremental from /db2backup taken at 200802049192

    ```


    If you want to know which backup images are required to restore an incremental
    backup, you can use the db2crst command:


    ```

    db2crst -d itsdb -t 2008020491912

    ```


    The command queries the database history and generates a list of timestamps for
    the backup images and the suggested restore order.


    # Rollforward recovery


    To use the rollforward recovery method, the database must be set up as a recoverable
    database. At the end of the restore operation, the database will be in the rollforward
    pending state, which gives you the capability to roll forward the database to
    a specific point in time or to the end of the log.


    > Note: There are steps involved in restoring and rolling forward the database
    using the RESTORE and the ROLLFORWARD commands. Or, you can use the RECOVER command
    to restore and roll forward the database with only one command:


    ```

    db2 recover database itsdb

    ```


    The RECOVER command reads the database file to get all of the necessary information
    to restore and roll forward the database.


    You can check the progress of the rollforward process with the command:


    ```

    db2 rollforward db itsdb query status

    ```


    Using the rollforward command, you can specify a timestamp or end of logs, which
    tells the database how far to roll forward.


    There are two types of rollforward recovery to:


    +   * Database rollforward

    This process applies transactions that were recorded in the database logs to the
    database. The rollforward utility reads the needed logs, archived or active log
    files. Already archived logs will be retrieved using the log archive method. The
    simplest way to roll forward the database as far as possible is by using the command:


    ```

    db2 "rollforward db itsdb to end of logs and stop"

    ```'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'If you need to roll forward the database to a specific point in time, use the
    following commands:


