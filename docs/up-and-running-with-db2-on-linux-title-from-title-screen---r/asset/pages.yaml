  md: '# Preface


    Linux® is one of the fastest growing operating platforms within the past few years.
    DB2® has long been known for its technology leadership. This IBM® Redbooks publication
    is an informative guide that describes how to effectively integrate DB2 for Linux,
    UNIX®, and Windows® (LUW) with SUSE and Red Hat operating systems. This book provides
    both introductory and detailed information about installing, configuring, managing,
    and monitoring DB2 in a Linux environment.


    We describe the DB2 product family and features for Linux, and we provide step-by-step
    instructions for a single as for a multiple DB2 system installation and configuration.
    We discuss how to migrate single and multiple partition DB2 to DB2 Version 9.5,
    and discuss, in detail, DB2 database administration in a Linux environment, procedures
    and tools for database backup and recovery, online maintenance, and system monitoring.
    We cover DB2 integrated tools and their features and use.


    We discuss aspects of DB2 application development in the Linux environment and
    provide general tips about building and running DB2 applications on Linux and
    the use of DB2 application development tools.


    # The team that wrote this book


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, San Jose Center.


    Whei-Jen Chen is a Project Leader at the International Technical Support Organization,
    San Jose Center. He has extensive experience in database design and modeling,
    DB2 system administration, and application development. Wei-Jen is an IBM Certified
    Solutions Expert in Database Administration and Application Development as well
    as an IBM Certified IT Specialist.


    Christian Hideaki Kondo is a DB2 Systems Support member in Brazil. He has years
    of experience in DB2 and Informix®. He holds a degree in computer science from
    Universidade Estadual Paulista (UNESP). His areas of expertise include DB2 Engine
    and Business Intelligence (BI) solutions, including migrations and performance
    and tuning services. He also is an IBM Certified Advanced Administrator for DB2
    9.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '**Helmut Riegler** is an IT Specialist working for the World Wide Learning
    Applications Development organization in Vienna. He is the technical lead for
    the ongoing support of the learning applications. He has been with IBM since 1998
    and has broad experience in software development and database administration.
    Before he joined IBM, he developed CAD software. He holds an Engineering degree
    in Electrical Engineering.


    **Lifang Liu** is a Senior IT Specialist of the IBM Software Group, IBM China.
    His major job responsibilities are solution design and proposal delivery, technical
    support at the presale stage, and helping clients finish the Proof of Concept/Proof
    of Technology (PoC/PoT) part of their projects. Lifang focuses on supporting DB2
    online transaction processing (OLTP) business, supporting large ISV/OEM clients,
    and supporting DB2/SAP®. Prior to this position, he was a DB2 worldwide L2 support
    engineer working in the Technical Support Center, IBM China. He is an IBM Certified
    Advanced Database Administrator of DB2. His areas of expertise include DB2 troubleshooting,
    database performance management, and database maintenance.


    **Veiko Spranger** is an Advisory IT Specialist in it'' Services and Solutions
    GmbH, an IBM subsidiary, with 14 years of experience in DB2, focusing on DB2 Distributed
    and Business Intelligence. Veiko is a member of the Central Region Frontoffice
    support team and the EMEA BI VFE (virtual front end) and an IBM Certified Advanced
    Database Administrator. He is an SAP Support Backoffice Specialist for DB2 for
    LUW, focusing primarily on DB2 backup, restore, and recovery.'
