    \ gcc versions 3.3 and 3.4 IBM XL C/C++ Advanced Edition 7.0 for Linux |\n| Linux\
    \ on system (s/390x) | GNU/Linux gcc versions 3.3 and 3.4 |\n\nIn order to develop\
    \ C/C++ code, you need the DB2 client installed on your system.\n\n# The CLI interface\n\
    \nThe Call Level Interface (CLI) is a C/C++ application programming interface\n\
    (API) to access DB2. It uses function calls to pass dynamic SQL statements. It\
    \ is\nan alternative to Embedded SQL (ESQL). CLI does not require variables or\
    \ a\nprecompiler.\n\nExample 8-9 shows a CLI program that selects from the EMPLOYEE\
