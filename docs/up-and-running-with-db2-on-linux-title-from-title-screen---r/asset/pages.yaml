    # 13.Run **db2ckmig** in each database partition to verify that a database can
    be migrated. The **db2ckmig** command verifies that all of the following conditions
    are true:


    +   - A cataloged database actually exists.

    - A database is not in an inconsistent state.

    - A database is not in a backup pending state.

    - A database is not in a restore pending state.

    - Table spaces are in a normal state.


    +   - A database does not contain user-defined types (UDTs) with the name ARRAY,
    BINARY, DATALINK, DECFLOAT, VARBINARY, or Extensible Markup Language (XML).


    +   - A database does not contain orphan rows in system catalog tables that will
    cause the database migration to fail.


    +   - A database, which is enabled as a high availability disaster recovery (HADR)
    primary database, allows successful connections.


    +   - A database is not in HDRR standby role.


    IF SYSCAPS is a DMS table space and AUTORESIZE is not enabled, SYSCAPS has at
    least 50% free of the total pages of pages.


    The command syntax is:


    ```

    /db2ckmig -e -llogfile_name

    ```


    In Example 4-5, we scanned all cataloged databases and saved the results to a
    text file db2ckmig.log.


