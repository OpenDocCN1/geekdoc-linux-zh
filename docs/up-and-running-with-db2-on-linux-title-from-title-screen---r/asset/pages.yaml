    # Automatic statistics collection


    Automatic statistics collection helps improve database performance by ensuring
    that you have up-to-date statistics. The database manager determines which statistics
    are required by your workload and which statistics need to be updated. The DB2
    optimizer uses these statistics to determine which path to access the data.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'Statistics can be collected either asynchronously (in the background) or synchronously
    by gathering runtime statistics when SQL statements are compiled. By default,
    automatic statistics collection is set to ON. Real-time statistics gathering can
    be enabled only when automatic statistics collection is enabled. Real-time statistics
    gathering is controlled by the AUTO_STMT_STATS configuration parameter. If this
    configuration parameter is set to ON, table statistics are automatically compiled
    at statement compilation time whenever they are needed to optimize a query.


    Optionally, you can enable the automatic statistics profile generation by setting
    the two configuration parameters to ON:


    +   - AUTO_STMT_PROF

    - AUTO_PROF_UPD


    Automatic statistics profiling advises when and how to collect table statistics
    by detecting outdated, missing, or incorrect statistics, and by generating statistical
    profiles based on query feedback.


    # Automatic reorganization


    After many changes to table data, the table and indexes can become fragmented.
    Logically sequential data can be within a table. In particular, analysis of statistics
    on non-sequential physical pages; therefore, the database manager has to perform
    additional read operations to access data.


    Among other information, the statistical information collected by RUNSTATS shows
    the data distribution within a table. In particular, analysis of these statistics
    can indicate when and what kind of reorganization is necessary. Automatic reorganization
    determines the need for reorganization on tables and indexes by using the REORGCHK
    formulas. It periodically evaluates tables and indexes that have their statistics
    updated to see if reorganization is required. If so, it internally schedules an
    index reorganization or a classic table reorganization for the table. A reorganization
    requires that your applications function without write access to the tables while
    the table is being reorganized.


    In a partitioned database environment, determining whether to carry out automatic
    reorganization and whether to initiate automatic reorganization is done on the
    catalog partition. The reorganization runs on all of the database partitions on
    which the target tables reside.


    # 6.2.2 Manual table maintenance


    If you are not using the automatic table maintenance feature, you need to be sure
    that your table statistics are up-to-date and the tables are reorganized from
    time to time so that the performance of your applications can be kept optimal.'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'DB2 provides the following utilities to perform this job manually:


    +   - REORG

    - RUNSTATS

    - REBIND


    # Table reorganization


    The REORG TABLE option reorganizes a table to match its index and to reclaim space.
    You can reorganize the system catalog tables as well as user tables. DB2 provides
    two methods for reorganizing tables:


    +   - Inplace (online) reorganization


    Inplace table reorganization allows applications to access the table during the
    reorganization. In addition, online table reorganization can be paused and resumed
    by anyone with the appropriate authority by using the schema and name table. A
    simple command for an online reorganization is:


    ```

    db2 reorg table db2inst.item inplace

    ```


    You can also use the ADMIN_CMD procedure to do the regorg:


    ```

    db2 "call sysproc.admin_cmd (''reorg table item inplace")

    ```


    Table db2inst.item will be reorganized online. The INPLACE option of the REORG
    command specifies an offline reorganization. If this is not specified, an offline
    REORG is run.


    +   - Offline (classic) reorganization


    The offline method provides the fastest table reorganization, especially if you
    do not need to reorganize large object (LOB) or LONG data. LOBS and LONG data
    are not reorganized unless specifically requested. In addition, indexes are rebuilt
    in order after the table is reorganized. Read-only applications can access the
    original copy of the table except during the last phases of the reorganization,
    in which the shadow copy replaces the original copy and the indexes. A simple
    command for an offline reorganization is:


    ```

    db2 reorg table db2inst.item

    ```


    You can also use the ADMIN_CMD procedure:


    ```

    db2 "call sysproc.admin_cmd (''reorg table db2inst.item")

    ```'
  merge: -1
  pgno: 302
- img_proc: true
  md: '**Note:** In general, classic table reorganization is faster, but it can be
    used only if your applications function without write access to tables during
    the reorganization. In addition, classic table reorganization will require the
    creation of a shadow copy of the table, so approximately twice as much space as
    the original will be required. If your environment does not allow the use of this
    additional space, although inplace reorganization is slower, it can occur in the
    background while normal data access continues. The features of each method and
    decide which method is more appropriate for your environment. For both online
    and offline reorganization, you can reorganize all database partitions, only one
    database partitions, or a set of database partitions.


    You can use the DB2 Control Center for table reorganization. Expand the object
    tree in the Control Center until you find the Tables folder. Existing tables are
