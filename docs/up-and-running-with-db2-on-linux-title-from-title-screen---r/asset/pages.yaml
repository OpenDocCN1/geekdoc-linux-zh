    > Note: With Db2 Version 9.5, you do not need use db2_a11 to execute a database
    backup or update database configurations any longer.


    You can now back up and restore multiple database partitions at one by time using
    the new system view (SSV) backup. Refer to 6.1, "DB2 database backup and recovery"
    on page 228 for information about backups.


    To update the database configuration, just use the db2 update database command.
    This command updates all database partitions by default, except when you specify
    DBPARTITIONNUM to update only a certain database partition.


    # db2_ps


    You can use the db2_ps command to list all of the DB2 engine processes on logical
    partitions.


    # db2_call_stack


    The db2_call_stack command, on UNIX-based platforms, causes all of the processes
    that are running on all database partition servers to write call traces back to
    the syslog. In general, you do not need to run this command unless it is required
    by the DB2 support staff.'
