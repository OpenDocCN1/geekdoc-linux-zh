  md: 'The following list shows field descriptions for the output report that is generated
    by vmstat. To acquire more information regarding this command, refer to help pages
    for vmstat or other Linux documentation:


    +   Procs:

    - r: The number of processes waiting for run time

    - b: The number of processes in Uninterruptible sleep

    - w: The number of processes swapped out but otherwise waiting


    +   Memory:

    - swpd: The amount of virtual memory that is used (kB)

    - free: The amount of free memory (kB)

    - buff: The amount of memory that is used as buffers (kB)


    +   Swap:

    - si: Amount of memory that is swapped in disk (kB/s)

    - so: Amount of memory that is swapped to disk (kB/s)


    +   I/O:

    - bi: Blocks sent to a block device (blocks/s)

    - bo: Blocks received from a block device (blocks/s)


    +   System:

    - in: The number of interrupts per second, including the clock

    - cs: The number of context switches per second


    +   CPU:

    - us: User time

    - sy: System time

    - id: Idle time


    Example 2-29 shows a sample report that is generated by vmstat. The 10 command
    report virtual memory statistics 10 times, and the interval is 2 seconds.


