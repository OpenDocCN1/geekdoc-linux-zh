  md: '# 3.1 Control Center setup


    DB2 has a rich set of graphical tools that are used for database administrators
    to manage the database system and for application developers to develop stored
    procedures and user defined functions. The Control Center is one of the general
    administration tools that is used to help you explore and administer your databases.
    Other tools include the Command Center, which can be used to generate SQL queries,
    and the Configuration Assistant, which is an excellent tool for configuring your
    database environment.


    If you manage your database server with the Control Center, you must start the
    DB2 Administrator Server on each host of your database server environment. The
    DB2 Administrator service procedure is provided in Chapter 2, “Installation” on
    page 25. To start the DB2 Administrator Server, log on every host as DAS user
    and issue db2admin start.


    If you are logged in as the instance owner or a privileged DB2 user and have an
    X Window, you can use the db2cc & command to start the Control Center. If you
    started your X Window as the root user, you need to switch to the display before
    you start the DB2 instance owner ID. You have two ways to set up the environment
    for running Control Center.

    Example 3-1 shows the simpler way.


    +   Example 3-1 Start Control Center (method one)


    ```

    puget:\> # xhost +\npuget:\> # su - db2inst

    db2inst@puget:\> export DISPLAY=:0.0

    db2inst@puget:\> db2cc &\n[1] 6051

    db2inst@puget:\>

    ```


    The ampersand character (&) after the command returns the shell prompt, which
    allows you to use this shell for other commands. We do not suggest that you use
    method one for security critical production systems, because it allows everybody
    to access your X server. The more secure method is to use Authority as demonstrated
    in Example 3-2.


    +   Example 3-2 Start Control Center (method two)


    ```

    puget:\> # su - db2inst

    db2inst@puget:\> scp root@localhost:~.Xauthority /tmp/xauth.tmp

    Password:

    .Xauthority                               100% 161    0.2KB/s   00:00

    db2inst@puget:\> export DISPLAY=:0.0

    db2inst@puget:\> xauth merge /tmp/xauth.tmp

    ```


    Up and Running with DB2 on Linux'
  merge: -1
  pgno: 113
- img_proc: true
  md: '```

    db2inst1@puget:~$ db2cc&

    [1] 6052

    db2inst1@puget:~

    ```


    In method two, we copy the file .Xauthority from the server (root user) to the
    client (db2inst1 user) and merge it with the existing one. We chose the scp command
    for convenience. This command allows the user db2inst1 to access the root-owned
    X server. We also set the DISPLAY to the same host and use the ampersand character
    (&) to run the command in the background.


    By using method two, only the user who uses the .Xauthority file is allowed to
    access the X server.


    If you connect from a remote client, you can adjust the steps for method one or
    method two accordingly. However, in that case, it is easier to use the ssh command
    as demonstrated in Example 3-3.


    # Example 3-3 Use SSH for db2cc


    ```

    db2inst1@vms:~$ ssh -X db2inst1@puget

    Last login: Jan 31 16:55:09 2008 from 9.125.7.139

    db2inst1@puget:~$ db2cc&

    [1]

    28832

    db2inst1@puget:~

    ```


    The option -X instructs ssh to tunnel the X11 to the local system, set the DISPLAY
    correctly, and to perform the Xauthority authentication. If you have set the SSH
    authentication properly, you do not need to provide a password.


    If you come from a Windows system and use Exceed or Cygwin as a local X server,
    you can use putty. The putty program has an option which allows X11 forwarding.


    After you start the Control Center, you are asked first to specify the view options.
    See Figure 3-1 on page 94. Select Advanced. In this chapter, we provide our demonstrations
    in that view.'
