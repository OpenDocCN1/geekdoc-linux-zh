  md: '# 2.1.6 Kernel parameter values


    You might be required to update several of the default kernel parameter settings
    for DB2 to run successfully on Linux. The default values for particular kernel
    parameters on Linux are insufficient when running a DB2 database system.


    > Note: You must have root authority to modify kernel parameters.


    With Version 8 and later, DB2 checks values of the kernel.sem, kernel.shmgni,
    and kernel.shmmax parameters automatically at DB2 start time and changes for you
    if the current values are not optimal. The dbstart command:


    +   * Changes SEMMNI kernel parameter to 1024

    * Changes MSGNI kernel parameter to 1024

    * Changes SHMMAX kernel parameter to 268435456 (32-bit) or 1073741824 (64-bit)


    Manually updating the kernel.shmmax, kernel.shmgni, and kernel.sem parameters
    prior to root installations is no longer required. However, for non-root installations,
    you must check these kernel parameters before installation and update them if
    needed.


    # Manually updating kernel parameters


    If any of the default kernel parameter settings do not meet the requirements of
    your particular system, you can update them manually.


    To check your current shared memory segment, semaphore array, and message queue
    limits, use the ipcs -l command. Your output looks similar to this:


    ```

    --- Shared Memory Limits ---

    max number of segments = 4096              // SHMNI

    max size (kbytes) = 32768                   // SHMAX

    max total shared memory (kbytes) = 8388608      // SMALL

    min seg size (kbytes) = 1


    --- Semaphore Limits ---

    max number of arrays = 1024                // SEMMNI

    max semaphores per array = 250             // SEML

    max semaphores systems wide = 256000      // SEMNS

    max ops per semop call = 32                // SEMOP

    semaphore max value = 32767


    --- Messages: Limits ---

    max queues system wide = 1024               // MSGMNI

    ```


    For root installations, if kernel.shmmax is set to a low value, you might encounter
    the memory allocation error while starting the instance, and then you must update
    kernel.shmmax manually.'
