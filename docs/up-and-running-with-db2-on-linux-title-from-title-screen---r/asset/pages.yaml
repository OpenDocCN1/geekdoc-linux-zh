    Figure 7-28 Using Memory Visualizer to monitor DB2 memory usage


    Within this panel, you can:


    +   - View memory usage for a specific memory heap or buffer, or view memory usage
    at the overall level.


    +   - Specify which memory information to display and which information to hide
    for a DB2 instance and its databases in the Customize Columns panel, which can
    be displayed by choosing View → Customize Columns.


    +   - Update the configuration parameters for an individual memory component to
    prevent it from using too much memory or too little memory — what you need to
    do is select the value in the Parameter Value field and then enter a new value.


