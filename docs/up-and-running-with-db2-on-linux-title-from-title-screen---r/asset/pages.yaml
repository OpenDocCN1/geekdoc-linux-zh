    | 00070 | 96170.00 | 55000.00 | 700.00 | 700.00 | 2008-01-29-23.06.17.126586 |

    | 00070 | 55000.00 | 65000.00 | 700.00 | 700.00 | 2008-01-29-23.06.19.649943 |

    | 00110 | 66500.00 | 45000.00 | 900.00 | 900.00 | 2008-01-29-23.06.17.287657 |

    | 00170 | 44680.00 | 55000.00 | 500.00 | 500.00 | 2008-01-29-23.06.17.353814 |


    4 record(s) selected.


    # 8.2.2 User defined functions


    DB2 provides many functions built-in functions. There are two types of built-in
    functions: scalar functions, such as date, length, month, and substr; and column
    functions, such as count, sum, max, avg, and min.


    User defined functions (UDFs) can be added to the database. They can include scalar
    functions, row-function, column-function, or table functions. UDFs can be written
    in languages such as C, Java, or in pure DB2 SQL. This section discusses UDFs
    written in SQL. Developing a UDF using C and Java is provided in "UDF in C" on
    page 447 and "Stored procedures in Java" on page 453 separately.'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'UDFs are extremely useful if you want to share business logic among applications.
    The applications can run on different systems and on different architectures.


    Use the CREATE FUNCTION DDL statement to register a function in the database.


    > Note: The CREATE FUNCTION statement is explained in detail in the Information
    Center in Database fundamentals → SQL → Statements → CREATE FUNCTION and in SQL
    Reference, Volume 2, SC10-4250.


    Example 8-3 creates an SQL UDF called salary_diff, which receives an employee
    ID as input and calculates the difference between the old and new salary values
    from the EMPLOYEE_HIST, is populated through our trigger (see Example 8-1 on page
    428). To get the detailed information from the EMPLOYEE table with history data
    stored in EMPLOYEE_HIST, we can join EMPLOYEE and EMPLOYEE_HIST to calculate the
    column salary_diff, or we can use UDF to perform the function.


    Example 8-3 UDF to calculate a salary difference from the audit table CONNECT
    TO sample;


    ```

    CREATE FUNCTION salary_diff (emp CHAR(6))

    RETURNS DECIMAL (9,2)

    LANGUAGE SQL

    READS DATA

    NO EXTERNAL ACTION

    DETERMINISTIC

    RETURN

    SELECT (salary_new - salary_old) AS salary_diff

    FROM employee_hist h,

    employee o

    WHERE empno = emp

    h.empno = o.empno

    AND h.chg_date = (SELECT MAX(chg_date)

    FROM employee_hist

    WHERE empno = h.empno)

    ```


    > Note: The statement SELECT MAX(chg_date) is required, because for each empno,
    there can exist more than one row in EMPLOYEE_HIST table. However, a UDF can return
    only one row.


    In Example 8-4 on page 431, we can use the newly created function salary_diff
    in our query.'
  merge: -1
  pgno: 451
- img_proc: true
