- img_proc: true
  md: '# 4.1 Migration planning


    Prior to installing DB2 9.5, it is essential that you prepare your system and
    databases for the migration. Additional table space and log space are required
    for migration, as well as a recovery plan in case of failure. This section discusses
    migration requirements.


    Figure 4-1 illustrates the migration roadmap. You need to consider the entire
    DB2 environment to determine an optimal migration strategy.


    ![](img/f11f73c917561aadc89cbf81db6d9105_189_0.png)


    Figure 4-1 Migration roadmap'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 4.1.1 Migration requirements


    Make sure that your system satisfies the following software and space requirements
    prior to Version 9.5 migration:


    +   - Migration is supported from DB2 UDB Version 8 and DB2 9.1. If you have DB2
    UDB Version 7 or earlier, you need to migrate to DB2 UDB Version 8 before migrating
    to DB2 9.5.

    - If you are running DB2 UDB Version 8.1, we recommend that you upgrade to DB2
    UDB Version 8.2.

    - You can only migrate to a root installation of DB2 9.5.

    - DB2 9.5 Enterprise Server Edition is only supported on 64-bit architectures.

    - Check the recommended and validated environment for DB2 9.5 at the following
    site:

    http://www.ibm.com/software/data/db2/linux/validate/

    - Restoring full database online backups from DB2 U Version 8 or DB2 Version 9.1
    is supported. However, you cannot roll the logs from a previous level forward.

    - Perform hardware and operating system upgrades prior to DB2 database product
    management.

    - If you migrate DB2 server, you might also need to migrate your database applications
    and routines to support changes for 64-bit instances, SQL stored procedures, Java
    Virtual Machine (JVM™), and development software.

    - Migrate all of DB2 servers to Version 9.5 before you migrate any of your DB
    clients to Version 9.5. Certain problems can occur if you migrate your clients
    first.

    - If you have 32-bit instances and you migrate to DB2 9.5 on a 64-bit system,
    you need to manage the incompatibilities due to the shared library path specification
    and discontinued features in order to run your applications and routines successfully.

    - The files SQLPCS and SQLPCS contain table space information. During migration
    from DB2 UDB Version 8 to DB2 9.5, these files grow to times their previous size,
    but the total data size on disk does not exceed the new size of SQLPCS and SQLPCS.

    - Ensure that you have sufficient free space in the /tmp directory on the machine
    to which you will be migrating an instance. The instance migration trace file
    is written to /tmp. The minimum size required is 20 MB.

    - Ensure that you have sufficient space in the file system where the table spaces
    of the databases that you are migrating are located. Additional space is required
    for both old and new database catalogs during the migration.


    ```

    http://www.ibm.com/software/data/db2/linux/validate/

    ```'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'amount of required space depends on your system, but we provide several general
    recommendations in Table 4-1.


    Table 4-1 Space recommendations for migration


    | Table space | Space recommendation |

    | --- | --- |

    | System catalog space (SYCATSPACE) | - For SMS table spaces, allocate 2x the
    space currently occupied.<br>- For DMS table spaces, free pages must be equal
    to or greater than used pages. |

    | Temporary table space (TEMPSPACE1, by default) | - The pages for the system
    temporary table space must be twice the amount of total pages for the system catalog
    table space.<br>- If you are upgrading from Version 8, check the row size in your
    result sets. If it is close to the maximum row length limit for your existing
    system temporary table spaces, you might need to create a temporary table space
    with a larger size. This additional space is necessary, because DB2 Version 9.1
    and Version 9.5 use larger record identifiers (RID) to increase the row size in
    the result sets from queries or positioned updates. |


    To check the size of your DMS table spaces, use the following commands as the
    instance owner:


    ```

    db2 1 list database directory

    db2 connect to dbaname

    db2 list tablespaces shows detail

    ```


    To increase space in a DMS table space, you can add additional containers or increase
    the size of your existing containers.


    To increase space in an system managed storage (SMS) table space, you can free
    sufficient disk space on the corresponding file systems or increase the size of
    your file systems if you are using a volume manager.


    +   - Ensure that you have sufficient log file space before migration. We recommend
    that you significantly increase the values of LOGFILSIZ, LOGPRIMARY, and LOGSECOND
    to prevent log file from running out. The amount of required space depends on
    your system setup. Also, on partitioned database environments, you only need to
    increase the log space in the catalog database partition server.'
