    <password>.\n\nExample 8-9 CLI program: cli_test.c\n\n```\n#include <stdio.h>\n\
    #include <sqlclib.h>\n\nmain() {\n    SQLRETURN clirc = SQL_SUCCESS;\n    SQLHANDLE\
    \ henv, hdbc, hstmt;\n\n    /* Variable which return the row data */\n    struct\
    \ { SQLINTEGER ind; SQLCHAR val[7]; } empno;\n```"
