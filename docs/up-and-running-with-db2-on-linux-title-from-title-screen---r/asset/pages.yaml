    Figure-6-30 Using Export in the DB2 Control Center


    The export operation will fail if the data that you want to export exceeds the
    space available on the file system which the exported file will be created. To
    avoid this situation, you can limit the amount of data that is selected by specifying
    conditions on the WHERE clause and invoking the export utility multiple times
    to export all of the data.


    For information about using the ADMIN_CMD stored procedure or the IMPORT API and
    for more details regarding the IMPORT utility, refer to Data Movement Guide and
    Reference, CS23-5847.


    # 6.3.2 Import data from files into database tables or views


    The import utility inserts data from input file into a table or updateable view.
    The table or view already has data, you can replace the existing data or append
    to the existing data.


    You can also use import to create a new table, if the format of the input file
    is Integrated ExChange™ Format (IXF), by using the IMPORT command options REPLACE_CREATE.
    Not all of the properties of the table are


