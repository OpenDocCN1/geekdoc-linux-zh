  md: "Example 8-33 Retrieve the XML data as a table\n\n| ENTITYID | name | price\
    \ |\n|---|---|---|n| 3 Jean | 7.99 |\n| 4 Shirt | 3.99 |\n\ndb2inst1@puget:~>\
    \ db2 -tf select_table.sql\n\n2 record(s) selected.\n\nExample 8-34 shows an enhanced\
