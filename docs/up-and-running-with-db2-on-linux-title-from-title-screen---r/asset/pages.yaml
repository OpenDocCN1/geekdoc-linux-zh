  md: '# 3.4 Further configuration


    DB2 uses log files to record its transactions. To improve the performance and
    to ease the maintenance work, consider changing the location for online logs,
    archive logs, and db2diag.log.


    # 3.4.1 Change the online log path


    By default, the online log path is configured as: /database/db2inst1/NODE0000/SQL00001/SQLLOGDIR.


    To change the log path, use the Control Center or a command to update the database
    configuration parameter NEWLOGPATH to the new path. The new path becomes effective
    when the database is in a consistent state and all users are disconnected from
    the database. Note that it is not necessary to issue a db2stop and db2start. When
    the first user reconnects to the database, the log files are relocated.


    Follow this procedure to change the online log path by commands:


    +   1. Create the directories. For a single partitioned environment, enter:

    mkdir -p /db2log1/ITSODB

    mkdir -p /db2log2/ITSODB


    For the multiple partitioned environment, enter:

    dypeset -z4 DB2NODE; mkdir -p /db2log1/ITSODB

    dypeset -z4 DB2NODE; mkdir -p /db2log2/ITSODB


    +   2. Set the database configuration manager parameter NEWLOGPATH to the new
    path. Example 3-21 shows the command:


    > Example 3-21 Set the NEWLOGPATH

    db2inst@db2> db2 "UPDATE DB CONFIG for itsdb USING NEWLOGPATH

    /db2log1/ITSODB"

    DB20000I The UPDATE DATABASE CONFIGURATION command completed successfully.

    SQL316W One or more of the parameters submitted for immediate modification

    were not changed dynamically. For these configuration parameters, all applications
    must disconnect from this database before these become effective.


    For the partitioned database, use the following command to set the NEWLOGPATH
    parameter in all database nodes:

    db2_all ''connect to itsdb;db2 update db cfg for itsdb

    NEWLOGPATH /db2log1/itsdb''


    ![](img/f11f73c917561aadc89cbf81db6d9105_141_0.png)'
  merge: -1
  pgno: 141
- img_proc: true
