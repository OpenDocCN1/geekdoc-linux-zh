    Back successful. The timestamp for this backup image is : 20080201170437


    Now, the database is ready for log archiving. To verify that the database is ready
    for log archiving, use the following command:

    db2 archive log for itsdb


    The active logs will be archived from the log directory to the /db2archive directory.
    db2 uses the following subdirectory structure for the archived logs files:

    /<logpath>/instance/DBNAME/PARTITION#/CHAIN#


    In our case we see the archived log files for the partitioned database under:

    /db2archive/db2inst1/ITSODB/NODE00000/C000000...

