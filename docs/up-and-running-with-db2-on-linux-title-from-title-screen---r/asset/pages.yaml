  md: 'Figure 1-2 on page 13 shows an example architecture based on the workload type.
    The business transactions take place on the production systems OLTP. Here, you
    have many transactions that write to the database. The types of queries and transactions
    are well defined. The data model is usually highly normalized. These systems usually
    require a high availability.


    In 1-2 on page 13, there is a general purpose data warehouse that receives the
