  md: 'When the load command is issued and the load is running, we can access the
    same table with a read-only operation from another terminal session. Before the
    end of the load operation, the SELECT statement returns the answer set quickly.
    But, at the last stage of the load operation until the job is finished, the SELECT
    statement cannot succeed due to resource contention with the load operation. At
    this time, the load utility has to acquire an exclusive lock (Z-lock) on the table
    before the data is committed. After the load operation is finished, the newly
    loaded data is visible to other applications. Example 6-56 shows the SELECT is
    running and then the data is committed.


