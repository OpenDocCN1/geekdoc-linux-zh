- img_proc: true
  md: 'We have demonstrated using the LOAD command with default settings to load data
    into a partitioned database table. When loading data into a multi-partition database,
    you can also use one of the following modes:


    +   - PARTITION_AND_LOAD


    Data is distributed and loaded to all database partitions in parallel. This mode
    is the default for the LOAD command.


    +   - PARTITION_ONLY


    Data is distributed, and the output is written to files in a specified location
    on each loading database partition. These files can be loaded into the LOAD_ONLY
    mode.


    +   - LOAD_ONLY


    The distribution process is skipped, and the data is loaded simultaneously on
    the corresponding database partitions.


    +   - LOAD_ONLY_VERIFY_PART


    As with LOAD_ONLY, each row is checked to verify that it is on the correct database
    partition.


    +   - ANALYZE


    ANALYZE generates an optimal distribution map with even distribution across all
    database partitions.


    To use these, there are options that are specific for loading in a partitioned
    database environment, such as:


    +   - PART_FILE_LOCATION: The fully qualified location of the partitioned files


    +   - OUTPUT_DBBPARTITIONS: A list of partition numbers, which represents the
    database partitions on which the load operation is to be performed


    +   - PARTITIONING_DBBPARTITIONS: A list of partition numbers that will be used
    in the partitioning process


    +   - MODE: The mode in which the load operation will take place when loading
    a partitioned database, such as PARTITION_AND_LOAD, PARTITION_ONLY, LOAD_ONLY,
    and so on


    +   - PARTITIONED DB CONFIG: Allows you to specify partitioned database-specific
    configuration options in a LOAD command


    Example 6-54 on page 317 shows how to use the PARTITIONED DB CONFIG parameter
    to specify partitioned database-specific options for LOAD. With the PARTITION_ONLY
    option, the data is distributed to each database partition, but not loaded. The
    output is written to files in the specified location on'
