    # Import table data through the CLP


    Example 6-48 shows the IMPORT command issued through the CLP.


    Example 6-48 Using IMPORT through the DB2 CLP


    ```

    db2inst1@mens:db2backup/datame+= db2 ''create table itemimp like item''

    d200001 The SQL command completed successfully.

    d2inst1@mens:db2backup/datame+= db2 ''import from from ./item.ixf of xf

    commit 100000 messages itemimp insert into itemimp''

    ```


    +   - Number of rows = 300000

    - Number of rows skipped = 0

    - Number of rows inserted = 300000

    - Number of rows updated = 0

    - Number of rows rejected = 0

    - Number of rows committed = 300000


    Example 6-48, we use the COMMITCOUNT parameter, which means that DB2 will perform
    a COMMIT after every n records are imported. With the COMMITCOUNT option, if the
    import is interrupted for any reason, the committed rows will remain in the table
    despite the failure of the import procedure. You can continue the import with
    the option INSERT WITH the RESTARTCOUNT parameter to import the rest of the data.
    Another choice is to use REPLACE or REPLACE_CREATE option.


    The messages file is a convenient way of monitoring the progress of an import,
    because you can access it during the import. In the event of a failed import operation,
    you can use the messages files, which indicate the last row that was successfully
    imported, to determine a point at which to restart the operation. Example 6-49
    shows a part of the messages file during your import.


    Example 6-49 Monitor IMPORT progress with the messages file


    ```

    db2inst1@mens:db2backup/datame+= tail -I0 itemimp.msg

    SQL3222W ...COMMIT of any database changes was successful.


    SQL3222W ...Begin COMMIT WORK. Input Record Count = "2500000"

    SQL3222W ...COMMIT of any database changes was successful.

    ```'
