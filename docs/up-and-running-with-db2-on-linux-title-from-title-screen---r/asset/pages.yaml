  md: 'You can use the database manager parameter NOTIFYLEVEL to specify the type
    of administration notification messages that are written to the administration
    log. Valid values for this parameter are:


    +   0: No administration notification messages are captured. (We do not recommend
    this setting.)


    +   1: Fatal or unrecoverable errors. Only fatal and unrecoverable errors are
    logged.


    +   2: Immediate action required. Conditions that are logged require immediate
    attention from the system administrator or the database administrator. This level
    will capture Health Monitor alerts.


    +   3: Important information, no immediate action required. Conditions are logged
    that are non-threatening and do not require immediate action but indicate a non-optimal
    system. This level will capture Health Monitor alerts, Health Monitor warnings,
    and Health Monitor attentions.


    +   4: Informational messages.


    Messages, which are written to the notify log because you set a higher level,
    include the messages that are applicable to lower levels. For example, setting
    the notify level to 3 will cause the administration log to include messages applicable
    to 1 and 2.


    Example 7-14 is an excerpt of the messages from the notify log when lock escalation
    happens. The messages in the log tell you when the lock escalation occurs, in
    which instance, database, and partition it takes place, the process ID and thread
    ID associated with the lock escalation, and the application ID, component, and
    function of DB2 used when the problem happens. In addition, detailed information
    specific to this occurrence of lock escalation is also displayed.


