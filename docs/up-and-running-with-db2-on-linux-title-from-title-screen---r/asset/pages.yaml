    # The rah and db2_all command


    Before we start with the creation of the multi-partitioned database, we show you
    the **db2_all1** and the **rah** commands. Both commands are *useful* in order
    to execute commands on all partitions.


    The **db2_all** command can be used to execute commands on all database partitions.
    For instance, if you want to create a directory on all partitions, you can execute
    this command to create a *directory* on all nodes, as shown in Example 3-14.


    Example 3-14 Example of the typeset command


    ```

    db2inst@mensa> db2_all typeset -Z4 DB2NODE; mkdir -p

    /database/db2inst1/NODE$DB2NODE/ITSODB/SAMPLE_MPL/

    ```


    mensa.itsosj.sanjose.ibm.com: typeset -Z4 DB2NODE completed ok

    gemi.itsosj.sanjose.ibm.com: typeset -Z4 DB2NODE completed ok


    You can use the **rah** command to execute commands on all physical hosts. The
    difference between the **rah** command and the **db2_all** is that the specified
    commands in **rah** are executed only one time per host, which is important if
    you have several logical partitions on one physical system.


    > **Tip:** The command **typeset -Z4 DB2NODE** returns a four digit number for
    every partition defined in db2nodes.cfg, for example, 0 will be 0000, 1 will be
    0001.


