  md: "re-created when you use CREATE and REPLACE_CREATE. Note that these options\
    \ are deprecated, and they might be removed in a future release.\n\n> Note: Instead\
    \ of using the IMPORT options to create the table, use the db2look command to\
    \ capture the original table definitions and re-create the table. After the table\
    \ is created, issue the LOAD or IMPORT command to add the data to the table. The\
    \ db2look command preserves all of the properties of a table and is a superior\
    \ option for re-creation.\n\nThe authority and the privileges that are required\
    \ for running import with without creating a new table option are different. To\
    \ use the import utility to create a new table, you must have SYSADM authority,\
    \ DBADM authority, or CREATAB privilege for the database. To replace data in an\
    \ existing table or view, you must have SYSADM authority, DBADM authority, or\
    \ the CONTROL privilege for the table or view. To append data to an existing table\
    \ or view, you must SELECT and INSERT privileges for the table or view.\n\nThe\
    \ import utility performs the following steps to import the data:\n\n+   1. Locking\
    \ tables\n   Import acquires either an exclusive (X) lock or a non-exclusive (IX)\
    \ lock on the target tables, depending on whether you allow concurrent access\
    \ to the table.\n2. Locating and retrieving data\n   Import uses the FROM clause\
    \ to locate the input data.\n3. Inserting data\n   Import either replaces existing\
    \ data or adds new rows of data to the table.\n4. Checking constraints and firing\
    \ triggers\n   As the data is written, import ensures that each inserted row complies\
    \ with the constraints defined on the target table. Information about rejected\
    \ rows is written to the messages file. Import also fires existing triggers.\n\
    5. Committing the operation\n   Import saves the changes made and releases the\
    \ locks on the target table. You can also specify that commit takes place periodically\
    \ during the import.\n\nThe import can be invoked through the command line processor\
    \ (CLP), the Import notebook in the Control Center, by calling the ADMIN_CMD stored\
    \ procedure, or by calling the API db2Import. You can specify the MESSAGES parameter\
    \ for the IMPORT utility to record errors, warnings, and informational messages\
    \ that are associated with the IMPORT operation."
