  md: "You can obtain more details about the API in the Information Center by selecting\
    \ Database administration $\rightarrow$ Administrative interfaces $\rightarrow$\
    \ Administrative APIs and in Administrative API Reference, SC23-5842.\n\n# UDF\
    \ in C\n\nOne of the supported programming languages for user defined functions\
    \ (UDFs) is C. UDFs are a good choice if you want to access the same business\
    \ logic across multiple applications and if it is difficult to share a common\
    \ API. After the program code has been compiled, the command CREATE FUNCTION is\
    \ used to register a function into the database manager.\n\nExample 8-13 shows\
    \ a UDF written in C. It converts a string to lowercase.\n\nExample 8-13 UDF example\
    \ written in C: tolower.c\n\n```\n#include <stdio.h>\n#include <string.h>\n#include\
    \ <sqludf.h>\n\nvoid SQL_API_FN\nto_lower(SQLUDDF_VARCHAR *value,\nSQLUDDF_VARCHAR\
    \ *result,\nSQLUDDF_NULLIND *value_ind,\nSQLUDDF_NULLIND *result_ind,\nSQLUDDF_TRAIL_ARGS)\n\
    {\nint i, len;\n\nif(*value_ind == -1) {\n*result_ind = -1;\nreturn;\n}\n\nlen\
    \ = strlen(value);\n\nfor(i = 0; i < len; i++) {\nresult[i] = tolower(value[i]);\n\
    }\n\nresult[i] = '\\0';\n}\n```\n\nIn Example 8-14 on page 448, we compile this\
    \ UDF. The first cc step compiles the program, and the second cc step creates\
    \ a dynamic object. On 64-bit machines, use the options -m64 and lib64 instead."
