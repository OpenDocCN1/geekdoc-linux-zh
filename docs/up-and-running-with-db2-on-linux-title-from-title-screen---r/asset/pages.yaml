    # 3.3.2 Creating a multi-partitioned database


    You can use the Create Database Wizard to create a multi-partitioned database.
    However, for a multi-partitioned environment, we recommend that you use the DB2
    command line, instead of the Create Database Wizard. In this section, we provide
    an example of setting up a partitioned database over two physical hosts with one
    logical partition on each host.


    Before you create a multi-partitioned database, consider which partition will
    be the catalog partition. In a partitioned database environment, the create command
    affects all database partitions that are listed in the db2nodes.cfg file. The
    database partition from which this command issued becomes the catalog partition
    for the new database.'
