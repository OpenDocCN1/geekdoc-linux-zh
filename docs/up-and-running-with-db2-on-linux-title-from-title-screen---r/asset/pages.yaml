    # Import table data using the Control Center


    Similar to EXPORT, you can also use the DB2 Control Center to invoke the import
    utility.


    Use these steps to perform the import from the Control Center:


    +   1. From the Control Center, expand the object tree until you find the Tables
    folder.


    +   2. Click Tables. Any existing tables are displayed in the pane on the right
    side of the panel (the contents pane).


    +   3. Right-click the table that you want in the contents pane, and select Import
    from the pop-up menu. The Import notebook opens.


    Refer to Figure 6-31, which is a sample for using IMPORT from the Control Center.


