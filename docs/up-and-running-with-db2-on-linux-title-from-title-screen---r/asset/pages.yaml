    STMM can run in two modes:


    +   - You can limit the available size for memory tuning than this value. If one
    area needs

    the parameter DATABASE_MEMORY. Then, STMM will not increase the

    memory used by the database higher than this value. If area needs to be

    increased because it has more demand, another area with less memory

    demand will be decreased accordingly.

    - You can leave the available memory size for tuning unlimiting by setting the

    DATABASE_MEMORY parameter to AUTOMATIC. In this case, the available

    memory in the operating system limits the available memory for tuning.

    STMM leaves a buffer for the operating system processes so that no paging

    occurs.

    - You can also limit the memory used by the instance by setting the value of the

    dat manager configuration parameter INSTANCE_MEMORY to a

    value. If you do not want to limit it, you can leave the value at

    AUTOMATIC.


    > Note: Certain Linux kernels do not allow you to set the value of the

    DATABASE_MEMORY database parameter to AUTOMATIC. The

    AUTOMATIC value is supported on RHEL5 and on SUSE 10 SP1 and.

    All validated Linux distributions will return to COMPUTED if the kernel

    does not support this feature.'
