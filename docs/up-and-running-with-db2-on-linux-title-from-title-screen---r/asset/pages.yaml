  md: "In Example 8-36 retrieve relational data into an XML structure.\n\nExample\
    \ 8-36 Extract XML structure from a table: extract_xml.sql\n\n```\nSELECT\n  MLELEMENT(NAME\
    \ \"employee\",\n    MLELEMENT(NAME \"empo\",empno\")\n    MLELEMENT(NAME \"lastname\"\
    ,lastname),\n    MLELEMENT(NAME \"firstname\",firstname),\n    MLELEMENT(NAME\
    \ \"salary\",salary)\n  )\nFROM\n  employee\nWHERE\n  salary = 37000;\n```\n\n\
    The function MLELEMENT is used to construct the XML data structure. You can see\
