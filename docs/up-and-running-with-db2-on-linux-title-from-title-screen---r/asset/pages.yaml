  md: '# # Up and Running with DB2 on Linux


    Experience the power of the integration of DB2 9.5 and Linux


    Linux is one of the fastest growing server operating platforms within the past
    few years. DB2 has long been known for its technology leadership. This IBM Redbooks
    publication is an informative guide that describes how to effectively integrate
    DB2 for Linux, UNIX, and Windows (SUSE and Red Hat Linux operating systems). This
    book provides introductory and detailed information about installing, configuring,
    managing, and monitoring DB2 in a Linux environment.


    Make it easier to get DB2 for LUW up and running on


    Leverage DB2 powerful autonomic technology


    We describe the DB2 product family and features for Linux and provide step-by-step
    instructions for a single as well as multiple partition DB2 system installation
    and configuration. We describe how to migrate single and discuss, multiple partition
    DB2 to DB2 Version 9.5 and instance, detail DB2 database administration in a Linux
    environment, procedures and tools for database backup and recovery, online maintenance,
    and system monitoring. We describe DB2 integrated tools and their features and
    use.


    We discuss aspects of DB2 application development in the Linux environment and
    provide general tips about building and running DB2 applications on Linux and
    the use of DB2 application development tools.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM Technical Support Organization. Experts
    from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios and recommendations are provided to help
    you implement IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks'
