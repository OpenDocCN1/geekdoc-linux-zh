    During a table rollforward, each log file needs to be read, even if the log file
    does not contain log records that affect that table space. This phase can be time-consuming.
    To skip those log files that are known not to contain any log records that affect
    the specific table space, set the DB2_COLLECT_TS_REC_INFO variable to ON (the
    default value). The table space change history file (db2tsch.his) keeps track
    of which logs need to be processed for each table space.


    > Note: DB2 supports the recovery of a dropped table by using table restore, if
    the table space where the table resides is enabled for dropped recovery. This
    dropped table recovery can be done during table space creation or altering an
    existing table using the DROPPED TABLE RECOVERY ON option. We show an example
    in 6.1.7, "Recovering a dropped table sample scenario" on page 269.


