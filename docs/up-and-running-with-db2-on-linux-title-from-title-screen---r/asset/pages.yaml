    # # 6.4 Task Center, Scheduler, and DB2 Tools Catalog


    In this section, we discuss how to use the DB2 Task Center to create and schedule
    a task to run on Linux. The DB2 Administration Server and Tools Catalog database
    are the prerequisites for using the Task Center and most GUI tools. We discuss
    the DB2 Administration Server and Tools Catalog database first in preparation
    for enabling the Task Center and Scheduler.


    # ## 6.4.1 DB2 Administration Server and Tools Catalog Database


    The DB2 Administration Server (DAS) is a control point that is only used to assist
    with tasks on DB2 servers. You must have a running DAS if you want to use available
    tools, such as the Task Center, the Control Center, or the Configuration Assistant.
    The DAS supports the Control Center and the Configuration Assistant when working
    on the following administrative tasks:


    +   - Enabling remote administration of DB2 servers

    - Providing the facility for job management, including the ability to schedule
    both DB2 and operating system command scripts

    - Providing the scheduling of jobs, viewing the results of completed jobs, and
    performing other administrative tasks against jobs located remotely or locally
    to the DAS using the Task Center


    +   - Providing a means for discovering information about the configuration of
    DB2 instances, databases, and other DB2 administration servers in conjunction
    with the DB2 Discovery utility


    The DAS on Linux (plus UNIX and Windows) includes a scheduler to run tasks (such
    as DB2 and operating system command scripts) that are defined using the Task Center.
    Task information includes commands to be run, schedules, notifications, and completion
    actions that are associated with the task. The results are stored in a DB2 database
    called the Tools Catalog database. The Tools Catalog database is created as part
    of the general setup. If you did not create the Tools Catalog database when installing
    DB2, you can create and activate it through the Control Center or through the
    CLP using the CREATE TOOLS CATALOG command. For information regarding how to create
    the Tools'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'Catalog in the DB2 Control Center or by using DB2 CLP commands, refer to Appendix
    B, "DB2 Tools Catalog creation" on page 499.


    The Tools Catalog database contains task information that is created by the Task
    Center and Control Center. These tasks are run by the Scheduler on the DB2 Administration
    Server. Figure 6-45 shows the relationships among other DB2 Tools, DB2 instances,
    DAS, the Scheduler, and the Tools Catalog database.


