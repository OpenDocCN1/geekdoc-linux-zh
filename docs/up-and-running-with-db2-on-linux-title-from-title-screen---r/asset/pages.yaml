- img_proc: true
  md: '# 6.1 DB2 database backup and recovery


    A database can become unusable or corrupted in certain situations, such as hardware
    failure, power interruption, or application mistakes. To protect your database
    from losing any of your data, it is important to have a good recovery strategy.
    A good recovery strategy includes a regular schedule for backing up the entire
    database, as well as saving the recovery log files. Your overall strategy also
    needs to include procedures for recovering command scripts, applications, user
    defined functions (UDFs), stored procedure code in operating system libraries,
    and load copies.


    DB2 distinguishes between two types of databases, non-recoverable and recoverable.
    Non-recoverable means that DB2 can only restore the entire database to the point
    in time when the backup was taken. This is also called version recovery. Data
    that is easily recreated can be stored in a non-recoverable database. Data that
    cannot be easily recreated needs to be stored in a recoverable database. For a
    recoverable database, DB2 can restore the entire database or a part of the database
    to the point in time where the interrupt occurred (to the end of the log) or to
    a specific point in time. We call this process forward recovery.


    # Database logging


    A key element of any high availability strategy is database logging. DB2 is logging
    every transaction, unless told not to, or in the case of using the Load utility.
    The database log files are important if they are needed to recover the database.
    Recovery log files and the recovery history file are created automatically when
    a database is created. DB2 has two types of logging mechanisms:


    +   - Circular logging is the default method for a newly created database. If
    both the LOGARCHMETHOD1 and LOGARCHMETH2 database configuration parameters are
    set to OFF, the database is non-recoverable and circular logging is used. A set
    of log files is used in round-robin fashion. These logs are used by crash recovery
    if needed. Crash recovery is the process where all uncommitted changes are rolled
    back to a consistent state of the data.


    +   - Archive logging By using archive logging, the database is considered a recoverable
    database. To enable archive logging, set the LOGARCHMETHOD1 or LOGARCHMETH2 database
    configuration parameters to a value other than OFF. Active logs are still available
    for crash recovery, but you also have the archived logs with committed transaction
    data. After a successful restore, you can roll the database forward (that is,
    past the time when the backup image was'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'taken) by using the active and archived logs to either a specific point in
    time, or to the end of the active logs.


    DB2 provides multiple backup mechanisms. You need to decide between the following
    backup mechanisms.


    # # Offline or online backup


    During an offline backup, applications cannot connect to the database. This is
    the default backup method when you do not specify any parameter in the BACKUP
    command. After an offline backup, you have a consistent image copy of the entire
    database. Recoverable database backup operations can also be performed. Online
    mean that other applications can connect to the database during the backup operation.
    During rollforward recovery ensures that all table changes are captured and replayed
    if that backup is restored. If you have a recoverable database, you can back up,
    restore, and roll individual table spaces forward, rather than the entire database.
    When you back up a table space, it is still available for use, and simultaneous
    updates are recorded in the logs. When you perform an online restore or a roll
    forward operation on a table space, the table space itself is not available for
    use until the operation completes, but users are not prevented from accessing
    tables in other table spaces.


    # # Full or Incremental backup


    A full backup is a image copy of the entire database (Figure 6-1). In a partitioned
    environment, each database partition backup is written in a separate output file.


    | Sunday | Mon | Tue | Wed | Thu | Fri | Sat | Sunday |

    |---|---|---|---|---|---|---|---||

    | | | | | | | | |


    Figure 6-1 Full backup


    An incremental backup takes an image copy of changed data since the most recent
    successful full backup. This is a cumulative backup as shown in Figure 6-2 on
    page 230. The TRACKMOD parameter (Track modified pages) in the database configuration
    must be set to ON.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_251_0.png)


    Figure 6-2 Incremental backup


    A delta backup is fundamentally an incremental creates copy of all data pages
    that have changed since the last successful backup of any type. The delta backup
    is also known as a non-cumulative backup (Figure 6-3).


    ![](img/f11f73c917561aadc89cbf81db6d9105_251_1.png)


    Figure 6-3 Incremental delta backup


    The backup strategy depends on your environment. The database workload, availability,
    and recovery level are all decision factors. A good backup strategy might be a
    daily offline backup if the database does not have a 24x7 availability requirement.
    Another strategy can be to perform an offline backup over weekend and an incremental
    backup during the week.


    # ### 6.1.1 Enable rollforward recovery and log archiving


    To use all of the functionality available in DB2 to prevent data loss, we enable
    both rollforward recovery and log archiving. This combination allows us to recover
    the database to the point in time of failure. The following example steps you
    through this task in both single and multi-partitioned database environments.


    # ### Set up log file management


    Starting with DB2 Version 8.2, a new log file manager, which is fully integrated
    in the DB2 engine, is provided. The configuration is performed using the database
    configuration parameters called LOGARCHM1 and LOGARCHMETH2.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'Note: The user exit application db2uext2 is no longer needed. The database
    configuration parameters LOGRETAIN and USEREXIT are deprecated in DB2 9.5, but
    they are still being used by the data servers and clients with prior versions.
    Any value that is specified for these configuration parameters will be ignored
    by the DB2 9.5 database manager.


    In our example, we show you how to archive DB2 logs to disk and Tivoli Storage
    Manager storage. Our first task is to create the file system and directory that
    will have the archived log files:


    +   1. Use fdisk or any preferred database to create the file system /db2archive
    and mount it on each host of the database-partitioned environment.


    +   2. Create /db2archive/db2inst1 and set read/write permissions for the instance
    owner user ID, so that DB2 can access the directory:


    ```

    mkdir /db2archive/db2inst1

    chown db2inst:db2adm /db2archive/db2inst1

    ```


    +   3. Turn on log archiving by updating the database configuration:

    db2 update db cfg for itsodb using logarchmeth1:disk:/db2archive


    > Note: The command applies to both a single and a multi-partitioned environment.
    DB2 9.5 provides a single view of all database configuration elements across multiple
    partitions. You can update the database configuration across all database partitions
    by invoking the UPDATE DATABASE CONFIG command against one database partition.
    You no longer need to use the db2_a11 command.


    4. To verify, use the following command:


    ```

    db2_all get db cfg for itsodb | grep LOGARCHMETH1

    ```


    You can also perform these steps through the DB2 Control Center:


    +   1. Right-clicking the database name shows you the context menu (Figure 6-4
    on page 232).'
  merge: -1
  pgno: 252
