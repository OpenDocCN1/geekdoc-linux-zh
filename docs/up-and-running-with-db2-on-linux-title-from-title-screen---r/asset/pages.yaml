    # 3.6.3 Database configuration


    For allocation and control of system resources, DB2 uses a separate configuration
    file for every database in a DB2 instance. This file is named SQLDBON/database_path/$DB2INSTANCE/NODE0000/SQL00001.


    In a partitioned environment, the SQLDBCON exists in every database partition.
    Therefore, it is possible to have different settings for each partition. To modify
    this database configuration (DB cfg) use the Control Center or use the DB2 command
    line:


    ```

    db2 update db cfg for <database> using <parameter>

    ```


    In a partitioned environment, you must issue this on each partition. The UPDATE
    DBM CONFIG command applies to all partitions. If you want to use it on a particular
    partition, use the parameter DBPARTITIONNUM <number>.'
