  md: '# 3.3 Creating a database


    Now, we show the creation of a database. We are going to demonstrate two cases:


    +   - A single partitioned database: We guide you through the steps to create
    a simple database by using the Create Database Wizard. We also provide you with
    the scripts to create a database from the command line.


    +   - A multiple partitioned database: We provide you with the scripts and commands
    to set up a partitioned database with two physical partitions.


    # 3.3.1 Creating a single partitioned database


    When you create a database, the tasks are done for you:


    +   - Setting up all of the system catalog tables that are required by the database


    During the creation of a new database, DB2 allocates three table spaces: SYSCAT,
    USSPACE1, and TEMP1. The table space SYSCAT holds all system catalog tables. These
    catalog tables are actually repositories that keep information and statistics
    about all objects within this database. USSPACE1 contains the user-created tables,
    their indexes, and their long data. A system temporary table space (TEMP1) is
    required by DB2 to support activities, such as sorting joining tables, and creating
    indexes. If you do not specify them by CREATE DATABASE command, DB2 will choose
    defaults for them.


    +   - Allocating the database recovery log


    The DB2 recovery log tracks all of the changes made against your database. It
    is also called the transaction log. It is used with the recovery history file
    to recover data in case of a failure.


    +   - Creating the database configuration file and setting the default values


    The database configuration file is used to provide DB2 information, such as how
    much memory it can use, where the log has to be stored, and DB2 optimizer relevant
    information.


    +   - Binding the database utilities to the database


    Programs, which contain SQL statements, have to be bound against the database.
    This binding process is used for DB2 utilities, as import and load. "Embedded
    SQL" on page 444 provides background information about the bind process.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'There are two methods to create databases in a existing instance:


    +   - DB2 Create Database Wizard, which is a Java-based graphical tool

    - The **create database** command used from a command line processor window


    You must have sysadm or systri authorization to create a new database. Before
    creating a database, set the right permissions on all file systems or directories
    where you want to store the database files. By default, the database will be created
    and cataloged in the path that is determined by the database manager configuration
    (DBM cfg) parameter `DFDTBPATH`. You can change this path to your desired default
    path by entering following command:


