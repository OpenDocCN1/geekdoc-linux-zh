    # 4.4 32-bit to 64-bit conversion


    If you are running DB2 Version 8 or Version 9 Enterprise edition under 32-bit
    Linux, be aware that Version 9.5 is only supported on 64-bit architecture. DB2
    Workgroup Edition provides both 32-bit and 64-bit support.


    For more details about recommended and validated environments for DB2 Version
    9.5 on Linux, refer to the Web site:

    http://www.ibm.com/software/data/db2/linux/validate/


    Even though you are running with a validated environment and a version of 32-bit
    DB2 9.5, such as the Workgroup edition, consider migrating to DB2 9.5 64-bit install
    to avoid any 32-kernel limitations.


    There are two considerations regarding 32-bit virtual memory address limits and
    the new multi-threaded architecture:


    +   - Agent private memory for all agent threads is now allocated within a single
    process. The process memory space might not be large enough to allocate'
