  md: '# Installing DB2 Information Center using the doce_install command


    To install the DB2 Information Center manually, use the doce_install command:


    +   1. Log as root.


    +   2. Decide where you want to install the documentation. In our environment,
    we created a directory called /documentation, which is located in the /db2home
    directory (for example, /db2home/documentation).


    +   3. Insert and mount the DB2 Information Center DVD.


    +   4. Use the doce_install command to install DB2 Information Center. The syntax
    of the doce_install command is:


    ```

    doce_install -b install_path -p doce -n -L language

    -b install-path

    ```


    Specifies the path where the DB2 Information Center is to be installed. The default
    installation path is /opt/ibm/db2ic/v9.5. This parameter is mandatory when the
    -n-interactive mode is not used.


    -n

    Specifies non-interactive mode.


    -L language

    Specifies national language support. The default is English. To install multiple
    languages this parameter can be specified multiple times. For example, to install
    both English and Simplified Chinese, specify -L EN -L CN.


    For example, enter the doce_install command using the following:

    ./doce_install -b /db2home/documentation -p doce -n -L EN -L CN


