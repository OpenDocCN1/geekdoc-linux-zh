- img_proc: true
  md: '# View logs for a specific database


    If you have several databases in your DB2 instance, and you want to see the db2diag.log
    entries only for one database, use:


    ```

    db2diag -g db1TS008

    The -g option is a grep-like filtering capability for a comma-separated list of
    field-pattern pairs. Another example is:

    db2diag -db1SAMPLE,level=Event,pid=5971

    ```


    This command shows all events for process ID 5971 that are unrelated to the SAMPLE
    database.

    The field names are case-insensitive while search patterns (input fields) are
    case-sensitive. To get a list of all of the available field names, use the db2diag
    -h command


    # Partitioned database


    In a partitioned database environment, the db2diag.log file contain the entries
    for all of the database partitions. Every database partition writes their messages
    into the same file. You can filter the output:


    +   - To display only logged records for database partition 2:

    db2diag -n 002

    - To display all of the logged records that contain only errors for database partitions
    0 and 2:

    db2diag -node "0, 2" -1 "Error, warning"


    # Archive the db2diag.log file


    If you want to archive the current db2diag.log file and start a new log file,
    enter:

    db2inst1mens:/dbhome/db2inst1> db2diag -A

    db2diag: Moving "/dbhome/db2inst1/sqllib/db2dump/db2diag.log"

    to "/dbhome/db2inst1/sqllib/db2dump/db2diag.log_2008-02-14-16.36.67"


    # Format the db2diag output


    The following command formats the output of db2diag to only show the timestamp,
    database partition number, the message level, and the text:

    db2diag -fmt "Time: %{ts} Partition: %node Message Level: %{level} \nMessage:
    @{msg}\n"

    Internal error return codes


    # DB2 internal error codes


    To get the description of a DB2 internal error code 0x860F000A:

    dbdiag -rc 0x860F000'
