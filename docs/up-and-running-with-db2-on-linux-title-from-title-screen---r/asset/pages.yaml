    # 6.1.5 DB2 database recovery


    Database recovery means rebuilding a database or table space after a problem,
    such as media or storage failure, or to rebuild the database on another system.


    There are three types of recovery:


    +   - Crash recovery protects a database from being left in an inconsistent, or
    unusable, state when transactions (also called units of work) are interrupted
    unexpectedly.

    - Version recovery is the restoration of a previous version of the database, using
    an image that was created during a backup operation.

    - Rollforward recovery can be used to replay changes that were made transactions
    committed after a backup was made.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Crash recovery


    A crash recovery might be needed after severe error or condition that causes the
    database or the database manager to end abnormally. Units of work (UOW) that have
    not been flushed to disk at the time of failure leave the database in inconsistent
    state. The database needs to be recovered.


    By default, DB2 starts crash recovery automatically to attempt to recover the
    database. If you do not want the automatic restart behavior, set the AUTOSTART
    database configuration parameter to OFF. You will need to issue the db2 restart
    database command manually when a database failure occurs. The administration notification
    log records information about crash recovery.


    # Version recovery


    Version recovery means to restore the database to the point in time when the database
    was taken up. The database image file was created during a backup operation. Every
    unit of work after the time of the backup is lost. Version recovery can be used
    with non-recoverable databases (databases without archived logs). It can also
    be used with recoverable databases by using the WITHOUT ROLLING FORWARD option
    on the RESTORE DATABASE command.


    # Full database restore from an offline backup


    A full database restore example from an offline backup is:


    ```

    db2 restore db itsdb from /db2backup taken at 20080204084123

    ```


    If the online database was taken from a recoverable database, you have to use
    the WITHOUT ROLLING FORWARD clause within the restore command to do the version
    recovery.


    > Note: in a partitioned database environment, you must restore all database partitions,
    and the backup images that you use for the restore database operation must all
    have been taken at the same time:

    db2_all "db2 restore db itsdb from /db2backup taken at 200802011706437"


    # Full database restore from an online backup


    Version recovery of a database using a backup that was taken online means that
    you restore the database to the point in time when the online backup was finished.
    During the online backup, transactions were still running against the database.
    Therefore, the log files that were written during the backup time need'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'to be applied. After restore command is run successfully, you have to roll
    forward to the end-of-backup point in time. You can use the following V9.5

    command to roll forward:


    ```

    db2 rollforward db itsdb to end of backup and stop

    ```


    If you use the backup command with the INCLUDE LOGS clause, you can

    s the LOGTARGET option within the restore command. Example 6-21

    how this works for a single partition database.


    # Example 6-21 Version recovery with online backup and included logs


    ```

