    # 2.2.1 Considerations


    DB2 9.5 now supports multiple DB2 copies on a single machine, as well as non-root
    installations. There are also changes in 32-bit and 64-bit server support. You
    need to understand these changes and take them into account before installing
    DB2 9.5.


    # Multiple Db2 copies


    Beginning with DB2 Version 9, DB2 products can be installed in multiple locations
    (as different DB2 copies) on a single machine. A DB2 copy refers to one or more
    installations of DB2 database products in a particular location on the machine.
    Each DB2 Version 9 copy can be the same or at different code levels.


    Only one DB2 administration server (DAS) can be created on a machine, regardless
    of the number of DB2 copies that are installed on the machine. We recommend that
    you migrate your existing DAS to Version 9.5 or create a new DAS in DB2 Version
    9.5.


    This multiple DB2 copies feature is supported by most DB2 products, except DB2
    Information Center.


    # Non-root installation


    Prior to Version 9.5, you were able to install products, apply and roll back fix
    packs, configure instances, add features, or uninstall products only if you had
    root authority. Now, you can install and service a non-root DB2 on Linux platforms.


    The DB2 installer automatically creates and configures a non-root instance during
    a non-root installation. As a non-root user, you can customize the configuration
    of the non-root instance during the installation. You can also use and maintain
    the installed DB2 product without root authority. Although without root'
  merge: -1
