    # 2.3.3 Installing a partitioned database environment


    There are several ways in which you can install DB2 on a multi-partition environment:


    +   Use the DB2 Setup wizard to install DB2 and create a new instance on the primary
    machine, and then use a response file to install DB2 on the remaining machines
    participating in the partitioned database.


    +   Edit a sample response file and use this file to install DB2 on each machine
    in the cluster.


    +   Use db2_install or a combination of DB2 Setup wizard and db2_install to set
    up your environment.


    The easiest method is to use the DB2 Setup wizard on the primary machine and then
    a response file on the remaining machines participating in the partitioned database
    system. We discuss this method in book.


    # Preparing the environment


    The first step of installing a partitioned database environment is preparing the
    environment, including setting up NFS, creating users and groups, and enabling
    ssh. Refer to 2.2, “Installation considerations and planning” on page 35.'
