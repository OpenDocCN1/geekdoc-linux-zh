    # Temp space


    DB2 uses system temporary table spaces for many SQL operations, such as JOIN and
    SORT. The DB2 temporary table space, TEMPSPACE1, is one of the default table spaces
    (SYSCATSPACE, TEMPSPACE1, and USERSPACE1) that are created during database creation.
    By default, TEMPSPACE1 is placed in the database path. We recommend that your
    temporary table spaces are located on a separate file system and disk. For example,
    in our system, we created the file system with mount point /db2temp to store our
    temporary table spaces.


    In a partitioned database environment, the catalog nodes need to contain all three
    table spaces, and the other partitions each need to contain only TEMPSPACE1 and
    USERSPACE1.


    Example 2-4 shows how to create a temporary table space on nodes in the /db2temp
    file system.


    Example 2-4 Create temp table space in a different file system


    ```

    CREATE TABLESPACE tempspace2 in ibmgroup

    MANAGED BY SYSTEM

    USING (''/db2dbinst1/NODE0000/ITSODB/TEMPSPACE2'') ON DBPARTITIONNUM (0)

    USING (''/db2dbinst1/NODE0001/ITSODB/TEMPSPACE2'') ON DBPARTITIONNUM (1)

    EXTSIZE 8

    PREFETCHSIZE 32

    BUFFERPOOL ibmdefaultbtp;

    DROP TABLESPACE tempspace;

    ```'
