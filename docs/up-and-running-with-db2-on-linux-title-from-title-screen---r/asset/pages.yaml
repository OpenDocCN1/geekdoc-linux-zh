  md: '# 6.1.4 Backup utility


    We have completed all of the steps, as described in 6.1.1, "Enableforward recovery
    and log archiving" on page 230. Now, we describe several ways to back up databases.


    # Backing up databases


    DB2 provides several database backup options:


    +   Full offline: A offline database backup allows you to restore the database
    image without applying any log records. Example 6-8 shows the offline backup command.


    Example 6-8 Full offline backup to disk


    ```

    db2inst1@mens:> db2 backup db itsdb to /db2backup

    ```


    Backup successful. The timestamp for this backup image is : 20082040481423


    +   Full online: During online backup, the database is still accessible for applications.
    Rolforward recovery has to be enabled. To be able to recover the database from
    an online backup, you need at least the range of active log files from the online
    backup time. Make sure that these log files are available, you can use the INCLUDE
    LOGS clause within the backup (the default behavior in V9.5). This function includes
    the required log files for recovery with the backup image. If you need to ship
    the backup images to a disaster site, you do not have to send the log files separately
    or package them together database backup copy manually. Furthermore, you do not
    have to decide which log files are required to guarantee the consistency of an
    online backup. Example 6-11 on page 241 provides a sample of a full online backup.


    Example 6-9 Full online backup to disk with included logs


    ```

    db2inst1@mens:> db2 backup db itsdb online to /db2backup include logs

    ```


    Backup successful. The timestamp for this backup image is : 20082040090001


    +   Table space: A table space backup allows you to back up only the specified
    table spaces. In Example 6-10, we back up only table space TBSPDMS_0.


    Example 6-10 Table space backup online


    ```

    TBSPDMS_0

    db2inst1@mens:> db2 "backup" db itsdb tablespace(TBSPDMS_0) online to

    /db2backup

    ```


    Backup successful. The timestamp for this backup image is : 20082040900637'
  merge: -1
  pgno: 261
- img_proc: true
  md: '+   Full incremental: An incremental backup saves backup time and resources.

    Example 6-11 provides an incremental backup example.


    Example 6-11 Incremental backup to disk

    db2inst@mens:> db2 backup db itsdb online incremental to /db2backup


    Backup successful. The timestamp for this backup image is : 2008204091101


    +   Delta backup: Example 6-12 shows the delta backup after taking a full database
    backup.


    Example 6-12 Delta backup to Tivoli Storage Manager

    db2inst@mens:> db2 backup db itsdb online delta use tsm


    Backup successful. The timestamp for this backup image is : 2008204091912


    > Note: To enable incremental or delta backup, you need to set the TRACKMOD database
    configuration parameter to ON:

    db2 update cfg for itsdb using TRACKMOD ON


    When the TRACKMOD database configuration parameter is set to ON, you need to do
    a full backup one time before starting an incremental or delta backup.


    # Back up partitioned databases


    In a partitioned database environment, there are three possible ways to back up
    the database:


    +   Back up each database partition one at a time.


    +   Use the db2_al11 command with the BACKUP DATABASE command to back up all the
    database partitions you specify.


    +   Run a single system view (SSV) backup to back up some or all of the database
    partitions simultaneously.


    Back up each database partition one at time is time-consuming and error prone.
    Using the db2_al11 command to use the backup database command on all of the database
    partitions simplifies the process and saves time. However, because the database
    partition containing the catalog cannot be backed up simultaneously with the non-catalog
    database partitions, you still have to back up the catalog database partition
    first and then back up the rest of the database partitions.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Assuming that database partition 0 is the catalog partition, the commands are:


    db2_all <<+0 db2 backup db itsodb to /db2backup

    db2_all <<-0 db2 backup db itsodb to /db2backup


    Whether you back up database partitions one at a time or by using db2_a11, managing
    backup images can be difficult due to the timestamp difference in each database
    partition backup image. The log files cannot be included in the backup image.


    In Version 9.5, when you perform a backup operation from the catalog node of a
    partitioned database, you can specify which database partitions to include in
    the backup, or you can specify that all of the database partitions need to be
    included. The specified database partitions will be backed up simultaneously,
    and the database timestamp associated with all specified database partitions will
    be the same. Also, you can include database logs with an SSV backup; including
    logs in backup images is the default behavior for SSV backup (that is, if you
    specify the ONDBPARTITIONNUM parameter). Finally, when you restore from an SSV
    backup image, you can roll forward to the end of the logs, which is the minimum
    recovery time calculated by the database manager.


    Example 6-13 shows how to back up all database partitions. The DBDPARTITIONNUMS
    option specifies the database partition to be backed up. If you want to exclude
    the log files from the backup image, use the EXCLUDE LOGS command parameter.


    Example 6-13 SSV backup of all database partitions


    ```

    db2inst1@mens:> db2 backup db itsodb on all dbpartitionnums online to

    /db2backup compress"

