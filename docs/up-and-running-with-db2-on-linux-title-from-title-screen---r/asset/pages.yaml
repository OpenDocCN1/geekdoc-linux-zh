  md: "# Example 8-26 Create a table with an XML column\n\n```\nCREATE TABLE product\
    \ (\n  entityid INTEGER NOT NULL,\n  lastchange TIMESTAMP NOT NULL,\n  xdata XML,\n\
    \  PRIMARY KEY (entityid)\n);\n```\n\nWe insert a few records into the PRODUCT\
    \ table as shown in Example 8-27.\n\n# Example 8-27 Insert XML data into the product\
    \ table: insert.dml\n\n```\nINSERT INTO product\n(entityid, lastchange, xdata)\n\
    VALUES\n(0, TIMESTAMP, '<description><name>Fleece\njacket<name><price>19.99</price></description>'),\n\
    (1, TIMESTAMP, '<description><name>Nylon\npants<name><price>9.99</price></description>'),\n\
    (2, TIMESTAMP, '<description><name>Silk\npants<name><price>9.99</price></description>'),\n\
    (3, TIMESTAMP, '<description><name>Jean\nacket<name><price>7.99</price></description>'),\n\
    (4, TIMESTAMP, '<description><name>Shirt<nname><price>3.99</price></description>');\n\
    ```\n\nNow, we can start querying the data. Example 8-28 retrieves the product\
    \ names\nfor all products where the price is less than 9 in XML format. The query\
    \ is\nspec in XQuery syntax.\n\n# Example 8-28 Retrieve columns in XML format\
    \ by using XQuery: xquery_example.sql\n\n```\nxquery\nfor $i in db2-fn:xmlcolumn('PRODUCT.XDATA')/description/name[..]/price\
    \ < 9\nreturn $i;\n```\n\nExample 8-29 shows the query execution and the result\
    \ in XML format. Note that\nfor better readability, we have stripped the blanks\
    \ in the output using the cut\ncommand.\n\n# Example 8-29 Result of the XQuery\n\
    \n```\ndb2inst@puget: db2 -tf xquery_example.sql | cut -c1-30\n<name>Jean</name>\n\
    <name>Shirt</name>\n```"
  merge: -1
  pgno: 478
- img_proc: true
  md: "You can also use SQL statements to retrieve data with the XQuery expression\
    \ in the FROM clause as shown in Example 8-30. The function XMLEXISTS matches\
    \ all records from the XQuery expression.\n\nExample 8-30 Match XML records in\
    \ the FROM clause: select_xquery.sql\n\n```\nSELECT entityid\nFROM product\nWHERE\n\
    \  XMLEXISTS(\n    $/description[price < 9]\n    PASSING xdata AS \"i\"\n  );\n\
    ```\n\nThe output is shown in Example 8-31.\n\nExample 8-31 Result of the script\
    \ select_xquery.sql\ndb2inst@puget:~> db2 -tf select_xquery.sql\n\n```\nENTITYID\n\
    ---\n3\n4\n2 record(s) selected.\n```\n\nIn Example 8-32, we retrieve the result\
    \ of the XQuery as a table and join it to the other relational tables directly.\n\
    \nExample 8-32 Retrieve XML data as a table: select_table.sql\n\n```\nSELECT\n\
    \  p.entityid,\n  x.*\nFROM\n  Product p,\n  XMLETABLE(\n    $/description[price\
    \ < 9] PASSING xdata AS \"i\"\n    PATH 'name',\n    COLUMNS \"name\" CHAR(30),\n\
    \    \"price\" DECIMAL(9,2) PATH 'price'\n  ) AS x\n;\n```\n\nThe function XMLETABLE\
    \ converts the XML document into a table. You can see the result in Example 8-33\
    \ on page 459. The column ENTITYID comes from the relational table, and the column's\
    \ name and price come from the XML data."
  merge: -1
