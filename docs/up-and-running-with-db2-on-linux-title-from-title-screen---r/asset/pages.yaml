    # 3.6 DB2 configuration


    DB2 has many configuration parameters that specify the allocation of system resources
    and the overall configuration of the instance and the database. These parameters
    are stored in the database configuration, the database manager configuration,
    and in the registry.


    Because the default values are for machines with relatively small memory and disk
    storage, you might need to modify them to fit your environment. A good starting
    point for tuning your configuration is the Configuration Advisor or the AUTOCONFIGURE
    command.


    If you create a new database, many of the parameters are already set to AUTOMATIC
    so that Self Tuning Memory Management (STMM) takes care of their tuning.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# 3.6.1 STMM: Self-tuning memory management


    In Version 9, DB2 introduced a new feature, Self Tuning Memory Management (STMM),
    that greatly simplifies the database memory configuration by automatically setting
    values for several memory configuration parameters. STMM manages memory for the
    following DB2 memory consumers:


    +   - Buffer pools

    - Package Cache

    - Locking memory

    - Sort memory


    The tuning of these areas can be turned on and off individually. Tuning is done
    across different databases and different instances on the same system. The memory
    available for tuning can be limited. If no more memory for tuning can be allocated
    from the operating system or if the memory reaches the limit that you defined,
    the available memory is taken away from another area where the memory is not needed
    as much. For instance, if STMM figures out that more memory is needed for one
    buffer pool, it can take this memory away from another pool.


    The frequency of tuning is determined based on the workload and each tuning step
    is logged in dbdiag.log and in the directory stmml.


    STMM also works on partitioned databases, but in this case, each system must be
    the same hardware. And, the workload and the data must be distributed equally,
    because the tuning parameters are determined on one partition called the tuning
    partition and then distributed to the other partitions.


    Figure 3-19 on page 134 illustrates how the space in the memory is distributed
    among the various areas.'
  merge: -1
  pgno: 154
- img_proc: true
