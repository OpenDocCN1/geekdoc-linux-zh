    +   1. Log in as root.


    +   2. Enter the following command:

    ```DB2DIR/instance/db2icrt [-a AuthType] -u FencedID InstNme```


    In this command:


    +   - DB2DIR is the location where the current version of the DB2 database product
    is installed.

    - AuthType represents the authentication type (SERVER, CLIENT, or SERVER_ENCRYPT)
    for the instance. If you do not specify this parameter, the default authentication
    type, SERVER, is assigned.

    - FencedID represents the name of the DB2 fenced user.

    - InstNme represents the name of the instance that you are creating. The name
    of the instance must be the same as the name of the instance owning user. This
    instance will be created in the home directory of the instance owning user.


