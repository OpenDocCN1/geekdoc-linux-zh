  md: '# 4.3 Migrating a single-partitioned database


    This section describes the single-partitioned database migration procedure. In
    general, single-partitioned database migration steps are a "subset" of the procedure
    for migrating a multi-partitioned database. Here, we provide the required steps
    and point out the differences in each step, 4.2, "Migrating multi-partitioned
    database" on page 173.


    Follow these single-partitioned database server migration steps:


    +   1. Verify that you can migrate your instance to the Version 9.5 that you have
    installed.


    +   2. Save the packages and table space information.


    +   3. Back up the DB2 configuration and diagnostics information (db2support).


    +   4. Ensure that the database does not contain any indoubt transactions.


    +   5. Revoke the EXECUTE privilege on migrated routines from PUBLIC. This is
    an optional step.


    +   6. Set the DIAGLEVEL parameter to 3 or higher.


    +   7. Make the DB2 Version 8 or Version 9.1 databases inactive.


    +   8. Archive all of the DB2 log files if replication is used.


    +   9. Back up the databases. We suggest a offline backup for each database.


    +   10. If you are still using raw devices for database logging or table space
    containers, you must change them to block devices.


    +   11. Install DB2 9.5 Server.


    +   12. Stop the instance.


    +   13. Make sure that there are no outstanding processes on the instance to be
    migrated.


    +   14. Verify that the databases in the instance can be migrated using db2mig,
    and if necessary, take actions to fix any problems.


    +   15. Migrate the instance to DB2 9.5.


    +   16. Preserve the dbdiag.log by renaming the file.


    +   17. Preserve the files indicated in the DIAGPATH parameter including dump
    files, trap files, and alert log files.


    +   18. Start the DB2 instance.


    +   19. Migrate the databases in the instance.


    +   20. Compare the database configuration settings after migration with the configuration
    settings before the migration and adjust them if required.'
