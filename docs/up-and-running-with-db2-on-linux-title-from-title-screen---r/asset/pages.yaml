  md: '# DB2 provides a stored procedure, AUTOMAINT_SET_POLICY, to specify your automated
    maintenance policy for automatic backup (also for AUTO_REORG and AUTO_RUNSTATS,
    as well as to set the days and times for the online and offline maintenance windows).


    > Note: The DB2 built-in administrative routine administrative views provide an
    easy to use programmatic interface for performing a variety of DB2 administrative
    tasks. These routines and views can be invoked from an SQL-based application,
    or a command line.


    To configure automatic backup using the AUTOMAINT_SET_POLICY stored procedure,
    you have to create an Extensible Markup Language (XML) configuration input specifying
    details, such as backup media, whether the backup will be online or offline, and
    the frequency of the backup.


    The AUTOMAINT_SET_POLICY stored procedure takes two input parameters:


    +   - Maintenance type: AUTO_BACKUP, AUTO_REORG, AUTO_RUNSTATS, or MAINTENANCE_WINDOW

    - Configuration: A binary large object (BLOB) type argument or an XML file specifying
    the configuration in XML format


    The procedure AUTOMAINT_GET_POLICYFILE allows you to obtain details about the
    policies in XML format. The XML file can be edited as needed, and the changes
    are reimported using the AUTOMAINT_SET_POLICY procedure.


    In Example 6-20, we obtain the current settings from the database, edit the file
    to define the duration to four hours, and set the settings for the database.


    Example 6-20 Change the maintenance window


    ```

    db2inst1mens: db2 -call

    AUTOMAINT_GET_POLICY(''MAINTENANCE_WINDOW'', ''window.xml'')

    db2inst1mens: cat /home/db2inst1/sqlib/tmp/window.xml

    <?xml version="1.0" encoding="UTF-8"?>

    <DB2MaintenanceWindows

    xmlns="http://www.lbm.com/dbms/prod/db2/automatic/config" >

    <!-- Online Maintenance Window --

    <OnlineWindow Occurrence="During" startTime="00:00:00" duration="24" >

    <DaysOfWeek>All</DaysOfWeek>

    <DaysOfMonth>All</DaysOfMonth>

    <MonthsOfYear>All</MonthsOfYear>

    ```'
