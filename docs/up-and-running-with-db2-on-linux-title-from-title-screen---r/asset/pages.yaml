- img_proc: true
  md: '# Application development


    It has become increasingly important for a database to effectively support a wide
    range of open standards and open source products for application development.

    DB2 provides accessibility for many standard interfaces and comes with a full
    suite of development tools.


    In this chapter, we discuss the following topics:


    +   - Application configuration

    - DB2 application objects

    - Programming languages

    - Application development tools


    In this chapter, we demonstrate the examples by using the SAMPLE database that
    DB2 provides. You can create a sample database in your instance by running the
    command db2samp from the command line. Alternatively, you can create the SAMPLE
    database from the First Steps (db2fs) at the end of the installation or after
    the installation. In examples, we usually refer to the DB2 instance home directory
    as db2inst1. You can change the name if you want to use a different instance name.
    You can find information in Getting Started with Database Application Development,
    GC23-5856, and on this Web site:


    http://www.ibm.com/software/data/db2/ad/


    DB2 provides many programming examples in the directory

    <instancehome>/sqlib/samples.'
  merge: -1
  pgno: 446
- img_proc: true
  md: "# 8.1 Application configuration\n\nDB2 supports local and remote application\
    \ development, which provides the flexibility in application design. Figure 8-1\
    \ illustrates three database connection configurations.\n\n![](img/f11f73c917561aadc89cbf81db6d9105_447_0.png)\n\
    \n+   - Scenario 1: A local client connects to a local database.\n  This configuration\
    \ requires a locally installed database server. In this scenario, the application\
    \ and the database run on the same server, which is useful for small systems or\
    \ for test and development systems.\n- Scenario 2: A local client connects to\
    \ a remote database by using a locally cataloged node.\n  This configuration requires\
    \ only a locally installed DB2 client. The database is hosted on another system\
    \ that has a DB2 data server installed. After cataloging the database node, the\
    \ remote database looks like a local database from the application's point of\
    \ view.\n- Scenario 3: A local client connects to a remote database directly.\n\
    \  This configuration does not require any DB2 software installed on the local\
    \ system. Instead, you use a driver that supports the direct connection to the"
  merge: -1
  pgno: 447
- img_proc: true
  md: 'remote database, such as a Type 4 JDBC driver. The database server is installed
    on the other machine.


    Separating the application and the database servers as in scenario 2 and 3 is
    usually a preferred architecture for the larger installations. It provides more
    flexibility in tuning the servers separately, applying maintenance tasks, and
    implementing failover.


    DB2 supports multi-version installation on one system. Different versions or the
    same version with different fix pack levels can coexist in the same machine. For
    instance, you can run a DB2 Version 8.2 and a DB2 Version 9.5 instance on the
    same machine or V8.1 Fix Pack 1 and V8.1 Fix Pack 2 in one system.


    An instance is related to a Linux user ID and can be accessed through the network
    by a TCP/IP port. If you want to access a database remotely, the database has
    be configured to listen on a particular port. The port can be configured by using:


    ```

    db2 UPDATE DBM CONFIG USING SVCENAME 50000

    ```


    In addition, the TCP/IP protocol must be enabled by using:


    ```

    db2set DB2COMM=tcpip

    ```


    The database manager needs to be restarted afterwards. Figure 8-2 shows the concept
    of the instance setup.


    ![](img/f11f73c917561aadc89cbf81db6d9105_448_0.png)


    Chapter 8. Application development 427'
  merge: -1
  pgno: 448
- img_proc: true
  md: "# 8.2 DB2 application objects\n\nDB2 supports stored procedures (SPs), user\
    \ defined functions (UDFs), and triggers, all of which are used to develop applications.\
    \ You can develop the applications from the command line, or you can use the Data\
    \ Studio.\n\n# 8.2.1 Triggers\n\nA Trigger is a defined set of SQL statements\
    \ that is stored as a DB2 object in a DB2 database. This set of SQL statements\
    \ executes when a certain event occurs against a DB2 table. Types of events that\
    \ might invoke Insert, Update, or Delete to a DB2 table. You can set triggers\
    \ to execute before, after, or instead of an insert, update, or delete event:\n\
    \n+   - **[No cascade]**: The defined action will be executed before the triggering\
    \ action is performed.\n- **After**: All triggered actions will be applied when\
    \ the triggering action is done.\n- **Instead of**: The original action will be\
    \ replaced by the action defined in the trigger.\n\nTriggers are defined using\
    \ the create trigger Data Definition Language (DDL) statement.\n\n> Note: The\
    \ CREATE TRIGGER statement is explained in more detail in the Information Center\
    \ in Database fundamentals -> SQL -> Statements -> CREATE TRIGGER and in SQL Reference,\
    \ Volume 2, SC10-4250.\n\nTriggers are useful to implement business logic in a\
    \ central place. A trigger becomes part of the transaction that fires it.\n\n\
    Example 8-1 demonstrates how to create a trigger to audit changes on the SALARY\
    \ or the BONUS column in the EMPLOYEE table of SAMPLE database. The changes are\
    \ captured in the EMPLOYEE_HIST table.\n\nExample 8-1 Trigger sample to store\
    \ history data\n\n```\nCREATE TABLE employee_hist(\n  empno CHAR(6),\n  salary_old\
    \ DECIMAL(9,2),\n  salary_new DECIMAL(9,2),\n  bonus_old DECIMAL(9,2),\n  bonus_new\
    \ DECIMAL(9,2),\n  chg_date TIMESTAMP);\n```"
  merge: -1
  pgno: 449
- img_proc: true
  md: '```

    CREATE TRIGGER employee_audit

    AFTER UPDATE OF salary, bonus ON employee

    REFERENCING OLD AS old_row NEW AS new_row

    FOR EACH ROW MODE db2sql

    INSERT INTO employee_hist

    Values(old_row.empno,

    old_row.salary,

    new_row.salary,

    old_row.bonus,

    new_row.bonus,

    current timestamp);

    ```


    Example 8-2, we modify several salary amounts on the employee table to fire the
    trigger and populate the EMPLOYEE_HIST table. By selecting data from EMPLOYEE_HIST,
    you can see how our trigger works.


    Example 8-2 Each update forces one insert into the employee_hist table


    ```

    db2 update employee set salary where empno = 55000 -- ''000070''

    db2 update employee set salary where empno = 45000 -- ''000110''

    db2 update employee set salary where empno = 55000 -- ''000170''

    db2 update employee set salary = 65000 -- ''000070''

    ```


    ```

    db2inst1@db>: db2 select * from employee_hist order by empno

    ```


