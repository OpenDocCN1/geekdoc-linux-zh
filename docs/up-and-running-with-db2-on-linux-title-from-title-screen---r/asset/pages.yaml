    # 3.7 Security


    In this section, we briefly discuss the security in the DB2. We introduce security
    in the Linux, instance, database, and network levels. For detailed information
    about this subject, refer to:


    +   - DB2 Security and Compliance Solutions for Linux, UNIX, and Windows, SG24-7555

    - Database Security Guide, SC23-5850

    - The Information Center under Database fundamentals → Security.


    # Security on the Linux level


    On the Linux level, the security is managed in terms of users and groups. A user
    has one primary group and more or less a dedicated user ID, which runs all DB2
    database instance is more or less of this instance. The database instance offers
    access from the network through a TCP/IP port. Security considerations for DB2
    on the Linux level are based on that assumption.


    # File system permissions


    When an instance is created, DB2 places all DB2 under the home directory of the
    instance user. These files must be accessible by users who want to use this instance.


    All further files that you create, such as table space containers, transaction
    logs, archive logs, backups, diagnostics log, and so on, do not need to be accessible
    by the users directly. Therefore, you can restrict their permission to only the
    instance user.


    Many Linux systems have set the umask to 0022 by default, which makes all newly
    created files readable by everyone. If security is a concern, consider setting
    the umask to 0027 for the instance user.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'UDFs and stored procedures can be configured so that they run under the fenced
    user ID to shield the UDFs from the core of the database manager. So, a crashing
    UDF cannot bring down the database manager. Running UDFs and stored procedures
    under the fenced user ID adds overhead to the call of the UDF, though.


    The use of fenced user IDs can serve also another purpose. It allows them to run
    under a different user ID than the database manager. So they cannot access the
    files of the database instance directly. It also prevents overflows from taking
    excessive database resources.


    The fenced user ID is defined during the creation of the instance.


    # Authorities


    DB2 instance level authorities, SYSADM, SYSMAINT, and SYSMON, are granted through
    operating system group. Each DB2 instance level authority provides a certain level
    of access and permissions to the databases of the instance. In the database manager
    configuration, you can define which Linux groups are assigned to which authorities.
    The authorized groups are specified in the database manager configuration as shown
    in Example 3-38.


    Example 3-8 instance level authorities


    ```

    db2inst11> db2 get dbm config | grep _GROUP

    SYSADM group name (SYSADM_GROUP) = DB2ADM1

    SYSCTRL group name (SYSCTRL_GROUP) =

    SYSMAINT group name (SYSMAINT_GROUP) =

    SYSMON group name (SYSMON_GROUP) =

    ```


    # Security on the network level


    If networking is enabled, the database manager opens a TCP/IP port, which is used
    by DB2 clients to communicate with the server. Firewalls must be opened for that
    port, and you can use proxies, such as SOCKS Version 4.


    By default, all of the communication between the database server and the client
    is not encrypted. If you need to protect the data transfer, you can enable Secure
    Sockets Layer (SSL) support or you can configure the server for SERVER_ENCRYPT
    or DATA_ENCRYPT authentication.


    The authentication type is defined in the database manager configuration as shown
    in Example 3-39 on page 151.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'Example 3-39> Authentication parameter in the database manager configuration


    ```

    db2inst1@::> db2 get dbm config | grep AUTHENTICATION

    Database manager authentication (AUTHENTICATION) = SERVER

    ```


    # Security on the database level


    On the database level, you can control data access using the authorities and privileges
    that DB2 provides. The data access can be controlled even in the order and column.
    The security mechanism offered by DB2 includes:


    +   - Authorities for the administrators

    - Views for restricting access to a subset of the data

    - Privileges to restrict access to the DB2 objects

    - Packages to restrict access to certain functions

    - UDFs and stored procedures to restrict access to certain functions

    - Roles that offer a more detailed way to implement security rules than the methods
    that are offered by the Linux groups

    - Encryption to even protect data from access by the DBA

    - Label-based access control (LBAC) to restrict the access by users to data to
    the column and the row level

    - Trusted context to address the typical problems introduced in a multiple tier
    architecture


    # Privileges


    On the database level, privileges can be granted on the following object type:


    +   - Schemas

    - Table spaces

    - Tables and views

    - Packages

    - Indexes

    - Sequences

    - Routines


    Privileges can be granted to:


    +   - Linux users

    - Linux groups

    - DB2 roles

    - PUBLIC


    To grant privileges, use the GRANT statement.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Encryption


    If you need to protect sensitive data, such as credit card information, you can
    use the built-in functions ENCRYPT, DECRYPT_BIN, and DECRYPT_CHAR. Encryption
    allows you to protect sensitive data from access by even the database administrator.


    # Defaults


    When a database is initially created, the following permissions are granted to
    PUBLIC:


    +   - CREATETAB

    - BINDADD

    - CONNECT

    - IMPLSCHEMA

    - BIND on all packages created in the NULLID schema

    - EXECUTE on all packages created in the NULLID schema

    - CREATEIN in schema SQLJ

    - CREATEIN on schema NULLID

    - USE on table space USSPACE1

    - SELECT access to the SYIBM catalog tables

    - SELECT access to the SYSCAT catalog views

    - SELECT access to the SYSSTAT catalog views

    - UPDATE access to the SYSSTAT catalog views

    - EXECUTE with GRANT on all procedures in schema SQLJ

    - EXECUTE with GRANT on all functions and procedures in schema SYSPROC


    If you do not want these permissions, you can specify the option RESTRICTIVE on
    the CREATE DATABASE command.


    # 3.8 Client configuration


    In this section, we discuss how to install and configure DB2 clients using the
    graphical tool Configuration Assistant or the DB2 command line processor.


    DB2 clients provide access to the DB2 database server. In DB2 Version 9.5, there
    are three types of DB2 data server clients available:


    +   - IBM Data Server Client


    This is a full installation. It includes all of the components, as well as graphical
    and non-graphical tools, for administering DB2 systems and developing applications
    with DB2. This client also includes add-ins for Eclipse and Microsoft® Visual
    Studio® 2005 development environments.'
  merge: -1
