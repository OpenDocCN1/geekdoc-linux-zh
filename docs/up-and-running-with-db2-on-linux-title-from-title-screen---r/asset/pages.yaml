  md: '# Create database


    Example 3-15 shows the DDL to create multi partitioned database. This DDL is almost
    identical to the DDL to create a single partitioned database that was shown in
    Example 3-12 on page 112, except that we have introduced the usage of the $N,
    which substitutes the partition number.


    Example 3-15 Create a partitioned database: crdb.sql


    The argument "$N" [](type:link,url:https://example.com/blank){text:blank} is a
    database partition expression that can be used anywhere in the storage path. You
    can specify multiple database partition expressions. The partition expression
    is terminated by a space character. There is no space character in the storage
    path after the database partition expression, it is assumed that the rest of the
    string is part of the partition expression. Table 3-1 shows how $N is used for
    the calculation of the path name.


    # Table 3-1 Calculation of $N assuming the partition number is 10


    | Syntax | Example | Value |

    |---|---|---|

    | [blank]$N$ | $N$ | 10 |

    | [blank]$N+[number] | $N+100$ | 110 |

    | [blank]$N$[number] | $N*5$ | 0 |

    | [blank]$N+[number]$[number] | $N+1*5$ | 1 |

    | [blank]$N$[number]+[number] | $N*4+2$ | 4 |


    $ is the modulo function


    Using the following command to run the create database script:

    - db2 tvf crdb.sql


    After the database is created, you can connect to the database as shown in Example
    3-16 on page 115. We also list the table spaces in the catalog node mensa.'
