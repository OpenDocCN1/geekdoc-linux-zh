    # 8.2.3 Stored procedures


    A stored procedure helps to reduce unnecessary data transfer over the network
    between the client and the server. The SQL statements and definitions are stored
    on the database server. The client sends only the necessary data over the network
    to call the stored procedure and gets the results sent back, which helps to improve
    the overall performance of client/server applications.


    Like UDFs, procedures are extremely useful to put common business logic into a
    central place and make it accessible to any client.


    The CREATE PROCEDURE DDL statement defines a procedure within an application server.
    There are two types of procedures: external procedures, which are written in a
    programming language; and SQL procedures, which are written in SQL. Stored procedures
    written in other languages than SQL are handled similarly to UDFs written in other
    languages. Refer to 8.3.3, "C and C++" on page 441 and 8.3.4, "Java" on page 449
    for a discussion of UDFs in C and Java.


    Example 8-5 on page 432 shows an SQL procedure that calculates the new salary
    and bonus for an employee. The input is an employee number and rating, and the
    result is to update the table EMPLOYEE.


    The file basecase.db2 is part of the DB2 samples, and it can be found in <instance
    home>/sqlib/samples/sqproc.


    > Note: The CREATE PROCEDURE statement is explained in more detail in the Information
    Center in Database fundamentals → SQL → Statements → CREATE PROCEDURE and in SQL
    Reference, Volume 2, SC10-4250.'
  merge: -1
  pgno: 452
- img_proc: true
  md: "# Example 8-5 A simple example of an SQL procedure\n\ndb2inst1@puget=\"~/sqlib/samples/sqlproc>\
    \ db2 connect to sample\n\nDatabase Connection Information\n\n| Database server\
    \ | = DB2/LINUX 9.5.0 |\n| SQL authorization ID | = DB2INST1 |\n| Local database\
    \ alias | = SAMPLE |\n\n```\nCASE rating\n  WHEN 1 THEN\n    UPDATE employee\n\
    \      SET salary = salary * 1.10, bonus = 1000\n      WHERE empno = employee_number;\n\
    \  WHEN 2 THEN\n    UPDATE employee\n      SET salary = salary * 1.05, bonus =\
    \ 500\n      WHERE empno = employee_number;\n  ELSE\n    UPDATE employee\n   \
    \   SET salary = salary * 1.03, bonus = 0\n      WHERE empno = employee_number;\n\
    END\nDB200001 The SQL command completed successfully.\n```\n\n> Note: In the file\
    \ basecase.db2, we use the \"@\" character as a command terminator, because the\
    \ semicolon \":\" is already used to terminate the procedure statements.\n\nExample\
    \ 8-6 on page 433 shows how to call the SQL procedure from the command line."
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Example 8-6 Procedure call on command line


    ```

    db2inst1@puget:> db2 "CALL update_salary (''000100'', 1)"

    ```


    Return Status = 0


    A stored procedure usually runs in a separate process under the fenced user.

    The fenced user is defined in the CREATE INSTANCE command:


    ```

    ./db2icrt -u <fenced id> <instance id>

    ```


    During the development of SPs and UDFs, you need to change the database

    manager configuration parameter KEEPFENCED (in the previous version,

    parameter was named KEEPDARI) to NO, so that every time that the procedure

    is invoked, the actual version is loaded:


    ```

    db2 update dbm cfg using KEEPFENCED NO

    ```


    > Note: You can obtain more information about stored procedures in

    Developing User-defined Routines (SQL and External), SC23-5855.


    # 8.3 Programming languages


    In this section, we introduce several of the programming languages that you can

    use on Linux, and explain how to set up the environment for each

    programming language. We discuss the following languages in this section:


    +   * C/C++

    * Java

    * Hypertext Preprocessor (PHP)

    * Perl


    In general, the following steps are required to use these languages with DB2:


    +   1. Set up the application development environment for the language that you

    are using. Build, install, and test the required programs, modules, and drivers,

    and make any necessary changes to permissions and paths.

    2. Identify and include DB2-specific drivers in your code. In order for your

    program to access DB2, you must copy or refer the required code into

    your program.

    3. Connect to a specific DB2 database. Usually, an identifier is generated from

    t connect command, which is used with the SQL requests in the program.

    4. Use SQL statements to manipulate and retrieve data in the database.


    In most cases, you need to install at least the IBM Data Server Client to develop

    software.'
