  md: '# Important DB cfg parameters


    This section describes important database configuration parameters and the recommended
    settings. Many of the parameters are handled by STMM. We discuss STMM in 3.6,
    "DB2 configuration" on page 132.


    +   **AVG_APPLS (which can be set to AUTOMATIC)**nThis parameter lets DB2 know
    how many concurrent applications run in your system on average. When set to 1,
    DB2 gives every application all of the current available memory in the buffer
    pool. Changing this parameter can have a huge impact on the performance.


    +   **CATALOGCHE_SZ**nThis parameter holds database, table space, table, and index
    information in memory. DB2 looks first in cache when it prepares an execution
    of a plan. Sufficient memory avoids cost-intensive disk I/O. Check with db2 get
    snapshot for database db_name and compute the hit ratio with:

    100 - ((Catalog cache inserts X100) / Catalog cache lookups)


    +   **MAXFILOP**nThis is the number of files that each application can open. The
    default value is typically too low. Opening files and closing files slow SQL response
    times and burn CPU cycles. If files are being closed, adjust the value of MAXFILOP
    until the opening and closing stops. Use the command:

    db2 get snapshot for database db_name


    And, look at the Number of files closed. If the value is more than 0, increase
    the MAXFILOP value.


    +   **LOCKTIMEOUT**

    The default is set to -1, which means a connection can wait until it gets all
    resources. Deadlock problems occur if a connection holds locks that are required
    by another application. To prevent too many deadlock situations, for OtLP, set
    this value to 10, and for DSS, set this value to 60.


    +   **LOGBUFSZ**nDB2 uses a buffer for log records before writing the records
    to disk. If the value is set to 0, it results in unnecessary I/O on the disk.
    When increasing the value of this parameter, consider increasing the DBHEAP parameter,
    because the log buffer memory is allocated from the database heap.


    +   **SORTHEAP (which can be set to AUTOMATIC)**nEach sort has its own amount
    of memory that is allocated by the database manager. This parameter defines the
    maximum sort memory that can be used. When increasing this value, examine the
    SHEAPATHRES_SHR'
