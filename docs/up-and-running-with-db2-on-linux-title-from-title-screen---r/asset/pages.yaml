    You can see that in a partitioned environment the partition groups are expanded
    transparently across the partitions. In Figure 1-8, we show two logical partitions
    on the first system and one physical/logical partition on the second system. Table
    spaces are assigned to one partition group. After you add a system or a logical/physical
