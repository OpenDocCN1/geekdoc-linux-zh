- img_proc: true
  md: 'A task is a script, together with the associated success conditions, schedules,
    and notifications. You can create a task within the Task Center, create a script
    within another tool and save it to the Task Center, import an existing script,
    or save the options from DB2 dialog or wizard, such as the Load wizard. A script
    can contain DB2 commands, SQL, or operating system commands.


    For each task, by using the Task Center, you can:


    +   - Schedule the task.

    - Specify success and failure conditions.

    - Specify actions that must be performed when this task completes successfully
    or when it fails.

    - Specify e-mail addresses (including pagers) that need to be notified when this
    task completes successfully or when it fails.


    You can specify conditional coding by creating task actions. Each task action
    consists of a task and the action that is performed by the task. For example,
    task one can have the following task actions:


    +   - If one task is successful, task A enables the schedule for task two.

    - If one task fails, task B runs task three.


