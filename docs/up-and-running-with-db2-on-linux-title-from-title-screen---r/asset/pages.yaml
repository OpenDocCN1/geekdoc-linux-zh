    # 8.3.4 Java


    Java is an ideal language for writing programs that will run on multiple platforms.
    Unlike languages, such as C or C++, Java is completely specified and each Java-enabled
    platform supports a core of libraries. One of these libraries is JDBC, which you
    can think of as a Java version of ODBC. Using Java in conjunction with JDBC allows
    you to write portable database applications.


    > Note: You can obtain information about programming Java for DB2 in *Developing
    Java Applications*, SC23-5853.


    # JDBC


    Because of its portability, you can develop Java applications on any system. If
    you want to develop Java programs under Linux, you can use tools, such as Data
    Studio, Eclipse, Rational Developer, Netbeans, or just a plain Java Developer
    Kit (JDK) from Sun.


    Example 8-17 on page 450 demonstrates the development of a small JDBC-based Java
    program using the plain Software Developer Kit (SDK) and the Type 4 driver. It
    selects data from the EMPLOYEE table in the SAMPLE database.


    First, the driver is loaded by the driver manager. Then, a connection is based
    on the driver URL: `jdbc:db2://<hostname>:<port>/<database>`


    ```

    jdbc:db2://<hostname>:<port>/<database>

    ```


    The application then performs a SELECT on the table and loops through the result
    set.


    Before running the example, you must replace the <port> by the port number of
    your instance, and you must replace the <password> by the actual password.'
