    # Automatic storage for databases


    Automatic storage is a new feature introduced in DB2 9.1. It simplifies storage
    management for table spaces. When you create a database, you specify the storage
    paths where the database manager will place table space data. The database manager
    will manage the container and space allocation for the table spaces as you create
    and populate them.


    Databases are created with automatic storage by default. If you do not want to
    enable it, create the database with the option AUTOMATIC STORAGE NO.


    > Note: You cannot change the automatic storage setting after a database has been
    created.


    For an automatic storage-enabled database, you have the option to create table
    spaces to be managed automatically or not using the MANAGED BY clause. MANAGED
    BY AUTOMATIC STORAGE specifies the storage of a table space is to be managed by
    that database manager automatically. MANAGED BY SYSTEM or MANAGED BY DATABASE
    defines the storage of a table space to be managed manually. If you omit the MANAGED
    BY clause, the table space is managed by automatic storage.


    If you have not enabled your database for automatic storage, you cannot specify
    the option MANAGED BY AUTOMATIC STORAGE.


    In Example 3-7 on page 103, we create a database with automatic storage enabled
    and add one path for automatic storage. The snapshot data shows the storage path
    for the database.'
