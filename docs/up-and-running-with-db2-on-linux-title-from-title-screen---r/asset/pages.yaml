  md: '# 1.1 Overview


    It was not too long ago that Linux servers were used primarily in the academic
    and scientific domain. In just a few short years, Linux has earned the designation
    of being one of the fastest growing server operating platforms and is becoming
    increasingly pervasive in the enterprise. Its openness, flexibility, and ability
    to lower the cost of ownership are just a few of the factors that have contributed
    to this operating system'' phenomenal success in the commercial area of e-business
    systems. Once relegated to running infrastructure tasks, such as file and Web
    serving, Linux has now found its way into the enterprise datacenter. Many companies
    have moved beyond the initial phases of experimentation and testing and are now
    reaping the benefits of deploying mission critical applications and databases
    with Linux and DB2.


    DB2 has been known for its technology leadership. Therefore, it was not surprising
    when IBM took the lead in bringing DB2 proven performance, scalability, and ease
    of use of features to Linux. Over the years, DB2 has kept up its lead by releasing
    the first database for clustered environments on Linux, showcasing the first commercial
    database for Intel® and AMD™-powered 64-bit platforms, and continuing to be industry
    leading benchmarks on Linux. The IBM commitment to Linux is further reflected
    through its ongoing efforts to exploit and enhance the Linux kernel for database
    workloads.


    IBM is the market leader in relational database systems. The reasons why major
    companies and governments around the globe choose to deploy DB2 for Linux in the
    enterprise setting are quite simple. The DB2 rich set of features has been running
    on Linux almost four years, and during this time while the Linux kernel matured
    through the efforts of thousands of programmers and volunteers, the IBM teams
    were busy further hardening the kernel and DB2 on Linux for enterprise workloads.
    Today, DB2 is the most versatile and powerful database on Linux and capable of
