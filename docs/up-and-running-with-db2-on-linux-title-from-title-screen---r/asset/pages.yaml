    The data is distributed among the partitions using an updatable partitioning map
    and a hashing algorithm, which determines the placement and retrieval of each
    row data. For example, if a row is added to a table, the coordinator node checks
    a partitioning map, which specifies the database partition where the row is to
    be stored. The row is only sent to that database partition server, with the result
    that only the interested database partition servers take part in the insert. This
    keeps communications and coordination overhead between nodes as low as possible.
    See Figure 1-9 on page 23.'
