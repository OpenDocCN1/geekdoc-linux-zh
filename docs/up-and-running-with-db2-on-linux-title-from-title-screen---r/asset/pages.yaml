- img_proc: true
  md: 'There are several methods available to reduce the need for a reorganization
    of a table and its indexes, such as setting PCTFREE for a table to preserve a
    certain percentage of each data page for subsequent insert and update operations.
    For more information, refer to Tuning Database Performance, SC23-5867.


    Analyzing the statistics produced by RUNSTATS can indicate when and what kind
    of reorganization is necessary. In addition, you can use the REORGCHK command
    to calculate statistics on the database or use current statistics to determine
    if tables or indexes, both, need to be reorganized or cleaned up.


    > Important: After reorganizing a table, you need to collect statistics on the
    table so that the optimizer has the most accurate data for evaluating query plans.


    # Index reorganization


    To get the best performance from your indexes, consider reorganizing your indexes
    periodically, because table updates can cause index page prefetch to become less
    effective.


    The REORG INDEX option reorganizes all indexes that are defined on a table by
    rebuilding the data into unfragmented, physically contiguous pages. If you specify
    the Cleanup option only while reorganizing an index, cleanup is performed without
    rebuilding the indexes.


    During index reorganization, using the REORG INDEXES command with the ALLOW WRITE
    ACCESS option, all indexes on the specified table are rebuilt while read and write
    access to the table is allowed. Any changes made to the underlying table that
    affect indexes while the reorganization is in progress are logged in the database
    logs. The reorganization will process the logged changes while rebuilding the
    index.


    > Note: The default behavior of the REORG INDEXES command is ALLOW NO ACCESS,
    which places an exclusive lock on the table during the reorganization process.
    You can specify ALLOW READ ACCESS or ALLOW WRITE ACCESS to permit other transactions
    to read or update the table.


    As with table reorganization, index reorganization is also integrated into the
    DB2 Control Center. Refer to Figure 6-23 on page 285.'
