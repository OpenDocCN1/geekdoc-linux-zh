    # 7.6.4 The sar command


    The sar command is an integrated and powerful System Activity Report (sar) utility.
    You can use it to collect and report CPU utilization, memory and swap utilization
    statistics, and I/O and transfer rate statistics, as well as network statistics.
    You can save the output of the sar command into a designated file and retrieve
    information from that file at a later time.


    The general syntax to use the sar command is:


    ```

    sar [ options ] [ interval [ count ] ]

    ```


    Table-3 on page 421 frequently used command options for sar that are extracted
    from sar’s man pages.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Table 7-3 Frequently used command options for sar


    | Options | Description |

    |---|---|

    | -A | This flag is equivalent to specifying -bBcdqrRuvwWy-I SUM -I XALL -n FULL-P
    ALL. |

    | -b | Reports the I/O and transfer rate statistics. |

    | -C | Reports the process creation activity. |

    | -d | Reports the activity for each block device. |

    | -e | Sets the ending time of the report. |

    | -f | Extracts records from the filename (created by the -o filename). The default
    value of the filename parameter is the current daily data file, the /var/log/sa/sad
    file. The -f option is exclusive of the -o option. |

    | -n | Reports the network statistics. |

    | -o | Saves the readings in the file in binary form. |

    | -q | Reports the queue length and load averages. |

    | -r | Reports the memory and swap space utilization statistics. |

    | -s | Sets the starting time of the data, causing the sar command to extract
    records time-tagged at, or following, the time specified. |

    | -u | Reports the CPU utilization. |

    | -v | Reports the status of inode, file, and other kernel tables. |

    | -w | Reports the system switching activity. |

    | -x | Reports the statistics for a given process. |


    We provide samples of using the sar command next. In Example 7-31 on page 422,
    first, sar is started with the -A command option, and the output is saved in the
    startest.bin file:


    ```

    sar -A -o startest.bin 5 60 > /dev/null &

    ```


    In the previous example, startest.bin is the output file name, and the interval
    is five seconds and repeats 1000 times.'
