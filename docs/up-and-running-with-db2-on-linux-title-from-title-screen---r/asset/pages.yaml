    # 6.2 Table/index reorganization and statistics collection


    When considerable changes have been made to a table, the physical data pages for
    the table and its indexes will become discontinuous or fragmented. If a clustering
    index exists for a specific table, it can become badly clustered after many changes
    have been made time and the index key entries. Additional costs, such as CPU time
    and I/O operations, will be required to manage a similar workload under these
    conditions, can lead to obvious performance degradation. Performing maintenance
    activities on your databases is essential in ensuring that they are optimized
    for performance and recoverability.


    DB2 offers the configurable automatic table maintenance function. If you are unsure
    when and how to reorganize your tables and indexes and how to collect statistics
    information, you can incorporate automatic as part of your overall database maintenance
    plan.


    If you want to manually reorganize the tables and indexes, DB2 provides a REORG
    utility for this purpose. After finishing the reorganization tasks, use the RUNSTATS
    utility to gather information about the physical data storage characteristics
    of a table and the associated indexes. This information includes, for example,
    the number of records in the table, how many pages are occupied by the table and
    the associated indexes, the cluster ratio of the associated DB2 optimizer will
    take advantage of these statistics when determining the access path to the data
    to gain better performance for subsequent database operations.


    If you create a database in Version 9.1 or 9.5, automatic statistics collection
    is enabled by default. With automatic statistics collection enabled, the DB2 database
    manager automatically runs the RUNSTATS utility in the background to ensure that
    the correct statistics are collected and maintained.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 6.2.1 Automatic table maintenance


    Starting with Version 8.2, DB2 provides automatic maintenance capabilities for
    performing database backup, keeping statistics current, and reorganizing tables
    and indexes as necessary. It can be time-consuming to determine whether and to
    run maintenance activities, and automatic maintenance removes the burden from
    you. You can manage the enablement of the automatic maintenance features simply
    and flexibly by using the automatic maintenance database configuration parameters.
    The default values for a DB2 Version 9.5 are shown in Example 6-33.


    Example 6-33 Automatic maintenance database configuration parameters


    ```

    db2inst1@> db2 get cfg for itsodb | grep Automatic

    Automatic maintenance (AUTO_MAINT) = ON

    Automatic database backup (AUTO_DB_BACKUP) = OFF

    Automatic table maintenance (AUTO_TBL_MAINT) = ON

    Automatic runstats (AUTO_RUNSTATS) = ON

    Automatic statement statistics (AUTO_STAT_STATS) = OFF

    Automatic statistics profiling (AUTO_STATS_PROF) = OFF

    Automatic profile updates (AUTO_PROF_UPD) = OFF

    Automatic reorganization (AUTO_REORG) = OFF

    ```


    The hierarchy of the parameters allows you to turn all automatic maintenance on
    or off without affecting the respective activity settings. For instance, if the
    AUTO_TBL_MAINT parameter is set to OFF, the parameter AUTO_RUNSTATS is not of.


