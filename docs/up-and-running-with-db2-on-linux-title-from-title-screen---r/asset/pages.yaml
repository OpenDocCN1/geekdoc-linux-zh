    # 7.2 Memory Visualizer and Memory Tracker


    In this section, we discuss two memory monitoring tools: Memory Visualizer and
    Memory Tracker.


    # Memory Visualizer


    The Memory Visualizer can assist you in monitoring memory utilization for a DB2
    instance. It uses visual displays and plotted graphs to help you understand memory
    components and their relationships to each other, and it helps you uncover and
    fix memory-related problems on a DB2 instance.


    You can start Memory Visualizer in the Control Center by right-clicking an instance
    and selecting View memory usage. To start the Memory Visualizer from the command
    line, issue the db2env command. The Memory Visualizer panel appears as shown in
    Figure 7-28 on page 382.


    ![](img/f11f73c917561aadc89cbf81db6d9105_402_0.png)'
