    # Changing the enforcement policy


    The default enforcement policy is Soft Stop, which means that all connections
    to DB2 databases are allowed to connect, even when the license policy is violated.
    When a violation occurs, a license violation message is written to db2diag.log.
    The Hard Stop enforcement policy does not permit any connections that violate
    the license policy. To specify the enforcement policy, type:


    +   1. Select Change from the License menu.


    +   2. Select the appropriate radio button under Enforcement policy.


    # Generating a compliance report


    To verify the license compliance of DB2 features, you can generate a compliance
    report. It lists DB2 features out of compliance with your current report entitlement.
    Each DB2 feature status is listed as either:


    +   - In compliance: The feature has been used and is properly licensed.

    - Violation: The feature is not licensed and has been used.


    You can generate a compliance report using the License Center by selecting **Generate
    Compliance Report** from the License menu. Figure 3-34 shows the report.


