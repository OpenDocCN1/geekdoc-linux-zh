    The LOCK WITH FORCE option can be used to force conflicting applications with
    the load operation in order to allow the load operation to proceed without waiting.
    The forced application will receive an error SQL1224N.


    The ALLOW READ ACCESS option is not supported if the REPLACE option is specified;
    otherwise, error code SQL334N with reason code 1 will be returned. Because a load
    replace operation deletes the existing table data before loading the new data,
    there is no pre-existing data to query until after the load operation is complete.'
