    # 2.2.2 Installation methods


    There are four methods in which you can install DB2 on:


    +   - DB2 Setup wizard

    - db2_install command

    - Response file installation

    - Payload deployment


    Each method has its own advantages and disadvantages. The preferred method often
    depends on your level of expertise and type of environment, but in general, if
    a graphical terminal is available, using DB2 Setup wizard is recommended.


    # DB2 Setup wizard


    The DB2 Setup wizard is a Java-based graphical tool that installs DB2. It lays
    down the DB2 file sets and the Java Developer Kit. It allows you to create a new
    DB2 instance, create new users and groups or configure DB2 to existing users,
    configure communications, create the tools catalog database, and set up notification.


    DB2 Setup also has an option that allows you to create a response file. This is
    the best method for less experienced users, because most of the configuration
    is performed for you.


    # db2_install command


    The db2_install script installs all DB2 packages on your Linux system, and you
    cannot select or deselect components. This method is reliable and commonly used
    by expert users for installing DB2 on larger, more complex partitioned database
    environments. Tasks, such as user and group setup, instance creation, tools catalog
    database creation, and notification setup, have to be performed manually after
    the installation.'
