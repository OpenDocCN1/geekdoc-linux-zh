  md: 'This is a typical application architecture with one database, which is accessed
    by a Java 2 Platform Enterprise Edition (J2EE) application from an application
    server, and a batch application, which extracts data. The J2EE application is
    accessed by the users using Web browsers.


    The database is created in UTF-8 format. The J2EE application also uses the data
    in UTF-8 format. The batch application runs on a single byte environment and converts
    the data into ISO8859-1.


    Because this application is a worldwide application, the user community uses different
    codepage setups in their Web browsers.


    DB2 automatically converts the codepage between the client and the server. For
    applications, this conversion probably needs to be implemented in the code. In
    Figure 3-3 on page 95, we note where a codepage conversion of the transferred
    data is necessary. Depending on your architecture, you can have many places where
    a codepage conversion might be necessary.


    You must decide before the database creation what codepage you want to use for
    your database, because it cannot be changed easily afterwards. A change requires
    recreating the database and a data migration using db21ook move.


    UTF-8 offers support for all languages and is the best choice if you have to provide
    worldwide access to your application. If you support only your local country and
    your country uses a single byte codepage, you probably want to choose a single
    byte codepage for your database. A database created for a single byte codepage
    requires less storage.


    If you must support several countries with single byte codepages, which can be
    converted between each other, you might want to choose a single codepage for your
    database. It depends on the number of conversions that you have to perform in
    your architecture.


    > If you use pureXML or if you have UTF-8 clients, set up your database as UTF-8.
    The simplest approach, however, is if your whole architecture was set up for UTF-8.


    # 3.2.2 Table space considerations


    In this section, we describe the various types of table space containers and it
    is appropriate to use them.'
