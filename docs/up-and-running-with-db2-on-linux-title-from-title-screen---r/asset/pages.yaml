    # File system configuration


    We recommend that you create multiple partitions using your Linux OS installation.
    It has become customary for certain basic directories, such as /db2home or /software
    (in our example), to be placed in separate file systems, and partitions, for several
    reasons:


    +   - Disk capacity: There is a limited amount of space on each disk, and you
    might run out of space if you use a single disk for multiple purposes.


    +   - Performance: The root directory has to be searched linearly every time path
    in Linux is accessed. If the root directory is cluttered, this clutter will impair
    the performance of the entire system.


    +   - Backup: It is better to separate important and frequently changing data
    from massive and seldom changing data. This way you can save resources by backing
    up certain file systems more frequently than other file systems.


    +   - User convenience: It is easier to find things if the naming convention is
    well organized.


    File system configuration, or partitioning, is typically performed by using the
    fdisk tool. For SUSE you can also use the YaST tool. Linux provides several file
    system formats, such as ext3, JFS, VxFS and ReiserFS. For our example, for database-related
    file systems, we use the ext3 format with the journal to create a file system.


    To show all defined file systems, issue the df command, as shown in Example 2-1.
    This command shows the output for a partitioned database environment. For a single
    partition environment, you do not need the NFS file system for DB2.


