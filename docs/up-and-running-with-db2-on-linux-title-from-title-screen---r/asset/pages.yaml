    # 3.21 Codepage considerations


    In DB2 9.5, the default database codepage is UTF-8. The codepage is specified
    during database creation time. If you want to change the codepage afterwards,
    the database must be recreated.


    Figure 3-3 shows an example architecture. We use this architecture to discuss
    the codepage conversion that has taken place between the database and the application.


