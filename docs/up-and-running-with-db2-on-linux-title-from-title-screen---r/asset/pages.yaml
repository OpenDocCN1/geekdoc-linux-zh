  md: "# 8.4 pureXML\n\nExtensible Markup Language (XML) becomes more and more important\
    \ for Web, Java, and Java 2 Platform Enterprise Edition (J2EE) development. XML\
    \ is used to store configuration information or to exchange data in a system-independent\
    \ way. DB2 has now implemented native XML support. This section provides an overview\
    \ of XML capabilities.\n\n# 8.4.1 Storage model\n\nPrior to DB2 9.1, you were\
    \ able to store XML in DB2 in the following ways:\n\n+   Store as a character\
    \ large object (CLOB)\nThis method preserves the original XML structure, but you\
    \ cannot search by attribute. If you want to extract a particular attribute, you\
    \ have to parse the whole XML from the CLOB. In order to implement search and\
    \ extract more efficiently, you can create separate columns for the attributes.\
    \ But, that increases the needed space and adds maintenance overhead.\n\n+   Store\
    \ all attributes in the relational data model:\nUsing this method, you parse the\
    \ XML document to insert into the database. To have the original XML document\
    \ structure, recreating is required. This approach works for simpler XML structures.\
    \ For more complex and nested XML structures, you have to create a much more complex\
    \ relational model.\n\nDB2 pureXML supports the native storage of XML data in\
    \ the DB2 database. It allows you to work on the XML attributes using SQL statements\
    \ or XQuery directly. You can create indexes on particular XML attributes based\
    \ on XQuery expressions.\n\nExample 8-25 shows a simple XML document:\n\n```\n\
    <products>\n  <product xmlns=\"http://posample.org\" pid=\"10\">\n    <description>\n\
    \      <name>Fleece jacket</name>\n      <price>19.99</price>\n    </description>\n\
    \  </product>\n  <product xmlns=\"http://posample.org\" pid=\"11\">\n    <description>\n\
    \      <name>Mylon pants</name>\n      <price>9.99</price>\n    </description>\n\
    \  </product>\n</products>\n```"
  merge: -1
  pgno: 476
- img_proc: true
  md: '```

    </product>

    </products>

    ```


    DB2 pureXML stores the XML data in the database in a tree structure. DB2 pureXML
    does not store the XML document in tree format, but it parses the document and
    stores the attribute values in a tree. The attribute names are not stored in the
    tree but in a lookup table. This storage model provides efficient retrieval. The
    DB2 components, such as indexes, the programming languages, and the optimizer,
    support this XML data model, too.


    Figure 8-3 shows the storage layout for the XML document in Example 8-25 on page
    455.


    ![](img/f11f73c917561aadc89cbf81db6d9105_477_0.png)


    Figure 8-3 Storage layout for products.xml


