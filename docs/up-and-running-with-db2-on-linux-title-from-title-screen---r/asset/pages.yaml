  md: 'table space storage consumption. In this example, we expect when table space
    utilization, which is measured as the percentage of space consumed, exceeds the
    predefined threshold values for a warning or alarm, the DB2 system will send notification
    to the administration notification log and the specified contacts by e-mail. You
    can get recommendations from the Health Center or by DB2 CLP commands for this
    type of situation and takes actions accordingly. Furthermore, we also show how
    to specify follow-up actions for the occurrence of a warning or alarm for this
    health indicator. You can have the corrective action taken automatically when
    the values for a health indicator setting exceed.


    The example consists of the following steps:


    +   1. Prepare the DMS table and the table.

    2. Review the health indicator for the DMS table space.

    3. Populate a desired amount of data into the table space.

    4. Check the notification that is sent by the DB2 system.

    5. Take corresponding action to resolve current health alerts.

    6. Set up additional follow-up actions.


    These steps are given in detail:


    +   1. Prepare the DMS table space and the table.


    In our example, we use a DMS table space with a file container. The size of the
    table space is 10 MB on each partition at its first creation. After the table
    space is created, a table with a distribution key is created within the table
    space (Example 7-2).


    Example 7-2 Prepare the table space and the table for the Health Center


    ```

    db2inst@ensa:db2home/db2inst/script~-tvf crt_sample.db2

    CREATE TABLE tbspms_0 IN DATABASE GROUP

    IBMDEFAULTGROUP PAGESIZE 8192 MANAGED BY DATABASE USING (file

    ''/database/db2inst/NODE000 /ITSOB/T0000008/C0000000.LRG 10M)

    AUTORESIZE NO1

    DB200001 The SQL command completed successfully.

    ```


    ```

    CREATE TABLE db2inst.empinfo (ID INTEGER NOT NULL, LASTNAME VARCHAR(30),

    HIREDATE DATE, SALARY INTEGER, PRIMARY KEY(ID)) in tbspms_0 DISTRIBUTE BY

    HASH(0)

    DB200001 The SQL command completed successfully.

    ```


    # 2. Review health indicator settings for the DMS table space:


    For test purposes, we change the AUTORESIZE parameter for table space from the
    default YES to NO.'
