    # Create table spaces and tables


    The next step is to create tables for your application. When a database is created,
    DB2 creates three default table spaces. The USERSPACE1 is used to place the data
    tables. The tables will usually be based on the database design, more table spaces
    can be created in particular table space based on the application and database
    design. It is common to create your own table spaces that are spread across all
    partitions or only a few of them.


    Every table space has to be created in a database partition group. Here, we demonstrate
    the creation of a table space over all partitions defined in db2nodes.cfg, using
    the default database partition group IBMDEFAULTSGROUP.'
