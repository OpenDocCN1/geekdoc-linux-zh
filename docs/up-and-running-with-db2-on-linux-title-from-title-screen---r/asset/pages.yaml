  md: 'In this section, we lead you through the steps that are required to set up
    NFS:


    +   - Get the NFS service running on each machine in the cluster.

    - On a single machine in the cluster (NFS server), create a file system to use
    as the instance home directory (if it has not already been created).

    - Mount this file system locally.

    - Set this file system to be mounted at each reboot.

    - Export the DB2 home file system using NFS.

    - Mount the exported file system on each of the remaining machines in the cluster.


    # Get the NFS service running


    To verify that NFS is running on each computer that will participate in the partitioned
    database system, enter the following command:


    ```

    showmount -e hostname

    ```


    If you enter showmount without specifying a host name, it will check the local
    system.


    If NFS is not running, you will receive a message similar to the following message:


    ```

    clintupd_create: RPC: Program not registered

    ```


    To start the NFS:


    +   - Make sure that you have the nfs-utils and nfs-server packages installed
    on each machine.

    - NFS operations:

    The commands for starting, stopping, and checking the status of NFS are different
    in each Linux distribution:

    - For SUSE:

    SLES 10 uses the kernel-based NFS server. The command to configure the NFS server
    is rcnfsserver:

    - To start NFS, rcnfsserver start

    - To stop NFS, rcnfsserver stop

    - To check the NFS status, rcnfsserver status


    Make sure that NFS is started during startup time. You can check it with the command
    chkconfig nfsserver. If NFS is not on, enable it through:


    ```

    chkconfig nfsserver on

    ```'
