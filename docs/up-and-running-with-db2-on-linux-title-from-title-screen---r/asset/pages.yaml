- img_proc: true
  md: 'Certain people prefer this method, because it bypasses the configuration performed
    by DB2 Setup. It allows you to configure DB2 according to your preferences initially
    and gives you more control over database management. Particularly for larger,
    multi-partition systems, we recommend that the databases are stored in a separate
    file system (for example, database). Performing manual configuration allows you
    to allocate your preferred default database directory in the first place.


    The **db2_install** command installs all components for the DB2 product that you
    specify with the English interface support. You can select additional languages
    to support with the -L parameter.


    Considering the higher number of manual configuration tasks, this installation
    can take longer. It requires a higher level of skill and cannot create response
    files.


    # Response file installation


    A *response file* can be created using the DB2 Setup wizard or by editing a sample
    response file. It allows **you** to install DB2 across multiple machines with
    consistent installation and configuration settings and **can also** be used to
    set up a DB2 cluster. A response file installation is fast, because it bypasses
    the graphical wizard and does the configuration for you. Another advantage of
    using a response file is that it **creates** a Database Administration Server
    (DAS) on each machine, while with **db2_install1**, the DAS must be created manually
    after installation. For more advanced users we recommend that you create a response
    file by editing a sample response file and then use this to install DB2. The *response
    file* not only installs DB2, but it can also configure users, create an instance,
    set up notification, create a tools catalog, and configure a large number of database
    manager configuration parameters. This is the quickest installation method if
    you already have all the information you need. Unlike the DB2 Setup wizard, the
    response file installation is not interactive, and it takes slightly longer to
    prepare the response file. However, you only have to **take** "longer" one time,
    and it can be used to install the same configuration on multiple machines.


    # Payload deployment


    This method is an advanced installation method that is not recommended for most
    users. It requires the user to physically install payload files. A *payload file*
    is a compressed tarball that contains all of the files and metadata for an installable
    component.


    Like **db2_install1**, this installation requires manual configuration after the
    product files are deployed.


