    AUTO_RUNSTATS for automatic statistics collection

    AUTO_REORG for automatic reorganization


    Follow these steps to use the Configure Automatic Maintenance wizard:


    +   1. Open the wizard from the Control Center by right-clicking a database object
    as shown in Figure 6-15 on page 276.'
