  md: '# PHP and the Web server


    PHP is often built as an Apache module; although, it can also be used through
    Common Gateway Interface (CGI). Many other Web servers support PHP, too, including
    the Apache-based IBM HTTP Server.


    If you intend to use PHP with DB2 using a Web front end, you need to consult chapter
    1 of *Developing PHP Applications for IBM Data Servers*, SG24-7218, to guide your
    decision about an HTTP server and to help you how to install it with PHP and DB2.


    > Note: If you intend to share an HTTP server with WebSphere Application Server,
    the IBM WebSphere Developer Technical Journal article "Pair J2EE with PHP to implement
    a common Web application infrastructure" provides instructions to help them coexist:


    ```

    http://www.ibm.com/developerworks/websphere/techjournal/0505_krook/0505_krook.html

    ```


    Here are further resources for maximizing the benefits of using PHP with DB2:


    +   - Official PHP documentation:

    - http://www.php.net/docs.php


    +   - Zend Core for IBM is a seamless predefined, ready to use, easy to install,
    and supported PHP development and production environment, which features tight
    integration with DB2 drivers:

    - http://www.zend.com/en/products/core/for-ibm


    +   - Zend Framework is based on simplicity, object-oriented practices, corporate
    friendly licensing, and a rigorously tested agile codebase:

    - http://framework.zend.com/


    +   - CakePHP enables PHP users at all levels to rapidly develop robust Web applications:

    - http://cakephp.org/


    +   - PEAR is a framework and distribution system for reusable PHP components:

    - http://pear.php.net/


    +   - The project development team (PDT) project provides a PHP Development Tools
    framework for the Eclipse platform:

    - http://www.eclipse.org/pdt/'
