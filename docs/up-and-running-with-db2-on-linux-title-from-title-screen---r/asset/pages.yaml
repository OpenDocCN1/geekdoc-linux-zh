  md: 'The Data Studio is a replacement for the Development Center and offers functions
    and features beyond application development. In regard to application development,
    the Data Studio offers the following additional features:


    +   - Integrated Query Editor for SQL and XQuery


    +   - SQLJ Editor


    +   - SQL Builder


    The Query Builder allows you to create your queries using Drag & Drop. You can
    test the queries directly by running them and viewing the results.


    +   - SQL Routine Debugger


    The SQL Routine Debugger allows you to debug SQL stored procedures.


    +   - Java Routine Debugger


    You can create your Java procedures, promote them to the server, and even debug
    them remotely on the database server just as you have with stand-alone Java applications.


    +   - XML Editor


    It allows you to edit your XML document in a tree structure. You do not need to
    deal with the XML syntax.


    +   - XML Schema Editor


    It allows you to edit your XML schemas in a graphical way. You do not need to
    deal with the XML syntax.


    +   - Visual Explain


    It shows the access plan of your query so that you can troubleshoot performance
    problems.


    +   - Entity Relationship (ER) Diagramming


    You can create your ER diagrams directly from the database schema. The opposite
    is also true. The diagrams and the database remain connected that changes to one
    are reflected in the other one.


    +   - Data Web Services


    With a few clicks, you can create a Web service based on a query, deploy it to
    an application server, or create a Web archive (WAR) file from it.


    +   - pureQuery for Java


    pureQuery offers an easy access to the database. In relation to JDBC, it simplifies
    many tasks. The editor GUI supports all of the features that you know from Java
    program editing. You can create, edit, content assist, and run queries directly
    by selecting them within the program code.'
  merge: -1
