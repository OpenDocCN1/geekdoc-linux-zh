    db2inst1@db2> db2 -xf -extract_xml.sql | cut -C1-130\n<employee><emp>000280</emp><name>SCHINLIDER</name><firstname>ETHEL</firstname><salary>0036250</salary></employee>\n\
    <employee><emp>003590</emp><name>PARKER</name><firstname>JOHN</firstname><salary>0035340</salary></employee>\n\
    <employee><emp>000310</emp><name>SETRIGHT</name><firstname>MAUDE</firstname><salary>0035900</salary></employee>\n\
    <employee><emp>003010</emp><name>SPRINGER</name><firstname>MICHEL</firstname><salary>0035900</salary></employee>\n\
    <employee><emp>002030</emp><name>WONG</name><firstname>HELENA</firstname><salary>0037370</salary></employee>\n\
    <employee><emp>003040</emp><name>ALONZO</name><firstname>ROY</firstname><salary>0031840</salary></employee>\n\
    ```\n\nAs a last, we demonstrate the use of XSLT. In Example 8-38, we create an\
