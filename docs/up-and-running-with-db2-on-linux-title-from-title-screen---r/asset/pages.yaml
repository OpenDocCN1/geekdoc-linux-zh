  md: 'You manage all of these licenses through one of the following tools:


    +   - The DB2 License Center within the Control Center

    - db21cm, which is a license management tool command


    This section provides instructions to configure licensing using both of these
    tools.

    We discuss the following topics:


    +   - Installing a license key

    - Setting up a license policy

    - Changing the enforcement policy

    - Generating a compliance report


    If you installed a DB2 product with a Try and Buy license and now you want to
    upgrade to a full license, you do not need to reinstall the DB2 product. You simply
    upgrade your license.


    # 3.9.1 DB2 License Center


    The DB2 License Center is a graphical tool within the Control Center that manages
    licensing. You can use this tool to view license status and usage information
    for DB2 products installed on your system, add and remove license keys, specify
    user and enforcement policies. The DB2 License Center can also generate usage
    statistics and display connection information for users. To access the DB2 License
    Center:


    +   1. Log in as the instance owner.

    2. From the Control Center, select Tools -> License Center.

    3. Select the system and product on which you want to configure licensing. You
    can configure a local or remote system. Select DB2 Enterprise Server Edition from
    the Installed products list box as shown in Figure 3-33 on page 161.'
