    # 7.6 Linux system monitoring tools


    There are many Linux system monitoring tools available to help identify where
    a performance or system setting issue occurs. You can use these tools to monitor
    system resource usage, such as disk I/O, memory consumption, CPU activities, and
    network status. Through the utilization of the comprehensive information that
    is provided by these operating system tools combined with the database system
    tools from DB2, you can understand your system more clearly. For example, you
    can identify which space containers are under high I/O pressure, whether the excessive
    sort heap allocation will be the bottleneck causing a mass of paging space activities,
    if the network bandwidth is leading the poor response time of client applications,
    and so on. Then, you can make pertinent adjustments to your applications, database
    system, or operating system to improve the system performance.


    In this section, we discuss most of the most commonly used monitoring tools for
    the Linux platform: iostat, vmstat, and sar.


    # 7.6.1 The top utility


    The top utility is a useful tool that provides a lot of information on one display.
    Top can show which process is taking the longest processor time (a percentage)
    and the largest amount of memory (a percentage), plus how the system has been
    up, and the amount of free memory. By default, the utility will refresh the display
    every 3.0 seconds. You can override the default refresh'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'interval via the command option -d. The users need to be aware that the top
    command does not report the total memory that is used for DB2 correctly. Top will
    overestimate memory usage by counting shared memory segments multiple times.


    > Note: In Linux, DB2 will not free shared memory automatically. To free the shared
    memory, you need to recycle DB2.


    Table 7-1 lists several frequently used command line options for top.


    Table 7-1 Frequently used command options for top


    | Command option | Description |

    |---|---|

    | d | Specifies the delay between display updates. |

    | p | Monitor only processes with the given process id. This flag can be given
    up to twenty times. |

    | i | Start top while ignoring any idle or zombie processes. |

    | c | Displays the command line instead of the command name only. |

    | b | Batch mode. Useful for sending output from top to other programs or to a
    file. In this mode, top will not accept command input. It runs until it produces
    the number of iterations requested with the n option or stopped. Output is plain
    text that is suitable for display on a terminal. |


    If you are not using batch to run top, when the output of top displays, you can
    use the interactive command to control the display. For example, you can toggle
    off or on the display of CPU states or sort the processes list by the memory occupancy
    percentage, or cancel a process in the list. Table 7-2 on page 416 shows several
    commonly used commands.'
