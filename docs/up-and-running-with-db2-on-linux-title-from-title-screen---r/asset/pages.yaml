  md: '# DB2 Tools Catalog creation


    In this appendix, we provide information related to the Tool Catalog creation
    and a sample to create the DB2 Tools Catalog Database manually.'
  merge: -1
  pgno: 520
- img_proc: true
  md: '# DB2 Tools Catalog creation


    If you did not create a tools catalog when installed DB2, you can create it by
    using DB2 Control Center or by the Command Line Processor (CLP). If you are using
    the DB2 Control Center to create a tools catalog, after invoking the DB2 Control
    Center, you can select Tools -> Tools Settings -> Scheduler Settings (Figure B-1).


    ![](img/f11f73c917561aadc89cbf81db6d9105_521_0.png)


    Figure B-1 Defining the DB2 Tools Catalog


    You can choose the system and then create a new Tools Catalog database as shown
    in Figure B-2 on page 501.'
  merge: -1
  pgno: 521
- img_proc: true
  md: '![](img/f11f73c917561aadc89cbf81db6d9105_522_0.png)


    If you want to use the DB2 Command Line Processor, we provide a sample to create
    the Tools Catalog by using the DB2 CLP manually, we include the steps to check
    the DB2 administration server (DAS) configuration variations before and after
    creating Tools Catalog, and we show the new table samples and buffer pool created
    by the CREATE TOOLS CATALOG command automatically.


    Before we create Tools Catalog, we use GET ADMIN CFG for the current configurations
    for DAS as shown in Example B-1. You can see that certain parameters that are
    associated with the Tools Catalog are currently empty, including TOOLSCAT_DB,
    TOOLSCAT_INST, and TOOLSCAT_SCHEMA. We will use this information to compare the
    DAS configuration changes made by the CREATE TOOLS CATALOG command at a later
    time.


    Example: B-1 Checking the current DAS configuration


    ```

    db2inst1@Mensa:/> db2 get admin cfg

    ```


    # Admin Server Configuration


    Authentication Type DAS (AUTHENTICATION) = SERVER_ENCRYPT


    DAS Administration Authority Group Name (DASADM_GROUP) = dasadmn1


    DAS Discovery Mode (DISCOVER) = SEARCH

    Name of the DB2 Server Instance (DB2SYSTEM) = MENSA'
  merge: -1
