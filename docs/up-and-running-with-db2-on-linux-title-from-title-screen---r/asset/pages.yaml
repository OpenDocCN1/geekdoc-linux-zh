    # db2mtrk


    DB2 also provides you with a command line tool to obtain memory usage information
    for a DB2 instance. It is called Memory Tracker. The command name is db2mtrk.
    This command outputs the following memory pool information:


    +   - Current size (hard limit)

    - Maximum size (high water mark)

    - Type (identifier indicating the function for which the memory will be used)

    - Agent who allocated pool (only if the pool is private)

    - Application


    You can obtain a detailed help message for this tool by entering the following
    command in a Linux terminal:


    ```

    db2mtrk -h

    ```


    Example 7-8 shows how to use db2mtrk to monitor memory usage by DB2 instances,
    databases, and applications.


