    # ## 7.4.3 Operating system log


    The Linux operating system also has system utilities that provide support for
    system logging and kernel message trapping. Among those utilities, syslog provides
    a type of logging that many modern programs use. Every message that is logged
    by syslog normally contains at least a time and a host name field, a program name
    field, that depends on the dependability of the logging program.


    The syslogconf file, which is located in the /etc directory, is the main configuration
    file for the syslog. It specifies the rules for logging by syslog. It is a text
    file, and you can edit it with any favorable text editor to make it applicable
    to your environment, or you can simply use the default values, which were set
    during the Linux installation.


    It is a good practice to check the system log (the file may be named /var/log/messages
    if you have not changed the default configuration) when you face a problem if
    you are unsure whether the problem is related to the system setting. For more
    information how to set up syslogconf and how to interpret the system log, refer
    to the Linux-specific documentation.


    > Note: instead of the syslog package, SUSE Linux 10 installs the syslog-ng package
    by default. The syslog-ng.conf file is the main configuration file and is located
    in /etc/syslog-ng directory.


    # ## 7.5 DB2 Tools for troubleshooting


    The DB2 product contains several tools that can help you monitor and troubleshoot
    the DB2 system. We introduce several of these helpful tools and provide examples
    of their usage.'
