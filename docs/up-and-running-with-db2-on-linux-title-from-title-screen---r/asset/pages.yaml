  md: 'For a partitioned database, the message files will not be displayed to the
    console or retained for the load operations that are initiated from the CLP. To
    save or view the contents of these files after a partitioned database load has
    completed, you must specify the MESSAGES option of the LOAD command. We recommend
    that you use a fully qualified name for the MESSAGES file, such as /db2/datamove/myload.msg


    If you use the MESSAGES option, after the load operation has completed, the message
    files on each database partition are transferred to the client machine and stored
    in files with the base name that is indicated by the MESSAGES option. For partitioned
    load operations, Table 6-1 lists the name of the file corresponding to the load
    process that produced it.


    Table 6-1 Message file types that are generated by the partitioned LOAD operation


    | Process type | File name |

    |---|---|

    | Load Agent | <message-file-name>.load.<partitionnumber> |

    | Partitioning Agent | <message-file-name>.part.<partitionnumber> |

    | Pre-partitioning Agent | <message-file-name>.prep.<partitionnumber> |


    > Note: We strongly recommend that you use the MESSAGES option for partitioned
    load operations that are initiated from the CLP.


    # Monitoring the LOAD utility


