- img_proc: true
  md: '+   ARCHRETRYDELAY, NUMARCHRETRY, FAILARCHPATH


    The specified log archive method might fail, such as the archive file system might
    be full or the Tivoli Server Manager server might not be available. In this case,
    DB2 will retrieve the archive after the time specified by the ARCHRETRYDELAY parameter.
    NUMARCHRETRY specifies the number of attempts that will be made to archive the
    log files before they are archived to the path that is specified by the FAILARCHPATH
    configuration parameter. FAILARCHPATH is a temporary storage area for the log
    files until the archive method that failed becomes available. At which time, the
    log files will be moved from this directory to the log method directory situations
    might be avoided. This parameter must be a fully qualified existing directory.


    The log files are critical for database recovery. You need to manage the log files
    and the log space capacity.


    > Note: To monitor the current log usage for a running database, use the GET SNAP
    command or the LOG_UTILIZATION administrative view:

    db2 `SELECT * FROM SYBSADM.LOG_UTILIZATION`


    The LOG_UTILIZATION view shows the percentage of total log space, the percentage
    of available log space, and the used log space for each database partition.


    Starting with DB2 9.5, DB2 maintains two copies of the log control file: SQLOGCTL.LF1
    and SQLOGCTL.LF2. You can also copy DB2 to mirror the database log files by setting
    the following database parameter, MIRRORLOGPATH. DB2 provides the capability to
    mirror the active log files to prevent log loss in the case of a disk crash. We
    recommend that you place the secondary log path on a physically separate disk.


    Another related parameter is BLK_LOG_DISK_FUL. This database configuration parameter
    can be set to prevent disk full errors for the transaction when DB2 cannot create
    a new log file in the active log path because of a file system condition. If the
    parameter is set to YES, DB2 will attempt to create the log file every five minutes
    until it succeeds.


    > Note: For a detailed overview of the configuration parameters for database logging,
    refer to Data Recovery and High Availability Guide and Reference, SC23-5848.'
