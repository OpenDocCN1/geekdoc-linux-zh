    # ## 7.4.2 DB2 diagnostic log (db2diag.log)


    The Administration Notification log is the primary log file used by database and
    system administrators. Administration notification log messages, plus other details
    based on the setting, are also logged to the db2diag.log using a standardized
    message format. The db2diag.log file is intended for use by DB2 Support for troubleshooting
    purposes, and it is the most often used file for DB2 problem investigation.


    The db2diag.log file is also located under the directory that is specified by
    the database manager configuration parameter DIAGPATH. Another instance parameter,
    DIAGLEVEL, is used to specify which type of diagnostic errors will recorded in
    the db2diag.log. These values are valid:


    +   - 0: No diagnostic data captured

    - 1: Severe errors only

    - 2: All errors and warnings

    - 3: All errors, and informational messages

    - 4: All errors, warnings, and informational messages


    You might want to increase the value of this parameter to get additional problem
    determination data to help resolve a problem. The default value of DIAGLEVEL is
    3. If you change to 4 for any reason, remember to change it back to 3 or a lower
    value after the problem is resolved or the required information has been captured.
    Otherwise, keeping DIAGLEVEL at a level of 4 will impact the system performance
    to a certain extent, and the file system can fill up quickly.


    As shown in Example 7-1, the system information is always recorded at the beginning
    of the db2diag.log file. Similar information is recorded while writing a instance.


