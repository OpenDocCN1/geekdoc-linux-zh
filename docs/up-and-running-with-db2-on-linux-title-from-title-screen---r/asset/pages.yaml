  md: '# 4.6 Fix pack installation


    A DB2 fix pack is a collection of updates and fixes for Authorized Program Analysis
    Reports (APARs). We recommend that you keep your environment running up-to-date
    at the latest fix pack level.


    > Note: Fix packs are cumulative. Cumulative means that the latest fix pack for
    any version of DB2 contains all of the updates from the previous fix packs for
    the same version of DB2.


    You can have multiple DB2 copies on the same system, and those copies can be at
    different version and fix pack levels. If you want to apply a fix pack to one
    or more DB2 copies, you must install the fix pack on those DB2 copies one by one.


    DB2 9.5 enhanced the procedure for applying DB2 fix packs. Now, updating the DB2
    instance and DAS (running db2updt and dasupdt) are automated. In addition, binding
    occurs automatically at the first connection, which which means that after you
    start the database manager, the DB2 product is ready to use immediately after
    the fix pack installation.


    To apply a DB2 fix pack, perform the following steps:


    +   1. Download the code of the latest fix pack from:

    http://www.ibm.com/software/data/db2/support.html

    2. Carefully read the readme file and release notes and perform all of the necessary
    tasks.

    3. Install the DB2 fix pack.


    If you are running a non-root installation and root-based features are enabled,
    you must run db2rfe command each time that a fix pack is applied in order to re-enable
    those features. For details about a non-root installation, see Chapter 2, "Installation"
    on page 25.'
