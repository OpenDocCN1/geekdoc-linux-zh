    processing and to return the state of the table. You can connect to individual
    database partitions during a load operation and issue the LOAD QUERY command against
    the target table. When issued from the CLP, this command displays the contents
    of all of the message files on that partition for the table that is specified
    in the LOAD QUERY command.


