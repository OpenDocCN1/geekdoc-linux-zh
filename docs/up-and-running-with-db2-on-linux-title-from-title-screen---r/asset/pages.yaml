    archive the log files. You need to update the primary archive log path as

    shown in Figure 6-6.


    ![](img/f11f73c917561aadc89cbf81db6d9105_254_0.png)


    Figure 6-6 Primary archive log path


    You can go through all the pages to configure all of the related database logging

    parameters.


    After enabling log archiving, DB2 sets the database into the backup pending

    state to ensure a full offline backup is taken before starting with log

    archiving. To perform the backup in a single database partition environment, use

    the following command:


    ```

    db2 backup db2db to /db2backup

    ```


    In a partitioned database environment, there are different ways to take the

    backup. We explain taking the backup in more detail in 6.1.4, "Backup utility"
    on

    page 240. For now, Example 6-1 on page 234 shows one way of backing up a

    partitioned database.'
