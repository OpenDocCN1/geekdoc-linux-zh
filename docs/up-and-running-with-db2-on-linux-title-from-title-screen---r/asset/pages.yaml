    # Examples for ALLOW READ ACCESS when loading


    The ALLOW READ ACCESS option is useful when loading a large amount of data, because
    it allows users to access table data when the load operation is in progress or
    after a load operation has failed. The behavior of a load operation in ALLOW READ
    ACCESS mode is independent of the isolation level of the application. This is,
    readers with any isolation level can always read the pre-existing data, but will
    not be able to read the newly loaded data until the load operation has finished.


    Read access is provided throughout the load operation except at the very end.
    Before data is committed, the load utility acquires an exclusive lock (Z-lock)
    on'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'the table. The Load utility will wait until all of the locks held by all of
    the applications have been released, which might cause a delay before the data
    can be committed. The LOCK WITH FORCE option can be used to force off conflicting
    applications in order to allow the load operation to proceed without waiting.
    In Example 6-55, we create a table named ITEMLOAD and insert three rows from the
    pre-existing data. We then use ALLOW READ ACCESS to load additional rows from
