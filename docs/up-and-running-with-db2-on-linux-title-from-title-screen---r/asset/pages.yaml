    # 7.5.3 DB2 snapshot command


    Like the db2pd command, you can use the snapshot monitor to capture information
    about the database and any connected applications at a specific time. If you capture
    information at regular intervals, snapshots are also useful for observing trends
    and unforeseen potential problems. There are a number of snapshot request types
    available, each snapshot request returns a specific type of monitoring data.


    When using the command in a partitioned database environment, the snapshots can
    be taken at any partition of the instance, or globally. A global snapshot aggregates
    the data collected at each partition and returns a single set of values. Example
    7-21 has two samples showing the difference.


    > Example 7-21 A global snapshot


    ```

    db2inst1@mensa:> db2_all ''db2 get snapshot for all on itsoddb | grep ''Locks

    held currently''


    Locks held currently = 1

    mensa: db2 get snapshot for ... completed ok


    Locks held currently = 8

    gemini: db2 get snapshot for ... completed ok


    db2inst1@mensa:> db2 get snapshot for all on itsoddb global | grep "Locks

    currently"

    held currently = 9


    db2inst1@mensa:> db2_all ''db2 get snapshot for all on itsoddb | grep "Lock

    list*''


    Lock list memory in use (Bytes) = 5888

    mensa: db2 get snapshot for ... completed ok

    Lock list memory in use (Bytes) = 3392

    ```'
