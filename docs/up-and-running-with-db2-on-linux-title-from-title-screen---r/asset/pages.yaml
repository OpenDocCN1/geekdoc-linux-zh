    # 8.5.1 Explain facility


    Before DB2 executes an SQL statement, it creates an access plan that describes
    how DB2 accesses the data in to generate the result set. For static SQL statements,
    the access plan is stored in the related package. For dynamic SQL statements,
    the access plan is generated at run time.


    If you want to tune a query, you can use the explain facility to view the access
    plan to understand how DB2 accesses the tables to form the result set. Then decide
    if the query performance can be improved by adding indexes or rearranging the
    query.


    There are two tools for creating a visual access path: Visual Explain and the
    explain command.'
  merge: -1
  pgno: 484
- img_proc: true
  md: '> Note: The explain facility is described in detail Tuning Database Performance,
    SC23-5867, in Visual Explain Tutorial, SC23-5868, and in the Information Center
    by selecting Database fundamentals -> Performance tuning -> Tuning database application
    performance -> Explain facility.


    # Explain command


    Use the explain command from the command line to get an access plan. The following
    statement explains a SELECT query on the non-indexed column on the EMPMDC table:


    ```

    db2 "EXPLAIN ALL WITH SNAPSHOT FOR select count(*) from empmdc where explplest
    = ''TEST''

    ```


    We use the explain command to format the output:


    ```

    db2exfmt -d sample -e db2inst1 -g TIC -0 explain.out -w -1 -n %15s -s %15s -#
    0

    ```


    The output file explain.out contains the access path for the statement, as well
    as other detailed information about the query processing. Example 8-42 on page
    465 shows an excerpt from the file with the access plan.'
  merge: -1
