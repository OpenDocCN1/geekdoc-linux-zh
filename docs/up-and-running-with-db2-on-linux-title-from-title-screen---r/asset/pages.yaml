  md: 'the aggregate of all private memory for all agents. You might need to reduce
    the number of configured agents.


    +   - Support for multiple databases is limited, because all database shared memory
    segments for all databases are allocated in a single process space. You can reduce
    the memory usage for each database so that you can activate all databases successfully.
    However, the database server performance is impacted.


