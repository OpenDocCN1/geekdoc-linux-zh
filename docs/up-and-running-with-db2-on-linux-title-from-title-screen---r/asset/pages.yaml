    # 3.2.4 Multiple partition-specific configuration


    In DB2, a database partition is a part of the database that consists of its own
    data, indexes, configuration files, and transaction logs. Partitions are used
    to create clustered databases where one logical database is split on several systems
    (logical partitions) or the partitions can be on the same system (logical partitions)
    or on a different system (physical partitions).


    Figure 3-4 on page 105 shows the file system layout for our sample partitioned
    database.


    /db2home/<instance> is the instance home directory. In the partitioned database
    environment, /db2home is a Network File System (NFS) mount to


    /export/db2home on the first system. The other database files are located in local
    directories on each system. The file db2nodes.cfg defines the partitions that
    are part of the partitioned database.'
