    +   Ensure that you have enough pages in the corresponding index table space to
    account for one additional page per index on populated tables before:


    +   Populating tables in new databases created in DB2 9.5, real-time statistics
    are enabled by default in these newly created databases.


    +   Enabling deferred cleanup rollout by setting DB2_MDC_ROLLOUT to DEFER, or
    when DB2WORKLOAD is set to SAP.


    +   Reorganizing or recreating indexes on populated tables.


    # 4.1.2 Planning considerations


    DB2 9.5 brings new features to enhance performance and manageability. Several
    features and certain functionality are discontinued. The default values for several
    configuration parameters and registry variables have changed, and you need to
    check them.


    # Creating a database to enable new features


    Migration time is a good opportunity to consider creating a new database to leverage
    the full advantages of DB2 9.5 features and change the database settings, which
    can only be done in a new database. The considerations include:


    +   Automatic storage: This feature can only be enabled at database creation time.


    +   Database codepage: The database codepage determines which characters you can
    store in the database. You cannot change the codepage after the database is created.
    In DB2 9.5, the default codepage is Unicode.


    +   Database territory: This setting determines the date and time formats. You
    must define this option during database creation.


    +   Database collation sequence: The order in which character data is sorted in
    a database depends on the structure of the database and the collating sequence
    that is defined for the database. The database collating sequence is specified
    during database creation time, and it cannot be changed afterward.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Discontinued deprecated functionality


    Here are several discontinued and deprecated functions in Version 9.5:


    +   - The -w option for db2icrt, db2ilist, db2iupdt

    - The db2umdgp command

    - Several registry and environment variables, such as DB2_LINUXAIO and DB2_LPGAGE_BP

    - The IMPORT command options CREATE and REPLACE_CREATE are deprecated.

    - XML Extender is deprecated.


    When you migrate DB2 UDB Version 8, you have to review the changes that occurred
    in Version 9.1, too, such as these changes:


    +   - Alternate fix pack images are discontinued.

    - Type 3 Java Database Connectivity (JDBC) support is discontinued.

    - The Data Warehouse Center and the Information Catalog Center are no longer included.

    - Text Extender is no longer supported.

    - Audio, Image, and Video (AIV) Extenders are no longer supported.

    - The DB2_SCATTERED_IO registry variable is discontinued.


    # 4.1.3 Migration test consideration


    The entire migration process consists of two parts: installing DB2 9.5 code and
    migrating instances and databases. Installing DB2 9.5 code does not require downtime.
    Migrating instances and databases is the actual step that converts your DB2 system
    from Version 8 or 9.1 to Version 9.5. You need to stop to perform the migration
    of the instances and the databases.


    We recommend that you install and test DB2 Version 9.5 before migrating any Version
    8 or 9.1 instances to Version 9.5. If you have a test environment that mimics
    the production system, you can install DB2 9.5, migrate DB2 instances and databases,
    test all your applications on the test system, and carry the same procedure to
    the production environment. However, if you have a limited test environment or
    no test environment, you can utilize the DB2 features to test your applications
    under the new version.


    Because multiple versions of DB2 can coexist on Linux, you can install DB2 9.5
    while the application is still up and running under Version 8 or 9.1. You can
    then create Version 9.5 test instances and databases with a small amount of data
    to test your applications while production transactions are running.'
  merge: -1
  pgno: 193
