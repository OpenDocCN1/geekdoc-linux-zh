  md: '# Enabling ssh


    To configure DB2 to use ssh as the remote utility:


    +   1. Configure DB2 to use ssh. Set up DB2 to start with ssh support, you must
    enable the DB2 registry variable DB2RSHCMD and point it to the path of the ssh
    command shell. Example 2-29 shows the db2set command. The default is for DB2 to
    use rsh; therefore, you only need to set this variable if you use ssh.


    Example 2-29 Enable DB2 to use ssh

    $ db2set DB2RSHCMD=/usr/bin/ssh


    +   2. To verify the ssh configuration in the DB2 environment, log on to each
    machine as the DB2 partitioned instance owning user ID, and enter the commands
    as shown in Example 2-30.


    Example 2-30 Verify ssh configuration in DB2 environment


    ```

    $ mensa echo hi

    $ ssh gemini echo hi

    $ db2_all echo hi

    $ db2_all db2_all echo hi

    ```


    These commands will complete successfully without prompting for additional verification.


    # Starting and stopping instance manager to verify installation


    You can issue the db2start command to verify the installation now. If the installation
    is successful, you can use the db2start and db2stop commands to start or stop
    the instance manager on the primary machine or any participating machine. Example
    2-31 shows the output of the db2start and db2stop


