    certain differences and limitations. Table 2-7 shows several of them.


    Table 2-7 Differences and limitations between root and non-root installations


    | Criteria | Root installations | Non-root installations |

    | User can select installation directory | Yes | No. DB2 products are installed
    under the user''s home directory. |

    | Instance creation | Can create instances during installation. This is the recommended
    method. | A single instance is automatically created and configured. Further instances
    cannot be created in non-root installations. |

    | Number of DB2 instances allowed | Multiple | One |

    | Files deployed during installation | Program files only. Instances are created
    after installation | Program files and instance files. The DB2 product is ready
    for use immediately after installation. |

    | DB2 Administration Server (DAS) and its associated commands | Yes Available
    | No Not available |

    | Control Center | Yes Available | No Not available |

    | Operating system-based authentication | Yes | No. You can lift this limitation
    by having a root run the db2rf command. |

    | DB2 actions can be performed | A DB2 instance created by a user with root authority
    can be updated or dropped only by a user with root authority. | A non-root instance
    can be updated or dropped (using the db2install command) only by the non-root
    user who owns the non-root instance. |

    | Support partitioned database | Yes | No. Only single-partition databases are
    supported in non-root installations. |'
