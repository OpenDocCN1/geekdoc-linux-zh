    # ## 5.2.3 Migration from the Developer Workbench


    Because IBM Data Studio is a full replacement for the Developer Workbench, there
    is no direct migration path from the Developer Workbench to the Data Studio. You
    can install the Data Studio as a separate package and import the existing projects
    from the Developer Workbench to the Data Studio.


    # ## 5.3 Features and functions


    In this section, we introduce frequently used terminology in Data Studio and briefly
    discuss the features and functions that support you in designing and developing
    your database and your database applications.


    In 8.5.3, “Application development with the Data Studio” on page 470, we demonstrate
    the creation of a query using the Query Editor. We also create a Java stored procedure
    and demonstrate how to debug it on the database server.'
