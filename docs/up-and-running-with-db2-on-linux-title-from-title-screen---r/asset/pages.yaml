    max size of message (bytes) = 65536 // MSGMAX

    default max size of queue (bytes) = 65536 // MSGMNB

    ```


    We recommend that you set the SHMAX value to be equal to the amount of physical
    memory on your system. The minimum required for systems is 268435456 (256 MB)
    and for 64-bit systems, is 1073741824 (1 GB).


    In this example, SHMALL is set to 8 GB (8388608 KB = 8 GB). If you have more physical
    memory than 8 GB for DB2, increase the value of this parameter to approximately
    90% of your computer''s physical memory.


    The kernel parameter consists of four tokens: SEMMSL, SEMMN, SEMOPM, and SEMMN.
    SEMMN is the result of SEMMSL multiplied by SEMMN. The database manager requires
    that the number of arrays (SEMN) is increased as necessary. Typically, SEMMN needs
    to be twice the maximum number of agents exerted on the system multiplied by the
    number of logical partitions on the database server computer plus the number of
    local application connections on the database server computer.


    MSGMAX needs to be changed to 64 KB (that is, 65536 bytes), and MSGMNB needs to
    be increased to 65536.


    # Modifying kernel parameters on SUSE and Red Hat


    In this example, we explain how to update kernel parameters and set them after
    each reboot:


    +   1. Log in as root.


    +   2. Using a text editor, add the following entries to /etc/sysctl.conf:

    # shmax for a 64-bit system

    kernel.shmax=1073741824

    # shmall for 90 percent of 16 GB memory. The kernel requires this

    value as a number of pages

    kernel.shmall=3774873

    kernel.sem=250 256000 32 1024

    kernel.msgmn=1024

    kernel.msgmax=65536

    kernel.msgmnb=65536


    Load these entries into sysctl by using the following command:


    ```

    sysctl -p

    ```


    Now if you execute the command pcs -1, you can see that the kernel parameters
    have been updated in sysctl.


    ```

    sysctl -a

    ```'
