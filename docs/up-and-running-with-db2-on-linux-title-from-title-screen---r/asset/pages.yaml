  md: 'IBM Data Administration Console (DSAC), introduced in Version 1.2, is a Web-based
    interface to perform operational database management tasks. DSAC provides quick
    analysis and resolution capabilities to identified data server conditions and
    scenarios. With DSAC, you can immediately access critical data server information
    and functions from any time. In Version 1.2, DSAC functions include:


    +   - Health and availability monitoring:

    - Problem determination and recommendations

    - 72 hours of history

    - Ability to monitor up to 100 databases


    +   - Q Replication monitoring and administration


    For more detailed information, refer to the following sources:


    +   - General information about Data Studio:

    http://www.ibm.com/software/data/studio


    +   - Online documentation of the Data Studio:

    http://pubblic.boulder.ibm.com/infocenter/dstudio/v1r1m0/index.jsp


    +   - General information about the Eclipse platform:

    http://www.eclipse.org


    # 5.2 Installation


    This section provides the procedures to install IBM Data Studio. There are three
    methods by which you can install IBM Data Studio on Linux:


    +   - Installing from the Launchpad program

    - Using the IBM Installation Manager graphical interface

    - Installing silently, that is, response file installation


    # 5.2.1 Installing IBM Data Studio


    You can download IBM Data Studio at no charge from:

    http://www.ibm.com/software/data/studio/


    In this section, we show you how to install IBM Data Studio from an electronic
