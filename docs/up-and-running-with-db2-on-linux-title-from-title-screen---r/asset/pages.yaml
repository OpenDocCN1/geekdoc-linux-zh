    # 6.3.3 Load data from files into database tables


    The load utility provides an efficient way to move a large quantity of data into
    new or existing tables. The utility can handle most data types, including XML,
    large objects (LOBs), and user-defined types (UDTs). In general, the load utility
    is faster than the import utility, because it writes formatted pages into the
    database while the import utility performs SQL INSERTs. The load utility does
    not fire triggers and not perform referential checking or table constraint checking
    (over validating the uniqueness of the indexes).


    The load process consists of four distinct phases:


    +   * Load: During which the data is written to the table.


    +   * Build: During which indexes are produced.


    +   * Delete: During which the rows that caused a unique or primary key violation
    are removed from the table and stored in the load exception table, if one was
    specified.


    +   * Index copy: During which the index data is copied from a system temporary
    table space to the original table space. This copy will only occur if a system'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'temporary table space was specified for index creation during a load operation
    with the READ ACCESS option specified.


    To use the LOAD utility, you must have SYSADM authority, DBADM authority, or LOAD
    authority on the database together with the needed privilege depending on the
    load mode that you choose. For example, for REPLACE mode, you need INSERT and
    DELETE privilege on the table.


    The LOAD utility can be invoked through the command line processor (CLP), through
    the Load wizard in the Control Center, or by calling the ADMIN_CMD stored procedure,
    or by using an application programming interface (API), db2Load.


    Data for load can be in the form of a file, a tape, or a named pipe. Data can
    also be loaded by a cursor that is defined by a query running the currently connected
    database or a different database under the same instance, or data can be loaded
    by using a user-written script or application.


    You can use the LIST UTILITIES or LOAD QUERY command to monitor the progress of
    the load operation.


