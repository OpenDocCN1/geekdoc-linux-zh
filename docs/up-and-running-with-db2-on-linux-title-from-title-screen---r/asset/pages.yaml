  md: '# 3.4.2 Change the archive log path


    By default, circular logging is set for a new database. With this type of logging,
    only full and offline backups of the database are allowed. For recovery, the database
    can only be restored to the last offline backup, not to the point of failure.


    In order to enable full recovery of the database up to a specific point-in-time,
    you must enable archive logging. These archived logs are then used by the restore
    command to recover the database up to the current point in time. Chapter 6, “Administering
    databases” on page 227 details the setup of the archive logs path in detail.


    # 3.4.3 Change the path for db2diag.log


    DB2 log information, as an administrative event, or errors in the diagnostic db2diag
    file. This is an instance level log file and is located in <instance home>/sqlite/db2dump
    by default. It is a good practice to examine this file from time to time. Frequently,
    this file contains additional information about several DB2 commands, especially
    commands that interact with the operating system, as creating table spaces. In
    the db2diag.log file, you see information about wrong paths, permission problems,
    error codes, and so on.


    The level of detail that is logged in db2diag.log is specified in the DIAGLEVEL
    DBM configuration parameter and ranges from 0 to 4. The default is 3. The higher
    the number is the more information is logged. Setting it to 4 can have a performance
    impact on the database.


    You need to maintain the db2dump directory as the db2diag.log file keeps growing


    ```

    Example 3-25 Relocate db2diag.log

    db2inst@puget:> db2 get db config | grep DIAGPATH

    Diagnostic data directory path (DIAGPATH) = /home/db2inst/sqlite/db2dump

    db2inst@puget:> db2 update db config using DIAGPATH /db2diag

    db200001I THE UPDATE DATABASE MANAGER CONFIG command completed successfully.

    db2inst@puget:> db2 get db config | grep DIAGPATH

    Diagnostic data directory path (DIAGPATH) = /db2diag

    ```'
