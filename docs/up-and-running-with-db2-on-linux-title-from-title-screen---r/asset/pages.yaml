    # 3.7.2 Monitoring with db2top in interactive mode


    The db2top User Manual.pdf is the documentation for db2top usage. You also

    can obtain detailed online help by entering the following command in a Linux

    terminal:


    ```

    db2top -h

    ```


    A simple syntax of the db2top is:


    ```

    ./.db2top -d dbname

    ```


    To start command, issue the following command in a Linux terminal:


    ```

    ./db2top -d ITSODB

    ```


    In the previous command, ITSODB is the database name in this book. The

    db2top starting window shows in Figure 7-29 on page 388.


    You can press the h key to enter the help panel. To get back to the original page

    from the help panel, press Enter.


    We provide two samples in this section.'
