  md: 'Tip: The meaning of ELEAF and NDEL:


    +   - ELEAF: Number of pseudo empty index leaf pages

    (NUM_EMPTY_LEAFS)


    A pseudo empty index leaf page is a page on which all of the record identifiers
    (RIDs) are marked as deleted, but they have not been physically removed.


    +   - NDEL: Number of pseudo deleted RIDs (NUMRIDS_DELETED)


    A pseudo deleted RID is a RID that is marked deleted. This statistic reports pseudo
    deleted RIDs on leaf pages that are not pseudo empty. It does not include RIDs
    marked as deleted on leaf pages where all of the RIDs are marked deleted.


    We use the commands shown in Example 6-38 to physically remove the leaf pages
    occupied by pseudo delete.


    Example 6-38 REORG INDEXES AND REORGCHK to update statistics


    ```

    db2inst1mens:> db2 "reorg indexes all for table item allow write access

    cleanup only on all dbpartitionumns"

    DB200001 The REORG command completed successfully.

    db2inst1mens:> db2 reorgchk update statistics on table db2inst1.item

    ```


