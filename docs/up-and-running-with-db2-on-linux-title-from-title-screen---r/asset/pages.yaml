    4.2.3, “Migrating instances and databases” on page 178.


    Example 4-15 migrating the tools catalog database in our lab.


    Example 4-15 db2dtbmgr


    ```

    dfpus1@gemini:> db2dtbmgr -d tools2db -s cc

    Tools catalog database migrated successfully to the current level

    ```


    # Tools catalog creation


    If you do not have a tools catalog yet, you can create a new one now. You can
    use an existing database or create a new one. This database must be local.


    The syntax to create a new database is:


    db2 “create tools catalog <catalog_name> create new database <database_name>


    in the previous command, catalog_name is used to identify the DB2 Tools catalog,
    and database_name is the new database.


    Example 4-16 shows how to create a tools catalog database.


    Example 4-16 Tools catalog tables creation in a new database


    ```

    dfpus1@gemini:> db2 “create tools catalog cc create new database toolsdb

    DB8200001 The CREATE TOOLS CATALOG command completed successfully.

    ```


    # 4.2.7 Migrating DB2 clients


    After the DB2 server is migrated, we recommend that you migrate the DB2 clients.


    # Considerations


    Mixing the server and client version will reduce the capability of using DB2 server
    functionality.


    Table 4-3 on page 185 shows DB2 9.5 connectivity support.'
