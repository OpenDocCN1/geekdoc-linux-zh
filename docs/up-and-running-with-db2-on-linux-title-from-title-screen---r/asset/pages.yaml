  md: '# 3.6.2 Database manager configuration parameters


    The database manager configuration (DBM cfg) parameters are stored in a file named
    db2system in $INHOME/sqlib/. To modify these parameters, use the graphical interface,
    Control Center, or DB2 command line interface.


    # Important DBM cfg parameters


    Here are the important DBM cfg parameters:


    +   - DFTDBPATH

    By default, this parameter is set to $INHOME. We recommend it to your desired
    path. $INHOME is typically on an NFS file system in a partitioned environment,
    but DB2 does not support NFS for the database path.


    +   - DFT_MONSWITCHES

    Set all monitor switches to ON to let DB2 gather statistical data. Use the snapshot
    command to show details about the behavior of DB2.


    +   - DIAGLEVEL

    For problem determination, set DIAGLEVEL to 4. DB2 will write all errors, warnings,
    and informational messages to the db2diag.log into the path defined by DIAGPATH.
    The default is 3. Note that log level 4 can have severe performance impacts.


    +   - MON_HEAP_SZ (which can be set to AUTOMATIC)

    The memory required for maintaining the private views of the database system monitor
    data is allocated by the MON_HEAP_SZ configuration parameter. The amount of memory
    required for monitoring activity widely depending on the number of monitoring
    applications and event monitors, the switches set, and the level of database activity.


    +   - SHEATHRES

    For private sorts, this parameter is an instance-wide soft limit on memory that
    can be consumed by private sorts at any given time. For shared sorts, this parameter
    is a database-wide hard limit on amount of memory consumed by shared sorts at
    any given time. By reaching this limit, no more shared sorts are allowed.


    +   - NUM_POOLAGENTS (which can be set to AUTOMATIC)

    For a Decision Support System (DSS) environment with which applications connect
    concurrently, set this value small. For Online Transaction Processing (OLTP) with
    many concurrent connected'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'applications, set this value larger to prevent creating extra db2agents, which
    is time-consuming.


    +   **INTRA_PARALLEL**


    For an OLTP environment, set this value to NO, because transaction throughput
    is more important than parallel work. OLTP queries run, update, or insert only
    one or a few rows, and therefore it does not make sense to split this work over
    more processes.


    In a DSS environment, typically, most queries join many tables at one time. We
    recommend that you set this value to YES so that DB2 can split the work over many
    processes.


    +   **MAX_QUERYDEGREE**


    Because parallelism in an OLTP system is undesirable, set this value to 1. For
    DSS, set this value to the number of CPUs of the database server to prevent users
    from setting an incorrect degree in their program, which can slow down DB2 activities.
    Note that in a static package, if the query is set at the bind time, the max_querydegree
    parameter is overridden by the query degree setting.


    +   **INSTANCE_MEMORY (which can be set to AUTOMATIC)**


    If this variable is set to AUTOMATIC, it is calculated at the start of the instance.
    Setting it to a value allows you to define the memory that is used by the instance.


    +   **JAVA_HEAP_SZ**


    This value defines the heap size, which is used for Java user defined functions
    (UDFs) and stored procedures.


    +   **SVCNAME**


    SVCNAME defines the TCP/IP port number or name that is used by the instance. If
    you use a port name, you must define it in /etc/services.


    > Note: For a configuration and detailed description of all of the database manager
    configuration parameters, refer to the Information Center:

    http://publip.boulder.ibm/infocenter/db2luw/vr5/index.jsp?topic=com.ibmdb2.luw.admin.config/doc/c0004555.html


    # Monitor and update the DBM configuration


    You can configure the settings of a DB2 instance either through the Control Center
    or on the DB2 Command line.'
