  md: '# Perl DB2


    You can create DB2 applications using Perl by using the DBD::DB2 driver with the
    Perl Database Interface (DBI) Module. Both of these components are freely available
    on the Internet. Currently, DB2 supports the following versions:


    +   - Perl 5.8 or later

    - DBI 1.41 or later


    Perl is an ideal language to use with DB2:


    +   - It is an interpreted language and has a DBI Module that uses dynamic SQL,
    which is ideal for creating and revising prototypes of DB2 applications.

    - The Perl DBI module uses an interface that is quite similar to the call level
    interface (CLI) and Java Database Connectivity (JDBC) interface, which makes it
    easy for you to port your Perl prototypes to CLI and JDBC.

    - Perl offers powerful functions for formatting text and handling strings which
    allow you to generate reports very quickly.


    # Setting up a Perl application development environment


    In order to set up a Perl development environment for DB2 on Linux, you must install
    and configure the following components on your workstation:


    +   - DB2 client (or server)

    - Perl 5.8 or later

    - DBI 1.41 or later

    - DBD::DB2 driver


    Here is the installation procedure:


    +   1. Install DB2 on your workstation. Refer to Chapter 2, "Installation" on
    page 25 for the instructions to install DB2 on Linux.

    2. Install Perl 5. Perl is typically provided by the Linux distributions, but
    you can download it from:

    http://www.cpan.org/

    3. Build, test, and install the DBI module. DBI is an open standard programming
    interface (API) that provides database access for client applications that are
    written in Perl.


    Usually, the Perl DBI module is shipped with your Linux distribution. If you want
    to install it, you can download it from the CPAN Web site:


    ```

    http://www.cpan.org/modules/by-category/07_Database_Interfaces/DBI/

    ```


    Refer to the readme file on this Web site for installation instructions.'
  merge: -1
  pgno: 456
- img_proc: true
  md: '4. Build, test and install the DBD::DB2 driver.


    The DBD::DB2 driver works with DBI and a DB2 client to access databases.

    The latest DBD Perl DBI driver can be downloaded from:


    ```

    http://www.ibm.com/software/data/db2/perl/

    ```


    At the time of writing, the latest available driver was DBD::DB2-1.1:


    +   a. Ensure that the C compiler is installed, which is needed for compiling
    the Perl module. In order to compile the module, you need the DB2 client installed
    on your system.


    +   b. Before installing the DBD::DB2 driver, enable the DB2 environment if it
    has not already been enabled for your user in .profile:


    +   `db2inst/sqlib/db2profile`


    +   c. Untar DBD-DB2-1.1 by entering the following command:

    tar xvzf DBD-DB2-1.1.tar.gz


    +   d. In the DBD-DB2-1.1 directory, run the following commands to build and install
    the DBD::DB2 driver:


    ```

    perl Makefile.PL

    make

    make test

    ```


    The command descriptions:


    +   * The **make** command builds the software.

    * The **make test** command executes self-tests.


    +   e. Now, log as root user and run the following command from the same directory:

    make install


    The **make install** command installs the DBI.


    +   5. Enable the DBI module.


    To load the Perl DBI module, you must include the following line in your Perl
    program:


    ```

    use DBI;

    ```


    The DBI module automatically loads the DBD::DB2 driver when you create a database
    handle using the DBI->connect statement using the following syntax:


    ```

    my $dbhandle = DBI->connect(''dbi:db2:dbalias'', $userID, $password);

    ```


    In the previous statement:


    +   **$dbhandle** represents the database handle returned by the connect statement.'
