    # 3.6.4 DB2 registry and environment variables


    All configuration settings in DB2 are stored as environment variables or registry
    variables. On UNIX-based systems, all environment variables, such as DB2INSTANCE,
    DB2NODE, DB2PATH, and DB2INSTPROF, are set by using the export command and are
    also usual in the file $dbprofile located in $INHOME/sqlib/


    Registry variables are set through the db2set command and require a DB2 restart.
    If a registry variable requires a Boolean argument, the values YES, 1, and ON
    are all equivalent and the values NO, 0, and OFF are also equivalent. To set registry
    values for an instance level profile, issue:


    ```

    db2 set -i <instance_name> <command>

    ```


    To set registry values for a global level profile, issue:


    ```

    db2 set -g <command>

    ```


    You can use the Configuration Assistant (db2ca) or the db2set command to configure
    configuration parameters and registry variables. When updating the registry, changes
    do not affect the currently running DB2 applications or users. Applications that
    are started after the update has happened use the new values.


    # Important registry variables


    Here is a list of important registry variables:


    +   **DB2_DISABLE_FLUSH_LOG** Default=OFF


    When an online backup has completed, the last active log file is truncated, closed,
    and made available to be archived, which ensures that your online backup has a
    complete set of archived logs available for recovery.


    +   **DB2DBDFT** Default=null


    This registry variable specifies the database alias to be used for implicit connects.
    If any application has no database connection but contains an SQL statement, it
    will connect to the database specified in DB2DBDFT.'
  merge: -1
