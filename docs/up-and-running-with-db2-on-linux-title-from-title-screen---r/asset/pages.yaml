    # 2.2.3 Storage planning


    Both DB2 and data to be stored in the database require disk space. DB2 uses both
    raw and file systems. It also requires log space. In this section, we discuss
    storage planning for DB2 data server.


    # File systems compared to raw devices


    The DB2 program, the data to be stored in the databases, and the DB2 logs need
    disk space. This can be achieved with either raw devices or file systems. In this
    section, we discuss storage planning for DB2 data servers.


    # File systems


    A popular method for configuring disk space for DB2 on Linux is to use separate
    file systems to run and run DB2. File systems can be used by DB2 as either system-managed
    storage (SMS) or as database-managed storage (DMS). File systems have many benefits.
    File systems can be distributed across a network and network-oriented authentication
    and replication capabilities, which make them essential for a partitioned database
    system.


    The operating system, by default, caches file data that is read from and written
    to disk. This behavior of caching data at the file level is reflected in the FILE
    SYSTEM CACH clause of the CREATE TABLE statement. Because the database manages
    its own data caching using buffer pools, the caching at the file level is not
    needed if the size of the buffer pool is tuned appropriately. In certain cases,
    caching at the file level and in the buffer pools causes performance degradation
    of the extra CPU cycles required for the double caching. To avoid this doubling,
    most file systems have a feature that disables caching at the file level. This
    feature is generically referred to as non-buffered I/O. On Linux, this feature
    is commonly known as Direct I/O (or DIO). The database manager supports this feature
    with the NO FILE SYSTEM caching table class. When this is set, the database manager
    automatically takes advantage of CIO on file systems where this feature exists.
    This feature might help to reduce the memory requirements of the file cache, thus
    making more memory available for other users.


    Prior to Version 9.5, the keyword FILE SYSTEM CACHING was implied if neither FILE
    SYSTEM CACHING nor FILE SYSTEM CACHING was specified. With Version 9.5, if neither
    keyword is specified, the default, NO FILE SYSTEM CACHING, is used. This change
    affects newly created table spaces. Existing table spaces that were created prior
    to Version 9.5 are not affected.'
