- img_proc: true
  md: '# 7.5.1 db2diag


    The db2diag.log file contains information about the DB2 system it runs. You will
    need to view this log periodically. You can use the db2diag analysis to filter
    and format the db2diag.log file. As an alternative to using db2diag, you can use
    a text editor to view the diagnostic log file on the machine where you suspect
    a problem has occurred. The most recent events that were recorded are at the end
    of the file.


    > Note: The administration and diagnostic logs grow continuously. When they get
    too large, back them up and erase the files. A new set of files is generated automatically
    the next time that they are required by the system.


    Here, we illustrate examples of using db2diag with option:


    +   Run the db2diag command without option:

    `db2inst1@ms:~db2diag`


    If you use the db2diag command without any parameter, the tool processes the db2diag.log
    file from the current directory and prints it to the display. If the file is not
    found in the current directory, the directory was set by the DIAGPATH variable
    is searched.


    +   Observe the db2diag.log file during run time in console mode:

    To view the growth of the db2diag.log file, use:

    `db2diag -f`


    This command displays all of the records that were written to the db2diag.log
    file up to now, and the display continues to show records until you press Ctrl+C
    to stop it.


    +   View logs within a certain interval:

    To display all of the messages that were logged after the timestamp 2008-02-14-10.00
    inclusively, enter this command:

    `db2diag -t 2008-02-14-10.00`


    Put all entries between 2008-02-14-12.00.30 and 2008-02-14 at 3 PM to an output
    file called db2diag_082014noon.log, enter:

    `db2diag -t 2008-02-14-12.00.30:2008-02-14-15 -o db2diag_082014.log`


    The format for the date and time is YYYY-MM-DD-hh.mm.ss.nnnnnn; however, you do
    not need to use the full timestamp.


    To display the entries of the last three days, enter:

    `db2diag -H 3d`'
