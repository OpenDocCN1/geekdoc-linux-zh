    # 7.4 Log files for troubleshooting


    This section discusses DB2 and operating system log files, which might provide
    more detailed information to help you find a problem or to further determine the
    root cause of a problem. Afterwards, you can take corrective actions based on
    the collected information.


    # 7.4.1 DB2 administration notification log


    The DB2 notification log contains user-friendly and national language-enabled
    messages that can help database administrators to obtain more information associated
    to specific issues, for example, information:


    +   * Which is supplemental to an SQLCODE

    * From Health Monitor for health indicators

    * From task executions

    * From the applications were written by the application developers


    This information can be very beneficial for the database administrators for resolving
    database or system problems quickly and easily.


    For the Linux platform, the notify log is a text file located in the directory
    specified by the database manager configuration parameter DIAGPATH, which is the
    same directory where db2diag.log resides. The name for the notify log is <instance
    owner>. In the example, /db2home/db2inst1/sqllib/db2dump/db2inst1, the instance
    owner is db2inst1, and DIAGPATH is /db2home/db2inst1/sqllib/db2dump.


    > 2 considering DIAGPATH to a directory on another file than the instance home''s
    system. Then, the "file system full" problem of the diagnostic directory will
    not impact your instance home.'
