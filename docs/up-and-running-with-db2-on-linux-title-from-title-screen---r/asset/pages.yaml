  md: "Note: You can read a detailed introduction to the CLI functions in the Information\
    \ Center by selecting Database application development -> Database Applications\
    \ -> CLI. You can obtain detailed reference information by selecting Reference\
    \ -> APIs -> CLI. The available manuals are Call Level Interface Guide and Reference,\
    \ Volume 1, SC23-5844, and Call Level Interface Guide and Reference, Volume 2,\
    \ SC23-5845.\n\n# Embedded SQL\n\nEmbedded SQL allows you to put SQL statements\
    \ directly into the C/C++ code. You can embed them into the code. Embedding SQL\
    \ requires a precomposition step of the program before the program can be compiled\
    \ with the native C/C++ compiler.\n\nThe precompile step produces a bind file\
    \ (package) and a program source file. The package has the suffix .bind. The program\
    \ file can then be compiled by C/C++ compiler. The package contains the access\
    \ plan for the embedded SQL statements. This package is dedicated to this particular\
    \ compiled file. If you compile the program file again, you will get a new bind\
    \ file. Before you can run it, you need to bind the related packages to the database.\n\
    \nThe advantage of using the package is that the access plans of the SQL statements\
    \ have already been generated during the precomposition step. The access plans\
    \ of the SQL statements do not need to be generated at run time anymore. For complex\
    \ SQL statements, this feature can save a considerable amount of execution time.\
    \ Packages also allow you to grant permissions to the users or applications at\
    \ the package level without the need to grant access to individual tables.\n\n\
    In order to run embedded SQL programs, you need at a DB2 client installed on the\
    \ local system. Example 8-11 shows a simple C program using embedded SQL. It reads\
    \ records from the EMPLOYEE table and uses a cursor to cycle through the result\
    \ set. Before running the example, you will have to replace the <password>.\n\n\
    Example 8-11 Embedded SQL program: test_emb.sqc\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <string.h>\n\nint main(int argc, char *argv[])\n{\n   \
    \ EXEC SQL BEGIN DECLARE SECTION;\n```"
