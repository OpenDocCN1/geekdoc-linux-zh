  md: "# 7.6.3 iostat\n\nThe **iostat** command for reporting Central Processing Unit\
    \ (CPU) statistics and monitoring system I/O device *statistics* for devices and\
    \ partitions. You can use the report that is generated by the **iostat** command\
    \ to assist you in changing the system configuration to better balance the I/O\
    \ load over physical disks.\n\n> Note: The **iostat** command is contained in\
    \ the sysstat package (is also included in this package). Before you can use these\
    \ commands, you need to install this package.\n\nThe first report that is generated\
