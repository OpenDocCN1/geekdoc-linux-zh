  md: '# 5


    # IBM Data Studio


    IBM Data Studio is a comprehensive management solution. It empowers you to effectively
    design, develop, deploy, and manage data, databases, and database applications
    throughout the data management life cycle by utilizing consistent and integrated
    user interface.


    In this chapter, we briefly introduce IBM Data Studio. We cover the following
    topics:


    +   - Introduction

    - A short introduction about Data Studio.

    - Installation


    This section describes the installation steps for Data Studio. We briefly discuss
    how to migrate projects from the Developer Workbench into Data Studio.


    +   - Features and functions


    In this section, we briefly introduce the features and functions of Data Studio.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 5.1 Introduction


    Enterprises of all sizes and across all industries share common drivers of the
    investments that they are making in the management of their business data. The
    complexity and cost of supporting and managing data from the initial design of
    the data structure throughout all phases poorly unsettling the data to continue
    to increase. The demand to deliver an increasing amount of data more rapidly and
    beyond the business keeps growing. The expensive human resources, such as developers,
    architects, and administrators, work in silos that cause issues, such as data
    models that are not shared across silos; Web services are difficult to develop
    and deploy; complex environments use different tools for each data server; the
    life cycle of data is poorly understood and challenging to manage; and so on.


    The innovation will be restrained when silos of information are disconnected,
    inaccurate, complete, and out of context. New approaches are needed for application
    delivery and support in order to reduce the time and cost of empowering a broader
    audience with more powerful data-driven applications.


    IBM Data Studio, a foundation for innovation and a comprehensive data management
    solution, is a family of integrated tools for database development and administration.
    It empowers you to effectively design, develop, deploy, and manage your data,
    databases, and database applications throughout the data life cycle by utilizing
    a consistent and integrated user interface.


    Figure 5-1 on page 199 illustrates the life cycle of data management. IBM Data
    Studio provides the capability for architects, developers, and administrators
    to:


    +   Increase productivity for all roles throughout the data life cycle:

    - Cut development time up to 50% with an integrated data management environment.

    - Promote collaboration across roles to optimize data server and application performance.


    +   Simplify and speed up the development of new skills:

    - Learn once, and use with all supported data servers.

    - Extend an existing version of Eclipse plug-ins to customize the environment
    for each team member.


    +   Accelerate data as a service for service-oriented architecture (SOA):

    - Develop and publish data as a Web service without programming.

    - Info 2.0 Ready support for Web 2.0 protocols and format.'
  merge: -1
