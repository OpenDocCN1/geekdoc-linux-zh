  md: '# Example 8-14@puget:> compile a UDF


    ```

    db2inst@puget:> SQL=~/home/db2inst/sqlib tolower.c -D_REENTRANT

    db2inst@puget:> cc -m32 -fpic -i$SQL/include -c tolower.c

    db2inst@puget:> cc -m32 -fpic-shared -o tolower tolower.o

    d-W1,-rpart,RLL -L$SQL/lib32 -idb2 -lpthread

    db2inst@puget:> cp tolower $SQL/function

    ```


    The resulting executable tolower was copied to the directory <instancehome>/lib/function.
    From there, the database manager will access the UDF after the function is registered
    by the CREATE FUNCTION command as shown in Example 8-15.


    # Example 8-15 Activate the UDF


    ```

    CREATE FUNCTION to_lower(VARCHAR(40)) RETURNS VARCHAR(40)

    FENCED

    EXTERNAL NAME ''tolowerito_lower''

    NOT VARIANT NO SQL PARAMETER STYLE DB2SQL LANGUAGE C

    NO EXTERNAL ACTION;

    ```


    After that, the UDF can be used as demonstrated in Example 8-16.


    # Example 8-16 Execute to_lower(''AAA'')


    ```

    db2inst@puget:> db2 "select to_lower(''AAA'') from sysbm.sysdummy1"


    1

    aaa

    n1 record(s) selected.

    ```


    If you want to drop the function, you can run the command:

    db2 "DROP FUNCTION to_lower(VARCHAR(40))"


    UDFs can be run in fenced or not fenced mode. Fenced routines run as a separate
    process. They have some communication overhead involved. Not fenced routines run
    as part of the database server. They are a little bit more efficient than fenced
    routines. However, if a not fenced routine crashes, it will bring down the database
    server, too.


    Therefore, we suggest that you develop routines in fenced mode. You can consider
    running well-tested routines on production systems as not fenced routines if performance
    is important.'
