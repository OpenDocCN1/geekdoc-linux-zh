  ![](img/index-59_9.png)\n\n## 总结\n- Linux 作为取证工具提供了更强的控制力、灵活性强大。\n- Linux 拥有许多简单的实用程序，可以使嫌疑磁盘和驱动器的镜像制作及基础分析变得更容易。\n\
