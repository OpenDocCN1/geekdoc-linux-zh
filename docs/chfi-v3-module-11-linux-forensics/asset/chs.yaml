  # Penguin Sleuth\n\n~- The `Penguin Sleuth Kit` 是一个基于 `KNOPPIX` 的可启动 Linux 发行版。\n\
  \n~ 它包含了许多非常实用的工具集，包括 `The Coroner’s Tool Kit` (`TCT`)、`Autopsy` 和 `The Sleuth Kit`，以及渗透测试和病毒扫描工具。\n\
  \n~ 它提供了 GUI 环境，以及良好的、传统的命令行环境，适用于从新手到经验丰富的各种用户。\n\n版权 © by EC-Council\n\nEC-Council\n\
  \n版权所有。严禁复制。\n\n## Penguin Sleuth Kit 包含工具\n\n~ `Sleuth Kit` - 命令行取证工具\n~ `Autopsy`\
  \ - `Sleuth Kit` 的一部分\n~ `Foremost` - 命令行数据刻恢复工具\n~ `Glimpse` - 命令行数据索引和搜索工具\n~\
  \ `Wipe` - 用于安全擦除硬盘和文件的命令行实用\n~ `Etherape` - 可视化网络监控器\n~ `Fenris` - 多功能追踪器\n~ `Honeyd`\
  \ - 命令行蜜罐程序程序\n~ `Snort` - 命令行网络入侵检测工具\n~ `Dsniff` - 命令行网络审计和渗透测试工具\n~ `John The\
  \ Ripper` - 命令行密码破解工具\n~ `Nikto` - 服务器扫描器\n\n版权 © by EC-Council\n\nEC-Council\n\n\
  版权所有。严禁复制。\n\n### Penguin Sleuth Kit 包含工具（续）\n\n~ `Nbtscan` - 扫描开放的 `NETBIOS` 名称服务器的命令行工具\n\
  ~ `Xprobe` - 命令行远程操作系统指纹识别工具\n~ `Ngrep` - 命令行网络 grep 功能\n~ `Nemesis` - 命令行网络包注入器\n\
  ~ `Fragroute` - 命令行网络入侵测试工具\n~ `Fping` - 命令行多主机 ping 实用\n~ `TCPtraceroute` - 命令行追踪\
  \ `TCP` 包\n~ `TCPReplay` - 重放 `TCP` 倾储的命令行实用\n~ `Nessus` - 图形化安全扫描器\n~ `Ethereal`\
  \ - 图形化网络分析器\n~ `Netcat` - 在网络上读写的命令行工具\n~ `TCPdump` - 导出网络流量的命令行工具\n\n版权 © by EC-Council\n\
  \nEC-Council\n\n版权所有。严禁复制。![](img/index-47_1.png)\n\n![](img/index-47_2.png)\n\n\
  ![](img/index-47_3.png)\n\n![](img/index-47_4.png)\n\n![](img/index-47_5.png)\n\n\
  ![](img/index-47_6.png)\n\n### Penguin Sleuth Kit 包含工具（续）\n\n~ `Hping2` - 命令行数据包组装/分析器\n\
  ~ `Ettercap` - 用于以太网的命令行嗅探器/拦截器/日志器\n~ `Openssh` - 安全远程连接实用\n~ `Kismet` - 图形化无线网络嗅探器\n\
  ~ `AirSnort` - 图形化无线网络入侵工具\n~ `GPG` - 加密实用\n~ `OpenSSL` - 安全远程连接实用\n~ `Lsof` - 列出所有打开文件的命令行实用\n\
  ~ `Hunt` - 命令行 `TCP / IP` 漏洞扫描器\n~ `ARPwatch` - 命令行以太网监控器\n~ `Dig` - 查询域名服务器的命令行工具\n\
  ~ `Chkrootkit` - 寻找 rootkit 迹象\n\n版权 © by EC-Council\n\nEC-Council\n\n版权所有。严禁复制。![](img/index-48_1.png)\n\
