  ![](img/index-25_14720.png)\n\n# Autopsy 中的证据分析技术\n\n## 1. 文件列表\n- 分析文件和目录，包括已删除文件以及基于\
  \ Unicode 命名的文件。\n\n## 2. 文件内容\n- 可以以原始十六进制格式或 `ASCII` 字符串查看文件内容，并可以提取字符串。\n\n##\
  \ 3. 哈希数据库\n- 在哈希数据库中查找未知文件，以快速识别其为安全或恶意文件。\n\n## 4. 文件类型排序\n- 根据文件的内部签名对文件进行排序，以识别已知类型的文件。\n\
  \n## 5. 文件活动时间线\n- 创建包含已分配文件和未分配文件的修改（Modified）、访问（Access）和更改（Change）时间的时间线。\n\n\
  ## 6. 关键词搜索\n- 可以 `ASCII` 字符串和 `grep` 正则表达式对文件系统镜像进行关键词搜索。\n\n## 7. 元数据分析\n- 允许查看文件系统中任何元数据的细节。\n\
  \n## 8. 数据单元分析\n- 允许你以包括 `ASCII`、十六进制转（hexdump）和字符串在内的多种格式查看任何数据单元的内容。\n\n## 9.\
  \ 镜像详情\n- 你可以查看文件系统的细节，包括磁盘布局活动时间，以便恢复数据。\n\nCopyright © EC-Council\nEC-Council\n\
