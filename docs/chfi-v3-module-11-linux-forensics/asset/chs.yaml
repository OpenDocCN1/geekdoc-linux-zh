  ![](img/index-4_11.png)\n\n### 将 Linux 作为取证工具\n#### 为什么要用 Linux 进行取证？\n* **更大的控制力：**\n\
  \    * 将每个设备视为一个文件。\n    * 不需要单独的写保护器。\n* **灵活性：**\n    * 可以从 CD 启动。\n    * 可以识别多种文件系统。\n\
  * **强大：**\n    * 像 THE FARMER'S BOOT CD 和 Sleuth 等发行版让 Linux 本身成为了一个取证工具。\n\n![](img/index-5_1.png)\n\
  ![](img/index-5_2.png)\n![](img/index-5_3.png)\n![](img/index-5_4.jpg)\n![](img/index-5_5.png)\n\
  ![](img/index-5_6.png)\n![](img/index-5_7.png)\n![](img/index-5_8.png)\n![](img/index-5_9.png)\n\
  ![](img/index-5_10.png)\n![](img/index-5_11.png)\n\n### 识别 Linux 分区\n* 如果使用标准的 IDE\
  \ 磁盘，它将被标识为 `hdx`。\n* 如果磁盘作为主设备（master）连接到主 IDE 控制器，则 `x` 被替换为 `a`；如果作为从设备（slave）连接到主\
  \ IDE 控制器，则替换为 `b`。\n* 同理，连接到次级 IDE 控制器作为主设备和从设备的 IDE 磁盘将分别标识为 `hdc` 和 `hdd`。\n\n\
  ![](img/index-6_1.png)\n![](img/index-6_2.png)\n![](img/index-6_3.png)\n![](img/index-6_4.png)\n\
  ![](img/index-6_5.png)\n![](img/index-6_6.png)\n\n### Linux 文件系统\n在大多数 Linux 发行版中，基本的目录结构组织如下。\n\
  \n![](img/index-7_1.png)\n![](img/index-7_2.png)\n![](img/index-7_3.png)\n![](img/index-7_4.png)\n\
  ![](img/index-7_5.png)\n![](img/index-7_6.png)\n\n### 文件系统描述\n![](img/index-8_1.png)\n\
  ![](img/index-8_2.png)\n![](img/index-8_3.png)\n![](img/index-8_4.png)\n![](img/index-8_5.png)\n\
  ![](img/index-8_6.png)\n\n### 挂载 命令\n* 软盘、CD、硬盘分区和其他存储设备必须挂载到系统中的某个现有目录上才能访问。\n\
  * 这种连接过程被称为“挂载”（mounting），设备挂载的目录称为“挂载点”（mount point）。\n* 当你完成并想要移除软盘、CD 或其他设备时，必须将其卸载（detach）。\n\
  * 为了进行挂载，你必须告诉 `mount` 命令哪个是设备，哪个是挂载点。例如：\n  `mount /dev/sdb /mnt`\n* 卸载时，你需要卸载设备。例如：\n\
  \  `umount /mnt`\n\n![](img/index-9_1.png)\n![](img/index-9_2.png)\n![](img/index-9_3.png)\n\
  ![](img/index-9_4.png)\n![](img/index-9_5.png)\n![](img/index-9_6.png)\n\n### Linux\
  \ 启动序列\n* Linux 启动序列的第一步是加载内核。内核镜像通常位于 `/boot` 目录。\n* 启动加载程序的详情可以通过 LILO 或 GRUB\
  \ 从 `/etc/lilo.conf` 或 `/etc/grub.conf` 获取。\n* 下一步是初始化，运行级别和启动脚本。\n* 控制初始化的文件是 `/sbin/init`。\n\
  \n![](img/index-10_1.png)\n![](img/index-10_2.png)\n![](img/index-10_3.png)\n![](img/index-10_4.png)\n\
  ![](img/index-10_5.png)\n![](img/index-10_6.png)\n\n### Linux 取证\n* Linux 有许多简单的工具用于镜像和基础分析：\n\
  \    * `dd`：从输入文件或设备复制数据到输出文件或设备的命令。\n    * `sfdisk` 和 `fdisk`：确定磁盘结构的命令。\n    *\
  \ `grep`：在文件中搜索表达式或模式的命令。\n    * `loop` 设备允许你在不将镜像写入磁盘的情况下挂载镜像。\n    * `md5sum`\
  \ 和 `sha1sum`：创建并存储文件或文件列表 MD5 或 SHA 哈希值的命令。\n    * `file`：读取文件头信息以确定其类型、名称或扩展名的命令。\n\
  \    * `xxd`：命令行十六进制显示工具。\n    * `ghex` 和 `khexedit`：Gnome 和 KDE（X 窗口界面）十六进制编辑器。\n\
  \n![](img/index-11_1.png)\n![](img/index-11_2.jpg)\n![](img/index-11_3.jpg)\n![](img/index-11_4.png)\n\
  ![](img/index-11_5.jpg)\n![](img/index-11_6.jpg)\n![](img/index-11_7.png)\n![](img/index-11_8.jpg)\n\
  ![](img/index-11_9.jpg)\n![](img/index-11_10.png)\n![](img/index-11_11.jpg)\n![](img/index-11_12.png)\n\
  ![](img/index-11_13.jpg)\n![](img/index-11_14.png)\n![](img/index-11_15.jpg)\n\n\
  ### 案例示例\n**Rebecca** 对 Good 公司提起了诉讼，指控其的一位高级总监 **Peter Samson** 先生对其进行性骚扰。她提交了一个软盘作为\
  \ Samson 先生追求行为的证据。她还发现 Samson 先生曾通过标记为合法工作的软盘向她发送露骨内容。\n\n你作为一名取证调查员，被邀请代表 Good\
  \ 公司调查此案。你认为他应该如何处理这些证据？\n\n![](img/index-12_1.jpg)\n![](img/index-12_2.jpg)\n![](img/index-12_3.jpg)\n\
  \n### 案件处理步骤\n1. 记录所有过程\n\n\n\n\n\n## 开始创建一个可以进行所有取证活动的目录\n\n通过创建一个可以进行所有取证活动的目录：\n\
  \n- `/mkdir evidence`\n\n- 建议为所有物理受体磁盘分析创建一个特殊的挂载点。\n- `mkdir /mnt/investigation`\n\
  \n## 2. 确定磁盘结构\n\n- 使用简单的位流传输命令 `dd` 创建磁盘镜像。\n```bash\ndd if=/dev/fd0 of=image.suspectdisk\n\
  ```\n- 使用 `chmod` 将镜像的读写权限更改为只读。\n```bash\nchmod 444 image.suspectdisk\n```\n\n\
  ## 3. 挂载恢复的镜像工作副本并分析内容：\n\n- `mount -t vfat -o ro,noexec /dev/fd0 /mnt/investigations`\n\
  - 另一种选项是使用循环接口挂载镜像文件内的点，而不是将内容挂载到另一个位置。\n```bash\nmount -t vfat -o ro,noexec,loop\
  \ image.suspectdisk /mnt/investigations\n```\n\n## 4. 通过检查文件哈希值验证镜像文件中数据的完整性：\n\n\
  - `md5sum evidence/md5.image.suspectfile`\n- `sha1sum -c evidence/SHA.image.suspectfile`\n\
  \n## 5. 使用 `ls` 命令查看磁盘内容：\n\n- 使用 `ls -laR` 递归列出此目录下包括隐藏文件在的所有文件。\n\n## 6. 列出所有文件及其访问时间：\n\
  \n- `ls -laiRtu > evidence/suspectfiles.list`\n\n## 7. 使用以下命令搜索可能的证据：\n\n- `grep\
  \ -i xxx suspectfiles.list`\n\n## 8. 列出未的文件扩展名和发生变化的文件：\n\n- `file changedfile`\n\
  - 可以 `strings`、`cat`、`more` 或 `less` 查看文件。\n\n## 9. 从文件列表中搜索某些关键词。\n\n- `cat evidence/suspectfiles.list\
  \ | grep blackmailword`\n- 搜索关键词的系统方法是创建一个关键词列表。\n  *例如*将其保存为：`/evidence/keywordlist.txt`\n\
  - 在文件中搜索关键词并将其保存到文件中。\n```bash\ngrep -aibf keywordlist.txt image.suspectdisk > results.txt\n\
  ```\n- 查看结果：\n- `cat results.txt`\n- 要分析每个偏移量的文件，请使用 `hexdump` 工具：\n```bash\nxxd\
  \ -s (offset) image.suspectdisk | less\n```\n\n# Linux 磁盘取证的挑战\n\n- Linux 无法识别扇数为奇数的硬盘上的最后一个扇区。\n\
  - 大多数 Linux 工具都很复杂，因为它们是在命令行中使用的。\n- 即使设备未挂载也可以进行写入。\n- 开源工具中的 Bug 可被用来质疑其取证用途的可信度。\n\
  - William Salusky 提供的取证与应急响应环境 (F.I.R.E) 提供了一套良好的工具。\n\n# Jason Smith 案件\n\n- Jason\
  \ Smith 先生被指控在其公司系统上囤积内容存疑的非法材料。\n- 你被要求检查嫌疑硬盘并挖掘证据。\n- 你认为应该如何进行证据的提取和保全？\n\n##\
  \ 案件的逐步处理方法\n\n1. 从硬盘制造商网站记录型号信息，以及大小和总扇区数。\n2. 使用 ext3 文件系统擦除并格式化镜像驱动器 (> size)。\n\
  3. 用零填充磁盘并确保内容匹配。\n```bash\ndd if=/dev/zero of=/dev/sda bs=4096 conv=noerror,sync\n\
  ```\n4. 对磁盘进行分区并重启。\n```bash\nfdisk /dev/sda\n```\n5. 使用 ext3 文件系统格式化。\n```bash\n\
  mkfs -t ext3 /dev/image.disk\n```\n6. 为镜像准备磁盘：\n   a. 挂载新准备的读写镜像磁盘。\n   ```bash\n\
  \   mount /dev/sda /mnt/image.disk\n   ```\n   b. 创建一个用于所有文档和分析的目录。\n   ```bash\n\
  \   mkdir mnt/image.disk/case_no\n   ```\n   c. 创建子目录存放证据镜像。\n   ```bash\n   mkdir\
  \ mnt/image.disk/case_no/evidence_no\n   ```\n   d. 在文本文件中记录调查详情，包括调查人员详情、案件背景细节和调查日期。\n\
  \   e. 记录磁盘介质详情，包括调查人员姓名和案号、媒体证据编号成像时间；计算机的品牌、型号和序列号；IP 和系统主机名；硬盘的品牌、型号和序列号；硬盘来源和调查范围。\n\
  7. 制作镜像。\n   a. 将原始证据驱动器和目标驱动器连接到镜像系统。\n   b. 验证所有跳线设置 – 主/从。\n   c. 通过检查 BIOS 设置，确保镜像系统仅从\
  \ CD 启动。\n   d. 使用 `dd` 制作镜像。\n   ```bash\n   dd if=/dev/hdx of=image/disk conv=noerror,sync\n\
  \   ```\n   这将允许 `dd` 尝试忽略任何错误 (`conv=noerror`) 并与原始数据同步 (`sync`)。\n8. 通过比较 `md5sum`\
  \ 检查准确性。\n9. 挂载磁盘并提取证据。\n10. 使用 `dd` 或十六进制查看工具 `xxd` 对镜像进行数据恢复。\n\n\n\n\n\n![](img/index-21_10.png)\n\
  ![](img/index-21_11.png)\n\n# 流行的 Linux 取证工具\n\n- `The Sleuth Kit` - 由 Brian Carrier\
  \ 编写，维护于 http://www.sleuthkit.org。\n- `Autopsy` – `sleuthkit` 的 HTML 前端。\n- `SMART`\
  \ 是由 ASR Data 开发的 Linux 版，是一种运行在 Linux 上的商业数据取证程序。\n- `THE FARMER'S BOOT CD` - 一种可启动的光盘，旨在以符合取证规范的方式快速预览数据。\n\
  - `Penguin Sleuth` - 基于 Knoppix 的带有取证色彩 Linux 发行版。\n- `Forensix`\n\n版权所有 © EC-Council\n\
