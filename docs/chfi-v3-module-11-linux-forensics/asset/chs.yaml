  # Autopsy\n\n- `The Autopsy Forensic Browser` 是 `The Sleuth Kit` 命令行数字调查分析工具的图形界面。它们结合起来可以分析\
  \ Windows 和 UNIX 磁盘及文件系统（`NTFS`、`FAT`、`UFS1/2`、`Ext2/3`）。\n- `The Sleuth Kit` 和\
  \ `Autopsy` 都是开源软件并运行在 UNIX 平台上。由于 `Autopsy` 基于 HTML，你可以从任何平台使用 HTML 浏览器连接到 `Autopsy`\
  \ 服务器。\n- `Autopsy` 提供了一个类似于“文件管理器”的界面，并显示有关删除数据和文件系统结构的详情。\n\n版权所有 © EC-Council\n\
