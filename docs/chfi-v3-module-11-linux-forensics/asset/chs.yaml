  \n![](img/index-48_5.png)\n\n![](img/index-48_6.png)\n\n# Forensix\n\n~- `Forensix`\
  \ (`4N6`) 项目的目标是允许对系统进行监控，以便在发生安全漏洞时，能够很容易将入侵追溯到源头并从中恢复。\n\n来源：`http://forensix.sourceforge.net/`\n\
  \n~ `Forensix` 执行内核级身份验证和目标系统，并将高定义审计跟踪流到已针对重构查询优化的后端数据库。\n\n### 功能：\n\n- 准确重现任何入侵事件。\n\
  - 确定访问了哪些特定数据。\n- 选择性撤销非法用户所做的修改。\n\n版权 © by EC-Council\n\nEC-Council\n\n版权所有。严禁复制。![](img/index-49_1.png)\n\
  \n![](img/index-49_2.png)\n\n![](img/index-49_3.png)\n\n![](img/index-49_4.png)\n\
  \n![](img/index_49_5.png)\n\n![](img/index-49_6.png)\n\n# Forensix 中的主要程序\n\n~ `p`:\
  \ 一种向文档中添加文件名的唯一程序。\n~ `Catalog`: 目录系统上的每个文件。\n~ `Hash`: 执行每个文件的 MD5 哈希。\n~ `Hashcmp`:\
  \ 比较连续运行的输出。\n~ `Md5`: 计算文件的 MD5。\n~ `Strsch`: 在文件中搜索字符串。\n~ `U`: 将 `ix` 转换为 `DOS`。\n\
  \n# Captain Nemo\n\n~- 被执法部门、法医调查人员和网络管理员广泛使用。Captain Nemo` 允许你从 Windows 访问任何 Linux\
  \ 硬盘，无需设置网络。\n\n~ 只需将 Linux 硬盘连接到你的机器，`Captain Nemo` 将允许你在 Windows 中挂载 Linux 分区。\n\
  \n~ 你可以读取、搜索并查看所有的 Linux 文件并将其复制到 Windows 硬盘。\n\n~ 支持 `ext2fs` 和 `ext3fs`。\n\n版权\
