  ### 文件系统层工具\n- `jcat`\n- `fsstat`\n- `jls`\n\n### 文件系统日志工具\n- `ffind`\n\n### 文件名层工具\n\
  - `mmls`\n- `fls`\n\n### 媒体管理工具\n- `img_stat`\n\n### 镜像文件工具\n- `icat`\n\n### 元数据层工具\n\
  - `mg_cat`\n- `ifind`\n\n### 磁盘工具\n- `ils`\n- `disk_sreset`\n- `istat`\n- `disk_stat`\n\
  \n### 数据单元层工具\n- `dcat`\n- `hfind`\n- `dls`\n- `mactime`\n- `dstat`\n- `sorter`\n\
  - `dcalc`\n- `sigfind`\n\n### 其他工具\n\n版权所有 © EC-Council\nEC-Council\n保留所有权利。严禁复制。![](img/index-24_1.png)\n\
