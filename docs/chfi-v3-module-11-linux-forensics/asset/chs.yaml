  ![](img/index-22_8.png)\n![](img/index-22_9.png)\n\n# The Sleuth Kit\n\n- `The Sleuth\
  \ Kit` 是一个命令行数字调查工具集。这些工具可以在 Linux、OS X、FreeBSD、OpenBSD 和 Solaris 上运行，并分析 `FAT`、`NTFS`、`UFS`、`EXT2FS`\
  \ 和 `EXT3FS`。\n- `The Autopsy Forensic Browser` 是 `The Sleuth Kit` 命令行工具的 HTML 图形界面。这使得系统调查变得更加快捷方便。\n\
  \n## Mac\n\n`macer` 是一个从挂载文件系统收集时间数据的工具。这些数据可以使用 `The Sleuth Kit` 中的工具来创建系统文件活动的时间线。\n\
