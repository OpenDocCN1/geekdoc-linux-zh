- pgno: 98
  md: '# The basics


    # Networking models


    In this article, we cover a lot of ground, from physical media to packets to MAC
    addresses and routed IP networks. If it seems difficult to understand how this
    all fits together, imagine how difficult it is to make the systems that enable
    all this to work. It''s very complicated, and there are many components that all
    have to work together if your network connection is going to work the way it should.


    To make networking software and hardware that works together easier to create,
    some clever people came together and created the Open Systems Interconnection
    model. The OSI specifies seven layers, each of which describes a set of related
    functions that are critical if the network is to work as expected. Each separate
    layer depends on the one below it to provide certain services, but it doesn''t
    need to know how any of the other layers are implemented, just how to interact
    with the lower layers. This means they can be created and tested separately, and
    you can have many different implementations of the different functions (for example,
    fibre optic or Ethernet for the physical layer), without having to rewrite any
    other components.


    In this article, we''ve covered the first three layers of the OSI model:


    +   > **The physical layer** This specifies how electrical signals can be transmitted
    across particular physical media.

    +   > **The data link layer** This specifies how hosts


    are physically identified on the network – that is, with MAC addresses.


    **The network layer** Specifies how packets are routed between networks and how
    logical addresses are assigned.


    The remaining four layers concern managing reliable connections between machines,
    and the presentation and utilisation of transmitted data at the application level.
    Networking topics that you might be familiar with that fall into these layers
    include: the TCP and UDP protocols in layer 4; file encoding such as UTF, ASCII,
    JPG and so on that are all found in layer 6; and things such as the HTTP (web),
    FTP (file transfer) and SMTP (mail transfer) protocols, which are all network
    applications in layer 7.


    network. To see these packets, install the tcpdump package using whichever package
    manager your Linux distribution provides. Once it''s installed, launch a terminal
    and first find out which device is currently providing your network connection.
    Assuming you''ve got only one active network connection on your computer, you
    can find this out by typing: `ip a | grep "state UP"`


    The `ip` command is used for showing information about your network connections
    – we''ll cover this in more detail a little later – while the grep command filters
    the result to see only those network connections which are ''up'' or active. The
    bit of information you''re interested in is near the beginning of the line, and
    probably reads eth0, wlan0 or em1, depending on your configuration.


    With this information, you can now run tcpdump to watch a network conversation
    take place. As root, run:


    `tcpdump -i wlan0`


    where wlan0 is the device you discovered above. Then, open a web browser and visit
    a site. When you switch back to the terminal, you''ll see the screen filling up
    with lines of text. Each line represents a packet that was sent between your computer
    and the web server in order to load the page, and each provides bits of information
    about it, including the time it was sent or received, which computers (or hosts)
    it was sent from and to, and much more.


    By passing the -w switch and a filename, you can save this output and the contents
    of the packets (not just the header information shown in the terminal) for later
    analysis by a graphical tool, such as Wireshark (see p102).


    This can be a very useful tool for diagnosing network problems. For instance,
    if you can''t get DHCP working properly, running a packet dump on the DHCP server
    will enable you to see whether it''s receiving requests for


    addresses, whether it''s responding, or whether packets are being blocked by a
    firewall, which will enable you to identify where the problem lies.


    # MAC addresses


    Now you know how many computers can share a single physical network, you might
    be wondering how computers can identify each other on the network – that is, how
    can you send information only to Bob''s computer, not Alice''s?


    In fact, the answer is that when computers are connected by the same bit of physical
    medium – for example, a copper cable – they see every packet sent to every other
    computer.


    > Nmap is a command line tool for scanning your network. Here, we''ve used Zenmap
    to interpret the results of a scan to display the topology of the network.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Understanding IP addresses


    IP addresses are a touch more complicated than suggested in the article’s main
    body. Although we usually write an IP address as four numbers, separated by periods,
    they are in fact a single 32-bit binary number. Each of the four numbers represents
    a group of eight bits (an octet) in the binary form of the address, for example:

    192.168.1.111000000.10101000.00000010.0000001

    This means that each of the four numbers in an IP address can range from 0 through
    to 255.

    The prefix that we talked about specifies how many bits in the binary representation
    belong to the network portion of the address, and can be thought of as another
    binary number overlaid on to the IP address, where a 1 represents a bit that belongs
    to the network portion of the address:

    11000000.10101000.00000010.00000001

    11111111.11111111.11111111.00000000

    In this case, in the IP address 192.168.1.1 the first three octets represent the
    network portion of the address, so hosts can only be assigned unique numbers from
    the last octet.

    This means that in the 192.168.1.0/24 network, there are only 255 unique addresses
    that can be given to hosts. In fact, there are only 253 unique addresses, because
    the first and last addresses in a range are reserved for special purposes. The
    first address is the network address, and is used not to specify a host on that
    network, but the network itself. This is why you’ll see 0/24 in the output of
    your ip route command. The last address is used for broadcast messages that address
    every host on the IP network.

    As another example, consider the network address 192.168.1.0/28, in this instance
    there are only 14 usable addresses, because the maximum value representable in
    four binary digits is 16 (2^4), and the first and last of these are reserved.


    The thing that stops them from reading it is that every network interface card
    (NIC – the thing that translates information from your computer in to a signal
    that can be broadcast across a physical medium, and decodes it again) has something
    called a MAC address.

    Every packet includes the MAC address of the recipient, and when a computer receives
    a packet, it inspects the address to see if it matches its own NIC’s address –
    if it does match, it performs further processing to extract the information contained;
    if it doesn’t, it discards the packet to save it from wasting processor cycles.

    You can see what your active NIC’s address is by using the ip command again:

    ip link show dev wlan0

    where wlan0 is the name of the device you discovered earlier. If you just type
    ip link show, you’ll see information on all the NICs attached to your computer.
    The MAC address is the 12-digit bit of information that comes after link/ether
    in the output. It will look something like: ea:34:43:81:02:7c. Of course, with
    a single piece of wire, you’re going to have a hard time connecting more than
    two computers. In order to connect many computers to the same physical network,
    a device known as a hub can be used. A hub has many pieces of Ethernet plugged
    in to it, and when it receives a packet on any of these interfaces, it retransmits
    the packet to all the other interfaces.

    Even with clever packet-switched networks, you can, however, experience problems
    with contention if too many computers share the same physical medium – that is
    to say, if different computers try to transmit information at the same time, the
    information being sent gets corrupted as a result, and effective communication
    breaks down. This is because computers don’t actually take it in turns to send
    packets, but instead send their information randomly and use clever algorithms
    to help them recover from packet collisions.

    To get around this problem, there’s another type of device, known as a switch.
    A switch is very much like a hub, in that it has many interfaces with Ethernet
    cables plugged in to it, but it’s more intelligent.

    Rather than blindly retransmitting all the packets that it receives to all the
    other interfaces, the switch builds a table of what MAC addresses can be found
    through which interfaces. When a packet arrives at the switch, it inspects the
    destination MAC address and figures out which port it should be sent out of. This
    way, you reduce the amount of traffic being sent across the bits of Ethernet and
    reduce contention on the lines – that is to say, you reduce collisions and make
    communication more reliable.


    This is an example of a network interface card; the device that mediates between
    your system and the physical medium.


    ```

    ip link show dev wlan0

    ```


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_99_0.png)


    # Logical networks


    The use of switches to extend networks and reduce collisions isn’t the end of
    the story, however. Another hurdle to jump over is the fact that MAC addresses
    have a flat structure, which means there’s no easy way to organise the addresses
    or group them together.

    This isn’t a problem when you’re dealing with a small network, but as your network
    begins to grow, your switches will find themselves quickly handling enormous lists
    of MAC addresses that have to be searched through in order to figure out which
    port a packet must be sent out of. This would slow down the switches and would
    make a global network, such as the internet itself impossible to build.

    To get around this, we split large networks into many smaller, logically grouped
    networks and use inter-networking technologies to route traffic between them.
    How does this work? Well, we first need to introduce you to a new type of'
