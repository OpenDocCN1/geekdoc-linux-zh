- pgno: 104
  md: '# Networking


    Nmap scan report for 10.67.93.172

    Host is up (0.016s latency).

    MAC Address: 00:50:27:00:E4:F0 (Genicom)

    Nmap scan report for www.yyyy.yyyy.gr (10.67.93.11)

    Host is up.

    Nmap done: 255 IP addresses (10 hosts up) scanned in 1.25 seconds


    The purpose of the ping test is simply to find out if an IP is up or not – see
    the grab on the opposite page. What’s important for Nmap in a ping scan is not
    the actual data of the received packets but, put relatively simply, the existence
    of a reply packet. As all traffic is in a LAN, each network device uses its MAC
    address in the reply so you only see MAC addresses in both Source and Destination
    fields. The presence of a reply makes Nmap understand that a host is up and running.
    As a MAC address includes information about the manufacturer of the network device,
    Nmap also reports that information for you.


    Nmap also calculates the round trip time delay (or latency). This gives a pretty
    accurate estimate of the time needed for the initial packet (sent by Nmap) to
    go to a target device, plus the time that the response packet took to return to
    Nmap. A big latency time is not a good thing and should certainly be examined.


    # Analysing DNS traffic


    DNS queries are very common in TCP/IP networks. A DNS query creates little traffic
    and therefore it is an appropriate example for learning purposes. The following
    command will be used for generating the necessary DNS network traffic that will
    be examined:


    ```

    $ host -t ns linuxformat.com

    linuxformat.com name server ns0.future.net.uk.

    linuxformat.com name server ns1.future.net.uk.

    ```


    Two packets are needed in total: one for sending and one for answering the DNS
    query (pictured, right). The first packet is number 3 and the second is number
    4. A Display filter (DNS) is used to minimise the displayed data and reveal the
    useful information. The UDP (User Datagram Protocol) protocol was used and the
    desired information was sent back without any errors as shown by the Flags information.
    You can also tell by noting the time difference between the DNS query (1.246055000)
    and its answer (1.255059000) that the DNS services work fine because of the reasonable
    response time. The DNS server asked has the 10.67.93.1 IP address – as you can
    see from the destination IP address of the first packet. The same DNS server answered
    the DNS query as you can see from the source IP address of the second packet.
    The ‘Answer RRs: 2’ line informs us that


    there will be two answers for the DNS query. In time, you will be able to take
    all this in with one glance.

    UDP uses the underlying IP protocol to transport a message from one machine to
    another, and provides the same unreliable, connectionless packet delivery as IP.
    It doesn’t offer acknowledgements to make sure messages arrive, it doesn’t order
    incoming messages, and it doesn’t provide feedback to control the rate at which
    information flows between the machines. Thus, UDP messages can be lost, duplicated,
    or arrive out of order. Furthermore, packets can arrive faster than the recipient
    can process them.


    The destination port of the first packet is 53 which is the usual port number
    of the DNS service. The UDP part of the second packet shows the port numbers used
    for the reply:


    User Datagram Protocol, Src Port: 53 (53), Dst Port: 53366 (53366)

    Source Port: 53 (53)

    Destination Port: 53366 (53366)

    Length: 90

    Checksum: 0x9b4d [validation disabled]

    [Stream index: 0]


    As it happens with most tools, the more you use Wireshark, the more efficient
    you will become with it, so keep on practicing and learning!


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_104_0.png)


    Here is how Wireshark shows the traffic of a DNS query after applying a Display
    filter. Notice the green colour around DNS that shows the validity of it.


    # The IP protocol


    IP stands for Internet Protocol. The main characteristic of IP is that it’s not
    a reliable protocol by design. Unreliable means that packets may not reach its
    destination for various reasons, including transmission errors, network hardware
    failures and network congestion. Networks may also deliver packets out of order,
    deliver them after a substantial delay or deliver duplicates. Nevertheless, a
    programmer can program reliable applications that use IP by implementing their
    own error-checking code but this is a non-trivial task.


    When the information doesn’t need many network packets, using a protocol that’s
    based on IP is more efficient than using TCP, even if you have to re-transmit
    a network packet, because there’s no three-way handshake traffic overhead. IP
    encapsulates the data that travels in a TCP/IP network, because it’s responsible
    for delivering packets from the source host to the destination host according
    to the IP addresses. IP has to find an addressing method to effectively send the
    packet to its destination. Dedicated devices that you’d recognise as routers mainly
    perform IP routing but every TCP/IP device has to do basic routing.


    Each IP address is a sequence of four 8-bit numbers, separated by dots. Each number
    has a value between 0 (=2^0-1) and 255 (=2^8-1). Example IP addresses are 10.25.128.254,
    213.201.43.23 and 192.168.1.200.

    IPv6 was developed by IETF and its purpose is to solve the problem of running
    out of IPv4 addresses. IP uses 32-bit addresses whereas IPv6 uses 128-bit addresses,
    offering more than 7.9×10^28 times as many as IPv4.


    # Quick tip


    There is also a console version of Wireshark called tshark. The two main advantages
    of tshark are that it can be used in scripts and that it can be used through an
    SSH connection. Its main disadvantage is that it does not have a GUI. Tshark can
    also replace tcpdump.'
  merge: -1
  img_proc: true
- pgno: 105
  md: "# Networking:\n\nAfter introducing you to the building blocks and tools of\
    \ networking, we're going to put all that knowledge together to create real, working\
    \ networks.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_105_0.png)\n\nOn the previous\
    \ pages, we introduced you to the different components of networking – packets,\
    \ physical connections and logical addressing – along with the tools you need\
    \ to inspect their operation on your Linux box. This takes you a long way towards\
    \ being able to effectively work with networks and diagnose problems that you\
    \ come across. Now we want to show you how these elements combine to create some\
    \ real networks. We'll start by getting two computers communicating directly with\
    \ one another, before moving on to demonstrate how you can turn a Linux box into\
    \ a router. So that you don't need lots of computers, all of this will be done\
    \ in VirtualBox, but you should be able to apply the same techniques to physical\
    \ systems as well.\n\nWe'll be using CentOS for our examples – it's based on Red\
    \ Hat Enterprise Linux, and is a popular choice for servers. If you're interested\
    \ in Ubuntu or other Debian-based distros, (see the Debian-based distributions\
    \ box, p109). Before we get started with the networking side of things, we first\
    \ need to build a lab on which to practise. Your first job, then, is to install\
    \ VirtualBox. This should be in the default repositories of most distributions,\
    \ so just use whatever package manager your current distribution comes with. Once\
    \ you've done that, download the CentOS minimal installation disc (www.centos.org).\
    \ Now, create two new virtual machines in VirtualBox, following our step-by-step\
    \ guide opposite to ensure you add all the network interfaces necessary to make\
    \ things work. Then, repeat the above steps for a second VM, making sure it's\
    \ attached to the same internal network. By creating VMs with two network interfaces\
    \ as we have, via the default NAT), but will also be able to communicate directly\
    \ with each other via the internal network we added. This internal network is\
    \ the equivalent of plugging the two VMs in to the same switch, or running a wire\
    \ between the two.\n\nThe contents of the /etc/sysconfig/network-scripts directory\
    \ looks intimidating, but if you focus on the ifcfg-ethX files, you'll find there's\
    \ a lot you can do here.\n\n# Basic networking\n\nWith the installation complete\
    \ on both machines, it's time to get both connected to the internet via the default\
    \ NAT network. This will give us a chance to get familiar with Red Hat's network\
    \ configuration files and to refresh some of the information we covered in the\
    \ previous pages. The first thing to do after your new VM has booted is to switch\
    \ to the /etc/sysconfig/network-scripts directory. On Red Hat-based distributions,\
    \ this directory contains the start-up scripts and configurations for every network\
    \ device connected to your machine. If you followed our step-by-step, you should\
    \ see two configuration files, ifcfg-eth0 and ifcfg-eth1 (if you're using a different\
    \ version of Red Hat, it might be ifcfg-em2 and ifcfg-em2 that you see). Eth0\
    \ is the first network device on the system, and should refer to Adapter 1 in\
    \ the VirtualBox configuration – that is the NAT network.\n\nUsing Vi, edit ifcfg-eth0,\
    \ making sure the following lines are present and set to these values:\nNM_CONTROLLED=\"\
    no\"\nBOOTPROTO=\"dhcp\"\nONBOOT=\"yes\"\n\nThe first line stops NetworkManager\
    \ from controlling this interface – since we're trying to do things manually,\
    \ its interference could confuse matters, so we turn it off. The second line specifies\
    \ what protocol it should use to get its IP address. Here, we've specified DHCP,\
    \ or Dynamic\n\n```\nroot@Adam /etc/sysconfig/network-scripts\nifcfg-Auto Ethernet\
    \  ifdown-post  ifup-plug\nifcfg-Auto Ethernet-1  ifdown-ppp  ifup-ppp\nifcfg-Auto\
    \ greater...  ifdown-route  ifup-route\nifcfg-Auto...  ifdown-sit  ifup-sit\n\
    ifcfg-Auto_LAN...  ifdown-tunnel  ifup-tunnel\nifcfg-Auto_netgear  ifup  ifup-aliases\
    \  ifup-wireless\nifcfg-lo  ifup-bnep  init.ipv6-global\nifdown  ifup-eth  keys-Auto...\
    \  network-functions\nifdown-bnep  ifup-ippp  keys-Auto...  net.hotplug\nifdown-ippp\
    \  ifup-ipsec  network-functions  network-functions-ipv6\nifdown-isdn  ifup-ipx\
    \  network-functions  \nroot@Adam network-scripts#\n```"
  merge: -1
