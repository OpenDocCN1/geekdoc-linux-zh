- pgno: 117
  md: '# # Zabbix: Monitor


    *Zabbix* is a network monitoring app that watches everything — and we mean everything.
    We wonder if it’s the eye of Sauron come to life.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_117_0.png)


    Concealed within his fortress, the system admin sees all. His gaze pierces the
    different distros, the different devices, disks and applications. You know of
    what I speak, having spent a great eve illustrated in flame. Well not so much
    lidless and wreathed in flame, because this isn’t fiction, for one!


    *Zabbix* is a network monitoring app that enables you to keep track of everything
    that goes on in the network. No matter the size of the network, no matter the
    operating system installed on the different machines, *Zabbix* can keep a close
    eye on every aspect of these machines. With *Zabbix*, you can monitor the free
    disk space, CPU load, network traffic statistics, memory consumption, application
    status, the


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_117_1.png)


    checksum of a file, and much more. All the collected information is stored in
    databases, and you can use *MySQL*, *Oracle* or *PostgreSQL*, as *Zabbix* supports
    all of them.


    # ## Outclassing competition


    But why should you use *Zabbix* when most people throw around names such as *Cacti*
    and *Nagios* all the time?


    *Zabbix*, just like its more popular brethren, supports Simple Network Management
    Protocol (SNMP). This means that these apps can monitor almost any device on a
    network, such as routers, printers, switches, modems, etc.


    While *Nagios* is the industry standard for monitoring local and remote machines
    and IT infrastructure, it’s almost always used together with other monitoring
    tools. This is because *Nagios* doesn’t have a visualisation feature and can’t
    reduce recorded data to easily understandable graphs. That said, *Nagios* has
    an excellent alerting feature to keep sysadmins informed of all the devices it’s
    tracking.


    In contrast, *Cacti* doesn’t have an alerting mechanism, but it can create beautiful
    and detailed graphs that represent all the data it collects across devices on
    the network.


    Our tool of choice, however, is very handy at sending out alerts and creating
    graphs. In addition to sending alerts via email, SMS and Jabber, it lets you set
    up automatic actions. That is, you can configure *Zabbix* to itself take action
    on remote machines when certain defined events occur.


    In terms of visualisation, *Zabbix* supports real-time graphing of monitored items
    and offers graphs, network maps, screens, and even slideshows, making it suitable
    for complex networks, whose sysadmins prefer to see graphical representations
    of data.


    # ## Understanding Zabbix


    A monitoring app primarily performs two functions. It collects data on all the
    devices on the network and reports it to a central controlling authority. *Zabbix*
    relies on two key components for these functions – **zabbix-server** and **zabbix-agent**.


    As the name suggests, you install **zabbix-agent** onto all the machines you wish
    to monitor on the network. The agent can monitor hardware resources, as well as
    applications, and pushes all the collected information to **zabbix-server**. For
    now, **zabbix-agent** is available for Linux, FreeBSD, OpenBSD, NetBSD, HP-UX,
    MacOS X, Solaris and various Windows versions.


    The other part, **zabbix-server**, is responsible for polling and trapping of
    data. In case of problems or downtime, the server sends notifications to the configured
    accounts. You only need to install one instance of **zabbix-server** on your network.
    With *Zabbix*, you get a centralised web interface that you can use to control
    what events are monitored across the network. Due to its vast number of


    > > All the green OKs are proof positive that I know what I’m doing here.'
