- pgno: 92
  md: "# SMBFS and CIFS\n\nTwo virtual filesystem implementations on Linux allow mounting\
    \ of SMB shares: SMBFS and CIFS. The latter is the newer implementation and is\
    \ built into the kernel. The user-space tools that you need to use CIFS were originally\
    \ part of Samba but are now a separate package that's called cifs-utils.\n\nThe\
    \ original SMBFS, which is also part of the Samba suite, has been deprecated –\
    \ you should use CIFS to mount Samba filesystems. The upshot of this is that,\
    \ if you just want to mount Windows shares on your Linux box, you don't need Samba.\
    \ Mounting a Windows share is as simple as:\n\nmount -t cifs -o username=myuser,password=mypass\
    \ //myserver/myshare /mnt\n\nThe difference between CIFS and SMB can be a little\
    \ bit confusing, because the CIFS dialect is newer than SMB but older than SMB2,\
    \ whereas\n\nCIFS is newer than SMBFS and supports SMB, CIFS and the newer SMB2\
    \ and SMB3 dialects. For further details, see the client guide. http://pserver.samba.org/samba/ftp/cifs-cvs/linux-cifs-client-guide.pdf\n\
    \nThe SMB and CIFS protocol specifications are published at http://msdn.microsoft.com/en-us/library/cc246482.aspx\
    \ and http://msdn.microsoft.com/en-us/library/ee442092.aspx.\n\nreplacement for\
    \ the equivalent functions in Microsoft's Windows Server product line.\n\nSamba\
    \ is an open source implementation of the Server Message Block, or SMB, protocol.\
    \ This is an application-layer network protocol that was originally developed\
    \ by IBM to provide shared access to files and printers. Microsoft extended its\
    \ implementation of SMB to support authentication using its own NT LAN Manager\
    \ (NTLM) and, later, NTLMv2 protocols. It called this implementation the Common\
    \ Internet File System, or CIFS. Further extensions, including support for symbolic\
    \ links, were released as SMB2 with Windows Vista.\n\nSamba has supported SMB2\
    \ since version 3.6. Microsoft introduced SMB2.1 with Windows 7 and SMB3 with\
    \ Windows 8. It calls the differing versions of the protocol dialects, so CIFS\
    \ and SMB2 are dialects of the SMB protocol. While these dialects are proprietary,\
    \ their specifications are publicly available.\n\nOne of the outcomes of Microsoft's\
    \ settlement with the European Courts in 2004 was the release of full documentation\
    \ for network authentication with Active Directory. This led to the development\
    \ of version 4 of Samba, with Microsoft itself being involved in the testing.\n\
    \n(LDAP) versions 2 and 3. Kerberos and DNS. Samba uses its own LDAP implementation\
    \ called ldb; it does not support using OpenLDAP for Active Directory.\n\nSo there\
    \ are now two ways to use Samba – one is to use it how it's always been used (classic\
    \ Samba), which can either operate as a domain member or standalone, and is all\
    \ that you need to set up basic shares. The other way is to use Samba as a fully-fledged\
    \ ADDC. The way you use Samba will depend on your needs, but the first thing that\
    \ needs to be done is to install it. Most distributions should have it in their\
    \ repositories. The other option is to build it from source, downloaded from www.samba.\n\
    \n> “The way you use Samba will depend on your needs”\n\norg/samba/download. Once\
    \ installed, Samba's configuration file is called smb.conf, and will normally\
    \ be found in a subdirectory, such as /etc/samba. The simplest configuration to\
    \ use is a standalone public share:\n\n```\n[global]\n\nserver string = Samba\
    \ Server Version\n\n%v\n\n# Treat unknown users as a guest\n(where permitted)\n\
    security = user\nmap to guest = Bad User\n\n[tmp]\npath = /tmp\nread only = No\n\
    browseable = Yes\nguest ok = Yes\nforce user = nobody\nforce group = nobody\n\
    create mask = 0755\ndirectory mask = 0755\n```\n\nThis will make /tmp on the server\
    \ available as a Samba share over TCP/IP. The use of security = user and map to\
    \ guest allows guest shares to operate similarly to the deprecated security =\
    \ share mode that existing Samba administrators may be familiar\n\nwith. A user\
    \ with a Windows username that Samba doesn't recognise will not need to provide\
    \ credentials to access the share, and they will be authenticated as the guest\
    \ user.\n\nAny files they write there will have their user and group ID set to\
    \ 'nobody'. However, if the username is known to Samba, then the user will be\
    \ prompted for their password. This might seem weird, but it is consistent with\
    \ the way Windows works. Start the Samba daemon, smbd, to make this share accessible\
    \ on Windows. To access it, simply use Windows Explorer to browse to the Samba\
    \ server (you can use either its name or IP address).\n\n# Add/Remove NetBIOS\n\
    \nThere has been a networking protocol that has long been associated with Windows\
    \ networking and, therefore, is an integral part of the Samba suite: NetBIOS.\
    \ These days, NetBIOS generally refers to the NetBIOS over TCP/IP protocol, which\
    \ is considered a legacy protocol. It offers name resolution, file and printer\
    \ sharing with devices that do not have DNS capabilities.\n\nIt used to be essential\
    \ in a Windows network, but is no longer necessary unless older versions of Windows\
    \ are involved, but you still need it if you want clients running OSes prior to\
    \ Windows 2000 to be able to access your shares. If you don't want to include\
    \ NetBIOS, the following additions to the [global] section of smb.conf make this\
    \ explicit:\n\n```\n[global]\n# disable NetBIOS\n disable netbios = yes\n smb\
    \ ports = 445\n```\n\nShould you need it, however, enabling NetBIOS requires other\
    \ changes to smb.conf:\n[global]\n\n```\n# NetBIOS identification\nworkgroup =\
    \ WORKGROUP\nnetbios name = MYHOST\nwins support = Yes\n```\n\nThis tells Samba\
    \ to use NetBIOS to make itself known to the Windows network in its default workgroup\
    \ (Windows machines default to a workgroup called WORKGROUP) and to act as a WINS\
    \ server. The NetBIOS name is the equivalent of a host name – it doesn't need\
    \ to be the same as the host name, but that is customary. WINS is the Windows\
    \ Internet\n\n# Quick tip\n\nYou do not need to restart or signal Samba when modifying\
    \ smb.conf because it automatically detects changes."
  merge: -1
  img_proc: true
- pgno: 93
  md: "# # Networking\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_93_0.png)\n\n# ###\
    \ Strange things can happen when clocks aren't synchronised!\n\nName Service,\
    \ Microsoft’s implementation of a NetBIOS Name Service, and it provides a similar\
    \ service for NetBIOS names that a DNS provides for domain names (mapping host\
    \ names to network addresses). Name lookups will resolve without a WINS server,\
    \ but only within the local subnet – if a client is unable to resolve a NetBIOS\
    \ name using a WINS server then it will resort to broadcasting “where are you?”\
    \ messages on the network. This is one reason why sysadmins hate NetBIOS, and\
    \ why you should disable it unless you really need it. You can also read plenty\
    \ on the internet about how NetBIOS is insecure.\n\nIf you need NetBIOS, the final\
    \ piece required to support it is to run Samba’s **nmbd** process as well as its\
    \ **smbd** process. It is **nmbd** that provides the NetBIOS naming and WINS services.\n\
    \nIt’s worth understanding how connections are made from the client side. Prior\
    \ to Windows 2000, connections were only made via NetBIOS, which connects to port\
    \ 139 on the server. Starting with Windows 2000, connections are made using both\
    \ NetBIOS and TCP/IP, the latter connecting to port 445 on the server. The client\
    \ closes its NetBIOS connection on port 139 if the server responds to the TCP/IP\
    \ connection. As you would expect, shares can be configured so that authentication\
    \ is required to access them. This requires a database of users to authenticate.\n\
    \n# ## Password management\n\nThis is the first area where the Active Directory\
    \ setup differs from the classic setup. Classic Samba uses its own password database\
    \ containing encrypted passwords, but because file permissions relate to Unix\
    \ users and groups, these are directly related to the users on the server. Active\
    \ Directory users are not related to Unix users (more on this later). To add a\
    \ user to classic Samba:\n\n> > “You can read plenty on the internet on how NetBIOS\
    \ is insecure.”\n\n```\nsmbpasswd -a myuser\nNew SMB password:\n```\n\n# ## Quick\
    \ tip\n\nUpgrading users should note that the **smbpasswd** file has changed internally,\
    \ and is therefore not portable between Samba 3.x and Samba 4.\n\n```\nRefType\
    \ new SMB password:\nForcing Primary Group to 'Domain Users' for myuser\nForcing\
    \ Primary Group to 'Domain Users' for myuser\nAdded user myuser.\n```\n\nNote\
    \ that once a user has been added to Samba, Windows will require their password\
    \ to be entered – even for guest shares. Adding a user-specific share, like a\
    \ home directory, can be achieved with an entry in **smb.conf**:\n\n```\n[myuser]\n\
    \    comment = %U home directory\n    writable = yes\n    valid users = myuser\n\
    \    path = %H\n```\n\nor, more generally, using the special **[homes]** share,\
    \ which creates a home share for each user. When a user attempts to connect to\
    \ a share, Samba looks for an explicit share definition like the one above. If\
    \ none is found, but a **[homes]** share exists, then that will be used like a\
    \ template to create the share the user requested. A suitable example is shown\
    \ below; the browsable entry prevents **[homes]** appearing when the share is\
    \ browsed.\n\n```\n[homes]\n    comment = %U home directory\n    writable = yes\n\
    \    browsable = no\n```\n\nAnother special kind of share is **[printers]**. As\
    \ you might expect, this allows Windows clients to use printers attached to the\
    \ Samba server. It uses CUPS to spool raw print jobs, which means that the client\
    \ needs to have an appropriate printer driver installed. It’s this that converts\
    \ into the raw data that the printer can process. Printing requires a **spool**\
    \ directory that has its sticky bit set:\n\n# ## Windows 7 test client\n\nA computer\
    \ running Windows is required to fully evaluate Samba 4’s Active Directory capabilities.\
    \ We installed Windows 7 Ultimate with Service Pack 1 along with the Remote Server\
    \ Administration tools.\n\nFrom those tools, the one you need is Active Directory\
    \ Users and Computers (the executable name is **dsa.msc**). Refer to the relevant\
    \ Microsoft web pages to find more information about installing these:\n\n**Windows\
    \ 7 Service Pack 1:**\nwww.microsoft.com/en-us/download/details.aspx?id=5842\n\
    \n**Windows 7 RSAT:**\nwww.microsoft.com/en-gb/download/details.aspx?id=7887\n\
    \nIf you want the Windows machine to respond to ICMP Ping requests, you will need\
    \ to add an appropriate rule to the Windows firewall (or completely disable the\
    \ firewall).\n\nTo add a rule, go to ‘Start > Control Panel > System and Security\
    \ > Windows Firewall > Advanced Settings > Inbound Rules > New Rule’. Create a\
    \ custom rule for the ICMPv4 protocol. Remember that the Home and Starter versions\
    \ of Windows are unable to join a domain.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_93_1.png)\n\
    \nFor Active Directory Users and Computers search for ‘dsa.msc’ and run it as\
    \ an administrator."
  merge: -1
  img_proc: true
- pgno: 94
  md: "# mkdir /var/spool/samba\n# chmod 1777 /var/spool/samba\nThe necessary Samba\
    \ configuration sets up CUPS printing and shares its printers on a [printers]\
    \ share:\n\n[global]\n    load printers = yes\n    printing = cups\n    printcap\
    \ name = cups\n[printers]\n    comment = Printers\n    path = /var/spool/samba\n\
    \    browsable = yes\n    writable = yes\n    printable = yes\n[print$]\n    comment\
    \ = Printer Drivers\n    path = /usr/share/samba/print\n    writable = yes\n\n\
    The additional [print$] share is optional, but it is for Point and Print Drivers.\
    \ It allows an administrator to upload printer drivers to the server so that a\
    \ user installing the printer does not have to look for a driver themselves. The\
    \ directory for the [print$] share should be created along with subdirectories\
    \ for the printer architectures to be supported:\n\n# mkdir -p /usr/share/samba/print/{COLOR,I\
    \ A64,W32ALPHA,W32MIPS,W32PPC,W32X86,WIN40,x64}\n\nThe easiest way to upload a\
    \ printer driver is by an administrator user logged in to a Windows client. On\
    \ Windows 7, browse to the server (for example, \\\\MYHOST) and then click on\
    \ ‘View Remote Printers.’ Press [Tab] to display the menu bar and then select\
    \ ‘File > Server Properties.’ Go to the Drivers tab and click on ‘Add’. This will\
    \ start the Add Printer Driver wizard for the server. After uploading a driver,\
    \ you need to associate it with the printer; browse to the printer and open its\
    \ Properties page. On its Advanced tab, select the uploaded driver from the drop-down\
    \ list. A Windows client can add a printer (for example, on Windows 7 go to ‘Start\
    \ > Devices and Printers > Add Printer’ to add a networked printer). If a driver\
    \ is installed on [print$] it installs automatically, otherwise the user needs\
    \ to locate and install the correct driver themselves.\n\n# Domain control\n\n\
    We'll now take a look at the Active Directory implementation provided by Samba\
    \ 4. It is best to assume that, while Samba 4 can act as either a Standalone/NT\
    \ Domain Member or as an Active Directory Domain Controller, the two configurations\
    \ are very different and, to some extent, incompatible.\n\nSetting up Samba as\
    \ an Active Directory domain controller is, however, straightforward because there\
    \ is a provisioning tool that performs the set-up tasks:\n\n```\n# samba-tool\
    \ domain provision\nRealm [MYDOMAIN.CO.UK]:\n```\n\n# Quick tip\n\n> There are\
    \ some tutorial videos at **https://wiki.samba.org/index.php/Samba4/videos**,\
    \ which provide good walkthroughs of the provisioning process.\n\n```\nDomain\
    \ [MYDOMAIN]:\nServer Role (dc, member, standalone) [dc]:\nDNS backend (SAMBA_INTERNAL,\
    \ BIND9_FLATFILE, BIND9_DLZ, NONE) [SAMBA_INTERNAL]:\nDNS forwarder IP address\
    \ (write 'none' to disable forwarding) [10.0.0.138]:\nAdministrator password:\n\
    Retype password:\n```\n\nPasswords need to be suitably complex: one upper-case\
    \ letter, one digit and at least eight characters long. ‘Pa$$w0rd’ is a suitable\
    \ example that we used for our tests, though it’s not very secure. When the provisioning\
    \ completes, it will explain that it has generated a Kerberos configuration suitable\
    \ for Samba 4. You need to copy this file into place:\n\n# cp /var/lib/samba/private/krb5.conf\
    \ /etc\n\nNext, the DNS resolver needs to be configured to point at Samba, because\
    \ it is also the DNS for the new Windows domain. You can do this either by editing\
    \ /etc/resolv.conf or, if that’s written by a service such as dhcpcd, adjusting\
    \ the service’s configuration.\n\n# What exactly is Kerberos?\n\nKerberos is a\
    \ network authentication protocol which uses a system of tickets to allow entities\
    \ to securely authenticate across an insecure network without transmitting passwords\
    \ between them. This is a mature protocol that originated at MIT in the 1980s,\
    \ where it was created as a solution to network security issues the university\
    \ had and has been open source since 1987 (http://web.mit.edu/kerberos) and it’s\
    \ now used by the Active Directory Domain Controller.\n\nThere are three participants\
    \ in a Kerberosed connection: the client, the resource and a Kerberos server known\
    \ as a Key Distribution Centre. It is in reflection of this trinity that Kerberos\
    \ is named after the three-headed hound of ancient Greek mythology that guarded\
    \ the gates of Hades.\n\nKerberos authentication is performed by the Key Distribution\
    \ Centre in two stages. First, a client requests a ticket granting ticket. This\
    \ is usually performed when a client initially logs in. The TGT eventually expires,\
    \ but can be transparently renewed when necessary. The second stage comes into\
    \ play whenever the client wishes to access a resource that is protected by Kerberos.\
    \ It sends its TGT back to the server, which validates it and returns a ticket\
    \ back to the client that allows access to the requested resource.\n\nThis is\
    \ a somewhat simplified explanation of a very complex process which is better\
    \ explained by a helpful video presentation: www.youtube.com/watch?v=KD2Q-2TEoL.\
    \ In an Active Directory domain, the Kerberos Key Distribution Centre is a network\
    \ service that is provided by the Active Directory Domain Controller.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_94_0.png)"
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Networking


    Either way, the /etc/resolv.conf should look like this:


    ```

    domain mydomain.co.uk

    nameserver 127.0.0.1

    ```


    Samba forwards requests that it cannot resolve itself to the DNS forwarding address
    that was specified during the provisioning step. It uses its own internal DNS
    server, but can be configured to use an external BIND DNS instead. However, because
    you get so much for free with the internal one, it probably isn’t worth doing
    so unless you really need to.


    # Testing phase


    With the configuration steps completed, we can start the domain controller and
    perform some tests. Active Directory mode uses a new samba binary instead of the
    usual smbd. Here, we start it in the foreground while testing:


    ```

    # samba -M single mydomain

    Copyright Andrew Tridgell and the Samba Team 1992-2012

    samba: using ''single'' process model

    # host -t SRV _ldap._tcp.mydomain.co.uk

    # host -t SRV _kerberos._udp.mydomain.co.uk

    ```


    ```

    _kerberos._udp.mydomain.co.uk has SRV record 0 100 88 myhost.mydomain.co.uk

    # host -t A myhost.mydomain.co.uk

    host -t A myhost.mydomain.co.uk

    ```


    Next, test Kerberos (enter the administrator password when requested):

    # kinit administrator@MYDOMAIN.CO.UK

    Password for administrator@MYDOMAIN.CO.UK:


    ```

    # klist

    Ticket cache: FILE:/tmp/krb5cc_0

    Default principal: administrator@MYDOMAIN.CO.UK

    Valid starting Expires Service principal

    08/02/13 16:25:31 09/02/13 02:25:31 krbtgt/MYDOMAIN.CO.UK@MYDOMAIN.CO.UK

    renew until 09/02/13 16:25:21

    ```


    At this point, you should be able to see Samba shares and access them:

    $ smbclient -L localhost -U%


    ```

    Domain=[MYDOMAIN] OS=[Unix]

    Server=[Samba 4.0.3]

    Sharename Type Comment

    netlogon Disk

    sysvol Disk

    ```


    ```

    IPC$ IPC IPC Service (Samba 4.0.3)

    $ smbclient //localhost/netlogon

    -UAdministrator%Pa$$w0rd -c ''ls''

    Domain=[MYDOMAIN] OS=[Unix]

    Server=[Samba 4.0.3]

    ```


    Another service provided by an Active Directory Domain Controller is time synchronisation.
    While optional, providing this service is highly recommended because Kerberos
    is highly sensitive to time variations between clients and the server.


    The so-called Windows Time Service that a domain controller provides is a Network
    Time Protocol (NTP) server with extensions for authentication. There’s a number
    of NTP implementations on Linux, such as ntpd and open-ntpd, but only ntpd version
    4.2.6 onwards supports the necessary authentication extensions, and then only
    if that support has been compiled in (you should check your ntpd version with
    ntpd --version). A suitably configured ntpd asks Samba to perform any necessary
    authentication. The ntpd configuration goes in /etc/ntpd.conf. Here is a suitable
    example:


    ```

    server 127.127.1.0

    fudge 127.127.1.0 stratum 12

    ntpsigndsocket /var/lib/samba/ntp_signd/

    restrict default noserve

    ```


    The important lines, which may not be in an existing ntpd.conf, are the last two.
    The ntpsigndsocket entry defines the path to the directory where Samba places
    the socket file through which it will receive authentication requests. The restrict
    entry tells ntpd that incoming requests need to be authenticated. The socket path
    is determined by Samba’s configuration, and you can confirm the correct path with:

    # samba-tool testparm --verbose --suppress-


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_95_0.png)


    The Samba Web Administration Tool (SWAT) is still around, but hasn’t been updated.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '```

    prompt | grep "ntp signd socket directory"

    ntp signd socket directory = /var/lib/samba/ntp_signd

    ```


    Samba creates the socket directory, but it is very important to ensure that it
    is writable by ntpd. If ntpd runs with a uid/gid of ntp:ntp then you should change
    the directory''s group to ntp also.


    Restart ntpd to ensure that any configuration changes are picked up, and then
    check its log file for a warning that ntpd was configured without the --enable-ntp-signd
    compile-time configuration option. If you do see that warning, then your ntpd
    does not support the required authentication mechanism. You would need to obtain
    the sources for ntpd and rebuild it to include the aforementioned compile-time
    configuration option. Unfortunately, there is no tool to test NTP authentication
    from Linux.


    To test it from a Windows computer that


    # “Whatever your needs, Samba 4 offers a viable open source alternative”


    is a domain member, open a command prompt window as the Administrator (to do this,
    click the "Start" button, type cmd and then right-click the command prompt entry
    in the search results to select ''Run as administrator'') and enter:


    ```

    C:\> w32tm /resync

    Sending resync command to local computer

    The command completed successfully.

    ```


    Before connecting a Windows client to the new domain, change its network configuration
    so that it uses Samba''s DNS. Also, it is a good idea to manually adjust the client''s
    clock so that it is within a few seconds of the domain controller. If their clocks
    aren''t synchronised, errors may be reported that bear no relationship to the
    real problem. The Windows time service will keep the clocks synchronised once
    the client becomes a domain member.


    # Domain admin


    To add the client to the domain, go to Start > Computer > Right-click > Properties
    > Change settings. This will display the Computer Name/ Domain Changes dialog,
    where you should select Domain in the Member Of section and enter the Samba domain
    name (for example, mydomain) before pressing OK. This should request the administrator
    account credentials (the username is Administrator and the password is Pa$$w0rd
    if you have been following our example settings).


    Domain administration can be performed locally on the server using the samba-tool
    command line utility, or remotely from a Windows computer connected to the domain.
    An administrator, using a suitably configured computer, can run the Active Directory
    Users and Computers tool.


    This offers full control over users and computers, and also functions exactly
    the same as though it were administering Microsoft''s Active Directory.


    Adding users to AD is done differently from classic Samba (which uses smbpasswd),
    but it''s more flexible because it can be done from a server command prompt using
    samba-tool or remotely from Windows with Active Directory Users and Computers.


    When Active Directory users are created, they are unrelated to existing users
    in /etc/passwd because they are given different uid numbers. The assigned uid
    can be changed, and it is quite straightforward thing to do so:


    ```

    # wbinfo --name-to-sid myuser

    S-1-5-21-4099219672-1275272411-291422405-1104 SID_USER (1)

    # ldbedit -H idmap.ldb -s 1-5-21-4099219672-1275272411-291422405-1104

    ```


    This allows you to edit an entry from Samba''s ID mapping database using your
    default editor, so that you can change the user''s uid (the location of idmap.ldb
    depends on your installation, but will be something like /var/lib/samba/private
    or /usr/local/samba/private).


    | # editing 1 records |

    | 1 # record 1 |

    | 2 dn: CN=S-1-5-21-4099219672-1275272411-291422405-1105 |

    | 3 cn: S-1-5-21-4099219672-1275272411-291422405-1105 |

    | 4 objectClass: sidMap |

    | 5 objectSid: AQUAAAAAAAUVAAAA2CBV9NSAoZFWf4RUQQAA== |

    | 6 type: ID, TYPE, BOTH |

    | 7 xidNumber: 300020 |

    | 8 distinguishedName: CN=S-1-5-21-4099219672-1275272411-291422405-1105 |


    The value to change is xidNumber, which can be changed to the user''s correct
    uid. The changes will be saved to the database when the edit session is exited.


    Setting up file shares can be done in a similar way to classic Samba by adding
    relevant blocks to smb.conf. You can share [homes] as with classic Samba, but
    you can go a step further and offer roaming profiles with a [profiles] share:


    ```

    [profiles]

    comment = Roaming Profiles

    path = /var/lib/samba/profiles

    writable = yes

    browseable = no

    ```


    In order to configure a user with a roaming profile, use the Active Directory
    Users and Computers tool to edit the user''s settings, and set their profile path
    to \\mydomain\profiles\%USERNAME%. Following this, the user''s profile will be
    copied between the local disk and the Profiles area on the server when they log
    in to and out of any client on the domain.


    # Quick tip


    The release notes for the latest stable release Samba 4.0.22 are available at
    http://bit.ly/10kq4tc.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_96_0.png)


    Adding users can be done from Windows.


    So there you have it. Whatever your needs, whether it''s just basic file sharing
    or through to something more complicated such as a complete Active Directory environment,
    Samba 4 offers a viable open source alternative to otherwise expensive proprietary
    options.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Networking:


    Take your first steps towards understanding networking and linking your Linux
    boxes, as we introduce some of the key concepts.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_97_0.png)


    tools (such as the network analyser, Wireshark on p102) to examine and build networks.


    First, our goal is to introduce you to the three ideas that underpin everything
    else that happens with networks – packets, physical connections and addressing.
    Then we’re going to create some virtual machines (see p106) and build some simple
    networks.


    # Packet switched networks


    Let’s start by talking about what a network is. Simply, a network is two or more
    computers connected by some physical medium, whether that’s a copper wire (known
    as Ethernet), a fibre optic cable or a radio wave (known as Wi-Fi). By sending
    signals across this medium, computers are able to share information with one another.


    It sounds simple enough – you run a conductive wire between two computers, and
    by sending electrical signals along it, the two computers can share information.
    The trouble is, even this simple model (which ignores questions of how the electrical
    signals are encoded and decoded) runs into problems quickly.


    The data we share between two computers is usually large and complex, made of
    many millions of bits. This data could be sent in a continuous stream across the
    wire, which might take many minutes, hours or even days to send. With just two
    computers, this isn’t a big problem; one can just wait until it receives a signal
    saying it has all the information, then it can take its turn to send some information
    back.


    In the case of a more complex network, however, with many dozens or hundreds of
    computers attached to the shared medium, you start to run into real problems.
    While one computer is sending information, none of the others can use the medium
    to transmit information. What’s more, when there’s an interruption to the network
    signal, you have to retransmit the entire thing – if the file being sent is big,
    this becomes a real pain.


    The way computer networks get around these problems is by using packet switched
    networks. The large pieces of data are broken into more manageable chunks, called
    packets. As well as containing the information to be shared, these packets contain
    metadata that specifies, among other things, where in the stream of data the packet
    belongs.


    Most of the time we don’t use our computers as though they were a solitary box,
    but instead connect them together, sharing files and information throughout our
    homes and across the internet. To help you put your Linux skills to use in this
    networked environment, we’re going to spend twelve pages introducing you to the
    fundamentals of networking. Throughout, our focus will be on both the practical
    as well as the theoretical explaining the terminology as we go. We’ll get you
    using Linux


    > Wireshark does a similar job to tcpdump capturing packets, but provides a nice
    colourful GUI to help you see what’s going on.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_97_1.png)


    If a packet gets lost in the depths of the interweb, the receiving computer will
    see that it’s missing a part of the stream, and can request for just that packet
    to be resent – instead of the whole thing. What’s more, because packets break
    the data into independent chunks, all the computers that share the medium can
    take it in turns to transmit their packets, rather than entire files, meaning
    everyone can share the medium more effectively.


    Packets are more than just a theoretical construct, you can actually see individual
    ones being transmitted across the'
