  md: '# Samba


    # Dancing with Windows


    The Windows interoperability suite for Linux that boasts Active Directory support.
    Let’s take it for a spin.


    We all love our Linux boxes, but most of us at some point need to co-exist on
    a network with Windows machines, and know Samba as the thing that enables sharing
    filesystems between Linux and Windows. But it does much more than that and, with
    version 4, is fully compatible with Microsoft’s Active Directory. This is a big
    thing – Samba has long been able to act as a Windows NT 4.0 Domain Controller,
    or


    > “Samba 4 fully implements the Active Directory domain controller functionality”


    join an existing Windows NT 4.0 Domain but, with the release of Windows 2000,
    Microsoft


    started moving away from NT Domain controllers to its new Active Directory, widening
    the gap between the Linux and Windows ecosystems. Samba version 4 and upwards
    provides the long-awaited remedy to this issue by being fully compatible with
    Active Directory. It fully implements the Active Directory domain controller functionality,
    making it an effective'
