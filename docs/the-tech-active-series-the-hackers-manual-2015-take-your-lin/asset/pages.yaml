  md: "# # torrent server\n\nyou enter the web interface, Deluge will prompt you to\
    \ change the password.\n\nBefore you can start using the web client you'll have\
    \ to connect to the Deluge daemons. The web interface will automatically launch\
    \ the Connection Manager window, which lists all of the running Deluge daemon.\
    \ Simply select the daemon and click on the Connect button. You'll now be able\
    \ to use the web client to add and control all your torrents running on the torrent\
    \ box.\n\nIf you wish to change the port on which the web client runs, you'll\
    \ need to edit its configuration file. Head to Deluge's configuration directory\
    \ with `cd ~/.config/deluge/` and open the configuration file called `web.conf`\
    \ in your favourite text editor. Scroll down the file and find the line that reads\
    \ “port: 8112” and replace 8112 with any port number above 1000.\n\n# ## Daemon's\
    \ work\n\nAs mentioned earlier, to get the maximum out of Deluge you will need\
    \ to configure the Deluge daemon to accept connections from a remote client. Start\
    \ by pulling up the Deluge console client to make configuration changes to the\
    \ Deluge daemon, with the command:\n\n```\nsudo apt-get install deluge-console\n\
    sudo pkill deluged\n```\n\nand open its configuration file `~/.config/deluge/auth`\
    \ in your favourite text editor.\n\nScroll down to the bottom of the file and\
    \ enter three parameters to specify the username and password you wish to use,\
    \ along with the authentication level for the daemon, separated by a colon, such\
    \ as `my-username:my-password:10`. Remember to replace the my-username and my-password\
    \ parameters. The 10 authentication level gives the daemon administrative privileges.\n\
    \nSave the file and exit the text editor. Back at the console, start the Deluge\
    \ daemon with the deluged command. Then head into the Deluge console by entering\
    \ deluge-console in the terminal. This will launch the command-line interface\
    \ for the Deluge daemon.\n\nWe'll use the console to make the Deluge daemon accept\
    \ remote connections. In the console type:\n\n```\nconfig -s allow_remote True\n\
    ```\n\nThe client will confirm that it has successfully changed the configuration\
    \ value. You can now exit the console client by typing exit and then bring the\
    \ changes into effect by first stopping the Deluge daemon with sudo pkill deluged\
    \ and then starting it again with deluged.\n\nThat's all there's to it. Deluge\
    \ is now all set up to accept connection from remote clients on the network. Follow\
    \ the walkthrough to setup clients to connect to your box.\n\n# ## Connect to\
    \ the server\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_110_0.png)\n\n+   1.\
    \ **Install clients**\n+      Now that the Deluge daemon is ready to accept connections,\
    \ you'll need to install the Deluge desktop client on other computers on your\
    \ network. Most desktop distributions include Deluge in their repositories so\
    \ you can download it from the distro's package manager. Being cross-platform,\
    \ you'll also be able to head to Deluge's download page to get Windows and Mac\
    \ OS X clients, if needed.\n+   \n+   2. **Enable Classic mode**\n+      By default,\
    \ the Deluge clients are set up to download to the local computer. We want to\
    \ change this behaviour, so you'll need to fire up the Deluge client and head\
    \ to Edit > Preferences and switch to the Interfaces category. Here you'll notice\
    \ a checkbox for Classic Mode which is enabled by default. Uncheck this box, click\
    \ OK and then restart the Deluge desktop client.\n+   \n+   3. **Add host**\n\
    +      When you restart Deluge it will automatically fire up the Connection Manager.\
    \ Click on the Add button in the Connection Manager and enter the connection details\
    \ about the daemon. Click the Add button which takes you back to the Connection\
    \ Manager. Select the added entry and click the Connect button to connect the\
    \ client with the daemon running on the torrent box.\n\n**Subscribe to Linux Format**\
    \  http://myfavouritemagazines.co.uk/LINsubs"
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Enhance your torrent experience


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_1.png)


    # 1 Enable Deluge plugins


    Deluge includes a host of useful plugins. To enable them head to Edit > Preferences
    and switch to the Plugins category. Click on the checkbox next to a plugin to
    enable it. Enabled plugins appear as separate categories in the Preferences window.
    The client ships with eight plugins and you can click the Find More Plugins button
    to fetch and install additional third-party plugins.


    # 2 Useful plugins


    One useful plugins is the Scheduler, which lets you limit bandwidth usage based
    on the time of day. The Notification plugin displays pop-ups on the desktop or
    sends you email alerts when a torrent finishes downloading. Advanced users will
    also like the Execute plugin, which runs a specified command when a new torrent
    is added or a torrent completes downloading.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_3.png)


    # 3 Add-on for Firefox


    If you use the Firefox web browser you can add the Bit Torrent WebUI+ Firefox
    extension that will let you add torrents to the Deluge daemon via the web interface.
    After you’ve installed the extension, it’ll open a dialog box for you to enter
    the connection details of the Deluge WebUI, and when you click on a torrent link
    in future, the torrent will be automatically added to the remote torrent box.


    # 4 Add-on for Google Chrome


    If you use the Chrome browser, you can install the DelugeSiphon app from the Google
    Play Store. When installed, you’ll need to click on its icon in the address bar
    and head to the Options page. Enter the IP address of the daemon along with the
    port number and the password of the WebUI. This will enable you to right-click
    on any torrent file and select the Send to Deluge option to add the torrent.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_4.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_111_5.png)


    # 5 Use a mobile client


    You can also install an app on your Android device to add and control downloads.
    The Google Play Store lists several apps that can connect to the Deluge daemon.
    Two of the most popular apps are Transdrone and the feature-rich TransDroid app.
    While the former is available in the Play Store, to download the latter you will
    need to visit the official site via your smartphone (http://transdroid.org/latest).


    # 6 Set up the client


    The procedure for setting up both Transdrone and TransDroid is the same. When
    you launch the app for the first time, you’ll get a welcome notice. Tap on the
    Settings button and then on the Add a new server button. Now select the Server
    type option and select Deluge 1.2+ from the list. Then enter the IP address of
    the torrent box to connect to the web user interface of Deluge.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Use a TurnKey Linux Torrent Server


    The TurnKey Linux project produces Linux-based, self-contained, task-oriented
    servers that run on top of Just Enough Operating System (JeOS) components, which,
    as the name suggests, are required to power just that particular app. The project’s
    Torrent Server appliance has all the tools you need to host your own file server.
    It’s also got a multi-protocol file sharing app, called MLDonkey, using which
    you can download all types of files.


    The best thing about the appliance is that after installation you can manage it
    remotely from within a browser. You can upload and download files, compress and
    uncompress them using popular compression algorithms, such as ZIP and RAR, install
    additional packages, and do a lot more, from any web browser on any operating
    system within your network or from anywhere on the Internet.


    You can download the appliance from www.turnkeylinux.org/torrentserver. You can
    either directly install the Torrent Server appliance, or try its components by
    first running it in live mode. Whether you install or run it live, you’ll be prompted
    for password to the root user as well as to the admin user for the various components
    in the appliance: the MLDonkey file sharing app, the P2P-GUI to MLDonkey, and
    the eXplorer file manager.


    That’s all there’s to it. Once you’ve configured the users, the torrent server
    appliance will copy all the files and install the boot loader as well.


    > Unlike our torrent box which uses Deluge, the TurnKey Torrent Server uses the
    versatile MLDonkey file sharing app.


    After restarting, it will boot to the configuration console which lists all the
    addresses for accessing the various apps in the server.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_112_0.png)


    # Keep downloads on an external drive


    # 1 Mount external drive


    Format the external drive as NTFS. Then make sure the distro can read NTFS drives
    by installing the packages with sudo apt-get install ntfs-3g and create a mount
    point for the disk with sudo mkdir /media/usb-disk. Now plug in the USB device
    and find its device address with the sudo fdisk -l. Assuming there’s one partition
    called sdb1, mount it with sudo mount -t auto /dev/sdb1 /media/usb-disk.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_112_1.png)


    # 2 Setup remote access


    Install Samba with sudo apt-get install samba samba-common-bin to access the USB
    drive from remote systems. Then edit /etc/samba/smb.conf and uncommend the security=user
    line. Create a new section of the file (as above), and add a user called downloads
    to access the shares with sudo useradd downloads -m -G users and add them as a
    Samba user with sudo smbpasswd -a downloads.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_112_2.png)


    # 3 Create directories


    Next create new folders for Deluge to store downloads in. Use sudo mkdir /media/usb-disk/torrents/downloading
    and sudo mkdir /media/usb-disk/torrents/completed to create directories that will
    store incomplete and completed downloads. Create another directory with sudo mkdir
    /media/usb-disk/torrents/watch. We’ll configure Deluge to scan this directory
    and auto-add any new .torrent files.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_112_3.png)


    # 4 Plug them in Deluge


    Once the directories have been created, you’ll have to plug them into the Deluge
    desktop client. Fire up Deluge and head to Edit > Preferences. In the Preferences
    window, select the Downloads category, which lets you specify the different folders
    for storing downloads. Toggle the radio boxes next to the first two options and
    use the file manager to point to the folders you’ve created on the external drive
    attached to the box.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_112_4.png)'
