  md: '# THE HACKER''S MANUAL 2015


    # Welcome!


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_2_0.png)


    Hacker! Lock up the children and hide the silver! Hacking has a bad name in the
    mainstream press. Given that the papers tend to use the term in relation to criminal
    activities, you''d be forgiven for thinking that all hacking was pure dagnasty
    evil and, of late, preoccupied with uncovering ill-advised nude photos of celebrities.


    Hacking has much nobler roots, however. It''s generally held as originating at
    MIT, in the 1960s, as a term for the crème de la crème of programmers. They were
    the master alchemists of languages such as Fortran, and known for pushing them
    beyond their limitations – what they achieved often felt like magic.


    Hacking is really about making the most of your systems, turning the conventional
    into the unconventional, and subverting tools to tasks no one thought possible.
    And like the original hackers it''s about a hunger for knowledge, which is why
    we''ve laid out the best tutorials and the most useful features from the last
    year of Linux Format as a feast for the hungry hacker to devour.


    You''ll learn things like how to stay anonymous online; how to secure your phone
    or run a Linux distro on it; how to take control of our data and set up a personal
    cloud and even learn a few web cracks that the ''Dark side'' may try to fling
    in your direction.


    We think this year''s Hacker Manual is the best one yet. Tuck in and enjoy the
    hack!


    chris


