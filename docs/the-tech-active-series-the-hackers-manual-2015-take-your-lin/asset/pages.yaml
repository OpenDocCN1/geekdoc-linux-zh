- pgno: 7
  md: '# Privacy


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_7_0.png)


    # Are you fed up of being tracked online? We show you how to take control of your
    online privacy.


    You are being watched by three-letter organisations and billion-dollar corporations.
    They can read every email you send, every comment you post and every photo you
    share. They know what articles you read, what videos you watch, and where you
    like to shop. These people know you don’t like being monitored but the truth is
    they don’t care. Your online activities are tracked in the name of national security
    and under the garb of targeted advertising.


    Our individual liberty is under attack by technology. You can’t turn a blind eye
    towards the monitoring just because you have ‘nothing to hide’ either; because
    former NSA contractor, Edward Snowden’s whistleblowing has revealed clandestine
    operations and pervasive databases that log all our online activities.


    rewritten to make it easier to get access to your personal data. We laud any such
    efforts if they help keep us safe, but we are disgusted when our private data
    makes its way to corporations who fill their coffers by selling it. In this feature
    we’ll look at some of the best tools available to protect your privacy online.
    We’ll show you the kind of information you are leaking inadvertently and how that
    information is being misused. You’ll also learn how to control your visibility
    and become a private citizen on the web.


    > > “These people know you don’t like being monitored but the truth is they don’t
    care.”


    This Orwellian loss of privacy has its roots in the unbridled exchange of electronic
    information. There’s no omnipresent Big Brother as such. Instead what we have
    are hundreds of ‘Little Brothers’ that follow us around as we use and traverse
    the internet.


    irrespective of whether you are a bona fide criminal or a law-abiding subject.
    Privacy isn’t just about hiding things either; it’s about controlling what details
    of our lives we keep to ourselves and what we share with the world, and laws around
    the world are being


    citizen on the web. There’s nothing sneaky or illegal in what we show you. This
    feature is all about being aware of the dangers of losing your privacy and protecting
    yourself from illegal surveillance, identity thieves and governments (oppressive
    ones or not).'
