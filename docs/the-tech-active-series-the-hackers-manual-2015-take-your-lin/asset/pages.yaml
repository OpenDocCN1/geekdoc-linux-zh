- pgno: 24
  md: "the **OwnCloud** admin panel lets you download and export the system core files,\
    \ the user files or the complete cloud (user data, files and database), for backups\
    \ or migration. While doing this only takes a click, they are manual clicks. Installing\
    \ applications found on **http://apps.owncloud.com**, or elsewhere is easy — upload\
    \ and unpack their source files in the apps sub folder of *OwnCloud*, then configure\
    \ them in the apps section of the administration panel.\n\n# Updates and upgrades\n\
    \nOwnCloud software maintenance explicitly distinguishes between updates and upgrades.\
    \ Both procedures are simple and clearly explained on the *OwnCloud* website,\
    \ so here we will mention only the main points you need to know in advance. The\
    \ first, obvious, one is: always make complete backups before any maintenance.\n\
    \nUpdates are changes from one point release to the next, for example from version\
    \ 4.5 to 4.6. Upgrades are passages to a major version number. Knowing this is\
    \ not a purely formal definition, without practical consequences — upgrades are\
    \ made to use the last minor version as the starting point.\n\nIn other words,\
    \ while skipping intermediate versions of *OwnCloud* is not a secure disaster,\
    \ it is a pretty reliable way to stumble into interesting, usually undocumented\
    \ annoyances. The most common cause of such problems is the same for any application\
    \ that consists of “PHP plus a database.” Upgrading this kind of program almost\
    \ always means both installing new PHP files and running some automatic SQL queries\
    \ in the background to update the structure and content of the database.\n\nFiles\
    \ installed by mistake are easy to recognise and restore. SQL queries let loose\
    \ on a database that doesn’t have exactly the structure for which they were written\
    \ are a much dirtier business. They may damage the database enough to make a complete\
    \ reinstallation from backups of the old version the only sensible way out. So,\
    \ do yourself a favour — never skip versions, and constantly keep your *OwnCloud*\
    \ as up to date as possible.\n\nAnother maintenance issue you can’t ignore is\
    \ what happens to optional or third-party apps every time you change the *OwnCloud*\
    \ software. From this point of view, updates should never be a problem, but upgrades\
    \ require more effort. In general, you must always deactivate all third-party\
    \ apps from the administration panel before an upgrade. In addition to that, an\
    \ *OwnCloud* app you use may not be compatible with a new major version. In that\
    \ case, you should either delay upgrade or temporarily do without that app.\n\n\
    The main value of *OwnCloud* is its portability. Configure it in the right way\
    \ and (especially if you did get your own\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_24_0.png)\n\
    \n> **Where is that file? In your OwnCloud or on your hard drive? It doesn’t matter\
    \ actually, because you can access it both ways.**\n\ndomain name), you can recreate\
    \ your *OwnCloud* at any moment, with very little effort, on the same or any other\
    \ web server, without any disservice. In order to do this, you need to set up\
    \ automatic, regular backups of at least three things:\n\n+   1. **The whole data\
    \ folder** — that is, the box that contains all the user files and other data.\n\
    +   2. **The database.** If you chose *SQLite*, this step is included in the first\
    \ one. Otherwise, you need to set up a daily *cron* job that dumps the whole database\
    \ to one plain text file, that you’ll back up with the others. You can generate\
    \ such dumps with **mysqldump** or, for *PostgreSQL*, **pg_dump**.\n+   3. **The\
    \ configuration.** The next thing to secure is the **config.php** file in the\
    \ *config* sub-folder, which contains the database credentials and other general\
    \ variables.\n\nDepending on your web server, you may also have to back up HTTP\
    \ and/or PHP configuration files. If you do this regularly, for example with a\
    \ daily cron job, either migrating your *OwnCloud* to another server or recovering\
    \ from a crash should be almost painless. To do this, first make sure that the\
    \ web server/PHP configuration of the new site is identical to or at least compatible\
    \ with, the old one. Next, unpack the pristine source files of the same version\
    \ of *OwnCloud* you were running (you must keep a copy of the original archive,\
    \ too), and recreate the database.\n\nFinally, put the data folder and the **config.php**\
    \ file in their place in the new *OwnCloud* root directory. If the username or\
    \ password for the external database must be different from the original one (some\
    \ providers impose their own naming rules), write the new values inside **config.php**.\
    \ That’s it!\n\n# What about security?\n\nSecurity in *OwnCloud* deserves its\
    \ own section for two reasons. One is that it is essential, so it deserves to\
    \ stand out, even visually. We don’t have enough space to cover this topic exhaustively,\
    \ and couldn’t be as up to date as the website anyway, but we do want you to know\
    \ that you must think about it.\n\nAnother reason to just mention the issue briefly\
    \ is that it’s pretty straightforward. The main things you must do to secure *OwnCloud*\
    \ are pretty much the same ones that are needed for any LAMP application. They\
    \ are very well documented all over the net, so we will mention them to let you\
    \ know what to search for. To begin with, enable basic authentication for your\
    \ web server. On *Apache*, this may mean adding an entry similar to this to the\
    \ configuration file, to enable the access control file that comes with *OwnCloud*:\n\
    \n```\n```apache\n<Directory /complete/path/to/owncloud/>\n    AllowOverride All\n\
    </Directory>\n```\n```\n\nThis is just an example. Check the *OwnCloud* website\
    \ for detailed, up-to-date information on authentication and HTTPD directives\
    \ for your server and Linux distribution. The second thing to do is to get an\
    \ SSL certificate to use for encrypted HTTP connections. Last but not least, make\
    \ sure that your installation is not letting unauthorised users access single\
    \ files inside *OwnCloud*, by following the tips on this forum: **http://forum.owncloud.org/viewtopic.php?f=3&t=6659**."
