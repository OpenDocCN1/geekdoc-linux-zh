- pgno: 83
  md: "![](img/b6e789f7b1bc6629f6c97a3e4beae1de_83_0.png)\n\nThe Zinnia app is pretty\
    \ impressive in its own right.\n\nWe also need to tell uWSGI how Nginx is arranged,\
    \ so we need to put a copy of its bundled parameters into your project directory:\n\
    \n```\n(env) $ cp /etc/nginx/uwsgi_params ~/django/my_demo\n```\n\nTo configure\
    \ Nginx for your demo site, you now need to create a file /etc/nginx/sites-available/mysite_nginx.conf\
    \ with the following contents, replacing 'user' with your username where appropriate:\n\
    \n```\nupstream django {\n  server 127.0.0.1:8001;\n}\n# configuration of the\
    \ server\nserver {\n  listen 8000;\n  server_name 127.0.0.1; # substitute your\
    \ machine's IP address or FQDN\n  charset utf-8;\n  client_max_body_size 75M;\n\
    \  location /media {\n    alias /home/user/django/my_demo/media;\n  }\n  location\
    \ /static {\n    alias /home/user/django/my_demo/static;\n  }\n  location / {\n\
    \    uwsgi_pass django;\n    include uwsgi_params;\n  }\n}\n```\n\nSymlink this\
    \ file in /etc/nginx/sites-enabled, ensure that this folder is included in your\
    \ nginx.conf, and then fire up Nginx. Once that's done, run the following in the\
    \ directory ~/django to start uWSGI:\n\n```\n(env) $ uwsgi --socket 8001 --module\
    \ mysite.wagi\n```\n\nHopefully, you will find that all the bits are talking to\
    \ each other, and that your Django site is now accessible through http://localhost:8000\
    \ – only this time it is being served by a grown up webserver, which accesses\
    \ it through a gateway running on port 8001, which in turn talks directly to the\
    \ Python application. It's better practice to use a Unix socket rather than a\
    \ TCP for the gateway, as it results in less overhead and more speed, so replace\
    \ the server line in the upstream{} block in /etc/nginx/sites_available/mysite_nginx.conf\
    \ with:\n\n```\nserver unix:///home/user/django/mysite.sock;\n```\n\nStart uWSGI\
    \ with:\n\n```\n(env) $ uwsgi --socket mysite.sock --module mysite.wagi --chmod-socket=666\n\
    ```\n\nEverything should appear as before, but this time you should get those\
    \ special warm and fuzzies that come with things running more efficiently. Since\
    \ Nginx won't be allowed to talk to user sockets by default, it is necessary to\
    \ force these rather permissive permissions. In a more serious set up uWSGI would\
    \ be run system-wide and by an appropriately locked-down system account, probably\
    \ in the same group as the owner of the Nginx daemons.\n\nAnd that, children,\
    \ concludes today's lesson. I wish you nothing but the best in the continuance\
    \ of your adventures in clean, modular and extensible websites.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_83_1.png)\n\
    \nOh Lord, won't you buy me... This site is built with Django CMS."
  merge: -1
