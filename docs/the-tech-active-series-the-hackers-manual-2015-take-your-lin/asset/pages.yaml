- pgno: 41
  md: '# Skills: Streaming, emulation and GPIO


    # Hack #5: Stream music from the web


    We’ve got music everywhere. In addition to DRM-free tracks on the hard disk, you’ve
    probably got hundreds of tracks on Spotify or Google Play. You can get them all
    together with the Pi MusicBox distro which transforms the Raspberry Pi into the
    ultimate music player.


    The Pi MusicBox can output music through speakers attached to the headphone jack
    of the Pi, and also through the HDMI and USB ports. So all you gotta do is install
    the distro, hook up some speakers to the Pi, plug in your account credentials
    and let it rip. You can then control your juiced up Pi from any computer on the
    network and even from any Android device.


    Begin by downloading the compressed image for the Pi MusicBox distro from www.pimusicbox.com.
    Extract the downloaded ZIP file and then put the .img image file on your SD card
    with the dd command, such as sudo dd if=musicbox0.5.img of=/dev/sdd. Remember
    to replace /d/ev/sdd with the location of your SD card.


    If you use the Ethernet port to connect the Pi to the internet, you can boot the
    Pi from the newly created SD card. However, if you use a wireless card, you’ll
    need to edit the distro’s configuration file and manually point it to your wireless
    router. Access the newly created SD card from a regular distro and navigate to
    the config folder and open the settings.ini file in a text editor. Near the top
    of the file you’ll notice two variables, WIFI_NETWORK and WIFI_PASSWORD. Insert
    the corresponding values of your network next to these two variables and save
    the file. The caveat is that PiMusicBox will only work with WPA2-protected wireless
    networks.


    Once that’s done, boot the Pi with the configured SD card. On first boot, the
    distro will resize the filesystem to take over the complete card, and restart
    automatically. If you have a monitor attached to the Pi you can follow the booting
    process, otherwise wait a minute or two, then fire up a browser on any computer
    on your network and head to http://musicbox.local. If that doesn’t take you anywhere,
    then point your browser to the IP address of the Pi.


    The default interface of Pi MusicBox is rather bland since you haven’t configured
    any music source yet. To fix that, click on the Setting link in the navigation
    bar on the left. This will take you to a page where you can individually enable
    and configure all the support streaming services, from premium ones like Spotify
    and Google Music to free ones like The Internet Archive, Soma FM, and more. You
    can also control other settings from this page. For example, the Audio setting
    lets you switch audio output devices.


    The Pi MusicBox distro has a working Samba configuration and should show up in
    the Network section inside the file manager of all OS’s. The distro’s Samba share
    only has one folder named Music. You can put any audio file inside this folder
    and they’ll be transferred to the SD card.


    Whenever you restart the Pi, the distro will scan for any new music at boot up.
    You can then browse through and play these files from the distro’s web interface.


    You can also play music via any software that supports the Music Player Daemon
    (MPD) such as the MPDroid app for Android. To connect, launch the app and in the
    first-run wizard, enter the IP address of the Pi in the hostname field.


    # Hack #6: Broadcast audio


    Streaming music into the Pi is one thing. What if you wish to stream music out
    to other devices? While you’re at it, how about running your own radio station?
    As it happens, you can do so without too much trouble.


    Besides the familiar Audio, Ethernet, HDMI, and USB ports on the Raspberry Pi,
    the device also has interfaces that are designed to connect more directly with
    other chips and modules. These General Purpose Input/Output (GPIO) ports are the
    pins arranged in two parallel strips (26 on the Model B board and 40 on the B+).


    These interfaces are not plug-and-play but can be controlled through software.
    A bunch of hackers over at Code Club wrote a program to use the pins intended
    to generate spread-spectrum clock signals to instead output FM Radio signals.
    To transmit a surprisingly strong FM signal, all you need is to attach a wire
    to the GPIO 4 pin. Even without the wire, the FM signal broadcast by the Pi will
    be picked up by nearby FM receivers.


    Power up the Pi and bring up a terminal. Now grab the code written at the Code
    Club and extract it with wget: http://comatos.com/pifm.tar.gz


    ```

    mkdir ~/pifm

    tar zxvf pifm.tar.gz -C ~/pifm

    ```


    The tarball extracts six files. Surprisingly that’s all there’s to it. You can
    now broadcast the included sound.wav file with sudo ./pifm sound.wav 101.2. Now
    grab a FM receiver and set it to FM 101.2 and you’ll hear the Star Wars theme.
    You can actually change the broadcast frequency from anywhere between 88 MHz and
    108 MHz simply by appending the channel frequency at the end of the command.


    You can play other audio files as well, but they must be 16-bit 22,050Hz mono
    and in the WAV format only. That


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_41_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_41_1.png)


    > Pi MusicBox is based on the Mopidy music server that’s written in Python.'
