- pgno: 22
  md: '![](img/b6e789f7b1bc6629f6c97a3e4beae1de_22_0.png)


    The standard OwnCloud Calendar – simple, but useful and easily synchronisable
    with desktop or mobile devices.


    decent calendaring application, including those on any smartphone, can manage
    it without problems these days.


    # A container of applications


    In addition to all this, OwnCloud has another feature, still very under-used but,
    in our humble opinion, with huge potential: OwnCloud is born to be a container
    and can offer an unified point of access for completely independent, FOSS-based,
    third-party online services. An OwnCloud administrator can extend its services
    in many ways, installing the many optional applications listed at http://apps.owncloud.com.


    We’ll highlight a small selection of these applications, just to present the general
    concept. You may, for example, keep notes inside ownCloud with the three different
    applications that follow. The simplest one, which is also the easiest to sync
    with mobile devices, is called Notes, you can use it to save task descriptions,
    to-do lists and similar things as ordinary plain text files. AllNotes supports
    basic HTML formatting and note tagging. The OwnCloud Journal goes one step further.
    You can sort, filter and search by date or time range all the diary entries you
    store inside it. Internally, the Journal entries are saved as records in the OwnCloud
    Calendar, and can be shared with other users.


    Of course, there are OwnCloud apps can do much more than keep notes. A Theme Manager
    lets the administrator change the look and feel of the whole website with a few
    clicks. There’s also a player for impress.js online slideshows, and a synchroniser
    to keep the same Firefox configuration across all your computers and accounts.
    There’s an interface to republish pictures loaded into ownCloud on WordPress blogs.
    We also believe that many users may fall in love with the basic Bookmark Manager
    in (See bottom, p26) or with Shorty, the ownCloud app that enables you to organise
    bookmarks and share them through several external URL shortening services.


    The future of OwnCloud, however, is in integration – why reinvent any possible
    wheel when you can embed the real thing? For instance you can see an already-working
    example of this category of ownCloud apps (pictured top, p29), the one that enables
    you to log in to your Roundcube account and use it as an OwnCloud tab, instead
    of developing yet another free software webmail client – Isn’t that wonderful?
    Of course, all this requires a little bit of easy setup on the


    of thing with closed cloud services!


    Desktop access to OwnCloud possible, in general, from any file manager that supports
    the WebDAV protocol – you must simply tell it to load the WebDAV URL that’s listed
    in your configuration panel. Detailed instructions on how to use that URL with
    several file managers are available online at: http://owncloud.org/support/webdav.


    # OwnCloud from your desktop


    Regardless of file managers, there are ownCloud desktop clients to keep a local
    folder on your computer constantly in sync with one in the online account, much
    as it happens with Dropbox. (The official website lists clients for Linux, Windows
    (XP, Vista, 7 and 8, 32- or 64-bit) and Mac OS X 10.5 or newer, and for Intel
    64-bit).


    Installing the Linux ownCloud client isn’t very difficult – the official site
    has a breadcrumb trail that tunnels you to either the right one-click install
    package or provides the relevant repos for the binary packages for most of the
    popular distributions. We loaded the latest client on Fedora 20 with:


    ```

    cd /etc/yum.repos.d/

    wget http://download.opensuse.org/repositories/isv:ownCloud:desktop/Fedora_20/isv:ownCloud:desktop.repo

    yum install owncloud-client

    ```


    OwnCloud can be installed and managed without particular problems by everybody
    with a basic knowledge of


    user’s side, and the first thing to do with your brand new ownCloud account is
    to click on the gear icon in the bottom left-hand corner. This opens the user
    configuration panel, where you can find or set crucial parameters or perform important
    operations.


    The various things that you can (and must!) set include the email address to use
    for password recovery, and the language of the user interface. Oh, and don’t forget
    to copy the value of the WebDAV URL. If versioning was enabled at installation
    time, you’ll also have the ability to cancel old versions of your files that you
    don’t need any more. The configuration panel enables each user to download all
    of their files and data as one ZIP file, in a format that can be loaded with just
    one click in another ownCloud installation. Try doing that kind


    # What is your file size?


    By default, OwnCloud limits the size of each single file you can upload (at least
    from the web interface) to 512MB, which is obviously too small for many users.
    A whole page of the official documentation is devoted to this issue, but here
    is its one-sentence summary: “You can easily raise that limit to whatever you
    want, as long as your web hosting provider, if you aren’t running your own server,
    allows it. This is because, strictly speaking, raising the file size limit may
    be as simple as adding a


    ```

    <IfModule mod_php5.c>

    php_value upload_max_filesize 4096M

    php_value post_max_size 4096M

    </IfModule>

    ```


    to your PHP configuration file, or in a separate file. However, this will work
    only if both the web server and the PHP interpreter were configured by their administrator
    to let you play these tricks. See http://bit.ly/HluLu for details.'
