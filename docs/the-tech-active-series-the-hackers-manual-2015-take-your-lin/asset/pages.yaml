    range of chips, but you’ll probably want to choose something much newer. If you
    have a Core i3/i5/i7 processor, for instance, you will want to choose the Core
    2/newer Xeon option. Don’t expect to be blown away by a massive increase in system
    speed, but at


    # A day in the life of a kernel


    If you’re fairly new to the world of Linux, or you’ve just never spent much time
    looking at the technical underpinnings of your operating system, you’re probably
    aware that the kernel is the core part of an installation and does all of the
    important work – but what exactly is this work? For clarity, let’s examine the
    kernel’s key jobs in a little more detail:

    Running programs The kernel is effectively the boss of all running programs. You
    can’t have one program hogging the entire processor, and if that program happens
    to lock up, you don’t want everything else to be inaccessible. So the kernel gives
    programs their own slots of CPU time, ensuring that they all get on together and
    that one program can’t take over the machine. The kernel can also kill running
    programs and free up their resources.

    Accessing hardware Very few end-user programs interact directly with hardware.
    You don’t want two programs trying to access, for example, the same USB port at
    the same time, leading to all sorts of horrible clashes. So the kernel deals with
    your hardware, providing drivers to access specific devices, and also providing
    abstraction layers so that higher-level software doesn’t have to know the exact
    details of every device.

    Managing memory Just imagine if every program had free rein over your RAM. Programs
    wouldn’t know who owns what, so they’d end up trampling over each other, and then,
    suddenly, that word processor document you had open could suddenly be full of
    sound data. The kernel allocates chunks of RAM to programs and makes sure that
    they are all kept separately from one another, so if one program goes wonky, its
    mess-up can’t infect the RAM area of another program.'
