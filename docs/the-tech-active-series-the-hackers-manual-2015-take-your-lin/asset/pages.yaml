    coding experience you should still get something out of it.


    Database (PDB). The Browse button in the console window will let you see all of
    these procedures, what they operate on and what they spit out. We can access every
    single one of them in Python through the pdb object. As a gentle introduction,
    let''s see how to make a simple blank image with the currently selected background
    colour. This involves setting up an image, adding a layer to it, and then displaying
    the image.


    ```

    image = pdb.gimp_image_new(320,200,RGB)

    layer = pdb.gimp_layer_new(image,320,200,''RGB'',''Layer0'',100,_RGB_IMAGE)

    pdb.gimp_image_insert_layer(image,layer,None,0)

    pdb.gimp_display_new(image)

    ```


    # Get started


    On Linux, most packages will ensure that all the required Python gubbins get installed
    alongside Gimp; your Windows and Mac friends will have these included as standard
    since version 2.8. You can check everything is ready by starting up Gimp and checking
    for the Python-Fu entry in the Filters menu. If it''s not there, you''ll need
    to check your installation. If it is there, then go ahead and click on it. If
    all goes to plan this should open up an expectant-looking console window, with
    a prompt (>>>) hungry for your input. Everything that Gimp can do is registered
    in something called the Procedure


    So we have used four procedures: gimp_image_new(), which requires parameters specifying
    width, height and image type (RGB, GRAY or INDEXED); gimp_layer_new(), which works
    on a previously defined image and requires width, height and type data, as well
    as a name, opacity and combine mode; gimp_image_insert_layer() to actually add
    the layer to the image, and gimp_display_new(), which will display an image. You
    need to add layers to your image before you can do anything of note, since an
    image without layers is a pretty ineffable object. You can look up more information
    about these procedures in the Procedure Browser – try typing gimp-layer-new into
    the search box, and you will see all the different combine modes available. Note
    that in Python, the hyphens in procedure names are replaced by underscores, since
    hyphens are reserved for subtraction. The search box will still understand you
    if you use underscores there, though.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_135_0.png)


    You can customise lines and splodges to your heart''s content, though frankly
    doing this is unlikely to produce anything particularly useful.


    # Draw the line


    All well and good, but how do we actually draw something? Let''s start with a
    simple line. First select a brush and a foreground colour that will look nice
    on your background. I''ll throw the following at the console:


    ```

    pdb.gimp_pencil(layer,4,[80,100,240,100])

    ```


    Great, a nicely centred line, just like you could draw with the pencil tool. The
    first parameter, gimp_pencil(), takes just the layer you want to draw on. The
    syntax specifying the points is a little strange: first we specify the number
    of coordinates, which is twice the number of points because each point has an
    x and y component; then we provide a list of the form [x1, y1, ..., xn, yn]. Hence
    our example draws a line from (80,100) to (240,100). The procedures for selecting
    and adjusting colours, brushes and so forth are in the PDB too:


    ```

    pdb.gimp_context_set_brush(''Cell 01'')

    pdb.gimp_context_set_foreground(''#00a000'')

    ```'
