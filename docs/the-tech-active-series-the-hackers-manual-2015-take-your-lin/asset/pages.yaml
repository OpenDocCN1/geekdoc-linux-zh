- pgno: 26
  md: '# Administration


    One of the great things about the public services is that they just work. You
    have no setting up to do beyond creating an account, you don’t have to worry about
    backups, storage requirements, network security, DDoS attacks or a host of other
    concerns. If you really want to go it alone in a serious way, you need to consider
    these just as you would for traditional computing and data storage systems. Of
    course, the risks can be turned into benefits.


    Using a private cloud to store all your files introduces a single point of failure,
    but it also means that you only have


    one location to back up. Syncing one cloud server to an off-site location is simpler
    than doing the same for a dozen or two desktops. The file versioning and undelelete
    features provide protection against ID-ten-T user errors that you don’t get when
    someone accidentally deletes the wrong folder from their desktop. If you are running
    your service on a private network, some of these concerns do not apply, and if
    you already have a public-facing web server, they should already be addressed,
    so the situation is not as scary as it may first appear. But don’t use critical
    data or services on your first try.


    download two files – main.inc.php and db.inc.php. Copy these to the config directory
    of your Roundcube installation. Then click on ‘Continue’ and your configuration
    will be tested. Correct anything that is flagged up, either by going back to the
    previous page or by editing the files directly, and reload the test page. You
    should also test the SMTP and IMAP settings here. Note the big red warning at
    the end of the test page – make sure you remove or disable the installer once
    Roundcube is set up, otherwise anyone can see your settings and passwords.


    depends mainly on the speed of the connection you have between the web server
    and your mail server; running them on the same computer makes a big difference,
    and the amount of junk – sorry, mail – you hang on to.


    The settings menu contains options to change both the behaviour and appearance
    of Roundcube, while the website at http://roundcube.net has a wiki with plenty
    of information on tweaking Roundcube to suit your needs. There are also plenty
    of plug-ins available from this website, which can be installed to enhance the
    features and appearance of Roundcube. Plug-ins are supplied as archives, usually
    TAR or ZIP, which should be unpacked into Roundcube’s plug-ins directory – you
    will find there already several present with a default installation. Plug-ins
    are disabled by default; you enable them by adding their names, as they appear
    in the plug-ins directory, to the $rcmail_config[''plugins''] array in config/main.inc.php.
    For example, to add the included autologon plug-in and the third-party SpamAssassin
    plug-in, the setting would be:


    ```

    $rcmail_config[''plugins''] = array(''autologon'', ''sauserpref'');

    ```


    # Reading your mail


    The page that you’ll see when you load your webmail URL into your web browser
    depends on your settings. If you’ve set up a single mail server, it will go straight
    to asking for your username and password, otherwise you will see either a menu
    to select between the different servers you have set up or a text box if you have
    added no servers.


    The first time that you log in there will be a delay as your mailbox is scanned.
    The speed at which your mailbox loads


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_26_0.png)


    You’ll need at least one IMAP server from which to read emails and then an SMTP
    server used for sending.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_26_1.png)


    Roundcube is installed using its own web-based installer. The first step checks
    whether all system requirements are met.'
