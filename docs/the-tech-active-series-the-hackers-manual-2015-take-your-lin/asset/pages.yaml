- pgno: 62
  md: 'Image link. Here, you need to download four image files: boot.img, recovery.img,
    system.img, userdata.img and an MD5 checksum file. Then click on the Base URL
    link and get fastboot from the tools directory. Save all the files to the same
    directory and cd to that directory in a terminal. If you downloaded fastboot,
    make it executable with chmod +x fastboot


    If you already have fastboot installed, replace ./fastboot with fastboot in each
    of the following commands. Put the phone into fastboot mode by turning it off
    and then holding down the power and volume up buttons until the bootloader screen
    appears with "FASTBOOT MODE" at the top. Now connect the phone to your computer
    via USB. If you have not installed a custom ROM or rooted your device before,
    you will need to unlock the bootloader. If in doubt, look at the "LOCK STATE"
    line on the bootloader screen. If it shows locked, run this in your terminal:
    sudo ./fastboot oem unlock


    The phone will ask for confirmation – use the volume buttons to highlight your
    choice and power to apply it. Now flash the images to the device with these commands:
    sudo ./fastboot flash boot boot.img sudo ./fastboot flash recovery recovery.img
    sudo ./fastboot flash system system.img sudo ./fastboot flash userdata userdata.img


    After each command completes, you should see "Write Success!" on the phone.


    The third one takes a while – system.img is by far the largest of the files. Finally,
    clear the cache and reboot with sudo ./fastboot erase cache sudo ./fastboot reboot


    You should see the Replicant logo while booting, and then it loads to the home
    screen. You can tell you are no longer locked to Google by the way it does not
    ask you to sign in to a Gmail account first.


    # Keeping the firmware


    As mentioned, some functions require firmware files. Replicant does not provide
    these files, it does not even provide information on how to obtain them, although
    it does list the needed files on each device''s wiki page. If your phone is already
    rooted, you can simply copy these files to a safe location and restore them after
    installing Replicant. You usually need to root the phone after installing Replicant
    to do this by installing a custom recovery program. I prefer TWRP, from


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_62_0.png)


    Replicant contains a decent-sized selection of apps and widgets by default, with
    many additional ones available in F-Droid.


    http://teamw.in/project/twrp2 Download the correct image file for your device
    and flash it using fastboot, like so: sudo ./fastboot imagefile Then you can reboot
    into the bootloader, select Recovery, go to the Mounts and Storage section to
    mount /system and then send each file from the computer with adb, available from
    the same place as fastboot. They are the companion programs. sudo /adb push firmware.file
    /system/vendor/firmware/firmware.file using the correct locations for your device.


    If you switch the arguments and use pull instead of push, you copy the files from
    the phone to the computer, which is a good way of copying them off in the first
    place. sudo /adb pull /system/vendor/firmware/file firmware.file


    A custom recovery can also be used to make an Android backup for restoring your
    system to its previous state, should you wish, so it is well worth installing
    one before


    you start installing Replicant. Once you have Replicant booted, you can start
    to explore it. You will find it familiar territory – it is basically Android.
    There are a number of apps provided by default, with plenty more available through
    F-Droid. There is no need to install F-Droid with Replicant, it is included as
    the default repository and software manager with Replicant. If you want to return
    to a more default setup, you have a number of options. If you took a Nandroid
    backup, simply restore it. Or you can follow the usual procedure to install any
    of the custom ROMs. If you have a Nexus device, you can return to a default Android
    configuration by downloading and flashing the appropriate image from https://developers.google.com/android/nexus/images.
    These images are supplied as tarballs that contain the image files and a shell
    script to install them, it''s just a matter of unpacking the tarball and running
    sudo ./flash-all.sh


    If you find it too limited, at least you''ve been able to make a choice. If this
    is the case, do not give up on Replicant – check the website, as development is
    ongoing. It is good to know an open source phone OS is available, and always will
    be.


    > “It is good to know an open source phone OS is available and always will be.”


    # Rooting your phone


    There is a lot of misinformation about rooting phones. Leaving aside any contractual
    issues with your phone supplier, rooting a phone does not make it less secure
    or compromise it. That is because adding root capabilities to the phone does not
    add them to any apps. It is like the su or sudo commands on your desktop. These
    allow you to run programs as root, but do not give super user rights to everything
    else. Adding root to a phone means if an app wants to run as root, it has to ask
    your permission, which you can give once or for future invocations too. If you
    do not give such permission within a few seconds, the request times out and is
    denied. For added security, the default setting of the SuperSU program allows
    root access only for the version of a program that asked for it. When you update
    that program, you are asked again. Nothing can run as root without your say-so.'
