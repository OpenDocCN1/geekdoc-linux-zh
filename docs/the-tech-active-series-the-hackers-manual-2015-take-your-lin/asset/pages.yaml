  md: '# Such AWStats. Much graph. Very comprehensive. Wow.


    ```

    $ ssh-copy-id user@host

    ```


    Replace user and host with the user you set up before and the address of your
    VPS. This will append your public key to the file ~/.ssh/authorized_keys on the
    remote host. If you do have to copy your private key, make sure that its permissions
    (600) are preserved, otherwise you will find yourself castigated for insecure
    practices.


    Now test your freshly baked key. If you kept the default filename then you don’t
    need any special syntax, otherwise you’ll have to use the -i (identity file) option:

    $ ssh user -i ~/.ssh/private_key user@host


    If all has gone according to plan, you should be prompted for the passphrase for
    your private key and allowed to log in. With that done, we can change the following
    lines in sshd_config on our server to disable password authentication, the legacy
    v1 protocol and login by anyone other than user, and optionally change the port
    from the default 22:

    Port 2022

    Protocol 2

    PasswordAuthentication no

    AllowUsers user


    Now we restart the SSH server. If you are using the trusty Sysvinit scripts, this
    is simply just a matter of becoming root and running the command

    $ /etc/init.d/sshd restart

    or for Systemd:


    ```

    $ systemctl restart sshd

    ```


    Now the only people that can log in are those in possession of our key file. The
    server is now also running on a different port, which may deter some script kiddies,
    but also means you have to point your SSH client appropriately:

    $ ssh user@host:2022


    You can use ssh-agent to keep this key unlocked for the duration of your local
    session, which is a handy labour-saving device, although it comes at a small privacy
    cost. This is achieved with:

    $ ssh-add ~/.ssh/private_key


    If you are running some sort of Proper Desktop Environment, or have otherwise
    figured out how to shoehorn Gnome Keyring or some such onto your system, then
    you can even automatically unlock and load your key into memory upon login. Again,
    it’s handy but potentially insecure.


    It’s worth considering tunnelling any services you run explicitly for you or your
    authorised users over an SSH connection. For example, if you are running a VNC
    server, then rather than exposing it to the outside world, configure it to listen
    only on the local loopback address. VNC’s default port is 5900, so when we ssh
    from our local machine we forward this port to 5901 like so:

    $ ssh -L 5901:localhost:5900 user@host:2022


    > “Consider tunnelling services you run explicitly for you over SSH.”


    The part after the first colon is relative to the remote machine – we are forwarding
    its port 5900 to our 5901. Providing that the localhost alias is set up correctly
    in your server’s hosts file, you can now tell the VNC client to connect to your
    local machine on port 5901 (or display :1 in VNC parlance). All going well, you
    should have a working VNC session and that fuzzy warm feeling that comes when
    all your clicks and keystrokes are being sent over an encrypted channel.


    # Full lockdown


    Filtering outgoing packets is really only for the paranoid, but if the tinfoil
    hat demands it here is a quick summary of traffic you will probably want to allow
    before the big or REJECT rule.


    | Loopback traffic | Similar to incoming rules, use -o -j ACCEPT |

    | DNS | TCP and UDP on port 53. |

    | NTP | UDP port 123 |

    | HTTP(S) | TCP on ports 80 & 443 |

    | FTP | TCP on port 21 (Active FTP will initiate an incoming connection from the
    server’s port 20, but our established/related rule on the INPUT chain should take
    care of that) |

    | git | TCP 9418 |

    | ping | ICMP use --icmp-type 8 (echo) as in incoming rules |


    If you really want to fulfil the ultimate control freak sysadmin stereotype, then
    it’s possible to log all the packets that iptables rejects, but this can very
    quickly lead to oversized log files and full disks, which will be much more of
    a problem for you than someone scanning your box for non-existent SMB shares.


    # Playing with fire(walls)


    Setting up an iptables-based firewall is our next challenge. The iptables program
    filters packets based on rules, which exist in a table called filter and are grouped
    into three chains: INPUT for incoming packets, OUTPUT for outgoing packets and
    FORWARD for more advanced routing, with which we shall not concern ourselves.
    Likewise the other tables mange and nat. Each chain has a default policy, which
    is usually to accept all packets. Besides accepting them, we also have the target
    REJECT to vocally dismiss the connection, and DROP to silently ignore the'
