- pgno: 77
  md: '# OwnCloud 7:

    Own your data


    Oft'' accused of having their head in the clouds, Linux Format heads for the stratosphere.
    Also the latest release of OwnCloud.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_77_0.png)


    Build Service provides packages for popular distributions. Instructions are available
    at http://owncloud.org/install. On Ubuntu 14.04, for example, you would create
    the file /etc/apt/sources.list.d/owncloud.list containing the line: deb http://download.opensuse.org/repositories/isv:/ownCloud:/community/xUbuntu_14.04/
    apt Then (optionally) add the repo key to apt to suppress warning messages about
    foreign packages: wget http://download.opensuse.org/repositories/isv:/ownCloud:/community/xUbuntu_14.04/Release.key
    sudo apt-key add - < Release.key And finally update the package database and install
    a shiny (or watery?) new version of OwnCloud sudo apt-get update sudo apt-get
    install owncloud


    # Cloud provider


    As a responsible cloud host, one of your duties will be enabling and enforcing
    https connections. To do this you need to be in possession of a signedSSL certificate,
    and to tell your web server about it. (See the Generating a Self-Signed Certificate
    box on p.79). OwnCloud adds its own configuration file /etc/apache2/conf-available/owncloud.conf.
    This contains an alias that will map /owncloud on your server to its default install
    directory /var/www/owncloud. So navigate to https://yourserver.com/owncloud (replacing
    yourserver.com with your server''s domain name or IP address). If you are using
    a self-signed certificate, then you will receive a warning about the certificate
    being


    We''ve already highlighted how OwnCloud can help you evade proprietary cloud storage
    (see p22) but we''re going to have a look at the changes in the latest and greatest
    version 7 of the rapidly versioning filesharing and document-collaboration tool.
    In fact, by the time you read this version 7.2 will be released and, as the kinks
    are ironed out, what''s emerging is quite a remarkable product. You''ll need your
    own server in which to house your cloud. This might be local or remote, actual
    or virtual, it doesn''t really matter. What does matter is that, on the said server,
    you have a web server running that''s accessible from whatever network you want
    to share on. If this is the internet then usual caveats about safety apply (see
    p16). For this tutorial we assume a working Apache setup, but the same ideas spouted
    here apply to Nginx or Lighttpd. Your distribution''s repos might already have
    the latest version of OwnCloud available, but if not the lovely OpenSUSE


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_77_1.png)


    Document collaboration proved to be perfectly serviceable, but we didn''t really
    achieve productivity.'
