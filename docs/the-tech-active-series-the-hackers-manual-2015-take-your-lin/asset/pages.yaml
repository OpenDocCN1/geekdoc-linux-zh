- pgno: 18
  md: '# Secure VPS


    packets. The latter is good for evading detection, but annoying for diagnosing
    issues. You can examine your current iptables rules by running the following as
    root:


    ```

    $ iptables -L

    ```


    Let''s start with a tabula rasa by purging all currently operational rules (even
    though there properly aren''t any) and any extra chains:


    ```

    $ iptables -F

    $ iptables -X

    ```


    While it''s tempting to lock down everything here, and indeed an overly permissive
    firewall is not a good idea, it will be beneficial to concede that connection
    establishment and packet filtering are more complicated than you might think.
    It would, after all, be very embarrassing if you locked yourself out of your own
    machine.


    Our first two handy rules deal with traffic on the local interface. A lot of programs
    talk to each other this way, but we don''t allow traffic to access lo from the
    outside world. The third rule conveniently allows all connections that are currently
    established and any further connections which they engender. That should save
    you some heartache - you generally want to let in packets from the services to
    which you connect.


    ```

    $ iptables -A INPUT -i lo -j ACCEPT

    $ iptables -A INPUT ! -i lo -d 127.0.0.0/8 -j REJECT

    $ iptables -A INPUT -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    Now we ensure incoming SSH connections will not get summarily squashed:


    ```

    $ iptables -A INPUT -p tcp --dport 2022 -j ACCEPT

    ```


    The -A option indicates that we are appending this rule to the input chain, so
    that it is processed after all the other rules. We could also use -I INPUT to
    insert this rule at the top of the chain.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_18_0.png)


    With logging turned on we can see all the noisy broadcasts around us that we are
    ignoring.


    It''s also nice to enable your server to accept - and subsequently respond to
    - ping requests:


    ```

    $ iptables -A INPUT -p icmp -m icmp --icmp-type 8 -j ACCEPT

    ```


    And if you run a web server then you will want to allow http and https traffic:


    ```

    $ iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    $ iptables -A INPUT -p tcp --dport 443 -j ACCEPT

    ```


    Now it should be safe to reject all other incoming packets:


    ```

    $ iptables -A INPUT -j REJECT

    ```


    The rules for each of the chains are processed sequentially, so that any incoming
    packet that do not match any of the earlier rules is rejected.


    We have to save our iptables rules and ensure they are restored when/if you reboot.
    Exactly how you do this depends on your distro/init system. For some, the iptables-save
    command outputs the current rules to stdout, and for Systemd iptables.service
    loads the rules from /etc/iptables/iptables.rules. so the following will suffice:


    ```

    $ iptables-save > /etc/iptables/iptables.rules

    $ systemd enable iptables

    ```


    > “DROP: Good for evading detection, but annoying for diagnosing issues.”


    For Debian, the standard method is to save the rules per the above and then create
    the file /etc/network/if-pre-up.d/iptables with:


    ```

    #!/bin/sh

    /sbin/iptables-restore < /etc/iptables/iptables.rules

    ```


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_18_1.png)


    If you want to stay sane, don''t try to understand the pricing structure for EC2
    instances.


    Hopefully, your chances of getting owned have now been diminished. Exactly what
    you do from now on is up to you - not doing anything is pointless, but your VPS
    provider would probably approve. Having your Dropbox folder accessible on your
    server is sometimes handy, for instance, but on the other hand that might result
    in the proprietary chills, so why not set up an OwnCloud server (See p79)? Or
    how about subscribing to Linux Format and learn how to set up a simple Nginx (see
    the archives, LXF188) or Lighttpd web server? And then getting it to serve usage
    stats using the great AWStats? Whatever you do, be mindful of security, but if
    you do get hacked then starting over is trivial.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Escape

    Google

    And Facebook » Twitter » Flickr + more!


    Liberate your personal data from companies that want to nose through your emails,
    photos and friends and take over your life.


    Google Search


    I''m getting out of here


    We are using the cloud more and more. As internet connections get faster and more
    reliable, the convenience of having all our data available on all our devices
    becomes ever more attractive. However, there are disadvantages to using cloud
    services, particularly the free of charge ones that still have to make a profit
    somehow. There are many valid, albeit scary, questions you''ll want to mull over
    before trusting a third party to keep your data safe, and we''ve listed them below.
    The answers, as you will discover in this feature, are generally not what you
    want to hear.


    +   » Privacy Is your data stored or is it mined for advertising and marketing
    purposes?

    +   » Reliability Can you be certain that the service you''re using will always
    be available?


    What guarantees do you have regarding the safety of your data and is there anything
    you can do to improve this?


    +   » Security Is your data encrypted? Who has access to the encryption keys?
    Could your data be hacked or stolen?


    > “What guarantees do you have regarding the safety of your data?”


    +   » Continuity Can the cloud provider suspend or cancel your account, possibly
    even losing all your data, for any reason?

    +   » Performance Is your internet connection fast enough to use the services
    that you want without delays?

    +   » Copyright Who owns the content you upload? Can your photos be sold or published
    without your consent?


    While a large company''s security and backup policies are likely to be better
    designed and implemented than your own, you still have the questions about what
    they can do with your data. You may feel that allowing them to parse emails to
    provide more relevant advertising, which you may or may not ignore, is a fair
    price for a free service. On the other hand, you may want to keep private emails
    just that, and if you are using email for business, you''ve even more concerns.
    You are not only responsible for your own data but that of organisations you deal
    with. You may also be concerned about keeping private information within your
    private network, not only for commercial secrecy but also data protection and
    preserving the privacy of the people an organisation deals with.'
