- pgno: 70
  md: 'example, it''ll be in the author''s home directory, but it could be anywhere
    (on a separate drive is a good idea if you plan to leave it running for a while).


    ```

    mkdir /home/ben/data

    ```


    ```

    sudo justniffer grab-http-traffic -d /home/ben/data -U ben -i wlan0

    ```


    In both cases, you''ll need to change ben to the username that you want to have.
    The -U option tells it which user to save the files as.


    If you connect to the hotspot using a computer, tablet or phone, and surf the
    web, you should see the data directory filling up with files for every unencrypted
    web page viewed. This will include the contents of any web-based email they read
    that''s not transmitted using HTTPS (Gmail does, so won''t be readable: most others
    do not).


    Of course, not everything you may want to intercept goes over HTTP, and many other
    protocols are unencrypted (such as FTP and Telnet). Fortunately, there are other
    tools to help you attack them. For example, dsniff (http://monkey.org/~dugsong/dsniff
    and in the HackWeb folder) will pull all unencrypted passwords out of network
    traffic.


    Both of these tools are passive. That means they make a copy of the data, but
    otherwise let it through untouched. We can step things up a notch, but to do this
    we need to use an active attack, specifically sslstrip (see HackWeb folder).


    This exploits the nature of web links, and the fact that the web has some pages
    encrypted and others not. Basically, it watches all the unencrypted web traffic
    and waits for links or redirects to HTTPS sites. It then starts an MITM attack,
    where it (sslstrip) requests the secure version of the website, and then serves
    it as plain HTTP to the browser.


    It is possible for a site to block this kind of attack, but it''s beyond the scope
    of this article to go through how. However, we found that several major websites
    (including Facebook and Yahoo!) were vulnerable. We reported the issues to their
    security teams. Facebook replied that they recommend enabling the secure browsing
    setting. However, this failed to stop the attack, and they didn''t respond to
    us when we pointed this out to them. Yahoo didn''t respond at all.


    # Get encrypted


    You can view the internet a bit like the postal service. Data is normally sent
    unencrypted, which is like sending it on a postcard. Any number of people could
    read this between when you send it and when it arrives, and the same is true of
    information sent as HTTP, FTP, Telnet or any of the other unencrypted postcards.
    There are times when this doesn''t matter – you may not care that your granny''s
    postman knows that the weather in Spain is lovely – and there are times when it
    does – you probably don''t want your postman to know your bank account details.
    The same is true online. If you don''t want your information to be publicly readable,
    make sure you use an encrypted protocol (HTTPS, SFTP, SSH, SCP and so on).


    To help make this a little easier, the Electronic Frontier Foundation (EFF) has
    produced a browser extension for Firefox (the Chrome version is in alpha) called
    HTTPS Everywhere. This makes sure you use the encrypted version of a site by default
    if it exists. If the site doesn''t have an encrypted version, it will still serve
    the unencrypted version, so you still need to be vigilant.


    As we saw with sslstrip, you need to be particularly careful when using an open
    network, even if the site''s normally encrypted. Remember to check that you''re
    really using HTTPS before entering any information.


    The encrypted protocols keep the data private, but they don''t disguise which
    servers you''re using. For example, an intruder may be able to discover you''re
    using gmail.com but they can''t find out your username or what emails you''re
    sending or receiving. If you need anonymity as well as encryption, you''ll need
    to use a VPN or Tor (http://torproject.org) to obfuscate or add misdirection to
    all of your traffic. Note that you still need to use an encrypted protocol with
    these to provide protection.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_70_0.png)


    > Using justniffer, we were able to grab emails that had been sent to a phone
    attached to the hotspot.


    # Certificate attacks


    All forms of encryption are based around keys. These are a bit like passwords
    in that they let you decrypt a document. There is always a challenge in making
    sure both parties to an encrypted communication know the keys to decrypt it. On
    the web, certificates are used. These certificates are generated by trusted authorities,
    and guarantee that the data you''re getting (and the keys used) really come from
    the site they claim to. This process of certifying sites is open to attack. For
    example, if you can load a certificate into a browser as a trusted authority,
    you can then generate your own fake certificates that the browser will then trust.
    Doing this, you can then set up a Man In The Middle attack using a fake certificate.


    To help penetration testers check encrypted sites, ZAP has the ability to create
    these trusted authorities and run attacks using them. There are also a number
    of commercial proxies designed to do this on a grand scale to allow, for example,
    companies to check what their employees are doing online.


    The bottom line is this: if someone else controls the computer, they can spy on
    everything you send over the web, regardless of HTTPS encryption.'
