- pgno: 85
  md: '# Python: Make a Twitter client


    We’ll show you how to do Twitter like a boss. A command-line boss that accepts
    arguments and catches errors.


    While prior studies have shown that a great deal of Twitter content can be categorised
    as, ‘phatic’, ‘pointless babble’ and ‘self promotion’, and a great deal more is
    just plain spam; it is nevertheless a fact that among all the chaff there is some
    highly-informative and up to the minute wheat. Or ‘information’ if you prefer.


    Twitter enables developers access to its comprehensive REST API, so that they
    can use custom applications to interact with various tweety resources in a sensible
    manner. While you could use the API directly in Python, you would have to write
    a bunch of messy code to parse your queries correctly or unwrap lengthy JSON responses.
    Mercifully, all of this has been done for you in the `python-twitter` module,
    available from all good distributions, or via `pip install` if you want the latest
    version.


    > “Twitter enables developers access to its comprehensive REST API.”


    Besides twittering, we will also see how command line options so are dealt with
    using the `argparse` module, as well as how to do some simple error catching.


    In order to use the REST API, you must register as a Twitter developer, so hop
    along to http://dev.twitter.com and declare yourself with your regular Twitter
    credentials. Then create a new application, populating the Name, Description and
    Website fields with anything you like. Leave the Callback URL field blank and
    click the create button. You will get shouted at if your application’s name contains
    ‘twitter’, so don’t do that. Now go to the Permissions section of your application
    and change its access to Read and Write. You want to be able to post stuff after
    all.


    Now go to the API Keys section and create an OAuth token. Now grab yourself a
    copy of the source code from http://www.linuxformat.com/files/hackman2015.zip,
    unzip it and populate config.py with the API Key, API Secret and Access Token
    Secret respectively. And now that the stage is set, let us see what people are
    saying about Linux Format with a quick search:


    `python twitter_api.py --search="linux format"`.


    Such slander! We have to escape the inner quotes so that bash doesn’t disappear
    our results, and the argument is passed quoted to the Twitter search function
    as a phrase. If you have a butchers at the code, you will see that twitter_api.py
    processes all the command line options and calls the relevant functions in twitter_functions.py.
    In the case of our search above, once we have set up our API object, then all
    it takes is a call to api.GetSearch() and we’ve got ourselves a list of 15 tweets
    on our chosen subject.


    Tweets have their own class with a GetText() method for extracting the content,
    but since this content could be in any character encoding we use the helper function
    safe_print() to force UTF-8 output where possible. You can read about all the
    available API methods from the command line with `pydoc twitter.Api` or you can
    visit the Google Code website here: http://bit.ly/1jz5qll. Note that the argparse
    module now replaces the old optparse module, providing a handy means of parsing
    command line arguments.


    Our search for Windows XP found a lot of worried people – survival kit indeed.
    Notice how nicely the unicode characters are printed.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_85_0.png)


    # Adding argparse


    By importing the argparse module and then creating an ArgumentParser object and
    calling parse_args() your program will get a -h or --help option for free. You
    can see this in action by creating a file called getArg.py with the following
    contents:


    ```

    import argparse

    parser = argparse.ArgumentParser()

    args = parser.parse_args()

    ```


    Then run python getArg.py -h to see your free usage message. As it stands this
    is not particularly useful, but once we start adding arguments this will change.
    Arguments can be positional (mandatory) or optional and we can add a mandatory
    argument to argparse.py by inserting the following just above the last line:


    ```

    parser.add_argument("gr_arg", help="Repeat what you just told me")

    ```'
