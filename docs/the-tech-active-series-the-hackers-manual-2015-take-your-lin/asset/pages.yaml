  md: '# your network


    # When things go wrong


    Although the project provides excellent documentation, if you’ve never worked
    with a network monitoring app such as Zabbix, there are a number of things that
    can go wrong. This is why you shouldn’t install it onto a production server without
    first familiarising yourself with the application.


    A misconfigured network monitor such as Zabbix can be a huge drain on your resources.
    The database can eat quite a bit of disk space if you don’t configure it to remove
    older data. There can also be other reasons why you may wish to shun Zabbix. For
    instance, you may find Zabbix is non-optimal for your needs, such as when it is
    overkill for your purposes.


    The documentation doesn’t itself provide any instructions for uninstalling Zabbix,
    so what do you do? Well, read on, of course!


    The most sensible solution is to disable Zabbix. But, first, head over to Configuration
    > Hosts and disable all the configured hosts. Next, uninstall zabbix-agent from
    all machines on the network and stop zabbix-server.


    Red means ‘you go no further’, but thankfully Zabbix provides more details on
    mouseover.


    features, and all that it hopes to accomplish, the interface may at times seem
    too complex and cumbersome to many users. Despite your reservations and initial
    impressions, we would suggest you press on with your Zabbix journey.


    # Installing Zabbix


    The project offers binaries for a few distributions, such as Debian and CentOS,
    and most distros carry Zabbix in their repositories. But, as is the case with
    many administration tools, the repos don’t always carry the latest version.


    We’ve used CentOS as the base on which we install zabbix-server. The network has
    other machines with other flavours of Linux, such as Linux Mint.


    You should already have all the required PHP and MySQL packages installed on the
    machine, but if you’re installing Zabbix on a fresh system, the following command
    will install the dependencies:


    ```

    su - "yum -y install mysql-server php5-mysql php5-gd"

    ```


    The best way to install Zabbix on CentOS is through the EPEL repository, as the
    stock repos don’t offer the latest version. If it’s not already configured on
    your machine, you will have to first set up the EPEL repo:


    ```

    su - "yum -y localinstall http://dl.fedoraproject.org/pub/epel/6/i386/epel-release-6-8.noarch.rpm"

    su - "yum -y install zabbix20-server-mysql zabbix20-web-mysql"

    ```


    The first command above will configure and enable the repository. In the second
    command, we specify the packages we wish to install, in this case Zabbix 2.0.x


    Zabbix supports MySQL, PostgreSQL and Oracle databases, and can store the collected
    data in any of these. The default configuration expects a database named zabbix.
    The default username for this database is zabbix, and no password is configured.
    You can edit the /etc/zabbix/zabbix_server.conf file in case you wish to change
    any of these pre-defined settings.


    If you do decide to change the database settings, make sure to keep these handy,
    as we will need them in just a bit


    when we create the database for Zabbix. You need to run the following commands
    from the terminal:


    ```

    mysql -u root -e "create database zabbix"

    mysql -u root -e "create user ''zabbix''@''localhost'' identified by ''ChangeMe''"

    mysql -u root -e "grant all on zabbix.* to ''zabbix''@''localhost''"

    mysql -u root -e "flush privileges"

    ```


    The commands above are all self-explanatory. We create the database in the first
    command and a user in the second. Make sure to specify the exact username and
    password that you’ve defined in the /etc/zabbix/zabbix_server.conf file. Refer
    to the box for more details on MySQL administration.


    Now that the database is in place, we are ready to populate it:


    ```

    mysql -uzabbix -p''ChangeMe'' zabbix < /usr/share/zabbix/mysql/schema.sql

    mysql -uzabbix -p''ChangeMe'' zabbix < /usr/share/zabbix/mysql/images.sql

    mysql -uzabbix -p''ChangeMe'' zabbix < /usr/share/zabbix/mysql/data.sql

    ```


    # Quick tip


    As all the data is recorded in a database, the more memory you have, the faster
    the database access.


    You can use the bar on the top-right of the graph to specify the time period.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_118_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_118_1.png)


    Subscribe to Linux Format http://myfavouritemagazines.co.uk/LINsubs'
