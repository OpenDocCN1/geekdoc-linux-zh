- pgno: 81
  md: '# Django: Build a custom CMS


    You hate WordPress, Drupal hates you and everyone hates PHP. What can you do?
    We have a suggestion that will help ease your CMS pain.


    The content management system (CMS) ecosystem is dominated by WordPress and Drupal.
    Both of these are fairly huge PHP/*SQL projects. WordPress was once a simple blogging
    platform, but has since grown into a tangled jungle comprising relics from the
    halcyon PHP4 days juxtaposed with modern object-oriented code. This is combined
    with all manner of themes and plugins for doing pretty much anything you can imagine.
    There’s no underlying framework for making all these extensions, so they are all
    done in a largely ad hoc manner, often rewriting core WordPress functions to achieve
    their ends. It has been theorised that the only explanation for all this stuff
    remaining cohesive is the strict observation of potent voodoo rituals – possibly
    involving human sacrifice – at WordPress HQ.


    Drupal, by comparison, has as a motto, ‘don’t mess with the core’, and as such
    was built with extensibility in mind. It possesses well-defined schema by which
    all manner of customisations may be clearly implemented as modules. This makes
    it incredibly appealing for developers, and as a result you’ll find a huge number
    of contributed modules in the Drupal universe. For non-developers though, building
    anything but the most rudimentary Drupal site can be daunting and time consuming,
    and sometimes frustrating.


    # Understanding frameworks


    In order to separate the design, content and back-end code, mankind has invented
    web frameworks. These help non-hardcore coders use modular applications and easily
    extensible templates that don’t require hours of fighting with PHP and CSS in
    order to achieve seemingly simple ends. One such framework is the well-regarded
    Django. Django follows the model-view-controller (MVC) design, in which applications
    must be well-behaved with regard to separating representations of input (via the
    controller) and output (via the view). The model handles all the ‘in-between gubbins’:
    the data and logic connected to any instructions received from the controller
    and their processing into output to the viewer. In the present article we will
    employ Django to set up a basic CMS-based website. There are many CMS packages
    to choose from (see www.djangopackages.com/grids/g/cms) but let’s take a closer
    look at one of the most popular, the imaginatively-titled Django CMS.


    It’s recommended to run Django CMS in isolation through Virtualenv, since this
    will ensure its Python dependencies don’t clash with anything else on the system.
    To get this set up, first install Pip from your distributions repositories. Then
    install the virtualenv package (as root):


    ```

    # pip install virtualenv

    ```


    Now (not as root) set up a virtual environment in your home directory, activate
    it and install Django CMS as follows:


    ```

    $ virtualenv ~/env

    ```


    ```

    $ source env/bin/activate

    ```


    ```

    (env) $ pip install djangocms-installer

    ```


    Should you exit the virtual environment (either gracefully with deactivate or
    otherwise), you can re-enter it easily by just sourcing /env/bin/activate. There’s
    no need to re-initialise it again. Django CMS setup is ludicrously easy, it stores
    projects in their own subdirectories and we can put all these in a parent directory
    ~/djangoprojects to keep things tidy:


    ```

    (env) $ djangocms -p ~/djangomy_demo

    ```


    This will ask you lots of questions about versions, internationalisations, revision
    support and so on (you can safely accept the defaults as it’s only a demo, but
    say yes to Load a starting page). The required tables will be built, and eventually
    you will be asked to set up an admin user. Once all this is done, you can start
    your CMS like this:


    ```

    (env) $ cd django

    ```


    ```

    (env) $ python manage.py runserver

    ```


    Now if you direct your web browser to http://localhost:8000 you should find the
    demo website. Further, if you change the URL to http://localhost:8000/edit then
    you can log in as your designated admin user and begin to customise your website
    through its visual interface. You can add new elements to the Feature and Content
    boxes by selecting the Structure view at the top and then clicking on the lines
    to the right. The Google Maps plugin is rather nice.


    # Create a blog


    Django 3.0 was released in April 2013. One of its major new features is the powerful
    front-end system, which enables you to manipulate all the elements and plugins
    on your page directly from the admin view, without having to do any kind of code-tinkering.
    This makes doing basic site overhaul and construction work a breeze, but remember
    that this front-end is still in its infancy and as such gets confusing on occasion.


    For example, you might need to enlarge the left-hand panel to reveal all of the
    page actions. For the blog that we’re about to bring into existence, you might
    see a couple of spurious errors along the lines of: ‘Menu “menu” cannot be loaded..’.
    These conveniently disappear with a simple refresh. Perhaps they will even have
    been fixed by the time you read this. While we’re in the left-hand panel, it’s
    worth navigating to the sites options and changing example.com to localhost:8000
    since some pages will direct you to the absolute URL.


    # Quick tip


    Another up and coming Django based CMS is the much-acclaimed Mezzanine. Grant
    it some of your time and attention: http://mezzanine.jupo.org.'
