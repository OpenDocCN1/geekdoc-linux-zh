- pgno: 27
  md: '# # Social networking


    Allay your privacy concerns – establish your own social media platform.


    Setting up webmail is all well and good, but email is all a bit 20th century –
    at least that’s what the likes of Facebook would have us believe. Social networks
    raise privacy concerns, and while companies may use the likes of Facebook to engage
    with consumers who like them, they wouldn’t use it for internal communications.
    In fact, most organisations have strict policies on discussing any company business
    on social networks. However, these services do provide a valuable way for people
    to interact, either in public or within an organisation. What we need is a social
    networking platform that we can run ourselves, preferably one that is open source,
    to allay privacy concerns. There are a few options, such as Buddy Press (http://buddypress.org)
    which started life as a WordPress mod and grew into a complete social media platform,
    but we are going to look at Elgg (http://elgg.org). Looking at the list of well-known
    organisations and educational establishments that choose this particular platform
    gives you an idea of its popularity and suitability.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_27_0.png)


    > Once Elgg is set up, you can start by giving it a name, email address and somewhere
    to store its data.


    # ## A familiar procedure


    The installation process is similar to many other web applications. Download the
    ZIP file, unpack it into your web server’s document directory, preferably making
    a symlink to a more useful name than elgg-1.8.15, and set up the database. Elgg
    uses MySQL, so the standard instructions given elsewhere apply for creating a
    database and user. You also need to create a data directory for Elgg – this should
    not be in your web server’s DocumentRoot, the area from which it serves pages,
    as you do not want the contents to be directly accessible from a browser. The
    directory should be owned and writable by the user running the web server, usually
    www-data or apache. That’s the command line bit done, although you could do most
    of that with phpMyAdmin and an SSH-aware file manager. Now load http://yourserver/elgg
    into your web browser. This guides you through the setup, making sure you have
    all the modules you may need, setting the database credentials and testing access
    and configuring the location of the data directory. If it picks up a problem at
    any point, it tries to give a helpful hint as to the solution. Hit


    # ## Adding a MySQL DB


    MySQL is a database server; all of the packages we have mentioned here need some
    sort of database to hold settings and data. While MySQL is one of the most popular,
    there are alternatives. SQLite is, as the name suggests, a much lighter option.
    It stores a complete database in a single file and works well on single user systems
    that do not have particularly demanding requirements. However, it does not scale
    particularly well, either in terms of users or load. Because MySQL uses the classic
    server/client model, one server will take care of the database needs of several
    programs, so if you are using more than one of the packages covered here, MySQL
    is probably the best choice. The disadvantage is that you need to set up databases
    and users on the server for each package. When you install MySQL, it asks for
    a password – this is for the root user and not to be used by individual packages.
    You can create a new database and a user for it using the command line.


    ```

    mysql -uroot -p


    MySQL client will prompt for a password, then you create the database and user
    with:


    CREATE DATABASE dbname;

    GRANT ALL PRIVILEGES ON dbname.* TO ''username''@localhost IDENTIFIED BY ''password'';

    FLUSH PRIVILEGES;

    ```


    The first line creates the database, the second creates a user with a password,
    allowing them full access to that one database. The flush command tells MySQL
    to implement the changes immediately. When you’ve finished q\w ill exit the client.
    You can tell your program to use that database and user, and it can create the
    database structure itself. An alternative to mucking around with all this command
    line malarkey is to use phpMyAdmin, a web-based administration tool for MySQL.
    There’s a certain irony in that you need to use the command line to create the
    user for phpMyAdmin, but everything is detailed in the web interface.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_27_1.png)


    > phpMyAdmin makes looking after MySQL databases as easy and pointing, clicking
    and just a little bit of typing.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Openstack


    While we have concentrated on ownCloud here, there are alternatives; one such
    is OpenStack (see Dockers, p.14). However, OpenStack is aimed more towards large
    scale use. OwnCloud can be used in enterprise deployments and there are commercial
    variants available, but it is also well suited to personal and small organisation
    use. On the other hand, OpenStack is aimed more at those wishing to offer cloud
    services commercially. That certainly doesn’t rule out OpenStack, and if your
    requirements are for something more than a personal cloud service, you should
    take a look at www.openstack.org to see if it better suits your needs.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_28_0.png)


    > OpenStack is another open source cloud implementation, aimed squarely at the
    enterprise.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_28_1.png)


    > There are even themes that can make Elgg look very like a certain well-known
    social networking site.


    Apache is easiest from your package manager (you have already taken care of the
    L in LAMP, right?); Python and Perl are often installed by default; so that leaves
    PHP and MySQL, both installed through the package manager, too.


    # And there’s more


    We have looked at three main programs here, covering cloud storage, email and
    social networking, although they all provide extra features, such as photo albums,
    calendaring, contacts and bookmarks management. There are alternatives to each
    of these, as we have mentioned, but there are plenty of other cloud type programs
    around. For example, Gallery (http://gallery.menalto.com) is a dedicated photo
    album that provides far more features than the add-ons for the programs we have
    looked at here. It’s a typical web application using PHP, so the installation
    and configuration procedure is much the same as the other programs, and it has
    a comprehensive web administration interface for creating public and private albums,
    as well as many available plug-ins to enhance Gallery even further.


    > The organisations that choose Elgg give you an idea of its popularity


    There is also an open source instant messaging service that uses Jabber (which
    is used by Google Talk, among others). Asterisk can be used to set up your own
    VoIP gateway, which is especially useful for an organisation with more than one
    office.


    There is one important area where the open source alternatives don’t currently
    match up to the commercial offerings and that’s office productivity software.
    While the WebDAV accessibility of ownCloud does allow editing anywhere, and by
    anyone with the correct login, it still depends on client-side office software.
    There is a project in development called OX documents that has a demo at https://www.ox.io/ox_text.
    Interestingly, it supports ODF as well as Word format files, and is the first
    step towards an open source online office suite. The first release is due around
    now and when it adds a spreadsheet, we will be able to do just about anything
    in our own clouds that we can in the proprietary ones, except lose our privacy.


    refresh after fixing the problem to run the checks again. The final step is to
    create an administrator account. When you log in with your administrator account,
    you can greatly change the appearance of the site as well as enabling various
    plug-ins and other options.


    # Making Elgg your own


    Elgg is well documented, but those documents are well hidden, with no link from
    the homepage of the Elgg website. Prior to installation, go to http://docs.elgg.org.
    Once Elgg is installed, there are Manual and FAQ links at the bottom of the Administration
    page.


    The method of controlling plug-ins should be familiar by now. Installed plug-ins
    are accessed through a link on the administration page. New plug-ins are downloaded
    as ZIP files to be unpacked into the mod directory, after which they appear in
    the aforesaid list. Themes are also plug-ins, to be installed and configured in
    the same way. Links to the theme and plug-in repositories are on the front page
    of the administration manual.


    Bear in mind that because themes are treated like plug-ins, it is possible to
    select more than one at once, with sometimes strange results. A useful feature
    of the plug-ins page is that you can move them up and down the priority-sorted
    list, changing the order in which they are loaded.


    # What is LAMP?


    Web services run on what is known as a LAMP system, where the first three letters
    stand for Linux, Apache and MySQL while the P could be PHP, Perl or Python, depending
    on your preferences. Apache is the de facto standard web server for Linux, although
    there are alternatives, such as Lighttpd and Cherokee, which are often lighter
    and work with these services. However, Apache is the most popular and everything
    comes set up to work with it, whereas using a different web server may involve
    some more work, details of which can often be found on the projects’ websites.
    Installing


