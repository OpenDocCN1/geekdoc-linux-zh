- pgno: 11
  md: '# Stay under the radar


    A guide to emailing, messaging and chatting securely.


    # Did you know?


    According to the Snowden files, the GCHQ’s EdgeHill project (named after the first
    battle in the English Civil War) hopes to decrypt programs used by 15 major unnamed
    Internet companies and 300 VPNs by 2015.


    When you are engaged in a conversation with another person, you are exposing a
    lot more information about yourself, about the person you are talking to and the
    nature of your conversation. The only way to fox the snoopers is to encrypt all
    your communications. This way even if they are able to intercept it, they won’t
    be able to make out its content.


    PGP (or Pretty Good Privacy) is the most popular mechanism for encrypting data
    and communication. One of the methods that PGP uses for encryption is called Public
    Key Cryptography. Instead of relying on a single password, this method employs
    a combination of a public key and private key to encrypt and decrypt the data.


    In essence, the sender uses the recipient’s public key to encrypt the message.
    The public key as the name suggests should be made available to everyone. When
    the recipient receives the message, they use their securely stored private key
    to decrypt the message. Additionally the sender can also sign the message with
    their private keys. This helps verify the identity of the person who sent the
    message. The recipient can verify the signature with the sender’s public key.


    The freely available GNU Privacy Guard, popularly known as GPG, is the GPL licensed
    alternative to the PGP suite of cryptographic software. You’ll find it pre-installed
    in almost every Linux distribution.


    Many desktop Linux distros ship with the Thunderbird email client. The Enigmail
    extension for Thunderbird brings the advantages of GPG to the email client, and
    you can download the plugin from within the application itself. This plugin will
    automatically fire up a setup wizard to configure the extension, which will tweak
    your email settings, eg so you can’t compose HTML messages. Note: You can skip
    the wizard and configure Enigmail manually as well.


    Once installed the extension will add a new OpenPGP entry to the Thunderbird’s
    menu. Not all of your contacts will have public keys, so you shouldn’t enable
    encryption by default. Enigmail can fetch public keys of contacts from pre-configured
    list of key servers and also create per-recipient rules for contacts whose public
    keys you have.


    # Encrypt your emails


    By default, the Enigmail will create a 2048-bit key with a validity of five years.
    In addition to the key, you can also use the extension to generate a revocation
    certificate for invalidating a key, in case your private key is compromised.


    Once you’ve created your keys, you should export it for safe keeping. Head to
    the OpenPGP menu and select Key Management. Right-click the key you want to save
    and select the Export Keys to File option. In the pop-up select the Export Secret
    Keys option to save both your private and public keys.


    You should never send this file to anyone else. In fact, you should keep this
    file in an encrypted storage area (see Create and use a TrueCrypt Volume, p15).
    This file will help you import the keys on another installation or if you lose
    the keys.


    To encrypt messages with the keys, compose a new message and bring up the OpenPGP
    menu from inside the Compose window. It’ll have options to Sign Message and Encrypt
    Message. It’s prudent to select them both and then continue writing your message
    as usual. When you click the Send button, you’ll be prompted for the passphrase.
    Type it in, and your email will turn into unintelligible encrypted text.


    In addition to the body of the message, you can also use the Enigmail to encrypt
    any attachments as well. Just attach the files as usual, and Enigmail will take
    care of the rest.


    However, if you use webmail service, such as Gmail or Yahoo Mail you can use the
    Mailvelope plugin for Firefox and Chrome browsers to send encrypted messages (see
    Encrypt Webmail, p13). The plugin uses the OpenPGP JavaScript library that brings
    the power of OpenPGP to web browsers.


    Encrypting your email alone will not protect them from a determined intrusive
    party. Law enforcement agencies and other motivated individuals can still force
    you to hand over the keys. As a further precaution you can route the encrypted
    emails through the Tor or JonDo proxy networks. The TorBirdy extension will configure
    Thunderbird to make connections over these proxy networks.


    > “To prevent man-in-the-middle attacks, ZRTP uses Short Authentication String
    (SAS).”


    Perzo.com is a privacy-centric online comms service. In addition to encryption
    it lets you send messages that will self-destruct after a specified duration.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_11_0.png)


    Similarly you can also encrypt real-time communications such as instant messaging.
    The two most popular open source IM clients, Kopete and Pidgin, can encrypt messages
    via plugins. The Off-The-Record (OTR) protocol, for instance, enables end-to-end
    encryption for IM conversations. It’s implemented via the OTR plugin that you’ll
    find in the repositories of most desktop distributions. All parties must have
    the plugin to exchange encrypted messages, though.


    Once you’ve installed and enabled the plugin, you’ll have to generate a private
    key for each configured account. From then on whenever you connect with another
    contact using that account, the plugin will automatically establish a private
    conversation if your contact has properly setup the OTR plugin as well.'
