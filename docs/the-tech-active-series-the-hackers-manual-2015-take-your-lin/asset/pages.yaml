- pgno: 138
  md: 'modes gimp and other arcana. They are easily identified by their shouty case.
    Here the second argument stands for the number 2, but also to the fact that the
    current selection should be replaced by the specified elliptical one.


    The dimensions are specified by giving the top left corner of the box that encloses
    the ellipse and the said box’s width. We feather this selection by two pixels,
    just to take the edge off, and then set the foreground colour to black. Then we
    bucket fill this new selection in Behind mode so as not to interfere with any
    other discs on the layer:


    ```

    pdb.gimp_selection_feather(timg, 2)

    pdb.gimp_context_set_foreground(''#000000'')

    pdb.gimp_edit_bucket_fill_full(bookeh_layer, 0,BEHIND_MODE,100,0,False,True,0,0)

    ```


    And now the reason for using black: we are going to draw the discs in additive
    colour mode. This means that regions of overlapping discs will get brighter, in
    a manner which vaguely resembles what goes on in photography. The trouble is,
    additive colour doesn’t really do anything on transparency, so we black it up
    first, and then all the black is undone by our new additive disc.


    ```

    pdb.gimp_context_set_foreground(color)

    pdb.gimp_edit_bucket_fill_full(bookeh_layer, 0,ADDITION_MODE,100,0,False,True,0,0)

    ```


    Once we’ve drawn all our discs in this way, we do a Gaussian blur – if requested
    – on our copied layer. We said that part of the image should stay in focus; you
    may want to work on this layer later so that it is less opaque at regions of interest.
    We deselect everything before we do the fill, since otherwise we would just blur
    our most-recently drawn disc.

    if blur > 0:

    pdb.gimp_plug_in_gauss_iir(timg, blur_layer, blur, blur)


    # Softly, softly


    Finally we apply our hue and lightness adjustments, and set the bookeh layer to
    Soft-Light mode, so that lower layers are illuminated beneath the discs. And just
    in case any black survived the bucket fill, we use the Color-To-Alpha plugin to
    squash it out.


    ```

    pdb.gimp_hue_saturation(bookeh_layer, 0, 0, lightness, saturation)

    pdb.gimp_layer_set_mode(bookeh_layer, SOFTLIGHT_MODE)

    pdb.plug_in_colortoalpha(timg, bookeh_layer, ''#000000'')

    ```


    And that just about summarises the guts of our script. You will see from the code
    on the disc that there is a little bit of housekeeping to take care of, namely
    grouping the whole


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_138_0.png)


    series of operations into a single undoable one, and restoring any tool settings
    that are changed by the script. It is always good to tidy up after yourself and
    leave things as you found them. In the register() function, we set its menupath
    to "<Image>/Filters/My Filters/PyBookeh..." so that if it registers correctly
    you will have a My Filters menu in the Filters menu. You could add any further
    scripts you come up with to this menu to save yourself from cluttering up the
    already crowded Filters menu. The example images show the results of a couple
    of PyBookeh applications.


    After we apply the filter, things get a bit blurry. Changing the opacity of the
    layer will bring back some detail.


    > “To finish, group the operations into a single undoable one, and reset any changed
    tool settings”


    Critics may proffer otiose jibes about the usefulness of this script, and indeed
    it would be entirely possible to do everything it does by hand, possibly even
    in a better way. That is, on some level at least, true for any Gimp script. But
    this manual operation would be extremely laborious and error-prone – you’d have
    to keep a note of the coordinates and colour of the centre of each disc, and you’d
    have to be incredibly deft with your circle superpositioning if you wanted to
    preserve the colour addition.


    # Registering your plugin


    In order to have your plugin appear in the Gimp menus, it is necessary to define
    it as a Python function and then use the register() function. The tidiest way
    to do this is to save all the code in an appropriately laid out Python script.
    The general form of such a thing is:


    ```

    #!/usr/bin/env python

    from gimpfu import *

    def myplugin(params):

    # code goes here

    register(

    proc_name, e.g. "python_fu_linesplodge"

    blurb, "# Draws a line and a splodge"

    help, author, copyright, date,

    menupath, imagetypes,

    ```


    params, results,

    function() # "myplugin"

    main)


    specifies the inputs to your plugin: you can use special Python-Fu types here
    such as PF_COLOR and PF_SPINNER to get nice interfaces in which to input them.
    The results list describes what your plugin outputs, if any. In our case (PF_IMAGE,
    image, "LSImage") would suffice. Finally, function is just the Python name of
    our function as it appears in the code.


    The proc_name parameter specifies what your plugin will be called in the PDB;
    python_fu_ is actually automatically prepended so that all Python plugins have
    their own branch in the taxonomy. The menupath parameter specifies what kind of
    plugin you’re registering, and where your plugin will appear in the Gimp menu:
    in our case "<Images>/Filters/Artistic/LineSplodge..." would suffice. imagetypes
    specifies what kind of images the plugin works on, such as "RGB", or simply "*"
    if it doesn’t operate on any image, such as in our example. The list params


    To ensure that Gimp finds and registers your plugin next time it’s loaded, save
    this file as (say) myplugin.py in the plugins folder: ~/.gimp-2.8/plugins for
    Linux (ensure it is executable with chmod +x myplugin.py) or %USERPROFILE%\.gimp-2.8\plug-ins
    for Windows users, replacing the version number as appropriate.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Android: Linux on your phone


    Learn how to unleash the computing power of your Android smartphone by running
    a fully fledged Linux distribution on it.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_139_0.png)


    The scripts only prepare the environment for Linux to run on the device. The Linux
    image files hosted by the project are just customised Linux environments packaged
    by the project developers to suit different use cases and devices.


    The important bit is that all the Linux distros offered by the project are made
    up of ARM packages, and instead of running in a virtual machine they run on the
    real hardware on your Android smartphone. This is why you can run it on the mealiest
    of devices. We’ve managed to run Arch Linux along with the Enlightenment desktop
    on a Samsung phone with a single-core 1GHz processor and about 400MB RAM.


    At the time of writing, the project has stable images for Arch Linux, Debian Lenny,
    Debian Testing, Fedora 20, Fedora 19, Kali Linux, Ubuntu 13.10, Ubuntu 13.04,
    and Ubuntu 12.04 LTS. There are also Alpha images that aren’t meant for production
    use for other distros, including Slackware, Bodhi, OpenSUSE and Ubuntu 14.04.
    Each of these distros is available in multiple editions.


    The Core image is the smallest in size, and includes the minimum set of packages
    you need to run the distro. This is ideal for creating your own images and include
    the Openbox window manager. Next there’s the Small image, which ships with the
    LXDE desktop and its suite of programs. Finally you have the Large image, which
    includes the KDE Plasma Desktop, LibreOffice and Gimp.


    Some distros have additional images as well. Arch Linux produces images with the
    Enlightenment desktop, and Fedora ships an image with the MATE desktop. You can
    grab the images with either the ext2 or ext4 filesystem. The ext4 images are compatible
    with Android 4.3 while the ext2 images are compatible with earlier versions of
    Android.


    Your Android phone is already powered by the goodness of Linux, but you can enhance
    it further and make better use of its multi-core processors and oodles of RAM
    by running a full-blown Linux distro alongside the existing mobile OS.


    We can think of many reasons why you’d want a proper Linux PC in your pocket.
    You can, for example, use it to power a LAMP server that can run web apps and
    serve web pages. If you’re a network admin, you can install your favourite Linux
    tools and turn the smartphone into a portable network-troubleshooting or pen-testing
    device.


    The LinuxOnAndroid project produces an Android app and a couple of shell scripts,
    and hosts a bunch of Linux distros that you can boot using the app. In a snap,
    the scripts mount the Linux image within the Android filesystem and the SD card
    within the Linux filesystem. They then call on chroot to change the root directory
    to that of the mounted Linux and open up a shell for you to interact with the
    mounted Linux system. The scripts also set up SSH for secured remote access, along
    with VNC to allow you to access this Linux system’s graphical desktop.


    Quick tip

    The LinuxOnAndroid project is entirely open source. You can grab the source code
    for the app as well as the scripts, from the project’s website.


    # Prep the device


    Start by grabbing the Complete Linux Installer app from Google’s Play Store. Alternatively
    you can head to the project’s website (http://linuxonandroid.org) and download
    the open source version of the Android app (but go into Settings > Security menu
    and toggle Unknown Sources to enable installation of non-Play Store apps).


    The app requires a rooted Android device. (See A generic guide to rooting your
    Android phone on p71 for an overview). The exact procedure necessary to root an
    Android device varies between models [check out Tutorial, p80 LXF179 for more
    on rooting devices].


    Besides the app produced by the LinuxOnAndroid project, you’ll also need a VNC
    viewer to use the graphical desktop.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# A generic guide to rooting your Android phone


    In layman''s terms rooting a device gives you access to parts of the operating
    system that the device vendor doesn''t want you to tinker with. In other words,
    a rooted phone gives you greater privileges or administrator control to the lowest
    level of Android''s Linux subsystem.


    To get there you need to swap out some core components inside the device starting
    with the bootloader. The default bootloader on your phone is locked and will only
    start the system it trusts (this is eerily similar to the Secure Boot functionality
    on the desktop). In order to get root access you need to unlock the bootloader,
    replace the recovery system and install a superuser app.


    Start by installing the android-tools-fastboot tool using your distro''s package
    manager. This lets you interact with the deeper levels of the device. You''ll
    then have to reboot the device into the Fastboot mode. Browse the web for the
    key combination that enables you to do this for your device. The process to unlock
    the bootloader also varies depending on the device manufacturer. For Google devices,
    such as the Nexus 4, you can do it with a simple fastboot oem unlock command.
    For other devices you''ll need to request a key from the manufacturer.


    Then grab an alternative recovery system image that fits your phone from the popular
    ClockWorkMod project at www.clockworkmod.com/rommanager. Once you have the IMG
    file for your device you can flash it with the fastboot flash recovery <image
    name> command. Finally, grab an app to manage superuser permissions, such as Superuser
    developed by the CWM project or the popular SuperSU app.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_140_0.png)


    > You can easily root a Samsung device using the graphical Heimdall app.


    The project suggests using the popular Android VNC Viewer app. You''ll need another
    app to access Android''s built-in command line, but you''ll already have this
    if you''ve rooted your device. In any case, the project suggests using the Android
    Terminal Emulator app.


    Once you''ve grabbed these, you can launch the CompleteLinuxInstaller app. Tap
    on the project''s icon in the top-left corner of the screen to reveal the navigation
    menu, which contains several items. The first two are the most important: Install
    Guides will take you through the steps required for setting up and installing
    the various supported Linux distros, and the Launch item is the integrated launcher
    that you can use to boot into the configured distro. The other items will bring
    up various information and tips to assist you.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_140_1.png)


    > The CompleteLinuxInstaller app makes adding a distro a straightforward step
    by step process.


    To begin the process of setting up a distro, launch the CompleteLinuxInstaller
    app, bring up the navigation menu and tap on the Install Guides item. This will
    bring up a list of distros that you can run on your device. Once you''ve decided
    which distro to run, tap on its entry for further instructions. For this tutorial,
    let''s assume you want to set up Ubuntu 13.10. However, note that the process
    to set up a distro is pretty much similar for all.


    # Set up a distro


    Once you''ve selected a distro, the app will display detailed instructions broken
    down into four pages. On Page 1 the app runs through the basic requirements your
    device must meet to be able to run a Linux distro. The most important step is
    to make sure that you''ve enabled the debugging support. To do that, head to Settings
    > Applications > Development and make sure the USB Debugging setting is toggled.


    On the second page you get links to download the image for the selected distro.
    Tapping on the Download Image button pops up a window with three additional buttons
    to download one of the three supported image types explained earlier – Large,
    Small or Core. The page also mentions details about the offered images, such as
    the size of the compressed image that you''ll download as well as the size the
    image will take on your SD card once it''s been extracted.


    Tapping on the image you wish to download brings up another pop up with buttons
    that''ll either download the image from a Sourceforge mirror or via torrent. If
    you choose the torrent option, the app will download a torrent file, which you''ll
    then have to feed to a torrent client to download the actual image for your selected
    distro.


    Quick tip

    You can download the distro images from within the app, or you can grab them from
    the project''s website and transfer them on to the phone.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Android device) can take some time to deflate. However, if you’re moving the
    images on to your device manually, it’s best to house them inside a folder. For
    example, if you’re downloading the image for the Ubuntu 13.10 distro, it’s best
    to uncompress it inside a folder called Ubuntu on your SD card.


    Then move on to Page 3, which advises you on extracting the downloaded files.
    The rest of the page talks about how to boot the extracted images. Once booted,
    you’ll be dropped to a terminal window. Page 4 lists instructions on how to connect
    to this running Linux installation via a VNC viewer. Remember to note the password
    listed on this page as you’ll need it to connect to the VNC server running inside
    your distro.


    button to start the distro. Tap on the button to boot the distro. This will launch
    the terminal app and grant it super user permission. Press the Enter key in the
    virtual keyboard to boot the distro.


    Since this is the first time you’ve started up the distro, you’ll be asked to
    specify a password for the default user (which in the case of the Ubuntu distro
    is named ubuntu). Note that this is the password for the default user account
    and not the password required to log into the VNC session.


    You’ll then be asked if you want the distro to start the VNC server (for viewing
    the graphical desktop) and the SSH server (for accessing the distro remotely over
    a secure connection). We suggest you start them both to reap the full benefit
    of running a Linux distro on your Android device.


    Next, you’ll be asked to enter the screen resolution of the VNC session. Although
    you can set it to any size, for best experience you should set it to the same
    resolution as your device. Remember, however, that when you bring up the virtual
    keyboard it will hide a part of your desktop. If you are running this on a device
    with a big screen you can follow the guide on the project’s wiki to adjust the
    screen size to accommodate the soft keys.


    That’s all the configuration it requires. The app will then prompt you to save
    the settings as default. It’s safe to do so to avoid answering the same questions
    every time you launch the distro. We’ll show you how to alter these settings a
    little later on the tutorial. For now you should just save the settings as default
    and let the app boot your distro.


    # Boot the distro


    You’re now all set to boot the new distro. Bring up the navigation menu by tapping
    on the app’s icon or swiping from left to right and tapping on the Launch item.
    This will bring up the app’s launcher which is responsible for booting up the
    distros. Use the pull-down menu on the page to select the distro you wish to boot.


    If you get an error saying that the image for the selected distro doesn’t exist,
    it means that the app can’t locate the extracted image files for the distro. This
    can happen if you haven’t extracted the downloaded file, or if you’ve kept it
    in a non-standard location. In such a case, you’ll have to point to the IMG file
    of the distro manually. Tap on Settings in the top-right corner inside the Launch
    screen which brings up a pull-down menu. Tap on Add to open the page that add
    an entry for your distro. Enter the name for the distro in the space provided
    and tap on the box with three dots to navigate the filesystem on your Android
    device and point to the IMG file for the distro. Tap on Save Changes when you’re
    done.


    This custom entry from your distro will now be listed in the pull-down menu on
    the Launch page. When you now select the entry, the app will show you a


    When it’s done booting your distro, you’ll see a note with the relevant settings
    you need to connect via VNC to this Linux distro, followed by the standard Linux
    root prompt.


    If you’re proficient with the Linux command line interface, you can now use this
    shell to interact with the distro like any desktop distro.


    For security purposes, one of the first things you should do is set a new password
    for the root user. Enter


    ```

    passwd

    ```


    in the shell and enter a new password for the root user. If you’ve asked LinuxOnAndroid
    to start the SSH server while booting your distro, you can now connect to it from
    any computer on the network. Enter the


    ```

    ifconfig

    ```


    command inside the terminal on your Android device, which will print the IP address
    of the device, such as 192.168.2.101


    To connect to the device launch a terminal on another computer and enter


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_141_0.png)


    > The Installer requires BusyBox which it will go ahead and install on first launch.


    # Run Linux without rooting your device


    You can run Linux even on an unrooted Android device thanks to the GNU/Root app.
    Despite its name, this app doesn’t require a rooted phone. The one major difference
    between CompleteLinuxInstaller and GNU/Root is that the latter only gives you
    access to the command line interface of the Linux distro.


    To run Linux on your Android device via GNU/Root, you’ll need to grab it from
    the Play Store, as well as a companion app for the specific Linux distro. The
    app produces companion apps for popular distros, such as Debian, Gentoo, and Fedora.
    Remember that these apps are close to 100MB in size, unlike the GNU/Root app,
    which is a just a few KB.


    Once you have them both installed, fire up GNU/Root and use the drop-down menu
    at the top of the page to select the distro you wish to boot.


    Make sure you have already downloaded its companion app. Then tap on the Create
    New Roots button to install the distro which will take some time depending on
    the resources of your device.


    When it’s done, tap the Launch Roots button which will open a terminal and log
    you in the distro. If you select the Launch as Fake Root checkbox before launching
    the distro, you’ll be logged in with superuser privileges.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_141_1.png)


    > Enable use of the distro’s CLI package manager tools with GNU/Root. The developers
    are currently working to get a graphical interface for the desktop.'
