- pgno: 84
  md: '# Create a blog with Django and Zinnia


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_1.png)


    # 1 Start Zinnia


    When we restart the webserver you should see a Zinnia menu in the top bar. Clicking
    New entry in here will awkwardly put a rich text entry form in the panel to the
    left. Herein you can make your first Zinnia blog entry, if that is your will.
    We can do better though, in particular we can integrate the blogging application
    into the layout of our choosing.


    # 2 Make a page


    Let''s create a new page for our blog selecting Page > Add Page > New Page. Call
    it ''blog'', or perhaps something more imaginative. The Slug is how the page will
    be referenced in URLs, and will autocomplete based on the Title. This means that
    your blog can be easily and efficiently indexed by web spiders and robots. Click
    save to bring the page into being.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_3.png)


    # 3 Create a layout


    Select the structure view at the top and click on the menu on the right hand side
    of the content bar. Add a Multi Column environment with two columns. Initially
    both columns are set to the same size, which is unsatisfactory. But click save
    and then expand the multi-column environment and configure the columns as you
    see fit. I''ve gone for 50 percent on the left and 25 percent on the right.


    # 4 Define a list of entries


    Next head to the right column and add a Latest Entries plugin from the right-hand
    menu. Edit the plugin''s settings so that its display is only the latest entry,
    with the entry-detailed template. Below this you will need to add another latest
    entries element with an offset of 1 and in the default entry-list style. This
    will display just the titles of all your previous entries.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_4.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_84_5.png)


    # 5 Add extra features


    Meanwhile, in the right hand column add a Tag Cloud, Calendar Entries, and the
    admin controls. This will be enough to give us a clean but functional view of
    the Zinnia app that''s fully integrated in the Django CMS. The administration
    tools will enable you to log in, post new entries, moderate comments and any other
    blog-related ministrations you see fit.


    # 6 Get blogging


    It does a fine job of displaying the content, in this case a lego model of the
    ITER Tokamak fusion reactor. As you develop your site you will be able to customise
    and add new widgets and wowits to your heart''s content. Of course, the real fun
    starts when you start to write your own templates, but it''s still impressive
    how much can be achieved without even a single line of code.'
