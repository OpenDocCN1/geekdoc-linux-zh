- pgno: 46
  md: '# Programming the Arduino


    The Arduino has its own integrated development environment (IDE) so you can write
    programs (called sketches) and upload them to the Arduino flash RAM. When you
    turn the Arduino on, it automatically runs that sketch. The IDE uses the C++ language.
    Even if you’ve never programmed before, it’s easy to pick up the basics. Each
    sketch has a setup function that runs once when the Arduino starts, and a loop
    function that runs over and over until you turn off the Arduino. If you have a
    button connected to digital pin 2, you would initialise it in the setup function
    with the command pinMode(2, INPUT). To monitor the state of the switch you use
    digitalRead(2) command to read from pin 2. C++ is case sensitive, so pinMode is
    not the same as PinMode. The IDE automatically colour codes built-in commands
    in orange, so if something doesn’t magically change colour, you’ll immediately
    know that you’ve mistyped.


    When you’re ready to test, click the arrow icon to compile your sketch. This converts
    it to machine code instructions and uploads it to the Arduino. The Leonardo only
    has 28,672 bytes of memory to hold your sketch. This is usually enough, because
    there are no graphics to take up memory, but if you are used to programming, you
    will need to think a bit more carefully about memory efficiency. If you click
    File > Examples, you can load several simple sketches to illustrate the fundamentals
    of detecting switches and lighting LEDs, as well as sending key presses to the
    computer.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_46_0.png)


    you don’t need to replicate every single key – just the fun ones you need for
    the game.


    Now you could use a button or a switch for every function in the game, but why
    limit yourself when you are starting from scratch? Analog joysticks aren’t appropriate
    for every game, but there are fairly cheap digital joysticks available from http://uk.rs-online.com
    that use microswitches. Each direction can be programmed as a separate key press
    and suddenly WASD is transformed into a four-way joystick. You can even remap
    the joystick on the fly so that it sends different key-presses at different times.
    When we switch to ‘docking mode’, for example, our joysticks are remapped to strafe
    sideways, rather than rotate our ship.


    make them terribly sensitive. We decided to switch to the deluxe option of the
    MA3 absolute magnetic shaft encoder from http://usdigital.com. These are expensive,
    but they are worth it. They’re very sensitive, very smooth and very easy to program
    for.


    As well as sending key presses to the game, you may want to receive information
    from the game. Kerbal Space Program makes you switch to the map screen to see
    your orbital parameters, for example. With our controller, we can see these on
    the LCD display whenever we want. Turning a dial, makes the display change to
    show radar altitude and horizontal velocity. Even if you don’t need an LCD display,
    it’s handy to be able to check whether the landing gear really did come down when
    you flicked the switch. To access the game state, you need a game that can be
    modded. Kerbal Space Program enables you to write your own plug-ins that can access
    almost any part of the game. The plug-in takes this data and parcels it up into
    a neat packet that can be sent over a serial connection and down the USB cable
    to your controller.


    This probably all seems daunting, but consider this. When the author began this
    project he’d never done any electronics or programmed an Arduino. Most of the
    tricky bits of code were cribbed from other Arduino projects and Kerbal mods.
    If you don’t want to build a whole controller, start small. Even an Abort button
    will spice up your gaming.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_46_1.png)


    # Rotary controls


    Throttle functions don’t need to be programmed as plus and minus buttons, because
    you can create a rotary control. The easiest way to do this is with a potentiometer,
    which is a variable resistor that changes as you turn the dial – this is how volume
    controls work. You can feed the output from this to one of the analog inputs on
    the Arduino and it will turn the continuously varying voltage into a discrete
    number between zero and 1023.


    The disadvantage with potentiometers is that they have physical end-stops. On
    our controller, for instance, we have buttons acting as throttle presets so that
    we can immediately punch in 0 per cent, 20 per cent, 80 per cent or 100 per cent
    thrust. If we used a potentiometer dial to turn the throttle up to full and then
    pressed the button for 0 per cent thrust, the dial would still be turned all the
    way up and we wouldn’t be able to turn it up any further. One solution is to use
    a rotary encoder, which can be turned endlessly in either direction. These are
    very cheap, but programming the Arduino to detect which direction they are turning
    is a little bit fiddly. Plus, most of them only have 12 steps around the circle,
    which doesn’t


    > Don’t just replace each key with a button – switches and dials can be more useful.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# The electronics


    Connect switches and lights together using the magic of soldering.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_47_0.png)


    # 1 Prototype your layout


    Rather than diving in and making your control panel, we''d recommend deciding
    how big you want your panel to be by make a mockup version in cardboard. Use a
    pen, pieces of Lego or actual switches to try different layouts until you find
    one that works for you (as we''ve done for our panel, pictured left). We''d also
    suggest that you don''t replace every key in the game with a button – think about
    whether a dial or an illuminated switch would make for more useful and immersive
    interface.


    # 2 Proof of concept


    To get started with the Arduino, try building a simple device. Take an ordinary
    switch and connect one leg to one of the Arduino''s GND pins and the other to
    digital pin 2. Now use a prototyping breadboard to connect the long leg of an
    LED to one end of a 1,000-Ohm resistor. Connect the free end of the resistor to
    digital pin 3 on the Arduino and the short leg of the LED to the other GND pin.
    See if you can program the Arduino to detect when the switch is closed and light
    the LED. The example programs at http://arduino.cc/en/Tutorial will show you how.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_47_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_47_2.png)


    # 3 How to solder


    Soldering is mainly about keeping a steady hand. Clamp or blu-tack the wires so
    that the ends overlap, then apply the soldering iron for a few seconds and touch
    the solder to the wire so that it melts and flows across the surface. Make sure
    you allow the soldered wires to cool before moving them.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_47_3.png)


    # Crimping


    Plugging bare wires into the Arduino doesn''t work very well because the ends
    aren''t stiff enough to push into the headers. You need metal spikes called crimp
    connectors on the ends of the wire. You can buy these and attach them yourself,
    but


    It''s simpler and more reliable to buy pre-crimped wire. Get 30cm wires with male
    crimp connectors at each end. You can cut these in half so you have a bare wire
    to solder to your switch at one end, and the crimp connector at the other.


    # 4 Add connection leads


    Every switch and light on your control panel needs its own connection leads. Ribbon
    cable makes for tidier wiring, but it''s harder to solder and you can''t move
    switches around if you change your mind about the positioning. Use 2.4mm heatshrink
    tubing to insulate the ends.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 5 Expand the Arduino


    The Arduino Leonardo only has 20 digital input/output pins, and you will find
    that you actually need more than that. For example, a single LED digit would need
    seven separate outputs to control each of the segments. One of the most versatile
    methods to multiplex your pins involves the SX1509 (£7.40, http://proto-pic.co.uk).
    This uses two pins to communicate with the Arduino, but gives you 16 extra pins
    of its own. You can connect up to four of them to a single Arduino and they share
    the same two communication pins. That’s a total of 64 pins for the price of two!
    Best of all, the SX1509 add-on uses hardware interrupts to alert the Arduino when
    any of its inputs have changed, so you don’t need to constantly monitor every
    single one in your code.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_48_0.png)


    # 6 Solder the headers


    You can use the SX1509 to make your LEDs blink or fade automatically. If you head
    to http://bit.ly/LXfsx1509 this has a great open source library to make programming
    for the SX1509 easy. Rather than soldering wires directly to the SX1509, it’s
    better to add a header block – like the Arduino itself has – so you can plug components
    in. You can buy header block in strips that you cut to size. Solder each pin onto
    the underside.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_48_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_48_2.png)


    # Ohm’s Law


    If you connect an LED directly to the 5V pin of the Arduino it will be uncomfortably
    bright, and might even blow the LED entirely. This is because LEDs are semiconductors
    and have almost no internal resistance. Ohm’s law says that voltage = current
    x resistance, which means


    that I = V/R. Therefore, if R is very small, the current gets very high. To prevent
    this, always put a resistor in series with all your LEDs. A green LED has an internal
    voltage drop of about 2.2V. To give a safe current of 10 milliamps, you will need
    a 280 Ohm resistor, because (5 – 2.2) / 0.01 = 280.


    # 7 Test as you go


    Use the breadboard to test each component as you add it. This makes sure that
    you haven’t connected leads the wrong way round and helps you to learn Arduino
    programming incrementally.


    # 8 Connect the LCD


    Simple 16x2 character LCD displays are very cheap to buy, but the default interface
    needs a huge number of pins to control. This SerLCD piggyback board (www.sparkfun.com)
    uses one wire – plus ground and +5V – to communicate with the Arduino via its
    own serial communications interface. You can buy boards with the SerLCD already
    installed, but it’s easy to add it yourself. It solders directly onto the LCD
    circuit board using the existing pin connections, and there’s a potentiometer
    you can turn with a screwdriver to adjust the contrast. The serial communication
    is different from the I2C bus that the SX1509 expansion boards use, but it’s fine
    to have both in the same project. Again, there are good software libraries to
    control the board on http://bit.ly/LXfSerlcd.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_48_3.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The enclosure


    Assemble a panel worthy of the Apollo program.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_49_0.png)


    # 9 A basic box


    Make the back and the bottom of the box out of 6mm MDF. This is easy to cut and
    drill, and provides an insulating base for the electronics.

    Cut sloping pieces for the sides from 20mm MDF and make two extra so that you
    can have pillars in the middle of the box to stop the front panel from flexing.
    Screw it all together.


    # Power hub


    Virtually every control or light you add will need its own connection to ground
    or +5V, and sometimes both. The Arduino Leonardo only has two ground pins and
    one +5V, so you can’t connect them all directly. An easy solution is to use a
    strip of Veroboard (pre-drilled board with copper tracks) and solder some headers
    to it. You can plug this into an Arduino GND pin and the whole track on the Veroboard
    will count as ground. Do the same for +5V to create a hub.


    # 10 The front panel


    The front panel is 3mm aluminium sheet. This is easily available cut to size on
    eBay. If you want something that’s easier to drill that looks nearly as good,
    try aluminium composite material (ACM), which is plastic sandwiched between thin
    aluminium layers. Use a CAD or drawing program, such as Open Office or FreeCAD,
    to lay out the precise position of all your switches and buttons, ensuring that
    you mark the centre of every hole. Print this as a mirror image and glue it to
    the reverse of the front panel. This will enable you to drill from the back and
    leave the paper on, which insulates the inside metal surface.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_49_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_49_2.png)


    # 11 Drill holes


    Most switches and buttons use a 9mm panel hole. Use a centre punch (or just a
    screw) and a hammer to carefully mark the middle of each hole. Make sure your
    that panel is firmly clamped in place and drill a 3mm pilot hole. Then switch
    to a 9mm drill bit and enlarge the hole.


    # 12 Fit the front panel


    At this point, polish out any scratches on the front face as this will be much
    harder when the switches are all in place. Mount the panel onto your box and bolt
    the controls on. Leave the wooden back off, so you still have access.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_49_3.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 13 Using diodes


    Diodes are semiconductor devices that act as one-way valves for electricity. You
    can use them to create clever encoders that will save you some digital pins on
    your Arduino. Suppose you have a four-position rotary dial. Ordinarily, each position
    would need its own input (and therefore its own pin on the Arduino), but you can
    actually do it with just two pins. You wire position 2 to one pin and position
    4 to the other. Connect position 3 to both pins, but use diodes so that positions
    2 and 4 are still electrically isolated from each other. When you turn the dial
    to position 1, neither pin will get a signal (because position 1 isn''t connected).
    When you turn to 2, just the first pin is high. Turn to 3 and both are high. Turn
    to 4 and just the second pin is high. Here, we''ve extended this to a six-position
    dial, so that it only needs three Arduino pins.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_50_0.png)


    # Currents


    The Arduino can only supply a maximum of 200mA on the 5V rail, and 50mA on the
    3.3V rail. If your controller has a lot of LEDs, you will quickly exceed this,
    and your Arduino won''t work properly. A £2.60 breadboard power supply module
    from Amazon will give you over 500mA on each rail. Use this to power your components
    and leave the Arduino running off the USB cable. Or you can splice open a USB
    cable and run the 5-volt wire to the power module instead. The ground wire goes
    to the power module and also back to the PC, and the data wires run to the PC
    as normal.


    # 14 A keypad matrix


    If you have lots of buttons that will only be pressed one at a time, wire them
    as a grid so each row and column has a common connection. The SX1509 will scan
    each row and column and detect button presses. This is another great way to save
    loads of pins.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_50_1.png)


    # 15 Squeeze it all in


    Mount the Arduino on the back panel and connect everything to its designated pin.
    Keep a note of what is plugged where and don''t forget to record the wire colours,
    so you can find things during testing.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_50_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_50_3.png)


    # 14 Test the hardware


    When you begin programming the Arduino it will be hard to tell whether any faults
    are due to hardware or software errors, so it''s important to proceed in small
    steps. We''d suggest starting with a single switch. Program the Arduino to detect
    when it''s closed and light an LED to show this. Repeat this to confirm the operation
    of every switch and button directly connected to the Arduino. We''d then suggest
    using the SX1509 library to access one of the controls plugged into the expansion
    boards.


    When you know your controls work, try displaying messages on the LCD display,
    and so on. When you hit the odd glitch (and you definitely will), don''t be afraid
    to take the back off and check the voltages on the various pins with a digital
    multimeter. We''d also advise checking for short-circuits from sloppy soldering.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Install Linux

    on your new Chromebook


    For those who’ve bought a Chromebook and miss a full operating system, we’ll show
    you how to get an assortment of Linux distros up and running.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_51_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_51_1.png)


    Chrome OS is brilliant – for the type of user the Chromebook are generally aimed
    at, it does exactly what it needs to do. It is fast and easy to use – what more
    could you ask for? Well, after a while, you may find yourself missing some of
    the features associated with more traditional operating systems. But don’t fret,
    because help is at hand, in the form of Crouton.


    Crouton is a set of programs that set up a chroot environment within Chrome OS,
    from which you can run a Linux OS, with Debian and Ubuntu currently supported.


    A chroot is not the same as a virtual machine – you are still running on the standard
    operating system, but within a new environment. This method has several key advantages:
    for example, it does not touch the existing OS installation.


    making reversal easy; it uses the Chrome OS drivers for video, wireless and other
    devices, so there are no compatibility issues; and it is written by the Chrome
    OS authors, so it should remain compatible with future updates. The only real
    disadvantage to using Crouton is that there may be a slight performance hit, but
    you didn’t buy a Chromebook for its blazing speed anyway. Oh, and in case you’re
    interested, the name Crouton is a convoluted acronym (standing for Chromium OS
    Universal chroot EnviroNment) that was clearly thought up after the name.


    Before you start installing other distros, it’s a good idea to create a rescue
    disk to restore your Chromebook should anything go awry. Even if you’re not installing
    another OS, this is a wise step to take, especially as it’s so simple – all you
    need is a USB stick or SD card of at least 2GB in capacity. Because of the cloud-based
    nature of Chrome OS, 2GB is enough, because you only need to back up the operating
    system – your data and settings are safe on Google’s servers. (See the Recovery
    disks walkthrough on p55 for details.)


    # Jargon buster!


    apt-get

    The program used to install software packages on Debian, Ubuntu and other Linux
    distros.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_51_2.png)


    This is LXDE running on a Chromebook, but Chrome OS is still there.


    # Hidden shell


    You’ll need to activate Developer Mode (see box, p53 for details). When you’re
    ready, start downloading Crouton from http://goo.gl/td3zc. This is a script that
    downloads and installs everything you need. You run it from a shell – yes, Chromebooks
    come with a shell. Press Ctrl+Alt+T to open the Crosh shell in a browser tab.
    This is a limited shell and Crouton needs to know which distro you want to install:
    it calls these releases and selects them with the -r option. Then it needs to
    know the target environment you want to install. A target is a collection of software
    packages, such as a particular desktop. These two commands will list the options:'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Enabling Developer Mode


    Using Crouton means putting your Chromebook into Developer Mode first, which means
    you get root access and even a Bash shell. This isn’t a hack, but a fully supported,
    if hidden, official option. A warning to start with enabling Developer Mode wipes
    your storage. It doesn’t affect your cloud storage but any files stored locally
    should be uploaded to Google Drive before you proceed. The method of enabling
    developer mode is device-specific – you can find instructions at the Chromium
    website here. http://bit.ly/1gDHPGd


    On the Acer C720 we used for testing, as with most Samsung devices, you turn the
    device off and then hold down Escape and Refresh keys before pressing the power
    button. This gets you into the recovery screen, then press Ctrl+D to enable Developer
    Mode. Other devices have a hardware button for this.


    Once Developer Mode is enabled, you will see the OS verification is OFF screen
    each time you turn on – press Ctrl+D to continue booting, or wait 30 seconds.


    Head to www.chromium.org to pick up the Developer Mode switch for your device.


    ```

    sh -e ~/Downloads/crouton -t list

    ```


    ```

    sh -e ~/Downloads/crouton -t 2>&1 | more

    ```


    The second command needs to be passed to more because it is several screensfull
    – hit Space to page through them all. Once you’ve decided the release and target
    you want, you can run Crouton. To install Ubuntu 13.10 (Saucy Salamander) with
    the Unity desktop, for example, run:


    ```

    sudo sh -e ~/Downloads/crouton -r saucy -t unity

    ```


    This uses sudo because you need root to install the software. You can also specify
    multiple targets, like this example that installs Debian Wheezy with the LXDE
    desktop and the XBMC media centre:


    ```

    sudo sh -e ~/Downloads/crouton -r wheezy -t lxde,xmbc

    ```


    # Starting up


    Depending on the target(s) selected and the speed of your internet connection,
    this could take a while. When it has finished, it tells you the command needed
    to start your chosen distro in the chroot, such as:


    ```

    sudo startunity

    ```


    Run that command and you will be in a standard Ubuntu desktop. When you have finished,
    log out in the usual way and you go back to the familiar Chrome OS. You can switch
    between the two by holding Ctrl+Alt+Shift and pressing Forward or Back, too. In
    fact, the Chrome OS navigation keys above the numeric row are treated as the F
    keys by Linux, so these are really Ctrl+Alt+Shift+F1 and Ctrl+Alt+Shift+F2.


    The installation you end up with is not the complete distro as you would get installing
    it natively, but any extra packages can be installed in the usual way. If using
    Unity, the Software Centre is not installed, so open a terminal in Unity (Ctrl+Alt+T)
    and run:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get install software-center

    ```


    Now you can install any other packages you need from the GUI. You can also install
    extra target environments with the -u flag. For example, to add the LXDE environment
    to the Ubuntu chroot we created before, we would run:


    ```

    sudo sh -e ~/Downloads/crouton -r saucy -u t lxde

    ```


    # Adding some privacy


    As you may have noticed, enabling Developer Mode gives you root access through
    sudo, without requiring a password. This is slightly less secure for Chrome OS,
    but your login and files are still protected by your Google login, but it means
    that all the files in your chroot are readable, even with a passwordless guest
    login. If this concerns you, it is possible to encrypt the entire chroot by using
    the -e flag for Crouton. This prompts for a password and uses that to encrypt
    the entire chroot directory, meaning you can neither read nor run the chroot without
    the password. For example:


    ```

    sudo sh -e ~/Downloads/crouton -e r wheezy -t xfce

    ```


    There are lots of distribution releases and targets to choose from; you could
    install them all at once but that would get pretty bloated, so how do you try
    them all out? The answer is that you can have as many chroots as you have space
    for.


    If you plan to do this, you may find it easier to use Crouton’s -n option to give
    each chroot a name, otherwise they are simply names after the release. Naming
    is important when installing multiple releases, because the name is needed when
    running the startup commands, otherwise Crouton just loads the first release in
    which it finds the target you gave. Adding -n, like this, lets you ensure the
    right release is loaded:


    ```

    sudo startunity -n saucy

    ```


    Crouton also installs a couple of useful tools, particularly edit-chroot. This
    can be used to back up a chroot.


    ```

    sudo edit-chroot -b saucy

    ```


    creates a backup file in ~/Downloads, which you can restore with the following:


    ```

    sudo edit-chroot -r ~/Downloads/backup-file.tar.gz

    ```


    Copy this somewhere safe. Even if you do a full reset/recovery, you can still
    restore it by downloading Crouton again and running:


    ```

    sudo sh -e ~/Downloads/crouton -f backup-file.tar.gz

    ```


    You can also use delete-chroot to delete a chroot, which you could have worked
    out for yourself, or you can simply delete the directory holding it from /usr/local/chroots
    to go back to a vanilla Chrome OS. Assuming, of course, that you’d want to do
    that. Follow the steps over the page...


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_52_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_52_1.png)


    Unity is perfect for running everything in full screen.


    Jargon buster! chroot A directory into which a program is locked. It can’t see
    anything outside.


    Quick tip When trying multiple distros or targets, clean out any you have finished
    with. At several GB each, your storage will soon disappear.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Install a release


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_1.png)


    # 1 Open a shell


    Open a terminal window by pressing Ctrl+Alt+T. This will be a basic Crosh shell
    in a browser tab, which has a limited set of commands – you can see them by typing
    list. One of the commands is shell, which gives you a full Bash shell (patched
    for Shellshock), like other distros.

    It''s true – Chrome OS has a proper Linux OS behind the scenes.


    # 2 Choose a release and target


    Running Crouton with -t list will show you all the available targets. You''ll
    probably want one of the standard desktop environments. Chromebooks are relatively
    low-powered, and a lightweight desktop such as LXDE is a good choice, while Unity
    is better suited to running everything full-screen.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_3.png)


    # 3 Encrypt your files


    Adding -e to Crouton’s command line (this is not the same as the -e that follows
    sh) causes your chroot to be stored in an encrypted directory. Choose a decent
    passphrase – this is all that is protecting your files, but remember that most
    of your data will probably be saved in the cloud because Chromebooks have very
    little storage.


    # 4 Installing the distro


    Because Crouton is only an installer, it needs to download the distro release
    files before installing, so allow time for this. Even with a fast connection,
    it can take more than 30 minutes to download and install everything if you have
    chosen large targets – the sizes are shown in the output from crouton -t list.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_4.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_53_5.png)


    # 5 Add a package manager


    The default targets include only the command line package manager, apt-get. For
    most people, the first step is to open a terminal and use it to install a more
    friendly option, such as software-center for Ubuntu or Synaptic for Ubuntu or
    Debian. Run sudo apt-get update to make sure you get the current version, then
    sudo apt-get synaptic.


    # 6 Run Synaptic


    Once you have Synaptic installed, you have easy access to all the software in
    a distro’s repository. Most of the targets are slimmed down, to save on downloads
    and give a faster installation, but you can install anything you want from here.
    Either use the Search button or just browse the categories to see what is available.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Recovery disks


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_54_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_54_1.png)


    # 1 Back up to USB


    Plug in a USB stick or SD card of at least 2GB capacity, open Chrome and type
    chrome://imageburner into the location bar. Chrome OS downloads and installs the
    recovery image for your Chromebook. If you have more than one model of Chromebook,
    run this separately for each one: it gets the correct image for that device.


    # 2 Create the recovery disk


    After downloading, the image is written to your USB stick. If you don’t create
    a recovery disk, it’s also possible to get this image from another computer and
    copy it manually, by following the instructions at http://google.com/chromeos/recovery,
    but you have to make sure you get the right image – they are specific to each
    model.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_54_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_54_3.png)


    # 3 In case of emergency


    If you corrupt Chrome OS and get the following scary ‘Chrome OS is missing or
    damaged’ message, plug in your recovery medium. You can also force a recovery,
    if you want to go ahead and restore it anyway, by pressing the hard reset button
    or key combination, which varies from model to model. Check your Chromebook’s
    documentation for whatever applies.


    # Crouton: the pros and cons


    Comparing a £200 Chromebook to a full laptop may seem unfair – it is more in the
    netbook price range, and aimed at a similar market – but we’ll do that anyway.
    Running Ubuntu or Debian on a Chromebook is just like running it on a proper laptop.
    The only differences are down to the use of a chroot and the scary messages you
    get on bootup. This means you have to boot into Chrome OS first and then open
    a shell to start the chrooted session, but Chromebooks are designed to be suspended
    rather than shut down, so this isn’t necessary often. Because it uses the hardware
    through Chrome OS, you need to do things such as set up your network connection
    in there, but as you can switch between the operating systems at will, this is
    not a problem. This isn’t dual boot; it’s running both systems at once – far more
    convenient.


    The main limitation with this setup is the lack of storage space and dependence
    on a network connection and cloud services. While Chrome OS handles this transparently,
    you need to set up some sort of online syncing from your chrooted distro, using
    services, such as OwnCloud, SpiderOak or Dropbox.


    There are other ways of installing Linux on a Chromebook but Crouton does it in
    the least intrusive way, leaving your existing OS untouched (apart from needing
    to enable Developer Mode). You can also try multiple distros, and remove them
    when done, which is also a key benefit of this approach. Not least of its strengths
    is that Crouton is developed by the Chrome OS authors and isn’t a third-party
    hack. Future updates to Chrome OS could break your chroots temporarily, but a
    quick update through Crouton will fix that.


