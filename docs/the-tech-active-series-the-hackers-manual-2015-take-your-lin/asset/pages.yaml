- pgno: 75
  md: 'to find a reoccurring matching pattern that will occur for all of the entries
    in the list.

    The whole idea of this exercise is to identify the desired data and make sure
    it is trackable to the seller. This way, when your item meets the desired price
    point, you can get an email, text message and link to the product so that you
    can buy it without any hassle.


    # Multiple items


    This tutorial will show how to scrape all items from the Kindle section when the
    term ''Kindle Fire HDX 8.9'' is searched.

    When this exact query is made. www.amazon.com returns seven results. What to do
    with these seven results?

    One option is to just pull exactly what we want, while another option is to make
    criteria for separate items. For example, for the item Kindle Fire HDX 8.9'' HDX
    Display, Wi-Fi and 4G LTE, 32 GB, you may only be willing to pay less than $529,
    while you are willing to spend $269 for the item named Kindle Fire HDX 7'' HDX
    Display, Wi-Fi, 16 GB. So, there are the desired items.

    Now we come to the fun part, which is building a custom scraper that will only
    find these items and check for the desired criteria. Although another method to
    attack this is to make an array of URLs and run them through a loop, we have already
    chosen that scraping the single url is what we are going to do. Since other sellers
    and used items could find their way to this page on a later date, this page can
    be a good starting point and it is a good learning exercise.

    Search Kindles: Kindle Fire HDX 8.9

    http://www.amazon.com/s/ref=sr_nr_n_13y7m_3A2I0213011%2Ck%3A3AKindle+Fire+HDX+8.9+keywords=Kindle+Fire+HDX+8.9&ie=UTF8&qid=1386458068&rnid=2941120011

    Upon analysis of the desired page, there are seven items. Now, pattern analysing
    gets interesting because six have a price and one does not. Therefore, this ''Junker''
    entry without a price will be filtered out because it is currently unavailable.

    Looking into the details of the source code, you will see that items that have
    prices have a special HTML class associated with the item, while the one without
    the price does not. The code could have been displayed in a manner for which the
    class could have existed even without a price, but it had not. Therefore, the
    absolute key to building the scraper


    for this page is to make absolutely certain that each and every item has a beginning
    pattern and end pattern that can be matched for each and every entry. In this
    case, the HTML codes ''<span class="lrg bold">'' and ''<ul class="rstlr dkGrey">''
    contain all of the details that are necessary to use as a starting and end pattern.

    Unlike previous examples which use the preg_match() function, this example will
    use the preg_match_all() function to match this pattern multiple times throughout
    the page.

    Here is what is taking place. The file string is created by using the file_get_contents()
    function. Secondly, the string called $regex displays the pattern which is to
    be matched.

    ''<span\sclass="lrg\sbold">(.*?)<ul\sclass="rstlr\sd kGrey\sim''.


    This may look garbled, but it follows strict rules for pattern matching. First
    of all, the pattern exists between the two forward slashes; one which precedes
    <span and one before sim. Now, here is the explanation of the entire pattern.

    The code will start with <span followed by \s*. This means ''none or any amount
    of white space''. Since there is whitespace after <span in the HTML code, the
    \s* is added. After that, the next sequence is class="lrg followed by more whitespace
    \s* and the end of the tag bold >.


    # Inside the code


    The next code in brackets is utterly critical because it matches everything in
    between the previous match until it finds the next pattern that starts with <ul.
    This bracket of code is also very important because the preg_match_all() function
    will create an array for each match; one array will be the entire match and another
    is the code contained in the brackets (.*?). The rest of the match after the (.*?)
    brackets includes the <ul tag followed by none or any amount of whitespace \s*.

    After the whitespace, a specific HTML class is matched. Essentially, the HTML
    code class="rstlr dkGrey becomes class="rstlr\s*dkGrey when this pattern is searched.
    And that completes the pattern.

    Now, you will notice after the ending forward slash, there are three letters –
    sim. These letters represent pattern modifiers. The S is used so that new lines
    are searched. The I is used to ignore the case. The M is used for multiline mode.
    Since the code block that will be examined covers multiple


