    # It’s build time!


    Once you’ve fine-tuned the kernel features to your liking, save and exit the configuration
    tool. In theory, you could now build your new kernel with a single make command,
    but that’s not very efficient way of doing it if you have a multi-core processor.
    In this case, it’s better to use -j followed by the number of cores that are in
    your CPU. This tells make to perform multiple compilation jobs in parallel, which
    will significantly reduce the kernel’s total build time. So, if you have a dual-core
    CPU, use:


    ```

    make -j 2

    ```


    How long this process takes depends on how many features you’ve enabled in the
    kernel and the hardware spec of your computer. If you’re building a fairly trimmed-down
    kernel on the latest Core i7 processor, for instance, you should be done in around
    15 minutes. If you have an older computer and you’re building a kernel that has
    everything including the kitchen sink, it will take several hours.


    In any case, when the process has finished, it’s time to install the kernel and
    modules into their proper locations:


    ```

    make modules_install

    ```


    ```

    make install

    ```


    It’s very important to enter these commands in this specific order. The first
    command places the kernel modules into /lib/modules/<kernel version>/, so in our
    case in


    /lib/modules/3.3.7/ . The second command copies the kernel and its supporting
    files into the /boot directory.


    These are:


    vmlinuz-3.17.1 The compressed kernel image. This is loaded by Grub (the boot loader)
    and executed.

    System.map-3.17.1 A table of symbol names (for example, function names) and their
    addresses in memory. It’s useful for debugging of kernel crashes.

    Initrd-3.17.1 An initial RAMdisk – a small root filesystem with essential drivers
    and utilities for booting the system (and mounting the real root filesystem from
    elsewhere).

    Config-3.17.1 A copy of the .config file generated when you ran make xconfig or
    one of the variants.


    Helpfully, the make install process also updates the Grub bootloader. If you look
    inside /boot/grub/grub.cfg you’ll see new entries for the version of the kernel
    that you just built and installed.


    Now you’re ready to take the most exciting step: rebooting into your shiny new
    personalised kernel. Just select it from the Grub menu, cross your fingers, and
    see what happens. All being well, your system will boot up properly and you can
    explore the new features that you enabled – but if not, no worries. Just reboot
    again and select your old kernel (it’s likely to be under the ‘Advanced options’
    submenu). Linux is excellent at supporting multiple kernel versions on one machine,
    so it’s unlikely that your system will become completely unbootable.


    If you need to make further changes to your kernel, run make xconfig again, then
    follow the procedure above. You can also remove compiled files by entering make
    clean, but that still leaves .config and some other files in place. To reset the
    kernel sources to their original, pristine form, use:


    ```

    make mrproper

    ```


    After entering this, all temporary files and settings will be removed, just as
    if you had extracted a fresh kernel tarball.


    # Patch me up


    A great way to spruce up your kernel with extra features is to use one of the
    many patches available on the net. (See ‘Patches to look out for’, opposite, to
    learn more about this.) We’ll be using an old kernel (3.10.9) for ease and apply
    a real-time patch provided in the patch-3.10.9-r15.patch.gz file. We’ve downloaded
    this into our /usr/src/linux-3.10.9 directory, and as the name suggests, it’s
    a single .patch file that’s compressed with gzip.


    If you have a look inside the file (for example, zless patch-3.10.9-r15.patch.gz),
    you’ll see a bunch of lines starting with plus (+) and minus (-) characters. In
    a nutshell, plus-lines are those which are added to the kernel source code by
    the patch; minus-lines are taken away. Between each section marked by the word
    ‘diff’, you’ll see ‘+++’ and ‘---’ lines – these show which files are to be modified.


    You can patch your source code straight away, but it’s a very good idea to do
    a dry run first, to make sure that nothing gets messed up. Fortunately, the patch
    command has an option to do exactly this:


    ```

    zcat patch-3.10.9-r15.patch.gz | patch -p1 --dry-run

    ```


    Here we’re extracting the compressed patch to stdout (the terminal), and then
    piping its contents into the patch utility. Using -p1 here specifies that we want
    to patch inside the current directory, and --dry-run prevents any file changes
    from taking place – it just shows what would happen. You


    should see lots of lines like this:


    patching file arch/sh/mm/fault.c


    If it all goes without any gremlins rearing their heads, repeat the command with
    --dry-run removed. If you’re using a patch with a .bz2 ending, use bzcat at the
    start of the command, and similarly for XZ files enter xzcat.


    Once your kernel has been patched up, jump back into the kernel configuration
    tool to enable the new features (if


