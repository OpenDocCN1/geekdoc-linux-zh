- pgno: 67
  md: '# Find vulnerabilities


    How to identify and exploit a weakness in your site.


    If you’ve taken a look at the LXF Vulnerable WordPress VM, you may well have come
    to the conclusion that it’s easy to exploit vulnerabilities once you know where
    they are, but wonder how to go about finding them. To answer this point, we set
    ourselves the challenge of finding and exploiting a new vulnerability in our site.


    First of all, we installed an attack proxy. This is a tool that intercepts HTTP
    requests from your browser and uses them to build up a map of the site you’re
    browsing. Using this, you can get an idea of what it is you’re attacking even
    if you don’t have access to the source code. It also gives you an idea of what
    information is passing back and forth between the server and the browser.


    We opted for OWASP’s ZAP (available from http://code.google.com/p/zaproxy and
    supplied in the HackWeb folder). To use it, just unzip and run (no install required)
    with:


    tar zxvf ZAP_2.0.0_Linux.tar.gz

    cd ZAP_2.0.0

    ./zap.sh


    Version 2.0.0 needs Java 1.7 or higher. If you have an earlier version (as is
    the default on the likes of the older Ubuntu 12.04 LTS), you can either use ZAP
    version 1.4.1 or manually get a newer Java version. On our Precise Pangolin machine,
    we installed the package openjdk-7-jre and then changed the final line of zap.sh
    to:


    exec /usr/lib/jvm/java-7-openjdk-1.6/bin/java $JMEM -XX:PermSize=256M -jar $BASEDIR/zap.jar
    org.zaproxy.zap.ZAPStart


    This will start the proxy running on port 8080, so you need to set your web browser
    to funnel your data through this.

    In Firefox, this is done in ‘Edit > Preferences’ then ‘Advanced > Network > Settings’,
    and changing the radio button to ‘Manual Proxy Configuration’ with the HTTP Proxy
    as localhost and Port as 8080.


    > “The first phase of any penetration test is to gather information”


    Now, you should see one or more entries in Zap for every page you visit. Zap also
    attempts to help you by flagging any items that it thinks are vulnerable from
    yellow to red, depending on how big an issue it thinks there is. Blue flags are
    just for information. These ratings should be taken with a pinch of salt, however.
    Many flagged pages aren’t vulnerable, and many that are vulnerable get missed
    (this is an issue with all the automatic security scanners we’ve ever used).


    With our software now set up, we can get on with our attack. The first phase of
    any penetration test is information gathering. ZAP does have some tools for automatically
    scanning the site, but we prefer to start with a manual scan. This means browsing
    around the site in your web browser, with ZAP cataloguing it as you go. The more
    thoroughly you go through the site, the more information you’ll get.


    As we go through the application, we’re looking for attack vectors. These, basically,
    are any way of passing information to the website. In HTTP, they come in two forms:
    parameters passed on GET requests (these are the bits that come after question
    marks in URLs), and POST requests (these are harder to see without a proxy such
    as ZAP, but are listed in the Request tab). Any one of these can be changed to
    send whatever information we want. As you saw on the example


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_67_0.png)


    Here, we spotted a missing nonce field that enabled us to exploit the form.'
