- pgno: 65
  md: '# HACK THE WEB


    Wondering how the bad guys do it? Join us on a legal trip to the dark side* and
    hack your own software in safety


    The art of manipulating a computer system to do your bidding without authorisation
    – some people call it hacking, others call it cracking or penetration testing.
    Whatever you call it, it’s going on right now all over the world. Governments,
    businesses, dissidents, bored geeks and criminals are attacking each other, and
    ordinary computer users, every day of the year.


    Hacking works in many ways, but here we’re going to look at attacks that come
    via the web, because these are the most likely to affect ordinary people. Some
    of these attacks, such as the Anonymous revenge attacks, have made front page
    news, because they’ve taken websites offline, or added graffiti to front pages.
    Others are going on every day, often making criminals vast sums of money, yet
    are seldom reported. If you run a website, you’ll undoubtedly see many attacks
    in your server logs. If you’re a web user, you’re more likely to see the results
    of these attacks in email spam (you know those funny-looking links?), or perhaps
    you’ve been unlucky enough to lose personal information when a server’s been compromised.


    > “We’re going to open the lid on some of the tools hackers use”


    Whatever the case, we’re all living in an increasingly connected world where more
    and more of our valuables are locked in digital vaults rather than physical safes.
    We can either sit back, and hope that the government and web companies will protect
    us, or we can understand the threats to us and protect ourselves.


    We’re going to open the lid on some of the tools hackers are using, because you
    can only protect yourself if you understand what you’re protecting yourself from.
    We’re going to look at four different types of attack – denial of service (DDOS),
    man in the middle, cross-site scripting and injection attacks – and show you how
    criminals are using them right now, and how you can stop yourself, or your website,
    falling victim to them.


    # *Legalities


    The laws governing hacking vary with country to country, so we can’t give any
    concrete legal advice. However, it is safe to say that performing any of the techniques
    described here on a website you don’t have permission to change is illegal in
    most countries. If you’re working for a company or organisation, make sure you
    have written permission from the appropriate people before starting. This way,
    there will be no confusion should someone notice that something is happening.'
