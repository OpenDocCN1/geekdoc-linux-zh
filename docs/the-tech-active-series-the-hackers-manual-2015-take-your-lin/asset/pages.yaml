- pgno: 123
  md: '# SPEED UP LINUX


    Roll your sleeves and follow Linux Format into the garage to give your Linux box
    a high-octane tune up.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_123_0.png)


    Compared to other popular proprietary operating systems, the typical Linux desktop
    distribution is a fairly well-oiled machine straight out of the box. The developers
    at every stage of the Linux distro assembly line, from the kernel to the individual
    apps, put in huge amount of effort to ensure the different pieces of software
    make best use of the available hardware resources. This is also why you can still
    run – and productively use – Linux on ancient single-core processors with less
    RAM than you have on a modern smartphone.


    However, there’s still room for improvement. The Linux distro developers have
    to appeal to a wide audience and ensure compatibility with a range of hardware.
    This means that your distro is probably running with the settings that are not
    optimised for your particular hardware. Also, many modern distros are bloated
    with software and services which makes them lethargic. The good news is that the
    typical Linux distro ships in a malleable state and enables you to customise it
    as per your requirements, for example, by adding and removing various pieces of
    software. Similarly, to get maximum performance from your distro, you need to
    pop the hood to tweak some crucial components and even get rid of the ones you
    don’t need. Tuning a Linux computer for speedier performance isn’t very difficult,
    thanks to the open source nature of the software powering it. But the process
    can be involved and requires familiarity and knowledge of the major components
    that make up your distro.


    In this feature we’ll hand-hold you through the process of streamlining your workhorse
    machine into a galloping stallion, irrespective of your experience level. Furthermore,
    you can use these tips on modern multi-core machines, as well as older single-core
    hardware that are low on resources and show you how to zip past any performance
    bottlenecks.


    > “The typical Linux distro ships in a malleable state and enables you to customise
    it.”'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# # Tricks for the desktop user


    Get a faster boot-up, a swifter desktop and more responsive apps.


    Everyone loves a speedy computer. In this section we''ll look at some essential
    tricks to speed up your computer. You don''t have to be an experienced campaigner
    to get more mileage out of your Linux box. There are some techniques that even
    new users can employ to trick their Linux distro to boot faster.


    Whether you dual-boot Linux with another OS or not, after you''ve installed your
    favourite Linux distro, the boot up process will surely be interrupted by the
    Grub bootloader. By default, most desktop Linux distros will display the Grub
    bootloader from anywhere between 10 to 30 seconds.


    One of the easiest ways to trick your computer into booting up faster is to trim
    the duration of the bootloader. If you always boot into the default option and
    are feeling adventurous, you can even skip the countdown completely, though we
    don''t suggest you do that.


    To tweak the Grub countdown, fire up a terminal and open the /etc/default/grub
    file in a text editor, such as sudo nano /etc/default/grub, which will open the
    file in the Nano editor. Hunt for the GRUB_TIMEOUT variable in the file which
    defines the duration that the boot loader is displayed. Then replace the value
    associated with this variable to something like 5 or 3. This is the duration in
    seconds. If you set it to 0, the countdown will be disabled and Grub will boot
    the default OS. Once you''ve set a new countdown timer, save the file and then
    inform Grub of the new settings with the command update-grub.


    # ## Streamline startup services


    One of the major causes of longer boot times is that your system starts unnecessary
    apps and services during startup. But before you start axing them, it''s best
    to get a picture of what''s happening while your distro boots up.


    Bootchart is a simple app that enables you to profile your Linux boot process
    and help measure the loading times of different services. You can use Bootchart
    to identify any bottlenecks in the boot up process. The app logs all activity
    and then displays the results in a detailed image file.


    You''ll find Bootchart in the repos of all the major distros, including Ubuntu,
    Fedora, OpenSUSE and Mageia. Use the distro''s package manager to find and install
    the bootchart package. Once you''ve installed the app, you''ll need to restart.
    When your desktop comes up, head to the /var/log/bootchart folder. Here you''ll
    find an image file with the .png extension which contains an analysis of the last
    boot process. A new time-stamped image file will be created on every subsequent
    boot up.


    The top of the image lists various statistics, such as the date of the test, the
    name of the distro, the kernel version and the enabled kernel options, as well
    as the time taken to boot the system. This is followed by two diagrams that show
    the CPU load and the disk activity during the boot up phase, and then comes the
    meat of the analysis. This meaty section contains a number of labelled bars each
    of which represents individual processes. Several bars terminate after a couple
    of seconds, while others continue through to the end depict services such as the
    Network Manager, Cron, and the CUPS daemon among others. The image also shows
    child processes and connects them to their parent processes with dotted lines.


    From this image you can find all the active processes and can then remove the
    ones you don''t need. For example, if you print occasionally, you can disable
    CUPS from starting at the boot time. Furthermore, the image also helps you identify
    processes that take control of all resources and force the other processes to
    wait, effectively blocking the boot process.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_124_0.png)


    You can alter the individual app files in /etc/xdg/autostart to reveal apps hidden
    by default in Startup Applications.


    > > “The easiest way to free up resources in any distro is to stop unwanted processes.”


    Now that you understand how your computer boots up and the services that are started,
    it''s time to tailor the boot process as per your requirements and shave off some
    time. The easiest way to free up resources in any Linux distro is to stop the
    unwanted processes from running or even starting up for that matter. Most Linux
    distros have a tool that let you see what''s going on and halt things, if necessary.


    Ubuntu ships with the Startup Applications tool that lets you add and remove any
    apps that you''d like the distro to launch when it boots up. For speedier boot
    ups, launch the app and disable any unnecessary service you find in there.


    By default, the app doesn''t display the full gamut of apps and services. To see
    the hidden services and apps that don''t come with a GUI, fire up a terminal and
    change to the directory that lists all the services with cd /etc/xdg/autostart.
    Within this directory you''ll find individual files for each process.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'all installed apps and services. In each file there’s a variable that controls
    whether the services is listed in the Startup Applications tool or not. You can
    change the default value of this variable inside each file with:


    sudo sed -i-in-place ''s/NoDisplay=true/NoDisplay=false/g'' *.desktop


    When you relaunch the Startup Applications tool, you’ll find additional startup
    programs, such as Desktop Sharing, Personal File Sharing etc. You can read through
    their descriptions and disable any you don’t require. To disable a service from
    starting, select a service and simply uncheck the box next to its name. Remember
    not to click on the Remove button, so you can just re-enable it later. Also, don’t
    disable an autostart entry unless you understand what it does.


    To turn off thumbnails on a Gnome-based machine, launch the Files file manager
    and head to Edit > Preferences. Here switch to the Preview tab and set the value
    Show thumbnails to Never.


    Additionally, Ubuntu users should install the CompizConfig Settings Manager with


    sudo apt-get install compizconfig-settings-manager compiz-plugins-extra

    to alter desktop effects. Similarly, Gnome users should install the Gnome Tweak
    Tool. It’s available in the official repos of mainstream Gnome-based desktop distros
    such as Fedora. RPM-based users can install it with yum install gnome-tweak-tool
    and Deb-based users with sudo apt-get install gnome-tweak-tool. If you use KDE,
    head to System Settings and look for desktop effects and then turn them off.


    > “Fancy graphical compositing effects are not suitable on some resource-restricted
    machines.”


    otherwise you could adversely affect the usability of the distro. So if your computer
    doesn’t have Bluetooth hardware, you can safely disable the Bluetooth Manager
    applet. But if you disable Mount Helper, Ubuntu will stop automounting removable
    devices.


    # Turn off the bling


    Modern desktops ship with fancy desktop effects to add some zing to regular desktop
    tasks, such as opening and closing windows and apps. However, these fancy graphical
    compositing effects are not suitable on some resource-restricted machines and
    should be immediately turn off.


    There are also some fancy features that we have taken for granted. For example,
    the thumbnails preview in the file manager. It wouldn’t make much difference when
    viewing the contents of a folder with a few files. But open a folder with hundreds
    of files on a slow machine and the file manager will consume precious resources
    generating thumbnails.


    Similarly the Nepomuk, Strigi and Akonadi features in the KDE desktop hog memory
    resources. You can disable Nepomuk and Strigi from System Settings by heading
    to the Desktop Search section. To disable Akonadi, shut down the Akonadi server
    with sudo akonadictl stop. Now open the ~/.config/akonadi/akonadiservrc file in
    a text editor and change the StartServer parameter from True to False.


    Since Akonadi is tied deep into the KDE desktop, when you launch any Akonadi-enabled
    app, it will automatically start the Akonadi server. Some KRunners and Plasma
    widgets also use Akonadi so you have to disable them as well.


    To disable Akonadi-enabled KRunners, press Alt+F2 on your keyboard and click on
    the Wrench icon. Then uncheck Nepomuk Desktop Search and the Instant Messaging
    Contacts runners. Next you need to tell the Digital Clock widget not to display
    calendar events by right-clicking the digital clock in the panel and then heading
    to Digital Clock Settings. Switch to the Calendar tab and uncheck the Display
    Events option.


    The indexing application apt-xapian-index speeds up certain search operations,
    but it can have a major detrimental effect on the performance of weaker computers.
    You can freely remove this package with sudo apt-get purge apt-xapian-index because
    it’s not essential.


    # Install apps faster


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_125_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_125_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_125_2.png)


    # 1 Remove language


    The output of sudo apt-get update command has three types of lines – hit, ign
    and get. Most of the ign lines are related to language translation. If you use
    all the applications in English you can speed up updates by suppressing the language-related
    updates. For this add Acquire::Languages "none"; in the /etc/apt/apt.conf.d/00Aptitude
    file.


    # 2 Use the closest mirror


    If you’re using Fedora, install the fastestmirror plugin with sudo yum install
    yum-plugin-fastestmirror which will time the connection to all available mirrors
    and then select the fastest one. Ubuntu users should launch the Software & Updates
    app, select the Other option from the Download From pull-down menu and click the
    Select Best Server button.


    # 3 Use apt-fast


    Apt-fast is drop-in replacement for apt-get that speeds up updates by downloading
    packages from multiple connections. Install it by adding its PPA with sudo add-apt-repository
    ppa:apt-fast/stable before installing the package with sudo apt-get install apt-fast.
    The script isn’t available for the latest Ubuntu release, so you’ll have to grab
    the packages manually.'
