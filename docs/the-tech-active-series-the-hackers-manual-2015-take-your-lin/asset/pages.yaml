    ```


    Using the terminal to flash the Replicant image files to the phone.


    A mobile operating system without a driver for the telecommunications hardware
    is about as useful as a chocolate fireguard. There are similar issues on the graphics
    hardware side, especially in terms of hardware acceleration. However, progress
    has been made and there is an Android replacement that is free – Replicant. (http://replicant.us).
    Because of the hardware driver situation, this is not a drop-in replacement for
    Android on all devices – there are 11 devices listed on the website at the time
    of writing, and not all features work on all of those without


    # Replicant


    Using F-Droid to make sure you are using open source software on your Android
    device is a step in the right direction, but what if you want a completely free
    system? This is nowhere near as easy, because of the extent that proprietary software
    is used in our devices. On the one hand, there is the Google element – all the
    software that operates through Play Services and uses Google’s services. That
    can be dealt with, although you may lose some features you are used to. More difficult
    to deal are the hardware drivers, most of which use proprietary blobs. This issue
    is similar to that for some desktop and laptop hardware, but often more complex.


    > “You will not find as many apps in F-Droid’s catalogue, but the quantity is
    growing.”


    installing non-free firmware. The main items that need such firmware are Wi-Fi,
    Bluetooth and some cameras. Installing Replicant is much the same as flashing
    a custom ROM (since that is basically what Replicant is, just one with only open
    source code). As with any such procedure, you should take a backup before you
    start, preferably a Nandroid backup if you have a custom recovery that supports
    this, as flashing the ROM will erase your applications and settings. Also, read
    the section on firmware before overwriting your current system. The installation
    process varies between phones – Samsung devices use the heimdall program, while
    Nexus hardware is updated with fastboot. We will look at how to install on a Nexus
    5 here, because we have one handy. The fastboot program is included with the Android
    SDK or in a separate android-tools package on some distros. It can also be downloaded
    from the Replicant website. You also need a number of image files to write to
    your device, so go to http://replicant.us/supported-phones/ and follow the link
    to your device’s wiki page. From there, follow the installation link and then
    the Replicant


    # Privacy


    One of the reasons people give for wanting to move away from Google (and other
    cloud services) is privacy. It is not surprising that people do not want their
    movements and communications watched over by others, especially in light of last
    year’s revelations about Prism and various state agencies. By not using Google’s
    software you may think you have regained your privacy, but no mobile phone user
    has complete


    privacy. In the same way that your phone can get a reasonably accurate location
    without GPS – by using the cell towers – so can your telecom provider, and all
    of your conversations, messages and data still flow through them. The NSA and
    GCHQ don’t need Google, the only way to maintain complete privacy with a mobile
    phone is not to have one. That’s not to say you should give up, but you should
    be realistic in your expectations.'
