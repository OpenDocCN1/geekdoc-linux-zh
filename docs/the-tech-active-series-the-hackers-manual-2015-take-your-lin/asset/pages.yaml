    to enter the PIN or password each time you boot your phone.


    Instead of encrypting the whole device, you can also choose to encrypt selected
    files. One of the best apps for this purpose is SSE Universal Encryption. The
    app offers all the popular encryption algorithms including AES-256, Serpent-256
    and Blowfish-256, and has three modules: the Password Vault module allows you
