- pgno: 80
  md: 'The official desktop client is a simple-but-functional Qt4 application, which
    sits nicely in the System Tray and lets you know when it''s syncing in much the
    same way as its Dropbox equivalent. By default it will sync your entire OwnCloud
    account to the local directory ~/owncloud, but you can pick and choose folders
    as befits your own cloudy proclivities.


    # Syncing on my mind


    You can set bandwidth limits too. The desktop client does look a bit awkward if
    you''re using Gnome, with its disappearing System Tray, though, in theory, once
    you''ve got it all configured you shouldn''t need to interact with it anymore.
    Obviously, the desktop client won''t be much use if you want to sync to a remote
    machine though: In this situation you''ll want to use the aforementioned WebDAV.


    The davfs2 program works via the FUSE kernel module and enables you to view WebDAV
    shares as if they were local filesystems. To install the package on Debian-based
    distros is just a simple matter of:


    ```

    $ sudo apt-get install davfs2

    ```


    and the package is certainly present in other distro''s repos. You can optionally
    set the SUID bit on the executable so that non-root users can mount WebDAV shares.
    Debian and Ubuntu can do this for you with:


    ```

    $ sudo dpkg-reconfigure davfs2

    ```


    If you accept the warnings (it''s pretty safe actually since the program drops
    its root privileges), then anyone in the webdav group will be able to mount WebDAV
    shares, so add your user to this group like so:


    ```

    $ sudo gpasswd -a username webdav

    ```


    Now make a folder ~/owncloud-dav which will be our mount point. We also need to
    specify our OwnCloud login credentials, which are stored in the file ~/davfs2/secrets.
    This file may have been created for you during the reconfigure earlier, but you
    can easily create it manually if not. Since this file will contain sensitive data
    it is important to lock down the permissions:


    ```

    $ chmod 600 ~/davfs2/secrets

    ```


    Add a line like the following to your secrets file


    ```

    https://yourserver.com/owncloud/remote.php/webdav

    username password

    ```


    replacing the URL, username and password as appropriate. You will also need to
    add the following to /etc/fstab (which will require root privileges, hence sudo
    nano /etc/fstab):


    ```

    https://yourserver.com/owncloud/remote.php/webdav /home/username davfs user,rw,noauto
    0 0

    ```


    Again, you''ll need to replace the username with yourself. If you want to allow
    multiple users access then you will need to add a line for each of them. If all
    goes according to plan, users will be able to mount their OwnCloud folders with
    a simple use of:


    ```

    $ mount ~/owncloud-dav

    ```


    If you''re using a self-signed certificate then you will get a warning about possible
    man-in-the-middle attacks, but we''ve been through this already. Users might want
    to automatically mount their OwnCloud resources automatically, which would normally
    just entail adding the above mount command to ~/.bashrc. However, the warning
    message will get annoying, so you can silence it and pipe an agreement by instead
    using the tricky:


    ```

    echo ''y'' | mount ~/owncloud-dav > /dev/null 2>&1

    ```


    It is also possible to mount WebDAV shares using Nautilus in Gnome or Dolphin
    in KDE without any additional software. You''ll need to use davs:// URI prefix
    in Nautilus or webdav:// in Dolphin.


    In the past year, about 300 developers have contributed new code to OwnCloud,
    which makes it one of the most active open source projects alive today and is
    a shining example of what open source can achieve.


    The feedback from the annual OwnCloud conference in Berlin indicate that it was
    a roaring success and the recent hackathon in the UK will fructify great things
    and squash many bugs. In a world where the big players and their massive data
    silos are hungry for your data, and are all to willing to move the goalposts on
    such trivial issues as privacy, maybe now is the time to make your data your own.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_80_0.png)


    The Pictures app will tile your photos as sensibly as it can, but lacks a sort
    by date option.


    Quick tip If your OwnCloud server changes its IP address or domain name then you''ll
    need to update the trusted_domains array in the file /var/www/owncloud/config/config.php.'
