- pgno: 9
  md: '# # Cover your tracks


    Here’s how you can browse the web without leaving any trace.


    According to Edward Snowden monitoring network activities is more efficient than
    attacking systems, so the NSA has programs that intercept consumer hardware, such
    as laptops and routers, and turns them into surveillance devices which can be
    turned on remotely.


    Even if you take precautions to minimise your footprint on the internet and only
    access encrypted websites, you are still exposed. You are still broadcasting your
    IP address to anyone who''s watching including the websites you visit.


    Additionally, since not all websites use SSL you’ll end up transmitting login
    credentials and other details over unencrypted channels. These can be intercepted
    easily by packet analysis tools such as Wireshark (see p102) especially over non-secure
    networks like public Wi-Fi hotspot. There are a number of solutions to help cover
    your tracks and disguise your digital footprint, bypass censorship and keep you
    invisible when online. This is especially advantageous as some websites and services
    block access to visitors from specific countries.


    The most common is the Virtual Private Network or VPN. It’s primary purpose is
    to extend a private network over a public network to allow remote workers to connect
    and use services on the workplace network. The same features also make it an ideal
    tool to create a secure connection to the Internet and guarantee that all of the
    data you send and receive is encrypted and secured from prying eyes.


    There are dozens of VPN services, and there’s a big list on the internet censorship
    wiki http://en.cship.org/wiki/VPN. When choosing a VPN, make sure it doesn’t rely
    on an application level. There are VPNs that only run inside a web browser, for
    instance. Their drawback is that they only protect what’s in the browser. If you
    were to run another browser alongside Firefox, or a separate email program, the
    data from these other programs would not be protected.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_9_0.png)


    JonDo''s interface includes the Anonym-O-Meter which gauges the level of anonymity
    offered by the active service.


    Many VPN services keep logs and say that they will co-operate with law enforcement.


    Some VPNs may also restrict certain services, such as peer-to-peer file-sharing
    services like BitTorrent. Also many VPN services keep logs and say that they will
    co-operate with law enforcement with the right paperwork. There is a wonderful
    writeup by TorrentFreak.com on which VPN services take anonymity seriously (http://bit.ly/1dvMqqy).


    When you’re looking for a VPN look for a service that supports OpenVPN and uses
    SSL/TLS for key exchange. Privacy conscious users will also want to pick a service
    operated from outside their home country. A service that has servers in multiple
    locations is always a better choice.


    # ## Embrace the onion


    Another way to bypass censorship and maintain anonymity is to use a proxy server
    tool. The most well-known of these is the Tor network. Tor, an acronym for The
    Onion Router, is a software that creates a network to allow people to browse the
    web anonymously.


    It creates a network of relay nodes across the Internet. When you visit a website
    using Tor, the data to and from your computer is bounced around these nodes before
    ending up at the website, which masks your origins from the website.


    You can use Tor to visit websites that block visitors based on their geographic
    location. The easiest way to use Tor is via the Tor Browser Bundle to connect
    to the Tor network. (See Setup the Tor Browser Bundle, p11.)


    One downside to Tor is that websites load slower as the network data goes through
    so many relay nodes in the middle. Further, some ISPs, particularly in China,
    actively search and block Tor relays, making it difficult for some users to connect.
    Also note that Tor only encrypts traffic from your computer to the exit node,
    which prevents your ISP from monitoring you. But since the traffic at the exit
    node is unencrypted, anyone that’s running the exit node can see your internet
    traffic. There are unconfirmed reports that many exit nodes are run by government
    agencies.


    One way to negate the vulnerability at Tor’s exit node is to only use secure protocols
    (HTTPS, SSH etc) when using the Tor network. You can also use the Java Anonymous
    Proxy called JonDo, which uses interconnected proxy servers to conceal your IP
    address. JonDo is similar to Tor, however the


    # ## Privacy plugins


    +   - **BetterPrivacy plugin** prompts you to delete all local shared objects
    (LSOs) every time you close the browser.

    +   - **HTTPS Everywhere plugin** Forces the web browser to use HTTPS with all
    sites that support it.

    +   - **The Web of Trust plugin** identifies dangerous websites from search results.

    +   - **DoNotTrackMe plugin** Stops third parties, ad agencies, and search engines
    from tracking the webpages you visit.

    +   - **Disconnect plugin** Prevents tracking by over 2,000 common trackers.

    +   - **Privazy Lockdown plugin** When you visit a website supported by the plugin,
    it will suggest some of the tasks you should complete to ensure your privacy is
    protected. When you click on a task, Privazy will automatically load the relevant
    settings page, along with detailed instructions on how to change that specific
    setting.'
