- pgno: 116
  md: '![](img/b6e789f7b1bc6629f6c97a3e4beae1de_116_0.png)


    Feel free to add to this epic example of a web page as you see fit. Now we are
    going to create a Dockerfile (the file must be named Dockerfile). This is just
    a text file that contains the commands that we’d otherwise enter at the prompt
    interactively. Instead, we can issue a docker build command instead, and have
    docker do the hard (?) work for us. This example is trivial of course, but adds
    our content directory to the existing Nginx image file.


    ```

    FROM nginx

    ADD content /usr/local/nginx/html

    ```


    Now run the docker build command


    ```

    sudo docker build -t nginx:test

    ```


    The -t nginx:test option here tells Docker what we’d like to call our new image,
    should the build be successful (hopefully it was). Now let us run it, and confirm
    it started:


    ```

    sudo docker run --name whatever -d -p 8080:80 nginx:test

    sudo docker ps

    ```


    # Making changes to containers


    The --name flag allows us to call our new container a name of our choosing rather
    than the auto generated one from Docker (amusing though they are). The -p, as
    is probably obvious, maps port 8080 on our local host to port 80 inside the container.
    The container has its own internal IP address which we can see by running:


    ```

    sudo docker inspect whatever

    ```


    and this returns a whole bunch of information about the system in JSON format.
    We can now see the fruits of our labour by connecting to http://127.0.0.1:8080/docker_example.html.
    While Facebook are probably not quaking in their boots at the site of our new
    website we’ve proven how quickly we can get a server up and running. We could,
    if we so wished, run dozens if not hundreds of these Nginx containers in a style
    reminiscent of the cheapest and most cut throat of web hosting companies.


    What Docker does here when running the build command is take our base image and
    add our changes to it – this new layer is then saved as it’s own container. Taking
    this further, we could have easily taken the Ubuntu image from earlier and installed
    a lot of software on it via many apt-get install lines in a Dockerfile. Each line
    would create an intermediate container, building on the one before it which would
    be removed once the change was committed, leaving us only with the end copy. This
    can also be done manually if required – we could start the Ubuntu image, make
    changes to it at the command line, exit it and then save the changes using the
    docker commit command. This git-like command gives us a kind of version control
    over our containers. When we’re done with a particular container, using the docker
    stop and docker rm commands cleans everything up for us.


    # Dock together


    Of course, having a standalone web server isn’t that much use these days. What
    if we want to set up a dynamic site that reads data from a database? Docker has
    the concept of linking containers together. Assuming that we had a database container
    named data running say, MySQL, we could create a new Nginx container as follows:


    ```

    sudo docker run -d -p 8080:80 --name whatever nginx:test

    --link data:mysql

    ```


    The Nginx system will now be able to reference the database using the alias mysql,
    and environment variables and a /etc/hosts entry will be created on the system
    for the database. Docker uses a secure tunnel for container to container traffic
    here, meaning that the database doesn’t need to export ports to the outside world.
    Docker takes care of all of this automatically.


    Docker also includes a Vagrant-like ability to share directories between the Docker
    host and containers running on it. The -v flag to the docker run command enables
    parameters such as -v /home/web/data:/web/data which will result in the container
    seeing a mount point /web/data. The -v flag can also create standalone volumes
    in the container (eg -v /data). For persistent data, the advice appears to be
    create a dedicated container for er... contain it and to then make that data available
    to other containers. They can see it by use of the --volumes-from option to docker
    run command.


    Now that we’ve had a whirlwind tour of some of the basic Docker functionality,
    in next month’s tutorial we’ll look at some of Docker’s more advanced features
    and use-cases for this software. Until then, enjoy experimenting with your new
    found container skills and take a look at the options available for the docker
    command. There’s also plenty of extra, in-depth information to be plundered from
    the official Docker website (www.docker.com). Happy docking!


    Nginx running in a Docker container. It may look like a humble beginning, but
    after a few tweaks we’ll be besieged by Silicon Valley acquisition offers, we’re
    sure.


    # Quick tip


    The Docker project maintains an online public image repository, similar to the
    likes of Vagrant, where anyone can store Docker container images. You don’t need
    an account to download anything.'
