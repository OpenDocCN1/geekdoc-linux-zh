- pgno: 23
  md: 'LAMP (Linux, Apache, MySQL, PHP) software. Basically, if you have already installed
    WordPress or similar packages you have all the skills you need to master OwnCloud.
    And if you haven’t, don’t worry – it’s much easier than it seems.


    There are several things to do or check before even downloading OwnCloud. One
    is the web space where your ownCloud will live. OwnCloud itself takes very little
    space, but if you want to use it as online storage, you may want to get an account
    with enough space from the beginning. Next, unless you are sure that you won’t
    need permanent web addresses for anything you put in OwnCloud, you should buy
    a domain name. Of course, OwnCloud doesn’t need it at all to work properly, it’s
    just that if you move your installation to another server with a different domain
    name, all the old URLs – that is, the links to your online picture gallery and
    so on – will stop working. This may be really bad, or almost irrelevant, depending
    on your needs – you decide.


    We also strongly suggest trying all the parts of OwnCloud for at least one week
    after the first installation, before offering accounts to others or publishing
    URLs of files you want to share. In that way, you’ll be free to erase everything
    and reinstall with a different configuration before going live.


    The OwnCloud installation and tips presented here were tested on a CentOS Virtual
    Private Server running Apache. Instructions for other Linux distributions can
    be found at http://doc.owncloud.org, but almost everything here will apply as-is
    to any web hosting account that supports PHP and MySQL, PostgreSQL or SQLite databases.
    The main exception is the web server and PHP configuration. The OwnCloud website
    has good documentation for several web servers, not just Apache. In any case,
    ask the web hosting provider what server they use and, above all, whether they
    have some obscure, not yet documented PHP setting that may make OwnCloud harder
    to configure (trust us, it may happen).


    # Selecting a database


    The last thing to do before installing OwnCloud is choosing which database it
    will use. SQLLite, MySQL or PostgreSQL? The first choice is simpler to handle
    and back up; an SQLite database is one single file that PHP can manage all by
    itself, if the right libraries are installed.


    If you go for SQLite, OwnCloud will create the database file transparently, in
    the same folder where it will keep your files. The other two choices need a database
    and account with an independent MySQL or PostgreSQL server. This isn’t a big deal,
    because many basic web hosting accounts include one MySQL database, or let you
    add one for a few extra pounds per year. The OwnCloud documentation recommends
    MySQL or PostgreSQL for installations with many users and/or many simultaneous
    accesses.


    A few GNU/Linux distributions (check the websites for the most up-to-date list)
    offer ownCloud binary packages that make installation and upgrades a snap. However,
    OwnCloud


    doesn’t need Linux, and one main reason to use it is portability. Therefore, in
    this tutorial we deliberately ignore some cases and only explain how to proceed
    with the raw source code you can download from the website.


    The installation procedure of OwnCloud is similar to the one for WordPress, Drupal
    and many other LAMP-free software packages. First, you put some files in a dedicated
    folder of your web space, then you configure the database and other parameters
    from your browser. The dedicated folder should be writable by the web server,
    otherwise OwnCloud won’t be able to create some of the folders it needs to work.
    The OwnCloud website offers a setup wizard that, albeit making the ‘put some files’
    part a bit easier, may not be worth using. To run that wizard, you must upload
    (let’s call it myowncloud.example.com) one small PHP file called setup-owncloud.php
    to the future home of your OwnCloud, and then point your browser to http://myowncloud.example.com/setup-owncloud.php.


    That page will check if the PHP and server configuration are compatible with OwnCloud
    and, clicking on a button, download the real code and install it in the same folder.
    After that point, the installation will proceed, as explained below, as if you
    had installed the files manually. The problem with the wizard is it may not install
    the current version of OwnCloud. That’s why we recommend the other installation
    option – just upload the compressed file with the latest stable version (which
    was a 10MB TAR file for us, later versions are closer to 30MB) to its online folder
    and unpack it there.


    At this point, unless you plan to use SQLite, make sure that you can use – or
    create if it doesn’t exist yet – a MySQL or PostgreSQL database and user just
    for OwnCloud. Here are the commands to do it from scratch for MySQL, which is
    the most common database provided for basic web hosting:


    ```

    mysql> CREATE USER ''oc_user''@''localhost'' IDENTIFIED BY ''the_mysql_password'';

    mysql> CREATE DATABASE owncloud_test;

    mysql> GRANT ALL PRIVILEGES ON owncloud_test.* TO ''oc_user''@''localhost'' IDENTIFIED
    BY ''the_mysql_password''

    ```


    You can issue these commands, or their equivalents, from whatever MySQL interface
    is available on the system, be it a web tool, such as phpMyAdmin or the command
    line client for Linux. Once you’re ready with the database, point your browser
    at myowncloud.example.com. You will find a simple web form, which will ask you
    the name and password for the administrator account, the absolute path of the
    OwnCloud root folder (which, remember, must be writable by the web server), the
    type of database and, unless you chose SQLite, its location, name, user and password.
    That’s it, as far as installation is concerned!


    > The OwnCloud bookmark manager isn’t as sophisticated as other similar applications,
    but is already very usable.


    # General configuration


    Remember that little gear icon in the bottom-left corner? If you click on it while
    logged in as administrator, it will also show an Admin tab. That’s the place where
    you can create other users’ accounts, and organise them in groups, each one with
    its own administrator. Groups are necessary if you want or need to control, with
    the greatest possible flexibility, how much users can share among themselves,
    or with the rest of the internet. Apart from grouping, each user can have a different
    quota of the available space. Even if you are the only user of your OwnCloud,
    create a different user identity for your daily activities. The administrator
    account should be reserved for administration, if only to make it harder for you
    to mess up something by mistake. Besides managing users,


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_23_0.png)'
