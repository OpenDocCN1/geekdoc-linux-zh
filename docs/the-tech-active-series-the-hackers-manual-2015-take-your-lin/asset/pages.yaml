- pgno: 82
  md: 'Projects in Django have two important files which you will deal with in this
    tutorial: settings.py and urls.py. The former details various low-level configurations
    such as project paths, any extra apps needed and which database engine will be
    used. When you add items to this, you will need to rebuild the project database
    for them to be picked up. Oftentimes these extra apps have their own databases
    which need to be migrated. Fortunately, the South utility takes care of this for
    us. The file urls.py contains a list of regular expressions that tell Django what
    to do with certain URL patterns. For example, we tell Django to invoke the Zinnia
    blog we’ll make for this tutorial for URLs with /weblog/ after the server’s URL.
    Django CMS permits (almost) seamless integration of Django applications in your
    website. In demonstration of this fact, let’s get the popular Zinnia blog application
    up and running. Interrupt your webserver with Ctrl+C, then install the Zinnia
    Python modules as well as the apphook so that the CMS and blog can converse:


    ```

    (env) $ pip install django-blog-zinnia cmsplugin_zinnia

    ```


    This requires a few additional bits of Django gubbins, so you need to add the
    following to the INSTALLED_APPS section in ~/django/my_demo/settings.py:


    ```

    ''zinnia'',

    ''cmsplugin_zinnia'',

    ''tagging'',

    ''django.contrib.comments''

    ```


    While you’re in settings.py, also add this line to prevent Zinnia attempting to
    send you an email whenever someone posts a comment on your blog:


    ```

    ZINNIA_MAIL_COMMENT_AUTHORS=False

    ```


    Next, we add the following to the beginning of the urlpatterns definition in ~/django/my_demo/urls.py:


    ```

    url(r''^weblog/'', include(''zinnia.urls'')),

    url(r''^comments/'', include(''django.contrib.comments.urls'')),

    ```


    Once that’s done, register all of your new apps into the Django database with:


    ```

    (env) $ ./manage.py syncdb

    (env) $ ./manage.py migrate

    ```


    You should then be able to see a vanilla Zinnia weblog at http://localhost:8000/weblog.
    The point of the cmsplugin-zinnia apphook is to enable content from the blog to
    be displayed elsewhere on our website. Look at the step-by-step guide to see how
    this is achieved.


    Now that you’ve got somewhere to voice your words, why not add a gallery to display
    your etchings and photographs? The Imagestore application is popular for these
    purposes. Install it with a simple:


    ```

    (env) $ pip install imagestore

    ```


    Also add the following to the INSTALLED_APPS section of ~/django/my_demo/settings.py:


    ```

    ...

    ''imagestore'',

    ''sorl.thumbnail'',

    ''imagestore.imagestore_cms'',

    ...

    ```


    Add its urls to ~/django/my_demo/urls.py:


    ```

    url(r''^gallery/'', include(''imagestore.urls'', namespace=''imagestore'')),

    ```


    Then run:

    (env) $ ./manage.py syncdb --migrate

    This will update the database. You might get an error from the South database
    migration tool as it tries to import the permissions setting, but if you run the
    command again it


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_82_0.png)


    should work correctly. Now add a new page and call it Gallery. This will automatically
    hook into the Imagestore, so when you click on it you will see your galleries.
    Or you would if there were any. We can add galleries from the admin panel on the
    left, which now has an Imagestore section within the Home tab. Once you’ve added
    some galleries, you can incorporate them on pages individually, using the newly
    visible Album and Album as Carousel elements in the structure view.


    # Gentlemen, start your nginx


    So now you have it – a very simple CMS complete with a blog and a gallery. Getting
    it online depends very much on your web server setup, but we shall briefly cover
    a very basic set up for the popular Nginx web server, which we will assume you
    have installed. We will use the package uWSGI to provide an interface between
    Django and Nginx, and for testing purposes, we shall continue to work in our virtual
    environment. We need to gather all our static files so that the web server can
    find them:


    ```

    (env) $ cd ~/django

    (env) $ ./manage.py collectstatic

    ```


    Now install the uWSGI package and fire it up to test its ability to talk to Django:


    ```

    (env) $ pip install uwsgi

    (env) $ uwsgi --http :8000 --module mysite.wsgi

    ```


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_82_1.png)


    Quick tip

    Find a more thorough guide to uWSGI and Nginx on the official uWSGI website: http://bit.ly/uWSGNginx.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_82_2.png)


    It''s a piece of cake to embed YouTube videos in your site. Getting the good people
    at Nvidia to supply card specs, not so much.'
