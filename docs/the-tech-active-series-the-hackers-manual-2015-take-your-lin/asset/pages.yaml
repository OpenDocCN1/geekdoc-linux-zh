  md: '# Networking


    out of top, if you haven’t already) and then typing exit. Docker will then shut
    our container down. You can check that this is happening by running sudo docker
    ps which will show some headers and nothing running. Docker can, of course, handle
    daemonised processes which won’t exit as soon as we’ve finished with them, so
    let’s kick one off: sudo docker run -d ubuntu /bin/bash -c "echo ‘yawn’; sleep
    60"


    This time Docker starts up our container using the -d flag and backgrounds it,
    returning to us a container id. Our simple command line runs on the container,
    sleeping away. We can now see that sudo docker ps gives us a bit more information,
    including a rather silly name that Docker has assigned our container (‘pensive_franklin’
    in our test case). We can see what the container is doing using this name: sudo
    docker logs pensive_franklin which should return a barely stifled yawn from our
    short-lived process. Once the 60 seconds are up from the sleep command Docker
    once again wields the axe and the container is no more. If we supply a larger
    value for the sleep command and get sick of waiting for the processes nap time
    to complete, we can use the docker stop command in the follow way: sudo docker
    stop pensive_franklin


    We can try the docker run command a few more times, experimenting with different
    command lines. Once we’ve had enough of such japery, we run sudo docker ps -a
    which reveals all the containers, including non-running ones. There are a bunch
    of other flags you can use, we’d suggest have a look at man docker-ps.


    # A more useful example


    This is all very well and good, but what about something more useful? A great
    example of a lightweight application that sits nicely in a container is Nginx
    [see page 76] the high performance web/cache/load balancing/proxy server. How
    easy it is for us to set up a brand new instance of Nginx, ready to serve pages
    on? Lets find out!


    A quick look on Docker Hub (https://registry.hub.docker.com) shows Nginx on the
    front page as having an official repository. We can pull this down to our local
    machine by using the pull argument to the docker command: sudo docker pull nginx


    A little while later (there are some reasonably sized layers to download) and
    our image should be available. We can see what images we have locally by issuing
    sudo docker images at the command prompt. Now, we can quickly verify Nginx is
    working by running: sudo docker run -d -p 8080:80 nginx sudo docker ps


    Assuming Nginx is reporting as being up, we can connect our desktop browser to
    http://127.0.0.1:8080 to see the default Nginx page. All well and good. But how
    can we add content to it? First, let’s stop our running container via the sudo
    docker stop <silly name> command and then include a really basic example file.
    Open up your favourite text editor and create the following, saving it as docker-example.html.
    It’s best to do this in a new sub directory – call it whatever you like – to avoid
    any other files lying around from confusing Docker in a moment. Then save this
    file in a sub directory below our new one, and call that content.


    ```

    <html>

    <head>

    <title>Here is our dockerized web site!</title>

    </head>

    <body>

    <h1>We are running in a container</h1>

    </body>

    </html>

    ```


    The Docker Hub contains many predefined Linux containers from the usual suspects.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_115_0.png)


    # Is your Docker image broken?


    One of the best things about open source and Linux are the plethora of opinions
    and ideas, particularly about the correct ways to run systems. One such example
    which caused a minor stir in the Docker world occurred when Phusion, the team
    behind the well known Phusion Passenger product/project, used extensively in Ruby
    on Rails and other web development setups, released its Docker image (available
    on Docker Hub at phusion/basimage). They argued that the common Docker practice
    of running a single application process (as evidenced by the top output in our
    tutorial) meant that many important system services wouldn’t be running in the
    container. Not least, the init process would be missing.


    Now while the whole point of using containers is to have a very lightweight system
    – use a VM if you want a full-blown OS – init does the very important job of inheriting
    orphaned child processes, and should any of those appear in your container they’ll
    end up as zombies with nowhere to go. The Phusion team also argue that some processes
    are so vital (cron, syslog and ssh) that they should always be available to a
    Linux OS, no matter how lightweight, and that pulling the legs out from underneath
    a system rather than having it shutdown properly via init could well lead to corruption
    to data. Opinions varied as to whether this was making Docker containers too complicated
    and heavyweight, but the image has been popular on Docker Hub and is well worth
    a look.


    # More networking Set up your own cloud server, see p78.'
