- pgno: 74
  md: '# Monitoring the winds of change


    So there you are, you built a custom scrape for a particular website so that it
    crawls all of the desired categories and finds the gold entries. After a month
    or two, you went back to check it out and you found there was no output.


    After a quick glance at the website, you see some data that should have shown
    up with your scraper. When this happens, you may want to open up the file or files
    and find out where things went wrong. There is a huge possibility


    that the website has altered its code and the old matches are no longer adequate.
    Therefore, going over the code and patterns should allow you to make updates so
    that you can get back to obtaining the data you want.


    contents() function does not have. This function works as long as you have PHP
    installed on your server.


    For this example, the single ebook product – it can be any ebook, but I’m shamelessly
    plugging mine – can be located here: www.amazon.ca/MYSQL-Fundamentals-Snippets-Kent-Elchuk-ebook/dp/BOOBSUD72.
    This ebook product will only have one entry in the Kindle books at Amazon.


    Therefore, this is the URL you will want to scrape in order to get this book at
    the price for which you are seeking.


    In order to know what to scrape, you need to load the URL in your browser and
    take a good long look at the source code, since it is the code that you will use
    to find patterns and extract the data you are seeking. With your Firefox and Chrome
    (Chromium) browsers, seeing the source code is as simple as planting a ‘Right
    Click’ on the page, followed by selecting ‘View Page Source’.


    Beware that the source code could start near a line like 82. You will want to
    view the source code and the actual webpage to find the code block from the source
    code. Why? Well, when you look at the web page you see a price like $2.84. That
    is what you want to scrape from the source code.


    # Simple scrape


    When you do a quick search in the source code, you will find the price $2.84 show
    up twice somewhere within the jumble of glyphs. You could be glad of either code
    block to use for pattern matching, but we will use the block that has the <input>
    HTML tag and the name of displayedGiftPrice. Since displayedGiftPrice only shows
    up once in the page, it is a very simple price scrape.


    At this simplest level, the code looks like this:


    ```

    $data = file_get_contents(''http://www.amazon.com/MYSQL-Fundamentals-Snippets-Kent-Elchuk-ebook/dp/BOOBSUD72?ref=sr_1_1&ie=UTF8&qid=1366253046&sr=8-1&keywords=php+mysql+fundamentals+and+snippets'');

    // Get the price match /

    preg_match(''/displayedGiftPrice"[a]value="(.*?)[a]"/'', $data,$desired_match);

    print_r($desired_match);

    echo $desired_match[1];

    ```


    Now, let’s go through the code. The first string $data grabs the url of the desired
    page you want to scrape. In this case, it is the URL for one specific product
    at Amazon.


    After that, the preg_match function should then be used to match the desired block
    code from the source code. The preg_match function identifies a match from a string
    and returns it as an array. The first bracket (.) will accept any characters between
    displayedGiftPrice value" and the ending double quote ".


    Essentially, this match will return an array with two values. One value will be
    the entire match and the other will be the desired value you want. In this case,
    the value we want is, of course, the price.


    For this example, a single product will be examined in order to gather its ID,
    name and price. Here is a quick synopsis of the coding that finds the exact, desired
    data. First, the URL becomes a string with the file_get_contents() function.


    Then, the Regex array is created, and it contains three elements, which will match
    the desired patterns. The first element finds the ID, the second finds the name
    and the final element identifies the price.


    After the array creation, each item in the array is iterated to find each detailed
    piece of information without any extraneous, uncalled-for scraps of data. Each
    time the loop runs, a new item will be added to the array titled $my_array. After
    the loop runs three times, $my_array contains the product ID, name and price.
    What you do with that data is up to you. One simple thought is to check the price.
    For example, if the price is less than $399 you can send yourself a text message
    or email.


    ```

    $data = file_get_contents(''http://www.amazon.com/MYSQL-Fundamentals-Snippets-Kent-Elchuk-ebook/dp/BOOBSUD72?ref=sr_1_1&ie=UTF8&qid=1366253046&sr=8-1&keywords=php+mysql+fundamentals+and+snippets'');

    preg_match(''/displayedGiftPrice"[a]value="(.*?)[a]"/'', $data,$desired_match);

    print_r($desired_match);

    echo $desired_match[1];

    ```


