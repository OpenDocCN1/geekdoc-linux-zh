- pgno: 55
  md: '# Python: Build a multi-Pi cluster


    Connect a bunch of Raspberry Pis together in a cluster – affectionately known
    as a Bramble – and harnesses their power to crack passwords.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_55_0.png)


    Once, it was common to network (not necessarily powerful) computers together to
    combine their power towards a single task, or group of related tasks. Examples
    include render and simulation farms, in which the work can be easily distributed
    between nodes. Such clusters are, in a sense, becoming less fashionable – specialist
    or enterprise-grade hardware offers a much more favourable answers-to-watts ratio,
    and multicore processors share data far faster than network cables. But let’s
    not allow trends to get in the way of good old-fashioned tinkering.


    # A thorny issue


    The collective term for the aforementioned networks is a Beowulf cluster. This
    name derives from the eponymous hero of the classic Anglo-Saxon poem, who had
    “30 men’s heft of grasp in the gripe of his hand”. Where the computer hardware
    consists solely of Raspberry Pis, a new moniker has been invented by the RPi community:
    a Bramble. While most desktop computers are (depending on your chosen benchmark)
    around an order of magnitude faster than the Pi, it is still an enjoyable and
    inexpensive exercise to multiply by Pi and therefore learn about distributed computing
    in


    Python. For this demonstration, we used two Pis powered by a Pimoroni hub (which
    gives independent power to each port) and connected via a 100Mb five-port switch,
    which cost £5 from eBay). The hub can power a maximum of five Raspberry Pis, so
    one day perhaps this Bramble will grow. For this tutorial, we will have our compute
    units brute-forcing two well-known hashing algorithms: MD5 and SHA-1. More specifically,
    we shall try to find a pre-image for a given hash value which we shall compute
    from a (rather spineless) passphrase. While both of these algorithms are vulnerable
    to collision attacks (where the goal is to find any pair of inputs with the same
    hash), pre-image attacks are much harder to come by. Such an attack does exist
    for MD5, but it still would require an unreasonable length of time. At the time
    of writing, there is no pre-image attack known for SHA-1. The Flame malware in
    2012 exploited collision weaknesses in MD5 to forge Microsoft security certificates.


    # Crunch some code


    We often hear of database compromises in which leaked credentials include password
    hashes. While the use of salt helps defend against some attacks, passwords remain
    vulnerable to a wordlist-based attack, so such a compromise should be considered
    serious. We won’t cover wordlist attacks in our Python code, concentrating rather
    on elementary character combinations. You are encouraged to have a go at implementing
    wordlists in Python – you can download prefabricated lists or generate your own
    using a tool such as Crunch. You could then write some simple code to split up
    this list and share the work among the workers.


    The cryptographic hash functions are all available in a standard Python installation
    via the hashlib library. For example, you can find the MD5 hash of the string
    password1 from the Python prompt thus:


    ```

    >>> import hashlib

    >>> h = hashlib.md5(''password1'')

    >>> h.hexdigest()

    ''7c6a180b369896a0a8c02787eafb0e4c''

    ```


    By replacing md5 with sha1 above, we also obtain the corresponding SHA-1 hash:

    ''db4a668837a519ce4616751e5d1674807d6a8a''. For our tutorial, we will attempt
    to find a pre-image for the following MD5 hash

    target_hash_md5 = ''f392b2d9f517f02c7dc21dfb2f0b0''

    Suppose we are only interested in passwords consisting of uppercase and lowercase
    letters, together with the numbers 0 to 9. This can be done painlessly by combining'
