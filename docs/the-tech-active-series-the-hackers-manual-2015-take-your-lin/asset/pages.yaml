- pgno: 100
  md: '# Networking


    address, called an Internet Protocol (IP) address. You’ve probably already seen
    an IP address at some point – it’s usually represented as four numbers separated
    by periods, such as **192.168.1.218**.


    Rather than the entire address just representing a host on the network, it’s split
    into two different parts: a network address and a host address by something called
    a prefix. The prefix is a number between 0 and 32 which specifies what portion
    of the IP address belongs to the network and what to the host. The full IP address,
    then, is written as **192.168.1.2/24**.


    # Bringing the two together


    These logical addresses work by mapping to the physical MAC addresses that we
    covered earlier, with each IP address being linked to a particular MAC address.
    You can see this in your own computer by using the **ip neighbour** command in
    the terminal:


    ```

    ip neigh show

    ```


    Each line output by this command represents one host that is reachable by your
    computer. The first entry is the host’s own IP address, while the second two specify
    which NIC it is reachable through, and the **lladdr** specifies the MAC address
    of the device. Your computer can then use this information to construct packets
    that are addressed for the correct computer.


    Now, here’s the clever bit: computers that have the same network address store
    this information about each other and can communicate directly. If they don’t
    have the same network address, then they don’t store this mapping of IP to MAC
    addresses, and so can’t communicate directly. Instead, their communication happens
    via an intermediary, known as a gateway or router.


    If a host on its own network wants to communicate with a host on another network,
    it sends its message to the gateway, with the full IP address, and then the gateway
    sends this message on to the appropriate network. The gateway at the end will
    then route the packet on to the correct host on its own network.


    > > “The knowledge of what path to send packets via is routing information”


    If these other networks have hundreds, thousands or even tens of thousands of
    hosts on them, you can see how this reduces the amount of information each host
    or router has to store. Instead of storing the MAC addresses for all these hosts,
    it only needs to concern itself with one address on each network – the gateway’s
    address.


    # Investigating routing information


    The knowledge of what path to send packets via – for example, from Computer A
    to Router A, and then from Router A to Router B, before finally reaching Computer
    B – is known as routing information, because it’s information about the route
    the packet must take.


    You can see your computer’s own routing table by using the **route** argument
    of the **ip** command:


    ```

    ip route show

    ```


    The first line of this output says ‘default’ before specifying an IP address that
    packets should travel via, along with which


    interface the packets should be sent out of. This default route is your computer’s
    fallback – if there’s not another route specified for the IP address you’re trying
    to communicate with it will send packets to this gateway.


    If you compare the destination of the default route to the output of the **ip
    neighbour** command, you’ll see that your computer has the MAC address of its
    default gateway, and so the two are able to communicate directly.


    # Arping around


    Your computer builds the table of MAC to IP address shown in the **ip neigh**
    command by using the Address Resolution Protocol (ARP). This protocol defines
    a special packet, just like the ones we saw above when we ran the **tcpdump**
    command. When your computer wants to find out the MAC address of a computer with
    a particular IP address, it will construct an ARP request packet.


    This includes your MAC address as the sender, and the IP address of the host whose
    MAC address you want to know, but it doesn’t


    specify the destination MAC address. This packet is then broadcast to every host
    connected to the same physical LAN as you – that is, it will be sent out of every
    port on a switch, but not from one router to another – saying **Request who has
    192.168.1.2 tell 192.168.1.1**, for example.


    If that IP address exists on the network, a **REPLY** ARP packet will be sent
    back to the requester’s MAC address, saying **Reply 192.168.1.2 is at ea:34:43:81:02:7c**.
    Now the two computers will be able to communicate directly.


    You can see this in action by running the **tcpdump** command from earlier again.
    Instead of opening a web page, however, in another terminal, run as root:


    **aping 192.168.1.1**


    where the IP address is that of your default gateway. If you now look at the **tcpdump**
    output, you should see an ARP conversation taking place.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_100_0.png)


    Switches are the unsung core of many networks, reducing collision domains and
    making it possible for many hosts to communicate reliably in a single network.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Wireshark:

    Analyse traffic


    We explain all the necessary essentials that you need to know to start using the
    GUI-enhanced Wireshark, and analyse three kinds of network traffic.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_101_0.png)


    Wireshark is a very popular and extremely capable network protocol analyser that
    was developed by Gerald Combs. Wireshark was born in June 2006 when Combs renamed
    the network tool Ethereal, which he also created, as he was changing jobs and
    couldn’t use the old name anymore. Nowadays, most people use Wireshark and Ethereal
    has been consigned to history. Your Linux


    distribution will have a ready to install package for analyser too, so go ahead
    and install it. You may ask what makes Wireshark different to other network analysers
    – apart from the fact that it’s free – and why we’re not simply advocating using
    tcpdump for packet capturing? The main advantage of Wireshark is that it’s a graphical
    application. Capturing and inspecting network traffic using a graphical user interface
    is a very helpful thing because it cuts through the complexity of network data.
    To help the beginner understand Wireshark they will need to understand network
    traffic. The aim of this article then is to supply a comprehensive introduction
    to TCP/IP to enable you to come to useful conclusions about the network traffic
    data you’re analysing. If you run Wireshark as a normal user, you won’t be able
    to use any network interfaces for capturing, because of the default Unix file
    permission that network interfaces have. It’s more convenient to run Wireshark
    as root (sudo wireshark) when capturing data and as a normal user when analysing
    network data. Alternatively, you can capture network data using the tcpdump command
    line utility as root and analyse it using Wireshark afterwards. Please keep in
    mind that on a truly busy network, capturing using Wireshark might slow down a
    machine or, even worse, might not enable you to capture everything because Wireshark
    needs more system resources than a command line program. In such cases using tcpdump
    for capturing network traffic is the wisest solution.


    # Capturing network data


    The easiest way to start capturing network packets is by selecting your preferred
    interface after starting Wireshark and then pressing Start. Wireshark will show
    network data on your screen depending on the traffic of your network. Note that
    you can select more than one interface. If you know nothing about TCP/IP or the
    other TCP/IP protocols, you may find the output complicated and difficult to read
    or understand. In order to stop the capturing process you just select Capture
    > Stop from the menu. Alternatively, you can press the fourth icon from the left,
    the one with a red square (which is shorthand for ‘Stop the running live capture’)
    on the Main toolbar (Note: Its exact location depends on your Wireshark version).
    This button can only be pressed while you are capturing network data. When using
    the described method for capturing, you can’t change any of the default Wireshark
    Capture Options. You can


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_101_1.png)


    The TCP packet and the IP packet format.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'see and change the Capture Options by selecting Capture > Options from the
    menu. There you can select the network Interface(s), see your IP address, apply
    capture filters, put your network card in promiscuous mode, and save your capture
    data in one or multiple files. You can even choose to stop packet capturing after
    a given number of network packets or a given amount of time or indeed a given
    size of data (in bytes).


    Wireshark doesn’t save the captured data by default but you can always save your
    data afterwards. It’s considered good practice to first save and then examine
    the network packets unless there’s a specific reason for not doing so.


    Wireshark enables you to read and analyse already captured network data from a
    large amount of file formats including tcpdump, libpcap, Sun’s snoop, HP’s nettl,
    K12 text file etc. This means that you can read almost any format of captured
    network data with Wireshark. Similarly, Wireshark enables you to save your captured
    network data in a variety of formats. You can even use Wireshark to convert a
    file from a given format to another.


    You can also export an existing file as a plain text file from the File menu.
    This option is mainly for manually processing network data or using it as input
    to another program.


    There is an option that allows you to reprint your packets. I have never used
    this option in real life but it may be useful to print packets and their full
    contents for educational purposes.


    # Display filters


    While capture filters are applied during network data capture and make Wireshark
    discard network traffic that doesn’t match the filter, display filters are applied
    after capture and ‘hide’ network traffic without deleting it. You can always disable
    a Display filter and get your hidden data back.


    Generally, display filters are considered more useful and versatile than capture
    filters because it’s unlikely you’ll know in advance what you’ll capture or want
    to examine. Nevertheless, applying filters at capture time can save you time and
    disk space and that’s the main reason you might want to use them.


    Wireshark will highlight when a display filter is syntactically correct with a
    light green background. When the syntax is erroneous, the background becomes pink.


    Display filters support comparison and logical operators. The **http.response.code
    == 404 && ip.addr == 192.168.1.1** display filter shows the traffic that either
    comes from the 192.168.1.1 IP address or goes to the 192.168.1.1 IP address that
    also has the 404 (Not Found) HTTP response code in it. The **!bootp && !ip &&
    !arp** filter excludes BOOTP, IP and


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_102_0.png)


    ARP traffic from the output. The **eth.addr == 01:23:45:67:89:ab && tcp.port ==
    25** filter displays the traffic from or to network device with the 01:23:45:67:89:ab
    MAC address that uses TCP port number 25 in its incoming or outgoing connections.


    Keep in mind that display filters don’t magically solve problems. They are extremely
    useful tools when used correctly but you still have to interpret the results,
    find the problem and think about the possible solutions yourself.


    When defining rules please remember that the **(ip.addr != 192.168.1.5)** expression
    doesn’t mean that none of the ip.addr fields can contain the 192.168.1.5 IP address.
    It actually means that one of the ip.addr fields should not contain the 192.168.1.5
    IP address. Therefore, the other ip.addr field value can be equal to 192.168.1.5.
    You can think of it as ‘there exists one ip.addr field that is not 192.168.1.5’.
    The correct way of expressing it is by typing **!(ip.addr == 192.168.1.5)**. This
    is a common misconception.


    You also remember that MAC addresses are truly useful when you want to track a
    given machine on your LAN because the IP of a machine can change if it uses DHCP
    but its MAC address is more difficult to change.


    It is advisable that you visit the display filters reference site for TCP related
    traffic at http://bit.ly/WireSharkTCP. For the list of all the available field
    names related to UDP traffic, it’s advisable to look at http://bit.ly/WireSharkUDP.


    # About TCP/IP, TCP and IP


    TCP/IP is the most widely used protocol for interconnecting computers and it is
    closely related to the internet that it’s extremely difficult to discuss TCP/IP
    without talking about the Internet and vice versa. Every device that uses it has:


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_102_1.png)


    # The TCP protocol


    TCP stands for Transmission Control Protocol. The main characteristic of TCP is
    that it’s reliable and makes sure that a packet was delivered. If there’s no proof
    of packet delivery, it resends the packet. TCP software transmits data between
    machines using segments (also called a TCP packet). TCP assigns a sequence number
    to each byte transmitted, and expects a positive acknowledgment (or ACK) from
    the receiving


    TCP stack. If the ACK is not received within a timeout interval, the data is retransmitted
    as the original packet is considered undelivered. The receiving TCP stack uses
    the sequence numbers to rearrange the segments when they arrive out of order,
    and to eliminate duplicate segments. The TCP header includes both the Source Port
    and Destination Port fields. These two fields, plus the source and destination
    IP addresses are


    combined to uniquely identify each TCP connection. Ports help TCP/IP stacks in
    network connected devices (PCs and routers etc) to distribute traffic among multiple
    programs executing on a single device. If a service wants to be seen as reliable
    it’s usually based on TCP, otherwise it’s based on IP. But as you can imagine,
    reliability comes at a cost and therefore isn’t always desirable.


    **Subscribe to Linux Format** See www.myfavouritemagazines.co.uk/lin'
