- pgno: 12
  md: '# Encrypt webmail with Mailvelope


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_12_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_12_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_12_2.png)


    # 1 Install Mailvelope


    You can install the Mailvelope tool for the Chrome browser from the Play store,
    while the add-on for Firefox is currently under development and only available
    from GitHub. Once installed, bring up the tool from Firefox’s add-on bar and select
    Options. Select the Generate Key option from the navigation bar on the left and
    enter the details to generate a key for your email address.


    # 2 Exchange keys


    Before you can exchange encrypted emails, your recipients must have your public
    key. To send them your public key, head to Display Keys > Export > Display public
    Key. Copy and paste the key block and email it to all your friends. Similarly
    you need their public key as well. When you receive a key, go to Import Keys and
    paste the key in the box and hit Submit to add it to your keyring.


    # 3 Encrypt messages


    Now compose a message and click on the floating icon in the window. Type the message
    and click the lock icon. Add the recipients, click OK and the text will be encrypted.
    Then click on the Transfer button to paste the text into the body of the message.
    When the message is received it will be picked up by the add-on. Your recipients
    will need to enter their password to read your message.


    There is one thing to bear in mind when using IM: Your conversation may be encrypted,
    but there’s no automatic way of knowing whether you are talking to your contact
    or an imposter. The plugin can help you establish the contact’s identity by using
    any one of its three mechanisms. You can either exchange a pre-arranged secret
    or code-phrase, or pose a question whose answer is only known to your contact,
    or manually verify the fingerprints of your key using a different method of communication.


    The OTR plugin is designed for encrypting one-to-one chat sessions. If you want
    to encrypt multi-user chats, head to http://cryptocat.org. CryptoCat is an online
    service that lets you set up secure conversations. It encrypts messages inside
    the browser itself using the AES-256 and 4096-bit asymmetric keys.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_12_3.png)


    Use the built-in tools in the chat clients to establish the identity of the person
    on the other side before transmitting confidential information.


    # Snoop-proof chats


    To use the service you’ll have to first install it as an add-on to either Firefox
    or Chrome. When initiating a conversation, you’ll first have to pick a name for
    the chat room you wish to create as well as a screen name. Once it has the information,
    CryptoCat will generate the encryption keys, create your chat room and log you
    in. Those who wish to join you must install the browser add-on as well, and then
    just enter the name of your chat room to join you.


    Since there’s no password protection and you’ll all be using pseudonyms and not
    your real name, CryptoCat offers the Q&A mechanism to verify the identity of the
    users. Furthermore, from within the interface you can change your status and toggle
    desktop and audio notifications.


    CryptoCat is designed for facilitating encrypted multi-user group conversations.
    But you can also chat privately with a member. Also remember that while your communications
    are encrypted, the connection is not anonymised and your identity can still be
    traced. To prevent this, CryptoCat recommends you use the service via the Tor
    proxy network.


    As with text, you can also make secure voice and video calls to another user via
    Voice over IP (VoIP). To ensure the privacy of the connected parties, the creator
    of PGP Phil Zimmerman has created the ZRTP protocol.


    This protocol is responsible for negotiating keys between the connected peers
    and establishes a SRTP connection between them which does the actual encryption.
    The GNU/ZRTP library implements most of the features.


    To prevent man-in-the-middle attacks, ZRTP uses a mechanism called Short Authentication
    String or SAS. ZRTP defines the length of the SAS as four characters. When a call
    is made using ZRTP, one party reads the first two characters of the SAS and the
    other reads the last two. Both values should match. It’s good practice to compare
    the values at the beginning of the call and then again after reasonable intervals.


    A Java implementation of the GNU/ZRTP library is implemented in the open source
    Jitsi VoIP client [see Roundup, p22 XF18]. This supports protocols, such as SIP
    and XMPP and can stream desktops and establish audio conference calls.'
