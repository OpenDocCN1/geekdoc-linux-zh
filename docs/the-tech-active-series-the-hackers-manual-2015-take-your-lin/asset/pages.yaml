  md: 'additionally require the libssl and libcrypto headers. The following commands
    will install these on Raspbian, assuming that you have a working internet connection:


    ```

    $ apt-get update

    ```


    ```

    $ apt-get install libssl-dev

    ```


    Download the source from the website, and then unzip it and begin the lengthy
    compilation process like so:


    ```

    $ tar -xzvf john-8VER-jumbo-SREL.tar.gz

    ```


    ```

    $ cd john/src

    ```


    ```

    $ make generic

    ```


    This takes about half an hour on a standard-clocked Pi. Once it has finished building,
    we can use the following command to test out our install:


    ```

    $ cd ../run

    ```


    ```

    $ ./john -test

    ```


    Our freshly-squeezed binary will benchmark all of its available algorithms. RawMD5
    scored about 330kH/s on our device, outperforming by a factor of about 50 our
    Python implementation. For SHA-1 (--mode=raw-sha), John managed a respectable
    190kH/s. Now make a text file target.md5 consisting of a single line with our
    target MD5 hash from before, beginning 392b2. We can implement our letters and
    numbers-only character set by using incremental mode with the Alnum character
    set.


    ```

    $ ./john --incremental=alnum --length=6 --format=raw-md5 target.md5

    ```


    This would probably take about two days to complete on your average Raspberry
    Pi, and it still would not find the required pre-image. This remains as a challenge
    for you, dear reader. However, your challenge is eased by JTR''s extremely helpful
    --node option, which enables you to achieve some primitive parallelism. For example,
    if we were to saturate our switch with five Pis, we could add the option --node
    n/5 to


    the previous code, replacing n with the number of the Raspberry Pi on which it
    is being run. This will cause John to work on only the relevant fifth of the possible
    inputs, so that we could realistically expect to get through all six-character
    alphanumeric passwords in about 10 hours.


    You can generate MD5 hashes with the md5sum command. For example:


    ```

    $ echo -n "test"|md5sum

    096f6bcd4621d373cade4e832627b4f6 -

    ```


    Paste this result, without the space and dash at the end (md5sum is most often
    used to hash files and the filename would usually go after these characters –
    add |cut -d '' '' -f1 if it bothers you) into a file test.md5. Now run the following
    to convince yourself that John is actually capable of processing these hashes
    correctly.


    ```

    $ ./john --incremental=alnum --length=4 --format=raw-md5 test.md5

    ```


    # Words work


    It would be remiss not to mention the more intelligent wordlist mode of JTR. Numerous
    wordlists are available from the website, and one can also define mangling rules
    for combining them. It is even possible to use a hybrid mode with some incremental
    characters, to maximise your chances of success prior to the universe ending.
    At the time of writing, the most impressive MD5 benchmark is close to 2GH/s (this
    is with the aid of 16 Radeon 7550s). With such power, an eight-character password
    (using only the 62 characters we''ve been working with) could be recovered in
    about a week. Faster technology is always just around the corner, and so the old
    adage that eight-character passwords are secure no longer holds up. In sum: get
    thyself a password manager and be safe, kids.


    # David Gull''s 40-Pi cluster

    http://bit.ly/40PiCluster


    David''s goal was to make a model supercomputer which behaves exactly like the
    real thing. This beastie has 12 1TB drives and 6 external Ethernet ports. A CNC
    laser cutter was used to make the stylish case.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_58_0.png)


    # Southampton University Iridis-Pi Lego Supercomputer (64 Pis)

    http://bit.ly/64PISuperComputer


    The whole thing cost a mere £2,500 to build and achieves 1.14Gflops/s running
    the HPL matrix inversion benchmark across all 12 nodes. It uses the older 256MB
    model, so memory is scarce.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_58_1.png)'
