- pgno: 79
  md: '# Can I share with you... there?


    shares, OpenStack object storage or third-party storage, such as Google Drive,
    Dropbox, Amazon S3. The exciting new addition here is the ability to share between
    OwnCloud installations – or so-called server to server sharing. This is easy to
    set up, you can enable specific OwnCloud shares for users, or if you trust them
    you can grant them the freedom to connect to the OwnCloud resources. Obviously
    they will require their own login details for each resource they access.


    Server to server sharing takes the headache out of the otherwise awkward process
    of downloading a file from one cloud to the desktop so that it can then be uploaded
    to another cloud. Not to mention all the synchronisation issues that arise from
    having three different versions of a file flying about. But OwnCloud promises
    yet more in future versions, having a vision of a so-called ''federation of data''
    wherein you''ll seamlessly share files between clouds without having to have explicit
    access to them. This goes one step further towards abstracting away the boundaries
    between servers.


    The web interface has received some polish too, being now much more friendly to
    mobile devices, although mobile users may be happy to use the dedicated apps.
    Documents are lazy loaded, so documents or extensive photo galleries are read
    piece-wise as you manipulate an ever-shrinking scroll bar. While this makes things
    appear initially faster, it can be a little awkward in some situations.


    Most notably in the Pictures app where there''s currently no option to sort by
    date, so if you just want to see the newest shots in a large folder, then prepare
    for some lengthy scrolling in and wait times. There''s a bug report filed about
    this though, and an improved lazy-load is earmarked for 7.0.3.


    Apps exist for your Android or (shudder) iDevices so you can get your data while
    you''re on the go, or too lazy to walk to your computer. At present they''re priced
    at 63p and 69p on the official stores, but the Android one is open source and
    freely available from other sources (such as F-Droid) if you''re feeling impecunious.
    Unfortunately, the apps aren''t quite as svete as their Dropbox and Google Drive
    peers. In particular uploading multiple files has to be done one at a time, and
    there''s no option to upload an entire folder. This might be a dealbreaker for
    some, but needn''t be: OwnCloud can share its files through the WebDAV protocol,
    and there are all manner of apps for syncing shares on your tabs and mobs.


    If you''re too cool for setting up a traditional install methods, then there are
    a few all ready to roll at https://registry.hub.docker.com


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_79_0.png)


    # Appy appy fun bus


    OwnCloud ships with a number of optional applications, including a Calendar and
    Contacts List, as well as the already mentioned Documents and Pictures apps. As
    the OwnCloud community grows a number of exciting third-party applications are
    appearing. In fact there''s a whole bunch of them for your perusal at http://apps.owncloud.com.


    For example, you can download an app called Music which will index a music directory
    for you and then let you play it by through a neat HTML5 interface. It can also
    work in tandem with the Ampache media server, so that your files can be played
    through any compatible client. A favourite, by a long way, in the LXP office was
    the Chat application, through which all manner of legally unreproducible dialogue
    was transmitted, all in the name of testing.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_79_1.png)'
