  md: '# Build a router


    # Create a virtual machine


    # 1 Name your VM


    Click the ''New'' button in the top-left of the main VirtualBox window. Give the
    VM a name, and select ''Linux'' and ''Red Hat'' (along with the appropriate architecture)
    from the options given in the drop-down menus.


    # 2 Choose memory size


    We suggest setting the memory allocation to at least 512MB of RAM – which is generally
    specified for simple networking tasks. This will be more than adequate for our
    CentOS virtual machine.


    # 3 Create virtual drive


    You can do this however you want, but make sure the virtual drive is at least
    8GB. Using a dynamically assigned disk will save time while creating the virtual
    machine, but they can be slower in use.


    # 4 Add the network


    Highlight the new virtual machine, select ''Settings'' and then switch to the
    Network view. Switch to Adapter 2, and tick the ''Enable'' box. Note: make sure
    that it''s attached to an internal network.


    # 5 Select the CD


    Under the Storage section of the Settings menu, select Empty under the IDE controller,
    and then click the CD icon to the right to browse to the CentOS ISO image that
    you downloaded earlier.


    # 6 Install CentOS


    Finally, click ''Start'' and proceed through the CentOS installation procedure
    in the normal way and repeat for the second virtual machine. We''re now ready
    to set up access to the internet via the NAT network.


    Host Configuration Protocol. This means the VM will get an IP address, along with
    a gateway and DNS information, automatically assigned from a remote server. In
    this case, there''s not a remote server, just VirtualBox emulating one. Other
    possibilities for BOOTP/PROTO exist, including static, if you want to permanently
    assign an IP address to this machine manually. Finally, ONBOOT says that this
    interface should be started whenever the network init scripts are run on this
    machine, such as at boot time or by restarting the network service. Test this
    by executing, as root, /etc/init.d/network restart and


    check that your networking works as expected by using the ping tool to send packets
    to a popular website, such as Google: ping google.com With a bit of luck, you''ll
    get packets returned to you, demonstrating that you are connected to the internet,
    implying your IP address, subnet mask (or prefix), default gateway and DNS – everything
    you need for a network connection – are set up and working properly. You can inspect
    all of these settings by looking at the various configuration files, or by using
    the tools discussed on the previous pages. For instance, ip route will reveal
    your'
