- pgno: 113
  md: '# Docker: Build containers


    Linux Format looks at Docker, the project that promises to solve all manner of
    application development and deployment headaches.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_113_0.png)


    still in use today. FreeBSD introduced the jail command which added to the concept
    and compartmentalised the system to a greater degree. Solaris, AIX and HP-UX all
    have their own variants too, but as you''d expect, Linux leads the way with a
    number of projects offering slightly differing implementations of the idea. These
    projects build upon a kernel feature known as cgroups, which (put very simply)
    provides a way of bundling a collection of processes together into a group and
    managing their consumption of system resources. Related to cgroups is yet another
    kernel feature: namespace isolation, which enables groups of processes to be isolated
    from others on the same system (so that they are not aware of the resources of
    other processes).


    # All about the apps


    Docker is one of the aforementioned projects but has a few differences from the
    others which have made it stand out. As stated in the Docker FAQ (http://docs.docker.com/faq),
    it''s not a replacement for the underlying LXC technology, but adds some useful
    features on top of it. Docker is very much focused on applications rather than
    fully blown operating systems, promising to combine container virtualisation with
    workflows and tooling for application management and deployment. It also enables
    containers (and hence applications) to be moved between systems portably and enable
    them to run unchanged. Add to this tools which enable developers to assemble containers
    from their source code, container versioning (in a manner very similar to git)
    and component re-use (use a container as a base image and build upon it) and it''s
    little wonder that Docker has captured so


    Anyone with a vague interest in the topics of virtualisation, ''the cloud'' or
    DevOps will undoubtedly have heard mention of Docker and containers at some point
    in the last six months. In a rapidly evolving area, Docker has managed to grab
    the headlines and vendors have scrambled to point out that they are on board with
    the cool kids and developers in being able to run and in some cases enhance this
    new technology. But what is Docker, and why should you care?


    In the spirit of diving into something new to get an idea of how it works, in
    this tutorial we''re going to look at containers, some of the Docker functionality
    and build some examples. We used an Ubuntu 14.04 desktop system while writing
    this article, but Docker is very distro agnostic, so you should be able to follow
    these instructions on most systems.


    Containers as a software concept have been around for some time on Unix. The venerable
    chroot (which was initially written in 1979) introduced the idea of running a
    program in a virtualised copy of the operating system for security purposes (although
    it involved some manual work for the system administrator in order to get up and
    running) and it''s


    Quick tip

    The Docker project likes to compare it''s containers to the shipping equivalent:
    a box with standard properties - agreed dimensions and characteristics that can
    be lifted and shifted anywhere in the world no matter what it contains.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_113_1.png)


    1 Inside our very first Docker container – probably the oddest looking top output
    you''ll ever see'
