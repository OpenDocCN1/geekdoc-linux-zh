  md: '# Skills: Security, Twitter API


    # Hack #1: Tweeting security camera


    The launch of the official Raspberry Pi camera module threw open a world of possibilities.
    Hackers who were already using USB cameras now had a minuscule Full HD shooter
    that was ideal for projects like surveillance. Combined with the Pi’s computing
    prowess, you can send the captured security images into your Twitter stream.


    Before you attach the camera, locate the Camera Serial Interface (next to the
    Ethernet port) and pull the tab gently up. Now push the camera module’s ribbon
    cable into the slot, with the silver contacts on the cable facing away from the
    Ethernet port. Remember not to push the cable in very deep. Now hold it in place
    with one hand and push the CSI tab back down with the other hand to lock the camera’s
    ribbon.


    With the hardware in place, it’s now time to set up the software. Boot into Raspbian
    and bring up the configuration tool to configure your Pi with sudo raspi-config.
    Scroll down the list to the item that reads Enable Camera. You’ll need to confirm
    your choice and restart your Pi. On restart, you’ll be able to use the well-documented
    raspistill and raspivid commands to capture still images and videos respectively.


    To capture motion, we’ll use the lightweight motion detection Python script written
    by Raspberry Pi community members. The script relies on the Python Imaging Library
    which is a library for analysing and manipulating images. You can install it with
    sudo apt-get install python-imaging-tk. Also create a directory named picam under
    your home directory for the script to store images with mkdir ~/picam. Now grab
    the script and make it executable with wget -c http://pastebin.com/raw.php?i=y7J7Jz9w
    -O picam.py and make it executable with chmod +x picam.py.


    When you run the script with ./picam.py, it’ll turn on the red LED on the Pi camera
    and start taking low-resolution images. It’ll then look for movement by comparing
    the pixels in two consecutive images. If it detects changes, the script will capture
    a higher-resolution image. The script is very efficient and will automatically
    remove the low-res images it captures for comparison and only store the high-res
    images that have captured the motion. To run the script at boot, you’ll need an
    init script that runs the picam.py script and kills it before shutting down the
    Raspberry Pi. Again, the community has done all the legwork for you. Just grab
    their script with wget http://pastebin.com/raw.php?i=AfqbjQrb -O picam_init and
    move it into the correct location with sudo mv ~/picam_init /etc/init.d/picam_init
    /etc/init.d/picam before making it executable with sudo chmod +x /etc/init.d/picam.
    Finally, you need to make the boot system aware of this script with sudo update-rc.d
    picam defaults...


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_38_0.png)


    The script will now start and shutdown along with the Raspberry Pi. You can also
    manually control it like any other daemon. For example /etc/init.d/picam stop
    will stop the script and /etc/init.d/picam start will start it.


    # Post to Twitter


    We’ll now setup a new Twitter account and ask the Pi to post images to it. Make
    sure the account is private. Begin by installing Python’s pip package manager
    for installing Python libraries with sudo apt-get install python-pip. Then install
    Tweepy: a Python wrapper for the Twitter API with sudo pip install tweepy. Note:
    To use Tweepy you need a Twitter developer account. Head to https://apps.twitter.com
    and sign in with the credentials of the new account. In the page that opens click
    on ‘Create New App’ and use the space provided to give it a name and a description.
    Leave out the Callback URL field. Scroll down the page and create the app.


    Initially, the app is created with read-only permissions. Click on the app, switch
    to the Permissions tab and toggle the Read and Write radio button. Then switch
    to the API Keys tab and click on Create My Access Token button. Make a note of
    the API Key, API Secret, Access Token, and Access Token Secret variables listed
    on this page.


    Then download the modified picam script, altered to post captured images to Twitter:
    https://raw.githubusercontent.com/ghalfacree/bash-scripts/master/picamera-security.py
    > picam.py. Open this new picam.py in a text editor and insert the four bits of
    information you jotted from Twitter in the space provided at the top of the script.
    When you’re done, make it executable with chmod +x picam.py. Now when you run
    the script and it detects motion, in addition to capturing an image and storing
    it in the SD card, the Pi will also post it on your private Twitter account which
    will then show up in your Twitter feed.


    > “The launch of the Raspberry Pi camera module threw open a world of possibilities…”


    It weighs just 9 grams but the Raspberry Pi camera module can shoot still images
    with a resolution of 2,592x1,944 as well as Full HD 1080p video 30fps and 720p
    video 60fps.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_38_1.png)


    The Kali Linux distro is designed specifically for penetration testing and is
    available for the Raspberry Pi.'
