    \ callback=callback)\n    jobs = []\n    start = 0\n    for i in range(nchunks):\n\
    \        end = start + chunk_size\n        job = cluster.submit(start, end, chars,\
    \ length, target_hash, md5)\n        job.id = i\n        start = end\n       \
    \ jobs.append(job)\n    cluster.wait()\n    cluster.status()\n```\n\nnetwork config\
    \ files or with a simple:\n$ ifconfig eth0 10.0.1.1/24\nThis might involve a hefty\
    \ bout of display and keyboard cable swapping if you have many Pis. The actual\
    \ addresses aren’t so important here, as long as everyone is on the same subnet\
    \ then dispy will be able to discover all of the slaves.\nA simple job cluster\
    \ for our md5cracker() function is created using dispy like this:\ncluster = dispy.JobCluster(md5cracker,\
    \ callback=callback)\nThe callback parameter tells our cluster to call a function\
    \ called callback() whenever one of the nodes finds the password or runs out of\
    \ work. A callback function can also be used to collate intermediate or approximate\
    \ results for more complex scenarios, but we shan’t worry about this. Our callback\
    \ function need only check the result and if it’s not False then it can shut down\
    \ all the other jobs:\n\n```\ndef callback(job):\n    if job.result:\n       \
    \ print \"Great Victory!\", job.result\n        for j in jobs:\n            if\
    \ j.status in [dispy.DispyJob.Created, dispy.DispyJob.Running]:\n            \
    \    cluster.cancel()\n```\n\nSince the md5cracker() function needs the itertools\
    \ and hashlib modules, these have to be imported from inside the function. For\
    \ reasons of synchronisation, dispy won’t let you share any in-scope variables\
    \ with the workers, so the md5cracker() function accepts the following additional\
    \ parameters: chars (list of characters), length (password length) and thash (the\
    \ target hash).\nFinally we will use the following bit of boiler-plate to kick\
    \ the system into action when multi.py is executed and display some stats when\
    \ ‘tis done:\n\nThere are many alternatives to the dispy module (https://wiki.python.org/moin/ParallelProcessing),\
    \ but it was chosen because it is well suited to simple parallelism such as our\
    \ distributed hashing. If you want to investigate parallel processing using just\
    \ a multicore machine, you should check out Python’s native multiprocessing library.\
    \ This allows things such as shared variables to be set up much more easily and\
    \ consistently than when your processes are non-local. If you want to go even\
    \ deeper into the parallelism rabbit hole, you should get to grips with the Message\
    \ Parsing Interface (MPI).\nJohn the Ripper is a popular open source password\
    \ cracker. There is also a community-enhanced edition, which features support\
    \ for GPU-based cracking, as well as some additional hash and cipher types. The\
    \ source for this version (codenamed Jumbo) is available at the project’s website,\
    \ www.openwall.com/john. We can compile this from source on the Pi. Raspbian includes\
    \ gcc by default, but we\n\n# Other Bramble projects\n\nOffice document cracking\
    \ (10 Raspberry Pis)\nhttp://bit.ly/10PICluster\nShane’s project uses a patched\
    \ version of JiT to crack password protected MS Office, LibreOffice and PDF documents.\
    \ MS Office 2007 introduced AES encryption with a 128-bit key, ouch!\n\nTower\
    \ of Pi (10 Raspberry Pis)\nhttp://bit.ly/10PITower\nThis used 9 RPi slaves and\
    \ 1 Cubie board as a master controller for MPI processing. It had a neat 16x2\
    \ RGB display for status information. Now it has been repurposed as the 32-node\
    \ Cubical Monolith Project.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_57_0.png)\n\
