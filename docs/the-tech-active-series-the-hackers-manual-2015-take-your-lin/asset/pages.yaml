- pgno: 119
  md: '# Installing the frontend


    Before we proceed to installing the frontend, we have to make sure that zabbix-server
    is running. The command zabbix-server will start it if it isn’t. You can now point
    the browser to http://localhost/zabbix for the installation wizard, which will
    guide you through the installation.


    Click Next at the bottom-right to begin the installation. Zabbix will report all
    errors it encounters in the /etc/php.ini PHP configuration file. The errors will
    be highlighted in red and the wizard will inform you of the current values, as
    specified in the file for the errant variables, and the value expected by Zabbix.


    You can’t proceed with the installation until you fix all the reported errors.
    Unfortunately, you will have to manually edit the file to make the recommended
    changes. With a fresh PHP installation, you will need to change the timezone,
    post_max_size, max_execution_size, and max_input time values.


    ```

    Save the /etc/php.ini file after making the changes and then run

    apachectl restart

    ```


    which will ensure that the new settings are used.

    Return to the wizard and click Refresh at the bottom of the screen. If you are
    a master sorcerer with the power of making conf files bend to your will, Zabbix
    will let you proceed with the installation.


    Click Next and provide the details for the database we created earlier, such as
    the database name, username and password.

    The next couple of steps in the wizard are fairly routine. You will be presented
    with all the information you’ve specified so far, so that you can review it, and
    finally the frontend is installed. You will be automatically redirected to the
    login screen when you click Finish.


    This completes the server-side setup for Zabbix. You can now install zabbix-agent
    on all machines on the network that you wish to monitor. On CentOS, the command
    su -c "yum -y install zabbix20-agent" will do the trick.


    > Quick tip

    > Databases are the main bottleneck for Zabbix. Make sure to properly tune your
    database performance out of your system.


    > Zabbix has no love for orphaned users, a user must belong to at least one user
    group.


    The default username for the newly-installed administration frontend is ‘admin’
    and the password is ‘zabbix’.

    When you first log in to Zabbix, you might feel a bit overwhelmed by all the information
    that is presented to you. But don’t worry, as we’ll soon make some nice introductions
    and you can then take your own time to get acquainted with Zabbix and all it offers.


    Before we proceed, though, the first thing you need to do is change the password.
    Click Profile on the top-right of the page and then click the Change Password
    button. Fill in the new password and click Save at the bottom.


    As Zabbix is such a vast project, with so many features, it is very difficult
    to bring them all together. All of the configuration options are split between
    five main tabs on the top menu bar: Monitoring, Inventory, Reports, Configuration
    and Administration.


    As you move the mouse over any of these tabs, the second menu reflects what each
    of these has to offer. For instance, when you hover the mouse over Monitoring,
    the second menu will show Overview, Web, Graphs, Triggers, etc. The second menu
    is essentially a sub-menu that reflects the options for the selected main tab.


    # Monitor everything


    While trial and error is a time-tested technique for mastering just about anything,
    Zabbix is not one of those things. Sure, you can attempt to find your way through
    all the tabs, menus, sub-menus, drop-down lists and everything else, but you’d
    be far better served if you spent some quality time with the comprehensive Zabbix
    manual (https://www.zabbix.com/documentation/2.0/manual).


    Every entity on the network that you wish to monitor, be it a printer, a network
    switch, a file, router, physical server, or virtual machine, etc., is identified
    as a host. To begin monitoring anything, you first need to create a host. To add
    a host, navigate to Configuration > Hosts and click the Create host button on
    the right. When adding a host, you must select at least one host group. This is
    because permissions are linked to groups and not individual hosts. Fill in all
    the other details, such as the IP address of the host, and click Save when you’re
    done. For more details, refer to https://www.zabbix.com/documentation/2.0/manual/config/hosts.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'For more details, refer to https://www.zabbix.com/documentation/2.0/manual/config/items/item.
    The Zabbix installation provides a Zabbix server host, with 58 items configured
    out of the box. But this host isn’t enabled by default. You can enable it, and
    study the items in it to get a better understanding of how Zabbix works and what
    it means to configure hosts and items.


    Once you’ve created hosts and items, you can head straight over to Monitoring
    > Latest data to see what information Zabbix has managed to collect about your
    configured hosts. If you use the default Zabbix server hosts, you can also see
    the collected data represented in graphs. From under the Local data heading, select
    the item that you want more details on and then click the graph link at the extreme
    right.


    # Trigger happy


    You still need to create a Trigger for your configured hosts. A trigger is used
    to analyse the collected data and compare it with acceptable values. In case there
    is a discrepancy in the two values, Zabbix will report a problem. You can use
    operators, such as more than, less than, not equal to, etc. to define triggers.
    As with items, you create triggers from the Configuration > Hosts screen itself.


    Once this is done, the final step is to configure the system to send Notifications,
    in case Zabbix discovers any problems with the collected data. This is done in
    two steps.


    You have to first define a media type, which is the delivery mechanism used to
    send out notifications, such as SMS, Jabber, email, etc. You can configure the
    media type from the Administration > Media types page.


    Next, you must define an action under Configuration > Actions. For each action,
    you must specify an event source, such as trigger, and the operation. The operation
    can be either to send a message via the configured media type or to execute a
    remote command. The latter option you can use to automatically run the pre-defined
    command on the remote machine in case certain conditions are met. You can use
    this feature to execute critical commands, such as deleting older files and emptying
    /tmp on the remote machine in case it runs out of disk space, etc.


    If you plan to watch the same set of parameters for all the machines on your network,
    it makes little sense to go through all of these steps repeatedly. Zabbix offers
    a far more practical solution in the way of templates. You can think of templates
    as a set of predefined entities, such as items, triggers, actions, etc. You can
    apply such templates to each new host you create to save time.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_120_0.png)


    Head over to Configuration > Screens if you wish to group information from various
    sources and have it displayed on a single screen.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_120_1.png)


    You can set up multiple user accounts and groups, and use Zabbix’s comprehensive
    permissions system to restrict access to administrative functions or monitored
    hosts. The users fall under two different classes: those with access to control
    the Zabbix frontend functions and those that have access only to monitored hosts
    in hostgroups. A user can be classified as User, Admin, or Super Admin. Only a
    Super Admin has complete control over every aspect of the system. You can restrict
    the functions and devices that other kinds of users can access and monitor. For
    instance, the Zabbix Admin has access to Monitoring and Configuration menus, but
    can’t access any configured host groups. But you can add permissions to enable
    such access.


    To create a new user, click the Administration tab on the first menu bar and then
    click Users in the second menu bar. This screen lists all the configured user
    groups. Click the User groups drop-down list on the top-right of the screen and
    select Users. Now click the Create user button. In addition to providing a tricky-to-navigate
    interface, Zabbix also isn’t very intuitive. For instance, you can’t assign permissions
    to individual users, only to user groups. So, you must first create a user group,
    add your user to this new user group, and then define permissions to the new user
    group, so that the user has more access.


    Your choice of Item type, whether Zabbix agent, SNMP, etc, will decide what items
    you can track.


    # Scratching the surface


    It must seem as we rushed through what is the most important part of the tutorial:
    providing instructions on how to use the application. Unfortunately, given the
    vastness of the project, it was impossible to go into much detail. But the project
    provides excellent documentation that discusses each step in the process in detail.
    What’s more, there’s a very active user community, which you can turn to in the
    event that you run into any problems.


    Zabbix is one of those tools that you must spend plenty of time with before you
    see any results. For those who are well versed with the network and know what
    parameters they wish to monitor, Zabbix will seem fairly easy to use, even if
    you’ve never used a network monitoring app.


    Much of the criticism against Zabbix is tied to its web-interface and not the
    features or functionality it provides. While the interface does seem non-intuitive
    at times, the developers deserve high praise for providing an excellent mechanism
    to control every aspect of Zabbix.'
  merge: -1
  img_proc: true
