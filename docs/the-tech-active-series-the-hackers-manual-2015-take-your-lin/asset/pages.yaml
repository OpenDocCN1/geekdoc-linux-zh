- pgno: 127
  md: '# Advanced hacks


    Tighten up swap space and indexing and streamline your kernel.


    The tricks in the previous pages will help you get good traction out of your Linux
    distro with minimal effort. But if these don’t satiate your appetite for speed,
    lets move on to some advanced tweaks. However, before you apply these hacks, remember
    that not only are they more involved, but if applied carelessly they can have
    serious ramifications on your system setup.


    Let’s start with a RAM disk, which is a memory-based filesystem that creates a
    storage area directly in your computer’s RAM as if it were a partition on a disk
    drive. The major benefit to this is that RAM disks are very fast. Since the data
    inside them is lost when you reboot the machine, a RAM disk is only suitable for
    apps which need repetitively small data areas for caching or using as temporary
    space.


    Before creating a RAM disk use the free command to check the amount of unused
    RAM on your distro. Then create a folder to use as a mount point for your RAM
    disk with sudo mkdir /mnt/ramdisk and mount it with:


    ```

    sudo mount -t tmpfs -o size=1024M tmpfs /mnt/ramdisk

    ```


    This will create a 1GB RAM disk using the tmpfs file system designed specifically
    for creating RAM disks.


    To make sure the RAM disk is mounted automatically whenever you boot into the
    distro, you’ll have to add it to the /etc/fstab file. Open it in a text editor
    and enter the following in a new line:


    ```

    tmpfs /mnt/ramdisk tmpfs nodev,nosuid,noexec,nodiratime,size=2048M 0 0

    ```


    Once you’ve created the RAM disk, you can use it to house your browser’s cache.
    If you use the Chromium browser, all you have to do is modify the launcher entry
    to point to the RAM disk with the appropriate switch such as --disk-cache-dir="/mnt/ramdisk".


    If you use Firefox, type about:config in the location bar. Right-click somewhere
    in the list and select New > String. When asked for the name of the preference,
    type browser.cache.disk.parent_directory and then for its value type the path
    to where you want to store the cache, such as /mnt/ramdisk. Next locate the preference
    browser.cache.disk.enable and make sure it’s set to True, otherwise double-click
    on it to toggle it.


    # Control swap usage


    Wondering why your RAM-laden machine is still slow off the blocks? Chances are
    it’s because your distro is still using swap space on the hard disk, which has
    a slower read/write speed than RAM.


    If your system has enough memory to handle whatever you throw at it, you should
    minimise the use of swap space. The swappiness parameter manages the ability of
    the kernel to shift processes out of physical memory and onto the swap disk, which
    can increase application response times when processes are moved out of memory
    vigorously.


    The command cat /proc/sys/vm/swappiness will display the current level of swappiness
    set by your distro. Ubuntu’s default swappiness value is 60. The parameter will


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_127_0.png)


    > Consider using a benchmarking tool such as the Phoronix Test Suite to gauge
    the performance of your rig regularly.


    # Analyse and optimise boot up


    We’ve already looked at the graphical tools that most distros bundle to help curtail
    unnecessary applications and services. Here we’ll look at ways to further optimise
    the boot using Systemd. This is a system management daemon that’s designed to
    replace the ageing init system. Like init, Systemd is a master daemon that manages
    other daemons.


    Major desktop distributions, such as Fedora, Mageia, and OpenSUSE have already
    switched to the Systemd daemon while others like Debian and Ubuntu have announced
    plans to switch in forthcoming releases.


    On a Systemd distro, you can measure boot times with the systemd-analyze command
    which will print the time taken to boot the kernel and load the services and the
    user space.


    You can use systemd-analyze blame | head to get a list of the processes that take
    up most of the boot time and they are ordered by the time they took to initialise.
    The systemd-analyze plot > boot.svg command will visualise the entire boot process
    in the boot.svg image file. You can view this file in the browser to get an idea
    about the chains of processes.


    Once you’ve identified a problematic service, you can mask the service. When you
    do this to a service, it cannot be started using Systemd, and in essence becomes
    invisible. If you don’t use LVM, RAID or any encrypted devices, you can mask nearly
    all Fedora storage services, such as sudo systemctl mask lvm2-monitor.service
    and sudo systemctl mask mdmonitor.service.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_127_1.png)


    > You can also manage Systemd services with the graphical Systemadm tool.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'accept any value between 0 and 100. Set a lower value if you want to avoid
    swapping out processes. If you set a value of 0 the kernel will avoid swapping
    process out of physical memory and onto the swap partition for as long as possible.


    Using the command sudo sysctl vm.swappiness=10 you can temporarily change the
    swappiness value to 10. This change will be lost when you restart the computer.
    If you notice a spring in the step of your distro, you can preserve the value
    by editing the /etc/sysctl.conf file in a text editor. Look for the vm.swappiness
    parameter in the file and change its value. If it doesn’t exist, you can add it
    at the end of the file, like so: vm.swappiness=10


    # Create additional RAM


    If your problem is a lack of RAM, this hack is designed for machines that have
    fairly decent processors that don’t have much system memory, such as netbooks
    and virtual machines. On such computers you can use the zRAM kernel module to
    create a device in the RAM and compresses it. Thanks to this compression factor
    you effectively increase your RAM.


    Do note that when you use zRAM, you are taxing your processor since it will have
    to compress and decompress all the time. That said, this turns out to be more
    efficient and quicker than swapping to a hard drive. Also note: the zRAM module
    is finally considered stable as of Kernel 3.14.


    On Ubuntu, you can install the module with sudo apt-get install zram-config and
    then reboot your computer. The package installs a script to run it as a service
    and doesn’t require any configuration. Use the cat /proc/swaps command to checks
    if its online. If zRAM’s working perfectly, the command should list one or more
    /dev/zram partitions.


    In case your processor is unable to cope with the added load and your computer’s
    usability has taken a hit, you can disable and remove the zRAM module using the
    following: sudo apt-get purge zram-config


    If you use Fedora, you can use the scripts from the FedoraZram GitHub project
    (http://bit.ly/FedoraZram) to enable zRAM. Download and extract the project files
    and change into the extracted directory. You’ll then have to install the Fedora
    tools to setup your build environment with: sudo yum install @development-tools
    fedora-package


    # Preload frequently-used apps


    Most users have a select bunch of applications that they use frequently. Preload
    is an adaptive readahead daemon which runs in the background and analyses and
    monitors the apps that you use. Based on this on-going analysis, Preload predicts
    what applications you might run next and fetches all the binaries and the relevant
    dependencies into memory beforehand. This means that when you launch the application,
    it starts almost instantaneously since it’s already in the memory.


    For example, if you always open Firefox and LibreOffice Writer soon after booting
    into the distro, Preload will automatically load them both into memory when your
    computer boots up. When you log in and launch the apps, you’ll be amazed by quickly
    they launch. While it might sound great, Preload isn’t for everyone. It works
    well for someone who opens several different apps, but isn’t really useful to
    users who load apps only occasionally. In such a case, Preload will unnecessarily
    consume RAM.


    Some distros include the Preload daemon by default, and almost every distro has
    it in its official repositories. On Ubuntu you can install it with sudo apt-get
    install preload, while on Fedora you can get it with sudo yum install preload.


    You can safely use Preload with its default settings. However, if you need to
    adjust it, you can edit the daemon’s configuration file (/etc/preload.conf) in
    a text editor.


    # Speed up the filesystem


    Like everything else inside your Linux distro, the filesystem also ships with
    tweakable settings. By default, the distro developers tune out performance for
    safety, and while the default settings might work for most users, specialised
    users might need to tweak their settings for performance.


    The most popular filesystem that ships with virtually every desktop distro is
    the ext4 filesystem. It’s default settings should work for most workloads but
    if your benchmark results point to the filesystem being the bottleneck, there
    are several ways you can tune it.


    > “If your system has enough RAM, you should minimise the use of swap space.”


    The first thing you should do is turn off the atime parameter. When the parameter
    is active, every time a file is accessed the filesystem makes a note of the time.
    To prevent this behaviour entirely, open the /etc/fstab file and enter the ‘noatime’
    option along with the existing options for all ext4 partitions.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_128_0.png)


    If you use the distro for conducting heavy-duty read/write operations, use the
    e4defrag tool to make sure the filesystem isn’t fragmented.'
