    After you’ve installed it, you’ll notice performance improvements in everyday
    desktop tasks, as well as while playing games and producing multimedia.


    To install it, use your distro’s package manager to first download the kernel
    source for the version the patch applies to, along with all the tools for building
    your kernel. Then download the patch from Koliva’s website (http://bit.ly/ConKolivas)
