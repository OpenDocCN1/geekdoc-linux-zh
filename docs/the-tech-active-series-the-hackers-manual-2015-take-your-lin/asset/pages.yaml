  md: '# Skills: Networking, interoperability, data management


    # Hack #2: File-sharing Samba server


    The ability to share and access data on your Raspberry Pi from other machines
    is very useful indeed. For example, if you are using it as an always-on download
    box, you’d want to move the downloaded data off the Pi as well. Now that data
    could either be on the SD card or on an attached USB disk. With the Samba software
    – which is an implementation of the SMB/CIFS networking protocol – you can use
    your Raspberry Pi as Network Attached Storage (NAS) device and easily access the
    USB drive attached to the Pi from computers on your network.


    The sudo apt-get install samba samba-common-bin command will fetch the required
    software. Now, attach the USB disk to the Pi which will be automatically mounted
    under the /media folder. Let’s assume the USB drive is mounted to /media/usb.
    You now need to configure Samba so the drive can be shared on the network. To
    do this, you first need to add a Samba user called pi. Enter the sudo smbpasswd
    -a pi command and type in a password when prompted.


    Next, open Samba’s configuration file (/etc/samba/smb.conf) in a text editor.
    If you wish to access the Pi from a Windows machine, locate the workgroup = WORKGROUP
    line near the top of the smb.conf file and change it to the name of your Windows
    workgroup. Further down the file, locate the # security = user line and remove
    the # to uncomment the line and turn security on.


    Lastly, scroll down to the end of the file and add the following lines:


    ```

    [USB]

    path = /media/usb

    comment = USB NAS Drive

    valid users = pi

    writable = yes

    browseable = yes

    create mask = 0777

    public = yes

    ```


    Save the file and then restart Samba with sudo /etc/init.d/samba restart.


    That’s it. You’ll now be able to access the USB drive attached to the Pi from
    any other computer on the network.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_39_0.png)


    Remmina has a very usable interface and scrolls automatically when the mouse moves
    over the screen edge.


    # Hack #3: Raspberry Pi as a thin client


    A thin client is a computer that depends on other powerful computers to do the
    heavy lifting while it presents the results. Thanks to its power efficient and
    noiseless design, the Raspberry Pi is a natural thin client. A thin client relies
    on remote desktop protocols to communicate with the powerful remote desktop.


    For this hack, you’ll need a powerful computer that’ll act as the remote server
    and the Raspberry Pi which will be the thin client. Our desktop server is running
    Ubuntu which comes pre-installed with the Vino remote desktop server that


    # Overclock the Pi


    While the Pi’s 700MHz processor is good enough to set up these hacks, after a
    while you’d wish you could squeeze more juice out of it. The good news is that
    you can! The Pi’s BCM2835 processor can be run above its default speed…


    However, remember that such performance comes at a price – the processor will
    draw more power, run hotter than before, and may not last as long as a regular
    Pi running at its default speed. Also, while it’s possible to alter the Pi’s performance
    manually, the safest way is to use the preconfigured overclock settings in the
    raspi-config tool which also doesn’t void warranty.


    The settings in the raspi-configtool are known to be safe for use with most Pis.
    To overclock your device, launch raspi-config and scroll down to the Overclock
    option and confirm that you wish to continue. You’ll now be shown a list of pre-set
    overclock speeds and you can select any one. When you have made your selection,
    the menu will reboot the Raspberry Pi at its new speed.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_39_1.png)


    If the Pi fails to boot with the overclocked setting, hold Shift while booting,
    which loads the Pi at its stock speed.'
