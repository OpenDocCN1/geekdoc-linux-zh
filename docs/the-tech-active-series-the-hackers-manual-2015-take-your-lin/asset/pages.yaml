  md: 'letter or two and press tab again. It is actually a lot easier to use than
    describe – just try it.


    # Wild, wild cards


    There are times you want to include more than one file in a command, but don’t
    want to type them all out. The Linux shell has a couple of ‘wildcard’ operators
    to help with this. The most used one is the star, which is used as a replacement
    for any string of characters. So * on its own will match every file in the current
    directory (that this is different from MS-DOS shells where * does not match ,
    and you need to use *.* to match any file with an extension). You can also use
    * to match one part of a file name. *.txt matches all files that end with .txt
    and a*.txt only matches those that also start with a. This matching is performed
    by the shell. It expands the matches to a list of files before passing them to
    the command, which never sees the wildcard or even knows that you used one. This
    can be an important distinction, especially if you want to pass a * to the program
    you’re running. For example, if you’re using scp to copy files from a remote computer
    and run: scp user@othercomputer/Documents/*.txt Documents/ you may expect it to
    copy all .txt files from the other computer’s Documents directory to the same
    one here, but it won’t. The shell expands the *.txt to match all .txt files on
    the local system, so you only copy the files you already have. In such an instance,
    you need to tell the shell not to expand the * by preceding it by a backslash,
    known as escaping it: scp user@othercomputer/Documents/\*.txt Documents/ Now it
    passes Documents/*.txt unchanged to the remote computer and lets its shell handle
    the expansion.


    There’s a second wildcard character, too. While * matches any number of characters,
    including none, ? matches exactly one. So ab?.txt matches abc.txt and ab1.txt
    but not ab.txt or abcd.txt, whereas ab?.txt would match all of them.


    # Bring on the substitute


    There is a powerful feature in shells called command substitution. This allows
    you to embed the output from one command in another. As a simple example, there
    is a command called foo on your system and let’s say you want to know what type
    of program it is: compiled, Python or even a shell script. The which command gives
    you the path to a program, and file reports the type of a file. You could use:
    which foo to get /usr/local/bin/foo and then file /usr/local/bin/foo to get the
    file type, but even with copy and paste, this is a lot of work and easy to mistype.
    Alternatively, you could do: file $(which foo) /usr/local/bin/foo: a /usr/bin/perl
    script, ASCII text What happens is that the shell runs whatever is inside $(...)
    and substitutes the output from that into the command line before running it.
    You can also use backticks for this: file `which foo` This is quicker to type
    but less readable, especially when posted to a forum where the reader’s font can
    make ‘ and ` look similar. With the first format there is no such confusion.


    One of the great advantages of the shell is that it’s simple to repeat commands,
    no matter how complex, with a couple of keypresses. At its simplest, you can press
    the Up key to show previous commands, then press Enter to run your chosen one
    again. You can also edit the command before running it, if you like. That’s fine
    if you want to use one of the last few commands you ran, but most shells keep
    a history of the last 500 or so commands that you an access again.


    # Please repeat that


    To avoid wearing out your keyboard’s Up arrow key (and your eyes), press Ctrl-R
    and then type in part of the command. The terminal will show you the most recent
    command that matches what you are typing, updating with each keypress. If you
    have run several very similar commands, you don’t need to keep typing – just type
    a few characters and press Ctrl-R again to see the previous match. Keep going
    until you find the one you want. (Don’t be alarmed – this is one of those things
    that takes far longer to describe than to actually do.) You can edit the command
    before running it. The search term that you type in doesn’t have to be the command
    itself – any part of the command line will match, so you could start with the
    file name.


    You can also access commands within the history directly. The ! character tells
    the shell that you are referring to its history. !! is a shortcut for the previous
    command while !-n means ‘execute the command run n commands ago’ (so !! is the
    same as !-1). hxyz runs the last command starting with xyz, and !?xyz does the
    same for the last command containing xyz (much the same as Ctrl-R does).


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_144_0.png)


    > As the name suggests, tab completion lets you use the Tab key to complete the
    word you’re typing, helping save time and avoid mistakes.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_144_1.png)


    > The history command shows recently executed commands, use ! and Ctrl-R to find
    and run again the commands you used before.'
