- pgno: 108
  md: 'them in the /etc/hosts file. This file contains a list of IP addresses and
    aliases that they’re also known by, so we can add new entries for our two machines:


    ```

    192.168.1.2    bxf-network-1

    192.168.1.3    bxf-network-2

    ```


    If you add these to the /etc/hosts file on both machines, you should be able to
    ping bxf-network-1 or bxf-network-2 and find you’re redirected to the correct
    machine, which is much better.


    # Building a router


    So far, we haven’t had to worry about setting the gateway on either of our machines
    because we’ve relied on the DHCP from VirtualBox’s default NAT network to provide
    this, along with DNS, so that our systems can connect to the wider internet. To
    demonstrate some more networking features, we’re going to disable the NAT connection
    on the second VM and configure the first as a router to provide internet access.


    The first thing to do is run ifdown eth0 to shut down the NAT interface on the
    second VM. Now that the interface is configured, this command, along with its
    counterpart ifup, can be used to control whether an interface is active or not.


    With this change made, you can now try to ping Google from this machine, and you
    should find it no longer works. Before you can make it work again, however, you
    need to make some changes to the first VM’s configuration.


    First, you have to tell it that it’s allowed to forward packets from one network
    interface to another – the most important – and really only – thing a router is
    used for. Linux is quite capable of doing this, but by default the feature is
    turned off. To turn it back on, edit the /etc/sysctl.conf file, which controls
    various aspects of the kernel’s operation, setting net.ipv4.ip_forward = 1. Then,
    run sysctl -p /etc/sysctl.conf to load the new configuration.


    Once that’s done, you’ll need to configure your own NAT, or network masquerade
    in Linux speak, with IPTables – the firewall that’s built in to the kernel.


    IPTables scares lots of people, but it’s really quite simple – it’s just a set
    of rules that the kernel looks at when processing a packet. If a packet matches
    any of these rules, the kernel applies the action specified in that rule to that
    packet. Actions can include things such as dropping or accepting a packet, or
    manipulating a packet to change its origin or destination. In our case, when a
    packet arrives at the first VM from the second, on the eth1 interface, we want
    the firewall to apply the masquerade action to that packet – that is, we want
    it to forward it to the outside world, on the eth0 interface, pretending that
    the packet came from itself, and not the second VM:


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE

    ```


    Let’s go ahead and break this down:

    • -t nat specifies which set of rules IPTables should look at.

    • -A POSTROUTING specifies which subset of rules should be inspected, which is
    otherwise known as a chain. The chain specifies at which point in the routing
    process the rule should be applied.

    • -o eth1 specifies that this rule should be applied to any packets that would
    be travelling out of the eth1 interface.

    • -j MASQUERADE says ‘jump’ to the MASQUERADE action when any packet matches this
    rule.


    With that rule in place, you should now be able to go to the second VM, set the
    default gateway by adding GATEWAY = 192.168.1.2 to the /etc/sysconfig/network
    file (which stores generic network configuration for all interfaces), set a popular
    external name server in /etc/resolv.conf by adding nameserver 8.8.8.8 (the IP
    address of Google’s name server), and find yourself with a fully working internet
    connection, despite not having any direct connection.


    If you want to know more about IPTables, you should take the time to read some
    of the how-tos on the Netfilter site: http://netfilter.org/documentation


    That’s all we’ve got space for. But don’t despair – you’ve learned a lot about
    networking. With a bit of patience, you should now be able to follow other guides
    and come up with far more complex configurations to meet your needs.


    > IPTables can look complicated, especially when there are lots of rules involved,
    but in simple cases, adding just a few rules is very easy.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_108_0.png)


    # Debian-based distributions


    We’ve focused on the Red Hat approach to configuration, with CentOS using the
    same model. Of course, Red Hat-based distributions aren’t the only popular ones
    for use on servers – in fact, many people prefer to use Debian, or its younger,
    popular variant, Ubuntu.


    Debian-based distributions, however, take a different approach. All the tools
    that we’ve introduced you to, such as the ip suite of commands, ping and so on
    still work. What’s more, files such as /etc/resolv.conf and /etc/hosts are both
    still in the same place.


    The major difference is in the interface configuration files. Rather than splitting
    configuration across separate files, such as Red Hat’s ifcfg-eth0 and ifcfg-eth1
    files, Debian-based distributions use the /etc/network/interfaces file, putting
    everything in one spot.


    ```

    auto eth0

    iface eth0 inet static

    address 192.168.1.2

    netmask 255.255.255.0

    ```


    The first line, auto eth0, says that the eth0 interface should be brought up when
    ifup -a is run, or when the system boots.


    The stanza below this, beginning with iface, provides details about that interface’s
    configuration. We first specify the name of the interface being configured, and
    then specify the connection protocol. While there are a few options available,
    inet will be the most common, referring to IP networking.


    The word static is a method, and other options include dhcp and bootp. Methods
    can take further options, and these are given in the rest of the stanza as indented
    lines below the header. This example is very simple, specifying an IP address
    and netmask for this interface.


    For more information, and details of what options are available, see the man page
    for /etc/network/interfaces.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Deluge: Set up a


    Linux Format shows you how to turn an old computer, or even your beloved Raspberry
    Pi, into an always-on torrent box using Deluge.


    If you’re like us, you’re always on the lookout for projects to recycle old unused
    computers. One of the best uses for such a machine that lacks the resources to
    power a modern desktop is that of an always-on headless torrent box. With a torrent
    box you can add, manage and share torrents from any other system on the network.
    You can tuck away the headless torrent box in the corner and let it nibble away
    at your downloads. Also when it comes to downloading torrents, having an always-on
    machine helps you maintain a healthy ratio on your tracker.


    To begin with you will need to equip the torrent box with a monitor and a keyboard.
    But once it’s all setup you can unplug the monitor and the input devices. As long
    as it’s hooked on to the local network, either via Ethernet or better still wirelessly,
    you can feed more torrents and access the downloaded data remotely.


    First, you’ll need to wipe the hard disk on the torrent box and install a fresh
    copy of your chosen server operating system, which, in our case, is Ubuntu Server.
    This distribution has modest system requirements since it doesn’t install a graphical
    desktop.


    One thing you need to make sure is that the computer you use has plenty of storage
    space to accommodate all the downloaded data. For maximum compatibility with other
    systems and devices around the network, it’s best to format the storage areas
    with the NTFS file system. If you plan to share the same disk with the operating
    system as well, it’s best to keep the OS files on a separate partition.


    There are numerous torrent clients available for Linux. We’ll be using the Deluge
    BitTorrent client for this little project, which can run as a daemon on our headless
    server and accept connections from other Deluge clients. The Deluge client is
    cross platform, so you can connect to the torrent box from Linux, Windows and
    Mac OS X.


    Deluge offers multiple ways of accessing it remotely. You can access basic functions
    via a browser-based user interface. Setting this up doesn’t require much work,
    but exposes only some of Deluge’s features. To exploit it to the hilt you’ll need
    to setup the Deluge daemon to accept connections from other desktop Deluge installations.


    # Setting up Deluge


    Let’s begin by first setting up Deluge’s WebUI which doesn’t take much effort.
    Pull the required packages with:


    sudo apt-get install deluged python-mako deluge-web


    The command will automatically start the Deluge daemon, but you’ll have to start
    the web interface by entering deluge-web & in the terminal.


    By default the Deluge web client runs on port 8112. Fire up a browser and point
    it to the IP address of the server, such as 192.168.3.101:8112. The Deluge web
    interface will prompt you for a password. The default password is deluge. As soon
    as


    # Power a torrent server with a Raspberry Pi


    You can use a Raspberry Pi to power the torrent box. The commands to install the
    Deluge daemon and the WebUI aren’t any different from the tutorial. Of course,
    a Raspberry Pi doesn’t have a hard disk, so you’ll have to use an external USB
    drive along with the Samba server as explained in the walkthrough (see p113).


    However, the Raspberry Pi does require one additional step. You’ll need to do
    some CLI magic to make sure the Deluge daemon and the WebUI start automatically
    when the Pi boots up. To do this, copy-paste the two configuration scripts that
    the Deluge developers have provided for Ubuntu (http://bit.ly/1nO2w5). Make each
    of them executable and add them to the start up with


    sudo chmod 755 /etc/default/deluge-daemon

    and

    sudo update-rc.d deluge-daemon defaults.


    Lastly, update the init file to include them: sudo chmod 755 /etc/init.d/deluge-daemon
    and sudo update-rc.d deluge-daemon defaults.


    Add a few scripts and put your Raspberry Pi to use as a dedicated torrent server.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_109_0.png)'
  merge: -1
  img_proc: true
