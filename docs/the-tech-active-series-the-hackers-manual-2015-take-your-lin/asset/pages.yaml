  md: 'been created, proceed to create a user profile for Jasper to get to know you.
    Change to the ~/jasper/ client directory and run the profile population script
    with python populate.py. The script will ask for information such as your name,
    contact details, etc. Jasper uses this information to communicate with you and
    respond to your queries more accurately. Also remember that Jasper will ask you
    for the password for your email account and then store it as plain unencrypted
    text. The details are stored in the profile.yml file. Follow the documentation
    on the project’s website to integrate other services such as Facebook and Spotify.
    Restart the Pi again after you’ve run through the profile creation script.


    When it’s back up, Jasper will greet you with the speech synthesizer you selected
    while creating the profile. You can now start interacting with your new assistant
    by saying ‘Jasper’. If it catches the phrase, Jasper will respond with a beep.
    You can now speak your command such ‘What’s the time?’, or ‘Do I have new email?’.
    Again, if Jasper can hear you it will respond with the answer. Depending on the
    quality of your microphone and the oratory skills of the operator, your initial
    conversations with Jasper might not be very pleasant.


    # Hack #10: Minecraft Pi Edition


    The Minecraft Pi Edition is a cut-down version of the popular Pocket Edition but
    includes enough components to unleash your creativity. You can explore randomly
    generated worlds and use the construction mode to build your own creations.


    The best thing is its API, which can be accessed using Python. You can write Python
    scripts to move the player as well as create and destroy blocks. This allows you
    to create structures in seconds that would take hours to create by hand. The API
    also lets you create interactive objects such as clocks and equips you with teleportation
    powers. You can learn programming while having fun.


    To install the Pi edition, head to pi.minecraft.net and download the compressed
    archive. Then extract it under your home directory with tar zxvf minecraft-pi.tar.gz.
    This will inflate the archive under the ~/minecraft directory. Switch to the directory
    and launch the game with ./minecraft-pi. If you’re not familiar with Minecraft,
    you control movement with the mouse and the WASD keys. Keys 1-8 select items in
    your quickbar, and the space bar makes you jump and double-tap on the space bar
    to toggle the ability to fly.


    You can use the API to connect to a running Minecraft instance. However, before
    you take control with the Python API, it’s a good idea to make a replica of the
    Python API folder from within the ~/minecraft folder to a new location. In the
    terminal, type mkdir ~/mycraft to create a folder and copy the API into it with:

    cp -r ~/minecraft/api/python/mcpi ~/mycraft/minecraft


    We’ll now save our custom scripts inside the ~/mycraft directory. While the game
    is running, press the Alt+Tab keys to switch back to the terminal. Open a new
    tab in the terminal and change into the mycraft directory. Fire up a text editor
    and create a new demo.py script with nano ~/mycraft/demo.py and copy the following
    into it:


    ```

    # Demo script to interact with the Minecraft environment

    import minecraft.minecraft as minecraft

    import minecraft.block as block

    import time

    #Connect to minecraft by creating the minecraft object

    mc = minecraft.Minecraft.create()

    #Post a message to the minecraft chat window

    ```


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_44_0.png)


    ```

    mc.postToChat("Hello, this is a demo of Minecraft API.")

    time.sleep(2)

    playerPos = mc.player.getPos() #Find your player’s position.

    #Change your players position

    mc.player.setPos(playerPos.x, playerPos.y + 50, playerPos.z)

    # wait for 10 seconds while you fall back

    time.sleep(10)

    # - create a STONE block in front of you

    playerPos = mc.player.getTilePos()

    mc.setBlock(playerPos.x+1, playerPos.y+1, playerPos.z,

    block.STONE)

    time.sleep(5)

    # - Now change that block into WOOD

    mc.setBlock(playerPos.x+1, playerPos.y+1, playerPos.z,

    block.WOOD_PLANKS)

    time.sleep(5)

    # - Now let’s create a tower by stacking block

    for top in range(0, 10):

    mc.setBlock(playerPos.x+3, playerPos.y+top, playerPos.z,

    block.STONE)

    time.sleep(5)

    # - Let’s now teleport you to the top of the tower

    mc.player.setPos(playerPos.x+1, playerPos.y+10, playerPos.z)

    Save the script and while Minecraft is running, fire up the script with python
    ~/mycraft/demo.py. If you haven’t made any typos, you’ll see the welcome message
    in the game as defined in the postToChat string. We then find your player’s position
    with getPos and store it in the playerPos variable. The players position is defined
    with the X and Y and Z coordinates that you can see in the top-left corner of
    the screen. We then use setPos to change your position and teleport you into the
    sky. When you fall back down, we use the setBlock parameter to create a stone
    block (block.STONE) in front of you and then after five seconds replace it with
    a wooden block (block.WOOD_PLANKS). We then use a For loop to stack ten stone
    blocks a little further away, and then place you on top of it before ending the
    demo.

    ```


    As an example of what you can do in LXP186, Jonni shows how to build a cannon
    and blow stuff up in Minecraft.


    This is really just a demo of the things that are possible with the Python API.
    Download this neat PDF cheat sheet (http://bit.ly/MinecraftPyCheatSheet) of the
    parameters in the API along with examples and brief descriptions. Using Python
    to control Minecraft is extremely powerful and offers so much flexibility that
    we can’t possibly demonstrate it all here. However, if you’re intrigued, check
    out Jonni’s Minecraft Python tutorials in the Linux Format magazine archive (see
    Coding Academy, p83, LXP185 onwards).'
