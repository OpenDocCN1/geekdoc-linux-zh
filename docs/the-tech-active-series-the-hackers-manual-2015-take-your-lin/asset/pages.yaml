    you use another distro, browse the web and install a VNC server, such as Vino
    or Krb, on top of that distro.


    If you''re using Ubuntu''s Vino you''ll have to make one additional change because
    Vino was changed to require encryption by default, but only supports old encryption
    methods that are not commonly available. Fire up a terminal on the Ubuntu server
    and modify Vino''s security settings with gsettings set org.gnome.Vino require-encryption
    false. Follow the rest of the hack and if you''re able to connect from the Pi,
    return to the Ubuntu Server and make the settings permanent by installing the
    dconf-editor with sudo apt-get install dconf-editor and navigate to org > gnome
    > desktop > remote-access and uncheck the require-encryption setting.


    You now need to prepare the thin client Pi. For this hack, we''ll use the lightweight
    Remmina client which you can install with sudo apt-get install remmina. Once installed
    it will be housed inside the Internet menu. Launch the client and click on the
    new icon to configure a connection to the server.


    In the window that opens, give this connection a name and select VNC from the
    Protocol pull-down menu. You''ll also need to specify the IP address of the server
    in the Server field. You can also boost image quality by selecting a higher colour
    depth and a better quality from the respective pull-down lists. Click Connect
    when you''re done. Remmina will establish a connection to the Ubuntu Server and
    prompt you for the password you had set before allowing you to take control of
    remote desktop from the Pi.


    # Hack #4: Host your OwnCloud


    We''ve mentioned it before (see p22), if you want universal access to your data
    you don''t need to throw money at a service that might store it on servers outside
    your legal jurisdiction. Instead use the money to get a Pi and a large capacity
    powered USB disk and host your own private and protected cloud-sharing service
    with OwnCloud. This will sync and share your data from any device connected to
    the Internet. For added security OwnCloud can also encrypt your files. The software
    can handle files in a variety of formats and has an in-built gallery image viewer
    and a music player. One interesting feature in OwnCloud is file versioning – because
    of this, the server tracks all changes to every file and you can revert to an
    older version with a single click.


    Like with other online cloud storage services, you can sync files on OwnCloud
    either using the web browser or a desktop client on Windows, Mac, and Linux as
    well as mobile clients for Android and iOS devices.


    OwnCloud runs on the Apache web server and also needs a database server. While
    it can work with MySQL, for this hack we''ll use the lightweight SQLite server.
    You can install all required components with sudo apt-get install apache2 php5
    php5-gd php5-sqlite curl libcurl3 php5-curl.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_40_0.png)


    Now head to https://owncloud.org and download the tarball of the latest version.
    Unwrap it with tar xjf owncloud-7.0.2.tar.bz2 and move the resulting folder into
    the root of your Apache server with sudo mv owncloud /var/www/. Then make sure
    the new files have the correct permissions for their new location with sudo chown
    -R www-data:www-data /var/www/owncloud.


    You''ll need to enable certain Apache modules for OwnCloud to work correctly.
    In a terminal enter sudo a2enmod headers rewrite env and then restart Apache with
    sudo service apache2 restart. To configure OwnCloud launch a web browser and navigate
    to the OwnCloud installation instance at localhost/owncloud. Since this is a new
    installation, you''ll be asked to create a user account for the OwnCloud administrator.


    You can now log into your OwnCloud server as the administrator and start uploading
    files you want to share. But before you do that, you''ll have to tweak PHP''s
    configuration if you wish to upload files that are greater than 2MB in size. To
    do that, open the PHP configuration file, php.ini, housed under /etc/php5/apache2
    in a text editor. Look for the upload_max_filesize and post_max_size variables
    and change their value from 2M to something like 500M or 1G.


    > "If you want universal access to your data, get a Pi and a USB disk and host
    your own cloud!"


    You''re now all set to upload data into your OwnCloud server using the web interface.
    You can also interact with the OwnCloud server via the WebDAV protocol. In the
    location area in the Files manager, press Ctrl+L to enable the location area.
    Here you can point to your OwnCloud server, such as dav://localhost/owncloud/remote.php/webdav.
    Once you''ve authenticated, the OwnCloud storage will be mounted and you can interact
    with it just like a regular folder.


    To share uploaded files, go to the Files section in the web interface and hover
    over the file you wish to share. This displays several options, including Share,
    which lets you select who you want to share the item with and whether you want
    to give them permission to edit and delete the files.


    You can also share an item with someone who isn''t on your OwnCloud server. When
    you click on the Share with link checkbox, OwnCloud displays a link to the item
    that you can share with anybody on the Internet. Optionally you can also password-protect
    the link and set an expiration date.


    OwnCloud 7 is a significant step up from earlier versions, with a streamlined
    workflow.'
