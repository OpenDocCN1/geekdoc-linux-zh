    # Patchsets to look out for


    Linus Torvalds has the final say on what goes into the Linux kernel, and over
    the last couple of decades he has proven to be a good project manager (if a bit
    mouthy at times). Consequently, there haven’t been any major forks of the kernel
    based on developer fall-outs, but separate branches of the kernel source code
    do exist. These incorporate experimental features or take the kernel in a different
    direction than intended by Torvalds et al. and the most notable include:


    Note that many patchsets take a while to sync with the latest kernel tree, so
    you might not be able to find a patch to match the exact kernel version that you’re
    building.


    +   - pf-kernel (http://pf.natalenko.name) A bunch of "awesome features not merged
    into mainline" (the official kernel source tree). This includes an alternative
    I/O scheduler, TuxOnIce for improved hibernation functionality, and the -ck patch
    to boost responsiveness.


    +   - TinyLinux (www.tinylab.org/project/tinylinux) This patchset was designed
    with resource-limited embedded systems in mind, and attempts to reduce the disk
    and memory footprint of the kernel.


    +   - RT Patch (https://rt.wiki.kernel.org) The standard Linux kernel isn’t brilliant
    at real-time operations, because on most servers and desktops, it doesn’t matter
    if a certain task takes an extra 0.01s to complete if the system is under load.
    But if you’re an audio professional or using Linux to control machinery, you want
