- pgno: 69
  md: '# Man in the middle


    How black hats attack the individual web browser.


    So far, we’ve looked at attacking a website, but that’s only half the story. We
    can also attack the person browsing the web. XSS (such as the one in the WordPress
    VM) is one such way, but here we’re going to focus on stealing data.


    There are a few ways to go about this. For example, you could put malware on the
    computer and use that to intercept network traffic. However, for this tutorial
    we’re going to use the simplest method – putting our malicious computer between
    the victim and the internet so all their traffic is routed through it. This is
    known as a Man In The Middle (MITM) attack. You could do it with network cables,
    you can even do it virtually with an ARP spoofing attack, but we’re going to do
    it using Wi-Fi.


    As with all the attacks in this article, misusing this one is illegal in most
    countries. This doesn’t just mean misusing the data you get, but stealing data
    in any way.


    To test this out, we used a netbook plugged into an Ethernet to create a wireless
    hotspot – the sort of thing people connect to in a café without thinking about
    it.


    First, you need software to set up an access point. We used hostapd. It’s in some
    distros’ repositories, and is available from http://hostap.epitest.fi/hostapd.
    You’ll also need a DHCP server to make sure the clients that connect to your hotspot
    get IP addresses. We used dhcpd3 (in the dhcpd3-server package in Ubuntu).


    Both of these need configuration files. We’ve included example ones in the HackWeb
    folder at www.linuxformat.com/files/HackMan2015. Once you’ve installed these,
    and got the config files, you can then set up your hotspot with:


    ```

    sudo hostapd -Bdd hostapd1.conf

    sudo dhcpd -4 -cf dhcp2.conf wlan0

    ```


    You may need to add a path to the two .conf files if they’re not in the current
    directory.


    You’ll also need to tell your machine to forward the internet connections to the
    other network connection, otherwise any machines that connect to you won’t be
    able to access the internet.


    ```

    sudo bash

    echo "1" > /proc/sys/net/ipv4/ip_forward

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    Perhaps the most surprising thing about the internet is that the vast majority
    of information isn’t encrypted. It’s just sent as plain text that any MITM can
    read without the trouble of trying to break encryption.


    Wireshark is a great tool (see p102) for viewing the data routed through your
    malicious computer at a packet level, but most of the time we don’t need to drill
    down to that level. Instead, we can use justniffer to recreate all the web traffic
    that goes through our


    > “The vast majority of information on the internet isn’t encrypted”


    malicious hotspot. This tool isn’t generally included in distros’ repositories.
    To install it on Ubuntu, you’ll need to add a PPA:


    ```

    sudo add-apt-repository ppa:oreste-nottelli/ppa

    sudo apt-get update

    sudo apt-get install justniffer

    ```


    On other distributions, you’ll have to build it yourself. Details can be found
    at http://justniffer.sourceforge.net/#!/install.


    There’s a range of options that enable you to do all sorts of network monitoring.
    We’re going to use its ability to rebuild the web pages it sees. First, create
    a data directory. In this


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_69_0.png)


    Sslstrip saves a copy of all the unencrypted traffic. A simple grep can pull out
    any credentials (no, they’re not real accounts).'
