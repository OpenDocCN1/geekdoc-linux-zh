- pgno: 71
  md: '# DDOS


    Overwhelming servers with information.


    DDoS (denial of Service (DDOS)) is perhaps the most highly publicised style of
    attack in recent years. Anonymous, and other high profile hacktivist collectives,
    have used them to good effect against governments, financial institutions and
    any other organisations that have irked them. It’s been publicised less, but DDOS
    has also become a weapon used by criminal gangs. But before we talk about why,
    let’s review what DDOS attacks are and how they work.


    Basically, a DDOS attack is one that stops a server being able to perform its
    normal function, and thereby denying its service to the users. Typically, this
    is a web server, but it doesn’t have to be. A DDOS attack does this not by compromising
    the computer, or gaining access, but by overloading some aspect of it.


    For example, an attacker could saturate a server’s network connection with dummy
    data so that no malicious data can get through, or it could use all of the CPU’s
    cycles, so that it can’t process any other requests.


    Because most modern servers have high-bandwidth connections, powerful CPUs and
    lots of memory, you can’t usually overpower them using just a home broadband connection.
    To get by this, attackers often use multiple computers to attack a target simultaneously.
    In the case of hacktivists, this is generally done by a group of people sympathetic
    to the cause; with criminals, it’s often done by a botnet.


    > > “A DDOS attack stops a server performing its normal function”


    There’s a lot of tools available to help you run a DDOS test. The favoured tool
    of Anonymous is the High Orbit Ion Cannon, because it’s easy for unskilled users.
    However, we’re going to take a look at hulk. It’s available from http://packetstormsecurity.com/files/112856/HULK-Http-Unbearable-Load-King.html.


    ```

    unzip hulk.zip

    python hulk.py http://<site>


    To test it, you can set up an HTTP server quickly with:

    python -m SimpleHTTPServer

    and then attack it with:

    python hulk.py http://<ip address>:8000

    ```


    We found this took down the site quite effectively. However, possible, with the
    intention of maxing out the server. Doing this uses far less bandwidth than a
    hulk-style brute force attack, but not all web server software is vulnerable.
    To run, you just need to make the file executable, then start it with:


    ```

    chmod +x slowloris.pl

    ./slowloris.pl -dns <site>

    ```


    Again, this took out our little Python server instantly.


    # Protect yourself


    Protecting yourself from a DDOS attack is simply a case of minimising the hit
    you take from each malicious packet. This means stopping as many of them as possible
    as soon as they enter your network. To do this, you need a firewall, and you need
    to know how to configure it to identify and drop the relevant packages.


    Exactly how to do this depends on your firewall, and the rules you need change
    in a constant game of cat and mouse as the attackers change their packets to get
    around firewall rules. However, we will say this: make sure you know how to protect
    yourself before you get attacked. Try out the various DDOS tools on offer, and
    practise blocking them out, because you don’t want to have to learn this after
    your site’s already gone down. Running DDOS tools is also an excellent way to
    check how your site will perform under a heavy load.


    Alternatively, you can put your server on a network that can take care of this
    for you. Services such as CloudFlare put your server behind their firewall (virtually,
    you don’t have to reconnect your server). This means that you don’t need to worry
    about the intricacies of firewall configuration.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_71_0.png)


    We were able to run a modified version of hulk on a Nexus 7. It wasn’t as effective
    as it was on a desktop machine, but still brought our web server to its knees.
    As tablets and phones become more powerful, they could become potent attackers
    when attached to open Wi-Fi hotspots.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_71_1.png)


    > > Slow lorises are a type of primate found in south and south-east Asia. If
    you want to know what one looks like, just open the Perl file in a text editor.'
  merge: -1
  img_proc: true
