    preg_match_all($regex, $data, $posts, PREG_SET_ORDER);

    echo $posts[0][1];

    $my_array[] = $posts[0][1];

    }

    ```


    ```

    $regex = ''/span\''class="Ir1g"bold">(.*?)</ul\''class="rsltR\''s/d/Greay\''sim'';

    preg_match_all($regex, $data, $posts, PREG_SET_ORDER);

    foreach ($posts as $post) {

    ```


    For this example, we use a single item that is sold through multiple vendors.
    When multiple items are scraped, you need


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_74_0.png)


    Display the desirable name and price in real time.


    # Quick tip


    File_get_contents() and Curl functions can load web pages and turn the source
    code into a string!'
