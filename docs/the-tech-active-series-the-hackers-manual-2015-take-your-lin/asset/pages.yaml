- pgno: 29
  md: '# Secure Android


    Your smartphone is your PC. We investigate how you can secure it against prying
    eyes...


    You know, if someone was really interested, they could pinpoint your exact location
    right this very moment. They can even probably take your picture reading the magazine
    and record the gasp you just let out. Before you can gather your senses, they
    will have read all your messages, stolen your contacts and seen not just your
    credit score, but your Angry Birds prowess. This isn’t fiction. You have in your
    pockets a snooper’s best friend. You take it everywhere: from your office to your
    bedroom, from the dining room to the lavatory. It records almost everything you
    do and can be made to turn against you in a matter of minutes. Believe it or not,
    the modern day smartphone is a private citizen’s worst privacy nightmare.


    Think about what you have in there: email addresses and phone numbers from your
    contacts, calendar appointments, photos, and probably even personal financial
    information. On top of that, the smartphone can continually track your location
    to build a detailed profile of your whereabouts. There are multiple ways these
    devices can send out data and information about their users, which makes them
    particularly troublesome not only for those who want to remain anonymous, but
    also for the average Joe. In fact, even if you never use the smartphone to make
    an actual call, you are already broadcasting information just by the mere act
    of using the device.


    > “97% of tested apps inappropriately accessed private information.”


    In a recent study conducted by HP, the company discovered that 97% of the tested
    apps inappropriately accessed private information sources within a device and
    another 86% lacked the means to protect themselves from common exploits. The good
    news is that these smartphones allow you to alter many privacy-related settings
    with a tap or two. Let’s look at the various ways in which you leak private information
    about yourself via your smartphone – and how you can minimise such broadcasts.
    We’ll also look at tools that allow you to take charge of your privacy and help
    you communicate without compromising the actual exchange of information.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# You are being watched


    Prevent apps and services from keeping tabs on you.


    Many tasks that were once performed exclusively on PCs have now branched out to
    phones. They can double up as media players, recorders, gaming devices, GPS navigation
    devices and more. To enjoy all these conveniences you need apps. Unfortunately,
    apps are the weakest link between your private data and the world. Many access
    your personal data to ''enhance their experience.'' But you must trust that apps
    will only use this data in a desirable way. Unfortunately, not every app clearly
    states how they use your it and you have no way of knowing if you''re safe.


    Then there are the free web services. Web companies like Google, Twitter, Facebook
    and others provide you with a free service in return for information about you.
    This information is then used to target ads. Some consider this fair trade but
    privacy campaigners are becoming increasingly concerned.


    A critical component of your Android smartphone is the permissions system. When
    you install an app, it notifies you of what it would like to gain access to. You
    can then install the app, or not. Unfortunately, this system puts a lot of responsibility
    on the users to know whether these access requests are appropriate. According
    to research reports (source: http://bit.ly/1bRbsV) many apps request excessive
    permissions.


    There are multiple ways of visualising app permissions. BitDefender''s free Clueless
    app helps you identify what an app is doing, and what it should be doing. Once
    installed Clueless will scan your apps and categorise them as High Risk, Moderate
    Risk, and Low Risk. You can then browse each list and click on an app to find
    out the feature it can access. You should uninstall any High Risk apps as they
    might be pinching your passwords or reading emails.


    Then there''s Malwarebytes'' Anti-Malware mobile app which also includes a Privacy
    Manager. It scans apps and divides them into categories based on the phone feature
    they have access to, such as Access Calendar and Access Storage. The app will
    come in handy when, for example, you wish to view all the apps that can read personal
    information such as your contact list and your web history.


    > “Sharing images reveals a lot of information thanks to the EXIF data attached…”


    is that once you disable a particular feature, say, access to contacts, XPrivacy
    will shield the real data and instead feed a list of bogus contacts to any app
    that requests them.


    In addition to preventing the apps from leaking info, you should also minimise
    the personal data you put out there, even when sharing something as innocuous
    as images. John McAfee, who was evading authorities, was ousted in Guatemala thanks
    to a photo.


    Sharing images taken from your smartphone reveal a lot of information about you
    thanks to the EXIF data attached to them, so if you take an image with a GPS-enabled
    camera or a smartphone, it can reveal your location, the time it was taken as
    well as the unique ID of the device.


    To strip EXIF information from pictures before sharing them you can use the Instant
    EXIF Remover app. The app doesn''t have an interface. Once installed it''ll be
    available as an option in the ''Share'' action. When selected, the app will intercept
    any images you wish to share and delete all EXIF data, before passing them on
    to the email client or any other sharing app. Also, before you upload files to
    a cloud sharing service like Dropbox or Google Drive, it''s a good idea to encrypt
    them. You can do this easily on a Linux box with EncFS.


    # Control permissions


    Once you''ve identified a privacy-intruding app you can remove it. Google recently
    let slip a privacy functionality in Android 4.3 that users could unlock with the
    Aps Ops Launcher tool. With this feature you could selectively turn off privacy-related
    permissions. For example, you could install the Shazam music recognition app but
    turn off its ability to track your location. However, Google removed the feature
    in the following update, much to the chagrin of the EFF. When asked, Google said
    the feature was experimental and was released by accident.


    If you have a rooted Android device you can still get the feature as a module
    for the Xposed framework. Users of rooted devices can also use the XPrivacy module
    for Xposed. With XPrivacy you can control specific permissions for all installed
    apps. The best bit


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_30_0.png)


    EncFS is available in the repositories of popular distros like Fedora and Ubuntu.
    The tool requires you to create two directories – one that houses your unencrypted
    content and the other with the encrypted version. The way the tool works is that
    you interact with the files in the unencrypted folders and they are encrypted
    on-the-fly in the encrypted folder. To use EncFS with a cloud sharing service
    like Dropbox, just make sure you keep the encrypted folder inside the Dropbox
    folder. This will automatically sync any changes to the encrypted folder to Dropbox!
    After installing EncFS, create the two folders with EncFS ~/ Dropbox/encrypted
    ~/Private. The tool will ask you questions and create the folders. Any files in
    the Private directory will now be synced.


    # Three degrees of separation


    You don''t need to be talking to a terror suspect to get the NSA interested in
    your personal communications. The agency is allowed to travel ''three hops'' from
    its target. So they can monitor the communication of people who talk to people
    who talk to people who talk to you. This three degrees of separation allows NSA
    to virtually monitor everyone.


    Mastering the learning curve of XPrivacy will go a long way in protecting your
    privacy.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_30_1.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Communicate securely


    Use your phone in Incognito mode.


    The key to securing your phone against any sort of surveillance is end-to-end
    encryption. There are an increasing number of apps and services that let you encrypt
    the data on your device before it is sent off and then decrypted at the recipient’s
    device. Encryption doesn’t prevent the caching of data but safeguards it against
    any kind of snooping by making it unintelligible to anyone without the correct
    decryption keys.


    Begin your lockdown efforts by obfuscating your web browsing activities. Just
    like any desktop web browser, you can install a variety of add-ons to your Android
    browser.


    Some of the popular Privacy-inducing add-ons are the Proxy-on add-on which you
    can use to customise the user-agent on the browser and hide the fact that you
    are on a mobile device.


    Then there’s the self-destructing cookies add-on which will automatically delete
    all cookies when you close a site. For more comprehensive control you can use
    the CleanQuit add-on which removes all information about the previous session
    including the browsing & download history and site preferences.


    If you want anonymity, you should switch to the Orweb browser (http://bit.ly/1eiYkJ)
    which is preconfigured to help you browse the web anonymously. It’s also loaded
    with plugins to disguise your device, gives you control over cookies, prevents
    loading of Flash content and keeps no browsing history. It requires the Orbot
    plugin, and Orbot is Tor for Android. (See p34 for more details about the Tor
    Project). On initial launch, Orbot runs through a quick setup wizard. If you have
    a rooted phone, you can turn on transparent proxying, which allows all network
    apps to automatically run through the Tor network.


    To sign and encrypt email messages on your mobile device you need the Android
    Privacy Guard (APG) app, which is an open source implementation of OpenPGP. You’ll
    also need the K-9 email app, which integrates seamlessly with APG.


    To use these apps, first launch K-9 and configure it to connect to your email
    server. Then launch APG and tap the menu button, which brings up the option to
    manage private keys and public keys. You can export these keys from the desktop
    and import them into APG. Once the keys are imported, K-9 will display the option
    to sign and encrypt messages when you write a new email. Conversely it will let
    you decrypt emails when you receive a new encrypted message.


    Similarly, if you wish to encrypt instant messages, you’ll need the open source
    ChatSecure app. The app uses the OTR protocol to enable secure chat sessions over
    XMPP accounts. Using the app you can have secure chats with your friends over
    popular networks including Google Talk and Facebook on any OTR compatible client
    including Pidgin, Adium, and Jitsi.


    # Old School usage


    Another famed form of text-based communication is SMS. Although on a steady decline
    due to the falling prices of mobile internet many people still use texting as
    their primary means of communication.


    You can encrypt SMS messages with the open source TextSecure app, which can encrypt
    SMS stored locally on the phone. However, to send encrypted messages over the
    air, the recipient must also have TextSecure or they’ll receive unencrypted messages.
    When you run the app first time, it gives you the option to create encrypted versions
    of all local messages. Although it doesn’t touch the existing unencrypted SMS,
    it’s advisable to delete them after creating encrypted versions.


    Before you can send messages you’ll have to create a secure connection with the
    recipient’s device by exchanging keys. TextSecure will send a message to the recipient,
    whose TextSecure app will automatically respond with a message to establish a
    secure connection. From then on you send and receive encrypted messages. Surprisingly,
    a lot of us still use the smartphone to make actual calls and there are apps and
    services that will establish secure channels to thwart any attempts to intercept
    your conversation.


    > “Surprisingly, a lot of us still use the smartphone to make actual calls.”


    You can use the free RedPhone app, which makes encrypted calls over the internet.


    There’s also SilentPhone, which is developed by Phil Zimmerman who gave us OpenPGP
    for securing email and ZRTP protocol for securing VoIP calls. The SilentPhone
    app works on multiple mobile platforms but comes with a $10 (about £6) subscription
    fee.


    Both these solutions work as advertised and create encrypted calls. However, their
    major limitation is that they require the person at the other end of the line
    to be using the same app. The Ostel project is working on solving this problem.
    They’ve created a standard known as Open Source Telephony Network (OSTN) that
    uses free and open source protocols to create end-to-end encrypted voice communication
    channels.


    The best thing about this is that you can connect with any user that’s using an
    app that supports the OSTN standard. There’s the CSipSimple app for Android, Acrobits
    for iPhone users, PrivateGSM for BlackBerry users and the cross-platform Jitsi
    desktop app for Linux, Windows and Mac users.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_31_0.png)


    You can use the Jitsi app for making encrypted video calls.


    # Choose volume location


    +   - Local

    +   - Dropbox

    +   - External SD

    +   - Google Drive


    The EncDroid Android app lets you create EncFS encrypted folders and syncs them.'
