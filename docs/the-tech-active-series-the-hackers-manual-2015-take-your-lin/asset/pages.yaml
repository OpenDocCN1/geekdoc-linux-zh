- pgno: 8
  md: 'Protecting your information and your privacy go hand in hand and it all starts
    with limiting the information you give out to web companies. They don’t always
    have your best interest at heart and some are infamous for selling or trading
    personal information.


    The most basic way of being identified is through your IP address. From your IP
    address, a website can determine your rough geographical location, such as your
    city or area. This is a fairly common technique exploited by web advertisements,
    which try to grab your attention by mentioning your location.


    IP addresses are dynamic, which makes them unsuitable for tracking a user over
    time. But by combining your IP address with other tracking information, such as
    HTTP referrers and cookies and you can be easily monitored.


    The job of the HTTP referrer header is to load the website you clicked on and
    inform it where you came from. It’s also sent when loading content on a web page.
    So if a web page includes an advertisement, your browser tells the advertiser
    what page you’re viewing. Some unscrupulous marketers embed invisible images in
    emails that take advantage of the HTTP referrer to track you when you open emails.


    Make sure you check Firefox’s Privacy Preferences to block third-party cookies.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_8_0.png)


    It tracks information, such as a user’s posting history, IP address, and web browser
    version, across websites that use Disqus, even if the user is logged out. They
    also put the comments on public profile pages for each user.


    While some online services offer an option to opt-out, many are opt-in only. You
    can opt out of the major tracking networks by visiting the Network Advertising
    Initiative’s Opt-Out page (www.networkadvertising.org/choices).


    This online service will check your system for tracking cookies from participating
    ad networks and enables you to opt-out from them.


    Additionally, all browsers offer options to zap cookies. You can also use the
    browser’s Private Browsing mode to ensure that the cookies are flushed when you
    close the window. This also prevents websites from learning where you’ve previously
    been. The mode is especially handy when using a public computer.


    But there is one nasty little cookie that’s more invasive than a standard cookie.
    The Local Shared object (LSO) or Flash cookie, as it’s commonly known, is particularly
    dangerous because it isn’t stored with the other cookies and is designed to evade
    the commonly used privacy controls.


    To restrict how Flash stores LSOs, visit Flash’s online settings manager (http://bit.ly/1m33E9X)
    and deselect the Allow Third-Party Flash Content To Store Data On Your Computer
    option. Note: If you go down this route of restricting the use of cookies then
    it will impact your web browsing experience, but the trade-off in regards to privacy
    is well worth it.


    # Tough cookie


    Almost every website uses cookies to store information about the visitors and
    how they use the website. These are stored on a user’s computer but the user has
    little control over what information is stored within the cookie.


    Cookies have plenty of legitimate uses, such as for storing settings and preferences
    on a website, eg online email services use cookies to remember your login details.


    However, these cookies also allow the website to track you as you move around
    on their website. This might sound pretty harmless, but major websites such as
    Google aren’t just confined to a single domain. Google, as you may be aware, controls
    the largest advertising network on the internet.


    As you move from website to website, in addition to displaying advertisements,
    the advertising system will also track the websites you visit. The advertising
    system then uses this data to display advertisements that are similar to the sites
    that you’ve visited.


    Google is not alone in doing this, according to a survey by www.digitaltrends.com,
    there at least 125 different companies or company products being used to track
    your online activity through the top 100 sites. Many of these are simple advertising
    networks, but others are particularly nefarious. Take for example the Disqus comment
    widget.


    Did you know?


    The NSA has been collecting a lot of metadata about internet traffic.


    Things like who’s talking to who, when and for how long. Metadata is a lot easier
    to store and analyse, and can be extremely personal to the individual.


    # Switch to SSL


    One of the first steps you should take when navigating the internet badlands is
    to encrypt your network traffic by switching to the Secure Sockets Layer (SSL)
    protocol. SSL uses certificates to create a secure, encrypted link between the
    visitor’s web browser and the web server that hosts the page.


    The encrypted connection ensures that any data that’s transferred from the browser
    to the web server, such as your credit card details, remains private during transmission.
    The certificate is provided by a certifying authority such as VeriSign and Thawte.
    All SSL encrypted websites will have a padlock icon in the browser window and
    you can click on the icon to get more details about the certificate.


    However, there is one subtle danger to be aware of. There are several types of
    SSL certificates and some phishing sites have purchased legitimate certificates
    in order to trick people into believing they are trustworthy.


    Keep an eye out for the Domain Validated certificates. These are pretty cheap
    to procure, but do not provide authentication or validation of the business behind
    the website. Clicking on the padlock icon will not display any information other
    than encryption information. Other secure certificates will supply data about
    the organisation behind the website.


    Every insecure network protocol has an equivalent secure one. For web browsing,
    there’s HTTPS, for transferring files there’s SFTP and SCP, and for remote logins
    there’s SSH.'
