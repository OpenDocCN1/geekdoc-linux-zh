    While the directory indexing is a safe option for extracting performance, changing
    the journaling mode of the filesystem isn''t and may harm your filesystem. The
    ext4 filesystem supports three journaling options. The Journal mode is the slowest
    but extremely safe. Then there''s the Ordered mode which offers the right compromise
    between speed and safety and is used by default by most distros. In this mode,
    all data along with the metadata is first committed to the journal before being
    written to the main filesystem.


    The third option available to you is the Writeback mode which is what you should
    use if you are concerned about performance. In this mode, data is written to the
    main filesystem immediately after its metadata has been recorded in the journal
    which increases throughput. For changing your filesystem''s journaling mode, boot
    into a live environment, and then run:


