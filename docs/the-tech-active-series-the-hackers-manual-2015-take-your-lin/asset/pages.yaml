- pgno: 87
  md: "# OpenHatch community\n\nOpenHatch.org is a Boston-based not-for-profit with\
    \ the admirable and noble goal of lowering the barriers into open source development.\
    \ Its website provides a system for matching volunteer contributors to various\
    \ community and education projects and it runs numerous free workshops imparting\
    \ the skills required to become a bona fide open source contributor. Since 2011\
    \ it has\n\nbeen running outreach events with a particular focus on Python, but\
    \ also covering other software and striving to get more women involved with programming.\
    \ In this article we’ve built on OpenHatch’s Python code for providing simple\
    \ yet powerful interaction with the Twitter social networking platform. The original\
    \ code was developed for a Python workshop in 2012 and we have brought it up to\
    \ date and expanded on it for purposes of this tutorial. In particular we now\
    \ use the argparse module rather than the deprecated optparse. You can check out\
    \ some of the other great Python projects from OpenHatch and other events at the\
    \ official site (http://bit.ly/1fuabf). You could even use your mad programming\
    \ skillz to help out any number of thoroughly worthy causes.\n\nwith it, which\
    \ results in an error. You can test for this in the Python interpreter as follows,\
    \ where woeid is the WOEID of your desired location:\n\n```\nimport twitter_functions\n\
    test = twitter_functions.GetTrendsWoeid(woeid)\n```\n\nIf you don’t get an error\
    \ ending with ‘Sorry, this page does not exist’, then all is well. We use Python’s\
    \ error catching to fallback to the global trends function GetTrendsCurrent()\
    \ when this happens:\n\n```\ntry:\n    trending_topics = api.GetTrendsWoeid(woeid)\n\
    except twitter.TwitterError:\n    trending_topics = api.GetTrendsCurrent()\n```\n\
    \nIt’s prudent (but not necessarily essential), the catchall clause except is\
    \ entirely valid) to specify the exception that you want to catch – if you aren’t\
    \ specific, however, confusion and hairpulling may arise. The common base exceptions\
    \ include IOError, for when file operations go wrong, and ImportError which is\
    \ thrown up when you try and import something that isn’t there:\n\n```\ntry:\n\
    \    import sys, absent_module\nexcept ImportError:\n    print \"the module is\
    \ not there\"\n    sys.exit()\n```\n\nModules will also provide their own exceptions,\
    \ for example if you try and do this tutorial without a network connection you’ll\
    \ get an error from the urllib2 module. So we catch that by wrapping the net-dependant\
    \ functions. We can chain except clauses, so the next bit of the above code is:\n\
    \n```\nexcept twitter.urllib2.URLError:\n    print \"Error: Unable to connect\
    \ to twitter, giving up\"\n    twitter.sys.exit()\n```\n\nThe user Tweets() function\
    \ is pretty straightforward, so we’ll just print the relevant segment here:\n\n\
    ```\ntweets = api.GetUserTimeline(screen_name=username)\nfor tweet in tweets:\n\
    \    util.safe_print(tweet.GetText())\n```\n\n# Unicode fixer\n\nThe function\
    \ trendingTweets() is a little more complicated: we need to first get a list of\
    \ trending topics, and then for each of these grab some tweets. But there’s a\
    \ sting in the tail – sometimes the topics returned will have funky unicode characters\
    \ in them, and these need to be sanitised before we can feed them to our search\
    \ function. Specifically, we need to use the quote function of urllib2 to do proper\
    \ escaping, otherwise it will try and fail to ASCII-ize them.\n\n> “For this tutorial\
    \ we have added the --woeid option to see what’s hot elsewhere.”\n\n```\ntrending_topics\
    \ = api.GetTrendsCurrent()\nfor topic in trending_topics:\n    print \"***\",\
    \ topic.name\n    esc_topic_name = twitter.urllib.quote(topic.name.encode('utf8'))\n\
    \    tweets = api.GetSearch(esc_topic_name)\n    for tweet in tweets[:5]:\n  \
    \      print '@' + tweet.screen_name + ':'\n        util.safe_print(tweet.GetText())\n\
    \    print '\\n'\n```\n\nWe’ve been a bit naughty in assuming that there will\
    \ be at least five tweets, the syntax for limiting the number of tweets GetSearch\
    \ returns seems to be in a state of flux, but since these are trending it’s reasonable\
    \ that there will be plenty. And that completes our first foray into pythonic\
    \ twittering. We have developed the beginnings of a command-line Twitter client,\
    \ we have parsed options, caught exceptions and sanitised strings. If your appetite\
    \ is sufficiently whetted then why not go further? You could add a --friends option\
    \ to just display tweets from your friends, a --post option to post stuff, a --follow\
    \ option, and really anything else you want.\n\nYou might not get exactly the\
    \ same results as the website, but both methods show that people appear to care\
    \ about acorns.\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_87_0.png)"
  merge: -1
