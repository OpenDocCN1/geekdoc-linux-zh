    We have touched on the apps and the repository, but what about the core of the
    device – the ROM containing the kernel? This is largely open source, particularly
    the kernel, which means that other ROMs are available, such as CyanogenMod. (covered
    in Linux Format, LXP177). One of the benefits of a custom ROM is that many phones
    come with modified ROMs, containing the manufacturer’s own idea of how Android
    should look, feel and work. A custom ROM cuts this out, going back to a more default
    (as in the Nexus range) setup, which is often lighter and faster. Some ROMs do
    add their own bits on top, but as you are choosing to run a different ROM, you
    can choose how close to standard it is. One advantage of a custom ROM is that
    they generally give root access (see box opposite) – although we are currently
    running a standard ROM on my Nexus 5, but rooted.


    ```

    nets/hector FreeAndroid/replicant 0% for 1 in *.img

    sudo fastboot flash $basename 51 .img

    step 3

    done

    OKAY [ 0.000s]

    sending ''boot'' (2592 KB)...

    OKAY [ 0.418s]

    writing ''boot''...

    OKAY [ 0.772s]

    finished. total time: 0.772s

