- pgno: 131
  md: '# # Build a custom


    Don’t just stick with your distro defaults – you can compile your own Linux kernel
    for extra performance and features.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_131_0.png)


    Here’s a question: which software on your Linux installation do you use the most?
    You’re probably inclined to say something like Firefox or KDE, but an equally
    valid response would be the kernel. Sure, you don’t use it directly – it chugs
    away in the background, keeping everything ticking over – but without it, you
    wouldn’t be able to do anything. Well, you’d be able to look at your shiny


    hardware and stare at an empty bootloader screen, but that’s not much fun…


    Anyway, while the kernel is the most important component in a Linux installation,
    it’s usually seen as a mysterious black box, performing magic that only the geekiest
    of geeks can understand. Even if you’re an advanced Linux user who keeps track
    of kernel news, you’ve probably never tried compiling a kernel yourself. After
    all, why go to that hassle when your distro already provides one? Well:


    +   - Many stock distro kernels are optimised for a broad set of hardware. By
    compiling your own, you can use optimisations that are very specific for your
    CPU, giving you a speed boost.

    +   - Some features in the kernel source code are marked as experimental and aren’t
    included in distro kernels by default. By compiling your own, you can enable them.

    +   - There are loads of useful kernel patches in the wilds of the internet that
    you can apply to the main source code to add new features.

    +   - And just from a curiosity perspective, compiling and installing a new kernel
    will give you great insight into how Linux works.


    So in this tutorial we’ll show you, step-by-step, how to obtain, configure, build
    and install a new kernel. We’ll also look at applying patches from the internet.
    But please heed this BIG FAT WARNING: installing a new kernel is like performing
    brain surgery on your Linux box. It’s a fascinating topic, but things can go wrong.
    We’re not responsible if you hose your installation! Therefore we strongly recommend
    doing this on Linux installations that you can afford to play around with, or
    inside a virtual machine.


    # ## Setting up


    The first thing you’ll need to do is get hold of the kernel source code. Different
    distros use different versions of the kernel, and most of them add extra patches,
    but in this case we’ll be taking the pure and clean approach – using the source
    code that Linus Torvalds himself has signed off.


    The home of kernel development on the internet is at **www.kernel.org**, and there
    you can download the latest official release. In this tutorial we’ll be using
    version 3.17.1 as provided in the file **linux-3.17.1.tar.xz**; there will probably
    be a newer version by the time you read this, so as you follow the steps, change
    the version numbers where appropriate.


    Now, instead of extracting the source code in your home directory (or a temporary
    location), it’s much better to extract it in **/usr/src** instead. This isn’t
    critically important now, but it will come into play later – certain programs
    need to find kernel headers. If the currently running kernel, and they will often
    look for source code in **/usr/src**. VirtualBox is one


    example of this, because it has its own kernel module, and it needs the kernel
    source header files to build that module during installation.


    So, extract the source code like this (and note that all of the commands in this
    tutorial should be run as root):


    ```

    tar xfv linux-3.17.1.tar.xz -C /usr/src/

    ```


    The extraction process will take a while, because recent versions of the kernel
    source weigh in at almost 600MB. Enter **cd /usr/src/linux-3.17.1** and then ls
    to have a quick look around. We’re not going to explain what all of the different
    directories in the kernel do here, because that’s a topic for a completely different
    tutorial, but you may be tempted to poke your head into a couple of them. Inside
    **mm** you’ll find the memory manager code, for instance, while **arch/x86/kernel/head_32.S**
    is also worthy of note – it’s the assembly start up code for 32-bit PCs. It’s
    where the kernel does its ‘in the beginning’ work, so to speak.'
