    In addition to encryption, SSE can also securely delete files to remove all danger.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_32_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_32_1.png)


    # Switch to a third-party firmware


    Every year Google offers a vanilla Android operating system popularly known as
    AOSP for download. Many developers take this version and work on it to develop
    their own customised version of Android.


    CyanogenMod is one such Android distribution and also one of the most popular,
    with millions of users. One reason for its popularity is that it gives you complete
    control over your device and frees it from any ties to Google, your network or
    the phone’s manufacturer. It’s also worth mentioning that the CyanogenMod team
    is quick to patch security holes and fix bugs that were only fixed by Google in
