- pgno: 59
  md: '# Free Android


    Is Android becoming less open source? We think it''s drifting in that direction
    and investigate what the Linux community can do about it.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_59_0.png)


    We love to trumpet Android as an example of open source succeeding in the commercial
    world, and in a highly cut-throat part of it at that. All the talk of "will this
    be the year of Linux on the desktop?" faded away as a Linux-based operating system,
    albeit not the GNU/Linux we are used to, began to take over the world, one phone
    at a time.


    However, what we think about a lot less is that while Android uses an open source
    kernel, and much else of the operating system is also open source, an increasing
    proportion of it is becoming closed source, as are the network services it depends
    on so much.


    Smartphones and tablets are connected devices – they are severely limited when
    not connected to the internet, and Android phones default to using Google services.
    These services are not open source – the GPL does not apply in the same way to
    services that are provided over the web, because the software is not being distributed,
    only its output. So your open source handset relies on a bunch of servers running
    closed source services. Yes, you can choose to use a different mail provider instead
    of Gmail, but is there an open alternative to Google Maps and Navigation? OpenStreetMap
    is doing well, but has neither the coverage nor polish of Google Maps and Navigation.


    > "Your open source handset relies on servers running closed source services."


    Bye then.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Open and closed


    Open sourcing Android made good sense for Google back in 2007: the Apple iPhone
    had been released and it wanted to avoid the mobile ecosystem becoming dominated
    by one operating system in the way that so nearly happened with the desktop. So
    it released Android as open source, and it grew quickly. Now Android is the dominant
    operating system and Google wants its control back. It cannot do anything about
    the kernel and any other open source components it got from outside, but it has
    been moving its own software to closed source, one ‘update’ at a time.


    The AOSP (Android Open Source Project) still makes available all Android software
    produced under open source licences but, as this is Google’s code, it is free
    to also release it under a different licence – and this is what it has been doing.
    Whenever Google switches one of its apps to a closed source licence, development
    on the AOSP version effectively ceases and none of the new features are added.
    You may have noticed that the last few Android


    OS updates – the various Jelly Bean incarnations and Kit-Kat – have been less
    than overwhelming in terms of the features they add. This is not because Google
    is doing less, but it is doing it differently. It has moved much of the software
    that was included in the base release outside of it, using Google Play Services
    (this is not the same as the Google Play Store). The benefit for Google is that
    the core apps are no longer tied to the Android release, but can be updated at
    any time (you will now find all of them in the Play Store), so users are not left
    in limbo by handset manufacturers and carriers that are unwilling or unable to
    supply OS updates.


    To liken this to the familiar world of desktop GNU/Linux, Android has become more
    of a rolling release, like Debian, and less like the model adopted by other distros
    of a set of packages that get updates for bug fixes only until the new OS version
    is released.


    Making packages easy to install and update through the Play Store also means that
    they can be uninstalled, whereas when things were done the old way, only the updates
    to core Google apps could be uninstalled, reverting to the version bundled with
    the Android release.


    very well: do we necessarily want to leave the comfort of Google’s well tested
    and popular ecosystem? For many users, who just want their phone to work, the
    answer may well be no. You are not a regular user, though, or else you wouldn’t
    be reading a computer magazine, let alone a manual like this. Linux users tend
    to want what is best, not what is easiest, which is part of the reason Linux has
    progressed to where it is.


    > “This is not a total lockdown of Android by Google. Much of it is still open
    source.”


    The next question is, do you want to completely rid your device of all proprietary
    code, or are you happy to reduce your reliance on Google and its services? Both
    are possible, but the former is more difficult. Never the types to shy away from
    the difficult questions, we will address that one first, by letting you know we
    will deal with it later. For the latter choice, the app you want is F-Droid (https://f-droid.org).


    # F-Droid


    The name F-Droid is used to refer to two separate but connected entities. It is
    a repository of applications for Android, like the Play Store’s predecessor the
    Android Market, with an important difference. Every piece of software in there
    is free and open source. Secondly, there is the F-Droid client, used to browse
    the F-Droid catalogue (we can’t call it a market or store when everything in it
    is free). This client is not available in the Play Store, you will need to install
    it directly from the site. In order to do that, you have to allow your device
    to load software from other sources – go into Settings>Security and tick the box
    for ‘Unknown sources’. Note that this can be considered a security risk, in that
    you are able to install anything from anywhere: but it is your phone, your choice
    to make and your right to be able to install what you want – even if some smartphone
    makers see things differently.


    Now go to https://f-droid.org and download the apk package. If you do this using
    the phone’s browser, you can simply open the file to install it. If you downloaded
    it to your computer, transfer it to the phone by USB, a file sharing site or memory
    card


    # Free choices


    This is not a total lockdown of Android by Google. Much of it is still open source,
    it is just the Google software, and the services it uses, that is closed source.
    That means there are, as ever, options. If you buy a Samsung phone – and quite
    a few people have – you will find many of the apps are Samsung’s own. You can
    install the Google ones if you want, but this is not compulsory or even necessary.
    Amazon has taken things a step further with the Kindle Fire, even having its own
    version of the Play Store. Now, Amazon may not be a shining beacon for all that
    is open, but it has shown that running Android without the Google lock-in is possible.
    The question becomes, can we do something similar – use an Android phone or tablet
    without the lock-in of Google’s, or anyone else’s, closed apps?


    Before we can address that question, there is another, more fundamental one –
    do we care? Google’s software works, and


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_60_0.png)


    Before you can install F-Droid, or any other package from outside the Play Store,
    you have to enable ‘Unknown sources’.'
