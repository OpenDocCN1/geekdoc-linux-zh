- pgno: 86
  md: "# Taking a REST\n\nREST is short for Representational State Transfer and refers\
    \ to a set of principles for gathering and sharing data rather than any concrete\
    \ protocol. Twitter implements two major APIs, a RESTful one, which we will use,\
    \ and a streaming one, which we won’t. The streaming API provides low-latency\
    \ access to real-time data, which you can do all sorts of fancy stuff with, but\
    \ the RESTful API provides a simple query and response mechanism which suits our\
    \ purposes just fine.\n\nThere are a couple of ways to authenticate your application\
    \ with Twitter. If you just want to access public data, then there’s an application-only\
    \ method. Otherwise you will need to use OAuth tokens, this may seem slightly\
    \ convoluted for this simple personal-use exercise, but userid/password authentication\
    \ was turned off last year. Proper OAuth2 authentication is a back and forth dance\
    \ with a few variations depending on the context. Ultimately it asks the user\
    \ if an app can use\n\ntheir account, and if the user consents then an access\
    \ token is returned to the app via a callback URL. Only the authenticated application\
    \ can use the token and it can be revoked by the user at any time. The upshot\
    \ is that the application never gets to see the user’s credentials. In our simple\
    \ situation we hardcode the token to our developer account, if you were making\
    \ something distributable you would never share the variable secret, and all the\
    \ access tokens would be requested dynamically.\n\nNow when you run python argtest.py\
    \ you will be given a stern reprimand about “too few arguments”. If you run it\
    \ with the -h option, you will see that correct usage of your program requires\
    \ you to provide a value for grr_arg. We haven’t added any functionality for this\
    \ option yet, but at least if we run our program with an argument, eg python argtest.py\
    \ foo, then we no longer get an error, or indeed any output whatsoever. The args\
    \ namespace we created contains all the arguments that our program expects, so\
    \ we can use grr_arg by adding the following to our file:\n\n```\nprint(\"You\
    \ argued: {}. Huh.\".format(args.grr_arg))\n```\n\n# Using arguments\n\nMore complicated\
    \ arguments can easily be dealt with, for example we could sum an arbitrarily\
    \ long list of integers by modifying the add_argument call like this:\n\n```\n\
    parser.add_argument('integers', metavar='N', type=int, nargs='+', help='some integers')\n\
    ```\n\nBy default, arguments are assumed to be strings, so we use the type option\
    \ to stipulate that integers are provided. The metavar directive refers to how\
    \ your argument is referred to in the usage message, and nargs='+' refers to the\
    \ fact that many integers may be provided. We could make a regular-ordinary program\
    \ for summing two integers with nargs=2, but where would be the fun in that? We\
    \ have to put the arguments provided into the list args.integers, so we can process\
    \ it like so:\n\n```\nprint(\"The answer is {}.\".format(sum(args.integers)))\n\
    ```\n\nOur Twitter project works exclusively with optional arguments. These creatures\
    \ are preceded with dashes, often having a long form, eg --verbosity, and a short\
    \ form, say -v. Our Twitter program has 5 options in total (not counting the complementary\
    \ --help option): --search --trending-topics --user-tweets --trending-tweets and\
    \ --woeid. As it stands --woeid only affects the --trending-topics and --trending-tweets\
    \ options. While the argparse module could easily handle grouping these arguments\
    \ so that an error is issued if you try and use --woeid with another option, it’s\
    \ much easier to not bother and silently ignore the user’s superfluous input.\
    \ Haven’t we all seen enough errors? For example, the search argument which takes\
    \ an additional string argument (the thing you’re searching for) is described\
    \ as follows:\n\n```\nparser.add_argument(\"-s\", \"--search\",\n    type=str,\n\
    \    dest=\"search_term\",\n    nargs=1,\n    help=\"Display tweets containing\
    \ a particular string.\")\n```\n\n![](img/b6e789f7b1bc6629f6c97a3e4beae1de_86_0.png)\n\
    \nOnce we’ve built up all the arguments then we collate them into a namespace\
    \ with:\n\n```\nargs = parser.parse_args()\n```\n\nso that our search term is\
    \ accessible via args.search_term, which we pass to search() in twitter_functions.py.\
    \ This function acquires a list of tweets via:\n\n```\ntweets = api.GetSearch(searchTerm)\n\
    ```\n\nand the following block prints them all out, prefixed by the user id of\
    \ the individual responsible:\n\n```\nfor tweet in tweets:\n    print(\"@\"+tweet.user_screen_name+\"\
    :\")\n    util.safe_print(tweet.GetText())\n    # get search\n```\n\nOur usage\
    \ instructions for all the optional arguments you can use.\n\n# Trends near you\n\
    \nThe original Python Twitter code originated from Boston, and hard-coded the\
    \ Where On Earth ID (WOEID) used by the trendingTopics() function accordingly\
    \ (it’s 2367105). We can forgive the authors’ clinging to their New England roots,\
    \ but for this tutorial we have added the --woeid option to see what’s hot elsewhere.\
    \ This is an optional parameter and only affects the trending topics/tweets functions.\
    \ If you don’t provide it then results are returned based on global trends using\
    \ the GetTrendsCurrent() method of the API, rather than GetTrendsWOEID(). You\
    \ can use the WOEID looker upper at http://zourdoub.com/tools/woeid for this.\n\
    \nFor example, we can see what’s going on in sunny Glasgow by the invocation:\n\
    \n```\npython twitter_api.py --trending-topics --woeid=21125\n```\n\nThis only\
    \ works for a few cities, so the wretched backwater wasteland you call home may\
    \ not have any trends associated"
  merge: -1
