- pgno: 13
  md: '# Reinforce your fort


    Encrypt your hardware and lockdown your workstation.


    # Did you know?


    The NSA devotes considerable resources to infiltrate computers, which is handled
    by its Tailored Access Operations (TAO) group. It’s believed that TAO has a host
    of exploits and can attack any PC irrespective of whether you’re running Windows,
    Mac OS, or Linux.


    After all our recommends, it’s disturbing to think that if the NSA wants into
    your computer then it will get in. That is, if you believe every detail of the
    documents leaked by former NSA contractor and whistleblower, Edward Snowden. Unfortunately,
    making your computer impervious to attackers is a more involved process than making
    it susceptible to crack, and a strong password isn’t always the answer. The attacker
    might just be able to reset it by answering your loosely-picked secret question.


    Generating complex passwords is of fundamental importance to privacy. How passwords
    are managed, however, is just as essential. Writing passwords on paper can be
    inherently dangerous and not everyone can make a mind palace like Sherlock to
    store complex passwords. This is why you need a password management tool like
    KeePassX.


    KeePassX is open source passphrase generation and management software. The tool
    can generate extremely sophisticated, highly specific passphrases in seconds.


    > “The only way to ensure the integrity of your files is to encrypt the medium
    they reside on.”


    Additionally, KeePassX can be used to manage encrypted passphrases, which can
    later be accessed via a master passphrase. This master removes the requirement
    to remember multiple passphrases. Since a master gives access to all other passphrases,
    it must be immune from dictionary attacks, password sniffers, and other threats
    such as keyloggers. It’s advisable to use a combination of upper and lowercase
    letters, numbers, and other special characters.


    We’ve looked at tools that let you encrypt conversations and attachments before
    they leave your computer. However that doesn’t help you if your computer is stolen
    or stealthily broken into. The only way to ensure the integrity of your files
    is to encrypt the medium they reside on. Many Linux distros, including Fedora
    and Ubuntu give you the option to encrypt the disk before installing the distribution.
    This is known as Full Disk Encryption and according to the Electronic Frontier
    Foundation (EFF) is one of the best ways to ensure data privacy even for novice
    users.


    Then there are times when you need to carry sensitive files on a removable storage
    device, such as a USB drive. Having an encrypted hard disk isn’t of any use in
    such a scenario. For situations like these you need tools to create portable encrypted
    volumes.


    # Encrypted drives


    There are several options for encrypting removable drives, such as Gnome’s Disk
    Utility. However, the most popular option despite the recent controversies is
    the TrueCrypt tool.


    TrueCrypt is an open source cross-platform tool that creates an on-the-fly encrypted
    volume. This means that data is automatically encrypted right before it’s saved
    and decrypted right after it’s loaded. TrueCrypt is controversial both because
    it’s 70,000 lines of code have never been fully vetted, and for the odd abrupt
    manner with which the development team decided to end support for TrueCrypt. The
    crowdfunded Open Crypto Audit Project (https://opencryptoaudit.org/) is correcting
    the vetting issue and plans to continue development. The audit project also hosts
    a verified copy of v7.1, which we’d recommend using as it’s the last stable edition.


    Instead of creating an encrypted folder, TrueCrypt creates a virtual disk within
    a file and encrypts this. Whenever you use TrueCrypt to decrypt the disk, it’ll
    be presented in your file manager as a hard disk. While it’s encrypted, it appears
    on your filesystem as an ordinary file. You can even copy it to a


    # Cloud services offering privacy


    If you like the services offered by popular cloud-sharing websites but are wary
    of their privacy policies, here are some options that offer similar conveniences
    while respecting your privacy.


    First up is our favourite: OwnCloud. This is an open source Dropbox-like file
    sharing tool that you can install on your own hardware within your premises. You
    are in charge of your data so that you can access from anywhere, just like with
    Dropbox. If you prefer using the command line, there’s also SparkleShare which
    will transfer data over SSH channels.


    You can also synchronise folders using the Git-annex assistant which supports
    GPG. If you have a Raspberry Pi, keep an eye on the under-development arKOS project,
    which will let you host your own website, email, social networking and cloud sharing
    accounts and other services.


    If you lack the time or skills to roll your own storage service, you can use third-party
    services that take measures to ensure your privacy. If you want to share a private
    document with someone, use the http://secureshare.re service. It will encrypt
    the document on your computer before uploading it to its web server, it then generates
    a password-protected self-destructing URL that you can pass on to the recipient.
    At their end the file is downloaded and decrypted locally.


    Similarly, if you’d like to share images, audio and video you can use the http://mediacru.sh
    service which offers free storage and also respects your privacy. It uses HTTPS
    protocol, stores nothing about users, doesn’t display any advertisements, and
    respects your browser’s DoNotTrack settings.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_13_0.png)


    The img.bi service is an image hosting website that encrypts files before uploading
    them and gives you a link for later removal.'
