- pgno: 21
  md: '# # Cloud storage


    If you want to go it alone, there’s a personal free software alternative to Dropbox,
    Flickr and many other online services.


    Cloud computing is the current buzzword for what is, essentially, using remote
    computer storage and software through the internet. Gmail, Dropbox, Flickr, Tumblr
    and personal blogs hosted on Blogspot or WordPress are just some of the cloud
    computing services that are popular these days. And as convenient as all these
    services are, cloud computing has a big problem, at least in the incarnations
    above. On the one hand, you pay (with personal data, attention or money) somebody
    to manage hardware and software on your behalf. On the other, all those services
    and your own content remain available online only for as long as that single provider
    remains able and willing to keep you in, and keep you according to its own terms
    and conditions.


    The solution to this problem is to create your own cloud: a portable, web-based
    environment, made of free software; one that can run pretty much everywhere, from
    basic web hosting accounts (including some free ones) to your own Linux (virtual)
    server. This tutorial explains how to use OwnCloud (http://owncloud.org), one
    of the most promising free software projects in this space, which now boasts its
    own annual conference in Berlin.


    In order to whet your appetite and increase your motivation, the tutorial is divided
    into two main parts. The first presents what end users can do with an already-existing
    OwnCloud instance. The second part explains how to install, configure and administer
    such an instance.


    OwnCloud’s basic services are a mix of online file storage, calendars and an address
    book. It’s possible to access and synchronise OwnCloud folders directly from your
    desktop. The same installation can host many independent users. Starting from
    version 4.5 (the one we’re describing here, OwnCloud versions are coming thick
    and fast, see p78 for tips


    for the latest major release, including self-signed certificates), ownCloud supports
    file versioning and a unified access and synchronisation interface to mainstream
    storage services, such as Dropbox or Google Drive. If that isn’t enough, you can
    extend its capabilities with several optional applications.


    A basic ownCloud (pictured, below left) is a place to save and share your files,
    pictures, audio files, calendar and contact lists online from any browser or any
    computer or smartphone. The file manager includes OpenDocument and PDF viewers,
    plus an editor for plain text files. The pictures are available one by one, or
    as full-screen slideshows, while the music collection supports audio streaming.


    The Contact and Calendar functions aren’t state of the art, but have all the basic
    features, and it’s possible to import Google contacts or create custom fields
    in your address book for your activities. Several independent calendars can be
    defined, or shared with other users of the same OwnCloud. The first time you open
    it, Calendar asks for your position to set the corresponding time zone, but you
    can change that. Just remember that if you don’t set it properly, your OwnCloud
    calendar and the ones in your smartphone or desktop computers will be unable to
    sync to each other.


    Even when automatic synchronisation isn’t possible, you can import and export
    single events or whole calendars from your own OwnCloud account in the standard
    iCal format. Any


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_21_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_21_1.png)


    > > The OwnCloud basic package: file storage, online music and picture galleries,
    calendar and address books, all in the same browser window.'
