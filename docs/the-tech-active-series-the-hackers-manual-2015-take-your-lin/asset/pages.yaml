  md: '# Create and use a TrueCrypt volume


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_14_0.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_14_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_14_2.png)


    # 1 Create volume


    Launch the application and press the Create Volume button. This will launch a
    Volume Creation Wizard which will walk you through the necessary steps. The first
    step lets you choose where you wish to create the TrueCrypt volume. The first
    option is the recommended option for new users.


    # 2 Volume options


    Similarly, select the default options for most of the following steps. You’ll
    be asked whether you wish to create a normal volume or a hidden volume. You’ll
    also have to specify the name of the file that will act as the encrypted container
    and its size as well as the encryption algorithm for the volume.


    # 3 Mount volume


    In the main screen again, press the Select File button and select the encrypted
    volume you’ve created. Then press the Mount button and enter the password for
    the volume. The encrypted volume will then be mounted and listed in your file
    manager. Click the Dismount button to unmount it.


    USB stick and take it to another computer and read its contents with another copy
    of TrueCrypt.


    For a truly portable encrypted solution, you can create an encrypted virtual disk
    inside removable drives and also pack in the TrueCrypt Linux shell script as well
    as the Windows executable along with it. This allows you to decrypt the TrueCrypt
    volumes wherever you are. One major disadvantage of encrypted filesystems is that
    they don’t hide the fact that you are hiding something. A determined intruder
    can coerce you to hand over the encryption keys or you could be legally obligated
    to. TrueCrypt has a way around this: using the Hidden Volumes feature you can
    create an encrypted volume inside another. You interact with the outer volume
    like a standard TrueCrypt volume. However, the inner volume is hidden and the
    space it occupies is shown as free disk space.


    Both volumes have different passwords, so even if you are forced to reveal the
    password for the outer container, the contents within the inner container remain
    encrypted. And since no one knows about the existence of the inner container it
    offers to scope to lie.


    You’ll also find the KeePassX password manager, the Pidgin IM client with the
    OTR plugin as well as the Claws email ready to send GPG encrypted messages. The
    distro uses Gnome’s Disk Utility to create encrypted volumes.


    Tails also includes a virtual keyboard to protect you from key-loggers. The Nautilus
    file manager is equipped with an extension to securely zap files and also make
    sure no one can recover deleted files from the available disk space. As we’ve
    pointed out earlier, it’s rather difficult to be totally anonymous especially
    while you’re online. But using the tools covered here, individually or, better
    still, together, you can go a long way in concealing your identity and shield
    yourself from data mining silos run by clandestine government agencies or profit-making
    corporations.


    # Switch distro


    If you’re concerned about your privacy, you should ditch your regular distro and
    use one of the specialised ones designed to protect your privacy. Not only do
    they lack features that tread on your privacy (such as Ubuntu’s Amazon lens) they
    also include several of the tools covered here.


    The Debian-based Tails (The Amnesic Incognito Live) distro runs from RAM and makes
    sure it doesn’t use the swap partition even if there’s one available. When Tails
    is shutdown, it’ll also securely wipes the RAM to remove all traces of ever being
    used. Tails features the Gnome 2 desktop, but also offers an option to camouflage
    the desktop to resemble that of Windows XP. The distro includes the Tor Browser
    Bundle and its Iceweasel-based Tor Browser includes privacy-enhancing plugins
    such as Https Everywhere, NoScript, Cookie Monster, Adblock Plus and others.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_14_3.png)


    No, we haven’t used a Windows XP screenshot by mistake. This is Tails in disguise,
    so you can use it in a cyber-cafe without raising curiosity.'
