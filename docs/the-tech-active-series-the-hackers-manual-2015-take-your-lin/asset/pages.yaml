  md: '# Secure your device


    Batten down the ports and hatches.


    In addition to restricting the flow of data to third-party apps and encrypting
    all forms of communication, you’ll also need to protect against physical compromise.
    Securing the device safeguards it against the most common fears – theft and unauthorised
    access.


    Privacy conscious users should enable and use one of the several options to lock
    the phone. You can restrict access via a pattern, a numerical pin, an alpha-numeric
    password, or a voice command. If you are using a lock screen you should also disable
    any lock screen widgets. Disabling lock screen widgets required third-party apps
    like Lockscreen Policy, but is now built into the latest version of Android.


    Locking the phone is one thing, but it wouldn’t help when you hand over an unlocked
    phone to someone. You can use Screen Locker (http://bit.ly/LRBtzz) to lock your
    screen before handing the phone to someone else. The app disables all forms of
    inputs and prevents the users from viewing anything other than what’s on the screen.
    You can then enter a preset pattern to unlock the device.


    Then there are apps which will lock access to an app with a password. One such
    is Privacy Master Free, which can also take a crash to prevent an app from launching,
    and prevent access to key areas such as the Google Play Store. You can also block
    the task manager as well as USB connections.


    Then there’s the AppLock app which, along with the ability to block access to
    apps, also has two separate vaults where you can hide photos and videos. The app
    can also prevent toggling of settings such as Wi-Fi. One of the best features
    is its ability to create lock profiles. So you can create a list of apps you want
    to lock when you’re in the office, and another set when you’re with naughty nephews.
    You can trigger the locks based on time or location.


    On the security side, the app can randomly rearrange its numeric keyboard to prevent
    others from figuring out your password by following your fingers. It also allows
    you to hide the app from the application drawer to keep its existence on your
    device a secret.


    is a one-way process, which is to say that once turned on there’s no mechanism
