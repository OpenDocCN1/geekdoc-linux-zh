  md: '# Hacks


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_136_0.png)


    ```

    pdb.gimp_context_set_brush_size(128)

    pdb.gimp_context_set_default_colors()

    (160,100)

    ```


    If you have the brush called ‘Cell 01’ available, then the above code will draw
    a green splodge in the middle of your canvas. If you don’t, then you’ll get an
    error message. You can get a list of all the brushes available to you by calling
    **pdb.gimp_brushes_get_list()**. The paintbrush tool is more suited to these fancy
    brushes than the hard-edged pencil, and if you look in the procedure browser at
    the function **gimp_paintbrush**, you will see that you can configure gradients
    and fades too. For simplicity, we have just used the defaults/current settings
    here. On the disc you will find a file *lines/blob.py* which will register a fully-fledged
    Gimp plugin, replete with a few tweaks.


    For the rest of the tutorial we will describe a slightly more advanced plugin
    for creating bokeh effects in your own pictures. ‘Bokeh’ derives from a Japanese
    word meaning blur or haze, and in photography refers to the out-of-focus effects
    caused by light sources outside of the depth of field. It often results in uniformly
    coloured, blurred, disc-shaped artefacts in the highlights of the image, reminiscent
    of lens flare. The effect you get in each case is a characteristic of the lens


    and the aperture – depending on design, one may also see polygonal and doughnut-shaped
    bokeh effects. For this exercise, we''ll stick with just circular ones.


    Our plugin will have the user pinpoint light sources using a path on their image,
    which we will assume to be single-layered. They will specify disc diameter, blur
    radius, and hue and saturation adjustments. The result will be two new layers:
    a transparent top layer containing the ‘bokeh discs’, and a


    > “Our plugin creates a layer with ‘bokeh discs’ and another with a blurred copy
    of the image”


    layer with a blurred copy of the original image. The original layer remains untouched
    beneath these two. By adjusting the opacities of these two new layers, a more
    pleasing result may be achieved. For more realistic bokeh effects, a part of the
    image should remain in focus and be free of discs, so it may be fruitful to erase
    parts of the blurred layer. Provided the user doesn’t rename layers, then further
    applications of our


    +   Applying our bokeh plugin has created a pleasing bokeh effect in the highlights.'
