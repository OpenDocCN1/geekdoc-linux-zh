- pgno: 45
  md: '# Arduino: Kerbal Space Program


    Making a custom controller for Kerbal isn''t rocket science, we show you how.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_45_0.png)


    The standard PC keyboard isn''t great for flight sims. Every time you hit G to
    toggle your landing gear, you remember that you aren''t really flying at all.
    But just because a game uses a keyboard, it doesn''t need to be a boring Qwerty
    one. The Arduino Leonardo is a microcontroller (http://bit.ly/LXfieon) that emulates
    a standard USB keyboard. You can wire it up so that, instead of hitting Esc to
    eject from the cockpit, you have to lift a switch guard, flick the switch to arm
    the system and press the flashing illuminated button. Which, we think you''ll
    agree, is a lot cooler. Everyone has their own idea of what they want from a custom
    controller. You might want a general-purpose device that will work with any flight
    sim. The author happens to be a monomaniac who only plays Kerbal Space Program,
    so built


    his exclusively for that. But the general principles are the same and that''s
    what we''re going to explain here. Let''s start with an Arduino. There are several
    versions, but you''ll want the Leonardo. This is the only one that can emulate
    a USB keyboard in hardware. You can buy barebones one for about £14, but if this
    is your first project, you''ll want some LEDs and resistors as well as a prototyping
    breadboard. There are some good starter bundles at http://4tronix.co.uk and http://proto-pic.co.uk.
    The basic principle is that you connect a button or a switch to the Arduino and
    then program it so that when you press the button it sends the corresponding key-press
    to the PC. Your game will behave as if you''d pressed the key on the keyboard,
    and you can keep the regular keyboard plugged in too, so that


    # Debouncing


    Hardware switches and buttons are mechanical devices with mechanical imperfections.
    When you close a switch, the electrical contacts will bounce slightly, making
    and breaking contact for a few milliseconds until they settle into place. If your
    Arduino sends a key press each time the contact is made, you''ll send several
    key presses when you only want one. The solution is called debouncing and it''s
    really simple. All you do is program the Arduino to wait for five milliseconds
    or so after it first detects the switch has closed, before it actually does anything.
    You''ll need to debounce the inputs from each mechanical switch and button. The
    example program at Arduino.cc (http://bit.ly/SB7zp) will show you how. Some expansion
    boards, such as the SX1509 used in this project, include hardware debouncing functions.
    In such cases, you need to use a simple command to enable debouncing for that
    input pin when you initialise the board.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_45_1.png)'
