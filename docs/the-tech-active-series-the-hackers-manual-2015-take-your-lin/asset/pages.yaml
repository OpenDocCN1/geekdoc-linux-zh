- pgno: 66
  md: '# Crack WordPress


    Attacking a vulnerable web app.


    As HTML5 becomes more powerful, and JavaScript becomes faster, web apps are becoming
    more and more prevalent. Ubuntu and some other distributions are now treating
    them as first-class applications, and Mozilla is building a smartphone that uses
    these for all its functionality. However, they’ve also brought with them a whole
    new set of vulnerabilities that weren’t present before.


    We’re going to take a look at this area, using WordPress as an example. We’re
    not picking on WordPress because it’s a bad application, but because its popularity
    and extensibility has made it a particular target. None of the attacks here are
    in any way unique to this platform, and they’re found commonly on many web applications
    – whether or not they’re CMSes.


    Since we believe in showing how attacks work, rather than just explaining them,
    we’ve created a virtual machine (Linux Format Vulnerable Machine_Lova) that runs
    a vulnerable version of WordPress. (Download it from www.linuxformat.com/files/hackman2015.zip
    and look in the HackWeb folder. Once you’ve got it, follow the step-by-step guide
    below to get it up and running. You’ll need VirtualBox, but otherwise it should
    work on almost any distro. We’ve used the blogging format of WordPress to show
    you how to break in to it, so just fire it up and get started.


    Once you’ve found the attacks, the blog also provides you with details of how
    to protect yourself, so see if you can plug the security holes before moving on.


    # Protect yourself


    If you’re running any type of web app, it’s imperative that you’re aware of the
    risks. Vulnerabilities could go further than just the app itself, since an attacker
    may be able to get control of the server. If you’re running off-the-shelf software
    (such as WordPress), a good rule of thumb is: the simpler and more standard things
    are, the easier it is to keep on top of things, and the easier it is to keep up
    to date. Always make sure you’re using the latest versions of everything. Intrusion
    Detection Systems, and Intrusion Prevention Systems (IDSs and IPSs) can help reduce
    the damage an attacker can do, but they aren’t a silver bullet that will magically
    solve your security problems. Likewise, you should have SELinux or AppArmor running
    and properly configured.


    If you’re using a custom-written web app, you need to make sure that you’re familiar
    with the various techniques attackers may use. The OWASP (Open Source Web Applications
    Security Project) website is a great place to start (https://www.owasp.org). If
    you’re holding any form of important data on your site, you should get specialist
    security advice on how to keep it safe.


    > According to the Web Hacking Information Database, cross-site scripting (XSS)
    is the second most common form of attack on websites.


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_66_0.png)


    # Levels of protection


    There’s no such thing as perfect security. That’s true in the real world just
    as much as it’s true in the digital world. The information in this article will
    make you safer, but it won’t make you safe. Security is always a balancing act
    of convenience and vulnerability, and choosing how important these competing areas
    are is a personal matter. This article can only skim the surface of web security,
    which is a complex topic, and only one part of computer security. If you believe
    you’re at risk of a determined attack, then we highly recommend you seek expert
    help. Professional security consultants and penetration testers can help you harden
    your defences and lock out attackers.


    # Step by step: Set up the environment


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_66_1.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_66_2.png)


    ![](img/b6e789f7b1bc6629f6c97a3e4beae1de_66_3.png)


    +   1. Import the VM

    +   Click (or double-click) Linux Format Vulnerable Machine_Lova, then click ''Import''
    on the dialog box.


    +   2. Start the VM

    +   Double-click the new machine to start it. Once it has booted, it will display
    a blue screen, giving various URLs.


    +   3. Browse the site

    +   Start a web browser (any should work) and point it to the top URL from the
    previous step (labelled Web).'
