- md: "\n# Secret Revealed\n## 500 LINUX Commands\n## 2022\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_0_0.png)\n\
    \n# Secret Revealed\n## 500 LINUX Commands\n## 2022\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_2_0.png)\n\
    ![](img/cc3925c98d37acaf6e6d4c3b898f4520_2_1.png)\n\n# Introduction\n\nIn this\
    \ document, you will find more than 500 commands via the Linux terminal. All well-explained\
    \ how they work and what they do. Entirely in Portuguese, with a simple and objective\
    \ language that can be understood by all users (from the simplest to advanced\
    \ level).\n\nThis is an opportunity to not only use the graphical interface to\
    \ execute the commands, but to master the terminal. Further increasing your knowledge\
    \ in the Linux universe. After all, at certain times, we need more knowledge to\
    \ perform certain tasks.\n\nLinux is already present in large companies, and mastering\
    \ it means an additional differential in relation to other employees of the company.\n\
    \nEven with daily practice, it is unlikely that you will save all the commands\
    \ from the terminal, but the idea of this list is to bring the primordial commands\
    \ to the Linux terminal, as its list is vast.\n\nThis booklet is freely distributed\
    \ and can be shared and downloaded by anyone, after all, the main objective is\
    \ its dissemination and distribution, without any profit purpose.\n\nUseful for\
    \ beginners; curious; intermediate level looking to delve deeper and for those\
    \ who are already advanced and want to remember some of the commands.\n\nHowever,\
    \ before executing the commands in the terminal, remember the famous root mode\
    \ phrase: \"With great power comes great responsibility\" - Stan Lee\n\n# Summary\n\
    \n- Introduction two\n- 1. Reference Guide – List of Commands for Linux 4\n- 1.1.\
    \ Knowing the system hierarchy 4\n- 1.2. global shortcuts 5\n- 2. Helpful tips\
    \ for learning 5\n- 3. command list 6\n- 4. Complete Reference Guide – Advanced\
    \ Terminal Commands 10\n- 4.1. Linux system information 10\n- 4.2. Shutdown (System\
    \ Reboot or Logout) 12\n- 4.3. files and directories 12\n- 4.4. find files 14\n\
    - 4.5. Working with file system 16\n- 4.6. Disk Space 17\n- 4.7. users and groups\
    \ 18\n- 4.8. File permissions (+Add and --Remove permissions) 19\n- 4.9. Special\
    \ file attributes (+ = Add and = Remove permissions) 20\n- 4.10. Compressed files\
    \ and files 22\n- 4.11. RPM packages (Red Hat, Fedora and derivatives) 23\n- 4.12.\
    \ YUM Updater packages (Red Hat, Fedora and derivatives) 24\n- 4.13. DEB packages\
    \ (Debian, Ubuntu and derivatives) 25\n- 4.14. APT Package Updater (Debian, Ubuntu\
    \ and Derivatives) 26\n- 4.15. View the contents of a file 27\n- 4.16. text manipulation\
    \ 28\n- 4.17. Set the file conversion format 29\n- 4.18. File system analysis\n\
    - 4.19. Format file systems\n- 4.20. backups\n- 4.21. CD-ROM\n- 4.22. Networks\
    \ (LAN and WiFi)\n- 4.23. Microsoft Windows Networks (SAMBA) ........................................................\
    \ 29\n- 4.24. Firewall (iptables) .......................................................................................\
    \ 29\n- 4.25. Monitoring and Debugging ................................................................................\
    \ 30\n- 4.26. Helpful hints and commands ........................................................................\
    \ 31\n\n# 1. Reference Guide – List of Commands for Linux\n\n## 1.1. Knowing the\
    \ system hierarchy\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_6_0.png)\n\n# 2.\
    \ global shortcuts\n\n```\nCtrl+C\n```\n- Cancels the current running command.\n\
    \n```\nCtrl+Z\n```\n- \n\n```\nCtrl+D\n```\n- Pause current command, return with\
    \ \"fg\" in Linux foreground or \"bg\" in background.\n- Logs out the current\
    \ session (similar to the \"exit\" command).\n\n```\nCtrl+W\n```\n- \n\n```\n\
    Ctrl+U\n```\n- Deletes a word on the current line.\n- Erase the entire line.\n\
    \n```\nCtrl+R\n```\n- \n\n```\n!\n```\n- Press to View a recent command.\n- Repeat\
    \ the last command.\n\n```\nexit\n```\n- Logs out of the current session.\n\n\
    # 2. Helpful tips for learning\n\n- 1. Type any command followed by “--help” (Two\
    \ dashes and the word help) for a detailed description of the command. (EX: “wget\
    \ --help”):\n- 2. Another way to get official documentation for Linux commands\
    \ is the man command (manual), Type man followed by the name of the command you\
    \ need information about. (EX: man wget)\n- 3. If for some reason you prefer to\
    \ save the man information (Manual) of some command on a flash drive or smartphone\
    \ in PDF for further studies, use this command (EX: man -t wget | ps2pdf – wget.pdf)\n\
    \n# 3. command list\n\n- **ls**: Directory list.\n- **ls -al**: Directory list\
    \ with hidden files display.\n- **cd dir**: Changes from the current directory\
    \ to the specified one (replace the variable dir by the folder name).\n- **CD**:\
    \ Change to /home directory (personal files).\n- **pwd**: Displays the current\
    \ directory path.\n- **mkdir dir**: Creates a specified directory (replace the\
    \ variable dir by the folder name).\n- **rm arch**: Deletes the specified file\
    \ (replace the variable arch with the name of the file you want to delete).\n\
    - **rm -r dir**: Deletes the specified directory (replace the variable dir by\
    \ the folder name).\n- **rm -f file**: Erase the specified file forcibly (-f for\
    \ force) (replace the variable file by filename you want to delete).\n- **rm -rf\
    \ dir**: Erase the specified directory forcibly (replace the variable dir by the\
    \ folder name). Use this command with extreme attention!\n- **cp -r file1 file2**:\
    \ Copy \"file1\" to \"file2\" (replace variable file by the file name).\n\n```\n\
    cp -r dir1 dir2\n```\nCopy \"directory1\" to \"directory2\"; creates \"directory2\"\
    \ if it does not exist (replace the variable say by the directory name).\n\n```\n\
    mv file1 file2\n```\nDual function: Can be used to rename or move \"file1\" to\
    \ \"file2\". If file2 is an existing directory, move \"file1\" into the directory\
    \ \"file2\" (replace the variable arch by file name).\n\n```\nln -s file link\n\
    ```\nCreate a symbolic link, link (shortcut) to the file (replace the variable\
    \ q by filename and link by the name that the shortcut will have).\n\n# touch\
    \ file\nCreate or update the file (replace the variable file by the file name).\n\
    \n# cat > file\nDirects standard input to a file.\n\n# more arch\nDisplays the\
    \ contents of a file (replace arch by filename).\n\n# head arch\nDisplay the first\
    \ 10 lines (replace arch by filename).\n\n# tail arch\nDisplay the last 10 lines\
    \ (replace arch by filename).\n\n# tail -f arch\nDisplays the contents of a file\
    \ as it updates (increases in size) (replace arch by filename).\n\n# ps\n# top\n\
    # kill pid\n# killall proc\n# bg\n# fg\n# chmod octal arch\nChange the permissions\
    \ of “arch” octal, which can be specified for “user”, “group” and “others”. The\
    \ octal values are represented below:\n\n- 4 – reading (r, from read).\n- 2 –\
    \ write (w, from write).\n- 1 – execution (x, from execute)\n\nExplanation: To\
    \ set permissions, add the above values. For example, to assign the owner of the\
    \ file (\"user\") full read (r), write (w) and execute (x) access, just add the\
    \ octal value 4 + 2 + 1 = 7. Assuming you want to limit access to “group” members,\
    \ allowing read-only and recording, just add 4 + 2 = 6. Combining the two examples,\
    \ it would be chmod 760 (\"r\" for user, \"w\" for group and \"0\" for others).\n\
    \nAnother examples:\n\n- chmod 777: read (r), write (w) and execute (x) for all\
    \ (\"user\", \"group\" and \"others\").\n- chmod 755: \"rwx\" for the \"owner\"\
    \ (user), \"rw\" for the \"group\" and \"others\".\n\nFor more information, type\
    \ in the terminal: man chmod\n\n```\nssh user@host\n```\nConnect to host as user\
    \ (example: ssh gnulluxbrasil@meserver).\n\n```\nssh -p user port rio@host\n```\n\
    Connect to the host on the specified port (replace \"port\" with the configured\
    \ port number).\n\n```\nssh-copy-id user@host\n```\nAdd your key for that the\
    \ host and user; serves to enable passwordless logins using keys.\n\n```\ngrep\
    \ sequence files\n```\nSearch by string in file (replace string and values matching\
    \ the search).\n\n```\ngrep -r string dir\n```\nRecursively search for string\
    \ in dir.\n\n```\ncommand | grep sequence\n```\nSearch for string in command output\
    \ (replace command and sequence according to the values to be sought).\n\n```\n\
    locate file\n```\nFinds all instances of a file (replace datafile by the file\
    \ name).\n\n```\ndate\n```\nG you the current date and time.\n\n```\ncalendar\n\
    ```\nDisplays a calendar for the current month.\n\n```\nuptime\n```\nDisplays\
    \ system uptime.\n\n```\nw\n```\nDisplays who is online.\n\n```\nwhoami\n```\n\
    Displays who you are logged in as.\n"
  mdcn: "\n\n# 揭秘秘密\n## 500 条 Linux 命令\n## 2022\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_0_0.png)\n\
    \n# 揭秘秘密\n## 500 条 Linux 命令\n## 2022\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_2_0.png)\n\
    ![](img/cc3925c98d37acaf6e6d4c3b898f4520_2_1.png)\n\n# 引言\n\n在本文档，你将通过 Linux 终端找到\
    \ 500 多条命令。所有命令都详细解释了工作原理和作用。全文完全使用葡萄语编写，语言简单直观，所有用户（从初级到高级水平）都能理解。\n\n这不仅是一个利用图形界面执行命令的机会，更是一个精通终端的机会，进一步增加你在\
    \ Linux 世界中的知识。毕竟，在某些时候，我们需要更多知识来执行特定的任务。\n\nLinux 已经存在于大型公司，精通它意味着与公司其他员工相比具有额外的优势。\n\
    \n即使每天练习，你也不可能记住所有的终端命令，但此列表的目的是是将基础命令带入 Linux 终端，因为它的列表非常庞大。\n\n本书免费分发，任何人都可以分享和下载，毕竟其主要目标是传播和分发，无任何盈利目的。\n\
    \n对于初学者、好奇者、想要深入研究的中级人员，以及已经是高级但想想起某些命令的人来说都很有用。\n\n然而，在终端执行命令之前，请记住著名的 root 模式格言：“能力越大，责任越大”——\
    \ 斯坦·李（Stan Lee）\n\n# 目录\n\n- 引言（二）\n- 1. 参考指南 – Linux 命令列表 4\n- 1.1. 了解系统层次结构\
    \ 4\n- 1.2. 全局快捷键 5\n- 2. 学习实用提示 5\n- 3. 命令列表 6\n- 4. 完整参考指南 – 高级终端命令 10\n- 4.1.\
    \ Linux 系统信息 10\n- 4.2. 关机（系统重启或注销） 12\n- 4.3. 文件和目录 12\n- 4.4. 查找文件 14\n- 4.5.\
    \ 文件系统操作 16\n- 4.6. 磁盘空间 17\n- 4.7. 用户和组 18\n- 4.8. 文件权限（+添加和--移除权限）19\n- 4.9.\
    \ 特殊文件属性（+ = 添加和 = 移除权限）20\n- 4.10. 压缩文件和文件 22\n- 4.11. RPM 包（Red Hat, Fedora\
    \ 及其衍生版） 23\n- 4.12. YUM 更新包（Red Hat, Fedora 及其衍生版） 24\n- 4.13. DEB 包（Debian,\
    \ Ubuntu 及其衍生版） 25\n- 4.14. APT 包更新器（Debian, Ubuntu 及其衍生版） 26\n- 4.15. 查看文件内容\
    \ 27\n- 4.16. 文本处理 28\n- 4.17. 设置文件转换格式 29\n- 4.18. 文件系统分析\n- 4.19. 格式化文件系统\n\
    - 4.20. 备份\n- 4.21. CD-ROM\n- 4.22. 网络（局域网和 WiFi）\n- 4.23. Microsoft Windows 网络\
    \ (SAMBA) ........................................................ 29\n- 4.24.\
    \ 防火墙 (iptables) .......................................................................................\
    \ 29\n- 4.25. 监控与调试 ................................................................................\
    \ 30\n- 4.26. 有用提示和命令 ........................................................................\
    \ 31\n\n# 1. 参考指南 – Linux 命令列表\n\n## 1.1. 了解系统层次结构\n\n![](img/cc3925c98d37acaf6e6d4c3b898f4520_6_0.png)\n\
    \n# 2. 全局快捷键\n\n```\nCtrl+C\n```\n- 取消当前运行的命令。\n\n```\nCtrl+Z\n```\n- \n\n```\n\
    Ctrl+D\n```\n- 暂停当前命令，在 Linux 中使用 \"fg\" 返回前台，或使用 \"bg\" 返回后台。\n- 注销当前会话（类似于 \"\
    exit\" 命令）。\n\n```\nCtrl+W\n```\n- \n\n```\nCtrl+U\n```\n- 删除当前行上的一个单词。\n- 擦除整行。\n\
    \n```\nCtrl+R\n```\n- \n\n```\n!\n```\n- 按下执行上一次命令。\n\n```\nexit\n```\n- 退出当前会话。\n\
    \n# 2. 学习实用提示\n\n- 然而，在终端中执行命令之前，请记住 斯坦·李（Stan Lee）的著名格言：“能力越大，责任越大”。\n- 1. 想要获取命令的帮助，可以在命令后加上\
    \ `--help`（例如 `ls --help`）。\n- 2. 另一种获取帮助的方法是使用 `man` 命令（例如 `man ls`），可以查看命令的详细说明。\n\
    - 3. 想要查看命令的文档，可以使用 `info` 命令。\n\n# 3. 命令列表\n\n- **ls**: 显示目录内容。\n- **ls -al**:\
    \ 列出所有文件（包括隐藏文件）。\n- **cd**: 切换目录。\n- **pwd**: 显示当前目录路径。\n- **mkdir**: 创建目录。\n\
    - **rm**: 删除文件。\n- **rm -r**: 递归删除目录及其内容。\n- **rm -f**: 强制删除。\n- **cp**: 复制文件或目录。\n\
    - **mv**: 移动或重命名文件或目录。\n- **touch**: 创建空文件或更新访问时间。\n- **cat**: 显示文件内容。\n- **more**:\
    \ 分页查看文件或输出。\n- **head**: 显示文件前几行。\n- **tail**: 显示文件后几行。\n- **tail -f**: 实时查看文件更新（常用于日志）。\n\
    - **find**: 在目录搜索文件。\n- **grep**: 在文件中搜索字符串。\n- **chmod**: 修改文件权限。\n- **chown**:\
    \ 修改文件所有者。\n- **tar**: 归档工具。\n- **zip / unzip**: 压缩和解压文件。\n- **wget / curl**:\
    \ 下载文件。\n- **ssh**: 远程登录。\n- **scp**: 远程复制文件。\n- **rsync**: 同步文件。\n- **df**: 显示磁盘空间使用情况。\n\
    - **du**: 显示目录占用空间。\n- **top**: 实时进程监控。\n- **htop**: 交互式进程管理器。\n- **ps**: 查看进程状态。\n\
    - **kill**: 终止进程。\n- **alias**: 设置别名。\n- **unalias**: 别名。\n- **echo**: 输出文本。\n\
    - **read**: 读取标准输入。\n- **sort**: 排序。\n- **uniq**: 过滤重复行。\n- **diff**: 比较文件。\n\
    - **which**: 查找命令。\n- **clear**: 清除终端屏幕。\n- **vim / nano**: 文本编辑器。\n- **man**:\
    \ 查看帮助手册。\n- **sudo**: 以超级权限执行。\n- **env**: 查看环境变量。\n\n"
