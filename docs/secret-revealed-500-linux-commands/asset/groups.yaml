    ### 1.2. Shutdown (System Reboot or Logout)


    - shutdown -h now turn off the system (1).

    - shutdown -h minutes shut down the system according to the selected minute (EX.:
    shutdown -30, shut down in 30 minutes).

    - init 0 turn off the system (2).

    - telinit 0 turn off the system (3).

    - halt turn off the system (4).

    - shutdown -r message: to send a message to users affected by the shutdown, use
    the command like this: sudo shutdown -r 30 "The system will restart in 30 minutes"

    - shutdown -c cancels a planned system shutdown.

    - shutdown -r reset (1).

    - reboot reset (2).

    - logout close the session.


