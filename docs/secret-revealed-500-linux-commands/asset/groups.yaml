- md: "\n```bash\nfuser -km /mnt/hda2\n```\nForces removal when device is busy.\n\n\
    ```bash\numount -n /mnt/hda2\n```\nPerforms the removal without reading the /etc/MTAB\
    \ file. Useful when file is read-only or disk is full.\n\n```bash\nmount /dev/fd0\
    \ /mnt/floppy\n```\nMounts a floppy disk (floppy).\n\n```bash\nmount /dev/cdrom\
    \ /mnt/cdrom\n```\nMount a cdrom/dvdrom.\n\n```bash\nmount /dev/hdc/mnt/cdrom\n\
    ```\nMount a recordable cd or dvdrom.\n\n```bash\nmount /dev/db/mnt/cdrom\n```\n\
    Mount a writable cd/dvdrom.\n\n```bash\nmount -o loop file.iso /mnt/cdrom\n```\n\
    Mount an iso image.\n\n```bash\nmount -t vfat /dev/hda5 /mnt/hda5\n```\nMount\
    \ a FAT32 file system.\n\n```bash\nmount /dev/sda1 /mnt/usbdisk\n```\nMounts a\
    \ memory flash drive drive specifying the file system type.\n\n## 4.6. Disk Space\n\
    \n```bash\ndf -h\n```\nDisplays the size of files and directories sorted by size.\n\
    \n```bash\nls -l | more\n```\nEstimates the space used by directory.\n\n```bash\n\
    du -sh\n```\nDisplays the size of files and directories sorted by size.\n\n```bash\n\
    du * | sort -rn\n```\nDisplays the space used by installed packages, sorted by\
    \ size (Fedora, Red Hat, and others).\n\n```bash\nrpm -q -a '%{SIZE}' | sort -k1\n\
    ```\nDisplays the space used by installed packages organized by size (Debian,\
    \ Ubuntu and derivatives).\n\n```bash\ndpkg-query -W -f='${Package}\\n' | sort\
    \ -k1\n```\nDisplays packages that consume the most space (in descending order).\n\
    \n## 1.7. Users and groups\n\n```bash\ngroupadd group_name\n```\nCreate a new\
    \ group.\n\n```bash\ngroupdel group_name\n```\nDelete a group.\n\n```bash\ngroupmod\
    \ -n new_group_name group_name\n```\nRenames a group.\n\n```bash\nuseradd -c \"\
    Name\" -g admin -d /home/user1 user1\n```\nCreates a new user.\n\n```bash\nuserdel\
    \ -r user1\n```\nDeletes a user.\n\n```bash\nusermod -c \"User\" -g system -d\
    \ /etc/nologin user1\n```\nChange user attributes.\n\n```bash\npasswd user1\n\
    ```\nChange password.\n\n```bash\nchage -E 2016-06-22 user1\n```\nSets a time\
    \ limit for the user's password.\n\n## Linux system information\n\n```bash\npwck\n\
    ```\nChecks the correct /etc/passwd file format and existence of users.\n\n```bash\n\
    grpck\n```\nCheck for correct /etc/group file format and existence of groups.\n\
    \n```bash\nnewgroup group_name\n```\nRegister a new group to change the default\
    \ group of newly created files.\n\n## 4.8. File permissions (+ = Add and - = Remove\
    \ permissions)\n\n```bash\nls -lh\n```\nDisplays permissions.\n\n```bash\nls /tmp\
    \ | pr -T -W$COLUMNS\n```\nDivides the terminal into 5 columns.\n\n```bash\nchmod\
    \ ugo+rwx directory1\n```\nSet read (r), write (w) and execute (x) permissions\
    \ for owner (u), group (g) and others (or) on the directory 'file1'.\n\n```bash\n\
    chmod go-rwx directory1\n```\nRemove read (r), write (w) and execute (x) group\
    \ (g) and others (or) permission on directory 'file1'.\n\n```bash\nchown user1\
    \ file1\n```\nChange the owner of a file.\n\n```bash\nchown -R user1 directory1\n\
    ```\nChanges the owner of a directory and all files and directories contained\
    \ within.\n\n```bash\nchgrp group1 file1\n```\nChange the filegroup.\n\n```bash\n\
    chown user1 file1\n```\nChange ownership.\n\n```bash\nfind / -perm -u+s\n```\n\
    View all files with SUID system configured.\n\n```bash\nchmod u+s /bin/file1\n\
    ```\nSets the SUID in a binary file. The user running this file acquires the same\
    \ privileges as owner.\n\n```bash\nchmod -u+s /bin/file1\n```\nDisables the SUID\
    \ in a binary file.\n\n```bash\nchmod g+s /home/public\n```\nSets the SGID bit\
    \ on a directory - similar to SUID, but for the directory.\n\n```bash\nchmod -g-s\
    \ /home/public\n```\nTurns off the SGID bit on a directory.\n\n```bash\nchmod\
    \ o+t /home/public\n```\nSet STICKY bit in a directory. Allows deletion of files\
    \ only for legitimate owners.\n\n```bash\nchmod -o-t /home/public\n```\nTurns\
    \ off STICKY bit on a directory.\n\n## 1.9. Special file attributes (+ = Add and\
    \ - = Remove permissions)\n\n```bash\nchattr +a file1\n```\nAllows recording by\
    \ opening a file append mode.\n\n```bash\nchattr +c file1\n```\nAllows a file\
    \ to be zipped/unzipped automatically.\n\n```bash\nchattr +d file1\n```\nIt ensures\
    \ that the program ignores deleting files during backup.\n\n```bash\nchattr +i\
    \ file1\n```\nMakes the file unaltered so it cannot be deleted, changed, renamed,\
    \ or linked.\n\n```bash\nchattr +s file1\n```\nAllows a file to be safely deleted.\n\
    \n```bash\nchattr +S file1\n```\nIt ensures that a file is modified, the changes\
    \ are written in synchronous mode, as specified.\n\n```bash\nchattr +u file1\n\
    ```\nIt allows the file to be compressed.\n\n```bash\nlsattr file1\n```\nDisplays\
    \ special attributes.\n\n## 10. Compressed files\n\n```bash\nchattr -u file1\n\
    ```\nDecompresses the file or allows it to be uncompressed.\n\n```bash\nlsattr\
    \ file1\n```\nDisplays special attributes.\n\n```bash\nchattr +c file1\n```\n\
    Allows a file to be compressed.\n\n```bash\nchattr -c file1\n```\nDecompresses\
    \ the file.\n\n```bash\nchattr +d file1\n```\nAllows a file to be compressed.\n\
    \n```bash\ngzip -9z file1\n```\nCompresses a file.\n\n```bash\nrpm -q -a\n```\n\
    Displays all compressed packages.\n\n```bash\nrpm -q - grep\n\n\n\n\n all of with\
    \ the file.\n\n```bash\nrpm -q -i\n```\nInformation about a compressed package.\n\
    \n```bash\nrpm -q -l\n```\nDisplays the list of files provided by a compressed\
    \ package.\n\n```bash\nrpm -q -f\n```\nChecks which compressed package belongs\
    \ to a given file.\n\n```bash\nrpm -q -p file.rpm -l\n```\nDisplays the list of\
    \ files provided by a package rpm that has not yet been installed.\n"
