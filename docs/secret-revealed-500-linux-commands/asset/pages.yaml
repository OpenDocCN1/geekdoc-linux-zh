  md: 'Change the permissions of the file “arch” to octal, which can be specified
    separately for “user”, “group” and “others”. The octal values are represented
    below:


    +   - 4 – reading (r, from read).

    - 2 – write (w, from write).

    - 1 – execution (x, from execute)


    Explanation: To set permissions, add the above values. For example, to assign
    the owner of the

    file ("user") full read (r), write (w) and execute (x) access, just add the octal
    value 4 + 2

    + 1 = 7. Assuming you want to limit access to “group” members, allowing read-only

    and recording, just add 4 + 2 = 6. Combining the two examples mentioned, it would

    be: chmod 760 ("r" for user, "w" for group and "0" for others or "rw-")'
  merge: -1
  pgno: 14
