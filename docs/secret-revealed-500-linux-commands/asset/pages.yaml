- img_proc: true
  md: '# Introduction


    In this document, you will find more than 500 commands via the Linux terminal.
    All well explained how they work and what they do. Entirely in Portuguese, with
    a simple and objective language that can be understood by all users (from the
    simplest to advanced level).


    This is an opportunity to not only use the graphical interface to execute the
    commands, but to master the terminal. Further increasing your knowledge in the
    Linux universe. After all, at certain times, we need more knowledge to perform
    certain tasks.


    Linux is already present in large companies, and mastering it means an additional
    differential in relation to other employees of the company.


    Even with daily practice, it is unlikely that you will save all the commands from
    the terminal, but the idea of this list is to bring the primordial commands to
    the Linux terminal, as its list is vast.


    This booklet is freely distributed and can be shared and downloaded by anyone,
    after all, the main objective is its dissemination and distribution, without any
    profit purpose.


    Useful for beginners; curious; intermediate level looking to delve deeper and
    for those who are already advanced and want to remember some of the commands.


    However, before executing the commands in the terminal, remember the famous root
    mode phrase: "With great power comes great responsibility" - Stan Lee'
