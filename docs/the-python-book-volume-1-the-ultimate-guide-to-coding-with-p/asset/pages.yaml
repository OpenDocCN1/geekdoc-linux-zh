  md: "# Python for system administrators\n\nLearn how Python can help in system administration\
    \ as it dares to replace the usual shell scripting...\n\n# Resources\n\nPython-devel\
    \ Python development libraries, required for compiling third-party Python module\n\
    \nsetuptools setuptools allows you to download, build, install, upgrade, and uninstall\
    \ Python packages with ease\n\nSystem administration is an important part of our\
    \ computing environment. It does not matter whether you are managing systems at\
    \ your work or home. Linux, being a UNIX-based operating system, already has everything\
    \ a system administrator needs, such as the world-class shells (not just one but\
    \ many, including Bash, csh, zsh etc), handy tools, and many other features which\
    \ make the Linux system an administrator's dream. So why do we need Python when\
    \ Linux already has everything built-in? Being a dynamic scripting language, Python\
    \ is very easy to read and learn. That's just not us saying that, but many Linux\
    \ distributions actually use Python in core administrative parts. For example,\
    \ Red Hat (and Fedora) system setup tool Anaconda is written in Python (read this\
    \ line again, got the snake connection?). Also, tools like GNU Mailman, CompizConfig\
    \ Settings Manager (CCSM) and hundreds of tiny GUI and non-GUI configuration tools\
    \ are written using Python. Python does not limit you on the choice of user interface\
    \ to follow – you can build command-line, GUI and web apps using Python. This\
    \ way, it has got covered almost all the possible interfaces.\n\nHere we will\
    \ look into executing sysadmin-related tasks using Python.\n\n# Parsing configuration\
    \ files\n\nConfiguration files provide a way for applications to store various\
    \ settings. In order to write a script that allows you to modify settings of a\
    \ particular application, you should be able to parse the configuration file of\
    \ the application.\n\nIn this section we learn how to parse INI-style configuration\
    \ files. Although old, the INI file format is very popular with much modern open\
    \ source software, such as PHP and MySQL...\n\nExcerpt for php.ini configuration\
    \ file.\n\n```\n[PHP]\nengine = On\nzend.ze1_compatibility_mode = Off\nshort_open_tag\
    \ = On\nasp_tags = Off\nprecision = 14\ny2k_compliance = On\noutput_buffering\
    \ = 4096\n;output_handler = \nzlib.output_compression = Off\n\n[MySQL]\n; Allow\
    \ or prevent persistent links.\nmysql.allow_persistent = On\nmysql.max_persistent\
    \ = 20\nmysql.max_links = -1\nmysql.default_port = 3306\nmysql.default_socket\
    \ = \nmysql.default_host = localhost\nmysql.connect_timeout = 60\nmysql.trace_mode\
    \ = Off\n```\n\nPython provides a built-in module called ConfigParser (known as\
    \ configparser in Python 3.0). You can use this module to parse and create configuration\
    \ files.\n\n```\n@code:writeconfig.py\n@description:The following demonstrates\
    \ adding MySQL section to the php.ini file.\n@warning: Do not use this script\
    \ with the actual php.ini file, as it's not designed to handle all aspects of\
    \ a complete php.ini file.\nimport ConfigParser\nconfig = ConfigParser.\n```\n\
    \n```\nRawConfigParser()\nconfig.add_section('MySQL')\nconfig.set('MySQL', 'mysql_trace_mode',\
    \ 'Off')\nconfig.set('MySQL', 'mysql.connect_timeout', '60')\nconfig.set('MySQL',\
    \ 'mysql.default_host', 'localhost')\nconfig.set('MySQL', 'mysql.default_port',\
    \ '3306')\nconfig.set('MySQL', 'mysql.allow_persistent', 'On')\nconfig.set('MySQL',\
    \ 'mysql.max_persistent', '20')\n\nwith open('php.ini', 'ap') as configfile:\n\
    \    config.write(configfile)\n```\n\nOutput: php.ini\n[MySQL]\nmysql.max_persistent\
    \ = 20\nmysql.allow_persistent = On\nmysql.default_port = 3306\nmysql.default_host\
    \ = localhost\nmysql.trace_mode = Off\nmysql.connect_timeout = 60\n\n```\n@code:parseconfig.py\n\
    @description:Parsing and updating the config file\nimport ConfigParser\nconfig\
    \ = ConfigParser.ConfigParser()\nconfig.read('php.ini')\n# Print config values\n\
    print config.get('MySQL', 'mysql.\n```\n\n# Note\n\nThis is written for the Python\
    \ 2.X series, as it is still the most popular and default Python distribution\
    \ across all the platforms (including all Linux distros, BSDs and Mac OS X)."
