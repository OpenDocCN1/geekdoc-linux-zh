- pgno: 170
  md: "# 13 Sound configuration\n\nBefore configuring speech support for Navit, configure\
    \ the external sound card. You have to stop the Broadcom module from loading and\
    \ remove some Raspberry-Pi-specific ALSA (Advanced Linux Sound Architecture).\
    \ To do this, sudo-edit /etc/modprobe and comment out (i.e. prefix with a #):\n\
    \n+   - snd-bcm2835\n\nThen run:\n\n+   - sudo rm /etc/modprobe.d/alsa*\n\nReboot\
    \ for the changes to take effect. Use alsamixer to set the volume on the if it’s\
    \ too quiet.\n\n# 14 Download a voice\n\nThe speech synthesis software needs a\
    \ voice and a proprietary binary. You can get both by completing the following\
    \ steps:\n\n+   - sudo mkdir -p /usr/share/mbrola/voices/\n+   - wget http://www.tcts.fpms.ac.be/synthesis/mbrola/dba/en1/en1-980910.zip\n\
    +   - unzip en1-980910.zip\n+   - sudo cp en1/en1 /usr/share/mbrola/voices\n+\
    \   - wget http://www.tcts.fpms.ac.be/synthesis/mbrola/bin/raspberrypi/mbrola.tgz\n\
    +   - tar zxvf mbrola.tgz\n+   - sudo mv mbrola /usr/local/bin/\n\n# 15 Create\
    \ speech script\n\nNavit supports speech by running an external script and passing\
    \ the text to speak as an argument. Create one using:\n\n+   - cd /home/pi/.navit\n\
    +   - wget http://liamfraser.co.uk/lud/carpi/chime.wav\n+   - touch speech.sh\n\
    +   - chmod +x speech.sh\n\nNow edit speech.sh:\n\n```\n#!/bin/bash\naplay -r\
    \ 44100 /home/pi/.navit/chime.wav\nespeak -vmb-en1 -s 110 -a 150 -p 50 \"$1\"\n\
    ```\n\nFinally, test it with:\n\n+   - ./speech.sh “Hello World”\n\n# Full code\
    \ listing\n\n```\ntry:\n    r = requests.get(api_req)\nexcept requests.exceptions.RequestException\
    \ as e:\n    return errstr\n\nreturn WeatherClient.usefuldata(r.json())\n\nclass\
    \ CarLauncher:\n    def __init__(self):\n        pygame.init()\n        pygame.mixer.quit()\
    \ # Don't need sound\n        screen_info = pygame.display.Info()\n        self.screen\
    \ = pygame.display.set_mode((screen_info.current_w,\n                        \
    \                       screen_info.current_h))\n        pygame.display.set_caption('Car\
    \ Launcher')\n        self.titlefont = pygame.font.Font(None, 100)\n        self.wfont\
    \ = pygame.font.Font(None, 30)\n        self.w_text = None # Weather Text\n\n\
    \    def clean_background(self):\n        background = pygame.Surface(self.screen.get_size())\n\
    \        self.background = background.convert()\n        self.background.fill((0,\
    \ 0, 0))\n\n        # Render title centered\n        text = self.titlefont.render(\"\
    CarPi Launcher\", 1, (255, 255, 255))\n        textpos = text.get_rect()\n   \
    \     textpos.centerx = self.background.get_rect().centerx\n        self.background.blit(text,\
    \ textpos)\n\n        self.screen.blit(self.background, (0,0))\n        pygame.display.flip()\n\
    \n    def main_menu(self):\n        # btns maps Text -> Rectangles we can do collision\
    \ detection on\n        self.btns = {'Music' : None, 'NAV' : None, 'Weather' :\
    \ None}\n\n        item_num = 1\n        for key in self.btns:\n            text\
    \ = self.titlefont.render(key, 1, (255,255,255))\n            textpos = text.get_rect()\n\
    \            max_width = self.background.get_rect().width / len(self.btns)\n \
    \           center_offset = max_width * 0.5\n            # This maps btns buttons\
    \ just below the title\n            textpos.centery = self.background.get_rect().centery\
    \ / 2\n            textpos.centerx = (max_width * item_num) - center_offset\n\
    \            self.btns[key] = textpos\n            self.screen.blit(text, textpos)\n\
    \            item_num += 1\n\n        pygame.display.flip()\n\n    def select_rect(self,\
    \ rect, text):\n        # Colour red to green when clicked in green\n        surface\
    \ = pygame.Surface((rect.w, rect.h))\n        surface.fill((0, 255, 0))\n    \
    \    # Now we have to draw the text over it again\n        t = self.titlefont.render(text,\
    \ 1, (255,255,255))\n        surface.blit(t, (0,0))\n        self.screen.blit(surface,\
    \ rect)\n        pygame.display.flip()\n```"
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Use Python with Pi


    ![](img/3b256f430f51c98f1315671f6e4eec19_171_0.png)


    Above The Navit software comes with a host of options built into its menu hierarchy


    ![](img/3b256f430f51c98f1315671f6e4eec19_171_1.png)


    Above The pympdtouchgui front-end for the music player is surprisingly featureful


    # You will need to write your own launcher for CarPi


    ![](img/3b256f430f51c98f1315671f6e4eec19_171_2.png)


    # Make it mobile


    It is definitely best to put this project together in a clean workspace so that
    you can clearly see what you’re working with and ensure everything is correctly
    wired and soldered, but the point of the project is to make this setup portable
    so that you can put it in your car and use it on the road. You could install everything
    into a single, hand-made enclosure or customise a large bought one, or you could
    secure the various parts inside, for example, your glovebox or car doors. You’ll
    also need to power both the screen and your Pi with a power pack and ensure that
    the GPS antenna is fastened into a good spot for signal.


    # 16 Configure Navit for speech


    The last part is simple. Edit the Navit config file again (//etc/navit/navit.xml)
    and replace the following line:


    ```

    <speech type="cmdline" data="echo ''Fix the speech tag in navit.xml to let navit
    say: %s'' cps="15" />


    ...with:


    <speech type="cmdline" data="/home/pi/.navit/speech.sh %s" cps="10" />

    ```


    Now you can run Navit with DISPLAY=:0.0 navit and have fun experimenting.


    # 17 Install the music player


    MPD is the music player back-end and pympdotouchgui is the front-end that needs
    installing manually:


    ```

    sudo apt-get install mpd ncmpcpp

    wget http://www.spida.net/projects/software/pympdotouchgui/pympdotouchgui-0.320.tgz

    tar zxvf pympdotouchgui-0.320.tgz

    cd pympdotouchgui-0.320/

    sudo python setup.py install

    # Fix hard coded path in software

    sudo ln -s /usr/local/share/pympdotouchgui/ /usr/share/pympdotouchgui

    ```


    # 18 Copy music


    Scp (secure copy protocol) was used here to copy music. First get the Pi’s IP
    address by running ip addr. Then


    run sudo passwd to set a password for root. From a computer with music on, run:


    ```

    scp -r music_folder root@pi_ip_address:/var/lib/mpd/music/

    ```


    Then on the Pi, change the ownership of the music that you just copied:


    ```

    sudo chown -R mpd:audio /var/lib/mpd/music

    ```


    # 19 Update mpd music library


    Ncmpcpp is a command line client for mpd. Type ncmpcpp and press U to update the
    library. Press 3 to browse the library and check the music is there, and press
    Q to quit. Pressing 1 will select the help screen if you want to do more.


    # 20 Install awesome window manager


    Now you will need to write your own launcher for CarPi, which will full-screen.
    To ensure every application is forced to full-screen, use awesome window manager
    in full-screen mode.


    ```

    sudo apt-get install awesome

    sudo rm /etc/alternatives/x-session-manager

    sudo ln -s /usr/bin/awesome /etc/alternatives/x-session-manager

    ```


    When changing the default x-session-manager, awesome will auto-started at boot
    instead of LXDE. If you reboot the Pi, awesome should then load up automatically.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# 21 Install the requirements for your launcher\n\nThe launcher is going to\
    \ use a weather API combined with location data from the GPS receiver to give\
    \ weather updates when requested. The nicest HTTP API for Python is requests,\
    \ which you can install by doing the following:\n\n```\nsudo apt-get install python-pip\n\
    sudo pip install requests\n```\n\n# 22 Write the launcher code\n\nCreating the\
    \ code itself is pretty self explanatory, but you can use our ready-made version\
    \ by downloading the CarPi package from FileSilo.co.uk and extracting carlauncher/carlauncher.py.\n\
    \n![](img/3b256f430f51c98f1315671f6e4eec19_172_0.png)\n\n# 23 Start the launcher\
    \ automatically\n\nSudo-edit /etc/xdg/awesome/rc.lua and move awful.layout.suit.max.fullscreen\
    \ to the top of the layouts list. Add the following to the bottom of the file:\n\
    \n```\nawful.util.spawn_with_shell(\"/home/pi/carlauncher/carlauncher.py\")\n\
    ```\n\nNow reboot again and the launcher should come up automatically.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_172_1.png)\n\
    \n# 24 Future improvements\n\nThere are a number of improvements that could be\
    \ made to the base project at this point:\n\n+   - Make the launcher switch between\
    \ applications rather than start them again each time\n+   - Make the launcher\
    \ look better aesthetically with icons\n+   - Use Mopidy instead of MPD so you\
    \ can use Spotify\n+   - Further Navit configuration to make it more featureful\n\
    +   - An SSD or USB flash drive for storage to make things quicker\n\n# Full code\
    \ listing\n\n```\ndef reset(self):\n    self.clean_background()\n    self.main_menu()\n\
    \    self.render_weather()\n\ndef execute(self, path):\n    os.system(path)\n\
    \    # os.system blocks so by the time we get here application\n    # has finished\n\
    \    self.reset()\n\ndef render_weather(self):\n    if self.w_text == None:\n\
    \        return\n    # Get y starting at the bottom of the nav button\n    margin\
    \ = 10\n    y = self.btns['NAV'].bottomleft[1] + margin\n    for t in self.w_text.split(\"\
    \\n\"):\n        line = self.wfont.render(t.rstrip(), 1, (255,255,255))\n    \
    \    line_rect = line.get_rect()\n        line_rect.centerx = self.background.get_rect().centerx\n\
    \        line_rect.y = y\n        self.screen.blit(line, line_rect)\n        y\
    \ += margin + line_rect.height\n    pygame.display.flip()\n\ndef handle_events(self,\
    \ events):\n    for e in events:\n        if e.type == QUIT:\n            sys.exit(0)\n\
    \        elif e.type == MOUSEBUTTONDOWN:\n            pos = pygame.mouse.get_pos()\n\
    \            # Check if it collides with any of the buttons\n            for btn_text,\
    \ rect in self.btns.items():\n                if self.select_rect(rect, btn_text)\n\
    \                    if btn_text == \"NAV\":\n                        self.execute(\"\
    /usr/bin/navit\")\n                    elif btn_text == \"Music\":\n         \
    \               self.execute(\"/usr/local/bin/pympd touchgui\")\n            \
    \        elif btn_text == \"Weather\":\n                        self.w_text =\
    \ WeatherClient.update()\n                        # Reset will render weather\
    \ if string is populated\n                        self.reset()\n\ndef loop(self):\n\
    \    clock = pygame.time.Clock()\n    self.reset()\n    while 1:\n        self.handle_events(pygame.event.get())\n\
    \        # 5 fps is plenty\n        clock.tick(5)\n\nif __name__ == \"__main__\"\
    :\n    cl = CarLauncher()\n    cl.loop()\n```"
  merge: -1
  img_proc: true
