- pgno: 81
  md: "# Work with Python\n\nSimilarly for Vimeo:\n\n```\ndef getVimeoUrl(id):\n \
    \   url = \"plugin://video.vimeo/?path=/root/video&action=play_video&videoids=\"\
    \ + id\n    return url\n```\n\nAnd for Dailymotion:\n\n```\ndef getDailyMotionUrl(id):\n\
    \    url = \"plugin://video.dailymotion_com/?url=\" + id + \"&mode=playVideo\"\
    \n    return url\n```\n\nOnce we have the video URL resolved into the respective\
    \ plug-in, playing it is very simple:\n\n```\ndef playVideo(url):\n    listitem\
    \ = xbmcgui.ListItem(path=url)\n    xbmcplugin.setResolvedUrl(pluginHandle, True,\
    \ listitem)\n```\n\n# 13 Populating plug-in content listing\n\nxbmcplugin contains\
    \ various routines for handling the content listing inside the plug-ins UI. The\
    \ first step is to create directory entries which can be selected from the XBMC\
    \ UI. For this we will use a function called xbmcplugin.addDirectoryItem.\n\n\
    For our convenience we will be abstracting addDirectoryItem to suit it to our\
    \ purpose, so that we can set name, URL, mode, icon image and type easily.\n\n\
    ```\ndef addDir(name, url, mode, iconimage, type=\"\"):\n    u = sys.argv[0]+\"\
    ?url=\"+urllib.quote_plus(url)+\"&mode=\"+str(mode)+\"&type=\"+str(type)\n   \
    \ ok = True\n    liz = xbmcgui.ListItem(name, iconImage=\"DefaultVideo.png\",\
    \ thumbnailImage=iconimage)\n    liz.setInfo(type=\"video\", infoLabels={\"Title\"\
    : name})\n    ok = xbmcplugin.addDirectoryItem(handle=int(sys.argv[1]), url=u,\
    \ listitem=liz, isFolder=True)\n    return ok\n```\n\nOn the same lines, we can\
    \ build a function to place links as well...\n\n```\ndef addLink(name, url, mode,\
    \ iconimage, description, date):\n    u = sys.argv[0]+\"?url=\"+urllib.quote_plus(url)+\"\
    &mode=\"+str(mode)\n    ok = True\n    liz = xbmcgui.ListItem(name, iconImage=\"\
    DefaultVideo.png\", thumbnailImage=iconimage)\n    liz.setInfo(type=\"video\"\
    , infoLabels={\"Title\": name, \"Plot\": description, \"Aired\": date})\n    liz.setProperty('IsPlayable',\
    \ 'true')\n    ok = xbmcplugin.addDirectoryItem(handle=int(sys.argv[1]), url=u,\
    \ listitem=liz)\n    return ok\n```\n\nBased on the abstractions we have just\
    \ created, we can create the base functions which will populate the content. But\
    \ before we do that, let's first understand how Reddit works. Most of the Reddit\
    \ content filters are provided through something called Subreddits. This allows\
    \ you to view discussions related to a particular topic. In our plug-in we are\
    \ interested in showing videos; we also want to show trailers, documentaries etc.\
    \ We access these using Subreddits. For example, for trailers it would be reddit.com/r/trailers.\
    \ For domains we can use /domain/: for example, to get all the Youtube videos\
    \ posted on Reddit, we will call reddit.com/domain/youtube.com. Now you may ask\
    \ what is the guarantee that this Subreddit will only list videos? The answer\
    \ is that it may not. For that reason we scrape the site ourselves to find videos.\
    \ More on this in the next step.\n\nThe first base function we'll define is index().\
    \ This is called when the user starts the plug-in.\n\n```\ndef index():\n    defaultEntries\
    \ = [\"videos\", \"trailers\", \"documentaries\", \"music\"]\n    entries = defaultEntries[:]\n\
    \    if os.path.exists(subredditsFile):\n        fh = open(subredditsFile, 'r')\n\
    \        content = fh.read()\n        fh.close()\n        spl = content.split('\\\
    n')\n        for i in range(0, len(spl)):\n            if spl[i]:\n          \
    \      subreddit = spl[i]\n                append(subreddit)\n               \
    \ entries.sort()\n                for entry in entries:\n                    if\
    \ entry in defaultEntries:\n                        addDir(entry.title(), \"r/\"\
    +entry, 'listSorting', '')\n                    else:\n                      \
    \  addDir(entry.title(), \"r/\"+entry, 'listSorting', '')\n                  \
    \  addDir('[ Vimeo.com ]', \"domain/vimeo.com\", 'listSorting', '')\n        \
    \            addDir('[ Youtube.be ]', \"domain/youtube.be\", 'listSorting', '')\n\
    \                    addDir('[ Youtube.com ]', \"domain/youtube.com\", 'listSorting',\
    \ '')\n                    addDir('[ Dailymotion.com ]', \"domain/dailymotion.com\"\
    , 'listSorting', '')\n                    addDir('[B]\"+translation(30001)+\"\"\
    -[B]\", \"\", \"addSubreddit\", '')\n                    xbmcplugin.endOfDirectory(pluginHandle)\n\
    ```\n\nHere, the penultimate entry makes a call to addSubreddit. listSorting takes\
    \ care of sorting out the data based on criteria such as Hot, New etc. It also\
    \ calls in Reddit's JSON function, which returns nice easy-to-parse JSON data.\n\
    \nWe have created a settings entry for all the sorting criteria. Based on what\
    \ is set, we go ahead and build out the sorted list.\n\n```\ndef listSorting(subreddit):\n\
    \    if cat_hot:\n        addDir(translation(30002), urlMain+\"/subreddit/\"+subreddit+\"\
    /hot/\", jsonLimit=100, 'listVideos', '')\n    if cat_new:\n        addDir(translation(30003),\
    \ urlMain+\"/subreddit/\"+subreddit+\"/new/\", jsonLimit=100, 'listVideos', '')\n\
    \    if cat_top_d:\n        addDir(translation(30007)+\":\", urlMain+\"/\"+subreddit+\"\
    /top/\", jsonLimit=100&day, 'listVideos', '')\n        xbmcplugin.endOfDirectory(pluginHandle)\n\
