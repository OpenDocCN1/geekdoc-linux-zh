- pgno: 20
  md: '# 34 Files


    When dealing with files, you need to create a file object to interact with it.
    The file command takes a string with the file name and location and creates a
    file object instance. You can then call the file object methods like ''open'',
    ''read'' and ''close'', to get data out of the file. If you are doing file processing,
    you can also use the ''readline'' method. When opening a file, there is an explicit
    ''open()'' command to simplify the process. It takes a string with the file name,
    and an optional parameter that is a string which defines the mode. The default
    is to open the file as read-only (''r''). You can also open it for writing (''w'')
    and appending (''a''). After opening the file, a file object is returned so that
    you can further interact with it. You can then read it, write to it, and finally
    close it.


    # 35 Yielding


    In many cases, a function may need to yield the context of execution to some other
    function. This is the case with generators. The preferred method for a generator
    is that it will only calculate the next value when it is requested through the
    method ''next()''. The command ''yield'' saves the current state of the generator
    function, and return execution control to the calling function. In this way, the
    saved state of the generator is reloaded and the generator picks up where it left
    off in order to calculate the next requested value. In this way, you only need
    to have enough memory available to store the bare minimum to calculate the next
    needed value, rather than having to store all of the possible values in memory
    all at once.


    # 36 Weak references


    You sometimes need to have a reference to an object, but still be able to destroy
    it if needed. A weak reference is one which can be ignored by the garbage collector.
    If the only references left to an object are weak references, then the garbage
    collector is allowed to destroy that object and reclaim the space for other uses.
    This is useful in cases where you have caches or mappings of large datasets that
    don''t necessarily have to stay in memory. If an object that is weakly referenced
    ends up being destroyed and you try to access it, it will appear as a None. You
    can test for this condition and then reload the data if you decide that this is
    a necessary step.


    # 37 Pickling data


    There are a few different ways of serialising memory when you need to checkpoint
    results to disk. One of these is called pickling. Pickle is actually a complete
    module, not just a single command. To store data on to the hard drive, you can
    use the dump method to write the data out. When you want to reload the same data
    at some other point in the future, you can use the load method to read the data
    in and unpickle it. One issue with pickle is its speed, or lack of it. There is
    a second module, cPickle, that provides the same basic functionality. But, since
    it is written in C, it can be as much as 1000 times faster. One thing to be aware
    of is that pickle does not store any class information for an object, but only
    its instance information. This means that when you unpickle the object, it may
    have different methods and attributes if the class definition has changed in the
    interim.


    # 38 Shelving data


    While pickling allows you save data and reload it, sometimes you need more structured
    object permanence in your Python session. With the shelve module, you can create
    an object store where essentially anything that can be pickled can be stored there.
    The backend of the storage on the drive can be handled by one of several systems,
    such as dbm or gdbm. Once you have opened a shelf, you can read and write to it
    using key value pairs. When you are done, you need to be sure to explicitly close
    the shelf so that it is synchronised with the file storage. Because of the way
    the data may be stored in the backing database, it is best not to open the relevant
    files outside of the shelf module in Python. You can also open the shelf with
    writeback set to True. If so, you can explicitly call the sync method to write
    out cached changes.


    # 39 Threads


    You can do multiple threads of execution within Python. The ''thread()'' command
    can create a new thread of execution for you. It follows the same techniques as
    those for POSIX threads. When you first create a thread, you need to hand in a
    function name, along with whatever parameters said function needs. One thing to
    keep in mind is that these threads behave just like POSIX threads. This means
    that almost everything is the responsibility of the programmer. You need to handle
    mutex locks (with the methods ''acquire'' and ''release''), as well as create
    the original mutexes with the method ''allocate_lock''. When you are done, you
    need to ''exit'' the thread to ensure that it is properly cleaned up and no resources
    get left behind. You also have fine-grained control over the threads, being able
    to set things like the stack size for new threads.


    ![](img/3b256f430f51c98f1315671f6e4eec19_20_0.png)


    ![](img/3b256f430f51c98f1315671f6e4eec19_20_1.png)


    ![](img/3b256f430f51c98f1315671f6e4eec19_20_2.png)


