- pgno: 13
  md: "# Get started with Python\n\n# TIP\n\nYou can define defaults for variables\
    \ if you want to be able to call the function without passing any variables through\
    \ at all. You do this by putting an equals sign after the variable name. For example,\
    \ you can do:\ndef modify_string(original: \"Default string\")\n\n```\n# Or with\
    \ a while loop:\nprint(\"Using a while loop\")\n# We already have the total above,\
    \ but knowing the len function is very useful\ntotal = len(ints)\ncount = 0\n\
    while count < total:\n    print(str(ints[count]))\n    count += 1\n```\n\n# Functions\
    \ and variable scope\n\nFunctions are used in programming to break processes down\
    \ into smaller chunks. This often makes code much easier to read. Functions can\
    \ also be reusable if designed in a certain way. Functions can have variables\
    \ passed to them. Variables in Python are always passed by value, which means\
    \ that a copy of the variable is passed to the function that is only valid in\
    \ the scope of the function. Any changes made to the original variable inside\
    \ the function will be discarded. However, functions can also return values, so\
    \ this isn’t an issue. Functions are defined with the keyword def, followed by\
    \ the name of the function. Any variables that can be passed through are put in\
    \ brackets following the function’s name. Multiple variables are separated by\
    \ commas. The names given to the variables in these brackets are the ones\n\n\
    that they will have in the scope of the function, regardless of what the variable\
    \ that’s passed to the function is called. Let’s see this in action.\n\nThe output\
    \ from the program opposite is as follows:\n\n> “Functions are used in programming\
    \ to break processes down in”\n\n```\n#!/usr/bin/env python2\n\n# Below is a function\
    \ called modify_string, which accepts a variable\n# that will be called original\
    \ in the scope of the function. Anything\n# indented with 4 spaces under the function\
    \ definition is in the\n# scope.\ndef modify_string(original):\n    original +=\
    \ \" that has been modified.\"\n    # At the moment, only the local copy of this\
    \ string has been modified\n\ndef modify_string_return(original):\n    original\
    \ += \" that has been modified.\"\n    # However, we can return our local copy\
    \ to the caller. The function\n    # ends as soon as the return statement is used,\
    \ regardless of where it\n    # is in the function.\n    return original\n\ntest_string\
    \ = \"This is a test string\"\nmodify_string(test_string)\nprint(test_string)\n\
    \ntest_string = modify_string_return(test_string)\nprint(test_string)\n\n# The\
    \ function's return value is stored in the variable test string,\n# overwriting\
    \ the original and therefore changing the value that is\n# printed.\n```\n\nWe\
    \ are now outside of the scope of the modify_string function, as we have reduced\
    \ the level of indentation\n\nThe test string won't be changed in this code\n\n\
    However, we can call the function like this"
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Get started with Python\n\n```\n[liam@liam-laptop Python]$ ./functions_and_scope.py\n\
    This is a test string\nThis is a test string that has been modified.\n```\n\n\
    Scope is an important thing to get the hang of, otherwise it can get you into\
    \ some bad habits. Let’s write a quick program to demonstrate this. It’s going\
    \ to have a Boolean variable called cont, which will decide if a number will be\
    \ assigned to a variable in an if statement. However, the variable hasn’t been\
    \ defined anywhere apart from in the scope of the if statement. We’ll finish off\
    \ by trying to print the variable.\n\n```\n#!/usr/bin/env python2\ncont = False\n\
    if cont:\n    var = 1234\nprint(var)\n```\n\nIn the section of code above, Python\
    \ will convert the integer to a string before printing it. However, it’s always\
    \ a good idea to explicitly convert things to strings – especially when it comes\
    \ to concatenating strings together. If you try to use the + operator on a string\
    \ and an integer, there will be an error because it’s not explicitly clear what\
    \ needs to happen. The + operator would usually add two integers together. Having\
    \ said that, Python’s string formatter that we demonstrated earlier is a cleaner\
    \ way of doing that. Can you see the problem? Var has only been defined in the\
    \ scope of the if statement. This means that we get a very nasty error when we\
    \ try to access var.\n\n```\n[liam@liam-laptop Python]$ ./scope.py\nTraceback\
    \ (most recent call last):\n  File \"./scope.py\", line 8, in <module>\n    print\
    \ var\nNameError: name 'var' is not defined\n```\n\nIf cont is set to True, then\
    \ the variable will be created and we can access it just fine. However, this is\
    \ a bad way to do things. The correct way is to initialise the variable outside\
    \ of the scope of the if statement.\n\n```\n#!/usr/bin/env python2\ncont = False\n\
    var = 0\nif cont:\n    var = 1234\nif var != 0:\n    print(var)\n```\n\nThe variable\
    \ var is defined in a wider scope than the if statement, and can still be accessed\
    \ by the if statement. Any changes made to var inside the if statement are changing\
    \ the variable defined in the larger scope. This example doesn’t really do anything\
    \ useful apart from illustrate the potential problem, but the worst-case scenario\
    \ has gone from the program crashing to printing a zero. Even that doesn’t happen\
    \ because we’ve added an extra construct to test the value of var before printing\
    \ it.\n\n# Coding style\n\nIt’s worth taking a little time to talk about coding\
    \ style. It’s simple to write tidy code. The key is consistency. For example,\
    \ you should always name your variables in the same manner. It doesn’t matter\
    \ if you want to use camelCase or use underscores as we have. One crucial thing\
    \ is to use self-documenting identifiers for variables. You shouldn’t have to\
    \ guess\n\n# Comparison operators\n\nThe common comparison operators available\
    \ in Python include:\n\n| | |\n|---|---|\n| < | strictly less than |\n| <= | less\
    \ than or equal |\n| > | strictly greater than |\n| >= | greater than or equal\
    \ |\n| == | equal |\n| != | not equal |\n\nwhat a variable does. The other thing\
    \ that goes with this is to always comment your code. This will help anyone else\
    \ who reads your code, and yourself in the future. It’s also useful to put a brief\
    \ summary at the top of a code file describing what the application does, or a\
    \ part of the application if it’s made up of multiple files.\n\n# Summary\n\n\
    This article should have introduced you to the basics of programming in Python.\
    \ Hopefully you are getting used to the syntax, indentation and general look and\
    \ feel of a Python program. The next step is to learn how to come up with a problem\
    \ that you want to solve, and break it down into small enough steps that you can\
    \ implement in a programming language.\n\nGoogle, or any other search engine,\
    \ is very helpful. If you are stuck with anything, or have an error message you\
    \ can’t work out how to fix, stick it into Google and you should be a lot closer\
    \ to solving your problem. For example, if we Google ‘play mp3 file with python’,\
    \ the first link takes us to a Stack Overflow thread with a bunch of useful replies.\
    \ Don’t be afraid to get stuck in – the real fun of programming is solving problems\
    \ one manageable chunk at a time.\n\nHappy programming!\n\n![](img/3b256f430f51c98f1315671f6e4eec19_14_0.png)"
