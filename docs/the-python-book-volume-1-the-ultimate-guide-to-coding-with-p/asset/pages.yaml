  md: "![](img/3b256f430f51c98f1315671f6e4eec19_130_0.png)\n\nbegin. The getattr allows\
    \ us to use the string/integer associated with our place in the story and call\
    \ upon the relevant scene function from the script file. We then use an if statement\
    \ with an iterative function to successively add screen element to give the illusion\
    \ that it’s building up the first screen. We finish it by advancing the progression\
    \ value.\n\n```\ndef game():\n    global game_running\n    while game_running\
    \ == True:\n        menu_screen()\n\ngame()\n```\n\n# The code here is very expandable,\
    \ allowing you to add decisions that take you to different scenes\n\n# 14 Add\
    \ variables and assets\n\nSimilarly to the way that our original startup code\
    \ works, our next if statement and iteration checks to see what is different on\
    \ the next line, and if it moves to a different scene function. It will also change\
    \ anything that is different without filling up the buffer more than needed. Where\
    \ we’ve made no change is labelled with a 0 in the scripts.\n\n# 15 The starting\
    \ function\n\nWe finish our code bit with a simple function that starts off the\
    \ entire game. This is just to encapsulate the entire code and allows us to add\
    \ different ways of turning it off in the future. IDLE when running the file will\
    \ load everything up and then run the game() function at the end – this is similar\
    \ to how you can add a __main__ function at the end which will start the code\
    \ in the command line.\n\n# 16 Expand your code\n\nThe code written is very expandable,\
    \ allowing you to add decisions that are logged to take you to different scenes\
    \ (or routes in visual novel terminology) and make your game feel more interactive.\
    \ This would not require much more code than the if statements, and it would also\
    \ be a good way for you to look into adding graphical buttons to click and use\
    \ the collide function.\n\n# 17 Move the assets\n\nCurrently the code has the\
    \ script-specific assets in the main visualnovel file. These can be moved to the\
    \ script, allowing you to make the visualnovel file much more modular so that\
    \ you can have multiple scripts with different assets to load at startup."
