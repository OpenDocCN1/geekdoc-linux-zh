  md: "# Create with Python\n\n# 07 How the script relates\n\nOn our game, the code\
    \ pulls in elements from the script file as it goes. We’ll explain how that works\
    \ later, but this also allows us to implement decisions later on to change which\
    \ direction the game might take you in.\n\n```\nimport pygame, time, script\n\
    pygame.init()\n```\n\n# 08 Starting the main game\n\nWe don’t need many modules\
    \ for the current state of the visual novel. Here we’ve imported the new pygame\
    \ module, our script as a module and the time module for aesthetic reasons – we’re\
    \ going to have the code pause in bits rather than just instantly change scenes\
    \ to the next line. We also initialise Pygame with a simple pygame.init()\n\n\
    # 09 Add variables and assets\n\nWe add a mixture of information we need to run\
    \ the novel. We define the size of the display screen to use (1000 pixels wide\
    \ and 563 high), along with some RGB colours for the code to use. We’re also telling\
    \ Pygame what font to use and how large for certain sections and also loading\
    \ images for the game.\n\n# 10 Start the game\n\nCreate a display for the game.\
    \ Pygame works by constantly updating the display with new information. To show\
    \ how this works, the menu function adds elements to the display (which we’ve\
    \ titled screen), such as filling it with colour, adding shapes and using blit\
    \ to add images or in this case text. Once you’ve created a buffer of changes\
    \ to the screen, you update it with the flip() function.\n\n# 11 See the mouse\n\
    \nAs we’ve created the button as a rectangle and now an image on the menu, we\
    \ need to recognise when the mouse is hovering over it to know when the button\
    \ is clicked. First\n\n# 12 Start the story\n\nOur start_game function is called\
    \ when the mouse clicks the right position and we prepare the game, getting the\
    \ characters, locations and progression through the game script. The rest of this\
    \ function uses this info to pull in data from the script to make the game flow\
    \ properly.\n\n# 13 First screen\n\nThe first screen is handled differently, and\
    \ acts to get every element up on the interface before we continue – it makes\
    \ the code take a little less time to process as we\n\n```\ndef start_game():\n\
    \    get_button = pygame.Rect(location, character)\n    turn = 0\n    game_state\
    \ = 1\n```\n\n> “The code pulls in elements from the script file as it goes, allowing\
    \ us to implement decisions later on”\n\n```\nelif turn > 0 and clicked_state[0]\
    \ == 1:\n    line_start = 0\n    for i in range (4):\n        if line_start ==\
    \ 0 and line[0] != '0':\n            print line[0]\n            screen.blit(character[location[line[0]]],\
    \ [0, 0])\n            time.sleep(1)\n        elif line_start == 1 and line[1]\
    \ != '0':\n            screen.blit(character[line[1]], [377, 113])\n         \
    \   time.sleep(1)\n        elif line_start == 2:\n            pygame.draw.rect(screen,\
    \ (grey), pygame.Rect(130, 423, 740, 120))\n        elif line_start == 3:\n  \
    \          screen.blit(game_font.render(line[2], 1, white), (135, 430))\n    \
    \        turn += 1\n            if line[3] != '0':\n                game_script\
    \ = line[3]\n                time.sleep(0.5)\n            game_state = line[4]\n\
    \            clicked = 0\n        line_start += 1\n        pygame.display.flip()\n\
    ```"
