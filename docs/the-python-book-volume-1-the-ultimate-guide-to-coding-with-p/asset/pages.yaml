  md: "![](img/3b256f430f51c98f1315671f6e4eec19_108_0.png)\n\nA tic-tac-toe grid now\
    \ accepting input, adding a O or X alternately\n\n# Kivy comes with all the tools\
    \ needed to use kv language\n\nAs before, this syntax defines a rule for how a\
    \ 'GridEntry' widget should be constructed, this time setting the 'font_size'\
    \ property that controls the size of the text in the button's label. The extra\
    \ magic is that kv language automatically detects that we've referenced the Button's\
    \ own height and will create a binding to update this relationship - when a 'GridEntry'\
    \ widget's height changes, its 'font_size' will change so the text fits perfectly.\
    \ We could have made these bindings straight from Python (another usage of the\
    \ 'bind' method used later on), but that's rarely as convenient as referencing\
    \ the property we want to bind to.\n\nLet's now populate our 'TicTacToeGrid' with\
    \ 'GridEntry' widgets (Fig.01). This introduces a few new concepts: When we instantiated\
    \ our 'GridEntry' widgets, we were able to set their 'coords' property by simply\
    \ passing it in as a kwarg. This is a minor feature that is automatically handled\
    \ by Kivy properties.\n\nWe used the 'bind' method to call the grid's 'button_pressed'\
    \ method whenever the 'GridEntry' widget dispatches an 'on_release' event. This\
    \ is automatically handled by its 'Button' superclass, and will occur whenever\
    \ a user presses, then releases a 'GridEntry' button. We could also bind to 'on_press',\
    \ which is dispatched when the button is first clicked, or to any Kivy property\
    \ of the button, which is dispatched dynamically whenever the property is modified.\n\
    \nWe added each 'GridEntry' widget to our 'Grid' via the 'add_widget' method.\
    \ That means each one is a child widget of the 'TicTacToeGrid', and so it will\
    \ display them and knows it should automatically arrange them into a grid with\
    \ the number of columns we set earlier.\n\nautomatically arrange any child widgets\
    \ to fit nicely with as many rows as necessary. Tic-tac-toe requires three columns\
    \ and nine children.\n\nHere we introduce the Kivy language (kv), a special domain-specific\
    \ language for making rules describing Kivy widget trees. It's very simple but\
    \ removes a lot of necessary boilerplate for manipulating the GUI with Python\
    \ code - as a loose analogy you might think of it as the HTML/CSS to Python's\
    \ JavaScript. Python gives us the dynamic power to do anything, but all that power\
    \ gets in the way if we just want to declare the basic structure of our GUI. Note\
    \ that you never need kv language, you can always do the same thing in Python\
    \ alone, but the rest of the example may show why Kivy programmers usually like\
    \ to use kv.\n\nKivy comes with all the tools needed to use kv language; the simplest\
    \ way is to write it in a file with a name based on our App class. That is, we\
    \ should place the following in a file named 'tictactoe.kv':\n\n```\n<TicTacToeGrid>:\n\
    \    cols: 3  # Number of columns\n```\n\nThis is the basic syntax of kv language:\
    \ for each widget type you may write a rule defining its behaviour, including\
    \ setting its properties and adding child widgets. This example demonstrates the\
    \ former, creating a rule for the 'TicTacToeGrid' widget by declaring that every\
    \ 'TicTacToeGrid' instantiated should have its 'cols' property set to 3.\n\nWe'll\
    \ use some more kv language features later, but for now let's go back to Python\
    \ to create the buttons that will be the entries in our tic-tac-toe grid.\n\n\
    ```\nfrom kivy.uix.button import Button\nfrom kivy.properties import ListProperty\n\
    ```\n\n```\nclass GridEntry(Button):\n    coords = ListProperty([0, 0])\n```\n\
    \nThis inherits from Kivy's 'Button' widget, which interacts with mouse or touch\
    \ input, dispatching events when interactions touch it. We can hook into these\
    \ events to call our own functions when a user presses the button, and can set\
    \ the button's 'text' property to display the 'X' or 'O'. We also created a new\
    \ Kivy property for our widget, 'coords' - we'll show how this is useful later\
    \ on. It's almost identical to making a normal Python attribute by writing 'self.coords\
    \ = [0,0]' in GridEntry.__init__.\n\n```\n<GridEntry>:\n    font_size: self.height\n\
    ```"
