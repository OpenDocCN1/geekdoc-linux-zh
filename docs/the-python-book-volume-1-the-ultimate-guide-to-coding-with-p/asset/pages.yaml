  md: "# Programming in Python on the Raspberry Pi\n\nLearn the basics of programming\
    \ in Python with the Raspberry Pi, laying the foundations for all your future\
    \ projects\n\nIt's good practice to describe what the program's purpose is at\
    \ the top of the file. This will help you out when working on larger projects\
    \ with multiple files\n\nIt's important to think about data types. We convert\
    \ the number to decimal to make sure that we don't lose any decimal numbers during\
    \ arithmetic\n\n```\n#!/usr/bin/env python\n# An advanced Hello World program\
    \ that will demonstrate the basics of programming in Python via a series of examples.\
    \ Created by Liam Fraser\n# 2012\n\n# Import the sys library for the sys.exit\
    \ function\nimport sys\n# Import everything from the Decimal library\nfrom decimal\
    \ import *\n\n# Ask the user for their name and output a welcome message\nfirstname\
    \ = input(\"Please enter your first name: \")\nprint(\"Welcome \" + firstname\
    \ + \"!\")\n\n# Ask the user for a number, double it and halve it\nnumber = input(\"\
    Please enter a number: \")\nnumber = Decimal(number)\nnumber_doubled = number\
    \ * 2\nnumber_halved = number / 2\nnumber_squared = number * number\n\n# Print\
    \ out the values we just worked out, converting each float value to a string\n\
    print(\"The result of doubling that number: \" + str(number_doubled))\nprint(\"\
    The result of halving that number: \" + str(number_halved))\nprint(\"The result\
    \ of squaring that number: \" + str(number_squared))\n\n# The stopping condition\
    \ for a while loop\nyesno = False\n# A while loop that will run until a user enters\
    \ either \"yes\" or \"no\"\nwhile yesno == False:\n    result = input(\"Continue?\
    \ (yes/no): \")\n    if result == \"yes\" or result == \"no\":\n        yesno\
    \ = True\n    else:\n        print(\"Error, please type yes or no\")\n\n# Deal\
    \ with the result\nif result == \"yes\":\n    print(\"Continuing!\")\nelse:\n\
    \    print(\"Exiting!\")\n\n# Create the count which will be a stopping condition\
    \ for a while loop\ncount = 1\n# Use a while loop to add 1 to the number and output\
    \ the value each time\nprint(\"Incrementing the number by 5x\")\nwhile count <=\
    \ 5:\n    number = number + 5\n    print(number + \" = \" + str(count) + \" *\
    \ \" + str(number))\n    count += 1\n# Finish off by printing that we are exiting\n\
    print(\"Exiting!\")\n```\n\nThe stopping condition for a while loop has to be\
    \ satisfied at some point in the code; otherwise the loop will never end!\n\n\
    The print function can only accept string data types, so we need to convert any\
    \ variables with a number data type to a string before we can print them to the\
    \ screen\n\n# Resources\n\n+   A Raspberry Pi with all necessary peripherals\n\
    +   An SD card containing the latest Debian image for the Raspberry Pi\n\nhttp://www.raspberrypi.org/downloads\n\
    \nThis tutorial follows on from the one last issue: 'Setting up the Raspberry\
    \ Pi', where we showed you how to prepare your SD card for use with the Raspberry\
    \ Pi. The beauty of using an SD card image is that the operating system is ready\
    \ to go and a development environment is already configured for us.\n\nWe'll be\
    \ using a lightweight integrated development environment (IDE) called Geany to\
    \ do our Python development. Geany provides a friendlier interface compared to\
    \ text-based editors such as nano and will make it easier to get into the swing\
    \ of things.\n\nThis tutorial will cover topics such as:\n• basic arithmetic\n\
    • comparison operators, for example 'equal to' and 'not equal to'\n• control structures,\
    \ for example loops and if statements\n\nBy the end, we'll have an advanced version\
    \ of our 'hello world' application. Let's dive straight in..."
