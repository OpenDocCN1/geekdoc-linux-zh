- pgno: 67
  md: "# Built-in modules\n\n# 19. Executing functions at the time of Python interpreter\
    \ termination\n\nYou can use 'atexit' module to execute functions at the time\
    \ of Python interpreter termination.\n\n# Example:\n\n```\ndef sum():\n    print(4+5)\n\
    def message():\n    print(\"Executing Now\")\nimport atexit\natexit.register(sum)\n\
    atexit.register(message)\n```\n\n# Output:\n\nExecuting Now\n9\n\n# 20. Converting\
    \ from integer to binary, hexadecimal and octal\n\nPython provides easy-to-use\
    \ functions – bin(), hex() and oct() – to convert from integer to binary, decimal\
    \ and octal format respectively.\n\n# Example:\n\n```\n>>> bin(24)\n'0b11000'\n\
    >>> hex(24)\n'0x18'\n>>> oct(24)\n'030'\n```\n\n# 21. Converting any charset to\
    \ UTF-8\n\nYou can use the following function to convert any charset to UTF-8.\n\
    \n```\ndata.decode(\"input_charset_here\").encode('utf-8')\n```\n\n# 22. Removing\
    \ duplicates from lists\n\nIf you want to remove duplicates from a list, just\
    \ put every element into a dict as a key (for example with 'none' as value) and\
    \ then check dict.keys().\n\n```\nfrom operator import setitem\ndef distinct(l):\n\
    \    d = {}\n    map(setitem, (d,)*len(l), l, [])\n    return d.keys()\n```\n\n\
    # 23. Do-while loops\n\nSince Python has no do-while or do-until loop constructs\
    \ (yet), you can use the following method to achieve similar results:\n\n```\n\
    while True:\n    do_something()\n    if condition():\n        break\n```\n\n#\
    \ 24. Detecting system platform\n\nTo execute platform-specific functions, it\
    \ is very useful to detect the platform on which the Python interpreter is running.\
    \ You can use 'sys.platform' to find out the current platform.\n\n# Example:\n\
    \n```\nOn Ubuntu Linux\n>>> import sys\n>>> sys.platform\n'linux2'\nOn Mac OS\
    \ X Snow Leopard\n>>> import sys\n>>> sys.platform\n'darwin'\n```\n\n# 25. Disabling\
    \ and enabling garbage collection\n\nSometimes you may want to enable or disable\
    \ the garbage collector at runtime. You can use the 'gc' module to enable or disable\
    \ the garbage collection.\n\n```\n>>> import gc\n>>> gc.enable()\n<built-in function\
    \ enable>\n>>> gc.disable()\n<built-in function disable>\n```\n\n# 26. Using C-based\
    \ modules for better performance\n\nMany Python modules ship with counterpart\
    \ C modules. Using these C modules will give a significant performance boost in\
    \ complex applications.\n\n# Example:\n\ncPickle instead of Pickle, cStringIO\
    \ instead of StringIO\n\n# 27. Calculating maximum, minimum and sum out of any\
    \ list or iterable\n\nYou can use the following built-in functions:\n\nmax: Returns\
    \ the largest element in the list.\nmin: Returns the smallest element in the list.\n\
    \n# 28. Representing fractional numbers\n\nFraction instance can be created using\
    \ the following constructor:\n\n```\nFraction([numerator [, denominator]])\n```\n\
    \n# 29. Performing math operations\n\nThe 'math' module provides a plethora of\
    \ mathematical functions. These work on integer and float numbers, except complex\
    \ numbers. For complex numbers, a separate module is used, called 'cmath'.\n\n\
    # For example:\n\n```\nmath.acos(x): Return arc cosine of x.\nmath.cos(x): Returns\
    \ cosine of x.\nmath.factorial(x): Returns x factorial.\n```\n\n# 30. Working\
    \ with arrays\n\nThe 'array' module provides an efficient way to use arrays in\
    \ your programs. The 'array' module defines the following type:\n\n```\narray[typecode\
    \ [, initializer]]\n```\n\nOnce you have created an array object, say myarray,\
    \ you can apply a bunch of methods to it. Here are a few important ones:\n\nmyarray.count(x):\
    \ Returns the number of occurrences of x in a.\nmyarray.extend(x): Appends x at\
    \ the end of the array.\nmyarray.reverse(): Reverse the order of the array.\n\n\
    # 31. Sorting items\n\nThe 'bisect' module makes it very easy to keep lists in\
    \ any possible order. You can use the following functions to order lists.\n\n\
    ```\nbisect.insort(list, item [, low [, high]])\n```\n\nInserts item into list\
    \ in sorted order. If item is already in the list, the new entry is inserted to\
    \ the right of any existing entries.\n\n```\nbisect.insort_left(list, item [,\
    \ low [, high]])\n```\n\nInserts item into list in sorted order. If item is already\
    \ in the list, the new entry is inserted to the left of any existing entries.\n\
    \nsum: This function returns the sum of all elements in the list. It accepts an\
    \ optional second argument: the value to start with when summing (defaults to\
    \ 0)."
