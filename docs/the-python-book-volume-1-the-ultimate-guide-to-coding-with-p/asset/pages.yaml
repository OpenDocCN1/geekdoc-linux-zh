  md: "# Use Python with Pi\n\n![](img/3b256f430f51c98f1315671f6e4eec19_163_0.png)\n\
    \n# Full code listing\n\n```\nStep 08\n_where->writePinLow(PINCS1);\n}\n```\n\n\
    ```\nStep 11\nvoid setData(unsigned char _which, mmapGpio* _where)\n{\n    if(_which&1)\n\
    \    {\n        _where->writePinHigh(PIND0);\n    }\n    else\n    {\n       \
    \ _where->writePinLow(PIND0);\n    }\n    if(_which&2)\n    {\n        _where->writePinHigh(PIND1);\n\
    \    }\n    else\n    {\n        _where->writePinLow(PIND1);\n    }\n```\n\n```\n\
    if(_which&4)\n{\n    _where->writePinHigh(PIND2);\n}\nelse\n{\n    _where->writePinLow(PIND2);\n\
    }\nif(_which&8)\n{\n    _where->writePinHigh(PIND3);\n}\nelse\n{\n    _where->writePinLow(PIND3);\n\
    }\nif(_which&16)\n{\n    _where->writePinHigh(PIND4);\n}\nelse\n{\n    _where->writePinLow(PIND4);\n\
    }\nif(_which&32)\n{\n    _where->writePinHigh(PIND5);\n}\nelse\n{\n    _where->writePinLow(PIND5);\n\
    }\nif(_which&64)\n{\n    _where->writePinHigh(PIND6);\n}\nelse\n{\n    _where->writePinLow(PIND6);\n\
    }\nif(_which&128)\n{\n    _where->writePinHigh(PIND7);\n```\n\n# 07 Power the\
    \ MUX\n\nCreate a convenience function taking an address ranging from zero to\
    \ 15. It is converted into pin outputs for our 3-to-8 demultiplexer. The effect\
    \ of this is that all but one of the sixteen rows is to be supplied with energy.\n\
    \n# 08 Select a row\n\nIn the 74HC244, we first disable both units and proceed\
    \ to turning on the one which is needed. This sequence prevents ghosting during\
    \ the switching process.\n\n# 09 Do the main loop\n\nThe outer part of the loop\
    \ consists of logic that manages the addressing of the individual rows. Our program\
    \ must flash the individual LED groups one after another using the building blocks\
    \ described in the next step.\n\n# 10 Complete the loop\n\nWriting out data is\
    \ accomplished in a sequence of three commands. We select the row, configure the\
    \ column and then write out the data bits that are to be displayed. A small pause\
    \ is observed in order to give the LEDs some time to 'burn into' the viewer's\
    \ eyes.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_163_1.png)\n\nAbove Digital\
    \ LED matrices like this one give you far more control over each individual 'pixel'\
    \ in the display\n\n# LED stripes\n\nTwo versions of LED strips are offered. 'Primitive'\
    \ ones are based on analogue technology, in it, an entire strip of diodes has\
    \ the colour set by the three input pins. Systems such as the mega-display shown\
    \ in the left-hand image require the use of the digital version. They are based\
    \ on the concept of the shift register. Your system inputs individual colour values\
    \ which are then pushed on along the strip."
