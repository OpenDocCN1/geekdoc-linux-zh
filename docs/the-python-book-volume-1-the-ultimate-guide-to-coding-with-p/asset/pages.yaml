    hello_list[4] += \"!\"\n# The above line is the same as\n# hello_list[4] = hello_list[4]\
    \ + \"!\"\nprint(hello_list[4])\n```\n\nThe following line creates an integer\
    \ variable called hello_int with the # value of 21. Notice how it doesn't need\
