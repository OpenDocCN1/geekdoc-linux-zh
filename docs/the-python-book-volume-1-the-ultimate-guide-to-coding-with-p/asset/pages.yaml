  md: "The number of integers we want in the list\n\nA list to store the integers\n\
    \nThese are used to keep track of how many integers we currently have\n\nIf the\
    \ above succeeds then isint will be set to true: isint=True\n\nBy now, the user\
    \ has given up or we have a list filled with integers. We can loop through these\
    \ in a couple of ways. The first is with a for loop\n\n```\n #!/usr/bin/env python2\n\
    \n# We're going to write a program that will ask the user to input an arbitrary\n\
    # number of integers, store them in a collection, and then demonstrate how the\n\
    # collection would be used with various control structures.\n\nimport sys # Used\
    \ for the sys.exit function\n\ntarget_int = raw_input(\"How many integers?\")\n\
    \n# By now, the variable target_int contains a string representation of\n# whatever\
    \ the user typed. We need to try and convert that to an integer but\n# be ready\
    \ to # deal with the error if it's not. Otherwise the program will\n# crash.\n\
    try:\n    target_int = int(target_int)\nexcept ValueError:\n    sys.exit(\"You\
    \ must enter an integer\")\n\nints = list()\ncount = 0\n\n# Keep asking for an\
    \ integer until we have the required number\nwhile count < target_int:\n    new_int\
    \ = raw_input(\"Please enter integer {}:\".format(count + 1))\n    isint = False\n\
    \    try:\n        new_int = int(new_int)\n    except:\n        print(\"You must\
    \ enter an integer\")\n\n    # Only carry on if we have an integer. If not, we'll\
    \ loop again\n    # Notice below I use ==, which is different from =. The single\
    \ equals is an\n    # assignment operator whereas the double equals is a comparison\
    \ operator.\n    if isint == True:\n        # Add the integer to the collection\n\
    \        ints.append(new_int)\n        # Increment the count by 1\n        count\
    \ += 1\n\nprint(\"Using a for loop\")\nfor value in ints:\n    print(str(value))\n\
    ```"
