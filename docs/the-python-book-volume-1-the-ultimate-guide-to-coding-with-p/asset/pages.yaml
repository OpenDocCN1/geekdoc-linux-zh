    \n26 Early finish\nIf no dice have been selected to re-roll, the list will contain\
    \ all 0s, which will then be removed. The length of this list will then also be\
    \ zero, meaning we can use that to end the game if the player hits ReRoll without\
    \ selecting any dice.\n\n27 New dice\nThis else function works roughly the same\
    \ as before. We start by getting the necessary information for how many dice to\
    \ roll, and a list to put the re-rolls. We then roll as many new dice as we need\
