  md: '# Code a game of rock, paper, scissors


    Learn how to do some basic Python coding by following our breakdown of a simple
    rock, paper, scissors game


    This tutorial will guide you through making a rock, paper, scissors game in Python.
    The code applies the lessons from the masterclass – and expands on what was included
    there – and doesn’t require any extra Python modules to run, like Pygame.


    Rock, paper, scissors is the perfect game to show off a little more about what
    exactly Python can do. Human input, comparisons, random selections and a whole
    host of loops are used in making a working version of the game. It’s also easy
    enough to adapt and expand as you see fit, adding rules and results, and even
    making a rudimentary AI if you wish.


    For this particular tutorial, we also recommend using IDLE. IDLE is a great Python
    IDE that is easily obtainable in most Linux distributions and is available by
    default on Raspbian for Raspberry Pi. It helps you by highlighting any problems
    there might be with your code and allows you to easily run it to make sure it’s
    working properly.


    # Resources


    Python 2: www.python.org/download


    IDLE: www.python.org/idle


    Allow the Python script to run in a terminal, and outside the IDE


    Human input in the form of integers is used for comparing moves and, ultimately,
    playing the game


    Use deduction to determine one of three outcomes


    Loop the code over again and start from the beginning


    Append to integer variables to keep track of scores and more


    ![](img/3b256f430f51c98f1315671f6e4eec19_25_0.png)'
