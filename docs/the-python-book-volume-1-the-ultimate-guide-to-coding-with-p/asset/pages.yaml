  md: '# 18 Category definition


    Finish the definition by using the parent_id to filter the correct Posts, then
    render the response.


    ```

    category_posts = Post.objects.filter(category=category) return render_to_response(''blog/categories.html'',
    {''category_posts'':category_posts, ''categories'':categories})

    ```


    Again we’re calling a new template that we’ll construct shortly.


    # 19 Category URLs


    We’ll create the URL in urls.py as for the post page, only it’ll give the slug
    of the category instead of an ID in the link:


    ```

    url(r''^myblog/category/(?P<category_id>\d+)/$'', ''blog.urls.blog_categories'')

    ```


    # 20 Category template


    We’ll use something similar to the Index and Post template to create a category
    page template:


    ```

    <% for post in category_posts %>

    <h2><a href="/myblog/{{ post.pk }}">{{ post.title }}</a></h2>

    <p> {{ post.author }} on {{ post.pub_date }} {% if post.author %}

    {% else %}<p>{{ post.excerpt|truncatewords:3 }}</p>{% endif %}

    <p>Category: {{ post.category }}</p>{% endfor %}

    ```


    # 21 Category clickthrough


    Finally, let’s make the categories click through to the relevant page by changing
    the


    > Finally, let’s make the categories click through to the relevant page


    # 22 RSS


    Django has a built-in RSS framework. In blog/urls.py add: from django.contrib.syndication.views
    import Feed class BlogFeed(Feed): title = "Blog Feed" link = "/" def items(self):
    return Post.objects.order_by("-pub_date") def item_title(self, post): return post.title


    # 23 RSS links


    We need to define item_link for the feed so that the feed items can link to the
    right place. We have to give the complete URL and the post ID for it:


    ```

    def item_link(self, post): link = "http://127.0.0.1:8000/myblog/"+str(post.pk)
    return link

    ```


    # 24 RSS URLs


    The final step is adding the feed URL to urls.py: url(r''^myblog/feed/$'', BlogFeed()).
    And now your blog is now fully functional. With a bit more tweaking and theming,
    you can get it online and blog away!


    ```

    url(r''^myblog/feed/$'', BlogFeed())

    ```


