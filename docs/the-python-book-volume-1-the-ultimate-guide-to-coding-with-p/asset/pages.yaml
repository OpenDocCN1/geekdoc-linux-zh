    # 05 The echo function


    We need a function that can be called from a client''s thread to echo a message
    to each client. This function is pretty simple. The most important part is that
    sending data to sockets is in a try block, which means that we can handle the
    exception if the operation fails, rather than having the program crash.


    ```

    def echo(self, data):

    # Send a message to each socket in self.client_socket

    print "echoing: {}".format(data)

    for socket in self.client_sockets

    # Try and echo to all clients

    try:

    socket.sendall(data)

    except socket.error:

    print "Unable to send message"

    ```


    # 06 Finishing the Server class


    The remainder of the Server class is taken up with a couple of simple functions;
    one to remove a socket from the collection of sockets, which doesn''t need an
    explanation, and the signal_handler function that we talked about in the initialiser
    of the class. This function stops listening for new connections, and unbinds the
    socket from the port it was listening on. Finally, we send a message to each client
    to let them know that we are exiting. The signal will continue to close the program
    as expected once the signal_handler function has ended.


    ```

    def remove_socket(self, socket):

    ```


    # 07 The client thread


    The class that is used to deal with each client inherits the Thread class. This
    means that the class can be created, then started with client_thread.start().
    At this point, the code in the run function of the class will be run in the background
    and the main loop of the Server class will continue to accept new connections.


    ```

    class ClientListener(threading.Thread):

    def __init__(self, server, socket, address):

    # Initialise the Thread base class

    super(ClientListener, self).__init__()

    # Store the values that have been passed to the constructor

    self.server = server

    self.address = address

    self.socket = socket

    self.listening = True

    self.username = "No Username"

    ```


    # 08 The client thread''s loop


    The loop that runs in the client thread is pretty similar to the one in the server.
    It keeps listening for data while self.listening is true, and passes any data
    it gets to a handle_msg function that we will write shortly. The value passed
    to the socket.recv function is the size of the buffer to use while receiving data.


    ```

    def run(self):

    # The thread''s loop to receive and process messages

    while self.listening:

    data = ""

    try:

    data = self.socket.recv(1024)

    except socket.error:

    "Unable to receive data"

    self.handle_msg(data)

    time.sleep(0.1)

    # The while loop has ended

    print "Ending client thread for {}".format(self.address)

    ```


    # 09 Tidying up


    We need to have a function to tidy up the thread. We''ll call this either when
    the client sends us a blank string indicating that it''s stopped listening on
    the socket or sends us the string "QUIT". When this happens, we''ll echo to every
    client that the user has quit.


    ```

    def quit(self):

    # Tidy up and end the thread

    self.listening = False

    self.socket.close()

    self.server.remove_socket(self.socket)

    self.server.echo("{}

    quit.

    ".format(self.username))

    ```


    # 10 Handling messages


    There are three possible messages our clients can send:

    • QUIT

    • USERNAME user

    • Arbitrary string to be echoed to all clients


    The client will also send a bunch of empty messages if the socket has been closed,
    so we will end their thread if that happens. The code should be pretty self-explanatory
    apart from the regular expression part. If someone sends the USERNAME message,
    then the server tells every client that a new user has joined. This is tested
    with a regular expression. $ indicates the start of the string, $ indicates the
    end, and the brackets containing $ extract whatever comes after "USERNAME".


