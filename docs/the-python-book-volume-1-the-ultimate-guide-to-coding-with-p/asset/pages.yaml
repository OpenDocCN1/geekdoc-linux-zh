- pgno: 115
  md: '# Handling Twitter’s three-legged OAuth process


    Building and signing requests according to OAuth can be tricky. We explain the
    authentication process for Python and Flask


    # Resources


    +   - Python 2.7+

    +   - Flask 0.10.0: flask.pocoo.org

    +   - Flask GitHub: github.com/mitsuhiko/flask

    +   - A Twitter account

    +   - Your favourite text editor


    ![](img/3b256f430f51c98f1315671f6e4eec19_115_0.png)


    The OAuth Settings page for your new Twitter app – you’ll fill in various bits
    as you go


    Once upon a time, Twitter was a favourite API for developers looking to write
    a quick weekend hack. Setup was quick, documentation was plentiful and the data
    available was vast. Fun times! But now things are a little different. With the
    Twitter API v1.1, authentication is not quite as easy as it once was (though the
    documentation is still plentiful and the data vast). Twitter now requires adherence
    to OAuth protocol v1 for all requests made to its API. It’s tempting to install
    a library and ignore all the complicated stuff – and entirely appropriate if you’re
    putting together a quick hack project. However, understanding what’s going on
    in the authentication process will help you along when it comes to debugging problems
    you may encounter later if you have to start handling multiple users or requests.
    For this tutorial, we’ll be using Flask – a great, lightweight Python server framework
    to define routes, create sessions and handle parameters passed to and from Twitter.
    Flask is perfect for this project: as we’ll see shortly, defining routes and handling
    parameters is a piece of cake and saves us having to deal with a lot of the overheads
    that come with frameworks such as Django.


    # 01 Install Flask


    So, before we start writing code, let’s deal with the prerequisites. If you have
    pip on your system then installing is as simple as entering sudo pip install flask
    into your terminal. If you’re into building from source, you can head over to
    Flask’s GitHub and grab the latest version there.


    # 02 Create a Twitter app


    Before we can do anything with Twitter, we need to create an app for their service.
    Go to https://dev.twitter.com and sign in. If you look in the top-right corner,
    you’ll see your Twitter profile picture; hover over it and a drop-down will appear.
    Select ‘My Apps’ and then click the ‘Create new app’ button that appears on the
    next screen. Follow the instructions to set up the app. The information you enter
    here isn’t important right now – at the end of the process you’ll see a field
    titled ‘OAuth Settings’ with a table of settings. We’ll need those in a little
    bit.


    # 03 Importing Python modules


    These are the modules we’ll be using for this project. With the exception of Flask,
    all of the modules should be included with all versions of Python 2.7+. These
    modules are all used in the process of generating, signing and encoding each request
    we send to and from Twitter in the auth process. We need to be specific when importing
    sessions, requests etc from Flask, otherwise those aspects of the library won’t
    be included in the scope of the endpoints.


    # 04 Create global variables for Twitter keys


    Back in step 2 we created an app with Twitter. Now we need those variables that
    we saw in the OAuth Settings area of the ‘Create my app’ page. Fill in the consumer_key
    and consumer_secret variables. For now, leave the oauth_secret and oauth_token
    variables as blank strings – we’ll assign those later.'
