  md: "# Create with Python\n\n# 02 Downloading pivaders\n\nGit is a superb version\
    \ control solution that helps programmers safely store their code and associated\
    \ files. Not only does it help you retain a full history of changes, it means\
    \ you can ‘clone’ entire projects to use and work on from places like github.com.\
    \ To clone the version of the project we created for this tutorial, go to your\
    \ home folder from the command line (cd ~) and type:\n\ngit pull https://github.com/russb78/pivaders.git\n\
    \nThis will create a folder called pivaders – go inside (cd pivaders) and take\
    \ a look around.\n\n# 03 Navigating the project\n\nThe project is laid out quite\
    \ simply across a few subfolders. Within pivaders sits a licence, readme and a\
    \ second pivaders folder. This contains the main game file, pivaders.py, which\
    \ launches the application. Within the data folder you’ll find subfolders for\
    \ both graphics and sound assets, as well as the font we’ve used for the title\
    \ screen and scores. To take pivaders for a test-drive, simply enter the pivaders\
    \ subdirectory (cd pivaders/pivaders) and type:\n\npython pivaders.py\n\nUse the\
    \ arrow keys to steer left and right and the space bar to shoot. You can quit\
    \ to the main screen with the Esc key and press it again to exit the game completely.\n\
    \n# 04 Animation & sound\n\nCompared with the game from last month’s tutorial,\
    \ you’ll see it’s now a much more dynamic project. The protagonist ship now leans\
    \ into the turns as you change direction and corrects itself when you either press\
    \ the opposite direction or lift your finger off the button. When you shoot an\
    \ alien ship, it explodes\n\n![](img/3b256f430f51c98f1315671f6e4eec19_125_0.png)\n\
    \nAbove The Freesound site is a good place to find free and open sound effects\
    \ for projects\n\n# 05 Finding images to animate\n\nBefore we can program anything,\
    \ it’s wise to have assets set up in a way we can use them. As mentioned, we’ve\
    \ opted to use sprite sheets; these can be found online or created with GIMP with\
    \ a little practice. Essentially they’re a mosaic made up of individual ‘frames’\
    \ of equally sized and spaced images representing each frame. Find ready-made\
    \ examples at opengameart.org, as used here.\n\n# 06 Tweaking assets\n\nWhile\
    \ many of the assets on sites like opengameart.org can be used as is, you may\
    \ want to import them into an image-editing application like GIMP to configure\
    \ them to suit your needs – as we did with our ship sheet asset to help us keep\
    \ the code simple. We started with the central ship sprite and centred it into\
    \ a new window. We set the size and width of the frame and then copy-pasted the\
    \ other frames either side of it. We ended up with 11 frames of exactly the same\
    \ size and width in a single document. Pixel-perfect precision on size and width\
    \ is key, so we can just multiply it to find the next frame.\n\n# 07 Loading the\
    \ sprite sheet\n\nSince we’re inheriting from the Sprite class to create our Player\
    \ class, we can easily alter how the player looks on screen by changing Player.image.\
    \ First, we need to load our ship sprite sheet with pygame.image.load(). Since\
    \ we made our sheet with a transparent background, we can append .convert_alpha()\
    \ to the\n\nwith several frames of animation and should you take fire, a smaller\
    \ explosion occurs on your ship. Music, lasers and explosion sound effects also\
    \ accompany the animations as they happen.\n\nend of the line so the ship frames\
    \ render correctly (without any background). We then use subsurface to set the\
    \ initial Player image to the middle ship sprite on the sheet. This is set by\
    \ self.ani_pos, which has an initial value of 5. Changing this value will alter\
    \ the image drawn to the screen: ‘0’ would draw it leaning fully left, ‘11’ fully\
    \ to the right.\n\n# 08 Animation flags\n\nDown the list in the initialising code\
    \ for the Game class, we set two flags for player animation: self.animate_left\
    \ and self.animate_right. In the Control method of our Game class, we use these\
    \ to ‘flag’ when we want animations to work using Boolean values. It allows us\
    \ to ‘automatically’ animate the player sprite back to its resting state (otherwise\
    \ the ship will continue to look as if it’s flying left when it has stopped).\n\
    \n# 09 The animation method\n\nThese flags pop up again in the core animation\
    \ code for the player: animate_player() within the Game class. Here we use nested\
    \ if statements to control the animation and physically set the player image accordingly.\
    \ Essentially it states that if the animate_right flag is True and if the current\
    \ animation position is different to what we want, we incrementally increase the\
    \ ani_pos variable and set the player’s image accordingly. The Else statement\
    \ then animates the ship sprite back to its resting state and the same logic is\
    \ then applied in the opposite direction.\n\n# 10 Animating explosions\n\nThe\
    \ player_explosion() and alien_explosion() methods that come after the player\
    \ animation block in the Game class are similar but simpler executions of essentially\
    \ the same thing. As we only need to run through the same predefined set of frames\
    \ (this time vertically), we only need to see if self.explode and self.alien_explode\
    \ flags are True before we increment the variables that change the image displayed.\
    \ As the sprite sheet is vertical, the variables alien_explode_pos and explosion_image\
    \ are set to a different part of subsurface than before.\n\n# 11 Adding music\
    \ to your project\n\nPygame makes it easy to add a musical score to a project.\
    \ Just obtain a suitable piece of music in your preferred format we found ours\
    \ via freemusicarchive.org and load it using the Mixer Pygame class. As it’s already\
    \ been initialised via pygame.init(), we can go ahead and load the music with\
    \ this code:\n\n```\npygame.mixer.music.load('data/sound/18_Arpanauts.ogg')\n\
    pygame.mixer.music.play(-1)\npygame.mixer.music.set_volume(0.7)\n```\n\nThe music.play(-1)\
    \ requests that the music should start with the app and continue to loop until\
    \ it quits. If we replaced -1 with 5, the music would loop five times before ending.\
    \ Learn more about the Mixer class via www.pygame.org/docs/ref/mixer.html.\n\n\
    # 12 Using sound effects\n\nLoading and using sounds is similar to how we do so\
    \ for images in Pygame. First we load the sound effect using a simple assignment.\
    \ For the laser beam, the initialisation looks like this:\n\n```\nself.bullet_fx\
    \ = pygame.mixer.Sound(\n    'data/sound/meditix_pc-bitcrushed-lazer-beam.ogg')\n\
    ```\n\nThen we simply trigger the sound effect at the appropriate time. In the\
    \ case of the laser, we want it to play whenever we press the space bar to shoot,\
    \ so we place it in the Game class’s Control method, straight after we raise the\
    \ shoot_bullet flag.\n\nIf you’re struggling to find free and open sound effects,\
    \ we recommend www.freesound.org."
