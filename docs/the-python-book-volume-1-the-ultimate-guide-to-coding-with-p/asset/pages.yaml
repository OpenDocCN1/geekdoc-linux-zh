- pgno: 69
  md: "# 40. Sending email\n\nYou can use the module 'smtplib' to send email using\
    \ an SMTP (Simple Mail Transfer Protocol) client interface.\n\n```\nsmtplib.SMTP([host\
    \ [, port]])\n```\n\nExample (send an email using Google Mail SMTP server):\n\n\
    ```\nimport smtplib\n# Use your own to and from email address\nfromaddr = 'kunaldeo@gmail.com'\n\
    toaddrs = 'toemail@gmail.com'\nmsg = 'I am a Python geek. Here is the proof!'\n\
    # Credentials\n# Use your own Google Mail credentials while running the program\n\
    username = 'kunaldeo@gmail.com'\npassword = 'xxxxx'\n# The actual mail send server\
    \ = smtplib.SMTP('smtp.gmail.com:587')\n# Google Mail uses secure connection for\
    \ SMTP connections server.starttls()\nserver.login(username,password)\nserver.sendmail(fromaddr,\
    \ toaddrs, msg)\nserver.quit()\n```\n\n# 41. Accessing FTP server\n\n'ftplib'\
    \ is a fully fledged client FTP module for Python. To establish an FTP connection,\
    \ you can use the following function:\n\n```\nftplib.FTP([host [, user [, passwd\
    \ [, acct [, timeout]]]]])\n```\n\nExample:\n\n```\nhost = \"ftp.redhat.com\"\n\
    username = \"anonymous\"\npassword = \"kunaldeo@gmail.com\"\nimport ftplib\nimport\
    \ urllib2\nftp_serv = ftplib.FTP(host,username,password)\n# Download the file\n\
    u = urllib2.urlopen(\"ftp://ftp.redhat.com/pub/redhat/linux/README\")\n# Print\
    \ the file contents\nprint (u.read())\n```\n\nOutput:\n\n```\n[~/src/python $]\
    \ python ftpclient.py\n```\n\nOlder versions of Red Hat Linux have been moved\
    \ to the following location: ftp://archive.download.redhat.com/pub/redhat/linux/\n\
    \n# 42. Launching a webpage with the default web browser\n\nThe 'webbrowser' module\
    \ provides a convenient way to launch webpages using the default web browser.\n\
    \nExample (launch google.co.uk with system's default web browser):\n\n```\n>>>\
    \ import webbrowser\n>>> webbrowser.open(\"http://google.co.uk\")\nTrue\n```\n\
    \n# 43. Creating secure hashes\n\nThe 'hashlib' module supports a plethora of\
    \ secure hash algorithms including SHA1, SHA224, SHA256, SHA384, SHA512 and MD5.\n\
    \nExample (create hex digest of the given text):\n\n```\n>>> import hashlib\n\
    # sha Digest\n>>> hashlib.sha1(\"M16 Classified Information 007\").hexdigest()\n\
    'e22b154c7329cc0b935aeleb9593 18balb0c85'\n# sha224 Digest\n>>> hashlib.sha224(\"\
    M16 Classified Information 007\").hexdigest()\n'3d8e1274100b2b2048842790e5eb97\
    \ 7d59b40b998e355e2c'\n# sha256 Digest\n>>> hashlib.sha256(\"M16 Classified Information\
    \ 007\").hexdigest()\n'2fd573d53fa7b67f2c39725991c89 b25607c7b4c6403e fdb3b1c19825e'\n\
    # sha384 Digest\n>>> hashlib.sha384(\"M16 Classified Information 007\").hexdigest()\n\
    '5c9416103fd1bd1e14d8ce1e3a1d5a29d99 dc192ed18aa7628b009884aafaa54b0e 9e0fc3d3a65c8b6c35372d'\n\
    # sha512 Digest\n>>> hashlib.sha512(\"M16 Classified Information 007\").hexdigest()\n\
    'a704ac3dbe6e8235784823a31d5a29d25 2c8221f4973f45b9f222aedc6a29b89077 8ea0b7a0a9ec4f8b1856614667fba7\
    \ 3aldcf1ff92e48c712b2'\n# MD5 Digest\n>>> hashlib.md5(\"M16 Classified Information\
    \ 007\").hexdigest()\n'e8e2fc52ca146f99a670c826f7126'\n```\n\n# 44. Seeding random\
    \ numbers\n\nYou can use the module 'random' to generate a wide variety of random\
    \ numbers. The most used one is 'random.seed(x)'. It initialises the basic random\
    \ number generator. If x is omitted or None, current system time is used: current\
    \ system time is also used to initialise the generator when the module is first\
    \ imported.\n\n# 45. Working with CSV (comma-separated values) files\n\nCSV files\
    \ are very popular for data exchange over the web. Using the module 'csv', you\
    \ can read and write CSV files.\n\nExample:\n\n```\nimport csv\n# write stocks\
    \ data as comma-separated values\nwriter = csv.writer(open('stocks.csv', 'wb',\
    \ buffering=0))\nwriter.writerow([\n('GOOG', 'Google, Inc.', 505.24, 0.47, 0.05),\n\
    ('YHOO', 'Yahoo Inc.', 27.38, 0.33, 1.22),\n('CNET', 'CNET Networks, Inc.', 8.62,\
    \ -0.13, -1.49)\n])\n# read stocks data, print status messages\nstocks = csv.reader(open('stocks.csv',\
    \ 'rb'))\nstatus_labels = {-1: 'down', 0: 'unchanged', 1: 'up'}\nfor ticker, name,\
    \ price, change, pct in stocks:\n    status = status_labels[cmp(float(change),\
    \ 0.0)]\n    print('%s is %s (%.2f)' % (name, status, pct))\n```\n\n# 47. Installing\
    \ third-party modules using setuptools\n\n'setuptools' is a Python package which\
    \ lets you download, build, install, upgrade and uninstall packages very easily.\n\
    \nTo use 'setuptools' you will need to install from your distribution's package\
    \ manager. After installation you can use the command 'easy_install' to perform\
    \ Python package management tasks."
