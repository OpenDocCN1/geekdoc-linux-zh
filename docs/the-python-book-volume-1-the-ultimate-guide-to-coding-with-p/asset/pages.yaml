    \ import patterns, include, url\nfrom django.contrib import admin\nadmin.autodiscover()\n\
    ```\n\n```\nurlpatterns = patterns('',\n    url(r'^admin/', include(admin.site.urls)),\n\
    )\n```\n\n# 06 Starting the Django web server\n\nDjango includes a built-in web\
    \ server which is very handy to debug and test Django applications. Let's start\
    \ it to see how our admin interface works...\n\nTo start the web server:\n$ python\
    \ manage.py runserver\n\nIf you do not have any errors in your code, the server\
    \ should be available on port 8000. To launch the admin interface, navigate your\
    \ browser to http://localhost:8000/admin/. You will be asked to log in here. Enter\
    \ the username and password that you created while syncing the database.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_62_0.png)\n\
    \nAdmin login screen\n\nAfter logging in, you will notice that all the apps installed\
    \ in your project are available here. We are only interested in the Auth and Ludissuses\
    \ app. You can click the +Add to add a record. Click the Add button next to Users\
    \ and add a few users to the site.\nOnce you have the users inside the system,\
    \ you can now add a few issues to the system."
