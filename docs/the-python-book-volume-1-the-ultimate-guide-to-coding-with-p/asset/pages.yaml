  md: "# Web development\n\n# 16 Administrate\n\nLike the posts, we can get the Admin\
    \ page to see comments. Start editing blogs/admin.py to get this feature added:\n\
    \n```\nfrom blog.models import Post, Comment\nfrom django.contrib import admin\n\
    class PostAdmin(admin.ModelAdmin):\n    list_display = ['title', 'author', 'pub_date']\n\
    \    fields = ['title', 'pub_date', 'author', 'post']\nadmin.site.register(Post,\
    \ PostAdmin)\n```\n\n# 17 Comment-specific admin features\n\nNow we can add the\
    \ comment-specific admin features without causing any clashes:\n\n```\nclass CommentAdmin(admin.ModelAdmin):\n\
    \    list_display = ['text', 'author', 'post']\nadmin.site.register(Comment, CommentAdmin)\n\
    ```\n\nThis will show the comments on the admin site, and you can see the comment,\
    \ the author and the post it's connected to.\n\n# 18 Sidebar beginnings\n\nDjango\
    \ makes it pretty easy to order posts by years and months, but first we need to\
    \ import some new models into blog/urls.py:\n\n```\nimport time\nfrom calendar\
    \ import month_name\n```\n\nWe're going to define two new functions, month_timeline\
    \ and month, to make the sidebar.\n\n# 19 Start to define month_timeline\n\nFirst\
    \ we need to get all the information from the posts:\n\n```\ndef month_timeline():\n\
    \    year, month = time.localtime()[0:2]\n    begin = Post.objects.order_by('pub_date')[0]\n\
    \    month_begin = begin.pub_date.month\n    year_begin = begin.pub_date.year\n\
    \    month_list = []\n```\n\nThe '[2]' makes sure we only get the time information\
    \ we need.\n\n# 20 Finish your definition\n\nNow we will order the posts by month\
    \ and year starting from our first month.\n\n```\nfor y in range(year, year_begin-1,\
    \ -1):\n    start, end = 12, 0\n    if y == year: start = month\n    if y == year_begin:\
    \ end = month_begin-1\n    for m in range(start, end, -1):\n        month_list.append((y,\
    \ m, month_name[m]))\nreturn month_list\n```\n\n# 21 Return to reader\n\nWith\
    \ the list organised, we can now define month so we can display it on the blog:\n\
    \n```\ndef month(request, year, month):\n    post_list = Post.objects.filter(pub_date__year=year,\
    \ pub_date__month=month)\n    return render_to_response('blog/index.html', dict(sidebar_list=object_list,\
    \ month_list=month_timeline()))\n```\n\nNow we need to link it up to the index\
    \ template.\n\n# 22 Finalise your sidebar definition\n\nEdit the return command\
    \ on the index function to include the sidebar information:\n\n```\nreturn render_to_response('blog/index.html',\
    \ dict(post_list=post_list, sidebar_list=post_list.object_list, month_list=month_timeline()))\n\
    ```\n\nThen add this line to urls.py in myblog so a month page can be rendered:\n\
    \n```\nurl(r'^myblog/month/(\\d+)/(\\d+)$', 'blog.urls.month')\n```\n\nAll we\
    \ need to do now is display the information on the site.\n\n# 23 Sidebar on the\
    \ web\n\nGo to the index template. First of all, change the first line of the\
    \ post forloop to:\n\n```\n{% for post in sidebar_list %}\n```\n\nSimple enough.\
    \ Now we need to add the sidebar information:\n\n```\n{% for month_list %}\n<p><a\
    \ href=\"{% url blog.urls.month month.0 month.1 %}\">{{ month.2 }}</a></p>\n{%\
    \ endfor %}\n```\n\n# 24 Sidebar finale\n\nObviously it's not at the side right\
    \ now – that's a job for the HTML and CSS. The info is there, though, and you\
    \ can manipulate it any way you want. However, your blog is now a lot more friendly\
    \ to your readers.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_146_0.png)\n\n\
    ![](img/3b256f430f51c98f1315671f6e4eec19_146_1.png)\n\n![](img/3b256f430f51c98f1315671f6e4eec19_146_2.png)\n\
    \n![](img/3b256f430f51c98f1315671f6e4eec19_146_3.png)\n\n![](img/3b256f430f51c98f1315671f6e4eec19_146_4.png)"
