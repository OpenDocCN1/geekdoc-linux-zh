- pgno: 147
  md: '# # Enhance your blog

    # with extra features


    # Resources


    **Python base:** http://www.python.org/download/


    **Django source:** djangoproject.com/download/


    To add to the previous tutorials, we’ll cover some of the more advanced features
    you can utilise with the power of Django


    **We’ve been building our Django blog to create and display posts, allow people
    to make comments, and filter posts by month like a classic blog sidebar.** We
    still have a bit of a way to go until it looks and behaves more like a classic
    blog, though.


    In this tutorial, we’re going to add in summaries, excerpts, categories and finally
    an RSS feed. This allows us to look at a few things – firstly we’ll get a better
    understanding of cross-model referencing and how that works in the admin site.
    We will also go through how to make changes to the database, and how Django helps
    when creating an SQL query.


    Finally, the RSS feed is part of a standard feed library in Django itself. We
    will learn how to import and use it to create a simple list of the latest entries
    that click through to the posts. By the end of the tutorial your Django blog will
    be finally finished!


    ![](img/3b256f430f51c98f1315671f6e4eec19_147_0.png)


    ## 01 Summarise

    On a normal blog we’re going to have much longer articles. We can generate a summary
    of each of those on the index page template like so:


    `<p>{{ post|truncatewords:3 }}</p>`


    This automatically takes the first three words of the post – of course, you can
    use any number.


    ![](img/3b256f430f51c98f1315671f6e4eec19_147_1.png)


    ## 02 Manual excerpt

    If you don’t want an automatic summary, we can add an excerpt field to our post
    model so you can create one manually.


    `excerpt = models.TextField()`


    To limit the characters in your excerpt, use a CharField like for our author section.


    ![](img/3b256f430f51c98f1315671f6e4eec19_147_2.png)


    ## 03 Write an excerpt

    To write the excerpt, or append it to the previous posts, we’ll have to add it
    to the admin page. Open up admin.py and edit the fields section of the AdminPost
    class to add excerpt:


    `fields = (''title'', ''pub_date'', ''author'', ''post'', ''excerpt'')`


    > > We’re going to add summaries,

    > > excerpts and an RSS feed'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Web development


    ![](img/3b256f430f51c98f1315671f6e4eec19_148_0.png)


    Have automatic summaries or manually crafted excerpts for your blog posts


    Create and manage parent and child categories as a separate function of the blog


    Learn how to alter the database to create posts with categories, and add them
    to other posts


    Create custom RSS feeds using built-in Django functions


    ![](img/3b256f430f51c98f1315671f6e4eec19_148_1.png)


    # 04 Excerpt summary


    You can replace the excerpt content in the index template with the excerpt, but
    we can keep it as a backup for if the excerpt is empty:


    ```python

    {% if post.excerpt %} <p>{{ post.excerpt }}</p> {% else %} <p>{{ post.post.truncatewords:3
    }}</p> {% endif %}

    ```


    ![](img/3b256f430f51c98f1315671f6e4eec19_148_2.png)


    # 05 Database error


    If you’ve noticed or tested the changes,


    you’ll have noticed our web server has stopped working. This is because there
    is no excerpt column in our database. Therefore we need to add the excerpt column.
    To find out how, run:


    ```bash

    $ python manage.py sqlall blog

    ```


    # 06 Database query


    The output will show you what the SQL code is to add these models to the database.
    We want to add the excerpt field specifically, which should look something like
    this:


    ```sql

    “excerpt” text NOT NULL

    ```


    Make a note of it.


    ![](img/3b256f430f51c98f1315671f6e4eec19_148_3.png)


    # 07 Alter table


    To get into the database shell and add the field, run:


    ```bash

    $ python manage.py dbshell

    ```


    Then we need to use an ALTER TABLE query:


    ALTER TABLE “blog_post”;

    And then enter the code noted down like so:

    ADD “excerpt” text;


    # 08 Save the changes


    We’ve removed NOT NULL as we already have entries that now have an excerpt, and
    want to make it so an auto summary can be made. Save the changes with: COMMIT;
    and then exit the shell with: .quit


    ![](img/3b256f430f51c98f1315671f6e4eec19_148_4.png)


    # 09 Test it out


    Now we can test out the excerpt code – create a new post or edit an existing one
    to have an excerpt. If you’ve followed our steps correctly it should work; if
    not, you may need to do a bit of bug fixing.'
