    \ It hasn’t changed at all from the original code.\n\n# 20 Hand of dice\n\nLike\
    \ roll, nothing has changed for the hand function. It’s simply now placed outside\
    \ the gui function for the exact same reasons. It also means that you can easily\
    \ import this function into another script if you wish.\n\n# 21 GUI start\n\n\
    As we’ve mentioned last month and in the Hangman code, we put all the GUI code\
