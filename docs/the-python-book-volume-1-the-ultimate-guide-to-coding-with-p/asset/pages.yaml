    def configure(self):

    # Performs the steps to connect to the server

    # Show a dialog asking for server address followed by a port

    server = self.ask_for_info("server_address:port")

    # Regex that crudely matches an IP address and a port number

    regex = re.search(r"(\d+\.\d+\.\d+\.\d+):(\d+)", server)

    address = regex.group(1).strip()

    port = regex.group(2).strip()

    # Ask for a username

    self.username = self.ask_for_info("username")

    self.username_label.set_text(self.username)

    # Attempt to connect to the server and then start listening

    self.network = Networking(self, self.username, address, int(port))

    self.network.listen()

    ```


    # 15 The remainder of MainWindow


    The rest of the MainWindow class has plenty of comments to explain itself, as
    follows. One thing to note is that when a client sends a message, it doesn’t display
    it in the text view straight away. The server is going to echo the message to
    each client, so the client simply displays its own message when the server echoes
    it back. This means that you can tell if the server is not receiving your messages
    when you don’t see a message that you sent.


    ```

    def add_text(self, new_text):

    # Add text to the text view

    text_with_timestamp = "{0}".format(datetime.now(),

    new_text)

    # Get the position of the end of the text buffer, so we know where to insert new
    text

    end_iter = self.text_buffer.get_end_iter()

    # Add new text at the end of the buffer

    self.text_buffer.insert(end_iter, text_with_timestamp)

    ```


    ```

    def send_message(self, widget):

    # Clear the text entry and send the message to the server

    # We don’t need to display it as it will be echoed back to each client, including
    us.

    new_text = self.text_entry.get_text()

    self.text_entry.set_text("")

    message = "{0} says: {1}\n".format(self.username, new_text)

    self.network.send(message)

    def graceful_quit(self, widget):

    # When the application is closed, tell GTK to quit, then tell the server we are
    quitting and tidy up the network

    gtk.main_quit()

    self.network.send("QUIT")

    self.network.tidy_up()

    ```


