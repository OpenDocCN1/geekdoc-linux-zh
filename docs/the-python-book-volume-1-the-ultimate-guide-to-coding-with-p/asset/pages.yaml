    \ the interface towards the end of the script\n\n# 23 Start game\n\nWhen we activate\
    \ the button that starts game, it immediately sends us to the rest of the code.\
    \ This would also work if you had the button go to the throws function instead,\
    \ however, you can add other functions to this part if you wish.\n\n# 24 Dice\
    \ selection\n\nThe first thing we do is find out what checkboxes have been ticked\
    \ by the player. We then put these in a list so we can change out the correct\
    \ dice numbers. We’ve also brought in dice so we can check against that what the\
    \ current dice rolls are.\n\n```\n#!/usr/bin/env python2\nfrom Tkinter import\
    \ *\nfrom ttk import import random\nfrom itertools import groupby\ndice = 0\n\
    ```\n\n```\ndef roll(roll_number):\n    numbers = range(1,7)\n    dice = range(roll_number)\n\
    \    iterations = 0\n    while iterations < roll_number:\n        iterations =\
    \ iterations + 1\n        dice[iterations-1] = random.choice(numbers)\n    return\
    \ dice\n```\n\n```\ndef hand(dice):\n    dice_hand = [len(list(group)) for key,\
    \ group in groupby(dice)]\n    dice_hand.sort(reverse=True)\n    straight1 = [1,2,3,4,5]\n\
    \    straight2 = [2,3,4,5,6]\n    if dice == straight1 or dice == straight2:\n\
    \        return \"a straight!\"\n    elif dice_hand[0] == 5:\n        return \"\
    five of a kind!\"\n    elif dice_hand[0] == 4:\n        return \"four of a kind!\"\
    \n    elif dice_hand[0] == 3:\n        if dice_hand[1] == 2:\n            return\
    \ \"a full house!\"\n        else:\n            return \"three of a kind.\"\n\
    \    elif dice_hand[0] == 2:\n        if dice_hand[1] == 2:\n            return\
    \ \"two pair.\"\n        else:\n            return \"one pair.\"\n    else:\n\
    \        return \"a high card.\"\n```\n\n```\ndef gui():\n    global dice\n  \
    \  dice = roll(5)\n    dice.sort()\n    nine = 9\n    ten = 10\n    jack = 3\n\
    \    queen = 4\n    king = 5\n    ace = 6\n    names = { nine: \"9\", ten: \"\
    10\", jack: \"J\", queen: \"Q\", king: \"K\", ace: \"A\" }\n    result = \"You\
    \ have \" + hand(dice)\n```\n\n```\ndef game():\n    throws()\n```\n\n```\ndef\
    \ throws():\n    global dice\n    dice1_check = dice1.get()\n    dice2_check =\
    \ dice2.get()\n    dice3_check = dice3.get()\n    dice4_check = dice4.get()\n\
    \    dice5_check = dice5.get()\n    dice_re rolls = [dice1_check, dice2_check,\
    \ dice3_check, dice4_, check, dice5_check]\n```\n\n# EXTRA GAME FUNCTIONS\n\n\
    We mentioned that the game function doesn’t necessarily need to be used right\
    \ now. You can either clean up the code and remove it, or add extra functions,\
