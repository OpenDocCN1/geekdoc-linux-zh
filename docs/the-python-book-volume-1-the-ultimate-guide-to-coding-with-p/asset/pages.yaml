    os.popen       os.popen4

    os.path        os.pathsep

    os.popen2      os.putenv

    os.pathconf    os.pipe

    os.popen3

    ```


    Built In Object Explorer: You can add ''?'' after any Python object to view its
    details such as Type, Base Class, String Form, Namespace, File and Docstring.


    # Example:


