- pgno: 66
  md: "# 4. Python statements\n\nPython uses carriage returns to separate statements,\
    \ and a colon and indentation to separate code blocks. Most of the compiled programming\
    \ languages, such as C and C++, use semicolons to separate statements and curly\
    \ brackets to separate code blocks.\n\n# 5. == and = operator\n\nPython uses `==`\
    \ for comparison and `=` for assignment. Python does not support inline assignment,\
    \ so there’s no chance of accidentally assigning the value when you actually want\
    \ to compare it.\n\n# 6. Concatenating strings\n\nYou can use `+` to concatenate\
    \ strings.\n\n```\n>>> print ('kun'+'al')\nkunal\n```\n\n# 7. The __init__ method\n\
    \nThe __init__ method is run as soon as an object of a class is instantiated.\
    \ The method is useful when you want to do with your object. __init__ method is\
    \ analogous to a constructor in C++, C# or Java.\n\n```\nExample:\nclass Person:\n\
    \    def __init__(self, name):\n        self.name = name\n    def sayHi(self):\n\
    \        print 'Hello, my name is', self.name\np = Person('Kunal')\np.sayHi()\n\
    Output:\nC:/src/python $ python inittmethd.py\nHello, my name is Kunal\n```\n\n\
    # 8. Modules\n\nTo keep your programs manageable as they grow in size, you may\
    \ want to break them up into several files. Python allows you to put multiple\
    \ function definitions into a file and use them as a module that can be imported\
    \ into other scripts and programs. These files must have a .py extension.\n\n\
    ```\nExample:\n# file my_function.py\ndef minmax(a,b):\n    if a <= b:\n     \
    \   min, max = a, b\n    else:\n        min, max = b, a\n    return min, max\n\
    Module Usage\nimport my_function\n```\n\n```\nx,y = my_function.minmax(25, 6.3)\n\
    ```\n\n# 9. Module defined names\n\nExample:\nThe built-in function `dir()` can\
    \ be used to find out which names a module defines. It returns a sorted list of\
    \ strings.\n\n```\n>>> import time\n>>> dir(time)\n['__doc__', '__file__', '__name__',\
    \ '__package__', 'accept2year', 'altzone', 'asctime', 'clock', 'ctime', 'daylight',\
    \ 'gmtime', 'localtime', 'mktime', 'sleep', 'strftime', 'strptime', 'struct_time',\
    \ 'time', 'timezone', 'tzname', 'tzset']\n```\n\n# 10. Module internal documentation\n\
    \nYou can see the internal documentation (if available) of a module name by looking\
    \ at `__doc__`.\n\n```\nExample:\n>>> import time\n>>> print time.clock.__doc__\n\
    clock() -> floating point number\nThis example returns the CPU time or real time\
    \ since the start of the process or since the first call to clock(). This has\
    \ as much precision as the system records.\n```\n\n# 11. Passing arguments to\
    \ a Python script\n\nPython lets you access whatever you have passed to a script\
    \ while calling it. The ‘command line’ content is stored in the sys.argv list.\n\
    \n```\nimport sys\nprint sys.argv\n```\n\n# 12. Loading modules or commands at\
    \ startup\n\nYou can load predefined modules or commands at the startup of any\
    \ Python script by using the environment variable $PYTHONSTARTUP. You can set\
    \ environment variable $PYTHONSTARTUP to a file which contains the instructions\
    \ to load necessary modules or commands.\n\n# 13. Converting a string to date\
    \ object\n\nYou can use the function ‘DateTime’ to convert a string to a date\
    \ object.\n\n```\nExample:\nfrom DateTime import DateTime\n```\n\n```\ndateobj\
    \ = DateTime(string)\n```\n\n# 14. Converting a list to a string for display\n\
    \nYou can convert a list to string in either of the following ways.\n\n```\n1st\
    \ method:\n>>> mylist = ['spam', 'ham', 'eggs']\n>>> print ', '.join(mylist)\n\
    spam, ham, eggs\n```\n\n```\n2nd method:\n>>> print '\\n'.join(mylist)\nspam\n\
    ham\neggs\n```\n\n# 15. Tab completion in Python interpreter\n\nYou can achieve\
    \ auto completion inside Python interpreter by adding these lines to your .pythonrc\
    \ file (or your file Python to read on startup):\nimport rlcompleter, readline\n\
    readline.parse_and_bind('tab: complete')\nThis will make Python complete partially\
    \ typed function, method and variable names when you press the Tab key.\n\n# 16.\
    \ Python documentation tool\n\nYou can pop up a graphical interface for searching\
    \ the Python documentation using the command:\n$ pydoc -g\nYou will need python-tk\
    \ package for this work.\n\n# 17. Python documentation server\n\nYou can start\
    \ an HTTP server on the given port on the local machine. This will give you a\
    \ nice-looking access to all Python documentation, including third-party module\
    \ documentation.\n$ pydoc -p <PortNumber>\n\n# 18. Python development software\n\
    \nThere are plenty of tools to help with Python development. Here are a few important\
    \ ones:\nIDLE: The Python built-in IDE, with autocompletion, function signature\
    \ popup help, and file editing.\nPyScripter: Another enhanced Python shell with\
    \ tab-completion and other features.\nEric3: A GUI python IDE with autocompletion,\
    \ class browser, built-in shell and debugger.\nWing IDE: Commercial Python IDE\
    \ with free license available to open-source developers everywhere."
