  md: "# Putting your APK on the Play Store\n\nFind out how to digitally sign a release\
    \ APK and upload it to an app store of your choice\n\n+   1 Build and sign a release\
    \ APK\n+   First we have to begin by creating a personal digital key, then using\
    \ it to digitally sign a special release version of the APK. Run these commands,\
    \ and follow the instructions they then give you.\n+   ## Create your personal\
    \ digital key\n+   ## You can choose your own\n+   ## Keystore name, alias, and\
    \ passwords.\n+   $ keytool -genkey -v -keystore test-release-key.keystore\n+\
    \   -alias test-alias -keyalg RSA\n+   -keysize 2048 -validity 10000\n+   ## Compile\
    \ your app in release mode\n+   $ buildozer android release\n+   ## Sign the APK\
    \ with your new key\n+   $ jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1\n\
    +   -keystore ./test-release-key.keystore\n+   -bin/KivyBreakout-0.1-release-unsigned.apk\
    \ test-alias\n+   ## Align the APK zip file\n+   $ ~/buildozer/android/platform/android-sdk/tools/zipalign\
    \ -v 4\n+   -bin/KivyBreakout-0.1-release-unsigned.apk\n+   -bin/KivyBreakout-0.1-release.apk\n\
    \n+   2 Sign up as a Google Play Developer\n+   Visit https://play.google.com/apps/publish/signup,\
    \ and follow the instructions. You’ll need to pay a one-off $25 charge, but then\
    \ you can upload as many apps as you like.\n\n+   3 Upload your app to the store\n\
    +   Click ‘Add new application’ to submit your app to the store, including uploading\
    \ your APK and adding description text. When everything is ready, simply click\
    \ Publish, and it should take just a few hours for your app to go live!\n\n```\n\
