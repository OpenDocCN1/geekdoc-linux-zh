  md: "# Work with Python\n\nthe interactive shell for the SSH session. Look for this\
    \ file on FileSilo and copy it into the same folder where you have created PySSHClient.py.\n\
    \n```\n@code_Output\nkunal@ubuntu-vm-kdeo:~/src/paramiko/demos$ python demo_simple.py\n\
    Hostname: 192.168.1.2\nUsername [kunal]: luduser\nPassword for luduser@192.168.1.2:\n\
    *** Connecting...\n[paramiko.Transport at 0xb7620lac]\n(cipher aes128-ctr, 128\
    \ bits)\n(active; 1 open channel(s))\n*** SSH Server Connected! ***\nLast login:\
    \ Thu Jan 13 02:01:06 2011 from 192.168.1.9\n~ $:1\n```\n\nIf the host key for\
    \ the SSH server is not added to your $HOME/.ssh/known_hosts file, the client\
    \ will throw the following error:\n\n```\n*** Caught exception: <type 'exceptions.TypeError'>:\
    \ unbound method missing_host_key() must be called with WarningPolicy instance\
    \ as first argument (got SSHClient instance instead)\n```\n\nThis means that the\
    \ client cannot verify the authenticity of the server you are connected to. To\
    \ add the host key to known_hosts, you can use the ssh command. It is important\
    \ to remember that this is not the ideal way to add the host key; instead you\
    \ should use ssh-keygen. But for simplicity's sake we are using the ssh client.\n\
    \n```\nkunal@ubuntu-vm-kdeo:~/...$ ssh luduser@192.168.1.2\nThe authenticity of\
    \ host '192.168.1.2 (192.168.1.2)' can't be established.\nRSA key fingerprint\
    \ is be:01:76:6a:b9:bb:69:64:e3:dc:37:00:4a:36:33:d1.\nAre you sure you want to\
    \ continue connecting (yes/no)? yes\nWarning: Permanently added '192.168.1.2 (RSA)\
    \ to the list of known hosts.'\n```\n\nSo now you've seen how easy it can be to\
    \ carry out the complex sysadmin tasks using Python's versatile language.\n\n\
    As is the case with all Python coding, the code that is presented here can fairly\
    \ easily be adopted into your GUI application (using software such as PyGTK or\
    \ PyQt) or a web application (using a framework such as Django or Grok).\n\n#\
    \ Writing a user interface using Python\n\n# Learn how to create a user-friendly\
    \ interface using Python\n\nAdministrators are comfortable with running raw scripts\
    \ by hand, but end-users are not. So if you are writing a script that is supposed\
    \ to be used by common users, it is a good idea to create a user-friendly interface\
    \ on top of the script. This way end-users can run the scripts just like any other\
    \ application. To demonstrate this, we will create a simple GRUB configuration\
    \ tool which allows users to select default boot entry and the timeout. We will\
    \ be creating a TUI (text user interface) application and will use the Python\
    \ module 'snack' to facilitate this (not to be confused with the Python audio\
    \ library, Snack).\n\nThis app consists of two files.\n\ngrub.cfg: GRUB Config\
    \ File (/boot/grub/grub.conf). Parser functions, readBootDB() and writeBootFile(),\
    \ which are responsible for reading and writing the GRUB configuration file.\n\
    \ngrub_tui.py: Text user interface file for manipulating the GRUB configuration\
    \ file using the functions available in grub.cfg.\n\n```\n@code:grub_tui.py\n\
    import sys\nfrom snack import *\n\nfrom grub import (readBootDB, writeBootFile)\n\
