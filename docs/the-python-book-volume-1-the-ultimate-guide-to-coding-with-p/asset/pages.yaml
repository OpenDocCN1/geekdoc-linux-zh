  md: "# Full code listing\n\n![](img/3b256f430f51c98f1315671f6e4eec19_164_0.png)\n\
    \nAbove This is the full schematic of the LED matrix that we're working with here\
    \ (you can also view it at its full size on FileSilo)\n\n# 11 Energy control\n\
    \nLEDs light up if current flows through them. SetData pulls the pins of the 74HC244\
    \ low to ensure that the energy supplied from the 74HC238 can flow through the\
    \ diode.\n\n# 12 Avoid GPIO trouble\n\nThe Raspberry Pi Foundation has a tendency\
    \ to change the layout of the expansion header regularly, a habit which professional\
    \ manufacturers of process computers abhor. It's recommended to handle the mapping\
    \ between pins and functions via a set of defines. Our code is optimised for a\
    \ Rev2 Raspberry Pi with a 'short' header – 40-pin variants will require readjustments\
    \ making sure the physical pin numbers correspond to the logical GPIO numbers.\n\
    \n# 13 Add example data\n\nTest the code by setting the datastore to a value of\
    \ your choice. Setting 64 to all fields will disable one row in each part of the\
    \ display.\n\n# 14 Kick it off\n\nCheck all connections between the planar and\
    \ the single-board computer, and proceed to starting the compiled app. Don't forget\
    \ to use the sudo command – direct memory access is restricted to root in order\
    \ to prevent apps from causing havoc in the physical memory. Users are accustomed\
    \ to this, so requiring them to put a sudo in front of the command doesn't cause\
    \ concern.\n\n# 15 Notice a flicker\n\nSharp-eyed readers will notice an occasional\
    \ flicker where one line appears brighter than the others. This is caused by the\
    \ stalling of the program – if the kernel does other work, the switching routine\
    \ can't run. We could solve this problem by using a real-time Linux kernel.\n\n\
    ```\n{\n    _where->writePinLow(PIN7);\n}\n```\n\n# Step 06\n\n```\nint main(void)\n\
    {\n    mmapGpio rpiGpio;\n    //Set outputs\n    rpiGpio.setPinDir(PINA0, mmapGpio::OUTPUT);\n\
    \    rpiGpio.setPinDir(PINA1, mmapGpio::OUTPUT);\n    rpiGpio.setPinDir(PINA2,\
    \ mmapGpio::OUTPUT);\n    rpiGpio.setPinDir(PINA3, mmapGpio::OUTPUT);\n    //TURN\
    \ OFF ASAP!\n    rpiGpio.setPinDir(PINCS0, mmapGpio::OUTPUT);\n    rpiGpio.writePinHigh(PINCS0);\n\
    \    //... etc\n```\n\n```\nunsigned char dataStore[2][16];\n```\n\n# Step 13\n\
    \n```\nfor(int j=0;j<2;j++)\n{\n    for(int k=0;k<16;k++)\n    {\n        dataStore[j][k]=64;\n\
    \    }\n}\n```\n\n# Step 09\n\n```\nint blockCounter=0;\nint rowCounter=0;\nwhile(1)\n\
    {\n    blockCounter++;\n    if(blockCounter==16)\n    {\n        if(rowCounter==0)\n\
    \        {\n            blockCounter=0;\n            rowCounter+=1;\n        }\n\
    \        else\n        {\n            blockCounter=0;\n            rowCounter=0;\n\
    \        }\n    }\n```\n\n# Step 18\n\n```\nsafelySetRow(rowCounter, &rpiGpio);\n\
    setAddress(blockCounter, &rpiGpio);\nsetData(dataStore[rowCounter][blockCounter],\
    \ &rpiGpio);\nusleep(50);\n}\nreturn 0;\n}\n```"
