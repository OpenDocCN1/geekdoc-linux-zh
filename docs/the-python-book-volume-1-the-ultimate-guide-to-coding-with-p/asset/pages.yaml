  md: "# Create with Python\n\n```\ndef build(self):\n    return TicTacToeGrid()\n\
    \    # Replaces the previous label\n```\n\nWith this complete you can run your\
    \ main Python file again and enjoy your new program. All being well, the single\
    \ Label is replaced by a grid of nine buttons, each of which you can click it\
    \ will automatically change colour and release (you’ll see the printed output\
    \ information from our binding). We could customise the appearance by modifying\
    \ other properties of the Button, but for now we’ll leave them as they are.\n\n\
    # Has anyone won yet?\n\nWe’ll want to keep track of the state of the board to\
    \ check if anyone has won, which we can do with a couple more Kivy properties:\n\
    \n```\nfrom kivy.properties import \\\n    (ListProperty, NumericProperty)\n\n\
    class TicTacToeGrid(GridLayout):\n    status = ListProperty([0, 0, 0,\n      \
    \                     0, 0, 0,\n                           0, 0, 0])\n    current_player\
    \ = NumericProperty()\n```\n\nThis adds an internal status list representing who\
    \ has played where, and a number to represent the current player (1 for ‘O’, -1\
    \ for ‘X’). By placing these numbers in our status list, we’ll know if somebody\
    \ wins because the sum of a row, column or diagonal will be +-3. Now we can update\
    \ our graphical grid when a move is played (Fig. 02).\n\nYou can run your app\
    \ again to see exactly what this did, and you’ll find that clicking each button\
    \ now places an ‘O’ or ‘X’ as well as a coloured background depending on whose\
    \ turn it is to play. Not only that, but you can only play one move in each button\
    \ thanks to our status array keeping track of existing moves.\n\nThis is enough\
    \ to play the game but there’s one vital element missing... a big pop-up telling\
    \ you when you’ve won! Before we can do that, we need to add some code to check\
    \ if the game is over.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_109_0.png)\n\
    \nKivy properties have another useful feature here, whenever they change they\
    \ automatically call an ‘on_propertyname’ method if it exists and dispatch a corresponding\
    \ event in Kivy’s event system. That makes it very easy to write code that will\
    \ run when a property changes, both in Python and kv language. In our case we\
    \ can use it to check the status list every time it is updated, doing something\
    \ special if a player has filled a column, row or diagonal.\n\n```\ndef on_status(self,\
    \ instance, new_value):\n    status = new_value\n    # Sum each row, column and\
    \ diagonal.\n    # Could be shorter, but let’s be extra\n    # clear what’s going\
    \ on\n    sums = [sum(status[0::]),  # rows\n            sum(status[1::]),\n \
    \           sum(status[2::]),\n            sum(status[::3]),  # columns\n    \
    \        sum(status[1::3]),\n            sum(status[2::3]),\n            sum(status[::4]),\
    \  # diagonals\n            sum(status[2::4])]\n    # Sums can only be +-3 if\
    \ one player\n    # filled the whole line\n    if 3 in sums:\n        print(\"\
    O’s win!\")\n    elif -3 in sums:\n        print(\"X’s win!\")\n    elif 0 not\
    \ in self.status:  # Grid full\n        print(\"Draw!\")\n```\n\nThis covers the\
    \ basic detection of a won or drawn board, but it only prints the result to stdout.\
    \ At this stage we probably want to reset the board so that the players can try\
    \ again, along with displaying a graphical indicator of the result (Fig. 03).\n\
    \nFinally, we can modify the ‘on_status’ method to both reset the board and display\
    \ the winner in a ModalView widget.\n\n```\nfrom kivy.uix.modalview import ModalView\n\
    \nThis is a pop-up widget that draws itself on top of everything else rather than\
    \ as part of the normal widget tree. It also automatically closes when the user\
    \ clicks or taps outside it.\n\nwinner = None\nif -3 in sums:\n    winner = 'X’s\
    \ win!'\nelif 3 in sums:\n    winner = 'O’s win!'\nelif 0 not in self.status:\n\
    \    winner = 'Draw...nobody wins!'\n\nif winner:\n    popup = ModalView(size_hint=0.75,\
    \ 0.5))\n    victory_label = Label(text=winner,\n```"
