  md: "we'll be using that later as we start handling Twitter data.\nHaving Flask\
    \ use a rendering engine is super-simple. Flask comes packaged with the Jinja2\
    \ template rendering engine, so we've nothing to install – we just need to import\
    \ the package into the project. We can do this by adding render_template to the\
    \ end of our from flask import [...] statement.\n\n# 03 Our first template\n\n\
    Now that we have a rendering engine, we need to create some templates for it to\
    \ use. In the root of our project's folder, create a new folder called templates.\
    \ Whenever we try to render a template, Flask will look in this folder for the\
    \ template specified. To get to grips with templating, we'll rewrite some of our\
    \ authentication logic to use a template, rather than manually requesting endpoints.\
    \ In templates, create an index.html file. You can treat this HTML file like any\
    \ other – included in the resources for this tutorial is an index.html that includes\
    \ all of the necessary head tags and <!DOCTYPE> declarations for this file.\n\n\
    # 04 Rendering our template\n\nIn server.py, let's create a route for '/' to handle\
    \ the authorisation process.\n\n```\n@app.route('/')\ndef home():\n\n    if not\
    \ 'oauth_token' in session:\n        session.clear()\n        session['oauth_secret']\
    \ = ''\n        session['oauth_token'] = ''\n\n    return render_template('index.html')\n\
    ```\n\nIt's a simple function: all we want to do is check whether or not we have\
    \ an oauth_token already and create those properties in the Flask session so we\
    \ don't throw an error if we try to access it erroneously. In order to send our\
    \ generated template in response to the request, we return render_template('index.html').\n\
    \n# 05 Template variables\n\nWe can choose to send variables to our template with\
    \ render_template('index.htm', variableOne=value, variableTwo=value) but in this\
    \ instance we don't need as each template has access to the request and session\
    \ variables.\n\n```\n{% if session[\"oauth_token\"] != \"\" %}\n<div>Already Authorised</h1>\n\
    <div class=\"dialog\">\n<p>Hello, You've authenticated<br>Let's <a href=\"/get-tweets\"\
    >get some tweets</a></p>\n</div>\n{% else %}\n<h1>Authorisation required</h1>\n\
    <div class=\"dialog\">\n<p>We need to <a href=\"/authenticate\">authenticate</a></p>\n\
    </div>\n{% endif %}\n```\n\nThe BSD-licensed Flask is easy to set up and use –\
    \ check out the website for more info\n\n![](img/3b256f430f51c98f1315671f6e4eec19_74_0.png)\n\
    \noverview // docs // community // snippets // extensions // search\n\nFlask is\
    \ a microframework for Python based on Werkzeug, Jinja 2 and good intentions.\
    \ And before you ask: It's BSD licensed!\n\n# Flask is Fun\n\nLatest Version:\
    \ 0.10\n\n```\nfrom flask import Flask\napp = Flask(__name__)\n\n@app.route('/')\n\
    def hello():\n    return \"Hello World!\"\n\nif __name__ == \"__main__\":\n  \
    \  app.run()\n```\n\n# And Easy to Setup\n\n```\n$ pip install Flask\n$ python\
    \ hello.py\n* Running on http://localhost:5000/\n```\n\n# Interested?\n\n+   -\
    \ Download latest release (0.10)\n+   - Read the documentation or download as\
    \ PDF and zipped HTML\n+   - Join the mailinglist\n+   - Fork it on github\n+\
    \   - Add issues and feature requests\n\n![](img/3b256f430f51c98f1315671f6e4eec19_74_1.png)"
  merge: -1
