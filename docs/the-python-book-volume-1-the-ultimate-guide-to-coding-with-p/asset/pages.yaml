  md: "> \"Our LED model has a total of 32 inputs, which overwhelms older versions\"\
    \n\n![](img/3b256f430f51c98f1315671f6e4eec19_162_0.png)\n\nAbove The extended\
    \ version of this schematic is inside FileSilo.co.uk – just sign in and download\n\
    \n# Full code listing\n\n```\nStep 12\n#include \"bcm2835.h\"\n#include <unistd.h>\n\
    #include <stdio.h>\n\n#define PINA0 2 // 3\n#define PINA1 3 // 5\n#define PINA2\
    \ 4 // 7\n#define PINA3 14// 8\n#define PINC50 17// 11\n#define PINC51 18// 12\n\
    \n#define PIN D0 23// 16\n#define PIN D1 24// 18\n#define PIN D2 10// 19\n#define\
    \ PIN D3 9 // 21\n#define PIN D4 25// 22\n#define PIN D5 11// 23\n#define PIN\
    \ D6 8 // 24\n#define PIN D7 7 // 26\n```\n\n```\nStep 07\nvoid setAddress(unsigned\
    \ char _which, mmapGpio* _where)\n{\n if(_which&1)\n {\n  _where->writePinHigh(PINA0);\n\
    \ }\n else\n {\n  _where->writePinLow(PINA0);\n }\n if(_which&2)\n {\n  _where->writePinHigh(PINA1);\n\
    \ }\n else\n {\n  _where->writePinLow(PINA1);\n }\n\n if(_which&4)\n {\n  _where->writePinHigh(PINA2);\n\
    \ }\n else\n {\n  _where->writePinLow(PINA2);\n }\n if(_which&8)\n {\n  _where->writePinHigh(PINA3);\n\
    \ }\n else\n {\n  _where->writePinLow(PINA3);\n }\n}\n```\n\n```\nStep 03\nvoid\
    \ safelySetRow(unsigned char _which, mmapGpio* _where)\n{\n _where->writePinHigh(PINC50);\n\
    \ _where->writePinHigh(PINC51);\n if(_which==0)\n {\n  _where->writePinLow(PINC50);\n\
    \ }\n else\n {\n```\n\n# 03 Harness the MUX\n\nOur LED module has a total of 32\
    \ inputs, which overwhelms older versions of the RPi. The first way to restrict\
    \ their number comes in the shape of the 74HC238, a component described as a 3-to-8\
    \ line decoder/demultiplexer. Its function is described in the Figure B image\
    \ on the next page.\n\n# 04 Separate concerns\n\nChip two goes by the name of\
    \ 74HC244, which is described as an octal buffer with tri-state capability. Tri-State\
    \ outputs can physically disconnect themselves from the bus line. This permits\
    \ you to tie their outputs together without fear of short circuits. As long as\
    \ all but one chip are in tri-state mode, no current can flow between high and\
    \ low output pins.\n\n# 05 Round them up\n\nFour GPIO pins control the enabled\
    \ display 'line'. Three pins configure the address which is to be emitted, while\
    \ the signal emitted from the fourth pin is connected to the activity inputs.\
    \ This ensures that but one IC is active. The 74HC244 ensures that but one of\
    \ the two groups is active.\n\n# 06 Configure the pins\n\nWe used a library from\
    \ Hussam Al-Hertani's Hertaville blog (hertaville.com/2014/07/07/rpimmappgpio).\
    \ The first step involves setting output functions. As the GPIOs are set to outputs,\
    \ the tri-state feature might connect the internal state to the output pins of\
    \ the IC. This could lead to internal shorting if the output is not turned off."
