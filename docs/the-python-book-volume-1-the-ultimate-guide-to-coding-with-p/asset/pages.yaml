    At this point, the admin interface is working. But we need a way to display the
    data that we have added using the admin interface. But there is no public interface.
    Let’s create it now.


    We will have to begin by editing the main urls.py (ludissueTracker/urls.py).


    ```

    urlpatterns = patterns(''''

