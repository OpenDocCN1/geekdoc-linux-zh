- pgno: 68
  md: "# 32. Using regular expression-based search\n\nThe ‘re’ module makes it very\
    \ easy to use regexp-based searches. You can use the function re.search() with\
    \ a regexp-based expression.\n\n```\nCheck out the example below.\n\nExample:\n\
    >>> import re\n>>> s = “Kunal is a bad boy”\n>>> if re.search(“K”, s): print “Match!”\n\
    Match!\n>>> if re.search(“[^a-z]”, s): print “Match!” # char literal\n... \nMatch!\n\
    >>> if re.search(“[0-9]”, s): print “Match!” # digits class\n...\n```\n\n# 33.\
    \ Working with bz2 (.bz2) compression format\n\nYou can use the module ‘bz2’ to\
    \ read and write data using the bz2 compression algorithm.\n\n```\nbz2.compress()\
    \ : For bz2 compression\nbz2.decompress() : For bz2 decompression\n\nExample:\n\
    # File: bz2-example.py\nimport bz2\nMESSAGE = “Kunal is a bad boy”\ncompressed_message\
    \ = bz2.compress(MESSAGE)\nprint “original:”, repr(MESSAGE)\nprint “compressed\
    \ message:”, repr(compressed_message)\nprint “decompressed message:”, repr(bz2.decompress(compressed_message))\n\
    \nOutput:\n$ python bz2-example.py\noriginal: ‘Kunal is a bad boy’\ncompressed\
    \ message: ‘BZh91AY&SY...’\ndecompressed message: ‘Kunal is a bad boy’\n```\n\n\
    # 34. Using SQLite database with Python\n\nSQLite is fast becoming a very popular\
    \ embedded database because of its zero configuration needed, and superior levels\
    \ of performance. You can use the module ‘sqlite3’ in order to work with SQLite\
    \ databases.\n\n```\nExample:\n>>> import sqlite3\n>>> connection = sqlite3.connect(‘test.db’)\n\
    >>> curs = connection.cursor()\n>>> curs.execute(‘’’create table item (id integer\
    \ primary key, item text unique, name text, item_code text, price real)’’’)\n\
    <sqlite3.Cursor object at 0x1004a2b30>\n```\n\n# 35. Working with zip files\n\n\
    You can use the module ‘zipfile’ to work with zip files.\n\n```\nzipfile.ZipFile(filename,\
    \ mode[‘r’, compression[, allowZip64=True]])\nOpen a zip file, where the file\
    \ can be either a path to a file (a string) or a file-like object.\nzipfile.close()\n\
    Close the archive file. You must call ‘close()’ before exiting your program or\
    \ essential records will not be written.\nzipfile.extract(member[, path[, pwd]])\n\
    ```\n\nExtract a member from the archive to the current working directory. ‘member’\
    \ must be its full name (or a zipinfo object). Its file information is extracted\
    \ as accurately as possible. ‘path’ specifies a different directory to extract\
    \ to. ‘member’ can be a filename or a zipinfo object.\n\n# 36. Using UNIX-style\
    \ wildcards to search for filenames\n\nYou can use the module ‘glob’ to find all\
    \ the pathnames matching a pattern according to the rules used by the UNIX shell.\
    \ *, ?, and character ranges expressed with [] will be matched.\n\n```\nExample:\n\
    >>> import glob\n>>> glob.glob(‘./[0-9].*’)\n[‘./1.gif’, ‘./2.txt’]\n>>> glob.glob(‘*.gif’)\n\
    [‘1.gif’, ‘card.gif’]\n>>> glob.glob(‘?.gif’)\n[‘1.gif’]\n```\n\n# 37. Performing\
    \ basic file operations (copy, delete and rename)\n\nYou can use the module ‘shutil’\
    \ to perform basic file operation at a high level. This module works with your\
    \ regular files and so will not work with special files like named pipes, block\
    \ devices, and so on.\n\n```\nshutil.copy(src,dst)\nCopies the file src to the\
    \ file or directory dst.\nshutil.copymode(src,dst)\nCopies the file permissions\
    \ from src to dst.\nshutil.move(src,dst)\nMoves a file or directory to dst.\n\
    shutil.copytree(src, dst, symlinks=[, ignore])\nRecursively copy an entire directory\
    \ src.\nshutil.rmtree(path [, ignore_errors [, onerror]])\nDeletes an entire directory.\n\
    ```\n\n# 38. Executing UNIX commands from Python\n\nYou can use double commands\
    \ to execute UNIX commands. This is not available in Python 3 – instead you need\
    \ to use the module ‘subprocess’.\n\n```\nExample:\n>>> import commands\n>>> commands.getoutput(‘ls’)\n\
    ‘bz2-example.py\\ntest.py’\n```\n\n# 39. Reading environment variables\n\nYou\
    \ can use the module ‘os’ to gather operating-system-specific information.\n\n\
    ```\nExample:\n>>> import os\n>>> os.path <module ‘posixpath’ from ‘/usr/lib/python2.6/posixpath.pyc’>\n\
    >>> os.environ {‘LANG’: ‘en_US’, ‘TERM’: ‘xterm-color’, ‘SHELL’: ‘/bin/bash’,\
    \ ‘LESSCLOSE’: ‘/usr/bin/lesspipe %s %s’, ‘XDG_SESSION_COOKIE’: ‘4925c4644597c791c704656354adf56d6-1257673132.347986-1117793225’,\
    \ ‘SHLVL’: ‘1’, ‘SSH_TTY’: ‘/dev/pts/2’, ‘PWD’: ‘/home/kunal’, ‘LESSOPEN’: ‘|\
    \ /usr/bin/lesspipe’}\n>>> os.name\n‘posix’\n>>> os.linesep\n‘\\n’\n```"
  merge: -1
