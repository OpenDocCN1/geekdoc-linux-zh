  md: "# Use the setBlocks function to set a number of blocks simultaneously\n\nAbove\
    \ Left MinecraftPi API works on multiple languages - look out for Python in this\
    \ tutorial\n\nAbove Right Make use of the module to program games, movements and\
    \ more\n\n# 13 getPos\n\nLet's start out with a simple operation with the API\
    \ - finding your location. Knowing exactly where the player is in the game world\
    \ is a surprisingly powerful and useful ability in Minecraft Pi. You can use it\
    \ to help you do lots of things, including setting blocks near (or under) the\
    \ player and triggering events (like finding specific locations). Below we'll\
    \ find the player location and set it to the variable my_pos and prove that it\
    \ works by printing to the chat window.\n\n```\nfrom mcpi.minecraft import Minecraft\n\
    from mcpi import import block\nimport time\n\nmc = Minecraft.create()\nmc.postToChat(\"\
    Minecraft API Connected\")\nwhile True:\n    my_pos = mc.player.getPos()\n   \
    \ mc.postToChat(\"My position is:\" + str(my_pos))\n    time.sleep(1)\n```\n\n\
    # 14 setBlock\n\nThe next most common action is setting a block to a certain type.\
    \ You can find the full list of available blocks in the mcpi folder in a script\
    \ called 'blocks.py'. We can append to our script in Step 13 by dropping a particular\
    \ block type in our wake as we walk around the game world. After the 'mc.postToChat'\
    \ line in our previous script add: mc.setBlock(my_pos, block.STONE) so the while\
    \ loop section of the script now looks like this:\n\n```\nmc.postToChat(\"Stone\
    \ path model\")\nwhile True:\n    my_pos = mc.player.getPos()\n    mc.setBlock((my_pos),\
    \ block.STONE)\n    time.sleep(1)\n```\n\nNow, when you activate this script when\
    \ playing the game, you should notice that your character will drop a block of\
    \ stone every second at your current location. You should also consider making\
    \ use of the setBlocks function to set a number of blocks simultaneously using\
    \ the start co-ordinates and the end co-ordinates - this can help you make bigger\
    \ structures.\n\n# 15 Teleport Steve\n\nSo far we've read the location of the\
    \ player and used it in the game, let's finish off by manipulating the player's\
    \ location using the setPos method. In the following script we're going to draw\
    \ the player back to the origin point, assuming they've wandered off and got lost:\n\
    \n```\nfrom mcpi.minecraft import Minecraft\nfrom mcpi import import block\nimport\
    \ time\n\nmc = Minecraft.create()\nmc.postToChat(\"Minecraft API Connected\")\n\
    \nmc.player.setPos(0, 10, 0)\n```\n\nIf you wanted to drop the player from a great\
    \ height instead, you would change the Y co-ordinate to a large positive number.\
    \ For example:\n\nmc.player.setPos(0, 65, 0).\n\n# Enter the Kano\n\nIf you've\
    \ got a young Minecraft addict in your house that isn't quite ready to try out\
    \ Python scripting, there is another avenue for you. Kano OS is a new operating\
    \ system for the Raspberry Pi designed for younger children. Integrated into the\
    \ OS is a modified version of Minecraft Pi, which uses a Scratch-like visual programming\
    \ interface. It allows you to snap blocks together to manipulate the Minecraft\
    \ world in much the same way as we have demonstrated here. You can learn more\
    \ at www.kano.me/downloads\n\n| AIR | = block(0) |\n| STONE | = block(1) |\n|\
    \ GRASS | = block(2) |\n| DIRT | = block(3) |\n| COBBLESTONE | = block(4) |\n\
    | WOOD_PLANKS | = block(5) |\n| SAPLING | = block(6) |\n| BEDROCK | = block(7)\
    \ |\n| WATER | = block(8) |\n| WATER_STATIONARY | = block(9) |\n| LAVA | = block(10)\
    \ |\n| LAVA_STATIONARY | = block(11) |\n| SAND | = block(12) |\n| GRAVEL | = block(13)\
    \ |\n| GOLD_ORE | = block(14) |\n| IRON_ORE | = block(15) |\n| COAL_ORE | = block(16)\
    \ |\n| WOOD | = block(17) |\n| LEAVES | = block(18) |\n\nAbove The Minecraft Python\
    \ module allows you to create all materials any way you wish\n\n![](img/3b256f430f51c98f1315671f6e4eec19_160_0.png)\n\
    \n![](img/3b256f430f51c98f1315671f6e4eec19_160_1.png)"
