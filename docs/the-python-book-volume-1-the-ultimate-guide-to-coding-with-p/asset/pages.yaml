    ```

    # To save us writing lots of python code

    # we are using the list_detail generic view


    #list detail is the name of view we are using

    urlpatterns = patterns(''django.views.generic.list_detail'',

    #issue-list and issue-detail are the

    ```


    ```

    template names

    #which will be looked in the default #directories

    url(r''^$'', object_list, info, name=''issue-list''),

    url(r''^(?P<object_id>\d+)/$'', object_detail, info, name=''issue-detail''),

    )

    ```


    To display an issue list and details, we are using a Django feature called generic
    views. In this case we are using views called list and details. This allow us
    to create an issue list view and issue detail view. These views are then applied
    using the issue_list.html and issue_detail.html template. In the following steps
    we will create the template files.


    # 09 Setting up template and media directories


    In this step we will create the template and media directories. We have already
    mentioned the template directory as TEMPLATE_DIRS = ( getabs path(''templates'')
    )


    Which translates to ludissueTracker/ludissueTracker/templates/. Since we will
    be accessing the templates from the ludissues app, the complete directory path
    would be ludissueTracker/ludissueTracker/templates/ludissues. Create these folders
    in your project folder.


    Also, create the directory ludissueTracker/ludissueTracker/media/ for holding
    the CSS file. Copy the style.css file from the resources directory of the code
    folder.


    To serve files from this folder we need to make it available publicly. To do that,
    open settings.py and add the following lines in ludissueTracker/urls.py:


    ```

    from django.conf.urls import patterns, include, url

    from django.conf import settings

    # Uncomment the next two lines to enable the admin:

    from django.contrib import admin

    admin.autodiscover()


    urlpatterns = patterns('''',

    (r''^'', include(''ludissues.urls'')),

    (r''^admin/'', include(admin.site.

    ```


    # Admin homepage


    Click the Add button next to Issues. Here you will notice that you can enter Owner,
    Status and Summary for the issue, but what about the opened_on and modified_on
    field that we defined while modelling the app? They are not here because they
    are not supposed to be entered by the user. opened_on will automatically be set
    to the date time it is created and modified_on will automatically be set to the
    date time on which an issue is modified.


    Another cool thing is that the owner field is automatically populated with all
    the users inside the site.


    We have defined our list view to show ID, name, status, owner and ''modified on''
    in the model. You can get to this view by navigating to http://localhost:8000/admin/ludissues/issue/.


    # The ''Add issue'' menu


    # The list view for issues


    ![](img/3b256f430f51c98f1315671f6e4eec19_63_0.png)


    ![](img/3b256f430f51c98f1315671f6e4eec19_63_1.png)


    ![](img/3b256f430f51c98f1315671f6e4eec19_63_2.png)'
