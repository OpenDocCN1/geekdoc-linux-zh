    \              break\n            except ValueError:\n                pass\n \
    \           print(\"Oops I didn't understand that. Please enter 1, 2, 3, 4 or\
    \ 5.\")\n        dice_changes[iterations-1] = selection-1\n        print(\"You\
    \ have changed dice\", selection)\n    iterations = 0\n    while iterations <\
    \ rerolls:\n        iterations = iterations + 1\n        replacement = dice[ dice_changes[iterations-1]\
    \ ]\n        dice[ dice_changes[iterations-1] ] = replacement\n    dice.sort()\n\
    \    for i in range(len(dice)):\n        print(\"Dice\", i + 1, \":\", names[dice[i]])\n\
    \    result = hand(dice)\n    print(\"You finish with\", result)\n\ndef roll(roll_number):\n\
    \    numbers = range(1,7)\n    dice = []\n    iterations = 0\n    while iterations\
    \ < roll_number:\n        iterations = iterations + 1\n        dice[iterations-1]\
    \ = random.choice(numbers)\n    return dice\n\ndef hand(dice):\n    dice_hand\
    \ = [len(list(group)) for key, group in groupby(dice)]\n    dice_hand.sort(reverse=True)\n\
    \    straight1 = [1,2,3,4,5]\n    straight2 = [2,3,4,5,6]\n    if dice == straight1\
    \ or dice == straight2:\n        return \"a straight!\"\n    elif dice_hand[0]\
    \ == 5:\n        return \"Five of a kind!\"\n    elif dice_hand[0] == 4:\n   \
    \     return \"four of a kind!\"\n    elif dice_hand[0] == 3 and dice_hand[1]\
    \ == 2:\n        return \"a full house!\"\n    elif dice_hand[0] == 3:\n     \
    \   return \"three of a kind.\"\n    elif dice_hand[0] == 2:\n        if dice_hand[1]\
    \ == 2:\n            return \"two pair.\"\n        else:\n            return \"\
    one pair.\"\n    else:\n        return \"a high card.\"\n\ndef play_again():\n\
    \    answer = raw_input(\"Would you like to play again? y/n: \")\n    if answer\
    \ in (\"y\", \"Y\", \"yes\", \"Yes\", \"of course!\"):\n        return answer\n\
    \    else:\n        print \"Thank you very much for playing our game. See you\
    \ next time!\"\n\ndef scores():\n    global player_score, computer_score\n   \
    \ print \"FINAL SCORE\"\n    print \"Player: \", player_score\n    print \"Computer:\
    \ \", computer_score\n\nif __name__ == '__main__':\n    start()\n```"
