    \  self.listening = False\n    self.socket.close()\n    # We won't see this if\
    \ it's us that's quitting as the window will be gone shortly\n    gobject.idle_add(self.window.add_text,\
    \ \"Server has quit.\\n\")\n```\n\n```\ndef handle_msg(self, data):\n    if data\
    \ == \"QUIT\":\n        # Server is quitting\n        self.tidy_up()\n    elif\
