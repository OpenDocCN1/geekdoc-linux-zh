  md: "# Play poker dice using Python\n\nPut on your poker face and get ready to gamble\
    \ as you hone your programming skill with a bit of poker dice\n\nSo you've learnt\
    \ how to program tic-tac-toe and guessed your way to victory at hangman. Now it's\
    \ time to head to Las Vegas and play our cards right. Or in this case, virtual\
    \ dice, and more like Reno as we continue with our Python game tutorials and introduce\
    \ you to some poker dice.\n\nWe're again using some of the lessons we've already\
    \ learnt, including random number generation, list creation and modification,\
    \ human input, rule setting, scoring and more. But we'll also be adding some new\
    \ skills in this tutorial. Namely, we'll be creating and appending lists with\
    \ random numbers, and using functions multiple times in one block of code to cut\
    \ down on bloat.\n\nAgain, we recommend using IDLE, and we're using Python 2 to\
    \ ensure compatibility with a wider variety of distros, including the Raspberry\
    \ Pi. So, we hope luck is a lady for you and that the odds are ever in your favour\
    \ – just keep those fingers crossed that you don't roll a snake eyes (we are coding\
    \ in Python, after all!)\n\n# Resources\n\nPython 2: www.python.org/download\n\
    \nIDLE: www.python.org/idle\n\n# The Start\n\nHere we're doing some minor setups\
    \ so we can get our code to run with some extra modules not included with the\
    \ basics\n\n# The Rules\n\nWe're setting names for each dice roll so they can\
    \ be properly identified to the player – much more interesting than numbers\n\n\
    # The Score\n\nAgain we've got some basic variables set up so we can keep score\
    \ of the games if we want to\n\n# The Script\n\nThe game is handled here, passing\
    \ the player onto the next function to actually play, and handling the end of\
    \ the session as well\n\n# The Game\n\nWe access the full game loop via here,\
    \ and the function that allows us to play again if we're so inclined\n\n# The\
    \ Throw\n\nThe initial hand is dealt, so to speak, at the start of the throws\
    \ function. This function handles all the decision making in the game, while passing\
    \ off the dice rolls to another function\n\n# The Hand\n\nWe've also got a special\
    \ function so we can inform the player exactly what style of hand they have\n\n\
    # The Decision\n\nThere are two rounds in this version of poker dice, and you\
    \ can select how many dice you wish to re-roll in this small while loop that makes\
    \ sure you're also using a correct number\n\n# Code listing\n\n```\n#!/usr/bin/env\
    \ python2\nimport random\nfrom itertools import groupby\n\nnine = 1\nten = 2\n\
    jack = 3\nqueen = 4\nking = 5\nace = 6\n\nnames = { nine: \"9\", ten: \"10\",\
    \ jack: \"J\", queen: \"Q\", king: \"K\", ace: \"A\" }\n\nplayer_score = 0\ncomputer_score\
    \ = 0\n\ndef start():\n    print \"Let's play a game of Linux Poker Dice.\"\n\
    \    while game():\n        pass\n    scores()\n\ndef game():\n    print \"The\
    \ computer will help you throw your 5 dice\"\n    throw()\n    return play_again()\n\
    \ndef throws():\n    roll_number = 5\n    dice = []\n    dice.sort()\n    for\
    \ i in range(len(dice)):\n        print \"Dice\", i + 1, \":\", names[dice[i]]\n\
    \n    result = hand(dice)\n    print \"You currently have\", result\n\n    while\
    \ True:\n        rerolls = input(\"How many dice do you want to throw again? \"\
    )\n        try:\n            if rerolls in (1,2,3,4,5):\n                break\n\
    \        except ValueError:\n            pass\n        print \"Oops! I didn't\
    \ understand that. Please enter 1, 2, 3, 4 or 5.\"\n```"
