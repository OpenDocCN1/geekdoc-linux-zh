- pgno: 127
  md: '# # Make a visual novel

    # game with Python


    Bridge the gap between books and videogames by creating an interactive novel or
    choose-your-own-adventure with Python and Pygame


    ![](img/3b256f430f51c98f1315671f6e4eec19_127_0.png)


    Change scenes to add more depth to the story, and allow the game to have decisions
    and routes


    # ## Resources


    +   - **Python 2:** www.python.org/

    +   - **Pygame:** pygame.org/download.shtml

    +   - **IDLE Python IDE**

    +   - **Game assets**

    +   - **Code from FileSilo (optional)**


    **Most people look for a compelling story in modern videogames, and those that
    don’t have one are appearing less and less.** A great way to tell a pure story
    is through the genre of visual novels, and you can make one fairly simply in Python.
    These interactive novels are an extremely popular form of entertainment in Japan,
    and usually work by having the player click through a story and make decisions
    as they go along in order to experience different plot points and endings.


    In Python, this is a relatively simple project to create, but with the addition
    of the Pygame module we can make it easier still, and even more expandable for
    the future. Pygame adds better support for positioning the images and text, creating
    display windows and using mouse and keyboard inputs, thereby simplifying the coding
    process.


    We’ll be coding this in standard Python 2, so make sure to run it in IDLE 2 and
    not IDLE 3 while you’re writing, testing and coding.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 01 Get Pygame dependencies


    The best way to install Pygame for your system is to compile it. To do this you
    need to first install the right dependencies. Open up the terminal and install
    the following packages, which in Ubuntu looks like:


    ```

    $ sudo apt-get install mercurial python-dev python-numpy libav-tools libsdl-image1.2-dev
    libsdl-mixer1.2-dev libsdl-ttf2.0-dev libsmpeg-dev libsdl1.2-dev libportmidi-dev
    libswscale-dev libavformat-dev libavcodec-dev

    ```


    ![](img/3b256f430f51c98f1315671f6e4eec19_128_0.png)


    # 02 Get the Pygame code


    Next we need to download the code for Pygame direct from the source. Still in
    the terminal, you can do this by typing in:


    ```

    $ hg clone https://bitbucket.org/pygame/pygame

    ```


    Which will download it to the folder ''pygame''. Move to that using CD pygame
    in the terminal so we can continue building it.


    ![](img/3b256f430f51c98f1315671f6e4eec19_128_1.png)


    # 03 Build the Pygame module


    To install it, we need to do it in two steps. First we need to prepare the code
    to install using the terminal with:


    ```

    $ python setup.py build

    ```


    Once that''s finished you can then actually install it with:


    ```

    $ sudo python setup.py install

    ```


    This won''t take too long.


    ![](img/3b256f430f51c98f1315671f6e4eec19_128_2.png)


    # 04 Install in other ways


    If the above doesn''t work (or is a bit daunting) you can check the website for
    binary and executable files that will work on other operating systems and Linux
    distros. Head to http://pygame.org/download.shtml to get the files you need for
    your specific system, including Windows and OS X. The rest of the tutorial will
    work in any OS.


    # 05 Get the visual novel files


    We''ve uploaded the code to FileSilo, and here we''re going to walk you through
    what we''ve done to make it work. Download the files for the visual novel and
    unzip them. The two files we care about for the moment are the visualnovel.py
    and script.py python files – this is where all the important code is.


    ![](img/3b256f430f51c98f1315671f6e4eec19_128_3.png)


    # 06 Understand the script file


    For the moment the script file is small and literally just holds the script for
    the game. It''s made up of events for the visual novel to move between, line by
    line, by splitting it up into scenes. This includes the location of each line,
    the character, the actual line itself and information on how the game flows. These
    are matrices with the information in, and are completely customisable.'
  merge: -1
  img_proc: true
