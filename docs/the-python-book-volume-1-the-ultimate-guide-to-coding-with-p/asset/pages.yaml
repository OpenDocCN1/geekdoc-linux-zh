    \ the variable we want followed\n# by an equals sign, which is followed by the\
    \ value we want to store in the\n# variable. For example, the following line creates\
    \ a variable called\n# hello_str, containing the string Hello World.\nhello_str\
    \ = \"Hello World\"\n\nhello_int = 21\n\nhello_bool = True\n\nhello_tuple = (21,\
    \ 32)\n\nhello_list = [\"Hello\", \"this\", \"is\", \"a\", \"list\"]\n\n# This\
    \ list now contains 5 strings. Notice that there are no spaces\n# between these\
    \ strings so if you were to join them up so make a sentence\n# you'd have to add\
    \ a space between each element.\n\nhello_list = list()\nhello_list.append(\"Hello,\"\
    )\nhello_list.append(\"this\")\nhello_list.append(\"is\")\nhello_list.append(\"\
    a\")\nhello_list.append(\"list\")\n\n# The first line creates an empty list and\
    \ the following lines use the append\n# function of the list type to add elements\
    \ to the list. This way of using a\n# list isn't really very useful when working\
    \ with strings you know of in\n# advance, but it can be useful when working with\
    \ dynamic data such as user\n# input. This list will overwrite the first list\
    \ without any warning as we\n# are using the same variable name as the previous\
    \ list.\n\nhello_dict = {\"first_name\":\"Liam\",\n              \"last_name\"\
    :\"Fraser\",\n              \"eye_colour\":\"Blue\"}\n\n# Let's access some elements\
    \ inside our collections\n# We'll start by changing the value of the last string\
    \ in our hello_list and\n# add an exclamation mark to the end. The \"list\" string\
    \ is the 5th element\n# in the list. However, indexes in Python are zero-based,\
