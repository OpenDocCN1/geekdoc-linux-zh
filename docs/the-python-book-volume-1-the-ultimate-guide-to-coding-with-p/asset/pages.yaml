  img_proc: true
- pgno: 159
  md: '# Use Python with Pi


    ![](img/3b256f430f51c98f1315671f6e4eec19_159_0.png)


    # 08 Your first script


    Next we’ll create a quick test script and make sure that we can successfully use
    the Python Minecraft API from its new location. Using your favourite text editor,
    type the following and save it as ‘boilerplate.py’:


    ```

    from mcpi.minecraft import Minecraft

    from mcpi import block


    mc = Minecraft.create()

    mc.postToChat("Minecraft API Connected")

    ```


    If Minecraft Pi isn’t running, start it now. When you’re in the game, press Tab
    to release the mouse, open a terminal window and navigate to your Minecraft project
    folder.


    Once inside, type python boilerplate.py and hit return – you will see the message
    ‘Minecraft API Connected’ appear as text chat within Minecraft Pi. We recommend
    that you start all of your Minecraft Pi scripts with this boilerplate code.


    ![](img/3b256f430f51c98f1315671f6e4eec19_159_1.png)


    Above Print your position on the screen so you can understand the co-ordinate
    system


    so on. The most commonly used API features, though, are the ones that revolve
    around manipulating the player’s position and creating new blocks at set positions
    in the game world.


    corner of the screen, where they’re displayed. It’s worth taking a few minutes
    just to get familiar with the co-ordinates and how they change when you move around
    the game-world.


    # 09 It didn’t work?!


    If at this point you’re getting an error from Python, look back over your boilerplate
    code to ensure that everything’s correct – nine times out of ten, it’s because
    of a typo. If you’re getting an import error you may have had an issue copying
    the API folder to the new location. Retrace your steps from the beginning and
    try again.


    # 10 The fun starts here...


    Now that we’ve successfully tested our boilerplate code we can start having real
    fun with the Minecraft Pi API and Python. There are a wide range of options to
    take advantage of, such as getting and setting blocks, finding and setting the
    player’s position, changing and setting the camera and


    # 11 The co-ordinates system


    It’s impossible to do anything in Minecraft Pi unless you’re familiar with reading
    and interpreting the games co-ordinate system. It’s a fairly unusual system too,
    which switches the Y and Z co-ordinates in 3D space – in Minecraft Pi ‘X’ is sideways
    movement, ‘Z’ is forward movement and ‘Y’ is vertical movement. You can always
    find your current co-ordinates by glancing in the top-left


    # 12 Origin point


    When you load up a new Minecraft game for the first time, you’ll start at the
    exact centre of the map, meaning your co-ordinates will be 0, 0, 0. Why is this
    useful? Because it makes building blocks and collections of blocks much easier
    for the beginner. At the origin point you don’t need to work out where your surrounding
    blocks are – they’re simply plus or minus 0.'
