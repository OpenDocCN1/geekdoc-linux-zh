- pgno: 145
  md: "# Web development\n\n# 09 Wrong page\n\nLet's add a quick bit of code to return\
    \ somebody to the previous page if they get the URL wrong:\n\n```\nfrom django.core.paginator\
    \ import Paginator, EmptyPage, InvalidPage\n\ntry:\n    post_list = paginator.page(list_page)\n\
    except (EmptyPage, InvalidPage):\n    post_list = paginator.\npage(paginator.num_pages)\n\
    The last part replaces 'post_list = paginator.page(list_page)'.\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_145_0.png)\n\
    \n# 10 Have your say\n\nEveryone has their opinion on the internet. You can give\
    \ your readers the ability to comment, and we'll start by editing models.py:\n\
    \n```\nclass Comment(models.Model):\n    author = models.CharField(max_length=50)\n\
    \    text = models.TextField()\n    post = models.ForeignKey(Post)\n    def __unicode__(self):\n\
    \        return self.post, self.text\nWe've made it so they can put their name\
    \ with a comment.\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_145_1.png)\n\
    \n# 11 Back to the comment\n\nWe now need to add a small line to the urls.py file\
    \ in myblog so the comment can be posted then sent back to the original page:\n\
    \n```\nurl(r'^myblog/add_comment/(\\d+)$/', 'blog.urls.add_comment'),\nThis URL\
    \ pattern calls the ID of the page that you're on.\n```\n\n# We need to be able\
    \ to process the data and metadata in the forms\n\n# 12 Form a comment\n\nWe need\
    \ to be able to process the data and metadata in the forms, so let's add a class\
    \ to urls.py in the blog folder with the following additions:\n\n```\nfrom django.forms\
    \ import ModelForm\nfrom blog.models import Post, Comment\nclass CommentForm(ModelForm):\n\
    \    class Meta:\n        model = Comment\n        exclude = ['post']\n```\n\n\
    ![](img/3b256f430f51c98f1315671f6e4eec19_145_2.png)\n\n# 13 In the post\n\nWe\
    \ need to attribute the comments to the post they're being made on, so update\
    \ the post_page definition:\n\n```\nfrom django.core.context_processors import\
    \ csrf\nimport csrf\ndef post_page(request, post_id):\n    post_page = Post.objects.get(pk=post_id)\n\
    \    comments = Comment.objects.filter(post=post_page)\n    d = dict(post_page=post_page,\
    \ comments=comments, form=CommentForm())\n    d.update(csrf(request))\n    return\
    \ render_to_response('blog/post.html', d)\nThe CSRF tag is to prevent cross-site\
    \ request forgery.\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_145_3.png)\n\
    \n# 14 Comment template\n\nLet's get the post page ready for comments by adding\
    \ this to post.html:\n\n```\n<p>Comments:</p>\n{% for comment in comments %}\n\
    \    {{ comment.author }}\n    <p>{{ comment.text }}</p>\n{% endfor %}\n<strong>Add\
    \ comment</strong>\n<form action=\"{% url blog.urls.add_comment comment_id %}\"\
    \ method=\"POST\"{% csrf_token %}\">\nName {{ form.author }}\n<p>{{ form.text\
    \ }}</p>\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n# 15 Define\
    \ your comments\n\nThe final step is defining the comments in blog.urls.py and\
    \ it's a big one:\n\n```\ndef add_comment(request, comment_id):\n    p = request.POST\n\
    \    if p.has_key('text') and p['text']:\n        author = 'Anonymous'\n     \
    \   if p['author']: author = p['author']\n    p['author']\n    comment = Comment(post=Post.objects.get(pk=comment_id))\n\
    \    cf = CommentForm(p, instance=comment)\n    cf.fields['author'].required =\
    \ False\n    comment = False\n    cf.save(commit=False)\n    comment.author =\
    \ author\n    comment.save()\n    return HttpResponseRedirect(reverse('blog.urls.post_page',\
    \ args=[comment_id]))\nThis ensures text has been entered, and if not specified\
    \ author is 'Anonymous'. Before testing, run syncdb so comment tables can be created.\n\
    ```"
  merge: -1
  img_proc: true
