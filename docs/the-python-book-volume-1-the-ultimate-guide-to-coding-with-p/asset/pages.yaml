    \ = len(word)\n    clue = word_length * \"_\"\n    new_clue = \"\".join(clue)\n\
    \    word_output.set(new_clue)\n```\n\n```\nha_window = Toplevel()\nha_window.title(\"\
    Hangman\")\nincorrect_guesses = IntVar()\nincorrect_score = IntVar()\nplayer_score\
    \ = IntVar()\ncomputer_score = IntVar()\nresult_set = StringVar()\nletter_guess\
    \ = StringVar()\nword_output = StringVar()\nha_graphic = StringVar()\n```\n\n\
    ```\nha_frame = Frame(ha_window, padding = '3 3 12 12', width = 300)\nha_frame.grid(column=0,\
    \ row = 0, sticky=(N,E,S))\nha_frame.columnconfigure(0, weight=1)\nha_frame.rowconfigure(8,\
    \ weight=1)\n```\n\n```\nLabel(ha_frame, textvariable = ha_graphic).grid(column=2,\
    \ row = 1)\nLabel(ha_frame, text=\"Word\").grid(column=2, row = 2)\nLabel(ha_frame,\
    \ textvariable = word_output).grid(column=2, row = 3)\n```\n\n```\nLabel(ha_frame,\
    \ text=\"Enter a letter:\").grid(column=2, row = 4)\nha_entry = Entry(ha_frame,\
    \ exportselection = 0, textvariable = letter_guess).grid(column = 3, row = 5)\n\
    ha_button = Button(ha_frame, text = \"Go\", command = game).grid(column = 2, row\
    \ = 6)\n```\n\n```\nLabel(ha_frame, text = \"Wins\").grid(column = 1, row = 7,\
    \ sticky = W)\nLabel(ha_frame, textvariable = player_score).grid(column = 3, row\
    \ = 7, sticky = W)\nLabel(ha_frame, text = \"Losses\").grid(column = 1, row =\
    \ 8, sticky = W)\nLabel(ha_frame, textvariable = computer_score).grid(column =\
    \ 3, row = 8, sticky = W)\nLabel(ha_frame, textvariable = result_set).grid(column\
    \ = 1, row = 9, sticky = W)\nreplay_button = Button(ha_frame, text = \"Reset\"\
    , command = reset_game).grid(column = 2, row = 10)\n\nif __name__ == \"__main__\"\
    :\n    gui()\n```\n\n# ORIGINAL INTERFACE\n\nYou'll also need the interface code\
    \ from last issue, which already works with the modified Rock, Paper, Scissors\
    \ code. The way it was left off means it won't work with the new code, so you'll\
    \ have to change the command in each button from [game].start to [game].gui\n\n\
    # THE HANGMAN GUI\n\nPress the updated Hangman button to launch a new window.\
    \ Here we have the initial graphic, word clue and entry for the player to interact\
    \ with. The scores are set to zero, and no result message is displayed as no games\
    \ have been played yet.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_52_0.png)\n\
    \n# 10 Sanitise input\n\nThe guess_letter function purely gets the letter from\
    \ the player input variable, strips it of any formatting, makes it lower case,\
    \ and then returns it back to the game function. This is so the letter can be\
    \ used properly.\n\n# 11 New window\n\nWe use the Toplevel command from Tkinter\
    \ like last month to separate the loops of the main interface and game window.\
    \ We then use title to call it Hangman.\n\n# 12 Interface variables\n\nTkinter\
    \ only works with specific variables – we’ve created all the ones we need or can\
    \ use here. IntVars take integers, while StringVars take strings. We’ve used get\
    \ and set throughout the rest of the code with these to get and set values.\n\n\
    > The frame is set up as before\n\n# 13 Framed window\n\nThe frame is set up the\
    \ same way as last time. We pad the frame from the edge of the window, set a grid,\
    \ give it sticky points at compass points, and allow for setting objects with\
    \ specific row and column points.\n\n# 14 Clue to Hangman\n\nThese labels are\
    \ fairly straightforward – we’re either giving them fixed text, or telling them\
    \ to use a specific textvariable so they can be updated as we play the game.\n\
    \n# 15 Text entry\n\nEntry here sets a text box we will add the letters to. The\
    \ exportselection option makes it so selecting the letter won’t immediately copy\
    \ it to the clipboard, and the textvariable selection is where the code stores\
    \ the letter added. The button activates the game function, analysing the letter\
    \ the player entered.\n\n# 16 Results and reset\n\nThe rest of the code is similar\
    \ to what we’ve done already: labels to display fixed text and the scores/result\
    \ text that change. The button that activates the reset function is also put at\
    \ the bottom here. The final two lines allow us to import the module into the\
    \ interface code."
