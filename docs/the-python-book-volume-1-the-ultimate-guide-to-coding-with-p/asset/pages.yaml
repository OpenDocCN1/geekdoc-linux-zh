- pgno: 65
  md: '# 50 Python tips


    ![](img/3b256f430f51c98f1315671f6e4eec19_65_0.png)


    Python is a programming language that lets you work more quickly and integrate
    your systems more effectively. Today, Python is one of the most popular programming
    languages in the open source space. Look around and you will find it running everywhere,
    from various configuration tools to XML parsing. Here is the collection of 50
    gems to make your Python experience worthwhile...


    # Basics


    # 1. Running Python scripts


    On most of the UNIX systems, you can run Python scripts from the command line.


    ```

    $ python mypprog.py

    ```


    # 2. Running Python programs from Python interpreter


    The Python interactive interpreter makes it easy to try your first steps in programming
    and using all Python commands. You just issue each


    command at the command prompt (>>>), one by one, and the answer is immediate.


    Python interpreter can be started by issuing the command:


    ```

    $ python

    kunal@ubuntu:~$ python

    Python 2.6.2 (release26-maint, Apr 19 2009, 01:56:41)

    [GCC 4.3.3] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>> <type commands here>

    ```


    In this article, all the code starting at the >>> symbol is meant to be given
    at the Python prompt.


    It is also important to remember that Python takes tabs very seriously – so if
    you are receiving any error that mentions tabs, correct


    the tab spacing.


    # 3. Dynamic typing


    In Java, C++, and other statically typed languages, you must specify the data
    type of the function return value and each function argument. On the other hand,
    Python is a dynamically typed language. In Python you never have to explicitly
    specify the data type of anything. Based on what value you assign, Python will
    keep track of the data type internally.'
