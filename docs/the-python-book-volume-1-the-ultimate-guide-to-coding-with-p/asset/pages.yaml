  md: "# IPython also comes with its own Qt-based console\n\n```\nPython.framework/Versions/2.7/lib/python2.7/posixpath.py\n\
    Docstring:\nCommon operations on POSIX pathnames.\n```\n\n```\n%pdef %pdoc %pfile\
    \ %pinfo %pinfo2 %popd %pprint %precision %profile %prun %psource %pushd %pwd\
    \ %pycat %pylab %quickref %recall %rehashx %reload_ext %rep %rerun %reset %reset_selective\
    \ %run %save %sc %sx %tb %time %timeit %unalias %unload_ext %who %who_ls %whos\
    \ %xdel %xmode\n```\n\nInstead of importing this module directly, import os and\
    \ refer to this module as os.path. The 'os.path' name is an alias for this module\
    \ on POSIX systems; on other systems (eg Mac, Windows), os.path provides the same\
    \ operations in a manner specific to that platform, and is an alias to another\
    \ module (eg macpath, ntpath).\n\nSome of this can actually be useful on non-POSIX\
    \ systems too, eg for manipulation of the pathname component of URLs.\n\nYou can\
    \ also use double question marks (??) to view the source code for the relevant\
    \ object.\n\nMagic functions: IPython comes with a set of predefined 'magic functions'\
    \ that you can call with a command-line-style syntax. IPython 'magic' commands\
    \ are conventionally prefixed by %, but if the flag %automagic is set to on, then\
    \ you can call magic commands without the preceding %.\n\nTo view a list of available\
    \ magic functions, you can use 'magic function %lsmagic'. Magic functions include\
    \ functions that work with code such as %run, %edit, %macro, %recall etc; functions\
    \ that affect shell such as %colors, %xmode, %autoindent etc; and other functions\
    \ such as %reset, %timeit, %paste etc. Most of the cool features of IPython are\
    \ powered using magic functions.\n\n# Example:\n\n```\nIn [45]: %lsmagic\nAvailable\
    \ magic functions:\n%alias %autocall %autoindent %automagic %bookmark %cd %colors\
    \ %cpaste %debug %dhist %dirs %doc %docstring %edit %env %gui %hist %history %install_default_config\
    \ %install_profiles %load_ext %loadpy %logoff %logon %logstart %logstate %logstop\
    \ %lsmagic %macro %magic %page %paste %pastebin %pdb\n```\n\nAutomatic is OFF,\
    \ % prefix IS needed for magic functions\n\nTo view help on any Magic Function,\
    \ call '%somemagic?' to read its docstring.\n\n# Python script execution and runtime\
    \ code editing: You can use %run to run any Python script. You can also control-run\
    \ the Python script with pdb debugger using -d, or pdn profiler using -p. You\
    \ can also edit a Python script using the %edit command. %edit will open the given\
    \ Python script in the editor defined by the $EDITOR environment variable.\n\n\
    # Shell command support: If you are in the mood to just run a shell command, you\
    \ can do it very easily by prefixing the command with !.\n\n# Example:\n\n```\n\
    In [5]: !ps\n  PID TTY          TIME CMD\n 4508 ttys000   0:00.07 -bash\n 84275\
    \ ttys001   0:00.03 -bash\n 17958 ttys002   0:00.18 -bash\n```\n\n```\nIn [8]:\
    \ !clang prog.c -o prog\nprog.c:2:1: warning: type specifier missing, defaults\
    \ to 'int' [-Wimplicit-int]\nmain()\n...\n1 warning generated.\n```\n\nQt console\
    \ : IPython also comes with its own Qt-based console. This provides a number of\
    \ features that are only available in a GUI, such as inline figures, multiline\
    \ editing with syntax highlighting, and graphical calltips.\n\nYou can start the\
    \ Qt console with:\n$ ipython qtconsole\n\nIf you get errors related to missing\
    \ modules, make sure that you have installed the dependent packages, such as PyQt,\
    \ pygments, pexpect and ZeroMQ.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_96_0.png)\n\
    \n# IPython Qt console with GUI capabilities\n\n> As you can see, it's easy to\
    \ tailor Python for all your shell environment needs. Python modules like os,\
    \ subprocess and shutil are available at your disposal to do just about everything\
    \ you need using Python. Python turns this whole experience into an even more\
    \ complete package. You get to do everything a standard Python shell does and\
    \ with much more convenient features. IPython's magic functions really do provide\
    \ a magical Python shell experience. So next time you open a Bash session, think\
    \ again: why settle for gold when platinum is a step away?"
