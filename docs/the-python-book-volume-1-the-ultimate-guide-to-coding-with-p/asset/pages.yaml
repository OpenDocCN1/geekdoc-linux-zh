- pgno: 15
  md: '# 50


    # ESSENTIAL


    # PYTHON


    # COMMANDS


    Python is known as a very dense language, with lots of modules capable of doing
    almost anything. Here, we will look at the core essentials that everyone needs
    to know.


    Python has a massive environment of extra modules that can provide functionality
    in hundreds of different disciplines. However, every programming language has
    a core set of functionality that everyone should know in order to get useful work
    done. Python is no different in this regard. Here, we will look at 50 commands
    that we consider to be essential to programming in Python. Others may pick a slightly
    different set, but this list contains the best of the best.


    We will cover all of the basic commands, from importing extra modules at the beginning
    of a program to returning values to the calling environment at the end. We will
    also be looking at some commands that are useful in learning about the current
    session within Python, like the current list of variables that have been defined
    and how memory is being used.


    Because the Python environment involves using a lot of extra modules, we will
    also look at a few commands that are strictly outside of Python. We will see how
    to install external modules and how to manage multiple environments for different
    development projects. Since this is going to be a list of commands, there is the
    assumption that you already know the basics of how to use loops and conditional
    structures. This piece is designed to help you remember commands that you know
    you’ve seen before, and hopefully introduce you to a few that you may not have
    seen yet.


    Although we’ve done our best to pack everything you could ever need into 50 tips,
    Python is an expansive language that some commands will have been left out. Make
    some time to learn about the ones that we didn’t cover here, once you’ve mastered
    these.'
