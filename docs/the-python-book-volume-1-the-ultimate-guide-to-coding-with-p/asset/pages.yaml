  md: "# 01 New blog order\n\nWe left off last time with the blog displaying posts\
    \ in chronological order, which isn't very helpful to readers. To correct this,\
    \ open up urls.py in the blog folder and edit the following line:\n\n```\npost_list\
    \ = Post.objects.all().order_by(\"~-pub_date\")\n```\n\nThis makes sure that posts\
    \ are displayed in reverse order (newest first).\n\n# 02 A view to a page\n\n\
    You'll want to be able to link specific pages, of course, and to do that we first\
    \ have to define what goes into these pages in the urls.py file in the blog folder:\n\
    \n```\ndef post_page(request, post_id):\n    post_page = Post.objects.\n    get(pk=post_id)\n\
    \    return render_to_response('blog/post.html', {'post_page': post_page})\n```\n\
    \n# 03 Clean up your code\n\nYou may notice that we used a different return command\
    \ to the index definition – this is a shortcut that makes writing the code a bit\
    \ easier. To get it working, add:\n\n```\nfrom django.shortcuts import render_to_response\n\
    ```\n\nWe recommend that you edit the index code to match post_page.\n\n# 04 Edit\
    \ URLs\n\nIn urls.py in myblog we need to make some additions and modifications\
    \ for the website to direct to the post correctly:\n\n```\nurl(r'^myblog/$', 'blog.urls.index'),\n\
    url(r'^myblog/(?P<post_id>\\d+)/$', 'blog.urls.post_page'),\n```\n\nThe post_id\
    \ is the number of the post, which is auto-generated. The $ is important to make\
    \ the redirection work.\n\n# 05 A post template\n\nWe told the post_page to point\
    \ towards a template we now need to create. In the same location as index.html,\
    \ create post.html with the following formatting to resemble the front page:\n\
    \n```\n<h2>{{ post_page.title }}</h2>\n{{ post_page.author }} on {{ post_page.pub_date\
    \ }}\n<p>{{ post_page.post }}</p>\n```\n\n# 06 Link to the page\n\nLet's get these\
    \ links working from the main page. Open up the index.html file and make the following\
    \ change:\n\n```\n<h2><a href=\"/myblog/{{ post.pk }}\">{{ post.title }}</a></h2>\n\
    ```\n\nThis is a very simple addition using an absolute link, and requires no\
    \ fiddling with the views or model.\n\n# 07 Pagination\n\nTo get blog posts split\
    \ up over pages, we need to make some additions to urls.py in the blog folder:\n\
    \n```\npost_list = Post.objects.all().order_by(\"~-pub_date\")\npaginator = Paginator(post_list,\
    \ 3)\ntry: list_page = request.GET.get(\"list_page\", '1')\nexcept ValueError:\
    \ list_page = 1\npost_list = paginator.page(list_page)\nreturn render_to_response('blog/index.html',\
    \ {'post_list': post_list})\n```\n\n# 08 Please turn over\n\nNow we need to add\
    \ the navigation links to the blog, so open the index template for editing:\n\n\
    ```\n{% if post_list.has_previous %}\n<a href=\"?list_page={{ post_list.previous_page_number\
    \ }}\">Newer</a>\n{% endif %}\n{% if post_list.has_next %}\n<a href=\"?list_page={{\
    \ post_list.next_page_number }}\">Older</a>\n{% endif %}\n```"
  merge: -1
