  md: "# 03 Install the Twilio Helper Library and MySQLDB\n\nThe Twilio helper library\
    \ is a fantastic piece of code that lets you jump straight into sending and handling\
    \ text messages in no time at all. There are a couple of ways to install the library:\
    \ you can use either PIP or Easy_Install, like so\n\n```\n$ pip install twilio\n\
    $ easy_install twilio\n```\n\nOr you can download the source code for the helper\
    \ library and run the 'setup.py' file. It really is as simple as that. Now, for\
    \ storing the verification tokens we're going to use a MySQL database. To get\
    \ Python talking to our SQL server, we'll use the Python module MySQLdb, the package\
    \ for which you can grab like so...\n\n```\napt-get install python-mysqldb\n```\n\
    \nIn the tutorial resources we have included an SQL dump with the table structure.\
    \ Import it into a database of your choosing. Assuming everything so far has gone\
    \ swimmingly, you can create a new project folder/environment and add a new file\
    \ 'server.py'.\n\n# 04 Server setup\n\nOpen the 'server.py' file for editing.\
    \ The first thing we're going to do is import the libraries we need for our authentication\
    \ flow, create the endpoints for our server and assign some of the variables needed\
    \ to run our Flask server. (Fig 01)\n\nYou may have noticed the account_sid and\
    \ auth_token variable we've set after the import statements. We'll use these with\
    \ our Twilio client so we can interact with Twilio and our mobile phones. These\
    \ settings can be found on the Twilio account dashboard, right below the header.\
    \ We've also connected to our SQL database, so make sure your SQL server is running\
    \ before you fire up the app, otherwise you'll have an error thrown. Save, now\
    \ if you run your 'server.py' file, you should be able to access the index page\
    \ of your server at 127.0.0.1:5000/.\n\n# 05 Server logic\n\nIf you've hit all\
    \ of your server endpoints already, so far all you will see are the strings we\
    \ returned at the end of endpoint declarations. These are not all that good-looking,\
    \ so let's add some Flask templates to pretty things up a little. The focus of\
    \ this tutorial is not on the intricacies of Flask and as such, included on the\
    \ DVD is a folder called 'templates' and another called 'static'; copy them both\
    \ to the root of your current project folder and amend\n\n```\nimport MySQLdb\n\
    from flask import Flask, redirect, request, session, render_template\nfrom twilio.rest\
    \ import TwilioRestClient as twilio\nimport string, random, time\n\ndb = MySQLdb.connect(host=\"\
    127.0.0.1\", user=\"SQLUSER\", password=\"SQLPASS\", db=\"two-step\", port=3306)\n\
    \nexpirationLength = 300\n\naccount_sid = \"YOUR ACCOUNT SID\"\nauth_token = \"\
    YOUR ACCOUNT AUTH TOKEN\"\nclient = twilio(account_sid, auth_token)\n\n@app.route('/')\n\
    def index():\n    return \"index page\"\n\n@app.route('/login', methods=['GET'])\n\
    def login():\n    return \"login page\"\n\n@app.route('/check-user', methods=['POST'])\n\
    def checkUser():\n    return \"check user page\"\n\n@app.route('/logout')\ndef\
    \ logout():\n    return \"logout page\"\n\n@app.route('/verify', methods=['GET'])\n\
    def twoStep():\n    return \"verify page\"\n\n@app.route('/check-code', methods=['POST'])\n\
    def checkCode():\n    return \"check code page\"\n\nif __name__ == '__main__':\n\
    \    app.secret_key = 'R4nDOMCRypt0gr4ph1cK3y0R6535S1ON'\n    app.run(host='0.0.0.0',\
    \ debug=True)\n```\n\nyour endpoints as in Fig 02. If you revisit the pages again,\
    \ things might seem a little out of whack at the moment, but don't worry about\
    \ that for the time being. It's mostly because we've not put together the server\
    \ logic to help the templates figure out what to do.\n\nLet's deal with the '/'\
    \ path first. All we're doing here is checking the state of our session cookies\
    \ and effecting how the index.html page renders according to that state. If the\
    \ user isn't logged in, we'll give them a link to the login page, if the user\
    \ is logged in but hasn't verified, then we'll give them a link to the code verification\
    \ page. Before we deliver the template we need to check that our session has its\
    \ particular variables set, otherwise we'll end up getting KeyErrors.\n\n```\n\
    @app.route('/')\ndef index():\n    checkSessionState()\n    return render_template('index.html')\n\
    \ndef checkSessionState():\n```"
