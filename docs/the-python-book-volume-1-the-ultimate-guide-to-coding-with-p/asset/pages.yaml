  md: '# Save before running the program, or anything you''ve done since you last
    saved won''t be interpreted


    ![](img/3b256f430f51c98f1315671f6e4eec19_155_0.png)


    # 07 Fixing a small issue


    The Debian image that we''re currently using has a small misconfiguration issue
    in Geany. You''ll know if you have this problem by trying to run your program
    with either the F5 key or going to the Build menu and selecting Execute. If the
    issue is present then nothing will happen and you''ll see a message saying ''Could
    not find terminal: xterm''. Not to worry, it''s easy to fix. Go to the Edit menu
    and then select Preferences. Go to the Tools tab and change the value for Terminal
    from xterm to lxterminal.


    ![](img/3b256f430f51c98f1315671f6e4eec19_155_1.png)


    # 08 Testing our program


    Now we''ve done that part, why not test it? It''s worth noting that you have to
    save before running the program, or anything you''ve done since you last saved
    won''t be interpreted by Python. Run the program by pressing the F5 key. Input
    your name by typing it and then pressing the Enter key. Once you have done this,
    you''ll see a welcome message. If the program exits with the code 0 then everything
    was run successfully. Press Enter to close the terminal.


    # 09 Working with numbers


    We''re going to ask the user for a number by basically repeating the first couple
    of lines we did. Once the user gives us a number, we''ll halve, square and double
    it. The raw_input function returns the value that the user input as a string.
    A string is a text-based value so we can''t perform arithmetic on it. The integer
    type in Python can only store whole numbers whereas the decimal type can store
    numbers with decimals. We''re going to do something called a type cast, which
    basically converts a value with one type to another type. We''re going to convert
    our number string to a decimal value because it''s likely that decimals will be
    involved if we are halving numbers. If the number was of an integer type, any
    decimal values would simply be cut off the end, without any rounding. This is
    called truncation.


    ```

    numberHalved = number / 2

    numberDoubled = number * 2

    numberSquared = number * number

    ```


    # 10 Performing arithmetic


    The main arithmetic operators in Python are + - * /, the latter two being divide
    and multiply respectively. We''ve created three new variables called numberHalved,
    numberDoubled and numberSquared. Notice that we don''t need to specify that they
    should be decimal because Python gives a type to its variables from the type of
    their initial value. The number variable is a decimal type, so all values returned
    from performing arithmetic on that number will also be of a decimal type.


    ```

    # Print out the values we just worked on

    # to a string

    print("The result of halving that number")

    print("The result of doubling that number")

    print("The result of squaring that number")

    print("")

    ```


    # 11 Printing our numbers


    Now that we have performed our arithmetic, we need to print the results using
    the print function. The print function only accepts string values passed to it.
    This means that we need to convert each decimal value to a string using the str()
    function before they can be printed. We''re using a print statement with nothing
    between the quotation marks to print one blank line. This works because the print
    function always adds a new line at the end of its output unless told otherwise,
    so printing an empty string just prints a new line.


    # The print function only accepts string values, so convert each decimal value
    to a string


    ```

    # ask the user for a number and square it, double it

    number = raw_input("Please enter a number: ")

    ```'
