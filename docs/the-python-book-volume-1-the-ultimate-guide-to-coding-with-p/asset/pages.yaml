- pgno: 21
  md: '# 50 Python commands


    # 40 Inputting data


    Sometimes, you need to collect input from an end user. The command ''input()''
    can take a prompt string to display to the user, and then wait for the user to
    type a response. Once the user is done typing and hits the enter key, the text
    is returned to your program. If the readline module was loaded before calling
    input, then you will have enhanced line editing and history functionality. This
    command passes the text through eval first, and so may cause uncaught errors.
    If you have any doubts, you can use the command ''raw_input()'' to skip this problem.
    This command simply returns the unchanged string inputted by the user. Again,
    you can use the readline module to get enhanced line editing.


    # 41 Internal variables


    For people coming from other programming languages, there is a concept of having
    certain variables or methods be only available internally within an object. In
    Python, there is no such concept. All elements of an object are accessible. There
    is a style rule, however, that can mimic this type of behaviour. Any names that
    start with an underscore are expected to be treated as if they were internal names
    and to be kept as private to the object. They are not hidden, however, and there
    is no explicit protection for these variables or methods. It is up to the programmer
    to honour the intention from the author the class and not alter any of these internal
    names. You are free to make these types of changes if it becomes necessary, though.


    # 42 Comparing objects


    There are several ways to compare objects within Python, with several caveats.
    The first is that you can test two things between objects: equality and identity.
    If you are testing identity, you are testing to see if two names actually refer
    to the same instance object. This can be done with the command ''example1, obj2''.
    You can also test this condition by using the ''is'' keyword. For example, ''obj1
    is obj2''. If you are testing for equality, you are testing to see whether the
    values in the objects referred to by the two names are equal. This test is handled
    by the operator ''=='', as in ''obj1 == obj2''. Testing for equality can become
    complex for more complicated objects.


    # 43 Slices


    While not truly a command, slices are too important a concept not to mention in
    this list of essential commands. Indexing elements in data structures, like lists,
    is one of the most common things done in Python. You can select a single element
    by giving a single index value. More interestingly, you can select a range of
    elements by giving a start index and an end index, separated by a colon. This
    gets returned as a new list that you can save in a new variable name. You can
    even change the step size, allowing you to skip some number of elements. So, you
    could grab every odd element from the list ''a'' with the slice ''a[1::2]''. This
    starts at index 1, continues until the end, and steps through the index values
    2 at a time. Slices can be given negative index values. If you do, then they start
    from the end of the list and count backwards.'
