- pgno: 136
  md: "# Python in the wild\n\nInterested in Python development? You'd be in good\
    \ company with big names currently using it\n\nDisqus, the popular social interaction\
    \ comment service provider has been implementing their production applications\
    \ in Python for a very long time. Python's benefit for the development team was\
    \ its ability to scale effectively and cater for a large number of consumers whilst\
    \ also providing an effective underlying API for internal and external use. The\
    \ company are now starting to run some production apps in Go, but the majority\
    \ of code still runs on Python.\n\nWorld-renowned image sharing service Instagram\
    \ and social pin board Pinterest have also implemented Python as part of their\
    \ web stack, opting for Django to assist with the functionality and ability to\
    \ cater for the many thousands of content views and requests made to their services.\n\
    \nMozilla, Atlassian's Bitbucket repository service, and popular satire site The\
    \ Onion have all been noted as using Django for their products.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_136_0.png)\n\
    \n# 09 Display Posts\n\nCreate your first route so that we can return and display\
    \ all available posts. To query the database we execute a SQL statement against\
    \ the stored db connection. The results are then mapped to values using Python's\
    \ dict method and saved as the posts variable. To render a template we then call\
    \ render_template() and pass in the file name and the variable to display as the\
    \ second argument. Multiple variables can be passed through as a comma-separated\
    \ list.\n\n```\n@app.route('/')\ndef get_posts():\n    cur = g.db.execute('select\
    \ title, text from posts order by id desc')\n    posts = [dict(title=row[0], text=row[1])\
    \ for row in cur.fetchall()]\n    return render_template('show_posts.html', posts=posts)\n\
    ```\n\n# 10 Template Output\n\nFlask expects templates to be available within\
    \ the templates directory in the root of the project, so make sure that you create\
    \ that directory now. Next, add a new file called 'show_posts.html'. The dynamic\
    \ values are managed using Jinja2 template syntax, the default templating engine\
    \ for Flask applications. Save this file in the templates directory.\n\n```\n\
    <ul class=\"posts\">\n{% for post in posts %}\n<li><h2>{{ post.title }}</h2>{{\
    \ post.text|safe }}\n{% else %}\n<li>Sorry, no post matches your request.\n{%\
    \ endfor %}\n</ul>\n```\n\n# 11 Make an API Response\n\nTo create an API response\
    \ we can define a new route with a specific API endpoint. Once again, we query\
    \ the database for all posts. The data is then returned as JSON, using the JSONify\
    \ method to do so. We can add specific values such as post count and a custom\
    \ message if you wish, as well as the actual posts variable, formatted as JSON.\n\
    \n```\n@app.route('/api/v1/posts/', methods=['GET'])\ndef show_entries():\n  \
    \  cur = g.db.execute('select title, text from posts order by id desc')\n```\n\
    \n```\n@app.teardown_request\ndef teardown_request(exception):\n    db = getattr(g,\
    \ 'db', None)\n    if db is not None:\n        db.close()\n```\n\n```\nposts =\
    \ [dict(title=row[0], text=row[1]) for row in cur.fetchall()]\nreturn jsonify({'count':\
    \ len(posts), 'posts': posts})\n```\n\n# 12 Get a specific Post\n\nCTO obtain\
    \ a specific post from the API we need to create a new route, which will accept\
    \ a dynamic value as part of the URL. We can also choose to use this route for\
    \ multiple request methods, which are in this case GET and DELETE. We can determine\
    \ the method by checking the request.method value and run it against a conditional\
    \ if/else statement.\n\n```\n@app.route('/api/v1/posts/<sint:post_id>', methods=['GET',\
    \ 'DELETE'])\ndef single_post(post_id):\n    method = request.method\n    if method\
    \ == 'GET':\n        cur = g.db.execute('select title, text from posts where id\
    \ = ?', [post_id])\n        posts = [dict(title=row[0], text=row[1]) for row in\
    \ cur.fetchall()]\n        return jsonify({'count': len(posts), 'posts': posts})\n\
    \    elif method == 'DELETE':\n        g.db.execute('delete from posts where id\
    \ = ?', [post_id])\n        return jsonify({'status': 'Post deleted'})\n```\n\n\
    # 13 Run the application\n\nTo run your Flask application, navigate using the\
    \ active Terminal window into the root of the project. Ensuring you are in an\
    \ active virtual environment Python shell, enter the command to run the main index\
    \ file. The built-in server will start and the site will be accessible in the\
    \ browser on default port local address http://127.0.0.1:5000.\n\n```\npython\
    \ index.py\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_136_1.png)\n\n# 14\
    \ API JSON Output\n\nThe root of the application will render the template we previously\
    \ created. Multiple routes can be generated to create a rich web application.\
    \ Visiting an API-specific URL in the browser will return the requested data as\
    \ cleanly formatted JSON. The ability to define custom routes like a versioned\
    \ RESTful endpoint is incredibly powerful."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Web development\n\n# Django application development\n\nDjango is a full Python\
    \ web-app framework with impressive command-line tools\n\n# Installing Django\n\
    \nThe installation of Django is relatively easy once you have python installed.\
    \ See for yourself as we build a simple app here\n\n![](img/3b256f430f51c98f1315671f6e4eec19_137_0.png)\n\
    \n# 01 Create Virtual Environment\n\nCreate a new directory for your project and\
    \ navigate inside it using a new Terminal window. Create a new virtual environment\
    \ for this project, opting to use the latest Python 3. Your Python 3 location\
    \ may vary, so be sure to set the correct path for the binary package.\n\n```\n\
    virtualenv -p /usr/local/bin/python3 venv\n```\n\n# 02 Activate and Install\n\n\
    Using your Terminal window, activate the virtual environment to start the project-specific\
    \ shell. VirtualEnv has a local version of the Python package manager pip installed,\
    \ so it's fairly straight forward to run the command to install Django.\n\n```\n\
    . venv/bin/activate\npip install Django\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_137_1.png)\n\
    \n# 03 Create Core Project\n\nThe Django install contains some incredibly useful\
    \ command-line tools, which will help you to run a number of repetitive and difficult\
    \ tasks. Let's use one of them to create a fresh project structure for us. Run\
    \ the django-admin.py script with the name of the project that you want created.\n\
    \n```\ndjango-admin.py startproject myblog\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_137_2.png)\n\
    \n# 04 Initial Migration\n\nNavigate into the project directory via the Terminal\
    \ window. Some of the installed apps included in the project generation require\
    \ database tables. Using the helper, run a migration command to create all of\
    \ these automatically. The Terminal window will keep you informed of all of your\
    \ progress and what has been applied from the migration.\n\n```\ncd myblog\npython\
    \ manage.py migrate\n```\n\n# 05 Create App\n\nEach Django project is made up\
    \ of at least one application or module. Run the startapp command to create a\
    \ new blog app module, which will generate the required code adjacent to the main\
    \ project structure.\n\n```\npython manage.py startapp blog\n```\n\n# Database\
    \ models & migration\n\nDjango's ability to manage the migration and maintenance\
    \ of database schema and project models is very impressive\n\n# 01 Generate the\
    \ model\n\nOpen blog/models.py and create the first model class, providing the\
    \ property names and types for each. You can dig deeper into field types via the\
    \ docs here: bit.ly/1yHkn. Once complete, open myblog/settings.py and add the\
    \ blog app to the list of allowed installed applications so that the project will\
    \ load it.\n\n```\n# blog/models.py\nclass Post(models.Model):\n    title = models.CharField(max_length=200)\n\
    \    text = models.TextField()\n# myblog/settings.py\nINSTALLED_APPS = ('django.contrib.admin',\n\
    \    ..., 'django.contrib.staticfiles', 'blog')\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_137_3.png)\n\
    \n# 02 Data Migration\n\nAny creation of models or changes to data need to be\
    \ migrated. To do so we need to make migration files from the model data, which\
    \ generate sequentially numbered files. Then we run a specific migration to generate\
    \ the required SQL, and the final migrate command performs the database execution.\n\
    \n```\npython manage.py makemigrations blog\npython manage.py sqlmigrate blog\
    \ 0001\npython manage.py migrate\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "# Autowiring the admin interface\n\nAdmin sections can be problematic in their\
    \ own right. Django provides an extensible admin interface for you\n\n![](img/3b256f430f51c98f1315671f6e4eec19_138_0.png)\n\
    \n# 01 Create Admin User\n\nDjango makes content administration incredibly easy\
    \ and has an admin section available in a default project as standard at http://127.0.0.1:8000/admin.\
    \ To log in you need to create a superuser account. Run the associated command\
    \ and specify user details as required to then proceed and log in.\n\n```\npython\
    \ manage.py createsuperuser\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_138_1.png)\n\
    \n# 02 Switch on blog management\n\nHaving logged in to the administration interface\
    \ you will be greeted with features to manage users and group roles and privileges,\
    \ which alone are very powerful and provided for you by Django. There is not yet,\
    \ however, any access to manage our blog posts so let's turn that on.\n\n# Using\
    \ the dev server\n\nDjango ships with a very helpful built-in development server,\
    \ which will help you out by autocompiling and reloading after you have completed\
    \ all of your file changes. All you have to do to start the server is to run the\
    \ 'python manage.py runserver' command from your Terminal window within the project\
    \ directory.\n\n# 03 Enable Admin Management\n\nTo enable our module and associated\
    \ models to be managed through the admin interface, we need to register them with\
    \ the admin module. Open blog/admin.py and then go on to import and register the\
    \ models in turn (we only have one of these currently though). Save the file and\
    \ refresh the admin site to see the posts that are now available to manage.\n\n\
    ```\nfrom django.contrib import admin\n\n# Register your models here.\n```\n\n\
    # 04 Create a View\n\nWith the admin interface accepting new submissions for our\
    \ post class we'll create a view page to display them. Open blog/views.py and\
    \ import the Post class from models. Create a method to obtain all posts from\
    \ the database and output them as a string.\n\n```\nfrom django.http import HttpResponse\n\
    from blog.models import Post\ndef index(request):\n    post_list = Post.objects.order_by('-id')[:5]\n\
    \    output = '<br />'.join([p.title for p in post_list])\n    return HttpResponse(output)\n\
    ```\n\n# 05 Manage the URLs\n\nCreate 'blog/urls.py' and add the code to import\
    \ the views that were just made in the module and the accompanying URL patterns.\
    \ Open myblog/urls.py and add the URL function call to implement a new URL for\
    \ the app to display the view. Visit http://127.0.0.1:5000/blog in your browser\
    \ to render the new view.\n\n```\n# blog/urls.py\nfrom django.conf.urls import\
    \ patterns,url\nfrom blog import views\nurlpatterns = patterns('',\n    url(r'^$',\
    \ views.index, name='index'),\n)\n```\n\n```\n# myblog/urls.py\nurlpatterns =\
    \ patterns('',\n    url(r'^blog/', include('blog.urls')),\n    url(r'^admin/',\
    \ include(admin.site.urls)),\n)\n```\n\n# Hosting Python apps\n\nAdmin sections\
    \ can be problematic in their own right. Django provides an extensible admin interface\
    \ for you\n\n![](img/3b256f430f51c98f1315671f6e4eec19_138_2.png)\n\n# Heroku heroku.com\n\
    \nThis app is perhaps one of the most well-known cloud hosting providers. Their\
    \ stack server environments support a number of core web app languages including\
    \ Python as standard. Their unique Toolbelt command-line features and integration\
    \ with Git repositories, as well as being incredibly quick and easy to scale and\
    \ improve performance, makes them an obvious choice. A free account will let you\
    \ run a Python web app on one dyno instance without any cost.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_138_3.png)\n\
    \n# Python Anywhere www.pythonanywhere.com\n\nAnother hosted option, and one created\
    \ specifically for Python applications in general is Python Anywhere. The free\
    \ basic option plan has enough weight and power behind it to get you up and running\
    \ with a Python web app without having to scale, but as soon as your project gains\
    \ traction, you can switch plans and boost your plans performance.\n\nIt offers\
    \ an incredibly impressive range of modules as standard, available to import into\
    \ your application immediately to get you started, including Django and Flask\
    \ should you need them."
  merge: -1
  img_proc: true
