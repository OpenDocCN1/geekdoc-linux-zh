  md: '# Create a graphical interface for Python games


    Bring everything together with a Python GUI and take the next step in programming
    your own software


    # Resources


    Python 2: www.python.org/download


    IDLE: www.python.org/idle


    # The start


    Here we''re doing some minor setup, including getting a new module that helps
    us create a simple graphical interface


    # The imports


    We''re importing the three games we created in past issues so we can call upon
    or use them


    # The window


    Create a graphical window and give it a name so we can add some functions to it


    # The frame


    Define the dimensions of the window and give a rough guide to placement of the
    objects within


    # The welcome


    Print a message in the window and place it in a specific orientation. This works
    a little differently to print


    The three basic games we have made in Python so far have all run in the command
    line or via IDLE, a Python IDE. While this allowed us to show off different ways
    to use Python code, we haven''t actually shown you how to present it yet. In this
    tutorial, we will take all three games and put them all into one neatly unified
    graphical interface.


    To this end, we''ll be making use of the small line of code we added at the bottom
    of each previous tutorial so we can import them as modules into our main graphical
    script. We''ll also modify the existing code to add some graphical elements. To
    do all this we''ll be using Tkinter, a default module available in Python that
    allows you to create windows and frames with fairly simple code.


    All you need for this tutorial is an up-to-date copy of Python, from your distro''s
    repository or the website, and the IDLE development environment. This will also
    work great on Raspberry Pi distros, such as Raspbian.


    # Main Interface Code Listing


    ```

    #!/usr/bin/env python2


    #Linux User & Developer presents: Mega Microgames Collection


    from Tkinter import *


    import rockpaperscissors

    import hangman

    import pokerdice


    root = Tk()

    root.title("Linux User & Developer''s Mega Microgames Collection")


    mainframe = Frame(root, height = 200, width = 500)

    mainframe.pack_propagate(0)

    mainframe.pack(padx = 5, pady = 5)


    intro = Label(mainframe, text = """Welcome to Linux User & Developers Mega Microgames
    Collection.


    Please select one of the following games to play:

    """)

    intro.pack(side = TOP)


    rps_button = Button(mainframe, text = "Rock, Paper, Scissors", command = rockpaperscissors.gui)

    rps_button.pack()


    hm_button = Button(mainframe, text = "Hangman", command = hangman.start)

    hm_button.pack()


    pd_button = Button(mainframe, text = "Poker Dice", command = pokerdice.start)

    pd_button.pack()


    exit_button = Button(mainframe, text = "Quit", command = root.destroy)

    exit_button.pack(side = BOTTOM)


    root.mainloop()

    ```


    # The button


    The focus of this month''s tutorial is making Rock-Paper-Scissors work in a graphical
    interface, so we''re calling a new function we''re creating


    # The interface


    Creating and formatting buttons to start the other two tutorial games in the command
    line or shell


    # The exit


    Here we create a button that quits the window and ends the script. We''ve also
    placed it specifically at the bottom of the window


    # The loop


    The mainloop allows the main window to continue to work and be updated without
    exiting the program unless specified'
