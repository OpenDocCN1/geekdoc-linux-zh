- pgno: 78
  md: '# 01 Preparing the directory structure


    As we have mentioned previously, each XBMC extension type follows a certain directory
    naming convention. In this case we are building a video plug-in, so the plug-in
    directory name would be plugin.video.ludent. But that''s just the root directory
    name – we will need several other folders and files as well.


    The following describes the directory structure of LUD Linux Entertainer:


    +   plugin.video.ludent - Root Plugin directory

    +   |-- addon.xml

    +   |-- changelog.txt

    +   |-- default.py

    +   |-- icon.png

    +   |-- LICENSE.txt

    +   |-- README

    +   |-- resources

    +   |   |-- lib

    +   |   |-- settings.xml


    ```

    version="2.1.0"/>

    <import addon="plugin.video.youtube" version="3.0.0"/>

    <import addon="plugin.video.vimeo" version="2.3.0"/>

    <import addon="plugin.video.dailymotion_com" version="1.0.0"/>

    </requires>

    ```


    In the above code we have added a dependency to a library called xbmc.python version
    2.1. Currently it is added as a mandatory dependency. To make the dependency optional
    you will need to add optional="true" eg <import addon="kunal.special" version="1.0.0"
    optional="true" />


    In the above example we have added core dependency xbmc.python to 2.1.0 because
    it''s the version shipped with XBMC version Frodo 12.0 and 12.1. If you were to
    add xbmc.python 2.0 then it would only work in XBMC Eden 11.0 and not in the latest
    version.


    For the current version of XBMC 12.1, the following versions of core XBMC components
    are shipped:

    xbmc.python 2.1.0

    xbmc.gui 4.0.0

    xbmc.json 6.0.0

    xbmc.metadata 2.1.0

    xbmc.addon 12.0.0


    In addition to xbmc.python we are also adding some third-party plug-ins as dependencies,
    such as plugin.video.youtube. These plug-ins will be installed automatically when
    we install plugin.video.ludent.


    # 02 Creating addon.xml


    An addon.xml file needs to be created in the root of the extension directory.
    The addon.xml file contains the primary metadata from a XBMC extension. It contains
    overview, credits, version information and dependencies information about the
    extension.


    The root element of addon.xml is the <addon> element. It is defined as:


    ```

    <addon id="plugin.video.ludent" name="LUD HSW Viewer" version="0.0.1" provider-name="LUDK">

    rest of the content is placed here

    </addon>

    ```


    Here, id is the identifier for the plug-in, so it should be unique among all the
    XBMC extensions, and id is also used for the directory name; version tells XBMC
    the extension version number, which helps in its ability to deliver automatic
    updates – XBMC follows the Major.Minor.Patch versioning convention; name is the
    English title of the plug-in.


    Note: Steps 3 to 5 cover entries that need to be added within the addon.xml file.


    # 03 Adding dependency information


    Dependency inside an extension is managed using the <requires> element.


    ```

    <requires>

    <import addon="xbmc.python"

    ```


    # 04 Setting up the provider and entry point


    Our extension is supposed to provide the video content for XBMC. In order to convey
    that, we have to set up the following element:


    ```

    <extension point="xbmc.python.pluginsource" library="default.py">

    <provides>video</provides>

    </extension>

    ```


    Here, the library attribute sets up the plug-in entry point. In this example default.py
    will be executed when the user activates the plug-in. The <provides> elements
    sets up the media type it provides. This also gets reflected in the placement
    of the plug-in. Since ours is a video plug-in, it will show up in the Videos section
    of XBMC.


    # 05 Setting up plug-in metadata


    Metadata about the plug-in is provided in <extension point="xbmc.addon.metadata">.
    The following are the important elements...


    <platform>: Most of the time, XBMC extensions are cross-platform compatible. However,
    if you depend on the native platform library that is only available on certain
    platforms then you will need to set the supported platforms here. Accepted values
    for the platform are: all, linux, osx, osx32, osx64, ios (Apple iOS), win32 (Windows
    DirectX), win64 (Windows OpenGL) and android.


    <summary lang="en">: This gives a brief description of the plug-in. Our example
    sets the language attribute as English, but you can use other languages too.


    <description>: A detailed description of the plug-in.


    <website>: Webpage where the plug-in is hosted.

    <source>: Source code repository URL. If you are hosting your plug-in on GitHub,
    you can mention the repository URL here.

    <forum>: Discussion forum URL for your plug-in.

    <email>: Author email. You can directly type email or use a bot-friendly email
    address like max at domain.dot.com


    # 06 Setting changelog, icon, fanart and licence


    We need a few additional files in the plug-in directory...


    changelog.txt: You should list the changes made to your plug-in between releases.
    The changelog is visible from the XBMC UI.


    An example changelog:


    +   0.0.1

    +   - Initial Release

    +   0.0.2

    +   - Fixed Video Buffering Issue


    icon.png: This will represent the plug-in in the XBMC UI. It needs to be a non-transparent
    PNG file of size 256x256.


    fanart.jpg (optional): The fanart.jpg is rendered in the background if a user
    selects the plug-in in XBMC. The art needs to be rendered in HDTV formats, so
    its size can range from 1280x720 (720p) up to the maximum 1920x1080 (1080p).'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Work with Python


    License.txt: This file contains the licence of the distributed plug-in. The XBMC
    project recommends the use of the Creative Commons Attribution-ShareAlike 3.0
    license for skins, and GPL 2.0 for add-ons. However, most of the copyleft licences
    can be used.


    **Note:** For the purpose of packaging, extensions/add-ons/themes/plug-ins are
    the same.


    # 07 Providing settings for the plug-in


    Settings can be provided by the file resources/settings.xml. These are great for
    user-configurable options.


    **Partial: resources/settings.xml**


    ```

    ```xml

    <settings>

    <category label="30109">

    <setting id="filter" type="bool" label="30101" default="false" />

    <setting type="sep" />

    <setting id="showunwatched" type="bool" label="30106" default="false" />

    <setting id="shownwatched" type="bool" label="30107" default="true" />

    <setting id="showunfinished" type="bool" label="30108" default="false" />

    <setting type="sep" />

    <setting id="viewMode" type="bool" label="30102" default="true" />

    <setting id="viewMode" type="number" label="30103" default="504" />

    </category>

    <category label="30110">

    <setting id="cat_hot" type="bool" label="30002" default="true" />

    <setting id="cat_new" type="bool" label="30003" default="true" />

    </category>

    </settings>

    ```

    ```


    Here, label defines the language id string which will then be used to display
    the label. It defines the name which will be used for programmatic access, type
    defines the data type you want to collect; it also affects the UI which will be
    displayed for the element. default defines the default value for the setting.
    You should always use a default value wherever possible to provide a better user
    experience.


    The following are a few important settings types that you can use...

    **text:** Used for basic inputs.

    **ipaddress:** Used to select correct ip addresses.

    **number:** Allows you enter a number. XBMC will also provide an on-screen numeric
    keyboard for the input.

    **slider:** This provides an elegant way to collect integer, float and percentage
    values. You can get the slider setting in the following format:


    ```

    ```xml

    <setting label="21223" type="slider" id="sideinput" default="10" range="1,1,10"
    option="int" />

    ```

    ```


    In the above example we are creating a slider with min range 1, max range 10 and
    step as 1. In the option field we are stating the data type we are interested
    in – we can also set option to "float" or "percent".


    **bool:** Provides bool selection in the form of on or off.

    **file:** Provides a way to input file paths. XBMC will provide a file browser
    to make the selection of file. If you are looking to make selection for a specific
    type of file you can use audio, video, image or executable instead of file.


    **folder:** Provides a way to browse for a folder...


    **Example:**


    ```

    ```xml

    <setting label="12001" type="folder" id="folder" source="auto" option="writeable"/>

    ```

    ```


    Here, source sets the start location for the folder, while option sets the write
    parameter for the application.


    **sep & lsep:** sep is used to draw a horizontal line in the setting dialog; lsep
    is used for drawing a horizontal line with text. They do not collect any input
    but are there for building better user interface elements...


    ```

    ```xml

    <setting label="21212" type="lsep" />

    ```

    ```


    # 08 Language support


    Language support is provided in the form of the strings.xml file located in resources/languages/[language
    name]. This approach is very similar to many large software projects, including
    Android, where static strings are never reused.


    **resource/language/english/string.xml example:**


    ```

    ```xml

    <?xml version="1.0" encoding="utf-8" standalone="yes"?>

    <strings>

    <string id="30001">Add subreddit</string>

    <string id="30002">Hot</string>

    <string id="30003">New</string>

    <string id="30004">Top</string>

    <string id="30005">Controversial</string>

    <string id="30006">Hour</string>

    <string id="30007">Day</string>

    <string id="30008">Week</string>

    <string id="30009">Month</string>

    <string id="30010">Year</string>

    </strings>

    ```

    ```


    As you may have seen in the settings.xml example, all the labels are referring
    to string ids. You can have many other languages as well. Depending upon the language
    XBMC is running in, the correct language file will be loaded automatically.


    Post XBMC Frodo (12.1), strings.xml will be deprecated. Post Frodo, XBMC will
    be moved to a GNU gettext-based translation system; gettext uses PO files. You
    can use a tool called xbc-mxl2po to convert strings.xml into equivalent PO files.


    # 09 Building default.py


    Since our plug-in is small, it will be contained inside default.py. If you are
    developing a more complex add-on then you can create supporting files in the same
    directory. If your library depends upon third-party libraries, you have two ways
    to go about it. You can either place the third-party libraries into the resources/lib
    folder; or bundle the library itself into a plug-in, then add that plug-in as
    the dependency in the addon.xml file.


    Our plug-in works with reddit.tv. This is the website from Reddit which contains
    trending videos shared by its readers. Videos posted on Reddit are actually sourced
    from YouTube, Vimeo and Dailymotion.


    We will be starting off default.py using the following imports:


    ```

    ```python

    import urllib

    import urllib2

    import xbmcplugin

    ```

    ```'
