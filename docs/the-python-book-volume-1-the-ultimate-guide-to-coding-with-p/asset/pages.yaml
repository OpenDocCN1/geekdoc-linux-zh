  md: "{% %}. This time we're creating a loop; inside the loop we'll be able to access\
    \ any property we have of that object and print it out. In this template we're\
    \ going to create an <div> element for each tweet we received and display the\
    \ user's profile picture and text of the tweet (Fig 04).\n\nIn our template we\
    \ can access properties using either dot notation (.) or with square brackets\
    \ ([]). They behave largely the same: the [] notation will check for an attribute\
    \ on the dictionary or object defined whereas the . notation will look for an\
    \ item with the same name. If either cannot find the parameter specified, it will\
    \ return undefined. If this occurs, the template will not throw an error, it will\
    \ simply print an empty string. Keep this in mind if your template does not render\
    \ the expected data: you've probably just mis-defined the property you're trying\
    \ to access.\n\n# 13 Flask filters\n\nSometimes, when parsing from JSON, Python\
    \ can generate erroneous characters that don't render particularly well in HTML.\
    \ You may notice that after tweet['text'] there is |forceescape. This is an example\
    \ of a Flask filter; it allows us to effect the input before we render – in this\
    \ case it's escaping our values for us. There are many, many different built-in\
    \ filters that come included with Flask. Your advisor recommends a full reading\
    \ of all the potential options.\n\n# 14 Wrapping up\n\nThat's pretty much it for\
    \ templating with Flask. As we've seen, it's insanely quick and easy to build\
    \ and deploy dynamic sites. Flask is great tool for any Python developer looking\
    \ to run a web service. Although we've used Twitter to demonstrate Flask's power,\
    \ all of the techniques described can be used with any third-party service or\
    \ database resource. Flask can work with other rendering engines, such as Handlebars\
    \ (which is superb), but Jinja2 still needs to be present to run Flask and conflicts\
    \ can occur between the two engines. With such great integration between Flask\
    \ and Jinja2, it makes little sense to use another engine outside of very specific\
    \ circumstances.\n\n```\ntweetRequestParams = {\n\"oauth_consumer_key\": consumer_key,\n\
    \"oauth_nonce\": helpers.nonce(),\n\"oauth_signature_method\": \"HMAC-SHA1\",\n\
    \"oauth_timestamp\": int(time.time()),\n\"oauth_version\": \"1.0\",\n\"oauth_token\"\
    : session['oauth_token'],\n\"user_id\": session['user_id'],\n\"count\": str(count)\n\
    }\nFig 02\n```\n\n```\ntweetRequest = helpers.sign_request(tweetRequestParams,\
    \ \"GET\",\n\"https://api.twitter.com/1.1/statuses/user_timeline.json\", consumer_secret,\
    \ session['oauth_secret'])\n\ntweetRequestParams[\"oauth_signature\"] = tweetRequest\n\
    \nmakeRequest=urlib2.Request(\"https://api.twitter.com/1.1/statuses/user_timeline.json?count=\"\
    \ + tweetRequestParams['count'] + \"&user_id=\" + tweetRequestParams['user_id'])\n\
    \ndel tweetRequestParams['user_id'], tweetRequestParams['count']\n\nmakeRequest.add_header(\"\
    Authorization\", helpers.create_oauth_headers(tweetRequestParams))\n\ntry:\n \
    \   httpResponse = urlib2.urlopen(makeRequest)\nexcept urlib2.HTTPError, e:\n\
    \    return e.read()\nFig 03\n```\n\n```\n{% if data %}\n\n<ul id=\"tweets\">\n\
    {% for tweet in data %}\n<li>\n<div class=\"image\">\n<img src=\"{{ tweet['user']['profile_image_url_https']\
    \ }}\" alt=\"User Profile Picture\">\n</div>\n<div class=\"text\">{{ tweet['text']|forceescape\
    \ }}</div>\n</li>\n{% endfor %}\n</ul>\n\n{% else %}\n<p>We didn't get any tweets\
    \ :(</p>\n{% endif %}\nFig 04\n```"
