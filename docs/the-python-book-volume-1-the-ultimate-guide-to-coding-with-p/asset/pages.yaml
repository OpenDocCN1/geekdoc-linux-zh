  md: '# Scientific computing with NumPy


    # Powerful calculations with NumPy, SciPy and Matplotlib


    A simple Python program for Polynomial Fitting!


    Matplotlib generated output


    A Python script that uses SciPy to process an image


    Finding help is easy


    # Resources


    NumPy:

    www.numpy.org


    SciPy:

    www.scipy.org


    Matplotlib:

    www.matplotlib.org


    NumPy is the primary Python package for performing scientific computing. It has
    a powerful N-dimensional array object, tools for integrating C/C++ and Fortran
    code, linear algebra, Fourier transform, and random number capabilities, among
    other things. NumPy also supports broadcasting, which is a clever way for universal
    functions to deal in a meaningful way with inputs that do not have exactly the
    same form.


    Apart from its capabilities, the other advantage of NumPy is that it can be integrated
    into Python programs. In other words, you may get your data from a database, the
    output of another program, an external file or an HTML page and then process it
    using NumPy.


    This article will show you how to install NumPy, make calculations, plot data,
    read and write external files, and it will introduce you to some Matplotlib and
    SciPy packages that work well with NumPy.


    NumPy also works with Pygame, a Python package for creating games, though explaining
    its use is beyond the scope of this article.


    It is considered good practice to try the various NumPy commands inside the Python
    shell before putting them into Python programs.


    The examples in this article are using either Python shell or iPython.


    # 01 Installing NumPy


    Most Linux distributions have a ready-to-install package you can use. After installation,
    you can find out the NumPy version you are using by executing the following:


    ```

    $ python

    Python 2.7.3 (default, Mar 13 2014, 11:03:55)

    [GCC 4.7.2] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>> numpy.version.version

    ```'
