- pgno: 56
  md: "problem, unfortunately, as the drawing is static. When we later move the player\
    \ widget, the red rectangle will stay in the same place, and the widget will be\
    \ invisible when it is in its real position.\n\nWe could fix this by keeping references\
    \ to our canvas instructions and repeatedly updating their properties to track\
    \ the player, but there’s actually an easier way to do all of this - we can use\
    \ the Kivy language we introduced last time. It has a special syntax for drawing\
    \ on the widget canvas, which we can use to draw each of our widget shapes:\n\n\
    ```\n<Player>:\n    canvas:\n        Color:\n            rgba: 1, 1, 1, 1\n  \
    \      Rectangle:\n            pos: self.pos\n            size: self.size\n```\n\
    \n```\n<Ball>:\n    canvas:\n        Color:\n            rgb: 1, 0.55, 0\n   \
    \     Rectangle:\n            pos: self.pos\n            size: self.size\n```\n\
    \n```\n<Block>:\n    canvas:\n        Color:\n            rgb: self.colour\n \
    \       # A property we predefined above\n        Rectangle:\n            pos:\
    \ self.pos\n            size: self.size\n        Color:\n            rgb: 0.1,\
    \ 0.1, 0.1\n        Line:\n            rectangle: [self.x, self.y, self.width,\
    \ self.height]\n```\n\nThe canvas declaration is special, underneath it we can\
    \ write any canvas instructions we like. Don’t get confused, canvas is not a widget\
    \ and nor are graphics instructions like Line. This is just a special syntax that\
    \ is unique to the canvas. Instructions all have different properties that can\
    \ be set, like the pos and size of the rectangle, and you can check the Kivy documentation\
    \ online for all the possibilities. The biggest advantage is that although we\
    \ still declare simple canvas instructions, kv language is able to detect what\
    \ Kivy properties we have referred to and automatically track them, so when they\
    \ are updated (the widget moves or is resized) the canvas instructions move to\
    \ follow!\n\n> Once you have the basic techniques, you aren’t limited to one app…\
    \ your imagination is the only limit\n\n```\nfrom kivy.app import App\nfrom kivy.uix.widget\
    \ import Widget\nfrom kivy.uix.floatlayout import FloatLayout\nfrom kivy.uix.modalview\
    \ import ModalView\n\n__version__ = '0.1' # Used later during Android compilation\n\
    \nclass BreakoutApp(App):\n    pass\n\nBreakoutApp().run()\nFig. 01\n```\n\n```\n\
    from kivy.properties import (ListProperty, NumericProperty, ObjectProperty, StringProperty)\n\
    \nclass Game(FloatLayout): # Will contain everything\n    blocks = ListProperty([])\n\
    \    player = ObjectProperty() # The game's Player instance\n    ball = ObjectProperty()\
    \ # The game's Ball instance\n\nclass Player(Widget): # A moving paddle\n    position\
    \ = NumericProperty(0.5)\n    direction = StringProperty('none')\n\nclass Ball(Widget):\
    \ # A bouncing ball\n    # pos_hints are for proportional positioning, see below\n\
    \    pos_hint_x = NumericProperty(0.5)\n    pos_hint_y = NumericProperty(0.3)\n\
    \    proper_size = NumericProperty(0)\n    velocity = ListProperty([0.1, 0.5])\n\
    \nclass Block(Widget): # Each coloured block to destroy\n    colour = ListProperty([1,\
    \ 0, 0])\nFig. 02\n```\n\n```\nfrom kivy.graphics.context_instructions import\
    \ Color\nfrom kivy.graphics.vertex_instructions import Rectangle\n\nclass Player(Widget):\n\
    \    def __init__(self, **kwargs):\n        super(Player, self).__init__(**kwargs)\n\
    \        with self.canvas:\n            Color(1, 0, 0, 1) # r, g, b, a -> red\n\
    \            Rectangle(pos=self.pos, size=self.size)\n        # or without the\
    \ with syntax, self.canvas.add(...)\nFig. 03\n```"
