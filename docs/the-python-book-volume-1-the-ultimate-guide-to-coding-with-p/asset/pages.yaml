    \ pct, dir_name, fs.sys_type_name()\n@Output\n==========Memory\nInformation==========\n\
    Total    Used    Free\nMem:    8388608 6061884 2326724\n```\n\n# Accessing Secure\
    \ Shell (SSH) services\n\nSSH (Secure Shell) is a modern replacement for an old\
    \ remote shell system called Telnet. It allows data to be exchanged using a secure\
    \ channel between two networked devices. System administrators frequently use\
    \ SSH to administrate networked systems. In addition to providing remote shell,\
    \ SSH is also used for secure file transfer (using SSH File Transfer Protocol,\
    \ or SFTP) and remote X server forwarding (allows you to use SSH clients as X\
    \ server). In this section we will learn how to use the SSH protocol from Python\
    \ using a Python module called paramiko, which implements the SSH2 protocol for\
    \ Python.\n\nparamiko can be installed using the following steps:\n$ git clone\
    \ https://github.com/robey/paramiko.git\n$ cd paramiko\n$ sudo python setup.py\
    \ install\n\nTo the core of paramiko is the SSHClient class. This class wraps\
    \ LTransport, LChannel, and L SFTPClient to handle most of the aspects of SSH.\
    \ You can use\n\n# SSHClient as:\n\n```\nclient = SSHClient()\nclient.load_system_host_keys()\n\
    client.connect('some.host.com')\nstdin, stdout, stderr = client.exec_command('command')\n\
    ```\n\nThe following example demonstrates a full SSH client written using the\
    \ paramiko module.\n\n```\n@code: PySSHClient.py\nimport base64, getpass, os,\
    \ socket, sys\nimport paramiko\nimport interactive\n# setup logging\nparamiko.util.log_to_file('demo.simple.log')\n\
    # get hostname\nusername = ''\nif len(sys.argv) > 1:\n    hostname = sys.argv[1]\n\
    \    if hostname.find('@') >= 0:\n        username, hostname = hostname.split('@')\n\
    else:\n    hostname = raw_input('Hostname: ')\n    if len(hostname) == 0:\n  \
    \      print '*** Hostname required.'\n        sys.exit(1)\nport = 22\nif hostname.find(':')\
    \ >= 0:\n    hostname, portstr = hostname.split(':')\n    port = int(portstr)\n\
    # get username\nif username == '':\n    default_username = getpass.getuser()\n\
    \    username = raw_input('Username [%s: %s default_username] ' % (hostname, default_username))\n\
    \    if len(username) == 0:\n        username = default_username\npassword = getpass.getpass('Password\
    \ for %s@%s: ' % (username, hostname))\n# now, connect and use paramiko\nClient\
    \ to negotiate SSH2 across the connection\ntry:\n    client = paramiko.SSHClient()\n\
    \    client.load_system_host_keys()\n    client.set_missing_host_key_policy(paramiko.WarningPolicy)\n\
    \    print '*** Connecting...'\n    client.connect(hostname, port, username, password)\n\
    \    chan = client.invoke_shell()\n    print repr(client.get_transport())\n  \
    \  print '*** SSH Server Connected!'\n    ***\n    print\n    interactive.interactive_shell(chan)\n\
    \    chan.close()\n    client.close()\nexcept Exception, e:\n    print '*** Caught\
    \ exception: %s: %s' % (e.__class__, e)\n    traceback.print_exc()\n    try:\n\
    \        client.close()\n    except:\n        pass\n    sys.exit(1)\n```\n\nTo\
