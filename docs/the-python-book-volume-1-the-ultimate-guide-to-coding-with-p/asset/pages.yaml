  md: "01 This section imports the extra Python functions we'll need for the code\
    \ – they're still parts of the standard Python libraries, just not part of the\
    \ default environment\n\n02 The initial rules of the game are created here. The\
    \ three variables we're using and their relationship is defined. We also provide\
    \ a variable so we can keep score of the games\n\n03 We begin the game code by\
    \ defining the start of each round. The end of each play session comes back through\
    \ here, whether we want to play again or not\n\n04 The game is actually contained\
    \ all in here, asking for the player input, getting the computer input and passing\
    \ these on to get the results. At the end of that, it then asks if you'd like\
    \ to play again\n\n05 Player input is done here. We give the player information\
    \ on how to play this particular version of the game and then allow their choice\
    \ to be used in the next step. We also have something in place in case they enter\
    \ an invalid option\n\n06 There are a few things going on when we show the results.\
    \ First, we're putting in a delay to add some tension, appending a variable to\
    \ some printed text, and then comparing what the player and computer did. Through\
    \ an if statement, we choose what outcome to print, and how to update the scores\n\
    \n07 We now ask for text input on whether or not someone wants to play again.\
    \ Depending on their response, we go back to the start, or end the game and display\
    \ the results\n\n```\n#!/usr/bin/env python2\n# Linux User & Developer presents:\
    \ Rock, Paper, Scissors: The Video Game\n\nimport random\nimport time\n\nrock\
    \ = 1\npaper = 2\nscissors = 3\n\nnames = { rock: \"Rock\", paper: \"Paper\",\
    \ scissors: \"Scissors\" }\nrules = { rock: scissors, paper: rock, scissors: paper\
    \ }\n\nplayer_score = 0\ncomputer_score = 0\n\ndef start():\n    print \"Let's\
    \ play a game of Rock, Paper, Scissors.\"\n    while game():\n        scores()\n\
    \ndef game():\n    player = move()\n    computer = random.randint(1, 3)\n    result(player,\
    \ computer)\n    return play_again()\n\ndef move():\n    while True:\n       \
    \ print\n        player = raw_input(\"Rock = 1\\nPaper = 2\\nScissors = 3\\nMake\
    \ a move: \")\n        try:\n            player = int(player)\n            if\
    \ player in [1,2,3]:\n                return player\n        except ValueError:\n\
    \            print \"Oops! I didn't understand that. Please enter 1, 2 or 3.\"\
    \n\ndef result(player, computer):\n    print \"...\"\n    time.sleep(1)\n    print\
    \ \"...\"\n    time.sleep(1)\n    print \"...\"\n    time.sleep(0.5)\n    print\
    \ \"Computer threw {0}\".format(names[computer])\n    global player_score, computer_score\n\
    \    if player == computer:\n        print \"Tie game.\"\n    else:\n        if\
    \ rules[player] == computer:\n            print \"Your victory has been assured.\"\
    \n            player_score += 1\n        else:\n            print \"The computer\
    \ laughs as you realise you have been defeated.\"\n            computer_score\
    \ += 1\n\ndef play_again():\n    answer = raw_input(\"Would you like to play again?\
    \ y/n: \")\n    if answer in (\"y\", \"Y\", \"yes\", \"Yes\", \"Of course!\"):\n\
    \        return answer\n    else:\n        print \"Thank you very much for playing\
    \ our game. See you next time!\"\n\ndef scores():\n    global player_score, computer_score\n\
    \    print \"HIGH SCORES\"\n    print \"Player: \", player_score\n    print \"\
    Computer: \", computer_score\n\nif __name__ == \"__main__\":\n    start()\n```"
