  md: "![](img/3b256f430f51c98f1315671f6e4eec19_57_0.png)\n\nRunning the app shows\
    \ our coloured blocks on the screen... but they all overlap! We can fix that easily\n\
    \nYou probably noticed we had one of the Block's 'Color' instructions refer to\
    \ its colour property. This means that we can change the property any time to\
    \ update the colour of the block, or in this case to give each block a random\
    \ colour (Fig. 04). Now that each of our widgets has a graphical representation,\
    \ let's now tell our Game where to place them, so that we can start up the app\
    \ and actually see something there.\n\n```\nclass Game(FloatLayout):\n    def\
    \ setup_blocks(self):\n        for y_jump in range(5):\n            for x_jump\
    \ in range(10):\n                block = Block(pos_hint={\n                  \
    \  'x': 0.05 + 0.09*x_jump,\n                    'y': 0.05 + 0.09*y_jump})\n \
    \               self.blocks.append(block)\n                self.add_widget(block)\n\
    ```\n\n```\nclass BreakoutApp(App):\n    def build(self):\n        g = Game()\n\
    \        g.setup_blocks()\n        return g\n```\n\nHere we create the widgets\
    \ we want then use add_widget to add them to the graphics tree. Our root widget\
    \ on the screen is an instance of Game and every block is added to that to be\
    \ displayed. The only new thing is that every Block has been given a pos_hint.\
    \ All widgets have this special property, and it is used by FloatLayouts like\
    \ our Game to set their position proportionate to the layout. The dictionary is\
    \ able to handle various parameters, but in this case 'x'and 'y' give x and y\
    \ Block position as a relative fraction of the parent width and height. You can\
    \ run the app now, and this time it will add 50 blocks to the Game before displaying\
    \ it on the screen. Each should have one of the three possible random colours\
    \ and be positioned in a grid, but you'll now notice their sizes haven't been\
    \ manually set so they all overlap. We can fix this by setting their size_hint\
    \ properties - and let's also take this opportunity to do the same for the other\
    \ widgets as well (Fig. 05). This takes care of keeping all our game widgets positioned\
    \ and sized in proportion to the Game containing them. Notice that the Player\
    \ and Ball use references to the properties we set earlier, so we'll be able to\
    \ move them by just setting these properties and letting kv language automatically\
    \ update their positions. The Ball also uses an extra property to remain square\
    \ rather than rectangular, just because the alternative would likely look a little\
    \ bit odd. We've now almost finished the basic graphics of our app! All that remains\
    \ is to add a Ball and a Player widget to the Game.\n\n```\n<Game>:\n    ball:\
