  md: "# Web development\n\n# You don’t have full control from start to finish with\
    \ a prefabricated blog – but you will with Django\n\n![](img/3b256f430f51c98f1315671f6e4eec19_141_0.png)\n\
    \n# 08 Create your blog\n\nNow it’s time to create a blog app in your project.\
    \ Type:\npython manage.py startapp blog\n\nThis creates the models file which\
    \ is where all your data lives. You can change ‘blog’ to another name, but we’ll\
    \ use it in our examples.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_141_1.png)\n\
    \n# 09 Start your blog model\n\nWe can now take the first steps in creating our\
    \ blog model. Open models.py and change it so it says the following:\nfrom django.db\
    \ import models\nclass Post(models.Model):\n    post = models.TextField()\n\n\
    This creates the Post class, which has a subclass that contains your blog text.\n\
    \n# 10 Customise your blog\n\nLet’s now expand the blog model a bit so it resembles\
    \ a more classic blog:\nclass Post(models.Model):\n    post = models.TextField()\n\
    \    title = models.TextField()\n    author = models.CharField(max_length=50)\n\
    \    pub_date = models.DateTimeField()\n\nA CharField needs to have a character\
    \ limit defined, and DateTimeField holds the time values.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_141_2.png)\n\
    \n# 11 Install your app\n\nYour app needs to be installed to your project, which\
    \ is very simple. Open the settings.py file again, go to the INSTALLED_APPS section\
    \ and add:\n‘blog’,\n\nThen run the following to create the database tables:\n\
    python manage.py sql blog\n\nAnd finally:\npython manage.py syncdb\n\n# 12 Setup\
    \ to post\n\nNow we can create a post and test out our code. First though, enter\
    \ the Python shell:\npython manage.py shell\n\nThen execute these commands to\
    \ add all the necessary fields and data:\nfrom blog.models import Post\nimport\
    \ datetime\n\n![](img/3b256f430f51c98f1315671f6e4eec19_141_3.png)\n\n# 13 Let’s\
    \ blog\n\nCreate the post. For this example, we will call it test_post:\ntest_post\
    \ = Post()\n\nNow let’s add the blog content:\ntest_post.post = ‘Hello World!’\n\
    test_post.title = ‘First Post’\ntest_post.author = ‘Me’\ntest_post.pub_date =\
    \ datetime.datetime.now()\n\nAnd then save it with:\ntest_post.save()\n\n# 14\
    \ Start the site back-end\n\nTo create the admin site, edit urls.py from the myblog\
    \ directory, and uncomment or add the following lines:\nfrom django.contrib import\
    \ admin\nadmin.autodiscover()\nurl(r'^admin/', include(admin.site.urls)),\n\n\
    Save and exit, then edit settings.py and uncomment this line from INSTALLED_APPS:\n\
    ‘django.contrib.admin’,\n\nThe admin site is now at 127.0.0.1:8000/admin/."
