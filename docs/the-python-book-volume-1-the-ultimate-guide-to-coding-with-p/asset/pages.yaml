- pgno: 22
  md: '> “Python is an interpreted language, which means that the source code that
    you write needs to be compiled into a byte code format. This byte code then gets
    fed into the actual Python engine”


    ![](img/3b256f430f51c98f1315671f6e4eec19_22_0.png)


    # 44 Lambda expressions


    Since objects, and the names that point to them, are truly different things, you
    can have objects that have no references to them. One example of this is the lambda
    expression. With this, you can create an anonymous function. This allows you use
    functional programming techniques within Python. The format is the keyword ''lambda'',
    followed by a parameter list, then a colon and the function code. For example,
    you could build your own function to square a number with ''lambda x: x*x''. You
    can then have a function that can programmatically create new functions and return
    them to the calling code. With this capability, you can create function generators
    to have self-modifying programs. The only limitation is that they are limited
    to a single expression, so you can''t generate very complex functions.


    # 45 Compiling code objects


    Python is an interpreted language, which means that the source code you write
    needs to be compiled into a byte code format. This byte code then gets fed into
    the actual Python engine to step through the instructions. Within your program,
    you may have the need to take control over the process of converting code to byte
    code and running the results. Maybe you wish to build your own REPL. The command
    ''compile()'' takes a string object that contains a collection of Python code,
    and returns an object that represents a byte code translation of this code. This
    new object can then be handed in to either ''eval()'' or ''exec()'' to be actually
    run. You can use the parameter ''mode='' to tell compile what kind of code is
    being compiled. The ''single'' mode is a single statement, ''eval'' is a single
    expression and ''exec'' is a whole code block.


    # 46 __init__ method


    When you create a new class, you can include a private initialisation method that
    gets called when a new instance of the class is created. This method is useful
    when the new object instance needs some data loaded in the new object.


    # 47 __del__ method


    When an instance object is about to be destroyed, the __del__ method is called.
    This gives you the chance to do any kind of cleanup that may be required. This
    might be closing files, or disconnecting network connections. After this code
    is completed, the object is finally destroyed and resources are freed.


    # 48 Exiting your program


    There are two pseudo-commands available to exit from the Python interpreter: ''exit()''
    and ''quit()''. They both take an optional parameter which sets the exit code
    for the process. If you want to exit from a script, you are better off using the
    exit function from the sys module (''sys.exit(exit_code)'').


    # 49 Return values


    Functions may need to return some value to the calling function. Because essentially
    no name has a type, this includes functions. So functions can use the ''return''
    command to return any object to the caller.


    # 50 String concatenation


    We will finish with what most lists start with – string concatenation. The easiest
    way to build up strings is to use the ''+'' operator. If you want to include other
    items, like numbers, you can use the ''str()'' casting function to convert it
    to a string object.'
