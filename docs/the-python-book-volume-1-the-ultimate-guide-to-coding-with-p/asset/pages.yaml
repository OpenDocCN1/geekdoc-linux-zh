  md: "# 17 Start over\n\nThe usual array of command-line compatibility and module\
    \ importing here. The groupby function is specifically imported here for dice\
    \ analysis.\n\n# 18 Outside dice\n\nFor Poker Dice, there’s only one variable\
    \ to show at any one time, the dice. Again, due to the nested functions, and because\
