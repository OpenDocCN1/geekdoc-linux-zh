- pgno: 80
  md: "# 10 Initialising\n\nDuring the initialisation process, we will be reading\
    \ various settings from settings.xml. Settings can be read in the following way:\n\
    \n```\naddon = xbmcaddon.Addon()\nfilterRating = int(addon.getSetting(\"filterRating\"\
    ))\ngetSetting(\"filterRating\")\nfilterVoteThreshold = int(addon.getSetting(\"\
    filterVoteThreshold\"))\n```\n\nIn order to read settings of type bool you will\
    \ need to do something like:\n\n```\nfilter = addon.getSetting(\"filter\")\n==\
    \ \"true\"\n```\n\nWe are also setting the main URL, plug-in handle and the user\
    \ agent for it:\n\n```\npluginHandle = int(sys.argv[1])\nurlMain = \"http://www.reddit.com\"\
    \nuserAgent = \"Mozilla/5.0 (Windows NT 6.2; WOW64; rv:22.0) Gecko/20100101 Firefox/22.0\"\
    \nopener = urllib2.build_opener()\nopener.addheaders = [('User-Agent', userAgent)]\n\
    ```\n\n# 11 Reading localised strings\n\nAs mentioned, XBMC uses strings.xml to\
    \ serve up the text. In order to read those strings, you will need to use getLocalizedString.\n\
    \n```\ntranslation = addon.getLocalizedString(translation(30002))\n```\n\nIn this\
    \ example, translation(30002) will return the string \"Hot\" when it is running\
    \ in an English environment.\n\n```\nimport xbmcgui\nimport xbmcaddon\n```\n\n\
    Apart from xbmcplugin, xbmcgui and xbmcaddon, the rest are all standard Python\
    \ libraries which are available on PyPI (Python Package Index) via pip. You will\
    \ not need to install any library yourself since the Python runtime for XBMC has\
    \ all the components built in.\n\nurllib and urllib2 help in HTTP communication.\
    \ socket is used for network I/O; re is used for regular expression matching;\
    \ sqlite3 is the Python module for accessing an SQLite embedded database; xbmcplugin,\
    \ xbmcgui and xbmcaddon contain the XBMC-specific routine.\n\n| idFile | idPath\
    \ | strFilename | playCount | lastPlayed | dateAdded |\n| 1 | 1 | plugin://plugin.\
    \ |  | 2013-08-06 23:47 |  |\n| 2 | 2 | plugin://plugin. | 1 | 2013-08-07 22:42\
    \ |  |\n| 3 | 2 | plugin://plugin. | 1 | 2013-08-08 00:09 |  |\n| 4 | 2 | plugin://plugin.\
    \ | 1 | 2013-08-08 00:55 |  |\n| 5 | 2 | plugin://plugin. | 1 | 2013-08-08 00:58\
    \ |  |\n\n# 12 Building helper functions\n\nIn this step we will look at some\
    \ of the important helper functions.\n\nThe above table is an example of a files\
    \ table.\n\ngetDbPath(): This returns the location of the SQLite database file\
    \ for videos, XBMC stores library and playback information in SQLite DB files.\
    \ There are separate databases for videos and music, located inside the .xbmc/userdata/Database\
    \ folder. We are concerned with the videos DB. It is prefixed with MyVideos...\n\
    \n```\ndef getDbPath():\n    path = xbmc.translatePath(\"special://userdata/Database\"\
    )\n    files = os.listdir(path)\n    latest = \"\"\n    for file in files:\n \
    \       if file[8] == \"MyVideos\" and file[-3:] == \".db\":\n            if file\
    \ > latest:\n                latest = file\n    return os.path.join(path, latest)\n\
    ```\n\ngetPlayCount(url): Once we have the database location, we can get the play\
    \ count using a simple SQL query. The MyVideo database contains a table called\
    \ files, which keeps a record of all the video files played in XBMC by filename.\
    \ In this case it will be URL.\n\n```\ndbPath = getDbPath()\nconn = sqlite3.connect(dbPath)\n\
    c = conn.cursor()\n```\n\n```\ndef getPlayCount(url):\n    c.execute(\"SELECT\
    \ playCount FROM files WHERE strFilename=?\", [url])\n    result = c.fetchone()\n\
    \    if result:\n        result = result[0]\n        if result:\n            return\
    \ int(result)\n    return -1\n```\n\naddSubreddit(): Our plug-in allows users\
    \ to add their own Subreddit. This function takes the Subreddit input from the\
    \ user, then saves it in the subreddits file inside the addon data folder.\n\n\
    The following sets the subreddits file location:\n\n```\nsubredditsFile = xbmc.translatePath(\"\
    special://profile/addon_data/\"+addonID+\"/subreddits\")\nthis translates into\
    \ .xbmc/userdata/addon_data/plugin.video.ludent/subreddits\n```\n\n```\ndef addSubreddit():\n\
    \    keyboard = xbmc.Keyboard('', translation(30001))\n    keyboard.doModal()\n\
    \    if keyboard.isConfirmed() and keyboard.getText():\n        subreddit = keyboard.getText()\n\
    \        fh = open(subredditsFile, 'a')\n        fh.write(subreddit+'\\n')\n \
    \       fh.close()\n```\n\nThis function also demonstrates how to take a text\
    \ input from the user. Here we are calling the Keyboard function with a text title.\
    \ Once it detects the keyboard, it writes the input in the subreddits file with\
    \ a newline character.\n\ngetYoutubeUrl(id): When we locate a YouTube URL to play,\
    \ we pass it on to the YouTube plug-in (plugin.video.youtube) to handle the playback.\
    \ To do so, we need to call it in a certain format...\n\n```\ndef getYoutubeUrl(id):\n\
    \    url = \"plugin://plugin.video.youtube/?path=/root/video?action=play_video&videoid=\"\
    \ + id\n    return url\n```"
