    \ to send it from. When inputting the number that we want to send it to, it’s\
    \ best to use the +CountryCode type of phone number to avoid any ambiguity about\
    \ the intended recipient. The number that we’re sending from is our Twilio number;\
    \ you can use any Twilio number you have assigned to your account, so long as\
    \ it has credit. As soon as we execute that code, the message will be sent and\
