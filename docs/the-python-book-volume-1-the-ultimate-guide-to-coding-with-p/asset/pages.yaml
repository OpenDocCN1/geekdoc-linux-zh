- pgno: 157
  md: '# Program Minecraft Pi


    Learn how to get started with Minecraft Pi, a brilliant tool for learning to code
    Python on the Raspberry Pi...


    Minecraft is a revolutionary sandbox game in which the protagonist, known only
    as Steve, is tasked with surviving and thriving in a huge, blocky 3D world considerably
    bigger than planet Earth. Each one-metre segment of the world is represented by
    a block. The block could be any one of a number of items and the deeper you dig
    into the earth the rarer the items might be. It’s your challenge to dig, build
    and survive against an army of nocturnal monsters by harnessing the items you
    discover.


    Minecraft Pi removes the survival element of the game, leaving you in a kind of
    Lego construction mode, where you have an infinite supply of many of the game’s
    items and free reign to build with them. Minecraft Pi is also the only version
    of Minecraft (which is available on just about every gaming platform in circulation)
    where the player is actively encouraged to hack the world using a simple application
    programming interface (API). In this tutorial we’re going to learn the basics...


    # 01 Install Minecraft Pi


    You’ll need to have Minecraft Pi installed on your Raspberry Pi first – you can
    find our full guide to doing that online at bit.ly/1mgAJ7S. If you know what to
    do with a tar ball and don’t need to follow step-by-step instruction, you just
    need to download the following file and unpack it into your home folder: bit.ly/1pjZ17Z.


    # 02 You must start X


    There are a few things you need to bear in mind when coding and playing Minecraft
    on the Pi. Lots of people seem to get caught out by the fact the game won’t work
    from the command line. Assuming that you haven’t set your Pi to do so, you must
    start the desktop environment with startx. Launch the game from the terminal by
    entering the mcpi folder and typing:


    ```

    ./minecraft-pi

    ```


    ![](img/3b256f430f51c98f1315671f6e4eec19_157_0.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 03 Desktop shortcut


    Launching the game from the terminal isn''t everyone''s cup of tea. Coupled with
    the fact you need a separate terminal window open to launch your Minecraft Pi
    scripts (meaning you need two terminal windows open) it''s worth creating a desktop
    shortcut to launch the game. Open a terminal and type:


    ```

    cd ~/Desktop

    ```


    Now create a new desktop file by typing: nano minecraft.desktop and copy the following
    into it:


    ```

    [Desktop Entry]

    Name=Minecraft Pi

    Comment=Minecraft for the Pi

    Exec=/home/pi/mcpi/minecraft-pi

    Icon=/home/pi/mcpi/logo.png

    Terminal=false

    Type=Application

    Categories=Games;Education;

    StartupNotify=true

    ```


    Press CTRL+X, Y and then press Enter in order to save the file and exit. The icon
    isn''t in the mcpi folder by default, so you will need to do a Google Image search
    for the Minecraft icon, call it ''icon.png'' and drop it into the folder. It needs
    to be 256 x 256 pixels and you may need to restart your desktop environment before
    the icon appears.


    # 04 Tabbing out


    One thing from our online Minecraft Pi tutorial ''bit.ly/1mga7jS'' that''s worth
    reiterating is the fiddly nature of playing Minecraft Pi and starting scripts
    at the same time.


    # Create a new folder to keep the original API files safe


    Minecraft Pi needs to be running before you will be able to start a Python script
    that interacts with the game. This being the case, you will need to press Tab
    from Minecraft Pi in order to release the mouse so that you can then interact
    with the terminal window and load all of your Python scripts.


    # 05 Read the docs!


    You might think there is no documentation to help you code with Minecraft Pi,
    but you''d be wrong. You see, one thing all good software scientists know is that
    the source code for a program doubles up as a great instruction manual. For example,
    all the block types and names you can use in the game can be found by browsing
    through the block.py script found in the /mcpi/api/python/mcpi folder. Even better,
    you are able to find all of the functions you can carry out in the game simply
    by looking in ''minecraft.py'' – they''re even well commented so you know that
    setPos allows you to ''set entity position''.


    # 06 A warning about scripts


    What will you call your very first Minecraft Pi script? There''s an immediate
    temptation to call it ''minecraft.py''. Sadly, doing this can render the scripting
    aspect of Minecraft on the Raspberry Pi broken as you''ve potentially overwritten
    the most important source code file in the game. Take a look in the /mcpi/api/python/mcpi
    folder – each file name is out of bounds!


    # 07 Copy the API folder


    The best way to keep the original API files of Minecraft Pi safe is to create
    a copy of the API folder that can be used separately. Do this by creating a new
    folder in your home folder and entering it (eg mkdir mc_projects && cd mc_projects)
    and then typing the following:


    ```

    cp -r ~/mcpi/api/python/* .

    ```


    The space followed by the full stop is required at the end of the command.'
