    \"UTF-8\\\" /></title>\" + fileName + \"</title></head>\"\nf = open(storeFolder\
    \ + \"/\" + fileName.replace('/', '.') + \".html\", 'w')\nf.write(doctype + \"\
    <html lang=\\\"en\\\">\\n\" + head + \"<body><h1>\" + fileName + \"</h1>\" + str(content)\
    \ + \"</body></html>\")\nf.close()\n```\n\nSTYLING\nCurrently, the HTML page will\
    \ use the built-in browser styles when rendering the page. If you like, you can\
    \ include the style sheet included in the tutorial resources to make it look a\
    \ little nicer. To use it, you can minify the script and include it inside a <style>\
    \ tag in the head string on line 102, or you can rewrite the head string to something\
    \ like:\nhead = \"<head><meta charset=\\\"UTF-8\\\"/><title>\" + fileName + \"\
    </title><style>\" + str(open('/PATH/TO/STYLES/', 'r').read()) + \"</style></head>\"\
    \n\nearlier on in the document. For each different div/section/node that we don't\
    \ want, we call Beautiful Soup's find_all() method and use the extract() method\
    \ to remove that node from the document. At the end of the undesirables loop,\
    \ most of the content we don't want any more will be gone. We also look for the\
    \ 'also' element in the Wiki page. Generally, everything after this div is of\
    \ no use to us. By calling the find_all_next() method on the also node, we can\
    \ get a list of every other element we can remove from that point on.\n\n> Beautiful\
    \ Soup is a fast framework for many Python HTML parsers\n\n# 06 Grabbing the links\n\
    \nBy calling content.find_all('a') we get a list of every <a> in the document.\
    \ We can iterate through this and check whether or not there is a valid Wikipedia\
    \ link in the <a>'s href. If the link is a valid link, we quickly check how far\
    \ down the link tree we are from the original page. If we've reached the maximum\
    \ depth we can go, we'll store this page and call it quits, otherwise we'll start\
    \ looking for links that we can grab within it. For every page we request, we\
    \ append its URL to the addresses list; to make sure we don't call the same page\
    \ twice for each link we find, we check if we've already stored it. If we have,\
    \ then we'll skip over the rest of the loop, but if we've not then we'll add it\
    \ to the list of URLs that we've requested and fire off a request. Once that check\
    \ is done. We then do a quick string replace on that link so that it points to\
    \ the local directory, not to the subfolder /wiki/ that it's looking for.\n\n\
    # 07 Writing to file\n\nNow we create a file to store the newly parsed document\
    \ in for later reading. We change any '/' in the filename to '.' so the script\
    \ doesn't try and write to a random folder. We also do a quick check to see how\
    \ many links we've followed since the first page. If it's the max level, we'll\
    \ add it to the deepestAddresses list. We'll use this a little bit later.\n\n\
    # 08 Tying up loose ends\n\nAfter our script has iterated through every link on\
    \ every page to the maximum level of depth that it can, it will try to exit. On\
    \ line 34 of the code (on the disc and online) in the init function, we registered\
    \ the function cleanUp to execute on the program trying to exit: cleanUp's job\
    \ is to go through the documents that we've downloaded and check that every link\
    \ we've left in the pages does in fact link to a file that we have available.\
    \ If it can't match the link in the href to a file in the addresses list, it will\
    \ remove it. Once we're done, we will have a fully portable chunk of Wikipedia\
    \ we can take with us."
