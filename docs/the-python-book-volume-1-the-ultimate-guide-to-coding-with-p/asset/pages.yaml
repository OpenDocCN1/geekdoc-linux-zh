    \n# Parsing JSON data\n\nJSON (also known as JavaScript Object Notation) is a\
    \ lightweight modern data-interchange format. JSON is an open standard under ECMA-262.\
    \ It is a text format and is completely language-independent. JSON is also used\
    \ as the configuration file format for modern applications such as Mozilla Firefox\
    \ and Google Chrome. JSON is also very popular with modern web services such as\
    \ Facebook, Twitter, Amazon EC2 etc. In this section we will use the Python module\
    \ 'simplejson' to access Yahoo Search (using the Yahoo Web Services API), which\
    \ outputs JSON data.\n\nTo use this section, you should have the following:\n\n\
    +   1. Python module: simplejson.\n+   Note: You can install Python modules using\
    \ the command 'easy_install <module name>'. This command assumes that you have\
    \ a working internet connection.\n+   2. Yahoo App ID: The Yahoo App ID can be\
    \ created from https://developer.apps.yahoo.com/dashboard/createKey.html. The\
    \ Yahoo App ID will be generated on the next page. See the screenshot below for\
    \ details.\n\n![](img/3b256f430f51c98f1315671f6e4eec19_98_0.png)\n\nGenerating\
    \ the Yahoo App ID\n\nsimplejson is very easy to use. In the following example\
    \ we will use the capability of mapping JSON data structures directly to Python\
    \ data types. This gives us direct access to the JSON data without developing\
    \ any XML parsing code.\n\n# JSON PYTHON DATA MAPPING\n\n| JSON | Python |\n|------|--------|\n\
    | object | dict |\n| array | list |\n| string | unicode |\n| number (int) | int,\
    \ long |\n| number (real) | float |\n| TRUE | TRUE |\n| FALSE | FALSE |\n| null\
    \ | None |\n\nFor this section we will use the simplejson.load function, which\
    \ allows us to deserialise a JSON object into a Python object.\n\n```\n@code:LUDYSearch.py\n\
    import simplejson, urllib\nAPP_ID = 'xxxxxxx' # Change this to your APP ID\nSEARCH_BASE\
    \ = 'http://search.yahooapis.com/WebSearchService/V1/webSearch?'\n```\n\n```\n\
    class YahooSearchError(Exception):\n    pass\n\ndef search(query, results=20,\
    \ start=1, **kwargs):\n    kwargs.update({\n        'appid': APP_ID,\n       \
    \ 'query': query,\n        'results': results,\n        'start': start,\n    \
    \    'output': 'json'\n    })\n    url = SEARCH_BASE + '?' + urllib.urlencode(kwargs)\n\
    \    result = simplejson.load(urllib.urlopen(url))\n    if 'Error' in result:\n\
    \        # An error occurred; raise an exception\n        raise YahooSearchError,\n\
    \        result['Error']\n    return result['ResultSet']\n```\n\nLet's use the\
    \ above code from the Python shell to see how it works. Change to the directory\
    \ where you have saved the LUDYSearch.py and open a Python shell.\n\n```\n@code:\
    \ Python Shell Output. Lines starting with >>> indicate input\n>>> execfile('LUDYSearch.py')\n\
    >>> results = search('Linux User and Developer')\n>>> results['totalResultsAvailable']\n\
    123000000\n```\n\n```\n>>> results['totalResultsReturned']\n20\n>>> items = results['Result']\n\
    >>> for Result in items:\n...     print\n...     Result['Title'],Result['Url']\n\
    ...\nLinux User http://www.linuxuser.co.uk/\nLinux User and Developer - Wikipedia,\
    \ the free encyclopedia http://en.wikipedia.org/wiki/Linux_User_and_Developer\n\
    Linux User &amp; Developer | Linux User http://www.linuxuser.co.uk/tag/linux-user-developer/\n\
    ```\n\n# Gathering system information\n\nOne of the important jobs of a system\
    \ administrator is gathering system information. In this section we will use the\
    \ SIGAR (System Information Gatherer And Reporter) API to demonstrate how we can\
    \ gather system information using Python. SIGAR is a very complete API and it\
    \ can provide lot of information, including the following:\n\n+   1. System memory,\
    \ swap, CPU, load average, uptime, logins.\n+   2. Per-process memory, CPU, credential\
    \ info, state, arguments, environment, open files.\n+   3. File system detection\
    \ and metrics.\n+   4. Network interface detection, configuration info and metrics.\n\
    +   5. TCP and UDP connection tables.\n+   6. Network route table.\n\n# Installing\
    \ SIGAR\n\nThe first step is to build and install SIGAR. SIGAR is hosted at GitHub,\
    \ so make sure that you have Git installed in your system. Then perform the following\
    \ steps to install SIGAR and its Python bindings:\n\n```\n$ git clone git://github.com/hyperic/sigar.git\n\
    $ cd sigar.git/bindings/python\n$ sudo python setup.py install\n```\n\n> Python\
    \ doesn't limit your choice of interface"
