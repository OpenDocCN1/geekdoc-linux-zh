  md: "# 07\n\nHere we define the actual beginning of the code, with the function\
    \ we've called 'start'. It's quite simple, printing our greeting to the player\
    \ and then starting a while loop that will allow us to keep playing the game as\
    \ many times as we wish. The pass statement allows the while loop to stop once\
    \ we've finished, and could be used to perform a number of other tasks if so wished.\
    \ If we do stop playing the game, the score function is then called upon – we'll\
    \ go over what that does when we get to it.\n\n# 08\n\nWe've kept the game function\
    \ fairly simple so we can break down each step a bit more easily in the code.\
    \ This is called upon from the start function, and first of all determines the\
    \ player move by calling upon the move function below. Once that's sorted, it\
    \ sets the computer move. It uses the random module's randint function to get\
    \ an integer between one and three (1, 3). It then passes the player and computer\
    \ move, stored as integers, onto the result function which we use to find the\
    \ outcome.\n\n```\ndef start():\n    print \"Let's play a game of Rock, Paper,\
    \ Scissors.\"\n    while game():\n        pass\n    scores()\n```\n\n```\ndef\
    \ game():\n    player = move()\n    computer = random.randint(1, 3)\n    result(player,\
    \ computer)\n    return play_again()\n```\n\n```\ndef move():\n    while True:\n\
    \        print\n        player = raw_input(\"Rock = 1\\nPaper = 2\\nScissors =\
    \ 3\\nMake a move: \")\n```\n\n```\ntry:\n    player = int(player)\n    if player\
    \ in (1,2,3):\n        return player\nexcept ValueError:\n    pass\nprint \"Oops!\
    \ I didn't understand that. Please enter 1, 2 or 3.\"\n```\n\n![](img/3b256f430f51c98f1315671f6e4eec19_28_0.png)\n\
    \n# 09\n\nWe start the move function off by putting it into a while loop. The\
    \ whole point of move is to obtain an integer between one and three from the player,\
    \ so the while loop allows us to account for the player making an unsupported\
    \ entry. Next, we're setting the player variable to be created from the player's\
    \ input with raw_input. We've also printed instruction text to go along with it.\
    \ The '\\n' we've used in the text adds a line break; this way, the instructions\
    \ appear as a list.\n\n# 10\n\nThe try statement is used to clean up code and\
    \ handle errors or other exceptions. We parse what the player entered by turning\
    \ it into an integer using int(). We use the if statement to check if it is either\
    \ 1, 2, or 3 – if it is, move returns this value back up to the game function.\
    \ If it throws up a ValueError, we use except to do nothing. It prints an error\
    \ message and the while loop starts again. This will happen until an acceptable\
    \ move is made."
