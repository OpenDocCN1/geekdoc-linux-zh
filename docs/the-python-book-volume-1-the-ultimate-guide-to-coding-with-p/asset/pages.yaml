    \ window\n        self.socket = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    \        self.socket.connect((server, port))\n        self.listening = True\n\
    \        # Tell the server that a new user has joined\n        self.send(\"USERNAME\
    \ {0}\".format(username))\n```\n\n```\ndef listener(self):\n    # A function run\
    \ as a thread that listens for new messages\n    while self.listening:\n     \
    \   data = \"\"\n        try:\n            data = self.socket.recv(1024)\n   \
    \     except socket.error:\n            \"Unable to receive data\"\n        self.handle_msg(data)\n\
    \    # Don't need the while loop to be ridiculously fast\n    time.sleep(0.1)\n\
    ```\n\n# 17 Running a function as a thread\n\nThe listener function above will\
    \ be run as a thread. This is trivial to do. Enabling the daemon option on the\
    \ thread means that it will die if the main thread unexpectedly ends.\n\n```\n\
    def listen(self):\n    # Start the listening thread\n    self.listen_thread =\
    \ threading.Thread(target=self.listener)\n    # Stop the child thread from keeping\
    \ the application open\n    self.listen_thread.daemon = True\n    self.listen_thread.start()\n\
