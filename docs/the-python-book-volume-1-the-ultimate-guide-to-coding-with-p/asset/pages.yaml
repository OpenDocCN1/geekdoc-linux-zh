    This ensures that all the requests will be processed by ludissues.urls first.


    # 08 Creating ludissues.url


    Create a urls.py file in the app directory (ludissues/urls.py) with the following
    content:


    ```

    from django.conf.urls import patterns, include, url

    # use ludissues model

    from models import ludissues

