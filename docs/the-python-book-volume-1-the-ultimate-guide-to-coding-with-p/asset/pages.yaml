  md: "# Making web apps with Python\n\nPython provides quick and easy way to build\
    \ applications, including web apps. Read on to find out how to use it to build\
    \ a feature-complete web app\n\nPython is known for its simplicity and capabilities.\
    \ At this point it is so advanced that there is nothing you cannot do with Python,\
    \ and conquering the web is one of the possibilities. When you are using Python\
    \ for web development you get access to a huge catalogue of modules and community\
    \ support – make the most of them.\n\nWeb development in Python can be done in\
    \ many different ways, right from using the plain old CGI modules to utilising\
    \ fully groomed web frameworks. Using the latter is the most popular method of\
    \ building web applications with Python, since it allows you to build applications\
    \ without worrying about all that low-level implementation stuff. There are many\
    \ web frameworks available for Python, such as Django, TurboGears and Web2Py.\
    \ For this tutorial we will be using our current preferred option, Django.\n\n\
    # 01 Creating the Django Project magazine issue tracker\n\nThe django-admin.py\
    \ file is used to create new Django projects. Let’s create one for our issue tracker\
    \ project…\n\nIn Django, a project represents the site and its settings. An application,\
    \ on the other hand, represents a specific feature of the site, like blogging\
    \ or tagging. The benefit of this approach is that your Django application becomes\
    \ portable and can be integrated with other Django sites with very little effort.\n\
    \n```\n$ django-admin.py startproject ludissuetracker\n```\n\nA project directory\
    \ will be created. This will also act as the root of your development web server\
    \ that comes with Django. Under the project directory you will find the following\
    \ items…\n\nmanage.py: Python script to work with your project.\n\nludissuetracker:\
    \ A python package (a directory with __init__.py file) for your project. This\
    \ package contains your project’s settings and configuration data.\n\n# 02 Configuring\
    \ the Django project settings\n\nBefore we start working on the application, let’s\
    \ configure the Django project as per our requirements.\n\nEdit ludissuetracker/settings.py\
    \ as follows (only parts requiring modification are shown):\n\nDatabase Settings:\
    \ We will be using SQLite3 as our database system.\n\nNOTE: Red text indicates\
    \ new code or updated code.\n\n```\n'default': {\n    'ENGINE': 'django.db.backends.sqlite3',\n\
    \    'NAME': 'ludsite.db',\n```\n\n# Path settings\n\nDjango requires an absolute\
    \ path for directory settings. But we want to be able to pass in the relative\
    \ directory references. In order to do that we will add a helper Python function.\
    \ Insert the following code at the top of the settings.py file:\n\n```\nimport\
    \ os\ndef getabspath(*):\n    return os.path.join(os.path.abspath(os.path.dirname(__file__)),\
    \ * )\n```\n\nNow you can update the path options:\n\n```\nTEMPLATE_DIRS = (\n\
    \    getabspath('templates')\n)\nMEDIA_ROOT = getabspath('media')\n```\n\n# Resources\n\
    \nPython 2.7:\nhttps://www.python.org/download/releases/2.7/\n\nDjango version\
    \ 1.4:\nhttps://www.djangoproject.com/"
