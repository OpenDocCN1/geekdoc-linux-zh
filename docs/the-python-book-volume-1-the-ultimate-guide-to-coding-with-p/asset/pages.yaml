    |---|---|

    | There are other modules you can import with basic Python. Some of the major
    ones are shown to the right. There are also many more that are included as standard
    with Python. | string | Perform common string operations |

    |  | datetime and calendar | Other modules related to time |

    |  | math | Advanced mathematical functions |

    |  | json | JSON encoder and decoder |

    |  | pydoc | Documentation generator and online help system |'
