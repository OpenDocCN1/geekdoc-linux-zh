  md: "# Create with Python\n\n```\ntry:\n    session['verified'] == True\nexcept\
    \ KeyError:\n    session['verified'] = ''\n\ntry:\n    session['loggedin'] ==\
    \ True\nexcept KeyError:\n    session['loggedin'] = ''\n\ntry:\n    session['user']\
    \ == True\nexcept KeyError:\n    session['user'] = ''\n```\n\n# 06 Logging in\n\
    \nThe first step in two-step authentication is logging in with a traditional username/email\
    \ and password. Access your database and create a new user with the following\
    \ query:\n\n```\nINSERT INTO users (username, password, phonenumber) VALUES (\
    \ 'USERNAME', 'PASSWORD', '+44YOURUSERSPHONENUMBER' )\n```\n\nFor the purposes\
    \ of this tutorial, the password is plain text – but we implore you, when you’re\
    \ implementing passwords in a live environment, make sure that you hash them.\
    \ Still, for now we’re going to use a plain text password. Our login.html template\
    \ has a form that’s going to POST itself to check-user, here we’ll check the validity\
    \ of the credentials and then trigger the verification if needed. So we’re going\
    \ to use the MySQLDB module to get details from our database.\n\nIn order to query\
    \ our database we need to create a cursor from which to execute our MySQL statements.\
    \ We do this with cur = db.cursor():\n\n```\n@app.route('/check-user', methods=['POST'])\n\
    def checkUser():\n    #session.clear()\n    if request.method == 'POST':\n   \
    \     #print request.form['username']\n        cur = db.cursor()\n        cur.execute(\"\
    SELECT * FROM users WHERE username = %s\" , (request.form['username'],))\n```\n\
    \n```\nresult = cur.fetchone()\nreturnedPassword = result[2]\nreturnedPhoneNumber\
    \ = result[3]\n```\n\nWe can then build an SQL statement using cur.execute().\
    \ Notice the %s; this will be replaced with the value passed through in the next\
    \ variable. We execute the statement with cur.fetchone(), which will get us the\
    \ first row that the query returns – if there is no result we’ll get None and\
    \ we can then return the user to the login page with an error message. Let’s assume\
    \ we’ve requested a valid user – we’ll next check that the password assigned to\
    \ that user is the same as the one submitted. If so, we’ll generate the validation\
    \ code to send to the user, which we’ll store in the verification table of our\
    \ database until it’s used or expires. We’ll need to create a new cursor to insert\
    \ the verification code into our table. After we’ve executed the statement we\
    \ need to commit the changes to the database, we do this with db.commit() – we’ll\
    \ then add the results of the query to our session so we can check against them\
    \ later. (Fig 03)\n\n# 07 Send the verification code\n\nNow that we believe we’re\
    \ dealing with a valid user, it’s time for the second step of our two-step process.\
    \ On the line after where we stored a variable in our session, we make a call\
    \ to sendVerificationCode (VERIFICATION CODE, USER PHONE NUMBER) and pass through\
    \ the code we want to send to our user and the user’s phone number. So what does\
    \ that function actually look like? It must be big, long and complicated because\
    \ it deals with the telecommunications network, right? Wrong. It’s actually incredibly\
    \ simple to send an SMS with Twilio. In fact, part of the inherent beauty of Twilio\
    \ lies in its simplicity. To send a text, all we have to do is:\n\n```\ndef sendVerificationCode(code,\
    \ number):\n    text = client.messages.create(\n        body=\"Your verification\
    \ code is:\" + code,\n        to=number,\n        from=\"+YOURTWILIONUMBER\"\n\
    \    )\n    return text.sid\n```\n\nUsing the client variable we used to instantiate\
    \ the Twilio REST module, we can access the messages class and execute the create\
    \ method. All we need to pass through is the text that will make up the body of\
