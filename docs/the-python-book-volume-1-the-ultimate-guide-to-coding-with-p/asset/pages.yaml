- pgno: 166
  md: '# Raspberry Pi Car Computer


    Make your own touchscreen navigation system that gives directions, local weather
    reports and plays music


    Cars are getting clever. These days, with smart navigation interfaces built into
    new cars, you don’t need to go out and buy yourself a TomTom to get help with
    directions. But if you’ve got a Raspberry Pi then you don’t even need to buy that
    – let alone a new car!


    In this project we will show you how to build your own car computer with your
    Pi, a quality touchscreen like the 9-inch model from SainSmart that we’re using
    here, and a few other bits like a GPS module and USB 3G modem. Your CarPi will
    be able to use open source navigation software Navit to show your route map on
    screen, plus speech synthesis to read out directions, and it will also be able
    to check your location and give you weather reports. It’ll work as a music player
    too, of course.


    It’s an ambitious project, but you will gain a solid understanding of custom-made
    interfaces, navigation software and geolocation data, touchscreen calibration,
    speech synthesis and more. While you don’t have to use the same SainSmart screen
    as us, we do recommend it for this project as it is one of the few large touchscreens
    out there for the Pi. There are more improvements at the end too, so check the
    components list, make sure you’ve got everything and let’s get started!'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/3b256f430f51c98f1315671f6e4eec19_167_0.png)


    Above We''re using Adafruit''s excellent GPS Breakout kit here: bit.ly/1GBX2gw


    # 01 Basic configuration


    Boot up your Raspberry Pi and expand the filesystem using raspi-config. Go to
    Advanced Options and disable the Serial connection – you''ll need this to talk
    to the GPS module later. In raspi-config, enable X at boot as the pi user. Say
    Yes to reboot. Once rebooted, ensure your packages are up to date with:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    ![](img/3b256f430f51c98f1315671f6e4eec19_167_1.png)


    # 02 Connect GPS module


    Solder the pin headers onto the Adafruit GPS module. You can also solder the battery
    connector which is used to keep the device partially active, giving a faster fix.
    You only need to use 4 pins: 3.3V, ground, serial transmit and serial receive.
    Power the Pi off again before connecting anything.


    As we are using GPS, the antenna will have to go outside or under a window to
    gain signal. Connect the antenna to the board and power everything back on. The
    light on the GPS module will flash frequently while finding a fix. Once it has
    one, it will blink every 15 seconds.


    # 03 Install navigation software


    Begin to install the Navit navigation software by entering:


    ```

    sudo apt-get install navit gpsd gpsd-clients espeak

    sudo nano /etc/default/gpsd

    set START_DAEMON="true"

    ```


    ...and set:


    ```

    DEVICES="/dev/ttyAMA0"

    ```


    Start the GPS daemon with:


    ```

    sudo /etc/init.d/gpsd start

    ```


    You can check it''s working by looking at the GPS data with:


    ```

    cgps -s

    ```


    # 04 Connect the screen


    The SainSmart screen doesn''t come with any written instructions. Instead there
    is a YouTube video on their website with details about how to put it together:
    bit.ly/1DF6eJJ. The important part is that the DC power supply should be 12V.


    # 05 Set the screen resolution


    We will have to force the correct resolution (1024x600) for the screen by editing
    /boot/config.txt with sudo. To do so, add the following options:


    ```

    framebuffer_width=1024

    framebuffer_height=600

    hdmi_force_hotplug=1

    hdmi_cvt=1024 600 60 3 0 0 0

    hdmi_group=2

    hdmi_mode=87

    ```


    For the changes to properly take effect you will need to reboot with sudo reboot.


    # 06 Download kernel source


    To start the touchscreen, you need to compile an extra kernel module to support
    it. The program rpi-source (github.com/notro/rpi-source/wiki) will find the source
    of your kernel. Install rpi-source with:


    ```

    sudo wget https://raw.githubusercontent.com/notro/rpi-source/master/rpi-source
    -O /usr/bin/rpi-source

    && sudo chmod +x /usr/bin/rpi-source && /usr/bin/rpi-source -q --tag-update

    ```


    Then run rpi-source to get the source of the running kernel.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# 07 Update GCC\n\nRecent Raspberry Pi kernels are compiled with GCC 4.8. Raspberry\
    \ only comes with 4.6 so you will have to install 4.8 to continue with the following\
    \ steps. Do this by entering:\n\n+   - `sudo apt-get install -y gcc-4.8 g++-4.8\
    \ ncurses-dev`\n\nThen you have to set GCC 4.8 as the default:\n\n+   - `sudo\
    \ update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.6 20`\n+   - `sudo\
    \ update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 60`\n+   - `sudo\
    \ update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-4.6 20`\n+   - `sudo\
    \ update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-4.8 50`\n\n# 08\
    \ Pick the module to compile\n\nRpi-source puts the kernel source in a folder\
    \ called 'linux'. To choose the USB Touchscreen Driver, enter the following:\n\
    \n+   - `cd linux`\n+   - `make menuconfig`\n+   - Device Drivers -> Input device\
    \ support -> Generic input layer (needed for keyboard, mouse, ...) -> Touchscreens\
    \ (press space to include) -> USB Touchscreen Driver (press M to make module)\n\
    \nOnce you've done that, you then need to make sure you save your changes as '.config'\
    \ and run scripts/diffconfig to see the differences.\n\n# 09 Compile and install\
    \ the module\n\nNow you need to compile and install the module. Do so by entering:\n\
    \n+   - `make prepare`\n+   - `make SUBDIRS=drivers/input/touchscreen modules`\n\
    +   - `sudo make SUBDIRS=drivers/input/touchscreen modules_install`\n+   - `sudo\
    \ depmod`\n\nIf you unplug and reconnect the touchscreen, it should work fine\
    \ but it will probably need calibrating.\n\n```\n```python\n#!/usr/bin/env python2\n\
    \nimport os, sys, requests, pygame\nfrom gps import *\nfrom pygame.locals import\
    \ *\n\nclass WeatherClient:\n    apikey = \"7232a1f6857090f33b9d1c7a74721\"\n\n\
    \    @staticmethod\n    def latlon():\n        gpsd = gps(mode=WATCH_ENABLE)\n\
    \n        # Needs better error handling\n        try:\n            while True:\n\
    \                report = gpsd.next()\n                if report['class'] == 'TPV':\n\
    \                    gpsd.close()\n                    return report['lat'], report['lon']\n\
    \        except:\n            return None, None\n\n    @staticmethod\n    def\
    \ usefuldata(j):\n        # Returns a string of useful weather data from a LOT\
    \ of json\n        d = j['data']['current_condition'][0]\n        out = \"Now\
    \ - Temp: {0}C, Feels Like: {1}C, Description: {2}\\n\"\\\n            .format(d['temp_C'],\n\
    \                    d['FeelsLikeC'],\n                    d['weatherDesc'][0]['value'])\n\
    \n        hourly = j['data']['weather'][0]['hourly']\n        hour_count = 1\n\
    \        for h in hourly:\n            out += (\"+{0}hr - Temp: {1}C, Feels Like:\
    \ {2}C, Chance of Rain: \"\n                    \"{3}%, Description: {4}\\n\"\
    )\\\n                    .format(hour_count,\n                            h['tempC'],\n\
    \                            h['FeelsLikeC'],\n                            h['chanceofrain'],\n\
    \                            h['weatherDesc'][0]['value'])\n            hour_count\
    \ += 1\n\n        # Rstrip removes trailing newline\n        return out.rstrip()\n\
    \n    @staticmethod\n    def update():\n        errstr = \"Error getting weather\
    \ data\"\n\n        lat, lon = WeatherClient.latlon()\n        if lat == None\
    \ or lon == None:\n            return\n\n        api_req = (\"http://api.worldweatheronline.com/free/v2/weather.ashx?\"\
    \n                   \"q={0}%2C{1}&format=json&key={2}\").format(lat, lon,\n \
