    # # Manjaro Linux


    Helps all users leverage the power of Arch with its powerful custom tools


    # # RevengeOS


    A lightweight distribution with tools to help you choose and customise


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_82_0.png)


    +   - With MSM you can install proprietary drivers for connected hardware and
    switch between them with a single click


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_82_1.png)


    +   - With the distros'' Software Installation Tool you can install popular and
    multimedia apps with a single click


    # Installation


    Manjaro is available in three official flavours and while the project doesn''t
    recommend one over another we''ve used the Xfce edition which is listed first
    on the download page. All editions use a Calamares installer that enables you
    encrypt the partition in which you plan to install the desktop


    # Installation


    RevengeOS uses its own home-born Nemesis installer. It offers three types to install
    - Normal, OEM, and StationX. The installer is fairly intuitive to navigate and
    allows you choose between two desktop environments. The partitioning steps offer
    an automatic installation option but just free Gparted for manual partitioning.


    # Pre-installed apps


    Manjaro includes all the mainline popular apps such as LibreOffice suite, GIMP,
    VLC, Firefox, Thunderbird, Steam client, etc. The desktop is stuffed with useful
    apps from the Xfce. If you need more apps from the repos, the Xfce edition uses
    Pacman for package management and handling updates.


    # Pre-installed apps


    During installation you get to see a welcome screen that permits to install useful
    software such as LibreOffice, Wine, Steam client, etc. Besides these, the desktop
    contains pre-installed virtualbox machines and another to install Nvidia drivers.
    There''s also a custom control for accessing various tools for managing all aspects
    of the system, from switching wallpapers to installing desktop codecs and switches.


    # Usability


    Manjaro is very usable since it avoids the regular issues of aesthetics. The Xfce
    desktop follows the conventional desktop metaphor and will a large number of potential
    users. Another plus is the project''s custom tools - especially the Manjaro Settings
    Manager - allows users to take advantage of the Arch benefit.


    # Support


    The welcome screen links to join the Google+ community forum and another to the
    distro''s fairly active forum boards. Here you''ll find peers discussing problems
    regarding installation and any issues you may have. The website also has a wiki
    with some articles you may find useful.


    # Help & support


    Manjaro longs the chat with Wiki on Vimeo over two videos about aspects of the
    desktop and its distribution. Their wiki is fairly detailed and well categorized,
    and the project hosts most fulfilling forums and IRC channels. The distro also
    bundles a detailed PDF user guide.


    # Help & support


    # Overall


    # Overall


    Manjaro''s developers have gone to lengths to help users experience the power
    of Arch. With its custom tools and bundled apps, the ready-to-use desktops excel
    in both function and form.


    Overflow with tools and scripts, RevengeOS is a well crafted distribution that
    does a wonderful job of handling new users and helping them to get grips with
    Arch.'
