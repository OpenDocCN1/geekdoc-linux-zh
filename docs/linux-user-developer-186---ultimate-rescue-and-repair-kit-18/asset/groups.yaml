    ## 评测 iStore DiskAshur Pro 2


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_85_0.png)


    ## 硬件


    ## iStore diskAshur Pro 2


    表面上是一个昂贵的便携硬盘，但良好的安全性从不廉


    - 价格：195 英镑起（约 249 美元）

    - 网站：https://istore.uk.com

    - 容量：500GB-5TB

    - 数据传输速度：高达 10Gbps（读/写）

    - 电源：USB 总线供电

    - 接口：USB-C

    - 硬件加密：AES-256 位

    - 质保：2 年

    - 尺寸：124mmx84mmx20mm (500GB/1TB, 2TB)

    - 重量：500GB/1TB/2TB, 3TB/4TB/5TB


    对于每天携带敏感信息的人来说，丢失携带信息的设备（或被盗）是一个一直的问题。diskAshur Pro 2 外硬盘是一个紧凑设备，旨在无需软件的安全运行。Pro
    2 的零售价为


    最后，获胜者是在 Anteros 和 Manjaro 之间产生的。Anteros 的一个大优势是它在安装期间提供了多个桌面的选项。除了没有其他自定义工具外，它在视觉上也很易用。


    另一方面，Manjaro 包含了非常有用的 Manjaro 设置管理器帮助用户利用 Arch 生态系统而无需陷入琐碎细节。它还装满了应用，可以开箱即用。


    该项目拥有自己的专用软件仓库，提供经过彻底测试且稳定的软件，这些软件与 Arch 及其仓库配合良好，并可用于前沿软件。


    最后，Manjaro 仍然是极少数独立开发的、同时适用于 32 位和 64 位架构的发行版之一。


    > Manoj Sharma


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_86_0.png)


    > 设备具有多种保护措施以防御外部篡改


    从设计角度来看，有两个功能使其与不同：第一个是内置 USB。另一个亮点是数字键盘。


    该单元带有一个默认密码，你可以直接通过数字键盘进行更改。你甚至可以定义一个“自毁”序列，当密码和数据被评估时会执行内部擦除。


    如果错误输入代码十次，硬盘将重置加密密钥，导致内容无法访问。Pro 2 的零售价为。


    对于大多数人来说，Pro2 在安全性方面足够。


    以 65MB/s 的读取速度和 144MB/s 的写入速度，Pro2 内部的旋转磁盘确实有些门道。SSD 会更快（更大），但性能水平足够，并且像使用硬盘存储的
    PC 一样快速。单元本身通过了认证，具有防水功能。额外的物理保护是键盘按键涂了环氧树脂。这使得很难判断哪些按键被定期擦除。


    Mark Pickering


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_86_1.png)


    ## 优点


    制作精良，提供了极佳的数据安全。由于自包含，它适用于任何 Linux 驱动


    ## 缺点


    一物有所值，所以它很贵，且设置可能很复杂


    ## 总结


    一个能够处理物理滥用和恶意攻击的安全存储设备需要高昂的价格。这种经过深思的设计与精良设备的结合非常有吸引力。


    www.linuxuser.co


