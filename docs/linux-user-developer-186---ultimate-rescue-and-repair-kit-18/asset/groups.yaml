    # 硬件


    ## Intel 管理引擎中的严重漏洞


    SPS 和 TXE 技术中也发现了安全漏洞


    正在使用 Intel 个人电脑或笔记本电脑吗？你的电脑正面临风险。隐藏在 Intel 管理引擎（ME）中的威胁——这被称为“计算机中的计算机”，且已在 2016
    年被证实存在漏洞——使得任何支持 Intel 的 Linux、Apple Mac 或 Windows 设备都可能被劫持，即使在没有操作系统的情况下也是。


    第三方专家（位于英国）发现，除了 ME 之外，服务器平台服务 (SPS) 和可信执行引擎 (TXE) 也容易受到任何伪装成特权 root 的用户的攻击。他们可以安装
    rootkit 并进行覆盖写入。当用户登录时，被劫持的账户可以从内存中访问系统的所有数据。共享内存和服务面临尤为风险，且可以通过 USB 闪盘引入利用 ME
    的代码。


    由于该技术首次于 2008 年引入，目前使用的绝大多数处理器都有此漏洞。这包括第 6 代至第 8 代的 Intel Core CPU、低端赛扬和 Intel
    Xeon 芯片。


    ME 被一些安全评论员描述为“后门”，它本质上是一个带有独立操作系统的微型计算机。自 2015 年以来（类 Unix 的 MinIX），它一直独立于你的操作系统运行，无论杀毒软件的权限范围如何。


    那么为什么要包含它呢？Intel 管理引擎旨在为远程访问和工作站提供支持，以便专家能够提供支持并在后期安装和启用操作系统，这些在许多组织中至关重要。


    Positive Technologies 的研究员 Michal Goryakh 表示：“攻击者可以绕过传统工具（如杀毒软件）提供的安全检测。”


    Intel 表示可以从其下载中心获取漏洞（INTEL-SA-0086）。补丁已经发布。然而，不要期望你的操作系统会提供任何更新。如果你的系统受到影响，你需要联系硬件的
    OEM。


    # 前五名


    ## 开源网页浏览器


    ### 1 Mozilla Firefox（火狐）


    在巨大的宣传声势中发布，Firefox 57（被称为 Quantum）改写了历史，它比 Chrome 更快，且内存占用减少了 30%。然而，Firefox
    的未来尚不确定，但它的实力是否足以挑战 Chrome 呢？


    ### 2 Midori


    Midori 采用 WebKit 渲染引擎，与 Xfce 桌面相关并按照相同的原理开发。只需投入少量精力，就能在许多 Linux 发行版中找到它。


    ### 3 Chromium


    任何用过 Google Chrome 的人对它的开源都很熟悉。但如果具有相同的功能，以及扩展程序呢？Chromium 快速且易于使用。


    ### 4 Brave


    Brave 基于 Chromium 并由项目联合创始人 Brendan Eich 开发，通过阻止追踪器和广告，向广告商展示更少的数据。


    ### 5 GNOME Web


    以前名为 Epiph，它依然很强大（该包保留了新的 epiphany-browser，并使用 WebKit 渲染引擎）。最近增加了 Mozilla Sync，实现了跨设备的连续性。


    # 开源


    你的 Linux 新闻与观点来源


