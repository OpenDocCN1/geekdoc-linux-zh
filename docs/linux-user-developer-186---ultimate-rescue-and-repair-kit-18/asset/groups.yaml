    # Tutorial


    # Minecraft


    # Drawing vector shapes in Minecraft with Python code


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_73_0.png)


    Let''s build some shapes in Minecraft using nothing but a few lines of Python
    code and the handy McPiFoMo.


    # Calvin Robinson


    is Head of Computer Science at an all-through CoFE staff in Barnet. Calvin also
    works with schools all over London, providing high-quality curricula.


    Just make sure you pop it in the ~/home/minecraft directory along with McPiFoMo.
    Another way of installing ''Minecraft'' is `sudo pip install minecraftstuff` or
    `sudo pip3 install minecraftstuff`.


    # Python prep


    We''re going to create a new .py file in our favourite text editor and import
    all the relevant Minecraft modules.


    # Resources


    - McPiFoMo: http://github.com/co.uk/McPiFoMo.rar

    - Blocks IDs: http://bit.ly/MC-BlockIDs

    - Minecraft Stuff: http://bit.ly/MC-stuff


    ```python

    import mcpi.minecraft as minecraft

    import mcpi.block as block

    import server

    import time

    import minecraftstuff

    ```


    This issue is looping back to where we started with the Python coding to draw
    shapes directly in our worlds.


    # 03 Connecting to Minecraft


    This tutorial is written with Pi Edition in mind, but you don''t have to be running
