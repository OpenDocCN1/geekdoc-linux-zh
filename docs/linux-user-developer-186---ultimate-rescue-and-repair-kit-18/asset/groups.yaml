    # WHAT NEXT?


    ## Alternatives to Burp


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_48_0.png)


    The OWASP ZAP is an incredible and powerful open source tool similar in functionality
    to Burp. It comes with a lot of features and is perfect for testing web applications
    and can be automated within your CI/CD pipeline.


    http://zaproxy.org/zap/


    ## 1 OWASP ZAP


    ZAP (Zed Attack Proxy) is a free and open source security tool for finding vulnerabilities
    in web applications. It is used by both beginners and professionals.


    ```

    apt-get install zap

    ```


    ## 2 mitmproxy


    mitmproxy is an intercepting proxy that handles HTTP and HTTPS traffic with an
    incredible graphical interface. If you are a fan of the command line, this tool
    is for you.


    ```

    apt-get install mitmproxy

    ```


    ## 3 TamperData


    An outlived Firefox add-on, but still functional in Burp. It is as simple as it
    gets: intercept and modify traffic. It is quite limited, but perfect for quick-and-dirty
    tasks on the fly.


