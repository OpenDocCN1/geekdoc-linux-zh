    # Tutorial


    # Java


    PART FIVE


    # # Making a game in Java:

    Dependency injection


    The Spring Framework is one of the most popular Java tools, and this project is
    a great opportunity to learn more about it


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_53_0.png)


    # John Gowers


    is a university tutor in Programming and Computer Science, with a strong focus
    on Java. He likes to install every thing he can get his hands on.


    # Resources


    +   - ■ OpenJDK 1.8

    See your package manager or download from openjdk.java.net


    +   - ■ JavaFX 8

    See your package manager or download from openjdk.java.net/projects/javafxfx


    +   - ■ Eclipse IDE

    See your package manager and download from eclipse.org


    +   - ■ Spring Framework

    Installation instructions in article


    This month''s Java tutorial has a slightly different focus from previous issues:
    instead of making any modifications to the functionality of, we are rewriting
    our existing code in order to fit it into a Spring software framework code. Unlike,
    taking responsibility for an entire program, here we work with a framework that
    provides the infrastructure for the framework and configuring it to use them.


    We have set up our program, with important classes injected via interfaces, which
    is well suited to this style of programming. By using the Spring Framework, which
    is probably the most popular framework for Java, using Spring will allow us to
    incorporate an important design dependency injection – which cannot be used with
    Java alone.


    If you haven''t been following the series so far, you can get up to speed with
    a working version of the assignment from last month. The file eggs.tar on the
    copy disk, and download it to your system. In Eclipse, select General


    > > Importing Projects into Workspace, and then Select ''archive file'', followed
    by ''Browse...''. Navigate to eggs.tar and click ''Finish'' to import the project.


    # Dependency injection


    The key concept with dependency injection is that between classes. A class Master
    has a dependency on a class Service if the Service is mentioned somewhere in the
    code of the Master. For example, if Master has a type of Service. While there
    is explicit decoupling of the two classes, it is better practice to write an interface
    that the Master class depends on instead of the implementing class. By using the
    ServiceType interface which should provide all the methods from Service that are
    used by the Master class, decouples our program and allows us to use different
    implementations of the ServiceType interface, which are passed into the Master
    class by its constructor.'
- md: '

    This approach is the one we''ve taken in the Eggs game from the beginning. All
    the services - TextMap, ConsoleOutputViewer: ServerHead and so on - are based
    on interfaces, and classes as StandardGameHolder have a dependency on these interfaces,
    rather than implementing the classes. The interfaces provide the methods that
    StandardGameHolder uses, but have different functions; for example, the ConsoleOutputViewer
    and ServerHead both implementing the OutputInterface but we instantiated in the
    program that any Spring class could create.


    All this at a small cost, however, in the main we have to instantiate every service
    class used in our program, passing objects to other dependencies. Our project
    is simple enough, but for a more complex project, keeping track of all the dependencies
    could turn out to be a major task. If we want to use Spring classes, we have to
