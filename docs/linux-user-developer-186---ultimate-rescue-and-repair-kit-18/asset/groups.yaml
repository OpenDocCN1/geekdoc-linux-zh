    ## 概览


    ### 不寻常的语言，p62

    许多语言与其他许多语言有许多共同点，但只有少数语言敢于与众不同。我们研究了一些打破常规的语言，并借此提供了一种不同的编程方式。每种语言都能为更具冒险精神的程序员提供与众不同的。


    ### 值得关注的语言，p64

    编程领域处于不断变化的状态，明年我们使用不同语言是极具可能的。正是这些语言开始获得势头，因此我们来看看当今即将上市的语言。


    ### 未来的语言，p66

    为了感受编程的未来可能是什么，我们回顾了过去六十年语言的发展情况，并在这些基础之上，展示了那些处于编程语言前沿研究的人士的观点。


    最近对编程语言的调查表明，它们都太容易预测了。Linux 编码者使用的语言、Python、C++ 和 Java 占据了桌面应用的前五。如果我们把视野扩大到
    Web 应用，发现了 JavaScript 和 PHP，除了 Windows 平台上的 C# 之外，其他操作系统的列表也也相当相似。


    然而，考虑到职业前景，学习一种能够最大化你的就业机会的语言是值得的，这意味着要学习那些在业务中最常用的语言。对于个人使用，选择最受欢迎的语言也有充分的理由。也许最不受欢迎的语言都有自己的长处。


    尽管最受欢迎的语言地位显赫，但另寻他径也有充分的理由。毕竟，如果没有人敢于突破边界，我们现在仍然在使用 COBOL 和 Fortran。此外，并不是每个人都认为一种不那么受欢迎的语言可能会吸引你并提高你的工作效率。所以，如果你准备好考虑向你介绍一些你考虑过的语言的精力，并认为这趟语言之旅是一项严肃的工程——我们发现的一个列表最多只有
    710 种语言，它们属于某些类别，而且即便如此，筛选也非常严格。如果我们成功地勾起了你的兴趣，尽管你没有新发现，我们我们突出的所有语言虽然没有处于语言排行榜的前端，但提供了不同的多样性，可能为更有热情的人提供选择。这些语言通常倾向于那些它们无疑已被所有人过的应用类型，但如果你的需求与其中一种语言提供的匹配，那么可能恰恰如此。


    即使你作为一名程序员没有需求，你可能对编程版图有通一般的兴趣，因此你信任这份概述。我们正在识别不寻常的语言，因为在大多数情况下，这个短语并不是以贬义的含义使用的。


    接下来，我们识别那些正在变得流行的语言，比如占据领先位置的 Python、Java 和 C++ —— 我们把这些语言称为新兴语言，因为没有保证其中任何一种会获得像
    C# 或 Java 那样的成功，而且现实中无法预测是哪一个。


    语言发展的历史并没有预示着平庸的未来。例如，COBOL 在 20 世纪 80 年代和 90 年代很流行，但在 2006 年之前就消失了，被发现它失去了编程语言中
    IBO（业务机器的重要性）地位。一种语言花了六时间才达到其历史最高的流行程度。


    最后，我们调查了对编程语言的研究，这些语言已经经历了 50 多年的发展，非常强大。研究人员正在建立新方法来指示计算机我们需要什么，我们请了几位专家来决定感兴趣的语言，并看看这些倡议何时能产生新的工作方式。


