    更快、更强大的浏览器击中 Ubuntu


    被誉为过去 13 年来针对 Mozilla Firefox 的最大更新，Firefox——“Firefox 量子版”（Firefox Quantum）——已如约而至。但它是否能完成完成足以与流行浏览器的衰落相竞争的跨越？


