    和 Steam 的选项。默认还包括 Gnome 主题和配置编辑器，用于调整 Gnome 桌面。


    # 预安装应用

    Chakra 作为以 KDE 为中心的发行版展现了它的喜悦，这就是为什么它包含了一系列 KDE 应用，包括完整套件和其他 Qt 应用，如 Bomi 媒体播放器和轻量级
    QupZilla 浏览器，而非功能更丰富的 Firefox。


    # 可用性

    项目的 Enchli 安装程序没有该项目的自定义工具。该发行版允许你在 Cinnamon、desktopin、KDE、Openbox 和 XFCE 之间进行选择。所有桌面都有自己的配置，并且通过丰富的桌面壁纸选择以及
    Numix 主题得到了视觉关注。


    # 可用性

    Chakra 使用包管理来维护其仓库。在易用性方面，KDE 倾向于重塑新用户，这使得 Chakra 最适合那些熟悉并习惯桌面的用户。


    # 帮助与支持

    该项目有一个非常活跃的论坛，设有支持板块。用于安装、解决新手疑问，以及开发环境、包及升级问题等。在分类良好的 wiki 中有几篇实用的文章，你也可以寻求项目的
    IRC 频道。


    # 帮助与支持

    该项目重构了其支持基础设施，开发者现在通过网站上的社区板块与用户进行互动。你可以找到旧 wiki 的链接，那里有帮助安装和管理该发行版的有用文章，而其他页面则只有骨架内容。


    # 总体

    Antergos 是一个审美上悦的发行版。它的 Enchli 安装程序做得非常好，帮助用户自定义安装的各个方面，包括应用选择。


    # 总体

    Chakra 是一个基于 Arch、仅限 64 位的发行版，其目标是为用户提供 KDE 体验。对于那些对目标有要求的人来说，这是一个出色的桌面。


    ## Manjaro Linux

    通过其强大的自定义工具，帮助所有用户利用 Arch 的力量。


    ## RevengeOS

    一个轻量级发行版，带有帮助你选择和自定义的工具


    - 通过 MSM，你可以为连接的硬件安装专有驱动，并单击即可在它们之间切换。

    - 通过发行版的软件安装工具，你可以单击安装流行的和多媒体应用。


    # 安装

    Manjaro 提供三种官方版本，虽然该项目没有推荐其中某一个，但我们使用了下载页面上列在第一的 Xfce 版本。所有版本都使用 Calamares 安装程序，允许你加密计划安装桌面的分区。


    # 安装

    RevengeOS 使用其自原生的 Nemesis 安装程序。它提供三种安装类型：Normal、OEM 和 StationX。安装程序的导航相当直观，允许你在两种桌面环境之间进行选择。分区步骤提供了自动安装选项，但也留了了
    Gparted 用于手动分区。


    # 预安装应用

    Manjaro 包含了所有主流流行应用，如 LibreOffice 套件、GIMP、VLC、Firefox、Thunderbird、Steam 客户端等。桌面充满了来自
    Xfce 的有用应用。如果你需要从仓库获取更多应用，Xfce 版本使用 Pacman 进行包管理和更新处理。


    # 预安装应用

    在安装期间，你会看到一个欢迎界面，允许安装 LibreOffice、Wine、Steam 客户端等有用软件。除了这些，桌面还包含了预装的 virtualbox
    虚拟机以及另一个安装 Nvidia 驱动的程序。还有一个自定义控件，用于访问管理系统各个方面的各种工具，从切换壁纸到安装桌面解码器和切换器。


    # 可用性

    Manjaro 非常好用，因为它避免了常见的审美问题。Xfce 桌面遵循传统的桌面隐喻，将吸引大量的潜在用户。另一个加分项是项目的自定义工具——特别是 Manjaro
    设置——允许用户利用 Arch 的优势。


    # 支持

    欢迎界面链接到加入 Google+ 社区论坛，另一个是链接到该发行版相当活跃的论坛板块。在这里，你会找到同伴们讨论关于安装的问题以及你可能遇到的任何问题。网站还有一个
    wiki，里面有一些你可能觉得很有用的文章。


    # 帮助与支持

    Manjaro 在 Vimeo 上通过两段关于桌面方面及其发行版的视频与 Wiki 进行交流。他们的 wiki 相当详细且分类良好，项目举办了最完善的论坛和
    IRC 频道。该发行版还捆绑了一个详细的 PDF 用户指南。


    # 帮助与支持


    # 总体

    Manjaro 的开发者付出的努力帮助用户体验 Arch 的力量。凭借其自定义工具和捆绑应用，开箱即用的桌面在功能和形式上都表现出色。


    RevengeOS 充斥着工具和脚本，是一个精制的发行版，在处理新用户和帮助他们掌握 Arch 方面做得非常好。


