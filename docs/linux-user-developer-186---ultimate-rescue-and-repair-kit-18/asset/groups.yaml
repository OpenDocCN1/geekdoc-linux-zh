    ## Ultimate Rescue & Repair Kit


    ### QUICK TIP

    Don''t get frazzled


    If you are going to replace cables in the computer, unplug it first. Don''t just
    turn it off. Make sure you ground yourself before touching anything, don''t make
    things with a zap.


    ## Recover your system

    What to do to recover from the problem, keep your data safe and get your system
    running again.


    Disk failures are a common cause of grief and can fall into a number of cases.
    Terminal drive failure is the worst and you usually say goodbye to your data,
    unless it is valuable to justify the services of a specialist recovery company
    (or someone else of). Next is a corrupted partition table, where the drive is
    visible but none of its partitions are seen. If you start trying to fix the drive
    in these cases, it may be a simple file system error, a bad port, or something
    loose or damaged cable, or a problem with bad sectors. Another common cause is
    file system errors: the partitions are visible but cannot be mounted, or the data
    appears corrupted, or have missing files when the file system is intact but important
    files have been deleted (by someone else), caused by an unclean shutdown. The
    standard tool for fixing this is `fsck`. At its most basic, invoke:


    ```bash

    fsck /dev/sda1

    ```


    Note that you run `fsck` on a partition, not the whole disk. The `fsck` program
    is a wrapper that identifies the file system type and then calls the specific
    fsck program like ext4. However, for those like ext2, ext3, and ext4, the program
    will prompt you for every error or inconsistency which can happen thousands of
    times, so you may want to run with `fsck -y`, which says yes to all, or `fsck
    -p`, which fixes only errors that can be safely repaired without intervention.
    When we get what we want, we work on the drive. If the drive shows up with partitions
    or the partition table corrupted, we can recover the data. See the instructions
    at the bottom of the page.


    ## Corrupted file systems

    If the system mounts but the metadata is wrong, you are probably able to fix the
    file system. If there is some sort of hard drive error, you should boot from a
    live CD/DVD to carry out further work. There are many live CD/DVDs, most of which
    are generally useful. If you have something like a broken menu hanging around,
    they may have all the tools you need, such as Rescueed.


    ### Recover lost partitions with Testdisk

    Command [1-9]:

    - 1 Search for main partition table

    - 2 Search for other partition table

    - 3 Search for EFI partition table

    - 4 Sectors manually

    - 5 Analyze geometry

    - 6 Analyze geometry (expert)

    - 7 Defrag file system

    - 8 Boot record location

    - 9 Quit


    Select partition:

    - 1 /dev/sda1 (Linux, ext4)

    - 2 /dev/sda2 (Linux, ext4)

    - 3 /dev/sda3 (NTFS)


    Action [a-q]:

    - 17 Write a new MBR partition table

    - 18 Write a new superblock partition table

    - 19 Write a new GPT partition table

    - 20 Write a new NTFS partition table

    - 21 Write a new GPT partition table

    - 22 Create a empty partition table


    ## Rebuild GPT partition table

    The GPT standard stores copies of the partition table at the beginning and end
    of the disk. Using `gdisk`, press `R` to enter the partition table, then enter
    `C` to load it from backup. To rebuild the partition table from the backup, press
    `B`, then `W` to save.


    ## DOS partition table

    The old-style DOS partition table is less friendly, with only one copy. So you
    use `gdisk` to dump the backup to a file in case it goes wrong. If you don''t
    have a backup, you need to try testdisk.


    ## Scan for partitions

    You can testdisk scan the entire disk for the tell-tale signs of partitions. Run
    testdisk from a root terminal to see a list of available drives. You can also
    use the mapfile created with dd or ddrescue.


    System Linux-based CD boots to a command prompt by default but can also be booted
    to a graphical-looking disk if you''re more comfortable with that. As is implied
    by the name, this distro contains many of the tools needed to repair Linux and
    Windows. It''s on this month''s cover and would be a good choice if you need a
    safe place. This also includes a script to install on a USB drive for a more portable
    solution.


    Another popular rescue disk is Rescueed. The more options one has, the more likely
    it is to fix things easily by the click of a button. Its Rescueed app contains
    many other buttons to fix common problems, making it a good fix for you.


    Not all faults are caused by hardware or software, many caused by users who forgot
    their passwords. Forgetting a user password is not necessarily fatal if the distro
    allows you to change it, but what if you''ve forgotten your Windows or Ubuntu
    password? It''s actually remarkably easy: after booting into recovery mode, mount
    your partition at /mnt/root, then you can change the password.


    ```bash

    passwd --root /mnt/root

    ```


    Rescueed CD uses the disk you are booting from to change the password of any user,
    including root, using this method.


    ## Linux to the rescue

    While using a Linux CD to fix a broken Linux system seems entirely logical, using
    one to fix Windows problems is not so apparent, but it is. The obvious application
    of this is mounting an unbootable Windows partition in order to recover your data
    and other files. It may not be pretty, but Rescueed can fix certain problems for
    Linux and Windows very easily. Click the button, read and run it as well.


    Given the previous comments about trying to write to a broken system, this may
    not be an advantage in this case, but most distros use ntfs-3g and you can mount
    partitions with no issues. Alternatively, you can use ntfs-3g, a file system that
    allows read-write access.


    ```bash

    ntfs-3g -o ro /dev/sda1 /mnt

    ```


    This uses the read-only option if Windows did not shut down cleanly, which must
    exist. Also included with Rescueed is chkdsk, which runs with the device as repairs
    the file system next time. For lost partitions, SystemRescue and Rescueed can
    do this for you. SystemRescue makes it easy: there is a set of tools in the boot
    menu to perform various operations, including password resets, both of which can
    help when you have locked out of Windows.


    ## Choose format

    You need to know the type of partition to use. Most installations still use NTFS/DOS
    format will allow you to save any partitions you find.


    ## Look for boundaries

    Analyze how the work starts. TestDisk will scan for signs of boundaries. Depending
    on the partition table created and the disk size, this may take a while.


    ## Back up info

    Once partitions are detected, testDisk will offer you the option to back up the
    current information before attempting further recovery. We recommend that you
    do this.


    ## Ultimate Rescue & Repair Kit


    ### QUICK TIP

    Get your duster out

    Keep your computer clean from the outside; if it gets dusty inside, think a couple
    of minutes with an air duster is often better than waiting for problems to strike.


    ### Diagnose failure & clean up yourself

    Diagnose failure and clean up yourself by eliminating problems and files that
    are no longer needed


    ## QUICK GUIDE

    Power protection

    The easiest way to save the life of your hardware is with clean power. A decent
    UPS (uninterruptible power supply) not only allows your computer to shut down
    cleanly in the event of power failure; protects against fluctuations (brownouts)
    that can weaken hardware, especially disks, and voltage surges that damage motherboard
    components and more. One UPS protects more than computer.


    Power supply and components are relatively easy to fix, but unexpected damage
    can be expensive. Fluctuating voltages and high temperatures can damage components.
    A good UPS can save you more than it is worth by saving your power bills and reducing
    the overall risk.


    A failing component, like a power supply, is more likely to fail when hardware
    gets old, and so you should monitor. The good news is that it is easy to test.
    Use Memtest8 to run tests (or for free, memtest86). Memtest8 runs a battery of
    tests on your memory and reports any memory failures. You should let it run for
    one or two days, overnight is ideal. If a failure shows up, you will need to remove
    individual memory sticks and run the test again until one is faulty — unless you
    have only one to start with.


    Getting SMART

    The weak link in the hardware is the hard drive. While some worry about the lifespan
    of SSDs, the truth is that they last for years with no problems. Mechanical drives
    have complex electromechanical components with lots of parts to go wrong. Lucky
    for us, they ARE also easy to test using SMART (Self-Analysis and Reporting Technology)
    built into many drives. You need to enable SMART in the BIOS setup, then you can
    use a programmed smart to monitor the drive while it is working as normal. To
    get a health report on a drive, below SMART monitors your drive''s health in the
    background. SMARTcontrol reports its state graphically.


    | Model | Capacity | Interface | Speed | Cache |

    |---|---|---|---|---||

    | WD100EZ003-051DA | 1TB | SATA III | 6Gb/s | 7200 | 64MB |

    | WD200EZ003-05DA | 2TB | SATA III | 6Gb/s | 7200 | 64MB |

    | WD400EZ003-05DA | 4TB | SATA III | 6Gb/s | 7200 | 256MB |

