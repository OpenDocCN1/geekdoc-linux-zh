    # 开源


    06 新闻与观点 | 10 字母 | 12 采访 | 16 内核低


    ## 硬件


    ### 英尔与 AMD 开发革命性 CPU


    惊喜合资企业结出果实：2018 年发布的新芯片提供高性能独立显卡


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_5_0.png)


    对于一款集成了 AMD 显卡的英特强力 CPU，你会怎么说？这是一个好主意——而且你很快就能买到了。关于英特与 AMD 合作的传闻自 2017 年初就开始流传；这听起来似乎太不可思议了，尤其是考虑到这两个前合作伙伴之间还有诉讼史。


    更令人惊讶的是，现实正在追上计划。显然，意识到自身处理器的弱点，引入一家可以缓解平衡 CPU 和独立 GPU 困难的公司是明智之举。


    这提升了在 AAA 游戏和内容创作应用中的图形体验。这种新的半定制 GPU 将 Radeon 显卡的性能和功能交给了更广泛的爱好者，他们希望获得最好的视觉体验。


    该系列作为第 8 代 Core 推出，通过其第二代 DDR5 带宽内存 (HBM2) 和自定义独立显卡芯片，将英特高性能移动平台推向前。英特的嵌入式互连桥接
    (EMIB) 是其核心，支持游戏的处理需求。基本上，AMD 是一座加速数据流的桥梁，使设备更快速、更强大、更高效。


    但这笔交易不仅是革命性的；产品本身也是。它可能让 OEM 厂商获得开发更薄、更轻的设计的自由。看起来更好的散热和更长的电池续航并非不可能。


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_5_1.png)


    对于这项新技术来说，以上轻量化难道不是 AMD 的吗？如果它是薄而轻的，现在就可以了！


    除了我们家以外的所有家庭。与此同时，笔记本电脑、一体机和台式电脑都准备变得更轻巧、更强大。作为游戏设备，集成游戏和桌面平板游戏都是可能的。这对手持设备媒体生产的影响是巨大的，尽管有些事情尚不明确。目前我们不知道将进展到什么程度。同样，英特和
    AMD 提供了处理器是否可用。


    “我们与英特的合作扩大了 AMD Radeon GPU 的安装基础，并为高性能游戏带来了市场差异化，”AMD Technologies 总裁兼总经理 Scott
    Heckelman 表示，“我们共同为所有客户提供了机会获得一台更薄、更轻且能够提供更好性能的 PC。”


    > 英特引入了唯一能够解决平衡 CPU 和独立 GPU 工程困境的公司


    但这对 GNU/Linux 和开源世界意味着什么？现在说还为时尚早，但设备不仅仅是为了游戏。移动端硬件、多媒体中心和智能家居设备是


    将通过 OEM 市场提供。噢，如果它还没有一个正式的名字，“英特单路多路解决方案”（Intel Single Package Multi-Solution）读起来并不怎么顺口，对吧？


