    这显然行不通。情况恰恰相反：我们应该限制 Facebook 和 Google 收集信息，而不是给更多个人和公司提供监视我们的机会。


    ## 你的社区看重什么？


    这正是我们最初开发 Vivaldi 的原因。在开发 Opera 之前，我们与社区保持着密切的关系，但当时我们正偏离那条窄路并尝试完全不同的事情；这并不是人们对此感到不悦，我们觉得欠他们他们，不能让他们被抛弃。因此，我们开始构建一个更好的浏览器，并且与社区保持非常紧密的关系进行此。


    我们有不同的层次：有志愿者帮助我们并提供反馈；有志愿者帮助我们进行翻译。此外，我们在 https://vivaldi.net 上有一个非常活跃的社区，用户会直言不讳地提出他们认为我们在软件上做得更好或需要改进的地方。我们非常认真地对待他们的反馈。我们有一种理念：“我们正在为用户构建这款浏览器，这不仅仅关乎我们作为朋友的用户，我们想为他们构建一个更好的浏览器。当你尝试它时，不要监视你的用户，因为你想保护好朋友的安全，你也想听取朋友的建议——这是真的。我们为用户做最好的，这也是我们公开讨论隐私问题的原因之一，因为隐私至关重要，如果你无法在技术层面解决所有问题，我们或许可以以其他方式介入。”


    ## 我注意到你们有一个博客平台


    我们提供了一个博客平台和一个无广告的网站，我们正在制作人们喜欢的功能和内容，这旨在为用户提供一个聚会和交流的平台的一部分，让他们交流自己想要和不想要。


    ## 网页邮箱和客户端是分开的吗？


    是的，正如我们所说，我们正在开发邮件客户端。邮件功能支持任何 IMAP 服务，因此它可以与 Gmail 以及其他任何此类服务配合。我们知道这是用户的一项重要功能，它正在完善中。我的意思是，我个人已经使用了很长时间，但它目前还有些雏形。我们想把它完美呈现给你们。还有几个问题需要解决，但目前还没有完全成型。


    ## 你们也有移动设备版本，对吗？


    > Vivaldi 版本 12 增加了标签功能。Vivaldi 在起始页上有书签或“快速拨号”，用于访问收藏网站。


    > 我们想为用户提供最好的，这也是我们公开讨论隐私问题的原因之一。当我们开始做邮件时，遇到了一些技术问题，我们正在处理。它正在取得进展，但尚未准备就绪。我们使用的是一个非常早的版本，还没准备好正式发布。


    ## 你们团队收到的请求最高的功能是什么？


    邮件，是的，但我想说它是我们还没有提供的优先级，而且即将上线。之后，我们收到团队建议它可能在下一个快照（snapshot）中准备就绪，届时将交付用户。还有一些我们整合了很久的内容。其中一部分同步不仅是客户端的功能，也是服务器端的功能，因此构建相关技术是我们一直以来做的。它很快就会准备好，但我们总是说“等准备好了再说”。在发布当时，Vivaldi
    致力于在 12 月 5 日发布适用于 ARM 设备（包括树莓派、CubieBoard 和 ASUS 板板）的实验版本。


    ## 开源 Linux 新闻与观点


    ### 观点


    Jon Masters 报道了 Linux 社区的最新动态，随着 4.15-rc1 的发布，开发正向 4.15 的新功能推进。Linus Torvalds
    宣布了 Linux 内核 4.15-rc1 的发布，此前经历了惯常的两周合并窗口期（即内核树中允许引入破坏性更改的时期）。在邮件中，Linus 指出这是这次合并窗口唯一的“常规”：由于美国假期，Linus
    在后期休了假，并让所有人执行他们的补丁拉取请求，他必须在最后时刻对包含的内容变得非常严格。嗯，他对这个过程相当满意，特别是强调了更改在流转过程中，没有让 Linus
    的 RISC-V 树流向我那里。


    它支持 Intel x86 和 ARM，以及其他可能的架构选择，但它是使用邮件列表（像任何其他源码项目一样）开放开发的，并且硬件设计是免费的。这意味着你可以下载……拥有一个“开源”设计意味着什么？写在
    RISC-V 源码中的设计描述与实际实现完全一致。通过使用 FPGA（可编程门门阵列）等特殊设备，你可以将 RISC-V “合成”到能够启动 RISC-V
    的 FPGA 上。然后就可以让硬件在任何不需要硬件的设备上运行，因为有（相对简单的）RISC-V 设备以类似于树莓派类电脑的方式提供所有组件。许多此类板卡将在未来几周内上市，但在接下来的
    Linux 合并窗口结束时，我们将看到能够运行开源操作系统（如 Linux Foundation Zephyr 项目）的全景。


    **Jon Masters** 是一位 Linux 内核开发者，从事 Linux 相关工作已超过 22 年，从他 13 岁首次参加开始。在 Linux 会议上，Masters
    曾工作过。

