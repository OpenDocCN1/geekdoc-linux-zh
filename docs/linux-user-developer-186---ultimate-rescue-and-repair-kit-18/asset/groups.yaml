    Spring 的核心概念是 bean。bean 是一个由 Spring 框架创建并控制的对象。Spring 并不是通过构造函数为提供这种 bean 的实例，而是搜索构造函数所需的额外
    bean。例如，在我们的程序中，我们将创建一个类型为 `GameLogic` 的 bean，它将创建一个 `StandardGameLogic` 类的实例，以及该类需要使用的所有类。


