    pauseyourday.co.uk


    # 编码员与制作者的必备指南


    # 实用树莓派（Raspberry Pi）


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_70_0.png)


    72 页“使用微型机器人教授机器人行为”


    # 目录


    - 72 页 Pi 项目：微型机器人真的非常小

    - 74 页在你的 Minecraft 世界中绘制矢量形状

    - 76 页添加带有 Google 助理的语音激活 AI

    - 78 页使用 SQLite 创建轻量级数据库


    # 微型机器人


    # 一种务实的机器人教学方法导致了一个制造比硬零钱还小的机器人项目。


    您能向我们概述一下微型机器人项目吗？你们微型机器人的设计理念是什么？微型机器人项目是在讨论帝国学会（Imperial Society）如何为青少年工程师开发课程时成立的，之前一个在小型机器人上介绍机器人学基础的课程非常成功，那个机器人大约一张
    A4 纸大，但这个尺寸很快就成了我们的问题。我们不得不放弃昂贵的低级硬件；通常情况下我们一个班级只有一个，而我们必须这样服务。


    你还提到了树莓派 3；它是如何融入项目的？最初我们将其视为一个教育套件的商业案例，而这些套件非常贵。使用树莓派帮助我们在不给用户提供额外设备的情况下提供计算系统。我们能够让带有高精度传感器和主电脑的微型机器人系统的负担负担。在整个开发过程中，为了方便起见，我们主要使用全桌面级系统。


    > 我们将机器人用于有趣的编程练习


    在微型机器人项目以及你正在进行的培训中，是否产生了任何交叉项目？


    在班级中，我们有许多系统可以进行测试，但没有空间作为竞技场。此外，高度集成电子设备的成本可能会给讲师带来负担。自然地，这使得该项目变成了我和我的合伙伴 Thomas
    Bonech 博士的一项为期多年的开发工作。


    机器人完全没有用于教学，尽管我们未来希望这样做。我正将它们用在对 13 岁孩子的私教课程中。这些机器人是为了趣味，我们还使用一组更大的机器人来教授焊接技术。主要的引导项目是实现机器人足球，我总是尝试让孩子们自己做。我们将看看最终能取得什么成就。


    当你提到摄像头和 OpenCV 时——你能如何解释这一点？


    对于大多数实验来说，知道它的位置是一个基本问题。如果我们的传感器还不够先进以发现位置，一种潜在解决方案是使用俯视摄像头来追踪机器人的位置。在这里，我们使用摄像头的位置作为输入。


    能告诉我们你正在做的机器人吗？我们有一些备件用于机器人，所以决定创建一个 RC 接口。我们目前正在机器人前端实现一个 TOF（飞行时间）激光扫描仪。由于步进电机的动力，我们可以使用
    SLAM（同步定位与地图构建）进行环境导航，这可以通过最小的机器人完成。


    你认为微型机器人市场化需要什么？


    你也提到了机器人需要视觉。是的，这比较容易说：我们为新的无人机实现了一个加速度计，驱动在磁性墙面上驱动机器人。加速度计可以配合绝对方向和重力工作。至于套件，我们很有可能制作一个套件——我们需要的一切都是开源的；只有电池需要购买。我们可能在今年生产更大批次，明年我们需要寻找可以供应机器人的机会。


    Joshua Elsdon 目前是伦敦帝国学院（Imperial College London）的博士生，研究手持工程增强现实领域。我们对机器人的兴趣源于音频工程和高压电路，然后是一个为了机器人而开发课程的青少年。


    喜欢吗？


    访问 Joshua 的 YouTube 频道查看他的摄像头定位系统和机器人演示，以及同步模式和通用内容：http://bit.ly/Jemicicrobots


    延伸阅读


    要关注 Joshua 的微型机器人，请访问 http://bit.ly/Jemicicrobots


