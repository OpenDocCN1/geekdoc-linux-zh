    # short story


    # Stephen Oram


    NEXT ISSUE ON SALE 11 JANUARY

    YOUR FREE DISC | Microsoft loves Linux? | SBC Round-up


    FOLLOW US


    Facebook:

    facebook.com/LinuxUserUK


    Twitter:

    @linuxusermag


    # NEAR-FUTURE FICTION


    # Disjointed


    He stood naked in front of the full-length mirror, flexing his biceps.

    The mirror flashed an amber warning, reminding him to stand still while he scanned
    his body, so he hoped. It would evaluate his health and adjust the multitude of
    enhancement implants scattered throughout his body, tuning them as he went to
    maximise his fitness and mental performance.

    This daily routine made him feel trapped and cornered, as if the mirror was a
    docking bay he could not leave for almost twenty hours. He wanted to run into
    the sea or drink himself; he wanted to go as far as he could.

    The pressure to break free had built up within him, to such an extent that he
    felt double choked before he could make it through another day.

    As the mirror''s top-right corner approached him, he tightened his stomach muscles
    and straightened his back. The mirror snapped down and showed his archives and,
    he suspected, a central database

    He clenched his fists with all the force he could summon. A thousand pieces flew
    across the floor. The holistic guardian of his well-being was dismembered and
    lying around him.

    An enormous sense of relief welled up inside him.

    But was that?

    The fragments of the mirror were continuing their work in isolation and different
    parts of his body were choosing their own settings.

    His hands were warmer, his feet colder.

    His heart was racing; his stomach denied and his calves calmed. And as soon as
    his brain registered a problem, it told him not to worry, immediately overrunning
    all warnings.

    He recognized the pain and amnesia of the dissection reached every part of his
    being.


    ABOUT

    Eating Robots

    taken from the new short story collection by Stephen Oram: near-future fiction
    exploring the collision of dreams and twisted realities, technology and humanity.
    These 30 short-stories will come out after you''ve turned the future.

