- md: "\n# Tutorial Essential Linuxadmin\n\n## Becoming an accidental admin\n\nWhile\
    \ we would argue that, everyone starts with Linux as an operating system for does.\
    \ We think most people's first experience with Linux happens with something you\
    \ click on a button to set up a personal or business website or small address\
    \ or online - and suddenly you are a Linux admin. Even then you dont why.\n\n\
    When starting out with your web servers, things are easy. providers give you a\
    \ web interface such as cPanel or Plesk manage your server. Powerful pieces of\
    \ software give easy ways to login and easy installations of applications such\
    \ as WordPress.\n\nBut the first time you have to do something that is straightforward\
    \ to do the graphical control panel, your're out of your depth with mandatory\
    \ command line tools and into the world of the text-only terminal.\n\nTo make\
    \ things worse, for a lot of people the first time they have to deal with the\
    \ terminal is when something has gone wrong and can nt be fixed by the control\
    \ panel. Or perhaps you just read that there's a major security flaw sweep the\
    \ web and all Linux servers must be updated at once. Suddenly you realise that\
    \ your control panel hasn't actually been updating your operating system with\
    \ security patches and your small personal blog may be part of a massive incident\
    \ used to launch DDoS attacks against others. Not only are you a stranger who're\
    \ probably trying to recover or fix something that was not to you, but which was\
    \ being tough to handle for a couple of pounds and need hassle-free.\n\nYou're\
    \ an accidental admin! Someone who resigned a Linux server, leaving it secure,\
    \ but here are you. You realize all that was included in the pool of a month you\
    \ pay to your ISP - and once found out it's not too late. Linux servers are intimidating.\
    \ This guide is based on particular distribution. And all the commands are here\
    \ as a Linux desktop to be aware of server.\n\nWhat is SSH?, When letters 'cat'\
    \ actually mean anything? How do I apply patches to my server? Don't worry, you\
    \ are alone. And to help you we've put together this guid with essential Linux\
    \ commands that every accidental admin should\n\n## Essential admin commands\n\
    \nAdam Oxford runs South African tech news site\nWWW.techradar.co.za\nHe learned\
    \ many of these lessons the hard way.\n\nTerminal commands that all Linux server\
    \ administrators should know blindfolded.\n\nYou're an accidental admin! Someone\
    \ resolved to late, that you were the responsibilities of Linux server - and because\
    \ nothing has gone wrong lost in a world of terminals and commands.\n\nAlso can't\
    \ remember that clever thing you did last week? The history is command you.\n\n\
    ## Resources\n\nAll Linux distros are different and most have a number of terminal-based\
    \ text editors you can access on the CLI\n\n```\n$ netstat -atnu\n$ ifconfig -a\n\
    $ top\n$ df -h\n$ ls -ltr\n$ uptime\n$ pkill -f\n$ grep\n$ chroot\n$ what it was\
    \ doing\n$ apt get update\n```\n\n## Tutorial sed\n\nTo write a script, we start\
    \ off with the following shebang line:\n\n```\n#!/bin/sed -f\n```\n\nThe commands\
    \ we have learned are quite simple, but further commands that will help perform\
    \ looping, saving of state and operations on multiple lines at a time. If you\
    \ want to learn about these, a good place to start is by reading (or better) the\
    \ script we wrote is an emulation of a filter that reverses its content. If you\
    \ want to learn some of the advanced features of sed, a good place to start is\
    \ by writing why this script works as it does.\n\n...which tells that the script\
    \ should be run by the sed command. If we want to extend the Regular Language,\
    \ we should use #!/bin/sed -ef instead. We can then list the commands in one file.\
    \ For example:\n\n```\n#!/bin/sed -f\n# Replace spaces\ns/ /g\n# Replace 'gobi'\
    \ with 'tuna'\ns/gobi/tuna/g\n```\n\nSave this into a file named loop-replace.sed\
    \ and then run with sed -f loop-replace.sed. You can then run it directly from\
    \ the command line:\n\n```\n$ sed -f loop-replace.sed\nforgo bite\nfortunate\n\
    ```\n\nNote that we used comments in the script above. A sed script, any line\
    \ with a hash # is treated as a comment and ignored by sed.\n\n## Selective printing:\
    \ a Case Study\n\nThe package manager that your author uses to install software\
    \ on their computers prints out errors of the form:\n\n```\nInstalling...\npackage-name:\
    \ /path/to/file already exists in filesystem\npackage-name: /path/to/file2 already\
    \ exists in filesystem\n```\n\nThis happens when you try to install something\
    \ that already exists. In this case, the package manager will not overwrite the\
    \ files, but will pass control back to the user so they can decide what to do\
    \ with the conflict files.\n\nMore than often, it turns out that the files are\
    \ left over after a installation and should be deleted.\n\n> Sed provides pieces\
    \ of functionality besides simple replacement of text\n\n## Editing files with\
    \ sed\n\nIt is easy to use the normal pipeline to run a sed command for file.\
    \ Example:\n\n```\n$ sed s/dammarn/ > clean_email.txt\n```\n\nHowever, this is\
    \ useless to create a new file out of the result. So use sed -i in place to modify\
    \ the file:\n\n```\n$ sed -i orig.txt 's/dammarn/'\n```\n\nThe .orig after -i\
    \ is optional, but if we make a mistake with our sed command, then we end up losing\
    \ our original file. If we add the extension after -i, then it will save a copy\
    \ of the\n\n```bash\n#!/bin/sed -f\ns3 's/abc//g'\ns4 's/def//g'\ns5 's/ghi//g'\n\
    s6 's/jk//g'\ns7 's/mno//g'\ns8 's/pqr//g'\ns9 's/stu//g'\ns10 's/vwx//g'\ns11\
    \ 's/xyz//g'\ns12 's/!/g'\n```\n\nRight sed scripts are used in many major pieces\
    \ of software. This one is part of Bash itself, used for quotation marks 1 line\
    \ less: before #3 4 seconds ago\n\n```\n$ sudo package-name -s package-name 2>&1\n\
    grep 'package-name: [ *] already exists in filesystem/'\n```\n\n```\nInstalling...\n\
    /path/to/file\n/path/to/file2\n```\n\nThis is a start, but it still prints out\
    \ from the package manager that we do not want (example, the text Installing...).\
    \ When we want to print only those lines that match, and then apply the pattern\
    \ sed.\n\nOne approach would be to pipe the output through grep before piping\
    \ it sed:\n\n## COMMON COMMANDS\n\n```\n$ sed -e '/^package-name: (.*) already\
    \ exists in filesystems/\\'\n```\n\n| # | Treat the command as a comment |\n|---|---|\n\
    | q | Immediately quit Sed, printing out the current substitution |\n| d | Delete\
    \ the current line and move to the next line of input |\n| p | Print out the current\
    \ line |\n| n | Skip the current line (print out without applying any substitutions)\
    \ |\n\nBut this requires us to type the pattern twice. Luckily, it turns out we\
    \ can do the whole thing with one sed command:\n\n```\n$ sudo pacman -S package-name\
    \ 2>&1\nsed -e '/^package-name: (.*) already exists in files/\\/p'\n/path/to/file\n\
    /path/to/file2\n```\n\nThe option -n suppresses automatic printing. If we use\
    \ -n, then sed will not print anything unless we tell it to. At the end of the\
    \ command after the substitution has been printed. Since we do not apply substitution\
    \ to lines matching the pattern package-name: [.*] already exists in filesize,\
    \ these lines will not be printed. We can pipe the output through this pipeline\
    \ using xargs to delete all of them.\n\n## Address ranges\n\nBesides s, there\
    \ are other commands that are often used. These are typically predicted by an\
    \ address range, which applies to the command. An address range can be a single\
    \ line, a range of lines or a regular expression. To illustrate this, we will\
    \ use grep which we have met with sed, which prints the numbers from 10 to \n\n\
    Above Sed supports many commands, the most commonly used are grep and most simple\
    \ are the ones in this table\n\n```\n$ sed 10 | sed -n '10'\n```\n\nHere, puts\
    \ out lines from up to the first line that matches the regular expression [3-5].\
    \ Then the first line matches, and all subsequent output is suppressed. Preceding\
    \ the command with a single line number means that the command is applied only\
    \ to that specific line. In this case, only 7th prints out. Last, we can perform\
    \ matching by appending an exclamation mark ! after range:\n\n```\n$ sed 10 |\
    \ sed '2,10!'\n$ sed 10 | sed -n '4,6'\n```\n\nHere, puts out all lines except\
    \ in range 5. Note that we can simulate the behaviour of grep by writing -n /regexp/\
    \ prints out grep.\n\n## Deleting\n\nBesides a and p, we have a number of other\
    \ useful commands that are available in sed. like d, these can be applied by address\
    \ range to specify which lines should be deleted. We can use the command d, for\
    \ example, to delete a line and move to the next line of input without printing\
    \ anything. For instance, in the second example, range 4,6 specifies that we print\
    \ out lines from 4 to 6 of the output.\n\n```\n$ sed 10 | sed -n './.*/p'\n```\n\
    \nThis command will delete all lines from 1 up to and include the first lines\
    \ that contain the regular expression ... To distinguish it from other commands,\
    \ the regular expression should be delimited by slashes /. We can also use regular\
    \ expressions in addresses:\n\n```\n$ wget http://www.github.org/files/old/moby.txt\
    \ sed -i\n```\n\n## 01 Sudo\n\nFirst fundamental thing to know. Linux's approach\
    \ to administration is that there are two types of accounts that can be logged\
    \ in: a regular user or an administrator (aka 'superuser'). Regular users are\
    \ allowed to change files and folders they don't want - or apply patches to the\
    \ operating system files, which are controlled by an admin.\n\nRoot privileges\
    \ can be temporarily granted to a regular user using sudo in any sort of Linux\
    \ server. To edit the configuration files which are made using the text editor,\
    \ nano, you might use sudo nano /etc/fstab (table we\n\n## CloudAfrican\n\nDocumentation\
    \ | https://ubuntu.com\nCommunity | https://ubuntu.com\n\n![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_35_1.png)\n\
    \nAbove If someone copies your key, they'll still need password to unlock it\n"
  mdcn: "\n\n# 教程：Linux 管理员必备技能\n\n## 成为一名意外的管理员\n\n虽然我们认为，每个人都是从使用 Linux 作为操作系统开始的。我们认为，大多数人第一次接触\
    \ Linux 是由于点击了某个按钮来设置个人或业务网站、小型地址或在线服务 - 突然之间，你就变成了一名 Linux 管理员。即便如此，你并不知道为什么。\n\
    \n在开始使用你的 Web 服务器时，事情非常简单。服务商为你提供如 cPanel 或 Plesk 这样的 Web 界面来管理你的服务器。强大的软件提供了简单的登录方式，并轻松安装\
    \ WordPress 等应用程序。\n\n但当你第一次必须执行一些通过图形控制面板无法直接完成的操作时，你就发现自己力不从心了，必须使用强制性的命令行工具，并进入了纯文本终端的世界。\n\
    \n更糟糕的是，对许多人来说，他们第一次处理终端通常是在发生某些错误且无法通过控制面板修复时。或者，你刚刚读到某个重大安全漏洞席卷整个网络，所有的 Linux\
    \ 服务器都必须立即更新。突然你意识到，你的控制面板实际上并没有为你的操作系统更新安全补丁，而你的小型个人博客可能是用于对他人发起 DDoS 攻击的大规模事件的一部分。你不仅是一个可能试图恢复或修复不属于你的东西的陌生人，而且这些东西只需花几英镑就很难处理，而你又不需要麻烦。\n\
    \n你成了一名意外的管理员！一个本打算放弃 Linux 服务器并让其安全的管理员，但现在你在这里了。你意识到这一切都在你付给 ISP（互联网服务提供商）的月费范围之内\
    \ - 一旦发现，还不为晚。Linux 服务器令人敬畏。本指南基于特定的发行版。所有的命令都像 Linux 桌面一样列在这里，以便你了解服务器。\n\n什么是\
    \ SSH？字母 'cat' 到底意味着什么？我该如何为我的服务器应用补丁？别担心，你并不孤单。为了帮助你，我们编写了这份指南，包含了每个意外管理员都应该掌握的必备\
    \ Linux 命令。\n\n## 核心管理员命令\n\nAdam Oxford 经营南非科技新闻网站 WWW.techradar.co.za\n他通过惨痛的方式汲取了许多教训。\n\
    \n所有 Linux 服务器管理员都应该闭着眼睛都能熟悉的终端命令。\n\n你是一名意外的管理员！有人迟才决定承担 Linux 服务器的责任 - 因为没有发生任何差错，你迷失在了终端和命令的世界里。\n\
    \n还想不起你上周做的那个聪明操作吗？`history` 命令可以告诉你。\n\n## 资源\n\n所有的 Linux 发行版都不同，大多数都有多个可以在\
    \ CLI（命令行界面）访问的基于终端的文本编辑器\n\n```\n$ netstat -atnu\n$ ifconfig -a\n$ top\n$ df\
    \ -h\n$ ls -ltr\n$ uptime\n$ pkill -f\n$ grep\n$ chroot\n$ what it was doing\n\
    $ apt get update\n```\n\n## sed 教程\n\n要编写脚本，我们从以下 shebang 行开始：\n\n```bash\n#!//bin/sed\
    \ -f\n```\n\n我们已经学到的命令非常简单，但进一步的命令将帮助执行循环、状态保存以及同时对多行进行操作。如果你想学习这些内容，一个好的起点是阅读（或者最好是编写）我们写的脚本，它是一个反转内容的过滤器模拟器。如果你想学习\
    \ sed 的一些高级功能，最好的起点是写下为什么这个脚本会这样运行。\n\n...这告诉我们脚本应该由 `sed` 命令运行。如果我们想扩展正则表达式，应该使用\
    \ `#!//bin/sed -ef`。这样我们就可以在一个文件中列出命令。例如：\n\n```bash\n#!/bin/sed -f\n# 替换空格\n\
    s/ /g\n# 将 'gobi' 替换为 'tuna'\ns/gobi/tuna/g\n```\n\n将此保存为名为 `loop-replace.sed`\
    \ 的文件，然后运行 `sed -f loop-replace.sed`。然后你可以直接从命令行运行它：\n\n```\n$ sed -f loop-replace.sed\n\
    forgo bite\nfortunate\n```\n\n注意，我们在上面的脚本中使用了注释。sed 脚本中，任何以井号 # 开头的行都会被视为注释并被\
    \ sed 忽略。\n\n## 选择性打印：案例研究\n\n作者用于在计算机上安装软件的包管理器会打印如下格式的错误：\n\n```\nInstalling...\n\
    package-name: /path/to/file already exists in filesystem\npackage-name: /path/to/file2\
    \ already exists in filesystem\n```\n\n这在你尝试安装一个已经存在的东西时发生。在这种情况下，包管理器不会覆盖文件，而是会将控制权交回用户，以便他们决定如何处理冲突文件。\n\
    \n很多情况下，安装后文件会遗留并且应该被删除。\n\n> Sed 除了简单的文本替换外还提供了许多功能\n\n## 使用 sed 编辑文件\n\n使用普通的管道为文件运行\
    \ sed 命令是很容易的。例如：\n\n```\n$ sed s/dammarn/ > clean_email.txt\n```\n\n然而，这对于根据结果创建一个新文件是没用的。因此，使用\
    \ `sed -i` 直接修改文件：\n\n```\n$ sed -i orig.txt 's/dammarn/'\n```\n\n`-i` 后的 `.orig`\
    \ 是可选的，但如果我们对 sed 命令犯了错，就会丢失原始文件。如果在 `-i` 之后添加扩展名，它将保存一份文件的副本。\n\n```bash\n#!/bin/sed\
    \ -f\ns3 's/abc//g'\ns4 's/def//g'\ns5 's/ghi//g'\ns6 's/jkl//g'\ns7 's/mno//g'\n\
