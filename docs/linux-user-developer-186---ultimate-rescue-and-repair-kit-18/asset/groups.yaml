    \ he hoped. It would evaluate his health and adjust the multitude of enhancement\
    \ implants scattered throughout his body, tuning them as he went to maximise his\
    \ fitness and mental performance.\nThis daily routine made him feel trapped and\
    \ cornered, as if the mirror was a docking bay he could not leave for almost twenty\
    \ hours. He wanted to run into the sea or drink himself; he wanted to go as far\
    \ as he could.\nThe pressure to break free had built up within him, to such an\
    \ extent that he felt double choked before he could make it through another day.\n\
    As the mirror's top-right corner approached him, he tightened his stomach muscles\
    \ and straightened his back. The mirror snapped down and showed his archives and,\
    \ he suspected, a central database\nHe clenched his fists with all the force he\
    \ could summon. A thousand pieces flew across the floor. The holistic guardian\
    \ of his well-being was dismembered and lying around him.\\An enormous sense of\
    \ relief welled up inside him.\nBut was that?\nThe fragments of the mirror were\
    \ continuing their work in isolation and different parts of his body were choosing\
    \ their own settings.\nHis hands were warmer, his feet colder.\n heart was racing;\
    \ his stomach denied and his calves calmesd. And as soon as his brain registered\
    \ a problem, it told him not to worry, immediately overrunning all warnings.\n\
    He recognized the pain and amnesia of the dissection reached every part of his\
