    # Feature Ultimate Rescue & Repair Kit


    ## ULTIMATE RESCUE & REPAIR KIT


    We can repair it, we have the technology. Neil Bothwick reveals the best tools
    for diagnosing, fixing, cleaning and maintaining systems


    ## AT A GLANCE


    - • Analyse problems, p20

    Look at the evidence to be sure you know what the problem is before trying various
    fixes.


    - • Clone & back up, p22

    Make a copy of your data, recover it while you can and make sure any attempts
    of repair do not cause further loss.


    - • Recover system, p24

    What can you do to recover from the problem with the two main objectives being:


    - • Hardware & cleaning, p26

    Diagnose faulty or failing hardware and clean up after yourself by getting rid
    of any rubbish and files that are no longer needed.


    - • Maintenance tips, p28

    Keep your system safe while maximising your chances of recovering your computer.


    There can be a certain smoothness around Linux users regarding how their chosen
    OS is stable, secure and reliable; but stuff happens and it can happen to you.
    Failures, disks or memory errors (not you) and even aging PSUs can cause all failures,
    not to mention faulty or malicious software bugs. There are things that you can
    do to reduce the chances of failure, and other steps to mitigate the damage when
    failure occurs, but in the main part we''ll be exploring what to do when disasters
    strike and how to recover from a fatal crash.


