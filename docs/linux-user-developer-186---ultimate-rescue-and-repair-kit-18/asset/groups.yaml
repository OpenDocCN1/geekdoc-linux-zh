    ## "All of the SQLite code is part of your code"


    In lightweight data, SQLite is the standard in most environments. It comes as
    a library that provides access to file-backed database on the local disk. One
    advantage is that it does not need to run a server to manage the database. All
    of the code is in your code. The language is a variant of SQL which means that
    you can start your project with SQLite, and then be able to move to a larger database
    with minimal changes. SQLite is relatively lightweight and is included as part
    of Python. So you should have it installed. The first step is to create a connection
    object that starts the SQLite interface:


    - sqlite3

    - cursor for the database to handle statements


