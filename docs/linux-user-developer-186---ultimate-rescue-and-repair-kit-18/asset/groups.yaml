    ## 重定向与拦截

    来自设备的 HTTP 请求


    通过重定向手机和物联网（IoT）设备的流量，你可以检测恶意行为、发现弱点等。


    Pros 等工具对于 Web 应用程序的渗透测试非常有用。它们能够检测网站上的常见漏洞（SQL 注入、SSL、敏感数据等），同时为你提供了一个强大的框架来绕过
    Web 客户端、执行手动扫描或控制自动化攻击。在渗透测试过程中，可以学习到很多东西。但不仅限于 Web——考虑所有那些嵌入、交互，甚至检测某些隐藏或恶意的行为。你可以像处理其他计算机一样轻松地重定向来自智能手机或物联网设备的流量，并将其交给
    Burp 或 ZAP。通过这样，你能够拦截 HTTP 请求，对其进行操作，并对任何普通网站一样进行常规的分析和攻击。


    ### 重定向（部分流量）


    当涉及到重定向甚至修改来自设备的 HTTP 请求时，你会遇到两种情况：要么你拥有设备的管理员权限，要么你可以通过网关或代理控制网络流量（前提是设备支持代理）。后者将允许你拥有两个选项：


    | 目标 | 代理 | 扫描器 | 攻击者 | 重复器 | 解码器 | 比较 | 交换器 | 项目导出 | 用户选项 | 告警 |

