    \ store. Future is a media publishing company Non-executive chairman Peter Allen\n\
    Chief Executive James Dillon\nTel +44 (0)12225 2424\n\n# Welcome in this issue\n\
    Welcome to the UK and North America's favourite Linux and FOSS magazine. I am\
    \ writing this to say that anyone can 'hack' macOS Sierra by clicking and typing\
    \ 'root' in the username field, but I should say its quite a ridiculous flaw they\
    \ found. In the wake of it, we're looking at how to change features of different\
    \ kind with our Linux Rescue & Repair (p18). We also want to clean and maintain\
    \ systems to provide better future. For our second feature, we consider what technologies\
    \ we'll be using in the future that is reflected in a new two-part series where\
    \ we look at past programming and how now of growth in it. We're also coming to\
    \ see what languages you'd enjoyed in the magazine as we have making it for you!\n\
    \nChris Thornett, Editor\nGet in touch with the team: linuxuser@future.com\nFacebook:\
    \ facebook.com/LinuxUser\nTwitter: @linuxusermag\nFor the best subscription deal:\
    \ myfuturemagazine.co.uk/subscribe\nSave up to 20% on prints! See page 30 for\
    \ details\nwww.linuxuser.co.uk 3\n\n# Contents\n\n## OpenSource\n## Features\n\
    ## Tutorials\n\n- **06 News**: Intel and AMD develop a revolutionary new CPU for\
    \ 2018\n- **10 Letters**: Scribbled musings from readers\n- **12 Interview**:\
    \ Vivaldi CEO, Jon vonetzchner discusses privacy and neutrality\n- **16 Kernel\
    \ Column**: The latest news on the Linux kernel\n- **18 Ultimate Rescue & Repair\
    \ Kit**: While we know that Linux is one of the most stable and reliable operating\
    \ systems around, things can go wrong. However, there's no need to despair if\
    \ they do — Bothwick reveals the best tools for diagnosing and fixing systems\n\
    - **60 Future of Programming Languages**: Looking into his crystal ball, and extensive\
    \ knowledge base, Mike Beard examines the future of programming languages. Starting\
    \ with unusual ones that broke the mould, he moves on to up-and-coming languages\
    \ before getting the views of experts about what the future holds\n- **32 Essential\
    \ Linux**: Explore the Joy of Sed\n- **36 Essential admin commands**: 20 terminal\
    \ commands you need to know\n- **40 Video capture**: Record with SimpleScreenRecorder\n\
    - **42 MQTT**: Intro to the protocol powering IoT\n- **46 Security**: Redirect\
    \ HTTP(S) requests from devices\n- **50 Arduino**: Use sleep mode to monitor temperature\n\
    - **54 Java**: Spring Framework; dependency injection\n\n# LinuxUser & Developer\n\
    Issue 186\nDecember 2017\nfacebook.com/LinuxUser\nTwitter: @linuxusermag\n\n#\
    \ Back page\n\n# Practical Pi\n72 Pi Project: Micro robots! Seeking a better way\
    \ to teach multi-robot behaviour in class has Joshua Elidson to create micro robots\
    \ that are smaller than the change in your pocket\n\n# Reviews\n\n- **81 Group\
    \ test**: Experience the benefits of Arch in the comforts of a desktop distribution.\
    \ Which one of the four solutions will come out?\n- **96 Near-feature fiction**:\
    \ Chained to a super-smart mirror, there is a strong desire to break free\n- **74\
    \ Minecraft & Python**: Learn how to generate robot shapes directly into the Minecraft\
    \ world using just a few lines of Python\n- **82 Hardware**: The new diskAshur\
    \ Pro2 hard drive offers solid security, but is it the premium price?\n- **88\
    \ Distro spotlight**: Linux hardware vendor/6 has put together its own distro,\
    \ based on Ubuntu, called PiOS\n- **76 AI assistant**: Add voice-activated artificial\
    \ intelligence to Raspberry Pi with the aid of Google Assistant and ReSpeaker\n\
    - **90 Fresh FOSS**: CudaText 1.23.0 code editor, Subsurface 4.71 dev tool, LXQT\
    \ 0.12 DE and Conversion 0.9.6 image converter\n- **78 Pianist's Razor**: Discover\
    \ how to use SQLite with Python to create a database to manage all your precious\
    \ information\n\nSUBSCRIBE Save up to 20% when you subscribe! Turn to page 30\
    \ for more information\n\nwww.linuxuser.com | 5\n"
