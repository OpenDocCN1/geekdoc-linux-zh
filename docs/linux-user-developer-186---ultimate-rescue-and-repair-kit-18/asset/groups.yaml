    # iStore diskAshur Pro 2


    An expensive portable hard drive on the face of it, but good security has never
    been cheap


    +   * Price: From £195 (approx. $249)

    * Website: https://istore.uk.com

    * Capacity: 500GB-5TB

    * Data transfer speed: Up to 10Gbps (Read/Write)

