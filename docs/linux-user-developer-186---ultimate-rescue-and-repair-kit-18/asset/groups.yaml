  mdcn: "\n在 Ubuntu 14.04 上，可以通过 `apt-get install mosquito` 部署该产品。\n\n以下步骤假设 Mosquito\
    \ 服务器位于私有网络；本系列未涵盖在公共服务器上对其进行加密。Mosquito 实现了一个发布事件系统，这意味着客户端必须宣布它们对通道的兴趣，从那时起，所有匹配的事件都会发布。从命令行客户端开始，它们不属于发行的一部分，可以使用\
    \ `apt-get install mosquitto` 下载。\n\nMQTT 消息是动态生成的。在你的开发环境中打开一个新终端并输入 `mqtt_sub\
    \ -h localhost -t smallest`。当消息到达时，代理将发布消息：-t 参数指定要观察的通道。该发行还带有一个用于创建 MQTT 事件的辅助工具：\n\
    \n![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_42_0.png)\n\n```bash\ntamham@TAMHAN14\
    \ ~~\ntamham@TAMHAN14:- mosquito_sub -h localhost -t smallest\nhello world\n```\n\
    \n```cpp\nm_client->setHost(\"test.mosquito\");\nm_client->setPort(1883);\nconnect(m_client,\
    \ &stateChanged, &MainWindow::onStateChange);\nconnect(m_client, &disconnected,\
    \ &this, &MainWindow::onDisconnected());\nm_client->connectHost();\n```\n\n在上面的\
    \ C++ 中，`mqtt_sub` 等待传入的消息而不会退出。\n\n- `mqtt_sub -h localhost -t smallest` 输出 \"\
    hello world\"\n\n当你按下包含 `mqtt_sub` 的终端中的回车键时，首个终端将显示类似图 1 所示的 hello world 消息。\n\
    \n## 引入 Qt\n\nC++ 框架的 MQTT 模块在 5.10 版本中尚未包含，因此我们必须使用 GitHub (https://github.com/qt/mqtt)上的版本。使用\
    \ qmake 将外部模块集成到 Qt 构建中，可以为你提供一个开箱即用的项目结构。它基于 5.10 的版本 3，并包含在本教程中。它将帮助你理解项目的相关实现文件，并调整一些新模块的情况。\n\
    \n> C++ 框架的 MQTT 模块在 5.10 版本中不存在——我们必须使用 GitHub 上的版本。\n\n加载并打开 MainWindow 的头文件，确保包含它，并为我们在后续步骤中使用的\
    \ Mqtt 实例创建一个指针：\n\n```cpp\n#include <mqtt/mqttclient.h>\n\nclass MainWindow :\
    \ public QMainWindow\nprivate:\n    Ui::MainWindow *ui;\n    MqttClient *m_client;\n\
    };\n```\n\n在构造函数中，我们为 MainWindow 连接到服务器：\n\n```cpp\nMainWindow::MainWindow(QWidget\
    \ *parent) {\n    ui->setupUi(ui);\n    m_client = new MqttClient(this);\n}\n\
    ```\n\n```cpp\nvoid MainWindow::updateStateChange(const QString &state) {\n  \
    \  QTime::currentDateTime().toString(State Change) + QString::number(int(m_client->state()));\n\
    \    qdebug() << \"connected\";\n}\n```\n\n最后，注册了后续事件以便我们可以收集有关连接过程的信息。它们使用 `qdebug`\
    \ 输出消息 - `updateStateChange` 看起来如下：\n\n截至编写时，Qt 的许可过程为 Qt.. 在非 GPL 授权且预期用途的商业项目中使用时要小心。\n\
    \n![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_42_1.png)\n\n在 C 中可以找到连接信息——请注意，成功连接会导致状态文件中存储的值变为\
    \ 2。完成后，是时候首次使用该程序了。`StateChange` 将告知我们测试服务已接受连接——理论上，我们现在可以使用我们的服务器技术方法。\n\n\
    作者 — AP 产品正常工作。\n\nwww.linuxuker.com 43\n\n## 教程\n\n### MQTT\n\n通过调整传递给 `MQTTClient`\
    \ 对象的参数：MQTT 协议接收到了更新，该更新在 QTMQTT 和官方 Mosquitto 测试器中均已实现。然而，Ubuntu 包管理器后的团队以更新缓慢闻称。因此，需要手动干预。\n\
    \n```cpp\nMainWindow::MainWindow(Widget *parent) {\n    client->setHostName(\"\
    localhost\");\n    client->setPort(1883);\n}\n```\n\n首先进入系统——启动的 Mosquitto 实例将响应你的请求。仔细考虑代码——它是相关的，因为它描述了\
    \ Ubuntu 服务器何时加载代码，以及它想要对代码库执行什么。\n\n遗憾的是，运行第一次修改的结果并不如意。在创建 'State 1' 后，输入了代理丢失消息。服务器正在活动运行我们的连接。\n\
    \n现在，使用 `remove mosquitto-clients` 从工作站中移除现版本的客户端和服务器。最后，向 `get-apt` 添加新的 PPA，执行更新并重启\
    \ mosquitto。\n\n##  故障排除\n\nMosquitto 支持广泛的日志设施。遗憾的是，它们默认未启用。启动它们需要编辑 `/etc/mosquitto.conf`——选择一个顺序，从超级权限和权限开始。所有功能都可以在该段找到——日志目标必须通过设置字符串\
    \ `syslog:` 来：\n\n```bash\nsudo apt-add-repository ppa:mosquitto-dev\nsudo apt-get\
    \ update\nsudo apt-get install mosquitto\n```\n\n```conf\nlog_dest = syslog\n\
    ```\n\n接下来，查找日志文件。它们默认以 `#` 字符开头，这标记它们为已禁用。只需删除该字符即可启用日志功能然后保存文件：\n\n在部署期间，会弹出消息。如果你想使用配置文件或用新包提供的文件替换它，请按退出。如果你想保留现有配置，请选择该选项并按回车进入配置文件。之后，系统将显示你的日期可能比官方仓库的旧；然而，你的版本号将在\
    \ 1.x 范围内，表明底层代码是新版本（见图 3）。\n\n```conf\nlog_type = error\nlog_type = warning\n\
    log_type = notice\nlog_type = information\nconnection_messages = true\n```\n\n\
    重启服务器以强制其在登录时读取新配置。系统日志最好使用 syslog 查看器完成——之后，重新连接你的客户端以查看图 2 所示的错误。此问题是由版本引起的。\n\
    \n## 增加一些问题？\n\n让我们修改程序，使其注册测试。\n"
