    DHCP 服务器自动配置。其他设备可能允许你设置它们的代理设置。请确保你的设备也已配置；按照以下步骤使用 Burp（安装在你的 Android 和 iOS
    设备上）从你的智能手机拦截 HTTP 请求。


    - 1. 在你的 Windows/Linux 客户端上运行 Burp 并进入 Proxy/Options 选项卡。

    - 2. 点击 Proxy Listen 下方的“Add” 按钮，在“Port” 框中输入 `8080` 并选择你的私有 IP。然后选择“Specific
    addresses”（应该类似于 192.168.1.XX）。最后，按“OK”。列表将列出一个新代理。

    - 3. 确保勾选 Proxy 选项卡上的“Intercept”以启用流量拦截，然后进入 HTTP History 选项卡。

    - 4. 在你的 Android 设备上，进入 Settings > Wi-Fi，点击你的 Wi-Fi SSID 并选择“Modify”。

    - 5. 启用“Advanced options”并向下滚动直到找到“Proxy”下拉列表。

    - 6. 点击“Save”。

    - 7. 在 Proxy host 框中输入你的 IP 地址，在“Port”文本框中输入 `8080`，然后点击“Save”。


    打开你喜欢的浏览器（例如 Google Chrome）并浏览任何网站。你将在 Burp 的“HTTP history”选项卡中看到一些活动。“HTTP 代理”可能不会被其他应用使用。


    - 3. 将文件保存到电脑的某处；命名为 `burp.cert`。

    - 4. 现在，通过 `adb` 命令将此文件上传到你的 Android 设备上。

    - 5. 在你的 Android 设备上，进入 Settings > Security > Install (phone) storage。选择 Burp
    作为新证书。从 BURP 安装它，然后点击“OK”。

    - 6. 如果你进入 Settings > Security > Credentials，你将看到新安装的证书。点击它获取一些信息（如指纹和有效期）。


    如果你导航到 TLS 保护的网站，将不会显示警告；否则，HTTP 历史将不会显示明文流量（它是解密的）。


