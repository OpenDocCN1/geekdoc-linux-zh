    John Gowers\n\nis a university tutor in Programming and Computer Science. He likes\
    \ to install Linux on every device he can get hands on and uses terminals and\
    \ shell scripts daily.\n\nLearn the many uses of the stream editor, an extremely\
    \ versatile command for text replacement in the first part of this series, we\
    \ learned about the UNIX philosophy that underlies the commands we have been learning.\
    \ Part of that philosophy was the insistence that all programs communicate with\
    \ one another through a text stream, as is a general principle. If two programs\
    \ function by taking text input and producing text output, they can interact together\
    \ through a pipeline, even if they haven't been designed to work together.\n\n\
    s/s for substitute\n\nThe main point behind this is that the text output from\
    \ one program might not be in the format required by the next, so we use one of\
    \ the tools that can be used to get around this issue: grep filters out lines\
    \ of output that we need.\n\nThe most important sed command is s the beginning\
    \ of the command, the string to remove, which is s, is short for 'substitute'.\
    \ The basic syntax is:\n\n# Resources\n\n```\n$ <<< \"couscous\" sed '/s/pom/g'\n\
    ```\n\nIn this issue, we will use a more powerful program: the 'stream editor',\
    \ or sed, which can act as the glue between programs. Rather than filtering lines,\
    \ sed can actively change a line\n\n- A terminal running the shell (standard on\
    \ any Linux distro)\n- A 'dictionary' text file, containing a list of words in\
