    # 功能：终极救援与修复工具包


    ## 终极救援与修复工具包


    我们可以修复它，我们拥有这项技术。Neil Bothwick 揭了诊断、修复、清洁和维护系统的最佳工具。


    ## 概览


    - • 分析问题，p20

    在尝试各种修复方法之前，请查看证据以确保你确切知道问题所在。


    - • 克隆与备份，p22

    为你的数据创建副本，在还可以时进行恢复，并确保任何修复尝试都不会导致进一步损失。


    - • 恢复系统，p24

    你可以做什么来从问题中恢复，主要目标有两个：


    - • 硬件与清洁，p26

    诊断故障或失效的硬件，并通过丢弃任何垃圾和不再需要的文件来清理自己的环境。


    - • 维护技巧，p28

    在保持系统安全的同时，最大限度地增加恢复电脑的机会。


    Linux 用户对于他们所选操作系统的稳定性、安全性和可靠性通常表现出某种从容；但意外总会发生，而且也可能发生在你身上。故障、磁盘或内存错误（不是你的错），甚至是老化的电源都会导致所有故障，更不用说故障或恶意的软件漏洞了。你可以做一些事情来降低故障概率，并在故障发生时采取其他步骤来减轻损害，但在大部分范围内，我们将探索当灾难发生时该做什么，以及如何从致命崩溃中恢复。


    问问自己，你的系统中最有价值的部分是什么？如果答案指的是任何硬件项目，那么我们几乎是错的。硬件是可以更换的；可能花费几英镑，但它适用于你的数据：购买的媒体、个人照片、文档和电子邮件可能会丢失。


    接下来我们将介绍诊断和修复问题涉及的步骤，以及在崩溃发生前后保护你宝贵数据的方法。其中某些方法以一种复杂的方式，通常需要使用 启动 USB（live USB），我们将使用几个这样的
    U 盘，配合本月的封面光盘（这是保留它的非常充分的理由），但你也可以从 U 盘启动它们，或者如果你愿意的话，甚至通过网络启动它们。


    众所周知，问题的产生原因之一是采用了过于仓忙的解决方案；或者在处理完问题后没有清理现场。当问题出现时，我们需要采取结构化且正确的方法，以确保在尝试某些有时是激进的修复之前，知道哪里出错了。好消息是，许多
    Linux 工具可以用来修复 Windows 问题，我们将简要介绍这些。在火灾发生之前，你可以做很多事情，从定期备份到监控系统的健康状况。


    ## 终极救援与修复工具包


    ### 分析问题


    在开始尝试修复问题之前，你需要精确地确定该问题是什么。


    那么，我们如何在不加恶化问题的情况下识别问题呢？要记住的最重要点是：观察在你遇到问题时发生了什么，不要急于归因为脑海中跳出的第一个原因。电脑能启动吗？还是崩溃了？它是停止并自动重启了吗？你需要进入
    GRUB 菜单吗？选择任何选项对电脑有帮助吗？如果这些任何一个问题的答案是“否”，请寻找你的救援工具包副本并尝试修复 GRUB 问题。在这个过程中你能到达登录提示界面吗？所有的帮助信息是否指向你的系统在何处失败？如果你已经到了加载服务的阶段，你有很大机会在日志中找到线。如果调试启动没有正常运行，情况也一样。


    #### 使用日志

    Linux 日志几乎关于内核，但许多其他程序也会向系统日志报告信息。如果你的发行版使用系统日志，那就是 journal（日志文件）。journal 是添加了索引的系统日志，这使得查找信息变得简单得多。日志被写入纯文本文件中，你可以使用
    `grep` 和其他工具轻松搜索。你仍然可以依靠系统日志，但有更好的选择。


    这取决于写入日志的信息，在两种情况下它是不会写入的。> 系统 journal 基本上是一个带有索引的系统日志，使得查找信息变得简单得多


    系统在启动过程的早期启动（在文件系统挂载和记录器启动之前），无法写入用户模式。某些内部进程启动非常早，将信息缓冲在内存中直到保存到磁盘，所以如果你能到达登录提示界面，就可以读取
    journal。如果你不能，可以尝试进入早期用户模式（runlevel）。在 GRUB 菜单处（启动时可能需要按住某个键）或按 `e` 编辑条目，并在内核行中添加
    `single`。该选项是 `system.unit=base.target`；basic：目标失败，尝试 `rescue.target`。此外删除任何你不想运行的选项——这将帮助你进入用户模式下的登录提示界面，这是最基础的操作模式。现在你可以读取内核日志了，系统日志通常位于
    `/var/log/messages`；使用以下命令读取：


    `less /var/log/messages`


    有些用户使用不同的名称，例如 `/var/log/`，但它是 `/var/log` 中最近的文件之一。使用以下命令读取内核日志：


    `dmesg`


    在里面查找错误信息。不要太担心警告：它们可能由各种情况产生，例如系统寻找某个不存在的东西。大多数警告并不是致命的，也不会导致系统损坏。对于系统，使用：


    `sudo journalctl -b`


    如果你没有以 root 身份登录，则需要 `sudo`。


