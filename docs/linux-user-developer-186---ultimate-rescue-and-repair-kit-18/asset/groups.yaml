    # HARDWARE


    ## Critical bugs in Intel Management Engine


    Security vulnerabilities also identified in SPS and TXE technologies


    Using an Intel PC or laptop? Your computer is at risk. Hidden now in Intel Management
    Engine (ME)—the ''computer within a computer'' which was also confirmed to be
    exploited in 2016—any Intel-enabled Linux, Apple Mac, or Windows device can be
    hijacked, even without an operating system.


    Third-party experts (UK-based) have discovered that along with ME, Server Platform
    Services (SPS) and Trusted Execution Engine (TXE) are susceptible to exploitation
    by anyone posing as a privileged root. They can then install rootkits and overcode.
    When a user is logged in, a hijacked account can gain access to all data from
    the system from RAM. Shared memories and services are particularly at risk, and
    code to exploit ME can be introduced via USB stick.


    As it was first introduced in 2008, the overwhelming majority of processors currently
    in use have the vulnerability. This includes 6th through 8th generation Intel
    Core CPUs, low-end Celeron and Intel Xeon chips.


    Described as a ''backdoor'' by some security commentators, ME is essentially a
    micro computer with its own operating system. Since 2015 (the UNIX-like MinIX)
    runs independently of your OS, regardless of the reach of antivirus tools.


    So why is it included? Intel''s Management Engine is intended to provide access
    to remote access and workstations, for experts to provide support and install
    and enable the OS from after, which are all vital in many organisations.


    Positive Technologies researchers Michal Goryakh state: ''An attacker could bypass
    security detection provided by traditional tools, such as antivirus software.''


    Intel says the vulnerability (INTEL-SA-0086) can be gathered from its download
    center. Patches have been rolled out. However, don''t expect any update from your
    operating system. If your system is affected, you''ll need to contact your hardware''s
    OEM.


    # TOP FIVE


    ## Open source web browsers


    ### 1 Mozilla Firefox


    Released amid a storm of publicity, Firefox 57 (known as Quantum) has rewritten
    history, is faster than Chrome and uses 30 percent less memory. However, Firefox''s
    future looks uncertain, but are they enough to challenge Chrome?


