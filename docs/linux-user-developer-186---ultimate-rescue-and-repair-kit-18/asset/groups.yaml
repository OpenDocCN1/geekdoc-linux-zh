    # Micro robots


    # A pragmatic approach to teaching robots has led to a project build robots smaller
    than pocket change


    Can you give us an overview of the micro robots projects? What''s the idea behind
    your micro robots? Micro robots was formed when discussing how the Imperial Society
    could develop a course for teenage engineers after a very successful course introducing
    the basics of robotics on a small robot, roughly the size of an A4 sheet of paper,
    but this size quickly became a problem for us. We had to come off low-level hardware,
    which was prohibitive; generally we only have one that class serve we must.


    You also mention the Raspberry Pi 3; how does that fit into project? Originally
    we were thinking of this as a business case for educational kits, which are very
    pricey. Using the Raspberry Pi helped us in supplying the computational system
    with no stuff for the user. We were able for the cost of a micro robot system
    with high sensors and master computer to be affordable. Throughout the development,
    we primarily use a full desktop system, for convenience.


    > We use the robots for fun programming exercises


    Have any intersecting projects have come out of the micro robot projects and the
    training you''ve been running at?


    classes, we have many systems available for testing and to have no space for the
    arenas. Additionally, the cost of highly integrated electronics can be over the
    burden on instructors. Naturally, this that the project has risen to a multi-year
    development effort for me and my partner Dr. Thomas Bonech.


    The robots are not used in teaching at all, though in the future we hope to have
    that. I am using in my private tutoring sessions with 13-year-old kids. The robots
    for fun and we use a larger set of robots for teaching soldering techniques. The
    primary guiding project is to implement robotics football, which I always try
    and let the kids do. We will see and what we will eventually achieve.


    When you mentioned camera, OpenCV - how can you explain this?


    For most experiments, knowing the location of it is a fundamental problem of perception.
    If the sensors we have are not sophisticated enough to discover their location
    from the environment, a potential solution is to use an overhead camera to track
    where the robots are placed. This fixed camera setup can be achieved simply by
    mapping the system''s coordinates in relation to the surface, which can be hard-coded.
    Though to the fact that I have had whipping the robots at opportune moments, the
    robot project and system are possible to deploy ad hoc. Here, we use a code like
    in a coordinate reference that provides the computer vision system with a set
    of scale and orientation which does not need to be orthogonal to the surface,
    and we use the location of the camera as input to the system.


    Can you tell us about the robot you''re working on? We have a couple of spares
    in the programming connector for the robot, so we decided to create an RC interface
    for it. We are currently implementing a TOF (time of flight) laser scanner on
    the front of the robot. Due to the power of the stepper motors we use for the
    drives, we can navigate the environment using SLAM (simultaneous localization
    and mapping), which can be done by the smallest robots to complete this task.


    What do you think is needed for a micro robot to be marketable?


    You also mention that VI is needed for robotics. Yes it''s more or less easy to
    say that: it implements an accelerometer for our new drone, running the robots
    with all motor-controlled wheels that drive on a magnetic surface mounted to wall
    all. The accelerometer will work with all robots with absolute orientation and
    gravity. As for kits, it''s quite possible that we would need to make a kit -
    everything we need is known to open source; only the batteries are a to get. We
    are likely to make a larger batch this year for the development of the system,
    and next we will need to take the opportunity where the robots can be supplied.


    Joshua Elsdon is currently a PhD candidate at Imperial College London, studying
    in field of hand-held engineering augmented reality. We developed into a passion
    for robotics, life starting with audio engineering and high-voltage circuits,
    then teenager who developed it for robotics.


    Like it?


    Head to Joshua''s YouTube channel for demos of his camera location system and
    very robots following, also synchronized patterns and general: http://bit.ly/Jemicicrobots


    Further reading


    To keep up with Joshua''s micro robot, visit http://bit.ly/Jemicicrobots


