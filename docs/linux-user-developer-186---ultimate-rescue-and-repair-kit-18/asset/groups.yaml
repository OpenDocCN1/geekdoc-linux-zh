    my_cursor.execute("CREATE TABLE people (name TEXT, phone_number TEXT)")

    ```


    The first thing is to create a table to store your data. By executing the following
    code we can store names and phone numbers: Once you have data to fill each column,
    SQLite supports all types except BLOB, INTEGER and NULL. Map these to Python types.


    ```python

    my_cursor.execute("INSERT INTO people VALUES (?, ?)", (my_name, my_number))

    ```


    While this is for hardcoded data, for probably getting data from users that you
    should check and sanitize it so there is no risk of SQL injection. You can do
    this by then string manipulation before calling execute. The other option is to
    use a statement that contains placeholders with the values stored. This makes
    the validation of the input easier to handle.


    ```python

    my_name = ''Joe Beard''

    my_number = ''555-5555''

    my_cursor.execute("INSERT INTO people VALUES (?, ?)", (my_name, my_number))

    ```


    The values used in the statement are provided within a tuple. If you have a larger
