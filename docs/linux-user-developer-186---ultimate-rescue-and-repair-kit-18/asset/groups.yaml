    # 开源你的 Linux 新闻与观点


    ## 访谈 VIVALDI


    ## Vivaldi：面向强力用户的浏览器


    我们采访了基于 Chromium 的浏览器 Vivaldi 的首席执行官，探讨了关于隐私保护和网络中性的斗争，以及未来计划中的功能。


    > Vivaldi 浏览器诞生于 2015 年，是对 Opera 变化的回应，也是 Opera 首席执行官兼创始人 von Tetzner 认为的市场需要一种能够迎合强力用户的浏览器。Von
    Tetzner 认为许多人过度简化了他们的体验。“他们基本上是在适应一种并不好用的东西，”他在波士顿外的豪宅（Mansion House）接受采访时说道，“没有被大多数人使用的功能都会被遗弃，软件就会过时并最终死亡。我们正朝着相反的方向努力，提供了如标签页分组、内置截图捕捉工具和广告拦截器等功能，并配备了大量的自定义选项。虽然许多人依赖扩展程序，但
    Vivaldi 推出的是内置的差异化功能。


    关于灵活性，有许多不同的处理方式，因此你可以找到自己的处理方法，这正是我们的核心所在。我们通过加入许多功能来适应你的需求，同时也提供了许多实现相同目标的方法，让你能够根据自己的需求进行调整，而不是让你去适应浏览器。


    你是否感受到了 Linux用户的明显兴趣？


    如果你看看我们拥有的 Linux 用户数量，他们与 Mac 用户数量相当，这告诉我们 Linux 用户显然正比其他平台更大的规模涌向我们，而这是一个小众市场。


    ## 约翰·史蒂芬森·冯·特策纳


    ## 你们达到 100 万用户了吗？


    差不多吧，我们说正在接近 100 万。这是我们目前的状态。我们非常接近这个目标，而且增长率正在提高，我们很快达到第一个百万用户，我们统计的是活跃用户而不是下载量。我们统计的是有意义的数字，即对我们最重要的指标——月活跃用户数。


    自 1996 年以来，他在互联网浏览器领域基本上一直拥有某种特质，现在是 Vivaldi 的首席执行官。


    ## Chrome 在 Linux 平台上占据主导地位


    即使是 Mozilla 也通过加入大量功能而被用户垄断了，且收集的数据量非常惊人。你把 Vivaldi 视为竞争对手吗？


    Vivaldi 正在通过提供多种处理方式，朝着与网络浏览器相反的方向突围。


    ## 你能谈谈你对隐私的执着吗？


    我们在我们这边会尽所努力，在花费了大量时间思考和定位之后，这也是一个需要以不同方式解决的问题。我决定开始讨论它。我一直收到问题：“你们正在做什么来确保我们的安全？”我们开始做一些本应该加入的或思考类似的事情。有很多我们可以做的事，我们正在研究。


    问题在于，当你开始为了某种目的使用某些东西时，你实际上在寻找可以隐藏的东西。这种不幸的是，当政府看待它时，他们认为我们想把它放在某些地方，被看作是在做坏事。我的感觉是这正是改变改变，而且数量上存在问题！


    我们的感觉是，我们在互联网上花费了大量时间，你实际上需要能够适应你的需求和需要的浏览器。应该有许多处理问题的方法。在某些方面，就像你在 Vivaldi 中的处理方式那样，你有很多选择。


    ## 有什么新功能或即将推出的？


    Vivaldi 令人印象深刻的是它每个季度发布的功能。窗口面板（Window Panel）是 Vivaldi 迎合开启大量标签页用户的经典案例。你还可以通过在它们之间抓取并拖动标签页来更改设置。“它是灵活的，”Tetzner
    说，“我们知道人们对于如何处理标签页有不同的意见。”


    Vivaldi 团队一直在改进下载面板。“我们有下载面板，包含了更多信息。Vivaldi 具备暂停和恢复下载的能力；它还在进度条中添加了速度显示，我们正在改进浏览器，这对用户来说是重要的。”虽然
    Vivaldi 没有支持 Torrent（比特种子），但它是我们正在开发的列表元素之一。


    > Vivaldi 正在不断添加新功能。有一个用于管理的新窗口面板，可以跨云同步。


    在短期内，Vivaldi 将发布大部分新功能：11 月进行同步更新，并在 12 月发布一个针对树莓派（Raspberry Pi）的实验性版本。收集的信息量实在太大了。从一个角度来看，von
    Tetzner 表示，重点是改进网络浏览器和邮件客户端，他没有看到任何需要改变的地方。


    你过去谈过监管。你认为广告需要什么形式的监管？


    是高度的，而且在某些方面它并不大。这实际上是回到我们年前的状态，我不是唯一一个长期接触互联网的人，我认为事情正朝着正确的方向发展。并不是说人们不应该收集比他们需要的信息。作为一个例子，任何时候收集你的信息都是限制的。当你想要将其用于地图时需要更多信息，或者可能想用于交通，或者收集方式可能取决于你如何使用它？


    我认为在线收集的概念真的非常多，对吧？能够翻译 Google 的东西，对吗？在线收集的确实很多，但坦率地说，由于我们能看到广告，这已经足够了。


    Tetzner 提到，广告应该是公开的。这涉及到广告问题，，我们是基于地理位置被允许的，但这是不够的。


    你声明过广告应该是免费获取的。你们希望如何处理？如果你看到广告，它是通过 Facebook 提供的，我不认为这足够处理这些广告，由于我们想看到某些广告，这可能只是。


    > 不幸的是，当我们想要做某些事情时，我们被看作是在做坏事。这里有两件事：你有多少


    ## 许可协议的问题


    你可以在不解决“房间里的大象”的情况下使用它，而这就是使用开源许可协议的问题。这是一个复杂的情况，对 Chromium 引擎进行的所有更改都是根据 BSD
    许可发布的。这种类型的许可不要求分发源代码，尽管 Vivaldi 确实这样做，但我们保持 UI 是开源的。


    “我们在 C++ 中做的每一个更改都是开源的，”Tetzner 说，“当我们最初启动项目时，我们讨论过——我们应该带许可发布吗？但我们还没有准备好。而现在，至少检查代码并更仔细地观察别人在做什么要好。”


    Tetzner 表示公司确实考虑过使用 GPL，但由于风险，这是一个决定。“选择错误的许可并发布，我们会担心，而且在很多方面，人们仍然可以做他们想做的，”Jon
    说。此外，这并没有阻止社区提交补丁供审查。有些补丁已经包含在浏览器中，但 Tetzner 承认它们没有被采纳。


