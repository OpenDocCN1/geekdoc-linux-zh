    # Pop!_OS 17.10


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_87_0.png)


    ## 发行版


    ## Pop!_OS 17.10


    由于 Ubuntu 的剧烈变化，System76 决定采取主动行动。


    System76 是少数销售预装有 100% 兼容 Linux 硬件的 Ubuntu 电脑的零售商之一。System76 —— 在 Unity 项目终结后，将其
    91% 的业务整合到一个发行版中，旨在为客户提供与硬件相匹配的良好体验。随后，该公司发布了最新的 Ubuntu，并以 GNOME Shell 作为其定制发行版
    Pop!_OS 的基础。


    目前 Pop! OS 仅适用于 64 位架构，并针对 Intel/AMD 和 Nvidia 硬件发布了独立版本。


    | 配置 | 需求 |

    | :--- | :--- |

    | 内存 | 2GB |

    | 存储 | 20GB |

    | CPU | 64 位 AMD 或 Nvidia 处理器 |

    | 图形 | AMD 或 Nvidia |


    获取地址：https://system76.com/pop


    System76 并没有专注于维护主流发行版桌面，而是专注于设计一种为创作者、开发者和创客者打造的发行版桌面：“如果你从事软件工程、科学计算、机器人或 AI
    领域，我们正在为为你构建 Pop!_OS，”Carl Richelle 在发布该版本的博客中写道。“我们将构建工具来简化你的开发环境管理。我们将确保 CUDA
    易于使用并正常运行。”


    System76 通过其 “Imagine” 营销活动（https://system76.com/imagine）提升了我们的预期，承诺提供“最高效且最美观的开发平台，即使它补充了一句‘我们才刚刚开始’。”在首次发布后接受
    Richello 采访时，他解释了公司的雄心以及“该发行版的指导原则、美学、构建基础设施、测试和质量程序、社区建立、文档、生产环境开发以及所有桌面体验等等。”由于缺乏这些背景，考虑到其网站上的目标，第一个版本看起来有些平淡且极简主义。“在四个月的时间里，我们奠定了操作系统的基础设施和方向。接下来的六个月是执行我们的愿。”。”Carl
    认为在评估该发行版时记住这一点很重要，但我们无法评审不存在的东西。


    在软件方面，该发行版相当于标准豪华版，包含了 LibreOffice、Firefox 和 Gnome 的默认应用程序。与 Ubuntu 相比，Pop_OS
    使用 Gear 代替 Thunderbird 和 Shotwave。Carl 表示，在公司的元素群体中，客户并不使用这些缺失的程序。Pop_OS 基于 Ubuntu，但带有自己的安装程序。除了外观之外，唯一真正的区别是它不是他们最初的原创。System
    表示它拥有一个顶级的启动向导。Pop!_OS 的 gnome 桌面经过了辅助和调整，以提供最符合用户需求的用户体验。启用了 Gnome 元素来帮助导航“活动概览”（Activities
    Overview），另一个是在电源菜单中添加了“挂起”按钮。为了保护您的隐私，Pop 不在锁定屏幕上显示通知。System76 UI 团队花费了大量时间确保视觉细节正确。


    扁平 GTK 主题基于 Material GTK+，配有匹配的颜色和图标对。作为良好的开源支持者，System76 还在改进上游代码。Carl 告诉我们，他们正在改进
    Gnome 的窗口聚焦和控制。一个让我们感到困难的 Gnome 主题是重新映射的键盘快捷键。Carl 与软件开发者的反馈密切合作，但需要对设置编辑器进行微调，以将其恢复到熟悉的
    GNOME 值。另一个亮点是基于 elementary 的 AppCenter 的商店。Carl 告诉我们它使用了相同的搜索逻辑并处理列出的项目。如果你无法从
    Pop!OS 显示的发行版中安装 Thunderbird 或 Ethereum 等应用，请告诉他们使用 APT。他们正在创建“应用程序切换器”，将帮助用户获取与特定任务相关的程序。


    ### 优点

    - 一个美感愉悦的 GNOME 环境，默认启用了实用的元素，并有一个直观的应用商店。


    ### 缺点

    - 一个极简的发行版，其默认应用程序选择可能无法满足其需求。


    ### 总结

    - 一个外观良好的发行版，不仅仅与官方网站相符。但背后做了大量工作，为未来的元素奠定了基础，并将帮助将该发行版推向完美的开发平台。


    Maya Sharma


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_88_0.png)


    ## 评测：新鲜且开源的软件


    ## 代码编辑器


    ### CudaText 1.23.0


    一个用于编写代码的功能丰富的编辑器


    Linux 不缺少可以作为轻量级 IDE 使用的高级文本编辑器，我们对继我们之后最好的几款进行了一组小组测试（见 LU 082, Pg 1）。CudaText
    是一个专门为编写代码设计的跨平台编辑器，也可以作为一个高级文本编辑器。


    该编辑器具有所有常用的便利功能，例如对 C、C++、Java、HTML、CSS 和 Python 在内的多种编程语言进行语法高亮。你还获得了 HTML 和
    CSS 等语言的代码折叠功能、使用正则表达式进行搜索和替换的能力，以及多重编辑和多选功能。通过安装用 Python 编写的额外插件可以扩展功能。


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_89_0.png)


    该应用拥有界面的颜色主题。它有一套匹配的编码方案。


    该项目为 Debian 系发行版提供了未编译的二进制文件。Carl 告诉我们，它正在改进 Gnome 的窗口聚焦并正确控制。一个让我们感到困难的 Gnome
    主题是重新映射的键盘快捷键。Carl 与软件开发者的反馈密切合作，但需要对设置编辑器进行微调，以将其恢复到熟悉的 GNOME 值。另一个亮点是基于 elementary
    的 AppCenter 的商店。Carl 告诉我们它使用了相同的搜索逻辑并处理列出的项目。如果你无法从 Pop!OS 显示的发行版中安装 Thunderbird
    或 Ethereum 等应用，请告诉他们使用 APT。他们正在创建“应用程序切换器”，将帮助用户获取与特定任务相关的程序。


    ### 优点

    - 包含了所有的常用便利功能，可以通过插件扩展。


    ### 缺点

    - 你需要编辑配置文件来连接 Python 解释器。


    ### 非常适合...

    - 使用 IDE 编辑代码。http://viewsoft.com/cudatext/


    ## 潜水工具


    ### Subsurface 4.7


    轻松分析每个 USB 潜水![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_89_1.png)


    Linus Torvalds 喜欢跟踪他所做的。他使用 Git 跟踪内核开发并使用 Subsurface 进行潜水。当 Linux 内核出现错误时，他喜欢焊接并潜水。他想为潜水找到一个好的日志。


    该项目为 Debian 系发行版提供了未编译的二进制文件。因此你需要按照在线文档中包含的所有方面的说明进行手动编译，并仔细阅读以获取该程序的所有功能。（注：原文中存在大量由于
    OCR 错误导致的重复文本，已根据上下文进行清理和翻译）。


    '
