    \n开源\n\n特性\n教程\n\n- 06 新闻：Intel 和 AMD 开发了革命性的新 CPU\n- 10 读者：读者的随笔\n- 12 访谈：Vivaldi\
    \ 首席讨论隐私与中立性\n- 16 内核专栏：内核最新动态\n- 18 终极抢救工具包：虽然我们知道 Linux 是最稳定可靠的操作系统之一，但问题仍会发生。不必绝望，Bothwick\
    \ 展示了诊断和修复系统的最佳工具\n- 60 编程的未来：Mike Beard 通过水晶球和丰富的知识库考察编程语言的未来。从打破常规的语言开始，最后获取了专家对未来的看法\n\
    - 32 核心 Linux：探索 Sed 之乐趣\n- 36 基本管理命令：你需要的 20 个终端命令\n- 40 视频录制：使用 SimpleScreenRecorder\n\
    - 42 MQTT：驱动 IoT 的协议简介\n- 46 安全：从设备重定向 HTTP(S) 请求\n- 50 Arduino：使用睡眠模式监控温度\n-\
    \ 54 Java：Spring 框架；依赖注入\n\n# LinuxUser & Developer\n第 186 期\n2017年12月\nFacebook：facebook.com/LinuxUser\n\
    Twitter: @linuxomag\n\n# 封底\n\n# 实用 Pi 技巧\n72 Pi 项目：微型机器人！Joshua Elidson 为了在课堂上教授多机器人行为，创造了比口袋硬币还小的微型机器人\n\
    \n# 评测\n\n- 81 组测：在桌面发行版体验 Arch 的优势。四种方案中哪一个？\n- 96 近未来小说：被智能镜锁定，有一种强烈的逃离欲望\n\
    - 74 Minecraft & Python：学习如何使用几行 Python 代码直接在 Minecraft 世界中生成机器人形状\n- 82 硬件：新的\
    \ diskAshur Pro2 硬盘提供了可靠的安全保障，但物有所值吗？\n- 88 发行版聚焦：Linux 硬件厂商/6 推出了一套基于 Ubuntu\
    \ 的自己的发行版，名为 PiOS\n- 76 AI 助手：借助 Google Assistant 和 ReSpeaker 为 Raspberry Pi 添加语音激活的人工智能\n\
    - 90 新鲜 FOSS：CudaText 1.23.0 代码编辑器、Subsurface 4.71 开发工具、LXQT 0.12 环境以及 Conversion\
    \ 0.9.6 图像转换器\n- 78 钢琴家的剃刀：发现如何使用 Python 和 SQLite 创建数据库来管理你所有的珍贵信息\n\n订阅印刷版可节省\
    \ 20%！更多信息请见第 30 页\n\nwww.linuxuser.com | 5\n\n"
