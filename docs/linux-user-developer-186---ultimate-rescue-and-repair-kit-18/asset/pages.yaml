  md: '# Review


    # Arch-based distributions


    # Antergos


    Makes good of Arch''s large repos to offer seven desktops


    # Chakra Linux


    A perfect rendition of KDE with an app selection to match


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_81_0.png)


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_81_1.png)


    +   - You can enable the Arch User Repository (AUR), in addition to Antergos''
    repo, from the very useful Enchli installer


    +   - Chakra has several custom repositories, including a community-maintained
    repository that is inspired by the Arch Repository


    # Installation


    The home-brew, multilingual Enchli installer does a good job of anchoring the
    distro. It allows you to choose from supported desktops and can also install Arch-like,
    CLI-only base. The partitioning is intuitive enough for new users and also helps
    with pre-installed apps like ZFS, home on a separate partition.


    # Installation


    Chakra uses the distribution-independent Calamares installer. It is why it can
    be navigated with ease. Like Arch, you can call to automatically partition the
    disk or let you modify partitions. However, Chakra doesn''t offer as many options
    as Antergos.


    # Pre-installed apps


    Antergos has a useful variety of productivity apps. By default, it uses the Chrome
    web browser but you can also install Firefox during setup, where you also get
    options to pull in LibreOffice and Steam. Default also includes Gnome themes and
    config editor to tweak the Gnome desktop.


    # Pre-installed apps


    Chakra expresses itself bliss as a KDE-centric distribution, which is why it includes
    a whole gamut of KDE apps including the complete suite and other Qt apps like
    the Bomi media player and the lightweight QupZilla browser in place of more feature-rich
    like Firefox.


    # Usability


    The project''s Enchli installer, has no custom tools for the project. The distro
    allows you to choose between Cinnamon, desktopin, KDE, Openbox and XFCE. All desktops
    with their own configurations and they all have been looked to via a wide selection
    of desktop wallpapers, along with the Numix first.


    # Usability


    Chakra uses package management for management and its repository. In terms of
    usability, KDE has a tendency to overhaul the new user, which makes Chakra best
    suited for those who are familiar and comfortable with the desktop.


    # Help & support


    The project has a very active forum with support sections. For installation, resolving
    newbie queries, along with development environments, package & upgrade issues,
    etc. There are several useful articles in the well categorised wiki and you can
    also seek the project''s IRC channel.


    # Help & support


    The project has overhauled its support infrastructure and the developers now engage
    with users via the community section on the website. You can find the link to
    the old wiki which has useful articles to help install and manage the distribution,
    while others have skeleton content.


    # Overall


    Antergos is an aesthetically pleasing distribution. Its Enchli installer does
    a wonderful job and helps users customise various aspects of the installation
    including app selection.


    # Overall


    An Arch-based, 64-bit-only release distro, Chakra''s objective is to give its
    users the KDE experience. It''s an excellent desktop for those who demand along
    with their goals.'
