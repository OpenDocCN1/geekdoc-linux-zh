  md: '# Slax abandons Linux for Debian


    New release is now available for download, but not yet renamed “Dex”


    Slax 9 is now available for download, but in a surprise move Thomas Matejcek has
    announced that the new version of the lightweight distro has abandoned its roots.


    So it''s not just on Slackware, when it''s running underneath the leafy desktop
    background? Well, it''s Debian. Understanding its reasons with clarity; Matejcek
    has basically stated that it''s too complicated for Slax if it continues to be
    based on Slack.


    > “The reason is simple: laziness. I am too lazy, really lazy. When I prepared
    Slax from Slackware, I had to patch kernel with uafs, configure, recompile, and
    so on. Then compile other software from sources, fix dependencies, and so on.
    And I enjoyed doing that, but not in the mood anymore.”


    To be fair, Linux distros are as simple as “it''s all Linux”, the new version
    of Slax


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_7_0.png)


    is 208MB (218MB) for the 32-bit smallest USB stick. There''s probably just one
    way to make it dead (functionally): the arrival of something.


    everything is moving to the web, so why spend time packing tools into the OS?


    Meanwhile, the desktop arrives with just four icons: the Terminal, Text Editor,
    Calculator, and Chromium Browser. Matejcek''s rationale is he believes


    Slackware has removed systems, like the package manager often cited as a tipping
    point for Slackware adherents. It seems likely the move to Debian (and implicit
    absence of system) will please some, but Matejcek seems confident that it doesn''t
    matter.


