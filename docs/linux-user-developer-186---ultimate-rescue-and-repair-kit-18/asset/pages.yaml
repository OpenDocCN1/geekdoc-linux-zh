    # LXQt 0.12.0


    Bring old worthless to life with this lightweight desktop environment


    The Lightweight Desktop Environment—will draw a graphical user without consuming
    many resources. The desktop environment is a mix of GTK-based lightweight desktop,
    and Razor-Qt, which was an equally lightweight—but less demanding version used
    in the latest desktop environments as GNOME and KDE have put out of the reach
    of low-spec machines, which means your desktop has a less flavour in their arsenal
    of features. LXQt is also popular with users of more powerful machines, which
    frees the resources for more CPU-intensive tasks such as video processing.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_90_0.png)


    The latest version of desktop includes better support for HiDPI. The new releases
    ships with Open/Save File dialog, and includes support for themes that use the
    Follow-KDE extensions or XDG icon themes. The benefits also have introduced improved
    import process by drawing to job. All LXQt environments have seen some important
    architectural changes. The LXqt-common package has been dropped, and its total
    size and number of pages have shrunk, as the newly introduced LXQt-themes package.


    # Pros


