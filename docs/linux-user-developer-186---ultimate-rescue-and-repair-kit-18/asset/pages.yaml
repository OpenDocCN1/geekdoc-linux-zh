    Google Assistant is a virtual personal assistant, designed to make your life easier
    by scheduling meetings, running searches and event data. In April, Google released
    a new SDK kit allowing developers to build their own Assistant-related hardware.


    In this tutorial we will show how to integrate Google Assistant with your Raspberry
    Pi and a device which can respond to your voice commands. For this project we
    will use the ReSpeaker-2 Mic HAT, which has onboard microphones and speaker applications.
    The ReSpeaker HAT costs $12 and is compatible with the Pi Zero as Pi 2B and 3B.
    If you have a microphone, you can use that instead.


    By default, Google Assistant only responds to commands prompted with a phrase
    "OK Google". The only consensus is that you can also program the ReSpeaker HAT
    to listen only when the on-board button is pressed.


    This tutorial assumes that you have an install of the most recent version of Raspberry
    Pi (Stretch) on your Pi. Once the install is complete, make sure to open terminal
    and run `sudo apt-update && sudo apt-get upgrade` to get your system up to date.


    # 02 Install device drivers


    Return to the terminal on your Pi and run `git clone --depth=1 https://github.com/respeaker/seed-weedcard`.
    Switch to this device with the command `seed-weedcard`. Once installation is complete,
    reboot the Pi by running `sudo reboot`. Return a terminal and run `aplay -l` to
    list all playback devices. You should see ReSpeaker listed under card 1 as ''hwmic''.
    Next run the command `aream -l` to list all capture devices. Check that `seed-weedmic`
    is listed here.


    # 03 Configure sound device


    Right-click the volume icon at the top of your sound bar to make sure the voicecard
    is selected. Right-click again and select ''Use Device Settings''. In the new
    window opens, click the drop-down menu ''Source Card'' and choose the seed weedcard.
    Select your preferred device and click ''Make Default'' to ensure the Pi will
    use this device next time it restarts. Don''t worry about the lack of volume controls;
    simply click ''OK'' to save and exit.


    # 04 Adjust sound levels


    Return to the terminal and run the command `alsamixer`. This handy allows you
    to adjust the volume for playback and recording of all hardware devices. Press
    F6 and use the arrow keys to select your sound device, which should be listed
    under card 1. Press arrow keys to navigate. Use the left/right arrow keys to select
    different controls and up/down to adjust intensity. Press Esc to quit, then run
    `alsam store` to save the settings.


    # 01 Connect the ReSpeaker


    Mount the ReSpeaker-2 Mic HAT on Raspberry Pi, ensuring the GPIO pins are properly
    aligned. If connected, the red LED will be illuminated. Connect your headphones
    or speakers to the 3.5mm audio jack on the device. If you aren''t using speakers,
    connect another micro-USB cable to the port on the ReSpeaker to supply enough
    current. The microphones themselves are located at either end of the HAT, labelled
    ''Left'' and ''Right'':


