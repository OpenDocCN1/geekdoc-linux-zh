    # "All of the SQLite code is part of your code"


    In lightweight data, SQLite is the de standard in most environments. It comes
    as a C library that provides access to a file-backed database on the local disk.
    One advantage is that it does not need to run a server to manage the database.
    All of the code is in your code. The query language is a variant of SQL which
    means that you can start your project with SQLite, and then be able to move to
    a larger database with minimal changes to your code.


    There is a sqlite3 module available in the language that supports all of the functionality.
    It is because SQLite is a relatively lightweight database, it is included as part
