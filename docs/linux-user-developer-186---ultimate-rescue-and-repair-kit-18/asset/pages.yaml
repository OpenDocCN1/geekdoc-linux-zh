  md: 'This approach is the one we''ve taken in the Eggs game from the beginning.
    All the services - TextMap, ConsoleOutputViewer: ServerHead and so on - are based
    on interfaces, and classes as StandardGameHolder have a dependency on these interfaces,
    rather than implementing the classes. The interfaces provide the methods that
    StandardGameHolder uses, but have different functions; for example, the ConsoleOutputViewer
    and ServerHead both implementing the OutputInterface but we instantiated in the
    program that any Spring class could create.


    All this at a small cost, however, in the main we have to instantiate every service
    class used in our program, passing objects to other dependencies. Our project
    is simple enough, but for a more complex project, keeping track of all the dependencies
    could turn out to be a major task. If we want to use Spring classes, we have to
    manage some dependencies in them that are different; therefore we need better
    methods to help us find the dependencies if we want to avoid repeated code.


    A way to get around this problem is to use dependency injection. This is a pattern
    where classes'' dependencies are declassified by means of a configuration file
    or Java annotations. With dependency injection, we can specify


    > Dependency injection would be provided within Java itself, but since it is not,
    we have to use an external framework


    versions of each dependency we used to define, and then these dependencies are
    ''injected'' into the classes that need them at runtime. For instance, instead
    of passing an OutputViewer to the StandardGameHolder constructor, we decide to
    use the ConsoleOutputViewer, and let dependency injection handle inserting this
    particular dependency to the class instead. When the class is called, we do not
    need to keep track of the inner workings of the StandardGameHolder class within
    our main.


    There are many ways to implement dependency injection: Spring Framework, Google
    Guice. As the README for Guice says, dependency injection would be provided within
    Java itself, but since it is not, we have to make with an external framework instead.
    In this project, we will be exploring the Spring Framework, but you might like
    to look at Google Guice as well.


    # Dependency


    A class or interface used by other class


    IOC Container


    The part of the framework that is responsible for running the program and dependencies


    Bean (@Bean)


    An object that the IOC can use to fulfill a dependency


    Service (@Service)


    A class that can be instantiated to form a bean Spring creates


    Bean Factory


    Object provided by Spring when it is instantiated. The parameters of an autowired
    bean are dependencies


    @Autowired


    Used to decide whether a bean is instantiated only once (@Singleton) or every
    time it is needed (@prototype)


    # Spring concepts


    The core concept of Spring is that there is a bean. a bean is an object that is
    created and controlled by the Spring Framework. Rather than the constructor providing
    us with an instance of such a bean, Spring will search for additional beans that
    the constructor needs. For example, in our program, we will create a bean of type
    GameLogic and it will create an instance of the StandardGameLogic class, as well
    as all the classes that need to be used by that class.


    About Spring dependency injection


    There are two ways to register beans with the Spring Framework. The first way
    is to write an XML file to define the beans. The second way is to let Spring read
    the beans classes, which we will be using in this issue, by Java annotations.


    If we provide a declaration with the @Service annotation, Spring will create an
    instance of that whenever it needs a bean of that particular type. For instance,
    if we have a dependency on an interface, and we have made the ServerHead class
    with the @Service annotation, Spring will instantiate the ServerHead class to
    satisfy the dependency of the first bean.


    We can use the @Bean annotation to create beans by defining a method. For example,
    if we define a Player class and add the @Bean annotation to it, then Spring will
    use that method and return the value whenever it needs to satisfy a bean dependency
    of type Player. If the method fails, then Spring will look for more beans that
    it can insert in order to call that.


    To construct beans we use a device called Bean Factory, which is provided by Spring.


    There are several things that can go wrong in this process. For example, if Spring
    tries to create a bean of


