    # Recover your system


    What to do to recover from the problem, keep your data safe and get your system
    running again


    Disk failures are a common cause of grief and can fall into a number of cases.
    Terminal drive failure is the worst and you usually say goodbye to your data,
    unless it is valuable to justify the services of a specialist recovery company
    (or someone else of). Next is a corrupted partition table, where the drive is
    visible but none of its partitions are seen. If you start trying to fix the drive
    in these cases, it may be a simple file system error, a bad port, or something
    as loose or damaged cable, or a problem with bad sectors. Another common cause
    is file system errors: the partitions are visible but cannot be mounted, or mount
    table the data appears corrupted, or have missing files when the file system is
    intact but important files have been deleted (by someone else).


    caused by an unclean shutdown. The standard tool for fixing this is `ffsck\`.
    At its most basic, you invoke:


    ```

    fsck /dev/sda1

    ```


    Note that you run `fsck` on a partition, not the whole disk. The `fsck` program
    is a wrapper that identifies the file system type and then calls the specific
    fsck program like extfsck. For some file systems like XFS, it actually does the
    repair itself. However, for those, you will need to run the appropriate repair
    tool. For standard file systems like ext2, ext3, and ext4, the program will prompt
    you for every error or inconsistency which can happen thousands of times, so you
    may want to run with `fsck -y`, which assumes you say yes to all questions, or
    `fsck -p`, which fixes only errors that can be safely repaired without intervention.


    When we get what we want, we work on the drive. If the drive shows up with the
    partitions, or the partition table is corrupted, we can recover the data. See
    the instructions at the bottom of the page.


