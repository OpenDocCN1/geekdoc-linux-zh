  md: '# Ultimate Rescue & Repair Kit


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_21_0.png)


    Store remotely

    If possible, do not keep backups on the same computer, even if you drive to another
    computer on your network, or use a cloud storage device.


    # Clone & back up


    Make a copy of your data, recover it when you can make sure any attempts at repair
    don''t cause further loss


    > If anything is wrong with a disk drive or file system, the easiest way to make
    it work is using a rescue CD. The first step is to boot from a read-only drive.
    Before mounting it, you should make a backup image of the drive. The usual tool
    for this is dd, but program will be slow reading from the drive, so we use ddrescue.
    This does the same as dd but will run again if it hits an error and instead, it
    skips to the next part. After multiple tries, Some of the tools we can use on
    an image file; to that, make a copy of the image on won - don''t risk anything.
    We can make another one.


    ```

    `ddrescue /dev/sda sda.map`

    ```


    The first device is to read, the second is the image file and the third is the
    map file used to keep track of any blocks it couldn''t read. You can recover more
    data by running the command many times: ddrescue uses the map file to know which
    blocks to try again works better with scratched optical disks than hard drives.
    Naturally, you can''t store either the image or the map file on the drive you
    are trying to mount, so you need to use other


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_21_1.png)


    Above there are many backup programs; this one is Déjà. It is important to know
    which you choose, but that actually uses it, preferably on an automated schedule
    separate drive, may be an external one, or a network. If your copy backups it
    can''t read a damaged section of the drive run, it will run again with success.
    If there is only one drive that is damaged, this will reconstruct all of the disk
    apart from this. If there are multiple occurrences, investigate the -1 option
    that allows reading from a specific sector without failing.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_21_2.png)


    The ddrescue manual at http://bit.ly/ddrescuemanual contains a number of useful
    examples, including details on handling this situation.


    Backups

    Much can be avoided by making regular backups. As well as means to recover data
    in the event of a loss, backups are important in the recovery process.


    > There is always the risk of any attempt to repair file system damage making
    things worse


    For extra security, send your backups to an external drive or by using open cloud
