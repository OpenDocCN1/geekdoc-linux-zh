    # Future of Programming Languages


    # Future of programming


    What does the future hold for programming languages?


    Ebefore looking at the future of programming languages, it would be helpful to
    delve into the past to understand the context. The first computers were programmed
    in machine code. Initially, the program was entered by writing binary numbers
    into switches or punched paper tape was used instead.

    For example, to address 011100 on an old op-code, you might have to enter the
    op-code (the binary number that represents the instruction) 00001110 to one particular
    address and 011100 to the next address.

    Needless to say, this wasn''t as easy and was very error-prone. First of all,
