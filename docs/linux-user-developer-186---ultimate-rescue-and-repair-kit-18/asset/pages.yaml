    # Read the data sheet


    By this point you''ve already made something incredibly useful. However, we''re
    going to take it one step further and make your Arduino energy-efficient as possible.
    The benefits are obvious: by using the microcontroller chip''s low power mode
    and turning off pieces of hardware you not only save a few drops of electricity,
    but also run the device off a battery for much longer. With the right setup, it
    is possible to create something that can monitor and report the temperature that
    can run for you without needing to interpret


    The following should work for the Atmega328b and 328P which are available on Arduino
    boards. You should familiarize yourself with the data sheet for your chip before
    proceeding-it is important that you are aware of how the Arduino is ''woken up''
    or it is ''put to sleep'' and its ability to interface with the board.


    To begin, you will need to include three headers to control your chip:


    ```

    #include <avr/sleep.h>

    #include <avr/power.h>

    #include <avr/wdt.h>

    ```


    This allows you to put the chip out of the many sleep modes, turn off the hardware
    and interface with the watchdog timer which we will use to turn the Arduino back
    up.


    To begin, by turning off the hardware. You won''t need to start anything as there''s
    no analogue-to-digital converter, the serial interface, even the USB itself. If,
    after interfacing with the sensor and the radio, you will turn off the hardware
    by:


    ```

    ADCSRA = 0;

    power_disable();

    ```


    # Set an alarm and go sleep


    For the Arduino to wake up, you''ll need to set up a few pieces of hardware that
    doesn''t turn off. The interrupt interrupts a few of clock cycles. First we will
    need to write to the watchdog timer and then, to set the length of the watchdog
    that should wait for the Arduino (in this case seconds), we then reset the timer
    to:


    ```

    WDTCSR = (WDIE | WDE);

    WDTCSR = (WDIE | WTC3 | WDPO0);

    wdt_reset();

    ```


    We''ve cut off the hardware and asked for a wake-up-call. It''s time to set the
    Arduino. First we select the sleep settings: "SLEEP_MODE_PWR_DOWN" for the deepest
    sleep, with the most savings


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_52_0.png)


    Above The final device, assembled and placed in an old jar


    mode is successfully, executed and disarmed after waking.


    ```

    set_mode(SLEEP_MODE_PWR_DOWN);

    sleep_cpu();

    sleep_disable();

    ```


    At this point you''ll be able to do much to Arduino. You''ll have to wait for
    it to wake up. It''s worth adding a large delay to interface with the Arduino.
    To point out, the expect is to last a dozen or minutes in which you can upload
    a new sketch before it falls asleep again. Welcome


    Upon waking, the Atmega will execute a system reset for which function is defined.
    You can do this in a few lines of the code. We''ll use it to turn off the watchdog
    timer, so that the rest of our sketch runs nicely. The Arduino will then carry
    on with it before going to sleep.


    ```

    ISR (WDT_vect) {

    wdt_disable();\}

    ```


    A line-by-line explanation of how to initiate power saving is available in the
    example sketch provided on the disc. It also comes with a few extra measures.
    A full description of energy savings is available at www.arduino.com/power."


    These measures will allow you to get the most life out of battery powering your
    project. If you go as far as a ''bare-bones board'', it is possible to get years
    out of a relatively small battery. Having followed this tutorial, you''ll now
    have a pair of devices which can broadcast on radio and store data over the coming-winter.
    Now, without guilt, feel free to turn your radiators on.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_52_1.png)


