  md: '# Components


    Robot


    +   - STM32F031

    - 2x forward-facing IR proximity sensors and 1x down-facing IR line sensor

    - 2x micro stepper motors

    - 1x uplink and downlink modulated at 38khz


    System


    +   - ST-Nucleo based IR bridge for communication between master and robots

    - Master junux system (RPI or laptop)

    - User input as joystick


    # Custom wheels


    "The project took a leap forward when we committed to the task that we needed
    to manufacture our own wheels for the robots," says Joshua. "We were originally
    using friction transmission to the wheels, as the wheels had no gear teeth on
    them. He also built a DLP Direct Light printer, which, he enabled him to control
    everything to make high-quality wheels to their required specification.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_72_0.png)


    # Master Pi


    The project uses a master computer to control the micro robots and to reduce the
    cost of a kit. The team experimented with various single board computers, including
    Raspberry Pi Zero W and the Orange Pi 2 Plus, with the aim to make master system
    more pocketable," says Joshua.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_72_1.png)


    # ROS junkies


    Robot Operating System''s (ROS) visualisation tools, debugging tools, state-of-the-art
    algorithms and communication simplicitywere just too good to turn down," says
    Joshua. "Through my research work, most of my colleagues and ROS junkies, wouldn''t
    count as a real project unless it can leverage the ROS ecosystem."


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_72_2.png)


    # Arduino drop


    The project used the Atmega268 at first, but then got frustrated with the lack
    of features in the Arduino IDE and switched to the STM32L1. This offered plenty
    of time to implement better control and more flash and RAM. As we wanted to abstract
    away low-level details for the user, Arduino was primarily misguided in first
    place," says Joshua.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_72_3.png)


