    # IMAGE CONVERTER


    # Converse 0.9.6.2


    Automative image processing tasks


    If you have worked with images, either professionally or through clicks, a lot
    of image processing is monotonous—repeatedly converting, resizing and rotating
    images to make them suitable for passing around. You can use any image app from
    Gimp to MP, for this task, you''ll save yourself by having a dedicated conversion
    tool like Converse. Converse is a straightforward frontend to the powerful conversion
    utility. You can use it to convert images to over 100 formats, rotate and flip
    them, change their dimensions in a fraction of the time it would take to perform
    these tasks. You''ll need install binaries for Ubuntu, Fedora and OpenSUSE along
    with sample instructions. The workflow is pretty straightforward—click the Add
    Buttons to select any number of images you want to convert. Then scroll down the
    Action panel on the left to hit the Convert button to begin the process.


