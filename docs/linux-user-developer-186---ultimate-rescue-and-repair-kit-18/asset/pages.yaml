    common vulnerabilities on websites (SQLi, SSL, sensitive data and so on), while
    providing you with a powerful framework for circumventing web clients, performing
    manually scans or controlling automated attacks. A lot can be learned during a
    pen-testing engagement. But it is not all about the web - think about all those
