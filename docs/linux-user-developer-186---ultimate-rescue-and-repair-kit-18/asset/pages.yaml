    The robots are not used in teaching at all, though in the future we hope to have
    that. I am using in my private tutoring sessions with 13-year-old kids. The robots
    for fun and we use a larger set of robots for teaching soldering techniques. The
    primary guiding project is to implement robotics football, which I always try
    and let the kids do. We will see and what we will eventually achieve.


    When you mentioned camera, OpenCV - how can you explain this?


    For most experiments, knowing the location of it is a fundamental problem of perception.
    If the sensors we have are not sophisticated enough to discover their location
    from the environment, a potential solution is to use an overhead camera to track
    where the robots are placed. This fixed camera setup can be achieved simply by
    mapping the system''s coordinates in relation to the surface, which can be hard-coded.
    Though to the fact that I have had whipping the robots at opportune moments, the
    robot project and system are possible to deploy ad hoc. Here, we use a code like
    in a coordinate reference that provides the computer vision system with a set
    of scale and orientation which does not need to be orthogonal to the surface,
