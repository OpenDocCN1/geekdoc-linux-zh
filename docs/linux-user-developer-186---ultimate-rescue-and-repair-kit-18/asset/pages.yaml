  md: '![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_86_0.png)


    > The unit has numerous hardware safeguards to defend against external tampering,
    bypass attacks and fault injections


    From a design perspective, two features make this drive special: the first is
    the built-in USB cable. The cable is only 12cm long when unplugged, but long enough
    to attach it to a laptop or desktop PC. The other standout feature is the built-in
    numeric pad. This is the first feature of its kind that the hardware encryption
    mechanism iStorage has implemented. In addition to the drive, there are a few
    special keys for operating the unit when it''s attached to a computer.

    Besides the numeric pad there are three LEDs that confirm the locked status, and
    also show activity. At the same time the numeric pad handles the encryption of
    the device. In theory, this means that if the drive is extracted from its case,
    an attacker is no closer to getting the data.

    nYou can also set a 7-digit password when the Pro2 was first configured. If you
    fail to enter the correct codes ten times the drive will reset deleting the encryption
    key, rendering the contents beyond reach unless you know people in the security
    services who can also recover AES-256-bit data.

    In addition the Pro2 has some extra security safeguards to defend against external
    tampering, bypass attacks and fault injections. Any attempt to get into the case
    or tinker with USB, it will trigger a defrozen state, so any further assault is
    pointless.


    Devices with a numeric pad like this usually come with a PC application that you''ll
    need to install, but the Pro2 is fully self-contained. That allows it to work
    with Linux as well as other OSes such as Android, Chrome, macOS and Windows. You
    can use it with any operating system once you''ve created yourself.

    The unit comes with a default PIN number defined, and you can change that directly
    using the numeric pad. You can also even define a ''self-destruct'' sequence,
    which performs an internal crypto-wipe when the PINs and data are assessed. For
    the majority of people, the Pro2 has enough in the way of security.

    With 65MB/s reads and 144MB/s writes, the spinning disk inside the Pro2 has some
    intent about. An SSD would be quicker (and larger) but the performance levels
    are good enough, and as rapid as a PC with hard disk-based storage is like. The
    unit is itself certified, making water resistant. The extra touch of physical
    protection is that the keys on the pad are coated in epoxy. This makes it harder
    to work out what keys are being erased on a regular basis.


    Mark Pickeringance


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_86_1.png)


    # Pros


    Beautiful construction and offers great data security. Being self-contained, it
    will work with any Linux drive


    # Cons


    You get what you pay for, so it''s expensive and potentially a little daunting
    to set up


    # Summary


    A secure storage device that''s built to handle physical abuse and nefarious attacks
    comes at a premium price.

    The overall combination of a well-considered design which is also a superbly engineered
    device is an alluring one.9


