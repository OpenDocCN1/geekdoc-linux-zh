  md: '# Review Fresh & open source software


    # CODE EDITOR


    # CudaText 1.23.0


    A feature-rich editor for writing code


    Linux has no dearth of advanced text editors that monitor as lightweight IDEs
    and we ran a group test of some of the best few after us (LU082, Pg 1). CudaText
    is one cross-platform editor specifically designed to write code, but could also
    be an advanced text editor.


    The editor has all the usual conveniences, like syntax highlighting for several
    programming languages including C C++, Java, HTML, CSS, and Python. You also get
    code folding for some languages like HTML and CSS, the ability to search and replace
    with regex, as well as multi-editing and multi-selection. Extend functionality
    by installing additional plugins that are written in Python.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_89_0.png)


    The app has color themes for the interface. It has a matching scheme for coding


    The project provides uncompiled binaries for Debian-based distributions. So you''ll
    have to compile it manually following the instructions in the online document
    that contains all aspects of the app, and is a must-read to get all the features
    of the app. If you''ve worked with text-code editors before you will have no issues
    using CudaText''s interface.


    # Pros


    Includes all the common coding convenences and can be extended with plugins.


    # Cons


    You''ll have to edit configuration file to hook it up with the Python interpreter.


    # Great for...


    Editing code with an IDE. http://viewsoft.com/cudatext/


    # DIVE LOG TOOL


    # Subsurface 4.71


    Log and analyze every USB dive with ease


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_89_1.png)


    Linus Torvalds likes to track whatever he does. He wrote Git to keep track of
    the kernel development and Subsurface for his dives. He likes to welest and plunge
    underwater whenever there is a bug in Linux kernel. He wants to find a good log
    for his dives, so naturally he wrote one he needed.


    It descends and speeds along with the depths. Each event, such as a decompression,
    is also marked. The app records details about the diving equipment, and can analyze
    various statistics about multiple dives. It also has features to help users, as
    a visual tool. The latest version uses some user interface changes, like a new
    map widget. Supporting importing data from Smartdive, DLT, and many other third-party
    formats has also been improved, and there is new hardware support for the Bluetooth
    LE dive computers. The project lists binaries on its Downloads page for several
    platforms, and there''s an App that works on any Linux distro.


    Simply put, Subsurface helps keep track of dives. It supports import data from
    many supported devices via USB. Once your data is imported, you can view and edit
    dive details from the user interface. The app also enables you to edit dives manually.
    The app shows a dive profile graph that dives as a line graph.


    # Pros


    Very easy to use and works with a large number of dive computers.


    # Cons


    You''ll have to read documentation to discover all its features.


    # Great for...


    Analysis of dive data. https://subsurface-divelog.org


