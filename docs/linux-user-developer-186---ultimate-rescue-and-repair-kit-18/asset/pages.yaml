  md: '# Feature Ultimate Rescue & Repair Kit


    # QUICK TIP


    # Get your duster out


    Keep your computer clean from the outside, if it gets dusty inside, think what
    the inside. A couple of minutes with an air duster is often better than waiting
    for problems to strike.


    # Diagnose failure & clean up yourself


    Diagnose failure and clean up yourself by eliminating problems and files that
    are no longer needed


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_25_0.png)


    # QUICK GUIDE


    # Power protection


    The easiest way to save the life of your hardware is with dirty power. A decent
    UPS (uninterruptible power supply) not only allows your computer to shut down
    cleanly in the event of power failure; protects against fluctuations (brownouts)
    that can weaken hardware, especially disks, and voltage surges that damage motherboard
    components and more. One UPS protects more than one computer.


    Power supply and components are relatively easy to fix, but unexpected damage
    can cause expensive. Fluctuating voltages and high temperatures can damage components.
    A good UPS can save you money more than it is worth by saving your power bills
    and reducing the overall risk.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_25_1.png)


    A failing component, like a power supply, is more likely to fail when hardware
    gets old, and so you should monitor. The good news is that it is easy to test.
    Use Memtest8 to run tests (or for free, memtest86). Memtest8 runs a battery of
    tests on your memory and reports any memory failures. You should let it run for
    one or two days, overnight is ideal. If a failure shows up, you will need to remove
    individual memory sticks and run the test again until one is faulty - unless you
    have only one to start with.


    # Getting SMART


    The weak link in the hardware is the hard drive. While some worry about the lifespan
    of SSDs, the truth is that they would last for years with no problems. Mechanical
    drives have complex electromechanical components with lots of parts to go wrong.
    Lucky for us, they ARE also easy to test using SMART (Self-Analysis and Reporting
    Technology) built into many drives. You need to enable SMART in the BIOS setup,
    then you can use a programmed smart to monitor the drive while it is working as
    normal. To get a health report on a drive,


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_25_2.png)


    Below SMART monitors your drive''s health in the background. SMARTcontrol reports
    its state graphically


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_25_3.png)


