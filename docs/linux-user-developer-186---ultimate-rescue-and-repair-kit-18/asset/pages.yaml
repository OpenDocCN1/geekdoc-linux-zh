  md: '# Tutorial Arduino


    # Use Arduino’s sleep mode to monitor temperature


    Protect your pipes and heat your home effectively by monitoring the temperature
    over the season


    Temperatures are beginning to drop to freezing and the days are already short.
    For those worried about spending all their time on running the boiler, January
    is often the most agonizing month. You''ve already bled your radiators and are
    resigned to wearing jumpers, but are you still concerned about the pipes freezing
    and bursting? With this temperature monitor which can be placed anywhere in the
    house and run for months on end, automatically reporting its data to base will
    keep you informed about when to turn the heating on.


    We''ll be using a lower-power Arduino and preparing the sensor. Using LUB13 we
    will show how to add the radio transmitter to the interface with DHT22 using a
    library by Adafruit. We will then send messages containing the measurements, and
    create a base station to receive the data. Finally, we''ll utilise the Atmega''s
    sleep mode, waking up every so


    and powering the board only when required so that the battery doesn''t drain all
    at once. In the end, we''ll produce a temperature monitor which can run for the
    whole season without any maintenance, and get incredibly rich data about temperature
    cycle of the coldest room in your home. From this you will be able to avoid turning
    the radiators on (or hopefully) a few hours earlier.


    For this tutorial, your choice of Arduino matters. A battery only has so much
    capacity, measured in milli hours (mAh). Most power banks deliver 5V with a capacity
    of around 220mAh. An Arduino Uno will use about 50mA in idle mode, which would
    exhaust the battery in just 4 hours. This is due to the large number of hardware
    components sitting on the board, all of which require power even if they are not
    being actively used.


    To reduce this burden on a battery, it''s a good idea to make your own Arduino
    from parts and with few


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_49_0.png)


    Above Arduino Nano, with temperature sensor, transmitter and coin battery'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'components as it requires. These ''bare-bones'' boards can eliminate two-thirds
    of the power wastage and open the possibility of operating the microcontroller
    in microamps of current instead - potentially allowing for years. If this is beyond
    your skill set, we recommend using a smaller board, such as the Arduino Uno which
    has less hardware. However, for this demonstration, we are going to use the Arduino
    Nano and it should be able to run for a few weeks without needing a battery.


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_50_0.png)


    # Prepare the sensor


    The DHT22 is a temperature and humidity sensor, available cheaply online. It comes
    in two variants, with a circuit board attached and without one. If you purchase
    the sensor without the board you will need to add a pull-up resistor to the voltage
    supply and data pins, as communication is performed by creating a data point between
    voltage and time. To resist noise, it''s not uncommon to use a 10k resistor. Connect
    voltage-in, and data to the digital pins on Arduino, by using the single-wire
    pulsed protocol (One-Wire).


    To interface with the sensor, we are going to use the Adafruit Sensor Library
    and DHT Sensor library. Both are available to be installed through the Arduino
    IDE, which also handles the dependencies. This saves us from having to write our
    own program to deal with the communication protocol. By using the Adafruit library,
    we simplify the code required to wait for data. The sensor then confirms it received
    the instruction and sends a stream of 8 bits. This makes it easier for all of
    us to deal with the pulses.


    It''s time to start programming! Using the Arduino IDE to create the temperature
    sensor, we need to include a few lines at the top of the code that show how to
    handle the sensor and which pin to use for communication. Make sure DHT data pin
    is connected to Arduino. We create a DHT object which handles the communication
    and conversion of data:


    ```

    #include "DHT.h"

    #define DHTPIN 2

    #define DHTTYPE DHT22

    DHT dht(DHTPIN, DHTTYPE);

    ```


    In setup(), we need to call dht.begin() to initialize the object and set the data
    pins. Then the only method we need to get a reading for temperature and humidity
    which can be performed in the following function:


    ```

    float temperature = dht.readTemperature();

    float humidity = dht.readHumidity();

    ```


    The sensor takes a couple of seconds to acquire a measurement and also needs two
    seconds to ''warm


    Above DHT22 - sensor for measuring temperature and humidity


    up'' after powering before it can be used. This point will become important later
    when we begin to turn hardware off to save power. Now you are able to measure
    the temperature in your home. If you''ve got a thermometer, you might want to
    confirm if your reading is accurate: if not, you might want to add a calibration
    constant to correct your Arduino.


    # Add the radio transmitter


    We have an Adafruit sensor monitor set. For it to be useful, we''re going to consider
    how we will handle the data. With an SD card adapter there would be an easier
    option, but we want to interpret the measurements in real time by sending them
    radio periodically. In this tutorial, we are instead, going to


    ![](img/b0e5bcf1ba8a75a2b9418fda820e5cd0_50_1.png)


    # The Adafruit library saves us from having to deal with the communication protocol


    broadcast our data using an radio transmitter to connect to another Arduino which
    will relay that data to over USB. If you''re using a Raspberry Pi, you could connect
    the receiver and skip the second Adafruit unit.


    We''ve used the FS-001 and AM-001 - 434MHz receiver and transmitter pair that
    can be connected to only two devices. For example libraries of space when soldered
    to the transmitter and receiver and operating at 5V, communication was achieved
    at distances of 50m (not in line of sight). They should do the short range within
    the home. If your walls are too thick and range becomes an issue, you may have
    to switch to Bluetooth or Wi-Fi instead.


    +   No requirement

    there''s even no need to go around trying to sketch to the communication protocol
    between two devices. Libraries are available for installation so for the tricky
    part is done and you can spend your time making a more useful device.'
