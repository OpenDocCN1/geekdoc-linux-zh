    \nIf you run dialog without arguments from the shell, it will give out a list\
    \ of the window you can create, with the required parameters, too.\n\nThe problem\
    \ is here that since choice is not lawful. The traditional way is to use this\
    \ via Ncurses. The original dialog was a library created by Berkeley Software\
    \ Distribution (BSD) kernels to help a terminal-based goal, which has far outlived\
    \ it. Linux uses the same library since the 90s and will be familiar to anyone\
    \ who tried to install BSD or Linux prior to 2001. Some graphical use a character-based\
    \ screen instead, moving between boxes using the Tab key. These points can be\
    \ pretty much any of standard GUI widget, like a checkbox or text entry.\n\nSTDERR\
    \ means that you don't get to see it. All output of that dialog will pipe out\
