    # Not enough TV cards?


    # Safety margins


    If I want to record overlapping programs, do I need multiple TV cards, or can
    I turn one into multiple channels?


    I''d prefer to start minutes early and end them late. There''s better than watching
    a programme right then, then missing the conclusion because it started late or
    over ran.


    If you''re using DVR, these means several channels into one stream. I would also
    like to record an extra channel per DVR tuner card, and split it into multiple
    channels


    There are two ways that you can configure this. The first is to go Setup > TV
    Settings > Recording > Prioritize Sorting. From here, you can set Start Early
    and End Late. These are the defaults for every recording rule, and can also be
    changed for individual rules. Note that this can cause conflicts if you''re trying
    to record back-to-back programs, because these times will overlap. This isn''t
    a problem if you have enough capture cards, however, if you are using multiple
    tuners.


    The other place is in Setup > TV Settings. The four page settings allow to record
    start early and end late respectively. This option doesn''t cause conflicts, because
    it''s ignored when making back-to-back recordings. There''s also an option on
    page to record over time for a category of shows, which is used for the Sport
    category and takes care of inconvenient time seasons or penalty shootouts. It''s
    important to keep in mind, the extra disk space that all those additional minutes
    can take up.


