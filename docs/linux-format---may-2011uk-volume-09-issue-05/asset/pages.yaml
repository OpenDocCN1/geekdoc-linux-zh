  md: '# # Installation and setup


    ![](img/ddd273149103130953199fe3b160343f_40_0.png)


    There are three main ways of installing MythTV: compile from your distro''s repository
    to an existing Linux system or a MythTV-enabled distro. We''ll be working with
    the latter option, but you can still choose a combined if you prefer one of the
    other routes.


    MythTV is basically customizable with MythTV added and much of the software available.
    As it such, it can be used as a basis for a home media center or a streaming server.
    If you follow the details of installation, you can install another installer in
    a different colour. It it will ask you the type of installation you want. Normally,
    you''d choose a primary back-end or a front-end–secondary back-ends involve more
    complexity than we need to space of here.


    MythTV 10.10, the latest version at the time of writing, comes with MythTV 0.23,
    but we''ll be using 0.24 for the rest of this feature, so your first step is to
    upgrade. Once you''ve booted into MythTV, press Esc to MythTV www.mythtv.org/auto-build
    and install the mythtv-repo packages. The update manager will handle the rest
    for you.


    Once you have MythTV 0.24 installed, you need to set up the back-running: myth-setup.
    In MythTV, go to Applications > System > MythTV > Backup Setup. If you are using
    a separate back-end out of sight, you can use VNC to connect and run myth-setup
    which means that the back-end will still need a desktop. You can also use the
    SSH command to run the setup program on the back-end, but display its window on
    your desktop:


    # ## Step by step: Using mythtv-setup


    ![](img/ddd273149103130953199fe3b160343f_40_1.png)


    +   1. General

    2. Capture cards

    3. Video sources

    4. Input connections

    5. Channel Editor


    ![](img/ddd273149103130953199fe3b160343f_40_2.png)


    # ## 1 Configure main


    Work through the seven MythTV sections one by one. The menu isn''t visible, but
    you can use the Up and Down keys to move between sections and the Left and Right
    keys to change an item. Check the left item will be at the bottom of the screen.


    # ## 2 Set your frequency


    The most important items in the settings are on the Locator page, where you set
    the standard TV frequency and channel. Repeat this, for each different device
    e.g. DVR or video, most other types appear under /dev/ or /video/. If you don''t
    know your settings, check MythTV''s wiki.


    # ## 3 Add capture cards


    In the Capture Card section, set the card type at the top – if you have multiple
    cards, repeat this, for each different device e.g. DVR or video, most other types
    appear under /dev/ or /video/.


    ![](img/ddd273149103130953199fe3b160343f_40_3.png)


    ![](img/ddd273149103130953199fe3b160343f_40_4.png)


    ![](img/ddd273149103130953199fe3b160343f_40_5.png)


    +   - (Create Local Group)

    (Create Video Group)

    (Create Neos Group)

    (Create Teletext Group)

    (Create Covert Group)

    (Create Screenshots Group)

    (Create Banner Group)


    # ## 4 Source video


    When you need to set up a video source – if there is already a DVR source, create
    one instead. Add each of your capture cards to a video source. You can also set
    up listings grabbing here, which may involve setting up an XMLTV file.


    # ## 5 Scan for channels


    The Channel Editor is where you list the available channels. Scan Channel, make
    sure it is the correct region and leave it for a couple of minutes to show up.
    Edit the channel list to remove any you want.


    # ## 6 Direct your saves


    Finally, you need to let MythTV to save your records, specify so one or more locations,
    if you choose multiple locations, it will use them to allocate available space
    and balancing.


    www.taxadar.com May 2011 LXF144 | 41'
