    # 4 Partition


    At the partitioning step, OpenSUSE will offer you various options depending on
    the layout of your drive. If you''re an advanced user, you can edit it manually.


    # 5 Account


    You''ll also be asked to set up a user account that will identify you to the system.
    When you do, remember that usernames and passwords are case-sensitive.


    # 6 Confirm


    The installer will check that you want to go ahead; click any of the blue underlined
    links to change settings. The distro files will be copied over.


