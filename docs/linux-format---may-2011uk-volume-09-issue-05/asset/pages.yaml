    # Want to record live TV straight to your computer? Neil Bothwich guides you through
    Mythtv.


    Over the next few pages, we will look at installing and setting up MythTV, as
    well as how to use the various features. We will also deal with a number of common
    questions that arise.


    Let''s start with hardware. You''ll need a computer capable of recording programs
    and some storage. MythTV is a server/client model. The model is known for its
    back-ends and scheduling recording, alert flagging and so forth, the front-end
    can be the same computer, but they do have different requirements.


    The back-end needs plenty of storage (once you get into MythTV, you''ll find there
    to be a small amount of space) and a reasonably powerful processor. In other words,
    a typical computer - not the most active or silent addition to your living room.
    The front-end needs a decent connection and the ability to output video and sound
    to TV. I use an Acer Aspire Nitro netboxed to the


    We reviewed MythTV 0.24 in LXF141, and commented that it''s a little effort to
    set up, but worth the effort. MythTV is more than a recorder - its plugins add
    extra functions, and that means you can do all sorts of clever things with it.


    > It''s more than a TV recorder - the plugins add extra functions.


    There are other advantages to having separate front-ends and back-ends. You can
    have multiple front-ends connected to one back-end. This is available in any room.
    You can start watching a program downstairs and finish it in bed because the back-end
    will remember where you are up.


    The type of TV you need depends on your area. Most is now 100% digital, with Freeview
    in the UK. All D-T-B de-codivers for digital satellite, as well as analogue D-VB
    recorders have the power needed. The big advantage of the D-VB formats is that
    they are broadcast as MPEG streams, so no loss of quality occurs when recording
    them to hard. This is important if you''re


    running the front-end on the same machine, or to make simultaneous recordings.
    HD is another matter. While Freeview has been available in the UK for over a year,
    there is no D-TV HD and you can''t record HD without a special device. D-VB S2
    cards are available, so if you want to get a dish or be patient. HD places extra
    loads on, so you''ll need a more storage space, a faster connection between front
    and back-ends and a faster GPU on the front-end.'
