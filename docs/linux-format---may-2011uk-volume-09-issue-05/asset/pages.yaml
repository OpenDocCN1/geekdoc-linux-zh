    # # Fedora 15 details


    Gnome 3.0 makes its debut, with other new features.


    The Fedora project has launched the alpha for release of 15, boasting a number
    of features, including the first stable release of Gnome 3.0 and the introduction
    of pioneering virtualisation BoxBinder. It is significant because the first post-release
    is full of variation, and may set the stage for the future enterprise-focused
    product.


    services such as Amazon''s EC2 or virtualisation as KVM and VMware with a few
    simple lines of code. Software then takes care of downloading, building and deploying
    the application. With Red Hat Linux 6 finally available to manage, it would seem
    that Fedora 15 potentially provides the first glimpse of what RHEL could contain.


    The opportunity to use the new 3.0 desktop distribution will be the most significant
    change for desktop users. The new Gnome desktop has rewritten from the ground
    up and introduces a radical difference from what used before to the traditional
    Windows/Mac OS ideas and to the interface of Android or iOS.


