    # Newsdesk


    # HP to lead the desktop charge?


    HP plans to offer Windows Android in all new machines.


    Hewlett Packard CEO Leo Apheward has revealed plans to include the HP Linux-based
    operating system in all future HP computers. We would instantly propel HP to lead
    the Linux desktop and expose millions of users to non-Windows computers. Apheward
    dropped his bombshell in an interview with Bloomberg claiming the strategy would
    enable to regain its soul, along with encouraging growth in emerging markets,
    such as India. He said every HP machine next year would have the option of using
    Web, alongside Windows, and this would instantly increase the potential for Web
    apps, making the platform more profitable for developers. Currently contains just
    5,000 applications, compared to 250,000 available for Android and 350,000 on Apple''s
    OS.


    If the reaction is favourable, it could encourage HP to launch a range of laptops
    and desktops that use Web, excluding the licensing costs associated with buying
    PC and enabling HP to undercut the competition.


    +   - HP Web could come from tablet to PC.


    # SUPERCOMPUTING


    # Nvidia sets supercomputers on big iron


    Nvidia graphics power supercomputers following low-end success.


    Having made its impact on the graphics industry card, and more recently, low-end
    power devices with its Tegra on a chip, Nvidia set to get beyond its traditional
    boundaries to become a supercomputer player. Speaking at the Consumer Electronics
    Show, CEO Jen-Huan Huang said the company was working on a new line that would
    be suitable for the kind of high-performance machines that were traditionally
    running on Linux.


    He said the company''s expertise in performance with low power overhead would
    enable it to scale the technology well beyond the fastest machines of the current
    generation of supercomputers.


    Nvidia is involved in one project with DARPA, the US government''s military research
    agency, which it says will lead to a computer 1000 times more powerful than the
    best available machines today. The company claims this machine could be ready
    in just six years.


    +   - Jen-Huan Huang said supercomputers are a massive opportunity for Nvidia.


    # LEGAL


    # The slow march of the truth


