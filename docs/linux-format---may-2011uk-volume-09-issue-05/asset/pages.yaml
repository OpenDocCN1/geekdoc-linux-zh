    # # The secret life of passwords, so you know that the only thing not stored in
    /etc/shadow - but do you know how they really work?


    It starts with the basics. All Linux accounts – or at least protected by a password.
    When a user sets a password, a hash is written to their account entry in the /etc/shadow.
    When the user logs in, their password is again hashed, and compared against the
    shadow file. The plain password is not stored anywhere on the system.


    That''s a simple explanation, but in reality, when a user sets a password, a salt
    value is randomly chosen and concatenated with the plain password. The whole hash
    is calculated and the salt is stored in the password field of /etc/shadow. When
    the salt is retrieved from the shadow file, combined with the password, the hash
    is compared against the stored hash. If the hashes match, the user is granted
    access. This happens without the user ever revealing their password.


    Password strength depends on the variety of hashing algorithms used. The earliest
    were based on the DES algorithm and eight-character passwords.


    each character seven bits chosen from a 56-bit DES. For MD5-based hashing, SHA-256
    and SHA-512, later versions of Linux have added support for much longer passwords.


    # Making a hash of it


    Start with a piece of text. Add the ASCII codes of all the characters, then take
    the first four digits of the result. Obviously, you''ll end up with a completely
    different number. That''s an example of a hash. It''s sort of fingerprint of the
    original, but a


    lossy transformation and you can''t get back to the original text. However, it''s
    easy to come up with an input (not necessarily the original) that produces the
    same hash. But for cryptographic strength hashes like MD5 and SHA, it''s far harder.


    Here is an example-character hash of 86 characters. This is a SHA-512 hash. All
    of this is generated by the crypt library.


    # Password cracking


    If you manage to hold of a copy of the shadow file, how is it to find password?
    Cryptographers can use the effort needed to launch a brute-force attack by systematically
    trying all possible passwords, hashing, and looking for a match.


    # “When a user sets a password, a salt value is randomly chosen.”


    The salt makes it impossible to use pre-computed hashes. Rainbow tables are big,
    and you''d need a separate table for every possible value of the salt – a task.
    All of this is discussed in greater detail at http://central.com/security/password.html.


    In reality the search space for passwords that actual people like to choose is
    massive. Small programs like John Ripper make effective brute-force attacks using
    dictionary words and short strings. An overrule of cracking depends on hardware,
    of course, and how well users are encouraged to importance choosing strong passwords.
    Of course, you might have an attack to have access to the shadow file in the first
    place, and there is a more promising approach is – getting a user to trust sufficiently
    to actually tell you the password. User education has a big role to play here.


    Below is show of how this works. We can see an eight-character password and two
    salt hashes. The hashes are 64-based, so each character is six bits.


    ```

    566969899226D5699226D0N6S

    vGgmvcucY33A8W6M46M4k6L6Pby90v5S5f5a7

    gie2d3GfH3c0

    ```


