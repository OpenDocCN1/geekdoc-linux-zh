    \ to output the result of our operation.\n\nLet's try one:\n\n```\ndialog --select\
    \ --15 25 5 2 1-6\ncp $result $ \nset ? = 0 6 & echo \"File copied\" || echo \"\
    File-failed\"\ndialog --msgbox \" 6 6\n```\n\n# Using dialog\n\nThere are many\
    \ types of dialog that we can create, but before we got around with the cunning\
    \ but not 21st-century-library, it's better to use Xdialog. Xdialog is a drop-in\
