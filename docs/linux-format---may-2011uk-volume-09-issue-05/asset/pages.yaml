  md: '# # WIN! A Debian Packaging Tutorial


    # ## The Debian Packaging Tutorial

    19th May

    Imperial Hotel, Russell Square

    London WC1B 5BB


    ![](img/ddd273149103130953199fe3b160343f_14_0.png)


    This one-day course requires very little Debian specific knowledge, although attendees
    should have some familiarity with the GNU/Linux shell command line. By the end
    of the course, each attendee will installed a build environment on their laptop,
    and understand how to prepare packages suitable for upload to Debian, as well
    as how to prepare a local repository for use in addition to the Debian archive.
    Further information on http://www.ukuug.org/events/debian2011/


    Your tutor, Philip Hands, is the owner of Hands.Com Ltd, a Free Software company
    that has been providing commercial support for GNU/Linux since 1993. In 1996 he
    joined the Debian Project, initially by packaging rsync, and subsequently being
    responsible for packages including openssh, qmail-src, mget. Not only organiser
    and sponsor of DebConf, he is the designer of the famous Debian Tartan.


    ![](img/ddd273149103130953199fe3b160343f_14_1.png)


    Two runners will up get get a copy of LPI Linux Certification in a Nutshell, 3rd
    Edition.


    TO WIN - Send an email to debiantutorial@oreilly.co.uk before April 30th.


    The winner will be chosen at random and announced on May 3rd.(The prize is the
    tutorial only and does not include travel or accommodation.)


    ![](img/ddd273149103130953199fe3b160343f_14_2.png)


    # O''REILLY


    O''REILLY UK Limited and the Unix User Group have joined forces to provide high
    standard courses taught by the experts in their field.


