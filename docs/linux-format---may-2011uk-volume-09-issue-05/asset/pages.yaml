  md: '# SCALE


    ![](img/ddd273149103130953199fe3b160343f_48_0.png)


    There are many open source conferences over the world. Some are community-oriented,
    and some blend two perfectly to offer a friendly atmosphere with all the companies
    attending. The Los Angeles Based California Linux Expo (SCALE) has grown exactly
    this. We met Ian Rabbovich and Dave (Beach), who have been involved with the conference
    since day one, to explore its story.


    LFX: That market of commercial and community participants is key and offers a
    bit of equilibrium. This delicate balance is one of the keys in our special sauce.


    LFX: How has SCALE grown over the years, and how have you managed that growth?


    OB: It''s grown to meet the needs of the community - we''ve grown at about the
    same rate. As a result, we''ve grown from being a two-day conference with 12 speakers
    and an open expo of 25 booths to over 65 speakers and a three-day event, now.


    LFX: How did SCALE get started?


    OB: SCALE grew out of a series of LFXfest hosted at the Northern Facility in Silicon
    Valley 10 years ago. We were two-day events. By the time noted LFXfest had a growing
    challenge, and we needed the community for this type of event. Ian Rabbovich:
    The LFXfest were great, but then bubble started bursting. With an wanting to create
    an open source event in Southern California with a group of students at UCLA and
    UCI with similar goals. Scale was born in 2002 at the USC Conference Center. Most
    of our original founders are still around today.


    LFX: What kind of audience does SCALE target?


    OB: The demographic is diverse and wide. We try to cover all of the audience including
    beginners and children. We try to have something for every interest. This means
    that we attract fans from hobbyists to IT professionals and executives. Our mission
    is to help empower people around coding in general. Though Linux is in our name,
    most of what we cover goes beyond Linux-specific topics.


    LFX: What do you want from us?


    OB: It''s now that we''re able to take on all of that internal work. However with
    some interest in events that has allowed us to expand the content and add more
    original. This special SCALE has helped us keep an energetic atmosphere by drawing
    in new communities.


    LFX: Why do you want to scale up?


    OB: The community wants to take it. We anticipate that growth will continue as
    it is in the past: between 5% and 15% per year. We want to plan for the future
    where we might have to move out larger.


    OB: We''re seeing a high demand for talks targeted at developers and tracks for
    the future. We imagine we will need to add more industry-specific tracks. It''s
    important to keep the community engaged. We want to be an inclusive conference
    for new people.


    Another way is to continue expanding our community events here in the United States.
    For example, in 2010 we collaborated with a group of people in Austin, to launch
    the Texas Linux Fest. Their second annual event will be coming. Our goal is to
    continue helping them scale.


    # ON SCALE''S FUTURE

    ''I''d love to see our open source

    in education track scale off

    and offer more-hands-training.''


    LFX: SCALE has become one of the most popular conferences in the USA.


    How do you want to retain the community?


    OB: We attract communities through our goals as organizers. We started with the
    idea to build a local source event that we would enjoy attending


    OB: SCALE organizers are all volunteers


    These mini-conferences have had an ODF event at local government, and healthcare
    IT solutions, women in open source. Others of these have spun off to become their
    own events. Yet one of these is educators who want to use open source in the community.


    Existing groups give us their growing pains, and as we help start new events,
    we believe it that if everyone has access to quality learning opportunities around
    open source software.


    LFX: What would you like to give to event organizers running a conference?


    OB: Meet the community. In Southern California we have a large demographic, and
    we need more software development than a small community. So might have one or
    two event organizers, and maybe a marketing department, to focus more on end-user
    experience.


    OB: Start planning early - and don''t be afraid to ask for help when you need
    to sweat, reach out to organizers of events if you have any questions. Many of
    the community conference and festival organizers work together and trade ideas.
    We see many new events coming up, and don''t be afraid to collaborate with others
    to achieve our goals.


    Finally, like any other open source project, would make it easy for others to
    contribute. Organizing events takes a great deal of work, so making it easier
    for others to keep the SCALE up.


    ![](img/ddd273149103130953199fe3b160343f_48_1.png)


