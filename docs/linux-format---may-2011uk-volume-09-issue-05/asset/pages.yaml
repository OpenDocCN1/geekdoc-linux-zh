  md: '# Grace


    # A plotting and statistical analysis application from the good old days of Unix.


    This is a good program, but better to find than you''d expect. The official name
    of the executable is Grace. The one that you want to prompt at or to run your
    system menu is grace.

    The look and feel of Grace really sets it apart from its competitors - whether
    it will make you pray or it is easy to use. Users who first met graphical desktops
    in the last decade will be confused, while those who started using them in the
    previous millennium will be struck by nostalgia. Grace is an old-looking program.
    Its built with Motif-style widgets is quite unusual for Unix-like desktops. This
    shouldn''t, however be enough to dismiss the program without giving it a try.


    +   * Grace has lots of options for both the analysis and presentation of your
    data.


    Daily Mean Streamflow

    (a sample of BoxPlot)


    ![](img/ddd273149103130953199fe3b160343f_30_0.png)


    # Plotting your data


    The official description of Grace is a plotting tool for numerical data. This
    means it can handle any plain text file filled with columns of numbers or as coordinates.
    Alternatively, the program has a built-in script that allows you to create plots
    from your data. To load data from a file, select Data > Import > ASCII from the
    main menu. Grace is still able to handle two columns, or Block Data when there
    are more columns in the file. If you need to, you can


    process data in this way inside Grace, without altering the file in which it''s
    stored. All operations of this kind are Transformations and are easily accessible.

    Grace knows lots of transformations - the list includes axis, working, averages,
    and plot types. The official tutorial is still worth reading "Creating settings
    within Grace", which explains several ways to create plots. Another way to save
    source data is to create a link to a pipe - that is, to the standard output of
    other programs. Grace detects changes in the source file and redraws the graphs
    that depend on them.


    +   * Grace is still in ''80-style widgets, but can plot and analyze them faster
    than you can click.


    what about the output? A single Grace project can manage an unlimited number of
    graphs and curves in each, with up to 256 colors and 32 full patterns. It is easy
    to understand, and you can add or remove any object in the Object pane. Arrow
    and Zoom buttons make it easy to navigate around especially when studying specific
    parts of an act.

    G handles general configuration and work management. Files of the second type
    contain all the information you need to recreate a plot, graph or set of graphs.
    You then reload across different plots.


    The documentation is pretty good. To learn more about Grace, browse the manual
    or the website on our server. Alternatively, with the many examples available,
    reachable with a few clicks in the menu bar.


    # The look and feel of Grace really sets it apart from its competitors.


    ![](img/ddd273149103130953199fe3b160343f_30_1.png)


    # LINX Verdict


    Grace

    Version: 5.1.22

    Price: grace-weitzmann.geom.at

    Price: under GPL


    +   * A powerful and statistical analyst with a steep learning curve.


    # Rating 8/10


