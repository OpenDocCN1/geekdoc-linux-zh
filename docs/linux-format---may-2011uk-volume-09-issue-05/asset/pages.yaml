    # # Split future for framework to Qt


    Nokia sells commercial of framework to Digia.


    Nokia has announced that it will sell responsibility for the commercially licensed
    Sebastian Qt framework to Digia. Sebastian Nystrom, who manages Nokia''s investment
    in Meego, said gained experience working with Qt and employed hundreds of developers
    to work on it. "Digia is continuing to grow its opportunities as well as contribute
    to our overall LGPL and commercial community," he said.


    The move marks a further departure from the Finnish manufacturer''s open source
    strategy since it reached a deal with Microsoft to use the Windows Phone platform.
    Nokia had acquired Qt with the intention of making Qt''s platform for developers
    to work on the Symbian and Meego platforms. Nokia has shifted away from this area
    of business since that it would use Microsoft''s closed system. They could still
    under Nokia''s guidance to focus solely on Windows Phone and this confirms that
    Qt is no priority.


    Horius Schumacher, KDE developer, said there was no cause for concern, thanks
    to Nokia for releasing Qt under the LGPL. He said the software would be stronger
    if it moved towards openness of the project. "We are working with our partners
    to speed up this process and make open governance a reality. In the meantime,
    we see Nokia''s commitment to Qt as well as their continued support of KDE," he
    said.


    # Where does Meego go?


    KDE, he said, was also in good with the Plasma framework providing opportunities
    to build new platforms, as set top boxes, in-car systems and tables


    Nokia is not yet abandoning its open source strategy entirely. The attempt by
    Nokia to oversee the release of Nokia''s first Meego handset last year suggests
    that it may be seen as a Nokia strategy for those who don''t want a Nokia phone.


    One consequence of Meego''s failure is the lack of available resources, which
    has led to an "architectural adjustment", according to developers on the project
    saw


