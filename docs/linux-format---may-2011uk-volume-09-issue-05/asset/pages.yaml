  md: '# Roundup Graphical plotters


    # Jgnuplot


    Taming Jgnuplot with Java? It''s odd, but powerful.


    Jgnuplot (Jgp for short) is a Java Interface to Jgnuplot for 2D and 3D graphs.
    If Jgnuplot can''t do without massaging, you might be better off with another
    program. At the same time, Jgnuplot-java means you can use with the latter all
    the vast online documentation for the former. For the same reason, what you do
    can be reused or integrated in shell scripts that plot data automatically.


    By default, the plots generated by Jgp have a Spartan look, but you can set all
    the Jgnuplot options you want to embellish and document them.


    ![](img/ddd273149103130953199fe3b160343f_31_0.png)


    The Jgnuplot has four tabs, Datasets, Labels, Variables and Add Plot Commands,
    a console similar to one in Grace. The first tab lists all the functions that
    have already defined and are available for plotting. You can define many data
    structures that are as flexible as Grace comes with. Click the Add button or go
    to Edit on the pop-up panel, then if the next data is an external file, decide
    the Jgnuplot type of data. This can be a line, histogram or scatter of numbers
    in any other format supported by Jgnuplot.


    Jgnuplot is beautiful, and Java makes it easier!


    A variable detail, drawn with bones whereas I''m another a mathematical function


    The second column for the ''Y axis'' can update a plot automatically as soon as
    the corresponding data file changes, but you must activate this by triggering
    the corresponding radio button.


    Once you''ve edited your data sets, you can easily alter the order in the graph
    and select them: with one mouse and a click, then move it up or down to change
    the corresponding bands. Jgnuplot draws the graphs in the order where you want,
    one after another, so choosing the wrong order can make the final plot look less
    realistic.


    # Mixed sources


    Jgnuplot allows multiple data sources in the same plot at all will. It enables
    you to choose between a data file and a generic mathematical function with two
    radio buttons: one opens the Edit window to update the plot, the other resets
    those to the ''File source'' value. This selection lets you define values such
    as 2=column numbers in the Datasets file. It is as if you''re playing with a file
    and a function simultaneously, where you can define an undefined variable. For
    x.


