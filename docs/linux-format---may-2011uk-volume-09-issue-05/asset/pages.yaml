    # 1 Check for conflicts


    Go to Manage Records > Recordings to see what will be recorded. The red highlight
    and the message at the top-right show all conflicts. If there is a list, it means
    that MythTV is recording a later showing of that (you can see it further down)
    to avoid a conflict.


    # 3 Sort your priorities


    The Scheduling Options for a record have a priority setting. This won''t avoid
    conflicts, but helps MythTV decide which program to record and if you find the
    recording that the Champions League game is to conflict with your favorites.


    # 4 Make your rules


    You don''t have to use the programme to set up recordings - you can also use the
