    \ the spirit of making things work, Xdialog accepts all types of input and just\
    \ ignores them, so without any configuration. (Hint: while it's a start of the\
    \ script to hold the value of the command to use)\n\nSo could use our code here:\n\
    \n```\nresult=1\ndialog --select --15 25 5 2\n1-6\ncp $result $ \nset ? = 0 6\
