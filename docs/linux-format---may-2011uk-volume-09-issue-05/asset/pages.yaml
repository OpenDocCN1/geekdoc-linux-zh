    ![](img/ddd273149103130953199fe3b160343f_41_6.png)


    ![](img/ddd273149103130953199fe3b160343f_41_7.png)


    # 2 Start recording


    We haven''t recorded anything yet, so go to Manage Records > Scheduling > Program
    Guide, where use the buttons below to show the list of programs recording their
    status. Use the cursor keys to select the program you want to record. If you press
    Enter, you''ll be shown the following screen...


    # 3 Record a series


    ...where you can set recording options. The option is Record At Time On Channel.
    In other words, a series record will record on every channel. This helps MythTV
    with scheduling, as it creates a record for each channel. MythTV shows one of
    each episode by default, unless you edit the Options section of the schedule.


