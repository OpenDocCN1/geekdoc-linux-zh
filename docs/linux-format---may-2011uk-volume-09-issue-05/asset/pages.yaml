  md: '# Graphical plotters Roundup


    # KAlgebra


    # A capable maths assistant brought to you by KDE.


    Just as J may be (partially) defined as a way to use Gnuplot and commands being
    forced to look at them more closely, KAlgebra could be seen as a non-intrusive
    way to learn and use MathML, the Mathematical Markup (www.w3.org). KAlgebra focuses
    on math, rather than plotting and analyzing data. Being a Qt/KDE application,
    it blends into any Gnu/Linux distribution much more than Grace, or for matter.
    Using any of the tutorials available online, this will help you to become a KAlgebra
    user. However, quoting the program''s manual: It''s not actually necessary to
    know Math to use KAlgebra. You can define functions as you like writing them on
    paper.


    +   - When it 3D plots, KAlgebra lets you rotate and look at details from any
    angle.


    ![](img/ddd273149103130953199fe3b160343f_32_0.png)


    Besides, one of strengths of KAlgebra is its extensive and early documentation.
    The Help menu contains links to a complete manual, while the Dictionary tab of
    the main window contains searchable list of all the and logical operations supported
    by KAlgebra Each operator is defined by a description, a list of the parameters
    it accepts, the ways it''s called in algebra and a sample graph.


    # Math creation


    The main KAlgebra menu and the rest of its windows have the same structure, in
    that they both have Console, 2D Graph and 3D Graph as their main components. Tabs
    and menu are associated in an intuitive, self-documenting way.


    +   - The 2D interface of KAlgebra is easy to use, with its multigraph and dynamic
    preview.


    ![](img/ddd273149103130953199fe3b160343f_32_1.png)


    The panes associated with each tab places where you do things and show the drop-down
    menu gives access to the actions that you can perform in the tab, which has the
    same name. For the example, the pane is special for algebra, KAlgebra can issue
    commands and just some make calculations. The layer can, you can change its colors
    and size by double-clicking on them, and then show the result of the previous
    calculation.


    All of this will be lost when you closed KAlgebra, but fear it''s possible to
    save everything you want to execute all the commands in a previous session without
    having them. These files are also saved. The Export function in the Console menu
    shows what you have typed as an HTML image, ready for print or online publication.
    Enough of explanations: the list combines two KAlgebra windows to show you what
    you can do in its 2D Graph part. The real plots stay in the left section of the
    tab, you can zoom in out and display things as you move the mouse over the curves.
    The right pane is divided into four tabs. In order to see, you need to


    ![](img/ddd273149103130953199fe3b160343f_32_2.png)


    start from the one called Alge, type your function in the top, choose its colour
    and enjoy the dynamic preview. When you click on it, the function will be drawn
    in the main area. Repeat until you''ve added all the functions you want to draw
    the graph, each of them in a different colour. All colours and functions are listed
    in two tabs. The last tab, called Info, is used to show you the coordinates of
    the math that will be visible in the main graph


    The 3D graph part simpler than the 2D one. KAlgebra currently supports only in
    3D with the z=(x,y) form. Within these, it''s a place to use after. You can draw
    the graph, zoom in out and rotate it also using the arrow keys. This allows you
    to place objects of them, as you can use


