    >> **Glasgow (ScotLUG)** 19:30, every last Thursday of the month at the University
    of Strathclyde

    >> **Edinburgh (EdLUG)** 19:30, first Tuesday of the month at the Edinburgh Training
    and Conference Venue, St Mary’s Street

    >> **Newcastle (Tyneside)** midday, first Saturday of the month at the Discovery
    Museum, Quayside Square

    >> **Hull 20:30**, first Tuesday of the month at Old May Grey, Cottingham Road

    >> **Manchester (ManLUG)** 19:00, third Wednesday of the month at 36-40 Edge Street

    >> **Birmingham (BLUG)**, third Thursday of the month at Aston Science Park, Faway,
    Holt Street

    >> **Cardiff (SWLUG)** 19:00, the first of every month at the Central Bus Station,
    Victoria Street

    >> **Swindon (SWLUG)** 21:00, second Monday of the month at the Sir Daniel Arms,
    Fleet Street

    >> **Milton Keynes (MKLUG)** 20:00, last Tuesday of the month at Weetherspoons,
    Boutique Square

    Find LUGs online at www.lug.org.uk


    # Starting afresh


    Events can kan new derees...


    es Phrounder dropped us a line to all us up at an event held at LabMan in Manchester
    in 2017. Titled the Ubuntu Group and the Linux kernel, and organised by a group
    called Okay...Computer, the event kicked off with a short background to the future
    of free software. This event was simple and I’ve been using it for years.


    After hands-on, beginner-friendly events grant us to: a really pretty way to learn
    Ubuntu discs and we really enjoyed this event. It provided a great overview of
    what we take for granted – how to use our favourite operating system. It was a
    lot and I’ve been using Linux for 10 years!


    Attendees chance to see how run through the installation process for Ubuntu on
    machines (and in an awesome way; they could keep the machines at the end of the
    event!). This was followed by some presentations explaining how to install software,
    organise music and edit documents – typical tasks that-to-day users want to accomplish.
    Those present had the opportunity to choose from long-term Linux fixes, us


    > Geeks newbies to understand Linux – a great introduction to the OS.


    # Community news


    Nottingham news

    The Nottingham Linux User Group in touch with an announcement from the Midlands:
    “NotLUG” (Nottingham) has joined up with the Fellows, Melton and Clayton pub in
    the city’s waterfront:

    ’re a friendly, informal bunch of geeks with an interest in all things GNU/Linux
    and we. We meet at 7:30 on Wednesdays twice a month for a coffee and social-discursion.


    Thankfully, we have lovers, so we can keep the talks venue next talk will take
    place on 6 April 2011 and will be about Computer Futures. For that we will use
    Linux in Space,, Pretty Times with Git, GPS, Application Analysis, Argventinius,
    Linux and others. See http://nottingham.lug.org.uk All welcome!


    Thanks, Nottingham. If any of other LUGs want to get in touch with updates for
    this page, drop


    us a line at mike.saunders@futurenet.com – please be in mind that we do the slightly
    convoluted process of turning electronic messages into actual free material. It
    is best to give plenty of time before an event. If you need to make a quick announcement
    about an event or deat for your LUG, find our forums at www.linuxformat.com –
    we have regulars from around the world who’d be interested in turning up.


    > Nottingham: it has a castle on a hill. A really old pub.'
