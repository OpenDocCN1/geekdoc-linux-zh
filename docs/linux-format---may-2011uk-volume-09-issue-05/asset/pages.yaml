  md: "# # Tutorial Bash\n\nThe shortcomings of notification system as a measure of\
    \ user interaction are obvious. While it makes it ready to send a message to the\
    \ desktop user, there's limited scope to have them provide feedback to a running\
    \ program.\n\nMost of what we've covered before, line this is the tricky bit.\
    \ The destination variable is set using backticks expression – that Bash will\
    \ execute the command inside the backticks (using the key above the UK keyboard)\
    \ and replace the output with what it generates. It would be easier to understand\
    \ if there wasn't a backtick complicating things.\n\nBecause of the Unix philosophy\
    \ of creating separate, tools for very specific tasks and binding them together\
    \ to make complex tasks possible, you can do anything. Few will realize this,\
    \ mainly because they don't venture to the scary command line.\n\nFirst to be\
    \ aware that a dialog is a command. It is followed by a switch that indicates\
    \ the type of dialog and the parameters that go with it. In this case, we're using\
