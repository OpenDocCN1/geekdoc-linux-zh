    # Parallel Script\n\nI'd like to proceed a shell script sequentially until I can\
    \ run one point where I have four processes, in order to make the processes run\
    \ in parallel simultaneously.\n\nAdditionally, if I need to add conditional function\
    \ to the original script, in a certain argument. I might need to add some start\
    \ scripts between these stages of the script.\n\nAfter using Linux 1.0.4, I found\
    \ the use of the script to spawn processes using something like & 1. I need the\
    \ processes to post a unique value to a file so I can have a reference to the\
    \ processes if I have completed, and if they aren't all done. I'll use the sleep\
    \ command to wait a few minutes to hold up the process until all units are completed.\
    \ Each of the processes takes about four hours.\n\nIf the stop script fails, then\
    \ the processes are still running. If you create a file for each one, you can\
    \ delete them if they are failing, creating some new values for the task\n\nfor\
    \ (1-4):\n\n```\ninitiatewait -c /tmp/myprocess/\n```\n\nIn the /tmp/myprocess/\
    \ directory in which the files will be created, you can use initiatewait to check\
    \ the status of the process, rather than the directory itself.\n\ninitiatewait\
    \ will wait for a file event and then exit. The loop runs four times, so when\
    \ all four processes have been completed a file list exists, regardless of the\
    \ order in which they appear. Your script should ideally exit before the processes\
    \ begin-\n\nThere is a better way to do this without constantly checking a file\
    \ for modifications. A kernel of modifications for watching changes in a file\
    \ or the directory-tools package\n\nYou will need to check that the processes\
    \ executed successfully. You could do this by writing a script to create the file\
    \ and then checking that each one is created using sleep to ensure success. This\
    \ is a much more effective method.\n\nYou must be able to modify the individual\
    \ processes to create the file, though it might be hard. If the file is not created,\
    \ you can start them in a way that changes the direction of the kernel\n\n```\n\
    (process) /tmp/myprocess/1 &\n```\n\n```\n(process) /tmp/myprocess/2 & \n(process)\
    \ /tmp/myprocess/3 & \n(process) /tmp/myprocess/4 &\n```\n\nThe first one created\
    \ will succeed, if any of the processes failed. The second creates a file if process1\
    \ fails, enabling to check that all processes succeeded before continuing.\n\n\
