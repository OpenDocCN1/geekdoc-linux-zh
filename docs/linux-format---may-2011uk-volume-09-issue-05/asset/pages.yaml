    # Put together a release plan


    A primary component in successful projects is not only what everyone will work
    on and achieve, but also when the actions need to be completed. For this reason
    it is highly recommended that you put together a calendar of dates (release plan)
    that highlights these deadlines throughout the schedule.


    like this (for our purposes, here is a simplified list of dates):


    +   * Jan 5 Start researching venues

    * Jan 20 Final venue

    * Feb 22 Review

    * Feb 11 Announcement call for papers

    * Feb 25 Start reaching out to speakers

    * Mar 11 Review

