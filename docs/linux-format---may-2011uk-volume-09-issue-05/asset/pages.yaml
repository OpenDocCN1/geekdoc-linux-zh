    # # Rescue over your LAN


    The rescue systems we''ve looked so far all have limitations to their capability
    and ease of use, and (for some) in amount of money you would have to build and
    maintain.


    Now let''s use magic wand and reveal a system that requires no promises and provides
    (every time you want it—and there is when you need it!) This rescue system is
    a Linux distro located on a separate machine, which could be connected to the
    distressed one over a local network.


    +   -3 Machines


    Rescue the distressed machine providing rescue-related services.


    +   - Linux systems (kernel plus filesystem)


    Passive distressed Linux does not need to be rescued. Because its filesystem isn''t
    running, a copy of it is enough to recover the data.


    +   - A Linux server that provides network and other services


    Active Linux house is actively running on the distressed machine


    On the distressed machine, passive''s Linux is running in combination with active
    kernel. In this setup, we distinguish between kernel and filesystem, and come
    from different sources to perform the rescue. Why? Because to be able to mount
    its filesystem over the network, and furthermore benefit to have the features
    of the distressed machine, in particular the network adapter.


    The rescue machine holds both one or two systems, but they both must be complete
    systems, and both filesystems must be on different disk partitions. A rescue server
    is running on the distressed machine, which has a DHCP server for assigning IP
    addresses and identifying the PXE bootloader; a TFTP server for providing the
    kernel image and an NFS server for the root filesystem.


    # The distressed machine


    The distressed machine needs at least one network interface controller (NIC) that
    has PXE boot capability—the NIC can obtain an IP address and then download from
    the DHCP server. If not, the BIOS will boot the next device in the list of boot
    devices. A PXE machine might have some observe. To select, device, and boot for
    an animation of a spinning line. There are alternatives (post-BIOS), such as PXE
    (http://org), but they require more work to set up, and need one extra step to
    boot from a floppy or soft disk.


    The rescue machine requires configuration for the network interface and mounting
    the root filesystem over NFS built-in. This includes the network interface driver,
    NFS client, network configuration and filesystem. The kernel parameters should
    be set to TO CONFIG_IP_PNMP, CONFIG_IP_PMP; DHCP, driver for the NIC (one - only
    one Ethernet driver is used, and) in order to be


    control which one is used for PXE boot. You also need to set TO either CONFIG_EXT3_FS
    or CONFIG_EXT4_FS (according to which type root filesystem is), CONFIG_NFS_FS
    and CONFIG_ROOT_FS


    After generating this, copy it into an image where it is booted by Plinux (the
    Network Boot Protocol).


    # Server system


    +   - Plinux is part of the Syslinux package—http://syslinux.org/wiki/index/PLINUX.
    The only executable needed from Plinux is the rescue server. Some machines might
    require a different version now—so we use Plinux version 0.40 in the ISO. If you
    need it


    +   - DHCP server (dhcp)


    +   - TFTP server


