    \ and values. So what's all the menu jumpbar? After joining it the original authors\
    \ decided to send the result to STDOUT.\n\nGetting input for scripting is nothing\
    \ new. In Bash shell, you can't do quite simply\n\n```\n-p \"How great is this?\"\
    \ --input echo I1 agree it is simple\n```\n\n# Xdialog allows few extra options\
