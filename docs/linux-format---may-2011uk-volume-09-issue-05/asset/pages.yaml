    # ## Plan the work


    The next step is to divide each set of actions that assigned to different members
    of the team and document these actions in a public file. This could be as simple
    as a wiki or complex as a project management tool. The primary goal is to make
    sure each action can be broken into a reasonably simple set of actions manageable
    chunks.


    When putting together these actions, we recommend that you use the rule of thumb
    of action not taking more than half a day to complete. Because most of your team
    will be volunteers and if they''re not to do them. If the actions are smaller
    and can be completed in after work, then they''re more likely to follow through.


    By the end of this step, you should have a set of objectives and document containing
    all of the actions. You''re now in a position where all of the work is agreed
