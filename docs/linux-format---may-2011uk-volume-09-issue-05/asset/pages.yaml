  md: '# More software DVD


    # CherryTree, HomeBank


    We all keep notes in one form or another: bits of paper next to the telephone.
    Jottings on a calendar or a file on the desktop. The problem is, that isn''t an
    efficient way of keeping track of information. Then you can space up with the
    notes, and it becomes hard to distinguish the important information.


    CherryTree aims to solve all of this by being flexible. Instead of being one big
    file, it is a collection of documents that can be linked like HTML pages. You
    can spice up with text formatting and images so that important information stands
    out. It''s like having your own wiki and a website, all one might look a bit complicated
    at first glance, after a time you would wonder ever lived without


    Another notable tool is HomeBank, a flexible financial program that we''ve seen
    growing steadily in the last few years. It enables you to keep track of your income
    and outgo, creating graphs and charts to look at your financial situation. There
    are other finance programs for Linux, but HomeBank stands out for having free
    documentation that explains how to use all the features of the program with screenshots.
    You can find the source code on the DVD - extract the .tar.gz file and read the
    INSTALL file for a guide to compiling it.


