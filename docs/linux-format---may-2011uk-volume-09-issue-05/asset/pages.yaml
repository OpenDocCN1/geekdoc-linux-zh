    The plot above shows what we got after drawing in Jgnuplot. It can be saved as
    PostScript or EPS script files. The red and green lines come from two different
    ASCII files (but they could also have come from a mathematical function y=x^2+5cosx).


    Jgnuplot saves all the instructions that you gives it by entering and entering
    values in the plot file called Jgnuplot. The same file directory is where the
    program is in. You''ll be happy with your graphs, you can direct them anywhere
    and use it to generate the data diagrams, diagrammatically, from a shell script.


    of the panel. The current data is an ASCII file, you must specify in the same
