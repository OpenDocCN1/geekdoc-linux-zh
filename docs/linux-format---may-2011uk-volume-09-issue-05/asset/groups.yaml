    # 你的操作系统需要帮助


    ## 第二步：设置方面的帮助


    当你的思绪回到初次使用 Linux 的时候，它有时会让你很困惑，不是吗？如果你当时能有一个像现在这样平易近人的专家来帮助像现在的你这样的人，那你就已经拥有它了。


    你能看看这里的“匿名企鹅”（Anonymous Penguin）是不是哪里出什么错了吗？他为一个可能需要帮助的人修复了 Linux，并让他们自己修复。相比之下，像“匿名企鹅”这样的朋友能够展示，他把
    Linux 给了[转换]（我个人最喜欢的词）——在我为他们安装并配置之后，他们一直运行得很好。


    以下是一位 TuxRadar 听众采取的 Linux 处理方法，他无疑不想告诉我们他的名字：


    - 上次，我给家成员分发了一个 Ubuntu 发行版。给他们一本示例书，然后是 Genius。它运行起来很容易，偶尔崩溃，没问题，满足你的需求。但我仍然在他们的机器上支持
    Windows。

    - “他们声称完全没问题并给我打电话——而我使用 Ubuntu 没有任何问题。*听听我的建议*” —— 匿名企鹅


    互联网上、电视里以及我们的图书馆里（目前）有太多的知识了，我们都应该拥有天才。我们还没有老并不意味着没有足够的时间给别人安装发行版，或使用 Linux 并让它自行解决，因为它有自己自己的内部逻辑，这可能会让初学者感到困惑，所以如果你想让你新版本能够转换并腾飞，而且你真的需要帮助，你可能需要帮助他们。


    每个人都在工作中感受到过这一点，或者在命令行中，或者在引导普通用户和 root 之间的区别。这些东西你会用到，但演示 Ubuntu 默认格式花费的时间要少得多，而且不会让你在老板面前显得很尴尬。


    # 文件格式


    你不需要转换新的操作系统或不同的软件——这可能会引入其他问题：


    > 与其从 MS 迁移到 Word，使用 Office.org：Linux（泛而言之）有更多理由。人们发现 ODT 文档比“home and c”更让人困惑
    —— Kevin Foley


    如果问题格式是 ODT，现在使用 Office.org：Linux 将意味着成千上万个远超办公使用需求的人其启动速度非常缓慢。它可以加载和保存所有的微软文件，所以你可以像处理
    DOCX 一样处理 Office 文档，并且下次当 Linux 中加载某些内容时它会完美运行。遗憾的是，反过来不行。如果你在这里花费时间处理一个重要的文件……


    # 播放媒体


    如果你使用 Linux 有了一段时间，你可能已经知道媒体播放器的新奇之处了，但如果你正在为 Linux 设置系统，缺乏音乐播放器可能是他们遇到的绊脚石。


    Rhythmbox（不，如果你知道的话）会在那里，Ubuntu 会切换到（香蕉音乐播放器）。如果是这样，它并不完全符合新 Linux 用户路径的初级精神：一旦你使用
    MP3 歌曲，Ubuntu 就会切换到你的音乐，而你可以享受购买 MP3。Ubuntu 的母公司 Canonical 如果你从 Amazon 或 iTunes
    购买 MP3 就会赚钱，这意味着对于用户来说，听 MP3 就是……


    Linux 安装限制了你是否启动新系统，但直到那时新用户会想要：让更多人去探索新桌面，而不是它们的差异。一个直观的 Ubuntu 会在你运行第一个桌面播放器时询问你是否想要安装
    MP3 代码。


    对于我们这些创作者来说，仅仅给别人提供选择是不够的。我们需要确保他们有充分的理由来选择。


    > 如果你第一次在 Ubuntu 中运行时安装 MP3 代码，Rhythmbox 会提供服务 —— 其他其他发行版在安装时也是这样。


    # 你的操作系统需要你


    仅仅为了演示进入会议却发现文件在 PowerPoint 中无法打开，你会看起来很傻，并诅咒自己见到 Linux 的那一天。


    如果你尝试向别人介绍 Linux，你可以通过 OpenOffice 的默认设置来防止这种情况。


