    # 布朗博士的管理杂记


    # 按计划运行


    Cron：让我们仔细观察 Cron 和 Anacron 中配置文件的层级，这是一个让你能够调度定期任务的因素。


    这个月，我为你们准备了一份回归基础的教程——同时回顾了我之前写过的 27 篇关于 Administeria 的文章。我曾让它们都大为观止。


    这三个工具（Cron 和 Anacron）允许你安排任务在特定时间发生。Cron 和 Anacron 是守护进程——它们在后台运行，并在需要时唤醒。两者都可以用于调度需要定期间隔运行的任务。这些名字源自希腊神克罗诺斯（Chronos）。chronology（年代学）、chronometer（计时器）和
    chronicle（编年史）等词的根是一个用于在特定时间安排一次性执行任务的命令行工具。即使是这个工具也有一个名为 cron 的关联守护进程，负责在适当时间到达时执行任务。Cron
    由 Paul Wise 编写，他也因 Binding（一个 DNS 服务器）而闻名——还有人（更具怀疑性）声称他掌握见过的由单一作者编写的最安全系统的密钥。


    这个月我关注 Cron（以及一点 Anacron）。我一直在尝试语法，并发现某些 Cron 任务运行得比用户级 cron 更好。你在这里指定的任何任务都可以以
    root 身份运行。这些任务定义在 `/etc/crontab` 中，尽管在大多数发行版中，存在二级文件，可以在其中设置任务定义。


    ```

    SHELL=/bin/sh

    PATH=/bin:/usr/bin:/usr/sbin/bin

    MAILTO=root

    ```


    | 间隔 | 命令 | 说明 |

    | :--- | :--- | :--- |

    | 1 | cron.daily | run-parts /etc/cron.daily |

    | 7 | cron.weekly | run-parts /etc/cron.weekly |

    | 30 | cron.monthly | run-parts /etc/cron.monthly |


    - 运行命令的标识符

    - 从任务执行失败到实际运行之间的延迟（分钟）

    - 要使用的 crontab

    - RHEL 说明中的 `/etc/crontab` 文件。注意第二个字段的语法，它防止了所有任务同时发生。


    `&&` 和 `|` 运算符在 shell 脚本中作为编写/测试脚本的简写。我是这样使用它们的：


    ```

    grep -q "root" /etc/crontab && echo "found"

    ```


    第一个命令运行，如果它失败（退出状态为 1），则会运行第二个命令（grep）。


    ```

    grep -q "root" /etc/crontab || echo "not found"

    ```


    另一种测试方法如下：


    ```bash

    if grep -q "root" /etc/crontab; then

    echo "found"; else

    echo "not found"

    fi

    ```


    但这样做需要四行而不是两行，而且正如我们所知，字符越少越好。


    对于 Cron 和 Anacron 任务，正如本文讨论的，请使用：


    ```

    test -x /etc/anacrontab && anacron -run-parts /etc/anacrontab

    ```


    仅当未发现 Anacron 存在时使用。


    这些结构用于脚本中。我正亲自现身，向你们展示一个我使用这种“类别”的 cron 编写的小程序。


    # 沿 Anacron 之行


    在图中（见 4.02），你会看到 Cron 运行 `/etc/crontab` 目录和 `/etc/cron.daily run-parts`——它运行目录中的所有文件并执行其中的命令。这些命令也是
    shell 脚本，但我需要解释一下为什么你不能直接将脚本复制到这些不同的 cron 版本中。它们在时间文件的头部中被标记为 `@daily` 或 `@weekly`。


    让 Linux 发行版中的 Cron 变得复杂的一个因素是竞争性设施 Anacron 的出现。Cron 旨在处理那些持续运行的任务。例如，每日 cron 任务每天
    6:25 运行。除非 cron 在那时开启，否则任务就不会运行。如果机器关闭了，那么直到……解决方案是确保每日、每周和每月任务每天都会发生，前提是 cron
    至少在某天、某周或某月运行过。


    ```

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/bin:/usr/bin:/sbin

    ```


