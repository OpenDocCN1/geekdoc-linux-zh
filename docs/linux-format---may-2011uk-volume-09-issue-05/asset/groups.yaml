    ## OpenSUSE 11.4


    The distro''s fans have waited with bated breath for its first release after the
    sale of Novell. Mayank Sharma is happy to report that it''s business as usual.


    ### In brief...


    - One of the most popular community distros, just like Ubuntu and Fedora.


    After the sale last year, there was a lot of uncertainty about the Novell-sponsored
    distro future. OpenSUSE has an unusual eight-month cycle, unlike the six months
    between releases. Although as a community distro, many wondered there would be
    more releases following the acquisition of its main sponsor, but like clockwork,
    the next transition has shown up on schedule.


    The distro is brimming with features, more visible than others, and strikes a
    balance between stability and bleeding-edge modernity by including well-tested,
    stable software and upcoming new releases.


    OpenSUSE 11.4 is an almost-install-only distro, and there are also separate ISOs
    for KDE. The graphical installer offers complex options that experts can use to
    make better default selections, which will guide beginners through the process.
    Such area is particularly, offering an LVM-partitioning scheme by default and
    can be tweaked by veterans to install their preferred disk layout.


