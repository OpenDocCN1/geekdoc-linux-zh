    \n等待 Firefox 4\n\n在最近的 LTS 版本中发现 40 个安全漏洞后，建议进行更新。\n\nNick Vick\n\n> 本月\n我一直期待发布\
    \ Firefox 4\n\n![](img/ddd273149103130953199fe3b160343f_9_0.png)\n\nA4 以进行彻底测试：我已经在测试版上玩了一段时间了，但评论还没准备好——因为软件本身也还没准备好。开发者更改了自设的发布期限，决定再发布几个版本，以消除几个致命性的漏洞。\n\
    \n运行某些 Ubuntu 版本的用户可能面临攻击风险，因为人们在随分发版发送的内核中发现了 40 个独立的漏洞。这些漏洞影响了最新的长期支持版本——10.04——可以通过升级到内核\
    \ 2.6.35 来修复，这可以通过标准的更新管理器实现。对于包括 Ubuntu、Kubuntu 和 Xubuntu 在的版本也是如此。\n\n在软件世界，我们习惯了在东西还没准备好时就发布；我们称之为发布的自由。在2011\
    \ 年，我们计划不仅发布 Firefox 4，还有 5 甚至 Firefox 7。这种理论似乎是浏览器世界是一个瞬息万变的时代，软件必须通过不断追求最新功能来竞争生存，并每月发布重大版本。\n\
    \nCanonical 表示，由于内核接口的更改，第三方模块可能需要重新编译，但对于大多数用户来说，这个过程应该是自动的。\n\n漏洞的范围从 TTY 驱动程序中的罕见情况（可能允许攻击者通过崩溃受影响的计算机发起拒绝服务攻击）到\
    \ NFSv4 中的写入请求，可能允许\n\n或者 Google Chrome 已获取了浏览器世界自……自从 Firefox 本身发布以来最令人兴奋的事件。它目前的版本是\
    \ 9.0.107——现在市场上已经有了一个响亮的名字。但最近，这并不重要。Chrome 更新非常频繁。频繁到至于他们甚至懒得进行大张旗鼓的蓝色发布，以至于实际版本号很少被提及。\n\
    \n- 某些机器需要更新以保持安全。\n\n# 嵌入式 Linux\n\n专家使用了 in-touch 和 API，使其能够从汽车上的 500 个传感器读取数据，并将问题回传给修理厂设施。\n\
    \n这些型号已经发布，应该让多个用户共享单个插座的功率变得更好。底座是\n\n也许数字并不是重点。也许重点在于提供实时的体验。也许与其通过一年内可以发布多少个版本来逃避，Firefox\
    \ 团队必须关注功能以及它们在交付之前能获得什么。我不会说我不想在几个月后举办发布派对，但保持安全并交付可用性更为重要。\n\n专家使用了一种新的 10 英寸平板电脑。这台基于\
    \ Tegra 2 的设备具有 1024 x 600 分辨率的多触控屏，并配备了 microSD 卡槽。底座的加入使得能够在 HDTV 上播放视频，并支持存储设备和键盘。\n\
    \n一项 RBC 的研究显示，iPad 的销售额超过了平板电脑市场上的其他设备 24 倍——这让安卓手机的销量显得形见肘。大部分销售额将通过廉价的低端设备产生，但像三星\
    \ Galaxy HTC Flyer 和摩托罗等高端机器也会产生影响。\n\nSaab 为其高——构建了一个新的基于 Android 的娱乐和信息系统，包含在内\n\
    \n- Olivetti 的 iPad 具有使用自定义底座的功能。\n\nNick 是 LXF 这一艘配置船的独腿船长，他现在住在他的脑子里。\n\n10\
    \ | LXF144 2011年5月\n\nwww.linuxformat.com\n\n# 桌面\n\n# 新闻快报\n\n# HP 将引领桌面潮流吗？\n\
    \nHP 计划在所有新机器上提供 Windows Android。\n\n惠尔公司首席执行官 Leo Apheward 揭示了在所有未来 HP 电脑中包含基于\
    \ Linux 的操作系统的计划。我们将立即推动 HP 成为 Linux 桌面的领导者，并让数百万用户接触非 Windows 系统。他表示，明年每台机器都将具有\
    \ Windows 选项，这有助于在印度等新兴市场增长。目前只有 5000 个应用程序，而 Android 有 250000 个。\n\n如果反响良好，它可以通过降低价格竞争。\n\
    \n- HP Web 可能来自平板电脑。\n\n# 超计算\n\n# Nvidia 开启超级计算之门\n\nNvidia 凭借低端市场的成功开启超级计算。\n\
    \n在显卡行业产生影响后，最近通过其 Tegra 芯片进入低端市场，Nvidia 准备突破边界成为超级计算参与者。在消费电子展上，首席执行官黄振表示，公司正在开发一种适用于传统运行\
    \ Linux 的高性能机器。\n\n他表示，公司在性能和低功耗负载方面的专业知识将使其能够扩展到当前最快机器之外。\n\nNvidia 参与了美国国防高级计划署的一个项目，该公司称这将带来一台比今天最强机器快\
    \ 1000 倍的计算机。公司声称该机器可以在六年内准备好。\n\n- 黄振表示超级计算对 Nvidia 来说是一个巨大的机会。\n\n# 法律\n\n#\
    \ 真理的缓慢进展\n\n调查员告诉 SCO 的说法是有根据的。\n\n他在 SCO 案件（一家小型 Linux 分发商起诉 IBM 窃取代码并插入 Linux）中被公司聘请的新调查员告知没有案可诉。\n\
    \nBob Zebman，一位“软件开发者”，于2004 年被 SCO 聘用对 Linux 和 Linux 源代码进行初步调查。由于结果与公司的预期不符，Zebman\
    \ 说他被“打发了”，并且在写完一本书之前没有提到这个问题。\n\n- SCO 对 Linux 内核的分析证明是徒劳的。\n\n发现相似的点\n\nwww.taxardar.com\n\
    \n2011年5月 LXF144 | 11\n\n"
