  mdcn: "\n\n# Zeitgeist 究竟是怎么回事\n\n![](img/ddd273149103130953199fe3b160343f_62_0.png)\n\
    \n# 一切都记录在一个地方 \n\n# 文档\n\n# SKYPE 视频通话\n\n# 消息\n\n# 数据\n\n# 应用程序\n\n# 网页\n\n\
    两个名为 `nocturne` 的文件都是关于肖邦的，即使你甚至不知道它们的存在。\n\n- * 与 Zeitgeist 不同，...它关注的是你的*活动*，而不是桌面的内部特征。Zeitgeist\
    \ 只注意到你实际使用或执行的文档或操作，因此它的任务就完成了。而 Nepomuk 则不然。\n\n- * KDE 有等同 Zeitgeist 的东西吗？不，完全没有。为什么会发生这种情况？归功于我刚才提到的架构。Zeitgeist\
    \ 真的能与所有 KDE 应用程序通信吗？为了访问各自的数据库，Nepomuk 和 Zeitgeist 都没有计划隐藏对方的领域！尽管如此，它们有计划尽可能地交换数据。这将产生一个可以回答此类问题的\
    \ Linux 桌面，例如：“收听次数最多的歌曲和文档是哪些？”这些答案基于文件的未来以及它何时以及如何被使用。\n\n- * Zeitgeist 还有什么计划？支持对\
    \ Google Docs、Flicer 和 Launchpad 等地方在线文档活动跟踪的计划正在进行中，因此将与 Ubuntu 集成。\n\n- * 隐私问题呢？我真的需要保留这么多元数据以及对我行为的整齐格式记录吗？不，这没有必要。你可以以访问浏览器历史记录（概念上来说）访问\
    \ Zeitgeist 数据库。保留还是取消某些事件取决于你。\n\n- * 我可以如何了解更多信息？项目主页是 http://zeitgeist-project.com/。如果你想了解更多关于默认\
    \ Zeitgeist 客户端的信息，请加入 http://line.org/action/GnomeActivity.journal 的活动日志。\n\n\
    Zeitgeist 能做的其他示例在此处。关于未来 Zeitgeist 与 KDE 和 Nepomuk 集成可能是什么样子的参考资料，请参阅博客文章：http://elic.zeitgeist.org/2010/11/zeitgeist-coming-to-life\n\
    \nwww.zeitgeist.com\n\n2011年5月 LXF144\n\n# 布朗博士的行政\n\n# 布朗博士的行政\n\n克里斯·布朗博士 (Dr\
    \ Chris Brown)\n\n今天提供 Linux 培训、授权和咨询。他发现他的 Unity 管理博士学位对这方面没有任何帮助\n\n# 今年是企鹅年。真的\n\
    \n来自服务器机房深不可测的内部的奥秘系统管理妙处。\n\n伦敦眼每旋转 30 次，有时我觉得 Ubuntu 的发布周期（由于在 4 月 28 日发布 Natty\
    \ Navel 版本）也同样频繁。桌面将看起来显著不同，这是由于 Unity 替换了 Unity（用 Unity 替换了 Gnome 的窗口管理器，不，是），我刚刚安装了服务器的\
    \ alpha 2 版本，它看起来是这样的（例如，在终端上获得一个登录提示符）。\n\n相信我，有几样东西是新的。Cobbler 是一个预启动服务（安装）和部署站点，它支持\
    \ PXE（网络）、虚拟化（QEMU/KVM 或 VMware），并且是现有 Linux 系统的专家。还有一些改进，例如一种服务器屏幕，它通过进程表处理活动，而不是通过键盘或鼠标。他们正在减少能耗。我宁愿在水下\n\
    \n![](img/ddd273149103130953199fe3b160343f_63_0.png)\n\n# eth0 的所有变化\n\nFedora\
    \ 15 将引入新的命名方案以使事物更具一致性。但这是进步吗？\n\nMatt Domsch (@fedoraproject.org/wiki/Features)\
    \ 最近的一项公告建议为网络接口采用新的命名方案，它可能比我们所熟悉和喜爱的要容易得多。如果接口在主板上，或者像 pc39 或内置 PCI 卡上。\n\n\
    设备名称带来了一种似曾相识的感觉，正如经常发生的那样，我确定这将解决一个问题，我想要解决，而且我很惊讶的是我粉碎了它并理解了这个问题——即具有不同网卡的不同机器，它们的生活将因之发生改变\n\
    \n# EPEL6 来了\n\n或许比这更多，Extra Packages for Linux (EPEL) 项目宣布发布 EPEL6。这是一组开源软件集合，但这并不是我们在\
    \ Linux 世界看到的第一次变化。我可能表现得刻薄，但从这些中可以学习到很多东西，其中一些是想要在开源社区中获得关注度和赞誉！埃里克·雷蒙 (Eric\
    \ Raymond) 为《大教堂与市集：如何成为一名黑客》写了一个附录。这里，列表上的第一个是：“世界充满了迷人的出版物，等待着正确的观众，但解决问题并不是驱动我们可能需要的操作系统演变的良好基础。”\n\
    \nLinux 企业社区是唯一一个包含不属于主仓库软件的项目。EPEL6 并不完全由红帽支持——志愿者努力。\n\n# 大教堂与市集\n\n我从埃里克·雷蒙开始，他观察到人们可能已经……但现在已经。\n\
    \n由埃里克·雷蒙的作品出版于 1999 年。在大量的讨论之后，雷蒙描述了黑客社区的“礼物文化”，他们友好地竞争同伴的重复。在《家园》中叙述了开源社区的财产所有习俗。你可以在\
    \ https://wikipedia.org/wiki/cathedral_bazaar 找到它，并可以在 O'Reilly 出版。监控 Maria Magnus\
    \ 和 Cacti 的工作，安全、补丁、备份、工具——总共 5600 个软件包。该仓库也可以用于基于 RHEL 的系统，如 CentOS 和 Scientific\
    \ Linux。更多详情请参阅 EPEL FAQ：https://fedoraproject.org/wiki/\n\n关于 cat 5 遇到问题？埃里克·雷蒙会怎么做？\n\
    \n64 | LXF144 2011\n\n# 布朗博士的行政\n\n# 布朗博士的行政\n\n# # 密码的秘密生活，让你知道没有存储在 /etc/shadow\
    \ 中的唯一东西——但你知道它们是如何工作的吗？\n\n从基础开始。所有的 Linux 账户——至少受密码保护。当用户设置密码时，哈希值会被写入其 /etc/shadow\
    \ 账户条目。当用户登录时，他们的密码会再次进行哈希处理并与 shadow 文件对比。明文密码不会存储在系统的任何地方。\n\n- 所有的 Linux 账户——至少受密码保护。当用户设置密码时，哈希值会被写入其\
    \ /etc/shadow 账户条目。当用户登录时，他们的密码会再次进行哈希处理并与 shadow 文件对比。\n\n- 我从埃里克·雷蒙开始，他观察到人们可能已经……但现在已经了。\n\
    \n由埃里克·雷蒙的作品出版于 1999 年。在大量的讨论之后，雷蒙描述了黑客社区的“礼物文化”，他们友好地竞争同伴的重复。在《家园》中叙述了开源社区的财产所有习俗。\n\
    \n你可以在 https://wikipedia.org/wiki/cathedral_bazaar 找到它，并可以在 O'Reilly 出版。\n\n监控\
    \ Maria Magnus 和 Cacti 的工作，安全、补丁、备份、工具——总共 5600 个软件包。该仓库也可以用于基于 RHEL 的系统，如 CentOS\
    \ 和 Scientific Linux。更多详情请参阅 EPEL FAQ：https://fedoraproject.org/wiki/\n\n关于 cat\
    \ 5 遇到问题？埃里克·雷蒙会怎么做？\n\n64 | LXF144 2011\n\n"
