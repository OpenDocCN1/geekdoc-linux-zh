    # # On the disc


    A new update for the super-polished KDE-based distribution


    # Linux distribution


    # # OpenSUSE 11.4


    OpenSUSE was this author''s first-time Linux distribution in the late 1990s, following
    a brief debut with Red Hat 5.1, which changed much in the world of SUSE, a project
    by a small German company bought by Novel and turned into a bigger player in enterprise
    computing. SUSE Linux is now running in businesses all over the world, proving
    the quality of the distros.


    as a way to get more end users and developers involved, bringing the newest Linux
    technology to our desktops. It works and the 11.x branch of releases in particular
    has proven to be reliable.


    You can read all about the latest release in our review page on page 22, but here
    is how to get it running. After installation we have provided three flavours of
    the distro, the first of which is the 32-bit KDE-based edition that boots directly
    from a CD on any modern PC with 512MB of RAM, and sports a highly polished KDE
    desktop.


    However, for those of us on home desktop usage, products aren''t the right fit.
    That is why the OpenSUSE project was created.


    ![](img/ddd273149103130953199fe3b160343f_91_0.png)


    ![](img/ddd273149103130953199fe3b160343f_91_1.png)


    ![](img/ddd273149103130953199fe3b160343f_91_2.png)


    ![](img/ddd273149103130953199fe3b160343f_91_3.png)


    A wealth of extra software is available online, from office programs to development
    tools and games.


    A quick note about partitioning: Linux needs dedicated space on your hard drive.
    The OpenSUSE installer can reinstall an existing OS, like that is given over as
    Windows, to make room. After installation, your PC will boot from the installation
    media disk and then you can choose which OS to start. If this is what you want,
    then we strongly recommend backing up any important data and settings first just
    in case anything goes wrong.


    There are further options for OpenSUSE fans too, provided as ISO images of the
    distro (OpenSUSE KDE-based edition, featuring the GTK-powered desktop). Then there
    is a 64-bit version, which brings a bit of extra freedom to us. You can also burn
    these ISO images to CD-Rs and boot from them (using disc burning software documentation
    for a guide to burning images).


    OpenSUSE''s most notable feature, Yaast, provides the most powerful configuration
    panel of any distro.


    # # Step by step: Installing OpenSUSE 11.4


    ![](img/ddd273149103130953199fe3b160343f_91_4.png)


    ![](img/ddd273149103130953199fe3b160343f_91_5.png)


    ![](img/ddd273149103130953199fe3b160343f_91_6.png)


    # ## 1 Boot


    The first step is to boot your PC from the LXDVD, and at the boot menu, Enter
    to choose the default OpenSUSE Live KDE option from the list.


    # ## 2 Desktop


    Once that''s done, you''ll arrive at the desktop, which you can begin to explore.
    Click the Install icon on the desktop to start the installation process.


    # ## 3 Installer


    The installer will load and ask you to choose your language, as well as the keyboard
    layout you want. Click Next to proceed and follow the prompts.'
