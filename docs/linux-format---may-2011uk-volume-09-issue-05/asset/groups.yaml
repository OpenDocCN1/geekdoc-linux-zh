    The main KAlgebra menu and the rest of its windows have the same structure, in
    that they both have Console, 2D Graph and 3D Graph as their main components. Tabs
    and menu are associated in an intuitive, self-documenting way.


    +   - The 2D interface of KAlgebra is easy to use, with its multigraph and dynamic
    preview.


    ![](img/ddd273149103130953199fe3b160343f_32_1.png)


    The panes associated with each tab places where you do things and show the drop-down
