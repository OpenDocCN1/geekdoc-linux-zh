    # 新闻台


    # 评论

    ## LibreOffice 的进展


    ### 登陆镜像站

    自由软件沙发的背后是什么？


    Michael Meeks


    这是一个忙碌的月份，LibreOffice 社区继续蓬勃发展。在 FOSDEM 上，我们感受到了所有人对我们所做工作迸发出的热情。看到教室里座无虚席，有许多人正在学习如何加入
    LibreOffice 开发、核心编辑器是如何运作的等等，真是太棒了。


    新版本的 Scientific Linux（一种基于 Red Hat Enterprise 的发行版）已经发布。该软件试图满足 CERN、费米实验室和大学等机构的需求。其中大部分软件现在可以通过由
    Fedora 领导的 EPEL 获取，其变化较之前的版本并不显著。www.scientificlinux.org


    关于参与我们各种“入门级简单任务”（Easy Hacks，见 wiki 页面）的演讲几乎吸引了所有听会者，引发了大量的研究和工作，以增加这方面的深度。当然，我们分发了一千多张贴纸——贴在笔记本箱、T
    恤等地方。这些信息终于得到了妥善接收。我谈到了改进 LibreOffice 带来的乐趣，也谈到了企业所有权的危险，这可能会污染并窒息大多数项目中平等与尊重的氛围。


    - Scientific Linux 使用元素作为版本代号—— 6.x 是“Carbon”（碳）。


    已经过了一段时间，但新版本的 Inkscape 已登陆镜像站，有 80 个 Bug 需要在修复后才能发布下一个更重大的功能。与提高稳定性和修复由 GTK 升级引起的少数问题一样，新版本在处理图像时也应该表现更好。http://inkscape.org


    本月发布了 3.3.1 版本——我们的第一个小版本发布，包含了大量的修复和改进。我们还引入了一些替代的新图标——这是我们设计团队的关键。稳定的点版本将每月发布一次，并在发布中逐步赶进度。


    - 修复 Bug 后，Inkscape 可以期待更大的变化。


    # 网页浏览器


    Firefox 4 的第一个版本带有 Mozilla 代号，并包含海量的变化——这是对用户界面的彻底重构。改变后的发布周期也适用于 Firefox。在第 5
    版中，除了智能标签管理和新的 Chrome 配置菜单等新功能外，Firefox 4 通过其 JavaScript 引擎的各种优化，将渲染性能提升了三到六倍。增加了对
    SVG 图像、3D 图形 WebGL 以及 Web 表单 HTML5 视频的支持。


    在合并六个月的 OpenSLICE 后，留下了大量工作来准备四个功能的首次亮相——以及处理任务冲突。当我解决各种冲突时，我想起了投入 LibreOffice
    的大量心血和流失的资金。


    # SUSE


    德国的 SUSE 现在从 Open-Linux 获得了一盒 OpenSUSE 11.4。该产品的发布旨在让用户不仅能够使用开源软件，还能获得超出常规形式和细节的支持。该发行版确实非常前沿，包含了
    Firefox 4 和 KDE 4.6 版本，而 LibreOffice 也提供了 OpenSUSE 版本。提供英语和德语支持。


    最后，感谢 2000 名捐赠者的慷慨，我们获得了 Document Foundation 生存所需的 55,000 美元。对于能够翻译或测试的人来说，这是为自由未来做贡献的方式。


    - OpenSUSE 包装版将在一年后推出。


    > Michael 是一个伪工程师、分号爱好者。新奇的 OpenOffice.org 黑客和业余副手。


    http-open-slx.com


    12 | LXF144 2011年5月


