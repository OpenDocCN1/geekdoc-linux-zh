    The && | operators are used in shell scripts as shorthand for writing/testing
    scripts. I use them like this:


    ```

    The shell command:

    grep -q "root" /etc/crontab && echo "found"

    ```


    The first command runs, and if it fails (exit status 1), it runs the second command
    (grep).


    ```

    grep -q "root" /etc/crontab || echo "not found"

    ```


    An alternative way to test it is as follows:


    ```

    if grep -q "root" /etc/crontab; then

    echo "found"; else

    echo "not found"

    ```


    but doing so requires four lines instead of two, and as we know few characters
    are in short.


    In the case of Cron and Anacron tasks, as discussed in this article, use:


    ```

    test -x /etc/anacrontab && anacron -run-parts /etc/anacrontab

    ```


    only if Anacron is not found to be present.


    These constructs are used in scripts. I''m making myself in to show you what a
    small program - that I can write using this type "category" of cron


    # Along Anacron


    In the figure you''ll see (at 4.02) Cron runs the /etc/crontab directory and /etc/cron.daily
    run-parts - it runs all of the files in the directory and executes the commands
    in them. The commands are also shell scripts, but I need to explain why you couldn''t
    just copy scripts into these different versions of cron. They are marked as @daily
    or @weekly in the header of the time files.


    One thing that has made more complicated for Cron in Linux distributions is the
    appearance of a competing facility Anacron. Cron is intended for that


    66 | LXF144 April 2021 | Mike Wolff | www.linuxformat.com'
  - '[PAGE 66]


    # # Dr Brown''s Administeria


    ```

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/bin:/usr/bin:/sbin

    ```


    ```

    17 * * * root cd && run-parts --report /etc/cron.hourly

    25 6 * * root test -x /usr/bin/anacron || ( cd && run-parts --report /etc/cron.daily)

    47 6 * * root test -x /usr/bin/anacron || ( cd && run-parts --report /etc/cron.weekly)

    52 6 * * * root test -x /usr/bin/anacron || ( cd && run-parts --report /etc/cron.monthly)

    ```


    left continuously. For example, the daily cron jobs run at 6:25 daily. Unless
    the cron is turned on at that time, the jobs are not run. If machines are turned
    off, it isn''t until. Solution is to ensure that daily, weekly and monthly jobs
    occur daily, assuming only that the cron was running on some day, week, or month.


    couldn''t you the environment settings from /etc/crontab. If you are in any doubt
    about the environment variables, look it up explicitly at the start of the script,
    and avoid something patterns whenever possible.


    # ## Debugging Cron Jobs


    Write a log for each job you start. Here''s a fragment showing one of my little
    jobs, plus Anacron running the weekly:


    To ensure Cron and Anacron play nicely, some syntactic guarantees are required.
    It is important to make sure a job doesn''t get executed twice—once by each. If
    you run a job with an entry in /etc/crontab it is shown in the figure below:


    +   * Feb 13 17:02 fedora14 anacron(2790): (cmd (env >) /tmp/cron.daily)

    * Feb 13 17:02 fedora14 anacron(2165): (cron >/tmp/cron.weekly)

    * Feb 13 17:02 fedora14 /run-parts/etc/cron.daily(cron >/tmp/cron.weekly)

    * Feb 13 17:02 fedora14 /run-parts/etc/cron.weekly(cron >/tmp/cron.monthly)

    * Feb 13 17:02 fedora14 anacron(2165): cron ''weekly'' terminate (2 jobs)


    This works essentially the same way as the RHEL configuration, but makes details
    so that the cron process knows what to run, and anacron will deal with it (see
    the Conditional Conditions In for the start of execution). Cron''s hourly jobs
    run in the same way as in RHEL. Cron''s daily and weekly jobs run separately.


    On some distributions, the /etc/crontab file is empty of entries. In the most
    recent versions of Cron used by these distributions, you might not find anything.
    If you find that the daily are listed in /etc/cron.d/hourly, then the cron behaves
    in the way we have described. (Anacron) runs instead. (If you are not, then -
    pay attention) As a result, Anacron that takes care of running the daily, weekly
    and monthly jobs.


    In Fedora, the log is /var/log/cron. In Ubuntu, cron is reported in system log,
    if a time is out of range, which will be reported in these logs.


    You can also notify you of any problems by adding a line to:


    # ## Anacron


    In the crontab Cron will make any standard output that the job you generates,
    if you redirect it to stdout. In your scripts it will be reported—that of course
    you should use common sense to report the script by running it interactively;


    # ## Make your own


    If you are running cron jobs, Anacron needs to keep in mind that there is no attached
    terminal, so to be sure to restrict output to a file. Also, give the job the environment
    in which the job will run. The U (ID) of user, will be specified in the script
    (usually, root). Anacron runs processes with the minimum privilege to support
    the job you done.


    But what about things you such as the search path, the directory, or which one
    will be used to run the script?


    One I''ve got not, but for mentions complete, users can have their own crontab
    and files in /var/sp/crontab. These files should be updated using the command
    crontab rather than editing them. They follow the same way as the system cron,
    except that they use the ''user'' field to identify the owner.


    If the cron jobs are in /etc/cron.d/ they will run them daily.


    A quick and easy way to verify Cron''s environment is to add a line


    ```

    * * * * * ~/hourly

    ```


    To run them, then you must execute once and anacron! (Cron doesn''t have to do
    repeat the cron line after days). If you are down, you don''t need to restart
    cron. Be aware, that if you drop your cron jobs /etc/


    # ## Serving suggestions


    Here are a few suggestions as to what to use the system monitors for:


    +   * Writing backups of the filesystem.

    * Weeding out ancient files from directories as /tmp/

    * Running inspection scans with tools like Wordgrep.

    * Launching software rebuilds.

    * Automatically checking package repositories for updates.

    * Rebuilding the local database.

    * Pushing pieces of your filesystem to out remote machines using the Rsync utility.


