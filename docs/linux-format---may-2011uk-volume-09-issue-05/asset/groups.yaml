    notify-send --title \"Hello\" \"World\"\n```\n\nBecause we're using it with Bash,\
    \ we can do it with including the following:\n\n```bash\nnotify-send --title \"\
    The date is: \"$(date)\"\nif [ \"$msg\" = \"file copied\" ]; then\n  notify-send\
    \ \"File has been copied\"\nelse\n  notify-send \"Something went wrong\"\nfi\n\
    ```\n\n```bash\ncp $1 $2\nif [ $? -eq 0 ]; then\n  notify-send \"Your file has\
    \ been copied, that is at $2\"\nelse\n  notify-send \"Something went wrong\"\n\
    fi\n```\n\n```bash\nwhile read line; do\n  notify-send \"New log message: $line\"\
    \ndone < /home/user/messages\n```\n\nWhile this might seem like no-free experience,\
    \ there are options for notify-send that can make it more effective and save you\
