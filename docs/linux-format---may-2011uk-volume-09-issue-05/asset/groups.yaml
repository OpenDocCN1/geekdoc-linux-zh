    ## 书评


    ## Foundation Drupal 7

    Neil Vech 表现得游刃有余，完全是另一个 DrupalExpert。


    最近涌现了一系列 Drupal 书籍，这恰恰证明了 CMS（内容管理系统）的成功，现在《经济学人》和白宫都在使用它的界面。遗憾的是，并非所有书籍的质量都很高，正如我们在过去几个月里的页面中所看到的那样。不过，这算是一个例外。


    当然，书中有很多显而易见的“如何安装”章节，这些部分处理得不错，虽然完全全面——如果能在某些卷书中看到一些故障排除提示和常见问题的解决就更好了，但它们完成了任务。


    写作语气像商务化写作，但确实传达了信息。这本书最大的问题是无休止的截图和图表，这让你不由自主地多坐上几分钟。尽管如此，这是 Drupal 书籍中不错的例子之一。


    书中主要且实用的部分是安装后的内容，它涵盖了核心模块的设置和激活，并对如何使用它们提供了较少的建议。


    最棒的是关于第三方模块和主题章节。Drupal 本身是一个很强大的自包含系统，但如果不使用任何代码，制作出的网站将毫无出彩。很好的是，这本书承认了这些模块的价值，并提供了良好的安装指南。虽然没有达到应有的深度，但那
    20 页……


    ## Drupal 7

    > 在这本密集的的手书中，你可以找到关于 CMS 非核心组件的有用指导。


    ## Linux 手册

    Neil Vech 为在 Linux 上的成功付出的努力回报。


    Haynes 以其执行所有任务的一系列步进式指令而闻名。近年来，该品牌已经分化，生产了一些幽默风趣的作品，可见各种领域。这本属于后者。虽然硬件封面设计非常漂亮，但没有大篇幅的章节，你得到的是一种让人联想到项目的格式以及桌面常用命令。


    值得注意的是，作者扩展了他对真实体裁的广泛知识，他的水平比一般的“如何做”文档要好得多。后面的章节涵盖了编程、设置 Web 服务器，更重要的是，所有这些内容是如何用一种友好、无术语的指南编写的。然而，一旦它涵盖了
    Ubuntu 的长期支持版本（LTS），它将贯穿本书剩余部分。基于书中提供的 Ubuntu 10.04 LTS 版本，其操作步骤和软件指南已经是顶尖水平了。唯一的微小问题是质量如何……


    ## Foundation Drupal 7

    - 作者：Robert Jenkins

    - 出版社：Apress

    - ISBN:978-143252880

    - 价格：$29.99

    - 页数：306

    - 评分：8/10


    这是一部超出基础知识、有时相当费力的著作。


    ## Linux 手册

    - 作者：Mike Saunders

    - 出版社：Apress

    - ISBN:978-1442592700

    - 价格：$19.99

    - 页数：160

    - 评分：8/10


    一本面向初学者的无术语 Ubuntu 入门读。Mike 欠我一个啤酒。见在 Haynes 出版的 Ubuntu 初学者指南中。我们想提到这本书是 Mike
    写的。


    Graham Morrison 在一位顶级极客的话中为他的职业寻找了慰藉。根据这本书第一页的说法，极客们“背负着令人衰弱的技能”，而这本书肯定了将你表达欠佳的想法转化为成就事业的主业。它对主题、词汇和想法使用了随意的、非正式的方法。那些内容通常感觉像是和中层经理困在一起，或者在参加团队建设的冒险。每一个轶事都既引人入胜又令人恼。作者沉浸于轶事、传记和西海岸管理哲学的生涯，很好地让你觉得自己很特别，并让你充满信心。


    书中没有顺序，也没有有帮助的递进关系；虽然有一个实用的索引，但各种标题中的术语让导航变得困难。还有一些严重的遗漏。例如，没有任何关于创建优秀简历的内容，而且对于需要帮助的读者来说也无可读。作者只是假设你已经在“横扫一切”。这对于一个承认极客背负着令人衰弱的社交技能的作者来说，这很令人惊讶。


    ## 软件开发人员职业指南：成为极客

    他接着带你穿过了电话新闻领域的不满领域，以及薪资监管的预言之火，最后以如何与新经理相处以及中间的领导力挑战作终。书中有时间讨论作者对未读邮件、经理类型和会议的零容忍。


    - 作者：Michael Lopp

    - 出版社：O''Reilly

    - ISBN:978-0-596-15507-0

    - 价格：$35

    - 页数：318

    - 有趣且富有见地，但作者的语气可能令人厌烦。

    - 随意的职业建议合集，趣味十足，但缺乏秩序。


    这些是一个被捕捉在博客形式中的老天才的精炼思想，这也是主要问题所在。它感觉像是一系列散落在封面之间的随机想法。


    - 评分：7/10


    ## 软件基金会

    Stephen Fry 先生向你介绍了自由软件，并提醒你记住一个非常特殊的生日。

    www.gnu.org/fry


    自由软件基金会


    ## Distrowatch

    本月来自……的库的新闻汇总


    ## 继续

    OpenSUSE 还将推出 XFce 和 XOME 的最新版本，以及其他发行版。决定安装哪个版本的 Firefox 并不容易，因为开发者最终选择了 4.0
    版本。你的内核也更新了。这一切都是基于 Linux 2.6.37、X Server 9 和 GCC 4.5。因此，如果你追求稳定性和性能，OpenSUSE
    是一个非常好的选择。


    3.0 版本也由开发者发布以测试性能。包含的 KDE 版本是 4.6，对于大多数人来说绰绰足够。虽然从 OpenSUSE 的配方中移除了一些功能，但它比之前的版本快了一些。


    OpenSUSE 11.4 包含了 LibreOffice 3.2，这使其成为第一个将其作为默认办公软件的主要发行版。


    '
