    # # Project checklist


    ## Keep the communication flowing

    Always ensure that your communication channels are easy to use and operational,
    and it''s simple for new people to join. Many projects fail because they don''t
    help new contributors get started quickly enough.


    ## Stick to your release schedule

    When groups of volunteers are working on a project, it can be tempting to lead
    a deadline on the release plan. Don''t do this unless it''s absolutely necessary.


    ## Agree on major features

    Tasks are always better divided and conquered, and the only way to do this is
    to ensure that you are agree on the work. Also make that the tasks are spread
    out different contributors.


    ## Learn from other people

    There''s so much to learn in the realm of managing projects, and no path forward.
    Ask others what they do and learn from them; this will help you grow more skills.


    ## Have a "no mean people" policy

    People who are difficult to deal with can be disruptive in your source project
    and open teams from shipping a release. Be fair and to resolve conflict, don''t
    encourage or allow disruptive individuals.


    ## Follow up on tasks

    Actions with no oversight result in no actions particularly. Follow up with everyone
    once a week to ensure they''re on track and eradicate obstacles.


    ## Track progress effectively

    The best managed projects are those with the records of how everything is running.
    In this article, explored burndown charts - find a system that works for you to
    keep things on track.


    ## Always remain calm

    Sometimes your patience is tested with difficult contributors, people not following
    through what they agree to and so. Remember that these people are volunteers.
    Don''t lose your temper or they won''t come back.


    ## Don''t ignore your tools

    Many projects start with a plethora of management tools that are ignored as time
    goes on. Use the tools for what they''re designed for: help you achieve more.


    ## Identify obstacles early

    If there is a problem with an action being completed, try to fix it so you can
    move on it. This means having good status updates on actions and checking regularly.


    ## Don''t be a bureaucrat

    Tools and processes are there to help people be effective. If there''s a faster
    or better way of doing something, change it. Don''t just say "Well, the rules
    —" will only annoy your contributors.


    ## Encouragement is vital

    We''re volunteers and volunteers need validation, encouragement and be thankful
    for their work. Make them feel awesome about their contributions - they stick
    and linger.


    ## Fit the person to the task

    Some people are good at coding, some documentation, some at art. Always try to
    ensure that the people with the skills have the right work assigned to them. This
    will generate more success.


    ## Always record and publish

    When you have a meeting and note down actions, ensure you publish them as a reminder
    of what you expect for the next meeting. This is a good way of keeping progress
    on track.


    ## Ignore quality assurance

    In many projects, the bug fixing quality assurance (QA) is often too short or
    people get distracted trying to add features. QA is the most critical feature
    you need to define — don''t compromise it.


    ## Document everything

    The key to helping projects run smoothly is ensuring that everyone knows what
    they should be doing keeping all your different projects, release plans and more
    fully documented on the same page.


    ## Milestone goals

    As you progress through your cycle, be sure to milestone and high bugs to releases
    (such as alpha) and encourage your community to focus on them as priority items.
    This will help you to ship a tighter release.


    ## Keep meetings up

    Although one-on-one calls are certainly useful from time to time, a general rule
    is to keep your team meetings. This is important in open source communities to
    keep things transparent.


    ## Don''t be afraid of sharing the load

    When starting a project, it''s tempting to go of the reins and allow someone else
    to take some responsibility. It will stop you from being an obstruction and restricting
    progress on the project.


    ## Reflect and assess

    At the end of every release, assess how well you did, and how you can improve.
    This is a healthy process for identifying and improvement in the future.


