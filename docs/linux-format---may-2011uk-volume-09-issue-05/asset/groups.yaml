    \ that you'll ever need.\n"
  mdcn: "\n\n# WordPress 教程\n\n## 小部件\n\n### 文本：新媒体事件\n\n**小部件**\n\n可以将这里的小部件添加到侧边栏中使用。你可以将小部件拖到这里，然后根据你的需要进行定位。\n\
    \n### 标题：\n# 新媒体事件\n\n### 关于\n你网站的每月存档\n- 网站日历\n\n### 归档\n- 最近文章\n- 搜索文章\n\n###\
    \ 最新\n- 最近文章\n\n### 元数据\n- 已登录\n- 站点地图\n\n### 其他\n- 最近评论\n\n### 文本\n- 自定义文本\n\n\
    ### 图像\n- 一张图片\n\n### 列表\n- 一个列表\n\n### 导航\n- RSS 馈\n\n### 搜索\n- 搜索表单\n\n## 开启\n\
    如果你的主题默认不支持菜单，你可以使用像 Widget Logic 等系统来添加菜单，以便在特定页面显示自定义菜单。最后一步是为观众显示菜单。\n\n如果你更倾向于使用菜单，可以使用“位置”（Locations）部分来定义新菜单所在的位置——在页眉或侧边栏；如果无法实现，你仍然可以使用它将菜单放在中间。此外可以使用“小部件”（Widgets）部分。小部件是种放置在各种位置的基本内容单元。它可能包含文本、图像、链接或其他选项。系统自带了许多小部件，你也可以使用插件添加任何你自己的。\n\
    \n你感兴趣的小部件可以从侧边栏抓取，将其拖放到右侧的一个空间中。它们将根据其在页面上的位置（侧边栏、页脚或文章）进行放置。一旦释放，你就可以编辑它并选择你想要的内容。然后点击“保存”，你就会在该位置看到该小部件。当你选择适合你区域或布局时，将显示相关的类别。\n\
    \n小部件是至关重要的工具，因为它们允许你定制内容以适应网站上的单个页面。这会在选择类别时显示小部件。注意，每一个小部件都有一个描述。你可以通过进入后台界面的“分类”部分，点击分类并查看\
    \ URL 来查明这是什么。\n\n### 简单连接\n有很多方法可以为 WordPress 添加 Facebook 赞，但此插件以模块化方式工作。你可以将其添加到任何页面或文章，并邀请访客使用他们的凭据登录你的网站。如果\
    \ Facebook Connect 不够，你可以创建一个自己的社交世界。BuddyPress 允许为每个用户提供个人资料页、博客画廊和讨论空间。BuddyPress\
    \ 于安装和激活，但在配置方面存在一些问题，可能会影响你网站的编辑自由。\n\n### 流行度\n鼓励用户访问你网站的最佳方法之一就是给他们想要的。流行度（Popularity）允许你在侧边栏显示选择的阅读最多的文章，以推广你的热门内容。\n\
    \n### Google Analytics\n可以告诉你你网站的哪些部分运行良好，哪些部分需要注意。此插件与 Google Analytics 系统配合，并提供了一个良好的仪表板，显示发生的情况，而无需你随时登录账户。\n\
    \n## 插件\nWordPress 有数千个插件，为 Drupal 或 Joomla 等更多 CMS 也提供了插件。有几个你可能会觉得很有用的。你可以通过“插件”安装其中的每一个——只需搜索并安装。\n\
    \n小部件插件允许你定义一个显示内容的区域或页面集。每个小部件在底部都有一个额外区域允许传递参数。以下是一些示例：此参数将导致小部件仅在网站的首页显示，而另一个将在“关于”页面之外的所有页面上调用它。\n\
    \n```\nis_category(array(5))\n```\n\n## Bash：为 shell 脚本创建通知系统和对话框\n\n### Bash：添加\
    \ GUI\n命令行是力量所在，但你可能需要与那些不被信任可以输入命令的人共享它。\n\n专家观点：在启动 Linux 时，某些 Bash 脚本在他们看来让被取代的内容看起来像是倒退，而且对于人们以简单友好的方式访问和使用计算机来说也是如此。我们还知道从\
    \ shell 执行任务让环境安全得多，并且只能进行特定的配置。GUI 尚未真正准备好做到这一点。将你出色的 shell 脚本与世界交互可能有一个原因：让凡人也能使用它们，或者简单地让它们更具自主性。\n\
    \n### 通知事件\n你可能的首要需求，例如仅仅是让某知道脚本或简单命令已运行。在现代系统中，存在一种机制，C/Dialog 具有的优势是它可以在纯文本显示器上工作。这被称为通知事件。\n\
    \n通知是当程序崩溃时出现的小型消息窗口，或者弹出提示你已登录某个角落，或者指出你在火上工作得多么辛苦。它们可能会根据运行的桌面环境进行不同的处理（例如，KDE\
    \ 和 Gnome 都有处理器），但它们使用相同的标准，允许我们以完全相同的方式访问它们。\n\n让事情变得简单的是有一个简单的命令可以为我们工作：`notify-send`\
    \ 带有几个开关来控制消息显示的时间，以及一对字符串——一个用于标题，另一个用于更详细的解释（如果需要）。该工具的简单用法可以是：\n\n```bash\n\
    notify-send --title \"Hello\" \"World\"\n```\n\n由于我们是在配合 Bash 使用，我们可以包含以下内容：\n\
    \n```bash\nnotify-send --title \"The date is: \"$(date)\"\nif [ \"$msg\" = \"\
    file copied\" ]; then\n  notify-send \"File has been copied\"\nelse\n  notify-send\
    \ \"Something went wrong\"\nfi\n```\n\n```bash\ncp $1 $2\nif [ $? -eq 0 ]; then\n\
    \  notify-send \"Your file has been copied, that is at $2\"\nelse\n  notify-send\
    \ \"Something went wrong\"\nfi\n```\n\n```bash\nwhile read line; do\n  notify-send\
