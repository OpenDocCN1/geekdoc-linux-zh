  mdcn: "\n\n# 回答\n\n...（说），出现以下消息：文件处理意外失败 - 详情：something 等等 - dolphin dolphins。\n\
    \n这似乎是一个 tmp 空间问题。我发现 kde-root 所在的 /tmp 空间已占用 85%，那里有大量文件。\n\n在后面，由于我的 kconfig_update\
    \ 将其标记为已运行，然后尝试再次运行。\n\n这就是 kconfig_update 失败的原因，存储在 /kde4/share/apps/kconfig_update/\
    \ 中。临时文件在 kde-root 目录中，这是你正在运行的一个程序。\n\n10.04 当我尝试运行 Kindle for 或 Internet Explorer\
    \ 时，结果无一一获 - 我需要、重试、再试，Wine 停止了，我正打算放弃它。在之前是否有某些缺失的崩溃之类的状况？\n\nNicolas Herbecke\n\
    \n如果你无法退出它，最好持续演进以适应不同的程序。你应该始终使用最新版本，而不是旧版本。10.04 这两个都有这个版本，是目前最好的。\n\n早期支持意味着更多软件，因此你的第一步应该是从\
    \ www.wine.org 下载最新版本的 Ubuntu。\n\n我还有其他问题，但 Wine 最好的答案总是提供你尝试安装的软件。在很多情况下，退回到旧版本意味着可以得到你需要的。例如，我通过\
    \ Wine 运行了 Kindle for PC，虽然它是一个旧版本，但它可以实现我想要的所有功能。\n\n你可以从 http://tiny.wine.org/kindle4wine\
    \ 下载旧版本。\n\nkconfig_update 是一个更新配置的 KDE 进程。每个进程都需要读取和写入格式化后的文件，程序会将一个小文件写入 /kde4/share/apps/kconfig_update。\n\
    \n如果你删除了 kconfig_update，它将停止创建临时文件，但也会丢失你的 kconfig 信息。或者，如果你知道旧文件，你可以在网上搜索该问题，又也许你正在运行某些较旧版本的\
    \ KDE。\n\nDave Courtois\n\n该文件的出现以及对其中信息的使用反映了文件名中的程序配置。每个文件在每次更新时只运行一次。似乎更新正在重复。如果更新失败，那么临时文件就会被删除。\n\
    \n我尝试过在 Linux 中运行 Wine，但根据这种经验，无法再次运行任何 Windows 程序。\n\n![](img/ddd273149103130953199fe3b160343f_83_0.png)\n\
    \n本月的幸运者是 Dick Bocan，这将帮助我们处理我们的新案例\n\n# 并行脚本\n\n我想按顺序执行一个 shell 脚本，直到我运行到一个包含四个进程的点，以便让这些进程并行运行。\n\
    \n此外，如果我需要在原始脚本的某个参数中添加条件函数，我可能需要在脚本的这些阶段之间添加一些启动脚本。\n\n在使用 Linux 1.0.4 后，我发现使用类似\
    \ `& 1` 的脚本方法来派生进程。我需要进程向文件写入一个唯一值，这样如果它们没有全部完成，我就可以有一个关于已完成进程的引用。我将使用 `sleep`\
    \ 命令等待几分钟，以挂起进程直到所有单元完成。每个进程大约需要四小时。\n\n如果停止脚本失败，进程仍在运行。如果你为每个进程创建一个文件，当它们失败时你可以删除它们，为任务创建一些新值。\n\
    \n对于 (1-4):\n\n```\ninitiatewait -c /tmp/myprocess/\n```\n\n在将创建文件的 /tmp/myprocess/\
    \ 目录中，你可以使用 `initiatewait` 来检查进程状态，而不是目录本身。\n\n`initiatewait` 会等待文件事件并退出。循环运行四次，所以当四个进程都完成后，就会存在文件列表，无论它们出现的顺序如何。你的脚本理想情况下应该在进程开始之前退出——\n\
    \n有一种更好的方法可以实现这一点，而不断检查文件的修改。用于监控文件或目录更改的内核 - `directory-tools` 包。\n\n你需要检查进程是否执行成功。你可以通过编写脚本来创建文件，然后使用\
    \ `sleep` 检查每个文件是否已创建以确保成功。这是一种更有效的方法。\n\n你必须能够修改单个进程来创建文件，尽管这可能很难。如果文件没有被创建，你可以以改变内核方向的方式启动它们：\n\
    \n```\n(process) /tmp/myprocess/1 &\n```\n\n```\n(process) /tmp/myprocess/2 &\
    \ \n(process) /tmp/myprocess/3 & \n(process) /tmp/myprocess/4 &\n```\n\n如果任何进程失败，第一个创建的将会成功。如果\
    \ process1 失败，第二个将创建一个文件，以便在继续之前检查所有进程是否已成功。\n\nLXFI14 2011年5月\n\nwww.linuxformat.com\n\
    \n# 回答\n\n在网上搜索 'wine' 和 'kindle'。你有的安装程序大小为 5.2MB。运行它：\n\n当你安装程序时，先不要运行。使用 `winecfg`，然后转到\
    \ Applications 选项卡，点击 Add Application 并选择 Kindle for PC。现在选择此项以及 Kindle for Windows\
    \ 2008 版本，它修复了一些 GUI 渲染。如果不这样做，你将看到程序中的方框。当你第一次登录程序详情时，你可以通过输入你的登录预设、密码和头部来实现。\n\
    \n你可以使用的其他程序有 ggplay，或者去 https://www.winehq.org 论坛搜索，它们通常可以提供帮助。\n\n空间中有一个新分区，因为没有剩余的主分区，你无法在不破坏\
    \ sda2 的情况下删除 sda4。重装很容易，我正在学习重装，但这可能是最好的解决方案。由于你有两个硬盘和更自定义的分区方案，我建议你使用 Linux，Fedora\
    \ 安装程序只需要两个分区，一个用于 /boot，一个用于根卷。\n\n所有内容作为分区内的本地文件安装。\n\n在设置 Linux 时，一个非常有用的建议是为每个分区或逻辑卷使用\
    \ LVM。这让你能够扩展按需创建的合适的卷，并留出剩余的 LVM 空间。你可以通过几次点击（或命令）创建或删除现有卷。不再需要修复分区大小。\n\n文件的出现以及对其中信息的使用反映了文件名中的程序配置。每个文件在每次更新时只运行一次。似乎更新正在重复。如果更新失败，那么临时文件就会被删除。\n\
    \n我尝试过在 Linux 中运行 Wine，但根据这种经验，无法再次运行任何 Windows 程序。\n\n![](img/ddd273149103130953199fe3b160343f_83_0.png)\n\
