    # LINUX 新闻桌


    **本期内容：** Qt » Fedora 15 » Unity Ocelot » Android » HP WebOS » SCO MOBILE


    ## Qt 框架的分离未来


    Nokia 向 Digia 出售了该框架的商业许可。


    Nokia 宣布将把商业许可版 Sebastian Qt 框架的责任移交给 Digia。负责 Nokia 在 Meego 投资的 Sebastian Nystrom
    表示，他在与 Qt 的合作中积累了经验，并雇佣了数百名开发人员对其进行开发。他说：“Digia 将继续扩大其机遇，并为我们的整体 LGPL 和商业社区做出贡献。”


    此举标志着这家芬兰制造商进一步背离了其开源策略，在此之前，它已与微软达成协议，使用 Windows Phone 平台。Nokia 收购 Qt 的目的是为了让
    Qt 成为开发者在 Symbian 和 Meego 平台上工作的平台。由于将使用微软的闭源系统，Nokia 已转向了这一业务领域。他们仍可能在 Nokia
    的指导下专注于 Windows Phone，而这证实了 Qt 并非首要任务。


    KDE 开发者 Hörus Schumacher 表示，得益于 Nokia 在 LGPL 协议下发布了 Qt，无需担心。他认为，如果软件向项目开放化发展，将会变得更强大。他说：“我们正在与合作伙伴合作加速这一过程，使开放治理成为现实。与此同时，我们看到了
    Nokia 对 Qt 的承诺以及对 KDE 的持续支持。”


    ## Meego 将去向何方？


    他说，KDE 与 Plasma 框架的关系也很好，后者为构建新平台（如机顶盒、车载系统和平板电脑）提供了机会。


    Nokia 尚未完全放弃其开源策略。去年 Nokia 尝试监督首款 Meego 手机的发布表明，这可能被视为针对那些不想使用 Nokia 手机用户的策略。


    根据项目开发者的说法，Meego 失败的后果是资源匮乏，这导致了“架构调整”。


    > Qt 作为该框架的快速开发环境，将继续获得 Nokia 的支持。


    他补充道，领导层的变更是一个思考移动世界之外问题的机会，但在尝试完成即将到来的 1.2 版本所需的必要元素之前，前方面临着巨大的障碍。


    Nokia 对微软手机系统的支持并不廉价。这家美国公司每年将向 Nokia 支付 1 亿美元，预计通过许可成本收回支出。该公司还将共享包括营销和广告服务在内的资源。


    > 随着 Nokia 放弃该平台转向 Windows 7，Meego 的开发速度可能会缓慢。


    6 LXF | 2011年5月14日

    www.linuxformat.com


