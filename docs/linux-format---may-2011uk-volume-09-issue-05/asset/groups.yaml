    # 图形绘图工具汇总


    ## KAlgebra


    ### 由 KDE 提供的功能强大的数学助手。


    正如 G 可以被（部分地）定义为一种使用 Gnuplot 的方式，并迫使人们更仔细地观察其命令一样，KAlgebra 也可以被视为一种学习和使用 MathML（数学标记语言
    (www.w3.org)）的非侵入式方法。KAlgebra 专注于数学，而不是数据的绘图和分析。作为一款 Qt/KDE 应用程序，它比 Grace 或 matter
    更能融入任何 Gnu/Linux 发行版中。使用在线上现的任何教程，都将帮助你成为 KAlgebra 用户。然而，引用该程序的说明书：使用 KAlgebra
    实际上并不需要了解数学。你可以像在纸上写字一样自由地定义函数。


    - 当它进行 3D 绘图时，KAlgebra 允许你从任何角度旋转并查看细节。


    ![](img/ddd273149103130953199fe3b160343f_32_0.png)


    此外，KAlgebra 的优势之一是其详尽且早期的文档。“帮助”菜单包含指向完整手册的链接，而主窗口的“字典”选项卡包含了 KAlgebra 支持的所有数学和逻辑操作的可搜索列表。每个运算符都由描述、其接受的参数列表、在代数中的调用方式以及示例图来定义。


    ## 数学创作


    KAlgebra 的主菜单和其他窗口具有相同的结构，即它们都将控制台、2D 图形和 3D 图形作为主要组件。标签和菜单以一种直观、自文档的方式相关联。


    - KAlgebra 的 2D 界面易于使用，具有多图显示和动态预览功能。


    ![](img/ddd273149103130953199fe3b160343f_32_1.png)


    与每个标签相关的窗格是你执行操作的地方，而显示的下拉菜单提供了在该相应标签中可以执行的操作，这些操作与标签名称相同。例如，代数窗格是专门的，KAlgebra
    可以发布命令并进行一些计算。图层可以通过双击它们来更改其颜色和大小，并显示上一次计算的结果。


    关闭 KAlgebra 时，所有这些内容将会丢失，但似乎可以保存你想要在之前的会话中执行的所有命令内容，而无需重新输入。这些文件也会被保存。“控制台”菜单中的“导出”功能会将你输入的内容显示为
    HTML 图像，方便打印或在线发布。解释到此：此列表结合了两个 KAlgebra 窗口，向你展示了在其 2D 图形部分可以进行的操作。真实的图形留在标签的左侧部分，你可以放大、缩小，并在鼠标悬过曲线时显示内容。右侧窗格分为四个标签。为了查看内容，你需要：


    ![](img/ddd273149103130953199fe3b160343f_32_2.png)


    从名为 Alge 的标签开始，在顶部输入你的函数，选择它的颜色并享受动态预览。当你点击它时，函数将会在主区域被绘制出来。重复此过程，直到你添加了所有想要绘制图图的函数，每个函数都使用不同的颜色。所有颜色和函数都列在两个标签中。最后一个名为“Info”的标签用于显示主图中可见的数学坐标。


    3D 图形部分比 2D 部分简单。KAlgebra 目前仅支持 z=(x,y) 形式的 3D 绘图。其中，可以使用的地方。你可以绘制图形、放大、缩小，并使用方向键进行旋转。这允许你放置对象，因为你可以使用：


    ![](img/ddd273149103130953199fe3b160343f_32_3.png)


    ![](img/ddd273149103130953199fe3b160343f_32_4.png)


    KAlgebra

    版本：0.1

    http://kde.org/KAlgebra

    在GPL 协议下免费使用。

    它拥有出色的 UI，但在绘图 Grace 或 jgp 方面非常灵活。


    # 评分 7/10


    ## 图形绘图工具汇总


    ## KmPlot


    Algeebra 的兄弟，专门用于数学分析。


    一眼看去，KmPlot 代表 Algeebra——两者都是基于 KDE 的应用程序。其他共同点在于，KmPlot 是一个高级计算器，你可以用它加载并绘制数值数据。

    两者之间的相似性在这里或多少体现，因为主要重点在于 KmPlot 对 3D 图形的处理。它支持笛卡尔、极坐标、参数函数以及不同的函数，包括传统的笛卡尔函数，或者如果你使用
    View + Fit 到三角函数，点击左键即可进行倍乘。绘制显示了所选曲线的区域和切线。在下拉菜单中，你可以启动一个免费的计算器和一个数学表达式编辑器。

    当你需要计算积分、导数、函数的最小值和最大值时，KmPlot 是一个易用工具。另一个优势是它绘制函数的方式。你可以关联最多四个滑块，以查看访问区域的变化，但并不是全部。通过右键激活的下拉菜单可以访问动画面板，你可以在其中为参数定义最小值和最大值并对其进行增量。此时，你将能够让
    KmPlot 根据每次增量绘制图形的所有版本的序列。


    ![](img/ddd273149103130953199fe3b160343f_33_0.png)


    在任何绘图中使用的命令和函数都可以以类 XML 格式保存在文本文件中。

    - 一个优势是它让你研究参数函数的方式。

    - 当你需要知道函数的面积或极值点时，问问 KmPlot 即可。


    ![](img/ddd273149103130953199fe3b160343f_33_1.png)


    结论

    KmPlot

    版本：1.2

    网页：http://kde.org/kmplot

    价格：GPL免费

    KmPlot 的范围较窄，但它能完成它想要做的任务。


    # 评分 7/10


    ## Kayali


    尚未准备好上市，但请关注它。


    与本次汇总中的所有其他应用程序不同，Kayali 仍处于开发的 Alpha 阶段——到目前为止，它是一个很有前景且有趣的工具，可以完成其他工具可以的功能。Kayali
    也容易开始和测试一段时间。它可以区分数学表达式并通过 Gnuplot 绘制它们。用 Qt 编写的界面只是前端。Kayali 使用的引擎是最好的引擎之一，非常强大，且该项目由
    Mathematica 系统 (http://mathematica.sourceforge.net) 驱动。虽然它不能执行 Mathematica 能执行的所有操作，但很容易将一些数据输入到
    Gnuplot 中绘制结果。界面简单到可以保存，由于是 Alpha 阶段，你可以定义参数的最小值和最大值并进行增量。


    ![](img/ddd273149103130953199fe3b160343f_33_2.png)


    - 优势是它  的工具。


    结论

    Kayali

    版本：0.3

    价格：GPL 下免费


    # 评分 5/10


    > “在 Mathematica 方面是一个很有前景的工具。”


    '
