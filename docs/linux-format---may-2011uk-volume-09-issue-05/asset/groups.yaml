- md: "\n## Wordpress Use a CMS to make editing your website quicker and easier\n\n\
    ## Working with\n\nIf you need to bash out a blog quickly, very little comes close\
    \ to Wordpress. As Andy Channelle discovers, it's a great content management system.\n\
    \n![](img/ddd273149103130953199fe3b160343f_67_0.png)\n\n![](img/ddd273149103130953199fe3b160343f_67_1.png)\n\
    \n**Expert**\n**Andy Channelle**\nIs the author of OpenOffice.org, co-author of\
    \ WordPress Liberty and lecturer of news media at the University of the West.\n\
    \nA content management system (CMS) is vital if you are thinking of making a website\
    \ from a collection of simple pages or a blog. The completely complex setting\
    \ up it is much then than made for by the ease with which it will enable you to\
    \ add new content and features to the site will also reduce the complexity, while\
    \ retaining the ease of a real content management system.\n\nThe latest version\
    \ of WordPress does this, combining five-minute install and simple posts with\
    \ a New Menu feature, themes and post types. With thousands of themes available,\
    \ WordPress gives you the chance to build a self-hosted website without having\
    \ to touch a line of PHP or learn the intricacies of CSS.\n\nIn the process of\
    \ posting content to a website, show you how to make the most of its CMS-like\
    \ features and introduce a selection of plugins that enable you even better.\n\
    \nYou can install WordPress on any server, or if you just want to try it out online,\
    \ as an installation of XAMPP (https://www.apache.org/en/xampp.html).\n\nThe Dashboard\
    \ is where all of your work will take place. It has a central workspace, which\
    \ by default contains information about your site, including posts, comments awaiting\
    \ approval and needs from WordPress.\n\n## The editing interface is simple, but\
    \ with a wealth of hidden features.\n\nIf your site needs building, this signal\
    \ at the top of the software appears automatically. With a simple link, which\
    \ also enables you to secure it, and if you're working on the internet, you implement\
    \ these soon as they're needed.\n\nOn the left of the browser enables you to access\
    \ the parts of the system, with the Dashboard that will likely be determined by\
    \ the plugins you install, and the basics:\n\n- **Posts**: Where you manage the\
    \ content that's added to.\n- **Media**: This gives you access to images, videos\
    \ and files you've uploaded to your gallery.\n- **Links**: Used to add links to\
    \ your sidebar or gallery.\n- **Pages**: For creating static pages such as About\
    \ Us, Frequently Asked Questions and Contacts.\n- **Comments**: Managing the comments\
    \ left by users, deleting comment spam.\n- **Appearance**: Used to configure the\
    \ look and feel of your site, such as theme and header design.\n- **Plugins**:\
    \ For adding new features.\n- **Tools**: These elements can be used to push content\
    \ and links to your site.\n- **Settings**: Setting the configuration options of\
    \ the site. The options enable you to rewrite your site name and strapline, date\
    \ formats, set commenting options, and set the front page of your site.\n\n# Wordpress\
    \ Tutorial\n\n# LINUX FORMAT\nOn the DVD\nWordPress 3.1\n\n## Wordpress\n\nThe\
    \ basic element of a Wordpress site is a post. This is what appears either in\
    \ the main blog page of the site or elsewhere. To create a new post, select Posts\
    \ > Add New from the menu. At the top of the screen, you'll see a field Title\
    \ – which is where you enter the headline for your post – and below this is the\
    \ text area. The text area is headed by a toolbar containing text editing options,\
    \ such as bolding, adding a link and inserting bullet points. These features work\
    \ much like they do in a standard word processing program.\n\n## Post secrets\n\
    \nWhile Wordpress is powerful enough for most circumstances, there are additional\
    \ options for more specialist users. For instance, clicking the icon on the far\
    \ right of the toolbar (the so-called Kitchen Sink) will reveal an extra layer\
    \ of options, which strips out the elements that MS Word would like to add, and\
    \ a set of predefined styles, including Heading I and Paragraph. For even more\
    \ control, the editor has an HTML tab which allows you to edit the code of the\
    \ post so you can examine or edit it. This is great if you want to add some embedded\
    \ YouTube video, widget, or just want more control over the way that your post\
    \ is styled post-by-post.\n\nThe interface is simple, but there's a wealth of\
    \ features hidden away, if you know where to look for. Above the toolbar is a\
    \ media bar, which enables you to insert images, videos and other types of media.\
    \ One of the options here will have a click box from which you can select files\
    \ from your computer to upload, or link to content using a URL. Once you have\
    \ entered – whether it is local or remote – the content is all treated as a large\
    \ extent. When you insert it into a post, use alternative text and other elements.\
    \ If you've defined the post you want to include, let insert Post to the add so\
    \ you will be available under the Media Library tab, or when your user content\
    \ is accessible via the Gallery tab.\n\n![](img/ddd273149103130953199fe3b160343f_68_0.png)\n\
    \n- Add New Post offers lots of features, including the brilliantly named Kitchen\
    \ Sink button, which displays all options.\n\nIn addition, this will mean you\
    \ can write your story in an Excerpt box, which will then be used as an introduction\
    \ and RSS summary of the content. The right hand contains the Publish options,\
    \ which can be used to save a draft, schedule publication for a later date or\
    \ publish immediately. You'll also need to use a Trash option, to delete your\
    \ post.\n\n![](img/ddd273149103130953199fe3b160343f_68_1.png)\n\n## Getting installed\n\
    \nopen php.config in this text editor and edit your database in the appropriate\
    \ space, moving all of the files to your root directory or a folder on your server.\n\
    \nIf you're not ready, you'll need to set up a database using the installer which\
    \ will create a database username and password that can read and write to the\
    \ database. These details are stored in the installation file.\n\nNow download\
    \ the Latest wordpress package from www.wordpress.org, unzip it and then rename\
    \ the file wp-config-sample.php to wp-config.php.\n\nFinally, open your browser\
    \ and go to the installation site of it. If you'll see the screen, enter the details\
    \ you created in the step above.\n\nIf you're not in a directory, find wp-config.php\
    \ in this folder.\n\n```php\n// This file contains all your WordPress database\
    \ settings.\n */\ndefine( 'DB_NAME', 'database_name' );\ndefine( 'DB_USER', 'database_user'\
    \ );\ndefine( 'DB_PASSWORD', 'database_password' );\ndefine( 'DB_HOST', 'localhost'\
    \ );\n\n/**\n * Unique secret keys for authentication and encryption.\n * Get\
    \ them here: https://api.wordpress.org/secret-key/1.1/\n */\ndefine( 'AUTH_KEY',\
    \ 'random' );\ndefine( 'SECUREAUTH_KEY', 'random' );\ndefine( 'KEYS', 'random'\
    \ );\ndefine( 'SECURE_KEYS', 'random' );\ndefine( 'WP_SALT', 'random' );\ndefine(\
    \ 'WP_SECURE_SALT', 'random' );\n\n/**\n * Database table prefix\n * Leave this\
    \ empty unless you are using multiple installations in one database\n */\n$table_prefix\
    \ = 'wp_';\n\n/**\n * Enable WPDEBUG.\n * Set this to true to enable debug mode.\n\
    \ */\ndefine( 'WP_DEBUG', false );\n```\n\nThe installer guides you through the\
    \ rest of the process, and you'll eventually find the Dashboard.\n\n## Divide\
    \ and conquer\n\nOne of the key features of WordPress is to make categories. for\
    \ visitors to find what they're searching for. For instance, you might have News\
    \ as subcategories.\n\n![](img/ddd273149103130953199fe3b160343f_69_0.png)\n\n\
    ## Setting up categories\n\nThe second step of the process is to make it easy\
    \ for visitors to find what they're searching for, with which WordPress menu comes\
    \ into play. This is the feature of a series of releases and demand support. Many\
    \ themes don't support multiple menus (the default). Then, you can always use\
    \ a menu widget (see below) to add a menu to site.\n\nFirst, go to the right-hand\
    \ side of the screen and click Add New to create a new category. Type the name\
    \ and button. Once you've done this, the categories on the left will become active\
    \ and you can select them using the checkboxes. Click Add to Menu and the option\
    \ will be added in alphabetical order. If it doesn't suit you, you can drag the\
    \ entries to reorder them.\n\nOnce you've written it with the order, Save Menu\
    \ and you can create as many as you like.\n\n![](img/ddd273149103130953199fe3b160343f_69_1.png)\n\
    \n## Creating the navigation menu\n\nThe section is split into how to create the\
    \ menu. There are various options that you can use to create entries: a Link (which\
    \ enables you to create menu entries to any site on the web), Pages (for linking\
    \ static categories). We are going to use the last of these to create our navigation\
    \ structure.\n\n> >- Your menu needs to ensure that the most important categories\
    \ and pages are near the top.\n\n# # Never miss an author issue Subscribe to the\
    \ #1 source for Linux on page.\n"
  mdcn: "\n\n## Wordpress：使用 CMS 让你的网站编辑更快速、更方便\n\n## 使用方法\n\n如果你需要快速写出一篇博客，没有什么东西能比得上\
    \ Wordpress。正如 Andy Channelle 所发现的，它是一个非常棒内容管理系统。\n\n![](img/ddd273149103130953199fe3b160343f_67_0.png)\n\
    \n![](img/ddd273149103130953199fe3b160343f_67_1.png)\n\n**专家**\n**Andy Channelle**\n\
    OpenOffice.org 的作者，《WordPress Liberty》的合著者，英国西区大学新闻媒体讲师。\n\n如果你正在考虑从一组简单的页面或博客创建一个网站，那么内容管理系统（CMS）是至关重要的。虽然完全复杂的设置过程非常困难，但它能让你轻松地为网站添加新内容和功能，这大大降低了复杂性，同时保留了真实内容管理系统的易用性。\n\
    \n最新版本的 WordPress 实现了这一点，它将五分钟安装、简单文章与新菜单功能、主题和文章类型结合在一起。凭借成千上万的主题，WordPress 给了你一个构建自托管网站的机会，而无需触碰任何\
    \ PHP 代码或学习 CSS 的复杂细节。\n\n在向网站发布内容的过程中，我们将向你展示如何充分利用其类 CMS 的功能，并介绍一些可以让你做得更好的插件。\n\
    \n你可以在任何服务器上安装 WordPress，或者如果你只想在线尝试，可以将其作为 XAMPP (https://www.apache.org/en/xampp.html)\
    \ 的安装。\n\n仪表台（Dashboard）是你进行所有工作的地方。它有一个中心工作区，默认包含有关你网站的信息，包括文章、待审核评论以及 WordPress\
    \ 的需求。\n\n## 编辑界面非常简单，但隐藏着丰富的功能。\n\n如果你的网站需要构建，软件顶部的信号会自动出现。通过一个简单的链接（你也可以对其进行安全保护），如果你在互联网上操作，可以在需要时立即实施这些操作。\n\
    \n浏览器左侧允许你访问系统的各个部分，仪表台可能会由你安装的插件决定，以及基础项：\n\n- **文章 (Posts)**：你在此处管理添加的内容。\n\
    - **媒体 (Media)**：让你访问上传到画库的图像、视频和文件。\n- **链接 (Links)**：用于向侧边栏或画库添加链接。\n- **页面\
    \ (Pages)**：用于创建如关于我们、常见问题和联系方式等静态页面。\n- **评论 (Comments)**：管理用户留下的评论，删除垃圾评论。\n\
    - **外观 (Appearance)**：用于配置网站的外观感觉，例如主题和页眉设计。\n- **插件 (Plugins)**：用于添加新功能。\n- **工具\
    \ (Tools)**：这些元素可以将内容和链接推送到你的网站。\n- **设置 (Settings)**：设置网站的配置选项。选项允许你重写网站名称和标语、日期格式、设置评论选项以及设置网站首页。\n\
    \n# Wordpress 教程\n\n# LINUX 格式\n在 DVD 上\nWordPress 3.1\n\n## Wordpress\n\nWordpress\
    \ 网站的基本元素是文章。它显示在网站的主博客页面或其他地方。要创建新文章，请从菜单中选择“文章” > “添加新建”。在屏幕顶部，你会看到一个“标题”字段——这是你输入文章标题的地方——下方是文本区域。文本区域顶部有一个工具栏，其中包含文本编辑选项，如加粗、添加链接和插入项目符号。这些功能的工作原理与标准文字处理程序非常相似。\n\
    \n## 文章秘密\n\n虽然 Wordpress 足够应对大多数情况，但对于更专业的用户，还有额外的选项。例如，点击工具栏最右侧的图标（所谓的“水槽”Kitchen\
    \ Sink）将显示出额外的选项层，它会过滤掉 MS Word 想要添加的元素，以及一组预定义的样式（包括标题 I 和段落）。为了获得更多控制，编辑器有一个\
    \ HTML 标签页，允许你编辑文章的代码，以便你进行检查或编辑。如果你想添加嵌入的 YouTube 视频、插件，或只是想对每篇文章的样式有更多控制权，这非常棒。\n\
    \n界面虽然简单，但如果你知道去哪里寻找，那里就隐藏着丰富的功能。工具栏上方是媒体栏，允许你插入图像、视频和其他类型的媒体。这里的选项之一有一个复选框，你可以从计算机中选择文件进行上传，或使用\
    \ URL 链接到内容。一旦你输入——无论是本地还是远程——所有内容都将被视为一个整体。当你将其插入文章时，请使用备用文本和其他元素。如果你定义了想要包含的文章，请点击“插入文章”将其添加到添加，它将在“媒体库”标签页下可用，或者当你的用户内容通过“画库”标签页访问时可用。\n\
    \n![](img/ddd273149103130953199fe3b160343f_68_0.png)\n\n- 添加新建文章提供了很多功能，包括命名绝妙的“水槽”按钮，它可以显示所有选项。\n\
    \n此外，这意味着你可以在“摘要”框中编写你的故事，它将用作内容的介绍和 RSS 摘要。右侧包含“发布”选项，可用于保存草稿、安排在稍后的日期发布或立即发布。你还需要使用“垃圾箱”选项来删除你的文章。\n\
    \n![](img/ddd273149103130953199fe3b160343f_68_1.png)\n\n## 安装\n\n在此文本编辑器中打开 php.config\
    \ 并在适当的位置编辑你的数据库，将所有文件移动到你的根目录或服务器上的某个文件夹中。\n\n如果你还没有准备好，将需要使用安装程序设置数据库，这将创建一个可以读写数据库的数据库用户名和密码。这些细节存储在安装文件中。\n\
    \n现在从 www.wordpress.org 下载最新的 wordpress 包，解压它然后将文件 `wp-config-sample.php` 重命名为\
    \ `wp-config.php`。\n\n最后，打开浏览器并进入它的安装站点。如果你看到了屏幕，输入上述步骤中创建的详情。\n\n如果你不在目录中，请在此文件夹中找到\
    \ `wp-config.php`。\n\n```php\n// 此文件包含你所有的 WordPress 数据库设置。\n */\ndefine( 'DB_NAME',\
    \ '数据库名' );\ndefine( 'DB_USER', '数据库用户' );\ndefine( 'DB_PASSWORD', '数据库密码' );\n\
    define( 'DB_HOST', 'localhost' );\n\n/**\n * 用于身份验证和加密的唯一密钥。\n * 获取密钥：https://api.wordpress.org/secret-key/\n\
    \ */\ndefine( 'AUTH_KEY', '随机' );\ndefine( 'SECUREAUTH_KEY', '随机' );\ndefine(\
    \ 'KEYS', '随机' );\ndefine( 'SECURE_KEYS', '随机' );\ndefine( 'WP_SALT', '随机' );\n\
    define( 'WP_SECURE_SALT', '随机' );\n\n/**\n * 数据库表缀\n * 除非你在一个数据库中使用多个安装，否则请留空\n\
    \ */\n$table_prefix = 'wp_';\n\n/**\n * 启用 WPDEBUG。\n * 设置为 true 以启用模式。\n */\n\
    define( 'WP_DEBUG', false );\n```\n\n安装程序将引导你完成剩余过程，你最终会找到仪表台。\n\n## 分而治之\n\n\
    WordPress 的核心功能之一是通过分类让访问者找到他们想要的内容，这时 WordPress 菜单发挥了作用。例如，你可以有“新闻”作为子分类。\n\n\
    ![](img/ddd273149103130953199fe3b160343f_69_0.png)\n\n## 设置分类\n\n过程的第二步是让访问者轻松找到他们想要的内容，这需要通过菜单来实现。许多主题不支持多个菜单（默认情况）。然后，你始终可以使用菜单小部件（见下文）将菜单添加到网站。\n\
