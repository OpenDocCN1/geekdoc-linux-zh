    ## 极核 Linux 教程


    ## 在局域网上进行救援


    我们目前为止所看到的救援系统在能力和易用性方面都有局限性，对于某些系统来说，在构建和维护费用上也是如此。


    现在，让我们施展魔杖，揭示一个无需承诺且随取随用（只要你需要——当你需要时它！）的救援系统。这个救援系统是一个位于独立机器上的 Linux 发行版，可以通过局域网连接到发生故障的机器。


    - 3 台机器：

    提供救援相关服务的故障机器。


    - Linux 系统（内核加文件系统）：

    被动的故障 Linux（Passive distressed Linux）不需要救援。因为它的文件系统没有运行，只需要它的一个副本即可恢复数据。


    - 提供网络和其他服务的 Linux 服务器：

    活动 Linux 宿主（Active Linux house）在故障机器上活跃运行。


    在故障机器上，被动的 Linux 与活动内核结合运行。在这种设置中，我们区分了内核和文件系统，它们来自不同的来源以执行救援。为什么呢？因为为了能够通过网络挂载其文件系统，并且最好能利用故障机器的特性，特别是网络适配器。


    救援机器持有一个或两个系统，但它们必须是完整的系统，且两个文件系统必须位于不同的磁盘分区上。救援服务器运行在故障机器上，它有一个用于分配 IP 地址和识别
    PXE 启动加载程序的 DHCP 服务器；一个用于提供内核镜像的 TFTP 服务器，以及一个用于根文件系统的 NFS 服务器。


    ## 故障机器


    故障机器至少一个具有 PXE 启动能力的网络接口控制器（NIC）——NIC 可以获取 IP 地址并从 DHCP 服务器下载内容。否则，BIOS 将启动启动设备列表中的下一个设备。PXE
    机器可能会有一些观察：为了选择设备和启动而显示一个旋转线条动画。还有其他替代方案（BIOS 之后），例如 PXE (http://org)，但它们需要更多工作来设置，并且需要额外的步骤来从软盘或软磁盘启动。


    救援机器需要配置网络接口以及通过内置的 NFS 挂载根文件系统。这包括网络接口驱动程序、NFS 客户端、网络配置和文件系统。内核参数应设置为 `CONFIG_IP_PNMP`、`CONFIG_IP_PMP`；DHCP、NIC
    驱动（仅使用一个以太网驱动程序），以便控制使用哪一个进行 PXE 启动。你还需要设置 TO 为 `CONFIG_EXT3_FS` 或 `CONFIG_EXT4_FS`（取决于根文件系统的类型）、`CONFIG_NFS_FS`
    和 `CONFIG_ROOT_FS`。


    生成这些后，将其复制到镜像中，由 Plinux（网络启动协议）引导。


    ## 服务器系统


    - Plinux 是 Syslinux 软件包的一部分——http://syslinux.org/wiki/index/PLINUX。从 Plinux 中需要的唯一执行文件是救援服务器。某些机器现在可能需要不同的版本——所以我们在
    ISO 中使用了 Plinux 0.40 版本。


    - DHCP 服务器 (dhcp)

    - TFTP 服务器

    - NFS 服务器


    现在我们需要配置文件并定义你的名称和地址。例如所示：


    - 服务器机器的 NIC MAC 地址为 172.24.1.40

    - 故障机器的 MAC 地址为：00:11:22:33:44:55

    - 首次刷入 Plinux 的内核为 linuxux-2.6.36-generic

    - 活动系统的文件系统运行在 `root=/dev/sda`


    活动系统的 DHCP 配置 `/etc/dhcp.conf` 应该如下：


    ```

    default-state: infinite

    subnet 172.24.1.0 255.255.255.0 {

    lease-time 3600

    max-time 3600

    option-router 172.24.1.1

    option-domain-name 172.24.com

    option time-offset = -8

    }

    ```


    ```

    {

    filename = "mlinux"

    host = {

    hardware ethernet=aa:bb:cc:de:ee:ff;

    fixed-address=172.24.1.42;

    option-name = "distressed"

    }

    }

    ```


    活动系统的 Plinux 配置 `/tftpboot/pxlinux/01-aa-bb-cc-de-ee-ff.cfg` 看起来如下：


    ```

    group

    default

    timeout 100

    kernel linux-2.6.36-generic

    append root=/dev/sda rw ip=172.24.1.40//root_fs\ip=172.24.1.42:172.24.1.40:172.24.1.250:distressed:none
    roxtype=ext3

    ```


    ## 如果不再有问题，请订阅第 68 页的 Linux 领先来源


    ## 硬核 Linux 教程


    此配置文件中没有 initrd，内核本身将挂载其根文件系统。服务可能会因为这个结果而失败。


    注意，如果根目录是以读写（rw）而非只读挂载的，内核就可以检查 NFS 挂载的根文件系统是否存在错误。你应该在另一台机器上对文件系统运行 `fsck` 以节省时间。


    - NFS 导出一个条目 /mnt/A_root_fs /mnt/A_root_fs/172.24.1.2/linux_subtree_squash

    - TFTP 服务器应配置为使用 /root 作为其目录。这可以通过标准内核实现


    ## 活动系统


    以下步骤必须在故障机器运行 Linux 时（即在它被破坏之前）且救援机器运行 Linux 且其根文件系统以读写模式挂载时以 root 身份执行：


    - 将内核模块复制到 `/v6.26.36-passive/modules`。从这个被动的 Linux 根目录到活动根文件系统的相同目录。跳过 `build`
    和 `source` 子目录，它们不需要。


    实现此点的另一种方法是从故障机器通过 `scp`：


    ```

    cd /v6.26.36-passive

    scp -r root@remote_host /mnt/A_root_fs /v6.26.36-passive

    ```


    `mdev` 是做什么的？


    - 内核需要的设备必须存在于 /dev 目录中。运行以下：


    ```

    mdev -s 1

    mdev -s 1

    mdev -s 1

    ```


    ## 优势系统


    系统安装创建的可能重新配置内核网络接口的守护进程（例如 Network manager）必须关闭。


    - 需要特殊的 `/etc/stab` 版本，不包含本地文件系统的条目，并且当系统中根文件系统时。

    - 恢复工具必须安装在活动系统中；这在故障机器上运行时也是需要的。


    第一行定义了设备 eth0 被命名，第二行指定了忽略 NIC。如果用户没有针对此生成规则，则存在名为 `/etc/udev/rules.d/75-persistent-network-generator.rules`
    的文件，或者如果你运行它将不会禁用 `eth0 > /etc/udev/rules.d/75-persistent-network-generator.rules`。


    '
