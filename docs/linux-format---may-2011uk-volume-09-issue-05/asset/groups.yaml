    # Newsdesk


    # Comment

    ## LibreOffice''s progress


    ### Hitting the mirrors

    What''s behind the free software sofa?


    Michael Meeks


    It was a busy month, with the LibreOffice community continuing to grow vigorously.
    At FOSDEM, we had to experience the burgeoning of enthusiasm from all and sundry
    for what we''re doing. Wonderful, to have a well-attended room with lots of people
    learning how to get into LibreOffice development, how the writer core really works
    and so.


    A new version of Scientific Linux, a Red Hat Enterprise-based distro, has been
    released. The software attempts to satisfy the requirements of organisations like
    CERN, Fermilab and universities. Much of the software included is now available
    through the Fedora-led EPEL, the changes are less significant than in previous
    iterations. www.scientificlinux.org


    My talk getting involved in our various, entry Easy Hacks (see the wiki page),
    had nearly many attendees as there were, provoking a burst of research and work
    to increase the depth of there. Of course, we gave out more than a thousand stickers
    – stuck boxes of laptops, T-shirts and so on. The message helped, finally, properly
    received. I spoke on the joys of – improvements in LibreOffice, as well as the
    dangers of corporate ownership, which can pollute and stifle the atmosphere of
    equality and respect most projects.


    - Scientific Linux uses elements for version codenames – 6.x is ''Carbon''.


    It is some time now, but the new version of Inkscape has hit the mirrors for 80
    bugs that need to be squashed before the next, more significant feature could
    be released. As with improving stability and fixing few problems that arise from
    upgrades in GTK the new version should also perform better when dealing with images.
    http://inkscape.org


    This month, released 3.3.1 – our first minor release saw a large number of fixes
    and improvements. We also introduced some alternative new icons – a key of our
    design team. Stable point releases are to happen monthly, and incrementally catch
    up by release.


    - With bugs, Inkscape can look forward to bigger changes.


    # WEBROWSER


    The first release of Firefox 4 has the Mozilla codenames with a massive number
    of changes – not which is a complete overhaul of the user interface. A changed
    release cycle is running up to Firefox. In 5. addition to new features such as
    intelligent tab management and a new-Chrome configuration menu, Firefox 4 improves
    rendering performance between three and six times various optimisations in its
    JavaScript engine. Added support for SVG images, WebGL for 3D graphics and Web
    Form HTML5 video.


    Much work was left after merging in six months of OpenSLICE to prepare for the
    4-feature debut – and to deconflicting task. As I resolve various conflicts, I’m
    reminded the amount of hard work and leaked cash that has gone into LibreOffice.


    # SUSE


    SUSE in Germany now picked up a box of OpenSUSE 11.4 from Open-Linux. The product
    launch aims to give users access not just to open source software, but also to
    support that goes beyond usual forms and details. The distro is really cutting
    edge, with versions of Firefox 4 and KDE 4.6 while LibreOffice offers OpenSUSE.
    Support is available in both English and German


    Finally, the $55,000 we needed to ensure survival of the Document Foundation,
    thanks the generosity of 2,000 donors. For those who can translate, or test, this
    is a way to make a contribution to a future of freedom.


    - The boxed version of OpenSUSE is coming to a near year.


    > Michael is a pseudo-engineer, semi-colon-lover. Novel OpenOffice.org hacker
    and amateur deputy.


    http-open-slx.com


