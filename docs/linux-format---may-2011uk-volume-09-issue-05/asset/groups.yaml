    # MythTV


    ## 基础用法


    ![](img/ddd273149103130953199fe3b160343f_41_0.png)


    到目前，你已经安装了 MythTV，设置了后端，并且应该已经看到了各种形式的前端界面。


    如果前后端是分离的，第一件事要告诉它们进行连接。当你启动一个未配置的前端时，系统会自动提示你执行此操作，但如果没有提示，或者你想更改，设置可以在 `Setup（设置）
    > General（通用）` 中进行。你需要设置主机名和三个 MySQL 设置——数据库名、用户名和密码。前两个项不太可能不是 `mythconv` 和 `mythtv`
    以外的内容。密码以及另外两项可以在后端的 `/home/mythtv/mythtv/mysql.txt` 中找到。


    我们将参考使用键盘来控制 MythTV。遥控器是通常的方法，但按钮映射会映射到按键上——按键本身是一致的，而每个遥控器都是不同的。我们将统称为遥控器。


    ![](img/ddd273149103130953199fe3b160343f_41_1.png)


    ## 逐步操作：管理你的记录


    ![](img/ddd273149103130953199fe3b160343f_41_2.png)


    ![](img/ddd273149103130953199fe3b160343f_41_3.png)


    本期的参赛者比上次要好。献给《来自 April 月的喜剧》、皇家空军轰炸司令部以及 Trevor White。


    ![](img/ddd273149103130953199fe3b160343f_41_4.png)


    ![](img/ddd273149103130953199fe3b160343f_41_5.png)


    ![](img/ddd273149103130953199fe3b160343f_41_6.png)


    ![](img/ddd273149103130953199fe3b160343f_41_7.png)


    ## 2 开始录制


    我们还没有录制过任何内容，请前往 `Manage Records（管理记录） > Scheduling（调度） > Program Guide（节目指南）`，在那里使用下面的按钮显示正在录制状态的节目列表。使用方向键选择你想录制的节目。如果你按下
    Enter 键，将显示以下屏幕……


    ## 3 录制剧


    ……你可以在那里设置录制选项。该选项是 `Record At Time On Channel（在频道指定时间录制）`。换句话说，剧录制将在每个频道上录制。这有助于
    MythTV 进行调度，因为它为每个频道都创建了记录。除非你编辑计划中的 `Options（选项）` 部分，否则 MythTV 默认显示每个集的一集。


    ### 自定义录制规则

    名称：mythtv


    ![](img/ddd273149103130953199fe3b160343f_41_8.png)


    ![](img/ddd273149103130953199fe3b160343f_41_9.png)


    以下节目已经录制，并将出现在你的列表中。


    ![](img/ddd273149103130953199fe3b160343f_41_10.png)


    ![](img/ddd273149103130953199fe3b160343f_41_11.png)


    ![](img/ddd273149103130953199fe3b160343f_41_12.png)


    ![](img/ddd273149103130953199fe3b160343f_41_13.png)


    ![](img/ddd273149103130953199fe3b160343f_41_14.png)


    ## 1 检查冲突


    前往 `Manage Records（管理记录） > Recordings（录制）` 查看将要录制的内容。红色高亮和右上角的消息显示所有冲突。如果有列表，意味着
    MythTV 正在录制该节目的晚些场次（你可以在下方看到）以避免冲突。


    ## 3 排序你的优先级


    记录的调度选项具有优先级设置。这不会避免冲突，但有助于 MythTV 决定录制哪个节目，如果你发现冠军联赛的比赛与你喜爱的节目冲突了。


    ## 4 制定你的规则


    你不一定需要使用节目来设置录制——你也可以使用 `Custom Rules（自定义规则）` 从头开始创建录制。如果你想录制时间总是不相同的节目，或者例如在凌晨
    4 点到晚上 10 点之间录制纪录片，这非常有用。


    LFX144 2011年5月


    www.mythtv.com


    ## 问题时间


    使用 MythTV 并非没有挫折，所以现在我们回答一些常见问题。


    ## 常规（高级）


    ![](img/ddd273149103130953199fe3b160343f_42_0.png)


    | 节目开始前的提前录制时间（秒） | 300 |

    | :--- | :--- |


    | 我可以减少节目指南中显示的频道，以便只显示我可能感兴趣的频道吗？ | |


    | 节目结束后的录制时间（秒） | 600 |

    | :--- | :--- |


    你可以这样做，可以通过在 MythTV 设置编辑器中删除频道，或者创建频道组（Channel groups）。频道组是首选方案，可以在 `TV settings（电视设置）`
    中找到。定义了一个 `favourites（收藏）` 组，你可以使用其中一个或创建其他组进行录制，因为默认情况下，它们都被选中了，直到你不再想要它们为止。在节目指南中，包括
    Al Al 频道。TV 部分还有一个选项，你可以为每个频道设置默认频道组，无论你上次用的是什么。 |


    | 分类随时间录制 | 运动 |

    | :--- | :--- |


    | 录制超过节目结束（分钟） | 否 |

    | :--- | :--- |


    频道组仅限制节目指南中显示的未用于录制的频道，因此你也可以通过移除 +1 频道来减少频道，而不必失去它们提供的灵活性。同时，但不是 BBC One。ITV
    和 Film4，因为它们都在独立的倍频上，在英国 Freeview 电视上总共有六个。如果有六个调谐器，你可以录制一切，但你可能永远没有时间看完它们。


    ## 电视卡不够用？


    ## 安全缓冲


    如果我想录制重叠的节目，我需要多块电视卡吗，还是可以将一张变成多个频道？我更倾向于早几分钟开始，晚几分钟结束。这比直接看节目然后因为开始晚或超时而错过结尾要好。


    如果你正在使用 DVR，这意味着将多个频道合并到一个流中。我想为每个 DVR 调谐器卡额外录制一个频道，并将其分成多个频道。


    有两种方法可以配置此项。第一是前往 `Setup（设置） > TV Settings（电视设置） > Recording（录制） > Prioritize
    Sorting（优先级排序）`。在这里，你可以设置 `Start Early（提前开始）` 和 `End Late（延迟结束）`。这些是录制的默认设置，可以针对单个规则进行更改。注意，如果你尝试录制无接的节目，这可能会导致冲突。频道组仅限制节目指南中显示的未用于录制的频道，因此你也可以通过移除
    +1 频道来减少频道，而不必失去它们提供的灵活性。


    | 频道 | 频道 |

    | :--- | :--- |

    | 1 | ITV |

