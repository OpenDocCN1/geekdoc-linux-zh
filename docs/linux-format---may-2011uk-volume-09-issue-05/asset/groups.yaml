    诺丁姆新闻

    诺丁姆 Linux 用户组联系到了一个来自中部的部的公告：“NotUG”（诺丁姆）已与市滨岸的 Fellows、Melton 和 Clayton 酒吧合作：我们是一群友好、非正式的极客，对
