    ## 滚动发布


    固定版本发布对于发行版的营销和推广很有处：随着发布日期的临近，知名度和兴趣随之增加。它们为 Ubuntu 派对提供了绝佳的理由。但一旦安装了系统，固定发布就会变得很麻烦，除非在新版本发布后使用
    `apt-get` 进行 `dist-upgrade`。但这与滚动发布不同，在滚动发布中，你需要的时随时可以获得最新的软件包，而不仅仅是在新版本发布之后。


    ## 让 Ubuntu 正式化


    LXDE 是一个极佳的轻量级桌面，比 Xce 好得多——即使对于视频编辑也是如此——但 Ubuntu 仍然是一个非官方的抵抗。是时候让 Ubuntu 获得
    Ubuntu 的认可，并被 Ubuntu 官方认可为旧设备以及想要标准桌面体验的网络用户的替代方案了。


    ## LVM 分区


    如果你避免了分区，Ubuntu 应该考虑在安装程序中使用 LVM。现在 Fedora 已经这样做了，遵循了一种简单的根目录空间设置方法以及一个用于管理和调整卷大小的图形工具。现在改变一下，让用户将他们的系统改为


    ![](img/ddd273149103130953199fe3b160343f_50_0.png)


    ## 简单的解码器安装


    使用 DVD 并声称“LVM 坏了”，是因为它无法在选项中找到 Ubuntu 仓库，但如果你不知道如何操作，像 Meduntu 那样搜索并添加仓库会更费力。如果
    Ubuntu 能在安装包设置期间从其他地方下载并提供安装第三方仓库


    > “百害必争”倡议是好的，但它需要更多。


    ## 使用 RPM


    RPM 对 Debian 来说是一种更优的包格式——为什么 Linux 标准基础 (LSB) 不选择 Ubuntu 呢？


    放弃 Debian 上的很多创新会有帮助，而且事实证明，如果放弃 Debian 软件包并升级到 RPM，在其他领域（如 Wayland 和 Unity）将发生重大变化。


    ## 为我们提供最小化/网络安装


    对于那些拥有快速连接的用户来说，下载完整的安装包是没有必要的。我很确定用户已经注意到了 CD 启动盘，它们只安装所需的软件包。这是一个好主意，并且会加快安装速度，因为你不需要在启动之前下载几个
    GB 的数据。


    ## 不要孤独


    从 Rybreeze 切换到 Mashbox 是一好事，但来自 Ubuntu 的 75% 主题都消失了吗？Gnome 在没有分析的情况下继续运行。此外，为什么不使用
    Gnome 呢？如果它有自己的商店，但为了几乎所有的佣金让竞争对手的用户加入，这种沉重的方法应该三思。


    ## 你必须使用 UUID 吗？


    毫无疑问，Ubuntu 的臃肿看起来像一团糟。UUID 对于安装来说很好，尽管它们有文件名，但至少作为一个选项提供了人类可读的格式，我不怀疑这正是该处的内容。使用
    LVM 会让这一点变得重要。


    ## 修复问题


    我知道开发者正在尝试新功能，但过程中小问题不断出现（或者 WIF 对新事物的反应）。Edge 可能会吸引新用户，但可靠性和稳定性真的需要解决这些小问题（漏洞），因此需要付出更多努力。Ubuntu
    的改进是好的，但它需要更进一步。


    ## 市场


    某些公司决定选择 Linux 的原因之一是无人向他们展示其潜力。Ubuntu 处于可以做到这一点的位置。拥有大量的用户、商业机构的支持以及自己的商店，如果任何人都能说服开发者考虑
    Ubuntu/Canonical。Ubuntu 是一个使用 LXDE 桌面的很棒的重编译。给它官方背书。


    ![](img/ddd273149103130953199fe3b160343f_51_0.png)


    认为你正在为软件自由贡献力量？再想想！让我们一起更加努力传播这个信息，在这个问题上，Andrew 发出了战书……几周前，我们听了 TuxRadar 播客（由
    LXF 团队制作），他们分享了将新用户转化为 Linux 事业的经验，我们对收到的回复之多感到惊讶，以及人们与我们分享的极其积极的故事感到惊叹。


    在整个网上，人们愿意花时间和安装 Linux 并为朋友、家人、邻居和同事提供支持。你们有些人是因为热爱自由软件而这样做，你们另一些是因为厌倦了修复损坏的软件或帮助清除病毒。为了让你们做同样的事情，我们为所有潜在的转化者编写了一份指南，并发出了号召。如果你能传播信息并帮助某迈出
    Linux 的第一步，你将使世界变得更好。2013 年会是桌面 Linux 之年吗？我们确实不知道，但如果我们不投入努力使其实现，它就不会是。


    ### 第一步：了解使命


    你首先需要知道你打算尝试帮助谁。如果你认识喜欢玩最新游戏、在互联网上复制并经常遭受恶意软件侵害的 Windows 用户，如果他们只安装了最新的 Ubuntu
    却发现 Cron 可以用，他们是不会善待 Linux 的。


    - 你可能认识那些电脑运行速度没有应该那么快的人，或者对病毒感到沮丧的人。天哪，自从我们的出版物《PC Plus》以来，还有微软正在缓慢停止对 Windows
    XP 的支持。如果它通过新软件（例如新的 Windows XP 服务包 2012 系列程序）已经得到了改进，不要期望 XP 的性能会有很大提高，除非你有 SSD
    硬盘。


    ![](img/ddd273149103130953199fe3b160343f_52_0.png)


    ### 从 Vista 升级


    这对我们的听众来说似乎是事实。Matt 回想起他困惑的女友，但她的 Windows 了：“我的妻子几年前买了一台预装 XP 的电脑，但它运行很慢。Barry
    在同一天把它换成了 Ubuntu，从那以后她一直在用 Linux。”她在几个月后换回了 Ubuntu：“我没有遇到任何问题。她对它很满意，所以我很满意。”这引出了我们的下一个点：


    ### “你的第一个转化目标是：不满的 XP 用户。”


    人们创建了 Windows 用户，如果他们仍在使用它，你应该帮助他们。为了一个老时代！如果你知道某人深受病毒困扰，你应该提到强大的 Linux 内核。


    Mylyn 说：“自从圣诞以来，我在五台机器上安装了 Linux Mint，我对这几个月非常满意。我的邻居认为我是那个在 Windows 病毒后让他们的机器恢复的人。”我兄弟也觉得
    Linuxuser很好：“为他安装了 Ubuntu 9.04，但他一直在抱怨升级……”这导致了我们关于支持的问题：


    > 我们不喜欢 Mint 的系统，但它对于习惯了 Windows 的新用户来说是完美的。


    '
