    # # How do I...?


    If you''re new to Linux, after installing OpenSUSE you may be unsure how to do
    certain tasks. Here''s a list of the common problems and how to get them done...


    +   - Manipulate your files Click the blue filing cabinet on the bottom panel
    on the desktop to store and access your personal documents.


    +   - Play music and Videos via the green Gecko icon in the bottom-left, go to
    > Multimedia to explore the programs included.


    +   - Edit Images Click the Gecko icon and go to Graphics > Image Editor for GIMP
    a versatile tool that has many high-end features to rival Photoshop.


    +   - Chat online in the Internet menu, see the Chat submenu for programs that
    you can use for micro-blogging and chatting on IRC networks.


    +   - Configure the system in the Gecko menu, go to the Computer tab and find
    Yast for a highly powerful program that configures all aspects of the system.


    +   - Get new software Click Gecko > Computer tab > Install/Software to download
    and install thousands of programs from the internet.


    +   - Shut down the Gecko has a Leave tab for logging out of the current user
    or halting the machine.


    OpenSUSE is backed by a lively and friendly community, and there''s no shortage
    of help resources if you get stuck. First of all, click the Gecko icon and go
    to > Help to bring a guide up to using the system. On the desktop you''ll see
    an icon for Online Help, which provides links to resources on the internet, as
    No Novell''s official


    ![](img/ddd273149103130953199fe3b160343f_92_0.png)


    documentation. If you need to ask a question to OpenSUSE users, visit forums.opensuse.org.
    The forums have experts of openSUSE fans on hand to point you in the right direction
    - just provide some information so they can quickly provide you with friendly
    help and we have our own at openlinux.com/forums. Good luck!


    OpenSUSE''s desktop is a slick, smooth KDE 4.6 with access to plenty of widgets.


    # Don''t miss...


    ![](img/ddd273149103130953199fe3b160343f_92_1.png)


    KDE 4.6

    The new desktop is full of tweaks, such as the snapshot tool to save to many different
    websites.


    LibreOffice 3.3

    OpenSUSE 11.4 is one of the first distributions to ship with this faster, better
    OpenOffice.org fork.


