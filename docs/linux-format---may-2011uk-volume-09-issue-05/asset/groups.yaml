    # 16 things we''d change about Ubuntu


    Ubuntu is a popular distro, but everything in life, it isn''t perfect. There''s
    plenty that could be improved, both in terms of software and the way it goes about
    thinking things. Neil Bothwich has a few suggestions.


    +   01 Show how it helps

    This was done rounds recently. "What many people don''t understand Linux development
    is that it''s truly a team effort: Red develops the kernel, Ubuntu takes the credit"
    - it''s a little unfair on Ubuntu, maybe that''s because it doesn''t get credit
    for what it do - such as making Linux more possible for the masses. If so, it
    should blow its own trumpet more.


    +   02 Colour choice

    What is it with Ubuntu''s colour? it''s not just the drabness of some palettes
    - the pretty colours were taken by others - but the way it changes with release.
    Ubuntu has used every possible shade of brown, from dark to ochre, with no pattern,
    switching to strange auburne. Some of consistency would be needed. Anyway, if
    we didn''t like the colour, we have time to get used to it.


    +   03 Home partition

    I''ve complained about this in reviews and got a quick response from Ubuntu, but
    nothing convinced me that lumping your data in the root


    partition is a good idea. Kludging the installer to delete parts of the root filesystem
    instead of formatting it to preserve /home why /home should be separate in the
    first place.


    +   04 Release cycle

    The six-monthly release cycle, set for release by the last day of April and October
    each year, is a hindrance. It builds adaptability, but it also forces developers
    to release code before it''s ready. This affects software developers having to
    plan marketing and advertising to coincide with the release. It also means that
    Ubuntu makes each release distinct from the previous one in some way, but


    with the colour scheme, but buttons or default software choices. Free software
    should be ready for Debian. Now that deab it''s so much more mature, a longer
    break would enable Ubuntu to make the new additions with more time for testing.
    could even find release easy, instead of frantically fixing bugs at the eleventh
    hour.


    +   05 Explain the changes

    For change its sake is pointless, and if you don''t explain why you changed something
    it will be perceived as such. An upgrade, or a full installation over a previous
    Ubuntu, should open a list of changes and the reason for them in a browser when
    they first boots. Don''t just move the buttons and let it run


    +   06 More user testing of ideas

    It''s great to see a major distro experiment with alternatives to established
    software, such as Wayland and Unity, but a full distro release is hard to try.
    Maybe Ubuntu should have some sort of testing, branch users get these changes
    before they make it into the full release. This isn''t the same as an alpha or
    beta release, which should be done before an idea makes it into that.


