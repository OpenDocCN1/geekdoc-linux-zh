    # Roundup

    Every month we compare tons of software so you don''t have to!


    ## Graphical plotters


    One graph is worth more than a thousand numbers, but how do you plot it? Marco
    Fioretti looks at five different ways to do that.


    ![](img/ddd273149103130953199fe3b160343f_29_0.png)


    # How we tested...


    The programs that are described on the next pages have all been tested on a dual
    core AMD 64 3800+ with 8GB of RAM, running Fedora available as of February 2011.
    To choose what to include in this Roundup, we only looked for programs dedicated
    to calculus and function plotting. That meant no spreadsheets. All other traditional
    spreadsheets are very good, but they are different kinds of programs, and are
    less flexible than special purpose applications. As well being a calculator/plotter,
    the other requirement was that a program must install and run without problems
    on modern systems, and generate out data files or user-supplied formats.


    ![](img/ddd273149103130953199fe3b160343f_29_1.png)


    # Our selection


    - Grace 31

    - Gnuplot 32

    - Kaebra 33

    - Kplot 34

    - Kayalli 34


    For graphical plots, we mean software programs that help you to make sense of
    data or mathematical expressions through generating and analysing the corresponding
    charts. There''s no doubt that these are niche products compared to every other
    program such as file managers or email clients. However, function and data plotting
    is really enough to justify a Roundup, so so few people use data every day, but
    the majority of computer users need to create them once in a while.


    The preferred method for many is to plot a chart from a spreadsheet, but there
    are limits to what you can do in that way. Standalone programs often offer much
    more whenever you need graphs for incorporating into a blog or big project. Some
    people draw charts for fun, but a diagram is useful in all sorts of situations
    from a school report to showing your parish bish how much extra money was raised
    in the last year. These are all messages that me well-made charts can clarify
    everything. We live in a world where data is controlled and opposed by high quantities
    of numbers. Being able to transform numbers quickly into a chart can help you
    discover their true meaning and impact on your life, becoming more necessary as
    part of a quality education and to find or keep a good job.


    > Being able to quickly transform numbers into a chart can help you discover their
    true meaning.


    # Grace

    ### A plotting and statistical analysis application from the good old days of
    Unix.


    This is a good program, but better to find than you''d expect. The official name
    of the executable is Grace. The one that you want to prompt at or to run your
    system menu is grace.


    The look and feel of Grace really sets it apart from its competitors - whether
    it will make you pray or it is easy to use. Users who first met graphical desktops
    in the last decade will be confused, while those who started using them in the
    previous millennium will be struck by nostalgia. Grace is an old-looking program.
    Its built with Motif-style widgets is quite unusual for Unix-like desktops. This
