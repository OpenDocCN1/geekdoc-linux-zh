    ## Linux 发行版评


    ## OpenSUSE 11.4


    在 Novell 被出售后，该发行版的粉丝一直屏息以待它的首次发布。Mayank Sharma 很高兴地报告，一切如常。


    ### 简要介绍...


    -   最受欢迎的社区发行版之一，类似于 Ubuntu 和 Fedora。


    在去年出售后，关于 Novell 赞助的发行版的未来存在许多不确定性。OpenSUSE 拥有一个异常的八个月周期，而不是发布之间的六个月。尽管作为一个社区发行版，许多人好奇在其实主要赞助商被收购后是否会有更多发布，但像时钟一样，下一次过渡已按时出现。


    该发行版功能丰富，比其他发行版更为明显，通过包含经过良好测试的稳定软件和即将发布的新版本，在稳定性和前沿现代性之间取得了平衡。


    OpenSUSE 11.4 是一个几乎仅用于安装的发行版，还有针对 KDE 的独立 ISO 镜像。图形安装程序提供了复杂的选项，专家可以利用这些选项做出更好的默认选择，而这将引导新手完成整个过程。该领域特别如此，默认提供
    LVM 分区方案，并允许老练用户进行调优以安装他们喜好的磁盘布局。


    ### 内部机制


    在发布前，后台有大量的活动。除了在六个里程碑版本和两个候选发布版本之间的漏洞修复外，SUSE 团队组织了 Open-Bugs 来帮助处理开发中的版本。


    ### 功能概览


    OpenSUSE 11.4 在生产力与合适的数量之间取得了平衡。在活动期间，参与者处理了 132 个漏洞。


    11.4 中另一个不那么显眼的改进是 2.6.37 内核。它支持许多驱动程序（包括新的开源驱动），并增强了 DisplayLink 以及几个提高响应能力的补丁，包括对触摸板补丁的修复。此外对
    OpenSUSE 的默认文件系统 Btrfs 也有更好的支持。


    总之，OpenSUSE 在设备上变得更加流畅。它在我们测试的所有类型硬件上运行得完美无缺，包括带有 Nvidia 显卡的双启动设置、带有触摸屏的 Acer
    笔记本电脑，以及带有 AMD 显卡的 Lenovo 笔记本电脑。


    继 Ubuntu 之后，由于硬件抽象层 (HAL) 终于在工具的支持下被 udev 取代，最后几个需要的软件包已迁移到新站点。虽然确实有地方可以用系统守护进程替换旧的
    init 脚本来管理和服务启动，但开发者在 11.4 中仍然坚持使用 Yaast。发行版仍然使用 Grub，它已完全集成到 Yast 中，但在可用仓库中。


    SUSE 需要管理员，在该发行版的方面还有许多改进之处。OpenSUSE 的最新版本使用 freedesktop 标准而不是 X，这为工具包提供了更好的支持，但
    NetworkManager 以及最新的 VirtualBox。Web 界面也包含在 Yaast 中，这是最初为你的 Linux 服务器安装的最优工具，并提供最好的社区软件包。


    提到 Yaast，驱动 Yaast 和命令行管理器的软件管理引擎得到了改进。它现在可以安装软件包了。


    ### 桌面王国


    尽管 OpenSUSE 安装程序为你提供了安装 KDE 或 Gnome 的选项，但它选择了 KDE。OpenSUSE 11.4 是第一个带有 KDE 4.6
    的主版本发行版。它是 OpenSUSE 11.4 稳定版中最好的，截至 2 月份的 beta 版本。


    ### 硬件支持


    由 Linux 内核 2.6.37 驱动，它可以在一系列硬件上扩展。


    ### Linux 发行版评测


    OpenSUSE 11.4 是首批出带 LibreOffice 而非 OpenOffice 的主流桌面之一。尽管早期版本中存在集成问题，LibreOffice
    现在已很好地集成到 KDE 和 Gnome 桌面中。


    ### 最新软件


    该发行版的另一个首创是 Firefox 4。OpenSUSE 11.4 附带了即将发布的重大版本的 beta 版本，该版本具有经过改进的界面、新的内置搜索框、改进的插件和扩展管理器以及更多功能。作为带有插件的
    beta 软件，Firefox 播放了各种内容且从未崩溃。


    此外，在仓库中可以找到 Google Chrome 浏览器的最新版本，KDE 的 Konqueror 现在由 WebKit 驱动。如果你不想使用插件，Gnu-flash
    player 现在可以通过 GStreamer 和 VLC 播放来自 YouTube 和其他网站的视频。


    此外 KDE 代码在有限的硬件上看起来很好，在笔记本电脑有限的桌面区域也是如此。


    带有原生代码，OpenSUSE 11.4 还有一些额外内容，如 Kont 和 Amarok。KDE 很好地集成到 OpenSUSE 中，这使得非原生应用（如
    Firefox）感觉如归其家。事实上，KDE 的氧 主题在使用 GTK 工具时也很好。


    OpenSUSE 11.4 对用户、系统管理员和开发者来说是一个极佳的发布。它比其他 KDE 发行版更流畅，并且在所有配置中都感觉很棒；从基于原子的工具链到网络启动器和多核心桌面。软件集也充满了最新的软件和如日期的最新发布。


    OpenSUSE 11.4 比主版本 Gnome 3.0 提前提供了几个功能。这意味着它包含了 Gnome 3.2 的主要组件，以及[见 On Earth
    Gate，第26页]的内容， Gnome Shell 也是真实的。根据 Andreas Jaeger 的说法，该项目创建了一个 live CD 供用户评估
    Gnome 3.0，并且不会提供通过构建的 KDE 环境完成视觉界面的简单方法。OpenSUSE 封装了许多附加应用程序，如 Aylur、Barley Rhythms
    和 Spotify。OpenSUSE 11.4 包含了广泛的应用程序以满足你的所有需求，你只需要释放包即可获取其他内容。它不安装专有解码器和插件（如 Flash
    和 MP3），但默认情况下，当你需要时它们都会被选中安装。


    如果社区对该发行版的未来有任何疑虑：OpenSUSE 项目有两个主要任务，一个带有 YaST 软件管理器的镜像，YaST 在安装软件包时自动关闭非常有用。然而，如果你想查看安装过程的摘要或重启，则可以更改此行为。


    Evergreen 项目为已达到维护终期 (EOL) 的过去 OpenSUSE 版本提供支持和更新。这包括 OpenSUSE 11，它仍然非常新。


    相反，Tumbleweed 适用于于那些不想等待几个月来尝试软件稳定版本的急躁 OpenSUSE 用户。Factory 仓库使 Tumbleweed 包含被认为合适的软件包的最新版本。


    '
