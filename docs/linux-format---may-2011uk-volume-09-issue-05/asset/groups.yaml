  mdcn: "\n\n## Bash 教程\n\n通知系统作为用户交互手段，其缺点是显而易见的。虽然它能让你方便地向桌面用户发送消息，但让用户对运行中的程序提供反馈的范围有限。\n\
    \n在我们之前涵盖的大部分内容，这一行是最棘手的部分。目标变量是通过反引号表达式设置的——Bash 将执行反引号内的命令（使用键盘上 UK 上方的按键），并将输出替换为它生成的内容。如果没有这个反引号让事情复杂化，理解起来会更简单。\n\
    \n由于 Unix 哲学——即为非常特定的任务创建独立的工具，并将它们结合在一起以实现复杂任务——你可以做任何事情。很少有人能意识到这一点，主要是因为他们不敢尝试那令人生畏的命令行。\n\
    \n首先要意识到 `dialog`（对话框）是一个命令。它后面紧跟着一个开关，用于指示对话框的类型以及相应的参数。在这种情况下，我们使用了一个 dialog\
    \ 选择器，它接受一个条目（对我们来说是这一列）、高度和值。那么这些菜单滚动条是怎么回事呢？在加入它之后，原作者决定将结果发送到 STDOUT（标准输出）。\n\
    \n为脚本获取输入并不新鲜。在 Bash Shell 中，你不能简单地做到：\n\n```\n-p \"How great is this?\" --input\
    \ echo I1 agree it is simple\n```\n\n# Xdialog 允许一些额外的选项，用于字体选择和对话框渲染。\n\n![](img/ddd273149103130953199fe3b160343f_73_0.png)\n\
    \n如果你在 shell 中运行不带参数的 `dialog`，它将列出你可以创建的窗口列表，以及所需的参数。\n\n问题在这里，因为选择是不合法的。传统的方法是通过\
    \ Ncurses 使用它。原始的 dialog 是一个由 Berkeley 软件发行版 (BSD) 内核创建的库，用于帮助基于终端的目标，而它的寿命远超该目标。Linux\
    \ 从 90 年代开始一直使用同一个库，对于任何在 2001 年之前尝试过安装 BSD 或 Linux 的人来说来说。有些图形界面改为使用基于字符的屏幕，通过\
    \ Tab 键在框之间移动。这些点可以是几乎任何标准 GUI 组件，比如复选框或文本输入框。\n\nSTDERR（标准错误）意味着你看不见。该对话框的所有输出都将管道到\
    \ STDERR 并再次返回。这部分管道标准通过使用虚假占位符技巧，利用 STDOUT（管道）和 STDERR（管道）来接收结果。它实际上做的只是从会话的对话框选择中返回值，并将其分配给变量。\n\
    \n脚本的其余部分应该很简单：我们在最后调用一次所有 dialog，然后用一个简单的消息框输出我们操作的结果。\n\n让我们试一个：\n\n```\ndialog\
