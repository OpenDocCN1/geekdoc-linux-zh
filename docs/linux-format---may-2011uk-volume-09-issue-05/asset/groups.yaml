    # MythTV


    # Basic usage


    ![](img/ddd273149103130953199fe3b160343f_41_0.png)


    By now you''ve installed MythTV, set up the back-end and should have the front-end
    displayed in all sorts.


    If the front and back-ends are separate, the first thing to tell them is to connect.
    You will automatically be asked to do this when you start up an unconfigured front,
    but if not, or you want to change it, the setting is in Setup > General. You''ll
    need to set the hostname and three


    MySQL settings - the database name, username and password. The first two are unlikely
    to be anything other than mythconv and mythtv. The password, plus the other two
    items, can be found in /home/mythtv/mythtv/mysql.txt on the back-end.


    We''ll refer to using a keyboard to control MythTV. A remote control the usual
    method, but the button maps to keys anyway - keys are consistent, while each remote
    is different. We''ll refer to remote controls.


    ![](img/ddd273149103130953199fe3b160343f_41_1.png)


    # Step by step: Managing your records


    ![](img/ddd273149103130953199fe3b160343f_41_2.png)


    ![](img/ddd273149103130953199fe3b160343f_41_3.png)


