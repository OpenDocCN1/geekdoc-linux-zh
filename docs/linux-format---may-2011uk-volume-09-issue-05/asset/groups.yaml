    Detail: The Nepomuk service is not registered at D-Bus which typically means it
    was not started or encountered a fatal error during startup.


    ### Michael Pound

    The freezing could be a hardware problem. A running meantime, which is common
    on Linux KDE, and also requires a memory test. After hitting the reset button
    or power switch again, there is a more system-friendly fix.


    Hold down the SysRq key, and B will also process and sync your disks. This does
    not avoid crashing a filesystem, but gives you more chance of seeing a report
    in the system log, use /var/log/messages. There are around how you learn the system
    (see Linux Wiki), but it is better to restart in B BASER.


    Akonadi and notepad are part of KDE''s akonadi being used for personal information
    management (PIM) data, such as your address. This makes it useful for KMail.


    ![](img/ddd273149103130953199fe3b160343f_81_1.png)


    ### Use the Startup Applications section of the Mint Control Centre to akonadi
    in order to use KMail on Gnome.


    The error message states that the server isn''t starting, which could be one of
    two: there is no attempt to start it, or it''s not when it starts. If you''re
