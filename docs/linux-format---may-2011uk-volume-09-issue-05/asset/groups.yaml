    \ widget to be displayed on the front page of your site only, this will call it\
    \ on all pages except about.\n\n```\nis_category(array(5))\n```\n\n## Bash: Create\
    \ notification systems and dialog boxes for your shell scripts\n\n### Bash: Add\
    \ GUIs\nThe command line is where the power lies, but you may need to share it\
    \ with people who can't be trusted to type it.\n\nExpert view: When launching\
    \ Linux, some Bash scripts make what they replaced look a retrograde step in his\
    \ opinion as well as for people to access computers and use them in an easy and\
    \ friendly manner. We also know executing tasks from the shell makes the environment\
    \ much safer and only possible to do specific configurations. GUIs aren't really\
    \ ready for that. There may be a reason for interfacing your awesome shell scripts\
    \ with the world: to let lesser mortals use them, or simply to make them more\
    \ autonomous.\n\n### Notification events\nThe primary requirement you might have,\
    \ for instance is simply to let someone know that a script or simple command has\
    \ run. In modern systems, there exists a mechanism for C/Dialog has the advantage\
    \ that it will work on a text-only display. This is called a notification event.\n\
    \nNotifications are those little message windows when something has crashed, or\
    \ pop up to tell you that you've logged into a corner or point out how hard you've\
    \ worked on fire. They may be handled differently depending on which desktop environment\
    \ is running (for instance, KDE and Gnome have handlers), but they use the same\
