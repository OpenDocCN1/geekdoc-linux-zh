    # 赢了！Debian 打包教程


    ## Debian 打包教程

    5月19日

    Imperial Hotel, Russell Square

    London WC1B 5BB


    ![](img/ddd273149103130953199fe3b160343f_14_0.png)


    这期期一天的课程不需要多少 Debian 特定的知识，尽管与会者应该熟悉 GNU/Linux 终端命令行。课程结束时，每位参与者都将在他们的笔记本电脑上安装构建环境，并理解如何准备适用于上传到
    Debian 的软件包，以及如何在 Debian 存档之外准备一个本地仓库供使用。更多信息请访问：http://www.ukuug.org/events/debian2011/


    你的导师 Philip Hands 是 Hands.Com Ltd 的所有者，这是一家自 1993 年以来一直为 GNU/Linux 提供商业支持自由软件公司。1996
    年，他加入了 Debian 项目，最初负责打包 `rsync`，随后负责包括 `openssh`、`qmail-src`、`mget` 在内的软件包。他不仅是
    DebConf 的组织者和赞助商，还是著名的 Debian 格子纹（Tartan）的设计师。


    ![](img/ddd273149103130953199fe3b160343f_14_1.png)


    将有两名幸运读者可以获得一本《LPI Linux Certification in a Nutshell》第三版。


    想要中奖 - 请在 4 月 30 日之前向 debiantutorial@oreilly.co.uk 发送电子邮件。


    获者将随机产生，并在 5 月 3 日公布。（奖品仅为教程，不包括差旅或住宿费用。）


    ![](img/ddd273149103130953199fe3b160343f_14_2.png)


    # O''REILLY


    O''REILLY UK Limited 与 Unix 用户组（Unix User Group）联手，由该领域的专家教授高标准课程。


    ![](img/ddd273149103130953199fe3b160343f_14_3.png)


    # 想要中奖


    ## 服务器


    写信给 Linux Format 的 Graham：Future Publishing, 30 Monmouth Street, BA1 2BW，或发送邮件至
    lxf.letters@futureformat.uk


    ## 我们依然喜欢 Love


    我并不在意是否得到一本 LXF。我很少享受那些代码。我会启动现场发行版（live distros），花一个晚上尝试将它们安装到 Ubuntu 上。


    也许我只是太懒了，但我怀疑我从未抽出过时间去下载 Debian 之类的东西，我很期待在当期纸质版到达后能尝试一下 Chakra。


    现在我在笔记本电脑上运行 Mint，台式电脑上运行 Fedora，这两个发行版看起来就像直接从 LXF 封面里出来的。我完全不感兴趣的发行版，活动完全满足我的喜好。


    所以感谢 Mike 所付出的时间和精力。

    - Paul Holman


    Mike 说：那太棒了！很高兴你喜欢这些封面。我们总是尝试包含名气更大的发行版和其他项目供尝试。即使在这个规模下这些看起来可能很小，但我们利用了所有它们。Ubuntu
    真的就像是 Debian 的最新快照。


    ## 月度信件！


    ## 基础系列


    我是一个新读者，绝对喜欢 LXF。我对 GNU 发行版的使用感到非常惊讶——以及所有自由软件基金会列出的那些。


    我从未见过过关于 Ubuntu、Triquel 或 Debian 的评论。我知道那些 OSE（开源软件）通常因为缺乏专有软件而无毫无用处，但通过几个管理器（加上专有内核）就能让它们在我的
    Mac 上运行！


    另一个在 Linux 原生桌面环境中很有趣的话题是窗口管理器。我经常在 Gnome、KDE、Xce 中看到它们，但在那里什么都没有？比如 Openbox、Fluxbox、ScRot
    或 IceWM。

    - Achille Mariotto, 丹麦


    Graham 说：这是一个非常棒的主意，我们计划在未来的期数中涵盖它。我们正在寻找窗口管理器世界的原生开发，一旦有带有新功能的重大发布，我们就会进行报道。


    ## 船确实很烂（Ships do sure duck）


    Linux Format 是一本高质量杂志。它是唯一值得购买的 Linux 杂志。内容有趣，我们似乎在大多数事情上都做对了，即使与大多数其他杂志相比，它出版的是口语英语而非书面英语，并且对美国人的类型充满热情。


    我确信我们许多在家里学习写英语的人，为了在一个合理的标准内保持简单，并且通常在引号内的用法应该是被接受的，我们可以在当今的媒体中通过更好地接受这一点。


    然而，使用街头俚语完全令人反感。“Kick-ass”（酷毙）并不很……


    Mike 太喜欢我们了，以至于他在 linuxformat.com 的订阅区域放了所有开发者的照片。这家哥真行？


    > > 这艘精美的船会烂吗？只有时间和流体动力学的发现会告诉我们。


    > > ''kick-ass''（两者都出现在 LXF 143 中）。


    我知道“一个日本人是一种 Weiner”并不是什么意思吗？我们希望通过边缘的改变可能会改进。问候并祝你工作顺利。James 等待的 nit 已安装，只完成了一小部分。无论如何，它比上一个好。


    > > Andrew 说：真正的 Stephenson 告诉我们，为了幽默而使用的贬低性俚语确保了荷兰人，他们的语言里“船”字的意思就是“烂”。例如，一艘尾浪很大的船，意味着破水很快，并且非常擅长避开马萨诸塞州岸的港口。但我们正在尝试，你可以看到新政下这种类型变少了。


