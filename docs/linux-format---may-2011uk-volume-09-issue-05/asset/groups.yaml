    ## 分率


    如果我想录制重叠的节目，我需要多块电视卡吗，还是可以将一张变成多个频道？我更倾向于早几分钟开始，晚几分钟结束。这比直接看节目然后因为开始晚或超时而错过结尾要好。


    如果你正在使用 DVR，这意味着将多个频道合并到一个流中。我想为每个 DVR 调谐器卡额外录制一个频道，并将其分成多个频道。


    我不想用键盘看电视。我如何添加遥控器？


    最简单且可能是最好的方法是获取一个带有学习功能的无线遥控器。你可以让遥控器处于学习模式，但使用键盘并将按键分配给各种按钮。


    ## 遥控器


    常用的方法是使用 LIRC，MythTV 默认安装了它。它让你在安装期间选择控制器，你也可以以后从 `Mythuntu（Mythuntu 控制）` 中进行。你需要更多接收端的信号，所以请使用带有
    MythTV 的媒体中心遥控器。


    ![](img/ddd273149103130953199fe3b160343f_43_2.png)


