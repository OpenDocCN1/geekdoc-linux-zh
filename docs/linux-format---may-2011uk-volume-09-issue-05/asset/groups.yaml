    There''s a flurry of activity behind the scenes in the run up to the launch. Besides
    the bug squash between the six milestone releases and two release candidates,
    the SUSE team organized Open-Bugs to help with the under-development version.


    ### Features at a glance


    OpenSUSE 11.4 balances production with the right amount of. total, its participants
    handled 132 bugs over the course of the event.


