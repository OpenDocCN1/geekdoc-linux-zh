    # Graphical plotters Roundup


    # KAlgebra


    # A capable maths assistant brought to you by KDE.


    Just as J may be (partially) defined as a way to use Gnuplot and commands being
    forced to look at them more closely, KAlgebra could be seen as a non-intrusive
    way to learn and use MathML, the Mathematical Markup (www.w3.org). KAlgebra focuses
    on math, rather than plotting and analyzing data. Being a Qt/KDE application,
    it blends into any Gnu/Linux distribution much more than Grace, or for matter.
    Using any of the tutorials available online, this will help you to become a KAlgebra
    user. However, quoting the program''s manual: It''s not actually necessary to
    know Math to use KAlgebra. You can define functions as you like writing them on
    paper.


    +   - When it 3D plots, KAlgebra lets you rotate and look at details from any
    angle.


    ![](img/ddd273149103130953199fe3b160343f_32_0.png)


    Besides, one of strengths of KAlgebra is its extensive and early documentation.
    The Help menu contains links to a complete manual, while the Dictionary tab of
    the main window contains searchable list of all the and logical operations supported
    by KAlgebra Each operator is defined by a description, a list of the parameters
    it accepts, the ways it''s called in algebra and a sample graph.


