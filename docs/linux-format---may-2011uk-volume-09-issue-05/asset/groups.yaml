    \ || echo \"File-failed\"\ndialog --msgbox \" 6 6\n```\n\n# 使用 dialog\n\n我们可以创建许多类型的对话框，但在我们开始使用那个精妙但并不符合\
    \ 21 世纪标准的库之前，使用 Xdialog 更好。Xdialog 是 Dialog 的无缝替换品，它使用 GTK 窗口而不是褪色的外壳。它现在看起来好多了。\n\
    \n你喜欢它吗？Xdialog？它实际上是一个无缝替换品。在大部分语法上，它是相同的。\n\nXdialog 实际上允许许多人都会使用的额外选项，用于字体选择和对话框的渲染。本着让事情运行的精神，Xdialog\
    \ 接受所有类型的输入并直接忽略它们，无需任何配置。（提示：虽然它是脚本开头持有要使用的命令的值）\n\n所以这里可以使用我们的代码：\n\n```\nresult=1\n\
    dialog --select --15 25 5 2\n1-6\ncp $result $ \nset ? = 0 6 & echo \"File copied\"\
    \ || echo \"File-failed\"\n```\n\n![](img/ddd273149103130953199fe3b160343f_73_1.png)\n\
    \n这是一个对 Ncurses 非常忠实的替代品，但使用了借自 GTK 的 X 窗口。\n\n| 文件夹 | 文件 |\n| --- | --- |\n|\
