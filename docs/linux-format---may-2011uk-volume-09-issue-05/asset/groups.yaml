    # 光盘上的内容


    针对高度优化的基于 KDE 的发行版的新更新


    ## Linux 发行版


    ## OpenSUSE 11.4


    OpenSUSE 是作者在 20 世纪 90 年代后期使用的第一个 Linux 发行版，在此之前是 Red Hat 5.1 的短暂亮相。SUSE 的世界发生了巨大变化——SUSE
    是一家小型德国公司的项目，后被 Novel 收购并成为企业计算领域的有力竞争者。SUSE Linux 现在正在全球各地的企业中运行，证明了该发行版的质量。


    作为吸引更多终端用户和开发者参与的一种手段，我们将最新的 Linux 技术带到了桌面端。它运行良好，特别是 11.x 分支已被证明是可靠的。


    你可以在我们第 22 页的评测页面阅读关于最新版本的所有信息，但这里是运行它的方法。安装后，我们提供了三个版本的发行版，其中第一个是 32 位基于 KDE
    版本，它可以从任何带有 512MB 内存的现代 PC 直接从 CD 启动，并配备了高度优化的 KDE 桌面。


    然而，对于我们这些家庭桌面级的用户来说，这些产品并不合适。这就是创建 OpenSUSE 项目的原因。


    网上提供了丰富的额外软件，从办公程序到开发工具和游戏应有尽。


    关于分区的简单说明：Linux 需要硬盘上的专用空间。OpenSUSE 安装程序可以重新安装现有的操作系统（例如作为 Windows 的系统）来腾出空间。安装后，你的
    PC 将从安装介质启动，然后你可以选择启动哪个操作系统。如果这是你想要的，我们强烈建议先备份任何重要数据和设置，以防万无一失。


    OpenSUSE 粉丝还有其他选择，以发行版 ISO 镜像的形式提供（OpenSUSE 基于 KDE 版本，采用 GTK 驱动的桌面）。还有一个 64 位版本，这为我们带来了了额外的自由。你还可以将这些
    ISO 镜像刻录到 CD-Rs 并从它们启动（使用光盘刻录软件文档作为刻录镜像的指南）。


    OpenSUSE 最显著的特征 Yaast 提供了任何发行版中最强大的配置面板。


    ## 逐步教程：安装 OpenSUSE 11.4


    ### 1 启动


    第一步是从 DVD 启动你的 PC，在启动菜单中，按 Enter 键从列表中选择默认的 OpenSUSE Live 选项。


    ### 2 桌面


    完成后，你将到达桌面，可以开始探索。点击桌面上的“安装”图标开始该过程。


    ### 3 安装程序


    安装程序将加载并要求你选择语言以及你想要的键盘布局。点击“下一步”继续并按照提示操作。


    ### 4 分区


    在分区步骤，OpenSUSE 将根据你的驱动器布局为你提供各种选项。如果你是高级用户，可以手动进行编辑。


    ### 5 账户


    你还被要求设置一个用户账户来识别你的系统身份。设置时，请记住用户名和密码是区分大小写的。


    ### 6 确认


    安装程序将检查你是否要继续；点击任何带有蓝色下划线的链接来更改设置。发行版文件将被复制。


    ## 我如何……？


    如果你是 Linux 新手，在安装 OpenSUSE 后，你可能不确定如何完成任务。这里是常见问题列表及其完成方法……


    - 操作你的文件：点击桌面上的蓝色柜子来存储和访问个人文档。

    - 播放音乐和视频：通过左下角的绿色图标，进入“多媒体”进行探索。

    - 编辑图像：点击图标并进入“图形 > 图像编辑器”，这是一个多功能工具，具有许多可以媲拟 Photoshop 的高端功能。

    - 在线聊天：在“互联网”菜单中，查看用于编写博客和网络聊天程序的子菜单。

    - 配置系统：在“计算机”选项卡中，有一个功能强大的程序可以配置系统的各个方面。

    - 获取新软件：点击“计算机 > 安装/软件”从互联网下载并安装数千个程序。

    - 关机：点击“退出”标签注销当前用户或停止机器。


    OpenSUSE 有活跃且友好的社区支持，如果你遇到困难，并不缺少帮助。首先，点击图标并进入“帮助”使用该系统。在桌面上你会看到“在线帮助”图标，它提供了互联网上的资源。访问
    forums.opensuse.org，OpenSUSE 粉丝可以快速为你提供正确的方向。祝运！


    OpenSUSE 的桌面是精美、流畅的 KDE 4.6，带有许多小部件。


    不要错过……


    KDE 4.6

    新桌面充满了调整功能，例如保存到许多不同的网站。


    LibreOffice 3.3

    OpenSUSE 11.4 是首批随此版本发布的更快、更好的 OpenOffice 分支之一。


