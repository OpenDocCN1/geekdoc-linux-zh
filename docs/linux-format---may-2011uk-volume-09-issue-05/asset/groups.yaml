- md: "\n## SCALE\n## California dreaming\n\nJono Bacon finds out the ideal recipe\
    \ from two of the volunteers behind LA's popular SCALE conference.\n\n![](img/ddd273149103130953199fe3b160343f_47_0.png)\n\
    ... (images 47_1 to 47_16)\n\n## SCALE\n\nThere are many open source conferences\
    \ over the world. Some are community-oriented, and some blend two perfectly to\
    \ offer a friendly atmosphere with all the companies attending. The Los Angeles\
    \ Based California Linux Expo (SCALE) has grown exactly this. We met Ian Rabbovich\
    \ and Dave (Beach), who have been involved with the conference since day one,\
    \ to explore its story.\n\nLFX: That market of commercial and community participants\
    \ is key and offers a bit of equilibrium. This delicate balance is one of the\
    \ keys in our special sauce.\n\nLFX: How has SCALE grown over the years, and how\
    \ have you managed that growth?\n\nOB: It's grown to meet the needs of the community\
    \ - we've grown at about the same rate. As a result, we've grown from being a\
    \ two-day conference with 12 speakers and an open expo of 25 booths to over 65\
    \ speakers and a three-day event, now.\n\nLFX: How did SCALE get started?\n\n\
    OB: SCALE grew out of a series of LFXfest hosted at the Northern Facility in Silicon\
    \ Valley 10 years ago. We were two-day events. By the time noted LFXfest had a\
    \ growing challenge, and we needed the community for this type of event. Ian Rabbovich:\
    \ The LFXfest were great, but then bubble started bursting. With wanting to create\
    \ an open source event in Southern California with a group of students at UCLA\
    \ and UCI with similar goals, Scale was born in 2002 at the USC Conference Center.\
    \ Most of our original founders are still around today.\n\nLFX: What kind of audience\
    \ does SCALE target?\n\nOB: The demographic is diverse and wide. We try to cover\
    \ all of the audience including beginners and children. We try to have something\
    \ for every interest. This means that we attract fans from hobbyists to IT professionals\
    \ and executives. Our mission is to help empower people around coding in general.\
    \ Though Linux is in our name, most of what we cover goes beyond Linux-specific\
    \ topics.\n\nLFX: What do you want from us?\n\nOB: It's now that we're able to\
    \ take on all of that internal work. However with some interest in events that\
    \ has allowed us to expand the content and add more original. This special SCALE\
    \ has helped us keep an energetic atmosphere by drawing in new communities.\n\n\
    LFX: Why do you want to scale up?\n\nOB: The community wants to take it. We anticipate\
    \ that growth will continue as it is in the past: between 5% and 15% per year.\
    \ We want to plan for the future where we might have to move out larger. OB: We're\
    \ seeing a high demand for talks targeted at developers and tracks for the future.\
    \ We imagine we will need to add more industry-specific tracks. It's important\
    \ to keep the community engaged. Another way is to continue expanding our events\
    \ here in the United States. For example, in 2010 we collaborated with a group\
    \ of people in Austin to launch Texas Fest. Their annual event will be coming.\
    \ Our goal is to continue helping them.\n\n## SCALE'S FUTURE\n\nLFX: SCALE has\
    \ become one of the most popular conferences in the USA. How do you want to retain\
    \ the community?\n\nOB: We attract communities through our goals. We started with\
    \ the idea to build local events that people would enjoy attending. These mini-conferences\
    \ have had growing pains, and others of these have spun off to become their own\
    \ events. Yet one of these is educators who want to use open source in the community.\n\
    \nLFX: What would you like to give to organizers?\n\nOB: Meet the community. In\
    \ Southern California we have a large demographic, and we need more software development\
    \ than a small community. So might have one or two marketing departments, to focus\
    \ more on end-user experience. OB: Start planning early - don't be afraid to ask\
    \ for help when you have questions. Many of the community work together and trade\
    \ ideas. We see many new events coming up and don't be afraid to collaborate with\
    \ others to achieve our goals. Finally, like any other open source project, would\
    \ make it easy for others to contribute. Organizing events takes a great deal\
    \ of work, making making easier for others to keep SCALE up.\n\n![](img/ddd273149103130953199fe3b160343f_48_1.png)\n\
    www.taxradar.com May 2011 \n![](img/ddd273149103130953199fe3b160343f_48_2.png)\n\
    \n## 16 things we'd change about Ubuntu\n\nUbuntu is a popular distro, but everything\
    \ in life, it isn't perfect. There's plenty that could be improved, both in terms\
    \ of software and the way it goes about thinking. Neilovich has a few suggestions.\n\
    \n- 01 Show how it helps: This was done recently. \"What many people don't understand\
    \ Linux development is that it's truly a team effort: Red develops the kernel,\
    \ Ubuntu takes the credit\" - it's a little unfair on Ubuntu, maybe that's because\
    \ it doesn't get credit for what it does - such as making Linux more possible\
    \ for the masses. If so it should blow its own trumpet more.\n- 02 Colour choice:\
    \ What is it with Ubuntu's colour? it's not just the drabness of some palettes\
    \ - the pretty colours were taken by others - but the way it changes with release.\
    \ Ubuntu has used every possible shade of brown, from dark to ochre, with no pattern,\
    \ switching to strange auburne. Some of consistency would be needed. Anyway, if\
    \ we didn't like the colour, we have time to get used to it.\n- 03 Home partition:\
    \ I've complained about this in reviews and got a quick response from Ubuntu,\
    \ but nothing convinced me that lumping your data in the root partition is a good\
    \ idea. Kludging the installer to delete parts of the root filesystem instead\
    \ of formatting it to preserve /home why /home should be separate in the first\
    \ place.\n- 04 Release cycle: The six-monthly release cycle, set for release by\
    \ the last day of April and October each year, is a hindrance. It builds adaptability\
    \ but it also forces developers to release code before it's ready. This affects\
    \ software developers having to plan marketing and advertising to coincide with\
    \ the release. It also means that Ubuntu makes each release distinct from the\
    \ previous one in some way, but with the colour scheme, buttons or default software\
    \ choices. Free software should be ready for Debian. Now that Debian's so much\
    \ more mature, a longer break would enable Ubuntu to make the new additions with\
    \ more time for testing, could even find release easy, instead of frantically\
    \ fixing bugs at the eleventh hour.\n- 05 Explain the changes: For change its\
    \ sake is pointless, and if you don't explain why you changed something it will\
    \ be perceived as such. An upgrade, or a full installation over a previous Ubuntu,\
    \ should open a list of changes and the reason for them in a browser when they\
    \ first boots. Don't just move the buttons and let it run.\n- 06 More user testing\
    \ of ideas: It's great to see a major distro experiment with alternatives to established\
    \ software, such as Wayland and Unity, but a full distro release is hard to try.\
    \ Maybe Ubuntu should have some sort of testing branch, users get these changes\
    \ before they make it into the full release. This isn't the same as an alpha or\
    \ beta release, which should be done before an idea makes it into that.\n"
