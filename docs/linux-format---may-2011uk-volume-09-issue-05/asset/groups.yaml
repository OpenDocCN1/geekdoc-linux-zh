    # On the disc


    A new update for the super-polished KDE-based distribution


    ## Linux distribution


    ## OpenSUSE 11.4


    OpenSUSE was this author''s first-time Linux distribution in the late 1990s, following
    a brief debut with Red Hat 5.1, which changed much in the world of SUSE, a project
    by a small German company bought by Novel and turned into a bigger player in enterprise
    computing. SUSE Linux is now running in businesses all over the world, proving
    the quality of the distros.


    as a way to get more end users and developers involved, bringing the newest Linux
    technology to our desktops. It works and the 11.x branch of releases in particular
    has proven to be reliable.


    You can read all about the latest release in our review page on page 22, but here
    is how to get it running. After installation we have provided three flavours of
    the distro, the first of which is the 32-bit KDE-based edition that boots directly
    from a CD on any modern PC with 512MB of RAM, and sports a highly polished KDE
    desktop.


    However, for those of us on home desktop usage, products aren''t the right fit.
    That is why the OpenSUSE project was created.


    A wealth of extra software is available online, from office programs to development
    tools and games.


    A quick note about partitioning: Linux needs dedicated space on your hard drive.
    The OpenSUSE installer can reinstall an existing OS, like that is given over as
    Windows, to make room. After installation, your PC will boot from the installation
    media disk and then you can choose which OS to start. If this is what you want,
    then we strongly recommend backing up any important data and settings first just
    in case anything goes wrong.


    There are further options for OpenSUSE fans too, provided as ISO images of the
    distro (OpenSUSE KDE-based edition, featuring the GTK-powered desktop). Then there
    is a 64-bit version, which brings a bit of extra freedom to us. You can also burn
    these ISO images to CD-Rs and boot from them (using disc burning software documentation
    for a guide to burning images).


    OpenSUSE''s most notable feature, Yaast, provides the most powerful configuration
    panel of any distro.


    ## Step by step: Installing OpenSUSE 11.4


    ### 1 Boot


    The first step is to boot your PC from the DVD, and at the boot menu, Enter to
    choose the default OpenSUSE Live option from the list.


    ### 2 Desktop


    Once that''s done, you''ll arrive at the desktop, which you can begin to explore.
    Click Install icon on the desktop to start the process.


    ### 3 Installer


    The installer will load and ask you to choose your language, as well as the keyboard
    layout you want. Click Next to proceed and follow the prompts.


    ### 4 Partition


    At the partitioning step, OpenSUSE will offer you various options depending on
    the layout of your drive. If you''re an advanced user, you can edit it manually.


    ### 5 Account


    You''ll also be asked to set up a user account that will identify you to the system.
    When you do, remember that usernames and passwords are case-sensitive.


    ### 6 Confirm


    The installer will check that you want to go ahead; click any of the blue underlined
    links to change settings. The distro files will be copied over.


    ## How do I...?


    If you''re new to Linux, after installing OpenSUSE you may be unsure how to do
    tasks. Here''s a list of the common problems and how to get them done...


    - Manipulate your files Click the blue cabinet on the desktop to store and access
    your personal documents.

    - Play music and Videos via the green icon in the bottom-left, go to Multimedia
    to explore.

    - Edit Images Click the icon and go to Graphics > Image Editor a versatile tool
    that has many high-end features to rival Photoshop.

    - Chat online in the Internet menu, see the submenu for programs you can use for
    blogging and chatting on networks.

    - Configure the system in the Computer tab and find Ya a highly powerful program
    that configures all aspects of the system.

    - Get new software Click Computer tab > Install/Software to download and install
    thousands of programs from the internet.

    - Shut down the Leave tab for logging out of the current user or halting the machine.


    OpenSUSE is backed by a lively and friendly community, and there''s no shortage
    of help if you get stuck. First of all, click the icon and go to Help to bring
    a guide up using the system. On the desktop you''ll see an icon for Online Help,
    which provides links to resources on the internet, as Novell''s official documentation.
    If you need to ask a question to OpenSUSE users, visit forums.opensuse.org. The
    forums have experts of openSUSE fans on hand to point you in the right direction
    - provide some information so they can quickly provide you with friendly help
    and have our own at openlinux.com/forums. Good luck!


    OpenSUSE''s desktop is a slick, smooth KDE 4.6 with access to plenty of widgets.


    Don''t miss...


    KDE 4.6

    The new desktop is full of tweaks, such as the snapshot tool to save to many different
    websites.


    LibreOffice 3.3

    OpenSUSE 11.4 is one of the first distributions to ship with this faster, better
    OpenOffice.org fork.


