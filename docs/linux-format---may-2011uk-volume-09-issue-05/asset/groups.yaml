    \ wiki 页面上。这有助于团队理解他们需要关注什么，也能让利益者理解他们可以从我们这里期待什么。\n\n虽然发布周期将提供团队工作的高层视图，但帮助小组将项目拆解为更小的任务是有用的，这样他们就可以在周期内规划工作。\n\
    \nPlanela，Ubuntu 翻译团队想在……期间开始一系列翻译。\n\n重点事项将详细说明我们未能充分考虑的所有事情，因此我们将其分解为一组任务，包括以下内容：\n\
    \n- 向社区写博客文章，对他们认为在翻译会议和 discord 中涵盖的主题提供反馈\n- 为相关翻译创建一个 wiki 命名空间\n- 在 wiki 中编写一份文档，列出需要翻译成……的主题列表\n\
    - 为任务选择翻译的重点，并为每个重点准备好运行一次会议的计划\n- 创建一个 Launchpad (https://launchpad.net) 项目以安排翻译会议\n\
    - 按照决定的计划开始执行翻译\n\n除了此处列出的其他任务外，每项行动都分配给不同的人，包括社区成员，Launchpad 将确保这些行动在六个月的发布周期结束前完成。\n\
    \n## 关注你的……\n\n一些人认为，运营一个出色的开源项目仅仅是确保每个人知道要做什么并准时完成。然而，一个伟大的项目还有另一个关键要素：建立一个他们想要加入的团队。\n\
    \n……职业倦怠，他们感到焦虑和紧张，并且永远不想离开社区。因此，请考虑到团队不仅仅是你项目的容器；多关注他们，确保一切安好。如果你注意到压力或紧张情绪，请提到他们生活中正在引起这些反应的事情。这始终是一个很好的方法，而且成为一个组织者是……而且你应该努力做到。\n\
    \n对于每个项目，团队都会创建一个项目列表。蓝图还提供了实用的功能，例如设置蓝图分配给……、控制级实施状态以及关注目标。它还允许旁观者订阅，因此每当蓝图（在任何更改后）更新更改时，他们都会收到通知。在这个项目中，我们为每个项目设置了一套蓝图，清晰地列出了所有已完成的工作账户和行动。\n\
    \n尽管到目前看起来我们已经准备就绪了，但项目经理还有大量工作要做。团队中可能有多达 50 份蓝图，帮助该团队在 50 天内完成这个大项目并在周期结束时交付是一项艰巨的任务。幸运的是，我们针对这项任务有一项卓越的技术。\n\
    \n这项技术被称为倦怠图（见图 1，第 60 页）。我的图表是一个表格，它获取了跨越团队蓝图中记录的所有行动，并生成一个图形来指示它们的状态。当团队……\n\
    \n## 识别你认为在特定时间内可以实现的内容。\n\n![](img/ddd273149103130953199fe3b160343f_58_0.png)\n\
    \n## 倦怠图 (Burncharts)\n\n## 有用的工具\n\n有很多工具可以帮助你成功管理项目，从待办事项列表到协作软件。有了它们，你将毫无压力跟进团队的任务。你想查看以下内容：\n\
    \n- Tomboy\n  http://projects.gnome.org/tomboy\n  一个简单有效的备忘录，方便记录任务和快速提醒。\n\n\
    - Getting Things Gnome\n  http://projects.gnktop.org\n  这是一个开发者拥有的任务工具。用于跟踪项目中的一切事情，并让自己每天都井井有条。\n\
    \n- Launchpad\n  www.launchpad.net\n  虽然那里有很多出色的开发，但 Launchpad 是最好的——提供了良好的代码托管、错误跟踪、蓝图跟踪等更多功能。\n\
    \n- 《社区的艺术》（作者为 Bono Jano）\n  www.artofcommunity.org\n  （好的，这里简单介绍一下这个……）这本书是关于建立和组织社区的。你可以免费加入，它在\
    \ Creative Commons 免费许可下提供。它包含了更多你正在阅读的这篇文章类似的内容。\n\nwww.tuxadar.com\n\n2011年5月\
    \ LXF144 59\n\n## 项目管理\n\n## 拟制定发布计划\n\n成功项目的主要组成不仅是每个人将要做什么和实现什么，还有行动何时需要完成。出于这个原因，强烈建议你制定一个日期表（发布计划），突出整个进度表中的这些截止日期。\n\
    \n如下（出于我们的目的，这里是一个简化的日期列表）：\n\n- 1 月 5 日 开始调研场地\n- 1 月 20 日 最终确定\n- 2 月 22 日 审核\n\
    - 2 月 11 日 开始联系\n- 3 月 11 日 审核\n- 3 月 23 日 最终确定\n- 4 月 6 日 关闭\n- 4 月 10 日 发布\n\
    \n例如，如果你想组织一次活动，计划可能如下：\n\n![](img/ddd273149103130953199fe3b160343f_59_0.png)\n\
    \n每天在图上画一条线，显示所有的待办（红色）、已完成（绿色）、推迟（黄色）和进行中（橙色）。从图表的左上角到右下角有一条粗线。责任是确保图表保持在线下方。这有助于确保在所有行动的周期内取得持续进展。它不是一个确保周期成功的有用工具，但是展示项目状态的绝佳方法。当然，需要定期更新，以确保当一个人将状态更新到图表时，它是有用的。你也不需要一直保持最新状态。\n\
    \n如果你在为软件项目（而不是活动）创建发布计划，你会有像 Ubuntu Freezer Alpha 1/3、Beta 1/2、Candidate 等等内容。\n\
    \n作为软件发布计划的示例，图表可以使用 Ubuntu 11.04 Natty Narwhal：https://wiki.ubuntu.com/NattyRelease/schedule\n\
    \n## 结语\n\n项目管理和研究是一个巨大的课题，我们无法在六页内讲完。本文的目的是让你接触一些重要的概念并提供背景——作为一种帮助你学习的简单方法。有效的项目管理技能与你遇到的人同样重要。有了有效的项目管理，你可以让工作运行得更好。\n\
    \n如果你有一起做项目的的朋友，向他们请教方法、学到的教训、避开的陷阱以及他们乐于与你分享的信息。\n\n被要求将行动放入蓝图中，然后就以标准格式标明了由谁分配以及状态如何。例如，Danny\
    \ 在 Ubuntu wiki 中列出了需要翻译的主题列表：\n\n在这里，行动被分配给了 Dave (Daniella (dp))。其他状态类型包括待办、进行中推迟。\n\
    \n列出所有行动项目、完成分配和状态并绘制图 1 中的图形很快。沿着 X 轴是六个月周期的持续时间，Y 轴显示行动总数，位于：\n\n> Canonical\
    \ 团队使用的倦怠图。\n\n![](img/ddd273149103130953199fe3b160343f_59_1.png)\n\n如果你能让某人记住你与他人学到的教训，其他人也会成长。我们不断欢迎新一代的项目领导和贡献者，我们需要确保我们的工作成果和智慧得以传承。在你指导其他开源领袖时，最好也这样做。\n\
    \n"
