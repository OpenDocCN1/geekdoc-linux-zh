    # 欢迎 LINUX


    ## 我们做什么

    * 我们通过提供信息资源和辩论论坛来支持开源社区。

    * 我们通过教程章节帮助读者从 Linux 中获得更多——我们为每个人准备了内容！

    * 我们在教程章节中打印的所有源代码均采用 GNUv3 许可证授权。

    * 我们为您提供关于所有 Linux 最准确、无偏见且最新的信息。


    ![](img/ddd273149103130953199fe3b160343f_2_0.png)


    ## 我们是谁

    本期探索 MythTV，一个极其的 Linux 数字视频录像机。我们询问了导师们：你们希望看到包含哪些功能？


    ## 变化


    变化应该被加入变化、税收和在线口战的组合中，因为这似乎是不可避免的。无论你是 Gnome OpenOffice.org 的粉丝，还是 Linux Format
    的粉丝，事情都会如你预期发展。过去的 12 个月是我使用 Linux 以来最动荡、最激动且收获丰厚的几年，而 2011 年正以类似的速度发展。变化绝对是一件好事。通过
    Linux 和自由软件，你变得更有活力，并在不断演变的软件和硬件世界中搏斗。


    我想不出还有什么项目能像在变化中表现得如此出色，就像数字电视录像机/万水筒——MythTV 一样！近年来，它成功地应对了电视革命、媒体流的兴起以及通过网络传输内容。从我开始使用它起，它一直提供一个尖端、稳定且不妥协的平台。我们为本月的专题策划了
    MythTV 能提供的最佳内容，无论变化速度如何，我们将继续对 Linux 和自由软件这样做。


    ![](img/ddd273149103130953199fe3b160343f_2_1.png)


    ### Mike Saunders

    “热度计。当这些东西快要在这政治家的道路上用光时，这一切会立即停止。”


    ### Andrew Gregory

    “斯诺克需要能够在站立时读取比分牌上球的坐标。”


    ### Elaine Hernandez

    “我希望我把电视变成现实，这样我们每天早上都会变得更好并节省费用。”


    ### Hell Bottnick

    “更好的病人控制。他们让我控制区块，但那些家伙对我来说风险太高了。”


    ### Myshank Sharma

    “电视录制。说真的，目前现在有一些关于小全球云的更好的纪录片！”


    ### Dr Chris Brown

    “潜伏的广告。太晚了无法停止显示广告！必须购买……杂杂……”


    ### Andy Channelle

    “电视 LD 是受支持的！我以为它可以被 YouTube 代替。”


    ### David Cartwright

    “我不看电视，但我梦想着在《英国之声》上唱歌。好运，”


    ### Nick Vick

    “我声明向前获取一切。电视卡通片。”


    ## Graham Morrison 编辑

    > graham.morrison@futurenet.com


    # Graham


    ### Susan Linton

    “Emacs 模式。如果 MythTV 不能作为 Emacs 模式工作，那它们足够好吗？”


