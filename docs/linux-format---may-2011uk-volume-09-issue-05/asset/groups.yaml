    ## SCALE

    ## 加州之梦


    Jono Bacon 从洛杉矶热门 SCALE 会议背后的两位志愿者那里找到了理想的配方。


    ![](img/ddd273149103130953199fe3b160343f_47_0.png)

    ... (图片 47_1 到 47_16)


    ## SCALE


    世界上有很多开源会议。有些面向社区的，而有些则将两者完美融合，为所有参会的公司提供一种友好的氛围。总部位于洛杉矶的加州 Linux 展会（SCALE）正是这样发展起来的。我们会了
    Ian Rabbovich 和 Dave (Beach)，他们从第一天起就参与了会议，以此探索它的故事。


    LFX: 这种商业和社区参与者的市场是关键，并提供了一定的平衡。这种微妙的平衡是我们独特秘诀的关键之一。


    LFX: SCALE 多年来是如何增长的？你们是如何管理这种增长的？


    OB: 它的增长是为了满足社区的需求——我们的增长也差不多。结果，我们已经从一个为期两天、有 12 名演讲者和 25 个展位的开放展会的会议，发展成为如今有
    65 多名演讲者的为期三天的活动。


    LFX: SCALE 是如何开始的？


    OB: SCALE 起源于 10 年前在硅谷北部设施（Northern Facility）举办的一系列 LFXfest。当时我们是为期两天的活动。到记录的
    LFXfest 面临日益增长的挑战时，我们需要社区来进行这类活动。Ian Rabbovich: LFXfest 非常非常棒，但随后泡沫开始破灭。由于想与 UCLA
    和 UCI 的一组目标相似的学生一起在南加州举办一个开源活动，Scale 一于 2002 年在南加州大学（USC）会议中心诞生了。我们大多数的原始创始人至今仍在那里。


    LFX: SCALE 的目标是什么样的受众？


    OB: 人口统计特征多样且广泛。我们试图涵盖包括初学者和儿童在内的所有观众。我们努力为每种兴趣提供内容。这意味着我们吸引了从业爱好者到 IT 专业人员以及高管的粉丝。我们的使命是帮助更多与编程有关的人。尽管我们的名字里有
    Linux，但我们涵盖的大部分内容都超越了特定于 Linux 的主题。


    LFX: 你希望我们提供什么？


    OB: 现在我们能够承担所有这些内部工作了。然而，对活动的某些兴趣让我们能够扩展内容并增加更多原创性。这种特殊的 SCALE 帮助我们通过吸引新社区来保持充满活力的氛围。


    LFX: 为什么你们想扩大规模？


    OB: 社区想要这样做。我们预计增长将像过去一样持续：每年增长 5% 到 15%。我们想为未来做计划，我们可能需要搬到更大的地方。OB: 我们看到对针对开发者的演讲和未来的专题有很高的需求。我们想象我们需要添加更多行业特定的专题。保持社区的参与至关重要。另一种方法是继续在美国扩大我们的活动。例如，2010
    年，我们与奥斯汀的一群人合作推出了德克萨斯节（Texas Fest）。他们的年度活动即将举行。我们的目标是继续帮助他们。


    ## SCALE 的未来


    LFX: SCALE 已成为美国最受欢迎的会议之一。你们想如何留住社区？


    OB: 我们通过目标吸引社区。我们最初的想法是建立人们喜欢参加的本地活动。这些微型会议经历了成长痛苦，其他一些已经衍生成为它们自己的活动。然而，其中之一是想要在社区中使用开源技术的教育者。


    LFX: 你们想给组织者提供什么？


    OB: 接触社区。在南加州，我们有庞大的人口，我们需要比小社区更多的软件开发支持。因此可能需要一两个营销部门，更多地关注终端用户体验。OB: 尽早计划——在有问题时不要害怕寻求帮助。许多社区成员一起工作并交流想法。我们看到许多新活动出现，不要害怕与他人合作来实现我们的目标。最后，像任何其他开源项目一样，让其他人更容易贡献。组织活动需要大量工作，让其他人更容易维持
    SCALE。


    ![](img/ddd273149103130953199fe3b160343f_48_1.png)

    www.taxradar.com 2011年5月

    ![](img/ddd273149103130953199fe3b160343f_48_2.png)


    ## 关于 Ubuntu 我们想要改变的 16 件事


    Ubuntu 是一种流行的发行版，但就像生活中的一切一样，它并不完美。在软件方面和思维方式方面，都有很多可以改进的地方。Neilovich 有一些建议。


    - 01 展示它是如何帮助的：这最近做了。“很多人不理解 Linux 开发的是，它真正是一项团队努力：红帽 开发了内核，Ubuntu 却获得了功劳”——这对于
    Ubuntu 来说有点不公平，也许是因为因为它没有为自己所做的赢得信誉——例如让 Linux 对大众来说更可能实现。如果是这样，它应该多吹吹自己的喇牛角。

    - 02 颜色选择：Ubuntu 的颜色是怎么了？这不仅仅是某些色调的单调——那些漂亮的颜色被别人抢走了——而是它随着版本发布而变化的方式。Ubuntu 使用了所有可能的棕色，从深色到赭石色，没有任何规律，然后切换到奇怪的红木色。需要一些一致性。无论如何，如果我们不喜欢这个颜色，我们也有时间去适应它。

    - 03 主目录分区：我在评论中抱怨过这一点，并得到了 Ubuntu 的快速回复，但没有什么能说服我将数据堆积在根分区是一个好主意。修改安装程序以删除根文件系统的部分而不是格式化它以保留
    /home，以及为什么 /home 起初应该是分开的。

    - 04 发布周期：每六个月一次的发布周期（设定每年 4 月和 10 月的最后一天发布）是一个阻碍。它培养了适应性，但也迫使开发者在代码准备好之前发布。这影响了软件开发人员必须计划营销和广告以与发布同步。这也意味着
    Ubuntu 在某些方面使每次发布与上一个版本不同，但通过颜色方案、按钮或默认软件选择来实现。自由软件应该为 Debian 准备好。现在 Debian 已经成熟得多，更长的间隔将使
    Ubuntu 能够有更多时间测试新添加的内容，甚至让发布变得容易，而不是在最后时刻手忙脚乱地修复漏洞。

    - 05 解释更改：为了改变而改变是毫无意义的，如果你不解释为什么要改变某些东西，它就会被视为是如此。升级，或在之前的 Ubuntu 上进行完整安装，应该在首次启动时在浏览器中打开更改列表及其原因。不要只移动按钮就让它运行。

    - 06 对想法进行更多用户测试：看到一个主流发行版对既有软件的替代方案（如 Wayland 和 Unity）进行实验是很好的，但完整的发行版发布很难尝试。也许
    Ubuntu 应该有一个某种测试分支，用户在这些更改进入完整发布版之前获得它们。这与 Alpha 或 Beta 版本不同，后者应该在某个想法进入该版本之前就完成。


    '
