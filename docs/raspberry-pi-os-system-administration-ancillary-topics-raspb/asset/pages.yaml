  md: '# X Windows System Wayland, Xwayland, Wayfire, GTK, Gnuplot 187


    the entire contingent of applications available. The user interface has two basic
    parts: the application user interface (AUI), which is how each client application
    presents itself in one or more windows on the server display, and the window manager
    or management interface, which controls the display of and organizes all client
    windows.


    The basic model of interactivity in the X Windows System is an event-request loop
    between the client and the graphical server. With applications written for the
    X Windows System, the client application can process input events, and do the
    work necessary to respond to the events, and then output the responses for graphical
    output to the server.


    The X Windows System is highly customizable to suit the interactive needs of a
    wide range of users. In this chapter we covered two approaches to changing the
    appearance and functionality of a nondegenerate window system, and the window
    manager as well. Our approach involved changing the characteristics of applications
    that run under the X Windows System by command line options.


    We covered the functionality of one of the predominant open-source integrated
    desktop management systems. We showed how this system can be used to expedite
    your work within the Raspberry Pi environment, particularly regard to personal
    productivity and file management operations. We specifically showed the customization
    possible within this system to allow a user to work more efficiently.


    We showed several elementary client application programs for the X Windows System,
    coded to call upon four standard and very common toolkit libraries, Xlib, XCB,
    Qt, and GTK. We stressed the two most important aspects of client application
    program creation for the beginner:


    +   - A client application has two parts: a data generation part that uses code
    in C, C++, or another high-level programming language to produce the numbers,
    text, files, and data structures; and a user interface (UI) which produces the
    actual graphics that display the data generation part.

    - A client application program is made up of initialization, event-request loop,
    and cleanup sections.


    We also showed many detailed examples of the toolkit code itself and what the
    code accomplished in the context of the sample programs.


    Xlib and XCB programs, and a collection of legacy X Windows System applications,
