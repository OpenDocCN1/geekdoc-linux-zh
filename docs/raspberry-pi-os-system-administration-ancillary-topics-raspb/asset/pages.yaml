  md: '# "Quick Start"into Sysadmin for the Raspberry Pi Operating System


    # 0.0 Objectives


    +   * To explain how to manage and maintain files and directories

    * To show where to get system-wide help for Raspberry Pi OS commands

    * To demonstrate the use of a beginner''s set of utility commands

    * To cover the basic commands and operators


    cat, cd, cp, exit, hostname, login, ip, lpr, ls, man, mesg, mkdir, more, mv, passwd,
    PATH, pwd, rm, rmdir, telnet, unalias, uname, whatis, whereabouts, who, whoami


    # 0.1 Introduction


    To start working productively with system administration on the Raspberry Pi OS,
    the beginner needs to have some familiarity with these sequential topics, as follows:


    +   1. How to maintain and organize files in the file structure of the operating
    system. Creating a tree-like structure of folders (also called directories), and
    storing files in a logical fashion in these folders, is critical to working efficiently
    in the Raspberry Pi OS.

    2. How to get help on text-based commands and their usage. With keyboard, in a
    command-based, Character User Interface (CUI) environment, being able to find
    out, in a quick and easy way, how to use a command, its options, and arguments
    by typing it on the keyboard, board correct, is imperative to working efficiently.


    DOI: 10.1201/9781003473268-1'
  merge: -1
  pgno: 15
- img_proc: true
