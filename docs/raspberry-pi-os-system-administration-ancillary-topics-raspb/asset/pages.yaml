    # GTK Example 2


    The next example will show how to add several GtkWidgets to your GTK4 application.


    When creating an application, you''ll want to put more than one widget inside
    a window. When you do so, it becomes important to control how each widget is positioned
    and sized. GTK4 comes with a large variety of layout containers whose purpose
    is to control the layout of the widgets that are added to them. Here are some
    descriptions of these containers, from the GTK4 documentation:


    # GtkBox


    GtkBox arranges widgets into a single row or column. Whether it is a row or column
    depends on the value of its GtkOrientable:orientation property. Within the other
    dimension, all children are allocated the same size. Of course, the GtkWidget:valign
    and GtkWidget:halign properties can be used on the children to influence their
    allocation.


    # GtkGrid


    GtkGrid is a container that arranges its child widgets in rows and columns. It
    supports arbitrary positions and horizontal/vertical spans. Children are added
    using gtk_grid_attach(). They can span multiple rows or columns. It is also possible
    to add a child to an existing grid, using gtk_grid_attach_next_to(). To remove
    a child from the grid, use gtk_grid_remove(). The behavior of GtkGrid when several
    children occupy the same grid cell is undefined.'
