    # 3.8 Visiting Files, Saving Files, and Exiting


    Your Raspberry Pi OS stores data permanently in files, so a vast majority of the
    text a novice user, or even an advanced user, will edit with Emacs, comes from
    a file and is saved in a file. To edit a file while running Emacs, you need to
    read the file into a buffer and prepare that buffer containing a copy of the file''s
    text. This is visiting the file.


    ***Note***

    The Emacs editing commands work on the text in the buffer inside Emacs. Your changes
    are written to the file itself, by default only when you save the buffer to the
    file!


    In addition to visiting and saving files, Emacs can delete, copy, rename, and
    append to files, keep multiple versions of them, and operate on file directories.


