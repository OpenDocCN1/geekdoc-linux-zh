  md: '# GtkRevealer


    A GtkRevealer animates the transition of its child to be controlled by gtk_revealer_set_transition_type().
    The style of transition can be invisible to users. These animations respect GtkSettings:gtk-enable-animations
    setting.


    # GtkStack


    GtkStack is a container which shows only one of its children at a time. In contrast
    to GtkNotebook, GtkStack does not provide a method for users to change the visible
    child. Instead, a separate widget as GtkStackSwitcher or GtkStackSidebar can be
    used with GtkStack to provide this functionality.


    # GtkOverlay


    GtkOverlay is a container which contains a single main child, on top of which
    it can place "overlay" widgets. The position of each overlay widget is determined
    by its GtkWidget:halign and GtkWidget:valign properties. E.g. a widget with both
    alignments set to GTK_ALIGN_START will be placed at the top left corner of the
    GtkOverlay container, whereas an overlay with halign set to GTK_ALIGN_CENTER and
    valign set to GTK_ALIGN_END will be placed at the bottom edge of the GtkOverlay,
    horizontally centered. The position can be adjusted by setting the margin properties
    of the child to non-zero values.


    # GtkPaned


    A widget with two panes, arranged horizontally or vertically. The division between
    the two panes is adjusted by the user by dragging a handle. Child widgets are
    added to the panes of the widget with gtk_pane_set_start_child() and gtk_pane_set_end_child().
    The division between the two children is set by default by the size requests of
    the children, but it can be adjusted by the user. A paneed widget draws a separator
    between the two child widgets and a small handle that the user can drag to adjust
    the division. It does not draw any relief around the children or the separator
    (The space is called the gutter). Often, it is useful to put each child inside
    a GtkFrame so that the gutter appears as a ridge. No separator is drawn if one
    of the children is missing.


    # GtkExpander


    GtkExpander allows the user to reveal its child by clicking on an expander triangle.
    This is similar to the triangles used in GtkTreeView. Normally you would use an
    expander as a frame; you create the child widget and use gtk_expander_set_child()
    to add it to the expander. When the expander is toggled, it will take care of
    showing and hiding the child automatically.


