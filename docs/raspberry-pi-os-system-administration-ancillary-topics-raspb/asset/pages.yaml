  pgno: 56
- img_proc: true
  md: '# ZFS Administration and Use


    zfs promote command


    The zfs promote command, in the context of ZFS, is used to make a clone file system
    the parent of its originating snapshot. This essentially “promotes” the clone
    to become the new source file system, and the original file system becomes the
    clone. This can be useful in scenarios where you want to roll back to an earlier
    snapshot, make changes to a clone, and then promote it to the main file system.
    Here is a detailed explanation:


    +   1. Creating the Snapshot


    First, you need to create a snapshot of the original file system. This snapshot
    serves as a point-in-time, “immutable picture” reference.


    ```

    zfs snapshot tank/source@snapshot1

    ```


    +   2. Creating a Clone


    Next, you create a clone of the snapshot of the original file system, which initially
    shares the data with the source file system.


    ```

    zfs clone tank/source@snapshot1 tank/clone

    ```


    +   3. Make Changes to the Clone


    You can make changes to the clone without affecting the original file system.


    ```

    echo “New data” >/tank/clone/somefile.txt

    ```


    +   4. Promote the Clone


    Now, if you want to make the clone the new source file system, use the zfs promote
    command.


    ```

    zfs promote tank/clone

    ```


    ***Note***


    After this command, tank/clone becomes the new source file system, and tank/source
    becomes the clone. Again, in the Procedures, if you make a mistake anywhere along
    the way, you can start over by executing the cleanup steps shown at the end of
    the example, and begin again.


    **Prerequisites:** Installation of ZFS on your Raspberry Pi system, as shown in
    Section 1.1, and having completed Example 1.1.'
