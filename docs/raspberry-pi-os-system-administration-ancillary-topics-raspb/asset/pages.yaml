    bob@bob-ProLiant-MicroServer:-$

    ```


    NFS sharing will then be disabled for the ZFS pool pool. You can check this with
    the following command:


    ```

    bob@bob-ProLiant-MicroServer:-$ sudo zfs get sharesfs newpool

