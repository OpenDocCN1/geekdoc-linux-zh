    ***Note***


    A given graphics primitive does not contain all the information needed to draw
    a particular instance of primitive.


    The appearance of everything that is drawn by a client-side program is controlled
    by the GC that is in effect for each graphics primitive. For example, when an
    application has reached a point where graphics primitives are to be drawn, a GC
    must be specified or be already in place, and then the GC is supplied as an argument
    in the argument list of the particular function that draws the graphics primitive.
    This arrangement, of having a single, or possibly multiple contexts available,
    retained at the server, for the drawing of many speeds up the drawing of graphics
    primitives.


