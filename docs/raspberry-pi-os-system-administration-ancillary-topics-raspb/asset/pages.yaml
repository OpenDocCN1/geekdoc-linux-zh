  md: '# Raspberry Pi OS System Administration: Ancillary Topics


    +   1. Install GTK4 Required Software:


    Make sure you have Geany and the necessary development tools installed. Additionally,
    ensure that you have the GTK4 library and its development files installed. The
    command to install GTK4 is `sudo apt install libgtk-4-dev`


    Also, `export GTK4_1Y=none` should be done on the command line before compilation
    is done.


    +   2. Create a GTK4 Project:


    Open Geany and create a new project for your GTK4 application. Set up your source
    code files and any other project-specific files.


    +   3. Configure Build Settings:


    In Geany, go to the “Build” menu and select “Set Build Commands”. Configure the
    build commands for compiling and linking your GTK4 program. Use pkg-config to
    get the necessary compilation flags for GTK4. For example:


    ```

    Compile: gcc -Wall -o "%$n" "%f" `pkg-config --cflags gtk4`nBuild: gcc -o "%$n"
    "%f" `pkg-config --libs gtk4`

    ```


    +   4. Write GTK4 Code:


    Write your GTK4 application code in the source files. Ensure that you include
    the necessary GTK headers and follow the GTK4 programming conventions.


    +   5. Save and Build:


    Save your files and build your project using Geany''s build commands. Check the
    build output for any errors.


    +   6. Execute the Program:


    Once the build is successful, you can execute your GTK4 program directly from
    Geany. Use the “Execute” button or press F5.


    +   7. Debugging:


    If you encounter issues, use Geany’s debugging features. Set breakpoints, inspect
    variables, and step through your code to identify and fix problems.


    Remember that these are general steps, and the specifics may vary based on your
    project structure and specific development environment.'
