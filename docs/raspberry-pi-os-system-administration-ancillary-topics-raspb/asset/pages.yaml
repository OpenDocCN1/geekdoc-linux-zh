    # 3.11 Cut or Copy and Paste and Search and Replace


    Every processor has the capability to cut or copy text and then paste that text
    back into the document bring worked on, and to search for old text and replace
    it with new text. Because Emacs operations are totally activated, we use sequences
    of keystrokes to execute commands, cutting and copying are fairly complex operations.
    They are accomplished with the Kill Ring, where text is held in a buffer by killing
    it and is restored to the document at the desired position by yanking it. Global
    search and replace are somewhat less complex and are accomplished by either an
    unconditional replacement, or an interactive replacement.


    The mark is simply a place holder in the buffer. For example, to cut three words
    from a document and then paste them at another position, move the point before
    the first word you want to cut and press <Esc+D> three words are then cut to the
    Kill Ring. Because the Kill Ring is a First In First Out (FIFO), you can now move
    to the point where you want to restore the three words and press <Ctrl+Y>. The
    three words are yanked into the document in the same order, left to right, that
    they were cut from the document.'
  merge: -1
