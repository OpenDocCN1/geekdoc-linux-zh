    The command `set multiplot` places `gnuplot` in the multiplot mode, where several
    plots are placed next to each other on the same page or screen


    set multiplot


    ```

    { <page title> {font <fontspec>} {enhanced|noenhanced} }

    { layout rows>,<cols>

    {rowsfirst(columnsfirst){downwards|upwards}

    { scale <scale>,<yscale>} {offset <xoff>,<yoff}}

