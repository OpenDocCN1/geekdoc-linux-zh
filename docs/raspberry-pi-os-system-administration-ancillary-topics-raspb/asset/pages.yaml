    We highly recommend a disk storage model that puts the operating system on a single
    medium (microSD card or SSD), and user data files on a second, larger capacity
    medium. What that storage model allows you to accomplish is to keep the system
    operable, maintained, and upgradable on its own discrete storage; user data are
    securely archived on another, possibly redundant, device or devices. That model
    implementation, and its effectiveness for archiving user data files, is made possible
    by what we show in this chapter. We also show techniques for implementing this
    storage model when your Raspberry Pi has a single external, non-boot/system medium
    mounted. This model strictly conforms to the warning we previously gave you, and
    must accommodate the ECC memory drawback above.


    # 1.1.1 zpool and zfs Command Syntax


    The following are the general syntax forms for the zpool and zfs commands. For
    a more complete description of these two important commands, see the man pages
    for zfs and zpool on your Raspberry Pi system (after you have installed ZFS refer
    to the instructions above!)


    ********************************************************************************


    zpool

    zpool sub-command [options] [option arguments] [command arguments]


    Purpose: To create and manage pools of virtual devices such as disk drives


    Commonly used options/features:


    +   - zpool create vdev: Creates a new pool with name on the specified vdev

    - zpool create -copies=2: Creates a new pool name with the property copies set
    to 2

    - zpool destroy name: Destroys, or removes, a pool name

    - zpool list name: Lists storage space and health of pool name

    - zpool scrub name: Verifies that the checksums on pool name are correct

    - zpool status name: Displays the status of pool name


    ********************************************************************************'
