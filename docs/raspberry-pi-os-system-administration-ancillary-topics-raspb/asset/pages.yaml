  md: '# # Volume 4 Preface


    Continuing the series of books that cover basic Raspberry Pi Operating administration,
    this volume presents important subjects that are now available in the updated
    version of the Raspberry Pi OS. This new version is based on the upstream Debian
    Bookworm release, and is meant to run on the Raspberry Pi 5, as well as on older
    Raspberry Pi systems, such as the Pi 3, Pi 4b, and Pi 400.


    The topics presented in this volume are:


    +   1. A basic introduction to important Raspberry Pi commands for the novice
    user.


    +   2. A full-chapter explanation, with many examples, of the Zettabyte File System
    (ZFS).


    +   3. A full-chapter description, with many examples, of the X Window System,
    the Wayland protocol, XWayland, Wayfire, XCB, Qt5, and GTK4 graphics.


    +   4. A full-chapter tutorial on the Emacs text editor, to supplement the text
    editors presented in Volume 3.


    The subjects are geared toward a beginner and are complete, self-contained introductions
    to these ancillary programs, using the systemd super-kernel. They guide the user
    along a path that gives the "why" and "how to" of important Raspberry Pi applications.
    This volume can easily fit the learning objectives, pace, and interests of the
    individual, independent learner, or can be adopted in a more formal environment
    to supplement and extend the basic knowledge of a Linux operating system and its
    applications and programs in a classroom environment that uses the Raspberry Pi
    OS.'
  merge: -1
