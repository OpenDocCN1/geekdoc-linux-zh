    # 2.8 Summary


    The operation of the Raspberry Pi OS is greatly improved, from the ordinary user
    perspective, through the modern use of a graphical user interface (GUI). A traditional
    and common GUI for Linux is built upon a display and network protocol the Debian
    Bookworm-based Raspberry Pi OS is Wayland. A AGUI system can be classified as
    either integrated or nonintegrated. A nonintegrated system generally utilizes
    the window manager with higher-level programs that achieve desktop management
    and session management. Examples of integrated systems are Gnome, KDE, Plasma,
    and Xfce.


    The X Window System, as a display and network protocol, contains device-specific
    drivers for Intel-based and ARM-based hardware. The X Window System is used for
    graphical interaction between a user and one or more computer systems. The chief
    arbiter of the interactive dialog between user and computer system is the window
    manager. The Wayfire compositor, and window manager, offers all of the amenities
    of other popular window systems, and additionally allows you to manage the graphical
    output from'
