  md: '# Series Preface


    This series of books covers the basics of Raspberry Pi Operating System administration,
    and is geared toward a novice user. Each book is a complete, self-contained introduction
    to important system administration tasks, and to other useful programs. The foundation
    of all of them is the system kernel. They guide the user along a path that gives
    the "why" and "how to" of those important system administration tasks, and they
    also present the following essential application facilities in four volumes:


    +   1) Raspberry Pi OS System Administration with systemd, Volume 1

    2) Raspberry Pi OS System Administration with systemd and Python, Volume 2

    3) Raspberry Pi OS Text Editing, git, Virtualization with LXC/LXD, Volume 3

    4) Raspberry Pi OS System Administration with systemd: Ancillary Topics, Volume
    4


    They can be used separately, or together, to learn the objectives/pace, and interests
    of the individual, independent learner, or can be adopted in a more formal learning
    environment, to supplement and extend the basic knowledge of a Linux operating
    system in a classroom environment that uses the Raspberry Pi OS.


    In addition, each book has In-Chapter Exercises throughout, and a Question, Problems,
    and Projects addendum to help reinforce the learning goals of the individual student
    or reader.


    An GitHub site, with materials and updates, program source code, solutions to
    In-Chapter Exercises, plus other supplements, is provided for each volume. It
    can be found at:


    www.github.com/bobk48/RaspberryPiOS


    The fundamental prerequisites of each volume are:


    +   (1) knowledge of how to type a syntactically-correct Linux command on the
    command line,

    (2) having access to a dedicated Raspberry Pi computer with the latest Raspberry
    Pi Operating System installed and running on it,

    (3) in some cases, being a privileged superuser on the system that is able to
    execute the sudo command to assume superuser status, and

    (4) having a basic knowledge of how to edit and save text files in the nano text
    editor.'
  merge: -1
  pgno: 11
