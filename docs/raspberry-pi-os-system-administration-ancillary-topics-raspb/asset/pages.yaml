    # 3.16.2.3 Globally Saving Customizations for a Group


    Near the top of any group''s customization buffer, you can save all customization
    settings shown in that group buffer by choosing the [Apply] or [Apply and Save]
    buttons. [Apply] only saves for the current session, and [Apply and Save] saves
    for future sessions by modifying the ~/.Emacs file accordingly by putting code
    in the ~/.Emacs file.


    # 3.16.2.4 More about Emacs Variables


    A variable is an elisp symbol that has a value. The symbol''s name is the variable
    name. A variable name can contain any characters that can appear in a file, but
    most variable names consist of ordinary words separated by hyphens.

    The name of the variable is descriptive of its role in the Emacs environment.
    Most variables also have a documentation string, which describes what kind of
    value it should have, and how the value will be used.


    You can view the documentation for a variable, such as somevariable, using the
    command <Ctrl+H> v Describe variable: somevariable in the minibuffer. To find
    this type, use the command <Ctrl+H> v; the system prompts you in the minibuffer;
    then type in the variable name, such as somevariable, and press <Enter>.


    Elisp uses are variables for internal record keeping, as noted earlier, the most
    interesting variables for a user who will not be writing elisp programs per se
    are those meant for users to change—these are called customizable variables or
    user options.'
