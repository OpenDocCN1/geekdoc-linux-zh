    # In-Chapter Exercise\n\n+   5. Type the two commands on your Raspberry Pi OS\
    \ system:\n\n```\n$ cd / \n$ ls\n```\n\nSimilar to Figure 0.1, sketch a diagram\
    \ of the directories and files whose names you see listed as the output of the\
    \ second command. Save this diagram for later.\n\n# 0.2.2 Viewing the Contents\
    \ of Files\n\nTo begin working with files, you can easily create a new text file\
    \ by using the cat command. The syntax of the cat command is follows:\n\ncat [options]\
    \ [file-list]\n\n+   **Purpose:** Join one or more files sequentially or display\
    \ them in the console window\n**Output:** Contents of the files in file-list displayed\
    \ on the screen, one file at a time\n**ly used options/features:**\n+E Display\
    \ $ at the end of each line\n-n Put line numbers on the displayed lines\n-- help\
    \ Display the purpose of the command and a brief explanation of each option\n\n\
    The cat command, short for concatenate, allows you to join files. In the example\
    \ you will join what you type on the keyboard to a new file created in the current\
    \ working directory. This is achieved by the redirect character >, which takes\
    \ what you type at the standard input (the keyboard) and directs it into the file\
    \ named myfile. You can consider the keyboard, and the stream of information it\
    \ provides, as a file. As stated in the Preface, this usage is an example of a\
    \ command, cat with no options, option arguments, or command arguments. It simply\
    \ uses the command, a redirect character, and a target, or destination, named\
    \ myfile, where the redirection will go.\n\nThis is the very simplest example\
    \ of a multiple command typed on the command line, as opposed to a single command,\
    \ as shown and briefly"
