  md: '# 234 Raspberry Pi OS System Administration: Ancillary Topics


    Elisp allows any variable (with a few exceptions) to have any kind of value. However,
    many variables are meaningful only if assigned values of a certain type. Only
    numbers are meaningful for kill-ring-max, which specifies the maximum length of
    the kill ring; if you assign kill-ring-max a string as value, commands such as
    <Ctrl-Y> (yank) will signal an error. On the other hand, some variables don''t
    care about what kind or type of value you assign them; for instance, if a variable
    has one effect for nil values and another effect for non-nil values, then any
    value that is not the symbol nil induces the second effect, regardless of its
    type (by convention, we usually use the t—a symbol that stands for “true”—to specify
    a non-nil value). If you set a variable using the customization buffer, you need
    not worry about giving it an invalid value: the customization buffer only allows
    you to enter meaningful values. When in doubt, use <Ctrl+H> v Describe variable:
    somevariable to check the variable’s documentation string to see the kind of value
    it expects.


    # 3.16.2.5 Examining and Setting Variables


    The following are some examples of how to examine and set the values of user options.
    The first general form of this syntax is:


    ```

    <Ctrl+H> v variablename<Enter>

    ```


    This general form uses Emacs help function with the v option and displays the
    value and documentation for variable variablename. The second general form achieves
    the change in the variables value:


    ```

    <Alt+X> set-variable <ENTER> var <ENTER> value <ENTER>

    ```


    This changes the value of variable var to value. It reads a variable name that
    you supply by typing in the minibuffer, completion, and displays both the value
    and the documentation of the variable. For example:


    ```

    <Ctrl+H> v fill-column <ENTER>

    ```


