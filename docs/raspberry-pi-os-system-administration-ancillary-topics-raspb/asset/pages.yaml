    # 2.2.6 Wayland Rendering


    One of the details from the above overview is how clients actually render under
    Wayland. By removing the X server from the picture we also remove the mechanism
    by which X clients typically render. But there''s another mechanism that we''re
    already using with DRI2: direct rendering. With direct rendering, the client and
    the server share a video memory buffer. The client links to a rendering library
    such as OpenGL that knows how to program the hardware and renders directly into
    the buffer. The compositor in turn can take the buffer and use it as a texture
    when it composites the desktop. After the initial setup, the client only needs
    to tell the compositor buffer to use when and where it has rendered new content
    into.


    This leaves an application with two ways to update its window contents:


    +   1. Render the new content into a new buffer and tell the compositor to use
    instead of the old buffer. The application can allocate a buffer every time it
    needs to update the window contents or it can keep (two or more) buffers around
    and cycle between them. The buffer management is entirely under application control.

    2. Render the new content into the buffer that previously told the compositor
    to use. While it''s possible to just render directly into the buffer shared with
    the compositor, this might race with the compositor. What can happen is that repainting
    the window contents could be interrupted just after clearing the window before
    rendering the contents, the compositor will texture from a blank buffer. The result
    is that the application window will flicker between a blank window or half-rendered
    content. The traditional way to avoid this is to render the new content into a
    back buffer and then copy from'
