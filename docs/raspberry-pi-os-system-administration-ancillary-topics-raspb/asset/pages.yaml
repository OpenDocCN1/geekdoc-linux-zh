  md: '# ZFS Administration and Use


    RAID-Z/RAID-Z1: A minimum of three devices (one disk and parity); you can suffer
    a one-disk loss.

    RAID-Z2: A minimum of four devices (two parity disks); you can suffer a two-disk
    loss.

    RAID-Z3: A minimum of five devices (three parity disks); you can suffer a three-disk
    loss.


    Spare: Hard drives marked as hot spare for ZFS RAID. By default, hot spares are
    not used in a disk failure; you must turn on the autoreplace feature.


    +   5. Cache


    A zfs caches both the least recently used (LRU) and least frequently used (LFU)
    block requests; the cache device uses level-2 adaptive read cache (L2ARC).


    +   6. Log


    There are two log types used:


    ZFS intent log (ZIL): A logging mechanism where all the data to be written are
    stored, then later flushed, as a transactional write; this is similar to a journal
    file system (ext3 or ext4).

    Separate intent log (SLOG): A separate logging device that caches the synchronous
    writes of the ZIL before flushing them to the slower disk; it does not cache asynchronous
    data (asynchronous data are flushed directly to the disk). If the SLOG exists,
    the ZIL will be moved to rather than residing on the platter disk; everything
    in the SLOG will always be in the system memory. Basically, the SLOG is the device
    and the ZIL data on the device.


