  md: '# Raspberry Pi OS System Administration: Ancillary Topics


    # IV. Sharing ZFS Pools with NFSv4


    This is the critical aspect of your operations on the server. To share the ZFS
    pool newpool via NFSv4, you have to set the sharerens property of your ZFS pool
    accordingly.


    The sharerens property in the context of the ZFS command is used to control the
    NFSv4 sharing behavior for a ZFS file system. NFSv4 is a distributed file system
    protocol that allows remote systems to mount file systems over a network and interact
    with them as they are local.


    The sharerens property is specific to ZFS and determines whether a ZFS file system
    is shared via NFS, and if so, with what options. It has the following syntax:


    ```

    zfs set sharerens=value filesystem

    Common NFS options include:

    ```


    +   - **ro**: Read-only access.

    - **rw**: Read and write access.

    - **root=client**: Allows the specified client to have superuser (root) access.


    To allow everyone on your network read/write to the ZFS pool newpool, you can
    set the sharerens property of the ZFS pool newpool as follows:


    ```

    bob@bob-ProLiant-MicroServer:~$ sudo zfs set sharerens=''rw'' newpool

    bob@bob-ProLiant-MicroServer:~~$

    ```


    or-


    ```

    bob@bob-ProLiant-MicroServer:~$ sudo zfs set sharerens=rw=\nnewpool

    ```


    You can verify whether the sharerens property is correctly set on the ZFS pool
    newpool as follows:


    ```

    bob@bob-ProLiant-MicroServer:~$ sudo zfs get sharerens newpool

    ```


    | NAME PROPERTY VALUE SOURCE |

    | newpool sharerens rw local |


    ```

    bob@bob-ProLiant-MicroServer:~-$

    ```


