    Username\" \\\n  --add-password=\"Password\" \\\n  --add-entry=\"User Number UID\"\
    \ \\\n  --add-entry=\"Group Number GID\" \\\n  --add-entry=\"GECOS Entry\" \\\n\
    \  --add-entry=\"Default Home Directory\" \\\n  --add-entry=\"Default Shell\"\
    \ \\\\\n>> zen_out\nsed -i 's/\\|/:|g' /home/bob/zen_out\n```\n\nb. On the command\
    \ line, use the chmod u+x zen1, then on-screen, type ./zen1\n\nA zenity dialog\
    \ box will open on-screen, as seen in Figure A.1. In the GUI dialog box you will\
    \ create the seven fields needed to be supplied to the newusers command, to create\
    \ new users from a “batch file” on your Raspberry Pi system. The seven inputs\
    \ you supply to the dialog box will be written to a file named zen1_out.\n\nThe\
    \ seven fields, separated by the colon character (:), are the new user accounts\
    \ name, password, UID, GID, GECOS commentary, default home directory, default\
    \ shell.\n\n![](img/85b80a687837f6390659e970808a43ef_279_0.png)\n\nFIGURE A.1\n\
