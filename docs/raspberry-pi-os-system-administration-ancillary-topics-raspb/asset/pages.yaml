    # 2.7.2 What gnuplot Is and Basic Syntax for Interactive and Batch Modes


    Gnuplot is an X Window command-line data and scientific graphing package for Linux
    and UNIX. Gnuplot supports many types of plots in 2D and 3D. It can draw lines,
    points, bars, contours, surfaces, and various associated text. It also supports
    various specialized types. Gnuplot also supports many different types of output
    formats: interactive screens (with mouse and keyboard), printers, and to a variety
    file formats (eps, emf, fig, jpeg, LaTeX, pdf, png, postscript, etc.). Recent
    additions in Release 5 include wxWidgets, and Qt-based graphics terminals.


    The "interactive" command language is case sensitive. All command names have standardized
    abbreviations. Any number of interactive commands may appear on a line, separated
    by semicolons (;). String arguments to interactive commands may be delimited by
    single or double quotes, although there are some differences in the interpretation
    of quoting.


    Example:


    ```

    gnuplot> set title "My First Plot"; plot ''data''; "print all done!",

    ```


    Commands may exist over several input lines by ending each line (except the last
    one!) with a backslash (\). The backslash must be the last character on each line.
    In gnuplot documentation, curly braces ({}) denote optional arguments, and a vertical
    bar (|) separates exclusive choices. Gnuplot keywords or help topics are indicated
    by backquotes, and are in bold-face type. Angle brackets (<>) are used to mark
    replaceable tokens. In many cases, a default value of the token will be taken
    for optional arguments if the token is omitted, but these are not always denoted
    with braces around'
