    # 2.2.7 Differences between Wayland and X


    There are several differences between Wayland and X in regards to performance,
    code maintainability, and security:


    Architecture:

    The compositor manager is a separate component in X, while Wayland merges display
    server and compositor as a single function. Also, it incorporates many of the
    tasks of the window manager, which in X is a separate client process.


    Compositing:

    Compositing is optional in X, but mandatory in Wayland. Compositing in X is “active”;
    that is, the compositor gets all pixel data, introduces latency, or delay. In
    Wayland, compositing is “passive”, which means the compositor receives pixel data
    directly from client programs.


    Rendering:

    The X server itself is able to perform rendering, and can be instructed to display
    a rendered window sent by a client program. In contrast, Wayland does not expose
    any API for rendering, but delegates to clients these things (including the rendering
    of fonts, widgets, etc.).


    ***Note***nWindow decorations can be rendered by the client (via a graphics toolkit)
    or by the server (via the compositor).


    Security:

    Perhaps more important in server installs of other distros, Wayland isolates the
    input and output of every window, so that code needs to run with root privileges,
    improving security. But in modern, and popular Linux distros, a system without
    a GUI can be run without root privileges nowadays.'
