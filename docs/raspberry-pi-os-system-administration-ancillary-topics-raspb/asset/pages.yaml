  md: '# Raspberry Pi OS System Administration: Ancillary Topics


    Deduplication: Data deduplication is a method of reducing storage capacity needs
    by eliminating redundant data. Only one unique instance of the data is actually
    retained on storage media. Redundant data are replaced with a pointer to the unique
    data copy.


    Filesystem: A ZFS dataset of file system that is mounted within the standard system
    namespace, and behaves like other file systems.


    Mirror: A vdev stores identical copies of data on two or more media, in a variety
    of ways defined by Redundant Array of Independent Disks (RAID) specifications.
    If any disk in that mirror fails, any other provide the same data, according to
    those RAID specifications.


    Pool: A logical group of devices describing the layout and characteristics of
    the available storage. Disk space for datasets is allocated from a pool.


    RAID-Z: A virtual device that stores data and parity on multiple disks, using
    the RAID specifications.


    Resilvering: The process of copying data from one device to another device is
    known as resilvering. For example, if a mirror device is replaced or taken offline,
    the data from an up-to-date mirror device are copied to the newly restored mirror
    device. This process is referred to as mirror resynchronization in traditional
    volume management.


    Slice: A partition created with partitioning software.


    Snapshot: A read-only copy of a file system or volume at a given point in time.


    Vdev (virtual device): A whole disk, a disk partition, or a collection of the
    previous, all of the same type. There is no performance penalty for using disk
    partitions rather than entire disks. The write cache is disabled for partitions,
    incurring a performance penalty. Using files as vdevs is discouraged, except for
    experimenting and testing purposes as we do in this chapter for beginners! A collection
    of vdevs is a mirror.


    Volume: A dataset that represents a block device. For example, you can create
    a ZFS volume as a swap device.


    # 1.1.3 How ZFS Works


    +   - Create zpool mapped to vdev >

    - Create ZFS file system(s) on zpool >

    - Add files to filesystem(s)>

    - Manage the file, file systems, zpools, and vdevs.


    Simply stated, you create a zpool first, which at the time it is mapped or associated
    with a vdev, such as an external medium physically'
