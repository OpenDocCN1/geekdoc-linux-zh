  md: '# ZFS Administration and Use


    10. Cloning/promoting file systems:


    Clones are writable file systems that have been upgraded from a snapshot. A dependency
    will remain on the snapshot as long as the clone exists. A clone uses the data
    from the snapshot to clone. As you use the clone, it uses space separate from
    the snapshot. Clones cannot be created across zpools, you will need to use the
    zfs send/receive commands to do this, as shown in Example 1.2.


    ```

    zfs clone data7@1002210 data8/clone

    zfs clone -o mountpoint=/clone data7@1002210 data8/clone

    ```


    Clones, changes the mount point of the clone.

    Further examples:


    ```

    zfs promote data8/clone

    ```


    Promotes a clone. This allows you to destroy the original file system that the
    clone is attached to. The clone must reside in the same pool!


    11. Renaming a file system:


    ```

    zfs rename data03/koretsky_disk01 data03/koretsky_d01

    ```


    The dataset must be kept within the same pool. There are two options on this command:
    -p creates all the nonexistent parent datasets; -r recursively renames the snapshots
    of all descendent datasets (used with snapshots only).


    12. Compression of file systems:


    ```

    zfs set compression=lzjb data03/bob

    ```


    You enable compression by setting a feature. Compressions are on, off, lzjb, gzip,
    gzip[1-9], and zle. Compression only starts when you turn it on; other existing
    data will not be compressed.

    Further examples:


    ```

    zfs get compressratio data03/bob

    ```


    You can get the compression ratio.


    13. Deduplication:


    You can save disk space using deduplication.


    ```

    zdb -b data01

    ```'
