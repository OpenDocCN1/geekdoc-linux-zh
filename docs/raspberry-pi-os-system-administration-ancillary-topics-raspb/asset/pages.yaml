    if those sequences don''t have their own local bindings, their global bindings
    remain in effect.


    Another way to think of this is that Emacs handles a multient sequence by looking
    in several keymaps, one by one, for a binding of the whole key sequence. It first
    checks the minor mode keymaps for minor modes that are enabled, then it checks
    the major mode''s keymap, and then it checks the global keymap.


