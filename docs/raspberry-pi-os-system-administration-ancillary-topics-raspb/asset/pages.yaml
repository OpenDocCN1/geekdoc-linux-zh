    # 2.4.1.1 The XCB API


    The Application Programming Interface (API) structure of XCB has two basics layers,
    a lower layer, XCB Connection, that supports the establishment of an X server
    connection, and an intermediate XCB protocol layer. The XCB Protocol layer provides
    a direct C API for the X Protocol. There are also many APIs available that provide
    other types of interaction between client and server. The XCB API uses an Xlib-style
    “event loop” method of interaction. Unlike Xlib, which blocks and caches requests,
    XCB requests are converted into “reply cookies”, which use a form of caching that
    makes the cache of event replies more efficient.


    XCB has an efficient data structure and interface. As can be seen in the examples
    in Section 2.4.1.3, the establishment of the server-side connection, using a closed
    data structure, is the first action a client-side application.


    Contrary to the Xlib partitioning of hostname/display/screen, as we see in Section
    2.3.9.1, XCB limits the connection data to a single display. The only of “screen”
    in XCB as defined in the X Window System Protocol, becomes the root window of
    that single display. Event and request queues are established and flushed in a
    manner that supports, most importantly, a purely asynchronous form of interaction
    between client and server.


    The XCB data structure/function call API can be broken into a variety of categories,
    such as functions that create connections and XIDs, non-blocking requests such
    as drawing primitives, blocking requests, retrieval of data, and event and error
    handlers.


