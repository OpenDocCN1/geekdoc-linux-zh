    # 2.6 The GTK Framework


    For our purposes in this chapter, GTK4 (formerly the GIMP Toolkit) is used for
    developing X Window System client applications with a GUI. Very similar to the
    Qt5 framework shown in Section 2.5, applications range from the most basic up
    to entire windowing systems. GTK4 is a “cross-platform” toolkit for creating graphical
    user interfaces. Cross-platform means that a GTK4 program can be transposed from
    the X Window System environment to another operating system’s environment easily,
    so that the GUI developed for the X Window System can have the look and feel of
    some other operating graphical environment.

    GDK (GIMP Drawing Kit) is a higher-level suite of tools that provides functionality
    to underlying windowing and graphics system. Each user interface created by GTK4
    consists of widgets. These are implemented in C using the Glib Object System (GObject),
    that provides an object-oriented “framework”'
