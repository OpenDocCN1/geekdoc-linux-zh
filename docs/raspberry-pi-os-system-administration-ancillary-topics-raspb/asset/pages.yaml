    # Example 1.4: ZFS Filesystems with NFSv4


    **Objectives:**


    To illustrate how to set up a Network File System, version 4 (NFSv4) “share"

    on a Raspberry Pi system, so that you can attach additional media containing

    y ZFS pools and filesystems to access them from remote computers on

    your intranet.


    **Introduction:**


    To follow up and extend the objectives and procedures of Example 1.3,

    y might want to be able to attach additional, and varied, media to your

    Raspberry Pi, via bus architectures other than the available USB-mounted

    variety. This could be your objective, in conformance with our recommended\ondata
    storage, to maintain the boot/system disk for your Raspberry Pi OS on

    one discrete medium, and your user data files on other media. Currently,

    even the introduction of a single-lane PCI Express 2.0 interface on

    the Raspberry Pi 5, the attachment of external media that doesn’t have its

    own power supply is limited to the four USB connectors mounted on

    the Raspberry Pi board. Of course, you could always extend that complement

    of connectors with various hubs, powered or not. But instead of relying

    the RPi’s media connectivity complement, in this example we mount

    a ZFS filesystem as a “share” from another computer on our intranet

    can accommodate a larger number of additional media, using SATA bus

    architecture.


    ***


    There’s no reason why the NFSv4 can’t be using two Raspberry

    OS computers. So client and server can both be Raspberry Pi systems. In

    our case, in terms of operating,, the computer that is

    offering the “share” is running the latest release of Ubuntu software the

    this time was written, Ubuntu 23.10. That computer becomes

    the “server”, and our Raspberry Pi 400 becomes the “client”. The two reasons

    used a X86 architecture system running Ubuntu 23.10 are that it could

    eazy have ZFS installed on it, and it had four SATA bus “bays” that could

    loaded with large-capacity SSD drives.


    In NFSv4, a “share” refers to a directory or file system that is avail-

    to connect networks for remote access. It allows multiple clients to access'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'and interact with the shared resources residing on a server over the network,
    using the NFSv4 protocol. This sharing mechanism is commonly used in networked
    environments for efficient file access and management. We acquaint please that
    with the sharing of a DFS pool and a filesystem on that pool, where the pool and
    filesystem are resident on the server which can accommodate four SATA bus devices.
    Some key ideas related to NFSv4 share:


    +   1. Exporting Directory /File System: The directory or file system that you
    want to make accessible to remote clients to be “exported”. This means configuring
    the NFS server to allow remote clients to access the specified directory or file
    system.


    +   2. NFS Exports File: In the NFS server configuration, there is often a file
    called /etc/exports (on Unix/Linux systems) where administrators define which
    directories or file systems are exported, along with the access permissions and
    options for each export.


    +   3. Mounting on Client: On the client side, the exported directory or file
    system can be mounted as if it were a local resource. This allows users the client
    machine to interact with the remote as if they were part of their local file system.


    +   4. Access Control: NFSv4 introduces improved security features compared to
    earlier versions, including better support for access control lists (ACLs) and
    stronger authentication mechanisms.


    +   5. Locking Mechanisms: NFSv4 supports advanced locking mechanisms to coordinate
    access to files between different clients to prevent conflicts and ensure data
    consistency.


    ***Note***

    In fact, in Volume 1 of this series, Chapter 1, Section 1.15.2, we give complete
    procedures for installation and configuration of sharing files between an NFSv4
    server and client, both of which are Raspberry Pi systems.


