    # 2.6.2 GTK4 Basics


    Widgets are organized in a hierarchy. The window widget is the main container.
    The user interface is then built by adding buttons, drop-down menus, input fields,
    and other widgets to it. If you are creating complex interfaces it is recommended
    to use GtkBuilder and GTK-specific markup description language, instead of assembling
    the interface manually. You can also use a visual interface editor, like Glade.
    GTK4 is very similar to the X11 protocol structure, in that it is event-driven.
    The toolkit listens for events over the X server, such as a mouse click, and passes
    the event notification to your client application. You can compile a GTK program
    on the Raspberry Pi system, using gcc, with the following command:


