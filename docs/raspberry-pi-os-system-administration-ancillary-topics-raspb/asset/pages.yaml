    # Example 1.3: Mirroring of USB3 Flashrives


    **Objectives:** To create a mirror of a pair of USB3 flashrives that have been
    added to the system sometime after the initial build of the system.


    **Introduction:** The following example illustrates two of the most important
    storage model and disk maintenance procedures a user can operate under and perform:
    the maintenance of user files on media other than the boot/system medium that
    the Raspberry Pi OS is installed on, and the mirroring of a physical device using
    the zpool attach command. In the example, we mirror a ZFS vdev flashdrive onto
    another flashdrive of equal size. This is a very important system administration
    maintenance task, because if one of the flashrives fails, you have an exact duplicate
    of it attached to your machine, which contains and archives the user data redundantly.


    The resilvering operation for a 256 GB flashdrive in this example, with very little
    data on it, takes about five minutes, depending on the USB ports you have inserted
    the flashrives in.


    You can operate in a redundant way with the two mirrored flashrives. You will
    not lose service if only one of them fails. The original flashdrive can have all
    of your user datasets on it. For some reason, you do a media failure, you can
    then replace the failed flashdrive if necessary, and in a few ZFS command steps,
