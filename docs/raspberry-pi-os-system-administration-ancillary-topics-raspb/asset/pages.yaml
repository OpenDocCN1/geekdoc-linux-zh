    As noted in our primary question, the Emacs editor is the most complex and customizable
    of the Raspberry Pi keystroke-command editors, and it gives you the most freedom,
    flexibility, and control over the way you edit text files. You can format text
    for very technical applications, such as program source code development, more
    effectively than a word processor. Its application makes the process of development
    more efficient. In addition, from within the Emacs program (deploying multiple
    windows) you can accomplish a wide variety of personal productivity and operating
    system tasks, such as sending e-mail and executing shell commands and scripts.


    But with more control, specificity, and capabilities comes a much steeper learning
    curve, which brings with it a more complex keystroke command structure. This complexity
    can be offset in some for users, and totally for others, by using the graphical
