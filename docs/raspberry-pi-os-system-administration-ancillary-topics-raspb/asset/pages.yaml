  md: '# 1.4.3 Cloning/Promoting


    As stated previously, clones are writable file systems that have been upgraded
    from a snapshot, and a dependency will remain on the snapshot as long as the clone
    exists. A clone uses the data from the snapshot to create. As you use the clone
    it uses space separate from the snapshot. Clones cannot be created across pools,
    unless you need to use the zfs send/receive commands to do this.


    Two examples of cloning:


    ```

    zfs clone data7@10022010 data8/clone

    zfs clone -o mountpoint=/ data7@10022010 data8/clone

    ```


    Promoting a clone allows you to destroy the original file system that the clone
    is attached to. An example of this is:


    ```

    zfs promote data8/clone

    ```


    The clone must reside in the same pool.


    # 1.4.4 Renaming a Filesystem


    The dataset must be kept within the same zpool! An example of this is:


    ```

    zfs rename data03/koretky_disk01 data03/koretky_d01

    ```


    There are two options on this command: -p creates all the nonexistent parent datasets;
    -r recursively renames the snapshots of all descendent datasets (with snapshots
    only).


    # 1.4.5 Compression of Filesystems


    You enable compression by setting a feature. Compressions are on, off, Lzbj, gzip[1-9],
    and zle. Compression starts when you turn it on; other existing data will not
    be compressed. A description of these forms of compression follows:


    lzbj:


    Lzbj is a compression algorithm used in the ZFS file system, which is developed
    by Sun Microsystems (now part of Oracle). It is designed to provide good compression
    and decompression speed with relatively low resource usage.


    gzip:


    gzip is a widely used data compression and decompression tool. It uses the DEFLATE
    algorithm, which is a combination of LZ77 (a sliding window'
