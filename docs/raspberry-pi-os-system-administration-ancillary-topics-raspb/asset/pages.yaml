    # 2.7.6 Plotting in Interactive Mode


    There are four basic gplot commands that create plots: plot, splot, replot, and
    refresh. plot generates 2D plots, splot generates 3D plots (2D projections onto
    a picture plane). replot appends its arguments to the previous plot or executes
    the modified command. refresh re-executes the previous plot or splot using stored
    data rather than rereading data from a file.


    # 2.7.6.1 Plotting Data Contained in a File


    Data contained in a file can be plotted with plot or splot by specifying the name
    of the properly formatted data file (enclosed in single or double quotes) on the
    ''plot'' command line.


    Syntax:


    ```

    plot <file_name> {binary list}

    {nonuniform} matrix|

    {index list} index "name>"

    {every every list}

    {skip <number-of-lines}>

    {using <using list}>

    {smooth option}

    {volatile} {noautoscale}

    ```'
