    For some terminals, no plot is displayed until the command `unset multiplot` is
    given, which causes the entire page to be drawn and then returns gnuplot


    to its normal single-plot mode. For other terminals, each separate `plot` command
    produces an updated display.


    The `clear` command is used to erase the rectangular area of the page that will
    be used for the next plot. This is typically needed to insert a small plot inside
    a larger plot.


    Any labels or arrows that have been defined will be drawn for each plot according
    to the current size and origin (unless their coordinates are defined in the ''screen''
    system). Just about everything else that can be ''set'' is applied to each plot,
    if you want to appear only once on the page, for instance a single time stamp,
    you''ll need to put a `set time`/unset time` pair around one of the `plot`, `splot`,
    or `replot` commands within the `set multiplot`/unset multiplot block.


    The multiplot title is separate from individual titles, if any. Space is reserved
    for it at the top of the page, spanning the full width of the canvas.

    The commands `set origin` and `set size` must be used to correctly position each
    plot if no layout is specified or if fine tuning is desired. See `set origin`
    and `set size` for details of their usage.


    Example:


    ```

    set multiplot

