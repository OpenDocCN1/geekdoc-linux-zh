  md: 'The way Wayland handles graphics in Linux has shifted from being centered around
    the X server to a different type of system. Wayland''s creator, Kristian Høgberg,
    decided to move away from X because a lot of the functions that used to be handled
    by the X server are now handled by the Linux kernel or libraries. Wayland allows
    the X server to become an optional part of the system.


    Wayland includes a protocol and a reference system called Weston. It also provides
    versions of popular libraries like GTK4 and Qt5 that work with Wayland instead
    of X. Most apps will eventually support Wayland without needing major changes.


    Initially, Wayland lacked network transparency, which is the ability to run apps
    remotely. Developers are working on solutions for this, such as VNC-like pixel-scraping
    and sending rendering commands across networks.


    In the Wayland protocol, a client (an app) and a compositor (a service that controls
    what you see on your screen) communicate through the Wayland protocol. This protocol
    follows the client-server model, where clients request the display of visual elements,
    and the compositor handles how they appear on the screen.


    The Wayland protocol is split into two parts: a low-level layer for communication,
    and a high-level layer for basic window system features. The low-level layer does
    data exchange between the client and compositor, while the high-level layer handles
    the information both need to create the display. This high-level layer is flexible
    and easy to update, because it uses automatic code generation via an XML file.


    The Wayland protocol includes two libraries: one for Wayland clients, and one
    for Wayland compositors. These libraries expedite development of apps and services
    that work directly with Wayland.


    # 2.2.3 Wayland Protocol Overview


    The Wayland protocol is a language that communicates between components of your
    hardware and software. There are two main types of items in the language: global
    items and non-global items. When your hardware or software want to provide a service,
    it''s pretty immediate.


    Your system can send messages back and forth to offer or request services. The
    Way protocol has its own special "language" for these messages. It has different
    "words" to describe what services are available and what''s needed to use them.
    These "words" can have extra details, like what they''re called, what they do,
    and how they work. This makes your system more versatile and flexible. So, think
    of the Wayland protocol as a message-passing machine that your computer uses to
    communicate internally and externally.'
