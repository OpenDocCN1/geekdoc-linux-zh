    # 3.16 Changing Emacs Behavior


    This section describes the basic methods of customizing and modifying the behavior
    of GNU Emacs. This includes the following operations:


    +   - Using the Options menu to modify options.

    - Using Custom (a GUI-based interface) to change preferences and options, and
    in conjunction with that interface, also using the traditional <Alt+X> customize
    command set.

    - Writing keystroke abbreviations with abbrev.

    - Writing keystroke macro commands.

    - Redefining keyboard keys.

    - Writing Emacs Lisp (elisp) code to customize the behavior of Emacs, and entering
    that code directly into your ~/.emacs startup file.


    All of these operations can make changes to your window and give you a more customized
    and personalized Emacs session, one customized to your particular needs and methods
    of entering text for a particular application.


    Be aware that by default, a ~/.emacs configuration file on the Raspberry Pi OS
    does not initially exist. But once you begin the procedures for customizing Emacs
    in the sections that follow, that file will be created by Emacs.


    Also, as will seen, elisp code is generated by what operations you do. But you
    don''t really need to know any of the details of how to program in elisp to achieve
    all of these operations!


    The following subsections describe and give examples of all of the given operations.
    In addition, Tables 3.5 and 3.6 give a summary of the important keystrokes that
    implement <Alt+X> customization, keystroke abbreviations with abbrev, and writing
    keystroke macros.'
  merge: -1
