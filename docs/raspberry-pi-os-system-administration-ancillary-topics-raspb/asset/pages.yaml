  md: '# X Windows System, Wayland, Xwayland, Wayfire, GTK, Qt, Gnuplot 127


    what the X Window System, and Xlib in particular, considers to be a display, a
    window. A display can possibly consist of one or more monitors that have a single
    shared keyboard and mouse. A screen is a single physical monitor. A window is
    a rectangular portion of any screen, sort of like a mini-monitor. A vast majority
    of ordinary users are looking at a single-monitor display, with only one screen,
    and that usually has multiple windows on it.


    In the context of, and to contrast and compare, graphics systems and display protocols,
    a Wayland surface refers to a drawable region within the Wayland display protocol.
    In the Wayland protocol, a surface represents a drawable area that a client can
    use to display its content.


    In simpler terms, a Wayland surface is an abstraction for a window or a graphical
    element that applications create and use to render user interfaces. The Wayfire
    compositor manages these screens, handling their placement, stacking order, and
    other aspects of their display on the screen.


    Compared to the traditional X Window System, Wayland is designed to be more lightweight
    and modern. It aims to provide better performance, improved security, and a more
    direct interaction between applications and the display hardware. Wayland surfaces
    play a key role in this architecture serving as the fundamental building blocks
    for graphical content within the Wayland display environment.


    Furthermore, from the programmers''perspective, an X Window system''s display
    is designated as hostname:displaynumber.screennumber.


    This designation, as an argument in the coding of a client determines what graphical
    screen to connect to, and screen to portray information on. Since the X Windows
    Protocol is equally applied via networked connections between various host computers,
    the *hostname* designates the name of the machine to which any display is physically
    connected to. The *displaynumber* (starting at 0) refers to the particular collection
    of monitors, on a possibly multi-monitor workstation. The term *screennumber*
    (starting at 0) refers to any single particular monitor in the displays collection.


    # 2.3.9.3 The Xlib Graphics Context (GC)


    What exactly is the Graphics Context (GC), as a resource that Xlib uses to produce
    simple types of graphics in Windows displays? The GC defines how primitives are
    drawn, and what characteristics and attributes the graphics, such as lines, rectangles,
    points, text, filled areas, etc., will have in any window display. GCs are kept
    in the server-side portion of the client-server software model, enhancing speed,
    performance, and storage requirements. There are basically two “targets” for the
    drawing of graphics primitives: windows and pixel maps, or pixmaps. These targets
    are referred to as drawables in X Window jargon.'
