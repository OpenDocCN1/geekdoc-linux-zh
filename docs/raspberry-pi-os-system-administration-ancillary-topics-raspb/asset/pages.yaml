  md: '# Raspberry Pi OS System Administration: Ancillary Topics


    Both Server and Raspberry Pi Client


    VIII. How to Allow Writing to the NFSv4 Shared ZFS Pools and Filesystems on both
    Server and Client


    At this point, if you attempt to write to the NFS shares /newpool or /newpool/system
    from either your Raspberry Pi client, or the server, you will get a denied message!
    To alleviate this problem, you can do the following:


    Set 0777 permission on the /newpool and /newpool/system directories of the NFSv4,
    server so that everyone can write to the ZFS newpool and NFS filesystem system.
    For our purposes here in this example and tutorial for beginners,


    ```

    bob@bob-ProLiant-MicroServer:-$ sudo chmod 0777 /newpool

    bob@bob-ProLiant-MicroServer:-$ sudo chmod 0777 /newpool/system

    bob@bob-ProLiant-MicroServer:-$

    ```


    There are other more techniques, strategies, and tactics you can deploy to give
    permissions. Here, we only outline one of them for you:

    You construct special group-specific permissions that allow only members belonging
    to those groups to write or read from the server pools and files.


    ***

    NFSv4 maps the UID (User ID) and GID (Group ID) of the specified NFSv4 clients
    with the UID and GID of the NFSv4 server. So, if a user/group has permission to
    write to an NFSv4 share on the NFSv4 server, then the same user/group with the
    same UID/GID will be able to write to that NFS share from the NFSv4 client computer.


    IX. Unsharing ZFS Pools and Filesystems


    If you want to stop sharing the ZFS pool newpool, you have to “reset” the shares
    property of the ZFS pool pool to off on the server as:


    ```

