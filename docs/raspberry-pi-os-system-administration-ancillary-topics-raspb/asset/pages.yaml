    # VII. Automatically Mounting NFSv4 Shared ZFS Pools and Filesystems


    You can mount the server NFSv4 ZFS /newpool and /newpool/system ZFS filesystem
    on your Raspberry Pi client automatically at boot time. To do that, open the Raspberry
    Pi client /etc/fstab file with the nano editor as:


    ```

    bob@raspberrypi:~ $ sudo nano /etc/fstab

    ```


    Add the following lines at the end of the /etc/fstab


    ```

    # Mount NFS shares

    192.168.1.27: /newpool /mnt/newpool nfsdefaults 0 0

    192.168.1.27:/newpool/system /mnt/system nfs defaults 0 0

    ```


    Once you''re done, in nano press <Ctrl + X followed by Y and <Enter> to save the
    /etc/fstab.


    For the changes to take effect, restart your computer (NFSv4 client) as:


    ```

    bob@raspberrypi:~ $ sudo reboot

    ```


    The next time your Raspberry Pi client machine boots, the NFSv4 shares /

    newpool and /newpool/system will be mounted in the /mnt/newpool and /mnt/system
    directories. To illustrate this type, type the following command on

    the Raspberry Pi client command line:


