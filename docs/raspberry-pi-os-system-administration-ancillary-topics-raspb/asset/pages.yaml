  md: '# 210 Raspberry Pi OS System Administration: Ancillary Topics


    To copy three words of text and then paste back at another position, set the mark
    by the point after the three words, and then press <Ctrl+@ at that position. Position
    the point before the three words; you have now defined a region between the point
    and the mark. There is only one mark in the document. Press <Esc+W> to send the
    text between the point and the mark to the Kill Ring; the text is sent, but it
    is not blanked from the screen display. To restore the three words at another
    position, move the point and press <Ctrl+Y>. The three words are restored at the
    new position. Table 3.4 gives the kill and yank commands for Emacs.


    Global search and replace can be either unconditional, where every occurrence
    of old text you want to replace with new text is replaced without prompting, or
    it can be interactive, when you are prompted by Emacs each occurrence of old text
    is replaced with new text. Also, the grammar of replacement can include regular
    expressions, which we do not cover.


    ***Note***


    On our Raspberry Pi system, the <Alt> key on the keyboard is the Metachar, signified
    in Emacs as M.


    For example, to replace the word men women from the position of the point to the
    end of the document, press <Esc%%>, replace-string, and press <Enter>. You are
    then prompted for the old string. Type men and press <Enter>. You are then prompted
    for the new string. Type women and then press <Enter>. All occurrences are replaced
    with no further prompts.


    To accomplish an interactive replacement, simply press <Esc+X>, query-replace,
    and then you can input old and new strings, but you are given an opportunity at
    each occurrence of the old string to replace it or not to replace it with the
    new string. Table 3.4 shows the actions you can take while doing an interactive
    search and replace.


