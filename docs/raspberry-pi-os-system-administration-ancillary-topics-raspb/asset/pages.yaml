    The device could not be opened.


    +   3. Scrubbing and Resiliency


    Scrubbing: Examines all data to discover hardware faults or disk failures. Only
    one scrub may be running at one time, and you can manually scrub.

    Resiliency: The same concept as rebuilding or resyncing data to new disks into
    an array. The smart thing resilvering is does not rebuild the whole disk, only
    the data that are required (the data blocks not free blocks), thus reducing the
    time to resync a disk. Resiliency is automatic when you replace disks and if a
    scrub is already running, it is suspended until the resilvering has finished,
    the scrubbing will continue.


    +   4. ZFS Devices and Device Terminology


    +   Disk: A physical disk drive.

    File: The absolute path of preallocated files/images.

    Mirror: Standard RAID1 mirror.

    RAID-Z1/2/3: Nonstandard distributed parity-based software RAID levels. Basically,
    if a power failure occurs in the middle of a write then you have the data plus
    the parity, or you don''t. Also, ZFS supports self-healing, which means that if
    it cannot read a bad block it will reconstruct using the parity, or indicate that
    this block should not be used.


    +   RAID-Z1: 3, 5, 9 disks

    RAID-Z2: 4, 6, 8, 10, 18 disks

    RAID-Z3: 5, 7, 11, 19 disks


    The more parity bits, the longer it takes to resilver an array. Standard mirroring
    does not have the problem of creating the parity, so it is quicker in resilvering.
    RAID-Z is more like RAID3 than RAID5 on another file system, but use parity to
    protect from disk failures.'
