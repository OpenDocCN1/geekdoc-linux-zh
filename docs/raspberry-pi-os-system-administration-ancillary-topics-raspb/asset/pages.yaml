    # 3.5 Buffers, File, Windows, and Frames


    The most important concept in Emacs is that of a buffer, or text object that is
    currently being edited by Emacs. This is different from a file, which is a text
    object stored on disk. The differentiation is made, in simple terms, because (1)
    the object currently being modified and viewed in Emacs is not the same object
    stored on disk, if you have not saved your edits; (2) Emacs can work on text objects
    that are not files and never be, as the output from commands typed on the command
    line, and use the option to specify a file to edit, what you are looking into
    the buffer created by Emacs for that file, which is generally known as an Emacs
    frame. That frame may contain only a single window open, that allows you to see
    the buffer contents. A frame consists of one window, or possibly many windows,
    with the pull-down and speed button menus, the mode line, and a minibuffer.


