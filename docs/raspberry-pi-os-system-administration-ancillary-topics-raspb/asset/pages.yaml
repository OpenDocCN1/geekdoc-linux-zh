    # 2.7 Gnuplot and the X Window System


    To complete our study of Wayland, and the X Window System on a Raspberry Pi, we
    turn in this section to a plotting package named gnuplot. For our purposes, there
    is a very important reason for using gnuplot: it makes possible to conform to
    a modularized idea of using the X Window System. You can have a discreet module
    create, another discreet module create and orchestrate the window display you
    want to present the data in, and then finally a discreet module map the data into
    the window display.


    We encourage you to compare the particular use case we show in this section, and
    this modularized approach, to the specific design and programming details and
    methodologies that would accomplish the same end result:


    +   * purely-Xlib or XCB C program,

    * an "augmented" C program for the GTK framework, or

    * a C++ Qt framework program.


    This model''s particular modularized use case does not replace using Xlib/XCB,
    GTK, or Qt as we have shown in the previous sections of this chapter. In addition,
    the window(s) you create are framed and constrained to a large extent by the particular
    window management system you are using. For example, by default we are using Wayfire,
    which has its own look and feel, window dressing, etc.


    # 2.7.1 Installing gnuplot


    There are two ways you install gnuplot on your Raspberry Pi system. The first
    way is the simplest: from the Raspberry Pi Menu, make the choice Preferences >
    Add/Remove Software. Then enter gnuplot, and press <Enter>. Put a check mark next
    to Command-line interactive plotting program, and click on the Apply button. The
    appropriate packages will be installed, along with the gnuplot-X11 package so
    you can get X Window System terminal output. At the time of the writing of this
    book, the latest gnuplot version and patches available were gnuplot5, which gave
    us gnuplot 5.4.1.


    Or you can get the gnuplot help at www.gnuplot.info and follow the download and
    installation instructions found there.'
