    # 0.2 File Maintenance Commands and Help On Raspberry Pi OS Command Usage


    After your first-time login to a new Raspberry Pi OS, one of your first actions
    will be to construct and organize your workspace environment, and the files that
    will be contained in it. The operation of organizing your files according to some
    logical scheme is known as file maintenance. A logical scheme used to organize
    your files might consist of creating bins for storing files according to the subject
    matter of the contents of the files, or to the dates of their creation. In the
    following sections, you will type file creation and maintenance commands that
    produce a structure similar to what is shown in Figure 0.1. Complete the operations
    in the following sections in the order they are presented, to get a better overview
    of what file maintenance really is. Also, it is critical to review what was mentioned
    in the Preface regarding the structure of a Raspberry Pi OS command, so that when
    you begin to type commands for file maintenance, you understand how the syntax
    of what you are typing conforms to the general syntax of any Raspberry Pi OS command.


    # 0.2.1 File and Directory Structure


    When you open a terminal, or console, you are working in the home directory, or
    folder, of the user associated with the username and password used to log into
    the system. Whatever directory you are presently in is known as the working directory,
    and there is only one current working directory active at any given time. It is
    helpful to visualize the structure of your files and directories using a diagram.
    Figure 0.1'
