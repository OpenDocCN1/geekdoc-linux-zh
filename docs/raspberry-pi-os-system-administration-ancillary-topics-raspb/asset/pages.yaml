  md: '# ZFS Administration and Use


    # Example 1.2: The zfs Command, Send and Receive, Snapshot


    **Objectives:**


    The following is a complete example of using the command zfs, with the sub-commands
    **send** and **receive**. Its primary objective is to show how to create a file
    system with the zfs command, and work with ZFS file systems.


    **Introduction:**


    In this example, we backup a file system with an incremental update, from one
    file system to another, on the same zpool and vdev. As Example 1.1, this creates
    a file in your home directory that *simulates* a vdev, so you don''t have to have
    a second hard disk available! This is the easiest, most-effective technique, and
    the best way to practice and develop your basic skills with ZFS.


    **Background:**


    Here, you back up a file system named **data** in the zpool named **sender** to
    another file system named **backup** in the pool, on the same vdev. The data file
    system contains a file we created **test.txt**. It uses the **snapshot** sub-command
    of the **zfs** command to achieve this. ZFS snapshots are frozen-in-time “pictures”
    of the state of the filesystem they are of.


    Two critical operations that involve taking snapshots of a ZFS filesystem are
    rolling back a snapshot, and using the zfs promote command. A brief description
    of those follows follows, with more examples provided in Section 1.3.3, items
    8 through 10, and Section 1.4.


    Rolling back a ZFS filesystem


    This important procedure allow you to revert a ZFS file system to a previous snapshot.
    Simply stated, it''s a built-in means for ZFS to backup and restore files. ZFS
    snapshots capture the state of the file system at a specific point in time, allowing
    you to roll back to that state if needed. Here''s a detailed example of rolling
    back a ZFS filesystem:


    +   1. List Snapshots


    First list the available snapshots for the ZFS filesystem you want to roll back.
    You can use the zfs list command for this:


    ```

    zfs list -t pool/filesystem

    ```


    In the above command, replace pool/filesystem with the actual name of your ZFS
    pool and filesystem. This command will display a list of snapshots, along with
    their creation times.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Raspberry Pi OS System Administration: Ancillary Topics


    +   2. Choose the Snapshot


    Identify the snapshot to which you want to roll back. Note the name and creation
    of the snapshot. For example, let''s say you want to roll back to a snapshot named
    @backup_20230101. Notice the name is descriptive of the date that the snapshot
    is taken.


    +   3. Perform the Roll Back


    To roll back the ZFS filesystem to the chosen snapshot, use the zfs rollback command:


    ```

    zfs rollback pool/filesystem@backup_20230101

    ```


    Replace pool/filesystem with the actual name of your ZFS pool and filesystem,
    and backup_20230101 with the name of the snapshot you want to roll back.


    +   4. Verify the Rollback


    Verify that the rollback was successful by listing the contents of the ZFS filesystem:


    ```

    ls /path/to/mount/point

    ```


    Replace /path/to/mount/point with the actual mount point of your ZFS filesystem.
    Check if the files and directories match the state captured by the chosen snapshot.


    +   5. Set the Mountpoint (if necessary!)


    If your ZFS filesystem has a different mount point and you want to persist it
    after a rollback, reboot the system


    ```

    zfs set mountpoint=/new/mount/point pool/filesystem

    ```


    Replace /new/mount/point with the desired mount point.


    ***Notes***


    +   a) Rolling back a ZFS filesystem will destroy all changes made since the chosen
    snapshot. Be careful and ensure you have a backup or understand the implications.


    +   b) The filesystem must be unmounted, or not in use during the rollback.

    c) It’s a good practice to take a new snapshot before performing a rollback, to
    provide a secure and quick way to revert to the original if necessary.'
