    # 1.4 File System Backups Using zfs snapshot


    Snapshots the ZFS way of creating archives and backups automatically, or with
    very simple script file operations and embedded commands. As stated previously,
    taking a snapshot of a file system is like taking a picture; changes are recorded
    to the snapshot when the original file system changes.


    Here are some important things to remember about snapshots:


    +   - a. To remove a dataset, all previous snapshots have to be removed.

    - b. You can rename snapshots.

    - c. You cannot destroy a snapshot if it has a clone.


    # 1.4.1 Examples of snapshot


    An example of creating a snapshot:


    ```

    zfs snapshot data01@10022010

    ```


    An example of renaming a snapshot:


    ```

    zfs snapshot data01@10022010 data01@mybackup

    ```


    An example of destroying a snapshot:


    ```

    zfs destroy data01@10022010

    ```


    # 1.4.2 zfs rollback


    It is possible to roll back a file system, or return it to a previous state. You
    must use the zfs rollback command. By default you can only roll back to the latest
    snapshot, or roll back to an older one you must delete all newer snapshots!


    An example of rolling back to a snapshot is:


    ```

    zfs rollback data01@10022010

    ```'
  merge: -1
