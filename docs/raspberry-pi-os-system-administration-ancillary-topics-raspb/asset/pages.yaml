    # 3.3 Emacs Help


    Emacs provides a wide variety of help commands, all accessible through the

    key sequence <Ctrl+H> or graphically with the function key <F1>. You can

    al type <Ctrl+H> <Ctrl+H> to view a list of help commands. You can scroll

    with the list <Space>, a list of keywords, and <Del>, then type the help command
    you want. To

    cancel, type <Ctrl+G>. Many commands display their information in a

    special buffer. In this buffer, you can type <Space> and <Del> to scroll

    and press <Enter> to follow hyperlinks.


    The following are the most general ways of obtaining help on a topic or

    command:


    <Ctrl+H> a topic(s)<Enter>

    This searches for commands whose names match the argument topic(s). The

    argument can be a keyword, a list of keywords, or a regular expression.


    <Ctrl+H> i d m Emacs <Enter> i topic <Enter>

    This searches for topic in the indices of the Emacs Info manual, displaying

    the first match found. Press , (comma) to see subsequent matches. You can

    use a regular expression as a topic.


    <Ctrl+H> i d m Emacs <Enter> s topic <Enter>

    Similar to <Ctrl+H> ... I topic, but searches the text of the Emacs manual

    rather than the indices.


    <Ctrl+H> <Ctrl+F>

    This displays the Emacs FAQ, using Info.


    <Ctrl+H> p

    This displays the available Emacs packages based on keywords.

    A summary of help command syntax is found in Table 3.1.'
