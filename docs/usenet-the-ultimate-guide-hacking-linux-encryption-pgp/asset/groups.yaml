    the encrypted container itself). You will have to mount it to the same letter
    directory each time if you don''t want to change it every session, however it
    makes it very hard to secure communications privately between you and someone
    else without the entire newsgroup seeing what you are saying or trading. There
    may be an instance where you spent a lot of money on a rare, vintage recording
    of an obscure album, and you don''t want anyone else in the mp3 group trying to
    make off it on eBay. Solution? Use Truecrypt to encrypt the mp3ps. Rar them up
    with a password and upload to a newsgroup on Usenet.


    If you are in a country that makes it difficult to engage in discussion online,
    such as Iran, China and the like, make sure that you do not leave your encrypted
    images running with your Usenet newsreader/browser. Doing so leaves all the data
    open to any kind of government entity that could raid your place of residence.
    Thus, if you are a regular poster in the group "alt.discussion.tibetan-freedom"
    it would be wise to not leave your PC running unattended at all, especially with
    a Truecrypt image mounted and in operation.


    # PGP and Usenet


    You can also use PGP to encrypt messages to newsgroup as well. PGP is a free encryption
    application similar (however more complex) to True. You can encrypt messages from
    one newsgroup to another, to any recipient you like, and they can in turn decrypt
