- md: "\n# USENET\n\n## THE ULTIMATE GUIDE\n\nBECAUSE YOU WANT WHAT YOU WANT\n\nLANCE\
    \ HENDERSON\n\n# USENET & THE FUTURE OF ANONYMITY\n\nBY\n\nLANCE HENDERSON\n\n\
    # TABLE OF CONTENTS\n\n- Chapter 1: What is Usenet?\n- Chapter 2: How to use Usenet\n\
    - Chapter 3: Usenet Reviews - Wheat and the Chaff\n- Chapter 4: Usenet Anonymity\n\
    - Chapter 5: Which VPN companies respect anonymity?\n- Chapter 6: The Cloud is\
    \ the Enemy of Usenet and Anonymity\n\n## Chapter 1: What is Usenet?\n\nYou've\
    \ probably heard the term “Usenet” floating around various tech forums of one\
    \ flavor or another. Some like the technology as being similar to P2P, while others\
    \ state that it is nothing like P2P. In truth, it has a little bit of both systems\
    \ in that\n\n- 1.) you can find almost any kind of file therein, as mp3s, games,\
    \ movies and the like\n- 2.) you have the ability to upload and download anything\
    \ you like\n\nSince its inception in 1979 by two Duke graduate students, Usenet\
    \ has leapt beyond all expectations in regards to not only data retention, but\
    \ enhancing freedom of speech. Whereas users were once inundated with extra charges\
    \ per month for downloading a handful of data, they now have the ability to download\
    \ terabytes per month, and pay ridiculously small sums to do so. This has all\
    \ been done with the help of not thousands of server farms around the world, but\
    \ also by legions of longtime Usenet users who upload (and leech) every kind of\
    \ file in existence. Thus, the true ingredients for the worldwide success of Usenet\
    \ hasn't been so much because of Usenet providers themselves, but by end-user\
    \ subscribers who faithfully upload the latest movie, game and music releases\
    \ every month to the over 100,000 available newsgroups on Usenet.\n\nWhat typically\
    \ happens when the average Joe off the street wants to subscribe to Usenet? He\
    \ usually ends up testing a free trial by one of the dozens of Usenet providers\
    \ for a period of two weeks, and then like any P2P user, they are hooked for life.\
    \ Or at least, the life of the subscription... and that subscription will likely\
    \ last a long time. Why? The answer lies in the perceived value of the goods he\
    \ acquires through said Usenet subscription. As mentioned, the worth of the goods\
    \ acquired far outweighs the monthly fee of the Usenet provider. There are over\
    \ 100,000 newsgroups, with the large majority of them being TEXT groups rather\
    \ than BINARY groups (i.e. where the real meat of Usenet is stored). The dirty\
    \ little secret among long-time Usenet users is this: Usenet would not be one-tenth\
    \ as popular as it is if it weren't for the bulk of groups like alt.binaries.boneless,\
    \ alt.binaries.hdtv and alt.binaries.complete_cd. One could make the argument\
    \ that text discussions certainly have their place that benefits society in some\
    \ manner, however the bottom line is that file sharing (again, mp3s, movies and\
    \ games) make up the bulk of not only Usenet, but is the reason Usenet companies\
    \ have been able to grow their businesses at exponential rates.\n\n### Risk vs.\
    \ Reward? Usenet vs. P2P\n\nIf you've paid attention to the news media outlets\
    \ over the past ten years, you're probably aware of the inherent risks associated\
    \ with using P2P systems like Emule, Limewire and the like in acquiring copyrighted\
    \ material. When you fire up a P2P program like Emule, you participate in downloading\
    \ with your IP address out the open, from which peers run by law enforcement (i.e.\
    \ NordicMule) or the Recording Industry can monitor the source and destination\
    \ with every file you transmit through the network. P2P in effect requires its\
    \ participants to upload as well as download. It is not so different than downloading\
    \ torrents in this regard. Usenet on the other hand, encourages leeching without\
    \ uploading. While you certainly have the freedom to upload, your downloads are\
    \ not crippled if you decide only to lurk and leech from the uploads of others.\
    \ What is more, you do so at your full internet speed, unlike peer-to-peer systems,\
    \ where you are at the mercy of others in the swarm.\n\nWhen someone uploads a\
    \ copyrighted film (Avengers, for instance) on a p2p or torrent system, it is\
    \ far easier to track said uploader to an ip address which leads straight to their\
    \ front door. If however the uploader used a premium Usenet provider to upload\
    \ the film, the movie lawyer must get his subscriber information from the Usenet\
    \ company before any action is taken. If he accessed his Usenet account through\
    \ a vpn provider, and used anonymous means to pay for his Usenet account, then\
    \ that adds a further layer of privacy that the entertainment industry lawyers\
    \ will have to peel back in order to reveal his identity. We'll discuss later\
    \ on the fruitfulness of signing up anonymously with Usenet and Vpn providers.\n\
    \nTo Summarize:\n\n- Pros to Usenet:\n- Not dependent on seeders like torrents\n\
    - Uses full bandwidth available on your internet connection\n- MPAA (Movie Industry),\
    \ RIAA (Recording Industry) cannot see your downloads as they they can with torrents\n\
    - Can utilize SSL to encrypt data on route to your pc (unlike torrents)\n- In\
    \ its 30 year history, no one has ever been sued for downloading anything off\
    \ Usenet (again, unlike torrents)\n\n- Cons to Usenet: \n- Requires a paid subscription\
    \ to access older posts\n- Posting/reading comments require a newsreader\n- Not\
    \ as easily accessible as torrent sites\n\n### Signing up for Usenet\n\nFor those\
    \ who are simply not concerned about privacy, you may consistently resist the\
    \ upselling offers of your Usenet provider’s advertisements regarding SSL. At\
    \ signup for some of the lesser known Usenet providers, the advertising might\
    \ incline you to believe you absolutely have to have SSL as an option, otherwise\
    \ your PC will certainly be hacked by all manner of gremlins, evil gnomes and\
    \ other boogeymen. Do not believe it. SSL often comes free with a subscription\
    \ to the major providers, however some will still charge extra for it.\n\nFor\
    \ users who value anonymity\n\nSome Usenet providers accept bitcoins as a method\
    \ of payment. If you are going to uploading a large amount of legally questionable\
    \ files and are based in the US, it might be prudent to sign up anonymously for\
    \ a Usenet account. Do not use any kind of payment that carries personal information\
    \ about you, such as your name, bank and the like.\n\n### Isn’t Uploading to Usenet\
    \ Anonymous with SSL Enabled?\n\nThe answer to this question is: sort of. Yes,\
    \ you can download with impunity. Yes, it encrypted the data in route to your\
    \ pc, from which point it is decrypted with the decryption key. Most Usenet providers\
    \ do not keep download logs of what you siphon from the binary Usenet newsgroups.\
    \ However, the catch is that if you upload, certain information is left as breadcrumbs\
    \ to your Usenet account. messages, in addition to your uploads (all of them)\
    \ contain unique header identification breadcrumbs, so to speak. If you were part\
    \ of some conspiracy group of assassins and shouted in some obscure newsgroup\
    \ that you were going to assassinate the president of the United States, then\
    \ the Secret Service could look at your headers and find out from the Usenet provider\
    \ where you lived if you did not sign up anonymously. The nntp posting host &\
    \ X-Trace lines in turn leads to the identity of the Usenet server, which in your\
    \ specific account. The Secret Service would have no idea that YOU posted it,\
    \ but they would know you used Astrawb or Easnews to post it. They in all probability\
    \ would not even need a subpoena for subscriber information, as most of the big\
    \ Usenet providers would gladly provide subscriber information that involved terrorist\
    \ threats, illegal porn or identity fraud (spam is a bit more involved, but then\
    \ again, the Secret Service doesn’t investigate Usenet spam.\n\nThere also exists\
    \ the possibility that the header could be encrypted by the Usenet server themselves,\
    \ in which case it can only be decrypted by them. The header might have some lightly\
    \ mosaic of jumbled letters mixed with numbers. It might say \"sdauhjk7lt324=assdad\"\
    , of which course would be unreadable to anyone except the Usenet provider, as\
    \ they hold the decryption key. It is somewhat similar in concept to the headers\
    \ from a free email service such as Yahoo or Hotmail. This is how the hacker who\
    \ pried vice-presidential candidate Sarah Palin's email was arrested: by revealing\
    \ the headers in the address bar. The FBI took this information from a screenshot\
    \ the hacker had posted and traced it back to the source. A vpn server would not\
    \ have helped in such a scenario, since they themselves are bound by the law,\
    \ and most of them reside in the US away. The only way we\n"
  mdcn: "\n\n# USENET（新闻组）\n\n## 终极指南\n\n因为你想要想要的\n\nLANCE HENDERSON\n\n# USENET 与匿名性的未来\n\
    \n作者\n\nLANCE HENDERSON\n\n# 目录\n\n- 第一章：什么是 Usenet？\n- 第二章：如何使用 Usenet\n- 第三章：Usenet\
    \ 评测 - 去芜存菁\n- 第四章：Usenet 匿名性\n- 第五章：哪些 VPN 公司尊重匿名性？\n- 第六章：云是 Usenet 和匿名性的敌人\n\
    \n## 第一章：什么是 Usenet？\n\n你可能在各种风格的科技论坛上听过“Usenet”这个词。有些人认为这项技术类似于 P2P（点对点传输），而另一些人则认为它与\
    \ P2P 毫无关系。事实上，它兼具两者的特点，因为：\n\n- 1.) 你可以在其中找到几乎任何类型的文件，如 mp3、游戏、电影等\n- 2.) 你有能力上传和下载你喜欢的任何内容\n\
    \n自从 1979 年由两名杜克大学的研究生创立以来，Usenet 在数据留存以及增强言论自由方面的表现远超所有预期。用户曾需要为下载少量数据支付每月的额外费用，而现在他们有能力每月下载数\
    \ TB 的数据，只需支付极其廉微的费用。这不仅得益于全球成千上万个服务器集群的帮助，还得益于大量长期 Usenet 用户，他们上传（并“白嫖”）世界上各种类型的文件。因此，Usenet\
    \ 在全球范围内成功的真正秘诀并不完全在于 Usenet 服务商本身，而在于忠实的终端用户订阅者，他们每个月都会向 Usenet 上超过 100,000 个可用新闻组上传最新的电影、游戏和音乐发行。\n\
    \n当一个普通路人想要订阅 Usenet 时，通常会发生什么？他通常会尝试几十个 Usenet 服务商之一提供的为期两周的免费试用，然后像任何 P2P 用户一样，从此深陷其中。或者至少在订阅有效期内……而这种订阅很可能会持续很长时间。为什么？答案在于他通过该\
    \ Usenet 订阅所获得商品的感知价值。正如提到的，所获得的商品价值远高于 Usenet 服务商的月费。这里有 100,000 个新闻组，其中绝大多数是文本（TEXT）组，而非二进制（BINARY）组（即\
    \ Usenet 核心内容存储的地方）。长期 Usenet 用户之间一个公开而不宣的小秘密是：如果没有像 alt.binaries.boneless、alt.binaries.hdtv\
    \ 和 alt.binaries.complete_cd 这样的组，Usenet 的流行程度将只有现在的十分之一。人们可能会认为，文本讨论确实有其价值并能以某种方式造福社会，但底线是，文件共享（再次提到，mp3、电影和游戏）构成了\
    \ Usenet 的主体，这也是 Usenet 公司能够以指数级速度增长业务的原因。\n\n### 风险与回报？Usenet 对比 P2P\n\n如果你关注了过去十年的新闻媒体，你可能已经意识到使用\
    \ Emule、Limewire 等 P2P 系统获取版权保护材料时具有固有风险。当你启动像 Emule 这样的 P2 程序时，你参与了下载，且你的 IP\
    \ 地址是公开的，因此由执法部门运行的对等节点（如 NordicMule）或唱片行业可以监控你通过网络传输的每一个文件的源地址和目的地。P2P 实际上要求参与者既上传又下载。在这方面与下载种子（torrent）没有区别。相比之下，Usenet\
    \ 鼓励在不上传的情况下下载。虽然你完全拥有上传的自由，但如果你决定只潜水并从别人的上传中下载，你的下载也不会受到限制。此外，你是以全网速度下载的，不像点对点系统，在系统中你受限于集群中其他人的速度。\n\
    \n当有人在 p2p 或种子系统上上传受保护的电影（例如《复仇者联盟》）时，追踪该上传者到直接指向其家门口的 IP 地址要容易得多。然而，如果上传者使用了高级\
    \ Usenet 服务商来上传电影，电影律师在采取任何行动之前，必须从 Usenet 公司获取其订阅信息。如果他通过 VPN 服务商访问 Usenet 账户，并使用匿名方式支付\
    \ Usenet 费用，那么又增加了一层隐私，娱乐行业的律师必须剥开这层隐私才能揭示他的身份。我们稍后将讨论注册 Usenet 和 VPN 提供者的有效性。\n\
    \n总结：\n\n- Usenet 的优点：\n- 不像种子那样依赖于种子者（seeders）\n- 使用互联网连接可用的全部带宽\n- MPAA（电影协会）、RIAA（唱片行业）无法像查看种子那样看到你的下载\n\
    - 可以利用 SSL 加密传输到你电脑的数据（与种子不同）\n- 在其 30 年的历史中，从未有人因为从 Usenet 下载过任何内容而被起诉（再次，与种子不同）\n\
    \n- Usenet 的缺点： \n- 需要付费订阅才能访问旧帖子\n- 发布/阅读评论需要新闻阅读器（newsreader）\n- 没像种子网站那样容易访问\n\
    \n### 注册 Usenet\n\n对于那些完全不在乎隐私的人，你可能会一贯抵制 Usenet 服务商广告中关于 SSL 的推销性要约。在注册某些一些较不为人知的\
    \ Usenet 服务商时，广告可能会让你认为你必须拥有 SSL 选项，否则你的电脑定会被各种小鬼灵、邪恶的小精灵和其他怪兽入侵。不要相信它。SSL 通常随主要服务商的订阅一起免费提供，但有些服务商仍会对此收取额外费用。\n\
    \n对于看重匿名性的用户\n\n一些 Usenet 服务商接受比特币作为支付方式。如果你将上传大量法律上可疑的文件且居住在美国，那么匿名注册 Usenet\
    \ 账户可能是明智的。不要使用任何带有你个人信息的支付方式，如你的姓名、银行信息等。\n\n### 开启 SSL 后上传到 Usenet 是匿名的吗？\n\n\
    这个问题的答案是：某种程度上。是的，你可以无顾忌地下载。是的，它加密了传输到你电脑的数据，从那里开始使用密钥进行解密。大多数 Usenet 服务商不会记录你从二进制\
    \ Usenet 新闻组提取内容的下载日志。但问题在于，如果你进行上传，某些信息会像面包屑一样留在你的 Usenet 账户。除了你的上传内容（所有内容），消息还包含独特的头部信息识别面包屑（可以这么说）。如果你是杀手阴谋集团的一员，并在某个模糊的新闻组中大喊你要刺杀美国总统，那么特勤局就可以查看你的头部信息，并从\
    \ Usenet 服务商那里发现你的住所（如果你没有匿名注册的话）。nntp 发布主机和 X-Trace 行反过来会指向 Usenet 服务器的身份，而在你的特定账户中，特勤局将不知道**是你**发布的，但他们会知道你使用了\
    \ Astrawb 或 Easnews 来发布。他们很可能不需要传票获取订阅信息，因为大多数大型 Usenet 服务商都会乐意提供涉及恐怖威胁、非法色情或身份诈骗的订阅信息（垃圾邮件要复杂得多，但特勤局并不调查\
    \ Usenet 垃圾邮件）。\n\n还存在头部信息由 Usenet 服务器本身加密的可能性，在这种情况下只有他们可以解密。头部信息可能包含一些杂乱的字母数字马赛克。它可能显示“sdauhjk7lt324=assdad”，对于持有密钥的\
    \ Usenet 服务商之外的任何人都无法读取。这在概念上与 Yahoo 或 Hotmail 等免费邮箱服务的头部信息相似。这就是获取获取副总统候选人萨拉·帕林邮箱的黑客被捕的原因：通过黑客发布的截图暴露了地址栏中的头部信息。FBI\
    \ 从该截图获取了信息并追溯到了源头。在这种情况下，VPN 服务器将没有帮助，因为它们本身受法律约束，且大多数居住在美国境外。我们唯一的方法是"
