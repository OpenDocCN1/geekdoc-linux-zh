    和 Windows Live Messenger 中，以防止恶意网站利用用户的浏览器。因此，验证和身份认证是该功能的重点，因为它试图防止垃圾邮件、恶意软件和广告软件感染用户的计算机。这是一件好事吗？对于大多数用户来说并不是，他们觉得这相当烦人。这是一种进一步、退两步的方法，实际上阻碍了数百万
    Internet Explorer 用户的互联网体验，因为他们尝试访问那些毫无危险的链接。进入 Windows 8 后，SmartScreen 功能尝试验证应用程序在操作系统上下载或运行是否“安全”。它检查一份动态的、不断变化的待利用
    URL 列表，微软已确认这些 URL 对 PC 系统上的终端用户有害。这的额外问题是关闭它很麻烦，一旦关闭，操作系统就会不断催促你重新启用。三到五年后它会变成什么？你是否必须让电脑上的每个应用程序或文件都经过微软服务器的“授权”才能执行它们？云内容以及合法购买并传输到你电脑上的项目又如何呢？


    对于新手来说，微软喜欢给经过数字签名的网站以及程序分配“下载声誉”分。这个问题与反病毒软件中表现出来的问题相同，即向用户抛出大量的误报，导致挫败和烦恼。有时，在
    Internet Explorer 9 中，下载文件被扫描时，下载会冻结。Internet Explorer 9 中没有关闭并让用户决定实施何种安全设置的选项。稀有文件不断被标记为对
    PC 有某种恶意。SmartScreen 功能还有一个进一步的隐私因素。它收集你在操作系统上安装的每个程序的数据，并检查微软的“云端”（即他们的服务器）上是否存在有效的证书，以验证其对你操作系统的“安全性”。它检查程序安装程序本身的哈希值，并将其与微软的列表进行比较。想想看你电脑上安装了多少与隐私相关的程序：PGP、Truecrypt、BitLocker、你的
    VPN 供应商通过邮件发送的安装程序或可能是加密到硬盘的密钥文件。对于任何黑客来说，获取此类内容将是史诗级的金矿。


    进入 Usenet。截至 2012 年，无需经过重重障碍加入 Usenet 是相对容易的。当你从 Usenet 下载数据时，数据通常由你的新闻阅读器或 NZB
    解码，然后保存到硬盘中。如果你安装了杀病毒软件，它很可能有某种元素检查通过 Usenet 或其他互联网变体下载到你电脑的每个可执行文件或安装程序。然而，随着最大限度提高云计算利用率的热潮，初始化此类安全设置的责任正逐渐从终端手中夺走。这对
    Usenet 意味着什么？可能会发生两种情况之一：


    - 1.) 最终，用户从 Usenet 流传输数据，这些数据将通过中间云服务器进行检查和“验证”，然后传递到你的硬盘（假设你有一个硬盘）。

    - 2.) Usenet SSL 将变得极其昂贵和/或仅保留给社会上的某些群体（如政府、情报部门等）。像 PGP、Freeten、Truecrypt 这一类的安全匿名程序将因为无法揭露和解密其真实内容而被云服务器污名化并回避。


