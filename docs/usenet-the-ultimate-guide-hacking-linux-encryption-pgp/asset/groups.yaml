    ## Chapter 2: How to use Usenet


    Over the past ten years, Usenet companies have made significant progress in simplifying
    what was originally a very cumbersome process for Usenet customers. After subscribing
    to a Usenet provider, it is now ridiculously simple to access the treasures that
    Usenet holds.


    ## Basics of Using Newsgroups


    **Downloading:** When you sign up for a ten dollar/month plan, your NSP (Newgroup
    Service Provider) will email you three things: your username, password, and news
    address for the server (i.e., news.astraweb.com as an example). There are many
    different Usenet tools available that are similar in function to how a browser
    works. You can opt for the simpler method, which requires downloading an .nzb
    file from sites like Binsearch, NZIndex, or Newzbin (paid) and then importing
    to a newsreader or downloader of your choice. One of the simplest is an app called
    Nzb-o-Matic Plus. In the options screen of the application, just insert your user/pass
    combo and the server address with port 119, then set a destination where your
    downloads reside. You can even choose the desktop. It’s simple. There are other
    newsgroup tools available as well.


    - **Newhosting Client** (requires signup) Free: The Newhosting client self-repairs
    files for you if you have a subscription to them. However this is a bit redundant
    since Quickpar and Winrar are free.


    - **Easynews Web Interface** (requires signup) Free: The Easynews Interface is
    similar to the Newhosting client in that you can see thumbnails of the files posted,
    if they are passworded, and will check for errors automatically.


    - **NewsBin Pro** $20


    - **SABnzbd** Free


    - **NewsLeecher** $20


    - **Binreader** Free


    - **GrabIt** Free


    - **Unison** $29.99


    - **EZ Global Search:** $2.99


    - **NZB-O-MATIC Plus:** Free: Nzb-o-Matic is perhaps the easiest out of all the
    above tools to hop board around Usenet. It is for downloading only however, but
    once you have the NZB file, you simply import, set your username/pass and download
    away.


    Uploading is a bit trickier, but by no means are you required to upload anything
    to Usenet, unlike torrents. If you are new to Usenet, be aware that anything you
    upload outside of a private proxy or Tor will leave your IP address exposed. Take-care
    if you are unsure if your uploads are copyrighted or not. They say, luck favors
    the prepared.


    ## How to Upload to Usenet: (if you have no intention of uploading, skip this)


    The process of uploading a small file is not extraordinarily different than uploading
    a large file. The main difference is that uploading a large file, say gigabytes
    in size, takes hours on a slow DSL connection. Nevertheless, let''s go through
    some admittedly simplified steps on how to do so. You''ll need some tools to do
    so, though these are fairly mandatory to the entire process. They are:


    - **Winrar** – archiving the files. You can''t upload a 25 gigabyte Blu-Ray movie
    to Usenet without risking it failing or timing out. Thus, it is better to use
    Winrar to break up your movie file in small chunks and upload those. You would
    be pretty angry if you spent two days downloading a Blu-Ray file only to find
    out it “skips” in the middle of the film. Thus, Winrar and Quickpar solve this
    problem by testing the authenticity for broken parts. Once you have Winrar installed,
    right click on the file and select “Add to Archive” from the Winrar context menu.
    Winrar adds this to the windows context menu, thus with a simple right click you
    can archive any file no matter the size. Just be sure and choose an appropriate
    size to upload. One hundred megabyte chunks is sufficient for anything over 1
    gigabyte. Smaller files like mp3s are usually fine with the mp3 non-archived,
    but will come with par files to repair redundancies/errors. When download finish
    downloading the rare pieces, they can right click on any of the rars and choose
    “extract here” to the present directory, or any directory wish. Before they do
    however, they will likely run Quickpar first to check for errors, provided YOU
    have uploaded pars alongside the rar files of your movie.


    Download Winrar at: https://www.rarlabs.com/download.htm


    Quickpar – for creating par files. This is not mandatory for Usenet users (unless
    the group specifically asks for it), but can be a godsend for downloaders as often
    Usenet servers will “hiccup” during the upload process. Creating parts at 100%
    redundancy is sufficient for most files.


    Download Quickpar at: http://www.quickpar.org.uk/Download.htm


    Camelsamer Powerpost (Windows only) - A freeware tool used to upload the rar and
    par files you created. It is delightfully simple to use. You will need your username
    and password combo from your Usenet provider, along with the port number to insert
    into the settings menu before you are allowed to upload.


    Download Powerpost at http://powerpost.camelsamer.nl/index.php


    NZB Files – You can think of NZB files as being similar to torrent files that
    you load into a downloader program. Instead of using uTorrent, you would import
    the file into something like Nzb-o-Matic Plus. The NZB file itself is the one
    you have selected from a site such as Binsearch or NZIndex. It can contain any
    number of pointers to the files you want, which may be in separate newsgroups.
    Using an NZB file makes it exponentially easier to manage the files.

