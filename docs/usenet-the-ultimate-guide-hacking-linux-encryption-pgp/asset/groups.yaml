    nfo 文件。


    **关于二进制组的一句警告：** 在这些“二进制”组中，你不会看到什么哲学讨论，除了对损坏的 rar/par 数量不足的争吵以及无休止的请求。如果你想进行政治或学术辩论，请订阅那个长长的（有数千个）标题中没有“binaries”的
    alt 组列表。


    ## 第 2 章：如何使用 Usenet


    在过去的十几年里，Usenet 公司在简化原本对 Usenet 用户来说非常繁琐的过程方面取得了显著进展。在订阅 Usenet 服务商后，现在访问 Usenet
    拥有的宝藏变得极其简单。


    ## 使用新闻组的基础知识


    **下载：** 当你注册每月 10 美元的计划时，你的 NSP（新闻组服务商）会通过邮件给你三样东西：你的用户名、密码和服务器新闻地址（例如，news.astraweb.com）。有很多不同的
    Usenet 工具，其功能类似于浏览器的工作原理。你可以选择更简单的方法，从 Binsearch、NZIndex 或 Newzbin（付费）等网站下载 .nzb
    文件，然后将其导入到你选择的新闻器或下载器中。最简单的工具之一是一个名为 `Nzb-o-Matic Plus` 的应用。在应用程序选项界面中，只需插入用户名/密码组合以及端口为
    119 的服务器地址，然后设置下载内容的存放位置。你甚至可以选择桌面。这很简单。还有其他新闻组工具可用。


    - **Newhosting Client**（需要注册）免费：如果你订阅了他们的服务，Newhosting 客户端会为你自动修复文件。然而，由于 Quickpar
    和 Winrar 是免费的，这有点多此此一了。


    - **Easynews Web Interface**（需要注册）免费：Easynews 界面与 Newhosting 客户端类似，你可以看到发布文件的缩略图，如果它们设置了密码，它会自动检查错误。


    - **NewsBin Pro** $20


    - **SABnzbd** 免费


    - **NewsLeecher** $20


    - **Binreader** 免费


    - **GrabIt** 免费


    - **Unison** $29.99


    - **EZ Global Search:** $2.99


    - **NZB-O-MATIC Plus:** 免费：Nzb-o-Matic 可能是上述所有工具中在 Usenet 之间穿梭最简单的。不过，它仅用于下载，但一旦你有了
    NZB 文件，只需导入、设置用户名/密码并开始下载即可。


    上传稍微复杂一点，但绝不是要求向 Usenet 上传任何内容，不像 torrent 那样。如果你是 Usenet 新手，请注意，在私有代理或 Tor 之外上传的任何内容都会暴露你的
    IP 地址。如果你不确定上传的内容是否受版权保护，请小心。他们说，幸运青青有准备的人。


    ## 如何上传到 Usenet：（如果你没有上传打算，请跳过此节）


    上传小文件的过程与上传大文件并没有特别不同。主要区别在于，上传大文件（例如几 GB 大的文件）在慢速 DSL 连接上需要几个小时。尽管如此，让我们过一下一些确实简化的操作步骤。你需要一些工具来完成，这些工具对于整个过程来说是强制性的。它们是：


    - **Winrar** – 对文件进行归档。你不能将一部 25 GB 的蓝光电影上传到 Usenet 而不冒着失败或超时的风险。因此，最好使用 Winrar
    将你的电影文件分成小块并上传这些块。如果你花费了两天下载一个蓝光文件，结果发现它在电影中途“跳过了”，你会非常生气。因此，Winrar 和 Quickpar
    通过测试损坏部分的真实性来解决这个问题。安装好 Winrar 后，右键点击文件，从 Winrar 右键菜单中选择“添加到压缩包”。Winrar 将此项添加到
    Windows 右键菜单中，因此只需简单右键，即可归档任何大小的文件。只需确保并选择合适的尺寸进行上传。对于超过 1 GB 的任何内容，100 MB 的块就足够了。像
    mp3 这样的小文件通常不需要归档 mp3，但会带上 par 文件来修复冗余/错误。当下载完这些稀有的碎片后，可以右键点击任何 rar 并选择“解压到此处”到当前目录或任何你想要的目录。在此之前，它们可能会先运行
    Quickpar 来检查错误，前提是你上传电影 rar 文件的同时也上传了 par 文件。


    在此处下载 Winrar：https://www.rarlabs.com/download.htm


    **Quickpar** – 用于创建 par 文件。这对于 Usenet 用户不是强制性的（除非该组专门要求），但对于下载者来说可能是救星，因为 Usenet
    服务器在上传过程中经常会发生“抽风”。创建具有 100% 冗余的分份对于大多数文件已经足够。


    在此处下载 Quickpar：http://www.quickpar.org.uk/Download.htm


    **Camelsamer Powerpost**（仅限 Windows）- 一个用于上传你创建的 rar 和 par 文件的免费工具。使用非常简单。你需要来自
    Usenet 服务商的用户名/密码组合，以及在允许上传之前插入设置菜单的端口号。


    在此处下载 Powerpost：http://powerpost.camelsamer.nl/index.php


    **NZB 文件** – 你可以将 NZB 文件理解为加载到下载程序的 torrent 文件。与其使用 uTorrent，你会将文件导入到像 Nzb-o-Matic
    Plus 这样的程序中。NZB 文件本身就是从 Binsearch 或 NZIndex 等网站上选择的那个。它可以包含指向你想要文件的任意指针，这些文件可能位于不同的新闻组中。使用
    NZB 文件会让文件管理变得极其简单。


