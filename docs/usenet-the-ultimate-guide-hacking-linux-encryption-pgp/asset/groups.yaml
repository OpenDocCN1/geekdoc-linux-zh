    Two, he cites the “Axis of Evil”, but clearly they are not in one of those countries.


    The above is not to suggest that their actual service is less than that they advertise,
    but the distinction between privacy and anonymity often falls victim to the gnomes
    who work in the marketing department of said companies. CryptoCloud is located
    in...San Antonio, Texas, which has one of the most brutally unmerciful judiciary
    systems in the United States. If a federal judge (or Congress) demanded the identity
    of one of their customers, you can be sure that such information would be handed
    over in a heartbeat in order to avoid heavy day-to-day fines. If they are based
    in the US, they would *have* to have your personal information available in order
    to avoid bankruptcy by the federal government. To wit, this doesn''t necessarily
    have to have anything to do with terrorism, cp, spam or counterfeiting. The case
    involving Megaupload proves that true anonymity, deonymity, at least that which
    is beyond the long arm of the law, is difficult to obtain, even if you reside
    in another country. Still, it is worth having a vpn account simply because it
    adds an extra layer of privacy to your sessions. If you are a habitual uploader,
    you could do a lot worse than to pay ten dollars a month for an extra peace of
    mind.


    The solution? Sign up to a vpn provider anonymously. There are several providers
    who accept Bitcoins as payment.


