    OS 将首次出现在三星和宏碁的全黑色笔记本电脑上。由于新平台在服务器上存储文件、应用程序、数据位和字节——真正的一切——而不是你的家里或办公室 PC，运行这些新
    PC 不需要大量的存储空间。事实上，它们根本不需要存储空间。”


    永远不要依赖云进行个人数据备份的进一步原因：


    - 1.) 你完全受制于互联网服务提供商的带宽限制。当你流传输自己的个人 mp3、游戏、视频（与他们自己的竞争）时，他们将从中大赚。


