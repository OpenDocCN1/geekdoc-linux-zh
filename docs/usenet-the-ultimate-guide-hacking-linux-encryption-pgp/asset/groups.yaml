    # Chapter 4: Usenet Anonymity


    In this chapter, we''ll discuss ways you can add anonymity to your Usenet connection,
    so that you can participate in discussion groups without fear of persecution.
    These methods often are most useful in situations where you may lose your Usenet
    account if you say the wrong things to the wrong people. Usenet companies are
    being business now, and unlike twelve years ago, will now think nothing of terminating
    your account if they get enough complaints. Simply being unpopular and taking
    a stand against the status quo in certain newsgroups can get your Usenet account
    banned (i.e. alt.privacy). However, with true anonymity, they may ban your account,
    but rest assured that not only will your words remain forever on Usenet, but you
    will not be persecuted for speaking out against a tyrannical government, or a
    company that you work for (which has happened many times by disgruntled employees
    on Facebook).


    It should be stated at the outset that Tor for Usenet binary downloads will actually
    strain the Tor network, just as it does with torrents. And to boot, whenever you
    use torrents via Tor, the torrent software actually sends your IP address to the
    recipient. It does so anonymously, in the same way a post office worker will deliver
    your mail. Needless to say this defeats the purpose of using torrents. This problem
    is not with the Tor code, but rather the way that applications like BitLord and
    BitTorrent are designed. The torrent applications themselves need to be coded
    to allow anonymity. It is better to use Free leech with the Frost addon for p2p-like
    trading you wish to remain anonymous. Tor is much more effective at textual discussions
    and binary downloaders using your native connection, but the easiest method to
    do this anonymously is by use of the remailer network. By using such a method,
    the identifying Usenet posts are stripped away from your messages, essentially
    erasing the digital trail that leads back to your IP address.


    As we have seen from past media reports around the world over the last several
    years, there could be any number of valid reasons you want to hide your identity.


    - Maybe you work for a computer manufacturer, or perhaps a robotics company and
    are concerned about the lack of safety measures being enforced by your superiors,
    but fear some kind of retaliation by them should you go public, like the loss
    of your job. Usenet is a great place to ask advice and not worry about the consequences.
    Places like Facebook and Twitter on the other hand might invite retribution by
    the executives or CEO of your company.


    - It could be that you want to vocally protest the prevailing winds of government.
    Doing so in countries like the US, Iran, China, and the like could put you on
    a “watch” list of sorts, and before you know it, you have problems relating to
    “no fly” lists at airports and border stations.


    - Perhaps you want to establish a free email address that has never had any contact
    whatsoever your real IP address. Services like Yahoo Mail, Gmail, and Hotmail
    repeatedly send emails looking for keywords or files to flag. Shutting down your
    email is one thing. Having your IP address along with the email forwarded to government
    entities for prosecution is quite another. Anonymity prevents this from happening.


    # Remailers


    As a crude example, let''s say you own a reporting agency that is active in most
    of the less-than-savory newsgroups, and you use your email from your office quite
    regularly. Then you see a rape victim who needs your assistance. You might not
    want to divulge your email address to everyone. Using a remailer will ensure that
    any identifying information of you will be erased from the headers of any messages
    you upload to newsgroups. Your message will be forwarded to the recipient without
    any risks of public disclosure.


    # Traceable vs. Untraceable Remailers


    **Traceable:** there are some types of remailers that keep active lists of send/pseudonyms
    whereby receivers can reply to mail by fictitious names. When the remailer gets
    a message, it consults a list and forwards mail to the sender. Thus, there is
    an element of privacy to this method of communication; however as was proved in
    previous years by the penet.fi (Finland) incident, this does not provide anonymity.
    Any hacker, government agency, judge, or the police like gain access to said list
    and discover who the sender is. In the case of penet.fi, Scientology launched
    a lawsuit of copyright infringement against them, in which a lower court demanded
    they turn over the identity of their users.


    **Untraceable:** If no list is maintained of the pseudonyms of users, then security
    is increased exponentially...provided you are willing to give up two communications
    with your party. Needless to say, this has some drawbacks, and is in some ways
    inferior to using Tor and/or PGP to communicate. In addition, there is always
    the possibility of hacker attacks whereby entry is gained upon the server, anonymity
    is compromised. Traffic-sniffers along with a host of other tools can also be
    used as a method of attack, as they compare and contrast the traffic emanating
    from the server. Such attacks are very difficult to coordinate, but are somewhat
    analogous to attacks within Tor and also Freet, whereby a sufficiently high number
    of hostile nodes are controlled within the network, probability of stripping away
    layers of anonymity becomes more likely. In other words, if Law Enforcement for
    instance, controls all Tor relays, they control of most nodes in Freet. Though
    they are admittedly vastly different technologies, they share one common goal:
    hiding the true IP address of senders and recipients.


    Mixmaster techniques however attempt to thwart such subversive attempts by sending
    messages through several servers across the globe, in various countries of legality
    and law enforcement jurisdictions. It becomes exponentially difficult for hackers
    and/or government entities to bunny hop from server-to-server across the globe
    in order to track down where the original sender resided. Thus, it goes well above
    and beyond the phrase “don’t put all your eggs in one basket” and is more akin
    to “many eggs, many baskets”. Such is the skeletal framework of the onion-routing
    network Tor.


    You may download Mixmaster at: http://sourceforge.net/projects/mixmaster/files/


    # Things That Break Anonymity on Usenet


    1.) Giving out your real email address, even one from one of the “free” services
    such as Yahoo, Hotmail and the like, not only can, but *will* open you up to armies
    of spambots, guaranteed. You would be surprised at how many new to Usenet under
    the impression that these free email services are somehow foolproof to the legions
    of bots that trawl Usenet. A better alternative: a fictional name and temporary
    *Usenet-Only* if you have a website, your host probably offers you the ability
    to create throwback accounts. Or, go with Anonymous Nyms at https://www.nyms.net
    for twenty bucks per year. SharpMail, Mailinator and Hushail are also excellent
    options, however if you want anonymity as well as privacy, remember to sign up
    on The network, not the open web. Also remember not to use credit cards or paypal,
    as it leaves a money trail. Better to use Bitcoins or a money order with no link
    to you.


    2.) Dropping Personal Info. This is a big one, and one that is seen quite frequently
    on various groups where flame wars erupt over issues like political campaigns,
    privacy and even one mp3 groups (i.e. alt.binaries.sounds.mp3.electronic). Political
    affiliations/liaisons, favorite restaurants, bars, musical groups and the like
    can lead to some stalker building a profile on you, hopping on Facebook, Twitter
    or LinkedIn and keying in all the personal data you have given over the past six
    months. Remember that whatever is typed in *any* newsgroup will be there for years
    and years. Type in “labor” as “colour” or “color” as “colour”, and it is not difficult
    to discern your country of origin.


    3.) Leaving messages with your headers clearly visible to the reading public.
    By using various search tools, they can see every message you posted to Usenet,
    even if you used different nyms. This of course doesn’t occur if you use a service
    that strips away this information.


    4.) Signing up for a Usenet or VPN service using credit cards Realize that when
    you use your credit card to purchase anything like a vpn (virtual private network)
    or Usenet account, you are in fact leaving a money trail to your identity. If
    you are only after a small measure of privacy, such as wanting a Usenet account
