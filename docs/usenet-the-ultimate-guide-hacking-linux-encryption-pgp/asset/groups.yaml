    # Chapter 5: Which VPN companies respect anonymity?


    If you are a bit squamish about accessing Usenet via your local ISP, you can always
    add an extra layer of privacy by subscribing to a vpn (virtual private network)
    service close to you. There are a plethora of good vpn providers that route your
    internet connection and provide ssl (secure socket layer) encryption that your
    ip cannot see what you do online. Most all of them use similar technology to achieve
    this, and have comparable speeds. A vpn service is much, much faster than using
    an onion-routing network like Tor, but not all of them will tolerate p2p usage.
    However, they will *tolerate* a Usenet account.


    Unlike Tor, the vpn provider, which usually charges somewhere in the range of
    ten dollars per month for unlimited service (over and above what you pay your
    Usenet provider), will be able to see everything that you do through their connection,
    unless you route that connection through the Tor network. They are more tolerable
    than Usenet than Pe2P systems, as is less likely to incur a swarm of copyright
    lawyers sending them angry cease-and-desist letters. Bottom line: some vpns will
    log your IP, and some won''t. If they know your real name and address, you can
    be sure that law enforcement will (and any other type of law agency) with a subpoena.**
    It''s a hit and miss game, and one which seems entirely dependent on whether the
    provider keeps online logs of the traffic that goes through their portal. One
    popular vpn provider, BlackVPN, said this in their FAQ:


    > Although we do not monitor the traffic, incoming or outgoing connections of
    our users we may assign users to a unique IP address and log which user was assigned
    which IP address at a given time. If we receive a copyright violation notice from
    the appropriate copyright holder then we will forward the violation to the offending
    user and may terminate their account. We therefore'
- md: '

    ask our users not to distribute or transmit material which violates the copyright
    laws in either your country or the country in which our Service is hosted.


    The above defeats the entire purpose of anonymity on the internet. A novice who
    didn''t know the difference between privacy and anonymity might conclude from
    their website that they offered complete anonymity similar to Tor offers, but
    that is clearly not the case at all. One has to be attentive to the fine details
    of the advertising on sites as to see if any logs are kept, and in many cases
    they will not reveal such unless you explicitly email them and ask. Interestingly,
    in 2011 the website TorrentFreak initiated a closer examination of all of the
    vpn provider''s response to the question “Under what jurisdictions does your company
    operate and under what exact circumstances will you share the information you
    hold with a 3rd party?”


    Some of the answers were expectantly evasive, and others were quite illuminating.
    One provider, CryptCloud, said


    “We don''t log anything on the customer usage so there are no dots to connect
    period, we completely separate the payment information. Realistically, unless
    you operate out of one of the ‘Axis of Evil Countries’ Law Enforcement will find
    a way to put the screws to you. I have read the nonsense that being in Europe
    will protect you from US Law Enforcement, worked well for HMA didn’t it? Furthermore
    I am pretty sure the Swiss Banking veil was penetrated and historically that is
    more defend-able than individual privacy. The way to solve this is just not to
    log, period.”


    Two points to make.

    One, the HMA (Hide My Ass vpn) incident he refers to involved a member of the
