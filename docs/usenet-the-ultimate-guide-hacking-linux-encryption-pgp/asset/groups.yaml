    例如，2000 年来自 BestBuy 的 1.5 GB 硬盘花费超过 200 美元。现在，同样的金额你可以买到一个 3TB 的硬盘。Usenet 服务器场也是如此。随着时间推移，更多客户注册高级
    Usenet 账户，Usenet 公司的运营成本降低了。这就是为什么你可以以每月不到十美元的价格拥有无限流量账户。那么，为什么传统的种子分享（torrent）更流行呢？


    原因是，免费下载种子比使用信用卡并设置 Usenet 账户要容易得多。荒谬，不是吗？在种子网站上查看评论也比过滤掉 Usenet 新闻组（如 alt.binaries.boneless）中的垃圾邮件要容易。某些界面，如
    Newshenting 的浏览器会过滤掉大部分垃圾邮件和加密文件，使其更易用。


    对于大多数 BitTorrent 用户来说，已知的事实是唱片和电影行业会对种子数数百万的版权作品发动律师军队。这使得在诉讼中，“你没有下载”这一说法非常有说服力。这在
    Usenet 上并不如此，因为即使在大撒网的情况下也无法看到谁下载了哪个文件。因此，如果你住在像美国这样诉讼频繁的社会，学会利用 Usenet 在这方面的优势对你有利。

