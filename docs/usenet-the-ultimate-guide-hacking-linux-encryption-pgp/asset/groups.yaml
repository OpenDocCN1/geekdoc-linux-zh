    # Chapter 6: The Cloud is the Enemy of Usenet and Anonymity


    It goes without saying that men are voracious collectors of many things obtained
    online: mp3 collections, digital wallpaper, pdf files and the like. The term “cloud”
    has been given flighty and unwieldy definitions from one blogger to the next,
    as if the “cloud” is actually some impenetrable fortress in the digital sky where
    no mouth or thief can break in and corrupt steal. However secure you feel that
    your files are “in the cloud”, it is perhaps worth remembering that whoever the
    “cloud”, owns your stuff. Thus, the cloud is nothing more than a server farm with
    hundreds of other people’s hard drives & servers, all digitally categorizing...
    your stuff. No longer are your things flying under the banner of privacy in your
    own, but rather you are subject to whatever litigious lawyer’s terms and conditions
    contract he has drummed up for the cloud provider. Be wary of a future promised
    where your data is at the whims of some away server operator who gets to dictate
    which of your purchased music, movies and games gets “streamed” to your pc.


    The Windows 8 operating system has a feature called “SmartScreen” that is used
    for checking the validity and safety of files before they are executed. This type
    of feature was first implemented in Internet Explorer and Windows Live Messenger
    to thwart malicious sites from being able to exploit people’s browsers. Thus,
    verification and authentication were at the forefront of the feature, as it sought
    to prevent spam, malware and adware from infecting people’s computers. A good
    thing? Not for the majority of users, who found it rather annoying. It was a one-step-forward,
    two-steps-backward approach that actually hindered the internet experience for
    millions of users of Internet Explorer as they attempted to go to links that were
    not dangerous in the least. Enter Windows 8, in which the SmartScreen feature
    tries to verify whether applications are “safe” to download or run on the operating
    system. It checks a dynamic, ever-changing laundry list of exploitable URLs that
    Microsoft has identified harmful for end-users on pc systems. An additional problem
    with this is that it is cumbersome to turn off, and once done, results in consistent
    nagging from the operating system to re-enable it. Where it will be three to five
    years down the road? Will you have to have every app or file on your pc “authorized”
    by Microsoft’s servers before you can execute them? What about cloud content and
    streaming legally purchased items to your own pc?


    For the uninitiated, Microsoft likes to assign “download reputation” points to
    digitally signed websites as well as programs. The problem with this is the same
    problem that manifests itself in anti-virus programs, namely that a lot of false-positives
    get thrown in the user’s face, leading to frustration and annoyance. At times,
    downloads will get frozen in Internet Explorer 9 as the downloaded files get scanned.
    There is no option in Internet Explorer 9 to switch off and let users decide which
    security setting to implement. Rare files constantly get flagged as being somehow
    malicious for the pc. There is a further element of privacy for the SmartScreen
    feature. It collects data on every program you install on your operating system,
    and checks to see if a valid certificate exists on Microsoft’s “cloud” (i.e. their
    server) that verifies its “safety” for your operating system. It checks the hash
    of the program installer itself, and compares it to a list at Microsoft. Think
    about how many programs you have installed on your pc that are related to privacy:
    PGP, Truecrypt, BitLocker, the installer your vpn provider emailed or perhaps
    encrypted keyfiles to your hard drive. It would be a gold mine of epic proportions
    for any hacker to get at such


    Enter Usenet. As of 2012, it is relatively easy to hop on Usenet without having
    through hoops to do so. When you download data from Usenet, it is typically decoded
    by your newsreader or NZB application and then saved to your hard drive. If you
    have an antivirus installed, it will most likely have some element of checking
    each executable or installer that is downloaded to your pc, either by Usenet or
    some other variant of internet app. With the rush to maximize the use of cloud
    computing, however, the responsibility of initializing these types of security
    settings is slowly being taken away from the end-user. What does this mean for
    Usenet? One of two things could happen.


    - 1.) Eventually, users stream data off of usenet, which is then checked and “verified”
    through an intermediary cloud server, before being delivered to your hard drive
    (assuming you have one).

    - 2.) Usenet SSL will be prohibitively expensive and/or reserved only for certain
    groups in society (think Government, Intelligence, etc.). Secure, anonymous programs
    like PGP, Freeten, Truecrypt and the like will be stigmatized and shunned by cloud
    servers for their inability to unmask and decrypt their true contents.


    In 2010, an article titled “The Death of the Hard Drive” explored Google’s persistent
    momentum towards a hard-driveless selection of flagship products, all citing the
    benefits of “cloud storage”. In 2012, Microsoft is gearing Windows 8 towards a
    platter-less scenario.


    “Stop worrying about the hard drive in your computer will die. Google wants to
    kill it permanently.


    The new Google Chrome operating system, which was unveiled Tuesday, as well as
    hints and suggestions from Apple and Microsoft, offers us a preview of the future.
    And it will come without that familiar whirring disk that has been the data heart
    of the PC for the last 25 years. The Chrome OS will be first available on all-black
    laptops from Samsung and Acer. And because the new platforms store everything
    — files, applications, data bits and bytes, literally everything — online servers
    rather than on your home or office PC, those new PCs running won’t require gobs
    of storage. In fact, they won’t require any storage at all.”


    Further reasons why you should never rely on the Cloud for your personal data
    backups.


    - 1.) You are completely at the mercy of your ISP’s bandwidth cap. They stand
    to make a fortune as you stream your own personal mp3s, games, video (which competes
    with their own

