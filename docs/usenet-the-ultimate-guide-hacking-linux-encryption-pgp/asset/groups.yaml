    ## Chapter 3: Usenet Reviews - Wheat and the Chaff


    If you scout around the major search engines and use search terms like “usenet”
    “best usenet prices” and “usenet reviews”, you will literally come across hundreds
    of websites clamoring for your referral dollars as they tell you Usenet provider
    is best and which ones to avoid. The thing is, most of them offer the exact same
    services, and by large are just as competent as the next company. They offer similar
    services, ease of use, and like some Newshosting offer their own Usenet browser
    that will do all of the hard work for you. Almost all of them offer free SSL and
    unlimited packages as well. Usenet-Server and Astraweb seem to be the cheapest,
    though Astraweb has had its share of problems regarding incomplete uploads in
    the past.


    For the purposes of anonymity, going with a US based newsgroup provider probably
    isn''t conductive to good anonymity practice. While it certainly isn''t foolproof
    to have an account with a European provider if one is uploading copyrighted material
    to Usenet (or any other illegal activity), the laws in the US are more litigious
    and draconian than any other country on Earth that houses the server farms of
    Usenet companies.


    ## The Big Five


    - **Astraweb**: Often the cheapest priced out of Usenet providers with unlimited
    specials at $11, their past problems have been server downtime as well as incomplete
    files (as of 2012). Posted PAR files will certainly make up the difference...most
    of the time. However on a dual core fitted pc, quickpar can take more than an
    hour if a sufficiently large amount of rares are broken. In addition, their customer
    service is not as refined as say, Easagews or Newshosting, but they cannot beat
    the price they offer. If you don''t mind a few broken files and using Quickpar
    on a semi-weekly basis, and price is a concern, Astraweb is the prime choice.


    - **Usenet Server**: Similar to Astraweb but more stable infrastructure. They
    are also a few dollars more in price however their unlimited plan. Incompletes
    were not seen in over two years of using them. Thus, you really see where this
    extra dollars per month went: system retention and reliability.


    - **Newshowing**: Similar to Usenet-Server, however they provide a free newsreader
    that makes it ridiculously easy to see which files are authentic and which are
    viruses/spam (hint: look at the file size...if it is a heinously small size, it
    is probably spam or malware). The thumbnail view is similar to what you would
    see with Easagews'' web interface that scans the thumbs of all the newsgroups
    you need to view.


    - **Easnews**: One of the first companies out of the gate, and one still does
    not have the unlimited offerings of the above Usenet providers. However, they
    are dirt cheap, have a reliable backbone of server farms since they have been
    in business for years, and one of the top forums for troubleshooting and tech
    issues in the industry. Their customer service is unrivaled as well. The caveat
    is that if you are a power user who wants to download over a hundred gigabytes
    of data per month, they probably should not be your first choice. They are, like
    Giganews, extremely strict with takedown notices from lawyers. If HBO specials
    and documentaries are your cup of tea, be aware that they have the ability to
    “nuke” uploads should they deem it too “hot” to reside on their servers (i.e.
    Game of Thrones, The Sopranos, etc)


    - **Giganews**: Undoubtedly the most expensive of all the Usenet premium providers.
    They provide and similar services as the above mentioned providers. They are considered
    the “Harvard” of Usenet companies, however it seems rather needless to pay for
    the name since you get most of the benefits from the other four Usenet companies.
    Giganews is also known for giving in to “take down” requests for uploaders of
    copyrighted content, such as HBO series like Game of Thrones, in which files were
    purged from the servers in such a large quantity as to make pars useless to recover
    them. The problem therein, is that many smaller Usenet companies use Giganews
    backend servers for access to Usenet. Thus, when they comply with a take down
    order or request from some Hollywood law firm, other Usenet providers are affected.
    If money is not an issue, Giganews is a great choice for their consistently good
    customer service.


    ## Others: Thundernews, Newsden, Ngroups, etc.


    You''re taking a spin on the roulette wheel with anyone not in the top five. That
    is not to say they all provide bad service, but it is important to note that a
    rock-solid business like those in the top five takes years and years of painstaking
    work and perseverance. The lesser known Usenet providers usually are lacking one
    of three key areas: customer service (usually emails from tech support), reliability/completion
    of files, or retention (age of files). Some of them are newly minted that they
    have no choice but to rent part of their infrastructure from the likes of Giganews
    or Highwinds, which have many, many server farms.


    In the end you might ask, what is the number one thing customers want from a Usenet
    provider? Is it not retention. Most Usenet companies have similar retention rates
    that span many years. It is not even completion of files. Most large uploads from
    users around the world upload a sufficient number of pars to repair any large
    group of posted files Blu-Ray movies or the like. No, what Usenet customers most
    want is GOOD CUSTOMER SERVICE. Customers don''t want to sit waiting on the phone
    up for an hour for tech support to answer. To wit, they want someone who speaks
    the same language and in the same dialect. They also don''t want to be spammed
    with upselling offers by the Usenet company in question (web hosting companies
    like Godaddy are notorious for this), nor do they like to be called on the phone
    with such offers.


    ## The First Rule of Usenet (don''t talk about Usenet!)


    On many social media sites and forums like Facebook, Twitter and Reddit, some
    users will post advertisements from the late nineties from such big stores as
    BestBuy, Wal-Mart, Sears and the like that show a dramatic difference in regards
    to hardware costs.


    For example, a 1.5 gigabyte hard drive from BestBuy in 2000 cost over 200 dollars.
    Now however, for the same amount of dollars you can buy a 3 terabyte drive. It
    is not different for Usenet server farms. Time goes by and more customers sign
    on for premium Usenet accounts, the business costs incurred for Usenet companies
    goes down. That is why you can have an unlimited data account for less than ten
    dollars a month. So then, why is traditional file-sharing as torrenting more popular?


    The reason is because it is eminently easier to download a torrent for free than
    to use your credit card and set up a Usenet account. Ridiculous, is it not? It
    is also easier to see comments on a torrent site and filter through all the spam
    in a Usenet newsgroup such as alt.binaries.boneless. Some interfaces, such as
    Newshenting''s browser will filter out most of the spam and passworded files and
    make it easier to use.


    It is a well-known fact by most BitTorrent users that the Record and Movie industries
    to unleash their armies of lawyers upon copyright works that have seeds numbered
    in the millions. This makes it very convincing in lawsuit that you didn''t. This
    is less the case with Usenet, where it is not possible to see who downloaded which
    file, even in casting a wide net. Thus, if you live in a litigious society like
    that in the United States, it is to your benefit to learn to utilize Usenet''s
    strengths in this regard.

