- img_proc: true
  md: 'To Summarize:


    +   Pros to Usenet: Not dependent on seeders like torrents

    Uses full bandwidth available on your internet connection

    MMPAA (Movie Industry), RIAA (Recording Industry) cannot see your downloads as
    they they can with torrents

    - Can utilize SSL to encrypt data on route to your pc (unlike torrents)

    - In its 30 year history, no one has ever been sued for downloading anything off
    Usenet (again, unlike torrents)


    Cons to Usenet: requires a paid subscription to access older posts posting/reading
    comments require a newsreader/not as easily accessible as torrent sites


    # Signing up for Usenet


    For those who are simply not concerned about privacy, you may consistently resist
    the upselling offers of your Usenet provider’s advertisements regarding SSL. At
    signup for some of the lesser known Usenet providers, the advertising might incline
    you to believe you absolutely have to have SSL as an option, otherwise your PC
    will certainly be hacked by all manner of gremlins, evil gnomes and other boogeymen.
    Do not believe it. SSL often comes free with a subscription to the major providers,
    however some will still charge extra for it.


    For users who value anonymity


    Some Usenet providers accept bitcoins as a method of payment. If you are going
    to uploading a large amount of legally questionable files and are based in the
    US, it might be prudent to sign up anonymously for a Usenet account. Do not use
    any kind of payment that carries personal information about you, such as your
    name, bank and the like.


    # Isn’t Uploading to Usenet Anonymous with SSL Enabled?'
