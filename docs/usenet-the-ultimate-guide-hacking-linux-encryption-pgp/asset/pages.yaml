  md: '# # Chapter 1: What is Usenet?


    You''ve probably heard the term “Usenet” floating around various tech forums of
    one flavor or another. Some like the technology as being similar to P2P, while
    others state that it is nothing like P2P. In truth, it has a little bit of both
    systems in that


    +   1.) you can find almost any kind of file therein, as mp3s, games, movies and
    the like and

    2.) you have the ability to upload and download anything you like


    Since its inception in 1979 by two Duke graduate students, Usenet has leapt beyond
    all expectations in regards to not only data retention, but enhancing freedom
    of speech. Whereas users were once inundated with extra charges per month for
    downloading a handful of data, they now have the ability to download terabytes
    per month, and pay ridiculously small sums to do so. This has all been done with
    the help of not thousands of server farms around the world, but also by legions
    of longtime Usenet users who upload (and leech) every kind of file in existence.
    Thus, the true ingredients for the worldwide success of Usenet hasn''t been so
    much because of Usenet providers themselves, but by end-user subscribers who faithfully
    upload the latest movie, game and music releases every month to the over 100,000
    available newsgroups on Usenet.


    What typically happens when the average Joe off the street wants to subscribe
    to Usenet? He usually ends up testing a free trial by one of the dozens of Usenet
    providers for a period of two weeks, and then like any P2P user, they are hooked
    for life. Or at least, the life of the subscription....and that subscription will
    likely last a long time. Why? answer lies in the perceived value of the goods
    he acquires through said Usenet subscription. As mentioned, the worth of the goods
    acquired far outweighs the monthly fee of the Usenet provider. There are over
    100,000 newsgroups, with the large majority of them being TEXT groups rather than
    BINARY groups (i.e. where the real meat of Usenet is stored). The dirty little
    secret among long-time Usenet users is this: Usenet would not be one-tenth as
    popular as it'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'is if it weren''t for the bulk of groups like alt.binaries.boneless, alt.binaries.hdtv
    and alt.binaries.complete_cd. One could make the argument that text discussions
    certainly have their place that benefits society in some manner, however the bottom
    line is that file sharing (again, mp3s, movies and games) make up the bulk of
    not only Usenet, but is the reason Usenet companies have been able to grow their
    businesses at exponential rates.


    # Risk vs. Reward? Usenet vs. P2P


    If you''ve paid attention to the news media outlets over the past ten years, you''re
    probably aware of the inherent risks associated with using P2P systems like Emule,
    Limewire and the like in acquiring copyrighted material. When you fire up a P2P
    program like Emule, you participate in downloading with your IP address out the
    open, from which peers run by law enforcement (i.e. NordicMule) or the Recording
    Industry can monitor the source and destination with every file you transmit through
    the network. P2P in effect requires its participants to upload as well as download.
    It is not so different than downloading torrents in this regard. Usenet on the
    other hand, encourages leeching without uploading. While you certainly have the
    freedom to upload, your downloads are not crippled if you decide only to lurk
    and leech from the uploads of others. What is more, you do so at your full internet
    speed, unlike peer-to-peer systems, where you are at the mercy of others in the
    swarm.


    When someone uploads a copyrighted film (Avengers, for instance) on a p2p or torrent
    system, it is far easier to track said uploader to an ip address which leads straight
    to their front door. If however the uploader used a premium Usenet provider to
    upload the film, the movie lawyer must get his subscriber information from the
    Usenet company before any action is taken. If he accessed his Usenet account through
    a vpn provider, and used anonymous means to pay for his Usenet account, then that
    adds a further layer of privacy that the entertainment industry lawyers will have
    to peel back in order to reveal his identity. We''ll discuss later on the fruitfulness
    of signing up anonymously with Usenet and Vpn providers.'
  merge: -1
