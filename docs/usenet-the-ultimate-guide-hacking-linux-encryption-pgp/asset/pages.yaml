  md: '# Chapter 3: Usenet Reviews - Wheat and the Chaff


    If you scout around the major search engines and use search terms like “usenet”
    “best usenet prices” and “usenet reviews”, you will literally come across hundreds
    of websites clamoring for your referral dollars as they tell you Usenet provider
    is best and which ones to avoid. The thing is, most of them offer the exact same
    services, and by large are just as competent as the next company. They offer similar
    services, ease of use, and like some Newshosting offer their own Usenet browser
    that will do all of the hard work for you. Almost all of them offer free SSL and
    unlimited packages as well. Usenet-Server and Astraweb seem to be the cheapest,
    though Astraweb has had its share of problems regarding incomplete uploads in
    the past.


    For the purposes of anonymity, going with a US based newsgroup provider probably
    isn''t conductive to good anonymity practice. While it certainly isn''t foolproof
    to have an account with a European provider if one is uploading copyrighted material
    to Usenet (or any other illegal activity), the laws in the US are more litigious
    and draconian than any other country on Earth that houses the server farms of
    Usenet companies.


    # The Big Five


    Astraweb: Often the cheapest priced out of Usenet providers with unlimited specials
    at $11, their past problems have been server downtime as well as incomplete files
    (as of 2012). Posted PAR files will certainly make up the difference...most of
    the time. However on a dual core fitted pc, quickpar can take more than an hour
    if a sufficiently large amount of rares are broken. In addition, their customer
    service is not as refined as say, Easeways or Newshosting, but they cannot beat
    the price they offer. If you don''t mind a few broken files and using Quickpar
    on a semi-weekly basis, and price is a concern, Astraweb is the prime choice.'
