  md: '# Chapter 2: How to use Usenet


    Over the past ten years, Usenet companies have made significant progress in simplifying
    what was originally a very cumbersome process for Usenet customers. After subscribing
    to a Usenet provider, it is now ridiculously simple to access the treasures that
    Usenet holds.


    # Basics of Using Newsgroups


    **Downloading:** When you sign up for a ten dollar/month plan, your NSP (Newgroup
    Service Provider) will email you three things: your username, password, and news
    address for the server (i.e. news.astraweb.com as an example). There are many
    different Usenet tools available that are similar in function to how a browser
    works. You can opt for the simpler method, which requires downloading an .nzb
    file from sites like Binsearch, NZIndex, or Newzbin (paid) and then importing
    to a newsreader or downloader of your choice. One of the simplest is an app called
    Nzb-o-Matic Plus. In the options screen of the application, just insert your user/pass
    combo and the server address with port 119, then set a destination where your
    downloads reside. You can even choose the desktop. It’s simple. There are other
    newsgroup tools available as well.


    **Newhosting Client** (requires signup) Free

    The Newhosting client self-repairs files for you if you have a subscription to
    them. However this is a bit redundant since Quickpar and Winrar are free.


    **Easynews Web Interface** (requires signup) Free

    The Easynews Interface is similar to the Newhosting client in that you can see
    thumbnails of the files posted, if they are passworded, and will check for errors
    automatically.


    **NewsBin Pro** $20


    **SABnzbd** Free


    **NewsLeecher** $20'
