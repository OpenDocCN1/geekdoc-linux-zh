  md: '# Chapter 4: Usenet Anonymity


    In this chapter, we''ll discuss ways you can add anonymity to your Usenet connection,
    so that you can participate in discussion groups without fear of persecution.
    These methods often are most useful in situations where you may lose your Usenet
    account if you say the wrong things to the wrong people. Usenet companies are
