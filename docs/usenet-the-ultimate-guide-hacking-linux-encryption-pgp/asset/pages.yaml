  md: 'The answer to this question is: sort of. Yes, you can download with impunity.
    Yes, it encrypted the data in route to your pc, from which point it is decrypted
    with the decryption key. Most Usenet providers do not keep download logs of what
    you siphon from the binary Usenet newsgroups. However, the catch is that if you
    upload, certain information is left as breadcrumbs to your Usenet account. messages,
    in addition to your uploads (all of them) contain unique header identification
    breadcrumbs, so to speak. If you were part of some conspiracy group of assassins
    and shouted in some obscure newsgroup that you were going to assassinate the president
    of the United States, then the Secret Service could look at your headers and find
    out from the Usenet provider where you lived if you did not sign up anonymously.
    The nntp posting host & X-Trace lines in turn leads to the identity of the Usenet
    server, which in your specific account. The Secret Service would have no idea
    that YOU posted it, but they would know you used Astrawb or Easnews to post it.
    They in all probability would not even need a subpoena for subscriber information,
    as most of the big Usenet providers would gladly provide subscriber information
    that involved terrorist threats, illegal porn or identity fraud (spam is a bit
    more involved, but then again, the Secret Service doesn’t investigate Usenet spam.


    There also exists the possibility that the header could be encrypted by the Usenet
    server themselves, in which case it can only be decrypted by them. The header
    might have some lightly mosaic of jumbled letters mixed in with numbers. It might
    say "sdauhjk7lt324=assdad", of which course would be unreadable to anyone except
    the Usenet provider, as they hold the decryption key and no other Usenet provider
    does. It is somewhat similar in concept to the headers from a free email service
    such as Yahoo or Hotmail. This is how the hacker who pried vice-presidential candidate
    Sarah Palin''s email was arrested: by revealing the headers in the address bar.
    The FBI took this information from a screenshot the hacker had posted and traced
    it back to the source. A vpn server would not have helped in such a scenario,
    since they themselves are bound by the law, and most of them reside in the US
    away. The only way we'
