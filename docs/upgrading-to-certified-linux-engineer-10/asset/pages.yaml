- pgno: 155
  md: '# Objective 5 Manage Xen Domains at the Command Line


    In the following you learn how to manage Xen domains at the command line. This
    includes:


    +   - Understand a Domain Configuration File

    +   - Use the xm Tool

    +   - Automate Domain Startup and Shutdown


    # Understand a Domain Configuration File


    Every Xen domain needs a configuration file. For domains which have been created
    with YaST, the configuration file is usually located in `/etc/xen/vm/`.


    Under `/etc/xen/examples`, you find two example files, which can be used if you
    would like to create a configuration from scratch.


    +   - **xmexample1**. This is a template configuration file for a single domain.

    +   - **xmexample2**. This is an example for multiple domain configurations in
    one file.


    For the beginning, xmexample1 is a better choice.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'A configuration file contains several keywords which configure different aspects
    of a Xen domain. The following is an example configuration file using the most
    common options. The # character is used for comments. Please read the comments
    in the example for details about the configuration options.


    ```

    # Unique name of the domain

    name = "SLES10-WebServer"


    # The following lines point to the kernel and initrd file

    # on the filesystem of the domain. The filesystem itself is

    # defined later.

    kernel = "/boot/vmlinuz-Xen"

    ramdisk = "/boot/initrd-Xen"


    # The amount of memory that is initially assigned to the

    # domain. This can be changed at runtime.

    memory = 256


    # The next line defines a some details about the network

    # configuration. When left blank, defaults are used,

    # which work fine in most cases.

    vif = [ '''' ]


    # This defines the disc of the domain. "phy" means that the

    # physical device /dev/hdal is mapped to the virtual device

    # /dev/hdal in the domain. "w" indicates, that the disc is

    # writable.

    disk = [ ''phy:hda1,hda1,w'' ]


    # The following is an example for a file based filesystem

    # image. In this case the "file:" keyword is used.

    # disk = [ ''file:/data/vm/SLES10-disc.img,hda1,w'' ]


    # Sets the device for the Linux Kernel

    root = "/dev/hdal ro"

    ```


    ![](img/8279afe915b153902294b0e58311b75a_156_0.png)


    A good source for detailed documentation and howtos about Xen and the domain configuration
    files is the Xen wiki at:

    http://wiki.xensource.com/xenwiki/'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Use the xm Tool


    xm is the administration tool for Xen domains. xm communicates with the xend management
    process running on the domain0 Linux installation.


    The following is the general format of a xm command line:


    ```

    xm command [options] [arguments] [variables]

    ```


    You can get a complete list of the most common xm commands by entering xm help.
    A complete list can be viewed with xm help --long. It is also possible to display
    specific information about a certain command with xm help [command_name].


    To start a virtual machine, the create command is used:


    ```

    xm create -c -f /data/xen/SLES10-WebServer.conf

    ```


    The -c option lets xm connect to the terminal of the started domain, so that you
    can interact with the system. To disconnect from the terminal and return to the
    original command line, enter the key combination Ctrl-] .


    The -f option specifies the configuration file of the domain that should be started.


    The command list displays information about the currently running Xen domains:


    ```

    xm list

    ```


    The output of the list command contains the following fields:


    +   - name. The name of the domain as specified in the configuration file.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - domid. A numeric, consecutive domain ID, which is automatically assigned
    when the domain starts.

    +   - memory. The amount of memory assigned to the domain.

    +   - vcpus. The number of virtual CPUs utilized by this domain.

    +   - state. The current state of the domain. This could be:

    +     - r. The domain is running.

    +     - b. The domain has been created, but is currently blocked. This can happen,
    when a domain is waiting for I/O or when there is nothing to do for domain.

    +     - p. The domain is paused. The state of the domain is saved and can be restored.

    +     - s. The domain is in the process of being shutdown.

    +     - c. The domain is crashed, due to an error or misconfiguration.


    An alternative to list the command top, which displays domain information updated
    in realtime.


    The console command connects you with the terminal of a running domain:


    ```

    xm console <domain_id>

    ```


    The command takes the domain id as a parameter, which can be determined with the
    list command (field domid). As mentioned before, use the key combination Ctrl+]
    to disconnect from a terminal.


    With the pause command you can interrupt the execution of a domain temporarily:


    ```

    xm pause <domain_id>

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'A paused domain is not completely shut down. The current state is saved and
    the execution of the domain can be continued with the **unpause** command:


    ```

    xm unpause <domain_id>

    ```


    To shutdown a domain, use the **shutdown** command:


    ```

    xm shutdown <domain_id>

    ```


    In case the domain is not responding anymore, you can force the shutdown of the
    domain with the **destroy** command:


    ```

    xm destroy <domain_id>

    ```


    To save the state of a domain for a longer time (eg. over a reboot of domain0)
    you can use the **save** command:


    ```

    xm save <domain_id> <filename>

    ```


    The domain can be restored from the resulting file with the **restore** command:


    ```

    xm restore <filename>

    ```


    Another commonly used command is **mem-set**, which allows you to change the memory
    allocation of a domain:


    ```

    xm mem_set <domain_id> <amount_of_memory>

    ```


    The amount of memory is specified in megabytes.'
  merge: -1
  img_proc: true
- pgno: 160
  md: Instead of the domain ID <domain_id>, you can also use the domain name in all
    xm commands.
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Exercise 8-3 Change Memory Allocation of a Guest Domain


    In this exercise, you learn how to change the memory allocation of a guest domain
    by changing the domain configuration file.


    The following assumes, that you still have an open terminal window of the guest
    domain, that you have configured in the previous exercises.


    Do the following:


    +   1. Open a terminal window and su - to the root user.

    +   2. Enter the command xm list.

    +   3. Note the memory allocation of the domain vm1.

    +   4. Switch to the terminal of the Xen domain and halt the system by typing
    halt. Wait till the system has been halted.

    +   5. Return to the root terminal and use the command xm list to verify that
    the domain vm1 is not running anymore.

    +   6. Open the file /etc/xen/vm/vm1 with a text editor.

    +   7. Look for the memory parameter and change the value to 172.

    +   8. Save and close the file.

    +   9. Enter the following command to start the domain:

    +   xm create -c -f /etc/xen/vm/vm1

    +   10. Wait till the system has been booted and you see the login prompt.

    +   11. Press the key combination Ctrl-] to detach from the domain terminal and
    return to the root terminal.

    +   12. Use the command xm list to determine the memory allocation of domain vm1.
    It should be 172MB.

    +   13. Also note the ID of domain vm1.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '14. Attach to the terminal of vm1 with the command


    ```xm console <noted_id>```


    (End of Exercise)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Automate Domain Startup and Shutdown


    When you start, shutdown or reboot domain0 of a Xen system, this also affects
    the other running Xen domains. Without a running domain0, the other Xen domains
    cannot operate.


    SUSE Linux Enterprise Server 10 comes with a start script called xendomains which
    is included in the package xen-tools.


    The script should be installed on domain0 and does the following:


    +   - When domain0 is booted, all domains and configuration files located under
    /etc/xen/auto/ are started.

    +   - When domain0 is shutdown or rebooted, running Xen domains are shutdown automatically.


    The script has some configuration options, which can be adjusted in the file /etc/sysconfig/xendomains.
    The configuration variables in this file are well documented.


    One interesting option is to migrate domains automatically to a different host
    when a domain0 is shutdown. This can be configured in the variable XENDOMAINS_MIGRATE.
    The variable has to be set to the IP address of the target machine. When the variable
    is empty, no migration is performed.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Exercise 8-4    Automate Domain Startup


    In this exercise, you learn how to startup domains automatically when the system
    is booted.


    Do the following:


    +   1. Open a terminal window and su - to the root user.

    +   2. Move the vm1 configuration file into the auto directory: mv /etc/xen/vm/vm1
    /etc/xen/auto/

    +   3. Shutdown vm1 with the command xm shutdown vm1.

    +   4. Wait a moment and control with the command xm list if the domain has been
    shut down. Continue with next step when the domain vm1 is not listed anymore.

    +   5. Reboot you system by entering reboot.

    +   6. At the boot prompt, select the Xen entry.

    +   7. When the system has been started up, log in to the graphical interface
    as user gecko with the password novell.

    +   8. Open a terminal window and su - to the root user.

    +   9. Enter the command xm list.

    +   10. The domain vm1 should have been automatically started and should be listed
    in the xm output.


    (End of Exercise)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Objective 6


    # Understand Xen Networking


    Usually the network connection of Xen domains works out of the box. However, in
    case you would like to change the configuration, networking with Xen can be a
    bit tricky. The following should give you an overview of how Xen domains are connected
    to the physical network.


    To better understand the concept of Xen networking, do the following:


    +   - Understand the Basic Networking Concept

    +   - Understand Bridging

    +   - Understand the Network Interfaces in domain0


    # Understand the Basic Networking Concept


    In a Xen setup, domain0 is controlling the physical network interfaces of a host
    system. Unprivileged domains are connected to domain0 through virtual ethernet
    adapters.


    One virtual adapter in an unprivileged domain is connected to one virtual adapter
    in domain0.


    In domain0, standard Linux networking mechanisms like bridging or routing are
    used to connect the virtual adapters through the physical adapter to the network.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The following is an illustration of this basic concept:


    # Figure 8-10


    ![](img/8279afe915b153902294b0e58311b75a_166_0.png)


    # Understand Bridging


    On SUSE Linux Enterprise Server 10, the default mechanism to connect virtual and
    physical interfaces in domain0 is bridging. Other mechanisms like routing with
    or without Network Address Translation (NAT) are out of the scope of this course.


    Bridging basically means that multiple network interfaces are combined to one.
    Traditionally this technique is used to connect two physical network interfaces
    or network segments.


    In a Xen system, bridging is used to connect virtual and physical network adapters
    in domain0. In a Xen system, you can consider the bridge as a kind of virtual
    switch which all virtual and physical interfaces are connected to.


    The configuration of the bridge is done by the xend management process. When a
    new domain is created, the following changes to the network configuration are
    made (simplified):


    +   1. Xen provides a virtual interface to the new domain.

    +   2. xend creates a new virtual interface in domain0.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   3. Both virtual interfaces are connected through a virtual point to point
    connection.

    +   4. The virtual interface in domain0 is added to the bridge with the physical
    interface.


    These steps only affect the general network connectivity. The IP configuration
    in the Xen domains has to be done separately with DHCP or a static network configuration.


    xend is performing these network changes with the help of scripts, which are located
    at **/etc/xen/scripts/**. The following scripts are used for bridged networking:


    +   - **network-bridge.** This script is called initially when xend is started.
    It sets up the bridge **xenbr0** and moves the physical interfaces onto that bridge.

    +   - **vif-bridge.** This script is called for every domain that is started and
    adds the virtual interface to the bridge.


    In the file **/etc/xen/xend-config.sxp** you can configure which network scripts
    are used by xend.


    # Understand the Network Interfaces in domain0


    When you look at the network interfaces in domain0 with the command **ip a**,
    you can see that there are many more interfaces than in a regular Linux installation.'
  merge: -1
  img_proc: true
