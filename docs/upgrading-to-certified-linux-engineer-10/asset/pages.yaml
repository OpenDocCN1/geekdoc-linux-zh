- pgno: 356
  md: '# Summary


    | Objective | Summary |

    |---|---|

    | 1. Improve Application Security with AppArmor | AppArmor imposes limits on processes
    based on rules set in profiles.


    Even if compromised, programs are limited in what they are allowed to read, write,
    and execute. This even holds true for programs running with root permissions.
    |

    | 2. Create and Manage AppArmor Profiles | There are YaST modules as well as command
    line tools to create and manage AppArmor profiles.


    The main YaST modules are the Add Profile Wizard, and the Update Profile Wizard.


    The corresponding command line tools are autodep, genprof, and logprof.


    Profiles are text files located in /etc/apparmor.d/ and can be maintained with
    any text editor. |'
  merge: -1
  img_proc: true
- pgno: 357
  md: '| Objective | Summary |

    |---|---|

    | 3. Control AppArmor | AppArmor is started early during the boot process.


    `/etc/init.d/boot.apparmor` is the script used to control AppArmor.

    `/sbin/rcapparmor` is a link to it.


    The parameters `stop` and `kill` end the confinement of processes by AppArmor.
    `start` is used to activate confinement of processes—but only processes with profiles
    that are started after AppArmor has been activated are confined. `reload` or `restart`
    reload the profiles.


    `enforce` and `complain` toggle enforce and complain mode.


    `unconfined` lists processes with bound sockets that have no profile. |

    | 4. Monitor AppArmor | AppArmor can be configured via YaST to create reports
    on security events and to send email messages to inform on security events. |'
  merge: -1
  img_proc: true
