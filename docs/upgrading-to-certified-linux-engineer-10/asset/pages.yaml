- pgno: 79
  md: '# Objective 1 Finalize Partitioning


    The program fdisk is used for partitioning hard disks from the command line.


    ```

    dal0:~ # fdisk /dev/sda


    The number of cylinders for this disk is set to 1111.

    There is nothing wrong with that, but this is larger than 1024,

    and could in certain setups cause problems with:

    1) software that runs at boot time (e.g., old versions of LILO)

    2) booting and partitioning software from other OSs

    (e.g., DOS FDISK, OS/2 FDISK)


    Command (m for help):

    ```


    To actually write your changes to the partition table on the disk, enter w (write).


    ```

    Command (m for help): w

    The partition table has been altered!


    Calling ioctl() to re-read partition table.


    WARNING: Re-reading the partition table failed with error 16: Device or resource
    busy.

    The kernel still uses the old table.

    The new table will be used at the next reboot.

    Syncing disks.

    ```


    When the new table is written, you are not asked for confirmation if you really
    want to do this.


    As the output of fdisk says, you cannot directly use the new partition to create
    a file system on a new partition. You could now reboot as suggested, but you can
    also use the program partprobe to get the kernel to use the new partition table.'
  merge: -1
  img_proc: true
