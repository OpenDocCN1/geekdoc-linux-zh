- pgno: 340
  md: '# vim


    The profiles can be changed using any text editor.


    Compared to other editors, vim has the advantage that AppArmor includes a syntax
    highlighting description that enables vim to highlight syntax elements in profiles.


    When confining Apache2, you can create subprofiles (also called hats) that use
    a different security context, for instance for pages using mod_php5. To make use
    of such subprofiles, an application has to be made "hat-aware." For Apache2 this
    is achieved with module mod_change_hat that comes with AppArmor on SLES10. For
    details on hats, see main_change_hat and section 5 of the Administration Guide
    in /usr/share/doc/manual/apparmor-admin_en/apparmor-admin_en.pdf. Subprofiles
    are part of the profile for the application itself and are administered with the
    same tools (genprof, logprof).'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Exercise 14-1    AppArmor


    In this exercise, you create, test, and improve a profile for the Firefox browser.
    This exercise has four parts.


    In the first part create a profile for the Firefox browser. While using Firefox
    to generate log entries for the initial profile, just surf the web; do not access
    local files with Firefox.


    In the second part, use Firefox to access a local file, such as /usr/share/doc/packages/apparmor-docs/apparmor.7.html.
    AppArmor should prevent you from viewing the file. Change the profile to allow
    access. You could use YaST, genprof, or complain and logprof for this purpose.


    In the third part, install the Java browser plug-in package java-1_4_2-sun-plugin.
    Restart Firefox and use it to access a page containing a Java applet.


    http://java.sun.com/products/plugin/1.4/demos/plugin/applets.html links to various
    demos. Firefox will not be able to show these. Change the profile again to be
    able to run Java applets. Use another method to do so than the method used in
    part two above.


    In the fourth part, compare the profile you generated with those in /etc/apparmor/profiles/extras/
    for Firefox. Find out if your profile is more restrictive or more permissive compared
    with those profiles.


    # Detailed Steps to Complete this Exercise


    +   Part I: Create a Profile for the Firefox Browser


    +   Part II: Modify the Profile for Firefox to Allow Read Access to the Local
    File System


    +   Part III: Use a Browser Plug-in


    +   Part IV: Compare the Profile You Created with Those From SLES 10'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Part I: Create a Profile for the Firefox Browser


    Do the following:


    +   1. Start Yast, enter the root password (novell).


    +   2. Select Novell AppArmor > Add Profile Wizard.


    +   3. At the prompt: Application to Profile, enter firefox.


    +   4. Start Firefox by pressing Alt+F2, entering firefox and selecting Run. View
    some web pages. Close Firefox again.


    +   5. In the YaST AppArmor Profile Wizard dialog, select Scan system log for
    AppArmor events.


    +   6. Now you create the profile and need to answer several questions. Note that
    the application Firefox is quite complex and accesses several executables and
    files on the system.


    +   a. Select Inherit for /bin/basename and other executed program.


    +   b. For files and directories, choose an appropriate option, such as an #include,
    a filename, a directory, or a path with place holders, and select Allow.


    +   7. When you are returned to the AppArmor Profile Wizard dialog, select Finish.


    +   8. Make sure that the Firefox profile is in enforce mode by looking at /sys/kernel/security/apparmor/profiles
    using cat. There must be an entry /usr/lib/firefox/firefox.sh (enforce). If it
    is not, execute enforce firefox.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Part II: Modify the Profile for Firefox to Allow Read Access to the Local
    File System


    Do the following:


    +   1. Open a terminal window and su - to root (password novell).

    +   2. Enter tail -f /var/log/audit/audit.log.

    +   3. Start Firefox by pressing Alt+F2, entering firefox and selecting Run. Try
    to view the file /usr/share/doc/packages/apparmor-docs/apparmor.7.html. (You should
    not be able to do so.)

    +   4. View the log file in the terminal window. You should see a reject message.

    +   5. Stop viewing the log file by pressing Ctrl+c.

    +   6. In the terminal window, enter complain firefox.

    +   7. In Firefox, try again to access /usr/share/doc/packages/apparmor-docs/apparmor.7.html.
    You should now be able to access the file.

    +   8. Start Yast, enter the root password (novell).

    +   9. Select Novell AppArmor > Update Profile Wizard.

    +   10. You are presented with the same interface as in Part I, where you can
    choose Allow, Inherit, Deny, etc. Make sure you are updating the Firefox profile,
    not some other profile.

    +   Sooner or later you should see an entry for the path /usr/share/doc/packages/apparmor-docs/apparmor.7.html.
    By selecting the Glob button three times, you can create a suggestion /usr/share/doc/**.
    Allow it by selecting Allow.

    +   11. When all entries in the log file have been processed, select Finish.

    +   12. Put the Firefox profile back in enforce mode by entering enforce firefox
    in the terminal window.'
  merge: -1
  img_proc: true
