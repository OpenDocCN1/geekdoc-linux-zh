- pgno: 122
  md: '# SECTION 7 Use Syslog Daemon syslog-ng


    Up to SUSE Linux Enterprise Server 9, syslogd was used to log system events. With
    SUSE Linux Enterprise Server 10 these events are logged by syslog-ng, the new
    generation syslogd.


    The main advantage of syslog-ng over syslogd is its capability to filter messages
    not only based on facilities and priorities, but also based on the content of
    each message.


    # Objectives


    +   1. Use Syslog Daemon syslog-ng'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Objective 1 Use Syslog Daemon syslog-ng


    The syslog daemon syslog-ng is used by many services to log system events. The
    advantage in using a single service for logging is that all logging can be managed
    from one configuration file.


    The syslog daemon accepts messages from system services, and, depending on its
    configuration, other hosts, and logs them based on settings in the configuration
    files /etc/sysconfig/syslog and /etc/syslog-ng/syslog-ng.conf. The file /etc/syslog-ng/syslog-ng.conf
    is generated by SuSEconfig from /etc/syslog-ng/syslog-ng.conf.in. Both files share
    the same syntax.


    The configuration of syslog-ng is distributed across three files:


    +   - /etc/sysconfig/syslog

    +   - /etc/syslog-ng/syslog-ng.conf.in

    +   - /etc/syslog-ng/syslog-ng.conf'
  merge: -1
  img_proc: true
- pgno: 124
  md: "# Use Syslog Daemon syslog-ng\n\n\n\nThe file /etc/sysconfig/syslog contains\
    \ general parameters applicable to syslog-ng as well as syslog.\n\nParameters\
    \ set in this file include switches passed to syslogged or syslog-ng, kernel log\
    \ level, parameters for klogd, and which syslog daemon is to be used.\n\n```\n\
    ## Type: string\n## Default: \"\"\n## Config: \"\"\n## ServiceRestart: syslog\n\
    #\n# if not empty: parameters for syslogd\n# for example SYSLOG_PARAMS=\"-r -s\
    \ my.dom.ain\"\nSYSLOG_PARAMS=\"\" \n```\n\n```\n## Type: string\n## Default:\
    \ \"\"\n## Config: \"\"\n## ServiceRestart: syslog\n#\n# if not empty: parameters\
    \ for klogd\n# for example SYSLOG_PARAMS=\"-x\" to avoid (duplicate) symbol resolution\n\
    KLOGD_PARAMS=\"-x\" \n```\n\n```\n## Type: list(syslog,syslog-ng)\n## Default:\
    \ syslog\n## Config: syslog-ng\n## Command: /sbin/rcsyslog restart\n## PreSaveCommand:\
    \ /sbin/rcsyslog stop\n#\n# The name of the syslog daemon used as syslog service:\
    \ \"syslogd\", \"syslog-ng\"\nSYSLOG_DAEMON=\"syslog-ng\" \n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Parameters set in /etc/sysconfig/syslog are evaluated by the start script /etc/init.d/syslog.
    Furthermore, SuSEconfig uses /etc/sysconfig/syslog to add log sockets to the file
    /etc/syslog-ng/syslog-ng.conf when generating this file from /etc/syslog-ng/syslog-ng.conf.in.


    # /etc/syslog-ng/syslog-ng.conf.in


    /etc/syslog-ng/syslog-ng.conf.in is the template used to create the configuration
    file /etc/syslog-ng/syslog-ng.conf, which is the configuration file actually used
    by syslog-ng. Both files have the same syntax.


    However, unless you turn off generation of /etc/syslog-ng/syslog-ng.conf in /etc/sysconfig/syslog,
    any manual changes to this file will be overwritten when SuSEconfig is executed.


    Therefore, changes to the configuration of syslog-ng should be made in this file.


    # /etc/syslog-ng/syslog-ng.conf


    syslogd and syslog-ng share two concepts that you have to understand to be able
    to configure either one:


    +   - Facilities

    +   - Priorities


    The configuration of syslog-ng consists of several parts which are then combined
    to configure which information is logged where.


    These are:


    +   - Sources

    +   - Filters'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - Destinations

    +   - Log Paths


    # Facilities


    The facility refers to the subsystem that provides the corresponding message.
    Each program that uses syslog for logging is assigned such a facility, usually
    by its developer.


    The following describes these facilities:


    Table 7-1


    | Facility | Description |

    |---|---|

    | authpriv | Used by all services that have anything to do with system security
    or authorization. All PAM messages use this facility. The ssh daemon uses the
    auth facility. |

    | cron | Accepts messages from the cron and at daemons. |

    | daemon | Used by various daemons that do not have their own facility, such as
    the ppp daemon. |

    | kern | All kernel messages. |

    | lpr | Messages from the printer system. |

    | mail | Messages from the mail system. This is important because many messages
    can arrive very quickly. |

    | news | Messages from the news system. As with the mail system, many messages
    might need to be logged in a short time. |

    | syslog | Internal messages of the syslog daemon. |'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Table 7-1 (continued)


    | Facility | Description |

    |---|---|

    | user | A general facility for messages on a user level. For example, it is used
    by login to log failed login attempts. |

    | uucp | Messages from the uucp system. |

    | local0 – local7 | These 8 facilities are available for your own configuration.
    All of the local categories can be used in your own programs.


    By configuring one of these facilities, messages from your own programs can be
    administered individually through entries in the file /etc/syslog-ng/syslog-ng.conf.
    |


    # Priorities


    The priority gives details about the urgency of the message. The following priorities
    are available (listed in increasing degree of urgency):


    # Table 7-2


    | Priority | Description |

    |---|---|

    | debug | Should only be used for debugging purposes, since all messages of this
    category and higher are logged. |

    | info | Used for messages that are purely informative. |

    | notice | Used for messages that describe normal system states that should be
    noted. |

    | warning | Used for messages displaying deviations from the normal state. |

    | err | Used for messages displaying errors. |

    | crit | Used for messages on critical conditions for the specified program. |'
  merge: -1
  img_proc: true
- pgno: 128
  md: "# Table 7-2 (continued)\n\n| Priority | Description |\n|---|---|\n| alert |\
    \ Used for messages that inform the system administrator that immediate action\
    \ is required to keep the system functioning. |\n| emerg | Used for messages that\
    \ warn you that the system is no longer usable. |\n\n# Sources\n\nA source is\
    \ a collection of source drivers, which collect messages using a given method.\
    \ These sources are used to gather log messages. The general syntax is as follows:\n\
    \n```\nsource <identifier> { source-driver(params); source-driver(params); ...\
    \ };\n```\n\nThe respective section in /etc/syslog-ng/syslog-ng.conf looks like\
    \ this:\n\n```\nsource src {\n  # include internal syslog-ng messages\n  # note:\
    \ the internal() source is required!\n  internal();\n\n  # the following line\
    \ will be replaced by the\n  # socket list generated by SuSEconfig using\n  #\
    \ variables from /etc/sysconfig/syslog:\n  unix-dgram(\"/dev/log\");\n\n  # uncomment\
    \ to process log messages from network:\n  #udp(ip(\"0.0.0.0\") port(514));\n\
    };\n```\n\nIn this example, one source for internal messages of syslog-ng and\
    \ the socket /dev/log are defined."
  merge: -1
  img_proc: true
- pgno: 129
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 130
  md: "# Destinations\n\nDestinations defines where messages can be logged. The general\
    \ syntax is as follows:\n\n```\ndestination <identifier> {\n  destination-driver(params);\n\
    \  destination-driver(params); ... }\n```\n\nPossible destinations are files,\
    \ fifos, sockets, ttys of certain users, programs, or other hosts.\n\nA sample\
    \ from /etc/syslog-ng/syslog-ng.conf looks like this:\n\n```\ndestination console\
    \ { file(\"/dev/tty10\" group(tty) perm(0620)); };\ndestination messages { file(\"\
    /var/log/messages\"); };\n```\n\n# Log Paths\n\nLog paths are the point where\
    \ it all comes together. They define which messages are logged where, depending\
    \ on source, filter, and destination. The general syntax is as follows:\n\n```\n\
    log { source(s1); source(s2); ...\n      filter(f1); filter(f2); ...\n      destination(d1);\
    \ destination(d2); ...\n      flags(flag1[, flag2...]); };\n```\n\nThe following\
    \ entries in /etc/syslog-ng/syslog-ng.conf for instance are responsible for logging\
    \ to /dev/tty10 and /var/log/messages:\n\n```\nlog { source(src); filter(f_console);\
    \ destination(console); };\nlog { source(src); filter(f_messages); destination(messages);\
    \ };\n```"
  merge: -1
  img_proc: true
- pgno: 131
  md: 'In the first line, log messages that come in through sources defined in source
    src are logged to tty10 if they match the filter f_console. In line two, messages
    that come in through sources defined in source src are logged to /var/log/messages
    if they match the filter f_messages.


    ![](img/8279afe915b153902294b0e58311b75a_131_0.png)


    For further details on the syslog-ng.conf file, enter **man 5 syslog-ng.conf**.
    The documentation in `/usr/share/doc/packages/syslog-ng/html/book1.html` gives
    a general overview of syslog-ng as well as details on the configuration.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Summary


    | Objective | Summary |

