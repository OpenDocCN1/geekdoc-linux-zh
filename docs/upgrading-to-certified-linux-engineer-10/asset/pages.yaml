- pgno: 260
  md: '# SECTION 12 Configure a Mail Server


    The standard mail server in SUSE Linux Enterprise Server 10 is Postfix.


    In this section you will learn some backgrounds about the SMTP Protocol. Tools
    to detect spam mails and viruses are also introduced.


    # Objectives


    +   1. Understand SMTP Communication

    +   2. Manage Spam

    +   3. Use a Virus Scanner for Email'
  merge: -1
  img_proc: true
- pgno: 261
  md: "# Objective 1\n\n# Understand SMTP Communication\n\nIn the following we want\
    \ to have a closer look at:\n\n+   - The SMTP Commands\n+   - Command Syntax\n\
    +   - SMTP Reply Codes\n+   - Minimal SMTP Command Implementation\n+   - An Example\
    \ for Sending Mail with Telnet\n\n# The SMTP Commands\n\nThe commands are:\n\n\
    +   - **HELO (Hello)** is used by the SMTP sender to open a connection to an SMTP\
    \ recipient (a greeting) and to introduce itself with its full host name. This\
    \ host name is passed as an argument attached to the **HELO** command.\n+   \n\
    +     The SMTP recipient answers this greeting with its full host name. This completes\
    \ the initialization of communication between the SMTP sender and the recipient.\n\
    +   - **MAIL FROM** initializes transmission of an email message. In the simplest\
    \ case, the **MAIL FROM** command takes the sender's email address (reverse-path)\
    \ as an argument. The argument can be optionally extended to include a list of\
    \ hosts in front of the recipient's address via which a reply should be routed\
    \ (source route relaying), e.g.:\n+     - @venus.example.com\n+     - @mars.example.com:Sales@example.com\n\
    +   - **RCPT TO (Recipient)** sets the recipient's address (forward-path) for\
    \ an item of mail. If the mail should be sent to several recipients at the same\
    \ time, this command is repeated that number of times."
  merge: -1
  img_proc: true
- pgno: 262
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   - **VRFY (Verify)** verifies a user ID. This causes the SMTP recipient
    to check the validity of the addressee given as an argument. If the SMTP reader
    knows the addressee, the address is expanded into a full address (including domain).
    The **VRFY** command has no influence on the **MAIL FROM, RCPT TO,** and **DATA**
    instructions.

    +   - **EXPN (Expand)** instructs the SMTP recipient to treat the argument as
    a mailing list. As a result, the members of the list are transmitted to the SMTP
    sender.

    +   - **RSET (Reset )** resets all the information previously stored about the
    SMTP recipient. The forward path, reverse path, and mail contents are lost.

    +   - **HELP** takes as its argument any other SMTP command. A page of tips about
    how to use the corresponding instruction will be displayed.

    +   - **NOOP (No Operation)** causes the SMTP recipient to answer with an **OK**.
    Apart from that, no changes are made to the mail content or the forward and return
    paths.

    +   - **QUIT** ends the connection between the SMTP sender and recipient.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Command Syntax


    SMTP commands provide direct communication between the sender and recipient. The
    most commonly used SMTP commands are described in the following table.


    # Table 12-1


    | Command Syntax | Description of the Arguments |

    |---|---|

    | HELO hostname | hostname contains the complete host name of the SMTP sender.
    |

    | MAIL FROM: reverse-path | reverse-path contains the relay path for source route
    relaying and the sender''s address. |

    | RCPT TO: forward-path | forward-path contains the relay path for source route
    relaying and the recipient''s address. |

    | DATA data | data constitutes the contents of the mail (the actual message).
    |

    | RSET | /. |

    | VRFY string | string contains a user or mailbox name. |

    | EXPN string | string contains a mailing list identifier. |

    | HELP [string] | string contains any SMTP command. |

    | NOOP | /. |

    | QUIT | /. |


    Commands can be written in lower case or upper case: SMTP commands are not case
    sensitive. For example, the SMTP recipient will treat the following commands in
    the same way: MAIL FROM, Mail From, mail from, Mail FrOm.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'In contrast, the arguments in *forward-path* and *reverse-path* may be case-sensitive.
    The interpretation of these arguments depends on the SMTP recipient''s operating
    system and the structure of the user database, which is why lowercase and uppercase
    characters may be treated differently.


    # SMTP Reply Codes


    During communication between the SMTP sender and SMTP recipient, the sender transmits
    various commands to the recipient and controls the course of the communication
    as a whole. The recipient acknowledges the message''s receipt and gives the status
    of command processing with a corresponding reply code. Only when the sender has
    received a receipt for the previous command can it start transmitting the next
    command.


    The most commonly found SMTP reply codes are listed in the table below:


    # Table 12-2


    | Reply Code | Description |

    |---|---|

    | 211 | System status or system help reply. |

    | 214 | Displays the help message after entering HELP |

    | 220 | SMTP server ready. |

    | 221 | SMTP server has closed connection. |

    | 250 | Specified command has been carried out. |

    | 251 | User not local; will forward to *forward-path*. |

    | 354 | Start of the DATA entry. |

    | 421 | SMTP service not available. |

    | 450 | Requested action not taken (mailbox is already in use). |'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Table 12-2 (continued)


    | Reply Code | Description |

    |---|---|

    | 451 | Requested action aborted. |

    | 452 | Requested action not taken; insufficient storage space in system. |

    | 500 | Syntax error, command unrecognized. |

    | 501 | Syntax error in parameters or arguments. |

    | 502 | Command not implemented. |

    | 503 | Bad sequence of commands. |

    | 504 | Command not implemented for that parameter. |

    | 550 | Requested action not taken; file unavailable (e.g., mailbox not found,
    no access). |

    | 551 | User does not exist on mail server; try *forward-path*. |

    | 552 | Requested mail action aborted: storage allocation exceeded. |

    | 553 | Requested action not taken: mailbox name not allowed (e.g., mailbox syntax
    incorrect). |

    | 554 | Transaction failed. |'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Minimal SMTP Command Implementation


    Not all commands introduced up to now are implemented by every server. Certain
    SMTP commands are intentionally not included in some server implementations to
    increase the security of the server. One such security-critical command is HELP.
    The Postfix SMTP server by Wietse Venema has not fully implemented this command
    and simply responds to a HELP command with reply code 502 ("Command not implemented").


    The following list shows the SMTP commands that an SMTP server absolutely must
    implement to provide SMTP communication:


    +   - **HELO**

    +   - **MAIL FROM:**

    +   - **RCPT TO:**

    +   - **DATA**

    +   - **RSET**

    +   - **NOOP**

    +   - **QUIT**'
  merge: -1
  img_proc: true
