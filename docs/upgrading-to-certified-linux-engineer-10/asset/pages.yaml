  md: '# Objective 2   Understand Recent Match of iptables


    The recent match can be used to dynamically create a list of IP addresses and
    create rules regarding those IP addresses.


    There are, for instance, automated attacks that try to guess accounts and passwords
    via ssh. Using the recent match, you can temporarily block traffic from the machine
    that originates this attack.


    The information is kept in /proc/net/ipt_recent/DEFAULT, unless you specify a
    different name with the option --name. Specifying a name is useful if you want
    to keep track of different IP addresses in various rules.


    The following is an example for ssh:


    ```

    # Drop if 2 hits or more within the last 60 seconds

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --update
    --seconds 60 --hitcount 2 -j DROP

    # Add the source address to the list

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --set

    ```


    For the first ssh connection, the first rule does not match. The second rule creates
    a new entry in the recent list DEFAULT: because there is no target defined with
    -j, the packet travels down the chain and gets checked by subsequent rules.


    For the second ssh connection the hitcount is one, so the first rule still does
    not match. The second rule updates the entry in the DEFAULT list, and the hitcount
    is now 2.


    When the third packet arrives within a minute after the second packet, the first
    rule matches and the packet is dropped.


    A legitimate user who mistyped his password would have to wait 60 seconds to have
    another try after two failures.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Objective 3 Log to a Remote Host


    The syslog-ng used to log system messages on SUSE Linux Enterprise Server 10 can
    send messages to and receive messages from other computers. The receiving computer
    is sometimes referred to as loghost.


    Configuration changes are necessary on both sides:


    +   - Client Side Configuration of Syslog-ng

    +   - Server Side Configuration of Syslog-ng


    # Client Side Configuration of Syslog-ng


    Logging to other computers is configured in /etc/syslog-ng/syslog-ng.conf.in,
    as in the following example:


    ```

    destination tologhost { udp(10.0.0.254 port(514)); };

    log { source(src); destination(tologhost); };

    ```


    The first line defines a destination tologhost, with protocol, IP address (you
    could also use the host name), and port. The second line configures logging to
    this destination. Because no filter is included, all messages from the source
    src get sent to the destination tologhost.


    After editing the file /etc/syslog-ng/syslog-ng.conf.in, run SuSEconfig --module
    syslog-ng to transfer the changes to /etc/syslog-ng/syslog-ng.conf, which is the
    actual configuration file used by syslog-ng.'
  merge: -1
  img_proc: true
- pgno: 314
  md: "# Server Side Configuration of Syslog-ng\n\nTo receive messages, syslog-ng\
    \ has to listen on a port, usually port 514. Unlike syslogd, which only supports\
    \ UDP connections, syslog-ng also supports TCP.\n\nTo bind to a port, you have\
    \ to add a line within a source section. You can either add it to the existing\
    \ source src section, or create a new one, as in the following:\n\n```\nsource\
    \ network {\n    udp(\"10.0.0.254\") port(514);\n};\n```\n\nUsing 0.0.0.0 as the\
    \ IP address causes syslog-ng to bind to all available interfaces.\n\nThen a destination\
    \ and a log entry are required:\n\n```\ndestination digiair { file(\"/var/log/$HOST\"\
    ); };\nlog { source(network); destination(digiair); };\n```\n\nThe first line\
    \ defines the destination digiair; each host’s log entries get written to a file\
    \ with the hostname as file name. The log entry directs messages from the source\
    \ network to the destination digiair."
  merge: -1
  img_proc: true
- pgno: 315
  md: "# Exercise 13-1 Log to a Remote Host\n\nIn this exercise you work with a partner.\
    \ Decide who will send messages and who will receive them. (If both of you send\
    \ and receive messages to each other, you might create an endless loop.)\n\nOn\
    \ the loghost configure syslog-ng to receive log messages from other hosts.\n\n\
    On the client configure syslog-ng to send log messages to the loghost.\n\n# Detailed\
    \ Steps to Complete this Exercise\n\n+   - Part I: On the Computer Receiving Messages\n\
    +   - Part II: On the Computer Sending Messages\n\n# Part I: On the Computer Receiving\
    \ Messages\n\nDo the following:\n\n+   1. Open a terminal window and su - to root\
    \ (password novell).\n\n+   2. Open the file /etc/syslog-ng/syslog-ng.conf.in\
    \ in vi.\n\nAdd another source section after the source src section, as in the\
    \ following:\n\n```\nsource network {\n    udp(ip(\"0.0.0.0\") port(514));\n};\n\
    ```\n\n+   3. At the end of the file, add a destination and a log entry to log\
    \ messages that arrive via the network:\n\n```\ndestination digiair { file(\"\
    /var/log/$HOST\"); };\nlog { source(network); destination(digiair); };\n```\n\n\
    +   4. Save the file and quit vi."
  merge: -1
  img_proc: true
- pgno: 316
  md: '+   5. Run SuSEconfig:

    +   SuSEconfig --module syslog-ng


    6. View /var/log/messages by entering

    tail -f /var/log/messages

    You should see a message that syslog-ng initialized its new configuration.


    +   7. Quit tail by pressing ctrl+c.


    Once messages are sent from the client, syslog-ng will create a file /var/log/daxx,
    for instance, /var/log/da20. View this file by entering:

    tail -f /var/log/daxx

    (Replace daxx by the hostname of your neighbor''s computer.)


    # Part II: On the Computer Sending Messages


    Do the following:


    +   1. Open a terminal window and su - to root (password novell).


    +   2. Open the file /etc/syslog-ng/syslog-ng.conf.in in vi.


    At the end of the file, add a destination and a log entry to send messages to
    the loghost:


    ```

    ```destination tologhost { udp("daxx" port(514)); };

    log { source(src); destination(tologhost); };```

    ```


    Replace daxx in the above example with the hostname of the loghost.


    +   3. Save the file and quit vi.


    +   4. Run SuSEconfig:

    +   SuSEconfig --module syslog-ng


    SuSEconfig causes syslog-ng to reread its configuration, so there is no need to
    do this in an extra step.'
  merge: -1
  img_proc: true
