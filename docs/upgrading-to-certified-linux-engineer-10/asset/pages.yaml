    # Part V - Update Your Virus Signatures


    1. To check for a new version of the virus signatures, enter /usr/lib/AntiVir/antivir
    --update --check


    2. To download the virus signatures, enter /usr/lib/AntiVir/antivir --update


    (End of Exercise)'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# AMaViSd-new


    AMaViSd-new (A Mail Virus Scanner) consists of the daemon and some optional helper
    programs, which are only needed during setup between the message transfer agent
    (MTA) and one or more content checkers (virus scanners or SpamAssassin).


    The mail server sends all incoming and outgoing mails to AMaViSd. The email will
    be extracted and tested by AMaViSd-new.


    AMaViSd recognizes four kinds of unwanted mails. They are mails that have:


    +   1. Invalid headers

    +   2. Banned file types

    +   3. Viruses

    +   4. Spam


    AMaViSd tests incoming mails for these four types in the order listed.


    If nothing bad is found, AMaViSd-new will send the email back to the mail server,
    ready for delivery.


    By default, AMaViSd-new listens at port 10024 for incoming email from the mail
    server.


    AMaViSd-new sends clean mails to the mail server via port 10025. It is normally
    positioned at or near a central mail server, not necessarily where users'' mailboxes
    and final delivery takes place.


    This topic describes the following:


    +   - Install AMaViSd-new

    +   - Configure AMaViSd-new'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Install AMAViSd-new


    To install AMAViSd-new, select the package amavisd-new.


    AMAViSd-new will not work if no virus scanner is installed on your system. If
    you want to use AMAViSd-new only for spam filtering, search for @bypass_virus_checks_acl
    in /etc/amavisd.conf and remove the comment sign ("#") at the beginning of the
    line.


    The compressing tools gzip, bzip2, arc, lha, unrar, zoo, cpio, and lzop should
    be installed, too.


    During the SUSE Linux Enterprise Server 10 installation, a user vscan is created.
    It is used for AMAViSd.


    ```

    da51:~# grep vscan /etc/passwd

    vscan:x:65:104:vscan account:/var/spool/amavis::/bin/false

    ```


    After installing AMAViSd-new, you can start the daemon with rcmavis start.


    The daemon should listen on port 10024.


    ```

    da51:~# telnet 127.0.0.1 10024

    Trying 127.0.0.1...

    Connected to 127.0.0.1.

    Escape character is ''^]''.

    220 [127.0.0.1] ESMTP amavisd-new service ready

    ```'
  merge: -1
  img_proc: true
