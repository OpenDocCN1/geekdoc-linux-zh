    # Configure AMaViSd-new


    On SUSE Linux Enterprise Server 10 you can configure AMaViSd-new by editing one
    of the following files:


    +   - /etc/sysconfig/amavis

    +   - /etc/amavisd.conf


    # /etc/sysconfig/amavis


    The configuration file /etc/sysconfig/amavis is only available on SUSE Linux products.


    In this file there are only two parameters:


    +   - **USE_AMAVIS**. If set to yes, Sendmail or Postfix are prepared to use AMaViSd-new.'
  merge: -1
  img_proc: true
- pgno: 290
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 291
  md: 'In the Postfix configuration file /etc/postfix/main.cf you have to add the
    following line:


    ```

    content_filter = smtp-amavis:[127.0.0.1]:10024

    ```


    Restart Postfix by entering **postfix reload**.


    # /etc/amavisd.conf


    AMaViSd is configured by editing the file /etc/amavisd.conf. The syntax of this
    configuration file is plain Perl code. Because of this, each line ends in a semicolon.


    In Perl strings in double quotation marks can include variables that start with
    "$" or "@". To include characters "@" and "$" in double-quoted strings, they must
    be preceded by a backslash.


    In single-quoted strings, the "$" and "@" lose their special meaning, so it is
    usually easier to use single quoted strings.


    In both cases, the backslash needs to be doubled.


    In the documentation directory of AMaViSd-new (/usr/share/doc/packages/amavisd-new/),
    two more variants of the configuration file are available:


    +   - **amavisd.conf-default**. Includes all possible parameters with their defaults.


    +   - **amavisd.conf-sample**. A more structured file with a lot of explanations
    and examples.


    In this section we want to discuss some of the most important parameters in order
    of occurence in the /etc/amavisd.conf file.


    +   - **@bypass_virus_checks_maps**. This array includes a list of virus lookup
    tables. You can disable virus checking by setting this array to "1" (uncomment
    the line).'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   - **@bypass_spam_checks_maps**. This array includes a list of spam lookup
    tables. You can disable spam checking by setting this array to "1" (uncomment
    the line).


    Next to @bypass_virus_checks_maps and @bypass_spam_checks_maps, there are two
    more arrays of the same kind available:

    @bypass_banned_checks_maps enables checking for banned names or file types.

    @bypass_header_checks_maps enables checking for invalid headers.


    +   - **$max_servers**. Number of pre-forked children.

    +   Should match the number of your MTA pipe, e.g., the **maxproc** field in /etc/postfix/master.cf.


    ```

    #

    =========================================================================

    # service type  private unpriv  chroot  wakeup  maxproc command + args

    #              (yes)    (yes)   (yes)   (never) (100)

    #

    =========================================================================

    =

    smtp     inet  n       -       n       -       2       smtpd -o

    content_filter=smtp:[127.0.0.1]:10024

    ```


    +   - **$daemon_user** and **$daemon_group**. User and group to which the daemon
    will change.


    +   - **$mydomain**. The domain name.


    +   - **$MYHOME**. Location where the AMaViSd-new files are stored.


    +   - **$TEMPBASE**. The path of a temporary directory that can be used by AMaViSd-new.
    This directory must exist or needs to be created manually.


    In the following line an environment variable $TMPDIR is defined with the content
    of the $TEMPBASE variable.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - **$QUARANTINEDIR.** The path to where infected mails can be put. This
    can be

    +     - *a file.* Path does not end with backslash.

    +     - *a directory.* Path ends with backslash.

    +     - *disabled.* Leave it empty.

    +   - **$quarantine_subdir_levels.** If set to "1" subdirectories in $QUARANTINEDIR
    are created to disperse quarantine.

    +   - **$daemon_chroot_dir.** Run the daemon in the specified chroot jail. If
    you do not want chroot, leave it empty.

    +   - **$db_home.** Path of the databases. Default: $MYHOME/db.

    +   - **$helpers_home.** Sets the environment variable $HOME. The value is passed
    to other SpamAssassin modules.

    +   - **$pid_file.** Path of the PID file.

    +   - **$lock_file.** Path of the lock file.

    +   - **@local_domains_maps.** List of lookup tables that can be used to decide
    whether a recipient is local or not, i.e., if the message is outgoing or not.

    +   - **@mynetworks.** List of IP ranges which determines if the original SMTP
    client IP address belongs to the internal networks, i.e. if mail is coming from
    inside.

    +   - **$log_level.** Log level.

    +     - **0.** Startup/exit/failure messages, viruses detected

    +     - **1.** Args passed from client, some more interesting messages

    +     - **2.** Virus scanner output, timing

    +     - **3.** Server, client

    +     - **4.** Decompose parts

    +     - **5.** More debug details'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   - **$log_recip_templ**. Template for log file entries.

    +     A list of the available macros can be found in /usr/share/doc/packages/amavisd-new/README_FILES/README.customize.

    +   - **$DO_SYSLOG**. If set to "1", the syslog daemon is used for loggings.

    +   - **$SYSLOG_LEVEL**. Level of syslog loggings.

    +   - **$enable_db**. Enable use of BerkeleyDB/libdb. If it is enabled, you can
    also enable the libdb cache using **$enable_global_cache**.

    +   - **$inet_socket_port**. Port number that the AMAViS d-new should listen to.

    +   - **$unix_socketname**. If you are using Sendmail milter, you have to enter
    the socket name here.

    +   - **$sa_tag_level_deflt**. Spam info headers are added to the mail if the
    spam level is at or above the given number.

    +   - **$sa_tag2_level_deflt**. Spam detected headers are added to the mail if
    the spam level is at or above the given number.

    +   - **$sa_kill_level_deflt**. Spam evasive actions (bounce/reject/drop) are
    triggered if the spam level is at or above the given number.

    +   - **$sa_dsn_cutoff_level**. Spam with a spam level beyond this number is not
    sent.

    +   - **$sa_quarantine_cutoff_level**. Spam with a spam level beyond this number
    is not quarantined.

    +   - **$sa_mail_body_size_limit**. Email messages larger than the given number
    is not passed to SpamAssassin. (Less than 1% of spam is larger than 64 KB.)

    +   - **$sa_local_tests_only**. If set to "1", no SpamAssassin tests requiring
    Internet access are performed.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "+   - **$sa_auto_whitelist**. If set to \"1\", AWL (auto-whitelist) in SpamAssassin\
    \ 2.63 or older is turned on (irrelevant for SpamAssassin 3.0; on SUSE Linux Enterprise\
    \ Server 10, version 3.1.0 is available)\n+   \n+   AWL tracks scores for your\
    \ regular correspondents in a small on-disk database. Since version 3.0, it is\
    \ enabled by default.\n+   \n+   - **@lookup_sql_dsn**. Array with information\
    \ about where to find SQL server(s) and database to support SQL lookups. One item\
    \ includes a triple of data: source name, user, and password.\n+   - **$virus_admin**.\
    \ Fully qualified address of the antivirus administrator.\n+   - **$mailfrom_notify_admin**.\
    \ Fully qualified address of the sender of admin notifications.\n+   - **$mailfrom_notify_recip**.\
    \ Fully qualified address of the sender of virus notifications.\n+   - **$mailfrom_notify_spamadmin**.\
    \ Fully qualified address of the sender of spam notifications.\n+   - **$mailfrom_to_quarantine**.\
    \ Whom quarantined messages appear to be sent from. If undefined, the original\
    \ sender is used.\n+   - **@addr_extension_virus_maps**. The specified string\
    \ is added to the recipient’s address if a virus is detected.\n+   \n+   The **@addr_extension_spam_maps**,\
    \ **@addr_extension_banned_maps**, and **@addr_extension_bad_header_maps** strings\
    \ work in the same way.\n+   \n+   The string is separated from the recipient\
    \ address by the string specified in **$recipient_delimiter**.\n+   \n+   Example:\n\
    +   geeko@digitalairlines.com > geeko+spam@digitalairlines.com"
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - **$path**. The content of this variable is passed to the PATH environment
    variable.

    +   - **$dspam**. Activate the dspam content filter (http://www.nuclearelephant.com/projects/dspam/).

    +   - **$MAXLEVELS**. Maximum recursion level for extraction and decoding.

    +   - **$MAXFILES**. Maximum number of extracted files.

    +   - **$MIN_EXPANSION_QUOTA**, **$MAX_EXPANSION_QUOTA**. Minimum and maximum
    storage size (in bytes) that is available for mail extraction.

    +   - **$sa_spam_subject_tag**. String that is prepended to the subject header
    when message exceeds **$sa_tag2_level_deflt** level.

    +   - **@*_lovers_maps**. Email to the specified recipients is not examined and
    filtered.

    +   - **@blacklist_sender_maps**. A message from a blacklisted envelope sender
    address is marked as spam.

    +     A **@whitelist_sender_maps** is also available. Mail with sender addresses
    from this array are delivered although they are marked as spam.

    +   - **@score_sender_maps**. Using this variable you can add or subtract a specified
    value to/from the spam value.


    The next variables (beginning with **@viruses_that_fake_sender_maps**) contain
    regular expressions to filter mails.


    Many regular expressions are predefined and you can enable them by removing the
    comment hash sign at the beginning of the line(s).


    Of course you can modify the regular expressions if they do not fit your needs.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Some other important variables are:


    +   - **$final_virus_destiny, $final_banned_destiny, $final_spam_destiny, $final_bad_header_destiny.**
    Defines what to do with email that has a virus, a banned sender, spam content,
    or incorrect headers.


    You can use the following values:


    +   - D_PASS. Mail will pass to recipients, regardless of bad contents.

    +   - D_DISCARD. Mail will not be delivered to its recipients; sender will not
    be notified.

    +   - D_BOUNCE. Mail will not be delivered to its recipients; a nondelivery notification
    (bounce) will be sent to the sender by AMaViSd-new.

    +   - D_REJECT. Mail will not be delivered to its recipients; the sender should
    preferably get a rejection notification, (SMTP permanent reject response or nondelivery
    notification from the MTA). If this is not possible, AMaViSd-new sends a bounce
    by itself (the same as D_BOUNCE).


    +   - $notify_method. Specify a host and port where the notifications are sent
    to.


    +   - $notify_sender_templ. Add this variable if you do not want the sender of
    an email notified.


    +   - $notify_virus_sender_templ. Specify a text file if you do not want the default
    notification sent to the sender of an email that contained a virus.


    +   - $notify_virus_admin_templ. Specify a text file if you do not want the administrator
    notified when a virus is detected.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '+   - **$notify_virus_recips_templ.** Specify a text file if you do not want
    to notify the recipients of an email that contained a virus.

    +   - **$notify_spam_sender_templ.** Specify a text file if you do not want to
    notify the sender of an email that contained spam.

    +   - **$notify_spam_admin_templ.** Specify a text file if you do not want to
    notify the administrator if a spam email is detected.'
