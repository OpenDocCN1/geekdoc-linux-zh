- pgno: 181
  md: '# Objective 2


    # Configure Dynamic DNS


    If the number of zones and hosts increases, it is inconvenient to edit the zone
    files manually.


    You can modify the resource record sources of the name server dynamically without
    editing and reloading files. This is called dynamic DNS. Dynamic DNS can also
    be used by external services like DHCP.


    To allow dynamic changes, add the following line in the zone definition.


    ```

    allow-update { 127.0.0.1; };

    ```


    In this example, only the loopback address is used, but it is also possible to
    add IP addresses of other hosts.


    To edit the DNS records dynamically, use the command nsupdate:


    ```

    da51:~ # nsupdate

    ```


    The security tool AppArmor is installed and enabled on SUSE Linux Enterprise Server
    10 by default. There is an AppArmor profile for BIND that prohibits nsupdate to
    change the BIND zone information. AppArmor is covered in the course SUSE Linux
    Enterprise Server 10 Security (Course 3075) in detail. Stop the AppArmor daemon
    by entering rcapparmor stop to use nsupdate as described in the following.


    Before using nsupdate, make sure that all zone files have the correct access permissions.
    If they are not set properly, use the following commands: chgrp -R named /var/lib/named
    chmod -R g+w /var/lib/named'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Dynamic updates are stored in a journal file for the zone. This file is automatically
    generated by the server when the first dynamic update is performed. The name of
    the journal file is created by appending the extension .jnl to the name of the
    corresponding zone file. The journal file is in a binary format and should not
    be edited manually.


    The contents of the journal file are written to the zone file every 15 minutes.
    When the name server is shut down, the contents of the journal file are written
    to the zone file, too.


    > Dynamic updates will change the layout of your zone files when the data is written
    to them. You should either use an editor or nsupdate to modify your zone information
    instead of using both tools.


    The most important nsupdate options are


    +   - **server server [port]**. Sends all dynamic update requests to the name
    server server.

    +     If no port number is specified, the default DNS port number 53 is used.


    +   - **update delete reference [ttl] [class] [type value...]**. Deletes any resource
    records named reference.

    +     If the record type and value are provided, only matching resource records
    will be removed.

    +     The Internet class (IN) is assumed if class is not supplied.

    +     ttl is ignored. It is only allowed for compatibility.


    +   - **update add reference ttl [class] type value...** Adds a new resource record
    with the specified ttl (in seconds), class and value.


    +   - **send**. Sends the current message. This is necessary to actually execute
    the command. This is equivalent to entering a blank line.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "All commands are described in the man page of nsupdate: man 8 nsupdate.\n\n\
    # The following is an example of using nsupdate:\n\n```\nda51:~ # nsupdate\n>\
    \ server 127.0.0.1\n> update add da13.digitalairlines.com 86400 A 10.0.0.13\n\
    > \n> update delete da13.digitalairlines.com A\n> \n> update add 13.0.0.10.in-addr.arpa\
    \ 86400 PTR da13.digitalairlines.com\n>\n```\n\nThis will generate messages like\
    \ the following in /var/log/messages:\n\n```\nMay 20 11:13:58 da51 named[5161]:\
    \ client 127.0.0.1#32781: updating zone 'digitalairlines.com/IN': adding an RR\n\
    May 20 11:13:58 da51 named[5161]: journal file master/digitalairlines.com.zone.jnl\
    \ does not exist, creating it\nMay 20 11:13:58 da51 named[5161]: zone digitalairlines.com/IN:\
    \ sending notifies (serial 2005051903)\nMay 20 11:21:50 da51 named[5161]: client\
    \ 127.0.0.1#32783: updating zone '0.0.10.in-addr.arpa/IN': adding an RR\nMay 20\
    \ 11:21:50 da51 named[5161]: journal file master/10.0.0.zone.jnl does not exist,\
    \ creating it\nMay 20 11:21:50 da51 named[5161]: zone 0.0.10.in-addr.arpa/IN:\
    \ sending notifies (serial 2005051902)\n```\n\nThe journal files will be created\
    \ automatically:\n\n```\nda51:/var/lib/named # dir master/\ntotal 16\ndrwxrwxr-x\
    \ 2 root named 200 May 20 11:21 .\ndrwxrwxr-x 9 root named 408 May 20 10:40 ..\n\
    -rw-rw-r-- 1 root named 463 May 19 12:06 10.0.0.zone\n-rw-r--r-- 1 named named\
    \ 814 May 20 11:21 10.0.0.zone.jnl\n-rw-rw-r-- 1 root named 440 May 19 14:51 digitalairlines.com.zone\n\
    -rw-r--r-- 1 named named 794 May 20 11:13 digitalairlines.com.zone.jnl\n```\n\n\
    Press Ctrl + D or enter quit to quit nsupdate."
