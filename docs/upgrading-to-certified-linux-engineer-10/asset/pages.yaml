- pgno: 14
  md: 'For more information about Novell certification programs and taking the Novell
    CLP 10 and CLE 10 Practicum exam, see http://www.novell.com/training/certinfo/.


    # SUSE Linux Enterprise Server 10 Support and Maintenance


    To receive official support and maintenance updates for SUSE Linux Enterprise
    Server 10, you need to do one of the following:


    +   - Register for a free registration/serial code that provides you with 30 days
    of support and maintenance.

    +   - Purchase a copy of SUSE Linux Enterprise Server 10 from Novell (or an authorized
    dealer).


    You can obtain your free 30-day support and maintenance code at http://www.novell.com/products/linuxenterpriseserver/eval.html.


    You will need to have or create a Novell login account to access the 30-day evaluation.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Novell Customer Center


    Novell Customer Center is an intuitive, web-based interface that helps you to
    manage your business and technical interactions with Novell. Novell Customer Center
    consolidates access to information, tools and services such as:


    +   - Automated registration for new SUSE Linux Enterprise products

    +   - Patches and updates for all shipping Linux products from Novell

    +   - Order history for all Novell products, subscriptions and services

    +   - Entitlement visibility for new SUSE Linux Enterprise products

    +   - Linux subscription-renewal status

    +   - Subscription renewals via partners or Novell


    For example, a company might have an administrator who needs to download SUSE
    Linux Enterprise software updates, a purchaser who wants to review the order history
    and an IT manager who has to reconcile licensing. With Novell Customer Center,
    the company can meet all these needs in one location and can give each user access
    rights appropriate to their roles.


    You can access the Novell Customer Center at http://www.novell.com/center.'
  merge: -1
  img_proc: true
