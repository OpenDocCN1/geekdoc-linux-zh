- pgno: 210
  md: 'In the next dialog, you can enter the configuration of your LDAP client.


    # Figure 11-5


    ![](img/8279afe915b153902294b0e58311b75a_210_0.png)


    Here you can enter the following information:


    +   - **User Authentication**. Select the kind of user authentication:

    +     - Do Not Use LDAP. LDAP is not used for user authentication.

    +     - Use LDAP. LDAP is used for user authentication.

    +     - Use LDAP but Disable Logins. LDAP is used for user authentication, but
    the users are not able to log in to this machine anymore.


    +   - **Addresses of LDAP Servers**. Enter the name or the IP address of your
    LDAP server here. If the IP of your LDAP server is provided via SLP, you can select
