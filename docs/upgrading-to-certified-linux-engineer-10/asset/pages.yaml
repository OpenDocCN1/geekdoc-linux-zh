- pgno: 59
  md: '# Objective 5

    Describe the sysfs File System


    sysfs is a virtual file system that is mounted under /sys. In a virtual file system,
    there is no physical device that holds the information. Instead, the file system
    is generated virtually by the kernel.


    The directory and file structure under /sys, provides information about the hardware
    which is currently connected with a system.


    Under /sys, there are 4 main directories:


    +   • /sys/bus and /sys/devices. These directories contain different representations
    of system hardware. Devices are represented here.


    For example, the following represents a digital camera connected to the USB bus:


    ```

    /sys/bus/usb/devices/1-1:1.0/

    ```


    This directory contains several files that provide information about the device.
    The following is a listing of the files in this directory:


    | Filename | Value1 | Value2 |

    |----------|--------|--------|

    | 1-1:1.0 | hMaxPower | manufacturer |

    | bConfigurationValue | bNumConfigurations | maxchild |

    | bDeviceClass | bNumInterfaces | power |

    | bDeviceClass | detach_state | product |

    | bDeviceProtocol | devnum | serial |

    | bDeviceSubClass | idProduct | speed |

    | bMattributes | idVendor | version |


    For example, by reading the content from the manufacturer file, you can determine
    the manufacturer of the device:


    ```

    cat manufacturer

    ```


    OLYMPUS


    In this case, an Olympus digital camera is connected to the system.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '/sys/class and /sys/block. The interfaces of the devices are represented under
    these 2 directories.


    For example, the interface belonging to the Olympus digital camera is represented
    by the following directory:


    ```

    /sys/block/sda/

    ```


    The directory named /sda is the digital camera accessed like a SCSI hard disk.


    The following is the content of the /sda directory:


    ```

    dev    queue  removable  size

    device range  sda1      stat

    ```


    The subdirectory /sda1 represents the interface to the first partition on the
    cameras memory card. For example, by reading the content of /sda1/size, you can
    determine the size of the partition:


    ```

    cat sda1/size

    31959

    ```


    The partition has a size of 31959 512-byte blocks, which is about 16 MB.


    To connect an interface with a device, file system links are used. In the Olympus
    digital camera example, a link exists from the file /sys/block/sda/device to the
    corresponding device:


    ```

    ll device

    lrwxrwxrwx 1 root root 0 Aug 17 14:03 device -> ../../devices/pci0000:00/0000:00:1d.0/usb1/1-1/1-1.1/0/host0/0:0:0:0

    ```


    In this way, all interfaces of the system are linked with their corresponding
    devices.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Beside the representation in **sysfs**, there are also the device files in
    the **/dev** directory.


    These files are needed for applications to access the interfaces of a device.
    The name "device file" is a bit misleading, the name "interface file" would be
    more suitable.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Objective 6 Describe how udev Works


    Before you can use a hardware device, you need to load the appropriate driver
    module and set up the corresponding interface. For most devices in SUSE Linux
    Enterprise Server 10, this is done by udev.


    To get an overview about udev, do the following:


    +   - Understand the Purpose of udev

    +   - Understand how udev Works

    +   - Understand Persistent Interface Names


    # Understand the Purpose of udev


    udev has three main purposes:


    +   - **Create device files.** The most obvious task of udev is to create device
    files under /dev automatically when a device is connected to the system. Before,
    the /dev directory was populated with every device, that might appear in the system.
    This led to a very complex and confusing /dev directory, as most of the device
    files were actually not used.

    +   - **Persistent device names.** Another advantage of udev is that it provides
    a mechanism for persistent device names.

    +   - **Hotplug replacement.** In SUSE Linux Enterprise Server 10, udev also replaces
    the hotplug system, which was responsible for the initialization of hardware devices
    in previous versions. udev is now the central point for hardware initialization
    in SUSE Linux Enterprise Server 10.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Understand how udev Works


    udev is implemented as a daemon (udevd), which is started at boot time through
    the script /etc/init.d/boot.d/S03boot.udev. udev communicates with the Linux kernel
    through the uevent interface. When the kernel sends out a uevent message that
    a device has been added or removed, udevd does the following, based on the udev
    rules:


    +   - Initializes devices by calling hwup.

    +   - Creates device files in /dev.

    +   - Sets up network interfaces with ifup.

    +   - Renames network interfaces, if necessary.

    +   - Mounts storage devices which are identified as hotplug in /etc/fstab.

    +   - Informs other applications through HAL (Hardware Abstraction Layer) about
    the new device.


    To handle uevent messages, which have been issued before udevd was started, the
    udev start script triggers these missed events by parsing the sysfs filesystem.
    In previous SUSE Linux Enterprise Server versions, this part of the system initialisation
    was done by the coldplug script.


    Everything udev does, depends on rules, defined in configuration files under /etc/udev/rules.d/,
    which are used to process a uevent.


    A detailed description of udev rules is beyond the scope of this course. However,
    in the following you find the most important facts:


    +   - udev rules are spread over several files, which are processed in alphabetical
    order. Each line in these files is a rule. Comments can be added with the # character.

    +   - Each rule consists of multiple key value pairs. Example for a key value
    pair: kernel=="hda"'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - There are two different key types:

    +     - **match keys.** These keys are used to determine, if rule should be used
    to process an event.

    +     - **assignment keys.** These keys determine what to do if a rule is processed.


    There always has to be at least one match and one assignment key in rule.


    +   - For every uevent, all rules are processed. Processing does not stop when
    a matching rule is found.


    You can monitor the activity of udev with the tool **udevmonitor**. When you start
    the tool and change the hardware configuration (e.g. plug or unplug an USB device)
    the udev activities are displayed on the screen. For more details, you can start
    the tool the option **--env**.


    # *Understand Persistent Interface Names*


    The interface files in the directory **/dev** are created and assigned to the
    corresponding hardware device when the device is recognized and initialized by
    a driver. Therefore the assignment between device and interface file depends on:


    +   - The order in which device drivers are loaded.

    +   - The order in which devices are connected to a computer.


    This can lead to situations, where it’s not clear which device file is assigned
    to which device. Consider the following example:


    You have two USB devices, a digital camera and a flash card reader. Both devices
    are accessed as storage devices through the device files **/dev/sda, /dev/sdb**
    ...


    Which device is assigned to which device file, usually depends on the order in
    which they are plugged in. The first devices gets sda and so on.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'udev can help to make this more predictable. With the help of sysfs, udev can
    find out, which device is connected to which interface file. The easiest solution
    for persistent device names would be to rename the interface files, for example
    from /dev/sda1 to /dev/camera.


    Unfortunately, interface files can not be renamed under Linux. The only exeption
    to this rule are network interfaces, which traditionally have no interface files
    under /dev.


    Therefore udev uses a different approach. Instead of renaming an interface file,
    a link with a unique and persistent name is created to the assigned interface
    file.


    By default udev is for example configured to create these links for all storage
    devices. For each device, a link is created in each of the following subdirectories
    under /dev/disk/:


    +   - **by-id**. The name of the link is based on the vendor and on the name of
    a device.

    +   - **by-path**. The name of the link is based on the bus position of a device.

    +   - **by-uuid**. The name of the link is based on the serial number of a device.


    The udev rules which create these links are located in the file /etc/udev/rules.d/60-persistent-storage.rules.


    This means, that the association between devices and interface files still depends
    on the order in which the drivers are loaded or in which order devices are connected
    with the system.


    With udev however, persistent links are created and adjusted everytime the device
    configuration changes.


    As mentioned before, network interfaces are treated differently. They don’t have
    interface files and they can be directly renamed by udev.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Persistent network interfaces are configured as udev rule in the file **/etc/udev/rules.d/30-net_persistent_names.rules**


    The following is an example rule:


    ```

    SUBSYSTEM=="net", ACTION=="add", SYSFS{address}=="00:30:05:4b:98:85",

    IMPORT="/sbin/rename_netiface %k eth0"

    ```


    The matching key SYSFS{address} is used to identify a network device by it''s
    MAC address. At the end of the rule, the name of the interface is given. In this
    example eth0.


    ![](img/8279afe915b153902294b0e58311b75a_66_0.png)


    In SUSE Linux Enterprise Server 9, it was possible to configure persistent network
    interface names in the interface configuration files under /etc/sysconfig/network.
    This is not supported anymore in SUSE Linux Enterprise Server 10. Interface names
    now have to be configured in the udev rule.'
  merge: -1
  img_proc: true
