- pgno: 187
  md: "# Objective 1 Configure DHCP Pools\n\nThe pool declaration can be used to specify\
    \ a pool of addresses that will be treated differently than any other pool of\
    \ addresses, even on the same network segment or subnet.\n\nFor example, you may\
    \ want to provide a large set of addresses that can be assigned to DHCP clients\
    \ that are registered to your DHCP server, while providing a smaller set of addresses,\
    \ possibly with short lease times, that are available for unknown clients.\n\n\
    To do this, you would set up a pair of pool declarations:\n\n```\nsubnet 10.0.0.0\
    \ netmask 255.255.255.0 {\n  option routers 10.0.0.254;\n\n  # Unknown clients\
    \ get this pool.\n  pool {\n    option domain-name-servers 10.0.0.254;\n    max-lease-time\
    \ 300;\n    range 10.0.0.100 10.0.0.250;\n    allow unknown-clients;\n  }\n\n\
    \  # Known clients get this pool.\n  pool {\n    option domain-name-servers 10.0.0.251,\
    \ 10.0.0.252;\n    max-lease-time 28800;\n    range 10.0.0.5 10.0.0.99;\n    deny\
    \ unknown-clients;\n  }\n}\n```\n\nIt is also possible to set up entirely different\
    \ subnets for known and unknown clients. \"Known clients\" mean, that an IP address\
    \ is assigned to a MAC address using the host statement. Pools exist at the level\
    \ of shared networks, so address ranges within pool declarations can be on different\
    \ subnets."
  merge: -1
  img_proc: true
- pgno: 188
  md: 'As you can see in the preceding example, pools can have permit lists that control
    which clients are allowed access to the pool and which aren''t.


    Each entry in a pool''s permit list is introduced with the allow or deny keyword.
    If a pool has a permit list, then only those clients that match specific entries
    on the permit list will be eligible to be assigned addresses from the pool.


    If a pool has a deny list, then only those clients that do not match any entries
    on the deny list will be eligible. If both permit and deny lists exist for a pool,
    then only clients that match the permit list and do not match the deny list will
    be allowed access.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Objective 2 Configure DHCP Failover


    This objective covers the following topics:


    +   - Basics of DHCP Failover

    +   - Configure Failover


    # Basics of DHCP Failover


    The failover protocol allows two DHCP servers (and no more than two) to share
    a common address pool. Each server will have about half of the available IP addresses
    in the pool at any given time for allocation.


    If one server fails, the other server will continue to renew leases out of the
    pool, and will allocate new addresses out of the half of available addresses that
    it had before communication with the other server was lost.


    When a server starts that has not previously communicated with its failover peer,
    it must establish communications and synchronize with the peer before it can serve
    clients. This can happen either because you have just configured your DHCP servers
    to perform failover for the first time, or because one of your failover servers
    has failed and lost its database.


    The initial recovery process is designed to ensure that when one failover peer
    loses its database and then resynchronizes, any leases that the failed server
    gave out before it failed will be honored. When the failed server starts up, it
    notices that it has no saved failover state and attempts to contact its peer.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'When it has established contact, it asks the peer for a complete copy of its
    lease database. The peer then sends its complete database and sends a message
    indicating that it is done. The failed server then waits until MCLT (Maximum Client
    Lead Time) has passed. Once MCLT has passed, both servers make the transition
    back into normal operation.


    This waiting period ensures that any leases the failed server may have given out
    while out of contact with its partner will have expired.


    While the failed server is recovering, its partner remains in the partner-down
    state, which means that it is serving all clients. The failed server provides
    no service at all to DHCP clients until it has made the transition into normal
    operation.


    In the case where both servers detect that they have never before communicated
    with their partner, they both come up in this recovery state and follow the procedure
    we have just described. In this case, no service will be provided to DHCP clients
    until MCLT has expired.


    # Configure Failover


    In a failover configuration you have to decide which server acts as the primary
    and which acts as the secondary server. Both servers need to have the same configuration
    for the basic DHCP service they are sharing. They only differ in the failover
    setup. Therefore, it is recommended to have a common configuration file on both
    machines which is included in the file /etc/dhcpd.conf.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "The configuration file for the primary server looks like this:\n\n```\nfailover\
    \ peer \"digitalairlines\" {\n    primary;\n    address 10.0.0.10;\n    port 847;\n\
    \    peer address 10.0.0.12;\n    peer port 647;\n    max-response-delay 180;\n\
    \    mclt 1800;\n    split 128;\n    load balance max seconds 3;\n}\n# Now we\
    \ include the identical configuration on both\n# machines\ninclude \" /etc/dhcpd.conf.master\"\
    ;\n```\n\nThe statements in this example peer declaration are as follows:\n\n\
    +   - **primary and secondary.** Determines whether the server is primary or secondary,\
    \ as described earlier.\n\n+   - **address.** Specifies the IP address or DNS\
    \ name on which the server should listen for connections from its failover peer.\n\
    \n+   - **port.** Specifies the TCP port on which the server should listen for\
    \ connections from its failover peer (default: 647 and 847). This parameter must\
    \ be specified, because the failover protocol does not yet have a reserved TCP\
    \ port number.\n\n+   - **peer address.** Specifies the IP address or DNS name\
    \ to which the server should connect to reach its failover peer.\n\n+   - **peer\
    \ port.** Specifies the TCP port to which the server should connect to reach its\
    \ failover peer for failover messages. This parameter must be specified, because\
    \ the failover protocol does not yet have a reserved TCP port number. The peer\
    \ port can be the same as the port.\n\n+   - **max-response-delay.** Specifies\
    \ how many seconds the DHCP server waits without receiving a message from its\
    \ failover peer before it assumes that connection has failed."
  merge: -1
  img_proc: true
- pgno: 192
  md: "This number should be small enough that a transient network failure breaks\
    \ the connection will not result in the servers being out of communication for\
    \ a long time, but large enough that the server isn't constantly making and breaking\
    \ connections.\n\nThis parameter must be specified.\n\n+   - **mclt.** Defines\
    \ the Maximum Client Lead Time. It must be specified on the primary, and can be\
    \ specified also on the secondary server. This is the length of time for which\
    \ a lease may be renewed by either failover peer without contacting the other.\n\
    +   \n+   The longer you set this, the longer it will take for the running server\
    \ to recover IP addresses after moving into PARTNER-DOWN state. The shorter you\
    \ set it, the more load your servers will experience when they are not communicating.\n\
    +   \n+   A value of 1800 is recommended.\n\n+   - **split.** Specifies the split\
    \ between the primary and secondary server for the purposes of load balancing.\n\
    +   \n+   Whenever a client makes a DHCP request, the DHCP server runs a hash\
    \ on the client identification. If the hash comes out to less than the split value,\
    \ the primary answers. If it comes out to equal to or more than the split, the\
    \ secondary answers.\n+   \n+   A meaningful value is 128 and can only be configured\
    \ on the primary server.\n\n+   - **load balance max seconds.** Specifies a cutoff\
    \ after which load balancing is disabled. The cutoff is based on the number of\
    \ seconds since the client sent its first DHCPDISCOVER or DHCPREQUEST message.\n\
    +   \n+   The man pages recommend setting this to 3 or 5. The effect of this is\
    \ that if one of the failover peers gets into a state where it is responding to\
    \ failover messages but not responding to some client requests, the other failover\
    \ peer will take over its client load automatically as the clients retry."
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Upgrading to Certified Linux Engineer 10\n\nThe configuration file for the\
    \ secondary server looks like this:\n\n```\nfailover peer \"digitalairlines\"\
    \ {\n    secondary;\n    address 10.0.0.12;\n    port 647;\n    peer address 10.0.0.10;\n\
    \    peer port 847;\n    max-response-delay 180;\n    load balance max seconds\
    \ 3;\n}\n# Now we include the identical configuration on both\n# machines\n# include\
    \ \"/etc/dhcpd.conf.master\";\n```\n\nThe differences to the primary server configuration\
    \ are the statement \"secondary\", the missing statements mclt and split and the\
    \ interchanged values of address, port, peer address and peer port.\n\nThe main\
    \ DHCP server configuration is contained in the file /etc/dhcpd.conf.master, which\
    \ included in both configurations.\n\nIn order to find this file, it needs to\
    \ be copied to the chroot environment of the DHCP server. The best way to achieve\
    \ this is to modify the variable DHCP_CONF_INCLUDE_FILES in /etc/sysconfig/dhcpd:\
    \ DHCP_CONF_INCLUDE_FILES=\"/etc/dhcpd.conf.master\""
  merge: -1
  img_proc: true
- pgno: 194
  md: "The master configuration file need to be modified:\n\n```\nddns-update-style\
    \ none;\n\ndefault-lease-time 86400;\nmax-lease-time 86400;\n\noption domain-name\
    \ \"digitalairlines.com\";\noption domain-name-servers 10.0.0.254;\n\noption routers\
    \ 10.0.0.254;\n\nsubnet 10.0.0.0 netmask 255.255.255.0 {\n    pool {\n       \
    \ failover peer \"digitalairlines\";\n        deny dynamic bootp clients;\n  \
    \      range 10.0.0.101 10.0.0.120;\n    }\n}\n```\n\nAll failover configurations\
    \ have to be defined in a pool statement. If you use several pools, you need to\
    \ define the failover configuration in each of them.\n\n> In order to be aware\
    \ of the name of the failover configuration, it has to be defined before the pool\
    \ definition. That is why the include statement is written at the end of /etc/dhcpd.conf.\n\
    \nFailover is not supported on address allocation pools that contain addresses\
    \ allocated to bootp clients. Therefore, the statement deny dynamic bootp clients;\
    \ has to be defined."
  merge: -1
  img_proc: true
