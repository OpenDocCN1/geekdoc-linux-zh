- pgno: 211
  md: '+   - **LDAP base DN.** Enter the DN of the root of your LDAP tree here. Select
    Fetch DN if you want to browse the LDAP tree of your LDAP server.

    +   - **LDAP TLS/SSL.** If your LDAP server supports encryption, activate this
    option.

    +   - **LDAP Version 2.** The current LDAP protocol version is 3. If you want
    to use the older version 2, select this option.

    +   - **Start Automounter.** Starts the automounter daemon which mounts directories
    automatically when they are used.


    # Configure OpenLDAP with YaST


    However, if you chose not to install the server during installation, you can set
    up an LDAP server by installing the following software packages with YaST:


    +   - openldap2

    +   - openldap2-client

    +   - pam_ldap

