- pgno: 339
  md: 'Once all log entries have been processed, you are returned to genprof, where
    you can start a new scan or Finish the profile generation.


    ```

    Writing updated profile for /usr/lib/firefox/firefox.sh.


    Profiling: /usr/lib/firefox/firefox.sh


    [(S)can system log for SubDomain events] / (F)inish

    ```


    # logprof


    logprof is a tool used to scan the log /var/log/audit/audit.log for entries created
    by AppArmor for profiles in learning mode, and to interactively create new profile
    entries.


    The choices you have are the same as those described under "genprof" on page 14-18.


    If you want logprof to start scanning from a certain point in the log file, you
    can pass a string that describes that point. The following is an entry in the
    log file:


    ```

    type=APPARMOR msg=audit(852099290.789:1103): PERMITTING w access to /root/.mozilla/firefox/wgzf7zy.default/prefs.js
    (firefox-bin(8770) profile /usr/lib/firefox/firefox.sh active /usr/lib/firefox/firefox.sh

    ```


    Using the option -m: logprof -m "852099290.789:1103", you can start the scan of
    the log file from that point, ignoring earlier entries.'
