- pgno: 109
  md: 'By selecting one of the three predefined security levels and selecting Next,
    the chosen security level is applied. By selecting Details, you can change the
    settings for the security level you have selected.


    If you choose the Customs Settings and then select Next, you can directly change
    the details of the security configuration.


    The dialogs for the detail settings look the same for every security level, but
