- pgno: 345
  md: '10. Start Firefox again and select another Java demo available at the URL given
    in Step 4. This should work now, despite the profile being in enforce mode again.


    # Part IV: Compare the Profile You Created with Those From SLES 10


    Do the following:


    +   1. Open a console window and view the profile /etc/apparmor.d/usr.lib.firefox.firefox.sh
    just created with cat.


    +   2. Open another console window and view the profiles /etc/apparmor/profiles/extras/usr.lib.firefox.firefox*,
    using cat.


    +   3. Compare the files. Note any differences and decide whether or not they
    are more restrictive than the one you created.


    (End of Exercise)'
