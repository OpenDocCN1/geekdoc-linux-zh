- pgno: 27
  md: '# Objective 2 Log Out and Shut Down


    When you are ready to log out of the system, open the Computer menu (also called
    main menu) in the bottom panel.


    # Figure 2-3


    ![](img/8279afe915b153902294b0e58311b75a_27_0.png)


    At the right side of the Computer menu, select the Log Out entry.


    After selecting Log Out, a confirmation dialog appears.


    # Figure 2-4


    ![](img/8279afe915b153902294b0e58311b75a_27_1.png)


    If you select Save current setup, your current desktop environment settings are
    saved and restored after your next login.


    Select OK after selecting an action.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'If you are at the login screen, there are four options availabe in the lower
    left corner:


    +   - **Language.** Select the language of the desktop environment.

    +   - **Session.** You can choose a window manager other than GNOME. In this student
    manual, we cover only GNOME (the default window manager). Some basic informations
    about the KDE environment you find in the appendix A.

    +   - **Reboot.** Reboots the system.

    +   - **Shut Down.** Shuts down your computer.


    Only root is allowed to reboot the system. So you have to enter the root password.


    Only root is allowed to shut down the system. So you have to enter the root password.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Objective 3 Identify GNOME Desktop Components


    The GNOME desktop includes one panel at the bottom of the screen.


    # Figure 2-5


    ![](img/8279afe915b153902294b0e58311b75a_29_0.png)


    There is a menu at the left side of the panel. This menu is labeled Computer.
    It is called the main menu.


    The empty space in the middle of the panel includes the task manager. All opened
    windows on the screen will be listed here.


    At the right of the panel there are some more items. Which icons are available
    depends from your hardware:


    +   - Globe. Searches for new updates.

    +   - Battery. Power management for laptops.

    +   - Speaker. Volume control.

    +   - Clock. Shows date and time.

    +   - Board. Minimizes all open windows or shows them again on the desktop.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'You can start a programs with an icon on the desktop by double-clicking the
    icon. But normally programs are started from the main menu.


    # Figure 2-6


    ![](img/8279afe915b153902294b0e58311b75a_30_0.png)


    At the top of the left frame there is a pull-down menu showing three different
    filters:


    +   - Favorite Applications

    +   - Recently Used Applications

    +   - Recent Documents'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Figure 2-7


    In the left frame, there is also a button labeled More Applications. If you select
    this button, the application browser appears.


    ![](img/8279afe915b153902294b0e58311b75a_31_0.png)


    The right frame of the application browser shows a list of the most important
    installed applications. The applications are grouped and you can see a list of
    the groups in the left frame. Select a group to see only the applications that
    belong to this group.


    The filter option adds even more flexibility. Enter a part of the name of the
    application you want to start in the Filter textbox in the left frame. The filtered
    applications are shown immediately in the right frame.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'In the right frame of the main menu, there are five system options:


    +   - **Help.** Starts the online help.

    +   - **Control Center.** Starts the GNOME Control Center where you can configure
    your desktop with.

    +   - **Install Software.** Shows a list with the available software on your registered
    installation media.

    +   - **Lock Screen.** Locks the screen. To unlock you have to enter your password.

    +   - **Log Out.** Must be selected to log out of the system.


    At the bottom of the right frame you can see the status of your hard drives and
    network.


    To start an application select the icon in the main menu or the application browser
    with a single mouse click.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Objective 4 Manage Icons in GNOME


    You can manage icons on your desktop in different ways. For simplicity, we will
    describe only the most important methods.


    You can find icons in the following three areas on your desktop:


    +   - Desktop

    +   - Panel

    +   - Main Menu


    # Desktop


    To create an icon for an application on your desktop, select the item in your
    application menu, drag it to a free space on your desktop, and release the mouse
    button.


    Notice there is a small plus icon at the mouse pointer when moving the icon. This
    indicates, that a copy of the icon will be created.


    To create a new icon right-click a free space on your desktop. A menu pops up.


    Figure 2-8


    ![](img/8279afe915b153902294b0e58311b75a_33_0.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'At the top of the pop-up menu, there are three entries to create a new item:


    +   - **Create Folder.** Creates a new and empty folder icon.

    +   When the icon appears you can enter the folder''s name.


    # Figure 2-9


