- pgno: 17
  md: "# Exercise Conventions\n\nWhen working through an exercise, you will see conventions\
    \ that indicate information you need to enter that is specific to your server.\n\
    \nThe following describes the most common conventions:\n\n+   - *italicized/bolded\
    \ text*. This is a reference to your unique situation, such as the host name of\
    \ your server.\n+   \n+     For example, if the host name of your server is DA50,\
    \ and you see the following,\n+   \n+     *hostname.digitalairlines.com*\n+  \
    \ \n+     you would enter\n+   \n+     DA50.digitalairlines.com\n\n+   - **10.0.0.xx**.\
    \ This is the IP address that is assigned to your SUSE Linux Enterprise Server\
    \ 10 server.\n+   \n+     For example, if your IP address is 10.0.0.50, and you\
    \ see the following\n+   \n+     **10.0.0.xx**\n+   \n+     you would enter\n\
    +   \n+     **10.0.0.50**\n\n+   - **Select**. The word *select* is used in exercise\
    \ steps to indicate a variety of actions including clicking a button on the interface\
    \ and selecting a menu item.\n\n+   - **Enter and Type**. The words *enter* and\
    \ *type* have distinct meanings.\n+   \n+     The word *enter* means to type text\
    \ in a field or at a command line and press the Enter key when necessary. The\
    \ word *type* means to type text without pressing the Enter key.\n+   \n+    \
    \ If you are directed to type a value, make sure you do not press the Enter key\
    \ or you might activate a process that you are not ready to start."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# SECTION 1 Installation of SUSE Linux Enterprise Server 10


    There are little changes in the installation process of SUSE Linux Enterprise
    Server 9 to SUSE Linux Enterprise Server 10.


    In SUSE Linux Enterprise Server 9 the default authentication method was using
    an LDAP server. On SUSE Linux Enterprise Server 10 it is local authentication
    using the file /etc/passwd.


    Another new feature is the Novell Customer Center.


    # Objective


    +   1. Understand the Novell Customer Center Configuration and Online Update'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Objective 1


    # Understand the Novell Customer Center Configuration and Online Update


    If the Internet connection test was successful, you can configure the Novell Customer
    Center, which is required to perform an online update. If there are any update
    packages available on the SUSE update servers, you can download and install them
    to fix known bugs or security issues.


    # Figure 1-1


    ![](img/8279afe915b153902294b0e58311b75a_19_0.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Selecting **Next** starts a Browser and connects to the Novell web site, where
    all you have to enter is your e-mail address, and an activation code, if available.


    # Figure 1-2


    ![](img/8279afe915b153902294b0e58311b75a_20_0.png)


    After successful registration, the Online Update dialog opens. You can start the
    Online Update by selecting **Run Update** and **Next**.

    (You can also select **Skip Update** to perform the update later in the installed
    system.)'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'YaST''s online update dialog opens up with a list of available patches (if
    any).


    # Figure 1-3


    ![](img/8279afe915b153902294b0e58311b75a_21_0.png)


    Select the patches you want to install, and then start the update process by selecting
    Accept.


    Once the installation is complete, visit the Novell Customer Center at http://www.novell.com/center/
    to administer your Novell products and subscriptions.


    > In the Filter pull-down menu of the software selection dialog there is an item
    Patterns. This filter displays all software that is available on the known installation
    media. It is grouped in predefined sets of packages that logically belong together.
    In SUSE Linux Enterprise Server 10 this item was labeled Selections.'
  merge: -1
  img_proc: true
