- pgno: 320
  md: '# SECTION 14 AppArmor


    Novell AppArmor is a mandatory access control scheme that lets you specify on
    a per program basis which files the program may read, write, and execute.


    AppArmor secures applications by enforcing good application behavior without relying
    on attack signatures, so it can prevent attacks even if the attacks are exploiting
    previously unknown vulnerabilities.


    # Objectives


    +   1. Improve Application Security with AppArmor

    +   2. Create and Manage AppArmor Profiles

    +   3. Control AppArmor

    +   4. Monitor AppArmor'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Objective 1


    # Improve Application Security with AppArmor


    While you can keep your software up to date, you can still be hit with an attack
    that exploits a vulnerability that is not yet known or for which there is no fix
    yet.


    The idea of AppArmor is to have the kernel limit what a software program can do.
    In addition to the limitations set by the usual user and group permissions, limitations
    are imposed based on a set of rules for a specific program.


    Often an intruder does not directly gain root privileges. By exploiting a vulnerability
    in, for instance, a web server, she might be able to start a shell as the user
    running the web server. With that unprivileged access, she exploits yet another
    vulnerability in some other software program to gain root access.


    With AppArmor, even if an intruder manages to find a vulnerability in some server
    software, the damage is limited due to the fact that the intruder may not access
    any files or execute any programs beyond what the application is allowed by AppArmor’s
    rule set to access or execute in routine operation.


    This concept is not limited to normal accounts; it also limits to a certain extent
    what an application running with root privileges may do. A confined process cannot
    call certain system calls, even if running as root. Thus even if an attacker gained
    root privileges, she would still be limited in what she might be able to do.


    The AppArmor kernel modules (apparmor and aamatch_pcre) hook into the Linux Security
    Modules Framework of the kernel.


    Profiles in /etc/apparmor.d/ are used to configure which application may access
    and execute which files.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'AppArmor has to be activated before the applications it controls are started.
    Applications already running when AppArmor is activated are not controlled by
    AppArmor, even if a profile has been created for them. Therefore, AppArmor is
    activated early in the boot process by /etc/init.d/boot.apparmor.


    In a default installation of SUSE Linux Enterprise Server 10, AppArmor is actively
    protecting several services using a set of profiles provided by Novell. Using
    the provided YaST modules or command line tools, you can easily adapt these to
    your needs and create new profiles for additional applications you want to protect.


    As a general rule, you should confine programs that grant privilege, i.e., programs
    that have access to resources that the person using the program does not have:


    +   - Network agents—programs that have open network ports

    +   - Cron jobs

    +   - Web applications


    At some points in the documentation of AppArmor you will find AppArmor''s former
    name, Subdomain.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Objective 2 Create and Manage AppArmor Profiles


    SUSE Linux Enterprise Server 10 comes with AppArmor Profiles for various applications,
    such as named, ntpd, nscd, and others.


    The profiles are contained in /etc/apparmor.d/. The filename of the profile represents
    the filename of the application including the path, with "/" being replaced by
    a "_". The profile for /usr/sbin/squid would be contained in /etc/apparmor.d/usr.sbin.squid.


    A profile can include other files with an #include statement. The directory /etc/apparmor/abstractions/
    contains several files that are intended to be included in profiles, depending
    on the kind of program to be protected by AppArmor. There are abstractions for
    files that should be readable or writable by all programs (base), for nameservice-related
    files like /etc/passwd (nameservice), for files related to console operations
    (console), and others.


    The profiles are plain text files and it is therefore possible to create and modify
    them with any text editor. However, command line tools as well as a YaST module
    greatly simplify the process of creating profiles.


    In addition to the active profiles in /etc/apparmor.d/, several profiles are already
    prepared in /etc/apparmor/profiles/extras/ that you can customize to your needs
    and copy to /etc/apparmor.d/ to activate them.


    To successfully administer AppArmor, you need to


    +   - Understand Profiles and Rules

    +   - Administer AppArmor Profiles with YaST

    +   - Administer AppArmor Profiles with Command Line Tools'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Understand Profiles and Rules\n\nNovell AppArmor profiles contain two types\
    \ of AppArmor rules: path entries and capability entries. Path entries specify\
    \ what a process can access in the file system. AppArmor, by default, limits the\
    \ capabilities a process is given (see man apparmor). Capability entries are used\
    \ to specify specific POSIX capabilities (man 7 capabilities) a process is granted,\
    \ overriding the default limitation.\n\nOther files containing AppArmor rules\
    \ can be pulled in with #include statements.\n\nAs an example, let's have a look\
    \ at the profile for /sbin/klogd, the kernel log daemon (/etc/apparmor.d/sbin.klogd):\n\
    \n```\n# Profile for /sbin/klogd\n#include <tunables/global>\n\n/sbin/klogd {\n\
    \    #include <abstracts/base>\n    capability sys_admin,\n    /boot/System.map*\
    \ r,\n    /proc/kmsg r,\n    /sbin/klogd rmix,\n    /var/log/boot.msg rw,\n  \
    \  /var/run/klogd.pid rw,\n}\n```\n\nComments (as in line1) start with a # sign,\n\
    \n#include (as in line 3 and 6) is not interpreted as a comment, but is used to\
    \ include rules from other files. The path as given above is relative to /etc/apparmor.d/.\n\
    \n/etc/apparmor.d/tunables/global (line 3) is used to include definitions that\
    \ should be available in every profile. By default, it just includes /etc/apparmor.d/tunables/home,\
    \ which defines the variables @{HOMEDIRS} and @{HOME}. These variables are used\
    \ in various profiles."
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The directory /etc/apparmor.d/abstractions/ contains files with general rules
    grouped by common application tasks. These include, for instance, access to files
    all applications need (base), access to authentication mechanisms (authentication),
    graphics environments (kde, gnome), name resolution (nameservice), and others.
    Instead of having these redundantly specified in several profiles, they are defined
    at one point and included in the profiles that need them.


    Line 5 in the example above gives the absolute path to the program confined by
    AppArmor. The rules as well as any includes follow within the curly braces {}.


    Line 8 enables the capability sys_admin for this program. Any other capabilities
    needed would be listed in separate lines starting with capability.


    The remaining lines list files and directories, and the access permission granted.


    Within lines listing files and directories, the following wildcards can be used:


    +   - *. Substitutes any number of characters, except /.

    +   - **. Substitutes any number of characters, including /. Use ** to include
    subdirectories.

    +   - ?. Substitutes any single character, except /.

    +   - [abc]. Substitutes a, b, or c.

    +   - [a-d]. Substitutes a, b, c, or d.

    +   - {ab,cd}. Substitutes either ab or cd.


    The permissions granted can be


    +   - r. Allows the program to have read access to the resource. Read access is
    required for scripts, and an executing process needs this permission to allow
    it to dump core or to be attached to with ptrace.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   - **w.** Allows the program to have write access to the resource. Files
    must have this permission if they are to be unlinked (removed).

    +   - **l.** Link mode mediates access to symlinks and hardlinks and grants the
    privilege to unlink (remove) files.

    +   - **m.** Allow executable mapping. This mode allows a file to be mapped into
    memory using mmap(2)''s PROT_EXEC flag. This flag marks the pages executable;
    it is used on some architectures to provide non-executable data pages, which can
    complicate exploit attempts. AppArmor uses this mode to limit which files a well-behaved
    program (or all programs on architectures that enforce non-executable memory access
    controls) may use as libraries, to limit the effect of invalid -L flags given
    to ld(1) and LD_PRELOAD, LD_LIBRARY_PATH, given to ld.so(8).

    +   - **ix.** Inherit Execute Mode. The executed resource inherits the current
    profile.

    +   - **px.** Discrete Profile Execute Mode. This mode requires that a profile
    be defined for the resource executed. If there is no profile defined, access is
    denied.

    +   - **Px.** Discrete Profile execute mode -- scrub the environment. Px allows
    the named program to run in px mode, but AppArmor will invoke the Linux Kernel''s
    unsafe_exec routines to scrub the environment, similar to setuid programs. (See
    man 8 ld.so for some information on setuid/setgid environment scrubbing.)

    +   - **ux.** Unconstrained Execute Mode. Allows the program to execute the resource
    without any Novell AppArmor profile being applied to the executed resource. *This
    should only be used in rare exceptions.*

    +   - **Ux.** Unconstrained execute -- scrub the environment. As ux, it should
    only be used in rare exceptions.


    The last five, ix, px, Px, ux, and Ux, cannot be combined.


    The manual page covering the syntax of the profiles is

    **man 5 apparmor.d**'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Administer AppArmor Profiles with YaST


    The profile for /sbin/klogd, given in the example above, is a rather short profile.
    When you browse through the profiles in /etc/apparmor.d/ or /etc/apparmor/profiles/extras/
    you will see that these profiles can be much more complex.


    AppArmor comes with several tools that help to create and maintain AppArmor profiles.
    YaST modules exist that provide a graphical interface to those tools.


    You can accomplish various tasks with YaST:


    +   - Create a New Profile

    +   - Update a Profile

    +   - Delete a Profile


    # Create a New Profile


    To create a new profile, you can


    +   - Use the New Profile Wizard

    +   - Create a New Profile Manually


    # Use the New Profile Wizard


    There is a Wizard to create a new profile. Before calling the Wizard to profile
    an application, the first step is to stop the application you want to create a
    profile for.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'To access the Add Profile Wizard, start YaST and select Novell AppArmor:


    # Figure 14-1


    ![](img/8279afe915b153902294b0e58311b75a_328_0.png)


    Then select the Add Profile Wizard. The first step is to enter the application
    you want to profile:


    # Figure 14-2


    ![](img/8279afe915b153902294b0e58311b75a_328_1.png)


    If no path is given, the Wizard looks for the binary in the search path (variable
    $PATH).'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'The next dialog asks you to start and use the application you want to profile.
    Use the application in a way that you expect it to be used in production. For
    instance, if you are profiling a web server, access it in a way that you expect
    it to be accessed during normal operation. For a web browser, use it in a way
    you expect the users to access web content.


    During this learning phase, any access to files or capabilities needed by the
    application is granted as well as logged in the log file /var/log/audit/audit.log.
    Because any access is granted, you have to make sure that no attack can happen
    during this phase of profile creation. AppArmor does not yet protect your application.


    Once you feel you have gone through all expected uses of the application, select
    Scan system log for AppArmor events in the YaST AppArmor Profile Wizard dialog.


    For each event you are presented with a dialog where you can decide what should
    happen when this event occurs in the future. The dialog offers different options,
    depending on the event.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Figure 14-3


    In case of access to a program, the dialog looks similar to the following:


    ![](img/8279afe915b153902294b0e58311b75a_330_0.png)


    +   - Inherit. The executed resource inherits the current (parent''s) profile.


    +   - Profile. Requires that a specific profile exist for the executed program.


    +   - Unconfined. Executes the program without a security profile. Do not run
    unconfined unless absolutely necessary.


    +   - Deny. The execution of the program will be denied.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'In case of file access, the dialog offers different options:


    # Figure 14-4


    ![](img/8279afe915b153902294b0e58311b75a_331_0.png)


    The Add Profile Wizard suggests an access mode (r, w, l, or a combination of them).
    If more than one item appears in the list of files, directories, or #includes,
    select the radio button in front of the appropriate one, and then select one of
    these buttons:


    +   - Allow. Grants the program access to the specified directory path.


    +   - Deny. Prevents the program from accessing the specified file or directory.


    Sometimes the suggested files or directories do not fit your needs. In this case,
    you can modify them:


    +   - Glob. Selecting Glob once replaces the filename with an asterisk, including
    all files in the directory. Selecting Glob twice replaces the file and the directory
    it resides in by **, including all directories and files of that level in the
    directory tree. Selecting Glob again goes up one level in the path.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '+   - **Glob w/Ext.** Selecting Glob w/Ext once replaces the filename with
    an *, but retains the file name extension: text.txt becomes *.txt. Selecting Glob
    w/Ext twice replaces the file name and the directory it resides in by **, retaining
    the file name extension: /a/b/c/text.txt becomes /a/b/**/*.txt.

    +   - **Edit.** Enables editing of the highlighted line. The new (edited) line
    appears at the bottom of the list.


    After you have modified the line, select Allow or Deny. Go through each learning
    mode entry in this way.


    Once all entries have been processed, you are returned to the AppArmor Profile
    Wizard dialog that asked you to run the application. You can run the application
    again, and then run through any additional entries generated by this.


    Once you conclude you are done, select **Finish**. The profile is written and
    activated.


    If you want to discard your selections, select **Abort**.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Create a New Profile Manually


    When selecting YaST > Novell AppArmor > Manually Add Profile, you are prompted
    to select a file for which you want to create a profile. Subsequently the AppArmor
    Profile Dialog opens. There you can Add, Edit, and Delete entries to the profile
    by selecting the respective buttons.


    Figure 14-5


    ![](img/8279afe915b153902294b0e58311b75a_333_0.png)


    The advantage of the YaST module is its syntax check. However, you can also use
    any text editor, like vi, to create and edit profiles.


    # Update a Profile


    To update a profile, you have two choices:


    +   - Run the Add Profile Wizard Again

    +   - Run the Update Profile Wizard'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Run the Add Profile Wizard Again


    When you run the Add Profile Wizard on a program for which a profile already exists,
    the profiling does not start from scratch, but uses the existing profile as a
    basis.


    You go through the same steps as if generating a new profile, but most likely
    you will have to answer fewer questions than on the first run.


    This method is suitable to update a specific profile, especially for client applications
    that run a finite amount of time.


    # Run the Update Profile Wizard


    When you want to update several profiles, or profiles for applications that run
    over a longer period of time, using the Update Profile Wizard is the better choice.


    Even though the Update Profile Wizard is a YaST module, you may need to take some
    preparatory steps with command line tools.


    The first step is to decide which application profiles you want to update, and
    to put AppArmor into complain (also called learning) mode with regard to these
    applications. (If there is no profile yet for an application you want to profile,
    you have to create one first, using autodep program.)


    The command complain is used to activate learning or complain mode. You can either
    use the program or the profile as the argument: For instance, both, complain firefox
    and complain /etc/apparmor.d/usr.lib.firefox.firefox.sh work to change AppArmor
    to learning mode for Firefox.


    If you want to turn on learning mode for all applications confined by AppArmor,
    use complain /etc/apparmor.d/*.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'In profiles that are in complain mode, the path to the application being confined
    is followed by flags=(complain):


    ```

    # Profile for /sbin/klogd


    #include <tunables/global>


    /sbin/klogd flags=(complain){

    ...

    }

    ```


    Then actually use your application(s) to create events in the log file.


    The next step is to start the Update Profile Wizard by starting YaST and selecting
    Novell AppArmor > Update Profile Wizard:


    # Figure 14-6


    ![](img/8279afe915b153902294b0e58311b75a_335_0.png)


    The interface is almost identical to the Add Profile Wizard interface; also the
    choices you are presented do not differ.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'However, as you are updating different profiles, you have to pay special attention
    to the profile in the first line to be sure that your decision on allowing or
    denying fits the respective profile.


    Once the log file has been processed, select Finish. The profiles will be reloaded,
    but AppArmor is still in complain mode.


    To have AppArmor again enforce the rules, use the command enforce, which has the
    same syntax as complain:

    enforce /etc/apparmor.d/* puts all profiles in enforce mode.


    # Delete a Profile


    To delete a profile, start YaST and select Novell AppArmor > Delete Profile. Select
    the profile to delete; then select Next. After you select Yes in the confirmation
    dialog, the profile is deleted and the application is no longer confined by AppArmor.


    # Administer AppArmor Profiles with Command Line Tools


    There are various tools to create and maintain AppArmor profiles.

    These are


    +   - autodep

    +   - genprof

    +   - logprof

    +   - vim


    # autodep


    autodep generates a profile skeleton for a program and loads into the Novell AppArmor
    module in complain mode.


    The syntax is autodep program1 program2 ...'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# genprof


    genprof (Generate Profile) is used to create a profile for an application. Stop
    the application you want to create a profile for before running genprof.


    genprof runs autodep on the specified program if there is no profile yet, puts
    the new or already existing profile in complain mode, marks the log file, and
    prompts the user to start the program to profile and to exercise its functionality.


    ```

    dal0:~ # genprof firefox

    Setting /usr/lib/firefox/firefox.sh to complain mode.


    Please start the application to be profiled in

    another window and exercise its functionality now.


    Once completed, select the "Scan" button below in

    order to scan the system logs for AppArmor events.


    For each AppArmor event, you will be given the

    opportunity to choose whether the access should be

    allowed or denied.


    Profiling: /usr/lib/firefox/firefox.sh


    [(S)can system log for SubDomain events] / (F)inish

    ```


    Once the user has done that and presses s in the terminal window where genprof
    is running, genprof calls logprof to run against the system log from where it
    was marked when genprof was started.'
