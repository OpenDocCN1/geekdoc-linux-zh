- pgno: 169
  md: 'The following interface naming schema is used in domain0:


    +   - **peth**. These are physical interfaces in domain0. peth devices are connected
    to the network bridge.

    +   - **vif**. These are virtual interfaces which are part of the bridge. The
    name of a vif interface identifies to which domain this interface is connected
    to. **For example: vif6.0 is connected to the first virtual interface in domain
    6.**

    +   - **veth**. These virtual interfaces are connected to the vif interfaces of
    domain0 (vif0.x). By default 7 vif <-> veth pairs are created. The veth interfaces
    can be used for more complex network setups.

    +   - **eth0**. The first veth interface is named eth0 and connected with vif0.0.
    This is the "default" network interface of domain0.

    +   - **xenbr0**. This is the default bridge that connects virtual and physical
    interfaces.


    The following illustration gives you an overview of the interfaces in domain0.


    # Figure 8-11


    ![](img/8279afe915b153902294b0e58311b75a_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'You can use the command brctl show in domain0, to see which interfaces have
    been added to the network bridge.


    Due to the complexity of the Xen network setup, the default firewall (SuSEFirewall2)
    is not working correctly in domain0. It is therefore recommended to disable SuSEFirewall2
    and to setup a customized firewall if needed.


    ![](img/8279afe915b153902294b0e58311b75a_170_0.png)'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Exercise 8-5    Check the Network Configuration


    This exercise assumes that you have a Xen system with domain 0 and one more Xen
    domain running.


    Do the following:


    +   1. Open a terminal window and su - to the root user.


    +   2. Make sure that the domain vm1 is running by typing the command xm list.


    +   3. In the output of the xm command, note the ID of the domain vm1.


    +   4. View the network bridge configuration with the command brctl show.


    +   5. You should see the configuration of the bridge xenbr0. The interfaces peth0
    (physical interface) vif0.0 (virtual interface of domain 0) and the virtual interface
    vifx.0 (where x is the domain ID of domain vm1) should be added to the bridge.


    +   6. Shutdown the domain with the command xm shutdown vm1.


    +   7. Wait a moment and control with the command xm list if the domain has been
    shut down. Continue with next step when the domain vm1 is not listed anymore.


    +   8. Enter the command brctl show again. Note that the inerface of the domain
    vm1 has been removed from the bridge.


    +   9. Restart the domain with: xm create -f /etc/xen/vm/vm1


    +   10. Note the ID of vm1 and check with brctl show if the interface of vm1 has
    been added again.


    (End of Exercise)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Objective 7 Migrate a Guest Domain


    One advantage of virtualization is that domains can easily be moved from one physical
    system to another. Under Xen this procedure is called a domain migration.


    A domain migration is performed by copying the current memory content. Please
    note the following before migrating a domain:


    +   - There is no automatic way to copy the mass storage devices of a domain to
    another system. You have to make sure that the file systems (file system images
    or physical partitions) are available on the current and on the new host system.
    This can either be done by copying the data manually or by using a distributed
    file system (like NFS or SAN/NAS storage solutions).


    +   - When a domain is migrated, the network settings are not automatically adjusted.
    Therfore the current and the new host system have to be in the same subnet or
    the network settings have to be manually adjusted after the migration.


    You have the following two options to migrate a Xen domain:


    +   - Use Domain Save and Restore


    +   - Use Migration and Live Migration


    # Use Domain Save and Restore


    A very simple way to migrate a domain is to use the save and restore function
    of the xm tool.


    With the command xm save <domain_id> <filename>, you can suspend the specified
    domain and save the status to the given filename.


    This file can then be copied to the new host system. To restore the domain, use
    the command xm restore <filename>.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'As mentioned above, besides the file created with xm, you might also have to
    copy the filesystems to the new host system.


    # Use Migration and Live Migration


    Instead of the save and restore commands of xm, you can also use the command xm
    migrate <domain_id> <target_host>. This command migrates a domain directly to
    a new host. In this case it’s not necessary to copy memory state files manually.


    In order to get this working, the current and new host must be running Xen and
    xend.


    By adding the option --live to the migration command line, the downtime during
    the migration can be reduced to typically 60-300ms. Instead of shutting down the
    domain before the migration starts, Xen attempts to keep it running while the
    migration is in progress.


    The xend configuration file /etc/xen/xend-config.sxp contains two options concerning
    domain migration:


    (xend-relocation-server yes)


    This option enables the migrating functionality in xend.


    (xend-relocation-hosts-allow "^localhost$")


    This option controls which hosts are allowed to connetc to xend for domain migration.
    By default, only localhost is allowed to connect. The option takes regular expressions
    as parameter. Have a look at the configuration file for examples.


    > Please note, that there are two xend involved in a domain migration (current
    and new host). You might have to adjust the xend-config.sxp file on both systems.'
  merge: -1
  img_proc: true
