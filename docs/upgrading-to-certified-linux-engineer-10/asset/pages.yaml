- pgno: 179
  md: '# Objective 1 Create a Key for Zone Transfer


    To create a key, use the dnssec-keygen command. The file name of the key is printed
    on the screen:


    ```

    da51:/var/lib/named # dnssec-keygen -a HMAC-MD5 -b 128 -n HOST Kzonetransfer.+157+01389

    ```


    The options are explained in the following table:


    # Table 9-1


    | Option | Description |

    |--------|-------------|

    |-a HMAC-MD5 | The encryption procedure used (here HMAC-MD5)|

    |-b 128 | The length of the key (in the example, 128 bits)|

    |-n HOST | The type of key|

    |zonetransfer | Name of key|


    If you use this command, two files are created in the current directory:


    ```

    da51:/var/lib/named # ls -l *

    -rw------- 1 root root 56 Feb 21 10:39 Kzonetransfer.+157+01389.key

    -rw------- 1 root root 81 Feb 21 10:39 Kzonetransfer.+157+01389.private

    ```


    +   - The * key file contains a DNS KEY record that can be included in a zone
    include statement.

    +   - The * private file contains algorithm specific fields. For security reasons,
    this file does not have general read permission.'
