  md: '# SECTION 11 Manage OpenLDAP


    OpenLDAP is the most popular open source LDAP suite. It provides not only the
    LDAP server itself, but also applications and tools to control and query the server
    and to develop LDAP-based software.


    # Objectives


    +   1. Install and Set Up an OpenLDAP Server

    +   2. Activate LDAP Authentication

    +   3. Replicate OpenLDAP Servers'
