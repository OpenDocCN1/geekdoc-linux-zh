- pgno: 68
  md: '# Objective 7 Use the hwup Command


    The command hwup is used by udev to load driver modules and to initialize devices.
    In this objective, you learn how to use this command and how to interpret the
    corresponding configuration files.


    To start a device, hwup is called with a hardware description as argument. The
    hardware description is a unique identifier for a specific device in the system.
    The following is an example hwup command line:


    ```

    hwup bus-pci-0000:02:08.0

    ```


    The device description consists of the following components:


    +   - **bus.** This determines that the device is identified by the bus it is
    connected to.

    +   - **pci.** This indicates that the device is connected to the PCI bus.

    +   - **0000:02:08.0.** This is the address of the device in the PCI bus.


    You can display the PCI address of a device with the lspci command, as in the
    following example:


    ```

    ...

    0000:02:08.0 Ethernet controller: Intel Corp. 82801BD

    PRO/100 VE (LOM) Ethernet Controller (rev 81)

    ...

    ```


    As you can see, with the command hwup bus-pci-0000:02:08.0, the ethernet controller
    with the PCI adress 0000:02:08.0 would be started.


    The command hwdown <hardware_description> can be used to stop a device. hwdown
    is a link to hwup and not a separate command.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'hwdown unbinds a device from it''s driver, but does not unload the driver module
    automatically.


    There are two different ways how hwup gets information about devices and about
    the driver that needs to be loaded for a device:


    +   - From Configuration Files

    +   - From sysfs


    # From Configuration Files


    When a device needs to be initialized, hwup first tries to read a device configuration
    from files in the directory

    /etc/sysconfig/hardware/.


    In order to determine the correct configuration file, the configuration filenames
    follow a specific naming scheme.


    The following is the filename for a PCI network adapter:


    ```

    hwcfg-bus-pci-0000:02:08.0

    ```


    The filename consists of the keyword hwcfg and the hardware description of a device.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The following lists the possible variables in a device configuration file:


    # Table 3-1


    | Variable | Description |

    |---|---|

    | STARTMODE | This determines when and how a device will be started:

    - **auto.** The device is automatically started at boot time or by udev when the
    device is connected to the system.

    - **manual.** The device should not be started automatically, but it can be started
    manually.

    - **off.** The device should never be started. |

    | MODULE | The value of this variable determines the name of the kernel module
    that should be loaded for the device.

    If multiple modules have to be loaded, you can use this variable multiple times
    with any suffix appended.

    You must then use the same suffixes for multiple MODULE_OPTIONS variables.

    Example:

    **MODULE_A="foo"**

    **MODULE_B="bar"**

    **MODULE_OPTIONS_A="foo-opt"**

    **MODULE_OPTIONS_B="bar-opt1=x yz"** |

    | MODULE_OPTIONS | With this variable, options can be passed to the kernel module.
    |'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# (continued) Table 3-1


    | Variable | Description |

    |---|---|

    | SCRIPT{UP,DOWN}_[type] | This specifies the script to be called for initialization
    and deconfiguration of a specific device type.


    This script is called if the type of the device to be initialized matches the
    type given in this parameter. |

    | SCRIPT{UP,DOWN} | This specifies the script to be called for initialization
    and deconfiguration of the device.


    It will be called only if no matching type-specific scripts are configured. |


    The following is an example of a configuration file for a network adapter:


    ```

    MODULE=''e100''

    MODULE_OPTIONS=''''

    STARTMODE=''auto''

    ```


    The module e100 is loaded, there are no options for this modul and the device
    is started automatically at boot time.


    The hwup command is usually called by udev, but you can also use it manually.
    For example, the following command starts the network card shown in the previous:


    ```

    hwup bus-pci-0000:02:08.0

    ```


    The last 3 elements of the configuration filename specify the device.


    You can use the command hwdown to deconfigure devices, as in the following:


    ```

    hwdown bus-pci-0000:02:08.0

    ```'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# From sysfs


    When there is no configuration file for a device under /etc/hardware, hwup uses
    sysfs to find out more about the required driver.


    In the file /sys/bus/devices/<pci_device_id>/modalias a unique id for a device
    can be found. The following is the content of the file modalias for a network
    adapter:


    ```

    pci:v00008086d00001039sv00001734sd00001001bc02sc00i00 ....

    ```


    Now udev calls the command modprobe and uses the modalias is as parameter.


    The file /lib/modules/<kernel_version>/modules.aliases contains a list with modalias
    IDs and their corresponding kernel driver modules. The information about which
    driver module handles which modalias ID is included in the source files of the
    modules. The command depmod is used to extract the information from the modules
    and to write them into the file modules.aliases.


    Therefore you can consider the file modules.aliases as a kind of driver database,
    which is used to find out, which device is handled by which driver.


    When called from udev with the modalias parameter, modprobe looks for the driver
    in modules.aliases and load the associated driver.


    To prevent udev/hwup/modprobe from loading a driver automatically in the described
    way, a driver can be entered in the file /etc/modprobe.d/blacklist. By default
    the ALSA sound drivers are for example entered here, because these drivers are
    loaded by the ALSA init script (alsasound).'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Exercise 3-3 Explore Hardware Initialization


    In this exercise, you learn how to shutdown a device with hwdown and how to start
    it again manually. The exercise consists of the following parts:


    +   - Part I: Stop the Ethernet Adapter with hwdown

    +   - Part II: Unload the Driver Module

    +   - Part III: Load the Driver Module with a modalias


    # Part I: Stop the Ethernet Adapter with hwdown


    Do the following:


    +   1. Open a terminal window and su- to the root user.

    +   2. Enter the command ip a. You should see a list with your network interfaces.
    (At least eth0).

    +   3. Enter the command lspci.

    +   4. Look for a device with the description Ethernet controller and note the
    PCI ID of this device bellow this step. If you have more than one ethernet adapter,
    choose the first one

    +   5. Enter the command:

    +      hwdown bus-pci-0000:<network_adapter_pci_id>

    +   6. Enter the command ip a again. The interface of the device which has been
    shutdown with hwdown should not be visible anymore.


    # Part II: Unload the Driver Module


    +   1. Change into the directory /etc/sysconfig/hardware/.'
