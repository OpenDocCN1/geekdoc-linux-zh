- pgno: 346
  md: '# Objective 3 Control AppArmor


    AppArmor can be controlled using the script **/etc/init.d/boot.apparmor** or the
    link to this script, **/sbin/rcapparmor**. This script takes the usual parameters
    start, stop, etc. but because AppArmor is not a daemon, their significance is
    slightly different.


    To control AppArmor, you have to know how to


    +   - Start and Stop AppArmor

    +   - View AppArmor''s Status

    +   - Reload Profiles


    # Start and Stop AppArmor


    To confine an application, AppArmor has to be active before the application starts.
    Therefore, AppArmor is usually activated early in the boot process.


    If you do not want AppArmor to confine your applications any longer, use **rcapparmor
    stop**. This unloads the profiles, but the AppArmor kernel modules apparmor and
    aamatch_pcre remain loaded. **rcapparmor kill** unloads the kernel modules as
    well. In both cases, applications are no longer confined.


    **rcapparmor start** activates AppArmor. However, only applications started after
    the activation of AppArmor are confined. Even if, for instance, a profile for
    Squid exists, Squid will not be confined if it was already running before you
    started AppArmor. To include Squid in AppArmor''s protection, you need to restart
    Squid after activating AppArmor.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# View AppArmor''s Status


    rcapparmor status gives you a general overview of profiles and processes:


    ```

    dal0:~# rcapparmor status

    apparmor module is loaded.

    50 profiles are loaded.

    49 profiles are in enforce mode.

    1 profiles are in complain mode.

    Out of 69 processes running:

    5 processes have profiles defined.

    5 processes have profiles in enforce mode.

    0 processes have profiles in complain mode.

    ```


    To emphasize the point that, after restarting AppArmor, processes need to be restarted
    to be again confined, have a look at the following:


    ```

    dal0:~# rcapparmor stop

    Unloading AppArmor profiles                     done

    dal0:~# rcapparmor start

    Loading AppArmor profiles                       done

    dal0:~# rcapparmor status

    apparmor module is loaded.

    50 profiles are loaded.

    49 profiles are in enforce mode.

    1 profiles are in complain mode.

    Out of 62 processes running:

    0 processes have profiles defined.

    0 processes have profiles in enforce mode.

    0 processes have profiles in complain mode.

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'Restarting one of the processes for which there is a profile changes the output
    of rcapparmor status:


    ```

    dal0:~# rcnscd restart

    Shutting down Name Service Cache Daemon          done

    Starting Name Service Cache Daemon               done

    dal0:~# rcapparmor status

    apparmor module is loaded.

    50 profiles are loaded.

    49 profiles are in enforce mode.

    1 profiles are in complain mode.

    Out of 62 processes running:

    1 processes have profiles defined.

    1 processes have profiles in enforce mode.

    0 processes have profiles in complain mode.

    ```


    The output of AppArmor does not contain specific data regarding the profiles or
    the processes being confined.


    A list of the profiles loaded is kept in /sys/kernel/security/apparmor/profiles.
    It might look like the following:


    ```

    dal0:~# cat /sys/kernel/security/apparmor/profiles

    /usr/sbin/traceroute (enforce)

    /usr/sbin/squid (enforce)

    /usr/sbin/sendmail (enforce)

    /usr/sbin/postqueue (enforce)

    ...

    /usr/lib/postfix/bounce (enforce)

    /usr/lib/firefox/firefox.sh (complain)

    /usr/bin/ld (enforce)

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'The command **unconfined** lists processes that have bound sockets but have
    no profiles loaded:


    ```

    dal0:~# unconfined

    2659 /sbin/portmap not confined

    2659 /sbin/portmap not confined

    2694 /usr/lib/zmd/zmd-bin not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2756 /usr/sbin/slpd not confined

    2831 /usr/sbin/cuped not confined

    2831 /usr/sbin/cuped not confined

    2874 /usr/sbin/sshd not confined

    2905 /usr/sbin/sshd not confined

    2905 /usr/sbin/sshd not confined

    3040 /usr/lib/postfix/master not confined

    3040 /usr/lib/postfix/master not confined

    ```


    This does not give information about processes with profiles that are not confined
    because they were running already when AppArmor was activated. To spot those,
    you would have to compare the output from ps with the content of /sys/kernel/security/profiles
    and restart any processes that should be confined.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Reload Profiles


    If you have changed profiles in /etc/apparmor.d/ manually with an editor (not
    by using the AppArmor tools like logprof), you have to reload the profile or profiles
    concerned. The command to use is rcapparmor reload. rcapparmor restart is equivalent
    to reload; it does not stop and then start AppArmor, but it does reload the profiles.
    Processes that were confined before rcapparmor reload was issued remain confined
    (unless you deleted their profile or changed their status from enforce to complain).


    The commands enforce and complain toggle the status from enforce to complain and
    vice versa, and reload the profiles concerned.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Objective 4 Monitor AppArmor


    There are two ways to monitor AppArmor:


    +   - Security Event Report

    +   - Security Event Notification


    # Security Event Report


    The YaST module to configure and view AppArmor security event reports can be launched
    by starting YaST and selecting Novel AppArmor > AppArmor Reports. It can also
    be launched directly from a console window as root by entering yast2 SD_Report.


    The dialog that opens up shows when security event reports are generated.


    ![](img/8279afe915b153902294b0e58311b75a_351_0.png)


    By default these are created once a day at midnight.'
