- pgno: 93
  md: '# Objective 1 Configure User Authentication with PAM


    User authentication plays a central role in IT security. Linux uses PAM (Pluggable
    Authentication Modules) in the authentication process as a layer between users
    and applications. A Linux system administrator can use these modules to configure
    the way programs should authenticate users.


    By providing system-wide access to applications through authentication modules,
    authentication does not have to be part of each application requiring authentication.
    The Pluggable Authentication Modules take care of that task for applications.


    For example, when a user logs into a Linux system on a virtual terminal, a program
    called login is usually involved in this process.


    Login requires a user''s login name and the password. The password is encrypted
    and then compared with the encrypted password stored in an authentication database.
    If the encrypted passwords are identical, login grants the user access to the
    system by starting the user''s login shell.


    If other authentication procedures are used, such as smart cards, all programs
    that perform user authentication must be able to work together with these smart
    cards. Before PAM was introduced all applications that handle authentication,
    like login, FTP, or SSH, had to be extended to support a smart card reader.


    PAM makes things easier. PAM creates a software level with clearly defined interfaces
    between applications (such as login) and the current authentication mechanism.
    Instead of modifying every program, a new PAM module can be enable authentication
    with a smart card reader. After adjusting the PAM configuration for an application
    this application can make use of this new authentication method.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Figure 6-1


    The following graphic illustrates the role of PAM:


    ![](img/8279afe915b153902294b0e58311b75a_94_0.png)


    Third party vendors can supply other PAM modules to enable specific authentication
    features for their products, such as the PAM modules that enable Novell’s Linux
    User Management (LUM) authentication with eDirectory.


    To understand how to configure PAM, you need to know the following:


    +   - Location and Purpose of PAM Configuration Files

    +   - PAM Configuration

    +   - PAM Configuration File Examples

    +   - Secure Password Guidlines

    +   - PAM Documentation Resources'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Location and Purpose of PAM Configuration Files


    PAM provides a variety of modules—each one with a different purpose. For example,
    one module checks the password, another verifies the location from which the system
    is accessed, and another reads user-specific settings.


    Every program that relies on the PAM modules has its own configuration file /etc/pam.d/program_name.
    For example, the configuration file for the program passwd is called /etc/pam.d/passwd.


    There is one special configuration file with the name other. This file contains
    the default configuration if no application-specific file is found.


    In addition, there are global configuration files for most PAM modules in /etc/security/,
    which define the exact behavior of these modules. These include files such as
    pam_env.conf, pam_pwcheck.conf, pam_unix2.conf, and time.conf.


    Every application that uses a PAM module actually calls a set of PAM functions.
    These functions are implemented in modules which perform the authentication process
    according to the information in the various configuration files and return the
    result to the calling application.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# PAM Configuration


    Each line in a PAM configuration file contains 3 columns plus optional arguments:


    Figure 6-2


    ![](img/8279afe915b153902294b0e58311b75a_96_0.png)


    The following describes the purpose of each column:


    +   - **Module Type.** There are four types of PAM modules:

    +     - **auth.** These modules provide two ways of authenticating the user.

    +       First, they establish that the user is who he claims to be by instructing
    the application to prompt the user for a password or other means of identification.

    +       Second, the module can grant group membership or other privileges through
    its credential granting properties.

    +     - **account.** These modules perform nonauthentication based account management.'
  merge: -1
  img_proc: true
- pgno: 97
  md: "They are typically used to restrict or permit access to a service based on\
    \ the time of day, currently available system resources (maximum number of users)\
    \ or perhaps the location of the applicant user (for example, to limit `root'\
    \ login to the console).\n\n+   session. These modules are associated with performing\
    \ tasks that need to be done for the user before she can be given access to a\
    \ service or after a service is provided to her.\n+   \n+   Such things include\
    \ logging information concerning the user, mounting directories and the opening\
    \ and closing of some data exchange with another user.\n\n+   password. This last\
    \ module type is required for updating the authentication token associated with\
    \ the user. Typically, there is one module for each challenge/response-based authentication\
    \ (auth) module type.\n\n# Control Flag. The control flag indicates how PAM will\
    \ react to the success or failure of the module it is associated with.\n\nSince\
    \ modules can be stacked (modules of the same type execute in a series, one after\
    \ another), the control-flags determine the relative importance of each module.\n\
    \nThe Linux-PAM library interprets these keywords in the following manner:\n\n\
    +   required. A module with this flag must be successfully processed before the\
    \ authentication can proceed.\n+   \n+   After the failure of a module with the\
    \ required flag, all other modules with the same flag are processed before the\
    \ user receives a message about the failure of the authentication attempt. This\
    \ prevents the user from knowing at what stage their authentication failed.\n\n\
    +   requisite. A module with this flag must also be processed successfully. In\
    \ case of success, other modules are subsequently processed, just like modules\
    \ with the required flag."
  merge: -1
  img_proc: true
- pgno: 98
  md: 'However, in case of failure the module gives immediate feedback to the user
    and no further modules are processed.


    You can use the requisite flag as a basic filter, checking for the existence of
    certain conditions that are essential for a correct authentication.


    +   - **optional.** The failure or success of a module with this flag does not
    have any direct consequences.

    +   You can use this flag for modules that are only intended to display a message
    (such as telling a user that mail has arrived) without taking any further action.


    +   - **sufficient.** After a module with this flag has been successfully processed,
    the calling application receives an immediate message about the success and no
    further modules are processed (provided there was no preceding failure of a module
    with the "required" flag).

    +   The failure of a module with the sufficient flag has no direct consequences.
    In other words, any subsequent modules are processed in their respective order.


    +   - **include.** This is not really a control flag but indicates that the keyword
    in the next column is to be interpreted as a file name relative to /etc/pam.d/
    that should be included at this point.

    +   The file included has to have the same structure as any other PAM configuration
    file.

    +   The purpose of **include** files is to simplify changes concerning several
    applications.


    +   - **Module.** The PAM modules are located in the directory `/lib/security/`.
    Every filename of a module starts with the prefix `pam_`. You do not need to include
    the path, as long as the module is located in the default directory `/lib/security/`.


    > For all 64 bit platforms supported by SUSE Linux, the default directory is /lib64/security/.


    ![](img/8279afe915b153902294b0e58311b75a_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: "Some PAM modules (such as pam_unix2.so) can be used for several module types\
    \ (for instance type auth as well as type password).\n\n+   Arguments (options).\
    \ You can include options in this column for the module, such as debug (enables\
    \ debugging) or nullok (allows the use of empty passwords).\n\n# PAM Configuration\
    \ File Examples\n\nThe following is the default configuration file for the login\
    \ program on SLES 10, /etc/pam.d/login:\n\n```\n#%PAM-1.0\nauth\trequired\tpam_securetty.so\n\
    auth\tinclude\tcommon-auth\nauth\trequired\tpam_nologin.so\naccount\tinclude\t\
    common-account\npassword\tinclude\tcommon-password\nsession\tinclude\tcommon-session\n\
    session\trequired\tpam_lastlog.so nowtmp\nsession\trequired\tpam_regrmgr.so\n\
    session\toptional\tpam_mail.so standard\n```\n\nAs an example of the files included\
    \ in the above configuration, the file /etc/pam.d/common-auth looks like this::\n\
    \n```\n#\n# /etc/pam.d/common-auth - authentication settings common to all services\n\
    #\n# This file is included from other service-specific PAM config files,\n# and\
    \ should contain a list of the authentication modules that define\n# the central\
    \ authentication scheme for use on the system\n# (e.g., /etc/shadow, LDAP, Kerberos,\
    \ etc.). The default is to use the\n# traditional Unix authentication mechanisms.\n\
    #\nauth\trequired\tpam_env.so\nauth\trequired\tpam_unix2.so\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: 'The modules perform the following tasks (not all are included in the above
    configuration):


    +   - **auth required pam_securetty.so**

    +     This module checks the file /etc/securetty for a list of valid login terminals.
    If a terminal is not listed in that file, the login is denied from that terminal.
    This concerns only the root user.

    +   - **auth required pam_env.so**

    +     This module can be used to set additional environment variables. The variables
    can be configured in the file /etc/security/pam_env.conf.

    +   - **auth required pam_unix2.so nullok**

    +     The module pam_unix2.so is used during the authentication process to validate
    the login and password provided by the user.

    +   - **auth required pam_nologin.so**

    +     This module checks whether a file /etc/nologin exists. If such a file is
    found, its content is displayed when a user tries to log in. Login is denied for
    all but the root user.

    +   - **account required pam_unix2.so**

    +     In this entry the pam_unix2.so module is used again, but in this case it
    checks whether the password of the user is still valid or if the user needs to
    create a new one.

    +   - **password required pam_pwcheck.so nullok**

    +     This is an entry for a module of the type password. It is used when a user
    attempts to change the password. In this case, the module pam_pwcheck.so is used
    to check if a new password is secure enough.

    +     The **nullok** argument allows users to change an empty password, otherwise
    empty passwords are treated as locked accounts.'
  merge: -1
  img_proc: true
- pgno: 101
  md: "+   - **password required pam_unix2.so nullok use_first_pass use_authtok**\n\
    +   \n+     The pam_unix2.so module is also necessary when changing a password.\
    \ It encrypts (or hashes, to be more exact) the new password, and writes it to\
    \ the authentication database.\n+   \n+     **nullok** has the same significance\
    \ as described above for pam_pwcheck.so. With the argument **use_first_pass**,\
    \ pam_unix2 uses the password from a previous module, for instance pam_pwcheck.so,\
    \ and aborts with an error if no authentication token from a previous module is\
    \ available. The argument **use_authtok** is used to force this module to set\
    \ the new password to the one provided by the previously stacked password module.\n\
    \n+   - **session required pam_unix2.so**\n+   \n+     Here the session component\
    \ of the pam_unix2.so module is used. Without arguments this module has no effect,\
    \ with the argument **trace** it uses the syslog daemon to log the user's login.\n\
    \n+   - **session required pam_limits.so**\n+   \n+     The pam_limits.so sets\
    \ resource limits for the users that can be configured in the file /etc/security/limits.conf.\n\
    \n+   - **session required pam_mail.so**\n+   \n+     This module displays a message\
    \ if any new mail is in the user's mail box. It also sets an environment variable\
    \ pointing to the user's mail directory."
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Secure Password Guidlines


    Even the best security setup for a system can be defeated if users choose easy
    to guess passwords. With today''s computing power, a simple password can be cracked
    within minutes.


    These attacks are also called *dictionary attacks*, as the password cracking program
    just tries one word after another from a dictionary file, including some common
    variations of these words.


    Therefore, a password should never be a word which could be found in a dictionary.
    A good, secure password should always contain numbers and uppercase characters.


    To check whether user passwords fulfill this requirement, you can enable a special
    PAM module to test a password first before a user can set it. The PAM module is
    called pam_pwcheck.so and uses the cracklib library to test the security of passwords.


    By default, this PAM module is enabled on SLES 10.


    If a user enters a password that is not secure enough, the following message is
    displayed:


    ```

    Bad password: too simple

    ```


    and the user is prompted to enter a different one.


    There are also dedicated password check programs available such as **John the
    Ripper** (http://www.openwall.com/john/).'
  merge: -1
  img_proc: true
- pgno: 103
