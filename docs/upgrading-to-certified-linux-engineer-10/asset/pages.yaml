- pgno: 10
  md: '# Introduction


    The Upgrading to Certified Linux Engineer 10 (3076) course is designed to provide
    information on the differences between SUSE Linux Enterprise Server version 9
    and version 10 related especially to the topics covered in the Novell Certified
    Linux Engineer (CLE) curriculum:


    +   - *SUSE Linux Enterprise Server 10 Fundamentals* (Course 3071)

    +   - *SUSE Linux Enterprise Server 10 Administration* (Course 3072)

    +   - *SUSE Linux Enterprise Server 10 Advanced Administration* (Course 3073)

    +   - *SUSE Linux Enterprise Server 10: Networking Services* (Course 3074)

    +   - *SUSE Linux Enterprise Server 10: Security* (Course 3075)


    You will learn about the new features as well as the changes in SUSE Linux Enterprise
    Server 10 compared to your existing knowledge as a Novell Certified Linux Engineer.


    The course is available as a learning module through the Internet, which takes
    approximately 8 hours to complete. In order to gain sufficient experience to take
    the new Novell Certified Linux Engineer 10 (CLE 10) Practicum Exam.


    Novell highly recommends that you register with one of the Novell Authorised Training
    Partners globally for an Upgrade Workshop. Based on this course the content is
    enriched with the option to take the new Practicum Exam at the end of the class.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Course Objectives


    This course teaches you the following concepts and skills to understanding the
    differences to SUSE Linux Enterprise Server 10:


    +   - Installation of SUSE Linux Enterprise Server 10

    +   - Use the GNOME Desktop Environment

    +   - Manage Hardware

    +   - Configure Linux File System Partitions

    +   - Use the NetworkManager to Configure the Network

    +   - Administer User Access and Security

    +   - Use Syslog Daemon syslog-ng

    +   - Manage Virtualization with Xen

    +   - Configure a DNS Server Using BIND

    +   - Configure DHCP Pools and Failover

    +   - Manage OpenLDAP

    +   - Configure a Mail Server

    +   - Apply Security

    +   - AppArmor


    # Audience


    This course is designed for Novell Certified Linux Engineers or those with equivalent
    knowledge. This course content combined with the Upgrade Workshops offered through
    Novell’s Training Partners globally is the ideal preparation in order to take
    the Novell Certified Linux Engineer 10 (CLE 10) Practicum Exam.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Certification and Prerequisites


    This course helps you prepare for the Novell Certified Linux Engineer (Novell
    CLE 10) Practical Test, called a practicum. The Novell CLE 10 is a higher-level
    certification for people who passed the Novell CLP Practicum.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLE 10 Practicum (050–698).


    The Novell CLP Practicum is a hands-on, scenario-based exam where you apply the
    knowledge you have learned to solve real-life problems—demonstrating that you
    know what to do and how to do it.


    The practicum tests you on objectives in the following Novell CLE 10 courses:


    +   - SUSE Linux Enterprise Server 10: Networking Services (Course 3074)

    +   - SUSE Linux Enterprise Server 10: Security (Course 3075)'
  merge: -1
  img_proc: true
