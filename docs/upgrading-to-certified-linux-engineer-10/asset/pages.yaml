    +   2. Log Out and Shut Down

    +   3. Identify GNOME Desktop Components

    +   4. Manage Icons in GNOME

    +   5. Use the GNOME File Manager (Nautilus)

    +   6. Search for Files

    +   7. Access the Command Line Interface From the Desktop'
  merge: -1
