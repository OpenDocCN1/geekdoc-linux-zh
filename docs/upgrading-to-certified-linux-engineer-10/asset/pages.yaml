  md: '# Part III - Configure the LDAP Client Server


    +   1. Stop your LDAP server by entering **rldap stop**.

    +   2. Open the file /etc/openldap/slapd.conf by entering **vi /etc/openldap/slapd.conf**

    +   3. Add the following lines **updatedn="uid=replicator,dc=digitalairlines,dc=com"**
    **updateref="ldap://master_ip"** *master_ip* is the IP address of your neighbor''s
    computer.

