- pgno: 46
  md: '# SECTION 3 Manage Hardware


    Although most hardware devices can be configured with YaST or are even automatically
    detected when plugged into the system, it is sometimes helpful to understand how
    things work in the background.


    In this section, you are introduced to the SUSE Linux Enterprise Server 10 hardware
    management and how device drivers are loaded.


    You also learn how to add and replace certain types of hardware.


    # Objectives


    +   1. Describe the Differences between Devices and Interfaces

    +   2. Describe how Device Drivers Work

    +   3. Describe how Device Drivers Are Loaded

    +   4. Manage Kernel Modules Manually

    +   5. Describe the sysfs File System

    +   6. Describe how udev Works

    +   7. Use the hwup Command'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Objective 1 Describe the Differences between Devices and Interfaces


    This objective uses the terms “device” and “interface.” These terms are often
    confused, not only by users and administrators but also by developers of operating
    systems and related tools.


    This course uses the following definitions for device and interface:


    +   - **Device.** A device is a real, physical piece of hardware. This can be
    a PCI network card, an AGP graphic adapter, a USB printer, or any kind of hardware
    that you can hold, feel, or break if you want to.

    +   - **Interface.** An interface is a software component associated with a device.
    To use a physical piece of hardware, it needs to be accessed by a software interface.


    A device can have more than one interface.


    Interfaces are usually created by a driver. In Linux, a driver is usually a software
    module that can be loaded into the Linux kernel. Therefore, a driver can be seen
    as the glue between a device and its interfaces.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Objective 2 Describe how Device Drivers Work


    As described before, device drivers access and use a device. There are 2 basic
    kinds of device drivers:


    +   - Kernel modules. The functionality of the Linux kernel can be extended by
    kernel modules. These modules can be loaded and removed during runtime. They allow
    the kernel to provide access to hardware.

    +   - User space drivers. Some hardware needs additional drivers that work in
    user space. Examples of this kind of hardware are printers or scanners.


    The following illustrates the roles of kernel and user space drivers:


    # Figure 3-1


    ![](img/8279afe915b153902294b0e58311b75a_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'While the handling of user space drivers depends on the framework they are
    used in, you can manage kernel modules with the following commands:


    +   - **lsmod.** This command lists all loaded kernel modules. For example:

    +     `lsmod`


    +   - **modprobe.** This command loads kernel modules. Because kernel modules
    can depend on each other, modprobe automatically resolves these dependencies and
    loads all required modules. For example:

    +     `modprobe usb-storage`

    +     In this example, modprobe loads the usb-storage module which is needed to
    access storage devices connected with the USB bus.

    +     Because this module requires other USB modules, modprobe also loads these
    modules.


    +   - **rmmod.** This command removes loaded kernel modules. For example:

    +     `rmmod usb-storage`

    +     Only modules that are not needed can be removed. In this example, the USB
    device first has to be disconnected before the usb-storage module can be removed.


    Kernel modules are files that are stored in the directory `/lib/modules/kernel-version/`.


    Because modules normally work only with the kernel version they are built for,
    a new directory is created for every kernel update you install.'
  merge: -1
  img_proc: true
- pgno: 50
  md: Modules are stored in several subdirectories with a filename extension of .ko
    for kernel object. When loading a module with modprobe, you can leave out the
    extension and use just the module name.
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Objective 3 Describe how Device Drivers Are Loaded


    Because it would be very inconvenient to load all kernel modules manually after
    every system start, there are several methods to perform this task automatically.


    The following is an overview of how device drivers are loaded in SUSE Linux Enterprise
    Server 10:


    +   - **initrd.** Important device drivers that are necessary to access the root
    partition are loaded from initrd. initrd is a special file that is loaded into
    memory by the boot loader. Examples of such modules are the SCSI host controller
    and file system drivers.


    +   - **initscripts.** Some initscripts are dedicated to loading and setting up
    hardware devices, such as the ALSA sound script for sound cards.


    +   - **udev.** udev also loads kernel modules with the hwup command.


    +   - **X Server.** Although the graphics card drivers are not kernel modules,
    X Server loads special drivers to enable hardware 3D support.


    +   - **manually.** You can always load kernel modules on the command line or
    in scripts with the modprobe command or with the hwup or hwdown commands.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Objective 4


    # Manage Kernel Modules Manually


    Although SUSE Linux Enterprise Server 10 initializes most hardware devices automatically,
    it can be very helpful to know how kernel modules are managed manually.


    To manage kernel modules, you need to understand the following:


    +   - Kernel Module Basics

    +   - Manage Modules from the Command Line

    +   - modprobe Configuration File (/etc/modprobe.conf)


    For the latest kernel documentation, see /usr/src/linux/Documentation.


    # Kernel Module Basics


    The kernel that is installed in the directory /boot/ is configured for a wide
    range of hardware. It is not necessary to compile a custom kernel, unless you
    want to test experimental features and drivers.


    Drivers and features of the Linux kernel can either be compiled into the kernel
    or be loaded as kernel modules. These modules can be loaded later, while the system
    is running, without having to reboot the computer.


    This is especially true of kernel modules that are not required to boot the system.
    By loading them as components after the system boots, the kernel can be kept relatively
    small.


    The kernel modules are located in the directory /lib/modules/version/kernel/.


    For example, the modules for the 2.6 kernel can be found in the following directory:


    ```

    /lib/modules/2.6.16-0.12-default/kernel/

    ```'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Manage Modules from the Command Line


    The following are commands you can use from a command line when working with modules:


    +   - **lsmod.** This command lists the currently loaded modules in the kernel.


    The following is an example:


    ```

    DAS50:~ # lsmod

    Module          Size  Used by

    quota_v2        12928  2

    edd             13720  0

    joydev          14528  0

    sg              41632  0

    st              44956  0

    sr_mod          21028  0

    ide_cd          42628  0

    cdrom           42780  2 sr_mod,ide_cd

    nvram           13448  0

    usbserial       35952  0

    parport_pc      41024  1

    lp              15364  0

    parport         44232  2 parport_pc,lp

    ipv6            275348  44

    uhci_hcd        25728  0

    intel_agp       22812  1

    agpgart         36140  1 intel_agp

    evdev           13952  0

    usbcore         116572  4 usbserial,uhci_hcd

    ```


    The list includes information about the module name, size of the module, how often
    the module is used, and by which other modules use it.


    +   - **insmod module.** This command loads the indicated *module* into the kernel.


    The module must be stored in the directory `/lib/modules/version_number/`. However,
    it is recommended to use modprobe for loading modules.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "+   - **rmmod module.** This command removes the indicated *module* from the\
    \ kernel. However, it can only be removed if no processes are accessing hardware\
    \ connected to it or corresponding services.\n+   \n+   We recommend that you\
    \ use `modprobe -r` for removing modules.\n+   - **modprobe module.** This command\
    \ loads the indicated *module* into the kernel or removes it (with option -r).\n\
    +   \n+   Dependencies of other modules are taken into account when using modprobe.\
    \ In addition, modprobe reads in the file `/etc/modprobe.conf` for any configuration\
    \ settings.\n+   \n+   This command can only be used if the file `/lib/modules/version/modules.dep`\
    \ created by the command depmod exists. This file is used to add or remove dependencies.\n\
    +   \n+   The kernel daemon (Kmod since kernel version 2.2.x) ensures that modules\
    \ needed in the running operation are automatically loaded using modprobe (such\
    \ as accessing the CD-ROM drive).\n+   \n+   For more detailed information, enter\
    \ man modprobe.\n+   - **depmod.** This command creates the file `/lib/modules/version/modules.dep`.\
    \ This file contains the dependencies of individual modules on each other.\n+\
    \   \n+   When a module is loaded (such as with modprobe), modules.dep ensures\
    \ that all modules it depends on are also loaded.\n+   \n+   If the file modules.dep\
    \ does not exist, it is created automatically when the system starts by the start\
    \ script `/etc/init.d/boot`. For this reason, you do not need to create the file\
    \ manually."
  merge: -1
  img_proc: true
- pgno: 55
  md: 'On SUSE Linux Enterprise Server 10, depmod also creates the file modules.aliases,
    which is used by hwup and modprobe to determine which driver needs to be loaded
    for which device. Learn more about this file in the hwup objective in this section.


    +   - **modinfo option module.** This command displays information (such as license,
    author, and description) about the module indicated on the command line.


    The following is an example:


    ```

    DAS0:~ # modinfo isdn

    license:        GPL

    author:         Fritz Elfert

    description:    ISDN4Linux: link layer

    depends:        slhc

    supported:      yes

    vermagic:       2.6.5-7.21-default 586 REGPARM gcc-3.3

    ```


    For more detailed information, enter **man modinfo**.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# modprobe Configuration File (/etc/modprobe.conf)\n\nThe file /etc/modprobe.conf\
    \ is the configuration file for the kernel modules. For example, it contains parameters\
    \ for the modules that access hardware directly.\n\nThe file plays an important\
    \ role in loading modules. Various command types can be found in the file, such\
    \ as the following:\n\n+   - **install.** These instructions let modprobe execute\
    \ commands when loading a specific module into the kernel.\n+   \n+     The following\
    \ is an example:\n+   \n+     `install eth0 /bin/true`\n\n+   - **alias.** These\
    \ instructions determine which kernel module will be loaded for a specific device\
    \ file.\n+   \n+     The following is an example:\n+   \n+     `alias eth0 nvnet`\n\
    \n+   - **options.** These instructions are options for loading a module.\n+ \
    \  \n+     The following is an example:\n+   \n+     `options ne io=0x300 irq=5`\n\
    \nFor more detailed information, enter man 5 modprobe.conf.\n\n![](img/8279afe915b153902294b0e58311b75a_56_0.png)"
  merge: -1
  img_proc: true
