    +   - **User ID Limitations.** Enter a minimum and maximum value to configure
    a range of possible user ID numbers. New users get a UID from within this range.

    +   - **Group ID Limitations.** Enter a minimum and maximum value to configure
    a range of possible group ID numbers.


    When you finish configuring user and group ID limitations, continue by selecting
    Next. The last page of the security configuration appears:


    # Figure 6-8


    ![](img/8279afe915b153902294b0e58311b75a_115_0.png)


