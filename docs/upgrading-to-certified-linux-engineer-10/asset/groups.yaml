    \ 产品、订阅和服务的订单历史\n- 新 SUSE Linux Enterprise 产品的授权可见性\n- Linux 订阅续订状态\n- 通过合作伙伴或\
    \ Novell 进行的订阅续订\n\n例如，一家公司可能有需要下载 SUSE Linux Enterprise 软件更新的管理员、希望查看订单历史的采购人员，以及需要核对许可的\
    \ IT 经理。借助 Novell 客户中心，公司可以在一个地方满足所有这些需求，并为每个用户分配适合其角色的访问权限。\n\n您可以在 http://www.novell.com/center\
    \ 访问 Novell 客户中心。\n\n## 练习约定\n\n在完成练习时，您会看到一些约定，用于指示需要输入的、特定于您服务器的信息。\n\n以下是最常见的约定：\n\
    \n- *斜体/粗体文本*。这是指您的独特情况，例如服务器的 host 名称。\n\n  例如，如果服务器的 host 名称是 DA50，并且您看到以下内容：\n\
    \n  *hostname.digitalairlines.com*\n\n  您应输入\n\n  DA50.digitalairlines.com\n\n\
    - **10.0.0.xx**。这是分配给您的 SUSE Linux Enterprise Server 10 服务器的 IP 地址。\n\n  例如，如果您的\
    \ IP 地址是 10.0.0.50，并且您看到以下内容：\n\n  **10.0.0.xx**\n\n  您应输入\n\n  **10.0.0.50**\n\
    \n- **选择**。单词 *select* 在练习步骤中用于表示各种操作，包括点击界面上的按钮和选择菜单项。\n\n- **输入和键入**。单词 *enter*\
    \ 和 *type* 具有不同的含义。\n\n  单词 *enter* 表示在字段或命令行中键入文本，并在必要时按 Enter 键。单词 *type* 表示键入文本但不按\
    \ Enter 键。\n\n  如果指示您键入一个值，请确保不要按 Enter 键，否则可能会启动您尚未准备开始的进程。\n\n"
