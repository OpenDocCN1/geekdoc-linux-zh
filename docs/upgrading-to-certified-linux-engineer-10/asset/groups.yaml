    \n## 练习 11-1 使用 YaST 设置 OpenLDAP\n\n在本练习中，你使用 YaST 设置 OpenLDAP 服务器和客户端。基本 DN 为“dc=digitalairlines,dc=com”，LDAP\
    \ 管理员的通用名称为“cn=Administrator,dc=digitalairlines,dc=com”，密码为“novel”。本练习中不使用 TLS/SSL。\n\
    \n执行以下操作：\n\n- 第一部分 - 安装 OpenLDAP\n- 第二部分 - 设置 OpenLDAP 服务器\n- 第三部分 - 设置 OpenLDAP\
    \ 客户端\n\n- 1. 从主菜单启动 YaST。\n- 2. 输入 root 密码（novel）并选择确定。\n- 3. 从 YaST 控制中心，选择\
    \ 软件 > 软件管理。\n- 4. 从筛选器下拉菜单中选择 搜索。\n- 5. 在搜索字段中输入 ldap；然后选择 搜索。\n- 6. 在右侧，选择以下软件包：\n\
    \  - nss_ldap\n  - openldap2\n  - openldap2-client\n  - pam_ldap\n- 7. 选择 接受；然后插入请求的\
    \ SUSE Linux Enterprise Server 10 DVD。\n- 8. 安装完成后，取出 DVD 并关闭 YaST 控制中心。\n\n##\
    \ 第二部分 - 设置 OpenLDAP 服务器\n\n- 1. 启动 YaST。\n- 2. 启动 YaST 模块 网络服务 > LDAP 服务器。\n\
    - 3. 选择 是 以启动 LDAP 服务器。\n- 4. 选择 配置。\n- 5. 在 LDAP 服务器配置对话框中选择 添加数据库 以添加数据库。\n\
    - 6. 在添加数据库对话框中输入以下信息：\n\n# 表 11-1\n\n| 文本框 | 值 |\n|---|---|\n| Base DN | dc=digitalairlines,dc=com\
    \ |\n| LDAP Password | novell |\n| Validate Password | novell |\n\n- 7. 选择 确定。\n\
    - 8. 在左侧框架中选择 全局设置 > TLS 设置。确保选项 TLS Active 设置为 否。\n- 9. 选择 完成。\n\n## 第三部分 - 设置\
    \ OpenLDAP 客户端\n\n- 1. 启动 YaST 模块 网络服务 > LDAP 客户端。\n- 2. 选择 使用 LDAP 以激活 LDAP 用于用户身份验证。\n\
    - 3. 确保 LDAP 服务器地址 的内容为 127.0.0.1。\n- 4. 确保 LDAP 基本 DN 的内容为 dc=digitalairlines,dc=com\n\
    - 5. 确保选项 LDAP TLS/SSL 已停用。\n- 6. 选择 **高级配置**。\n- 7. 选择 **管理设置** 选项卡。\n- 8. 在文本框\
    \ 管理 DN 中输入 **cn=Administrator**。\n- 9. 激活选项 **附加基本 DN**。\n- 10. 激活选项 **创建默认配置对象**。\n\
    - 11. 激活选项 **本机上的主目录**。\n- 12. 选择 **接受**。\n- 13. 选择 **完成**。\n- 14. 当要求输入管理员密码时输入\
    \ **novell**。\n\n*（练习结束）*\n\n- **transport.** 指定传输安全强度因子。\n- **tls.** 指定 TLS 安全强度因子。\n\
    - **sasl.** 指定 SASL 安全强度因子。\n- **update_*.** 指定目录更新所需的安全强度因子。\n- **simple_bind.**\
    \ 指定简单用户名/密码身份验证所需的安全强度因子。\n\n有关更详细的描述，请阅读 slapd.conf 手册页（man 5 slapd.conf）中关于\
    \ sasl-secprops 的部分。\n\n**access to.** 授予一组条目和/或属性对一个或多个请求者的访问权限。\n\n语法：**access\
    \ to objects [by requesters level control]**\n\n**objects** 和 **requesters** 由其\
    \ DN 指定。\n\n作为 **requesters**，你也可以使用星号表示 **everybody**。**self** 表示属性的所有者对象。你也可以通过\
    \ **dn=DN** 指定 DN 或通过 **group=DN** 指定组。\n\n**level** 可以是：\n\n- **read**（读取访问）\n\
    - **write**（写入访问）\n- **auth**（需要身份验证）\n- **none**（无访问）\n\n示例 1：\n\n```\naccess\
    \ to attr=userpassword\nby self write\nby anonymous auth\nby * none\n\naccess\
    \ to *\nby * read\n```\n"
