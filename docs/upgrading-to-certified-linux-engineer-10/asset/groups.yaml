  mdcn: "\n\n## SECTION 1 SUSE Linux Enterprise Server 10 的安装\n\n从 SUSE Linux Enterprise\
    \ Server 9 到 SUSE Linux Enterprise Server 10 的安装过程中变化不大。\n\n在 SUSE Linux Enterprise\
    \ Server 9 中，默认的身份验证方法是使用 LDAP 服务器。在 SUSE Linux Enterprise Server 10 中，它使用文件 /etc/passwd\
    \ 进行本地身份验证。\n\n另一个新功能是 Novell Customer Center。\n\n### Objective\n\n- 了解 Novell\
    \ Customer Center 配置和在线更新\n\n### Objective 1: 了解 Novell Customer Center 配置和在线更新\n\
    \n如果 Internet 连接测试成功，您可以配置 Novell Customer Center，该中心是执行在线更新所必需的。如果 SUSE 更新服务器上有任何更新包可用，您可以下载并安装它们以修复已知错误或安全问题。\n\
    \nFigure 1-1\n\n![](img/8279afe915b153902294b0e58311b75a_19_0.png)\n\n选择 **Next**\
    \ 会启动浏览器并连接到 Novell 网站，您只需输入您的电子邮件地址，以及如果有的话，激活码。\n\nFigure 1-2\n\n![](img/8279afe915b153902294b0e58311b75a_20_0.png)\n\
    \n注册成功后，在线更新对话框打开。您可以通过选择 **Run Update** 和 **Next** 开始在线更新。  \n（您也可以选择 **Skip\
    \ Update** 以便稍后在已安装的系统上执行更新。）\n\nYaST 的在线更新对话框打开，显示可用补丁的列表（如果有）。\n\nFigure 1-3\n\
    \n![](img/8279afe915b153902294b0e58311b75a_21_0.png)\n\n选择您想要安装的补丁，然后通过选择 Accept\
    \ 开始更新过程。\n\n安装完成后，请访问 Novell Customer Center http://www.novell.com/center/ 以管理您的\
    \ Novell 产品和订阅。\n\n> 在软件选择对话框的 Filter 下拉菜单中，有一个名为 Patterns 的项目。此过滤器显示在已知安装介质上可用的所有软件。它按逻辑上属于一起的预定义软件包集合进行分组。在\
    \ SUSE Linux Enterprise Server 9 中，此项目被标记为 Selections。\n\n### Summary\n\n| Objective\
    \ | Summary |\n|---|---|\n| 1. 了解 Novell Customer Center 配置和在线更新 | 在 SUSE Linux\
    \ Enterprise Server 10 中，它使用文件 /etc/passwd 进行本地身份验证。Novell Customer Center 是执行在线更新所必需的。\
    \ |\n\n## SECTION 2 使用 GNOME 桌面环境\n\nGNOME 是一个舒适的桌面环境。GNOME 支持拖放。众多程序专门为 GNOME\
    \ 设计。\n\n### Objectives\n\n- 登录\n- 注销和关机\n- 识别 GNOME 桌面组件\n- 管理 GNOME 中的图标\n-\
    \ 使用 GNOME 文件管理器（Nautilus）\n- 搜索文件\n- 从桌面访问命令行界面\n\n### Objective 1: 登录\n\n当计算机启动并准备工作时，会出现以下登录对话框：\n\
    \nFigure 2-1\n\n![](img/8279afe915b153902294b0e58311b75a_25_0.png)\n\n输入用户名后，按\
    \ **Enter**。然后输入您的密码并再次按 **Enter**。如果登录成功，则会出现以下 GNOME 桌面环境：\n\nFigure 2-2\n\n\
    ![](img/8279afe915b153902294b0e58311b75a_26_0.png)\n\n### Objective 2: 注销和关机\n\
    \n当您准备从系统注销时，打开底部面板中的 Computer 菜单（也称为主菜单）。\n\nFigure 2-3\n\n![](img/8279afe915b153902294b0e58311b75a_27_0.png)\n\
    \n在 Computer 菜单的右侧，选择 Log Out 条目。\n\n选择 Log Out 后，会出现确认对话框。\n\nFigure 2-4\n\n\
    ![](img/8279afe915b153902294b0e58311b75a_27_1.png)\n\n如果您选择 Save current setup，您的当前桌面环境设置将被保存并在下次登录后恢复。\n\
    \n选择操作后选择 OK。\n\n如果您处于登录屏幕，左下角有四个选项可用：\n\n- **Language.** 选择桌面环境的语言。\n- **Session.**\
    \ 您可以选择除 GNOME 之外的窗口管理器。在本学生手册中，我们仅介绍 GNOME（默认窗口管理器）。有关 KDE 环境的一些基本信息，您可以在附录 A\
    \ 中找到。\n- **Reboot.** 重启系统。\n- **Shut Down.** 关闭计算机。\n\n只有 root 允许重启系统。因此您必须输入\
    \ root 密码。\n\n只有 root 允许关闭系统。因此您必须输入 root 密码。\n\n"
