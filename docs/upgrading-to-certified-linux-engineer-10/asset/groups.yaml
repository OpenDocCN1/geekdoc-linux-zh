    \ are:\n\n+   - **HELO (Hello)** is used by the SMTP sender to open a connection\
    \ to an SMTP recipient (a greeting) and to introduce itself with its full host\
    \ name. This host name is passed as an argument attached to the **HELO** command.\n\
    +   \n+     The SMTP recipient answers this greeting with its full host name.\
    \ This completes the initialization of communication between the SMTP sender and\
