  mdcn: "\n\n运行 Xen 时，网络设置由 xend 管理进程完成。这可能会干扰域的原生网络配置脚本。尤其是 SuSEfirewall2 已知会引起问题。因此建议使用\
    \ rcSuSEfirewall2 停止 SuSEfirewall2，并从 init 进程中移除防火墙脚本：\n\n```\ninsserv -r SuSEfirewall2_setup\n\
    insserv -r SuSEfirewall2_init\ninsserv -r SuSEfirewall2_final (conditional)\n\
    ```\n\n## Exercise 8-1    安装 Xen\n\n在本练习中，你将学习如何安装 Xen 并配置 domain0。\n\n执行以下操作：\n\
    \n- Part I: 安装 XenPackages。\n- Part II: 准备重启\n- Part III: 重启并测试 Xen。\n\n### Part\
    \ I: 安装 XenPackages。\n\n执行以下操作：\n\n- 1. 启动 YaST 控制中心。\n- 2. 选择 Software > Software\
    \ Management。\n- 3. 从 Filter 菜单中选择 Search。\n- 4. 在搜索字段中输入 xen 并选择搜索。\n- 5. 在右侧，选择软件包\
    \ xen、kernel-xen 和 xen-tools。\n- 6. 选择 Accept 并让 YaST 安装所有必需的软件包。\n- 7. 关闭 YaST\
    \ 控制中心。\n\n### Part II: 准备重启\n\n执行以下操作：\n\n- 1. 打开一个终端窗口并 su - 切换到 root 用户。\n\
    - 2. 使用文本编辑器（例如 vi）打开文件 /boot/grub/menu.lst。\n- 3. 确保文件中有一个标题为 Xen 的部分。\n- 4.\
    \ 在该部分中，确保参数 **root=** 指向你的安装的根分区。\n- 5. 关闭文件。\n- 6. 输入命令：\n  **insserv -r SuSEfirewall2_setup**\n\
    \  以及\n  **insserv -r SuSEfirewall2_init**\n- 7. 关闭终端窗口。\n\n### Part III: 重启并测试\
    \ Xen。\n\n- 1. 重启你的系统。\n- 2. 在启动菜单中，选择 **Xen entry** 并按 **Return**。\n- 3. 系统启动后，以用户\
