  - '[PAGE 327]


    # Administer AppArmor Profiles with YaST


    The profile for /sbin/klogd, given in the example above, is a rather short profile.
    When you browse through the profiles in /etc/apparmor.d/ or /etc/apparmor/profiles/extras/
    you will see that these profiles can be much more complex.


    AppArmor comes with several tools that help to create and maintain AppArmor profiles.
    YaST modules exist that provide a graphical interface to those tools.


    You can accomplish various tasks with YaST:


    +   - Create a New Profile

    +   - Update a Profile

    +   - Delete a Profile


    # Create a New Profile


    To create a new profile, you can


    +   - Use the New Profile Wizard

    +   - Create a New Profile Manually


    # Use the New Profile Wizard


    There is a Wizard to create a new profile. Before calling the Wizard to profile
    an application, the first step is to stop the application you want to create a
    profile for.'
  - '[PAGE 328]


    To access the Add Profile Wizard, start YaST and select Novell AppArmor:


    # Figure 14-1


    ![](img/8279afe915b153902294b0e58311b75a_328_0.png)


    Then select the Add Profile Wizard. The first step is to enter the application
    you want to profile:


    # Figure 14-2


    ![](img/8279afe915b153902294b0e58311b75a_328_1.png)


    If no path is given, the Wizard looks for the binary in the search path (variable
    $PATH).'
  - '[PAGE 329]


    The next dialog asks you to start and use the application you want to profile.
    Use the application in a way that you expect it to be used in production. For
    instance, if you are profiling a web server, access it in a way that you expect
    it to be accessed during normal operation. For a web browser, use it in a way
    you expect the users to access web content.


    During this learning phase, any access to files or capabilities needed by the
    application is granted as well as logged in the log file /var/log/audit/audit.log.
    Because any access is granted, you have to make sure that no attack can happen
    during this phase of profile creation. AppArmor does not yet protect your application.


    Once you feel you have gone through all expected uses of the application, select
    Scan system log for AppArmor events in the YaST AppArmor Profile Wizard dialog.


    For each event you are presented with a dialog where you can decide what should
    happen when this event occurs in the future. The dialog offers different options,
    depending on the event.'
  - '[PAGE 330]


    # Figure 14-3


    In case of access to a program, the dialog looks similar to the following:


    ![](img/8279afe915b153902294b0e58311b75a_330_0.png)


    +   - Inherit. The executed resource inherits the current (parent''s) profile.


    +   - Profile. Requires that a specific profile exist for the executed program.


    +   - Unconfined. Executes the program without a security profile. Do not run
    unconfined unless absolutely necessary.


    +   - Deny. The execution of the program will be denied.'
  - '[PAGE 331]


    In case of file access, the dialog offers different options:


    # Figure 14-4


    ![](img/8279afe915b153902294b0e58311b75a_331_0.png)


    The Add Profile Wizard suggests an access mode (r, w, l, or a combination of them).
    If more than one item appears in the list of files, directories, or #includes,
    select the radio button in front of the appropriate one, and then select one of
    these buttons:


    +   - Allow. Grants the program access to the specified directory path.


    +   - Deny. Prevents the program from accessing the specified file or directory.


    Sometimes the suggested files or directories do not fit your needs. In this case,
    you can modify them:


    +   - Glob. Selecting Glob once replaces the filename with an asterisk, including
    all files in the directory. Selecting Glob twice replaces the file and the directory
    it resides in by **, including all directories and files of that level in the
    directory tree. Selecting Glob again goes up one level in the path.'
  - '[PAGE 332]


    +   - **Glob w/Ext.** Selecting Glob w/Ext once replaces the filename with an
    *, but retains the file name extension: text.txt becomes *.txt. Selecting Glob
    w/Ext twice replaces the file name and the directory it resides in by **, retaining
    the file name extension: /a/b/c/text.txt becomes /a/b/**/*.txt.

    +   - **Edit.** Enables editing of the highlighted line. The new (edited) line
    appears at the bottom of the list.


    After you have modified the line, select Allow or Deny. Go through each learning
    mode entry in this way.


    Once all entries have been processed, you are returned to the AppArmor Profile
    Wizard dialog that asked you to run the application. You can run the application
    again, and then run through any additional entries generated by this.


    Once you conclude you are done, select **Finish**. The profile is written and
    activated.


    If you want to discard your selections, select **Abort**.'
  md: '

    ## Administer AppArmor Profiles with YaST


    The profile for /sbin/klogd, given in the example above, is a rather short profile.
    When you browse through the profiles in /etc/apparmor.d/ or /etc/apparmor/profiles/extras/
    you will see that these profiles can be much more complex.


    AppArmor comes with several tools that help to create and maintain AppArmor profiles.
    YaST modules exist that provide a graphical interface to those tools.


    You can accomplish various tasks with YaST:


    - Create a New Profile

    - Update a Profile

    - Delete a Profile


    ## Create a New Profile


    To create a new profile, you can


    - Use the New Profile Wizard

    - Create a New Profile Manually


    ## Use the New Profile Wizard


    There is a Wizard to create a new profile. Before calling the Wizard to profile
    an application, the first step is to stop the application you want to create a
    profile for.


    To access the Add Profile Wizard, start YaST and select Novell AppArmor:


    ### Figure 14-1


    ![](img/8279afe915b153902294b0e58311b75a_328_0.png)


    Then select the Add Profile Wizard. The first step is to enter the application
    you want to profile:


    ### Figure 14-2


    ![](img/8279afe915b153902294b0e58311b75a_328_1.png)


    If no path is given, the Wizard looks for the binary in the search path (variable
    $PATH).


    The next dialog asks you to start and use the application you want to profile.
    Use the application in a way that you expect it to be used in production. For
    instance, if you are profiling a web server, access it in a way that you expect
    it to be accessed during normal operation. For a web browser, use it in a way
    you expect the users to access web content.


    During this learning phase, any access to files or capabilities needed by the
    application is granted as well as logged in the log file /var/log/audit/audit.log.
    Because any access is granted, you have to make sure that no attack can happen
    during this phase of profile creation. AppArmor does not yet protect your application.


    Once you feel you have gone through all expected uses of the application, select
    Scan system log for AppArmor events in the YaST AppArmor Profile Wizard dialog.


    For each event you are presented with a dialog where you can decide what should
    happen when this event occurs in the future. The dialog offers different options,
    depending on the event.


    ### Figure 14-3


    In case of access to a program, the dialog looks similar to the following:


    ![](img/8279afe915b153902294b0e58311b75a_330_0.png)


    - Inherit. The executed resource inherits the current (parent''s) profile.

    - Profile. Requires that a specific profile exist for the executed program.

    - Unconfined. Executes the program without a security profile. Do not run unconfined
    unless absolutely necessary.

    - Deny. The execution of the program will be denied.


    In case of file access, the dialog offers different options:


    ### Figure 14-4


    ![](img/8279afe915b153902294b0e58311b75a_331_0.png)


    The Add Profile Wizard suggests an access mode (r, w, l, or a combination of them).
    If more than one item appears in the list of files, directories, or #includes,
    select the radio button in front of the appropriate one, and then select one of
    these buttons:


    - Allow. Grants the program access to the specified directory path.

    - Deny. Prevents the program from accessing the specified file or directory.


    Sometimes the suggested files or directories do not fit your needs. In this case,
    you can modify them:


    - Glob. Selecting Glob once replaces the filename with an asterisk, including
    all files in the directory. Selecting Glob twice replaces the file and the directory
    it resides in by **, including all directories and files of that level in the
    directory tree. Selecting Glob again goes up one level in the path.

    - Glob w/Ext. Selecting Glob w/Ext once replaces the filename with an *, but retains
    the file name extension: text.txt becomes *.txt. Selecting Glob w/Ext twice replaces
    the file name and the directory it resides in by **, retaining the file name extension:
    /a/b/c/text.txt becomes /a/b/**/*.txt.

    - Edit. Enables editing of the highlighted line. The new (edited) line appears
    at the bottom of the list.


    After you have modified the line, select Allow or Deny. Go through each learning
    mode entry in this way.


    Once all entries have been processed, you are returned to the AppArmor Profile
    Wizard dialog that asked you to run the application. You can run the application
    again, and then run through any additional entries generated by this.


    Once you conclude you are done, select **Finish**. The profile is written and
    activated.


    If you want to discard your selections, select **Abort**.

    '
  mdcn: '


    ## 使用 YaST 管理 AppArmor 配置文件


    上面示例中给出的 `/sbin/klogd` 配置文件相当简短。当你浏览 `/etc/apparmor.d/` 或 `/etc/apparmor/profiles/extras/`
    中的配置文件时，会发现这些配置文件可能复杂得多。


    AppArmor 提供了多个用于创建和维护 AppArmor 配置文件的工具。YaST 中提供了相应的模块，为这些工具提供图形界面。


    你可以使用 YaST 完成各种任务：


    - 创建新配置文件

    - 更新配置文件

    - 删除配置文件


    ## 创建新配置文件


    要创建新配置文件，你可以：


    - 使用“新建配置文件向导”

    - 手动创建新配置文件


    ## 使用“新建配置文件向导”


    你可以使用向导创建新配置文件。在使用向导为应用程序创建配置文件之前，第一步是停止你要为其创建配置文件的应用程序。


    要访问“添加配置文件向导”，请启动 YaST 并选择 Novell AppArmor：


    ### 图 14-1


    ![](img/8279afe915b153902294b0e58311b75a_328_0.png)


    然后选择“添加配置文件向导”。第一步是输入要为其创建配置文件的应用程序：


    ### 图 14-2


    ![](img/8279afe915b153902294b0e58311b75a_328_1.png)


    如果没有提供路径，向导会在搜索路径（变量 `$PATH`）中查找二进制文件。


    下一个对话框会要求你启动并使用要创建配置文件的应用程序。请按照你预期在生产环境中使用它的方式使用该应用程序。例如，如果你要为 Web 服务器创建配置文件，请按照正常运行期间预期的访问方式访问它。对于
    Web 浏览器，请按照你预期用户访问 Web 内容的方式使用它。


    在此学习阶段，应用程序所需的任何文件访问或功能都会被授予，并记录在日志文件 `/var/log/audit/audit.log` 中。由于任何访问都会被授予，因此必须确保在创建配置文件期间不会发生攻击。AppArmor
    此时尚未保护你的应用程序。


    当你认为已经完成了应用程序所有预期使用方式的操作后，请在 YaST AppArmor 配置文件向导对话框中选择“扫描系统日志中的 AppArmor 事件”。


    对于每个事件，系统都会显示一个对话框，你可以决定将来该事件发生时应执行的操作。根据事件类型，对话框会提供不同的选项。


    ### 图 14-3


    如果涉及程序访问，对话框类似于以下内容：


    ![](img/8279afe915b153902294b0e58311b75a_330_0.png)


    - 继承。执行的资源继承当前（父级）配置文件。

    - 配置文件。要求为执行的程序存在特定配置文件。

    - 不受限。在没有安全配置文件的情况下执行程序。除非绝对必要，否则不要以不受限方式运行程序。

    - 拒绝。拒绝执行该程序。


    如果涉及文件访问，对话框会提供不同的选项：


    ### 图 14-4


    ![](img/8279afe915b153902294b0e58311b75a_331_0.png)


    “添加配置文件向导”会建议一种访问模式（`r`、`w`、`l`，或它们的组合）。如果文件、目录或 `#include` 的列表中出现多个项目，请选中相应项目前面的单选按钮，然后选择以下按钮之一：


    - 允许。授予程序访问指定目录路径的权限。

    - 拒绝。阻止程序访问指定的文件或目录。


    有时，建议的文件或目录可能不符合你的需求。在这种情况下，你可以对其进行修改：


    - Glob。选择一次“Glob”会将文件名替换为星号，同时包含该目录中的所有文件。选择两次“Glob”会将文件及其所在目录替换为 `**`，同时包含目录树中该层级的所有目录和文件。再次选择“Glob”会沿路径向上移动一级。

    - Glob（含扩展名）。选择一次“Glob（含扩展名）”会将文件名替换为 `*`，但保留文件扩展名：`text.txt` 会变为 `*.txt`。选择两次“Glob（含扩展名）”会将文件名及其所在目录替换为
    `**`，同时保留文件扩展名：`/a/b/c/text.txt` 会变为 `/a/b/**/*.txt`。

    - 编辑。启用对突出显示行的编辑。新编辑的行会显示在列表底部。


    修改该行后，选择“允许”或“拒绝”。以这种方式处理每个学习模式条目。


    处理完所有条目后，你会返回到 AppArmor 配置文件向导对话框，该对话框之前要求你运行应用程序。你可以再次运行应用程序，然后处理由此生成的其他条目。


    确认完成后，选择**完成**。配置文件将被写入并激活。


    如果要放弃所做的选择，请选择**中止**。


    '
