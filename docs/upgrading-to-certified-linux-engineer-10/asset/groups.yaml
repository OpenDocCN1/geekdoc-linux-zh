    \ automatically.\n\nThe script has some configuration options, which can be adjusted\
    \ in the file /etc/sysconfig/xendomains. The configuration variables in this file\
    \ are well documented.\n\nOne interesting option is to migrate domains automatically\
    \ to a different host when a domain0 is shutdown. This can be configured in the\
    \ variable XENDOMAINS_MIGRATE. The variable has to be set to the IP address of\
    \ the target machine. When the variable is empty, no migration is performed.\n\
    \n## Exercise 8-4 Automate Domain Startup\n\nIn this exercise, you learn how to\
    \ startup domains automatically when the system is booted.\n\nDo the following:\n\
    \n- 1. Open a terminal window and su - to the root user.\n- 2. Move the vm1 configuration\
    \ file into the auto directory: mv /etc/xen/vm/vm1 /etc/xen/auto/\n- 3. Shutdown\
    \ vm1 with the command xm shutdown vm1.\n- 4. Wait a moment and control with the\
    \ command xm list if the domain has been shut down. Continue with next step when\
    \ the domain vm1 is not listed anymore.\n- 5. Reboot you system by entering reboot.\n\
    - 6. At the boot prompt, select the Xen entry.\n- 7. When the system has been\
    \ started up, log in to the graphical interface as user gecko with the password\
    \ novell.\n- 8. Open a terminal window and su - to the root user.\n- 9. Enter\
    \ the command xm list.\n- 10. The domain vm1 should have been automatically started\
    \ and should be listed in the xm output.\n\n(End of Exercise)\n"
  mdcn: "\n\n一个暂停的域并未完全关闭。当前状态会被保存，并且域的执行可以通过 **unpause** 命令继续：\n\n```\nxm unpause\
    \ <domain_id>\n```\n\n要关闭一个域，请使用 **shutdown** 命令：\n\n```\nxm shutdown <domain_id>\n\
    ```\n\n如果域不再响应，你可以使用 **destroy** 命令强制关闭该域：\n\n```\nxm destroy <domain_id>\n```\n\
    \n要将域的状态保存更长时间（例如跨越 domain0 的重启），你可以使用 **save** 命令：\n\n```\nxm save <domain_id>\
    \ <filename>\n```\n\n域可以从生成的<|message|> 文件中通过 **restore** 命令恢复：\n\n```\nxm restore\
    \ <filename>\n```\n\n另一个常用命令是 **mem-set**，它允许你更改域的内存分配：\n\n```\nxm mem_set <domain_id>\
    \ <amount_of_memory>\n```\n\n内存量以兆字节为单位指定。\n\n在所有 xm 命令中，除了域 ID <domain_id> 之外，你也可以使用域名称。\n\
    \n## 练习 8-3 更改访客域的内存分配\n\n在本练习中，你将学习如何通过更改域配置文件来更改访客域的内存分配。\n\n以下假设你在之前的练习中配置的访客域仍有一个打开的终端窗口。\n\
    \n执行以下操作：\n\n- 1. 打开一个终端窗口并 su - 到 root 用户。\n- 2. 输入命令 xm list。\n- 3. 记录域 vm1\
    \ 的内存分配情况。\n- 4. 切换到 Xen 域的终端并输入 halt 停止系统。等待系统停止。\n- 5. 返回到 root 终端并使用命令 xm list\
    \ 验证域 vm1 已不再运行。\n- 6. 使用文本编辑器打开文件 /etc/xen/vm/vm1。\n- 7. 查找 memory 参数并将值更改为 172。\n\
    - 8. 保存并关闭文件。\n- 9. 输入以下命令启动域：\n  xm create -c -f /etc/xen/vm/vm1\n- 10. 等待系统启动完成并看到登录提示。\n\
    - 11. 按键组合 Ctrl-] 从域终端分离并返回到 root 终端。\n- 12. 使用命令 xm list 确定域 vm1 的内存分配。它应为 172MB。\n\
    - 13. 同时记录域 vm1 的 ID。\n\n14. 使用以下命令附加到 vm1 的终端\n\n```xm console <noted_id>```\n\
    \n（练习结束）\n\n## 自动化域启动和关闭\n\n当你启动、关闭或重启 Xen 系统的 domain0 时，这也会影响其他正在运行的 Xen 域。没有运行的\
    \ domain0，其他 Xen 域无法操作。\n\nSUSE Linux Enterprise Server 10 附带一个名为 xendomains 的启动脚本，该脚本包含在\
    \ xen-tools 包中。\n\n该脚本应安装在 domain0 上，并执行以下操作：\n\n- 当 domain0 启动时，所有位于 /etc/xen/auto/\
    \ 下的域和配置文件都会被启动。\n- 当 domain0 关闭或重启时，正在运行的 Xen 域会自动关闭。\n\n该脚本有一些配置选项，可以在文件 /etc/sysconfig/xendomains\
    \ 中调整。该文件中的配置变量有很好的文档说明。\n\n一个有趣的选项是在 domain0 关闭时自动将域迁移到不同的主机。这可以在变量 XENDOMAINS_MIGRATE\
    \ 中配置。该变量必须设置为目标机器的 IP 地址。当变量为空时，不执行迁移。\n\n## 练习 8-4 自动化域启动\n\n在本练习中，你将学习如何在系统启动时自动启动域。\n\
    \n执行以下操作：\n\n- 1. 打开一个终端窗口并 su - 到 root 用户。\n- 2. 将 vm1 配置文件移动到 auto 目录：mv /etc/xen/vm/vm1\
    \ /etc/xen/auto/\n- 3. 使用命令 xm shutdown vm1 关闭 vm1。\n- 4. 等待片刻并使用命令 xm list 检查域是否已关闭。当域\
    \ vm1 不再列出时继续下一步。\n- 5. 通过输入 reboot 重启你的系统。\n- 6. 在启动提示时，选择 Xen 条目。\n- 7. 当系统启动后，以用户\
    \ gecko 和密码 novell 登录到图形界面。\n- 8. 打开一个终端窗口并 su - 到 root 用户。\n- 9. 输入命令 xm list。\n\
    - 10. 域 vm1 应该已被自动启动并列在 xm 输出中。\n\n（练习结束）\n\n"
