    本课程对设备和接口使用以下定义：


    - **设备。** 设备是真实的物理硬件。可以是 PCI 网卡、AGP 图形适配器、USB 打印机，或任何您可以拿在手里、触摸到、甚至想弄坏也可以弄坏的硬件。

    - **接口。** 接口是与设备关联的软件组件。要使用物理硬件，需要通过软件接口进行访问。


    一个设备可以有多个接口。


    接口通常由驱动程序创建。在 Linux 中，驱动程序通常是一个可以加载到 Linux 内核中的软件模块。因此，驱动程序可以被看作是设备与其接口之间的粘合剂。


