    \ the current profile.\n- px. Discrete Profile Execute Mode. This mode requires\
    \ that a profile be defined for the resource executed. If there is no profile\
    \ defined, access is denied.\n- Px. Discrete Profile execute mode -- scrub the\
    \ environment. Px allows the named program to run in px mode, but AppArmor will\
    \ invoke the Linux Kernel's unsafe_exec routines to scrub the environment, similar\
    \ to setuid programs. (See man 8 ld.so for some information on setuid/setgid environment\
    \ scrubbing.)\n- ux. Unconstrained Execute Mode. Allows the program to execute\
    \ the resource without any Novell AppArmor profile being applied to the executed\
    \ resource. *This should only be used in rare exceptions.*\n- Ux. Unconstrained\
    \ execute -- scrub the environment. As ux, it should only be used in rare exceptions.\n\
    \nThe last five, ix, px, Px, ux, and Ux, cannot be combined.\n\nThe manual page\
    \ covering the syntax of the profiles is\n**man 5 apparmor.d**\n"
  mdcn: "\n\n## 理解配置文件和规则\n\nNovell AppArmor 配置文件包含两种类型的 AppArmor 规则：路径条目和 capability\
    \ 条目。路径条目指定进程在文件系统中的访问权限。AppArmor 默认限制进程被赋予的 capabilities（参见 man apparmor）。Capability\
    \ 条目用于指定进程被授予的特定 POSIX capabilities（man 7 capabilities），从而覆盖默认限制。\n\n其他包含 AppArmor\
    \ 规则的文件可以通过 #include 语句引入。\n\n作为示例，让我们来看一下内核日志守护进程 /sbin/klogd 的配置文件（/etc/apparmor.d/sbin.klogd）：\n\
    \n```\n# Profile for /sbin/klogd\n#include <tunables/global>\n\n/sbin/klogd {\n\
    \    #include <abstracts/base>\n    capability sys_admin,\n    /boot/System.map*\
    \ r,\n    /proc/kmsg r,\n    /sbin/klogd rmix,\n    /var/log/boot.msg rw,\n  \
    \  /var/run/klogd.pid rw,\n}\n```\n\n注释（如第1行）以 # 符号开头，\n\n#include（如第3行和第6行）不是被解释为注释，而是用于包含其他文件中的规则。上面给出的路径相对于\
    \ /etc/apparmor.d/。\n\n/etc/apparmor.d/tunables/global（第3行）用于包含应在每个配置文件中可用的定义。默认情况下，它仅包含\
    \ /etc/apparmor.d/tunables/home，该文件定义了变量 @{HOMEDIRS} 和 @{HOME}。这些变量在各种配置文件中使用。\n\
    \n目录 /etc/apparmor.d/abstractions/ 包含按通用应用程序任务分组的通用规则文件。这些包括，例如，所有应用程序所需文件的访问权限（base）、身份验证机制的访问权限（authentication）、图形环境（kde,\
    \ gnome）、名称解析（nameservice）等。无需在多个配置文件中冗余指定这些规则，而是定义在一个位置并包含在需要它们的配置文件中。\n\n示例中第5行给出了\
    \ AppArmor 约束的程序的绝对路径。规则以及任何包含内容都在大括号 {} 内跟随。\n\n第8行为此程序启用 capability sys_admin。任何其他需要的\
    \ capabilities 都将以 capability 开头的单独行列出。\n\n其余行列出了文件和目录，以及授予的访问权限。\n\n在列出文件和目录的行中，可以使用以下通配符：\n\
    \n- *. 替代任意数量的字符，但不包括 /。\n- **. 替代任意数量的字符，包括 /。使用 ** 来包含子目录。\n- ?. 替代除 / 外的任意单个字符。\n\
    - [abc]. 替代 a、b 或 c。\n- [a-d]. 替代 a、b、c 或 d。\n- {ab,cd}. 替代 ab 或 cd。\n\n授予的权限可以是\n\
    \n- r. 允许程序对资源具有读取访问权限。读取访问对于脚本是必需的，并且执行中的进程需要此权限以允许其转储核心或使用 ptrace 进行附加。\n- w.\
    \ 允许程序对资源具有写入访问权限。如果要取消链接（删除）文件，则文件必须具有此权限。\n- l. 链接模式调解对符号链接和硬链接的访问，并授予取消链接（删除）文件的特权。\n\
    - m. 允许可执行映射。此模式允许使用 mmap(2) 的 PROT_EXEC 标志将文件映射到内存中。该标志将页面标记为可执行；在某些架构上用于提供不可执行的数据页，这会使利用尝试变得复杂。AppArmor\
    \ 使用此模式来限制良好行为的程序（或在强制执行不可执行内存访问控制的架构上的所有程序）可使用的文件作为库，以限制向 ld(1) 和 LD_PRELOAD、LD_LIBRARY_PATH\
    \ 传递给 ld.so(8) 的无效 -L 标志的影响。\n- ix. 继承执行模式。被执行的资源继承当前配置文件。\n- px. 独立配置文件执行模式。此模式要求为被执行的资源定义配置文件。如果未定义配置文件，则拒绝访问。\n\
    - Px. 独立配置文件执行模式 -- 清理环境。Px 允许命名程序以 px 模式运行，但 AppArmor 将调用 Linux 内核的 unsafe_exec\
    \ 例程来清理环境，类似于 setuid 程序。（参见 man 8 ld.so 有关 setuid/setgid 环境清理的一些信息。）\n- ux. 无约束执行模式。允许程序在未对被执行资源应用任何\
    \ Novell AppArmor 配置文件的情况下执行该资源。*这仅应在极少数例外情况下使用。*\n- Ux. 无约束执行 -- 清理环境。与 ux 类似，仅应在极少数例外情况下使用。\n\
    \n最后五个，ix、px、Px、ux 和 Ux，不能组合使用。\n\n涵盖配置文件语法的手册页是\n**man 5 apparmor.d**\n\n"
