  - "[PAGE 97]\n\nThey are typically used to restrict or permit access to a service\
    \ based on the time of day, currently available system resources (maximum number\
    \ of users) or perhaps the location of the applicant user (for example, to limit\
    \ `root' login to the console).\n\n+   session. These modules are associated with\
    \ performing tasks that need to be done for the user before she can be given access\
    \ to a service or after a service is provided to her.\n+   \n+   Such things include\
    \ logging information concerning the user, mounting directories and the opening\
    \ and closing of some data exchange with another user.\n\n+   password. This last\
    \ module type is required for updating the authentication token associated with\
    \ the user. Typically, there is one module for each challenge/response-based authentication\
    \ (auth) module type.\n\n# Control Flag. The control flag indicates how PAM will\
    \ react to the success or failure of the module it is associated with.\n\nSince\
    \ modules can be stacked (modules of the same type execute in a series, one after\
    \ another), the control-flags determine the relative importance of each module.\n\
    \nThe Linux-PAM library interprets these keywords in the following manner:\n\n\
    +   required. A module with this flag must be successfully processed before the\
    \ authentication can proceed.\n+   \n+   After the failure of a module with the\
    \ required flag, all other modules with the same flag are processed before the\
    \ user receives a message about the failure of the authentication attempt. This\
    \ prevents the user from knowing at what stage their authentication failed.\n\n\
    +   requisite. A module with this flag must also be processed successfully. In\
    \ case of success, other modules are subsequently processed, just like modules\
    \ with the required flag."
  - '[PAGE 98]


    However, in case of failure the module gives immediate feedback to the user and
    no further modules are processed.


    You can use the requisite flag as a basic filter, checking for the existence of
    certain conditions that are essential for a correct authentication.


    +   - **optional.** The failure or success of a module with this flag does not
    have any direct consequences.

    +   You can use this flag for modules that are only intended to display a message
    (such as telling a user that mail has arrived) without taking any further action.


    +   - **sufficient.** After a module with this flag has been successfully processed,
    the calling application receives an immediate message about the success and no
    further modules are processed (provided there was no preceding failure of a module
    with the "required" flag).

    +   The failure of a module with the sufficient flag has no direct consequences.
    In other words, any subsequent modules are processed in their respective order.


    +   - **include.** This is not really a control flag but indicates that the keyword
    in the next column is to be interpreted as a file name relative to /etc/pam.d/
    that should be included at this point.

    +   The file included has to have the same structure as any other PAM configuration
    file.

    +   The purpose of **include** files is to simplify changes concerning several
    applications.


    +   - **Module.** The PAM modules are located in the directory `/lib/security/`.
    Every filename of a module starts with the prefix `pam_`. You do not need to include
    the path, as long as the module is located in the default directory `/lib/security/`.


    > For all 64 bit platforms supported by SUSE Linux, the default directory is /lib64/security/.


    ![](img/8279afe915b153902294b0e58311b75a_98_0.png)'
  - "[PAGE 99]\n\nSome PAM modules (such as pam_unix2.so) can be used for several\
