    \ level**。指定调试级别。可能的调试级别有：\n  - 4. 详细跟踪调试\n  - 64. 配置文件处理\n  - 65535. 启用所有调试\n\
    \  - ?. 列出所有调试级别并退出 slurpd。\n- **-f file**。指定 slapd 配置文件。默认是 /etc/openldap/slapd.conf。\n\
    - **-r file**。指定 slapd 复制日志文件的名称。\n- **-o**。以“一次性”模式运行。通常，slurpd 处理 replog 文件然后监视是否有更多复制条目被追加。在一次性模式下，slurpd\
    \ 处理复制日志后退出。\n- **-t directory**。slurpd 在处理前将复制日志复制到工作目录。\n\n在 /etc/init.d/ 中有一个启动脚本，你可以通过输入\
    \ rcslurpd start 启动 slurpd。\n\n"
