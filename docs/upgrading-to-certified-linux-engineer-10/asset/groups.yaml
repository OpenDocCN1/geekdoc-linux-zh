    +   - The Novell Customer Center manage your business and technical interactions
    with Novell. This is also important for using the YaST Online update.

    +   - The syslog-ng used to log system messages on SUSE Linux Enterprise Server
    10.


    # Objectives


    +   1. Apply Security Updates

    +   2. Understand Recent Match of iptables

    +   3. Log to a Remote Host'
