    \ In the simplest case, the **MAIL FROM** command takes the sender's email address\
    \ (reverse-path) as an argument. The argument can be optionally extended to include\
    \ a list of hosts in front of the recipient's address via which a reply should\
    \ be routed (source route relaying), e.g.:\n+     - @venus.example.com\n+    \
    \ - @mars.example.com:Sales@example.com\n+   - **RCPT TO (Recipient)** sets the\
    \ recipient's address (forward-path) for an item of mail. If the mail should be\
    \ sent to several recipients at the same time, this command is repeated that number\
    \ of times."
