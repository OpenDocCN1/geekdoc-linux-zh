    +   - nobody. Any user can find only the paths in the database that can be seen
    by any other (unprivileged) user.

    +   - root. All files in the system are added into the database.


    # Current Directory in root''s Path and Current Directory in the Path of Regular
    Users.


    If you deselect these options (the default), users must always launch programs
    in the current directory by adding "./" (such as ./configure).


    If you select these options, the dot (".") is appended to the end of the search
    path for root and users, allowing them to enter a command in the current directory
    without appending "./".


    Selecting these options can be very dangerous because users can accidentally launch
    unknown programs in the current directory instead of the usual system-wide files.


