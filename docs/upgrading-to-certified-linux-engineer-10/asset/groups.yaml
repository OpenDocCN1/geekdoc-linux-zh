    \ to this:\n\n```\n:0\n* ^X-Spam-Status: Yes\n$MAILDIR/Spam\n```\n\n## Test SpamAssassin\n\
    \nYou can use telnet to test your configuration. You also can send a spam email\
    \ directly using the sendmail command:\n\n```\ncat sample-spam.txt | /usr/sbin/sendmail\
    \ geeko@digitalairlines.com\n```\n\n## Objective 3\n\n## Use a Virus Scanner for\
    \ Email\n\nCommunication via email is very important for companies and individuals\
    \ today, but email can be infected by virus software.\n\nMost of the viruses attack\
    \ Windows clients, but the mail server of a company is often a Linux or UNIX machine.\
    \ To avoid damage we recommend to search for viruses before the infected mail\
    \ arrives at the user’s client.\n\nSUSE Linux Enterprise Server 10 provides tools\
    \ to detect viruses in email on your mail server.\n\nIn this objective, the following\
    \ tools are introduced:\n\n- AVMailGate\n- AMaViSd-new\n\n## AVMailGate\n\nAVMailGate\
    \ is the abbreviation for AntiVir MailGate, an antivirus mail filter from H+BEDV\
    \ Datentechnik GmbH (http://www.hbedv.com).\n\nAVMailGate updates the virus definition\
    \ file and the engine itself.\n\nThis topic describes the following:\n\n- AVMailGate\
    \ Architecture\n- Install AVMailGate\n- Configure AVMailGate\n- Understand the\
    \ AVMailGate Configuration Files\n- Update AVMailGate\n\n### AVMailGate Architecture\n\
    \n### Figure 12-1\n\n![](img/8279afe915b153902294b0e58311b75a_272_0.png)\n\nAVMailGate\
    \ is composed of three queues and two kinds of processes:\n\n- **Queues** (located\
    \ in `/var/spool/avmailgate/`)\n  - **incoming/**. The input queue for all incoming\
    \ email.\n  - **rejected/**. The queue where possible infected email are stored.\n\
    \  - **outgoing/**. The output queue for not infected email.\n- **Processes**\n\
    \  - **avgated**. The smtpd receiver that stores incoming email in the input queue.\
    \ (daemon)\n  - **avgatefwd**. Virus-scanning function and SMTP forwarder and\
    \ sendmail invoker. (daemon)\n\nBoth processes can be configured by editing the\
    \ file\n`/etc/avmailgate.conf`.\n\nThis file includes comments that describe the\
    \ possible settings.\n\nFor a description of all options, see /usr/share/packages/avmailgate/doc/MANUAL.\n\
    \n## Install AVMailGate\n\nTo install AVMailGate, select the package avmailgate.\n\
    \nA startscript is available in rcavgate to start and stop AVMailGate.\n\nTo start\
    \ AVMailGate at the system’s start, enter insserv avgate.\n\n## Configure AVMailGate\n\
    \nThere are two possibilities to use AVMailGate with Postfix:\n\n- AVMailGate\
    \ Waits for Mails on Port 25 and Forwards Them to Postfix\n- AVMailGate Is Used\
    \ from Postfix as Content Filter\n\n### AVMailGate Waits for Mails on Port 25\
    \ and Forwards Them to Postfix\n\nTo use AVMailGate as mail proxy that waits for\
    \ mails on port 25 you simply have to avoid that Postfix listens on this port.\
    \ Therefore mark the following line in /etc/postfix/master.cf: as command by adding\
    \ a hash (“#”) in front\n\n```\n#smtp inet n - n - - smtpd\n```\n\nThen restart\
    \ Postfix.\n\n### AVMailGate Is Used from Postfix as Content Filter\n\nThe best\
    \ way to use AVMailGate with Postfix is to use the Full Content Filter API (see\
    \ FILTER_README in the Postfix package for details).\n\nIt waits for SMTP connections\
    \ on port 10024 and sends scanned email messages or virus warnings out per SMTP\
    \ on port 10025.\n\nTo integrate AVMailGate as a filter in Postfix, do the following:\n\
    \n1. Edit /etc/postfix/master.cf and uncomment –if applicable– or add the following\
    \ line:\n\n```\nlocalhost:10025 inet n - y - - smtpd -o content_filter=\n```\n\
    \n2. Edit /etc/postfix/main.cf and add the following line:\n\n```\ncontent_filter\
    \ = smtp:127.0.0.1:10024\n```\n\n3. Since AVMailGate listens on port 10024, not\
    \ port 25, edit /etc/avmailgate.conf and set\n\n```\nListenAddress localhost port\
    \ 10024\n```\n\n4. You have to tell AVMailGate it should send email back to Postfix\
    \ via SMTP on host localhost via port 10025. Edit /etc/avmailgate.conf and set\n\
    \n```\nForwardTo SMTP: localhost port 10025\n```\n\n5. Since AVMailGate sends\
    \ out notification messages as AVMailGate, set an alias in /etc/aliases:\n\n```\n\
    vmailgate: root\n```\n"
  mdcn: "\n\n+   f. 将管道视为过滤器。\n+   w. 等待过滤器或程序完成并检查其退出代码（通常被忽略）；如果过滤器不成功，则文本将不会被过滤。\n\
    \n+   确保在 /etc/postfix/main.cf 中激活 Procmail：\n\n```\nmailbox_command = /usr/bin/procmail\n\
