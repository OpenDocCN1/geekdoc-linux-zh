    Everything udev does, depends on rules, defined in configuration files under /etc/udev/rules.d/,
    which are used to process a uevent.


    A detailed description of udev rules is beyond the scope of this course. However,
    in the following you find the most important facts:


    +   - udev rules are spread over several files, which are processed in alphabetical
    order. Each line in these files is a rule. Comments can be added with the # character.

