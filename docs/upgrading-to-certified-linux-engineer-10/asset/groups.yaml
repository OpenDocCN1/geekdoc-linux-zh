    ## SECTION 14 AppArmor


    Novell AppArmor is a mandatory access control scheme that lets you specify on
    a per program basis which files the program may read, write, and execute.


    AppArmor secures applications by enforcing good application behavior without relying
    on attack signatures, so it can prevent attacks even if the attacks are exploiting
    previously unknown vulnerabilities.


    ## Objectives


    - 1. Improve Application Security with AppArmor

    - 2. Create and Manage AppArmor Profiles

    - 3. Control AppArmor

    - 4. Monitor AppArmor


    ## Objective 1


    ### Improve Application Security with AppArmor


    While you can keep your software up to date, you can still be hit with an attack
    that exploits a vulnerability that is not yet known or for which there is no fix
    yet.


    The idea of AppArmor is to have the kernel limit what a software program can do.
    In addition to the limitations set by the usual user and group permissions, limitations
    are imposed based on a set of rules for a specific program.


    Often an intruder does not directly gain root privileges. By exploiting a vulnerability
    in, for instance, a web server, she might be able to start a shell as the user
    running the web server. With that unprivileged access, she exploits yet another
    vulnerability in some other software program to gain root access.


    With AppArmor, even if an intruder manages to find a vulnerability in some server
    software, the damage is limited due to the fact that the intruder may not access
    any files or execute any programs beyond what the application is allowed by AppArmor’s
    rule set to access or execute in routine operation.


    This concept is not limited to normal accounts; it also limits to a certain extent
    what an application running with root privileges may do. A confined process cannot
    call certain system calls, even if running as root. Thus even if an attacker gained
    root privileges, she would still be limited in what she might be able to do.


    The AppArmor kernel modules (apparmor and aamatch_pcre) hook into the Linux Security
    Modules Framework of the kernel.


    Profiles in /etc/apparmor.d/ are used to configure which application may access
    and execute which files.


    AppArmor has to be activated before the applications it controls are started.
    Applications already running when AppArmor is activated are not controlled by
    AppArmor, even if a profile has been created for them. Therefore, AppArmor is
    activated early in the boot process by /etc/init.d/boot.apparmor.


    In a default installation of SUSE Linux Enterprise Server 10, AppArmor is actively
    protecting several services using a set of profiles provided by Novell. Using
    the provided YaST modules or command line tools, you can easily adapt these to
    your needs and create new profiles for additional applications you want to protect.


    As a general rule, you should confine programs that grant privilege, i.e., programs
    that have access to resources that the person using the program does not have:


    - Network agents—programs that have open network ports

    - Cron jobs

    - Web applications


    At some points in the documentation of AppArmor you will find AppArmor''s former
    name, Subdomain.


    ## Objective 2 Create and Manage AppArmor Profiles


    SUSE Linux Enterprise Server 10 comes with AppArmor Profiles for various applications,
    such as named, ntpd, nscd, and others.


    The profiles are contained in /etc/apparmor.d/. The filename of the profile represents
    the filename of the application including the path, with "/" being replaced by
    a "_". The profile for /usr/sbin/squid would be contained in /etc/apparmor.d/usr.sbin.squid.


    A profile can include other files with an #include statement. The directory /etc/apparmor/abstractions/
    contains several files that are intended to be included in profiles, depending
    on the kind of program to be protected by AppArmor. There are abstractions for
    files that should be readable or writable by all programs (base), for nameservice-related
    files like /etc/passwd (nameservice), for files related to console operations
    (console), and others.


    The profiles are plain text files and it is therefore possible to create and modify
    them with any text editor. However, command line tools as well as a YaST module
    greatly simplify the process of creating profiles.


    In addition to the active profiles in /etc/apparmor.d/, several profiles are already
    prepared in /etc/apparmor/profiles/extras/ that you can customize to your needs
    and copy to /etc/apparmor.d/ to activate them.


    To successfully administer AppArmor, you need to


    - Understand Profiles and Rules

    - Administer AppArmor Profiles with YaST

    - Administer AppArmor Profiles with Command Line Tools

