    Dynamic updates are stored in a journal file for the zone. This file is automatically
    generated by the server when the first dynamic update is performed. The name of
    the journal file is created by appending the extension .jnl to the name of the
    corresponding zone file. The journal file is in a binary format and should not
    be edited manually.


    The contents of the journal file are written to the zone file every 15 minutes.
    When the name server is shut down, the contents of the journal file are written
    to the zone file, too.


    > Dynamic updates will change the layout of your zone files when the data is written
    to them. You should either use an editor or nsupdate to modify your zone information
    instead of using both tools.


    The most important nsupdate options are


