  md: "\n## Objective 6\n\n### Understand Xen Networking\n\nUsually the network connection\
    \ of Xen domains works out of the box. However, in case you would like to change\
    \ the configuration, networking with Xen can be a bit tricky. The following should\
    \ give you an overview of how Xen domains are connected to the physical network.\n\
    \nTo better understand the concept of Xen networking, do the following:\n\n- Understand\
    \ the Basic Networking Concept\n- Understand Bridging\n- Understand the Network\
    \ Interfaces in domain0\n\n### Understand the Basic Networking Concept\n\nIn a\
    \ Xen setup, domain0 is controlling the physical network interfaces of a host\
    \ system. Unprivileged domains are connected to domain0 through virtual ethernet\
    \ adapters.\n\nOne virtual adapter in an unprivileged domain is connected to one\
    \ virtual adapter in domain0.\n\nIn domain0, standard Linux networking mechanisms\
    \ like bridging or routing are used to connect the virtual adapters through the\
    \ physical adapter to the network.\n\nThe following is an illustration of this\
    \ basic concept:\n\n### Figure 8-10\n\n![](img/8279afe915b153902294b0e58311b75a_166_0.png)\n\
    \n### Understand Bridging\n\nOn SUSE Linux Enterprise Server 10, the default mechanism\
    \ to connect virtual and physical interfaces in domain0 is bridging. Other mechanisms\
    \ like routing with or without Network Address Translation (NAT) are out of the\
    \ scope of this course.\n\nBridging basically means that multiple network interfaces\
    \ are combined to one. Traditionally this technique is used to connect two physical\
    \ network interfaces or network segments.\n\nIn a Xen system, bridging is used\
    \ to connect virtual and physical network adapters in domain0. In a Xen system,\
    \ you can consider the bridge as a kind of virtual switch which all virtual and\
    \ physical interfaces are connected to.\n\nThe configuration of the bridge is\
    \ done by the xend management process. When a new domain is created, the following\
    \ changes to the network configuration are made (simplified):\n\n1. Xen provides\
    \ a virtual interface to the new domain.\n2. xend creates a new virtual interface\
    \ in domain0.\n3. Both virtual interfaces are connected through a virtual point\
    \ to point connection.\n4. The virtual interface in domain0 is added to the bridge\
    \ with the physical interface.\n\nThese steps only affect the general network\
    \ connectivity. The IP configuration in the Xen domains has to be done separately\
    \ with DHCP or a static network configuration.\n\nxend is performing these network\
    \ changes with the help of scripts, which are located at **/etc/xen/scripts/**.\
    \ The following scripts are used for bridged networking:\n\n- **network-bridge.**\
    \ This script is called initially when xend is started. It sets up the bridge\
    \ **xenbr0** and moves the physical interfaces onto that bridge.\n- **vif-bridge.**\
    \ This script is called for every domain that is started and adds the virtual\
    \ interface to the bridge.\n\nIn the file **/etc/xen/xend-config.sxp** you can\
    \ configure which network scripts are used by xend.\n\n### Understand the Network\
