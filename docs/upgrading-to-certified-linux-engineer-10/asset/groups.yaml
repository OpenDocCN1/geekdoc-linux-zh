    \ 不是守护进程，其意义略有不同。\n\n要控制 AppArmor，你需要知道如何\n\n- Start and Stop AppArmor\n- View\
    \ AppArmor's Status\n- Reload Profiles\n\n### Start and Stop AppArmor\n\n要限制应用程序，AppArmor\
    \ 必须在应用程序启动之前处于活动状态。因此，AppArmor 通常在启动过程的早期激活。\n\n如果你不再希望 AppArmor 限制你的应用程序，使用\
    \ **rcapparmor stop**。这会卸载配置文件，但 AppArmor 内核模块 apparmor 和 aamatch_pcre 仍保持加载。**rcapparmor\
    \ kill** 也会卸载内核模块。在这两种情况下，应用程序都不会再被限制。\n\n**rcapparmor start** 激活 AppArmor。但是，只有在\
