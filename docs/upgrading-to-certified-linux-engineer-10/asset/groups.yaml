    udev can help to make this more predictable. With the help of sysfs, udev can
    find out, which device is connected to which interface file. The easiest solution
    for persistent device names would be to rename the interface files, for example
    from /dev/sda1 to /dev/camera.


    Unfortunately, interface files can not be renamed under Linux. The only exeption
    to this rule are network interfaces, which traditionally have no interface files
    under /dev.


    Therefore udev uses a different approach. Instead of renaming an interface file,
    a link with a unique and persistent name is created to the assigned interface
    file.


    By default udev is for example configured to create these links for all storage
    devices. For each device, a link is created in each of the following subdirectories
    under /dev/disk/:


    +   - **by-id**. The name of the link is based on the vendor and on the name of
    a device.

    +   - **by-path**. The name of the link is based on the bus position of a device.

    +   - **by-uuid**. The name of the link is based on the serial number of a device.


    The udev rules which create these links are located in the file /etc/udev/rules.d/60-persistent-storage.rules.


    This means, that the association between devices and interface files still depends
    on the order in which the drivers are loaded or in which order devices are connected
    with the system.


    With udev however, persistent links are created and adjusted everytime the device
    configuration changes.


    As mentioned before, network interfaces are treated differently. They don’t have
    interface files and they can be directly renamed by udev.'
  - '[PAGE 66]


    Persistent network interfaces are configured as udev rule in the file **/etc/udev/rules.d/30-net_persistent_names.rules**


    The following is an example rule:


    ```

    SUBSYSTEM=="net", ACTION=="add", SYSFS{address}=="00:30:05:4b:98:85",

    IMPORT="/sbin/rename_netiface %k eth0"

    ```


    The matching key SYSFS{address} is used to identify a network device by it''s
    MAC address. At the end of the rule, the name of the interface is given. In this
    example eth0.


    ![](img/8279afe915b153902294b0e58311b75a_66_0.png)


    In SUSE Linux Enterprise Server 9, it was possible to configure persistent network
    interface names in the interface configuration files under /etc/sysconfig/network.
    This is not supported anymore in SUSE Linux Enterprise Server 10. Interface names
    now have to be configured in the udev rule.'
