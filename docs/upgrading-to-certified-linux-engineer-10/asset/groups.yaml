    # Summary


    | Objective | Summary |

    |---|---|

    | 1. Configure DHCP Pools | The pool declaration can be used to specify a pool
    of addresses that will be treated differently than any other pool of addresses,
    even on the same network segment or subnet. |

    | 2. Configure DHCP Failover | The failover protocol allows two DHCP servers to
    share a common address pool.


    If one server fails, the other server will continue to renew leases out of the
    pool and will allocate new addresses.


    The failover protocol defines a primary server role and a secondary server role.


    In order to configure failover, you need to write a peer declaration in the file
    /etc/dhcpd.conf that configures the failover protocol, and you need to write peer
    references in each pool declaration for which you want to do failover. |'
