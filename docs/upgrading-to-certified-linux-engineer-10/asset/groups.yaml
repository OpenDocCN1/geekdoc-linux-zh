  mdcn: "\n\n使用按钮 **Add**、**Edit** 或 **Delete**，你可以安排新的安全事件报告，编辑现有的报告，例如设置应接收报告的电子邮件地址，或删除事件报告。\n\
    \n选择一份报告然后选择 **Run Now** 要么直接显示结果，要么在安全事件报告的情况下，首先打开一个对话框让你可以微调生成报告的内容：\n\n##\
