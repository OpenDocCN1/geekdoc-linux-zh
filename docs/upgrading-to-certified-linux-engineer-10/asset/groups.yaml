  - '[PAGE 62]


    # Objective 6 Describe how udev Works


    Before you can use a hardware device, you need to load the appropriate driver
    module and set up the corresponding interface. For most devices in SUSE Linux
    Enterprise Server 10, this is done by udev.


    To get an overview about udev, do the following:


    +   - Understand the Purpose of udev

    +   - Understand how udev Works

    +   - Understand Persistent Interface Names


    # Understand the Purpose of udev


    udev has three main purposes:


    +   - **Create device files.** The most obvious task of udev is to create device
    files under /dev automatically when a device is connected to the system. Before,
    the /dev directory was populated with every device, that might appear in the system.
    This led to a very complex and confusing /dev directory, as most of the device
    files were actually not used.

    +   - **Persistent device names.** Another advantage of udev is that it provides
    a mechanism for persistent device names.

    +   - **Hotplug replacement.** In SUSE Linux Enterprise Server 10, udev also replaces
    the hotplug system, which was responsible for the initialization of hardware devices
    in previous versions. udev is now the central point for hardware initialization
    in SUSE Linux Enterprise Server 10.'
  - '[PAGE 63]


    # Understand how udev Works


    udev is implemented as a daemon (udevd), which is started at boot time through
    the script /etc/init.d/boot.d/S03boot.udev. udev communicates with the Linux kernel
    through the uevent interface. When the kernel sends out a uevent message that
    a device has been added or removed, udevd does the following, based on the udev
    rules:


    +   - Initializes devices by calling hwup.

    +   - Creates device files in /dev.

    +   - Sets up network interfaces with ifup.

    +   - Renames network interfaces, if necessary.

    +   - Mounts storage devices which are identified as hotplug in /etc/fstab.

    +   - Informs other applications through HAL (Hardware Abstraction Layer) about
    the new device.


    To handle uevent messages, which have been issued before udevd was started, the
    udev start script triggers these missed events by parsing the sysfs filesystem.
    In previous SUSE Linux Enterprise Server versions, this part of the system initialisation
