  - '[PAGE 301]


    # Part III - Change /etc/amavisd.conf


    +   1. Open the file /etc/amavis.conf by entering

    +   vi /etc/amavis.conf


    +   2. Modify the $mydomain variable to

    +   $mydomain = ''digitalairlines.com'';


    +   3. Change the mail address where virus notifications should be sent to root:

    +   $virus_admin = "root@$mydomain";


    +   4. Exit vi by entering :wq.


    +   5. Start the AMAViS by entering rcamavis start.


    # Part IV - Test the Configuration


    +   1. Check whether Postfix listens on port 10025 by entering

    +   telnet 127.0.0.1 10025


    +   2. Enter quit.


    +   3. Check whether the AMAViS listens on port 10024 by entering

    +   telnet 127.0.0.1 10024


    +   4. Enter mail from: jgoldman@digitalairlines.com


    +   5. Enter rcpt to: geko@digitalairlines.com


    +   6. Enter data


    +   7. Open the file /usr/share/doc/packages/amavisd-new/test-messages/sample-virus-simple.txt
    and copy the last line into the clipboard. The line looks like this:

    +   X50!P''% @AP!4PZX54(P^)7CC)7)$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
  - '[PAGE 302]


    8. Paste the content of the clipboard into the first terminal and do the following:


    +   a. Press Enter.

    +   b. Type . (dot).

    +   c. Press Enter.


    9. You should get a virus warning like the following one:


    250 2.7.1 Ok, discarded, id=14069-01-2 - VIRUS: Eicar-Test-Signature


    10. Enter quit.


    # Part V - Send a Virus Email


    +   1. Log in as user jgoldman by entering su - jgoldman.

    +   2. Send a virus mail to user tux by entering mail geeko@digitalairlines.com
    < /usr/share/doc/packages/amavisd-new/test-messages/sample-virus-simple.txt

    +   3. Log out by entering exit.

    +   4. As root, enter mail to look for new email.


    There should be an email from virusalert in your mail folder.


    (End of Exercise)'
  - '[PAGE 303]


    # Summary


    | Objective | Summary |

    |---|---|

    | 1. Understand SMTP Communication | The following SMTP commands must be implemented
    in an SMTP server to provide SMTP communication:

    - HELO

    - MAIL FROM:

    - RCPT TO:

    - DATA

    - RSET

    - NOOP

    - QUIT |


    | Objective | Summary |

    |---|---|

    | 2. Manage Spam | **spamassassin** (and **spamc**) expect their input from STDIN.


    If you want to use SpamAssassin with your Postfix configuration, the easiest way
    is to use Procmail.


    Spam can be filtered from the mail client or in a further Procmail configuration
    (~/.procmailrc).


    You can use **telnet** to test your configuration. You also can send a spam email
    directly using the **sendmail** command. |'
  - '[PAGE 304]


    | Objective | Summary |

    |---|---|

    | 3. Use a Virus Scanner for Email | AVMailGate is an antivirus email filter from
    H+BEDV Datentechnik GmbH.


    AVMailGate can update the virus definition file and the engine itself.


    AVMailGate is composed of two kinds of processes:


    - av gated. The smtpd receiver that stores incoming email in the input queue.

    - avgatefwd. Virus scanning function and SMTP forwarder and sendmail invoker.


    Both processes can be configured by editing the file `/etc/avmailgate.conf.`


    AMaViSd-new consists of


    - The daemon.

    - Optional helper programs that are only needed in setup between the message transfer
    agent (MTA).

    - One or more content checkers: virus scanners such as SpamAssassin.


    The email server sends all incoming and outgoing email to AMaViS d.


    The emails will be extracted by AMaViS d-new and tested with a virus scanner.
    |'
  - '[PAGE 305]


    | Objective | Summary |

    |---|---|

    | 3. Use a Virus Scanner for Email (continued) | If no viruses are found, AMaViSd-new
    sends the email back to the mail server ready for delivery.


    AMaViSd-new is configured in the file /etc/amavisd.conf. |'
  - '[PAGE 306]


