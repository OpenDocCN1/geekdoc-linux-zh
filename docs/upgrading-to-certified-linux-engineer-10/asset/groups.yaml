    # SECTION 11 Manage OpenLDAP


    OpenLDAP is the most popular open source LDAP suite. It provides not only the
    LDAP server itself, but also applications and tools to control and query the server
    and to develop LDAP-based software.


    # Objectives


    +   1. Install and Set Up an OpenLDAP Server

    +   2. Activate LDAP Authentication

    +   3. Replicate OpenLDAP Servers'
  - '[PAGE 207]


    # Objective 1


    # Install and Set Up an OpenLDAP Server


    To install and set up an OpenLDAP server, you need to do the following:


    +   - Install the Required Software and Start the Server

    +   - Configure OpenLDAP with YaST

    +   - Edit the OpenLDAP Configuration Files


    # Install the Required Software and Start the Server


    Normally, you can set up an OpenLDAP server with YaST during the installation
    process of SUSE Linux Enterprise Server 10.


    Select OpenLDAP Server in the Installation Settings dialog.


    # Figure 11-1


    ![](img/8279afe915b153902294b0e58311b75a_207_0.png)'
  - '[PAGE 208]


    The important values are entered automatically in the text fields. A warning informs
    you that any change will disable the automatic generation of base DN, root DN,
    and the LDAP password.


    # Figure 11-2


    ![](img/8279afe915b153902294b0e58311b75a_208_0.png)


    Select OK and enable the OpenLDAP server by selecting Enable Server.


    # Figure 11-3


    ![](img/8279afe915b153902294b0e58311b75a_208_1.png)'
  - '[PAGE 209]


    If you want to authenticate via LDAP, select **LDAP** in the **User Authentication
    Method** dialog.


    # Figure 11-4


    ![](img/8279afe915b153902294b0e58311b75a_209_0.png)'
  - '[PAGE 210]


    In the next dialog, you can enter the configuration of your LDAP client.


    # Figure 11-5


    ![](img/8279afe915b153902294b0e58311b75a_210_0.png)


    Here you can enter the following information:


    +   - **User Authentication**. Select the kind of user authentication:

    +     - Do Not Use LDAP. LDAP is not used for user authentication.

    +     - Use LDAP. LDAP is used for user authentication.

    +     - Use LDAP but Disable Logins. LDAP is used for user authentication, but
    the users are not able to log in to this machine anymore.


    +   - **Addresses of LDAP Servers**. Enter the name or the IP address of your
    LDAP server here. If the IP of your LDAP server is provided via SLP, you can select
    Find.'
  - '[PAGE 211]


    +   - **LDAP base DN.** Enter the DN of the root of your LDAP tree here. Select
    Fetch DN if you want to browse the LDAP tree of your LDAP server.

    +   - **LDAP TLS/SSL.** If your LDAP server supports encryption, activate this
    option.

    +   - **LDAP Version 2.** The current LDAP protocol version is 3. If you want
    to use the older version 2, select this option.

    +   - **Start Automounter.** Starts the automounter daemon which mounts directories
    automatically when they are used.


    # Configure OpenLDAP with YaST


    However, if you chose not to install the server during installation, you can set
    up an LDAP server by installing the following software packages with YaST:


    +   - openldap2

    +   - openldap2-client

    +   - pam_ldap

    +   - nss_ldap


    In YaST two modules concerning OpenLDAP are available:


    +   - YaST Module for the LDAP Server

    +   - YaST Module for the LDAP Client'
