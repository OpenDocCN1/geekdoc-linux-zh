    \ that you use `modprobe -r` for removing modules.\n+   - **modprobe module.**\
    \ This command loads the indicated *module* into the kernel or removes it (with\
    \ option -r).\n+   \n+   Dependencies of other modules are taken into account\
    \ when using modprobe. In addition, modprobe reads in the file `/etc/modprobe.conf`\
