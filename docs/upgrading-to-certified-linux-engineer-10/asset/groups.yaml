    # **Exercise 12-1 Use AVMailGate as a Virus Scanner for Email**


    In this exercise, you install and configure AVMailGate as a virus scanner for
    mails. Finally, you update the AVMailGate virus signatures.


    +   Do the following:

    +   - Part I - Install AVMailGate

    +   - Part II - Configure Postfix to Use AVMailGate as Content Filter

    +   - Part III - Configure the Ports for AVMailGate to Use

    +   - Part IV - Check Configuration Using a Virus File from CD

    +   - Part V - Update Your Virus Signatures


    # **Part I - Install AVMailGate**


    +   1. From the main menu, start YaST.

    +   2. Enter the root password (novell) and select OK.

    +   3. From the YaST Control Center, select Software > Software Management.

    +   4. From the filter drop-down menu, select Search.

    +   5. In the Search field, enter avmailgate; then select Search.

    +   6. On the right, select the avmailgate package.

    +   7. Select Accept; then insert the SUSE Linux Enterprise Server 10 DVD.

    +   8. Select Continue to resolve dependencies.

    +   9. When installation is complete, remove the DVD and close the YaST Control
    Center.'
  - '[PAGE 284]


    # Part II - Configure Postfix to Use AVMailGate as Content Filter


    +   1. Open the file /etc/postfix/master.cf in a text editor.

    +   2. Uncomment the following line (on one line):

    +      localhost:10025 inet n - n - smtpd -o content_filter=

    +   3. Add the following line in /etc/postfix/main.cf:

    +      content_filter = smtp:127.0.0.1:10024

    +   4. Save the file.

    +   5. Enter postfix reload.


    # Part III - Configure the Ports for AVMailGate to Use


    +   1. To ensure that AVMailGate listens on port 10024 and not on port 25, edit
    /etc/avmailgate.conf:

    +      ListenAddress 127.0.0.1 port 10024

    +   2. To ensure that AvMailGate sends mails back to Postfix via SMTP on host
    localhost via port 10025, edit /etc/avmailgate.conf:

    +      ForwardTo SMTP: localhost port 10025

    +   3. Because AvMailGate sends out notification messages as AvMailGate, set an
    alias in /etc/aliases:

    +      avmailgate: root

    +   4. Enter newaliases.

    +   5. Enter rcavgate start.


    # Part IV - Check Configuration Using a Virus File from CD


    +   1. Log in as user geeko.

    +   2. Send an infected mail to user root by entering

    +      mail root -s "Virus Test" -a /media/cdrecorder/section_4/sample-virus-executable.txt'
  - '[PAGE 285]


    3. Enter some text for the email message

    This is an infected mail.

    .


    4. Log in as user root.


    5. Check whether the mail queue is empty by entering mailq


    6. Check whether the infected mail arrived by entering mail


    7. Check whether the infected mail was detected by entering ls /var/spool/avmailgate/rejected


    # Part V - Update Your Virus Signatures


    1. To check for a new version of the virus signatures, enter /usr/lib/AntiVir/antivir
    --update --check


    2. To download the virus signatures, enter /usr/lib/AntiVir/antivir --update


    (End of Exercise)'
  - '[PAGE 286]


    # AMaViSd-new


    AMaViSd-new (A Mail Virus Scanner) consists of the daemon and some optional helper
    programs, which are only needed during setup between the message transfer agent
    (MTA) and one or more content checkers (virus scanners or SpamAssassin).


    The mail server sends all incoming and outgoing mails to AMaViSd. The email will
    be extracted and tested by AMaViSd-new.


    AMaViSd recognizes four kinds of unwanted mails. They are mails that have:


    +   1. Invalid headers

    +   2. Banned file types

    +   3. Viruses

    +   4. Spam


    AMaViSd tests incoming mails for these four types in the order listed.


    If nothing bad is found, AMaViSd-new will send the email back to the mail server,
    ready for delivery.


    By default, AMaViSd-new listens at port 10024 for incoming email from the mail
    server.


    AMaViSd-new sends clean mails to the mail server via port 10025. It is normally
    positioned at or near a central mail server, not necessarily where users'' mailboxes
    and final delivery takes place.


    This topic describes the following:


    +   - Install AMaViSd-new

    +   - Configure AMaViSd-new'
  - '[PAGE 287]


    # Install AMAViSd-new


    To install AMAViSd-new, select the package amavisd-new.


    AMAViSd-new will not work if no virus scanner is installed on your system. If
    you want to use AMAViSd-new only for spam filtering, search for @bypass_virus_checks_acl
    in /etc/amavisd.conf and remove the comment sign ("#") at the beginning of the
    line.


    The compressing tools gzip, bzip2, arc, lha, unrar, zoo, cpio, and lzop should
    be installed, too.


    During the SUSE Linux Enterprise Server 10 installation, a user vscan is created.
    It is used for AMAViSd.


    ```

    da51:~# grep vscan /etc/passwd

    vscan:x:65:104:vscan account:/var/spool/amavis::/bin/false

    ```


    After installing AMAViSd-new, you can start the daemon with rcmavis start.


    The daemon should listen on port 10024.


    ```

    da51:~# telnet 127.0.0.1 10024

    Trying 127.0.0.1...

    Connected to 127.0.0.1.

    Escape character is ''^]''.

    220 [127.0.0.1] ESMTP amavisd-new service ready

    ```'
