    - 安装 SUSE Linux Enterprise Server 10

    - 使用 GNOME 桌面环境

    - 管理硬件

    - 配置 Linux 文件系统分区

    - 使用 NetworkManager 配置网络

    - 管理用户访问和安全

    - 使用 Syslog 守护进程 syslog-ng

    - 使用 Xen 管理虚拟化

    - 使用 BIND 配置 DNS 服务器

    - 配置 DHCP 池和故障转移

    - 管理 OpenLDAP

    - 配置邮件服务器

    - 应用安全

    - AppArmor


    ## 受众


    本课程面向 Novell 认证 Linux 工程师或具有同等知识的人员。本课程内容结合全球 Novell 培训合作伙伴提供的升级研讨会，是参加 Novell
    认证 Linux 工程师 10（CLE 10）实践考试的理想准备。


    '
