    \ that define\n# the central authentication scheme for use on the system\n# (e.g.,\
    \ /etc/shadow, LDAP, Kerberos, etc.). The default is to use the\n# traditional\
    \ Unix authentication mechanisms.\n#\nauth\trequired\tpam_env.so\nauth\trequired\t\
