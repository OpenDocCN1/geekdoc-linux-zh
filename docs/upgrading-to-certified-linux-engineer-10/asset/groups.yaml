    Using the buttons **Add**, **Edit**, or **Delete**, you can schedule new security
    incident reports, edit the existing ones, for instance, to set the email address
    that should receive the report, or delete event reports.


    Selecting a report and then selecting **Run Now** either shows the result directly,
    or, in the case of the Security Incident Report, first opens a dialog where you
    can fine tune the content of the resulting report:


    # Figure 14-8


    ![](img/8279afe915b153902294b0e58311b75a_352_0.png)'
  - '[PAGE 353]


    The help text on the left explains the available options. Once you configured
    what you want to have included in your report, select Next. The report is displayed,
    showing the security events:


    # Figure 14-9


    ![](img/8279afe915b153902294b0e58311b75a_353_0.png)


    Depending on your configuration in the previous dialog, it is also saved to disk,
    by default in the directory /var/log/apparmor/reports-exported/.'
