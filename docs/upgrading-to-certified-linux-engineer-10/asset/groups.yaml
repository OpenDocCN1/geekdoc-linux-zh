    \ 文件。\n- **Linux-PAM 系统管理员指南。** 本文档包含系统管理员应了解的关于 PAM 的所有内容。\n\n本文档讨论了一系列主题，从配置文件的语法到\
    \ PAM 的安全方面。该文档提供 PDF 文件、HTML 格式和纯文本格式。\n- **Linux-PAM 模块编写者手册。** 本文档从开发者的角度总结了该主题，包含如何编写符合标准的\
    \ PAM 模块的信息。该文档提供 PDF 文件、HTML 格式和纯文本格式。\n- **Linux-PAM 应用程序开发者指南。** 本文档包含希望使用\
    \ PAM 库的应用程序开发者所需的一切。该文档提供 PDF 文件、HTML 格式和纯文本格式。\n\n还有一些 PAM 模块的手册页，例如 `man pam_unix2`。\n\
    \nc. 在以下行的开头添加一个 `#` 号，如下所示：\n`#auth required pam_nologin.so`\n此 PAM 模块在系统认证期间必须成功。它会检查文件\
    \ `/etc/nologin` 是否存在，如果存在，此 PAM 模块会通过返回失败状态来阻止普通用户登录。\n现在这一行已被注释掉，PAM 将不再检查该文件。这意味着所有用户都可以登录，即使该文件存在。\n\
    \nd. 按 Esc 返回命令模式；输入 `:w` 保存文件。\n\n## 8. 测试修改后的 PAM 配置文件：\n\n- a. 切换到虚拟控制台 4（`Alt+F4`）。\n\
    - b. 尝试以 `geeko`（密码 `novell`）登录。\n- 您能够登录，因为 PAM 不再检查文件 `/etc/nologin`。\n- c.\
    \ 输入 `exit` 以 `geeko` 身份注销。\n\n## 9. 编辑文件 `/etc/pam.d/login` 以取消注释 `pam_nologin.so`\
    \ 行：\n\n- a. 切换到虚拟控制台 3（`Alt+F3`）。\n- b. 取消注释 `pam_nologin.so` 行（删除之前输入的 `#` 号），使其看起来像这样：\n\
    \  `auth required pam_nologin.so`\n- c. 按 Esc 返回命令模式；输入 `:wq` 保存文件并退出 vi。\n\n\
    ## 10. 在虚拟控制台 4 上，尝试以 `geeko` 登录。\n\n您将再次收到“Login incorrect”消息。\n\n## 11. 作为 root\
    \ 用户在虚拟控制台 3 上删除文件 `/etc/nologin`，输入\n\n```\nrm /etc/nologin.\n```\n\n- 12. 在虚拟控制台\
    \ 4 上，再次尝试以 **geeko** 登录。\n- 由于文件 `/etc/nologin` 不存在，普通用户的登录已重新启用。\n\n- 13. 输入\
    \ **exit** 以 `geeko` 身份注销。\n\n- 14. 切换到虚拟控制台 3，输入 **exit** 以 root 身份注销。\n\n- 15.\
    \ 按 **Alt+F7** 返回桌面。\n\n（练习结束）\n\n## 目标 2 配置安全设置\n\nYaST 提供一个本地安全模块，可让您为 SUSE\
    \ Linux Enterprise Server 配置以下本地安全设置：\n\n- 密码设置\n- 启动配置\n- 登录设置\n- 用户创建设置\n- 文件权限\n\
    \n您可以从三个预设的安全级别中选择（或修改），或创建自己的自定义安全设置，以满足您企业安全策略和程序的要求。\n\n您可以通过从 YaST 控制中心选择“安全和用户\
    \ > 本地安全”，或在终端窗口中输入 `yast2 security`（以 root 身份），访问安全设置模块。\n\n## 图 6-3\n\n出现以下内容：\n\
    \n![](img/8279afe915b153902294b0e58311b75a_108_0.png)\n\n在此对话框中，您可以选择以下预设配置之一：\n\
    \n- **家庭工作站。** 选择此选项适用于未连接任何类型网络的家庭计算机。此选项代表最低级别的本地安全。\n- **网络工作站。** 选择此选项适用于连接到任何类型网络或互联网的计算机。此选项提供中级本地安全。\n\
    - **网络服务器。** 选择此选项适用于提供任何类型服务（网络或其他）的计算机。此选项启用高级本地安全。\n- 您还可以选择**详细信息**或**自定义设置**来修改现有的安全级别或创建您自己的配置。\n\
    \n"
