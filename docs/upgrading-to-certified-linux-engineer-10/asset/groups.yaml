    \ **depmod.** This command creates the file `/lib/modules/version/modules.dep`.\
    \ This file contains the dependencies of individual modules on each other.\n+\
    \   \n+   When a module is loaded (such as with modprobe), modules.dep ensures\
    \ that all modules it depends on are also loaded.\n+   \n+   If the file modules.dep\
    \ does not exist, it is created automatically when the system starts by the start\
    \ script `/etc/init.d/boot`. For this reason, you do not need to create the file\
    \ manually."
