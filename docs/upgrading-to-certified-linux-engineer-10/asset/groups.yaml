    \ peer \"digitalairlines\" {\n    primary;\n    address 10.0.0.10;\n    port 847;\n\
    \    peer address 10.0.0.12;\n    peer port 647;\n    max-response-delay 180;\n\
    \    mclt 1800;\n    split 128;\n    load balance max seconds 3;\n}\n# Now we\
    \ include the identical configuration on both\n# machines\ninclude \"/etc/dhcpd.conf.master\"\
    ;\n```\n\nThe statements in this example peer declaration are as follows:\n\n\
    - **primary and secondary.** Determines whether the server is primary or secondary,\
    \ as described earlier.\n- **address.** Specifies the IP address or DNS name on\
    \ which the server should listen for connections from its failover peer.\n- **port.**\
    \ Specifies the TCP port on which the server should listen for connections from\
    \ its failover peer (default: 647 and 847). This parameter must be specified,\
    \ because the failover protocol does not yet have a reserved TCP port number.\n\
    - **peer address.** Specifies the IP address or DNS name to which the server should\
    \ connect to reach its failover peer.\n- **peer port.** Specifies the TCP port\
    \ to which the server should connect to reach its failover peer for failover messages.\
    \ This parameter must be specified, because the failover protocol does not yet\
    \ have a reserved TCP port number. The peer port can be the same as the port.\n\
    - **max-response-delay.** Specifies how many seconds the DHCP server waits without\
    \ receiving a message from its failover peer before it assumes that connection\
    \ has failed.\n\nThis number should be small enough that a transient network failure\
    \ breaks the connection will not result in the servers being out of communication\
    \ for a long time, but large enough that the server isn't constantly making and\
    \ breaking connections.\n\nThis parameter must be specified.\n\n- **mclt.** Defines\
    \ the Maximum Client Lead Time. It must be specified on the primary, and can be\
    \ specified also on the secondary server. This is the length of time for which\
    \ a lease may be renewed by either failover peer without contacting the other.\n\
    \nThe longer you set this, the longer it will take for the running server to recover\
    \ IP addresses after moving into PARTNER-DOWN state. The shorter you set it, the\
    \ more load your servers will experience when they are not communicating.\n\n\
    A value of 1800 is recommended.\n\n- **split.** Specifies the split between the\
    \ primary and secondary server for the purposes of load balancing.\n\nWhenever\
    \ a client makes a DHCP request, the DHCP server runs a hash on the client identification.\
    \ If the hash comes out to less than the split value, the primary answers. If\
    \ it comes out to equal to or more than the split, the secondary answers.\n\n\
    A meaningful value is 128 and can only be configured on the primary server.\n\n\
    - **load balance max seconds.** Specifies a cutoff after which load balancing\
    \ is disabled. The cutoff is based on the number of seconds since the client sent\
    \ its first DHCPDISCOVER or DHCPREQUEST message.\n\nThe man pages recommend setting\
    \ this to 3 or 5. The effect of this is that if one of the failover peers gets\
    \ into a state where it is responding to failover messages but not responding\
