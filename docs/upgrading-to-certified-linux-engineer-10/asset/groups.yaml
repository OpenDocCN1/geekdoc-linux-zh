    ## SECTION 4 Configure Linux File System Partitions


    This section introduces some commands you need to manage your Linux file system
    partitions.


    ### Objectives


    - 1. Finalize Partitioning

    - 2. Configure LVM with Command Line Tools


    ## Objective 1 Finalize Partitioning


    The program fdisk is used for partitioning hard disks from the command line.


    ```

    dal0:~ # fdisk /dev/sda


    The number of cylinders for this disk is set to 1111.

    There is nothing wrong with that, but this is larger than 1024,

    and could in certain setups cause problems with:

    1) software that runs at boot time (e.g., old versions of LILO)

    2) booting and partitioning software from other OSs

    (e.g., DOS FDISK, OS/2 FDISK)


    Command (m for help):

    ```


    To actually write your changes to the partition table on the disk, enter w (write).


    ```

    Command (m for help): w

    The partition table has been altered!


    Calling ioctl() to re-read partition table.


    WARNING: Re-reading the partition table failed with error 16: Device or resource
    busy.

    The kernel still uses the old table.

    The new table will be used at the next reboot.

    Syncing disks.

    ```


    When the new table is written, you are not asked for confirmation if you really
    want to do this.


    As the output of fdisk says, you cannot directly use the new partition to create
    a file system on a new partition. You could now reboot as suggested, but you can
    also use the program partprobe to get the kernel to use the new partition table.


    pvscan shows the physical volumes and their use:


    ```

    dal10:~ # pvscan

    PV /dev/hda9   lvm2 [242,95 MB]

    Total: 1 [242,95 MB] / in use: 0 [0 ] / in no VG: 1 [242,95 MB]

    ```


    The tool pvmove is used to move data from one physical volume to another (providing
    there is enough space), in order to remove a physical volume from LVM.


    ## Tools to Administer Volume Groups


    The tool vgcreate is used to create a new volume group. To create the volume group
    system, and add the physical volume /dev/hda9 to it, enter:


    ```

    dal10:~ # vgcreate system /dev/hda9

    Volume group "system" successfully created

    dal10:~ # pvscan

    PV /dev/hda9   VG system lvm2 [240,00 MB / 240,00 MB free]

    Total: 1 [240,00 MB] / in use: 1 [240,00 MB] / in no VG: 0 [0 ]

    ```


    pvscan shows the new situation.


    To add further physical volumes to the group, use vgexpand. Removing unused physical
    volumes is done with vgreduce after shifting data from the physical volume scheduled
    for removal to other physical volumes using pvmove. vgremove removes a volume
    group, providing there are no logical volumes in the group.


    ## Tools to Administer Logical Volumes


    To create a logical volume, use lvcreate, specifying the size, the name for the
    logical volume, and the volume group:


    ```

    dal0:~# lvcreate -L 100M -n data system

    Logical volume "data" created

    ```


    The next step is to create a file system within the logical volume and mount it:


    ```

    dal0:~# lvscan

    ACTIVE ''/dev/system/data'' [100.00 MB] inherit

    dal0:~# mkreiserfs /dev/system/data

    mkreiserfs 3.6.19 (2003 www.namesys.com)

    ReiserFS is successfully created on /dev/system/data.

    dal0:~# mount /dev/system/data /data

    ```


    As shown above, lvscan is used to view the logical volumes. It shows the device
    to use for the formatting and mounting.


    lvextend is used to increase the size of a logical volume. After that you can
    increase the size of the file system on that logical volume to make use of the
    additional space.


    Before you use lvreduce to reduce the size of a logical volume, you have to reduce
    the size of the file system. Only then reduce the size of the logical volume.
    If you cut off parts of the file system by simply reducing the size of the logical
    volume without shrinking the file system first, you will loose data.


    ## Summary


    | Objective | Summary |

    |---|---|

    | 1. Finalize Partitioning | After changing the partitions using fdisk, you cannot
    directly create a file system on the new partition. You could now reboot, but
    you can also use the program **partprobe**. |

    '
