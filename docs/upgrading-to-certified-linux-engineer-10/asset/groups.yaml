    \  \n+     The following is an example:\n+   \n+     `options ne io=0x300 irq=5`\n\
    \nFor more detailed information, enter man 5 modprobe.conf.\n\n![](img/8279afe915b153902294b0e58311b75a_56_0.png)"
  md: "\n## Manage Modules from the Command Line\n\nThe following are commands you\
    \ can use from a command line when working with modules:\n\n- **lsmod.** This\
    \ command lists the currently loaded modules in the kernel.\n\n  The following\
    \ is an example:\n\n  ```\nDAS50:~ # lsmod\nModule          Size  Used by\nquota_v2\
    \        12928  2\nedd             13720  0\njoydev          14528  0\nsg    \
    \          41632  0\nst              44956  0\nsr_mod          21028  0\nide_cd\
    \          42628  0\ncdrom           42780  2 sr_mod,ide_cd\nnvram           13448\
    \  0\nusbserial       35952  0\nparport_pc      41024  1\nlp              15364\
    \  0\nparport         44232  2 parport_pc,lp\nipv6            275348  44\nuhci_hcd\
    \        25728  0\nintel_agp       22812  1\nagpgart         36140  1 intel_agp\n\
    evdev           13952  0\nusbcore         116572  4 usbserial,uhci_hcd\n  ```\n\
    \n  The list includes information about the module name, size of the module, how\
    \ often the module is used, and by which other modules use it.\n\n- **insmod module.**\
    \ This command loads the indicated *module* into the kernel.\n\n  The module must\
    \ be stored in the directory `/lib/modules/version_number/`. However, it is recommended\
    \ to use modprobe for loading modules.\n\n- **rmmod module.** This command removes\
    \ the indicated *module* from the kernel. However, it can only be removed if no\
    \ processes are accessing hardware connected to it or corresponding services.\n\
    \n  We recommend that you use `modprobe -r` for removing modules.\n\n- **modprobe\
    \ module.** This command loads the indicated *module* into the kernel or removes\
    \ it (with option -r).\n\n  Dependencies of other modules are taken into account\
    \ when using modprobe. In addition, modprobe reads in the file `/etc/modprobe.conf`\
    \ for any configuration settings.\n\n  This command can only be used if the file\
    \ `/lib/modules/version/modules.dep` created by the command depmod exists. This\
    \ file is used to add or remove dependencies.\n\n  The kernel daemon (Kmod since\
    \ kernel version 2.2.x) ensures that modules needed in the running operation are\
    \ automatically loaded using modprobe (such as accessing the CD-ROM drive).\n\n\
    \  For more detailed information, enter man modprobe.\n\n- **depmod.** This command\
    \ creates the file `/lib/modules/version/modules.dep`. This file contains the\
    \ dependencies of individual modules on each other.\n\n  When a module is loaded\
    \ (such as with modprobe), modules.dep ensures that all modules it depends on\
    \ are also loaded.\n\n  If the file modules.dep does not exist, it is created\
    \ automatically when the system starts by the start script `/etc/init.d/boot`.\
    \ For this reason, you do not need to create the file manually.\n\n  On SUSE Linux\
    \ Enterprise Server 10, depmod also creates the file modules.aliases, which is\
    \ used by hwup and modprobe to determine which driver needs to be loaded for which\
    \ device. Learn more about this file in the hwup objective in this section.\n\n\
    - **modinfo option module.** This command displays information (such as license,\
    \ author, and description) about the module indicated on the command line.\n\n\
    \  The following is an example:\n\n  ```\nDAS0:~ # modinfo isdn\nlicense:    \
    \    GPL\nauthor:         Fritz Elfert\ndescription:    ISDN4Linux: link layer\n\
    depends:        slhc\nsupported:      yes\nvermagic:       2.6.5-7.21-default\
    \ 586 REGPARM gcc-3.3\n  ```\n\n  For more detailed information, enter **man modinfo**.\n\
    \n## modprobe Configuration File (/etc/modprobe.conf)\n\nThe file /etc/modprobe.conf\
    \ is the configuration file for the kernel modules. For example, it contains parameters\
    \ for the modules that access hardware directly.\n\nThe file plays an important\
    \ role in loading modules. Various command types can be found in the file, such\
    \ as the following:\n\n- **install.** These instructions let modprobe execute\
    \ commands when loading a specific module into the kernel.\n\n  The following\
    \ is an example:\n\n  `install eth0 /bin/true`\n\n- **alias.** These instructions\
    \ determine which kernel module will be loaded for a specific device file.\n\n\
    \  The following is an example:\n\n  `alias eth0 nvnet`\n\n- **options.** These\
    \ instructions are options for loading a module.\n\n  The following is an example:\n\
    \n  `options ne io=0x300 irq=5`\n\nFor more detailed information, enter man 5\
    \ modprobe.conf.\n\n![](img/8279afe915b153902294b0e58311b75a_56_0.png)\n"
