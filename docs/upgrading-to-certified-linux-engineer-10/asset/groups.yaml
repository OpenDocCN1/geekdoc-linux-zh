  md: '

    ## Transfer the LDAP Database


    Before you start the slapd on the slave server, you have to transfer the LDAP
    database from the master to the server.


    Make sure that the slapd of the master is shut down. To transfer the database
    (`/var/lib/ldap/` by default), you can use scp.


    Alternatively you can use the command `slapcat`. `slapcat` is used to generate
    an LDIF output based upon the contents of a slapd database. By default the output
    is written to STDOUT. You can specify a file by using the option `-l`.


    slapcat has other interesting options as well (e.g., for filtering). See the man
    page for further details (`man 8 slapcat`).


    ## Exercise 11-3 Replicate OpenLDAP Servers


    In this exercise, you configure LDAP replication with your neighbor.


    You use a new LDAP entry "uid=replicator,dc=digitalairlines,dc=com" with password
    "novell" for replication.


    In part IV, you change the surname of user kbailey from "Bailey" to "Smith". You
    do this on the master to see if the replication works correct.


    Do the following:


    - Part I - Add the Replicator DN to the Master''s LDAP Directory

    - Part II - Configure the LDAP Master Server

    - Part III - Configure the LDAP Client Server

    - Part IV - Copy the Database and Start the Servers

    - Part V - Test Replication


    ### Part I - Add the Replicator DN to the Master''s LDAP Directory


    - 1. To add the new LDAP entry on the master create a new LDIF file by entering
    vi replicator.ldif

    - 2. Enter the following lines

    - dn: uid=replicator,dc=digitalairlines,dc=com

    - objectClass: inetOrgPerson

    - uid: replicator

    - cn: LDAP Replicator

    - sn: Replicator

    - You also can copy the file exercises/section_3/replicator.ldif from the Course
    DVD.


    ### Part III - Configure the LDAP Client Server


    - 1. Stop your LDAP server by entering **rldap stop**.

    - 2. Open the file /etc/openldap/slapd.conf by entering **vi /etc/openldap/slapd.conf**

    - 3. Add the following lines **updatedn="uid=replicator,dc=digitalairlines,dc=com"**
    **updateref="ldap://master_ip"** *master_ip* is the IP address of your neighbor''s
    computer.

    - 4. Change the following access rule **access to *** **by * read** to **access
    to *** **by dn="uid=replicator,dc=digitalairlines,dc=com" write** **by * read**

    - 5. Save the file and exit by entering **:wq**.


    ### Part IV - Copy the Database and Start the Servers


    - 1. On the master server enter **scp -r /var/lib/ldap/ host:/var/lib/ldap/**
    Replace *host* by the host name of the slave server.

    - 2. Enter **novell** when prompted for a password.

    - 3. On both servers start the slapd by entering **rldap start**

    - 4. On the master server start the slurpd by entering **rslurpd start**


    ### Part V - Test Replication


    - 1. To change some user information on the master, create a new LDIF file by
    entering

    - vi change.ldif


    - 2. Enter the following lines

    - dn: uid=kbailey,ou=people,dc=digitalairlines,dc=com

    - cn: Kate Smith

    - sn: Smith


    - You also can copy the file exercises/section_3/change.ldif from the Course DVD.


    - 3. Save the file and exit by entering :wq.


    - 4. To change the LDAP information, enter

    - ldapmodify -x -D "cn=Administrator,dc=digitalairlines,dc=com" -W -f change.ldif


    - 5. On the master and slave enter

    - ldapsearch -x "uid=kbailey"


    (End of Exercise)


    ## Summary


    | Objective | Summary |

    |---|---|

    | 1. Install and Set Up an OpenLDAP Server | If you did not configure an OpenLDAP
    server during the installation, you need to install the following software packages:


    - openldap2

    - openldap2-client

    - pam_ldap

    - nss_ldap


    The configuration of the OpenLDAP server is located in the file /etc/openldap/slapd.conf.


    You can create passwords for the administrator entry of the configuration file
    with the command slappasswd.


    /etc/openldap/ldap.conf is the configuration file of the LDAP client.


    /etc/ldap.conf is the configuration file for the LDAP nameservice switch library,
    the LDAP PAM module, and the shadow package. |

    '
