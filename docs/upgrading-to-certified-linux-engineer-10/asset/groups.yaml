  - '[PAGE 159]


    A paused domain is not completely shut down. The current state is saved and the
    execution of the domain can be continued with the **unpause** command:


    ```

    xm unpause <domain_id>

    ```


    To shutdown a domain, use the **shutdown** command:


    ```

    xm shutdown <domain_id>

    ```


    In case the domain is not responding anymore, you can force the shutdown of the
    domain with the **destroy** command:


    ```

    xm destroy <domain_id>

    ```


    To save the state of a domain for a longer time (eg. over a reboot of domain0)
    you can use the **save** command:


    ```

    xm save <domain_id> <filename>

    ```


    The domain can be restored from the resulting file with the **restore** command:


    ```

    xm restore <filename>

    ```


    Another commonly used command is **mem-set**, which allows you to change the memory
    allocation of a domain:


    ```

    xm mem_set <domain_id> <amount_of_memory>

    ```


    The amount of memory is specified in megabytes.'
  - '[PAGE 160]


    Instead of the domain ID <domain_id>, you can also use the domain name in all
    xm commands.'
  - '[PAGE 161]


    # Exercise 8-3 Change Memory Allocation of a Guest Domain


    In this exercise, you learn how to change the memory allocation of a guest domain
    by changing the domain configuration file.


    The following assumes, that you still have an open terminal window of the guest
    domain, that you have configured in the previous exercises.


    Do the following:


    +   1. Open a terminal window and su - to the root user.

    +   2. Enter the command xm list.

    +   3. Note the memory allocation of the domain vm1.

    +   4. Switch to the terminal of the Xen domain and halt the system by typing
    halt. Wait till the system has been halted.

    +   5. Return to the root terminal and use the command xm list to verify that
    the domain vm1 is not running anymore.

    +   6. Open the file /etc/xen/vm/vm1 with a text editor.

    +   7. Look for the memory parameter and change the value to 172.

    +   8. Save and close the file.

    +   9. Enter the following command to start the domain:

    +   xm create -c -f /etc/xen/vm/vm1

    +   10. Wait till the system has been booted and you see the login prompt.

    +   11. Press the key combination Ctrl-] to detach from the domain terminal and
    return to the root terminal.

    +   12. Use the command xm list to determine the memory allocation of domain vm1.
    It should be 172MB.

    +   13. Also note the ID of domain vm1.'
  - '[PAGE 162]


    14. Attach to the terminal of vm1 with the command


    ```xm console <noted_id>```


    (End of Exercise)'
  - '[PAGE 163]


    # Automate Domain Startup and Shutdown


    When you start, shutdown or reboot domain0 of a Xen system, this also affects
    the other running Xen domains. Without a running domain0, the other Xen domains
    cannot operate.


    SUSE Linux Enterprise Server 10 comes with a start script called xendomains which
    is included in the package xen-tools.


    The script should be installed on domain0 and does the following:


    +   - When domain0 is booted, all domains and configuration files located under
    /etc/xen/auto/ are started.

    +   - When domain0 is shutdown or rebooted, running Xen domains are shutdown automatically.


    The script has some configuration options, which can be adjusted in the file /etc/sysconfig/xendomains.
    The configuration variables in this file are well documented.


    One interesting option is to migrate domains automatically to a different host
    when a domain0 is shutdown. This can be configured in the variable XENDOMAINS_MIGRATE.
    The variable has to be set to the IP address of the target machine. When the variable
    is empty, no migration is performed.'
  - '[PAGE 164]


    # Exercise 8-4    Automate Domain Startup


    In this exercise, you learn how to startup domains automatically when the system
    is booted.


    Do the following:


    +   1. Open a terminal window and su - to the root user.

    +   2. Move the vm1 configuration file into the auto directory: mv /etc/xen/vm/vm1
    /etc/xen/auto/

    +   3. Shutdown vm1 with the command xm shutdown vm1.

    +   4. Wait a moment and control with the command xm list if the domain has been
    shut down. Continue with next step when the domain vm1 is not listed anymore.

    +   5. Reboot you system by entering reboot.

    +   6. At the boot prompt, select the Xen entry.

    +   7. When the system has been started up, log in to the graphical interface
    as user gecko with the password novell.

    +   8. Open a terminal window and su - to the root user.

    +   9. Enter the command xm list.

    +   10. The domain vm1 should have been automatically started and should be listed
    in the xm output.


    (End of Exercise)'
