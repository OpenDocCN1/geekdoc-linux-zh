  - '[PAGE 230]


    +   - **transport.** Specifies the transport security strength factor.

    +   - **tls.** Specifies the TLS security strength factor.

    +   - **sasl.** Specifies the SASL security strength factor.

    +   - **update_*.** Specifies the security strength factors required for directory
    updates.

    +   - **simple_bind.** Specifies the security strength factor required for simple
    username/password authentication.


    For a more detailed description, read the section about sasl-secprops in the slapd.conf
    manpage (man 5 slapd.conf).


    # **access to.** Grants access to a set of entries and/or attributes by one or
    more requesters.


    Syntax: **access to objects [by requesters level control]**


    The **objects** and the **requesters** are specified by their DNs.


    As **requesters**, you can also use the asterisk for **everybody**. **self** means
    the owner object of the attribute. You can also specify a DN by **dn=DN** or a
    group by **group=DN**.


    The **level** can be:


    +   - **read** (Read access)

    +   - **write** (Write access)

    +   - **auth** (Authentication needed)

    +   - **none** (No access)


    Example 1:


    ```

    access to attr=userpassword

    by self write

    by anonymous auth

    by * none


    access to *

    by * read

    ```'
  md: "\nSelect whether you want to create a module for user configuration or for\
    \ group configuration. You also have to enter the common name (cn) of the module.\n\
    \n# Figure 11-20\n\n![](img/8279afe915b153902294b0e58311b75a_224_0.png)\n\nA template\
    \ for the user or group module is shown. You can find the listed attributes in\
    \ the YaST schema file (/etc/openldap/schema/yast.schema).\n\nTo edit a value\
    \ of an attribute, select a line from the list and then select Edit.\n\n# Figure\
    \ 11-21\n\n![](img/8279afe915b153902294b0e58311b75a_224_1.png)\n\nIn the line\
    \ of the attribute **susedefaulttemplate**, a template for new users or groups\
    \ is specified. If you want to edit this template, select **Configure Template.**\n\
    \n# Figure 11-22\n\n![](img/8279afe915b153902294b0e58311b75a_225_0.png)\n\nIn\
    \ the upper frame you see a list of attributes and their values. Edit the template\
    \ attribute values with **Edit.**\n\nIn the lower frame you can specify default\
    \ values for attributes. Use the three buttons below as follows:\n\n+   - **Add.**\
    \ Add a new default value.\n+   - **Edit.** Edit the selected default value.\n\
    +   - **Delete.** Delete the selected default value.\n\n## Exercise 11-1 Set Up\
    \ OpenLDAP with YaST\n\nIn this exercise, you set up an OpenLDAP server and client\
    \ using YaST. The base DN is “dc=digitalairlines,dc=com” and the common name of\
    \ the LDAP administrator is “cn=Administrator,dc=digitalairlines,dc=com” with\
    \ password “novel”. TLS/SSL is not used in this exercise.\n\nDo the following:\n\
    \n- Part I - Install OpenLDAP\n- Part II - Setup the OpenLDAP Server\n- Part III\
    \ - Setup the OpenLDAP Client\n\n- 1. From the main menu, start YaST.\n- 2. Enter\
    \ root password (novel) and select OK.\n- 3. From the YaST Control Center, select\
    \ Software > Software Management.\n- 4. From the filter drop-down menu, select\
    \ Search.\n- 5. In the Search field, enter ldap; then select Search.\n- 6. On\
    \ the right, select the following packages:\n  - nss_ldap\n  - openldap2\n  -\
    \ openldap2-client\n  - pam_ldap\n- 7. Select Accept; then insert the requested\
    \ SUSE Linux Enterprise Server 10 DVD.\n- 8. When installation is complete, remove\
    \ the DVD and close the YaST Control Center.\n\n## Part II - Setup the OpenLDAP\
    \ Server\n\n- 1. Start YaST.\n- 2. Start the YaST module Network Services > LDAP\
    \ Server.\n- 3. Select Yes to start the LDAP server.\n- 4. Select Configure.\n\
    - 5. In the LDAP Server Configuration dialog select Add Database to add a database.\n\
    - 6. In the Add Database dialog enter the following information:\n\n# Table 11-1\n\
    \n| Textbox | Value |\n|---|---|\n| Base DN | dc=digitalairlines,dc=com |\n| LDAP\
    \ Password | novell |\n| Validate Password | novell |\n\n- 7. Select OK.\n- 8.\
    \ In the left frame select Global Settings > TLS Settings. Make Sure that the\
    \ option TLS Active is set to no.\n- 9. Select Finish.\n\n## Part III - Setup\
    \ the OpenLDAP Client\n\n- 1. Start the YaST module Network Services > LDAP Client.\n\
    - 2. Select Use LDAP to activate LDAP for user authentication.\n- 3. Make sure\
    \ that the content of Addresses of LDAP Servers is 127.0.0.1.\n- 4. Make sure\
    \ that the content of LDAP base DN is dc=digitalairlines,dc=com\n- 5. Make sure\
    \ that the option LDAP TLS/SSL is deactivated.\n- 6. Select **Advanced Configuration**.\n\
    - 7. Select the **Administration Settings** tab.\n- 8. Enter **cn=Administrator**\
    \ in the textbox Administration DN.\n- 9. Activate the option **Append Base DN**.\n\
    - 10. Activate the option **Create Default Configuration Objects**.\n- 11. Activate\
    \ the option **Home Directories on This Machine**.\n- 12. Select **Accept**.\n\
    - 13. Select **Finish**.\n- 14. When asked to enter the administrator password\
    \ enter **novell**.\n\n*(End of Exercise)*\n\n- **transport.** Specifies the transport\
    \ security strength factor.\n- **tls.** Specifies the TLS security strength factor.\n\
    - **sasl.** Specifies the SASL security strength factor.\n- **update_*.** Specifies\
    \ the security strength factors required for directory updates.\n- **simple_bind.**\
    \ Specifies the security strength factor required for simple username/password\
    \ authentication.\n\nFor a more detailed description, read the section about sasl-secprops\
    \ in the slapd.conf manpage (man 5 slapd.conf).\n\n**access to.** Grants access\
    \ to a set of entries and/or attributes by one or more requesters.\n\nSyntax:\
    \ **access to objects [by requesters level control]**\n\nThe **objects** and the\
    \ **requesters** are specified by their DNs.\n\nAs **requesters**, you can also\
    \ use the asterisk for **everybody**. **self** means the owner object of the attribute.\
    \ You can also specify a DN by **dn=DN** or a group by **group=DN**.\n\nThe **level**\
    \ can be:\n\n- **read** (Read access)\n- **write** (Write access)\n- **auth**\
    \ (Authentication needed)\n- **none** (No access)\n\nExample 1:\n\n```\naccess\
    \ to attr=userpassword\nby self write\nby anonymous auth\nby * none\n\naccess\
    \ to *\nby * read\n```\n"
  mdcn: "\n\n选择是否要为用户配置或组配置创建一个模块。你还必须输入模块的通用名称（cn）。\n\n# 图 11-20\n\n![](img/8279afe915b153902294b0e58311b75a_224_0.png)\n\
    \n显示了用户或组模块的模板。你可以在 YaST 模式文件（/etc/openldap/schema/yast.schema）中找到列出的属性。\n\n要编辑属性的值，请从列表中选择一行，然后选择编辑。\n\
