    \n![](img/8279afe915b153902294b0e58311b75a_354_0.png)\n\n在 **Enable Security Event\
    \ Notification** 框中选择 **Configure**。一个对话框打开，你可以在其中配置通知的频率、电子邮件地址以及报告应涵盖的严重级别：\n\
