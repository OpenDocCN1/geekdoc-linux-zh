  mdcn: "\n\n## Example 2:\n\n```\naccess to *\nby dn=\"cn=Administrator,dc=digitalairlines,dc=com\"\
    \ write\nby * read\n```\n\n- **database**. 指定后端类型。支持以下数据库：\n- bdb. Berkeley DB\n\
    - dnssrv. DNS SRV\n- hdb. bdb 的分层变体\n- ldap. 轻量级目录访问协议（代理）\n- ldbm. 轻量级 DBM\n\
    - meta. 元目录\n- monitor. 监控后端\n- passwd. 对 passwd 的只读访问\n- perl. Perl 可编程后端\n-\
    \ shell. 外部 shell 程序\n- sql. SQL 可编程后端\n\n- **suffix \"DN\"**\n指定将传递给此后端数据库的查询的\
    \ DN 后缀。\n示例：\n\n```\nsuffix    \"dc=digitalairlines,dc=com\"\n```\n\n- **checkpoint\
    \ ops minutes**. 仅在成功写操作后才检查检查点。如果已完成 ops 次操作或超过指定的分钟数，则执行新的检查点。\n\n可能的 **types**\
    \ 为：\n\n- **pres.** 允许使用查询属性是否在条目中存在的过滤器（cn=*）。\n- **eq.** 允许使用查询属性是否具有精确值的过滤器。它包含存在性，因此无需将某物同时索引为\
    \ pres,eq。\n- **approx.** 允许使用查询属性值是否“类似于”某物的过滤器。\n- **sub.** 允许对属性值进行子字符串搜索的过滤器。\n\
    - **none.**\n\n完成配置后，可以使用以下命令启动服务器：\n\n```\nrcldap start\n```\n\n如果要在服务器启动时自动启动\
    \ LDAP 服务器，请使用以下命令：\n\n```\ninsserv ldap\n```\n\n## Configure the LDAP Clients\
    \ with ldap.conf\n\n更改服务器配置文件后，需要更改客户端配置。两个文件很重要：\n\n- /etc/openldap/ldap.conf\n\
    - /etc/ldap.conf\n\n## /etc/openldap/ldap.conf\n\n文件 /etc/openldap/ldap.conf 是\
    \ LDAP 客户端的配置文件。\n\n最重要的选项如下指定：\n\n- **host 127.0.0.1**\n  此行设置 LDAP 客户端应连接到的默认服务器。\n\
    \n- **base dc=digitalairlines,dc=com**\n  这是 LDAP 客户端应使用的默认目录搜索基。\n\n标准安装后，/etc/ldap.conf\
    \ 中还有一行：\n\n```\nTLS_REQCERT    allow    ............\n```\n\nTLS_REQCERT 指定在\
    \ TLS 会话中对服务器证书执行哪些检查（如有）。级别可以指定为以下关键字之一：\n\n- **never**. 客户端不会请求或检查任何服务器证书。\n\
    - **allow**. 请求服务器证书。如果未提供证书或提供错误证书，会话照常进行。\n- **try**. 请求服务器证书。如果未提供证书，会话照常进行。如果提供错误证书，会话立即终止。\n\
    - **demand or hard**. 请求服务器证书。如果未提供证书或提供错误证书，会话立即终止。（默认）\n\n更多选项，请阅读手册 man 5 ldap.conf。\n\
    \n## /etc/ldap.conf\n\n文件 /etc/ldap.conf 是 LDAP 名称服务切换库、LDAP PAM 模块和 shadow 包的配置文件。该文件属于\
    \ RPM 包 pwdutils。\n\n```\nda51:~ # rpm -qf /etc/ldap.conf\npwdutils-3.0.7.1-17.10\n\
    da51:~ #\n```\n\n/etc/ldap.conf 的最重要的选项是：\n\n- **host.** 指定要连接到的 LDAP 服务器的名称或\
    \ IP 地址。\n- **base.** 指定搜索时使用的默认基本可分辨名称（DN）。\n- **ldap_version.** 指定 LDAP 协议的版本；“3”代表\
    \ LDAPv3。\n- **bind_policy.** 指定 LDAP 服务器不可达时发生的情况。可能的值为：\n  - **hard.** nss_ldap\
    \ 将以指数退避方式重试连接软件。（默认）\n  - **soft.** 禁止 nss_ldap 重试失败的 LDAP 查询。\n- **binddn.**\
    \ 指定用于绑定到目录服务器的区分名称。默认是匿名绑定。\n- **bindpw.** 指定用于绑定的明文凭据。此选项仅在与上文 binddn 一起使用时适用。\n\
    - **scope.** 指定搜索范围。可能的值为：\n  - **sub.** 子树\n  - **one.** 一级\n  - **base.** 基本对象\n\
    \n"
