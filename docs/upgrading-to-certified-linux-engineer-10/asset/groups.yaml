    |

    | 3. Describe how Device Drivers Are Loaded | In a SUSE Linux Enterprise Server
    10 system, kernel modules are loaded in the following ways:


    - From initrd

    - By initscripts

    - By udev

    - By the X Server

    - Manually by the user root |

