    anyway. But an error occurs at the end. If a sufficient module fails, but another
    sufficient module matches, login is allowed.


    There are a couple of examples available in the directory /usr/share/doc/packages/pam_ldap/pam_ldap.d/.


    The advantage of using LDAP for all kinds of authentication (as done by YaST)
    is that you can use standard tools like passwd or chsh.


    ```

    kbailey@da51-> passwd

    kbailey@da51-> passwd

    Enter login(LDAP) password:

    New password:

    Re-enter new password:

    LDAP password changed for geeko

    ```


    ## Exercise 11-2 Set up an LDAP User Database


    In this exercise, you add a user with the following information to your LDAP directory:


    ### Table 11-2


    | Information | Value |

    |---|---|

    | Login | kbailey |

    | Name | Kate Bailey |

    | UID | 1010 |

    | GID | 100 |

    | Home directory | /home/kbailey |

    | Login shell | /bin/bash |


    You create a password ("novell") for user kbailey. In part II you enable an automatically
    creation of the home directory if a user logs in using ssh. In part III you login
    as user kbailey to test your configurations.


    Do the following:


    - Part I - Add Users to the LDAP Directory

    - Part II - Set LDAP User Password

    - Part III - Configure Automatically Home Directory Creation

    - Part IV - Login as kbailey via SSH


    ## Part I - Add Users to the LDAP Directory


    - 1. There should be some entries in the LDAP directory created by YaST. To see
    the content of your LDAP directory enter ldapsearch -x

    - 2. Create an LDIF file by entering vi example.ldif


    3. To create a Posix account for a new user kbailey, add the following lines:

    **dn: uid=kbailey,ou=people,dc=digitalairlines,dc=com**

    **objectClass: posixAccount**

    **objectClass: shadowAccount**

    **objectClass: inetOrgPerson**

    **uid: kbailey**

    **uidNumber: 1010**

    **gidNumber: 100**

    **cn: Kate Bailey**

    **givenName: Kate**

    **sn: Bailey**

    **homeDirectory: /home/kbailey**

    **loginShell: /bin/bash**

    **shadowMax: 99999**

    **shadowWarning: 7**

    **shadowInactive: -1**

    **shadowMin: 0**

    **shadowLastChange: 12609**


    You also can copy the file exercises/section_3/kbailey.ldif from the Course DVD.


    4. Save the file and exit the text editor by entering :wq.


    5. Add the LDIF file to your LDAP database by entering

    **ldapadd -x -D**

    **"cn=Administrator,dc=digitalairlines,dc=com" -W -f**

    **kbailey.ldif**


    6. Enter the password for the LDAP administrator (novell).


    7. To see the content of your LDAP directory, enter

    **ldapsearch -x "uid=kbailey"**


    ## Part II - Set LDAP User Password


    - 1. Use the command **getent** (Get Entry) to test whether the LDAP database
    is used by the glibc. Enter **getent passwd**


    The users in /etc/passwd and the LDAP database should be listed. The end of the
    output may look similar to this:


    ```

    ...

    uucp:x:10:14:Unix-to-Unix CoPy system:/etc/uucp:/bin/bash

    wwwrun:x:30:8:WWW daemon apache:/var/lib/wwwrun:/bin/false

    geeko:x:1000:100:Geeko Chameleon:/home/geeko:/bin/bash

    kbailey:x:1010:100:Kate Bailey:/home/kbailey:/bin/bash

    ```


    - 2. To set the password for the user kbailey, enter **ldappasswd -x -D "cn=Administrator,dc=digitalairlines,dc=com"
    -W -S "uid=kbailey,ou=people,dc=digitalairlines,dc=com"**


    - 3. Enter **novell** twice as the new password.


    - 4. Enter the administrator password (also **novell**) to set the password.


    - 5. Search for your own LDAP entry by entering **ldapsearch -x -D "cn=Administrator,dc=digitalairlines,dc=com"
    -x "uid=kbailey" -W**


    - 6. Enter the administrator password (**novell**). Your encrypted user password
    should be listed.


    ## Part III - Configure Automatically Home Directory Creation


    - 1. Open the file /etc/pam.d/sshd with vi by entering

    `vi /etc/pam.d/sshd`

    - 2. Add the following line

    `session required pam_mkhomedir.so skel=/etc/skel/ umask=0022`

    - 3. Save the file and exit by entering `wq`.


    ## Part IV - Login as kbailey via SSH


    - 1. Login as user kbailey by entering

    `ssh -l kbailey localhost`

    - 2. Enter yes to modify the list of known hosts.

    - 3. Enter the password of kbailey (novell).

    The home directory should be created.

    - 4. Enter exit to log out.


    (End of Exercise)

