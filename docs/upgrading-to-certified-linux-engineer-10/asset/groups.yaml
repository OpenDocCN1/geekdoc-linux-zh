  mdcn: "\n\n## Syslog-ng 的服务器端配置\n\n要接收消息，syslog-ng 必须监听一个端口，通常是 514 端口。与仅支持 UDP\
    \ 连接的 syslogd 不同，syslog-ng 还支持 TCP。\n\n要绑定到端口，你需要在一个 source 部分中添加一行。你可以将其添加到现有的\
