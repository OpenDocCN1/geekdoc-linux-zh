    # *Understand Persistent Interface Names*


    The interface files in the directory **/dev** are created and assigned to the
    corresponding hardware device when the device is recognized and initialized by
    a driver. Therefore the assignment between device and interface file depends on:


    +   - The order in which device drivers are loaded.

    +   - The order in which devices are connected to a computer.


