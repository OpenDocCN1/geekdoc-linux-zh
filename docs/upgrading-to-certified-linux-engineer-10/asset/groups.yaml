    c. Add a # sign to the beginning of the following line, as in the following:

    #auth required pam_nologin.so

    This PAM module is required to be successful during system authentication. It
    checks to see if the file /etc/nologin exists, and if it does, this PAM module
    does not allow regular users to log in by returning a failed status.

    Now that this line is commented out, PAM will not check for the file. This means
    that all users can log in, even if the file exists.


