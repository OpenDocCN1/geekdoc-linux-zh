    server server.

    +     If no port number is specified, the default DNS port number 53 is used.


    +   - **update delete reference [ttl] [class] [type value...]**. Deletes any resource
    records named reference.

    +     If the record type and value are provided, only matching resource records
    will be removed.

    +     The Internet class (IN) is assumed if class is not supplied.

    +     ttl is ignored. It is only allowed for compatibility.


    +   - **update add reference ttl [class] type value...** Adds a new resource record
    with the specified ttl (in seconds), class and value.


