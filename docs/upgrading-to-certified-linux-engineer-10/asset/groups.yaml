    ## Exercise 8-5    Check the Network Configuration


    This exercise assumes that you have a Xen system with domain 0 and one more Xen
    domain running.


    Do the following:


    - 1. Open a terminal window and su - to the root user.

    - 2. Make sure that the domain vm1 is running by typing the command xm list.

    - 3. In the output of the xm command, note the ID of the domain vm1.

    - 4. View the network bridge configuration with the command brctl show.

    - 5. You should see the configuration of the bridge xenbr0. The interfaces peth0
    (physical interface) vif0.0 (virtual interface of domain 0) and the virtual interface
    vifx.0 (where x is the domain ID of domain vm1) should be added to the bridge.

    - 6. Shutdown the domain with the command xm shutdown vm1.

    - 7. Wait a moment and control with the command xm list if the domain has been
    shut down. Continue with next step when the domain vm1 is not listed anymore.

    - 8. Enter the command brctl show again. Note that the interface of the domain
    vm1 has been removed from the bridge.

    - 9. Restart the domain with: xm create -f /etc/xen/vm/vm1

    - 10. Note the ID of vm1 and check with brctl show if the interface of vm1 has
    been added again.


    (End of Exercise)


