    - **Halt.** 按下 **Ctrl+Alt+Del** 键组合时系统会关闭。\n\n## Shutdown Behavior of KDM. 您使用此选项来设置谁有权从\
    \ KDM 关闭计算机。\n\n- **Only Root.** 要停止系统，必须输入 root 密码。\n- **All Users.** 每个人，甚至远程连接的用户，都可以使用\
    \ KDM 停止系统。\n- **Nobody.** 没有人可以使用 KDM 停止系统。\n- **Local Users.** 只有本地连接的用户可以使用\
    \ KDM 停止系统。\n- **Automatic.** 注销后系统会自动关闭。\n\n对于服务器系统，您应使用 **Only Root** 或 **Nobody**\
