    \ Finish。\n- 12. 通过在终端窗口中输入 enforce firefox 将 Firefox 配置文件重新置于 enforce 模式。\n\n\
    10. 再次启动 Firefox 并选择在步骤 4 中给出的 URL 可用的另一个 Java 演示。这现在应该可以工作，尽管配置文件已再次处于 enforce\
    \ 模式。\n\n## Part IV: 将你创建的配置文件与 SLES 10 中的配置文件进行比较\n\n执行以下操作：\n\n- 1. 打开一个控制台窗口并使用\
