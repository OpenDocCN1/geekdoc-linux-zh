  mdcn: "\n以下列出了设备配置文件中的可用变量：\n\n## 表 3-1\n\n| 变量 | 描述 |\n|---|---|\n| STARTMODE |\
    \ 该变量决定设备在何时以及如何启动：<br> - **auto.** 设备在启动时自动启动，或在设备连接到系统时由 udev 自动启动。<br> - **manual.**\
    \ 设备不应自动启动，但可以手动启动。<br> - **off.** 设备绝不应被启动。 |\n| MODULE | 该变量的值决定应为设备加载的内核模块名称。<br>\
    \ 如果必须加载多个模块，可以多次使用该变量并附加任意后缀。<br> 然后，必须对多个 MODULE_OPTIONS 变量使用相同的后缀。<br> 示例：<br>\
    \ **MODULE_A=\\\"foo\\\"** <br> **MODULE_B=\\\"bar\\\"** <br> **MODULE_OPTIONS_A=\\\
    \"foo-opt\\\"** <br> **MODULE_OPTIONS_B=\\\"bar-opt1=x yz\\\"** |\n| MODULE_OPTIONS\
    \ | 使用该变量，可以向内核模块传递选项。 |\n\n### （续）表 3-1\n\n| 变量 | 描述 |\n|---|---|\n| SCRIPT{UP,DOWN}_[type]\
    \ | 该变量指定用于初始化和解除配置特定设备类型时调用的脚本。<br> 如果待初始化设备的类型与此参数中给定的类型匹配，则调用此脚本。 |\n| SCRIPT{UP,DOWN}\
    \ | 该变量指定用于设备初始化和解除配置时调用的脚本。<br> 仅当未配置匹配的类型特定脚本时，才会调用它。 |\n\n以下是一个网络适配器配置文件的示例：\n\
    \n```\nMODULE='e100'\nMODULE_OPTIONS=''\nSTARTMODE='auto'\n```\n\n加载了模块 e100，该模块没有选项，设备在启动时会自动启动。\n\
    \nhwup 命令通常由 udev 调用，但您也可以手动使用它。例如，以下命令启动上文中显示的网络卡：\n\n```\nhwup bus-pci-0000:02:08.0\n\
    ```\n\n配置文件名的最后 3 个元素指定设备。\n\n您可以使用 hwdown 命令来解除设备配置，如下所示：\n\n```\nhwdown bus-pci-0000:02:08.0\n\
    ```\n\n## 通过 sysfs\n\n当 /etc/hardware 下没有设备的配置文件时，hwup 会使用 sysfs 来获取有关所需驱动程序的更多信息。\n\
    \n在文件 /sys/bus/devices/<pci_device_id>/modalias 中可以找到设备的唯一 ID。以下是一个网络适配器的 modalias\
    \ 文件内容：\n\n```\npci:v00008086d00001039sv00001734sd00001001bc02sc00i00 ....\n```\n\
    \n现在，udev 调用 modprobe 命令，并使用 modalias 作为参数。\n\n文件 /lib/modules/<kernel_version>/modules.aliases\
    \ 包含一个列表，列出 modalias ID 及其对应的内核驱动程序模块。关于哪个驱动程序模块处理哪个 modalias ID 的信息包含在模块的源文件中。depmod\
    \ 命令用于从模块中提取这些信息，并将其写入 modules.aliases 文件。\n\n因此，您可以将 modules.aliases 文件视为一种驱动程序数据库，用于确定哪个驱动程序处理哪个设备。\n\
    \n当 udev 使用 modalias 参数调用 modprobe 时，modprobe 会在 modules.aliases 中查找驱动程序并加载相应的驱动程序。\n\
    \n为了防止 udev/hwup/modprobe 以所述方式自动加载驱动程序，可以将驱动程序添加到 /etc/modprobe.d/blacklist 文件中。例如，默认情况下，ALSA\
    \ 声音驱动程序就添加在这里，因为这些驱动程序由 ALSA 初始化脚本（alsasound）加载。\n\n## 练习 3-3 探索硬件初始化\n\n在本练习中，您将学习如何使用\
    \ hwdown 关闭设备以及如何手动重新启动设备。本练习由以下部分组成：\n\n- 第 I 部分：使用 hwdown 停止以太网适配器\n- 第 II 部分：卸载驱动程序模块\n\
    - 第 III 部分：使用 modalias 加载驱动程序模块\n\n### 第 I 部分：使用 hwdown 停止以太网适配器\n\n请执行以下操作：\n\
    \n- 1. 打开终端窗口，并使用 su - 切换到 root 用户。\n- 2. 输入命令 ip a。您应该会看到网络接口的列表。（至少包含 eth0）。\n\
    - 3. 输入命令 lspci。\n- 4. 查找描述为 Ethernet controller 的设备，并在本步骤下方记录该设备的 PCI ID。如果您有多个以太网适配器，请选择第一个。\n\
    - 5. 输入命令：\n  hwdown bus-pci-0000:<network_adapter_pci_id>\n- 6. 再次输入命令 ip a。已通过\
    \ hwdown 关闭的设备接口应不再可见。\n\n### 第 II 部分：卸载驱动程序模块\n\n- 1. 切换到目录 /etc/sysconfig/hardware/。\n"
