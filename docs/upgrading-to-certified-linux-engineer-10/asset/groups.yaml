  mdcn: '


    ## 第 14 节 AppArmor


    Novell AppArmor 是一种强制访问控制方案，可让你按程序指定该程序可以读取、写入和执行的哪些文件。


    AppArmor 通过强制执行良好的应用程序行为来保护应用程序，而不依赖于攻击签名，因此即使攻击利用的是此前未知的安全漏洞，也能防止攻击。


    ## 目标


    - 1. 使用 AppArmor 提高应用程序安全性

    - 2. 创建和管理 AppArmor 配置文件

    - 3. 控制 AppArmor

    - 4. 监控 AppArmor


    ## 目标 1


    ### 使用 AppArmor 提高应用程序安全性


    即使你可以保持软件为最新状态，仍然可能遭受利用尚未知晓或尚无修复程序的漏洞的攻击。


    AppArmor 的理念是让内核限制软件程序可以执行的操作。除了通常的<|message|> 用户和组权限所设定的限制外，还会根据特定程序的一组规则施加限制。


    通常入侵者并不会直接获得 root 权限。通过利用例如 Web 服务器中的漏洞，她可能能够以运行 Web 服务器的用户身份启动一个 shell。凭借这种无特权访问，她再利用其他某个软件程序中的另一个漏洞来获得
    root 访问权限。


    使用 AppArmor，即使入侵者设法在某些服务器软件中发现了漏洞，由于入侵者无法访问或执行超出 AppArmor 规则集允许应用程序在常规操作中访问或执行的任何文件，因此造成的损害是有限的。


    这一概念不仅限于普通账户；它也在一定程度上限制了以 root 权限运行的应用程序可以执行的操作。受限进程即使以 root 身份运行也不能调用某些系统调用。因此，即使攻击者获得了
    root 权限，她仍然受到限制，无法执行太多操作。


    AppArmor 内核模块（apparmor 和 aamatch_pcre）挂钩到内核的 Linux 安全模块框架。


    /etc/apparmor.d/ 中的配置文件用于配置哪些应用程序可以访问和执行哪些文件。


    AppArmor 必须在受其控制的应用程序启动之前激活。在 AppArmor 激活时已在运行的应用程序不会受 AppArmor 控制，即使为其创建了配置文件。因此，AppArmor
    由 /etc/init.d/boot.apparmor 在启动过程的早期激活。


    在 SUSE Linux Enterprise Server 10 的默认安装中，AppArmor 使用 Novell 提供的配置文件集积极保护多个服务。使用提供的
    YaST 模块或命令行工具，你可以轻松地根据需要调整这些配置文件，并为要保护的其他应用程序创建新的配置文件。


    作为一般规则，你应该限制授予特权的程序，即程序可以访问使用该程序的人所没有的资源：


    - 网络代理——具有开放网络端口的程序

    - Cron 作业

    - Web 应用程序


    在 AppArmor 文档的某些地方，你会发现 AppArmor 的前身名称 Subdomain。


    ## 目标 2 创建和管理 AppArmor 配置文件


    SUSE Linux Enterprise Server 10 附带了针对各种应用程序的 AppArmor 配置文件，例如 named、ntpd、nscd
    等。


    配置文件包含在 /etc/apparmor.d/ 中。配置文件的名称代表应用程序的文件名，包括路径，其中 "/" 被 "_" 替换。/usr/sbin/squid
    的配置文件将包含在 /etc/apparmor.d/usr.sbin.squid 中。


    配置文件可以通过 #include 语句包含其他文件。目录 /etc/apparmor/abstractions/ 包含多个文件，旨在根据要由 AppArmor
    保护的程序类型包含在配置文件中。有用于所有程序都应可读或可写的抽象（base），用于名称服务相关文件如 /etc/passwd 的抽象（nameservice），用于与控制台操作相关文件的抽象（console），以及其他抽象。


    配置文件是纯文本文件，因此可以用任何文本编辑器创建和修改它们。然而，命令行工具以及 YaST 模块大大简化了创建配置文件的过程。


    除了 /etc/apparmor.d/ 中的活动配置文件外，/etc/apparmor/profiles/extras/ 中已准备了多个配置文件，你可以按需自定义并复制到
    /etc/apparmor.d/ 以激活它们。


    要成功管理 AppArmor，你需要


    - 理解配置文件和规则

    - 使用 YaST 管理 AppArmor 配置文件

    - 使用命令行工具管理 AppArmor 配置文件


    '
