    ## 第 5 节 使用 NetworkManager 配置网络


    如果您在笔记本电脑上使用 SUSE Linux Enterprise Server 10，您很可能会根据所在位置使用不同类型的 Internet 访问——也许是在办公室的局域网，在客户现场的无线连接。


    ### 目标


    - 1. 使用 NetworkManager 配置网络


    ### 目标 1


    ## 使用 NetworkManager 配置网络


    传统的网络设置要求您切换到 root 账户才能更改网络配置。NetworkManager（软件包 NetworkManager）的目的是允许用户根据需要更改网络配置，而无需切换到
    root 账户。


    NetworkManager 以 root 用户系统级守护进程的形式运行，因为直接操作硬件需要 root 权限。用于此目的的程序是 /usr/sbin/NetworkManager
    和 /usr/sbin/NetworkManagerDispatcher。nm-tools 可用于列出有关 NetworkManager、设备和无线网络的信息。


    从系统中当前安装的所有适配器列表中，NetworkManager 首先尝试有线适配器，然后尝试无线适配器。支持无线扫描的无线适配器优先于不支持的适配器。NetworkManager
    不会尝试尽可能长时间保持连接，这意味着插入有线网络会将连接切换到有线网络，远离无线网络。


    对于无线网络支持，NetworkManager 保留两份无线网络列表：受信任列表和首选列表。受信任列表包含用户明确添加到其中的网络，而首选列表包含用户强制
    NetworkManager 连接的网络。


    由于受信任和首选网络是特定于用户的，因此必须有某种机制来获取和按用户存储此信息。这是通过桌面级按用户进程 nm-applet 或 KDE 中的 KNetworkManager
    实现的。NetworkManager 通过 DBUS 与这些用户级进程通信。


    在 YaST 中选择 NetworkManager 也会自动在用户登录时启动网络小程序。使用桌面小程序，用户可以轻松更改网络配置：


