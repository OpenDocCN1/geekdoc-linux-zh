    ) port(514);\n};\n```\n\n使用 0.0.0.0 作为 IP 地址会使 syslog-ng 绑定到所有可用接口。\n\n然后需要一个\
    \ destination 和一个 log 条目：\n\n```\ndestination digiair { file(\"/var/log/$HOST\"\
    ); };\nlog { source(network); destination(digiair); };\n```\n\n第一行定义了 destination\
    \ digiair；每个主机的日志条目都会写入以主机名为文件名的文件。log 条目将来自 source network 的消息定向到 destination\
    \ digiair。\n\n## 练习 13-1 记录到远程主机\n\n在本练习中你与伙伴合作。决定谁发送消息，谁接收消息。 （如果你们互相发送和接收消息，可能会创建无限循环。）\n\
    \n在 loghost 上配置 syslog-ng 以接收来自其他主机的日志消息。\n\n在客户端上配置 syslog-ng 以将日志消息发送到 loghost。\n\
    \n## 完成此练习的详细步骤\n\n- Part I: 在接收消息的计算机上\n- Part II: 在发送消息的计算机上\n\n## Part I: 在接收消息的计算机上\n\
    \n执行以下操作：\n\n- 1. 打开一个终端窗口并 su - 到 root（密码 novell）。\n- 2. 在 vi 中打开文件 /etc/syslog-ng/syslog-ng.conf.in。\n\
    \n在 source src 部分之后添加另一个 source 部分，如下所示：\n\n```\nsource network {\n    udp(ip(\"\
    0.0.0.0\") port(514));\n};\n```\n\n- 3. 在文件末尾，添加一个 destination 和一个 log 条目来记录通过网络到达的消息：\n\
    \n```\ndestination digiair { file(\"/var/log/$HOST\"); };\nlog { source(network);\
    \ destination(digiair); };\n```\n\n- 4. 保存文件并退出 vi。\n- 5. 运行 SuSEconfig：\n  SuSEconfig\
    \ --module syslog-ng\n- 6. 通过输入查看 /var/log/messages\n  tail -f /var/log/messages\n\
    \  你应该会看到一条 syslog-ng 初始化其新配置的消息。\n- 7. 通过按 ctrl+c 退出 tail。\n\n一旦消息从客户端发送，syslog-ng\
    \ 将创建一个文件 /var/log/daxx，例如 /var/log/da20。通过输入查看此文件：\ntail -f /var/log/daxx\n（用邻居计算机的主机名替换\
    \ daxx。）\n\n## Part II: 在发送消息的计算机上\n\n执行以下操作：\n\n- 1. 打开一个终端窗口并 su - 到 root（密码\
    \ novell）。\n- 2. 在 vi 中打开文件 /etc/syslog-ng/syslog-ng.conf.in。\n\n在文件末尾，添加一个 destination\
    \ 和一个 log 条目以将消息发送到 loghost：\n\n```\ndestination tologhost { udp(\"daxx\" port(514));\
    \ };\nlog { source(src); destination(tologhost); };\n```\n\n用 loghost 的主机名替换上述示例中的\
    \ daxx。\n\n- 3. 保存文件并退出 vi。\n- 4. 运行 SuSEconfig：\n  SuSEconfig --module syslog-ng\n\
    \nSuSEconfig 会导致 syslog-ng 重新读取其配置，因此无需在额外步骤中执行此操作。\n\n- 5. 通过在终端窗口中使用 su - 或使用\
    \ program logger 创建日志条目。条目应出现在 loghost 上。\n\n***(练习结束)***\n\n## Summary\n\n| Objective\
    \ | Summary |\n|---|---|\n| 1. Apply Security Updates | 要获取并应用 SUSE Linux Enterprise\
    \ Server 10 的安全更新，你需要执行以下操作： <br>- 在 http://www.novell.com/center/ 注册 SLES 10\
    \ <br>- 使用 YOU 下载并应用更新。 |\n| 2. Understand Recent Match of iptables | recent match\
    \ 可用于动态创建 IP 地址列表并针对这些 IP 地址创建规则。 <br>信息保存在 /proc/net/ipt_recent/DEFAULT 中，除非你指定了不同的名称。\
    \ |\n| 3. Log to a Remote Host | 记录到日志主机可防止入侵后篡改日志文件。 <br>日志文件中的信息只有在有人看到并据此采取行动时才有用。\
    \ <br>存在多个程序，如 logcheck、logsurfer 或自定义脚本，可帮助找到相关的日志条目。 |\n\n"
