- raw:
  - "[PAGE 314]\n\n# Server Side Configuration of Syslog-ng\n\nTo receive messages,\
    \ syslog-ng has to listen on a port, usually port 514. Unlike syslogd, which only\
    \ supports UDP connections, syslog-ng also supports TCP.\n\nTo bind to a port,\
    \ you have to add a line within a source section. You can either add it to the\
    \ existing source src section, or create a new one, as in the following:\n\n```\n\
    source network {\n    udp(\"10.0.0.254\") port(514);\n};\n```\n\nUsing 0.0.0.0\
    \ as the IP address causes syslog-ng to bind to all available interfaces.\n\n\
    Then a destination and a log entry are required:\n\n```\ndestination digiair {\
    \ file(\"/var/log/$HOST\"); };\nlog { source(network); destination(digiair); };\n\
    ```\n\nThe first line defines the destination digiair; each host’s log entries\
    \ get written to a file with the hostname as file name. The log entry directs\
    \ messages from the source network to the destination digiair."
  - "[PAGE 315]\n\n# Exercise 13-1 Log to a Remote Host\n\nIn this exercise you work\
    \ with a partner. Decide who will send messages and who will receive them. (If\
    \ both of you send and receive messages to each other, you might create an endless\
    \ loop.)\n\nOn the loghost configure syslog-ng to receive log messages from other\
    \ hosts.\n\nOn the client configure syslog-ng to send log messages to the loghost.\n\
    \n# Detailed Steps to Complete this Exercise\n\n+   - Part I: On the Computer\
    \ Receiving Messages\n+   - Part II: On the Computer Sending Messages\n\n# Part\
    \ I: On the Computer Receiving Messages\n\nDo the following:\n\n+   1. Open a\
    \ terminal window and su - to root (password novell).\n\n+   2. Open the file\
    \ /etc/syslog-ng/syslog-ng.conf.in in vi.\n\nAdd another source section after\
    \ the source src section, as in the following:\n\n```\nsource network {\n    udp(ip(\"\
    0.0.0.0\") port(514));\n};\n```\n\n+   3. At the end of the file, add a destination\
    \ and a log entry to log messages that arrive via the network:\n\n```\ndestination\
    \ digiair { file(\"/var/log/$HOST\"); };\nlog { source(network); destination(digiair);\
    \ };\n```\n\n+   4. Save the file and quit vi."
  - '[PAGE 316]


    +   5. Run SuSEconfig:

