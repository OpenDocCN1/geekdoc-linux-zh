    \ 10\n\nThe configuration file for the secondary server looks like this:\n\n```\n\
    failover peer \"digitalairlines\" {\n    secondary;\n    address 10.0.0.12;\n\
    \    port 647;\n    peer address 10.0.0.10;\n    peer port 847;\n    max-response-delay\
    \ 180;\n    load balance max seconds 3;\n}\n# Now we include the identical configuration\
    \ on both\n# machines\n# include \"/etc/dhcpd.conf.master\";\n```\n\nThe differences\
    \ to the primary server configuration are the statement \"secondary\", the missing\
    \ statements mclt and split and the interchanged values of address, port, peer\
    \ address and peer port.\n\nThe main DHCP server configuration is contained in\
    \ the file /etc/dhcpd.conf.master, which included in both configurations.\n\n\
    In order to find this file, it needs to be copied to the chroot environment of\
