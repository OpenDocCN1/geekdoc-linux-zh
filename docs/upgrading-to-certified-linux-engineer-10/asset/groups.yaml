    ## Figure 8-9


    ![](img/8279afe915b153902294b0e58311b75a_151_1.png)


    Select **Continue**.


    The following dialog gives you a resume about the domain configuration. Usually
    there is nothing to do here. Select **Next** in this dialog and in the domain
    overview.


    A terminal window opens up where you can finish the remaining steps of the OS
    installation with YaST.


    ## Exercise 8-2    Install a Guest Domain


    In this exercise, you learn how to install a Xen guest domain using YaST. Before
    you start with this exercise, you must have installed xen on your system.


    Do the following:


    - 1. Open the YaST Control Center.

    - 2. Select System > Virtual Machine Management.

    - 3. Select Add.

    - 4. Select Run an OS installation program and then Next.

    - 5. Select Next.

    - 6. After a while, a terminal window opens and a standard SUSE Linux Enterprise
    Server installation starts up. Select this window.

    - 7. Press Alt+N.

    - 8. Use the tab-key to navigate to the item "Yes, I Agree to the License Agreement".
    Then press the space bar.

    - 9. Press Alt+N.

    - 10. Press Alt+N.

