    # Objective 2


    # Configure Dynamic DNS


    If the number of zones and hosts increases, it is inconvenient to edit the zone
    files manually.


    You can modify the resource record sources of the name server dynamically without
    editing and reloading files. This is called dynamic DNS. Dynamic DNS can also
    be used by external services like DHCP.


    To allow dynamic changes, add the following line in the zone definition.


    ```

    allow-update { 127.0.0.1; };

    ```


    In this example, only the loopback address is used, but it is also possible to
    add IP addresses of other hosts.


    To edit the DNS records dynamically, use the command nsupdate:


    ```

    da51:~ # nsupdate

    ```


    The security tool AppArmor is installed and enabled on SUSE Linux Enterprise Server
    10 by default. There is an AppArmor profile for BIND that prohibits nsupdate to
    change the BIND zone information. AppArmor is covered in the course SUSE Linux
    Enterprise Server 10 Security (Course 3075) in detail. Stop the AppArmor daemon
    by entering rcapparmor stop to use nsupdate as described in the following.


    Before using nsupdate, make sure that all zone files have the correct access permissions.
    If they are not set properly, use the following commands: chgrp -R named /var/lib/named
    chmod -R g+w /var/lib/named'
