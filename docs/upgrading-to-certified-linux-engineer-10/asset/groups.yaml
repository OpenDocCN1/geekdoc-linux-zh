    \ 1500 qdisc noop\n    link/ether 00:00:00:00:00:00 brd ff:ff:ff:ff:ff:ff\n  \
    \  [...] \n19: veth7: <BROADCAST,MULTICAST> mtu 1500 qdisc noop\n    link/ether\
