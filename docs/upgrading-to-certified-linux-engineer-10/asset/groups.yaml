    By selecting one of the three predefined security levels and selecting Next, the
    chosen security level is applied. By selecting Details, you can change the settings
    for the security level you have selected.


    If you choose the Customs Settings and then select Next, you can directly change
    the details of the security configuration.


    The dialogs for the detail settings look the same for every security level, but
    the preselected options are different. In the following dialogs, you see the settings
    for Level 3 (Network Server).


    In the first dialog you can change the default password requirements that are
    accepted by the systems:


    # Figure 6-4


    ![](img/8279afe915b153902294b0e58311b75a_109_0.png)


    From this dialog, you can select or enter the following password settings (mainly
    stored in /etc/login.defs, some values also in /etc/default/passwd and /etc/security/pam_pwcheck.conf):'
  - "[PAGE 110]\n\n+   - **Check New Passwords.** It is important to choose a password\
    \ that cannot be found in a dictionary and is not a name or other simple, common\
    \ word. By selecting this option, you enforce password checking in regard to these\
    \ rules.\n+   - **Test for Complicated Passwords.** Passwords should be constructed\
    \ using a mixture of uppercase and lower case characters as well as numbers. Special\
    \ characters like (: etc. may be used too, but could be hard to enter on a different\
    \ keyboard layout. This makes it very difficult to guess the password. Select\
    \ this option to enable additional checks.\n+   - **Password Encryption Method.**\
    \ From the drop-down list, select one of the following encryption methods:\n+\
    \     - **DES.** This is the lowest common denominator. It works in all network\
    \ environments, but it restricts you to passwords no longer than eight characters.\
    \ If you need compatibility with other systems, select this method.\n+     - **MD5.**\
    \ This encryption method allows longer passwords and is supported by all current\
    \ Linux distributions, but not by other systems or older software.\n+     - **Blowfish.**\
    \ This encryption method uses the blowfish algorithm to encrypt passwords. It\
    \ is not yet supported by many systems. A lot of CPU power is needed to calculate\
    \ the hash, which makes it difficult to crack passwords with the help of a dictionary.\
    \ It is used as default encryption method on SLES 10\n+   - **Minimum Acceptable\
    \ Password Length.** Enter the minimum number of characters for an acceptable\
    \ password. If a user enters fewer characters, the password is rejected.\n+  \
    \ \n+   Entering 0 disables this check.\n+   - **Password Age.** Minimum refers\
    \ to the number of days that have to elapse before a password can be changed again.\
    \ Maximum is the number of days after which a password expires and must be changed."
  - '[PAGE 111]


    +   - **Days Before Password Expires Warning.** A warning is issued to the user
    this number of days before password expiration.


    Although root receives a warning when setting a password, she can still enter
    a bad password despite the above settings.


    When you finish configuring password settings, continue by selecting Next. The
    following appears:


    # Figure 6-5


    ![](img/8279afe915b153902294b0e58311b75a_111_0.png)


    From this dialog, you can select the following boot settings (which update the
    file /etc/inittab):


    +   - **Interpretation of Ctrl + Alt + Del.** When someone at the console presses
    the Ctrl+Alt+Del keystroke combination, the system usually reboots.'
  - '[PAGE 112]


    +   - **Ignore.** Sometimes you want to have the system ignore this keystroke
    combination, especially when the system serves as both workstation and server.
    Nothing happens when the **Ctrl+Alt+Del** keystroke combination is pressed.

    +   - **Reboot.** The system reboots when the **Ctrl+Alt+Del** keystroke combination
    is pressed.

    +   - **Halt.** The system is shut down when the **Ctrl+Alt+Del** keystroke combination
    is pressed.


    # **Shutdown Behavior of KDM.** You use this option to set who is allowed to shut
    down the computer from KDM.


    +   - **Only Root.** To halt the system, the root password has to be entered.

    +   - **All Users.** Everyone, even remotely connected users, can halt the system
    using KDM.

    +   - **Nobody.** Nobody can halt the system with KDM.

    +   - **Local Users.** Only locally connected users can halt the system with KDM.

    +   - **Automatic.** The system is halted automatically after log out.


    For a server system you should use **Only Root** or **Nobody** to prevent normal
    or even remote users from halting the system'
