    # SECTION 3 Manage Hardware


    Although most hardware devices can be configured with YaST or are even automatically
    detected when plugged into the system, it is sometimes helpful to understand how
    things work in the background.


    In this section, you are introduced to the SUSE Linux Enterprise Server 10 hardware
    management and how device drivers are loaded.


    You also learn how to add and replace certain types of hardware.


    # Objectives


    +   1. Describe the Differences between Devices and Interfaces

    +   2. Describe how Device Drivers Work

    +   3. Describe how Device Drivers Are Loaded

    +   4. Manage Kernel Modules Manually

    +   5. Describe the sysfs File System

    +   6. Describe how udev Works

    +   7. Use the hwup Command'
  - '[PAGE 47]


    # Objective 1 Describe the Differences between Devices and Interfaces


    This objective uses the terms “device” and “interface.” These terms are often
    confused, not only by users and administrators but also by developers of operating
    systems and related tools.


    This course uses the following definitions for device and interface:


    +   - **Device.** A device is a real, physical piece of hardware. This can be
    a PCI network card, an AGP graphic adapter, a USB printer, or any kind of hardware
    that you can hold, feel, or break if you want to.

    +   - **Interface.** An interface is a software component associated with a device.
    To use a physical piece of hardware, it needs to be accessed by a software interface.


    A device can have more than one interface.


    Interfaces are usually created by a driver. In Linux, a driver is usually a software
    module that can be loaded into the Linux kernel. Therefore, a driver can be seen
    as the glue between a device and its interfaces.'
