  mdcn: "\n主服务器的配置文件如下所示：\n\n```\nfailover peer \"digitalairlines\" {\n    primary;\n\
    \    address 10.0.0.10;\n    port 847;\n    peer address 10.0.0.12;\n    peer\
    \ port 647;\n    max-response-delay 180;\n    mclt 1800;\n    split 128;\n   \
    \ load balance max seconds 3;\n}\n# Now we include the identical configuration\
    \ on both\n# machines\ninclude \"/etc/dhcpd.conf.master\";\n```\n\n此示例对等声明中的语句如下：\n\
    \n- **主服务器和辅助服务器。** 确定服务器是主服务器还是辅助服务器，如前所述。\n- **地址。** 指定服务器应在其上侦听来自其故障转移对等方的连接的\
    \ IP 地址或 DNS 名称。\n- **端口。** 指定服务器应在其上侦听来自其故障转移对等方的连接的 TCP 端口（默认值：647 和 847）。必须指定此参数，因为故障转移协议尚未保留\
    \ TCP 端口号。\n- **对端地址。** 指定服务器为了到达其故障转移对等方而应连接的 IP 地址或 DNS 名称。\n- **对端端口。** 指定服务器为了向故障转移对等方发送故障转移消息而应连接的\
    \ TCP 端口。必须指定此参数，因为故障转移协议尚未保留 TCP 端口号。对端端口可以与端口相同。\n- **最大响应延迟。** 指定 DHCP 服务器在未收到来自其故障转移对等方的消息后等待多少秒，才假定该连接已失败。\n\
    \n此数字应足够小，使得暂时性网络故障导致连接中断时，不会使服务器长时间失去通信；同时又要足够大，以免服务器不断建立和断开连接。\n\n必须指定此参数。\n\
    \n- **最大客户端提前时间。** 定义最大客户端提前时间（Maximum Client Lead Time）。该参数必须在主服务器上指定，也可以在辅助服务器上指定。这是任一故障转移对等方在不联系另一方的情况下可以续订租约的时间长度。\n\
    \n此值设置得越长，运行中的服务器在进入 PARTNER-DOWN 状态后恢复 IP 地址所需的时间就越长。设置得越短，服务器在无法通信时承受的负载就越大。\n\
    \n建议值为 1800。\n\n- **拆分值。** 指定主服务器和辅助服务器之间用于负载均衡的拆分比例。\n\n每当客户端发起 DHCP 请求时，DHCP\
    \ 服务器会对客户端标识执行哈希计算。如果哈希结果小于拆分值，则由主服务器应答；如果结果大于或等于拆分值，则由辅助服务器应答。\n\n有意义的值为 128，且只能在主服务器上配置。\n\
    \n- **负载均衡最大秒数。** 指定一个截止时间，超过该时间后负载均衡将被禁用。该截止时间基于客户端发送其第一条 DHCPDISCOVER 或 DHCPREQUEST\
    \ 消息后的秒数。\n\n手册页建议将此值设置为 3 或 5。其效果是，如果其中一个故障转移对等方进入响应故障转移消息但不响应某些客户端请求的状态，另一个故障转移对等方将在客户端重试时自动接管其客户端负载。\n\
    \n## 升级到 Linux 认证工程师 10\n\n辅助服务器的配置文件如下所示：\n\n```\nfailover peer \"digitalairlines\"\
    \ {\n    secondary;\n    address 10.0.0.12;\n    port 647;\n    peer address 10.0.0.10;\n\
    \    peer port 847;\n    max-response-delay 180;\n    load balance max seconds\
    \ 3;\n}\n# Now we include the identical configuration on both\n# machines\n# include\
    \ \"/etc/dhcpd.conf.master\";\n```\n\n与主服务器配置的差异在于：语句\"secondary\"、缺少语句 mclt 和\
    \ split，以及 address、port、peer address 和 peer port 的值互换。\n\n主 DHCP 服务器配置包含在文件 /etc/dhcpd.conf.master\
    \ 中，该文件被两个配置所包含。\n\n为了让 DHCP 服务器找到该文件，需要将其复制到 DHCP 服务器的 chroot 环境中。实现此目的的最佳方法是修改\
    \ /etc/sysconfig/dhcpd 中的 DHCP_CONF_INCLUDE_FILES 变量：DHCP_CONF_INCLUDE_FILES=\"\
    /etc/dhcpd.conf.master\"\n"
