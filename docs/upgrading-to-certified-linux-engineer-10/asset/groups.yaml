  mdcn: "\n\n## 目标 3 复制 OpenLDAP 服务器\n\n如果 LDAP 服务器的请求很多，你可能需要不止一台服务器。一台服务器是主服务器。其他服务器是从服务器。主/从配置提供了一种有效的方式来增加容量、可用性和可靠性。\n\
