    # Understand the Xen Architecture


    Xen consists of the following two major components:


    +   - **Virtual Machine Monitor.** The virtual machine monitor forms a layer between
    physical hardware and virtual machines. In general this kind of software is called
    a **Hypervisor**.


    +   - **Xen tools.** The Xen tools are a set of command line applications that
    are used to administer virtual machines.


    The virtual machine monitor must be loaded before any of the virtual machines
    are started. When working with Xen, virtual machines are called **domains**.


    The Xen virtual machine monitor neither includes any drivers to access the physical
    hardware of the host machine nor an interface to communicate directly with an
    administrator. These tasks are performed by an operating system running in the
    privileged **domain0**.


    The following is an overview of a Xen system with three domains.


    Figure 8-4


    ![](img/8279afe915b153902294b0e58311b75a_139_0.png)'
  - '[PAGE 140]


    A process called xend runs in the domain0 Linux installation. This process is
    used to manage all Xen domains running on a system and to provide access to their
    consoles.


    A unprivileged domain is also called domainU in the Xen terminology.


    SUSE Linux Enterprise Server 10 can be used for privileged (domain0) and unprivileged
    (domainU) Xen domains.'
  - '[PAGE 141]


    # Objective 3 Install Xen


    To setup a Xen system, your start from a normal SUSE Linux Enterprise 10 installation,
    which is going to run in domain0.


    The other Xen domains can later be installed in physical partitions or file system
    images. When you plan to use physical partitions, you have to make sure that the
    initial SUSE Linux Enterprise Server 10 installation is not using all of the available
    disc space.


    For maximum flexibility it makes sense to use the logical volume manager LVM or
    EVMS for a Xen system.


    The following packages have to be installed in the initial SUSE Linux Enterprise
    Server 10 installation:


    +   - **xen.** This package contains the Xen virtual machine monitor (Hypervisor).

    +   - **xen-tools.** Contains xend and a collection of command line tools to administer
    a Xen system.

    +   - **kernel-xen.** This package contains a modified Linux kernel that runs
    in a Xen domain.

    +   - **xen-doc-*** (optional). Xen documentation in various formats.


    The installation of the Xen package automatically adds an entry like the following
    into the bootloader configuration file /boot/grub/menu.lst.


    ```

    title Xen

    root (hd0,3)

    kernel /boot/xen.gz

    module /boot/vmlinuz-Xen root=/dev/hda3 selinux=0

    module /boot/initrd-Xen

    ```'
  - '[PAGE 142]


    On some Xen systems you might see the parameter dom0_mem in the kernel module
    line. This parameter assigns a certain amount of initial main memory to domain0
    at boot time. However in Xen version 3, this parameter is not required anymore.


    Initially all available memory is used by domain0. When you start additional domainUs,
    the required amount of memory is reduced in domain0 and used for the new domainU.


    The entry in menu.lst adds a new option to the boot menu of your system. When
    selecting this entry, the Xen virtual machine monitor is loaded (kernel/boot/xen.gz)
    which starts SUSE Linux Enterprise Server 10 in domain0 (see the lines starting
    with module).


    Before rebooting your system with the Xen option, you should check if the automatically
    generated entry is correct. Make sure that ...


    +   - ... the line root (hd0,3) points to the filesystem which contains the Xen
    Virtual Machine Monitor and the Kernel of the Linux installation for domain0.
    In our example hd0,3 means the fourth partition on the first hard drive in the
    system. Also check if the parameter root in the first module line points to the
    root partition of the domain0 installation.

    +   - ... the Xen version of the Linux kernel and the initrd are loaded in the
    module line. The names of the image files should end in -xen.


    After checking the bootloader configuration file, you can reboot your system and
    select the Xen option at the bootloader menu. In the early stages of the boot
    process, you will see some messages of the Xen virtual machine monitor on the
    screen. Then the domain0 Linux installation is started.


    In case the system is not booting properly, you can switch back to a non-virtualized
    system by selecting the regular SUSE Linux Enterprise Server 10 boot option.'
