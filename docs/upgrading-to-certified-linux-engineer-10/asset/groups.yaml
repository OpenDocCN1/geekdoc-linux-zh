    # Understand Virtualization Methods


    Before we talk in detail about the Xen technology, you should understand the following
    two different virtualization methods.


    +   - **Full Virtualization.** In this case the virtualization software emulates
    a full virtual machine including all hardware resources. The operating system
    running in the virtual machine (guest OS) communicates with these resources as
    if they were physical hardware. VMware Workstation is a popular full virtualization
    software.


    Figure 8-2


