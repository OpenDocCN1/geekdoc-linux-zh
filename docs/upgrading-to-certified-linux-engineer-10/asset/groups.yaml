  mdcn: "\n\n## Objective 1 配置 PAM 用户认证\n\n用户认证在 IT 安全中发挥着核心作用。Linux 在认证过程中使用 PAM（可插拔认证模块），作为用户与应用程序之间的层。Linux\
    \ 系统管理员可以使用这些模块来配置程序应如何认证用户。\n\n通过通过认证模块为应用程序提供系统范围的访问，认证不必成为每个需要认证的应用程序的一部分。可插拔认证模块为应用程序承担了这一任务。\n\
    \n例如，当用户在虚拟终端上登录 Linux 系统时，通常会涉及一个名为 login 的程序。\n\nLogin 需要用户的登录名和密码。密码被加密，然后与存储在认证数据库中的加密密码进行比较。如果加密密码相同，login\
    \ 会通过启动用户的登录 shell 来授予用户访问系统的权限。\n\n如果使用其他认证程序，例如智能卡，则执行用户认证的所有程序都必须能够与这些智能卡协同工作。在引入\
    \ PAM 之前，所有处理认证的应用程序，如 login、FTP 或 SSH，都必须扩展以支持智能卡读卡器。\n\nPAM 让事情变得更简单。PAM 创建了一个软件层，在应用程序（如\
    \ login）和当前认证机制之间具有明确定义的接口。无需修改每个程序，一个新的 PAM 模块即可启用使用智能卡读卡器的认证。在为应用程序调整 PAM 配置后，该应用程序可以使用这种新的认证方法。\n\
    \n### Figure 6-1\n\n下图说明了 PAM 的作用：\n\n![](img/8279afe915b153902294b0e58311b75a_94_0.png)\n\
    \n第三方厂商可以提供其他 PAM 模块，以为其产品启用特定的认证功能，例如启用 Novell 的 Linux 用户管理（LUM）通过 eDirectory\
    \ 进行认证的 PAM 模块。\n\n要了解如何配置 PAM，您需要知道以下内容：\n\n- PAM 配置文件的位置和用途\n- PAM 配置\n- PAM\
    \ 配置文件示例\n- 安全密码指南\n- PAM 文档资源\n\n### Location and Purpose of PAM Configuration\
    \ Files\n\nPAM 提供各种模块——每个模块都有不同的用途。例如，一个模块检查密码，另一个验证系统访问的位置，还有一个读取用户特定的设置。\n\n\
    每个依赖 PAM 模块的程序都有自己的配置文件 /etc/pam.d/program_name。例如，程序 passwd 的配置文件称为 /etc/pam.d/passwd。\n\
    \n有一个名为 other 的特殊配置文件。此文件包含在找不到应用程序特定文件时的默认配置。\n\n此外，大多数 PAM 模块在 /etc/security/\
    \ 中有全局配置文件，这些文件定义了这些模块的确切行为。这些文件包括 pam_env.conf、pam_pwcheck.conf、pam_unix2.conf\
    \ 和 time.conf 等。\n\n每个使用 PAM 模块的应用程序实际上调用一组 PAM 函数。这些函数在模块中实现，根据各种配置文件中的信息执行认证过程，并将结果返回给调用应用程序。\n\
    \n### PAM Configuration\n\nPAM 配置文件中的每一行包含 3 列加可选参数：\n\n### Figure 6-2\n\n![](img/8279afe915b153902294b0e58311b75a_96_0.png)\n\
    \n下面描述了每一列的用途：\n\n- **Module Type.** PAM 模块有四种类型：\n  - **auth.** 这些模块提供两种认证用户的方式。首先，它们通过指示应用程序提示用户输入密码或其他身份识别方式来确认用户就是其声称的人。其次，模块可以通过其凭证授予属性授予组成员身份或其他特权。\n\
