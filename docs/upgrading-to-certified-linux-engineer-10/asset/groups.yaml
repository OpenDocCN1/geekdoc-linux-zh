    ## Configure the Novell Customer Center


    To access the configuration of the Novell Customer Center, start the YaST Control
    Center and select Software > Novell Customer Center Configuration. You can also
    start the dialog directly from a terminal window as root by entering yast2 inst_suse_register.
    The dialog is the same as that offered during installation for this purpose:


    Figure 13-1


    ![](img/8279afe915b153902294b0e58311b75a_308_0.png)


    Selecting Details shows what information is being collected and sent.


    With a browser, the Novell Customer Center can be accessed at http://www.novell.com/center/.
    After you have created a Novell account, you need to register your product with
    the registration code delivered with the SUSE Linux Enterprise Server 10 product.


    The SUSE Linux Enterprise Server 10 DVD you received as part of of your student
    kit does not include maintenance. Visit the Novell Customer Center for information
    on how to take part in the SUSE Linux Enterprise Server 10 Maintenance Program.


    Only registered products with a valid maintenance contract can be updated with
    the YOU module.


    ## Use the YaST Online Update


    The following is a quick guide to applying software updates with YOU.


    Start the YOU module from the YaST Control Center by selecting Software > Online
    Update.


    The following appears:


    Figure 13-2


    ![](img/8279afe915b153902294b0e58311b75a_309_0.png)


    On the top left side of the dialog all available patches are displayed. Select
    an entry to see details for the update on the right side of the dialog. To have
    an update installed in the next step, select the check box next to the corresponding
    entry.


    Select Accept to start the update process.


    Depending on your selection an Automatic Changes dialog appears:


    Figure 13-3


    ![](img/8279afe915b153902294b0e58311b75a_310_0.png)


    Accept the changes by selecting Continue; the patches are transferred from the
    update server and installed.


    Figure 13-4


    During the installation process YOU displays the following dialog:


    ![](img/8279afe915b153902294b0e58311b75a_311_0.png)


    Sometimes additional information is displayed for some updates.


    These dialogs need to be confirmed to install the corresponding software package.


    Once all updates have been downloaded and installed, select Finish to close the
    dialog.


    ## Objective 2   Understand Recent Match of iptables


    The recent match can be used to dynamically create a list of IP addresses and
    create rules regarding those IP addresses.


    There are, for instance, automated attacks that try to guess accounts and passwords
    via ssh. Using the recent match, you can temporarily block traffic from the machine
    that originates this attack.


    The information is kept in /proc/net/ipt_recent/DEFAULT, unless you specify a
    different name with the option --name. Specifying a name is useful if you want
    to keep track of different IP addresses in various rules.


    The following is an example for ssh:


    ```

    # Drop if 2 hits or more within the last 60 seconds

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --update
    --seconds 60 --hitcount 2 -j DROP

    # Add the source address to the list

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --set

    ```


    For the first ssh connection, the first rule does not match. The second rule creates
    a new entry in the recent list DEFAULT: because there is no target defined with
    -j, the packet travels down the chain and gets checked by subsequent rules.


    For the second ssh connection the hitcount is one, so the first rule still does
    not match. The second rule updates the entry in the DEFAULT list, and the hitcount
    is now 2.


    When the third packet arrives within a minute after the second packet, the first
    rule matches and the packet is dropped.


    A legitimate user who mistyped his password would have to wait 60 seconds to have
    another try after two failures.


    ## Objective 3 Log to a Remote Host


    The syslog-ng used to log system messages on SUSE Linux Enterprise Server 10 can
    send messages to and receive messages from other computers. The receiving computer
    is sometimes referred to as loghost.


    Configuration changes are necessary on both sides:


    - Client Side Configuration of Syslog-ng

    - Server Side Configuration of Syslog-ng


    ### Client Side Configuration of Syslog-ng


    Logging to other computers is configured in /etc/syslog-ng/syslog-ng.conf.in,
    as in the following example:


    ```

    destination tologhost { udp(10.0.0.254 port(514)); };

    log { source(src); destination(tologhost); };

    ```


    The first line defines a destination tologhost, with protocol, IP address (you
    could also use the host name), and port. The second line configures logging to
    this destination. Because no filter is included, all messages from the source
    src get sent to the destination tologhost.


    After editing the file /etc/syslog-ng/syslog-ng.conf.in, run SuSEconfig --module
    syslog-ng to transfer the changes to /etc/syslog-ng/syslog-ng.conf, which is the
    actual configuration file used by syslog-ng.

    '
  mdcn: '


    ## 配置 Novell 客户中心


    要访问 Novell 客户中心的配置，请启动 YaST 控制中心并选择 软件 > Novell 客户中心配置。您也可以直接从终端窗口以 root 身份启动该对话框，输入
    yast2 inst_suse_register。该对话框与安装期间为此目的提供的对话框相同：


    Figure 13-1


    ![](img/8279afe915b153902294b0e58311b75a_308_0.png)


    选择 Details 可显示正在收集并发送的信息。


    通过浏览器，可以在 http://www.novell.com/center/ 访问 Novell 客户中心。在创建 Novell 账户后，您需要使用随 SUSE
    Linux Enterprise Server 10 产品提供的注册码注册您的产品。


    您作为学生套件一部分收到的 SUSE Linux Enterprise Server 10 DVD 不包含维护。访问 Novell 客户中心，了解如何参与
    SUSE Linux Enterprise Server 10 维护计划。


    只有具有有效维护合同的已注册产品才能通过 YOU 模块进行更新。


    ## 使用 YaST 在线更新


    以下是使用 YOU 应用软件更新的快速指南。


    从 YaST 控制中心启动 YOU 模块，选择 软件 > 在线更新。


    出现以下内容：


    Figure 13-2


    ![](img/8279afe915b153902294b0e58311b75a_309_0.png)


    在对话框左上方显示所有可用的补丁。选择一个条目可在对话框右侧查看该更新的详细信息。要在下一步中安装更新，请选中对应条目旁边的复选框。


    选择 Accept 开始更新过程。


    根据您的选择会出现 Automatic Changes 对话框：


    Figure 13-3


    ![](img/8279afe915b153902294b0e58311b75a_310_0.png)


    通过选择 Continue 接受更改；补丁将从更新服务器传输并安装。


    Figure 13-4


    在安装过程中，YOU 显示以下对话框：


    ![](img/8279afe915b153902294b0e58311b75a_311_0.png)


    有时某些更新会显示额外信息。


    需要确认这些对话框才能安装相应的软件包。


    所有更新下载并安装完成后，选择 Finish 关闭对话框。


    ## Objective 2   Understand Recent Match of iptables


    recent 匹配可用于动态创建 IP 地址列表并针对这些 IP 地址创建规则。


    例如，存在尝试通过 ssh 猜测账户和密码的自动化攻击。使用 recent 匹配，您可以暂时阻止发起此攻击的机器的流量。


    信息保存在 /proc/net/ipt_recent/DEFAULT 中，除非您使用选项 --name 指定不同的名称。指定名称很有用，如果您想在各种规则中跟踪不同的
    IP 地址。


    以下是 ssh 的示例：


    ```

    # Drop if 2 hits or more within the last 60 seconds

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --update
    --seconds 60 --hitcount 2 -j DROP

    # Add the source address to the list

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent --set

    ```


    对于第一次 ssh 连接，第一条规则不匹配。第二条规则在 recent 列表 DEFAULT 中创建新条目：因为没有使用 -j 定义目标，数据包会沿链向下传递并被后续规则检查。


    对于第二次 ssh 连接，hitcount 为 1，因此第一条规则仍然不匹配。第二条规则更新 DEFAULT 列表中的条目，hitcount 现在为 2。


    当第三个数据包在第二个数据包后一分钟内到达时，第一条规则匹配，数据包被丢弃。


    合法用户在两次失败后需要等待 60 秒才能再次尝试，因为密码输入错误。


    ## Objective 3 Log to a Remote Host


    SUSE Linux Enterprise Server 10 上用于记录系统消息的 syslog-ng 可以向其他计算机发送消息并从其他计算机接收消息。接收计算机有时被称为
    loghost。


    两端都需要进行配置更改：


    - Client Side Configuration of Syslog-ng

    - Server Side Configuration of Syslog-ng


    ### Client Side Configuration of Syslog-ng


    日志记录到其他计算机是在 /etc/syslog-ng/syslog-ng.conf.in 中配置的，如以下示例所示：


    ```

    destination tologhost { udp(10.0.0.254 port(514)); };

    log { source(src); destination(tologhost); };

    ```


    第一行定义了一个目标 tologhost，包含协议、IP地址（您也可以使用主机名）和端口。第二行配置向此目标的日志记录。由于未包含过滤器，所有来自源 src
    的消息都会发送到目标 tologhost。


    编辑文件 /etc/syslog-ng/syslog-ng.conf.in 后，运行 SuSEconfig --module syslog-ng 将更改传输到
    /etc/syslog-ng/syslog-ng.conf，后者是 syslog-ng 实际使用的配置文件。


    '
