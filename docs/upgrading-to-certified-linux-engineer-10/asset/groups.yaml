    # # Exercise 11-1 Set Up OpenLDAP with YaST


    In this exercise, you set up an OpenLDAP server and client using YaST. The base
    DN is “dc=digitalairlines,dc=com” and the common name of the LDAP administrator
    is “cn=Administrator,dc=digitalairlines,dc=com” with password “novel”. TLS/SSL
    is not used in this exercise.


    Do the following:


    +   - Part I - Install OpenLDAP

    +   - Part II - Setup the OpenLDAP Server

    +   - Part III - Setup the OpenLDAP Client




    +   1. From the main menu, start YaST.

    +   2. Enter root password (novel) and select OK.

    +   3. From the YaST Control Center, select Software > Software Management.

    +   4. From the filter drop-down menu, select Search.

    +   5. In the Search field, enter ldap; then select Search.

    +   6. On the right, select the following packages:

    +      - nss_ldap

    +      - openldap2

    +      - openldap2-client

    +      - pam_ldap

    +   7. Select Accept; then insert the requested SUSE Linux Enterprise Server 10
    DVD.

    +   8. When installation is complete, remove the DVD and close the YaST Control
    Center.'
