  mdcn: "\n\n通过选择三个预定义的其中一个安全级别并选择 Next，所选的安全级别将被应用。通过选择 Details，您可以更改所选安全级别的设置。\n\
    \n如果您选择 Customs Settings 然后选择 Next，您可以直接更改安全配置的详细信息。\n\n每个安全级别的详细设置对话框看起来都一样，但预选的选项不同。在以下对话框中，您可以看到\
