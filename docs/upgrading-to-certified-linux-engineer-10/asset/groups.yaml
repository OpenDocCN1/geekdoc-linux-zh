- raw:
  - '[PAGE 186]


    # SECTION 10 Configure DHCP Pools and Failover


    DHCP pools and failover are not new features of the dhcpd. But they are new in
    the CLE curriculum.


    # Objectives


    +   1. Configure DHCP Pools

    +   2. Configure DHCP Failover'
  - "[PAGE 187]\n\n# Objective 1 Configure DHCP Pools\n\nThe pool declaration can\
    \ be used to specify a pool of addresses that will be treated differently than\
    \ any other pool of addresses, even on the same network segment or subnet.\n\n\
    For example, you may want to provide a large set of addresses that can be assigned\
    \ to DHCP clients that are registered to your DHCP server, while providing a smaller\
    \ set of addresses, possibly with short lease times, that are available for unknown\
    \ clients.\n\nTo do this, you would set up a pair of pool declarations:\n\n```\n\
    subnet 10.0.0.0 netmask 255.255.255.0 {\n  option routers 10.0.0.254;\n\n  # Unknown\
    \ clients get this pool.\n  pool {\n    option domain-name-servers 10.0.0.254;\n\
    \    max-lease-time 300;\n    range 10.0.0.100 10.0.0.250;\n    allow unknown-clients;\n\
    \  }\n\n  # Known clients get this pool.\n  pool {\n    option domain-name-servers\
    \ 10.0.0.251, 10.0.0.252;\n    max-lease-time 28800;\n    range 10.0.0.5 10.0.0.99;\n\
    \    deny unknown-clients;\n  }\n}\n```\n\nIt is also possible to set up entirely\
    \ different subnets for known and unknown clients. \"Known clients\" mean, that\
    \ an IP address is assigned to a MAC address using the host statement. Pools exist\
    \ at the level of shared networks, so address ranges within pool declarations\
    \ can be on different subnets."
  - '[PAGE 188]


    As you can see in the preceding example, pools can have permit lists that control
    which clients are allowed access to the pool and which aren''t.


    Each entry in a pool''s permit list is introduced with the allow or deny keyword.
    If a pool has a permit list, then only those clients that match specific entries
    on the permit list will be eligible to be assigned addresses from the pool.


    If a pool has a deny list, then only those clients that do not match any entries
    on the deny list will be eligible. If both permit and deny lists exist for a pool,
    then only clients that match the permit list and do not match the deny list will
    be allowed access.'
  - '[PAGE 189]


    # Objective 2 Configure DHCP Failover


    This objective covers the following topics:


    +   - Basics of DHCP Failover

    +   - Configure Failover


    # Basics of DHCP Failover


    The failover protocol allows two DHCP servers (and no more than two) to share
    a common address pool. Each server will have about half of the available IP addresses
    in the pool at any given time for allocation.


    If one server fails, the other server will continue to renew leases out of the
    pool, and will allocate new addresses out of the half of available addresses that
    it had before communication with the other server was lost.


    When a server starts that has not previously communicated with its failover peer,
    it must establish communications and synchronize with the peer before it can serve
    clients. This can happen either because you have just configured your DHCP servers
    to perform failover for the first time, or because one of your failover servers
    has failed and lost its database.


    The initial recovery process is designed to ensure that when one failover peer
    loses its database and then resynchronizes, any leases that the failed server
    gave out before it failed will be honored. When the failed server starts up, it
    notices that it has no saved failover state and attempts to contact its peer.'
  - '[PAGE 190]


    When it has established contact, it asks the peer for a complete copy of its lease
    database. The peer then sends its complete database and sends a message indicating
    that it is done. The failed server then waits until MCLT (Maximum Client Lead
    Time) has passed. Once MCLT has passed, both servers make the transition back
    into normal operation.


    This waiting period ensures that any leases the failed server may have given out
    while out of contact with its partner will have expired.


    While the failed server is recovering, its partner remains in the partner-down
    state, which means that it is serving all clients. The failed server provides
    no service at all to DHCP clients until it has made the transition into normal
    operation.


    In the case where both servers detect that they have never before communicated
    with their partner, they both come up in this recovery state and follow the procedure
    we have just described. In this case, no service will be provided to DHCP clients
    until MCLT has expired.


    # Configure Failover


    In a failover configuration you have to decide which server acts as the primary
    and which acts as the secondary server. Both servers need to have the same configuration
    for the basic DHCP service they are sharing. They only differ in the failover
    setup. Therefore, it is recommended to have a common configuration file on both
    machines which is included in the file /etc/dhcpd.conf.'
  md: "\n## SECTION 10 Configure DHCP Pools and Failover\n\nDHCP pools and failover\
    \ are not new features of the dhcpd. But they are new in the CLE curriculum.\n\
    \n## Objectives\n\n- 1. Configure DHCP Pools\n- 2. Configure DHCP Failover\n\n\
    ## Objective 1 Configure DHCP Pools\n\nThe pool declaration can be used to specify\
    \ a pool of addresses that will be treated differently than any other pool of\
    \ addresses, even on the same network segment or subnet.\n\nFor example, you may\
    \ want to provide a large set of addresses that can be assigned to DHCP clients\
    \ that are registered to your DHCP server, while providing a smaller set of addresses,\
    \ possibly with short lease times, that are available for unknown clients.\n\n\
    To do this, you would set up a pair of pool declarations:\n\n```\nsubnet 10.0.0.0\
    \ netmask 255.255.255.0 {\n  option routers 10.0.0.254;\n\n  # Unknown clients\
    \ get this pool.\n  pool {\n    option domain-name-servers 10.0.0.254;\n    max-lease-time\
    \ 300;\n    range 10.0.0.100 10.0.0.250;\n    allow unknown-clients;\n  }\n\n\
    \  # Known clients get this pool.\n  pool {\n    option domain-name-servers 10.0.0.251,\
    \ 10.0.0.252;\n    max-lease-time 28800;\n    range 10.0.0.5 10.0.0.99;\n    deny\
    \ unknown-clients;\n  }\n}\n```\n\nIt is also possible to set up entirely different\
    \ subnets for known and unknown clients. \"Known clients\" mean, that an IP address\
    \ is assigned to a MAC address using the host statement. Pools exist at the level\
    \ of shared networks, so address ranges within pool declarations can be on different\
    \ subnets.\n\nAs you can see in the preceding example, pools can have permit lists\
    \ that control which clients are allowed access to the pool and which aren't.\n\
    \nEach entry in a pool's permit list is introduced with the allow or deny keyword.\
    \ If a pool has a permit list, then only those clients that match specific entries\
    \ on the permit list will be eligible to be assigned addresses from the pool.\n\
    \nIf a pool has a deny list, then only those clients that do not match any entries\
    \ on the deny list will be eligible. If both permit and deny lists exist for a\
    \ pool, then only clients that match the permit list and do not match the deny\
    \ list will be allowed access.\n\n## Objective 2 Configure DHCP Failover\n\nThis\
    \ objective covers the following topics:\n\n- Basics of DHCP Failover\n- Configure\
    \ Failover\n\n### Basics of DHCP Failover\n\nThe failover protocol allows two\
    \ DHCP servers (and no more than two) to share a common address pool. Each server\
    \ will have about half of the available IP addresses in the pool at any given\
    \ time for allocation.\n\nIf one server fails, the other server will continue\
    \ to renew leases out of the pool, and will allocate new addresses out of the\
    \ half of available addresses that it had before communication with the other\
    \ server was lost.\n\nWhen a server starts that has not previously communicated\
    \ with its failover peer, it must establish communications and synchronize with\
    \ the peer before it can serve clients. This can happen either because you have\
    \ just configured your DHCP servers to perform failover for the first time, or\
    \ because one of your failover servers has failed and lost its database.\n\nThe\
    \ initial recovery process is designed to ensure that when one failover peer loses\
    \ its database and then resynchronizes, any leases that the failed server gave\
    \ out before it failed will be honored. When the failed server starts up, it notices\
    \ that it has no saved failover state and attempts to contact its peer.\n\nWhen\
    \ it has established contact, it asks the peer for a complete copy of its lease\
    \ database. The peer then sends its complete database and sends a message indicating\
    \ that it is done. The failed server then waits until MCLT (Maximum Client Lead\
    \ Time) has passed. Once MCLT has passed, both servers make the transition back\
    \ into normal operation.\n\nThis waiting period ensures that any leases the failed\
    \ server may have given out while out of contact with its partner will have expired.\n\
    \nWhile the failed server is recovering, its partner remains in the partner-down\
    \ state, which means that it is serving all clients. The failed server provides\
    \ no service at all to DHCP clients until it has made the transition into normal\
    \ operation.\n\nIn the case where both servers detect that they have never before\
    \ communicated with their partner, they both come up in this recovery state and\
    \ follow the procedure we have just described. In this case, no service will be\
    \ provided to DHCP clients until MCLT has expired.\n\n### Configure Failover\n\
    \nIn a failover configuration you have to decide which server acts as the primary\
    \ and which acts as the secondary server. Both servers need to have the same configuration\
    \ for the basic DHCP service they are sharing. They only differ in the failover\
    \ setup. Therefore, it is recommended to have a common configuration file on both\
    \ machines which is included in the file /etc/dhcpd.conf.\n"
  mdcn: "\n\n## 第 10 节 配置 DHCP 池和故障转移\n\nDHCP 池和故障转移并不是 dhcpd 的新功能。但它们在 CLE 课程中是新的。\n\
    \n## 目标\n\n- 1. 配置 DHCP 池\n- 2. 配置 DHCP 故障转移\n\n## 目标 1 配置 DHCP 池\n\npool 声明可用于指定一组地址池，这些地址将与其他地址池不同地处理，即使在同一网络段或子网中也是如此。\n\
    \n例如，您可能希望提供一组较大的地址，可分配给已注册到您的 DHCP 服务器的 DHCP 客户端，同时提供一组较小的地址，可能具有较短的租期，供未知客户端使用。\n\
    \n为此，您需要设置一对 pool 声明：\n\n```\nsubnet 10.0.0.0 netmask 255.255.255.0 {\n  option\
    \ routers 10.0.0.254;\n\n  # Unknown clients get this pool.\n  pool {\n    option\
    \ domain-name-servers 10.0.0.254;\n    max-lease-time 300;\n    range 10.0.0.100\
    \ 10.0.0.250;\n    allow unknown-clients;\n  }\n\n  # Known clients get this pool.\n\
    \  pool {\n    option domain-name-servers 10.0.0.251, 10.0.0.252;\n    max-lease-time\
    \ 28800;\n    range 10.0.0.5 10.0.0.99;\n    deny unknown-clients;\n  }\n}\n```\n\
    \n也可以为已知客户端和未知客户端设置完全不同的子网。“已知客户端”是指使用 host 语句将 IP 地址分配给 MAC 地址。池存在于共享网络的级别，因此\
    \ pool 声明中的地址范围可以位于不同的子网。\n\n正如您在前面的示例中看到的，池可以具有许可列表来控制哪些客户端允许访问该池以及哪些不允许。\n\n\
    池的许可列表中的每个条目都以 allow 或 deny 关键字引入。如果池具有许可列表，则只有与许可列表上的特定条目匹配的客户端才有资格从该池分配地址。\n\
    \n如果池具有拒绝列表，则只有与拒绝列表上的任何条目都不匹配的客户端才有资格。如果池同时存在许可列表和拒绝列表，则只有与许可列表匹配且与拒绝列表不匹配的客户端才会被允许访问。\n\
    \n## 目标 2 配置 DHCP 故障转移\n\n本目标涵盖以下主题：\n\n- DHCP 故障转移基础\n- 配置故障转移\n\n### DHCP 故障转移基础\n\
    \n故障转移协议允许两个 DHCP 服务器（不超过两个）共享一个公共地址池。每个服务器在任何给定时间都将拥有池中大约一半的可用 IP 地址用于分配。\n\n\
    如果一台服务器失败，另一台服务器将继续从池中续订租约，并从通信丢失前拥有的可用地址的一半中分配新地址。\n\n当一台从未与故障转移对等方通信过的服务器启动时，它必须建立通信并与对等方同步，然后才能为客户端提供服务。这可能发生在您刚刚配置\
    \ DHCP 服务器首次执行故障转移时，也可能发生在其中一台故障转移服务器失败并丢失其数据库时。\n\n初始恢复过程旨在确保当一个故障转移对等方丢失其数据库然后重新同步时，失败服务器在失败前分配的任何租约都将被\
    \ honoured。当失败服务器启动时，它注意到自己没有保存的故障转移状态并尝试联系其对等方。\n\n建立联系后，它会向对等方请求其租约数据库的完整副本。对等方随后发送其完整数据库并发送一条消息表示已完成。失败的服务器然后等待\
    \ MCLT（最大客户端提前时间）过去。一旦 MCLT 过去，两台服务器都将转换回正常操作。\n\n此等待期可确保失败服务器在与合作伙伴失去联系期间可能分配的任何租约都已过期。\n\
    \n在失败服务器恢复期间，其合作伙伴保持在 partner-down 状态，这意味着它正在为所有客户端提供服务。失败服务器在转换到正常操作之前根本不会为 DHCP\
    \ 客户端提供任何服务。\n\n在两种服务器都检测到它们从未与合作伙伴通信过的这种情况下，它们都会进入此恢复状态并遵循我们刚刚描述的程序。在这种情况下，在\
    \ MCLT 过期之前不会为 DHCP 客户端提供任何服务。\n\n### 配置故障转移\n\n在故障转移配置中，您必须决定哪台服务器充当主服务器，哪台充当从服务器。两台服务器都需要为它们共享的基本\
    \ DHCP 服务具有相同的配置。它们仅在故障转移设置上有所不同。因此，建议在两台机器上都有一个公共配置文件，该文件包含在文件 /etc/dhcpd.conf\
    \ 中。\n\n"
