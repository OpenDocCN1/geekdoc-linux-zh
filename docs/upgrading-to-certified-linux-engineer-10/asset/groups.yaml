  - '[PAGE 116]


    **File Permissions.** Settings for the permissions of certain system files are
    configured in **/etc/permissions.easy**, **/etc/permissions.secure**, or **/etc/permissions.paranoid**.
    You can also add your own rules to the file **/etc/permissions.local**. Each file
    contains a description of the file syntax and purpose of the preset.


    Settings in files in the directory **/etc/permissions.d/** are included as well.
    This directory is used by packages that bring their own permissions files.


    From the drop-down list, select one of the following:


    +   - **Easy.** Select this option to allow read access to most of the system
    files by users other than root.

    +   - **Secure.** Select this option to make sure that certain configuration files
    (such as /etc/ssh/sshd_config) can only be viewed by the user root. Some programs
    can only be launched by root or by daemons, not by an ordinary user.

    +   - **Paranoid.** Select this option for an extremely secure system. All SUID/SGID-Bits
    on programs have been cleared. Remember that some programs might not work correctly,
    because users no longer have the permissions to access certain files.


    Running SuSEconfig sets these permissions according to the settings in the respective
    /etc/permissions* files. This fixes files with incorrect permissions, whether
    this occurred accidentally or by intruders.


    **User Launching updatedb.** If the program updatedb is installed, it automatically
    runs on a daily basis or after booting. It generates a database (**locatedb**)
    in which the location of each file on your computer is stored.


    You can search this database with the utility locate (enter **man locate** for
    details).'
