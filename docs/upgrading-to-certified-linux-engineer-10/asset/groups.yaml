    \ 和其他被执行的程序，选择 Inherit。\n- b. 对于文件和目录，选择合适的选项，例如 #include、文件名、目录或带占位符的路径，并选择 Allow。\n\
    - 7. 当你返回到 AppArmor Profile Wizard 对话框时，选择 Finish。\n- 8. 通过使用 cat 查看 /sys/kernel/security/apparmor/profiles，确保\
    \ Firefox 配置文件处于 enforce 模式。必须存在条目 /usr/lib/firefox/firefox.sh (enforce)。如果没有，执行\
    \ enforce firefox。\n\n## Part II: 修改 Firefox 的配置文件以允许读取本地文件系统\n\n执行以下操作：\n\n-\
