    ## Objective 3 Identify GNOME Desktop Components


    The GNOME desktop includes one panel at the bottom of the screen.


    **Figure 2-5**


    ![](img/8279afe915b153902294b0e58311b75a_29_0.png)


    There is a menu at the left side of the panel. This menu is labeled Computer.
    It is called the main menu.


    The empty space in the middle of the panel includes the task manager. All opened
