    - **Hardware.** In this option you can configure the hardware configuration of
    the domain. (Memory, Number of CPUs, ...)

    - **Disks.** Configure the Disks here. These can either be physical block devices
    or file system / disc images.

    - **Network.** This option lets you add additional network adapters to the domain.

    - **Operating System Installation.** Here you can configure the installation source
    and additional installation options.


    ## Figure 8-8


    For our example we stay with the default and select Next. Now the domain environment
    and the installation process is started.


    ![](img/8279afe915b153902294b0e58311b75a_151_0.png)


    The installation itself is a standard SUSE Linux Enterprise Server installation,
    except that it runs in text mode. After the packages have been installed, the
