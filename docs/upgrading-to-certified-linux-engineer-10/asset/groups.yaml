    ```\n\n## 目标 3\n\n## 为邮件使用病毒扫描器\n\n今天，通过电子邮件进行通信对公司和个人都很重要，但电子邮件可能被病毒软件感染。\n\n\
    大多数病毒攻击 Windows 客户端，但公司的邮件服务器通常是 Linux 或 UNIX 机器。为了避免损坏，我们建议在感染的邮件到达用户客户端之前搜索病毒。\n\
    \nSUSE Linux Enterprise Server 10 提供了在邮件服务器上检测电子邮件中病毒的工具。\n\n在本目标中，介绍了以下工具：\n\n\
    - AVMailGate\n- AMaViSd-new\n\n## AVMailGate\n\nAVMailGate 是 AntiVir MailGate\
    \ 的缩写，是 H+BEDV Datentechnik GmbH 的反病毒邮件过滤器（http://www.hbedv.com）。\n\nAVMailGate\
    \ 更新病毒定义文件和引擎本身。\n\n本主题描述了以下内容：\n\n- AVMailGate 架构\n- 安装 AVMailGate\n- 配置 AVMailGate\n\
    - 理解 AVMailGate 配置文件\n- 更新 AVMailGate\n\n### AVMailGate 架构\n\n### 图 12-1\n\n![](img/8279afe915b153902294b0e58311b75a_272_0.png)\n\
    \nAVMailGate 由三个队列和两种进程组成：\n\n- **队列**（位于 `/var/spool/avmailgate/`）\n  - **incoming/**。所有传入电子邮件的输入队列。\n\
    \  - **rejected/**。可能感染的电子邮件存储的队列。\n  - **outgoing/**。未感染电子邮件的输出队列。\n- **进程**\n\
    \  - **avgated**。将传入电子邮件存储在输入队列中的 smtpd 接收器。（守护进程）\n  - **avgatefwd**。病毒扫描功能和\
    \ SMTP 转发器以及 sendmail 调用器。（守护进程）\n\n两个进程都可以通过编辑文件\n`/etc/avmailgate.conf` 进行配置。\n\
    \n该文件包含描述可能设置的注释。\n\n有关所有选项的描述，请参阅 /usr/share/packages/avmailgate/doc/MANUAL。\n\
    \n## 安装 AVMailGate\n\n要安装 AVMailGate，请选择包 avmailgate。\n\n在 rcavgate 中提供了一个启动脚本，用于启动和停止\
    \ AVMailGate。\n\n要使 AVMailGate 在系统启动时启动，请输入 insserv avgate。\n\n## 配置 AVMailGate\n\
    \n使用 Postfix 有两种可能性使用 AVMailGate：\n\n- AVMailGate 在端口 25 等待邮件并将其转发到 Postfix\n\
    - AVMailGate 被 Postfix 作为内容过滤器使用\n\n### AVMailGate 在端口 25 等待邮件并将其转发到 Postfix\n\
    \n要将 AVMailGate 用作在端口 25 等待邮件的邮件代理，你只需避免 Postfix 在此端口上监听。因此在 /etc/postfix/master.cf\
    \ 中将以下行标记为注释，在前面添加井号（“#”）\n\n```\n#smtp inet n - n - - smtpd\n```\n\n然后重新启动 Postfix。\n\
    \n### AVMailGate 被 Postfix 作为内容过滤器使用\n\n使用 Postfix 使用 AVMailGate 的最佳方式是使用完整内容过滤器\
    \ API（有关详细信息，请参阅 Postfix 包中的 FILTER_README）。\n\n它在端口 10024 上等待 SMTP 连接，并通过端口 10025\
    \ 上的 SMTP 发送扫描的电子邮件消息或病毒警告。\n\n要在 Postfix 中将 AVMailGate 集成作为过滤器，请执行以下操作：\n\n1.\
    \ 编辑 /etc/postfix/master.cf 并取消注释 –如果适用– 或添加以下行：\n\n```\nlocalhost:10025 inet\
    \ n - y - - smtpd -o content_filter=\n```\n\n2. 编辑 /etc/postfix/main.cf 并添加以下行：\n\
    \n```\ncontent_filter = smtp:127.0.0.1:10024\n```\n\n3. 由于 AVMailGate 监听端口 10024，而不是端口\
    \ 25，编辑 /etc/avmailgate.conf 并设置\n\n```\nListenAddress localhost port 10024\n\
    ```\n\n4. 你必须告诉 AVMailGate 它应该通过 SMTP 在主机 localhost 的端口 10025 上将电子邮件发送回 Postfix。编辑\
    \ /etc/avmailgate.conf 并设置\n\n```\nForwardTo SMTP: localhost port 10025\n```\n\
    \n5. 由于 AVMailGate 作为 AVMailGate 发送通知消息，请在 /etc/aliases 中设置一个别名：\n\n```\nvmailgate:\
    \ root\n```\n\n"
