    # Objective 2 Describe how Device Drivers Work


    As described before, device drivers access and use a device. There are 2 basic
    kinds of device drivers:


    +   - Kernel modules. The functionality of the Linux kernel can be extended by
    kernel modules. These modules can be loaded and removed during runtime. They allow
    the kernel to provide access to hardware.

    +   - User space drivers. Some hardware needs additional drivers that work in
    user space. Examples of this kind of hardware are printers or scanners.


    The following illustrates the roles of kernel and user space drivers:


    # Figure 3-1


    ![](img/8279afe915b153902294b0e58311b75a_48_0.png)'
  - '[PAGE 49]


    While the handling of user space drivers depends on the framework they are used
    in, you can manage kernel modules with the following commands:


    +   - **lsmod.** This command lists all loaded kernel modules. For example:

    +     `lsmod`


    +   - **modprobe.** This command loads kernel modules. Because kernel modules
    can depend on each other, modprobe automatically resolves these dependencies and
    loads all required modules. For example:

    +     `modprobe usb-storage`

    +     In this example, modprobe loads the usb-storage module which is needed to
    access storage devices connected with the USB bus.

    +     Because this module requires other USB modules, modprobe also loads these
    modules.


    +   - **rmmod.** This command removes loaded kernel modules. For example:

    +     `rmmod usb-storage`

    +     Only modules that are not needed can be removed. In this example, the USB
    device first has to be disconnected before the usb-storage module can be removed.


    Kernel modules are files that are stored in the directory `/lib/modules/kernel-version/`.


    Because modules normally work only with the kernel version they are built for,
    a new directory is created for every kernel update you install.'
  - '[PAGE 50]


    Modules are stored in several subdirectories with a filename extension of .ko
    for kernel object. When loading a module with modprobe, you can leave out the
    extension and use just the module name.'
  - '[PAGE 51]


    # Objective 3 Describe how Device Drivers Are Loaded


    Because it would be very inconvenient to load all kernel modules manually after
    every system start, there are several methods to perform this task automatically.


    The following is an overview of how device drivers are loaded in SUSE Linux Enterprise
    Server 10:


    +   - **initrd.** Important device drivers that are necessary to access the root
    partition are loaded from initrd. initrd is a special file that is loaded into
    memory by the boot loader. Examples of such modules are the SCSI host controller
    and file system drivers.


    +   - **initscripts.** Some initscripts are dedicated to loading and setting up
    hardware devices, such as the ALSA sound script for sound cards.


    +   - **udev.** udev also loads kernel modules with the hwup command.


    +   - **X Server.** Although the graphics card drivers are not kernel modules,
    X Server loads special drivers to enable hardware 3D support.


    +   - **manually.** You can always load kernel modules on the command line or
    in scripts with the modprobe command or with the hwup or hwdown commands.'
