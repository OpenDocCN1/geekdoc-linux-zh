- pgno: 462
  md: '# C Annotated URLs


    Below is a sampling of URLs that are helpful for those building or using a Beowulf.
    This is not an exhaustive list, and we encourage the reader to browse the Web
    for other sites. A good place to start is the general Beowulf Web sites.


    # C.1 General Beowulf Information


    +   *   **www.beowulf.org:** The original Beowulf Web site.


    +   *   **beowulf-underground.org:** The Beowulf Underground provides “unsanctioned
    and unfettered information on building and using Beowulf systems.” It is a site
    that allows the Beowulf community to post brief articles about software, documentation,
    and announcements related to Beowulf computing. Each article includes links to
    Web sites and downloads for the various items. A seporate commerical and vendor
    area keeps free software well delineated. Moderators work to keep the material
    brief and on topic and to prevent abuses. This is the one stop for all things
    Beowulf.


    # C.2 Node and Network Hardware


    +   *   **www.cs.virginia.edu/stream:** The STREAM Benchmark provides a simple
    measure of the performance of the memory system on a node. This site also includes
    results for a wide variety of platforms, from PC nodes suitable for a Beowulf,
    to workstations, to supercomputers.


    +   *   **www.tomshardware.com:** Aimed at hobbyists building their own computers,
    this is a good site for general background on node hardware and includes up-to-date
    instructions on building your own node.


    # C.3 Performance Tools


    +   *   **www.netlib.org/benchmark/hpl:** Home of the High Performance Linpack
    Benchmark


    # C.4 Parallel Programming and Software


    +   *   **www.mpi-forum.org:** The official MPI Forum Web site, contains Postscript
    and HTML versions of the MPI-1 and MPI-2 Standards.'
  merge: -1
  img_proc: true
- pgno: 463
  md: '+   www.mcs.anl.gov/mpi: A starting point for information about MPI, including
    libraries and tools that use MPI and papers about the implementation or use of
    MPI.


    +   www.mcs.anl.gov/mpich: Home of the MPICH implementation of MPI. Download source,
    documentation, and Unix and Windows versions of MPI from here. Also check the
    bug list page for patches and announcements of releases.


    +   www.mcs.anl.gov/mpi/mptest: Performance tests for MPI, including a guide for
    how not to measure communication performance.


    +   www.netlib.org: A valuable collection of mathematical software and related
    information.


    +   www.csm.ornl.gov/pvm: PVM home page.


    +   www.mcs.anl.gov/romio: Home of the ROMIO implementation of the I/O chapter
    from MPI-2. ROMIO is included in MPICH and LAM but can also be downloaded separately.
    Information on tuning ROMIO for performance can be found here.


    +   hdf.ncsa.uiuc.edu: Home of HDF. Included here are I/O libraries; tools for
    analyzing, visualizing, and converting scientific data; and software downloads,
    documentation, and support information.


    +   www.cs.dartmouth.edu/pario: Home of the Parallel I/O Archive. This includes
    a list of projects in parallel I/O, people working in parallel I/O, and conferences
    on parallel I/O. Its biggest claim to fame is an extensive annotated bibliography
    of parallel I/O resources.


    # C.5 Scheduling and Management


    +   www.openpbs.org: The OpenPBS site is the official Web site for the open source
    version of PBS. Maintained by Veridian, it offers downloads of software, patches,
    and documentation, and it hosts FAQs, discussion lists, searchable archives, and
    general PBS community announcements.


    +   www.pbspro.com: Focused on the Professional Version of PBS, the PBS Pro Web
    site includes software downloads, documentation, evaluation versions, beta releases
    of new software, news, and information for the PBS administrator.'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'www.supercluster.org: The Supercluster Web site contains documentation for
    the Maui scheduler and Sliver metascheduler. It also includes cluster-relevant
    research in areas of simulation, metaccheduling, data staging, allocation management,
    and resource optimization.


    # ## C.6  Other


    +   * www.vrco.com: VRCO provides virtual reality-based software including immersive
    environments for Windows 2000.

    +   * www.seattlelab.com: Seattle Labs provides remote access tools for Windows
    2000 including TelnetD and remote control tools.

    +   * www.citrix.com: Citrix provides an extension to Window 2000 Terminal server
    that allows users from non-Windows platforms to remotely access Windows-based
    systems using the native Windows interface.

    +   * www.cs.cornell.edu/tech2000: This web site describes the Intel funded Technology
    for Education 2000 project at Cornell University.

    +   * www.tc.cornell.edu: This is the home page of the Cornell Theory Center (CTC),
    a high-performance cluster computing and interdisciplinary computational research
    center at Cornell University—home to the largest Windows/Intel/Dell cluster complex
    in the world.

    +   * www.tc.cornell.edu/AC3: The Advanced Cluster Computing Consortium (AC3)
    at CTC—a consortium that includes computing manufacturers, software vendors, academies,
    government agencies, and corporate clients who focus on industry standard IT solutions
    that maximize the performance, reliability, and usability of Intel-based servers
    operating Windows 2000.

    +   * www.ctc-manhattan.com: This is CTC’s cluster computing showcase and computational
    finance solutions center located at 55 Broad St. in Manhattan.'
  merge: -1
  img_proc: true
