    \ the same number of nodes are available during the restart.\n\nIn the special\
    \ case where an application is based on a manager/worker scheme, it is often possible\
    \ to reassign the job sent to the failed worker to another worker or to spawn\
    \ a replacement worker to take its place. Manager/worker is a very popular paralled\
    \ programming scheme for Beowulit clusters, so this special case arises often.\
