  md: "fell into three basic areas: remote access interfaces, programming environment,\
    \ and application software.\n\n# ### 18.5.1\tRemote Access Mechanisms\n\nProviding\
    \ remote access to cluster resources is critical. CTC has a complete suite of\
    \ tools for remote access to meet the needs of our users, who come from a wide\
    \ variety of platforms (e.g., Unix, Windows, Macintosh). The most popular mechanism\
