    # **Winsock Implementation.**


    Winsock’s implementation is shown in Figure 6.6. Its application interface consists
    of an API DLL, **ws2_32.dll** (`\Winnt\System32\Ws2.32.dll`), which provides applications
    access to Winsock functions. **ws2_32.dll** calls on the services of namespace
    and transport service providers to carry out name and message operations. The
    **Msafd.dll** library acts as a transport service provider for the protocols Microsoft
    provides support for in Winsock, and **Msafd.dll** uses *Winsock Helper* libraries
    that are protocol specific to communicate with kernel-mode protocol drivers. For
    example, **wshtcpip.dll** is the TCP/IP helper, and **wshnetbs.dll** is the NetBEUII
    helper. **Mssock.dll** (`\Winnt\System32\Mssock.dll`) implements the Microsoft
    Winsock extension functions, such as *TransmitFile*, *AcceptEx*, and *WSARecvEx*.
    Windows 2000 ships with helper DLLs for TCP/IP, NetBEUI, AppleTalk, IPX/SPX, ATM,
    and IrDA (Infared Data Association) and namespace service providers for DNS (TCP/IP),
    Active Directory, and IPX/SPX.


