  md: "Condor provides *meta-operators* that allow you to explicitly compare with\
    \ the UNDEFINED value by testing both the type and value of the operands. If both\
    \ the types and values match, the two operands are considered *identical*; `=?=`\
    \ is used for meta-equals (or, is-identical-to) and `!=!` is used for meta-not-equals\
    \ (or, is-not-identical-to). These operators always return TRUE or FALSE and therefore\
    \ enable Condor administrators to specify explicit policies given incomplete information.\n\
    \nA complete description of ClassAd semantics and syntax is documented in the\
    \ Condor manual.\n\n**Matching ClassAds.** ClassAds can be matched with one another.\
    \ This is the fundamental mechanism by which Condor matches jobs with machines.\
    \ Figure 14.1 displays a ClassAd from Condor representing a machine and another\
    \ representing a queued job. Each ClassAd contains a `MyType` attribute, describing\
    \ what type of resource the ad represents, and a `TargetType` attribute. The `TargetType`\
    \ specifies the type of resource desired in a match. Job ads want to be matched\
    \ with machine ads and vice versa.\n\nEach ClassAd engaged in matchmaking specifies\
    \ a **Requirements** and a **Rank** attribute. In order for two ClassAds to match,\
    \ the **Requirements** expression in both ads must evaluate to TRUE. An important\
    \ component of matchmaking is the **Requirements** and **Rank** expression can\
    \ refer not only to attributes in their own ad but also to attributes in the candidate\
    \ matching ad. For instance, the **Requirements** expression for the job ad specified\
    \ in Figure 14.1 refers to `Arch`, `OpSys`, and `Disk`, which are all attributes\
    \ found in the machine ad.\n\nWhat happens if Condor finds more than one machine\
    \ ClassAd that satisfies the constraints specified by **Requirements**? That is\
    \ where the **Rank** expression comes into play. The **Rank** expression specifies\
    \ the desirability of the match (where higher numbers mean better matches). For\
    \ example, the job ad in Figure 14.1 specifies\n\n```\n```\nRequirements = ((Arch==\"\
    INTEL\" && OpSys==\"WINNTS\") && Disk > DiskUsage\n    Rank   = (Memory > 10000)\
    \ * KFlp5\n```\n```"
