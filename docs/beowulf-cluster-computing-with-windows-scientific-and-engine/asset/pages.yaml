  md: 'The first step is to describe the region of memory into which data may be placed
    by an `MPI_Put` operation (also accessed by `MPI_Get` or updated by `MPI_Accumulate`).
    This is done with the routine `MPI_Win_create`:


    ```

    MPI_Win win;  double local[ MAX_NX ][ NY+2 ];

    ```


    ```

    MPI_Win_create( local, (NY+2)*(i_end-i_start+3)*sizeof(double),

    s                sizeof(double), MPI_INFO_NULL, MPI_COMM_WORLD, &win );

    ```


    The input arguments are, in order, the array `local`, the size of the array in
    bytes, the size of a basic unit of the array (`sizeof(double)` in this case),
    a “hint” object, and the communicator that specifies which processes may use RMA
    to access the array. `MPI_Win_create` is a collective call over the communicator.
    The output is an `MPI window` object `win`. When a window object is no longer
    needed, it should be freed with `MPI_Win_free`.


    RMA operations take place between two sentinels. One begins a period where access
    is allowed to a window object, and one ends that period. These periods are called
    `epochs`.² The easiest routine to use to begin and end epochs is `MPI_Win_fence`.
    This routine is collective over the processes that created the window object and
    both ends the previous epoch and starts a new one. The routine is called a “fence”
    because all RMA operations before the fence complete before the fence returns,
    and any RMA operation initiated by another process (in the epoch begun by the
    matching fence on that process) does not start until the fence returns. This may
    seem complex, but it is easy to use. In practice, `MPI_Win_fence` is needed only
    to separate RMA operations into groups. This model closely follows the BSP and
    Cray SHMEM models, though with the added ability to work with any subset of processes.


    Three routines are available for initiating the transfer of data in RMA. These
    are `MPI_Put`, `MPI_Get`, and `MPI_Accumulate`. All are nonblocking in the same
    sense MPI point-to-point communication is nonblocking (Section 10.3.1). They complete
    at the end of the epoch that they start in, for example, at the closing `MPI_Win_fence`.
    Because these routines specify both the source and destination of data, they have
    more arguments than do the point-to-point communication routines. The arguments
    can be easily understood by taking them a few at a time.


    > ²MPI has two kinds of epochs for RMA: an *access epoch* and an *exposure epoch*.
    For the example used here, the epochs occur together, and we refer to both of
    them as just epochs.'
