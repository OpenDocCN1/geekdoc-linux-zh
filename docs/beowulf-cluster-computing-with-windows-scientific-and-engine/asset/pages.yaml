- pgno: 410
  md: '# 16.5.4 PBS Accounting Logs


    The PBS Server daemon maintains an accounting log. The log name defaults to `/usr/spool/PBS/server_mq/
    accounting/yyyyymmdd` where yyyyymmdd is the date. The accounting log files may
    be placed elsewhere by specifying the `-A` option on the `pbs_server` command
    line. The option argument is the full (absolute) path name of the file to be used.
    If a null string is given, for example


    ```

    `# pbs_server -A ""`

    ```


    then the accounting log will not be opened, and no accounting records will be
    recorded.


    The accounting file is changed according to the same rules as the log files. If
    the default file is used, named for the date, the file will be closed and a new
    one opened every day on the first event (write to the file) after midnight. With
    either the default file or a file named with the `-A` option, the Server will
    close the accounting log and reopen it upon the receipt of a SIGHUP signal. This
    strategy allows you to rename the old log and start recording anew on an empty
    file. For example, if the current date is December 1, the Server will be writing
    in the file ''20011201''. The following actions will cause the current accounting
    file to be renamed ''dec1'' and the Server to close the file and starting writing
    a new ''20011201''.


    ```

    ```

    # mv 20011201 dec1

    # kill -HUP (pbs_server’s PID)

    ```

    ```


    # 16.6 Troubleshooting


    The following is a list of common problems and recommended solutions. Additional
    information is always available on the PBS Web sites.


    # 16.6.1 Clients Unable to Contact Server


    If a client command (such as `qstat` or `qmgr`) is unable to connect to a Server
    there are several possible errors to check. If the error return is 15034, No server
    to connect to, check (1) that there is indeed a Server running and (2) that the
    default Server information is set correctly. The client commands will attempt
    to connect to the Server specified on the command line if given or, if not given,
    the Server specified in the default server file, `/usr/spool/PBS/default_server`.


    If the error return is 15007, No permission, check for (2) as above. Also check
    that the executable `pbs_iff` is located in the search path for the client and
    that it is `setuid` root. Additionally, try running `pbs_iff` by typing'
