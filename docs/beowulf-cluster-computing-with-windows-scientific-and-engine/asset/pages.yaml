- pgno: 178
  md: '# # 7 Setting Up Clusters: Installation and Configuration


    *David Lifka*


    The true beauty of a Windows 2000 cluster installation is that, at its heart,
    it is simply a customization of a standard Windows 2000 domain installation. If
    you already have a Windows domain of workstations or servers set up, you have
    at least 80 percent of the knowledge required to set up a Windows cluster. High-performance
    computing is now a very real option for the masses. Indeed, the ease of installing
    and running a Windows 2000 cluster will ultimately be the reason Windows will
    revolutionize the high-performance computing industry—much as the Windows operating
    system did the workstation market.


    In this chapter we discuss important issues to consider when planning a Windows
    cluster installation, and we provide detailed installation instructions that relate
    to these issues. Many of the concepts presented in this chapter are discussed
    in far greater detail elsewhere in this book; our objective here is to provide
    you with a complete picture for planning your Windows cluster installation.


    # ## 7.1 Resource Considerations


    When planning a Windows 2000 cluster installation, you must consider several key
    components. These include the Windows domain configuration, file server setup,
    use of login nodes, compute node configuration, and interconnect.


    # ### 7.1.1 Domain Controllers


    The first step in any Windows cluster installation is considering the domain structure
    in which the cluster will reside. For example, do you want a separate domain for
    the cluster, a separate subdomain, or a trusted domain, or do you want the cluster
    completely integrated with your current domain (which may include a mix of workstations,
    laptops, and servers)? Certainly the most popular choice is to integrate the cluster
    resources into an existing domain, thereby providing easy accessibility for domain
    users. In general, the integrated approach works well, but it does raise some
    management considerations. You must, for example, consider who will have access
    to the domain and where they will be accessing it from. If you allow outside users
    without domain accounts to access the cluster from a network, you may want to
    have the cluster domain separate from your production desktop environment to shield
    it from potential security problems.'
  merge: -1
  img_proc: true
