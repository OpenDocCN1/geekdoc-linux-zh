  md: '# ## 14 Condor: A Distributed Job Scheduler


    Todd Tannenbaum, Derek Wright, Karen Miller, and Miron Livny


    **Condor** is a sophisticated and unique distributed job scheduler developed by
    the Condor research project at the University of Wisconsin-Madison Department
    of Computer Sciences.


    A public-domain version of the Condor software and complete documentation is freely
    available from the Condor project’s Web site at www.cs.wisc.edu/condor. Organizations
    may purchase a commercial version of Condor with an accompanying support contract;
    for additional information see www.condorcomputing.com.


    This chapter introduces all aspects of Condor, from its ability to satisfy the
    needs and desires of both submitters and resource owners, to the management of
    Condor on clusters. Following an overview of Condor and Condor’s ClassAd mechanism
    is a description of Condor from the user’s perspective. The architecture of the
    software is presented along with overviews of installation and management. The
    chapter ends with configuration scenarios specific to clusters.


    # ### 14.1 Introduction to Condor


    Condor is a specialized workload management system for compute-intensive jobs.
    Like other full-featured batch systems, Condor provides a job queuing mechanism,
    scheduling policy, priority scheme, resource monitoring, and resource management.
    Users submit their jobs to Condor, and Condor places them into a queue, chooses
    when and where to run them based upon a policy, monitors their progress, and ultimately
    informs the user upon completion.


    While providing functionality similar to that of a more traditional batch queuing
    system, Condor’s novel architecture allows it to succeed in areas where traditional
    scheduling systems fail. Condor can be used to manage a cluster of dedicated Beowul
    nodes. In addition, several unique mechanisms enable Condor to effectively harness
    wasted CPU power from otherwise idle desktop workstations. Condor can be used
    to seamlessly combine all of your organization’s computational power into one
    resource.


    Condor is the product of the Condor Research Project at the University of Wisconsin-Madison
    (UW-Madison) and was first installed as a production system in the UW-Madison
    Department of Computer Sciences nearly ten years ago. This Condor installation
    has since served as a major source of computing cycles to UW-Madison faculty and
    students. Today, just in our department alone, Condor manages more than one thousand
    workstations, including the department’s 500-CPU Beowul cluster. On a typical
    day, Condor delivers more than 650 CPU-days to'
  merge: -1
  img_proc: true
- pgno: 337
  md: "UW researchers. Additional Condor installations have been established over\
    \ the years across our campus and the world. Hundreds of organizations in industry,\
    \ government, and academia have used Condor to establish compute environments\
    \ ranging in size from a handful to hundreds of workstations.\n\n# 14.1.1 Features\
    \ of Condor\n\n Condor's features are extensive. Condor provides great flexibility\
    \ for both the user submitting jobs and for the owner of a machine that provides\
    \ CPU time toward running jobs. The following list summarizes some of Condor's\
    \ capabilities.\n\n+   * **Distributed submission:** There is no single, centralized\
    \ submission machine. Instead, Condor allows jobs to be submitted from many machines,\
    \ and each machine contains its own job queue. Users may submit to a cluster from\
    \ their own desktop machines.\n\n+   * **Job priorities:** Users can assign priorities\
    \ to their submitted jobs in order to control the execution order of the jobs.\
    \ A \"nice-user\" mechanism requests the use of only those machines that would\
    \ have otherwise been idle.\n\n+   * **User priorities:** Administrators may assign\
    \ priorities to users using a flexible mechanism that enables a policy of fair\
    \ share, strict ordering, fractional ordering, or a combination of policies.\n\
    \n+   * **Job dependency:** Some sets of jobs require an ordering because of dependencies\
    \ between jobs. \"Start job X only after jobs Y and Z successfully complete\"\
    \ is an example of a dependency. Enforcing dependencies is easily handled.\n\n\
    +   * **Support for multiple job models:** Condor handles both serial jobs and\
    \ parallel jobs incorporating PVM, dynamic PVM, and MPI.\n\n+   * **ClassAds:**\
    \ The ClassAd mechanism in Condor provides an extremely flexible and expressive\
    \ framework for matching resource requests (jobs) with resource offers (machines).\
    \ Jobs can easily state both job requirements and job preferences. Likewise, machines\
    \ can specify requirements and preferences about the jobs they are willing to\
    \ run. These requirements and preferences can be described in powerful expressions,\
    \ resulting in Condor's adaptation to nearly any desired policy.\n\n+   * **Job\
    \ suspend and resume:** Based on policy rules, Condor can ask the operating system\
    \ to suspend and later resume a job.\n\n+   * **Pools of machines working together:**\
    \ *Flocking* allows jobs to be scheduled across multiple Condor pools. It can\
    \ be done across pools of machines owned by different organizations that impose\
    \ their own policies."
