  md: '# 17.2.4 Scheduler Node


    The Cluster CoNTroller scheduling service must be run from a Windows domain

    controller. The scheduler node maintains the job queue and the node status infor-

    mation. It also allocates and deallocates resources via global domain groups and

    standard builtin Microsoft mechanisms for starting and stopping jobs on cluster

    nodes within the domain.


    # 17.2.5 Security and Management


    Unlike many parallel job scheduling systems, Cluster CoNTroller was designed from

    its conception to work in and leverage security and management features of the

    Windows operating system. For this reason it scales well and doesn''t have any

    legacy system baggage to make things clumsy in a Windows environment.


    For secure file access, Cluster CoNTroller uses NTFS and UNCs. Cluster CoN-

    Troller also uses a specialized Windows service for secure user impersonation.
    This

    so-called impersonator service is installed on each compute node. The scheduler

    node can start this service remotely as the user it wants to impersonate. This

    means that all secure authentication information is maintained on a secure domain

    controller where the scheduler resides.


    For node access control, Cluster CoNTroller uses global domain groups. This

    strategy means that all the management is handled only on the scheduling node.
    To

    grant a user access to nodes, all that is needed is to add that user to the appropriate

    group for each node (and vice versa, for removal). This does not require each
    node

    to be accessed over the network.


    # 17.3 Administrative Features


    Cluster CoNTroller has several nicle administrative features. The Install Shield

    installer, for example, makes setting up the cluster easy, even for a novice.
    The key

    is simply understanding the various node types and which resources will be used
    for

    the nodes. Cluster CoNTroller also provides tools that allow system administrators

    to list and manage all processes on any cluster node and from the Web, to mark

    nodes up and down, and to reboot them from a single console.


    Once the strongest features of Cluster CoNTroller is the ease with which admin-

    istrators can customize its behavior for different environments. At its heart
    Cluster

    CoNTroller has a deterministic heterogeneous scheduling algorithm that balances

    utilization with reasonable wait times. MPI Software Technology also offers sup-

    port for users to build their own scheduler components, using any programming'
