- pgno: 379
  md: "ponent factors, as well as anecdotal usage information, are available in the\
    \ Maui Administrators Manual.\n\nComplementing the issue of job prioritization\
    \ is that of node allocation. When the scheduler selects a job to run, it must\
    \ also determine which resources to allocate to the job. Depending on the use\
    \ of the cluster, you can specify different policies by using NODEALLOCATIONPOLICY.\
    \ Legal parameter values include the following:\n\n+   * **MINRESOURCE:** This\
    \ algorithm selects the nodes with the minimum configured resources which still\
    \ meet the requirements of the job. The algorithm leaves more richly endowed nodes\
    \ available for other jobs that may specifically request these additional resources.\n\
    +   \n+   * **LASTAVAILABLE:** This algorithm is particularly useful when making\
    \ reservations for backfill. It determines the earliest time a job can run and\
    \ then selects the resources available at a time such that, whenever possible,\
    \ currently idle resources are left unreserved and are thus available for backfilling.\n\
    +   \n+   * **NODEPRIORITY:** This policy allows a site to create its own node\
    \ allocation prioritization scheme, taking into account issues such as installed\
    \ software or other local node configurations.\n+   \n+   * **CPULOAD:** This\
    \ policy attempts to allocate the most lightly loaded nodes first.\n\n# ### 15.3.2\
    \ Fairness: Throttling Policies and Fairshare\n\nThe next issue most often confronting\
    \ sites is *fairness*. Fairness seems like a simple concept but can be terribly\
    \ difficult to map onto a cluster. Should all users get to run the same number\
    \ of jobs or use the same number of nodes? Do these usage constraints cover the\
    \ present time only or a specified time frame? If historical information is used,\
    \ what is the metric of consumption? What is the time frame? Does fair consumption\
    \ necessarily mean equal consumption? How should resources be allocated if user\
    \ X bought two-thirds of the nodes and user Y purchased the other third? Is fairness\
    \ based on a static metric, or is it conditional on current resource demand?\n\
    \nWhile Maui is not able to address all these issues, it does provide some flexible\
    \ tools that help with 90 percent of the battle. Specifically, these tools are\
    \ *throttling policies* and *fairshare* used to control immediate and historical\
    \ usage, respectively.\n\n**Throttling Policies.** The term “throttling policies”\
    \ is collectively applied to a set of policies that constrain instantaneous resource\
    \ consumption. Maui supports limits on the number of processors, nodes, proc-seconds,\
    \ jobs, and processors or equivalents allowed at any given time. Limits may be\
    \ applied on a per user, group, account, QoS, or queue basis via the *CFG set\
    \ of parameters. For example,"
  merge: -1
  img_proc: true
- pgno: 380
  md: 'specifying USERCFG{bob} MAXJOB=3 MAXPROC=32 will constrain user **bob** to
    running no more than 3 jobs and 32 total processors at any given time. Specifying
    GROUPCFG{DEFAULT} MAXNODE=64 will limit each group to using no more than 64 nodes
    simultaneously unless overriding limits for a particular group are specified.
    ACCOUNTCFG, QOSCFG, and CLASSCFG round out the *CFG family of parameters providing
    a means to throttle instantaneous use on accounts, QoSs, and classes, respectively.


    With each of the parameters, hard and soft limits can be used to apply a form
    of demand-sensitive limits. While hard limits cannot be violated under any conditions,
    soft limits may be violated if no other jobs can run. For example, specifying
    USERCFG[DEFAULT] MAXNODE=16,24 will allow each user to cumulatively allocate up
    to 16 nodes while jobs from other users can use available resources. If no other
    jobs can use these resources, a user may run on up to 24 nodes simultaneously.


    Throttling policies are effective in preventing cluster “hogging” by an individual
    user or group. They also provide a simple mechanism of fairness and cycle distribution.
    Such policies may lead to lower overall system utilization, however. For instance,
    resources might go unused if these policies prevent all queued jobs from running.
    When possible, throttling policies should be set to the highest feasible level,
    and the cycle distribution should be managed by tools such as fairshare, allocation
    management systems, and QoS-based prioritization.


    # Fairshare.


    A typical fairshare algorithm attempts to deliver a fair resource distribution
    over a given time frame. As noted earlier, however, this general statement leaves
    much to interpretation. In particular, how is the distribution to be measured,
    and what time frame should be used?


    Maui provides the parameter FSPOLICY to allow each site to determine how resource
    distribution is to be measured, and the parameters FSINTERVAL, FSDEPTH, and FSDECAY
    to determine how historical usage information is to be weighted.


    To control resource distribution, Maui uses fairshare targets that can be applied
    to users, groups, accounts, queues, and QoS mechanisms with both default and specific
    targets available. Each target may be one of four different types: target, floor,
    ceiling, or cap. In most cases, Maui adjusts job priorities to meet fairshare
    targets. With the standard target, Maui attempts to adjust priorities at all times
    in an attempt to meet the target. In the case of floors, Maui will increase job
    priority only to maintain at least the targeted usage. With ceilings, the converse
    occurs. Finally, with fairshare caps, job eligibility rather than job priority
    is adjusted to prevent jobs from running if the cap is exceeded during the specified
    fairshare interval.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'The example below shows a possible fairshare configuration.


    ```

    ```ini

    # m.au.cfg

    FSPOLICY    DEDICATEDPS

    FSDepth     7

    FSINTERVAL  24:00:00

    FSDECAY     0.80


    USERCFG[DEFAULT]  FSTARGET=10.0

    USERCFG[john]     FSTARGET=25.0+

    GROUPCFG[staff]   FSTARGET=20.0-

    ```

    ```


    In this case, fairshare usage will track delivered system *processor seconds*
    over a seven-day period with a 0.8 decay factor. All users will have a fairshare
    *target* of 10 percent of these processor seconds—with the exception of **john**,
    who will have a *floor* of 25 percent. Also, the group **staff** will have a fairshare
    *ceiling* of 20 percent. At any time, you can examine the fairshare status of
    the system by using the `diagnose -f` command.


    # 15.3.3  Managing Resource Access: Reservations, Allocation Managers, and Quality
    of Service


    In managing any cluster system, half of the administrative effort involves configuring
    it to handle the *steady-state* situation. The other half occurs when a very important
    user has a special one-time request. Maui provides two features, advance reservations
    and QoS, to handle many types of such special requests.


    **Advance Reservations.**  Reservations allow a site to set aside a block of resources
    for various purposes such as cluster maintenance, special user projects, or benchmarking
    nodes. In order to create a reservation, a start and end time must be determined,
    as well as the resources to be reserved and a list of those who can access these
    resources. Reservations can be created dynamically by scheduler administrators
    using the `stres` command or managed directly by Maui via config file parameters.


    For example, to reserve **nodeA** and **nodeB** for a four-hour maintenance at
    2:30 P.M., you could issue the following command:


    ```

    ```bash

    > sttres -s 14:30 -d 4:00:00 ''node[AB]''

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'A reservation request can specify allocation of particular resources or a given
    quantity of resources. The following reservation will allocate 20 processors to
    users **john** and **sam** starting on April 14 at 5:00 P.M.


    ```

    > setres -u john:sam -s 17:00_04/14 TASKS==20

    ```


    With no duration or end time specified, this reservation will default to an infinite
    length and will remain in place until removed by a scheduler administrator using
    the **releasers** command.


    Access to reservations is controlled by an access control list (ACL). Reservation
    access is based on job credentials, such as user or group, and job attributes,
    such as wall time requested. Reservation ACLs can include multiple access types
    and individuals. For example, a reservation might reserve resources for users
    A and B, jobs in class C, and jobs that request less than 30 minutes of wall time.
    Reservations may also overlap each other if desired, in which case access is granted
    only if the job meets the access policies of all active reservations.


    At many sites, reservations are used on a permanent or periodic basis. In such
    cases, it is best to use *standing* reservations. Standing reservations allow
    a site to apply reservations as an ongoing part of cluster policies. The parameter
    **SRPERIOD** can be set to DAY, WEEK, or INFINITE to indicate the periodicity
    of the reservation, with additional parameters available to determine what time
    of the day or week the reservation should be enabled. For example, the following
    configuration will create a reservation named **development** that, during primetime
    hours, will set aside 16 nodes for exclusive use by jobs requiring less than 30
    minutes.


    SRPERIOD [development] DAY

    SRDAYS [development] Mon Tue Wed Thu Fri

    SRSTARTTIME [development] 8:00:00

    SRENDTIME [development] 17:00:00

    SRMAXTIME [development] 00:30:00

    SRTASKCOUNT [development] 16


    At times, a site may want to allow access to a set of resources only if there
    are no other resources available. Maui enables this conditional usage through
    *reservation affinity*. When specifying any reservation access list, each access
    value can be associated with positive, negative, or neutral affinity by using
    the ‘+’, ‘-’, or ‘=’ characters. If nothing is specified, positive affinity is
    assumed. For example, consider the following reservation line:


    ```

    SRUSERLIST[special] bob john steve= bill-

    ```'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'With this specification, bob and john''s jobs receive the default positive
    affinity and are essentially attracted to the reservation. For these jobs, Maui
    will attempt to use resources in the special reservation first, before considering
    any other resources. Jobs belonging to steve, on the other hand, can use these
    resources but are not attracted to them. Finally, bill''s jobs will use resources
    in the special reservation only if no other resources are available. You can get
    detailed information about reservations by using the showres and diagnose -r commands.


    Allocation Managers. Allocation management systems allow a site to control total
    resource access in real time. While interfaces to support other systems exist,
    the allocation management system most commonly used with the Maui scheduler is
    QBank (http://www.emsl.pnl.gov:80/mscf/docs/qbank-2.9), provided by Pacific Northwest
    National Laboratory. This system and others like it allow sites to provide distinct
    resource allocations much like the creation of a bank account. As jobs run, the
    resources used are translated into a charge and debited from the appropriate account.
    In the case of QBank, expiration dates may be associated with allocations, private
    and shared accounts maintained, per machine allocations created, and so forth.


    Within Maui, the allocation manager interface is controlled through a set of BANK*
    parameters such as in the example below:


    | BANKTYPE QBANK |

    | BANKHOST bank.univ.edu |

    | BANKCHARGECPOLICY DEBITSUCCESSFULWC |

    | BANKDEFERJOBONFAILURE TRUE |

    | BANKFALLBACKACCOUNT freecycle |




    This configuration enables a connection to an allocation manager located on bank.univ.edu
    using the QBank interface. The unit of charge is configured to be deduced processor-seconds
    and users will be charged only if their job completes successfully. If the job
    does not have adequate allocations in the specified account, Maui will attempt
    to redirect the job to use allocations in the freecycle account. In many cases,
    a fallback account is configured so as to be associated with lower priorities
    and/or additional limitations. If the job is not approved by the allocation manager,
    Maui will defer the job for a period of time and try it again later.


    Quality of Service. Maui''s QoS feature allows sites to control access to special
    functions, resources, and service levels. Each QoS consists of an access control
    list controlling which users, groups, accounts, and job queues can access the
    QoS'
  merge: -1
  img_proc: true
- pgno: 384
  md: "privileges. Associated with each QoS are special service-related priority weights\
    \ and service targets. Additionally, each QoS can be configured to span resource\
    \ partitions, preempt other jobs, and the like.\n\nMau also enables a site to\
    \ charge a premium rate for the use of some QoS services. For example, the following\
    \ configuration will cause user **john**’s jobs to use QoS **hiprio** by default\
    \ and allow members of the group **bio** to access it by request:\n\n```\nUSERCFG[john]\
    \ QLIST=hiprio:normal DEFAULT=hiprio\n  GROUPCFG[bio] QLIST=hiprio:medprio development\
    \ QDEF=medprio\n  QOSCFG[hiprio] PRIORITY=50 TARGET=30 FLAGS=PREEMPTOR:IGNMAXJOB\
    \ \\\n    MAXPROC=150\n```\n\nJobs using QoS **hiprio** receive the following\
    \ privileges and constraints:\n\n+   - A priority boost of 50 * QOSWEIGHT * DIRECTWEIGHT\n\
    +   - A queue-time target of 30 minutes\n+   - The ability to preempt lower priority\
    \ PREEMPTIE jobs\n+   - The ability to ignore MAXJOB policy limits defined elsewhere\n\
    +   - A cumulative limit of 150 processors allocated to QoS hiprio jobs\n\nA site\
    \ may have dozens of QoS objects described and may allow users access to any number\
    \ of these. Depending on the type of service desired, users may then choose the\
    \ QoS that best meets their needs.\n\n# 15.3.4 Optimizing Usage: Backfill, Node\
    \ Sets, and Preemption\n\nThe Mau scheduler provides several features to optimize\
    \ performance in terms of system utilization, job throughput, and average job\
    \ turnaround time.\n\n**Backfill.** Backfill is a new common method used to improve\
    \ both system utilization and average job turnaround time by running jobs out\
    \ of order. Backfill, simply put, enables the scheduler to run any job so long\
    \ as it does not delay the start of jobs of higher priority. Generally, the algorithm\
    \ prevents delay of high-priority jobs through some form of reservation. Backfill\
    \ can be thought of as a process of filling in the resource *holes left* by the\
    \ high priority jobs. Since holes are being filled, it makes sense that the jobs\
    \ most commonly backfilled are the ones requiring the least time *and/or* resources.\
    \ With backfill enabled, sites typically report system utilization improvements\
    \ of 10 to 25% and a slightly lower average job queue time.\n\nBy default, backfill\
    \ scheduling is enabled in Mau under control of the parameter BACKFILLPOLICY.\
    \ While the default configuration generally is adequate, sites may want to adjust\
    \ the job selection policy, the reservation policy, the depth of"
