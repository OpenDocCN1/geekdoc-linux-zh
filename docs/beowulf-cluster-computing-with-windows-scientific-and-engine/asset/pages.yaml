- pgno: 60
  md: '# ## 3 Node Hardware


    *Thomas Sterling*


    Beowulf is a network of nodes, with each node a low-cost personal computer. Its
    power and simplicity is derived from exploiting the capabilities of the mass-market
    systems that provide both the processing and the communication. This chapter explores
    all of the hardware elements related to computation and storage. Com-munication
    hardware options will be considered in detail in Chapter 5.


    Few technologies in human civilization have experienced such a rate of growth
    as that of the digital computer and its culmination in the PC. Its low cost, ubiquity,
    and sometimes trivial application often obscure its complexity and precision as
    one of the most sophisticated products derived from science and engineering. In
    a single human lifetime over the fifty-year history of computer development, performance
    and memory capacity have grown by a factor of almost a million. Where once com-puters
    were reserved for the special environments of carefully structured machine rooms,
    now they are found in almost every office and home. A personal computer today
    outperforms the world’s greatest supercomputers of two decades ago at less than
    one ten-thousandth the cost. It is the product of this extraordinary legacy that
    Beowulf harnesses to open new vistas in computation.


    Hardware technology changes almost unbelievably rapidly. The specific proces-sors,
    chip sets, and three-letter acronyms (TLAs) we define today will be obsolete in
    a very few years. The prices quoted will be out of date before this book reaches
    bookstore shelves. On the other hand, the organizational design of a PC and the
    functions of its primary components will last a good deal longer. The rela-tive
    strengths and weaknesses of components (e.g., disk storage is slower, larger,
    cheaper and more persistent than main memory) should remain valid for nearly as
    long. Fortunately, it is now easy to find up-to-date prices on the Web; see Appendix
    C for some places to start.


    This chapter concentrates on the practical issues related to the selection and
    assembly of the components of a Beowulf node. You can assemble the nodes of the
    Beowulf yourself, let someone else (a system integrator) do it to your specification,
    or purchase a turnkey system. In either case, you’ll have to make some decisions
    about the components. Many system integrators cater to a know-nothing market,
    offering a few basic types of systems, for example, “office” and “home” models
    with a slightly different mix of hardware and software components. Although these
    machines would work in a Beowulf, with only a little additional research you can
    purchase far more appropriate systems for less money. Beowulf systems (at least
    those we know of) have little need for audio systems, speakers, joysticks, printers,
    frame grabbers, and the like, many of which are included in the standard “home”
    or “office” models. High-performance video is unnecessary except for specialized'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'applications where video output is the primary function of the system. Purchasing
    just the components you need, in the quantity you need, can be a tremendous advantage.
    Fortunately, customizing your system this way does not mean that you have to assemble
    the system yourself. Many system integrators, both large and small, will assemble
    custom systems for little or no price premium. In fact, every system they assemble
    is from component parts, so a custom system is no more difficult for them than
    a standard one.


    An enormous diversity of choice exists both in type and quantity of components.
    More than one microprocessor family is available, and within each family are multiple
    versions. There is flexibility in both the amount and the type of main memory.
    Disk drives, too, offer a range of interface, speed, capacity, and number. Choices
    concerning ancillary elements such as floppy disk drives and CD-ROM drives have
    to be considered. Moreover, the choice of the motherboard and its chip set can
    provide yet another dimension to PC node implementation. This chapter examines
    each of these issues individually and considers their interrelationships. A step-by-step
    procedure for the assembly of a processor node is provided to guide the initiate
    and protect the overconfident.


    We reiterate that we make no attempt to offer a complete or exhaustive survey.
    Far more products are available than can be explicitly presented in any single
    book, and new products are being offered all the time. In spite of the impossibility
    of exhaustive coverage, however, the information provided here should contain
    most of what is required to implement a Beowulf node. Final details can be acquired
    from documentation provided by the parts vendors.


    # ## 3.1  Overview of a Beowulf Node


    The Beowulf node is responsible for all activities and capabilities associated
    with executing an application program and supporting a sophisticated software
    environment. These fall into four general categories:


    +   1. instruction execution,

    +   2. high-speed temporary information storage,

    +   3. high-capacity persistent information storage, and

    +   4. communication with the external environment, including other nodes.


    The node is responsible for performing a set of designated instructions specified
    by the application program code or system software. The lowest-level binary encoding
    of the instructions and the actions they perform are dictated by the microprocessor'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'instruction set architecture (ISA). Both the instructions and the data upon
    which they act are stored in and loaded from the node’s random access memory (RAM).
    The speed of a processor is often measured in megahertz, indicating that its clock
    ticks so many million times per second. Unfortunately, data cannot be loaded into
    or stored in memory at anywhere near the rate necessary to feed a modern microprocessor
    (1 GHz and higher rates are now common). Thus, the processor often waits for memory,
    and the overall rate at which programs run is usually governed as much by the
    memory system as by the processor’s clock speed.


    Microprocessor designers employ numerous ingenious techniques to deal with the
    problem of slow memories and fast processors. Usually, a memory hierarchy is incorporated
    that includes one or more layers of very fast but very small and very expensive
    cache memories, which hold copies of the contents of the slower but much larger
    main memory. The order of instruction execution and the access patterns to memory
    can profoundly affect the performance impact of the small high-speed caches. In
    addition to holding the application dataset, memory must support the operating
    system and provide sufficient space to keep the most frequently used functions
    and system management tables and buffers co resident for best performance.


    Except for very carefully designed applications, a program’s entire dataset must
    reside in RAM. The alternative is to use disk storage either explicitly (out-of-core
    calculations) or implicitly (virtual memory swapping), but this usually entails
    a severe performance penalty. Thus, the size of a node’s memory is an important
    parameter in system design. It determines the size of problem that can practically
    be run on the node. Engineering and scientific applications often obey a rule
    of thumb that says that for every floating-point operation per second, one byte
    of RAM is necessary. This is a gross approximation at best, and actual requirements
    can vary by many orders of magnitude, but it provides some guidance; for example,
    a 1 GHz processor capable of sustaining 200 Mflops should be equipped with approximately
    200 MBytes of RAM.


    Information stored in RAM is not permanent. When a program finishes execution,
    the RAM that was assigned to it is recovered by the operating system and reassigned
    to other programs. The data is not preserved. Thus, if one wishes to permanently
    store the results of a calculation, or even the program itself, a persistent storage
    device is needed. Hard disk devices that store data on a rotating magnetic medium
    are the most common storage device in Beowulf nodes. Data stored on hard disk
    is persistent even under power failures, a feature that makes the hard disk the
    preferred location for the operating system and other utilities that are required
    to restart a machine from scratch. A widely held guideline is that the'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'local disk capacity be at least ten times the main memory capacity to provide
    an adequate area for virtual-memory swap space; more room is required for software
    and user-generated data. With the low cost of hard disk, a single leaf can provide
    this capacity at a small fraction of the overall system cost. An alternative is
    to provide permanent storage capability off-node, providing access via the system
    area network to remote storage resources (e.g., an NFS server on one of the nodes).
    This may be a practical solution for small Beowulf systems, but as the system
    grows, a single server can easily be overwhelmed.


    The results of computational activities performed on a Beowulf node must be presented
    to the node’s external environment during and after a computation. This requires
    communication with peripheral devices such as video monitors, printers, and external
    networks. Furthermore, users need access to the system to start jobs and to monitor
    and control jobs in progress. System managers may need console access, the ability
    to install software distributions on CD-ROMs or other media, or backup data to
    tape or other archival storage. The requirements are served by the I/O subsystem
    of the node. On today’s PCs, these devices usually share the PCI bus, with some
    low-performance devices using the older ISA bus. In fact, some systems no longer
    have an ISA bus.


    In a Beowulf system typically only one or two nodes have extensive I/O capabilities
    beyond communication on the system area network. All external interaction is then
    funneled through these *worldly* nodes. The specific I/O requirements vary greatly
    from installation to installation, so a precise specification of the peripherals
    attached to a worldly node is impossible. We can, however, make firm recommendations
    about the I/O requirements of internal or *compute* nodes. The majority of nodes
    in a Beowulf system lack the personality of a worldly node. They have one major
    I/O requirement, which is to communicate with one another. The hardware and software
    involved in interprocessor communication are discussed in Chapters 5 and 6, respectively.
    For now, we will simply observe that the processor communicates with the network
    through the network interface controller attached to a high-speed bus.


    # 3.1.1 Principal Specifications


    In selecting the proper node configuration for a new Beowulf, the choices can
    appear overwhelming. Fortunately, only a small number of critical parameters largely
    characterize a particular Beowulf node. These parameters usually relate to a few
    peak capabilities or capacities and are only roughly predictive of the performance
    of any given application or workload. Nonetheless, they are widely used and provide
    a reasonable calibration of the price/performance tradeoff space.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '**Processor clock rate** — the frequency (MHz or GHz) of the primary signal
    within the processor that determines the rate at which instructions are issued


    **Peak floating-point performance** — the combination of the clock rate and the
    number of floating-point operations that can be issued and/or retired per instruction
    (Mfl ops)


    **Cache size** — the storage capacity (KBytes) of the high-speed buffer memory
    between the main memory and the processor


    **Main memory capacity** — the storage capacity (MBytes) of the primary system
    node memory in which resides the global dataset of the applications as well as
    myriad other supporting program, buffering, and argument data


    **Disk capacity** — the storage capacity (GBytes) of the permanent secondary storage
    internal to the processing node


    **SAN network port peak bandwidth** — the bandwidth (Mbps) of the network control
    card and system area network communication channel medium


    Other parameters that are sometimes of interest are the number of processors included
    in symmetric multiproccessing configurations, memory latency and bandwidth, measured
    performance of various benchmarks, and seek and access times to disks.


    # 3.1.2 Basic Elements


    The general Beowulf node is a complex organization of multiple subsystems that
    support the requirements for computation, communication, and storage discussed
    above. Figure 3.1 shows a block diagram of a node architecture representative
    of the general structures found in today''s PCs adapted to the purpose of Beowulf-class
    computing.


    **Microprocessor** — all of the logic required to perform instruction execution,
    memory management and address translation, integer and floating-point operations,
    and cache management. Processor clock speeds can be as low as 100 MHz found on
    previous-generation Intel Pentium processors to as high as 1.7 GHz on the Intel
    Pentium 4 with an 800 MHz Pentium 3 representing near the sweet spot in price/performance.


    **Cache** — a small but fast buffer for keeping recently used data. Cache provides
    the illusion of a much higher-speed memory than is actually available. Multiple'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_65_0.png)


    # Figure 3.1


    Block diagram of a typical Beowulf node. Some additional components, e.g., keyboard,
    mouse, additional network interfaces, graphics adaptors, CD-ROM drive, will be
    necessary on nodes responsible for I/O services.


    layers of cache may be employed; 16 KBytes of Level 1 (L1) and 256 KBytes of Level
    2 (L2) cache are common. The effect of cache can be dramatic, but not all programs
    will benefit. Memory systems are so complex that often the only reliable way to
    determine the effectiveness of cache for a given application is to test the application
    on machines with different amounts of cache.


    **Main memory** — high-density storage with rapid read/write access. Typical access
    times of 70 nanoseconds can be found with DIMM memory modules with memory capacities
    between 64MBytes and 512MBytes. This memory is often optimized for throughput,
    delivering successive data items every 10 nanoseconds or'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'less after an initial setup step.


    **EIDE/SCSI disk controller** — a sophisticated unit that manages the operation
    of the hard disk and CD-ROM drives, buffers data blocks, and controls the transfer
    of data directly to or from main memory.


    **Hard drive** — persistent storage, even after processor power cycling, and backing
    store to the main memory for problems requiring datasets larger than the main
    memory can hold. Disk capacities range from 1 GByte to over 100, but the most
    common and cost effective sizes today are between 20 and 80 GBytes. Hard disks
    conform to either the EIDE or SCSI interface standards. Access times of a few
    milliseconds are usual for these electromechanical rotating magnetic storage devices.


    **Floppy disk controller** — a very low cost and low capacity storage medium of
    nominally 1.4 MBytes capacity (double sizes are available). Floppies are used
    primarily at boot time to install a minimal system capable of bootstrapping itself
    into a full configuration. Access times are long, and the small capacity makes
    them unsuitable for other data storage roles. Nevertheless, their historical role
    as a boot medium makes them a valuable part of every Beowulf node.


    **Motherboard chip set** — a sophisticated special-purpose controller that manages
    and coordinates the interactions of the various components of the PC through PCI,
    USB, and other interfaces. It plays an important role in memory management, especially
    for symmetric multiprocessors where cache coherence is maintained through snooping
    cache protocols.


    **BIOS ROM memory** — the minimum set of functional binary routines needed to
    perform rudimentary functionality of the motherboard and its interfaces, including
    bootstrap and diagnostic functions. Modern systems include writable BIOS EEPROMs
    (electronically erasable, programmable ROMs) that can have their contents directly
    upgraded from newer versions of the BIOS programs with replacement on the actual
    chips.


    **PCI bus** — the universal industry standard for high-speed controllers. The
    common PCI bus operates a 32-bit data path at 33 MHz; PCI buses with 64-bit data
    paths at 66 MHz are also available.


    **Video controller** — a card that converts digital signals from the processor
    into analog signals suitable for driving a video display. Modern high-end video
    cards contain powerful on-board processors and often have many megabytes of memory
    and sophisticated programmable interfaces. Such a card might be appropriate for'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'an I/O or interactive node intended to drive a high-resolution monitor for
    data visualization and interactive display. Other Beowulf nodes, however, have
    little need for video output. Indeed, were it were not for the fact that most
    BIOS software will not boot without a video card, such cards would be unnecessary
    on the majority of Beowulf nodes. Video cards are available with either PCI or
    AGP connections.


    **Network interface controller** — an interface that provide communication access
    to the node''s external environment. One or more such interfaces couple the node
    to the Beowulf''s system area network. A second network interface card (not shown)
    on a worldly node can provide the link between the entire Beowulf machine and
    the local area network that connects it to other resources in the user''s environment,
    such as file servers, printers, terminals, and the Internet.


    **Power supply** — not part of the logical system, but an important component
    to the overall operation. It provides regulated output voltages of 5 volts, -5
    volts, 12 volts, and -12 volts to support system operation. Power supplies are
    rated in watts and have a general range of between 200 and 400 watts per node.


    **Cooling systems** — typically a fan mounted on the CPU carrier itself, for dissipating
    heat from the processor. Other fans cool the rest of a node. Because fans are
    mechanical devices, they are among the most likely components to fail in a Beowulf
    cluster.


    # 3.2  Processors


    The microprocessor is the critical computational component of the PC-based node
    and Beowulf-class systems. In the seven-year period since the first Beowulf was
    completed in early 1994, central processing unit (CPU) clock speed has increased
    by a factor of 16. More impressive is the single-node floating-point performance
    sustained on scientific and engineering problems which has improved by two orders
    of magnitude during the same period. A single PC today outperforms the entire
    16-processor first-generation Beowulf of 1994.


    With the proliferation of Linux ports to a wide array of processors, Beowulf-like
    clusters are being assembled with almost every conceivable processor type. Primary
    attention has been given to Intel processors and their binary compatible siblings
    from AMD. The Compaq Alpha family of processors has also been effectively applied
    in this arena. Compaq has recently announced that development of'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'The Alpha family will continue only through 2003, with Compaq contributing
    the Alpha technology to the development of future Intel IA64 processors.


    This section presents a brief description of the most likely candidates of microprocessors
    for future Beowulf-class systems. The choice is constrained by three factors:
    performance, cost, and software compatibility. Raw performance is important to
    building effective medium- and high-end parallel systems. To build an effective
    parallel computer, you should start with the best uniprocessor. Of course, this
    tendency must be tempered by cost. The overall price/performance ratio for your
    favorite application is probably the most important consideration. The highest
    performance processor at any point in time rarely has the best price/performance
    ratio. Usually it is the processor one generation or one-half generation behind
    the cutting edge that is available with the most attractive ratio of price to
    performance. Recently, however, the Compaq Alpha has delivered both best performance
    and best price/performance for many applications. The third factor of software
    compatibility is an important practical consideration. If a stable software environment
    is not available for a particular processor family, even if it is a technical
    pacesetter, it is probably inappropriate for Beowulf. Some key features of current
    processors are summarized in Table 3.1.


    # 3.2.1 Intel Pentium Family


    The Pentium 4 implements the IA32 instruction set but uses an internal architecture
    that diverges substantially from the old P6 architecture. The internal architecture
    is geared for high clock speeds; it produces less computing power per clock cycle
    but is capable of extremely high frequencies.


    The Pentium III is based on the older Pentium Pro architecture. It is a minor
    upgrade from the Pentium II; it includes another optimized instruction set called
    SSE for three-dimensional instructions and has moved the L2 cache onto the chip,
    making it synchronized with the processor''s clock. The Pentium III can be used
    within an SMP node with two processors; a more expensive variant, the Pentium
    III Xeon, can be used in four-processor SMP nodes.


    # 3.2.2 AMD Athlon


    The AMD Athlon platform is similar to the Pentium III in its processor architecture
    but similar to the Compaq Alpha in its bus architecture. It has two large 64 KByte
    L1 caches and a 256 KByte L2 cache that runs at the processor''s clock speed.
    The performance is a little ahead of the Pentium III in general, but either can
    be faster'
  merge: -1
  img_proc: true
