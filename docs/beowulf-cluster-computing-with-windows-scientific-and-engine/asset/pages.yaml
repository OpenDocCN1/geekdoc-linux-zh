    In 1987, the National Science Foundation’s new computing directorate established
    the goal of achieving parallelism of 100X by the year 2000. The goal got two extreme
    responses: Don Knuth and Ken Thompson said that parallel programming was too hard
    and that we shouldn’t focus on it; and others felt the goal should be 1,000,000X!
    Everyone else either ignored the call or went along quietly for the funding. This
    call was accompanied by an offer (by me, I maye) of yearly prizes to reward those
    who achieved extraordinary parallelism, performance, and performance/price. In
    1988, three researchers at Sandia obtained parallelism of 600X on a 1000-node
    system, while indicating that 1000X was possible with more memory. The announcement
    of their achievement galvanized others, and the Gordon Bell prizes continue, with
    gains of 100% nearly every year.


    Interestingly, a factor of 1000 scaling seems to continue to be the limit for
    most scalable applications, but 20–100X is more common. In fact, at least half
    of the Top500 systems have fewer than 100 processors! Of course, the parallelism
    is determined largely by the fact that researchers are budget limited and have
    only smaller machines costing $1,000–$3,000 per node or parallelism of < 100.
    If the nodes are in a center, then the per node cost is multiplied by at least
    10, giving an upper limit of 1000–10,000 nodes per system. If the nodes are vector
    processors, the number of processors is divided by 8–10 and the per node price
    raised by 100X.


    In 1993, Tom Sterling and Don Becker led a small project within NASA to build
    a gigaflops workstation costing under $50,000. The so-called Beowulf project was
    outside the main parallel-processing research community: it was based instead
    on commodity and COTS technology and publicly available software. The Beowulf
    project succeeded: a 16-node, $40,000 cluster built from Intel 486 computers ran
    in 1994. In 1997, Tom Sterling’s 542 cluster won the Gordon Bell Prize for performance/price.
    The recipe for building one’s own Beowulf was presented in a book by Sterling
    et al. in 1999.5 By the year 2000, several thousand-node computers were operating.
    In June 2001, 33 Beowulfs were in the Top500 supercomputer list (www.top500.org).
    Today, in the year 2001, technical high schools can buy and assemble a supercomputer
    from parts available at the corner computer store.


    Beowulfs formed a do-it-yourself cluster computing community using commodity microprocessors,
    local area network Ethernet switches, Linux (and now Windows 2000), and tools
    that have evolved from the user community. This vendor-neutral


    > 5T. Sterling, J. Salmon, D. J. Becker, and D. V. Savarese, How to Build a Beowulf:
    A Guide to the Implementation and Application of PC Clusters, MIT Press, Cambridge,
    MA, 1999.'
