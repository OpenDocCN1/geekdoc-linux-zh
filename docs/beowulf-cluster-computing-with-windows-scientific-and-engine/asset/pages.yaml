    # 13.2.4 Resource Management


    The fourth area, resource management, is essentially responsible for the starting,
    stopping, and cleaning up after jobs that are run on cluster nodes. In a batch
    system resource management involves running a job for a user, under the identity
    of the user, on the resources the user was allocated in such a way that the user
    need not be present at that time.


    Starting jobs typically involves some form of secure impersonation. Microsoft
    Windows 2000, like other operating systems, provides mechanisms for doing this
    securely. Typically this is handled by the use of services or COM+ objects that
    can create a user process token for a given user and use it to run a job as that
    user. Short of a mechanism like this, users typically must supply their username
    and password at run time to authenticate to the system and start processes as
    them. This obviously does not work in a batch situation.


    Once processes are started, the resource management system has to be able to enumerate
    those associated with a given job. Windows 2000 provides the *job object* for
    this purpose. All processes created within a job object can be monitored and'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'stopped by stopping their associated job object. Job objects also provide a
    way for running multiple jobs per node, since all of a given job’s processes are
    managed within a unique job object.


    Many cluster workload management systems provide mechanisms to ensure the successful
    startup and cleanup of jobs and to maintain node status data internally, so that
    jobs are started only on nodes that are available and functioning correctly.


    In addition, limits may need to be placed on the job and enforced by the workload
    management system. These limits are yet another aspect of policy enforcement,
    in addition to the limits on queues and those enacted by the scheduling component.


    Another aspect of resource management is providing the ability to remove or add
    compute resources to the available pool of systems. Clusters are rarely static;
    systems go down, or new nodes are added. The “registration” of new nodes and the
    marking of nodes as unavailable are both additional aspects of resource management.


    # 13.2.5  Accounting


    The fifth aspect of workload management is accounting and reporting. Workload
    accounting is the process of collecting resource usage data for the batch jobs
    that run on the cluster. Such data includes the job owner, resources requested
    by the job, and total amount of resources consumed by the job. Other data about
    the job may also be available, depending on the specific workload management system
    in use.


    Cluster workload accounting data can used for a variety of purposes, such as


    +   1.  producing weekly system usage reports,

    +   2.  preparing monthly per user usage reports,

    +   3.  enforcing per project allocations,

    +   4.  tuning the scheduling policy,

    +   5.  calculating future resource allocations,

    +   6.  anticipating future computer component requirements, and

    +   7.  determining areas of improvement within the computer system.


    The data for these purposes may be collected as part of the resource monitoring
    tasks or may be gathered separately. In either case, data is pulled from the available
    sources in order to meet the objectives of workload accounting. Details of using'
