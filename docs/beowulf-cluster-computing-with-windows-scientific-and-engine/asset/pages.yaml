    # ### 16.5.2 Monitoring PBS


    The node monitoring GUI for PBS is `xpbsmon`. It is used for displaying graphically
    information about execution hosts in a PBS environment. Its view of a PBS environment
    consists of a list of sites where each site runs one or more Servers and each
    Server runs jobs on one or more execution hosts (nodes).


    The system administrator needs to define the site’s information in a global X
    resources file, `PBS_LIB/xpbsmon/xpbsmonrc`, which is read by the GUI if a personal
    `.xpbsmonrc` file is missing. A default “`xpbsmonrc`” file is created during installation
    defining (under `*sitesInfo` resource) a default site name, the list of Servers
    that run on the site, the set of nodes (or execution hosts) where jobs on a particular
    Server run, and the list of queries that are communicated to each node’s `pbs_mom`.
    If node queries have been specified, the host where `xpbsmon` is running must
    have been given explicit permission by the `pbs_mom` daemon to post queries to
    it; this is done by including a `$restricted` entry in the MOM’s config file.


