    However, this can be awkward to implement, particularly for more complex communication\
    \ patterns; in addition, it does not address the extra copy that may be performed\
    \ by MPI_Send.\n\nThe approach used by MPI, following earlier message-passing\
    \ systems as well as nonblocking sockets (see [6, Chapter 9]), is to split the\
    \ send and receive operations into two steps: one to initiate the operation and\
    \ one to complete the operation. Other operations, including other communication\
    \ operations, can be issued between the two steps. For example, an MPI receive\
    \ operation can be initiated by a call to MPI_Irecv and completed with a call\
    \ to MPI_Wait. Because the routines that initiate these operations do not wait\
    \ for them to complete, they are called nonblocking operations. The “I” in the\
    \ routine name stands for “immediate”; this indicates that the routine may return\
    \ immediately without completing the operation. The arguments to MPI_Irecv are\
    \ the same as for MPI_Recv except for the last (status) argument. This is replaced\
    \ by an MPI_Request value; it is a handle that is used to identify an initiated\
    \ operation. To complete a nonblocking operation, the request is given to MPI_Wait,\
    \ along with a status argument; the status argument serves the same purpose as\
    \ status for an MPI_Recv. Similarly, the nonblocking counterpart to MPI_Send is\
    \ MPI_Isend; this has the same arguments as MPI_Send with the addition of an MPI_Request\
    \ as the last argument (in C). Using these routines, our example becomes the following:\n\
    \n```\n```c\nif ( rank == 0 ) {\n    MPI_Request req1, req2;\n    MPI_Isend( sbuf,\
    \ n, MPI_INT, 1, 0, MPI_COMM_WORLD, &req1 );\n    MPI_Irecv( rbuf, n, MPI_INT,\
    \ 1, 0, MPI_COMM_WORLD, &req2 );\n    MPI_Wait( &req1, &status );\n    MPI_Wait(\
    \ &req2, &status );\n}\n```\n```"
