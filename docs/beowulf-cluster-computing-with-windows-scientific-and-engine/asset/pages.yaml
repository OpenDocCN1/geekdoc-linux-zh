    \ )\n{\n\tint rank, size;\n\n\tMPI_Init( &argc, &argv );\n\tMPI_Comm_rank( MPI_COMM_WORLD,\
    \ &rank );\n\tMPI_Comm_size( MPI_COMM_WORLD, &size );\n\tprintf( \"Hello World\
    \ from process %d of %d\\n\", rank, size );\n\tMPI_Finalize();\n\treturn 0;\n\
    }\n```\n\n# Figure 9.2\nA more interesting version of \"Hello World\".\n\nitself.\
    \ This version, shown in Figure 9.2, illustrates several important points. Of\
    \ particular note are the variables rank and size. Because MPI programs are made\
    \ up of communicating processes, each process has its own set of variables. In\
    \ this case, each process has its own address space containing its own variables\
    \ rank and size (and argc, argv, etc.). The routine MPI_Comm_size returns the\
    \ number of processes in the MPI job in the second argument. Each of the MPI processes\
    \ is identified by a number, called the rank, ranging from zero to the value of\
    \ size minus one. The routine MPI_Comm_rank returns in the second argument the\
    \ rank of the process. The output of this program might look something like the\
    \ following:\n\n+   - Hello World from process 0 of 4\n+   - Hello World from\
    \ process 2 of 4\n+   - Hello World from process 3 of 4\n+   - Hello World from\
    \ process 1 of 4\n\nNote that the output is not ordered from processes 0 to 3.\
    \ MPI does not specify the behavior of other runtimes or language statements such\
    \ as printf; in particular, it does not specify the order of output from print\
    \ statements.\n\n# 9.1.1  Compiling and Running MPI Programs\n\nThe MPI standard\
    \ does not specify how to compile and link programs (neither do C or Fortran).\
    \ However, most MPI implementations provide tools to compile and"
  merge: -1
  img_proc: true
- pgno: 199
  md: "link programs.\n\nThe MPICH implementation of MPI provides instructions on\
    \ setting up a make-file or project file for use with Microsoft Visual Studio.\
    \ In version 1.2.1, these are\n\n+   * **Include Path:** '<MPICH home>\\\\include'\
    \ \n+   * **Switches:** /MTd for the debug version and /MT for the release version\
    \ \n+   * **Libraries:** 'mpich.lib' (contains MPI-1, all PMPI routines, and MPI-IO);\
    \ 'mpe.lib' contains the profiling interface to MPI-1 \n+   * **Library Path:**\
    \ '<MPICH home>\\\\lib' \n+   * **Include path:** '<MPICH home>\\\\include'\n\n\
    Running an MPI program (in most implementations) also requires a special program,\
    \ particularly when parallel programs are started by a batch system as described\
    \ in Chapter 13. Many implementations provide a program **mpirun** that can be\
    \ used to start MPI programs. For example, the command\n\n```\nmpirun -np 4 helloworld\n\
    ```\n\nruns the program **helloworld** using four processes. Most MPI implementations\
    \ will attempt to run each process on a different processor; most MPI implementations\
    \ provide a way to select particular processors for each MPI process. In MPICH,\
    \ **mpirun** should be run from within a console process.\n\nThe name and command-line\
    \ arguments of the program that starts MPI programs were not specified by the\
    \ original MPI standard, just as the C standard does not specify how to start\
