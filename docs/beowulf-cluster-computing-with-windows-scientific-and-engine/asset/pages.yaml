- pgno: 374
  md: '# # 15 Maui Scheduler: A Multifunction Cluster Scheduler


    *David B. Jackson*


    In this chapter we describe the Maui scheduler, a job-scheduling component that
    can interact with a number of different resource managers.


    Like virtually every major development project, Maui grew out of a pressing need.
    In Maui’s case, various computing centers including the Maui High-Performance
    Computing Center, Pacific Northwest National Laboratory, San Diego Supercomputer
    Center, and Argonne National Laboratory were investing huge sums of money in new,
    top-of-the-line hardware, only to be frustrated by the inability to use these
    new resources in an efficient or controlled manner. While existing resource management
    systems allowed the basic ability to submit and run jobs, they did not empower
    the site to maximize the use of the cluster. Sites could not *translate* local
    mission policies into scheduling behavior, and the scheduling decisions that were
    made were often quite suboptimal. Worse, the resulting system was often so complex
    that management, administrators, and users were unable to tell how well the system
    was running or what could be done to improve it.


    Maui was designed to address these issues and has been developed and tested over
    the years at many leading-edge computing centers. It was built to enable sites
    to control, understand, and use their clusters effectively. Maui picks up where
    many scheduling systems leave off, providing a suite of advanced features in the
    areas of reservations, backfill, fairshare, job prioritization, quality of service,
    metascheduling, and more.


    # ## 15.1 Overview


    Maui is an *external* scheduler, meaning it does not include a resource manager
    but rather extends the capabilities of the existing resource manager. Maui uses
    the native scheduling APIs of OpenPBS, PBSPro and LoadLeveler to obtain system
    information and direct cluster scheduling activities. While the underlying resource
    manager continues to maintain responsibility for managing nodes and tracking jobs,
    Maui controls the decisions of when, where, and how jobs will run.


    System administrators control Maui via a master config file, `maui.cfg`, and text
    or Web-based administrator commands. On the other hand, end users are not required
    to learn any new commands or job submission language, and need not even know that
    Maui has been installed. While Maui provides numerous commands to provide users
    with additional job information and control, these commands are optional and may
    be introduced to the users as needed.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# 15.2 Installation and Initial Configuration


    The Maui scheduler is available in many of the most popular cluster-building toolkits,
    including *Rocks* and *OSCAR*. For the most recent version of Maui, you can download
    the code from the Maui home page at **supercluster.org/maui**. This site also
    contains online documentation, FAQs, links to the Maui users mailing list, and
    other standard open source utilities. To build the code once it has been downloaded,
    you need simply to issue the standard `configure`, `make`, and `make install`.


    # 15.2.1 Basic Configuration


    The `configure` script will prompt you for some basic information regarding the
    `install` directory and desired resource manager type. It then creates the Maui
    home directory, builds executables in the `bin` subdirectory, and copies these
    to the `install` directory. Finally, the script creates an initial `maui.cfg`
    file using templates located in the `samples` subdirectory and user-supplied information.
    This file is a *flat text* config file used for virtually all scheduler configuration
    and contains a number of parameters that should be verified, particularly, `SERVERHOST`,
    `SERVERMODE`, and `ADMIN1`. Initially, these should be set to the name of the
    host where Maui will run, `NORMAL`, and the user name of the Maui administrator,
    respectively. At any time when Maui is running, the `schedctl` command can be
    used with the ‘-l’ flag to *list* the value of any parameter whether explicitly
    set or not, while the ‘-m’ flag can be used to dynamically *modify* parameter
    values. The online parameters documentation provides further details about these
    and all other Maui parameters.


    # 15.2.2 Simulation and Testing


    With the initial configuration complete, the next step is testing the scheduler
    to become familiar with its capabilities and to verify basic functionality. Maui
    can be run in a completely *safe* manner by setting `SERVERMODE` to `TEST`. In
    *test* mode, Maui contacts the resource manager to obtain up-to-date configuration,
    node, and job information; however, in this mode, interfaces to start or modify
    these jobs are disabled. To start Maui, you must make the parameter changes and
    issue the command `maui`. You may also use commands such as `showq`, `diagnose`,
    and `checknode` to verify proper scheduler-resource manager communication and
    scheduler functionality. Full details on the suite of Maui commands are available
    online or in documentation included with your distribution.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# ### 15.2.3 Production Scheduling


    Once you’ve taken the scheduler for a test drive and have verified its proper
    behavior, you can run Maui *live* by disabling the default scheduler and changing
    the `SERVERMODE` parameter to `NORMAL`. Information on disabling the default resource
    manager scheduler is provided in the resource manager’s documentation and in the
    online Maui migration guides located at `supercluster.org/documentation/maui`.
    These changes will allow Maui to start, modify, and cancel jobs according to the
    specified scheduling policies.


    Out of the box, Maui essentially duplicates the behavior of a vanilla cluster
    scheduler, providing first-in, first-out scheduling with backfill enabled. The
    parameters documentation explains in detail each of the parameters needed to enable
    advanced scheduling features. In most cases, each site will require only a small
    subset of the available parameters to meet local needs.


    # ## 15.3 Advanced Configuration


    With the initial configuration and testing completed, you can now configure Maui
    to end your administration pilgrimage and reach the long-sought cluster mecca—running
    the right jobs at the right time, in the right way, at the right place. To this
    end, Maui can be thought of as an integrated scheduling toolkit providing a number
    of capabilities that may be used individually or together to obtain the desired
    system behavior. These include


    +   - job prioritization,

    +   - node allocation policies,

    +   - throttling policies,

    +   - fairshare,

    +   - reservations,

    +   - allocation management,

    +   - quality of service,

    +   - backfill,

    +   - node sets, and

    +   - preemption policies.


    Each of these is described below. While this coverage will be adequate to introduce
    and initially configure these capabilities, you should consult the online Maui
    Administrators Manual for full details. We reiterate that while Maui possesses
    a'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'wide range of features and associated parameters, most capabilities are disabled
    by default; thus, a site need configure only the features of interest.


    # 15.3.1 Assigning Value: Job Prioritization and Node Allocation


    In general, prioritization is the process of determining which of many options
    best fulfills overall goals. In the case of scheduling, a site will often have
    multiple, independent goals that may include maximizing system utilization, giving
    preference to users in specific projects, or making certain that no job sits in
    the queue for more than a given period of time. One approach to representing a
    multifaceted set of site goals is to assign weights to the various objectives
    so an overall value or priority can be associated with each potential scheduling
    decision. With the jobs prioritized, the scheduler can roughly fulfill site objectives
    by starting the jobs in priority order.


    Maui was designed to allow component and subcomponent weights to be associated
    with many aspects of a job. To realize this fine-grained control, Maui uses a
    simple priority-weighting hierarchy where the contribution of a priority factor
    is calculated as PRIORITY-FACTOR-VALUE * SUBFACTORWEIGHT * FACTORWEIGHT. Component
    and subcomponent weights are listed in Table 15.1. Values for all weights may
    be set in the maui.cfg file by using the associated component-weight parameter
    specified as the name of the weight followed by the string WEIGHT (e.g., SERVICEWEIGHT
    or PROCWEIGHT).


    By default, Maui runs jobs in order of actual submission, using the QUEUE TIME.
    By using priority components, however, you can incorporate additional information,
    such as current level of service, service targets, resources requested, and historical
    usage. You can also limit the contribution of any component, by specifying a priority
    component cap, such as RESOURCECAP. A job’s priority is equivalent to the sum
    of all enabled priority factors.


    Each component or subcomponent may be used for different purposes. WALLTIME can
    be used to favor (or disfavor) jobs based on their duration; ACCOUNT can be used
    to favor jobs associated with a particular project; QUEUETIME can be used to favor
    those jobs that have been waiting the longest. By mixing and matching priority
    weights, sites generally obtain the desired job-start behavior. At any time, you
    can issue the diagnose -p command to determine the impact of the current priority-weight
    settings on idle jobs.


    While most subcomponents are metric based (i.e., number of seconds queued or number
    of nodes requested), the credential subcomponents are based on priorities specified
    by the administrator. Maui allows you to use the *CFG parameters to rank'
  merge: -1
  img_proc: true
