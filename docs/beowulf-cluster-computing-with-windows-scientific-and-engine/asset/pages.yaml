    # 14.2.4 Submitting Different Types of Jobs: Alternative Universes


    A Universe in Condor defines an execution environment. Condor supports the following
    Universes on Windows 2000:


    +   • Vanilla

    +   • MPI

    +   • Scheduler


    The `Universe` attribute is specified in the submit description file. At the publication
    time of this book, the Unix port of Condor has several more Universes available
    than does Condor on Windows 2000. For instance, Condor on Unix has a PVM Universe
    in addition to MPI. The Condor Team intends ultimately to support all Universes
    on Windows 2000 as well; in fact, a PVM Universe may already exist in Condor for
    Windows 2000 by the time you read this.


    **Vanilla Universe.** The Vanilla Universe is used to run serial (nonparallel)
    jobs. The examples provided in the preceding section use the Vanilla Universe.
    Any program that runs outside of Condor will run in the Vanilla Universe. Binary
    executables as well as batch files are welcome in the Vanilla Universe.'
  merge: -1
  img_proc: true
