  md: '# ## 11 Paralleel Programming with PVM


    *Al Geist and Stephen Scott*


    PVM (Paralleel Virtual Machine) is an outgrowth of an ongoing computing research
    project involving Oak Ridge National Laboratory, the University of Tennessee,
    and Emory University. The general goal of this project is to investigate issues
    in, and develop solutions for, heterogeneous concurrent computing. PVM is an integrated
    set of software tools and libraries that emulates a general-purpose, flexible,
    heterogeneous paralleel computing framework on interconnected computers of varied
    architecture. The overall objective of the PVM system is to enable such a collection
    of computers to be used cooperatively for a concurrent or paralleel computation.
    This chapter provides detailed descriptions and discussions of the concepts, logistics,
    and methodologies involved in programming with PVM.


    # ### 11.1 Overview


    PVM is based on the following principles:


    +   • **User-configured host pool**: The application’s computational tasks execute
    on a set of machines that are selected by the user for a given run of the PVM
    program. Both single-CPU machines and hardware multiprocessors (including shared-memory
    and distributed-memory computers) may be part of the host pool. The host pool
    may be altered by adding and deleting machines during operation (an important
    feature for fault tolerance). When PVM is used on Beowulf clusters, the nodes
    make up the host pool.


    +   • **Translucent access to hardware**: Application programs may view the hardware
    environment as an attributeless collection of virtual processing elements or may
    exploit the capabilities of specific machines in the host pool by positioning
    certain computational tasks on the most appropriate computers.


    +   • **Process-based computation**: The unit of parallellism in PVM is a task,
    an independent sequential thread of control that has communication and computation
    capabilities. No process-to-processor mapping is implied or enforced by PVM; in
    particular, multiple tasks may execute on a single processor.


    +   • **Explicit message-passing model**: Collections of computational tasks,
    each performing a part of an application’s workload, cooperate by explicitly sending
    and receiving messages from one another. PVM dynamically allocates space for message
    buffers so message size is limited only by the amount of available memory.


    +   • **Heterogeneity support**: The PVM system supports heterogeneity in terms
    of machines, networks, and applications. With regard to message passing, PVM'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'permits messages containing more than one datatype to be exchanged between
    machines having different data representations.


    +   * **Multiprocessor support:** PVM uses the native message-passing facilities
    on multiprocessors to take advantage of the underlying hardware. For example,
    on the IBM SP, PVM transparently uses IBM''s MPI to move data. On the SGI Origin,
    PVM uses shared memory to move data.


    The PVM system is composed of two parts. The first part is a daemon, called **pvm
    d3** and sometimes abbreviated **pvm d**, that resides on all the computers making
    up the virtual machine. (An example of a daemon program is the mail program that
    runs in the background and handles all the incoming and outgoing electronic mail
    on a computer.) The daemon **pvm d3** is designed so any user with a valid login
    can install this daemon on a machine. To run a PVM application, you first create
    a virtual machine by starting up PVM (Section 11.7.2 details how this is done).
    You can then start the PVM application on any of the hosts. Multiple users can
    configure virtual machines that overlap the same cluster nodes, and each user
    can execute several PVM applications simultaneously.


    The second part of the system is a library of PVM interface routines. It contains
    a functionally complete repertoire of primitives that are needed for cooperation
    between tasks of an application. This library contains user-callable routines
    for message passing, spawning processes, coordinating tasks, and modifying the
    virtual machine.


    The PVM computing model is based on the notion that an application consists of
    several tasks each responsible for a part of the application''s computational
    workload. Sometimes an application is parallelized along its functions. That is,
    each task performs a different function, for example, input, problem setup, solution,
    output, or display. This is often called functional parallelism. A more common
    method of parallelizing an application is called data parallelism. In this method
    all the tasks are the same, but each one knows and solves only a small part of
    the data. This is also referred to as the SPMD (single program, multiple data)
    model of computing. PVM supports either or a mixture of both these methods. Depending
    on their functions, tasks may execute in parallel and may need to synchronize
    or exchange data.


    The PVM system currently supports C, C++, and Fortran languages. These language
    interfaces have been included based on the observation that the predominant majority
    of target applications are written in C and Fortran, with an emerging trend in
    experimenting with object-based languages and methodologies. Third-'
