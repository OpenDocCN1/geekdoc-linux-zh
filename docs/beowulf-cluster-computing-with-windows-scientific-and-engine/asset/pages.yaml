    # ## 10.8  Using C++ and Fortran 90


    MPI-1 defined bindings to C and Fortran 77. These bindings were very similar;
    the only major difference was the handling of the error code (returned in C, set
    through the last argument in Fortran 77). In MPI-2, a binding was added for C++,
    and an MPI module was defined for Fortran 90.


    The C++ binding provides a lightweight model that is more than just a C++ version
    of the C binding but not a no-holds-barred object-oriented model. MPI objects
    are defined in the MPI namespace. Most MPI objects have corresponding classes,
    such as Datatype for MPI_Datatype. Communicators and requests are slightly different.
    There is an abstract base class Comm for general communicators with four derived
    classes: Intracomm, Intercomm, Graphcomm, and Cartcomm. Most communicators are
    Intracomms; GraphComm and CartComm are derived from IntraComm. Requests have two
    derived classes: Prequest for persistent requests and Grequest for generalized
    requests (new in MPI-2). Most MPI operations are'
