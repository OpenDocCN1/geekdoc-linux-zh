- pgno: 29
  md: '# Preface


    Within the past three years, there has been a rapid increase in the deployment
    and application of computer clusters to expand the range of available system capabilities
    beyond those of conventional desktop and server platforms. By leveraging the development
    of hardware and software for these widely marketed and heavily used mainstream
    computer systems, clusters deliver order of magnitude or more scaling of computational
    performance and storage capacity without incurring significant additional R&D
    costs. Beowulf-class systems, which exploit mass-market PC hardware and software
    in conjunction with cost-effective commercial network technology, provide users
    with the dual advantages of unprecedented price/ performance and configuration
    flexibility for parallel computing. Beowulf-class systems may be implemented by
    the end users themselves from available components. But with their growth in popularity,
    so has evolved industry support for commercial Beowulf systems. Today, depending
    on source and services, Beowulf systems can be installed at a cost of between
    one and three dollars per peak megaflops and of a scale from a few gigaflops to
    half a teraflops. Equally important is the rapid growth in diversity of application.
    Originally targeted to the scientific and technical community, Beowulf-class systems
    have expanded in scope to the broad commercial domain for transaction processing
    and Web services as well as to the entertainment industry for computer-generated
    special effects. Right now, the largest computer under development in the United
    States is a commodity cluster that upon completion will be at a scale of 30 teraflops
    peak performance. It is quite possible that, by the middle of this decade, commodity
    clusters in general and Beowulf-class systems in particular may dominate middle
    and high-end computing for a wide range of technical and business workloads. It
    also appears that for many students, their first exposure to parallel computing
    is through hands-on experience with Beowulf clusters.


    The publication of *How to Build a Beowulf* by MIT Press marked an important milestone
    in commodity computing. For the first time, there was an entry-level comprehensive
    book showing how to implement and apply a PC cluster. The initial goal of that
    book, which was released almost two years ago, was to capture the style and content
    of the highly successful tutorial series that had been presented at a number of
    conferences by the authors and their colleagues. The timeliness of this book and
    the almost explosive interest in Beowulf clusters around the world made it the
    most successful book of the MIT Press Scientific and Engineering Computation series
    last year. While other books have since emerged on the topic of assembling clusters,
    it still remains the most comprehensive work teaching hardware, software, and
    programming methods. Nonetheless, in spite of its success, *How to Build a Beowulf*
    addressed the needs of only a part of the rapidly growing commodity'
