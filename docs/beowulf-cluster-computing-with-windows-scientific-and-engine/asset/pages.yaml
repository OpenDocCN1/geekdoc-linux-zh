    # ## 16.3 Installing PBS


    PBS is able to support a wide range of configurations. It may be installed and
    used to control jobs on a single system or to load balance jobs on a number of
    systems. It may be used to allocate nodes of a cluster or parallel system to both
    serial and parallel jobs. It can also deal with a mix of these situations. However,
    given the topic of this book, we focus on the recommended configuration for clusters.
    The PBS Administrator Guide explains other configurations.


    When PBS is installed on a cluster, a MOM daemon must be on each execution host,
    and the Server and Scheduler should be installed on one of the systems or on a
    front-end system.


    For Windows 2000 clusters, PBS is provided in a single package that contains


    +   - the *PBS Administrator Guide* in PDF form

    +   - the *PBS User Guide* in PDF form,

    +   - the PBS Pro software, and

