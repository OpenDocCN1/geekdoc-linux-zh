    \ /* Send Problem to Spawned Workers */\n        for ( i=0; i < NPROB ; i++ )\
    \ probs[i] = -1;\n        for ( i=0 ; i < numt ; i++ ) {\n            pvm_initsend(\
    \ PvmDataDefault );\n        }\n```\n```"
