    # Named Pipe and Mailslot Implementation.


    As evidence of their tight integration with Win32, named pipe and mailslot functions
    are all implemented in the kernel32.dll Win32 client-side DLL. ReadFile and WriteFile,
    which are the functions applications use to send and receive messages using named
    pipes and mailslots, are the primary Win32 I/O routines. The CreateFile function,
    which a client uses to open either a named pipe or a mailslot, is also a standard
