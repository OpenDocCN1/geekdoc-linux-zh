    \n```\n#!perl\nuse Win32::Daemon;\n\n%ModelHash =\n    ( \n     name    => 'Model',\n\
    \     display => 'Model Perl Service',\n     path    => 'c:\\perl\\bin\\perl.exe',\n\
    \n```"
