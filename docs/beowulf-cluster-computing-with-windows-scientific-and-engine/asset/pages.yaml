- pgno: 19
  md: '# Series Foreword


    The world of modern computing potentially offers many helpful methods and tools
    to scientists and engineers, but the fast pace of change in computer hardware,
    software, and algorithms often makes practical use of the newest computing technology
    difficult. The Scientific and Engineering Computation series focuses on rapid
    advances in computing technologies, with the aim of facilitating transfer of these
    technologies to applications in science and engineering. It will include books
    on theories, methods, and original applications in such areas as parallelism,
    large-scale simulations, time-critical computing, computer-aided design and engineering,
    use of computers in manufacturing, visualization of scientific data, and human-machine
    interface technology.


    The series is intended to help scientists and engineers understand the current
    world of advanced computation and to anticipate future developments that will
    affect their computing environments and open up new capabilities and modes of
    computation.


    This volume in the series describes the increasingly successful distributed/parallel
    system called Beowulf. A Beowulf is a cluster of PCs interconnected by network
    technology and employing the message-passing model for parallel computation. Key
    advantages of this approach are high performance for low price, system scalability,
    and rapid adjustment to new technological advances.


    This book includes how to build, program, and operate a Beowulf system based on
    the Windows 2000 operating system. A companion volume in the series provides the
    same information for Beowulf clusters based on the Linux operating system.


    Beowulf hardware, operating system software, programming approaches and libraries,
    and machine management software are all covered here. The book can be used as
    an academic textbook as well as a practical guide for designing, implementing,
    and operating a Beowulf for those in science and industry who need a powerful
    system but are reluctant to purchase an expensive massively parallel processor
    or vector computer.


    Janusz S. Kowalik'
  merge: -1
  img_proc: true
