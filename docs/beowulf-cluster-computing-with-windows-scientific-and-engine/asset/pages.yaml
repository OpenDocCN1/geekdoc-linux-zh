- pgno: 222
  md: 'MPICH provides three such “profiling libraries” and some tools for creating
    more. These libraries are easily used by passing an extra argument to MPICH’s
    `mpicc` command for compiling and linking.


    +   * `mpilog` causes a file to be written containing timestamped events. The
    log file can be examined with tools such as Jumps hot (see below).


    +   * `mpitrace` causes a trace of MPI calls, tagged with process rank in `MPI_COMM_WORLD`
    to be written to stdout.


    +   * `mpianim` shows a simple animation of message traffic while the program
    is running.


    The profiling libraries are part of the MPE subsystem of MPICH, which is separately
    distributable and works with any MPI implementation.


    # 9.7.2 Visualizing Parallel Program Behavior


    The detailed behavior of a parallel program is surprisingly difficult to predict.
    It is often useful to examine a graphical display that shows the exact sequence
    of states that each process went through and what messages were exchanged at what
    times and in what order. The data for such a tool can be collected by means of
    a profiling library. One tool for looking at such log files is Jump shot [17].
    A screenshot of Jumpshot in action is shown in Figure 9.13.


    The horizontal axis represents time, and there is a horizontal line for each process.
    The states that processes are in during a particular time interval are represented
    by colored rectangles. Messages are represented by arrows. It is possible to zoom
    in for microsecond-level resolution in time.


    # 9.8 MPI Implementations for Clusters


    Many implementations of MPI are available for clusters; Table 9.3 lists some of
    the available implementations. These range from commercially supported software
    to supported, freely available software to distributed research project software.


