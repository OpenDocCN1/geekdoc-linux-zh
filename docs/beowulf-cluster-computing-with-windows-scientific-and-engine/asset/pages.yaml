- pgno: 292
  md: '# ### 11.7 Using PVM


    This section describes how to set up the PVM software package, how to configure
    a simple virtual machine, and how to compile and run the example programs supplied
    with PVM. The first part describes the straightforward use of PVM and the most
    common problems in setting up and running PVM. The latter part describes some
    of the more advanced options available for customizing your PVM environment.


    # #### 11.7.1 Setting Up PVM


    One of the reasons for PVM''s popularity is that it is simple to set up and use.


    PVM must be installed by a user with Administrator access. It then can be made
    available to all users of the machine providing the Administrator has not restricted
    access to any of the PVM installed files.


    The Windows version of PVM is distributed as a WinZip file that contains an **InstallShield**
    self-extracting executable. Compilers to be used with PVM should already be installed,
    since the PVM installation process will confirm compiler location and configuration.
    With this basic information, a user can successfully install PVM by simply clicking
    *Next* throughought the installation process. One option in the Windows installation
    process asks whether this is a server or a client installation. For a Windows-based
    cluster there must be at least one server installation of PVM. This is because
    a server installation includes all PVM sources and libraries, while a client installation
    points to a server installation from which it may access the appropriate PVM programs.
    Of course it is acceptable to do server installations for all nodes of the cluster
    and thus avoid the need and associated cost of the clients accessing programs
    via the network during run time.


    By default, the installation will put the PVM system in the directory C:\Program
    Files\PVM3.4. (A *Browse* button is available, however, if you wish to specify
    an alternative location. Select *Next* to continue on to select the location for
    PVM to use for temporary runtime files. The most common location is C:\TEMP. Enter
    this location, and press *Next* to continue to the Setup Type screen. Selecting
    the *Typical* installation will ensure that a complete installation is performed.
    Press *Next* to continue to the C compiler specification screen. Select the C
    compiler choice from the screen, and press *Next* to continue. If *None* is selected,
    the Fortran compiler specification screen will be *next*. If an installed compiler
    is selected, the destination screen appearing next will contain the correct location
    for the compiler''s `include` and `lib` directories. Press *Next* to continue
    to the Fortran compiler specification screen. If a compiler is selected that is
    not installed, you will be given a warning message and asked for the location
    where the compiler''s `include` and `lib` directories'
  merge: -1
  img_proc: true
