  img_proc: true
- pgno: 385
  md: "reservations, or other aspects of backfill scheduling. You should consult the\
    \ online documentation for details about associated parameters.\n\n**Allocation\
    \ Based on Node Set.** While backfill improves the scheduler’s per-\nformance,\
    \ this is only half the battle. The efficiency of a cluster, in terms of actual\n\
    work accomplished, is a function of both scheduling performance and individual\
    \ job\nefficiency. In many clusters, job efficiency can vary from node to node\
    \ as well as\nwith the *node mix* allocated. Internet most parallel jobs written\
    \ in popular languages\nsuch as MPI or JVM do not internally load balance their\
    \ workload, they run only\nas fast as the slowest node allocated. Consequently,\
    \ these jobs run most effectively\non homogeneous sets of nodes. While many clusters\
    \ start out as homogeneous, how-\never, they quickly evolve as new generations\
    \ of compute nodes are integrated into\nthe system. Research has shown that this\
    \ integration, while improving scheduling\nperformance due to increased scheduler\
    \ selection, can actually decrease average job\nefficiency.\n\nA feature called\
    \ *node sets* allows jobs to request sets of common resources with-\nout specifying\
    \ exactly what resources are required. Node set policy can be specified\nglobally\
    \ or on a per job basis and can be based on node processor speed, memory,\nnetwork\
    \ interfaces, or locally defined node attributes. In addition to forcing jobs\n\
    onto homogeneous nodes, these policies may also be used to guide jobs to one or\n\
    more types of nodes on which a particular job performs best, similar to job prefer-\n\
    ences available in other systems. For example, an 1/0-intensive job may run best\n\
    on a certain range of processor speeds, running slower on slower nodes while wast-\n\
    ing cycles on faster nodes. A job may specify AN OF: PROCSPEED: 450:500:650 to\n\
    request nodes in the range of 450 to 650 MHz. Alternatively, if a simple processor-\n\
    \ homogeneous node set is desired, ONEOF: PROCSPEED may be specified. On the other\n\
    hand, a communication-sensitive job may request a network-based node set with\
    \ the\nconfiguration ONEOF: NETWORK: v1a: mynet: ethernet, in which case Maui\
    \ will\nfirst attempt to locate adequate nodes where all nodes contain VIA network\
    \ inter-\nfaces. If such a set cannot be found, Maui will look for sets of nodes\
    \ containing\nthe other specified network interfaces. In highly heterogeneous\
    \ clusters, the use of\nnode sets has been found to improve job throughput by\
    \ 10 to 15 percent.\n\n**Preemption.** Many sites possess workloads of varying\
    \ importance. While it may\nbe critical that some jobs obtain resources immediately,\
    \ other jobs are less sensitive\nto turnaround time but have an insatiable hunger\
    \ for compute cycles, consuming\nevery available cycle for years on end. These\
    \ latter jobs often have turnaround\ntimes on the order of weeks or months. The\
    \ concept of *cycle stealing*, popularized\nby systems such as Condor, handles\
    \ such situations well and enables systems to run"
  merge: -1
  img_proc: true
- pgno: 386
  md: 'low-priority preemptible jobs whenever something more pressing is not running.
    These other systems are often employed on compute farms of desktops where the
    jobs must vacate whenever interactive system use is detected.


    Maui’s QoS-based preemption system allows a dedicated, noninteractive cluster
    to be used in much the same way. Certain QoS objects may be marked with the flag
    PREEMPTOR and others with the flag PREEMPTEE. With this configuration, low-priority
    “preemptee” jobs can be started whenever idle resources are available. These jobs
    will be allowed to run until a “preemptor” job arrives, at which point the preemptee
    job will be checkpointed if possible and vacated. This strategy allows almost
    immediate resource access for the preemptor job. Using this approach, a cluster
    can maintain nearly 100 percent system utilization while still delivering excellent
    turnaround time to the jobs of greatest value.


    Use of the preemption system need not be limited to controlling low-priority jobs.
    Other uses include optimistic scheduling and development job support.


    # 15.3.5 Evaluating System Performance: Diagnostics, Profiling, Testing, and Simulation


    High-performance computing clusters are complicated. First, such clusters have
    an immense array of attributes that affect overall system performance, including
    processor speed, memory, networks, I/O systems, enterprise services, and application
    and system software. Second, each of these attributes is evolving over time, as
    is the usage pattern of the system’s users. Third, sites are presented with an
    equally immense array of buttons, knobs, and levers which they can push, pull,
    kick, and otherwise manipulate. How does one evaluate the success of a current
    configuration? And how does one establish a causal effect between pushing one
    of the many provided buttons and improved system performance when the system is
    constantly changing in multiple simultaneous dimensions?


