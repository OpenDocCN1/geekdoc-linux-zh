    # 10.7   Remote Memory Access


    The message-passing programming model requires that both the sender and the receiver
    (or all members of a communicator in a collective operation) participate in moving
    data between two processes. An alternative model where one process controls the
    communication, called one-sided communication, can offer better performance and
    in some cases a simpler programming model. MPI-2 provides support for this one-sided
    approach. The MPI-2 model was inspired by the work on the bulk synchronous programming
    (BSP) model [9] and the Cray SHMEM library used on the massively parallel Cray
    T3D and T3E computers [1].


    In one-sided communication, one process may put data directly into the memory
    of another process, without that process using an explicit receive call. For this
    reason, this also called remote memory access (RMA).


    Using RMA involves four steps:


    +   1. Describe the memory into which data may be put.


    +   2. Allow access to the memory.


    +   3. Begin put operations (e.g., with MPI\_Put).


    +   4. Complete all pending RMA operations.'
