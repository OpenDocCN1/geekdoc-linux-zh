  md: 'In many computations the ratio of communication to computation can be reduced
    almost to 0 by making the problem size larger. Our analysis shows that this is
    not the case here. As $n$ gets larger, the term on the left approaches $\frac{1}{2}$.
    Thus we can expect communication costs to prevent this algorithm from showing
    good speedsups, even on large problem sizes.


    The situation is better in the case of matrix-matrix multiplication, which could
    be carried out by a similar algorithm. We would replace the vectors **b** and
    **c** by matrices, send the entire matrix **b** to the workers at the beginning
    of the computation, and then hand out the rows of **a** as work units, just as
    before. The workers would compute an entire row of the product, consisting of
    the dot products of the row of **a** with all of the column of **b**, and then
    return a row of **c** to the manager. Let us now do the scalability analysis for
    the matrix-matrix multiplication. Again we ignore the initial communication of
    **b**. The number of operations for one dot product is $n + (n+1)$ as before,
    and the total number of dot products calculated is $n^2$. Thus the total number
    of operations is $n^2 \times (2n-1) = 2n^3 - n^2$. The number of numbers communicated
    has gone up to $(n \times n) + (n \times n) = 2n^2$. So the ratio of communication
    time to computation time has become


    $\left( \frac{2n^2}{2n^3-n^2} \right) \times \left( \frac{T_{comm}}{T_{calc}}
    \right)$,


    which does tend to 0 as $n$ gets larger. Thus, for large matrices the communication
    costs play less of a role.


    Two other difficulties with this algorithm might occur as we increase the size
    of the problem and the number of workers. The first is that as messages get longer,
    the workers waste more time waiting for the next row to arrive. A solution to
    this problem is to “double buffer” the distribution of work, having the manager
    send two rows at each worker to begin with, so that a worker always has some work
    to do while waiting for the next row to arrive.


    Another difficulty for larger numbers of processes can be that the manager can
    become overloaded so that it cannot assign work in a timely manner. This problem
    can most easily be addressed by increasing the size of the work unit, but in some
    cases it is necessary to parallelize the manager task itself, with multiple managers
    handling subpools of work units.


    A more subtle problem has to do with *fairness*: ensuring that all worker processes
    are fairly serviced by the manager. MPI provides several ways to ensure fairness;
    see [6, Section 7.1.4].'
