  md: "tently received by the wrong part of the application. The solution to this\
    \ problem is communication context. As described earlier in the MPI chapters,\
    \ communication context in MPI is handled cleanly through the MPI communicator.\n\
    \nIn PVM 3.4, pvm_recv() requests a message from a particular source with a user-chosen\
    \ message tag (either or both of these fields can be set to accept anything).\n\
    \nIn addition, communication context is a third field that a receive must match\
    \ on before accepting a message; the context cannot be specified by a wild card.\
    \ By default there is a base context that is a predefined and is similar to the\
    \ default MPI_COMM_WORLD communicator in MPI.\n\nPVM has four routines to manage\
    \ communication contexts.\n\n```\n```\nnew_context    = pvm_newcontext() \nold_context\
    \    = pvm_setcontext( new_context ) \ninfo           = pvm_freecontext( context\
    \ ) \ncontext        = pvm_getcontext()\n```\n```\n\nPvm_newcontext() returns\
    \ a systemwide unique context tag generated by the local daemon (in a way similar\
    \ to the way the local daemon generates systemwide unique task IDs). Since it\
    \ is a local operation, pvm_newcontext is very fast. The returned context can\
    \ then be broadcast to all the tasks that are cooperating on this part of the\
    \ application. Each of the tasks calls pvm_setcontext(), which switches the active\
    \ context and returns the old context tag so that it can be restored at the end\
    \ of the module by another call to pvm_setcontext. Pvm_freecontext and pvm_getcontext\
    \ are used to free memory associated with a context tag and to get the value of\
    \ the active context tag, respectively.\n\nSpawned tasks inherit the context of\
    \ their parent. Thus, if you wish to add context to an existing parallel routine\
    \ already written in PVM, you need to add only four lines to the source:\n\n```\n\
    ```\nint myctxt, oldctxt;\n/* near the beginning of the routine set a new context\
    \ */\nmyctxt = pvm_newcontext();\noldctxt = pvm_setcontext( myctxt );\n\n/* spawn\
    \ slave tasks to help */\n/* slave tasks require no source code change */\n/*\
    \ leave all the PVM calls in master unchanged */\n\n/* just before exiting the\
    \ routine restore previous context */\n```\n```"
