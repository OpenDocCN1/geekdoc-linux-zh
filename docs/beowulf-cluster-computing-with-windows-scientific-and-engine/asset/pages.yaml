    # ### 11.7.2 Starting PVM


    Before we go over the steps to compile and run parallel PVM programs, you should
    be sure you can start up PVM and configure a virtual machine. On any host on which
    PVM has been installed you can type


    ```

    > pvm

    ```


    and you should get back a PVM console prompt signifying that PVM is now running
    on this host. You can add hosts to your virtual machine by typing at the console
    prompt


    ```

    pvm> add hostname

    ```


    You also can delete hosts (except the one you are on) from your virtual machine
    by typing


    ```

    pvm> delete hostname

    ```


    If you get the message “Can''t Start pvmd,” PVM will run autodiagnostics and report
    the reason found.


    To see what the present virtual machine looks like, you type


    ```

    pvm> conf

    ```


    To see what PVM tasks are running on the virtual machine, you type


    ```

    pvm> ps -a

    ```


    Of course, you don''t have any tasks running yet. If you type “quit” at the console
    prompt, the console will quit, but your virtual machine and tasks will continue
    to run. At any command prompt on any host in the virtual machine you can type'
