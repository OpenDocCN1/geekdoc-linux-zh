    \ the host pool. To execute an application, you typically start one copy of one\
    \ task (typically the \"manager\" or \"initiating\" task) by hand from a machine\
    \ within the host pool. This process subsequenly starts other PVM tasks eventually\
    \ resulting in a collection of active tasks that then compute locally and exchange\
