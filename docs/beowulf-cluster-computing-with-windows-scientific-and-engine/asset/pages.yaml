- pgno: 440
  md: '# 19 Conclusions


    *Thomas Sterling*


    This book represents the practical state of the art in hardware and software for
    Beowulf cluster computing. But it also exemplifies the extreme rate at which commodity
    clusters are maturing and in so doing, gaining utility across ever-broader domains
    of application. Only two years ago our first work in this area, *How to Build
    a Beowulf*, was published by MIT Press. But in the short interval since then,
    the art and practice of cluster computing have evolved dramatically. Then, such
    systems were used in rather restrictive ways with limited software support beyond
    the basic node operating systems and message-passing libraries. System size rarely
    exceeded a hundred processors. Today, systems exceeding a thousand processors
    are employed for both technical and commercial computing. But more significant
    is the array of software tools available and under development to manage the implementation,
    maintenance, administration, and resource allocation of workloads on Beowulf clusters
    both large and small. Thus, in the brief period between this offering and our
    original modest work, Beowulf commodity cluster computing has come of age. Then,
    Beowulf systems were only a narrow element of the parallel computing domain. Today,
    they are often the system of choice and are rapidly coming to dominate even the
    highest end of computing. It is telling that at the most recent Supercomputing
    conference, the industrial exhibits included more commodity clusters on the floor
    than all other forms of parallel computing systems combined.


    In spite of these enormous gains, Beowulf cluster computing is very much a field
    in transition. There is no one universally accepted distributed environment or,
    for that matter, hardware foundation on which the cluster community relies. Of
    course, the flexibility this implies is part of its strength and involuntarily
    to vendor changes. Indeed, both hardware and software are in a state of flux,
    with continued changes foreseen for the next one to three years. It is worth considering
    where these likely changes will occur.


    # 19.1 Future Directions for Hardware Components


    Processor technology is witnessing three areas of change. The first is continued
    growth of processor capability, most notably in clock speed. Predictions to the
    contrary, clock rates continue to grow. At the time of this writing, the Pentium
    4 with a clock rate of 1.7 GHz is available in consumer-grade packages. Memory
    enhancements and cache size also expand to attempt to match the processor peak
    performance. The second change is a new generation of 64-bit architecture with
    the commercial release of the Intel IA-64 64-bit family of processors. The third'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'area of change is the likely integration of multiple processors per chip in
    SMP configurations. Should this trend become reality, then nodes of commodity
    clusters could all be SMP structures of two or more processors. All of these advances
    are driven by the continued reduction of integration feature size, with logic
    moving below 0.18 micron.


    Network technology is expected to make significant strides as gigahertz per node
    channels become commonplace and costs continue to drop. Myrinet and Ethernet dominate
    Beowulf cluster configurations, but other network technologies are having significant
    impact. The Quadrics QSW network are providing a high-bandwidth framework for
    the highest end of the Compaq Alpha processor-based systems, and larger configurations
    have been proposed that could yield clusters capable of over 100 teraflops peak
    performance. The VIA architecture continues to make inroads in the cluster market
    delivering gigabit per second throughputs and latencies well below 10 microseconds.
    Foremost among these is the Enulex cLAN network. But perhaps the most interesting
    advance is the emergence of the new industry Infini-band architecture (IBA) standard
    (well over 1,500 pages). Infiniband provides a new tightly integrated strategy
    and technology for all I/O needs including cluster interconnection networks. Instead
    of connecting to an intermediate I/O interface such as PCI, Infiniband will be
    tied more directly to the processor communications, increasing I/O bandwidth and
    reducing latencies down toward a microsecond. Already specified are several levels
    of bandwidth including the use of optical media that will work in the 10 Gbps
    regime. Infiniband is supported by a large industrial consortium and may become
    the new dominant I/O interface. Products based on IBA should be available within
    the next eighteen months. However, in spite of wide optimism, costs to customers
    have yet to be determined. It is interesting to note that the external network
    bandwidths are approaching the main memory bandwidths of the processing nodes.
    With another order of magnitude gain in bandwidth anticipated in the next few
    years, it may be that network bandwidth will cease to be the dominant bottleneck
    to realizable performance.


    Although less widely discussed, significant advances in mass storage are expected.
    These are being fueled by the rapidly growing PDA, digital camera, and cellular
    phone markets that require high-capacity storage in small, lightweight, and low-power
    components. “Matchbox” disk drives will provide multi-gigabyte capacities in the
    near future. For larger units, advanced EIDE drives will provide hundreds of gigabytes
    per unit at a cost of less than $10 per gigabyte. For many technical and commercial
    problems, mass storage is the bottleneck, both in capacity and in bandwidth. Commodity
    clusters provide a rich tradeoff space within which to configure and operate large
    disk farms. But reliability and software support for'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'distributed file spaces continue to offer considerable challenges that have
    not been fully resolved.


    Packaging of systems will continue to evolve and have impact on Beowulf clusters
    in two important ways. Historically, Beowulfs have taken up a lot of room. Although
    the very first Beowulf was custom packaged with 16 motherboards in a half-height
    rack, the majority of systems leveraged the low-cost, high-reliability PC tower
    packages with power supply. But the density of this class of package is low. For
    all but the smallest systems, floor space has become a problem. Because the market
    for Beowulf-class clusters has become significant, however, vendors are providing
    new packaging options with high-density rack-mounted units available such that
    40 or more processors can now be installed in a single floor standing rack. As
    higher-degree SMPs are built into such units, the number of processors per rack
    will continue to expand allowing larger systems to be installed in modest machine
    rooms. But this also leads to the second way future machines will be impacted
    and that is the scale of the largest Beowulf-clusters. In the near future, the
    largest systems in the world will be commodity clusters comprising 10,000 processors
    or more. Within the lifetime of this edition of this book, clusters delivering
    as much as 100 teraflops may be implemented on this scale.


    # 19.2 Future Directions for Software Components


    While enormous strides have been made in the area of cluster middleware within
    the past few years, the general consensus is that continued advances are required
    to bring this class of system to a level of usability and robustness equivalent
    to other server technology. Key attributes sought are completeness, commonality,
    usability, generality, and reliability.


    Completeness relates to the need for a comprehensive software environment that
    spans all aspects of the distributed cluster system and supports the major activities
    associated with the operation of a commodity cluster, large or small. These activities
    include installation, configuration and initialization, status monitoring and
    maintenance, administration, and resource scheduling.


    Commonality is the property of such an environment to be broadly used across the
    majority of Beowulf clusters throughout the community. Linux, Windows, and MPI
    all exhibit this property, which has been an important enabler to the wide dissemination
    of Beowulf systems. To that extent, if you’ve used one Beowulf, you are likely
    to be able, with little trouble, to work with any other. But at the middleware
    level, there is not such uniformity of environments. This is partly intentional'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'and partly due to history. As vendors have successfully advanced into the arena,
    middleware has been one area in which they could provide product differentiation,
    to enhance the apparent value of their respective offerings. Historically, low-level
    tools—especially for monitoring system status, operation, and health—have been
    developed in house with only limited sharing. As we have seen, however, other
    tools such as schedulers have seen much wider use.


    *Usability combined with generality relates to the ease of system operation through
    the abstraction presented by the middleware environment. A highly valued attribute,
    perceived to strongly contribute to usability, is “single system image.” Originally,
    Beowulf clusters were treated as an ensemble of separate loosely coupled processing
    systems, each being managed individually. In the earliest days, there would even
    be some kind of a switchbox connecting the operator’s keyboard and monitor to
    any designated processor node. While this can work for small, dedicated systems,
    it is untenable for larger, multiuser clusters and undesirable in any case. A
    system includes a number of name spaces with which the user must contend. Some
    of these include the user application’s global variables, the file space, the
    set of process IDs and jobs, and I/O. In the worst case, these all need to be
    dealt with on a per node basis. As systems grow to the scale of a thousand or
    more processors, this too can prove untenable. Even for much smaller systems,
    such explicit per node control is prone to operator error. Single-system image
    is the property by which the entire cluster presents only a single name space
    for each class of named object for the entire system, independent of the number
    of processors employed. The user sees one process ID space, one distributed file
    space, and the same for others. Generality extends the property of usability to
    include a broad range of operating modes from dedicated single user to multi-user,
    multiprogram operation.*


    System reliability is critical to long-term acceptance of Beowulf clusters by
    the information processing market. Opinions differ widely concerning the actual
    reliability of Beowulf systems. Infant mortality lasting weeks for moderate-sized
    systems can be high with fans, power supplies, disk drivers, and even memories
    breaking in a short time interval. After this period, however, systems often experience
    long stable operation, potentially of many months between required maintenance.
    After two to three years, age begins to take its toll, and failures begin to escalate.
    But for very large systems on the order of thousands of processors, single point
    failures can be significantly more prevalent. For either class of system, rapid
    detection, diagnosis, repair, restart, and recovery are essential to high availability.
    Software tools to aid in all facets of reliability are essential as well, but
    little work has been done in this area, and no accepted general set of tools is
    in use, although some experimental systems have been explored. One important capability
    is checkpoint'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'and restart, and some tools exist but involve direct application programmer
    intervention. Tools for logging and reporting soft errors can be used to identify
    likely future failures, directing preemptive controlled replacement of system
    components without disrupting application execution. Much more work is required
    in this area.


    A valuable effort is the collection and integration of a critical subset of existing
    tools to build a useful environment meeting at least some of the requirements
    above. OSCAR led out of Oak Ridge National Lab, Rocks being done at the San Diego
    Supercomputing Center, the integrated tool set at the Cornell Theory Center (CTC),
    and the integrated software system provided by Scyld are all examples of such
    efforts. OSCAR is a collaboration of a number of organizations including industry
    partners and is worth watching as it evolves. The tool set from CTC is one of
    the most comprehensive to be based on Windows. The Scyld software environment
    provides a good example of a user level single system image. While most Beowulf
    cluster software supports full operating systems on every node, each operating
    semi-independently, the Scyld model is different. By employing a logical structure
    of a master processor and multiple slave processors, all name spaces are managed
    through the master processor, presenting a single system image to the user. Processes
    are controlled by the master but delegated to the slave processors to be executed.
    The slave node kernels are very limited and lightweight and are downloaded by
    the master. This can be performed very efficiently, much more quickly than on
    conventional clusters, and solves the problem of version consistency control.
    Nevertheless, while the Scyld software environment exhibits many desirable properties,
    there is a question regarding scalability. A single master processor can create
    a bottleneck, and the coordination of multiple masters is nontrivial.


    With increased prevalence of SMP nodes in cluster systems, means of exploiting
    this class of tightly coupled unit is called for. OpenMP has been developed as
    one way to apply these resources within a shared-memory paradigm. But between
    nodes is still the fragmented name space so typical of most clusters. Ironically,
    even on systems with distributed shared memory hardware support, the majority
    of parallel programmers today use MPI with its message-passing model. The underlying
    mechanisms supporting the MPI implementation take advantage of the shared-memory
    hardware support, thereby making at least some of its operators more efficient
    than between cluster nodes, and this is done in a way that is transparent to the
    user. But a clean way of using shared memory within a node and distributed memory
    between nodes has not found a satisfactory solution in common practice. A class
    of programming models sometimes referred to as “put-get” models may provide at
    least a partial solution. Inspired in part by the Cray T3E programming model,
    this approach gives the impression of a distributed shared memory but assumes'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'no cache coherence. Within an SMP node, conventional load/store operations
    are used, but for remote accesses the corresponding get and put operators are
    used within the same programming model. Examples of this include UPC developed
    at IDA CCS and the experimental Earth-C developed at the University of Delaware.


    # ### 19.3 Final Thoughts


    It is hard to forecast where such a volatile technology as parallel computing
    will take us, as so many factors and trends influence the final outcome. A decade
    ago, clusters were in their infancy, and Beowulf was still in the future. A decade
    from now will see as many changes. Nonetheless, at least some of the possibilities
    can be considered. Extrapolating both the Top500 list and the Semiconductor Industry
    Association roadmap implies that the largest computers in the world, in all likelihood
    commodity clusters, will achieve a peak performance of 1 petaflops by the year
    2010. Integrated circuits of a billion devices most likely comprising a number
    of processors will be capable of a performance on the order of 100 Gflops or more.
    DRAM densities will grow a factor of a hundred in that same timeframe. And if
    optical communications are employed to their fullest, per channel bandwidths of
    1 Tbps or more are possible. In such a scenario, almost every small Beowulf will
    be a teraflops machine by 2010.


    As long as there is a need for servers of one type or another, there will be the
    opportunity for performance gains through commodity clusters. But a number of
    trends in the market are not aligned with a future with clusters. Portable computing
    devices including personal digital assistants, laptop computers, and soon to be
    released (probably) electronic books all have built-in human interfaces including
    screens and keyboards that make them unsuitable for clustering. It is true that
    their technology push helps reduce cost, power, and size, which can have a positive
    influence on cluster nodes. But the mass-market products themselves are not likely
    to be used in clusters generally. Admittedly, there have already been cases of
    clustering laptops. But these are not cost effective. Desktop (or desk side) computers
    in their ungainly tower cases may already be becoming extinct. A growing number
    of users have simply migrated their complete user environment onto their laptops.
    The laptop is everything, their entire world. With wireless interconnect in the
    office and home, even cellular Internet connections on the road, and disk capacities
    that will shortly exceed 100 Gbytes, the desktop is rapidly becoming a dinosaur.
    But it was from these devices that the first Beowulfs were devised. Beowulf-class
    systems exploited the existing mass-market devices, and now these may disappear.'
  merge: -1
  img_proc: true
- pgno: 446
  md: 'But this is no longer a problem because the value of clusters to the market
    has been proven. Vendors are now manufacturing processor nodes explicitly for
    the purpose of building high-density clusters. Thus the components are no longer
    hand-me-downs from other markets but optimized for this purpose. In a sense, the
    day of Beowulf classic is passing—not yet, but eventually. Commodity clusters
    were offered as a cheap alternative to MPPs to help offload these more expensive
    machines of at least part of their workload. But with the next-generation high-bandwidth
    networks and their tight integration with the processor/memory core, much of the
    distinction between MPPs and clusters is beginning to disappear. And with efficient
    implementations of such operations as put and get, a shared memory space (without
    cache coherence) model may be available, further eroding the distinction between
    cluster and MPP. If this happens, we will have truly witnessed the convergence
    of parallel architecture.


    And yet, that will not be the end of the story. The programming models de scribed
    so far are still primitive and require a close and explicit relationship between
    the physical system and the programmer. In the limit, the programmer should be
    responsible for describing the application''s parallel algorithm, but not responsible
    for hand manipulating the management of the physical resources and their direct
    association to the application task and data objects. As processors become ubiquitous
    in the tens of thousands and the critical resource is recog nized to be memory
    bandwidth, these parallel systems will motivate the develop ment of a new family
    of programming models where once again, as in the earliest days of computing,
    the programmer will treat the computer as a single system and not a distributed
    collection of many machines. We have had only tantalizing glimp ses of what such
    models might contain, but already researchers are considering just such new paradigms.
    Beowulf cluster computing is leading parallel processing into the future. Each
    step is an accomplishment in its own right and the foundation for progress to
    the next.'
  merge: -1
  img_proc: true
