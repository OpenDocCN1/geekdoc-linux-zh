- pgno: 302
  md: 'It is often useful and always reassuring to be able to see the present configuration
    of the virtual machine and the status of the hosts. It would be even more useful
    if you could also see what your program is doing—what tasks are running, where
    messages are being sent, and the like. The PVM GUI called XPVM was developed to
    display this information and more.


    XPVM combines the capabilities of the PVM console, a performance monitor, and
    a call-level debugger in single, easy-to-use graphical user interface. XPVM is
    available from Netlib (www.netlib.org) in the directory pvm3/xpvm. The XPVM source
    is also available for compiling on other machines.


    XPVM is written entirely in C using the TCL/TK toolkit and runs as just another
    PVM task. If you want to build XPVM from the source, you must first obtain and
    install the TCL/TK software on your system. TCL and TK were developed by John
    Ousterhout and can be obtained from www.scriptics.com. The TCL and XPVM source
    distributions each contain a README file that describes the most up-to-date installation
    procedure for each package, respectively.


    Figure 11.4 shows a snapshot of XPVM in use.


    Like the PVM console, XPVM will start PVM if it is not already running or just
    attach to the local pvmd if it is. The console can take an optional hostfile argument,
    whereas XPVM always reads $HOME/.xpvm_hosts as its hostfile. If this file does
    not exist, XPVM just starts PVM on the local host (or attaches to the existing
    PVM). In typical use, the hostfile .xpvm_hosts contains a list of hosts prepended
    with an &. These hostnames then get added to the Hosts menu for addition and deletion
    from the virtual machine by clicking on them.


    The top row of buttons performs console-like functions. The Hosts button displays
    a menu of hosts. Clicking on a host toggles whether it is added or deleted from
    the virtual machine. At the bottom of the menu is an option for adding a host
    not listed. The Tasks button brings up a menu whose most used selection is spawn.
    Selecting spawn brings up a window where the executable name, spawn flags, starting
    place, number of copies to start, and so forth can be set. By default XPVM turns
    on tracing in all tasks (and their children) that are started inside XPVM. Clicking
    on Start in the spawn window starts the task, which will then appear in the Space-time
    view. The Reset button has a menu for resetting PVM (i.e., kill all PVM tasks)
    or resetting different parts of XPVM. The Quit button exits XPVM while leaving
