  img_proc: true
- pgno: 70
  md: '# ## 3.3 Motherboard


    The motherboard is a printed circuit board that contains most of the active electronic
    components of the PC node and their interconnection. The motherboard provides
    the logical and physical infrastructure for integrating the subsystems of the
    Beowulf PC node and determines the set of components that may be used. The motherboard
    defines the functionality of the node, the range of performance that can be exploited,
    the maximum capacities of its storage, and the number of subsystems that can be
    interconnected. With the exception of the microprocessor itself, the selection
    of the motherboard is the most important decision in determining the qualities
    of the PC node to be used as the building block of the Beowulf-class system. It
    is certainly the single most obvious piece of the Beowulf node other than the
    case or packaging in which it is enclosed.


    While the motherboard may not be the most interesting aspect of a computer, it
    is, in fact, a critical component. Assembling a Beowulf node primarily involves
    the insertion of modules into their respective interface sockets, plugging power
    and signal cables into their ports, and placing configuration jumpers across the
    designated posts. The troubleshooting of nonfunctioning systems begins with verification
    of these same elements associated with the motherboard.


    The purpose of the motherboard is to integrate all of the electronics of the node
    in a robust and configurable package. Sockets and connectors on the motherboard
    include the following:


    +   - Microprocessor(s)

    +   - Memory

    +   - Peripheral controllers on the PCI bus

    +   - AGP port

    +   - Floppy disk cables

    +   - EIDE cables for hard disk and CD-ROM

    +   - Power

    +   - Front panel LEDs, speakers, switches, etc.

    +   - External I/O for mouse, keyboard, joystick, serial line, USB, etc.


    Other chips on the motherboard provide


    +   - the system bus that links the processor(s) to memory,

    +   - the interface between the peripheral buses and the system bus, and

    +   - programmable read-only memory (PROM) containing the BIOS software.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The motherboard restricts as well as enables functionality. In selecting a
    motherboard as the basis for a Beowulf node, several requirements for its use
    should be considered, including


    +   * processor family,

    +   * processor clock speed,

    +   * number of processors,

    +   * memory capacity,

    +   * memory type,

    +   * disk interface,

    +   * required interface slots, and

    +   * number of interface buses (32- and 64-bit PCI).


    Currently the choice of processor is likely to be the Intel Pentium III, AMD Athlon,
    or the Compaq Alpha 21264B. More processors, including native 64-bit processors,
    will continue to be released. In most cases, a different motherboard is required
    for each choice. Clock speeds for processors of interest range from 733 MHz to
    almost 2 GHz, and the selected motherboard must support the desired speed. Motherboards
    containing multiple processors in symmetric multiprocessing configurations are
    available, adding to the diversity of choices. Nodes for compute intensive problems
    often require large memory capacity with high bandwidth. Motherboards have a limited
    number of memory slots, and memory modules have a maximum size. Together, these
    will determine the memory capacity of your system. Memory bandwidth is a product
    of the width and speed of the system memory bus.


    Several types of memory are available, including conventional DRAM, EDO RAM (extended
    data output RAM), SDRAM (synchronous DRAM), and RDRAM (Rambus DRAM). The choice
    of memory type depends on your application needs. While RDRAM currently provides
    the highest bandwidth, other types of memory, such as SDRAM and DDR SDRAM (double
    data rate SDRAM) can provide adequate bandwidth at a significantly reduced cost.
    The two disk interfaces in common use are EIDE and SCSI. Both are good with the
    former somewhat cheaper and the latter slightly faster under certain conditions.
    Most motherboards come with EIDE interfaces built in, and some include an SCSI
    interface as well, which can be convenient and cost effective if you choose to
    use SCSI. On the other hand, separate SCSI controllers may offer more flexibility
    and options. Motherboards have a fixed number of PCI slots, and it is important
    to select one with enough slots to meet your needs. This is rarely a consideration
    in Beowulf compute nodes but can become an issue in a system providing I/O services.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The memory system of a personal computer stores the data upon which the processor
    operates. We would like a memory system to be fast, cheap, and large, but available
    components can simultaneously deliver only two (any two) of the three. Modern
    memory systems use a hierarchy of components implemented with different technologies
    that together, under favorable conditions, achieve all three. When purchasing
    a computer system, you must select the size and type of memory to be used. This
    section provides some background to help with that choice.


    # 3.4.1  Memory Capacity


    Along with processor speed, memory capacity has grown at a phenomenal rate, quadrupling
    in size approximately every three years. Prices for RAM have continued to decline
    and now are about ten cents per megabyte (a little more for higher-speed/capacity
    SDRAMs). A general principle is that faster processors require more memory. With
    increasingly sophisticated and demanding operating systems, user interfaces, and
    advanced applications such as multimedia, there is demand for ever-increasing
    memory capacity. As a result of both demand and availability, the size of memory
    in Beowulf-class systems has progressively expanded. Today, a typical Beowulf
    requires at least 256MBbytes of main memory, and this can be expected to grow
    to 2 GBytes within the next two to three years.


    # 3.4.2  Memory Speed


    In addition to the capacity of memory, the memory speed can significantly affect
    the overall behavior and performance of a Beowulf node. Speed may be judged by
    the latency of memory access time and the throughput of data provided per unit
    time. While capacities have steadily increased, access times have progressed only
    slowly. However, new modes of interfacing memory technology to the processor managed
    system bus have significantly increased overall throughput of memory systems.
    This increase is due to the fact that the memory bandwidth internal to the memory
    chip is far greater than that delivered to the system bus at its pins. Significant
    advances in delivering these internal acquired bits to the system bus in rapid
    succession have been manifest in such memory types as ED0-DRAM, SDRAM, and Rambus
    DRAM. Further improvement to the apparent performance of the entire memory system
    as viewed by the processor comes from mixing small memories of fast technology
    with high-capacity memory of slower technology.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# ### 3.4.3 Memory Types


    Semiconductor memory is available in two fundamental types. Static random access
    memory (SRAM) is high speed but moderate density, while dynamic random access
    memory (DRAM) provides high-density storage but operates more slowly. Each plays
    an important role in the memory system of the Beowulf node.


    SRAM is implemented from bit cells fabricated as a multitransistor flipflop circuits.
    These active circuits can switch state and be accessed quickly. They are not as
    high density as are DRAMs and consume substantially more power. They are reserved
    for those parts of the system principally requiring high speed and are employed
    regularly in L1 and L2 caches. Current-generation processors usually include SRAMs
    directly on the processor chip. L2 caches may be installed on the motherboard
    of the system or included as part of the processor module.


    Earlier SRAM was asynchronous (ASRAM) and provided access times of between 12
    and 20 nanoseconds. Motherboards operating up to 66 MHz or better use synchronous
    burst SRAM (BSRAM) providing access times on the order of ten nanoseconds.


    DRAM is implemented from bit cells fabricated as a capacitor and a single by-pass
    transistor. The capacitor stores a charge passively. The associated switching
    transistor deposits the state of the capacitor''s charge on the chip''s internal
    memory bus when the cell is addressed. Unlike SRAM, reading a DRAM cell is destructive,
    so after a bit is accessed, the charged state had to be restored by recharging
    the capacitor to its former condition. As a consequence, DRAM can have a shorter
    access time (the time taken to read a cell) than cycle time (the time until the
    same cell may be accessed again). Also, isolation of the cell''s storage capacitor
    is imperfect and the charge leaks away, requiring it to be refreshed (rewritten)
    every few milliseconds. Finally, because the capacitor is a passive, nonamplifying
    device, it takes longer to access a DRAM than an SRAM cell. However, the benefits
    are substantial. DRAM density can exceed ten times that of SRAM, and its power
    consumption is much lower. Also, new techniques for moving data from the DRAM
    internal memory row buffers to the system bus have narrowed the gap in terms of
    memory bandwidth between DRAM and SRAM. As a result, main memory for all Beowulf
    nodes is provided by DRAM in any one of its many forms.


    Of the many forms of DRAM, the two most likely to be encountered in Beowulf nodes
    are EDO DRAM and SDRAM. Both are intended to increase memory throughput. EDO DRAM
    provides a modified internal buffering scheme that maintains data at the output
    pins longer than conventional DRAM, improving memory'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'data transfer rates. While many current motherboards support EDO DRAM, the
    higher-speed systems likely to be used as Beowulf nodes in the immediate future
    will employ SDRAM instead. SDRAM is a significant advance in memory interface
    design. It supports a pipeline burst mode that permits a second access cycle to
    begin before the previous one has completed. While one cycle is putting output
    data on the bus, the address for the next access cycle is simultaneously applied
    to the memory. Effective access speeds of 10 nanoseconds can be achieved with
    systems using a 100MHz systems bus; such memory is labeled PC100 SDRAM. Faster
    versions are available, including PC133 SDRAM.


    Other, even higher-performance forms of DRAM memory are appearing. Two of the
    most important are Rambus DRAM and DDR SDRAM. These may be described as “PC1600”
    or “PC2100” memory. These are not 16 or 21 times as fast as PC100; in these cases,
    the number refers to the peak transfer rate (in Mbps) rather than the system bus
    clock speed. It is important to match both the memory type (e.g., SDRAM or RDRAM)
    and the system bus speed (e.g., PC133) to the motherboard.


    # 3.4.4 Memory Hierarchy and Caches


    The modern memory system is a hierarchy of memory types. Figure 3.2 shows a typical
    memory hierarchy. Near the processor at the top of the memory system are the high-speed
    Level-1 (L1) caches. Usually a separate cache is used for data and instructions
    for high bandwidth to load both data and instructions into the processor on the
    same cycle. The principal requirement is to deliver the data and instruction words
    needed for processing on every processor cycle. These memories run fast and hot,
    are relatively expensive, and now often incorporated directly on the processor
    chip. For these reasons, they tend to be very small, with a typical size of 16
    KBytes. Because L1 caches are so small and the main memory requires long access
    times, modern architectures usually include a second-level (L2) cache to hold
    both data and instructions. Access time to acquire a block of L2 data may take
    several processor cycles. A typical L2 cache size is 256 KBytes. Some systems
    add large external caches (either L2 or L3) with sizes of up to 8 MBytes.


    Cache memory is usually implemented in SRAM technology, which is fast (a few nanoseconds)
    but relatively low density. Only when a datum required by the processor is not
    in cache does the processor directly access the main memory. Main memory is implemented
    in one of the DRAM technologies. Beowulf nodes will often include between 256
    MBytes and 512 MBytes of SDRAM memory.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_75_0.png)


    **Figure 3.2**

    A node memory hierarchy with sizes typical of Beowulf nodes in 2001.


    # #### 3.4.5 Package Styles


    The packaging of memory has evolved along with the personal computers in which
    they were installed and has converged on a few industrywide standards. Dual Inline
    Memory Modules (DIMMs) are the primary means of packaging DRAMs, and most modern
    motherboards use one or more of these forms. The most common form factors are
    168-pin and 184-pin DIMMs.


    # ## 3.5 BIOS


    Even with effective industrywide standardization, hardware components will differ
    in detail. In order to avoid the necessity of customizing a different operating
    sys- tem for each new hardware system, a set of low-level service routines is
    provided, incorporated into read-only memory on the motherboard. This basic I/O
    system'
  merge: -1
  img_proc: true
- pgno: 76
  md: '(BIOS) software is a logical interface to the hardware, giving a layer of abstrac-\ntion
    that facilitates and makes robust higher-level support software. Besides the\nsystem
    BIOS that is hardwired to the motherboard, additional BIOS ROMs may\nbe provided
    with specific hardware peripherals. These include the video BIOS, the\ndrive controller
    BIOS, the network interface controller BIOS, and the SCSI drive\ncontroller BIOS.
    The BIOS contains a large number of small routines organized in\nthree groups:
    startup or POST (for power-on self-test), setup, and system services.


    The POST startup BIOS routines manage initialization activities, including run-\nning
    diagnostics, setting up the motherboard chip set, organizing scratchpad mem-\nory
    for the BIOS data area (BDA), identifying optional equipment and their re-\nspective
    BIOS ROMs, and then bootstrapping the operating system. The CMOS\n(complementary
    metal oxide semiconductor) setup routine provides access to the\nsystem configuration
    information, which is stored in a small CMOS RAM. The\nsystem services routines
    are called through interrupts directly from hardware on\nthe motherboard, from
    the processor itself, or from software. They allow access\nto low-level services
    provided by the system including the CPU, memory, moth-\erboard chip set, integrated
    drive electronics, PCI, USB, boot drives, plug-n-play\ncapability, and power control
    interfaces.


    # 3.6 Secondary Storage


    With the exception of the BIOS ROM, all information in memory is lost during\npower
    cycling except for that provided by a set of external (to the motherboard)\ndevices
    that fall under the category of secondary storage. Of these, disk drives,\nfloppy
    drives, and CD-ROM drives are most frequently found on Beowulf nodes.\nDisk and
    floppy drives are spinning magnetic media, while CD-ROM drives (which\nare also
    spinning media) use optical storage to hold approximately 650 MB yes\nof data.
    The newer DVD technology is replacing CD-ROMs with greater storage\ncapacity.
    Besides persistence of storage, secondary storage is characterized by very\nhigh
    capacity and low cost per bit. While DRAM may be purchased at about ten\ncents
    per megabyte, disk storage costs less than half a cent per megabyte, and the\nprice
    continues to fall. For the particular case of Beowulf, these three modes of\nsecondary
    storage play very different roles.


    CD-ROMs provide an easy means of installing large software systems but are\nused
    for little else. Even for this purpose, only one or two nodes in a system are\nlikely
    to include a CD-ROM drive because installation of software on most of the\nnodes
    is performed over the system area network.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Floppy discs are fragile and slow and don’t hold very much data (about 1.44
    MBytes). They would be useless except that they were the primary means of persistent
    storage on early PCs, and PC designers have maintained backward compatibility
    that allows systems to boot from a program located on floppy disk. Occasionally,
    something goes terribly wrong with a node (due either to human or to system error),
    and it is necessary to restore the system from scratch. A floppy drive and an
    appropriate “boot floppy” can make this a quick, painless, and trouble-free procedure.
    Although other means of recovery are possible, the small price of about $15 per
    node for a floppy drive is well worth the investment.


    The hard drive serves three primary purposes. It maintains copies of system wide
    programs and data so that these do not have to be repeatedly acquired over the
    network. It provides a large buffer space to hold very large application datasets.
    And it provides storage space for demand paging as part of the virtual memory
    management system. When the user or system memory demands exceed the available
    primary memory, page blocks can be automatically migrated to hard disk, making
    room in memory for other information to be stored.


    Between the hard disk drive and the motherboard are two dominant interface types:
    EIDE and SCSI. The earlier IDE interface evolved from the PC industry, while SCSI
    was a product of the workstation and server industry. Today, both are available.
    In the past, SCSI performance and cost were both significantly greater than those
    of IDE. The EIDE standard closed the performance gap a few years ago, but the
    price difference still exists. Perhaps equally important is that many motherboards
    now include EIDE interfaces as integral components so that no separate control
    card is required to be purchased or to take up a PCI socket. SCSI drive capacities
    can run a little higher than IDE drives, a factor that may be important for some
    installations. Several different SCSI standards exist, including Wide, Ultra/Wide,
    SCSI-2, and SCSI-3. Systems are usually downwards compatible, but it is safest
    to match the drive’s capabilities with that of your SCSI controller. Beowulf-class
    systems have been implemented with both types, and your needs or preferences should
    dictate your choice. (We have continued to rely on EIDE drives because of their
    lower cost.)


    The primary performance characteristic of a hard drive is its capacity. EIDE hard
    drives with 80 GByte capacities are available for under $300, and 40 GByte drives
    cost around $100. Also of interest is the rotation speed, measured in revolutions
    per minute, which governs how quickly data can be accessed. The fastest rotation
    speeds are found on SCSI drives, and are now around 15000 rpm and deliver transfer
    rates in excess of 50 MBytes per second.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# **3.7 PCI Bus**


    While the PC motherboard determines many of the attributes of the PC node, it
    also provides a means for user-defined configuration through the Peripheral Component
    Interconnect. This interface is incorporated as part of virtually every modern
    motherboard, providing a widely recognized standard for designing separate functional
    units. PCI is replacing the ISA and EISA buses as the principal means of adding
    peripherals to personal computers.


    The PCI standard permits rapid data transfer of 132 MBytes per second peak using
    a 33 MHz clock and 32-bit data path. A 64-bit extension is defined, enabling peak
    throughput of 264 MBytes per second when used. A extension with a bus clock rate
    of 66 MHz provides a peak transfer bandwidth of 528 MBytes per second. A new version,
    PCI-X, is expected toward the end of 2001.


    The PCI bus permits direct interconnection between any pair of PCI devices, between
    a PCI device and the system memory, or between the system processor and the PCI
    devices. PCI supports multiple bus masters, allowing any PCI device to take ownership
    of the bus and permitting (among other things) direct memory access transfers
    without processor intervention. Arbitration among the pending PCI masters for
    the next transfer action can be overlapped with the current PCI bus operation,
    thereby hiding the arbitration latency and ensuring high sustained bus throughput.


    High throughput is enabled by a process called linear burst transfer. A block
    of data being sent from one device to another on the PCI bus is moved without
    having to send the address of each word of data. Instead, the length of the block
    is specified along with the initial address of the location where the block is
    to be moved. Each time a word is received, the accepting unit increments a local
    address register in preparation for the next word of the block. PCI bus transfers
    can be conducted concurrently with operation of the processor and its system bus
    to avoid processor delays caused by PCI operation.


    Although bus loading limits the number of PCI sockets to three or four, each connected
    board can logically represent as many as eight separate PCI functions for a total
    of 32. Up to 256 PCI buses can be incorporated into one system, although rarely
    are more than two present.


    The PCI standard includes complete bit-level specification of configuration registers.
    This makes possible the automatic configuration of connected peripheral devices
    for plug-n-play reconfigurability.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# **3.8 Example of a Beowulf Node**


    The majority of Beowulfs (over five generations of systems in the past seven years)
    have employed microprocessors from Intel or AMD. This is because they have been
    among the least expensive systems to build, the system architectures are open
    providing a wealth of component choices, and the Linux operating system was first
    available on them. While not the fastest processors in peak performance, their
    overall capability has been good, and their price/performance ratios are excellent.
    The most recent microprocessors in this family and their motherboards support
    clock speeds of over 1 GHz.


    The following table shows a snapshot of current costs for an AMD Athlon-based
    node and illustrates the amazing value of commodity components. These prices were
    taken from a variety of sources, including online retailers and Web pages about
    recent Beowulf clusters. We note that, as discussed earlier, a CD-ROM is not included
    in the list because it is assumed that system installation will be performed over
    the network. A floppy drive is included to facilitate initial installation and
    crash recovery. Moreover, since the BIOS requires a video card to boot, a very
    inexpensive one is included on every system.


    Many other choices exist, of course, and the products of other vendors in many
    cases are as worthy of consideration as the ones listed here.


    |

    | Processor | AMD Athlon 1GHz | $102 |

    | Processor Fan |  | $8.50 |

    | Motherboard | Generic | $117.50 |

    | Memory | 512 MB PC100 SDRAM | $74 |

    | Hard Disk | 40GB | $141 |

    | Floppy Disk | Sony 1.44MB | $13.50 |

    | Network Interface Controller | 100Mb/s Ethernet | $16.50 |

    | Video Card | Generic VGA | $25 |

    | Package | Generic tower case with power supply and cables | $58 |

    | Total |  | $556 |


    # **3.9 Boxes, Shelves, Piles, and Racks**


    A review of Beowulf hardware would be incomplete without some mention of the technology
    used to physically support (i.e., keep it off the floor) a Beowulf system. Packaging
    is an important engineering domain that can significantly influence the cost and
    practical aspects of Beowulf implementation and operation. Packaging'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'of Beowulfs has taken two paths: the minimalist "lots of boxes on shelves"
    strat-egy, captured so well by the acronym of the NIH LOBOS system, and the "looks
    count" strategy, adopted by several projects including the Hive system at NASA
    Goddard Space Flight Center and the Japanese Real World Computing Initiative.
    The minimalist approach was driven by more than laziness. It is certainly the
    most economical approach and is remarkably reliable as well. This is due to the
    same economies of scale that enable the other low-cost, high-reliability subsystems
    in Beowulf. In the minimalist approach, individual nodes are packaged in exactly
    the same "towers" that are found deskside in homes and offices. These towers in-corporate
    power supplies, fan cooling, and cabling and cost less than a hundred dollars.
    Towers provide uniform configuration, standardized interface cabling, ef-fective
    cooling, and a structurally robust component mounting framework but are flexible
    enough to support a variety of internal node configurations. Industrial-grade
    shelving, usually of steel framework and particle board shelves, is strong, readily
    available, easily assembled, and inexpensive. It is also flexible, extensible,
    and easily reconfigured. You can find it at your nearest home and garden center.


    When assembling such a system, care should be taken to design tidy power distribution
    and networking wire runs. Extension cords and power strips work fine but should
    be physically attached to the shelving with screws or wire-ties so that the system
    does not become an unmaintainable mess. Similar considerations apply to the Ethernet
    cables. Labeling cables so the ends can be identified without laboriously tracing
    the entire run can save hours of headache.


    Different approaches are possible for video and keyboard cables. In our systems,
    most nodes do not have dedicated keyboard and video cables. Instead, we manually
    attach cables to nodes in the very rare circumstances when necessary maintenance
    cannot be carried out remotely.


    Rack mounting is considerably more expensive but offers the possibility of much
    higher physical densities. New motherboards with rack-mountable form factors that
    incorporate a Fast Ethernet controller, SCSI controller, and video controller
    offer the possibility of building Beowulf nodes that can be packaged very tightly
    because they don''t require additional daughter cards. These systems probably
    will be important in the future, as larger Beowulf systems are deployed and machine
    room space becomes a major consideration.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "# 3.10  Node Assembly\n\nWe conclude this chapter with a checklist for building\
    \ a Beowulf node.  Building Beowulf nodes from component parts may not be the\
    \ right choice for everyone. Some will feel more comfortable with systems purchased\
    \ from a system integrator, or they simply won't have the manpower or space for\
    \ in-house assembly.  Nevertheless, the cost shouldn't be overlooked; a node can\
    \ be several hundred dollars. You should carefully weigh the luxury of having\
    \ someone else wield the screwdriver vs. owning 25 percent more computer power.\
    \ Keep in mind that cables often come loose in shipping, and there is no guarantee\
    \ that the preassembled system will not require as much or more on-site troubleshooting\
    \ as the homemade system.\n\nAlthough targeted to the reader who is building a\
    \ Beowulf node from parts, this checklist will also be useful to those who purchase\
    \ preassembled systems.  Over the lifetime of the Beowulf system, technology advances\
    \ will probably motivate upgrades in such things as memory capacity, disk storage,\
    \ or improved networking. There is also the unavoidable problem of occasional\
    \ maintenance.  Yes, once in a while, something breaks.  Usually it is a fan,\
    \ a memory module, a power supply, or a disk drive, in that order of likelihood.\
    \ More often than not, such a break will occur in the first few weeks of operation.\
    \ With hundreds of operational nodes in a large Beowulf, some parts replacement\
    \ will be required.  The checklist below will get you started if you decide to\
    \ replace parts of a malfunctioning node.\n\nTo many, the list below will appear\
    \ obvious, but, in fact, experience has shown that a comprehensive list of steps\
    \ is not only convenient but likely to simplify the task and aid in getting a\
    \ system working the first time.  Many sites have put together such procedures,\
    \ and we offer the one used at Caltech as a helpful example.\n\nBefore you initiate\
    \ the actual assembly, it helps to get organized. Five minutes of preparation\
    \ can save half an hour during the process.  If you're assembling a Beowulf, you\
    \ will probably build more than one unit at one time, and the preparation phase\
    \ is amortized over the number of units built.\n\n+   * Collect and organize the\
    \ small set of tools you will be using:\n+   \t* #2 Phillips head screwdriver\n\
    +   \t* Antistatic wrist strap\n+   \t* Antistatic mat on which to place assembly\n\
    +   \t* Needle-nose pliers\n+   \t* 1/8-inch blade flat blade screwdriver\n+ \
    \  \t* Small high-intensity flashlight"
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   * Organize all parts to be assembled. If more than one unit is to be built,
    collect like parts together *fin-style*.

    +   * Provide sufficient flat space for assembly, including room for keyboard,
    mouse, and monitor used for initial check-out.

    +   * Work in a well-lighted environment.

    +   * Follow the same order of tasks in assembling all units; routine leads to
    reliability.

    +   * Have a checklist, like this one, handy, even if it is used only as a reference.

    +   * When first opening a case, collect screws and other small items in separate
    containers.

    +   * Keep food and drink on another table to avoid the inevitable accident.


    After you have done one or two systems, the process becomes much quicker. We find
    that we can assemble nodes in well under an hour once we become familiar with
    the idiosyncrasies of any particular configuration.


    Many of the instructions below may not apply in every case. Included are directions
    for such subassemblies as monitors, keyboards, and sound cards that rarely show
    up in the majority of Beowulf nodes. Usually, however, at least one such node
    is more heavily equipped to support user interface, operations support, and external
    connections for the rest of the system.


    In a number of cases, the specific action is highly dependent on the subsystems
    being included. Only the documentation for that unit can describe exactly what
    actions are to be performed. For example, every motherboard will have a different
    set and positioning of jumpers, although many of the modern boards are reducing
    or almost eliminating these. In these instances, all we can say is: “do the right
    thing,” but we still indicate in general terms the class of action to take place.


    # 3.10.1 Motherboard Preassembly


    +   * Set every jumper on the motherboard properly.

    +   * Look through your motherboard manual and verify every setting, since the
    default may not work for your CPU, memory, or cache configuration.

    +   * Locate every jumper and connector: floppy, hard drive, PS/2, COM port, LPT
    port, sound connectors, speaker connector, hard disk LED, power LED, reset switch,
    keyboard lock switch, and so forth.


    +   * Install the CPU.

    +     * Processors are designed so that they can only be inserted correctly. Don’t
    force.

    +     * Whatever the chip, match the notched corner of the CPU with the notched
    corner of the socket.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   When using a ZIF socket, lift the handle 90 degrees, insert the CPU, and
    then return the handle back to its locked position.


    +   Install the memory.


    +   Main memory DIMM. Note pin 1 on the DIMM, and find the pin 1 mark on the motherboard.
    It is difficult to install 164-pin DIMMs incorrectly, but it is possible. Begin
    by placing the DIMM at a 45 degree angle to the socket of bank 0. The DIMM will
    be angled toward the rest of the DIMM sockets (and away from any DIMMs previously
    installed). Insert the DIMM firmly into the socket; then rotate the DIMM until
    it sits perpendicular to the motherboard and the two clips on each edge have snapped
    around the little circuit board. There may or may not be a “snap,” but you should
    verify that the two clips are holding the DIMM fast and that it doesn’t jiggle
    in the socket. Repeat this until you fill one, two, or more banks.


    +   Cache memory (if so equipped). Some older units may have L2 caches on the
    motherboard, while newer processors include them within the processor module.
    Cache memory may be DIMM or SIMM; in any case, install it now.


    # 3.10.2 The Case


    +   Open the case, remove all the internal drive bays, and locate all the connectors:
    speaker, hard disk LED, power LED, reset switch, keyboard lock switch, mother
    board power, peripheral power, and so forth.


    +   Mount the motherboard in the case.


    +   ATX-style cases use only screws to mount the motherboard, and it is very straightforward.


    +   Plug in the keyboard, and see whether it fits.


    +   Plug in an adapter card, and see whether it fits.


    +   Start connecting the case cables to the motherboard.


    +   Pull out floppy cables, hard disk cables, PS/2 mouse cable, and lights. Line
    up each pin 1 to the red side of cables.


    +   Install the speaker. It usually is a 4-pin connector with two wires (one red,
    one black, which can be installed either way on the motherboard).


    +   If your case has holes for COM ports and LPT ports, punch these out, and save
    a card slot by unscrewing the connectors that came on the slot-filler strip of
    metal, removing the connector, and mounting it directly on the case.


    +   Attach power cables to the motherboard.


    +   ATX-style cases have only one power connector, which is keyed to only fit
    one way.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   *   The AT-style power connector comes in two pieces and must be connected
    properly. The black wires *must be placed together* when they are plugged into
    the motherboard.

    +   *   Ensure that the CPU cooling fan is connected to the power supply. This
    is usually a 4-pin male connector that goes to one of the power supply connectors.


    # ### 3.10.3  Minimal Peripherals


    +   *   Floppy disk drive

    +   *   Mechanical

    +   *   It may be necessary to reinstall the floppy mounting bay (if it was taken
    out previously).

    +   *   The floppy drive must protrude from the front of the case. Take off one
    of the 3.5 inch plastic filler panels from the front of the case. Then slide the
    floppy drive in from the front until the front of the drive is flush with the
    front of the case. Using two small screws that are supplied with the case, attach
    the floppy drive’s left side. If the floppy drive bay is detachable, remove the
    bay with the floppy half installed, and with the drive bay out, install the screws
    for the right side.

    +   *   If the drive bay is going to contain hard disks in addition to floppy
    drives, leave the drive bay out for now, and go to the hard disk installation
    section before putting the drive bay back into the case.

    +   *   Electrical

    +   *   The floppy disk needs two connections: one to the power supply, and one
    to the motherboard or floppy controller. The power supply connector is shaped
    to prevent you from getting it backwards.

    +   *   Some floppy power connectors are smaller than the standard connector,
    and most power supplies come with one of these plugs. These connectors can be
    installed in only one way.

    +   *   For data, a flat ribbon cable is needed. It is gray with 34 conductors
    and a red stripe to indicate pin 1. One end of the cable will usually have a twist
    in it. The twisted portion connects to a second floppy drive (drive B). The end
    farthest from the twist connects to the motherboard or floppy controller.

    +   *   VGA card installation

    +   *   If the motherboard has an integrated video adapter, skip the next step.

    +   *   Plug the VGA card into the appropriate slot, depending on the type of
    card purchased (PCI slot for a PCI card, ISA slot for an ISA card).

    +   *   Screw the top of the metal bracket that is attached to the adapter into
    the case, using one of the screws supplied with the case.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   * Monitor

    +       * Plug the monitor into a wall power outlet.

    +       * Plug the video input plug, which is a 15-pin connector, into the back
    of the video card.


    # 3.10.4 Booting the System


    Setup involves configuring the motherboard''s components, peripherals, and controllers.
    The setup program is usually in ROM and can be run by pressing a certain key during
    POST. Check the CMOS settings using the setup program before booting for the first
    time. If you make changes, you will need to exit setup and save changes to CMOS
    for them to take effect. You will be able to change the date and time kept by
    the real time clock. Memory configuration such as shadow RAM and read/write wait
    states can be changed from their defaults. IDE hard disks can be detected and
    configured. Boot sequence and floppy drives can be configured and swapped. PCI
    cards and even ISA cards can be configured, and plug-n-play disabled (which should
    be done if running a non-Windows operating system). ISA bus speed can be changed
    and ports can be enabled or disabled.


    IDE disks are almost always configured as auto detect or user-defined type. Use
    shadow video unless you have problems. Shadow the ROM of your network interface
    card (NIC) or SCSI card for better speed. For better speed and if you have EDO
    memory, you can usually use the most aggressive memory settings—just try it out
    before you stick with it to avoid corrupting data files.


    Minimum requirements for booting the system are as follows:


    +   * A bootable floppy disk

    +   * Motherboard with CPU and memory installed

    +   * Video card on the motherboard

    +   * Floppy drive with one cable connected to it and power to it

    +   * Monitor plugged into the wall and the video card

    +   * Keyboard attached


    To boot the system, proceed as follows:


    +   * Making sure that the power switch is off, attach a power cord from the case
    to the wall.

    +   * Turn on the monitor.

    +   * Turn on the power to the PC, and get ready to shut it off if you see, hear,
    or smell any problems.

    +   * Look for signs that all is working properly:'
  merge: -1
  img_proc: true
- pgno: 86
  md: '+   * The speaker may make clicks or beeps.

    +   * The monitor should fire up and show something.

    +   * Make sure all of the memory counts.

    +   * The floppy drive light should come on one time during POST.


    To set up the system, proceed as follows:


    +   * Enter setup by hitting the appropriate key (delete, F1, F10, Esc, or whatever
    the motherboard manual specifies), and check the CMOS settings.

    +   * Change the CMOS settings, and see whether the computer will remember them.

    +   * Update the date and time.

    +   * View every setup screen, and look at each of the settings.

    +   * Make sure the first boot device is set to be the floppy drive.

    +   * If you have EDO RAM, optimize the memory settings (if you wish) or make
    any other changes you see fit.

    +   * Save your changes and reboot; rerun setup, and make sure the updates were
    made.

    +   * Save any changes after the rerun. Make sure the bootable floppys are in
    the drive, and let it try to boot from the floppy. If it does not boot, or there
    is some error message—or nothing—on the screen, go to the troubleshooting section
    (Section 3.10.6).


    # 3.10.5 Installing the Other Components


    If your PC boots and runs setup, you’re almost done. Now you can install all of
    the other components. First, unplug your PC and wait a few minutes. You should
    begin to mount the drives if you have not already done so.


    # IDE Hard disk installation


    +   * Mechanical. This is similar to the floppy installation above, with the exception
    that the drive will not be visible from outside of the case.

    +   * Electrical

    +       * Most motherboard BIOS systems today can read the IDE drive’s specifications
    and automatically configure them. If it does not, you will have to get the drive’s
    parameters (usually written on the drive), which include number of cylinders,
    number of heads, and number of sectors per track, and enter them in the drive
    parameter table in the CMOS setup.

    +       * A ribbon cable and power connector attach to each hard disk. The power
    cable has four wires in it and is keyed so it cannot be installed incorrectly.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   *   The documentation that came with the hard disk indicates how the jumpers
    are set, if you are installing one disk and no other IDE device, the jumpers can
    usually be removed. If you are installing more than one disk, decide which disk
    will be booted. The boot disk should go on the primary hard disk controller. Move
    the jumper(s) on the hard disk to make it a MASTER or PRIMARY. Many newer hard
    disks will use pins labeled MA, SL, and CS; you will jumper the MA pins. The second
    hard disk or CD-ROM will be configured as a SLAVE or SECONDARY drive. You will
    jumper the SL pins on this device. Use your drive’s manual or call the manufacturer’s
    800 number for proper jumper settings. If the CD-ROM drive will be alone on its
    own controller, follow the manufacturer’s directions (usually it is okay to jumper
    it as a slave). Once jumpered properly, the drives can be connected with the 18-inch
    40-pin ribbon cables and powered up. Pin 1 usually goes next to the power connector.


    # SCSI hard disk installation


    +   *   Mechanical. Follow the floppy installation above, with the exception that
    the drive will not be visible from outside of the case.

    +   *   Electrical


    +   *   Unless the motherboard has the SCSI controller built in, the BIOS will
    not read a SCSI drive, and the drive table should be set up with “not installed.”

    +   *   A ribbon cable and power connector attach to each hard disk. The power
    cable has four wires in it and is keyed so it cannot be installed incorrectly.
    The other end of the ribbon cable plugs into the SCSI controller itself.

    +   *   The documentation that came with the hard disk explains how the jumpers
    are set. If you are installing one disk and no other SCSI devices, the jumpers
    can usually be removed so that the disk will be set to ID 0. Each SCSI device
    on the chain (ribbon cable) must have its own unique ID number, usually 0 through
    7, with 7 being reserved for the controller itself.

    +   *   The last physical device on the cable has to be terminated, depending
    on the device, either with a jumper or with some type of resistor networks that
    are plugged in. This is very important.


    # NIC installation


    +   *   This is similar to the VGA card installation described previously. If
    any jumpers are to be set, do that now, and write the settings down. Read the
    installation manual that came with the card.


    # Sound card installation'
  merge: -1
  img_proc: true
- pgno: 88
  md: "+   * See NIC installation above. If you are setting jumpers, make sure you\
    \ don’t set two cards to the same resource (interrupt request, direct memory access,\
    \ or port address). Keep all settings distinct.\n\nAt this point, you are ready\
    \ to begin installing the operating system. Don’t forget to connect the mouse\
    \ and external speakers and to make a network hookup, if you have these options\
    \ installed.\n\n# ## 3.10.6  Troubleshooting\n\nEach time you boot, you should\
    \ connect at least the following four components to your PC:\n\n+   * Speaker\
    \  \n+   * Keyboard  \n+   * Floppy drive  \n+   * Monitor\n\nWhat should a normal\
    \ boot look and sound like?\n\n+   * First, LEDs will illuminate everywhere—the\
    \ motherboard, the hard disks, the floppy drive, the case, the NIC, the printer,\
    \ the CD-ROM, the speakers, the monitor, and the keyboard.  \n+   * The hard disks\
    \ usually spin up, although some disks, especially SCSI, may wait for a cue from\
    \ the controller or may simply wait a fixed amount of time to begin spinning to\
    \ prevent a large power surge during boot.  \n+   * The P/S and CPU fans will\
    \ start to spin.  \n+   * The first thing displayed on the monitor usually will\
    \ be either memory counting or a video card BIOS display.  \n+   * During the\
    \ memory count, the PC speaker may click.  \n+   * When the memory is done counting,\
    \ the floppy disk often screeches as its LED comes on (called floppy seek).  \n\
    +   * The monitor may have messages from the BIOS, including BIOS version, number\
    \ of CPUs, a password prompt, and nonfatal error messages.  \n+   * The last part\
    \ of the power-on self-test is often a chart that lists the components found during\
    \ POST, such as CPU and speed, VGA card, serial ports, LPT ports, IDE hard disks,\
    \ and floppy disks. If no system files are found, either on a bootable floppy\
    \ or hard disk, you may get a message from the BIOS saying, “Insert Boot disk\
    \ and press any key” or something similar. This is a nonfatal error, and you can\
    \ put a bootable floppy in the drive and press a key."
  merge: -1
  img_proc: true
- pgno: 89
  md: 'If the above happens, you will know that your motherboard is at least capable
    of running the ROM’s POST. The POST has many potential problems, most of which
    are nonfatal errors. Any consistent error, however, is a cause for concern. The
    fatal POST errors will normally generate no video, so you need to listen to the
    speaker and count beeps. The number of beeps and their length indicate codes for
    a technician to use in repairing the PC.


    At this point, the POST is done, and the boot begins. What should I do if there
    is no video or bad video during boot?


    +   - Check the monitor’s power and video connection.

    +   - Try reseating the video card or putting it in a new socket (turn off the
    system first!).

    +   - Make sure the speaker is connected, in case you are getting a fatal POST
    message that could have nothing to do with video.

    +   - Swap out the video card and/or the monitor.


    The two most notable and common POST messages are as follows:


    +   - HDD (or FDD) controller error. Usually this is a cabling issue, such as
    a reversed connector.

    +   - Disk drive 0 failure. You forgot power to the hard disk, or you’ve got the
    wrong drive set in CMOS (rerun setup). Also make sure the disk is properly connected
    to the controller.


    What about floppy problems?


    +   - If the light stays on continuously after boot, you probably have the connector
    on backwards.


    If you are still experiencing problems, try the following:


    +   - Check the cables or try someone else’s cables.

    +   - Recheck all the jumper settings on the motherboard.

    +   - Remove secondary cache, or disable it in setup. This can fix many problems.

    +   - Slow down the CPU; it may have been sold to you at the wrong speed.

    +   - Replace SIMMs with known working ones.

    +   - Replace the video card.

    +   - Remove unnecessary components such as extra RAM, sound card, mouse, modem,
    SCSI card, extra hard disks, tape drives, NIC, or other controller card.

    +   - Remove all hard disks, and try booting from floppy.

    +   - Remove the motherboard from the case, and run it on a piece of cardboard.
    This will fix a problem caused by a motherboard grounded to the case.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # 4 Windows 2000


    David Solomon


    This chapter introduces the architecture of the Windows 2000 operating system.
    Before delving into the internals of the system, let’s review the origin of the
    system and its various flavors.


    # ## 4.1 Introduction to Windows 2000


    Windows 2000 is actually the fifth version of the Windows NT-based operating system
    family. The original version, Windows NT 3.1, was released in 1993. From the initial
    announcement of Windows NT, Microsoft has always made it clear that this operating
    system was to be their single strategic operating system platform for the future.
    The next version, Windows XP, is the first NT-based release to be aimed not just
    at the business desktop and server market, but also at the consumer or home market.
    It replaces Windows 95, Windows 98, Windows Millennium Edition, and Windows 2000.


    NT stands for “new technology.” While NT represents a modern 32-bit operating
    system platform (and with Windows XP, a 64-bit version is available as well),
    it is not “new” when compared with most modern-day Unix systems. The core system
    calls and networking capabilities are quite similar.


    There are four editions of Windows 2000: Windows 2000 Professional, Windows 2000
    Server, Windows 2000 Advanced Server, and Windows 2000 Datacenter Server. These
    editions differ by


    +   - the number of processors supported,

    +   - the amount of physical memory supported,

    +   - the number of concurrent network connections supported, and

    +   - layered services that come with Server editions that don’t come with the
    Professional edition.


    These differences are summarized in Table 4.1.


    # ## 4.2 Operating System Model


    To provide a framework for understanding Windows 2000, let’s first review the
    requirements and goals that shaped the original design and specification of the'
