- pgno: 44
  md: '# # 2 An Overview of Cluster Computing


    Thomas Sterling


    Commodity cluster systems offer an alternative to the technical and commercial
    computing market for scalable computing systems for medium- and high-end computing
    capability. For many applications they replace previous-generation monolithic
    vector supercomputers and MPPs. By incorporating only components already developed
    for wider markets, they exploit the economy of scale not possible in the high-end
    computing market alone and circumvent significant development costs and lead times
    typical of earlier classes of high-end systems resulting in a price/performance
    advantage that may exceed an order of magnitude for many user workloads. In addition,
    users have greater flexibility of configuration, upgrade, and supplier, ensuring
    longevity of this class of distributed system and user confidence in their software
    investment. Beowulf-class systems exploit mass-market components such as PCs to
    deliver exceptional cost advantage with the widest space of choice for building
    systems. Beowulfs integrate widely available and easily accessible low-cost or
    no-cost system software to provide many of the capabilities required by a system
    environment. As a result of these attributes and the opportunities they imply,
    Beowulf-class clusters have penetrated almost every aspect of computing and are
    rapidly coming to dominate the medium to high end.


    Computing with a Beowulf cluster engages four distinct but interrelated areas
    of consideration:


    +   1. hardware system structure,

    +   2. resource administration and management environment,

    +   3. distributed programming libraries and tools, and

    +   4. parallel algorithms.


    Hardware system structure encompasses all aspects of the hardware node components
    and their capabilities, the dedicated network controllers and switches, and the
    interconnection topology that determines the system’s global organization. The
    resource management environment is the battery of system software and tools that
    govern all phases of system operation from installation, configuration, and initialization,
    through administration and task management, to system status monitoring, fault
    diagnosis, and maintenance. The distributed programming libraries and tools determine
    the paradigm by which the end user coordinates the distributed computing resources
    to execute simultaneously and cooperatively the many concurrent logical components
    constituting the parallel application program. Finally, the domain of parallel
    algorithms provides the models and approaches for organizing a'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'user''s application to exploit the intrinsic parallelism of the problem while
    operating within the practical constraints of effective performance.


    This chapter provides a brief and top-level overview of these four main domains
    that constitute Beowulf cluster computing. The objective is to provide sufficient
    context for you to understand any single part of the remaining book and how its
    contribution fits in to the broader form and function of commodity clusters.


    # **2.1**  A Taxonomy of Parallel Computing


    The goal of achieving performance through the exploitation of parallelism is as
    old as electronic digital computing itself, which emerged from the World War II
    era. Many different approaches and consequent paradigms and structures have been
    devised, with many commercial or experimental versions being implemented over
    the years. Few, however, have survived the harsh rigors of the data processing
    marketplace. Here we look briefly at many of these strategies, to better appreciate
    where commodity cluster computers and Beowulf systems fit and the tradeoffs and
    compromises they represent.


    A first-tier decomposition of the space of parallel computing architectures may
    be codified in terms of coupling: the typical latencies involved in performing
    and exploiting parallel operations. This may range from the most tightly coupled
    fine-grained systems of the systolic class, where the parallel algorithm is actually
    hard-wired into a special-purpose ultra-fine-grained hardware computer logic structure
    with latencies measured in the nanosecond range, to the other extreme, often referred
    to as distributed computing, which engages widely separated computing resources
    potentially across a continent or around the world and has latencies on the order
    of a hundred milliseconds. Thus the realm of parallel computing structures encompasses
    a range of $10^{8}$, when measured by degree of coupling and, by implication,
    granularity of parallelism. In the following list, the set of major classes in
    order of tightness of coupling is briefly described. We note that any such taxonomy
    is subjective, rarely orthogonal, and subject to debate. It is offered only as
    an illustration of the richness of choices and the general space into which cluster
    computing fits.


    +   *Systolic* computers are usually special-purpose hardwired implementations
    of fine-grained parallel algorithms exploiting one-, two-, or three-dimensional
    pipelining. Often used for real-time pottsensor processors, digital signal processing,
    image processing, and graphics generation, systolic computing is experiencing
    a revival through adaptive computing, exploiting the versatile FPGA (field programmable'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'gate array) technology that allows different systolic algorithms to be programmed
    into the same FPGA medium at different times.


    **Vector** computers exploit fine-grained vector operations through heavy pipelining
    of memory bank accesses and arithmetic logic unit (ALU) structure, hardware support
    for gather-scatter operations, and amortizing instruction fetch/execute cycle
    overhead over many basic operations within the vector operation. The basis for
    the original supercomputers (e.g., Cray), vector processing is still a formidable
    strategy in certain Japanese high end systems.


    **SIMD** (single instruction, multiple data) architecture exploits fine-grained
    data parallelism by having many (potentially thousands) or simple processors performing
    the same operation in lock step but on different data. A single control processor
    issues the global commands to all slaved compute processors simultaneously through
    a broadcast mechanism. Such systems (e.g., MasPar-2, CM-2) incorporated large
    communications networks to facilitate massive data movement across the system
    in a few cycles. No longer an active commercial area, SIMD structures continue
    to find special-purpose application for postserver processing.


    **Dataflow** models employed fine-grained asynchronous flow control that depended
    only on data precedence constraints, thus exploiting a greater degree of parallelism
    and providing a dynamic adaptive scheduling mechanism in response to resource
    loading. Because they suffered from severe overhead degradation, however, dataflow
    computers were never competitive and failed to find market presence. Nonetheless,
    many of the concepts reflected by the dataflow paradigm have had a strong influence
    on modern compiler analysis and optimization, reservation stations in out-of-order
    instruction completion ALU designs, and multithreaded architectures.


    **PIM** (processor-in-memory) architectures are only just emerging as a possible
    force in high-end system structures, merging memory (DRAM or SRAM) with processing
    logic on the same integrated circuit die to expose high on-chip memory bandwidth
    and low latency to memory for many data-oriented operations. Diverse structures
    are being pursued, including system on a chip, which places DRAM banks and a conventional
    processor core on the same chip; SMP on a chip, which places multiple conventional
    processor cores and a three-level coherent cache hierarchical structure on a single
    chip; and Smart Memory, which puts logic at the sense amps of the DRAM memory
    for in-place data manipulation. PIMs can be used as standalone systems, in arrays
    of like devices, or as a smart layer of a larger conventional multiprocessor.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'MPPs (massively parallel processors) constitute a broad class of multiprocessor
    architectures that exploit off-the-shelf microprocessors and memory chips in custom
    designs of node boards, memory hierarchies, and global system area networks. Ironically,
    “MPP” was first used in the context of SIMD rather than MIMD (multiple instruction,
    multiple data) machines. MPPs range from distributed-memory machines such as the
    Intel Paragon, through shared memory without coherent caches such as the BBN Butterfly
    and CRI T3E, to truly CC-NUMA (non-uniform memory access) such as the HP Exempler
    and the SGI Origin2000.


    **Clusters** are an ensemble of off-the-shelf computers integrated by an interconnection
    network and operating within a single administrative domain and usually within
    a single machine room. Commodity clusters employ commercially available networks
    (e.g., Ethernet, Myrinet) as opposed to custom networks (e.g., IBM SP-2). Beowulf-class
    clusters incorporate mass-market PC technology for their compute nodes to achieve
    the best price/performance.


    **Distributed** computing, once referred to as “metacomputing”, combines the processing
    capabilities of numerous, widely separated computer systems via the Internet.
    Whether accompanied by special arrangement among the participants, by means of
    disciplines referred to as Grid computing, or by agreements of myriad workstation
    and PC owners with some commercial (e.g., DSI, Entropia) or philanthropic (e.g.,
    SETI@home) coordinating host organization, this class of parallel computing exploits
    available cycles on existing computers and PCs, thereby getting something for
    almost nothing.


    In this book, we are interested in commodity clusters and, in particular, those
    employing PCs for best price/performance, specifically, Beowulf-class cluster
    systems. Commodity clusters may be subdivided into four classes, which are briefly
    discussed here.


    **Workstation clusters** — ensembles of workstations (e.g., Sun, SGI) integrated
    by a system area network. They tend to be vendor specific in hardware and software.
    While exhibiting superior price/performance over MPPs for many problems, there
    can be as much as a factor of 2.5 to 4 higher cost than comparable PC-based clusters.


    **Beowulf-class systems** — ensembles of PCs (e.g., Intel Pentium 4) integrated
    with commercial COTS local area networks (e.g., Fast Ethernet) or system area
    networks (e.g., Myrinet) and run widely available low-cost or no-cost software
    for'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'managing system resources and coordinating parallel execution. Such systems
    exhibit exceptional price/performance for many applications.


    **Cluster farms** — existing local area networks of PCs and workstations serving
    either as dedicated user stations or servers that, when idle, can be employed
    to perform pending work from outside users. Exploiting job stream parallelism,
    software systems (e.g., Condor) have been devised to distribute queued work while
    precluding intrusion on user resources when required. These systems are of lower
    performance and effectiveness because of the shared network integrating the resources,
    as opposed to the dedicated networks incorporated by workstation clusters and
    Beowulfs.


    **Superclusters** — clusters of clusters, still within a local area such as a
    shared machine room or in separate buildings on the same industrial or academic
    campus, usually integrated by the institution’s infrastructure backbone wide area
    network. Although usually within the same internet domain, the clusters may be
    under separate ownership and administrative responsibilities. Nonetheless, organizations
    are striving to determine ways to enjoy the potential opportunities of partnering
    multiple local clusters to realize very large scale computing at least part of
    the time.


    # 2.2 Hardware System Structure


    The most visible and discussed aspects of cluster computing systems are their
    physical components and organization. These deliver the raw capabilities of the
    system, take up considerable room on the machine room floor, and yield their excellent
    price/performance. The two principal subsystems of a Beowulf cluster are its constituent
    compute nodes and its interconnection network that integrates the nodes into a
    single system. These are discussed briefly below.


    # 2.2.1 Beowulf Compute Nodes


    The compute or processing nodes incorporate all hardware devices and mechanisms
    responsible for program execution, including performing the basic operations,
    holding the working data, providing persistent storage, and enabling external
    communications of intermediate results and user command interface. Five key components
    make up the compute node of a Beowulf cluster: the microprocessor, main memory,
    the motherboard, secondary storage, and packaging.


    The *microprocessor* provides the computing power of the node with its peak performance
    measured in Mips (millions of instructions per second) and Mflops'
  merge: -1
  img_proc: true
- pgno: 49
  md: '(millions of floating-point operations per second). Although Beowulfs have
    been implemented with almost every conceivable microprocessor family, the two
    most prevalent today are the 32-bit Intel Pentium 3 and Pentium 4 microprocessors
    and the 64-bit Compaq Alpha 21264 family. We note that the AMD devices (including
    the Athlon), which are binary compatible with the Intel Pentium instruction set,
    have also found significant application in clusters. In addition to the basic
    floating-point and integer arithmetic logic units, the register banks, and execution
    pipeline and control logic, the modern microprocessor, comprising on the order
    of 20 to 50 million transistors, includes a substantial amount of on-chip high-speed
    memory called cache for rapid access of data. Cache is organized in a hierarchy
    usually with two or three layers, the closest to the processor being the fastest
    but smallest and the most distant being relatively slower but with much more capacity.
    These caches buffer data and instructions from main memory and, where data reuse
    or spatial locality of access is high, can deliver a substantial percentage of
    peak performance. The microprocessor interfaces with the remainder of the node
    usually by two external buses: one specifically optimized as a high-bandwidth
    interface to main memory, and the other in support of data I/O.


    *Main memory* stores the working dataset and programs used by the microprocessor
    during job execution. Based on DRAM technology in which a single bit is stored
    as a charge on a small capacitor accessed through a dedicated switching transistor,
    data read and write operations can be significantly slower to main memory than
    to cache. However, recent advances in main memory design have improved memory
    access speed and have substantially increased memory bandwidth. These improvements
    have been facilitated by advances in memory bus design such as RAMBus.


    The *motherboard* is the medium of integration that combines all the components
    of a node into a single operational system. Far more than just a large printed
    circuit board, the motherboard incorporates a sophisticated chip set almost as
    complicated as the microprocessor itself. This chip set manages all the interfaces
    between components and controls the bus protocols. One important bus is PCI, the
    primary interface between the microprocessor and most high-speed external devices.
    Initially a 32-bit bus operating at 33 MHz, the most recent variation operates
    at 66 MHz on 64-bit data, thus quadrupling its potential throughput. Most system
    area network interface controllers are connected to the node by means of PCI bus.
    The motherboard also includes a substantial read-only memory (which can be updated)
    containing the system’s BIOS (basic input/output system), a set of low-level services,
    primarily related to the function of the I/O and basic bootstrap tasks, that defines
    the logical interface between the higher-level operating'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'system software and the node hardware. Motherboards also support several other
    input/output ports such as the user’s keyboard/mouse/video monitor and the now-ubiquitous
    universal serial bus (USB) port that is replacing several earlier distinct interface
    types. Nonetheless, the vestigial parallel printer port can still be found, whose
    specification goes to the days of the earliest PCs more than twenty years ago.


    *Secondary storage* provides high-capacity persistent storage. While main memory
    loses all its contents when the system is powered off, secondary storage fully
    retains its data in the powered-down state. While many standalone PCs include
    several classes of secondary storage, some Beowulf-systems may have nodes that
    keep only something necessary for holding a boot image for initial startup, all
    other data being downloaded from an external host or master node. Secondary storage
    can go a long way to improving reliability and reducing per node cost. However,
    it misses the opportunity for low-cost, high-bandwidth mass storage. Depending
    on how the system ultimately is used, either choice may be optimal. The primary
    medium for secondary storage is the hard disk, based on a magnetic medium little
    different from an audio cassette tape. This technology, almost as old as digital
    computing itself, continues to expand in capacity at an exponential rate, although
    access speed and bandwidths have improved only gradually. Two primary contenders,
    SCSI (small computer system interface) and EIDE (enhanced integrated dual electronics),
    are differentiated by somewhat higher speed and capacity in the first case, and
    lower cost in the second case. Today, a gigabyte of EIDE disk storage costs the
    user a few dollars, while the list price for SCSI in a RAID (redundant array of
    independent disks) configuration can be as high as $100 per gigabyte (the extra
    cost does buy more speed, density, and reliability). Most workstations use SCSI,
    and most PCs employ EIDE drives, which can be as large as 100 GButes per drive.
    Two other forms of secondary storage are the venerable floppy disk and the optical
    disk. The modern 3.5-inch floppy (they don’t actually flop anymore, since they
    now come in a hard rather than a soft case), also more than twenty years old,
    holds only 1.4 MBytes of data and should have been retired long ago. Because of
    its ubiquity, however, it continues to hang on and is ideal as a boot medium for
    Beowulf nodes. Largely replacing floppies are the optical CD (compact disk), CD-RW
    (compact disk-read/write), and DVD (digital versatile disk).The first two hold
    approximately 600 MBytes of data, with access times of a few milliseconds. (The
    basic CD is read only, but the CD-RW disks are writable, although at a far slower
    rate.) Most commercial software and data are now distributed on CDs because they
    are very cheap to create (actually cheaper than a glossy one-page double-sided
    commercial flyer). DVD technology also runs on current-generation PCs, providing'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'direct access to movies.


    Packaging for PCs originally was in the form of the “pizza boxes”: low, flat units,
    usually placed on the desk with a fat monitor sitting on top. Some small early
    Beowulls were configured with such packages, usually with as many as eight of
    these boxes stacked one on top of another. But by the time the first Beowulls
    were implemented in 1994, tower cases—vertical floor-standing (or sometimes on
    the desk next to the video monitor) components—were replacing pizza boxes because
    of their greater flexibility in configuration and their extensibility (with several
    heights available). Several generations of Beowull clusters still are implemented
    using this low-cost, robust packaging scheme, leading to such expressions as “pile
    of PCs” and “lots of boxes on shelves” (LOBOS). But the single limitation of this
    strategy was its low density (only about two dozen boxes could be stored on a
    floor-to-ceiling set of shelves) and the resulting large footprint of medium-
    to large-scale Beowulls. Once the industry recognized the market potential of
    Beowull clusters, a new generation of rack-mounted packages was devised and standardized
    (e.g., 1U, 2U, 3U, and 4U, with 1U boxes having a height of 1.75 inches) so that
    it is possible to install a single floor-standing rack with as many as 42 processors,
    coming close to doubling the processing density of such systems. Vendors providing
    complete turnkey systems as well as hardware system integrators (“bring-your-own
    software”) are almost universally taking this approach. Yet for small systems
    where cost is critical and simplicity a feature, towers will pervade small labs,
    offices, and even homes for a long time. (And why not? On those cold winter days,
    they make great space heaters.)


    Beowull cluster nodes (i.e., PCs) have seen enormous, even explosive, growth over
    the past seven years since Beowulls were first introduced in 1994. We note that
    the entry date for Beowull was not arbitrary: the level of hardware and software
    technologies based on the mass market had just (within the previous six months)
    reached the point that ensembles of them could compete for certain niche applications
    with the then-well-entrenched MPPs and provide price/performance benefits (in
    the very best cases) of almost 50 to 1. The new Intel 100 MHz 80486 made it possible
    to achieve as much as 5 Mflops per node for select computationally intense problems
    and the cost of 10 Mbps Ethernet network controllers and network hubs had become
    sufficiently low that their cost permitted them to be employed as dedicated system
    area networks. Equally important was the availability of the inhouse Linux operating
    system with the all-important attribute of being free and open source and the
    availability of a good implementation of the PVM message-passing library. Of course,
    the Beowull project had to fill in a lot of gaps, including writing most of the
    Ethernet drivers distributed with Linux and other simple tools,'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'such as channel bonding, that facilitated the management of these early modest
    systems. Since then, the delivered floating-point performance per processor has
    grown by more than two orders of magnitude while memory capacity has grown by
    more than a factor of ten. Disk capacities have expanded by as much as 1000X.
    Thus, Beowulf compute nodes have witnessed an extraordinary evolution in capability.
    By the end of this decade, node floating-point performance, main memory size,
    and disk capacity all are expected to grow by another two orders of magnitude.


    One aspect of node structure not yet discussed is symmetric multiprocessing. Modern
    microprocessor design includes mechanisms that permit more than one processor
    to be combined, sharing the same main memory while retaining full coherence across
    separate processor caches, thus giving all processors a consistent view of shared
    data in spite of their local copies in dedicated caches. While large industrial-grade
    servers may incorporate as many as 512 processors in a single SMP unit, a typical
    configuration for PC-based SMPs is two or four processors per unit. The ability
    to share memory with uniform access times should be a source of improved performance
    at lower cost. But both design and pricing are highly complicated, and the choice
    is not always obvious. Sometimes the added complexity of SMP design offsets the
    apparent advantage of sharing many of the node''s resources. Also, performance
    benefits from tight coupling of the processors may be outweighed by the contention
    for main memory and possible cache thrashing. An added difficulty is attempting
    to program at the two levels: message passing between nodes and shared memory
    between processors of the same node. Most users don''t bother, choosing to remain
    with a uniform message-passing model even between processors within the same SMP
    node.


    # 2.2.2 Interconnection Networks


    Without the availability of moderate-cost short-haul network technology, Beowulf
    cluster computing would never have happened. Interestingly, the two leaders in
    cluster dedicated networks were derived from very different precedent technologies.
    Ethernet was developed as a local area network for interconnecting distributed
    single user and community computing resources with shared peripherals and file
    servers. Myrinet was developed from a base of experience with very tightly coupled
    processors in MPPs such as the Intel Paragon. Together, Fast and Gigabit Ethernet
    and Myrinet provide the basis for the majority of Beowulf-class clusters.


    A network is a combination of physical transport and control mechanisms associated
    with a layered hierarchy of message encapsulation. The core concept is the “message.”
    A message is a collection of information organized in a format (order and type)
    that both the sending and the receiving processes understand and can'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'correctly interpret. One can think of a message as a movable record. It can
    be as short as a few bytes (not including the header information) or as long as
    many thousands of bytes. Ordinarily, the sending user application process calls
    a library routine that manages the interface between the application and the network.
    Performing a high-level send operation causes the user message to be packaged
    with additional header information and presented to the network kernel driver
    software. Additional routing information and additional congrues are performed
    prior to actually sending the message. The lowest-level hardware then drives the
    communication channel''s lines with the signal, and the network switches route
    the message appropriately in accordance with the routing information encoded bits
    at the header of the message packet. Upon receipt at the receiving node, the process
    is reversed and the message is eventually loaded into the user application name
    space to be interpreted by the application code.


    The network is characterized primarily in terms of its bandwidth and its latency.
    Bandwidth is the rate at which the message bits are transferred, usually cited
    in terms of peak throughput as bits per second. Latency is the length of time
    required to sends the message. Perhaps a fairer measure is the time from sending
    to receiving an application process, taking into consideration all of the layers
    of translation, conversions, and copying involved. But vendors often quote the
    shorter time between their network interface controllers. To complicate matters,
    both bandwidth and latency are sensitive to message length and message traffic.
    Longer messages make better use of network resources and deliver improved network
    throughput. Shorter messages reduce transmit, receive, and copy times to provide
    an overall lower transfer latency but cause lower effective bandwidth. Higher
    total network traffic (i.e., number of messages per unit time) increases overall
    network throughput, but the resulting contention and the delays they incur result
    in longer effective message transfer latency.


    More recently, an industrial consortium has developed a new networking model known
    as VIA. The goal of this network class is to support a zero-copy protocol, avoiding
    the intermediate copying of the message in the operating system space and permitting
    direct application-to-application message transfers. The result is significantly
    reduced latency of message transfer. Emulx has developed the cLAN network product,
    which provides a peak bandwidth in excess of 1 Gbps and for short messages exhibits
    a transfer latency on the order of 7 microseconds.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 2.3 Node Software


    A node in a cluster is often (but not always) an autonomous computing entity,
    complete with its own operating system. Beowulf clusters exploit the sophistication
    of modern operating systems both for managing the node resources and for communicating
    with other nodes by means of their interconnection network.


    The world''s most widely used PC operating system is the family from Microsoft
    loosely referred to as NT. Over the past decade the series of offerings has culminated
    in Windows 2000. This full-featured operating system is both low cost and highly
    robust. It includes virtual memory, multiserver capabilities, multiprocessor,
    security protection, a powerful graphical user interface, and network control.
    Windows is the dominant PC operating system in the commercial community and is
    making rapid inroads into the technical computing community. A number of major
    supercomputing centers including the Cornell Theory Center and NCSA employ major
    Windows-based Beowulf clusters.


    # 2.4 Resource Management


    Except in the most restrictive of cases, matching the requirements of a varied
    workload and the capabilities of the distributed resources of a Beowulf cluster
    system demands the support and services of a potentially sophisticated software
    system for resource management. The earliest Beowulfs were dedicated systems used
    by (at most) a few people and controlled explicitly, one application at a time.
    But today''s more elaborate Beowulf clusters, possibly comprising hundreds or
    even thousands of processors and shared by a large community of users, both local
    and at remote sites, need to balance contending demands and available processing
    capacity to achieve rapid response for user programs and high throughput of cluster
    resources. Fortunately, several such software systems are available to provide
    systems administrators and users alike with a wide choice of policies and mechanisms
    by which to govern the operation of the system and its allocation to user tasks.


    The challenge of managing the large set of compute nodes that constitute a Beowulf
    cluster involves several tasks to match user-specified workload to existing resources.


    **Queuing**, User jobs are submitted to a Beowulf cluster by different people,
    potentially from separate locations, who are possibly unaware of requirements
    being imposed on the same system by other users. A queuing system buffers the
    randomly submitted jobs, entered at different places and times and with varying
    requirements,'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'until system resources are available to process each of them. Depending on
    priorities and specific requirements, different distributed queues may be maintained
    to facilitate optimal scheduling.


    **Scheduling.** Perhaps the most complex component of the resource manager, the
    scheduler has to balance the priorities of each job, with the demands of other
    jobs, the existing system compute and storage resources, and the governing policies
    dictated for their use by system administrators. Schedulers need to contend with
    such varied requirements as large jobs needing all the nodes, small jobs needing
    only one or at most a few nodes, interactive jobs during which the user must be
    available and in the loop for such things as real-time visualization of results
    or performance debugging during program development, or high-priority jobs that
    must be completed quickly (such as medical imaging). The scheduler determines
    the order of execution based on these independent priority assessments and the
    solution to the classic bin-packing problem: What jobs can fit on the machine
    at the same time?


    **Resource Control.** A middleware component, resource control puts the programs
    on the designated nodes, moves the necessary files to the respective nodes, starts
    jobs, suspends jobs, terminates jobs, and offloads result files. It notifies the
    scheduler when resources are available and handles any exception conditions across
    the set of nodes committed to a given user job.


    **Monitoring.** The ongoing status of the Beowulf cluster must be continuously
    tracked and reported to a central control site such as a master or host node of
    the system. Such issues as resource availability, task status on each node, and
    operational health of the nodes must be constantly monitored to aid in the successful
    management of the total system in serving its incident user demand. Some of this
    information must continuously update the system operators status presentation,
    while other statistics and status parameters must be directly employed by the
    automatic resource management system.


    **Accounting.** In order to assess billing or at least to determine remaining
    user allocation of compute time (often measured in node hours), as well as to
    assess overall system utilization, availability, and demand response effectiveness,
    records must be automatically kept of user accounts and system work. This is the
    primary tool by which system administrators and managers assess effectiveness
    of scheduling policies, maintenance practices, and user allocations.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'While no single resource management system addresses all of these functions
    optimally for all operational and demand circumstances, several tools have proven
    useful in operational settings and are available to users and administrators of
    Beowulf-class cluster systems. An entire chapter is dedicated to each of these
    in Part III of this book; here they are discussed only briefly.


    **Condor** supports distributed job stream resource management emphasizing capacity
    or throughput computing. Condor schedules independent jobs on cluster nodes to
    handle large user workloads and provides many options in scheduling policy. This
    venerable and robust package is particularly well suited for managing both workloads
    and resources at remote sites.


    **PBS** is a widely used system for distributing parallel user jobs across parallel
    Beowulf cluster resources and providing the necessary administrative tools for
    professional systems supervision. Both free and commercially supported versions
    of this system are available, and it is professionally maintained, providing both
    user and administrator confidence.


    **Maui** is an advanced scheduler incorporating sophisticated policies and mechanisms
    for handling a plethora of user demands and resource states. This package actually
    sits on top of other lower-level resource managers, providing added capability.


    **Cluster Controller** is a fully operational system that manages the Beowulf
    cluster resources at the Cornell Theory Center, one of the foremost sites applying
    Windows Beowulf clusters to a broad range of technical computing applications.
    This system provides all of the basic tools required for managing the resources
    of a large Beowulf-based computer center, exploiting the advantages of the Windows
    environment.


    # 2.5 Distributed Programming


    Exploitation of the potential of Beowulf clusters relies heavily on the development
    of a broad range of new parallel applications that effectively takes advantage
    of the parallel system resources to permit larger and more complex problems to
    be explored in a shorter time. Programming a cluster differs substantially from
    that of programming a uniprocessor workstation or even an SMP. This difference
    is in part due to the fact that the sharing of information between nodes of a
    Beowulf cluster can take a lot longer than between the nodes of a tightly coupled
    system, because the'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'fragmented memory space reflected by the distributed-memory Beowulfs imposes
    substantially more overhead than that required by shared-memory systems, and because
    a Beowulf may have many more nodes than a typical 32-processor SMP. As a consequence,
    the developer of a parallel application code for a Beowulf must take into consideration
    these and other sources of performance degradation to achieve effective scalable
    performance for the computational problem.


    A number of different models have been employed for parallel programming and execution,
    each emphasizing a particular balance of needs and desirable traits. The models
    differ in part by the nature and degree of abstraction they present to the user
    of the underlying parallel system. These vary in generality and specificity of
    control. But one model has emerged as the dominant strategy. This is the “communicating
    sequential processes” model, more often referred to as the message-passing model.


    Through this methodology, the programmer partitions the problem’s global data
    among the set of nodes and specifies the processes to be executed on each node,
    each working primarily on its respective local data partition. Where information
    from other nodes is required, the user establishes logical paths of communication
    between cooperating processes on separate nodes. The application program for each
    process explicitly sends and receives messages passed between itself and one or
    more other remote processes. A message is a packet of information containing one
    or more values in an order and format that both processes involved in the exchange
    understand. Messages are also used for synchronizing concurrent processes in order
    to coordinate the execution of the parallel tasks on different nodes.


    Programmers can use low-level operating system kernel interfaces to the network,
    such as Winsoc or remote procedure calls. Fortunately, however, an easier way
    exists. Two major message-passing programming systems have been developed to facilitate
    parallel programming and application development. These are in the form of linkable
    libraries that can be used in conjunction with conventional languages such as
    Fortran or C. Benefiting from prior experiences with earlier such tools, PVM has
    a significant following and has been used to explore a broad range of semantic
    constructs and distributed mechanisms. PVM was the first programming system to
    be employed on a Beowulf cluster and its availability was critical to this early
    work. MPI, the second and more recently distributed programming system, was developed
    as a product of a communitywide consortium. MPI is the model of choice for the
    majority of the parallel programming community on Beowulf clusters and other forms
    of parallel computer as well, even shared-memory machines. There are a number
    of open and commercial sources of MPI with new developments, especially in the
    area of parallel I/O, being incorporated in implementations of MPI-2. Together,
    MPI and PVM represent the bulk of parallel programs being'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'developed around the world, and both languages are represented in this book.


    Of course, developing parallel algorithms and writing parallel programs involves
    a lot more than just memorizing a few added constructs. Entire books have been
    dedicated to this topic alone (including three in this series), and it is a focus
    of active research. A detailed and comprehensive discourse of parallel algorithm
    design is beyond the scope of this book. Instead, we offer specific and detailed
    examples that provide templates that will satisfy many programming needs. Certainly
    not exhaustive, these illustrations nonetheless capture many types of problem.


    # 2.6 Conclusions


    Beowulf cluster computing is a fascinating microcosm of parallel processing, providing
    hands-on exposure and experience with all aspects of the field, from low-level
    hardware to high-level parallel algorithm design and everything in between. While
    many solutions are readily available to provide much of the necessary services
    required for effective use of Beowulf clusters in many roles and markets, many
    challenges still remain to realizing the best of the potential of commodity clusters.
    Research and advanced development is still an important part of the work surrounding
    clusters, even as they are effectively applied to many real-world workloads. The
    remainder of this book serves two purposes: it represents the state of the art
    for those who wish ultimately to extend Beowulf cluster capabilities, and it guides
    those who wish immediately to apply these existing capabilities to real-world
    problems.'
  merge: -1
  img_proc: true
