- pgno: 438
  md: '# 18.6 Helping Users Get Started


    CTC has a staff of consultants with over ten years'' experience in parallel programming
    and optimization. These consultants work with our users to make sure that they
    can get their work done in the most efficient way possible. The consultants also
    are available for porting and development work as needed by the Cornell user community
    and to outside customers on a contractual basis. To make it easy for users new
    to the Windows environment to get started without having to have a Windows-based
    machine, CTC has set up a "Collaboratory"—a large room with ten high-end workstations
    fully configured with all the software and tools that are installed on the cluster
    resources. Users can come to the Collaboratory and work with collaborators and
    CTC consultants to get codes running on the clusters.


    # 18.7 Batch and Interactive Job Scheduling


    CTC developed the Cluster CoNTroller job scheduling system as part of the research
    and development under an Intel Technology for Education grant (see www.cs.cornell.edu/tech2000/).
    We licensed this system to MPI Software Technology, Inc., who continues to develop,
    sell, and support it (see www.mpi-softtech.com/products/cluster_controller). Chapter
    17 provides further details on Cluster CoNTroller.


    # 18.8 CTC Success Story


    The move to Windows-based clusters has been successful for CTC and, most important,
    its users. Windows 2000 is more reliable than the Unix systems we''ve had in the
    past; and the Dell servers are quite stable. Indeed, we have been doing a reliability
    study with Intel for over a year now, looking at everything from hardware to software
    issues. We had 99.986% uptime the first three months we ran Windows 2000; and
    in the past two months on all the cluster resources described in this chapter,
    we have had 99.99999% uptime.


    More information about CTC and its cluster resources is available at the following
    URLs:


    +   www.tc.cornell.edu

    +   www.ctc-manhattan.com

    +   www.tc.cornell.edu/AC3'
  merge: -1
  img_proc: true
