  md: 'party groups have created freely available Java, Perl, Python, and IDL interfaces
    to PVM.


    The C and C++ language bindings for the PVM user interface library are implemented
    as functions, following the general conventions used by most C systems. To elaborate,
    function arguments are a combination of value parameters and pointers as appropriate,
    and function result values indicate the outcome of the call. In addition, macro
    definitions are used for system constants, and global variables such as **errno**
    and **pvm_errno** are the mechanism for discriminating between multiple possible
    outcomes. Application programs written in C and C++ access PVM library functions
    by linking against an archival library (1ibpvm3.a) that is part of the standard
    distribution.


    Fortran language bindings are implemented as subroutines rather than as functions.
    This approach was taken because some compilers on the supported architectures
    would not reliably interface Fortran functions with C functions. One immediate
    implication of this is that an additional argument is introduced into each PVM
    library call for status results to be returned to the invoking program. Another
    difference is that library routines for the placement and retrieval of typed data
    in message buffers are unified, with an additional parameter indicating the datatype.
    Apart from these differences (and the standard naming prefixes pem. for C, and
    pmf for Fortran), a one-to-one correspondence exists between the two language
    bindings. Fortran interfaces to PVM are implemented as library stubs that in turn
    invoke the corresponding C routines, after casting and/or dereferencing arguments
    as appropriate. Thus, Fortran applications are required to link against the stubs
    library (1ibfpvm3.a) as well as the C library.


    All PVM tasks are identified by an integer task identifier tid. Messages are sent
    to tids and received from tids. Since tids must be unique across the entire virtual
    machine, they are supplied by the local pvmd and are not user chosen. Although
    PVM encodes information into each tid, the user is expected to treat the tids
    as opaque integer identifiers. PVM contains several routines that return tid values
    so that the user application can identify other tasks in the system.


    In some applications it is natural to think of a *group of tasks*. And there are
    cases where you would like to identify your tasks by the numbers 0 to *p* − 1,
    where *p* is the number of tasks. PVM includes the concept of user-named groups.
    When a task joins a group, it is assigned a unique “instance” number in that group.
    Instance numbers start at 0 and count up. In keeping with the PVM philosophy,
    the group functions are designed to be very general and transparent to the user.
    For example, any PVM task can join or leave any group at any time without having
    to inform any other task in the affected groups, groups can overlap, and tasks
    can'
