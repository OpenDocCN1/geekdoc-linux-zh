  md: "# ## 9.2 Manager/Worker Example\n\nWe now begin a series of examples illustrating\
    \ approaches to parallel computations that accomplish useful work. While each\
    \ parallel application is unique, a number of paradigms have emerged as widely\
    \ applicable, and many parallel algorithms are variations on these patterns.\n\
    \nOne of the most universal is the “manager/worker” or “task parallelism” approach.\
    \ The idea is that the work that needs to be done can be divided by a “manager”\
    \ into separate pieces and the pieces can be assigned to individual “worker” processes.\
    \ Thus the manager executes a different algorithm from that of the workers, but\
    \ all of the workers execute the same algorithm. Most implementations of MPI (including\
    \ MPICH) allow MPI processes to be running different programs (executable files),\
    \ but it is often convenient (and in some cases required) to combine the manager\
    \ and worker code into a single program with the structure shown in Figure 9.5.\n\
    \n```\n```c\n#include \"mpi.h\"\n\nint main( int argc, char *argv[] )\n{\n   \
    \ int numprocs, myrank;\n\n    MPI_Init( &argc, &argv );\n    MPI_Comm_size( MPI_COMM_WORLD,\
    \ &numprocs );\n    MPI_Comm_rank( MPI_COMM_WORLD, &myrank );\n\n    if ( myrank\
    \ == 0 )            /* manager process */\n        manager_code ( numprocs );\n\
    \    else                          /* worker process */\n        worker_code (\
    \ );\n    MPI_Finalize( );\n    return 0;\n}\n```\n```\n\n![](img/e2283ffaea56e577ac05056b4bb738fc_204_0.png)\n\
    \nSometimes the work can be evenly divided into exactly as many pieces as there\
    \ are workers, but a more flexible approach is to have the manager keep a pool\
    \ of units of work larger than the number of workers, and assign new work dynamically"
