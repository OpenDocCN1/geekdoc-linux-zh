    # ## 14.6 Administration Tools


    Condor has a rich set of tools for the administrator. Table 14.2 gives an overview
    of the Condor commands typically used solely by the system administrator. Of course,
    many of the "user-level" Condor tools summarized in Table 14.2 can be helpful
    for cluster administration as well. For instance, the `condor_status` tool can
    easily display the status for all nodes in the cluster, including dynamic information
    such as current load average and free virtual memory.


    | Command | Description |

    | :--- | :--- |

    | `condor_config_val` | Query or set a given Condor configuration variable |

    | `condor_master_off` | Shut down Condor and the `condor_master` |

    | `condor_off` | Shut down Condor daemons |

    | `condor_on` | Start up Condor daemons |

    | `condor_reconfig` | Reconfigure Condor daemons |

    | `condor_restart` | Restart the `condor_master` |

    | `condor_stats` | Display historical information about the Condor pool |

    | `condor_userprio` | Display and manage user priorities |

    | `condor_vacate` | Vacate jobs that are running on the specified hosts |


    **Table 14.2**


    Commands reserved for the administrator.


    # ### 14.6.1 Remote Configuration and Control


    All machines in a Condor pool can be remotely managed from a centralized location.
    Condor can be enabled, disabled, or restarted remotely using the `condor_on`,
    `condor_off`, and `condor_restart` commands, respectively. Additionally, any aspect
    of Condor’s configuration file on a node can be queried or changed remotely via
    the `condor_config_val` command. Of course, not everyone is allowed to change
    your Condor configuration remotely. Doing so requires proper authorization, which
    is set up at installation time (see Section 14.4).


    Many aspects of Condor’s configuration, including its scheduling policy, can be
    changed on the fly without requiring the pool to be shut down and restarted. This
    is accomplished by using the `condor_reconfig` command, which asks the'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'Condor daemons on a specified host to reread the Condor configuration files
    and take appropriate action---on the fly if possible.


    # 14.6.2  Accounting and Logging


    Condor keeps many statistics about what is happening in the pool. Each daemon
    can be asked to keep a detailed log of its activities; Condor will automatically
    rotate these log files when they reach a maximum size as specified by the administrator.


    In addition to the **condor history** command, which allows users to view job
    ClassAds for jobs that have previously completed, the **condor\_stats** tool can
    be used to query for historical usage statistics from a poolwide accounting database.
    This database contains information about how many jobs were being serviced for
    each user at regular intervals, as well as how many machines were busy. For instance,
    **condor\_stats** could be asked to display the total number of jobs running at
    five-minute intervals for a specified user between January 15 and January 30.


    The **condor\_view** tool takes the raw information obtainable with **condor\_stats**
    and converts it into HTML, complete with interactive charts. Figure 14.6 shows
    a sample display of the output from **condor\_view** in a Web browser. The site
    administrator, using **condor\_view**, can quickly put detailed, real-time usage
    statistics about the Condor pool onto a Web site.


    # 14.6.3  User Priorities in Condor


    The job queues in Condor are not strictly first-in, first-out. Instead, Condor
    implements *priority queuing*. Different users will get different-sized allocations
    of machines depending on their current user priority, regardless of how many jobs
    from a computing user are “ahead” of them in the queue. Condor can also be configured
    to perform *priority preemption* if desired. For instance, suppose user *A* is
    using all the nodes in a cluster, when suddenly a user with a superior priority
    submits jobs. With priority preemption enabled, Condor will preempt the jobs of
    the lower-priority user in order to immediately start the jobs submitted by the
    higher-priority user.


    Starvation of the lower-priority users is prevented by a fair-share algorithm,
    which attempts to give all users the same amount of machine allocation time over
    a specified interval. In addition, the priority calculations in Condor are based
    on *ratios* instead of absolutes. For example, if Bill has a priority that is
    twice as good as that of Fred, Condor will not starve Fred by allocating all machines
    to Bill. Instead, Bill will get, on average, twice as many machines as will Fred
    because Bill’s priority is twice as good.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_368_0.png)


    **Figure 14.6**

    CondorView displaying machine usage.


    The **condor_userprio** command can be used by the administrator to view or edit
    a user’s priority. It can also be used to override Condor’s default fair-share
    policy and explicitly assign users a better or worse priority in relation to other
    users.


    # ## 14.7 Cluster Setup Scenarios


    This section explores different scenarios for how to configure your cluster. Five
    scenarios are presented, along with a basic idea of what configuration settings
    you will need to modify or what steps you will need to take for each scenario:


    +   1.  A uniformly owned, dedicated compute cluster, with a single front-end
    node for submission, and support for MPI applications.

    +   2.  A cluster of multiprocessor nodes.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '+   3.  A cluster of distributively owned nodes. Each node prefers to run jobs
    submitted by its owner.

    +   4.  Desktop submission to the cluster.

    +   5.  Expanding the cluster to nondedicated (desktop) computing resources.


    Most of these scenarios can be combined. Each scenario builds on the previous
    one to add further functionality to the basic cluster configuration.


    # 14.7.1   Basic Configuration: Uniformly Owned Cluster


    The most basic scenario involves a cluster where all resources are owned by a
    single entity and all compute nodes enforce the same policy for starting and stopping
    jobs. All compute nodes are dedicated, meaning that they will always start an
    idle job and they will never preempt or suspend until completion.  There is a
    single front-end node for submitting jobs, and dedicated MPI jobs are enabled
    from this host.


    In order to enable this basic policy, your global configuration file must contain
    these settings:


    ```

    START = True

    SUSPEND = False

    CONTINUE = False

    PREEMPT = False

    KILL = False

    WANT_SUSPEND = True

    WANT_VACATE = True

    RANK = Scheduler  $=(DedicatedScheduler)

    DAEMON_LIST = MASTER, STARTD

    ```


    The final entry listed here specifies that the default role for nodes in your
    pool is execute-only.  The DAEMON_LIST on your front-end node must also enable
    the condor_schedd. This front-end node’s local configuration file will be


    ```

    DAEMON_LIST = MASTER, STARTD, SCHEDD

    ```


    # 14.7.2   Using Multiprocessor Compute Nodes


    If any node in your Condor pool is a symmetric multiprocessor machine, Condor
    will represent that node as multiple virtual machines (VMs), one for each CPU.
    By'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'default, each VM will have a single CPU and an even share of all shared system
    resources, such as RAM and swap space. If this behavior satisfies your needs,
    you do not need to make any configuration changes for SMP nodes to work properly
    with Condor.


    Some sites might want different behavior of their SMP nodes. For example, assume
    your cluster was composed of dual-processor machines with 1 gigabyte of RAM, and
    one of your users was submitting jobs with a memory footprint of 700 megabytes.
    With the default setting, all VMs in your pool would only have 500 megabytes of
    RAM and your user''s jobs would never run. In this case, you would want to unevenly
    divide RAM between the two CPUs, to give half of your VMs 750 megabytes of RAM.
    The other half of the VMs would be left with 250 megabytes of RAM.


    There is more than one way to divide shared resources on an SMP machine with Condor,
    all of which are discussed in detail in the Condor Administrator''s Manual. The
    most basic method is as follows. To divide shared resources on an SMP unevenly,
    you must define different *virtual machine types* and tell the *condor_startd*
    how many virtual machines of each type to advertise. The simplest method to define
    a virtual machine type is to specify what fraction of all shared resources each
    type should receive.


    For example, if you wanted to divide a two-node machine where one CPU received
    one-quarter of the shared resources, and the other CPU received the other three-quarters,
    you would use the following settings:


    ```

    ```

    VIRTUAL_MACHINE_TYPE_1 = 1/4

    VIRTUAL_MACHINE_TYPE_2 = 3/4

    NUM_VIRTUAL_MACHINES_TYPE_1 = 1

    NUM_VIRTUAL_MACHINES_TYPE_2 = 1

    ```

    ```


    If you want to divide certain resources unevenly but split the rest evenly, you
    can specify separate fractions for each shared resource. This is described in
    detail in the Condor Administrator''s Manual.


    # 14.7.3 Scheduling a Distributively Owned Cluster


    Many clusters are owned by more than one entity. Two or more smaller groups might
    pool their resources to buy a single, larger cluster. In these situations, the
    group that paid for a portion of the nodes should get priority to run on those
    nodes.


    Each resource in a Condor pool can define its own *RANK* expression, which specifies
    the kinds of jobs it would prefer to execute. If a cluster is owned by multiple
    entities,'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'you can divide the cluster’s nodes up into groups, based on ownership. Each
    node would set **Rank** such that jobs coming from the group that owned it would
    have the highest priority.


    Assume there is a 60-node compute cluster at a university, shared by three departments:
    astronomy, math, and physics. Each department contributed the funds for 20 nodes.
    Each group of 20 nodes would define its own **Rank** expression. The astronomy
    department’s settings, for example, would be


    ```

    Rank = Department == "Astronomy"

    ```


    The users from each department would also add a **Department** attribute to all
    of their job ClassAds. The administrators could configure Condor to add this attribute
    automatically to all job ads from each site (see the Condor Administrator’s Manual
    for details).


    If the entire cluster was idle and a physics user submitted 40 jobs, she would
    see all 40 of her jobs start running. If, however, a user in math submitted 60
    jobs and a user in astronomy submitted 20 jobs, 20 of the physicist’s jobs would
    be preempted, and each group would get 20 machines out of the cluster.


    If all of the astronomy department’s jobs completed, the astronomy nodes would
    go back to serving math and physics jobs. The astronomy nodes would continue to
    run math or physics jobs until either some astronomy jobs were submitted, or all
    the jobs in the system completed.


    # 14.7.4 Submitting to the Cluster from Desktop Workstations


    Most organizations that install a compute cluster have other workstations at their
    site. It is usually desirable to allow those machines to act as front-end nodes
    for the cluster, so users can submit their jobs from their own machines and have
    the applications execute on the cluster. Even if there is no shared file system
    between the cluster and the rest of the computers, Condor’s file transfer functionality
    can enable jobs to migrate between the two and still access their data (see Section
    14.2.5 for details on accessing data files).


    To enable a machine to submit into your cluster, run the Condor installation program
    and specify that you want to setup a *submit-only* node. This will set the DAEMON\_LIST
    on the new node to be'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'Note that you can have only one node configured as the dedicated scheduler
    for your pool. Do not attempt to add a second submit node for MPI jobs.


    # ### 14.7.5  Expanding the Cluster to Nondedicated (Desktop) Computing Resources


    One of the most powerful features in Condor is the ability to combine dedicated
    and opportunistic scheduling within a single system. *Opportunistic scheduling*
    involves placing jobs on nondedicated resources under the assumption that the
    resources might not be available for the entire duration of the jobs. Opportunistic
    scheduling is used for all jobs in Condor with the exception of dedicated MPI
    applications.


    If your site has a combination of jobs and uses applications other than MPI, you
    should strongly consider adding all of your computing resources, even desktop
    workstations, to your Condor pool. With suspend and resume capabilities, opportunistic
    scheduling and matchmaking, Condor can harness the idle CPU cycles of any machine
    and put them to good use.


    To add other computing resources to your pool, run the Condor installation program
    and specify that you want to configure a node that can both submit and execute
    jobs. The default installation sets up a node with a policy for starting, suspending,
    and preempting jobs based on the activity of the machine (for example, keyboard
    idle time and CPU load). These nodes will not run dedicated MPI jobs, but they
    will run jobs from any other universe, including PVM.


    # ## 14.8  Conclusion


    Condor is a powerful tool for scheduling jobs across platforms, both within and
    beyond the boundaries of your Beowulf clusters. Through its unique combination
    of both dedicated and opportunistic scheduling, Condor provides a unified framework
    for high-throughput computing.'
  merge: -1
  img_proc: true
