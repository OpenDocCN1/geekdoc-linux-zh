    # MPI Universe.


    The MPI Universe allows parallel programs written with MPI to be managed by Condor.
    To submit an MPI program to Condor, specify the number of nodes to be used in
    the parallel job. Use the *machine\_count* attribute in the submit description
    file, as in the following example:


    ```

    # Submit file for an MPI job which needs 8 large memory nodes

    universe = mpi

    executable = my-parallel-job

    requirements = Memory >= 512

    machine_count = 8

    queue

    ```


    Further options in the submit description file allow a variety of parameters,
    such as the job requirements or the executable to use across the different nodes.


    By late 2001, Condor expects your MPI job to be linked with the MPICH implementation
    of MPI configured with the `ch.p4` device (see Section 9.6). Support for different
    devices and MPI implementations is expected, however, so check the documentation
    included with your specific version of Condor for additional information on how
    your job should be linked with MPI for Condor.


    If your Condor pool consists of both dedicated compute machines (that is, Beowulf
    cluster nodes) and opportunistic machines (that is, desktop workstations), by
    default Condor will schedule MPI jobs to run on the dedicated resources only.


    # Scheduler Universe.


    The Scheduler Universe is used to submit a job that will immediately run on the
    *submit* machine, as opposed to a remote execution machine. The purpose is to
    provide a facility for job *meta-schedulers* that desire to manage the submission
    and removal of jobs into a Condor queue. Condor includes one such meta-scheduler
    that utilizes the Scheduler Universe: the DAGMan scheduler, which can be used
    to specify complex interdependencies between jobs. See Section 14.2.6 for more
    on DAGMan.


    # 14.2.5 Giving Your Job Access to Its Data Files


    Once your job starts on a machine in your pool, how does it access its data files?
    Condor provides several choices.


    Condor can use a shared file system, if one is available and permanently mounted
    across the machines in the pool. This is usually the case in a Beowulf cluster.
    But'
