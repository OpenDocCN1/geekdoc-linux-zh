    (at the same clock frequency) depending on the application. The Athlon supports
    dual-processor SMP nodes.


    # 3.2.3 Compaq Alpha 21264


    The Compaq Alpha processor is a true 64-bit architecture. For many years, the
    Alpha held the lead in many benchmarks, including the SPEC benchmarks, and was
    used in many of the fastest supercomputers, including the Cray T3D and T3E, as
    well as the Compaq SC family.


    The Alpha uses a Reduced Instruction Set Computer (RISC) architecture, distinguishing
    it from Intel’s Pentium processors. RISC designs, which have dominated the workstation
    market of the past decade, eschew complex instructions and addressing modes, resulting
    in simpler processors running at higher clock rates, but executing somewhat more
    instructions to complete the same task.


    # 3.2.4 IA64


    The IA64 is Intel’s first 64-bit architecture. This is an all-new design, with
    a new instruction set, new cache design, and new floating-point processor design.
    With clock rates approaching 1 GHz and multiway floating-point instruction issue,
    Itanium should be the first implementation to provide between 1 and 2 GFlops peak
    performance. The first systems with the Itanium processor were released in the
    middle of 2001 and have delivered impressive results. For example, the HP Server
    rx4610, using a single 800 MHz Itanium, delivered a SPECfp2000 of 701, comparable
    to recent Alpha-based systems. The IA64 architecture does, however, require significant
    help from the compiler to exploit what Intel calls EPIC (explicitly parallel instruction
    computing).'
