    # ### 14.4 Installing Condor under Windows 2000


    The first step toward the installation of Condor is to download the software from
    the Condor Web site at `www.cs.wisc.edu/condor/downloads`. There is no cost to
    download or use Condor.


    On the Web site you will find complete documentation and release notes for the
    different versions and platforms supported.


    Before you begin the installation, there are several issues you need to consider
    and actions to perform.


    +   - **Location.** On Windows 2000, Condor is installed as a system service.
    Therefore, it is best to install Condor on the local disk (in `C:\condor`).

    +   - **Administrator.** Condor needs an e-mail address for an administrator.
    Should Condor need assistance, this is where e-mail will be sent.

    +   - **Central Manager.** The central manager of a Condor pool does matchmaking
    and collects information for the pool. Choose a central manager that has a good
    network'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'connection and is likely to be online all the time (or at least rebooted quickly
    in the event of a failure).


    Once you have decided the answers to these questions you are ready to begin installation.
    Execute the file obtained by download to start installation. The configuration
    tool will ask you a short series of questions, mostly related to the issues addressed
    above. Answer the questions appropriately for your site, and Condor will be installed.


    Section 14.5 discusses how to configure and customize your pool for a dedicated
    cluster.


    After Condor is installed, you will want to customize a few security configuration
    right away. Condor implements security at the host (or machine) level. A set of
    configuration defaults set by the installation deal with access to the Condor
    pool by host. Given the distributed nature of the daemons that implement Condor,
    access to these daemons is naturally host based. Each daemon can be given the
    ability to allow or deny service (by host) within its configuration. Within the
    access levels available, Read, Write, Administrator, and Config are important
    to set correctly for each pool of machines.


    **Read:** allows a machine to obtain information from Condor. Examples of information
    that may be read are the status of the pool and the contents of the job queue.


    **Write:** allows a machine to provide information to Condor, such as submit a
    job or join the pool.


    **Administrator:** allows a user on the machine to affect privileged operations
    such as changing a user’s priority level or starting and stopping the Condor system
    from running.


    **Config:** allows a user on the machine to change Condor’s configuration settings
    remotely using the condor_config_val tool’s -set and -reset options. This has
    very serious security implications, so we recommend that you not enable Config
    access to any hosts.


    The defaults during installation give all machines read and write access. The
    central manager is also given administrator access. You will probably wish to
    change these defaults for your site. Read the Condor Administrator’s Manual for
    details on network authorization in Condor and how to customize it for your wishes.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# 14.5 Configuring Condor


    This section describes how to configure and customize Condor for your site. It
    discusses the configuration files used by Condor, describes how to configure the
    policy for starting and stopping jobs in your pool, and recommends settings for
    using Condor on a cluster.


    A number of configuration files facilitate different levels of control over how
    Condor is configured on each machine in a pool. The top-level or global configuration
    file is shared by all machines in the pool. For ease of administration, this file
    should be located on a shared file system. In addition, each machine may have
    multiple local configuration files allowing the local settings to override the
    global settings. Hence, each machine may have different daemons running, different
    policies for when to start and stop Condor jobs, and so on.


    All of Condor''s configuration files should be owned and writable only by Administrator.
    It is important to maintain strict control over these files because they contain
    security-sensitive settings.


    # 14.5.1 Location of Condor''s Configuration Files


    Condor has a default set of locations it uses to try to find its top-level configuration
    file. The locations are checked in the following order:


    +   1. The file specified in the CONDOR_CONFIG environment variable.

    +   2. The file specified in the HKEY_LOCAL_MACHINE\Software\Condor registry entry.
    This entry is set when you run Condor''s installation program on Windows.


    If a Condor daemon or tool cannot find its global configuration file when it starts,
    it will print an error message and immediately exit. Once the global configuration
    file has been read by Condor, however, any other local configuration files can
    be specified with the LOCAL_CONFIG_FILE macro.


    This macro can contain a single entry if you want only two levels of configuration
    (global and local). If you need a more complex division of configuration values
    (for example, if you have machines of different platforms in the same pool and
    desire separate files for platform-specific settings), LOCAL_CONFIG_FILE can contain
    a list of files.


    Condor provides other macros to help you easily define the location of the local
    configuration files for each machine in your pool. Most of these are special macros
    that evaluate to different values depending on which host is reading the global
    configuration file:'
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   * **HOSTNAME**: The hostname of the local host.

    +   * **FULL_HOSTNAME**: The fully qualified hostname of the local host.

    +   * **OPSYS**: The operating system of the local host, such as “LINUX,” “WINNT4”
    (for Windows NT), or “WINNT5” (for Windows 2000). This is primarily useful in
    heterogeneous clusters with multiple platforms.

    +   * **RELEASE_DIR**: The directory where Condor is installed on each host. This
    macro is defined in the global configuration file and is set by Condor’s installation
    program.


    By default, the local configuration file is defined as


    ```

    LOCAL_CONFIG_FILE = $(RELEASE_DIR)\condor_config.local

    ```


    # 14.5.2 Recommended Configuration File Layout for a Cluster


    Ease of administration is an important consideration in a cluster, particularly
    if you have a large number of nodes. To make Condor easy to configure, we highly
    recommend that you install all of your Condor configuration files, even the per-node
    local configuration files, on a shared file system. That way, you can easily make
    changes in one place. On Windows 2000, you must use a shared drive that is mapped
    at boot time for this, instead of drives that are mapped when you log in.


    You should use a subdirectory in your release directory for holding all of the
    local configuration files. On Windows 2000, you will have to create this directory
    yourself. For the purposes of the following examples, we will assume you have
    called this subdirectory `config`.


    You should create separate files for each node in your cluster, using the hostname
    as the first half of the filename, and “.local” as the end. For example, if your
    cluster nodes are named “n01”, “n02” and so on, the files should be called ‘n01.local’,
    ‘n02.local’, and so on. These files should all be placed in your `config` directory.


    In your global configuration file, you should use the following setting to describe
    the location of your local configuration files:


    ```

    LOCAL_CONFIG_FILE = $(RELEASE_DIR)/config/$(HOSTNAME).local

    ```


    The central manager of your pool needs special settings in its local configuration
    file. These attributes are set automatically by the Condor installation program.
    The rest of the local configuration files can be left empty at first. Having your
    configuration files laid out in this way will help you more easily customize Condor’s
    behavior on your cluster. We discuss other possible configuration scenarios at
    the end of this chapter.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '**Note:** We recommend that you store all of your Condor configuration files
    under a version control system, such as CVS. While this is not required, it will
    help you keep track of the changes you make to your configuration, who made them,
    when they occurred, and why. In general, it is a good idea to store configuration
    files under a version control system, since none of the above concerns are specific
    to Condor.


    # 14.5.3 Customizing Condor''s Policy Expressions


    Certain configuration expressions are used to control Condor''s policy for executing,
    suspending, and evicting jobs. Their interaction can be somewhat complex. Defining
    an inappropriate policy impacts the throughput of your cluster and the happiness
    of its users. If you are interested in creating a specialized policy for your
    pool, we recommend that you read the Condor Administrator''s Manual. Only a basic
    introduction follows.


    All policy expressions are ClassAd expressions and are defined in Condor''s configuration
    files. Policies are usually poolwide and are therefore defined in the global configuration
    file. If individual nodes in your pool require their own policy, however, the
    appropriate expressions can be placed in local configuration files.


    The policy expressions are treated by the `condor_startd` as part of its machine
    ClassAd (along with all the attributes you can view with `condor_status -long`).
    They are always evaluated against a job ClassAd, either by the `condor_negotiator`
    when trying to find a match or by the `condor_startd` when it is deciding what
    to do with the job that is currently running. Therefore, all policy expressions
    can reference attributes of a job, such as the memory usage or owner, in addition
    to attributes of the machine, such as keyboard idle time or CPU load.


    Most policy expressions are ClassAd Boolean expressions, so they evaluate to TRUE,
    FALSE, or UNDEFINED. UNDEFINED occurs when an expression references a ClassAd
    attribute that is not found in either the machine''s ClassAd or the ClassAd of
    the job under consideration. For some expressions, this is treated as a fatal
    error, so you should be sure to use the ClassAd meta-operators, described in Section
    14.1.2 when referring to attributes which might not be present in all ClassAds.


    An explanation of policy expressions requires an understanding of the different
    stages that a job can go through from initially executing until the job completes
    or is evicted from the machine. Each policy expression is then described in terms
    of the step in the progression that it controls.'
  merge: -1
  img_proc: true
- pgno: 364
  md: "**The Lifespan of a Job Executing in Condor.** When a job is submitted to Condor,\
    \ the `condor_negotiator` performs matchmaking to find a suitable resource to\
    \ use for the computation. This process involves satisfying both the job and the\
    \ machine’s requirements for each other. The machine can define the exact conditions\
    \ under which it is willing to be considered available for running jobs. The job\
    \ can define exactly what kind of machine it is willing to use.\n\nOnce a job\
    \ has been matched with a given machine, there are four states the job can be\
    \ in: running, suspended, graceful shutdown, and quick shutdown. As soon as the\
    \ match is made, the job sets up its execution environment and begins running.\n\
    \nWhile it is executing, a job can be suspended (for example, because of other\
    \ activity on the machine where it is running). Once it has been suspended, the\
    \ job can resume execution or can move on to preemption or eviction.\n\nAll Condor\
    \ jobs have two methods for preemption: graceful and quick. Graceful implies that\
    \ the program told to get off the system, but it is given time to clean up after\
    \ itself. A quick shutdown involves rapidly killing all processes associated with\
    \ a job, without giving them any time to execute their own cleanup procedures.\
    \ The Condor system performs checks to ensure that processes are not left behind\
    \ once a job is evicted from a given node.\n\n**Condor Policy Expressions.** Various\
    \ expressions are used to control the policy for starting, suspending, resuming,\
    \ and preempting jobs.\n\n+   START: when the `condor_startd` is willing to start\
    \ executing a job.\n+   \n+   RANK: how much the `condor_startd` prefers each\
    \ type of job running on it. The `RANK` expression is a floating-point instead\
    \ of a Boolean value. The `condor_startd` will preempt the job it is currently\
    \ running if there is another job in the system that yields a higher value for\
    \ this expression.\n+   \n+   WANT_SUSPEND: controls whether the `condor_startd`\
    \ should even consider suspending this job or not. In effect, it determines which\
    \ expression, `SUSPEND` or `PREEMPT`, should be evaluated while the job is running.\
    \ `WANT_SUSPEND` does not control when the job is actually suspended; for that\
    \ purpose, you should use the `SUSPEND` expression.\n+   \n+   SUSPEND: when the\
    \ `condor_startd` should suspend the currently running job. If `WANT_SUSPEND`\
    \ evaluates to `TRUE`, `SUSPEND` is periodically evaluated whenever a job is executing\
    \ on a machine. If `SUSPEND` becomes `TRUE`, the job will be suspended.\n+   \n\
    +   CONTINUE: if and when the `condor_startd` should resume a suspended job. The\
    \ `CONTINUE` expression is evaluated only while a job is suspended. If it evaluates"
  merge: -1
  img_proc: true
- pgno: 365
  md: 'to TRUE, the job will be resumed, and the `condor_startd` will go back to the
    Claimed/Busy state.


    PREEMPT: when the `condor_startd` should preempt the currently running job. This
    expression is evaluated whenever a job has been suspended. If `WANT_SUSPEND` evaluates
    to FALSE, `PREEMPT` is checked while the job is executing.


    `WANT_VACATE`: whether the job should be evicted gracefully or quickly if Condor
    is preempting a job (because the `PREEMPT` expression evaluates to TRUE). If `WANT_VACATE`
    is FALSE, the `condor_startd` will immediately kill the job and all of its child
    processes whenever it must evict the application. If `WANT_VACATE` is TRUE, the
    `condor_startd` performs a graceful shutdown, instead.


    KILL: when the `condor_startd` should give up on a graceful preemption and move
    directly to the quick shutdown.


    PREEMPTION_REQUIREMENTS: used by the `condor_negotiator` when it is performing
    matchmaking, not by the `condor_startd`. While trying to schedule jobs on resources
    in your pool, the `condor_negotiator` considers the priorities of the various
    users in the system (see Section 14.6.3 for more details). If a user with a better
    priority has jobs waiting in the queue and no resources are currently idle, the
    matchmaking will consider preempting another user''s jobs and giving those resources
    to the user with the better priority. This process is known as *priority preemption*.
    The `PREEMPTION_REQUIREMENTS` expression must evaluate to TRUE for such a preemption
    to take place.


    PREEMPTION_RANK: a floating-point value evaluated by the `condor_negotiator`.
    If the matchmaking decides it must preempt a job due to user priorities, the macro
    `PREEMPTION_RANK` determines which resource to preempt. Among the set of all resources
    that make the `PREEMPTION_REQUIREMENTS` expression evaluate to TRUE, the one with
    the highest value for `PREEMPTION_RANK` is evicted.


    # 14.5.4 Customizing Condor’s Other Configuration Settings


    In addition to the policy expressions, you will need to modify other settings
    to customize Condor for your cluster.


    `DAEMON_LIST`: the comma-separated list of daemons that should be spawned by the
    `condor_master`. As described in Section 14.3.1 discussing the architecture of
    Condor, each host in your pool can play different roles depending on which daemons
    are started on it. You define these roles using the `DAEMON_LIST` in the appropriate
    configuration files to enable or disable the various Condor daemons on each host.'
  merge: -1
  img_proc: true
- pgno: 366
