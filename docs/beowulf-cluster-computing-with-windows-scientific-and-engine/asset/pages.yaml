- pgno: 183
  md: '# 7.2 Basic Windows 2000 Cluster Installation Procedure


    We assume here that you have already installed a Windows 2000 domain along with
    Active Directory. You now are ready to install the cluster.


    +   1.  Set up your Windows 2000 domain. This step involves adding software and
    making necessary configuration changes so that the resources in the Windows domain
    will work the way compute nodes work in a cluster. Note that if the cluster is
    already part of your Windows 2000 domain, you do not have to establish a separate
    dedicated domain for a Windows 2000 cluster.


    +   2.  Set up your file server. This step is necessary so that, when you are
    ready to install the login and compute nodes, you will be able to refer to this
    resource. Recall that the file server can be accessed remotely via UNC or by mapping
    a drive to a share, either manually or using the Perl script provided earlier
    in this chapter.


    +   3.  Install your compute nodes. You can install each node manually, one by
    one, but this process is both time consuming and error prone. Alternatively, you
    can use a commercial package such as Symantec Ghost, Imagecast, or PCDRist that
    provides a mechanism to create a "node image," which you then use to install all
    the cluster compute nodes identically and in parallel. Details of creating and
    "pushing" node images are specific to the package you choose. Here, therefore,
    we simply describe the logical steps that you should follow in installing the
    cluster nodes.


    +   * Install one node completely, including drivers, software, and configuration
    customizations; however, do not install a scheduling system yet. If you have a
    heterogeneous cluster, you should install one node of each hardware configuration.


    +   * Use the tool called sysprep to remove all operating system and software
    information specific to that node, for example, Microsoft Security IDs and hostnames.
    (The sysprep tool is distributed on every Microsoft Windows Server CD.) Configuring
    your compute nodes to obtain an IP address via DHCP means that all networking
    information in the node image is identical from node to node. The following Web
    site provides a Web cast of how to use sysprep: support.microsoft.com/servicedesks/Webcasts/50\_Projects/so4/50BLUR4.ASP.


    +   * Create a node image using one of the several packages available. Then, "push"
    this image to all nodes with the same hardware configuration. Tools such as Ghost
    do this via network broadcast, so all machines that are booted in an appropriate
    state to accept an image (again tool specific) can read and install this image
    simultaneously.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '+   • Boot each node and, as it comes up, make local customizations such as
    its hostname. Then add the machine to your Windows 2000 domain. At this point
    you should have all your compute nodes set up and running as members of your Windows
    2000 domain. (We note that this technique can be used for any Windows 2000 domain
    members, not just cluster nodes. It is a convenient way to rapidly deploy new
    desktop machines, for example.)


    +   4. *Install a scheduling system.* Many scheduling systems are available; Chapter
    15 provides a good overview of the Maui scheduler, for instance. Scheduler installation
    can also include modifying access rights and permissions in the Windows 2000 domain.
    You can make these modifications through normal user and group interactions with
    Active Directory.


    +   5. *Install the login node or the interface commands.* Successful completion
    of this step will enable your users to begin using the cluster. As noted in Section
    7.1.3, login nodes may not be needed. Instead, you may simply need to install
    commands or graphical interfaces that allow users to check the cluster resources
    and job queues and to submit or remove jobs from the queues.


    # ### 7.3 Off and Running


    This chapter provides enough information for you to set up and begin using a reasonably
    large Windows 2000 high-performance cluster. Although other strategies are available,
    the general process and procedure described here are sufficient for most types
    of installation.'
  merge: -1
  img_proc: true
