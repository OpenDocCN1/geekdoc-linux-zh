- pgno: 30
  md: '# # 1 Introduction


    *Thomas Sterling*


    Clustering is a powerful concept and technique for deriving extended capabilities
    from existing classes of components. In nature, clustering is a fundamental mechanism
    for creating complexity and diversity through the aggregation and synthesis of
    simple basic elements. The result is no less than the evolution and structure
    of the universe, the compound molecules that dictate the shape and attributes
    of all materials and the form and behavior of all multicellular life, including
    ourselves. To accomplish such synthesis, an intervening medium of combination
    and exchange is required that establishes the interrelationships among the constituent
    elements and facilitates their cooperative interactions from which is derived
    the emergent behavior of the compound entity. For compound organizations in nature,
    the binding mechanisms may be gravity, coulombic forces, or synaptic junctions.
    In the field of computing systems, clustering is being applied to render new systems
    structures from existing computing elements to deliver capabilities that through
    other approaches could easily cost ten times as much. In recent years clustering
    hardware and software have evolved so that today potential user institutions have
    a plethora of choices in terms of form, scale, environments, cost, and means of
    implementation to meet their scalable computing requirements. Some of the largest
    computers in the world are cluster systems. But clusters are also playing important
    roles in medium-scale technical and commerce computing, taking advantage of low-cost,
    mass-market PC-based computer technology. These Beowulf-class systems have become
    extremely popular, providing exceptional price/performance, flexibility of configuration
    and upgrade, and scalability to provide a powerful new tool, opening up entirely
    new opportunities for computing applications.


    # ## 1.1 Definitions and Taxonomy


    In the most general terms, a cluster is any ensemble of independently operational
    elements integrated by some medium for coordinated and cooperative behavior. This
    is true in biological systems, human organizations, and computer structures. Consistent
    with this broad interpretation, computer clusters are ensembles of independently
    operational computers integrated by means of an interconnection network and supporting
    user-accessible software for organizing and controlling concurrent computing tasks
    that may cooperate on a common application program or workload. There are many
    kinds of computer clusters, ranging from among the world''s largest computers
    to collections of throwaway PCs. Clustering was among the first computer system
    architecture techniques for achieving significant improvements in'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'overall performance, user access bandwidth, and reliability. Many research
    clusters have been implemented in industry and academia, often with proprietary
    networks and/or custom processing nodes.


    Commodity clusters are local ensembles of computing nodes that are commercially
    available systems employed for mainstream data-processing markets. The interconnection
    network used to integrate the compute nodes of a commodity cluster is dedicated
    to the cluster system and is also commercially available from its manufacturer.
    The network is dedicated in the sense that it is used internally within the cluster
    supporting only those communications required between the compute nodes making
    up the cluster, its host or master nodes, which are themselves "worldly," and
    possibly the satellite nodes responsible for managing mass storage resources that
    are part of the cluster. The network of a commodity cluster must not be proprietary
    to the cluster product of a single vendor but must be available for procurement,
    in general, for the assembly of any cluster. Thus, all components of a commodity
    cluster can be bought by third-party systems integrators or the end-user installation
    site itself. Commodity clusters employ software, which is also available to the
    general community. Software can be free, repackaged and distributed for modest
    cost, or developed by third-party independent software vendors (ISVs) and commercially
    marketed. Vendors may use and distribute as part of their commodity cluster products
    their own proprietary software as long as alternate external software is available
    that could be employed in its place. The twin motivating factors that drive and
    restrict the class of commodity computers is (1) their use of nonspecialty parts
    that exploits the marketplace for cost reduction and stable reliability and (2)
    the avoidance of critical unique solutions restricted to a specific cluster product
    that if unavailable in the future would disrupt end-user productivity and jeopardize
    user investment in code base.


    Beowulf-class systems are commodity clusters that exploit the attributes derived
    from mass-market manufacturing and distribution of consumer-grade digital electronic
    components. Beowulfs are made of PCs, sometimes lots of them; cheap EIDE (enhanced
    integrated drive electronics) (usually) hard disks; and low-cost DIMMs (dual inline
    memory modules) for main memory. A number of different micro-processor families
    have been used successfully in Beowulfs, including the long-lasting Intel X86
    family (80386 and above), their AMD binary compatible counterparts, the Compaq
    Alpha 64-bit architecture, and the IBM PowerPC series. Beowulf systems deliver
    exceptional price/performance for many applications. They use low cost/no cost
    software to manage the individual nodes and the ensemble as a whole. A large part
    of the scientific and technical community using Beowulf has employed the Linux
    open source operating system, while many of the business and commer-'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'cial users of Beowulf support the widely distributed commercial Microsoft Windows
    operating system. Both types of Beowulf system use middleware that is a combina-tion
    of free open software and commercial ISV products. Many of these tools have been
    ported to both environments, although some still are restricted to one or the
    other environment. The nodes of Beowulfs are either uniprocessor or symmetric
    multiprocessors (SMPs) of a few processors. The price/performance sweet spot ap-pears
    to be the dual-node SMP systems, although performance per microprocessor is usually
    less than for single-processor nodes. Beowulf-class systems are by far the most
    popular form of commodity cluster today.


    At the other end of the cluster spectrum are the constellations. A constellation
    is a cluster of large SMP nodes scaled such that the number of processors per
    node is greater than the number of such nodes making up the entire system. This
    is more than an arbitrary distinction. Performance of a cluster for many applica-tions
    is derived through program and system parallelism. For most commodity clusters
    and Beowulf systems, the primary parallelism exploited is the internode parallelism.
    But for clusters, the primary parallelism is intranode, meaning most of the parallelism
    used is within the node. Generally, processors within an SMP node are more tightly
    coupled through shared memory and can exploit finer-grained parallelism than can
    Beowulf clusters. But shared-memory systems require the use of a different programming
    model that of distributed-memory systems, and therefore programming constellations
    may prove rather different from programming Beowulf clusters for optimal performance.
    Constellations are usually restricted to the largest systems.


    # # 1.2 Opportunities and Advantages


    Commodity clusters and Beowulf-class systems bring many advantages to scalable
    parallel computing, opening new opportunities for users and application domains.
    Many of these advantages are a consequence of superior price/performance over
    many other types of system of comparable peak capabilities. But other impor-tant
    attributes exhibited by clusters are due to the nature of their structure and
    method of implementation. Here we highlight and expand on these, both to mo-tivate
    the deployment and to guide the application of Beowulf-class systems for myriad
    purposes.


    Capability Scaling. More than even cost effectiveness, a Beowulf system’s prin-ciple
    attribute is its scalability. Through the aggregation of commercial off-the-shelf
    components, ensembles of specific resources deemed critical to a particular'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'mode of operation can be integrated to provide a degree of capability not easily
    acquired through other means. Perhaps most well known in high-end computing circles
    is peak performance measured in flops (floating-point operations per second).
    Even modest Beowulf systems can attain a peak performance between 10 and 100 gigaflops.
    The largest commodity cluster under development will achieve 30 teraflops peak
    performance. But another important capability is mass storage, usually through
    collections of hard disk drives. Large commodity disks can contain more than 100
    gigabytes, but commercial database and scientific data-intensive applications
    both can demand upwards of 100 terabytes of on-line storage. In addition, certain
    classes of memory intensive applications such as those manipulating enormous matrices
    of multivariate data can be processed effectively only if sufficient hardware
    main memory is brought to bear on the problem. Commodity clusters provide one
    method of accumulating sufficient DRAM (dynamic random access memory) in a single
    composite system for these large datasets. We note that while clusters enable
    aggregation of resources, they do so with limited coupling, both logical and physical,
    among the constituent elements. This fragmentation within integrated systems can
    negatively impact performance and ease of use.


    # Convergence Architecture


    Not anticipated by its originators, commodity clusters and Beowulf-class systems
    have evolved into what has become the de facto standard for parallel computer
    structure, having converged on a communitywide system architecture. Since the
    mid-1970s, the high-performance computing industry has dragged its small user
    and customer base through a series of often-disparate parallel architecture types,
    requiring major software rework across successive generations. These changes were
    often a consequence of individual vendor decisions and resulted in low customer
    confidence and a strong reticence to invest in porting codes to a system that
    could easily be obsolete before the task was complete and incompatible with any
    future generation systems. Commodity clusters employing communitywide message-passing
    libraries offer a common structure that crosses vendor boundaries and system generations,
    ensuring software investment longevity and providing customer confidence. Through
    the evolution of clusters, we have witnessed a true convergence of parallel system
    architectures, providing a shared framework in which hardware and software suppliers
    can develop products with the assurance of customer acceptance and application
    developers can devise advanced user programs with the confidence of continued
    support from vendors.


    # Price/Performance


    No doubt the single most widely recognized attribute of Beowulf-class cluster
    systems is their exceptional cost advantage compared with other parallel computers.
    For many (but not all) user applications and workloads,'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Beowulf clusters exhibit a performance-to-cost advantage of as much as an order
    of magnitude or more compared with massively parallel processors (MPPs) and distributed
    shared-memory systems of equal scale. Today, the cost of Beowulf hardware is approaching
    one dollar per peak megaflops using consumer-grade computing nodes. The implication
    of this is far greater than merely the means of saving a little money. It has
    caused a revolution in the application of high-performance computing to a range
    of problems and users who would otherwise be unable to work within the regime
    of supercomputing. It means that for the first time, computing is playing a role
    in industry, commerce, and research unaided by such technology. The low cost has
    made Beowulfs ideal for educational platforms, enabling the training in parallel
    computing principles and practices of many more students than previously possible.
    More students are now learning parallel programming on Beowulf-class systems than
    all other types of parallel computer combined.


    **Flexibility of Configuration and Upgrade.** Depending on their intended user
    and application base, clusters can be assembled in a wide array of configurations,
    with very few constraints imposed by commercial vendors. For those systems configured
    at the final site by the intended administrators and users, a wide choice of components
    and structures is available, making possible a broad range of systems. Where clusters
    are to be dedicated to specific workloads or applications, the system structure
    can be optimized for the required capabilities and capacities that best suit the
    nature of the problem being computed. As new technologies emerge or additional
    financial resources are available, the flexibility with which clusters are inuned
    is useful for upgrading existing systems with new component technologies as a
    midlife “kicker” to extend the life and utility of a system by keeping it current.


    **Technology Tracking.** New technologies most rapidly find their way into those
    products likely to provide the most rapid return: mainstream high-end personal
    computers and SMP servers. Only after substantial lag time might such components
    be incorporated into MPPs. Clustering, however, provides an immediate path to
    integration of the latest technologies, even those that may never be adopted by
    other forms of high-performance computer systems.


    **High Availability.** Clusters provide multiple redundant identical resources
    that, if managed correctly, can provide continued system operation through graceful
    degradation even as individual components fail.


    **Personal Empowerment.** Because high-end cluster systems are derived from readily
    available hardware and software components, installation sites, their system'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'administrators, and users have more control over the structure, elements, operation,
    and evolution of this system class than over any other system. This sense of control
    and flexibility has provided a strong attractor to many, especially those in the
    research community, and has been a significant motivation for many installations.


    **Development Cost and Time.** The emerging cluster industry is being fueled by
    the very low cost of development and the short time to product delivery. Based
    on existing computing and networking products, vendor-supplied commodity clusters
    can be developed through basic systems integration and engineering, with no component
    design required. Because the constituent components are manufactured for a much
    larger range of user purposes than is the cluster market itself, the cost to the
    supplier is far lower than custom elements would otherwise be. Thus commodity
    clusters provide vendors with the means to respond rapidly to diverse customer
    needs, with low cost to first delivery.


    # ## 1.3 A Short History


    Cluster computing originated within a few years of the inauguration of the modern
    electronic stored-program digital computer. SAGE was a cluster system built for
    NORAD under Air Force contract by IBM in the 1950s based on the MIT Whirl-wind
    computer architecture. Using vacuum tube and core memory technologies, SAGE consisted
    of a number of separate standalone systems cooperating to manage early warning
    detection of hostile airborne intrusion of the North American continent. Early
    commercial applications of clusters employed paired loosely coupled computers,
    with one computer performing user jobs while the other managed various input/output
    devices.


    Breakthroughs in enabling technologies occurred in the late 1970s, both in hardware
    and software, which were to have significant long-term effects on future cluster
    computing. The first generations of microprocessors were designed with the initial
    development of VLSI (very large scale integration) technology, and by the end
    of the decade the first workstations and personal computers were being marketed.
    The advent of Ethernet provided the first widely used local area network technology,
    creating an industry standard for a modestly priced multidrop interconnection
    medium and data transport layer. Also at this time, the multitasking Unix operating
    system was created at AT&T Bell Labs and extended with virtual memory and network
    interfaces at the University of California-Berkeley. Unix was adopted in its various
    commercial and public domain forms by the scientific and technical'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'computing community as the principal environment for a wide range of computing
    system classes from scientific workstations to supercomputers.


    During the decade of the 1980s, increased interest in the potential of cluster
    computing was marked by important experiments in research and industry. A collection
    of 160 interconnected Apollo workstations was employed as a cluster to perform
    certain computational tasks by the National Security Agency. Digital Equipment
    Corporation developed a system comprising interconnect VAX 11/750 computers, coining
    the term “cluster” in the process. In the area of software, task management tools
    for employing workstation farms were developed, most notably the Condor software
    package from the University of Wisconsin. Different strategies for parallel processing
    were explored during this period by the computer science research community. From
    this early work came the communicating sequential processes model more commonly
    referred to as the message-passing model, which has come to dominate much of cluster
    computing today.


    An important milestone in the practical application of the message-passing model
    was the development of PVM (Parallel Virtual Machine), a library of linkable functions
    that could allow routines running on separate but networked computers to exchange
    data and coordinate their operation. PVM (developed by Oak Ridge Na-tional Laboratory,
    Emery University, and the University of Tennessee) was the first widely deployed
    distributed software system available across different platforms. By the beginning
    of the 1990s, a number of sites were experimenting with clusters of workstations.
    At the NASA Lewis Research Center, a small cluster of IBM work-stations was used
    to simulate the steady-state behavior of jet aircraft engines in 1992. The NOW
    (network of workstations) project at UC Berkeley began operating the first of
    several clusters there in 1993, which led to the first cluster to be entered on
    the Top500 list of the world’s most powerful computers. Also in 1993, Myrinet,
    one of the first commercial system area networks, was introduced for commodity
    clusters, delivering improvements in bandwidth and latency an order of magnitude
    better than the Fast Ethernet local area network (LAN) most widely used for the
    purpose at that time.


    The first Beowulf-class PC cluster was developed at the NASA Goddard Space Flight
    center in 1994 using early releases of the Linux operating system and PVM running
    on 16 Intel 100 MHz 80486-based personal computers connected by dual 10 Mbps Ethernet
    LANs. The Beowulf project developed the necessary Ether-net driver software for
    Linux and additional low-level cluster management tools and demonstrated the performance
    and cost effectiveness of Beowulf systems for real-world scientific applications.
    That year, based on experience with many other message-passing software systems,
    the first Message-Passing Interface (MPI) stan-'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'dard was adopted by the parallel computing community to provide a uniform set
    of message-passing semantics and syntax. MPI has become the dominant parallel
    computing programming standard and is supported by virtually all MPP and cluster
    system vendors. Workstation clusters running Sun Microsystems Solaris operating
    system and NCSA''s PC cluster running the Microsoft NT operating system were being
    used for real-world applications.


    In 1996, the DOE Los Alamos National Laboratory and the California Institute of
    Technology with the NASA Jet Propulsion Laboratory independently demonstrated
    sustained performance of over 1 GFlops for Beowulf systems costing under $50,000
    and was awarded the Gordion Bell Prize for price/performance for this accomplishment.
    By 1997, Beowulf-class systems of over a hundred nodes had demonstrated sustained
    performance of greater than 10 GFlops, with a Los Alamos system making the Top500
    list. By the end of the decade, 28 clusters were on the Top500 list with a best
    performance of over 200 GFlops. In 2000, both DOE and NSF announced awards to
    Compaq to implement their largest computing facilities, both clusters of 30 TFlops
    and 6 TFlops, respectively.


    # 1.4 Elements of a Cluster


    A Beowulf cluster comprises numerous components of both hardware and software.
    Unlike pure closed-box turnkey mainframes, servers, and workstations, the user
    or hosting organization has considerable choice in the system architecture of
    a cluster, whether it is to be assembled on site from parts or provided by a systems
    integrator or vendor. A Beowulf cluster system can be viewed as being made up
    of four major components, two hardware and two software. The two hardware components
    are the compute nodes that perform the work and the network that interconnects
    the node to form a single system. The two software components are the collection
    of tools used to develop user parallel application programs and the software environment
    for managing the parallel resources of the Beowulf cluster. The specification
    of a Beowulf cluster reflects user choices in each of these domains and determines
    the balance of cost, capacity, performance, and usability of the system.


    The hardware node is the principal building block of the physical cluster system.
    After all, it is the hardware node that is being clustered. The node incorporates
    the resources that provide both the capability and capacity of the system. Each
    node has one or more microprocessors that provide the computing power of the node
    combined on the node''s motherboard with the DRAM main memory and the I/O interfaces.
    In addition the node will usually include one or more hard disk drives'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'for persistent storage and local data buffering although some clusters employ
    nodes that are diskless to reduce both cost and power consumption as well as increase
    reliability.


    The network provides the means for exchanging data among the cluster nodes and
    coordinating their operation through global synchronization mechanisms. The subcomponents
    of the network are the network interface controllers (NIC), the network channels
    or links, and the network switches. Each node contains at least one NIC that performs
    a series of complex operations to move data between the external network links
    and the user memory, conducting one or more transformations on the data in the
    process. The channel links are usually passive, consisting of a single wire, multiple
    parallel cables, or optical fibers. The switches interconnect a number of channels
    and route messages between them. Networks may be characterized by their topology,
    their bisection and per channel bandwidth, and the latency for message transfer.


    The software tools for developing applications depend on the underlying programming
    model to be used. Fortunately, within the Beowulf cluster community, there has
    been a convergence of a single dominant model: communicating sequential processes,
    more commonly referred to as message passing. The message-passing model implements
    concurrent tasks or processes on each node to do the work of the application.
    Messages are passed between these logical tasks to share data and to synchronize
    their operations. The tasks themselves are written in a common language such as
    Fortran or C++. A library of communicating services is called by these tasks to
    accomplish data transfers with tasks being performed on other nodes. While many
    different message-passing languages and implementation libraries have been developed
    over the past two decades, two have emerged as dominant: PVM and MPI (with multiple
    library implementations available for MPI).


    The software environment for the management of resources gives system administrators
    the necessary tools for supervising the overall use of the machine and gives users
    the capability to schedule and share the resources to get their work done. Several
    schedulers are available and discussed in this book. For coarse-grained job stream
    scheduling, the popular Condor scheduler is available. PBS, the Maui scheduler,
    and the CTC Cluster Controller handle task scheduling for interactive concurrent
    elements. PBS also provides many of the mechanisms needed to handle user accounts.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Beowulf Cluster Computing is offered as a fully comprehensive discussion of
    the foundations and practices for the operation and application of commodity clusters
    with an emphasis on those derived from mass-market hardware components and readily
    available software. The book is divided into three broad topic areas. Part I describes
    the hardware components that make up a Beowulf system and shows how to assemble
    such a system as well as take it out for an initial spin using some readily available
    parallel benchmarks. Part II discusses the concepts and techniques for writing
    parallel application programs to run on a Beowulf using the two dominant communitywide
    standards, PVM and MPI. Part III explains how to manage the resources of Beowulf
    systems, including system administration and task scheduling. Each part is standalone;
    any one or pair of parts can be used without the need of the others. In this way,
    you can just jump into the middle to get to the necessary information fast. To
    help in this, Chapter 2 (the next chapter) provides an overview and summary of
    all of the material in the book. A quick perusal of that chapter should give enough
    context for any single chapter to make sense without your having to have read
    the rest of the book.


    The Beowulf book presents three kinds of information to best meet the requirements
    of the broad and varied cluster computing community. It includes foundation material
    for students and people new to the field. It also includes reference material
    in each topic area, such as the major library calls to MPI and PVM and the basic
    controls for PBS. And, it gives explicit step-by-step guidance on how to accomplish
    specific tasks such as assembling a processor node from basic components or installing
    the Maui scheduler.


    This book can be used in many different ways. We recommend just sitting down and
    perusing it for an hour or so to get a good feel for where the information is
    that you would find most useful. Take a walk through Chapter 2 to get a solid
    overview. Then, if you''re trying to get a job done, go after that material germane
    to your immediate needs. Or if you are a first-time Beowulf user and just learning
    about cluster computing, use this as your guide through the field. Every section
    is designed both to be interesting and to teach you how to do something new and
    useful.


    One major challenge was how to satisfy the needs of the majority of the commodity
    cluster community when a major division exists across the lines of the operating
    system used. In fact, at least a dozen different operating systems have been used
    for cluster systems. But the majority of the community use either Linux or Windows.
    The choice of which of the two to use depends on many factors, some of them purely'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'subjective. We therefore have taken the unprecedented action of offering a
    choice: we''ve crafted two books, mostly the same, but differing between the two
    operating systems. So, you are holding either *Beowulf Cluster Computing with
    Windows* or *Beowulf Cluster Computing with Linux*. Whichever works best for you,
    we hope you find it the single most valuable book on your shelf for making clusters
    and for making clusters work for you.'
