  md: '# **15.5 Troubleshooting**


    When troubleshooting scheduling issues, you should start with Maui''s diagnostic
    and informational commands. The **diagnose** command together with **checknode**
    and **checkjob** provides detailed state information about the scheduler, including
    its various facilities, nodes, and jobs. Additionally, each of these commands
    initiates an extensive internal sanity check in the realm of interest. Results
    of this check are reported in the form of **WARNING** messages appended to the
    normal command output. Use of these commands typically identifies or resolves
    95 percent of all scheduling issues.


    If you need further information, Maui writes out detailed logging information
    in the directory pointed to by the `LOGFILE` parameter (usually in `\$\{MAUIHOME\};/log/maui.log`).
    Using the `LOGLEVEL` and `LOGFACILITY` parameters, you can control the verbosity
    and focus of these logs. (Note, however, that these logs can become very verbose,
    so keeping the `LOGLEVEL` below 4 or so unless actually tracking problems is advised.)
    These logs contain a number of entries, including the following:


    +   *   **INFO**: provides status information about normal scheduler operations.

    +   *   **WARNING**: indicates that an unexpected condition was detected and handled.

    +   *   **ALERT**: indicates that an unexpected condition occurred that could
    not be fully handled.

    +   *   **ERROR**: indicates that problem was detected that prevents Maui from
    fully operating. This may be a problem with the cluster that is outside of Maui''s
    control or may indicate corrupt internal state information.

    +   *   **Function header**: indicates when a function is called and the parameters
    passed.


    A simple `grep` through the log file will usually indicate whether any serious
    issues have been detected and is of significant value when obtaining support or
    locally diagnosing problems. If neither commands nor logs point to the source
    of the problem, you may consult the Maui users list (`maui-users@supercluster.org`)
    or directly contact Supercluster support at `support@supercluster.org`.


    # **15.6 Conclusions**


    This chapter has introduced some of the key Maui features currently available.
    With hundreds of sites now using and contributing to this open source project,
    Maui is'
  merge: -1
  img_proc: true
