- pgno: 304
  md: 'execution. A time display specifies the number of seconds from when the trace
    display began.


    The \textit{Views} button allows you to open or close any of several views presently
    supplied with XPVM. These views are described below.


    During startup, XPVM joins a group called \texttt{xpvm}. This is done so tasks
    that are started outside the XPVM interface can get the tid of XPVM by doing\
    \texttt{tid = pvm.gettid( xpvm, 0 )}. This tid would be needed if you wanted to
    manually turn on tracing inside such a task and pass the events back to XPVM for
    display. The expected TraceCode for these events is \textbf{666}.




    # 11.10.1 Network View


    The \textit{Network} view displays the present virtual machine configuration and
    the activity of the hosts. Each host is represented by an icon that includes the
    \texttt{PVM\_ARCH} and hostname inside the icon. In the current release of XPVM,
    the icons are arranged arbitrarily on both sides of a bus network. In future releases
    the view will be extended to visualize network activity as well. At that time
    you will be able to specify the network topology to display.


    These icons are illumined in different colors to indicate their status in executing
    PVM tasks. Green implies that at least one task on that host is busy executing
    useful work. Yellow indicates that no tasks are executing user computation but
    at least one task is busy executing PVM system routines. When there are no tasks
    on a given host, its icon is left uncolored or white. The specific colors used
    in each case are user customizable.


    You can tell at a glance how well the virtual machine is being utilized by your
    PVM application. If all the hosts are green most of the time, then machine utilization
    is good. The Network view does not display activity due to other users’ PVM jobs
    or other processes that may be running on the hosts.


    In future releases the view will allow you to click on a multiprocessor icon and
    get information about the number of processors, number of PVM tasks, and the like
    that are running on the host.


    # 11.10.2 Space-Time View


    The \textit{Space-time} view displays the activities of individual PVM tasks that
    are running on the virtual machine. Listed on the left-hand side of the view are
    the executable names of the tasks preceded by the host they are running on. The
    task list is sorted by host so that it is easy to see whether tasks are being
    clumped on'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'one host. This list also shows the task to host mappings (which are not available
    in the Network view).


    The Space-time view combines three different displays. The first is like a Gantt
    chart. Beside each listed task is a horizontal bar stretching out in the “time”
    direction. The color of this bar at any time indicates the state of the task.
    Green indicates that user computations are being executed. Yellow marks the times
    when the task is executing PVM routines. White indicates when a task is waiting
    for messages. The bar begins at the time when the task starts executing and ends
    when the task exits normally. The specific colors used in each case are user customizable.


    The second display overlays the first display with the communication activity
    among tasks. When a message is sent between two tasks, a red line is drawn starting
    at the sending task’s bar at the time the message is sent and ending at the receiving
    task’s bar when the message is received. Note that this is not the time the message
    arrived, but rather the time the task called `pvm_recv()`. Visually, the patterns
    and slopes of the red lines combined with white “waiting” regions reveal a lot
    about the communication efficiency of an application.


    The third display appears only when you click on interesting features of the Space-time
    view with the left mouse button. A small “pop-up” window appears, giving detailed
    information regarding specific task states or messages. If a task bar is clicked
    on, the state begin and end times are displayed along with the last PVM system
    call information. If a message line is clicked on, the window displays the send
    and receive time as well as the number of bytes in the message and the message
    tag.


    When the mouse is moved inside the Space-time view, a blue vertical line tracks
    the cursor, and the time corresponding to this vertical line is displayed as Query
    time at the bottom of the display. This vertical line also appears in the other
    “something vs. time” views so you can correlate a feature in one view with information
    given in another view.


    You can zoom into any area of the Space-time view by dragging the vertical line
    with the middle mouse button. The view will unzoom back one level when the right
    mouse button is clicked. Often, very fine communication or waiting states are
    visible only when the view is magnified with the zoom feature. As with the Query
    time, the other views also zoom along with the Space-time view.


    # **11.10.3 Other Views**


    XPVM is designed to be extensible. New views can be created and added to the Views
    menu. At present, there are three other views: Utilization, Call Trace, and Task
    Output. Unlike the Network and Space-time views, these views are closed'
