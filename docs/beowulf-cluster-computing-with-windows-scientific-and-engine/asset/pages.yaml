- pgno: 140
  md: 'may be adequate. Other vendors with large Fast Ethernet switches include Hewlett
    Packard, Cisco, and Extreme.


    # 5.3.6  An Example of a Myrinet Interconnected Cluster


    The Chiba City cluster at Argonne National Laboratory has two discrete networks:
    (1) a Myrinet network consisting of 5 Clos switches, 4 Spine switches, and 320
    host ports, and (2) a Fast/Gigabit Ethernet network consisting of 10 Cisco Catalyst
    4000s and a Catalyst C6509 with 480 Fast Ethernet ports and 102 Gigabit Ethernet
    ports. The Myrinet network is used primarily as the system interconnect; however,
    if need be, Ethernet can be used as well. The Myrinet topology is symmetric, as
    is the Ethernet topology. Each spine switch has 128 network ports, with connections
    to all of the Clos switches in the network, but no connections to other spines.
    Each Myrinet Clos switch has 64 host ports and 64 network (switch interconnect)
    ports. Each Clos has its network ports distributed across all four spine switches.
    This yields 4096 potential routes from any given node to any other node in the
    network. This is required to guarantee full bisectional bandwidth for all possible
    workloads.


    The Ethernet network is also fairly symmetric. Each group of 32 nodes and their
    management node are connected to a Catalyst 4000. Each of the 32 nodes is connected
    with Fast Ethernet, and the manager is connected with Gigabit Ethernet. Each of
    these switches has dual gigabit uplinks to the core Catalyst C6509. Because of
    the oversubscription of uplinks between each Catalyst 4000 and the core C6509,
    this network does not have full bisectional bandwidth. If this were primarily
    an interconnect network, and full bisectional bandwidth were important, this could
    be remedied by upgrading all switch uplinks from dual to quad gigabit connections.'
