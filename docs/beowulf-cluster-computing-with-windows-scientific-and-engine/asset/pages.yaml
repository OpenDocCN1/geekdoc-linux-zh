    \n![](img/e2283ffaea56e577ac05056b4bb738fc_254_0.png)\n\nThe C++ binding for MPI\
    \ has a few quirks. One is that the multiple completion operations such as **MPI::Waitall**\
    \ are methods on requests, even though there is no unique request to use for these\
    \ methods. Another is the C++ analogue to **MPI\\_Comm\\_dup**. In the C++ binding,\
    \ **MPI::Comm** is an abstract base class (ABC). Since it is impossible to create\
    \ an instance of an abstract base class, there can be no general “dup” function\
    \ that returns a new **MPI::Comm**. Since it is possible in C++ to create a reference\
    \ to an ABC, however, MPI defines the routine (available only in the C++ binding)\
    \ **MPI::Clone** that returns a reference to a new communicator.\n\nTwo levels\
    \ of Fortran 90 support are provided in MPI. The basic support provides an **mpi.f**\
    \ include file. The extended support provides an **MPI** module. The module makes\
    \ it easy to detect the two most common errors in Fortran MPI programs: forgetting\
    \ to provide the variable for the error return value and forgetting to declare\
    \ **status** as an array of size **MPI\\_STATUS\\_SIZE**. There are a few drawbacks."
