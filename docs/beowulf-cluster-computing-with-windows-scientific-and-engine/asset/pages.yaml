  md: 'pvm> and accepts commands from standard input. The available commands are as
    follows:


    +   add followed by one or more hostnames, adds these hosts to the virtual machine.


    +   alias defines or lists command aliases.


    +   conf lists the configuration of the virtual machine including hostname, pvmd
    task ID, architecture type, and a relative speed rating.


    +   delete followed by one or more hostnames, deletes these hosts from the virtual
    machine. PVM processes still running on these hosts are lost .


    +   echo echoes arguments.


    +   halt kills all PVM processes including console and then shuts down PVM. All
    daemons exit.


    +   help can be used to get information about any of the interactive commands.
    The help command may be followed by a command name that will list options and
    flags available for this command.


    +   id prints console task id.


    +   jobs lists running jobs.'
