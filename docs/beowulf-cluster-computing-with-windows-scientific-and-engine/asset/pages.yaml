    services. In the registry, the `type` code indicates whether the service runs
    in its own process or shares a process with other services in the image.


    A number of Windows 2000 components are implemented as services, such as the spooler,
    event log, task scheduler, and various other networking components. To list the
    installed services, select Administrative Tools from the Control Panel, and then
    select Services.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 4.4 Win32 API


    The Win32 application programming interface is the primary programming interface
    to the Microsoft Windows operating system family, including Windows 2000, Windows
    95, Windows 98, Windows Millenium Edition, and Windows CE. Each operating system
    implements a different subset of Win32. For the most part, Windows 2000 is a superset
    of all Win32 implementations.


    Although Windows 2000 was designed to support multiple programming interfaces,
    Win32 is the primary, or preferred, interface to the operating system. Win32 has
    this position because, of the three environment subsystems (Win32, POSIX, and
    OS/2), it provides the greatest access to the underlying Windows 2000 system services.


    The Win32 API documentation can be viewed on line at `msdn.microsoft.com`. It
    can also be installed by downloading the Platform SDK (available for free at `msdn.microsoft.com`).
    The Platform SDK contains the C header files and libraries necessary to compile
    and link Win32 applications. (Although Microsoft Visual C++ comes with a copy
    of these header files, the versions contained in the Platform SDK always match
    the latest version of the Windows operating systems, whereas the version that
    comes with Visual C++ might be an older version that was current when Visual C++
    was released.)


    The following is an overview of the major groups of Win32 system calls:


    +   - **Base services**: processes and threads, memory management, synchronization,
    device and file I/O, error handling, debugging, event *Logging*, interprocess
    communication, *power management*, and system configuration


    +   - **Graphics**: functions that deal with graphical output, such as bitmaps,
    pens, brushes, fonts, text, and colors


    +   - **Window management**: windows, desktops, mouse and keyboard input, buttons,
    cursors, dialog boxes, icons, menu, scroll bars, and other controls


    Note that these represent only the core system calls—the Platform SDK describes
    over 100 groups of functions for building applications, such as COM+ (a framework
    for building *n*-tier distributed applications), data services, multimedia, and
    Web services.


    # 4.5 Tools to Explore Windows 2000


    Many details about the internals of Windows 2000 can be exposed and demonstrated
    by using a variety of available tools, such as those that come with Windows'
  merge: -1
  img_proc: true
- pgno: 121
  md: '2000, the Windows 2000 Support Tools, the Windows 2000 resource kits, and the
    Windows debugging tools. These tool packages are briefly introduced next.


    # 4.5.1 Windows 2000 Support Tools


    The Windows 2000 Support Tools consist of about forty tools useful in admin- istering
    and troubleshooting Windows 2000 systems. Many of these tools were formerly part
    of the Windows NT 4 resource kits. You can install the Support Tools by running
    **Setup.exe** in the `\Support\Tools` folder on any Windows 2000 product distribution
    CD. (That is, the Support Tools are the same on Windows 2000 Professional, Server,
    and Advanced Server.)


    # 4.5.2 Windows 2000 Resource Kits


    The Windows 2000 resource kits supplement the Support Tools, adding some two hundred
    additional tools. Besides including many tools useful for displaying inter- nal
    system state, they contain useful internals documentation, such as the Registry
    Reference and Performance Counters help files. There are two editions of the re-
    source kits: the Windows 2000 Professional Resource Kit and the Windows 2000 Server
    Resource Kit. For updates to tools, as well as for new tools, see the Web site
    `www.reskit.com`.


    # 4.5.3 Debugging Tools


    The Debugging Tools for Windows package, available for download from `www.microsoft.com/ddk/debugging`,
    contains tools and documentation for advanced debugging and troubleshooting. For
    example, the package includes the Microsoft kernel debuggers, which, although
    used mainly for analyzing crash dumps or debug- ging device drivers, can also
    be used to investigate Windows 2000 internals because they can display internal
    system information not visible through any standard util- ity. For example, they
    can dump internal data structures such as thread blocks, process blocks, page
    tables, I/O, and pool structures. For more information, see the debugging tools
    help file included with this package. It explains how to set up and use the kernel
    debuggers (as well as other debugging and support tools that are part of the package).


    # 4.5.4 Device Driver Kit


    The Windows 2000 DDK is part of the MSDN Professional (and Universal) sub- scription,
    but it is also available for free download at `www.microsoft.com/ddk`. Although
    the DDK is aimed at device driver developers, the DDK is an abundant'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'source of Windows 2000 internals information. For example, the DDK documentation
    contains a comprehensive description of the Windows 2000 I/O system in both a
    tutorial and reference form, including the internal system routines and data structures
    used by device drivers. Besides the documentation, the DDK contains header files
    that define key internal data structures and constants as well as interfaces to
    many internal system routines (in particular, Wdm.h).


    # ### 4.5.5 Sysinternals Tools


    Another source of useful troubleshooting and analysis tools is www.sysinternals.com.'
  merge: -1
  img_proc: true
