  md: 'algorithm, but here we reassign the work. In fact, each worker can compute
    its set of tasks, and so the “manager” can be a worker, too, instead of just managing
    the pool of work. The more rectangles there are, the more work there is to do
    and the more accurate the resulting approximation of $\pi$ is. To experiment,
    let us make the number of subintervals a command-line argument. (Although the
    MPI standard does not guarantee that any process receives command-line arguments,
    in most implementations, especially for Beowulf clusters, one can assume that
    at least the process with rank 0 can use argc and argv, although they may not
    be meaningful until after MPI_Init is called.) In our example, process 0 sets
    n, the number of subintervals, to argv[1]. Once a process knows n, it can claim
    approximately 1/n of the work by claiming every nth rectangle, starting with the
    one numbered by its own rank. Thus process j computes the areas of rectangles
    j, j + n, j + 2n, and so on.


    Not all MPI implementations make the command-line arguments available to all processes,
    however, so we start by having process 0 send n to each of the other processes.
    We could have a simple loop, sending n to each of the other processes one at a
    time, but this is inefficient. If we know that the same message is to be delivered
    to all the other processes, we can ask the MPI implementation to do this in a
    more efficient way than with a series of MPI_Sends and MPI_Recvs.


    Broadcast (MPI_Bcast) is an example of an MPI collective operation. A collective
    operation must be called by all processes in a communicator. This allows an implementation
    to arrange the communication and computation specified by a collective operation
    in a special way. In the case of MPI_Bcast, an implementation is likely to use
    a tree of communication, sometimes called a spanning tree, in which process 0
    sends its message to a second process, then both processes send to two more, and
    so forth. In this way most communication takes place in parallel, and all the
    messages have been delivered in log2 n steps.


    The precise semantics of MPI_Bcast is sometimes confusing. The first three arguments
    specify a message with (address, count, datatype) as usual. The fourth argument
    (called the root of the broadcast) specifies which of the processes owns the data
    that is being sent to the other processes. In our case it is process 0. MPI_Bcast
    acts like an MPI_Send on the root process and like an MPI_Recv on all the other
    processes, but the call itself looks the same on each process. The last argument
    is the communicator that the collective call is over. All processes in the communicator
    must make this same call. Before the call, n is valid only at the root; after
    MPI_Bcast has returned, all processes have a copy of the value of n.


