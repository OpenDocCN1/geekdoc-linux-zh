    needs.


    Many of the Cluster CoNTroller commands are command shell executables that provide
    a way for wrapper scripts to be used to customize environments or define usage
    policies. For example, time limits can be enforced at submit time by rejecting
    jobs that request more time than is allowed at a particular site.


    Another useful feature of Cluster CoNTroller is that node features can be redefined
    on the fly, allowing administrators to allocate portions of the cluster to specific
