- pgno: 316
  md: "# **12.3 Adaptive Programs**\n\nIn this section, we use some more of the PVM\
    \ virtual machine functions to illustrate how cluster programs can be extended\
    \ to adapt not only to faults but also to many other metrics and circumstances.\
    \ The first example demonstrates a parallel application that dynamically adapts\
    \ the size of the virtual machine through adding and releasing nodes based on\
    \ the computational needs of the application. Such a feature is used every day\
    \ on a 128-processor Beowulf cluster at Oak Ridge National Laboratory that is\
    \ shared by three research groups.\n\n```\n```\nint numh = pvm_addhosts( char\
    \ **hosts, int nhost, int *infos)\nint numh = pvm_delhosts( char **hosts, int\
    \ nhost, int *infos)\n```\n```\n\nThe PVM addhosts and delhosts routines add or\
    \ delete a set of hosts in the virtual machine. In a Beowulf cluster this corresponds\
    \ to adding or deleting nodes from the computation; **numh** is returned as the\
    \ number of nodes successfully added or deleted. The argument **infos** is an\
    \ array of length **nhost** that contains the status code for each individual\
    \ node being added or deleted. This allows you to check whether only one of a\
    \ set of hosts caused a problem, rather than trying to add or delete the entire\
    \ set of hosts again.\n\n```\n```\n/*\n * Adaptive Host Allocation Example adds\
    \ and removes cluster nodes\n * from computation on the fly for different computational\
    \ phases\n */\n\n#include <stdio.h>\n#include <pvm3.h>\n\nstatic char *host_set_A[]\
    \ = { \"msr\", \"nova\", \"sun4\" };\nstatic int nhosts_A = sizeof( host_set_A\
