- pgno: 308
  md: '# **12 Fault-Tolerant and Adaptive Programs with PVM**


    *Al Geist and Jim Kohl*


    The use of Beowulf clusters has expanded rapidly in the past several years. Originally
    created by researchers to do scientific computing, today these clusters are being
    used in business and commercial settings where the requirements and expectations
    are quite different. For example, at a large Web hosting company the reliability
    and robustness of their applications are often more important than their raw performance.


    A number of factors must be considered when you are developing applications for
    Beowulf clusters. In the preceding chapters the basic methods of message passing
    were illustrated so that you could create your own parallel programs. This chapter
    describes the issues and common methods for making parallel programs that are
    fault tolerant and adaptive.


    *Fault tolerance* is the ability of an application to continue to run or make
    progress even if a hardware or software problem causes a node in the cluster to
    fail. It is also the ability to tolerate failures within the application itself.
    For example, one task inside a parallel application may get an error and abort.
    Because Beowulf clusters are built from commodity components that are designed
    for the desktop rather than heavy-duty computing, failures of components inside
    a cluster are higher than in a more expensive multiprocessor system that has an
    integrated RAS (Reliability, Availability, Serviceability) system.


    While fault-tolerant programs can be thought of as adaptive, the term “adaptive
    programs” is used here more generally to mean parallel (or serial) programs that
    dynamically change their characteristics to better match the application’s needs
    and the available resources. Examples include an application that adapts by adding
    or releasing nodes of the cluster according to its present computational needs
    and an application that creates and kills tasks based on what the computation
    needs.


    In later chapters you will learn about Condor and other resource management tools
    that automatically provide some measure of fault tolerance and adaptability to
    jobs submitted to them. This chapter teaches the basics of how to write such tools
    yourself.


    PVM is based on a dynamic computing model in which cluster nodes can be added
    and deleted from the computation on the fly and parallel tasks can be spawned
    or killed during the computation. PVM does not have nearly as rich a set of message-passing
    features as MPI; but, being a virtual machine model, PVM has a number of features
    that make it attractive for creating dynamic parallel programs. For this reason,
    PVM will be used to illustrate the concepts of fault tolerance and adaptability
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'A computational biologist at Oak Ridge National Laboratory wants to write an
    parallel application that runs 24/7 on his Beowulf cluster. The application involves
    calculations for the human genome and is driven by a constant stream of new data
    arriving from researchers all around the world. The data is not independent since
    new data helps refine and extend previously calculated sequences. How can he write
    such a program?


    A company wants to write an application to process a constant stream of sales
    orders coming in from the Web. The program needs to be robust, since down time
    costs not only the lost revenue stream but also wages of workers who are idle.
    The company has recently purchased a Beowulf cluster to provide a cost effective
    solution. But how do they write the fault-tolerant parallel program to run on
    the cluster?


    When you are developing algorithms that must be reliable the first consideration
    is the hardware. The bad news is that your Beowulf cluster will have failures;
    it will need maintenance. It is not a matter of whether some node in the cluster
    will fail but when. Experience has shown that the more nodes the cluster has,
    the more likely one will fail within a given time. How often a hardware failure
    occurs varies widely between clusters. Some have failures every week; others run
    for months. It is not uncommon for several nodes to fail at about the same time
    with similar hardware problems. Evaluate your particular cluster under a simulated
    load for a couple of weeks to get data on expected mean time between failures
    (MTBF). If the MTBF is many times longer than your average application run time,
    then it may not make sense to restructure the application to be fault tolerant.
    In most cases it is more efficient simply to rerun a failed application if it
    has a short run time.


    The second consideration is the fault tolerance of the underlying software environment.
    If the operating system is not stable, then the hardware is the least of your
    problems. The SVM system sits between the operating system and the application
    and, among other things, monitors the state of the virtual machine. The SVM system
    is designed to be fault tolerant and to reconfigure itself automatically when
    a failure is detected. It was discovered early in the SVM project that it doesn''t
    help your fault-tolerant application if the underlying failure detection system
    crashes during a failure. The SVM failure detection system is responsible for
    detecting problems and notifying running applications about the problem. It makes
    no attempt to recover a parallel application automatically.


    The third consideration is the application. Not every parallel application can
    recover from a failure; recovery depends on the design of the application and
    the'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'nature of the failure. For example, in the manager/worker programs of the preceding
    chapters, if the node that fails was running a worker, then recovery is possible;
    but if the node was running the manager, then key data may be lost that can’t
    be recovered.


    At the least, any parallel program can be made fault tolerant by restarting it
    automatically from the beginning if a failure is detected.


    Recovery of parallel programs is complicated because data in messages may be in
    flight when the recovery begins. There is a race condition. If the data did not
    arrive, then it will need to be resent as part of the recovery. But if the data
    managed to be received just before the recovery, then there isn’t an outstanding
    receive call, and the data shouldn’t be resent.


    File I/O is another problem that complicates recovery. File pointers may need
    to be reset to the last checkpoint to avoid getting a repeated set of output data
    in the file.


    Despite all these issues, a few common methods can be used to improve the fault
    tolerance of many parallel applications.


    # ## 12.2 Building Fault-Tolerant Parallel Applications


    From the application’s view three steps must be performed for fault tolerance:
    notification, recovery, and continue.


    The PVM system has a monitoring and notification feature built into it. Any or
    all tasks in an application can asked to be notified of specific events. These
    include the exiting of a task within the application. The requesting task can
    specify a particular task or set of tasks or can ask to be notified if any task
    within the application fails. In the last case the notification message contains
    the ID of the task that failed. There is no need for the notified task and the
    failed task ever to have communicated in order to detect the failure.


    The failure or deletion of a node in the cluster is another notify event that
    can be specified. Again the requesting application task can specify a particular
    node, set of nodes, or all nodes. And, as before, the notification message returns
    the ID of the failed node(s).


    The addition of one or more cluster nodes to the application’s computational environment
    is also an event that PVM can notify an application about. In this case no ID
    can be specified, and the notification message returns the ID of the new node(s).


    ```

    ```

    int info = pvm_notify ( int EventType, int msgtag, int cnt, int *ids )

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'The `EventType` options are `PvmTaskExit`, `PvmHostDelete`, or `PvmHostAdd`.
    A separate notify call must be made for each event type that the application wishes
    to be notified about. The `msgtag` argument specifies what message tag the task
    will be using to listen for events. The `cnt` argument is the number task or node
    IDs in the ids list for which notification is requested.


    Given the flexibility of the `pvm_notify` command, there are several options for
    how the application can be designed to receive notification from the PVM system.
    The first option is designating a separate watcher task. One or more of these
    watcher tasks are spawned across the cluster and often have the additional responsibility
    of managing the recovery phase of the application. The advantage of this approach
    is that the application code can remain cleaner. Note that in the manager/worker
    scheme the manager often assumes the additional duty as watcher.


    A second option is for the application tasks to watch each other. A common method
    is to have each task watch its neighbor in a logical ring. Thus each task just
    watches one or two other tasks. Another common, but not particularly efficient,
    method is to have every task watch all the other tasks. Remember that the PVM
    system is doing the monitoring, not the application tasks. So the monitoring overhead
    is the same with all these options. The difference is the number of notification
    messages that get sent in the event of a failure.


    Recovery is very dependent on the type of parallel algorithm used in the application.
    The most commonly used options are restart from the beginning, roll back to the
    last checkpoint, or reassign the work of a failed task.


    The first option is the simplest to implement but the most expensive in the amount
    of calculation that must be redone. This option is used by many batch systems
    because it requires no knowledge of the application. It guarantees that the application
    will complete even if failures occur, although it does not guarantee how long
    this will take. On average the time is less than twice the normal run time. For
    short-running applications this is the best option.


    For longer-running applications, checkpointing is a commonly used option. With
    this option you must understand the parallel application and modify it so that
    the application can restart from a input data file. You then have to modify the
    application to write out such a data file periodically. In the event of a failure,
    only computations from the last checkpoint are lost. The application restarts
    itself from the last successful data file written out. How often checkpoints are
    written out depends on the size of the restart file and how long the application
    is going to run. For large, scientific applications that run for days, checkpointing
    is typically done every few hours.'
  merge: -1
  img_proc: true
- pgno: 312
