  md: '**Authentication and authorization:** Administrators have fine-grained control
    of access permissions, and Condor can perform strong network authentication using
    a variety of mechanisms including the Microsoft Windows NT LAN Manager (NTLM)
    protocol routinely used on Windows NT and Windows 2000, as well as Kerberos and
    X.509 public key certificates.


    **Heterogeneous platforms:** In addition to Windows 2000, Condor has been ported
    to most of the primary flavors of Unix as well as Windows NT. A single pool can
    contain multiple platforms. Jobs to be executed under one platform may be submitted
    from a different platform. As an example, an executable that runs under Windows
