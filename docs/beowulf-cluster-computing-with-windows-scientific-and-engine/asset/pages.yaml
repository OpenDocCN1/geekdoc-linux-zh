    # 10.10.3 High Performance LINPACK


    Perhaps the best known benchmark in technical computing is the LINPACK Benchmark,
    discussed in Section 8.3. The version of this benchmark that is appropriate for
    clusters is the High Performance LINPACK (HPL). Obtaining and running this benchmark
    is relatively easy, though getting good performance can require a significant
    amount of effort. In addition, as pointed out in Section 8.3, while the LINPACK
    benchmark is widely known, it tends to significantly overestimate the achievable
    performance for many applications.


    The HPL benchmark depends on another library, the basic linear algebra subroutines
    (BLAS), for much of the computation. Thus, to get good performance on the HPL
    benchmark, you must have a high-quality implementation of the BLAS. Fortunately,
    several sources of these routines are available. You can often get implementations
    of the BLAS from the CPU vendor directly, sometimes at no cost.


    **HPL.** Download the HPL package from **www.netlib.org/benchmark/hpl**:


    ```

    % tar zxf hpl.tgz

    % cd hpl

    ```


    Create a `Make.archname` in the `hpl` directory. Consider an archname like `Win2k_P4_CBLAS_p4`
    for a Windows 2000 system on Pentium 4 processors, using the C version of the
    BLAS constructed by ATLAS, and using the `ch_p4` device from the MPICH implementation
    of MPI. To create this file, look at the samples in the `hpl/makes` directory,
    for example,


    ```

    % copy makes\Make.Linux_PII_CBLAS_gm Make.Win2k_P4_CBLAS_p4

    ```


    Edit this file, changing ARCH to the name you selected (e.g., `Win2k_P4_CBLAS_p4`),
    and set `Ladir` to the location of the ATLAS libraries. Then do the following:


    ```

    % make arch=<themame>

    % cd bin\<themame>

    % mpirun -np 4 xhpl.exe

    ```


    Check the output to make sure that you have the right answer. The file `HPL.dat`
    controls the actual test parameters. The version of `HPL.dat` that comes with
    the `hpl` package is appropriate for testing `hpl`. To run `hpl` for performance
