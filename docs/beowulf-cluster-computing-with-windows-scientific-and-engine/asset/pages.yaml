- pgno: 407
  md: '# 16.4.6 Configuring MOM


    The execution server daemons, MOMs, require much less configuration than does
    the Server. The installation process creates a basic MOM configuration file that
    contains the minimum entries necessary in order to run PBS jobs. This section
    describes the MOM configuration file and explains all the options available to
    customize the PBS installation to your site.


    The behavior of MOM is controlled via a configuration file that is read upon daemon
    initialization (startup) and upon reinitialization (when pbs_mom receives a SIGHUP
    signal). The configuration file provides several types of runtime information
    to MOM: access control, static resource names and values, external resources provided
    by a program to be run on request via a shell escape, and values to pass to internal
    functions at initialization (and reinitialization). Each configuration entry is
    on a single line, with the component parts separated by white space. If the line
    starts with a pound sign, the line is considered to be a comment and is ignored.


    A minimal MOM configuration file should contain the following:


    ```

    $logevent 0xiff

    $clienthost server-hostname

    ```


    The first entry, $logevent, specifies the level of message logging this daemon
    should perform. The second entry, $clienthost, identifies a host that is permitted
    to connect to this MOM. You should set the server-hostname variable to the name
    of the host on which you will be running the PBS Server (pbs_server). Advanced
    MOM configuration options are described in the PBS Administrator Guide.


    # 16.4.7 Scheduler Configuration


    Now that the Server and MOMs have been configured, we turn our attention to the
    PBS Scheduler. As mentioned previously, the Scheduler is responsible for implementing
    the local site policy regarding which jobs are run and on what resources. This
    section discusses the recommended configuration for a typical cluster. The full
    list of tunable Scheduler parameters and detailed explanation of each is provided
    in the PBS Administrator Guide.


    The PBS Pro Scheduler provides a wide range of scheduling policies. It provides
    the ability to sort the jobs in several different ways, in addition to FIFO order.
    It also can sort on user and group priority. The queues are sorted by queue priority
    to determine the order in which they are to be considered. As distributed, the
    Scheduler is configured with the defaults shown in Table 16.6.'
  merge: -1
  img_proc: true
