    and you will get the message “pvm already running” and the console prompt. When
    you are finished with the virtual machine you should type


    ```powershell

    pvm> halt

    ```


    This command kills any PVM tasks, shuts down the virtual machine, and exits the
    console. This is the recommended method to stop PVM because it makes sure that
    the virtual machine shuts down cleanly.


    You should practice starting and stopping and adding hosts to PVM until you are
    comfortable with the PVM console. A full description of the PVM console and its
    many command options is given in Sections 11.8 and 11.9.


    If you don’t wish to type in a bunch of hostnames each time, there is a hostfile
    option. You can list the hostnames in a file one per line and then type


    ```powershell

    > pvm hostfile

    ```


    PVM will then add all the listed hosts simultaneously before the console prompt
    appears. Several options can be specified on a per host basis in the hostfile;
    see Section 11.9 if you wish to customize your virtual machine for a particular
    application or environment.


    PVM may also be started in other ways. The functions of the console and a performance
    monitor have been combined in a graphical user interface called XPVM, which is
    available from the PVM web site. If XPVM has been installed at your site, then
    it can be used to start PVM. To start PVM with this interface type:


    ```powershell

    > xpvm

    ```


    The menu button labeled “hosts” will pull down a list of hosts you can add. By
    clicking on a hostname it is added and an icon of the machine appears in an animation
    of the virtual machine. A host is deleted if you click on a hostname that is already
    in the virtual machine. On startup XPVM reads the file `$HOME/.xpv_hosts`, which
    is a list of hosts to display in this menu. Hosts without leading “&” are added
    all at once at start up.


    The quit and halt buttons work just like the PVM console. If you quit XPVM and
    then restart it, XPVM will automatically display what the running virtual machine
    looks like. Practice starting and stopping and adding hosts with XPVM. If there
    are errors they should appear in the window where you started XPVM.

    ```'
