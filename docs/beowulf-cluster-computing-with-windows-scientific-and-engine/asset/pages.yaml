    # ### 14.2.6 The DAGMan Scheduler


    The DAGMan scheduler within Condor allows the specification of dependencies between
    a set of programs. A directed acyclic graph (DAG) can be used to represent a set
    of programs where the input, output, or execution of one or more programs is dependent
    on one or more other programs. The programs are nodes (vertices) in the graph,
    and the edges (arcs) identify the dependencies. Each program within the DAG becomes
    a job submitted to Condor. The DAGMan scheduler enforces the dependencies of the
    DAG.


    An input file to DAGMan identifies the nodes of the graph, as well as how to submit
    each job (node) to Condor. It also specifies the graph''s dependencies and describes
    any extra processing that is involved with the nodes of the graph and must take
    place just before or just after the job is run.


    A simple diamond-shaped DAG with four nodes is given in Figure 14.3.


    ![](img/e2283ffaea56e577ac05056b4bb738fc_354_0.png)


    > **Figure 14.3** A directed acyclic graph with four nodes.


    A simple input file to DAGMan for this diamond-shaped DAG may be


    ```

    ```

    # file name: diamond.dag

    Job A A.condor

    Job B B.condor

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 355
  md: '```

    Job  C   C.condor

    Job  D   D.condor

    PARENT A  CHILD B C

    PARENT B C  CHILD D

    ```


    The four nodes are named A, B, C, and D. Lines beginning with the keyword **Job**
    identify each node by giving it a name, and they also specify a file to be used
    as a submit description file for submission as a Condor job. Lines with the keyword
    **PARENT** identify the dependencies of the graph. Just like regular Condor submit
    description files, lines with a leading pound character (#) are comments.


    The DAGMan scheduler uses the graph to order the submission of jobs to Condor.
    The submission of a child node will not take place until the parent node has successfully
    completed. No ordering of siblings is imposed by the graph, and therefore DAGMan
    does not impose an ordering when submitting the jobs to Condor. For the diamond-shaped
    example, nodes B and C will be submitted to Condor in parallel.


    Each job in the example graph uses a different submit description file. An example
    submit description file for job A may be


    ```

    # file name: A.condor

    executable       = nodeA.exe

    output           = A.out

    error            = A.err

    log              = diamond.log

    universe         = vanilla

    queue

    ```


    An important restriction for submit description files of a DAG is that each node
    of the graph use the same log file. DAGMan uses the log file in enforcing the
    graph’s dependencies.


    The graph for execution under Condor is submitted by using the Condor tool **condor_submit_dag**.
    For the diamond-shaped example, submission would use the command


    ```

    condor_submit_dag diamond.dag

    ```


    # ## 14.3  Condor Architecture


    A Condor pool comprises a single machine that serves as the *central manager*
    and an arbitrary number of other machines that have joined the pool. Conceptually,'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'the pool is a collection of resources (machines) and resource requests (jobs).
    The role of Condor is to match waiting requests with available resources. Every
    part of Condor sends periodic updates to the central manager, the centralized
    repository of information about the state of the pool. The central manager periodically
    as- sesses the current state of the pool and tries to match pending requests with
    the appropriate resources.


    # #### 14.3.1 The Condor Daemons


    In this subsection we describe all the daemons (background server processes) in
    Condor and the role each plays in the system.


    condor_master: This daemon''s role is to simplify system administration. The condor_master
    is registered by the installation program with the Windows 2000 Service Control
    Manager as a system service. Windows will automatically start the master at boot
    time. It is responsible for keeping the rest of the Condor daemons running on
    each machine in a pool. The master spawns the other daemons and periodically checks
    the timestamps on the binaries of the daemons it is managing. If it finds new
    binaries, the master will restart the affected daemons. This allows Condor to
    be upgraded easily. In addition, if any other Condor daemon on the machine exits
    abnormally, the condor_master will send e-mail to the system ad- ministrator with
    information about the problem and then automatically restart the affected daemon.
    The condor_master also supports various administrative com- mands to start, stop,
    or reconfigure daemons remotely. The condor_master runs on every machine in your
    Condor pool.


    condor_startd: This daemon represents a machine to the Condor pool. It ad- vertises
    a machine ClassAd that contains attributes about the machine''s capabil- ities
    and policies. Running the startd enables a machine to execute jobs. The condor_startd
    is responsible for enforcing the policy under which remote jobs will be started,
    suspended, resumed, vacated, or killed. When the startd is ready to execute a
    Condor job, it spawns the condor_starter, described below.


    condor_starter: This program is the entity that spawns the remote Condor job on
    a given machine. It sets up the execution environment and monitors the job once
    it is running. The starter detects job completion, sends back status information
    to the submitting machine, and exits.


    condor_schedd: This daemon represents jobs to the Condor pool. Any machine that
    allows users to submit jobs needs to have a condor_schedd running. Users'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'submit jobs to the condor_sched, where they are stored in the job queue. The
    various tools to view and manipulate the job queue (such as condor_submit, condor_q
    or condor_rm) connect to the condor_sched to do their work.


    condor_shadow: This program runs on the machine where a job was submitted whenever
    the job is executing. The shadow serves requests for files to transfer, logs the
    job’s progress, and reports statistics when the job completes.


    condor_collector: This daemon is responsible for collecting all the information
    about the status of a Condor pool. All other daemons periodically send ClassAd
    updates to the collector. These ClassAds contain all the information about the
    state of the daemons, the resources they represent, or resource requests in the
    pool (such as jobs that have been submitted to a given condor_sched). The condor_collector
    can be thought of as a dynamic database of ClassAds. The condor_status command
    can be used to query the collector for specific information about various parts
    of Condor. The Condor daemons also query the collector for important information,
    such as what address to use for sending commands to a remote machine. The condor_collector
    runs on the machine designated as the central manager.


    condor_negotiator: This daemon is responsible for all the matchmaking within the
    Condor system. The negotiator is also responsible for enforcing user priorities
    in the system.


    # ### 14.3.2 The Condor Daemons in Action


    Within a given Condor installation, one machine will serve as the pool’s central
    manager. In addition to the condor_master daemon that runs on every machine in
    a Condor pool, the central manager runs the condor_collector and the condor_negotiator
    daemons. Any machine in the installation that should be capable of running jobs
    should run the condor_startd, and any machine that should maintain a job queue
    and therefore allow users on that machine to submit jobs should run a condor_sched.


    Condor allows any machine simultaneously to execute jobs and serve as a submission
    point by running both a condor_startd and a condor_sched. Figure 14.4 displays
    a Condor pool in which every machine in the pool can both submit and run jobs,
    including the central manager.


    The interface for adding a job to the Condor system is condor_submit, which reads
    a job description file, creates a ClassAd, and gives that ClassAd to the condor_sched
    managing the local job queue. This triggers a negotiation cycle.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_358_0.png)


    Figure 14.4

    Daemon layout of an idle Condor pool.


    During a negotiation cycle, the **condor_negotiator** queries the **condor_collector**
    to discover all machines that are willing to perform work and all users with idle
    jobs. The **condor_negotiator** communicates in *user priority* order with each
    **condor_schedd** that has idle jobs in its queue, and performs matchmaking to
    match jobs with machines such that both job and machine ClassAd requirements are
    satisfied and preferences (rank) are honored.


    Once the **condor_negotiator** makes a match, the **condor_schedd** claims the
    corresponding machine and is allowed to make subsequent scheduling decisions about
    the order in which jobs run. This hierarchical, distributed scheduling architecture
    enhances Condor''s scalability and flexibility.


    When the **condor_schedd** starts a job, it spawns a **condor_shadow** process
    on the submit machine, and the **condor_startd** spawns a **condor_starter** process
    on the corresponding execute machine (see Figure 14.5). The shadow transfers the
    job ClassAd and any data files required to the starter, which spawns the user''s
    application.


    When the job completes or is aborted, the **condor_starter** removes every process
    spawned by the user job, and frees any temporary scratch disk space used by the
    job. This ensures that the execute machine is left in a clean state and that resources
    (such as processes or disk space) are not being leaked.'
