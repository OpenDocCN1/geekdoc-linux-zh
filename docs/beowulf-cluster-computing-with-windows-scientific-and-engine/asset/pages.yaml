    \ API, such as which protocols the API can layer over, whether the API supports\
    \ reliable or bidirectional communication, and how portable the APIs are to other\
    \ Windows platforms the application might run on. We discuss the following networking\
    \ APIs:\n\n+   * Named pipes and mailslots  \n+   * Windows Sockets (Winsock)\
    \  \n+   * Remote procedure call (RPC)\n\nIn addition, we briefly describe several\
