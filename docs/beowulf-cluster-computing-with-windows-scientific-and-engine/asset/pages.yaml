- pgno: 124
  md: '# ## 5 Network Hardware


    Thomas Sterling


    Networking converts a shelf full of PCs into a single system. Networking also
    allows a system to be accessed remotely and to provide services to remote clients.
    The incredible growth of both the Internet and enterprise-specific intranets has
    resulted in the availability of high-performance, low-cost networking hardware
    that Beowulf systems use to create a single system from a collection of nodes.
    This chapter reviews networking hardware, with a particular emphasis on Fast Ethernet
    because of its superb price/performance ratio.


    For Beowulf systems, the most demanding communication requirements are not with
    the external environment but with the other nodes on the system area network.
    In a Beowulf system, every Beowulf node may need to interact with every other
    node, independently or together, to move a wide range of data types between processors.
    Such data may be large blocks of contiguous information representing subpartitions
    of very large global data sets, small packets containing single values, or synchronization
    signals in support of collective operation. In the former case, a high bandwidth
    communication path may be required. In the latter case, low latency communication
    is required to expedite execution. Requirements in both cases are highly sensitive
    to the characteristics of the parallel program being executed. In any case, communications
    capability will determine the generality of the Beowulf-class system and the degree
    of difficulty in constructing efficient programs. The choice of network hardware
    and software dictates the nature of this capability.


    Section 5.1 introduces some of the most popular networking technologies for Beowulf
    clusters. In Section 5.2, we take a detailed look at the most popular networking
    choice, Fast Ethernet (and Gigabit Ethernet). We conclude in Section 5.3 with
    comments on interconnect technology choice and some other practical issues


    # ### 5.1 Interconnect Technologies


    In spite of its popular use in existing Beowulfs, Ethernet-based networking is
    not the only technology choice for enabling internode communication. Other solutions
    exist that can deliver equal or better performance depending on the application.
    Fast Ethernet is a popular choice because of its ubiquity and consequent low price.
    A Fast Ethernet card costs only about 2 percent of the price of today''s $1,000
    Beowulf nodes. Only the network switches have a significant impact on the overall
    price of the system. With other networking technologies, each network interface
    card can cost as much as a 16-port Fast Ethernet switch. So you have to think
    carefully before committing to an alternative network. If the kinds of applications
    you intend'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'to run require specific properties, such as low latency, which are not provided
    by Fast Ethernet, then it is likely worth the additional cost. For example, real-time
    image processing, parallel video streaming, and real-time transaction processing
    all require low latencies and do not work well with Fast Ethernet. We will briefly
    discuss the most common networking technologies used by Beowulf systems. Not enough
    data has been collected on application performance in systems using these technologies
    for us to comment on when each should be used.


    # 5.1.1 The Ethernet


    The most popular and inexpensive networking choice for Beowulfs is Ethernet, particularly
    Fast Ethernet. Ethernet, first developed at Xerox PARC in the early 1970s and
    standardized by the IEEE in the early 1980s, is the most widely used technology
    for local area networks. Ethernet continues to be an evolving technology: 10 Gigabit
    Ethernet (10 Gbps) has entered vendor field testing and should be available in
    quantity by early 2002. With the very low cost of Fast Ethernet and the rapid
    emergence of Gigabit and 10 Gigabit Ethernet, Ethernet will continue to play a
    critical role in Beowulf-class computing for some time to come.


    **Fast Ethernet.** Beowulf was enabled by the availability of a low-cost, moderate-bandwidth
    networking technology. Ethernet, operating initially at 10 megabits per second
    (Mbps) for early Beowulfs and shortly thereafter at 100 Mbps peak bandwidth, provided
    a cost-effective means of interconnecting PCs to form an integrated cluster. Used
    primarily for commercial local area network technology, Ethernet supplied the
    means of implementing a system area network at about 20 percent of the cost of
    the total system, even when employing low-cost personal computers. Fast Ethernet
    with TCP/IP provides 90–95 Mbps to applications with latencies in the hundreds
    of microseconds. Drivers for Fast Ethernet and TCP/IP have been integrated into
    the mainline Linux kernel sources for quite some time and are well tested, with
    a large user base. Cost of Fast Ethernet interfaces has dropped to the point that
    many motherboard vendors have begun to integrate single- or dual-port interfaces
    into their products. While other networking continues to be available (and used
    in some Beowulfs), Fast Ethernet will continue to be a mainstay of many Beowulf
    implementations because of its extremely low cost.


    **Gigabit Ethernet.** The success of 100 base-T Fast Ethernet and the growing
    demands imposed on networks by high-resolution image data, real-time data browsing,
    and Beowulf-class distributed applications have driven the industry to establish
    a new set of standards for Ethernet technology capable of 1 Gbps. Referred to
    as “Gi-'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'gabit Ethernet," a backward-compatible network infrastructure has been devised,
    and products are available from various vendors. A number of changes were required
    to Fast Ethernet, including the physical layer and a large part of the data exchange
    protocols. However, to maintain compatibility with Fast Ethernet, or 100-baseT
    systems, means for mixed-mode operation has been provided. Currently, Gigabit
    Ethernet is not quite cost effective for Beowulf-class computing. The early product
    offerings for Gigabit Ethernet, as the easily offerings for 10 Gigabit Ethernet
    will be, were for backbone service and traffic aggregation rather than for direct
    host connections; hence, the demand for NICs was assumed to be low, and a large
    market has not yet emerged to amortize development costs. Both switches and NICs
    are substantially more expensive than their Fast Ethernet equivalents.


    Several factors will motivate the migration of next-generation Gigabit Ethernet
    into the role of system area networks for Beowulf-class systems. While Fast Ethernet
    served well for 200 MHz Intel Pentium Pro processor-based Beowulf nodes, current
    Pentium 4 processors are available at speeds of 1.7 GHz. The PCI bus now supports
    a data path twice as wide and twice the clock rate, permitting high-bandwidth
    data transfers to peripheral devices including Gigabit NICs. A broader range of
    Beowulf applications can be supported with higher bandwidth. Unfortunately, Gigabit
    Ethernet with TCP/IP does not provide substantially better latencies than does
    Fast Ethernet. Some Beowulf installations have already experimented with Gigabit
    Ethernet, and the Beowulf project has already delivered drivers to the Linux operating
    system for several Gigabit Ethernet cards. Some vendors have even begun to supply
    high-performance, open source gigabit drivers for their NICs. The experience with
    Fast Ethernet demonstrated that a rapid and dramatic drop in price can be expected
    once the technology is adopted by the mass market. With the introduction of inexpensive
    combination Ethernet/Fast Ethernet/Gigabit Ethernet ASICs, motherboard integration
    and low-cost gigabit adapters are beginning to appear. Gigabit switch prices have
    also begun to fall. The 1 Gbps technology is in place, and experience by manufacturers
    is leading to rapid improvements and cost cutting. With these advances, we expect
    that Gigabit Ethernet will become a leader in interconnect price/performance in
    the next one to two years.


    # 5.1.2 Myrinet


    Myrinet is a system area network (SAN) designed by Myricom, Inc. On November 2,
    1998, it was approved as American National Standard ANSI/VITA 26-1998. It is designed
    around simple low-latency locking switches. The path through these switches is
    implemented with "header-stripping" source routing, where the sending'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'node prepends the route through the network, and each switch removes the first
    byte of the message and uses it as the output port. Packets can be of arbitrary
    length.


    The bandwidth of the adapter and switch is hidden from the application and has
    regularly increased over time from the original 640Mbps to the current 2.4Gbps.
    Myrinet delivers between 10 and 7 microseconds, depending on the generation of
    adapter and switch. A limitation of Myrinet is that the switches are incrementally
    blocking. If a destination port is busy in a multicast network, the packet is
    stalled, and that stalled packet potentially blocks other packets traveling the
    network, even to unrelated source and destination nodes. This problem is mitigated,
    however, by the network''s high speed and the ability to construct topologies
    with rich interconnects. Blocking is minimized by higher-density switches that
    reduce the number of a stages traversed by a typical message in a network of fixed
    size.


    While Myrinet is the strongest provider of high-bandwidth SANs, it has the limitation
    of being provided by a single vendor. The price of the network adapters and per
    port costs of switches has remained high, typically exceeding the price of the
    entire computing node. Myrinet''s big advantage is its customized protocols. These
    protocols are designed to yield high performance and low latency by offloading
    as much work as possible to the NIC itself and bypassing the operating system
    whenever possible. Myrinet NICs effectively provide a second processor that can
    do much of the protocol work and avoid interrupting the host CPU during communication.
    This advantage could also be obtained for less money by adding a second primary
    processor. This advantage is most significant with active messages, where the
    on-board processor can handle the message and generate a reply without and interrupting
    the host CPU. In order for the hardware to be used in this way, Myricom provides
    a substantial amount of open source software, both drivers and a tuned version
    of MPICH. Using customized protocols also encourages user-level access to the
    hardware. This strategy has also been pursued with commodity hardware (see Section
    5.3.3 for a brief discussion of MVIA, an implementation for commodity hardware
    by the Virtual Interface Architecture, VIA). Unfortunately, user-level access
    protocols have the disadvantage of precluding clusters from transparently scaling
    from standard TCP and Ethernet on small-scale machines to alternative hardware
    such as Myrinet on big clusters.


    # 5.1.3 cLAN


    The cLAN high-performance cluster switches provide a native implementation of
    the VIA (see **www.viarch.org**). Eight port and thirty port switches are available,
    offering 1.25Gbps per port (2.5Gbps bidirectional). Because these implement the'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'VIA directly in hardware, latencies are low (around 0.5 microsecond) and band-

    widths are high (comparable to the other high-end networking solutions). The

    developer of cLAN was Giganet, which was acquired by Emulex in March 2001.


    While VIA is defined by a consortium and is not a single-vendor design, the VIA

    standard specifies only a set of concepts and operations. There is no specification
    of

    the signals (they can be electrical, optical, or anything else) or the interfaces
    to indi-

    vidual computers. There is also no standard programmer interface, although most

    VIA efforts (including cLAN) use the sample application programming interface

    provided in the VIA specification. However, because the VIA standard does not

    specify the hardware over which VIA is used, there is no possibility of interoperable

    VIA solutions. Infiniband, discussed below, addresses this issue.


    # 5.1.4 Scalable Coherent Interface


    The Scalable Coherent Interface is an IEEE standard originally designed to provide

    an interconnect for cache-coherent shared-memory systems. One of the first major

    deployments of SCI was on the Convex Exemplar SPP-1000 in 1994. SCI has not

    been able to gain ground in traditional networking markets, despite its ability
    to

    serve as a general-purpose interconnect. The main reason Beowulf designers choose

    to use SCI is for its low latency of well under $10\ \mu s$. Current PC motherboard
    chip

    sets do not support the coherency mechanisms required to construct an SCI-based

    shared-memory Beowulf. But if that functionality is ever added to commodity

    motherboards, we may see an increase in the popularity of SCI as researchers ex-

    periment with shared-memory Beowulf systems. Seven years ago, SCI delivered

    many clear advantages, but today commodity network technology has caught up,

    although SCI still delivers significantly lower latency. Dolphin Interconnect
    offers

    an SCI-based interconnect for Beowulf systems along with closed-source binary

    drivers and an implementation of MPI tuned for the SCI network.


    # 5.1.5 QsNet


    Another high-performance network, called QsNet, is produced by Quadrics. This

    network provides a bandwidth of 340 Mbps and an MPI latency of around 5 $\mu s$.

    While this network is one the costliest, it has been chosen by some of the largest
    clus-

    ters, including Compaq SC systems for the ASCI Q system and the NSF teraflops

    system at the Pittsburgh Supercomputing Center. To provide high performance,

    Quadrics uses many techniques similar to those mentioned above for Myrinet.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Image Not Available


    **Figure 5.1** Ethernet packet format.


    # 5.1.6 Infiniband


    Infiniband (www.infinibandta.org) combines many of the concepts of VIA with a
    detailed electrical and interface specification that will allow vendors to produce
    interoperable components. This addresses the major limitation of the VIA specification.
    One goal of the Infiniband trade organization (with over two hundred members)
    is to increase the rate at which networking performance improves.


    As of early 2001, no Infiniband products were available. Many are under development,
    however, and by 2002 Infiniband may become an important alternative to the other
    networks described here. Intel has committed to delivering integrated Infiniband
    interfaces on its motherboards in the next one to two years. This should provide
    another high-bandwidth, low-latency interconnect at a relatively low price point.


    # 5.2 A Detailed Look at Ethernet


    Ethernet was originally developed as a packet-based, serial multitrop network
    requiring no centralized control. All network access and arbitration control is
    performed by distributed mechanisms. Variable-length message packets comprise
    a sequence of bits including a header, data, and error-detecting nodes. A fixed-topology
    (no switched line routing) network passes packets from the source to destination
    through intermediate elements known as hubs or switches. The next step through
    the network is determined by addressing information in the packet header.


    The topology can be a shared multitrop passive cable to which many Ethernet controllers
    are attached, a tree structure of hubs or switches, or some more complicated switching
    technology for high bandwidths and low latency under heavy loads.


    # 5.2.1 Packet Format


    The Ethernet message packet comprises a sequence of seven multibit fields, one
    of which is variable length. The fields include a combination of network control
    information and data payload. The structure of the Ethernet packet is shown in'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Figure 5.1 and is described below. The packet''s variable length allows improved
    overall network performance across a wide range of payload requirements. Thus,
    a transfer of only a few words between nodes does not impose the full burden of
    the longest possible packet. However, even with this capability, sustained data
    transfer throughput is sensitive to packet length and can vary by more than an
    order of magnitude depending on payload size, even in the absence of network contention.


    Preamble. Arrival of a message packet at a receiving node (neither nor the message
    is addressed for that node) is asynchronous. Prior to data assimilation, the node
    and the incident packet must first synchronize. The preamble field is a 62-bit
    sequence of alternating 1s and 0s that allows the phase lock loop circuitry of
    the node receiver to lock on to the incoming signal and synchronize with the bit
    stream.


    Synch. The synch field is a 2-bit sequence of 1s (11) that breaks the sequence
    of alternating 1s and 0s provided by the preamble and indicates where the remaining
    information in the packet begins. If the preamble provides carrier-level synchronization,
    the synch field provides bit field registration.


    Destination Address. The destination address field is 6 bytes (or 48 bits) in
    length and specifies the network designation of the network node intended to receive
    the packet. A message packet may be intended for an individual node or a group
    of nodes. If the first bit of the destination address field is 0, then the message
    is intended for a single receiving node. If the first bit is 1, then the message
    is multicast, intended for some or all network nodes. In the case of multicast
    communications, a group address is employed providing a logical association among
    some subset of all receiving nodes. Any node that is a member of a group specified
    by the message destination address field (with the first bit equal to 1) must
    accept the message. In the case of a multicast transmitted packet, a destination
    address field of all 1s indicates that the packet is a broadcast message intended
    for all nodes on the network. Ethernet node receivers must be capable of receiving,
    detecting, and accepting broadcast messages.


    In addition to distinguishing among single destination and multicast transmission,
    the destination address also determines whether the specified address is a globally
    or locally administered address. A globally administered address is unique and
    is provided by an industrywide assignment process. The address is built into the
    network adaptor (interface card) by the manufacturer. A locally administered address
    is provided by the local systems administrator and can be changed by the organization
    managing the network. The second bit of the destination address field'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'is a 0 if globally administered and a 1 if the address designation is locally
    administered. The sequence of bits of the destination address field is sent least
    significant bit first.


    **Source Address.** The source address is a 48-bit field that indicates the address
    of the transmitting node. The format of the source address is the same as that
    of the destination address. The source address is always the individual address
    and never a group address of the node sending a packet. Therefore, the least significant
    bit is always 0. Likewise, the broadcast address is never used in this field.


    **Type.** The type field is 16 bits in length and designates the message protocol
    type. This information is used at higher levels of message-handling software and
    does not affect the actual exchange of data bits across the network. The most
    significant of the two bytes is sent first, with the least significant bit of
    each byte of the type field being sent first.


    **Data.** The message payload of the packet is included in the data field. The
    data field is variable length. It may have as few as 46 bytes and as many as 1,500
    bytes. Thus, a packet may be as small as 72 bytes or as long as 1,526 bytes. The
    contents of the data field are passed to higher-level software and do no affect
    the network transfer control. Data is transmitted least significant bit first.


    **Frame Check Sequence.** Error detection for message corruption in transmission
    is provided by computing a cyclic redundancy check (CRC) for the destination address,
    source address, type, and data fields. The four-byte CRC value is provided as
    the last field of the message packet. It is computed by both the transmitting
    and receiving nodes and compared by the receiving node to determine that the integrity
    of the packet has been retained in transmission.


    # ### 5.2.2 NIC Architecture


    The Network Interface Controller accepts message data from the host node processor
    and presents an encapsulated and encoded version of the data to the physical network
    medium for transmission. While there have been many different implementations
    of the Ethernet NIC hardware, with some enhancements, their basic architecture
    is the same. Figure 5.2 shows a block diagram of the typical Ethernet NIC architecture.
    The Data Link Layer of the architecture is responsible for constructing the message
    packet and controlling the logical network interface functions. The Physical Layer
    is responsible for encoding the message packet in a form that can actually be
    applied to the transmission medium.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_132_0.png)


    **Figure 5.2**

    Ethernet NIC architecture.


    # Data Link Layer.


    The Data Link Layer provides the logical interface between the host processor
    and the Physical Layer of the Ethernet. When a message is to be transmitted, the
    Data Link Layer accepts, temporarily stores, and encapsulates the message and
    controls the transmission process of the Physical Layer. When a message is being
    received, it accepts the packet from the Physical Layer, determines whether the
    node is the correct destination, verifies bit integrity, unpacks the data into
    byte sequence, temporarily buffers the data, and passes it on to the processor.
    The Data Link Layer is made up of the Logical Link Control sublayer and the Media
    Access Control sublayer.


    For most current-generation Beowulf nodes, the Logical Link Control sublayer incorporates
    an interface to the PCI bus. This element of the Ethernet controller provides
    all logical control required to accept commands from the host processor and to
    provide direct memory access to the node main memory for rapid data transfers
    between memory and the network. Usually included is some form of FIFO buffering
    within the Data Link Layer to hold one or more incoming or outgoing messages in
    the node. The Logical Link Control sublayer presents variable-length byte sequences
    to the Media Access Control sublayer and accepts data byte sequences from it.
    The exact form and operation of the Logical Link Control sublayer is not standardized,
    and manufacturer differences are a source of headaches for device driver writers.


    The Media Access Controller (MAC) is largely responsible for conducting the Ethernet
    protocol for both transmitted and received messages. Its two principal tasks are
    message encapsulation and packet collision handling. To transmit a message, the
    MAC accepts the byte sequence of the data to be sent, as well as'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'the destination address, from the Logical Link Controller. It formats the message
    packet including the preamble, synch bits, destination address, its own address
    in the source address field, and the protocol type provided by the logical link
    controller as well as the data field. It then computes the CRC value and appends
    it to the message packet. When receiving an Ethernet packet from the Physical
    Layer, the MAC strips away the preamble and synch bits and determines if the destination
    address is that of its host node. If not, the rest of the message is discarded
    and the receive process terminates. If the Destination Address field matches the
    local address, the MAC accepts the data, reformattng it into the correctly ordered
    byte sequence for the Logical Link Controller. The MAC computes the cyclic redundancy
    check and compares it with the value included in the message to verify transmission
    integrity.


    The MAC is also responsible for handling the CSMA/CD (Carrier Sense Multiple Access/Collision
    Detect) arbitration protocol. The Physical Layer provides signals to the MAC indicating
    whether there is packet transmission on the data link and whether there is a collision
    among two or more packets on the link. When a signal is available, the MAC operates
    as above to determine whether the message is for the host node and, if so, acquires
    the data. In the case of a collision, the MAC simply discards any partial incoming
    messages and waits for new packet data. When transmitting, the MAC is responsible
    for handling collision avoidance and resolution. As described above, the MAC waits
    for access to the data link and supplies the packet to the physical layer that
    begins transmission. If in the process of packet transmission the MAC receives
    a collision signal from the Physical Layer, after briefly continuing transmission
    (to overcome the network propagation delay) it terminates the message and begins
    its random roll-back sequence to determine a new time when it will again attempt
    to transmit the message.


    # Physical Layer


    The Physical Layer encodes the message packet provided by the Data Link Layer
    and converts it to electrical signals appropriate for the physical transmission
    medium. Upon receiving messages transmitted by other nodes, the Physical Layer
    acquires the electrical signals from the transmission medium, converts them to
    digital signals, and decodes them into the message’s binary bit sequence. The
    Physical Layer includes two major stages: the transceiver and the Physical Line
    Signaling (PLS) sublayer. The transceiver, also referred to as the Medium Attachment
    Unit (MAU), performs the electrical conversion from transmission media signals
    to logical signal levels.


    The interface between the PLS sublayer of the Physical Layer and the MAC sublayer
    of the Data Link Layer exchanges data with bits represented as discrete'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'voltage levels. This form of information representation is inadequate for Ethernet
    for two reasons. First, in a highly noisy (in the electrical sense) environment
    such as presented by a local area network, signal levels can be significantly
    attenuated and distorted. Second, in a single bit-serial communication protocol
    such as that employed by the Ethernet interconnect, both data and timing information
    need to be incorporated in the signal. For this reason, Manchester encoding is
    used to convey the information with the value of a bit specified by the sense
    (direction) of the signal transition rather than a specific range of values. With
    data fixed at the point of signal transition, the timing information is provided
    simultaneously.


    The actual Ethernet signal is differential; that is, one line is high when the
    other is low and vice versa. The PLS sublayer converts the message packet provided
    by the MAC first into its Manchester encoded representation and then into differential
    form.


    The PLS layer performs the decoding task for incoming signals from the transceiver,
    converting Manchester sequences into regular bit strings. The PLS layer also provides
    the collision detect signal to the MAC.


    # 5.2.3 Hubs and Switches


    The Network Interface Controllers provide the connection between the processor
    node and the system area network. The effectiveness of the SAN and its scalability
    depend on the means by which the nodes are interconnected. These include passive
    multipod coaxial cable, active repeaters, and intelligent routing switches, as
    well as more complicated through-the-node store and forward techniques.


    **Repeaters and Hubs.** An early advantage of Ethernet was that the medium of
    communication was a passive multipod coaxial cable. Over a limited distance and
    number of nodes, such a cable located all expensive logic and electronics in the
    NICs. As technology costs dropped and demands on network performance increased,
    other approaches could compete. Ironically, the coax cables that had helped keep
    costs down became the dominant cost driver. Twisted-pair connections using inexpensive
    repeaters or hubs have now replaced coaxial cables in all but the oldest installations.
    Logically, hubs provide the same NIC interface. All nodes are visible from all
    other nodes, and the CSMA/CD arbitration protocol is still employed. A repeater
    is an active unit that accepts signals from the distributed nodes on separate
    twisted pair wires, actively cleans up the signals, amplifies them to desired
    levels, and then redistributes them to all of the attached nodes.


    **Switches.** The demand for higher sustained bandwidths and the need to include
    larger number of nodes on a single network spurred development of more sophistic-'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'cated means of exchanging messages among nodes. Switches, like hubs or repeaters,
    accept packets on twisted-pair wires from the nodes. Unlike repeaters, however,
    these signals are not broadcast to all connected nodes. Instead, the destination
    address fields of the message packets are interpreted and the packet is sent only
    to the target node or nodes. This functionality is much more complicated than
    that of a simple repeater, requiring buffer space and logic not required by a
    hub. At the time of the earliest Beowulfs, the cost of switches was prohibitively.
    By the third generation of Beowulf systems (based on Intel Pentium Pro processors),
    however, the cost of switches was sufficiently low that they became standard Beowulf
    components.


    Today, 16-way switches have dropped in price another factor of four or more, and
    they are the backbone of many moderate-sized systems. Moderate-cost switches with
    up to 48 connections are widely available. For greater connectivity, multiple
    switches can be interconnected. There is a catch, however. The network must be
    a tree; it may not contain any cycles.


    A problem occurs with the tree topology. The bisection bandwidth of the root or
    top level switch becomes a communication bottleneck. All the traffic might have
    to go through this channel. A typical bandwidth for low-cost, 16-way Fast Ethernet
    switches is near or at 1.6 Gbps. Backplane saturation with Fast Ethernet switches
    is not a serious problem at this point. Current generation of gigabit switches
    provides much higher backplane bisection bandwidth and therefore the possibility
    of many more network ports without contention. With a properly sized core gigabit
    switch, the network core can easily (with money) scaled to 192 Gbps or more. With
    these, use of Fast Ethernet switches with dual or quad gigabit uplinks scale properly,
    without serious contention in the network to a scale easily upwards of 1,000 nodes.


    # 5.3 Network Practicalities: Interconnect Choice


    Network choice for a system area network can be a difficult process. In this section
    we consider various factors and present two examples illustrating how different
    choices can affect performance.


    # 5.3.1 Importance of the Interconnect


    The cost for the NIC and switch complex can equal or exceed the cost of node hardware
    on a large cluster: it is not a factor that should be taken lightly.


    In the absence of financial considerations, however, the most important factor
    when choosing an interconnect technology is the communication patterns of the'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'intended workload for the cluster. While the peak CPU performance of the processors
    in a cluster tends to add up rather quickly, a given application may or may not
    be able to effectively utilize it without a high bandwidth and/or low latency
    interconnect. This can account for up to a 95% penalty when comparing theoretical
    speed with achieved performance. Because of this fact, and the high cost of inter-connect
    hardware, it is important to build a properly sized system area network for a
    given workload.


    If a cluster is being built for a small number of applications, thorough application
    benchmarking is in order. The spectrum of communication patterns exhibited by
    applications ranges from occasional communication from one node to another to
    consistent communication from all nodes to all other nodes. At one extreme are
    applications that behave like Seti@Home, wherein compute nodes infrequently query
    a master node for a work unit to process for hours or days. At the other extreme
    are applications like MILC (MIMD Lattice Computation), where nodes are in constant
    communication with one or more other nodes and the speed of the computation is
    limited by the performance of the slowest node. As is obvious from the communication
    pattern description, basically any interconnect would perform admirably in the
    first case, while the fastest interconnect possible is desirable in the second
    case.


    # 5.3.2 Differences between the Interconnect Choices


    As seen in the preceding descriptions, interconnects vary widely with respect
    to bandwidth, latency, scalability, and cost. Available interconnect bandwidth
    can range from a shared 10 Mbps network segment for the entire cluster to upwards
    to 340 Mbps available to all nodes simultaneously. Latency delivered to applications
    can range from in the hundreds of microseconds down to half a microsecond. This
    is near the latency cost of using the PCI bus. Various interconnects scale to
    different levels. Switched Ethernet-based interconnects, for example, basically
    work for any number of nodes on a network segment, as reliable packet delivery
    is provided by the TCP/IP layer. For this reason, Ethernet switch complexes deal
    well with congestion. Interconnect networks do not universally possess these characteristics,
    however; various interconnect types have topology scalability issues, and others
    basically require a full bisectional bandwidth switch complex to be built to minimize
    switch congestion. The cost of these technologies ranges from practically free
    to into the thousands of dollars per node of up-front cost. This does not take
    into consideration the substantial, recurring effort of integration, software,
    and hardware debugging. Variance in the types of drivers provided can also affect
    difficulty in integration. Some vendors provide binary drivers only for particular
    versions of'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'the Linux kernel. These cause clusters using these interconnects to become
    kernel “version locked.” In many cases, the kernel bugs that cluster administrators
    are likely to encounter are fixed by subsequent releases of the kernel. Hence,
    version-locked machines are harder to support.


    # ### 5.3.3 Strategies to Improve Performance over Ethernet


    Realistically, financial considerations are fairly important while designing a
    cluster. This is clearly indicated by the high frequency of clusters with Ethernet
    as an interconnect. As this is the slowest interconnect on the above list, performance
    optimization is of the utmost importance. The simplest approach is to tune the
    system’s Ethernet and TCP/IP stacks; these changes are fairly nonintrusive and
    straightforward to implement, and there is a fairly good document detailing this
    tuning process at www.psc.edu/networking/perf\_tune.html. Other approaches can
    be more intrusive. These fall into three categories: hardware choice, software
    features, and other network topologies.


    Ethernet card performance will be heavily influenced by the characteristics of
    the NIC chosen. Higher-quality Ethernet NICs will deliver better throughput and
    latency at a lower host CPU utilization. This better performance is achieved through
    a number of techniques. Use of jumbo frames is one way to reduce host CPU utilization.
    By using a large MTU setting of 9,000 bytes as opposed to the usual 1,500 bytes,
    the NIC has to package up a considerably smaller number of Ethernet frames. Jumbo
    frames are supported only in Gigabit networks, but their use can significantly
    increase network throughput. Some NICs support TCP checksum calculation in hardware
    on the NIC itself. This removes one of the most expensive tasks from the host
    CPU. Some NICs also support interrupt coalescing. This means that the NIC has
    some quantity of local memory into which received packets can be stored temporarily,
    to reduce the interrupt load of NIC use. Without interrupt coalescing, heavy network
    use can induce enough context switching for interrupt servicing that computational
    throughput of the host CPU drops substantially. This feature is also really used
    only on Gigabit networks. Substantial differences in the feature set are supported
    by Gigabit network adapters.


    On the other hand, Fast Ethernet NICs have a basically comparable hardware feature
    set and depend on drivers to deliver outstanding performance. There is a large
    variation in the quality of Gigabit drivers as well. All of the hardware features
    mentioned above need to be supported in software as well as in hardware in order
    to be used. Alternatively, TCP/IP may not be used at all. All of the properties
    a network protocol provides, such as reliable delivery and out-of-order packet
    reassembly, come at the cost of latency and bandwidth penalties. Some of'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'these properties are important, some not. The VIA specification (www.viarch.org)
    describes an architecture that implements only those properties that are required
    in cluster communication. This provides a protocol with far less overhead than
    Ethernet’s CSMA/CD and TCP/IP have. By using the MVIA implementation (www.nersc.gov/research/FTG/via/)
    of the VIA specification and its drivers for Fast Ethernet or Gigabit Ethernet
    NICs, more bandwidth is delivered to applications with less latency using commodity
    hardware. (This is the same protocol mentioned in Section 5.1.3.)


    The final approach taken to maximize Ethernet performance is to use a different
    network topology. One of these topologies is to use EtherChannel, or Ethernet
    bonding. This software makes multiple physical Ethernet interfaces negotiate a
    virtual aggregated connection from the switch (there is no benefit to doing this
    in a shared network segment) to the client. This can increase the amount of bandwidth
    available to applications by integer multiples based on the number of physical
    interfaces available. Unfortunately, this has no positive effect on latency, as
    the logical path that a message takes from end to end has bonding routines to
    go through as well. Another topology designed to improve bisectional bandwidth
    and latency is FNN (www.aggregate.org/FNN), or Flat Network Neighborhoods. In
    this topology, hosts have multiple network interfaces that each home on a different
    switch. In a properly setup network, each host will have a NIC on the same switch
    as an interface on any given other host in the network. This technique attempts
    to leverage the large performance difference between backplanes and uplinks in
    a cost-effective manner.


    # ## 5.3.4  Cluster Network Pitfalls


    Linux gigabit support doesn’t interact well with switch auto negotiation and time-sensitive
    protocols such as DHCP. We have had several problems with gigabit switch port
    initialization time. These long initialization times cause DHCP requests to time
    out. We have tracked this problem to a number of factors on the switch, all of
    which had to do with auto negotiation. Gigabit switches try to auto negotiate
    a number of settings when link comes up. The list of settings that are auto negotiated
    by default includes flow control, port negotiation, etherchannel (bonding), and
    802.1q tranking. Then a spanning tree check is run to determine whether any switching
    loops exist in the network. All said, this process can take up to a minute to
    complete. This is certainly longer than the default DHCP request timeout. On Fast
    Ethernet networks, a number of these same settings are auto negotiated. While
    this list is shorter, and the port setup time is considerably less than on Gigabit
    Ethernet, problems can still result if many hosts are brought up in parallel.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'To this end, disabling autonegotiation whenever possible will immensely simplify
    the network itself and reduce the number of problems encountered.


    As Fast Ethernet is the most common interconnect, and Ethernet is the most common
    sort of Linux host networking, internode communication and cluster administrative
    processes may compete with one another for resources. This event should be avoided
    if at all possible. With the heavy usage of transparent network-based services
    like NFS, it is possible to unintentionally use large quantities of network bandwidth
    with fairly innocuous operations. Extraneous processes, even administrative tasks,
    should be avoided if possible while user jobs are running.


    The nature of cluster administrative operations, whether synchronous, like pdsh,
    or asynchronous, like cron jobs, is that they run in a loosely parallel fashion.
    While these jobs are not synchronized internally, their methods of invocation
    cause them to be started in very small time windows. When these administrative
    operations are performed in parallel, the load pattern on servers is more bursty
    than normal Unix servers. In these cases, peak capacity is important more often
    than sustained throughput.


    # 5.3.5 An Example of an Ethernet Interconnected Beowulf


    The Clemson Mini-grid Beowulf employs four switches. The processor pool utilizes
    a Foundry Networks FastIron III with a backplane throughput of 480 Gbps and supports
    up to 336 Fast Ethernet ports or up to 120 Gigabit Ethernet ports. The configuration
    used in the Clemson machine includes 16 Gigabit Ethernet ports and 264 Fast Ethernet
    ports. The Mini-grid processor pool includes 130 nodes each with two Fast Ethernet
    NICs connected to this switch. In addition, the processor pool’s switch is connected
    to three primary clusters one of which employs a Foundry Networks FastIron II
    Plus with a backplane throughput of 256 Gbps connected to 66 dual-NIC nodes, and
    two of which employ a Foundry Networks FastIron II with a backplane throughput
    of 128 Gbps connected to 34 dual-NIC nodes. The switches in the Mini-grid are
    connected by multiple trunked Gigabit Ethernet links. There are four trunked links
    between the pool and the larger cluster and two trunked links each between the
    pool and the two smaller clusters. The dual-NIC nodes in the pool and the clusters
    use Linux channel bonding to double the throughput of a normal Fast Ethernet NIC.
    The Foundry Networks switches use a similar technique to trunk up to eight Gigabit
    Ethernet links between any two switches. Using this approach one could build a
    Fast Ethernet switching system with up to 1080 ports with no bottlenecks. In practice,
    considerably larger networks can be built, though not with full bisection bandwidth.
    For many applications somewhat less bandwidth'
