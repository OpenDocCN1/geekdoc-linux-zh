- pgno: 228
  md: '# 10 Advanced Topics in MPI Programming


    William Gropp and Ewing Lusk


    In this chapter we continue our exploration of parallel programming with MPI.
    We describe capabilities that are more specific to MPI rather than part of the
    message-passing programming model in general. We cover the more advanced features
    of MPI sometimes called MPI-2, such as dynamic process management, parallel I/O,
    and remote memory access.


    # 10.1 Dynamic Process Management in MPI


    A new aspect of the MPI-2 standard is the ability of an MPI program to create
    new MPI processes and communicate with them. (In the original MPI specification,
    the number of processes was fixed at startup.) MPI calls this capability (together
    with related capabilities such as connecting two independently started MPI jobs)
    *dynamic process management*. Three main issues are introduced by this collection
    of features:


    +   - maintaining simplicity and flexibility;

    +   - interacting with the operating system, a parallel process manager, and perhaps
    a job scheduler; and

    +   - avoiding race conditions that could compromise correctness.


    The key to avoiding race conditions is to make creation of new processes a collective
    operation, over both the processes creating the new processes and the new processes
    being created.


    # 10.1.1 Intercommunicators


    Recall that an MPI communicator consists of a group of processes together with
    a communication context. Strictly speaking, the communicators we have dealt with
    so far are *intra*communicators. There is another kind of communicator, called
    an *inter*communicator. An intercommunicator binds together a communication context
    and two groups of processes, called (from the point of view of a particular process)
    the *local* group and the *remote* group. Processes are identified by rank in
    group, but ranks in an intercommunicator always refer to the processes in the
    remote group. That is, an **MPI_Send** using an intercommunicator sends a message
    to the process with the destination rank in the *remote* group of the intercommunicator.
    Collective operations are also defined for intercommunicators; see [7, Chapter
    7] for details.'
