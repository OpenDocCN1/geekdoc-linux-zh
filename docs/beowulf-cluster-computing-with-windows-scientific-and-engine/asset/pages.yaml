  md: "modifying `HPL.dat`. The file `hpl/TUNING` contains some hints on setting the\
    \ values in this file for performance. Here are a few of the most important:\n\
    \n+   1. Change the problem size to a large value. Don’t make it too large, however,\
    \ since the total computational work grows as the cube of the problem size (doubling\
    \ the problem size increases the amount of work by a factor of eight). Problem\
    \ sizes of around 5,000–10,000 are reasonable.\n+   \n+   2. Change the block\
    \ size to a modest size. A block size of around 64 is a good place to start.\n\
    +   \n+   3. Change the processor decomposition and number of nodes to match your\
    \ configuration. In most cases, you should try to keep the decomposition close\
    \ to square (e.g., *P* and *Q* should be about the same value), with *P* \\ge\
    \ *Q*.\n+   \n+   4. Experiment with different values for **RFAC** and **PFAC**.\
    \ On some systems, these parameters can have a significant effect on performance.\
    \ For one large cluster, setting both to **right** was preferable.\n\n# 10.11\
    \ MPI-2 Status\n\nMPI-2 is a significant extension of the MPI-1 standard. Unlike\
    \ the MPI-1 standard, where complete implementations of the entire standard were\
    \ available when the standard was released, complete implementations of all of\
    \ MPI-2 have been slow in coming. As of June 2001, there are few complete implementations\
    \ of MPI-2 and none for Beowff clusters. Most MPI implementations include the\
    \ MPI-IO routines, in large part because of the ROMIO implementation of the routines.\
