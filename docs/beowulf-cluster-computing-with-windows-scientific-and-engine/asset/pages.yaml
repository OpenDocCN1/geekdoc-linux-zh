- pgno: 389
  md: 'job constraints in terms of job duration or processors required that are not
    easily packed onto the cluster. Mani provides tools to allow fine tuning of job
    resource requirement information and steering of cluster workload so as to allow
    maximum utilization of the system.


    One such tool is a feedback interface, which allows a site to report detailed
    job usage statistics to users. This interface provides information about the resources
    requested and those actually used. Using the FEEDBACKPROGARM parameter, local
    scripts can be executed that use this information to help users improve resource
    requirement estimates. For example, a site with nodes with various memory configurations
    may choose to create a script such as the following that automates the mailing
    of notices at job completion:


    > Job 1371 completed successfully). Note that it requested nodes with 512 MBytes
    of RAM yet used only 112 MBytes. Had the job provided a more accurate estimate,
    it would have, on average, started 02:27:16 earlier.


    Such notices can be used to improve memory, disk, processor, and wall-time estimates.
    Another route that is often used is to set the allocation manager charge policy
    so that users are charged for requested resources rather than used resources.


    The showbf command is designed to help tailor jobs that can run immediately. This
    command allows you to specify details about your desired job (such as user, group,
    queue, and memory requirements) and returns information regarding the quantity
    of available nodes and the duration of their availability.


    A final area of user feedback is job scaling. Often, users will submit parallel
    jobs that scale only moderately scale, hoping that by requesting more processors,
    their job will run faster and provide results sooner. A job''s completion time
    is simply the sum of its queue time plus its execution time. Users often fail
    to realize that a larger job may be more difficult to schedule, resulting in a
    longer queue time, and may run less efficiently, with a sublinear speedup. The
    increased queue-time delay, together with the limitations in execution time improvements,
    generally results in larger jobs having a greater average turnaround time than
    smaller jobs performing the same work. Mani commands such as showgrid can provide
    real-time job efficiency and average queue-time states correlated to job size.
    The output of the profiler command can also be used to provide per user job efficiency
    and average queue time correlated by job size and can alert administrators and
    users to this problem.'
  merge: -1
