    \ exactly how new MPI processes are created by an already running MPI program.\
    \ The MPI function that does this is **MPI_Comm_spawn**. Its key features are\
    \ the following.\n\n+   - It is collective over the communicator of processes\
    \ initiating the operation (called the *parents*) and also collective with the\
    \ calls to **MPI_Init** in the processes being created (called the *children*).\
    \ That is, the **MPI_Comm_spawn** does not return in the parents until it has\
    \ been called in all the parents and **MPI_Init** has been called in all the children.\n\
    +   - It returns an intercommunicator in which the local group contains the parents\
    \ and the remote group contains the children.\n+   - The new processes, which\
    \ must call **MPI_Init**, have their own **MPI_COMM_WORLD**, consisting of all\
    \ the processes created by this one collective call to **MPI_Comm_spawn**.\n+\
    \   - The function **MPI_Comm_get_parent**, called by the children, returns an\
    \ intercommunicator with the children in the local group and the parents in the\
    \ remote group.\n+   - The collective function **MPI_Intercomm_merge** may be\
    \ called by parents and children to create a normal (intra)communicator containing\
