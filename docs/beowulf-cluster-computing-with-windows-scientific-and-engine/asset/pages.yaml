  md: "use of blocking and nonblocking communications and communicating noncontiguous\
    \ data.\n\n# **10.3.1  Blocking and Nonblocking Communication**\n\nConsider the\
    \ following simple code (note that this is similar to the simple version of *exchange_nbrs*\
    \ in Section 9.3):\n\n```\n```\nif (rank == 0) {\n    MPI_Send( sbuf, n, MPI_INT,\
    \ 1, 0, MPI_COMM_WORLD );\n    MPI_Recv( rbuf, n, MPI_INT, 1, 0, MPI_COMM_WORLD,\
    \ &status );\n}\nelse if (rank == 1) {\n    MPI_Send( sbuf, n, MPI_INT, 0, 0,\
    \ MPI_COMM_WORLD );\n    MPI_Recv( rbuf, n, MPI_INT, 0, 0, MPI_COMM_WORLD, &status\
    \ );\n}\n```\n```\n\nWhat happens with this code?  It looks like process 0 is\
    \ sending a message to process 1 and that process 1 is sending a message to process\
    \ 0.  But more is going on here.  Consider the steps that the MPI implementation\
    \ must take to make this code work:\n\n+   1.  Copy the data from the `MPI_Send`\
    \ into a temporary, system-managed buffer.\n\n+   2.  Once the `MPI_Send` completes\
    \ (on each process), start the `MPI_Recv`. The data that was previously copied\
    \ into a system buffer by the `MPI_Send` operation can now be delivered to the\
    \ user's buffer (**rbuf** in this case).\n\nThis approach presents two problems,\
    \ both related to the fact that data must be copied into a system buffer to allow\
    \ the `MPI_Send` to complete. The first problem is obvious: any data motion takes\
    \ time and reduces the performance of the code. The second problem is more subtle\
    \ and important: the amount of available system buffer space always has a limit.\
    \ For values of **n** in the above example that exceed the available buffer space,\
    \ the above code will *hang*: neither `MPI_Send` will complete, and the code will\
    \ wait forever for the other process to start an `MPI_Recv`. This is true for\
    \ *any* message-passing system, not just MPI. The amount of buffer space available\
    \ for buffering a message varies among MPI implementations, ranging from many\
    \ megabytes to as little as 128 bytes.\n\nHow can we write code that sends data\
    \ among several processes and that does not rely on the availability of system\
    \ buffers? One approach is to carefully order the send and receive operations\
    \ so that each send is guaranteed to have a matching"
