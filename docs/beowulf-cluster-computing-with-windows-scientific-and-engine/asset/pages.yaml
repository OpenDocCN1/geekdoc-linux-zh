    For this example we use a master/worker programming model. The master, `heat.c`,
    spawns five copies of the program `heats1v`. The workers compute the heat diffusion
    for subsections of the wire in parallel. At each time step the workers exchange
    boundary information, in this case the temperature of the wire at the boundaries
    between processors.


    Let’s take a closer look at the code. In `heat.c` the array `solution` will hold
    the solution for the heat diffusion equation at each time step. First the `heats1v`
    tasks are spawned. Next, the initial dataset is computed. Notice the ends of the
    wires are given initial temperature values of zero.


    The main part of the program is then executed four times, each with a different
    value for $\Delta t$. A timer is used to compute the elapsed time of each compute
    phase. The initial datasets are sent to the `heats1v` tasks. The left and right
    neighbor task ids are set along with the initial dataset. The `heats1v` tasks
    use these to communicate boundary information. Alternatively, we could have used
    the PVM group calls to map tasks to segments of the wire. By using this approach
    we would have avoided explicitly communicating the task ids to the slave processes.'
