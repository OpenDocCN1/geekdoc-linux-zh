- pgno: 196
  md: '# # 9 Parallel Programming with MPI


    William Gropp and Ewing Lusk


    Parallel computation on a Beowulf is accomplished by dividing a computation into
    parts and making use of multiple processes, each executing on a separate processor,
    to carry out these parts. Sometimes an ordinary program can be used by all the
    processes, but with distinct input files or parameters. In such a situation, no
    communication occurs among the separate tasks. When the power of a parallel computer
    is needed to attack a large problem with a more complex structure, however, such
    communication is necessary.


    One of the most straightforward approaches to communication is to have the processes
    coordinate their activities by sending and receiving messages, much as a group
    of people might cooperate to perform a complex task. This approach to achieving
    parallelism is called *message passing*.


    In this chapter and the next, we show how to write parallel programs using MPI,
    the Message Passing Interface. MPI is a message-passing library specification.
    All three parts of this description are significant.


    +   • MPI addresses the message-passing model of parallel computation, in which
    processes with separate address spaces synchronize with one another and move data
    from the address space of one process to that of another by sending and receiving
    messages.¹

    +   • MPI specifies a library interface, that is, a collection of subroutines
    and their arguments. It is not a language; rather, MPI routines are called from
    programs written in conventional languages such as Fortran, C, and C++.

    +   • MPI is a specification, not a particular implementation. The specification
    was created by the MPI Forum, a group of parallel computer vendors, computer scientists,
    and users who came together to cooperatively work out a community standard. The
    first phase of meetings resulted in a release of the standard in 1994 that is
    sometimes referred to as MPI-1. Once the standard was implemented and in wide
    use a second series of meetings resulted in a set of extensions, referred to as
    MPI-2. MPI refers to both MPI-1 and MPI-2.


    As a specification, MPI is defined by a standards document, the way C, Fortran,
    or POSIX are defined. The MPI standards documents are available at `www.mpi-forum.org`
    and may be freely downloaded. The MPI-1 and MPI-2 standards are also available
    as journal issues [10, 11] and in annotated form as books


    > ¹ Processes may be single threaded, with one program counter, or multithreaded,
    with multiple program counters. MPI is for communication among processes rather
    than threads. Signal handlers can be thought of as executing in a separate thread.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "in this series [14, 4]. Implementations of MPI are available for almost all\
    \ parallel computers, from clusters to the largest and most powerful parallel\
    \ computers in the world. In Section 9.8 we provide a summary of the most popular\
    \ cluster implementations.\n\nA goal of the MPI Forum was to create a powerful,\
    \ flexible library that could be implemented efficiently on the largest computers\
    \ and provide a tool to attack the most difficult problems in parallel computing.\
    \ It does not always do the simplest things in the simplest way but comes into\
    \ its own as more complex functionality is needed. In this chapter and the next\
    \ we work through a set of examples, starting with the simplest.\n\n# 9.1 Hello\
    \ World in MPI\n\nTo see what an MPI program looks like, we start with the classic\
    \ “hello world” program. MPI specifies only the library calls to be used in a\
    \ C, Fortran, or C++ program; consequently, all of the capabilities of the language\
    \ are available. The simplest “Hello World” program is shown in Figure 9.1.\n\n\
    ```\n#include \"mpi.h\"\n#include <stdio.h>\n\nint main( int argc, char *argv[]\
    \ )\n{\n    MPI_Init( &argc, &argv );\n    printf( \"Hello World\\n\" );\n   \
    \ MPI_Finalize();\n    return 0;\n}\n```\n\n![](img/e2283ffaea56e577ac05056b4bb738fc_197_0.png)\n\
    \nAll MPI programs must contain one call to **MPI_Init** and one to **MPI_Finalize**.\
    \ All other² MPI routines must be called after **MPI_Init** and before **MPI_Finalize**.\
    \ All C and C++ programs must also include the file `mpi.h`; Fortran programs\
    \ must either use the **MPI** module or include **mpif.h**.\n\nThe simple program\
    \ in Figure 9.1 is not very interesting. In particular, all processes print the\
    \ same text. A more interesting version has each process identify\n\n²There are\
    \ a few exceptions, including **MPI_Initialized**."
