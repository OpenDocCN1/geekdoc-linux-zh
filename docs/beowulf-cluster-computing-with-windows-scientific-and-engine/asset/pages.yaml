  md: '+   1. The first three arguments describe the *origin* data; that is, the data
    on the calling process. These are the usual “buffer, count, datatype” arguments.

    +   2. The next argument is the rank of the *target* process. This serves the
    same function as the destination of an `MPI_Send`. The rank is relative to the
    communicator used when creating the MPI window object.

    +   3. The next three arguments describe the destination buffer. The **count**
    and **datatype** arguments have the same meaning as for an `MPI_Recv`, but the
    buffer location is specified as an offset from the beginning of the memory specified
    to `MPI_Win_create` on the target process. This offset is in units of the displacement
    argument of the `MPI_Win_create` and is usually the size of the basic datatype.

    +   4. The last argument is the MPI window object.


    Note that there are no MPI requests; `MPI_Win_fence` completes all preceding RMA
    operations. `MPI_Win_fence` provides a collective synchronization model for RMA
    operations in which all processes participate. This is called *active target*
    synchronization.


    With these routines, we can create a version of the mesh exchange that uses RMA
    instead of point-to-point communication. Figure 10.13 shows one possible implementation.


    Another form of access requires no MPI calls (not even a fence) at the target
    process. This is called *passive target* synchronization. The origin process uses
    `MPI_Win_lock` to begin an access epoch and `MPI_Win_unlock` to end the access
    epoch.³

    Because of the passive nature of this type of RMA, the local memory (passed as
    the first argument to `MPI_Win_create`) should be allocated with `MPI_Allloc_mem`
    and freed with `MPI_Free_mem`. For more information on passive target RMA operations,
    see [7, Chapter 6]. Also note that as of 2001, few MPI implementations support
    passive target RMA operation. More implementations are expected to support these
    operations in 2002.


    A more complete discussion of remote memory access can be found in [7, Chapters
    5 and 6]. Note that MPI implementations are just beginning to provide the RMA
    routines described in this section. Most current RMA implementations emphasize
    functionality over performance. As implementations mature, however, the performance
    of RMA operations will also improve.


    ³The names `MPI_Win_lock` and `MPI_Win_unlock` are really misnomers; think of
    them as begin-RMA and end-RMA.'
