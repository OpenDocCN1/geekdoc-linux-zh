  md: 'The most flexible way to run a program is with a configuration file. The command-line
    `mpirun file.cfg` uses the specified configuration file (‘file.cfg’) to run the
    parallel program. This format allows MPMD (Multiple Program Multiple Data) programs.


    Two tools help in running MPICH programs:


    +   - **MPConfig** attempts to find the machines in your cluster and saves their
    names in the registry. This tool provides a graphical user interface for finding
    and modifying the machines available for MPI programs. Using **MPConfig** allows
    **MPiRun** to accept the **-np** argument to select the number of processes.

    +   - **MPiRegister** allows you to provide your account name and password only
    once when running MPI programs. Without this, **MPiRun** will prompt for a username
    and password.


    Here is a configuration file that starts a manager process (`manager.exe`) and
    five worker processes:


    ```

    ```bash

    exe d:\Projects\Me\worker.exe

    hosts

    roadrunner 1 d:\projects\Me\manager.exe

    roadrunner 5

    ```

    ```


    # ### 9.7 Tools


    A number of tools are available for developing, testing, and tuning MPI programs.
    Although they are distributed with MPICH, they can be used with other MPI implementations
    as well.


    # #### 9.7.1 Profiling Libraries


    The MPI Forum decided not to standardize any particular tool but rather to provide
    a general mechanism for intercepting calls to MPI functions, which is the sort
    of capability that tools need. The MPI standard requires that any MPI implementation
    provide two entry points for each MPI function: its normal `MPI_` name and a corresponding
    `PMPI_` version. This strategy allows a user to write a custom version of `MPI_Send`,
    for example, that carries out whatever extra functions might be desired, calling
    `PMPI_Send` to perform the usual operations of `MPI_Send`. When the user’s custom
    versions of MPI functions are placed in a library and the library precedes the
    usual MPI library in the link path, the user’s custom code will be invoked around
    all MPI functions that have been replaced.'
