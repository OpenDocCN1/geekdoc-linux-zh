    # 14.2 Using Condor


    The road to using Conder effectively is a short one. The basics are quickly and
    easily learned.


    # 14.2.1 Roadmap to Using Condor


    The following steps are involved in running jobs using Conder:


    Prepare the Job to Run Job Unattended. An application run under Conder must be
    able to execute as a batch job. Conder runs the program unattended and in the
    background. A program that runs in the background will not be able to perform
    interactive input and output. Conder can redirect console output (stdout and stderr)
    and keyboard input (stdin) to and from files. You should create any needed files
    that contain the proper keystrokes needed for program input. You'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'should also make certain the program will run correctly with the files. Typically
    programs submitted to Condor will be console-mode programs because `stdin` and
    `stdout`/`err` can be redirected. However, GUI-based programs can be submitted
    to Condor provided they do not block waiting for mouse/keyboard input.


    **Select the Condor Universe.** Condor has five runtime environments from which
    to choose. Each runtime environment is called a *Universe*. Usually the Universe
    you choose is determined by the type of application you are asking Condor to run.
    There are three MPI Universes in total: one for serial jobs (Vanilla), one for
    parallel MPI jobs (MPI), and one for meta-schedulers (Scheduler). Section 14.2.4
    provides more information on each of these Universes.


    **Create a Submit Description File.** The details of a job submission are defined
    in a *submit description* file. This file contains information about the job such
    as what executable to run, which Universe to use, the files to use for `stdin`,
    `stdout`, and `stderr`, requirements and preferences about the machine which should
    run the program, and where to send e-mail when the job completes. You can also
    tell Condor how many times to run a program; it is simple to run the same program
    multiple times with different data sets.


    **Submit the Job.** Submit the program to Condor with the `condor_submit` command.


    Once a job has been submitted, Condor handles all aspects of running the job.
    You can subsequently monitor the job''s progress with the `condor_q` and `condor_status`
    commands. You may use `condor_prior` to modify the order in which Condor will
    run your jobs. If desired, Condor can also record what is being done with your
    job at every stage in its lifecycle, through the use of a log file specified during
    submission.


    When the program completes, Condor notifies the owner (by e-mail, the user-specified
    log file, or both) the exit status, along with various statistics including time
    used and I/O performed. You can remove a job from the queue at any time with `condor_rm`.


