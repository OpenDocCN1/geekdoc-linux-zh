    # ### 16.4.3 Nodes


    Where jobs will be run is determined by an interaction between the Scheduler and
    the Server. This interaction is affected by the contents of the PBS `nodes` file
    and the system configuration onto which you are deploying PBS. Without this list
    of nodes, the Server will not establish a communication stream with the MOM(s),
    and MOM will be unable to report information about running jobs or to notify the
    Server when jobs complete. In a cluster configuration, distributing jobs across
    the various hosts is a matter of the Scheduler determining on which host to place
    a selected job.


    Regardless of the type of execution nodes, each node must be defined to the Server
    in the PBS nodes file, (the default location of which is `/usr/spool/PBS/server_nodes`.)'
