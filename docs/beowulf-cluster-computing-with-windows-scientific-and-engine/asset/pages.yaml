    # 10.4 Motivation for Communicators


    Communicators in MPI serve two purposes. The most obvious purpose is to describe
    a collection of processes. This feature allows collective routines, such as `MPI_Bcast`
    or `MPI_Allreduce`, to be used with any collection of processes. This capability
    is particularly important for hierarchical algorithms, and also facilitates dividing
    a computation into subtasks, each of which has its own collection of processes.
    For example, in the manager-worker example in Section 9.2, it may be appropriate
    to divide each task among a small collection of processes, particularly if this
    causes the problem description to reside only in the fast memory cache. MPI communicators
    are perfect for this; the MPI routine `MPI_Comm_split` is the only routine needed
    when creating new communicators. Using ranks relative to a communicator for specifying
    the source and destination of messages also facilitates dividing parallel tasks
    among smaller but still parallel subtasks, each with its own communicator.


    A more subtle but equally important purpose of the MPI communicator involves the
    *communication context* that each communicator contains. This context is essential
    for writing software libraries that can be safely and robustly combined with other
    code, both other libraries and user-specific application code, to build complete
    applications. Used properly, the communication context guarantees that messages
    are received by appropriate routines *even if other routines are not as careful*.
    Consider the example in Figure 10.8 (taken from [6, Section 6.1.2]). In this example,
    there are two routines, provided by separate libraries or software modules. One,
    `SendRight`, sends a message to the right neighbor and receives from the left.
    The other, `SendEnd`, sends a message from process 0 (the leftmost) to the last
    process'
