    Chapter 9


    # ## 9.3  Two-Dimensional Jacobi Example with One-Dimensional De-


    composition


    A common use of parallel computers in scientific computation is to approximate
    the solution of a partial differential equation (PDE). One of the most common
    PDEs, at least in textbooks, is the Poisson equation (here shown in two dimensions):


    ```

    ```

    ∂²u      ∂²u         = f(x, y) in Γ       (9.3.1)

    ∂x²      ∂y²

    u       = g(x, y) on ∂Γ                  (9.3.2)

    ```

    ```


    This equation is used to describe many physical phenomena, including fluid flow
    and electrostatics. The equation has two parts: a differential equation applied
    everywhere within a domain $\Gamma$ (9.3.1) and a specification of the value of
    the unknown $u$ along the boundary of $\Gamma$ (the notation $\partial\Gamma$
    means “the boundary of $\Gamma$”). For example, if this equation is used to model
    the equilibrium distribution of temperature inside a region, the boundary condition
    $g(x,y)$ specifies the applied temperature along the boundary, $f(x,y)$ is zero,
    and $u(x,y)$ is the temperature within the region. To simplify the rest of this
    example, we will consider only a simple domain $\Gamma$ consisting of a square
    (see Figure 9.8).


    To compute an approximation to $u(x,y)$, we must first reduce the problem to finite
    size. We cannot determine the value of $u$ everywhere; instead, we will approximate
    $u$ at a finite number of points $(x_i, y_i)$ in the domain, where $x_i = i \times
    h$ and $y_j = j \times h$. (Of course, we can define a value for $u$ at other
    points in the domain by interpolating from these values that we determine, but
    the approximation is defined by the value of $u$ at the points $(x_i, y_j)$.)
    These points are shown as black disks in Figure 9.8. Because of this regular spacing,
    the points are said to make up a *regular mesh*. At each of these points, we approximate
    the partial derivatives with finite differences. For example,


    ```

    ```latex

    \frac{\partial^2 u}{\partial x^2}(x_i, y_j) \approx \frac{u(x_{i+1}, y_j) - 2u(x_i,
    y_j) + u(x_{i-1}, y_j)}{h^2}

    ```

    ```


    If we now let $u_{i,j}$ stand for our approximation to solution of Equation 9.3.1
    at the point $(x_i, y_j)$, we have the following set of simultaneous linear equations
    for the values of $u$:


    ```

    ```

    \frac{u_{i+1,j} - 2u_{i,j} + u_{i-1,j}}{h^2} + \frac{u_{i,j+1} - 2u_{i,j} + u_{i,j-1}}{h^2}
    = f(x_i, y_j).   (9.3.3)

    ```

    ```'
