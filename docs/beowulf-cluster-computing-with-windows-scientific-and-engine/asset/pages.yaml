    We illustrate this technique with a parallel program to multiply a matrix by a
    vector. (A Fortran version of this same program can be found in [6].) This program
    is not a particularly good way to carry out this operation, but it illustrates
    the approach and is simple enough to be shown in its entirety. The program multiplies
    a square matrix a by a vector b and stores the result in c. The units of work
    are the individual dot products of the rows of a with the vector b. Thus the manager,
    code for which is shown in Figure 9.6, starts by initializing a. The manager then
    sends out initial units of work, one row to each worker. We use the MPI tag on
    each such message to encode the row number we are sending. Since row numbers start
    at 0 but we wish to reserve 0 as a tag with the special meaning of “no more work
    to do”, we set the tag to one greater than the row number. When a worker sends
    back a dot product, we store it in the appropriate place in c and send that worker
    another row to work on. Once all the rows have been assigned, workers completing
    a task are sent a “no more work” message, indicated by a message with tag 0.


    The code for the worker part of the program is shown in Figure 9.7. A worker initializes
    b, receives a row of a in a message, computes the dot product of that row and
    the vector b, and then returns the answer to the manager, again using the tag
    to identify the row. A worker repeats this until it receives the “no more work”
    message, identified by its tag of 0.


    This program requires at least two processes to run: one manager and one worker.
    Unfortunately, adding more workers is unlikely to make the job go faster. We can
    analyze the cost of computation and communication mathematically and see what
    happens as we increase the number of workers. Increasing the number of workers
    will decrease the amount of computation done by each worker, and since they work
    in parallel, this should decrease total elapsed time. On the other hand, more
    workers mean more communication, and the cost of communicating a number is usually
    much greater than the cost of an arithmetical operation on it. The study of how
    the total time for a parallel algorithm is affected by changes in the number of
    processes, the problem size, and the speed of the processor and communication
    network is called scalability analysis. We analyze the matrix-vector program as
    a simple example.


