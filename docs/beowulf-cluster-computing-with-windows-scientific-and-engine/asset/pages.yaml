    # 11.5 Matrix Multiply


    In this example we program a matrix multiply algorithm described by Fox et al.
    in [3]. The mmult program can be found at the end of this section. The mmult program
    will calculate $C = AB$ where $C, A$, and $B$ are all square matrices. For simplicity
    we assume that $m \times m$ tasks are used to calculate the solution. Each task
    calculates a subblock of the resulting matrix $C$. The block size and the value
    of $m$ are given as a command-line argument to the program. The matrices $A$ and
    $B$ are also stored as blocks distributed over the $m^2$ tasks. Before delving
    into the details of the program, let us first describe the algorithm at a high
    level.


    In our grid of $m \times m$ tasks, each task $(t_{ij}, \text{where } 0 \leq i,j
    < m)$, initially contains blocks $C_{ij}, A_{ij}$, and $B_{ij}$. In the first
    step of the algorithm the tasks on the diagonal $(t_{ij} \text{ where } i = j)$
    send their block $A_{ii}$ to all the other tasks in row $i$. After the transmission
    of $A_{ii}$, all tasks calculate $A_{ii} \times B_{ij}$ and add the result into
    $C_{ij}$. In the next step, the column blocks of $B$ are rotated. That is, $t_{ij}$
    sends its block of $B$ to $t_{(i-1)j}$. (Task $t_{0j}$ sends its $B$ block to
    $t_{(m-1)j}$). The tasks now return to the first step, $A_{i(i-1)}$ is multicast
    to all other tasks in row $i$, and the algorithm continues. After $m$ iterations
    the $C$ matrix contains $A \times B$, and the $B$ matrix has been rotated back
    into place.


    Let us now go over the matrix multiply as it is programmed in PVM. In PVM there
    is no restriction on which tasks may communicate with which other tasks.'
