  md: '# 9.5  **Pararel Monte Carlo Computation**


    One of the types of computation that is easiest to parallelize is the *Monte Carlo*
    family of algorithms. In such computations, a random number generator is used
    to create a number of independent trials. Statistics done with the outcomes of
    the trials provide a solution to the problem.


    We illustrate this technique with another computation of the value of $\pi$. If
    we select points at random in the unit square $[0, 1] \times [0, 1]$ and compute
    the percentage of them that lie inside the quarter circle of radius 1, then we
    will be approximating $\frac{\pi}{4}$. (See [6] for a more detailed discussion
    together with an approach that does not use a parallel random number generator.)
    We use the SPRNG parallel random number generator (``sprng.cs.fsu.edu''''). The
    code is shown in Figure 9.12.


    The defaults in SPRNG make it extremely easy to use. Calls to the `sprng` function
    return a random number between 0.0 and 1.0, and the stream of random numbers on
    the different processes is independent. We control the *grain size* of the parallelism
    by the constant `BATCHSIZE`, which determines how much computation is done before
    the processes communicate. Here a million points are generated, tested, and counted
    before we collect the results to print them. We use `MPI_Bcast` to distribute
    the command-line argument specifying the number of batches, and we use `MPI_Reduce`
    to collect at the end of each batch the number of points that fell inside the
    quarter circle, so that we can print the increasingly accurate approximations
    to $\pi$.


    # 9.6  **Installing MPICH under Windows 2000**


    The MPICH implementation of MPI [5] is one of the most popular versions of MPI.
    Thanks to support from Microsoft, an open-source version is available for Windows
    NT and Windows 2000. This implementation supports TCP/IP, VIA, and shared-memory
    communication. This release is available at ``www.mcs.anl.gov/mpich/mpich-nt'''',
    which also contains complete installation instructions for the current version.


    This implementation includes


    +   * all source code for MPICH,

    +   * simple example programs like the ones in this chapter,

    +   * performance benchmarking programs,

    +   * the MPE profiling library, and

    +   * the Jumpshot performance visualization system.'
