    # **Changing the Priority of Jobs**


    In addition to the priorities assigned to each user, Condor provides users with
    the capability of assigning priorities to any submitted job. These job priorities
    are local to each queue and range from −20 to +20, with higher values meaning
    better priority.


    The default priority of a job is 0. Job priorities can be modified using the condor_prio
    command. For example, to change the priority of a job to −15, type


    ```

    % condor_q raman


