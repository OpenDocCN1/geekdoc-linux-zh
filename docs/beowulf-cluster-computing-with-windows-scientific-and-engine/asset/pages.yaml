    \ primary purposes: driving simulations (described later) and profiling actual\
    \ system usage. The **profiler** command allows the processing of these historical\
    \ scheduler statistics and generation of usage reports for specific time frames\
    \ or for selected users, groups, accounts, or types of jobs.\n\n# Testing\n\n\
    To test new policies, you can run a **TEST** mode instance of Maui concurrently\
    \ with the production scheduler. This allows a site to analyze the effects of\
    \ the new policies on the scheduling behavior of the test instance, while safely\
    \ running the production workload under tried and true policies. When running\
    \ an instance of Maui in test mode, it is often best to create a second Maui directory\
    \ with associated **log** and **state** subdirectories. To run multiple, concurrent\
    \ Maui instances, you should take the following into account:\n\n+   • **Configuration\
    \ file:** The test version of Maui should have its own `maui.cfg` file to allow\
    \ specification of the **SERVERMODE** parameter and allow policy differences as\
    \ needed by the test.\n\n+   • **User interface port:** To avoid conflicts between\
    \ different scheduler instances and client commands, the test version of the `maui.cfg`\
    \ file should specify a unique parameter value for **SERVERPORT**.\n\n+   • **Log\
    \ and statistics files:** Both production and test runs will create and update\
    \ log and statistics files. To avoid file conflicts, each instance of the scheduler\
    \ should point to different files using the **LOGDIR** and **STATDIR** parameters.\n\
    \n+   • **Home directory:** When Maui was initially installed, the **configure**\
    \ script prompted for a home directory where the default `maui.cfg` file could\
    \ be found. To run multiple instances of Maui, you should override this default\
    \ by using the -c command line flag or by specifying the environment variable\
    \ `MAUIHOMEDIR`. The latter approach is most often used, with the variable set\
    \ to the new home directory before starting the test version of the scheduler\
    \ or running test version client commands.\n\nOnce the test version is started,\
    \ all scheduler behavior will be identical to the production system with the exception\
    \ that Maui’s ability to start, cancel, or other-"
