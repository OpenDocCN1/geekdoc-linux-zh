  md: '`priv/nodes’). This is a simple text file with the specification of a single
    node per line in the file. The format of each line in the file is


    ```

    ```

    node_name[:ts] [attributes]

    ```

    ```


    The node name is the network name of the node (host name); it does not have to
    be fully qualified (in fact, it is best kept as short as possible). The optional
    “:ts” appended to the name indicates that the node is a timeshared node.


    Nodes can have attributes associated with them. Attributes come in three types:
    properties, name=value pairs, and name.resource=value pairs.


    Zero or more properties may be specified. The property is nothing more than a
    string of alphanumeric characters (first character must be alphabetic) without
    meaning to PBS. Properties are used to group classes of nodes for allocation to
    a series of jobs.


    Any legal node name=value pair may be specified in the node file in the same format
    as on a qsub directive: attribute.resource=value. Consider the following example:


    ```

    ```

    Node4 resource_available.ncpus=3 max_running=1

    ```

    ```


    The expression np=N may be used as shorthand for resources_available.ncpus=N,
    which can be added to declare the number of virtual processors (VPs) on the node.


    This syntax applies a numeric string, for example, np=4. This expression will
    allow the node to be allocated up to N times to one job or more than one job.
    If np=N is not specified for a cluster node, it is assumed to have one VP.


    You may edit the nodes list in two ways. If the server is not running, you may
    directly edit the nodes file with a text editor. If the server is running, you
    should use qmgr to edit the list of nodes.


    Each item on the line must be separated by white space. The items may be listed
    in any order except that the host name must always be first. Comment lines may
    be included if the first nonwhite space character is the pound sign.


    The following is an example of a possible nodes file for a cluster called “planets”:


    ```

    ```shell

    # The first six of nodes are cluster nodes.

    # Note that the properties are provided to

    # logically group certain nodes together.

    # The last node is a timeshared node.

    #

    mercury   inner moonless

    venus     inner moonless np=1

    ```

    ```'
