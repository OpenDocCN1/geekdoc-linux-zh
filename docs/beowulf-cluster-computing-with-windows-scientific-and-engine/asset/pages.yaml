- pgno: 436
  md: '![](img/e2283ffaea56e577ac05056b4bb738fc_436_0.png)


    X-Windows is also supported under Windows 2000. If you have applications that
    require X-Windows, even as simple as xterm, you can compile and run them under
    Windows using available X libraries such as GNU or commercial systems such as
    Hummingbird''s Exceed. Using X requires that you have a X-Windows client-side
    application that is capable of displaying the X-Windows.


    # ## 18.5.2 Programming Environment


    The principal concern of our users when moving to the Windows environment was
    whether they would have the necessary tools to build their applications.


    Compilers were no problem: a wide variety of excellent compilers are available
    for Windows. At CTC we support the Microsoft Visual Studio Suite, Compaq Fortran,
    Intel Vue Suite, Portland Group, and the GNU compilers. We have found that one
    compiler may work better than others depending on the application; sometimes,
    for example, one compiler may not adhere to a language standard but may provide
    superior optimization. CTC consultants often work with users to find the best
    compiler solution for their application.


    To make moving to the Windows environment easier and more comfortable for users
    coming from a Unix environment, we found tools such as Cygwin and Interix'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'quite useful. They provide features like Unix shells and utilities like make.
    Users at CFC have been able to port millions of lines of legacy Fortran, C, and
    C++ to Windows by using Cygwin. Another advantage of Cygwin is that if you need
    to be able to run your application on multiple platforms or operating systems,
    you don’t have to make significant changes to your code or makefiles. Often, no
    changes are needed at all.


    # 18.5.3 Application Software


    Besides compilers and development environments, we provide a broad range of software
    and libraries for our users. These fall into four basic categories: tools, mathematical
    libraries, scripting languages, and message passing.


    Tools. Following is a list of the tools that we have provided for our users for
    various applications. Every tool that our users have required has been available
    in the Windows environment.


    +   Abaqus Finite element modeling

    +   Ansyst Finite element modeling

    +   Cornell Multitask Toolbox for MATLAB Parallel Matlab

    +   Fidap Computational fluid dynamics

    +   Fluent Computational fluid dynamics

    +   G98W Computational chemistry

    +   Mathematica Mathematics application

    +   Matlab Mathematics application

    +   SAS Statistics

    +   Visualization Toolkit (VTK) Visualization package


    Mathematical Libraries. As our users moved around from different platforms, they
    requested various mathematical libraries. The main libraries we provided are IMSL,
    LAPACK, the Intel Math Kernel Library, and the NAG Library.


    Scripting Languages. Scripting languages allow users to do rapid prototyping and
    to manage program execution. Under Windows 2000, COM+ and WMI make scripting even
    more attractive, and the wealth of modules for scripting languages continues to
    grow. CTC currently supports three scripting languages: ActiveState Perl, Python,
    and Microsoft Visual Basic.


    Message Passing. MPI is the primary message-passing library our users require.
    We use MPI/Pro from MPI Software Technology, Inc. It has proven to be extremely
    stable and well supported. We also have a few users who use PVM; however, we do
    not currently support it.'
