  md: '# 18.3.4 Corporate Cluster


    Since our move to Windows-based clusters, corporate interest in CTC and our computing
    environment has grown substantially. We installed a dedicated cluster to provide
    corporate clients and partners with a place to do performance testing and code
    development. The corporate cluster currently has the following configuration:


    +   16 Dell PowerEdge 2450 servers

    +   Dual-processor Pentium III 933 MHz/256 KBytes cache

    +   2 GBytes RAM/node

    +   27 GBytes disk (RAID 0)/node


    # 18.3.5 Computational Finance Cluster


    CTC director Thomas Coleman has a research group focused on computational finance
    both in Ithaca and in the CTC-Manhattan office in New York City. They use clusters
    for such activities as portfolio risk analysis. One of the tools they find useful
    is the Cornell Multitask Toolbox, which enables them to use Matlab for parallel
    computations on the cluster. The computational finance cluster is configured as
    follows:


    +   16 Dell PowerEdge 2450 servers

    +   Dual-processor Pentium III 933 MHz/256 KBytes cache

    +   2 GBytes RAM/node

    +   27 GBytes disk (RAID 0)/node

    +   Giganel CLAN interconnect


    # 18.4 Other Cluster Resources


    In addition to the CTC Windows-based clusters and the dedicated clusters, we are
    exploring Web-based clusters and a Windows-based CAVE environment. We believe
    that these resources and the applications we are developing to use them will play
    a major role in making high-performance computing available to the masses.


    # 18.4.1 Web Clusters


    As mentioned earlier, we are using the CTC serial nodes as a resource pool for
    new Web-based computing interfaces. To date, we have two Web-based cluster applications.


    The first application, **ser-loopp**, involves protein sequence prediction. The
    user enter a protein sequence and a e-mail address. This sequence is then submitted
    to Cluster CoNTroller securely via the IIS Web server. After the **ser-loopp**
    code has been run against the sequence, results are e-mailed to the user that
    submitted the'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'sequence. Currently, over 200 node-hours per week are spent on this application;
    see `ser-loopg.tc.cornell.edu/loopg.html`.


    The second application, a fracture mechanics problem, is more sophisticated. Users
    authenticate to a Web server via IIS. They then upload a model of a material for
    which they want to perform a crack propagation simulation. The job is automatically
    submitted to the serial nodes, which generate a mesh for the model with the initial
    crack inserted. Once that job completes, it submits a parallel job to run the
    crack propagation simulation code on the Velocity I cluster. After the code has
    run, the users are notified that their results are available in their user directory
    on the H: drive.


    One advantage of this new computing model is that users don’t have to know which
    operating system or which computer architecture is being used. They can simply
    focus on their research. On the other hand, there is still a batch queue between
    the user and the cluster (even though the end users don’t see it). To address
    this issue, we are beginning to investigate Microsoft .Net technology. Our goal
    is to provide real-time feedback and simulation response.


    # 18.4.2 Windows 2000–Based Cave Environment


    CTC is working with Microsoft and VRCO to develop the first Windows 2000– based
    CAVe environment. VRCO provide Windows-based development tools so that users can
    generate CAVe models on their desktops. We are developing tools and programming
    interfaces that will make the CAVe easy to use by any CTC cluster user without
    the help of a visualization expert. We believe that this will lead to application
    steering and more mainsteam use of what traditionally has been a specialized resource.
    The CAVe environment computer resources are as follows:


    +   * 3 Dual-processor Dell Precision 620 workstations

    +   * 1 60Bytes RAM/workstation

    +   * Giganet CLAN interconnect


    # 18.5 Providing a Consistent User Interface


    The Cornell Theory Center believed it essential to make the transition to a Windows
    computing environment as easy as possible for users. In particular, to help users
    get their codes running from other programming environments, we had to provide
    the necessary tools and system interfaces that users were familiar with. In the
    the first six months that the Velocity I cluster was in production, CTC consultants
    met with various Cornell user groups to discuss their requirements. These requirements'
  merge: -1
  img_proc: true
