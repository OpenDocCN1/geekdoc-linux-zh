  md: '# ## 18 Cornell Theory Center


    David Lifka


    The Cornell Theory Center (CTC), located at Cornell University, is a center of
    excellence in high-performance computing and interdisciplinary research. CTC currently
    operates some of the world’s largest Microsoft Windows 2000 clusters. These clusters
    are used by over one hundred Cornell principal investigators and over six hundred
    related users. Outside collaborators with Cornell research partners also have
    access to CTC cluster resources.


    # ### 18.1 CTC Users


    CTC has a diverse user community who use the center’s computational resources
    in various modes:


    +   - **Serial mode:** Some user jobs require large amounts of memory, disk, or
    faster processors. For these users we provide a serial job farm.

    +   - **Master/worker parallelism:** Some users have an efficient serial code
    and need to explore many data sets simultaneously or need to run different scenarios
    with the same code. For these users, the master/worker paradigm, sometimes called
    “task parallelism” or “task farming,” is best.

    +   - **Tightly coupled parallelism:** Some users have jobs that require two or
    more compute servers connected by a high-performance network interconnect. Problems
    are solved in parallel by dividing the code over the available computers and having
    the processes communicate necessary data and information over the network. High-bandwidth,
    low-latency networks often are required for this type of application to perform
    well. At CTC our parallel compute clusters use CLAN from Emulex Corporation.


    Users of the CTC resources conduct research in a wide variety of areas, including
    the following:


    +   - Agricultural Economics

    +   - Astronomy

    +   - Chemical Engineering

    +   - Clinical Sciences

    +   - Design and Environmental Analysis

    +   - Electrical Engineering

    +   - Marketing

    +   - Mechanical/Aerospace Engineering

    +   - Nuclear Science and Engineering

    +   - Plant Breeding and Biometry


    +   - Animal Science

    +   - Biochemistry, Biology

    +   - Civil/Environmental Engineering

    +   - Computer Science

    +   - Ecology and Systematics

    +   - Geological Sciences

    +   - Mathematics

    +   - Neurobiology and Behavior

    +   - Physics

    +   - Theoretical and Applied Mechanics'
  merge: -1
  img_proc: true
