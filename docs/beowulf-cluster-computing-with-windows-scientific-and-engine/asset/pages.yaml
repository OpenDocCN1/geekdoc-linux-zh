- pgno: 21
  md: '# Foreword


    We know two things about progress in parallel programming:


    +   1. Like nearly all technology, progress comes when effort is headed in a common,
    focused direction with technologists competing and sharing results.

    +   2. Parallel programming remains very difficult and should be avoided if at
    all possible. This argues for a single environment and for someone else to do
    the programming through built-in parallel function (e.g., databases, vigorous
    applications sharing, and an applications market).


    After 20 years of false starts and dead ends in high-performance computer architecture,
    “the way” is now clear: Beowulf clusters are becoming the platform for many scientific,
    engineering, and commercial applications. Cray-style supercomputers from Japan
    are still used for legacy or unpartitionable applications code; but this is a
    shrinking fraction of supercomputing because such architectures aren’t scalable
    or affordable. But if the code cannot be ported or partitioned, vector supercomputers
    at larger centers are required. Likewise, the Top500 share of proprietary MPPs¹
    (massively parallel processors), SMPs (shared memory, multiple vector processors),
    and DSMs (distributed shared memory) that came from the decade-long government-sponsored
    hunt for the scalable computer is declining. Unfortunately, the architectural
    diversity created by the hunt assured that a standard platform and programming
    model could not form. Each platform had low volume and huge software development
    costs and a lock-in to that vendor.


    Just two generations ago based on Moore’s law (1995²), a plethora of vector supercomputers,
    nonscalable multiprocessors, and MPP clusters built from proprietary nodes and
    networks formed the market. That made me realize the error of an earlier prediction
    that these exotic shared-memory machines were supercomputing’s inevitable future.
    At the time, several promising commercial off-the-shelf (COTS) technology clusters
    using standard microprocessors and networks were beginning to be built. Wisconsin’s
    Condor to harvest workstation cycles and Berkeley’s NOW (network of workstations)
    were my favorites. They provided one to two orders of


    +   ¹MPPs are a proprietary variant of clusters or multicomputers. Multicomputers
    is the name Allen Newell and I coined in our 1971 book, *Computer Structures*,
