  md: 'Fortran derived datatypes cannot be directly supported (the Fortran 90 language
    provides no way to handle an arbitrary type). Often, you can use the first element
    of the Fortran 90 derived type. Array sections should not be used in receive operations,
    particularly nonblocking communication (see Section 10.2.2 in the MPI-2 standard
    for more information). Another problem is that while Fortran 90 enables the user
    to define MPI interfaces in the MPI module, a different Fortran 90 interface file
    must be used for each combination of Fortran datatype and array dimension (scalars
    are different from arrays of dimension one, etc.). This leads to a Fortran 90
    MPI module library that is often (depending on the Fortran 90 compiler) far larger
    than the entire MPI library. However, particularly during program development,
    the MPI module is very helpful.


    # ### 10.9 MPI, OpenMP, and Threads


    The MPI standard was carefully written to be a thread-safe specification. That
    means the design of MPI doesn’t include concepts such as “last message” or “current
    pack buffer” that are not well defined when multiple threads are present. MPI
    implementations can choose whether to provide thread-safe *implementations*. Allowing
    this choice is particularly important because thread safety usually comes at the
    price of performance due to the extra overhead required to ensure that internal
    data structures are not modified inconsistently by two different threads. Most
    early MPI implementations were not thread safe.


    MPI-2 introduced four levels of thread safety that an MPI implementation could
    provide. The lowest level, `MPI_THREAD_SINGLE`, allows only single threaded programs.
    The next level, `MPI_THREAD_FUNNELED`, allows multiple threads provided that all
    MPI calls are made in a single thread; most MPI implementations provide `MPI_THREAD_FUNNELED`.
    The next level, `MPI_THREAD_SERIALIZED`, allows many user threads to make MPI
    calls, but only one thread at a time. The highest level of support, `MPI_THREAD_MULTIPLE`,
    allows any thread to call any MPI routine.


    Understanding the level of thread support is important when combining MPI with
    approaches to thread-based parallelism. OpenMP [12] is a popular and powerful
    language for specifying thread-based parallelism. While OpenMP provides some tools
    for general threaded parallelism, one of the most common uses is to parallelize
    a loop. If the loop contains no MPI calls, then OpenMP may be combined with MPI.
    For example, in the Jacobi example, OpenMP can be used to parallelize the loop
    computation:


    ```

    exchange_nbrs( u_local, i_start, i_end, left, right );

    ```'
