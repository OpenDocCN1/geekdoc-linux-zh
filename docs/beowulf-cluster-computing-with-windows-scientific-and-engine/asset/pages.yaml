  md: '(the rightmost). Both of these routines use `MPI_ANY_SOURCE` instead of a particular
    source in the `MPI_Recv` call. As Figure 10.8 shows, the messages can be confused,
    causing the program to receive the wrong data. How can we prevent this situation?
    Several approaches will not work. One is to avoid the use of `MPI_ANY_SOURCE`.
    This fixes this example, but only if both `SendRight` and `SendEnd` follow this
    rule. The approach may be adequate (though fragile) for code written by a single
    person or team, but it isn''t adequate for libraries. For example, if `SendEnd`
    was written by a commercial vendor and did not use `MPI_ANY_SOURCE`, but `SendRight`,
    written by a different vendor or an inexperienced programmer, did use `MPI_ANY_SOURCE`,
    then the program would still fail, and it would look like `SendEnd` was at fault
    (because the message from `SendEnd` was received first).


    Another approach that does not work is to use message tags to separate messages.
    Again, this can work if one group writes all of the code and is very careful about
    allocating message tags to different software modules. However, using `MPI_ANY_TAG`
    in an MPI receive call can still bypass this approach. Further, as shown in Figure
    6.5 in [6], even if `MPI_ANY_SOURCE` and `MPI_ANY_TAG` are not used, it is still
    possible for separate code modules to receive the wrong message.


    The communication context in an MPI communicator provides a solution to these
    problems. The routine `MPI_Comm_dup` creates a new communicator from an input
    communicator that contains the same processes (in the same rank order) but with
    a new communication context. MPI messages sent in one communication context can
    be received only in that context. Thus, any software module or library that wants
    to ensure that all of its messages will be seen only within that library needs
    only to call `MPI_Comm_dup` at the beginning to get a new communicator. All well-written
    libraries that use MPI create a private communicator used only within that library.


    Enabling the development of libraries was one of the design goals of MPI. In that
    respect MPI has been very successful. Many libraries and applications now use
    MPI, and, because of MPI''s portability, most of these run on Beowulf clusters.
    Table 10.1 provides a partial list of libraries that use MPI to provide parallelism.
    More complete descriptions and lists are available at `www.mcs.anl.gov/mpi/libraries`
    and at `sal.kachinotech.com/G/3`.


