    # ### 10.6.2  A More Complex Example


    Parallel I/O requires more than just calling `MPI_File_write` instead of *write*.
    The key idea is to identify the *object* (across processes), rather than the contribution
    from each process. We illustrate this with an example of a regular distributed
    array.


    The code in Figure 10.12 writes out an array that is distributed among processes
    with a two-dimensional decomposition. To illustrate the expressiveness of the
    MPI interface, we show a complex case where, as in the Jacobi example, the distributed
    array is surrounded by *ghost cells*. This example is covered in more depth in
    Chapter 3 of *Using MPI 2* [7], including the simpler case of a distributed array
    without ghost cells.


    This example may look complex, but each step is relatively simple.


    +   1.  Set up a communicator that represents a virtual array of processes that
    matches the way that the distributed array is distributed. This approach uses
    the `MPI_Cart_create` routine and uses `MPI_Cart_coords` to find the coordinates
    of the calling process in this array of processes. This particular choice of process
    ordering is important because it matches the ordering required by `MPI_Type_create_subarray`.


    +   2.  *Create a file view* that describes the part of the file that this process
    will write to. The MPI routine `MPI_Type_create_subarray` makes it easy to construct
    the MPI datatype that describes this region of the file. The arguments to this
    routine specify the dimensionality of the array (two in our case), the global
    size of the array, the local size (that is, the size of the part of the array
    on the calling process), the location of the local part (`start_indices`), the
    ordering of indices (column major is `MPI_ORDER_FORTRAN` and row major is `MPI_ORDER_C`),
    and the basic datatype.'
