    Windows 2000 supports C2-level security as defined by the U.S. Department of Defense
    Trusted Computer System Evaluation Criteria (DoD 5200.28-STD, December 1985).
    This standard includes discretionary (need-to-know) protection for all sharable
    system objects (such as files, directories, processes, and threads), security
    auditing (for accountability of subjects, or users, and the actions they initiate),
    password authentication at logon, and the prevention of one user from accessing
    uninitialized resources (such as free memory or disk space) that another user
    has deallocated.


    Windows NT 4 was formally evaluated at the C2 level and is on the U.S. government
    Evaluated Products List. (Windows 2000 is still in the evaluation process.) Also,
