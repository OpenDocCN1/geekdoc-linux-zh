- pgno: 296
  md: '# 11.7.3 Running PVM Programs


    In this section you will learn how to compile and run the example programs supplied
    with the PVM software. These example programs make useful templates on which to
    base your own PVM programs. PVM itself and all the example programs are built
    using the C/C++ Microsoft Visual Studio 6. The Fortran compiler used is the Compaq
    Fortran version 6. Since PVM’s origins are from the UNIX world, PVM comes with
    a make file that implements all the make file scripts necessary to build both
    PVM itself as well as all supplied example codes. Simply click on the PVM Compile
    Shell icon on your desktop and it will launch a DOS shell window with the correct
    paths and resources allocated for this purpose. It starts in the $HOME\PVM3.4
    directory. From here simply type make and it will display a selection of command-line
    options to do everything from removing the current PVM installation and rebuilding
    to doing the same for only the supplied examples. It is up to you, the user, to
    decide if you want to build your applications using the make technique or directly
    in the Microsoft Visual Studio style. Note that UNIX make files are not directly
    portable to the Windows environment.


    From one window start up PVM and configure some hosts. These examples are designed
    to run on any number of hosts, including one. In another window, cd to the location
    of the PVM executables and type


    ```

    > master

    ```


    The program will ask about the number of tasks. This number does not have to match
    the number of hosts in these examples. Try several combinations.


    The first example illustrates the ability to run a PVM program from a prompt on
    any host in the virtual machine. This is how you would run a serial a.out program
    on a workstation. To next example, which is also a master/slave model called hite,
    shows how to spawn PVM jobs from the PVM console and also from XPVM.


    The model hite illustrates dynamic load balancing using the pool of tasks paradigm.
    In this paradigm, the master program manages a large queue of tasks, always sending
    idle slave programs more work to do until the queue is empty. This paradigm is
    effective in situations where the hosts have very different computational powers
    because the least-loaded or more powerful hosts do more of the work and all the
    hosts stay busy until the end of the problem.


    Since hite does not require any user input, it can be spawned directly from the
    PVM console. Start the PVM console, and add a few hosts. At the PVM console prompt,
    type


    ```

    pvm> spawn -> hite

    ```'
  merge: -1
  img_proc: true
