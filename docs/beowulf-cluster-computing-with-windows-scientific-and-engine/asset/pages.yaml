    **Simulation.** Simulation allows a site to specify a workload and resource configuration
    trace file. These traces, specified via the `SIMWORKLOADTRACEFILE` and `SIMRESOURCETRACEFILE`,
    can accurately and reproducibly replicate the workload and resources recorded
    at the site. To run a simulation, an adjusted `maui.cfg` file is created with
    the policies of interest in place and the parameter `SERVERMODE` set to `SIMULATION`.
    Once started, Maui can be stepped through simulated time using the `schedctl`
    command. All Maui commands continue to function as before, allowing interactive
    querying of status, adjustment to parameters, or even submission or cancellation
    of jobs.


    This feature enables sites to analyze the impact of different scheduling policies
    on their own workload and system configuration. The effects of new reservations
    or job prioritizations can be evaluated in a *zero-exposure* environment, allowing
    sites to determine ideal policies without experimenting on a production system.
    Sites can also evaluate the impact of additional or modified workloads or changes
    in available resources. What impact will removing a block of resources for maintenance
    have on average queue time? How much benefit will a new reservation dedicated
    exclusively to development jobs have on development job turnaround time? How much
    pain will it cause nondevelopment jobs? Using simulation makes it easier to obtaining
    answers to such questions.


    This same simulation feature can be used to test a new algorithm against workload
    and resource traces from various supercomputing centers. Moreover, with the simulator,
    you can create and plug in modules to emulate the behavior of various job types
    on different hardware platforms, cross bottlenecking networks, or under various
    data migration conditions.


    The capabilities and use of simulation cannot be adequately covered in a chapter
    of this size. Further information is given in the Simulation section of the Maui
    Administrators Manual.


    # 15.4 Steering Workload and Improving Quality of Information


    A good scheduler can improve the use of a cluster significantly, but its effectiveness
    is limited by the scheduling environment in which it must work and the quality
    of information it receives. Often, a cluster is underutilized because users overestimate
    a job''s resource requirements. Other times, inefficiencies crop up when users
    request'
