    # #### 16.4.1 Network Addresses and PBS


    PBS makes use of fully qualified host names for identifying the jobs and their
    location. A PBS installation is known by the host name on which the Server is
    running. The name used by the daemons or used to authenticate messages is the
    canonical host name. This name is taken from the primary name field, h_name, in
    the structure returned by the library call gethostbyaddr(). According to the IETF
    RFCs, this name must be fully qualified and consistent for any IP address assigned
    to that host.


    # #### 16.4.2 The qmgr Command


    The PBS manager command, qmgr, provides a command-line administrator interface.
    The command reads directives from standard input. The syntax of each directive
    is checked and the appropriate request sent to the Server(s). A qmgr directive
    takes one of the following forms:


    ```

    command server [names] [attr OP value[, ...]]

    command queue [names] [attr OP value[, ...]]

    command node [names] [attr OP value[, ...]]

    ```


    where command is the command to perform on an object. The qmgr commands are listed
    in Table 16.4.


    The list or print subcommands of qmgr can be executed by the general user. Creating
    or deleting a queue requires PBS Manager privilege. Setting or unsetting server
    or queue attributes requires PBS Operator or Manager privilege.


    Here are several examples that illustrate using the qmgr command. These and other
    qmgr commands are fully explained below, along with the specific tasks they accomplish.'
