    **Grid computing:** Condor incorporates many of the emerging Grid-based computing
    methodologies and protocols. It can interact with resources managed by Globus.


    # 14.1.2  Understanding Condor ClassAds


    The ClassAd is a flexible representation of the characteristics and constraints
    of both machines and jobs in the Condor system. *Matchmaking* is the mechanism
    by which Condor matches an idle job with an available machine. Understanding this
    unique framework is the key to harness the full flexibility of the Condor system.
    ClassAds are employed by users to specify which machines should service their
    jobs. Administrators use them to customize scheduling policy.


    **Conceptualizing Condor ClassAds: Just Like the Newspaper.**  Condor’s ClassAds
    are analogous to the classified advertising section of the newspaper. Sellers
    advertise specifies about what they have to sell, hoping to attract a buyer. Buyers
    may advertise specifics about what they wish to purchase. Both buyers and sellers
    list constraints that must be satisfied. For instance, a buyer has a maximum spending
    limit, and a seller requires a minimum purchase price. Furthermore, both want
    to rank requests to their own advantage. Certainly a seller would rank one offer
    of $50 higher than a different offer of $25. In Condor, users submitting jobs
    can be thought of as buyers of compute resources and machine owners are sellers.


    All machines in a Condor pool advertise their attributes, such as available RAM
    memory, CPU type and speed, virtual memory size, current load average, current
    time and date, and other static and dynamic properties. This machine ClassAd also
    advertises under what conditions it is willing to run a Condor job and what type
    of job it prefers. These policy attributes can reflect the individual terms and'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'preferences by which the different owners have allowed their machines to participate
    in the Condor pool.


    After a job is submitted to Condor, a job ClassAd is created. This ClassAd includes
    attributes about the job, such as the amount of memory the job uses, the name
    of the program to run, the user who submitted the job, and the time it was submitted.
    The job can also specify requirements and preferences (or *rank*) for the machine
    that will run the job. For instance, perhaps you are looking for the fastest floating-point
    performance available. You want Condor to rank available machines based on floating-point
    performance. Perhaps you care only that the machine has a minimum of 256 MBytes
    of RAM. Or, perhaps you will take any machine you can get! These job attributes
    and requirements are bundled up into a job ClassAd.


    Condor plays the role of matchmaker by continuously reading all the job ClassAds
    and all the machine ClassAds, matching and ranking job ads with machine ads. Condor
    ensures that the requirements in both ClassAds are satisfied.


    # **Structure of a ClassAd.** A ClassAd is a set of uniquely named expressions.
    Each named expression is called an *attribute*. Each attribute has an *attribute
    name* and an *attribute value*. The attribute value can be a simple integer, *string*,
    or floating-point value, such as


    ```

    Memory = 512

    OpSys = "LINUX"

    NetworkLatency = 7.5

    ```


    An attribute value can also consist of a logical expression that will evaluate
    to TRUE, FALSE, or UNDEFINED. The syntax and operators allowed in these expressions
    are similar to those in C or Java, that is, == for equals, != for not equals,
    && for logical and, || for logical or, and so on. Furthermore, ClassAd expressions
    can incorporate attribute names to refer to other attribute values. For instance,
    consider the following small sample ClassAd:


    ```

    MemoryInMegas = 512

    MemoryInBytes = MemoryInMegas * 1024 * 1024

    Cpus = 4


    BigMachine = (MemoryInMegas > 256) && (Cpus >= 4)

    VeryBigMachine = (MemoryInMegas > 512) && && (Cpus >= 8)

    FastMachine = BigMachine && SpeedRating

    ```


    In this example, *BigMachine* evaluates to TRUE and *VeryBigMachine* evaluates
    to FALSE. But, because attribute *SpeedRating* is not specified, *FastMachine*
    would evaluate to UNDEFINED.'
