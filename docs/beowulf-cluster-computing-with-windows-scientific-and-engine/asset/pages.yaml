  md: '\frac{A_{i+1,j}-A_{i,j}}{\triangle t}=\frac{A_{i,j+1}-2A_{i,j}+A_{i,j-1}}{\triangle
    x^{2}},


    giving the explicit formula


    A_{i+1,j}=A_{i,j}+\frac{\triangle t}{\triangle x^{2}}(A_{i,j+1}-2A_{i,j}+A_{i,j-1}).


    The initial and boundary conditions are


    A(t,0)=0, A(t,1)=0 for all t


    A(0,x)=sin(\pi x) for 0 \leq x \leq 1.


