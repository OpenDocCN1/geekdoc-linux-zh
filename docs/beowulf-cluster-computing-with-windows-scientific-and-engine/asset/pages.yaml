- pgno: 392
  md: '# # 16 PBS: Portable Batch System


    *James Patton Jones*


    The Portable Batch System (PBS) is a flexible workload management and job scheduling
    system originally developed to manage aerospace computing resources at NASA. PBS
    has since become the leader in supercomputer workload management and an increasingly
    popular choice for job scheduling on Windows 2000 clusters.


    Today, growing enterprises often support hundreds of users running thousands of
    jobs across different types of machines in different geographical locations. In
    this distributed heterogeneous environment, it can be extremely difficult for
    administrators to collect detailed, accurate usage data or to set systemwide resource
    priorities. As a result, many computing resources are left undersued, while others
    are overused. At the same time, users are confronted with an ever-expanding array
    of operating systems and platforms. Each year, scientists, engineers, designers,
    and analysts waste countless hours learning the nuances of different computing
    environments, rather than being able to focus on their core priorities. PBS addresses
    these problems for computing-intensive industries such as science, engineering,
    finance, and entertainment.


    PBS allows you to unlock the potential in the valuable assets you already have,
    while at the same time reducing demands on system administrators, freeing them
    to focus on other activities. PBS can also help you effectively manage growth
    by tracking use levels across your systems and enhancing effective utilization
    of future purchases.


    # ## 16.1 History of PBS


    In the past, computers were used in a completely interactive manner. Background
    jobs were just processes with their input disconnected from the terminal. As the
    number of processors in computers continued to increase, however, the need to
    be able to schedule tasks based on available resources rose in importance. The
    advent of networked compute servers, smaller general systems, and workstations
    led to the requirement of a networked batch scheduling capability. The first such
    Unix-based system was the Network Queueing System (NQ) from NASA Ames Research
    Center in 1986. NQ) quickly became the de facto standard for batch queuing.


    Over time, distributed parallel systems began to emerge, and NQ) was inadequate
    to handle the complex scheduling requirements presented by such systems. In addition,
    computer system managers wanted greater control over their compute resources,
    and users wanted a single interface to the systems. In the early 1990s'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'NASA needed a solution to this problem, but after finding nothing on the market
    that adequately addressed their needs, led an international effort to gather requirements
    for a next-generation resource management system. The requirements and functional
    specification were later adopted as an IEEE POSIX standard (1003.2d). Next, NASA
    funded the development of a new resource management system compliant with the
    standard. Thus the Portable Batch System was born.


    PBS was quickly adopted on distributed parallel systems and replaced NQS on traditional
    supercomputers and server systems. Eventually the entire industry evolved toward
    concentrated parallel systems, taking the form of both special-purpose and commodity
    clusters. Managers of such systems found that the capabilities of PBS mapped well
    onto cluster systems.


    The latest chapter in the PBS story began when Veridian (the Research and Development
    contractor that developed PBS for NASA) released the Portable Batch System Professional
    Edition (PBS Pro), a complete workload management solution. The cluster administrator
    can now use the commercial version of this space-age technology to manage the
    workload on Windows 2000 clusters.


    This chapter gives a technical overview of PBS Pro and information on installing,
    using and managing PBS. However, it is not possible to cover all the details of
    a software system the size and complexity of PBS in a single chapter. Therefore,
    we limit this discussion to the recommended configuration for clusters, providing
    references to the various PBS documentation where additional, detailed information
    is available.


    # 16.1.1 Acquiring PBS


    While PBS Pro is bundled in a variety of cluster kits, the best source for the
    most current release is the official Veridian PBS Pro Web site: **ww. PBSPro.com**.
    This site offers downloads of the software and documentation, as well as FAQs,
    discussion lists, and current PBS news. Hardcopy documentation, support services,
    training and PBS Pro software licenses are available from the PBS Pro Online Store,
    accessed through the PBS Web site.


    # 16.1.2 PBS Features


    PBS Pro provides many features and benefits to the cluster administrator. A few
    of the more important features are the following:


    *Enterprisewide resource sharing* provides transparent job scheduling on any PBS
    system by any authorized user. Jobs can be submitted from any client system, both
    local and remote, crossing domains where needed.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'Multiple user interfaces provide a graphical user interface for submitting
    batch and interactive jobs; querying job, queue, and system status; and monitoring
    job progress. Also provided is a traditional command line interface.


    Security and access control lists permit the administrator to allow or deny access
    to PBS systems on the basis of username, group, host, and/or network domain.


    Job accounting offers detailed logs of system activities for charge-back or usage
    analysis per user, per group, per project, and per compute host.


    Automatic file staging provides users with the ability to specify any files that
    need to be copied onto the execution host before the job runs and any that need
    to be copied off after the job completes. The job will be scheduled to run only
    after the required files have been successfully transferred.


    Parallel job support works with parallel programming libraries such as MPI, PVM,
    and HPF. Applications can be scheduled to run within a single multiprocessor computer
    or across multiple systems.


    System monitoring includes a graphical user interface for system monitoring. PBS
    displays node status, job placement, and resource utilization information for
    both standalone systems and clusters.


    Job interdependency enables the user to define a wide range of interdependencies
    between jobs. Such dependencies include execution order, synchronization, and
    execution conditioned on the success or failure of another specific job (or set
    of jobs).


    Computational Grid support provides an enabling technology for meta-computing
    and computational Grids, including support for the Globus Toolkit.


    Comprehensive API includes a complete application programming interface for sites
    that wish to integrate PBS with other applications or to support unique job-scheduling
    requirements.


    Automatic load-leveling provides numerous ways to distribute the workload across
    a cluster of machines, based on hardware configuration, resource availability,
    keyboard activity, and local scheduling policy.


    Distributed clustering allows customers to use physically distributed systems
    and clusters, even across wide area networks.


    Common user environment offers users a common view of the job submission, job
    querying, system status, and job tracking over all systems.


    Cross-system scheduling ensures that jobs do not have to be targeted to a specific
    computer system. Users may submit their job and have it run on the first available
    system that meets their resource requirements.


    Job priority allows users the ability to specify the priority of their jobs; defaults
    can be provided at both the queue and system level.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '*User name mapping* provides support for mapping user account names on one
    system to the appropriate name on remote server systems. This allows PBS to fully
    function in environments where users do not have a consistent username across
    all the resources they have access to.


    *Full configurability* makes PBS easily tailored to meet the needs of different
    sites. Much of this flexibility is due to the unique design of the scheduler module,
    which permits complete customization.


    *Broad platform availability* is achieved through support of Windows 2000 and
    every major version of Unix and Linux, from workstations and servers to supercomputers.
    New platforms are being supported with each new release.


    *System integration* allows PBS to take advantage of vendor-specific enhancements
    on different systems (such as supporting cpusets on SGI systems and interfacing
    with the global resource manager on the Cray T3E).


    # ### 16.1.3 PBS Architecture


    PBS consists of two major component types: user-level commands and system daemons.
    A brief description of each is given here to help you make decisions during the
    installation process.


    PBS supplies both command-line programs that are POSIX 1003.2d conforming and
    a graphical interface. These are used to submit, monitor, modify, and delete jobs.
    These client commands can be installed on any system type supported by PBS and
    do not require the local presence of any of the other components of PBS. There
    are three classifications of commands: user commands that any authorized user
    can use, operator commands, and manager (or administrator) commands. Operator
    and manager commands require specific access privileges. (See also the security
    sections of the PBS Administrator Guide.)


    The job server daemon is the central focus for PBS. Within this document, it is
    generally referred to as the Server or by the execution name pbs_server. All commands
    and the other daemons communicate with the Server via an Internet Protocol (IP)
    network. The Server’s main function is to provide the basic batch services such
    as receiving or creating a batch job, modifying the job, protecting the job against
    system crashes, and running the job. Typically, one Server manages a given set
    of resources.


    The job executor is the daemon that actually places the job into execution. This
    daemon, pbs_mom, is informally called MOM because it is the mother of all executing
    jobs. (MOM is a reverse-engineered acronym that stands for Machine Oriented Mini-server.)
    MOM places a job into execution when it receives a copy of the job from a Server.
    MOM creates a new session as identical to a user login session as'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'possible. For example, if the user''s login shell is `csh`, then MOM creates
    a session in which `.login` is run as well as `.cshrc`. MOM also has the responsibility
    for returning the job''s output to the user when directed to do so by the Server.
    One MOM daemon runs on each computer that will execute PBS jobs.


    The job scheduler daemon, `pbs_sched`, implements the site''s policy controlling
    when each job is run and on which resources. The Scheduler communicates with the
    various MOMs to query the state of system resources and with the Server to learn
    about the availability of jobs to execute. The interface to the Server is through
    the same API (discussed below) as used by the client commands. Note that the Scheduler
    interfaces with the Server with the same privilege as the PBS manager.


    # ## 16.2 Using PBS


    From the user''s perspective, a workload management system enables you to make
    more efficient use of your time by allowing you to specify the tasks you need
    run on the cluster. The system takes care of running these tasks and returning
    the results to you. If the cluster is full, then it holds your tasks and runs
    them when the resources are available.


    With PBS you create a batch job that you then submit to PBS. A batch job is a
    shell script containing the set of commands you want run on the cluster. It also
    contains directives that specify the resource requirements (such as memory or
    CPU time) that your job needs. Once you create your PBS job, you can reuse it,
    if you wish, or you can modify it for subsequent runs. Example job scripts are
    shown below.


    PBS also provides a special kind of batch job called interactive batch. This job
    is treated just like a regular batch job (it is queued up and must wait for resources
    to become available before it can run). But once it is started, the user''s terminal
    input and output are connected to the job in what appears to be an `rlogin` session.
    It appears that the user is logged into one of the nodes of the cluster, and the
    resources requested by the job are reserved for that job. Many users find this
    feature useful for debugging their applications or for computational steering.


    PBS provides two user interfaces: a command-line interface (CLI) and a graphical
    user interface (GUI). You can use either to interact with PBS: both interfaces
    have the same functionality.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# 16.2.1 Creating a PBS Job


    Previously we mentioned that a PBS job is simply a shell script containing resource
    requirements of the job and the command(s) to be executed. Here is what a sample
    PBS job might look like the following:


    ```

    #!/bin/sh

    #PBS -l walltime=1:00:00

    #PBS -l mem=400mb

    #PBS -l ncpus=4

    #PBS -j oe


    cd ${HOME}/PBS/test

    mpirun -np 4 myprogram

    ```


    This script would then be submitted to PBS using the `qsub` command.


    Let us look at the script for a moment. The first line tells what shell to use
    to interpret the script. Lines 2–4 are resource directives, specifying arguments
    to the “resource list” (`-l`) option of `qsub`. Note that all PBS directives begin
    with `#PBS`. These lines tell PBS what to do with your job. Any `qsub` option
    can also be placed inside the script by using a `#PBS` directive. However, PBS
    stops parsing directives with the first blank line encountered.


    Returning to our example above, we see a request for 1 hour of wall-clock time,
    400 MBytes of memory and 4 CPUs. The fifth line is a request for PBS to merge
    the stdout and stderr file streams of the job into a single file. The last two
    lines are the commands the user wants executed: change directory to a particular
    location, then execute an MPI program called ''`myprogram`''.


    This job script could have been created in one of two ways: using a text editor,
    or using the `xpbs` graphical interface (see below).


    # 16.2.2 Submitting a PBS Job


    The command used to submit a job to PBS is `qsub`. For example, say you created
    a file containing your PBS job called ''`myscriptfile`''. The following example
    shows how to submit the job to PBS:


    ```

    % qsub myscriptfile

    12322.sol.pbspro.com

    ```


    The second line in the example is the job identifier returned by the PBS server.
    This unique identifier can be used to act on this job in the future (before it
    completes'
