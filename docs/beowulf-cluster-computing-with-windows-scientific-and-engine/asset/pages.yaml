    \ functions are\n\n```\nmhid = pvm_addmh( src, tag, context, *function );\npvm_delmh(\
    \ mhid );\n```\n\nOnce a message handler has been added by a task, whenever a\
    \ message arrives at this task with the specified source, message tag, and communication\
    \ context, the specified function is executed. The function is passed the message\
    \ so that it may unpack the message if desired. PVM places no restrictions on\
    \ the complexity of the function, which is free to make system calls or other\
    \ PVM calls. A message handler ID is returned by the add routine, which is used\
    \ in the delete message handler routine.\n\nThere is no limit on the number of\
    \ handlers you can set up, and handlers can be added and deleted dynamically by\
    \ each application task independently.\n\nBy setting up message handlers, you\
    \ can now write programs that can dynamically change the features of the underlying\
    \ virtual machine. For example, message handlers could be added that implement\
    \ active messages; the application then could use this form of communication rather\
    \ than the typical send/receive. Similar opportunities exist for almost every\
    \ feature of the virtual machine.\n\nThe ability of the application to adapt features\
    \ of the virtual machine to meet its present needs is a powerful capability that\
