  md: "that process add them up, however, we use another collective operation, `MPI_Reduce`.\
    \ `MPI_Reduce` performs not only collective communication but also collective\
    \ computation. In the call\n```c\nMPI_Reduce( &mpii, expi, 1, MPI_DOUBLE, MPI_SUM,\
    \ 0,\n            MPI_COMM_WORLD);\n```\nthe sixth argument is again the root.\
    \ All processes call `MPI_Reduce`, and the root process gets back a result in\
    \ the second argument. The result comes from performing an arithmetic operation,\
    \ in this case summation (specified by the fifth argument), on the data items\
    \ on all processes specified by the first, third, and fourth arguments.\n\nProcess\
    \ 0 concludes by printing out the answer, the difference between this approximation\
    \ and a previously computed accurate value of $\\pi$, and the time it took to\
    \ compute it. This illustrates the use of `MPI_Wtime`.\n\n`MPI_Wtime` returns\
    \ a double-precision floating-point number of seconds. This value has no meaning\
    \ in itself, but the *difference* between two such values is the wall-clock time\
    \ between the two calls. Note that calls on two different processes are not guaranteed\
    \ to have any relationship to one another, unless the MPI implementation promises\
    \ that the clocks on different processes are *synchronized* (see `MPI_WTIME_IS_GLOBAL`\
    \ in any of the MPI books).\n\nThe routine `MPI_Allreduce` computes the same result\
    \ as `MPI_Reduce` but returns the result to all processes, not just the root process.\
    \ For example, in the Jacobi iteration, it is common to use the two-norm of the\
    \ difference between two successive iterations as a measure of the convergence\
    \ of the solution.\n```c\n...\nnorm2local = 0.0;\nfor (ii=1; ii<1_end-1_start+1;\
    \ ii++)\n  for (jj=1; jj<NY; jj++)\n    norm2local += ulocal[ii][jj] * ulocal[ii][jj];\n\
    MPI_Allreduce( &norm2local, &norm2, 1, MPI_DOUBLE,\n               MPI_COMM_WORLD,\
    \ MPI_SUM );\nnorm2 = sqrt( norm2 );\n```\nNote that `MPI_Allreduce` is not a\
    \ routine for computing the norm of a vector. It merely combines values contributed\
    \ from each process in the communicator."
