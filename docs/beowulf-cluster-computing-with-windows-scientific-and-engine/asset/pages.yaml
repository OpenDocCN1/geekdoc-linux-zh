- pgno: 414
  md: '# **17** **MPI Software Technology, Inc., Cluster CoNTroller**


    David Lafka


    In 1997, Cornell University was funded by Intel’s Technology for Education 2000
    program to investigate the use of Intel-based computers for a broad range of research
    and computing projects (see www.cs.cornell.edu/tech2000). The role of the Cornell
    Theory Center (CTC) in that proposal was to develop a parallel Windows-based cluster
    and job-scheduling system and to evaluate its feasibility as a high-performance
    computing platform. Led by David Lafka, CTC developed a Windows job-scheduling
    system called Cluster CoNTroller.


    The original design goal of Cluster CoNTroller was to provide an easy-to-use heterogeneous
    resource job scheduler that behaved (from the users’ perspective) like other parallel
    scheduling systems and leveraged Windows 2000 technology wherever possible. After
    several months of using the system, we began to investigate how we could add other
    parallel programming tools needed by our users, arguably the most important tool
    being MPI. Since our objective was to use commercially supported tools wherever
    possible, we began searching for a commercial Windows implementation of MPI. Eventually
    we decided to partner with MPI Software Technology, Inc. (MSTI) and to license
    Cluster CoNTroller to them; they in turn agreed to harden Cluster CoNTroller as
    a product and provide it—together with MPI/Pro, their commercial MPI implementation—to
    others interested in production-quality cluster computing.


    In this chapter we describe the MPI Software Technology, Inc. Cluster CoNTroller.
    We discuss its components, its configuration, and its strengths. We also work
    through an example of how to submit a parallel job to the scheduler.


    # **17.1** **Overview of Cluster CoNTroller**


    Cluster CoNTroller provides parallel batch and interactive job scheduling for
    dedicated computational clusters of Windows 2000 workstations or servers. Cluster
    CoNTroller efficiently manages all types of jobs, from serial to massively parallel,
    and ensures that they are run in a timely, deterministic fashion, thereby increasing
    the throughput of computation. Ideal for users who routinely want to run computational
    science or finance applications in parallel, Cluster CoNTroller is well situated
    to schedule programs written using MPI/Pro, but it will also support any other
    type of Windows application.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# ### 17.1.1 Strengths


    At the heart of Cluster CoNTroller is a deterministic heterogeneous scheduling
    algorithm that allows users to specify hardware and software resource requirements
    for parallel and serial jobs and to use the resources in batch or interactive
    mode. In batch mode, the scheduling system runs the user''s job as that user on
    the resources it allocates. In interactive mode, the user logs in, via Telnet,
    to the nodes allocated and runs a job by hand until the time allotment expires.
    In both cases, Cluster CoNTroller allocates resources (starts the batch jobs)
    and then gets out of the way. No polling or resource monitoring occurs during
    a user''s time allocation. Thus, the entire computer and network resources are
    available to the user. Cluster CoNTroller commands themselves are not resource
    intensive and generate very low overhead to the cluster resources.


    Cluster CoNTroller was designed with flexibility in mind. Cluster CoNTroller commands
    can easily be adapted via scripting language wrappers to behave in a way specific
    to different environments. In addition, Cluster CoNTroller can be purchased with
    a Perl-based scheduling core that can easily be customized for any environment.
    Further, MPI Software Technology consultants can provide customized scheduling
    algorithms to meet a customer''s specific requirements.


    # ### 17.1.2 Availability


    Cluster CoNTroller is sold under a support-only pricing model. You may download
    Cluster CoNTroller for free from the MSTI Web site, www.mpi-softtech.com for up
    to 16 computers with no support. Support and licenses for additional computers
    are competitively priced. Microsoft has licensed Cluster CoNTroller and MPI/Pro
    for up to 16 computers from MSTI and makes it available on their High Performance
    Resource Kit CD set (see `https://microsoft.order-1.com/ctcp`).


    # ## 17.2 Installation Configuration


    A Cluster CoNTroller system comprises four basic resource types: login nodes,
    file servers, scheduler node/domain controller, and compute nodes. In many large
    installations these resources are supported on dedicated computers, but in smaller
    configurations it is certainly not necessary.


    # ### 17.2.1 Login Nodes


    Login nodes provide remote access to the cluster resources and the Cluster CoNTroller
    commands. Typically, they provide Telnet and Terminal Server (including'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Citrix support for non-Windows clients, if necessary) access. All the scheduler
    commands, compilers, and user-level cluster monitoring tools usually are available
    on the login nodes. These nodes are commonly used to compile and link codes to
    run on the cluster, develop batch scripts, and provide scheduler access for submitting,
    monitoring, and canceling jobs on the cluster.


    Login nodes are useful in a production environment to ensure that all users have
    access to the necessary software and tools to use the cluster no matter where
    they are accessing it from. In many smaller, dedicated cluster environments, however,
    login nodes may not be needed. Instead, individual desktops in the same Windows
    domain can be configured to interact with the scheduling system.


    # 17.2.2 File Servers


    File servers under Windows work in a manner different from file servers in a Unix
    system. Under Windows, remote file access is built into the operating system,
    without requiring mounted file systems such as NFS. Windows provides two simple-to-use
    mechanisms to access files remotely. As discussed in Section 7.1.2, Windows “shares”
    (or shared files or folders) can be accessed via a UNC or by mapping them to a
    local drive letter via Windows explorer.


    The Cornell Theory Center has several file servers each with one terabyte of Small
    Computer System Interface (SCSI) attached storage that is made available as a
    single logical volume via Microsoft’s Distributed File System, DFS. All cluster
    nodes map this share as H: via a Windows service so that it is persistent, even
    if no one is logged in at the console (normally all mapped drives are disconnected
    when the user logs off). This approach allows users to access their home directory
    from any cluster node, including the login nodes, for example,


    ```

    c:\ dir h:\users\\lifka

    ```


    Section 7.1.2 shows a simple Perl script that runs as a Windows service to map
    a network drive even after the console is logged out. You can download the module
    from www. roth. net/perl/.


    # 17.2.3 Compute Nodes


    Compute nodes are the components on which jobs are actually run. These nodes typically
    are configured with minimal software (e.g., Telnet, Cygwin, Perl, Python, and
    MPI). Cluster CoNTroller manages and allocates these compute nodes for the various
    jobs that are submitted to the cluster.'
  merge: -1
  img_proc: true
