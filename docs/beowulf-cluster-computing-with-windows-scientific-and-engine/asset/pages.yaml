    # Windows Networking Files. LMHOSTS and HOSTS both are files used by the Microsoft
    TCP/IP for Windows. These two files contain cluster node names and IP information
    so that Windows networking may locally resolve machine and host names. Both files
    are located in the C:\WINNT\system32\drivers\etc directory. Sample files are placed
    in this location when a Windows system is first built. The sample files contain
    additional information regarding instruction options. Only those necessary for
    the PVM installation will be discussed here. LMHOSTS contains mappings of IP addresses
    to computer names. Each entry is on an individual line, with the IP address followed
    by the corresponding computer name and then #PRE, which causes the entry to be
    preloaded into the name cache. There must be at least one blank space between
    each entry on a line.


    ```

    # Filename: LMHOSTS

    134.123.10.30    node1    #PRE

    134.123.10.31    node2    #PRE

    134.123.10.32    node3    #PRE

    134.123.10.33    node4    #PRE

    ```


    HOSTS contains the mappings of IP addresses to hostnames. Each entry is on an
    individual line, with the IP address in the first column followed by the corresponding
    hostname. There must be at least one blank space between each entry on a line.


    ```

    # Filename: HOSTS

    ```'
