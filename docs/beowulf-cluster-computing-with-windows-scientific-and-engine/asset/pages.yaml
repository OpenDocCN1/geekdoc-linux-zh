- pgno: 279
  md: 'However, for this program we would like to think of the tasks as a two-dimensional
    conceptual torus. In order to enumerate the tasks, each task joins the group **mmult**.
    Group ids are used to map tasks to our torus. The first task to join a group is
    given the group id of zero. In the **mmult** program, the task with group id zero
    spawns the other tasks and sends the parameters for the matrix multiply to these
    tasks. The parameters are *m* and *blksiz*e, the square root of the number of
    blocks and the size of a block, respectively. After all the tasks have been spawned
    and the parameters transmitted, **pvm_barrier()** is called to make sure all the
    tasks have joined the group. If the barrier is not performed, later calls to **pvm_gettid()**
    might fail, since a task may not have yet joined the group.


    After the barrier, the task ids for the other tasks are stored in the *row* in
    the array **myrow**. Specifically, the program calculates group ids for all the
    tasks in the row, and we ask **PVM** for the task id for the corresponding group
    id. Next the program allocates the blocks for the matrices using **malloc()**.
    (In an actual application program we would expect that the matrices would already
    be allocated.) Then the program calculates the row and column of the block of
    $C$ it will be computing; this is based on the value of the group id. The group
    ids range from 0 to $m-1$ inclusive. Thus, the integer division of $\langle mygid
    / m \rangle$ will give the task''s row and $\langle mygid \pmod m \rangle$ will
    give the column if we assume a row major mapping of group ids to tasks. Using
    a similar mapping, we calculate the group id of the task directly *above* and
    *below* in the torus and store their task ids in **up** and **down**, respectively.


    Next the blocks are initialized by calling **InitBlock()**. This function simply
    initializes $A$ to random values, $B$ to the identity matrix, and $C$ to zeros.
    This will allow us to verify the computation at the end of the program by checking
    that $A = C$.


    Finally we enter the main loop to calculate the **matrix multiply**. First the
    tasks on the diagonal multicast their block of $A$ to the other tasks in their
    row. Note that the array **myrow** actually contains the task id of the task doing
    the multicast. Recall that **PVM_cast()** will send to all the tasks in the tasks
    array except the calling task. This works well in the case of **mmult**, since
    we don''t want to have to needlessly handle the extra message coming into the
    multicasting task with an extra **pvm_recv()**. Both the multicasting task and
    the tasks receiving the block calculate the $AB$ for the diagonal block and the
    block of $B$ residing in the task.


    After the subblocks have been multiplied and added into the $C$ block, we now
    shift the $B$ blocks vertically. This is done by packing the block of $B$ into
    a message and sending it to the **up** task id and then receiving a new $B$ block
    from the **down** task id.'
