  md: 'The distribution is available in several forms. The one appropriate for most
    users is `mpich.nt.1.2.1.zip`, which contains everything you need to compile and
    run MPI programs.


    The various distributions are as follows:


    +   *   **Full source tree:** `mpich.nt.1.2.1.src.exe` is a self-extracting WinZip
    archive.


    +   *   **Binary distribution:** `mpich.nt.1.2.1.zip` contains the runtime DLLs,
    services to start MPI programs, the Visual C++ software developers kit (SDK),
    and the gcc SDK. An SDK is needed to compile applications but not to run them.
    You should use `setup.exe` to install the DLLs and at least one job launcher on
    all machines that will be used to run MPI processes.


    +   *   **Software Developers Kit:** `mpich.nt.1.2.1.zip` contains the SDK, which
    in- cludes libraries and `include` files to compile an MPI application using Microsoft
    Visual C++ and/or Visual Fortran 6.


    +   *   **gcc Software Developers Kit:** `mpich.nt.1.2.1.zip` contains the gcc
    SDK, which includes libraries and `include` files to compile an MPI application
    using gcc and the Cygwin tools.


    **Using MPiRun.** The easiest way to run an MPI program is with


    ```

    MPiRun -np 2 myapp.exe

    ```


    The `MPiRun` program accepts several other arguments; see the documentation for
    a complete list. The most commonly used are as follows:


    +   *   `-env name=value` to pass environment variables to the program. A typical
    use of this is to pass environment variables that MPICH itself uses. For example,


    ```

    MPiRun -np 2 -env "MPICH_USE_POLLING=1|MPICH_SINGLETHREAD=1" mpptest.exe

    ```


    is appropriate for getting the lowest latency in message passing. See the documen-
    tation under "Subtle Configuration Options" for more details on the environment
    variables that affect MPICH.


    +   *   `-localonly n` to run $n$ processes on the local machine, using shared
    memory to communicate between processes. This is often helpful when debugging
    an MPI program.'
