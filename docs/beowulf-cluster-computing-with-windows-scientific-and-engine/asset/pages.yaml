    # 18.2 Systems Overview


    Today CTC has several large parallet clusters, as well as associated resources
    such as file servers and login nodes. In this section we briefly describe the
    current cluster resources at CTC and their purposes.


    # 18.2.1 File Servers


    Having a main file system available on whatever resource a user logs into is essential.
    At CTC we currently have three dedicated file servers each with one terabyte of
    SCSI attached storage. We use Microsoft’s Distributed File System to map the physical
    disk volumes onto one logical volume that users can map to their local machines
    and is automatically mapped to every cluster node as the “H:” drive. The three
    available terabytes store the data and tools that users need to interact with
    the cluster resources.


    +   - H:\ Home, where all main directories are stored

    +   - H:\Users User home directories

    +   - H:\CTC Tools Scheduler commands, help, setup files for various pieces of
    software, and Login.bat


    Whenever a user logs into a CTC resource, login.bat is automatically executed.
    This checks for the existence of a .bashrc or .cshrc file in the user’s home directory,
    thereby enabling us to control path settings and to allow users to set up their
    own shell environments at login.


    # 18.2.2 Login Nodes


    The CTC login nodes are two dedicated dual-processor servers that run Citix MetaFrame,
    Terminal Server, and Seattle Labs SPlanet Telnet Service. These machines allow
    remote users to access the CTC cluster resources from any platform. Users can
    use these machines to compile codes, develop batch scripts, and interact with
    the Cluster CoNTroller job scheduling system to submit and monitor jobs.


