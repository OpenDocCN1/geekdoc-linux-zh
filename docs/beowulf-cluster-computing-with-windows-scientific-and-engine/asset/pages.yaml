  md: 'by default. Since XPVM attempts to draw the views in real time, the fewer open
    views the faster XPVM can draw.


    The Utilization view shows the number of tasks computing, in overhead, or waiting
    for each instant. It is a summary of the Space-time view for each instant. Since
    the number of tasks in a PVM application can change dynamically, the scale on
    the Utilization view will change dynamically when tasks are added, but not when
    they exit. When this happens, the displayed portion of the Utilization view is
    completely redrawn to the new scale.


    The Call Trace view provides a textual record of the last PVM call made in each
    task. The list of tasks is the same as in the Space-time view. As an application
    runs, the text changes to reflect the most recent activity in each task. This
    view is useful as a call-level debugger to identify where a PVM program''s execution
    hangs.


    XPVM automatically tells all tasks it spawns to redirect their standard output
    back to XPVM when the Task Output view is opened. This view gives you the option
    of redirecting the output into a file. If you type a file name in the “Task Output”
    box, the output is printed in the window and into the file.


    As with the trace events, a task started outside XPVM can be programmed to send
    standard output to XPVM for display by using the options in pvm_setopt(). XPVM
    expects the OutputCode to be set to 667.'
