  \ \"-\", $0); print }'\n```\nJohn-Smith\n\n### 使用正则表达式分割\n\n以下 `awk` 命令展示了如何使用正则表达式将字符串分割为多个字段。\n\
  \n\n\n\n\n```bash\necho \"abc !@#\" | awk '\nBEGIN {\n  punct_regexp = \"[[:punct:]]+\"\
  \n} \n  $0 ~ punct_regexp    { print }\n'\n```\n列表 6.12 包含一个 `awk` 命令，其中包含一个 `BEGIN`\
  \ 块，该块将变量 `punct_regexp` 初始化为一个或多个标点字符的模式。下一个代码片段检查 `$0` 是否匹配 `punct_regexp` 中定义的模式，如果是，则打印\
  \ `$0` 的内容。运行列表 6.12 中的代码，你将看到以下输出：\n\nabc !@#\n\n## 涉及文本文件的正则表达式\n\n上一个（相当冗长的）章节向你展示了如何执行许多涉及文本文件的简单任务。本节包含多个子章节，其中包含\
  \ `awk` 命令用于显示匹配特定字符的行、匹配多个字符的行等。代码示例依赖于基础元字符，例如作为“开头”函数的 `^` 配合正则表达式，以及作为或（OR）运算符的\
  \ `|`，以及作为非（NOT）运算符的 `!`。\n\n## 使用正则表达式计数注释\n\n列表 6.13 显示了 `comments.txt` 的内容，其中包含\
  \ `awk`、`C` 和 `Python` 的各种注释样式。列表 6.14 显示了 `comments.sh` 的内容，该脚本使用不同的样式计算注释的数量。\n\
  \n***Listing 6.13: comments.txt***\n```text\n# this is an awk and Python style comment//\
  \ this is a C-style commentx = 1\n\ny = 3  # pound-style comment number two  //\
  \ another C-style comment  # pound-style comment number three  // a third C-style\
  \ comment\"\"\" python style comment \"\"\"\n```\n\n***Listing 6.14: comments.sh***\n\
  ```awk\nawk '\nBEGIN {\n  c_count  = 0; awk_count = 0;\n  c_count2 = 0; awk_count2\
  \ = 0\n  py_count = 0;\n}\n{\n  if($0 ~ /^#/) { awk_count++ }\n  else if ($0 ~ /^\\\
  /\\//)  { c_count++ }\n  else if ($0 ~ /^\"\"\"/)     { py_count++ }\n  else if\
  \ ($0 ~ /^[ ].*#/) { awk_count2++ }\n  else if ($0 ~ /^[ ].*\\/\\//) { c_count2++\
  \ }\n}\nEND {\n  print \"C-style comments:  \",c_count\n  print \"awk-style comments:\"\
  ,awk_count\n  print \"C-style comments:  \",c_count2\n  print \"awk-style comments:\"\
  ,awk_count2\n  print \"python-style comments:\",py_count\n}\n' comments.txt\n```\n\
  列表 6.14 包含一个 `awk` 命令，它从 `BEGIN` 块开始，该块初始化了几个标量变量，用于计算不同类型命令语句出现的次数。\n\n列表 6.14\
  \ 的下部分包含主执行块，其中包含条件代码片段，用于将 `$0` 中的第一个字符与 `//`、`\"\"\"`、`#` 和 `//` 进行比较，这些分别是 `C`、`Python`、`awk`\
  \ 和 `C` 的注释语句。每当条件代码片段匹配此类字符串时，对应的标量变量就会加增。\n\n列表 6.14 的最后部分包含一个 `END` 块，用于打印各种标量变量的值。运行列表\
  \ 6.14 中的代码，你将看到以下输出：\n\nC-style comments:   1awk-style comments: 1C-style comments:\
  \   2awk-style comments: 2python-style comments: 1\n\n### 将 grep 与 awk 结合\n\n列表\
  \ 6.15 显示了 `employees.csv` 的内容，列表 6.16 显示了 `grep_awk.sh` 的内容，该脚本计算 `employees.csv`\
  \ 中员工的开支。\n\n***Listing 6.15: employees.csv***\n```text\n# remove header line and\
  \ blank lines with 'sed':\nempid,full_name,start_date,expenses\n1000,Jane Jones,12/05/2021,93.55\n\
  2000,John Smith,03/08/2020,87.23\n3000,Dave Stone,07/15/2022,84.16\n```\n\n***Listing\
  \ 6.16: grep_awk.sh***\n```bash\ngrep \",J\" employees.csv | awk -F\",\" '\n{\n\
  \  expenses += $4\n}\nEND { print \"Expenses for\",NR,\"employees:\",expenses }\n\
  '\n```\n列表 6.16 起于一个 `grep` 命令，该命令匹配 CSV 文件 `employees.csv` 中包含模式 `,J` 的行，并将匹配的行重定向到\
  \ `awk` 命令，该命令通过 `$4` 的内容增加标量变量 `expenses`。\n\n列表 6.16 的最后部分是一个 `END` 块，用于打印匹配的行数以及变量\
  \ `expenses` 的值。运行列表 6.16 中的代码，你将看到以下输出：\n\nExpenses for 3 employees: 264.94\n\n\
  ### 将 sed 与 awk 结合\n\n列表 6.17 显示了 `sed_awk.sh` 的内容，用于计算 `employees.csv` 中员工的开支。\n\
  \n***Listing 6.17: sed_awk.sh***\n```bash\n# remove header line and blank lines\
  \ with 'sed':\ncat employees.csv | sed -e '1d' -e '/$/d' | awk -F\",\" '\n{\n  expenses\
  \ += $4\n}\nEND { print \"Expenses for\",NR,\"employees:\",expenses }\n'\n```\n\
  列表 6.17 以 `cat` 命令开始，它将 `employees.csv` 重定向到 `sed` 命令，后者删除了第一行和空行，然后重定向到 `awk` 命令，后者增加了变量\
  \ `expenses`。\n\n列表 6.17 的最后部分是一个 `END` 块，用于打印匹配的行数以及变量 `expenses` 的值。运行列表 6.17\
  \ 中的代码，你将看到以下输出：\n\nExpenses for 3 employees: 264.94\n\n### HTML 标签\n\n（此处原文截断）\n\
  \n\n\n\n`gensub()` 函数扩展了 `gsub()`的功能，使其能够通过正则表达式中的括号来“捕获”字符串的部分，然后通过指定 `\\N` 来引用捕获的子字符串，其中\
  \ `N` 可以是 1 到 9 之间的数字。\n\nListing 6.20 显示了 `gensub1.sh` 的内容，展示了如何通过 `awk` 命令捕获并打印一个或多个捕获组。\n\
  \n**Listing 6.20: gensub1.sh**\n\n```bash\necho aabbbccc | awk '{ print gensub(/(a*)(b*)(c*)/,\
  \ \"\\\\3 \\\\2 \\\\1\", \"g\", $1); }'\n#result: ccc bbb aa\n\necho aabbbccc |\
  \ awk '{ print gensub(/(a*)(b*)(c*)/, \"\\\\3Z\\\\2Y\\\\1X\", \"g\", $1); }'\n#result:\
  \ cccZbbbYaaX\n\necho \"aa bbb ccc\" | awk '{ print gensub(/(a*) (b*) (c*)/, \"\\\
  \\3 \\\\2 \\\\1\", \"g\", $0); }'\n#result: ccc bbb aa\n\necho \"aa bbb ccc\" |\
  \ awk '{ print gensub(/(a*) (b*) (c*)/, \"\\\\3 \\\\2 \\\\1\", \"g\", $1); }'\n\
  #result: aa\n```\n\nListing 6.20 包含了四个 `awk` 命令，每个命令都以字符串作为输入。这四个 `awk` 命令匹配包含以下正则表达式的字符串：\n\
  \n* `(a*)(b*)(c*)`\n* `(a*)(b*)(c*)`\n* `(a*) (b*) (c*)`\n* `(a*) (b*) (c*)`\n\n\
  此外，当存在匹配的输入字符串时，每个 `awk` 命令都会显示以下字符串之一：\n`\\3 \\2 \\1` `\\3Z\\2Y\\1X` `\\3 \\2 \\\
  1` `\\3 \\2 \\1`\n\n运行代码，你将看到 Listing 6.20 中每个 `awk` 命令下方显示的输出（以注释形式显示）。\n\n## 总结\n\
