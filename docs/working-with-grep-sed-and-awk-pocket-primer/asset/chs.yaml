  \ninitial: 120kphnew_num: 120fpsinitial: 100mphnew_num: 100fpsinitial: 50kphnew_num:\
  \ 50fps\n\n## 在文件中统计重复字段\n\nListing 4.42 显示了 `duplicate_fields.sh` 的内容，它向你展示了如何统计文本文件中重复字段。\n\
  \n***Listing 4.42: duplicate_fields.sh***\n\n```bash\nawk -F\",\" '{  #clientid,fname,lname,start_date,expenses\
