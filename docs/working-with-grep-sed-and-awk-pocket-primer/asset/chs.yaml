  Listing 4.25 的下部分包含一个被注释掉的代码块，其含义自言其明。Listing 4.25 的最后部分与第一个 `awk` 命令相似：不同在于前者的日期使用\
  \ `“/”`分隔符，而后者的日期使用 `:`。注意此 `awk` 命令处理文本文件 `dates2.txt`。运行 Listing 4.25 中的代码，你将看到以下输出：\n\
  \n```\nDate range from dates2.txt:\n02/29/1200\n02/29/2000\nDate range from dates3.txt:\n\
