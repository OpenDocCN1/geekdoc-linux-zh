  \n## 将字符串转换为大写\n\n以下 `awk` 命令使用 `toupper()` 函数将 `employees.csv` 中的所有字母转换为大写：\n\n\
  ```bash\nawk '{$0 = toupper($0); print }' < employees.csv\n```\nEMPID,FULL_NAME,START_DATE,EXPENSES\n\
  JANE JONES,12/05/2021,93.55\nJOHN SMITH,03/08/2020,87.23\nDAVE STONE,07/15/2022,84.16\n\
  \n## 将字符串转换为混合大小\n\n假设我们想要将每个人名字的第一个字母大写。由于 `employees.csv` 中的第一个名字已经是混合大小了，让我们结合\
  \ `tr` 命令和 `awk` 将所有字母转换为小写，如下所示：\n\n```bash\ncat employees.csv | tr [A-Z] [a-z]\n\
  ```\nempid,full_name,start_date,expenses\njane jones,12/05/2021,93.55\njohn smith,03/08/2020,87.23\n\
  dave stone,07/15/2022,84.16\n\n现在，我们可以将每个人名字的第一个字母转换为大写，然后拼接每个人名字的剩余部分，如下所示：\n\n\
  ```bash\nawk '{ $0 = toupper(substr($0,1,1)) substr($0,2); print }'\n```\n\n\n\n\
  \n\n```bash\ncat employees.csv | tr [A-Z] [a-z] | awk '{ $2 = toupper(substr($2,1,1))\
  \ substr($2,2) } $2 }'\n1000,Jane Jones,12/05/2021,93.552000,John Smith,03/08/2020,87.233000,Dave\
  \ Stone,07/15/2022,84.16\n```\n\n### 统计匹配字符的行数\n\n你可以统计以给定字符开头的行数，例如下面的 `awk` 命令统计了以数字\
