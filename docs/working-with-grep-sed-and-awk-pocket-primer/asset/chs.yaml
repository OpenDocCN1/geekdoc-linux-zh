  \ Jones, 4000, CA,Dave, Jones, 5000, NY,Mike, Jones, 6000, NY,Tony, Jones, 7000,\
  \ WA\n```\n\n***Listing 5.17: aligned-data.csv***\n\n```\nSara, Jones, 1000, CA\n\
  Sally, Smith, 2000, IL\n...（根据上下文省略）\n```\n\nListing 5.18 显示了 `mixed-data2.sh` 的内容，演示了如何对齐\
  \ Listing 5.16 中的数据集。\n\n***Listing 5.18: mixed-data2.sh***\n\n```bash\n#-----------------------------------------#\
  \ 1) 删除空行# 2) 删除换行符# 3) 每四个字段后打印一个 LF# 4) 移除每行末尾的 ','#-----------------------------------------inputfile=\"\
  mixed-data2.csv\"grep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' |\
