  => First five rows in titanic_clean.csv:\n1,1,female,38.0,1,0,71.28,C,First,woman,False,C,\
  \      Cherbourg,yes,False\n1,1,female,35.0,1,0,53.1,S,First,woman,False,C,Southampton,\
  \      yes,False\n0,1,male,54.0,0,0,51.8625,S,First,man,True,E,Southampton,    \
