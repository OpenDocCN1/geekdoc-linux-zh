  ## 使用 grep 命令转义元字符\n\n（此处省略重复的元字符说明部分，直接进入后续功能翻译）\n\n## grep 命令的实用选项\n\n`grep` 命令有许多模式匹配的可能性，本节包含了常见的场景。\n\
  \n在以下示例中，我们有四个文件（两个 `.sh` 和两个 `.txt`）和两个文档。字符串 `abc` 在 `abc.txt` 中找到一行，在 `abc3.sh`\
  \ 中找到三行。`ABC` 在 `ABC2.txt` 中找到两行，在 `ABC4.sh` 中找到四行。\n\n```bash\nls *ABC.doc ABC4.sh\
  \ abc1.txt abc3.sh\n```\n\n以下代码片段在当前目录下所有以 `sh` 为后缀的文件搜索字符串 `abc`：\n\n```bash\n\
  grep abc *sh\n```\n\n`-c` 选项统计字符串次数：即使 `ABC4.sh` 没有匹配项，它仍然会计数并返回零：\n\n```bash\n\
  grep -c abc *sh\n```\n\n前面命令的输出为：\n\n```\nABC4.sh:0\nabc3.sh:3\n```\n\n`-e` 选项允许匹配通常会引起语法问题的模式（`-`\
  \ 字符通常被解释为 `grep` 的参数）：\n\n```bash\ngrep -e \"-abc\" *sh\n```\n\n`-e` 选项也允许匹配多个模式：\n\
  \n```bash\ngrep -e \"-abc\" -e \"comment\" *sh\n```\n\n`-i` 选项用于执行区分大小写的匹配：\n\n\
  ```bash\ngrep -i abc *sh\n```\n\n`-v` 选项反转匹配字符串，这意味着输出由不包含指定字符串的行组成（由于未使用 `-i`，`ABC`\
  \ 不匹配，且 `ABC4.sh` 有一个完全空行）：\n\n```bash\ngrep -v abc *sh\n```\n\n使用 `-iv` 选项在区分大小写的情况下显示不包含指定字符串的行：\n\
  \n```bash\ngrep -iv abc *sh\n```\n\n\n\n\n\n`-l` 选项用于列出包含成功匹配的文件名（注意，这匹配的是文件内容，而不是文件名）。Word\
  \ 文档之所以匹配是因为实际文本对 `grep` 仍然可见，它只是被专有格式的乱码包围着。你可以对包含文本的其他格式进行类似的操作，例如 `XML`、`HTML`、`CSV`\
  \ 等：\n\n```bash\ngrep -l abc *abc1.txtabc3.shabc.doc\n```\n\n`-l` 选项仅列出包含成功匹配的文件名：\n\
  \n```bash\ngrep –l abc *sh\n```\n\n使用 `-il` 选项可以使用不区分大小写的匹配，来显示包含指定字符串的文件名：\n\n\
  ```bash\ngrep –il abc *doc\n```\n\n当你想要检查 Word 文档中是否出现某个字符串时，上述命令非常有用。\n\n`-n` 选项指定任何匹配文件的行号：\n\
  \n```bash\ngrep –n abc *shabc3.sh:1:abc at startabc3.sh:2:ends with -abcabc3.sh:3:the\
  \ abc is in the middle\n```\n\n`-h` 选项在匹配成功时抑制文件名的显示：\n\n```bash\ngrep –h abc *shabc\
  \ at startends with -abcthe abc is in the middle\n```\n\n在接下来的示例中，我们将使用 `columns4.txt`，如列表\
  \ 1.2 所示。\n\n**列表 1.2：columns4.txt**\n\n```\n123 ONE TWO456 three fourONE TWO THREE\
  \ FOURfive 123 sixone two threefour five\n```\n\n`-o` 选项仅显示匹配的字符串（这就是你避免返回整个匹配行的行的方法）：\n\
  \n```bash\ngrep –o one columns4.txt\n```\n\n`-o` 选项后接 `-b` 选项显示匹配字符串的位置（返回字符位置，而不是行号。`one`\
  \ 中的 `o` 是文件的第 59 个字符）：\n\n```bash\ngrep –o –b one columns4.txt\n```\n\n你可以指定递归搜索，如下所示（输出未显示，因为在每个客户端或账户上输出都会不同。这不仅会搜索\
  \ `/etc` 目录中的每个文件，还会搜索 `etc` 下每个子目录中的每个文件）：\n\n```bash\ngrep –r abc /etc\n```\n\n\
  上述命令匹配指定字符串作为文件中较长字符串的子串的行。例如，上述命令会匹配 `abc` 的出现，也会匹配 `abcd`、`dabc`、`abcde` 等。\n\n\
  ```bash\ngrep ABC *txtABC2.txt:ABC at start or ABC in middle or end in ABCABC2.txt:ABCD\
  \ DABC\n```\n\n如果你想排除除精确匹配以外的所有内容，可以使用 `-w` 选项，如下所示：\n\n```bash\ngrep –w ABC *txtABC2.txt:ABC\
  \ at start or ABC in middle or end in ABC\n```\n\n`--color` 关用颜色显示匹配的字符串：\n\n```bash\n\
  grep --color abc *shabc3.sh:abc at startabc3.sh:ends with -abcabc3.sh:the abc is\
  \ in the middle\n```\n\n你可以使用元字符对 `(.*)` 来查找由任意数量中间字符分隔的词的出现。\n\n以下命令找到所有包含 `one`\
  \ 和 `three` 字符串的行，中间有任意数量的中间字符：\n\n```bash\ngrep \"one.*three\" columns4.txtone\
  \ two three\n```\n\n你可以使用 `-v` 切换来“反转”上述结果，如下所示：\n\n```bash\ngrep –v \"one.*three\"\
  \ columns4.txt123 ONE TWO456 three fourONE TWO THREE FOURfive 123 sixfour five\n\
  ```\n\n以下命令找到所有包含 `one` 和 `three` 字符串的行，中间有任意数量的中间字符，且匹配涉及不区分大小的比较：\n\n```bash\n\
  grep -i \"one.*three\" columns4.txtONE TWO THREE FOURone two three\n```\n\n你可以使用\
  \ `-v` 切换来“反转”上述结果，如下所示：\n\n```bash\ngrep -iv \"one.*three\" columns4.txt123 ONE\
  \ TWO456 three fourfive 123 sixfour five\n```\n\n有时你需要搜索文件是否存在两个字符串中的其中一个。例如，以下命令找到包含\
  \ `start` 或 `end` 的文件：\n\n```bash\ngrep -l 'start\\|end' *ABC2.txtABC4.shabc3.sh\n\
  ```\n\n在章节的后后部分，你将看到如何通过 `grep` 和 `xargs` 命令找到包含一对字符串的文件。\n\n### 字符类与 grep 命令\n\n\
  本节包含了一些将 `grep` 命令与字符类结合的简单单命令。\n\n```bash\necho \"abc\" | grep '[:alpha:]'abce\n\
  echo \"123\" | grep '[:alpha:]'(returns nothing, no match)\necho \"abc123\" | grep\
  \ '[:alpha:]'abc123\necho \"abc\" | grep '[:alnum:]'abc\necho \"123\" | grep '[:alnum:]'(returns\
  \ nothing, no match)\necho \"abc123\" | grep '[:alnum:]'abc123\necho \"123\" | grep\
  \ '[:alnum:]'(returns nothing, no match)\necho \"abc123\" | grep '[:alnum:]'abc123\n\
  echo \"abc\" | grep '[0-9]'(returns nothing, no match)\necho \"123\" | grep '[0-9]'123\n\
  echo \"abc123\" | grep '[0-9]'abc123\necho \"abc123\" | grep -w '[0-9]'(returns\
  \ nothing, no match)\n```\n\n### 在 grep 中使用 –c 选项\n\n考虑一种目录（例如日志目录）包含由外部程序创建的文件。你的任务是编写一个脚本来统计匹配模式的行数。`-c`\
  \ 选项计算文件中匹配行数。\n\n```bash\ngrep -c \"error\" log.txt\n```\n\n### 匹配行范围\n\n`head`\
  \ 和 `tail` 命令显示行的范围。现在假设你想在行范围内搜索一个字符串。例如，以下命令显示 `longfile.txt` 的第 9 到 15 行：\n\n\
  ```bash\ncat -n longfile.txt |head -15|tail -9\n```\n\n输出如下：\n\n```\n     7 and\
  \ each line\n     8 contains\n     9 one or\n    10 more words\n     11 and you\n\
  \    12 use the\n    13 command the\n    14 file contents\n    15 scroll\n```\n\n\
  此命令显示 `longfile.txt` 第 9 到 15 行中包含 `and` 的子集：\n\n```bash\ncat -n longfile.txt |head\
  \ -15|tail -9 | grep and\n```\n\n输出如下：\n\n```\n     7 and each line\n     8 contains\n\
  \     9 one or\n    10 more words\n     11 and you\n    12 use the\n    13 command\
  \ the\n    14 file contents\n    15 scroll\n```\n\n此命令在 `and` 后面包含一个空格，从而排除了包含 `command`\
  \ 词的行：\n\n```bash\ncat -n longfile.txt |head -15|tail -9 | grep \"and \"\n```\n\n\
  输出如下：\n\n```\n     7 and each line\n     8 contains\n     9 one or\n    10 more\
  \ words\n     11 and you\n    12 use the\n    13 command the\n```\n\n注意，上述命令排除了以“and”结尾的行，因为它们在行尾的“and”后面没有空格。你可以使用包含两种情况的“或”运算符来解决这种局面：\n\
  \n```bash\ncat -n longfile.txt |head -15|tail -9 | grep \" and\\|and \"\n```\n\n\
  \n\n\n然而，上述方法允许将“命令”回到组合中。因此，如果你真的想匹配一个特定的单词，最好使用 `-w` 标签，它足够智能，可以处理变体：\n\n```bash\n\
  cat -n longfile.txt |head -15|tail -9 | grep -w \"and\"     7 and each line    11\
  \   and if you\n```\n\n如果你正在寻找行首或行尾的内容，使用空格会更安全。在读取日志文件或其他结构化文本的内容时，这是一种常用方法，在这些文件中，第一个单词通常很重要（例如如\
  \ `ERROR` 或 `Warning` 等标签、数字代码或日期）。该命令显示以该单词开头的行：\n\n```bash\ncat longfile.txt |head\
  \ -15|tail -9 | grep \"^and \"\n```\n\n输出在这里（不显示行号，因为我们没有使用 `cat -n`）：\n\nand each\
  \ lineand if you\n\n记住，“在命令中使用文件名，而不是先使用 `cat` 显示文件内容”这种风格的效率更高：\n\n```bash\nhead\
  \ -15 longfile.txt |tail -9 | grep \"^and \"and each lineand if you\n```\n\n然而，`head`\
  \ 命令不显示文本文件的行号，因此在前面的示例中，当你想要看到行号时，使用了“先用 cat”（`cat -n` 添加行号）风格，尽管这种风格的效率较低。因此，如果向管道中添加额外的命令可以增加价值，请添加它；否则，直接在管道中的第一个命令中调用你想要处理的文件（假设命令语法能够读取文件名）。\n\
  \n## 在 grep 命令中使用反向引用\n\n`grep` 命令允许你引用一组字符，这组字符匹配放置在括号对内的正则表达式。为了让 `grep` 正确解析括号，每个括号前面都必须带有转义字符\
  \ `\\.`。\n\n例如，`grep 'a\\(.\\)'` 使用元字符 `.` 来匹配 `ab` 或 `a3`，但不会匹配 `3a` 或 `ba`。\n\n\
  反向引用 `\\n`（其中 `n` 是单个数字）匹配正则表达式中第 `n` 个括号内子表达式之前之前匹配的子串。例如，`grep '\\(a\\)\\1'` 匹配\
  \ `aa`，而 `grep '\\(a\\)\\2'` 匹配 `aaa`。\n\n当与交替逻辑使用时，如果组没有参与匹配，则反向引用会导致整个匹配失败。例如，`grep\
  \ 'a\\(.\\)|b\\1'` 不匹配 `ba`、`ab` 或 `bb`（或其他任何其他内容）。\n\n如果你在一对括号内有多个正则表达式，则通过 `\\\
  1`、`\\2`、`. . .`、`\\9` 从左到右引用它们：\n\n```bash\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\1'\
  \ 与以下命令等同：\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\([a-z]\\)'\ngrep -e '\\([a-z]\\)\\\
  ([0-9]\\)\\2' 与以下命令等同：\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\([0-9]\\)'\n```\n\n最简单的理解方式是，数字（例如\
  \ `\\2`）是一个占位符或变量，可以避免你重复输入它所引用的更长的正则表达式。由于正则表达式变得极其复杂，这通常有助于代码的清晰度。\n\n你可以使用模式\
  \ `\\([0-9]\\)\\1` 来匹配连续的数字或字符。例如，以下命令匹配成功，因为字符串 `1223` 包含一对连续的相同数字：\n\n```bash\n\
  echo \"1223\" | grep  -e '\\([0-9]\\)\\1'\n```\n\n同样地，以下命令匹配成功，因为字符串 `12223` 包含三个连续出现的数字\
  \ `2`：\n\n```bash\necho \"12223\" | grep  -e '\\([0-9]\\)\\1\\1'\n```\n\n你可以使用此表达式检查由任何字符分隔的两个相同数字出现：\n\
  \n```bash\necho \"12z23\" | grep  -e '\\([0-9]\\).\\1'\n```\n\n类似地，你可以测试重复字母的出现，如下所示：\n\
  \n```bash\necho \"abbc\" | grep  -e '\\([a-z]\\)\\1'\n```\n\n接下来的示例匹配一个 IP 地址，没有使用反向引用，仅使用了\
  \ `\\d` 和 `\\.`。以下是匹配数字和点的正则表达式：\n\n```bash\necho \"192.168.125.103\" | grep -e\
  \ '\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)'\n```\n\
  \n如果你想允许少于三个数字，可以使用表达式 `{1,3}`，它匹配第三个块中的 1、2 或 3 个数字。在四个块中的任何一个可能少于三个字符的情况下，你必须在所有四个块中使用以下类型的语法：\n\
  \n```bash\necho \"192.168.5.103\" | grep -e '\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\\
  .\\(\\d)\\{1,3\\}\\.\\(\\d\\d\\d\\)'\n```\n\n你可以使用反向引用执行更复杂的匹配。列表 1.3 显示了 `columns5.txt`\
  \ 中的几行回文（从左到右与从右到左相同）。注意第三行是一个空行。\n\n***列表 1.3: columns5.txt***\none enoENOONE TWO\
  \ OWT ENOfour five\n\n接下来的示例匹配所有回文：\n\n```bash\ngrep -w -e '\\(.\\)\\(.\\).*\\2\\\
  1' columns5.txt\n```\n\n上述命令的输出在这里：\n\none enoENOONE TWO OWT ENO\n\n原理是：第一个 `\\\
  (.\\)` 匹配一组字母，第二个 `\\(.\\)` 匹配一组字母，后面跟着任意数量的中间字符。序列 `\\2\\1` 反转了两个指定字母组的顺序。\n\n\
  ## 在数据集中查找空行\n\n记住，元字符 `^` 指行的开头，元字符 `$` 指行的结尾。因此，空行由序列 `^$` 组成。你可以使用此命令找到 `columns5.txt`\
  \ 中的单个空行：\n\n```bash\ngrep -n \"^$\" columns5.txt\n```\n\n上述 `grep` 命令的输出在这里：\n\n\
  更常见的情况是从文件中删除空行。我们可以通过反转之前的查询来实现：\n\n```bash\ngrep -v \"^$\" columns5.txtoneo ENOONE\
  \ TWO OWT ENOfour five\n```\n\n## 使用键搜索数据集\n\n数据通常围绕唯一值组织。假设你有一个文本文件，每行包含一个键。此外，另一个文本文件由一个或多行组成，每行包含一个键值和一个数量。\n\
  \n作为说明，列表 1.4 显示了 `skuvalues.txt` 的内容，列表 1.5 显示了 `skusold.txt` 的内容。注意 SKU 是一个通常用于指单个产品配置（包括其包装、标签等）的术语。\n\
  \n\n\n\n在之前的示例中，你已经看到如何使用 `-i` 选项来执行不区分大小写的匹配。然而，你也可以使用管道符号（`|`）来指定多个正则表达式序列。\n\n\
  例如，以下 `grep` 表达式会匹配包含 `one` 的任何行以及包含 `ONE TWO` 的任何行：\n\n```bash\ngrep \"one\\|ONE\
  \ TWO\" columns5.txt\n```\n\n上一个 `grep` 命令的输出如下：\n\n```\none enoONE TWO OWT ENO\n\
  ```\n\n尽管上一个 `grep` 命令指定了一对字符字符串，但你可以指定任意数量的字符序列或正则表达式，只要在你想要匹配的每个项目之间放置 `\"\\|\"\
  ` 即可。\n\n# grep 命令与 xargs 命令\n\n在 bash 中，`xargs` 命令经常与 `find` 命令配合使用。例如，你可以搜索当前目录（包括子目录）下所有以\
  \ `sh` 结尾的文件，然后检查这些文件中哪一个包含字符串 `abc`，如下所示：\n\n```bash\nfind . –print |grep \"sh$\"\
  \ | xargs grep –l abc\n```\n\n这里展示了一个更有用的 `find` 和 `xargs` 命令组合：\n\n```bash\nfind\
  \ . -mtime -7 -name \"*.sh\" –print | xargs grep –l abc\n```\n\n上一个命令搜索所有（包括子目录）后缀为\
  \ `sh` 且至少七天内未被修改的文件，并将该列表传递给 `xargs` 命令，后者会显示包含字符串 `abc` 的文件（不区分大小写）。\n\n`find`\
  \ 命令支持许多选项，可以通过与（AND）或或（OR）组合起来以创建非常复杂的表达式。\n\n注意，`grep –R hello .` 也会在所有文件（包括子目录）中搜索字符串\
  \ `hello`，并遵循“单个进程”的建议。`find . –print` 命令搜索所有子目录中的所有文件，你可以将输出管道到 `xargs grep hello`，以找到所有文件中单词\
  \ `hello` 的出现情况（这涉及到两个进程而不是一个进程）。\n\n你可以使用上一个代码段的输出将匹配的文件复制到另一个目录，如下：\n\n```bash\n\
  cp `find . –print |grep \"sh$\" | xargs grep –l abc` /tmp\n```\n\n或者，你可以使用 `grep`\
  \ 命令将当前目录中的匹配文件（不包含任何子目录中的匹配文件）复制到另一个目录：\n\n```bash\ncp `grep –l abc *sh` /tmp\n\
  ```\n\n另一种方法是使用反引号，以便你可以获取额外信息：\n\n```bash\nfor file in `find . –print`do\n  echo\
  \ \"Processing the file: $file\"  # 现在在这里执行某些操作\n```\n\n如果你向 `xargs` 命令传递了过文件名，你将看到“too\
  \ many files”的错误消息。在这种情况下，尝试在 `xargs` 命令之前插入额外的 `grep` 命令，以减少传递到 `xargs` 命令的文件数量。\n\
  \n如果你在使用 NodeJS，你知道 `node_modules` 目录包含大量文件。在大多数情况下，当你搜索字符串时可能想排除该目录中的文件，而 `-v`\
  \ 选项非常适合这种情况。以下命令在搜索包含字符串 `src` 的 HTML 文件名的同时，排除 `node_modules` 目录中的文件，并将文件名重定向到文件\
  \ `src_list.txt`（同时将错误消息重定向到 `/dev/null`）：\n\n```bash\nfind . –print |grep –v node\
  \ |xargs grep –il src >src_list.txt 2>/dev/null\n```\n\n你可以使用以下命令扩展上一个命令，搜索包含字符串\
  \ `src` 和字符串 `angular` 的 HTML 文件：\n\n```bash\nfind . –print |grep –v node |xargs\
  \ grep –il src |xargs grep –il angular >angular_list.txt 2>/dev/null\n```\n\n你可以使用以下\
  \ `grep` 和 `xargs` 的组合找到同时包含 `xml` 和 `defs` 的文件：\n\n```bash\ngrep -l xml *svg |xargs\
  \ grep -l def\n```\n\n上一个命令的变体将错误消息重定向到 `/dev/null`，如下：\n\n```bash\ngrep -l hello\
  \ *txt 2>/dev/null | xargs grep -c hello\n```\n\n## 在 Zip 文件中搜索字符串\n\n在 ways 或多个\
  \ zip 文件中搜索字符串至少有三种方法。例如，假设你想确定哪些 zip 文件包含 SVG 文档。\n\n第一种方法所示：\n\n```bash\nfor f\
  \ in `ls *zip`do\n  echo \"Searching $f\"\n  jar tvf $f |grep \"svg$\"done\n```\n\
  \n当目录中有许多 zip 文件时，上一个循环的输出可能会非常冗长，在这种情况下，你需要向上滚动，并可能将实际包含 SVG 文档的文件名复制/粘贴到单独文件中。更好的解决方案是将上一个循环放在\
  \ shell 中并重定向其输出。例如，创建一个文件 `findsvg.sh`，其内容为上一个循环，然后调用此命令：\n\n```bash\n./findsvg.sh\
  \ 1>11 2>22\n```\n\n注意，上一个命令将错误消息（`2>`）重定向到文件 `22`，并将 `jar/grep` 命令的结果（`1>`）重定向到文件\
  \ `11`（显然，你可以指定不同的文件名）。\n\n## 检查唯一键值\n\n有时你需要检查文本文件中是否存在某个字符串（如键），然后根据其存在性进行额外处理。然而，不要假设字符串的存在意味着该字符串只出现一次。作为一个简单的例子，假设文件\
  \ `mykeys.txt` 有以下内容：\n\n```\n2000\n2200\n010000\n3000\n```\n\n```bash\nkey=\"2000\"\
  \nif [ `grep $key mykeys.txt` != \"\" ]\nthen\n  foundkey=true\nelse\n  foundkey=false\n\
  fi\necho \"current key = $foundkey\"\n```\n\n上一个代码确定 `key` 是否存在 `mykeys.txt` 中。如果\
  \ `key` 是 `2000`，输出将是：\n\n```\ncurrent key = true\n```\n\n如果 `key` 是 `200`，它会匹配\
  \ `2000` 和 `2200`，因此输出将为：\n\n```\ncurrent key = true\n```\n\n如果 `key` 是 `4000`，它将不会匹配任何内容，输出将为：\n\
  \n```\ncurrent key = false\n```\n\n如果你想统计字符串出现的次数，可以使用 `wc -l`：\n\n```bash\ngrep\
  \ 200 mykeys.txt | wc -l\n```\n\n输出将为：\n\n```\n2\n```\n\n如果你想统计包含字符串的行数，使用 `grep\
  \ -c`：\n\n```bash\ngrep -c 2000 mykeys.txt\n```\n\n输出将为：\n\n```\n1\n```\n\n## 重定向错误消息\n\
  \n另一种场景是将 `xargs` 命令与 `grep` 命令结合，这可能会导致“no such . .”的错误消息：\n\n```bash\nfind . –print\
  \ |xargs grep –il abc\n```\n\n请确保使用以下变体重定向错误：\n\n```bash\nfind . –print |xargs grep\
  \ –il abc 2>/dev/null\n```\n\n\n\n\n上一个 `egrep` 命令是一个“或”操作：如果某行包含 abc *或* def，则该行被匹配中。\n\
  \n你也可以在 `egrep` 表达式中使用元字符。例如，以下代码段匹配以 abc 开头或以 four 加一个空格结尾的行：\n\n```bash\negrep\
  \ '¹²³|four $' columns3.txt\n```\n\n关于 `grep`、`egrep`、`fgrep` 的更详细解释可以在网上查看：\n\n\
  https://superuser.com/questions/508881/what-is-the-difference-between-grep-pgrep-egrep-fgrep\n\
  \n### 使用 egrep 在数据集中显示“纯”单词\n\n为了简单起见，让我们处理一个文本字符串，这样我们就可以在解决方案的过程中看到中间结果。让我们如下初始化变量\
  \ `x`：\n\n```bash\nx=\"ghi abc Ghi 123 #def5 123z\"\n```\n\n第一步是将 `x` 拆分为单词：\n\n\
  ```bash\necho $x |tr -s ' ' '\\n'\n```\n\n输出如下：\n\n```\nghi\nabc\nGhi\n123\n#def5\n\
  123z\n```\n\n第二步是调用带有正则表达式 `^[a-zA-Z]+` 的 `egrep`，它匹配任何由一个或多个大写和/小写字母组成的字符串（不包含其他字符）：\n\
  \n```bash\necho $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z]+$\"\n```\n\n输出如下：\n\n```\n\
  ghi\nabc\nGhi\n```\n\n如果你想对输出进行排序并只打印唯一的单词，请使用此命令：\n\n```bash\necho $x |tr -s '\
  \ ' '\\n' |egrep \"^[a-zA-Z]+$\" |sort | uniq\n```\n\n输出如下：\n\n```\nabc\nGhi\nghi\n\
  ```\n\n注：此处根据命令逻辑输出\n\n如果你只想提取变量 `x` 中的整数，请使用此命令：\n\n```bash\necho $x |tr -s ' '\
  \ '\\n' |egrep \"^[0-9]+$\" |sort | uniq\n```\n\n输出如下：\n\n```\n123\n```\n\n如果你想从变量\
  \ `x` 中提取字母数字单词，请使用此命令：\n\n```bash\necho $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z0-9]+$\"\
  \ |sort | uniq\n```\n\n输出如下：\n\n```\n123\nabc\nGhi\nghi\nghi\n```\n\n请注意，ASCII 排序序列将数字放在大写字母之前，而大写字母又在小写字母之前，原因如下：0\
  \ 到 9 是十六进制值 `0x30` 到 `0x39`，A-Z 大写字母是十六进制 `0x41` 到 `0x5a`，而 a-z 小写字母是十六进制 `0x61`\
  \ 到 `0x7a`。\n\n现在你可以用数据集替换 `echo $x`，以便从该数据集中检索字母字符串。\n\n### fgrep 命令\n\n`fgrep`（“快速\
  \ grep”）与 `grep -F` 相同，虽然 `fgrep` 已经被废弃，但它仍然被支持，以允许依赖它的历史应用程序无需修改即可运行。此外，某些旧版系统可能不支持\
  \ `grep` 命令的 `-F` 选项，因此它们使用 `fgrep` 命令。如果你真的想学习更多关于 `fgrep` 命令，请在互联网上搜索教程。\n\n##\
  \ 删除缺失值的行\n\n本节中的代码示例向你展示了如何使用 `awk` 命令拆分数据集行中的逗号分隔字段，这些字段包含任意深度的嵌套引号。\n\n`Listing\
  \ 1.7` 显示了 `titanic.csv` 中的某些行，`Listing 1.8` 显示了文件 `delete-empty-cols-grep.sh` 的内容，该文件展示了如何创建一个仅包含完整数据值行的新数据集。\n\
  \n***Listing 1.7: titanic.csv***\n\n```\nsurvived,pclass,sex,age,sibsp,parch,fare,embarked,class,who,\n\
  \    adult_male,deck,embark_town,alive,alone0,3,male,22.0,1,0,7.25,S,Third,man,True,,Southampton,no,False1,1,female,38.0,1,0,71.2833,C,First,woman,False,C,Cherbourg,\n\
  \    yes,False1,3,female,26.0,0,0,7.925,S,Third,woman,False,,Southampton,\n    yes,True1,1,female,35.0,1,0,53.1,S,First,woman,False,C,Southampton,\n\
  \    yes,False0,3,male,35.0,0,0,8.05,S,Third,man,True,,Southampton,no,True0,3,male,,0,0,8.4583,Q,Third,man,True,,Queenstown,no,True//\
  \ rows omitted for brevity0,3,male,25.0,0,0,7.05,S,Third,man,True,,Southampton,no,True0,3,female,39.0,0,5,29.125,Q,Third,woman,False,,Queenstown,\n\
  \    no,False0,2,male,27.0,0,0,13.0,S,Second,man,True,,Southampton,no,True1,1,female,38.0,1,0,71.2833,C,First,woman,False,C,Cherbourg,\n\
  \    yes,False1,3,female,26.0,0,0,7.925,S,Third,woman,False,,Southampton,\n    yes,True1,1,female,35.0,1,0,53.1,S,First,woman,False,C,Southampton,\n\
  \    yes,False0,3,male,35.0,0,0,8.05,S,Third,man,True,,Southampton,no,True0,3,male,,0,0,8.4583,Q,Third,man,True,,Queenstown,no,True\n\
  ```\n\n***Listing 1.8: delete-empty-cols-grep.sh***\n\n```bash\n#field5,field4,field3,field2,foo,field1\n\
  input=\"titanic.csv\"\noutput=\"titanic_clean.csv\"\nrowcount1=$(wc -l $input |\
  \ awk '{print $1}')\necho \"Number of input rows: $rowcount1\"\ncat $input | grep\
  \ -v \",,\" >$output # remove empty fields\nrowcount2=$(wc -l $output | awk '{print\
  \ $1}')\necho \"Number of output rows: $rowcount2\"\n```\n\n\n\n\n列表 1.10 显示了文件\
  \ `joinlines.sh` 的内容，它演示了如何合并 `joinlines.csv` 中匹配的行。\n\n### 列表 1.10: joinlines.sh\n\
  \n```bash\ninputfile=\"test1.csv\"\noutputfile=\"joinedlines.csv\"\ntmpfile2=\"\
  tmpfile2\"\n# 匹配的模式：\nklm1=\"1,KLM,\"\nklm5=\"5,KLM,\"\nxyz1=\"1,XYZ,\"\nxyz5=\"\
  5,XYZ,\"\n#output:#klm1,xyz1#klm5,xyz5\n## 步骤 1: 与 CSV 文件匹配模式：\nklm1line=\"`grep\
  \ $klm1 $inputfile`\"\nklm5line=\"`grep $klm5 $inputfile`\"\nxyz1line=\"`grep $xyz1\
  \  $inputfile`\"\n## $xyz5 匹配 2 行（我们需要第一行）：\ngrep $xyz5 $inputfile > $tmpfile2\n\
  xyz5line=\"`head -1 $tmpfile2`\"\necho \"klm1line: $klm1line\"\necho \"klm5line:\
  \ $klm5line\"\necho \"xyz1line: $xyz1line\"\necho \"xyz5line: $xyz5line\"\n## 步骤\
  \ 3: 创建摘要文件：\necho \"$klm1line\" | tr -d '\\n' >  $outputfile\necho \"$xyz1line\"\
  \               >> $outputfile\necho \"$klm5line\" | tr -d '\\n' >> $outputfile\n\
  echo \"$xyz5line\"               >> $outputfile\necho; echo\n```\n\n运行列表 1.10 中的\
  \ shell 脚本的输出如下：\n\n1,KLM,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.41,X\nYZ,,4.03,3.96,,3.99,,3.84,4.12,,,,4.04,,5,KLM,,0.7,,0.8,,1.0,0.8,,0.5,,,1.1,,5,K\n\
  LM,,0.03,,0.03,,0.04,0.04,,0.02,,,0.04,,5,XYZ,,4.73,,4.48,,4.49,4.40,,,4.59,,,63\n\
  \n正如你所见，本节的任务可以通过这种方式轻松解决。\n\n\n\n\n如你所见，这仅删除了模式的第一次出现。你可以通过添加“全局”终端指令（`/g`）来删除模式的所有出现处：\n\
  \n```bash\n$ echo \"abcdefabc\" |sed \"s/abc//g\"\n```\n\n上一个命令的结果在此：`def`\n\n注意，我们通过此命令直接在主流上进行操作，因为我们没有使用\
  \ `-n` 标签。你也可以使用 `-n` 抑制主流并使用终端 `p`（打印）指令打印替换内容，从而实现相同的输出：\n\n```bash\n$ echo \"\
  abcdefabc\" |sed -n \"s/abc//gp\"\n```\n\n对于替换操作，两种语法均可行，但这对于其他命令并不总是成立。\n\n你还可以使用数字元字符作为你的正则表达式匹配模式，来删除数字而不是字母：\n\
  \n```bash\n$ ls svcc1234.txt |sed \"s/[0-9]//g\"\n$ ls svcc1234.txt |sed –n \"s/[0-9]//gp\"\
  \n```\n\n上述两个命令中任何一个的结果在此：`svcc.txt`\n\n回想文件 `columns4.txt` 包含以下文本：\n\n```\n123\
  \ ONE TWO456 three fourONE TWO THREE FOURfive 123 sixone two threefour five\n```\n\
  \n以下 sed 命令被指示识别 1 到 3 行之间的行（包含边界，`\"1,3\"`），并将其从输出中删除（`d`）：\n\n```bash\n$ cat columns4.txt\
  \  | sed \"1,3d\"\n```\n\n输出在此：`five 123 sixone two threefour five`\n\n以下 sed 命令删除了一个范围的行，从匹配\
  \ `123` 的行开始，一直持续到文件直到匹配字符串 `five` 的行（并同时删除所有中间行）。该语法在之前的匹配示例中应该很熟悉：\n\n```bash\n\
  $ sed \"/123/,/five/d\" columns4.txt\n```\n\n输出在此：`one two threefour five`\n\n###\
  \ 替换字符串或文件中的元音\n\n以下代码段向你展示了使用 sed 命令替换字符串中多个元音是多么简单：\n\n```bash\n$ echo \"hello\"\
  \ | sed \"s/[aeio]/u/g\"\n```\n\n上一个代码段的输出在此：`Hullu`\n\n### 从字符串中删除多个数字和字母\n\n假设我们有一个变量\
  \ `x`，定义如下：\n\n`x=\"a123zAB 10x b 20 c 300 d 40w00\"`\n\n回想整数由一个或多个数字组成，因此它匹配正则表达式\
  \ `[0-9]+`，该正则匹配一个或多个数字。然而，你需要指定正则表达式 `[0-9]*` 来删除变量 `x` 中的每一个数字：\n\n```bash\n$\
  \ echo $x | sed \"s/[0-9]//g\"\n```\n\n上一个命令的结果在此：`azAB x b  c  d w`\n\n以下命令从变量\
  \ `x` 删除所有小写字母：\n\n```bash\n$ echo $x | sed \"s/[a-z]*//g\"\n```\n\n上一个命令的结果在此：`123AB\
  \ 10  20  300  4000`\n\n以下命令从变量 `x` 删除所有小写和大大写字母：\n\n```bash\n$ echo $x | sed \"\
  s/[a-z][A-Z]*//g\"\n```\n\n上一个命令的结果在此：`123 10  20  300  4000`\n\n## 使用 sed 进行搜索和替换\n\
  \n上一节向你展示了如何使用数字范围或字符串对，基于起始行和结束行删除文本文件中的范围行。由于删除只是将匹配内容替换为空结果，现在现在应该很清楚了，替换活动涉及向命令的该部分填充能够实现你预期结果的内容。本节包含了各种示例，说明了如何获得你所需要的精确替换。\n\
  \n以下示例说明了如何在 sed 中将小写的 `abc` 转换为大写的 `ABC`：\n\n```bash\n$ echo \"abc\" |sed \"s/abc/ABC/\"\
  \n```\n\n上一个命令的结果在此（这仅对一种 `abc` 的情况有效）：`ABC`\n\n```bash\n$ echo \"abcdefabc\" |sed\
  \ \"s/abc/ABC/g\"\n```\n\n上一个命令的结果在此（`/g` 意味着对每一个 `abc` 情况有效）：`ABCdefABC`\n\n以下\
  \ sed 表达式执行了三次连续替换，使用 `-e` 将它们连接起来。它将恰好一个（第一个）`a` 变为 `A`，一个 `b` 变为 `B`，一个 `c` 变为\
  \ `C`：\n\n```bash\n$ echo \"abcde\" |sed -e \"s/a/A/\" -e \"s/b/B/\" -e \"s/c/C/\"\
  \n```\n\n上一个命令的结果在此：`ABCde`\n\n显然，你可以使用下面的 sed 表达式，将三次替换合并为一次替换：\n\n```bash\n$ echo\
  \ \"abcde\" |sed \"s/abc/ABC/\"\n```\n\n尽管如此，当你需要执行无法合并为单一替换的更复杂的替换时，`-e` 切换开关是有用的。\n\
  \n`/` 字符并不是 sed 支持的唯一分隔符，当字符串中包含 `/` 字符时这非常有用。例如，你可以通过此命令反转 `/aa/bb/cc/` 的顺序：\n\n\
  ```bash\n$ echo \"/aa/bb/cc\" |sed -n \"s#/aa/bb/cc#/cc/bb/aa/#p\"\n```\n\n上一个 sed\
  \ 命令的结果在此：`/cc/bb/aa/`\n\n以下示例说明了如何使用 `w` 终端命令指令将输出写入命名的文件中：\n\n```bash\n$ echo\
  \ \"abcdefabc\" |sed \"s/abc/ABC/\"w output.txt\n```\n\n\n\n\n```\n$ sed -n \"/./p\"\
  \ < employees.csvmpid,full_name,start_date,expenses1000,Jane Jones,12/05/2021,93.552000,John\
  \ Smith,03/08/2020,87.233000,Dave Stone,07/15/2022,84.16\n```\n\n以下 `sed` 命令显示 `employees.csv`\
  \ 中的空行数：\n\n```bash\nsed -n \"/^$/p\" < employees.csv |wc -l\n```\n\n以下 `sed` 命令显示\
  \ `employees.csv` 中以数字 1 或 2 开头的行数：\n\n```bash\nsed -n \"/^[1|2]/p\" < employees.csv\
  \ |wc -l\n```\n\n## 具有多个分隔符的数据集\n\n列表 2.3 显示数据集 `delimiter1.txt` 的内容，该文件包含多个分隔符\
  \ `|`、`:` 和 `^`。列表 2.4 显示 `delimiter1.sh` 的内容，其说明了如何将 `delimiter1.txt` 中的各种分隔符替换为单个逗号分隔符\
  \ `,`。\n\n***列表 2.3: delimiter1.txt***\n\n```\n1000|Jane:Edwards^Sales2000|Tom:Smith^Development3000|Dave:Del\
  \ Ray^Marketing\n```\n\n***列表 2.4: delimiter1.sh***\n\n```bash\ninputfile=\"delimiter1.txt\"\
  \ncat $inputfile | sed -e 's/:/,/' -e 's/|/,/' -e 's/\\^/,/'\n```\n\n你可以看到，列表 2.4](#ch02.xhtml_Listing2.4)\
  \ 中的第二行虽然简单但非常强大：你可以根据需要添加尽可能多的分隔符来扩展 `sed` 命令，从而创建一个值之间使用单个分隔符的数据集。列表 2.4 的输出所示：\n\
  \n```\n1000,Jane,Edwards,Sales2000,Tom,Smith,Development3000,Dave,Del Ray,Marketing\n\
  ```\n\n请记住，除非你已检查新分隔符**没有**被在使用，否则这种转换可能是不安全的。为此，`grep` 命令会很有用（你希望结果为 0）：\n\n```bash\n\
  $ grep -c ',' $inputfile0\n```\n\n## sed 中实用的开关\n\n在指定 `sed` 命令时，三个命令行开关 `-n`、`-e`\
  \ 和 `-i` 非常有用。当你想要抑制基本流输出的打印时，请指定 `-n`：\n\n```bash\n$ sed -n 's/foo/bar/'\n```\n\
  \n当你只想匹配结果时，请指定 `-n` 并以 `/p` 结尾：\n\n```bash\n$ sed -n 's/foo/bar/p'\n```\n\n我们曾简要提到过使用\
  \ `-e` 进行多次替换，但它也可以与其他命令结合使用。这种语法让我们能够分离上一个示例中的命令：\n\n```bash\necho 'myfoo-bar'\
  \ | sed -n -e 's/foo/bar/' -n -e 's/bar/BAR/p'\n```\n\n一个更高级的示例暗示了 `sed` 的灵活性，涉及到在固定位置后插入字符。例如，考虑以下代码段：\n\
  \n```bash\necho \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" | sed \"s/.\\{3\\}/&\\n/g\"\n```\n\
  \n上一个命令的输出如下：\n\n```\nABC\nnDEFnGHInJKLnMNOnPQRnSTUnVWXnYZ\n```\n\n虽然上面的示例看起来并不特别有用，但考虑一个没有换行符的大文本流（所有内容在一行）。你可以使用这样的命令插入换行符，或其他将数据拆分为更易处理的块。通过查看命令的每个元素并与输出进行比较，你可以完全理解\
  \ `sed` 在做什么，即使你不知道语法。（提示：有时会在代码中遇到没有任何文档的复杂 `sed` 指令。）\n\n输出每隔三个字符变化一次，我们知道点 (`.`)\
  \ 匹配任何单个字符，所以 `.{3}` 一定是在告诉它这样做（使用转义斜杠 `\\` 是因为括号是 `sed` 的特殊字符，如果直接保留 `.{3}`，它将无法正确解释）。替换列中的\
  \ `n` 足够清楚，因此 `&` 一定是以某种方式告诉它插入一个字符而不是替换它。终端的 `g` 命令意味着“重复”。为了澄清并确认这些猜测，请根据你推断出的内容进行互联网搜索。\n\
  \n## 辅助数据集\n\n`sed` 工具对于处理文本文件的内容非常有用。例如，你可以打印行范围以及匹配正则表达式的行子集。你还可以对文本文件中的行执行搜索和替换。本节包含了说明如何执行此类功能的示例。\n\
  \n### 打印行\n\n列表 2.5 显示了 `test4.txt`（双倍行距）的内容，它被用于本节的多个示例。\n\n***列表 2.5: test4.txt***\n\
  \n```\nabcdefabcabc\n```\n\n以下代码段打印 `test4.txt` 中的前 3 行（我们之前在删除行时用过这种语法，但它在打印时同样好用）：\n\
  \n```bash\n$ cat test4.txt |sed -n \"1,3p\"\n```\n\n上一个代码段的输出如下（第二行为空）：\n\n```\n\
  abcdef\n```\n\n以下代码段打印 `test4.txt` 中的第 3 行到第 5 行：\n\n```bash\ncat test4.txt |sed\
  \ -n \"3,5p\"\n```\n\n\n\n\n文件被传递给 `tr` 命令，该命令会将大写字母转换为小写。`sed` 移除逗号和句号，然后将空格替换为换行符。`uniq`\
  \ 需要每个单词单独占一行才能正确统计单词数。`uniq` 将数据转换为唯一的单词及其出现的次数。最后的 `sort` 根据单词计数数对数据进行排序。\n\n\
  ```bash\nif [ \"$1\" == \"\" ]\nthen\n  echo \"Please specify an input file\"\n\
  else\n  cat \"$1\" | xargs -n1 | tr A-Z a-z | \\\n  sed -e 's/\\.//g' -e 's/\\,//g'\
  \ -e 's/ /\\ /g' | \\\n  sort | uniq -c | sort -nrfi\n```\n\n上一个命令执行了以下操作：\n\n*\
  \ 列出文件中每行中的每个单词。\n* 将字符转换为小写。\n* 过滤掉句号和逗号。\n* 将单词之间的空格更改为换行符。\n* 去除重复，添加出现次数前缀，并按数字排序。\n\
  \n## sed 中的反向引用\n\n在章节描述 `grep` 的第一部分，我们提到了反向引用，`sed` 命令也提供了类似的功能。主要的区别在于，反向引用也可以用在命令的替换部分。\n\
  \n以下 `sed` 命令匹配连续的 “a” 字母并打印其中的四个个：\n\n```bash\necho \"aa\" |sed -n \"s#\\([a-z]\\\
  )\\1#\\1\\1\\1\\1#p\"\n```\n\n上一个代码段的输出在此：\n\naaaa\n\n以下 `sed` 命令将所有重复的字母对替换为字母\
  \ `aa`：\n\n```bash\necho \"aa/bb/cc\" |sed -n \"s#\\(aa\\)/\\(bb\\)/\\(cc\\)#\\\
  1/\\1/\\1/#p\"\n```\n\n上一个 `sed` 命令的输出在此（注意末尾的 “/” 字符）：\n\naa/aa/aa/\n\n以下命令在四位数数字中插入逗号：\n\
  \n```bash\necho \"1234\" |sed -n \"s@\\([0-9]\\)\\([0-9]\\)\\([0-9]\\)\\([0-9]\\\
  )@\\1,\\2\\3\\4@p\"\n```\n\n上一个 `sed` 命令使用 `@` 字符作为分隔符。字符类 `[0-9]` 匹配单个数字。由于输入字符串\
  \ `1234` 中有四个数字，字符类 `[0-9]` 重复了 4 次，每个数字的值被存储在 `\\1`、`\\2`、`\\3` 和 `\\4` 中。上一个 `sed`\
  \ 命令的输出在此：\n\n1,234\n\n一个更通用的可以在五位数中插入逗号的 `sed` 表达式在此：\n\n```bash\necho \"12345\"\
  \ | sed 's/\\([0-9]\\{3\\}\\)$/,\\1/g;s/^,//'\n```\n\n上一个命令的输出在此：\n\n12,345\n\n\
  ## 单行 sed 命令\n\n本节旨在展示你可以用单行 `sed` 解决的更有用的问题，并让你接触到更多的选项和参数，以便学习如何将它们组合使用来解决相关任务。\n\
  \n`sed` 支持其他选项（超出本书的范围）来执行许多其他任务，其中某些任务非常复杂且相应地具有复杂性。如果你遇到本章中任何示例都没有涵盖的内容，但看起来像是\
  \ `sed` 可能会做的事情，那么它很有可能可以。在互联网上进行类似“如何在 sed 中做 <xxx>”的搜索，可能会引导你进入正确的方向，或者至少识别出一个有帮助的替代\
  \ `bash` 命令。\n\n列表 2.8 显示了 `data4.txt` 的内容，该文件在本节的一些 `sed` 命令中被引用。注意，某些示例包含了在本章之前未讨论过的选项：包含它们是为了以防你可能需要所需的功能（你可以通过阅读在线教程找到更多细节）。\n\
