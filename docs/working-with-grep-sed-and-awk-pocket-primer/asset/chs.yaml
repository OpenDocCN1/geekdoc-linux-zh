  \ 03/08/2020 count: 2date: 07/15/2022 count: 2\n\n## 计算发票总额\n\nListing 4.43 显示了\
  \ `line_items.csv` 的内容，Listing 4.44 显示了 `line_items.sh` 的内容，用于计算购买订单的应付金额。\n\n***Listing\
  \ 4.43: line_items.csv***\n\n```csv\nitem,unit_price,quantitytoothpaste,2.50,5towels,5.95,2soap,3.95,6plates,1.75,8microwave,60.00,1chairs,20.00,4\n\
  ```\n\n***Listing 4.44: line_items.sh***\n\n```bash\nawk -F\",\" 'BEGIN { total\
  \ = 0 }{  #item,unit_price,quantity  if(NR > 1) {      print \"Line item:\",$0 \
  \     item_price = $2 * $3      print \"Item cost:\",item_price      total += item_price\
  \  }}END {print \"Amount due:\",total}' line_items.csv\n```\n\nListing 4.44 包含一个\
  \ `awk` 命令，该命令指定常用的“，”作为字段分隔符，随后是一个 `BEGIN` 块，它将变量 `total` 和 `col` 初始化为值 0。`BEGIN`\
  \ 块还包含条件逻辑，用于处理标题行之后的每一行。在条件块内部，`item_price` 初始化为 `$2` 和 `$3` 的乘积，然后打印其值，最后用 `item_price`\
  \ 的值增加 `total` 变量。\n\nListing 4.44 的最后部分包含一个 `END` 块，用于打印 `total` 的值。运行 Listing\
  \ 4.44 中的代码，你将看到以下输出：\n\nLine item: toothpaste,2.50,5Item cost: 12.5Line item: towels,5.95,2Item\
