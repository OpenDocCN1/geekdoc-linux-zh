  \ 4.65 以函数 `binary_search()`开始，其参数 `data`、`item`、`left` 和 `right` 分别包含当前数组、搜索项、`data`\
  \ 的左索引以及 `data` 的右索引。如果左索引 `left` 大于右索引 `right`，则搜索项在原数组中不存在。\n\n### 右移\n\n代码列表\
  \ 4.65 以函数 `binary_search()`开始，其参数 `data`、`item`、`left` 和 `right` 分别包含当前数组、搜索项、`data`\
  \ 的左索引以及 `data` 的右索引。如果左索引 `left` 大于右索引 `right`，则搜索项在原数组中不存在。\n\n\n\n\n\n## 逻辑左移\n\
  \nListing 5.5 显示了 `bitwise_lfshift.sh` 的内容，它向你展示了如何计算正整数的逻辑左移。\n\n***Listing 5.5:\
  \ bitwise_lshift.sh***\n\n```awk\nawk 'BEGIN {  num1 = 24  printf(\"left shift %d\
  \ = %d\\n\", num1, lshift(num1))}'\n```\n\nListing 5.5 包含一个带有 `BEGIN` 块的 `awk` 命令，该块将变量\
  \ `num1` 初始化为 24。接下来的代码片段是一个 `printf()` 语句，用于显示 `num1` 的值以及 `num1` 的逻辑左移值。运行 Listing\
  \ 5.5 中的代码，你将看到以下输出：\n\nlshift(24) by 1 = 48\n\n## 逻辑右移\n\nListing 5.6 显示了 `bitwise_rshift.sh`\
  \ 的内容，它向你展示了如何计算正整数的逻辑右移。\n\n***Listing 5.6: bitwise_rshift.sh***\n\n```awk\nawk\
  \ 'BEGIN {  num1 = 24  printf(\"right shift %d = %d\\n\", num1, rshift(num1))}'\n\
  ```\n\nListing 5.6 包含一个带有 `BEGIN` 块的 `awk` 命令，该块将变量 `num1` 初始化为值 24。接下来的代码片段是一个\
  \ `printf()` 语句，用于显示 `num1` 的值以及 `num1` 的逻辑右移值。运行 Listing 5.6 中的代码，你将看到以下输出：\n\n\
  rshift(24) by 1 = 12\n\n## 反转字符串\n\nListing 5.7 显示了 `reverse1.sh` 的内容，它向你展示了如何对数字数组进行排序。\n\
  \n***Listing 5.7: reverse1.sh***\n\n```bash\necho \"\" | awk 'BEGIN {  str1 = \"\
  abcdef\"; rev = \"\";  print \"String:  \", str1}{  for(i=length(str1); i>=1; i--)\
  \ {     rev = rev substr(str1,i,1)  }}END { print \"Reversed:\", rev}'\n```\n\n\
  Listing 5.7 包含一个 `echo` 命令，它将一个空字符串传递给 `awk` 命令，而该命令包含一个 `BEGIN` 块，用于初始化变量 `str1`\
  \ 和变量 `rev`，然后打印 `str1` 的值。\n\nListing 5.7 的下部分是主执行块，其中包含一个从右向左方式处理 `str1` 变量内容的循环。在每次迭代中，变量\
  \ `rev`（初始为空字符串）会通过将 `str1` 中当前最右侧的字符附加到变量 `rev` 来更新。运行 Listing 5.55 中的代码，你将看到以下输出：\n\
  \nString:  abcdef\nReversed: fedcba  \n\n## 寻找回文\n\nListing 5.8 显示了 `palindrome1.sh`\
  \ 的内容，它向你展示了如何确定一个字符串是否是回文。\n\n***Listing 5.8: palindrome1.sh***\n\n```bash\necho\
  \ \"\" | awk 'BEGIN {  str1 = \"abcdef\"; rev = \"\";  print \"String: \", str1}{\
  \  for(i=length(str1); i>=1; i--) {     rev = rev substr(str1,i,1)  }}END {  if\
  \ (rev == str1) {     print \"Palindrome: TRUE\"  } else {     print \"Palindrome:\
  \ FALSE\"  }}'\n```\n\nListing 5.8 包含与 Listing 5.7 相同的初始化代码，以及 `END` 块中的一个新的条件代码块，该块用于比较字符串\
  \ `str1` 与字符串 `rev`。如果字符串相等，则 `str1` 是回文，否则不是回文。在两种情况下，都会显示适当的消息。运行 Listing 5.8\
  \ 中的代码，你将看到以下输出：\n\nString:     abcdef\nPalindrome: FALSE  \n\n## 检查唯一字符\n\nListing\
  \ 5.9 显示了 `unique_chars.sh` 的内容，它向你展示了如何确定一个字符串是否包含唯一字符。\n\n***Listing 5.9: unique_chars.sh***\n\
  \n```bash\n#128 characters for ASCII and 256 characters for extended ASCII\necho\
  \ \"\" | gawk 'function unique_chars(str1) {  char_set[0] = 0  for(j=1; j<28; j++)\
  \ {     char_set[j] = 0  }  str1 = tolower(str1)  for(i=1; i<length(str1); i++)\
  \ {     char = substr(str1,i,1)     ord = ord(char)     if (char_set[ord] == 0)\
  \ {       char_set[ord] = 1     } else {       print \"Duplicate character found:\
  \ \" char     }   }  END { print \"All characters are unique\" }}'\n```\n*(注：由于原文代码块中存在部分逻辑截断或错误如\
  \ `j<28` 应为 `j<256` 以及缺少 `ord` 函数定义，翻译时保持了原始逻辑结构，仅根据语境补全了描述)*\n\nListing 5.9 包含一个\
  \ `echo` 命令，它将一个空字符串传递给 `awk` 命令，而该命令反过来包含一个 `BEGIN` 块，用于初始化变量 `str1`。\n\n*(由于原文提供的文本片段存在严重的错乱和重复，上述译文已根据逻辑进行了重新组织，以确保可读性，并符合翻译要求)*\n\
  \n\n\n\n\nListing 5.11 显示了 `FixedFieldCount1.sh` 的内容，演示了如何使用 `awk` 命令打印文本字符串中的单词。\n\
  \n***Listing 5.11: FixedFieldCount1.sh***\n\n```bash\necho \"aa bb cc dd ee ff gg\
  \ hh\"| awk 'BEGIN { colCount = 3 }{  for(i=1; i<=NF; i++) {     printf(\"%s \"\
  , $i)     if(i % colCount == 0) {          print \" \"     }  }}'\n```\n\nListing\
  \ 5.11 调用了 `echo` 命令将字符串重定向到 `awk` 命令，该命令将变量 `colCount` 初始化为 `3`，随后是主执行块，该块包含一个打印每个输入字段的数组。注意，在打印了三个连续元素后会打印一个新行。运行\
  \ Listing 5.11 中的代码，你将看到以下输出：\n\n```\naa bb cc  dd ee ff  gg hh\n```\n\n## 以固定列数打印数据集\n\
