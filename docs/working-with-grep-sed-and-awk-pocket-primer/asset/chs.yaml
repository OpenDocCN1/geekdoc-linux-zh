  \ world6 three      hello world4\n\n## 使用 sed 命令填充缺失值\n\n本节的示例展示了如何在不使用 Python 或\
  \ `pandas` 的情况下更新数据集中的值。虽然这种方法在某些情况下很有用，但 `pandas` 提供了比 bash 版本更简单的功能。\n\nListing\
  \ 2.9 显示了 `missing-titanic-ages.sh` 的内容，它展示了如何将 `titanic.csv` 数据集中缺失的值替换为字符串 `MISSING`。\n\
  \n***Listing 2.9: missing-titanic-ages.sh***\n\n```bash\nnewfile=\"titanic.csv\"\
  #此命令将缺失值替换为 MISSING\ncat titanic.csv |sed \"s/,,MISSMISS,/g\" > $newfile\ncat $newfile\
  \ | awk -F\",\" 'BEGIN { count = 0 }{ if ($4 ~ /MISSING/) { count += 1 }}END { print\
  \ \"number of age values:\",count }'\n```\n\nListing 2.9 初始化变量 `newfile` 为 CSV 文件名，随后的代码片段通过\
  \ `cat` 命令开始执行将缺失值替换为字符串 `MISSING`。\n\nListing 2.9 的后续部分是一个 `awk` 脚本，它将变量 `count`\
  \ 初始化为 `0`，每当遇到年龄列缺失时就会增加该值。运行 Listing 2.9 中的代码，你将看到以下输出：\n\nnumber of age values:\
  \ 177\n\n## 100 万行的数据集\n\n本节的代码示例展示了如何使用 `grep` 对包含 100 万行的数据集进行各种比较。\n\n### 数字比较\n\
  \n[Listing 2.10] 展示了如何检查特定数字（例如 58）以及每行第一个字段中一个、两个或三个连续数字的出现情况。\n\n***Listing 2.10:\
  \ numeric_comparisons.sh***\n\n```bash\nfilename=\"1000000_HRA_Records_short.csv\"\
  \necho \"first loop:\"\nrownum=0\nmatches=0\nwhile read line\ndo\n  field1=`echo\
  \ $line | cut -d\",\" -f1`\n  if [ $rownum -gt 0 ]\n  then\n    if [ $field1 > 50\
  \ ]\n    then\n      matches=`expr $matches + 1`\n    fi\n  fi\n  rownum=`expr $rownum\
  \ + 1`\ndone < $filename\necho \"matching records: $matches\"\necho \"second loop:\"\
  \nrownum=0\nmatches=0\nwhile read line\ndo\n  field1=`echo $line | cut -d\",\" -f1`\n\
  \  field4=`echo $line | cut -d\",\" -f4`\n  field5=`echo $line | cut -d\",\" -f5`\n\
  \  if [ $rownum -gt 0 ]\n  then\n    if [ $field1 > 50 -a \"$field5\" == \"Support\"\
  \ ]\n    then\n      matches=`expr $matches + 1`\n    fi\n  fi\n  rownum=`expr $rownum\
  \ + 1`\ndone < $filename\necho \"matching records: $matches\"\n```\n\n[Listing 2.10]\
  \ 初始化变量 `newfile` 为 CSV 文件名，然后初始化一些值。接下来，`while` 循环处理 CSV 文件中的每一行（第一行除外），并将 `field1`\
  \ 初始化为第一个逗号字段的内容。如果 `field1` 大于 50，则变量 `matches` 加 1。\n\n[Listing 2.10] 的后续部分是另一个\
  \ `while` 循环，它处理 CSV 文件中的每一行（第一行除外），并使用以下代码提取第一、第四和第五字段：\n\n`field1=`echo $line\
  \ | cut -d\",\" -f1``\n`field4=`echo $line | cut -d\",\" -f4``\n`field5=`echo $line\
  \ | cut -d\",\" -f5``\n\n接下来，一个条件语句检查 `field1` 的值是否大于 40 且 `field5` 的值等于字符串 `Support`：\n\
  \n`if [ $field1 > 40 -a \"$field5\" == \"Support\" ]`\n\n如果前面的语句为真，变量 `matches`\
  \ 加 1。`while` 循环中的最后一个代码片段更新 `rownum` 的值，然后处理 CSV 文件中的下一行。运行 Listing 2.10 中的代码，你将看到以下输出：\n\
  \nfirst loop:matching records: 101\nsecond loop:matching records: 53\n\n### 计数连续数字\n\
  \n[Listing 2.11] 展示了如何查找特定数字（例如 58）以及每行第一个字段中一个、两个或三个连续数字的出现次数。\n\n***Listing 2.11:\
  \ adjacent_digits.sh***\n\n```bash\nfilename=\"1000000_HRA_Records.csv\"\necho \"\
