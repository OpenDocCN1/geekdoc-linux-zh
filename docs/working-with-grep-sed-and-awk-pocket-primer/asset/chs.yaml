  grep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk 'BEGIN { columnCount\
  \ = 4 }{   for(i=1; i<=NF; i++) {     printf(\"%s \", $i)     if( I % columnCount\
  \  == 0) { print\"\"\" }   }'' > temp-columns# 4) 移除输出末尾的''''cat temp-columns |\
  \ sed''s/, $/'' | sed''s/ $/'' > $outputfile\n```\n\nListing 5.15 以 `grep` 命令开始，用于删除空行，随后是一个\
