  \n快速复习一下，文件 `delete-empty-cols-grep.sh` 包含以下代码片段，它可以跳过任何包含两个逗号的记录（表示特征缺失）：\n\n`$\
  \ cat $input |grep -v \",,\" > $output`\n\n虽然 `awk` 命令比 `grep` 更强大，但有时你可以使用 `grep`\
  \ 命令用更少（更直观）的代码完成相同任务。因此，精通 `grep`、`sed` 和 `awk` 是值得的，这样你就可以创建清晰简洁的 Shell 脚本，并用更少的精力进行增强（或调试）。\n\
  \n此外，你可以利用 `grep`、`sed` 和 `awk` 的功能在使用 Pandas 等工具进行数据清洗任务之前，对数据集进行预处理。\n\n## 在 awk\
  \ 中处理多行记录\n\nListing 5.32 显示了 `employees.txt` 的内容，Listing 5.33 显示了 `employees.sh`\
  \ 的内容，该文件说明了如何合并文件中的文本行。\n\n\n\n\n\n```bash\ninputfile=\"employees.txt\"\noutputfile=\"\
  employees2.txt\"\necho \"=> Input file:\"\ncat $inputfile\nawk '{\n  if($0 ~ /^Name:/)\
  \ {\n    x = substr($0,8) \",\"\n    next\n  }\n  if( $0 ~ /^Empid:/) {\n  #skip\
  \ the Empid data row\n  #x = x substr($0,7) \",\"\n    next\n  }\n  if($0 ~ /^Address:/)\
  \ {\n    x = x substr($0,9)\n    print x\n  }}' < $inputfile > $outputfile\necho\
  \ \"=> Output file:\"\ncat $outputfile\n```\n\n运行 Listing 5.33 中的代码的输出如下：\n\n=>\
  \ Input file:Name:  Jane EdwardsEmpId: 12345Address: 123 Main Street Chicago IllinoisName:\
  \  John SmithEmpId: 23456Address: 432 Lombard Avenue SF California\n=> Output file:Jane\
  \ Edwards, 123 Main Street Chicago IllinoisJohn Smith, 432 Lombard Avenue SF California\n\
  \n现在你已经看到了 `awk` 代码段以及包含 `awk` 命令的 shell 脚本，这些代码说明了你可以对文件和数据集执行的各种类型任务，现在你已经准备好学习一些用例了。下一节（即第一个用例）将向你展示如何将多个字段分隔符替换为单个分隔符，第二个用例将向你展示如何处理日期字符串。\n\
  \n## 带有多行记录的 CSV 文件\n\n本节包含一个具有多行记录的 CSV 文件，其中每个字段都占据单独的一行（例如 `survived:0`），而不是每个记录对应用逗号分隔的字段值。\n\
  \n当我们使用 `awk` 时，解决方案出奇地简单：将 `RS` 设置为分隔记录的字符串模式。在我们的案例中，我们需要将 `RS` 设置为 `\\n\\n`，之后\
  \ `$0` 将包含每个多行记录的内容。此外，指定 `FS='\\n'` 使得每一行都被视为一个字段（即 `$1`、`$2` 等）。\n\nListing 5.34\
  \ 显示了 CSV 文件 `multi_line_rows.csv` 的内容，Listing 5.35 显示了 `multi_line_rows.sh` 的内容。\n\
  \n**Listing 5.34: multi_line_rows.csv**\n```text\nsurvived:0pclass:3sex:maleage:22.0\n\
  survived:1pclass:1sex:femaleage:38.0\nsurvived:0pclass:3sex:maleage:35.0\nsurvived:1pclass:3sex:femaleage:27.0\n\
  ```\n\n**Listing 5.35: multi_line_rows.sh**\n```bash\nfilename=\"multi_line_rows.csv\"\
  \ncat $filename | awk 'BEGIN { RS=\"\\n\\n\"; FS=\"\\n\" }{\n  # name/value pairs\
  \ have this format:\n  # survived:0 pclass:3 sex:male age:22.0\n  split($1,arr,\"\
  :\"); printf(\"%s,\",arr[2]);\n  split($2,arr,\":\"); printf(\"%s,\",arr[2]);\n\
  \  split($3,arr,\":\"); printf(\"%s,\",arr[2]);\n  split($4,arr,\":\"); printf(\"\
  %s\\n\",arr[2]);}'\n```\n\nListing 5.35 中的核心思想已加粗显示，它将 `RS`（记录分隔符）的值指定为两个连续的换行符，然后将\
  \ `FS`（字段分隔符）指定为换行符。主代码块根据冒号（`:`）分隔符分割字段 `$1`、`$2`、`$3` 和 `$4`，然后第二个第二个字段（实际的数据值）。\n\
  \n注意 `arr[1]` 包含字段的*名称*，如 `survived`、`pclass`、`sex` 或 `age`，而 `arr[2]` 包含字段的*值*。运行\
  \ Listing 5.35 中的代码，你将看到以下输出：\n\n```text\n0,3,male,22.0\n1,1,female,38.0\n0,3,male,35.0\n\
  1,3,female,27.0\n```\n\n还有一个细节：Listing 5.35 *没有*显示包含字段名称的标题行。Listing 5.36 向你展示了如何修改\
  \ Listing 5.34 来生成标题行。\n\n**Listing 5.36: multi_line_rows2.sh**\n```bash\nfilename=\"\
  multi_line_rows.csv\"\ncat $filename | awk 'BEGIN { RS=\"\\n\\n\"; FS=\"\\n\"; count=0\
  \ }{\n  if(count == 0) {\n    count += 1\n    split($1,arr,\":\"); header = arr[1]\n\
  \    split($2,arr,\":\"); header = header \",\" arr[1]\n    split($3,arr,\":\");\
  \ header = header \",\" arr[1]\n    split($4,arr,\":\"); header = header \",\" arr[1]\n\
  \    print header\n  }\n  # name/value pairs have this format:\n  # survived:0 pclass:3\
  \ sex:male age:22.0\n  split($1,arr,\":\"); printf(\"%s,\",arr[2]);\n  split($2,arr,\"\
  :\"); printf(\"%s,\",arr[2]);\n  split($3,arr,\":\"); printf(\"%s,\",arr[2]);\n\
  \  split($4,arr,\":\"); printf(\"%s\\n\",arr[2]);}'\n```\n\nListing 5.36 将变量 `count`\
  \ 初始化为值 `0`，随后是一个条件代码块，该代码块通过顺序拼接字段名来构建变量 `header` 的内容（它将包含字段名称）。`header` 的内容会被打印出来，由于\
  \ `count` 的值已经增加，该代码块只会执行一次，从而防止标题行被重复输出。运行 Listing 5.36 中的代码，你将看到以下输出：\n\n```text\n\
  survived,pclass,sex,age\n0,3,male,22.0\n1,1,female,38.0\n0,3,male,35.0\n1,3,female,27.0\n\
  ```\n\n## 使用 awk 处理多个文件\n\nListing 5.38、Listing 5.39 和 Listing 5.40 分别显示了 `file1.txt`、`file2.txt`\
