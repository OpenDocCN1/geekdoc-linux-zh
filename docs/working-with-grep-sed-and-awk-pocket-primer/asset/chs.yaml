  \ 分割文件名\n\n[Listing 4.53] 显示了 `SplitFilename2.sh` 的内容，它说明了如何分割包含 `.` 字符的文件名，以增加文件名某个组件的数值。请注意，此代码仅适用于具有精确预期语法的文件名。可以编写更复杂的代码来计算段数，或者简单地说是“更改\
  \ .zip 之前的字段”，这只需要文件名的格式匹配最后两个部分（`<anystructure>.number.zip`）。\n\n**Listing 4.53:\
  \ SplitFilename2.sh**\n```bash\necho \"05.20.144q.az.1.zip\" | awk -F\".\" '{  f5=$5\
  \ + 1  printf(\"%s.%s.%s.%s.%s.%s\",$1,$2,$3,$4,f5,$6)}'\n```\n\n[Listing 4.48]\
  \ 的输出在这里：\n\n```\n05.20.144q.az.2.zip\n```\n\n## 单行 awk 命令\n\n本节中的代码片段引用了文本文件 `short1.txt`，你可以向其中填充任何你的数据。\n\
  \n以下代码片段打印每行，并在前面加上该行字段的数量：\n\n```bash\n$ awk '{print NF \":\" $0}' short1.txt\n\
  ```\n\n打印每行右侧的字段：\n\n```bash\n$ awk '{print $NF}' short1.txt\n```\n\n打印包含超过 2 个字段的行：\n\
  \n```bash\n$ awk '{if(NF > 2) print }' short1.txt\n```\n\n如果当前行包含超过 2 个字段，则打印右侧字段的值：\n\
  \n```bash\n$ awk '{if(NF > 2) print $NF }' short1.txt\n```\n\n删除开头和结尾的空格：\n\n```bash\n\
  $ echo \" a b c \" | awk '{gsub(/^[ \\t]+|[ \\t]+$/,\"\");print}'\n```\n\n对于包含至少\
  \ 3 个字段的行，反向打印第一和第三字段：\n\n```bash\n$ awk '{if(NF > 2) print $3, $1}' short1.txt\n\
  ```\n\n打印包含字符串 `one` 的行：\n\n```bash\n$ awk '{if(/one/) print }' *txt\n```\n\n如前述代码片段所示，使用\
  \ `awk` 命令中的简单条件逻辑和内置变量，可以很容易从文本文件中提取信息或行列的子集。\n\n## 有用的短 awk 脚本\n\n本节包含了一组基于 `awk`\
  \ 的短脚本，用于执行各种操作。其中某些脚本也可以用于其他 shell 脚本以执行更复杂的操作。[Listing 4.54] 显示了文件 `data.txt`\
  \ 的内容，该文件用于本节中的各种代码示例。\n\n**Listing 4.54: data.txt**\n```\nthis is line one that\
  \ contains more than 40 charactersthis is line twothis is line three that also contains\
  \ more than 40 charactersfourthis is line six and the preceding line is emptyline\
  \ eight and the preceding line is also empty\n```\n\n以下代码片段打印每一长度大于 40 个字符的行：\n\n\
  ```bash\nawk 'length($0) > 40' data.txt\n```\n\n现在打印 `data.txt` 中最长行的长度：\n\n```bash\n\
  # 此未提供具体命令，根据上下文推断为计算长度的操作\n```\n\n\n\n\n## 常用排序算法\n\n排序算法在性能方面有最佳情况、平均情况和最坏情况。有趣的是，有时高效的算法（例如\
  \ `quick sort`）在给定数组已经排序时可能会出现最差的性能。\n\n以下子节包含以下常用排序算法的代码示例：\n\n* 冒泡排序\n* 选择排序\n\
  * 插入排序\n* 合并排序\n* 快速排序\n* 桶排序 BucketSort\n* 壳排序 Shell Sort\n* 堆排序 Heap Sort\n* 原地排序\
  \ InplaceSort\n* 计数排序 CountingSort\n* 基排序 RadixSort\n\n如果你想深入探索算法算法可以在互联网上搜索其他的排序算法。\n\
  \n## 冒泡排序\n\n`bubble sort` 涉及一个嵌套循环，其中数组的每个元素都与给定元素右侧的元素进行比较。如果数组元素小于当前元素，则对值进行交换（“交换”），这意味着数组的内容最终将从小到大进行排序。这是一个示例：\n\
  \n```\narr1 = np.array([40, 10, 30, 20]);Item = 40;Step 1: 40 > 10 so switch these\
  \ elements:arr1 = np.array([10, 40, 30, 20]);Item = 40;Step 2: 40 > 30 so switch\
  \ these elements:arr1 = np.array([10, 30, 40, 20]);Item = 40;Step 3: 40 > 20 so\
  \ switch these elements:arr1 = np.array([10, 30, 20, 40]);\n```\n\n如你所见，最小的元素位于数组\
  \ `arr1` 的最左侧。现在通过将第二个位置（索引为 1）与右侧元素进行比较来重复此过程。\n\n```\narr1 = np.array([10, 30,\
  \ 20, 40]);Item = 30;Step 4: 30 > 20 so switch these elements:arr1 = np.array([10,\
  \ 20, 30, 40]);Item = 30;Step 4: 30 < 40 so do nothing\n```\n\n如你所见，最小的两个元素占据了数组\
  \ `arr1` 的前两个位置。现在通过将第三位置（索引为 2）与右侧元素进行比较来重复此过程。\n\n```\narr1 = np.array([10, 20,\
  \ 30, 40]);Item = 30;Step 4: 30 < 40 so do nothing\n```\n\n数组 `arr1` 现在按升序排列好（从左到右）。如果你想反转顺序使数组按降序排列（从左到右），只需在前面的步骤中将\
  \ `>` 运算符替换为 `<` 运算符。\n\nListing 4.59 显示了 `bubble_sort1.sh` 的内容，它展示了如何使用冒泡排序对数字数组进行排序。\n\
  \n**Listing 4.59: bubble_sort1.sh**\n\n```bash\necho \"\" | awk 'BEGIN {   arr[0]\
  \ = 30; arr[1] = 10; arr[2] = 200; arr[3] = -13;   printf(\"Array:   \")   for (i=0;i<length(arr);i++)\
  \ {     printf(\"%d \",arr[i])   }   print \"\"}{   for (i=0;i<length(arr)-1;i++)\
  \ {     for (j=i+1;j<length(arr);j++) {       if(arr[i] > arr[j]) {           tmp\
  \ = arr[i]           arr[i] = arr[j]           arr[j] = tmp       }     }   }}END\
  \ {   printf(\"Sorted: \")   for (i=0;i<length(arr);i++) {     printf(\"%d \",arr[i])\
  \   }   print \"\"}'\n```\n\n你可以手动执行 Listing 4.59 中的代码，以说服自己代码是正确的（提示：这与你之前在本节中看到的步骤序列相同）。运行\
  \ Listing 4.59 中的代码，你将看到以下输出：\n\nArray:   30 10 200 -13\nSorted: -13 10 30 200\n\
  \n### 在单词列表中查找字母异位词\n\n回想如果 `word2` 是 `word1` 的排列，则变量 `word1` 是 `word2` 的字母异位词。Listing\
  \ 4.60 显示了 `anagrams2.sh` 的内容，说明了如何检查两个单词是否为其他单词的字母异位词。\n\n**Listing 4.60: anagrams2.sh**\n\
  \n```bash\necho \"\" | awk 'function sort_word(str1) {   split(str1,\"\")word =\
  \ \"\"   for (idx in chars) {     word = chars[idx]   }   return word}function is_anagram(str1,\
  \ str2) {   sorted1 = sort_word(str1)   sorted2 = sort_word(str2)   return (sorted1\
  \ == sorted2)}BEGIN {   INFO[\"sorted_in\"]=\"@str_asc\"words[1]=\"abc\";   words[2]=\"\
  evil\";   words[3]=\"Z\";   words[4]=\"cab\";   words[5]=\"live\";   words[6]=\"\
  xyz\";   words[7]=\"zyx\";   words[8]=\"bac\"}{   for(i=1; i<length(words)-1; i++)\
  \ {     for(j=i+1; j<length(words); j++) {       result = is_anagram(words[i], words[j])\
  \       if(result == 1) {         printf(\"%10s and %10s => anagrams\\n\",words[i],words[j])\
  \       } else {         printf(\"%10s and %10s => not anagrams\\n\",words[i],words[j])\
  \     }   }   }'\n```\n\nListing 4.60 定义了函数，它接收接收参数 `str1` 和 `str2`，其排序值用于初始化变量\
  \ `sorted1` 和 `sorted2`。该函数返回比较 `sorted1` 和 `sorted2` 的结果：如果它们相等，则 `str1` 是异位词。\n\
  \nListing 4.60 的后续部分将变量 `words` 初始化为字符串列表，紧接着是一个嵌套循环。外层循环使用变量 `i` 范围从 0 到 `len(words)-1`，内层循环使用变量\
  \ `j` 范围从 `i+1` 到 `len(words)`。内层循环通过调用传入字符串 `words[i]` 和 `words[j]` 的 `is_anagram()`\
  \ 函数返回值来初始化变量 `result`。如果变量 `result` 的值为 True，则这两个单词是异位词。运行 Listing 4.60 中的代码，你将看到以下输出：\n\
  \nabc and evil => not anagrams\nabc and Z => not anagrams\nabc and cab => anagrams\n\
  abc and live => not anagrams\nabc and xyz => not anagrams\nabc and zyx => not anagrams\n\
  evil and Z => not anagrams\nevil and cab => not anagrams\nevil and live => anagrams\n\
  evil and xyz => not anagrams\nevil and zyx => not anagrams\nZ and cab => not anagrams\n\
  \n## 在 O(n) 复杂度内排序数组\n\n\n\n\n\n与其使用冒泡排序，，你可以使用 `awk` 内置的 `sort()` 函数对数字或字符串进行排序。Listing\
  \ 4.62 显示了 `median1.sh` 的内容，它向你展示了如何使用内置的 `sort()` 函数找到数字数组的中位数。\n\n**Listing 4.62:\
  \ median1.sh**\n\n```bash\necho \"\" | awk ' BEGIN {  arr1[1] = 400  arr1[2] = 5\
  \  arr1[3] = 1  arr1[4] = 123  arr1[5] = 500  arr1[6] = -55  print \"=> Initial\
  \ array:\"  for(i=1;i<=length(arr1);i++) print i,\":\",arr1[i]}END {  row_count\
  \ = asort(arr1,arr2)  print \"=> Sorted array:\"  for(i=1;i<=length(arr2);i++) print\
  \ i,\":\",arr2[i]  if (row_count % 2 != 0) {      middle = int(row_count/2 + 0.5)\
  \      median = arr2[middle]  } else {      median = (arr2[row_count/2]+arr2[row_count/2+1])/2\
  \  }  print \"=> Median value:\",median}'\n```\n\nListing 4.62 以一个 `awk` 命令开始，该命令包含一个\
  \ `BEGIN` 语句，用多个整数值初始化 `arr1` 并显示其内容。Listing 4.62 的后续部分调用内置的 `sort()` 函数，将数组 `arr1`\
  \ 排序后的内容填充到数组 `arr2`。\n\nListing 4.67 的最后部分包含一个 `BEGIN` 语句用于显示 `arr2` 的内容，随后是用于确定中位数的条件逻辑。记住，奇数个数元素的数组的中位数是数组中间的值，而偶数个数元素的数组的中位数是数组中两个“中间值”的平均值。`END`\
  \ 语句中的最后代码片段显示了数组 `arr1` 中的中位数。运行 Listing 4.62 中的代码，你将看到以下输出：\n\n=> Initial array:1\
  \ : 4002 : 53 : 14 : 1235 : 5006 : -55=> Sorted array:1 : -552 : 13 : 54 : 1235\
  \ : 4006 : 500=> Median value: 64\n\n## 线性查找\n\nListing 4.63 显示了 `linear_search.sh`\
  \ 的内容，它向你展示了如何使用冒泡排序对数字数组进行排序。\n\n**Listing 4.63: linear_search.sh**\n\n```bash\n\
  echo \"\" | awk ' BEGIN {  item = 123  arr1[1] = 1  arr1[2] = 3  arr1[3] = 5  arr1[4]\
  \ = 123  arr1[5] = 400}{  found = -1  for(i=1; i<=length(arr1); i++) {    if (item\
  \ == arr1[i]) {        found = i         break      }   }  if (found >= 0) {   \
  \ print \"found\",item,\"in position\",found  } else {    print item,\"not found\"\
  \  }}'\n```\n\nListing 4.63 从变量 `found` 开始，该变量被初始化为值 `-1`，随后是查找项 `123`，以及包含数字数组的数组\
  \ `arr1`。接下来，一个循环遍历整数数组 `arr1` 的元素，将每个元素与 `item` 的值进行比较。如果发生匹配，则将变量 `found` 设置为循环变量\
  \ `i` 的值，然后提前退出。\n\nListing 4.63 的最后部分检查变量 `found` 的值：如果它是非负，则找到了查找项（否则，它不在数组中）。运行\
  \ Listing 4.1 中的代码，你将看到以下输出：\n\nfound 123 in position 3\n\n记住以下一点：尽管数组 `arr1` 包含一个排序的数字列表，但代码对于无序列表也能正常工作。运行\
  \ Listing 4.63 中的代码，你将看到以下输出：found123 in position 4\n\n### 二分查找（迭代）\n\n`binary search`\
  \ 需要一个排序过的数组，并且可以通过迭代算法实现，也可以通过递归解决方案实现。这种查找涉及将已排序元素数组的中间元素与查找元素进行比较。如果它们相等，则已找到\
  \ `item`；如果中间元素小于查找元素，则对数组的右半部分重复上一步。如果中间元素大于查找元素，则对数组的左半部分重复上一步。最终，元素将被找到（如果它出现在数组中），或者当数组的重复拆分在子数组只有一个元素时终止（即无法进行进一步的拆分）。\n\
  \n## 二分查找演示\n\n让我们对一个二分查找进行演示，在已排序的整数数组中查找 `item`。\n\n示例 #1：假设 `item = 25` 且 `arr1\
  \ = [10,20,25,40,100]`，因此数组的中间点是 `3`。由于 `arr1[3] == item`，算法终止。\n\n示例 #2：假设 `item\
  \ = 25` 且 `arr1 = [1,5,10,15,20,25,40]`，这意味着中间点是 `4`。\n第一次迭代：由于 `arr1[4] < item`，我们搜索数组\
  \ `[25,40]`。\n第二次迭代：中间点是 `5`，对应的值是 `20`（等等，正文中说是 25，但逻辑暗示 `arr1[5]=25`）。\n示例 #3：假设\
  \ `item = 25` 且 `arr1 = [10,20,25,40,100,150,400]`，所以中间点是 `4`。\n第一次迭代：由于 `arr1[4]\
  \ > 25`，我们搜索数组 `[10,20,25]`。\n第二次迭代：中间点是 `2`，对应的值是 `20`。\n第三次迭代：中间点是 `3`，对应的值是 `25`，找到目标。\n\
  \n示例 #4：假设 `item = 25` 且 `arr1 = [1,5,10,15,20,30,40]`，所以中间点是 `4`。\n第一次迭代：由于 `arr1[4]\
  \ < 25`，我们搜索数组 `[20,30,40]`。\n第二次迭代：中间点是 `5`，对应的值是 `30`。\n第三次迭代：数组只有一个元素 `[20]`，没有匹配项。\n\
  \n正如本节第一段提到的，二分查找可以通过交互解决方案实现，这是下一节的主题。\n\n### 二分查找代码（迭代）\n\nListing 4.64 显示了 `binary_search1.sh`\
  \ 的内容，它演示了如何对数字数组进行二分查找。\n\n**Listing 4.64: binary_search1.sh**\n\n```bash\necho\
  \ \"\" | awk ' BEGIN {  arr1[1] = 1  arr1[2] = 3  arr1[3] = 5  arr1[4] = 123  arr1[5]\
  \ = 400  found = -1  item = 123  left = 0  right = length(arr1)-1  printf(\"array:\
  \ \")  for(k=1; k<=length(arr1); k++) {    printf(\"%d \",arr1[k])  }  print \"\"\
  }{  while(left <= right) {    mid = int(left + (right-left)/2)  if(arr1[mid] ==\
  \ item) {      found = mid      break  } else if (arr1[mid] < item) {    left =\
  \ mid+1    } else {    right = mid-1    }  }  if( found >= 0) {    print \"found\"\
  ,item,\"in position\",found  } else {    print item,\"not found\"  }}'\n```\n\n\
  ## 二分查找（递归）\n\nListing 4.65 显示了 `binary_search_recursive.py` 的内容，它演示了如何递归地对数字数组进行二分查找。\n\
  \n\n\n\n\n```bash\necho \"\" | awk 'function binary_search(data, item, left, right)\
  \ {\n  if(left > right) {\n    return \"Not Found\"\n  } else {\n    # incorrect\
  \ (can result in overflow):\n    # mid = (left + right) / 2\n    mid = int(left\
  \ + (right-left)/2)\n    if(item == data[mid]) {\n      return \"Found\"\n    }\
  \ else if (item < data[mid]) {\n      # recursively search the left half\n     \
  \ return binary_search(data, item, left, mid-1)\n    } else {\n      # recursively\
  \ search the right half\n      return binary_search(data, item, mid+1, right)\n\
  \    }\n  }\n}BEGIN {\n  arr1[1] = 1\n  arr1[2] = 3\n  arr1[3] = 5\n  arr1[4] =\
  \ 123\n  arr1[5] = 400\n  items[1] = -100\n  items[2] = 123\n  items[3] = 200\n\
  \  items[4] = 400\n  found = -1\n  item = 123\n  left = 0\n  right = length(arr1)-1\n\
  \  printf(\"array: \")\n  for(k=1; k<=length(arr1); k++) {\n    printf(\"%d \",arr1[k])\n\
  \  }\n  print \"\"\n}{\n  for(i=1; i<=length(items); i++) {\n    item\n  = items[i]\n\
  \    left\n  = 0\n    right = length(arr1)-1\n    result = binary_search(arr1, item,\
  \ left, right)\n    print \"item\",item, result\n  }}'\n```\n\n代码列表 4.65 以函数 `binary_search()`开始，其参数\
  \ `data`、`item`、`left` 和 `right` 分别包含当前数组、搜索项、`data` 的左索引以及 `data` 的右索引。如果左索引 `left`\
  \ 大于右索引 `right`，则搜索项在原数组中不存在。\n\n然而，如果左索引 `left` 小于右索引 `right`，则代码将 `data` 的中间索引赋值给变量\
  \ `mid`。接下来，代码执行以下三部分逻辑条件测试：\n\n* 如果 `item == data[mid]`，则说明在数组中找到了搜索项。\n* 如果 `item\
  \ < data[mid]`，则对数据数组的左半部分调用函数 `binary_search()`。\n* 如果 `item > data[mid]`，则对数据数组的右半部分调用函数\
  \ `binary_search()`。\n\n代码列表 4.65 的下一部分用数字初始化了排序数组 `arr1`，并用搜索项列表初始化了数组 `items`，同时还初始化了一些标量变量，用于跟踪我们每次分割数组时要搜索的子数组的左、右索引位置。\n\
  \n代码列表 4.65 的最后部分包含一个循环，该循环遍历 `items` 数组中的每个元素，并调用函数 `binary_search()` 来确定当前项是否在排序数组中。运行代码列表\
  \ 4.65 中的代码，你将看到以下输出：\n\narray:  [  1  3  5 123 400]item:  -100  found:  Falseitem:\
  \  123  found:  Trueitem:  200  found:  Falseitem:  400  found:  True\n\n## 总结\n\
  \n本章的第一部分向你展示了如何操作数组，例如初始化数组和显示内容。然后你看到了如何相加数组中的数值，以及如何确定数组中的最大值和最小值。此外，你还学习了如何初始化多维数组。\n\
  \n接下来，你学习了如何对数据集执行各种任务，例如删除交替行、打印数据集中范围内的 `strings` 或日期，以及合并交替行。此外，你还学习了如何处理数据集中的重复行以及如何确保数据值的一致性。\n\
  \n此外，你还看到了如何实现冒泡排序，以及如何判断两个 `strings` 是否为字母变位词。此外，你还学习了如何在线性时间内对数组进行排序，这是可以实现的。之后，你看到了如何通过迭代算法和递归算法执行线性搜索和二分查找。\n\
  \n# 第 5 章：使用 awk\n\n本章是三个章节中的第三章，包含了 `awk` 命令各种功能的示例。\n\n本章的第一部分从 `awk` 中的位运算开始，例如计算一对正整数的位\
  \ `AND`、`OR` 和 `XOR`。本节包含了执行各种字符串相关任务的代码示例，例如反转字符串、检查括号是否平衡以及列对齐。本章的第二部分向你展示了如何删除缺失值的行、如何处理多个文件以及进行日期转换。你还将学习如何处理包含包含百万条记录的数据集，以及如何统计此类数据集中相邻数字。本章的第三部分讨论了递归，提供了等差数列值、等比数列值和阶值的代码示例。此外，你将看到如何使用欧几里得算法求两个整数的最大公约数，也可以用于求两个整数的最小公倍数。\n\
  \n## awk 中的位运算\n\n本节介绍了 `awk` 中的位运算，例如计算一对正整数的 `AND`、`OR` 和 `XOR`。本节包含了执行各种字符串相关任务的代码示例，例如反转字符串、检查括号是否平衡以及列对齐。本章的第二部分向你展示了如何删除缺失值的行、如何处理多个文件以及进行日期转换。你还将学习如何处理包含百万记录的数据集，以及如何统计此类数据集中相邻数字。本章的第三部分讨论了递归，提供了等差数列值、等比数列值和阶值的代码示例。此外，你将看到如何使用欧几里得算法求两个整数的最大公约数，也可以用于求两个整数的最小公倍数。\n\
  \n### 逻辑\n\n代码列表 4.65 以函数 `binary_search()`开始，其参数 `data`、`item`、`left` 和 `right`\
  \ 分别包含当前数组、搜索项、`data` 的左索引以及 `data` 的右索引。如果左索引 `left` 大于右索引 `right`，则搜索项在原数组中不存在。\n\
  \n然而，如果左索引 `left` 小于右索引 `right`，则代码将 `data` 的中间索引赋值给变量 `mid`。接下来，代码执行以下三部分逻辑条件测试：\n\
  \n* 如果 `item == data[mid]`，则说明在数组中找到了搜索项。\n* 如果 `item < data[mid]`，则对数据数组的左半部分调用函数\
  \ `binary_search()`。\n* 如果 `item > data[mid]`，则对数据数组的右半部分调用函数 `binary_search()`。\n\
  \n代码列表 4.65 的下一部分用数字初始化了排序数组 `arr1`，并用搜索项列表初始化了数组 `items`，同时还初始化了一些标量变量，用于跟踪我们每次分割数组时要搜索的子数组的左、右索引位置。\n\
  \n代码列表 4.65 的最后部分包含一个循环，该循环遍历 `items` 数组中的每个元素，并调用函数 `binary_search()` 来确定当前项是否在排序数组中。运行代码列表\
  \ 4.65 中的代码，你将看到以下输出：\n\narray:  [  1  3  5 123 400]item:  -100  found:  Falseitem:\
  \  123  found:  Trueitem:  200  found:  Falseitem:  400  found:  True\n\n### AND\n\
