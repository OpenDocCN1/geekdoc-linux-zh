  \n## 显示文本文件中的子列\n\nListing 5.19 显示了文本文件 `products.txt` 的内容，其行包含相同数量的列。\n\n***Listing\
  \ 5.19: products.txt***\n\n```\nMobilePhone 400  newTablet  300  newTablet  300\
  \  usedMobilePhone 200  usedMobilePhone 100  used\n```\n\nListing 5.20 显示了 `RemoveColumn.sh`\
  \ 的内容，显示了不包含文本文件第一列的 `products.txt` 内容。\n\n***Listing 5.20: RemoveColumn.sh***\n\
  \n```bash\nawk '{ for (i=2; i<=NF; i++) printf \"%s \", $i; printf \"\\n\"; } products.txt\n\
  ```\n\n\n\n\n循环范围从 2 到 `NF`（包含边界），这排除了第一个输入字段。此外，`printf` 在打印完一行数据字段后会显式地添加换行符。Listing\
  \ 5.20 中 `awk` 命令的输出如下：\n\n```\n400 new300 new300 used200 used100 used\n```\n\n\
  Listing 5.21 显示了 `RemoveColumns.sh` 的内容，它包含一个 `awk` 语句打印文本文件中除第三列以外的所有列，随后另一个 `awk`\
  \ 语句打印文本文件中除第三列和第七列以外的所有列。\n\n***Listing 5.21: RemoveColumns.sh***\n\n```bash\n\
  filename=\"aligned-data2.csv\"\necho \"=> contents of $filename:\"\ncat $filename\n\
  echo \"\"\n## print all but the third column:\necho \"Skipping field 3:\"\nawk '{\n\
  \  for (i=1; i<=NF; i++) {\n     if( i != 3 ) {\n        printf(\"%s \", $i)\n \
  \    }\n  }\n  print \"\"}' $filename\necho \"\"\n## print all but the third and\
  \ seventh columns:\necho \"Skipping field 3 and field 7:\"\nawk '{\n  for (i=1;\
  \ i<=NF; i++) {\n     if( (i != 3 ) && ( i != 7 ) ) {\n        printf(\"%s \", $i)\n\
  \     }\n  }\n  print \"\"}' $filename\n```\n\nListing 5.21 是 Listing 5.20 的增强，它首先用\
  \ CSV 文件的名称初始化变量 `filename`。接下来，第一个 `awk` 语句中的循环打印 CSV 文件每行的每一列，除非该列是第三列。第二个 `awk`\
  \ 语句中的循环打印 CSV 文件每行的每一列，除非该列是第三列或第七列。运行 Listing 5.21 中的代码，你将看到以下输出：\n\n```\n=> contents\
  \ of aligned-data2.csv:\nSara, Jones, 1000, CA, Sally, Smith, 2000, IL\nDave, Jones,\
  \ 3000, FL, John, Jones, 4000, CA\nDave, Jones, 5000, NY, Mike, Jones, 6000, NY\n\
  Tony, Jones, 7000, WA\nskipping field 3:\nSara, Jones, CA, Sally, Smith, 2000, IL\n\
  Dave, Jones, FL, John, Jones, 4000, CA\nDave, Jones, NY, Mike, Jones, 6000, NY\n\
  Tony, Jones, WA\nskipping field 3 and field 7:\nSara, Jones, CA, Sally, Smith, IL\n\
  Dave, Jones, FL, John, Jones, CA\nDave, Jones, NY, Mike, Jones, NY\nTony, Jones,\
  \ WA\n```\n\n## 数据集中对齐行的列子集\n\n本节中的代码示例说明了如何提取现有列的子集和行的子集。Listing 5.22 显示了目标数据集\
  \ `sub-rows-cols.txt` 的内容，它包含了 `aligned-data.txt` 文件中每偶数行的两个列。\n\n***Listing 5.22:\
  \ sub-rows-cols.txt***\n\n```\nSara, 1000\nDave, 3000\nDave, 5000\nTony, 7000\n\
  ```\n\nListing 5.23 显示了 `sub-rows-cols.sh` 的内容，说明了如何生成 Listing 5.22 中的数据集。大部分代码与\
  \ Listing 5.21 相同，新代码以粗体显示。\n\n***Listing 5.23: sub-rows-cols.sh***\n\n```bash\n\
  #-----------------------------------------\n### 1) 删除空行\n### 2) 删除换行符\n# 3) 每四个字段后打印一个\
  \ LF\n### 4) 删除每行末尾的逗号\n#-----------------------------------------\ninputfile=\"\
  mixed-data.csv\"\noutputfile=\"sub-rows-cols.csv\"\necho \"=> Contents of input\
  \ file:\"\ncat $inputfile\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\"\
  ,$0)}' | awk 'BEGIN { columnCount = 4 }{\n  for(i=1; i<=NF; i++) {\n     printf(\"\
  %s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n  }}' > temp-columns\n\
  ### 4) 删除输出末尾的逗号:\ncat temp-columns | sed 's/, $//' | sed 's/**$//' > temp-columns2\n\
  cat temp-columns2 | awk 'BEGIN { rowCount = 2; currRow = 0 }\n{\n  if(currRow %\
  \ rowCount == 0) { print $1, $3 }\n  ++currRow}' > temp-columns3\ncat temp-columns3\
  \ | sed 's///' | sed 's///' > $outputfile\necho \"=> Contents of output file:\"\n\
  cat $outputfile\n```\n\nListing 5.23 包含一个新代码块，将步骤 4 的输出重定向到临时文件 `temp-columns`，其内容由\
  \ Listing 5.23 最后部分的另一个 `awk` 命令处理。注意 `awk` 命令包含一个 `BEGIN` 块，将变量 `rowCount` 和 `currRow`\
  \ 初始化为 2 和 0。主块在行数为偶数时打印行的第 1 列和第 3 列。该 `awk` 命令的输出重定向到另一个临时文件，最终代码使用 `cat` 命令和两次\
  \ `sed` 来移除末尾的逗号和空格：`cat temp-columns3 | sed 's///' | sed 's///' > $outputfile`。运行\
  \ Listing 5.23 中的代码，你将看到以下输出：\n\n```\n=> Contents of input file:\nSara, Jones, 1000,\
  \ CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John, Jones, 4000, CA\nDave,\
  \ Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000, WA\n=> Contents of\
  \ output file:\nSara, Jones, 1000\nDave, 3000\nDave, 5000\nTony, 7000\n```\n\n实现\
  \ Listing 5.22 功能还有其他方法；目的是展示组合各种 `bash` 命令的技术。\n\n## 数据集中最长/最短单词\n\nListing 5.24\
  \ 显示 `report.txt` 的内容，Listing 5.25](#ch05.xhtml_Listing5.25) 显示 `longest_word.sh`\
  \ 的内容，说明了如何统计文件中单词的频率。\n\n***Listing 5.24: longest_word.sh***\n\n```\nThis is a\
  \ sample report.\nSome relevant details were presented yesterday.\nSeveral people\
  \ likes to work from home.\nHowever, some people prefer the office.\nIn addition,\
  \ parking is easier now.\nThe WFM topic has different appeal.\n```\n\n***Listing\
  \ 5.25: longest_word.sh***\n\n```bash\nawk '{\n  longest=0\n  shortest=\"\"\n  for(i=1;\
  \ i<=NF; i++) {\n    if(length($i) > longest) longest = length($i)\n    if(shortest\
  \ == \"\") shortest = length($i)\n    if(length($i) < shortest) shortest = length($i)\n\
  \  }\n  print \"Sentence: \",$0\n  print \"Longest: \",longest,\"Shortest: \",shortest,\"\
  \\n\"}' report.txt\n```\n\nListing 5.25 将变量 `longest` 和 `shortest` 初始化为 0 和 \"\"\
  。接部分代码包含一个循环，遍历每个句子的字段。当当前字段分别比 `longest` 长或比 `shortest` 当前值短时，条件代码块会更新这两个变量的值。Listing\
  \ 5.25 的输出如下：\n\n```\nSentence: This is a sample report. Longest: 7 Shortest: 1\n\
  Sentence: Some relevant details were presented yesterday. Longest: 10 Shortest:\
  \ 4\nSentence: Several people likes to work from home. Longest: 7 Shortest: 2\n\
  Sentence: However, some people prefer the office. Longest: 8 Shortest: 3\nSentence:\
  \ In addition, parking is easier now. Longest: 9 Shortest: 2\nSentence: The WFM\
  \ topic has different appeal. Longest: 9 Shortest: 3\n```\n\n## 数据集中单词频率统计\n\nListing\
  \ 5.26 显示 `WordCounts1.sh` 的内容，说明了如何统计文件中单词的频率。\n\n***Listing 5.26: WordCounts1.sh***\n\
  \n```bash\nawk '# Print list of word frequencies\n{\n  for (i = 1; i <= NF; i++)\n\
  \    freq[$i]++}END {\n  for (word in freq)\n    printf \"%s\\t%d\\n\", word, freq[word]}'\
  \ columns2.txt\n```\n\nListing 5.26 包含一个处理 `columns2.txt` 中行的代码块。每遇到一个单词（行中的），代码就会增加该单词在哈希表\
  \ `freq` 中出现的次数。END 块包含一个循环，显示 `columns2.txt` 中每个单词的出现次数。Listing 5.26 的输出如下：\n\n\
  ```\ntwo\t3\none\t3\nthree\t3\nsix\t1\nfour\t3\nfive\t2\n```\n\n\n\n\n\n123 ONE\
  \ TWO456 three fourONE TWO THREE FOURfive 123 sixone two threefour five\n\nListing\
  \ 5.28：WordCounts2.sh\n\n```awk\nawk '{\n    # convert everything to lower case\n\
  \    $0 = tolower($0)\n    # remove punctuation\n    #gsub(/[^[:alnum:]_[:blank:]]/,\
  \ \"\", $0)\n    for(i=1; i<=NF; i++) {\n        freq[$i]++\n    }}END {\n    for(word\
  \ in freq) {\n        printf \"%s\\t%d\\n\", word, freq[word]\n    }}' columns4.txt\n\
  ```\n\nListing 5.28 包含了以下代码片段，它可以将每个输入行的文本转换为小写字母：\n\n:\n\n`$0 = tolower($0)`\n\n\
  使用 `columns4.txt` 运行 Listing 5.28 的输出如下：\n\n456      1two      3one      3three\
  \      3six      1123      2four      3five      2\n\n## 在数据集中仅显示“纯”单词\n\n为了简单见，让我们处理一个文本字符串，这样我们就可以在解决方案的过程中看到中间结果。这个示例在之前的章节中可能很常见，但现在我们看到\
  \ `awk` 是如何实现它的。\n\nListing 5.29 显示了 `onlywords.sh` 的内容，其中包含三个 `awk` 命令，用于显示文本字符串中的单词、整数和字母数字字符串。\n\
  \nListing 5.29：onlywords.sh\n\n```bash\nx=\"ghi abc Ghi 123 #def5 123z\"\necho \"\
  Only words:\"\necho $x |tr -s ' ' '\\n' | awk -F\" \" '{  if($0 ~ /^[a-zA-Z]+$/)\
  \ { print $0 }}' | sort | uniq\necho\necho \"Only integers:\"\necho $x |tr -s '\
  \ ' '\\n' | awk -F\" \" '{  if($0 ~ /^[0-9]+$/) { print $0 }}' | sort | uniq\necho\n\
  echo \"Only alphanumeric words:\"\necho $x |tr -s ' ' '\\n' | awk -F\" \" '{  if($0\
  \ ~ /^[0-9a-zA-Z]+$/) { print $0 }}' | sort | uniq\n```\n\nListing 5.29 从初始化变量 `x`\
  \ 为一个空格分隔的标记集开始：\n\n`x=\"ghi abc Ghi 123 #def5 123z\"`\n\n下一步是将 `x` 分拆为单词：\n\n`echo\
  \ $x |tr -s ' ' '\\n'`\n\n上一个代码片段的输出所示：\n\nghiabcGhi123#def5123z\n\n第三步是调用 `awk`\
  \ 并检查匹配正则表达式 `^[a-zA-Z]+` 的单词，该表达式匹配任何由一个或多个大写或小写字母组成的字符串（不包含其他任何字符）：\n\n`if($0\
  \ ~ /^[a-zA-Z]+$/) { print $0 }`\n\n上一个代码片段的输出在此：\n\nghiabcGhi\n\n最后，如果你还想对输出排序并只打印唯一的单词，可以将\
  \ `awk` 命令的输出重定向到 `sort` 命令和 `uniq` 命令。\n\n第二个 `awk` 命令使用正则表达式 `^[0-9]+` 来检查整数，第三个\
  \ `awk` 命令使用正则表达式 `^[0-9a-zA-Z]+` 来检查字母数字单词。运行 Listing 5.29 的输出如下：\n\nOnly words:Ghiabcghi\n\
  Only integers:123\nOnly alphanumeric words:123123zGhiabcghi\n\n你可以将变量 `x` 替换为数据集，以便从该数据集中检索字母字符串。\n\
  \n## 删除包含缺失值的行\n\n本节中的代码示例将向如何使用 `awk` 命令拆分数据集行中的逗号分隔字段，其中字段可能包含任意深度的嵌套引号。\n\nListing\
  \ 5.30 显示了 `titanic.csv` 中的行子集，Listing 5.31 显示了文件 `delete-empty-cols-awk.sh` 的内容，该文件向你展示如何创建一个行完全填充数据值的新数据集。\n\
