  \ 函数移除字符\n\n以下 `awk` 命令移除输入字符串中作为第一个字符的字母 `t`、`h` 或 `e`：\n\n```bash\necho \"there\"\
  \ | awk '{ gsub(/^[the]/, \"\", $0); print }'\n```\nhere\n\n以下 `awk` 命令移除输入字符串中作为第一个字符的字母\
  \ `t` 或 `T`：\n\n```bash\necho \"there\" | awk '{ gsub(/^[tT]/, \"\", $0); print\
  \ }'\n```\nhere\n\n以下 `awk` 命令移除输入字符串中以 `t` 或 `T` 开头且紧跟序列 “he,” 的字符：\n\n```bash\n\
  echo \"there\" | awk '{ gsub(/^[tT]he/, \"\", $0); print }'\n```\nre  \n\n以下 `awk`\
  \ 命令移除输入字符串中的所有小写字母：\n\n```bash\necho \"ABCa1b2c3XYZ\" | awk '{ gsub(/[a-z]/, \"\
  \", $0); print }'\n```\nABC123XYZ\n\n以下 `awk` 命令移除输入字符串中的所有大写字母：\n\n```bash\necho\
  \ \"ABCa1b2c3XYZ\" | awk '{ gsub(/[A-Z]/, \"\", $0); print }'\n```\na1b2c3\n\n以下\
  \ `awk` 命令移除输入字符串中的大写字母 `X` 到 `Z`：\n\n```bash\necho \"ABCa1b2c3XYZ\" | awk '{ gsub(/[X-Z]/,\
  \ \"\", $0); print }'\n```\nABCa1b2c3\n\n以下 `awk` 命令移除输入字符串中的大写字母 `A`、`X`、`Y` 和\
  \ `Z`：\n\n```bash\necho \"ABCa1b2c3XYZ\" | awk '{ gsub(/[AX-Z]/, \"\", $0); print\
  \ }'\n```\nBCa1b2c3\n\n以下 `awk` 命令移除输入字符串中的小写字母 `a`、`b` 以及大写字母 `A`、`X`、`Y` 和 `Z`：\n\
  \n```bash\necho \"ABCa1b2c3XYZ\" | awk '{ gsub(/[abAX-Z]/, \"\", $0); print }'\n\
  ```\nBC12c3\n\n以下 `awk` 命令移除输入字符串中的所有小写字母和大写字母：\n\n```bash\necho \"ABCa1b2c3XYZ\"\
  \ | awk '{ gsub(/[a-zA-Z]/, \"\", $0); print }'\n```\n123\n\n## 使用 `gsub()` 函数移除连续字符\n\
  \n之前章节中的示例向你展示了如何移除单个大写或小写字母，以及所有的大写或小写字母。然而，你可能只需要移除连续的大写（或小写）字符，而不是此类字符的所有出现。例如，以下\
  \ `awk` 命令移除输入字符串中两个连续的大写字母：\n\n```bash\necho \"ABCa1b2c3XYZ\" | awk '{ gsub(/[A-Z]{2}/,\
  \ \"\", $0); print }'\n```\nCa1b2c3Z\n\n以下 `awk` 命令移除输入字符串中首次出现的三个连续数字（1, 2, 和 3），且其后紧跟一个或多个小写字母：\n\
  \n```bash\necho \"123a4b5c678\" | awk '{ gsub(/¹²³[a-z]+/, \"\", $0); print }'\n\
  ```\n4b5c678\n\n## 使用 `gsub()` 函数移除字符串的补集\n\n以下 `awk` 命令移除输入字符串中数字 `1`、`2` 和 `3`\
  \ 以外的所有内容：\n\n```bash\necho \"123a4b5c678\" | awk '{ gsub(/[¹²³]/, \"\", $0); print\
  \ }'\n```\n123\n\n请记住，元字符 `^` 在括号对内部的出现与在括号对外部的出现不同。例如，以下 `awk` 命令移除输入字符串中不以数字 `1`、`2`\
  \ 或 `3` 开头的字符：\n\n```bash\necho \"123a4b5c678\" | awk '{ gsub(/^[¹²³]/, \"\", $0);\
  \ print }'\n```\n123a4b5c678\n\n以下 `awk` 命令移除输入字符串中匹配数字 `6`、`7` 或 `8` 的末尾字符：\n\n\
  ```bash\necho \"123a4b5c678\" | awk '{ gsub(/[678]$/, \"\", $0); print }'\n```\n\
  123a4b5c67\n\n## 使用 `gsub()` 函数移除元字符\n\n以下 `awk` 命令移除输入字符串中的元字符 `$`：\n\n```bash\n\
  echo \"a?b?c?\" | awk '{ gsub(/?/, \"\", $0); print }'\n```\nabc\n\n以下 `awk` 命令移除输入字符串中的多个元字符：\n\
  \n```bash\necho \"a@b#?c$d^\" | awk '{ gsub(/[@#$^]/, \"\", $0); print }'\n```\n\
  abc\n\n现在比较以下省略方括号的 `awk` 命令的结果与之前包含方括号的 `awk` 命令的结果：\n\n```bash\necho \"a@b#?c$d^\"\
  \ | awk '{ gsub(/[@#$^]/, \"\", $0); print }'\n```\n\n### 移除文本中的空格\n\n以下 `awk` 使用\
