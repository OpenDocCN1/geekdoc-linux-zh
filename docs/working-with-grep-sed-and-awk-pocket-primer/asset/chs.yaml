  \nListing 5.44 显示了 `count-tokens.sh` 的内容，它展示了如何统计一个标记（token）在多个文本文件的第二个字段出现的次数。\n\
  \n***Listing 5.44: count-tokens.sh***\n\n```\necho \"Count the same token in MULTIPLE\
