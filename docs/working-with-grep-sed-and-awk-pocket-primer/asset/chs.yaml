  ARGV[2]: 2\nARGV[3]: 3\n```\n\n## 总结\n\n本章从 `awk` 中的位操作开始，例如计算一对整数的与、或和异或操作。然后你学习了与字符串相关的任务，例如反转字符串、检查括号平衡以及列对齐。此外，你学习了如何删除包含缺失值的行、如何处理多个文件以及日期转换。接下来，你学习了递归，包含了计算等差数列、等比数列、阶乘值和斐波那契数的代码示例。此外，你学习了使用欧几里得算法来寻找两个整数的最大公约数，这使你能够能够找到两个整数的最小公倍数。最后，你学习了如何使用\
  \ `ARGC` 和 `ARGV` 显示命令行参数。\n\n\n\n\n\n关于本章的另一点：你将遇到正则表达式的许多概念和方面，如果你是初学者，这些材料的密度可能会让你感到无从从。然而，练习和重复将帮助你熟练正则表达式。\n\
  \n## 什么是正则表达式？\n\n正则表达式被称为 `REs`、`regexes` 或 `regex patterns`（正则表达式模式），它们允许你指定可以匹配字符串中特定“部分”的表达式。例如，你可以定义一个正则表达式来匹配单个字符或数字、电话号码、邮政编码或电子邮件地址。你可以使用元字符和字符类（在下一节中定义）作为正则表达式的一部分，在文本文件中搜索特定模式。随着你学习如何使用\
  \ `REs`，你也会发现发现使用它们的其他方法。\n\n## 元字符\n\n`awk` 命令支持一组元字符，其中大多数元字符与其它脚本语言（如 `Perl`）以及编程语言（如\
  \ `JavaScript` 和 `Java`）中的元字符相同。`Python` 中元字符的完整列表在此：\n\n`. ^ $ * + ? { } [ ] \\\
  \ | ( )`\n\n上述元字符的含义在此：\n\n`?`（匹配 0 次或 1 次）：表达式 `a?` 匹配字符串 `a`（但不匹配 `ab`）\n\n`*`（匹配\
  \ 0 次或多次）：表达式 `a*` 匹配字符串 `aaa`（但不匹配 `baa`）\n\n`+`（匹配 1 次或多次）：表达式 `a+` 匹配 `aaa`（但不匹配\
  \ `baa`）\n\n`^`（行首）：表达式 `^[a]` 匹配字符串 `abc`（但不匹配 `bc`）\n\n`$`（行尾）：`[c]$` 匹配字符串 `abc`（但不匹配\
  \ `cab`）\n\n`.`（单个点）：匹配任意字符（换行符除外）\n\n有时你需要匹配元字符本身而不是表示，可以通过两种方式实现。第一种方法是通过反斜杠（`\\\
  `）字符“转义”它们的符号含义。因此，序列 `\\?`、`\\*`、`\\+`、`\\^`、`\\$` 和 `\\.` 代表字面字符而不是它们的符号含义。你也可以用序列\
  \ `\\\\` 来“转义”反斜杠字符。如果你有两个连续的反斜杠字符，你需要为每个字符额外提供一个反斜杠，这意味着 `\\\\\\\\` 是 `\\\\` 的“转义”序列。\n\
  \n第二种方法是在一对方括号内列出元字符。例如，`[+?]` 将字符 `+` 和 `?` 视为字面字符而不是元字符。第二方法显然更紧凑且不易出错（在长长的元字符序列中很容易忘记反斜杠）。正如你可能猜测的那样，`re`\
  \ 模块中的方法支持元字符。\n\n## 注意\n\n位于方括号序列左侧（且外部）的 `^` 字符（例如 `^[A-Z]`）将正则表达式“锚”到行首，而位于方括号内部第一个字符的\
  \ `^` 字符则否定方括号内的正则表达式（例如 `[^A-Z]`）。\n\n正则表达式中 `^` 字符的解释取决于它在正则表达式中的位置，如下：\n\n“^[a-z]”意味着任何以小写字母开头的字符串\n\
  \n“[^a-z]”意味着任何不包含任何小写字母的字符串\n\n“^[^a-z]”意味着任何以小写字母以外的任何字符开头的字符串\n\n“^[a-z]$”意味着单个小写字母\n\
  \n“^[^a-z]$”意味着单个非小写字母的字符（包括数字）\n\n## 字符集\n\n十进制中的单个数字是 `0` 到 `9` 之间的数字，由序列 `[0-9]`\
  \ 表示。同样，小写字母可以是 a 到 z 之间的任何字母，由序列 `[a-z]` 表示。大写字母可以是 A 到 Z 之间的任何字母，由序列 `[A-Z]` 表示。\n\
  \n以下代码段说明了如何使用简写符号来指定数字序列和字符字符串序列，这种方法比显式指定每个匹配数字要简单得多：\n\n`[0-9]` 匹配单个数字\n\n`[0-9][0-9]`\
  \ 匹配 2 个连续数字\n\n`[0-9]{3}` 匹配 3 个连续数字\n\n`[0-9]{2,4}` 匹配 2、3 或 4 个连续数字\n\n`[0-9]{5,}`\
  \ 匹配 5 个或更多连续数字\n\n`^[0-9]+$` 匹配完全由数字组成的字符串\n\n你可以使用大写或小写字母来定义类似的模式，这种方法比显式指定每个小写字母或每个大写字母要简单得多：\n\
  \n`[a-z][A-Z]` 匹配一个小写字母后跟着 1 个大写字母\n\n`[a-zA-Z]` 匹配任何大写或小写字母\n\n### 使用 “^” 和 \"\\\
  ”\n\n`^` 字符的用途取决于它在正则表达式中的上下文。例如，以下表达式匹配以数字开头的文本字符串：\n\n```\n^[0-9].\n```\n\n然而，以下表达式匹配不以数字开头的文本字符串，因为有方括号表达式开头的\
  \ `^` 元字符以及方括号表达式左侧（且外部）的 `^` 元字符（你之前学过的）：\n\n```\n[⁰-9]\n```\n\n反斜杠（`\\`）允许你转义元字符的含义。因此，位于方括号内部外部的\
  \ `^` 字符会转义 `.`  字符的含义。因此，`\\.` 匹配点，而 `.` 匹配单个字符（换行符除外）。其他涉及反斜杠的示例包括：\n\n```\n\\\
  .* 匹配 Hello\nH.* 匹配 Hello\n\\. 匹配 Hello\n```\n\n## 字符类\n\n字符类是比你在上一节中看到的“裸”表达式更短、更简单的表达式。`Perl`、`Python`\
  \ 和 `JavaScript` 等语言支持字符类，`awk` 也支持字符类。\n\n例如，字符类 `\\d` 代表单个（十进制）数字。类似的注释也适用于 `\\\
  D`、`\\w` 和 `\\W`。\n\n## POSIX 字符类\n\nPOSIX 类与我们之前过的正则表达式字符类不同。POSIX 类使用字符串来定义类，可能比你在\
  \ `JavaScript` 和 `Java` 等语言正则表达式中看到的反斜杠风格更直观。例如，POSIX 使用 `[:digit:]]` 来指定数字而不是 `[0-9]`\
  \ 或 `\\d`。此外，POSIX 标准定义了 12 种字符类，其中一些如下：\n\n- `[:alpha:]`: 字母\n- `[:alnum:]`: 字母和数字\n\
  - `[:digit:]`: 数字\n- `[:xdigit:]`: 十进制数字\n- `[:blank:]`: 空格和制表符\n- `[:cntrl:]`:\
  \ 控制字符\n\n例如，以下 `awk` 命令可以使用使用 POSIX 字符类的正则表达式处理 IPv4 地址：\n\n```\necho \"192.168.10.13\"\
  \ | awk -F\".\" '/^[[:digit:]]+/ { print $1 }'\necho \"ABC.168.10.13\" | awk -F\"\
  .\" '/^[[:alnum:]]+/ { print $1 }'\n```\n\n你可以结合 `printf` 命令和 POSIX 在以下 `awk` 命令中正确分割字符串：\n\
  \n```\nprintf \"a\\n1\\nb\\n2\\nc\\n\" | awk '/[[:digit:]]/'12\n```\n\n然而，将上述 `awk`\
  \ 命令中的 `printf` 命令替换为 `echo` 命令效果无效：\n\n```\necho \"a\\n1\\nb\\n2\\nc\\n\" | awk\
  \ '/[[:digit:]]/'a\\n1\\nb\\n2\\nc\\n\n```\n\n\n\n下一节包含相应的、不使用 POSIX 字符类的 `awk`\
  \ 命令。\n\n## 通用字符类\n\n本节包含了你在其他编程语言（如 `Python` 和 `JavaScript`）中会遇到的字符类。一些表示数字和字母模式的简便字符序列：\n\
  \n`\\d` 匹配单个数字\n\n`\\w` 匹配单个字符（数字或字母）\n\n`\\s` 匹配单个空白字符（空格、换行、回车或制表符）\n\n`\\b` 匹配单词与非单词之间的边界\n\
  \n`\\n`, `\\r`, `\\t` 分别代表换行、回车和制表符\n\n`\\` “转义”任何字符\n\n根据前面的定义，`\\d+` 匹配一个或多个数字，`\\\
  w+` 匹配一个或多个字符，两者都比使用字符集更紧凑。此外，我们可以重写前一节中的表达式：\n\n`\\d` 等于 `[0-9]`，而 `\\D` 等于 `[⁰-9]`\n\
  \n`\\s` 等于 `[ \\t\\n\\r\\f\\v]`，它匹配任何非空白字符，而 `\\S` 是反相反（它匹配 `[^ \\t\\n\\r\\f\\v]`）\n\
  \n`\\w` 等于 `[a-zA-Z0-9_]`，它匹配任何字母数字字符，而 `\\W` 是反的（它匹配 `[^a-zA-Z0-9_]`）\n\n另一个实用的功能是可以指定字符出现次数的最小、最大或范围，如下例所示：\n\
  \n- `\\d{2}` 等于 `[0-9][0-9]`\n- `\\d{3}` 等于 `[0-9]{3}`\n- `\\d{2,4}` 等于 `[0-9]{2,4}`\n\
  - `\\d{5,}` 等于 `[0-9]{5,}`\n- `^\\d+$` 等于 `^[0-9]+$`\n\n大括号 (`{}`) 被称为量词，它们指定了跟在它们之前的表达式中的字符数量（或范围）。以下\
  \ `awk` 命令集包含了各种匹配模式的示例，每个 `awk` 命令的结果都以注释行的形式显示：\n\n```\necho \"a.b.c 192.168.10.13\"\
  |awk '/^[a-zA-Z0-9.-]+/    { print $2 }'#192.168.10.13\necho \"aa.bb.cc 192.168.10.13\"\
  \ |awk '/^[a-zA-Z0-9.-]+ /    { print $2 }'#192.168.10.13\necho \"aa.bb.cc 192.168.10.13\"\
  \ |awk '/^[a-zA-Z0-9.-]+ .*/    { print $2 }'#192.168.10.13\necho \"aa.bb.cc 192.168.10.13\"\
  \ |awk -F\".\" '/^[a-zA-Z0-9.-]+    /  { print $2 }'#bbe\necho \"aa.bb.cc 192.168.10.13\"\
  \ |awk -F\".\" '/^[a-zA-Z0-9.-]+    .*/ { print $2 }'#bb\n```\n\n## awk 中的正则表达式\n\
  \n正则表达式在 `awk` 中可以解决的任务方面非常强大。本节包含几个子节，向你展示使用正则表达式操作的简单示例，在本书的后后部分，你将看到 `awk` 中更复杂的正则表达式示例。\n\
