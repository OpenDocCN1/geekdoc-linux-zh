  \n## gensub() 函数与捕获组\n\n## 总结\n\n## 索引\n\n# 前言\n\n## 目标是什么？\n\n本书的目标是向读者介绍三个强大的命令行工具，这些工具可以结合起来创建创建简单而强大的\
  \ shell 脚本，以执行各种任务。代码示例和脚本使用 bash shell，并且通常涉及小型文本文件，因此你可以专注于理解 `grep`、`sed` 和 `awk`\
  \ 的功能。本书对于初次在 bash 环境下工作的读者来说内容足够详尽，可以作为一个良好的参考书，并为已经具有这些命令行工具经验的人教授一些新技巧。\n\n本书介绍了基础概念，并演示了它们在简单而强大的\
  \ shell 脚本中的用法。请记住，本书并不涵盖“纯”系统管理功能。\n\n## 这本书适合我吗？我将学什么？\n\n本书面向普通用户以及任何想要从命令行执行各种任务的人。\n\
  \n你将理解如何使用 `grep`、`sed` 和 `awk`，它们的功能在前五章中进行了讨论。具体而言，第 1 章介绍了 `grep` 命令，第 2 章介绍了\
  \ `sed` 命令，第 3 章到第 5 章讨论了 `awk` 命令。第六章（最后一章）向你介绍了正则表达式。\n\n本书将节省你搜索相关代码示例并将其调整以适应你的特定需求的时间，这可能是一个耗时的过程。\n\
  \n## 代码示例是如何生成的？\n\n书中的代码示例是在运行 OS X 10.15.7 (macOS Catalina) 的 MacBook Pro 上使用\
  \ bash 创建并测试的。关于它们的内容：代码示例主要源自作者编写的脚本。\n\n## 阅读本书需要的知识\n\n你需要对 Unix 有一定的了解，例如学习\
  \ shell 编程的欲望。然而，如果你不确定是否能吸收这些，可以浏览一下书中的代码示例。\n\n## 如何设置命令行 shell？\n\n如果你是 Mac 用户，有三种方法。第一种方法是使用\
  \ Finder 导航到 `/Applications` > `Utilities`，然后双击 `Terminal` 。接下来，如果你已经有一个命令行 shell，可以通过输入命令启动一个新的：\n\
  \n```\ncommand+n\n```\n\n如果你是 PC 用户，可以安装模拟 bash 的 Cygwin (https://cygwin.com/) 或使用其他工具包。请阅读描述下载和安装过程的文档。\n\
  \n如果你使用 RStudio，需要在 RStudio 内部启动命令行 shell……注意，如果定义在 `.bash_login` 以外的文件，自定义别名不会自动生效。\n\
  \n## 完成本书后的“下一步”是什么？\n\n这个问题的答案差异很大，因为答案在很大程度上取决于你的目标。最好的答案是将书中的新工具或技术应用于你关心的职业或个人任务上。具体是什么任务，取决于你的身份，因为数据科学家、经理、学生或开发者的需求各不相同。此外，在应对新的数据清洗或处理挑战时，请记住你所学到的。有时知道某种技术可行，会更容易找到解决方案，即使你必须重新阅读该章节以记住语法的具体工作方式。\n\
  \n如果你已经达到了本书所学内容的极限，并想获得这些命令的更深技术，有大量的出版物和在线资源描述 bash shell、Unix 编程以及 grep、sed 和\
  \ awk 命令。\n\n# 第 1 章 使用 grep\n\n本章向你介绍了多功能的 `grep` 命令，它可以处理输入文本流以生成所需的输出文本流。该命令与其他\
  \ Unix 命令配合得良好。本章包含许多短代码示例，说明了 `grep` 命令的各种选项。\n\n本章的第一部分介绍了独立使用的 `grep` 命令、与元字符（如\
  \ `^`、`$` 等）一起使用的命令，以及说明如何使用某些 `grep` 选项的代码片段。接下来，你将学习如何匹配行范围、如何在 `grep` 中使用反向引用以及如何“转义”元字符。\n\
  \n\n\n\n本章第二部分将向你展示如何使用 `grep` 命令在数据集中查找空行和共同行，以及如何使用键（keys）匹配数据集中的行。接下来，你将学习如何在\
  \ `grep` 命令中使用字符类，以及反斜杠（`\\`）字符，并如何指定多个匹配模式。你将学习如何将 `grep` 命令与 `find` 命令和 `xargs`\
  \ 命令结合，这对于匹配不同目录下的文件模式非常有用。本节包含了一些人们在使用 `grep` 命令时常犯错误的示例。\n\n第三部分简要讨论了 `egrep`\
  \ 命令和 `fgrep` 命令，这些相关命令提供了标准 `grep` 实用程序不具备的功能。第四部分包含一个用例，说明了如何使用 `grep` 命令查找匹配行，然后将其合并以创建一个新的数据集。\n\
  \n## 什么是 grep 命令？\n\n`grep`（“全局正则表达式打印”）命令用于在单文件或多个文件中查找字符串。以下是几个示例：\n\n- `grep\
  \ abc *sh` 显示所有以 `sh` 为后缀的文件中包含 `abc` 的所有行。\n- `grep -i abc *sh` 与前面的查询相同，但不区分大小写。\n\
  - `grep -l abc *sh` 显示所有包含 `abc` 且以 `sh` 为后缀的文件名。\n- `grep -n abc *sh` 显示所有以 `sh`\
  \ 为后缀的文件中字符串 `abc` 出现的所有行号。\n\n你可以使用这种语法执行逻辑与（AND）和逻辑或（OR）操作：\n\n- `grep abc *sh\
  \ | grep def` 匹配包含 `abc` 和 `def` 的行。\n- `grep \"abc\\|def\" *sh` 匹配包含 `abc` 或 `def`\
  \ 的行。\n\n你也可以组合开关：以下命令显示包含字符串 `abc` 的不名大小文件名：\n\n```\ngrep -il abc *sh\n```\n\n\
  换句话说，前面的命令匹配包含 `abc`、`Abc`、`ABc`、`ABC`、`abC` 等的文件名。\n\n显示包含 `abc`（不区分大小写）行的另一种（效率较低的）方法在这里：\n\
  \n```bash\ncat file1|grep -i abc\n```\n\n前面的命令涉及两个进程，而“使用 `-l` 开关代替 `cat` 输入你想要的文件”的方法仅涉及单个进程。对于小型文本文件，执行时间大致相同，但如果你处理的是多个大型文本文件，执行时间的差异可能会变得显著。\n\
  \n你可以结合 `sort` 命令、管道符号和 `grep` 命令。例如，以下命令按大小从小到大显示带有“Jan”日期的文件：\n\n```bash\nls -l|grep\
  \ \" Jan \" | sort -n\n```\n\n前面命令的示例输出在这里：\n\n```\n-rw-r--r--  1 oswaldcampesato2\
  \  staff         3 Sep 27  2022 abc.txt\n-rw-r--r--  1 oswaldcampesato2  staff \
  \        6 Sep 21  2022 control1.txt\n-rw-r--r--  1 oswaldcampesato2  staff    \
  \  27 Sep 28  2022 fiblist.txt\n-rw-r--r--  1 oswaldcampesato2  staff      28 Sep\
  \ 14  2022 dest\n-rw-r--r--  1 oswaldcampesato2  staff        36 Sep 14  2022 source\n\
  -rw-r--r--  1 oswaldcampesato2  staff       195 Sep 28  2022 Divisors.py\n-rw-r--r--\
  \  1 oswaldcampesato2  staff      267 Sep 28  2022 Divisors2.py\n```\n\n## 元字符与\
  \ grep 命令\n\n基础构建块是匹配单个字符的正则表达式。大多数字符（包括所有字母和数字）都是匹配其自身的正则表达式。任何具有特殊含义的元字符都可以通过在它们前面加上反斜杠（`\\\
  `）来进行转义。\n\n正则表达式后面可以跟几个重复操作符之一，如下所示：\n\n- `.` 匹配任意单个字符。\n- `?` 表示前面的项是可选的，且最多匹配一次：`Z?`\
  \ 匹配 `Z` 或 `ZZ`。\n- `*` 表示前面的项将匹配零或多次：`Z*` 匹配 `Z`、`ZZ`、`ZZZ` 等。\n- `+` 表示前面的项将匹配一次或多次：`Z+`\
  \ 匹配 `ZZ`、`ZZZ` 等。\n- `{n}` 表示前面的项恰好匹配 `n` 次：`Z{3}` 匹配 `ZZZ`。\n- `{n,}` 表示前面的项匹配\
  \ `n` 次或更多：`Z{3,}` 匹配 `ZZZ`、`ZZZZ` 等。\n- `{,m}` 表示前面的项最多匹配 `m` 次：`Z{,3}` 匹配 `Z`、`ZZ`\
  \ 和 `ZZZ`。\n- `{n,m}` 表示前面的项至少匹配 `n` 次，但不超过 `m` 次：`Z{2,4}` 匹配 `ZZ`、`ZZZ` 和 `ZZZZ`。\n\
  \n空正则表达式匹配空字符串（即输入流中没有数据的行）。两个正则表达式可以通过中缀操作符（`|`）连接。以这种方式使用时，中缀操作符的行为类似于逻辑或。\n\n\
