  \n***Listing 4.16: field_counts.sh***\n\n```\n## print number of fields\nawk '{\
  \ print \"NF:\",NF}' lines.txt\n#line version:\nawk '{ print $0 }' lines.txt\n```\n\
  \nListing 4.16 包含一个 `awk` 命令，打印每行的字段数以及行内容。运行 Listing 4.16 中的代码，你将看到以下输出：\n\n```\n\
  NF: 4 this is a line\nNF: 4 cond line here\nNF: 3 new yorkhattan\nNF: 3 san francisco\
  \ downtown\nNF: 3 deep dish pizza\nNF: 2 short line\n```\n\nListing 4.17 显示了 `field_counts2.sh`\
  \ 的内容，展示了如何打印每行的字段数以及行内容。\n\n***Listing 4.17: field_counts2.sh***\n\n```\nawk 'BEGIN\
  \ { arr=\"\"; first_count=0 } {arr[NR] = $0  if( NR == 1 ) {    first_count = NF\
  \    print \"=> Length of first line:\",NF  }  if(NF == first_count) {    print\
  \ \"Line\",NR,\"matches field count\",first_count  } else if (NF > first_count)\
  \ {    print \"Line\",NR,\"is longer than\",first_count  } else {    print \"Line\"\
  ,NR,\"is shorter than\",first_count  }}END {   print \"=> Initial array:\"  for\
  \ (i=1; i<=NR; i++) {print \"Row\",i,arr[i]  }  print \"=> Sorted array:\"  row_count\
  \ = asort(arr, sorted)  for (i=1; i<=row_count; i++) {print sorted[i] \":\" arr[sorted[i]]\
  \  }}' lines.txt\n```\n\nListing 4.17 包含了与 Listing 4.16 相同的代码，并带有额外的代码块，用于根据每个输入行更新\
  \ `arr` 数组，随后是一个代码片段用于跟踪第一行的字段数，接着是一个条件代码块用于检查后续行的字段数。当输入行的字段数与第一行相同时，条件代码块会显示相应的消息，以及字段较多较少的行。\n\
  \nListing 4.17 的最后部分是一个 `END` 块，它包含了两个循环：第一个循环打印了所有输入行，第二个循环按排序打印输入行。运行 Listing\
  \ 4.17 中的代码，你将看到以下输出：\n\n```\n=> Length of first line: 4\nLine 1 matches field count\
  \ 4\nLine 2 matches field count 4\nLine 3 is shorter than 4 : 3\nLine 4 is shorter\
  \ than 4 : 3\nLine 5 matches field count 4\nLine 6 is shorter than 4 : 2\n=> Initial\
  \ array:\nRow 1 this is a line\nRow 2 cond line here\nRow 3 new yorkhattan\nRow\
  \ 4 san francisco downtown\nRow 5 deep dish pizza\nRow 6 short line\n=> Sorted array:\n\
  1:cond line here\n2:short line\n3:new yorkhattan\n4:san francisco downtown\n5:deep\
  \ dish pizza\n6:this is a line\n```\n\n## 删除交替行\n\nListing 4.18 显示了 `variable_fields.txt`\
