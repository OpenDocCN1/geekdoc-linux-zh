  \ `if` 语句决定了变量 `min_rate` 和 `max_rate` 的值是否也需要更新。`while` 循环中的最后一个代码段将更新变量 `rownum`\
  \ 的值，然后处理 CSV 文件中的下一行。\n\n最后的代码块显示了在本代码示例的第一部分初始化的标量变量的值：\n\n```bash\navg_rate=`expr\
  \ $total / $num_records`\necho \"Number of Records:     $num_records\"\necho \"\
  Minimum Rate:         $min_rate\"\necho \"Maximum Rate:         $max_rate\"\necho\
