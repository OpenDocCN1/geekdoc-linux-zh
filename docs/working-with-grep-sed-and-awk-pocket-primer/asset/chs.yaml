  \ `count` 和 `token` 分别初始化为 `0` 和 `chicken`。主执行块包含条件逻辑，用于检查 `$3` 的值是否匹配 `token` 的值，如果是，则\
  \ `count` 的值加 1。\n\nListing 5.44 代码的最后部分是一个 `END` 块，用于打印字符串 `token` 和变量 `count`\
  \ 的值。运行 Listing 5.44 中的代码，你将看到以下输出：\n\nCount the same token in MULTIPLE files:\n\
  Token: chicken token count: 7\n\nListing 5.45 显示了 `count-tokens2.sh` 的内容，它展示了如何统计一个标记在多个文本文件的第二个字段出现的次数，同时也统计处理过的行数。\n\
  \n***Listing 5.45: count-tokens2.sh***\n\n```\necho \"Count the same token in MULTIPLE\
