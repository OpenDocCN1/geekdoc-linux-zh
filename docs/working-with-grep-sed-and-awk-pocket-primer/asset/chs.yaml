  ```\n\n运行列表 2.23 中的代码，你将看到以下输出：\n\n```\nNumber of Records:     153\nMinimum Rate:\
  \         107\nMaximum Rate:         1489\nSum of All Rates:      118610\nAverage\
  \ Support Rate: 775\n```\n\n## 总结\n\n本章从介绍 `sed` 命令开始，并提供了匹配字符串模式和替换字符串模式的示例。然后，你学习了如何进行搜索和替换。\n\
  \n你还学习了如何使用 `sed` 命令将数据集中的多个分隔符替换为单个分隔符。接下来，你学习了如何打印行、删除控制字符，以及如何在 `sed` 中处理字符类。\n\
  \n此外，你还学习了在 `sed` 中使用反向引用，随后列了一系列实用的单行 `sed` 命令。接着，你学习了如何填充数据集中的缺失值。最后，你学习了如何处理包含百万行数据的数据集。\n\
  \n# 第 3 章\n\n# 使用 AWK 进行工作\n\n本章向你介绍了 `awk` 命令，这是一种功能极其强大的实用程序，用于处理数据和重构数据集。`awk`\
  \ 本质上是一门单条命令形式的编程语言，它接受标准输入，产生标准输出，并以与其他 Unix 命令相同的方式使用正则表达式和元字符。这种功能让你能够将 `awk`\
  \ 与其他命令行工具结合起来。你可以在 `awk` 脚本中包含命令，因为它的多功能性使得仅凭一眼可能很难理解一个 `awk` 脚本。\n\n本章的第一部分提供了\
  \ `awk` 命令的简要介绍。你将学习 `awk` 的一些内置变量以及如何使用 `awk` 操作字符串变量。注意，这些与字符串相关的示例某些也可以用其他 `bash`\
  \ 命令处理。\n\n本章的第二部分向你展示了 `awk` 中的 `while` 循环和 `for` 循环，用于处理数据集中的行和列。接下来，你将学习如何在 `awk`\
  \ 命令中使用条件逻辑。该部分还展示了如何在数据集中删除行和合并行，以及如何将文件内容作为单行文本打印。你将看到如何“连接”数据集中的行和行组。\n\n第三部分包含说明如何在\
  \ `awk` 中使用逻辑运算符的代码示例，随后是一个向你展示如何检查一个正整数是否为闰年的代码示例。\n\n第四部分解释了如何为输出数据指定不同类型的格式、如何处理浮点数、数字截断和四舍五入，以及\
  \ `awk` 中的数值函数。\n\n第五部分向你展示了如何将字符串转换为小写、大写和混合大小。接下来，你将看到如何统计匹配字符的行数，以及如何在 `awk`\
  \ 中使用 `match()` 函数。最后，你将学习 `awk` 中的不可打印字符和十六进制数。\n\n在阅读本章之前，请记住，本章中的数据集特意设计得很短，以便你专注于学习\
  \ `awk` 命令丰富的特性集。完成本章后，请继续下一章，其中包含更多基于 `awk` 的代码示例。\n\n如果你好奇的话，包含 25 TB 数据的数据集已经通过\
  \ `awk` 成功处理过。如果你处理数 TB 级的数据集，很可能需要在云环境中进行处理。此外，`awk` 命令对于涉及几乎任何大小数据集集的数据清洗任务非常有用。\n\
  \n## awk 命令\n\n`awk`（由 Aho、Weinberger 和 Kernighan 命名）命令具有类 C 语言的语法，你可以使用这个实用程序对数字和文本字符串执行非常复杂的操作。\n\
  \n顺带提一下，还有 `gawk` 命令（即 GNU awk）以及 `nawk` 命令（“新” awk），但书中都没有讨论这二条命令。`nawk` 的一个优势是，它允许你从外部设置内部变量的值。\n\
  \n你可以在 GitHub 上找到 *The One True Awk*，这是由 Aho、Weinberger 和 Kernighan 编写的 awk：\n\n\
  https://github.com/onetrueawk/awk\n\n### 启动 awk 命令和文件扩展\n\n`awk` 命令允许你通过多种方式执行基于\
  \ `awk` 的脚本，同时也存在几种类似（但不同）无法执行 `awk` 命令的方法。书中的许多基于 `awk` 的代码示例指定了输入文件，这将在后面的章节中描述。\n\
  \n然而，也有一些不涉及输入文件的 `awk` 脚本，例如计算算术和或几何和的 `awk` 脚本。具体来说，以下内容从命令行无法运行：\n\n```bash\n\
  awk '{print \"hello\" }'\n```\n\n但这种方式是有效的：\n\n```bash\necho \"\" | awk '{print\
  \ \"hello\"}'\n```\n\n你也可以调用一个 `awk` 脚本，其第一行是所谓的“bang”。例如，假设 `q1.sh` 包含以下 shebang\
  \ 和 `BEGIN` 语句：\n\n```bash\n#!/usr/bin/awk -f\nBEGIN {print \"hello\"}\n```\n\n\
  在通过 `chmod +x q1.sh` 使其变为可执行后，你可以运行 `q1.sh`：\n\n```bash\n./q1.sh\n```\n\n另一种技术涉及从命令行指定\
  \ `-f` 。例如，假设 `q2.sh` 包含以下片段：\n\n```bash\nBEGIN {print \"hello\"}\n```\n\n你可以通过以下命令运行\
  \ `q2.sh`：\n\n```bash\nawk -f q2.sh\n```\n\n正如你所知，以下技术也有效，这是书中未指定输入文件时使用的技术：\n\n\
  ```bash\necho \"\" | awk '{print \"hello\"}'\n```\n\n另一个需要注意的是包含 awk 命令的脚本的文件扩展名。你经常看到扩展名为“sh”的脚本，也会看到扩展名为“awk”的脚本，这表示该脚本包含一个\
  \ awk 命令。这些是在网上搜索代码示例时经常看到的约定。\n\n书中的代码示例对所有可执行脚本都使用“sh”扩展。\n\n#### 控制 awk 的内置变量\n\
  \n`awk` 命令提供了你可以更改其默认值的变量，以控制 `awk` 如何执行操作。此类变量（及其默认值）示例：\n\n- FS (\" \")\n- RS\
  \ (\"n\")\n- IFS (\"n\")\n- OFS (\" \")\n- ORS (\"n\")\n- NR\n- NF\n- SUBSEP\n-\
  \ IGNORECASE\n\n变量 `FS` 和 `RS` 分别指定字段分隔符和记录分隔符，而变量 `OFS` 和 `ORS` 分别指定输出字段分隔符和输出记录分隔符。如有，你可以更改\
  \ `RS` 的值，例如跨行的文本字段。\n\n你可以将字段分隔符 (`IFS`) 视为分隔符，而记录分隔符的行为类似于 sed 处理单行的方式。例如，sed\
  \ 可以匹配或删除一个行范围，而不是匹配或删除符合正则表达式的内容。`awk` 的默认记录分隔符是换行符，因此默认情况下，awk 和 sed 在处理文本文件方面具有相似的能力。此外，`NR`\
  \ 包含当前记录的行数，`NF` 包含当前处理记录的字段数。\n\n\n\n其他内置变量还包括 `FILENAME`（`awk` 当前正在读取的文件名）、`FNR`（当前文件中当前记录数）、`NF`（当前输入记录中的字段数）以及\
  \ `NR`（自程序执行以来 `awk` 处理的输入记录数）。\n\n请参阅在线文档以获取有关 `awk` 命令的这些（以及其他）参数的更多信息。\n\n##\
  \ awk 命令是如何工作的？\n\n`awk` 命令每次读取输入文件的一个记录（默认情况下，一个记录为一行）。如果记录匹配某个模式（由你指定），则执行关联的操作（否则将不执行任何操作）。如果未给出搜索模式，则\
  \ `awk` 将对输入的每条记录执行给定的操作。如果没有给出任何操作，默认行为是打印所有匹配给定模式的记录。最后，不带任何操作的空括号 `{}` 不执行任何操作；即，它不会执行默认的打印操作。注意，操作中的每条语句都应该用分号分隔。\n\
  \n### awk 命令中的三个重要代码块\n\n`awk` 命令的结构由一个可选的 `BEGIN` 块、主块和一个可选的 `END` 块组成。`awk` 命令的高层结构如下：\n\
  \n```bash\nawk -F\",\" 'BEGIN { print \"BEGIN\"; x = 2; y = 5; }{ print \"MIDDLE\"\
  ,\"x=\",x,\"y=\",y x+=1; y+=1}END { print \"END:\",\"x=\",x,\"y=\",y }' some_input_file.txt\n\
  ```\n\n将上述代码放在名为 `template.sh` 的文件中，然后通过以下命令使该 shell 脚本可执行：\n\n```bash\nchmod +x\
  \ template.sh\n```\n\n你还需要将 `some_input_file.txt` 替换为存在的文件：让我们称该文件 `one.txt`，它只包含一行文本（原因很快就会解释）。现在你可以如下所示从命令行启动\
  \ shell 脚本 `template.sh`：\n\n```bash\n./template.sh\n```\n\n调用上述命令后，你将看到以下输出：\n\n\
  ```\nBEGINMIDDLE x= 2 y= 5END: x= 3 y= 6\n```\n\n有趣的地方在于：主执行块（即 `BEGIN` 块之后、`END`\
  \ 块之前的部分）执行的次数等于文本文件 `one.txt` 中的行数！尝试使用具有不同行数的输入文件来说服你自己。\n\n然而，脚本 `template.sh`\
  \ 不需要任何输入文件，因此使用一种不需要指定输入文件的不同技术是合理的。正如你所见，此本书对于不需要任何外部输入的基于 `awk` 的脚本使用了“echo”风格。如果你喜欢使用可用的其他技术之一，请随时修改这些\
  \ shell 脚本。\n\n### 打印文本的不同方式\n\n`awk` 命令的灵活性允许你以各种方式打印文本。列表 3.1 显示了 `split_awk.sh`\
  \ 的内容，向你展示了生成相同输出的各种 `awk` 命令。\n\n***列表 3.1：simple_awk.sh***\n\n```bash\necho \"\
  1st:\"echo \"abc\" | awk '{ print \"full line:\",$0 }'echoecho \"2nd:\"echo \"abc\"\
  \ | awk '{}'echoecho \"3rd:\"echo \"abc\" | awk '{ print }'echoecho \"4th:\"echo\
  \ \"abc\" | awk '{ /abc/ }'echoecho \"5th:\"echo \"abc\" | awk '{ if( /abc/ ) {print}\
  \ }'echoecho \"6th:\"echo \"abc\" | awk '{ if($0 ~ /abc/) {print} }'echoecho \"\
  7th:\"echo \"abc\" | awk '{ if($1 ~ /abc/) {print} }'echoecho \"8th:\"echo \"abc\"\
  \ | awk '{ if($1 == \"abc\") {print} }'echoecho \"9th:\"echo \"abc\" | awk '{ if($0\
  \ == \"abc\") {print} }'echo# error:#echo \"abc\" | awk '{ /abc/ {print} }'echo\
  \ \"10th:\"echo \"abc def\" | awk '{ if($0 ~ /abc/) {print $2} }'echoecho \"11th:\"\
  echo \"abc def\" | awk '{ if($1 ~ /abc/) {print $2} }'echo\n```\n\n列表 3.1 向你展示了各种相似但包含重要差异的\
  \ `awk` 命令。需要记住的主要细节如下：\n\n*   `==` 执行精确匹配\n*   `~` 执行部分匹配\n*   `$0` 是整个输入行\n* \
  \  `$1` 是第一个字段，`$2` 是第二个字段（依此类推）\n\n现在再次查看列表 3.1](#ch03.xhtml_Listing3.1) 中的代码，你就会为什么所有包含\
  \ `if` 关键字的 `awk` 命令都会生成输出。此外，第二个和第四个 `awk` 命令没有输出，因为它们不包含 `print` 语句。运行 列表 3.1\
  \ 中的代码，你将看到以下输出：\n\n```\n1st:full line: abc2nd:3nd:abc4th:5th:abc6th:abc7th:abc8th:abc8th:abc9th:def10th:def\n\
  ```\n\n\n\nListing 3.3 包含一个 `echo` 命令，它将字符串传递给 `awk` 命令，而后者又将字段分隔符 `FS` 指定为空字符串。接下来，`awk`\
  \ 命令包含一个循环，遍历每个输入字段。由于 `FS` 被初始化为 `\"\"`，因此字段的数量等于传递给 `awk` 命令的输入中的字符数。\n\n在循环的每次迭代中，都会打印当前字段的位置和该字段的值。还有一个条件语句，每当当前字符匹配单个空格时，就会打印一串连字符（“--”）。运行\
  \ Listing 3.3 中的代码，你将看到以下输出：\n\n```\nField 1 is aField 1 is aField 2 is bField 3\
  \ is cField 4 is  --------Field 5 is dField 6 is eField 7 is fField 8 is  --------Field\
  \ 9 is gField 10 is hField 11 is I\n```\n\n### PROCINFO 数组\n\n内置数组 `PROCINFO` 允许你检查对输入行执行的字段拆分类型。Listing\
  \ 3.4 显示了 `procinfo.sh` 的内容，展示了如何进行这种判断。\n\n***Listing 3.4: procinfo.sh***\n\n```bash\n\
  echo \"abc\" | awk '{  if (PROCINFO[\"FS\"] == \"FS\")    print \"Regular field\
  \ splitting\"  else if (PROCINFO[\"FS\"] == \"FIELDWIDTHS\")    print \"Fixed-width\
  \ field splitting\"  else if (PROCINFO[\"FS\"] == \"FPAT\")    print \"Content-based\
  \ field splitting\"  else    print \"API input parser field splitting\"}'\n```\n\
  \nListing 3.4 包含一个主执行块，带有条件逻辑以检查 `PROCINFO[\"FS\"]` 的三个可能值中的哪一个正在生效。\n\n当使用常规字段拆分时，`PROCINFO[\"\
  FS\"]` 的值为 `FS`；当使用固定宽度字段拆分时，`PROCINFO[\"FS\"]` 的值为 `FIELDWIDTHS`；当使用基于内容的字段拆分时，其值为\
  \ `FPAT`。运行 Listing 3.4 中的代码，你将看到以下输出：\n\n```\nRegular field splitting\n```\n\n\
  ### awk 中忽略大小写\n\n命令行工具 `grep` 和 `sed` 支持“i”选项，用于执行不区分大小写的匹配。`awk` 工具则使用在 `awk`\
  \ 命令体内部指定的 `IGNORECASE` 选项。这是一个示例：\n\n```bash\n$ echo aBC |awk '{ IGNORECASE=1;\
  \ if($0 ~ /abc/) print $0}'aBC\n```\n\n虽然 Python 和 Java 等其他语言支持使用开关 `i` 来表示不区分大小写的匹配，但如果你在\
  \ `awk` 命令中指定 `/i/`，则不会显示输出：\n\n```bash\necho aBC |awk '{ if($0 ~ /abc/i) print\
  \ $0 }'\n```\n\n另一个选项是使用内置函数 `tolower()` 来执行不区分大小写的匹配，如下：\n\n```bash\n$ echo aBC\
  \ |awk '{if(tolower($0) ~ /abc/) print $0}'aBC\n```\n\n如果你想检查一个字符串是否包含所有大写字母，可以使用以下\
  \ `awk` 命令：\n\n```bash\n$ echo ABC |awk '{if($0 ~ toupper($0)) print $0}'ABC\n```\n\
  \n如果你想检查一个字符串是否包含所有小写字母，可以使用以下 `awk` 命令：\n\n```bash\n$ echo abc |awk '{if($0 ~ tolower($0))\
  \ print $0}'abc\n```\n\n另一个选项是使用内置函数 `tolower()` 来执行不区分大小写的匹配，如下：\n\n```bash\n$\
  \ echo aBC |awk'{if(tolower($0) ~ /abc/) print $0}'aBC\n```\n\n### 使用 OFS、ORS 以及换行符与“\n\
  ”\n\n`awk` 命令提供了内置变量 `OFS` 和 `ORS` 分别指定输出字段分隔符和输出记录分隔符，其默认值如下列表所示。Listing 3.5 显示了\
  \ `ofs_ors.sh` 的内容，向你展示了如何使用这些变量。\n\n***Listing 3.5: ofs_ors.sh***\n\n```bash\n\
  echo \"Default values for OFS and ORS:\"\necho \"abc def\" | awk 'BEGIN { print\
  \ \"OFS = \",OFS,\"x\",    \" ORS = \", ORS,\"x\" }'\necho \"output string followed\
  \ by 2 blank lines:\"\necho \"abc def\" | awk 'BEGIN { OFS = \"#\"; ORS = \"\\n\\\
  n\" }    { print $1, $2 }'\nechoecho \"output string followed by Z as line separator:\"\
  \necho \"abc def\" | awk 'BEGIN { OFS = \"#\"; ORS = \"Z\" }    { print $1, $2 }'\n\
  echoecho \"output string followed by Z as line separator:\"\necho \"abc def\" |\
  \ awk 'BEGIN { OFS = \"#\"; ORS = \"Z\" }    { print $1, $2, \"three\\nfour\" }'echo\n\
  ```\n\nListing 3.5 包含四个 `awk` 命令，设置 `OFS` 和 `ORS` 的值，它们分别是输出字段分隔符和输出记录分隔符。第一个 `awk`\
  \ 命令显示默认值，第二个 `awk` 命令将其设置为“#”和“\\n”。第三个和第四个 `awk` 命令将它们设置为“#”和“Z”。运行代码，你将看到以下输出：\n\
  \n```\nDefault values for OFS and ORS:OFS = ax ORS = x\noutput string followed by\
  \ 2 blank lines:abc#def\noutput string followed by Z as line separator:abc#def\n\
  three\nfour\n```\n\n\n\n# 使用 NR 显示文本文件的行范围\n\n你已经了解了如何显示文本文件的内容，但另一种方法是指定 `NR`，如下所示：\n\
  \n```bash\nawk 'NR' employees.csv\n```\n\n如果你想跳过文本文件的前 3 行并显示剩余的行，可以使用此命令：\n\n```bash\n\
  awk 'NR > 3' employees.csv2000,John Smith,03/08/2020,87.233000,Dave Stone,07/15/2022,84.16\n\
  ```\n\n接下来的 `awk` 代码段是上述 `awk` 命令的稍长版本，但功能相同：\n\n```bash\nawk 'NR > 3 { print }'\
  \ employees.csvawk '/start/,/stop/{if($0 ~ /stop/){print}; if($0 !~ /stop/)    printf\
  \ $0\" \"}}' file\n```\n\n## 根据字符串显示行范围\n\n前面的部分使用内置变量 `NR` 来显示行范围，而接下来的 `awk` 命令指定文本字符串作为要显示的行范围：\n\
  \n```bash\nawk '/two/,/three/ {print}' text_lines.txtthis is line twothis is line\
  \ onethis is line three\n```\n\n## 插入空行\n\n通过将 `ORS` 从默认的一个换行符改为两个换行符，可以在文件的每一行之后打印一个空行，如下所示：\n\
  \n```bash\ncat columns.txt | awk 'BEGIN { ORS =\"n\\n\" } ; { print $0 }'\n```\n\
  \n或者，你可以在 `awk` 脚本主体包含一个或多个 `print`（或 `printf`）语句，取决于你希望在每个输入行之后输出的空行数量。事实上，你可以使用条件逻辑在给定的输入行之后打印不同数量的空行。\n\
  \n## 删除空行\n\n接下来的代码段打印非空行：\n\n```bash\nawk 'NF' employees.csvempid,full_name,start_date,expenses1000,Jane\
  \ Jones,12/05/2021,93.552000,John Smith,03/08/2020,87.233000,Dave Stone,07/15/2022,84.16\n\
  ```\n\n## 指定字段数\n\n接下来的代码段打印每行的字段数：\n\n```bash\nawk '{print NF,\":\",$0}' employees.csv1\
  \ : empid,full_name,start_date,expenses2 : 1000,Jane Jones,12/05/2021,93.550 :2\
  \ : 2000,John Smith,03/08/2020,87.230 :2 : 3000,Dave Stone,07/15/2022,84.16\n```\n\
  \n接下来的代码段指定“，”为字段分隔符，并打印每行的字段数：\n\n```bash\nawk -F\",\" '{print NF,\":\",$0}' employees.csv\
  \  4 : empid,full_name,start_date,expenses4 : 1000,Jane Jones,12/05/2021,93.550\
  \ :4 : 2000,John Smith,03/08/2020,87.230 :4 : 3000,Dave Stone,07/15/2022,84.16\n\
  ```\n\n接下来的代码段打印包含超过 2 个字段的行：\n\n```bash\nawk -F\",\" '{if(NF > 2) print NF,\":\"\
  ,$0}' employees.csv4 : empid,full_name,start_date,expenses4 : 1000,Jane Jones,12/05/2021,93.554\
  \ : 2000,John Smith,03/08/2020,87.234 : 3000,Dave Stone,07/15/2022,84.16\n```\n\n\
  这是编写上述 `awk` 命令的另一种更易读的方法：\n\n```bash\nawk -F\",\" '{   if(NF > 2)     print NF,\"\
  :\",$0}' employees.csv\n```\n\n接下来的 `awk` 命令分别使用 `NR` 和 `NF` 包含了记录数和字段数：\n\n```bash\n\
  awk -F\",\" '{   if(NF > 2)     print \"Record\",NR, \"Field Count\",NF,\":\",$0}'\
  \ employees.csv\n```\n\n上述 `awk` 命令的输出所示：\n\nRecord 1 Field Count 4 : empid,full_name,start_date,expensesRecord\
  \ 2 Field Count 4 : 1000,Jane Jones,12/05/2021,93.55Record 4 Field Count 4 : 2000,John\
  \ Smith,03/08/2020,87.23Record 6 Field Count 4 : 3000,Dave Stone,07/15/2022,84.16\n\
  \n## 修改字段分隔符 FS\n\n接下来的代码段使用 `sed` 命令生成一组行，其中“，”分隔符被替换为“#”分隔符：\n\n```bash\ncat employees.csv\
  \ |sed \"s/,/#/g\"empid#full_name#start_date#expenses1000#Jane Jones#12/05/2021#93.552000#John\
  \ Smith#03/08/2020#87.233000#Dave Stone#07/15/2022#84.16\n```\n\n接下来的 `awk` 命令显示一组字段分隔符为“#”符号而不是“，”符号的行：\n\
  \n```bash\nawk 'BEGIN { FS=\",\"; OFS=\"#\" } NF { print $1, $3 }' employees.csvempid#start_date1000#12/05/20212000#03/08/20203000#07/15/2022\n\
  ```\n\n前面的 `awk` 命令包含了硬编码字段，而 Listing 3.7 显示 `replace_delimiters.sh` 的内容，它展示了如何将包含任意数量字段的文件的“，”分隔符替换为“#”。\n\
  \n\n\n\n`empid:start_date:empid,full_name,start_date,expenses1000:12/05/2021:1000,Jane\
  \ Jones,12/05/2021,93.552000:03/08/2020:2000,John Smith,03/08/2020,87.233000:07/15/2022:3000,Dave\
  \ Stone,07/15/2022,84.16`\n\n[Listing 3.10] 显示了 `even_fields2.sh` 的内容，该脚本打印包含任意数量字段的非空行的偶数字段。\n\
  \n**Listing 3.10: even_fields2.sh**\n\n```bash\nawk -F\",\" '{  if(NF > 0) {   \
  \   for(i=1; i<=NF; i+=2) {          printf(\"%s:\",$i)      }      print  }}' employees.csv\n\
  ```\n\n[Listing 3.10] 包含的代码与 [Listing 3.9] 几乎相同：唯一的区别是 [Listing 3.10] 跳过了输入文件 `employees.csv`\
  \ 的第一行。运行 [Listing 3.10] 中的代码，你将看到以下输出：\n\n`empid:start_date:empid,full_name,start_date,expenses1000:12/05/2021:1000,Jane\
  \ Jones,12/05/2021,93.552000:03/08/2020:2000,John Smith,03/08/2020,87.233000:07/15/2022:3000,Dave\
  \ Stone,07/15/2022,84.16`\n\n### 交换相邻字段\n\n[Listing 3.11] 显示了 `switch_fields.sh`\
  \ 的内容，该脚本交换 `employees.csv` 中的相邻字段。\n\n**Listing 3.11: switch_fields.sh**\n\n```bash\n\
  ### switch adjacent fields\nawk -F\",\" '{  if(NF > 0) {      for(i=1; i<=NF; i+=2)\
  \ {        printf(\"%s#%s#\",$(i+1),$i)      }      print \"\"  }}' employees.csv\n\
  ```\n\n[Listing 3.11] 与 [Listing 3.10] 类似，不同之处由于以下代码片段，*每个*字段都被打印，并使用“#”作为字段分隔符：\n\
  \n`printf(\"%s#%s#\",$(i+1),$i)`\n\n运行 [Listing 3.10]（注：此处原文应为 3.11）中的代码，你将看到以下输出：\n\
  \n`full_name#empid#expenses#start_date#Jane Jones#1000#93.55#12/05/2021#John Smith#2000#87.23#03/08/2020#Dave\
  \ Stone#3000#84.16#07/15/2022#`\n\n### 逆序显示字段\n\n以下代码片段以逆序显示 `employees.csv` 中的字段：\n\
  \n```bash\n$ awk -F\",\" '{print $4,$3,$2,$1}' employees.csv\nexpenses start_date\
  \ full_name empid\n93.55  12/05/2021 Jane Jones 100087.23 03/08/2020 John Smith\
  \ 200084.16 07/15/2022 Dave Stone 3000\n```\n\n以下代码片段以逆序显示 `employees.csv` 中非空行的字段：\n\
  \n```bash\n$ awk -F\",\" '{if(NF > 0) print $4,$3,$2,$1}' employees.csv\nexpenses\
  \ start_date full_name empid\n93.55  12/05/2021 Jane Jones 100087.23 03/08/2020\
  \ John Smith 200084.16 07/15/2022 Dave Stone 3000\n```\n\n前面的示例包含硬编码的字段值，而 [Listing\
  \ 3.12] 将适用于包含任意数量字段的行。\n\n**Listing 3.12: reverse_fields.sh**\n\n```bash\n# print\
  \ non-empty rows in reverse order\nawk -F\",\" '{  if(NF > 0) {  for(i=NF; i>=1;\
  \ i--) {    printf(\"%s,\",$i)  }  print \"\"  }}' employees.csv\n```\n\n[Listing\
  \ 3.12] 翻转了输入行字段打印的顺序，因为 `for` 循环从 `NF` 迭代到 `1`，如下所示：\n\n`for(i=NF; i>=1; i--) {\
  \ printf(\"%s,\",$i)}`\n\n运行 [Listing 3.12] 中的代码，你将看到以下输出：\n\n`expenses,start_date,full_name,empid,93.55,12/05/2021,Jane\
  \ Jones,100087.23,03/08/2020,John Smith,200084.16,07/15/2022,Dave Stone,3000,`\n\
  \n注意，输出的行尾有一个逗号，”我们可以通过将 [Listing 3.12] 的输出传递给 `sed` 命令来移除它，如下：\n\n```bash\n$ ./reverse_fields.sh\
  \ |sed \"s///\"\nexpenses,start_date,full_name,empid,93.55,12/05/2021,Jane Jones,100087.23,03/08/2020,John\
  \ Smith,200084.16,07/15/2022,Dave Stone,3000\n```\n\n### 统计非空行\n\n以下代码片段统计 `employees.csv`\
  \ 中非空行的数量：\n\n```bash\n$ awk '/./ { count+=1 } END { print \"Non-empty rows:\",count\
  \ }' employees.csv 4\n```\n\n前面的 `awk` 命令使用元字符 `.` 来匹配单个字符，这意味着变量 `count`（初始值为 0）会在每个包含至少一个字符的行上加\
  \ 1。\n\n以下 `awk` 命令统计空行的数量：\n\n```bash\n$ awk '/^$/ { count+=1 } END { print \"\
  Empty rows:\",count }' employees.csv 2\n```\n\n### 识别协议\n\n[Listing 3.13] 显示 `protocols.txt`\
  \ 的内容，[Listing 3.14] 显示 `awk_protocols.sh` 的内容。\n\n**Listing 3.13: protocols.txt**\n\
  \n`https`\n`ftp`\n\n[Listing 3.14]: `awk_protocols.sh`\n\n```bash\nawk '{ if ($1\
  \ ~ /http/) print \"HTTP-like protocol\"}' protocols.txt\nawk '{ if ($1 ~ /^http$/)\
  \ print \"Only HTTP protocol\"}' protocols.txt\nawk '{ if ($1 ~ /http|ftp/) print\
  \ $1}' protocols.txt\n```\n\n[Listing 3.14] 包含三个 `awk` 命令，第一个如果 `$1` 匹配 `http`。第二个\
  \ `awk` 命令检查行是否以字符串 `https` 开头，随后显示消息。第三个 `awk` 命令检查 `$1` 是否匹配模式 `http|https|ftp`\
  \ 中的任何一个，如果匹配成功，则打印另一个字符串。注意文件 `protocols.txt` 被指定为这三个 `awk` 命令的输入文件。运行 [Listing\
  \ 3.14] 中的代码，你将看到以下输出：\n\n**Listing 3.14: awk_protocols.sh**\n\n`HTTP-like protocol`\n\
  `Only HTTP protocol`\n`ftp`\n\n### 识别数字格式\n\n[Listing 3.15] 显示 `numbers.txt` 的内容，[Listing\
  \ 3.16] 显示 `awk_numbers.sh` 的内容。\n\n**Listing 3.15: numbers.txt**\n\n`FA13`\n`1234`\n\
  `192.168.12.40`\n\n**Listing 3.16: awk_numbers.sh**\n\n```bash\nawk '{  if($1 ~\
  \ /^[0-9]+$/)      { print \"Decimal:    $1}  else if ($1 ~ /^[A-F|0-9]+$/) { print\
  \ \"Hexadecimal:\",$1}  else if ($1 ~ /^[0-9]{3}.[0-9]{3}.[0-9]{2}.[0-9]{2}$/) {\
  \    print \"IPV4:        $1  }}' numbers.txt\n```\n\n[Listing 3.16] 包含一个 `awk`\
  \ 命令，使用 `if-else` 逻辑将 `$1` 与各种模式进行比较。第一个模式是 `^[0-9]+$`，它匹配完全由数字组成的行。如果发生匹配，则显示消息。\n\
  \n第二个代码片段包含模式 `^[A-F|0-9]+$`，它匹配由任意数字和 A 到 F 大写字母组合的行。该模式匹配任意数字数量的十六进制数。\n\n第三个模式匹配\
  \ IP 地址，其格式涉及一个点分隔符，该分隔符后面跟着三个数字、另一组三个数字，然后是一对数字，最后又是一对数字。注意，匹配的数字是十六进制数字。运行代码，你将看到以下输出：\n\
  \n`Hexadecimal: FA13`\n`Decimal:     1234`\n`IPV4:         192.168.12.40`\n\n##\
  \ 处理记录长度\n\n回想文件 `text_lines.txt` 包含以下数据：\n\n```\nthis is line one\nthis is line\
  \ two\nthis is line one\nthis is line three\nthis is line four\n```\n\n以下 `awk`\
  \ 命令显示 `text_lines.txt` 中每行的长度：\n\n```bash\nawk '{print length($0), $0}' text_lines.txt\n\
  16 this is line one\n16 this is line two\n16 this is line one\n18 this is line three\n\
  17 this is line four\n```\n\n以下 `awk` 命令显示所有长度大于 16 的行：\n\n```bash\n$ awk 'length($0)\
  \ > 16' text_lines.txt\nthis is line three\nthis is line four\n```\n\n以下 `awk` 命令显示\
  \ `text_lines.txt` 中长行的长度：\n\n```bash\n$ awk '{ if (length($0) > max) max = length($0)\
  \ } END { print max }' text_lines.txt18\n```\n\n以下 `awk` 命令是前面 `awk` 命令的变体，包含了一个注释：\n\
  \n```bash\n$ awk '{ if (x < length($0)) x = length($0) } END { print \"The longest\
  \ line length = \" x }' text_lines.txtThe longest line length = 18\n```\n\n\n\n\n\
  以下 `awk` 命令显示当前目录下的文件总大小：\n\n```bash\n$ ls -l * | awk '{ x += $5 } END { print \"\
  total bytes: \" x }'\ntotal bytes: 6572358\n```\n\n## 使用 printf() 语句对齐文本\n\n由于 `awk`\
  \ 是单条命令内部编程语言，它也有自己的方式通过 `printf()` 语句产生格式化输出。\n\nListing 3.17 显示了 `columns2.txt`\
  \ 的内容，Listing 3.18 显示了 脚本 `AlignColumns1.sh` 的内容，该脚本展示了如何对齐文本文件中的列。\n\n***Listing\
  \ 3.17: columns2.txt***\n```\none twothree fourone two three fourfive sixone two\
  \ threefour five\n```\n\n***Listing 3.18: AlignColumns1.sh***\n```bash\nawk '{ \
  \ # 左对齐 $1 到 10 字符宽列  # 右对齐 $2 到 10 字符宽  # 右对齐 $3 到 10 字符宽  # 右对齐 $4 到 10 字符宽  printf(\"\
  %-10s*%10s*%10s*%10s*\\n\", $1, $2, $3, $4)}' columns2.txt\n```\n\nListing 3.18\
  \ 包含一个 `printf()` 语句，显示文件 `columns2.txt` 中每行的前四个字段，每个字段宽度为 10 个字符。\n\n运行 Listing\
  \ 3.18 中的代码输出如下：\n\n```\none       *       two*           *           *three   \
  \   *      four*           *           *one       *      two*     three*      fourfive\
  \     *       six*           *           *\n```\n\n请记住，`printf()` 功能相当强大，因此它有自己的语法，这超出了本章的范围。在网上搜索可以找到手册页以及关于“如何使用\
  \ printf() 执行 X”的讨论。\n\n## 在 awk 中使用循环\n\n`awk` 命令支持以下类型的循环：\n\n* `for`\n* `while`\n\
  * `do-while`\n\n以下子节包含了上述列表中每个类型循环的示例。\n\n### awk 中的 for 循环\n\nListing 3.19 显示了\
  \ `Loop.sh` 的内容，它说明了如何在循环中打印数字列表。注意，`i++` 是 `awk`（以及大多数 C 派生语言）中 `i=i+1` 的另一种写法。\n\
  \n***Listing 3.19: Loop.sh***\n```bash\necho \"\" | awk 'BEGIN {}{  for(i=0; i<5;\
  \ i++) {    printf(\"%3d\", i)  }}END { print \"\\n\" }'\n```\n\nListing 3.19 包含一个\
  \ `for` 循环，通过 `printf()` 语句在同一行打印数字。注意只有在代码的 `END` 块中打印了换行。Listing 3.19 的输出如下：\n\
  \n```\n0 1 2 3 4\n```\n\n### for 循环中的指数\n\nListing 3.20 显示了 `awk-for-loop.sh` 的内容，展示了如何在\
  \ `awk` 中使用 `for` 循环。\n\n***Listing 3.20: awk-for-loop.sh***\n```bash\necho \"\"\
  \ | awk 'BEGIN {  for(i=1; i<=10; i++)    print \"The cube of\", i, \"is\", i*i;}'\
  \ # 作为单行命令\nawk 'BEGIN { for(i=1; i<=10; i++) print \"The cube of\", i,# \"is\"\
  , i*i;}'\n```\n\nListing 3.20 包含一个 `awk` 命令，从一个 `BEGIN` 块开始，循环遍历 1 到 10（包含边界）之间的的值。每次迭代都会打印循环变量的值以及该变量的立方。运行\
  \ Listing 3.20 中的代码，你将看到如下：\n\n```\nThe cube of 1 is 1\nThe cube of 2 is 8\nThe\
  \ cube of 3 is 27\nThe cube of 4 is 64\nThe cube of 5 is 125\nThe cube of 6 is 216\n\
  The cube of 7 is 343\nThe cube of 8 is 512\nThe cube of 9 is 729\nThe cube of 10\
  \ is 1000\n```\n\n### 带有 break 语句的 for 循环\n\nListing 3.21 显示了 `awk-loop-break.sh`\
  \ 的内容，说明了如何在 `awk` 的 `for` 循环中使用 `break` 语句。\n\n***Listing 3.21: awk-loop-break.sh***\n\
  ```bash\necho \"\" | awk '{  for(x=1; x<4; x++) {    print \"x:\",x    if(x == 2)\
  \ {    break;  }}'\n```\n\n之前的代码块一直输出直到变量 `x` 的值为 2，之后循环因为 `break` 语句退出。显示的输出为：\n\
  \n```\nx:1\nx:2\n```\n\n## 在 awk 中处理 while 循环\n\nListing 3.22 显示 `awk-while-loop.sh`\
  \ 的内容，展示了如何在 `awk` 中使用 `while` 循环。\n\n***Listing 3.22: awk-while-loop.sh***\n```bash\n\
  echo \"\" | awk 'BEGIN {  x=1; max=10  while(1) {    print \"The cube of\",x,\"\
  is\",x*x  if ( x == max ) break; x++;}}' # 作为单行命令\nawk 'BEGIN { for(i=1; i<=10;\
  \ i++) print \"The cube of\", i,# \"is\", i*i;}' # 注意：此处此处存在差异，保留了 while 循环的逻辑\n\
  ```\n\nListing 3.22 包含一个 `awk` 命令，从一个 `BEGIN` 块开始，其中循环变量 `x` 和 `max` 分别初始化为 1 和\
  \ 10。接下来，`while` 循环打印 `x` 的立方。当 `x` 达到 10 时，`if` 语句导致循环终止。运行 Listing 3.22 中的代码，将看到：\n\
  \n```\nThe cube of 1 is 1\nThe cube of 2 is 8\nThe cube of 3 is 27\nThe cube of\
  \ 4 is 64\nThe cube of 5 is 125\nThe cube of 6 is 216\nThe cube of 7 is 343\nThe\
  \ cube of 8 is 512\nThe cube of 9 is 729\nThe cube of 10 is 1000\n```\n\n### awk\
  \ 中的 do-while 循环\n\nListing 3.23 显示 `awk-dowhile.sh` 的内容，展示了如何在 `awk` 中使用 `do-while`\
  \ 循环。\n\n***Listing 23: awk-dowhile.sh***\n```bash\necho \"\" | awk '{  x = 0  do\
  \ {    print \"x:\",x  x = x + 1  } while(x < 4)}\n```\n\n之前的代码块产生输出：\n\n```\nx:0\n\
  x:1\nx:2\nx:3\n```\n\n## 条件逻辑与控制语句\n\n与其他编程语言一样，`awk` 支持条件逻辑（`if/else`）和控制语句（`for/while`\
  \ 循环）。Listing 3.24 展示了如何使用 `if/else` 逻辑。\n\n***Listing 24: if-else.sh***\n```bash\n\
  echo \"\" | awk 'BEGIN { x = 10 }{  if (x % 2 == 0) {    print \"x is even\"  }\
  \  else {    print \"x is odd\"  }}\n```\n\n之前的代码块将变量 `x` 初始化为 10，如果被 2 整除则打印“x\
  \ is even”，否则打印“x is odd”。\n\n## awk 中的 break, continue 和 next 关键字\n\n以下代码段说明了如何在\
  \ `awk` 的 `for` 循环中使用 `next` 和 `continue`：\n\n```bash\nawk '{  /expression1/ { var1\
  \ = 5; next }  /expression2/ { var2 = 7; next }  /expression3/ { continue }  //\
  \ 其他其他代码块}' somefile\n```\n\n当当前行匹配 `expression1` 时，`var1` 被赋值为 5，`awk` 读取下一行输入：因此\
  \ `expression2` 和 `expression3` 将不会被测试。如果 `expression1` 不匹配且 `expression2` 匹配，则\
  \ `var2` 被赋值为 7，然后 `awk` 读取下一行输入。如果只有 `expression3` 产生匹配，则 `awk` 跳过剩余代码块并处理下一行输入。\n\
  \nListing 3.25 显示 `next_lines.txt` 的内容，Listing 3.26 显示 `next_lines.sh` 的内容，说明了 `awk`\
  \ 命令中 `next` 关键字的作用。\n\n***Listing 3.25: next_lines.txt***\n```\none twone two threeone\
  \ two three four\n```\n\n***Listing 3.26: next_lines.sh***\n```bash\necho \"\" |\
  \ awk '{  if($1 ~ /one/) {    print \"Skipping line:\", NR    next  }  print \"\
  lines containing 'one' are skipped\"}' next_lines.txt\n```\n\n\n\n\n### Listing\
  \ 3.27: control_flow1.sh\n\n```bash\necho \"\" | awk '{  printf(\"all values:  \
  \    \")  for(i=0; i<5; i++) {      printf(\"%s \",i)  }  print \"\"  printf(\"\
  break keyword:    \")  for(i=0; i<5; i++) {      printf(\"%s \",i)      if(i ==\
  \ 2)          break  }  print \"\"  printf(\"continue keyword: \")  for(i=0; i<5;\
  \ i++) {      printf(\"%s \",i)      if(i == 2)          continue  }  print \"\"\
  \  printf(\"next keyword:     \")  for(i=0; i<5; i++) {      printf(\"%s \",i) \
  \     if(i == 2)          next  }  print \"\"}'\n```\n\n`Listing 3.27` 包含一个 `for`\
  \ 循环，它通过 `printf()` 语句在同一行打印数字。注意，新行仅在代码的 `END` 块中打印。`Listing 3.27` 的输出如下：\n\nall\
  \ values:      0 1 2 3 4break keyword:    0 1 2continue keyword: 0 1 2 3 4next keyword:\
  \     0 1 2\n\n`Listing 3.28` 显示了 `control_flow2.sh` 的内容，它将 `Listing 3.28` 中每个循环的条件逻辑放在\
  \ `printf()` 语句之前。\n\n### Listing 3.28: control_flow2.sh\n\n```bash\necho \"\" |\
  \ awk '{  printf(\"all values:      \")  for(i=0; i<5; i++) {      printf(\"%s \"\
  ,i)  }  print \"\"  printf(\"break keyword:    \")  for(i=0; i<5; i++) {      if(i\
  \ == 2)          break      printf(\"%s \",i)  }  print \"\"  printf(\"continue\
  \ keyword: \")  for(i=0; i<5; i++) {      if(i == 2)          continue      printf(\"\
  %s \",i)  }  print \"\"  printf(\"next keyword:     \")  for(i=0; i<5; i++) {  \
  \    if(i == 2)          next      printf(\"%s \",i)  }  print \"\"}'\n```\n\n`Listing\
  \ 3.28` 包含一个 `for` 循环，它通过 `printf()` 语句在同一行打印数字。注意，新行仅在代码的 `END` 块中打印。`Listing 3.28`\
  \ 的输出如下：\n\nall values:      0 1 2 3 4break keyword:    0 1continue keyword: 0 1\
  \ 3 4next keyword:     0 1\n\n### exit 关键字\n\n`Listing 3.29` 显示了 `exit_keyword.sh`\
  \ 的内容，向你展示了如何在 `awk` 中使用 `while` 循环。\n\n```bash\necho \"\" | awk '{  for(i=1;i<10;i++)\
  \ {    if(i==1)      exit 2  elif(i==2)      exit 4  elif(i==3)      exit 8  print(i)}'\n\
  ```\n\n`Listing 3.29` 包含一个从 1 迭代到 9（包含 9）的 `for` 循环。同一行打印数字。注意，当循环变量 `i` 等于 1、2\
  \ 或 4 时，会执行带有值 2、4 和 8 的 `exit` 语句。相比之下，循环变量 `i` 的所有其他值都会被打印出来。现在，运行以下命令：\n\n`./exit_keyword.sh;\
  \ echo \"rc=$\"`\n\n前一个命令的输出所示：\n2\n\n### 条件条件显示字段\n\n`Listing 3.30` 显示了 `conditional_fields1.sh`\
  \ 的内容，向你展示了如何在 `awk` 中使用 `while` 循环。\n\n```awk\nawk '{  for ( j=1; j<=NF; j++) {\
  \    if ( j < 3)      continue    printf(\"%s \", $j)  }} columns4.txt\n```\n\n\
  `Listing 3.30` 包含一个带有 `for` 循环的 `awk` 命令，处理每个输入行的每个字段。如果循环变量 `j` 的值小于 3，代码将简单返回\
  \ `for` 语句并处理下一个字段。如果 `j` 不小于 3，则打印当前字段的值。文件 `columns4.txt` 指定为 `awk` 命令的输入。运行 `Listing\
  \ 3.26` 中的代码，你将看到以下输出：\nTWO FOUR three\n\n`Listing 3.31` 显示了 `conditional_fields2.sh`\
  \ 的内容，向你展示了如何在 `awk` 中使用 `while` 循环。\n\n```awk\nawk '{  for ( j=1; j<=NF; j++) {\
  \    if ( j < 3)      continue    printf(\"%s \", $j)  if ( j == NF) {      print\
  \ \"\"  }}' columns4.txt\n```\n\n`Listing 3.31` 包含一个处理每个输入行的每个字段的 `awk` 命令。如果循环变量\
  \ `j` 的值小于 3，代码将简单返回 `for` 语句并处理下一个字段。如果 `j` 不小于 3，则打印当前字段的值。此外，如果 `j` 的值等于 `NF`\
  \ 的值，则打印一个新行。文件 `columns4.txt` 指定为 `awk` 命令的输入。运行 `Listing 3.31` 中的代码，你将看到以下输出：\n\
  TO four THREE sixAbcd\n\n## awk 中的逻辑运算符\n\n逻辑运算符 `&&`、`||` 和 `!` 分别代表 `AND`（与）、`OR`（或）和\
  \ `NOT`（非）。这些运算符用于创建复合表达式，以选择满足一组逻辑标准的行子集。例如，以下代码片段使用 `||` 排除第 2 行和第 3 行：\n\n`awk\
  \ 'NR < 2 || NR > 4' employees.csv`\n3000,Dave Stone,07/15/2022,84.16\n\n以下代码片段使用\
  \ `&&` 仅显示第 2、3 和 4 行：\n\n`awk 'NR > 1 && NR < 5' employees.csv`\n1000,Jane Jones,12/05/2021,93.552000,John\
  \ Smith,03/08/2020,87.23\n\n以下代码片段显示除第 2 行以外的所有行：\n\n`awk 'NR != 1' employees.csv`\n\
  1000,Jane Jones,12/05/2021,93.552000,John Smith,03/08/2020,87.233000,Dave Stone,07/15/2022,84.16\n\
  \n以下代码片段显示所有大于 2 的行（即第 1 行和第 2 行）：\n\n`awk '!(NR > 2)' employees.csv`\n1000,Jane\
  \ Jones,12/05/2021,93.55\n\n### 逻辑运算符与部分匹配\n\n前面的节展示了如何使用逻辑运算符组合简单表达式，本节包含了将逻辑运算符与部分匹配的示例。\n\
  \n例如，以下 `awk` 命令匹配 `employees.csv` 中以字母 J 开头的行：\n\n`awk -F\",\" '{if($2 ~ /J/) print}'\
  \ employees.csv`\n1000,Jane Jones,12/05/2021,93.552000,John Smith,03/08/2020,87.23\n\
  \n以下 `awk` 命令匹配 `employees.csv` 中名称*不*以字母 J 开头的行：\n\n`awk -F\",\" '{if($2 !~ /J/)\
  \ print}' employees.csv`\n\n以下 `awk` 命令匹配 `employees.csv` 中名称以字母 J 结尾的行：\n\n`awk\
  \ -F\",\" '{if($2 ~ /J$/) print}' employees.csv`\n\n以下 `awk` 命令匹配 `employees.csv`\
  \ 中名称同时包含 J 和 h 的行：\n\n`awk -F\",\" '{if($2 ~ /J/ && $2 ~ /h/) print}' employees.csv`\n\
  \n\n\n\n\n```bash\nawk -F\",\" '{if($2 ~ /J/ && (($1 > 1000)|| ($1 == \"3000\")))\
  \ print}' employees.csv\n2000,John Smith,03/08/2020,87.23\n```\n\n以下 `awk` 命令匹配\
  \ `employees.csv` 中名称以 Jane 或 John 开头的行：\n\n```bash\nawk -F\",\" '{if($2 ~ /Jane|John/)\
  \ print}' employees.csv\n1000,Jane Jones,12/05/2021,93.55\n2000,John Smith,03/08/2020,87.23\n\
  ```\n\n此外，你可以使用以下 `awk` 命令显示空行：\n\n```bash\nawk -F\",\" '{if(NF == 0) print}' employees.csv\n\
  ```\n\n通过反转上述 `awk` 命令的逻辑，可以使用以下 `awk` 命令显示非空行：\n\n```bash\nawk -F\",\" '{if(NF\
  \ != 0) print}' employees.csv\nempid,full_name,start_date,expenses\n1000,Jane Jones,12/05/2021,93.55\n\
  2000,John Smith,03/08/2020,87.23\n3000,Dave Stone,07/15/2022,84.16\n```\n\n使用以下\
  \ `awk` 命令移除上述输出中的表头：\n\n```bash\nawk -F\",\" '{if((NF != 0) && (NR > 1)) print}'\
  \ employees.csv\n1000,Jane Jones,12/05/2021,93.55\n2000,John Smith,03/08/2020,87.23\n\
  3000,Dave Stone,07/15/2022,84.16\n```\n\n使用以下 `awk` 命令统计非空数据行的数量：\n\n```bash\nawk\
  \ -F\",\" '{if((NF != 0) && (NR > 1)) count++} END { print count}' employees.csv\n\
  3\n```\n\n## 检查闰年\n\n嵌套条件语句的一个很好的示例是检查闰年。代码列表 3.32 显示了 `dates.txt` 的内容，代码列表 3.33\
  \ 显示了 `leap_years.sh` 的内容，它展示了如何判断一个年份是否为闰年。\n\n### 列表 3.32: dates.txt\n```text\n\
  02/29/2000\n02/29/2002\n03/15/1900\n12/08/1904\n```\n\n### 列表 3.33: leap_year.sh\n\
  ```bash\n#######################################\n# check for leap years\n## given\
  \ a date mm/dd/yyyy\n# if year % 4 == 0:#\n#   if year % 100 == 0:#\n#     if year\
  \ % 400 == 0:#\n#       print date,\"is a leap year\"#\n#     else:#\n#       print\
  \ date,\"is not a leap year\"#\n# else:#\n#   print date,\"is not a leap year\"\
  ######################################\n```\n```bash\ncat dates.txt | awk -F\"/\"\
  \ '{\n  date=$0\n  month=substr($0,1,2)\n  day=substr($0,4,2)\n  year=substr($0,7,4)\n\
  \  print \"month:\",month,\"day:\",day,\"year:\",year\n  if(year % 4 == 0) {\n \
  \   if(year % 100 == 0) {\n      if(year % 400 == 0) {\n        print date,\"is\
  \ a leap year A\"\n      } else {\n        print date,\"is not a leap year B\"\n\
  \        if((day == 29) && (month == 2)) {\n          print date,\"is an invalid\
  \ date ***\"\n        }\n      }\n    } else {\n      print date,\"is not a leap\
  \ year C\"\n      if((day == 29) && (month == 2)) {\n        print date,\"is an\
  \ invalid date ***\"\n      }\n    }\n  } else {\n    print date,\"is not a leap\
  \ year D\"\n    if((day == \"29\") && (month == \"02\")) {\n      print date,\"\
  is an invalid date ***\"\n    }\n  }\n  print \"------------\"\n}'\n```\n列表 3.33\
  \ 包含一个带有伪代码的初始命令，其中指定了如何判断一个正整数是否为闰年。列表 3.33 中的 `awk` 命令包含了该伪代码的实现，并指定 `dates.txt`\
  \ 为输入。注意，有四个 `print` 语句在输出的最后部分包含字母 `A`、`B`、`C` 或 `D` 之一：包含这些是为了展示判断给定年份是否为闰年的逻辑执行路径。运行列表\
