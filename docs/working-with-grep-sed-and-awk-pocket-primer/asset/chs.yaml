  \ -4\nnumber: -4.5 truncated: -4\nnumber: -4.9 truncated: -4\n\n## awk 中的内置字符串函数\n\
  \n`awk` 提供了多种字符串函数，这里列出了一些：`toupper()`, `tolower()`, `substr()`\n\n`toupper()` 和\
  \ `tolower()` 函数分别将字符串转换为大写和小写。`substr()` 函数允许你提取字符串的子串。`split()` 函数允许你将给定字符串拆分为子串并动态填充数组，第\
  \ 6 章包含了使用这些函数的示例。`sub()` 和 `gsub()` 函数允许你对字符串进行搜索和替换，这稍后会讨论。\n\n### 将字符串转换为小写\n\
  \n以下 `awk` 命令使用 `toupper()` 函数将 `employees.csv` 中的所有字母转换为小写：\n\n```bash\nawk '{$0\
  \ = tolower($0); print }' < employees.csv\n```\nempid,full_name,start_date,expenses\n\
