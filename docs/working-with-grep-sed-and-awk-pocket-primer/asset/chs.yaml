  \ {     printf(\"%s \", $i)     if( i % columnCount  == 0) { currRow++; }     if(currRow\
  \ % rowCount == 0) { print \"\"; currRow = 0 } }   '' > temp-columns# 4) 移除输出末尾的''''cat\
  \ temp-columns | sed''s/, $/'' | sed''s/ $/'' > $outputfile\n```\n\nListing 5.18\
  \ 与 Listing 5.15 相似。程序在处理一对“普通”记录后打印一个换行符，这是通过**加粗**的代码实现的。运行 Listing 5.18 中的代码，你将看到以下输出：\n\
