  \ }'\n```\n\nListing 4.3 包含一个 `echo` 命令，它将一个字符串传递给 `awk` 命令，而该命令反过来包含一个 `BEGIN`\
  \ 块，该块用三个数字值初始化数组 `arr`。接下来，主执行块将变量 `sum` 初始化为 `0`，随后是一个循环，遍历数组 `arr` 的每个元素并将每个值加到变量\
  \ `sum` 中。Listing 4.3 的最后一部分包含一个 `END` 块，用于打印变量 `sum` 的值。运行 Listing 4.3 中的代码，你将看到以下输出：\n\
  \nSum of array elements: 60\n\n### 查找数字数组的最大值最小值\n\nListing 4.4 显示了 `max_min_array1.sh`\
  \ 的内容，它向你展示了如何初始化数字数组并计算数组中数字的和。\n\n***Listing 4.4: max_min_array1.sh***\n\n```bash\n\
  echo \"\" | awk 'BEGIN { arr[0] = 10; arr[1] = 20; arr[2] = 30; max=0; min=0}{\n\
  \  min = arr[0]\n  max = arr[0]\n  for (idx=1;idx<length(arr);idx++) {\n    if(max\
  \ < arr[idx]) {\n        max = arr[idx]\n     }\n    if(min > arr[idx]) {\n    \
  \    min = arr[idx]\n     }\n  }}END { print \"Max:\",max,\"min:\",min}'\n```\n\n\
  Listing 4.4 包含一个 `echo` 命令，它将一个字符串传递给 `awk` 命令，而该命令反过来包含一个 `BEGIN` 块，该块用三个数字值初始化数组\
  \ `arr`。该块还初始化了变量 `max` 和 `min` 分别为 `0` 和 `999`。Listing 4.4 的下一部分是主执行块，其中包含一个遍历数组\
  \ `arr` 元素的循环。在每次迭代中，如果当前字段大于 `max`，则更新 `max` 的值。此外，如果当前字段小于 `min`，则更新 `min` 的值。Listing\
  \ 4.4 的最后一部分由一个 `END` 块组成，用于打印 `max` 和 `min` 的值。运行 Listing 4.4 中的代码，你将看到以下输出：\n\n\
  Max:30min:10\n\n### 拼接字符串数组\n\nListing 4.5 显示了 `concat_array1.sh` 的内容，它向你展示了如何初始化字符串数组并拼接数组中的字符串。\n\
