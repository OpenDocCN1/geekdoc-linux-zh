  \n如你所见，本节的任务可以通过 `awk` 命令非常容易地解决。\n\n## 另一个用例\n\n本节中的代码示例向你展示了如何使用 `awk` 命令重新格式化数据集中的日期字段，并更改新数据集中字段的顺序。例如，考虑原始数据集中的以下输入行：\n\
  \n`Jane,Smith,20140805234658`\n\n输出数据集中的重新格式化行格式如下：\n\n`2014-08-05 23:46:58,Jane,Smith`\n\
  \nListing 5.54 显示了文件 `dates2.csv` 的内容，该文件包含“，”分隔符和三个字段。\n\n***Listing 5.54: dates2.csv***\n\
  ```\nJane,Smith,20140805234658Jack,Jones,20170805234652Dave,Stone,20160805234655John,Smith,20130805234646Jean,Davis,20140805234649Thad,Smith,20150805234637Jack,Pruit,20160805234638\n\
  ```\n\nListing 5.55 显示了 `string2date.sh` 的内容，它将日期字段转换为新格式并将日期移动到第一个字段。\n\n***Listing\
  \ 5.55: string2date.sh***\n```bash\ninputfile=\"dates2.csv\"\noutputfile=\"formatted2.csv\"\
  \nrm -f $outputfile; touch $outputfile\nfor line in `cat $inputfile`\ndo\n  fname=`echo\
  \ $line |cut -d\",\" -f1`\n  lname=`echo $line |cut -d\",\" -f2`\n  date1=`echo\
  \ $line |cut -d\",\" -f3`\n  # 转换为新日期\n  newdate=`echo $date1 | awk '{ print substr(0,1,4)\"\
  -\"substr(0,5,2)\"-\"substr(0,7,2)\"\":\"substr(0,9,2)\"\":\"substr(0,13,2)}'`\n\
  \  # 将新格式化的行追加到输出文件\n  echo \"${newdate},${fname},${lname}\" >> $outputfile\ndone\n\
  ```\n\nListing 5.55 使用两个文件名初始化 `inputfile` 和 `outputfile` 变量。接下来的代码段删除这些文件以确保为空。Listing\
  \ 5.55 部分包含一个循环，遍历输入文件中的行，并分别用第一、第二和第三字段的内容初始化 `fname`、`lname` 和 `date1`。接下来的代码通过\
  \ `awk` 语句使用 `substr()` 函数构造变量 `newdate`。Listing 5.55 最后将逗号分隔的 `newdate`、`fname`\
  \ 和 `lname` 值追加到 `outputfile`。运行 Listing 5.55，你将看到以下输出：\n\n```\n2014-08-05 23:46:58,Jane,Smith\n\
  2017-08-05 23:46:52,Jack,Jones\n2016-08-05 23:46:55,Dave,Stone\n2013-08-05 23:46:46,John,Smith\n\
  2014-08-05 23:46:49,Jean,Davis\n2015-08-05 23:46:37,Thad,Smith\n2016-08-05 23:46:38,Jack,Pruit\n\
  ```\n\n## 日期转换\n\nListing 5.56 显示了 `mixed_currency.csv` 的内容，Listing 5.57 显示了 `convert_currency3.sh`\
  \ 的内容，它说明了必要时将，”替换为“.”反之亦然，以便字符串具有有效的美元货币格式。请注意，代码没有检查字符串的无效日期格式。\n\n***Listing\
  \ 5.56: mixed_currency.csv***\n```\nproduct1|129.95\nproduct2|2110,99\nproduct3|2.110,99\n\
  product4|2.110.678,99\nproduct5|1,130.95\n```\n\n***Listing 5.57: convert_currency3.sh***\n\
  ```bash\nfilename=\"mixed_currency.csv\"\necho \"=> INITIAL CONTENTS OF CSV FILE:\"\
  \ncat $filename\necho \"=> UPDATED CONTENTS OF CSV FILE:\"\nawk -F\"|\" 'BEGIN {\
  \ modified=0 }{\n  comma = index($2,\",\")\n  period = index($2,\".\")\n  OLD2=$2\n\
  \  if(comma > 0 && period == 0) {\n    gsub(/,/,\".\",$2)\n    modified += 1\n \
  \   #print \"comma(s) but no period:\", $2\n  }\n  else if( comma > period ) {\n\
  \    # 将最右边的 \",\"替换为 \"Z\"\n    gsub(/,/,\"Z\",$2)\n    # 将 \".\"替换为 \",\"\n  \
  \  gsub(/\\./,\",\",$2)\n    # 将 \"Z\" 替换为 \".\"\n    gsub(/Z/,\".\",$2)\n    modified\
  \ += 1\n    #print \"comma(s) before period:\", $2\n  }\n  NEW2=$2\n  printf(\"\
  OLD: %18s NEW: %15s\\n\",OLD2, NEW2)}\nEND { print \"=> Modified lines:\",modified\
  \ }' < mixed_currency.csv\n```\n\nListing 5.57 从将变量 `filename` 初始化为 `mixed_currency.csv`\
  \ 开始并显示其内容。Listing 5.57 的后续部分是一个 `awk` 脚本，它根据来自 `mixed_currency.csv` 文件的每行输入初始化变量\
  \ `comma` 和 `period` 为逗号（，”）和句号（.”)的索引。与其他编程语言不同，代码中没有显式的循环关键字：相反，它是 `awk` 语言的一个隐含方面（这可能需要时间来适应这种风格）。\n\
  \n\n\n\n你将看到以下输出：\n\n```\n=> INITIAL CONTENTS OF CSV FILE:product1|1129.95product2|2110,99product3|2.110,99product4|2.110.678,99product5|1,130.95\n\
  => UPDATED CONTENTS OF CSV FILE:OLD:             1129.95 NEW:           1129.95\n\
  OLD:              2110,99 NEW:           2110.99\nOLD:             2.110,99 NEW:\
  \          2,110.99\nOLD:       2.110.678,99 NEW:      2,110,678.99\nOLD:      \
  \     1,130.95 NEW:          1,130.95\n=> Modified lines: 3\n```\n\n## 包含 1,000,000\
  \ 行的数据集\n\n本节中的代码示例将向你展示如何使用 `awk` 对包含 1,000,000 行的数据集进行各种比较。\n\n### 数值比较\n\n本节中的代码段说明了如何检查特定数字（例如\
  \ 58）以及每行第一个字段中一个、两个或三个相邻数字出现的情况。\n\nListing 5.58 显示了 `numeric_comparisons.sh` 的内容，它向你展示了如何处理包含\
  \ 1,000,000 行的数据集。\n\n***Listing 5.58: numeric_comparisons.sh***\n\n```bash\nfilename=\"\
  1000000_HRA_Records.csv\"\necho \"first:\"\nawk -F\",\" '{ if($1 > 50) { print $1\
  \ } }' < $filename | wc\necho \"second:\"\nawk -F\",\" '{ if($1 > 50 && $5 > 70)\
  \ { print $4 } }' < $filename | wc\n```\n\nListing 5.58 使用 CSV 文件名初始化变量 `filename`，随后是一个\
  \ `awk` 命令，用于统计第一个字段大于 50 的行数。\n\n第二个和最后一个 `awk` 语句统计第一个字段大于 50 且第五个字段大于 70 的行数。运行\
  \ Listing 5.58 中的代码，你将看到以下输出：\n\n```\nfirst:  232161  232161  696484\nsecond:  232161\
  \  232161  696484\nthird:  232161  232161 1011843\n```\n\n### 统计相邻数字\n\n本节中的代码示例说明了如何检查特定数字（例如\
  \ 58）以及每行第一个字段中一个、两个或三个相邻数字出现的情况。\n\n***Listing 5.59: adjacent_digits.sh***\n\n\
  ```bash\nfilename=\"1000000_HRA_Records.csv\"\necho \"first:\"\nawk -F\",\" '{ if($1\
  \ ~ /58/) { print $1} }' < $filename | wc\necho \"second:\"\nawk -F\",\" '{ if($1\
  \ ~ /[0-9]/) { print $1} }' < $filename | wc\necho \"third:\"\nawk -F\",\" '{ if($1\
  \ ~ /[0-9][0-9]/) { print $1} }' < $filename | wc\necho \"fourth:\"\nawk -F\",\"\
  \ '{ if($1 ~ /[0-9][0-9][0-9]/) { print $1} }' < $filename | wc\n```\n\nListing\
  \ 5.59 使用 CSV 文件名初始化变量 `filename`，随后是三个 `awk` 命令。第一个 `awk` 命令统计第一个字段包含字符串 \"58\"\
  \ 的行数。第二个 `awk` 命令统计第一个字段包含数字的行数，第三个 `awk` 命令统计第一个字段包含三个连续数字的行数。运行 Listing 5.59\
  \ {\n    total += $4\n    num_records += 1\n}\nEND {\n    avg_rate = total/num_records\n\
  \    print \"Number of Records: \", num_records\n    print \"Average Support:\"\
  , avg_rate\n}' $filename\n```\n\nListing 5.60 使用 CSV 文件名初始化变量 `filename`，随后是一个 `awk`\
  \ 语句，用于计算第一个字段大于 40 且第五个字段等于 \"Support\" 的行的总和。Listing 5.60 的最后部分计算了 `avg_rate`，即总和除以行数。接着显示\
  \ `avg_rate` 和 `num_records`。运行 Listing 5.60 中的代码，你将看到：\n\n```\nNumber of Records:\
  \ 7482\nAverage Support: 79.935\n```\n\n## 什么是递归？\n\n基于递归的算法可以为通过迭代算法难以实现的任务提供优雅的解决方案。对于某些任务（例如计算阶乘），递归解决方案和迭代解决方案的复杂度相当。作为一个简单的示例，假设我们要相加\
  \ 1 到 `n`（包含 n）的整数，并令 `n = 10`。我们将 `S` 定义为连续整数的和，那么有：\n\n```\nS = 1\nS = S + 2\n\
  ...S = S + 10\n```\n\n我们将 `S(n)` 定义为前 `n` 个整数的和，那么有：\n\n```\nS(1) = 1\nS(n) = S(n-1)\
  \ + n for n > 1\n```\n\n下一节包含使用迭代方法和递归计算前 `n` 个整数和的代码示例。\n\n## 等差数列\n\n本节介绍了如何计算一组整数的和，例如从\
  \ 1 到 `n`。第一个算法使用迭代方法，第二个算法使用递归。\n\n在深入研究代码示例之前，有一种简单的方法可以计算 1 到 `n`（包含）的封闭和，我们将其标记为\
  \ `S`。如下：\n\n```\nS = 1 + 2 + 3 + ... + (n-1) + n\nS = n + (n-1) + (n-2) + ... +\
  \ 2 + 1\n```\n\n上述等式的右侧有 `n` 列，每一列都等于 `n+1`。因此，右侧的和为 `n*(n+1)`。由于左侧的和为 `2*S`，我们得到了以下结果：\n\
  \n```\n2*S = n*(n+1)\n```\n\n现在将两边同除以 2，我们就得到了前 `n` 个整数等差数列的和公式：\n\n```\nS = n*(n+1)/2\n\
  ```\n\n顺带一提，上述公式是由一个厌倦手动计算的小学生推导出来的：那个学生是高斯（当时上上三年级）。\n\n### 计算等差数列（迭代法）\n\nListing\
  \ 5.61 显示了 `arith_sum.sh` 的内容，说明了如何使用迭代方法计算从 1 到 `n`（包含）的的和。\n\n***Listing 5.61:\
  \ arith_sum.sh***\n\n```bash\necho \"\" |awk 'function arith_sum(num){\n  sum =\
  \ 0\n  for(i=1; i<=num; i++) {\n    sum += i\n  }\n  return sum\n}\nBEGIN {\n  max\
  \ = 20\n  for(j=1; j<=max; j++) {\n    sum = arith_sum(j)\n    print \"Sum from\
  \ 1 to\",j,\" = \",sum\n  }\n}'\n```\n\nListing 5.61 以函数 `arith_sum()` 开始，该函数包含一个迭代相加\
  \ 1 到 `n` 数字的循环。Listing 5.61 的下一部分也包含一个遍历 2 到 20（包含）数字的循环，然后用循环变量的每个值调用 `arith_sum()`\
  \ 来计算 1 到该值的和。运行 Listing 5.61 中的代码，你将看到以下输出：\n\n```\nsum from 1 to 2 = 3\nsum from\
  \ 1 to 3 = 6\nsum from 1 to 4 = 10\nsum from 1 to 5 = 15\nsum from 1 to 6 = 21\n\
  sum from 1 to 7 = 28\nsum from 1 to 8 = 36\nsum from 1 to 9 = 45\nsum from 1 to\
  \ 10 = 55\nsum from 1 to 11 = 66\nsum from 1 to 12 = 78\nsum from 1 to 13 = 91\n\
  sum from 1 to 14 = 105\nsum from 1 to 15 = 120\nsum from 1 to 16 = 136\nsum from\
  \ 1 to 17 = 153\nsum from 1 to 18 = 171\nsum from 1 to 19 = 190\nsum from 1 to 20\
  \ = 210\n```\n\n修改 Listing 5.62 中的代码，计算 1 到 `n` 数字的平方、立方和四方的和，以及你自己的代码变体。\n\n###\
  \ 计算等差数列（递归法）\n\n\n\n\n\nListing 5.63 显示了 `arith_sum_recursive.sh` 的内容，它展示了如何使用递归计算从\
  \ 1 到 `n`（包含 n）的数字之和。\n\nListing 5.63: arith_sum_recursive.sh\n\n```bash\necho \"\
  \" |awk 'function arith_sum(num){\n  if(num == 0) return num\n  else {\n    return\
  \ num + arith_sum(num-1)\n  }\n  for(i=1; i<=num; i++) {\n      sum += i\n  }}BEGIN\
  \ {\n  max = 20\n  for(j=1; j<=max; j++) {\n      sum = arith_sum(j)\n      print\
  \ \"Sum from 1 to\",j,\" = \",sum\n  }}\n```\n\nListing 5.63 从递归函数 `arith_sum()`\
  \ 开始，该函数使用条件逻辑在 `n` 等于值 0（终止情况）时返回 `n`；否则，代码返回 `n` 的值加上 `arith_sum(n-1)` 的值。运行 Listing\
  \ 5.63 中的代码，你将看到与上一节相同的输出。\n\n### 计算部分等差数列\n\nListing 5.64 显示了 `arith_partial_sum.sh`\
  \ 的内容，展示了如何使用迭代方法计算从 `m` 到 `n`（包含边界）的数字之和，其中 `m` 和 `n` 是两个满足 `m <= n` 的正整数。\n\n\
  Listing 5.64: arith_partial_sum.sh\n\n```bash\necho \"\" |awk 'function arith_sum(m,n){\n\
  \  if(m > n) return 0\n  else {\n    return n*(n+1)/2 - m*(m+1)/2\n  }}BEGIN {\n\
  \  max = 10\n  for(i=1; i<max; i++) {\n      for(j=i+1; j<=max; j++) {\n       \
  \   sum = arith_sum(i,j)\n          print \"Arithmetic sum from\",i,\"to\",j,\"\
  \ = \",sum\n      }\n  }}\n```\n\nListing 5.64 逻辑非常直观：函数 `arith_partial_sum()` 返回从\
  \ 1 到 `n` 的平方和减去从 1 到 `m` 的平方和。该函数在 Listing 5.64 的第二部分于循环中被调用，计算了从 2 到 20 的平方和差。运行\
  \ Listing 5.64 中的代码，你将看到以下输出：\n\narithmetic sum from 2 to 2 = 2\nArithmetic sum\
  \ from 1 to 2  =  2\nArithmetic sum from 1 to 3  =  5\nArithmetic sum from 1 to\
  \ 4  =  9\nArithmetic sum from 1 to 5  =  14\nArithmetic sum from 1 to 6  =  20\n\
  // details omitted for brevity\nArithmetic sum from 7 to 9  =  17\nArithmetic sum\
  \ from 7 to 10  =  27\nArithmetic sum from 8 to 9  =  9\nArithmetic sum from 8 to\
  \ 10  =  19\nArithmetic sum from 9 to 10  =  10\n\n现在你已经看到了一些涉及算术表达式示例，让我们转向等比数列，这是下一节的主题。\n\
  \n## 等比数列\n\n本节将向你展示如何计算一组正整数的等比数列，例如从 1 到 `n`（包含）数字。第一个算法使用迭代方法，第二个算法使用递归。\n\n\
  在深入研究代码示例之前，有一种简单的方法可以计算从 1 到 `n`（包含）整数等比数列的闭式和，其中 `r` 是等比数列相邻项之间的比率。令 `S` 表示和，我们可以将其表示为：\n\
  \n`S = 1+ r + r² + r³ + . . . + r^(n-1) + r^nr`\n`r*S = r + r² + r³ + . . . + r^(n-1)\
  \ + r^n + r^(n+1)`\n\n现在将第二行的每一项减去第一行对应的项，我们得到如下结果：\n\n`S - r*S = 1 - r^(n+1)`\n\
  \n从上述方程左侧的两项中提取 `S`，我们得到结果：\n\n`S*(1 - r) = 1 - r^(n+1)`\n\n将上述方程的两边除以项 `(1-r)`，即可前\
  \ `n` 个整数等比数列和的公式：\n\n`S = [1 - r^(n+1)]/(1-r)`\n\n如果 `r = 1`，则上述方程返回无穷值，这是合理的，因为\
  \ `S` 是数字 1 无限次出现的和。\n\n### 计算等比数列（迭代法）\n\nListing 5.65 显示了 `geom_sum.sh` 的内容，展示了如何使用迭代方法计算从\
  \ 1 到 `n` 的数字之和。\n\nListing 5.65: geom_sum.sh\n\n```bash\necho \"\" |awk 'function\
  \ geom_sum(num, ratio){\n  partial = 0\n  power = 1\n  for(i=1; i<=num; i++) {\n\
  \    partial += power\n    power *= ratio\n  }\n  return partial}BEGIN {\n  max\
  \ = 10\n  ratio = 2\n  for(j=2; j<=max; j++) {\n      prod = geom_sum(j, ratio)\n\
  \      print \"Geometric sum for ratio\",ratio,\"from 1 to\",j, \" \",prod\n  }}\n\
  ```\n\nListing 5.65 从函数 `geom_sum()` 开始，该函数包含一个循环计算从 1 到 `n` 的幂的和，其中幂是变量 `ratio`\
  \ 的值。Listing 5.65 的第二部分包含一个循环，以 `2, 3, ..., n` 的值和固定值 `ratio=2` 调用函数 `geom_sum()`。运行\
  \ Listing 5.65 中的代码，你将看到：\n\ngeometric sum for ratio=2 from 1 to 2 = 3\ngeometric\
  \ sum for ratio=2 from 1 to 3 = 7\ngeometric sum for ratio=2 from 1 to 4 = 15\n\
  geometric sum for ratio=2 from 1 to 5 = 31\ngeometric sum for ratio=2 from 1 to\
  \ 6 = 63\ngeometric sum for ratio=2 from 1 to 7 = 127\ngeometric sum for ratio=2\
  \ from 1 to 8 = 255\ngeometric sum for ratio=2 from 1 to 9 = 511\ngeometric sum\
  \ for ratio=2 from 1 to 10 = 1023\n\n### 计算等比数列（递归法）\n\nListing 5.66 显示了 `geom_sum_recursive.sh`\
  \ 的内容，展示了如何使用递归计算从 1 到 `n`（包含）的等比数列。注意以下代码示例使用了“尾递归”。\n\nListing 5.66: geom_sum_recursive.sh\n\
  \n```bash\necho \"\" |awk 'function geom_sum(num, ratio, term, sum){\n  if(num ==\
  \ 1) {\n    return sum\n  } else {\n    term *= ratio\n    sum += term\n    return\
  \ geom_sum(num-1,ratio,sum)\n  }}BEGIN {\n  max = 10\n  ratio = 2\n  sum = 1\n \
  \ term = 1\n  for(j=2; j<=max; j++) {\n      prod = geom_sum(j, ratio, term, sum)\n\
  \      print \"Geometric sum for ratio\",ratio,\"from 1 to\",j, \" \",prod\n  }}\n\
  ```\n\nListing 5.66 包含函数 `geom_sum()`，它接受四个参数：`n`（范围的当前值）、`ratio`（此示例中的指数 2）、`term`（和的当前项）以及\
  \ `sum`（目标和）。\n\n你可以看到，当 `n` 等于 1 时，代码返回值 1；否则更新 `term` 和 `sum` 的值，并调用函数 `geom_sum()`，唯一的区别是将\
  \ `n` 减 1。\n\n此代码示例演示了尾递归，它比普通递归更高效，可能也更直观。Listing 5.66 的第二部分包含一个循环，在从 2 到 `max`（包含）迭代时调用函数\
  \ `geom_sum()`。运行 Listing 5.66 中的代码，你将看到与上一节相同的输出。\n\n## 阶值\n\nListing 5.67 显示了\
  \ `factorial.sh` 的内容，用于计算一组阶值。\n\nListing 5.67: factorial.sh\n\n```bash\nawk 'function\
  \ factorial(n) {return (n > 1 ? n * factorial(n-1) : n)}BEGIN {\n  for(x=2; x<15;\
  \ x++) {\n      result = factorial(x);\n      print \"factorial\",x =\"result\n\
  \  }}\n```\n\nListing 5.67 从一个 `awk` 命令开始，定义递归函数 `factorial()` 来计算其整数输入参数的阶值。Listing\
  \ 5.67 的后续部分是一个 `BEGIN` 块，包含一个 `for` 循环，遍历 2 到 14（包含）的值。在每次迭代中，用循环参数调用 `factorial`\
  \ 函数并显示结果。运行 Listing 5.67 中的代码，你将看到以下输出：\n\nfactorial 2  = 2\nfactorial 3  = 6\n\
  factorial 4  = 24\nfactorial 5  = 120\nfactorial 6  = 720\nfactorial 7  = 5040\n\
  factorial 8  = 40320\nfactorial 9  = 362880\nfactorial 10  = 3628800\nfactorial\
  \ 11  = 39916800\nfactorial 12  = 479001600\nfactorial 13  = 6227020800\nfactorial\
  \ 14  = 87178291200\n\n\n\n\n\nListing 5.68 显示了 `fibonacci.sh` 的内容，用于计算一组斐波那契数。\n\
  \n**Listing 5.68: fibonacci.sh**\n\n```awk\nawk 'function fibonacci(n) {return (n\
  \ > 1 ? fibonacci(n-1) + fibonacci(n-2) : n)}BEGIN {  for(x=2; x<15; x++) {    \
