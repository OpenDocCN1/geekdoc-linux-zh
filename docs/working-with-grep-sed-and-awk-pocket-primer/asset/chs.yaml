  ```\n\n## 处理文件中的重复行\n\n针对文本文件中的重复行，你可以执行几种操作：你可以显示重复行，也可以删除重复行，这两者将在接下来的小节中讨论。\n\
  \n## 显示重复行\n\n前面的示例向你展示了如何找到唯一行，本节中 Listing 4.37 中的代码示例向你展示了如何找到重复行。\n\n### 列表 4.37:\
  \ find-duplicates.sh\n```bash\nfilename1=\"duplicates.csv\"sorted=\"sorted.csv\"\
  unique=\"unique.csv\"multiple=\"multiple.csv\"\n# sorted rows:cat $filename1 | sort\
  \ > $sorted\n# unique rows:cat $sorted | uniq > $unique\n# duplicate rows:diff $sorted\
  \ $unique | sed -e '1,3d' -e 's/^ //' -e 's/-//' > $multiple\n```\n\nListing 4.37\
  \ 通过初始化几个包含 CSV 数据的变量开始。[Listing 4.37]的剩余部分由两个 `cat` 命令语句和一个 `diff` 命令语句（连带 `sed`）组成，用于填充以下\
  \ CSV 文件：`sorted.csv`、`unique.csv`, `multiple.csv`。第一个 `cat` 命令将 `duplicates.csv`\
  \ 的内容传递给 `sort` 命令，后者填充 CSV 文件 `sorted.csv`，其中包含 `duplicates.csv` 的排序行。此外，`sorted.csv`\
  \ 中的重复行（如果有）将作为连续行出现在 `sorted.csv` 中。第二个 `cat` 命令将 `sorted.csv` 的内容传递给 `uniq` 命令，后者填充来自\
  \ `sorted.csv` 的 `unique.csv`，使得 `unique.csv` 文件中的行是唯一的。最后，`diff` 命令突出了 `sorted.csv`\
  \ 和 `unique.csv` 内容之间的差异。`diff` 命令的输出是 `sed` 命令的输入，它删除前三行、移除领先空格并移除任何连字符（-）。此外，`diff`\
  \ 命令的输出被重定向到 `sed` 命令，执行了三件事：\n\n* 删除前三行\n* 移除一个初始空格\n* 删除一个初始 -\n\n在 `sed` 命令完成后，输出被重定向到包含重复行的\
  \ `multiple` 文件。运行 Listing 4.37 中的代码，然后检查 `multiple.csv` 的内容：\n\n```text\nFemale,16,150,0Female,16,150,0Female,17,170,0Female,17,170,0Male,15,180,0Male,15,180,0Male,19,160,0Male,19,160,0Male,19,190,0Male,19,190,0\n\
  ```\n\n### 删除重复行\n\n数据去重是指移除行级重复值的任务。Listing 4.38 显示了 `duplicates.csv` 的内容，Listing\
  \ 4.39 显示了 `duplicates.sh` 的内容，它删除重复行并创建包含唯一行的 CSV 文件 `no_duplicates.csv`。\n\n###\
  \ 列表 4.38: duplicates.csv\n```csv\nMale,19,190,0Male,19,190,0Male,15,180,0Male,15,180,0Female,16,150,0Female,16,150,0Female,17,170,0Female,17,170,0Male,19,160,0Male,19,160,0\n\
  ```\n\n### 列表 4.39: remove-duplicates.sh\n```bash\nfilename1=\"duplicates.csv\"\
  filename2=\"no_duplicates.csv\"cat $filename1 | sort | uniq > $filename2\n```\n\n\
  Listing 4.39 非常直观：在分别用 `filename1` 和 `filename2` 初始化输入和输出文件名后，剩余的代码片段包含带有一系列命令的\
  \ Unix 管道 (|) 。\n\n最左侧的命令显示输入文件的内容，将其重定向到 `sort` 命令以对输入行进行排序。`sort` 命令的结果重定向到 `uniq`\
  \ 命令，该命令移除重复行，并将结果集重定向到变量 `filename2` 指定的文件。\n\n请记住，需要 `sort` 后接 `uniq` 命令：这就是 `uniq`\
  \ 命令移除相邻重复行的方法。运行 Listing 4.39 中的代码，你将看到在 Listing 4.40 中显示的输出。\n\n### 列表 4.40: no_duplicates.csv\n\
  ```text\nMale,19,190,0Female,16,150,0Female,17,170,0Male,15,180,0Male,19,160,0Male,19,190,0Male,19,190,0\n\
  ```\n\n## 数据值的统一性\n\n数据统一性的示例涉及验证给定特征中的数据是否包含相同的单位。例如，以下组值的数值虽然在一个很窄的范围内，但单位是错误的：\n\
