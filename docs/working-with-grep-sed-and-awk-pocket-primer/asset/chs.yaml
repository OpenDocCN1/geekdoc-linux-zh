  \ 命令，它将一个字符串传递给 `awk` 命令，而该命令反过来包含一个 `BEGIN` 块来初始化数组 `arr`。主执行块将变量 `concat` 初始化为空字符串，随后是一个遍历数组\
  \ `arr` 元素的循环，将每个值加到变量 `concat` 中。Listing 4.5 的最后部分使用 `print` 语句来打印拼接后的元素。运行 Listing\
  \ 4.5 中的代码，你将看到以下输出：\n\nConcatenated elements:abcdefghi\n\n\n\n\n\n### `patsplit()`\
  \ 函数\n\n`split()` 函数涉及一个分隔符，而 `patsplit()` 函数则匹配分隔符之间的模式。下面的示例涉及 `split()` 函数：\n\
  \n```bash\n$ echo 'spicy,food' | awk '{n = split($0,a,/,/); for(i=1;i<=n;i++) print\
  \ a[i]}'spicyfood\n```\n\n相比之下，接下来的 awk 命令包含了 `patsplit()` 函数：\n\n```bash\n$ echo\
  \ 'spicy,food' | awk '{n = patsplit($0,a,/[^,]*/); for(i=1;i<=n;i++) print a[i]}'spicyfood\n\
  ```\n\n## 多维数组\n\nListing 4.7 显示了 `multi_dim_array1.sh` 的内容，该文件向你展示了如何初始化多维数组并显示其内容。\n\
