  \ 计算的。在 Listing 3.48 中运行代码，你将看到以下输出：\n\nnumber: 3.12 truncated: 3\nnumber: 3.5 truncated:\
  \ 3\nnumber: 3.9 truncated: 3\nnumber: -4.3 truncated: -4\nnumber: -4.5 truncated:\
  \ -4\nnumber: -4.9 truncated: -4\n\n## awk 中的数值函数\n\n`int(x)` 函数返回数字的整数部分。如果该数字不是整数，它将介于两个整数之间。在这两个整数中，该函数将返回靠近\
  \ 0 的那个。这与舍入函数不同，舍入函数会选择更接近的整数。\n\n例如，`int(3)` 为 3，`int(3.9)` 为 3，`int(-3.9)` 为\
  \ -3，`int(-3)` 也是 -3。这里是 `awk` 命令中使用 `int(x)` 函数的示例：\n\n```awk\nawk 'BEGIN {  print\
  \ int(3.534);  print int(4);  print int(-5.223);  print int(-5);}'\n```\n\n输出如下：\n\
  \n```\n3\n4\n-5\n-5\n```\n\n`exp(x)` 函数给出 `x` 的指数，如果 `x` 超出范围则报告错误。`x` 的取值范围取决于你机器的浮点表示法。\n\
  \n```awk\nawk 'BEGIN{  print exp(123434346);  print exp(0);  print exp(-12);}'\n\
  ```\n\n输出如下：\n\n```\ninf\n1\n6.14421e-06\n```\n\n`log(x)` 函数在 `x` 为正数时给出 `x` 的自然对数；否则它报告错误（输出中的\
  \ `inf` 表示无穷，`nan` 表示“非数字”）。\n\n```awk\nawk 'BEGIN{  print log(12);  print log(0);\
  \  print log(1);  print log(-1);}'\n```\n\n输出如下：\n\n```\n2.48491\n-inf\n0\nnan\n\
  ```\n\n`sin(x)` 函数给出 `x` 的正弦，`cos(x)`  `x` 的余弦，其中 `x` 的单位为弧度：\n\n```awk\nawk 'BEGIN\
  \ {  print cos(90);  print cos(45);}'\n```\n\n输出如下：\n\n```\n-0.448074\n0.525322\n\
  ```\n\n`rand()` 函数给出随机数。`rand()` 的值在 0 到 1 之间均匀分布：该值永远不会是 0 也永远不是 1。\n\n通常，你想要随机整数。这里有一个自定义函数，可以获取小于\
  \ `n` 的随机非负整数：\n\n```awk\nfunction randint(n) {      return int(n * rand())}\n```\n\
  \n乘积产生一个大于 0 且小于 `n` 的随机实数。然后我们将其转换为 0 到 `n - 1` 之间的整数（使用 `int`）。\n\n这里是一个使用类似函数产生\
  \ 1 到 `n` 之间随机整数的示例：\n\n```awk\nawk '# 模拟掷骰子的函数。function roll(n) { return 1 + int(rand()\
  \ * n) }# 掷 3 个六面骰子并打印总点数。{      printf(\"%d points\\n\", roll(6)+roll(6)+roll(6))}'\n\
  ```\n\n请注意，`rand()` 在每次调用 `awk` 时都会从同一个起点（或称为“种子”）开始生成数字。因此，程序在每次启动时都会产生相同的结果。如果你希望程序在每次使用时都执行不同的操作，你必须将种子更改为每次运行都不同的不同的值。\n\
  \n使用 `srand(x)` 函数将生成随机数的起始点（即种子）设置为值 `x`。每个种子值都会导致一个特定的“随机”数序列。因此，如果你第二次将种子设为相同的值，你将再次获得相同的“随机”数序列。如果省略了参数\
  \ `x`（如 `srand()` 所示），则使用当前的日期和时间作为种子。\n\n这就是获取不可预测随机数的方法。`srand()` 的返回值是上一个种子。这便于跟踪种子，以便一致地重现随机数序列。\n\
  \n`time()` 函数（并非所有 `awk` 版本都包含）返回自 1970 年 1 月 1 日以来的秒数。`ctime` 函数（并非所有 `awk` 版本都包含）接受秒单位的数值参数，并返回表示对应日期的字符串，适用于打印或进一步处理。\n\
  \n`sqrt(x)` 函数给出 `x` 的正平方根。如果 `x` 为负，则会报告错误。因此，`sqrt(4)` 为 2。\n\n```awk\nawk 'BEGIN{\
