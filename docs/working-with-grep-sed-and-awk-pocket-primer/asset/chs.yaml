  \n## awk 中的逻辑运算符\n\n`awk` 命令提供了逻辑运算符或（OR）、与（AND）和非（NOT），分别用 `||`、`&&` 和 `!` 表示。此外，你可以组合这些逻辑运算符来定义复杂的布尔表达式。以下示例使用了逻辑与运算符：\n\
  \n```\nawk '$3 > 10 && $4 < 20 {print $1, $2}' datapoint.txt\n```\n\n以下示例使用了逻辑或运算符：\n\
  \n```\nawk '$3 > 10 || $4 < 20 {print $1, $2}' datapoint.txt\n```\n\nListing 5.50\
  \ 显示了文本文件 `datapoints2.txt` 的内容。\n\n***Listing 5.50: datapoints2.txt***\n\n```\n\
  item1,4,6,1000\nitem2,5,5,8000\nitem3,4,6,4000\nitem4,7,9,7000\nitem5,8,8,9000\n\
  ```\n\nListing 5.51 显示了 `duplicate-fields2.sh` 的内容，它展示了如何打印第二字段和第三字段相同*且*第一个字段等于给定标记的行。\n\
  \n***Listing 5.51: duplicate-fields2.sh***\n\n```\nawk -F ',' '{  if($2 == $3) &&\
  \ ($4 == 9000)) {    print \"Duplicate fields in row matching\", $4\":\",$0  }}\
  \ datapoints2.txt\n```\n\n\n\n\n\nListing 5.51 与 Listing 5.49 几乎相同：区别在于条件块包含复合逻辑，用于显示\
  \ `$2` 和 `$3` 相等*且* `$4` 的值为 9000 的输入行。运行位于 Listing 5.51 中的代码，你将看到以下输出：\n\nDuplicate\
  \ fields in row matching 9000: item5,8,8,9000\n\n## 一个简单的用用例\n\n本节中的代码示例向你展示了如何使用\
  \ `awk` 命令来拆分数据集中行中逗号分隔的字段，其中字段可能包含任意深度的嵌套引号。\n\nListing 5.52 显示了文件 `quotes3.csv`\
  \ 的内容，该文件包含“，”分隔符和多个带引号的字段。\n\n***Listing 5.52: quotes3.csv***\n```\nfield5,field4,field3,\"\
  field2,foo,bar\",field1,field6,field7,    \"fieldZ\"fname1,\"fname2,other,stuff\"\
  ,fname3,\"fname4,foo,bar\",fname5\"lname1,a,b\",\"lname2,c,d\",\"lname3,e,f\",\"\
