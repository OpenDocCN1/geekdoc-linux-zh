  \ `i` 从 0 变化到 `len`（包含边界）。在每次迭代中，变量 `TH` 前面加上 `$0` 中 `len-i+1` 位置的字符，所示：`TH=substr($0,len-i+1,1)`。如果循环变量\
  \ `i` 在 0 和 `len` 之间（不包含边界）且是三的倍数，则在 `TH` 前面加上逗号 `,`。注意循环是从右向左处理输入字符串 `$0` 中的字符的，这正是逗号正确插入到正整数中的方式。最后的代码片段打印了输入字符串\
