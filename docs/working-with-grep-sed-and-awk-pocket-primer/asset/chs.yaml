  Listing 5.68 以一个 `awk` 命令开始，该命令定义了递归函数 `fibonacci()`，用于计算其整数输入参数的斐波那契数。Listing 5.68\
  \ 的后续部分是一个 `BEGIN` 块，其中包含一个遍历 2 到 14（包含边界）值的循环。在每次迭代中，都会使用循环参数调用 `fibonacci` 函数并显示结果。运行\
  \ Listing 5.68 中的代码，你将看到以下输出：\n\nFibonacci 2 = 2\nFibonacci 3 = 3\nFibonacci 4 =\
  \ 5\nFibonacci 5 = 8\nFibonacci 6 = 13\nFibonacci 7 = 21\nFibonacci 8 = 34\nFibonacci\
  \ 9 = 55\nFibonacci 10 = 89\nFibonacci 11 = 144\nFibonacci 12 = 233\nFibonacci 13\
  \ = 377\nFibonacci 14 = 610\n\n## 欧几里得算法 (GCD)\n\n欧几里得算法让你能够找到两个正整数的最大公约数（GCD）。Listing\
  \ 5.69 显示了 `gcd1.sh` 的内容，计算两个正整数的 GCD。\n\n**Listing 5.69: gcd1.sh**\n\n```awk\n\
  echo \"\" | awk 'function gcd(num1, num2) {  if(num1 % num2 == 0) {    return num2\
  \  } else if (num1 < num2) {    #print \"Switching\",num1,\"and\",num2     return\
  \ gcd(num2, num1)  } else {    #print \"Reducing\",num1,\"and\",num2    return gcd(num1-num2,\
  \ num2)  }}BEGIN {  arr1[0] = 24; arr1[1] = 36; arr1[2] = 50; arr1[3] = 100;  arr2[0]\
  \ = 10; arr2[1] = 18; arr2[2] = 11; arr2[3] = 64;}{  for(i=0; i<length(arr1); i++)\
  \ {    num1 = arr1[i]    num2 = arr2[i]    result = gcd(num1,num2)    print \"The\
  \ GCD of\",num1,\"and\",num2,\"=\",result  }}'\n```\n\nListing 5.69 以一个 `awk` 命令开始，定义了函数\
  \ `gcd()`，计算其两个整数输入参数的 GCD。该函数实现了欧几里得算法，通过交换参数顺序来确保第一个参数大于或等于第二个参数。当第二个参数等于 0 时，第一个参数即为\
  \ GCD，并返回其值。Listing 5.69 的下一段代码块是一个 `BEGIN` 块，它用一组整数值初始化数组 `arr1` 和 `arr2`（两个数组的长度相同）。\n\
  \nListing 5.69 的后续部分是主执行块，其中包含一个遍历 `arr1` 数组元素的循环。在每次迭代中，分别使用 `arr1` 的当前值和 `arr2`\
  \ 中的对应值来初始化变量 `num1` 和 `num2` 的值。接下来的代码片段通过使用参数 `num1` 和 `num2` 调用函数 `gcd()` 的返回值来初始化变量\
  \ `result`。运行 Listing 5.69 中的代码，你将看到以下输出：\n\nThe GCD of 24 and 10 = 2\nThe GCD of\
  \ 36 and 18 = 18\nThe GCD of 50 and 11 = 1\nThe GCD of 100 and 64 = 4\n\n## 正整数的最小公倍数\n\
  \nListing 5.70 显示了 `lcm1.sh` 的内容，用于确定一对正整数的最小公倍数。\n\n**Listing 5.70: lcm1.sh**\n\
  \n```awk\necho \"\" | awk 'function gcd(num1, num2) {  if(num1 % num2 == 0) {  \
  \  return num2  } else if (num1 < num2) {    #print \"Switching\",num1,\"and\",num2\
  \     return gcd(num2, num1)  } else {    #print \"Reducing\",num1,\"and\",num2\
  \    return gcd(num1-num2, num2)  }}BEGIN {  arr1[0] = 24; arr1[1] = 36; arr1[2]\
  \ = 50; arr1[3] = 100;  arr2[0] = 10; arr2[1] = 18; arr2[2] = 11; arr2[3] = 64;}{\
  \  for(i=0; i<length(arr1); i++) {    num1 = arr1[i]    num2 = arr2[i]    result\
  \ = gcd(num1,num2)    print \"The GCD of\",num1,\"and\",num2,\"=\",result  }}```\n\
  \nListing 5.70 以 `gcd()` 函数的定义开始（该函数在 Listing 5.69 中所示），随后是 Listing 5.69 中的 `BEGIN`\
  \ 块。Listing 5.70 的后续部分是主执行块，其中包含一个遍历 `arr1` 数组元素的循环。在每次迭代中，使用 `arr1` 的当前值和 `arr2`\
  \ 中的对应值分别初始化变量 `num1` 和 `num2` 的值。接下来的代码片段通过使用参数 `num1` 和 `num2` 调用函数 `gcd()` 的返回值来初始化变量\
  \ `lcm`。运行 Listing 5.70 中的代码，你将看到以下输出：\n\nThe LCM of 24 and 10 = 120\nThe LCM of\
  \ 36 and 18 = 36\nThe LCM of 50 and 11 = 550\nThe LCM of 100 and 64 = 400\n\n##\
  \ 合数与质数\n\nListing 5.71 显示了 `prime1.sh` 的内容，判断一个整数是合数还是质。\n\n**Listing 5.71: prime1.sh**\n\
  \n```awk\necho \"\" | awk 'function divisors(num) {  for(i=2; i<=num/2; i++ )  \
  \  if(num % i == 0) {    print \"divisor:\",i     return 1  }  }  return 0;}BEGIN\
  \ { max = 20; }{for(x=3; x<max; x++) {    result = divisors(x);    if(result ==\
  \ 0) {    print x,\"is prime\"  } else {    print x,\"is not prime\"  }  }}'\n```\n\
  \nListing 5.71 定义函数包含一个从 2 到 `num/2` 的循环。在每次迭代中，条件语句检查 `num` 是否被循环变量 `i` 整除；如果是，则\
  \ `num` 是合数并返回 1。如果循环完成未返回，则 `num` 是质数，并返回 0。Listing 5.71 包含一个 `BEGIN` 块，将变量 `max`\
  \ 初始化为 20，随后是一个遍历 3 到 `max-1`（包含边界）值的主执行块。在每次迭代中，调用 `divisors()` 函数处理循环变量 `x`。代码的最后包含一个条件块，根据变量\
  \ `x` 是否为质数来打印相应信息。运行 Listing 5.71 中的代码，你将看到以下输出：\n\n3 is prime\n4 is not prime\n\
  5 is prime\n6 is not prime\n7 is prime\n8 is not prime\n9 is not prime\n10 is not\
  \ prime\n11 is prime\n12 is not prime\n13 is prime\n14 is not prime\n15 is not prime\n\
  16 is not prime\n17 is prime\n18 is not prime\n19 is prime\n\n## 正整数的质因数\n\nListing\
  \ 5.72 显示了 `prime_factors1.sh` 的内容，确定一个正整数的质因数。\n\n**Listing 5.72: prime_factors1.sh**\n\
  \n```awk\necho \"\" | awk 'function divisors(num) {  factors = \"\"; div = 2  while(num\
  \ > 1) {    if(num % div == 0) {    factors = factors \" \" div    num /= div  }\
  \ else {    div += 1  }  }  return factors;}  BEGIN { arr[0] = 24; arr[1] = 7; arr[2]\
  \ = 96 }{  for(i=0; i<length(arr); i++) {    num = arr[i]    result = divisors(num)\
  \    print \"Factors of\",num,\":\",result  }}'\n```\n\n\n\n\n\nListing 5.72 从函数\
  \ `prime_factors()` 开始，该函数将变量 `factors` 和 `div` 分别初始化为 `\"\"` 和 `2`。该函数的后续部分包含一个\
  \ `while()` 循环，只要输入参数 `num` 大于 1 就会执行。在每次迭代中，条件代码块会检查 `num` 除以 `div` 是否等于 0：如果为真，则通过将\
  \ `div` 的值附加到 `factors` 来更新变量 `factors`，之后将 `num` 除以 `div` 的值。然而，如果 `num` 不能被 `div`\
  \ 整除，则 `div` 的值将加 1。之前的逻辑使我们能够找到多个相同的质因数。例如，数字 12 的质因子是 2、2 和 3。\n\nListing 5.72\
  \ 的后续部分是一个 `BEGIN` 块，它用三个正整数初始化数组 `arr`。Listing 5.72 的后续部分是主执行块，其中包含一个遍历数组 `arr`\
  \ 元素的循环。在每次迭代中，使用 `arr` 的当前元素调用 `divisors()` 函数，其返回值用于初始化变量 `result`。该代码块的最后代码片段显示了\
  \ `x` 的当前值及其质因数。在 Listing 5.68 中运行代码，你将看到以下输出：\n\nFactors of 24 :  2 2 2 3\nFactors\
  \ of 7 :  7\nFactors of 96 :  2 2 2 2 2 3\n\n## 哥德巴猜想\n\n哥德巴猜想认为每一个大于 2 的偶数都可以表示为两个奇质数的之和。\n\
  \n***Listing 5.73: goldbach_conjecture.sh***\n\n```bash\necho \"\" | awk 'function\
  \ prime(num) {\n  div = 2\n  while(div < num) {\n    if( num % div != 0) {\n   \
  \   div += 1\n    } else {\n      return COMPOSITE\n    }\n  }\n  return PRIME\n\
  }\nfunction find_prime_factors(even_num) {\n  for(num=3; num<int(even_num/2); num++)\
  \ {\n    if(prime(num) == 1) {\n      if(prime(even_num-num) == 1) {\n        print\
  \ even_num , \" = \" , num ,\"+\" , (even_num-num)\n      }\n    }\n  }\n}\nBEGIN\
  \ { PRIME = 1; COMPOSITE = 0; upper_bound = 30; }\n  for(idx=4; idx<upper_bound;\
  \ idx++ ) {\n    find_prime_factors(idx)\n  }}'\n```\n\nListing 5.73 从函数 `prime()`\
  \ 开始，该函数确定参数 `num` 是否为质数。接下来，函数 `find_prime_factors()` 一个循环，循环变量 `num` 从 3 迭代到参数\
  \ `even_num` 值的一半。如果 `num` 是质数，则 Listing 5.73 中的条件逻辑将用数字 `even_num-num` 调用 `prime()`。\n\
  \n如果 `num` 和 `even_num` 都是质数，那么它们就是哥德巴猜想的一个解，因为这两个数的和等于参数 `even_num`。在 Listing 5.73\
  \ 中运行代码，你将看到以下输出：\n\n8  =  3 + 5\n10 =  3 + 7\n12 =  5 + 7\n14 =  3 + 11\n16 = \
