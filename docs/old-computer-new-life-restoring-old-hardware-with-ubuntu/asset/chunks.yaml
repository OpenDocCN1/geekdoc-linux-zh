    computer you will need to create a separate visible, writeable, “everyone” folder
    and point your backup software to use it. If you have a WiFi network set up you’ve
    got yourself a poor man’s version of Apple’s Time Capsule.


    ## Backing up


    For desktop PC, educational PC


    Backing up data is essential, especially when you’re running on old hardware.
    Open Applications>System Tools>Deja Dup. Alternatively, open the Terminal and
    type “sudo deja-dup”.


    ![](Images/20.jpg)


    Click on “Back Up...” then select the method you want to use from the drop down
    menu. Deja dup has integrated support for Amazon S3 and Rackspace Cloud Storage,
    if you want to back up to an offsite location. Otherwise, select the location
    of the external hard drive, FTP server, or Windows share.


    If you have a SMB compatible router, connecting a hard drive to the USB port in
    the back will allow you to use that as the Deja dup backup drive. The checkbox
    for data encryption is selected by default, so your data is protected from prying
    eyes.


    ## Configuring the Firewall


    Ubuntu comes preinstalled with a Firewall, which protects the system automatically
    from remote users that want to gain access. The graphical configuration utility
    for it needs to be downloaded manually.


    Open up the Ubuntu Software Center and search for “firewall”; install the package
    called “Firewall Configuration”. Alternatively, open the Terminal and type in
    “sudo apt-get gufw”, then “sudo gufw” to start the configuration utility.


    To start the configuration utility from the GUI, go to System>Administration>Firewall
    Configuration.


    ![](Images/21.jpg)


    Just like any firewall, ufw allows us to create rules for applications and specific
    ports. Unlike using the command line, gufw allows simple intuitive input of rules.


    ## Power management


    Whether you’re going to use the system as a file server or desktop PC, you need
    to configure your power settings. Go to System>Administration>Power Management.


    If you want your file server to be always available, make sure the “Put the computer
    to sleep when inactive for:” is set to never. You might also want to consider
    buying an UPS (uninterruptible power supply) to make sure data isn’t corrupted
    if a power outage or surge occurs. The ext4 file system (default choice for Ubuntu
    11.04), is very robust and can recover from such events as a whole, corrupting
    just files in the process of writing at the time of the event.


    ![](Images/22.jpg)


    For a laptop or desktop PC, consider changing the sleep setting to somewhere around
    10-30 minutes. You can also enable the “Spin down hard disks when possible”, because
    it will save power – essential for a laptop.


    ## Remote Torrent downloads


    For Desktop PC and File Server


    You can use the integrated web server in Transmission to download and manage transfers
    from another computer on the network (eg. download a torrent directly to your
    Ubuntu box from your Mac laptop).


    Go to Applications>Internet>Transmission>Edit>Preferences>Web. Click the “Enable
    web client” check box. Click the “Use authentication” checkbox and select a username
    and password.


    On any machine on your local network you can now open a web browser and direct
    it to:


    http://ip_address_of_machine_running_transmission:9091/ to access the interface.


    If your Ubuntu box is a file server, make sure you set up the Transmission download
    folder to be shared on the network, like I showed you. Then you can stream the
    downloads onto any computer on the network.


    ## Educational Packages


    For Educational PC


    While you might not find any use in the old hardware, your children might benefit
    from a selection of educational software made available for free in bundles according
    to age groups, thanks to the valiant efforts of the team behind Edubuntu, a Linux
    distribution based on Ubuntu, whose target audience are children under eighteen.


    ![](Images/23.jpg)


    You can download and install these packages by opening the Ubuntu Software center
    and searching for the text highlighted in blue below. Or open a Terminal window
    and typing “sudo apt-get install” followed by:


    **ubuntu-edu-preschool** - Preschool ( < 5 years old) educational application
    bundle


    **ubuntu-edu-primary** - Primary ( ages 6-12) educational application bundle


    **ubuntu-edu-secondary** - Secondary ( ages 13-18) educational application bundle


    **ubuntu-edu-tertiary** - Tertiary ( university level ) educational application
    bundle


    MakeUseOf [has an article](http://www.makeuseof.com/tag/4-childrens-linux-applications-to-keep-your-kids-ahead-of-the-game/)
    covering a few of these applications, if you’re not sure whether to install the
    edu packages or not.


    # Overview of other distributions


    Once you’re comfortable using Ubuntu you can take a look at alternative distributions.
    Each has a specific set of advantages and caveats.'
