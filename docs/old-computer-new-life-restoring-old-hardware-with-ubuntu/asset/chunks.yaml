  trans: "\n\n3. 在 Google 上搜索“品牌名称” + “型号数字” + “inf” + “file” + “driver” + “Windows\
    \ XP”。下载 `inf` 文件并在 `ndiswrapper` 窗口中输入该路径。如果初始的 Google 搜索没有找到可用的 `inf` 文件，请尝试使用其他操作系统进行搜索，例如“Windows\
    \ Vista”，或在查询中省略“driver”/“file”。\n\n4. 现在应该可以工作了。前往`System（系统）`>Preferences（设置）>`Network\
    \ Connections（网络连接）`并检查`Wireless（无线）`选项卡。（我的那里没有显示任何内容，因为我的虚拟机没有 WiFi 卡）\n\n如果\
    \ `ndiswrapper` 不起作用，你需要找到由社区创建的驱动源码（因此不受制造商支持）并编译代码。此过程因卡而异，会有一些指南教你如何针对特定型号或芯片组进行此操作。在大多数情况下，你还需要新的内核头文件（kernel\
    \ headers）。\n\n我使用 Linux 设备已经 6 年了，但仍然觉得这个过程非常繁琐，对于新手来说几乎是不可能完成的。Aos ath2k 系列芯片组的示例命令如下：\n\
    \n```\nwget http://snapshots.madwifi.org/madwifi-hal-0.10.5.6/madwifi-hal-0.10.5.6-r3835-20080801.tar.gz\
    \ tar-xvf madwifi-hal-0.10.5.6-r3835-20080801.tar.gz cd madwifi-hal-0.10.5.6-r3835-20080801\
    \ sudo apt-get install build-essential linux-headers-$(uname -r) sudo make sudo\
    \ make install\n```\n\n现在请注意，所有的版本号都是针对特定芯片组系列的，不能互换。你最好的选择是在 Google 中使用这种搜索：“site:ubuntuforums.org\
    \ 品牌 型号 driver”，并希望有人已经凑出了一个驱动程序和一个编译指南。\n\n## 购买额外硬件\n\n购买新硬件时，请检查盒背面的 Ubuntu\
    \ 兼容性，并搜索 [Linux 硬件兼容性列表](http://linuxhcl.com/) 和 [Ubuntu 认证硬件列表](http://www.ubuntu.com/certification/)。如果你的系统内存小于\
    \ 512MB 且想使用资源密集型应用程序，你可能需要购买额外的 `RAM`。任何与你的主板兼容的 `RAM` 都能在 Ubuntu 中运行。\n\n必须首先检查额外的网络设备的兼容性，这一点我强调再强调。对于文件服务器，你可能需要购买网卡或\
    \ WiFi 适配器。\n\n## 配置 SAMBA 共享\n\n文件共享、文件服务器\n\n`SAMBA` 是一个可以让你在 Windows 和 Macintosh\
    \ 电脑上访问 Ubuntu 设备文件的工具，反之亦然。前往`System（系统）`>Administration（管理）>`Samba`。点击加号图标并选择你想要共享的目录。我建议创建一个名为\
    \ `Dropbox` 的文件夹，网络中的所有人都可以访问并写入。然后对`Documents（文档）`等文件夹使用特定设置。\n\n![](img/19.jpg)\n\
    \n这样，你将始终能够快速将文件备份到你的 Ubuntu 设备上。在 Access（访问）面板中选择“Everyone（所有人）”。使用 `SAMBA` 客户端共享的文件夹将出现在我的网络位置、“网络”或你操作系统的等效位置中。这基本上是一个“自制”文件服务器。\n\
    \n你可以将 Ubuntu 设备作为其他电脑的备份驱动器。对于每台电脑，你将需要创建一个独立的可见、可写的“everyone（所有人）”文件夹，并将你的备份软件指向它。如果你设置了\
    \ WiFi 网络，你就拥有了一个廉价版的 Apple Time Capsule。\n\n## 备份\n\n对于台式 PC、教育用 PC\n\n备份数据是至关重要的，尤其是当你运行在旧硬件上时。打开`Applications（应用程序）`>`System\
    \ Tools（系统工具）>`Deja Dup`。或者，打开终端并输入 `sudo deja-dup`。\n\n![](img/20.jpg)\n\n点击“Back\
    \ Up...（备份...）”，从下拉菜单中选择你想使用的方法。`Deja dup` 集成了对 Amazon S3 和 Rackspace Cloud Storage\
    \ 的支持，如果你想备份到异地。否则，选择硬盘、FTP 服务器或 Windows 共享的位置。如果你有一个兼容 `SMB` 的路由器，将硬盘连接到背部的 USB\
    \ 端口将允许你将其作为 `Deja dup` 备份驱动器。默认勾选数据加密复选框，因此你的数据免受窥视。\n\n## 配置防火墙\n\nUbuntu 预装了防火墙，可以自动保护系统免受想要访问的远程用户的攻击。图形配置工具需要手动下载。\n\
    \n打开 Ubuntu 软件中心并搜索“firewall”，安装名为“Firewall Configuration（防火墙配置）”的包。或者，打开终端输入\
    \ `sudo apt-get gufw`，然后输入 `sudo gufw` 启动配置工具。\n\n从 GUI 启动配置工具，前往`System（系统）`>Administration（管理）>`Firewall\
    \ Configuration（防火墙配置）`。\n\n![](img/21.jpg)\n\n就像任何防火墙一样，`ufw`允许我们为应用程序和特定端口创建规则。与命令行不同，`gufw`允许简单直观地输入规则。\n\
    \n## 电源管理\n\n无论是将系统用作文件服务器还是台式 PC，都需要配置电源设置。前往`System（系统）`>Administration（管理）>`Power\
    \ Management（电源管理）`。\n\n如果你想让文件服务器始终可用，请确保“Put the computer to sleep when inactive（闲闲时让电脑睡眠）”设置为“never（从不）”。你可能还需要考虑购买\
    \ `UPS（不间断电源）`以确保在停电时数据不会损坏。`ext4`文件系统（Ubuntu 11.04 默认选择）非常健壮，可以从此类事件中恢复。\n\n\
    ![](img/22.jpg)\n\n对于笔记本电脑或台式 PC，考虑将睡眠设置为 10-30 分钟。你还可以开启“Spin down hard disks\
    \ when possible（可能时停止硬盘旋转）”，这对笔记本电脑很重要。\n\n## 远程 Torrent 下载\n\n对于台式 PC 和文件服务器\n\
    \n你可以使用`Transmission`内置的网络服务器下载并管理传输（例如：直接下载到你的笔记本）。\n\n前往`Applications（应用程序）`>`Internet（互联网）>`Transmission`>`Edit（编辑）>`Preferences（首选项）`。勾选“Enable\
    \ web client（启用网络客户端）”。勾选“Use authentication（使用身份验证）”并选择用户名和密码。\n\n在本地网络上的任何机器上，你现在都可以打开浏览器并指向\
    \ `http://ip_address_of_machine:9091/` 来访问界面。\n\n如果你的 Ubuntu 设备是服务器，确保将 `Transmission`\
    \ 下载文件夹设置为共享，正如我向你展示的那样。这样你就可以在任何电脑上下载。\n\n## 教育软件包\n\n对于教育用 PC\n\n虽然你可能在旧硬件上找不到任何用途，但你的孩子可能会从根据年龄分组提供的免费教育软件包中受益，这要归于`Edubuntu`团队的努力，这是一个基于\
    \ Ubuntu 的 Linux 发行版，目标群体是十八岁以下的儿童。\n\n![](img/23.jpg)\n\n你可以通过打开 Ubuntu 软件中心并搜索下方蓝色文本来下载并安装这些软件包。或者打开终端窗口输入\
    \ `sudo apt-get install` 后接：\n\n`ubuntu-edu-preschool` - 5 岁以下教育软件包\n`ubuntu-edu-primary`\
    \ - 小学（6-12 岁）教育软件包\n`ubuntu-edu-secondary` - 中学（13-18 岁）教育软件包\n`ubuntu-edu-tertiary`\
    \ - 高等教育（大学水平）教育软件包\n\nMakeUseOf [有一篇关于其中一些应用程序的文章](http://www.makeuseof.com/tag/4-childrens-linux-applications-to-keep-your-kids-ahead-of-the-game/)，如果你不确定是否安装这些软件包。\n\
    \n 其他发行版概述\n\n当你熟悉了 Ubuntu 之后，可以查看其他的发行版。每个发行版都有特定的优势和缺点。\n\n"
