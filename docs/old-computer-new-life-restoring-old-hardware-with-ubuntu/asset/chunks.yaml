- fmt: "\n3. Search Google for “Brand Name” + “Model Number” + “inf” + “file” + “driver”\
    \ + “Windows XP”. Download the `inf` file and input the location in the `ndiswrapper`\
    \ window. If the initial Google search doesn’t lead you to an `inf` file that\
    \ works, search using an alternative OS, like “Windows Vista”, or omit “driver”/”file”\
    \ from the query.\n\n4. It should work now. Go to `System`>Preferences`>`Network\
    \ Connections` and check the `Wireless` tab. (Mine doesn’t show anything in there\
    \ because my virtual machine doesn’t have a WiFi card)\n\nIf `ndiswrapper` doesn’t\
    \ work, you’ll have to find the source code to a driver created by the community\
    \ (thus unsupported by the manufacturer) and compile the code. This process differs\
    \ from card to card, and there are guides showing you how to do this in relation\
    \ to a specific model or chipset. In most cases, you’ll also need new kernel headers.\n\
    \nI’ve been using Linux boxes for 6 years and I still find this process cumbersome\
    \ and borderline impossible for a newbie to work out. An example command for the\
    \ Atheros ath2k series of chipsets is as follows:\n\n```\nwget http://snapshots.madwifi.org/madwifi-hal-0.10.5.6/madwifi-hal-0.10.5.6-r3835-20080801.tar.gz\
    \ tar-xvf madwifi-hal-0.10.5.6-r3835-20080801.tar.gz cd madwifi-hal-0.10.5.6-r3835-20080801\
    \ sudo apt-get install build-essential linux-headers-$(uname -r) sudo make sudo\
    \ make install\n```\n\nNow consider that all of those version numbers are specific\
    \ for a chipset series and not interchangeable. Your best option is to use this\
    \ search in Google “site:ubuntuforums.org BRAND MODEL NUMBER driver” and hope\
    \ someone has hacked together a driver and a guide for compiling it.\n\n## Purchasing\
    \ additional hardware\n\nWhen buying new hardware, check the back of the box for\
    \ Ubuntu compatibility and search the [Linux hardware compatibility list](http://linuxhcl.com/)\
    \ and [Ubuntu Certified hardware list](http://www.ubuntu.com/certification/).\
    \ You might need to buy additional `RAM` if you have a system with less than 512MB\
    \ and want to use resource intensive applications. Any `RAM` that is compatible\
    \ with your motherboard will work in Ubuntu.\n\nAdditional networking equipment\
    \ must be checked first for compatibility, I cannot stress this enough. For a\
    \ file server, you might need to buy an Ethernet card or a WiFi adapter.\n\n##\
    \ Configuring SAMBA shares\n\nFor file-sharing, file server\n\n`SAMBA` is a tool\
    \ that will let you access files from your Ubuntu box on Windows and Macintosh\
    \ PCs, and vice versa. Go to `System`>Administration`>Samba`. Click on the Plus\
    \ icon and select the directory you wish to share. I recommend creating a folder\
    \ called a `Dropbox`, which is accessible to everyone in the network and writeable.\
    \ Then use specific settings for folders like `Documents` and so on.\n\n![](Images/19.jpg)\n\
    \nThis way you will always be able to quickly back up a file to your Ubuntu box.\
    \ In the Access panel select “Everyone”. Folders shared using the `SAMBA` client\
    \ will appear in My Network Places, Network, or the equivalent on your operating\
    \ system. This is basically a „do it yourself’ file server.\n\nYou can use your\
    \ Ubuntu box as a backup drive for your other computers. For each computer you\
    \ will need to create a separate visible, writeable, “everyone” folder and point\
    \ your backup software to use it. If you have a WiFi network set up you’ve got\
    \ yourself a poor man’s version of Apple’s Time Capsule.\n\n## Backing up\n\n\
    For desktop PC, educational PC\n\nBacking up data is essential, especially when\
    \ you’re running on old hardware. Open `Applications`>`System Tools`>`Deja Dup`.\
    \ Alternatively, open the Terminal and type `sudo deja-dup`.\n\n![](Images/20.jpg)\n\
    \nClick on “Back Up...” then select the method you want to use from the drop down\
    \ menu. `Deja dup` has integrated support for Amazon S3 and Rackspace Cloud Storage,\
    \ if you want to back up to an offsite location. Otherwise, select the location\
    \ of the external hard drive, FTP server, or Windows share.\n\nIf you have a `SMB`\
    \ compatible router, connecting a hard drive to the USB port in the back will\
    \ allow you to use that as the `Deja dup` backup drive. The checkbox for data\
    \ encryption is selected by default, so your data is protected from prying eyes.\n\
    \n## Configuring the Firewall\n\nUbuntu comes preinstalled with a Firewall, which\
    \ protects the system automatically from remote users that want to gain access.\
    \ The graphical configuration utility for it needs to be downloaded manually.\n\
    \nOpen up the Ubuntu Software Center and search for “firewall”; install the package\
    \ called “Firewall Configuration”. Alternatively, open the Terminal and type in\
    \ `sudo apt-get gufw`, then `sudo gufw` to start the configuration utility.\n\n\
    To start the configuration utility from the GUI, go to `System`>Administration`>`Firewall\
    \ Configuration`.\n\n![](Images/21.jpg)\n\nJust like any firewall, `ufw` allows\
    \ us to create rules for applications and specific ports. Unlike using the command\
    \ line, `gufw` allows simple intuitive input of rules.\n\n## Power management\n\
    \nWhether you’re going to use the system as a file server or desktop PC, you need\
    \ to configure your power settings. Go to `System`>Administration`>`Power Management`.\n\
    \nIf you want your file server to be always available, make sure the “Put the\
    \ computer to sleep when inactive for:” is set to never. You might also want to\
    \ consider buying a `UPS` (uninterruptible power supply) to make sure data isn’t\
    \ corrupted a power outage occurs. The `ext4` file system (default choice for\
    \ Ubuntu 11.04), is very robust and can recover from such events.\n\n![](Images/22.jpg)\n\
    \nFor a laptop or desktop PC, consider changing the sleep setting to somewhere\
    \ 10-30 minutes. You can also enable the “Spin down hard disks when possible”,\
    \ because it will save power – essential for a laptop.\n\n## Remote Torrent downloads\n\
    \nFor Desktop PC and File Server\n\nYou can use the integrated web server in `Transmission`\
    \ to download and manage transfers from another computer (eg. download a torrent\
    \ directly to your laptop).\n\nGo to `Applications`>`Internet`>`Transmission`>`Edit`>`Preferences`>`Web`.\
    \ Click the “Enable web client” check box. Click the “Use authentication” checkbox\
    \ and select a username and password.\n\nOn any machine on your local network\
    \ you can now open a web browser and direct it to: `http://ip_address_of_machine_running_transmission:9091/`\
    \ to access the interface.\n\nIf your Ubuntu box is a file server, make sure you\
    \ set up the `Transmission` download folder to be shared on the network, like\
    \ I showed you. Then you can stream the downloads onto any computer.\n\n## Educational\
    \ Packages\n\nFor Educational PC\n\nWhile you might not find any use in the old\
    \ hardware, your children might benefit from a selection of educational software\
    \ available for free in bundles according to age groups, thanks to the valiant\
    \ efforts of the team behind `Edubuntu`, a Linux distribution based on Ubuntu,\
    \ whose target audience are children under eighteen.\n\n![](Images/23.jpg)\n\n\
    You can download and install these packages by opening the Ubuntu Software center\
    \ and searching for the text highlighted in blue below. Or open a Terminal window\
    \ and typing `sudo apt-get install` followed by:\n\n`ubuntu-edu-preschool` - Preschool\
    \ ( < 5 years old) educational application bundle\n`ubuntu-edu-primary` - Primary\
    \ ( ages 6-12) educational application bundle\n`ubuntu-edu-secondary` - Secondary\
    \ ( ages 13-18) educational application bundle\n`ubuntu-edu-tertiary` - Tertiary\
    \ ( university level ) educational application bundle\n\nMakeUseOf [has an article](http://www.makeuseof.com/tag/4-childrens-linux-applications-to-keep-your-kids-ahead-of-the-game/)\
    \ covering a few of these applications, if you’re not sure whether to install\
    \ the edu packages or not.\n\n Overview of other distributions\n\nOnce you’re\
    \ comfortable using Ubuntu you can take a look at alternative distributions. Each\
    \ has a specific set of advantages and caveats.\n"
