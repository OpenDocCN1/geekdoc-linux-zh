  trans: "\n\n1. 点击[此链接](http://www.pendrivelinux.com/downloads/Universal-USB-Installer/Universal-USB-Installer.exe)\
    \ 下载“USB 安装程序”。\n2. 从下拉列表中选择 Ubuntu 11.04（或根据你阅读时的日期选择其他合适的版本）。\n3. 选择我们之前下载的镜像文件。\n\
    4. 进入“我的电脑”，找到与 USB 驱动器对应的驱动器器号（例如`K:`、`G:` 等），然后在 `ImgBurn` 的下拉菜单中选择正确的驱动器器号。\n\
    5. 点击 `Create`（创建）并等待过程完成。\n\n现在我们已经成功创建了安装介质，我们需要找到如何从它启动。这会根据电脑的不同而异，但如果你在启动电脑时仔细注意，屏幕上很快就会出现一条\
    \ BIOS 消息，显示类似“现在按 F12 从备用介质启动”或“按 DEL 运行设置”之类的字样。如果你不知道如何从光盘或 USB 驱动器启动，Hiren.info\
    \ 为大多数 BIOS 制造商提供了[完整指南](http://www.hiren.info/pages/bios-boot-cdrom)。\n\n**重要**：在继续操作之前，请确保你已经备份了**所有数据**。我们将格式化整个硬盘，这意味着所有未备份的数据将将**永久丢失**。\n\
    \n# 安装\n\n在过去，安装 Linux 发行版曾是一项枯燥的任务（相信我，你不想在周六晚上编译内核），但多年来它变得越来越简单了。在很多方面，安装 Ubuntu\
    \ 比安装任何现代版本的 Windows 都要简单。\n\n1. 插入我们之前刻好的包含操作系统镜像的光盘或 U 盘。\n2. 关闭电脑然后重新启动。\n\
    3. 从安装介质（光盘或 U 盘）启动。\n\n### 第 1 \n从左侧面板选择你的语言，然后点击右侧的“安装 Ubuntu”（Install Ubuntu）按钮。\n\
    \n![](img/3.jpg)\n\n### 第 2 \n在“正在准备安装 Ubuntu”窗口中，确保所有要求旁边都有绿色勾箭头。如果你还没有连接网络，不要慌，这并不是必须的。\n\
    \n确保选中窗口底部的“安装此第三方软件”（install this third party software）选项。这将确保 Ubuntu 能够开箱播放\
    \ MP3 音乐文件。如果你有互联网连接，请勾选“安装时下载更新”（Download updates while installing）复选框。\n\n![](img/4.jpg)\n\
    \n### 第 3\n在下一个屏幕，选择列表中的第三选项“删除所有并重新安装”（Erase everything and reinstall）。它将使用 `ext4`\
    \ 文件系统**格式化硬盘**——允许我们从零开始，并将硬盘的所有容量提供给操作系统。\n\n![](img/5.jpg)\n\n### 第 3*\n如果\
    \ Ubuntu 无法检测到你的键盘布局，它会要求你手动设置。如果你知道你使用的键盘布局类型，请从列表中选择并点击“继续”（Forward）。如果不知道，只需保持默认选择并点击“继续”（Forward）。\n\
    \n### 第 4 \n在下一个窗口中，输入所需信息，例如你的姓名、账户用户名和密码。你之后会需要这些用户名和密码——请确保将它们写下来并保放在安全的地方。\n\
    \n![](img/6.jpg)\n\n### 第 4*\n如果你想存储敏感信息（如工作文档、密码、银行账户信息），且你的系统具有超过 512MB 的内存以及主频至少为\
    \ 1.5Ghz 的处理器，请也勾选“加密我的主文件夹”（Encrypt my home folder）的复选框。\n\n使用 [GRC 密码生成器](https://www.grc.com/passwords.htm)\
    \ 获取高强度密码。使用第三字段，并选择长度至少为 16 个字符的密码。\n\n![](img/7.jpg)\n\n### 第 5\n你几乎完成了，恭喜你。现在只需要选择适用于你地理位置的时区。在我的情况下，它是\
    \ GMT+2 布加勒斯特。\n\n![](img/8.jpg)\n\n### 第 6\n让安装程序完成，然后在接到提示时重启电脑。在重启之前，确保已从电脑中移除所有安装介质。屏幕会在适当的时候显示执行此操作的消息。\n\
    \n# 初始配置\n\n注意：你的系统可能有足够的性能运行 Unity 3D 用户界面。这意味着你的硬件相对较新。本指南提供的说明针对低端 PC，它们将仅与默认窗口管理器和\
    \ Unity 2D 兼容。这是 Unity 3D 的外观：\n\n![](img/9.jpg)\n\n这是由 [WebUpd8](http://www.webupd8.org/)\
    \ 提供的在 Ubuntu 11.04 上运行 Unity 3D 的截图。在本指南的后续部分，我将提供如何安装和启用资源消耗更低的 Unity 2D 版本\
    \ UI（用户界面）的说明。\n\n以下指令基于你的硬件是旧设备的假设——这也是本指南标题和引言中所述的前提。\n\n## 初步\n\n与 Windows\
    \ 不同，Ubuntu 预装了一系列[软件](http://www.makeuseof.com/pages/best-linux-software)，涵盖了计算机用户的所有基本需求。这是一个熟悉桌面、用户界面和应用程序的好时机。\n\
    \n![](img/10.jpg)\n\n**主菜单**：在屏幕左上角你会看到三个菜单和 Firefox 图标。选择“应用程序”（Applications）并环顾四周。它们都是为了易用而编写的，许多类似于闭源软件。例如，聊天应用程序类似于早期的\
    \ Yahoo Messenger。\n\n![](img/11.jpg)\n\n**通知区域**：在屏幕右上角你会看到一些图标、时钟、用户名和关按钮。将鼠标悬停在每个图标上可以获取系统提供的额外信息。\n\
    \n例如，相反箭头图标表示连接性；如果存在网卡，它们应该出现在这里。默认命名规则为以 eth% 表示以太网网卡，以 ath% 表示无线网卡。如果存在无线连接，会自动弹出对话框，请求选择\
    \ WiFi 接入点并输入密码（如果网络受保护）。\n\n如果你之前配置了聊天凭据，用户名旁边的气泡将显示你的可用状态。在我的情况下，它显示一个 X，表示“已注销”或离线。\n\
    \n**文件夹和窗口栏**：从顶部主菜单选择“位置”（Places），然后点击“主文件夹”（Home Folder）。这是你存储所有文件的地方——相当于 Windows\
    \ 中的我的文档、我的照片等。\n\n在屏幕底部，注意有一个显示用户名的矩形。这就是任务栏。你打开的每一个窗口都会出现在那里，你可以通过鼠标选择它使其聚焦。\n\
    \n右侧有四个较小的矩形；它们代表工作空间——就像有四个虚拟显示器。你可以用一个处理所有工作窗口，另一个用于 Facebook 和聊天，另一个用于音乐播放器等等。栏中的最后一个图标是垃圾桶。\n\
    \n## 安装更新和额外包\n\n在你的 Ubuntu 机器上安装[应用程序](http://www.makeuseof.com/tag/repositories-package-management-ubuntu/)\
    \ 有两种方法：使用图形用户界面和使用命令行（终端）。我将说明这两种方法，以便你熟悉每一种。\n\n下一部分我们需要互联网连接。如果无线网卡不起，请尝试通过以太网端口直接连接路由器。\n\
    \n"
- fmt: '

    If that’s not available to you, try using a USB wireless network adapter. If you
    don’t have one, borrow one from a friend. This guide contains a Troubleshooting
    section which will help you fix the WiFi card problem – but you still need a temporary
    way to access the Internet.


    ### Installing updates


    Making sure all of your software is up to date is a matter of going to `System>Administration>Update
    Manager` and clicking on `Install Updates`. Not only will it update system files
    and system utilities, but all of the installed software, like the LibreOffice
    word processor and Empathy.


    ![](Images/13.jpg)


    Alternatively, open the `Terminal` and type in `sudo apt-get update` followed
    by `sudo apt-get upgrade` to achieve the same task.


    ### Installing extras


    Go to `Applications>Ubuntu Software Center`.


    ![](Images/14.jpg)


    Select the search box from the right corner and type in the package name. In this
    case `ubuntu-restricted-extras`. Select the package and click Install.


    The package `ubuntu-restricted-extras` is a collection of commonly installed applications
    (such as Adobe’s Flash Player, and Microsoft’s TrueType fonts, Java Virtual Machine,
    support for RAR archives) that can’t be included in the default Ubuntu installation
    because of legal restrictions. Installing the same batch of applications on a
    Windows computer would have taken half an hour at best.


    The process I described earlier works for any package you might need, just search
    for the name given to you in the tutorial or that a friend told you about.


    Using the command line to achieve the same task is straightforward. Go to `Applications>Accessories>Terminal`.
    Type `sudo apt-get install ubuntu-restricted-extras` and press Enter.


    ## Repository bonanza


    By default, Ubuntu 11.04 will try to run the 3D Unity theme. While it is more
    pleasing for the eye, it consumes resources.


    You can get Unity without the 3D, though. To install Unity 2D, open Ubuntu Software
    Center and search for `unity 2d`. Select the package and click Install. If it
    doesn’t appear in the list, you don’t have the necessary repositories installed.
    Use the method described in Step 1*.


    Go to `Applications>Accessories>Terminal`. Then type `sudo add-apt-repository
    ppa:unity-2d-team/unity-2d-daily` which provide the system with the location of
    the package. Type `sudo apt-get update` to update all of your software and repository
    lists.


    Finally type in `sudo apt-get install unity-qt-default-settings` to complete the
    installation. Then log out. In the login screen, you will see `Unity Qt` in a
    drop-down menu. Pick that and login again.


    Example terminal window command:


    ![](Images/15.jpg)


    ### Simple Preferences Management


    Ubuntu Tweak is a small application that takes all the hard work out of configuring
    advanced system settings, cleaning up, and installing other nifty packages.


    At the command prompt type in `sudo add-apt-repository ppa:tualatrix/ppa` and
    press Enter; that command instructed the `apt` daemon where it could search for
    this additional software. Type in `sudo apt-get update` and press Enter; this
    makes sure all of your packages are up-to-date. Type in `sudo apt-get install
    ubuntu-tweak` and press Enter; this last command fetches the required files and
    installs the application.


    ![](Images/16.jpg)


    Explore the software and you’ll find a variety of tweaks. For example: go to `Applications>System
    Utilities>Ubuntu Tweak`. Click on `Source Center>File Sharing>Transmission Stable
    builds checkbox>Sync`. Transmission is the premier Torrent and Magnet client,
    and is not available in the default repositories.


    We just added the repository and installed Transmission in a few clicks – no command
    line necessary or scouting for repository links.


    ### Media compatibility


    “Medibuntu is a packaging project dedicated to distributing software that cannot
    be included in Ubuntu for various reasons, related to geographical variations
    in legislation regarding intellectual property, security and other issues.” Medibuntu
    contains non-free codecs (like `WMV`) and support for encrypted AAC files (songs
    purchased on iTunes).


    To install this repository, open the `Terminal` and type in `sudo wget --output-
    document=/etc/apt/sources.list.d/medibuntu.list http://www.medibuntu.org/sources.list.d/$(lsb_release
    -cs).list && sudo apt-get --quiet update && sudo apt-get --yes --quiet --allow-unauthenticated
    install medibuntu-keyring && sudo apt-get --quiet update` and press Enter.


    **Movies**: This step only applies if you’re going to use the machine to play
    movies. If you want to set up a file server, skip this.


    In the `Terminal` type `sudo apt-get install vlc`, press Enter; type in `sudo
    apt-get install non-free-codecs libxine1-ffmpeg gxine mencoder libmpcdec3 libquicktime1
    flac faac faad sox ffmpeg2theora libmpeg2-4uudeview flac libmpeg3-1 mpeg3-utils
    mpegdemux liba52-dev mpeg2dec vorbis-tools id3v2 mpg321 mpg123 libflac++6 ffmpeg
    libmp4v2-0totem-mozilla icedax tagtool easytag id3tool lame nautilus-script- audio-convert
    libmad0 libjpeg-progs`.


    For DVD support type in `sudo apt-get install libdvdcss2 && sudo /usr/share/doc/libdvdread4/./install-css.sh`
    and press Enter.


    This step downloads and installs software that will enable you to enjoy all of
    entertainment.


    ### Additional software


    Open the Ubuntu Software Center and search for Samba, Deja dup, Skype. Select
    each package as you find it and click install.


    **Samba**: Sharing files with other computers in a local network is made easy
    by Samba. In the Terminal, type `sudo apt-get install samba` and press Enter.
    I’ll show you how to use Samba later on this guide. We also need `sudo apt-get
    install system-config-samba`, as a graphical interface to the `SMB` daemon.


    **Backup**: If you’re going to use this machine as work station, you’ll want your
    files to be backed up automatically. The easiest way to do that is Deja-Dup. In
    the Terminal type `sudo apt-get install deja-dup`. I’ll show you how to use later
    on this guide.


    **Skype**: If you’ve used Skype on Windows, I’m sure you’ll want the same functionality
    on your Ubuntu box. In the Terminal type `sudo apt-get update && sudo apt-get
    install skype`.


    It installs a popular VOiP application called Skype. You can talk to other people
    who have Skype or call phones from your PC.


    # Further configuration


    ## Solving hardware compatibility


    Since the FLOSS community is dispersed and not centrally organized by design,
    sometimes hardware manufacturers choose to turn a blind eye to the needs of this
    growing community. An increasing number of proprietary drivers are made available
    to users for easy installation in the `Additional Drivers` tool. You can access
    it by going to `System>Administration>Additional Drivers`.


    This tool will automatically check the vendor and product ID in an effort to locate
    the proprietary driver for you. These drivers can’t be installed by default due
    to legal restrictions, but you can install them manually.


    ![](Images/17.jpg)


    If a driver is available for you, it will appear like in the screenshot. For WiFi
    cards, the most common cause of headaches and nights spent reading forum posts,
    there is a tool called `ndiswrapper`. This tool manages to translate driver files
    (.sys/.inf) that were written for Windows, to be compatible with Ubuntu.


    ![](Images/18.jpg)


    1. Download and install the package called `ndisgtk` using the Ubuntu Software
    Center.


    2. Go to `System>Administration>Windows Wireless Drivers` or open a Terminal window
    and type in `sudo ndiskgtk`.

