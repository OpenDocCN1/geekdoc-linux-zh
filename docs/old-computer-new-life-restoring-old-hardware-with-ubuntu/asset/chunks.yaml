- fmt: "\n![](Images/cover.jpg)\n![](Images/cover.jpg)\n\n# Old Computer, New Life:\
    \ Restoring Old Hardware With Ubuntu\n\nBy: Stefan Neagu, [http://tuxgeek.me](http://tuxgeek.me)\
    \  \nEdited by Justin Pot\n\nThis manual is the intellectual property of MakeUseOf.\
    \ It must only be published in its original form. Using parts or republishing\
    \ altered parts of this guide is prohibited without permission from MakeUseOf.com.\n\
    \nThink you’ve got what it takes to write a manual for MakeUseOf.com? We’re always\
    \ willing to hear a pitch! Send your ideas to [justinpot@makeuseof.com](mailto:justinpot@makeuseof.com);\
    \ you might earn up to $400.\n\n# Table of Contents\n\n- [Introduction](../Text/chapter-1.xhtml)\n\
    - [Preparation](../Text/chapter-2.xhtml)\n- [Installation](../Text/chapter-3.xhtml)\n\
    - [Initial Configuration](../Text/chapter-4.xhtml)\n- [Further Configuration](../Text/chapter-5.xhtml)\n\
    - [Overview of other distributions](../Text/chapter-6.xhtml)\n- [Conclusion](../Text/chapter-7.xhtml)\n\
    - [MakeUseOf](../Text/chapter-8.xhtml)\n\n# Introduction\n\nThe computer industry\
    \ has evolved over the years more rapidly than any industry in contemporary history.\
    \ Year after year engineers have worked valiantly to bring us, the end users,\
    \ faster and more capable hardware without sacrificing reliability. Programmers\
    \ and application developers have been equally quick to develop new software that\
    \ puts to use the new hardware specifications.\n\nHowever, while striving to sell\
    \ more and more products, marketing departments want us to believe that PCs, laptops\
    \ and netbooks become obsolete after a couple of years, and not replacing them\
    \ makes us luddites.\n\nIt’s not true. Except for high-end gaming, a mid-level\
    \ system bought in 2006 will provide enough functionality to get work done and\
    \ have fun in 2011. Word processing, Internet surfing, watching movies – either\
    \ from DVDs or from your friends at the Pirate Bay - shouldn’t make your old system\
    \ think twice, granted it is configured correctly, up-to-date and has a operating\
    \ system that’s efficient, performance oriented, and free as in free beer and\
    \ free speech.\n\n## FLOSS every day\n\nFLOSS is an abbreviation for `free/libre/open-source\
    \ software`. Developers around the world contribute their work freely to different\
    \ types of open source projects. Anyone with the required programming skills can\
    \ see, use, and improve the code for the benefit of the entire community.\n\n\
    Examples of these kinds of projects include Mozilla Firefox, Chromium, the majority\
    \ of Linux distributions (such as `Ubuntu`), VLC (a media player) and so on. There\
    \ are literally thousands of applications that cost nothing and cover 90% of an\
    \ average user’s needs in regards to computing in a modern software environment.\n\
    \nOn a personal note, I get better frame rates (14-17 more frames per second)\
    \ while running Need For Speed Carbon on an `Ubuntu 7.04` machine from 2001 than\
    \ on the same machine running Windows XP SP3. This while running a piece of emulation\
    \ software in the background which translates `Win32` libraries necessary for\
    \ DirectX acceleration, which [Ubuntu](http://www.makeuseof.com/tag/ubuntu-1104-unity-big-leap-linux/)\
    \ doesn’t have.\n\nIronic, isn’t it? Thanks to FLOSS we can put that old computer\
    \ to good use – with no financial investment on your part.\n\n## Use Cases\n\n\
    So what are we going to do with your old PC? There are a few options available;\
    \ depending on your configuration, computer skills and time you are willing to\
    \ spend on the project. This guide covers the basic setup.\n\n- **Desktop PC**\
    \ – we can turn that old PC you use as a dust holder into a fully functional machine\
    \ for browsing the web, email, chat, word processing, spreadsheets, movies and\
    \ low end 3D games. At the most, you should only have to buy some extra RAM memory.\
    \ It won’t take more than an afternoon and a couple of cups of coffee. All you\
    \ have to do to achieve this functionality is to follow the instructions for installing\
    \ the OS and the media packages provided in this guide.\n- **Local file server/backup**\
    \ – we can replace the old hard drive or attach an external one with a higher\
    \ capacity and speed. With a wireless network card and some software, we can build\
    \ a do it yourself version of [Apple’s Time Capsule](http://www.apple.com/timecapsule/).\
    \ This sort of server can be used to centrally store all of your music, photos,\
    \ and documents and make them available on the fly to any computer on the local\
    \ network. You could even set up an FTP service in order to access your files\
    \ when you are not at home. This can be a tad complicated, as it requires static\
    \ IPs, command line input and knowing how to handle an FTP client. All you have\
    \ to do is install `SAMBA` and configure it. Skip the media packages installation\
    \ instructions.\n- **Learning center for children** – there are hundreds of educational\
    \ games available in the Ubuntu software repositories which makes it an excellent\
    \ option if you have kids under 12. They can learn math, history, geography and,\
    \ thanks to the parental controls and advanced security inherent to Linux distributions,\
    \ no need to worry about viruses, spyware and Internet stalkers. Follow the instructions\
    \ provided, but skip the `SAMBA` installation. See the section titled “Educational\
    \ Packages”\n\n## What is Ubuntu?\n\nUbuntu is a Linux distribution supported\
    \ officially by Canonical. The team at Canonical actively supports developers\
    \ working on the operating system with money from donations and commercial activities\
    \ like providing support and technical assistance for corporate clients.\n\nIt\
    \ is the most popular Linux distribution, it benefits from a rapid release schedule,\
    \ bug testing and a large supportive community at [ubuntuforums.org](http://ubuntuforums.org).\
    \ As a FLOSS project, it too is available at no cost.\n\n![](Images/1.jpg)\n\n\
    Above, Ubuntu Linux 11.04 (Natty Narwhal) is running in a virtual machine with\
    \ specifications to resemble a low end PC. As it is a widely used, multi-purpose,\
    \ efficient OS, Ubuntu serves as an ideal building block for our customized.\n\
    \nUbuntu comes pre-installed with a range of [software](http://www.makeuseof.com/tag/5-tips-tricks-ubuntu-software-center-linux/):\
    \ LibreOffice (OpenOffice in versions prior to 11.04), Firefox, Empathy (Pidgin\
    \ in versions before 9.10), Transmission, GIMP (in versions prior to 10.04), and\
    \ several lightweight games (such as Sudoku and chess). For additional packages,\
    \ I’ll show you how to use the Synaptic Package Manager.\n\nThe minimum hardware\
    \ requirements are:\n\n- Server version – Processor x86 platform at 300Mhz; 128MB\
    \ of RAM, 1 GB free space on the hard drive and a monitor with a minimum resolution\
    \ of 640x480.\n- Desktop version – Processor x86 platform at 1Ghz; 384MB of RAM,\
    \ 5GB free space on the hard drive and a monitor with a minimum resolution of\
    \ 1024x768.\n\nWhich in layman’s terms means that any new computer bought after\
    \ 2002 will work just fine. While all the graphic whizzbang might not work (the\
    \ Unity desktop theme, 3D compositing, High Definition videos, video streaming)\
    \ you will be able to do all the basic tasks.\n\n## How will Ubuntu give the computer\
    \ new life?\n\n### Ubuntu is efficient\n\nLinux distributions come from decades\
    \ long experience in server rooms, and if there’s something that system administrators\
    \ appreciate in an OS (operating system), it’s efficiency: sleek, lean code that\
    \ gets the job done without wasting CPU (central processing unit) cycles. Even\
    \ five seconds more from the bootloader (a small application that initializes\
    \ the OS at boot) to the window manager is something that sys admins are not ready\
    \ to put up with. Coming from such a harsh and demanding environment has made\
    \ Linux distributions the best in their class.\n"
