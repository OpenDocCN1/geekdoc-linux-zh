  trans: "\n\n![](img/cover.jpg)\n![](img/cover.jpg)\n\n# 旧电脑，新生命：使用 Ubuntu 修复旧硬件\n\
    \n作者：Stefan Neagu, [`tuxgeek.me`](http://tuxgeek.me)  \n编辑：Justin Pot\n\n本手册是\
    \ MakeUseOf 的知识产权。它必须以其原始形式发布。未经 MakeUseOf.com 许可，禁止使用本指南的部分内容或重新发布经过修改的部分内容。\n\
    \n你认为自己有能力为 MakeUseOf.com 编写一份指南吗？我们随时欢迎听取建议！请将你的想法发送至 justinpot@makeuseof.com；你可能会获得高达\
    \ 400 美元的奖励。\n\n# 目录\n\n- 引言\n- 准备\n- 安装\n- 初始配置\n- 进阶配置\n- 其他发行版概述\n- 结论\n- MakeUseOf\n\
    \n# 引言\n\n多年来，计算机行业的演变速度比当代历史上任何行业都要快。一年又一年，工程师们英勇工作，为我们这些终端用户带来更快速、更强大的硬件，同时又不牺牲可靠性。程序员和应用开发者也同样快速地开发出新软件，以利用新的硬件规格。\n\
    \n然而，在努力销售更多产品的同时，营销部门希望我们相信，台式电脑、笔记本电脑和上网本在几年后就会过时，而且不更换它们会让我们变成“卢德分子（旧技术的反对者）”。\n\
    \n事实并非如此。除了高端游戏外，一台 2006 年购买的中级系统在 2011 年依然能够提供足够完成工作和娱乐的功能。文字处理、网页浏览、看电影——无论是来自\
    \ DVD 还是来自你位于 Pirate Bay 的朋友——都不应该让你的旧系统感到为难，前提是它的配置正确、已更新，并运行着一个高效、以性能为导向且“像免费啤酒和言论自由一样免费”的操作系统。\n\
    \n## 每日享受 FLOSS\n\nFLOSS 是 `free/libre/open-source software`（自由/开源软件）的缩写。全球开发者免费贡献不同类型的开源项目。任何具有所需编程技能的人都可以查看、使用并改进代码，以造福整个社区。这类项目的示例包括\
    \ Mozilla Firefox、Chromium、大多数 Linux 发行版（如 `Ubuntu`）、VLC（一种媒体播放器）等。世界上有成千上万种免费应用程序，它们涵盖了现代软件环境中普通用户\
    \ 90% 的计算需求。\n\n从个人角度而言，在 2001 年的 `Ubuntu 7.04` 机器上运行《极速竞飙：碳》，我的帧率比在同一机器上运行 Windows\
    \ XP SP3 时更高（每秒多出 14-17 帧）。这还是在后台运行了一个仿真软件，用于翻译 DirectX 加速所需的 `Win32` 库，而 [Ubuntu](http://www.makeuseof.com/tag/ubuntu-1104-unity-big-leap-linux/)\
    \ 并不具备这些库。\n\n很讽刺，不是吗？多亏了 FLOSS，我们可以让那台旧电脑发挥余热——而且不需要你投入任何资金。\n\n## 用场景\n\n那么，我们要用你的旧\
    \ PC 做什么呢？有几种选择；取决于你的配置、计算机技能以及愿意投入该项目的时间。本指南涵盖了基础设置。\n\n- **台式 PC** – 我们可以把你的那台用来落灰的旧\
    \ PC 变成一台功能完整的机器，用于浏览网页、电子邮件、聊天、文字处理、表格、电影和低端 3D 游戏。最情况下，你只需要购买额外的内存。这需要的超过一个下午和几杯咖啡。要实现这些功能，你只需按照本指南提供的操作系统安装说明和媒体包即可。\n\
    - **本地文件服务器/备份** – 我们可以更换旧硬盘，或者连接一个容量更大、速度更快的外部硬盘。通过无线网卡和一些软件，我们可以构建一个 DIY 版 [Apple\
    \ Time Capsule](http://www.apple.com/timecapsule/)。这种服务器可以用来集中存储所有的音乐、照片和文档，并让本地网络上的任何计算机都能随时调用。你甚至可以设置\
    \ FTP 服务，以便在你不在家时访问文件。这可能会有点复杂，因为需要静态 IP、命令行输入以及了解如何处理 FTP 客户端。你需要做的只是安装 `SAMBA`\
    \ 并配置它。跳过媒体包的安装说明。\n- **儿童学习中心** – Ubuntu 软件仓库中有数百种教育游戏，如果你有 12 岁以下的孩子，这是一个极佳的选择。他们可以学习数学、历史、地理，而且得益于\
    \ Linux 发行版自带的家长控制和高级安全性，无需担心病毒、间谍软件和网络跟踪者。按照提供的说明操作，但跳过 `SAMBA` 的安装。查看“软件包”章节。\n\
    \n## 什么是 Ubuntu？\n\nUbuntu 是由 Canonical 官方支持的 Linux 发行版。Canonical 团队通过捐赠和商业活动（如为企业客户提供支持和技术援助）获得的资金，积极支持开发操作系统的开发者。\n\
    \n它是最受欢迎的 Linux 发行版，受益于快速的发布计划、错误测试以及 [ubuntuforums.org](http://ubuntuforums.org)\
    \ 大型支持社区。作为一个 FLOSS 项目，它也是免费提供的。\n\n![](img/1.jpg)\n\n上方，Ubuntu Linux 11.04 (Natty\
    \ Narwhal) 运行在虚拟机，规格类似于低端 PC。作为一种广泛使用的多功能高效操作系统，Ubuntu 是我们定制的理想构建模块。\n\nUbuntu\
    \ 预装了一系列 [软件](http://www.makeuseof.com/tag/5-tips-tricks-ubuntu-software-center-linux/)：LibreOffice（11.04\
    \ 之前的版本为 OpenOffice）、Firefox、Empathy（Pidgin）、Transmission、GIMP（10.04 之前的版本）以及几个轻量级游戏（如数独和象棋）。对于额外的软件包，我将展示如何使用\
    \ Synaptic 软件包管理器。\n\n最低硬件要求为：\n\n- 服务器版 – x86 处理器 300Mhz；128MB 内存，硬盘 1GB 可用空间，分辨率至少\
    \ 640x480 的显示器。\n- 桌面版 – x86 处理器 1Ghz；384MB 内存，硬盘 5GB 可用空间，分辨率至少 1024x768 的显示器。\n\
    \n用通俗的话说，这意味着任何 2002 年以后购买的新电脑都能运行良好。虽然所有的视觉特效可能无法实现（Unity 桌面主题、3D 合成、高清视频、视频流），但你能够完成所有基础任务。\n\
    \n## Ubuntu 如何赋予电脑新生命？\n\n### Ubuntu 是高效的\n\nLinux 发行版源于服务器房数十年的经验，如果说系统管理员在 OS（操作系统）中欣赏某些东西，那就是效率：简洁、精炼的代码，在完成任务的同时不浪费\
    \ CPU（中央处理器）周期。从引导加载程序（启动时初始化操作系统的微程序）到窗口管理器，即使只多花五秒钟也是系统管理员无法忍受的。\n\n"
- fmt: '

    Simply put: Linux in general and Ubuntu specifically, is great at making old computers
    seem new because it makes better use of the hardware on your PC. It is designed
    to get the job done in the most efficient way, with the least possible strain
    on the hardware resources as humanly possible. I say humanly possible because
    there is a programming principle that dictates that a compromise must be made
    between [portability of the code](http://en.wikipedia.org/wiki/C_(programming_language)%23Uses)
    and overall efficiency. This is the main reason for choosing Ubuntu as a platform
    for this project.


    ## Ubuntu is customizable


    Ubuntu allows its users to easily [customize](http://www.makeuseof.com/tag/6-handy-sites-learn-ubuntu-tweaks-tricks/)
    every aspect about the machine’s functionality.


    ## Ubuntu doesn’t require an investment


    It’s easy enough to use that you don’t need to spend money on training courses
    or books. 99% of applications designed for it are completely free of charge.


    ## In the other camp


    Developers at Microsoft don’t have the whole developer community bearing down
    and poking at their code – pointing out flaws – there is less accountability,
    because only the specific team working on the project can see and modify the source
    code. Plus, as their main market products are aimed at end-user consumers, they
    don’t stand for the efficiency principle REQUIRED in server rooms, where Linux
    is at home.


    ## Linux is a modular operating system


    Considering the wealth of options available from both the perspective of operating
    systems and software, you can customize a machine that is specifically designed
    to suit your needs – remote video monitoring, food recipe database, a control
    panel for an awesome laser projector that changes intensity in sync with the beat
    of music; you can build whatever you want.


    A testament to the modular design of Linux is that a variant of Red Hat Linux
    is used to control the electro-magnets inside the Large Hadron Collider. As an
    OS, Ubuntu is small building blocks amounting to a whole. Even if it is not covered
    in this guide, you can use the old machine to [perform any tasks](http://www.makeuseof.com/tag/6-fun-ways-explore-ubuntu-1010-linux/)
    you can think of. It’s up to you to research niche software that serves your purpose.


    This ability to add and drop functionality according to your use case is another
    point for efficiency, what is needed for old hardware.


    # Preparation


    ### Backing up


    Before we get to the good stuff, we need to do some preparation work. Although
    you’re probably no longer using the system, you should open it and search for
    documents, videos, photos, music that you haven’t got around to backing up. Be
    cautious and check twice, because we’ll need to erase everything from the hard
    drive later on.


    Backing up is not a difficult task to achieve although it may be tedious if you
    have lots of data scattered around on that old hard drive.


    The easiest way to save your files is to plug in the USB port at the back of the
    computer an [external hard drive](http://en.wikipedia.org/wiki/External_hard_drive%23External_removable_drives).


    1. Double clicking on the `My Computer` icon on the Desktop or in the Start menu
    will reveal a window which contains the file tree of the external hard drive.


    2. Find and copy the necessary files by selecting them and tapping `Ctrl+C`, activating
    the external hard disk file tree by clicking inside the window we opened earlier,
    and tapping `Ctrl+V`. Alternatively, you can select the files and drag’n’drop
    them into the external hard drive window.


    If you don’t own an external hard drive or a USB stick, you could use the CD/DVD
    burner and software such as `CDBurnerXP` or `InfraBurner` to safely store your
    files on optical media. MakeUseOf has articles on a range of [suitable software](http://www.makeuseof.com/tag/the-best-free-alternatives-to-nero-cddvd-burner/).
    If you don’t know how to burn your files to a disk, MakeUseOf has an article [explaining
    all the steps for ImgBurn](http://www.makeuseof.com/tag/imgburn-easy-free-cd-and-dvd-burner-app/).


    If you have software that [automatically backs up your data](http://www.makeuseof.com/tag/what-do-you-get-if-you-combine-dropbox-and-mozy-wuala/)
    to the cloud, such as `Mozy` or `Dropbox`, all you need to do is connect the computer
    to the Internet and wait for the application to complete the syncing process.
    Depending on the number and size of the files, it may take a while; be patient.


    ### Checking your specifications


    Knowing a little about the hardware inside your computer is important later on
    if there are compatibility issues. It is important that you write these down now
    because if something breaks during the installation process or at first boot,
    you will need to search the various forums of the Ubuntu community for a driver,
    kernel patch or package.


    ![](Images/2.jpg)


    We don’t need to write down all of the hardware specifications because drivers
    for things such as Ethernet cards are 99.99% of the time compatible. Bluetooth
    chips, card readers and printers are trickier but most of them are supported as
    well by default. Even if, let’s say, you have a very rare Ethernet card, we can
    just use the `System Profiler` tool to discover the specifications after we’re
    done installing the operating system.


    If you’re running Windows, `msinfo32` is a small program included with Windows
    2000, Me, XP and later versions of Windows. This program gives you a comprehensive
    view of all the hardware present in your system.


    1. Click `Start`.

    2. Type `msinfo32` and press `enter`.


    For Windows 7 and Windows Vista, follow these steps:


    1. Click `Start`.

    2. Choose `Control Panel`.


    ## Getting Ubuntu


    The easiest and most convenient way to get Ubuntu is to download the `.ISO` image
    file, which is available at Ubuntu.com or from mirror servers around the world.
    While downloading from the Canonical server is straightforward, downloading from
    a mirror is faster.


    For example, I use [the mirror](http://ftp.roedu.net/mirrors/ubuntux.org/) provided
    by a student union which has a speed of around 1.2MB/s.


    1. Open your web browser and click on [this link](http://www.ubuntu.com/download/download).
    There should be a red button indicating “Ubuntu 11.04 32-bit”. That is the version
    we’re looking for. A few months from the publishing of this guide, the version
    number will change to look something along the lines of “Ubuntu XX.0X 32-bit”.
    It’s okay, this should work just as well (in theory).


    2. Alternatively, open up Google and search for “ubuntu mirror” + “name-of your-country”.
    Download the latest version available, by looking at the right column of the FTP
    table which contains the file timestamp. You need a file that has this sort of
    filename `ubuntu-XX.0X-desktop-i386.iso` where the XX.0X represents the version
    number.


    3. Click on Start Download and save the file if requested.


    After downloading the image file we need to burn it onto a CD or create a bootable
    USB stick. To burn an image CD, we’re going to use one of my favorite pieces of
    software, `ImgBurn`.


    1. Download ImgBurn by clicking the [Download button on this page](http://www.softpedia.com/get/CD-DVD-Tools/Data-CD-DVD-Burning/ImgBurn.shtml),
    available courtesy of Softpedia.

    2. Install and open `ImgBurn`.

    3. Select `Write Image File to Disk` and choose the file we downloaded earlier.

    4. Insert a blank CD and click on `Burn`.


    To create a bootable USB stick, follow these steps:

