    all the steps for ImgBurn](http://www.makeuseof.com/tag/imgburn-easy-free-cd-and-dvd-burner-app/).


    If you have software that [automatically backs up your data](http://www.makeuseof.com/tag/what-do-you-get-if-you-combine-dropbox-and-mozy-wuala/)
    to the cloud, such as Mozy or Dropbox, all you need to do is connect the computer
    to the Internet and wait for the application to complete the syncing process.
    Depending on the number and size of the files, it may take a while; be patient.


    ## Checking your specifications


    Knowing a little about the hardware inside your computer is important later on
    if there are compatibility issues. It is important that you write these down now
    because if something breaks during the installation process or at first boot,
    you will need to search the various forums of the Ubuntu community for a driver,
    kernel patch or package.


    ![](Images/2.jpg)


    We don’t need to write down all of the hardware specifications because drivers
    for things such as Ethernet cards are 99.99% of the time compatible. Bluetooth
    chips, card readers and printers are trickier but most of them are supported as
