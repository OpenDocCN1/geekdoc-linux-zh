- fmt: '

    1. Download “USB Installer” by following [this link](http://www.pendrivelinux.com/downloads/Universal-USB-Installer/Universal-USB-Installer.exe).

    2. Select Ubuntu 11.04 (or another appropriate version depending on your time
    of reading) from the dropdown list.

    3. Select the image file we downloaded earlier.

    4. Go to My Computer and locate the drive letter corresponding to the USB drive
    (ex.: `K:`, `G:`, etc.) then select the correct drive letter from the dropdown
    menu in `ImgBurn`.

    5. Click on `Create` and wait for the process to finish.


    Now that we’ve successfully created our installation media, we need to find out
    how to boot from it. It differs from computer to computer, but if you pay attention
    closely when you turn on your computer, there should be a BIOS message appearing
    shortly on the screen that says something like “Press F12 now to boot from alternative
    media” or “Press DEL to run Setup”. If you don’t know how to boot from a CD or
    a USB drive, Hiren.info has a [complete guide](http://www.hiren.info/pages/bios-boot-cdrom)
    for most of the BIOS manufacturers.


    **Important**: Make sure you’ve backed up ALL YOUR DATA before proceeding further.
    We are going to format the entire hard drive, which means all data not backed
    up will be **PERMANENTLY LOST**.


    # Installation


    Installing a Linux distribution used to be an insipid task back in the day (believe
    me, you don’t want to spend Saturday nights compiling the kernel) but it has become
    easier over the years. In many respects, it’s easier to install Ubuntu than any
    modern version of Windows.


    1. Insert the CD or USB stick containing the OS image we’ve burned earlier.

    2. Shut down and then turn on your computer.

    3. Boot from the installation media, either the CD or USB stick.


    ### Step 1

    Select your language from the panel on the left side, then click on the “Install
    Ubuntu” button on the right.


    ![](Images/3.jpg)


    ### Step 2

    At the “Preparing to install Ubuntu” window, make sure all the requirements have
    green check arrows next to them. If you don’t have Internet connectivity yet,
    don’t panic, it’s not imperative.


    Make sure the option to “install this third party software” at the bottom of the
    window is selected. It will ensure that Ubuntu will be able to play MP3 music
    files out of the box. If you have an Internet connection, also check the “Download
    updates while installing” checkbox.


    ![](Images/4.jpg)


    ### Step 3

    At the next screen, choose the third option in the list called “Erase everything
    and reinstall”. It will **format the hard drive** using the `ext4` filesystem
    – allowing us to start from scratch with all the hard drive capacity available
    to the OS.


    ![](Images/5.jpg)


    ### Step 3*

    If Ubuntu can’t detect your keyboard layout, you will be asked to manually do
    so. If you know the type of keyboard layout you have, select it from the list
    and click “Forward”. If not, just leave the default choice selected and click
    “Forward”.


    ### Step 4

    At the next window, enter the requested information, such as your name, account
    username and password. You will need your username and password later on – so
    make sure you write them down and keep them in a safe place.


    ![](Images/6.jpg)


    ### Step 4*

    If you want to store sensitive information such as work documents, passwords,
    bank account information and your system has more than 512MB of RAM and a processor
    with at least a clock speed of 1,5Ghz, also select the checkbox named “Encrypt
    my home folder”.


    Use the [GRC password creator](https://www.grc.com/passwords.htm) in order to
    obtain a high-strength passphrase. Use the third field, and select a password
    at least 16 characters in length.


    ![](Images/7.jpg)


    ### Step 5

    You’re almost done, congratulations. All you need to do now is select the time
    zone specific to your geographic location. In my case, it’s GMT+2 Bucharest.


    ![](Images/8.jpg)


    ### Step 6

    Let the installer complete, and then restart your computer when prompted to do
    so. Make sure that all installation media are removed from the computer before
    restarting. A message will appear on the screen at the appropriate time to do
    so.


    # Initial configuration


    Note: There is a small chance that your system will have enough horse-power to
    run the Unity 3D user interface. This means that your hardware is relatively new.
    Instructions provided in this guide are aimed at low-end PCs which will only be
    compatible with the default window manager and Unity 2D. This is how Unity 3D
    looks:


    ![](Images/9.jpg)


    This is a screenshot of Unity 3D running on Ubuntu 11.04 courtesy of [WebUpd8](http://www.webupd8.org/).
    Later in this guide, I will provide instructions on how to install and enable
    the Unity 2D, less resource-intensive version of this UI (user interface).


    The following instructions are based on the assumption that your hardware is old
    – the premise of this guide as stated in the title and introduction.


    ## First steps


    Unlike Windows, Ubuntu comes pre-installed with a bunch of [software](http://www.makeuseof.com/pages/best-linux-software)
    that covers all the basic needs of a computer user. This is a great time to familiarize
    yourself with the desktop, user interface and applications.


    ![](Images/10.jpg)


    **Main Menu**: On the upper left side of the screen you will see three menus and
    the Firefox icon. Select “Applications” and look around. All of them were written
    with ease of use, and many resemble their closed source counterparts. For example,
    empathy – the chat application – was made to resemble an earlier version of Yahoo!
    Messenger. It however supports multiple protocols: Google Chat, Facebook, Yahoo!
    Messenger, Jabber and more.


    ![](Images/11.jpg)


    **Notification Area**: On the upper right side of the screen you’ll see some icons,
    the clock, your username and the Shutdown button. Hover with your mouse above
    each icon and discover additional information provided to you by the system.


    For example, the diverging arrows icon represents Connectivity; if there are network
    cards present, they should appear here. The default nomenclature is `eth%` for
    Ethernet cards and `ath%` for wireless network cards. If a wireless connection
    is present, a dialog box will appear automatically requesting you to choose WiFi
    access point and input a password (if the network is protected).


    If you configured empathy earlier with your chat credentials, the bubble next
    to your username will visually confirm your availability. In my case, it shows
    an X, for “signed out” or offline.


    **Folders and window bar**: Select Places from the main menu at the top, then
    click on Home Folder. This is where you store all your files – they are equivalents
    to My Documents, My Photos and so on from Windows.


    At the bottom of the screen, notice a new rectangle showing your username. This
    is the equivalent to the taskbar. Every new window you open will appear down there
    and you can select it with your mouse to bring focus to it.


    On the right, there are four smaller rectangles; they represent workspaces – like
    having four virtual monitors. You can use one for all your work related windows,
    one for Facebook and chat, one for the music player and so on. The last icon in
    the bar is the Trash.


    ## Installing updates and extra packages


    There are two ways of installing [applications](http://www.makeuseof.com/tag/repositories-package-management-ubuntu/)
    on your Ubuntu machine: using the graphical user interface and using the command
    line (the Terminal). I will illustrate both methods, so you can familiarize yourself
    with each.


    We’re going to need Internet connectivity for the next section. If the wireless
    card doesn’t work, try connecting using the Ethernet port directly to your router.
    In 99% of configurations it is set up to connect automatically to your computer
    using DHCP and then to the Internet with no hassle on your part.

