    简单来说：Linux 整体以及特别是 Ubuntu，非常擅长让旧电脑焕然一新，因为它们能够更有效地利用你 PC 上的硬件。它的设计目标是以最高效的方式完成任务，并尽可能地对硬件资源造成最最小的负担。我之所以说“在人类可能的”，是因为有一项编程原则规定，在[代码的可移植性](http://en.wikipedia.org/wiki/C_(programming_language)%23Uses)和整体效率之间必须进行权衡。这就是选择
    Ubuntu 作为此项目平台的主要原因。


    ## Ubuntu 是可定制的


    Ubuntu 允许用户轻松地[自定义](http://www.makeuseof.com/tag/6-handy-sites-learn-ubuntu-tweaks-tricks/)机器功能的每一个方面。


    ## Ubuntu 不需要投入


    它非常易用，以至于你不需要在培训课程或书籍上花费资金。99% 为其设计的应用程序都是完全免费的。


    ## 在另一阵营中


    微软的开发者并没有整个开发者社区在盯着并挑剔他们的代码——指出缺陷——因此问责制相对较小，因为只有负责项目的特定团队才能看到并修改源代码。此外，由于他们的主要市场产品面向终端用户消费者，他们并不代表服务器房中**必须**的效率原则，而
    Linux 正是那里的。


    ## Linux 是一个模块化的操作系统


    考虑到从操作系统和软件角度来看丰富的选择，你可以定制一台专门为你的需求设计的机器——远程视频监控、食谱数据库、用于一个酷炫激光投影仪的控制面板（其强度会随音乐节拍同步）；你可以构建任何你想要的东西。


    Linux 模块化设计的证明是，红帽 Linux 的变体被用于控制大型对撞撞机内部的电磁。作为一个操作系统，Ubuntu 是由小构建块组成的整体。即使本指南没有涵盖，你也可以使用旧电脑[执行任何你能想到的任务](http://www.makeuseof.com/tag/6-fun-ways-explore-ubuntu-1010-linux/)。你需要自己研究符合你用途的小众软件。


    这种根据你的用例添加或删除功能的能力是另一个效率优势，这对于旧硬件至关重要。


    # 准备


    ### 备份


    在进入正文之前，我们需要做一些准备工作。虽然你可能已经不再使用该系统，但你应该打开它，搜索还没有来不及备份的文档、视频、照片和音乐。请保持谨慎并检查两次，因为稍后我们需要擦除硬盘上的所有内容。


    备份并不是一项困难的任务，尽管如果你在那块旧硬盘上散落着大量数据，这个过程可能会很繁琐。


    保存文件最简单的方法是在电脑背后的 USB 接口上插入一个[外接硬盘](https://en.wikipedia.org/wiki/External_hard_drive%23External_removable_drives)。


    1. 在桌面或开始菜单中双击`我的电脑` 图标，将显示一个包含外接硬盘文件树的窗口。


    2. 通过选择文件并按 `Ctrl+C` 来找到并复制必要的文件，点击我们之前打开的窗口以激活外接硬盘文件树，然后按 `Ctrl+V`。或者，你可以选择文件并将它们拖放到外接硬盘的窗口中。


    如果你没有外接硬盘或 U 盘，可以使用 CD/DVD 刻录机以及诸如 `CDBurnerXP` 或 `InfraBurner` 等软件，将你的文件安全地存储在光介质上。MakeUseOf
    有关于一系列[合适软件](http://www.makeuseof.com/tag/the-best-free-alternatives-to-nero-cddvd-burner/)的文章。如果你不知道如何将文件刻录到磁盘，MakeUseOf
    有一篇文章[介绍了 ImgBurn 的步骤](http://www.makeuseof.com/tag/imgburn-easy-free-cd-and-dvd-burner-app/)。


    如果你有可以[自动备份数据到云端](http://www.makeuseof.com/tag/what-do-you-get-if-you-combine-dropbox-and-mozy-wuala/)的软件，例如
    `Mozy` 或 `Dropbox`，你只需要将电脑连接到互联网并等待应用程序完成同步过程。取决于文件的数量和大小，可能需要一段时间；请耐心等待。


    ### 检查你的规格


    了解电脑内部的硬件对于以后出现兼容性问题非常重要。现在写下这些信息很重要，因为如果在安装过程中或首次启动时出现故障，你需要在 Ubuntu 社区的各种论坛中搜索驱动程序、内核补丁或包。


    ![](img/2.jpg)


    我们不需要写下所有的硬件规格，因为以太网卡等设备的驱动程序在 99.99% 的情况下都是兼容的。蓝牙芯片、读卡器和打印机更棘手，但大多数默认也被支持。即使（比如）你有一块非常罕见的以太网卡，我们也可以在安装操作系统完成后使用
    `System Profiler` 工具发现规格。


    如果你运行的是 Windows，`msinfo32` 是 Windows 2000、Me、XP 及更高版本 Windows 自带的小型程序。该程序可以提供系统中所有硬件的详细视图。


    1. 点击`开始`。

    2. 输入 `msinfo32` 并按回车。


    对于 Windows 7 和 Windows Vista，遵循以下步骤：


    1. 点击`开始`。

    2. 选择`控制面板`。


    ## 获取 Ubuntu


    获取 Ubuntu 最简单方便的方法是下载 `.ISO` 镜像文件，可以通过 Ubuntu 或或镜像服务器下载。虽然从官方服务器下载很直接，但从镜像下载更快。


    例如，我使用学生会提供的[镜像](http://ftp.roedu.net/mirrors/ubunt.org/)，速度约为 1.2MB/s。


    1. 打开浏览器并点击[此链接](https://www.ubuntu.com/download/download)。那里应该有一个红色的按钮显示“Ubuntu
    11.04 32-bit”。这就是我们要的版本。在本文指南发布几个月后，版本号会变为“Ubuntu XX.0X 32-bit”。


    2. 或者，打开 Google 搜索“ubuntu mirror” + “你的国家名称”。通过 FTP 表格右侧包含时间戳的列下载最新版本。你需要一个文件名类似于
    `ubuntu-XX.0X-desktop-i386.iso` 的文件，其中 XX.0X 代表版本号。


    3. 点击开始下载并在提示时保存文件。


    下载镜像文件后，我们需要将其刻录到 CD 上或创建一个可启动的 U 盘。若要刻录镜像 CD，我们将使用我最喜欢的软件之一——`ImgBurn`。


    1. 通过点击[此页面上的下载按钮](https://www.softpedia.com/get/CD-DVD-Tools/Data-CD-DVD-Burning/ImgBurn.shtml）（感谢
    Softpedia）下载 ImgBurn。

    2. 安装并打开 `ImgBurn`。

    3. 选择`写入映像文件到磁盘`并选择我们之前下载的文件。

    4. 插入空白 CD 并点击`刻录`。


    若要创建可启动 U 盘，请遵循以下步骤：


