  trans: '


    如果你无法使用该设备，请尝试使用 USB 无线网适配器。如果你没有，可以向朋友借一个。本指南包含一个“故障排除”部分，可以帮助你修复 WiFi 网卡问题——但你仍然需要一种访问互联网的临时方法。


    ### 安装更新


    确保所有软件都是最新版本，只需进入 `System>Administration>Update Manager` 并点击 `Install Updates`。这不仅会更新系统文件和系统实用程序，还会更新所有已安装的软件，例如
    LibreOffice 文字处理器和 Empathy。


    ![](img/13.jpg)


    或者，打开 `Terminal` 并输入 `sudo apt-get update`，然后输入 `sudo apt-get upgrade` 来实现相同的任务。


    ### 安装额外组件


    前往 `Applications>Ubuntu Software Center`。


    ![](img/14.jpg)


    点击右上角的搜索框并输入包名。在这种情况下，输入 `ubuntu-restricted-extras`。选择该包并点击 `Install`。


    `ubuntu-restricted-extras` 软件包是一组常用应用程序的集合（例如 Adobe 的 Flash Player、微软的 TrueType
    字体、Java 虚拟机、对 RAR 存档的支持），由于法律限制，它们无法包含在 Ubuntu 的默认安装中。在 Windows 电脑上安装同一批应用程序最快也需要半小时。


    我之前描述的过程适用于你可能需要的任何包，只需根据教程中提供的名称或朋友告诉你的名称进行搜索。


    使用命令行实现相同任务非常简单。前往 `Applications>Accessories>Terminal`。输入 `sudo apt-get install
    ubuntu-restricted-extras` 并按回车。


    ## 仓库盛宴


    默认情况下，Ubuntu 11.04 将尝试运行 3D Unity 主题。虽然它视觉上更美观，但会消耗资源。


    不过，你可以获得不带 3D 的 Unity。要安装 Unity 2D，打开 Ubuntu Software Center 并搜索 `unity 2d`。选择该包并点击
    `Install`。如果它没有出现在列表中，说明你没有安装必要的仓库。请使用步骤 1* 中描述的方法。


    前往 `Applications>Accessories>Terminal`。然后输入 `sudo add-apt-repository ppa:unity-2d-team/unity-2d-daily`，这将为系统提供包的位置。输入
    `sudo apt-get update` 来更新你所有的软件和仓库列表。


    最后输入 `sudo apt-get install unity-qt-default-settings` 完成安装。然后注销。在登录界面上，你会在下拉菜单中看到
    `Unity Qt`。选择它并重新登录。


    终端命令示例：


    ![](img/15.jpg)


    ### 简单的偏好管理


    Ubuntu Tweak 是一个小型应用程序，它消除了配置高级系统设置、清理和安装其他精巧包的所有繁琐工作。


    在命令行提示符下输入 `sudo add-apt-repository ppa:tualatrix/ppa` 并按回车；该命令指示 `apt` 守护进程去哪里搜索此额外软件。输入
    `sudo apt-get update` 并按回车；这确保了你所有的包都是最新的。输入 `sudo apt-get install ubuntu-tweak`
    并按回车；最后这条命令会获取所需文件并安装该应用程序。


    ![](img/16.jpg)


    探索该软件，你会发现各种调整选项。例如：前往 `Applications>System Utilities>Ubuntu Tweak`。点击 `Source
    Center>File Sharing>Transmission Stable builds checkbox>Sync`。Transmission 是顶级的
    Torrent 和磁力客户端，在默认仓库中不可用。


    我们只需点击几次就加入了仓库并安装了 Transmission——无需命令行，也无需寻找仓库链接。


    ### 媒体兼容性


    “Medibuntu 是一个打包项目，专门分发各种原因无法包含在 Ubuntu 中的软件，这些原因与知识产权法律差异、安全和其他问题有关。” Medibuntu
    包含非免费解码器（如 `WMV`）以及对加密 AAC 文件（在 iTunes 上购买的歌曲）的支持。


    要安装此仓库，打开 `Terminal` 并输入 `sudo wget --output- document=/etc/apt/sources.list.d/medibuntu.list
    http://www.medibuntu.org/sources.list.d/$(lsb_release -cs).list && sudo apt-get
    --quiet update && sudo apt-get --yes --quiet --allow-unauthenticated install medibuntu-keyring
    && sudo apt-get --quiet update` 并回车。


    **电影**：此步骤仅适用于你想用机器播放电影。如果你想建立文件服务器，请跳过此处。


    在 `Terminal` 中输入 `sudo apt-get install vlc`，按回车；输入 `sudo apt-get install non-free-codecs
    libxine1-ffmpeg gxine mencoder libmpcdec3 libquicktime1 flac faac faad sox ffmpeg2theora
    libmpeg2-4uudeview flac libmpeg3-1 mpeg3-utils mpegdemux liba52-dev mpeg2dec vorbis-tools
    id3v2 mpg321 mpg123 libflac++6 ffmpeg libmp4v2-0totem-mozilla icedax tagtool easytag
    id3tool lame nautilus-script- audio-convert libmad0 libjpeg-progs`。


    对于 DVD 支持，输入 `sudo apt-get install libdvdcss2 && sudo /usr/share/doc/libdvdread4/./install-css.sh`
    并按回车。


    此步骤将下载并安装让你享受所有娱乐内容的软件。


    ### 额外软件


    打开 Ubuntu Software Center 并搜索 Samba、Deja dup、Skype。找到每个包后并点击安装。


    **Samba**：通过 Samba 可以与局域网中的其他电脑共享文件变得简单。在 Terminal 中输入 `sudo apt-get install samba`
    并按回车。我将在本指南后面教你如何使用 Samba。我们还需要 `sudo apt-get install system-config-samba` 作为
    `SMB` 守护程序的图形化界面。


    **备份**：如果你打算将这台机器作为工作站，你可能希望文件自动备份。最简单的方法是使用 Deja-Dup。在 Terminal 中输入 `sudo apt-get
    install deja-dup`。我将在本指南后面教你如何使用。


    **Skype**：如果你在 Windows 上用过 Skype，我确定你会在你的 Ubuntu 设备上想要相同的功能。在 Terminal 中输入 `sudo
    apt-get update && sudo apt-get install skype`。


    它安装了一个名为 Skype 的流行 VOiP 应用。你可以与其他拥有 Skype 的人聊天，或从你的电脑拨打电话。


    # 进一步配置


    ## 解决硬件兼容性


    由于自由开源软件（FLOSS）社区是分散的且设计上并非集中组织，有时硬件制造商会忽视这个不断增长的社区的需求。越来越多的私有驱动通过 `Additional
    Drivers` 工具提供给用户安装。你可以通过 `System>Administration>Additional Drivers` 访问它。


    该工具会自动检查供应商和产品 ID，以尝试为你定位私有驱动程序。由于法律限制，这些驱动程序无法默认安装，但你可以手动安装。


    ![](img/17.jpg)


    如果有可用驱动程序，它会像截图所示。对于 WiFi 网卡（这是最常见的头疼和熬夜阅读论坛帖子的原因），有一个名为 `ndiswrapper` 的工具。该工具能够将为
    Windows 编写的驱动文件 (.sys/.inf) 转换为与 Ubuntu 。


    ![](img/18.jpg)


    1. 使用 Ubuntu Software Center 安装名为 `ndisgtk` 的包。


    2. 前往 `System>Administration>Windows Wireless Drivers` 或打开 Terminal 窗口并输入 `sudo
    ndiskgtk`。


