    `Lubuntu` - created by a team of Taiwanese and French developers, Lubuntu was
    designed to be as lightweight as possible. The main difference between it and
    Ubuntu is the window manager, `LXDE` (Lightweight X11 Desktop Environment). It
    comes pre-installed with `AbiWord` instead of `LibreOffice`.


    `Xubuntu` – with its origins traced to the Isle Of Man, Xubuntu is yet another
    distribution based on the Ubuntu core. It uses `Xfce`, a relatively newer window
    manager also designed for low hardware requirements.


    `Joli OS` – based on Ubuntu and Debian, Joli OS is fast and the most user friendly
    of the bunch. Intended as a netbook OS, it has a “heavy orientation towards web
    applications and services”, integrated online backup, it comes pre-installed with
    a variety of non-free codecs and integrates popular social networks like Facebook
    and Twitter within its interface.


    `Peppermint` – taking off Debian and Ubuntu, Peppermint OS was designed with cloud
    computing in mind, integrating by default Mozilla’s `Prism` technology – making
    web apps appear as local. It’s easy on hardware because it is primarily inteded
    for netbooks.


    `Frugalware Linux` – is a Slackware variant which employs the `Blackbox` window
    environment. By its Slackware origins I can tell you that it’s fast, robust but
    harder to operate.


    You can find more distributions and relevant information about each one on [DistroWatch.org](http://distrowatch.com/).


    # Conclusion


    The possibilities are only restricted to the time you’re willing to spend searching
    for packages and reading documentation. The beauty of FLOSS is that there are
    no restrictions, you can always pick up someone else’s work and improve on it
    – “scratching your own itch” as Richard Stallman put it.


    Others like you may benefit, be grateful and in turn learn and develop your work
    into something that “sometimes works” (from a `python` script I used a couple
    of years back).


    *Let me take you for a ride With the devil in the details We''ll kiss and tremble
    with delight* -Placebo


