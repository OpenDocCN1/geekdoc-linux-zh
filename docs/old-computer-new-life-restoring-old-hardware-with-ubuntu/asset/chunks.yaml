    `Lubuntu` - Lubuntu 由一个台湾和法国开发人员团队创建，设计旨在尽可能轻量化。它与 Ubuntu 的主要区别在于窗口管理器 `LXDE`（轻量级
    X11 桌面环境）。它预装了 `AbiWord` 而不是 `LibreOffice`。


    `Xubuntu` – Xubuntu 的起源可以追溯到曼岛，是另一个基于 Ubuntu 核心的发行版。它使用 `Xfce`，这是一个较新的窗口管理器，同样是为低硬件需求而设计的。


    `Joli OS` – Joli OS 基于 Ubuntu 和 Debian，是这些系统中速度最快且最易用户的。它旨在作为一种笔记本电脑操作系统，“高度侧重于
    Web 应用程序和服务的”，集成了在线备份功能，预装了多种非免费解码器，并在界面中整合了 Facebook 和 Twitter 等流行的社交网络。


    `Peppermint` – Peppermint OS 基于 Debian 和 Ubuntu，设计时考虑了云计算，默认集成了 Mozilla 的 `Prism`
    技术——使 Web 应用程序看起来像本地应用。它对硬件很友好，因为它主要为笔记本电脑设计。


    `Frugalware Linux` – 是一种采用 `Blackbox` 窗口环境 Slackware 变体。根据其 Slackware 的起源，我可以告诉你它快速、健壮，但操作难度较大。


    你可以在 [DistroWatch.org](http://distrowatch.com/) 上找到更多发行版以及关于每个发行版的相关信息。


    # 结论


    可能性仅取决于你愿意花多少时间寻找软件包和阅读文档。FLOSS（自由及开源软件）的魅力之处在于没有任何限制，你总是可以选择他人的工作并进行改进——正如理查德·斯托曼（Richard
    Stallman）所说，“解决自己的奇痒（scratching your own itch）”。


    像你这样的其他人可能会从中受益、心存感激，并反过来学习将你的工作开发成某种“有时能用”（`sometimes works`）的东西（这源自我几年前用的一个
    `python` 脚本）。


    *Let me take you for a ride With the devil in the details We''ll kiss and tremble
    with delight* -Placebo


