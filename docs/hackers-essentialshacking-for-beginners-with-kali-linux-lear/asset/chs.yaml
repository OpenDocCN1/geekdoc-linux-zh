  \ 按钮，选择 `192.168.29.2` 并点击 `Add to Target 2` 按钮，然后就可以开始攻击。\n```\n\n\n\n输出信息详细描述了\
  \ `SET`。这些信息仅会在首次运行时显示。在界面接受这部分信息后，可以执行其他操作。此时输入 `y`，将显示以下信息：\n\n从菜单中选择：\n\n# `SETMENU`\n\
  \n2) 以上显示了社会工程工具的创建者、版本号 `7.7.9`、代号 `Blackout` 以及菜单信息。此时你可以根据需要选择相应的数字进行操作。例如，选择社会工程攻击。\n\
  \n输入数字 `1`，将显示可以实现的社会工程攻击列表：\n\n```\nset> 1\n```\n\n从菜单中选择：\n\n1) 鱼叉邮件攻击向量\n2) 网站攻击向量\n\
  \n```\nset>\n```\n\n以上信息显示了社会工程攻击的菜单选项。此时用户可以选择攻击类型，然后实施攻击。\n\n## Web 攻击向量\n\nWeb\
  \ 攻击向量会刻意构建对目标具有可信度和吸引力的网页。当目标用户访问网页时，可以窃取目标用户的信息。社会工程攻击工具可以克隆与实际运行的信任站点看起来完全相同的网页，让受害者认为他们正在浏览合法的站点。本节将介绍使用社会工程实施\
  \ Web 攻击向量的方法。\n\n### 使用 SET 实施 Web 攻击向量\n\n具体步骤如下：\n\n1) 启动社会工程工具并选择社会工程攻击。\n\n\
  执行命令如下：\n\n```\nroot@exampleserver:～# setoolkit\n```\n\n从菜单中选择：\n\n1) 鱼叉邮件攻击向量\n\
  2) 网站攻击向量\n\n```\nset> 1\n```\n\n以上信息显示了社会工程攻击的菜单选项。此时用户可以选择相应的攻击类型，然后实施攻击。\n\n\
  2) 选择 Web 攻击向量，因此输入数字 `2`，将显示以下信息：\n\n```\nset> 2\n```\n\n`Web Attack` 模块是一种通过浏览器利用多个基于\
