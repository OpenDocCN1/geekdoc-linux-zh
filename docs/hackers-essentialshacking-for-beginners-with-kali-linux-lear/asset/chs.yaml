  2) 站点克隆器\n3) 自定义导入\n99) 返回 Webattack \n\n以上输出信息显示了如何创建一个网站。\n\n4) 用户可以根据需要选择不同的方法。为了起见，选择使用\
  \ `SET` 提供的 Web 模板。\n\n因此，输入数字 `1`，将显示以下信息：\n\n```\nset:webattack>1 [192.168.29.129]:\
