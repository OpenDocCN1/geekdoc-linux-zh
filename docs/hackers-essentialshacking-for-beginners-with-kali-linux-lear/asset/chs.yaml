- "# 黑客精要；Kali Linux 入门黑客指南：学习 Kali Linux 并精通破解网站、无线网络的工具以获取收入（5 合 1 丛书）（黑客精要）\n\n\
  \n\n![](img/image_rsrc49U.jpg)\n\n# 《终极黑客指南》赞誉\n\n作为一名渗透测试员，`Tye Darwin` 的这本书多次在我的快速查询中提供了帮助。它既方便又易于理解。极力推荐。\n\
  \nDave\n\n太棒了！简单易懂。是那些尝试掌握 `Kali Linux` 和黑客程序的初学者的最佳指南。\n\n匿名黑客\n\nTye Darwin 提供的这本书既可以作为经验丰富的黑客的参考书，也可以作为初学者的圣经。\n\
  \nSimon\n\n\n\n\n\n\n\n\n“黑客是天才，不是因为他们聪明，而是因为他们只需点击按钮就能控制整个世界。”\n\nMichael L. Georgoveanu\n\
  \n\n\n\n\n黑盒测试的缺点是测试耗时且费力，并要求渗透测试人员具备更高的技术能力。其优点是这种测试更有于挖掘系统的潜在漏洞、薄弱环节和弱点。\n\n##\
  \ 白盒测试\n\n白盒测试也被称为内部测试。白盒渗透测试人员在测试之前会学习有关目标环境的所有内部和底层信息。这使得渗透测试人员能够以最低的成本发现并验证系统中最严重的漏洞。白盒测试的实施过程与黑盒测试相似，不同之处在于不需要进行目标定位和信息收集。渗透测试人员可以使用正常通道从被测试组织获取各种信息，例如网络拓扑、员工信息，甚至是网站程序的代码片段，并可以与该单位的其他员工进行面对面的交流。\n\
  \n白盒测试的缺点是它无法测试客户组织的应急响应流程，也无法判断其安全防护方案针对特定攻击的检测效率。白盒测试的优点是与黑盒测试相比，发现和解决安全漏洞所需的时间和成本要少得多。\n\
  \n## 灰盒测试\n\n灰盒测试是白盒测试和黑盒测试两种基础类型的结合，可以对目标系统提供更深入、更全面的安全审计。这种结合的优点是能够同时利用两种渗透测试方法的优点。在采用灰盒测试方法的外部渗透攻击场景中，渗透测试人员需要从外部渗透进目标网络。然而，目标网络的底层拓扑和架构将有助于更好地选择攻击路径和方法，以获得更好的渗透测试结果。\n\
  \n# 渗透测试流程\n\n在用户充分了解渗透测试的概念后，就可以开始渗透目标。在详细实施渗透测试之前，我们首先介绍其工作流。总共分为 5 个阶段，即：前期交互、信息收集、漏洞扫描、漏洞利用和报告撰写。为了方便用户更清楚地了解每个阶段获得的信息，这里将介绍每个阶段的作用。\n\
  \n### 1) 前期交互\n\n在进行渗透测试之前，渗透测试人员需要充分熟悉渗透测试目标、渗透测试范围、渗透测试方法、服务合同等细节，以达成共识性协议。这一阶段是后续渗透测试的基础和关键。\n\
  \n### 2) 信息收集\n\n在确定了渗透测试的目标和范围后，下一步是进入信息收集阶段。在这个阶段，渗透测试人员需要利用各种公共资源，尽可能获取尽可能多关于测试目标的信息。在此期间，渗透测试人员可以使用互联网收集信息，例如官方网站、论坛和博客。\n\
  \n同时，你也可以使用主要的搜索引擎来获取相关信息，如 `Yahoo` 和 `Google`。你还可以使用 `Kali Linux` 中的一些工具收集 `DNS`\
  \ 信息、注册者信息、服务信息、`WAF` 信息。在此阶段收集的信息越充分，对后续渗透测试就越有利，渗透测试的成功率也会大大提高。\n\n正如一位著名的渗透测试员所说：\n\
  \n“如果你想成为一名优秀的渗透测试人员，请花 70% 的时间在收集目标信息上”\n\n### 3) 漏洞扫描\n\n在渗透测试人员收集了足够的信息后，就可以对目标进行漏洞扫描。在这个阶段，渗透测试人员通过网络探测目标系统，向目标系统发送数据，并将反馈数据与内置的漏洞特征数据库进行匹配，从而列出目标中的安全漏洞。\n\
  \n### 4) 漏洞利用\n\n在渗透测试人员发现目标主机的漏洞后，可以通过现有的漏洞利用程序渗透目标系统。然而，通常情况下，渗透测试人员需要考虑目标系统的环境，对漏洞利用程序进行修改和额外的研究，否则它将无法正常工作。\n\
  \n### 5) 准备报告\n\n完成渗透测试后，需要撰写渗透测试报告。准备的报告需要包含获取的所有价值信息，以及发现的安全漏洞、攻击过程以及对业务的影响分析。\n\
  \n\n\n\nBackTrack Linux 是一套专业的计算机安全监控 Linux 操作系统，被称为 `BT`。`BackTrack` 不仅被用于监控平台（`WarDriving`），还集成了\
  \ 200 多种安全渗透工具，包括 `Metasploit`。此外，众多的 RFID 工具以及对 `ARM` 平台的支持也是一大亮点。目前，`BackTrack`\
  \ 已被 `Kali Linux` 取代且不再进行维护。\n\n## 历史版本\n\n`Kali Linux` 自发布以来共有 4 个版本代码，分别为 `moto`、`kali`、`sana`\
  \ 和 `kali-rolling`。其中，每个版本代码代表 Kali Linux 的一个不同版本。用户可以通过修改软件源中的版本代码，来更新到对应版本的系统。\n\
  \n# 渗透测试员的法律边界\n\n在实施渗透测试时，获得准确的书面授权是非常重要的。如果授权不明确，可能会导致用户面临法律诉讼，更严重的是，甚至可能因此入狱。\n\
  \n### 获取法律授权\n\n在对目标主机进行渗透测试时，渗透测试员首先需要获得目标所有者提供的法律授权。这样就可以避免因非法渗透测试引起的不必要的法律纠纷和其他问题。\n\
  \n### 某些操作的危害\n\n在渗透测试过程中，某些操作具有一定的危害，例如占用系统资源和留下后门。因此，渗透测试员需要提前正式通知目标主机所有渗透测试可能产生的影响，并要求对方确认。\n\
  \n### 总结：\n\n- 我们对渗透测试进行了简单介绍，并介绍了所执行的不同类型的测试。\n- 对渗透测试过程进行了说明，并清晰地介绍了所有阶段。\n- 介绍了\
  \ `Kali Linux` 及其历史。\n- 提供了需要认真对待的法律边界信息。\n\n在下一章节中，我们将讨论如何在虚拟机和物理机中安装 `Kali Linux`。请跟我们一起！\n\
  \n# 第 2 章：在虚拟机中安装 Kali\n\n![](img/image_rsrc49V.jpg)\n\n上一章对黑客世界做了很好的介绍。这一章对于苦于创建自己黑客环境的初学者来说，是一个重要的资源。众所周知，黑客在日常工作中始终依赖于\
  \ `Linux`。`Windows` 和 `Mac` 是良好的生产力操作系统，但并不适合黑客。在本章中，我们将深入讨论 `Kali`（一个著名的黑客用 `Linux`\
  \ 发行版）的安装。让我们开始吧！\n\n# 下载 Linux 镜像\n\n为了在计算机上安装 `Kali Linux` 操作系统，你需要获取该系统的镜像文件。为了避免下载过程中出现数据传输错误，建议读者也验证其完整性。\n\
  \n### 如何获取 Kali Linux 镜像？\n\n在获取镜像之前，用户需要对 `Kali Linux` 系统的镜像有一个简单的了解，例如它的版本、架构、桌面类型。然后，我们需要选择下载合适的镜像来安装到操作系统中。\n\
  \n#### 1) 镜像类型\n\n`Kali Linux` 官方提供了两个镜像文件，一个是稳定发布版，另一个是每周更新版。两者之间，稳定版通常经过了充分测试，更方便使用；每周更新版的优势在于其中包含的工具是最新版本，但它的缺点是测试不充分，可能存在不稳定的风险。\n\
  \n#### 2) 数字的区别\n\n`Kali` 官方网站提供了 `i386` 和 `amd64` 架构的镜像。其中，`i386` 意味着支持 32 位架构的镜像，而\
  \ `amd64` 意味着支持 64 位架构的镜像。因此，在下载镜像文件时，用户需要根据自己的系统架构选择对应的镜像文件。\n\n要检查你自己的系统架构，`windows`\
  \ 用户可以使用控制面板，`Mac OS` 用户可以在系统设置菜单中检查。\n\n**注意**：记住 64 位架构可以同时支持 32 位和 64 位镜像。而 32\
  \ 位架构只能支持 32 位镜像。\n\n#### 3) 桌面类型\n\n`Kali Linux` 官方网站提供了 6 种桌面镜像，分别为 `GNOME`、`E17`、`KDE`、`MATE`、`XFCE`\
  \ 和 `LXDE`。其中，`Gnome` 是常用且易用的桌面环境，因此我们建议你选择 `Gnome` 桌面来提升你的黑客技能。不过，你可以尝试不同的版本，并选择一个你觉得舒服的。\n\
  \n#### 4) 下载镜像\n\n在用户对官方 `Kali Linux` 网站提供的可用镜像文件有了清晰的了解后，可以选择所需的文件进行下载。\n\n这是本文时\
  \ `Kali Linux` 下载页的截图。\n\n### 验证 Kali Linux 镜像\n\n由于安装镜像文件通常较大，文件在下载过程中可能会损坏或不完整。如果镜像文件损坏或不完整，在安装过程中可能会出现错误。为了避免这些尴尬的情况，用户可以使用验证工具进行验证。有几个网站可以检查\
  \ `Linux` 文件的真实性。\n\n找到值后，比较并验证获得的值与镜像文件提供的值是否相同。如果相同，则确认镜像文件已下载完整。如果不相同，说明不完整，并且可能充满了隐藏的恶意软件。我们建议你从官方网站重新下载。\n\
  \n在下一节中，我们将讨论在虚拟机中安装 `Kali linux`。\n\n# 虚拟机安装\n\n虚拟机是通过软件模拟获取具有完整硬件功能的计算机系统。对于初学者来说，如果你直接在物理机上安装操作系统，可能会导致系统崩溃或数据丢失。\n\
  \n因此，为了不仅能学习安装系统，还能避免数据丢失，使用虚拟机是更好的方法。市场上有很多虚拟机软件。其中，`VirtualBox` 和 `VMware` 是两种适用于\
  \ windows 的知名虚拟机软件。我个人认为 `VMware` 虚拟机更简单更容易操作。建议用户使用这种虚拟机软件。下一节将介绍如何使用 `VMware`\
  \ 安装并创建 `Kali Linux` 虚拟机。\n\n\n\n\n2) 此对话框显示安装 VMware Workstation 的欢迎信息。点击“Next”（下一步）按钮，将显示“最终用户许可协议”信息。\n\
  \n3) 此对话框显示使用 VMware 的用户许可协议。勾选“我接受许可协议中的条款”复选框，并点击“Next”（下一步）按钮。\n\n4) 你可以在此对话框中自定义\
  \ VMware 的安装位置。默认情况下，VMware 将安装在 `C:\\Program Files(x86)\\VMware\\WMware Workstation`\
  \ 目录。如果用户想安装到其他位置，可以点击“Change”（更改）按钮来指定安装位置。然后点击“Next”（下一步）按钮，将显示“用户体验设置”对话框。\n\n\
  5) 此对话框用于设置用户体验信息，包括启动时检查产品更新以及帮助改进 VMware Workstation Pro。默认情况下，两个选项都已启用。在此处使用默认设置，然后点击“Next”（下一步）按钮，将显示快捷方式创建对话框。\n\
  \n6) 此对话框将显示 VMware Workstation Pro 的快捷方式位置，默认将在“桌面 (D)”和“开始菜单程序文件夹 (S)”中创建。然后点击“Next”（下一步）按钮，将显示“准备安装\
  \ VMware Workstation Pro”对话框。\n\n7) 此时，之前的基本设置工作已完成。点击“Install”（安装）按钮开始安装 VMware\
  \ 产品。安装完成后，将显示完成对话框。\n\n8) 从此对话框中，你可以看到 VMware Workstation Pro 已安装。由于 VMware Workstation\
  \ Pro 不是免费版本，在激活后需要输入许可证密钥才能长时间使用。点击此对话框中的“License”（许可证）按钮，将显示“输入许可证密钥”对话框。我们建议你购买年度许可以降低价格。针对学生和组织还有额外的折扣优惠。\n\
  \n9) 在此对话框中输入许可证密钥后，点击“Enter”（回车）按钮，将显示完成对话框。\n\n(10) 如你从此对话框中看到的，VMware Workstation\
  \ pro 的安装向导已完成。点击“Finish”（完成）按钮即可成功安装 VMware 软件。在下一节中，用户可以使用虚拟机来安装操作系统。\n\n# 创建\
  \ Kali Linux 虚拟机\n\n如果用户想在 VMware 软件中安装操作系统，需要先创建一个相应的虚拟机，即模拟一个具有完整硬件系统功能的环境。在创建\
  \ Kali Linux 虚拟机环境时，建议内存不少于 2GB，否则 Metasploit 软件无法正常运行。磁盘空间也不应少于 20GB，否则以后无法正常更新。\n\
  \n创建 Kali Linux 虚拟机的具体步骤如下：\n\n1) 启动 VMware 虚拟机。成功启动后将显示进入设置的界面。\n\n2) VMware 的主界面非常容易操作。用户可以通过点击此界面上的“新建虚拟机”（Create\
  \ a new virtual machine）按钮来创建虚拟机。你也可以选择菜单栏中的 `File (F)` | `New Virtual Machine (N)`\
  \ 命令来创建新虚拟机。点击“新建虚拟机”按钮后，将显示带有附加信息的“新建虚拟机向导”对话框。\n\n3) 在此对话框中选择新虚拟机的类型。这里提供了两种方法，即“典型（推荐）(T)”和“自定义（高级）(C)”。这两种方法的区别在于第一种方法的操作相对简单，而第二种方法需要手动设置某些信息，如硬件兼容性、处理器、内存等。如果你是新手，建议使用“典型（推荐）(T)”方法。此外，在虚拟机创建后甚至可以设置虚拟机的高级设置（处理器、内存等）。对于初学者，我们将选择“典型（推荐）(T)”方法，并点击“Next”（下一步）按钮，将显示安装源对话框。\n\
  \n4) 在此对话框中，选择安装客户端的源，即插入安装镜像文件的方法。如你从此对话框看到的，默认提供了三个安装源。在这里选择“稍后安装操作系统”（Install\
  \ the operating system (S) later）选项，点击“Next”（下一步）按钮，将显示“选择客户操作系统”对话框。\n\n5) 此对话框通常用于选择要安装的操作系统和版本。在本例中，正在创建\
  \ Kali Linux（基于 Debian）操作系统。因此，在这里选择了 Linux 操作系统，选择的版本是 Debian 9.x 64-bit。然后点击“Next”（下一步）按钮，将显示“命名虚拟机”对话框。\n\
  \n6) 此对话框要求你为虚拟机命名并设置虚拟机的安装位置。设置完成后，点击“Next”（下一步）按钮，将显示“指定磁盘容量”对话框。\n\n7) 在此对话框中设置磁盘容量。对于渗透测试的用户，他们在执行密码暴力破解时通常有一个很大的密码字典。如果密码字典太大，将占用大量空间。此外，为了方便用户以后更新，也建议用户将磁盘容量设置得大一点以免磁盘空间不足。在本例中，我们将磁盘大小设置为\
  \ 100GB，并准备点击“Next”（下一步）按钮。\n\n8) 下一个对话框显示新创建的虚拟机详细信息。点击“Finish”（完成）按钮查看创建的虚拟机。\n\
  \n此界面显示新创建的 Kali Linux 虚拟机。在下一节中，用户可以安装操作系统。\n\n# 安装操作系统\n\n现在我们在之前创建的虚拟机中安装 Kali\
  \ Linux 操作系统。在安装操作系统之前，建议修改其运行内存。如果内存太小，某些程序无法正常运行。此外，在安装系统之前，还需要手动加载相应的镜像文件。\n\n\
  安装 Kali Linux 的具体步骤如下：\n\n1) 打开之前创建的虚拟机，将显示详细界面。\n\n2) 点击此界面上的“编辑虚拟机设置”（Edit Virtual\
  \ Machine Settings）选项，或者选择菜单栏中的 `Virtual Machine` | `Settings` 命令打开“虚拟机设置”对话框。\n\
  \n3) 在对话框的“硬件”选项卡中，你可以设置内存、处理器和网络适配器的详情。在本例中，内存大小设置为 2GB。然后，选择 CD/DVD 选项加载系统镜像。在右侧选择“使用镜像文件”单选按钮并指定\
  \ Kali Linux 系统镜像文件。设置完成后，点击“确定”返回虚拟机主界面。然后点击“启用此虚拟机”选项，操作系统将开始安装。\n\n4) 此界面是 Kali\
  \ 的安装引导界面，你可以在此界面上选择安装方法。用户可以使用方向键查看所有可用的启动选项。选择“Graphical install”（图形化界面安装）选项并按回车键。将立即显示语言选择对话框。\n\
  \n\n\n\n5) 在此对话框中选择安装系统的语言，此处选择“English”（英语）选项。然后点击 `Continue` 按钮显示区域选择对话框。\n\n\
  6) 在此对话框中，选择用户当前所在的区域。此处，选择默认设置“USA”。然后点击 `Continue` 按钮，将显示 `Configure Keyboard`\
  \ 对话框。\n\n7) 选择默认键盘格式“English-US”，然后点击 `Continue` 按钮。\n\n8) 在过程中，将加载一些额外的组件并配置网络。当网络配置成功后，将显示设置主机名的对话框。\n\
  \n9) 在此处，将主机名设置为 `exampleserver`，并点击 `Continue` 按钮，将显示设置域名的对话框。\n\n10) 此对话框用于设置计算机使用的域名，用户不需要设置。此处，使用默认提供的域名\
  \ `localdomain`，并点击 `Continue` 按钮，将显示 `Set User and Password` 对话框。\n\n11) 此对话框用于设置\
  \ root 用户的密码。出于安全考虑，建议设置更复杂的密码。设置完成后，点击 `Continue` 按钮，将显示磁盘分区对话框。\n\n12) 此对话框用于选择磁盘分区方法。此处，选择\
  \ `Wizard-Use Entire Disk`（向导使用整个磁盘）选项，并点击 `Continue` 按钮。\n\n13) 在此对话框中选择要分区的磁盘。当前系统中只有一个磁盘，因此在此选择该磁盘。然后点击\
  \ `Continue` 按钮。\n\n**Tip**：如果用户选择了显示的第二个和第三个分区，务必注意默认自动分配的磁盘空间量。特别是根分区的大小，建议该分区至少设置为\
  \ 20GB。如果空间太小，安装过程中将提示安装错误。\n\n14) 在此对话框中，选择分区方案。默认提供 3 种方案。此处，选择 `Place all files\
  \ in the same partition (recommended for novices)`（将所有文件放在同一分区中（推荐新手使用））选项，并点击 `Continue`\
  \ 按钮。\n\n15) 下一个对话框显示当前的系统分区。你可以看到目前有两个区域，根区域和交换分区区域。如果用户想修改当前分区，选择 `Undo the modification\
  \ of the partition settings`（撤销分区设置修改）重新进行分区。如果你不想修改，选择 `End Partition Setting and\
  \ Write Modifications to Disk`（结束分区设置并将修改写入磁盘）。然后点击 `Continue` 按钮，将显示对话框。\n\n16)\
  \ 此对话框提示是否将更改写入磁盘，即格式化磁盘。此处，选择 `Yes` 单选按钮并点击 `Continue` 按钮开始安装系统。\n\n17) 此时，系统开始开始安装。在安装过程中，需要设置一些信息，例如设置网络镜像。如果安装\
  \ Kali Linux 系统的计算机未连接网络，请在此界面上选择 `No` 单选按钮并点击 `Continue` 按钮。如果选择了 `Yes` 单选按钮，将涉及网络速度和寻找合适的镜像站点等问题。为了让用户顺畅安装操作系统，建议选择\
  \ `No` 单选按钮。然后点击 `Continue` 按钮，将出现对话框。\n\n**Tip**：用户安装完系统后，也可以手动配置软件源并更新包管理器。因此，选择\
  \ `No` 单选按钮不会影响其他软件的安装。\n\n**Tip**：如果用户选择使用网络镜像，将弹出一个带有额外信息的对话框。\n\n在此对话框中可以设置 `HTTP`\
  \ 代理以连接外部网络。如果你不需要连接外部网络，只需点击 `Continue` 按钮，将显示 `Configure Package Manager` 对话框。\n\
  \n18) 当软件包配置完成后，将显示 `Install GRUB to the hard disk` 对话框。\n\n19) 此对话框提示是否将 GRUB 引导加载程序安装到主引导记录中。选择\
  \ `Yes` 单选按钮并点击 `Continue` 按钮显示对话框。\n\n20) 此对话框用于设置安装引导加载程序的设备。从显示的信息中，你可以看到只有一个\
  \ `/dev/sda` 设备。因此，此处有将 GRUB 安装到 `/dev/sda` 的选项。然后点击 `Continue` 按钮。\n\n如果用户需要在其他设备上安装，可以选择\
  \ `manual input device`（手动输入设备）选项并输入设备名称。\n\n21) 当 GRUB 引导加载程序安装完成后，将显示 `End Installation\
  \ Process` 对话框。\n\n22) 从此对话框中，你可以看到操作系统已安装。在下一步，需要重启操作系统。点击此对话框中的 `Continue` 按钮结束安装过程并重启操作系统。\n\
  \n23) 从此对话框中，你可以看到安装过程即将结束。安装完成后，操作系统将自动重启。系统启动后，将显示登录对话框。\n\n24) 在此对话框中输入登录系统的用户名。在此处输入超级用户\
  \ `root`，并点击 `Next` 按钮，将显示密码输入对话框。\n\n25) 在此对话框中，输入超级用户 `root` 的密码，即安装操作系统期间设置的密码。输入密码后，点击\
  \ `Login` 按钮。如果你成功登录系统，将看到带有额外信息的界面。\n\n26) 当你看到此界面时，意味着 `root` 用户已成功登录系统。从现在起，用户可以在操作系统中实施各种渗透测试。\n\
  \n\n\n\n\nWin32Disk Imager 工具主要用于将 ISO/img 文件写入 SD 卡或 USB 闪盘。对于现在的大多数人来说，使用 CD 刻系统的方法已经很少使用了。此外，现在的电脑基本上不再配有光驱了。因此，使用\
  \ U 盘安装操作系统是最方便、最快速的方法。如果你想用 U 盘安装系统，你需要将 U 盘制作成安装启动盘。此时，你需要使用 Win32Disk Imager\
  \ 工具来实现这一目标。该工具默认没有安装在系统中，因此你需要先安装该工具。接下来的章节将介绍具体的安装方法。\n\n具体步骤如下：\n\n1) 从网站 `https://sourceforge.net/projects/win32diskimager/`\
  \ 下载软件包。软件包名为 `Win32DiskImager-1.0.0-install.exe`。\n\n2) 安装 Win32Disk Imager 工具。双击下载的软件包，将显示许可协议对话框。\n\
  \n3) 该对话框显示了安装 Win32Disk Imager 工具的许可信息。选择 `I accept the agreement`（我接受协议）单选按钮并点击\
  \ `Next`（下一步）按钮。将显示选择目标安装位置的对话框。\n\n4) 该对话框用于选择 Win32Disk Imager 工具的安装位置。默认情况下，它将安装在\
  \ `C:\\Program Files(x86)\\ImageWriter` 。如果用户想重新指定安装位置，需要点击 `Browser`（浏览）按钮进行设置。然后点击\
  \ `Next` 按钮，将显示设置启动菜单文件夹的对话框。\n\n5) 该对话框用于设置启动菜单中的文件夹名称。这里使用默认设置 `Image Writer`，并点击\
  \ `Next` 按钮，将显示选择其他任务的对话框。\n\n6)在此对话框中设置是否创建快捷方式。为了方便启动程序，建议用户创建快捷方式。勾选 `Create\
  \ a desktop shortcut icon`（创建桌面快捷方式）复选框并点击 `Next` 按钮，将显示准备安装对话框。\n\n7) 该对话框显示之前设置的详细信息，准备好安装\
  \ Win32Disk Imager。如果你需要修改设置，可以点击 `Back`（上退）按钮返回修改。否则，你需要点击 `Install`（安装）按钮开始安装工具。安装完成后，将显示完成设置向导的对话框。\n\
  \n8) 从此对话框中，你可以看到 Win32Disk Imager 工具已安装。点击 `Finish`（完成）按钮自动启动工具。如果用户不想直接启动工具，可以取消勾选\
  \ `Launch Win32DiskImager` 复选框。如果你勾选了 `View README.txt`，将打开 `README.txt` 文件。该文件显示了关于\
  \ Win32Disk Imager 工具的详细信息，例如功能、架构描述、常见问题等。\n\n# 制作 USB 安装盘\n\n通过前面的介绍，系统中已经安装了\
  \ Win32Disk Imager 工具。现在你可以使用此工具制作 USB 安装盘。在写入磁盘镜像时，U 盘会被格式化。因此，你需要确保 U 盘中的数据已经备份。下文将介绍具体的安装方法。\n\
  \n## 使用 Win32Disk Imager 工具制作 USB 安装盘\n\n注意，为了避免因磁盘不足导致操作失败，U 盘必须有足够的空间。这里建议 U 盘最小空间为\
  \ `4GB`。\n\n具体步骤如下：\n\n1) 将制作了安装盘的 U 盘插入当前系统，并确保它已被正确识别。然后，启动 Win32Disk Imager 工具。\n\
  \n2) 从此对话框可以看出，Win32Disk Imager 工具已自动识别可移动磁盘 `F`。然后点击按钮导入 Kali Linux ISO 镜像文件。\n\
  \n3) 从此对话框中，你可以看到选择了 Kali Linux 系统的镜像文件。然后，为了确保生成的安装介没有问题，在这里需要进行验证。从 `Check Value`（校验值）下拉列表中选择\
  \ `SHA256` ，然后点击 `Generate`（生成）按钮。过一会儿，你将看到文件的 `SHA256` 校验值。如果该值与官方网站提供的相同，则说明镜像文件完整。否则，可能存在问题。\n\
  \n4) 你可以从此对话框看到生成的校验值。与官方网站提供的值对比后，可以确认镜像文件完整。此时，点击 `Write`（写入）按钮，将显示对话框。\n\n5)\
  \ 该对话框提示是否确定向磁盘 `F` 写入数据。在此点击 `Yes`（是）按钮开始写入数据。数据写入完成后，将弹出 `write successful`（写入成功）对话框。\n\
  \n6) 点击 `OK` 按钮返回出现的对话框。点击此对话框中的 `Exit`（退出）按钮退出程序。接下来，用户可以使用 USB 安装盘在物理机上安装 Kali\
  \ Linux 操作系统。\n\n注意：写入 Kali Linux 系统镜像后，U 盘的分区格式将变为 `Ext4`。Windows 无法识别该文件格式，因此会提示\
  \ U 盘无法正常访问并需要格式化。在此忽略错误消息即可。\n\n# 准备 Kali Linux 硬盘分区\n\n对于大多数用户来说，他们喜欢使用 Windows\
  \ 操作系统，但也想体验使用 Kali Linux 在物理机上进行渗透测试。针对这一需求，最佳解决方案是安装双系统。\n\n如果你想安装双系统，需要为安装 Kali\
  \ Linux 系统准备硬盘分区。如果没有准备好硬盘分区，可能会由于操作不当导致原系统受损或擦除某个分区中的重要文件。\n\n因此，出于安全考虑，选择独立的硬盘或独立的分区来安装\
  \ Kali Linux 系统是最佳选择。如果用户有独立的硬盘来安装系统，直接安装系统即可。如果没有独立的硬盘，你需要分割现有磁盘以创建一个独立的分区来安装操作系统。接下来的章节将介绍通过压缩卷划分独立分区来准备安装\
  \ Kali Linux 系统分区的的方法。\n\n下文将介绍通过压缩卷划分独立分区来安装 Kali Linux 操作系统的方法。\n\n具体步骤如下：\n\n\
  1) 右键点击桌面上的 `Computer`（计算机）图标，选择 `Manage`（管理）命令打开“计算机管理”界面。\n\n2) 在左列选择 `存储` | `磁盘管理`\
  \ 选项，将显示磁盘管理界面。\n\n3) 从此界面中，你可以看到当前系统中有两个磁盘，`disk 0` 和 `disk 1`。此外，两个磁盘都只有一个分区，磁盘分区分别为\
  \ `C` 和 `E`。其中，操作系统安装在 `disk 0` 上。所以，在此选择 `disk 1` 并将其划分为 `100GB` 分区。在这里，选择 `E`\
  \ 分区并右键点击，弹出菜单。\n\n4) 选择 `compressed volume (H)...` 命令，将显示压缩空间设置对话框。\n\n5) 此对话框显示了可用压缩空间。在此将压缩空间大小设置为\
  \ `102400MB`，并点击 `Compress`（压缩）按钮。压缩完成后，你将看到划分出的可用磁盘空间。\n\n6) 从此界面可以看出 `disk 1`\
  \ 中已成功划分出一个 `100GB` 的分区。在下一步中，用户可以在该分区上安装其他操作系统。\n\n# 设置第一个启动项\n\n\n\n\n\n在用户准备好硬盘分区和安装媒体后，就可以在物理机上安装操作系统了。物理机上安装操作系统的方法与虚拟机中安装的方法相同。然而，要在物理机上安装操作系统，你需要设置安装媒体的启动项。\n\
  \n通常情况下，硬盘是第一启动项。如果你使用 `USB` 安装盘来安装操作系统，则需要将第一启动项设置为 `USB` 设备。此外，在物理机上安装双系统时，还需要注意硬盘分区的选择以及\
  \ `GRUB` 设置。如果操作不当，会导致数据丢失。接下来的部分将介绍一些在物理机上安装操作系统的设置方法。\n\n## 将 USB 设备设置为第一启动项\n\
  \n由于在物理机上不方便进行截图，接下来的部分将以虚拟机系统为例，介绍修改第一启动项的方法。\n\n具体步骤如下：\n\n1) 启动电脑并进入 `BIOS` 界面。虚拟机必须在关机状态才能进入。关闭虚拟机后，在菜单栏中选择`虚拟机`\
  \ | `电源` | `开机时进入固件` 命令。\n\n注意：如果是物理机，用户需要在黑底白字界面出现时按下 `F2`、`F12` 或 `Del` 键（不同型号按键也不同，通常为\
  \ `F2` 键）进入 `BIOS` 界面。\n\n2) 选择`开机时进入固件`命令进入当前系统的 `BIOS` 主菜单界面。\n\n3) 此界面为 `BIOS`\
  \ 主菜单。在此界面中，用户使用右方向键切换到 `Boot` 标签，将显示相应的对话框。\n\n4) 从该对话框可以看到 4 个选项，即 `Removable\
  \ Devices`、`Hard Drive`、`CD-ROM Drive`、`Network boot from Intel E1000 (Network)`。这\
  \ 4 个选项代表 4 种启动方法，用户只需将启动项移动到第一位。如果你使用 `CD` 启动系统，使用向下箭头选择 `CD-ROM Drive` 选项，按下加号\
  \ (+) 键将选项移动到第一位。此对话框的设置意味着第一启动项为 `Removable Devices`，即 U 启动。设置完成后，保存并退出 `BIOS`。然后切换到右侧的\
  \ `Exit` 标签，即可显示对话框。\n\n5) 该对话框用于选择是否保存设置。选择 `Exit Saving Changes`（保存更改并退出）选项，按下\
  \ `Enter` 键，弹出对话框。\n\n6) 此对话框提示是否保存之前的设置并退出程序。如果用户确认设置无误，点击 `Yes` 按钮。点击 `Yes` 后系统将重启。系统启动时将进入\
  \ U 盘的引导界面。\n\n7) 本示例中的 U 盘是 `Kali Linux` 系统的安装盘，因此启动后显示的界面是安装 `Kali Linux` 的启动界面。此时，用户可以开始安装\
  \ `Kali Linux` 操作系统。后续安装方法与虚拟机安装方法相同，此处不再重复。\n\n提醒：所有新电脑都带有 `UEFI` 固件，并且开启了 `Secure\
  \ Boot`（安全启动）功能。此功能将拒绝启动未经过 UEFI 签名的操作系统。主板厂商通常允许用户关闭 `Secure Boot` 功能，或要求你向 `UEFI`\
  \ 中添加自定义公钥以绕过此限制。此时，用户需要关闭 `Secure Boot` 功能才能正常启动并进入他们的操作系统。\n\n## 设置硬盘分区\n\n如果用户直接在没有任何数据的电脑上安装操作系统，则无需考虑数据丢失的问题，直接安装即可。然而，如果你正在安装双系统，则需要在硬盘分区过程中选择正确的格式化选项。在设置硬盘分区时，用户可以使用自动或手动方法。如果你不熟悉系统分区的用法，让系统自动分配即可。下面为读者描述了设置硬盘分区的常用方法，并提供了清晰的指令说明。请遵循操作！\n\
  \n### 如何自动分区系统？\n\n分区是一个复杂的程序，通常是系统程序员的工具箱。然而，对于初学者来说，有一些特定的指令可以让这个过程变得轻而易举。只需按照我们提供的步骤操作，即可避免任何错误。\n\
  \n具体步骤如下：\n\n1) 在物理机上准备安装双系统时，会弹出一个对话框。\n\n2) 在对话框中，选择`Use the largest continuous\
  \ free space`（使用最大连续空间）选项。如果一切顺利，系统中的空空间将被自动选中并分区。然后，点击`继续` 按钮，屏幕将显示分区对话框。\n\n3)\
  \ 从该对话框可以看到磁盘 `sdb` 已自动选中。在下一步中，选择`Place all files in the same partition`（将所有文件放在同一分区，推荐新手使用）并点击`继续`\
  \ 按钮。\n\n4) 从对话框中可以看到 `sdb` 磁盘上自动创建了两个分区，即 `swap` 和根目录 `/`。然后选择`结束分区设置并写入磁盘`选项并点击`继续`\
  \ 按钮开始安装操作系统。\n\n### 如何手动分区操作系统？\n\n1) 在分区方法中选择`手动`选项，点击`继续` 按钮查看当前系统的磁盘分区。\n\n\
  2) 从对话框可以看到当前系统有两个硬盘，即 `sda` 和 `sdb`。此外，可以看到 `sdb` 中有 `107.4GB` 的空空间。此时，选择空空间并手动创建所需的\
  \ Linux 系统分区表。通常建议创建一个根分区和一个交换分区。在此选择`空空间`进行分区，然后点击`继续` 按钮，显示分区对话框。\n\n3) 在对话框中指定要创建分区的大小。例如，为了创建一个\
  \ `2GB` 的交换分区，在文本框中输入 `2GB`。然后点击`继续` 按钮，显示设置分区类型的对话框。\n\n4) 在对话框中选择`Logical Partition`（逻辑分区）选项，点击`继续`\
  \ 按钮，显示`新分区位置`对话框。\n\n5) 在对话框中选择`开始`选项，点击`继续` 按钮，立即显示`分区设置`对话框。\n\n6) 从此对话框可以看到，该分区将用于\
  \ `Ext4` 日文件系统，挂载点为 `/`。这里创建的是交换分区，因此需要修改为交换分区。然后点击`继续` 按钮，显示文件系统格式列表对话框。\n\n7)\
  \ 在此对话框中，选择`Swap space`（交换空间）选项，点击`继续` 按钮返回`分区设置`对话框。\n\n\n\n\n9) 如你从此对话框所示，此分区用于交换空间（swap\
  \ space）。然后，选择“分区设置”选项并点击“继续”按钮返回分区表设置对话框。\n\n10) 如你从此对话框所示，成功创建了一个大小为 2GB 的交换分区。用户使用相同的方法创建剩余的所有空间作为根分区（root\
  \ partition）。在创建过程中，操作方法与创建分区相同，只是在设置分区时，你可以将分区类型选择为“Ext4 日志文件系统”选项，并将挂载点设置为 `/`。创建完成后，将显示该对话框。\n\
  \n11) 如你从此对话框所示，已成功创建两个分区。然后选择“结束分区设置并将修改写入磁盘”选项，并点击“继续”按钮，即可显示对话框。\n\n12) 你可以从此对话框看到创建的两个分区（ext4\
  \ 和 swap）。此时，选择“是”单选按钮并点击“继续”按钮开始安装操作系统。\n\n# 安装 GRUB\n\n经常安装多个系统的用户可能知道，在安装过程中存在\
  \ GRUB 位置问题。在以前的操作系统中，用户必须手动将 GRUB 的位置设置为系统的根分区。然而，Windows 7/8/10 的情况有所不同，用户不需要手动设置。由于这些系统目前由\
  \ GRUB 引导，用户可以直接选择将引导安装到 MBR 格式的硬盘。\n\n## 如何选择 GRUB 的安装位置？\n\n可以通过简单的技术和步骤来更改 grub\
  \ 引导加载程序。如果你不了解自己在做什么，我们确实建议你不要随意弄动引导加载程序。\n\n具体步骤如下：\n\n1) 打开 GRUB 安装设置对话框，以根据你的方便进行更改..。\n\
  \n2) 此时，系统会询问你是否想在 MBR 上安装 GRUB。选择“是”单选按钮，然后点击“继续”按钮。立即会显示设置 GRUB 安装位置的对话框。\n\n\
  3) 从对话框中，你可以看到有两个硬盘可以安装 GRUB。然而，建议选择 `/dev/sda`（第一块硬盘）。然后，点击“继续”按钮继续安装操作系统。\n\n\
  通过这一简单的程序，你将不再需要处理经常导致头疼的 GRUB 引导过载错误。\n\n# 第 4 章：介绍 Kali Linux 功能\n\n![](img/image_rsrc49V.jpg)\n\
  \n在上一章中，我们介绍了在虚拟机和物理系统中安装 Kali Linux 的不同方法。在开始学习 Linux 自带的各种工具之前，了解 Kali 作为操作系统的功能是非常关重要的。了解它的终端和网络能力可以提高你在渗透测试（pen\
  \ testing）时的效率。本章描述的许多章节需要访问 Kali 系统以获得更好的理解。因此，在阅读本书时，请确保你的电脑上已安装 Kali Linux 操作系统。\n\
  \n# 深度解析 Kali Linux\n\n如果你配置了 Kali Linux 系统，那么你需要对该系统有一个简单的了解，例如菜单栏的使用、文件管理、系统设置。本节将介绍\
  \ Kali Linux 系统的常用操作。\n\n## 命令菜单\n\nKali Linux 提供了大量的渗透测试工具。这些工具被分为不同的类别，如信息收集、漏洞分析、Web\
  \ 程序等。用户可以通过选择图形界面上的“应用程序”选项卡来查看所有类别。\n\n从这个启动界面，你可以看到应用程序包含 14 个类别。此外，每个类别都有确定的子类别。在所有可用软件中，有些工具在图形界面上运行，而另一些则在命令行运行。对于在图形界面上运行的工具，通过菜单命令启动它们更加方便。对于在命令行运行的工具，通常无法通过菜单启动。##文件\
  \ Linux\n\nKali Linux Linux 提供了大量的渗透测试。。分类分类分类分类信息信息信息信息信息。。。。。。。。。。。。。。 Linux。。。。。\n\
  \n文件。\n\n文件文件管理\n\n文件文件用于用于图形界面。文件文件文件。。为了执行文件管理，需要非常清楚文件文件。。Linux 文件结构。与 Windows\
  \ 不同，它通过驱动器器存储文件。Linux 系统中只有一个根，在根目录下。为了方便用户管理文件，我们将详细说明这些文件。Linux 文件系统系统树状结构，其入口是根目录。无论哪个版本，它们都是相似的。由于其复杂性，用户可能无法深入了解这些文件。\n\
  \nLinux 系统中有很多重要的目录，例如：\n\n1) 家目录\n\nLinux 下每个用户都有一个家目录，用于存储用户文件。其中，用户目录的位置是 `/home/username`。然而，超级用户的家目录是\
  \ `/root`。当用户打开终端时，位置就是登录用户的家目录。\n\n2) 根目录\n\n根目录是文件系统的入口，被称为最高级目录。所有文件和目录都从根目录开始，只有\
  \ root 用户具有写入权限。\n\n3) 其他其他重要的文件夹\n\n除了上述两个目录外，用户还需要了解几个重要的文件夹，例如 `/etc`、`/bin`、`/sbin`\
  \ 等。\n\n以下是它们的简单介绍：\n\n* `/bin`: 基本系统所需的命令是最小系统所需的命令，如 `ls`、`cp`、`mkdir` 等。此目录下的文件是可执行的，普通用户可以使用。\n\
  \n* `/sbin`: 该目录主要用于存储系统管理命令。它是超级用户 root 执行命令的地方。普通用户没有权限执行此目录中的命令。此目录类似于 `/usr/sbin`\
  \ 或 `/usr/local/sbin` 目录。只需记住 sbin 目录中的所有内容都可以用 root 权限执行。\n\n* `/etc`: 存储系统程序或通用工具的配置文件。\n\
  \n* `/usr`: 这是系统存储程序（如命令和帮助文件）的目录。目录下有很多文件和目录。当用户安装 Linux 发行版官方提供的软件包时，大部分都安装在这里。如果涉及服务器配置文件，配置文件将安装在\
  \ `/etc/` 目录。\n\n\n\n\n\n-   `/var`: 该目录的内容经常变化。`/var` 通常包含 `/var/log`、`/var/spool`、`/var/cache`\
  \ 等。其中，`/var/log` 是用于存储系统日志的目录。`/var/spool` 是存储打印机、邮件服务器、代理服务器等的置池化目录；`/var/cache`\
  \ 用于存储一些缓存文件。\n\n在用户清晰了解 Kali Linux 文件系统结构后，就可以进行文件管理了。在这里，我们将介绍 Linux 图形界面系统的文件管理工具。\n\
  \n1) 在桌面上选择“位置” | “计算机”，这样就会打开文件系统的根目录。\n\n2) 从此界面，你可以看到根目录下的所有文件和文件夹。此时，用户可以执行打开文件、创建文件、删除文件和查看文件内容等操作。如果你想打开一个文件，只需双击该文件。如果你想删除或复制文件，需要选择该文件或文件夹并点击右键，会弹出一个菜单。其中，将显示文件夹和文件的弹出菜单。\n\
  \n3) 此时，选择弹出菜单中的任何命令来执行相应的操作。例如，选择“用文本编辑器打开”命令来显示文件内容。\n\n4) 此界面显示了 `sources.list`文件的内容。此时，用户可以编辑文件中的内容。如果你可以修改文件内容，可以点击“保存\
  \ (S)”按钮使修改生效。\n\n# 终端\n\n终端可以理解为命令行模式下的文件管理工具。对于喜欢使用命令行操作的用户来说，可以使用终端模式来实现文件管理。通过前面的介绍，用户也知道某些命令在图形界面下无法正常运行。因此，知道如何使用终端执行操作也是一项非常重要的技能。下节将介绍终端的常用操作。\n\
  \n1) 打开新终端\n\n如果你想使用终端，首先需要打开终端。在 Kali Linux 中，有两种打开终端的方法。第一种是直接点击收藏中的终端按钮。第二种方法是在桌面上点击右键，并在弹出菜单中选择`在终端打开`\
  \ 命令。\n\n如你所见，立即界面表示终端窗口已成功打开。在这个窗口中，用户还可以打开多个终端。右键点击终端窗口并选择弹出菜单中的`新建标签页 (T)` 命令来打开一个新的终端窗口。\n\
  \n从此界面可以看到，终端有两个标签。通过点击标签，你可以切换你当前所处的终端窗口。\n\n2) 查看目录\n\n当用户打开终端窗口时，他可以通过命令行管理文件。查看目录是确定当前目录下包含哪些文件最常用的操作。使用\
  \ `ls` 命令查看当前目录下的所有文件。\n\n从此界面显示的结果中，你可以看到当前目录下的所有文件已列出。\n\n3) 切换目录\n\n切换目录也是最常用的操作。如果用户想查看某个目录下的文件，需要切换到相应的目录。例如，使用\
  \ `cd` 命令切换到 `/etc` 目录，并使用 `pwd` 命令查看当前工作目录。\n\n从输出中可以观察到，你成功切换到了 `/etc` 目录。\n\n\
  4) 编辑文件\n\n编辑文件是用于操作文件内容的方法。例如，如果你想在终端上设置软件源，就需要编辑软件源文件。例如，你可以使用 `Vi` 文本编辑器来编辑软件源。\n\
  \n执行上述命令后，你就可以打开 `sources.list`文件的编辑界面。\n\n上述界面表示 `sources.list` 文件的编辑界面已成功打开。接下来，用户可以编辑文件。\n\
  \n下节将介绍如何使用 `Vi` 文本编辑器编辑文件和保存文件。在使用 `VI` 编辑器之前，你需要理解它的 3 种工作模式，即命令模式、输入模式和末行模式。\n\
  \n这 3 种模式的功能如下：\n\n- 命令模式：启动 `Vi` 文本编辑器后，默认进入命令模式。该模式主要完成光标移动、字符串搜索以及删除、复制和粘贴文件内容的相关操作。\n\
  \n- 输入模式：此模式下的主要操作是输入文件内容，以便你可以修改文本文件主体或添加新内容。当处于输入模式时，`Vi` 文本编辑器的最后一行将显示状态提示信息\
  \ `--INSERT--。\n\n- 末行模式：在此模式下，你可以设置 `VI` 编辑环境、保存文件、退出编辑器并执行搜索和替换文件内容等操作。当处于末行模式时，`VI`\
  \ 编辑器的最后一行会出现冒号(:) 提示符。\n\n当用户使用 `Vi` 文本编辑器打开文件时，默认进入命令模式。此时，按下 `a`、`i` 或 `o` 进入输入模式并编辑文件内容。编辑完成后，按下\
  \ `Esc` 返回命令模式。然后，输入 `:` 提示进入末行模式，输入 `:wq` 保存并退出。或者，用户也可以输入 `ZZ` 保存并退出。\n\n第 5 章\n\
  \nKali 中的设置面板\n\n![](img/image_r49V.jpg)\n\n在上一章中，我们学习了各种 Kali Linux 特性的重要性。本章将详细介绍设置面板以及用户需要了解的网络功能。\n\
  \n# 设置面板\n\n设置面板可用于设置系统，如分辨率、电源、背景颜色、网络连接等。在某些系统中执行操作时，这些设置是必要的。本节将介绍 Kali 的设置面板。\n\
  \n启动设置面板\n\n1) 点击收藏应用程序按钮，显示所有应用程序。\n\n2) 点击此界面上的设置按钮打开“设置”面板。\n\n3) 你可以在左栏看到所有设置项。用户选择设置项后，可以在右栏进行相应的设置。例如，设置电源。在左栏选择`电源`设置项，在右栏设置`空屏\
  \ (B)`和`自动睡眠 (A)`的时间。\n\n# 配置网络\n\n为了实施渗透测试，你需要连接网络。在实施渗透测试之前，你需要配置网络。用户可以使用有线网络、无线网络和\
  \ `VPN` 连接网络。本节将介绍这三种网络配置方法。\n\n配置有线网络\n\n有线网络是通过同轴缆缆、双绞线和光纤连接的计算机网络。简单来说，就是通过网线连接的计算机网络，通常称为以太网。有线网络相对稳定。如果用户需要下载较大的文件或更新系统，则建议使用有线网络。在\
  \ Kali Linux 中，用户可以使用命令行或图形界面配置有线网络。\n\n1) `ifconfig` 命令查看现有的网络配置\n\n配置网络之前，首先检查现有的网络配置。如果网络已经配置，则无需再次配置。如果没有配置，则用户需要手动配置。\n\
  \n\n\n\n\n使用 `ifconfig` 命令查看现有的网络配置，如下：\n\n```\nroot@exampleserver:～# ifconfig\n\
  ```\n\n这将显示大量关于有线网络的信息。我们建议你保存这些信息的截图，以便以后参考你正在攻击的目标。当你针对无线网络时，这很有用。\n\n### 图形界面设置\n\
  \n图形界面设置相对直观且易于操作。下节将介绍在图形界面上设置有线网络。\n\n配置有线网络的具体步骤如下：\n\n1) 打开“设置”（Settings）面板并选择“网络”（Network）设置项，将显示对话框。\n\
  \n2) 从此对话框可以看出，有线网络未连接。此时，点击设置按钮，将显示对话框。\n\n3) 从对话框中可以看到它包含 5 个标签，分别是详细信息（Details）、身份（Identity）、IPv4、IPv6\
  \ 和安全（Security）。这里主要配置 `IPv4` 标签中的选项。设置后，你可以在“详细信息”选项卡中查看获取的网络信息。选择 `IPv4` 选项卡，将显示对话框。\n\
  \n4) 在此对话框中设置获取 IPv4 地址的方法。这里提供了 4 种方法，即自动（DHCP）、手动（manual）、仅本地链路（local link only）和禁用（Disable）。其中，“自动\
  \ (DHCP)”选项意味着 DHCP 服务器将自动为当前主机分配 IP 地址。\n\n“手动”选项意味着用户需要手动设置 IP 地址、子网掩码和网关。“仅本地链路”选项仅用于无法访问互联网时的本地连接。“禁用”选项表示禁用\
  \ IPv4 地址。如果你想访问互联网，必须使用自动 (DHCP) 或手动方法。为了方便使用和更快的操作，“自动 (DHCP)”是最佳选择。如果用户想固定当前计算机的地址，可以选择“手动”单选按钮，这将显示对话框。\n\
  \n5) 在此对话框中，你可以手动指定 IP 地址、子网掩码、网关、DNS 和路由信息，以防止用户因配置错误无法访问互联网。建议仅设置 IP 地址和子网掩码。设置完成后，点击右上角的“应用\
  \ (A)”按钮返回网络设置对话框。\n\n6) 此时，有线网络配置完成。但接口尚未激活。因此，用户需要激活接口才能获取分配的 IP 地址并访问互联网。点击此对话框中的启动按钮连接到有线网络。\n\
  \n7) 从此对话框中可以看到有线网络的状态为“已连接”。这表明有线网络配置成功。此时，你可以在“详细信息”选项卡中查看获取的地址信息。\n\n8) 从此对话框中可以看到有线网络速度、IPv4\
  \ 和 IPv6 地址、硬件地址、默认路由和 DNS 信息。务必在此界面勾选“自动连接 (A)”复选框。否则，重启电脑后将无法自动连接网络。默认情况下，“自动连接\
  \ (A)”复选框是被选中的。\n\n### 命令行设置\n\n使用命令行配置网络也非常简单，通过几个命令即可完成配置。Kali Linux 的网络连接配置文件为\
  \ `/etc/network/interfaces`。使用 `VI` 编辑器编辑 interfaces 文件。\n\n文件的默认内容如下：\n\n```\n\
  root@exampleserver:～# vi /etc/network/interfaces\n\n# 此文件描述了系统上可用的网络接口 # 以及如何激活它们。\n\
  ```\n\n从上述信息可以看出，默认只配置了一个 `lo` 接口。如果你想配置有线网络，请添加以太网接口 `ethX` 的信息。同样，用户可以设置动态获取 IP\
  \ 地址或静态分配 IP 地址（手动）。例如，以下将设置以太网接口 `eth0` 的有线网络。\n\n动态获取 IP 地址的方法如下：\n\n```\nauto\
  \ eth0 iface eth0 inet dhcp\n```\n\n静态分配 IP 地址的方法如下：\n\n```\nauto eth0 iface eth0\
  \ inet static\n```\n\n用户可以选择适合自己的方法来配置有线网络。设置完成后，保存并退出 `interfaces` 文件配置界面。接下来，用户还需要重启网络服务以使\
  \ `interfaces` 文件中的配置生效。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# service networking\
  \ restart\n```\n\n执行上述命令后，不会输出信息。此时，用户可以使用 `ifconfig` 命令查看获取的地址信息。\n\n### 配置无线网络\n\
  \n无线网络指的是任何形式的无线计算机网络。计算机需要通过无线网卡连接到网络。如果用户在虚拟机安装了 Kali Linux 系统并想要连接物理网络，可以使用无线网卡连接到他的无线网络。\n\
  \n配置无线网络的具体步骤如下：\n\n1) 确定你的主机是否有无线网卡。如果没有无线网卡，可以使用 USB 无线网卡。将 USB 无线网卡插入主机，使用 `lsusb`\
  \ 命令检查无线网卡是否被成功识别。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# lsusb\n```\n\n2) 使用\
  \ `ifconfig` 命令检查无线网络接口是否已激活，如下：\n\n```\nroot@exampleserver:～# ifconfig\n```\n\n\
  此时，用户可以使用 `ifconfig -a` 命令查看所有接口。执行此命令后，如果你看到 `wlan` 接口名称，意味着网卡已成功识别。用户需要使用以下命令激活网卡。\n\
  \n```\nroot@exampleserver:～# ifconfig wlan0 up\n```\n\n执行上述命令后，没有输出信息。为了判断无线网卡是否成功激活，用户可以再次使用\
  \ `ifconfig` 命令检查。\n\n3) 在 Kali Linux 的图形界面中，点击右上角的关闭按钮，将弹出菜单。\n\n4) 从此菜单中，你可以看到“有线已连接”、“Wi-Fi\
  \ 未连接”和“无”等命令。选择“Wi-Fi 未连接”选项，将弹出相关设置的子命令。\n\n5) 选择“选择网络”命令查看搜索到的所有 Wi-Fi 网络。\n\n\
  6) 在此对话框中，你可以设置要连接的 Wi-Fi 网络进行网络连接。例如，连接到 Test 无线网络。先选择 Test 无线网络，然后点击“连接”按钮，将弹出对话框。\n\
  \n7) 在此对话框中输入 Test 无线网络的认证密码，然后点击“连接”按钮。如果连接成功，你可以看到连接的无线网络名称。\n\n上述方法适用于无线 AP 名称广播且用户可以直接连接的情况。在许多情况下，用户为了安全可能会隐藏\
  \ SSID 号。此时，用户在搜索信号中看不到 Wi-Fi 网络。因此用户需要手动添加无线网络并连接。\n\n连接隐藏网络的具体步骤如下：\n\n1) 使用 `ifconfig`\
  \ 命令确认你的无线网卡已激活。\n\n2) 选择“Wi-Fi”选项打开 WiFi 对话框。点击右上角的列表按钮。\n\n\n\n\n\n3) 从此对话框可以看出，有\
  \ 3 个选项分别用于连接隐藏网络、开启热点（Turn On Wi-Fi Hotspot）以及已知的 Wi-Fi 网络（Known Wi-Fi Networks）。在这里，点击“连接到隐藏网络\
  \ (C)...”按钮，将弹出对话框。\n\n4) 在此对话框中输入隐藏 Wi-Fi 网络信息后，点击“连接”按钮连接到隐藏网络。其中，`Network name`\
  \ 用于指定网络名称，`Wi-Fi security` 用于指定无线网络的安全认证/加密认证方法。\n\n默认情况下，系统提供 6 种认证方法，即：`WEP40/128-bit\
  \ key (hexadecimal or ASCII)`、`WEP 128-bit pass phrase`、`LEAP`、`Dynamic WEP (802.1x)`、`WPA`\
  \ and `WPA2 personal` 以及 `WPA` and `WPA2 enterprises`。当用户选择任何加密方法时，会弹出相应的密码文本框。在本例中，连接的无线网络名称为\
  \ `Test`，加密认证方法为 `WPA-PSK/WPA2-PSK`。\n\n5)在此对话框中输入要连接的隐藏网络信息后，点击 `Connect` 按钮连接到相应的网络。\n\
  \n# 配置 VPN 网络\n\nVPN 称为虚拟私有网络，属于远程访问技术。简单来说，就是利用公共网络建立私有网络进行加密通信。本节将介绍在 Kali Linux\
  \ 中设置 VPN 代理网络的方法。\n\n## 1) 安装 VPN 配置软件包\n\n安装完 Kali Linux 操作系统后，还无法配置 VPN 代理。\n\
  \n添加网络连接从此界面可以看出，只能导入而不能手动添加。这是因为当前系统中没有安装与 VPN 配置相关的软件包。下节将详细介绍需要安装的几个 VPN 配置软件包。\n\
  \n执行命令如下：\n\n```bash\nroot@exampleserver:～#apt-get install network-manager-openvpn-gnome\
  \ -y\n```\n\n执行完上述命令后，如果输出信息中没有报错，则说明软件包安装成功。然后重启网络管理器以使网络配置生效。\n\n执行命令如下：\n\n```bash\n\
  root@exampleserver:～#service network-manager restart\n```\n\n执行上述命令后，将不会显示任何信息。接下来，用户就可以配置\
  \ VPN 代理了。\n\n提示：VPN 相关软件包必须在配置软件源后才能安装。\n\n## 2) 配置 VPN 网络\n\n安装完上述软件包后，就可以配置 VPN\
  \ 网络了。\n\n配置 VPN 的具体步骤如下：\n\n1) 打开 `Settings` 面板并选择 `Network` 选项，将显示对话框。\n\n2) 在对话框中，点击\
  \ `VPN` 选项右侧的加号按钮添加 VPN 网络。\n\n3) 从此对话框可以添加两种类型，即 `OpenVPN` 和 `Point-to-Point Tunneling\
  \ Protocol (PPTP)`。在此选择 `Point-to-Point Tunneling Protocol (PPTP)` 选项，将打开对话框。\n\n\
  4) 在此界面设置 VPN 连接名称（任意名称）、服务器地址（网关框）、登录用户名和密码。设置完成后，点击 `Advanced...` 按钮，将显示对话框。\n\
  \n5) 勾选 `Use Point-to-Point Encryption (MPPE) (P)` 复选框并点击 `OK` 按钮返回 VPN 连接信息配置。点击对话框右上角的\
  \ `Add (A)` 按钮。\n\n6) 从此对话框可以看出，已添加名为 `VPN1` 的 VPN 网络。默认情况下，该网络尚未启用。如果你想使用该网络，需要先启动它。点击按钮将尝试连接到\
  \ VPN 网络。连接成功后，你将在顶部菜单栏看到锁定的网络连接图标。\n\n# 第 6 章：在 Kali 中配置软件\n\n![](img/image_rsrc49V.jpg)\n\
  \n当用户安装操作系统时，如果没有选择使用网络镜像，则默认不会配置软件源。如果你使用网络镜像，则会自动配置 Kali Linux 软件源。本节将介绍如何配置软件源。\n\
  \n### 什么是软件源？\n\n软件源是一个应用程序安装库，其中包含了大量的应用程序。它可以是一个网络服务器、光盘（CD-ROM）甚至是硬盘上的一个目录。通过使用软件源方法，你可以快速安装所需的软件。\n\
  \n下面将介绍软件源的功能和格式。\n\n#### 1) 软件源的作用\n\n通过配置软件源可以提高安装软件的效率，非常方便。用户配置软件源后，安装软件时会自动从软件源仓库下载并进行快速安装。\n\
  \n#### 2) 软件源的格式\n\n为了配置合适的软件源，你需要了解软件源的格式。\n\n下节将以 Kali 官方软件源为例，介绍软件源的格式及各部分的含义如下：\n\
  \n```text\ndeb http://http.kali.org/kali kali-rolling main non-free contrib own\n\
  ```\n\n用户可以将这行代码分为 4 部分。这 4 部分的含义介绍如下：\n\n**1) deb**\n\n第一部分是 `deb` 或 `deb-src`。其中，`deb`\
  \ 代表软件包的位置，`deb-src` 代表源码的位置。\n\n**2) http://http.kali.org/kali (URI)**\n\n第二部分代表软件下载地址（URI）。当用户在浏览器中打开该链接时，会发现它包含多个目录。以此处的镜像地址为例，打开后将显示界面。\n\
  \n其中，`/dists/` 目录包含“releases”，这是获取发布版和预发布包的方式。此外，它还包含一些旧软件包和 `packages.gz` 文件。`/pool/`\
  \ 目录是软件包的物理地址。为了方便管理，`pool` 目录根据属性分为三类：`main`、`contrib` 和 `non-free`。\n\n然后在分类分类下，根据包名的首字母进行划分。这些目录包含的文件包括各种系统架构的二进制软件包，以及生成这些二进制包的源码包。`/project/`\
  \ 目录是开发者的资源。\n\n**3) 版本**\n\n第三部分代表 Kali 的版本号。注意，这里的版本号不是某个软件的版本，而是 Kali 本身的版本。关于此项的具体表述，请参考网页\
  \ `http://http.kali.org/dists/`。目前 Kali Linux 使用的软件源版本为 `kali-rolling`。上一章也详细介绍了\
  \ Kali 版本的历史。\n\n**4) 目录**\n\n第四部分是所有目录包含的 3 个目录。例如，进入 `kali-rolling` 目录，将看到界面。\n\
  \n从显示的信息可以看出，包含 `contrib`、`main` 和 `non-free` 三个目录。\n\n\n\n\n\n在用户对软件源的含义和格式有清晰了解后，就可以添加软件源。本节将介绍\
  \ Kali Linux 系统中的官方软件源和常用的第三方软件源。\n\n### 1) 官方软件源\n\nKali Linux 官方源以及由官方重定向的源通常比较稳定。然而，速度并不一定快。\n\
  \n其中，Kali 的官方源如下：\n\n`deb http://http.kali.org/kali kali-rolling main non-free contrib`\n\
  \n### 2) 常用的第三方软件源\n\n由于 Kali 的官方源是国外网站，国内用户在使用时可能会遇到网络不稳定问题，这可能导致软件包安装失败。此外，下载速度仍然较慢。此时，用户可以尝试添加第三方软件源。\n\
  \n针对不同的国家和地区有许多可用的镜像站。你可以通过快速 Google 搜索来找到可用的第三方源列表。此外，你也可以使用 Torrent（种子）来分发 Linux\
  \ 镜像文件。这在任何方面都不是违法的，并且可以帮助你快速下载软件。\n\n### 3) HTTP 和 HTTPS 的选择\n\n出于安全考虑，这些软件源目前支持\
  \ HTTPS 协议。要使用 HTTPS 协议的软件源，只需将 URL 地址中的 `http` 改为 `https` 即可。\n\n`deb https://http.kali.org/kali\
  \ kali-rolling main non-free contrib`\n\n由于加密问题，HTTPS 下载软件的速度较慢。但它可以避免缓存服务器的影响。因此，如果用户在安装软件时因为缓存服务器导致无法下载软件，可以将软件源修改为\
  \ `HTTPS` 并重新安装软件。\n\n### 4. deb-src 软件源\n\n某些软件不提供二进制包，只提供源代码。对于这类软件，必须添加 `deb-src`\
  \ 软件源。下载后，它会在用户的计算机上自动编译并生成可执行文件。\n\n其中，`deb-src` 软件源的格式如下：\n\n`deb-src http://http.kali.org/kali\
  \ kali-rolling main non-free contrib`\n\n### 更新软件源/系统\n\n用户配置软件源后，需要使用 `apt-get\
  \ update` 命令更新软件源，以使配置生效。用户也可以通过更新软件源来快速更新系统。\n\n本节将介绍更新软件源和更新系统的方法。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# apt-get update\n```\n\n从上面的输出可以看出，软件源已成功更新。\n\n执行命令如下：\n\
  \n```bash\nroot@exampleserver:～# apt-get dist-upgrade R\n```\n\n上面的输出信息显示了更新后的包信息，包括要升级的包、新安装的包以及卸载的包。此时，输入\
  \ `Y` 继续操作。如果后续操作过程中没有错误信息，则系统更新将成功。更新完成后，重启系统，即重新加载新系统。\n\n用户也可以使用图形界面来更新操作系统。\n\
  \n具体步骤如下：\n\n1) 点击左侧收藏夹中的 `Show all programs`（显示所有程序）按钮打开所有程序界面，点击 `Software`（软件）按钮显示对话框。\n\
  2) 从对话框的 `Update (U)`（更新）选项卡可以看到有更新提示。此时，点击 `Operating System Update`（操作系统更新）选项查看需要更新的软件包。\n\
  3) 界面会显示需要更新的软件包。此时点击右上角的 `close`（关闭）按钮返回软件更新对话框。然后，点击 `Download (D)`（下载）按钮开始下载更新后的软件包。下载完成后，将显示该对话框。\n\
  4) 点击右上角的 `Restart and Update`（重启并更新）按钮，会弹出 `Restart and Install Update`（重启并安装更新）对话框。\n\
  5) 点击 `Restart and Install`（重启并安装）重启系统并更新软件包。\n6) 此界面显示正在安装的更新包。更新完成后，系统会自动重启。\n\
  \n### 从软件源安装软件\n\n用户配置软件源后，就可以安装软件源中提供的所有软件。本节将介绍软件源中的软件。\n\n#### 确认包名\n\n用户在安装软件时，需要知道包名。如果你不确定名称，可以使用\
  \ Kali Linux 中的几个命令来搜索包名。\n\n确认包名的方法描述如下。\n\n#### 什么是软件包？\n\n软件包是指具有特定功能以完成任务的程序或一组程序。软件包由基础组件和可选组件组成，可以以源代码或目标代码的形式存在。在\
  \ Linux 系统中，软件包有两种主要形式，即二进制包和源码包。其中，最常见的二进制包格式是 `deb` 和 `rpm`。\n\n#### 根据关键词搜索软件包\n\
  \n在 Kali Linux 中，用户可以使用 `apt-cache` 命令根据关键词搜索软件包。\n\n其中，命令的语法格式如下：\n\n`apt-cache\
  \ search package_name`\n\n根据关键词 `pm-` 搜索包名。\n\n```bash\nroot@exampleserver:～# apt-cache\
  \ search \"pm-\"\n```\n\n从输出中可以看到所有包含 `pm-` 关键词的包都已被搜索。在上面的信息中，分别显示了包名和软件包的功能。通过软件包信息可以确定包名。\n\
  \n\n\n\n当用户确定了要安装的软件包名称后，即可安装该软件。此外，如果系统中已经安装了某个软件，用户也可以进行更新。下面将介绍软件的安装和更新方法。\n\n\
  ### 1) 安装软件\n\n在 Kali Linux 中，`apt-get install` 命令主要用于安装软件源中的软件。\n\n其中，该命令的语法格式如下：\n\
  \n```\napt-get install [packet_name]\n```\n\n下面将以 `StartDict` 软件包为例，介绍如何从软件源安装该软件。`StartDict`\
  \ 是国外知名的字典框架，可以用它查询英语单词的含义。当然，用户也可以加入国内翻译工具的字典，例如《牛津词典》（Oxford dictionary）。Kali\
  \ Linux 软件源中提供了该字典框架。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# apt-get install qstardict\
  \ stardict-*\n```\n\n执行上述命令后，如果没有报告错误，则说明 `StarDict` 工具安装成功。此时，用户可以将其他翻译工具的词典文件（`.dict.dz`,\
  \ `.dix`, `.ifo.syn`）复制到 `/usr/share/stardict/dic` 目录下，然后即可该工具。\n\n### 2) 更新软件\n\
  \n如果某个软件有了官方更新，但 Kali Linux 中仍在使用旧版本，此时用户可以通过重新安装软件来更新，以便尽快体验新功能。\n\n例如，要更新 `wpscan`\
  \ 工具，执行命令如下：\n\n```\nroot@exampleserver:～# apt-get install wpscan\n```\n\n从上述输出信息可以看出，有\
  \ 3 个软件包已升级。从显示的结果中看到，`wpscan` 工具已从原始版本 `3.4.3` 升级到 `3.5.0` 版本。\n\n上述方法仅用于单独更新某个软件。\n\
  \n如果用户想要更新所有软件，执行命令如下：\n\n```\nroot@exampleserver:～# apt-get upgrade\n```\n\n执行上述命令后，当前系统中所有需要升级的软件包都将完成升级。\n\
  \n### 软件\n\n当用户不再需要某个软件时，可以将其删除。\n\n删除软件使用的语法格式如下：\n\n```\napt-get remove [package_name]\n\
  ```\n\n# 卸载软件包\n\n或\n\n```\napt-get purge [package_name]\n```\n\n# 卸载并清除软件包配置\n\n\
  卸载 `apt-file` 软件。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# apt-get remove apt-file\n\
  ```\n\n看到上述输出信息，意味着 `apt-file` 软件已成功卸载。\n\n### 安装虚拟机增强工具\n\n为了方便在物理机和虚拟机之间复制文件，需要安装虚拟机增强工具。`open-vm-tools`\
  \ 是一个针对 VMware 虚拟机的增强工具。它提供了 VMware 驱动，以增强虚拟显卡和硬盘的性能，并同步虚拟机与主机的时钟。只有在 VMware 虚拟机中安装了\
  \ `open-vm-tools` 工具，才能实现主机与虚拟机之间的文件共享，并支持自由的拖放放置功能。鼠标也可以在虚拟机和主机之间自由移动（无需再次按下 `Ctrl+Alt`\
  \ 快捷键）。\n\n下节将介绍如何安装虚拟机增强工具。\n\n在 Kali Linux 中安装 `open-vm-tools`。\n\n执行命令如下：\n\n\
  ```\nroot@exampleserver:～# apt-get install open-vm-tools-desktop fuse\n```\n\n执行上述命令后，将安装\
  \ `open-vm-tools` 工具。安装完成后，重启电脑。电脑重启后，用户可以在物理机和虚拟机之间自由地移动、复制和粘贴文件。\n\n# 第 7 章：Kali\
  \ 中的第三方软件安装\n\n![](img/image_rsrc49V.jpg)\n\nKali Linux 系统默认安装了大量的渗透测试软件。然而，某些渗透测试工具并未安装（例如\
  \ `Nessus`），需要从第三方下载并安装。通常，从第三方获取的软件包格式包括 `.deb`, `.tar.gz`, `.tar.bz2`, `zip` 和\
  \ `rar`。为了满足用户需求，本节将介绍这些格式软件包的安装方法。\n\n# 安装二进制软件\n\n二进制包包含了已经编译并可以立即运行的程序。用户只需在使用前对其下载并解压（安装）即可。在\
  \ Linux 系统中，二进制软件包括两种格式：`RPM` 和 `DEB`。其中，`RPM` 是基于 Red Hat Linux 发行版的包管理器，后缀为 `.rpm`；而\
  \ `DEB` 是基于 Debian 的包管理器，后缀为 `.deb`。Kali Linux 基于 Debian，因此其二进制包格式为 `.deb`。下节将介绍在\
  \ Kali Linux 中安装二进制包的方法。\n\n下节将以 `Nessus` 软件为例，介绍二进制包的安装方法。\n\n具体步骤如下：\n\n1) 在 `Nessus`\
  \ 官网下载与你操作系统操作系统架构相同的二进制包。其中，`Nessus` 的下载地址为 `https://www.tenable.com/downloads/nessus`。在本例中，下载的包名为\
  \ `Nessus-8.3.1-debian664.deb`。\n\n2) 安装 `Nessus` 工具。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ dpkg -i Nessus-8.3.1-debian664.deb\n```\n\n看到上述输出信息，意味着 `Nessus` 工具已安装成功。接下来用户可以使用该工具进行扫描。\n\
  \n# 安装源码\n\n源码包包含了程序的源代码，需要用户进行编译以生成可运行的程序。通过源码安装软件耗时较长。在 Linux 中，常见的源码格式有 `.tar.gz`\
  \ 和 `.tar.bz2`。下节将介绍这两种格式的安装方法。\n\n如果要安装 `.tar.gz` 和 `.tar.bz2` 源码包，需要使用 `tar` 命令进行解压，然后进行配置、编译和安装。\n\
  \n解压 `.tar.gz` 源码包的语法格式如下：\n\n```\ntar zxvf 文件 [-C 目录]\n```\n\n解压 `.tar.bz2` 源码包的语法格式如下：\n\
  \n```\ntar jxvf 文件 [-C 目录]\n```\n\n在上述语法中，`[-C 目录]` 用于指定源码包的解压位置。如果不指定，默认解压到当前目录。\n\
  \n下节将以中间攻击工具为例，演示 `.tar.gz` 格式源码包的安装方法。\n\n具体步骤如下：\n\n1) 访问网站 `http://code.google.com/p/subterfuge/downloads/list`\
  \ 下载 `subterfuge` 软件包。包名为 `subterfuge_packages.tar.gz`。将下载的包拷贝到 Kali 系统。\n\n2) 解压下载的软件包。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# tar zxvf subterfuge_packages.tar.gz\n```\n\
  \n成功解压 `subterfuge` 软件包后，所有文件将解压到 `subterfuge` 目录。\n\n3) 安装 `subterfuge` 工具：\n\n\
  ```\nroot@exampleserver:～# cd subterfuge/\nroot@daxueba:～/subterfuge# python install.py\n\
  ```\n\n执行上述命令后，将显示界面。\n\n4) 在界面中选择 `Full Install With Dependencies` 单选按钮，然后点击 `Install`\
  \ 按钮进行安装。\n\n\n\n\n5) 从此界面，你可以看到弹出一个小型对话框，显示 Subterfuge 安装完成。此时，点击 `Finish` 按钮完成安装。\n\
  \n接下来的部分将以 Firefox 浏览器为例，演示如何安装 `tar.bz2` 格式的软件包。\n\n具体步骤如下：\n\n1) 下载 Linux 版本的\
  \ Firefox 浏览器软件包包。\n\n在本例中，下载的包名为 `Firefox-latest-x86_64.tar.bz2`。\n\n提示：在下载 Firefox\
  \ 浏览器软件包时，你必须根据用户的硬件架构进行选择。在本例中，下载的是 64 位架构的包。\n\n2) 解压软件包。\n\n执行的命令如下：\n\n```\n\
  root@exampleserver:～# tar jxvf Firefox-latest-x86_64.tar.bz2-C /usr\n```\n\n执行上述命令后，Firefox\
  \ 软件包中的所有文件都将解压到 `/usr` 目录。其中，解压后的文件名为 `firefox`。\n\n3) 切换到解压后的 `firefox` 目录，你会看到一个名为\
  \ `firefox` 的可执行文件。\n\n该可执行文件用于启动 Firefox 浏览器，如下所示：\n\n```\nroot@exampleserver:～#\
  \ cd /usr/firefox/ root@exampleserver:/usr/firefox\n```\n\n从上述显示的结果中，你可以看到可执行文件\
  \ `firefox` 用于启动浏览器。\n\n# 执行软件\n\n当用户成功将软件安装到系统后，就可以启动该软件对应的工具。其中，某些软件可以通过命令或图形界面启动，而某些软件则是使用可执行脚本启动。本节将分别介绍这两类软件的启动方法。\n\
  \n## 普通软件\n\n通常，启动常用软件的方法是使用命令行和图形界面。此外，Kali Linux 系统还提供了 `Alt+F2` 快捷键来打开命令提示对话框。用户可以在此对话框中输入任何要执行的命令。下面将介绍常用软件的几种启动方法。\n\
  \n### a) 图形界面模式\n\n图形界面方法是通过菜单命令启动。接下来的部分将以 Wireshark 软件为例介绍其启动方法。\n\n1) 在图形界面中，依次选择“Applications”|“sniffing/spoofing”|`Wireshark`\
  \ 命令。\n\n2) 在此处选择 `Wireshark` 命令后，软件即可成功运行。\n\n看到此界面表示 Wireshark 已成功启动。接下来，用户选择网络接口，可以使用该软件捕捉数据包。\n\
  \n### b) 命令行模式\n\n命令行方法是通过终端执行的。接下来的部分将以 Metasploit 框架为例，介绍使用命令行启动软件的方法。\n\n启动 Metasploit\
  \ 终端模式并执行命令如下：\n\n```\nroot@exampleserver:～# msfconsole\n```\n\n从输出信息中，你可以看到命令行提示符显示为\
  \ `msf5 >`。这表明 Metasploit 工具已成功启动。\n\n### c) 命令行提示符\n\n用户可以使用命令行提示符运行某些从终端运行的软件，且它们在界面模式下运行。这样一来，就不需要占用终端窗口。下面将以\
  \ DirBuster 软件为例介绍使用命令行提示符启动软件的方法。\n\n具体步骤如下：\n\n(1) 使用快捷键 `Alt+F2` 启动命令行提示符。\n\n\
  (2) 在此界面中输入启动软件的命令。然后按 Enter 键启动工具。\n\n看到此界面意味着 DirBuster 软件已成功启动。\n\n# 执行脚本\n\n\
  在 Kali Linux 系统中，某些软件在安装后需要通过脚本启动。其中最常见的可执行脚本有 Python、Ruby、Perl 和 Shell。对于某些脚本，可能还需要安装库或模块。本节将介绍几种常见的执行脚本启动方法。\n\
  \n### a) 执行 Ruby 脚本\n\n当用户执行 Ruby 脚本时，可能会缺少 Ruby 库文件。此时，用户需要使用 `gem install` 命令安装相应的库。\n\
  \n其中安装 Ruby 库文件的语法格式如下：\n\n```\ngem install [package]\n```\n\n然后，使用 `ruby` 命令执行其\
  \ Ruby 脚本，如下：\n\n```\nroot@exampleserver:～# ruby hello.rb Hello World.\n```\n\n\
  ### b) 执行 Python 脚本\n\n当用户执行 Python 脚本时，可能会遇到缺少依赖包的问题。此时，用户可以使用 `pip install` 命令安装相应的依赖包。只有这样才能执行其\
  \ Python 脚本。\n\n例如，`polenum` 是一个 Python 脚本，可以使用 Python 的 `impacket` 库从 Windows 内核安全机制获取密码策略。然而，该脚本依赖\
  \ `impacket` `0.9.11` 版本库。因此，如果你想使用 `polenum` 工具，必须安装 `impacket` `0.9.11`。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# pip install impacket==0.9.11\n```\n\n从上述输出的最后一行，你可以看到\
  \ `impacket-0.9.11` 包已成功安装。接下来，用户可以使用 `polenum` 工具。\n\nKali Linux 默认提供两个版本的 Python，即\
  \ Python 2 和 Python 3。`pip` 可以安装 Python 2 的依赖包。如果需要安装 Python 3 的依赖包，则需要安装 `pip3`。\n\
  \n首先，执行以下命令安装：\n\n```\nroot@exampleserver:～# apt-get install python3-pip\n```\n\n\
  执行上述命令后，如果没有报错，说明 `pip3` 命令安装成功。接下来，可以使用 `pip3` 安装依赖包。例如：\n\n```\nroot@exampleserver:～/kickout#\
  \ pip3 install scapy-python3 python-nmap netifaces\n```上述过程下载并安装了 `KickTheOut` 工具依赖的包。从输出的最后一行，可以看到上述依赖包已成功安装。\n\
  \n### c) 执行 Perl 脚本\n\n当用户执行 Perl 脚本时，可能会遇到缺少 Perl 模块的问题。此时，用户需要使用 `cpan` 命令安装，然后执行相应的脚本。例如，使用第三方工具\
  \ `7z2hashcat` 需要 `Compress::Raw::Lzma` 组件。在这种情况下，你需要使用 `cpan` 命令安装该组件。`cpan` 工具包含在\
  \ `perl-doc` 包中，因此你先需要安装 `perl-doc` 包。执行命令如下：\n\n```\nroot@exampleserver:～# apt-get\
  \ install perl-doc\n```\n\n### d) 执行 Shell 脚本\n\nShell 脚本执行相对简单，用户只需要添加执行权限。例如，有一个名为\
  \ `test.sh` 的 Shell 脚本，下面将在添加执行权限后执行：\n\n(1) 添加执行权限。执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ chmod +x test.sh\n```\n\n执行上述命令后，没有信息输出。\n\n(2) 执行 `test.sh` 脚本，如下：\n\n```\nroot@exampleserver:～#\
  \ ./test.sh\n```\n\n或者\n\n```\nroot@exampleserver:～# sh test.sh Hello World!\n```\n\
  \n你可以看到输出了一行信息，这表明 `test.sh` 脚本已成功执行。\n\n\n\n\n驱动程序是添加到操作系统的特殊程序。驱动程序包含有关硬件设备的信息。这些信息使得计算机能够与相应的设备通信。当硬件设备添加到计算机时，必须安装相应的驱动程序。否则，设备将无法使用。\n\
  \n对于 Kali Linux 系统，由于系统内核较新，它可以支持大多数设备驱动程序。然而，对于某些设备，用户有时需要手动安装驱动程序，例如显卡驱动。本节将介绍如何查看设备驱动信息以及安装驱动。\n\
  \n提示：由于安装驱动程序存在风险，建议在安装之前备份重要数据。\n\n# 查看设备\n\n在安装驱动程序之前，用户可以使用 `lsusb` 和 `lspci`\
  \ 命令查看 USB 或 PCI 设备的详细信息，以确定驱动是否正确。如果已成功启动，则需要安装驱动程序。以下将介绍如何检查设备是否被正确驱动。\n\n###\
  \ a) 查看 USB 设备\n\n当用户执行无线渗透测试时，通常需要使用带有 USB 接口的无线网卡。当用户将设备连接到系统时，可以使用 `lsusb` 命令查看\
  \ USB 设备列表信息，确定设备是否被正确识别，如下：\n\n```\nroot@exampleserver:～# lsusb\n```\n\n上述输出信息显示了当前系统中的\
  \ USB 设备列表信息。该输出包含 3 部分，即总线号、设备号和厂商 ID。通过分析设备的厂商 ID 信息，可以知道该设备是型号为 Realtek Semiconductor\
  \ Corp. 的 USB 设备。\n\n用户可以使用 `lsusb` 命令的 `-v` 选项检查设备的驱动模块，以确认驱动程序是否正确。以下将介绍如何使用 `lsusb`\
  \ 命令查看 USB 设备的详细信息。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# lsusb -v Bus\n```\n\
  \n执行上述命令后，将输出大量信息。由于空间限制，仅简要列出了第一个 USB 设备的详细信息。从输出信息中，你可以看到设备的厂商 ID 和产品 ID 信息。这说明设备已正确加载了驱动程序。如果没有驱动，你将无法看到类似的信息。\n\
  \n### b) 查看 PCI 设备\n\nPCI（外围组件互连，外围组件互连标准）是目前个人计算机中最广泛使用的接口规范，几乎所有主板产品都有此规格的插槽。PCI\
  \ 设备是指连接到这些 PCI 插槽的设备，例如声卡、网卡和显卡。Kali Linux 提供了一个名为 `lspci` 的命令来查看系统中的 PCI 设备列表。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# lspci\n```\n\n上述输出信息显示了当前系统中所有的 PCI 设备信息。从输出信息中，我们可以看到主板芯片、接口插槽、显卡和网卡等\
  \ PCI 设备。\n\n用户可以使用 `lspci` 命令的 `-v` 选项查看 PCI 设备的驱动模块，然后确认设备是否被正确驱动。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# lspci -v\n```\n\n通过此界面，你可以看到获取的 PCI 设备的详细信息。从显示的信息中，你可以看到每个\
  \ PCI 设备的驱动信息。例如，当前系统使用的显卡驱动为 `vmwgfx`。\n\n### c) 虚拟机使用 USB 设备\n\n当用户执行无线渗透测试时，必须使用无线网卡。然而，通常情况下，系统内置的无线网卡芯片不支持无线监控。因此，用户必须使用带有\
  \ USB 接口的无线网卡来实现这一目标。\n\n如果是物理机，用户可以直接将 USB 设备插入主机。如果是虚拟机，用户需要手动连接。此外，你必须启动虚拟机的\
  \ USB 服务（VMware USB Arbitration Service）。否则，连接的 USB 设备将无法被识别。\n\n以下章节将以 USB 无线网卡为例，介绍在虚拟机中使用\
  \ USB 设备的方法。\n\n具体步骤如下：\n\n#### 1) 虚拟机的 USB 服务。\n\n右键点击桌面上的“计算机”图标，在弹出菜单中选择 `管理`\
  \ | `服务和应用程序` | `服务` 命令以打开服务管理器。\n\n#### 2) VMware USB Arbitration Service。\n\n\
  在列表中找到 `VMware USB Arbitration Service` 并确保它已启动。\n\n#### 3) 连接 USB 设备。\n\n将 USB\
  \ 无线网卡插入主机，并使用虚拟机接口连接设备。\n\n#### 4) 验证连接。\n\n检查设备在虚拟机中是否被正确识别。\n\n\n\n\n### 4) 将以下内容添加到文件中并保存：\n\
  \n```bash\nblacklist nouveua options nouveau modeset=0 aliasnouveau off\n```\n\n\
  ### 5) 更新内核并重启系统，执行如下所示命令：\n\n```bash\nroot@exampleserver:～#update-initramfs -u\n\
  root@daxueba:～#reboot\n```\n\n注意：重启后，如果可以进入图形界面，你将发现分辨率已经发生了。如果无法进入图形界面，请按下快捷键 `Ctrl+Alt+F2`\
  \ 或 `Ctrl+Alt+F3` 进入文本界面，依次输入用户名和密码以进入文本模式。\n\n### 6) 检查 Nouveau 模块是否已禁用\n\n执行命令如下：\n\
  \n```bash\nroot@exampleserver:～#lsmod | grep -i nouveau\n```\n\n如果没有输出信息，则表示禁用成功。否则，表示禁用失败，你需要检查步骤\
  \ (4) 中的内容是否输入正确。\n\n### 7) 安装 Nvidia 驱动程序。命令如下：\n\n```bash\nroot@exampleserver:～#apt-get\
  \ install nvidia-driver nvidia-xconfig\n```\n\n### 8) 生成 xorg 配置文件并执行命令如下：\n\n```bash\n\
  root@exampleserver:～#nvidia-xconfig\n```\n\n### 9) 使用 VI 编辑器编辑 `/etc/X11/xorg.conf`\
  \ 文件并添加 Nvidia 显卡的总线号。\n\n示例代码如下：\n\n```text\nSection \"Device\" Identifier \"nvidia\"\
  \ Driver \"nvidia\" BusID \"PCI:1:0:0\" EndSection\n```\n\n注意：粗体内容格式需要手动添加。由于机器配置的不同，其他代码可能会有所不同。\n\
  \n### 10) 如果电脑拥有双显卡，使用 `vi` 命令分别创建两个 `/usr/share/gdm/greeter/autostart/optius.dekstop`\
  \ 和 `/etc/xdg/autostart/optimus.desktop` 并分别添加以下内容。\n\n### 11) 使用 `reboot` 命令重启\
  \ Kali Linux 系统。\n\n### 12) 检查显卡使用的驱动类型，并执行命令如下：\n\n```bash\nroot@exampleserver:～#lspci\
  \ -v\n```\n\n### 13) 查看显卡驱动模式，执行命令如下：\n\n```bash\nroot@exampleserver:～#nvidia-xconfig\
  \ --query-gpu-info\n```\n\n### 14) 安装 CUDA 工具并执行命令如下：\n\n```bash\nroot@exampleserver:～#apt-get\
  \ install ocl-icd-libopencl1 nvidia-cuda-toolkit\n```\n\n## 安装显卡厂商驱动\n\n用户不仅可以安装开源显卡驱动，还可以安装显卡厂商驱动。本节将介绍安装显卡厂商驱动的方法。以下将以\
  \ Nvidia 显卡为例介绍安装显卡厂商驱动的方法。具体步骤如下：\n\n### 1) 检查显卡型号并执行命令如下：\n\n```bash\nroot@exampleserver:～#\
  \ lspci 00:00.0 Host\n```\n\n从输出信息中，我们可以看到当前系统中的显卡型号为 GeForce GT 440。\n\n### 2)\
  \ 从 Nvidia 官方网站下载驱动包。其中下载地址为 `https://www.nvidia.com/download/index.aspx`。在浏览器中成功访问该\
  \ URL 后，将显示图 3.76 所示的对话框。\n\n### 3) 从对话框的“Product Type”（产品类型）下拉列表中选择产品类型，例如 GeForce；从“Product\
  \ Series”（产品系列）下拉列表中选择产品系列类型，例如 GeForce 400 Series；从“Product”（产品）下拉列表中选择显卡型号，例如\
  \ GeForce GT 440；在“Operation System”（操作系统）下拉列表中选择操作系统类型，首先选择“Show all Operating\
  \ Systems”（显示所有操作系统），然后选择“Linux 64-bit”；在“Language”（语言）下拉列表中选择语言类型，例如 German (Simplified)。\n\
  \n### 4) 点击 `SEARCH`搜索）按钮跳转到驱动下载页面。点击“Product Support List”（产品支持列表）选项卡查看支持的显卡芯片。确认无误后，点击“Download”（下载）按钮跳转到下载确认页面。点击此页面上的“Download”按钮开始下载驱动。\n\
  \n### 5) 安装编译驱动的依赖包，执行命令如下：\n\n```bash\nroot@exampleserver:～# apt-get install pkg-config\n\
  ```\n\n### 6) 运行下载的驱动并执行命令如下：\n\n```bash\nroot@exampleserver:～# chmod +x NVIDIA-Linux-x86_64-390.87.run\n\
  root@exapleserver:～# ./NVIDIA-Linux-x86_64-390.87.run\n```\n\n### 7) 运行后，会弹出错误消息警告\
  \ Nouveau 模块未被禁止。\n\n### 8) 按下 `Enter` 键，弹出生成 Nouveau 配置文件的对话框。\n\n### 9) 使用方向键切换到\
  \ Yes 按钮，然后按下 `Enter` 键，弹出文件生成提示对话框。\n\n### 10) 按 `Enter` 确认文件生成信息，将弹出安装失败对话框。\n\
  \n### 11) 按 `Enter` 退出安装界面。重启 Kali Linux 系统，再次运行安装文件，此时弹出 CC 版本检测对话框。\n\n### 12)\
  \ 使用方向键切换到 Ignore CC version check（忽略 CC 版本检查）按钮，然后按下 `Enter` 键，弹出确认 CC 版本检查的对话框。\n\
  \n### 13) 按 `Enter` 开始安装驱动。\n\n### 14) 安装完成后，将提示安装 32 位兼容性的对话框。\n\n### 15) 使用方向键切换到\
  \ No 按钮，然后按下 `Enter` 键开始安装库。\n\n### 16) 安装完成后，将弹出配置生成的对话框。\n\n### 17) 点击 OK 按钮，显卡安装完成，退出安装程序。\n\
