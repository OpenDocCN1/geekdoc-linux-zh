  \n# 第 9 章：网络基础\n\n![](img/image_rsrc49X.jpg)\n\n本章作为渗透测试人员在侦察阶段提升技能的先修知识。我们将讨论与网络相关的主题，帮助您从更宏观的来看待问题。请跟上节奏！\n\
  \n## 如何发现主机？\n\n主机发现用于检测哪些主机处于激活状态，然后获取有关可用主机的信息。用户可以使用主动扫描来发现主机，也可以使用被动监控来发现主机。本节将详细解释这两种方法，并提供详尽的操作说明。\n\
  \n### 确认网络范围\n\n在检测目标之前，通常需要明确目标可能的范围。该范围可能是一个特定的主机，可能是一个地址范围，有时甚至可能是一个整个子网。无论范围如何，它通常应该并且会遵循\
  \ IP 地址规则。根据 IP 规则，可以画出目标的可能范围。因此，渗透测试人员了解已设计的 IP 地址规则至关重要。\n\n#### 1. IP 地址规则\n\
  \nIP 地址（网协议地址）是一种互联网身份地址，用于识别设备、网络以及更广泛的网络。例如，您的手机有一个 IP 地址，而您的调制调器有一个独立且唯一的 IP\
  \ 地址。它是一个 32 位的二进制数，使用点表示法将其分为 4 个 8 位的二进制数，即 4 个字节。重要的是，IP 地址通常以“点分十进制表示法”以 `a.b.c.d`\
  \ 的形式表示。其中，`a`、`b`、`c` 和 `d` 都是 0 到 255 之间的十整数。例如，点分十进制 IP 地址 `192.168.12.143` 实际上是一个\
  \ 32 位的二进制数。\n\n练习：使用在线转换计算器找出上述 IP 数字的二进制表示。\n\nIP 地址由两部分组成，即网络地址和主机地址。网络地址表示它在互联网上属于哪个网络，主机地址表示它属于网络中的哪一个主机。如果你仔细观察，可以发现它们之间存在主从关系。根据不同的网络号和主机号，IP\
  \ 地址分为 A 类（`1.0.0.0～126.0.0.0`）、B 类（`128.1.0.0～191.255.0.0`）和 C 类（`192.0.1.0～223.255.255.0`）。此外，还有\
  \ D 类和 E 类特殊地址类。此外，全 0 和全 1 都被预留。\n\n每组 IP 地址的介绍如下：\n\n*   **A 类**：该组的地址范围为 `1.0.0.0-126.0.0.0`，子网掩码为\
  \ `255.0.0.0`。在此地址中，第一个字节是网络号，后 3 个字节是主机号。这种类型 IP 地址的前导是 `0`，因此显然地址范围的网络号从 1 到 126。\n\
  *   **B 类**：地址范围从 `128.1.0.0` 到 `191.255.0.0`，指定的子网掩码为 `255.255.0.0`。在此地址中，前两个字节是网络号，后两个字节是主机号。这种类型\
  \ IP 地址的前导是 `10`，因此地址范围的网络号从 128 到 191。\n*   **C 类**：地址范围从 `192.0.1.0` 到 `223.255.255.0`，子网掩码为\
  \ `255.255.255.0`。在此地址中，前 3 个字节是网络号，最后一个字节是主机号。这种类型 IP 地址的前导是 `110`，因此地址的网络号在 129\
  \ 到 223 之间。\n*   **D 类**：是一种组播地址。这种类型 IP 地址的前导是 `1110`，因此地址的网络号在 224 到 239 之间。通常用于组播用户。如果你不了解，组播地址是允许源设备向一组设备发送数据包的地址。属于组播组的设备被分配一个组播组\
  \ IP 地址，组播地址范围为 `224.0.0.0～239.255.255.255`。由于组播地址代表一组设备，它只能作为数据包的目标地址。源地址始终是单播地址。组播\
  \ MAC 地址以十六进制值 `01-00-5E` 开头，剩余 6 位十六进制数字是由 IP 组播地址的最后 23 位转换而来的。\n*   **E 类**：预留地址。这种类型\
  \ IP 地址的前导是 `1111`，因此地址的网络范围从 240 到 255。\n\n在 IP 地址中，还有一种特殊类型的 IP 地址，称为广播地址。广播地址是用于同时发送到网络中所有主机的地址。在\
  \ TCP/IP 协议中，主机位全为 1 的 IP 地址即广播地址。\n\nIP 地址主要根据子网掩码划分为段。为了方便输入，通常使用 CIDR 格式来指定整个子网。例如，`192.168.1.100/24`\
  \ 对应的子网掩码是 `255.255.255.0`，网络段为 `192.168.1.0-255`，即网络中有 256 个主机。\n\n如果用户不确定 IP 范围对应的子网掩码，可以使用\
  \ `Netmask` 工具来实现。\n\n#### 2. 确定网络拓扑\n\n用户可以根据路由记录确定范围。在渗透测试中，通过确定网络拓扑，可以判断目标是局域网还是外部网络。这样可以针对性地选择渗透工具，从而提高渗透效率。接下来的部分将介绍使用\
  \ `traceroute` 工具获取路由记录。\n\n使用该工具实现路由跟踪的语法格式如下：\n\n```\ntraceroute [Target]\n```\n\
  \n这里 `Target` 是我们尝试获取信息的主机地址。\n\n应用场景：\n\n使用 `traceroute` 工具追踪主机 `72.132.234.64`\
  \ 的路由以确定其网络拓扑。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# traceroute 72.132.234.64\n\
  ```\n\n注意：在虚拟机的 `NAT` 模式下，`traceroute` 的操作会出现问题。上级路由信息无法显示。\n\n# 第 10 章：扫描主机\n\n\
  ![](img/image_rsrc49X.jpg)\n\n在上一章中，我们学习了一些对于理解 `Nmap` 等工具至关重要的网络规则。网络本身是一个庞大的话题，但作为黑客，我们建议你通过学习各种网络原理和协议来很好地掌握这一主题。\n\
  \n\n用户可以通过主动扫描来确定目标主机是否活跃。主动扫描是通过发送探测请求数据包并等待目标主机的响应完成的。如果目标主机对请求做了响应，则意味着该主机是活跃的。否则，我们可以得出目标主机未在线的结论。\n\
  \n本节将介绍几种主动扫描主机的方法。\n\n### 1) 使用 Nmap 工具\n\n`Nmap` 是一个非常强大的网络扫描和嗅探工具包。该工具有三个基本功能。三个功能中的第一个是检测一组主机是否在线。第二个是扫描主机端口并嗅探所提供的网络服务，而第三个是推断主机正在使用的操作系统。\n\
  \n以下示例将介绍如何使用 `Nmap` 工具检测目标主机是否在线。\n\n`Nmap` 的语法格式如下：\n\n```\nnmap -sP [target]\n\
  ```\n\n上述语法中的选项 `-sP` 意味着对目标主机执行 Ping 扫描。参数 `[target]` 用于指定扫描的目标地址。这里的目标可以是主机名、IP\
  \ 地址（包括单个地址、多个地址或地址范围），有时甚至是网络网段。\n\n**使用场景：**\n\n检测目标主机 `72.132.234.64` 是否在线。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# nmap -sP 72.132.234.64\n```\n\n你也可以同时检查多个主机。下面我们为该场景提供了一个示例供你参考。\n\
  \n**使用场景**\n\n使用 `Nmap` 检测主机 `72.132.234.64`、`72.132.234.65` 和 `72.132.234.66` 是否在线。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# nmap -sP 72.132.234.64-66\n```\n\n这显示了关于这\
  \ 3 台服务器可用可用的输出。\n\n### 2) 使用 Netdiscover 工具\n\n`Netdiscover` 是一个 ARP 探测工具，支持主动模式和被动模式。你可以使用此工具扫描网络上的\
  \ IP 地址，并检查在线的主机。\n\n本节将介绍如何使用 `Netdiscover` 工具实现 ARP 主动扫描。\n\n语法格式如下：\n\n```\n\
  netdiscover -r [range]\n```\n\n上述语法中的选项 `-r [range]` 用于指定需要扫描的网络范围。如果用户未指定目标，则会自动选择目标网络进行扫描。\n\
  \n**使用场景：**\n\n使用 `Netdiscover` 工具扫描 `72.132.234.64/94` 网段中的在线主机。\n\n执行命令如下：\n\n\
  ```\nroot@exampleserver:netdiscover -r 72.132.234.64/94\n```\n\n通过分析捕获的数据包，你可以了解当前局域网中当前活跃主机的\
  \ IP 地址、MAC 地址和 MAC 地址厂商。你可以从 IP 列查看在线主机的地址。当扫描完成后，获得的所有信息都将显示出来。如果你敏锐观察，可以获得关于你试图攻击的主机的价值信息。在仔细研究输出后，按下\
  \ `Ctrl+C` 键组合退出 `Netdiscover` 工具的扫描界面。\n\n用户有时也可以不指定扫描范围，寻找尽可能多的在线主机。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# netdiscover\n```\n\n然而，我们建议你不要尝试这样做，因为这可能会导致大量不值得你花费时间去攻击的主机。在攻击主机网络之前，始终要做彻底的研究。否则，入侵检测系统将捕获你的响应并封禁你长时间。\n\
  \n# 监控发现主机\n\n嗅探（Snooping）意味着不主动向目标发送数据包，而只监控网络中的数据包。在局域网中，某些协议会自动广播数据包，例如 ARP 广播和\
  \ DHCP 广播。广播包是局域网内所有用户都可以接收的数据包。因此，用户可以通过监控这些包来检测网络上的活跃主机。本节将介绍通过监控发现主机。\n\n###\
  \ 1) ARP 监控\n\n`ARP`（地址解析协议）是一种根据 IP 地址获取物理地址的 TCP/IP 协议。当主机发送信息时，它向网络上的所有主机广播包含目标\
  \ IP 地址的 `ARP` 请求，并接收响应以确定目标的物理地址。因此，通过实现 `ARP` 监控，可以发现局域网内的活跃主机。\n\n本节将介绍使用 `Netdiscover`\
  \ 工具实现 `ARP` 监控的被动模式以发现在线主机。\n\n`Netdiscover` 工具被动扫描的语法格式如下：\n\n```\nnetdiscover\
  \ -p\n```\n\n上述语法中的选项 `-p` 意味着使用被动模式，也就是说不需要发送数据包，只允许嗅探。\n\n从第一行信息的输出中，你可以理解扫描正在被动模式下进行。从第二行信息中，你可以看到嗅探的数据包数量、主机数量和包大小。第\
  \ 3 行以下的信息将关于嗅探包的信息。你可以从 IP 列查看检测到的在线主机。许多其他任务可以使用此命令完成。我们建议你尝试这些命令以更好地理解该主题。\n\n\
  ### 2) DHCP 嗅探\n\n`DHCP`（动态主机配置协议）是一种局域网协议，其主要功能是让内部网络服务商能够自动分配 IP 地址。当客户端需要获取 IP\
  \ 地址时，它会发送广播包。然后，接收到请求的 DHCP 服务器将为其提供可用的 IP 地址。因此，用户可以通过 DHCP 嗅探来发现网络上的活跃主机。本节将介绍通过\
  \ `Nmap` 的 `broadcast-dhcp-discover` 脚本实现 DHCP 嗅探以发现在线主机。\n\n`Nmap` 的 `broadcast-dhcp-discover`\
  \ 脚本可以发送 DHCP Discovery 广播包，并有效显示响应包的特定信息。通过分析响应包中的信息，可以找到分配的 IP 地址。\n\n\n\n\n#\
  \ 基础域名信息\n\n当一个域名被注册时，它包含一些基础信息，例如域名是否已注册、域名注册商、域名所有者等。通过检查域名的 `WHOIS` 信息，你可以轻松地获取该域名的基础信息。下节节将介绍如何使用\
  \ `WHOIS` 和其他常用工具获取域名的基础信息。\n\n人们常说，域名分析是渗透测试人员在分析目标之前首要的常规工作。\n\n## 1) 使用 WHOIS\
  \ 工具\n\n`WHOIS` 工具用于查找并显示指定账户（或域名）的相关信息。\n\n使用该工具查询域名信息的语法格式如下：\n\n```\nwhois [domain\
  \ name]\n```\n\n使用场景：\n\n使用 `WHOIS` 工具查询域名 `wikipedia.com` 的相关信息。\n\n执行命令如下：\n\n\
  ```\nroot@exampleserver:～# whois wikipedia.com\n```\n\n在终端中输入上述命令后，你就可以看到与域名 `wikipedia.com`\
  \ 相关的 `WHOIS` 信息了。\n\n## 2) 使用 DMitry 工具\n\n`DMitry` 是一个集成的信息收集工具。渗透测试人员通常使用该工具来收集\
  \ `WHOIS` 主机 IP 和域名信息、子域名、域名中包含的电子邮件地址等。\n\n其中，使用该工具获取 `WHOIS` 信息的语法格式如下：\n\n```\n\
  dmitry -w [domain]\n```\n\n此处 `-w`：对指定的域名执行 `WHOIS` 查询。而 `domain` 是我们试图攻击并查找其信息的主机。\n\
  \n使用场景：\n\n使用 `DMitry` 工具查询域名 `wikipedia.com` 的 `WHOIS` 信息。\n\n执行命令如下：\n\n```\n\
  root@exampleserver:～# dmitry -w wikipedia.com\n```\n\n通过在 linux 终端中使用上述命令，将成功获取与域名\
  \ `wikipedia.com` 相关的 `WHOIS` 信息。\n\n# 查找子域名\n\n子域名也被渗透测试人员视为一个域名。在域名系统层次结构中，它通常属于一个更高级别的域名。例如，`www.wikipedia.com`\
  \ 和 `forum.wikipedia.com` 是 `wikipedia.com` 的两个子域名，需要理解的是 `forum.wikipedia.com`\
  \ 是顶级域名 `wikipedia.com` 的子域名。\n\n通常情况下，子域名名会包含主机名。例如，在 `www.wikipedia.com` 域名中，`.com`\
  \ 是顶级域名，`wikipedia.com` 是一级域名。`www` 是用于标识服务器的主机名。因此，由 `wikipedia.com` 建立的服务器是 `www.wikipedia.com`。众所周知的是，通过查找子域名，可以找到对应的主机。下文将通过详细示例描述查找子域名的方法。\n\
  \n## 1) 使用 Dmitry 工具\n\n可以使用 `Dmitry` 工具来查找子域名。然而，该工具使用 Google 搜索引擎来查找子域名。如果你访问的是被\
  \ Google 列入黑的网站，有时可能并不可靠。因此，请确保你的域名与 Google 搜索兼容。\n\n使用 `Dmitry` 工具查找子域名的语法格式如下：\n\
  \n```\ndmitry -s -o\n```\n\n上述语法中的选项及其含义如下：\n- `-S`：执行子域名查询。\n- `-O`: 指定保存输出结果的文件。\n\
  \n使用场景：\n\n使用 `Dmitry` 工具查找域名 `wikipedia.com` 的子域名。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ dmitry -s -o wikipedia.com\n```\n\n通过在 linux 终端中使用上述命令，将成功获取与域名 `wikipedia.com`\
  \ 相关的信息。\n\n## 2) 在线查询\n\n用户也可以通过在线查询来搜索子域名。其中，将显示域名。使用在线工具时，你可以找到一个域名的子域名。理解域名的属性是非常重要的。\n\
  \n\n\n\n\n## 使用 Nslookup 工具\n\n(1) 启动 `Nslookup` 工具进入交互模式。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ nslookup>\n```\n\n如果你看到命令行提示符显示为 `>`，说明你已经成功进入了 `Nslookup` 的交互模式。\n\n(2) 将查询类型设置为\
  \ `NS` 记录。\n\n执行命令如下：\n\n```\nset type=ns\n```\n\n(3) 输入要查询的域名名。\n\n执行命令如下：\n\n\
  ```\nwikipedia.com\n```\n\n输出结果可能如所示所示：\n```text\nServer: 192.123.8.1 Address: 192.342.43.2\
  \ #53 Non-authoritative answer:\nName:www.wikipedia.com Address: 54.123.131.876\n\
  = ns7.wikipedia.com .\nwikipedia.comnameserver = ns2.wikipedia.com.\n```\n\n如果用户不需要查询其他记录，可以使用\
  \ `exit` 命令退出交互模式，如下：\n\n```\nexit root@exampleserver:～#\n```\n\n## 使用 Ping 命令\n\
  \n`Ping` 命令可用于检查网络是否连接。这通常有助于用户分析和判断网络故障。对于域名，你通常可以指定多个 IP 地址。因此，当用户使用某些工具查询域名信息时，会获取多个地址信息。此时，用户无法确定目标服务器使用的是哪一个地址。用户可以使用\
  \ `Ping` 命令确定当前正在使用的 IP 地址，然后确定目标主机。\n\n`Ping` 命令的语法格式如下：\n\n```\nping -c [count][target]\n\
  ```\n\n在上述语法中，选项 `-c` 用于指定要发送的 `Ping` 数据包数量，参数 `[target]` 用于指定目标主机的地址，其中目标主机地址可以是主机名、IP\
  \ 地址或域名。在 Windows 系统中，`Ping` 命令只会发送并响应 4 个数据包后停止 `Ping`。在 Linux 系统中，`Ping` 命令默认会一直执行，用户需要按下\
  \ `Ctrl+C` 组合键来停止 `Ping`。\n\n#### 用场景示例：\n\n使用 `Ping` 命令检测域名 `www.wikipedia.com`\
  \ 的 IP 地址，并指定只发送 4 个检测数据包。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# ping -c 4 www.wikipedia.com\n\
  ```\n\n输入上述命令后，我们可以看到成功接收了目标主机的响应包。从响应包信息中可以看到目标所颁发的 IP 地址。\n\n## 接下来做什么？\n\n在深入理解了域名和服务器分析后，你现在已经足够进入端口分析的重要性领域了。`Nmap`\
  \ 是一个著名的信息收集工具，它的流行主要归功于其卓越的端口分析方法。跟随下文了解更多如何使用 `Nmap` 实现端口分析。\n\n# 第 13 章：扫描端口\n\
  \n![](img/image_rsrc49X.jpg)\n\n通过扫描端口，你可以发现运行在目标主机上的程序。之后，我们可以收集这些程序的信息以获取漏洞信息，并成功实施渗透测试。本节将介绍端口的概念以及实现端口扫描的方法。\n\
  \n## 端口简介\n\n在计算机中，端口被认为是一个核心概念。在网络技术中，端口有多种含义。这里指的端口不是物理端口，而是 TCP/IP 协议中的端口。它是逻辑意义上的端口。在\
  \ TCP/IP 协议中，最常用的协议是 `TCP` 和 `UDP`。由于 `TCP` 和 `UDP` 两个协议是独立的，它们各自的端口号也是相互独立的。例如，`TCP`\
  \ 有端口 235，`UDP` 也可以有端口 235，两者通常不会冲突。\n\n端口的功能和常用端口描述如下：\n\n### 1) 端口的作用\n\n用户知道主机对应一个\
  \ IP 地址并可以提供多种服务，例如 Web 服务和 FTP 服务。如果只有一个 IP，则无法区分不同的网络服务，因此使用 `IP+端口号` 来区分不同的服务。\n\
  \n### 2) 端口的定义\n\n端口号用于识别主机中的唯一进程，而 `IP+端口号` 则可以识别网络中的唯一进程。在网络开发中的 Socket 编程中，`IP\
  \ + 端口号` 就是 socket。端口号由 16 位二进制数计数，范围在 0～65535 之间。\n\n然而，这些端口不能随意使用，某些端口可能已经被占用。例如，Web\
  \ 服务器的端口是 80，FTP 服务的端口是 21 等。因此，对端口进行了分类，并为渗透测试人员严格规定了用户可以使用的端口范围。始终对目标所拥有的端口有良好的了解。\n\
  \n### 3) 端口分类\n\n端口有许多分类方法。通常根据它们是由服务器使用还是客户端使用来进行分类。\n\n服务器使用的端口号可以分为预留端口号和注册端口号，如下：\n\
  \n*   **预留端口号**：\n    此类端口的数值范围是 0～1023。这些端口在用户编程期间不能使用，而是由某些程序使用。只有具有超级用户权限的应用才被允许使用预留端口。例如，WWW\
  \ 服务的端口是 80，FTP 服务的端口是 21。用户也可以为这些服务指定预留端口。例如，端口 139 专门用于 NetBIOS 和 TCP/IP 之间的通信且无法手动更改。\n\
  \n*   **注册端口号**：\n    该类型端口的范围是 1024～49151，是用户编写服务器使用的端口。当这些端口未被服务器资源占用时，客户端也可以动态选择。客户端使用的端口也称为临时端口，其范围是\
  \ 49152～65535。\n\n\n\n\n由于数据包过滤阻止了探测包到达端口，`nmap` 无法确定该端口是否开放。过滤可能来自专业的防火墙设备、路由器规则或主机上的软件防火墙。有时它们会对\
  \ ICMP 错误消息做出响应，例如类型 3 状态码（目标不可达），但通常情况下，`nmap` 会重试几次，以检测探测包是否由于网络拥塞而被丢弃。这将导致扫描速度显著缓慢。\n\
  \n### 未过滤 (Unfiltered)\n未过滤状态意味着端口是可以访问的，但 `nmap` 无法确定其是开放还是关闭。用户仅通过 `ACK` 扫描可以将端口归类为此此状态。使用其他类型的扫描（如窗口扫描、`SYN`\
  \ 扫描）可以帮助确定端口是否开放。\n\n### 开放/未过滤 (Open/filtered)\n当无法确定端口是否开放时，`nmap` 将端口归入此类状态。这通常发生在开放的端口没有响应的情况下。没有响应也意味着过滤器丢弃了探测消息以及由此引起的任何响应。因此，`nmap`\
  \ 无法确定端口是开放还是被过滤。`UDP` 协议、`FIN`、`Null` 和 `Xmas` 扫描可能属于此类类。\n\n### 关闭/未过滤 (Closed/filtered)\n\
  当 `nmap` 无法确定端口是关闭还是被过滤时，使用此状态。它只会出现在 `Idle` 扫描中。\n\n## 端口扫描\n使用 `nmap` 进行端口扫描的语法格式如下：\n\
  \n```\nnmap -p [target]\n```\n\n在上述语法中，`-p` 选项用于指定要扫描的端口。指定的端口可以是单个端口、多个端口或端口范围。在指定多个端口时，用逗号分隔端口。默认情况下，`nmap`\
  \ 扫描的端口范围是 1 到 1000。\n\n#### 用场景场景\n对目标主机 `192.243.176.84` 执行端口扫描。\n\n执行命令如下：\n\n\
  ```\nroot@exampleserver:~# nmap 192.243.176.84\n```\n\n当在终端输入此命令时，`nmap` 工具默认扫描\
  \ 1000 个端口。它将在输出中显示开放的端口。\n\n#### 用场景场景\n指定端口范围为 1 到 50，并对目标主机执行端口扫描。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:~# nmap -p 1-50 192.243.176.84\n```\n\n从输入上述终端后的输出结果中，我们可以看到扫描了\
  \ 1 到 50 的端口。所有开放的端口都将显示。\n\n#### 用场景场景\n指定目标主机的 21 和 23 端口。\n\n执行命令如下：\n\n```\n\
  root@exampleserver:~# nmap -p 21,23 192.243.176.84\n```\n\n这提供了关于命令请求的两个部分的详细信息。通过使用这些技术，你可以尽可能地缩短通常扫描端口所需。\n\
  \n## 使用 Dmitri 工具\n`nmap` 工具提供了 `-p` 选项来实现端口扫描。实现端口扫描的语法格式如下：\n\n```\nnmap -p [host]\n\
  ```\n\n这里，`host` 是我们尝试扫描端口的目标的 IP 地址。\n\n#### 用场景场景\n使用 `dmitry` 扫描目标主机 `192.243.176.84`\
  \ 开放端口。\n\n执行命令如下：\n\n```\nroot@exampleserver:~# dmitry -p 192.243.176.84\n```\n\
  \n从输出信息中，你可以看到目标主机上所有开放的端口。从输出的倒数第二行，你可以看到扫描的端口数量和关闭的端口数量。\n\n## 接下来\n许多重要端口仍然难以实现。如今管理员正在使用入侵检测系统，完全依赖它们并不是良好的做法。此外，通过端口我们可能无法找到构建利用程序所需的额外信息。如果我们可以发现目标正在使用的操作系统，将会有很大帮助。请继续阅读下一章了解更多关于操作系统检测的内容。\n\
  \n# 第 14 章 识别操作系统\n\n![](img/image_rsrc49X.jpg)\n\n通过识别操作系统，可以确定目标主机的系统类型。通过这种方式，渗透人员可以以策略性的对目标系统的程序进行漏洞检测，以节省不必要的时间。本节将介绍识别操作系统的方法并附带大量示例。\n\
  \n### 基于 TTL 的识别\n`TTL`（存存时间）字段指定了 IP 数据包在被路由器丢弃之前允许通过的最大网络段数。不同的操作系统类型产生不同的 `TTL`\
  \ 值响应。因此，用户可以使用 `Ping` 命令进行系统识别。为了让用户能够快速确定目标系统的类型，有必要每种操作系统的初始 `TTL` 值列表。你可以通过快速\
  \ Google 搜索轻松找到它们。\n\n#### 用场景场景\n使用 `Ping` 测试目标主机 `192.243.176.84` 的操作系统类型。目标主机的操作系统类型是\
  \ Kali Linux。让我们看看该命令是否可以检测它。\n\n执行命令如下：\n\n```\nroot@exampleserver:~# ping -c 1\
  \ 192.243.176.84\n```\n\n从输出信息可以看出，响应包中的 `TTL` 值为 64。可以推断该主机是 Linux 操作系统。你可以在自己的操作系统上尝试此命令以找出它的值。\n\
  \n#### 用场景场景\n使用 `Ping` 测试目标主机 `192.243.176.84` 的操作系统类型。目标主机的操作系统类型是 Windows 7。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:~# ping -c 1 192.243.176.84\n```\n\n从输出信息可以看出，响应包中的\
  \ `TTL` 值为 128。可以解释为这是一个 Windows 操作系统。\n\n**提示：** 如果从本地主机到目标之间的路由器过多，判断结果可能不准确。\n\
  \n### 使用 NMAP 识别\n由于 `TTL` 仅是模糊判断，获得的结果可能不准确。`NMAP` 工具提供了检测操作系统的功能。下一节将介绍如何使用 `NMAP`\
  \ 识别操作系统类型。\n\n使用 `NMAP` 识别操作系统的语法格式如下：\n\n```\nnmap -O [target]\n```\n\n这里，`target`\
  \ 是我们在渗透测试中尝试攻击的主机地址。\n\n#### 用场景场景\n使用 `NMAP` 检测目标主机 `192.243.176.84` 的操作系统类型。\n\
  \n\n\n\n\n使用 `Nmap` 识别服务版本的语法格式如下：\n\n```\nnmap -sV [host]\n```\n\n上述语法中的选项 `-sV`\
  \ 意味着实现服务版本检测。\n\n### 使用场景：\n识别目标主机 `192.243.176.84` 上所有开放的服务及其版本。\n\n执行命令如下：\n\n\
  ```\nroot@exampleserver:～# nmap -sV 192.243.176.84\n```\n\n可以从输出信息中看到识别出的服务相关信息。输出信息包含\
  \ 4 列，分别为 `PORT`（端口）、`STATE`（状态）、`SERVICE`（服务）和 `VERSION`（版本）。通过分析每一列信息，你可以获取有关对应服务的相关信息。例如，`TCP`\
  \ 端口 21 对应的服务是 `FTP`，版本为 `FileZilla ftpd`。你还可以从倒数第二行看到目标主机的主机名为 `TEST-PC`，操作系统类型为\
  \ `Windows`。\n\n## 使用 Amap 工具\n\nAmap 是一组用于识别网络服务的渗透测试工具，包括 `amap` 和 `amapcrap`\
  \ 两个工具。其中，`amap` 工具用于尝试识别在非常规端口运行应用程序，而 `amapcrap` 工具通过发送触发包并在响应字符串列表中查找响应，基于非 ASCII\
  \ 编码来识别应用程序。\n\n本节将介绍如何使用 Amap 工具识别服务信息。\n\n### 1) 使用 amapcrap 工具\n\n`amapcrap`\
  \ 工具可以向 `UDP`、`TCP` 或 `SSL` 端口发送随机数据以获取非法响应信息。获取到的信息将写入 `appdefs.trig` 和 `appdefs.resp`\
  \ 文件中，方便 Amap 检测的下一步。\n\n使用该工具识别服务信息的语法格式如下：\n\n```\namapcrap -n -m <0ab> [host][port]\
  \ -v\n```\n\n这里 `-V` 代表详细模式（verbose mode）。\n\n### 使用场景：\n使用 `amapcrap` 工具探测 90 端口的应用程序。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v\n\
  ```\n\n从显示的结果中，我们可以了解到获取的信息被写入了 `appdefs.trig` 和 `appdefs.resp` 触发文件中。当用户使用 Amap\
  \ 工具识别服务时，这两个文件将用于用于获取信息。\n\n### 2) 使用 amap 工具\n\n`amap` 工具可以尝试识别在异常端口运行的一些应用程序。\n\
  \n使用该工具识别服务信息的语法格式如下：\n\n```\namap -bqv [host][port]\n```\n\n### 使用场景：\n使用 `amap`\
  \ 工具扫描目标主机 `192.243.176.84` 上的 80 端口服务。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ amap -bqv 192.243.176.84 80\n```\n\n从输出信息中，你可以了解到匹配 80 端口的服务是 `http` 或 `http-apache2\\\
  .`。从显示的识别信息可以看出，运行在目标主机上的 Web 服务是 `Apache`，版本为 `2.2.8\\.`。在输出的前 3 行中，你可以看到 `amap`\
  \ 工具使用了两个触发文件和一个响应文件。其中，文件名分别为 `appdefs.trig`、`appdefs.resp` 和 `appdefs.rpc`。\n\n\
  # 收集服务信息\n\n某些特殊服务可以提供额外信息。例如，`SMB` 服务可以提供文件系统结构，而 `SNMP` 服务可以提供目标主机相关信息。本节将解释如何使用这些服务为你的目标渗透测试信息收集收集有价值的信息。\n\
  \n### SMB 服务\n\n`SMB`（Server Message Block）是一种用于在计算机之间共享文件、打印机、串口等的 IBM 协议。`SMB`\
  \ 协议可以运行在 `TCP/IP` 之上，也可以运行在其他网络协议（如 `NetBEUI`）之上。通过获取 `SMB` 服务的共享文件夹信息，你可以了解目标主机的文件系统结构。本节将介绍使用\
  \ `smbclient` 工具访问 `SMB` 服务的共享文件夹信息。\n\n`smbclient` 是 `SMB` 服务的客户端工具，可访问 `SMB` 服务中的共享文件。\n\
  \n`smbclient` 工具的语法格式如下：\n\n```\nroot@exampleserver : smbclient -L -U <username></username>\n\
  ```\n\n上述语法中的选项和含义如下：\n`-L`: 用于指定 `SMB` 服务器地址。\n`-U`: 用于指定登录 `SMB` 服务的用户名。\n\n###\
  \ 使用场景：\n在 Linux 系统中访问 `SMB` 服务。\n\n执行命令如下：\n\n```\nsmbclient -L 192.243.176.84\
  \ -U root Enter WORKGROUP\\root's password:\n```\n\n输入 `SMB` 服务用户的登录密码将显示需要大量分析的信息。\n\
  \n从输出信息中，你可以看到共享的文件。从输出信息中，你可以看到共享的文件。`Share` 代表共享名称，`Type` 代表类型，`Comment` 是描述。目标操作系统是\
  \ `Linux`。如果目标操作系统是 `Windows`，将显示驱动器号。\n\n```\nroot@exampleserver:# smbclient -L\
  \ 192.243.176.84 -U\n```\n\n可以看到共享磁盘。\n\n### SNMP 服务\n\n`SNMP`（简单网络管理协议）由一组网络管理标准组成，包括应用层协议和资源对象。该协议用于网络管理系统监控网络设备的状态。通过使用该服务可以获取主机信息。本节将介绍如何使用\
  \ `snmpcheck` 工具获取主机信息。\n\n`snmpcheck` 工具可以用于枚举 `SNMP` 设备以获取信息。\n\n该工具的语法格式如下：\n\
  \n```\nsnmpcheck [target]\n```\n\n### 使用场景：\n使用 `snmpcheck` 工具通过 `SNMP` 协议获取 `192.243.176.84`\
  \ 主机信息。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# snmpcheck 192.243.176.84\n```\n\
  \n连接成功后，可以获取主机的系统信息。\n\n由于上述命令带有大量的输出信息，理解每个部分都很重要。\n\n1. 我们可以获取系统信息，如主机名、操作系统类型和架构。\n\
  2. 我们可以获取账户信息。\n3. 获取网络信息，如 `TTL` 值、`TCP` 段和数据元素。\n4. 获取网络接口信息，如接口状态、速度、`IP` 地址和子网掩码。\n\
  5. 获取网络 `IP` 信息。\n6. 获取路由信息，如目的地址、下一跳地址、子网掩码和路径长度。\n7. 获取监控的 `TCP` 端口。\n8. 获取监控的\
  \ `UDP` 端口信息。例如，监控的 `UDP` 端口可以是 `123`、`154`、`6300`、`300` 和 `5322`。\n9. 我们可以获取网络服务信息，如分布式组件模型服务、`DHCP`\
  \ 客户端和 `DNS` 客户端。\n10. 我们可以获取进程信息，如进程 ID、进程名和进程类型。\n11. 获取存储信息，如设备 ID、设备类型和文件系统类型。\n\
  12. 获取文件系统信息，如索引、挂载点、远程挂载点和访问权限。\n13. 获取设备信息，如设备 ID 号、类型和状态。\n14. 获取软件组件信息，如 `.Net`\
  \ 框架、`Visual C++2008` 等。\n\n\n\n\n至此，我们已经完成了渗透测试过程中信息收集阶段的一个重要部分。获取所有这些数据后，我们需要对它们进行分析，以获取或创建一个可行的工作流。为了让这一过程对您变得简单，我们将详细介绍\
  \ Maltego 工具的使用方法。请跟随我们操作！\n\n# 第 16 章：信息分析与排序\n\n![](img/image_rsrc49X.jpg)\n\n\
  通过使用上述方法，可以收集大量关于目标主机的信息。为了方便后续渗透测试的实施，用户需要对这些信息进行排序和分析。此时，用户可以借助 `Maltego` 工具对信息进行分析和组织。本节将介绍如何使用\
  \ `Maltego` 工具来分析和组织信息。\n\n## 配置 Maltego\n\nMaltego 是一个强大的信息收集工具。它不仅可以自动收集所需信息，还能对收集到的信息进行可视化，并以图形方式向用户展示结果。Kali\
  \ Linux 默认安装了 Maltego 工具，因此用户可以直接使用。然而，在使用工具之前，你需要进行简单的配置，例如注册账户和选择启动模式。下节将介绍 Maltego\
  \ 工具的配置。\n\n### 1) 注册账户\n\n当用户使用 Maltego 工具时，需要登录其官方网站。因此，在启动工具之前你需要注册一个账户。\n\n\
  注册账户的地址如下：\n\nhttps://www.paterva.com/web7/community/community.php\n\n当用户在浏览器中成功访问上述地址后，将显示带有字段框的对话框。\n\
  \n在此对话框中填写正确信息，并勾选“执行人机认证”复选框。会弹出图片验证对话框。在对话框中，根据提示选择相应的图片，然后点击“Verify”按钮。验证成功后，将显示注册所需的对话框。\n\
  \n此时，点击 `Register!` 按钮完成注册。此时，你将从用于注册账户的邮箱中收到一封邮件。登录你的邮箱以激活账户。\n\n### 2) 设置 Maltego\
  \ 模式\n\nMaltego 提供两种模式，即普通隐私模式（Normal Privacy Mode）和隐身隐私模式（Stealth Privacy Mode）。其中，普通隐私模式可以获取更多信息。此外，允许用户直接使用互联网数据，例如物理图片和网站信息。隐身隐私模式更多用于简单的信息分析，特别是当当前计算机没有网络时。使用此模式将无法直接从互联网获取数据。因此，为了获取更多信息，建议选择普通隐私模式。下节将介绍设置\
  \ Maltego 模式的具体方法。\n\n**用例场景：**\n\n将 Maltego 模式设置为普通隐私模式。具体步骤如下：\n\n1) 在图形界面的菜单栏中，选择“Applications”|“Information\
  \ Collection”|`maltego command`。此时将显示 Maltego 产品选择对话框。\n\n2) 对话框中显示可选 Maltego 产品，包括\
  \ `Maltego XL`、`Maltego Classic`、`Maltego CE (Free)` 和 `Maltego CaseFile (Free)`。其中，`Maltego\
  \ XL` 和 `Maltego Classic` 收费，而 `Maltego CE` 和 `Maltego CaseFile` 是免费的。在这里选择免费的 Maltego\
  \ 工具并点击 `run` 按钮。\n\n3) 此对话框显示许可协议信息。勾选 `Accept` 复选框，然后点击 `Next` 按钮。将显示登录对话框。\n\n\
  4) 在对话框中输入之前注册的账户信息（邮箱地址、密码和验证码）登录 Maltego 服务器。然后点击 `Next` 按钮。将出现对话框。\n\n5) 此对话框显示登录结果。从该对话框中你可以看到登录用户名、邮箱地址和登录时间。然后点击\
  \ `Next` 按钮，将显示安装 Transforms 的对话框。\n\n6) 此对话框显示要安装的应用服务、Transforms、实体（entities）和主机（hosts）信息。点击\
  \ `Next` 按钮显示另一个对话框。\n\n7) 在对话框中，你可以设置是否启用自动错误报告功能。如果你想启用，勾选 `Automatically send\
  \ Error Reports` 复选框。如果你不想启用，直接点击 `Next` 按钮。点击 `Next` 后，将显示隐私模式选择对话框。\n\n8) 在对话框中选择\
  \ `Normal mode`，然后点击 `Next` 按钮。\n\n9) 你可以从这一步看到 Maltego 已准备就绪。此时，用户可以使用 Maltego\
  \ 工具收集信息。这里默认提供 3 种方法，即打开空白图让我玩玩（Open a blank graph and let me play around）、打开示例图（Open\
  \ an example graph）以及离开，我以前做过了！（Go away, I have done this before!）。在这里选择第一种运行方法\
  \ `Open a blank graph and let me play around`，这将打开界面。\n\n10) 看到此界面意味着 Maltego 已成功启动并打开了一个新图表。接下来，用户可以选择任何实体并将其拖到图表中以分析和组织收集到的信息。\n\
  \n## 使用 Maltego 工具\n\n通过之前的配置，Maltego 工具可以正常使用了。用户可以使用 Maltego 工具来组织和分析之前收集的信息。此外，你还可以使用\
  \ Maltego 的 Transforms 获取更多信息。Maltego 提供了大量的实体来表示信息节点。例如，域名信息可以使用 `Domain` 实体来表示。下节将介绍使用\
  \ Maltego 工具组织和分析信息的方法。\n\n### 组织并分析主机信息\n\n通过之前的信息收集，我们可以了解局域网内的活动主机。开放端口、服务和操作系统是主机的一些类型。\n\
  \n下节将介绍使用 IP 地址实体来分析主机信息。\n\n**用例场景：**\n\n使用 Maltego 工具组织和分析主机信息。具体步骤如下：\n\n1) 启动\
  \ Maltego 工具，将显示界面。\n\n2) 界面左侧列显示所有可用实体。在这里选择 IP 地址实体来整理收集的相关信息。选择 `IPv4 Address`\
  \ 实体并将其拖到图表中，将显示界面。\n\n3) 从此界面中，你可以看到图表中添加了一个 IP 地址实体，该实体的默认 IP 地址为 `192.243.176.84`。此时，用户可以将地址修改为检测到的活动主机地址，例如\
  \ `192.168.29.136`。用户可以通过双击实体的 IP 地址或修改属性 `IP Address` 值来修改实体地址。\n\n4) 从此界面可以看出\
  \ IP 地址实体的值已成功修改。此时，用户以相同的方式将 `Port` 和 `Service` 实体拖放到图表中，以整理主机的相关信息。\n\n5) 从此界面中，你可以看到添加的端口和服务实体。其中，端口的默认属性值为\
  \ `0`。服务的默认属性值为 `80/Apache 9`。用户可以根据收集的信息修改实体属性值。\n\n\n\n6) 此时，已对收集的信息进行了整理。为了方便分析和更直观地查看，用户可以通过连接线关联它们之间的关系。例如，在此处使用电缆连接主机\
  \ IP 地址和端口。点击 IP 地址实体（`192.243.176.84`）附近，将引出一条线，然后点击端口实体。此时，会弹出一个对话框。\n\n7) 此对话框中的信息用于设置连接线，如\
  \ `Label`（标签）、`Color`（颜色）、`Style`（样式）和 `Thickness`（粗细）。在这里将线条标签设置为 `port`，颜色设置为\
  \ `red`（红色），其他选项可以使用默认值。\n\n8) 点击 `OK` 按钮，即可看到添加的连接线。\n\n9) 从此界面可以看出，IP 地址实体与端口实体之间的关系已成功建立。使用相同的方法，用户可以使用连接线连接其他实体之间的关系，并用标签标记实体信息。\n\
  \n10) 从此界面可以更直观地查看收集的信息，使用起来更加方便。此时，用户还可以使用 `Maltego` 提供的 `Transforms` 来收集更多信息，例如\
  \ IP 所有者信息、网络信息和历史信息。\n\n### 组织和分析域名信息\n\n通过分析之前收集的信息，我们可以获知收集的域名 WHOIS 信息、子域名和服务器信息。接下来的部分将使用\
  \ `Domain` 实体对域名信息进行组织和分析。\n\n使用 `Maltego` 工具组织和分析域名信息。\n\n具体步骤如下：\n\n1) 在 `Maltego`\
  \ 中打开一个新图表以避免与之前的信息混淆。点击新图表按钮。\n\n2) 从此界面可以看到打开了一个新图表，其名称为 `New Graph(2)`。在这里选择\
  \ `domain` 实体（`Domain`）来组织和分析域名信息。在实体面板中选择 `Domain` 实体并拖到图表中，然后将实体域名修改为 `wikipedia.com`。\n\
  \n3) 通过分析上述收集的信息，我们可以获得域名的 WHOIS 信息、子域名和服务器信息。例如，这里是域名 `wikipedia.com` 的子域名。其中表示子域名的实体是\
  \ `DNS Name`。因此，在实体列表中选择 `DNS Name` 实体并拖到图表中，然后将实体名称修改为相应的子域名。\n\n4) 从此界面可以看到组织好的子域名信息。同样，用户可以使用电缆将它们连接。\n\
  \n5) 从此界面可以看到收集的域名已组织好。此外，可以直观地看到域名 `wikipedia.com` 对应的所有子域名。此时，用户使用 `Maltego` 的\
  \ `Transform` 也可以收集更多关于域名和子名的信息，例如域名注册商、子域名和 WHOIS 信息。\n\n### 使用 Transform 收集信息\n\
  \n`Maltego` 提供了大量的 `Transforms`，可用于收集更多信息。以下以域名实体为例获取更多信息的方法。\n\n使用 `Transform`\
  \ 收集域名 `wikipedia.com` 的信息。\n\n具体步骤如下：\n\n1) 选择 `Domain` 实体并将其拖到新图表中，并将域名修改为 `wikipedia.com`。\n\
  \n2) 选择域名实体并右键点击，将显示所有可用的 `Transforms` 列表。\n\n3) 从此界面可以看到可用于域名实体的 `Transform` 集合，如\
  \ `Shodan`、`ThreatMiner` 和 `Farsight DNSDB`。如果用户想查看所有 `Transforms`，点击 `All Transforms`\
  \ 选项查看全部变换。如果你想查看特定的 `Transform` 集合，点击相应的 `Transform`。在此点击 `All Transforms` 选项展开所有\
  \ `Transforms` 列表。\n\n4) 此时，用户可以选择任何 `Transform` 来获取相应的信息。例如，使用 `To Domain[Find\
  \ other TLDs]` `Transform` 来查找域名的其他顶级域名。\n\n至此，我们完成了对 `Maltego` 及其创新高效的信息分析能力的简要介绍。第二模块随本章一同结束。在本书的下一个模块中，我们将通过学习漏洞扫描和嗅探攻击来增强我们的黑客技能。我们建议在跳转到第三模块之前，彻底掌握前两个模块。\n\
  \n祝一切顺利，第三模块等待你的加入！\n\n![](img/image_rsrc49W.jpg)\n\n# 漏洞扫描与数据嗅探\n\n## 学习使用 Nessus、OPENVAS\
  \ 扫描漏洞以及使用 Wireshark 嗅探数据\n\n![](img/image_rsrc49Y.jpg)\n\n## 简介\n\n本黑客丛书籍的下一个模块关于漏洞扫描。每个系统都可能存在漏洞。如果黑客能够找到应用程序的漏洞或后门，就可以将其用于恶意目的，如数据或货币窃取。作为一名伦理黑客和负责任的渗透测试员，你处于正确的一。显而易见，漏洞扫描是黑客流程中的关键阶段。\n\
  \n为了让初学者意识到漏洞扫描的重要性，我们设计了这本书向你介绍两个重要的漏洞扫描软件。祝你发现漏洞的过程愉快。\n\n### 免责声明：\n\n本书仅供参考。书的作者对读者的非法意图不承担任何责任。\n\
  \n# 第 17 章\n\n## 理解漏洞\n\n![](img/image_rsrc49Y.jpg)\n\n你可能经常听到“漏洞”这个词。2018 年，当勒索软件攻击发生时，搜索“漏洞”一词的人数剧增。尽管它是开发者和技术爱好者之间的流行词，但仍有\
  \ 80%每天使用技术的人并不了解漏洞及其影响。作为一名黑客，理解漏洞的重要性是你的首要任务。本章将为你详细介绍漏洞。请看下去！\n\n# 什么是漏洞？\n\n\
  \n\n\n\n本节将介绍常见的漏洞类型，并提供相关示例以丰富你的知识。\n\n# 人为的配置不当\n\n在实际应用中，系统或软件需要用户执行各种配置以满足特定需求。如果人工配置不当，就会导致漏洞。最常见的漏洞类型包括弱密码和权限设置错误。\n\
  \n### a) 弱密码\n\n密码是身份验证的一种重要方法，弱密码通常指的是各种简单密码和初始密码。这类简单密码很容易被暴力破解密码工具检测到。\n\n趣知识：\n\
  \n几乎 60% 的互联网用户使用可以被破解工具轻易进行暴力破解的简单密码。这就是为什么，总是建议使用一个不容易被猜到的密码。\n\n例如，在 `MySQL`\
  \ 数据库服务中，如果该服务的管理员用户 `root` 被配置了弱密码（如 `toor`），则可以使用暴力字典攻击轻易破破它。通过使用不同的字典攻击技术，渗透测试人员可以以管理员身份登录\
  \ `MySQL` 数据库服务，然后查看所有数据条目。一些重要或敏感的数据可能会被渗透测试人员窃取。根据最近的一项调查，仍有数千个数据库在使用弱密码。\n\n\
  Kali Linux 提供了一个名为 `changeme` 的工具，用于扫描目标主机的默认身份认证。例如，它可以自动检查特定服务器是否为匿名用户启用了 `FTP`\
  \ 服务。如果确实允许，该工具将自动使用默认密码登录 `FTP` 服务器。\n\n此时，用户可以使用该工具进行扫描，以检测目标主机是否使用了默认密码。如果确实使用了默认密码，意味着该主机肯定存在弱密码漏洞，渗透测试人员可以利用此漏洞进行攻击。\n\
  \n`changeme` 工具的语法格式如下：\n\n```\nchangeme -a <target>\n```\n\n上述语法中的选项 `-a` 意味着扫描所有协议。`target`\
  \ 被定义为我们尝试扫描的系统地址。\n\n一个简单的用例：\n\n使用 `changeme` 工具扫描，以了解目标是否使用了弱密码。\n\n执行命令如下：\n\
  \n```\nroot@exampleserver:～# changeme -a 192.234\n```\n\n执行上述命令后，`changeme` 会扫描目标主机是否使用了默认密码。如果确实使用了默认密码，意味着该主机肯定存在弱密码漏洞，渗透测试人员可以利用此漏洞进行攻击。\n\
  \n```\nroot@exampleserver:～# changeme -a 192.234\n```\n\n如果输出结果显示 `root` 密码为 `changeme`，则确认该主机存在弱密码漏洞。\n\
  \n### b) 权限设置错误\n\n在实际应用中，系统或软件需要用户执行各种配置以满足特定需求。如果人工配置不当，就会导致漏洞。最常见的漏洞类型包括弱密码和权限设置错误。\n\
  \n权限设置是确保只有授权用户才能访问特定资源的重要机制。如果权限设置不当，可能会导致安全隐患。\n\n# 软件漏洞\n\n在实际应用中，系统或软件需要用户执行各种配置以满足特定需求。如果人工配置不当，就会导致漏洞。最常见的漏洞类型包括弱密码和权限设置错误。\n\
  \n软件漏洞通常由于开发人员的疏忽而产生。在开发软件时，经常需要修复漏洞。例如，`Nessus` 软件中的某些漏洞漏洞是渗透测试人员经常利用的。\n\n以下是一些已知的软件漏洞：\n\
  \n-   **远程代码漏洞**\n-   **基于 Struts 插件的远程代码执行漏洞**\n-   **CVE-2017-5638 漏洞**\n\n在实际应用中，系统或软件需要用户执行各种配置以满足特定需求。如果人工配置不当，就会导致漏洞。最常见的漏洞类型包括弱密码和权限设置错误。\n\
  \n# 硬件漏洞\n\n硬件漏洞通常存在硬件设备或芯片中。例如，`Meltdown` 和 `Spectre` 漏洞直接存在于 CPU 内部，由于这些漏洞，系统需要相应的补丁来修复。\n\
  \n\n\n\n为了方便您的理解，这里有一个示例将介绍如何在 Kali Linux x64 系统中安装 Nessus 工具。由于 Kali Linux 是支持\
  \ Debian 的系统，因此此处选择了 `.deb` 格式，并配合 64 位架构包。在下载页面上选择并点击安装包后，会弹出一个接受许可协议的对话框。\n\n\
  ### 3) 点击“I Agree”（我同意）按钮以接受许可协议。此时，安装包将开始下载。如果接下来的几分钟内一切顺利，你就可以安装 Nessus 工具。\n\n\
  执行命令如下：\n\n```bash\nroot@exampleserver:～# dpkg -i Nessus-Versionname-debian6_amd64.deb\n\
  ```\n\n此命令将编译 `.deb` 文件并在系统中启动 Nessus 服务器。然后，你可以在 Linux 终端中输入以下代码启动 Nessus 扫描器：\n\
  \n```bash\n/etc/init.d/nessusd start\n```\n\n然后访问 `https://exampleserver:8834/`\
  \ 根据你的需求配置扫描器。如果一切顺利，你将看到输出信息，表示 Nessus 软件包已安装成功。Nessus 默认安装在 `/opt/nessus` 目录下。从上面的输出信息可以看出，用户可以在浏览器中输入\
  \ `https://exampleserver:8834/` 访问 Nessus 服务并进行漏洞扫描。\n\n记住，你需要将“example server”实例替换为你的系统用户名。\n\
  \n### 4) 启动 Nessus 服务。\n\n安装 Nessus 服务后，它默认是不启动的。因此，如果你想使用此程序进行扫描，必须先启动 Nessus 服务。\n\
  \n执行命令如下：\n\n```bash\nroot@exampleserver:～# /etc/init.d/nessusd start\n```\n\n将显示以下输出：\n\
  \n``````\nStarting Nessus….\n```\n\n看到上述输出信息表示 Nessus 服务已成功启动。\n\n### 5) 激活 Nessus\
  \ 服务\n\n在使用 Nessus 之前，你必须激活该服务才能使用。激活 Nessus 程序需要一个激活码。本节将介绍激活 Nessus 服务的方法。\n\n\
  激活 Nessus 需遵循以下特定步骤：\n\n1. 获取 Nessus 激活码。[点击此处]进入提供 Nessus 激活码的网页。当用户在浏览器中成功访问该地址后，将显示获取激活码的对话框。\n\
  \n2. 点击 Nessus 主页下的“Register Now”按钮，屏幕上将出现必须填写的对话框。\n\n3. 在此对话框中填写获取激活码所需的注册信息，如用户名和邮箱地址。填写完成后，点击“Register”按钮，你将在注册的邮箱箱中收到一封邮件。在输入指定的电子邮箱地址后，你可以在邮件中看到激活码。\n\
  \n4. 在下一步中，用户可以使用激活码激活 Nessus 服务。此时，在浏览器中输入地址 `https://exampleserver:8834/` 或 `https://hostname:8834/`\
  \ 访问 Nessus 服务。成功访问后，界面将显示连接不安全。\n\n**注意：** 访问 Nessus 服务时，使用的是 `https` 协议而非 `http`。\n\
  \n显示此是因为 Nessus 是一个安全链接（使用超文本传输协议），因此在允许登录之前需要添加信任。添加后点击“Advanced”（高级）按钮，将显示风险警告消息。\n\
  \n5. 在分析完提供的现有风险后，点击“Add Exception”（添加异常）按钮，然后会弹出“Add Security Exception”（添加安全异常）对话框。\n\
  \n点击“Confirm Security Exception”（确认安全异常）按钮，将显示“Create Account”（创建账户）对话框以开始利用 Nessus\
  \ 软件功能。\n\n6. 此对话框需要创建一个账户进行管理。在此对话框中创建账户以开始利用 Nessus 软件功能。\n\n7. 在此界面中，你需要输入从邮件中获取的激活码。点击“Next”（下一步）按钮以初始化\
  \ Nessus 服务。\n\n8. 看到上述输出信息，表示 Nessus 软件包已成功安装。由于此过程需要下载大量插件，请耐心等待。初始化完成后，将显示 Nessus\
  \ 界面。\n\n9. 看到此界面表示可以进行登录。\n\n## 接下来？\n\n在接下来的章节我们将讨论配置并使用 Nessus。\n\n# 配置 Nessus\n\
  \n![](img/image49.jpg)\n\n\n\n策略创建成功后，必须创建一个新的扫描任务来执行漏洞扫描。在创建任务时，用户需要选择扫描策略。用户可以选择自己创建的扫描策略，也可以直接使用\
  \ Nessus 自带的扫描策略模板。\n\n创建新扫描任务的操作流程如下：\n\n1) 在 Nessus 菜单栏中，点击 `Scans` 选项卡，显示扫描任务界面。\n\
  2) 点击界面右上角的 `New Scan` 按钮，将显示扫描模板界面。\n3) 此界面显示了一些可用的特定扫描任务模板。此外，你可以在 `User Defined`\
  \ 选项卡下看到用户手动创建策略模板。在这里，你可以选择使用之前创建的策略来创建扫描任务，点击 `User Defined` 选项卡，将显示用户创建的策略模板。\n\
  4) 点击策略模板 `sample`，将显示 `New Scan Task` 对话框。\n5) 在此界面设置扫描任务名称、描述信息、文件夹和扫描目标。设置上述信息后，点击\
  \ `Save` 按钮即可看到新创建的扫描任务。\n6) 从此界面，你可以看到已创建一个名为 `Network Scan` 的新扫描任务。\n\n# 漏洞扫描\n\
  \n在完成上述操作后，Nessus 服务将完成配置。将在下面的部分实现漏洞扫描。这里我们使用之前创建的扫描任务来执行漏洞扫描。\n\n实现漏洞扫描的具体步骤如下：\n\
  \n1) 打开扫描任务界面。\n2) 点击 `run` 按钮开始扫描目标主机。\n3) 从此界面，你可以看到扫描任务的状态为 `(Running)`，表示扫描正在进行。如果你想停止扫描，可以点击\
  \ `Stop` 按钮。如果扫描任务已暂停，点击 `Pause` 按钮。扫描完成后，将显示界面。\n4) 从此界面，你可以看到扫描状态以图标形式显示，这意味着扫描已完成。点击扫描任务名称\
  \ `Network Scan` 可查看扫描结果。\n5) 此界面显示了所有扫描的主机及其漏洞信息。从显示的结果中你可以看到扫描的主机数量为 8 个，漏洞数量为\
  \ 99 个，扫描历史记录为 `1`。从 `Vulnerabilities` 列可以看到，不同级别的漏洞及其数量以不同的颜色显示。\n\n用户将鼠标悬停在每个颜色上也可以看到漏洞的百分比。在右下角，有一个饼图显示了每种漏洞的比例，在饼图右侧显示了每种漏洞的安全级别。\n\
  \n其中，颜色安全级别为：`Critical`（严重，红色）、`High`（高，橙黄色）、`Medium`（中，黄色）、`Low`（低，绿色）、`Info`（信息，蓝色）。在下一节中，用户可以查看并分析每个主机的漏洞信息。\n\
  \n# 分析并导出漏洞扫描报告\n\n用户扫描目标主机后，可以分析扫描结果并获取目标主机的漏洞信息。为了方便用户分析扫描结果，Nessus 支持从扫描结果生成不同格式的报告。其中，Nessus\
  \ 支持的文件格式包括 Nessus、PDF、HTML、CSV 和 Nessus DB。\n\n下面将详细介绍分析和导出漏洞扫描报告的方法。请随之操作！\n\n\
  ## 1. 分析漏洞扫描结果\n\n分析通过扫描软件获得的结果是非常重要的。通过分析和编写报告，你可以向系统管理员或人员完美地展示你的结果。许多渗透测试低估了报告的重要性。但应该记住，一份良好的报告可以使问题或漏洞尽快得到修复。\n\
  \n具体步骤如下：\n\n1. 打开 Nessus 软件的扫描结果界面。\n2. 界面显示所有目标主机的扫描结果。\n\n例如，为了获取主机 `192.168.343.129`\
  \ 漏洞扫描结果的分析，点击打开窗口的目标主机地址 `192.168.343.129`，以显示识别出的所有漏洞。\n\n1. 从界面中你可以找到主机检测到的漏洞数量。\n\
  \n漏洞列表通常包含 4 列：`Sev`（严重程度）、`Name`（插件名称）、`Family`（插件家族）和 `Count`（漏洞数量）。界面右侧的 `Host\
  \ Details` 显示目标主机的基本信息，包括 IP 地址、MAC 地址、操作系统类型和扫描时间。\n\n如果你想查看漏洞的详细信息，点击相应的插件名称查看漏洞的详细信息。\n\
  \n例如，为了查看 `Bind Shell Backdoor Detection` 漏洞的详细信息，将显示该界面。(4) 此界面显示了 `Bind Shell\
  \ Backdoor Detection` 漏洞的描述信息、解决方案、输出信息和开放端口。在右侧的 `Plugin Details` 中显示了漏洞的级别、`ID`、版本、类型和\
  \ `plug-in family`，同时也显示了相关的风险信息。\n\n通过对漏洞的分析，已知该漏洞允许用户远程连接端口并直接执行 `id` 命令。其中，提供的解决方案是确定目标主机是否启用了远程登录，或者重新安装系统。\n\
  \n## 2. 生成扫描报告\n\n用户扫描目标主机后，可以分析扫描结果并获取目标主机的漏洞信息。为了方便用户分析漏洞，可以将扫描结果导出为报告文件。此外，用户还可以将扫描报告导入其他工具（如\
  \ Metasploit）中使用。下面将介绍生成扫描报告的方法。\n\n用例：\n\n将扫描结果导出为 Nessus 格式的报告。\n\n1. 点击扫描结果界面菜单栏中的\
  \ `Export` 下菜单，显示所有格式。\n2. 下拉菜单显示所有可以生成漏洞报告的格式。点击 `Nessus` 命令，弹出保存文件的对话框。\n3. 在此对话框中选择\
  \ `Save File` 单选按钮，然后点击 `OK` 按钮生成报告文件。\n\n\n\n在 Kali Linux 2019 中，默认没有安装 OpenVAS\
  \ 服务。因此，如果你想使用 OpenVAS 服务进行漏洞扫描，需要先安装该服务。此外，在服务成功安装后，还需要对 OpenVAS 库进行初始化。接下来的章节将介绍安装\
  \ `OpenVAS service` 和初始化 `OpenVAS library` 的方法。\n\n## 1) 安装 OpenVAS 服务\n\n由于默认未安装，你需要输入\
  \ Linux 命令来启动该服务，以便使用它进行漏洞扫描。\n\n执行命令如下：\n\n```\nroot@exampleserver:～# apt-get install\
  \ openvas -y\n```\n\n执行上述命令后，系统将检测依赖环境并下载相应的软件包。然后，它将在终端环境中自动下载（此处应为安装）所有下载的包。\n\
  \n如果在安装过程中没有报告错误，则说明 OpenVAS 服务安装成功。如果你遇到任何错误，请检查其在线文档以解决错误。\n\n## 2) 初始化 OpenVAS\
  \ 库\n\n在用户成功安装 OpenVAS 服务后，需要对其进行初始化。在此过程中，OpenVAS 将根据最新的可用性下载许多文件（插件和漏洞数据）。这个过程需要很长时间，用户需要耐心等待。我们建议在此步骤使用高带宽连接。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# openvas-setup\n```\n\n从上面的输出信息中，你可以看到大量文件已经下载，所有库都已更新。此外，在最后，OpenVAS\
  \ 相关服务被顺序启动，并自动生成了默认账户和密码。请记下用户名和密码，以便在使用命令行界面尝试初始化时使用。密码通常是加密的。\n\n提醒：在 Kali Linux\
  \ 2019 中，当所有 OpenVAS 服务成功启动后，浏览器将自动启动并显示 OpenVAS 的登录界面供用户访问。\n\n## 3) 初始化密码\n\n\
  当用户初始化 OpenVAS 服务时，默认会生成一个长字符串密码。这个密码既不容易输入也不容易记忆，显然不符合用户使用通用简单密码的习惯。因此，为了方便起见，你可以使用以下命令快速更改密码。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# openvasmd --user=admin --new-password=\"\
  this-is-my-new-password\"\n```\n\n执行上述命令后，不会显示任何输出。然而，这并不意味着密码没有更改。请再次运行设置命令以检查密码是否已更改。\n\
  \n注意：如果你再次运行 `openvas-setup` 命令，同步时间将非常快，并可以显著提高速度。\n\n## 4) 检查安装的完整性\n\n在某些情况下，使用\
  \ `apt-get` 安装总是会导致各种各样的错误。此时，用户可以使用 `openvas-check-setup` 命令来排查错误。该命令不仅会指出错误位置，还会提示解决方案。\n\
  \n执行命令如下：\n\n```\nroot@exampleserver:～# openvas-check-setup\n```\n\n从上述命令中，你需要了解软件将通过\
  \ 9 个步骤的检查。检查完成后，如果你看到“success prompt”（成功提示）消息，则说明 OpenVAS 安装成功。\n\n## 5) 检查 OpenVAS\
  \ 服务状态\n\n当 OpenVAS 服务初始化后，你就可以访问该服务。为了确保访问 OpenVAS 服务没有问题，请在此检查其状态。用户可以使用 `netstat`\
  \ 命令查看监控端口，并按如下方式判断 OpenVAS 服务是否成功启动。\n\n```\nroot@exampleserver:～# netstat\n```\n\
  \n此命令显示 OpenVAS 服务已经启动。如果你没有看到上述监控程序显示与 OpenVAS 相关的结果，说明服务未启动。\n\n## 6) 设置外部访问\n\
  \n通过检查 OpenVAS 服务的监控状态，我们可以看到服务的默认监控地址为 `127.0.0.1`，这意味着只允许本地主机访问。为了方便使用，用户需要手动配置外部访问。在这里，你需要将\
  \ 3 个配置文件中的监听 IP 从 `127.0.0.1` 修改为 `0.0.0.0`（代表任何 IP）。然后重启 OpenVAS 服务。\n\n具体步骤如下：\n\
  \n1) 修改 `greenbone-security-assistant.service` 配置文件。在该文件中，有两个地方需要修改。第一个是修改 `--listen`\
  \ 和 `--mlisten` 的监听地址。第二个是增加 host header 的主机头地址。\n\n在此，首先将监听地址设置为任何 IP（`0.0.0.0`），如下所示：\n\
  \n```\nroot@exampleserver:～# vi /usr/lib/systemd/system/greenbone-security-assistant.service\n\
  ```\n\n2) 增加 host header 的主机头地址。如果主机增加 host header 的主机地址，外部访问将出现以下错误信息：The request\
  \ contained an unknown or invalid Host header（请求包含未知或无效的 Host header）。如果你正尝试通过主机名或代理访问\
  \ GSA，请确保 GSA 已设置为允许此类访问。\n\n在 `--mlisten=0.0.0.0` 之后添加 `--allow-header-host=IP\
  \ address or domain name`。其中，此机器的 IP 地址为 `192.168.1.132`。\n\n```\nExecStart=/usr/sbin/gsad\
  \ --foreground --listen=0.0.0.0 --mlisten=0.0.0.0 --allow-header-host=192.168.1.132\
  \ --port=9392\n```\n\n3) 修改 `openvas-manager` 配置文件中的监听地址，如下：\n\n```bash\nvi /etc/default/openvas-manager\n\
  MANAGER_ADDRESS=0.0.0.0\n```\n\n4) 修改 `greenbone-security-assistant` 配置文件中的监控地址，如下。注意修改\
  \ `GSA_ADDRESS` 和 `MANAGER_ADDRESS`。\n\n```bash\nvi /etc/default/greenbone-security-assistant\n\
  GSA_ADDRESS=0.0.0.0\n```\n\n5) 重启 OpenVAS 服务。\n\n执行命令如下：\n\n```\nroot@exampleserver:～#\
  \ openvas-stop\nroot@exampleserver:～# openvas-start\n```\n\n执行上述命令后，OpenVAS 服务成功重启。\n\
  \n此时，再次检查监控状态，结果如下：\n\n```\nroot@exampleserver:～# netstat -anputl\n```\n\n# 登录 OpenVAS\
  \ 服务\n\n登录 OpenVAS 服务请仔细遵循以下步骤操作。如果遇到任何错误，请始终记住遵循官方网站上的故障排除指南。\n\n具体步骤如下：\n\n1)\
  \ 在浏览器中输入地址 `https://exampleserver:9392/`（IP 地址为 OpenVAS 服务的地址），以便你访问 OpenVAS 服务。\n\
  \n\n\n\n\n### 登录\n\n2) 此界面显示浏览器中访问的链接不受信赖。这是因为该链接使用了 HTTPS 协议，访问时必须是安全且可靠的。点击 `Advanced`（高级）按钮，将显示您可能面临的风险内容。\n\
  \n3) 此界面显示了访问链接的风险。如果您确认访问的链接没有问题，点击 `Add Exception`（添加异常）按钮，将显示添加安全列表的对话框。\n\n\
  4) 对话框中显示要添加异常的链接信息。此时，点击 `Confirm Security Exception`（确认安全异常）按钮，将显示 `OpenVAS` 服务的登录对话框。\n\
  \n5) 在对话框中输入用户名和密码登录服务。此处的用户名是之前配置 `OpenVAS` 时自动创建的 `admin` 用户，密码为“`this-is-new`”。输入用户名和密码后，点击\
  \ `Login`（登录）按钮，即可显示 OpenVAS 主界面。\n\n6) 如果您看到此界面显示的内容，说明您已成功登录到 OpenVAS 服务。\n\n\
  **注意**：重启系统后，如果想使用 OpenVAS 工具，需要重启服务。否则，您将无法登录服务器。启动服务时发生错误，请使用 `openvas-setup`\
  \ 命令重新同步数据库。输入命令后，所有相关服务将自动启动。\n\n# 新扫描配置\n\n扫描配置用于指定扫描目标所需的插件。当使用 OpenVAS 工具进行扫描时，需要一个扫描任务来完成。然而，扫描任务由扫描配置和目标组成。因此，在执行扫描之前，您必须先创建扫描配置和扫描目标。\n\
  \nOpenVAS 服务默认提供 8 种扫描配置模板，用户可以直接使用。如果提供的配置模板不满足用户需求，用户可以自行创建并指定特定的插件族（plugin family）。\n\
  \n本节将描述如何创建扫描配置。\n\n具体步骤如下：\n\n1) 在菜单栏中，依次选择 `Configuration|Scan Configs`（配置|扫描配置）命令以打开扫描配置界面。\n\
  \n2) 从此界面可以看到默认提供了 8 种扫描配置。点击此界面中的 `New Scan Config`（新建扫描配置）按钮，打开 `New Scan Config`（新建扫描配置）对话框。\n\
  \n3) 在对话框中设置扫描名称。设置为“`initial`”。在 `Base`（基础）选项中选择 `Empty`（空）、`static`（静态）和 `fast`（快速），允许用户从零开始创建自己的配置界面。然后，点击\
  \ `Create`（创建）按钮，将显示编辑扫描配置的界面。\n\n4) 从此界面的 `Family`（族）列，可以看到支持的漏洞扫描插件族。如果您想选择某种类型的插件，只需勾选\
  \ `Select all NVTs`（选择所有 NVT）列中的选框。如果用户想指定某种类型的特定插件，可以点击 `Actions`（操作）列中的 `Edit\
  \ Scan Configuration Plugin Family`（编辑扫描配置插件族）按钮，将显示编辑插件插件族的界面。\n\n5) 在此界面中，可以选择插件族中的特定插件进行扫描。如果您不想使用某个插件，只需取消勾选\
  \ `Selected`（已选）列中的选框。设置完成后，点击 `Save`（保存）按钮，即可显示界面。\n\n6) 从此界面可以看到扫描配置 `initial`\
  \ 已成功创建，总共 49612 个插件中选取了 59 个插件族。\n\n# 新扫描目标\n\n创建扫描配置后，您需要创建一个扫描目标。扫描目标用于指定扫描目标主机的地址、扫描端口和扫描方法。\n\
  \n具体步骤如下：\n\n1) 在菜单栏中选择 `Configuration|Targets`（配置|目标）命令，将显示所示界面。\n\n2) 从此界面可以看到默认未创建目标。点击\
  \ `New Target`（新建目标）按钮，打开创建新目标的对话框。\n\n3) 在对话框中输入目标名称、主机地址和端口列表。指定目标主机地址时，用户可以输入网段、单个地址或用逗号分隔的多个地址。用户还可以将扫描的目标地址保存在文件中，选择\
  \ `From file`（来自文件）格式，并选择目标地址文件。然后点击 `Create`（创建）按钮显示界面。\n\n4) 从此界面可以看到新建的 `Lan\
  \ Scan` 目标。\n\n# 新扫描任务\n\n创建配置和目标后，可以创建一个扫描任务，然后扫描指定的目标。创建扫描任务的方法描述如下。\n\n1) 在菜单栏中选择\
  \ `Scans|Tasks`（扫描|任务）命令，将显示详细信息的界面。\n\n2) 此界面显示 OpenVAS 扫描任务管理的欢迎消息。如果用户不想查看，点击右上角的\
  \ `close`（关闭）按钮。然后将显示扫描任务界面。\n\n3) 从此界面可以看到目前尚未创建任务。然后点击 `New Task`（新建任务）按钮，打开 `New\
  \ Task`（新建任务）对话框。\n\n4) 在对话框中设置任务名称、扫描配置和扫描目标。在这里，您将选择新创建的扫描配置和扫描目标，其他选项使用默认设置。然后点击\
  \ `Create`（创建）按钮，您将看到新创建的任务。\n\n5) 从此界面可以看到新建的 `Lan Scan` 任务，状态为 `New`（新建）。接下来，扫描任务将启动并扫描目标。\n\
  \n# 漏洞扫描\n\n通过前面的配置，OpenVAS 服务已就绪。接下来扫描漏洞。以下将以之前创建的扫描任务为例实施扫描。\n\n具体步骤如下：\n\n1)\
  \ 打开扫描任务界面。\n\n2) 点击 `Actions` 栏中的 `Start`（开始）按钮。\n\n3) 从此界面的 `Status`（状态）列可以看到当前已扫描了\
  \ 66%。如果用户想停止扫描，可以点击 `Actions` 列中的 `Stop`（停止）按钮。扫描完成后，状态将从 `New` 变为 `Done`。\n\n\
  4) 从此界面的 `Status` 列可以看到状态已显示为 `Done`，表示扫描已完成。接下来，您可以分析扫描结果获取目标主机的漏洞信息。\n\n**提醒**：通常用户启动扫描后，会发现扫描速度很慢，状态栏几乎没有变化。实际上，目标一直在扫描。由于这是浏览器显示的内容，用户需要手动刷新页面。\n\
  \n用户也可以设置为每分钟自动刷新一次。OpenVAS 默认是不自动刷新，下面将其修改为自动刷新。OpenVAS 默认提供 4 种自动刷新时间。用户点击图中下拉按钮，将展开可设置的自动刷新时间下拉菜单。用户可以选择任何方法，以便在任何时间看到扫描状态的变化。\n\
  \n分析漏洞扫描报告\n\n\n\n\n\n# 中间人攻击\n\n中间人攻击（MITM）是一种网络攻击，攻击者通过拦截并可能篡改两个认为他们正在直接通信的方之间的通信来实现目的。\n\
  \n## 中间人攻击的工作原理\n\n一旦建立了中间人攻击，攻击者就可以查看并捕获在双方之间传输的所有所有数据。这可能包括密码、信用卡号和私信消息等敏感信息。攻击者还可以在数据发送给接收者之前对其进行修改，这可能导致严重的后果。\n\
  \n## 常见的中间人攻击类型\n\n中间人攻击有几种类型，包括：\n\n-   **ARP 欺骗**：攻击者在局域网上发送伪造的 ARP 消息，将自己的 MAC\
  \ 地址与另一个合法服务器的 IP 地址绑定。\n- ** **DNS 欺骗**：攻击者通过破坏 DNS 缓存或 DNS 服务器，将用户重定向到恶意网站。\n\
  -   **会话劫持**：攻击者接管用户与服务器之间的活动会话。\n-   **Wi-Fi 嗅探**：攻击者在不安全的 Wi-Fi 网络上截获数据。\n\n##\
  \ 如何防止中间人攻击\n\n为了保护自己免受中间人攻击，请考虑以下安全措施：\n\n-   **使用 HTTPS**：确保你访问的网站使用 `https://`\
  \ 来加密浏览器与服务器之间的通信。\n-   **使用 VPN**：虚拟专用网络（VPN）为你的流量创建一个加密隧道，这在公共 Wi-Fi 上特别有用。\n\
  -   **避免使用公共 Wi-Fi**：避免在不安全的公共 Wi-Fi 网络上进行银行交易等敏感操作。\n-   **多因素身份验证 (MFA)**：MFA\
  \ 增加了一层额外的安全性，使攻击者更难访问你的账户。\n-   **保持软件更新**：定期更新操作系统和应用程序，以修复攻击者可能利用的漏洞。\n\n\n\n\
  \n从输出信息可以看出，攻击主机的 IP 地址为 `192.168.29.134`，MAC 地址为 `00:0c:29:79:95:9e`。\n\n接下来，按照如下方式检查其\
  \ ARP 缓存表：￼\n\n```\nroot@exampleserver:～# arp\n```\n\n从输出信息中，我们可以看到攻击主机只有一个网关 ARP\
  \ 记录。此外，网关的 MAC 地址为 `00:50:56:f1:40:cb`。\n\n### 3) 检查目标主机的 IP 地址和 ARP 缓存表。\n\n首先按照如下方式检查目标主机的\
  \ IP 地址：￼\n\n```\nroot@exampleserver:～# ifconfig\n```\n\n从输出信息可以看出，目标主机的 IP 地址为\
  \ `192.168.29.135`，MAC 地址为 `00:0c:29:6c:5d:69`。\n\n接下来，按照如下方式检查 ARP 缓存表：￼\n\n```\n\
  root@exampleserver:～# arp\n```\n\n从输出信息中可以看出，也只有一个绑定到网关的 ARP 条目。通过查看地址信息可以确定攻击主机尚未与目标主机通信过。此时，只要这两个主机进行通信，它们就会请求对方的\
  \ IP 和 MAC 地址。此时，就可以对它们实施 ARP 攻击。\n\n### 4) 对目标主机实施 ARP 攻击。\n\n执行命令如下：￼\n\n```\n\
  root@exampleserver:～# arpspoof -i eth0 -t\n```\n\n从输出信息可以看出，攻击主机正在向目标主机发送 ARP 响应包，告诉目标主机网关的\
  \ MAC 地址为 `00:c:29:79:95:9e`（攻击主机的 MAC 地址）。然而，网关的 MAC 地址实际上 `00:50:56:f1:40:cb`。这表明目标主机已开始被\
  \ ARP 欺骗。\n\n### 5) 对网关实施 ARP 攻击。\n\n执行命令如下：￼\n\n```\nroot@exampleserver:～# arpspoof\
  \ -i eth0 -t\n```\n\n从输出信息可以看出，攻击主机正在向网关发送 ARP 响应包，告诉网关目标主机的 MAC 地址为 `00:c:29:79:95:9e`（攻击主机的\
  \ MAC 地址）。然而，目标主机的实际 MAC 地址为 `00:0c:29:6c:5d:69`。这说明网关已实施 ARP 欺骗。\n\n**提醒**：用户可以使用一个命令同时对目标主机和网关进行\
  \ ARP 攻击。\n\n执行命令如下：￼\n\n```\nroot@exampleserver:～# arpspoof -i eth0 -t 192.168.29.135\
  \ -r\n```\n\n从输出信息可以看出，攻击主机向目标主机和网关发送了 ARP 响应包，告诉网关和目标主机它们的 MAC 地址均为 `00:c:29:79:95:9e`。\n\
  \n### 6) 按照如下方式检查目标主机的 ARP 缓存表：￼\n\n```\nroot@exampleserver:～# arp\n```\n\n从输出信息中，你可以看到主机有两个\
  \ ARP 记录（网关和攻击主机的 ARP 条目）。从显示的 ARP 条目可以看出，网关和攻击主机的 MAC 地址是相同的。这表明目标主机已成功被 ARP 欺骗。\n\
  \n## 2) 使用 Ettercap 工具\n\nEttercap 是一种基于 ARP 地址欺骗的网络嗅探工具，主要适用于交换机局域网。本节将介绍使用 `Ettercap`\
  \ 工具实施中间人攻击的方法。\n\n具体步骤如下：\n\n### 1) 启动 Ettercap 工具。\n\n执行命令如下：￼\n\n```\nroot@exampleserver:～#\
