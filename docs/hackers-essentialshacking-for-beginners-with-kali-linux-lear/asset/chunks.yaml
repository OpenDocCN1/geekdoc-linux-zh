    驱动程序是添加到操作系统的特殊程序。驱动程序包含有关硬件设备的信息。这些信息使得计算机能够与相应的设备通信。当硬件设备添加到计算机时，必须安装相应的驱动程序。否则，设备将无法使用。


    对于 Kali Linux 系统，由于系统内核较新，它可以支持大多数设备驱动程序。然而，对于某些设备，用户有时需要手动安装驱动程序，例如显卡驱动。本节将介绍如何查看设备驱动信息以及安装驱动。


    提示：由于安装驱动程序存在风险，建议在安装之前备份重要数据。


    # 查看设备


    在安装驱动程序之前，用户可以使用 `lsusb` 和 `lspci` 命令查看 USB 或 PCI 设备的详细信息，以确定驱动是否正确。如果已成功启动，则需要安装驱动程序。以下将介绍如何检查设备是否被正确驱动。


    ### a) 查看 USB 设备


    当用户执行无线渗透测试时，通常需要使用带有 USB 接口的无线网卡。当用户将设备连接到系统时，可以使用 `lsusb` 命令查看 USB 设备列表信息，确定设备是否被正确识别，如下：


    ```

    root@exampleserver:～# lsusb

    ```


    上述输出信息显示了当前系统中的 USB 设备列表信息。该输出包含 3 部分，即总线号、设备号和厂商 ID。通过分析设备的厂商 ID 信息，可以知道该设备是型号为
    Realtek Semiconductor Corp. 的 USB 设备。


    用户可以使用 `lsusb` 命令的 `-v` 选项检查设备的驱动模块，以确认驱动程序是否正确。以下将介绍如何使用 `lsusb` 命令查看 USB 设备的详细信息。


    执行命令如下：


    ```

    root@exampleserver:～# lsusb -v Bus

    ```


    执行上述命令后，将输出大量信息。由于空间限制，仅简要列出了第一个 USB 设备的详细信息。从输出信息中，你可以看到设备的厂商 ID 和产品 ID 信息。这说明设备已正确加载了驱动程序。如果没有驱动，你将无法看到类似的信息。


    ### b) 查看 PCI 设备


    PCI（外围组件互连，外围组件互连标准）是目前个人计算机中最广泛使用的接口规范，几乎所有主板产品都有此规格的插槽。PCI 设备是指连接到这些 PCI 插槽的设备，例如声卡、网卡和显卡。Kali
    Linux 提供了一个名为 `lspci` 的命令来查看系统中的 PCI 设备列表。


    执行命令如下：


    ```

    root@exampleserver:～# lspci

    ```


    上述输出信息显示了当前系统中所有的 PCI 设备信息。从输出信息中，我们可以看到主板芯片、接口插槽、显卡和网卡等 PCI 设备。


    用户可以使用 `lspci` 命令的 `-v` 选项查看 PCI 设备的驱动模块，然后确认设备是否被正确驱动。


    执行命令如下：


    ```

    root@exampleserver:～# lspci -v

    ```


    通过此界面，你可以看到获取的 PCI 设备的详细信息。从显示的信息中，你可以看到每个 PCI 设备的驱动信息。例如，当前系统使用的显卡驱动为 `vmwgfx`。


    ### c) 虚拟机使用 USB 设备


    当用户执行无线渗透测试时，必须使用无线网卡。然而，通常情况下，系统内置的无线网卡芯片不支持无线监控。因此，用户必须使用带有 USB 接口的无线网卡来实现这一目标。


    如果是物理机，用户可以直接将 USB 设备插入主机。如果是虚拟机，用户需要手动连接。此外，你必须启动虚拟机的 USB 服务（VMware USB Arbitration
    Service）。否则，连接的 USB 设备将无法被识别。


    以下章节将以 USB 无线网卡为例，介绍在虚拟机中使用 USB 设备的方法。


    具体步骤如下：


    #### 1) 虚拟机的 USB 服务。


    右键点击桌面上的“计算机”图标，在弹出菜单中选择 `管理` | `服务和应用程序` | `服务` 命令以打开服务管理器。


    #### 2) VMware USB Arbitration Service。


    在列表中找到 `VMware USB Arbitration Service` 并确保它已启动。


    #### 3) 连接 USB 设备。


    将 USB 无线网卡插入主机，并使用虚拟机接口连接设备。


    #### 4) 验证连接。


    检查设备在虚拟机中是否被正确识别。

