    # New scan configuration


    The scan configuration is used to specify the plug-ins that are required to scan
    the target. When scanning with the OpenVAS tool, a scanning task is required to
    achieve. However, the scan task is composed of a scan configuration and a target.
    Therefore, before implementing a scan, you must first create a scan configuration
    and scan target.


    The OpenVAS service provides 8 scan configuration templates by default, which
    users can use directly. If the provided configuration template does not meet the
    needs of the user, the user can create it by himself and specify a specific plug-in
    family.


    The following section describes how to create a scan configuration.


    The specific steps are as follows:


    1) In the menu bar, select the Configuration|Scan Configs command in turn to open
    the scan configuration interface. ￼


    2) It can be seen from this interface that 8 scan configurations are provided
    by default. Click the New Scan Config button in this interface to open the New
    Scan Config dialog box.


    3) Set the name of the scan in this dialog box. Here it is set to “initial”. Select
    the Empty, static and fast radio button in the Base option to allow users to start
    from scratch and create their own configuration interface. Then, click the Create
    button, and the edit scan configuration interface will be displayed. ￼


    4) From the Family column of this interface, you can see the supported vulnerability
    scanning plug-in families. If you want to select a certain type of plug-in, just
    select the check box in the Select all NVTs column. If the user wants to specify
    a specific plug-in of a certain type of plug-in, he can click the (Edit Scan Configuration
    Plug-in Family) button in the Actions column, and the interface for editing the
    scan configuration plug-in family will be displayed. ￼


    5) In this interface, you can select specific plug-ins in the plug-in family to
    perform scanning. If you don’t want to use a certain plugin, just uncheck the
    checkbox in the Selected column. After setting, click the Save button and the
    interface will be displayed. ￼


    6) It can be seen from this interface that the scan configuration “initial” has
    been successfully created, 59 plugin families have been selected out of a total
    of 49612 plugins.


    # New scan target


    After creating a scan configuration, you need to create a scan target. Scan target
    is used to specify the address, scan port and scan method of the scan target host.


    The specific steps are as follows:


    1) Select the Configuration|Targets command in the menu bar in turn, the interface
    shown will be displayed. ￼


    2) From this interface, you can see that no targets are created by default. Click
    the New Target button , the dialog box for creating a new target will open.


    3) Enter the target name, host address and port list in this dialog box. When
    specifying the target host address, the user can enter a network segment, a single
    address or multiple addresses, separated by commas. The user can also save the
    scanned target address in a file, select the From file format, and select the
    file of the target address. Then click the Create button to show an interface.
    ￼


    4) From this interface, you can see the newly created Lan Scan target.


    # New scan task


    After the scan configuration and target are created, you can create a scan task,
    and then scan the specified target. The method to create a scan task is described
    below.


    The specific steps are as follows:


    1) Select the Scans|Tasks command in the menu bar, and the interface with details
    will be displayed. ￼


    2) This interface displays the welcome message of OpenVAS scanning task management.
    If the user does not want to view it, click the close button in the upper right
    corner. Then, the scan task interface will be displayed. ￼


    3) It can be seen from this interface that no task has been created currently.
