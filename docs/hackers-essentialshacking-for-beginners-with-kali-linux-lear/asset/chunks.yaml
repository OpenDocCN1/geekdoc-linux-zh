    \ as `.Net` framework, `Visual C++2008`, etc.\n"
  raw: 'The syntax format of using Nmap to identify the service version is as follows:


    nmap -sV [host]


    The option -sV in the above syntax means to implement service version detection.


    Use-case scenario:


    Identify all open services and versions on the target host 192.243.176.84.


    The execution command is as follows:


    root@exampleserver:～# nmap -sV 192.243.176.84


    The identified service-related information can be seen from the output information.
    The output information includes 4 columns, namely PORT (port), STATE (state),
    SERVICE (service) and VERSION (version). By analysing each column of information,
    you can obtain relevant information about the corresponding service. For example,
    the service corresponding to TCP port 21 is FTP, and the version is FileZilla
    ftpd. You can also see from the penultimate line that the host name of the target
    host is TEST-PC, and the operating system type is Windows.


    # Using Amap Tool


    Amap is a set of penetration testing tools for identifying network services, including
    two tools, amap and amapcrap. Among them, the amap tool is used to try to identify
    applications running on unusual ports whereas the amapcrap tool identifies applications
    based on non-ASCII encoding by sending trigger packets and finding the response
    in the response string list.


    The following section will introduce the use of Amap tools to identify service
    information.


    1) Use the amapcrap tool


    The amapcrap tool can send random data to UDP, TCP or SSL ports to obtain illegal
    response information. The obtained information will be written to the appdefs.trig
    and appdefs.resp files to facilitate the next step of Amap detection.


    The syntax format of using this tool to identify service information is as follows:


    amapcrap -n -m <0ab> [host][port] -v


    Here -V stands for the verbose mode.


    Use-case scenario:


    Use the amapcrap tool to probe port 90 applications.


    The execution command is as follows:


    root@exampleserver:～# amapcrap -n 20-ma 192.198.153.84 90 -v


    From the displayed results, we can understand that the acquired information is
    written into the appdefs.trig and appdefs.resp trigger files. When users use the
    Amap tool to identify services, these two files will be used to obtain information.


    2) Use the amap tool


    The amap tool can try to identify some applications running on abnormal ports.


    The syntax format of using this tool to identify service information is as follows:


    amap -bqv [host][port]


    Use-case scenario:


    Use the amap tool to scan the port 80 service on the target host 192.243.176.84.


    The execution command is as follows:


    root@exampleserver:～# amap -bqv 192.243.176.84 80


    From the output information, you can understand that the service matching port
    80 is http or http-apache2\. From the displayed identification information, it
    can be seen that the web service running on the target host is Apache and the
    version is 2.2.8\. In the first 3 lines of output, you can see that the amap tool
    uses two trigger files and a response file. Among them, the file names are appdefs.trig,
    appdefs.resp and appdefs.rpc.


    # Collect service information


    Some special services can provide additional information. For example, SMB service
    can provide file system structure whereas SNMP service can provide target host
    related information. This section will explain how to use these services to collect
    valuable information for your pen testing information collection about the target.


    SMB Service


    SMB (Server Message Block) is an IBM protocol used to share files, printers, serial
    ports, etc. between computers. The SMB protocol can work on top of the TCP/IP
    protocol, or on other network protocols (such as NetBEUI). By obtaining the shared
    folder information of the SMB service, you can understand the file system structure
    of the target host. The following section will introduce the shared folder information
    for using the smbclient tool to access the SMB service.


    smbclient is a client tool for SMB service that can be used to access shared files
    in SMB service.


    The grammatical format of the smbclient tool is as follows:


    root@exampleserver : smbclient -L -U <username></username>


    The options and meanings in the above grammar are as follows: · -L: Used to specify
    the SMB server address. · -U: Used to specify the user name for logging in to
    the SMB service.


    Use-Case scenario:


    Access the SMB service in the Linux system.


    The execution command is as follows:


    smbclient -L 192.243.176.84 -U root Enter WORKGROUP\root''s password:


    Entering the password of the SMB service user login will display the information
    that needs a lot of analysis.


    From the output information, you can see the files shared in the target SMB. Among
    them, Sharename represents the name of the shared file, Type represents the type
    of hard disk, and Comment is the description of the shared file. It can be explained
    that the operating system type of the target host is Linux, and the shared file
    is the Linux file system type.


    If the operating system of the target host is Windows, the file name column will
    display the drive letter of the shared folder.


    root@exampleserver:～# smbclient -L 192.243.176.84-U


    As can be seen from the file name of the above output result, the default shared
    disks are C disk and E disk. Only in the Windows system, folders are divided into
    disks in the form of drive letters. It can be judged that the shared folder is
    of the Windows system type.


    SNMP Service


    SNMP (Simple Network Management Protocol) is composed of a set of network management
    standards, including an application layer protocol and a set of resource objects.
    This protocol is used by the network management system to monitor any situation
    on the network equipment that deserves the attention of the administrator. By
    using this service, host information can be obtained. The following section will
    introduce the use of snmpcheck tool to obtain host information.


    The snmpcheck tool can be used to enumerate SNMP devices to obtain target host
    information.


    The syntax format of the tool is as follows:


    snmp-check [target]


    Use-case scenario:


    Use snmp-check tool to obtain 192.243.176.84 host information through SNMP protocol.


    The execution command is as follows:


    root@exampleserver:～# snmp-check 192.243.176.84


    When the connection is successful, the system information of the host can be obtained.


    Due to the large amount of output information that comes with the above command,
    each part will be important to understand. Follow along!


    1) We can obtain system information, such as host name, operating system type
    and architecture.


    2) We can obtain user account information.


    3) Can obtain network information, such as TTL value, TCP segment and data element.


    4) Can obtain network interface information, such as interface status, speed,
    IP address, and subnet mask.


    5) Can obtain network IP information.


    6) Can obtain routing information, such as destination address, next hop address,
    subnet mask and path length value.


    7) Can obtain the monitored TCP port.


    8) Can obtain monitoring UDP port information. For example, the monitored UDP
    ports can be 123, 154, 6300, 300 and 5322.


    9) We can obtain network service information, such as distributed component object
    model service, DHCP client, and DNS client.


    10) We can obtain process information, such as process ID, process name, and process
    type.


    11)We can obtain storage information, such as device ID, device type, and file
    system type.


    12) Can obtain file system information, such as index, mount point, remote mount
    point, and access permissions.


    13) Can obtain device information, such as device ID number, type, and status.


    14) Can Obtain software component information, such as .Net framework, Visual
    C++2008, etc.


    What Next?'
