    the attack.


    ## Web Attack Vector


    Web attack vectors will deliberately construct web pages that are credible and
    attractive to the target. When the target user visits the webpage, the target
    user''s information can be stolen. The social engineering attack toolkit can clone
    a web page that looks exactly the same as the actual running trusted site, which
    makes the victim think they are browsing a legitimate site. The following section
    will introduce the method of using social engineering to implement Web attack
    vectors.


    ### Use SET to implement Web attack vectors


    The specific steps are as follows:


    1) Start the social engineering toolkit and select social engineering attacks.


    The execution command is as follows:


    ```

    root@exampleserver:～# setoolkit

    ```


    Select from the menu:


    1) Spear-Phishing Attack Vectors

    2) Website Attack Vectors


    ```

    set> 1

    ```


    The above information shows the menu options for attacking social engineering.
    At this point, the user can select the corresponding attack type, and then implement
    the attack.


    2) Select the web attack vector, so input the number as `2`, and the following
    information will be displayed:


    ```

    set> 2

    ```


    The `Web Attack` module is a unique way of utilizing multiple web-based attacks
    exploitation through the browser.


    1) Java Applet Attack Method

    2) Metasploit Browser Exploit Method


    The above menu bar shows the web attack vector methods that can be implemented,
    and describes the role of various attack methods in detail.


    3) Select the certificate to obtain the attack method, so enter the number `3`,
    and the following information will be displayed:


    ```

    set:webattack> 3

    ```


    The first method will allow `SET` to import a list of pre-defined web applications
    that it can utilize within the attack. The second method will completely clone
    a website of your choosing and allow you to utilize the attack vectors within
    the completely same web application you were attempting to clone. The third method
    allows you to import your own website, note that you should only have an `index.html`
    when using the import website functionality.


    1) Web Templates

    2) Site Cloner

    3) Custom Import

    99) Return to Webattack Menu


    The above output information shows how to create a Web site.


    4) Users can choose different methods according to their needs. For convenience,
    choose to use the Web template provided by `SET`.


    Therefore, enter the number `1`, and the following information will be displayed:


    ```

    set:webattack>1 [192.168.29.129]: 192.168.29.139

    ```


    At this point, specify the IP address to obtain the information submitted by the
    target user, that is, the address of the attacking host `Kali`.


    After entering the above address, the following information will be displayed:


    1. Java Required

    2. Google

    3. Twitter


    ```

    set:webattack> Select a template:

    ```


    The above output information shows several templates provided by `SET` by default,
    including `Java Required`, `Google` and `Twitter`.


    5) The `Google` site template is selected here, so enter the number `2`, and the
    following information will be displayed:


    ```

    set:webattack> Select a template:2

    ```


    ## B) Use Ettercap to launch an ARP attack


    1) Start the `dns_spoof` plugin to implement DNS spoofing.


    The execution command is as follows:


    ```

    root@exampleserver:～# ettercap -Tq -M arp:remote -P dns_spoof /192.168.29.139//
    /192.168.29.2//

    ```


    2) Seeing the information output above indicates that DNS spoofing has been successfully
    implemented. At this point, when the target host visits any web page, it will
    be tricked into the pseudo page created by the attacking host (`192.168.29.139`),
    that is, the cloned site.


    3) Assuming that the target user will visit `Google`. Click `http://www.google.com`,
    the page shown will be displayed.


    4) It can be seen that the page accessed is to log in to the `Google` server,
    but the URL requested in the address bar is still `http://www.google.com/`. At
    this time, when the target user enters the login information to log in to the
    `Google` server, the login information will be captured by the attacking host,
    and the captured information will be displayed on the terminal. as follows:


    ```

    192.168.29.135--[18/Apr/2019 16:17:51]

    ```


    As you can see from the above output information, the generated files are saved
    in the `/root/.set//reports/` directory by default. At this point, press Enter
    to continueOperation will return to the `SET` menu option interface.


    ## PowerShell attack vector


    The PowerShell attack vector can create a PowerShell file. When the user sends
    the created PowerShell file to the target, and the target user executes the file,
    a reverse remote connection will be obtained. This section will introduce methods
    to implement PowerShell attack vectors.


    1) Launch a social engineering attack.


    The execution command is as follows:


    ```

    root@exampleserver:～# setoolkit

    ```


    2) Select social engineering attack and enter the number `1`.


    The execution command is as follows:


    ```

    set> 1

    ```


    3) Select the `Powershell attack vector and enter the number `9`.


    ```

    set> 9

    ```


    4) The above output information shows the configuration information of the attacking
    host. At this point, the attack payload has been successfully launched, waiting
    for the target host to connect. After the above settings are completed, a penetration
    attack code file will be created in the `/root/.set/reports/powershell/` directory.
    The file is a text file and its file name is `x86_powershell_injection.txt`.


    5) At this time, open a terminal window to view the content of the infiltration
    file, as follows:


    ```

    root@exampleserver:～# cd /root/.set/reports/powershell/

    ```


    The above information isThe content in the `x86_powershell_injection.txt` file.
    As can be seen from the first line, the file is to run the powershell command.
    If the target host runs this code, it will open a remote session with the Kali
    host.


    6) At this time, you can copy the content in `x86_powershell_injection.txt` file
    to the DOS of the target host (Windows 7) and run the script content. Or, copy
    the file directly to the target host and change the file extension to `.bat`.
    Then, double-click the file to run the script.


    After the execution is successful, the Kali host will display the following information:


    ```

    msf5 exploit(multi/handler)> sessions -i 1

    ```


    As you can see in the above code, the command line prompt is displayed as `meterpreter`,
    indicating that the Meterpreter session has been successfully started. Next, users
    can use the commands supported in `Meterpreter` to obtain more information about
    the target host.


    ## What Next?


    With this, we have completed a brief introduction to social engineering toolkit.
    In the next chapter, we will capture network data using reliable tools. Follow
    along!


