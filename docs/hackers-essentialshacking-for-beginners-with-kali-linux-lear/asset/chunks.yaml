    ```bash

    root@exampleserver:～# cd /root/.msf4/modules/exploits/

    root@exampleserver:exploits## cp webtest.rb .

    ```


    3) Restart the Metasploit tool to see the loaded penetration test attack module.


    ```bash

    root@exampleserver:～# msfconsole

    msf5>

    ```


    From the information displayed above, we can see the exploit class module has
