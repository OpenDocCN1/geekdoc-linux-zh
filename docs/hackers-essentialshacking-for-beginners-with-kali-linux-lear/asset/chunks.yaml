    # Chapter 17


    ## Understanding Vulnerabilities


    ![](image_rsrc49Y.jpg)


    You might have often heard about the word vulnerability. In 2018, when a Ransomware
    attack happened people searching for the word “vulnerability” increased tremendously.
    Even though it is a popular word among developers and tech enthusiasts still 80%
    of the people who are using technology in every day life are unaware of vulnerabilities
    and their impact in the day-to-day life. As a hacker, understanding the importance
    of vulnerabilities is your primary motto. This chapter introduces you to vulnerabilities
    in detail explanation. Follow along!


    # What are vulnerabilities?


    Vulner generally refer to various defects in the target system. Scanning for vulnerabilities
    is a way to verify the possible defects of the target system. Once a loophole
    is discovered, it can effectively be used to attack the target host and prove
    its harmfulness by using different exploitation techniques. Therefore, scanning
    for vulnerabilities is an important part of implementing penetration testing and
    is henceforth declared as a mandatory skill for pen testers. Since there maybe
    possibility for thousands of vulnerabilities, the manual scanning procedure is
    very boring. To counter this problem, you can use some convenient tools to implement,
    such as `Nessus` and `OpenVAS`.


    ### Overview of a vulnerability


    Vulnerabilities are defects in the specific implementation of hardware, software,
    and protocols or system security policies, which can enable an attacker to access
    or destroy the system without allowed authorisation.


    For example, a significant logic error in Intel Pentium chips made that the ARP
    protocol does not detect the authenticity of packets. So, when the target administrator
    sets up an anonymous FTP service, improper configuration issues may be used by
    attackers, threatening the security of the system. This is only a small example
    for your understanding, Everyday tens of vulnerabilities are made available for
    security researches in different websites all around the web.

